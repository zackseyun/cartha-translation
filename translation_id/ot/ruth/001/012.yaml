id: RUT.1.12
reference: Ruth 1:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שֹׁ֤בְנָה בְנֹתַ/י֙ לֵ֔כְןָ כִּ֥י זָקַ֖נְתִּי מִ/הְי֣וֹת לְ/אִ֑ישׁ כִּ֤י אָמַ֨רְתִּי֙ יֶשׁ לִ֣/י תִקְוָ֔ה גַּ֣ם הָיִ֤יתִי הַ/לַּ֨יְלָה֙ לְ/אִ֔ישׁ וְ/גַ֖ם יָלַ֥דְתִּי בָנִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/012.yaml
  text: Turn back[a], my daughters; go on, for I am too old to belong to a husband. Even if I were to say[b], ‘There is still hope for me’—even if I were with a husband tonight and even bore sons—
translation:
  language: id
  text: Pulanglah, anak-anakku; pergilah, sebab aku sudah terlalu tua untuk bersuami.[a] Sekalipun aku berkata, ‘Masih ada harapan bagiku’[b]—sekalipun malam ini aku bersuami dan bahkan melahirkan anak-anak lelaki—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, ungkapan Ibraninya kira-kira berarti “untuk menjadi bagi seorang laki-laki/suami”; dapat juga diterjemahkan “untuk mempunyai suami” atau “untuk menikah.”
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani menyajikan rangkaian pengandaian: “Sebab, jika aku berkata, ‘Ada harapan bagiku,’ bahkan jika malam ini aku bersuami dan juga melahirkan anak-anak lelaki—”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁבְנָה
  choice: Pulanglah
  rationale: Imperatif feminin jamak dari שוב. Dalam konteks ini Naomi menyuruh Rut dan Orpa kembali ke tempat asal mereka; 'pulanglah' menyampaikan arah kembali secara alami dalam bahasa Indonesia.
- source_word: בְנֹתַי
  choice: anak-anakku
  rationale: Sapaan kekeluargaan dan penuh kasih kepada kedua menantunya. Bentuk ini alami, bermartabat, dan tidak mengaburkankan kedekatan relasi mereka.
- source_word: לֵכְןָ
  choice: pergilah
  rationale: Imperatif feminin jamak kedua. 'Pergilah' mempertahankan perintah tersendiri sesudah ajakan untuk pulang.
- source_word: זָקַנְתִּי
  choice: aku sudah terlalu tua
  rationale: Bentuk perfektif menyatakan keadaan kini sebagai hasil proses menjadi tua; 'terlalu tua' mengungkapkan implikasi kontekstual bahwa Naomi tidak lagi menganggap perkawinan sebagai harapan realistis.
- source_word: מִהְיוֹת לְאִישׁ
  choice: untuk bersuami
  rationale: Ungkapan harfiahnya kira-kira 'untuk menjadi bagi seorang laki-laki/suami.' 'Bersuami' merupakan padanan Indonesia yang alami dan mempertahankan keadaan relasional tanpa menentukan lebih jauh proses pernikahannya.
- source_word: כִּי אָמַרְתִּי
  choice: Sekalipun aku berkata
  rationale: כִּי di sini membuka rangkaian pengandaian. 'Sekalipun' menyampaikan sifat hipotetis dan semakin tidak mungkin dari argumen Naomi.
- source_word: יֶשׁ לִי תִקְוָה
  choice: Masih ada harapan bagiku
  rationale: Mempertahankan konstruksi eksistensial יֶשׁ dan daya retoris bahwa Naomi sedang membayangkan adanya harapan yang tersisa.
- source_word: גַּם הָיִיתִי הַלַּיְלָה לְאִישׁ
  choice: sekalipun malam ini aku bersuami
  rationale: Menyampaikan skenario hipotetis berupa hubungan perkawinan secepat mungkin dan mempertahankan penekanan temporal 'malam ini' tanpa menambahkan rincian upacara yang tidak dinyatakan.
- source_word: וְגַם יָלַדְתִּי בָנִים
  choice: dan bahkan melahirkan anak-anak lelaki
  rationale: ילד menunjuk pada melahirkan, sedangkan בָנִים secara khusus berarti anak-anak lelaki; 'bahkan' mempertahankan eskalasi pengandaian.
theological_decisions:
- issue: Bahasa khusus laki-laki bagi keturunan dalam konteks kelanjutan keluarga
  choice: anak-anak lelaki
  alternative: anak-anak
  rationale: Teks Ibrani secara eksplisit memakai בָנִים. Alur argumentasi Naomi berkenaan dengan calon anak lelaki yang kelak dapat menjadi suami bagi Rut dan Orpa, sehingga unsur gender tidak dinetralkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada akrab namun bermartabat. Pronomina 'aku' sesuai dengan tuturan langsung dalam hubungan keluarga. Tanda pisah pada akhir ayat dipertahankan karena kalimat pengandaian berlanjut ke ayat berikutnya.
