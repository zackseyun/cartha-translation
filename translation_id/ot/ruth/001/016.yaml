base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/016.yaml
  text: But Ruth said[a], “Do not press me to leave you, to turn back from following after you. For where you go, I will go; and where you lodge, I will lodge. Your people will be my people[d][c][b], and your God my God.”
translation:
  language: id
  text: Namun Rut berkata, “Janganlah mendesak aku untuk meninggalkan engkau dan berbalik sehingga tidak lagi mengikutimu. Sebab ke mana engkau pergi, aku pun akan pergi, dan di mana engkau bermalam, aku pun akan bermalam. Bangsamu adalah bangsaku, dan Allahmu adalah Allahku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּפְגְּעִי בִי
  choice: mendesak aku
  rationale: Dalam konstruksi dengan ב, פגע dapat berarti mendesak atau memohon dengan sangat. “Mendesak aku” alami dalam bahasa Indonesia dan sesuai dengan permintaan Rut agar Naomi berhenti membujuknya untuk pulang.
- source_word: לְעָזְבֵךְ
  choice: meninggalkan engkau
  rationale: עזב di sini berarti meninggalkan. Pilihan ini lugas dan tidak menambahkan nuansa pengkhianatan yang mungkin tersirat dalam “menelantarkan” atau “mencampakkan”.
- source_word: לָשׁוּב מֵאַחֲרָיִךְ
  choice: berbalik sehingga tidak lagi mengikutimu
  rationale: Ungkapan harfiahnya adalah “berbalik dari belakangmu.” Terjemahan ini mempertahankan gagasan berbalik dan berhenti mengikuti Naomi tanpa menghasilkan ungkapan Indonesia yang janggal.
- source_word: כִּי
  choice: Sebab
  rationale: כִּי memperkenalkan alasan bagi permintaan Rut; “sebab” mempertahankan hubungan logis dan sesuai dengan ragam bahasa yang bermartabat.
- source_word: אֶל אֲשֶׁר תֵּלְכִי אֵלֵךְ
  choice: ke mana engkau pergi, aku pun akan pergi
  rationale: Konstruksi relatif ini menyatakan tujuan atau arah. “Ke mana” tepat, sementara “pun” menegaskan kesejajaran tindakan Rut dengan tindakan Naomi.
- source_word: וּבַאֲשֶׁר תָּלִינִי אָלִין
  choice: di mana engkau bermalam, aku pun akan bermalam
  rationale: לון terutama menunjuk pada bermalam atau melewatkan malam. “Bermalam” lebih tepat daripada “tinggal” dan tetap alami dalam bahasa Indonesia.
- source_word: עַמֵּךְ עַמִּי
  choice: Bangsamu adalah bangsaku
  rationale: Klausa Ibrani tidak memakai kopula dan dapat dipahami dalam nuansa kini atau sebagai ikrar berorientasi masa depan. Bentuk kini dalam bahasa Indonesia ringkas, kuat, dan tidak memaksakan penandaan waktu yang tidak dinyatakan sumber.
- source_word: וֵאלֹהַיִךְ אֱלֹהָי
  choice: dan Allahmu adalah Allahku
  rationale: Klausa tanpa kopula diterjemahkan secara sejajar dengan klausa sebelumnya. Bentuk אֱלֹהָי dengan sufiks orang pertama tunggal bermakna “Allahku” dalam konteks pengakuan Rut kepada Allah yang disembah Naomi.
theological_decisions:
- issue: Nuansa waktu dalam dua klausa identifikasi tanpa kopula
  choice: 'Menerjemahkan keduanya dengan kopula kini: “Bangsamu adalah bangsaku, dan Allahmu adalah Allahku.”'
  alternative: “Bangsamu akan menjadi bangsaku, dan Allahmu akan menjadi Allahku.”
  rationale: Bahasa Ibrani tidak menyatakan kopula maupun waktu secara eksplisit. Bentuk kini mempertahankan kekompakan pengakuan Rut dan tidak menutup kemungkinan bahwa ucapan ini berfungsi sebagai ikrar yang berlaku ke depan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti “engkau” dipakai untuk mempertahankan nada sastra dalam percakapan pribadi. Paralelisme “pergi ... pergi” dan “bermalam ... bermalam” dipertahankan.
