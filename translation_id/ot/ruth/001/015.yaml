source:
  edition: WLC
  text: וַ/תֹּ֗אמֶר הִנֵּה֙ שָׁ֣בָה יְבִמְתֵּ֔/ךְ אֶל עַמָּ֖/הּ וְ/אֶל אֱלֹהֶ֑י/הָ שׁ֖וּבִי אַחֲרֵ֥י יְבִמְתֵּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/015.yaml
  text: And she said[a], “Look, your sister-in-law has gone back to her people and to her gods[b]. Go back after your sister-in-law.”
translation:
  language: id
  text: Lalu Naomi berkata, “Lihat, iparmu telah kembali kepada bangsanya dan kepada dewa-dewinya.[a] Kembalilah mengikuti iparmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “allah-allahnya”; bentuk Ibrani ini juga dapat dipahami “allahnya,” tetapi bentuk jamak kemungkinan besar menunjuk kepada dewa-dewi Moab.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Lalu Naomi berkata
  rationale: Wayyiqtol naratif memperkenalkan ucapan. Nama Naomi diperjelas dari konteks agar rujukan pronomina alami dalam bahasa Indonesia tanpa mengubah makna.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Partikel deiktis ini menarik perhatian Rut kepada tindakan Orpa; 'Lihat' modern dan tetap mempertahankan daya serunya.
- source_word: שָׁבָה / שׁוּבִי
  choice: telah kembali / Kembalilah
  rationale: Akar שׁוב sengaja diterjemahkan dengan akar Indonesia yang sama untuk mempertahankan pengulangan antara tindakan Orpa dan perintah Naomi kepada Rut.
- source_word: יְבִמְתֵּךְ
  choice: iparmu
  rationale: Dalam konteks ini menunjuk kepada sesama menantu perempuan dalam keluarga Naomi. 'Iparmu' merupakan padanan Indonesia yang ringkas, alami, dan diulangi secara konsisten.
- source_word: אֶל עַמָּהּ
  choice: kepada bangsanya
  rationale: עַם di sini menunjuk kepada komunitas etnis Orpa, bukan hanya keluarga dekat; 'bangsanya' menyampaikan cakupan tersebut secara jelas.
- source_word: וְאֶל אֱלֹהֶיהָ
  choice: dan kepada dewa-dewinya
  rationale: Bentuk tersebut paling mungkin merujuk secara jamak kepada ilah-ilah Moab. 'Dewa-dewi' merupakan ungkapan Indonesia yang wajar untuk deitas politeistis dan tidak menyiratkan Allah Israel.
- source_word: אַחֲרֵי
  choice: mengikuti
  rationale: Preposisi ini menggambarkan Rut mengikuti langkah atau jalan yang ditempuh Orpa; bentuk verbal 'mengikuti' lebih alami daripada terjemahan harfiah 'sesudah' dalam perintah Indonesia.
theological_decisions:
- issue: Makna אֱלֹהֶיהָ dalam konteks ibadah Moab
  choice: dewa-dewinya
  alternative: allahnya / dewanya
  rationale: Walaupun אֱלֹהִים kadang dapat bermakna tunggal, konteks kepulangan kepada identitas dan peribadatan Moab paling mendukung rujukan jamak kepada deitas Moab. Terjemahan ini tidak menyamakan objek ibadah tersebut dengan TUHAN.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan שׁוב dipertahankan melalui 'kembali'; hubungan keluarga dinyatakan dengan istilah umum 'ipar'. Penanda catatan kaki [a] ditempatkan tepat setelah frasa yang dijelaskan.
