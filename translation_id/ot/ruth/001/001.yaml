id: RUT.1.1
reference: Ruth 1:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ/ימֵי֙ שְׁפֹ֣ט הַ/שֹּׁפְטִ֔ים וַ/יְהִ֥י רָעָ֖ב בָּ/אָ֑רֶץ וַ/יֵּ֨לֶךְ אִ֜ישׁ מִ/בֵּ֧ית לֶ֣חֶם יְהוּדָ֗ה לָ/גוּר֙ בִּ/שְׂדֵ֣י מוֹאָ֔ב ה֥וּא וְ/אִשְׁתּ֖/וֹ וּ/שְׁנֵ֥י בָנָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/001.yaml
  text: It happened in the days when the judges judged that there was a famine in the land[c][b][a], and a man went from Bethlehem of Judah to sojourn in the fields of Moab—he and his wife and his two sons.
translation:
  language: id
  text: Pada zaman para hakim memerintah[a], terjadi kelaparan di negeri itu. Seorang laki-laki pergi dari Betlehem di Yehuda untuk tinggal sebagai pendatang[b] di wilayah Moab[c], bersama istri dan kedua anak laki-lakinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketika para hakim menghakimi.” Bahasa Ibrani mengulang akar kata yang sama; secara harfiah, “ketika para hakim menghakimi.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan ini menunjukkan bahwa ia tinggal sebagai pendatang atau orang asing; ungkapan ini dapat mengandung nuansa tinggal sementara, tetapi tidak dengan sendirinya berarti menetap secara permanen.
    reason: cultural_note
  - marker: c
    text: Secara harfiah, “di ladang-ladang Moab”; ungkapan ini juga dapat berarti “di daerah” atau “di negeri Moab.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: terjadilah
  rationale: Bentuk naratif dari היה memperkenalkan kejadian dalam kisah. Dalam bahasa Indonesia, "terjadilah" mempertahankan fungsi pembuka naratif tanpa memakai ungkapan kuno.
- source_word: בִּימֵי שְׁפֹט הַשֹּׁפְטִים
  choice: Pada zaman para hakim memerintah
  rationale: Ungkapan waktu בִּימֵי diterjemahkan secara alami sebagai "pada zaman". Kata "memerintah" menyampaikan fungsi luas para hakim dalam periode tersebut; pengulangan akar שׁפט dijelaskan dalam catatan kaki.
- source_word: רָעָב
  choice: kelaparan
  rationale: Menunjukkan kekurangan pangan berat yang melanda suatu wilayah; "kelaparan" merupakan padanan Indonesia yang tepat dan lazim.
- source_word: בָּאָרֶץ
  choice: di negeri itu
  rationale: Artikel tentu pada הָאָרֶץ menunjuk kepada negeri yang menjadi latar kisah, kemungkinan wilayah Yehuda/Israel. "Negeri itu" alami dalam narasi Indonesia tanpa menentukan cakupan lebih jauh daripada teks.
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Mempertahankan acuan maskulin tunggal kepada tokoh yang kemudian dikenal sebagai Elimelekh.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: dari Betlehem di Yehuda
  rationale: Ungkapan ini membedakan Betlehem tersebut berdasarkan letaknya di Yehuda. "Di Yehuda" lebih alami dan jelas dalam bahasa Indonesia.
- source_word: לָגוּר
  choice: untuk tinggal sementara
  rationale: גור menyiratkan menetap sebagai pendatang, sering kali untuk sementara, bukan berpindah secara permanen. Pilihan ini menyampaikan unsur sementara dalam bahasa Indonesia modern.
- source_word: בִּשְׂדֵי מוֹאָב
  choice: di wilayah Moab
  rationale: Bentuk jamak שְׂדֵי secara harfiah berarti "ladang-ladang", tetapi dalam konteks geografis dapat menunjuk wilayah atau negeri Moab. "Wilayah Moab" menghindari kesan bahwa keluarga itu hanya tinggal di lahan pertanian, sementara bentuk harfiahnya dicatat.
- source_word: הוּא וְאִשְׁתּוֹ וּשְׁנֵי בָנָיו
  choice: bersama istri dan kedua anak laki-lakinya
  rationale: Menyampaikan semua anggota keluarga yang menyertainya. "Kedua" secara alami menyatakan jumlah dua yang tentu dalam bahasa Indonesia.
theological_decisions:
- issue: Lingkup tugas para hakim dalam שְׁפֹט הַשֹּׁפְטִים
  choice: para hakim memerintah
  alternative: para hakim menghakimi
  rationale: Akar שׁפט dapat mencakup mengadili sekaligus memimpin atau memerintah. Teks utama memakai ungkapan Indonesia yang alami dan cukup luas, sedangkan alternatif yang mempertahankan pengulangan akar dicatat tanpa membatasi peran mereka hanya pada peradilan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Susunan kalimat dibuat alami tanpa menghilangkan latar zaman para hakim, beratnya kelaparan, sifat sementara dari perpindahan, atau nuansa geografis ungkapan Ibrani.
