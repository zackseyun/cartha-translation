base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/002.yaml
  text: The man's name was Elimelech[a], and his wife's name was Naomi, and the names of his two sons were Mahlon and Chilion. They were Ephrathites from Bethlehem in Judah[c][b]. They came to the fields of Moab and were there.
translation:
  language: id
  text: Nama orang itu adalah Elimelekh, dan nama istrinya Naomi, sedangkan nama kedua anak laki-lakinya adalah Mahlon dan Kilyon.[a] Mereka adalah orang Efrata dari Betlehem di Yehuda. Mereka tiba di daerah Moab[b] dan berada di sana.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Kilyon juga dapat ditransliterasikan Khilyon.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “ladang-ladang Moab”; dapat juga berarti “wilayah Moab” atau “negeri Moab”.'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “dan mereka berada di sana”; dapat juga diterjemahkan “dan menetap di sana”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם הָאִישׁ
  choice: Nama orang itu
  rationale: Mempertahankan formula penamaan Ibrani dalam susunan yang alami dan jelas dalam bahasa Indonesia.
- source_word: אֱלִימֶלֶךְ
  choice: Elimelekh
  rationale: Nama diri ditransliterasikan dengan kh untuk mencerminkan konsonan akhir Ibrani כ secara lebih tepat dan tetap mudah dibaca.
- source_word: אִשְׁתּוֹ
  choice: istrinya
  rationale: Bentuk posesif diterjemahkan secara langsung dan wajar.
- source_word: נָעֳמִי
  choice: Naomi
  rationale: Mengikuti bentuk nama yang telah mapan dalam bahasa Indonesia.
- source_word: שְׁנֵי בָנָיו
  choice: kedua anak laki-lakinya
  rationale: Menunjukkan secara jelas bahwa yang dimaksud adalah dua putra, sambil memakai ungkapan Indonesia yang alami.
- source_word: מַחְלוֹן וְכִלְיוֹן
  choice: Mahlon dan Kilyon
  rationale: Nama-nama ditransliterasikan; Kilyon mencerminkan כִלְיוֹן dan sesuai dengan pola ejaan Indonesia.
- source_word: אֶפְרָתִים
  choice: orang Efrata
  rationale: Gentilik ini menunjuk orang-orang yang terkait dengan Efrata, bukan suku Efraim. Bentuk ini lebih mudah dipahami daripada transliterasi teknis.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: dari Betlehem di Yehuda
  rationale: Menunjukkan Betlehem yang terletak di wilayah Yehuda dengan bahasa Indonesia modern.
- source_word: וַיָּבֹאוּ
  choice: Mereka tiba
  rationale: Dalam konteks perjalanan, verba בוא menyatakan sampainya mereka di tujuan; 'tiba' alami dalam narasi Indonesia.
- source_word: שְׂדֵי מוֹאָב
  choice: daerah Moab
  rationale: Bentuk jamak 'ladang-ladang Moab' secara idiomatis dapat menunjuk kawasan atau wilayah Moab. Terjemahan utama menyampaikan arti geografis, sedangkan bentuk harfiah dicatat.
- source_word: וַיִּהְיוּ שָׁם
  choice: dan tinggal di sana
  rationale: Secara harfiah berarti 'dan mereka berada di sana'; dalam alur narasi ungkapan ini menyatakan keberadaan atau menetapnya mereka di tempat itu tanpa menentukan lamanya.
