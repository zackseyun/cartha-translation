base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/009.yaml
  text: May Yahweh grant that you find rest[a], each of you in the house of her husband." Then she kissed them, and they lifted up their voices and wept.
translation:
  language: id
  text: Kiranya Yahweh mengaruniakan ketenteraman kepada kalian, masing-masing di rumah suaminya.” Lalu Naomi mencium mereka, dan mereka mengangkat suara lalu menangis.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִתֵּן יְהוָה
  choice: Kiranya Yahweh mengaruniakan
  rationale: Bentuk ini menyampaikan nuansa doa atau berkat secara alami dan tetap mempertahankan nama ilahi.
- source_word: וּמְצֶאןָ מְנוּחָה
  choice: kepada kalian tempat tenteram
  rationale: Dalam konstruksi ini, Tuhan dimohon mengaruniakan keadaan atau tempat kehidupan yang tenang dan terjamin. 'Tempat tenteram' mempertahankan gagasan perhentian sekaligus terdengar alami dalam konteks rumah tangga.
- source_word: אִשָּׁה בֵּית אִישָׁהּ
  choice: masing-masing di rumah suaminya
  rationale: Kata אִשָּׁה berfungsi distributif bagi kedua perempuan; 'masing-masing' menjelaskan hal itu tanpa menambah gagasan yang tidak terdapat dalam teks.
- source_word: וַתִּשַּׁק לָהֶן
  choice: Lalu Naomi mencium mereka
  rationale: Subjek tersirat adalah Naomi dari konteks sebelumnya; penyebutan namanya menjernihkan rujukan dalam bahasa Indonesia.
- source_word: וַתִּשֶּׂאנָה קוֹלָן וַתִּבְכֶּינָה
  choice: mereka pun menangis dengan suara nyaring
  rationale: Ungkapan Ibrani harfiah 'mengangkat suara mereka dan menangis' merupakan idiom ratapan keras; terjemahan ini menyampaikan maknanya secara wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks menyebut Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Struktur berkat dibuat alami, sedangkan konteks keamanan melalui pernikahan dijelaskan dalam catatan kaki tanpa mempersempit arti kata Ibrani di teks utama.
