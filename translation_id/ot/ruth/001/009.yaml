  to: Kiranya Yahweh mengaruniakan ketenteraman kepada kalian, masing-masing di rumah suaminya.” Lalu Naomi mencium mereka, dan mereka mengangkat suara lalu menangis.
  rationale: Revisi mengganti “tempat tenteram” dengan “ketenteraman” agar arti keadaan yang terkandung dalam מְנוּחָה tidak berubah menjadi lokasi. Susunan berkat tetap menyatakan bahwa Yahweh adalah pemberi ketenteraman itu, dengan penerapan distributif “masing-masing di rumah suaminya.” Ungkapan ratapan diterjemahkan lebih dekat kepada dua verba Ibrani tanpa kehilangan kelancaran bahasa Indonesia.
