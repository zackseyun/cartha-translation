  text: וַ/יָּמ֥וּתוּ גַם שְׁנֵי/הֶ֖ם מַחְל֣וֹן וְ/כִלְי֑וֹן וַ/תִּשָּׁאֵר֙ הָֽ/אִשָּׁ֔ה מִ/שְּׁנֵ֥י יְלָדֶ֖י/הָ וּ/מֵ/אִישָֽׁ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/005.yaml
  text: Then both of them also died[a], Mahlon and Chilion, and the woman was left without her two children and without her husband.
translation:
  language: id
  text: Lalu keduanya pun meninggal, yaitu Mahlon dan Kilyon; tinggallah perempuan itu tanpa kedua anaknya[a] dan tanpa suaminya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: kedua putranya. Kata Ibrani yang digunakan berarti “anak-anak” dan dapat merujuk pada keturunan secara umum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמ֥וּתוּ
  choice: Lalu ... meninggal
  rationale: Bentuk wayyiqtol dari מוּת melanjutkan rangkaian peristiwa dalam narasi. “Lalu” menyatakan urutan, sedangkan “meninggal” merupakan ungkapan Indonesia yang alami dan bermartabat.
- source_word: גַם
  choice: pun
  rationale: Partikel “pun” menyampaikan bahwa kematian kedua anak itu menambah kehilangan yang telah disebut sebelumnya.
- source_word: שְׁנֵי/הֶם
  choice: keduanya
  rationale: Mempertahankan penekanan bahwa kedua orang tersebut meninggal.
- source_word: מַחְלוֹן וְ/כִלְיוֹן
  choice: Mahlon dan Kilyon
  rationale: Nama diri ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia; כ pada nama kedua direpresentasikan dengan “k”.
- source_word: וַ/תִּשָּׁאֵר
  choice: tinggallah
  rationale: Bentuk dari שׁאר berarti tetap tinggal atau tertinggal. Dalam konteks dukacita ini, konstruksi “tinggallah perempuan itu tanpa ...” secara alami menggambarkan keadaannya sesudah kehilangan keluarganya tanpa menambahkan pelaku.
- source_word: הָֽ/אִשָּׁ֔ה
  choice: perempuan itu
  rationale: Teks Ibrani menyebutnya “perempuan itu”, bukan dengan nama Naomi atau sebutan “istri”; pilihan ini mempertahankan sudut pandang narator.
- source_word: מִ/שְּׁנֵ֥י יְלָדֶ֖י/הָ
  choice: tanpa kedua anaknya
  rationale: Dengan שׁאר, preposisi מִן menyatakan keterpisahan atau kehilangan. יְלָדִים secara leksikal berarti anak-anak atau keturunan, meskipun dalam konteks ini mereka adalah dua putranya yang telah dewasa.
- source_word: וּ/מֵ/אִישָֽׁ/הּ
  choice: dan tanpa suaminya
  rationale: אִישׁ dengan sufiks posesif di sini berarti “suaminya”. Preposisi yang diulangi meneruskan gagasan kehilangan, sehingga “tanpa” merupakan padanan Indonesia yang alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan “tinggallah perempuan itu” mempertahankan nuansa naratif dan keadaan kehilangan, sedangkan tanda titik koma menjaga kesatuan kalimat sumber tanpa menghasilkan kalimat Indonesia yang berbelit.
