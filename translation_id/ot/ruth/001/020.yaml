  text: וַ/תֹּ֣אמֶר אֲלֵי/הֶ֔ן אַל תִּקְרֶ֥אנָה לִ֖/י נָעֳמִ֑י קְרֶ֤אןָ לִ/י֙ מָרָ֔א כִּי הֵמַ֥ר שַׁדַּ֛י לִ֖/י מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/020.yaml
  text: But she said to them[a], “Do not call me Naomi; call me Mara, for the Almighty has made me very bitter.”
translation:
  language: id
  text: Namun, ia berkata kepada mereka, “Jangan panggil aku Naomi; panggillah aku Mara[a], sebab Yang Mahakuasa telah memperlakukan aku dengan sangat pahit.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Naomi berarti “menyenangkan”, sedangkan Mara berarti “pahit”.
    reason: Menjelaskan permainan makna antara kedua nama yang tersirat dalam bahasa Ibrani tetapi tidak tampak dalam transliterasi Indonesia.
lexical_decisions:
- source_word: וַתֹּאמֶר אֲלֵיהֶן
  choice: Namun, ia berkata kepada mereka
  rationale: Waw-konsekutif melanjutkan narasi, sementara konteks menunjukkan tanggapan korektif Naomi; “Namun” mengungkapkan kontras itu secara alami. Sufiks feminin jamak pada אֲלֵיהֶן merujuk kepada para perempuan Betlehem, dan “mereka” cukup jelas dalam konteks.
- source_word: אַל תִּקְרֶאנָה לִי נָעֳמִי
  choice: Jangan panggil aku Naomi
  rationale: קרא dengan nama sebagai pelengkap berarti memanggil atau menyebut seseorang dengan nama tertentu. Bentuk feminin jamak pada verba menyapa para perempuan, tetapi bahasa Indonesia tidak perlu menandainya.
- source_word: קְרֶאןָ לִי מָרָא
  choice: panggillah aku Mara
  rationale: Pengulangan “panggil” mempertahankan kesejajaran dan pertentangan retoris antara kedua nama. מָרָא ditransliterasikan sebagai nama, sedangkan maknanya dijelaskan dalam catatan kaki.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan Naomi meminta perubahan sebutan; “sebab” alami dan sesuai dengan ragam bahasa yang bermartabat.
- source_word: הֵמַר ... לִי מְאֹד
  choice: telah membuat hidupku sangat pahit
  rationale: Bentuk Hifil הֵמַר menyatakan membuat pahit. Penambahan “hidupku” membuat idiomnya alami dalam bahasa Indonesia sekaligus mempertahankan hubungan leksikal dengan Mara, tanpa menyatakan bahwa Allah secara harfiah mengubah sifat Naomi menjadi pahit.
- source_word: שַׁדַּי
  choice: Yang Mahakuasa
  rationale: Gelar ilahi ini diterjemahkan menurut maknanya dengan bentuk baku dan mudah dipahami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan gelar ilahi שַׁדַּי
  choice: Yang Mahakuasa
  alternative: Shaddai
  rationale: Dalam ayat ini שַׁדַּי berfungsi sebagai gelar ilahi. Menerjemahkannya menjaga makna bagi pembaca umum, sedangkan transliterasi “Shaddai” kurang transparan.
- issue: Pelaku kepahitan yang dialami Naomi
  choice: Yang Mahakuasa telah membuat hidupku sangat pahit
  alternative: Yang Mahakuasa telah memperlakukan aku dengan sangat pahit
  rationale: Pilihan ini mempertahankan pernyataan Naomi bahwa Allah adalah pelaku, serta hubungan kata antara הֵמַר dan nama Mara. Ungkapan “hidupku” mencegah salah pengertian bahwa watak Naomi sendiri dijadikan pahit, tetapi tidak mengurangi ketegangan teologis dalam keluhannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Ia” dipakai untuk narasi, bentuk “panggillah” mempertahankan daya imperatif, dan catatan kaki menjelaskan permainan nama tanpa memasukkan tafsiran denominasi.
