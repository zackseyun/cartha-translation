source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר נָעֳמִי֙ לִ/שְׁתֵּ֣י כַלֹּתֶ֔י/הָ לֵ֣כְנָה שֹּׁ֔בְנָה אִשָּׁ֖ה לְ/בֵ֣ית אִמָּ֑/הּ יעשה יְהוָ֤ה עִמָּ/כֶם֙ חֶ֔סֶד כַּ/אֲשֶׁ֧ר עֲשִׂיתֶ֛ם עִם הַ/מֵּתִ֖ים וְ/עִמָּדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/008.yaml
  text: And Naomi said to her two daughters-in-law[a], “Go, return, each to her mother’s house. May Yahweh show you kindness, as you have shown it to the dead and to me.”
translation:
  language: id
  text: Lalu Naomi berkata kepada kedua menantunya, “Pergilah, pulanglah, masing-masing ke rumah ibunya. Kiranya Yahweh menunjukkan kasih setia[a] kepada kalian, sebagaimana kalian telah menunjukkan kasih setia kepada mereka yang telah meninggal dan kepadaku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “kebaikan hati”, “kasih yang teguh”, atau “kesetiaan dalam ikatan perjanjian” (Ibrani: hesed).'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַלֹּתֶיהָ
  choice: kedua menantunya
  rationale: Dalam konteks ini כַּלָּה berarti istri anak laki-laki. Kata “menantu” adalah padanan Indonesia yang alami; jumlah dua dinyatakan secara eksplisit.
- source_word: לֵכְנָה שֹּׁבְנָה
  choice: Pergilah, pulanglah
  rationale: Kedua bentuk perintah dipertahankan untuk menjaga desakan dan penekanan dalam bahasa Ibrani, tanpa meleburkannya menjadi satu perintah.
- source_word: אִשָּׁה לְבֵית אִמָּהּ
  choice: masing-masing ke rumah ibunya
  rationale: אִשָּׁה berfungsi distributif, yakni masing-masing perempuan. Ungkapan khusus “rumah ibunya” dipertahankan dan tidak digeneralisasi menjadi rumah keluarga.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: חֶסֶד
  choice: kasih setia
  rationale: חֶסֶד memadukan kebaikan penuh kasih dengan unsur keteguhan dan kesetiaan. “Kasih setia” cukup alami dalam bahasa Indonesia dan menjaga keluasan maknanya; kemungkinan nuansa lain dicatat dalam catatan kaki.
- source_word: עֲשִׂיתֶם עִם הַמֵּתִים וְעִמָּדִי
  choice: sebagaimana kalian telah menunjukkan kasih setia kepada mereka yang telah meninggal dan kepadaku
  rationale: Kata kerja עשה bersama חֶסֶד secara idiomatis menyatakan tindakan menunjukkan kasih setia. “Mereka yang telah meninggal” mempertahankan bentuk jamak tanpa menentukan identitas mereka lebih jauh daripada teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi YHWH secara langsung. Bentuk “Yahweh” mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan gelar.
- issue: Cakupan makna חֶסֶד
  choice: kasih setia
  alternative: kebaikan hati; kasih yang teguh; kesetiaan dalam ikatan perjanjian
  rationale: Pilihan ini mempertahankan ketegangan antara kemurahan hati dan kesetiaan yang melekat pada חֶסֶד, tanpa membatasi konteks ini secara eksklusif pada kategori perjanjian formal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Bentuk jamak “kalian” digunakan karena Naomi berbicara kepada dua orang. Pengulangan “menunjukkan kasih setia” menjaga hubungan antarklausa yang tersirat dalam bahasa sumber.
