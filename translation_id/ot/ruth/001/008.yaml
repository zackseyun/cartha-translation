  terminology: “Kedua menantunya,” “rumah ibunya,” “Yahweh,” dan “kasih setia” merupakan pilihan yang tepat dan konsisten. Catatan kaki pada “kasih setia” ditempatkan pada istilah yang relevan dan menyajikan alternatif leksikal tanpa memaksakan penafsiran teologis tertentu.
