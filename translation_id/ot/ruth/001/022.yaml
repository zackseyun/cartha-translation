  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תָּ֣שָׁב נָעֳמִ֗י וְ/ר֨וּת הַ/מּוֹאֲבִיָּ֤ה כַלָּתָ/הּ֙ עִמָּ֔/הּ הַ/שָּׁ֖בָה מִ/שְּׂדֵ֣י מוֹאָ֑ב וְ/הֵ֗מָּה בָּ֚אוּ בֵּ֣ית לֶ֔חֶם בִּ/תְחִלַּ֖ת קְצִ֥יר שְׂעֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/022.yaml
  text: So Naomi returned[a], and Ruth the Moabite, her daughter-in-law, with her, who returned from the fields of Moab. And they came to Bethlehem at the beginning of the barley harvest.
translation:
  language: id
  text: Demikianlah Naomi pulang bersama Rut, perempuan Moab, menantu perempuannya, yang kembali dari daerah Moab. Mereka tiba di Betlehem pada awal musim panen jelai.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּשָׁב
  choice: pulang
  rationale: Kata שׁוב menyatakan kembali ke tempat asal; dalam konteks Naomi kembali ke Betlehem, 'pulang' paling alami dalam bahasa Indonesia.
- source_word: הַמּוֹאֲבִיָּה
  choice: perempuan Moab
  rationale: Mempertahankan penanda asal-usul etnis Rut secara jelas dan alami; bentuk feminin dinyatakan dengan 'perempuan'.
- source_word: כַלָּתָהּ
  choice: yang menjadi menantunya
  rationale: כַלָּה berarti menantu perempuan; karena Rut baru saja disebut sebagai perempuan, 'menantunya' sudah jelas dan lebih alami.
- source_word: עִמָּהּ
  choice: bersama
  rationale: Mengungkapkan bahwa Rut menyertai Naomi tanpa mengulang pronomina yang terasa kaku dalam bahasa Indonesia.
- source_word: הַשָּׁבָה
  choice: yang kembali
  rationale: Mempertahankan bentuk partisipial feminin dan rujukannya yang paling dekat, yaitu Rut, tanpa menghilangkan pengulangan kata שׁוב.
- source_word: מִשְּׂדֵי מוֹאָב
  choice: dari daerah Moab
  rationale: Bentuk jamak שְׂדֵי secara harfiah berarti 'ladang-ladang', tetapi dalam ungkapan geografis ini dapat menunjuk wilayah atau daerah Moab; 'daerah Moab' menyampaikan makna idiomatis dengan wajar.
- source_word: וְהֵמָּה בָּאוּ
  choice: Mereka tiba
  rationale: Pronomina mandiri memberi penegasan ringan; 'mereka' mempertahankannya, sedangkan 'tiba' lebih alami daripada 'datang' ketika tujuan Betlehem disebutkan.
- source_word: בֵּית לֶחֶם
  choice: Betlehem
  rationale: Menggunakan bentuk nama tempat yang baku dalam bahasa Indonesia.
- source_word: בִּתְחִלַּת
  choice: pada awal
  rationale: Padanan temporal yang ringkas dan alami untuk 'pada permulaan'.
- source_word: קְצִיר שְׂעֹרִים
  choice: musim panen jelai
  rationale: Rangkaian konstruksi berarti panen jelai; 'musim panen' memperjelas bahwa yang dimaksud ialah masa panen, dan 'jelai' merupakan padanan Indonesia untuk barley.
theological_decisions:
- issue: Rujukan הַשָּׁבָה ('yang kembali')
  choice: Dipertahankan sebagai klausa yang secara tata bahasa menerangkan Rut
  alternative: Menafsirkannya sebagai keterangan bagi Naomi dan Rut bersama-sama, atau menghapusnya sebagai pengulangan
  rationale: Bentuk feminin tunggal paling wajar merujuk kepada Rut, nomina feminin tunggal yang langsung mendahuluinya. Pengulangan itu dipertahankan karena menonjolkan bahwa Rut juga disebut 'kembali', meskipun ia berasal dari Moab.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dibaca. Susunan kalimat dilancarkan tanpa menghapus pengulangan penting dari akar שׁוב. Tidak ada penanda catatan kaki karena tidak diperlukan dalam teks Indonesia ini.
