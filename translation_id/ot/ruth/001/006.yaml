  text: וַ/תָּ֤קָם הִיא֙ וְ/כַלֹּתֶ֔י/הָ וַ/תָּ֖שָׁב מִ/שְּׂדֵ֣י מוֹאָ֑ב כִּ֤י שָֽׁמְעָה֙ בִּ/שְׂדֵ֣ה מוֹאָ֔ב כִּֽי פָקַ֤ד יְהוָה֙ אֶת עַמּ֔/וֹ לָ/תֵ֥ת לָ/הֶ֖ם לָֽחֶם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/001/006.yaml
  text: Then she arose with her daughters-in-law and returned from the fields of Moab[a], because in the field of Moab she had heard that Yahweh had visited his people to give them food.
translation:
  language: id
  text: Lalu ia bangkit bersama menantu-menantunya dan pulang dari daerah Moab, sebab ketika masih di Moab ia telah mendengar bahwa Yahweh memperhatikan umat-Nya dengan memberi mereka makanan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “roti”; kata Ibrani leḥem dapat berarti roti secara khusus atau makanan secara umum.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: Lalu ia bangkit
  rationale: Bentuk wayyiqtol menandai kelanjutan alur cerita. “Lalu” menyatakan urutan naratif, sedangkan “bangkit” mempertahankan gambaran tindakan mulai bergerak dalam bahasa yang bermartabat.
- source_word: וְכַלֹּתֶיהָ
  choice: bersama kedua menantunya
  rationale: Konjungsi di sini secara idiomatis menyatakan penyertaan. “Kedua” dijelaskan oleh konteks dekat, yaitu Orpa dan Rut, dan “menantu” dalam konteks ini merujuk kepada menantu perempuan.
- source_word: וַתָּשָׁב
  choice: dan pulang
  rationale: שׁוב berarti kembali atau berbalik. “Pulang” alami dalam bahasa Indonesia karena Naomi bergerak kembali ke negeri asalnya, tanpa menambahkan rincian yang tidak terdapat dalam verba itu.
- source_word: מִשְּׂדֵי מוֹאָב
  choice: dari daerah Moab
  rationale: Bentuk jamak שׂדי dapat menunjuk pada kawasan atau wilayah terbuka suatu negeri. “Daerah Moab” menyampaikan fungsi geografisnya secara alami; terjemahan harfiah “ladang-ladang Moab” dapat memberi kesan sejumlah petak pertanian tertentu.
- source_word: כִּי שָׁמְעָה
  choice: sebab ... ia telah mendengar
  rationale: כִּי memperkenalkan alasan kepulangannya, dan bentuk qatal שָׁמְעָה menyatakan informasi yang telah diterimanya sebelum tindakan tersebut.
- source_word: בִּשְׂדֵה מוֹאָב
  choice: ketika masih di Moab
  rationale: Ungkapan ini secara kontekstual menunjukkan tempat Naomi mendengar kabar tersebut. Rumusan temporal-lokatif ini alami dalam bahasa Indonesia dan menghindari kesan keliru bahwa ia berada di satu ladang tertentu.
- source_word: פָּקַד
  choice: memperhatikan
  rationale: Dalam konteks ini פקד menyatakan perhatian Yahweh yang diwujudkan dalam tindakan yang menguntungkan umat-Nya. “Memperhatikan” mempertahankan gagasan kepedulian aktif tanpa menentukan secara berlebihan cara intervensi-Nya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap terlihat.
- source_word: עַמּוֹ
  choice: umat-Nya
  rationale: עם dengan akhiran posesif dalam konteks relasi Yahweh dengan Israel paling alami diterjemahkan “umat-Nya”, yang mempertahankan nuansa komunal dan relasional.
- source_word: לָתֵת לָהֶם לָחֶם
  choice: dengan memberi mereka makanan
  rationale: Infinitif לָתֵת menjelaskan bagaimana perhatian Yahweh diwujudkan. לֶחֶם dapat berarti roti secara khusus atau makanan secara lebih luas; dalam konteks berakhirnya kelaparan, “makanan” menyampaikan maksud umum dengan jelas.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama tersebut dan merupakan rekonstruksi pelafalan yang luas diterima, sedangkan “TUHAN” menggantinya dengan gelar.
- issue: Makna tindakan Yahweh dalam פקד
  choice: memperhatikan umat-Nya
  alternative: melawat umat-Nya atau datang menolong umat-Nya
  rationale: Konteks menunjukkan perhatian yang menguntungkan dan nyata melalui pemberian makanan. “Memperhatikan” menjaga keluasan makna verba; “datang menolong” lebih eksplisit, sedangkan “melawat” dalam bahasa Indonesia modern mudah dipahami sekadar sebagai kunjungan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum. “Daerah Moab” dipilih daripada “ladang-ladang Moab”, dan pengulangan berikutnya disampaikan sebagai “ketika masih di Moab” agar fungsi geografis ungkapan Ibrani jelas. Penanda catatan kaki ditempatkan setelah “makanan”, yaitu kata yang diterangkan.
