base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/008.yaml
  text: 'Then Boaz said to Ruth, “Listen, my daughter: do not go to glean in another field, and also do not go away from here, but stay close with my young women.”'
translation:
  language: id
  text: Lalu Boas berkata kepada Rut, “Dengarkanlah, anakku. Jangan pergi memungut di ladang lain, dan jangan pula beranjak dari sini. Tetaplah dekat dengan para pekerja perempuanku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲלוֹא שָׁמַעַתְּ
  choice: Dengarkanlah
  rationale: Secara bentuk berarti kira-kira 'bukankah engkau telah mendengar?', tetapi dalam konteks ini berfungsi sebagai ajakan tegas agar Rut memperhatikan perkataan Boas; 'Dengarkanlah' menyampaikan fungsi tersebut secara alami dalam bahasa Indonesia.
- source_word: לִלְקֹט
  choice: memungut jelai
  rationale: Kata kerja ini menunjuk pada kegiatan memungut sisa panen. 'Jelai' ditambahkan dari konteks dekat pasal ini agar kegiatannya jelas bagi pembaca Indonesia.
- source_word: לֹא תַעֲבוּרִי מִזֶּה
  choice: jangan juga pergi dari sini
  rationale: Ungkapan ini melarang Rut beranjak atau berpindah dari tempat tersebut; pilihan ini mempertahankan makna spasialnya dengan bahasa yang wajar.
- source_word: תִדְבָּקִין עִם
  choice: Tetaplah dekat dengan
  rationale: Kata דבק mengandung gagasan melekat atau tetap dekat, sedangkan עִם berarti 'dengan'. Terjemahan ini mempertahankan keduanya tanpa membuat ungkapan Indonesia terasa kaku.
- source_word: נַעֲרֹתָי
  choice: para pekerja perempuanku
  rationale: Bentuk feminin ini secara harfiah dapat berarti 'gadis-gadisku' atau 'perempuan-perempuan mudaku', tetapi dalam konteks ladang menunjuk pada para perempuan yang bekerja di bawah Boas. Pilihan ini menghindari kesan kepemilikan pribadi yang keliru.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan 'anakku' mempertahankan nada kebapakan Boas tanpa menyiratkan hubungan biologis.
