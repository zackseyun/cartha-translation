    issue: “Jelai” ditambahkan pada objek “memungut”.
    rationale: Kata ללקט menyatakan kegiatan memungut sisa panen, tetapi jenis biji-bijian tidak disebut dalam Rut 2:8. Walaupun jelai disebut dalam konteks pasal, penambahannya di ayat ini melampaui teks sumber.
  revised_text: Lalu Boas berkata kepada Rut, “Dengarkanlah, anakku. Jangan pergi memungut di ladang lain, dan jangan pula beranjak dari sini. Tetaplah dekat dengan para pekerja perempuanku.”
