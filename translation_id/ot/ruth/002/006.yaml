base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/006.yaml
  text: Then the young man who was set over the reapers answered and said[a], “She is a young Moabite woman who returned with Naomi from the fields of Moab.”
translation:
  language: id
  text: Lalu pemuda yang mengawasi para penuai itu menjawab, “Dia seorang perempuan muda Moab yang kembali bersama Naomi dari daerah pertanian Moab.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari ladang Moab”; bentuk tunggal dalam bahasa Ibrani dapat dipahami secara kolektif sebagai daerah pertanian Moab.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: menjawab
  rationale: Dalam pengantar percakapan Ibrani, gabungan harfiah ‘menjawab dan berkata’ wajar dipadatkan menjadi ‘menjawab’ dalam bahasa Indonesia modern tanpa kehilangan fungsi naratifnya.
- source_word: הַנַּעַר
  choice: pemuda
  rationale: נַעַר di sini menunjuk seorang laki-laki muda; perannya sebagai pengawas dinyatakan oleh frasa berikutnya, sehingga tidak perlu memasukkan arti ‘mandor’ ke dalam nomina ini.
- source_word: הַנִּצָּב עַל הַקּוֹצְרִים
  choice: yang mengawasi para penuai
  rationale: Dalam konteks ini, נצב dengan עַל menunjukkan kedudukan yang diberi tanggung jawab atas para penuai. ‘Mengawasi’ menyampaikan fungsi tersebut secara alami tanpa menentukan jabatan resmi yang tidak dinyatakan teks.
- source_word: הַקּוֹצְרִים
  choice: para penuai
  rationale: Bentuk partisip dari קצר menunjuk orang-orang yang menuai gandum; ‘para penuai’ langsung, jelas, dan sesuai dengan latar pertanian.
- source_word: נַעֲרָה מוֹאֲבִיָּה
  choice: seorang perempuan muda Moab
  rationale: נַעֲרָה berarti perempuan muda, sedangkan מוֹאֲבִיָּה menyatakan asal etnis atau kebangsaannya. Susunan ini alami dalam bahasa Indonesia dan tidak membuatnya terdengar seperti anak kecil.
- source_word: הִיא
  choice: Dia seorang
  rationale: Pronomina mandiri ini membentuk pernyataan identifikasi. ‘Dia seorang’ merupakan padanan Indonesia yang alami dalam jawaban langsung.
- source_word: הַשָּׁבָה
  choice: yang pulang
  rationale: שוב berarti kembali atau pulang. ‘Pulang’ alami dalam bahasa Indonesia dan mempertahankan motif kepulangan Naomi dan Rut, meskipun Rut sendiri datang ke negeri yang bukan tanah asalnya.
- source_word: עִם נָעֳמִי
  choice: bersama Naomi
  rationale: Padanan langsung dan alami untuk hubungan penyertaan yang dinyatakan עִם.
- source_word: מִשְּׂדֵה מוֹאָב
  choice: dari daerah pertanian Moab
  rationale: Bentuk tunggal שְׂדֵה dapat dipahami secara kolektif atau regional sebagai tanah pertanian Moab. Pilihan ini mempertahankan citra agraris sekaligus terdengar alami dalam bahasa Indonesia.
