    text: Secara harfiah, “telah berbicara kepada hati hamba perempuanmu ini.”
    reason: lexical_alternative
  revision_rationale: Revisi mengganti ungkapan yang kurang lancar dengan padanan idiomatis bagi “berbicara kepada hati,” sambil mempertahankan bentuk harfiah dalam catatan kaki. Klausa terakhir dikembalikan ke “tidak seperti” untuk tidak memaksakan penafsiran status sosial yang lebih sempit daripada teks Ibrani. Kedua kemunculan שִׁפְחָה diterjemahkan konsisten sebagai “hamba perempuan.”
