base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/013.yaml
  text: Then she said[a], “May I find favor in your eyes, my lord, because you have comforted me and because you have spoken to the heart of your servant, though I am not like one of your female servants.”
translation:
  language: id
  text: Lalu Rut berkata, “Kiranya aku mendapat kemurahan di matamu, tuanku, sebab engkau telah menghibur aku dan telah berkata-kata dengan ramah kepada hamba perempuanmu ini,[a] sekalipun aku tidak seperti salah seorang hamba perempuanmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “telah berbicara kepada hati hamba perempuanmu ini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶמְצָא חֵן
  choice: Kiranya aku mendapat kemurahan
  rationale: Bentuk imperfek di sini menyatakan harapan atau ungkapan hormat, bukan sekadar waktu mendatang. ‘Mendapat kemurahan’ menyampaikan idiom tentang memperoleh penerimaan yang baik.
- source_word: בְּעֵינֶיךָ
  choice: di matamu
  rationale: Mempertahankan gambaran idiom Ibrani yang juga dapat dipahami secara alami dalam bahasa Indonesia.
- source_word: אֲדֹנִי
  choice: tuanku
  rationale: Sapaan hormat kepada Boas sebagai manusia, bukan gelar ilahi; bentuk ini mempertahankan jarak sosial dan kesantunan Rut.
- source_word: נִחַמְתָּנִי
  choice: engkau telah menghibur aku
  rationale: Kata kerja ini menyatakan penghiburan atau peneguhan bagi orang yang berada dalam keadaan rentan.
- source_word: דִבַּרְתָּ עַל־לֵב
  choice: berbicara menyentuh hati
  rationale: Ungkapan sumber secara harfiah berarti ‘berbicara kepada/atas hati’ dan menunjuk pada perkataan yang menghibur atau menenteramkan. Terjemahan ini menjaga citra hati dengan bahasa Indonesia yang lebih wajar.
- source_word: שִׁפְחָתֶךָ / שִׁפְחֹתֶיךָ
  choice: hambamu ini / hambamu perempuan
  rationale: Kata Ibrani menunjuk khusus kepada hamba perempuan. Pada penyebutan diri pertama, ‘hambamu ini’ terdengar alami dan konteks menunjukkan penuturnya perempuan; pada penyebutan jamak, ‘hambamu perempuan’ mempertahankan kekhususan leksikal.
- source_word: וְאָנֹכִי לֹא אֶהְיֶה כְּאַחַת
  choice: sekalipun aku tidak setara dengan salah seorang
  rationale: Klausa ini bersifat konsesif dan menekankan bahwa Rut memandang kedudukannya lebih rendah, bukan hanya bahwa ia berbeda dari para hamba perempuan Boas.
