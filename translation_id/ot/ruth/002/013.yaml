- from: Lalu Rut berkata, “Kiranya aku mendapat kemurahan di matamu, tuanku, sebab engkau telah menghibur aku dan berbicara menyentuh hati hambamu ini,[a] sekalipun aku tidak setara dengan salah seorang hambamu perempuan.”
  to: Lalu Rut berkata, “Kiranya aku mendapat kemurahan di matamu, tuanku, sebab engkau telah menghibur aku dan telah berkata-kata dengan ramah kepada hamba perempuanmu ini,[a] sekalipun aku tidak seperti salah seorang hamba perempuanmu.”
  rationale: Revisi mengganti ungkapan yang kurang lancar dengan padanan idiomatis bagi “berbicara kepada hati,” sambil mempertahankan bentuk harfiah dalam catatan kaki. Klausa terakhir dikembalikan ke “tidak seperti” untuk tidak memaksakan penafsiran status sosial yang lebih sempit daripada teks Ibrani. Kedua kemunculan שִׁפְחָה diterjemahkan konsisten sebagai “hamba perempuan.”
