id: RUT.2.1
reference: Ruth 2:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּֽ/לְ/נָעֳמִ֞י מידע לְ/אִישָׁ֗/הּ אִ֚ישׁ גִּבּ֣וֹר חַ֔יִל מִ/מִּשְׁפַּ֖חַת אֱלִימֶ֑לֶךְ וּ/שְׁמ֖/וֹ בֹּֽעַז׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/001.yaml
  text: Naomi had a relative of her husband[a], a man of great worth, from the clan of Elimelech[b], and his name was Boaz.
translation:
  language: id
  text: Naomi mempunyai seorang kerabat dari pihak suaminya, seorang yang terpandang dan kaya[a] dari kaum Elimelekh[b]. Namanya Boas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seorang yang sangat cakap,” “seorang yang berpengaruh,” atau “seorang yang gagah perkasa”; ungkapan Ibrani ini memadukan gagasan tentang kekuatan, kecakapan, kedudukan, dan kekayaan.
    reason: lexical_alternative
  - marker: b
    text: Atau “keluarga Elimelekh”; kata Ibrani ini dapat menunjuk kepada kelompok kerabat atau kaum yang lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: מידע
  choice: seorang kerabat
  rationale: Kata ini menunjuk kepada seseorang yang dikenal atau memiliki hubungan dengan suami Naomi. Keterangan bahwa ia berasal dari kaum Elimelekh mendukung hubungan kekerabatan, tetapi belum perlu merincinya sebagai penebus kerabat.
- source_word: לְאִישָׁהּ
  choice: dari pihak suaminya
  rationale: Ungkapan ini mengaitkan kerabat tersebut dengan suami Naomi; bentuk ini lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'milik suaminya'.
- source_word: אִישׁ גִּבּוֹר חַיִל
  choice: seorang yang terpandang dan kaya
  rationale: Dalam konteks nonmiliter kitab Rut, ungkapan ini mencakup kemampuan, kedudukan, pengaruh, dan kekayaan. Pilihan ini menyampaikan unsur status dan kemapanan tanpa memasukkan nuansa kepahlawanan militer.
- source_word: מִמִּשְׁפַּחַת
  choice: dari kaum
  rationale: מִשְׁפָּחָה dapat menunjuk kepada kelompok kekerabatan yang lebih luas daripada keluarga inti; 'kaum' alami dan mempertahankan keluasan itu.
- source_word: וּשְׁמוֹ
  choice: Namanya
  rationale: Pengenalan tokoh secara idiomatis dalam bahasa Indonesia tidak memerlukan kata penghubung eksplisit.
- source_word: בֹּעַז
  choice: Boas
  rationale: Mengikuti bentuk nama Alkitab yang sudah lazim dalam bahasa Indonesia.
- source_word: וּלְנָעֳמִי
  choice: Naomi mempunyai
  rationale: Konjungsi membuka informasi naratif baru. Bahasa Indonesia dapat menyampaikan kesinambungan itu tanpa penanda wacana tambahan seperti 'adapun'.
theological_decisions: []
