  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Susunan ayat dipecah menjadi dua kalimat agar mudah dibaca tanpa menghilangkan hubungan antarketerangan. Nama Boas dan Elimelekh memakai bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
