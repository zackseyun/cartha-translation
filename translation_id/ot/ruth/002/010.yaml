  text: וַ/תִּפֹּל֙ עַל פָּנֶ֔י/הָ וַ/תִּשְׁתַּ֖חוּ אָ֑רְצָ/ה וַ/תֹּ֣אמֶר אֵלָ֗י/ו מַדּוּעַ֩ מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ לְ/הַכִּירֵ֔/נִי וְ/אָּנֹכִ֖י נָכְרִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/010.yaml
  text: Then she fell on her face and bowed to the ground and said to him[a], “Why have I found favor in your eyes, that you should take notice of me, though I am a foreign woman?”
translation:
  language: id
  text: Lalu ia tersungkur dengan wajah ke tanah dan membungkuk sampai ke tanah. Ia berkata kepadanya, “Mengapa aku mendapat kemurahan di matamu sehingga engkau memperhatikan aku[a], padahal aku ini perempuan asing?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengenali aku,” “mengindahkan aku,” atau “mengakui aku.”
    reason: Kata Ibrani yang dipakai dapat mencakup arti mengenali, memperhatikan, mengindahkan, atau mengakui seseorang.
lexical_decisions:
- source_word: וַתִּפֹּל עַל־פָּנֶיהָ
  choice: ia tersungkur dengan muka ke tanah
  rationale: Ungkapan ini secara harfiah menggambarkan tindakan jatuh dengan wajah menghadap tanah sebagai tanda kerendahan hati yang mendalam. Pilihan ini mempertahankan gambaran fisik bahasa Ibrani dan tetap wajar dalam bahasa Indonesia.
- source_word: וַתִּשְׁתַּחוּ אָרְצָה
  choice: dan bersujud
  rationale: Kata kerja ini menyatakan tindakan membungkuk atau merebahkan diri sampai ke tanah. “Bersujud” menyampaikan sikap tubuh tersebut dengan ringkas tanpa menyatakan bahwa Rut sedang menyembah Boas.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: aku mendapat kemurahan di matamu
  rationale: Pilihan ini mempertahankan idiom Ibrani “mendapat kemurahan di mata seseorang.” “Kemurahan” sesuai dengan konteks penerimaan dan perlakuan baik, sedangkan “di matamu” menjaga gambaran sumber.
- source_word: לְהַכִּירֵנִי
  choice: sehingga engkau memperhatikan aku
  rationale: Bentuk kausatif dari נכר di sini dapat berarti mengenali, mengindahkan, atau memberikan perhatian. Dalam konteks ini, Rut merasa heran karena Boas memberikan perhatian yang baik kepadanya. Catatan kaki mempertahankan keluasan maknanya.
- source_word: וְאָנֹכִי
  choice: padahal aku ini
  rationale: 'Kata penghubung dan pronomina mandiri membentuk pertentangan yang bersifat konsesif: Boas memperhatikannya meskipun statusnya demikian. “Padahal aku ini” mengungkapkan pertentangan itu secara alami.'
- source_word: נָכְרִיָּה
  choice: perempuan asing
  rationale: Bentuk feminin tunggal ini menunjuk kepada seorang perempuan dari bangsa lain. “Perempuan asing” mempertahankan penandaan gender dan status sosial-etnis yang dinyatakan sumber.
theological_decisions:
- issue: Kemungkinan nuansa kultis pada וַתִּשְׁתַּחוּ
  choice: Diterjemahkan sebagai tindakan bersujud untuk menunjukkan penghormatan kepada Boas, bukan penyembahan
  alternative: Menerjemahkannya dengan istilah yang secara eksplisit berarti menyembah
  rationale: Dalam konteks narasi ini, Rut menunjukkan kerendahan hati dan penghormatan sosial kepada Boas. Teks tidak menyatakan bahwa ia mempersembahkan penyembahan ilahi kepadanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur tindakan ganda dalam bahasa Ibrani dipertahankan, sementara dialog dibuat alami bagi pembaca umum. Idiom “di matamu” dipertahankan karena jelas dan menjaga citra sumber.
