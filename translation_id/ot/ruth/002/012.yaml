    rationale: Jika teks utama memakai "penuh", alternatif "upahmu menjadi lengkap" cukup tepat, tetapi penjelasan "sepenuhnya/lengkap" kurang rapi karena "sepenuhnya" bukan padanan bentuk adjektival yang diperlukan dalam konstruksi ini.
