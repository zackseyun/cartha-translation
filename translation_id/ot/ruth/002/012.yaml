  text: יְשַׁלֵּ֥ם יְהוָ֖ה פָּעֳלֵ֑/ךְ וּ/תְהִ֨י מַשְׂכֻּרְתֵּ֜/ךְ שְׁלֵמָ֗ה מֵ/עִ֤ם יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁר בָּ֖את לַ/חֲס֥וֹת תַּֽחַת כְּנָפָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/012.yaml
  text: May Yahweh repay your work[a], and may your reward be full from Yahweh, the God of Israel, under whose wings you have come to seek refuge.
translation:
  language: id
  text: Kiranya Yahweh membalas perbuatanmu, dan kiranya upahmu penuh dari Yahweh, Allah Israel, yang di bawah sayap-Nya engkau telah datang untuk berlindung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kiranya upahmu lengkap dari Yahweh.” Kata Ibrani untuk “upah” dapat juga berarti “ganjaran”; kata “penuh” berhubungan dengan akar yang sama dengan kata “membalas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשַׁלֵּם
  choice: Kiranya ... membalas
  rationale: Bentuk piel ini menyatakan harapan atau berkat Boas; “kiranya ... membalas” mempertahankan nuansa volitif dan gagasan ganjaran.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: פָּעֳלֵךְ
  choice: perbuatanmu
  rationale: Dalam konteks ini kata tersebut menunjuk pada tindakan setia Rut; “perbuatanmu” lebih alami daripada “pekerjaanmu” dan tetap dekat dengan makna perbuatan atau karya.
- source_word: וּתְהִי
  choice: dan kiranya ... datang
  rationale: Bentuk jusif meneruskan rumusan berkat. Dalam bahasa Indonesia, predikat “datang dari” menyampaikan secara alami bahwa upah itu berasal dari Yahweh.
- source_word: מַשְׂכֻּרְתֵּךְ
  choice: upahmu
  rationale: Kata ini dapat berarti upah atau ganjaran. “Upah” mempertahankan citra imbalan tanpa menyiratkan bahwa Rut adalah pekerja yang secara harfiah dipekerjakan Allah.
- source_word: שְׁלֵמָה
  choice: sepenuhnya
  rationale: Kata ini menyatakan kelengkapan atau kepenuhan dan menggemakan akar שׁלם pada kata kerja sebelumnya.
- source_word: מֵעִם
  choice: datang dari
  rationale: Preposisi ini menandai sumber; ungkapan “datang dari” alami dalam bahasa Indonesia.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Terjemahan konstruksi yang ringkas dan lazim dalam bahasa Indonesia.
- source_word: לַחֲסוֹת
  choice: untuk berlindung
  rationale: Infinitif ini mengungkapkan tujuan kedatangan Rut, yaitu mencari atau mengambil perlindungan.
- source_word: תַּחַת כְּנָפָיו
  choice: di bawah sayap-Nya
  rationale: Metafora perlindungan ilahi dipertahankan tanpa diratakan menjadi istilah abstrak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; bentuk “Yahweh” mempertahankan nama pribadi ilahi.
- issue: Gambaran berlindung di bawah sayap Allah
  choice: mempertahankan metafora “di bawah sayap-Nya”
  alternative: di bawah perlindungan-Nya
  rationale: Bahasa figuratif teks menyampaikan perlindungan ilahi dan kemungkinan gema relasional-perjanjian; metafora tidak perlu ditafsirkan secara eksplisit dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada berkat yang khidmat. Kata ganti “engkau” dipakai karena Boas berbicara langsung kepada satu orang, sedangkan “-Nya” merujuk kepada Yahweh. Susunan relatif Ibrani dipertahankan secara cukup dekat tanpa mengorbankan kelancaran.
