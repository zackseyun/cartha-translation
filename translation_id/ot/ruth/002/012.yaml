revisions:
- from: Kiranya Yahweh membalas perbuatanmu, dan kiranya upahmu sepenuhnya[a] datang dari Yahweh, Allah Israel, yang di bawah sayap-Nya engkau datang untuk berlindung.
  to: Kiranya Yahweh membalas perbuatanmu, dan kiranya upahmu penuh dari Yahweh, Allah Israel, yang di bawah sayap-Nya engkau telah datang untuk berlindung.[a]
  rationale: Revisi mempertahankan dua bentuk harapan/berkat ("kiranya"), menyatakan secara eksplisit bahwa upah itu "penuh" sekaligus "dari Yahweh", dan memperbaiki urutan klausa relatif agar tindakan Rut—telah datang untuk berlindung di bawah sayap Yahweh—jelas. Catatan kaki dipindahkan ke akhir kalimat agar jangkar mengikuti klausa yang menjelaskan keseluruhan ungkapan tentang upah.
