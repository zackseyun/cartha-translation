base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/016.yaml
  text: And also[a], you must surely pull out some for her from the bundles and leave it, so that she may gather it[b], and you must not rebuke her.
translation:
  language: id
  text: Selain itu, dengan sengaja keluarkanlah sebagian dari berkas-berkas itu[a] untuknya, lalu tinggalkanlah itu supaya ia dapat memungutnya[b]; jangan tegur dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ikatan-ikatan.” Istilah Ibrani ini menunjuk pada kumpulan batang tanaman yang telah dihimpun.
    reason: lexical_alternative
  - marker: b
    text: Atau, “memungut sisa panen.” Verba Ibrani ini adalah istilah yang lazim untuk mengambil sisa hasil panen di ladang yang telah dituai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Bahkan, ... juga
  rationale: Mempertahankan daya penghubung sekaligus penambahan dan penekanan pada perintah Boas.
- source_word: שֹׁל תָּשֹׁלּוּ
  choice: tariklah ... dengan sengaja
  rationale: Gabungan infinitif absolut dan verba berhingga menguatkan tindakan. Dalam konteks ini, para pekerja diperintahkan menarik keluar sebagian hasil panen secara sengaja, bukan menjatuhkannya secara kebetulan.
- source_word: לָהּ
  choice: untuk dia
  rationale: 'Preposisi ini menyatakan manfaat: tindakan itu dilakukan demi kepentingan Rut.'
- source_word: מִן הַצְּבָתִים
  choice: dari ikatan-ikatan itu
  rationale: Istilah Ibrani menunjuk pada kumpulan batang tanaman yang telah dihimpun; 'ikatan-ikatan' jelas dan alami dalam bahasa Indonesia modern.
- source_word: וַעֲזַבְתֶּם
  choice: lalu tinggalkanlah
  rationale: Para pekerja harus membiarkan bagian yang ditarik keluar itu tetap tergeletak agar dapat dipungut Rut.
- source_word: וְלִקְּטָה
  choice: supaya ia dapat memungutnya
  rationale: Verba ini merupakan istilah lazim untuk memungut sisa panen. Bentuk berpronomina menghubungkannya secara alami dengan bagian yang sengaja ditinggalkan.
- source_word: וְלֹא תִגְעֲרוּ בָהּ
  choice: Janganlah menegur dia
  rationale: גער menyatakan teguran atau hardikan yang kuat. 'Menegur' menjaga larangan itu tetap tegas tanpa terdengar terlalu sehari-hari.
