translation_notes:
  register: Bahasa Indonesia baku modern dengan nada perintah yang tegas namun wajar. Susunan kalimat dibuat alami sambil mempertahankan penekanan Ibrani bahwa hasil panen harus ditarik keluar secara sengaja demi Rut.
