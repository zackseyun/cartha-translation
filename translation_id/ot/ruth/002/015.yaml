translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah teknis tentang memungut sisa panen dijelaskan secara deskriptif agar mudah dipahami. Struktur ujaran dibuat alami tanpa menerjemahkan formula Ibrani לֵאמֹר secara mekanis.
