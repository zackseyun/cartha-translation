  yaml_path: translation/ot/ruth/002/015.yaml
  text: When she rose to glean[a], Boaz commanded his young men, saying, “Let her glean even among the sheaves[b], and do not humiliate her.”
translation:
  language: id
  text: Ketika Rut bangkit untuk memungut sisa panen, Boas memerintahkan para pekerja mudanya, “Biarkan dia memungut bahkan di antara berkas-berkas gandum[a], dan jangan mempermalukan dia[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di antara berkas-berkas.” Istilah Ibrani ini menunjuk pada ikatan-ikatan hasil panen yang telah dikumpulkan.
    reason: lexical_alternative
  - marker: b
    text: Atau “jangan membuat dia malu.” Kata Ibrani ini dapat menunjuk pada tindakan yang mendatangkan rasa malu, kehinaan, atau aib.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּקָם
  choice: Ketika Rut bangkit
  rationale: Bentuk wayyiqtol melanjutkan alur cerita. Nama Rut ditambahkan sebagai subjek tersirat agar rujukannya jelas dan alami dalam bahasa Indonesia; 'bangkit' mempertahankan arti dasar קום.
- source_word: לְלַקֵּט
  choice: untuk memungut bulir-bulir yang tertinggal
  rationale: לקט menunjuk pada kegiatan memungut sisa hasil panen. Ungkapan ini lebih mudah dipahami pembaca umum daripada istilah teknis, sekaligus sesuai dengan latar panen.
- source_word: וַיְצַו ... לֵאמֹר
  choice: Boas memerintahkan
  rationale: צוה menyatakan perintah yang berwibawa. Formula לֵאמֹר tidak diterjemahkan secara terpisah karena tanda petik langsung sudah memperkenalkan isi perkataan secara alami dalam bahasa Indonesia.
- source_word: נְעָרָיו
  choice: para pekerja mudanya
  rationale: נַעַר dapat berarti pemuda, pelayan, atau pekerja bawahan. Dalam konteks ladang, pilihan ini mempertahankan unsur usia dan menjelaskan fungsi mereka.
- source_word: גַּם
  choice: bahkan
  rationale: גַּם memperluas izin secara mencolok melampaui praktik pemungutan biasa; 'bahkan' menyampaikan nuansa tersebut.
- source_word: בֵּין הָעֳמָרִים
  choice: di antara berkas-berkas gandum
  rationale: בֵּין secara harfiah berarti 'di antara', sedangkan עֳמָרִים adalah ikatan atau berkas hasil panen. 'Berkas-berkas gandum' alami dan konkret dalam konteks ini.
- source_word: תְּלַקֵּט
  choice: Biarkan dia memungut
  rationale: 'Bentuk imperfek berfungsi sebagai perintah permisif kepada para pekerja: mereka harus mengizinkan Rut memungut.'
- source_word: וְלֹא תַכְלִימוּהָ
  choice: dan jangan mempermalukan dia
  rationale: Bentuk Hifil dari כלם berarti menyebabkan malu atau aib. 'Mempermalukan' mencakup penghinaan sosial atau tindakan yang membuatnya menanggung malu.
