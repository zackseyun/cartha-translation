base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/014.yaml
  text: At mealtime Boaz said to her[a], “Come here and eat some bread, and dip your piece in the sour wine.” So she sat beside the reapers, and he passed her roasted grain. She ate and was satisfied, and she had some left over.
translation:
  language: id
  text: Pada waktu makan, Boas berkata kepada Rut, “Kemarilah, makanlah sebagian roti dan celupkan potongan rotimu ke dalam anggur asam.”[a] Lalu Rut duduk di samping para penuai. Boas menyodorkan kepadanya biji-bijian panggang. Rut makan sampai kenyang, dan masih ada sisanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “celupkan potongan rotimu ke dalam cuka.” Kata Ibrani חֹמֶץ dapat berarti cuka atau minuman anggur asam; dalam konteks santapan para pekerja ini, kemungkinan yang dimaksud ialah anggur asam.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֵת הָאֹכֶל
  choice: Pada waktu makan
  rationale: Ungkapan ini menunjuk pada waktu para pekerja makan; pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan keterangan waktunya.
- source_word: גֹּשִׁי הֲלֹם
  choice: Kemarilah
  rationale: Bentuk perintah dan kata keterangan tempat menyatakan ajakan untuk mendekat; “Kemarilah” ringkas dan wajar.
- source_word: וְאָכַלְתְּ מִן הַלֶּחֶם
  choice: makanlah roti ini
  rationale: Preposisi מִן memiliki arti partitif. Dalam konteks ajakan makan, “makanlah roti ini” mengungkapkannya secara alami tanpa menyiratkan bahwa Rut harus menghabiskan seluruh roti.
- source_word: וְטָבַלְתְּ פִּתֵּךְ בַּחֹמֶץ
  choice: celupkan potongan rotimu ke dalam anggur asam
  rationale: פַּת adalah potongan atau suapan, yang dalam konteks ini paling wajar dipahami sebagai roti. חֹמֶץ dapat berarti cuka atau minuman anggur asam; konteks santapan para pekerja mendukung “anggur asam”, sedangkan alternatifnya dicatat dalam catatan kaki.
- source_word: מִצַּד הַקּוֹצְרִים
  choice: di samping para penuai
  rationale: Terjemahan ini mempertahankan makna posisi di sisi para pekerja yang sedang menuai serta latar pertaniannya.
- source_word: וַיִּצְבָּט לָהּ קָלִי
  choice: Boas menyodorkan kepadanya bulir-bulir gandum yang dipanggang
  rationale: Kata kerja langka ini dalam konteksnya menunjuk pada tindakan mengulurkan atau menyerahkan makanan. קָלִי adalah biji-bijian yang dipanggang; “bulir-bulir gandum yang dipanggang” mudah dipahami dalam bahasa Indonesia, dengan “gandum” dipakai sebagai sebutan umum bagi serealia dalam konteks ini.
- source_word: וַתִּשְׂבַּע
  choice: makan sampai kenyang
  rationale: Kata kerja ini menyatakan bahwa seseorang menjadi kenyang atau puas setelah makan. Pilihan ini alami dan konkret.
- source_word: וַתֹּתַר
  choice: bahkan masih ada sisanya
  rationale: Bentuk feminin tunggal meneruskan rangkaian tindakan Rut dan menyatakan bahwa sesudah ia kenyang, makanan yang diterimanya masih tersisa. Susunan ini alami tanpa menentukan secara berlebihan siapa yang menyimpan sisa itu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang sederhana dan bermartabat. Nama “Rut” diulang untuk memperjelas rujukan pronomina feminin Ibrani, dan “Boas” diulang karena bahasa Indonesia tidak membedakan gender pada kata ganti orang ketiga. Penanda catatan kaki ditempatkan tepat setelah kalimat yang memuat pilihan leksikal terkait.
