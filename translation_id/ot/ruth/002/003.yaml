  text: וַ/תֵּ֤לֶךְ וַ/תָּבוֹא֙ וַ/תְּלַקֵּ֣ט בַּ/שָּׂדֶ֔ה אַחֲרֵ֖י הַ/קֹּצְרִ֑ים וַ/יִּ֣קֶר מִקְרֶ֔/הָ חֶלְקַ֤ת הַ/שָּׂדֶה֙ לְ/בֹ֔עַז אֲשֶׁ֖ר מִ/מִּשְׁפַּ֥חַת אֱלִימֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/003.yaml
  text: So she went and came and gleaned in the field behind the reapers[a], and she happened to come to the portion of the field belonging to Boaz, who was from the family of Elimelech.
translation:
  language: id
  text: Rut pun pergi, lalu tiba di ladang itu dan memungut bulir-bulir yang tertinggal di belakang para penuai. Kebetulan, ia sampai di bagian ladang milik Boas,[a] yang berasal dari keluarga Elimelekh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, ungkapan Ibrani ini berbunyi, “kebetulannya terjadi.” Ungkapan itu menyatakan apa yang tampak sebagai kebetulan dari sudut pandang manusia; alur kitab ini juga mengundang pembaca untuk melihat pemeliharaan Allah.
    reason: Menjelaskan idiom kognat Ibrani tanpa mengubah kebetulan yang tampak dalam teks utama menjadi pernyataan eksplisit tentang pemeliharaan ilahi.
lexical_decisions:
- source_word: וַתֵּלֶךְ וַתָּבוֹא
  choice: pergilah Rut, lalu ia tiba
  rationale: Mempertahankan urutan gerak narasi Ibrani, tetapi menyebut nama Rut agar subjek alami dan jelas dalam bahasa Indonesia.
- source_word: וַתְּלַקֵּט
  choice: memungut bulir-bulir yang tertinggal
  rationale: לקט menunjuk pada kegiatan memungut sisa hasil panen; ungkapan deskriptif ini lebih mudah dipahami pembaca umum daripada istilah teknis.
- source_word: בַּשָּׂדֶה אַחֲרֵי הַקֹּצְרִים
  choice: di ladang di belakang para penuai
  rationale: 'אחרי bersifat spasial dalam konteks panen: Rut mengikuti para pekerja yang sedang menuai.'
- source_word: וַיִּקֶר מִקְרֶהָ
  choice: Kebetulan ia berada
  rationale: Menyampaikan idiom kognat yang menampilkan peristiwa sebagai kebetulan dari sudut pandang manusia, tanpa menambahkan penjelasan providensial ke teks utama.
- source_word: חֶלְקַת הַשָּׂדֶה לְבֹעַז
  choice: di bagian ladang milik Boas
  rationale: חלקה berarti bagian atau petak tanah, sedangkan ל menandai kepemilikan atau keterkaitan.
- source_word: מִמִּשְׁפַּחַת אֱלִימֶלֶךְ
  choice: berasal dari kaum Elimelekh
  rationale: מִשְׁפָּחָה di sini menunjuk kelompok kekerabatan yang lebih luas; 'kaum' mempertahankan nuansa itu tanpa terdengar terlalu teknis.
theological_decisions:
- issue: Kebetulan yang tampak dan pemeliharaan ilahi
  choice: Memakai 'Kebetulan ia berada' dalam teks utama.
  alternative: Menyatakan secara interpretatif bahwa Allah menuntunnya ke ladang Boas.
  rationale: Bahasa Ibrani menggambarkan kejadian itu sebagai kebetulan pada tingkat pengamatan manusia, sementara alur kitab mengundang pembaca melihat pemeliharaan ilahi. Terjemahan tidak boleh menghapus ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. 'Para penuai' mempertahankan warna agraris teks, sedangkan 'memungut bulir-bulir yang tertinggal' menjelaskan praktik memungut sisa panen secara langsung.
