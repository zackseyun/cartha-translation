revisions:
- from: Maka pergilah Rut, lalu ia tiba dan memungut bulir-bulir yang tertinggal di ladang di belakang para penuai. Kebetulan ia berada di bagian ladang milik Boas,[a] yang berasal dari kaum Elimelekh.
  to: Rut pun pergi, lalu tiba di ladang itu dan memungut bulir-bulir yang tertinggal di belakang para penuai. Kebetulan, ia sampai di bagian ladang milik Boas,[a] yang berasal dari keluarga Elimelekh.
  rationale: Revisi memulihkan kaitan antara idiom kebetulan dan tibanya Rut pada bagian ladang Boas, memperlancar gaya naratif Indonesia, serta memakai istilah kekerabatan yang lebih lazim. Ambiguitas naratif antara kebetulan yang tampak dan pemeliharaan ilahi tetap dipertahankan; penjelasan itu dibatasi pada catatan kaki.
