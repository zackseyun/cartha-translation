revisions:
- from: Katanya, “Tolong izinkan aku memungut bulir-bulir yang tercecer dan mengumpulkannya di antara berkas-berkas, di belakang para penuai.” Lalu ia datang dan tetap berada di sini sejak pagi sampai sekarang; hanya sebentar ia duduk di tempat berteduh.[a]
  to: Katanya, “Tolong izinkan aku memungut sisa panen dan mengumpulkannya di antara berkas gandum, di belakang para penuai.” Lalu ia datang dan tetap berada sejak pagi sampai sekarang; ia hanya sebentar duduk di rumah.[a]
  rationale: Revisi menghapus tambahan “di sini,” menghindari pembatasan yang tidak perlu pada objek pungutan, dan mempertahankan istilah “rumah” dalam klausa terakhir yang sulit sambil memindahkan penjelasan kontekstual “tempat berteduh” ke catatan kaki. Struktur, makna pokok, dan ambiguitas sumber dipelihara.
  reviewer_model: gpt-5.6-terra
