base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/007.yaml
  text: She said[a], ‘Please let me glean and gather among the sheaves after the reapers.’ So she came and has remained from morning until now; she has sat in the house only a little.
translation:
  language: id
  text: Katanya, “Tolong izinkan aku memungut sisa panen dan mengumpulkannya di antara berkas gandum, di belakang para penuai.” Lalu ia datang dan tetap berada sejak pagi sampai sekarang; ia hanya sebentar duduk di rumah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Klausa Ibrani terakhir sulit dipastikan. Secara harfiah, “inilah sedikit duduknya di rumah.” “Rumah” mungkin menunjuk pada pondok atau tempat berteduh bagi para pekerja; maknanya mungkin bahwa ia hanya beristirahat sebentar.
    reason: alternative_reading
lexical_decisions:
- source_word: אֲלַקֳטָה נָּא
  choice: Tolong izinkan aku memungut bulir-bulir yang tercecer
  rationale: Bentuk kohortatif bersama partikel נָּא menyatakan permohonan yang sopan. Ungkapan ini menyampaikan permintaan Rut secara alami, sedangkan “bulir-bulir yang tercecer” menjelaskan tindakan memungut sisa panen tanpa memakai istilah teknis yang kurang lazim.
- source_word: וְאָסַפְתִּי
  choice: dan mengumpulkannya
  rationale: 'Mempertahankan pembedaan dari לקט: sesudah memungut bulir yang tercecer, Rut mengumpulkan hasil pungutannya.'
- source_word: בָעֳמָרִים
  choice: di antara berkas-berkas
  rationale: עֳמָרִים menunjuk pada tangkai-tangkai hasil panen yang telah diikat menjadi berkas. “Di antara” mempertahankan gambaran ruang dalam teks.
- source_word: אַחֲרֵי הַקּוֹצְרִים
  choice: di belakang para penuai
  rationale: 'Menyampaikan arti spasial אַחֲרֵי dalam adegan ini: Rut memungut dengan mengikuti para pekerja yang sedang menuai.'
- source_word: וַתָּבֹא וַתַּעֲמוֹד
  choice: Lalu ia datang dan tetap berada di sini
  rationale: תַּעֲמוֹד secara harfiah dapat berarti “berdiri”, tetapi keterangan waktu berikutnya menunjukkan keberadaan yang berlanjut. “Tetap berada di sini” mempertahankan nuansa duratif tanpa menyatakan secara eksplisit bahwa ia terus bekerja.
- source_word: מֵאָז הַבֹּקֶר וְעַד עַתָּה
  choice: sejak pagi sampai sekarang
  rationale: Ungkapan Indonesia yang alami untuk rentang waktu berkelanjutan dari pagi hingga saat laporan itu diberikan.
- source_word: זֶה שִׁבְתָּהּ הַבַּיִת מְעָט
  choice: hanya sebentar ia duduk di tempat berteduh
  rationale: Klausa Ibrani ini padat dan sulit. שִׁבְתָּהּ kemungkinan menunjuk pada duduk atau beristirahat, sedangkan הַבַּיִת dalam konteks ladang dapat menunjuk pada bangunan atau pondok tempat para pekerja berteduh. Terjemahan utama menyampaikan bahwa waktu istirahatnya sangat singkat, sementara ketidakpastian dipertahankan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. “Tolong izinkan aku” menyampaikan kesopanan Rut tanpa terdengar kuno. Istilah pertanian dijelaskan secara konkret agar mudah dipahami pembaca umum, dan ambiguitas klausa terakhir tidak diselesaikan secara berlebihan.
