base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/020.yaml
  text: Naomi said to her daughter-in-law[a], “Blessed be he by Yahweh, whose kindness has not forsaken the living or the dead.” Then Naomi said to her, “The man is a close relative of ours[b]; he is one of our redeemers.”
translation:
  language: id
  text: Naomi berkata kepada menantunya, “Kiranya dia diberkati oleh Yahweh,[a] yang tidak menarik kasih setia-Nya dari orang yang hidup maupun yang mati.” Lalu Naomi berkata kepadanya, “Orang itu kerabat dekat kita; dia salah seorang penebus kita.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kiranya dia diberkati oleh Yahweh, yang tidak menarik kebaikannya dari orang yang hidup maupun yang mati,” jika “kebaikannya” dipahami sebagai kebaikan Boas, bukan kasih setia Yahweh.'
    reason: alternative_reading
  - marker: b
    text: Istilah Ibrani ini menunjuk seorang kerabat dekat yang mempunyai hak atau kewajiban yang diakui untuk menebus anggota keluarga atau harta milik keluarga.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ הוּא לַיהוָה
  choice: Kiranya dia diberkati oleh Yahweh
  rationale: Ungkapan berkat tanpa verba ini paling alami dinyatakan sebagai doa atau pernyataan berkat dalam bahasa Indonesia. 'Oleh Yahweh' menyampaikan Yahweh sebagai sumber berkat.
- source_word: חַסְדּוֹ
  choice: kasih setia-Nya
  rationale: חֶסֶד mencakup kebaikan, kasih yang teguh, dan kesetiaan dalam hubungan. 'Kasih setia' mempertahankan keluasan makna itu, sedangkan huruf kapital pada pronomina mengikuti pembacaan utama bahwa acuannya ialah Yahweh; kemungkinan acuan kepada Boas dipertahankan dalam catatan kaki.
- source_word: לֹא עָזַב
  choice: tidak meninggalkan
  rationale: Terjemahan ini mempertahankan arti dasar עזב dan daya relasional ungkapan Ibrani tanpa mengubahnya menjadi parafrasa seperti 'tidak berhenti menunjukkan'.
- source_word: אֶת הַחַיִּים וְאֶת הַמֵּתִים
  choice: kepada orang yang hidup maupun yang mati
  rationale: '''Maupun'' menyatakan cakupan kedua kelompok secara alami setelah klausa negatif, tanpa mengubah waw Ibrani yang menghubungkan keduanya.'
- source_word: קָרוֹב לָנוּ
  choice: kerabat dekat kita
  rationale: Dalam konteks ini קָרוֹב menunjukkan kedekatan kekerabatan, bukan jarak tempat.
- source_word: מִגֹּאֲלֵנוּ
  choice: salah seorang penebus kita
  rationale: Bentuk dari גאל menunjuk kerabat yang memiliki hak atau kewajiban keluarga untuk menebus orang atau harta keluarga. Istilah utama menerjemahkan konsepnya secara ringkas, sementara nuansa hukum-kekerabatannya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: 'Acuan pronomina dalam klausa berkat: apakah ''kasih setia-Nya'' adalah kasih setia Yahweh atau kebaikan Boas'
  choice: Naomi memohon berkat bagi Boas, sedangkan klausa 'yang tidak meninggalkan kasih setia-Nya' mengacu kepada Yahweh.
  alternative: Naomi memohon berkat Yahweh bagi Boas, dan 'kebaikannya' mengacu kepada Boas.
  rationale: Boas paling wajar menjadi acuan 'dia' yang diberkati, sementara relatif אֲשֶׁר dapat mengacu kepada Yahweh sebagai anteseden terdekat. Namun, sintaksis Ibrani memungkinkan kasih itu dipahami sebagai kebaikan Boas, sehingga ambiguitas tersebut dicatat dan tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Nama ilahi ditransliterasikan sebagai 'Yahweh'. 'Menantu' dipakai secara alami sesuai konteks bahwa Rut adalah menantu perempuan Naomi. Istilah hukum-kekerabatan dijaga ringkas dalam teks utama dan diterangkan dalam catatan kaki.
