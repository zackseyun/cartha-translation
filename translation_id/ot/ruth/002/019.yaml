  to: Lalu ibu mertuanya berkata kepadanya, “Di mana kamu memungut sisa panen hari ini, dan di mana kamu bekerja? Diberkatilah orang yang memperhatikanmu.” Lalu Rut memberi tahu ibu mertuanya tentang orang yang dengannya ia bekerja[a], dan berkata, “Nama orang yang dengannya aku bekerja hari ini adalah Boas.”
