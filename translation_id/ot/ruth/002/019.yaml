base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/019.yaml
  text: And her mother-in-law said to her[a], “Where did you glean today, and where have you worked? Blessed be the one who took notice of you.” So she told her mother-in-law with whom she had worked, and she said, “The name of the man with whom I worked today is Boaz.”
translation:
  language: id
  text: Lalu ibu mertuanya berkata kepadanya, “Di mana kamu memungut sisa panen hari ini, dan di mana kamu bekerja? Diberkatilah orang yang memperhatikanmu.” Lalu Rut memberi tahu ibu mertuanya tentang orang yang dengannya ia bekerja[a], dan berkata, “Nama orang yang dengannya aku bekerja hari ini adalah Boas.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “apa yang telah ia lakukan dengannya” dan, kemudian, “orang yang dengannya aku telah melakukan [pekerjaan] hari ini.” Dalam konteks pekerjaan di ladang, diterjemahkan “orang yang dengannya ia bekerja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמוֹתָהּ
  choice: ibu mertuanya
  rationale: Padanan kekerabatan yang baku dan alami dalam bahasa Indonesia modern.
- source_word: לִקַּטְתְּ
  choice: memungut jelai
  rationale: Kata kerja ini menunjuk pada pemungutan sisa hasil panen. Objek 'jelai' disediakan oleh konteks dekat dan membuat kegiatan itu jelas bagi pembaca Indonesia.
- source_word: וְאָנָה עָשִׂית
  choice: dan di mana kamu bekerja
  rationale: Secara leksikal עשה berarti 'melakukan/mengerjakan', tetapi dalam konteks ladang ungkapan ini secara alami merujuk pada pekerjaan Rut.
- source_word: יְהִי מַכִּירֵךְ בָּרוּךְ
  choice: Diberkatilah orang yang memperhatikanmu
  rationale: מכירך secara harfiah menunjuk kepada orang yang mengenali atau memperhatikan Rut; 'memperhatikanmu' mempertahankan perhatian pribadi yang menguntungkan dalam konteks.
- source_word: אֵת אֲשֶׁר עָשְׂתָה עִמּוֹ
  choice: dengan siapa ia bekerja
  rationale: Ibrani secara lebih harfiah berbunyi 'apa yang telah dilakukannya bersama dia', tetapi konteks menunjukkan pekerjaan di ladang; susunan ini alami dan tidak menimbulkan kesan yang keliru.
- source_word: שֵׁם הָאִישׁ אֲשֶׁר עָשִׂיתִי עִמּוֹ
  choice: Nama orang yang dengannya aku bekerja
  rationale: Menjaga struktur penamaan dalam teks sumber sambil mengungkapkan secara idiomatis bahwa Rut bekerja di ladang orang itu.
- source_word: בֹּעַז
  choice: Boas
  rationale: Bentuk nama yang lazim dan mapan dalam tradisi Alkitab berbahasa Indonesia.
