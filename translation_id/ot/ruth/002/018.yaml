base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/018.yaml
  text: She picked it up and went into the city[a], and her mother-in-law saw what she had gleaned. Then she brought out and gave her what she had left over after she was satisfied.
translation:
  language: id
  text: Ia mengangkatnya lalu pergi ke kota. Ibu mertuanya melihat apa yang dipungutnya. Kemudian ia mengeluarkan apa yang disisakannya sesudah ia kenyang[a] dan memberikannya kepada ibu mertuanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sesudah ia makan sampai kenyang.”'
    reason: Alternatif ini membuat implikasi konteks makan dalam מִשָּׂבְעָהּ lebih eksplisit.
lexical_decisions:
- source_word: וַתִּשָּׂא
  choice: Ia mengangkatnya
  rationale: Kata נשׂא berarti mengangkat atau membawa. Bentuk “mengangkatnya” mempertahankan tindakan fisik dalam teks dan pronomina yang merujuk pada hasil pungutan dari konteks ayat sebelumnya.
- source_word: הָעִיר
  choice: kota
  rationale: Padanan langsung dan lazim bagi עִיר; tidak perlu memperkecil Bethlehem menjadi “desa” atau menyelesaikan ukuran permukimannya.
- source_word: חֲמוֹתָהּ
  choice: ibu mertuanya
  rationale: Padanan kekerabatan baku bagi חֲמוֹת dengan sufiks orang ketiga feminin.
- source_word: אֵת אֲשֶׁר לִקֵּטָה
  choice: hasil yang telah dipungutnya
  rationale: לקט menunjuk pada memungut sisa panen. “Hasil yang telah dipungutnya” terdengar alami dalam bahasa Indonesia sekaligus mempertahankan latar pemungutan sisa panen.
- source_word: וַתּוֹצֵא
  choice: ia mengeluarkan
  rationale: Bentuk kausatif יצא berarti mengeluarkan atau membawa keluar; “mengeluarkan” sesuai dengan tindakan Rut mengambil makanan yang disimpannya.
- source_word: וַתִּתֶּן לָהּ
  choice: memberikannya kepada ibu mertuanya
  rationale: Nama hubungan diulang agar rujukan pronomina feminin jelas dan kalimat Indonesia tetap alami.
- source_word: אֵת אֲשֶׁר הוֹתִרָה
  choice: apa yang disisakannya
  rationale: יתר dalam bentuk ini menyatakan sesuatu yang ditinggalkan atau disisakan. Pilihan ini sesuai dengan makanan yang masih tersisa dari jamuan sebelumnya.
- source_word: מִשָּׂבְעָהּ
  choice: setelah kenyang
  rationale: Ungkapan ini menunjuk pada keadaan kenyang atau puas setelah makan. “Setelah kenyang” ringkas, alami, dan tidak menambahkan rincian yang tidak dinyatakan secara eksplisit.
