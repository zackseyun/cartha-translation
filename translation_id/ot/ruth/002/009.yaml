translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal ‘engkau’, sesuai dialog naratif yang bermartabat. Terjemahan mempertahankan pertanyaan retoris, membedakan pekerja perempuan dan laki-laki sebagaimana ditandai oleh bentuk-bentuk Ibrani, serta memakai istilah konkret yang mudah dipahami.
