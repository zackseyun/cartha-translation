  text: עֵינַ֜יִ/ךְ בַּ/שָּׂדֶ֤ה אֲשֶׁר יִקְצֹרוּ/ן֙ וְ/הָלַ֣כְתִּ אַחֲרֵי/הֶ֔ן הֲ/ל֥וֹא צִוִּ֛יתִי אֶת הַ/נְּעָרִ֖ים לְ/בִלְתִּ֣י נָגְעֵ֑/ךְ וְ/צָמִ֗ת וְ/הָלַכְתְּ֙ אֶל הַ/כֵּלִ֔ים וְ/שָׁתִ֕ית מֵ/אֲשֶׁ֥ר יִשְׁאֲב֖וּ/ן הַ/נְּעָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/009.yaml
  text: Keep your eyes on the field where they are harvesting[a], and follow behind them. Have I not commanded the young men not to touch you? When you are thirsty, go to the jars and drink from what the young men have drawn.
translation:
  language: id
  text: Arahkan pandanganmu pada ladang tempat para pekerja perempuan itu sedang menuai, lalu ikutilah mereka dari belakang. Bukankah aku sudah memerintahkan para pekerja laki-laki agar tidak menyentuhmu[a]? Bila engkau haus, pergilah ke tempayan-tempayan dan minumlah air yang telah mereka timba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, sesuai konteks, “agar tidak mengusikmu.” Kata Ibrani ini secara harfiah berarti “menyentuh” dan di sini dapat mencakup perlindungan dari gangguan, pelecehan, atau serangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינַיִךְ בַּשָּׂדֶה
  choice: Arahkan pandanganmu pada ladang
  rationale: Secara harfiah berbunyi ‘matamu pada ladang’, dengan daya perintah yang tersirat. Ungkapan ini menyatakannya secara wajar dalam bahasa Indonesia sambil mempertahankan gagasan perhatian yang terarah.
- source_word: אֲשֶׁר יִקְצֹרוּן
  choice: yang sedang mereka tuai
  rationale: Bentuk verba menggambarkan kegiatan menuai yang sedang berlangsung. ‘Menuai’ dekat dengan istilah sumber dan tetap lazim dipahami.
- source_word: וְהָלַכְתִּ אַחֲרֵיהֶן
  choice: lalu ikutilah para pekerja perempuan itu dari belakang
  rationale: Akhiran pronomina Ibrani berbentuk feminin jamak dan merujuk kepada kelompok pekerja perempuan. Penyebutan eksplisit dalam bahasa Indonesia mempertahankan pembedaan gender yang terdapat dalam teks sumber, sedangkan ‘dari belakang’ menjaga hubungan spasial אַחֲרֵי.
- source_word: הֲלוֹא צִוִּיתִי
  choice: Bukankah aku sudah memerintahkan
  rationale: Mempertahankan bentuk pertanyaan retoris yang berfungsi meyakinkan Rut serta kewibawaan perintah Boas.
- source_word: הַנְּעָרִים
  choice: para pekerja laki-laki
  rationale: Dalam konteks ini kata tersebut menunjuk kepada pekerja laki-laki milik Boas. Pilihan ini membedakan mereka dari kelompok feminin sebelumnya dan lebih kontekstual daripada sekadar ‘orang-orang muda’.
- source_word: לְבִלְתִּי נָגְעֵךְ
  choice: agar tidak menyentuhmu
  rationale: Menjaga arti dasar נגע, ‘menyentuh’, tanpa menutup kemungkinan bahwa konteksnya mencakup gangguan, pelecehan, atau kekerasan; cakupan itu dijelaskan dalam catatan kaki.
- source_word: וְצָמִת
  choice: Bila engkau haus
  rationale: Menyatakan keadaan yang menjadi dasar bagi petunjuk berikutnya. ‘Bila’ mempertahankan nuansa situasional tanpa menegaskan apakah rasa haus itu pasti terjadi.
- source_word: הַכֵּלִים
  choice: tempayan-tempayan
  rationale: כֵּלִים berarti wadah atau bejana secara umum; dalam konteks persediaan air minum, ‘tempayan’ merupakan padanan konkret dan alami.
- source_word: וְשָׁתִית מֵאֲשֶׁר יִשְׁאֲבוּן הַנְּעָרִים
  choice: minumlah air yang telah mereka timba
  rationale: Air tersirat dari tindakan menimba dan minum. Penambahan ‘air’ membuat kalimat Indonesia alami, sedangkan ‘telah ... timba’ menunjukkan tindakan yang mendahului kegiatan minum. Kata ‘mereka’ merujuk kembali kepada para pekerja laki-laki yang baru disebut.
