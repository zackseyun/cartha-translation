base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/011.yaml
  text: Then Boaz answered and said to her[a], “I have been fully told all that you have done for your mother-in-law after the death of your husband, and how you left your father and your mother and the land of your birth, and went to a people whom you did not know before.”
translation:
  language: id
  text: Lalu Boas menjawab dan berkata kepadanya, “Aku telah diberi tahu dengan jelas segala yang telah kaulakukan bagi ibu mertuamu setelah suamimu meninggal, dan bagaimana engkau telah meninggalkan ayahmu, ibumu, serta tanah kelahiranmu, lalu pergi kepada suatu bangsa yang sebelumnya tidak kaukenal.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang tidak kaukenal kemarin atau kemarin dulu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֻגֵּד הֻגַּד לִי
  choice: Aku telah mendengar dengan lengkap
  rationale: Gabungan infinitif absolut dan bentuk Hophal dari נגד memberi penegasan pada laporan yang diterima Boas. Ungkapan ini menyampaikan bahwa segala hal itu telah diberitahukan kepadanya secara menyeluruh, dengan bahasa Indonesia yang alami.
- source_word: כֹּל אֲשֶׁר עָשִׂית אֶת חֲמוֹתֵךְ
  choice: segala yang telah kaulakukan bagi ibu mertuamu
  rationale: כֹּל dipertahankan dengan “segala,” sedangkan penanda objek אֶת diterjemahkan secara idiomatis sebagai “bagi” karena konteks menunjukkan tindakan yang dilakukan demi kepentingan ibu mertua.
- source_word: אַחֲרֵי מוֹת אִישֵׁךְ
  choice: setelah suamimu meninggal
  rationale: Terjemahan verbal ini alami dalam bahasa Indonesia modern dan menyampaikan secara tepat frasa nominal Ibrani “setelah kematian suamimu.”
- source_word: וַתַּעַזְבִי אָבִיךְ וְאִמֵּךְ
  choice: engkau telah meninggalkan ayahmu, ibumu
  rationale: Masing-masing orang tua tetap disebut secara tersendiri sebagaimana dalam teks Ibrani. “Meninggalkan” netral dan sesuai dengan konteks perjalanan Rut.
- source_word: וְאֶרֶץ מוֹלַדְתֵּךְ
  choice: serta tanah kelahiranmu
  rationale: מוֹלֶדֶת di sini menunjuk pada negeri atau tempat asal. “Tanah kelahiranmu” dekat dengan bentuk sumber sekaligus jelas dalam bahasa Indonesia.
- source_word: וַתֵּלְכִי אֶל עַם
  choice: lalu pergi kepada suatu bangsa
  rationale: “Pergi” mempertahankan sudut pandang verba הלך, sedangkan עַם menunjuk pada kelompok etnis atau masyarakat. “Bangsa” alami dalam konteks perpindahan Rut kepada umat Israel tanpa harus menekankan negara politik.
- source_word: אֲשֶׁר לֹא יָדַעַתְּ
  choice: yang sebelumnya tidak kaukenal
  rationale: ידע menyatakan pengenalan atau keakraban pribadi. “Tidak kaukenal” lebih tepat daripada ungkapan yang hanya menunjuk pada pengetahuan faktual.
- source_word: תְּמוֹל שִׁלְשׁוֹם
  choice: sebelumnya
  rationale: Ungkapan harfiah “kemarin dan hari sebelumnya” merupakan idiom bagi masa lampau atau keadaan terdahulu. “Sebelumnya” menyampaikan maksudnya secara wajar; bentuk harfiah dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Sapaan “engkau” dipakai untuk dialog naratif yang sopan dan konsisten; bentuk terikat “kau-” digunakan secara baku pada verba. Pengulangan formula “menjawab dan berkata” dipertahankan karena mencerminkan struktur naratif Ibrani.
