    issue: Klausa pembuka menerjemahkan bentuk pasif intensif sebagai tindakan aktif mendengar.
    rationale: הֻגֵּד הֻגַּד לִי secara harfiah menyatakan bahwa sesuatu telah berulang kali/sepenuhnya diberitahukan kepada Boas. 'Aku telah diberi tahu dengan jelas' menjaga valensi pasif dan penegasannya.
  - severity: low
    issue: '''Dan bahwa engkau telah meninggalkan'' kurang langsung dan kurang selaras dengan kelanjutan ''dan bagaimana'' dalam audit Inggris.'
    rationale: Konteksnya memerinci isi laporan tentang tindakan Rut; 'dan bagaimana engkau telah meninggalkan' menghubungkan rincian itu secara lebih alami tanpa menambah makna.
  - severity: low
    issue: Catatan kaki tidak memberikan idiom waktu Ibrani secara paling tepat dan alami.
    rationale: תְּמוֹל שִׁלְשׁוֹם berarti 'kemarin atau kemarin dulu'; 'sehari sebelumnya' dapat dibaca relatif terhadap waktu tutur, bukan sebagai idiom tetap.
