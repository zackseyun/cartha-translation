  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תֹּ֖אמֶר ר֣וּת הַ/מּוֹאֲבִיָּ֑ה גַּ֣ם כִּי אָמַ֣ר אֵלַ֗/י עִם הַ/נְּעָרִ֤ים אֲשֶׁר לִ/י֙ תִּדְבָּקִ֔י/ן עַ֣ד אִם כִּלּ֔וּ אֵ֥ת כָּל הַ/קָּצִ֖יר אֲשֶׁר לִֽ/י׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/021.yaml
  text: Then Ruth the Moabite said[a], “He also said to me, ‘You are to stay close by my young women until they have finished all my harvest.’”
translation:
  language: id
  text: Lalu Rut, perempuan Moab itu, berkata, “Ia juga berkata kepadaku, ‘Tetaplah dekat dengan para pekerja mudaku[a] sampai mereka menyelesaikan seluruh panenku.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “para pemudaku.” Kata Ibrani di sini berbentuk maskulin, berbeda dari sebutan “para pekerja perempuan” dalam ayat 8 dan 22.
    reason: Menjaga perbedaan bentuk gender dalam teks Ibrani dan mencegah penyelarasan diam-diam dengan konteks terdekat.
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk waw-konsekutif melanjutkan urutan cerita; “lalu” menghasilkan alur naratif yang alami dalam bahasa Indonesia.
- source_word: רוּת הַמּוֹאֲבִיָּה
  choice: Rut, perempuan Moab itu
  rationale: Nama diri ditransliterasikan dalam bentuk Indonesia yang lazim, sedangkan sebutan asal-usulnya dinyatakan secara alami dan jelas.
- source_word: גַּם כִּי אָמַר אֵלַי
  choice: Ia juga berkata kepadaku
  rationale: גַּם menyatakan tambahan pada laporan Rut; “juga” mempertahankan fungsi wacananya tanpa memberi penekanan berlebihan.
- source_word: עִם הַנְּעָרִים אֲשֶׁר לִי
  choice: dengan para pekerja mudaku
  rationale: נְעָרִים berbentuk maskulin dan secara harfiah menunjuk para pemuda, tetapi dalam konteks panen juga dapat berfungsi sebagai sebutan bagi para pekerja muda. Pilihan ini alami dalam bahasa Indonesia sambil mempertahankan unsur usia dan hubungan kerja; catatan kaki menjelaskan bentuk maskulinnya.
- source_word: תִּדְבָּקִין
  choice: Tetaplah dekat
  rationale: דבק menyatakan melekat atau menjaga kedekatan. Dalam konteks petunjuk kerja dan perlindungan, “tetaplah dekat” menyampaikan maknanya secara wajar tanpa kekakuan harfiah.
- source_word: עַד אִם כִּלּוּ
  choice: sampai mereka menyelesaikan
  rationale: Ungkapan ini menetapkan batas akhir tindakan, yaitu ketika pekerjaan panen telah dituntaskan.
- source_word: אֵת כָּל הַקָּצִיר אֲשֶׁר לִי
  choice: seluruh panenku
  rationale: Terjemahan ringkas ini mempertahankan cakupan menyeluruh dan kepemilikan yang dinyatakan dalam bahasa Ibrani.
theological_decisions:
- issue: Jenis kelamin kelompok yang disebut Rut
  choice: Teks utama menerjemahkan נְעָרִים sebagai “para pekerja muda” dan catatan kaki menyatakan bahwa bentuk Ibraninya maskulin.
  alternative: “para pekerja perempuan” atau “gadis-gadisku,” mengikuti konteks Rut 2:8 dan 2:22.
  rationale: Dalam ayat ini naskah WLC memakai bentuk maskulin נְעָרִים, berbeda dari bentuk feminin di ayat 8 dan 22. Perbedaan tekstual tersebut tidak boleh diselaraskan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Dialog dibuat alami tanpa menghilangkan pengulangan dan ketegangan tekstual dalam sumber Ibrani.
