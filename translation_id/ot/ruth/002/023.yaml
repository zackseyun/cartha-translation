  text: וַ/תִּדְבַּ֞ק בְּ/נַעֲר֥וֹת בֹּ֨עַז֙ לְ/לַקֵּ֔ט עַד כְּל֥וֹת קְצִֽיר הַ/שְּׂעֹרִ֖ים וּ/קְצִ֣יר הַֽ/חִטִּ֑ים וַ/תֵּ֖שֶׁב אֶת חֲמוֹתָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/023.yaml
  text: So she stayed close to Boaz's young women to glean[a], until the end of the barley harvest and the wheat harvest[b]. And she lived with her mother-in-law.
translation:
  language: id
  text: Demikianlah Rut tetap dekat dengan para pekerja perempuan Boas untuk memungut bulir-bulir yang tertinggal[a], sampai berakhirnya panen jelai dan panen gandum. Ia tinggal bersama ibu mertuanya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk mengais.” Ini merujuk pada mengumpulkan bulir-bulir yang tertinggal di ladang setelah penuaian.
    reason: cultural_clarification
  - marker: b
    text: Atau “Ia menetap” atau “Ia tetap berada bersama ibu mertuanya.” Kata Ibrani yang dipakai dapat berarti “tinggal,” “menetap,” atau “tetap berada,” bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּדְבַּק
  choice: tetap dekat
  rationale: Kata kerja דבק menyatakan melekat atau berpegang erat. Dalam konteks ini, frasa ini secara alami menyampaikan bahwa Rut terus bergabung dekat dengan para pekerja perempuan Boas tanpa menyiratkan kontak fisik.
- source_word: בְּנַעֲרוֹת בֹּעַז
  choice: dengan para pekerja perempuan Boas
  rationale: נַעֲרוֹת secara harfiah dapat berarti para perempuan muda, tetapi dalam konteks ladang Boas mereka adalah para pekerja perempuan. Pilihan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: לְלַקֵּט
  choice: untuk memungut sisa-sisa panen
  rationale: Infinitif ini menyatakan tujuan. Ungkapan ini menerangkan praktik mengumpulkan bulir yang tertinggal sesudah para penuai bekerja, dan lebih mudah dipahami pembaca umum daripada istilah teknis.
- source_word: עַד כְּלוֹת
  choice: sampai berakhirnya
  rationale: Konstruksi ini menunjukkan berlangsungnya kegiatan hingga suatu masa selesai.
- source_word: קְצִיר הַשְּׂעֹרִים וּקְצִיר הַחִטִּים
  choice: panen jelai dan panen gandum
  rationale: Terjemahan langsung ini mempertahankan penyebutan kedua musim panen dan menunjukkan lamanya Rut bekerja di ladang.
- source_word: וַתֵּשֶׁב
  choice: ia tetap tinggal
  rationale: ישב dapat berarti duduk, menetap, tinggal, atau tetap berada. Dalam konteks ini, 'tetap tinggal' secara alami menyatakan bahwa Rut terus hidup serumah dengan Naomi sambil mempertahankan nuansa keberlanjutan.
- source_word: אֶת חֲמוֹתָהּ
  choice: bersama ibu mertuanya
  rationale: Dengan kata kerja ישב, ungkapan ini menunjukkan tinggal bersama seseorang; bahasa Indonesia secara alami memakai 'bersama'.
