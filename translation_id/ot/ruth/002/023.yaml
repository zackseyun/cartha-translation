translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif. Nama tanaman שְׂעֹרִים diterjemahkan 'jelai'. 'Pekerja perempuan' dipilih daripada 'perempuan muda' karena fungsi mereka di ladang menonjol dalam konteks, sedangkan catatan kaki menjelaskan istilah budaya memungut sisa panen.
