  text: וְ/הִנֵּה בֹ֗עַז בָּ֚א מִ/בֵּ֣ית לֶ֔חֶם וַ/יֹּ֥אמֶר לַ/קּוֹצְרִ֖ים יְהוָ֣ה עִמָּ/כֶ֑ם וַ/יֹּ֥אמְרוּ ל֖/וֹ יְבָרֶכְ/ךָ֥ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/004.yaml
  text: And behold[a], Boaz came from Bethlehem and said to the reapers, “Yahweh be with you.” And they said to him[b], “May Yahweh bless you.”
translation:
  language: id
  text: Lihatlah, Boas datang dari Betlehem dan berkata kepada para penuai, “Kiranya Yahweh menyertai kalian.” Mereka menjawab, “Kiranya Yahweh memberkati engkau.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Lihatlah
  rationale: Partikel penunjuk ini menghidupkan peralihan adegan dan menarik perhatian pembaca. “Lihatlah” mempertahankan fungsi tersebut dalam bahasa Indonesia yang wajar dan bermartabat; hubungan naratif waw tidak perlu diterjemahkan secara mekanis dengan “dan” pada awal kalimat.
- source_word: בֹּעַז
  choice: Boas
  rationale: Menggunakan bentuk nama yang sudah mapan dalam tradisi Alkitab berbahasa Indonesia.
- source_word: בָּא מִבֵּית לֶחֶם
  choice: datang dari Betlehem
  rationale: Menerjemahkan verba dan frasa asal secara langsung serta alami.
- source_word: לַקֹּצְרִים
  choice: kepada para penuai
  rationale: Partisipel dari קצר menunjuk kepada orang-orang yang sedang menuai; “para penuai” tepat dan sesuai dengan latar pertanian.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang dinyatakan oleh Tetragramaton, bukan menggantinya dengan gelar.
- source_word: יְהוָה עִמָּכֶם
  choice: Kiranya Yahweh menyertai kalian
  rationale: Klausa Ibrani tanpa verba secara harfiah berarti “Yahweh bersama kalian,” tetapi dalam konteks sapaan mengandung harapan atau berkat. “Kiranya ... menyertai” menyampaikan daya benediktifnya secara alami.
- source_word: יְבָרֶכְךָ יְהוָה
  choice: Kiranya Yahweh memberkati engkau
  rationale: Bentuk verba menyatakan harapan atau berkat. “Kiranya” memperjelas nuansa volitif, sedangkan “engkau” mempertahankan objek tunggal maskulin yang merujuk kepada Boas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian YHWH secara langsung. Bentuk “Yahweh” mempertahankan nama pribadi itu tanpa mengubahnya menjadi gelar.
- issue: Daya ujar יְהוָה עִמָּכֶם
  choice: 'Sapaan berkat: “Kiranya Yahweh menyertai kalian”'
  alternative: 'Pernyataan: “Yahweh menyertai kalian”'
  rationale: Dalam pertukaran salam ini, klausa nominal tersebut paling wajar dipahami sebagai doa atau berkat, sambil tetap mengakui bahwa bentuk Ibraninya sendiri tidak memuat verba eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Kalian” membedakan sapaan jamak kepada para penuai, sedangkan “engkau” menandai jawaban tunggal kepada Boas. Tidak digunakan catatan kaki karena nuansa utama dapat disampaikan langsung dalam teks.
