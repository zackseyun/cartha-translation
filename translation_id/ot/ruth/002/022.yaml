  register: Bahasa Indonesia modern yang alami dan bermartabat. Sapaan “engkau” mempertahankan keakraban keluarga tanpa menjadi terlalu sehari-hari. Penanda catatan kaki ditempatkan setelah kutipan yang diterangkannya.
