  text: וַ/תֹּ֥אמֶר נָעֳמִ֖י אֶל ר֣וּת כַּלָּתָ֑/הּ ט֣וֹב בִּתִּ֗/י כִּ֤י תֵֽצְאִי֙ עִם נַ֣עֲרוֹתָ֔י/ו וְ/לֹ֥א יִפְגְּעוּ בָ֖/ךְ בְּ/שָׂדֶ֥ה אַחֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/022.yaml
  text: Then Naomi said to Ruth her daughter-in-law[a], “It is good, my daughter, that you go out with his young women, so that they do not come upon you in another field.”
translation:
  language: id
  text: Lalu Naomi berkata kepada Rut, menantunya, “Adalah baik, anakku, jika engkau pergi bersama para perempuan muda yang bekerja pada Boas, supaya engkau tidak diganggu di ladang lain.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “supaya tidak ada yang menjumpaimu di ladang lain.” Kata kerja Ibrani yang dipakai dapat berarti sekadar bertemu atau berjumpa, tetapi juga dapat menunjuk pada tindakan mengganggu atau menyerang. Kekhawatiran Naomi akan keselamatan Rut mendukung arti negatif dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk waw-konsekutif melanjutkan urutan cerita; “lalu” menyampaikan alur naratif secara alami dalam bahasa Indonesia.
- source_word: כַּלָּתָהּ
  choice: menantunya
  rationale: Nomina dengan sufiks orang ketiga feminin tunggal menyatakan hubungan Rut dengan Naomi secara langsung.
- source_word: טוֹב
  choice: Sebaiknya
  rationale: Dalam konteks nasihat, ungkapan ini secara alami menyampaikan penilaian Naomi bahwa tindakan tersebut baik, tanpa menjadikannya suatu keharusan mutlak.
- source_word: בִּתִּי
  choice: anakku
  rationale: Sapaan penuh kasih dalam hubungan keluarga; bukan pernyataan bahwa Rut adalah anak kandung Naomi.
- source_word: כִּי תֵצְאִי
  choice: engkau pergi
  rationale: כִּי memperkenalkan isi penilaian Naomi, sedangkan תֵצְאִי berarti “pergi/keluar”; kegiatan memungut jelai tidak ditambahkan karena tidak dinyatakan dalam verba ini.
- source_word: נַעֲרוֹתָיו
  choice: para pekerja perempuan Boas
  rationale: Kata feminin jamak menunjuk kepada perempuan-perempuan muda yang bekerja bagi Boas. Nama Boas dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia; “pekerja perempuan” menyampaikan peran kontekstual tanpa gaya arkais.
- source_word: וְלֹא יִפְגְּעוּ בָךְ
  choice: supaya engkau tidak diganggu
  rationale: פגע dapat berarti bertemu atau mengalami perjumpaan yang merugikan. Konteks kekhawatiran akan keselamatan Rut mendukung nuansa negatif, tetapi catatan kaki mempertahankan keluasan makna Ibraninya.
- source_word: בְּשָׂדֶה אַחֵר
  choice: di ladang lain
  rationale: Padanan lokatif yang langsung, ringkas, dan alami.
theological_decisions: []
