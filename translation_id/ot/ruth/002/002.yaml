base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/002.yaml
  text: And Ruth the Moabite said to Naomi[a], “Please let me go to the field and glean among the ears of grain after him in whose eyes I find favor.” And she said to her, “Go[b], my daughter.”
translation:
  language: id
  text: Rut, perempuan Moab itu, berkata kepada Naomi, “Izinkanlah aku pergi ke ladang dan memungut bulir-bulir yang tertinggal di belakang orang yang berkenan kepadaku[a].” Naomi menjawab, “Pergilah, anakku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di belakang orang yang di matanya aku mendapat perkenanan.” Ini adalah ungkapan Ibrani untuk memperoleh penerimaan atau perlakuan baik dari seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמּוֹאֲבִיָּה
  choice: perempuan Moab itu
  rationale: Bentuk nisbah feminin ini menandai asal-usul etnis Rut. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan penekanan narasi bahwa ia orang asing.
- source_word: אֵלְכָה נָּא
  choice: Izinkanlah aku pergi
  rationale: Bentuk kohortatif dengan נָא menyatakan permohonan yang sopan kepada Naomi, bukan sekadar tindakan pada masa depan.
- source_word: הַשָּׂדֶה
  choice: ladang
  rationale: Padanan langsung dan alami untuk lahan pertanian tempat panen berlangsung.
- source_word: וַאֲלַקֳטָּה
  choice: memungut ... yang tertinggal
  rationale: Dalam konteks panen, לקט berarti memungut hasil yang tertinggal sesudah para penuai. Ungkapan deskriptif ini lebih mudah dipahami pembaca umum daripada istilah teknis yang jarang dipakai.
- source_word: בַשִּׁבֳּלִים
  choice: bulir-bulir
  rationale: שִׁבֳּלִים menunjuk pada bulir atau kepala biji-bijian, bukan berkas-berkas yang sudah diikat. Jenis tanamannya tidak ditambahkan di sini karena kata Ibrani pada ayat ini bersifat umum.
- source_word: אַחַר אֲשֶׁר אֶמְצָא חֵן בְּעֵינָיו
  choice: di belakang orang yang bermurah hati kepadaku
  rationale: Terjemahan ini menyampaikan tindakan memungut di belakang pihak yang memberi penerimaan atau izin, sedangkan bentuk harfiah idiom Ibraninya dipertahankan dalam catatan kaki. Kata ganti maskulin tunggal tidak dipaksakan menjadi penanda gender dalam bahasa Indonesia karena rujukannya belum ditentukan secara khusus.
- source_word: לְכִי בִתִּי
  choice: Pergilah, anakku
  rationale: Mempertahankan perintah sederhana sekaligus sapaan Naomi yang hangat dan penuh kasih.
