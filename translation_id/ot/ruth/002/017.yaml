  text: וַ/תְּלַקֵּ֥ט בַּ/שָּׂדֶ֖ה עַד הָ/עָ֑רֶב וַ/תַּחְבֹּט֙ אֵ֣ת אֲשֶׁר לִקֵּ֔טָה וַ/יְהִ֖י כְּ/אֵיפָ֥ה שְׂעֹרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/002/017.yaml
  text: So she gleaned in the field until evening[a], and beat out what she had gleaned, and it was about an ephah of barley.
translation:
  language: id
  text: Ia pun memungut jelai di ladang itu sampai petang. Kemudian ia merontokkan apa yang telah dipungutnya, dan hasilnya kira-kira satu efa[a] jelai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Efa adalah satuan takaran kering pada zaman dahulu, kira-kira 20–22 liter.
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּלַקֵּט
  choice: Ia pun memungut jelai
  rationale: Kata לקט dalam konteks ini berarti memungut sisa bulir yang ditinggalkan para penuai. Ungkapan “memungut jelai” menyampaikan kegiatan itu secara alami dalam bahasa Indonesia; “pun” melanjutkan alur narasi dari ayat sebelumnya.
- source_word: בַּשָּׂדֶה
  choice: di ladang itu
  rationale: Kata שׂדה menunjuk pada ladang tempat ia sedang bekerja. Demonstrativa “itu” secara alami menyampaikan artikel tertentu bahasa Ibrani dalam konteks ini.
- source_word: עַד הָעָרֶב
  choice: sampai petang
  rationale: Ungkapan ini menandai batas waktu pekerjaannya dan diterjemahkan secara langsung serta wajar.
- source_word: וַתַּחְבֹּט
  choice: Kemudian ia merontokkan
  rationale: Kata חבט menggambarkan tindakan memukul hasil pungutan untuk melepaskan biji dari tangkai atau sekam. “Merontokkan” menyatakan hasil tindakan tersebut dengan tepat dan alami, tanpa memberi kesan penggunaan alat pengirikan besar.
- source_word: אֵת אֲשֶׁר לִקֵּטָה
  choice: apa yang telah dipungutnya
  rationale: Terjemahan ini mempertahankan konstruksi relatif dan hubungan dengan kegiatan memungut sebelumnya.
- source_word: וַיְהִי
  choice: dan hasilnya
  rationale: Dalam konteks ini klausa tersebut menyatakan jumlah yang diperoleh setelah jelai dirontokkan. “Hasilnya” membuat rujukannya jelas tanpa menambah unsur substantif.
- source_word: כְּאֵיפָה
  choice: kira-kira satu efa
  rationale: Prefiks כ־ menyatakan perkiraan, sedangkan אֵיפָה adalah satuan takaran kering kuno. Nama satuan dipertahankan dan dijelaskan dalam catatan kaki.
- source_word: שְׂעֹרִים
  choice: jelai
  rationale: שׂערים berarti jelai; bentuk ringkas ini alami setelah penyebutan takaran.
