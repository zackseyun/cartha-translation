translation:
  language: id
  text: Lalu Boas berkata kepada pemudanya yang ditugaskan untuk mengawasi para penuai, “Perempuan muda ini milik siapa?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Milik siapakah perempuan muda ini?” Pertanyaan Ibrani ini dapat merujuk pada afiliasi atau hubungan rumah tangganya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... bertanya
  rationale: Bentuk naratif ini melanjutkan urutan peristiwa. Kata kerja Ibrani secara dasar berarti ‘berkata’, tetapi karena ucapan langsungnya berupa pertanyaan, ‘bertanya’ lebih alami dalam bahasa Indonesia tanpa mengubah fungsi tuturan.
- source_word: בֹּעַז
  choice: Boas
  rationale: Nama pribadi ini mengikuti bentuk yang lazim digunakan dalam Alkitab bahasa Indonesia.
- source_word: לְנַעֲרוֹ
  choice: kepada pemuda
  rationale: נַעַר dapat berarti pemuda, pelayan, atau pembantu. ‘Pemuda’ mempertahankan arti leksikal yang tidak secara tersurat menentukan statusnya; hubungan tugasnya dijelaskan oleh frasa berikutnya.
- source_word: הַנִּצָּב עַל הַקּוֹצְרִים
  choice: yang ditugaskan mengawasi para penuai
  rationale: Partisipel pasif נִצָּב dengan עַל menunjukkan bahwa pemuda itu ditempatkan atau ditetapkan atas para penuai. Pilihan ini mempertahankan nuansa penugasan sekaligus menyatakan fungsi pengawasannya secara alami.
- source_word: לְמִי
  choice: dari keluarga siapa
  rationale: Ungkapan ini secara harfiah menanyakan ‘milik siapa’, tetapi dalam konteks sosial kuno dapat menanyakan afiliasi rumah tangga atau keluarga. Terjemahan utama menghindari kesan bahwa perempuan itu sekadar barang milik, sementara catatan kaki mempertahankan bentuk dan cakupan ungkapan Ibraninya.
- source_word: הַנַּעֲרָה הַזֹּאת
  choice: perempuan muda itu
  rationale: נַעֲרָה menunjuk perempuan muda tanpa dengan sendirinya menetapkan status sebagai pelayan. Demonstratif diterjemahkan ‘itu’, bentuk yang alami ketika penutur menunjuk orang yang sedang diamati.
