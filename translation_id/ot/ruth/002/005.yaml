translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. ‘Ditugaskan mengawasi’ menyampaikan baik nuansa pasif maupun peran pengawasan tanpa memakai istilah jabatan modern seperti ‘mandor’. Pertanyaan utama dibuat alami dalam bahasa Indonesia, sementara ambiguitas sosial ungkapan Ibrani dipertahankan dalam catatan kaki.
