  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָ֤יָה לָ/ךְ֙ לְ/מֵשִׁ֣יב נֶ֔פֶשׁ וּ/לְ/כַלְכֵּ֖ל אֶת שֵׂיבָתֵ֑/ךְ כִּ֣י כַלָּתֵ֤/ךְ אֲֽשֶׁר אֲהֵבַ֨תֶ/ךְ֙ יְלָדַ֔תּ/וּ אֲשֶׁר הִיא֙ ט֣וֹבָה לָ֔/ךְ מִ/שִּׁבְעָ֖ה בָּנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/015.yaml
  text: And he will be to you a restorer of life and a sustainer of your old age[a], for your daughter-in-law, who loves you[c][b], has borne him—she who is better to you than seven sons.
translation:
  language: id
  text: Ia akan memulihkan hidupmu[a] dan menopangmu pada masa tuamu[b], sebab menantumu yang mengasihimu telah melahirkannya—dia yang lebih berharga bagimu daripada tujuh anak laki-laki.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “memulihkan hidup/nyawa”; dapat juga diterjemahkan “memulihkan dirimu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani secara harfiah: “ubanmu,” yaitu masa tuamu.'
    reason: lexical_alternative
  - marker: c
    text: Angka tujuh sering melambangkan kepenuhan atau kelengkapan. Maksudnya, Rut lebih berharga bagi Naomi daripada berkat ideal berupa banyak anak laki-laki.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: Ia akan
  rationale: Bentuk perfek dengan waw dalam konteks berfungsi sebagai pernyataan hasil atau masa depan dalam ucapan para perempuan mengenai anak itu; “akan” mempertahankan nuansa prediktif secara alami.
- source_word: לְמֵשִׁיב נֶפֶשׁ
  choice: memulihkan hidupmu
  rationale: מֵשִׁיב menyatakan tindakan mengembalikan atau memulihkan, sedangkan נֶפֶשׁ di sini menunjuk pada hidup atau diri Naomi, bukan secara khusus jiwa sebagai unsur tak berjasmani. Akhiran orang kedua yang tersirat secara relasional dinyatakan agar alami dalam bahasa Indonesia.
- source_word: וּלְכַלְכֵּל
  choice: dan menopangmu
  rationale: Bentuk ini bermakna memelihara, mencukupi, atau menopang. “Menopangmu” mencakup pemeliharaan berkelanjutan tanpa membatasi maknanya pada makanan atau nafkah saja.
- source_word: אֶת שֵׂיבָתֵךְ
  choice: pada masa tuamu
  rationale: שֵׂיבָה secara harfiah berkaitan dengan uban, tetapi secara idiomatis berarti usia tua. “Pada masa tuamu” menyampaikan maksud Ibrani dengan wajar.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi pernyataan sebelumnya; “sebab” mempertahankan hubungan penjelasannya dalam ragam sastra yang alami.
- source_word: כַלָּתֵךְ
  choice: menantumu
  rationale: Dalam konteks Kitab Rut, kata ini menunjuk kepada Rut sebagai menantu perempuan Naomi. Bahasa Indonesia lazim memakai “menantu” tanpa perlu menambahkan jenis kelamin karena identitasnya jelas.
- source_word: אֲשֶׁר אֲהֵבַתֶךְ
  choice: yang mengasihimu
  rationale: Perfek Ibrani menggambarkan kasih yang telah terbukti dan tetap nyata. Bentuk kini “mengasihimu” menyatakan hubungan yang berkelanjutan dengan register yang bermartabat.
- source_word: יְלָדַתּוּ
  choice: telah melahirkannya
  rationale: Akhiran maskulin tunggal paling wajar mengacu kepada anak yang sedang dibicarakan. Bentuk ini tidak menambahkan objek “anak laki-laki” pada klausa tersebut, meskipun konteks menyatakan jenis kelaminnya.
- source_word: אֲשֶׁר הִיא טוֹבָה לָךְ
  choice: dia yang lebih berharga bagimu
  rationale: טוֹבָה dengan pembanding מן menyatakan keunggulan nilai atau manfaat. “Lebih berharga bagimu” lebih alami daripada “lebih baik bagimu” dan mempertahankan nuansa relasional.
- source_word: מִשִּׁבְעָה בָּנִים
  choice: daripada tujuh anak laki-laki
  rationale: Teks Ibrani secara eksplisit menyebut tujuh anak laki-laki. Ungkapan ini dipertahankan karena mencerminkan gambaran kepenuhan berkat serta peran sosial anak laki-laki dalam konteks kuno.
theological_decisions:
- issue: Makna נֶפֶשׁ
  choice: hidupmu
  alternative: jiwamu; dirimu
  rationale: Konteksnya adalah pemulihan kehidupan Naomi dan pemeliharaan pada masa tua, bukan uraian mengenai jiwa sebagai unsur tak berjasmani. “Hidupmu” mempertahankan arti konkret dan menghindari pemasukan kategori teologis yang tidak dituntut teks.
- issue: Perbandingan yang bergender dalam מִשִּׁבְעָה בָּנִים
  choice: tujuh anak laki-laki
  alternative: tujuh anak; tujuh putra
  rationale: Bahasa Ibrani secara eksplisit bergender maskulin, dan perbandingan itu mencerminkan harapan sosial kuno mengenai anak laki-laki sebagai penerus dan penopang pada masa tua. Bentuk maskulin karena itu tidak dinetralkan.
- issue: Subjek וְהָיָה dan rujukan יְלָדַתּוּ
  choice: anak yang baru lahir sebagai pihak yang akan memulihkan dan menopang Naomi
  alternative: Boas sebagai pihak yang akan memulihkan dan menopang Naomi
  rationale: Konteks terdekat berpusat pada anak yang diletakkan di pangkuan Naomi, dan akhiran maskulin pada יְלָדַתּוּ secara alami merujuk kepadanya. Terjemahan memakai “Ia” dan “-nya” tanpa menambahkan nama, sehingga kohesi teks tetap dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang hangat dan bermartabat. Pronomina “Ia” mempertahankan rujukan kepada anak tanpa pengulangan yang berat. “Mengasihimu” dipilih alih-alih “mencintaimu” agar sesuai dengan register Alkitabiah modern tanpa terasa usang. Semua penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
