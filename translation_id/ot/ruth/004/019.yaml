base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/019.yaml
  text: Hezron fathered Ram, and Ram fathered Amminadab.
translation:
  language: id
  text: Hezron memperanakkan Ram, dan Ram memperanakkan Aminadab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/חֶצְרוֹן
  choice: Hezron
  rationale: Nama diri ditransliterasikan menurut bentuk yang sudah lazim dalam Alkitab bahasa Indonesia; konjungsi awal tidak dinyatakan tersendiri karena ayat ini merupakan kelanjutan langsung dari silsilah pada ayat sebelumnya.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dalam konteks silsilah berarti menjadi ayah atau menghasilkan keturunan. 'Memperanakkan' ringkas, lazim dalam silsilah Alkitab bahasa Indonesia, dan mempertahankan fokus genealogis laki-laki.
- source_word: אֶת
  choice: '[tidak diterjemahkan tersendiri]'
  rationale: Penanda objek langsung bahasa Ibrani ini tidak mempunyai padanan leksikal tersendiri dalam bahasa Indonesia; fungsinya tampak melalui susunan kalimat.
- source_word: רָם
  choice: Ram
  rationale: Nama diri ditransliterasikan secara langsung dan sesuai dengan bentuk yang lazim dalam bahasa Indonesia.
- source_word: וְ/רָם
  choice: dan Ram
  rationale: Konjungsi וְ menghubungkan klausa silsilah kedua dan diterjemahkan secara eksplisit dengan 'dan'.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Pengulangan verba Ibrani dipertahankan dengan pilihan yang sama demi kesejajaran dan konsistensi silsilah.
- source_word: עַמִּינָדָב
  choice: Aminadab
  rationale: Nama diri diberikan dalam bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia; satu huruf m merupakan penyesuaian ejaan Indonesia, bukan penerjemahan makna nama.
