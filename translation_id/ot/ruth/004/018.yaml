base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/018.yaml
  text: 'These are the generations of Perez: Perez fathered Hezron[a].'
translation:
  language: id
  text: 'Inilah keturunan Peres: Peres memperanakkan Hezron.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “garis keturunan Peres” atau “silsilah Peres.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Gabungan waw dan kata tunjuk ini memperkenalkan bagian silsilah baru. “Inilah” alami dalam bahasa Indonesia dan mempertahankan fungsi pengantar tanpa menambahkan makna temporal.
- source_word: תּוֹלְדוֹת
  choice: keturunan
  rationale: Dalam rumus silsilah, kata ini dapat menunjuk pada keturunan atau garis keluarga. “Keturunan” jelas dan wajar bagi pembaca modern, sekaligus sesuai dengan daftar yang menyusul.
- source_word: פָּרֶץ
  choice: Peres
  rationale: Nama diri ditransliterasikan langsung dari bentuk Ibrani menurut kelaziman bahasa Indonesia.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dalam silsilah berarti menjadi ayah atau menghasilkan keturunan. “Memperanakkan” ringkas, baku, dan mempertahankan corak formula silsilah.
- source_word: אֶת
  choice: '[penanda objek langsung, tidak diterjemahkan]'
  rationale: Partikel ini menandai objek langsung tertentu dalam bahasa Ibrani dan tidak memiliki padanan tersendiri dalam bahasa Indonesia.
- source_word: חֶצְרוֹן
  choice: Hezron
  rationale: Nama diri ditransliterasikan dari bahasa Ibrani menurut bentuk yang lazim dalam bahasa Indonesia.
