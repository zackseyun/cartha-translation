  yaml_path: translation/ot/ruth/004/021.yaml
  text: And Salmon fathered Boaz[a], and Boaz fathered Obed.
translation:
  language: id
  text: Dan Salmon memperanakkan Boas[a], dan Boas memperanakkan Obed.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjadi ayah dari.” Kata kerja Ibrani ini merupakan istilah silsilah yang berarti “memperanakkan” atau “menjadi ayah dari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שַׂלְמוֹן
  choice: Dan Salmon
  rationale: Kata penghubung וְ diterjemahkan sebagai “Dan” untuk mempertahankan kesinambungan serta pola berulang dalam silsilah. Nama שַׂלְמוֹן ditulis “Salmon” sesuai bentuk yang lazim dalam bahasa Indonesia.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד merupakan istilah baku dalam silsilah yang berarti memperoleh atau menjadi ayah dari seorang anak. “Memperanakkan” ringkas dan mempertahankan hubungan genealogis laki-laki dalam teks sumber.
- source_word: אֶת
  choice: '[tidak diterjemahkan]'
  rationale: אֶת adalah penanda objek langsung tertentu dalam bahasa Ibrani dan tidak memiliki padanan tersendiri yang perlu dinyatakan dalam bahasa Indonesia.
- source_word: בֹּעַז
  choice: Boas
  rationale: Nama pribadi ini menggunakan bentuk “Boas” yang telah lazim dalam tradisi penamaan Alkitab berbahasa Indonesia.
- source_word: וּ/בֹעַז
  choice: dan Boas
  rationale: Kata penghubung berawalan וּ diterjemahkan secara eksplisit sebagai “dan” untuk mempertahankan koordinasi dan irama silsilah Ibrani.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Istilah yang sama diulangi secara konsisten sebagaimana pengulangan kata kerja dalam teks Ibrani.
- source_word: עוֹבֵד
  choice: Obed
  rationale: Nama pribadi ditransliterasikan sebagai “Obed”, bentuk yang lazim dalam bahasa Indonesia.
theological_decisions: []
