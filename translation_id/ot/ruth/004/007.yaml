  text: וְ/זֹאת֩ לְ/פָנִ֨ים בְּ/יִשְׂרָאֵ֜ל עַל הַ/גְּאוּלָּ֤ה וְ/עַל הַ/תְּמוּרָה֙ לְ/קַיֵּ֣ם כָּל דָּבָ֔ר שָׁלַ֥ף אִ֛ישׁ נַעֲל֖/וֹ וְ/נָתַ֣ן לְ/רֵעֵ֑/הוּ וְ/זֹ֥את הַ/תְּעוּדָ֖ה בְּ/יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/007.yaml
  text: 'This was formerly the custom in Israel concerning redemption and exchange[a], to confirm any matter: a man removed his sandal and gave it to his neighbor[c][b], and this was the attestation in Israel.'
translation:
  language: id
  text: 'Beginilah kebiasaan dahulu di Israel mengenai penebusan dan pertukaran: untuk mengesahkan setiap perkara, seseorang menanggalkan sandalnya dan memberikannya kepada rekannya. Itulah tanda pengesahan di Israel.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Itulah kesaksian di Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנִים
  choice: dahulu
  rationale: Ungkapan ini menunjuk pada kebiasaan pada masa lampau; “dahulu” ringkas, alami, dan tidak menambahkan penanda waktu yang tidak ada dalam sumber.
- source_word: הַגְּאוּלָּה
  choice: penebusan
  rationale: Dalam konteks hukum kekerabatan Rut 4, kata ini menunjuk pada tindakan menebus atau membeli kembali hak/milik; “penebusan” mempertahankan istilah hukum utama tanpa mempersempitnya.
- source_word: הַתְּמוּרָה
  choice: pertukaran
  rationale: Kata ini bermakna pertukaran atau penggantian. “Pertukaran” mempertahankan arti leksikal yang luas dan sesuai dengan konteks transaksi.
- source_word: לְקַיֵּם כָּל דָּבָר
  choice: untuk mengesahkan setiap perkara
  rationale: לְקַיֵּם menyatakan peneguhan atau pengesahan, sedangkan כָּל דָּבָר tetap luas. “Setiap perkara” menjaga keluasan frasa Ibrani, meski konteksnya bersifat transaksional.
- source_word: שָׁלַף
  choice: menanggalkan
  rationale: Dengan kasut sebagai objek, “menanggalkan” merupakan ungkapan Indonesia yang wajar bagi tindakan melepaskan dari kaki.
- source_word: נַעֲלוֹ
  choice: kasutnya
  rationale: נַעַל menunjuk pada alas kaki jenis sandal. “Kasut” dipilih sebagai istilah Indonesia yang ringkas dan bermartabat untuk alas kaki kuno tersebut.
- source_word: לְרֵעֵהוּ
  choice: kepada sesamanya
  rationale: רֵעַ dapat berarti sesama, rekan, atau pihak lain. “Sesamanya” dekat dengan bentuk sumber dan tidak menentukan lebih jauh identitas pihak penerima.
- source_word: הַתְּעוּדָה
  choice: tanda pengesahan
  rationale: Dalam konteks ini kata tersebut menunjuk pada sarana atau tindakan yang menjadi bukti sahnya perkara. “Tanda pengesahan” lebih mudah dipahami pembaca umum daripada istilah teknis, sambil mempertahankan fungsi legal-evidensialnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif-hukum. Susunan kalimat dibuat alami tanpa menghilangkan penjelasan mengenai adat lama. Istilah “penebusan” dan “pertukaran” dipertahankan secara formal; “tanda pengesahan” dipakai agar fungsi tindakan simbolis itu jelas tanpa menambahkan rincian hukum yang tidak dinyatakan teks.
