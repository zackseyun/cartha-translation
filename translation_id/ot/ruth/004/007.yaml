  source_fidelity: 'Makna pokok dan urutan penjelasan adat dipertahankan dengan baik: adat lama di Israel, penebusan dan pertukaran, pengesahan perkara, pelepasan alas kaki, pemberiannya kepada pihak lain, lalu fungsi evidensialnya. Namun, “kasut” bukan pilihan modern standar yang lazim dalam bahasa Indonesia untuk נַעַל dalam konteks ini; “sandal” lebih tepat dan alami.'
  naturalness: Kalimatnya umumnya jelas dan baku. “Beginilah kebiasaan dahulu di Israel” mengalir lebih alami daripada pemisahan “Dahulu, di Israel,”. “Rekannya” lebih idiomatis dalam konteks transaksi daripada “sesamanya,” yang dapat terdengar sangat umum atau bernuansa sosial-etis.
  terminology: “Penebusan,” “pertukaran,” dan “mengesahkan setiap perkara” merupakan padanan yang baik. “Sandal” menggantikan “kasut” demi pemakaian Indonesia modern standar. “Tanda pengesahan” dapat dipertahankan sebagai ungkapan nonteknis bagi תְּעוּדָה, dengan alternatif “kesaksian” dalam catatan kaki.
  issues:
