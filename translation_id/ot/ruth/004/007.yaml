revisions:
- from: 'Dahulu, di Israel, beginilah kebiasaan mengenai penebusan dan pertukaran: untuk mengesahkan setiap perkara, seseorang menanggalkan kasutnya dan memberikannya kepada sesamanya. Itulah tanda pengesahan di Israel.[a]'
  to: 'Beginilah kebiasaan dahulu di Israel mengenai penebusan dan pertukaran: untuk mengesahkan setiap perkara, seseorang menanggalkan sandalnya dan memberikannya kepada rekannya. Itulah tanda pengesahan di Israel.[a]'
  rationale: Revisi terbatas pada pemakaian Indonesia modern standar dan kejelasan rujukan antarpihak. “Sandalnya” menggantikan istilah yang tidak lazim dalam ragam target, dan “rekannya” menerjemahkan רֵעֵהוּ secara alami tanpa menafsirkan pihak tersebut sebagai kerabat penebus atau tokoh tertentu. Catatan kaki tetap menandai alternatif yang sah untuk הַתְּעוּדָה.
