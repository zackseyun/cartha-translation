    rationale: לְרֵעֵהוּ menunjuk kepada rekan, kawan, atau pihak lain yang berhadapan dengannya. “Kepada rekannya” tetap cukup luas tanpa menambahkan identitas atau peran hukum yang tidak disebutkan.
