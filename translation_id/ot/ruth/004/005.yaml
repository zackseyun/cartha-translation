base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/005.yaml
  text: Then Boaz said[a], “On the day you acquire the field from the hand of Naomi, you also acquire Ruth the Moabite, the wife of the dead man[c][b], in order to raise up the name of the dead on his inheritance.”
translation:
  language: id
  text: Lalu Boas berkata, “Pada hari engkau memperoleh ladang itu dari tangan Naomi, engkau juga memperoleh Rut, perempuan Moab itu, istri orang mati,[a] untuk menegakkan nama orang mati itu pada milik pusakanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani menurut vokalisasi Masoret berbunyi secara harfiah, “aku telah memperoleh” (atau “aku memperoleh”) Rut, perempuan Moab itu. Berdasarkan konteks, banyak orang memahami maksudnya sebagai “engkau juga memperoleh”.
    reason: textual_variant
lexical_decisions:
- source_word: בְּיוֹם קְנוֹתְךָ
  choice: Pada hari engkau memperoleh
  rationale: Mempertahankan ungkapan waktu dan nuansa transaksi hukum dalam bahasa Indonesia yang wajar.
- source_word: הַשָּׂדֶה
  choice: ladang itu
  rationale: Menunjuk bidang tanah tertentu yang sedang dibicarakan; partikel definit Ibrani dinyatakan secara alami dengan “itu”.
- source_word: מִיַּד נָעֳמִי
  choice: dari tangan Naomi
  rationale: Mempertahankan idiom Ibrani mengenai pemindahan dari penguasaan seseorang, sekaligus nuansa hukumnya.
- source_word: וּמֵאֵת רוּת הַמּוֹאֲבִיָּה ... קניתי
  choice: engkau juga memperoleh Rut, perempuan Moab itu
  rationale: Klausa Teks Masoret sulit secara sintaksis, dan קניתי menurut vokalisasi berarti “aku telah memperoleh”. Namun alur dialog menunjukkan bahwa Boas sedang menyatakan kewajiban penebus terdekat. Terjemahan utama menyampaikan makna kontekstual, sedangkan bentuk MT dicatat dalam catatan kaki.
- source_word: אֵשֶׁת הַמֵּת
  choice: istri orang yang telah meninggal
  rationale: Terjemahan langsung yang tidak mempersempitnya menjadi “janda”, meskipun itulah keadaan yang tersirat.
- source_word: לְהָקִים שֵׁם
  choice: untuk menegakkan nama
  rationale: Mempertahankan metafora Ibrani tentang kelangsungan nama, garis keluarga, dan kedudukan orang yang meninggal.
- source_word: עַל נַחֲלָתוֹ
  choice: atas milik pusakanya
  rationale: “Milik pusaka” menyatakan tanah warisan turun-temurun; “atas” mempertahankan hubungan preposisional yang agak idiomatis tanpa menafsirkan secara berlebihan.
theological_decisions:
- issue: Kesulitan tekstual dan sintaksis pada קניתי serta klausa mengenai Rut
  choice: 'Terjemahan utama memakai orang kedua: “engkau juga memperoleh Rut”'
  alternative: Teks Ibrani Masoret menurut vokalisasinya berbunyi “aku telah memperoleh Rut” atau “aku memperoleh Rut”; klausa “dari Rut” juga dapat dihubungkan secara berbeda.
  rationale: Konteks narasi menunjukkan bahwa Boas sedang menjelaskan konsekuensi penebusan kepada kerabat yang lebih dekat. Pilihan utama mengikuti fungsi ujaran itu, sementara bacaan formal MT dipertahankan dalam catatan agar ketegangan tekstual tidak disembunyikan.
- issue: Makna menegakkan nama orang yang meninggal atas milik pusakanya
  choice: Metafora hukum-keluarga dipertahankan tanpa uraian dalam teks utama
  alternative: Memparafrasakannya sebagai melestarikan garis keturunan dan hak keluarga orang yang meninggal
  rationale: Bahasa sumber menghubungkan nama orang yang meninggal dengan tanah warisannya. Terjemahan mempertahankan gambaran tersebut dan tidak memasukkan sistem teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif-hukum yang bermartabat. “Memperoleh” dipilih agar dapat mencakup transaksi tanah dan kewajiban terkait Rut tanpa kesan komersial berlebihan. Penanda catatan [a] ditempatkan sesudah seluruh sebutan mengenai Rut agar cakupannya jelas.
