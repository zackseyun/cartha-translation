- from: Lalu Boas berkata, “Pada hari engkau memperoleh ladang itu dari tangan Naomi, engkau juga memperoleh Rut, perempuan Moab itu, istri orang yang telah meninggal,[a] untuk menegakkan nama orang yang telah meninggal itu atas milik pusakanya.”
