    rationale: Dalam bahasa Indonesia, "menegakkan nama ... atas milik pusaka" terdengar tidak alami dan dapat mengesankan tindakan dilakukan di atas tanah. Relasi idiomatis Ibrani antara nama almarhum dan warisannya lebih baik dinyatakan "pada milik pusakanya" dalam terjemahan yang tetap dekat.
  - severity: low
    issue: Pengulangan frasa panjang "orang yang telah meninggal"
    rationale: Padanan ini setia, tetapi pengulangan dalam satu ayat terasa berat. "Orang mati" adalah padanan langsung bagi הַמֵּת dan sesuai register Alkitab Indonesia modern.
