base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/013.yaml
  text: So Boaz took Ruth[a], and she became his wife. He went in to her, and Yahweh granted her conception, and she bore a son.
translation:
  language: id
  text: Boas pun mengambil Rut, lalu Rut menjadi istrinya. Boas menggauli Rut, dan Yahweh membuat Rut mengandung[a]. Kemudian Rut melahirkan seorang anak laki-laki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Yahweh memberikan kepadanya kehamilan”; dapat juga diterjemahkan, “Yahweh memampukannya untuk mengandung.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: Kata לקח secara harfiah berarti “mengambil.” Dalam konteks ini tindakan tersebut adalah mengambil seorang perempuan sebagai istri; klausa berikutnya menjelaskan makna perkawinannya sehingga urutan ungkapan Ibrani tetap terpelihara.
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: lalu Rut menjadi istrinya
  rationale: Ungkapan ini menyatakan status perkawinan secara resmi. Pengulangan nama Rut menghindari ketidakjelasan rujukan dalam bahasa Indonesia.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: Boas menghampirinya
  rationale: Ungkapan Ibrani ini merupakan eufemisme bagi hubungan seksual. “Menghampirinya” mempertahankan gaya bahasa sumber yang santun dan tidak menguraikannya secara lebih gamblang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh,” bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap terlihat.
- source_word: וַיִּתֵּן יְהוָה לָהּ הֵרָיוֹן
  choice: Yahweh membuat Rut mengandung
  rationale: Secara harfiah, Yahweh “memberikan kepadanya kehamilan.” Rumusan ini alami dalam bahasa Indonesia dan tetap menyatakan secara tegas bahwa Yahweh adalah pelaku yang memungkinkan terjadinya kehamilan.
- source_word: וַתֵּלֶד בֵּן
  choice: Rut melahirkan seorang anak laki-laki
  rationale: Ini merupakan padanan langsung dan alami untuk ילד + בן serta sesuai dengan gaya narasi Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar.
- issue: Peran Yahweh dalam terjadinya kehamilan Rut
  choice: Yahweh membuat Rut mengandung
  alternative: Yahweh memberikan kepadanya kehamilan
  rationale: Teks Ibrani secara eksplisit menempatkan Yahweh sebagai pemberi kehamilan. Terjemahan mempertahankan peran ilahi itu tanpa menambahkan penjelasan teologis di luar teks.
translation_notes:
  register: Bahasa Indonesia modern, santun, dan bernuansa naratif. Eufemisme pada hubungan suami-istri dipertahankan, sedangkan nama-nama diulangi seperlunya agar rujukan pronomina jelas. Penanda catatan kaki ditempatkan pada klausa tentang kehamilan karena catatan tersebut menjelaskan ungkapan הֵרָיוֹן.
