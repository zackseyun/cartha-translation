  yaml_path: translation/ot/ruth/004/020.yaml
  text: Amminadab fathered Nahshon[a], and Nahshon fathered Salmah.
translation:
  language: id
  text: Aminadab memperanakkan Nahason, dan Nahason memperanakkan Salma.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Salma; sejumlah terjemahan memakai “Salmon” untuk menyelaraskannya dengan silsilah-silsilah sejajar.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַמִּינָדָב
  choice: Aminadab
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dalam silsilah menyatakan bahwa seorang laki-laki menjadi ayah dari keturunan yang disebut; 'memperanakkan' ringkas, wajar dalam konteks silsilah, dan mempertahankan hubungan genealogis laki-laki.
- source_word: אֶת
  choice: '[tidak diterjemahkan secara tersendiri]'
  rationale: Penanda objek langsung ini tidak mempunyai padanan leksikal tersendiri dalam bahasa Indonesia; fungsinya dinyatakan melalui susunan kalimat.
- source_word: נַחְשׁוֹן
  choice: Nahason
  rationale: Nama diri Ibrani ditransliterasikan dalam bentuk Indonesia yang jelas dan lazim.
- source_word: וְ
  choice: dan
  rationale: Konjungsi sederhana yang menghubungkan dua klausa silsilah.
- source_word: שַׂלְמָה
  choice: Salma
  rationale: Bentuk Ibrani dalam ayat ini adalah שַׂלְמָה (Salma), sehingga bentuk ini dipertahankan dan tidak diselaraskan secara diam-diam dengan bentuk 'Salmon' dalam silsilah sejajar.
theological_decisions: []
translation_notes:
