  text: וִ/יהִ֤י בֵֽיתְ/ךָ֙ כְּ/בֵ֣ית פֶּ֔רֶץ אֲשֶׁר יָלְדָ֥ה תָמָ֖ר לִֽ/יהוּדָ֑ה מִן הַ/זֶּ֗רַע אֲשֶׁ֨ר יִתֵּ֤ן יְהוָה֙ לְ/ךָ֔ מִן הַֽ/נַּעֲרָ֖ה הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/012.yaml
  text: And may your house be like the house of Perez[a], whom Tamar bore to Judah[b], from the offspring that Yahweh will give you by this young woman.
translation:
  language: id
  text: Semoga keluargamu menjadi seperti keluarga Peres[a], yang Tamar lahirkan bagi Yehuda, melalui keturunan yang akan Yahweh karuniakan kepadamu dari perempuan muda ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Keluarga” di sini mencakup rumah tangga dan garis keturunan, bukan sekadar orang-orang yang tinggal serumah.
    reason: cultural_note
lexical_decisions:
- source_word: וִיהִי
  choice: Semoga ... menjadi
  rationale: Bentuk ini menyampaikan harapan atau berkat dengan wajar dalam bahasa Indonesia modern.
- source_word: בֵיתְךָ / כְּבֵית פֶּרֶץ
  choice: keluargamu / keluarga Peres
  rationale: Dalam konteks berkat tentang keturunan, בַּיִת menunjuk pada rumah tangga atau garis keluarga, bukan bangunan; 'keluarga' mengungkapkan maksud itu secara alami.
- source_word: אֲשֶׁר יָלְדָה תָמָר לִיהוּדָה
  choice: yang dilahirkan Tamar bagi Yehuda
  rationale: Mempertahankan klausa relatif, verba melahirkan, dan relasi yang ditandai ל tanpa memperinci lebih jauh.
- source_word: מִן הַזֶּרַע
  choice: melalui keturunan
  rationale: זֶרַע secara harfiah berarti 'benih', tetapi lazim menjadi idiom untuk anak atau keturunan. 'Melalui' menyatakan bahwa keluarga itu akan terbentuk dari keturunan tersebut tanpa menambahkan nuansa kausal.
- source_word: אֲשֶׁר יִתֵּן יְהוָה לְךָ
  choice: yang akan Yahweh karuniakan kepadamu
  rationale: נתן berarti memberi; dalam konteks berkat, 'karuniakan' secara alami menyampaikan pemberian ilahi, sedangkan bentuk mendatang tetap dipertahankan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks Ibrani ditransliterasikan sebagai Yahweh.
- source_word: מִן הַנַּעֲרָה הַזֹּאת
  choice: dari perempuan muda ini
  rationale: נַעֲרָה menunjuk pada perempuan muda, dan מִן menandai asal maternal keturunan tersebut.
theological_decisions:
- issue: Makna בֵּית dalam berkat genealogis
  choice: keluarga
  alternative: kaum keluarga; rumah
  rationale: Konteksnya adalah kelanjutan keluarga melalui keturunan. 'Keluarga' jelas bagi pembaca Indonesia dan tidak membatasi maknanya pada tempat tinggal fisik.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks secara langsung memakai nama perjanjian, sehingga bentuk nama diri dipertahankan.
- issue: Hubungan frasa מִן הַזֶּרַע dengan berkat sebelumnya
  choice: melalui keturunan
  alternative: dari keturunan; karena keturunan
  rationale: Preposisi מִן secara dasar menyatakan asal atau sumber. 'Melalui' menghasilkan kalimat Indonesia yang jelas tanpa memasukkan hubungan sebab yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan berkat dipertahankan, sementara idiom Ibrani 'rumah' dialihkan menjadi 'keluarga' agar makna genealogis langsung dipahami. Semua penanda catatan kaki muncul dalam teks.
