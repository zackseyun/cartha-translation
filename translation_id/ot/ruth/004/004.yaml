  terminology: ‘Menebus’ merupakan padanan yang tepat dan konsisten untuk גאל dalam konteks hukum-keluarga ini. ‘Para tua-tua bangsaku’ dan sapaan ‘engkau’ juga sesuai dengan register terjemahan.
