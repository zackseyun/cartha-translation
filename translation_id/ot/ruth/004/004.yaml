  text: וַ/אֲנִ֨י אָמַ֜רְתִּי אֶגְלֶ֧ה אָזְנְ/ךָ֣ לֵ/אמֹ֗ר קְ֠נֵה נֶ֥גֶד הַֽ/יֹּשְׁבִים֮ וְ/נֶ֣גֶד זִקְנֵ֣י עַמִּ/י֒ אִם תִּגְאַל֙ גְּאָ֔ל וְ/אִם לֹ֨א יִגְאַ֜ל הַגִּ֣ידָ/ה לִּ֗/י ו/אדע כִּ֣י אֵ֤ין זוּלָֽתְ/ךָ֙ לִ/גְא֔וֹל וְ/אָנֹכִ֖י אַחֲרֶ֑י/ךָ וַ/יֹּ֖אמֶר אָנֹכִ֥י אֶגְאָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/004.yaml
  text: So I thought I should inform you[a], saying, ‘Buy it in the presence of those sitting here and in the presence of the elders of my people. If you will redeem it, redeem it; but if he will not redeem it, tell me, so that I may know, for there is no one besides you to redeem it, and I am after you.’ And he said[b], ‘I will redeem it.’
translation:
  language: id
  text: 'Lalu aku berpikir untuk memberitahukan hal ini kepadamu[a], demikian: “Belilah tanah itu di hadapan orang-orang yang duduk di sini dan di hadapan para tua-tua bangsaku. Jika engkau hendak menebusnya, tebuslah. Namun, jika ia tidak menebusnya[b], katakanlah kepadaku supaya aku tahu, sebab tidak ada seorang pun selain engkau yang dapat menebusnya, dan akulah yang berikutnya sesudah engkau.” Orang itu menjawab, “Aku akan menebusnya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi “menyingkapkan telingamu”, sebuah ungkapan yang berarti “memberitahukan kepadamu” atau “membuatmu tahu”.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani berbunyi “jika ia tidak menebusnya”. Karena orang itu sedang disapa secara langsung, sebagian orang memahaminya sebagai “jika engkau tidak menebusnya”.
    reason: alternative_reading
lexical_decisions:
- source_word: אֶגְלֶה אָזְנְךָ
  choice: memberitahukan hal ini kepadamu
  rationale: Ungkapan Ibrani yang secara harfiah berarti ‘menyingkapkan telingamu’ adalah idiom untuk membuat seseorang mengetahui sesuatu. Terjemahan ini menyampaikan maknanya secara wajar dalam bahasa Indonesia modern.
- source_word: קְנֵה
  choice: Belilah tanah itu
  rationale: Dalam konteks transaksi tanah, קנה berarti membeli atau memperoleh. ‘Belilah’ paling alami dalam tuturan langsung, sedangkan ‘tanah itu’ melengkapi objek yang dipahami dari konteks dekat.
- source_word: נֶגֶד הַיֹּשְׁבִים
  choice: di hadapan orang-orang yang duduk di sini
  rationale: נגד menunjukkan bahwa tindakan itu dilakukan secara terbuka di hadapan para saksi; ‘di sini’ memperjelas konteks orang-orang yang sedang duduk di gerbang.
- source_word: זִקְנֵי עַמִּי
  choice: para tua-tua bangsaku
  rationale: Terjemahan ini mempertahankan makna para pemimpin senior yang diakui dalam masyarakat dan tidak mempersempit עַמִּי menjadi marga atau kaum.
- source_word: תִּגְאַל ... גְּאָל
  choice: Jika engkau hendak menebusnya, tebuslah
  rationale: Pengulangan akar גאל dipertahankan untuk menjaga penekanannya. ‘Menebus’ cocok untuk tindakan hukum keluarga atas tanah dalam konteks ini.
- source_word: וְאִם לֹא יִגְאַל
  choice: Namun, jika ia tidak menebusnya
  rationale: Teks Masoret memakai bentuk orang ketiga tunggal, meskipun tuturan sebelumnya menyapa orang kedua. Pergeseran yang sulit ini dipertahankan dan dijelaskan dalam catatan kaki.
- source_word: הַגִּידָה לִּי
  choice: katakanlah kepadaku
  rationale: Imperatif langsung ini disampaikan dengan bahasa Indonesia yang alami dan tetap bermartabat.
- source_word: אֵין זוּלָתְךָ לִגְאוֹל
  choice: tidak ada seorang pun selain engkau yang dapat menebusnya
  rationale: זוּלָתְךָ menyatakan pengecualian, sedangkan ‘dapat’ di sini mengacu pada kedudukan atau hak menurut urutan hukum, bukan sekadar kemampuan fisik.
- source_word: וְאָנֹכִי אַחֲרֶיךָ
  choice: dan aku berada sesudah engkau
  rationale: Ungkapan ini mempertahankan gagasan urutan hak atau kewajiban penebusan tanpa menjelaskan lebih jauh daripada teks.
- source_word: אָנֹכִי אֶגְאָל
  choice: Aku akan menebusnya
  rationale: Jawaban ini menerima tindakan penebusan; objek ‘-nya’ wajar disediakan dari konteks.
theological_decisions:
- issue: Makna גאל dalam konteks hukum kekerabatan
  choice: menebus
  alternative: bertindak sebagai penebus kerabat; membeli kembali
  rationale: ‘Menebus’ mempertahankan resonansi hukum-keluarga dari גאל tanpa memasukkan penjelasan doktrinal atau istilah teknis yang tidak dinyatakan langsung pada setiap kemunculannya.
- issue: Pergantian dari orang kedua ke orang ketiga dalam syarat negatif
  choice: jika ia tidak menebusnya
  alternative: jika engkau tidak menebusnya
  rationale: Bentuk orang ketiga dalam teks Masoret dipertahankan agar ketegangan gramatikal asli tidak diselesaikan diam-diam; alternatif yang mengikuti alur percakapan dicatat di catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang jelas dan bermartabat. Bentuk sapaan ‘engkau’ dipakai untuk tuturan langsung bernuansa naratif. Istilah kunci ‘menebus’ dipertahankan secara konsisten, dan kejanggalan pergantian persona dalam teks Ibrani tidak dihaluskan tanpa catatan.
