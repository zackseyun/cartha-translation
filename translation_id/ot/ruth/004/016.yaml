base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/016.yaml
  text: Then Naomi took the child and laid him in her lap[a], and she became his nurse.
translation:
  language: id
  text: Kemudian Naomi mengambil anak itu, meletakkannya di pangkuannya, dan menjadi pengasuhnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ibu asuh”; istilah Ibrani ini merujuk kepada seorang perempuan yang merawat dan membesarkan anak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  choice: mengambil
  rationale: Kata kerja לקח dalam rangkaian narasi menyatakan tindakan mengambil; konteksnya menggambarkan Naomi menerima dan memegang anak itu secara nyata.
- source_word: הַיֶּלֶד
  choice: anak itu
  rationale: יֶלֶד dapat berarti anak atau anak laki-laki. Dalam konteks bayi yang baru lahir, “anak itu” paling alami dan sesuai usia.
- source_word: וַתְּשִׁתֵהוּ
  choice: meletakkannya
  rationale: Bentuk ini berarti menaruh atau menempatkan. “Meletakkannya” merupakan ungkapan Indonesia yang alami untuk menempatkan seorang bayi di pangkuan.
- source_word: בְחֵיקָהּ
  choice: di pangkuannya
  rationale: חֵיק menunjuk daerah dada atau pangkuan. “Di pangkuannya” mempertahankan gambaran fisik secara jelas tanpa memakai ungkapan yang terasa kuno atau terlalu menafsirkan.
- source_word: וַתְּהִי לוֹ
  choice: menjadi ...-nya
  rationale: Konstruksi היה + ל menandai peran atau hubungan yang mulai berlaku; “menjadi pengasuhnya” menyampaikannya secara wajar dalam bahasa Indonesia.
- source_word: לְאֹמֶנֶת
  choice: pengasuh
  rationale: אֹמֶנֶת adalah perempuan yang merawat dan membesarkan seorang anak. “Pengasuh” jelas bagi pembaca modern serta tidak menimbulkan kesan perawat medis, meskipun cakupan istilah Ibraninya juga dapat mendekati “ibu asuh”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan alur naratif yang sederhana dan bermartabat. “Pengasuh” dipilih daripada “inang” karena lebih mudah dipahami pembaca masa kini, dan daripada “perawat” karena istilah itu sekarang biasanya dipahami sebagai profesi medis.
