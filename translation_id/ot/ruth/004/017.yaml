base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/017.yaml
  text: Then the neighbor women gave him a name[a], saying, “A son has been born to Naomi.” And they named him Obed. He was the father of Jesse, the father of David.
translation:
  language: id
  text: Lalu para perempuan tetangga memberinya nama dengan berkata, “Seorang putra telah lahir bagi Naomi.”[a] Mereka menamainya Obed. Dialah ayah Isai, ayah Daud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan ini tidak menyatakan bahwa Naomi adalah ibu biologis anak itu. Para perempuan tersebut memandang anak Rut sebagai pemulihan garis keluarga Naomi.
    reason: Menjelaskan hubungan kekeluargaan yang dapat disalahpahami sambil mempertahankan ungkapan sumber ‘lahir bagi Naomi’ dalam teks utama.
lexical_decisions:
- source_word: הַשְּׁכֵנוֹת
  choice: para perempuan tetangga
  rationale: Bentuk feminin jamak secara khusus menunjuk kepada para perempuan yang tinggal di sekitar Naomi; ungkapan ini mempertahankan unsur gender dan kedekatan tempat secara wajar dalam bahasa Indonesia.
- source_word: וַתִּקְרֶאנָה לוֹ שֵׁם
  choice: memberinya nama
  rationale: Idiom Ibrani ini secara harfiah berarti ‘menyebutkan nama baginya’. ‘Memberinya nama’ alami dalam bahasa Indonesia dan tetap membedakannya dari klausa berikutnya yang menyebut nama Obed secara eksplisit.
- source_word: לֵאמֹר
  choice: dengan berkata
  rationale: Infinitif pengutip ini memperkenalkan perkataan para perempuan yang menyertai tindakan pemberian nama.
- source_word: יֻלַּד בֵּן לְנָעֳמִי
  choice: Seorang putra telah lahir bagi Naomi
  rationale: 'Bentuk pasif dan preposisi לְ dipertahankan: Naomi tampil sebagai penerima manfaat dalam pemulihan garis keluarganya. ‘Putra’ mempertahankan jenis kelamin yang dinyatakan oleh בֵּן tanpa mengubahnya menjadi ‘cucu’.'
- source_word: וַתִּקְרֶאנָה שְׁמוֹ עוֹבֵד
  choice: Mereka menamainya Obed
  rationale: Rumus penamaan Ibrani ini disampaikan dengan ungkapan Indonesia yang alami, sedangkan nama diri tetap ditransliterasikan.
- source_word: עוֹבֵד
  choice: Obed
  rationale: Nama diri ditransliterasikan, bukan diterjemahkan menurut kemungkinan maknanya yang berkaitan dengan ‘melayani’.
- source_word: אֲבִי
  choice: ayah
  rationale: Dalam silsilah langsung ini, arti ‘ayah’ paling sesuai untuk kedua kemunculannya dan tidak perlu diperluas menjadi ‘leluhur’.
- source_word: יִשַׁי
  choice: Isai
  rationale: Menggunakan bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: דָוִד
  choice: Daud
  rationale: Menggunakan bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
theological_decisions:
- issue: Hubungan Naomi dengan bayi dalam pernyataan ‘Seorang putra telah lahir bagi Naomi’
  choice: Mempertahankan ungkapan ‘bagi Naomi’ dalam teks utama tanpa menjadikannya pernyataan bahwa Naomi adalah ibu biologisnya.
  alternative: ‘Seorang cucu telah lahir bagi Naomi’ atau ‘Naomi telah memperoleh seorang putra.’
  rationale: Bahasa Ibrani menyuarakan pandangan para perempuan tetangga tentang pemulihan keluarga Naomi melalui anak Rut. Menggantinya dengan ‘cucu’ akan menuntaskan ketegangan sastra dan kekeluargaan yang sengaja dibiarkan dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum, sementara pengulangan tindakan pemberian nama dan ketegangan dalam ungkapan ‘lahir bagi Naomi’ tetap dipertahankan.
