  text: וַ/יֹּאמֶר֩ בֹּ֨עַז לַ/זְּקֵנִ֜ים וְ/כָל הָ/עָ֗ם עֵדִ֤ים אַתֶּם֙ הַ/יּ֔וֹם כִּ֤י קָנִ֨יתִי֙ אֶת כָּל אֲשֶׁ֣ר לֶֽ/אֱלִימֶ֔לֶךְ וְ/אֵ֛ת כָּל אֲשֶׁ֥ר לְ/כִלְי֖וֹן וּ/מַחְל֑וֹן מִ/יַּ֖ד נָעֳמִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/009.yaml
  text: Then Boaz said to the elders and all the people[b][a], “You are witnesses today that I have acquired from the hand of Naomi all that belonged to Elimelech and all that belonged to Chilion and Mahlon.”
translation:
  language: id
  text: Kemudian Boas berkata kepada para tua-tua dan seluruh rakyat itu, “Pada hari ini kamulah saksi bahwa aku telah memperoleh[a] dari tangan Naomi[b] segala milik Elimelekh dan segala milik Kilyon serta Mahlon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah membeli”; kata kerja Ibrani ini dapat menunjuk pada perolehan melalui pembelian dalam suatu transaksi hukum.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani “dari tangan Naomi” berarti dari kepemilikan atau penguasaan Naomi.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kemudian ... berkata
  rationale: Bentuk naratif Ibrani melanjutkan urutan peristiwa; “Kemudian” menyampaikan alur itu secara wajar dalam bahasa Indonesia.
- source_word: לַזְּקֵנִים וְכָל הָעָם
  choice: kepada para tua-tua dan seluruh rakyat itu
  rationale: “Para tua-tua” menunjuk para pemimpin masyarakat dalam sidang hukum, sedangkan “seluruh rakyat itu” mempertahankan kelompok kedua yang hadir sebagai saksi.
- source_word: עֵדִים אַתֶּם הַיּוֹם
  choice: Pada hari ini kamulah saksi
  rationale: Susunan ini mempertahankan penekanan pada para pendengar sebagai saksi dan menyampaikan keterangan waktu dengan bahasa Indonesia yang alami.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi kesaksian, bukan alasan sebab-akibat.
- source_word: קָנִיתִי
  choice: aku telah memperoleh
  rationale: Kata kerja ini menyatakan perolehan dalam transaksi hukum. “Memperoleh” cukup luas untuk tidak memastikan cara pembayaran yang tidak dinyatakan secara eksplisit.
- source_word: אֶת כָּל אֲשֶׁר לֶאֱלִימֶלֶךְ
  choice: segala milik Elimelekh
  rationale: Ungkapan Ibrani harfiah “segala yang kepada/bagi Elimelekh” secara idiomatis menyatakan kepemilikan.
- source_word: וְאֵת כָּל אֲשֶׁר לְכִלְיוֹן וּמַחְלוֹן
  choice: dan segala milik Kilyon serta Mahlon
  rationale: Terjemahan ini mempertahankan kesejajaran dengan milik Elimelekh dan menyebut kedua pemilik tanpa mengisyaratkan pembagian tertentu.
- source_word: מִיַּד נָעֳמִי
  choice: dari tangan Naomi
  rationale: Ungkapan hukum ini dipertahankan dalam teks karena cukup dapat dipahami, sementara arti idiomatisnya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Sifat transaksi Boas
  choice: aku telah memperoleh
  alternative: aku telah membeli / aku telah menebus
  rationale: Ayat ini menyatakan pengalihan harta yang terkait dengan Elimelekh, Kilyon, dan Mahlon dari penguasaan Naomi. “Memperoleh” mempertahankan cakupan kata Ibrani tanpa memastikan pembelian tunai atau memasukkan gagasan penebusan yang tidak dinyatakan oleh kata kerja ayat ini.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Istilah “para tua-tua” mempertahankan nuansa lembaga kemasyarakatan kuno, sedangkan bentuk nama mengikuti ejaan Indonesia yang lazim: Boas, Naomi, Elimelekh, Kilyon, dan Mahlon.'
