base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/006.yaml
  text: Then the redeemer said[a], “I cannot redeem it for myself, lest I ruin my own inheritance. Redeem for yourself my right of redemption[b], for I cannot redeem it.”
translation:
  language: id
  text: Lalu penebus itu[a] berkata, “Aku tidak dapat menebusnya untuk diriku sendiri, jangan-jangan aku merugikan harta warisanku sendiri. Tebuslah sendiri hak penebusanku[b], sebab aku tidak dapat menebusnya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Penebus itu” ialah kerabat yang lebih dekat dan karena itu memiliki hak atau kewajiban penebusan sebelum Boas. Istilah ini kadang diterjemahkan “kerabat penebus.”
    reason: cultural_note
  - marker: b
    text: Secara lebih harfiah, “penebusanku.” Dalam konteks ini, kata Ibrani tersebut menunjuk kepada hak atau kewajiban hukum untuk menebus harta keluarga.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגֹּאֵל
  choice: penebus itu
  rationale: Bentuk partisip dari גאל menunjuk kepada kerabat yang memiliki hak dan kewajiban hukum untuk menebus. Frasa “penebus itu” ringkas dan mempertahankan istilah utama, sedangkan unsur kekerabatan dijelaskan oleh konteks dan catatan kaki.
- source_word: לִגְאֹל / גְּאַל / גְּאֻלָּתִי
  choice: menebus / tebuslah / hak penebusanku
  rationale: Pengulangan rumpun kata גאל dipertahankan. Dalam konteks ini, istilah tersebut menyangkut pelaksanaan hak dan kewajiban penebusan dalam keluarga. Untuk nomina גְּאֻלָּתִי, “hak penebusanku” memperjelas maksud hukumnya tanpa menghapus kemungkinan terjemahan lebih harfiah “penebusanku”.
- source_word: לִי
  choice: bagi diriku sendiri
  rationale: Datif ini menyatakan kepentingan atau keuntungan pribadi. Pilihan tersebut menegaskan bahwa tindakan penebusan akan berdampak pada harta miliknya sendiri.
- source_word: פֶּן
  choice: jangan-jangan
  rationale: Kata ini memperkenalkan akibat yang dikhawatirkan. “Jangan-jangan” alami dalam bahasa Indonesia dan mempertahankan nuansa kekhawatiran, bukan kepastian.
- source_word: אַשְׁחִית
  choice: aku merusak
  rationale: Bentuk hifil dari שׁחת di sini berarti menyebabkan kerugian atau kerusakan pada milik pusaka, bukan menghancurkannya secara harfiah. “Merusak” cukup luas untuk mempertahankan ketidakjelasan mengenai bentuk kerugiannya.
- source_word: נַחֲלָתִי
  choice: milik pusakaku sendiri
  rationale: Istilah נַחֲלָה menunjuk kepada harta warisan turun-temurun. “Milik pusaka” menyampaikan dimensi harta keluarga dengan bahasa Indonesia yang wajar; “sendiri” menonjolkan kontras dengan tanah yang hendak ditebus.
- source_word: לְךָ אַתָּה
  choice: bagi dirimu sendiri
  rationale: Pronomina yang eksplisit memberi penekanan kepada Boas. Ungkapan ini menyampaikan penekanan itu secara alami tanpa susunan kaku “engkau sendiri”.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan penjelasan yang menegaskan kembali ketidakmampuan penebus tersebut.
theological_decisions:
- issue: Cakupan kewajiban penebus dalam konteks narasi
  choice: Catatan menjelaskan bahwa penebus terdekat memiliki hak atau kewajiban keluarga serta klaim yang mendahului Boas, tanpa merumuskan sistem hukum yang lebih rinci daripada yang dinyatakan teks.
  alternative: Menyebut secara tegas bahwa istilah itu sendiri mencakup kewajiban menikahi Rut.
  rationale: Kata הַגֹּאֵל sendiri menunjuk pelaku penebusan, sedangkan hubungan dengan pernikahan dan kelanjutan garis keluarga berasal dari konteks dekat. Terjemahan tidak seharusnya memasukkan seluruh penjelasan kontekstual ke dalam satu istilah.
translation_notes:
  register: Bahasa dibuat modern, wajar, dan bermartabat. Istilah “menebus” dipertahankan secara konsisten untuk mencerminkan pengulangan rumpun kata גאל. Objek “-nya” pada “menebusnya” disuplai dari konteks karena teks Ibrani tidak menyatakannya secara eksplisit. “Jangan-jangan” mempertahankan nuansa akibat yang dikhawatirkan, sementara “milik pusaka” menghindari kesan bahwa נַחֲלָה hanya berarti warisan yang baru diterima.
