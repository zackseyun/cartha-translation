  terminology: “Penebus itu,” “menebus,” dan “hak penebusanku” secara konsisten mencerminkan istilah גאל. Catatan kaki dengan tepat menjelaskan unsur kekerabatan dan fungsi hukum tanpa memasukkan rincian doktrinal atau hukum yang tidak dinyatakan langsung oleh ayat.
