revisions:
- from: Lalu penebus itu[a] berkata, “Aku tidak dapat menebusnya bagi diriku sendiri, jangan-jangan aku merusak milik pusakaku sendiri. Tebuslah bagi dirimu sendiri hak penebusanku[b], sebab aku tidak dapat menebusnya.”
  to: Lalu penebus itu[a] berkata, “Aku tidak dapat menebusnya untuk diriku sendiri, jangan-jangan aku merugikan harta warisanku sendiri. Tebuslah sendiri hak penebusanku[b], sebab aku tidak dapat menebusnya.”
