  yaml_path: translation/ot/ruth/004/022.yaml
  text: And Obed fathered Jesse[a], and Jesse fathered David.
translation:
  language: id
  text: Obed memperanakkan[a] Isai, dan Isai memperanakkan Daud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "menjadi ayah dari"; bahasa Ibrani dalam silsilah memakai kata yang berarti "memperanakkan" atau "menjadi ayah dari."
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: dan
  rationale: Konjungsi ini menghubungkan pernyataan silsilah terakhir dengan daftar sebelumnya; “dan” merupakan padanan Indonesia yang langsung dan alami.
- source_word: עֹבֵד
  choice: Obed
  rationale: Nama diri ditransliterasikan sesuai bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: הוֹלִיד
  choice: memperanakkan
  rationale: Bentuk Hifil dari ילד dalam silsilah berarti ‘memperoleh keturunan sebagai ayah/memperanakkan’. Pilihan ini ringkas, wajar dalam konteks silsilah, dan mempertahankan peran genealogis laki-laki.
- source_word: אֶת
  choice: '[tidak diterjemahkan secara tersendiri]'
  rationale: Penanda objek langsung ini tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia; fungsinya dinyatakan melalui susunan kalimat.
- source_word: יִשַׁי / יִשָׁי
  choice: Isai
  rationale: Bentuk nama yang telah mapan dan mudah dikenali dalam tradisi Alkitab bahasa Indonesia.
- source_word: דָּוִד
  choice: Daud
  rationale: Bentuk nama yang telah mapan dalam bahasa Indonesia untuk דוד.
theological_decisions:
- issue: Penerjemahan kata kerja silsilah
  choice: memperanakkan
  alternative: menjadi ayah dari; menurunkan
  rationale: Ayat ini menyampaikan silsilah yang berakhir pada Daud. “Memperanakkan” mempertahankan daya biologis dan genealogis bahasa Ibrani tanpa menambahkan klaim teologis di luar teks.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Istilah “memperanakkan” dipertahankan karena jelas dalam konteks silsilah dan lebih tepat daripada ungkapan yang dapat menyiratkan keturunan tidak langsung.
