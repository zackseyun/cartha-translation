  text: Then he took ten men from the elders of the city and said[a], “Sit here,” and they sat down.
translation:
  language: id
  text: Lalu Boas memilih sepuluh laki-laki dari antara para tua-tua kota itu dan berkata[a], “Duduklah di sini.” Mereka pun duduk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mengambil.” Dalam konteks ini, kata Ibrani tersebut dapat berarti mengambil atau memilih orang-orang untuk suatu tujuan, kemungkinan sebagai saksi dalam proses hukum.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: memilih
  rationale: Dalam konteks sidang resmi di pintu gerbang, לקח menunjuk pada tindakan mengambil orang-orang tertentu untuk suatu tujuan, yakni menghadirkan mereka dalam proses hukum. 'Memilih' menyampaikan maksud kontekstual ini secara alami dalam bahasa Indonesia.
- source_word: עֲשָׂרָה אֲנָשִׁים
  choice: sepuluh orang
  rationale: Frasa ini merujuk kepada sepuluh laki-laki dewasa. Dalam bahasa Indonesia, 'orang' adalah padanan lazim dan alami setelah bilangan, sementara identitas mereka sebagai laki-laki sudah jelas dari peran mereka sebagai para tua-tua dalam konteks budaya tersebut.
- source_word: מִזִּקְנֵי הָעִיר
  choice: dari antara para tua-tua kota itu
  rationale: 'Kata depan מִן memiliki arti partitif: kesepuluh orang itu dipilih dari kelompok para tua-tua. Bentuk ''kota itu'' mempertahankan kejelasan nomina Ibrani yang memakai artikel tertentu.'
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Padanan langsung dan wajar bagi verba naratif umum ini serta cocok untuk mengantar kutipan perintah.
- source_word: שְׁבוּ
  choice: Duduklah
  rationale: Bentuk imperatif jamak dari ישב mengundang mereka mengambil tempat untuk persidangan. 'Duduklah' ringkas, sopan, dan alami.
- source_word: פֹה
  choice: di sini
  rationale: Padanan deiktis alami bagi פֹה dalam bahasa Indonesia.
- source_word: וַיֵּשֵׁבוּ
  choice: Mereka pun duduk
  rationale: Terjemahan ini mempertahankan pengulangan akar ישב dan menunjukkan bahwa mereka segera menanggapi perintah tersebut; 'pun' secara alami menandai kelanjutan dan respons dalam narasi Indonesia.
