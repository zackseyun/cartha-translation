  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תֹּאמַ֤רְנָה הַ/נָּשִׁים֙ אֶֽל נָעֳמִ֔י בָּר֣וּךְ יְהוָ֔ה אֲ֠שֶׁר לֹ֣א הִשְׁבִּ֥ית לָ֛/ךְ גֹּאֵ֖ל הַ/יּ֑וֹם וְ/יִקָּרֵ֥א שְׁמ֖/וֹ בְּ/יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/014.yaml
  text: Then the women said to Naomi[a], “Blessed be Yahweh, who has not left you without a redeemer today[c][b], and may his name be renowned in Israel.”
translation:
  language: id
  text: Lalu para perempuan itu berkata kepada Naomi, “Terpujilah Yahweh, yang hari ini tidak membiarkan engkau tanpa seorang penebus[a][b], dan semoga namanya termasyhur di Israel.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penebus kerabat” atau “pelindung kerabat”; istilah Ibrani ini menyoroti peranan hukum-keluarga seorang kerabat dekat yang bertindak untuk memulihkan dan melindungi garis keluarga.
    reason: lexical_alternative
  - marker: b
    text: “Penebus” mungkin secara khusus menunjuk kepada bayi yang baru lahir sebagai pemulih kehidupan Naomi, meskipun ada juga yang memahaminya dengan mempertimbangkan peranan Boas sebagai penebus dalam pasal ini.
    reason: alternative_reading
  - marker: c
    text: Secara harfiah, “dan semoga namanya disebut di Israel”; ungkapan ini berarti agar namanya dikenal, disebut, atau dihormati di antara umat Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְנָה
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan peristiwa dalam narasi; “lalu” menyampaikan kesinambungan itu secara alami dalam bahasa Indonesia.
- source_word: הַנָּשִׁים
  choice: para perempuan itu
  rationale: Nomina jamak definit ini menunjuk kepada para perempuan dalam komunitas yang hadir pada adegan tersebut.
- source_word: בָּרוּךְ יְהוָה
  choice: Terpujilah Yahweh
  rationale: Ungkapan ini merupakan formula berkat atau pujian Ibrani. “Terpujilah” mempertahankan daya benediktifnya dalam bahasa Indonesia yang wajar, sedangkan nama ilahi ditransliterasikan sebagai “Yahweh”.
- source_word: אֲשֶׁר לֹא הִשְׁבִּית לָךְ
  choice: yang ... tidak membiarkan engkau tanpa
  rationale: Bentuk Hifil dari שבת di sini menyatakan bahwa sesuatu tidak dibuat berhenti atau tidak dibiarkan tiada bagi Naomi. Rumusan ini menyampaikan makna kontekstualnya tanpa terikat pada susunan Ibrani yang kaku.
- source_word: גֹּאֵל
  choice: penebus
  rationale: Istilah ini menunjuk pada kerabat yang menjalankan kewajiban hukum-keluarga untuk memulihkan dan melindungi keluarga. “Penebus” mempertahankan istilah utama dan membiarkan konteks serta catatan kaki menjelaskan nuansa kekerabatannya.
- source_word: הַיּוֹם
  choice: hari ini
  rationale: Padanan temporal yang langsung dan alami dalam bahasa Indonesia modern.
- source_word: וְיִקָּרֵא שְׁמוֹ
  choice: dan semoga namanya termasyhur
  rationale: Secara harfiah frasa ini berarti “dan semoga namanya disebut.” Dalam konteks berkat, maksudnya ialah agar namanya dikenal, disebut dengan hormat, atau menjadi ternama; “termasyhur” menyampaikan daya idiomatis itu.
- source_word: בְּיִשְׂרָאֵל
  choice: di Israel
  rationale: Frasa ini menunjukkan lingkungan tempat nama tersebut akan dikenal dan dihormati.
theological_decisions:
- issue: Acuan kata גֹּאֵל (“penebus”)
  choice: Teks utama mempertahankan kata “penebus” tanpa menetapkan apakah acuannya secara khusus adalah bayi yang baru lahir atau mencakup peranan Boas dalam pemulihan keluarga Naomi.
  alternative: Acuannya dapat dipahami secara khusus sebagai anak yang baru lahir, atau sebagai Boas selaku kerabat-penebus yang melalui kelahiran anak itu memulihkan garis keluarga.
  rationale: Konteks langsung setelah kelahiran dan kata ganti pada “namanya” mendukung bayi sebagai acuan terdekat. Namun, keseluruhan kerangka hukum-keluarga pasal ini tetap menonjolkan peranan Boas. Terjemahan tidak menutup ambiguitas yang ada dalam teks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Engkau” mempertahankan sapaan tunggal kepada Naomi tanpa terdengar terlalu sehari-hari. Susunan kalimat mengikuti alur Ibrani, tetapi idiom yang berpotensi kabur diterjemahkan secara alami; ambiguitas mengenai identitas penebus tetap dipertahankan.
