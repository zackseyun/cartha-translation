base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/011.yaml
  text: Then all the people who were at the gate[a], and the elders, said, “We are witnesses. May Yahweh make the woman who is coming into your house like Rachel and Leah, who together built up the house of Israel. And may you prosper in Ephrathah and proclaim a name in Bethlehem.”
translation:
  language: id
  text: Lalu seluruh rakyat yang berada di pintu gerbang dan para tua-tua berkata, “Kami adalah saksi. Semoga Yahweh menjadikan perempuan yang masuk ke rumahmu seperti Rahel dan Lea, yang bersama-sama membangun keluarga Israel. Semoga engkau berhasil[a] di Efrata dan menjadi ternama di Betlehem.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bertindak dengan gagah perkasa,” “menunjukkan kecakapan,” atau “menjadi makmur”; ungkapan Ibrani ini dapat menyatakan keberanian, kekuatan, kemampuan, kekayaan, atau keberhasilan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵדִים
  choice: Kami menjadi saksi
  rationale: Nomina Ibrani ini berfungsi sebagai pernyataan kesaksian; bentuk ini alami dalam bahasa Indonesia dan tidak menambahkan isi di luar kopula yang tersirat.
- source_word: יִתֵּן יְהוָה
  choice: Semoga Yahweh menjadikan
  rationale: Dalam rumusan berkat ini, נתן bermakna idiomatis ‘menjadikan’ dan bentuk ‘semoga’ mempertahankan daya optatifnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap terlihat.
- source_word: הָאִשָּׁה הַבָּאָה אֶל בֵּיתֶךָ
  choice: perempuan yang masuk ke rumahmu ini
  rationale: Mempertahankan gambaran konkret tentang perempuan yang memasuki rumah Boas melalui perkawinan; ‘ini’ menandai rujukan tertentu yang tersirat oleh artikel Ibrani.
- source_word: אֲשֶׁר בָּנוּ שְׁתֵּיהֶם אֶת בֵּית יִשְׂרָאֵל
  choice: yang bersama-sama membangun kaum Israel
  rationale: ‘Bersama-sama’ menyampaikan שְׁתֵּיהֶם secara alami, sedangkan ‘membangun kaum Israel’ mempertahankan metafora pembentukan keluarga atau bangsa.
- source_word: וַעֲשֵׂה חַיִל
  choice: Semoga engkau berjaya
  rationale: Dalam konteks berkat perkawinan, ‘berjaya’ mencakup keberhasilan dan kemajuan tanpa membatasi חַיִל hanya pada kekayaan atau keberanian.
- source_word: בְּאֶפְרָתָה
  choice: di Efrata
  rationale: Nama tempat dipertahankan sesuai bentuk Ibrani dan pemakaian Indonesia yang lazim.
- source_word: וּקְרָא שֵׁם
  choice: menjadi ternama
  rationale: Ungkapan harfiah ‘menyerukan nama’ berfungsi sebagai idiom untuk memperoleh nama atau kemasyhuran; ‘menjadi ternama’ menyampaikan maksud itu secara wajar.
- source_word: בְּבֵית לָחֶם
  choice: di Betlehem
  rationale: Transliterasi baku nama tempat dengan preposisi lokasi yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks menyebut Tetragramaton secara langsung; ‘Yahweh’ mempertahankannya sebagai nama ilahi tanpa menggantinya dengan gelar.
- issue: Cakupan makna חַיִל dalam berkat
  choice: berjaya
  alternative: bertindak gagah perkasa, menunjukkan kecakapan, atau menjadi makmur
  rationale: Kata ini dapat menunjuk kekuatan, keberanian, kecakapan, kekayaan, atau keberhasilan. Terjemahan utama tidak mempersempitnya pada satu konsep teologis atau material saja, dan alternatifnya dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur berkat dipertahankan dengan ‘semoga’, nama tempat mengikuti bentuk yang lazim, dan idiom Ibrani diungkapkan secara alami tanpa menghapus ambiguitas leksikal חַיִל.
