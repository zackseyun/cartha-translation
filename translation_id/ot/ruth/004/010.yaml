- from: Juga Rut, perempuan Moab itu, istri Mahlon, telah kuperoleh[a] menjadi istriku untuk menegakkan nama orang yang telah meninggal itu atas tanah warisannya[b], supaya nama orang itu tidak terputus dari antara saudara-saudaranya dan dari gerbang kotanya[c]. Kalian adalah saksi pada hari ini.
  to: Aku juga telah memperoleh Rut, perempuan Moab, istri Mahlon, menjadi istriku[a], untuk menegakkan nama orang yang telah meninggal itu atas warisannya[b], supaya nama orang yang telah meninggal itu tidak terputus dari antara saudara-saudaranya dan dari gerbang kotanya[c]. Kalian adalah saksi hari ini.
  rationale: Revisi ini mempertahankan pilihan leksikal utama draf dan catatan kaki yang relevan, sambil memulihkan pengulangan "orang yang telah meninggal" dari teks Ibrani, menghindari penyempitan "warisan" menjadi "tanah warisan," dan melicinkan susunan serta penutup kalimat untuk bahasa Indonesia modern.
