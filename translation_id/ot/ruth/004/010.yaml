id: RUT.4.10
reference: Ruth 4:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/גַ֣ם אֶת ר֣וּת הַ/מֹּאֲבִיָּה֩ אֵ֨שֶׁת מַחְל֜וֹן קָנִ֧יתִי לִ֣/י לְ/אִשָּׁ֗ה לְ/הָקִ֤ים שֵׁם הַ/מֵּת֙ עַל נַ֣חֲלָת֔/וֹ וְ/לֹא יִכָּרֵ֧ת שֵׁם הַ/מֵּ֛ת מֵ/עִ֥ם אֶחָ֖י/ו וּ/מִ/שַּׁ֣עַר מְקוֹמ֑/וֹ עֵדִ֥ים אַתֶּ֖ם הַ/יּֽוֹם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/010.yaml
  text: And also Ruth the Moabite[a], the wife of Mahlon, I have acquired for myself as a wife, to raise up the name of the dead over his inheritance, so that the name of the dead may not be cut off from among his brothers and from the gate of his place[c][b]. You are witnesses today.
translation:
  language: id
  text: Aku juga telah memperoleh Rut, perempuan Moab, istri Mahlon, menjadi istriku[a], untuk menegakkan nama orang yang telah meninggal itu atas warisannya[b], supaya nama orang yang telah meninggal itu tidak terputus dari antara saudara-saudaranya dan dari gerbang kotanya[c]. Kalian adalah saksi hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “telah kubeli.” Kata kerja Ibrani ini dapat berarti memperoleh melalui pembelian dalam suatu transaksi hukum.'
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, agar garis keluarga dan kedudukan hukum orang yang meninggal itu tetap terpelihara sehubungan dengan warisannya.
    reason: cultural_note
  - marker: c
    text: Gerbang kota adalah tempat umum untuk menyaksikan dan menyelesaikan perkara hukum.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם
  choice: Juga
  rationale: Menyatakan tambahan yang menghubungkan pernyataan ini dengan transaksi hukum pada ayat sebelumnya secara alami dalam bahasa Indonesia.
- source_word: רוּת הַמֹּאֲבִיָּה
  choice: Rut, perempuan Moab itu
  rationale: Menyampaikan nama diri dan identitas asalnya dengan bahasa Indonesia modern tanpa bentuk arkais.
- source_word: אֵשֶׁת מַחְלוֹן
  choice: istri Mahlon
  rationale: Mengikuti ungkapan harfiah sumber, yang menyebutnya sebagai istri Mahlon dan bukan memakai kata khusus untuk janda.
- source_word: קָנִיתִי לִי
  choice: telah kuperoleh
  rationale: Mempertahankan nuansa memperoleh melalui transaksi hukum tanpa secara sepihak menggambarkan Rut sebagai komoditas; kemungkinan arti 'kubeli' dicatat dalam catatan kaki.
- source_word: לְאִשָּׁה
  choice: menjadi istriku
  rationale: Ungkapan Indonesia yang wajar untuk tujuan dan hasil perkawinan dalam frasa hukum ini.
- source_word: לְהָקִים שֵׁם הַמֵּת
  choice: untuk menegakkan nama orang yang telah meninggal itu
  rationale: Mempertahankan metafora 'menegakkan' sekaligus menjelaskan bahwa yang dimaksud ialah orang yang sudah meninggal.
- source_word: עַל נַחֲלָתוֹ
  choice: atas tanah warisannya
  rationale: Menjaga hubungan nama orang yang meninggal dengan milik pusakanya; 'tanah warisan' membuat konteks kepemilikan lahan jelas dan alami.
- source_word: וְלֹא יִכָּרֵת
  choice: supaya ... tidak terputus
  rationale: Mempertahankan citra kuat kata kerja Ibrani כרת dan maksud tujuan dalam konteks kelangsungan garis keluarga.
- source_word: מֵעִם אֶחָיו
  choice: dari antara saudara-saudaranya
  rationale: Dekat dengan kata Ibrani 'saudara-saudaranya' serta tidak menutup kemungkinan cakupan kekerabatan yang lebih luas dalam konteks kaum.
- source_word: וּמִשַּׁעַר מְקוֹמוֹ
  choice: dan dari gerbang kotanya
  rationale: Mengungkapkan secara wajar tempat pengakuan publik dan penyelesaian perkara hukum; 'kotanya' menyampaikan מְקוֹמוֹ sesuai konteks permukiman.
- source_word: עֵדִים אַתֶּם הַיּוֹם
  choice: Kalian adalah saksi pada hari ini
  rationale: Pernyataan hukum yang jelas dan bermartabat kepada para tua-tua dan orang banyak yang hadir.
theological_decisions:
- issue: Sifat tindakan Boas terhadap Rut dalam konteks penebusan hukum
  choice: telah kuperoleh menjadi istriku
  alternative: telah kubeli menjadi istriku; telah kuambil menjadi istriku
  rationale: Kata קנה memiliki daya transaksional, tetapi seluruh kalimat menempatkannya dalam kerangka perkawinan, penebusan, warisan, dan pemeliharaan nama orang yang meninggal. Pilihan ini tidak menghapus segi hukumnya dan tidak pula melebih-lebihkan kesan komodifikasi.
- issue: Makna menegakkan nama orang yang meninggal
  choice: Mempertahankan ungkapan metaforis dalam teks dan memberi penjelasan budaya dalam catatan kaki
  alternative: Mengganti langsung dengan 'melanjutkan garis keturunannya'
  rationale: Teks Ibrani berbicara tentang menegakkan nama pada warisan, suatu gagasan yang mencakup garis keluarga sekaligus kedudukan hukum; parafrasa tunggal akan mempersempit maknanya.
- issue: Cakupan אֶחָיו
  choice: saudara-saudaranya
  alternative: kerabatnya; saudara-saudara laki-lakinya
  rationale: Pilihan ini dekat dengan bentuk sumber, namun tetap memungkinkan nuansa hubungan kaum dalam konteks hukum keluarga tanpa menentukan secara berlebihan bahwa hanya saudara kandung laki-laki yang dimaksud.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada deklarasi hukum yang bermartabat. Bentuk 'kuperoleh' dan 'istriku' menjaga kelancaran tuturan orang pertama; 'Kalian' wajar untuk menyapa kelompok yang hadir. Istilah budaya yang tidak langsung dipahami dipertahankan dalam teks dan dijelaskan melalui catatan kaki.
