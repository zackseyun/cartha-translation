base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/001.yaml
  text: Boaz had gone up to the gate and sat down there[a], and behold, the kinsman-redeemer of whom Boaz had spoken was passing by. So he said, "Turn aside, sit down here[b], so-and-so." And he turned aside and sat down.
translation:
  language: id
  text: Boas naik ke pintu gerbang kota lalu duduk di sana.[a] Tampaklah penebus kerabat yang pernah disebut Boas sedang lewat. Boas berkata, “Menepilah dan duduklah di sini, Saudara Anu.”[b] Orang itu pun menepi lalu duduk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pintu gerbang kota merupakan tempat umum untuk urusan hukum dan kemasyarakatan.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, ungkapan Ibraninya adalah “Peloni Almoni”, yaitu sebutan seperti “si Anu” yang sengaja tidak menyatakan nama orang tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָה הַשַּׁעַר
  choice: pergi ke pintu gerbang kota
  rationale: עָלָה secara harfiah berarti ‘naik/pergi ke atas’, tetapi dalam konteks perjalanan menuju gerbang kota, bahasa Indonesia alami cukup memakai ‘pergi ke’. Kata ‘kota’ memperjelas bahwa yang dimaksud ialah gerbang permukiman, bukan pintu biasa.
- source_word: וְהִנֵּה
  choice: Pada saat itu, tampaklah
  rationale: Ungkapan ini menarik perhatian kepada perkembangan yang penting dan seolah kebetulan terjadi. ‘Tampaklah’ mempertahankan daya hidup narasi tanpa memakai bentuk arkais ‘lihatlah’.
- source_word: הַגֹּאֵל
  choice: penebus dari kaum kerabat
  rationale: גֹּאֵל menunjuk kerabat yang mempunyai peranan hukum untuk menebus atau memulihkan hak keluarga. Terjemahan ini mempertahankan unsur penebusan sekaligus hubungan kekerabatan tanpa menjadikannya gelar teknis yang sukar dipahami.
- source_word: עֹבֵר
  choice: sedang lewat
  rationale: Bentuk partisip Ibrani menyatakan tindakan yang sedang berlangsung ketika Boas melihat orang itu.
- source_word: אֲשֶׁר דִּבֶּר בֹּעַז
  choice: yang pernah dibicarakan Boas
  rationale: Klausa ini mengenali orang tersebut sebagai kerabat penebus yang sebelumnya telah disebut oleh Boas.
- source_word: סוּרָה שְׁבָה פֹה
  choice: Singgahlah dan duduklah di sini
  rationale: סור berarti menyimpang atau berbelok dari jalur. Dalam sapaan Indonesia, ‘singgahlah’ secara alami menyampaikan undangan untuk berhenti dan menghampiri tempat Boas sebelum duduk.
- source_word: פְּלֹנִי אַלְמֹנִי
  choice: Saudara Anu
  rationale: Ungkapan idiomatis ini sengaja tidak menyebut nama orang itu. ‘Saudara Anu’ cocok sebagai sapaan langsung kepada seorang laki-laki dan mempertahankan anonimitasnya.
- source_word: וַיָּסַר וַיֵּשֶׁב
  choice: Orang itu pun singgah lalu duduk
  rationale: Terjemahan menggemakan perintah Boas dan menunjukkan bahwa orang itu mematuhinya; ‘pun’ menandai respons dalam alur narasi.
theological_decisions:
- issue: Cakupan makna גֹּאֵל
  choice: penebus dari kaum kerabat
  alternative: penebus; kerabat terdekat; penebus kerabat
  rationale: Pilihan ini tidak membatasi tokoh itu hanya sebagai kerabat terdekat dan tidak memberi kesan bahwa penebusan di sini semata-mata bersifat rohani. Hubungan keluarga dan fungsi hukumnya sama-sama dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. ‘Saudara Anu’ dipakai sebagai sapaan langsung yang alami; ‘penebus dari kaum kerabat’ menjelaskan istilah hukum-keluarga tanpa jargon denominasi. Penanda catatan ditempatkan setelah unsur yang diterangkannya.
