base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/008.yaml
  text: So the redeemer said to Boaz[b][a], “Buy it for yourself,” and he took off his sandal.
translation:
  language: id
  text: Lalu penebus[a] itu berkata kepada Boas, “Belilah itu untuk dirimu sendiri.” Kemudian penebus itu melepaskan sandalnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kerabat-penebus”. Istilah Ibrani ini menunjuk kepada kerabat dekat yang memiliki tanggung jawab hukum untuk menebus kembali milik keluarga atau mempertahankan garis keturunan keluarga.
    reason: lexical_alternative
  - marker: b
    text: Melepaskan sandal merupakan tanda hukum yang lazim dalam transaksi ini; bandingkan Rut 4:7.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “Lalu” menyampaikan perkembangan peristiwa secara alami dalam bahasa Indonesia.
- source_word: הַגֹּאֵל
  choice: penebus
  rationale: Dalam konteks Rut, istilah ini menunjuk kepada kerabat dekat yang memiliki tanggung jawab hukum untuk menebus milik keluarga atau mempertahankan garis keturunan. “Penebus” ringkas dan mempertahankan istilah kunci, sedangkan cakupan khususnya dijelaskan dalam catatan kaki.
- source_word: לְבֹעַז
  choice: kepada Boas
  rationale: Padanan alami bagi preposisi לְ yang mengantar pihak yang diajak bicara; nama Ibrani בֹּעַז ditulis menurut bentuk Indonesia yang lazim, “Boas”.
- source_word: קְנֵה
  choice: Belilah
  rationale: Imperatif קנה dalam transaksi hukum ini berarti membeli atau memperoleh. “Belilah” merupakan padanan langsung dan wajar.
- source_word: לָךְ
  choice: untuk dirimu sendiri
  rationale: Frasa ini menegaskan bahwa Boas harus mengambil hak pembelian itu bagi dirinya; bentuk refleksif mempertahankan penekanannya.
- source_word: וַיִּשְׁלֹף
  choice: Kemudian ia melepaskan
  rationale: Kata kerja ini berarti menarik keluar atau menanggalkan. Untuk alas kaki, “melepaskan” adalah ungkapan Indonesia yang alami; “Kemudian” memperjelas urutan tanpa menambah isi.
- source_word: נַעֲלוֹ
  choice: sandalnya
  rationale: נַעַל menunjuk pada alas kaki, dan “sandal” lebih sesuai dengan latar budaya Timur Dekat kuno daripada “sepatu”.
