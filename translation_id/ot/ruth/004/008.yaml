translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan urutan narasi, istilah hukum utama, dan tindakan simbolis dalam teks sumber. Penanda catatan kaki ditempatkan tepat sesudah unsur yang dijelaskan.
