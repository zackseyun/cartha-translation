  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ לַ/גֹּאֵ֔ל חֶלְקַת֙ הַ/שָּׂדֶ֔ה אֲשֶׁ֥ר לְ/אָחִ֖י/נוּ לֶ/אֱלִימֶ֑לֶךְ מָכְרָ֣ה נָעֳמִ֔י הַ/שָּׁ֖בָה מִ/שְּׂדֵ֥ה מוֹאָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/004/003.yaml
  text: Then he said to the redeemer[a], “Naomi, who has returned from the fields of Moab[c][b], is selling the portion of the field that belonged to our brother Elimelech.”
translation:
  language: id
  text: Lalu Boas berkata kepada penebus itu, “Naomi, yang telah kembali dari daerah Moab, sedang menjual sebidang tanah yang merupakan milik saudara kita, Elimelekh.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah menjual.” Bentuk Ibrani dapat dipahami sebagai tindakan yang sudah selesai, tetapi dalam pembicaraan hukum ini juga dapat diterjemahkan sebagai tindakan yang sedang berlangsung.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu Boas berkata
  rationale: Waw konsekutif melanjutkan alur cerita. Subjek tersirat dijelaskan sebagai Boas dari konteks langsung agar bahasa Indonesia alami dan rujukannya jelas.
- source_word: לַגֹּאֵל
  choice: kepada penebus itu
  rationale: גֹּאֵל menunjuk kerabat yang memiliki hak dan tanggung jawab hukum untuk menebus milik keluarga. 'Penebus' mempertahankan istilah utama tanpa mempersempit tugasnya menjadi sekadar kerabat terdekat.
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: bagian ladang
  rationale: חֶלְקָה berarti bagian atau sebidang tanah; ungkapan ini dekat dengan susunan Ibrani dan tetap wajar dalam bahasa Indonesia.
- source_word: אֲשֶׁר לְאָחִינוּ לֶאֱלִימֶלֶךְ
  choice: milik saudara kita, Elimelekh
  rationale: Konstruksi dengan לְ menyatakan kepemilikan atau keterkaitan. 'Saudara kita' mempertahankan bahasa kekerabatan yang tidak harus berarti saudara kandung.
- source_word: מָכְרָה
  choice: hendak menjual
  rationale: Bentuk perfektum secara harfiah dapat dipahami sebagai 'telah menjual', tetapi dalam perundingan hukum ini transaksi masih diajukan kepada penebus. 'Hendak menjual' menyampaikan tindakan yang sedang ditawarkan tanpa menyatakan bahwa penjualan telah selesai.
- source_word: נָעֳמִי
  choice: Naomi
  rationale: Bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: הַשָּׁבָה
  choice: yang telah kembali
  rationale: Partisipel dengan artikel mengidentifikasi Naomi sebagai orang yang kembali; bentuk ini mempertahankan relevansi hasil kepulangannya.
- source_word: מִשְּׂדֵה מוֹאָב
  choice: dari daerah Moab
  rationale: Secara harfiah ungkapan ini menyebut 'ladang/daerah Moab', tetapi berfungsi sebagai idiom bagi wilayah atau pedalaman Moab. 'Daerah Moab' alami dan tidak menimbulkan kesan bahwa Naomi hanya pulang dari lahan pertanian tertentu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Istilah hukum-kekerabatan 'penebus' dipertahankan, sedangkan idiom geografis Ibrani diterjemahkan secara alami. Nama Elimelekh mengikuti transliterasi yang lebih dekat dengan bentuk Ibrani.
