source:
  edition: WLC
  text: וַ/תֹּ֥אמֶר לָ֖/הּ נָעֳמִ֣י חֲמוֹתָ֑/הּ בִּתִּ֞/י הֲ/לֹ֧א אֲבַקֶּשׁ לָ֛/ךְ מָנ֖וֹחַ אֲשֶׁ֥ר יִֽיטַב לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/001.yaml
  text: Then Naomi her mother-in-law said to her[a], “My daughter, should I not seek a resting place for you, that it may go well with you?”
translation:
  language: id
  text: Lalu Naomi, ibu mertuanya, berkata kepadanya, “Anakku, bukankah seharusnya aku mencarikan tempat perhentian[a] bagimu, supaya hidupmu sejahtera?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketenteraman,” “jaminan hidup,” atau “rumah.” Dalam konteks ini Naomi mengusahakan kehidupan yang tenteram dan menetap bagi Rut, kemungkinan melalui pernikahan, tetapi teks Ibrani memakai kata “perhentian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk waw-konsekutif melanjutkan alur cerita; “Lalu” menyatakan urutan secara alami dalam narasi Indonesia.
- source_word: נָעֳמִי
  choice: Naomi
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: חֲמוֹתָהּ
  choice: ibu mertuanya
  rationale: Nomina dengan sufiks orang ketiga feminin tunggal menyatakan hubungan Naomi dengan Rut.
- source_word: בִּתִּי
  choice: Anakku
  rationale: Sapaan harfiah yang menyatakan kasih sayang dan hubungan kekeluargaan; bentuk ini alami dalam bahasa Indonesia tanpa menambahkan nuansa yang tidak tersurat.
- source_word: הֲלֹא אֲבַקֶּשׁ
  choice: bukankah seharusnya aku mencarikan
  rationale: הֲלֹא memperkenalkan pertanyaan retoris yang mengharapkan persetujuan, sedangkan bentuk benefaktif “mencarikan” secara alami menyampaikan bahwa Naomi mencari sesuatu bagi Rut.
- source_word: מָנוֹחַ
  choice: tempat perhentian
  rationale: Nomina ini dapat menunjuk pada istirahat atau keadaan/tempat aman dan menetap. Ungkapan ini mempertahankan metafora Ibrani dan tidak langsung menafsirkan maksudnya sebagai suami atau pernikahan.
- source_word: אֲשֶׁר יִיטַב לָךְ
  choice: supaya hidupmu sejahtera
  rationale: Klausa ini menyatakan hasil yang baik bagi Rut. Terjemahan tersebut alami dalam bahasa Indonesia dan mengungkapkan kesejahteraan menyeluruh, bukan sekadar sesuatu yang abstrak “baik” baginya.
theological_decisions:
- issue: Apakah מָנוֹחַ harus dijelaskan langsung sebagai pernikahan atau suami
  choice: Mempertahankan “tempat perhentian” dalam teks utama
  alternative: “rumah tangga,” “jaminan hidup,” atau “suami”
  rationale: Konteks berikutnya mengarah pada kesejahteraan yang menetap, kemungkinan melalui pernikahan, tetapi ayat ini sendiri memakai istilah “perhentian.” Terjemahan tidak boleh menutup keluasan makna itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. “Anakku” mempertahankan kehangatan sapaan, sedangkan “tempat perhentian” sengaja mempertahankan metafora dan ambiguitas sumber.
