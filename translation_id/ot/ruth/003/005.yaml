  text: And she said to her[a], “All that you say, I will do.”
translation:
  language: id
  text: Lalu Rut berkata kepadanya, “Semua yang Ibu katakan akan kulakukan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Lalu Rut berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita. Nama Rut dicantumkan untuk memperjelas subjek pronominal dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: אֵלֶיהָ
  choice: kepadanya
  rationale: Preposisi אֶל dengan sufiks feminin tunggal menunjukkan arah perkataan kepada Naomi; 'kepadanya' merupakan padanan Indonesia yang alami.
- source_word: כֹּל אֲשֶׁר
  choice: Semua yang
  rationale: Ungkapan ini menyatakan keseluruhan hal yang akan dikatakan dan tetap dekat dengan susunan Ibrani.
- source_word: תֹּאמְרִי
  choice: Ibu katakan
  rationale: Bentuk Qal imperfek orang kedua feminin tunggal mengacu pada perkataan atau petunjuk Naomi. Sapaan 'Ibu' menyampaikan hubungan hormat secara alami dalam bahasa Indonesia, sedangkan 'katakan' tidak menambahkan objek yang tidak tersurat.
- source_word: אֶעֱשֶׂה
  choice: akan kulakukan
  rationale: Bentuk Qal imperfek orang pertama tunggal menyatakan tekad atau niat Rut; bentuk ini ringkas dan alami serta tidak menambahkan objek eksplisit.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Nama Rut memperjelas subjek, sementara sapaan 'Ibu' menjaga kewajaran dialog antara Rut dan Naomi.
