  register: Bahasa Indonesia baku, modern, dan naratif. 'Boas' dan 'jelai' mengikuti bentuk yang lazim dalam terjemahan Alkitab Indonesia. 'Kautemani' menjaga kejelasan hubungan Rut dengan para pekerja perempuan Boas tanpa memberi nuansa kepemilikan atau perbudakan yang terlalu kuat.
