base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/002.yaml
  text: And now[a], is not Boaz our relative, with whose young women you have been? Look[b], he is winnowing barley at the threshing floor tonight.
translation:
  language: id
  text: Sekarang, bukankah Boas kerabat kita[a], yang para pekerja perempuannya pernah kautemani? Lihatlah, malam ini ia menampi jelai di tempat pengirikan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sanak kita.” Istilah Ibrani ini dapat menunjukkan hubungan keluarga atau kaum, bukan sekadar kenalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Penanda wacana ini mengantar langkah berikutnya dalam rencana Naomi. Dalam bahasa Indonesia, 'Sekarang' secara alami mencakup fungsi penghubung dan temporal tanpa perlu menambahkan 'dan'.
- source_word: הֲלֹא
  choice: bukankah
  rationale: Bentuk ini memperkenalkan pertanyaan retoris yang mengharapkan persetujuan.
- source_word: מֹדַעְתָּנוּ
  choice: kerabat kita
  rationale: Dalam konteks ini, istilah tersebut menunjuk hubungan keluarga atau kaum, bukan sekadar orang yang dikenal.
- source_word: אֲשֶׁר הָיִית אֶת נַעֲרוֹתָיו
  choice: yang pekerja-pekerja perempuannya telah kautemani
  rationale: Terjemahan ini mempertahankan klausa relatif dan menyatakan bahwa Rut berada bersama para perempuan muda yang bekerja pada Boas; 'pekerja-pekerja perempuan' cocok dengan konteks panen tanpa menegaskan status budak.
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Kata ini mengarahkan perhatian pada keadaan yang penting bagi rencana Naomi dan tetap wajar dalam ragam naratif yang bermartabat.
- source_word: זֹרֶה
  choice: menampi
  rationale: Partisip Ibrani menggambarkan kegiatan yang sedang atau segera berlangsung; konteks malam ini menempatkannya sebagai kegiatan pada malam tersebut.
- source_word: גֹּרֶן הַשְּׂעֹרִים
  choice: jelai di tempat pengirikan
  rationale: Secara sintaksis frasa ini dapat tampak sebagai 'tempat pengirikan jelai', tetapi secara semantis yang ditampi ialah jelai. Terjemahan Indonesia ini menyampaikan objek kegiatan dan lokasinya secara tepat serta alami.
- source_word: הַלָּיְלָה
  choice: malam ini
  rationale: Ungkapan waktu ini paling alami diterjemahkan 'malam ini' dalam bahasa Indonesia modern.
