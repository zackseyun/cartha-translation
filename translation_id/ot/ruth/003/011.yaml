source:
  edition: WLC
  text: וְ/עַתָּ֗ה בִּתִּ/י֙ אַל תִּ֣ירְאִ֔י כֹּ֥ל אֲשֶׁר תֹּאמְרִ֖י אֶֽעֱשֶׂה לָּ֑/ךְ כִּ֤י יוֹדֵ֨עַ֙ כָּל שַׁ֣עַר עַמִּ֔/י כִּ֛י אֵ֥שֶׁת חַ֖יִל אָֽתְּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/011.yaml
  text: And now[a], my daughter, do not fear. All that you say, I will do for you[b], for all the gate of my people knows that you are a woman of noble character.
translation:
  language: id
  text: Sekarang, anakku, jangan takut. Segala yang kaukatakan akan kulakukan bagimu, sebab semua orang di antara bangsaku[a] tahu bahwa engkau adalah perempuan yang luhur budinya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seluruh pintu gerbang bangsaku.” Pintu gerbang kota merupakan tempat masyarakat berkumpul serta tempat pengakuan umum dan urusan hukum berlangsung; karena itu, ungkapan ini berarti seluruh masyarakat atau semua orang di pintu gerbang.
    reason: cultural_note
  - marker: b
    text: Dapat juga diterjemahkan “perempuan yang cakap,” “perempuan yang bernilai,” atau “perempuan yang perkasa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּתִּי
  choice: anakku
  rationale: Sapaan ini secara harfiah berarti “anakku perempuan,” tetapi dalam konteks merupakan sapaan hangat dan melindungi, bukan pernyataan bahwa Rut adalah anak kandung Boas. “Anakku” alami dalam bahasa Indonesia dan mempertahankan nuansa tersebut.
- source_word: אַל תִּירְאִי
  choice: jangan takut
  rationale: Larangan sekaligus peneguhan ini diterjemahkan langsung dan alami.
- source_word: כֹּל אֲשֶׁר תֹּאמְרִי אֶעֱשֶׂה לָּךְ
  choice: Segala yang kaukatakan akan kulakukan bagimu
  rationale: Mempertahankan verba “mengatakan” dan keluasan janji Boas tanpa mempersempitnya menjadi sekadar permintaan.
- source_word: כָּל שַׁעַר עַמִּי
  choice: seluruh masyarakat kotaku
  rationale: “Pintu gerbang” dipakai secara metonimis bagi masyarakat atau forum publik kota. Terjemahan utama menyampaikan maksud ungkapan itu secara alami, sedangkan citra harfiahnya dijelaskan dalam catatan kaki.
- source_word: אֵשֶׁת חַיִל
  choice: perempuan yang luhur budinya
  rationale: חַיִל mencakup keluhuran, kecakapan, kekuatan, dan nilai diri. Pilihan ini menonjolkan reputasi moral Rut dalam konteks tanpa membatasi ungkapan itu pada keberanian militer; keluasan maknanya dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Makna pujian אֵשֶׁת חַיִל
  choice: perempuan yang luhur budinya
  alternative: perempuan yang cakap; perempuan yang bernilai; perempuan yang perkasa
  rationale: Ungkapan ini memuji integritas, kekuatan, kecakapan, dan kelayakan Rut yang diakui di muka umum. Terjemahan tidak membatasinya pada moralitas saja ataupun memberinya kesan militer yang terlalu kuat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hangat dan bermartabat. Bentuk terikat “kau-” dipakai agar dialog tetap alami. Metonimia pintu gerbang dialihkan secara idiomatis dalam teks utama dan dijelaskan dalam catatan kaki.
