base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/010.yaml
  text: And he said[a], “May you be blessed by Yahweh, my daughter. You have made this last kindness greater than the first by not going after the young men, whether poor or rich.”
translation:
  language: id
  text: Kemudian ia berkata, “Kiranya engkau diberkati oleh Yahweh, anakku. Kasih setiamu yang terakhir ini lebih besar daripada yang pertama, karena engkau tidak mengejar para pemuda, baik yang miskin maupun yang kaya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּרוּכָה אַתְּ לַיהוָה
  choice: Kiranya engkau diberkati oleh Yahweh
  rationale: Ungkapan ini merupakan formula berkat. Bentuk “kiranya” menyampaikan daya benediktifnya secara alami, sedangkan לַיהוָה dipahami sebagai Yahweh yang menjadi sumber berkat.
- source_word: בִּתִּי
  choice: anakku
  rationale: Sapaan penuh kasih dari orang yang lebih tua kepada perempuan yang lebih muda. “Anakku” alami dalam bahasa Indonesia dan mempertahankan nuansa relasional tanpa menyiratkan hubungan biologis.
- source_word: הֵיטַבְתְּ חַסְדֵּךְ הָאַחֲרוֹן מִן הָרִאשׁוֹן
  choice: Kasih setia yang kautunjukkan sekarang lebih besar daripada yang dahulu
  rationale: Mengungkapkan perbandingan antara tindakan Ruth saat ini dan kebaikannya sebelumnya secara jelas dan wajar, tanpa mempertahankan susunan Ibrani yang kaku.
- source_word: חַסְדֵּךְ
  choice: kasih setia
  rationale: חֶסֶד di sini menunjuk pada kebaikan yang lahir dari kesetiaan relasional Ruth kepada keluarga Naomi. “Kasih setia” mempertahankan baik unsur kemurahan hati maupun loyalitas.
- source_word: לְבִלְתִּי לֶכֶת אַחֲרֵי
  choice: karena engkau tidak mengejar
  rationale: Konstruksi infinitif menjelaskan dasar penilaian Boas. “Mengejar” mempertahankan idiom tentang mencari seorang calon pasangan.
- source_word: הַבַּחוּרִים
  choice: pemuda-pemuda
  rationale: Merujuk kepada laki-laki muda yang dapat dipilih Ruth sebagai calon pasangan. Bentuk ini juga mempertahankan kemungkinan kontras usia dengan Boas tanpa membuatnya eksplisit.
- source_word: אִם דַּל וְאִם עָשִׁיר
  choice: baik yang miskin maupun yang kaya
  rationale: Merisme ini mencakup seluruh rentang keadaan ekonomi para pemuda dan diterjemahkan dengan pasangan ungkapan Indonesia yang alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
theological_decisions:
- issue: Makna חֶסֶד dalam pujian Boas
  choice: kasih setia
  alternative: kebaikan; kemurahan hati; kesetiaan
  rationale: Konteks memuji tindakan konkret Ruth yang sekaligus murah hati dan setia kepada keluarga Naomi. “Kasih setia” mempertahankan keluasan relasional istilah itu tanpa membatasinya secara khusus pada suatu rumusan teologis.
- issue: Penerjemahan nama יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi Allah; “Yahweh” mempertahankan fungsi nama tersebut.
- issue: Identitas tindakan pertama dan terakhir Ruth
  choice: sekarang ... dahulu
  alternative: yang terakhir ... yang pertama
  rationale: Ayat membandingkan dua tindakan kasih setia tetapi tidak menjelaskan keduanya secara eksplisit. Terjemahan mempertahankan ketidakjelasan rujukannya dan hanya menyatakan kontras waktunya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “anakku” dipilih sebagai bentuk relasional yang alami. Struktur perbandingan disusun ulang agar jelas bagi pembaca Indonesia, sambil mempertahankan ambiguitas mengenai tindakan mana yang disebut dahulu dan sekarang.
