  text: And it happened at midnight that the man trembled and turned himself[a], and behold[b], a woman was lying at his feet.
translation:
  language: id
  text: Pada tengah malam, laki-laki itu gemetar dan berbalik[a]; tampaklah seorang perempuan sedang berbaring di kakinya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang dipakai di sini jarang ditemukan dan makna tepatnya tidak pasti; kata itu mungkin menggambarkan gerakan seperti berbalik, memuntir tubuh, atau membungkuk.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di kakinya”; ungkapan Ibrani ini juga dapat menunjuk area di sekitar kaki atau tungkai bawahnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Pada
  rationale: Rangkaian naratif Ibrani mengantar peristiwa berikutnya. Dalam bahasa Indonesia, penghubung eksplisit seperti 'terjadilah' tidak diperlukan dan akan terasa lebih berat; urutan narasi tetap jelas dari keterangan waktunya.
- source_word: בַּחֲצִי הַלַּיְלָה
  choice: Pada tengah malam
  rationale: Ungkapan ini secara harfiah menunjuk pertengahan malam; 'pada tengah malam' alami, ringkas, dan tepat.
- source_word: וַיֶּחֱרַד
  choice: terkejut
  rationale: Kata חרד dapat menggambarkan reaksi gentar, gemetar, atau terkejut akibat gangguan mendadak. Dalam konteks orang yang terbangun pada malam hari, 'terkejut' menyampaikan reaksi mendadaknya secara alami tanpa menetapkan bahwa penyebabnya pasti ketakutan.
- source_word: הָאִישׁ
  choice: orang itu
  rationale: איש menunjuk Boas sebagai laki-laki yang sudah dikenal dalam konteks. 'Orang itu' mempertahankan rujukan tertentu dan lebih alami daripada mengulang nama; jenis kelaminnya sudah jelas dari konteks.
- source_word: וַיִּלָּפֵת
  choice: menggeliat
  rationale: Verba langka ini menggambarkan gerakan tubuh yang makna tepatnya tidak pasti, mungkin berbalik, memuntir, atau membungkuk. 'Menggeliat' cukup luas untuk menunjukkan gerak spontan tubuh tanpa menetapkan arah tertentu.
- source_word: וְהִנֵּה
  choice: Ternyata
  rationale: הנה menandai penemuan mendadak atau hal yang mengejutkan. 'Ternyata' menyampaikan peralihan sudut pandang dan unsur penemuan secara wajar dalam narasi Indonesia modern.
- source_word: אִשָּׁה
  choice: seorang perempuan
  rationale: Dalam konteks ini אשה berarti perempuan, bukan istri.
- source_word: שֹׁכֶבֶת
  choice: sedang berbaring
  rationale: Partisipel menggambarkan keadaan yang sedang berlangsung ketika perempuan itu ditemukan.
- source_word: מַרְגְּלֹתָיו
  choice: di dekat kakinya
  rationale: Bentuk ini dapat menunjuk kaki atau kawasan pada bagian kaki. 'Di dekat kakinya' alami dalam bahasa Indonesia dan tidak mempersempitnya menjadi kontak langsung maupun memperluasnya secara eufemistis.
theological_decisions:
- issue: Kemungkinan pembacaan seksual atau eufemistis atas adegan ini
  choice: Menggambarkan perempuan itu secara lugas sedang berbaring di dekat kaki Boas.
  alternative: Menerjemahkannya secara lebih eufemistis sebagai 'di bagian kaki atau tungkainya' untuk menonjolkan kemungkinan sindiran seksual.
  rationale: Teks Ibrani tidak secara eksplisit menyatakan tindakan seksual. Terjemahan mempertahankan ketegangan naratif tanpa memasukkan penilaian moral atau makna seksual yang tidak dinyatakan; catatan kaki menjelaskan keluasan istilah lokasinya.
translation_notes:
  register: Bahasa Indonesia modern yang alami dan bermartabat. Susunan kalimat dibuat lancar untuk narasi, sementara dua istilah Ibrani yang benar-benar ambigu dijelaskan dalam catatan kaki. 'Ternyata' dipakai sebagai padanan naratif yang wajar bagi הנה tanpa gaya arkais.
