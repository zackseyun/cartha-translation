  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לִ֣ינִי הַ/לַּ֗יְלָה וְ/הָיָ֤ה בַ/בֹּ֨קֶר֙ אִם יִגְאָלֵ֥/ךְ טוֹב֙ יִגְאָ֔ל וְ/אִם לֹ֨א יַחְפֹּ֧ץ לְ/גָֽאֳלֵ֛/ךְ וּ/גְאַלְתִּ֥י/ךְ אָנֹ֖כִי חַי יְהוָ֑ה שִׁכְבִ֖י עַד הַ/בֹּֽקֶר׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/013.yaml
  text: Stay here tonight[a], and in the morning, if he will redeem you, good—let him redeem you. But if he does not desire to redeem you, then I myself will redeem you, as Yahweh lives. Lie down until the morning.
translation:
  language: id
  text: Tinggallah di sini malam ini. Besok pagi, jika ia mau menebusmu,[a] baiklah, biarlah ia menebusmu. Tetapi jika ia tidak bersedia menebusmu, aku sendiri akan menebusmu—demi Yahweh yang hidup. Berbaringlah sampai pagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “menebus” di sini merujuk pada peran seorang kerabat penebus dalam hukum keluarga Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִינִי הַלַּיְלָה
  choice: Tinggallah di sini malam ini
  rationale: לון berarti bermalam atau tinggal sepanjang malam. Ungkapan ini alami dalam bahasa Indonesia dan konteks mendukung penambahan 'di sini' tanpa mengubah maksud.
- source_word: וְהָיָה בַבֹּקֶר
  choice: Besok pagi
  rationale: Klausa ini mengarahkan perhatian pada kejadian pada pagi berikutnya; 'besok pagi' menyampaikan urutan waktu secara wajar.
- source_word: אִם יִגְאָלֵךְ
  choice: jika ia mau menebusmu
  rationale: Bentuk imperfek dalam klausa bersyarat menunjuk pada kesediaan dan tindakan yang mungkin dilakukan. 'Menebus' mempertahankan istilah utama גאל, sedangkan nuansa hukum-keluarganya dijelaskan dalam catatan kaki.
- source_word: טוֹב יִגְאָל
  choice: baiklah, biarlah ia menebusmu
  rationale: טוֹב dipakai secara eliptis untuk menyatakan penerimaan atas hasil tersebut, dan יִגְאָל dalam konteks ini memiliki daya permisif.
- source_word: לֹא יַחְפֹּץ לְגָאֳלֵךְ
  choice: ia tidak bersedia menebusmu
  rationale: חפץ menyatakan keinginan atau kerelaan. 'Tidak bersedia' terdengar alami dan menonjolkan unsur kehendak tanpa mempersempit makna secara berlebihan.
- source_word: וּגְאַלְתִּיךְ אָנֹכִי
  choice: aku sendiri akan menebusmu
  rationale: Kata ganti אָנֹכִי yang dinyatakan secara eksplisit memberi penekanan pada komitmen pribadi Boas, yang diteruskan dengan 'aku sendiri'.
- source_word: חַי יְהוָה
  choice: demi Yahweh yang hidup
  rationale: Ini merupakan rumusan sumpah Ibrani. 'Demi Yahweh yang hidup' adalah padanan idiomatis dan bermartabat dalam bahasa Indonesia.
- source_word: שִׁכְבִי עַד הַבֹּקֶר
  choice: Berbaringlah sampai pagi
  rationale: Terjemahan langsung dan alami yang mempertahankan perintah feminin tunggal tanpa menambahkan rincian yang tidak dinyatakan.
theological_decisions:
- issue: Makna גאל dalam konteks hukum-keluarga kitab Rut
  choice: Memakai bahasa 'menebus' dalam teks utama
  alternative: bertindak sebagai penebus keluarga; menjalankan kewajiban sebagai kerabat penebus
  rationale: Kata גאל memuat kewajiban hukum dan kekeluargaan sekaligus menjadi motif teologis penting. 'Menebus' mempertahankan kaitan leksikal itu, sementara catatan kaki menerangkan nuansa yang mungkin tidak langsung dipahami pembaca modern.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama ilahi secara langsung. 'Yahweh' mempertahankan nama pribadi tersebut alih-alih menggantinya dengan gelar.
- issue: Daya rumusan sumpah חַי יְהוָה
  choice: demi Yahweh yang hidup
  alternative: seperti Yahweh hidup; Yahweh hidup
  rationale: Pilihan ini menyatakan bahwa perkataan Boas diteguhkan dengan sumpah, tanpa melemahkannya menjadi pernyataan biasa.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Pengulangan 'menebusmu' dipertahankan karena penting bagi struktur dan tema ayat. Tanda pisah sebelum rumusan sumpah membantu pembacaan tanpa mengubah hubungan sintaksis.
