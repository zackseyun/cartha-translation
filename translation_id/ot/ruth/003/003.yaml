translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Bentuk imperatif dengan akhiran -lah mempertahankan nada petunjuk Naomi. Istilah “tempat pengirikan” dipakai sebagai padanan yang jelas bagi lokasi tradisional pengirikan gandum. Semua penanda catatan kaki ditempatkan langsung sesudah unsur yang diterangkan.
