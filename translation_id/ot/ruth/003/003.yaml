  yaml_path: translation/ot/ruth/003/003.yaml
  text: Wash yourself[a], anoint yourself, and put your cloak on; then go down to the threshing floor[c][b]. Do not make yourself known to the man until he has finished eating and drinking.
translation:
  language: id
  text: Mandilah[a], olesilah tubuhmu dengan minyak, dan kenakanlah jubahmu[b]. Lalu turunlah ke tempat pengirikan[c]. Jangan memperlihatkan dirimu kepada laki-laki itu sebelum ia selesai makan dan minum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Basuhlah dirimu.” Kata kerja Ibrani ini dapat berarti membasuh atau memandikan tubuh.
    reason: lexical_alternative
  - marker: b
    text: Atau “kenakanlah pakaianmu.” Kata Ibrani ini secara umum menunjuk pada pakaian atau jubah; sebagian terjemahan menafsirkannya secara lebih khusus sebagai pakaian pesta atau pakaian terbaik.
    reason: lexical_alternative
  - marker: c
    text: 'Bentuk konsonantal teks Ibrani di sini tidak lazim. Berdasarkan konteks, bentuk itu biasanya dipahami sebagai kelanjutan petunjuk Naomi kepada Rut: “turunlah ke tempat pengirikan.”'
    reason: textual_variant
lexical_decisions:
- source_word: וְרָחַצְתְּ
  choice: Mandilah
  rationale: Kata רחץ dapat berarti membasuh atau memandikan tubuh. Dalam rangkaian persiapan pribadi ini, bentuk alami bahasa Indonesia adalah “Mandilah”; alternatif leksikal dicatat dalam catatan kaki.
- source_word: וָסַכְתְּ
  choice: urapilah dirimu
  rationale: Kata סוך menunjuk pada pengolesan minyak atau minyak wangi pada tubuh. “Urapilah dirimu” mempertahankan tindakan konkret dalam teks tanpa mempersempitnya menjadi sekadar memakai parfum.
- source_word: וְשַׂמְתְּ שמלתך עָלַיִךְ
  choice: kenakanlah jubahmu
  rationale: שִׂמְלָה adalah pakaian, sering berupa pakaian luar atau jubah. “Jubahmu” sesuai dengan kemungkinan tersebut dan tidak menambahkan gagasan “pakaian terbaik” yang tidak dinyatakan oleh teks.
- source_word: וירדתי הַגֹּרֶן
  choice: Lalu turunlah ke tempat pengirikan
  rationale: Walaupun bentuk konsonantal וירדתי tidak lazim dalam konteks ini, rangkaian perintah Naomi kepada Rut menuntut pembacaan sebagai perintah orang kedua feminin tunggal. “Tempat pengirikan” menyampaikan arti גֹּרֶן secara jelas.
- source_word: אַל תִּוָּדְעִי
  choice: Jangan memperlihatkan dirimu
  rationale: Bentuk Nifal dari ידע di sini menyatakan agar Rut tidak membuat kehadirannya diketahui. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan tanggung jawab Rut untuk tetap tidak terlihat.
- source_word: לָאִישׁ
  choice: kepada laki-laki itu
  rationale: Frasa ini secara harfiah menunjuk kepada “laki-laki itu,” yakni tokoh tertentu dalam konteks, tanpa mengganti sebutannya dengan nama Boas atau memperluasnya menjadi “siapa pun.”
- source_word: עַד כַּלֹּתוֹ לֶאֱכֹל וְלִשְׁתּוֹת
  choice: sebelum ia selesai makan dan minum
  rationale: Ungkapan כּלה dengan infinitif menyatakan selesainya kedua tindakan. Dalam larangan bahasa Indonesia, “sebelum ia selesai” menyampaikan batas waktu yang sama secara wajar.
