  yaml_path: translation/ot/ruth/003/016.yaml
  text: When she came to her mother-in-law[a], she said, “Who are you, my daughter?” Then she told her all that the man had done for her.
translation:
  language: id
  text: Ketika Rut datang kepada ibu mertuanya, Naomi berkata, “Siapakah engkau,[a] anakku?” Lalu Rut menceritakan kepadanya segala yang telah dilakukan laki-laki itu untuknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Siapakah engkau, anakku?” Dalam konteks ini pertanyaan itu juga dapat dipahami sebagai pertanyaan tentang hasil pertemuan Rut atau keadaannya setelah pertemuan itu.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתָּבוֹא אֶל חֲמוֹתָהּ
  choice: Ketika Rut tiba di tempat ibu mertuanya
  rationale: Bentuk wayyiqtol melanjutkan alur cerita. Nama Rut dan frasa 'di tempat' ditambahkan secara wajar dalam bahasa Indonesia untuk memperjelas subjek dan tujuan kedatangan tanpa mengubah makna.
- source_word: וַתֹּאמֶר
  choice: berkatalah Naomi
  rationale: Nama Naomi memperjelas pergantian pembicara yang hanya tersirat oleh bentuk feminin Ibrani.
- source_word: מִי אַתְּ
  choice: Siapakah engkau
  rationale: Mempertahankan arti harfiah pertanyaan Ibrani dan ambiguitasnya, meskipun dalam konteks pertanyaan itu mungkin menanyakan hasil pertemuan atau keadaan/status Rut.
- source_word: בִּתִּי
  choice: anakku
  rationale: Sapaan kekeluargaan yang hangat dan alami dalam bahasa Indonesia; secara harfiah berarti 'putriku' atau 'anak perempuanku'.
- source_word: וַתַּגֶּד לָהּ
  choice: Lalu Rut menceritakan kepadanya
  rationale: Hifil נגד berarti memberitahukan atau menceritakan. 'Lalu' menandai urutan naratif, sedangkan nama Rut memperjelas subjek.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה לָהּ הָאִישׁ
  choice: segala yang telah dilakukan laki-laki itu baginya
  rationale: '''Segala yang'' mencakup seluruh isi laporan. לָהּ dipahami secara benefaktif sebagai ''baginya'', dan ''laki-laki itu'' mempertahankan cara teks menyebut Boas tanpa memakai namanya.'
theological_decisions:
- issue: Makna pertanyaan מִי אַתְּ setelah pertemuan Rut dengan Boas
  choice: Mempertahankan bentuk harfiah 'Siapakah engkau?' dalam teks utama
  alternative: Menerjemahkan secara interpretatif, 'Bagaimana hasilnya, anakku?' atau 'Bagaimana keadaanmu sekarang?'
  rationale: Pertanyaan itu dapat menyiratkan perubahan status Rut atau menanyakan hasil pertemuannya, tetapi teks Ibrani tetap memakai pertanyaan identitas. Terjemahan utama tidak sepatutnya menutup ambiguitas tersebut.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Nama Rut dan Naomi digunakan untuk menghindari ketidakjelasan pronomina feminin dalam bahasa Indonesia. Pertanyaan yang tidak lazim dipertahankan agar ambiguitas sumber tetap tampak, dengan penjelasan dalam catatan kaki.
