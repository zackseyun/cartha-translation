translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang hangat dan bermartabat. Sapaan ‘anakku’ dipilih sebagai bentuk kasih yang alami. Susunan kalimat mempertahankan desakan waktu pada bagian akhir melalui ‘hari ini juga’.
