  text: Then she said[a], “Wait, my daughter, until you learn how the matter will fall out[b], for the man will not rest unless he has settled the matter today.”
translation:
  language: id
  text: Lalu ia berkata, “Tunggulah, anakku, sampai kamu mengetahui bagaimana perkara ini akan berakhir[a], sebab orang itu[b] tidak akan beristirahat sebelum ia menyelesaikan perkara ini hari ini juga.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, ungkapan Ibrani berbunyi “bagaimana perkara itu akan jatuh”, yakni bagaimana hasilnya nanti.
    reason: lexical_alternative
  - marker: b
    text: “Orang itu” menunjuk kepada Boas, meskipun teks Ibrani tidak menyebut namanya di sini.
    reason: cross_reference
lexical_decisions:
- source_word: שְׁבִי
  choice: Tunggulah
  rationale: Secara harfiah verba ini dapat berarti ‘duduk’ atau ‘tinggal’, tetapi dalam konteks ini Naomi meminta Rut tetap menanti hasilnya. ‘Tunggulah’ menyampaikan daya pragmatisnya secara alami.
- source_word: בִתִּי
  choice: anakku
  rationale: Sapaan penuh kasih ini secara harfiah berarti ‘putriku’. ‘Anakku’ merupakan sapaan kekeluargaan yang wajar dalam bahasa Indonesia dan mempertahankan unsur kepunyaan orang pertama.
- source_word: תֵּדְעִין
  choice: kamu mengetahui
  rationale: Bentuk ini menunjuk pada pengetahuan yang akan diperoleh Rut ketika hasil perkara menjadi jelas.
- source_word: אֵיךְ יִפֹּל דָּבָר
  choice: bagaimana perkara ini akan berakhir
  rationale: Ungkapan Ibrani secara harfiah berbicara tentang bagaimana suatu perkara ‘jatuh’. ‘Akan berakhir’ menyampaikan makna idiomatis hasil akhirnya dalam bahasa Indonesia, sedangkan metafora aslinya dicatat dalam catatan kaki.
- source_word: הָאִישׁ
  choice: orang itu
  rationale: Frasa Ibrani memakai nomina definit ‘orang/laki-laki itu’, yang dalam konteks menunjuk kepada Boas tanpa menyebut namanya.
- source_word: יִשְׁקֹט
  choice: tidak akan beristirahat
  rationale: Kata ini berarti diam, tenang, atau berhenti bertindak. Dalam konteks tekad Boas, ‘tidak akan beristirahat’ alami dan mempertahankan gambaran sumber.
- source_word: כִּי אִם
  choice: sebelum
  rationale: Dalam konstruksi negatif ini, frasa tersebut menyatakan bahwa ia tidak akan beristirahat sampai satu syarat terpenuhi. ‘Sebelum’ menghasilkan ungkapan Indonesia yang alami tanpa mengubah hubungan logisnya.
- source_word: כִּלָּה
  choice: menyelesaikan
  rationale: Verba ini berarti menuntaskan atau membawa sesuatu sampai selesai. ‘Menyelesaikan’ cukup luas untuk perkara hukum dan relasional yang sedang dihadapi.
- source_word: הַדָּבָר
  choice: perkara ini
  rationale: דבר luas artinya, tetapi di sini menunjuk pada urusan penebusan dan perkawinan yang sedang dibicarakan. ‘Perkara’ sesuai dengan nada narasi dan konteksnya.
- source_word: הַיּוֹם
  choice: hari ini juga
  rationale: ‘Hari ini’ menerjemahkan unsur waktunya; ‘juga’ secara idiomatis menegaskan bahwa penyelesaian itu akan terjadi pada hari yang sama, sesuai posisi penekanan dalam kalimat.
