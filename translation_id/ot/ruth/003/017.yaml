  register: Bahasa Indonesia modern, alami, dan bermartabat. Bentuk “diberikannya” mempertahankan alur ujaran Rut, sedangkan “pulang” dan “dengan tangan kosong” menyampaikan idiom konteks secara wajar. Penanda catatan kaki ditempatkan setelah ayat dan menerangkan bahwa satuan tidak terdapat dalam teks sumber.
