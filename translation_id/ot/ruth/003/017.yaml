  text: She said[a], “He gave me these six measures of barley, for he said, ‘Do not go to your mother-in-law empty-handed.’”
translation:
  language: id
  text: Ia berkata, “Ia memberiku enam takaran[a] jelai ini, sebab ia berkata, ‘Jangan kembali kepada ibu mertuamu dengan tangan kosong.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Ibrani berbunyi “enam jelai ini.” Satuan tertentu tidak disebutkan; karena itu, kata “takaran” ditambahkan supaya maksudnya jelas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Katanya
  rationale: Bentuk wayyiqtol dari אמר melanjutkan narasi dan memperkenalkan laporan Rut. Dalam bahasa Indonesia, “Katanya” alami dan tetap menyampaikan subjek feminin dari konteks.
- source_word: שֵׁשׁ הַשְּׂעֹרִים הָאֵלֶּה
  choice: Enam takaran jelai ini
  rationale: Teks Ibrani secara harfiah menyebut “enam jelai ini” tanpa menyatakan satuannya. “Takaran” ditambahkan agar ungkapan alami dalam bahasa Indonesia, sementara ketidakpastian satuan dijelaskan dalam catatan kaki.
- source_word: נָתַן לִי
  choice: diberikannya kepadaku
  rationale: Qal perfektum orang ketiga maskulin tunggal dengan objek orang pertama tunggal. Susunan ini alami dalam kutipan bahasa Indonesia dan mempertahankan fokus pada pemberian.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan Boas memberikan jelai tersebut.
- source_word: אָמַר
  choice: ia berkata
  rationale: Menyampaikan ujaran Boas di dalam laporan langsung Rut tanpa menambahkan aspek waktu yang tidak dinyatakan.
- source_word: אַל תָּבֹאִי
  choice: Jangan pulang
  rationale: Negasi dengan bentuk orang kedua feminin tunggal. Dalam konteks kembali kepada Naomi, “pulang” lebih alami daripada “datang” dan menyatakan arah gerak yang dimaksud.
- source_word: רֵיקָם
  choice: dengan tangan kosong
  rationale: Ungkapan idiomatis Indonesia yang tepat untuk keadaan kembali tanpa membawa pemberian atau bekal.
- source_word: אֶל חֲמוֹתֵךְ
  choice: kepada mertuamu
  rationale: חֲמוֹת berarti ibu mertua. Dalam konteks Rut, “mertua” sudah jelas merujuk kepada Naomi dan lebih alami dalam bahasa Indonesia.
