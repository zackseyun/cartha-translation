  text: וְ/עַתָּה֙ כִּ֣י אָמְנָ֔ם כִּ֥י אם גֹאֵ֖ל אָנֹ֑כִי וְ/גַ֛ם יֵ֥שׁ גֹּאֵ֖ל קָר֥וֹב מִמֶּֽ/נִּי׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/012.yaml
  text: And now[a], it is true that I am a redeemer[b], yet there is also a redeemer closer than I.
translation:
  language: id
  text: Sekarang, memang benar bahwa akulah seorang penebus[a]. Namun, ada juga seorang penebus yang lebih dekat daripada aku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kerabat penebus” atau “pelindung-penebus”. Istilah Ibrani ini menunjuk kepada kerabat dekat yang memiliki hak dan tanggung jawab tertentu untuk menolong serta memulihkan kepentingan keluarganya.
    reason: lexical_alternative
  - marker: b
    text: “Lebih dekat” berarti lebih dekat hubungan kekerabatannya, sehingga ia lebih dahulu memiliki hak penebusan; bukan sekadar berada lebih dekat secara fisik.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Menandai peralihan ke pokok berikutnya dalam perkataan Boas. Dalam bahasa Indonesia, “Sekarang” sudah berfungsi alami sebagai penghubung wacana tanpa perlu menerjemahkan ו secara mekanis.
- source_word: כִּי אָמְנָם כִּי אם
  choice: memang benar bahwa
  rationale: Gabungan ini menegaskan atau mengakui kebenaran pernyataan berikutnya. “Memang benar bahwa” menyampaikan daya afirmatifnya secara wajar tanpa membuat hubungan antarklausa terlalu tegas.
- source_word: גֹאֵל
  choice: penebus
  rationale: Istilah ini menunjuk kepada kerabat dekat yang mempunyai hak dan tanggung jawab penebusan dalam tatanan keluarga Israel. “Penebus” mempertahankan inti leksikalnya; unsur kekerabatan dijelaskan dalam catatan kaki.
- source_word: אָנֹכִי
  choice: akulah
  rationale: Pronomina mandiri memberi penegasan. Bentuk “akulah” menyampaikan penekanan itu secara ringkas dan alami dalam bahasa Indonesia.
- source_word: וְגַם יֵשׁ
  choice: Namun, ada juga
  rationale: Frasa ini menambahkan fakta yang membatasi klaim Boas. “Namun” menyatakan daya pembatas dalam konteks, sedangkan “juga” mempertahankan unsur aditif גַם.
- source_word: קָרוֹב מִמֶּנִּי
  choice: lebih dekat daripada aku
  rationale: Terjemahan ini mempertahankan ungkapan perbandingan Ibrani dan ambiguitas leksikal kata “dekat”; konteks kekerabatan dan hak penebusan diterangkan dalam catatan kaki.
theological_decisions:
- issue: Pemaknaan גֹאֵל dalam konteks hukum dan kekerabatan
  choice: penebus
  alternative: kerabat penebus; pelindung-penebus
  rationale: Ayat ini berbicara tentang hak dan tanggung jawab seorang kerabat dalam keluarga Israel, bukan semata-mata penebusan rohani yang abstrak. “Penebus” mempertahankan inti istilah sumber tanpa memasukkan tafsiran yang terlalu panjang ke dalam teks utama.
- issue: Arti komparatif קָרוֹב dalam konteks ini
  choice: lebih dekat daripada aku
  alternative: lebih dekat hubungan kekerabatannya daripada aku
  rationale: Teks utama mempertahankan ungkapan ringkas sumber, sedangkan catatan menjelaskan bahwa kedekatan yang dimaksud berkaitan dengan kekerabatan dan urutan hak penebusan, bukan lokasi fisik.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. “Akulah” mempertahankan penegasan pada pronomina Ibrani, sedangkan pemisahan menjadi dua kalimat membuat pengakuan dan pembatasannya jelas tanpa menghilangkan ketegangan hukum dalam perkataan Boas.
