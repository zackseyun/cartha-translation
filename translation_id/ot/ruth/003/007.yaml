  text: וַ/יֹּ֨אכַל בֹּ֤עַז וַ/יֵּשְׁתְּ֙ וַ/יִּיטַ֣ב לִבּ֔/וֹ וַ/יָּבֹ֕א לִ/שְׁכַּ֖ב בִּ/קְצֵ֣ה הָ/עֲרֵמָ֑ה וַ/תָּבֹ֣א בַ/לָּ֔ט וַ/תְּגַ֥ל מַרְגְּלֹתָ֖י/ו וַ/תִּשְׁכָּֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/007.yaml
  text: And Boaz ate and drank[a], and his heart was merry, and he went to lie down at the end of the grain heap. Then she came quietly, uncovered his feet[b], and lay down.
translation:
  language: id
  text: Boas makan dan minum, lalu hatinya menjadi gembira[a]. Kemudian ia pergi berbaring di ujung timbunan gandum. Rut datang diam-diam, menyingkap kakinya[b], lalu berbaring.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “hatinya menjadi baik.” Idiom Ibrani ini berarti ia merasa gembira atau senang; ungkapan itu sendiri tidak berarti bahwa ia mabuk.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menyingkap kakinya.” Ini dapat dipahami sebagai tindakan harfiah menyingkap kaki atau tungkai bawahnya. Sebagian penafsir melihat kemungkinan nuansa sugestif, tetapi ungkapan Ibraninya tetap terkendali dan tidak secara eksplisit menyebut aktivitas seksual.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאכַל ... וַיֵּשְׁתְּ
  choice: makan dan minum
  rationale: Menerjemahkan kedua verba naratif secara langsung dan wajar tanpa menambahkan dugaan bahwa Boas mabuk.
- source_word: וַיִּיטַב לִבּוֹ
  choice: hatinya menjadi gembira
  rationale: Mempertahankan gambaran idiom Ibrani tentang hati yang menjadi baik atau senang, sekaligus menghasilkan ungkapan Indonesia yang alami.
- source_word: וַיָּבֹא לִשְׁכַּב
  choice: ia pergi berbaring
  rationale: Dalam alur narasi bahasa Indonesia, verba gerak בוא wajar diterjemahkan 'pergi'; 'berbaring' tidak menambahkan makna tidur yang tidak dinyatakan secara eksplisit.
- source_word: בִּקְצֵה הָעֲרֵמָה
  choice: di ujung timbunan gandum
  rationale: קצה menunjuk ujung atau tepi, sedangkan konteks tempat pengirikan memperjelas bahwa עֲרֵמָה adalah timbunan gandum.
- source_word: בַלָּט
  choice: dengan diam-diam
  rationale: Menyampaikan cara mendekat yang tenang dan tersembunyi tanpa memberikan penilaian moral tambahan.
- source_word: וַתְּגַל מַרְגְּלֹתָיו
  choice: menyingkap bagian kakinya
  rationale: Frasa ini dipertahankan dekat dengan arti harfiahnya, tetapi 'bagian kaki' lebih alami dan tidak sejanggal 'kaki-kakinya' dalam bahasa Indonesia; ambiguitas cakupan anggota tubuh dijelaskan dalam catatan.
- source_word: וַתִּשְׁכָּב
  choice: lalu berbaring
  rationale: Menerjemahkan verba 'berbaring' secara langsung tanpa mengubahnya menjadi gambaran aktivitas seksual.
theological_decisions:
- issue: Apakah tindakan Rut harus diterjemahkan sebagai aktivitas atau ajakan seksual
  choice: Mempertahankan uraian tindakan yang tersurat dan terkendali
  alternative: Menggunakan bahasa yang secara eksplisit menyiratkan rayuan atau hubungan seksual
  rationale: Teks Ibrani hanya menyebut bahwa Rut datang diam-diam, menyingkap bagian kaki Boas, dan berbaring. Terjemahan tidak boleh memastikan implikasi seksual yang tidak dinyatakan oleh ayat ini.
- issue: Apakah kegembiraan Boas berarti ia mabuk
  choice: Menerjemahkan idiom sebagai kegembiraan tanpa menyatakan kemabukan
  alternative: Menerjemahkan bahwa Boas mabuk atau terpengaruh minuman
  rationale: Idiom וַיִּיטַב לִבּוֹ menunjukkan suasana hati yang senang, tetapi tidak dengan sendirinya menetapkan kemabukan.
translation_notes:
  register: Bahasa Indonesia baku yang modern, alami, dan bermartabat. Nama Rut disebut pada pergantian subjek agar rujukannya jelas bagi pembaca Indonesia. Penanda catatan [a] dan [b] ditempatkan langsung pada ungkapan terkait.
