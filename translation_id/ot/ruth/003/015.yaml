revisions:
- from: Lalu Boas berkata, “Berikan kepadaku kain luar yang kaupakai itu dan tahanlah terbuka.” Rut pun menahannya terbuka. Boas menakar enam takaran jelai[a], lalu meletakkan muatan itu pada Rut. Kemudian Boas pergi ke kota.[b]
  to: Lalu Boas berkata, “Ulurkan kain luar yang kaupakai itu dan peganglah terbuka.” Rut pun memegangnya terbuka. Boas menakar enam takaran jelai[a], lalu meletakkan jelai itu pada Rut. Kemudian Boas pergi ke kota.[b]
  rationale: Revisi menghilangkan implikasi bahwa Rut menyerahkan kain itu kepada Boas sebelum ia sendiri memegangnya terbuka. Rujukan kolektif kepada jelai dibuat eksplisit secara wajar. Bacaan utama tetap mengikuti kata kerja maskulin Teks Masoret; catatan kaki mempertahankan bacaan feminin yang didukung versi-versi kuno tanpa mengaburkan bahwa maskulinitas, bukan nama Boas, adalah bentuk yang tercantum dalam klausa Ibrani.
