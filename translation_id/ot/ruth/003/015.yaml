base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/015.yaml
  text: Then he said[a], “Bring the cloak that is on you and hold it out.” So she held it out, and he measured six measures of barley and put it on her[b]. Then he went into the city.
translation:
  language: id
  text: Lalu Boas berkata, “Ulurkan kain luar yang kaupakai itu dan peganglah terbuka.” Rut pun memegangnya terbuka. Boas menakar enam takaran jelai[a], lalu meletakkan jelai itu pada Rut. Kemudian Boas pergi ke kota.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “enam jelai”; satuan takarannya tidak disebutkan dalam teks Ibrani.
    reason: lexical_alternative
  - marker: b
    text: Sejumlah versi kuno dan banyak terjemahan berbunyi, “Kemudian Rut pergi ke kota.” Teks Masoret berbunyi, “Kemudian ia pergi ke kota,” dengan kata kerja Ibrani berbentuk maskulin.
    reason: textual_variant
lexical_decisions:
- source_word: הָבִי
  choice: Berikan kepadaku
  rationale: Bentuk perintah feminin tunggal ini meminta Rut menyerahkan atau mengulurkan kain yang sedang dipakainya kepada Boas. Pilihan ini alami dalam bahasa Indonesia dan sesuai dengan perintah berikutnya.
- source_word: הַמִּטְפַּחַת
  choice: kain luar
  rationale: Kata ini menunjuk pada kain atau pakaian luar yang cukup besar untuk menampung jelai. 'Kain luar' menghindari kesan kain penutup wajah yang dapat timbul dari istilah lama, sekaligus tidak terlalu khusus seperti 'jubah' atau 'selendang'.
- source_word: וְאֶחֳזִי בָהּ
  choice: dan tahanlah terbuka
  rationale: Secara leksikal berarti memegang atau menggenggamnya. Dalam konteks ini, Rut harus menahan kain itu dalam keadaan terbuka agar jelai dapat ditaruh di atasnya; terjemahan ini mengungkapkan situasi tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: וַיָּמָד
  choice: menakar
  rationale: Kata kerja ini menyatakan tindakan mengukur sejumlah bahan. 'Menakar' merupakan padanan Indonesia yang alami untuk mengukur bahan curah seperti jelai.
- source_word: שֵׁשׁ שְׂעֹרִים
  choice: enam takaran jelai
  rationale: Teks Ibrani secara harfiah menyebut 'enam jelai' tanpa menyatakan satuannya. 'Takaran' melengkapi pengertian yang diperlukan dalam bahasa Indonesia tanpa menetapkan satuan tertentu yang tidak ada dalam teks.
- source_word: וַיָּשֶׁת עָלֶיהָ
  choice: lalu meletakkan muatan itu pada Rut
  rationale: Objek tunggalnya kemungkinan merujuk secara kolektif pada jelai yang telah ditakar. 'Muatan itu' menjelaskan bahwa jelai tersebut ditempatkan pada Rut untuk dibawa, sedangkan nama Rut menghindari ketidakjelasan pronomina Indonesia.
- source_word: וַיָּבֹא הָעִיר
  choice: Kemudian Boas pergi ke kota
  rationale: Bentuk kata kerja dalam Teks Masoret adalah maskulin tunggal, sehingga subjeknya dipahami sebagai Boas. Nama Boas dipakai karena pronomina Indonesia 'ia' tidak menandai gender dan tidak dapat mempertahankan perbedaan tekstual ini.
theological_decisions:
- issue: Subjek klausa terakhir וַיָּבֹא הָעִיר
  choice: Kemudian Boas pergi ke kota
  alternative: Kemudian Rut pergi ke kota
  rationale: Ini merupakan persoalan tekstual dan naratif, bukan penetapan doktrin. Teks Masoret yang diberikan memakai kata kerja maskulin, sehingga teks utama menyebut Boas. Bacaan feminin yang didukung sejumlah versi kuno dan banyak terjemahan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Nama tokoh digunakan pada bagian yang diperlukan untuk menjaga kejelasan, terutama karena pronomina bahasa Indonesia tidak membedakan gender. Istilah 'jelai' dipertahankan sebagai nama biji-bijian yang tepat.
