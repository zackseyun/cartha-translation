  naturalness: Bahasa draft umumnya baku dan jelas. “Ulurkan ... dan peganglah terbuka” lebih padu dan alami dalam konteks kain yang dipakai Rut serta fungsi kain itu untuk menampung jelai. “Jelai itu” lebih langsung daripada “muatan itu.”
  terminology: “Kain luar,” “menakar,” dan “jelai” merupakan pilihan yang baik. “Enam takaran jelai” patut disertai catatan bahwa satuannya tidak disebutkan. Catatan varian perlu menjelaskan gender kata kerja Ibrani tanpa menyatakan bahwa nama Boas sendiri terdapat dalam teks klausa tersebut.
