  text: וִ/יהִ֣י בְ/שָׁכְב֗/וֹ וְ/יָדַ֨עַתְּ֙ אֶת הַ/מָּקוֹם֙ אֲשֶׁ֣ר יִשְׁכַּב שָׁ֔ם וּ/בָ֛את וְ/גִלִּ֥ית מַרְגְּלֹתָ֖י/ו ו/שכבתי וְ/הוּא֙ יַגִּ֣יד לָ֔/ךְ אֵ֖ת אֲשֶׁ֥ר תַּעַשִֽׂי/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/004.yaml
  text: Then[a], when he lies down, note the place where he lies. Then go, uncover his feet, and lie down[b], and he will tell you what you should do.
translation:
  language: id
  text: Apabila ia sudah berbaring, perhatikan tempat ia berbaring. Lalu pergilah, singkapkan kakinya[a], dan berbaringlah[b]. Ia akan memberitahukan kepadamu apa yang harus kaulakukan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “bagian sekitar kakinya” atau “bagian bawah tubuhnya”; ungkapan Ibrani ini dapat menunjuk lebih khusus pada kawasan di sekitar kaki, bukan hanya kaki itu sendiri.
    reason: lexical_alternative
  - marker: b
    text: Bentuk Ibrani yang tertulis berbunyi “dan aku berbaring”, tetapi konteks dan bacaan tradisional memahaminya sebagai “dan engkau berbaring”.
    reason: textual_variant
lexical_decisions:
- source_word: וִיהִי בְשָׁכְבוֹ
  choice: Apabila ia sudah berbaring
  rationale: Gabungan ini membuka tahap berikutnya dengan makna temporal. Bentuk 'sudah berbaring' secara alami menunjukkan bahwa tindakan Rut dilakukan setelah Boas membaringkan diri.
- source_word: וְיָדַעַתְּ אֶת־הַמָּקוֹם
  choice: perhatikan tempat
  rationale: ידע secara harfiah berarti 'mengetahui', tetapi di sini berarti mengamati dan memastikan lokasi tempat Boas berbaring.
- source_word: אֲשֶׁר יִשְׁכַּב שָׁם
  choice: ia berbaring
  rationale: Klausa relatif ini menunjukkan tempat tidurnya; unsur שָׁם tidak perlu diterjemahkan tersendiri karena makna 'di sana' sudah terkandung dalam 'tempat'.
- source_word: וּבָאת
  choice: Lalu pergilah
  rationale: בוא dapat berarti datang atau pergi menurut sudut pandang. Dalam instruksi Naomi kepada Rut, 'pergilah' merupakan ungkapan Indonesia yang paling alami, sedangkan 'lalu' mempertahankan urutan tindakan.
- source_word: וְגִלִּית
  choice: singkapkan
  rationale: Kata kerja ini berarti membuka atau menyingkap sesuatu yang tertutup. 'Singkapkan' ringkas dan tidak menambahkan penafsiran tentang maksud tindakan itu.
- source_word: מַרְגְּלֹתָיו
  choice: kakinya
  rationale: Kata ini dapat menunjuk pada kaki atau kawasan di sekitar bagian kaki. 'Kakinya' merupakan padanan utama yang wajar, sementara keluasan kemungkinan maknanya dipertahankan dalam catatan kaki.
- source_word: וְשָׁכָבְתִּי / וְשָׁכַבְתְּ
  choice: dan berbaringlah
  rationale: Tulisan konsonantal menunjuk pada orang pertama ('aku berbaring'), tetapi bacaan tradisional dan konteks rangkaian perintah kepada Rut menunjuk pada orang kedua feminin ('engkau berbaring'). Teks utama mengikuti makna kontekstual dan catatan kaki mencatat perbedaannya.
- source_word: וְהוּא יַגִּיד לָךְ
  choice: Ia akan memberitahukan kepadamu
  rationale: Bentuk Hifil dari נגד lazim berarti 'memberitahukan' atau 'menyatakan'. Kata ganti eksplisit dipertahankan untuk menandai bahwa Boaslah yang akan memberi petunjuk.
- source_word: אֵת אֲשֶׁר תַּעַשִׂין
  choice: apa yang harus kaulakukan
  rationale: Dalam konteks ini klausa tersebut menyatakan tindakan yang akan diarahkan kepada Rut; 'harus kaulakukan' menyampaikan daya instruktifnya secara alami.
theological_decisions:
- issue: Kemungkinan nuansa seksual dalam perintah untuk menyingkap kaki Boas dan berbaring
  choice: Mempertahankan kata-kata konkret tanpa menyatakan bahwa tindakan itu bersifat seksual ataupun sepenuhnya tidak bersifat seksual.
  alternative: Menafsirkan ungkapan itu secara eksplisit sebagai pendekatan seksual, atau sebaliknya sebagai tindakan praktis semata-mata untuk membangunkan Boas.
  rationale: Bahasa Ibrani menyisakan ketegangan naratif. Terjemahan tidak semestinya menghapus ambiguitas itu dengan memasukkan kesimpulan yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk perintah 'perhatikan', 'pergilah', 'singkapkan', dan 'berbaringlah' menjaga alur instruksi yang jelas. Ungkapan 'apa yang harus kaulakukan' bersifat alami bagi pembaca umum tanpa menambahkan rincian mengenai tindakan selanjutnya.
