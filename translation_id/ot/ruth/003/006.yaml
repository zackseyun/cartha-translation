  yaml_path: translation/ot/ruth/003/006.yaml
  text: So she went down to the threshing floor and did according to all that her mother-in-law had commanded her[a].
translation:
  language: id
  text: Lalu ia turun ke tempat pengirikan dan melakukan semua yang diperintahkan ibu mertuanya kepadanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kemudian ia turun ke tempat pengirikan dan melakukan tepat seperti yang telah dipesankan ibu mertuanya kepadanya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶד
  choice: Lalu ia turun
  rationale: Bentuk dari ירד menyatakan gerak turun. 'Turun' mempertahankan arah gerak, sedangkan 'lalu' secara alami melanjutkan urutan narasi dari ayat sebelumnya.
- source_word: הַגֹּרֶן
  choice: ke tempat pengirikan
  rationale: גֹּרֶן menunjuk tempat hasil panen diirik. 'Tempat pengirikan' merupakan padanan Indonesia yang jelas dan sesuai dengan latar pertanian.
- source_word: וַתַּעַשׂ
  choice: dan melakukan
  rationale: עשה adalah verba umum untuk berbuat atau melakukan. Dalam konstruksi ini, 'melakukan' secara alami menyatakan pelaksanaan seluruh perintah yang telah diberikan.
- source_word: כְּכֹל אֲשֶׁר
  choice: semua yang
  rationale: Ungkapan ini menyatakan kesesuaian penuh dengan petunjuk sebelumnya. Dalam bahasa Indonesia, 'melakukan semua yang ...' menyampaikan cakupan כֹל dan makna kesesuaian tanpa menjadi kaku.
- source_word: צִוַּתָּה
  choice: diperintahkan ... kepadanya
  rationale: צוה pada dasarnya berarti 'memerintahkan'. Bentuk pasif ini menghasilkan susunan Indonesia yang alami sambil mempertahankan daya perintah verba Ibrani.
- source_word: חֲמוֹתָהּ
  choice: ibu mertuanya
  rationale: Istilah kekerabatan ini secara khusus berarti ibu mertua, dengan sufiks kepunyaan orang ketiga feminin yang dinyatakan melalui '-nya'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Teks utama mempertahankan kekuatan צוה sebagai 'memerintahkan'; catatan kaki mencatat padanan yang lebih lunak, 'dipesankan', serta menonjolkan nuansa kesesuaian penuh melalui 'tepat seperti'.
