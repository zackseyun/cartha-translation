base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/009.yaml
  text: He said[a], “Who are you?” And she said, “I am Ruth, your servant. Spread your wing over your servant[b], for you are a redeemer.”
translation:
  language: id
  text: Ia berkata, “Siapa kamu?” Ia menjawab, “Aku Rut, hambamu. Bentangkanlah sayapmu[a] di atas hambamu ini, sebab engkau adalah seorang penebus[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Bentangkanlah ujung pakaianmu di atas hambamu ini.” Kata Ibrani yang dipakai dapat berarti “sayap” atau ujung pakaian; ungkapan ini mungkin sengaja menyiratkan perlindungan sekaligus isyarat yang berkaitan dengan perkawinan.
    reason: lexical_alternative
  - marker: b
    text: Atau “penebus kerabat”, yaitu anggota keluarga yang memiliki tanggung jawab yang diakui untuk bertindak demi kepentingan kerabatnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי אָתּ
  choice: Siapa kamu?
  rationale: Pertanyaan identitas ini diterjemahkan secara langsung dan wajar dalam bahasa Indonesia modern.
- source_word: אָנֹכִי רוּת
  choice: Aku Rut
  rationale: Klausa nominal Ibrani secara alami memerlukan kopula tersirat dalam bahasa Indonesia; bentuk “Aku Rut” ringkas dan wajar dalam dialog.
- source_word: אֲמָתֶךָ / אֲמָתְךָ
  choice: hambamu
  rationale: אמה menunjuk kepada hamba perempuan. “Hambamu” mempertahankan perendahan diri Rut, terdengar alami dan bermartabat, serta dapat dipakai konsisten pada kedua kemunculan.
- source_word: וּפָרַשְׂתָּ
  choice: Bentangkanlah
  rationale: פרשׂ berarti membentangkan atau mengulurkan sesuatu di atas pihak lain. “Bentangkanlah” cocok dengan citra sayap maupun ujung pakaian.
- source_word: כְנָפֶךָ
  choice: sayapmu
  rationale: כנף secara harfiah berarti “sayap” dan juga dapat menunjuk ujung pakaian. Teks utama mempertahankan citra harfiah dan gema perlindungannya, sedangkan kemungkinan makna pakaian dijelaskan dalam catatan kaki.
- source_word: עַל
  choice: atas
  rationale: “Atas” merupakan padanan alami bagi עַל dalam gambaran menaungi atau menutupi seseorang.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan bagi permintaan Rut; “sebab” jelas dan sesuai dengan register naratif yang bermartabat.
- source_word: גֹאֵל
  choice: seorang penebus
  rationale: גֹאֵל adalah orang yang menjalankan peranan penebusan dalam lingkup keluarga. “Penebus” mempertahankan istilah kunci tanpa memasukkan seluruh penjelasan hukum-kekerabatan ke dalam dialog.
theological_decisions:
- issue: Daya metaforis “sayapmu” dalam permintaan Rut
  choice: Mempertahankan “sayapmu” dalam teks utama dan menjelaskan kemungkinan arti ujung pakaian dalam catatan kaki.
  alternative: “ujung pakaianmu”
  rationale: 'Bahasa Ibrani mungkin sengaja menghadirkan dua gema sekaligus: tindakan konkret dengan pakaian serta perlindungan dan tuntutan perkawinan. Mempertahankan “sayap” menghindari penyempitan makna.'
- issue: Makna hukum-kekerabatan גֹאֵל
  choice: Menggunakan “penebus” dalam teks utama dengan penjelasan peranan keluarga dalam catatan kaki.
  alternative: “penebus kerabat” atau “kerabat penebus”
  rationale: “Penebus” mempertahankan istilah teologis dan leksikal utama, sedangkan catatan kaki menyampaikan unsur kekerabatan yang sangat penting dalam kitab Rut tanpa membebani dialog.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Dialog memakai “aku/kamu” sesuai kedekatan adegan, sementara bentuk “hambamu” mempertahankan sikap rendah hati Rut. Citra “sayap” dan istilah “penebus” dipertahankan agar ambiguitas sastra serta bobot teologis teks sumber tidak diselesaikan secara berlebihan.
