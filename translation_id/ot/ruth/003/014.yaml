  terminology: '"Tempat pengirikan" merupakan padanan yang baik untuk הגרן. "Perempuan itu" dengan tepat mempertahankan ketentuan האשה. "Jangan sampai diketahui" mempertahankan larangan pasif dari אל יוודע.'
