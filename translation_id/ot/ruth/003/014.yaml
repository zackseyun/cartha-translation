  source_fidelity: 'Terjemahan pada dasarnya mengikuti teks Ibrani: Rut berbaring di ujung/kawasan kaki Boas hingga pagi, bangun sebelum orang dapat saling mengenali, lalu seorang laki-laki yang tidak disebutkan namanya melarang agar kedatangan perempuan itu ke tempat pengirikan tidak diketahui. Namun, "di dekat kaki" lebih longgar daripada keterangan lokasi מרגלתיו; "di kaki Boas" lebih tepat dan tetap tidak menafsirkan adegan itu secara seksual.'
