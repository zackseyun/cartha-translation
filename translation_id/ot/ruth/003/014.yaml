base_translation:
  language: en
  yaml_path: translation/ot/ruth/003/014.yaml
  text: So she lay at his feet until morning[a], and she got up before one man could recognize another. And he said[b], “Do not let it be known that the woman came to the threshing floor.”
translation:
  language: id
  text: Maka ia berbaring di kaki Boas sampai pagi. Ia bangun sebelum orang dapat saling mengenali. Lalu katanya[a], “Jangan sampai diketahui bahwa perempuan itu datang ke tempat pengirikan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pembicara kemungkinan besar adalah Boas berdasarkan konteks, tetapi teks Ibrani hanya mengatakan, “Lalu katanya.”
    reason: alternative_reading
lexical_decisions:
- source_word: מרגלתיו
  choice: di dekat kaki Boas
  rationale: Nomina ini menunjuk pada tempat di bagian kaki. Nama Boas dipakai agar rujukan pronominal alami dan jelas dalam bahasa Indonesia, tanpa menambahkan tindakan atau makna seksual.
- source_word: בטרום
  choice: sebelum
  rationale: Bentuk ini menandai waktu yang mendahului suatu keadaan; 'sebelum' menyampaikan hubungan temporal itu secara wajar.
- source_word: יכיר
  choice: dapat mengenali
  rationale: Bentuk Hifil di sini menyatakan kemampuan mengenali atau membedakan orang dalam cahaya yang masih redup.
- source_word: איש את רעהו
  choice: orang dapat mengenali satu sama lain
  rationale: Ungkapan harfiah 'seorang laki-laki sesamanya' berfungsi sebagai idiom timbal balik tentang orang-orang yang belum dapat saling membedakan; terjemahan ini alami dalam bahasa Indonesia.
- source_word: אל יוודע
  choice: Jangan sampai diketahui
  rationale: Yusif negatif pasif menyatakan larangan atau kehendak agar hal tersebut tidak tersiar, sambil mempertahankan bentuk pasif.
- source_word: האשה
  choice: perempuan itu
  rationale: Artikel tentu Ibrani menunjuk kepada perempuan tertentu dalam adegan tersebut, yakni Rut.
- source_word: הגרן
  choice: tempat pengirikan
  rationale: Istilah Indonesia yang lazim dan jelas untuk lokasi pertanian tempat bulir-bulir diirik.
- source_word: ויאמר
  choice: Lalu berkatalah dia
  rationale: Subjek maskulin tunggal tersirat dalam bahasa Ibrani. Terjemahan tidak menyebut Boas secara eksplisit karena teks sumber hanya menyatakan 'dia berkata'.
theological_decisions:
- issue: Identitas pembicara dalam ויאמר
  choice: Memakai 'dia' dalam teks utama tanpa menyebut nama Boas.
  alternative: Menerjemahkan secara eksplisit, 'Lalu Boas berkata.'
  rationale: Konteks sangat kuat menunjuk kepada Boas, tetapi teks Ibrani membiarkan subjeknya tersirat. Catatan kaki menjelaskan hal ini tanpa menambahkan nama ke dalam teks utama.
- issue: Implikasi moral atau seksual dari Rut berbaring di dekat kaki Boas
  choice: Memakai keterangan tempat yang lugas tanpa penjelasan yang menuduh ataupun menyangkal adanya hubungan seksual.
  alternative: Memakai ungkapan interpretatif yang menyiratkan hubungan seksual, atau menambahkan penjelasan yang secara tegas menyangkalnya.
  rationale: Ayat ini menyatakan tempat dan waktu, bukan tindakan seksual secara eksplisit ataupun penyangkalan eksplisit. Ketegangan naratif dibiarkan tetap terbuka sesuai teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif yang bermartabat. 'Tempat pengirikan' dipilih sebagai istilah pertanian yang mudah dipahami. Susunan kalimat dibuat alami tanpa menghilangkan kepastian artikel pada 'perempuan itu' atau ketidaktersuratan nama pembicara.
