  yaml_path: translation/ot/exodus/033/006.yaml
  text: So the sons of Israel stripped themselves of their ornaments from Mount Horeb onward[a].
translation:
  language: id
  text: Maka orang Israel menanggalkan perhiasan mereka mulai dari Gunung Horeb.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Maka orang Israel menanggalkan perhiasan mereka di Gunung Horeb.” Frasa Ibrani ini dapat dipahami sebagai penunjuk tempat atau sebagai penanda titik awal, yaitu bahwa sejak saat itu mereka tidak lagi mengenakan perhiasan.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְנַצְּלוּ
  choice: menanggalkan
  rationale: Bentuk hitpael dari נצל di sini menyatakan tindakan melepaskan sesuatu yang dikenakan pada diri sendiri. Dalam bahasa Indonesia, “menanggalkan” secara alami menyampaikan tindakan itu tanpa perlu menambahkan kata refleksif.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan ini merujuk kepada umat Israel secara kolektif. “Orang Israel” alami dalam bahasa Indonesia modern dan tidak membatasi rujukannya hanya kepada laki-laki.
- source_word: עֶדְיָם
  choice: perhiasan mereka
  rationale: עֲדִי berarti benda perhiasan atau perhiasan yang dikenakan. “Perhiasan” cukup luas dan sesuai dengan konteks perkabungan.
- source_word: מֵהַר חוֹרֵב
  choice: sejak di Gunung Horeb
  rationale: Frasa dengan מִן dapat menandai Gunung Horeb sebagai titik awal sejak mereka tidak lagi mengenakan perhiasan. Susunan “sejak di” mempertahankan kaitan dengan tempat sekaligus nuansa keberlanjutan.
theological_decisions:
- issue: Fungsi frasa מֵהַר חוֹרֵב
  choice: Gunung Horeb sebagai titik awal keadaan yang berlanjut
  alternative: Gunung Horeb sebagai lokasi tindakan menanggalkan perhiasan
  rationale: Bahasa Ibrani memungkinkan kedua pemahaman tersebut. Teks utama mengikuti pembacaan titik awal karena cocok dengan konteks perintah untuk tidak mengenakan perhiasan, sementara kemungkinan lokatif dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. “Maka” mempertahankan kesinambungan naratif; “menanggalkan perhiasan” terdengar alami sekaligus bermartabat.
