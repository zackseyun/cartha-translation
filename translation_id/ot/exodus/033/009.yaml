  text: וְ/הָיָ֗ה כְּ/בֹ֤א מֹשֶׁה֙ הָ/אֹ֔הֱלָ/ה יֵרֵד֙ עַמּ֣וּד הֶֽ/עָנָ֔ן וְ/עָמַ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וְ/דִבֶּ֖ר עִם מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/009.yaml
  text: And whenever Moses entered the tent[a], the pillar of cloud would descend and stand at the entrance of the tent, and he would speak with Moses.
translation:
  language: id
  text: Setiap kali Musa masuk ke dalam kemah, tiang awan turun dan berdiri di pintu masuk kemah itu, lalu ia berbicara dengan Musa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih eksplisit, “lalu TUHAN berbicara dengan Musa.” Dalam bahasa Ibrani, subjek klausa ini tidak disebutkan, tetapi konteks menunjukkan bahwa subjeknya adalah TUHAN.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כְּבֹא
  choice: Setiap kali ... masuk
  rationale: Rangkaian וְהָיָה dengan klausa waktu כְּבֹא menyatakan keadaan yang berulang dalam narasi lampau. 'Setiap kali' menyampaikan aspek kebiasaan itu secara alami dalam bahasa Indonesia.
- source_word: הָאֹהֱלָה / הָאֹהֶל
  choice: ke dalam kemah / kemah itu
  rationale: Bentuk berakhiran direktif pada הָאֹהֱלָה menunjukkan gerak masuk menuju kemah. Ayat ini hanya menyebut 'kemah', bukan sebutan lengkap 'Kemah Pertemuan'; 'itu' pada penyebutan kedua wajar untuk merujuk kembali pada kemah yang sama.
- source_word: יֵרֵד
  choice: turun
  rationale: Yiqtol ini berada dalam pola peristiwa yang berulang. Dalam bahasa Indonesia, sifat habitual sudah dinyatakan oleh 'setiap kali', sehingga bentuk sederhana 'turun' paling alami.
- source_word: עַמּוּד הֶעָנָן
  choice: tiang awan
  rationale: Padanan konkret dan mapan yang mempertahankan gambaran frasa konstruksi Ibrani.
- source_word: וְעָמַד
  choice: dan berdiri
  rationale: 'Meneruskan rangkaian tindakan berulang: tiang awan turun lalu mengambil posisi di pintu masuk kemah.'
- source_word: פֶּתַח הָאֹהֶל
  choice: di pintu masuk kemah itu
  rationale: '''Pintu masuk'' merupakan padanan modern yang alami bagi פֶּתַח dalam konteks bukaan atau jalan masuk sebuah kemah.'
- source_word: וְדִבֶּר
  choice: lalu Dia berbicara
  rationale: Teks Ibrani memakai verba maskulin tunggal tanpa subjek yang disebutkan. Pronomina mempertahankan subjek tersirat, sedangkan huruf kapital membantu pembaca mengenali rujukan kontekstual kepada TUHAN tanpa memasukkan nama ilahi ke dalam teks utama.
- source_word: עִם מֹשֶׁה
  choice: dengan Musa
  rationale: Preposisi עִם secara normal berarti 'dengan' dan mempertahankan nuansa komunikasi personal, bukan sekadar ujaran satu arah 'kepada Musa'.
theological_decisions:
- issue: Subjek tersirat pada וְדִבֶּר ('lalu ia/Dia berbicara')
  choice: Memakai 'Dia' dengan rujukan kepada TUHAN yang dipahami dari konteks, sambil memberi catatan bahwa subjek tidak disebutkan secara eksplisit.
  alternative: Menyebut secara eksplisit 'TUHAN berbicara dengan Musa'; atau, secara kurang mungkin, memahami tiang awan sebagai subjek gramatikal.
  rationale: Konteks mengarahkan pembaca kepada TUHAN sebagai pembicara, tetapi klausa Ibrani tidak menyebut nama-Nya. Terjemahan utama mempertahankan bentuk pronominal dan catatan kaki menjaga keterbukaan bentuk sumber serta menjelaskan rujukan kontekstualnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat lancar bagi pembaca umum, sementara aspek tindakan berulang, gambaran konkret tiang awan, dan ketidaktersuratan subjek pada klausa terakhir tetap dipertahankan.
