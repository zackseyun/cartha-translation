  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בַ/מֶּ֣ה יִוָּדַ֣ע אֵפ֗וֹא כִּֽי מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ אֲנִ֣י וְ/עַמֶּ֔/ךָ הֲ/ל֖וֹא בְּ/לֶכְתְּ/ךָ֣ עִמָּ֑/נוּ וְ/נִפְלֵ֨ינוּ֙ אֲנִ֣י וְ/עַמְּ/ךָ֔ מִ/כָּ֨ל הָ/עָ֔ם אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/016.yaml
  text: For how then will it be known that I have found favor in your sight[a], I and your people? Is it not by your going with us, so that I and your people are distinguished from every people who are on the face of the earth?
translation:
  language: id
  text: Sebab, dengan apakah akan diketahui bahwa aku telah mendapat perkenanan di mata-Mu—aku dan umat-Mu? Bukankah dengan Engkau pergi bersama kami, sehingga aku dan umat-Mu dibedakan[a] dari setiap bangsa yang ada di muka bumi?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “dipisahkan” atau “ditandai sebagai istimewa”. Kata kerja Ibrani ini dapat menyatakan bahwa seseorang dibuat luar biasa atau berbeda dari yang lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַמֶּה
  choice: Sebab, dengan apakah
  rationale: Gabungan kata penghubung dan kata tanya mengaitkan pertanyaan ini dengan ayat sebelumnya sekaligus menanyakan sarana yang membuat perkenanan Allah dapat diketahui.
- source_word: יִוָּדַע אֵפוֹא
  choice: akan diketahui
  rationale: Bentuk Nifal mempertahankan makna pasif. Daya inferensial אֵפוֹא disampaikan melalui alur pertanyaan dan kata penghubung “Sebab”, tanpa menambahkan ungkapan yang kaku.
- source_word: כִּי מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: bahwa aku telah mendapat perkenanan di mata-Mu
  rationale: Ungkapan Ibrani ini menyatakan penerimaan yang baik dari pihak Allah. “Mendapat perkenanan” alami dalam bahasa Indonesia, sedangkan “di mata-Mu” mempertahankan citra idiom sumber.
- source_word: אֲנִי וְעַמֶּךָ
  choice: aku dan umat-Mu
  rationale: Pasangan yang disebut secara eksplisit dipertahankan. Tanda pisah mencerminkan susunan sumber yang menempatkannya sesudah klausa dengan verba orang pertama tunggal, tanpa diam-diam meratakan ketegangannya.
- source_word: הֲלוֹא
  choice: Bukankah
  rationale: Mempertahankan bentuk pertanyaan retoris yang mengharapkan jawaban setuju.
- source_word: בְּלֶכְתְּךָ עִמָּנוּ
  choice: dengan Engkau pergi bersama kami
  rationale: Preposisi pada infinitif menyatakan sarana atau keadaan. “Pergi bersama kami” lebih wajar daripada “berjalan bersama kami” dalam konteks perjalanan umat.
- source_word: וְנִפְלֵינוּ
  choice: sehingga aku dan umat-Mu dibedakan
  rationale: Nifal dari פלא di sini menunjuk pada keadaan ditandai sebagai istimewa atau berbeda. “Dibedakan” menjaga nuansa pasif dan tidak menentukan lebih jauh bagaimana pembedaan itu berlangsung.
- source_word: מִכָּל הָעָם
  choice: dari setiap bangsa
  rationale: Kata עָם berbentuk tunggal tetapi dipakai secara distributif. “Setiap bangsa” menyampaikan perbandingan dengan semua kelompok bangsa lain.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: yang ada di muka bumi
  rationale: Ungkapan Ibrani yang lazim ini merujuk pada bangsa-bangsa yang mendiami bumi; “muka bumi” mempertahankan citra sumber secara alami.
theological_decisions:
- issue: Dasar kekhasan Israel
  choice: Kehadiran Allah yang pergi bersama umat-Nya menjadi tanda yang membedakan mereka dari semua bangsa lain.
  alternative: Israel dibedakan terutama oleh hukum, tanah, atau identitas etnisnya.
  rationale: Ayat ini secara eksplisit menghubungkan pembedaan Musa dan umat dengan kepergian Allah bersama mereka. Terjemahan mempertahankan hubungan sarana dan hasil itu tanpa menambahkan dasar lain.
- issue: Hubungan perkenanan kepada Musa dengan umat
  choice: Susunan “aku dan umat-Mu” dipertahankan dalam posisi yang menonjol sesudah pernyataan orang pertama tunggal.
  alternative: Mengubahnya menjadi pernyataan jamak yang sepenuhnya lancar bahwa Musa dan umat sama-sama telah mendapat perkenanan.
  rationale: Teks Ibrani memakai “aku telah mendapat” dalam bentuk tunggal lalu menambahkan “aku dan umat-Mu”. Tanda pisah mempertahankan ketegangan gramatikal dan cakupan yang mungkin disengaja itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan penerbitan Alkitab Indonesia. Struktur retoris dan pengulangan “aku dan umat-Mu” dipertahankan, sementara tanda pisah membantu keterbacaan tanpa menghapus kejanggalan bermakna dalam teks sumber.
