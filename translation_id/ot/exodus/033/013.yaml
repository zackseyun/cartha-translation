  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֡ה אִם נָא֩ מָצָ֨אתִי חֵ֜ן בְּ/עֵינֶ֗י/ךָ הוֹדִעֵ֤/נִי נָא֙ אֶת דְּרָכֶ֔/ךָ וְ/אֵדָ֣עֲ/ךָ֔ לְמַ֥עַן אֶמְצָא חֵ֖ן בְּ/עֵינֶ֑י/ךָ וּ/רְאֵ֕ה כִּ֥י עַמְּ/ךָ֖ הַ/גּ֥וֹי הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/013.yaml
  text: Now therefore[a], if I have found favor in your eyes, please make your ways known to me, so that I may know you, in order that I may find favor in your eyes[c][b]. And consider that this nation is your people.
translation:
  language: id
  text: Jadi sekarang, jika aku mendapat perkenanan di mata-Mu, beritahukanlah kiranya jalan-jalan-Mu kepadaku, supaya aku mengenal Engkau dan dengan demikian mendapat perkenanan di mata-Mu. Perhatikanlah bahwa bangsa ini adalah umat-Mu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Teks Ibrani memakai dua kata berbeda: “bangsa” dan “umat”, sehingga seruan Musa mencakup identitas mereka sebagai bangsa sekaligus sebagai umat milik Allah.'
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Jadi sekarang
  rationale: Mengungkapkan peralihan sekaligus daya simpulan dari konteks sebelumnya secara alami dalam bahasa Indonesia.
- source_word: נָא
  choice: kiranya
  rationale: Menyampaikan permohonan yang sopan dan sungguh-sungguh tanpa bahasa yang terlalu arkais.
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: aku mendapat perkenanan di mata-Mu
  rationale: Mempertahankan idiom Ibrani 'di mata-Mu'; 'perkenanan' sesuai dengan penerimaan atau kemurahan dalam hubungan ini.
- source_word: הוֹדִעֵנִי
  choice: beritahukanlah ... kepadaku
  rationale: Bentuk kausatif dari ידע berarti membuat seseorang mengetahui; pilihan ini tepat sekaligus alami.
- source_word: דְּרָכֶךָ
  choice: jalan-jalan-Mu
  rationale: Bentuk Ibraninya jamak dan dapat menunjuk pada cara Allah bertindak atau berurusan dengan umat-Nya.
- source_word: וְאֵדָעֲךָ
  choice: supaya aku mengenal Engkau
  rationale: Menjaga kemungkinan makna tujuan atau hasil serta dimensi pengenalan pribadi, bukan sekadar memperoleh informasi.
- source_word: לְמַעַן אֶמְצָא חֵן בְּעֵינֶיךָ
  choice: dan dengan demikian mendapat perkenanan di mata-Mu
  rationale: לְמַעַן menyatakan tujuan; pengulangan idiom perkenanan dipertahankan, sementara hubungan kalimat dibuat wajar dalam bahasa Indonesia.
- source_word: וּרְאֵה
  choice: Perhatikanlah
  rationale: 'Imperatif ראה di sini bersifat idiomatis: meminta Allah mengindahkan atau mempertimbangkan kenyataan yang disebutkan, bukan hanya melihat secara fisik.'
- source_word: כִּי עַמְּךָ הַגּוֹי הַזֶּה
  choice: bahwa bangsa ini adalah umat-Mu
  rationale: Membedakan גּוֹי sebagai 'bangsa' dan עַם sebagai 'umat', sehingga bahasa nasional dan relasional-perjanjian sama-sama terpelihara.
theological_decisions:
- issue: Nuansa perjanjian dalam klausa penutup
  choice: bangsa ini adalah umat-Mu
  alternative: bangsa ini adalah bangsa-Mu; umat ini adalah umat-Mu
  rationale: Teks Ibrani memakai dua kata berbeda, גּוֹי dan עַם. Terjemahan mempertahankan keduanya tanpa meratakan makna atau menambahkan rumusan teologis di luar teks.
- issue: Hubungan antara mengenal Allah dan mendapat perkenanan
  choice: supaya aku mengenal Engkau dan dengan demikian mendapat perkenanan
  alternative: dan aku akan mengenal Engkau, agar aku mendapat perkenanan
  rationale: Rangkaian bentuk Ibrani dapat dipahami sebagai tujuan atau hasil. Terjemahan mempertahankan alur permohonan Musa tanpa menetapkan suatu sistem sebab-akibat teologis yang melampaui ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi ditulis dengan huruf kapital sesuai konvensi umum penerbitan Alkitab bahasa Indonesia. Bentuk jamak 'jalan-jalan-Mu' sengaja dipertahankan karena sumber Ibrani berbentuk jamak.
