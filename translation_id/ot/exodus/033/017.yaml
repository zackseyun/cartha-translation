base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/017.yaml
  text: And Yahweh said to Moses[a], “I will also do this thing that you have spoken, because you have found favor in my eyes[b], and I know you by name.”
translation:
  language: id
  text: Yahweh berkata kepada Musa, “Aku juga akan melakukan hal yang kaukatakan ini[a], sebab engkau telah mendapat perkenanan di mata-Ku[b], dan Aku mengenal engkau dengan nama.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perkara” atau “perkataan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mendapat perkenanan di mata-Ku,” sebuah ungkapan Ibrani yang berarti mendapat pandangan yang baik.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan membedakannya dari gelar umum untuk Tuhan.
- source_word: גַּם
  choice: pun
  rationale: Partikel ini bersifat aditif dan menghubungkan janji tersebut dengan permintaan Musa sebelumnya; “pun” alami dalam susunan kalimat Indonesia ini.
- source_word: הַדָּבָר הַזֶּה
  choice: hal ini
  rationale: דָּבָר dapat berarti perkataan, perkara, atau hal. “Hal” mempertahankan keluasan makna dan dalam konteks mengacu pada apa yang baru saja Musa sampaikan.
- source_word: אֲשֶׁר דִּבַּרְתָּ
  choice: yang kaukatakan
  rationale: Mempertahankan kaitan verbal dengan perkataan Musa serta memakai bentuk langsung yang alami dalam bahasa Indonesia.
- source_word: אֶעֱשֶׂה
  choice: akan Kulakukan
  rationale: עשה di sini menyatakan tindakan yang dijanjikan; “melakukan” merupakan padanan umum yang sesuai dengan objek “hal”.
- source_word: מָצָאתָ חֵן בְּעֵינַי
  choice: engkau telah mendapat perkenanan di mata-Ku
  rationale: Mempertahankan citra idiom Ibrani sambil memakai “perkenanan” untuk חֵן sebagai sikap baik atau penerimaan yang diberikan.
- source_word: וָאֵדָעֲךָ בְּשֵׁם
  choice: Aku mengenal engkau secara pribadi
  rationale: Ungkapan “mengenal dengan nama” menyatakan pengenalan khusus dan personal. Padanan ini menyampaikan maksud ungkapan tersebut secara wajar dalam bahasa Indonesia tanpa mengurangi sifat relasionalnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Sifat pengenalan Allah terhadap Musa dalam וָאֵדָעֲךָ בְּשֵׁם
  choice: Aku mengenal engkau secara pribadi
  alternative: Aku mengenal engkau dengan nama
  rationale: Frasa ini menyatakan pengenalan dan pengakuan khusus terhadap Musa, bukan sekadar pengetahuan tentang namanya. Pilihan ini mempertahankan nuansa relasional tanpa menetapkan doktrin tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “engkau” dipakai dalam sapaan langsung, sedangkan bentuk klitik “kau-” dan “Ku-” menjaga kelancaran kalimat. Penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskan.
