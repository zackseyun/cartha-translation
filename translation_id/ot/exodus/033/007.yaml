  text: וּ/מֹשֶׁה֩ יִקַּ֨ח אֶת הָ/אֹ֜הֶל וְ/נָֽטָה ל֣/וֹ מִ/ח֣וּץ לַֽ/מַּחֲנֶ֗ה הַרְחֵק֙ מִן הַֽ/מַּחֲנֶ֔ה וְ/קָ֥רָא ל֖/וֹ אֹ֣הֶל מוֹעֵ֑ד וְ/הָיָה֙ כָּל מְבַקֵּ֣שׁ יְהוָ֔ה יֵצֵא֙ אֶל אֹ֣הֶל מוֹעֵ֔ד אֲשֶׁ֖ר מִ/ח֥וּץ לַֽ/מַּחֲנֶֽה־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/007.yaml
  text: Moses would take the tent and pitch it for himself outside the camp[a], far from the camp, and he called it the tent of meeting[b]. And everyone seeking Yahweh would go out to the tent of meeting that was outside the camp.
translation:
  language: id
  text: Musa biasa mengambil kemah itu[a] dan mendirikannya untuk dirinya di luar perkemahan, jauh dari perkemahan, lalu ia menamainya Kemah Pertemuan. Setiap orang yang mencari Yahweh biasa pergi ke Kemah Pertemuan yang berada di luar perkemahan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kemah itu”. Teks tidak secara eksplisit menyebutnya “kemah Musa”; mungkin yang dimaksud adalah kemah milik Musa atau sebuah kemah khusus yang digunakannya untuk tujuan ini.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “biasa mengambil” dan “biasa pergi” menerjemahkan bentuk kata kerja Ibrani yang dalam konteks ini kemungkinan menggambarkan tindakan yang dilakukan berulang kali.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקַּח
  choice: biasa mengambil
  rationale: Bentuk yiqtol dalam konteks ini paling mungkin menyatakan tindakan kebiasaan atau berulang, bukan satu peristiwa lampau saja.
- source_word: הָאֹהֶל
  choice: kemah itu
  rationale: Artikel tentu pada bahasa Ibrani dipertahankan. Teks tidak secara eksplisit mengatakan 'kemahnya', sehingga identitas kemah tidak dipersempit.
- source_word: וְנָטָה לוֹ
  choice: dan mendirikannya bagi dirinya
  rationale: נטה dalam konteks kemah berarti memasang atau mendirikan; לוֹ dipertahankan sebagai 'bagi dirinya', yang dapat menunjuk pada penggunaan atau tujuan Musa.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: di luar perkemahan
  rationale: Ungkapan ini secara alami menyatakan lokasi kemah di luar kawasan perkemahan Israel.
- source_word: הַרְחֵק מִן הַמַּחֲנֶה
  choice: jauh dari perkemahan
  rationale: Terjemahan ini mempertahankan penegasan bahwa kemah tersebut bukan sekadar berada di luar, melainkan terpisah jauh dari perkemahan.
- source_word: וְקָרָא לוֹ אֹהֶל מוֹעֵד
  choice: Ia menamainya Kemah Pertemuan
  rationale: קרא + ל dapat menyatakan pemberian nama. Bentuk 'menamainya' alami dalam bahasa Indonesia.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: מוֹעֵד menunjuk pada pertemuan yang ditetapkan; 'Kemah Pertemuan' merupakan padanan Indonesia yang tepat dan mapan.
- source_word: כָּל מְבַקֵּשׁ יְהוָה
  choice: setiap orang yang mencari Yahweh
  rationale: מבקש dapat mencakup mencari Allah maupun meminta petunjuk-Nya; 'mencari' mempertahankan keluasan nuansa tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama pribadi Yahweh, bukan diganti dengan gelar.
- source_word: יֵצֵא
  choice: biasa pergi
  rationale: Seperti yiqtol sebelumnya, bentuk ini kemungkinan besar menggambarkan tindakan yang lazim atau berulang.
- source_word: אֲשֶׁר מִחוּץ לַמַּחֲנֶה
  choice: yang berada di luar perkemahan
  rationale: Klausa relatif ini secara alami menerangkan lokasi Kemah Pertemuan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Identitas הָאֹהֶל
  choice: kemah itu
  alternative: kemah Musa atau sebuah kemah
  rationale: Bahasa Ibrani memakai bentuk tentu tetapi tidak menyatakan bahwa kemah itu milik Musa. Terjemahan tidak menetapkan identitas yang dibiarkan terbuka oleh teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Perkemahan' dipilih untuk מַחֲנֶה, dan kapitalisasi 'Kemah Pertemuan' memperlakukannya sebagai nama. Penanda catatan ditempatkan tepat pada unsur yang dijelaskan.
