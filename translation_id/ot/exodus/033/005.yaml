source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֱמֹ֤ר אֶל בְּנֵֽי יִשְׂרָאֵל֙ אַתֶּ֣ם עַם קְשֵׁה עֹ֔רֶף רֶ֧גַע אֶחָ֛ד אֶֽעֱלֶ֥ה בְ/קִרְבְּ/ךָ֖ וְ/כִלִּיתִ֑י/ךָ וְ/עַתָּ֗ה הוֹרֵ֤ד עֶדְיְ/ךָ֙ מֵֽ/עָלֶ֔י/ךָ וְ/אֵדְעָ֖ה מָ֥ה אֶֽעֱשֶׂה לָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/005.yaml
  text: And Yahweh said to Moses[a], “Say to the sons of Israel, ‘You are a stiff-necked people. In a single moment, if I were to go up in your midst, I would consume you. So now, take off your ornaments from upon you[e][d][c][b], and I will know what I should do with you.’”
translation:
  language: id
  text: Yahweh berfirman kepada Musa, “Katakanlah kepada orang Israel[a], ‘Kamu adalah bangsa yang keras tengkuk. Sekiranya Aku naik di tengah-tengahmu sesaat saja[b], Aku akan membinasakanmu[c]. Karena itu, sekarang lepaskanlah perhiasan yang kamu pakai[d], lalu Aku akan mengetahui apa yang akan Kulakukan denganmu[e].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak lelaki Israel”; ungkapan ini dapat berarti “keturunan Israel” atau “orang Israel”.'
    reason: lexical_alternative
  - marker: b
    text: 'Dapat juga diterjemahkan: “Jika Aku naik di tengah-tengahmu walau hanya sesaat.”'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “Aku akan menghabisimu.”'
    reason: lexical_alternative
  - marker: d
    text: 'Atau: “tanggalkanlah perhiasanmu” atau “singkirkanlah hiasanmu dari tubuhmu”.'
    reason: lexical_alternative
  - marker: e
    text: Secara harfiah, teks mempertahankan ungkapan “Aku akan mengetahui apa yang akan Kulakukan denganmu”, bukan memparafrasakannya sebagai “Aku akan memutuskan apa yang harus Kulakukan denganmu”.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar TUHAN.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan ini menunjuk kepada bangsa Israel secara kolektif; bentuk ini alami dan inklusif dalam bahasa Indonesia modern, sementara arti harfiahnya dicatat dalam catatan kaki.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: bangsa yang keras tengkuk
  rationale: Mempertahankan metafora Ibrani tentang sikap keras kepala dan pembangkangan tanpa meratakannya menjadi istilah abstrak.
- source_word: רֶגַע אֶחָד אֶעֱלֶה בְקִרְבְּךָ
  choice: Sekiranya Aku naik di tengah-tengahmu sesaat saja
  rationale: Mempertahankan verba ‘naik’, bahasa kehadiran ‘di tengah-tengahmu’, singkatnya waktu, dan daya kondisional yang tersirat oleh konteks.
- source_word: וְכִלִּיתִיךָ
  choice: Aku akan membinasakanmu
  rationale: Dalam konteks penghukuman, verba ini berarti menghabisi atau membinasakan; ‘membinasakan’ jelas dan wajar dalam bahasa Indonesia.
- source_word: הוֹרֵד עֶדְיְךָ מֵעָלֶיךָ
  choice: lepaskanlah perhiasan yang kamu pakai
  rationale: Menyampaikan tindakan menanggalkan perhiasan secara alami; עֶדְיְךָ cukup luas untuk mencakup berbagai perhiasan atau hiasan yang dikenakan.
- source_word: וְאֵדְעָה
  choice: lalu Aku akan mengetahui
  rationale: Mempertahankan verba ‘mengetahui’ dan urutan gagasan teks, tanpa mengubahnya menjadi sekadar ‘memutuskan’.
- source_word: מָה אֶעֱשֶׂה לָּךְ
  choice: apa yang akan Kulakukan terhadapmu
  rationale: Menjaga rumusan tetap terbuka mengenai tindakan yang akan dilakukan kepada Israel, tanpa menambahkan jenis tindakan tertentu.
theological_decisions:
- issue: Bahasa antropomorfis tentang pengetahuan ilahi
  choice: Mempertahankan ‘Aku akan mengetahui’ dalam teks utama
  alternative: ‘supaya Aku memutuskan’ atau ‘supaya Aku menentukan’
  rationale: Teks Ibrani memakai verba ‘mengetahui’. Terjemahan mempertahankan ketegangan teologis dan sifat relasional ungkapan itu, alih-alih menjelaskannya sebagai proses pengambilan keputusan semata.
- issue: Akhiran tunggal kolektif yang ditujukan kepada Israel
  choice: Menggunakan ‘kamu’ untuk Israel sebagai satu umat kolektif
  alternative: Menandai setiap bentuk secara eksplisit sebagai tunggal atau menggantinya dengan ‘kalian’
  rationale: Bahasa Ibrani beralih dari sapaan jamak kepada akhiran tunggal ketika memandang Israel sebagai satu kesatuan. ‘Kamu’ dalam bahasa Indonesia dapat mempertahankan keluasan ini secara alami.
- issue: Daya modal אֶעֱלֶה dalam ancaman bersyarat
  choice: ‘Sekiranya Aku naik’
  alternative: ‘Aku akan naik’
  rationale: Konteks dan hubungan dengan akibat ‘Aku akan membinasakanmu’ mendukung pembacaan bersyarat, tetapi verba ‘naik’ tetap dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Metafora ‘keras tengkuk’, verba gerak ‘naik’, serta bahasa antropomorfis ‘akan mengetahui’ dipertahankan karena penting bagi citra dan ketegangan teks. Susunan kalimat dibuat alami bagi pembaca umum tanpa menghapus bentuk sapaan kolektif kepada Israel.
