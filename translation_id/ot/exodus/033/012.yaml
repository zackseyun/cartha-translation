  to: Lalu Musa berkata kepada Yahweh, “Lihatlah, Engkau berfirman kepadaku, ‘Pimpinlah umat ini naik,’ tetapi Engkau belum memberitahukan kepadaku siapa yang akan Kauutus menyertai aku. Namun, Engkau telah berfirman, ‘Aku mengenal engkau dengan nama[a], dan engkau juga telah mendapat perkenanan di mata-Ku[b].’”
  rationale: Revisi memperbaiki padanan idiom בְשֵׁם menjadi “dengan nama,” yang secara semantis dan idiomatis lebih tepat dalam bahasa Indonesia. “Umat ini” dan “Pimpinlah ... naik” memberikan bahasa Indonesia modern yang wajar sambil mempertahankan rujukan pada Israel serta arah “naik” dari bentuk Hifil עלה. Tanda koma setelah “Namun” memperlancar pembacaan tanpa mengubah makna.
