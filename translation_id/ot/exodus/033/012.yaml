id: EXO.33.12
reference: Exodus 33:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל יְהוָ֗ה רְ֠אֵה אַתָּ֞ה אֹמֵ֤ר אֵלַ/י֙ הַ֚עַל אֶת הָ/עָ֣ם הַ/זֶּ֔ה וְ/אַתָּה֙ לֹ֣א הֽוֹדַעְתַּ֔/נִי אֵ֥ת אֲשֶׁר תִּשְׁלַ֖ח עִמִּ֑/י וְ/אַתָּ֤ה אָמַ֨רְתָּ֙ יְדַעְתִּ֣י/ךָֽ בְ/שֵׁ֔ם וְ/גַם מָצָ֥אתָ חֵ֖ן בְּ/עֵינָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/012.yaml
  text: Then Moses said to Yahweh[a], “See, you are saying to me, ‘Bring up this people,’ but you have not made known to me whom you will send with me. Yet you have said, ‘I know you by name[c][b], and you also have found favor in my sight.’”
translation:
  language: id
  text: Lalu Musa berkata kepada Yahweh, “Lihatlah, Engkau berfirman kepadaku, ‘Pimpinlah umat ini naik,’ tetapi Engkau belum memberitahukan kepadaku siapa yang akan Kauutus menyertai aku. Namun, Engkau telah berfirman, ‘Aku mengenal engkau dengan nama[a], dan engkau juga telah mendapat perkenanan di mata-Ku[b].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Aku mengenal engkau dengan nama.” Ungkapan ini menyatakan pengenalan pribadi.
    reason: cultural_note
  - marker: b
    text: Atau, “engkau juga telah mendapat kasih karunia dalam pandangan-Ku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama pribadi ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: רְאֵה
  choice: Lihatlah
  rationale: Berfungsi sebagai penanda wacana imperatif yang membuka permohonan Musa; bentuk ini tetap langsung, alami, dan bermartabat dalam bahasa Indonesia.
- source_word: הַעַל
  choice: Bawalah ... naik
  rationale: Bentuk Hifil dari עלה berarti menyebabkan naik atau membawa naik. Unsur arah dipertahankan sesuai konteks perjalanan dari Sinai menuju Kanaan.
- source_word: הָעָם הַזֶּה
  choice: bangsa ini
  rationale: Kata עַם menunjuk suatu kelompok bangsa; bentuk tunggal dan nuansa agak berjarak dari demonstratif ini tetap dipertahankan.
- source_word: הוֹדַעְתַּנִי
  choice: belum memberitahukan kepadaku
  rationale: Menyampaikan makna kausatif ‘membuat tahu’ secara alami dalam bahasa Indonesia; ‘belum’ sesuai dengan konteks keluhan mengenai informasi yang sampai saat itu tidak diberikan.
- source_word: אֵת אֲשֶׁר תִּשְׁלַח עִמִּי
  choice: siapa yang akan Kauutus menyertai aku
  rationale: אֲשֶׁר dalam konstruksi ini secara alami merujuk kepada pendamping pribadi; עִם menyatakan penyertaan. Bahasa Indonesia tidak memerlukan pembedaan kasus seperti ‘who/whom’.
- source_word: יְדַעְתִּיךָ בְשֵׁם
  choice: Aku mengenal engkau menurut namamu
  rationale: Mempertahankan unsur eksplisit ‘nama’ dan daya relasional idiom Ibrani tanpa memperluasnya menjadi klaim tentang pemilihan.
- source_word: מָצָאתָ חֵן בְּעֵינַי
  choice: engkau juga telah mendapat perkenanan di mata-Ku
  rationale: Mempertahankan citra idiom Ibrani sekaligus memakai ungkapan Indonesia yang dapat dipahami; חֵן di sini paling tepat menyatakan perkenanan.
- source_word: וְאַתָּה ... לֹא ... וְאַתָּה אָמַרְתָּ
  choice: tetapi Engkau ... Namun Engkau telah berfirman
  rationale: Mengungkapkan pertentangan dan penekanan dari pengulangan pronomina dalam bahasa Indonesia yang wajar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. Bentuk ‘Yahweh’ mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Daya ungkapan יְדַעְתִּיךָ בְשֵׁם
  choice: Mempertahankan idiom relasional tanpa parafrasa doktrinal
  alternative: Aku mengenal engkau secara pribadi; Aku telah memilih engkau secara pribadi
  rationale: Ungkapan tersebut menyatakan pengenalan pribadi dan perkenanan ilahi, tetapi tidak secara eksplisit mengatakan ‘memilih’; terjemahan tidak menambahkan klaim teologis itu.
- issue: Makna חֵן dalam konteks ini
  choice: perkenanan
  alternative: kasih karunia; kemurahan
  rationale: ‘Perkenanan’ paling langsung menyampaikan penerimaan positif dalam ungkapan ‘di mata-Ku’, tanpa memaksakan terminologi teologis yang lebih khusus.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Sapaan kepada Allah memakai kapitalisasi pronomina sesuai kebiasaan penerbitan Alkitab Indonesia. ‘Berfirman’ dipakai untuk ucapan ilahi, sedangkan ‘berkata’ untuk Musa. Susunan klausa mempertahankan desakan dan pertentangan dalam keluhan Musa tanpa menjadi kaku.
