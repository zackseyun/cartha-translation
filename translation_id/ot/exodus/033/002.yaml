  text: וְ/שָׁלַחְתִּ֥י לְ/פָנֶ֖י/ךָ מַלְאָ֑ךְ וְ/גֵֽרַשְׁתִּ֗י אֶת הַֽ/כְּנַעֲנִי֙ הָֽ/אֱמֹרִ֔י וְ/הַֽ/חִתִּי֙ וְ/הַ/פְּרִזִּ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/002.yaml
  text: And I will send an angel before you[a], and I will drive out the Canaanite, the Amorite, the Hittite, the Perizzite, the Hivite, and the Jebusite.
translation:
  language: id
  text: Aku akan mengutus seorang malaikat mendahuluimu[a], dan Aku akan menghalau orang Kanaan, orang Amori, orang Het, orang Feris, orang Hewi, dan orang Yebus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seorang utusan.” Kata Ibrani מַלְאָךְ dapat menunjuk kepada utusan surgawi ataupun manusia; dalam konteks ini, “malaikat” paling sesuai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי
  choice: Aku akan mengutus
  rationale: Bentuk perfektum Qal dengan waw dalam konteks firman ilahi ini menyatakan tindakan yang akan datang. “Mengutus” wajar dipakai ketika seseorang diberi tugas tertentu.
- source_word: לְפָנֶיךָ
  choice: mendahuluimu
  rationale: Ungkapan Ibrani ini secara harfiah berkaitan dengan “di hadapanmu,” tetapi secara idiomatis berarti pergi di depan atau lebih dahulu; “mendahuluimu” alami dan ringkas dalam bahasa Indonesia.
- source_word: מַלְאָךְ
  choice: seorang malaikat
  rationale: Kata ini dapat berarti utusan manusia maupun malaikat. Dalam konteks tuntunan menuju negeri itu, “malaikat” paling sesuai, sedangkan kemungkinan leksikal “utusan” dipertahankan dalam catatan kaki.
- source_word: וְגֵרַשְׁתִּי
  choice: dan Aku akan menghalau
  rationale: Kata kerja גרשׁ menyatakan tindakan mengusir atau membuat penduduk keluar dari suatu wilayah. “Menghalau” jelas, padat, dan sesuai dengan konteks.
- source_word: הַכְּנַעֲנִי ... וְהַיְבוּסִי
  choice: orang Kanaan ... dan orang Yebus
  rationale: Nama-nama bangsa dalam bentuk tunggal berartikel berfungsi secara kolektif. Pola “orang + nama bangsa” mempertahankan sifat kolektif itu dan merupakan bentuk Indonesia yang alami.
theological_decisions:
- issue: Identitas מַלְאָךְ dalam ayat ini
  choice: “seorang malaikat,” tanpa menyamakannya secara eksplisit dengan Malaikat TUHAN atau menentukan hakikatnya lebih lanjut
  alternative: “seorang utusan” atau “malaikat itu”
  rationale: Ayat ini sendiri hanya menyebut מַלְאָךְ tanpa identifikasi tambahan. Terjemahan tidak boleh memasukkan kesimpulan teologis yang tidak dinyatakan, sementara catatan kaki menjaga cakupan makna katanya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti ilahi “Aku” dikapitalisasi sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Nama bangsa mengikuti bentuk yang lazim dalam tradisi Alkitab Indonesia, tanpa menambahkan penjelasan denominatif.
