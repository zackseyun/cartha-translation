  yaml_path: translation/ot/exodus/033/020.yaml
  text: But he said[a], “You cannot see my face[b], for man shall not see me and live.”
translation:
  language: id
  text: Namun Ia berfirman, “Engkau tidak dapat melihat wajah-Ku[a], sebab tidak seorang manusia pun[b] dapat melihat Aku dan tetap hidup.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “hadirat-Ku.” Secara harfiah bahasa Ibrani berbunyi “wajah-Ku.”'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “tidak seorang manusia pun” berlaku bagi manusia pada umumnya.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Namun Ia berfirman
  rationale: Waw-konsekutif melanjutkan narasi, tetapi konteksnya menyatakan kontras dengan permintaan Musa pada ayat sebelumnya. “Namun” menyampaikan kontras itu secara alami; “berfirman” sesuai untuk ujaran Allah dalam ragam Alkitab Indonesia yang modern dan bermartabat.
- source_word: לֹא תוּכַל
  choice: Engkau tidak dapat
  rationale: יכל menunjuk pada kemampuan atau kapasitas, bukan larangan. Bentuk ini mempertahankan ketidakmungkinan yang dinyatakan teks.
- source_word: לִרְאֹת
  choice: melihat
  rationale: ראה di sini menyatakan persepsi visual secara langsung; “melihat” adalah padanan Indonesia yang jelas dan wajar.
- source_word: אֶת־פָּנַי
  choice: wajah-Ku
  rationale: פָּנִים secara harfiah berarti “wajah.” Ungkapan konkret ini dipertahankan agar bahasa antropomorfis sumber tidak diubah diam-diam menjadi abstraksi; kemungkinan makna “hadirat-Ku” dicatat dalam catatan kaki.
- source_word: כִּי
  choice: sebab
  rationale: Partikel ini memperkenalkan alasan bagi ketidakmungkinan yang baru dinyatakan.
- source_word: לֹא יִרְאַנִי
  choice: tidak ... dapat melihat Aku
  rationale: Bentuk imperfek menyatakan prinsip umum beserta konsekuensinya. Dalam bahasa Indonesia, “tidak seorang ... pun dapat” menyampaikan daya umum pernyataan itu secara alami tanpa mengartikannya sebagai larangan.
- source_word: הָאָדָם
  choice: seorang manusia
  rationale: הָאָדָם bersifat tunggal sekaligus generik, yakni menunjuk kepada manusia mana pun. Ungkapan “tidak seorang manusia pun” mempertahankan penerapan universalnya dengan bahasa Indonesia yang alami.
- source_word: וָחָי
  choice: dan tetap hidup
  rationale: 'Bentuk ini mengungkapkan akibat: manusia tidak dapat melihat Allah lalu terus hidup. “Tetap hidup” menjadikan nuansa keberlanjutan hidup jelas tanpa melebihkan teks.'
theological_decisions:
- issue: Bahasa antropomorfis tentang Allah dalam “wajah-Ku”
  choice: Mempertahankan “wajah-Ku” dalam teks utama
  alternative: hadirat-Ku
  rationale: Bahasa konkret Ibrani dipertahankan, sehingga ketegangan antara “wajah” dan melihat Allah tidak diselesaikan menjadi konsep abstrak. Alternatif relasional “hadirat-Ku” diberikan dalam catatan kaki.
- issue: Daya generik הָאָדָם
  choice: “tidak seorang manusia pun”
  alternative: manusia / umat manusia
  rationale: Frasa ini menyampaikan bahwa pernyataan berlaku bagi setiap manusia, sambil tetap mencerminkan bentuk tunggal generik sumber dan menghindari kesan bahwa hanya laki-laki yang dimaksud.
- issue: Hubungan melihat Allah dengan hidup
  choice: “melihat Aku dan tetap hidup”
  alternative: melihat Aku lalu hidup / melihat Aku dan hidup
  rationale: “Tetap hidup” menyatakan konsekuensi yang tersirat oleh וָחָי tanpa menjelaskan penyebab teologis yang tidak disebutkan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “Engkau” serta bentuk “Ia berfirman” cocok dengan konteks percakapan langsung antara Allah dan Musa. Penempatan [a] langsung sesudah “wajah-Ku” menandai alternatif leksikal, sedangkan [b] ditempatkan setelah keseluruhan pernyataan yang berlaku umum.
