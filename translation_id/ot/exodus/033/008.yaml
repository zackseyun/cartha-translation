base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/008.yaml
  text: And whenever Moses went out to the tent[a], all the people would rise and stand, each man at the entrance of his tent[b], and they would watch after Moses until he entered the tent.
translation:
  language: id
  text: Setiap kali Musa keluar menuju kemah itu[a], seluruh umat bangkit lalu berdiri, masing-masing orang di pintu kemahnya[b]. Mereka mengikuti Musa dengan pandangan sampai ia masuk ke dalam kemah itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kemah itu,” yakni kemah pertemuan yang disebutkan dalam konteks sekitarnya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “masing-masing laki-laki”; bentuk maskulin tunggal dalam bahasa Ibrani dipakai secara distributif bagi anggota umat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּצֵאת
  choice: Setiap kali ... keluar
  rationale: Rangkaian וְהָיָה dengan infinitif temporal menyatakan keadaan yang berulang. “Setiap kali” menyampaikan aspek kebiasaan itu secara alami, sedangkan “keluar” mempertahankan gerak yang dinyatakan oleh יצא.
- source_word: אֶל הָאֹהֶל
  choice: menuju kemah itu
  rationale: Preposisi אֶל menunjukkan arah menuju kemah tertentu yang sudah dikenal dari konteks. Ungkapan ini tidak diperluas menjadi “Kemah Pertemuan” karena sebutan lengkap tersebut tidak muncul dalam ayat ini.
- source_word: יָקוּמוּ ... וְנִצְּבוּ
  choice: bangkit lalu berdiri
  rationale: 'Kedua verba menggambarkan tindakan yang lazim dilakukan setiap kali Musa keluar: umat bangkit dan mengambil posisi berdiri. “Lalu” membuat urutannya wajar dalam bahasa Indonesia tanpa mengubah hubungan dasarnya.'
- source_word: אִישׁ פֶּתַח אָהֳלוֹ
  choice: masing-masing orang di pintu kemahnya
  rationale: אִישׁ dipakai secara distributif bagi anggota umat. “Masing-masing orang” menyampaikan fungsi distributif itu dengan bahasa Indonesia yang alami; bentuk maskulin harfiahnya dijelaskan dalam catatan kaki.
- source_word: וְהִבִּיטוּ אַחֲרֵי מֹשֶׁה
  choice: Mereka mengikuti Musa dengan pandangan
  rationale: Ungkapan ini berarti memandang ke arah Musa dan mengikutinya dengan mata ketika ia berjalan menjauh. Pilihan ini mempertahankan unsur אַחֲרֵי, “di belakang/setelah,” tanpa menimbulkan kesan bahwa mereka mengikuti secara fisik.
- source_word: עַד בֹּאוֹ הָאֹהֱלָה
  choice: sampai ia masuk ke dalam kemah itu
  rationale: בוא bersama akhiran direktif pada “kemah” menyatakan gerak masuk. Terjemahan ini jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Identitas הָאֹהֶל dalam ayat ini
  choice: kemah itu
  alternative: Kemah Pertemuan
  rationale: Konteks menunjukkan bahwa yang dimaksud ialah kemah pertemuan, tetapi teks ayat ini hanya mengatakan “kemah itu.” Terjemahan utama mempertahankan bentuk sumber, sedangkan identifikasinya dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur dibuat lancar bagi pembaca umum, sementara aspek tindakan berulang, arah gerak Musa, dan idiom mengikuti dengan pandangan tetap dipertahankan.
