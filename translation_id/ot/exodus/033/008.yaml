  terminology: Nama Musa, istilah “umat,” dan “kemah” digunakan secara konsisten dan sesuai konteks. Catatan kaki a dengan tepat membedakan teks utama “kemah itu” dari identifikasi kontekstual sebagai Kemah Pertemuan. Catatan kaki b menjelaskan bentuk maskulin tunggal Ibrani secara akurat tanpa mengubah terjemahan utama yang distributif.
