  terminology: “Kebaikan-Ku,” “Yahweh,” “bermurah hati,” dan “berbelas kasihan” merupakan pilihan yang baik dan mempertahankan perbedaan leksikal serta repetisi Ibrani. Kapitalisasi pronomina ilahi konsisten dengan kebiasaan penerbitan Alkitab Indonesia.
