base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/019.yaml
  text: And he said[a], “I myself will make all my goodness pass before you, and I will proclaim the name of Yahweh before you. And I will be gracious to whom I will be gracious, and I will show mercy to whom I will show mercy.”
translation:
  language: id
  text: Lalu Dia berfirman, “Aku sendiri akan membuat seluruh kebaikan-Ku melintas di hadapanmu dan akan memaklumkan nama Yahweh di hadapanmu. Aku akan bermurah hati kepada siapa Aku bermurah hati, dan Aku akan berbelas kasihan kepada siapa Aku berbelas kasihan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַעֲבִיר
  choice: akan membuat ... lewat
  rationale: Bentuk Hifil dari עבר bersifat kausatif; pilihan ini mempertahankan makna bahwa Allah membuat kebaikan-Nya lewat, sekaligus tetap alami dalam bahasa Indonesia.
- source_word: כָּל טוּבִי
  choice: seluruh kebaikan-Ku
  rationale: טוּב dapat menunjuk pada kebaikan, kemurahan, atau keelokan. Dalam konteks penyataan diri dan belas kasihan Allah, 'kebaikan' mempertahankan cakupan maknanya tanpa mempersempitnya menjadi rupa atau pemberian.
- source_word: עַל־פָּנֶיךָ
  choice: di hadapanmu
  rationale: Ungkapan spasial Ibrani ini secara idiomatis berarti 'di hadapanmu', bukan secara harfiah 'di atas wajahmu'.
- source_word: וְקָרָאתִי בְשֵׁם יְהוָה
  choice: akan menyerukan nama Yahweh
  rationale: Dalam konteks ini קרא בשם menunjuk pada pengumuman atau penyataan nama ilahi, bukan terutama tindakan memanggil nama itu dalam doa. 'Menyerukan' menjaga kekuatan tindakan lisan tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi melalui transliterasi, bukan diganti dengan gelar.
- source_word: לְפָנֶיךָ
  choice: di hadapanmu
  rationale: Pilihan ini mempertahankan ungkapan kehadiran dan pengulangan konsep spasial dalam ayat.
- source_word: וְחַנֹּתִי אֶת אֲשֶׁר אָחֹן
  choice: Aku akan bermurah hati kepada siapa Aku bermurah hati
  rationale: Pengulangan akar חנן dipertahankan untuk menyampaikan penekanan dan kebebasan tindakan Allah. 'Bermurah hati' alami dan cukup dekat dengan gagasan memberikan anugerah atau kemurahan.
- source_word: וְרִחַמְתִּי אֶת אֲשֶׁר אֲרַחֵם
  choice: Aku akan berbelas kasihan kepada siapa Aku berbelas kasihan
  rationale: רחם bermakna berbelas kasihan atau menunjukkan rahmat. Bentuk yang sama diulang agar konstruksi serumpun dan tekanannya tetap terdengar.
- source_word: אֲנִי
  choice: Aku sendiri
  rationale: Kata ganti eksplisit memberi penekanan di samping penanda orang pada verba. 'Aku sendiri' menyampaikan penekanan itu tanpa menambahkan makna eksklusif 'hanya Aku'.
- source_word: וַיֹּאמֶר
  choice: Lalu Dia berfirman
  rationale: Verba אמר memperkenalkan ucapan ilahi. 'Berfirman' merupakan pilihan Indonesia yang wajar dan bermartabat bagi tuturan langsung Allah; 'lalu' menyampaikan kesinambungan naratif waw.
theological_decisions:
- issue: Pernyataan ilahi tentang kemurahan hati dan belas kasihan
  choice: 'Mempertahankan rumusan orang pertama yang berulang: ''Aku akan bermurah hati ... dan Aku akan berbelas kasihan ...'''
  alternative: Memparafrasakannya sebagai prinsip umum tentang kebaikan Allah, atau menafsirkannya dengan rumusan deterministis tertentu.
  rationale: Teks Ibrani menegaskan kebebasan Allah dalam memberikan kemurahan dan belas kasihan melalui pengulangan, tetapi tidak menjabarkan suatu sistem teologis. Terjemahan mempertahankan ketegangan itu tanpa menyelesaikan perdebatan doktrinal kemudian.
- issue: Hubungan antara 'kebaikan-Ku' dan penyataan nama Yahweh
  choice: Membiarkan kedua unsur berdampingan sebagai tindakan penyataan ilahi yang berkaitan tanpa menyamakannya secara eksplisit.
  alternative: Menjelaskan dalam teks bahwa seluruh kebaikan Allah identik dengan sifat-sifat yang dinyatakan melalui nama-Nya.
  rationale: Konteks menghubungkan keduanya, tetapi ayat tidak secara eksplisit merumuskan identitas konseptual tersebut; terjemahan tidak menambahkan penafsiran.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Pronomina yang merujuk kepada Allah ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Repetisi sumber sengaja dipertahankan. Tidak ada penanda catatan kaki karena tidak ada catatan yang diperlukan dalam draf Indonesia ini; catatan bahasa Inggris yang dilabeli [a] tampaknya tidak selaras dengan posisi penandanya dan substansinya sudah terwakili langsung oleh pilihan 'berbelas kasihan'.
