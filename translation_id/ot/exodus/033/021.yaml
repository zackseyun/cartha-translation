  yaml_path: translation/ot/exodus/033/021.yaml
  text: And the LORD said, “Look, there is a place by me, and you shall stand on the rock.”
translation:
  language: id
  text: Lalu TUHAN berfirman, “Lihat, ada suatu tempat di dekat-Ku. Berdirilah engkau di atas batu itu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. Karena subjeknya TUHAN, 'berfirman' merupakan padanan Indonesia yang alami dan bermartabat.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi terjemahan Alkitab bahasa Indonesia yang menandai nama ilahi YHWH dengan huruf kapital.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Mempertahankan fungsi penunjuk yang mengarahkan perhatian Musa pada tempat yang dimaksud.
- source_word: מָקוֹם אִתִּי
  choice: suatu tempat di dekat-Ku
  rationale: אִתִּי secara harfiah berarti 'bersama/dekat Aku'; dalam konteks ruang, 'di dekat-Ku' terdengar alami tanpa menentukan lokasi secara berlebihan.
- source_word: וְנִצַּבְתָּ
  choice: Berdirilah engkau
  rationale: Bentuk weqatal dalam konteks instruksi dapat berfungsi sebagai perintah. 'Engkau' mempertahankan penekanan pada orang kedua tunggal.
- source_word: עַל הַצּוּר
  choice: di atas gunung batu itu
  rationale: צוּר menunjuk batu besar atau tebing/gunung batu, bukan sekadar batu kecil; artikel definit menandai batu tertentu yang sedang ditunjuk.
theological_decisions:
- issue: Hubungan tempat itu dengan kehadiran TUHAN
  choice: di dekat-Ku
  alternative: bersama-Ku / pada-Ku
  rationale: Ungkapan Ibrani dibiarkan bersifat spasial dan relasional tanpa mengembangkan penjelasan metafisik yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan orang kedua tunggal memakai 'engkau'; rujukan kepada TUHAN memakai kapital penghormatan pada '-Ku'.
