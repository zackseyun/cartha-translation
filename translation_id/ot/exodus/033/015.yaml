base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/015.yaml
  text: Then he said to him[a], “If your presence does not go, do not bring us up from here.”
translation:
  language: id
  text: Lalu Musa berkata kepada-Nya, “Jika hadirat-Mu[a] tidak menyertai kami, janganlah membawa kami pergi dari sini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “wajah-Mu.” Dalam bahasa Ibrani, “wajah” sering dipakai untuk menyatakan kehadiran pribadi seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Lalu Musa berkata kepada-Nya
  rationale: Bentuk naratif וַיֹּאמֶר melanjutkan urutan peristiwa, sehingga “Lalu” wajar dalam bahasa Indonesia. Nama “Musa” memperjelas subjek yang tersirat dari konteks, sedangkan אֵלָיו diterjemahkan “kepada-Nya” karena lawan bicaranya adalah Allah.
- source_word: אִם אֵין
  choice: Jika ... tidak
  rationale: Gabungan partikel syarat dan bentuk negatif eksistensial memperkenalkan kondisi nyata; susunan “Jika ... tidak” merupakan bentuk Indonesia yang alami.
- source_word: פָּנֶיךָ
  choice: hadirat-Mu
  rationale: Secara harfiah berarti “wajah-Mu,” tetapi dalam konteks ini merupakan ungkapan Ibrani bagi kehadiran Allah secara pribadi. “Hadirat-Mu” menyampaikan maknanya dengan tetap mempertahankan ragam bahasa yang khidmat; gambaran harfiahnya dicatat dalam catatan kaki.
- source_word: הֹלְכִים
  choice: menyertai kami
  rationale: Partisip ini menggambarkan tindakan pergi bersama yang sedang atau akan berlangsung. Dalam konteks perjalanan Israel, “menyertai kami” mengungkapkan makna kontekstualnya secara alami, tanpa memberi kesan bahwa hadirat Allah pergi meninggalkan mereka.
- source_word: אַל תַּעֲלֵנוּ
  choice: janganlah membawa kami berangkat
  rationale: אַל menyatakan larangan atau permohonan mendesak, sedangkan bentuk kausatif dari עלה berarti “membawa naik/berangkat.” “Membawa kami berangkat” mempertahankan unsur kausatif dan cocok dengan konteks perjalanan dari tempat itu.
- source_word: מִזֶּה
  choice: dari sini
  rationale: Preposisi dengan kata penunjuk menunjuk pada lokasi mereka saat itu; “dari sini” adalah padanan Indonesia yang ringkas dan alami.
theological_decisions:
- issue: Makna פָּנֶיךָ ketika mengacu kepada Allah
  choice: hadirat-Mu
  alternative: wajah-Mu
  rationale: Kata Ibrani itu mempertahankan gambaran “wajah,” tetapi dalam konteks ini menunjuk pada kehadiran Allah sendiri yang menyertai Israel. Terjemahan utama memakai makna idiomatis, sementara catatan kaki menjaga keterbukaan terhadap citra harfiahnya.
- issue: Subjek tersirat dalam וַיֹּאמֶר
  choice: Musa
  alternative: ia
  rationale: Konteks langsung mengidentifikasi pembicara sebagai Musa. Penyebutan nama menghindari ketidakjelasan pronomina bahasa Indonesia tanpa mengubah hubungan antar tokoh.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “kepada-Nya,” “hadirat-Mu,” dan “janganlah” mempertahankan penghormatan kepada Allah, sedangkan susunan kalimat tetap mudah dipahami pembaca umum.
