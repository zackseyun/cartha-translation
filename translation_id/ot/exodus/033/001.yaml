id: EXO.33.1
reference: Exodus 33:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר יְהוָ֤ה אֶל מֹשֶׁה֙ לֵ֣ךְ עֲלֵ֣ה מִ/זֶּ֔ה אַתָּ֣ה וְ/הָ/עָ֔ם אֲשֶׁ֥ר הֶֽעֱלִ֖יתָ מֵ/אֶ֣רֶץ מִצְרָ֑יִם אֶל הָ/אָ֗רֶץ אֲשֶׁ֣ר נִ֠שְׁבַּעְתִּי לְ/אַבְרָהָ֨ם לְ/יִצְחָ֤ק וּֽ/לְ/יַעֲקֹב֙ לֵ/אמֹ֔ר לְ/זַרְעֲ/ךָ֖ אֶתְּנֶֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/001.yaml
  text: Then Yahweh said to Moses[a], “Go up from here, you and the people whom you brought up from the land of Egypt, to the land that I swore to Abraham, to Isaac, and to Jacob, saying[b], ‘I will give it to your offspring.’”
translation:
  language: id
  text: Kemudian Yahweh berfirman kepada Musa[a], “Pergilah dari sini dan naiklah, engkau dan bangsa yang kaubawa keluar dari tanah Mesir, menuju negeri yang telah Kujanjikan dengan sumpah kepada Abraham, Ishak, dan Yakub dengan berkata, ‘Kepada keturunanmu[b] akan Kuberikan negeri itu.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN”.'
    reason: alternative_reading
  - marker: b
    text: 'Secara harfiah, “benihmu”. Istilah Ibrani ini berbentuk tunggal dan dapat bermakna kolektif: keturunan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kemudian ... berfirman
  rationale: Waw konsekutif melanjutkan alur cerita. Dalam bahasa Indonesia Alkitabiah yang tetap modern, 'berfirman' merupakan pengantar langsung yang wajar ketika Allah menjadi subjek.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH, bukan menggantinya dengan gelar, sehingga nama perjanjian dalam teks Ibrani tetap tampak.
- source_word: לֵךְ עֲלֵה מִזֶּה
  choice: Pergilah dari sini
  rationale: Dua imperatif itu bersama-sama menyatakan perintah untuk berangkat dan bergerak menuju negeri yang dituju. Bahasa Indonesia tidak perlu memaksakan unsur harfiah 'naik' karena arah tujuan segera dinyatakan dengan 'menuju negeri'.
- source_word: אֲשֶׁר הֶעֱלִיתָ
  choice: yang kaubawa keluar
  rationale: Bentuk Hifil berarti menyebabkan atau membawa naik. Dalam konteks eksodus dari Mesir, 'kaubawa keluar' paling alami, sambil mempertahankan pernyataan yang menempatkan Musa sebagai pelaku langsung.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: dari tanah Mesir
  rationale: '''Tanah Mesir'' merupakan padanan langsung dan alami bagi frasa sumber.'
- source_word: אֶל הָאָרֶץ
  choice: menuju negeri
  rationale: Preposisi אֶל menunjukkan arah. 'Negeri' lebih alami daripada 'tanah' untuk wilayah yang dijanjikan, dan menghindari pengulangan yang kaku.
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי
  choice: yang telah Kujanjikan dengan sumpah
  rationale: Mengungkapkan secara jelas bahwa janji tersebut diteguhkan melalui sumpah, tanpa mengurangi kekuatan verba Ibrani.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: kepada Abraham, Ishak, dan Yakub
  rationale: Pengulangan preposisi Ibrani tidak perlu diulang dalam bahasa Indonesia; daftar ini tetap jelas dan khidmat.
- source_word: לֵאמֹר
  choice: dengan berkata
  rationale: Mempertahankan fungsi לֵאמֹר sebagai pengantar isi sumpah dan menjaga transparansi sintaksis.
- source_word: לְזַרְעֲךָ
  choice: kepada keturunanmu
  rationale: '''Keturunan'' merupakan istilah kolektif yang alami dalam bahasa Indonesia dan dapat mencakup satu garis keturunan atau para keturunan tanpa memaksakan bentuk jamak.'
- source_word: אֶתְּנֶנָּה
  choice: akan Kuberikan negeri itu
  rationale: Pronomina objek feminin tunggal merujuk kembali kepada negeri; penyebutan ulang 'negeri itu' membuat rujukannya jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama pribadi YHWH. Bentuk 'Yahweh' mempertahankan nama tersebut, sedangkan catatan kaki memberi tahu pembaca tentang bentuk tradisional.
- issue: Subjek yang membawa bangsa Israel keluar dari Mesir
  choice: 'Mempertahankan bentuk orang kedua: ''yang kaubawa keluar'''
  alternative: yang Kubawa keluar
  rationale: Teks Ibrani secara eksplisit memakai verba orang kedua tunggal dan mengalamatkannya kepada Musa. Ketegangan dengan ayat-ayat yang menyebut Yahweh sebagai pembebas tidak diselaraskan secara diam-diam.
- issue: Cakupan זֶרַע
  choice: keturunanmu
  alternative: benihmu / keturunan-keturunanmu
  rationale: Nomina Ibrani berbentuk tunggal kolektif. 'Keturunanmu' mempertahankan keluwesan antara makna kolektif dan bentuk gramatikal tunggal tanpa menetapkan tafsiran teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk terikat seperti 'kaubawa' dan 'Kuberikan' mengikuti ejaan baku serta mempertahankan kejelasan pelaku. Terjemahan mengutamakan kesepadanan optimal dengan menjaga nama ilahi, bentuk orang kedua yang ditujukan kepada Musa, dan ambiguitas kolektif זֶרַע.
