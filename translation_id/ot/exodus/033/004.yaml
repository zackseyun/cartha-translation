  yaml_path: translation/ot/exodus/033/004.yaml
  text: When the people heard this bad news[a], they mourned[b], and no man put on his ornaments.
translation:
  language: id
  text: Ketika bangsa itu mendengar kabar buruk ini[a], mereka berkabung, dan tidak seorang pun mengenakan perhiasannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “perkataan buruk ini” atau “hal buruk ini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע הָעָם
  choice: bangsa itu mendengar
  rationale: Subjek kolektif הָעָם menunjuk kepada umat Israel. 'Bangsa itu' alami dalam konteks ini, sementara bentuk verba tunggal Ibrani sesuai dengan subjek kolektif.
- source_word: הַדָּבָר הָרָע הַזֶּה
  choice: kabar buruk ini
  rationale: דָּבָר secara harfiah berarti 'perkataan/hal', tetapi di sini menunjuk kepada pemberitahuan yang baru disampaikan. 'Kabar buruk ini' menyampaikan fungsi ungkapan tersebut secara alami tanpa menghilangkan penilaian רָע.
- source_word: וַיִּתְאַבָּלוּ
  choice: mereka berkabung
  rationale: Bentuk hitpael dari אבל menyatakan masuk ke dalam keadaan berkabung, bukan sekadar merasa sedih.
- source_word: וְלֹא שָׁתוּ אִישׁ
  choice: dan tidak seorang pun mengenakan
  rationale: אִישׁ dipakai secara distributif, sehingga 'tidak seorang pun' mempertahankan penekanan bahwa masing-masing orang menahan diri. שׁית dalam konstruksi ini berarti menaruh atau mengenakan.
- source_word: עֶדְיוֹ עָלָיו
  choice: perhiasannya
  rationale: עֲדִי mencakup benda penghias atau perlengkapan berhias secara luas. Sufiks tunggal bersifat distributif; עָלָיו tercakup secara idiomatis dalam verba 'mengenakan'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. 'Berkabung' mempertahankan bobot tindakan ritual dan emosional; 'perhiasannya' cukup luas untuk berbagai benda penghias. Penanda catatan kaki [a] dicantumkan langsung setelah frasa terkait.
