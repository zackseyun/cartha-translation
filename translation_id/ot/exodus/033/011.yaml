source:
  edition: WLC
  text: וְ/דִבֶּ֨ר יְהוָ֤ה אֶל מֹשֶׁה֙ פָּנִ֣ים אֶל פָּנִ֔ים כַּ/אֲשֶׁ֛ר יְדַבֵּ֥ר אִ֖ישׁ אֶל רֵעֵ֑/הוּ וְ/שָׁב֙ אֶל הַֽ/מַּחֲנֶ֔ה וּ/מְשָׁ֨רְת֜/וֹ יְהוֹשֻׁ֤עַ בִּן נוּן֙ נַ֔עַר לֹ֥א יָמִ֖ישׁ מִ/תּ֥וֹךְ הָ/אֹֽהֶל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/011.yaml
  text: And Yahweh would speak to Moses face to face[a], as a man speaks to his friend. Then he would return to the camp, but his attendant Joshua son of Nun, a young man[b], would not depart from the midst of the tent.
translation:
  language: id
  text: Yahweh biasa berbicara kepada Musa muka dengan muka[a], seperti seseorang berbicara kepada sahabatnya. Kemudian Musa kembali ke perkemahan, tetapi pelayannya, Yosua anak Nun, seorang pemuda, tidak beranjak dari dalam kemah[b] itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “secara langsung” atau “secara pribadi.” Ungkapan Ibrani “muka dengan muka” menyatakan perjumpaan yang sangat langsung.
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah kemah pertemuan.
    reason: contextual_identification
lexical_decisions:
- source_word: וְדִבֶּר
  choice: biasa berbicara
  rationale: Bentuk verba ini dalam konteks menggambarkan tindakan yang berulang atau menjadi kebiasaan di kemah pertemuan; frasa 'biasa berbicara' menyampaikan aspek iteratif itu secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: פָּנִים אֶל־פָּנִים
  choice: dengan berhadapan muka
  rationale: Ungkapan Ibrani dipertahankan sedekat mungkin dalam bentuk yang dapat dipahami, untuk menyatakan komunikasi yang langsung dan pribadi tanpa menetapkan bahwa Musa melihat hakikat Allah secara harfiah.
- source_word: כַּאֲשֶׁר יְדַבֵּר אִישׁ אֶל־רֵעֵהוּ
  choice: seperti seseorang berbicara dengan sahabatnya
  rationale: '''Seseorang'' merupakan padanan Indonesia yang alami bagi איש dalam perbandingan umum ini, sedangkan ''sahabatnya'' menyampaikan kedekatan relasional dari רֵעֵהוּ.'
- source_word: וְשָׁב
  choice: Setelah itu, Musa kembali
  rationale: Subjek yang tersirat dijelaskan sebagai Musa agar rujukannya tidak rancu dalam bahasa Indonesia. Dalam rangkaian konteks, tindakan ini merupakan bagian dari pola yang berulang.
- source_word: הַמַּחֲנֶה
  choice: perkemahan
  rationale: Padanan lazim bagi perkemahan Israel dan lebih alami daripada sekadar 'kemah' untuk keseluruhan tempat berkemah.
- source_word: וּמְשָׁרְתוֹ
  choice: pembantunya
  rationale: Kata ini menunjukkan orang yang melayani dalam peran pendamping; 'pembantunya' jelas dan tidak menyiratkan perbudakan.
- source_word: יְהוֹשֻׁעַ בִּן־נוּן
  choice: Yosua anak Nun
  rationale: Mengikuti bentuk nama yang lazim dalam bahasa Indonesia dan mempertahankan patronimik Ibrani.
- source_word: נַעַר
  choice: seorang pemuda
  rationale: Kata tersebut dapat menunjuk orang muda atau pelayan muda; konteks sudah menyatakan peran pelayanan Yosua, sehingga 'seorang pemuda' tidak menggandakan nuansa itu.
- source_word: לֹא יָמִישׁ
  choice: tidak beranjak
  rationale: Ungkapan ini menyampaikan bahwa Yosua tidak meninggalkan atau menjauh dari tempat itu, sekaligus mempertahankan alur kebiasaan dalam konteks.
- source_word: מִתּוֹךְ הָאֹהֶל
  choice: dari dalam kemah itu
  rationale: Menyampaikan arti harfiah 'dari tengah/dalam kemah' secara alami; kata tunjuk merujuk kepada kemah pertemuan yang telah disebut dalam konteks.
theological_decisions:
- issue: Bahasa antropomorfis tentang Yahweh berbicara dengan Musa 'muka dengan muka'
  choice: Mempertahankan citra 'berhadapan muka' dalam teks utama sebagai perjumpaan dan komunikasi langsung secara pribadi.
  alternative: Menerjemahkannya hanya sebagai 'secara langsung' atau 'secara pribadi'.
  rationale: Ungkapan sumber sengaja menekankan kedekatan komunikasi. Terjemahan tidak menghapus ketegangan dengan ayat-ayat lain mengenai manusia yang tidak dapat melihat Allah, dan juga tidak memaksakan pengertian bahwa Musa melihat hakikat Allah secara harfiah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Aspek kebiasaan dinyatakan secara eksplisit pada verba pertama; kelanjutan ayat dipahami sebagai bagian dari pola yang sama. Penanda catatan kaki [b] ditempatkan pada 'kemah', sesuai isi catatannya.
