  text: וַ/יֹּאמַ֑ר הַרְאֵ֥/נִי נָ֖א אֶת כְּבֹדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/018.yaml
  text: Then he said[a], “Please show me your glory.”
translation:
  language: id
  text: Lalu ia berkata, “Tolong perlihatkan kemuliaan-Mu kepadaku.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “izinkan aku melihat kemegahan-Mu.” Kata kerja Ibrani secara harfiah berarti “buatlah aku melihat,” dan “kemuliaan” juga dapat menunjuk pada kemegahan atau kehormatan yang dinyatakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Lalu ia berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi. “Lalu” menyampaikan gerak berurutan itu secara wajar, sedangkan subjek orang ketiga tetap mengikuti konteks Ibrani tanpa menambahkan nama.
- source_word: הַרְאֵנִי
  choice: perlihatkan ... kepadaku
  rationale: Imperatif hifil dari ראה dengan sufiks orang pertama tunggal secara harfiah berarti “buatlah aku melihat.” “Perlihatkan ... kepadaku” menyampaikan makna kausatifnya dalam bahasa Indonesia yang alami.
- source_word: נָא
  choice: Tolong
  rationale: Partikel נָא menandai permohonan atau kesantunan. “Tolong” merupakan padanan modern yang jelas dan tidak memberi arti waktu seperti “sekarang.”
- source_word: אֶת
  choice: '[penanda objek langsung, tidak diterjemahkan]'
  rationale: אֶת menandai objek langsung definit dan tidak memerlukan kata tersendiri dalam bahasa Indonesia.
- source_word: כְּבֹדֶךָ
  choice: kemuliaan-Mu
  rationale: כָּבוֹד dapat berarti kemuliaan, kehormatan, atau kemegahan yang dinyatakan. Dalam permohonan Musa akan penyingkapan diri Allah, “kemuliaan-Mu” mempertahankan keluasan makna tersebut tanpa membatasinya pada cahaya yang terlihat.
theological_decisions:
- issue: Makna “kemuliaan-Mu” dalam permohonan Musa
  choice: kemuliaan-Mu
  alternative: kemegahan-Mu; kepenuhan hadirat-Mu
  rationale: Teks Ibrani tidak menetapkan secara khusus apakah Musa meminta untuk melihat cahaya yang tampak, keagungan ilahi, atau pernyataan hadirat Allah. “Kemuliaan-Mu” mempertahankan keluasan dan ketegangan teologis כָּבוֹד tanpa mempersempitnya secara tafsiran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hormat dan ringkas. “Tolong” menyatakan permohonan secara alami; kapital pada sufiks “-Mu” mengikuti kebiasaan ejaan bagi sapaan kepada Allah.
