  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָיָה֙ בַּ/עֲבֹ֣ר כְּבֹדִ֔/י וְ/שַׂמְתִּ֖י/ךָ בְּ/נִקְרַ֣ת הַ/צּ֑וּר וְ/שַׂכֹּתִ֥י כַפִּ֛/י עָלֶ֖י/ךָ עַד עָבְרִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/022.yaml
  text: And when my glory passes by[a], I will put you in a cleft of the rock, and I will cover you with my hand until I have passed by.
translation:
  language: id
  text: Ketika kemuliaan-Ku lewat, Aku akan menempatkan engkau di sebuah celah pada gunung batu itu[a] dan menudungi engkau dengan tangan-Ku sampai Aku lewat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “di celah pada gunung batu itu.” Dalam susunan Ibrani ini, “celah” dapat dipahami sebagai sebuah celah atau sebagai celah tertentu, sedangkan “gunung batu” jelas tertentu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּעֲבֹר
  choice: Ketika ... lewat
  rationale: Gabungan וְהָיָה dengan ב dan bentuk infinitif עָבַר memperkenalkan keadaan waktu. Ungkapan finite ini alami dalam bahasa Indonesia dan mempertahankan hubungan temporalnya.
- source_word: כְּבֹדִי
  choice: kemuliaan-Ku
  rationale: Dalam konteks penampakan ilahi, כָּבוֹד menunjuk pada kemuliaan Allah yang dinyatakan, bukan sekadar kehormatan atau nama baik.
- source_word: וְשַׂמְתִּיךָ
  choice: Aku akan menempatkan engkau
  rationale: שִׂים berarti menaruh atau menempatkan. Pilihan ini menyampaikan tindakan langsung Allah dengan bahasa Indonesia yang jelas dan bermartabat.
- source_word: בְּנִקְרַת הַצּוּר
  choice: di sebuah celah pada gunung batu itu
  rationale: נִקְרָה adalah celah atau rekahan, sedangkan הַצּוּר menunjuk pada gunung batu yang tentu dalam konteks. Kata 'sebuah' menyajikan konstruksi ini secara alami tanpa menghilangkan ketentuan pada 'gunung batu itu'.
- source_word: וְשַׂכֹּתִי
  choice: dan menudungi
  rationale: סכך menyatakan tindakan menutupi atau melindungi. 'Menudungi' mempertahankan gambaran konkret dan sesuai dengan frasa berikutnya, 'dengan tangan-Ku'.
- source_word: כַּפִּי
  choice: tangan-Ku
  rationale: כַּף dapat berarti telapak tangan, tetapi 'tangan-Ku' merupakan padanan Indonesia yang alami bagi gambaran antropomorfis ini tanpa mempersempit anatominya secara berlebihan.
- source_word: עָלֶיךָ
  choice: engkau
  rationale: Makna preposisi עַל tercakup secara idiomatis dalam verba 'menudungi engkau'; menerjemahkannya lagi sebagai 'di atas engkau' akan terasa kaku.
- source_word: עַד עָבְרִי
  choice: sampai Aku lewat
  rationale: עַד dengan infinitif bersufiks orang pertama menandai batas waktu tindakan menudungi. Padanan ini jelas dan alami, sekaligus tidak menambahkan aspek yang lebih tegas daripada bentuk Ibraninya.
theological_decisions:
- issue: Bahasa antropomorfis tentang Allah ('tangan-Ku')
  choice: Mempertahankan ungkapan konkret 'tangan-Ku' dalam teks utama.
  alternative: perlindungan-Ku; kuasa-Ku
  rationale: Teks Ibrani secara langsung memakai gambaran anggota tubuh. Mempertahankannya menjaga daya naratif penampakan ilahi dan tidak mengubah metafora menjadi penjelasan teologis abstrak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Engkau' dipakai untuk sapaan tunggal dalam konteks ilahi; kapitalisasi pronomina yang merujuk kepada Allah mengikuti gaya naskah. Gambaran konkret tentang kemuliaan, gunung batu, dan tangan dipertahankan.
