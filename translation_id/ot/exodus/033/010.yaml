base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/010.yaml
  text: When all the people saw the pillar of cloud standing at the entrance of the tent[a], all the people rose and worshiped, each man at the entrance of his tent.
translation:
  language: id
  text: Ketika seluruh umat melihat tiang awan berdiri di pintu kemah, mereka semua bangkit lalu sujud menyembah[a], masing-masing di pintu kemahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membungkukkan diri” atau “merebahkan diri”; kata kerja Ibrani menunjuk pada tindakan jasmani untuk menyatakan hormat dan sering berfungsi sebagai tindakan ibadah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: Ketika ... melihat
  rationale: Bentuk naratif dengan waw melanjutkan rangkaian peristiwa; konstruksi temporal ini secara alami menghubungkan penglihatan umat dengan tindakan mereka sesudahnya.
- source_word: כָל הָעָם
  choice: seluruh umat / mereka semua
  rationale: Frasa ini menunjuk secara kolektif kepada komunitas Israel. 'Umat' wajar dalam konteks komunitas perjanjian tanpa menambahkan 'Israel', yang tidak eksplisit dalam ayat ini; pengulangan kedua dibuat pronominal agar alami sambil mempertahankan cakupan keseluruhan.
- source_word: עַמּוּד הֶעָנָן
  choice: tiang awan
  rationale: Padanan langsung dan lazim yang mempertahankan gambaran konkret tanda kehadiran ilahi.
- source_word: עֹמֵד
  choice: berdiri
  rationale: Partisip ini menggambarkan posisi tiang awan secara visual dan paling langsung diterjemahkan 'berdiri'.
- source_word: פֶּתַח הָאֹהֶל
  choice: di pintu kemah
  rationale: פֶּתַח berarti bukaan atau jalan masuk. 'Pintu kemah' ringkas dan alami; 'kemah' dipertahankan tanpa memperluasnya menjadi 'Kemah Pertemuan' karena sebutan lengkap itu tidak terdapat dalam ayat ini.
- source_word: וְקָם
  choice: bangkit
  rationale: Kata ini menyatakan tindakan berdiri sebagai tanggapan terhadap apa yang dilihat; 'bangkit' memiliki ragam bahasa naratif yang wajar dan bermartabat.
- source_word: וְהִשְׁתַּחֲווּ
  choice: sujud menyembah
  rationale: Verba ini menyatakan tindakan membungkuk atau merebahkan diri sebagai penghormatan dan, dalam konteks ini, sebagai ibadah. Gabungan 'sujud menyembah' mempertahankan baik unsur jasmani maupun makna religiusnya.
- source_word: אִישׁ
  choice: masing-masing
  rationale: Nomina maskulin tunggal dipakai secara distributif. Dalam bahasa Indonesia, 'masing-masing' secara tepat mempertahankan fungsi distributif tanpa memaksakan penandaan gender yang tidak diperlukan secara gramatikal.
- source_word: פֶּתַח אָהֳלוֹ
  choice: di pintu kemahnya
  rationale: Terjemahan ini mempertahankan pengulangan gambaran pintu kemah dan sufiks posesif tunggal yang didistribusikan kepada setiap orang.
theological_decisions:
- issue: Makna respons umat terhadap tanda nyata kehadiran ilahi
  choice: sujud menyembah
  alternative: membungkukkan diri; merebahkan diri
  rationale: Kata Ibrani menggambarkan gerak tubuh merendahkan diri sekaligus, dalam konteks ini, tindakan ibadah kepada TUHAN. 'Sujud menyembah' menjaga kedua dimensinya tanpa mengurangi tindakan itu menjadi sikap tubuh semata atau menghilangkan unsur fisiknya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang jelas dan bermartabat. Struktur dibuat alami bagi pembaca umum, sedangkan pengulangan, gambaran konkret, dan nuansa tindakan penghormatan dalam teks Ibrani tetap dipertahankan.
