  text: וַ/יֹּאמַ֑ר פָּנַ֥/י יֵלֵ֖כוּ וַ/הֲנִחֹ֥תִי לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/014.yaml
  text: And he said[a], “My presence will go, and I will give you rest.”
translation:
  language: id
  text: Lalu Dia berkata, “Kehadiran-Ku akan menyertaimu,[a] dan Aku akan memberimu istirahat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Wajah-Ku akan pergi.” Ungkapan ini berarti “Kehadiran-Ku akan pergi,” yaitu TUHAN sendiri akan hadir dan menyertai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Lalu Dia berkata
  rationale: Bentuk wayyiqtol dari אמר melanjutkan alur narasi dan memperkenalkan perkataan langsung; “lalu” alami dalam bahasa Indonesia tanpa menambahkan urutan waktu yang terlalu tegas.
- source_word: פָּנַי
  choice: Kehadiran-Ku
  rationale: Secara harfiah berarti “wajah-Ku”, tetapi dalam ungkapan ini menunjuk pada kehadiran pribadi TUHAN. Pilihan ini alami dalam bahasa Indonesia, sedangkan gambaran harfiahnya dipertahankan dalam catatan kaki.
- source_word: יֵלֵכוּ
  choice: akan menyertaimu
  rationale: Secara leksikal berarti “akan pergi”. Dalam konteks jawaban kepada Musa tentang perjalanan umat, “akan menyertaimu” menyampaikan maksud bahwa kehadiran TUHAN sendiri akan berjalan bersama Musa, sekaligus membuat sasaran tersiratnya jelas dalam bahasa Indonesia.
- source_word: וַהֲנִחֹתִי
  choice: dan Aku akan memberikan ketenangan
  rationale: Bentuk hifil dari נוח menyatakan tindakan menyebabkan seseorang beristirahat atau memberinya ketenangan. “Memberikan ketenangan” mempertahankan nuansa kausatif dan cocok dengan konteks jaminan ilahi.
- source_word: לָךְ
  choice: kepadamu
  rationale: Akhiran pronominal orang kedua tunggal maskulin merujuk langsung kepada Musa; bentuk “kepadamu” mempertahankan bentuk tunggal dan relasi gramatikalnya.
theological_decisions:
- issue: Ungkapan antropomorfis פָּנַי
  choice: Kehadiran-Ku
  alternative: Wajah-Ku; Aku sendiri
  rationale: Bahasa Ibrani memakai “wajah” untuk menyatakan kehadiran pribadi TUHAN. “Kehadiran-Ku” menyampaikan makna idiomatis tanpa mengubahnya menjadi gagasan abstrak semata; gambaran “wajah” tetap dicatat.
- issue: Sasaran penyertaan dan ketenangan dalam bentuk tunggal לָךְ
  choice: menyertaimu ... kepadamu
  alternative: menyertai kalian ... memberi kalian ketenangan
  rationale: Teks Ibrani menggunakan bentuk orang kedua tunggal yang ditujukan kepada Musa. Terjemahan mempertahankan bentuk tunggal dan tidak diam-diam mengalihkannya kepada seluruh umat, meskipun konteks yang lebih luas menyangkut Israel.
- issue: Cakupan makna וַהֲנִחֹתִי
  choice: Aku akan memberikan ketenangan kepadamu
  alternative: Aku akan membawa engkau ke tempat perhentian; Aku akan membuatmu beristirahat
  rationale: Kata kerja dapat menunjuk pada pemberian istirahat, ketenteraman, atau membawa ke keadaan/tempat perhentian. Pilihan “memberikan ketenangan” mempertahankan keluasan makna tanpa menetapkan secara sempit apakah yang dimaksud hanya istirahat perjalanan atau tempat tujuan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi digunakan secara konsisten. “Ketenangan” dipilih daripada “istirahat” agar mencakup nuansa aman dan tenteram, tetapi tidak menghilangkan kemungkinan makna perhentian.
