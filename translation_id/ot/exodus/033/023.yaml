  text: Then I will remove my hand[a], and you will see my back, but my face shall not be seen.
translation:
  language: id
  text: Kemudian Aku akan menyingkirkan tangan-Ku, dan engkau akan melihat belakang-Ku[a], tetapi wajah-Ku tidak akan terlihat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “punggung-Ku” atau “apa yang ada di belakang-Ku.” Istilah Ibrani ini dapat menunjuk pada punggung atau bagian yang di belakang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲסִרֹתִי
  choice: Kemudian Aku akan menarik
  rationale: Bentuk kausatif dari סור menyatakan tindakan menyingkirkan atau menarik kembali. 'Kemudian' meneruskan urutan dari ayat sebelumnya, sedangkan 'menarik tangan-Ku' terdengar alami dalam bahasa Indonesia.
- source_word: כַּפִּי
  choice: tangan-Ku
  rationale: כַּף dapat berarti telapak tangan atau tangan. Dalam gambaran perlindungan pada konteks sebelumnya, 'tangan' paling alami tanpa menghilangkan bahasa antropomorfis teks.
- source_word: וְרָאִיתָ
  choice: dan engkau akan melihat
  rationale: Dalam rangkaian konteks mendatang, bentuk ini menyatakan hasil berikutnya. 'Engkau' mempertahankan sapaan tunggal kepada Musa dan cocok dengan ragam khidmat.
- source_word: אֲחֹרַי
  choice: bagian belakang-Ku
  rationale: Istilah ini dapat menunjuk pada punggung, bagian belakang, atau apa yang berada di belakang. 'Bagian belakang-Ku' mempertahankan keluasan makna lebih baik daripada hanya 'punggung-Ku'.
- source_word: וּפָנַי
  choice: tetapi wajah-Ku
  rationale: Waw dipahami secara adversatif karena klausa ini mengontraskan apa yang dapat dilihat dengan apa yang tidak dapat dilihat. 'Wajah' adalah padanan langsung dan mempertahankan gambaran konkret.
- source_word: לֹא יֵרָאוּ
  choice: tidak akan terlihat
  rationale: Bentuk nifal dari ראה bersifat pasif, yakni 'terlihat' atau 'dilihat', bukan 'melihat'. Terjemahan ini mempertahankan bentuk pasif tanpa menambahkan pelaku.
theological_decisions:
- issue: Bahasa antropomorfis tentang Allah
  choice: Mempertahankan istilah konkret 'tangan', 'bagian belakang', dan 'wajah'.
  alternative: Menggantinya dengan ungkapan abstrak seperti 'hadirat' atau 'jejak kemuliaan'.
  rationale: Teks Ibrani sendiri memakai gambaran tubuh. Terjemahan tidak boleh melunakkan gambaran itu atau menyelesaikan ketegangan teologisnya dengan memasukkan penjelasan metafisik.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi mengikuti kelaziman penerbitan Alkitab Indonesia. Struktur kalimat mempertahankan kontras dan urutan teks Ibrani, sementara 'bagian belakang-Ku' dipilih untuk menjaga ambiguitas leksikal.
