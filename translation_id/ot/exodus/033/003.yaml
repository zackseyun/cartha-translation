base_translation:
  language: en
  yaml_path: translation/ot/exodus/033/003.yaml
  text: to a land flowing with milk and honey[a]. For I will not go up in your midst, because you are a stiff-necked people[b], lest I consume you on the way.
translation:
  language: id
  text: ke suatu negeri yang berlimpah susu dan madu. Sebab Aku tidak akan ikut naik di tengah-tengahmu[a], karena engkau adalah bangsa yang tegar tengkuk, jangan sampai Aku membinasakanmu[b] di perjalanan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di antaramu” atau “bersamamu.”
    reason: lexical_alternative
  - marker: b
    text: Atau “menghabisimu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל אֶרֶץ
  choice: ke suatu negeri
  rationale: אֶל menyatakan arah, sedangkan אֶרֶץ tanpa artikel dapat diterjemahkan secara wajar sebagai 'suatu negeri', meskipun konteksnya menunjuk kepada negeri yang telah dijanjikan.
- source_word: זָבַת חָלָב וּדְבָשׁ
  choice: yang berlimpah susu dan madu
  rationale: Ungkapan ini melukiskan kesuburan dan kelimpahan. 'Berlimpah' menyampaikan maksud idiom Ibrani secara alami dalam bahasa Indonesia tanpa menghilangkan citranya.
- source_word: כִּי לֹא אֶעֱלֶה
  choice: Namun, Aku tidak akan berjalan naik
  rationale: כִּי di sini dapat mengantar penjelasan yang sekaligus berlawanan dengan janji negeri yang baik. 'Namun' membuat kontras itu alami, sementara 'berjalan naik' mempertahankan verba עלה dan gagasan perjalanan menuju negeri tersebut.
- source_word: בְּקִרְבְּךָ
  choice: di tengah-tengahmu
  rationale: Terjemahan ini mempertahankan nuansa spasial dan kehadiran ilahi di dalam komunitas Israel; akhiran tunggal menyapa Israel secara kolektif.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: bangsa yang tegar tengkuk
  rationale: '''Tegar tengkuk'' mempertahankan metafora Ibrani tentang sikap keras kepala dan tidak mau tunduk. ''Bangsa'' sesuai untuk Israel sebagai satu kelompok kolektif.'
- source_word: פֶּן
  choice: jangan sampai
  rationale: פֶּן memperkenalkan akibat yang dikhawatirkan atau hendak dihindari; 'jangan sampai' jelas dan alami dalam bahasa Indonesia modern.
- source_word: אֲכֶלְךָ
  choice: Aku membinasakanmu
  rationale: Bentuk Piel dari כלה berarti menghabiskan, mengakhiri, atau membinasakan. 'Membinasakan' menyatakan beratnya hukuman dengan wajar, sementara alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: בַּדָּרֶךְ
  choice: di perjalanan
  rationale: Frasa ini menunjuk kepada masa atau rute perjalanan menuju negeri itu; 'di perjalanan' ringkas dan idiomatis.
theological_decisions:
- issue: Pernyataan tentang kehadiran Allah
  choice: Aku tidak akan berjalan naik di tengah-tengahmu
  alternative: Aku tidak akan berjalan naik bersamamu / di antaramu
  rationale: '''Di tengah-tengahmu'' menjaga tekanan bahwa kehadiran Allah yang kudus di tengah umat yang memberontak mendatangkan bahaya, bukan sekadar persoalan pendampingan.'
- issue: Beratnya penghakiman dalam אֲכֶלְךָ
  choice: Aku membinasakanmu
  alternative: Aku menghabisimu
  rationale: Terjemahan ini mempertahankan kemungkinan bahwa kekudusan Allah akan mengakhiri keberadaan Israel dalam perjalanan, tanpa menentukan cara penghukuman yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan tunggal 'engkau/-mu' dipertahankan karena Israel diperlakukan sebagai satu kesatuan kolektif. Metafora 'tegar tengkuk' dipertahankan karena masih dapat dipahami dan penting bagi citra teks.
