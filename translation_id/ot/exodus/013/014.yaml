base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/014.yaml
  text: And when your son asks you in time to come, saying, ‘What is this?’ then you shall say to him, ‘By a mighty hand the LORD brought us out from Egypt, from the house of servants.’
translation:
  language: id
  text: Apabila kelak anakmu bertanya kepadamu, ‘Apa ini?’ katakanlah kepadanya, ‘Dengan tangan yang kuat TUHAN membawa kita keluar dari Mesir, dari rumah perbudakan.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָחָר
  choice: kelak
  rationale: Dalam konteks pengajaran kepada generasi berikutnya, kata ini menunjuk pada waktu mendatang, bukan secara harfiah hanya ‘besok’.
- source_word: מַה זֹּאת
  choice: Apakah arti semua ini?
  rationale: Pertanyaan tersebut menanyakan makna atau tujuan ibadah/tindakan yang sedang dibicarakan; ‘semua ini’ terdengar alami dalam bahasa Indonesia sambil mempertahankan rujukan yang bergantung pada konteks.
- source_word: בְּחֹזֶק יָד
  choice: Dengan tangan yang kuat
  rationale: Mempertahankan metafora Ibrani tentang kuasa yang dikerahkan tanpa mengubahnya menjadi ungkapan abstrak.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia untuk menandai nama ilahi YHWH dengan huruf kapital.
- source_word: מִבֵּית עֲבָדִים
  choice: dari rumah perbudakan
  rationale: Ungkapan idiomatis ini menggambarkan Mesir sebagai tempat atau keadaan perbudakan; pilihan ini alami dan tetap dekat dengan bentuk Ibrani.
theological_decisions:
- issue: Identifikasi antargenerasi dalam kata ganti orang pertama jamak הוֹצִיאָנוּ
  choice: membawa kita keluar
  alternative: membawa kami keluar
  rationale: ‘Kita’ mempertahankan cara teks memasukkan generasi kemudian ke dalam identitas umat yang dibebaskan, tanpa menjelaskan lebih jauh bagaimana partisipasi itu dipahami.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan dibuat alami bagi pembaca umum, sementara metafora ‘tangan yang kuat’ dan ‘rumah perbudakan’ dipertahankan.
