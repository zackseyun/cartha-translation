  text: וַ/יְהִ֗י בְּ/שַׁלַּ֣ח פַּרְעֹה֮ אֶת הָ/עָם֒ וְ/לֹא נָחָ֣/ם אֱלֹהִ֗ים דֶּ֚רֶךְ אֶ֣רֶץ פְּלִשְׁתִּ֔ים כִּ֥י קָר֖וֹב ה֑וּא כִּ֣י אָמַ֣ר אֱלֹהִ֗ים פֶּֽן יִנָּחֵ֥ם הָ/עָ֛ם בִּ/רְאֹתָ֥/ם מִלְחָמָ֖ה וְ/שָׁ֥בוּ מִצְרָֽיְמָ/ה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/017.yaml
  text: When Pharaoh let the people go[a], God did not lead them by the way of the land of the Philistines, though it was near; for God said[b], “Lest the people change their minds when they see war and return to Egypt.”
translation:
  language: id
  text: Ketika Firaun membiarkan bangsa itu pergi, Allah tidak menuntun mereka melalui jalan di negeri orang Filistin, meskipun jalan itu dekat.[a] Sebab Allah berfirman, “Jangan sampai bangsa itu berubah pikiran ketika melihat peperangan, lalu kembali ke Mesir.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani yang diterjemahkan “meskipun jalan itu dekat” juga dapat diterjemahkan “karena jalan itu dekat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׁלַּח
  choice: Ketika Firaun membiarkan bangsa itu pergi
  rationale: Infinitif konstruk dengan בְּ menyatakan keadaan temporal. Dalam konteks keluaran, שׁלח berarti membiarkan atau melepaskan bangsa itu pergi.
- source_word: נָחָם
  choice: menuntun
  rationale: Kata נחה berarti memimpin atau menuntun; bentuk ini cocok dengan konteks perjalanan dan pemilihan rute.
- source_word: דֶּרֶךְ אֶרֶץ פְּלִשְׁתִּים
  choice: melalui jalan di negeri orang Filistin
  rationale: Ungkapan ini menunjuk pada jalan atau rute yang melewati wilayah orang Filistin, sambil mempertahankan penyebutan kelompok bangsa dalam teks Ibrani.
- source_word: כִּי קָרוֹב הוּא
  choice: meskipun jalan itu dekat
  rationale: כִּי dapat dipahami secara kausal atau konsesif. Dalam konteks ini, pembacaan konsesif menyampaikan bahwa Allah tidak memilih rute itu walaupun dekat.
- source_word: פֶּן
  choice: Jangan sampai
  rationale: פֶּן memperkenalkan akibat yang dikhawatirkan atau hendak dicegah; 'jangan sampai' alami dan jelas dalam bahasa Indonesia modern.
- source_word: יִנָּחֵם
  choice: berubah pikiran
  rationale: Nifal נחם di sini menunjuk pada perubahan pikiran atau keputusan saat menghadapi perang, bukan pertobatan moral.
- source_word: בִּרְאֹתָם מִלְחָמָה
  choice: ketika melihat peperangan
  rationale: Infinitif dengan בְּ menyatakan keadaan temporal, sedangkan מִלְחָמָה dapat berarti perang atau pertempuran; 'peperangan' sesuai dengan ancaman konflik bersenjata secara umum.
- source_word: וְשָׁבוּ מִצְרָיְמָה
  choice: lalu kembali ke Mesir
  rationale: שׁוב berarti kembali, dan akhiran lokatif pada מִצְרַיִם menunjukkan arah menuju Mesir.
theological_decisions:
- issue: Alasan ilahi untuk menghindari rute melalui negeri orang Filistin
  choice: Ayat ini menyatakan bahwa Allah memilih rute dengan mempertimbangkan kemungkinan bangsa itu berubah pikiran ketika menghadapi perang.
  alternative: Menganggap alasan tersebut sebagai dugaan narator atau menyimpulkan bahwa Allah secara reaktif mengubah rencana.
  rationale: Klausa 'Allah berfirman' menyajikan alasan itu sebagai alasan Allah sendiri. Terjemahan mempertahankan pernyataan teks tanpa menambahkan kesimpulan doktrinal mengenai pengetahuan atau providensi Allah.
- issue: Hubungan logis כִּי קָרוֹב הוּא
  choice: meskipun jalan itu dekat
  alternative: karena jalan itu dekat
  rationale: 'Nilai konsesif menghasilkan hubungan konteks yang paling wajar: rute tersebut dekat, tetapi Allah tidak membawa bangsa itu melaluinya. Kemungkinan kausal tetap dicatat dalam catatan kaki.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Bangsa itu' mempertahankan nomina kolektif הָעָם; 'berubah pikiran' menghindari kesan pertobatan moral. Penanda catatan kaki ditempatkan pada akhir ayat karena catatan menjelaskan klausa sebelumnya.
