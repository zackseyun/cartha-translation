base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/007.yaml
  text: Unleavened bread shall be eaten throughout the seven days[a], and no leaven shall be seen with you[b], and no yeast shall be seen with you within all your territory.
translation:
  language: id
  text: Selama tujuh hari itu, roti tidak beragi harus dimakan. Apa pun yang beragi tidak boleh ada padamu[a], dan ragi pun tidak boleh ada padamu di seluruh wilayahmu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak boleh terlihat padamu.” Ungkapan ini menyatakan bahwa apa pun yang beragi tidak boleh berada dalam kepemilikan atau lingkunganmu.
    reason: lexical_alternative
  - marker: b
    text: “Apa pun yang beragi” menerjemahkan חָמֵץ, yaitu sesuatu yang telah beragi, sedangkan “ragi” menerjemahkan שְׂאֹר, yaitu bahan atau biang peraginya.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַצּוֹת
  choice: roti tidak beragi
  rationale: Dalam konteks Paskah, kata ini menunjuk pada roti yang dibuat tanpa ragi. Ungkapan ini jelas bagi pembaca Indonesia dan mempertahankan makna ritualnya.
- source_word: יֵאָכֵל
  choice: harus dimakan
  rationale: Bentuk nifal memberi makna pasif. Kata 'harus' menyampaikan daya ketentuan hukum secara wajar tanpa mengubahnya menjadi perintah aktif.
- source_word: אֵת שִׁבְעַת הַיָּמִים
  choice: sepanjang tujuh hari itu
  rationale: Akusatif durasi mencakup seluruh rentang tujuh hari; 'sepanjang' mempertahankan cakupan penuh tersebut.
- source_word: יֵרָאֶה לְךָ
  choice: tidak boleh terlihat di tempatmu
  rationale: Terjemahan ini mempertahankan gambaran harfiah 'terlihat' sambil memakai 'di tempatmu' untuk menyampaikan bahwa benda itu tidak boleh berada dalam kepemilikan atau lingkungan orang yang disapa.
- source_word: חָמֵץ
  choice: apa pun yang beragi
  rationale: Kata ini dapat menunjuk secara luas pada sesuatu yang telah beragi, bukan hanya bahan peraginya; pilihan ini mempertahankan perbedaannya dari שְׂאֹר.
- source_word: שְׂאֹר
  choice: ragi
  rationale: Kata ini lebih khusus menunjuk pada bahan atau biang yang menyebabkan fermentasi. 'Ragi' merupakan padanan Indonesia yang alami dan mudah dipahami.
- source_word: בְּכָל גְּבֻלֶךָ
  choice: di seluruh wilayahmu
  rationale: Ungkapan ini menunjuk pada seluruh daerah dalam batas kekuasaan atau tempat tinggal orang yang disapa, bukan sekadar garis perbatasannya.
