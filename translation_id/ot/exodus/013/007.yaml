  rationale: Revisi mengganti “terlihat di tempatmu” dengan “tidak boleh ada padamu,” yang lebih idiomatis dalam Bahasa Indonesia dan lebih tepat menyampaikan daya idiomatik יֵרָאֶה לְךָ. Catatan kaki mempertahankan bentuk harfiah “terlihat padamu,” sehingga kedekatan dengan teks Ibrani tetap transparan. Pembedaan antara חָמֵץ dan שְׂאֹר serta susunan dua larangan dipertahankan.
