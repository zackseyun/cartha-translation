  yaml_path: translation/ot/exodus/013/006.yaml
  text: For seven days you shall eat unleavened bread[b][a], and on the seventh day there shall be a feast to Yahweh.
translation:
  language: id
  text: Selama tujuh hari kamu harus makan roti tidak beragi, dan pada hari ketujuh ada perayaan[a] bagi Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: hari raya.'
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN”.'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Selama tujuh hari
  rationale: Frasa konstruksi ini menyatakan jangka waktu. Kata “selama” membuat fungsi duratifnya jelas dan alami dalam bahasa Indonesia.
- source_word: תֹּאכַל
  choice: kamu harus makan
  rationale: Bentuk imperfek Qal orang kedua tunggal maskulin berfungsi sebagai perintah dalam konteks ketetapan. “Harus makan” menyampaikan daya direktifnya secara wajar dalam bahasa Indonesia modern.
- source_word: מַצֹּת
  choice: roti tidak beragi
  rationale: Dalam konteks Paskah dan Hari Raya Roti Tidak Beragi, kata ini menunjuk pada roti yang dibuat tanpa ragi. Ungkapan ini jelas dan sudah lazim dalam bahasa Indonesia.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: dan pada hari ketujuh
  rationale: Waw diterjemahkan sebagai penghubung sederhana “dan”, sedangkan frasa berpreposisi menandai waktu.
- source_word: חַג
  choice: perayaan
  rationale: Kata ini menunjuk pada perayaan keagamaan atau hari raya. “Perayaan” alami dalam konstruksi klausa ini, sementara “hari raya” dicatat sebagai alternatif.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: 'Preposisi ל menyatakan peruntukan atau hubungan: perayaan itu dipersembahkan atau diselenggarakan bagi YHWH. “Bagi” menyampaikan nuansa tersebut dengan alami.'
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani secara langsung memakai Tetragramaton YHWH. Bentuk “Yahweh” mempertahankan nama perjanjian itu, sedangkan bentuk tradisional “TUHAN” dicatat dalam catatan kaki.
- issue: Klausa nominal חַג לַיהוָה
  choice: harus ada perayaan bagi Yahweh
  alternative: hari ketujuh adalah hari raya bagi Yahweh
  rationale: Bahasa Ibrani tidak menyertakan verba eksplisit. Rumusan “harus ada” mempertahankan daya instruksional konteks tanpa menentukan secara berlebihan apakah חַג merupakan predikat identitas atau perintah untuk mengadakan perayaan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada instruksional yang khidmat. Kata ganti “kamu” mempertahankan bentuk orang kedua tunggal sumber tanpa menambahkan penanda gender. Klausa nominal Ibrani dibuat alami dengan “harus ada”, tetapi ketegangan antara keadaan dan kewajiban tetap dipertahankan.
