  text: Consecrate to me every firstborn[a], the first to open every womb among the sons of Israel, among man and among beast; it is mine.
translation:
  language: id
  text: “Kuduskanlah bagi-Ku setiap anak sulung, yaitu setiap yang pertama membuka rahim di kalangan orang Israel, baik pada manusia maupun pada hewan; itu milik-Ku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קַדֶּשׁ
  choice: Kuduskanlah
  rationale: Bentuk imperatif ini memerintahkan agar anak sulung dikhususkan bagi Allah sebagai kudus. ‘Kuduskanlah’ mempertahankan daya kultis istilah Ibrani dan tetap wajar dalam ragam Alkitab Indonesia.
- source_word: לִי
  choice: bagi-Ku
  rationale: Preposisi ל menandai pengkhususan atau penyerahan kepada Allah. ‘Bagi-Ku’ alami sesudah ‘Kuduskanlah’ dan menyatakan arah serta tujuan pengkhususan itu.
- source_word: כָל בְּכוֹר
  choice: setiap anak sulung
  rationale: בכור berarti ‘yang sulung/anak sulung’. Teks tidak menyebut ‘laki-laki’ secara eksplisit, sehingga unsur itu tidak ditambahkan.
- source_word: פֶּטֶר כָּל רֶחֶם
  choice: yang pertama membuka setiap rahim
  rationale: Frasa ini menjelaskan anak sulung sebagai yang pertama keluar dan dengan demikian membuka rahim. Terjemahan mempertahankan gambaran tubuh serta hubungan penjelasnya.
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: di antara keturunan Israel
  rationale: Secara harfiah ‘di antara anak-anak lelaki Israel’, tetapi frasa tersebut berfungsi sebagai sebutan kolektif bagi umat Israel. ‘Keturunan Israel’ alami, bermartabat, dan tidak menyiratkan bahwa hanya anggota umat yang laki-laki dimaksud.
- source_word: בָּאָדָם
  choice: manusia
  rationale: אָדָם di sini merupakan nomina kolektif yang menunjuk golongan manusia dalam pertentangan dengan hewan, bukan seorang laki-laki tertentu.
- source_word: וּבַבְּהֵמָה
  choice: maupun hewan
  rationale: בְּהֵמָה adalah nomina kolektif bagi hewan, sering kali hewan ternak dalam konteks hukum. ‘Hewan’ mempertahankan cakupan leksikal tanpa mempersempitnya menjadi ternak.
- source_word: לִי הוּא
  choice: ia adalah milik-Ku
  rationale: Klausa penutup menegaskan kepemilikan Allah. ‘Ia adalah milik-Ku’ ringkas dan mempertahankan pronomina tunggal Ibrani yang merujuk distributif kepada setiap anak sulung.
theological_decisions:
- issue: Cakupan anak sulung dan ketiadaan penanda jenis kelamin eksplisit
  choice: setiap anak sulung
  alternative: setiap anak sulung laki-laki
  rationale: Walaupun hukum dalam konteks selanjutnya berkenaan dengan anak sulung jantan, ayat ini tidak menambahkan kata ‘laki-laki/jantan’. Terjemahan tidak memasukkan pembatas yang tidak dinyatakan di sini.
- issue: Pemakaian kolektif אָדָם dalam kontras dengan בְּהֵמָה
  choice: manusia
  alternative: orang
  rationale: אָדָם menunjuk kategori manusia secara kolektif dan dipertentangkan dengan kategori hewan. ‘Manusia’ mempertahankan kontras itu tanpa mengubahnya menjadi rujukan khusus kepada laki-laki.
- issue: Hubungan frasa pembuka rahim dengan ‘anak sulung’
  choice: 'dipertahankan sebagai frasa penjelas: ‘yaitu yang pertama membuka setiap rahim’'
  alternative: digabungkan menjadi ‘setiap yang pertama lahir dari rahim’
  rationale: Susunan penjelas mempertahankan ketegangan dan gambaran ungkapan Ibrani, sekaligus menjelaskan cakupan ‘anak sulung’ tanpa menambahkan tafsiran teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada perintah ilahi yang khidmat. ‘Kuduskanlah’ dipilih untuk mempertahankan nuansa sakral; ‘keturunan Israel’ digunakan sebagai padanan kolektif yang alami. Tidak diperlukan catatan kaki karena alternatif penting dapat ditangani secara tepat dalam teks utama.
