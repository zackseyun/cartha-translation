  verdict: revise
  source_fidelity: 'Secara umum setia pada Ibrani: imperatif קַדֶּשׁ, dedikasi bagi Allah, ‘setiap anak sulung’, serta kontras kolektif manusia/hewan dipertahankan tanpa menambahkan ‘laki-laki’. Namun, susunan ‘di antara keturunan Israel, baik manusia maupun hewan’ tidak menandai hubungan sintaktis yang jelas antara ‘keturunan Israel’ dan hewan, padahal בני ישראל menetapkan lingkup umat Israel bagi kedua kategori tersebut.'
  naturalness: ‘Kuduskanlah bagi-Ku’ dan ‘milik-Ku’ cocok untuk bahasa Indonesia baku bernada Alkitab. Frasa ‘di antara keturunan Israel, baik manusia maupun hewan’ kurang idiomatis dan dapat terbaca seolah-olah hewan merupakan bagian dari ‘keturunan Israel’. ‘Di kalangan orang Israel, baik pada manusia maupun pada hewan’ menyatakan lingkup dan kontras kategori dengan lebih jelas.
  terminology: ‘Kuduskanlah’, ‘anak sulung’, ‘rahim’, ‘manusia’, dan ‘hewan’ tepat. ‘Orang Israel’ lebih alami daripada ‘keturunan Israel’ dalam konstruksi ini dan tetap mewakili בני ישראל sebagai sebutan kolektif. Pronomina penutup sebaiknya ‘itu’ karena yang dirujuk ialah setiap anak sulung secara distributif, termasuk manusia dan hewan.
  issues:
  - severity: medium
    issue: Lingkup ‘keturunan Israel’ dan pasangan ‘manusia maupun hewan’ kurang jelas
    rationale: Dalam teks Ibrani, ‘di antara בני ישראל’ membingkai kategori manusia dan hewan. Dalam draf, ‘hewan’ setelah ‘keturunan Israel’ dapat menimbulkan kesan kategoris yang tidak wajar. Penataan ulang diperlukan agar hewan dipahami sebagai hewan dalam lingkup orang Israel, bukan sebagai keturunan Israel.
  - severity: low
    issue: ‘Ia adalah milik-Ku’ kurang selaras dengan rujukan kategoris/distributif
    rationale: Walaupun tunggal Ibrani dapat diterjemahkan distributif, ‘itu milik-Ku’ lebih alami dalam bahasa Indonesia ketika merangkum ‘setiap anak sulung’ dari manusia maupun hewan.
  revised_text: “Kuduskanlah bagi-Ku setiap anak sulung, yaitu setiap yang pertama membuka rahim di kalangan orang Israel, baik pada manusia maupun pada hewan; itu milik-Ku.”
