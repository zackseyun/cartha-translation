review_pass:
  verdict: revise
  source_fidelity: 'Makna pokok terjaga: konstruksi עתיד diperkenalkan dengan ‘Apabila’, Yahweh sebagai pelaku, tujuan ‘ke tanah orang Kanaan’, sumpah kepada penerima ujaran dan para leluhur, serta pemberian tanah itu. Namun ‘seperti yang telah disumpahkan-Nya’ tidak idiomatis dan kurang tepat secara kolokasi; dalam bahasa Indonesia, Yahweh ‘bersumpah’ kepada mereka, bukan ‘menyumpahkan’ sesuatu kepada mereka.'
  naturalness: Kalimat ini umumnya jelas dan register-nya sesuai, tetapi ‘seperti yang telah disumpahkan-Nya kepadamu’ terdengar janggal. ‘ke negeri orang Kanaan’ dapat dipahami, tetapi ‘ke tanah orang Kanaan’ lebih langsung mencerminkan אֶרֶץ dan lebih lazim dalam gaya terjemahan Alkitab modern.
  terminology: ‘Yahweh’ tepat untuk יהוה sesuai kebijakan yang diberikan. ‘Nenek moyangmu’ adalah padanan alami bagi אבות dalam konteks ini dan catatan harfiah dapat dipertahankan. ‘Engkau/kepadamu’ konsisten dengan sufiks tunggal maskulin Ibrani.
  issues:
  - severity: medium
    issue: Kolokasi ‘telah disumpahkan-Nya kepadamu’
    rationale: נשבע berarti ‘bersumpah’; frasa לְךָ וְלַאֲבֹתֶיךָ menandai pihak-pihak kepada siapa Yahweh bersumpah. Bentuk pasif ‘disumpahkan-Nya’ dalam bahasa Indonesia lazimnya menyiratkan objek sumpah atau tindakan menyumpahkan seseorang, sehingga kurang alami dan kurang presisi.
  - severity: low
    issue: ‘negeri’ untuk אֶרֶץ
    rationale: ‘Negeri’ masih dapat diterima, tetapi ‘tanah’ lebih langsung untuk אֶרֶץ dan menghindari kemungkinan pembacaan modern sebagai negara.
  revised_text: Apabila[a] Yahweh membawa engkau masuk ke tanah orang Kanaan, seperti yang telah Dia sumpahkan kepada engkau dan kepada nenek moyangmu[b], lalu memberikannya kepadamu,
