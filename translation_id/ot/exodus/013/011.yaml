revisions:
- from: Apabila[a] Yahweh membawa engkau masuk ke negeri orang Kanaan, seperti yang telah disumpahkan-Nya kepadamu dan kepada nenek moyangmu[b], lalu memberikannya kepadamu,
  to: Apabila[a] Yahweh membawa engkau masuk ke tanah orang Kanaan, seperti yang telah Dia sumpahkan kepada engkau dan kepada nenek moyangmu[b], lalu memberikannya kepadamu,
  rationale: Revisi mengganti bentuk pasif yang janggal dengan ‘telah Dia sumpahkan kepada’, yang secara idiomatis dan semantis menyatakan bahwa Yahweh bersumpah kepada penerima ujaran dan para leluhur. ‘Tanah’ menggantikan ‘negeri’ untuk mencerminkan אֶרֶץ secara lebih langsung. Koma akhir dipertahankan karena kalimat berlanjut pada ayat berikutnya.
