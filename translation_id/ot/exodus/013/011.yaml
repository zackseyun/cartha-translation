  text: וְ/הָיָ֞ה כִּֽי יְבִֽאֲ/ךָ֤ יְהוָה֙ אֶל אֶ֣רֶץ הַֽ/כְּנַעֲנִ֔י כַּ/אֲשֶׁ֛ר נִשְׁבַּ֥ע לְ/ךָ֖ וְ/לַֽ/אֲבֹתֶ֑י/ךָ וּ/נְתָנָ֖/הּ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/011.yaml
  text: And when Yahweh brings you into the land of the Canaanites[a], as he swore to you and to your fathers, and gives it to you[b],
translation:
  language: id
  text: Apabila[a] Yahweh membawa engkau masuk ke tanah orang Kanaan, seperti yang telah Dia sumpahkan kepada engkau dan kepada nenek moyangmu[b], lalu memberikannya kepadamu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Dan akan terjadi apabila.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “bapak-bapakmu”; maksudnya para leluhur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Apabila
  rationale: Ungkapan Ibrani ini memperkenalkan keadaan yang akan terjadi pada masa depan. “Apabila” mempertahankan nuansa temporal dan bersyarat tanpa mengikuti idiom Ibrani secara kaku.
- source_word: יְבִיאֲךָ
  choice: membawa engkau masuk
  rationale: Bentuk hifil dari בוא berarti menyebabkan seseorang masuk atau membawanya masuk. Tambahan “masuk” wajar dalam bahasa Indonesia bersama tujuan yang disebut sesudahnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tidak diganti dengan gelar.
- source_word: אֶל אֶרֶץ הַכְּנַעֲנִי
  choice: ke negeri orang Kanaan
  rationale: אֶל menyatakan gerak menuju atau masuk ke suatu tempat, sedangkan bentuk gentilik tunggal kolektif הַכְּנַעֲנִי menunjuk kepada orang Kanaan sebagai suatu bangsa.
- source_word: כַּאֲשֶׁר נִשְׁבַּע
  choice: seperti yang telah disumpahkan-Nya
  rationale: Ungkapan ini mengacu pada sumpah yang telah diucapkan sebelumnya. Bentuk “disumpahkan-Nya” alami dalam konteks janji yang diteguhkan dengan sumpah dan tetap mempertahankan bobot kata נִשְׁבַּע.
- source_word: לְךָ וְלַאֲבֹתֶיךָ
  choice: kepadamu dan kepada nenek moyangmu
  rationale: Preposisi yang berulang dipertahankan. “Nenek moyang” merupakan padanan Indonesia yang alami untuk אָבוֹת ketika kata itu menunjuk kepada para leluhur, sementara arti harfiahnya dicatat dalam catatan kaki.
- source_word: וּנְתָנָהּ לָךְ
  choice: lalu memberikannya kepadamu
  rationale: Kata ganti objek feminin tunggal merujuk kembali kepada אֶרֶץ, yakni negeri itu. “Lalu” menghubungkan tindakan ini secara alami dengan tindakan Yahweh membawa Israel masuk.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian יהוה, sehingga transliterasi “Yahweh” mempertahankan nama pribadi itu daripada menggantinya dengan gelar.
- issue: Isi sumpah kepada generasi yang diajak bicara dan para leluhur
  choice: kepadamu dan kepada nenek moyangmu
  alternative: kepadamu dan kepada bapak-bapakmu
  rationale: Terjemahan utama memakai ungkapan Indonesia yang lazim untuk para leluhur tanpa menghapus fakta bahwa bentuk Ibraninya secara harfiah berarti “bapak-bapak”; arti harfiah itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan khidmat. Pronomina tunggal “engkau” mempertahankan sapaan maskulin tunggal dalam bahasa Ibrani. Susunan kalimat tetap terbuka dengan koma karena ayat berikutnya melanjutkan ketentuan yang bergantung pada keadaan ini.
