base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/008.yaml
  text: And you shall tell your son on that day[a], saying, ‘It is because of this that Yahweh acted for me when I came out of Egypt.’
translation:
  language: id
  text: 'Pada hari itu, beritahukanlah kepada anak laki-lakimu: “Karena inilah[a] Yahweh bertindak bagiku ketika aku keluar dari Mesir.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yahweh melakukan ini bagiku ketika aku keluar dari Mesir.” Dalam bahasa Ibrani, “ini” dapat dikaitkan dengan alasan peringatan tersebut atau, secara lebih langsung, dengan apa yang Yahweh lakukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִגַּדְתָּ
  choice: engkau harus memberitahukan
  rationale: Bentuk Hifil dari נגד berarti memberitahukan, menceritakan, atau menyatakan. Pilihan ini menyampaikan perintah dengan wajar dalam bahasa Indonesia modern.
- source_word: לְבִנְךָ
  choice: kepada anak laki-lakimu
  rationale: Kata Ibrani berbentuk tunggal maskulin, dan prefiks לְ menandai penerima perkataan. Terjemahan ini mempertahankan ketepatan gender dan jumlah.
- source_word: בַּיּוֹם הַהוּא
  choice: Pada hari itu
  rationale: Ungkapan temporal ini diterjemahkan secara langsung dan alami, dengan tetap mempertahankan penunjuk 'itu'.
- source_word: לֵאמֹר
  choice: (diperkenalkan langsung sebagai kutipan)
  rationale: Infinitif ini memperkenalkan isi perkataan. Dalam bahasa Indonesia, tanda kutip sesudah verba 'memberitahukan' mengungkapkan fungsi tersebut dengan lebih alami daripada menambahkan 'dengan berkata'.
- source_word: בַּעֲבוּר זֶה
  choice: Karena inilah
  rationale: Ungkapan ini menyatakan alasan atau dasar. 'Karena inilah' mempertahankan hubungan kausal dan rujukan demonstratif, sambil membiarkan ambiguitas sintaksisnya dijelaskan dalam catatan kaki.
- source_word: עָשָׂה יְהוָה לִי
  choice: Yahweh bertindak bagiku
  rationale: עשה memiliki arti luas, yaitu melakukan, membuat, atau bertindak. Karena tidak ada objek eksplisit, 'bertindak bagiku' menghindari penambahan objek yang terlalu menentukan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: בְּצֵאתִי מִמִּצְרָיִם
  choice: ketika aku keluar dari Mesir
  rationale: Infinitif konstruk dengan prefiks בְ menyatakan keadaan temporal. Terjemahan ini alami dan mempertahankan sudut pandang orang pertama tunggal.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi secara langsung; 'Yahweh' mempertahankannya sebagai nama pribadi dan sesuai dengan kebijakan istilah yang diberikan.
- issue: Istilah kekerabatan maskulin tunggal בִנְךָ
  choice: anak laki-lakimu
  alternative: anakmu
  rationale: Pilihan ini mempertahankan bentuk tunggal maskulin dalam teks Ibrani tanpa memperluas atau menetralkannya.
- issue: Hubungan sintaksis בַּעֲבוּר זֶה dengan עָשָׂה
  choice: Karena inilah Yahweh bertindak bagiku
  alternative: Yahweh melakukan ini bagiku
  rationale: Teks Ibrani memungkinkan 'ini' dipahami sebagai alasan perayaan atau sebagai hal yang dilakukan Yahweh. Teks utama mengikuti pembacaan kausal, sedangkan alternatif dicatat agar ambiguitas asli tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara nama ilahi, bentuk orang pertama, gender istilah kekerabatan, dan ambiguitas sintaksis utama dipertahankan.
