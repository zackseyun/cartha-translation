  text: You shall keep this statute at its appointed time from year to year[a].
translation:
  language: id
  text: Engkau harus menaati ketetapan ini pada waktu yang telah ditetapkan, dari tahun ke tahun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah dalam bahasa Ibrani: “dari hari-hari ke hari-hari,” suatu ungkapan yang di sini lazim dipahami sebagai “dari tahun ke tahun.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: Engkau harus menaati
  rationale: Dalam konteks hukum dan ibadah, שׁמר menyatakan kewajiban untuk memegang dan melaksanakan ketetapan. “Menaati” terdengar alami dalam bahasa Indonesia modern dan tetap menyampaikan unsur kepatuhan yang berkelanjutan.
- source_word: הַחֻקָּה הַזֹּאת
  choice: ketetapan ini
  rationale: חֻקָּה menunjuk pada ketentuan tetap yang ditetapkan sebagai kewajiban. “Ketetapan” merupakan padanan Indonesia yang formal, jelas, dan sesuai dengan konteks perjanjian.
- source_word: לְמוֹעֲדָהּ
  choice: pada waktu yang ditetapkan untuknya
  rationale: מוֹעֵד berarti waktu atau kesempatan yang ditentukan. Frasa ini mempertahankan sufiks pronominal feminin, yang merujuk pada ketetapan atau pelaksanaannya, tanpa menentukan rujukannya secara lebih sempit daripada teks Ibrani.
- source_word: מִיָּמִים יָמִימָה
  choice: dari tahun ke tahun
  rationale: Secara harfiah ungkapan ini memakai kata “hari”, tetapi dalam konteks perayaan tahunan ungkapan tersebut menyatakan keberulangan setiap tahun. Padanan idiomatis ditempatkan dalam teks utama, sedangkan bentuk Ibraninya dijelaskan dalam catatan kaki.
