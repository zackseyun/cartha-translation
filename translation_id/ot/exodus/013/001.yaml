  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: id
  text: 'Lalu Yahweh[a] berfirman kepada Musa:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “YHWH”; dalam beberapa terjemahan juga ditransliterasikan “Yehuwa”.'
    reason: Menjelaskan bentuk nama ilahi dalam teks sumber dan transliterasi alternatif yang dikenal.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kemudian ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi. “Kemudian” menyampaikan daya urutannya secara alami, sedangkan “berfirman” merupakan padanan Indonesia yang lazim dan bermartabat untuk tindakan Allah berbicara.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak yang dituju dalam komunikasi; “kepada” adalah padanan Indonesia yang alami.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Nama Ibrani ini memakai bentuk baku yang telah mapan dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara terpisah
  rationale: Infinitif ini merupakan formula Ibrani yang memperkenalkan perkataan langsung pada ayat berikutnya. Dalam bahasa Indonesia, fungsi tersebut sudah disampaikan secara alami oleh verba “berfirman” dan tanda koma; menambahkan “demikian” atau “kata-Nya” akan kurang langsung atau menggandakan unsur ujaran.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama diri ilahi secara langsung. “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar, sementara catatan kaki memberi tahu pembaca tentang bentuk Ibraninya dan ragam pelafalan yang dikenal.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. “Berfirman” dipilih karena wajar untuk ujaran Allah dalam register Alkitab Indonesia tanpa menambahkan isi teologis yang tidak terdapat dalam teks.
