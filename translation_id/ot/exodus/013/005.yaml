  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָיָ֣ה כִֽי יְבִֽיאֲ/ךָ֣ יְהוָ֡ה אֶל אֶ֣רֶץ הַֽ֠/כְּנַעֲנִי וְ/הַ/חִתִּ֨י וְ/הָ/אֱמֹרִ֜י וְ/הַ/חִוִּ֣י וְ/הַ/יְבוּסִ֗י אֲשֶׁ֨ר נִשְׁבַּ֤ע לַ/אֲבֹתֶ֨י/ךָ֙ לָ֣/תֶת לָ֔/ךְ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ וְ/עָבַדְתָּ֛ אֶת הָ/עֲבֹדָ֥ה הַ/זֹּ֖את בַּ/חֹ֥דֶשׁ הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/005.yaml
  text: And when Yahweh brings you into the land of the Canaanites[a], the Hittites, the Amorites, the Hivites, and the Jebusites, which he swore to your fathers to give you, a land flowing with milk and honey, you shall perform this service in this month.
translation:
  language: id
  text: Apabila Yahweh membawa engkau masuk ke negeri orang Kanaan, orang Het, orang Amori, orang Hewi, dan orang Yebus—negeri yang telah Ia janjikan dengan sumpah kepada leluhurmu untuk diberikan kepadamu, negeri yang berlimpah susu dan madu—engkau harus melaksanakan ibadah ini[a] pada bulan ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “upacara ini” atau “perayaan ini.” Istilah Ibrani yang dipakai dapat menunjuk pada pelayanan atau tindakan ibadah yang telah ditetapkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִי
  choice: Apabila
  rationale: Konstruksi ini memperkenalkan keadaan pada masa mendatang. 'Apabila' mempertahankan nuansa temporal-kondisional secara alami dalam bahasa Indonesia.
- source_word: יְבִיאֲךָ
  choice: membawa engkau masuk
  rationale: Bentuk Hifil dari בוא berarti membawa atau menyebabkan masuk. Tambahan 'masuk' memperjelas gerak menuju bagian dalam negeri itu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai nama diri, bukan diganti dengan gelar.
- source_word: הַכְּנַעֲנִי וְהַחִתִּי וְהָאֱמֹרִי וְהַחִוִּי וְהַיְבוּסִי
  choice: orang Kanaan, orang Het, orang Amori, orang Hewi, dan orang Yebus
  rationale: Etnonim tunggal Ibrani berfungsi secara kolektif. Bentuk 'orang + nama kelompok' jelas dan lazim dalam bahasa Indonesia.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: yang telah Ia janjikan dengan sumpah kepada leluhurmu untuk diberikan kepadamu
  rationale: '''Janjikan dengan sumpah'' menyatakan tindakan bersumpah tanpa kehilangan isi janji, sedangkan ''leluhurmu'' menyampaikan אבות dalam konteks nenek moyang Israel.'
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: negeri yang berlimpah susu dan madu
  rationale: Ungkapan ini menyampaikan gambaran Ibrani tentang kesuburan dan kelimpahan secara wajar, tanpa menafsirkan susu dan madu secara sempit.
- source_word: וְעָבַדְתָּ אֶת הָעֲבֹדָה הַזֹּאת
  choice: engkau harus melaksanakan ibadah ini
  rationale: Dalam konteks perayaan keagamaan, עבד dan עבודה menunjuk pelaksanaan pelayanan atau ibadah yang ditetapkan. 'Melaksanakan ibadah' mempertahankan baik tindakan maupun nuansa kultisnya.
- source_word: בַּחֹדֶשׁ הַזֶּה
  choice: pada bulan ini
  rationale: Terjemahan langsung dan idiomatis bagi keterangan waktu yang menunjuk bulan perayaan tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung; 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Nuansa kultis עֲבֹדָה dalam konteks Paskah/Roti Tidak Beragi
  choice: ibadah ini
  alternative: upacara ini atau perayaan ini
  rationale: Kata tersebut dapat berarti pekerjaan, pelayanan, atau ibadah. Dalam konteks ini, 'ibadah' mempertahankan sifat pengabdian keagamaan tanpa menentukan bentuk ritualnya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti tunggal 'engkau' mempertahankan sapaan orang kedua tunggal dalam teks Ibrani. Tanda pisah membantu menunjukkan bahwa kedua frasa tentang sumpah dan kelimpahan sama-sama menerangkan negeri tersebut.
