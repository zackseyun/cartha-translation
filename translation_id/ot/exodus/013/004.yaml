lexical_decisions:
- source_word: הַיּוֹם
  choice: Hari ini
  rationale: Nomina dengan artikel ini berfungsi secara adverbial dan menunjuk pada hari berlangsungnya peristiwa keluarnya Israel; 'Hari ini' alami dan mempertahankan kesegeraan ujaran.
- source_word: אַתֶּם
  choice: kamu
  rationale: Pronomina orang kedua maskulin jamak yang ditujukan kepada Israel. Dalam bahasa Indonesia modern, 'kamu' dapat mengacu kepada kelompok; konteks mempertahankan makna jamaknya tanpa tambahan yang kaku.
- source_word: יֹצְאִים
  choice: keluar
  rationale: Partisipel Qal jamak dari יצא menggambarkan tindakan yang sedang atau segera berlangsung. Dalam konstruksi dengan penanda waktu 'Hari ini', bentuk Indonesia 'kamu keluar' secara alami menyampaikan tindakan kini yang dinamis tanpa perlu menambahkan 'sedang'.
- source_word: בְּחֹדֶשׁ
  choice: pada bulan
  rationale: Preposisi ב dengan 'bulan' memberi keterangan waktu kalender; 'pada bulan' merupakan padanan Indonesia yang alami.
- source_word: הָאָבִיב
  choice: Abib
  rationale: Nama atau sebutan bulan ini ditransliterasikan, bukan diganti dengan tafsiran seperti 'musim semi' atau 'bulir muda'. Keterangan maknanya ditempatkan dalam catatan kaki.
