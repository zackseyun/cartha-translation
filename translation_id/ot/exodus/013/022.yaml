  yaml_path: translation/ot/exodus/013/022.yaml
  text: The pillar of cloud by day and the pillar of fire by night did not depart from before the people[a].
translation:
  language: id
  text: Tiang awan pada siang hari dan tiang api pada malam hari tidak beranjak dari depan umat itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak menjauh dari depan umat itu.” Kata kerja Ibrani menekankan bahwa tiang-tiang penuntun tersebut terus hadir.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמִישׁ
  choice: tidak beranjak
  rationale: Kata kerja dari מוּשׁ menyatakan berpindah atau menjauh. Dalam bentuk negatif, “tidak beranjak” secara alami menunjukkan bahwa kedua tiang itu terus berada di tempatnya di depan umat.
- source_word: עַמּוּד
  choice: tiang
  rationale: “Tiang” merupakan padanan Indonesia yang jelas dan lazim untuk gambaran sesuatu yang tegak menyerupai pilar.
- source_word: הֶעָנָן
  choice: awan
  rationale: Padanan langsung bagi עָנָן; konstruksi definit dalam bahasa Ibrani dinyatakan secara alami sebagai “tiang awan” dalam bahasa Indonesia.
- source_word: יוֹמָם
  choice: pada siang hari
  rationale: Bentuk adverbial ini menunjukkan waktu dan berpasangan secara wajar dengan “pada malam hari”.
- source_word: וְעַמּוּד הָאֵשׁ
  choice: dan tiang api
  rationale: Mempertahankan kesejajaran dengan “tiang awan” serta gambaran konkret api.
- source_word: לָיְלָה
  choice: pada malam hari
  rationale: Ungkapan waktu yang alami dalam bahasa Indonesia dan sejajar dengan “pada siang hari”.
- source_word: לִפְנֵי
  choice: dari depan
  rationale: Bersama kata kerja יָמִישׁ, frasa ini menyatakan bahwa tiang-tiang itu tidak menjauh dari posisi di depan umat.
- source_word: הָעָם
  choice: umat itu
  rationale: Nomina kolektif definit ini merujuk kepada bangsa Israel. “Umat itu” menjaga sifat kolektif dan definit tanpa menambahkan nama yang tidak muncul dalam ayat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel Ibrani dipertahankan, sedangkan “tidak beranjak” dipilih agar hubungan spasial dengan “dari depan umat itu” tetap jelas dan alami.
