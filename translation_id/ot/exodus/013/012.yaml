base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/012.yaml
  text: you shall set apart to Yahweh every one that opens the womb[b][a], and every male firstborn of the livestock that you have belongs to Yahweh.
translation:
  language: id
  text: Haruslah engkau mengkhususkan bagi Yahweh setiap yang pertama keluar dari kandungan,[a] dan setiap anak pertama dari kandungan ternak yang kaumiliki; yang jantan adalah milik Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “setiap pembuka rahim,” yaitu anak yang pertama keluar dari kandungan.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani menunjuk pada anak pertama yang keluar dari kandungan ternak; bagian akhir ayat menentukan bahwa yang jantan adalah milik Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲבַרְתָּ
  choice: haruslah engkau mengkhususkan
  rationale: Bentuk Hifil dari עבר secara harfiah berarti membuat sesuatu lewat atau memindahkannya, tetapi dalam konteks ibadah ini menunjuk pada penyerahan atau pengkhususan bagi Yahweh.
- source_word: כָל־פֶּטֶר רֶחֶם
  choice: setiap yang membuka rahim
  rationale: Mempertahankan ungkapan Ibrani 'pembuka rahim', yang menunjuk pada anak yang pertama keluar dari kandungan, tanpa langsung menyederhanakannya menjadi 'anak sulung'.
- source_word: פֶּטֶר שֶׁגֶר בְּהֵמָה
  choice: setiap anak pertama dari kandungan ternak
  rationale: שֶׁגֶר menunjuk pada anak atau hasil kandungan hewan. Ungkapan ini dibedakan dari frasa sebelumnya dan dibuat alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר יִהְיֶה לְךָ
  choice: yang kaumiliki
  rationale: Menyampaikan secara ringkas bahwa ternak tersebut berada dalam kepunyaan orang yang disapa.
- source_word: הַזְּכָרִים
  choice: yang jantan
  rationale: 'Bentuk jamak tertentu ini menggolongkan anak-anak ternak yang dimaksud: yang jantanlah yang dikhususkan bagi Yahweh.'
- source_word: לַיהוָה
  choice: bagi Yahweh / milik Yahweh
  rationale: Preposisi ל menyatakan tujuan penyerahan pada bagian pertama dan kepunyaan atau peruntukan sakral pada bagian akhir; nama ilahi יהוה ditransliterasikan sebagai Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה secara langsung; bentuk 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Hubungan הַזְּכָרִים dengan anak ternak
  choice: yang jantan adalah milik Yahweh
  alternative: setiap anak jantan pertama dari ternak ... adalah milik Yahweh
  rationale: Susunan ini mempertahankan bahwa keterangan 'yang jantan' muncul kemudian sebagai pembatas terhadap anak pertama dari kandungan ternak, tanpa menerapkannya secara diam-diam pada frasa manusia sebelumnya.
translation_notes:
  register: Bahasa Indonesia baku, mutakhir, dan khidmat. Bentuk 'engkau' mempertahankan sapaan tunggal Ibrani. Tanda titik koma memperjelas peralihan dari ketentuan umum kepada pembatasan bahwa anak ternak yang jantan adalah milik Yahweh.
