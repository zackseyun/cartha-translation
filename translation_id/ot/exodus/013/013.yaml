source:
  edition: WLC
  text: וְ/כָל פֶּ֤טֶר חֲמֹר֙ תִּפְדֶּ֣ה בְ/שֶׂ֔ה וְ/אִם לֹ֥א תִפְדֶּ֖ה וַ/עֲרַפְתּ֑/וֹ וְ/כֹ֨ל בְּכ֥וֹר אָדָ֛ם בְּ/בָנֶ֖י/ךָ תִּפְדֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/013.yaml
  text: And every firstborn of a donkey you shall redeem with a lamb; and if you do not redeem it[a], then you shall break its neck. And every firstborn of man among your sons you shall redeem.
translation:
  language: id
  text: Setiap anak keledai yang pertama lahir harus kautebus dengan seekor anak domba[a]. Namun, jika tidak kautebus, engkau harus mematahkan lehernya. Setiap anak laki-laki sulungmu harus kautebus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani שֶׂה mencakup seekor ternak kecil dari kawanan, baik domba maupun kambing; dalam konteks ini, “anak domba” merupakan terjemahan yang alami.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּטֶר חֲמֹר
  choice: anak keledai yang pertama lahir
  rationale: פֶּטֶר secara harfiah menunjuk pada yang pertama membuka rahim. Ungkapan ini menyampaikan maknanya secara alami dalam bahasa Indonesia dan menghindari kesan bahwa induk keledainya sendiri adalah anak sulung.
- source_word: תִּפְדֶּה
  choice: harus kautebus
  rationale: פדה menyatakan pembebasan melalui pengganti atau pembayaran. 'Tebus' mempertahankan nuansa hukum dan ibadah, sedangkan 'harus' menyampaikan daya perintah bentuk verbal dalam konteks hukum.
- source_word: בְשֶׂה
  choice: dengan seekor anak domba
  rationale: שֶׂה adalah satu ekor ternak kecil dari kawanan dan dapat berupa domba atau kambing. 'Anak domba' merupakan padanan yang alami dalam konteks ini, sementara cakupan istilah Ibrani dijelaskan dalam catatan kaki.
- source_word: וַעֲרַפְתּוֹ
  choice: engkau harus mematahkan lehernya
  rationale: ערף menunjuk pada tindakan mematahkan leher, bukan penyembelihan biasa. Padanan ini lugas dan mempertahankan tindakan khusus dalam teks.
- source_word: בְּכוֹר אָדָם בְּבָנֶיךָ
  choice: setiap anak laki-laki sulungmu
  rationale: אָדָם membedakan manusia dari hewan, sedangkan בְּבָנֶיךָ secara khusus berarti 'di antara anak-anak lelakimu'. Dalam bahasa Indonesia, gabungan ini paling alami disampaikan sebagai 'setiap anak laki-laki sulungmu' tanpa mengubah pihak yang wajib ditebus.
theological_decisions:
- issue: Cakupan אָדָם dalam frasa בְּכוֹר אָדָם בְּבָנֶיךָ
  choice: anak laki-laki sulungmu
  alternative: setiap manusia sulung di antara anak-anak lelakimu
  rationale: אָדָם di sini menandai golongan manusia sebagai lawan dari hewan, bukan laki-laki dewasa secara khusus. Namun, בְּבָנֶיךָ membatasi acuannya pada anak-anak lelaki. Terjemahan pilihan mempertahankan cakupan tersebut dalam susunan bahasa Indonesia yang alami.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'kautebus' dipakai agar perintah orang kedua tunggal tetap ringkas dan alami; 'engkau' dinyatakan pada klausa kontras untuk kejelasan. Penanda catatan kaki ditempatkan langsung setelah padanan שֶׂה.
