  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל הָ/עָ֗ם זָכ֞וֹר אֶת הַ/יּ֤וֹם הַ/זֶּה֙ אֲשֶׁ֨ר יְצָאתֶ֤ם מִ/מִּצְרַ֨יִם֙ מִ/בֵּ֣ית עֲבָדִ֔ים כִּ֚י בְּ/חֹ֣זֶק יָ֔ד הוֹצִ֧יא יְהֹוָ֛ה אֶתְ/כֶ֖ם מִ/זֶּ֑ה וְ/לֹ֥א יֵאָכֵ֖ל חָמֵֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/003.yaml
  text: Then Moses said to the people[a], “Remember this day in which you came out from Egypt, from the house of slavery, because Yahweh brought you out from there by a strong hand[c][b]; and no leavened bread shall be eaten.”
translation:
  language: id
  text: Lalu Musa berkata kepada bangsa itu, “Ingatlah hari ini, ketika kamu keluar dari Mesir, dari tempat perbudakan,[a] sebab dengan tangan yang kuat[b] Yahweh membawa kamu keluar dari sana. Janganlah makan apa pun yang beragi.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari rumah para budak,” yaitu Mesir sebagai tempat perbudakan.
    reason: lexical_alternative
  - marker: b
    text: Atau “dengan tangan yang perkasa.”
    reason: lexical_alternative
  - marker: c
    text: Atau “Janganlah makan roti beragi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכוֹר
  choice: Ingatlah
  rationale: Imperatif tunggal yang ditujukan kepada bangsa sebagai satu kesatuan; bentuk ini alami dalam bahasa Indonesia dan mempertahankan daya perintah serta nuansa peringatan bersama.
- source_word: הַיּוֹם הַזֶּה
  choice: hari ini
  rationale: Gabungan nomina definit dan demonstratif secara alami berarti 'hari ini' dalam konteks perintah untuk memperingati hari keluarnya Israel.
- source_word: יְצָאתֶם מִמִּצְרַיִם
  choice: kamu keluar dari Mesir
  rationale: Menerjemahkan verba jamak secara langsung; 'kamu' dapat menunjuk kepada bangsa secara kolektif tanpa menambahkan unsur yang tidak terdapat dalam teks.
- source_word: מִבֵּית עֲבָדִים
  choice: dari tempat perbudakan
  rationale: Secara harfiah 'dari rumah para budak'; ungkapan Ibrani ini menunjuk kepada Mesir sebagai tempat orang diperbudak. 'Tempat perbudakan' menyampaikan idiom itu secara jelas dan wajar.
- source_word: כִּי
  choice: sebab
  rationale: Menandai alasan bangsa itu harus mengingat hari tersebut; 'sebab' menjaga hubungan kausal dengan register yang bermartabat.
- source_word: בְּחֹזֶק יָד
  choice: dengan tangan yang kuat
  rationale: Mempertahankan gambaran konkret idiom Ibrani tentang kuasa tindakan ilahi tanpa menggantinya dengan ungkapan abstrak.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang muncul dalam teks, bukan menggantinya dengan sebuah gelar.
- source_word: הוֹצִיא ... אֶתְכֶם מִזֶּה
  choice: membawa kamu keluar dari sana
  rationale: Bentuk Hifil dari יצא bersifat kausatif; susunan ini alami dan mempertahankan motif keluaran serta rujukan kembali kepada Mesir.
- source_word: וְלֹא יֵאָכֵל חָמֵץ
  choice: Janganlah makan apa pun yang beragi
  rationale: Larangan pasif Ibrani diungkapkan sebagai larangan umum yang alami dalam bahasa Indonesia. חָמֵץ dapat mencakup sesuatu yang beragi, bukan hanya roti.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks menggunakan nama pribadi ilahi; 'Yahweh' mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Makna בְּחֹזֶק יָד
  choice: dengan tangan yang kuat
  alternative: dengan tangan yang perkasa
  rationale: Pilihan utama dekat dengan unsur leksikal חֹזֶק dan mempertahankan citra tangan sebagai lambang kuasa; alternatif 'perkasa' juga sah tetapi sedikit lebih interpretatif.
- issue: Cakupan חָמֵץ
  choice: apa pun yang beragi
  alternative: roti beragi
  rationale: Nomina ini dapat menunjuk secara lebih luas kepada bahan atau makanan beragi. Terjemahan utama tidak mempersempit larangan hanya pada roti, sementara catatan mengakui alternatif yang lazim.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sambil mempertahankan metafora 'tangan yang kuat', nama Yahweh, serta keluasan makna larangan terhadap yang beragi.
