  terminology: '"Yahweh" konsisten dengan transliterasi Tetragramaton yang ditetapkan. "Tempat perbudakan" merupakan pengungkapan idiomatis yang baik untuk בֵּית עֲבָדִים; catatan kaki dengan benar mencatat bentuk harfiahnya. Istilah "yang beragi" lebih luas daripada "roti beragi" dan sesuai dengan teks sumber.'
