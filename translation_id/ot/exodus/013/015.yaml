  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֗י כִּֽי הִקְשָׁ֣ה פַרְעֹה֮ לְ/שַׁלְּחֵ/נוּ֒ וַ/יַּהֲרֹ֨ג יְהֹוָ֤ה כָּל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם מִ/בְּכֹ֥ר אָדָ֖ם וְ/עַד בְּכ֣וֹר בְּהֵמָ֑ה עַל כֵּן֩ אֲנִ֨י זֹבֵ֜חַ לַֽ/יהוָ֗ה כָּל פֶּ֤טֶר רֶ֨חֶם֙ הַ/זְּכָרִ֔ים וְ/כָל בְּכ֥וֹר בָּנַ֖/י אֶפְדֶּֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/015.yaml
  text: And when Pharaoh stubbornly refused to let us go[a], Yahweh killed every firstborn in the land of Egypt, from the firstborn of man to the firstborn of beast. Therefore I sacrifice to Yahweh every male that opens the womb, but every firstborn of my sons I redeem.
translation:
  language: id
  text: Ketika Firaun dengan keras kepala menolak membiarkan kami pergi, Yahweh membunuh setiap anak sulung di negeri Mesir, dari anak sulung manusia sampai anak sulung hewan. Karena itu, aku mempersembahkan sebagai kurban kepada Yahweh setiap yang jantan yang pertama keluar dari rahim, tetapi semua anak laki-lakiku yang sulung kutebus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִקְשָׁה
  choice: dengan keras kepala menolak
  rationale: Bentuk Hifil dalam kaitannya dengan לְשַׁלְּחֵנוּ menyatakan perlawanan yang membandel; ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan objek metaforis yang tidak dinyatakan.
- source_word: לְשַׁלְּחֵנוּ
  choice: membiarkan kami pergi
  rationale: Dalam kisah Keluaran, שׁלח merujuk pada pelepasan atau pengutusan Israel keluar dari Mesir; ungkapan ini mempertahankan idiom naratifnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בְּכוֹר
  choice: anak sulung
  rationale: Padanan baku dan tepat bagi yang lahir pertama; diterapkan secara konsisten dalam ayat ini.
- source_word: מִבְּכֹר אָדָם וְעַד בְּכוֹר בְּהֵמָה
  choice: dari anak sulung manusia sampai anak sulung hewan
  rationale: אָדָם bersifat generik dan dikontraskan dengan בְּהֵמָה; 'manusia' dan 'hewan' menyampaikan kontras tersebut secara jelas dalam bahasa Indonesia modern.
- source_word: עַל כֵּן
  choice: Karena itu
  rationale: Menandai hubungan sebab-akibat antara kematian anak sulung Mesir dan praktik pengurbanan serta penebusan Israel.
- source_word: זֹבֵחַ
  choice: mempersembahkan sebagai kurban
  rationale: זבח menunjuk pada tindakan mempersembahkan dengan penyembelihan; terjemahan ini jelas dalam konteks ibadah dan lebih alami daripada sekadar 'mengurbankan' dengan objek anak jantan.
- source_word: פֶּטֶר רֶחֶם הַזְּכָרִים
  choice: setiap anak jantan yang pertama keluar dari rahim
  rationale: Mengungkapkan idiom harfiah 'pembuka rahim' sebagai keturunan jantan pertama yang lahir, tanpa mengaburkan cakupannya pada manusia dan hewan.
- source_word: בָּנַי
  choice: anak laki-lakiku
  rationale: בנים secara khusus berarti anak-anak lelaki dalam konteks ketentuan penebusan anak sulung.
- source_word: אֶפְדֶּה
  choice: kutebus
  rationale: פדה dalam konteks hukum-ibadah berarti membebaskan melalui pembayaran atau pengganti; 'menebus' merupakan padanan Indonesia yang mapan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung; bentuk 'Yahweh' mempertahankannya sebagai nama perjanjian, bukan menggantinya dengan gelar.
- issue: Cakupan אָדָם ketika dikontraskan dengan בְּהֵמָה
  choice: manusia
  alternative: orang
  rationale: Kata ini merujuk pada umat manusia secara generik, bukan khusus laki-laki; 'manusia' mempertahankan kontras kategoris dengan hewan.
- issue: Hubungan antara pengurbanan anak jantan dan penebusan anak lelaki
  choice: mempertahankan kontras eksplisit 'tetapi'
  alternative: menghubungkannya hanya dengan 'dan' sesuai waw Ibrani
  rationale: Dalam konteks, hewan jantan anak sulung dipersembahkan sebagai kurban, sedangkan anak lelaki sulung ditebus. 'Tetapi' menyatakan kontras pragmatis itu tanpa mengubah ketentuan sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur sebab-akibat dipertahankan dengan jelas. Istilah ibadah 'kurban' dan 'menebus' dipakai secara konsisten, sedangkan ungkapan kelahiran dibuat alami tanpa menghilangkan citra 'keluar dari rahim'.
