base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/019.yaml
  text: And Moses took Joseph’s bones with him[a], because Joseph had made the sons of Israel solemnly swear, saying, “God will surely attend to you, and you shall bring up my bones from here with you.”
translation:
  language: id
  text: Musa membawa tulang-tulang Yusuf bersamanya, sebab Yusuf telah mengikat anak-anak Israel dengan sumpah yang sungguh-sungguh, katanya, “Allah pasti akan memperhatikan kalian[a], dan kalian harus membawa tulang-tulangku dari sini bersama kalian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Allah pasti akan melawat kalian.” Ungkapan Ibrani ini dapat menunjuk pada campur tangan Allah yang menentukan bagi umat-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: membawa
  rationale: Dalam konteks perjalanan keluar dari Mesir, ‘membawa’ mengungkapkan tindakan mengambil serta mengangkut tulang-tulang Yusuf secara alami dalam bahasa Indonesia.
- source_word: עַצְמוֹת / עַצְמֹתַי
  choice: tulang-tulang / tulang-tulangku
  rationale: Mempertahankan gambaran konkret teks Ibrani; ‘jenazah’ atau ‘sisa jasad’ lebih interpretatif.
- source_word: עִמּוֹ / אִתְּכֶם
  choice: bersamanya / bersama kalian
  rationale: Menerjemahkan kedua ungkapan penyertaan secara langsung dan mempertahankan pengulangannya.
- source_word: הַשְׁבֵּעַ הִשְׁבִּיעַ
  choice: telah menyuruh ... bersumpah dengan sungguh-sungguh
  rationale: Bentuk kausatif dan penguatan melalui infinitif absolut diwakili oleh ‘menyuruh’ serta ‘dengan sungguh-sungguh’.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  rationale: Mempertahankan ungkapan kekeluargaan Ibrani yang menunjuk kepada keturunan Israel dan sudah dikenal dalam ragam Alkitab bahasa Indonesia.
- source_word: פָּקֹד יִפְקֹד
  choice: pasti akan memperhatikan
  rationale: Pengulangan bentuk verbal menyatakan kepastian. ‘Memperhatikan’ cukup luas untuk mencakup kepedulian dan tindakan Allah tanpa menentukan secara berlebihan bentuk campur tangan-Nya.
- source_word: וְהַעֲלִיתֶם
  choice: dan kalian harus membawa
  rationale: Dalam konteks sumpah, bentuk ini memiliki daya kewajiban. ‘Membawa’ terdengar alami; arah meninggalkan tempat itu sudah dinyatakan oleh ‘dari sini’.
- source_word: מִזֶּה
  choice: dari sini
  rationale: Padanan deiktis yang langsung dan alami, merujuk kepada Mesir sebagai lokasi saat sumpah diucapkan.
theological_decisions:
- issue: Makna tindakan Allah dalam פָּקֹד יִפְקֹד אֱלֹהִים אֶתְכֶם
  choice: Allah pasti akan memperhatikan kalian
  alternative: Allah pasti akan melawat kalian
  rationale: Pilihan utama memakai bahasa Indonesia modern sambil mempertahankan keluasan makna tindakan Allah. Catatan kaki menyediakan padanan idiomatis yang lebih harfiah dan menjelaskan bahwa perhatian tersebut mencakup campur tangan nyata.
- issue: Identitas בְּנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  alternative: orang Israel; keturunan Israel
  rationale: Ungkapan kekeluargaan sumber dipertahankan tanpa membatasi rujukannya hanya kepada anak-anak dalam pengertian usia; dalam konteks ini frasa tersebut menunjuk secara kolektif kepada keturunan Israel.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk ‘kalian’ dipakai untuk memperjelas bahwa kata ganti dalam bahasa Ibrani berbentuk jamak. Struktur sumpah dan pengulangan gagasan ‘bersama’ dipertahankan.
