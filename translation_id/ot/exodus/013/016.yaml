base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/016.yaml
  text: And it shall be as a sign on your hand and as frontlets between your eyes[b][a], for with a strong hand Yahweh brought us out from Egypt.
translation:
  language: id
  text: Hal itu akan menjadi tanda pada tanganmu dan hiasan dahi di antara kedua matamu[b][a], sebab dengan tangan yang kuat Yahweh membawa kita keluar dari Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pita”; secara tradisional, “filakteri”. Istilah Ibrani ini jarang dipakai dan mungkin menunjuk pada sesuatu yang dikenakan pada dahi sebagai pengingat.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di antara kedua matamu”, suatu ungkapan yang sering dipahami sebagai “pada dahimu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Hal itu harus menjadi
  rationale: Bentuk perfektum dengan waw dalam konteks petunjuk ini menyatakan fungsi yang berkelanjutan atau yang ditetapkan; terjemahan ini alami dalam bahasa Indonesia dan mempertahankan nuansa ketetapan.
- source_word: לְאוֹת
  choice: menjadi tanda
  rationale: אוֹת berarti tanda atau penanda; 'tanda' merupakan padanan yang luas dan wajar.
- source_word: עַל יָדְכָה
  choice: pada tanganmu
  rationale: Teks Ibrani menyebut 'tangan', bukan 'lengan'; ungkapan konkret dipertahankan.
- source_word: וּלְטוֹטָפֹת
  choice: dan lambang pengingat
  rationale: טוֹטָפֹת adalah istilah langka yang tampaknya menunjuk pada sesuatu yang dikenakan di bagian depan kepala sebagai pengingat. 'Lambang pengingat' menyampaikan fungsi yang mungkin tanpa memasukkan istilah ritual dari masa kemudian ke dalam teks utama.
- source_word: בֵּין עֵינֶיךָ
  choice: di antara kedua matamu
  rationale: Citra harfiah bahasa Ibrani dipertahankan; pengertian idiomatis 'pada dahimu' dicantumkan dalam catatan.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan dasar bagi perintah mengenai tanda tersebut.
- source_word: בְּחֹזֶק יָד
  choice: dengan tangan yang kuat
  rationale: Terjemahan ini mempertahankan ungkapan konkret Ibrani tentang tindakan ilahi yang penuh kuasa tanpa menggantinya dengan idiom lain.
- source_word: הוֹצִיאָנוּ
  choice: membawa kita keluar
  rationale: Bentuk Hifil dari יצא berarti menyebabkan keluar, sehingga 'membawa ... keluar' tepat dan alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: מִמִּצְרַיִם
  choice: dari Mesir
  rationale: Bersama frasa 'membawa kita keluar', bentuk ini menghasilkan bahasa Indonesia yang alami dan akurat.
theological_decisions:
- issue: Apakah bahasa tentang tangan dan mata harus ditafsirkan langsung sebagai benda ritual dari masa kemudian
  choice: Mempertahankan gambaran konkret 'pada tanganmu' dan 'di antara kedua matamu' dalam teks utama
  alternative: Menerjemahkannya secara khusus sebagai 'filakteri' atau sepenuhnya sebagai pengingat kiasan
  rationale: Bahasa Ibrani tidak secara eksplisit menamai praktik ritual dari masa kemudian. Pilihan ini menjaga keterbukaan apakah ungkapan tersebut bersifat harfiah, simbolis, atau keduanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Susunan penanda mengikuti teks konsultasi, yaitu [b][a], dan setiap penanda muncul dalam teks utama.
