base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/021.yaml
  text: And Yahweh was going before them by day in a pillar of cloud to lead them on the way[a], and by night in a pillar of fire to give them light, so that they could travel by day and by night.
translation:
  language: id
  text: Yahweh berjalan di depan mereka pada siang hari dalam tiang awan untuk menuntun mereka di jalan, dan pada malam hari dalam tiang api untuk menerangi mereka, sehingga mereka dapat berjalan pada siang hari dan pada malam hari.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi yang terdapat langsung dalam teks Ibrani.
- source_word: הֹלֵךְ לִפְנֵיהֶם
  choice: berjalan di depan mereka
  rationale: Partisip Ibrani menyatakan tindakan yang berlangsung terus; frasa ini mempertahankan gambaran gerak sekaligus kepemimpinan.
- source_word: יוֹמָם
  choice: pada siang hari
  rationale: Ungkapan temporal alami dalam bahasa Indonesia dan sejajar dengan 'pada malam hari'.
- source_word: בְּעַמּוּד עָנָן
  choice: dalam tiang awan
  rationale: Preposisi dan gambaran konkret sumber dipertahankan; Yahweh digambarkan hadir dalam bentuk yang tampak itu.
- source_word: לַנְחֹתָם הַדֶּרֶךְ
  choice: untuk menuntun mereka di jalan
  rationale: Menyampaikan tujuan tindakan dan mempertahankan unsur 'jalan' tanpa menentukan apakah yang dimaksud rute tertentu atau perjalanan secara umum.
- source_word: בְּעַמּוּד אֵשׁ
  choice: dalam tiang api
  rationale: Mempertahankan kesejajaran dengan 'dalam tiang awan' dan citra konkret teks.
- source_word: לְהָאִיר לָהֶם
  choice: untuk menerangi mereka
  rationale: Mencerminkan bentuk kausatif dari אור secara ringkas dan wajar.
- source_word: לָלֶכֶת יוֹמָם וָלָיְלָה
  choice: sehingga mereka dapat berjalan pada siang dan malam hari
  rationale: Infinitif menyatakan tujuan atau hasil; 'berjalan' mempertahankan verba gerak yang sama tanpa mempersempitnya menjadi jenis perjalanan tertentu.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri; transliterasi mempertahankan nama perjanjian itu secara terbuka dan sesuai lapisan konsultasi POB.
- issue: Cara kehadiran ilahi dalam tiang awan dan api
  choice: dalam tiang awan ... dalam tiang api
  alternative: dengan tiang awan ... dengan tiang api
  rationale: Pilihan 'dalam' mengikuti preposisi בְּ dan mempertahankan gambaran manifestasi kehadiran Yahweh tanpa menjelaskan mekanismenya lebih jauh.
translation_notes:
  register: Bahasa Indonesia baku modern, bermartabat, dan mudah dipahami. Struktur paralel siang/malam serta tiang awan/tiang api dipertahankan. Tidak diperlukan catatan kaki karena nama 'Yahweh' tampil langsung dalam teks dan tidak ada varian tekstual penting yang perlu dijelaskan.
