  text: וַ/יַּסֵּ֨ב אֱלֹהִ֧ים אֶת הָ/עָ֛ם דֶּ֥רֶךְ הַ/מִּדְבָּ֖ר יַם ס֑וּף וַ/חֲמֻשִׁ֛ים עָל֥וּ בְנֵי יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/018.yaml
  text: So God led the people around by the way of the wilderness to the Sea of Reeds[b][a], and the sons of Israel went up from the land of Egypt armed.
translation:
  language: id
  text: Maka Allah menuntun bangsa itu mengambil jalan memutar melalui padang gurun menuju Laut Teberau[a]. Orang-orang Israel keluar dari tanah Mesir dengan perlengkapan tempur[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Laut Merah.” Nama Ibrani itu secara harfiah berarti “Laut Teberau.”'
    reason: alternative_reading
  - marker: b
    text: Arti istilah Ibrani ini tidak pasti; dapat juga diterjemahkan “bersenjata”, “dalam barisan tempur”, atau, secara lebih umum, “dalam barisan teratur”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסֵּב
  choice: membawa ... berputar
  rationale: Bentuk Hifil menyatakan bahwa Allah menyebabkan bangsa itu mengambil jalan memutar, bukan rute langsung.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Padanan baku bahasa Indonesia untuk satu-satunya Allah; verba Ibrani berbentuk tunggal.
- source_word: הָעָם
  choice: bangsa itu
  rationale: Menunjuk Israel secara kolektif; 'bangsa itu' wajar dan sesuai konteks keluarnya umat dari Mesir.
- source_word: דֶּרֶךְ הַמִּדְבָּר
  choice: melalui jalan padang gurun
  rationale: Mempertahankan gagasan דֶּרֶךְ sebagai jalan atau rute, bukan sekadar lokasi.
- source_word: יַם סוּף
  choice: Laut Teberau
  rationale: Padanan Indonesia yang mempertahankan arti leksikal nama Ibrani, yakni laut yang berkaitan dengan tumbuhan teberau; sebutan tradisional 'Laut Merah' dicatat dalam catatan kaki.
- source_word: וַחֲמֻשִׁים
  choice: dengan perlengkapan tempur
  rationale: Mengungkapkan kemungkinan makna kesiapan atau kelengkapan untuk berperang tanpa memastikan bahwa setiap orang secara eksplisit membawa senjata; ketidakpastian istilah dipertahankan dalam catatan kaki.
- source_word: עָלוּ
  choice: keluar
  rationale: Dalam konteks keberangkatan dari Mesir, 'keluar' lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'naik', tanpa mengubah arah gerak yang dimaksud.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang-orang Israel
  rationale: Ungkapan idiomatis bahasa Indonesia bagi kelompok keturunan Israel; lebih alami daripada 'anak-anak lelaki Israel' dan tetap menunjuk umat secara korporat.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: dari tanah Mesir
  rationale: Mencerminkan preposisi dan nomina Ibrani secara langsung serta tetap alami.
theological_decisions:
- issue: Penerjemahan יַם סוּף
  choice: Laut Teberau
  alternative: Laut Merah
  rationale: Mengutamakan arti nama Ibrani, sedangkan sebutan tradisional dan sangat dikenal 'Laut Merah' dipertahankan sebagai alternatif dalam catatan kaki.
- issue: Penerjemahan בְנֵי יִשְׂרָאֵל
  choice: orang-orang Israel
  alternative: anak-anak Israel
  rationale: Ungkapan tersebut adalah sebutan korporat bagi umat Israel. Padanan yang dipilih alami dalam bahasa Indonesia dan tidak menyiratkan bahwa hanya laki-laki yang keluar.
- issue: Makna חֲמֻשִׁים
  choice: dengan perlengkapan tempur
  alternative: bersenjata; dalam barisan tempur; dalam barisan teratur
  rationale: Konteks mendukung kesiapan atau keteraturan yang bernuansa militer, tetapi arti tepat katanya tidak pasti; karena itu alternatif dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dibagi menjadi dua kalimat agar mudah dipahami. Semua penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskan.
