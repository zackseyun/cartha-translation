    issue: '''Itu harus menjadi'' terlalu deontik untuk וְהָיָה.'
    rationale: 'Bentuk Ibrani ini berfungsi prospektif: peringatan/ibadah tersebut akan berfungsi sebagai tanda dan peringatan. ''Akan menjadi'' mempertahankan daya futuratif tanpa menambahkan nuansa perintah yang tidak dinyatakan secara langsung.'
  - severity: low
    issue: Tindakan pembebasan lampau belum dinyatakan jelas dalam 'Yahweh membawa engkau keluar.'
    rationale: Kata kerja הוֹצִיאֲךָ adalah perfek Hifil dan merujuk pada keluaran dari Mesir yang telah terjadi. Penambahan 'telah' menyampaikan rujukan lampau secara alami.
