  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָיָה֩ לְ/ךָ֨ לְ/א֜וֹת עַל יָדְ/ךָ֗ וּ/לְ/זִכָּרוֹן֙ בֵּ֣ין עֵינֶ֔י/ךָ לְמַ֗עַן תִּהְיֶ֛ה תּוֹרַ֥ת יְהוָ֖ה בְּ/פִ֑י/ךָ כִּ֚י בְּ/יָ֣ד חֲזָקָ֔ה הוֹצִֽאֲ/ךָ֥ יְהֹוָ֖ה מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/013/009.yaml
  text: And it shall be for you as a sign on your hand and as a memorial between your eyes[a], so that the law of Yahweh may be in your mouth[c][b]; for with a strong hand Yahweh brought you out of Egypt.
translation:
  language: id
  text: Hal itu akan menjadi bagimu tanda pada tanganmu dan pengingat di antara kedua matamu[a], supaya hukum Yahweh ada di mulutmu[b]; sebab Yahweh telah membawa engkau keluar dari Mesir dengan tangan yang kuat[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “di antara kedua matamu” dapat dipahami secara idiomatis sebagai “pada dahimu”; teks utama mempertahankan susunan harfiah bahasa Ibrani.
    reason: lexical_alternative
  - marker: b
    text: Atau “pengajaran Yahweh.” Kata Ibrani torah dapat berarti “hukum” atau “pengajaran,” bergantung pada konteks.
    reason: lexical_alternative
  - marker: c
    text: Ungkapan ini juga dapat diterjemahkan “dengan tangan yang perkasa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Itu harus menjadi
  rationale: 'Bentuk ini bersifat prospektif dalam konteks petunjuk: peringatan yang disebut sebelumnya harus berfungsi sebagai tanda.'
- source_word: לְאוֹת
  choice: tanda
  rationale: Mempertahankan arti luas sebagai tanda atau penanda tanpa menentukan apakah wujudnya harfiah atau simbolis.
- source_word: עַל יָדְךָ
  choice: pada tanganmu
  rationale: Menerjemahkan gambaran Ibrani secara langsung dan tidak memaksakan kaitan dengan praktik ritual yang berkembang kemudian.
- source_word: וּלְזִכָּרוֹן
  choice: pengingat
  rationale: זִכָּרוֹן menunjuk pada sesuatu yang membuat orang mengingat; 'pengingat' alami dalam bahasa Indonesia modern dan tetap mempertahankan fungsi peringatannya.
- source_word: בֵּין עֵינֶיךָ
  choice: di antara kedua matamu
  rationale: Mempertahankan ungkapan konkret dalam teks Ibrani; kemungkinan makna idiomatisnya dijelaskan dalam catatan kaki.
- source_word: לְמַעַן
  choice: supaya
  rationale: Secara alami menyatakan tujuan dalam bahasa Indonesia.
- source_word: תּוֹרַת יְהוָה
  choice: hukum Yahweh
  rationale: תּוֹרָה dapat berarti hukum atau pengajaran. 'Hukum' sesuai dengan konteks perjanjian, sedangkan alternatifnya dicatat.
- source_word: בְּפִיךָ
  choice: ada di mulutmu
  rationale: Menjaga citra harfiah sumber yang mengarah pada pengucapan atau pembacaan berulang.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan dasar bagi tujuan peringatan tersebut.
- source_word: בְּיָד חֲזָקָה
  choice: dengan tangan yang kuat
  rationale: Terjemahan dekat atas ungkapan Ibrani yang menekankan kuasa Yahweh dalam pembebasan.
- source_word: הוֹצִאֲךָ
  choice: membawa engkau keluar
  rationale: Hifil dari יצא secara tepat berarti menyebabkan keluar atau membawa keluar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama pribadi, bukan menggantinya dengan gelar.
theological_decisions:
- issue: Apakah bahasa tentang tangan dan mata harus ditafsirkan sebagai praktik tefilin yang muncul kemudian
  choice: Mempertahankan gambaran harfiah 'pada tanganmu' dan 'di antara kedua matamu'.
  alternative: Menafsirkannya sebagai 'diikat pada lenganmu' dan 'pada dahimu', atau memparafrasakannya semata-mata sebagai ingatan batin.
  rationale: Teks menyajikan gambaran konkret tanpa menyebut benda ritual tertentu; terjemahan literal menjaga keterbukaan antara pemahaman simbolis dan fisik.
- issue: Makna תּוֹרָה dalam konteks ini
  choice: hukum
  alternative: pengajaran atau Taurat
  rationale: '''Hukum'' cocok dengan konteks perjanjian dan berada dalam cakupan makna kata tersebut, tetapi ''pengajaran'' tetap merupakan kemungkinan yang sah dan dicatat.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti tunggal 'engkau' dipakai karena bentuk Ibrani berjenis orang kedua tunggal. Susunan konkret sumber dipertahankan jika dapat dipahami, sementara alternatif leksikal penting ditempatkan dalam catatan kaki.
