  yaml_path: translation/ot/exodus/013/020.yaml
  text: They set out from Succoth and camped at Etham, on the edge of the wilderness.
translation:
  language: id
  text: Mereka berangkat dari Sukot, lalu berkemah di Etam, di tepi padang belantara.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Bentuk wayyiqtol jamak dari נסע menyatakan tindakan berikutnya dalam narasi, yakni membongkar perkemahan dan mulai menempuh perjalanan. 'Berangkat' alami dalam bahasa Indonesia modern dan mempertahankan gagasan bergerak dari suatu tempat.
- source_word: מִסֻּכֹּת
  choice: dari Sukot
  rationale: Nama tempat סֻכּוֹת dengan preposisi מִן, 'dari'. Nama itu ditransliterasikan sebagai 'Sukot', bentuk yang wajar dalam bahasa Indonesia.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Kata חנה berarti 'berkemah'. 'Lalu' menandai kelanjutan tindakan naratif secara alami tanpa mengubah urutannya.
- source_word: בְאֵתָם
  choice: di Etam
  rationale: Preposisi בְ menyatakan lokasi. 'Di Etam' merupakan ungkapan lokatif yang alami dalam bahasa Indonesia.
- source_word: בִּקְצֵה
  choice: di tepi
  rationale: קָצֶה dapat menunjuk ujung, tepi, atau batas. Dalam konteks geografis ini, 'di tepi' alami dan tidak menentukan secara berlebihan apakah yang dimaksud batas resmi atau sekadar bagian terluar.
- source_word: הַמִּדְבָּר
  choice: padang belantara
  rationale: מִדְבָּר menunjuk kawasan liar atau tanah terbuka yang jarang dihuni, tidak selalu gurun pasir. 'Padang belantara' mempertahankan keluasan makna tersebut dan lebih tepat daripada 'gurun' yang dapat memberi gambaran medan terlalu khusus.
