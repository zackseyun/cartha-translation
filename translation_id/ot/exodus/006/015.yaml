    rationale: Makna gender dari בֶּן tetap jelas dalam daftar putra Simeon, sedangkan “Shaul, anak dari perempuan Kanaan itu” lebih wajar dan tetap mempertahankan bahwa ibunya adalah seorang perempuan Kanaan tertentu.
