base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/015.yaml
  text: 'And the sons of Simeon: Jemuel[a], and Jamin, and Ohad, and Jakin, and Zohar, and Shaul the son of the Canaanite woman. These are the clans of Simeon.'
translation:
  language: id
  text: Anak-anak Simeon ialah Yemuel, Yamin, Ohad, Yakhin, Zohar, dan Shaul, anak dari perempuan Kanaan itu. Inilah kaum-kaum Simeon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי שִׁמְעוֹן
  choice: Anak-anak Simeon ialah
  rationale: בְּנֵי adalah bentuk jamak terikat dari 'anak laki-laki'; dalam daftar silsilah, 'anak-anak Simeon' alami dan tepat. Kopula 'ialah' memperkenalkan daftar dengan bahasa Indonesia yang jelas; waw melanjutkan silsilah dan tidak harus diterjemahkan secara mekanis sebagai 'dan' pada awal ayat.
- source_word: יְמוּאֵל
  choice: Yemuel
  rationale: Transliterasi langsung dari bentuk Ibrani, dengan yod direpresentasikan sebagai 'Y' menurut kebiasaan Indonesia.
- source_word: וְיָמִין
  choice: Yamin
  rationale: Nama diri ditransliterasikan dari Ibrani; konjungsi waw diungkapkan melalui tata daftar bahasa Indonesia dan 'dan' sebelum unsur terakhir.
- source_word: וְאֹהַד
  choice: Ohad
  rationale: Transliterasi langsung dan mudah dibaca dalam bahasa Indonesia.
- source_word: וְיָכִין
  choice: Yakhin
  rationale: Transliterasi mencerminkan yod awal sebagai 'Y' dan huruf kaf frikatif sebagai 'kh', sesuai kebiasaan transliterasi Indonesia.
- source_word: וְצֹחַר
  choice: Zohar
  rationale: Bentuk nama yang alami dalam ejaan Indonesia dan cukup dekat dengan Ibrani.
- source_word: וְשָׁאוּל
  choice: Shaul
  rationale: Mempertahankan bentuk nama Ibrani secara langsung; tidak diperlukan catatan alternatif karena 'Saul' bukan bentuk baku yang perlu dipaksakan dalam bahasa Indonesia.
- source_word: בֶּן הַכְּנַעֲנִית
  choice: anak laki-laki dari perempuan Kanaan itu
  rationale: Bentuk feminin הַכְּנַעֲנִית secara eksplisit menunjuk seorang perempuan Kanaan. 'Anak laki-laki' mempertahankan makna בֵּן, sedangkan artikel tertentu dicerminkan oleh 'itu'.
- source_word: אֵלֶּה מִשְׁפְּחֹת שִׁמְעוֹן
  choice: Mereka inilah kaum-kaum keturunan Simeon
  rationale: אֵלֶּה bersifat deiktis dan dirujukkan kepada orang-orang yang baru disebut. מִשְׁפְּחֹת dalam konteks kesukuan berarti kelompok-kelompok kekerabatan; 'kaum-kaum keturunan' lebih jelas bagi pembaca Indonesia modern daripada sekadar 'keluarga-keluarga'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama-nama ditransliterasikan sedekat mungkin dari Ibrani dengan pola ejaan Indonesia. Pengulangan waw dalam daftar tidak diterjemahkan satu per satu agar kalimat tetap alami, tetapi hubungan koordinatifnya dipertahankan.
