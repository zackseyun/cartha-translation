  text: וַ/יְדַבֵּ֥ר אֱלֹהִ֖ים אֶל מֹשֶׁ֑ה וַ/יֹּ֥אמֶר אֵלָ֖י/ו אֲנִ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/002.yaml
  text: God spoke to Moses and said to him[a], “I am Yahweh.”
translation:
  language: id
  text: Allah berbicara kepada Musa dan berkata kepadanya, “Akulah Yahweh.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berbicara
  rationale: Bentuk naratif dari דבר memperkenalkan perkataan ilahi; “berbicara” merupakan padanan Indonesia yang alami dan tetap dekat dengan bentuk Ibrani.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk katanya secara morfologis jamak, verba tunggal menunjukkan bahwa yang dimaksud ialah Allah Israel; “Allah” adalah sebutan baku dalam bahasa Indonesia.
- source_word: אֶל־מֹשֶׁה
  choice: kepada Musa
  rationale: Preposisi אֶל menandai pihak yang dituju dalam tuturan, dan nama מֹשֶׁה ditulis menurut bentuk Indonesia yang lazim.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: dan berkata kepadanya
  rationale: Terjemahan ini mempertahankan verba tuturan kedua serta pronomina yang merujuk kepada Musa, tanpa menghilangkan pengulangan naratif Ibrani.
- source_word: אֲנִי
  choice: Akulah
  rationale: Pronomina mandiri bersifat tegas dalam klausa nominal. Bentuk “Akulah” secara alami menyampaikan penekanan identifikasi diri dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi berhuruf empat dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung. “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar; vokalisasi nama itu tidak sepenuhnya pasti, tetapi bentuk ini merupakan rekonstruksi yang umum.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Dua verba tuturan dipertahankan sesuai susunan Ibrani. “Akulah” dipilih untuk menyampaikan penekanan pada אֲנִי secara alami.
