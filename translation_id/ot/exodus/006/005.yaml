  text: וְ/גַ֣ם אֲנִ֣י שָׁמַ֗עְתִּי אֶֽת נַאֲקַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר מִצְרַ֖יִם מַעֲבִדִ֣ים אֹתָ֑/ם וָ/אֶזְכֹּ֖ר אֶת בְּרִיתִֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/005.yaml
  text: And I also have heard the groaning of the sons of Israel[a], whom the Egyptians are enslaving[b], and I have remembered my covenant.
translation:
  language: id
  text: Aku juga telah mendengar rintihan orang Israel[a], yang sedang diperbudak oleh orang Mesir, dan Aku telah mengingat perjanjian-Ku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Israel”; dapat juga diterjemahkan “bangsa Israel.”'
    reason: lexical_alternative
  - marker: b
    text: “Mengingat” di sini adalah bahasa perjanjian. Maksudnya bukan bahwa Allah pernah lupa, melainkan bahwa Ia berpaling untuk bertindak sesuai dengan perjanjian-Nya.
    reason: cultural_note
lexical_decisions:
- source_word: וְגַם אֲנִי
  choice: Aku juga
  rationale: Mempertahankan unsur penambahan וְגַם dan penekanan dari pronomina eksplisit אֲנִי dengan susunan yang alami dalam bahasa Indonesia.
- source_word: שָׁמַעְתִּי
  choice: telah mendengar
  rationale: Bentuk perfektif menyatakan tindakan yang sudah terjadi dan tetap relevan dalam perkataan ilahi ini.
- source_word: נַאֲקַת
  choice: keluhan pilu
  rationale: Mengungkapkan rintihan atau keluhan yang lahir dari penderitaan berat tanpa memakai ungkapan yang terlalu arkais.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan Ibrani harfiah 'anak-anak Israel' berfungsi secara korporat bagi umat Israel; 'orang Israel' alami, jelas, dan tidak membatasi rujukan hanya kepada laki-laki.
- source_word: מִצְרַיִם מַעֲבִדִים אֹתָם
  choice: yang diperbudak oleh orang Mesir
  rationale: Partisipel Hifil dari עבד menunjukkan bahwa orang Mesir memaksa mereka bekerja sebagai budak; bentuk pasif Indonesia menjaga orang Israel sebagai acuan klausa relatif.
- source_word: וָאֶזְכֹּר
  choice: dan Aku telah mengingat
  rationale: Mempertahankan idiom perjanjian dalam teks, dengan bentuk yang menghubungkan tindakan mengingat itu kepada respons Allah yang segera.
- source_word: בְּרִיתִי
  choice: perjanjian-Ku
  rationale: Padanan baku dan tepat bagi בְּרִית dalam konteks hubungan perjanjian Allah.
theological_decisions:
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel; bangsa Israel
  rationale: Frasa sumber secara harfiah berarti 'anak-anak Israel', tetapi di sini menunjuk seluruh umat secara korporat. Terjemahan utama mengutamakan kejelasan modern, sementara bentuk harfiah dicatat dalam catatan kaki.
- issue: Makna Allah 'mengingat' perjanjian
  choice: Aku telah mengingat perjanjian-Ku
  alternative: Aku bertindak sesuai dengan perjanjian-Ku
  rationale: Idiom Alkitab dipertahankan agar bahasa dan ketegangan teologis teks tidak diuraikan secara berlebihan. Catatan menjelaskan bahwa ini bukan menyiratkan Allah sebelumnya lupa.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Susunan kalimat mempertahankan rangkaian tiga tindakan dalam ucapan ilahi: mendengar, umat diperbudak, dan mengingat perjanjian.'
