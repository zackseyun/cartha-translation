base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/025.yaml
  text: And Eleazar son of Aaron took for himself a wife from the daughters of Putiel[a], and she bore him Phinehas[b]. These are the heads of the fathers’ houses of the Levites by their clans.
translation:
  language: id
  text: Eleazar anak Harun mengambil seorang istri dari antara anak-anak perempuan Putiel[a]. Perempuan itu melahirkan Pinehas baginya. Inilah para kepala kaum keluarga orang Lewi menurut kaum-kaum mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari anak-anak perempuan Putiel”; ungkapan Ibrani ini menyatakan bahwa Eleazar mengambil istri dari keluarga Putiel tanpa menyebut anak perempuan yang mana.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kepala-kepala para leluhur”; ini adalah istilah kekerabatan bagi para pemimpin kelompok keluarga menurut garis leluhur di antara kaum-kaum Lewi.
    reason: cultural_note
lexical_decisions:
- source_word: לָקַח לוֹ ... לְאִשָּׁה
  choice: mengambil seorang istri
  rationale: Ungkapan ini mempertahankan idiom perkawinan Ibrani secara cukup dekat, tetapi tetap wajar dan mudah dipahami dalam bahasa Indonesia.
- source_word: מִבְּנוֹת פּוּטִיאֵל
  choice: dari antara anak-anak perempuan Putiel
  rationale: Preposisi מִן menyatakan asal atau keanggotaan dalam suatu kelompok. Ungkapan ini mempertahankan gaya silsilah dan tidak menentukan lebih jauh perempuan mana yang dimaksud.
- source_word: וַתֵּלֶד לוֹ אֶת־פִּינְחָס
  choice: Perempuan itu melahirkan Pinehas baginya
  rationale: Bentuk verba feminin tunggal menunjuk kepada istri Eleazar sebagai subjek, sedangkan 'baginya' mempertahankan pronomina datif לוֹ yang merujuk kepada Eleazar.
- source_word: אֵלֶּה
  choice: Inilah
  rationale: Demonstrativa ini memperkenalkan identifikasi penutup dalam silsilah; 'Inilah' berfungsi alami dalam bahasa Indonesia.
- source_word: רָאשֵׁי אֲבוֹת
  choice: para kepala kaum leluhur
  rationale: Istilah kekerabatan ini menunjuk kepada para pemimpin kelompok rumah tangga berdasarkan garis leluhur, bukan sekadar para ayah biologis.
- source_word: הַלְוִיִּם
  choice: orang Lewi
  rationale: Dalam konteks ini istilah tersebut menunjuk kepada kelompok keturunan Lewi; 'orang Lewi' adalah bentuk Indonesia yang lazim.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum-kaum mereka
  rationale: Dalam konteks silsilah, מִשְׁפָּחָה menunjuk kepada kelompok kekerabatan atau kaum. Bentuk ulang menyampaikan jamak Ibrani secara jelas.
- source_word: אֶלְעָזָר / אַהֲרֹן / פּוּטִיאֵל / פִּינְחָס
  choice: Eleazar / Harun / Putiel / Pinehas
  rationale: Nama-nama pribadi memakai bentuk yang lazim dalam tradisi bahasa Indonesia, dengan transliterasi bagi nama yang tidak memiliki bentuk Indonesia khusus.
