  text: וְ/לָקַחְתִּ֨י אֶתְ/כֶ֥ם לִ/י֙ לְ/עָ֔ם וְ/הָיִ֥יתִי לָ/כֶ֖ם לֵֽ/אלֹהִ֑ים וִֽ/ידַעְתֶּ֗ם כִּ֣י אֲנִ֤י יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם הַ/מּוֹצִ֣יא אֶתְ/כֶ֔ם מִ/תַּ֖חַת סִבְל֥וֹת מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/007.yaml
  text: And I will take you to be my people[a], and I will be your God, and you will know that I am Yahweh your God[b], who brought you out from under the burdens of Egypt.
translation:
  language: id
  text: Aku akan mengambil kamu sebagai umat-Ku, dan Aku akan menjadi Allahmu. Kamu akan mengetahui bahwa Akulah Yahweh, Allahmu, yang membawa kamu keluar dari bawah beban Mesir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang telah membawa kamu keluar dari bawah beban Mesir.” Kata Ibrani yang diterjemahkan “membawa” berbentuk partisipel dan dapat menyoroti tindakan Yahweh sebagai ciri-Nya atau tindakan pembebasan yang dipandang telah terlaksana. “Beban” juga dapat diterjemahkan “beban kerja paksa.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתִּי אֶתְכֶם לִי לְעָם
  choice: Aku akan mengambil kamu menjadi umat-Ku
  rationale: Rangkaian janji memberi bentuk perfek berwaw ini makna mendatang. Ungkapan ini mempertahankan tindakan ilahi dan hubungan kepunyaan/perjanjian yang dinyatakan oleh לִי לְעָם, dengan susunan Indonesia yang wajar.
- source_word: וְהָיִיתִי לָכֶם לֵאלֹהִים
  choice: Aku akan menjadi Allahmu
  rationale: Ini merupakan rumusan hubungan perjanjian. 'Menjadi Allahmu' alami dalam bahasa Indonesia dan mempertahankan unsur relasional konstruksi Ibrani.
- source_word: וִידַעְתֶּם
  choice: Kamu akan mengetahui
  rationale: Bentuk mendatang dipertahankan; verba ini dapat mencakup pengetahuan sekaligus pengakuan berdasarkan pengalaman tanpa mempersempitnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan, bukan diganti dengan gelar, agar nama pribadi dalam teks sumber tetap tampak.
- source_word: הַמּוֹצִיא
  choice: yang membawa kamu keluar
  rationale: Partisipel Ibrani menggambarkan Yahweh sebagai Pelaku pembebasan. Bentuk Indonesia ini mempertahankan ketidakpastian apakah sorotannya pada tindakan yang sedang/berciri khas atau tindakan pembebasan yang dipandang sebagai identitas-Nya; alternatif lampau dicatat.
- source_word: מִתַּחַת סִבְלֹת מִצְרָיִם
  choice: dari bawah beban kerja paksa Mesir
  rationale: '''Dari bawah'' mempertahankan citra penindasan dalam מִתַּחַת. ''Beban kerja paksa'' menyampaikan sekaligus gagasan beban dan konteks kerja paksa pada סִבְלֹת, sedangkan genitif ''Mesir'' dibiarkan seluas teks sumber.'
theological_decisions:
- issue: Rumusan perjanjian
  choice: Aku akan mengambil kamu menjadi umat-Ku, dan Aku akan menjadi Allahmu
  alternative: Aku akan mengambil kamu bagi-Ku sebagai suatu umat, dan Aku akan menjadi Allah bagi kamu
  rationale: Pilihan utama menyampaikan hubungan kepunyaan dan perjanjian secara alami tanpa memasukkan sistem teologis yang lebih kemudian.
- issue: Penerjemahan nama ilahi
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks sumber memakai Tetragramaton sebagai nama; transliterasi 'Yahweh' mempertahankan fungsi itu.
- issue: Nilai waktu partisipel הַמּוֹצִיא
  choice: yang membawa kamu keluar
  alternative: yang telah membawa kamu keluar
  rationale: Partisipel tidak dengan sendirinya menetapkan kala. Pilihan utama menjaga daya karakteristik/tindakan pembebasan, sementara pembacaan sebagai tindakan yang telah selesai dari sudut hasil janji tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Pronomina ilahi ditulis dengan huruf kapital menurut kebiasaan penerbitan Alkitab Indonesia. 'Kamu' dipakai bagi orang kedua jamak karena konteksnya seluruh Israel; kepunyaan jamak tersampaikan secara idiomatis dalam 'umat-Ku' dan 'Allahmu'.
