- from: Aku akan mengambil kamu menjadi umat-Ku, dan Aku akan menjadi Allahmu. Kamu akan mengetahui bahwa Akulah Yahweh, Allahmu, yang membawa kamu keluar dari bawah beban kerja paksa Mesir.[a]
  to: Aku akan mengambil kamu sebagai umat-Ku, dan Aku akan menjadi Allahmu. Kamu akan mengetahui bahwa Akulah Yahweh, Allahmu, yang membawa kamu keluar dari bawah beban Mesir.[a]
