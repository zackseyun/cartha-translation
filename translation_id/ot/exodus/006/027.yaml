base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/027.yaml
  text: These are the ones who spoke to Pharaoh king of Egypt to bring the sons of Israel out of Egypt—this is Moses and Aaron[a][b].
translation:
  language: id
  text: Merekalah yang berbicara[a] kepada Firaun, raja Mesir, untuk membawa bani Israel[b] keluar dari Mesir. Mereka itulah Musa dan Harun.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “yang sedang berbicara.” Bahasa Ibrani memakai bentuk partisipel yang mencirikan mereka melalui tindakan yang berlangsung atau berulang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “putra-putra Israel”; ungkapan ini menunjuk kepada bani atau keturunan Israel.
    reason: lexical_alternative
  - marker: c
    text: Teks Ibrani memakai pronomina tunggal sebelum menyebut Musa dan Harun. Terjemahan Indonesia memakai bentuk jamak agar rujukannya jelas dan alami.
    reason: source_ambiguity
lexical_decisions:
- source_word: הֵם
  choice: Merekalah
  rationale: Pronomina mandiri ini menegaskan identitas orang-orang yang telah disebut sebelumnya. Bentuk “merekalah” menyampaikan penekanan itu secara alami dalam bahasa Indonesia.
- source_word: הַמְדַבְּרִים
  choice: yang berbicara
  rationale: Partisipel ini berfungsi secara substantival dan mencirikan Musa serta Harun melalui tindakan mereka terhadap Firaun. Klausa relatif ini alami dalam bahasa Indonesia tanpa membatasi maknanya pada satu ujaran saja.
- source_word: אֶל
  choice: kepada
  rationale: Dengan verba “berbicara”, preposisi ini secara alami menunjukkan pihak yang dituju.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: Firaun, raja Mesir
  rationale: Koma menandai “raja Mesir” sebagai keterangan aposisional bagi Firaun, sesuai struktur Ibrani dan kaidah bahasa Indonesia.
- source_word: לְהוֹצִיא
  choice: untuk membawa ... keluar
  rationale: Bentuk Hifil dari יצא bersifat kausatif, yakni menyebabkan seseorang keluar. “Membawa ... keluar” mempertahankan unsur kausatif tanpa menambahkan gagasan khusus seperti memimpin perjalanan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: “Bani Israel” merupakan ungkapan baku dan mudah dikenali dalam bahasa Indonesia untuk kelompok keturunan Israel. Catatan kaki mempertahankan transparansi terhadap bentuk harfiah Ibrani, “putra-putra Israel”.
- source_word: מִמִּצְרָיִם
  choice: keluar dari Mesir
  rationale: Padanan ini alami bersama verba “membawa ... keluar” dan mempertahankan gambaran eksodus dari wilayah Mesir.
- source_word: הוּא
  choice: Dialah
  rationale: Teks Ibrani beralih kepada pronomina tunggal yang menegaskan identitas, meskipun kemudian menyebut dua nama. Terjemahan mempertahankan ketegangan gramatikal tersebut dan menjelaskannya dalam catatan kaki.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Musa dan Harun
  rationale: Menggunakan bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
theological_decisions:
- issue: Pronomina tunggal הוּא di depan dua nama
  choice: Dialah Musa dan Harun
  alternative: Merekalah Musa dan Harun
  rationale: Bentuk tunggal dalam teks Masoret tidak diselaraskan diam-diam menjadi jamak. Catatan kaki memberitahukan kejanggalan gramatikal ini tanpa menetapkan alasan teologis atau penafsiran tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Firaun” serta “bani Israel” dipilih sebagai bentuk baku yang dikenal luas. Ketegangan antara pronomina tunggal dan dua nama dipertahankan, bukan diperhalus tanpa penjelasan.
