  choice: Lalu ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi. Dalam konteks perkataan ilahi, “berfirman” merupakan padanan Indonesia yang alami dan bermartabat bagi דבר.
- source_word: יְהוָה
