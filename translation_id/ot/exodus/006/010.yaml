  rationale: Preposisi אֶל menunjukkan arah perkataan, dan “kepada Musa” adalah ungkapan Indonesia yang wajar.
- source_word: לֵאמֹר
  choice: kata-Nya
  rationale: Infinitif לֵאמֹר memperkenalkan perkataan langsung. “Kata-Nya” mempertahankan fungsi formula tersebut dalam bahasa Indonesia yang alami; sufiks hormat merujuk kepada Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama tersebut secara langsung tanpa menggantinya dengan gelar, sedangkan bentuk alternatif dicatat dalam catatan kaki.
