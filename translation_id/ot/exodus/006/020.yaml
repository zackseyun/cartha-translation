base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/020.yaml
  text: Amram took Jochebed[a], his father’s sister, as his wife, and she bore to him Aaron and Moses. The years of Amram’s life were 137 years.
translation:
  language: id
  text: Amram mengambil Yokhebed, bibinya,[a] sebagai istrinya, dan Yokhebed melahirkan baginya Harun dan Musa. Lamanya hidup Amram adalah 137 tahun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih khusus, “saudara perempuan ayahnya,” jika istilah kekerabatan ini dipahami dalam arti yang lebih sempit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: Mempertahankan idiom Ibrani לקח dalam konteks perkawinan; bersama frasa 'menjadi istrinya', bentuk ini tetap jelas dan wajar dalam bahasa Indonesia.
- source_word: דֹּדָתוֹ
  choice: bibinya
  rationale: Bentuk feminin dari istilah kekerabatan דּוֹד menunjuk kepada kerabat perempuan yang secara wajar disebut 'bibi'; ayat ini sendiri tidak menyatakan secara eksplisit dari pihak ayah atau ibu.
- source_word: לְאִשָּׁה
  choice: menjadi istrinya
  rationale: Menyatakan hubungan perkawinan secara alami dalam bahasa Indonesia sambil tetap mengikuti konstruksi Ibrani.
- source_word: וַתֵּלֶד לוֹ
  choice: melahirkan ... baginya
  rationale: Mencerminkan verba ילד dan objek tak langsung לוֹ tanpa membuat ungkapan Indonesia menjadi kabur.
- source_word: שְׁנֵי חַיֵּי
  choice: Umur ...
  rationale: Ungkapan ringkas dan alami dalam bahasa Indonesia untuk rumus Ibrani yang menyatakan lamanya hidup.
- source_word: שֶׁבַע וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: 137 tahun
  rationale: Menyampaikan nilai angka Ibrani secara tepat dalam bentuk modern dan mudah dibaca.
- source_word: יוֹכֶבֶד / אַהֲרֹן / מֹשֶׁה / עַמְרָם
  choice: Yokhebed / Harun / Musa / Amram
  rationale: Mengikuti bentuk nama yang lazim dan dikenali dalam tradisi Alkitab bahasa Indonesia, dengan 'Yokhebed' yang cukup dekat dengan bentuk Ibrani.
theological_decisions:
- issue: Istilah kekerabatan dekat dalam laporan tentang perkawinan yang kemudian dilarang dalam hukum Taurat
  choice: bibinya
  alternative: saudara perempuan ayahnya
  rationale: Ayat ini melaporkan silsilah tanpa penilaian moral eksplisit. 'Bibinya' menyampaikan hubungan dekat tersebut tanpa mempersempit makna melebihi apa yang dinyatakan secara eksplisit oleh istilah dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara idiom perkawinan, hubungan kekerabatan, dan angka umur tetap dekat dengan teks Ibrani.
