  terminology: “Bibinya” adalah padanan yang tepat dan tidak memaksakan spesifikasi garis ayah. Catatan kaki secara tepat mempertahankan kemungkinan arti sempit “saudara perempuan ayahnya.” Nama Amram, Yokhebed, Harun, dan Musa sesuai pemakaian Indonesia yang lazim.
