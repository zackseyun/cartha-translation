lexical_decisions:
- source_word: וַיְהִי
  choice: Terjadilah
  rationale: Bentuk wayyiqtol dari היה menandai peralihan narasi. “Terjadilah” mempertahankan gagasan terjadinya sesuatu dan sesuai dengan bentuk pengantar ayat ini, sedangkan daya hubung waw dapat dipahami dari konteks.
- source_word: בְּיוֹם
  choice: pada hari ketika
  rationale: Ungkapan harfiah “pada hari” dipertahankan, dan “ketika” menghubungkannya secara wajar dengan klausa berikut dalam bahasa Indonesia.
- source_word: דִּבֶּר
  choice: berbicara
  rationale: דבר berarti “berbicara”; bersama preposisi אֶל, konstruksinya secara alami menjadi “berbicara kepada Musa”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap tampak, bukan diganti dengan gelar.
- source_word: אֶל
  choice: kepada
  rationale: Padanan Indonesia yang lazim untuk preposisi ini dalam konstruksi “berbicara kepada Musa”.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: di tanah Mesir
  rationale: Kata אֶרֶץ (“tanah/negeri”) dinyatakan secara eksplisit, sehingga ungkapan sumber tidak dipadatkan hanya menjadi “di Mesir”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi sebagai nama pribadi dan menghindari penggantiannya dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Tanda pisah mempertahankan sifat ayat yang menggantung dan berlanjut ke ayat berikutnya; ketegangan sintaksis itu tidak dilancarkan dengan menambahkan materi yang tidak terdapat dalam teks.
