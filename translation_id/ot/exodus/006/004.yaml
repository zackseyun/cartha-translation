  text: וְ/גַ֨ם הֲקִמֹ֤תִי אֶת בְּרִיתִ/י֙ אִתָּ֔/ם לָ/תֵ֥ת לָ/הֶ֖ם אֶת אֶ֣רֶץ כְּנָ֑עַן אֵ֛ת אֶ֥רֶץ מְגֻרֵי/הֶ֖ם אֲשֶׁר גָּ֥רוּ בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/004.yaml
  text: I also established my covenant with them[a], to give them the land of Canaan, the land where they lived as sojourners.
translation:
  language: id
  text: Aku juga telah menegakkan perjanjian-Ku dengan mereka untuk memberikan kepada mereka tanah Kanaan, tanah tempat mereka tinggal sebagai pendatang, yang di dalamnya mereka menetap sebagai pendatang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “tanah tempat tinggal mereka sebagai pendatang, yang di dalamnya mereka tinggal sebagai pendatang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Aku juga
  rationale: Menyampaikan daya tambah וְגַם secara wajar dan menghubungkan pernyataan ini dengan penyataan diri Allah dalam konteks sebelumnya.
- source_word: הֲקִמֹתִי
  choice: menegakkan
  rationale: Dalam konstruksi dengan בְּרִית, kata ini menyatakan tindakan menetapkan atau memberlakukan perjanjian secara kokoh; “menegakkan” mempertahankan ungkapan perjanjian tanpa menyiratkan bahwa perjanjian itu sekadar diperbarui.
- source_word: בְּרִיתִי
  choice: perjanjian-Ku
  rationale: Padanan baku bagi istilah perjanjian; sufiks milik orang pertama dipertahankan secara eksplisit.
- source_word: אִתָּם
  choice: dengan mereka
  rationale: Menerjemahkan preposisi relasional beserta sufiksnya secara langsung; “mereka” merujuk kepada para leluhur dalam konteks.
- source_word: לָתֵת לָהֶם
  choice: untuk memberikan kepada mereka
  rationale: Infinitif menyatakan tujuan, sedangkan objek tidak langsung diterjemahkan secara eksplisit agar hubungan antarklausa jelas.
- source_word: אֶרֶץ כְּנָעַן
  choice: tanah Kanaan
  rationale: Mempertahankan baik nomina אֶרֶץ maupun nama diri Kanaan dalam ungkapan Indonesia yang alami.
- source_word: אֶרֶץ מְגֻרֵיהֶם
  choice: tanah tempat mereka tinggal sebagai pendatang
  rationale: מָגוּר menunjuk pada tempat atau keadaan bermukim sebagai orang asing/pendatang, bukan kepemilikan tetap. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan status mereka sebagai pendatang.
- source_word: אֲשֶׁר גָּרוּ בָהּ
  choice: tempat mereka tinggal sebagai pendatang
  rationale: גור berarti menetap sebagai orang asing atau pendatang. Terjemahan ini menyampaikan status sosial yang terkandung dalam verba dan menghindari kesan bahwa mereka telah memiliki tanah itu.
theological_decisions:
- issue: Ungkapan perjanjian קום + ברית
  choice: menegakkan perjanjian-Ku
  alternative: meneguhkan perjanjian-Ku
  rationale: “Menegakkan” menyatakan tindakan Allah memberlakukan perjanjian-Nya secara kokoh, tanpa memaksakan pembedaan teologis antara pembentukan dan pengukuhan perjanjian yang tidak dinyatakan secara tegas oleh bentuk Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah “pendatang” dipilih agar mudah dipahami sekaligus menunjukkan bahwa para leluhur bermukim di Kanaan tanpa memilikinya sebagai tanah tetap. Penanda catatan kaki ditempatkan pada frasa yang diterangkannya.
