base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/014.yaml
  text: 'These are the heads of their fathers’ houses: the sons of Reuben[a], the firstborn of Israel: Hanoch and Pallu, Hezron and Carmi. These are the clans of Reuben.'
translation:
  language: id
  text: 'Inilah para kepala kaum keluarga mereka: anak-anak Ruben, anak sulung Israel, ialah Henokh, Palu, Hezron, dan Karmi. Inilah kaum-kaum Ruben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה רָאשֵׁי בֵית אֲבֹתָם
  choice: Inilah para kepala kaum leluhur mereka
  rationale: Mempertahankan fungsi penunjuk pembuka daftar dan kedudukan רָאשֵׁי sebagai para pemimpin atau kepala unit kekerabatan. 'Kaum leluhur' menyampaikan בית אבות secara alami dalam bahasa Indonesia tanpa menyempitkannya menjadi keluarga inti.
- source_word: בְּנֵי רְאוּבֵן
  choice: anak-anak Ruben
  rationale: Daftar ini menyebut anak-anak langsung Ruben, sehingga 'anak-anak' lebih tepat daripada 'keturunan'.
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: anak sulung Israel
  rationale: Frasa aposisional ini mengidentifikasi Ruben sebagai anak sulung Israel dan mempertahankan gaya silsilah yang ringkas.
- source_word: חֲנוֹךְ וּפַלּוּא חֶצְרוֹן וְכַרְמִי
  choice: Henokh, Palu, Hezron, dan Karmi
  rationale: Menggunakan bentuk nama yang lazim dan mudah dikenali dalam bahasa Indonesia, dengan ejaan yang cukup dekat dengan bentuk Ibrani.
- source_word: מִשְׁפְּחֹת רְאוּבֵן
  choice: kaum-kaum Ruben
  rationale: מִשְׁפְּחֹת dalam konteks kesukuan menunjuk kelompok-kelompok kekerabatan di bawah suku; 'kaum-kaum' lebih tepat daripada 'keluarga-keluarga' yang dalam pemakaian modern dapat dipahami sebagai keluarga inti.
