id: EXO.6.11
reference: Exodus 6:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בֹּ֣א דַבֵּ֔ר אֶל פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם וִֽ/ישַׁלַּ֥ח אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אַרְצֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/011.yaml
  text: Go[a], speak to Pharaoh king of Egypt, that he may let the sons of Israel go out from his land.
translation:
  language: id
  text: Pergilah, berbicaralah kepada Firaun, raja Mesir, supaya ia membiarkan Bani Israel[a] keluar dari negerinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “orang Israel” atau “anak-anak Israel.” Secara harfiah, teks Ibrani berbunyi “anak-anak lelaki Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּא
  choice: Pergilah
  rationale: Bentuk imperatif dari בוא dapat berarti “datang” atau “pergi” menurut sudut pandang konteks. Karena Musa diperintahkan menghadap Firaun, “Pergilah” merupakan ungkapan bahasa Indonesia yang paling wajar.
- source_word: דַבֵּר אֶל
  choice: berbicaralah kepada
  rationale: Imperatif Piel דַבֵּר dengan אֶל menunjuk pada tindakan berbicara kepada seorang penerima. Pilihan ini mempertahankan bentuk perintah dan tidak menambahkan isi ujaran yang tidak dinyatakan secara eksplisit.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: Firaun, raja Mesir
  rationale: Frasa ini merupakan aposisi yang mengidentifikasi Firaun sebagai raja Mesir. Tanda koma membuat hubungan tersebut jelas dan alami dalam bahasa Indonesia.
- source_word: וִישַׁלַּח
  choice: supaya ia membiarkan ... keluar
  rationale: 'Bentuk verba berawalan waw sesudah rangkaian imperatif menyatakan hasil atau tujuan yang dikehendaki: Firaun harus melepaskan Israel. “Membiarkan ... keluar” sesuai dengan konteks keluarnya Israel dari Mesir tanpa menjadikannya sekadar ramalan.'
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: Bani Israel
  rationale: בְּנֵי יִשְׂרָאֵל secara harfiah berarti “anak-anak lelaki Israel,” tetapi dalam konteks ini merupakan sebutan kolektif bagi keturunan atau bangsa Israel. “Bani Israel” mempertahankan nuansa keturunan sekaligus menjadi ungkapan Indonesia yang dikenal.
- source_word: מֵאַרְצוֹ
  choice: dari negerinya
  rationale: אֶרֶץ di sini menunjuk pada wilayah kekuasaan Firaun, yakni Mesir. “Negerinya” alami dalam bahasa Indonesia dan akhiran -nya tetap merujuk kepada Firaun.
theological_decisions:
- issue: Cakupan ungkapan בְּנֵי יִשְׂרָאֵל
  choice: Bani Israel
  alternative: orang Israel; anak-anak Israel; secara harfiah, anak-anak lelaki Israel
  rationale: Ungkapan ini adalah sebutan kolektif bagi umat Israel, bukan hanya laki-laki. “Bani Israel” menjaga citra hubungan keturunan dalam teks Ibrani tanpa membatasi kelompok itu secara keliru, sedangkan catatan kaki mempertahankan bentuk harfiahnya.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Pengulangan bentuk imperatif “Pergilah, berbicaralah” mempertahankan dua perintah Ibrani, sementara “supaya” menyampaikan tujuan atau hasil yang dikehendaki secara alami.
