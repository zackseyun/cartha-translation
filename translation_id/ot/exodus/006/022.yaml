  text: וּ/בְנֵ֖י עֻזִּיאֵ֑ל מִֽישָׁאֵ֥ל וְ/אֶלְצָפָ֖ן וְ/סִתְרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/022.yaml
  text: 'And the sons of Uzziel: Mishael[a], Elzaphan[b], and Sithri.'
translation:
  language: id
  text: Anak-anak Uziel ialah Misael, Elsafan, dan Sitri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Anak-anak ... ialah
  rationale: Bentuk jamak konstruktus menyatakan anak-anak laki-laki dalam daftar silsilah. Dalam bahasa Indonesia, hubungan dengan ayat sebelumnya dan struktur daftar tersampaikan secara alami tanpa menerjemahkan ו secara tersendiri sebagai “dan”.
- source_word: עֻזִּיאֵל
  choice: Uziel
  rationale: Nama diri ditransliterasikan menurut ejaan Indonesia; konsonan rangkap dalam bentuk Inggris tidak diperlukan.
- source_word: מִישָׁאֵל
  choice: Misael
  rationale: Transliterasi yang alami dan lazim dalam tradisi Alkitab bahasa Indonesia, dengan tetap mencerminkan unsur-unsur utama nama Ibrani.
- source_word: וְ/אֶלְצָפָן
  choice: Elsafan
  rationale: Nama diri dengan konjungsi; bentuk “Elsafan” mencerminkan אֶלְצָפָן secara wajar dalam ejaan Indonesia, sedangkan konjungsinya diterjemahkan sebagai “dan” sebelum unsur terakhir dalam deret.
- source_word: וְ/סִתְרִי
  choice: dan Sitri
  rationale: Nama diri ditransliterasikan secara langsung; samekh diwakili dengan s, dan konjungsi ו diterjemahkan sebagai “dan”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Susunan nominal dengan “ialah” memperjelas pembukaan daftar nama tanpa menambah penafsiran. Tidak ada catatan kaki karena variasi transliterasi bahasa Inggris yang disebutkan pada lapisan konsultasi tidak relevan bagi pembaca Indonesia.
