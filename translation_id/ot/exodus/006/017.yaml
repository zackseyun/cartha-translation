  text: Anak-anak Gerson ialah Libni dan Simei, menurut kaum mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruktus dari בֵּן membuka daftar silsilah dan di sini paling wajar menunjuk kepada anak-anak kandung yang langsung disebutkan.
- source_word: גֵרְשׁוֹן
  choice: Gerson
  rationale: Nama diri Ibrani ditransliterasikan dalam bentuk yang sudah lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: לִבְנִי
  choice: Libni
  rationale: Nama diri ditransliterasikan, bukan diterjemahkan.
- source_word: וְשִׁמְעִי
  choice: dan Simei
  rationale: Konjungsi וְ diterjemahkan sebagai 'dan'; nama diri ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: לְמִשְׁפְּחֹתָם
  choice: menurut kaum mereka
  rationale: Dalam konteks silsilah dan kesukuan, מִשְׁפָּחָה menunjuk kepada kelompok kekerabatan yang lebih luas daripada keluarga inti. 'Kaum' menyampaikan cakupan tersebut secara ringkas dan wajar dalam bahasa Indonesia.
