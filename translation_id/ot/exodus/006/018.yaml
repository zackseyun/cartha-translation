base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/018.yaml
  text: 'The sons of Kohath: Amram, Izhar, Hebron, and Uzziel. And the years of Kohath’s life were one hundred thirty-three years.'
translation:
  language: id
  text: Anak-anak Kehat ialah Amram, Yizhar, Hebron, dan Uziel. Umur Kehat seratus tiga puluh tiga tahun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: Anak-anak ... ialah
  rationale: בְּנֵי adalah bentuk jamak konstruktus dari 'anak laki-laki'. Dalam silsilah ini nama-nama yang disebut adalah anak-anak langsung Kehat. Kopula 'ialah' membuat susunan daftar ini alami dalam bahasa Indonesia, sedangkan waw pembuka tidak perlu diterjemahkan tersendiri.
- source_word: קְהָת
  choice: Kehat
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: עַמְרָם וְיִצְהָר וְחֶבְרוֹן וְעֻזִּיאֵל
  choice: Amram, Yizhar, Hebron, dan Uziel
  rationale: Keempat nama diri ditransliterasikan, sementara rangkaian waw disajikan secara idiomatis dengan koma dan 'dan' sebelum nama terakhir.
- source_word: וּשְׁנֵי חַיֵּי
  choice: Umur ...
  rationale: Ungkapan harfiah 'tahun-tahun kehidupan' menyatakan lamanya hidup. 'Umur Kehat' menyampaikan makna itu dengan alami dan ringkas dalam bahasa Indonesia modern.
- source_word: שָׁלֹשׁ וּשְׁלֹשִׁים וּמְאַת שָׁנָה
  choice: seratus tiga puluh tiga tahun
  rationale: Urutan bilangan Ibrani dinormalkan mengikuti tata bilangan bahasa Indonesia; bentuk tunggal שָׁנָה sesudah bilangan majemuk diterjemahkan secara idiomatis sebagai 'tahun'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Bentuk nama mengikuti kelaziman Alkitab Indonesia; kalimat kedua memakai ungkapan umum 'umur' tanpa mengubah isi genealogis.
