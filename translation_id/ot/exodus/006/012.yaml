  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר מֹשֶׁ֔ה לִ/פְנֵ֥י יְהוָ֖ה לֵ/אמֹ֑ר הֵ֤ן בְּנֵֽי יִשְׂרָאֵל֙ לֹֽא שָׁמְע֣וּ אֵלַ֔/י וְ/אֵיךְ֙ יִשְׁמָעֵ֣/נִי פַרְעֹ֔ה וַ/אֲנִ֖י עֲרַ֥ל שְׂפָתָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/012.yaml
  text: But Moses spoke before Yahweh[a], saying, “Behold, the sons of Israel have not listened to me; so how will Pharaoh listen to me[b], since I am uncircumcised in lips?”
translation:
  language: id
  text: Namun Musa berkata di hadapan Yahweh, “Sesungguhnya, orang Israel tidak mendengarkan aku. Jadi, bagaimana mungkin Firaun akan mendengarkan aku, padahal aku ini seorang yang bibirnya tidak bersunat[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bibir yang tidak bersunat,” sebuah ungkapan yang menggambarkan kemampuan berbicara yang terhambat atau tidak memadai; bandingkan Keluaran 4:10.
    reason: Menjelaskan idiom Ibrani yang sengaja dipertahankan dalam teks utama.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Namun Musa berkata
  rationale: Waw melanjutkan narasi, sedangkan “namun” menyatakan pertentangan kontekstual antara perintah ilahi sebelumnya dan keberatan Musa.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Mempertahankan ungkapan relasional-spasial לִפְנֵי dan menerjemahkan nama ilahi יהוה sebagai Yahweh.
- source_word: הֵן
  choice: Sesungguhnya
  rationale: Partikel ini menarik perhatian dan menegaskan dasar keberatan Musa; “sesungguhnya” sesuai dengan ragam bahasa Indonesia yang bermartabat.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan harfiah “anak-anak Israel” di sini menunjuk secara kolektif kepada bangsa Israel; “orang Israel” alami dalam bahasa Indonesia dan tidak membatasi rujukan pada anak laki-laki.
- source_word: לֹא שָׁמְעוּ אֵלַי
  choice: tidak mau mendengarkan aku
  rationale: שמע dengan אֶל berarti mendengarkan atau mengindahkan. Unsur “mau” menyampaikan penolakan untuk mengindahkan tanpa mempersempit makna menjadi sekadar ketaatan.
- source_word: וְאֵיךְ יִשְׁמָעֵנִי פַרְעֹה
  choice: Jadi, bagaimana mungkin Firaun akan mendengarkan aku
  rationale: Pertanyaan retoris ini menarik kesimpulan dari klausa sebelumnya; “bagaimana mungkin” menyampaikan daya keberatan Musa secara alami.
- source_word: וַאֲנִי עֲרַל שְׂפָתָיִם
  choice: sedangkan aku ini tidak bersunat bibir
  rationale: “Sedangkan” menjaga hubungan argumentatif tanpa menetapkan secara berlebihan apakah waw bersifat kausal atau kontras. Metafora Ibrani dipertahankan agar ketegangan mengenai hambatan atau ketidaklayakan bicara Musa tidak dihapus.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama pribadi ilahi secara langsung; transliterasi “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Makna עֲרַל שְׂפָתָיִם
  choice: tidak bersunat bibir
  alternative: tidak pandai berbicara
  rationale: Teks utama mempertahankan metafora yang mencakup gagasan hambatan atau ketidaklayakan berbicara, tanpa mengubahnya menjadi diagnosis tertentu.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Bentuk “di hadapan Yahweh” dan metafora “tidak bersunat bibir” menjaga kedekatan dengan teks Ibrani, sementara “orang Israel” serta susunan pertanyaan retoris memberi kelancaran bagi pembaca umum.
