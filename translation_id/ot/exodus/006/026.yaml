base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/026.yaml
  text: It was Aaron and Moses to whom Yahweh said[c][b][a], “Bring the sons of Israel out from the land of Egypt by their hosts.”
translation:
  language: id
  text: Merekalah Harun dan Musa yang kepada mereka Yahweh berfirman, “Bawalah orang Israel[a] keluar dari tanah Mesir menurut kelompok-kelompoknya.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Israel”; ungkapan ini berarti orang Israel atau keturunan Israel.
    reason: lexical_alternative
  - marker: b
    text: Atau “menurut pasukan-pasukannya” atau “menurut kelompok-kelompok mereka”; kata Ibrani dapat menunjuk kelompok yang tersusun, termasuk formasi bergaya militer.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא אַהֲרֹן וּמֹשֶׁה
  choice: Merekalah Harun dan Musa
  rationale: Pronomina mandiri הוּא berfungsi demonstratif dan menegaskan identitas kedua orang yang baru disebut. Rumusan Indonesia ini alami sekaligus mempertahankan penekanan; bentuk tunggal Ibrani diikuti dua nama dan tidak perlu ditiru secara kaku.
- source_word: אֲשֶׁר אָמַר ... לָהֶם
  choice: yang kepada mereka ... berfirman
  rationale: Konstruksi relatif beserta לָהֶם dipertahankan secara cukup dekat. 'Berfirman' merupakan padanan Indonesia yang wajar dan bermartabat ketika Allah menjadi subjek.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan, bukan diganti dengan gelar, sehingga bentuk nama dalam teks sumber tetap tampak.
- source_word: הוֹצִיאוּ
  choice: Bawalah ... keluar
  rationale: Imperatif jamak hiphil dari יצא menyatakan tindakan menyebabkan keluar. 'Bawalah ... keluar' mempertahankan daya kausatif dan perintah kepada Harun serta Musa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan genealogis ini secara idiomatis menunjuk bangsa Israel secara keseluruhan. 'Orang Israel' jelas bagi pembaca Indonesia modern tanpa memberi kesan bahwa hanya laki-laki atau anak-anak yang dimaksud; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: keluar dari tanah Mesir
  rationale: Terjemahan ini mempertahankan gerak keluar serta penyebutan eksplisit אֶרֶץ, 'tanah/negeri'.
- source_word: עַל צִבְאֹתָם
  choice: menurut rombongan mereka
  rationale: צְבָאוֹת dapat menunjuk pasukan, kelompok, atau formasi yang teratur. Dalam konteks keluarnya Israel, 'rombongan' mempertahankan gagasan kelompok-kelompok terorganisasi tanpa memastikan bahwa semuanya pasukan tempur.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi. Transliterasi mempertahankan perbedaan antara nama itu dan gelar אֲדֹנָי, tanpa menambahkan tafsiran denominasi.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak lelaki Israel / keturunan Israel
  rationale: Dalam konteks ini ungkapan tersebut merupakan sebutan kolektif bagi bangsa Israel, bukan pembatasan kepada laki-laki. Padanan idiomatis menghindari penyempitan makna, sementara bentuk sumber dipertahankan dalam catatan.
- issue: Nuansa צִבְאֹתָם
  choice: menurut rombongan mereka
  alternative: menurut pasukan-pasukan mereka
  rationale: Kata ini memiliki nuansa organisasi dan dapat bernuansa militer. 'Rombongan' menjaga keteraturan kelompok tanpa memaksakan arti pasukan tempur; alternatif yang lebih militer dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan “Merekalah Harun dan Musa” mempertahankan penegasan identitas, sedangkan kosakata utama dibuat mudah dipahami pembaca umum. Semua penanda catatan kaki ditempatkan sesudah klausa yang relevan.
