source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עַתָּ֣ה תִרְאֶ֔ה אֲשֶׁ֥ר אֶֽעֱשֶׂ֖ה לְ/פַרְעֹ֑ה כִּ֣י בְ/יָ֤ד חֲזָקָה֙ יְשַׁלְּחֵ֔/ם וּ/בְ/יָ֣ד חֲזָקָ֔ה יְגָרְשֵׁ֖/ם מֵ/אַרְצֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/001.yaml
  text: Then Yahweh said to Moses[a], “Now you will see what I will do to Pharaoh, for by a strong hand he will let them go, and by a strong hand he will drive them out from his land.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa, “Sekarang engkau akan melihat apa yang akan Kulakukan terhadap Firaun. Sebab dengan tangan yang kuat ia akan membiarkan mereka pergi, dan dengan tangan yang kuat ia akan mengusir mereka dari negerinya.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “karena dipaksa ia akan membiarkan mereka pergi, dan karena dipaksa ia akan mengusir mereka.” Ungkapan “dengan tangan yang kuat” yang diulang dapat menyiratkan bahwa Firaun bertindak karena tekanan kuasa yang luar biasa, yang pada akhirnya dapat dipahami sebagai kuasa Allah.
    reason: Alternatif leksikal untuk idiom בְּיָד חֲזָקָה dan penjelasan mengenai kemungkinan nuansa paksaan tanpa menetapkan agen secara eksplisit.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Waw-konsekutif melanjutkan urutan narasi; “lalu” alami dalam bahasa Indonesia. “Berfirman” sesuai untuk tuturan ilahi dalam ragam Alkitab Indonesia yang tetap mudah dipahami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama pribadi ilahi sebagai transliterasi Tetragramaton, bukan menggantinya dengan gelar.
- source_word: עַתָּה תִרְאֶה
  choice: Sekarang engkau akan melihat
  rationale: Mempertahankan penekanan waktu עַתָּה dan arti futurum dari verba תִרְאֶה.
- source_word: אֲשֶׁר אֶעֱשֶׂה לְפַרְעֹה
  choice: apa yang akan Kulakukan terhadap Firaun
  rationale: “Apa yang akan Kulakukan” merupakan padanan Indonesia yang alami untuk klausa relatif; “terhadap” menyatakan hubungan tindakan Allah dengan Firaun tanpa mempersempit לְ menjadi makna adversatif yang terlalu eksplisit.
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan penjelasan atas pernyataan sebelumnya dengan hubungan kausal yang jelas.
- source_word: בְיָד חֲזָקָה
  choice: dengan tangan yang kuat
  rationale: Mempertahankan idiom dan pengulangannya, sekaligus membiarkan terbuka apakah frasa itu menyoroti sarana atau tekanan dari kuasa yang mengatasi Firaun.
- source_word: יְשַׁלְּחֵם
  choice: ia akan membiarkan mereka pergi
  rationale: Dalam konteks tuntutan kepada Firaun, ungkapan ini secara alami menyatakan pemberian izin atau pelepasan Israel.
- source_word: יְגָרְשֵׁם
  choice: ia akan mengusir mereka
  rationale: Menangkap kekuatan גרש dan perkembangan dari membiarkan pergi menjadi mengeluarkan secara paksa atau mendesak.
- source_word: מֵאַרְצוֹ
  choice: dari negerinya
  rationale: “Negeri” alami bagi אֶרֶץ dalam konteks wilayah kekuasaan Firaun dan pronomina posesif tetap dipertahankan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Nama pribadi ilahi dipertahankan dan tidak diganti dengan gelar; bentuk Yahweh merupakan transliterasi modern yang lazim.
- issue: Rujukan dan nuansa frasa בְיָד חֲזָקָה
  choice: Mempertahankan idiom “dengan tangan yang kuat” dalam teks utama
  alternative: “karena dipaksa ia akan membiarkan mereka pergi” atau “oleh tangan yang kuat ia akan membiarkan mereka pergi”
  rationale: Bahasa Ibrani memungkinkan nuansa bahwa Firaun bertindak di bawah tekanan kuasa yang luar biasa, pada akhirnya kuasa Allah, tetapi tidak menyatakan pelakunya secara eksplisit dalam frasa tersebut. Idiom dipertahankan agar ambiguitas dan ketegangan teologisnya tidak diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “engkau” dipakai dalam sapaan langsung ilahi kepada Musa; kapitalisasi enklitik “Ku-” menandai rujukan kepada Allah. Pengulangan retoris bahasa Ibrani dipertahankan.
