  yaml_path: translation/ot/exodus/006/024.yaml
  text: 'The sons of Korah: Assir[a], Elkanah, and Abiasaph. These are the clans of the Korahites.'
translation:
  language: id
  text: Anak-anak Korah ialah Asir, Elkana, dan Abiasaf. Inilah kaum-kaum orang Korah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keluarga-keluarga orang Korah.” Istilah Ibrani yang dipakai dapat menunjuk pada kelompok-kelompok keluarga besar dalam suatu suku.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: Anak-anak
  rationale: Bentuk jamak konstruksi בְּנֵי secara langsung berarti 'anak-anak lelaki dari'; dalam daftar silsilah ini, 'anak-anak' wajar dan tepat. Konjungsi waw tidak perlu diterjemahkan tersendiri karena ayat ini terbaca alami sebagai baris baru dalam silsilah.
- source_word: קֹרַח
  choice: Korah
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: אַסִּיר
  choice: Asir
  rationale: Dalam konteks silsilah, bentuk ini adalah nama diri, bukan nomina umum yang dapat berarti 'orang tahanan'.
- source_word: וְאֶלְקָנָה
  choice: Elkana
  rationale: Nama diri ditransliterasikan menurut kebiasaan bahasa Indonesia; konjungsinya diwakili secara alami dalam susunan daftar.
- source_word: וַאֲבִיאָסָף
  choice: Abiasaf
  rationale: Nama diri ditransliterasikan ke dalam ejaan Indonesia, dengan huruf akhir f untuk bunyi pe.
- source_word: אֵלֶּה
  choice: Mereka inilah
  rationale: Kata tunjuk ini memperkenalkan klausa pengenal; 'mereka inilah' mempertahankan penunjukan tegas kepada orang-orang yang baru disebut.
- source_word: מִשְׁפְּחֹת
  choice: kaum-kaum
  rationale: Dalam konteks kesukuan dan silsilah, מִשְׁפָּחוֹת menunjuk pada kelompok-kelompok kekerabatan yang lebih luas daripada keluarga inti. 'Kaum-kaum' menyampaikan struktur kekerabatan tersebut secara ringkas dan alami.
- source_word: הַקָּרְחִי
  choice: keturunan Korah
  rationale: Bentuk nisbah tunggal kolektif ini menunjuk kepada kelompok yang berasal dari atau tergolong pada garis Korah; 'keturunan Korah' lebih transparan bagi pembaca Indonesia daripada istilah bentukan yang kurang lazim.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama-nama mengikuti bentuk yang lazim dalam tradisi Alkitab Indonesia. Istilah 'kaum-kaum' dipilih untuk konteks silsilah, sementara alternatif yang lebih harfiah dijelaskan dalam catatan kaki.
