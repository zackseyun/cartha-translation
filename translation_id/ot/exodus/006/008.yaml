  text: וְ/הֵבֵאתִ֤י אֶתְ/כֶם֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֤ר נָשָׂ֨אתִי֙ אֶת יָדִ֔/י לָ/תֵ֣ת אֹתָ֔/הּ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹ֑ב וְ/נָתַתִּ֨י אֹתָ֥/הּ לָ/כֶ֛ם מוֹרָשָׁ֖ה אֲנִ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/008.yaml
  text: And I will bring you into the land that I swore to give to Abraham[a], to Isaac, and to Jacob, and I will give it to you as a possession. I am Yahweh.
translation:
  language: id
  text: Aku akan membawa kamu ke negeri yang telah Kujanjikan dengan sumpah[a] untuk Kuberikan kepada Abraham, Ishak, dan Yakub. Aku akan memberikan negeri itu kepadamu sebagai milik pusaka. Akulah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “negeri yang untuk memberikannya Aku telah mengangkat tangan-Ku.” Mengangkat tangan merupakan idiom pengucapan sumpah.
    reason: Menjelaskan idiom sumpah Ibrani sambil mempertahankan citra harfiahnya tanpa menambahkan hubungan arah yang tidak ada dalam teks sumber.
lexical_decisions:
- source_word: וְהֵבֵאתִי
  choice: Aku akan membawa
  rationale: Bentuk hifil dari בוא dengan Allah sebagai subjek dan umat sebagai objek menyatakan tindakan membawa masuk; ‘membawa’ alami dan mempertahankan makna kausatifnya.
- source_word: הָאָרֶץ
  choice: negeri
  rationale: Dalam konteks janji perjanjian, אֶרֶץ menunjuk pada wilayah tertentu yang dijanjikan. ‘Negeri’ lebih alami daripada ‘bumi’ dan sesuai dengan konteks tujuan tempat tinggal umat.
- source_word: אֲשֶׁר נָשָׂאתִי אֶת יָדִי
  choice: yang telah Kujanjikan dengan sumpah
  rationale: Ungkapan harfiahnya, ‘yang terhadapnya Aku mengangkat tangan-Ku,’ merupakan idiom pengucapan sumpah. Terjemahan ini menyampaikan fungsi idiom secara jelas, sedangkan citra konkretnya dipertahankan dalam catatan kaki.
- source_word: לָתֵת אֹתָהּ
  choice: untuk Kuberikan
  rationale: נתן berarti ‘memberikan’; bentuk pronominal terpadu ‘Kuberikan’ menghasilkan bahasa Indonesia yang ringkas dan wajar.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: kepada Abraham, Ishak, dan Yakub
  rationale: Nama-nama mengikuti bentuk Indonesia yang lazim. Preposisi Ibrani yang berulang cukup dinyatakan sekali secara alami tanpa mengubah hubungan gramatikalnya.
- source_word: וְנָתַתִּי אֹתָהּ לָכֶם
  choice: Aku akan memberikan negeri itu kepadamu
  rationale: Pengulangan ‘negeri itu’ memperjelas acuan pronomina feminin Ibrani dan menghindari ketaksaan dalam bahasa Indonesia.
- source_word: מוֹרָשָׁה
  choice: sebagai milik pusaka
  rationale: מוֹרָשָׁה menyatakan milik yang diterima dan dipegang sebagai hak tetap atau turun-temurun. ‘Milik pusaka’ mempertahankan dimensi kepemilikan dan pewarisan tanpa menyiratkan bahwa pemberinya telah meninggal.
- source_word: אֲנִי יְהוָה
  choice: Akulah Yahweh
  rationale: Klausa tanpa verba ini merupakan penegasan identitas ilahi yang khidmat. Partikel ‘-lah’ menyampaikan penekanan, dan nama perjanjian יְהוָה ditransliterasikan sebagai ‘Yahweh’.
theological_decisions:
- issue: Ungkapan sumpah נָשָׂאתִי אֶת יָדִי
  choice: yang telah Kujanjikan dengan sumpah
  alternative: yang terhadapnya Aku telah mengangkat tangan untuk memberikannya
  rationale: Ungkapan itu secara idiomatis berarti bersumpah. Teks utama memakai padanan yang jelas bagi pembaca modern, sementara catatan kaki mempertahankan citra tindakan mengangkat tangan dan tidak menghilangkan latar perjanjiannya.
- issue: Nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri perjanjian secara langsung. ‘Yahweh’ mempertahankan nama itu, bukan menggantinya dengan sebuah gelar.
- issue: Makna מוֹרָשָׁה
  choice: milik pusaka
  alternative: milik; warisan
  rationale: Pilihan ini mempertahankan ketegangan antara kepemilikan yang dianugerahkan dan sifatnya yang tetap atau turun-temurun, tanpa mengartikannya semata-mata sebagai warisan akibat kematian manusia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk pronominal ilahi memakai huruf kapital sesuai kelaziman penerbitan Alkitab Indonesia. Susunan kalimat dibuat alami tanpa menghapus pengulangan janji yang memberi tekanan pada tindakan Yahweh.
