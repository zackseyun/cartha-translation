  yaml_path: translation/ot/exodus/006/019.yaml
  text: 'And the sons of Merari: Mahli and Mushi[a]. These are the clans of Levi according to their generations.'
translation:
  language: id
  text: Anak-anak Merari ialah Mahli dan Musi. Itulah kaum-kaum Lewi[a] menurut garis keturunan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang Lewi” dalam bentuk tunggal; bentuk itu kemungkinan dipakai secara kolektif untuk garis keturunan Lewi. Dapat juga diterjemahkan “kaum-kaum orang Lewi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי מְרָרִי
  choice: Anak-anak Merari
  rationale: Bentuk jamak konstruktus בְּנֵי dalam daftar silsilah menunjuk kepada anak-anak lelaki Merari. Kata sambung Ibrani tidak perlu ditampilkan sebagai “dan” pada awal ayat karena akan terasa kaku dalam bahasa Indonesia, sedangkan kesinambungan daftar tetap jelas dari konteks.
- source_word: מַחְלִי וּ/מוּשִׁי
  choice: Mahli dan Musi
  rationale: Nama diri ditransliterasikan dalam bentuk yang wajar bagi pembaca bahasa Indonesia; konjungsi pada nama kedua diterjemahkan “dan”.
- source_word: אֵלֶּה
  choice: Itulah
  rationale: Kata tunjuk ini memperkenalkan klausa pengenal. “Itulah” merupakan ungkapan Indonesia yang alami untuk merangkum nama-nama yang baru disebutkan.
- source_word: מִשְׁפְּחֹת
  choice: kaum-kaum
  rationale: Dalam konteks kesukuan dan silsilah, kata ini menunjuk kepada kelompok-kelompok kekerabatan di dalam satu suku; “kaum-kaum” lebih tepat daripada “keluarga-keluarga” yang dapat dipahami sebagai rumah tangga inti.
- source_word: הַ/לֵּוִי
  choice: Lewi
  rationale: Bentuk tunggal dengan kata sandang berfungsi secara kolektif atau gentil untuk garis keturunan Lewi. “Kaum-kaum Lewi” alami dalam bahasa Indonesia, sementara bentuk tunggal Ibraninya dijelaskan dalam catatan kaki.
- source_word: לְ/תֹלְדֹתָם
  choice: menurut garis keturunan mereka
  rationale: Dalam rumus silsilah, תּוֹלְדוֹת merujuk pada keturunan atau jalur genealogis. Penambahan “garis” memperjelas makna tersebut tanpa mengubah isinya.
