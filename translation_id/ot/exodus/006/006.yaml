id: EXO.6.6
reference: Exodus 6:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לָ/כֵ֞ן אֱמֹ֥ר לִ/בְנֵֽי יִשְׂרָאֵ֘ל אֲנִ֣י יְהוָה֒ וְ/הוֹצֵאתִ֣י אֶתְ/כֶ֗ם מִ/תַּ֨חַת֙ סִבְלֹ֣ת מִצְרַ֔יִם וְ/הִצַּלְתִּ֥י אֶתְ/כֶ֖ם מֵ/עֲבֹדָתָ֑/ם וְ/גָאַלְתִּ֤י אֶתְ/כֶם֙ בִּ/זְר֣וֹעַ נְטוּיָ֔ה וּ/בִ/שְׁפָטִ֖ים גְּדֹלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/006.yaml
  text: Therefore say to the sons of Israel[a], ‘I am Yahweh, and I will bring you out from under the burdens of Egypt, and I will deliver you from their slavery[d][c][b], and I will redeem you with an outstretched arm and with great judgments.’
translation:
  language: id
  text: Karena itu, katakanlah kepada anak-anak Israel[a], ‘Akulah Yahweh[b]. Aku akan membawa kalian keluar dari bawah beban-beban yang ditimpakan Mesir, membebaskan kalian dari perbudakan yang dipaksakan oleh orang Mesir[c], dan menebus kalian dengan lengan yang terulur serta dengan tindakan-tindakan penghakiman yang besar[d].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Israel”; maksudnya dapat diungkapkan sebagai “orang Israel” atau “bangsa Israel.”
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: YHWH, nama ilahi yang di sini ditulis “Yahweh”; dalam sebagian terjemahan diterjemahkan “TUHAN.”'
    reason: alternative_reading
  - marker: c
    text: Atau “dari penghambaan kepada mereka” atau “dari kerja paksa bagi mereka.” Istilah Ibraninya dapat berarti pekerjaan atau pelayanan, tetapi di sini menunjuk pada penghambaan yang menindas.
    reason: lexical_alternative
  - marker: d
    text: Atau “dengan penghakiman-penghakiman besar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: Karena itu
  rationale: Menandai kesimpulan atau peralihan inferensial dari firman ilahi sebelumnya dengan ungkapan Indonesia yang alami.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: kepada anak-anak Israel
  rationale: Mempertahankan ungkapan kekerabatan Ibrani secara cukup harfiah; yang dimaksud ialah umat keturunan Israel secara kolektif.
- source_word: אֲנִי יְהוָה
  choice: Akulah Yahweh
  rationale: Partikel -lah menyampaikan penegasan pada אֲנִי, sedangkan nama perjanjian יהוה ditransliterasikan sebagai Yahweh.
- source_word: וְהוֹצֵאתִי
  choice: Aku akan membawa kalian keluar
  rationale: Bentuk kausatif יצא menyatakan tindakan membuat umat keluar; bentuk mendatang sesuai dengan rangkaian janji ilahi.
- source_word: מִתַּחַת סִבְלֹת מִצְרַיִם
  choice: dari bawah beban Mesir
  rationale: Mempertahankan gambaran konkret ‘dari bawah’ dan ‘beban’ tanpa membatasi maknanya hanya pada kerja atau penindasan.
- source_word: וְהִצַּלְתִּי
  choice: membebaskan kalian
  rationale: Dalam konteks dominasi dan perbudakan, ‘membebaskan’ secara alami mengungkapkan tindakan menyelamatkan dari kuasa penindas.
- source_word: מֵעֲבֹדָתָם
  choice: dari perbudakan oleh mereka
  rationale: עֲבֹדָה dapat berarti pekerjaan atau pelayanan, tetapi konteks Mesir menunjukkan penghambaan paksa; ‘oleh mereka’ memperjelas bahwa orang Mesir adalah pelakunya.
- source_word: וְגָאַלְתִּי
  choice: dan menebus kalian
  rationale: ‘Menebus’ mempertahankan nuansa hukum-kekerabatan גאל sekaligus bobot teologisnya.
- source_word: בִּזְרוֹעַ נְטוּיָה
  choice: dengan lengan yang terulur
  rationale: Terjemahan ini mempertahankan gambaran antropomorfis tentang campur tangan Yahweh yang penuh kuasa.
- source_word: וּבִשְׁפָטִים גְּדֹלִים
  choice: serta dengan penghakiman-penghakiman besar
  rationale: Bentuk jamak mempertahankan שְׁפָטִים sebagai berbagai tindakan penghakiman, tanpa secara eksplisit menyamakannya hanya dengan tulah-tulah.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri perjanjian יהוה; transliterasi ‘Yahweh’ mempertahankan fungsi nama itu dan tidak menggantinya dengan gelar.
- issue: Cakupan לִבְנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  alternative: orang Israel / bangsa Israel
  rationale: Pilihan utama mempertahankan metafora keluarga dalam bahasa sumber, sementara catatan menjelaskan bahwa seluruh umat Israel dimaksudkan.
- issue: Makna עֲבֹדָה dalam konteks Mesir
  choice: perbudakan
  alternative: kerja paksa / penghambaan
  rationale: Konteks menunjukkan pelayanan yang dipaksakan di bawah dominasi Mesir, bukan pekerjaan atau pelayanan yang netral.
- issue: Makna שְׁפָטִים
  choice: penghakiman-penghakiman besar
  alternative: tindakan-tindakan penghukuman yang besar
  rationale: Terjemahan utama menjaga istilah yudisial dan bentuk jamaknya, tanpa memutuskan secara sempit bentuk semua tindakan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. ‘Kalian’ dipakai karena objeknya jamak. Struktur paralel janji ilahi dan gambaran konkret bahasa Ibrani dipertahankan, sementara catatan kaki menampung alternatif leksikal yang sungguh mungkin.
