    issue: Ungkapan "sebagai istrinya" kurang idiomatis setelah "mengambil".
    rationale: Dalam bahasa Indonesia modern, "mengambil ... menjadi istrinya" adalah padanan yang lebih alami untuk konstruksi perkawinan Ibrani לְאִשָּׁה tanpa mengubah makna.
  - severity: medium
    issue: Ungkapan "Eliseba melahirkan baginya" terdengar tidak alami.
    rationale: Pronomina "baginya" setelah "melahirkan" janggal dalam pemakaian Indonesia modern. Menyebut kembali Harun menghasilkan kalimat yang jelas dan wajar, serta menerjemahkan לּוֹ.
