base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/023.yaml
  text: Aaron took Elisheba, the daughter of Amminadab and sister of Nahshon, as his wife, and she bore him Nadab, Abihu, Eleazar, and Ithamar.
translation:
  language: id
  text: Harun mengambil Eliseba, anak perempuan Aminadab dan saudara perempuan Nahason, menjadi istrinya, dan Eliseba melahirkan bagi Harun Nadab, Abihu, Eleazar, dan Itamar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: Kata kerja לקח secara harfiah berarti “mengambil”; dalam konteks ini ungkapan berikutnya, “sebagai istrinya,” memperjelas makna perkawinan tanpa mengganti citra sumber.
- source_word: אֱלִישֶׁבַע
  choice: Eliseba
  rationale: Nama diri ditransliterasikan ke dalam bentuk Indonesia yang dekat dengan bunyi Ibrani.
- source_word: בַּת עַמִּינָדָב
  choice: anak perempuan Aminadab
  rationale: Bentuk konstruksi Ibrani menyatakan hubungan langsung sebagai anak perempuan; frasa ini alami dan jelas dalam bahasa Indonesia.
- source_word: אֲחוֹת נַחְשׁוֹן
  choice: saudara perempuan Nahason
  rationale: Kata אֲחוֹת secara khusus menunjukkan saudara kandung perempuan; bentuk ini mempertahankan informasi gender yang ada dalam sumber.
- source_word: לּוֹ לְאִשָּׁה
  choice: sebagai istrinya
  rationale: Ini menyampaikan ungkapan perkawinan Ibrani secara ringkas dan wajar dalam bahasa Indonesia modern.
- source_word: וַתֵּלֶד לוֹ
  choice: Eliseba melahirkan baginya
  rationale: Kata kerja ילד dengan objek tak langsung לוֹ menyatakan bahwa ia melahirkan anak-anak bagi Harun. Nama “Eliseba” diulang agar rujukan subjek jelas dan alami dalam bahasa Indonesia.
- source_word: נָדָב
  choice: Nadab
  rationale: Nama diri ditransliterasikan secara konvensional.
- source_word: אֲבִיהוּא
  choice: Abihu
  rationale: Nama diri ditransliterasikan secara konvensional.
- source_word: אֶלְעָזָר
  choice: Eleazar
  rationale: Nama diri ditransliterasikan secara konvensional.
- source_word: אִיתָמָר
  choice: Itamar
  rationale: Nama diri ditransliterasikan secara konvensional.
