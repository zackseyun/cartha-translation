  yaml_path: translation/ot/exodus/006/030.yaml
  text: But Moses said before the LORD, “Look, I am uncircumcised of lips; so how will Pharaoh listen to me?”
translation:
  language: id
  text: Namun, Musa berkata di hadapan TUHAN, “Lihatlah, aku tidak fasih berbicara. Jadi, bagaimana mungkin Firaun akan mendengarkan aku?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan TUHAN
  rationale: Menerjemahkan ungkapan relasional Ibrani secara langsung dan memakai bentuk baku bahasa Indonesia untuk nama ilahi dalam tradisi penerjemahan umum.
- source_word: הֵן
  choice: Lihatlah
  rationale: Mempertahankan penanda wacana yang menarik perhatian pada keberatan Musa; bentuk ini wajar dan bermartabat dalam konteks langsung kepada Allah.
- source_word: עֲרַל שְׂפָתַיִם
  choice: tidak fasih berbicara
  rationale: Idiom harfiah 'tidak bersunat bibir' menyatakan ketidakmampuan atau hambatan berbicara. Terjemahan ini menyampaikan maksud dalam bahasa Indonesia alami tanpa menetapkan diagnosis tertentu.
- source_word: וְאֵיךְ יִשְׁמַע אֵלַי פַּרְעֹה
  choice: Jadi, bagaimana mungkin Firaun mau mendengarkan aku?
  rationale: Dalam konteks ini שׁמע אֶל berarti mengindahkan atau menerima perkataan seseorang, bukan sekadar mendengar bunyi; 'mau mendengarkan' mempertahankan unsur tanggapan Firaun.
theological_decisions:
- issue: Makna metafora 'tidak bersunat bibir'
  choice: tidak fasih berbicara
  alternative: bibirku tidak bersunat
  rationale: Pilihan utama menyampaikan fungsi metafora sebagai pengakuan ketidakmampuan berbicara, tetapi tidak menambahkan bahwa Musa gagap atau memiliki kondisi medis tertentu.
- issue: Penyajian nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH / Yahweh
  rationale: Mengikuti konvensi bahasa Indonesia yang luas untuk Tetragramaton tanpa menambahkan footnote yang tidak diperlukan pada ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan pertanyaan mempertahankan nada keberatan Musa dan hubungan sebab-akibat dengan pengakuannya tentang kemampuan berbicara.
