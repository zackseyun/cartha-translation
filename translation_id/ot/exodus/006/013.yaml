source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָה֮ אֶל מֹשֶׁ֣ה וְ/אֶֽל אַהֲרֹן֒ וַ/יְצַוֵּ/ם֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶל פַּרְעֹ֖ה מֶ֣לֶךְ מִצְרָ֑יִם לְ/הוֹצִ֥יא אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/013.yaml
  text: Then Yahweh spoke to Moses and to Aaron[a], and he commanded them concerning the sons of Israel and concerning Pharaoh king of Egypt[b], to bring the sons of Israel out from the land of Egypt.
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa dan Harun, dan Dia memberi mereka perintah mengenai orang Israel dan mengenai Firaun, raja Mesir,[a] untuk membawa orang Israel keluar dari negeri Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dan Dia memerintahkan mereka kepada orang Israel dan kepada Firaun, raja Mesir.” Preposisi Ibrani dapat menandai pihak yang dituju oleh perintah, tetapi dalam konteks ini kemungkinan besar berarti bahwa perintah kepada Musa dan Harun berkaitan dengan Israel dan Firaun.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “lalu” menyatakan urutan secara alami. Dalam konteks Allah sebagai subjek, “berfirman” merupakan padanan Indonesia yang wajar dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: kepada Musa dan Harun
  rationale: Preposisi אֶל bersama verba “berbicara” menandai pihak yang disapa.
- source_word: וַיְצַוֵּם
  choice: dan Dia memberi mereka perintah
  rationale: Verba צוה menyatakan perintah yang berwibawa, sedangkan sufiks jamak merujuk kepada Musa dan Harun. Ungkapan ini alami dalam bahasa Indonesia dan tidak menimbulkan rangkaian “memerintahkan mereka mengenai” yang kaku.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל וְאֶל פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: mengenai orang Israel dan mengenai Firaun, raja Mesir
  rationale: Dalam konstruksi ini אֶל dapat menunjukkan pihak yang menjadi sasaran atau pokok perintah. “Mengenai” mempertahankan pembacaan kontekstual bahwa Musa dan Harunlah penerima perintah, sambil mencatat pembacaan langsung “kepada” dalam catatan kaki.
- source_word: לְהוֹצִיא
  choice: untuk membawa ... keluar
  rationale: Infinitif Hifil dari יצא bersifat kausatif, yakni menyebabkan keluar; “membawa ... keluar” adalah padanan Indonesia yang idiomatis.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan nasional Ibrani ini secara alami merujuk kepada bangsa Israel secara kolektif. “Orang Israel” jelas, modern, dan tidak membatasi rujukannya hanya pada laki-laki biologis.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: dari negeri Mesir
  rationale: Kata אֶרֶץ dipertahankan dengan “negeri”, sehingga unsur geografis dalam teks sumber tetap tampak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: “Yahweh” mempertahankan nama pribadi dalam teks Ibrani dan tidak menggantinya dengan sebuah gelar.
- issue: Fungsi אֶל sesudah וַיְצַוֵּם
  choice: mengenai orang Israel dan mengenai Firaun
  alternative: kepada orang Israel dan kepada Firaun
  rationale: Konteks menunjukkan Musa dan Harun sebagai penerima perintah, sedangkan Israel dan Firaun adalah pihak yang berkaitan dengan tugas mereka. Namun, bentuk Ibraninya juga memungkinkan pembacaan “kepada”, sehingga alternatif itu dicatat tanpa menghapus ambiguitas.
- issue: Padanan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel; keturunan Israel
  rationale: Sebagai sebutan bangsa, frasa ini mencakup seluruh umat Israel. Padanan idiomatis “orang Israel” menyampaikan rujukan kolektifnya tanpa mengubahnya menjadi klaim tentang jenis kelamin setiap anggota.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif dibuat lancar tanpa menghilangkan pengulangan penting atau ambiguitas sintaksis Ibrani. Sebutan “orang Israel” dipilih sebagai padanan kolektif yang alami bagi pembaca umum.
