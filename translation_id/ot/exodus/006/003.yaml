id: EXO.6.3
reference: Exodus 6:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וָ/אֵרָ֗א אֶל אַבְרָהָ֛ם אֶל יִצְחָ֥ק וְ/אֶֽל יַעֲקֹ֖ב בְּ/אֵ֣ל שַׁדָּ֑י וּ/שְׁמִ֣/י יְהוָ֔ה לֹ֥א נוֹדַ֖עְתִּי לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/003.yaml
  text: And I appeared to Abraham[a], to Isaac, and to Jacob as God Almighty, but by my name, Yahweh[b], I was not known to them.
translation:
  language: id
  text: Aku telah menampakkan diri kepada Abraham, kepada Ishak, dan kepada Yakub sebagai Allah Yang Mahakuasa[a], tetapi dengan nama-Ku, Yahweh, Aku tidak dikenal oleh mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: El Shaddai; secara tradisional diterjemahkan “Allah Yang Mahakuasa”.'
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “Aku tidak memperkenalkan diri kepada mereka dengan nama-Ku, Yahweh.” Bahasa Ibrani mungkin bukan menyatakan bahwa mereka sama sekali tidak mengetahui nama itu, melainkan bahwa mereka belum mengenal sepenuhnya makna nama tersebut dalam hubungan perjanjian.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֵרָא
  choice: Aku telah menampakkan diri
  rationale: Bentuk Nifal orang pertama tunggal dari ראה secara langsung menyatakan bahwa Allah menampakkan diri; bentuk ini lebih tepat daripada perluasan interpretatif seperti 'menyatakan diri'.
- source_word: אֶל אַבְרָהָם אֶל יִצְחָק וְאֶל יַעֲקֹב
  choice: kepada Abraham, kepada Ishak, dan kepada Yakub
  rationale: Pengulangan preposisi אֶל dipertahankan untuk mencerminkan irama dan penekanan bahasa Ibrani tanpa terasa janggal dalam bahasa Indonesia.
- source_word: בְּאֵל שַׁדָּי
  choice: sebagai Allah Yang Mahakuasa
  rationale: Preposisi בְּ dipahami dalam arti identitas atau kapasitas, yaitu 'sebagai'; gelar אֵל שַׁדַּי diterjemahkan dengan padanan Indonesia yang lazim, sementara bentuk Ibraninya dicatat dalam catatan kaki.
- source_word: וּשְׁמִי יְהוָה
  choice: tetapi dengan nama-Ku, Yahweh
  rationale: Kontras dalam konteks diterjemahkan dengan 'tetapi'. 'Dengan nama-Ku' mempertahankan konstruksi Ibrani, dan nama ilahi יְהוָה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan sebuah gelar.
- source_word: לֹא נוֹדַעְתִּי לָהֶם
  choice: Aku tidak dikenal oleh mereka
  rationale: Terjemahan pasif-statif ini paling dekat dengan bentuk Nifal dan sengaja mempertahankan ambiguitas apakah yang dimaksud adalah tidak dikenalnya nama itu atau belum dikenalnya makna serta karya perjanjian yang terkait dengannya.
theological_decisions:
- issue: Makna pernyataan bahwa Allah tidak dikenal oleh para leluhur dengan nama Yahweh
  choice: Mempertahankan ungkapan formal 'Aku tidak dikenal oleh mereka' tanpa menentukan bahwa para leluhur sama sekali tidak mengetahui bunyi nama ilahi.
  alternative: Aku tidak memperkenalkan diri kepada mereka dengan nama-Ku, Yahweh.
  rationale: Bentuk Ibrani memungkinkan nuansa pasif maupun refleksif. Karena kitab Kejadian memakai nama Yahweh dalam konteks para leluhur, teks utama tidak boleh secara diam-diam menyelesaikan ketegangan itu; catatan kaki menyajikan kemungkinan bahwa yang belum dikenal adalah penyataan penuh makna perjanjian nama tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'kepada' mempertahankan irama sumber. 'Menampakkan diri' dipilih sebagai ungkapan yang alami dan setia pada bahasa teofani. Kapitalisasi 'Yang Mahakuasa' mengikuti fungsinya sebagai gelar ilahi.
