base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/009.yaml
  text: So Moses spoke thus to the sons of Israel[b][a], but they did not listen to Moses because of discouragement and harsh slavery.
translation:
  language: id
  text: Musa menyampaikan hal itu kepada orang Israel, tetapi mereka tidak mendengarkan Musa karena semangat mereka patah[a] dan karena kerja paksa yang berat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “karena roh yang pendek.” Ungkapan ini dapat menggambarkan keputusasaan, tekanan batin, atau hilangnya semangat.
    reason: lexical_alternative
  - marker: b
    text: Atau “dan karena pekerjaan yang berat.” Dalam konteks ini pekerjaan tersebut merupakan kerja paksa dalam perbudakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר ... כֵּן
  choice: menyampaikan hal itu
  rationale: Ungkapan ini secara alami menunjuk kembali pada pesan ilahi dalam ayat-ayat sebelumnya, sambil tetap mencerminkan makna 'berbicara demikian'.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Dalam konteks ini frasa tersebut menunjuk kepada bangsa Israel secara kolektif. 'Orang Israel' alami dalam bahasa Indonesia modern dan tidak membatasi rujukannya hanya kepada laki-laki.
- source_word: שָׁמְעוּ אֶל
  choice: mau mendengarkan
  rationale: Konstruksi שמע אל berarti mendengarkan atau mengindahkan. Dengan bentuk negatif, 'tidak mau mendengarkan' mengungkapkan bahwa perkataan Musa tidak mereka terima atau indahkan, bukan bahwa mereka tidak mendengarnya secara fisik.
- source_word: מִקֹּצֶר רוּחַ
  choice: karena semangat mereka telah patah
  rationale: Secara harfiah frasa ini berarti 'karena pendeknya roh/napas' dan menggambarkan batin yang tertekan atau kehilangan semangat. Pilihan ini mempertahankan citra keadaan batin tanpa menyempitkannya menjadi ketidaksabaran.
- source_word: וּמֵעֲבֹדָה קָשָׁה
  choice: dan karena kerja paksa yang berat
  rationale: עֲבֹדָה berarti pekerjaan atau pelayanan, dan dalam konteks Mesir pekerjaan itu bersifat paksa. Terjemahan ini mempertahankan unsur kerja sekaligus menjelaskan keadaan penindasan.
theological_decisions:
- issue: Sifat עֲבֹדָה קָשָׁה dalam perbudakan Mesir
  choice: kerja paksa yang berat
  alternative: perbudakan yang kejam
  rationale: Konteks jelas menunjukkan perbudakan, tetapi kata benda itu sendiri menyoroti pekerjaan atau pelayanan. 'Kerja paksa yang berat' menjaga fokus leksikal sekaligus menyatakan sifat perbudakannya tanpa memperluas ungkapan secara berlebihan.
- issue: Makna keadaan batin dalam קֹצֶר רוּחַ
  choice: semangat mereka telah patah
  alternative: keputusasaan; sesak napas; ketidaksabaran
  rationale: Frasa Ibrani mengandung gambaran 'roh/napas yang pendek' dan dapat menyatakan tekanan batin, hilangnya semangat, atau ketidaksabaran. Terjemahan utama menyampaikan keadaan jiwa yang tertindas, sementara catatan kaki mempertahankan bentuk harfiah dan ambiguitasnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan sebab ganda dibuat eksplisit dengan pengulangan 'karena' agar hubungan sintaksisnya jelas. Penanda catatan kaki ditempatkan langsung setelah frasa yang dijelaskan.
