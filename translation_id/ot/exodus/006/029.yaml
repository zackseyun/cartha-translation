  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֥ה לֵּ/אמֹ֖ר אֲנִ֣י יְהוָ֑ה דַּבֵּ֗ר אֶל פַּרְעֹה֙ מֶ֣לֶךְ מִצְרַ֔יִם אֵ֛ת כָּל אֲשֶׁ֥ר אֲנִ֖י דֹּבֵ֥ר אֵלֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/006/029.yaml
  text: Then Yahweh spoke to Moses[a], saying, “I am Yahweh. Speak to Pharaoh king of Egypt all that I speak to you.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa, “Akulah Yahweh. Sampaikanlah kepada Firaun, raja Mesir, segala yang Kufirmankan kepadamu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang sedang Kufirmankan kepadamu.”
    reason: Partisipel Ibrani דֹּבֵר dapat dipahami dengan nuansa progresif, yaitu tindakan berbicara yang sedang berlangsung.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. “Lalu” menyatakan perkembangan peristiwa secara alami, sedangkan “berfirman” merupakan padanan Indonesia yang wajar untuk perkataan langsung Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap dipertahankan.
- source_word: לֵאמֹר
  choice: tanda baca yang memperkenalkan kutipan langsung
  rationale: Dalam bahasa Indonesia, fungsi infinitif ini paling alami disampaikan melalui konstruksi “berfirman ...,” yang langsung diikuti kutipan, tanpa menambahkan kata “demikian” yang tidak diperlukan.
- source_word: אֲנִי יְהוָה
  choice: Akulah Yahweh
  rationale: Klausa nominal Ibrani menyatakan identitas dengan penekanan pada אֲנִי. Bentuk “Akulah” mempertahankan penegasan itu secara alami.
- source_word: דַּבֵּר
  choice: Sampaikanlah
  rationale: Imperatif ini memerintahkan Musa menyampaikan seluruh pesan kepada Firaun. “Sampaikanlah” lebih alami dalam konteks isi pesan, sambil tetap mempertahankan bentuk perintah.
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: Firaun, raja Mesir
  rationale: Frasa aposisional Ibrani dipertahankan dengan tanda koma sesuai kaidah bahasa Indonesia.
- source_word: אֵת כָּל אֲשֶׁר
  choice: segala yang
  rationale: Ungkapan ini mencakup seluruh isi yang harus disampaikan dan terdengar alami serta bermartabat dalam bahasa Indonesia.
- source_word: אֲנִי דֹּבֵר אֵלֶיךָ
  choice: Kufirmankan kepadamu
  rationale: Partisipel דֹּבֵר dapat menyatakan tindakan kini atau berkelanjutan. Bentuk ini mempertahankan ujaran ilahi dan cukup terbuka terhadap nuansa tersebut; alternatif progresif dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama tersebut secara langsung tanpa menggantinya dengan gelar.
- issue: Penegasan dalam אֲנִי יְהוָה
  choice: Akulah Yahweh
  alternative: Aku Yahweh
  rationale: “Akulah” menyampaikan tekanan pada pronomina אֲנִי dalam pernyataan identitas, yang penting dalam konteks pewahyuan nama ilahi di Kitab Keluaran.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Berfirman” dipakai secara idiomatis untuk perkataan Allah; “Firaun, raja Mesir” mempertahankan aposisi sumber. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti gaya hormat yang lazim dalam penerbitan Alkitab bahasa Indonesia.
