  register: Bahasa Indonesia baku, ringkas, dan wajar untuk daftar silsilah. Tanda titik dua pada teks konsultasi Inggris diganti dengan kopula 'ialah' agar kalimat berdiri alami tanpa mengubah hubungan genealogis.
