  yaml_path: translation/ot/exodus/006/021.yaml
  text: 'And the sons of Izhar: Korah, Nepheg, and Zichri.'
translation:
  language: id
  text: Anak-anak Yizhar ialah Korah, Nefeg, dan Zikri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: Anak-anak ... ialah
  rationale: בְּנֵי adalah bentuk jamak konstruktus dari 'anak laki-laki'. Dalam daftar silsilah ini, 'anak-anak' secara alami menunjuk kepada putra-putra yang langsung disebutkan. Konjungsi וּ tidak diterjemahkan tersendiri karena ayat ini merupakan lanjutan daftar dan pembukaan dengan 'Dan' kurang alami dalam bahasa Indonesia modern.
- source_word: יִצְהָר
  choice: Yizhar
  rationale: Nama diri ditransliterasikan dari bentuk Ibrani; huruf awal yod dipertahankan sebagai Y, sesuai bentuk sumber.
- source_word: קֹרַח
  choice: Korah
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: וָ/נֶפֶג
  choice: Nefeg
  rationale: Nama diri ditransliterasikan dari נֶפֶג; konsonan akhir gimel diwakili dengan g. Konjungsi diwujudkan secara alami dalam rangkaian daftar bahasa Indonesia.
- source_word: וְ/זִכְרִי
  choice: dan Zikri
  rationale: Nama diri ditransliterasikan dari זִכְרִי sebagai Zikri; konjungsi וְ diterjemahkan 'dan' sebelum unsur terakhir daftar.
