  text: These are the names of the sons of Israel who came to Egypt with Jacob[a], each man with his household.
translation:
  language: id
  text: Inilah[a] nama-nama putra Israel yang datang ke Mesir bersama Yakub; masing-masing datang dengan seisi rumahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan inilah nama-nama.” Bahasa Ibrani membuka ayat ini dengan kata penghubung yang mengaitkan Kitab Keluaran dengan kisah sebelumnya dalam Kitab Kejadian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Inilah
  rationale: Ungkapan ini secara alami memperkenalkan daftar dalam bahasa Indonesia. Konjungsi וְ juga menghubungkan kisah ini dengan narasi sebelumnya; kaitan tersebut dijelaskan dalam catatan kaki karena penerjemahan kaku “Dan inilah” kurang luwes sebagai pembukaan kitab.
- source_word: שְׁמוֹת
  choice: nama-nama
  rationale: Padanan langsung yang mempertahankan kaitan tematis dengan judul Ibrani kitab ini.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: anak-anak laki-laki Israel
  rationale: Frasa ini secara khusus menunjuk kepada putra-putra Israel/Yakub yang menjadi kepala keluarga, bukan semua keturunannya secara umum.
- source_word: הַבָּאִים
  choice: yang datang
  rationale: Partisip Ibrani di sini mengidentifikasi kelompok yang secara historis datang ke Mesir; klausa relatif ini alami dalam bahasa Indonesia.
- source_word: מִצְרָיְמָה
  choice: ke Mesir
  rationale: Akhiran arah pada bentuk Ibrani menyatakan gerak menuju Mesir.
- source_word: אֵת יַעֲקֹב
  choice: bersama Yakub
  rationale: אֵת di sini menyatakan penyertaan, bukan penanda objek langsung.
- source_word: אִישׁ וּ/בֵיתוֹ
  choice: masing-masing dengan seisi rumahnya
  rationale: אִישׁ berfungsi distributif, sedangkan בַּיִת dalam konteks ini berarti keluarga atau rumah tangga. “Seisi rumahnya” merupakan ungkapan Indonesia yang alami dan mencakup unit keluarga yang menyertai setiap orang.
- source_word: בָּאוּ
  choice: datang (tercakup dalam klausa “yang datang”)
  rationale: Kata kerja penutup melanjutkan kembali gagasan kedatangan setelah sisipan distributif. Dalam bahasa Indonesia, mengulang “mereka datang” akan terasa janggal; maknanya tetap terwakili oleh “yang datang” tanpa mengubah isi proposisional.
