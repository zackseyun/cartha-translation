source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר אֶל עַמּ֑/וֹ הִנֵּ֗ה עַ֚ם בְּנֵ֣י יִשְׂרָאֵ֔ל רַ֥ב וְ/עָצ֖וּם מִמֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/009.yaml
  text: And he said to his people[a], “Look, the people of the sons of Israel are more numerous and stronger than we are.”
translation:
  language: id
  text: Lalu ia berkata kepada rakyatnya, “Lihat, bangsa keturunan Israel lebih banyak dan lebih kuat daripada kita.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ia berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. ‘Lalu’ menyampaikan urutan naratif secara wajar dalam bahasa Indonesia tanpa menambahkan nuansa waktu yang berlebihan.
- source_word: אֶל עַמּוֹ
  choice: kepada rakyatnya
  rationale: עַם menunjuk kelompok masyarakat yang terkait dengan penguasa tersebut. Dalam konteks Firaun, ‘rakyatnya’ lebih alami dan tepat secara politis daripada ‘bangsanya’ atau ‘orang-orangnya’.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Partikel ini menarik perhatian pendengar kepada keadaan yang dianggap penting. ‘Lihat’ mempertahankan daya serunya dalam bahasa Indonesia modern.
- source_word: עַם בְּנֵי יִשְׂרָאֵל
  choice: bangsa keturunan Israel
  rationale: Ungkapan ini secara harfiah merujuk kepada ‘bangsa anak-anak Israel’. ‘Bangsa keturunan Israel’ mempertahankan unsur kolektif dan hubungan genealogisnya, tetapi terdengar lebih alami daripada terjemahan harfiah ‘bangsa anak-anak Israel’.
- source_word: רַב
  choice: lebih banyak
  rationale: Adjektiva ini, bersama מִמֶּנּוּ, menyatakan perbandingan jumlah. ‘Lebih banyak’ jelas dan alami dalam bahasa Indonesia.
- source_word: וְעָצוּם
  choice: dan lebih kuat
  rationale: עָצוּם menyatakan kekuatan atau keperkasaan. Dalam konstruksi perbandingan ini, ‘lebih kuat’ sesuai dengan konteks kekhawatiran Firaun.
- source_word: מִמֶּנּוּ
  choice: daripada kita
  rationale: Preposisi מן dengan sufiks orang pertama jamak menandai perbandingan, sehingga ‘daripada kita’ merupakan padanan Indonesia yang langsung dan idiomatis.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Diksi ‘rakyatnya’ mencerminkan konteks ujaran seorang penguasa, sedangkan ‘bangsa keturunan Israel’ menjaga identitas kolektif dan genealogis tanpa kekakuan terjemahan harfiah.
