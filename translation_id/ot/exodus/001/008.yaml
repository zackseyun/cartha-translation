  yaml_path: translation/ot/exodus/001/008.yaml
  text: A new king arose over Egypt[b][a], who did not know Yosef.
translation:
  language: id
  text: Seorang raja baru[a] tampil berkuasa atas Mesir. Raja itu tidak mengenal Yusuf[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “raja lain”; kata sifat Ibraninya secara harfiah berarti “baru”, tetapi sebagian penafsir memahaminya sebagai petunjuk tentang dinasti atau pemerintahan yang berbeda.
    reason: lexical_alternative
  - marker: b
    text: Atau “tidak mengakui Yusuf”; “mengenal” di sini dapat berarti mengakui atau memperhitungkan Yusuf, bukan sekadar tidak mengetahui siapa dia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: tampil berkuasa
  rationale: Bentuk wayyiqtol dari קום melanjutkan alur cerita dan, ketika dipakai tentang seorang raja, secara wajar menyatakan kemunculan atau naiknya penguasa. Ungkapan ini lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'bangkit' tanpa menambahkan rincian tentang cara ia memperoleh takhta.
- source_word: מֶלֶךְ
  choice: raja
  rationale: Kata benda ini secara langsung menunjuk kepada seorang raja; 'penguasa' lebih luas dan kurang tepat.
- source_word: חָדָשׁ
  choice: baru
  rationale: Arti leksikal dasarnya ialah 'baru'. Kemungkinan bahwa yang dimaksud adalah raja lain atau dinasti berbeda dipertahankan dalam catatan kaki, bukan dimasukkan ke teks utama.
- source_word: עַל מִצְרָיִם
  choice: atas Mesir
  rationale: Preposisi עַל bersama seorang penguasa menyatakan kewenangan atas suatu wilayah. 'Atas Mesir' mempertahankan hubungan kekuasaan itu.
- source_word: אֲשֶׁר לֹא יָדַע
  choice: yang tidak mengenal
  rationale: יָדַע lazim berarti 'mengetahui' atau 'mengenal'. Untuk objek berupa orang, 'tidak mengenal Yusuf' alami dalam bahasa Indonesia dan tetap membuka kemungkinan makna tidak mengakui atau tidak mengindahkan kedudukannya.
- source_word: יוֹסֵף
  choice: Yusuf
  rationale: Yusuf adalah bentuk nama Ibrani יוֹסֵף yang sudah mapan, alami, dan mudah dikenali dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah frasa 'raja baru' dan 'tidak mengenal Yusuf' harus menyiratkan pergantian dinasti atau permusuhan politik
  choice: Mempertahankan kata-kata sederhana 'seorang raja baru ... yang tidak mengenal Yusuf'.
  alternative: Seorang raja dari dinasti lain tampil berkuasa; atau seorang raja yang tidak mengakui jasa Yusuf.
  rationale: Ayat ini sendiri hanya menyebut seorang raja baru dan mengatakan bahwa ia tidak mengenal Yusuf. Pergantian dinasti dan pengabaian yang disengaja mungkin merupakan tafsiran yang masuk akal, tetapi tidak diwajibkan oleh bahasa Ibrani dan karena itu tidak dimasukkan ke teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. 'Tampil berkuasa' dipilih agar idiomatis bagi kemunculan seorang raja, sedangkan 'baru' dan 'tidak mengenal' mempertahankan ambiguitas teks sumber. Penanda catatan kaki ditempatkan tepat sesudah unsur yang dijelaskan.
