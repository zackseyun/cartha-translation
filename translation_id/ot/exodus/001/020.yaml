reference: Exodus 1:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּ֥יטֶב אֱלֹהִ֖ים לַֽ/מְיַלְּדֹ֑ת וַ/יִּ֧רֶב הָ/עָ֛ם וַ/יַּֽעַצְמ֖וּ מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/020.yaml
  text: So God dealt well with the midwives[a], and the people multiplied and became very strong.
translation:
  language: id
  text: Maka Allah berbuat baik kepada para bidan itu[a]. Bangsa itu pun bertambah banyak dan menjadi sangat kuat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memperlakukan para bidan itu dengan baik” atau “memberkati para bidan itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּיטֶב
  choice: berbuat baik kepada
  rationale: Bentuk Hifil dari יטב dengan ל menyatakan bahwa Allah melakukan kebaikan kepada para bidan. Ungkapan ini alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi tindakan khusus seperti 'memberkati'.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks narasi ini, אֱלֹהִים menunjuk kepada Allah Israel; 'Allah' merupakan padanan baku dalam bahasa Indonesia.
- source_word: לַמְיַלְּדֹת
  choice: kepada para bidan itu
  rationale: Preposisi ל menandai penerima kebaikan. Bentuk definit Ibrani dipertahankan dengan 'itu', yang merujuk kepada para bidan yang sudah disebutkan.
- source_word: וַיִּרֶב
  choice: bertambah banyak
  rationale: רבה di sini menggambarkan pertumbuhan jumlah bangsa itu. 'Bertambah banyak' jelas, alami, dan mempertahankan gagasan peningkatan numerik.
- source_word: הָעָם
  choice: bangsa itu
  rationale: הָעָם dapat berarti 'rakyat' atau 'bangsa'. Dalam konteks pertumbuhan bani Israel sebagai suatu kelompok, 'bangsa itu' alami dan tidak perlu menambahkan 'Israel' yang tidak dinyatakan dalam ayat ini.
- source_word: וַיַּעַצְמוּ
  choice: menjadi sangat kuat
  rationale: עצם menyatakan bertumbuh menjadi kuat atau perkasa. Pilihan ini mempertahankan perubahan keadaan yang dinyatakan oleh verba.
- source_word: מְאֹד
  choice: sangat
  rationale: מְאֹד memperkuat verba sebelumnya; 'sangat' adalah padanan modern yang alami.
theological_decisions:
- issue: Apakah tindakan Allah diterjemahkan sebagai 'memberkati' atau secara lebih netral sebagai 'berbuat baik kepada' para bidan
  choice: berbuat baik kepada para bidan itu
  alternative: memberkati para bidan itu
  rationale: יטב menyatakan tindakan berbuat baik, tetapi tidak menentukan bentuk kebaikan tersebut. Terjemahan yang lebih netral mempertahankan cakupan teks dan membiarkan ayat berikutnya menjelaskan tindakan Allah lebih lanjut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dua kalimat dipakai agar alur sebab-akibat tetap jelas dan mudah dibaca; partikel 'pun' menandai kelanjutan narasi tanpa menambahkan hubungan teologis yang tidak dinyatakan secara eksplisit.
