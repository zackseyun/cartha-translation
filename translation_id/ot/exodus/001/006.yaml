  text: Kemudian Yusuf meninggal; semua saudara laki-lakinya dan seluruh generasi itu juga meninggal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: Kemudian ... meninggal
  rationale: Bentuk wayyiqtol dari מות melanjutkan rangkaian narasi dengan peristiwa lampau. 'Kemudian' menyampaikan urutan peristiwa secara alami dalam bahasa Indonesia.
- source_word: יוֹסֵף
  choice: Yusuf
  rationale: Nama ini memakai bentuk baku yang lazim dalam tradisi Alkitab berbahasa Indonesia.
- source_word: וְכָל אֶחָיו
  choice: begitu juga semua saudara laki-lakinya
  rationale: כָּל bermakna kolektif, sedangkan bentuk jamak אָח dengan sufiks orang ketiga tunggal maskulin merujuk kepada saudara-saudara laki-laki Yusuf. 'Begitu juga' mengungkapkan koordinasi waw secara alami tanpa menyiratkan bahwa mereka meninggal pada saat yang persis sama.
- source_word: וְכֹל הַדּוֹר הַהוּא
  choice: dan seluruh angkatan itu
  rationale: Pengulangan כֹּל dipertahankan melalui 'seluruh', dan דּוֹר menunjuk kepada kelompok orang yang hidup sezaman. 'Angkatan' merupakan padanan Indonesia yang ringkas dan sesuai konteks.
