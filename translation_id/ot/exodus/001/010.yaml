source:
  edition: WLC
  text: הָ֥בָ/ה נִֽתְחַכְּמָ֖ה ל֑/וֹ פֶּן יִרְבֶּ֗ה וְ/הָיָ֞ה כִּֽי תִקְרֶ֤אנָה מִלְחָמָה֙ וְ/נוֹסַ֤ף גַּם הוּא֙ עַל שֹׂ֣נְאֵ֔י/נוּ וְ/נִלְחַם בָּ֖/נוּ וְ/עָלָ֥ה מִן הָ/אָֽרֶץ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/010.yaml
  text: Come[a], let us deal shrewdly with them, lest they multiply, and if war breaks out[c][b], they too may join our enemies and fight against us and go up out of the land.
translation:
  language: id
  text: Mari, kita bertindak dengan cerdik terhadap mereka[a], supaya mereka tidak bertambah banyak. Jika perang terjadi, mereka pun dapat bergabung dengan musuh-musuh kita, berperang melawan kita, lalu naik keluar dari negeri ini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani memakai kata ganti tunggal, “dia,” yang mengacu secara kolektif kepada Israel sebagai satu bangsa.
    reason: lexical_alternative
  - marker: b
    text: Atau, “meninggalkan negeri ini.” Secara harfiah, “naik keluar dari negeri ini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה
  choice: Mari
  rationale: Kata seru ini mengajak orang lain untuk segera melakukan tindakan bersama; “Mari” alami dan tepat dalam bahasa Indonesia.
- source_word: נִתְחַכְּמָה
  choice: kita bertindak dengan cerdik
  rationale: Bentuk ini dapat berarti bertindak bijaksana atau dengan siasat. Dalam konteks kebijakan Firaun yang penuh perhitungan terhadap ancaman yang dipersepsikan, “dengan cerdik” mempertahankan nuansa strategis tanpa melebihkan maknanya menjadi penipuan secara eksplisit.
- source_word: לוֹ
  choice: terhadap mereka
  rationale: Secara morfologis pronomina ini tunggal, tetapi acuannya ialah Israel sebagai satu bangsa kolektif. Bahasa Indonesia lebih alami memakai bentuk jamak “mereka” bagi orang-orang Israel.
- source_word: פֶּן יִרְבֶּה
  choice: supaya mereka tidak bertambah banyak
  rationale: פֶּן memperkenalkan hasil yang dikhawatirkan dan hendak dicegah. Susunan ini lebih alami daripada “jangan sampai” setelah klausa ajakan, sedangkan bentuk jamak mencerminkan acuan kolektifnya.
- source_word: וְהָיָה כִּי תִקְרֶאנָה מִלְחָמָה
  choice: Jika perang terjadi
  rationale: Ungkapan tersebut menyatakan kemungkinan terjadinya perang. “Jika perang terjadi” jelas, wajar, dan mempertahankan sifat kontingennya.
- source_word: וְנוֹסַף גַּם הוּא עַל שֹׂנְאֵינוּ
  choice: mereka pun dapat bergabung dengan musuh-musuh kita
  rationale: Dengan עַל, verba יסף di sini menyatakan bergabung atau menambahkan diri kepada suatu pihak. “Dapat” menyampaikan hasil yang dikhawatirkan dalam kondisi hipotetis tanpa menjadikannya kepastian.
- source_word: וְנִלְחַם בָּנוּ
  choice: berperang melawan kita
  rationale: Terjemahan ini mempertahankan tindakan permusuhan dan hubungan adversatif yang dinyatakan oleh בְּ.
- source_word: וְעָלָה מִן הָאָרֶץ
  choice: lalu pergi dari negeri ini
  rationale: עלה secara harfiah berarti “naik”, tetapi dalam gabungan dengan מִן הָאָרֶץ ungkapan itu dapat merujuk pada kepergian dari negeri tersebut. Teks utama memakai bahasa Indonesia yang alami, sementara arti harfiahnya dicatat agar citra dan ambiguitas sumber tetap terlihat.
theological_decisions:
- issue: Acuan pronomina tunggal kolektif kepada Israel
  choice: mereka
  alternative: dia/ia
  rationale: Teks Ibrani memperlakukan Israel sebagai satu kesatuan kolektif, tetapi dalam bahasa Indonesia “mereka” menghindari kesan bahwa yang dimaksud adalah seorang individu.
- issue: Makna וְעָלָה מִן הָאָרֶץ
  choice: pergi dari negeri ini
  alternative: naik keluar dari negeri ini
  rationale: Terjemahan utama menyampaikan kemungkinan keluarnya Israel dari Mesir secara alami, sedangkan catatan kaki mempertahankan bentuk harfiah dan tidak menetapkan secara berlebihan implikasi politis atau teologisnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. “Mari” menjaga daya ajakan; “bertindak dengan cerdik” mempertahankan nuansa perhitungan politis. Penanda catatan kaki ditempatkan langsung pada bagian teks yang dijelaskan.
