base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/022.yaml
  text: Then Pharaoh commanded all his people[a], saying, “Every son who is born you must throw into the Nile[c][b], but every daughter you must let live.”
translation:
  language: id
  text: Firaun lalu memerintahkan seluruh rakyatnya, “Setiap anak laki-laki yang lahir harus kalian lemparkan ke Sungai Nil,[a] tetapi setiap anak perempuan harus kalian biarkan hidup.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke sungai itu.” Dalam kitab Keluaran, istilah ini biasanya merujuk secara khusus kepada Sungai Nil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: lalu memerintahkan
  rationale: Kata kerja צוה menyatakan pemberian perintah. ‘Memerintahkan’ sesuai dengan konteks titah kerajaan, sedangkan ‘lalu’ meneruskan alur narasi dari ayat sebelumnya.
- source_word: לְכָל עַמּוֹ
  choice: seluruh rakyatnya
  rationale: עַם berarti ‘rakyat’ atau ‘bangsa’. Dalam konteks ini, ‘seluruh rakyatnya’ secara alami menunjuk kepada orang-orang Mesir yang berada di bawah kekuasaan Firaun tanpa mempersempitnya menjadi pejabat atau aparat.
- source_word: לֵאמֹר
  choice: dinyatakan melalui pembukaan kutipan langsung
  rationale: Infinitif pengutip ini secara idiomatis terwakili dalam bahasa Indonesia oleh tanda baca dan kutipan langsung; penambahan ‘katanya’ setelah ‘memerintahkan’ terasa berulang.
- source_word: כָּל הַבֵּן הַיִּלּוֹד
  choice: setiap anak laki-laki yang lahir
  rationale: בֵּן secara harfiah berarti ‘anak laki-laki/putra’, dan dalam konteks ini menunjuk kepada bayi laki-laki. Bentuk pasif הַיִּלּוֹד dipertahankan dengan ‘yang lahir’ tanpa menambahkan identitas etnis yang tidak dinyatakan dalam ayat ini.
- source_word: הַיְאֹרָה
  choice: ke Sungai Nil
  rationale: יְאֹר secara leksikal berarti ‘sungai’, tetapi dalam kitab Keluaran secara khusus merujuk kepada Sungai Nil. Nama referennya dipakai dalam teks agar jelas bagi pembaca modern, dengan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: תַּשְׁלִיכֻהוּ
  choice: harus kalian lemparkan
  rationale: Bentuk orang kedua jamak menyapa seluruh rakyat Firaun, dan sufiks objek tunggal merujuk kepada setiap anak laki-laki. ‘Harus kalian lemparkan’ menyampaikan daya perintah dengan jelas dan wajar.
- source_word: וְכָל הַבַּת
  choice: tetapi setiap anak perempuan
  rationale: וְ secara bentuk berarti ‘dan’, tetapi di sini menghubungkan dua perlakuan yang berlawanan. ‘Tetapi’ menyatakan hubungan kontras itu secara alami dalam bahasa Indonesia.
- source_word: תְּחַיּוּן
  choice: harus kalian biarkan hidup
  rationale: Bentuk Piel dari חיה di sini berarti membiarkan atau mempertahankan seseorang tetap hidup. ‘Biarkan hidup’ menghadirkan kontras langsung dengan perintah membuang anak laki-laki ke sungai.
theological_decisions:
- issue: Cakupan etnis anak-anak yang menjadi sasaran titah
  choice: Tidak menambahkan ‘Ibrani’ dalam teks ayat
  alternative: ‘Setiap anak laki-laki Ibrani yang lahir’
  rationale: Konteks narasi mengarahkan pembaca kepada anak-anak orang Ibrani, tetapi teks Ibrani ayat ini sendiri hanya mengatakan ‘setiap anak laki-laki yang lahir’. Terjemahan mempertahankan keluasan gramatikal tersebut dan tidak menyelesaikan implikasi konteks dengan penambahan eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. ‘Firaun’, ‘rakyatnya’, serta sapaan jamak ‘kalian’ menjaga suasana titah kerajaan sekaligus tetap mudah dipahami. Struktur kutipan dibuat alami tanpa mengurangi kerasnya perintah.
