  text: וַ/יִּקְרָ֤א מֶֽלֶךְ מִצְרַ֨יִם֙ לַֽ/מְיַלְּדֹ֔ת וַ/יֹּ֣אמֶר לָ/הֶ֔ן מַדּ֥וּעַ עֲשִׂיתֶ֖ן הַ/דָּבָ֣ר הַ/זֶּ֑ה וַ/תְּחַיֶּ֖יןָ אֶת הַ/יְלָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/018.yaml
  text: So the king of Egypt called for the midwives and said to them[a], “Why have you done this thing and let the children live?”
translation:
  language: id
  text: Lalu raja Mesir memanggil para bidan itu dan berkata kepada mereka, “Mengapa kalian melakukan hal ini dan membiarkan anak-anak itu hidup?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mempertahankan anak-anak lelaki itu tetap hidup.” Dalam konteks ini, kata kerja Ibrani dapat berarti menyebabkan hidup, mempertahankan hidup, atau membiarkan hidup.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: memanggil
  rationale: Dalam konstruksi dengan ל yang menunjuk orang, קרא berarti memanggil atau menyuruh seseorang datang. “Memanggil” alami dalam bahasa Indonesia dan sesuai dengan konteks raja menghadapkan para bidan.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: raja Mesir
  rationale: Menerjemahkan rangkaian konstruksi Ibrani secara langsung dan wajar.
- source_word: לַמְיַלְּדֹת
  choice: para bidan itu
  rationale: Bentuk partisip dari ילד menunjuk para perempuan yang menolong persalinan. “Bidan” adalah padanan Indonesia yang tepat; “itu” menandai bahwa mereka telah disebut sebelumnya.
- source_word: וַיֹּאמֶר לָהֶן
  choice: dan berkata kepada mereka
  rationale: Mempertahankan pengantar ujaran langsung dari אמר tanpa menambahkan nuansa perintah.
- source_word: מַדּוּעַ
  choice: Mengapa
  rationale: Padanan ringkas dan alami untuk kata tanya yang meminta alasan.
- source_word: עֲשִׂיתֶן
  choice: kalian melakukan
  rationale: Bentuk Ibrani adalah orang kedua jamak feminin. Bahasa Indonesia tidak menandai gender, tetapi “kalian” mempertahankan jamaknya dan sesuai untuk ujaran langsung.
- source_word: הַדָּבָר הַזֶּה
  choice: hal ini
  rationale: דבר di sini menunjuk tindakan atau perkara. “Hal ini” alami dan tetap dekat dengan ungkapan sumber.
- source_word: וַתְּחַיֶּיןָ
  choice: membiarkan ... hidup
  rationale: Bentuk dari חיה dapat berarti menyebabkan hidup, mempertahankan hidup, atau membiarkan tetap hidup. Dalam tuduhan Firaun, “membiarkan ... hidup” merupakan padanan alami sambil mempertahankan kemungkinan leksikal lain dalam catatan kaki.
- source_word: הַיְלָדִים
  choice: anak-anak itu
  rationale: Kata יְלָדִים secara leksikal berarti anak-anak; konteks sebelumnya mengacu kepada bayi laki-laki. Teks utama mempertahankan keluasan istilah sumber dan tidak mempersempitnya secara diam-diam.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk mempertahankan sapaan jamak kepada para bidan; susunan kalimat dibuat alami tanpa menghilangkan hubungan antarklausa dalam teks Ibrani.
