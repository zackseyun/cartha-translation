  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ מֶ֣לֶךְ מִצְרַ֔יִם לַֽ/מְיַלְּדֹ֖ת הָֽ/עִבְרִיֹּ֑ת אֲשֶׁ֨ר שֵׁ֤ם הָֽ/אַחַת֙ שִׁפְרָ֔ה וְ/שֵׁ֥ם הַ/שֵּׁנִ֖ית פּוּעָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/015.yaml
  text: Then the king of Egypt said to the Hebrew midwives[a], one of whom was named Shiphrah and the other Puah,
translation:
  language: id
  text: Kemudian raja Mesir berkata kepada para bidan Ibrani[a], yang seorang bernama Sifra dan yang lain bernama Pua,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “para bidan bagi perempuan-perempuan Ibrani.” Frasa Ibraninya dapat berarti bahwa para bidan itu orang Ibrani atau bahwa mereka melayani perempuan-perempuan Ibrani.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kemudian ... berkata
  rationale: Bentuk waw-konsekutif melanjutkan urutan narasi; “Kemudian” menyampaikan gerak naratif secara alami dalam bahasa Indonesia modern.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: raja Mesir
  rationale: Menerjemahkan konstruksi kepunyaan secara langsung tanpa memasukkan gelar “Firaun,” yang tidak terdapat dalam ayat ini.
- source_word: לַמְיַלְּדֹת
  choice: kepada para bidan
  rationale: Partisip feminin dari akar ילד menunjuk kepada perempuan yang membantu persalinan; “bidan” adalah padanan Indonesia yang jelas dan lazim.
- source_word: הָעִבְרִיֹּת
  choice: Ibrani
  rationale: Secara sintaksis dapat menerangkan para bidan sebagai orang Ibrani, tetapi frasa Ibrani ini juga mungkin berarti para bidan yang melayani perempuan Ibrani; ambiguitas dicatat dalam catatan kaki.
- source_word: אֲשֶׁר שֵׁם הָאַחַת ... וְשֵׁם הַשֵּׁנִית ...
  choice: yang seorang bernama ... dan yang lain bernama ...
  rationale: Ungkapan ini mengidentifikasi dua bidan secara distributif; susunan tersebut alami dalam bahasa Indonesia dan mempertahankan pembedaan antara keduanya.
- source_word: שִׁפְרָה
  choice: Sifra
  rationale: Transliterasi nama Ibrani yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: פּוּעָה
  choice: Pua
  rationale: Transliterasi langsung yang lazim dalam bahasa Indonesia.
