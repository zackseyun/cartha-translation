id: EXO.1.11
reference: Exodus 1:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּשִׂ֤ימוּ עָלָי/ו֙ שָׂרֵ֣י מִסִּ֔ים לְמַ֥עַן עַנֹּת֖/וֹ בְּ/סִבְלֹתָ֑/ם וַ/יִּ֜בֶן עָרֵ֤י מִסְכְּנוֹת֙ לְ/פַרְעֹ֔ה אֶת פִּתֹ֖ם וְ/אֶת רַעַמְסֵֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/011.yaml
  text: 'So they set taskmasters over him to afflict him with their burdens[c][b][a], and he built storage cities for Pharaoh: Pithom and Rameses.'
translation:
  language: id
  text: Karena itu, mereka mengangkat para pengawas kerja paksa atas Israel untuk menindasnya dengan beban-beban mereka. Lalu Israel membangun[a] kota-kota perbekalan[b] bagi Firaun, yaitu Pitom dan Raamses.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani memakai bentuk tunggal untuk Israel sebagai satu bangsa; dapat juga diterjemahkan dengan bentuk jamak: “atas mereka,” “menindas mereka,” dan “mereka membangun.”'
    reason: alternative_reading
  - marker: b
    text: Atau “kota-kota gudang.”
    reason: lexical_alternative
  - marker: c
    text: Nama Raamses juga dapat ditulis “Rameses.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ
  choice: mereka mengangkat
  rationale: Kata שׂים dalam konteks penetapan pejabat berarti menempatkan atau mengangkat; bentuk ini alami dalam bahasa Indonesia.
- source_word: עָלָיו
  choice: atas Israel
  rationale: Akhiran tunggal maskulin merujuk secara kolektif kepada Israel. Menyebut 'Israel' mempertahankan rujukan tunggal tanpa menghasilkan pronomina Indonesia yang rancu.
- source_word: שָׂרֵי מִסִּים
  choice: para pengawas kerja paksa
  rationale: Frasa ini menunjuk pejabat yang mengepalai kerja rodi atau kerja wajib; pilihan ini jelas bagi pembaca modern dan mempertahankan fungsi mereka.
- source_word: לְמַעַן עַנֹּתוֹ
  choice: untuk menindasnya
  rationale: Bentuk piel ענה di sini menyatakan tindakan menindas atau menyengsarakan; 'menindas' sesuai dengan konteks penindasan sistematis.
- source_word: בְּסִבְלֹתָם
  choice: dengan beban-beban mereka
  rationale: Terjemahan ini mempertahankan akhiran jamak dan ambiguitas antara beban fisik dan kewajiban kerja berat tanpa menambahkan penafsiran.
- source_word: וַיִּבֶן
  choice: Israel membangun
  rationale: Kata kerja Ibrani berbentuk tunggal dan subjek tersiratnya adalah Israel sebagai kesatuan kolektif. Penyebutan nama kolektif alami dalam bahasa Indonesia sekaligus mempertahankan bentuk tunggal konseptual.
- source_word: עָרֵי מִסְכְּנוֹת
  choice: kota-kota perbekalan
  rationale: Istilah ini menunjuk kota pusat penyimpanan atau persediaan; 'perbekalan' lebih alami daripada 'penyimpanan' sebagai jenis kota.
- source_word: לְפַרְעֹה
  choice: bagi Firaun
  rationale: Padanan baku dan alami untuk hubungan peruntukan yang ditandai לְ.
- source_word: פִּתֹם
  choice: Pitom
  rationale: Transliterasi nama tempat yang sesuai dengan ejaan bahasa Indonesia.
- source_word: רַעַמְסֵס
  choice: Raamses
  rationale: Transliterasi ini dekat dengan bentuk Ibrani dan telah dikenal dalam tradisi Alkitab bahasa Indonesia; bentuk 'Rameses' dicatat sebagai alternatif.
theological_decisions:
- issue: Israel digambarkan dengan bentuk tunggal kolektif
  choice: Menyebut 'Israel' dan memakai akhiran tunggal '-nya', lalu mengulang 'Israel' sebagai subjek pembangunan
  alternative: Memakai bentuk jamak 'mereka' di seluruh ayat
  rationale: Pilihan ini mempertahankan idiom Ibrani yang memandang Israel sebagai satu kesatuan tanpa mengaburkan bahwa bangsa itulah yang dikenai kerja paksa dan membangun kota-kota tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Nama 'Israel' dipakai untuk menjernihkan rujukan kolektif, sedangkan ungkapan 'beban-beban mereka' sengaja mempertahankan ambiguitas sumber.
