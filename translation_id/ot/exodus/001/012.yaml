base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/012.yaml
  text: But the more they afflicted them[a], the more they multiplied and the more they spread out[c][b], so that they dreaded the sons of Israel.
translation:
  language: id
  text: Namun, semakin mereka menindas bangsa itu,[a] semakin bangsa itu bertambah banyak dan semakin meluas. Maka mereka merasa gentar terhadap orang Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dia”; yang dimaksud ialah Israel sebagai satu bangsa.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “merasa gentar” juga dapat berarti “merasa jijik” atau “merasa muak terhadap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַאֲשֶר ... כֵּן ... וְכֵן
  choice: semakin ... semakin ... dan semakin
  rationale: 'Konstruksi korelatif ini menyatakan hubungan berbanding: peningkatan penindasan diikuti peningkatan jumlah dan perluasan Israel.'
- source_word: יְעַנּוּ
  choice: mereka menindas
  rationale: Bentuk Piel dari ענה di sini menunjuk pada perlakuan yang menekan atau menyengsarakan; 'menindas' alami dan tepat dalam konteks kerja paksa.
- source_word: אֹתוֹ
  choice: bangsa itu
  rationale: Pronomina Ibrani berbentuk tunggal dan mengacu secara kolektif kepada Israel. 'Bangsa itu' mempertahankan sifat kolektif tanpa menimbulkan ketidakjelasan dalam bahasa Indonesia.
- source_word: יִרְבֶּה
  choice: bangsa itu bertambah banyak
  rationale: Verba tunggal sesuai dengan Israel sebagai subjek kolektif dan dalam konteks ini mengacu pada pertumbuhan jumlah penduduk.
- source_word: יִפְרֹץ
  choice: meluas
  rationale: פרץ dapat menggambarkan penerobosan atau perkembangan yang kuat; dalam konteks pertumbuhan suatu bangsa, 'meluas' menyampaikan penyebaran dan ekspansinya secara alami.
- source_word: וַיָּקֻצוּ
  choice: mereka merasa gentar
  rationale: קוץ dapat menyatakan rasa takut yang kuat maupun rasa muak. 'Merasa gentar' cocok dengan ancaman yang dirasakan dalam konteks, sementara alternatif semantisnya dicatat.
- source_word: מִפְּנֵי
  choice: terhadap
  rationale: Bersama verba קוץ, preposisi ini menyatakan pihak yang menimbulkan kegentaran atau kejijikan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Ungkapan etnonimik ini secara harfiah berarti 'anak-anak lelaki Israel', tetapi mencakup umat Israel sebagai satu kelompok. 'Keturunan Israel' mempertahankan hubungan genealogis dan mencakup seluruh bangsa secara wajar.
theological_decisions:
- issue: Acuan kolektif Israel dalam bentuk gramatikal tunggal
  choice: bangsa itu
  alternative: mereka / dia
  rationale: Pilihan ini mempertahankan konsep Israel sebagai satu umat kolektif sekaligus menghasilkan bahasa Indonesia yang jelas.
- issue: Rentang makna וַיָּקֻצוּ
  choice: merasa gentar
  alternative: merasa muak terhadap
  rationale: Konteks pertumbuhan Israel dan ketakutan Mesir pada ayat-ayat sekitar mendukung kegentaran, tetapi makna kebencian atau kemuakan tetap mungkin dan dipertahankan dalam catatan kaki.
- issue: Terjemahan בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak lelaki Israel / orang Israel
  rationale: Ungkapan ini merupakan sebutan etnonimik bagi bangsa Israel, bukan pembatasan pada laki-laki saja. 'Keturunan Israel' transparan terhadap unsur genealogis tanpa mengecualikan perempuan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'semakin' mempertahankan pola retoris Ibrani. Subjek Mesir dibiarkan tersirat sebagaimana dalam teks sumber dan dapat dipahami dari konteks sebelumnya.
