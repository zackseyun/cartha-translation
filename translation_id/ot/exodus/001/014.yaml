base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/014.yaml
  text: And they made their lives bitter with hard labor in mortar and bricks and in every kind of field work—all their labor that they imposed on them with harshness[a].
translation:
  language: id
  text: 'Mereka membuat hidup orang Israel pahit dengan kerja berat: mengolah tanah liat, membuat batu bata, dan melakukan segala macam pekerjaan di ladang—semua pekerjaan itu mereka bebankan kepada orang Israel dengan kekejaman[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tanpa belas kasihan.” Istilah Ibrani ini menggambarkan penindasan yang keras dan menghancurkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָרְרוּ אֶת חַיֵּיהֶם
  choice: membuat hidup orang Israel pahit
  rationale: Mempertahankan metafora harfiah dari akar מרר, sedangkan penyebutan “orang Israel” memperjelas acuan pronomina dalam bahasa Indonesia tanpa mengubah pelakunya.
- source_word: בַּעֲבֹדָה קָשָׁה
  choice: dengan kerja berat
  rationale: עֲבֹדָה berarti kerja atau pengabdian, dan קָשָׁה menandakan berat atau keras; “kerja berat” alami dan tepat dalam konteks penindasan.
- source_word: בְּחֹמֶר וּבִלְבֵנִים
  choice: menggunakan tanah liat dan batu bata
  rationale: Dalam konteks pembuatan bangunan, חֹמֶר dapat menunjuk tanah liat atau adukan; “tanah liat” berpasangan secara wajar dengan bentuk jamak לְבֵנִים, “batu bata,” serta menghindari kesan bahan semen modern.
- source_word: וּבְכָל עֲבֹדָה בַּשָּׂדֶה
  choice: serta dengan segala macam pekerjaan di ladang
  rationale: Menyampaikan cakupan menyeluruh dari כָל עֲבֹדָה dan mempertahankan lokasi pekerjaan di ladang.
- source_word: אֵת כָּל עֲבֹדָתָם אֲשֶׁר עָבְדוּ בָהֶם
  choice: semua pekerjaan yang mereka bebankan kepada orang Israel
  rationale: Ungkapan Ibrani bersifat merangkum dan berat. “Bebankan” mengungkapkan bahwa orang Mesir memaksa orang Israel melakukan pekerjaan tersebut tanpa menambahkan rincian baru.
- source_word: בְּפָרֶךְ
  choice: dengan kejam
  rationale: פָרֶךְ menggambarkan perlakuan keras dan menindas. “Dengan kejam” ringkas, alami, dan mempertahankan daya ungkapnya; alternatif yang menekankan ketiadaan belas kasihan dicatat dalam catatan kaki.
