  to: 'Mereka membuat hidup orang Israel pahit dengan kerja berat: mengolah tanah liat, membuat batu bata, dan melakukan segala macam pekerjaan di ladang—semua pekerjaan itu mereka bebankan kepada orang Israel dengan kekejaman[a].'
