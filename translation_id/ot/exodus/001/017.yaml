source:
  edition: WLC
  text: וַ/תִּירֶ֤אןָ הַֽ/מְיַלְּדֹת֙ אֶת הָ֣/אֱלֹהִ֔ים וְ/לֹ֣א עָשׂ֔וּ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אֲלֵי/הֶ֖ן מֶ֣לֶךְ מִצְרָ֑יִם וַ/תְּחַיֶּ֖יןָ אֶת הַ/יְלָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/017.yaml
  text: But the midwives feared God[a], and did not do as the king of Egypt had told them; rather, they let the children live.
translation:
  language: id
  text: Namun, para bidan itu takut akan Allah dan tidak melakukan apa yang diperintahkan raja Mesir kepada mereka; sebaliknya, mereka membiarkan anak-anak itu hidup[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: mereka menjaga anak-anak itu tetap hidup.'
    reason: Alternatif ini mencerminkan kemungkinan nuansa kausatif piel וַתְּחַיֶּיןָ sebagai tindakan mempertahankan atau menjaga agar tetap hidup.
lexical_decisions:
- source_word: וַתִּירֶאןָ
  choice: takut akan
  rationale: Kata ירא mencakup rasa takut sekaligus hormat yang mendalam kepada Allah. Ungkapan baku Alkitabiah “takut akan Allah” mempertahankan kedua nuansa itu tanpa melunakkannya menjadi sekadar rasa hormat.
- source_word: הַמְיַלְּדֹת
  choice: para bidan itu
  rationale: Bentuk partisip dari ילד dipakai sebagai nomina bagi perempuan yang membantu persalinan. “Para bidan” merupakan padanan Indonesia yang alami dan tepat; “itu” menandai kelompok yang sudah disebutkan dalam konteks.
- source_word: אֶת הָאֱלֹהִים
  choice: Allah
  rationale: Dalam konstruksi dengan kata kerja “takut”, frasa ini merujuk kepada Allah. Bahasa Indonesia secara alami tidak memerlukan pemertahanan artikel Ibrani sebagai “Allah itu” di sini.
- source_word: וְלֹא עָשׂוּ כַּאֲשֶׁר דִּבֶּר אֲלֵיהֶן
  choice: tidak melakukan apa yang diperintahkan ... kepada mereka
  rationale: Secara harfiah berarti “tidak melakukan seperti yang dikatakan ... kepada mereka”. Karena perkataan raja merupakan perintah, “apa yang diperintahkan” menyampaikan maksud konteks secara wajar tanpa menambah isi.
- source_word: מֶלֶךְ מִצְרָיִם
  choice: raja Mesir
  rationale: Padanan konstruksi status constructus yang ringkas, jelas, dan lazim dalam bahasa Indonesia.
- source_word: וַתְּחַיֶּיןָ
  choice: mereka membiarkan ... hidup
  rationale: Bentuk piel dari חיה dapat berarti menyebabkan hidup atau mempertahankan hidup. “Membiarkan ... hidup” sesuai dengan pertentangannya terhadap perintah untuk membunuh, sambil mempertahankan kemungkinan alternatif “menjaga ... tetap hidup” dalam catatan kaki.
- source_word: הַיְלָדִים
  choice: anak-anak itu
  rationale: יְלָדִים secara leksikal berarti “anak-anak”, bukan secara khusus “anak laki-laki”, walaupun konteks sebelumnya memperjelas bahwa bayi laki-lakilah yang menjadi sasaran perintah. Terjemahan ini mempertahankan keluasan kata sumber.
theological_decisions:
- issue: Makna takut kepada Allah
  choice: takut akan Allah
  alternative: hormat kepada Allah
  rationale: Pilihan ini mempertahankan ketegangan semantis ירא antara rasa gentar dan penghormatan, serta tidak mereduksinya menjadi penghormatan saja.
- issue: Rujukan אֱלֹהִים dengan artikel dalam bahasa Ibrani
  choice: Allah
  alternative: Allah itu
  rationale: Konteks narasi menunjuk kepada Allah, sedangkan “Allah itu” tidak alami dan dapat memberi kesan kontras yang tidak dinyatakan dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang wajar dan bermartabat. “Namun” dan “sebaliknya” menampilkan pertentangan dalam ayat dengan jelas. Penanda catatan kaki ditempatkan setelah frasa yang benar-benar memiliki alternatif leksikal, bukan setelah “Allah”.
