translation:
  language: id
  text: Orang Mesir memaksa bani Israel bekerja dengan kejam[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Israel”; secara harfiah, “anak-anak lelaki Israel.”
    reason: lexical_alternative
  - marker: b
    text: Atau “dengan kekerasan” atau “tanpa belas kasihan.” Kata Ibrani ini menunjuk pada perlakuan yang sangat keras dan menindas dalam kerja paksa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבִדוּ
  choice: memaksa ... bekerja
  rationale: Bentuk Hifil dari עבד bersifat kausatif, yaitu membuat atau memaksa seseorang bekerja/mengabdi. Dalam konteks kerja paksa, “memaksa ... bekerja” alami dalam bahasa Indonesia dan mempertahankan daya kausatif tanpa menjadikan verba ini sendiri sebagai istilah teknis “memperbudak”.
- source_word: מִצְרַיִם
  choice: Orang Mesir
  rationale: Di sini מִצְרַיִם menunjuk kepada bangsa Mesir sebagai pelaku tindakan, bukan semata-mata wilayah Mesir.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: “Bani Israel” merupakan ungkapan Indonesia yang dikenal luas untuk sebutan korporat-genealogis ini; ungkapan tersebut mempertahankan kaitan dengan Israel sebagai leluhur tanpa menyiratkan bahwa yang dimaksud hanya anak-anak kecil.
- source_word: בְּפָרֶךְ
  choice: dengan kejam
  rationale: פָרֶךְ menggambarkan kekerasan yang berat dan menindas dalam kerja paksa. “Dengan kejam” jelas dan wajar dalam bahasa Indonesia, serta mempertahankan keterangan cara yang ditandai oleh בְּ.
theological_decisions:
- issue: Penerjemahan sebutan korporat בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: orang Israel
  rationale: Pilihan ini mempertahankan gema genealogis dan identitas umat secara korporat dalam frasa Ibrani. Catatan kaki menyediakan padanan etnis yang lebih langsung tanpa meniadakan bentuk sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Bani Israel” dipilih karena tetap lazim serta menjaga bentuk korporat-genealogis sumber; “memaksa ... bekerja” menyampaikan konstruksi kausatif dan konteks kerja paksa secara alami.
