  to: Lalu ia berkata, “Apabila kalian menolong para perempuan Ibrani melahirkan dan melihat bayi itu di bangku bersalin[a], jika bayi itu laki-laki, kalian harus membunuhnya; tetapi jika bayi itu perempuan, biarkanlah ia hidup.”
