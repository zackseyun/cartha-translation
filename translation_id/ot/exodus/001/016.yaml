base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/016.yaml
  text: And he said[a], “When you help the Hebrew women give birth and see them on the birthstool, if it is a son, then you shall put him to death; but if it is a daughter, then she shall live.”
translation:
  language: id
  text: Lalu ia berkata, “Apabila kalian menolong para perempuan Ibrani melahirkan dan melihat bayi itu di bangku bersalin[a], jika bayi itu laki-laki, kalian harus membunuhnya; tetapi jika bayi itu perempuan, biarkanlah ia hidup.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di atas dua batu,” kemungkinan menunjuk pada bangku atau tempat duduk untuk bersalin.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַלֶּדְכֶן
  choice: Ketika kalian menolong ... melahirkan
  rationale: Bentuk Piel dari ילד dalam konteks ini menunjuk pada tindakan para bidan membantu persalinan. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan makna obstetrisnya.
- source_word: הָעִבְרִיּוֹת
  choice: perempuan-perempuan Ibrani
  rationale: Bentuk feminin jamak ini berarti perempuan-perempuan Ibrani; konteks persalinan sudah dinyatakan oleh verba.
- source_word: וּרְאִיתֶן
  choice: dan melihat mereka
  rationale: Menerjemahkan instruksi berurutan secara langsung. Objek 'mereka' merujuk secara wajar kepada para perempuan Ibrani, sementara jenis kelamin bayi dinyatakan dalam klausa berikutnya.
- source_word: עַל הָאָבְנָיִם
  choice: di atas bangku bersalin
  rationale: Secara harfiah berkaitan dengan 'dua batu', tetapi dalam konteks persalinan kemungkinan menunjuk pada tempat atau bangku bersalin. Makna kontekstual ditempatkan dalam teks dan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: אִם בֵּן הוּא
  choice: jika bayinya laki-laki
  rationale: בן mengidentifikasi bayi yang baru lahir sebagai laki-laki. Ungkapan 'bayinya laki-laki' lebih alami dalam bahasa Indonesia daripada konstruksi harfiah 'jika ia seorang anak laki-laki'.
- source_word: וַהֲמִתֶּן אֹתוֹ
  choice: kalian harus membunuhnya
  rationale: Bentuk Hifil dari מות berarti menyebabkan mati atau membunuh. 'Harus membunuhnya' menyampaikan daya imperatif jamak feminin secara jelas dan langsung.
- source_word: וְאִם בַּת הִיא
  choice: tetapi jika bayinya perempuan
  rationale: בת merupakan pasangan perempuan dari בן. Konjungsi 'tetapi' menyampaikan pertentangan antara perlakuan terhadap bayi laki-laki dan perempuan.
- source_word: וָחָיָה
  choice: biarkanlah ia hidup
  rationale: Dalam konteks perintah ini, verba menyatakan bahwa bayi perempuan harus dibiarkan tetap hidup. Bentuk imperatif permisif ini alami dan tidak menyiratkan sekadar ramalan bahwa ia akan hidup.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'kalian' dipakai karena perintah ditujukan kepada lebih dari satu bidan; bentuk feminin dalam bahasa Ibrani tidak dapat ditandai secara gramatikal dalam bahasa Indonesia. Kekejaman perintah dipertahankan tanpa diperhalus.
