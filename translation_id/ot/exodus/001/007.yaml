  text: וּ/בְנֵ֣י יִשְׂרָאֵ֗ל פָּר֧וּ וַֽ/יִּשְׁרְצ֛וּ וַ/יִּרְבּ֥וּ וַ/יַּֽעַצְמ֖וּ בִּ/מְאֹ֣ד מְאֹ֑ד וַ/תִּמָּלֵ֥א הָ/אָ֖רֶץ אֹתָֽ/ם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/007.yaml
  text: But the sons of Israel were fruitful and swarmed and multiplied and became exceedingly strong[b][a], so that the land was filled with them.
translation:
  language: id
  text: Namun[a], keturunan Israel beranak cucu, berkembang biak dengan limpah[b], bertambah banyak, dan menjadi sangat kuat, sehingga negeri itu dipenuhi oleh mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan keturunan Israel”; kata penghubung Ibrani dapat diterjemahkan sederhana sebagai “dan”, sedangkan “namun” menonjolkan kontras dengan ayat sebelumnya.
    reason: alternative_reading
  - marker: b
    text: Ungkapan Ibrani yang diterjemahkan “berkembang biak dengan limpah” memakai kata yang menggambarkan kawanan makhluk hidup yang berkerumun atau memenuhi suatu tempat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Namun, keturunan Israel
  rationale: Kata penghubung וּ dapat berarti “dan”, tetapi konteksnya mempertentangkan kematian generasi Yusuf dengan pertumbuhan keturunannya. בְּנֵי יִשְׂרָאֵל secara harfiah “anak-anak lelaki Israel”, tetapi dalam konteks kebangsaan mencakup seluruh keturunan Israel; “keturunan Israel” alami dan tepat dalam bahasa Indonesia.
- source_word: פָּרוּ
  choice: beranak cucu
  rationale: Kata kerja פרה menyatakan kesuburan dan menghasilkan keturunan. “Beranak cucu” mempertahankan gema bahasa berkat dalam Kejadian sekaligus terdengar alami.
- source_word: וַיִּשְׁרְצוּ
  choice: berkembang biak dengan limpah
  rationale: Kata שׁרץ menggambarkan makhluk yang berkerumun atau berbiak dengan sangat melimpah. Pilihan ini mempertahankan gambaran kelimpahan tanpa nuansa negatif yang dapat timbul dari terjemahan harfiah “berkerumun” bagi manusia.
- source_word: וַיִּרְבּוּ
  choice: bertambah banyak
  rationale: רבה berarti menjadi banyak atau bertambah jumlahnya. Ungkapan ini jelas dan alami dalam bahasa Indonesia.
- source_word: וַיַּעַצְמוּ בִּמְאֹד מְאֹד
  choice: menjadi sangat kuat
  rationale: עצם pada bentuk ini terutama menyatakan menjadi kuat atau perkasa, sedangkan pengulangan מְאֹד memberi penekanan besar. “Sangat kuat” menjaga makna inti tanpa membatasinya hanya pada jumlah.
- source_word: וַתִּמָּלֵא הָאָרֶץ אֹתָם
  choice: sehingga negeri itu dipenuhi oleh mereka
  rationale: Bentuk pasif מלא menempatkan negeri sebagai subjek yang dipenuhi. “Sehingga” secara alami menyatakan hasil dari pertumbuhan sebelumnya; הָאָרֶץ di sini menunjuk pada negeri tempat mereka tinggal, bukan seluruh bumi.
theological_decisions:
- issue: Gema bahasa penciptaan dan berkat dalam istilah kesuburan
  choice: Mempertahankan rangkaian “beranak cucu ... bertambah banyak” tanpa menjelaskan alusinya di dalam teks utama
  alternative: Menambahkan bahasa tafsiran yang secara eksplisit menghubungkannya dengan berkat dalam Kejadian
  rationale: Pilihan leksikal Ibrani kemungkinan sengaja menggemakan bahasa berkat sebelumnya, tetapi terjemahan sebaiknya membiarkan gema itu muncul dari kata-kata teks tanpa menambahkan klaim yang tidak tersurat.
- issue: Makna וַיַּעַצְמוּ dalam konteks pertumbuhan penduduk
  choice: menjadi sangat kuat
  alternative: menjadi sangat besar jumlahnya
  rationale: Konteks memungkinkan kekuatan yang timbul dari jumlah besar, tetapi arti dasar עצם adalah menjadi kuat atau perkasa. Terjemahan tidak menyempitkan ketegangan makna itu menjadi jumlah semata.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Keturunan Israel” dipilih daripada ungkapan harfiah “anak-anak lelaki Israel” agar cakupan nasional-keluarganya jelas. Urutan kata kerja dipertahankan untuk menampilkan penumpukan retoris dalam bahasa Ibrani.
