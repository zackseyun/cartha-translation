  text: Jumlah seluruh keturunan langsung Yakub adalah tujuh puluh orang[a], dan Yusuf sudah berada di Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “yang keluar dari paha Yakub.” Ini adalah ungkapan untuk keturunan langsungnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כָּל נֶפֶשׁ ... שִׁבְעִים נָפֶשׁ
  choice: Jumlah semua orang ... adalah tujuh puluh orang
  rationale: Konstruksi ini menyatakan jumlah keseluruhan. 'Orang' menerjemahkan נֶפֶשׁ sebagai istilah penghitung manusia, tanpa memasukkan pengertian teknis 'jiwa' yang tidak dituntut konteks.
- source_word: יֹצְאֵי יֶרֶךְ יַעֲקֹב
  choice: yang berasal dari tubuh Yakub
  rationale: Ungkapan Ibrani secara harfiah berarti 'yang keluar dari paha Yakub' dan menunjuk kepada keturunan biologis langsungnya. 'Berasal dari tubuh Yakub' mempertahankan gambaran jasmaniah secara wajar dalam bahasa Indonesia modern.
- source_word: שִׁבְעִים
  choice: tujuh puluh
  rationale: Padanan langsung bagi bilangan pokok Ibrani.
- source_word: וְיוֹסֵף הָיָה בְמִצְרָיִם
  choice: Yusuf sudah berada di Mesir
  rationale: '''Sudah'' menyampaikan bahwa Yusuf berada di Mesir lebih dahulu, sedangkan ''berada'' merupakan padanan alami bagi keadaan yang dinyatakan oleh הָיָה בְמִצְרָיִם.'
