  - severity: low
    issue: “Kuat dan tangkas” menambahkan dua sifat untuk satu adjektiva Ibrani yang maknanya diperdebatkan.
    rationale: חָיוֹת dapat menunjuk pada perempuan yang kuat/bertenaga dan, secara implikatif, cepat dalam persalinan. “Kuat” dalam teks utama lebih hemat dan menjaga keluwesan makna; kemungkinan nuansa cepat dapat dijelaskan dalam catatan kaki.
