base_translation:
  language: en
  yaml_path: translation/ot/exodus/001/019.yaml
  text: The midwives said to Pharaoh[a], “Because the Hebrew women are not like the Egyptian women, for they are vigorous; before the midwife comes to them, they have given birth.”
translation:
  language: id
  text: Para bidan itu berkata kepada Firaun, “Sebab perempuan Ibrani tidak seperti perempuan Mesir; mereka kuat[a]. Sebelum bidan datang kepada mereka, mereka sudah melahirkan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bertenaga,” “gesit,” atau “tangguh.” Kata Ibrani ini dapat menekankan kekuatan dan cepatnya proses persalinan. Sebagian penafsir memahaminya lebih harfiah sebagai “seperti binatang,” tetapi makna itu kurang pasti dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְןָ
  choice: berkata
  rationale: Bentuk naratif dari אמר memperkenalkan ucapan langsung; “berkata” merupakan padanan Indonesia yang alami.
- source_word: הַמְיַלְּדֹת
  choice: para bidan itu
  rationale: Nomina partisipial dari ילד menunjuk kepada perempuan-perempuan yang bertugas membantu persalinan; bentuk jamak dan kejelasan rujukannya dipertahankan.
- source_word: אֶל־פַּרְעֹה
  choice: kepada Firaun
  rationale: אֶל menandai pihak yang dituju dalam ujaran; “Firaun” ialah bentuk baku dalam bahasa Indonesia.
- source_word: כִּי לֹא כַנָּשִׁים הַמִּצְרִיֹּת הָעִבְרִיֹּת
  choice: Perempuan-perempuan Ibrani tidak seperti perempuan-perempuan Mesir
  rationale: כִּי pertama memperkenalkan jawaban penjelas. Dalam bahasa Indonesia, alasan dapat dinyatakan secara alami tanpa harus mengawali kutipan dengan “karena”; perbandingan dan kontrasnya tetap utuh.
- source_word: כִּי חָיוֹת הֵנָּה
  choice: Mereka kuat dan tangkas
  rationale: חָיוֹת dalam konteks ini kemungkinan menggambarkan kondisi yang bertenaga, sigap, atau cepat dalam persalinan. Ungkapan “kuat dan tangkas” menyampaikan daya serta kecepatannya tanpa kesan merendahkan.
- source_word: בְּטֶרֶם תָּבוֹא אֲלֵהֶן הַמְיַלֶּדֶת
  choice: sebelum bidan datang kepada mereka
  rationale: בְּטֶרֶם menandai waktu sebelum suatu tindakan; bentuk tunggal “bidan” dipahami secara generik.
- source_word: וְיָלָדוּ
  choice: mereka sudah melahirkan
  rationale: Bentuk perfektif menggambarkan persalinan yang telah selesai sebelum bidan tiba; “sudah” menyatakan urutan waktu itu dengan wajar.
