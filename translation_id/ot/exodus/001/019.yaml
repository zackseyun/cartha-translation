  naturalness: Bahasanya baku dan mudah dipahami. Penggunaan “perempuan-perempuan” berulang terasa lebih berat daripada perlu; “perempuan Ibrani” dan “perempuan Mesir” lebih alami dalam bahasa Indonesia modern.
  terminology: “Bidan,” “Firaun,” “Ibrani,” dan “melahirkan” tepat. Untuk חָיוֹת, “kuat” cukup sebagai teks utama; tambahan “tangkas” berpotensi mempersempit atau menambahkan nuansa yang tidak dinyatakan secara eksplisit oleh adjektiva Ibrani.
  issues:
