  yaml_path: translation/ot/exodus/001/021.yaml
  text: And because the midwives feared God[a], he made households for them.
translation:
  language: id
  text: Karena para bidan itu takut akan Allah, Ia menjadikan bagi mereka rumah tangga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Ia membuat rumah-rumah bagi mereka.” Kata Ibrani untuk “rumah-rumah” juga dapat berarti rumah tangga, keluarga, atau garis keturunan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Karena
  rationale: Ungkapan ini menghubungkan rasa takut para bidan kepada Allah dengan tindakan Allah sebagai akibatnya. Dalam bahasa Indonesia, “Karena” menyampaikan hubungan sebab-akibat itu secara alami tanpa mempertahankan idiom Ibrani secara kaku.
- source_word: יָרְאוּ
  choice: takut akan
  rationale: Kata ירא dapat menyatakan ketakutan sekaligus rasa hormat yang mendalam kepada Allah. Ungkapan baku “takut akan Allah” mempertahankan bobot dan keluasan makna idiom alkitabiah tersebut.
- source_word: הַמְיַלְּדֹת
  choice: para bidan itu
  rationale: Bentuk berartikel menunjuk kepada para bidan yang sudah disebutkan dalam konteks sebelumnya. “Para ... itu” menandai rujukan tertentu dengan wajar dalam bahasa Indonesia.
- source_word: הָאֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini, bentuk tersebut merujuk kepada Allah, bukan kepada ilah-ilah secara umum.
- source_word: וַיַּעַשׂ
  choice: Ia membangun
  rationale: Kata עשׂה secara dasar berarti “membuat” atau “menjadikan”, tetapi bersama בָּתִּים dapat mengacu pada pembentukan atau peneguhan keluarga. “Membangun” mempertahankan citra rumah sekaligus menyampaikan makna idiomatis.
- source_word: לָהֶם
  choice: bagi mereka
  rationale: Akhiran pronomina berbentuk jamak maskulin, tetapi dalam konteks ini jelas merujuk kembali kepada para bidan. Bahasa Ibrani dapat memakai bentuk jamak maskulin untuk kelompok yang acuannya perempuan.
- source_word: בָּתִּים
  choice: keluarga
  rationale: Secara harfiah berarti “rumah-rumah”, tetapi kata “rumah” dalam bahasa Ibrani juga dapat berarti rumah tangga, keluarga, atau garis keturunan. “Keluarga” menyampaikan makna yang paling mungkin dalam konteks berkat Allah kepada para bidan, sementara arti harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna tindakan Allah yang secara harfiah berbunyi “membuat rumah-rumah bagi mereka”
  choice: Allah membangun keluarga bagi para bidan.
  alternative: Allah membuat atau menyediakan rumah-rumah fisik bagi mereka.
  rationale: Ungkapan עשׂה ... בתים dapat berarti membentuk rumah tangga, keluarga, atau garis keturunan. Konteksnya paling wajar dipahami sebagai berkat Allah berupa keluarga, tetapi kemungkinan arti rumah fisik tidak dihapus dan dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan “takut akan Allah” dipertahankan sebagai idiom teologis yang lazim. Pronomina “Ia” memakai huruf kapital karena merujuk kepada Allah. Frasa “membangun keluarga” dipilih agar citra dasar bahasa Ibrani tetap terasa tanpa memberi kesan utama bahwa yang dibangun hanyalah bangunan fisik.
