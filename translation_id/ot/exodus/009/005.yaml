  text: And Yahweh set a time[a], saying, “Tomorrow Yahweh will do this thing in the land.”
translation:
  language: id
  text: Yahweh menetapkan waktu[a], dengan berkata, “Besok Yahweh akan melakukan hal ini di negeri itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “waktu yang ditentukan” atau “saat yang telah ditetapkan.”
    reason: Alternatif leksikal untuk מוֹעֵד, yang dapat menyatakan waktu atau saat yang ditentukan.
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: menetapkan
  rationale: Bentuk dari שׂוּם di sini berarti menentukan atau menetapkan sesuatu; “menetapkan” wajar dalam kolokasi dengan waktu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: מוֹעֵד
  choice: suatu waktu
  rationale: מוֹעֵד menunjuk pada waktu atau saat yang telah ditentukan. “Suatu waktu” mempertahankan ungkapan Ibrani, sementara hari yang dimaksud dijelaskan oleh “besok.”
- source_word: לֵאמֹר
  choice: dengan berfirman
  rationale: Infinitif ini memperkenalkan ujaran langsung. Karena subjeknya Yahweh, “berfirman” merupakan padanan Indonesia yang alami dan bermartabat.
- source_word: מָחָר
  choice: Besok
  rationale: Padanan langsung dan alami bagi keterangan waktu מָחָר.
- source_word: יַעֲשֶׂה
  choice: akan melakukan
  rationale: Mempertahankan keluasan makna עשה tanpa memperinci tindakan yang hanya dipahami dari konteks.
- source_word: הַדָּבָר הַזֶּה
  choice: hal ini
  rationale: דָּבָר dapat berarti hal, perkara, atau kejadian. “Hal ini” alami dalam bahasa Indonesia dan tidak menafsirkan tindakan itu secara berlebihan.
- source_word: בָּאָרֶץ
  choice: di negeri ini
  rationale: Konteks menunjuk kepada negeri Mesir. “Negeri ini” membuat rujukan deiktisnya alami tanpa menambahkan nama Mesir yang tidak disebut dalam ayat.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama ilahi dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan pengulangan nama Yahweh dan ketidakspesifikan ungkapan “hal ini.”
