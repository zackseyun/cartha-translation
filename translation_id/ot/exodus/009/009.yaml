  text: וְ/הָיָ֣ה לְ/אָבָ֔ק עַ֖ל כָּל אֶ֣רֶץ מִצְרָ֑יִם וְ/הָיָ֨ה עַל הָ/אָדָ֜ם וְ/עַל הַ/בְּהֵמָ֗ה לִ/שְׁחִ֥ין פֹּרֵ֛חַ אֲבַעְבֻּעֹ֖ת בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/009.yaml
  text: And it will become fine dust over all the land of Egypt[b][a], and it will become boils breaking out with blisters on man and on beast throughout all the land of Egypt.
translation:
  language: id
  text: Debu itu akan menjadi serbuk halus di seluruh tanah Mesir, lalu pada manusia dan hewan akan timbul bisul yang melepuh di seluruh tanah Mesir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה לְאָבָק
  choice: Debu itu akan menjadi serbuk halus
  rationale: היה dengan ל menyatakan hasil atau perubahan keadaan, sedangkan אָבָק menunjuk pada debu atau serbuk halus. Subjek tersirat dipahami dari konteks ayat sebelumnya.
- source_word: עַל כָּל אֶרֶץ מִצְרָיִם
  choice: di seluruh tanah Mesir
  rationale: עַל di sini menggambarkan penyebaran serbuk di atas atau meliputi seluruh wilayah; ungkapan Indonesia ini alami dan jelas.
- source_word: עַל הָאָדָם
  choice: pada manusia
  rationale: אָדָם digunakan secara kolektif untuk umat manusia dan dikontraskan dengan hewan; 'manusia' mempertahankan cakupan generiknya dalam bahasa Indonesia modern.
- source_word: וְעַל הַבְּהֵמָה
  choice: dan hewan
  rationale: בְּהֵמָה bersifat kolektif. 'Hewan' menjaga cakupan umum tanpa mempersempitnya menjadi ternak saja.
- source_word: לִשְׁחִין
  choice: bisul
  rationale: שְׁחִין menunjuk pada penyakit kulit yang meletus atau bisul; bentuk Indonesia dapat dipahami secara kolektif dalam konstruksi ini.
- source_word: פֹּרֵחַ
  choice: akan timbul
  rationale: Partisip ini secara harfiah menggambarkan sesuatu yang tumbuh atau merekah, dan secara idiomatis menunjukkan erupsi penyakit kulit.
- source_word: אֲבַעְבֻּעֹת
  choice: yang melepuh
  rationale: Kata ini menunjuk pada lepuhan atau pembengkakan kulit. Bentuk verbal-adjektival menghasilkan frasa Indonesia yang alami tanpa menghilangkan unsur lepuhan.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: di seluruh tanah Mesir
  rationale: Pengulangan frasa wilayah mempertahankan penekanan teks Ibrani pada luasnya tulah di seluruh Mesir.
theological_decisions:
- issue: Makna generik אָדָם dalam pasangan manusia-hewan
  choice: manusia
  alternative: orang-orang
  rationale: '''Manusia'' secara tepat menyatakan umat manusia secara kolektif dan mempertahankan kontras sumber antara manusia dan hewan tanpa nuansa gender yang tidak dimaksudkan.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dibuat alami sambil mempertahankan perubahan keadaan, unsur bisul yang timbul, unsur lepuhan, pasangan manusia-hewan, dan pengulangan cakupan seluruh tanah Mesir.
