source:
  edition: WLC
  text: עוֹדְ/ךָ֖ מִסְתּוֹלֵ֣ל בְּ/עַמִּ֑/י לְ/בִלְתִּ֖י שַׁלְּחָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/017.yaml
  text: Are you still exalting yourself against my people by not letting them go?[a]
translation:
  language: id
  text: Masihkah engkau meninggikan dirimu terhadap umat-Ku dengan tidak membiarkan mereka pergi?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bertindak angkuh atas umat-Ku” atau “mengangkat dirimu melawan umat-Ku.”
    reason: Alternatif leksikal bagi מִסְתּוֹלֵל בְּעַמִּי, yang dapat menekankan keangkuhan, kedudukan di atas, atau sikap melawan.
lexical_decisions:
- source_word: עוֹדְךָ
  choice: Masihkah engkau
  rationale: עוֹד dengan unsur pronominal orang kedua maskulin tunggal menyatakan keadaan yang masih berlangsung dan merupakan sapaan langsung kepada Firaun. Bentuk tanya retoris sesuai dengan konteks dan alami dalam bahasa Indonesia.
- source_word: מִסְתּוֹלֵל
  choice: meninggikan dirimu
  rationale: Partisipel Hitpolel dari סלל di sini menyampaikan tindakan meninggikan diri atau penegasan diri yang angkuh. Pilihan ini mempertahankan daya refleksif serta nuansa kesombongannya.
- source_word: בְּעַמִּי
  choice: terhadap umat-Ku
  rationale: Preposisi ב dalam konstruksi ini menunjukkan sikap bermusuhan atau menempatkan diri di atas pihak lain. 'Terhadap umat-Ku' menyampaikan arah tindakan itu secara alami tanpa meniadakan kemungkinan nuansa 'atas' atau 'melawan'.
- source_word: לְבִלְתִּי
  choice: dengan tidak
  rationale: לְבִלְתִּי memperkenalkan klausa infinitif negatif yang menjelaskan bagaimana Firaun meninggikan diri, yakni dengan terus menolak pembebasan umat itu.
- source_word: שַׁלְּחָם
  choice: membiarkan mereka pergi
  rationale: Bentuk Piel שלח dalam kisah tulah-tulah merujuk pada pelepasan Israel dari perbudakan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan idiom kontekstual tersebut.
theological_decisions:
- issue: Bahasa kepemilikan ilahi dalam עַמִּי ('umat-Ku')
  choice: Mempertahankan 'umat-Ku' sebagai klaim langsung TUHAN atas Israel
  alternative: Menggunakan 'umat itu' atau 'Israel'
  rationale: 'Akhiran orang pertama tunggal memiliki bobot penting dalam konteks Keluaran: TUHAN menyatakan Israel sebagai umat milik-Nya, sehingga tindakan Firaun terhadap mereka juga merupakan penentangan terhadap TUHAN.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung dan bermartabat. 'Engkau' dipakai karena TUHAN menyapa Firaun secara langsung; kapitalisasi pada 'umat-Ku' menandai pronomina yang merujuk kepada Allah sesuai kebiasaan penerbitan Alkitab Indonesia.
