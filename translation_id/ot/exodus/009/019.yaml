  text: וְ/עַתָּ֗ה שְׁלַ֤ח הָעֵז֙ אֶֽת מִקְנְ/ךָ֔ וְ/אֵ֛ת כָּל אֲשֶׁ֥ר לְ/ךָ֖ בַּ/שָּׂדֶ֑ה כָּל הָ/אָדָ֨ם וְ/הַ/בְּהֵמָ֜ה אֲשֶֽׁר יִמָּצֵ֣א בַ/שָּׂדֶ֗ה וְ/לֹ֤א יֵֽאָסֵף֙ הַ/בַּ֔יְתָ/ה וְ/יָרַ֧ד עֲלֵ/הֶ֛ם הַ/בָּרָ֖ד וָ/מֵֽתוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/019.yaml
  text: So now[a], send word and bring your livestock and everything you have in the field to safety. Every man and beast that is found in the field and is not gathered into the house—the hail will come down on them[b], and they will die.
translation:
  language: id
  text: Sekarang, kirimlah orang untuk membawa ternakmu dan segala milikmu yang ada di padang ke tempat aman.[a] Setiap manusia dan hewan yang berada di padang dan tidak dibawa masuk ke dalam rumah—hujan es akan turun menimpa mereka, dan mereka akan mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Ibrani ini terdiri dari dua perintah, yang secara harfiah dapat diterjemahkan, “kirimlah; bawalah ke tempat aman.” Dalam konteksnya, pengutusan itu dilakukan untuk mengamankan semua yang masih berada di padang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Menandai peralihan langsung kepada tindakan yang harus dilakukan; dalam bahasa Indonesia, hubungan dengan pernyataan sebelumnya tidak perlu selalu dinyatakan dengan kata sambung tersendiri.
- source_word: שְׁלַח הָעֵז
  choice: suruhlah orang membawa ... ke tempat aman
  rationale: שְׁלַח menyiratkan pengutusan orang untuk bertindak, sedangkan הָעֵז memerintahkan agar milik yang ada di luar diamankan. Ungkapan ini menyampaikan kedua unsur tersebut secara wajar dalam bahasa Indonesia.
- source_word: מִקְנְךָ
  choice: ternakmu
  rationale: מִקְנֶה menunjuk pada hewan peliharaan sebagai milik; 'ternak' merupakan padanan modern yang jelas.
- source_word: כָּל אֲשֶׁר לְךָ בַּשָּׂדֶה
  choice: segala milikmu yang ada di padang
  rationale: Mencakup seluruh kepunyaan yang masih berada di luar; 'padang' mempertahankan gambaran tempat terbuka.
- source_word: כָּל הָאָדָם וְהַבְּהֵמָה
  choice: Setiap manusia dan hewan
  rationale: אָדָם di sini bersifat generik dan distributif, bukan menunjuk khusus pada laki-laki. 'Manusia dan hewan' mempertahankan pasangan kategori dalam teks sumber tanpa mempersempit cakupannya.
- source_word: אֲשֶׁר יִמָּצֵא בַשָּׂדֶה
  choice: yang didapati di padang
  rationale: Mempertahankan bentuk pasif Niphal dari מצא serta gambaran siapa pun atau apa pun yang didapati di luar.
- source_word: וְלֹא יֵאָסֵף הַבַּיְתָה
  choice: dan tidak dibawa masuk ke dalam rumah
  rationale: Niphal יֵאָסֵף bersifat pasif. 'Dibawa masuk' lebih alami daripada 'dikumpulkan' dalam konteks menyelamatkan manusia dan hewan, sedangkan 'ke dalam rumah' mempertahankan arah pada bentuk הַבַּיְתָה.
- source_word: וְיָרַד עֲלֵהֶם הַבָּרָד
  choice: hujan es akan turun menimpa mereka
  rationale: Mempertahankan hujan es sebagai subjek dan gerak turun dalam ירד; 'menimpa' menyampaikan force preposisi עַל secara alami.
- source_word: וָמֵתוּ
  choice: dan mereka akan mati
  rationale: Menyatakan akibat pasti dalam konteks peringatan yang akan segera digenapi.
theological_decisions:
- issue: Cakupan אָדָם dalam peringatan umum
  choice: Setiap manusia
  alternative: Setiap orang; setiap laki-laki
  rationale: אָדָם di sini merupakan sebutan generik bagi manusia yang dipasangkan dengan hewan. 'Setiap manusia' menjaga cakupan umum dan tidak menambahkan pembatasan jenis kelamin yang tidak dinyatakan oleh konteks.
- issue: Hubungan antara perintah ilahi dan akibat hujan es
  choice: Mempertahankan peringatan bersyarat secara langsung tanpa menjelaskan sebab teologis tambahan
  alternative: Menambahkan bahwa kematian merupakan hukuman ilahi langsung
  rationale: Ayat menyatakan bahwa yang tetap di luar akan ditimpa hujan es dan mati, tetapi tidak menguraikan lebih jauh hubungan kausal atau tanggung jawab manusia dalam kalimat ini.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur peringatan serta jeda tegas sebelum akibat dipertahankan dengan tanda pisah. Istilah 'hujan es' dipakai sebagai padanan baku untuk בָּרָד.
