base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/018.yaml
  text: Behold[a], about this time tomorrow I will rain down very heavy hail[b], such as has never been in Egypt from the day it was founded until now.
translation:
  language: id
  text: Sesungguhnya, kira-kira pada waktu seperti ini besok[a], Aku akan menurunkan hujan es yang sangat hebat, yang belum pernah terjadi di Mesir sejak negeri itu didirikan[b] sampai sekarang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pada waktu seperti ini besok.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “sejak negeri itu dibentuk.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Sesungguhnya
  rationale: Mengantar pengumuman ilahi yang khidmat dan penuh penegasan. Pilihan ini mempertahankan tekanan wacana ungkapan Ibrani tersebut dalam bahasa Indonesia modern tanpa terdengar janggal.
- source_word: מַמְטִיר
  choice: Aku akan menurunkan
  rationale: Bentuk kausatif dengan subjek orang pertama menyatakan bahwa Allah secara langsung menyebabkan hujan es itu turun. Ungkapan ini alami dalam bahasa Indonesia dan tetap memperlihatkan tindakan ilahi.
- source_word: כָּעֵת מָחָר
  choice: kira-kira pada waktu seperti ini besok
  rationale: Frasa ini menunjuk pada waktu yang kurang lebih sama pada hari berikutnya; kata 'kira-kira' mencerminkan kemungkinan nuansa pendekatan pada prefiks כְּ.
- source_word: בָּרָד
  choice: hujan es
  rationale: Padanan baku dan mudah dipahami untuk fenomena meteorologis yang dimaksud.
- source_word: כָּבֵד מְאֹד
  choice: sangat lebat
  rationale: כָּבֵד menyatakan sesuatu yang berat atau hebat dan diperkuat oleh מְאֹד. Dalam konteks hujan es, 'sangat lebat' alami sekaligus menyampaikan kedahsyatan volumenya.
- source_word: אֲשֶׁר לֹא הָיָה כָמֹהוּ
  choice: yang belum pernah terjadi
  rationale: Menyampaikan perbandingan bahwa tidak pernah ada hujan es serupa sebelumnya tanpa menambahkan penafsiran di luar teks.
- source_word: בְּמִצְרַיִם
  choice: di Mesir
  rationale: Padanan lokatif langsung.
- source_word: לְמִן הַיּוֹם הִוָּסְדָה
  choice: sejak negeri itu didirikan
  rationale: Bentuk pasif Niphal menunjukkan bahwa Mesir didirikan atau ditegakkan. Penyebutan 'negeri itu' membuat acuan pronominal jelas dan alami dalam bahasa Indonesia.
- source_word: וְעַד עָתָּה
  choice: sampai sekarang
  rationale: Ungkapan waktu baku yang mempertahankan rentang sejak pendirian Mesir hingga saat pengumuman.
theological_decisions:
- issue: Pelaku ilahi dalam pengumuman tulah
  choice: Allah berkata secara langsung, 'Aku akan menurunkan,' sehingga tindakan-Nya sebagai penyebab hujan es dinyatakan dengan jelas.
  alternative: Rumusan tidak langsung seperti 'hujan es akan turun.'
  rationale: Bentuk kausatif orang pertama dalam bahasa Ibrani secara eksplisit menghubungkan datangnya hujan es dengan tindakan Allah; terjemahan tidak boleh mengubahnya menjadi kejadian impersonal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mempertahankan nada pengumuman ilahi, tindakan langsung Allah, penentuan waktu, dan perbandingan dengan seluruh sejarah Mesir.
