source:
  edition: WLC
  text: הִנֵּ֨ה יַד יְהוָ֜ה הוֹיָ֗ה בְּ/מִקְנְ/ךָ֙ אֲשֶׁ֣ר בַּ/שָּׂדֶ֔ה בַּ/סּוּסִ֤ים בַּֽ/חֲמֹרִים֙ בַּ/גְּמַלִּ֔ים בַּ/בָּקָ֖ר וּ/בַ/צֹּ֑אן דֶּ֖בֶר כָּבֵ֥ד מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/003.yaml
  text: Look[a], the hand of Yahweh will come upon your livestock that are in the field—upon the horses, the donkeys, the camels, the herds, and the flocks—with a very severe plague.
translation:
  language: id
  text: Lihat, tangan Yahweh akan menimpa ternakmu yang ada di padang—kuda, keledai, unta, kawanan sapi, dan kawanan kambing domba—dengan wabah[a] yang sangat parah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sampar”; istilah Ibrani ini menunjuk pada epidemi mematikan yang menyerang ternak.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihat
  rationale: Mempertahankan daya penunjuk dan urgensi seruan Ibrani dalam bahasa Indonesia modern.
- source_word: יַד יְהוָה
  choice: tangan Yahweh
  rationale: Mempertahankan ungkapan Ibrani tentang kuasa dan penghukuman ilahi, tanpa meratakannya menjadi sekadar tindakan.
- source_word: הוֹיָה
  choice: akan menimpa
  rationale: Dalam konteks pengumuman tulah, bentuk ini menyatakan kejadian yang segera datang; pilihan ini alami sekaligus mempertahankan arah tindakan terhadap ternak.
- source_word: מִקְנְךָ
  choice: ternakmu
  rationale: Istilah ini mencakup hewan peliharaan secara luas, sesuai dengan daftar jenis ternak yang mengikutinya.
- source_word: אֲשֶׁר בַּשָּׂדֶה
  choice: yang ada di padang
  rationale: Menunjukkan kelompok ternak tertentu yang berada di luar, dengan padanan yang dekat dan alami.
- source_word: בַּסּוּסִים בַּחֲמֹרִים בַּגְּמַלִּים בַּבָּקָר וּבַצֹּאן
  choice: kuda, keledai, unta, kawanan sapi, dan kawanan kambing domba
  rationale: Mempertahankan seluruh daftar; 'kawanan sapi' dan 'kawanan kambing domba' mencerminkan sifat kolektif בָּקָר dan צֹאן, sementara 'kambing domba' tidak mempersempit צֹאן menjadi domba saja.
- source_word: דֶּבֶר
  choice: wabah
  rationale: Menyatakan epidemi mematikan yang menyerang ternak dalam bahasa Indonesia yang jelas dan masa kini.
- source_word: כָּבֵד מְאֹד
  choice: sangat parah
  rationale: Menyampaikan intensitas ungkapan Ibrani secara idiomatis; terjemahan harfiah 'sangat berat' kurang alami untuk wabah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan rujukan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Ungkapan antropomorfis יַד יְהוָה
  choice: tangan Yahweh
  alternative: kuasa Yahweh; hukuman Yahweh
  rationale: Ungkapan sumber sengaja dipertahankan agar citra ilahi dan cakupan maknanya—kuasa, tindakan, serta penghukuman—tidak dipersempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan seruan pembuka, ungkapan 'tangan Yahweh', batasan ternak di padang, serta daftar kolektif jenis ternak. Penanda catatan kaki ditempatkan setelah frasa yang dijelaskannya.
