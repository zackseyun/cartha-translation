id: EXO.9.6
reference: Exodus 9:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ יְהוָ֜ה אֶת הַ/דָּבָ֤ר הַ/זֶּה֙ מִֽ/מָּחֳרָ֔ת וַ/יָּ֕מָת כֹּ֖ל מִקְנֵ֣ה מִצְרָ֑יִם וּ/מִ/מִּקְנֵ֥ה בְנֵֽי יִשְׂרָאֵ֖ל לֹא מֵ֥ת אֶחָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/006.yaml
  text: And Yahweh did this thing the next day[a], and all the livestock of Egypt died; but from the livestock of the sons of Israel, not one died.
translation:
  language: id
  text: Yahweh melakukan hal itu pada keesokan harinya. Semua ternak orang Mesir mati, tetapi dari ternak orang Israel[a] tidak ada seekor pun yang mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak lelaki Israel”; ungkapan Ibrani ini berarti orang Israel.'
    reason: Menjelaskan bentuk harfiah dan fungsi etnonim בְנֵי יִשְׂרָאֵל.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH dan mempertahankannya sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: וַיַּעַשׂ ... אֶת־הַדָּבָר הַזֶּה
  choice: melakukan hal itu
  rationale: Mengungkapkan idiom Ibrani secara wajar dalam bahasa Indonesia tanpa menambah gagasan sebab-akibat yang tidak dinyatakan.
- source_word: מִמָּחֳרָת
  choice: pada keesokan harinya
  rationale: Menunjukkan hari yang langsung menyusul, dengan ungkapan waktu yang alami dan bermartabat.
- source_word: כֹּל מִקְנֵה מִצְרַיִם
  choice: semua ternak orang Mesir
  rationale: מִקְנֶה mencakup hewan ternak secara luas, bukan hanya sapi; konstruksi kepemilikan diungkapkan secara alami.
- source_word: וּמִמִּקְנֵה בְנֵי יִשְׂרָאֵל
  choice: tetapi dari ternak orang Israel
  rationale: Kata depan מִן dipertahankan dengan 'dari', sedangkan בְנֵי יִשְׂרָאֵל diterjemahkan menurut fungsi etnonimnya sebagai seluruh bangsa Israel.
- source_word: לֹא מֵת אֶחָד
  choice: tidak ada seekor pun yang mati
  rationale: Kata bantu bilangan 'seekor' memperjelas bahwa אֶחָד mengacu kepada hewan ternak dan mempertahankan penegasan bahwa tidak satu pun mati.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama ilahi secara langsung; transliterasi mempertahankan identitasnya sebagai nama perjanjian tanpa menggantinya dengan gelar.
- issue: Cakupan ungkapan בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak lelaki Israel; keturunan Israel
  rationale: Dalam konteks ini ungkapan tersebut berfungsi sebagai etnonim kolektif dan tidak membatasi rujukannya hanya kepada laki-laki. Catatan kaki mempertahankan bentuk harfiahnya.
- issue: Cakupan kata כֹּל dalam 'semua ternak orang Mesir'
  choice: semua ternak orang Mesir
  alternative: seluruh ternak Mesir
  rationale: Kata כֹּל diterjemahkan tanpa melunakkan pernyataan menyeluruh dalam ayat ini; ketegangan dengan penyebutan ternak Mesir dalam bagian selanjutnya tidak diselesaikan dengan menambahkan pembatas yang tidak ada dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang lugas dan khidmat. 'Ternak' dipilih karena lebih luas daripada 'sapi', dan 'seekor pun' memberi penegasan alami bagi pembaca Indonesia.
