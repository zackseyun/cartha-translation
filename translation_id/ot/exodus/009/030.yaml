base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/030.yaml
  text: But as for you and your servants[b][a], I know that you do not yet fear Yahweh God.
translation:
  language: id
  text: Tetapi, mengenai engkau dan para pegawaimu, aku tahu bahwa kalian belum takut kepada Yahweh Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kalian masih tidak takut kepada Yahweh Allah” atau, secara harfiah, “sebelum kalian takut kepada Yahweh Allah.” Kata Ibrani yang dipakai dapat menyatakan arti “belum” dalam konteks ini atau urutan waktu, “sebelum.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Tetapi tentang engkau
  rationale: Konjungsi dan pronomina mandiri menandai peralihan yang kontras kepada Firaun; ungkapan ini mempertahankan daya adversatif dan topikalnya secara wajar dalam bahasa Indonesia.
- source_word: וַעֲבָדֶיךָ
  choice: dan para pegawaimu
  rationale: Dalam konteks istana Firaun, עֲבָדִים menunjuk para abdi atau pejabatnya. 'Para pegawai' dapat dipahami pembaca modern tanpa mengharuskan arti budak.
- source_word: יָדַעְתִּי
  choice: aku tahu
  rationale: Bentuk perfek menyatakan pengetahuan atau penilaian Musa yang berlaku saat itu.
- source_word: כִּי
  choice: bahwa
  rationale: Kata ini memperkenalkan isi dari apa yang diketahui Musa.
- source_word: טֶרֶם
  choice: belum
  rationale: Dengan bentuk verba berikutnya, kata ini paling alami menyatakan bahwa rasa takut yang semestinya belum ada, sambil mencatat kemungkinan nuansa temporal lain dalam catatan kaki.
- source_word: תִּירְאוּן
  choice: kalian ... takut
  rationale: Bentuk jamak mencakup Firaun dan para pegawainya. 'Takut' mempertahankan rentang makna ירא antara gentar dan hormat tanpa mempersempitnya.
- source_word: מִפְּנֵי
  choice: kepada
  rationale: Dalam idiom takut akan Allah, 'takut kepada' merupakan ungkapan Indonesia yang alami; unsur harfiah 'di hadapan' tersirat dalam relasi kepada Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Kata ini berdiri bersama nama ilahi dan secara alami diterjemahkan sebagai 'Allah' dalam bahasa Indonesia.
theological_decisions:
- issue: Nuansa takut kepada Allah
  choice: takut
  alternative: gentar kepada; menghormati
  rationale: '''Takut'' menjaga ketegangan makna antara kengerian menghadapi penghukuman dan sikap hormat atau tunduk kepada Allah.'
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama ilahi secara langsung, sehingga transliterasi mempertahankan nama tersebut.
- issue: Hubungan sintaksis יהוה אֱלֹהִים
  choice: Yahweh, Allah
  alternative: Yahweh Allah
  rationale: Koma memperjelas bahwa 'Allah' menerangkan identitas Yahweh tanpa menambahkan kata yang tidak terdapat dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Engkau' mempertahankan sapaan tunggal kepada Firaun, sedangkan 'kalian' menampilkan bentuk jamak Ibrani yang mencakup Firaun dan para pegawainya.
