  text: הַעְתִּ֨ירוּ֙ אֶל יְהוָ֔ה וְ/רַ֕ב מִֽ/הְיֹ֛ת קֹלֹ֥ת אֱלֹהִ֖ים וּ/בָרָ֑ד וַ/אֲשַׁלְּחָ֣ה אֶתְ/כֶ֔ם וְ/לֹ֥א תֹסִפ֖וּ/ן לַ/עֲמֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/028.yaml
  text: Pray to Yahweh[a], for there has been enough of God's thunder and hail. Then I will let you go, and you will stay no longer.
translation:
  language: id
  text: Mohonlah kepada Yahweh, sebab guruh Allah[a] dan hujan es sudah cukup. Aku akan membiarkan kalian pergi, dan kalian tidak akan tinggal lebih lama lagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “suara-suara Allah”. Dalam konteks badai ini, “suara-suara” merujuk pada guruh.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעְתִּירוּ
  choice: Mohonlah
  rationale: Bentuk imperatif jamak Hifil dari עתר menyatakan permohonan yang sungguh-sungguh kepada Allah. “Mohonlah” alami dalam bahasa Indonesia dan lebih kuat daripada sekadar “berdoalah” tanpa menambahkan unsur yang tidak ada dalam teks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: וְרַב מִהְיֹת
  choice: Sudah cukup
  rationale: Ungkapan Ibrani ini menyatakan kecukupan atau keadaan yang sudah berlebihan; dalam konteks ini Firaun memohon agar tulah dihentikan.
- source_word: קֹלֹת אֱלֹהִים
  choice: guruh Allah
  rationale: קֹלֹת secara harfiah berarti “suara-suara”, tetapi bersama hujan es dalam konteks badai menunjuk pada bunyi guruh. Bentuk “guruh Allah” mempertahankan kaitan langsungnya dengan Allah.
- source_word: וּבָרָד
  choice: dan hujan es ini
  rationale: בָּרָד berarti “hujan es”. Kata penunjuk “ini” tersirat secara kontekstual dan membuat permohonan Firaun alami dalam bahasa Indonesia.
- source_word: וַאֲשַׁלְּחָה אֶתְכֶם
  choice: Aku akan membiarkan kalian pergi
  rationale: Dalam konteks Keluaran, שלח dengan bangsa itu sebagai objek berarti mengizinkan atau melepaskan mereka untuk pergi. “Kalian” mencerminkan objek orang kedua jamak.
- source_word: וְלֹא תֹסִפוּן לַעֲמֹד
  choice: dan kalian tidak akan tinggal lebih lama lagi
  rationale: Ungkapan harfiah “tidak menambah untuk tetap berdiri” berarti tidak terus menetap atau tertahan. Terjemahan ini mempertahankan janji Firaun tanpa mempersempitnya secara berlebihan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Transliterasi mempertahankan nama pribadi ilahi yang terdapat dalam teks sumber dan menghindari penggantiannya dengan gelar.
- issue: Makna קֹלֹת אֱלֹהִים
  choice: guruh Allah
  alternative: suara-suara Allah; guruh yang dahsyat
  rationale: Konteks tulah hujan es menunjukkan bahwa “suara-suara” adalah guruh. Bentuk “Allah” dipertahankan sebagai genitif agar hubungan dengan Allah tidak dihapus atau ditafsirkan hanya sebagai penanda intensitas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. “Kalian” dipakai untuk menandai bentuk jamak dalam sapaan Firaun kepada Musa dan Harun. Penanda catatan kaki ditempatkan pada “guruh Allah”, yaitu frasa yang dijelaskan oleh catatan.
