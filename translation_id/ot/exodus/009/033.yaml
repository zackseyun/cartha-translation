base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/033.yaml
  text: So Moses went out from Pharaoh[a], out of the city, and spread out his hands to Yahweh; and the thunder and the hail ceased[b], and rain was no longer poured down on the earth.
translation:
  language: id
  text: Lalu Musa pergi dari hadapan Firaun dan keluar dari kota itu. Ia membentangkan kedua tangannya kepada Yahweh. Guruh[a] dan hujan es pun berhenti, dan hujan tidak lagi tercurah ke bumi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “suara-suara”; dalam konteks badai ini, yang dimaksud ialah guruh.'
    reason: lexical_alternative
  - marker: b
    text: 'Dapat juga diterjemahkan: “hujan tidak tercurah ke tanah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא מֹשֶׁה מֵעִם פַּרְעֹה אֶת הָעִיר
  choice: Lalu Musa meninggalkan Firaun dan keluar dari kota
  rationale: Ungkapan מֵעִם menandai perpisahan dari hadapan Firaun, sedangkan אֶת הָעִיר dalam konteks gerak menyatakan bahwa Musa keluar dari kota. Susunan ini menyampaikan kedua tahap gerak secara alami dalam bahasa Indonesia.
- source_word: וַיִּפְרֹשׂ כַּפָּיו
  choice: Ia menadahkan kedua tangannya
  rationale: Secara harfiah frasa ini menggambarkan Musa membentangkan telapak tangannya. 'Menadahkan kedua tangannya' mempertahankan gambaran gerak doa dan terdengar alami dalam bahasa Indonesia.
- source_word: אֶל יְהוָה
  choice: kepada Yahweh
  rationale: Preposisi אֶל menunjukkan arah tindakan atau doa kepada Allah, dan nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh'.
- source_word: הַקֹּלוֹת
  choice: Guruh
  rationale: Makna dasarnya ialah 'suara-suara', tetapi dalam konteks badai dan tulah hujan es kata ini menunjuk pada bunyi guruh.
- source_word: וַיַּחְדְּלוּ
  choice: pun berhenti
  rationale: Kata kerja חדל menyatakan bahwa gejala-gejala badai itu berhenti. Partikel 'pun' menghubungkan akibat doa Musa dengan kelanjutan narasi secara wajar.
- source_word: וּמָטָר לֹא נִתַּךְ אָרְצָה
  choice: dan hujan tidak lagi tercurah ke bumi
  rationale: Bentuk pasif נִתַּךְ menggambarkan hujan yang dicurahkan, sedangkan bentuk berarah אָרְצָה berarti menuju bumi atau tanah. 'Tidak lagi' menyatakan penghentian hujan yang sedang berlangsung, sebagaimana dituntut konteks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung. 'Yahweh' mempertahankan nama perjanjian tersebut tanpa menggantinya dengan gelar.
- issue: Gerakan tangan Musa sebagai tindakan doa
  choice: menadahkan kedua tangannya kepada Yahweh
  alternative: membentangkan kedua telapak tangannya ke arah Yahweh
  rationale: Terjemahan ini mempertahankan tindakan jasmani dan arahnya kepada Yahweh tanpa menambahkan rumusan teologis yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat pertama dipecah secara alami untuk memperjelas urutan Musa meninggalkan hadapan Firaun lalu keluar dari kota. Istilah cuaca dibuat mudah dipahami, sementara catatan kaki mempertahankan bentuk harfiah dan alternatif yang sungguh mungkin.
