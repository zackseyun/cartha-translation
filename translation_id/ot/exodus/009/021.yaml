  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/אֲשֶׁ֥ר לֹא שָׂ֛ם לִבּ֖/וֹ אֶל דְּבַ֣ר יְהוָ֑ה וַֽ/יַּעֲזֹ֛ב אֶת עֲבָדָ֥י/ו וְ/אֶת מִקְנֵ֖/הוּ בַּ/שָּׂדֶֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/021.yaml
  text: But whoever did not pay attention to the word of Yahweh left his servants and his livestock in the field[a].
translation:
  language: id
  text: Namun, siapa pun yang tidak mengindahkan firman Yahweh[a] membiarkan hamba-hambanya dan ternaknya tetap di padang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “tidak menaruh hatinya kepada firman Yahweh,” yaitu tidak memasukkannya ke dalam hati atau menganggapnya serius.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: Namun, siapa pun yang
  rationale: Waw dan ungkapan relatif ini mengontraskan kelompok tersebut dengan orang-orang yang menaati peringatan pada ayat sebelumnya; bentuk ini juga mempertahankan makna relatif tak tentu.
- source_word: לֹא שָׂם לִבּוֹ אֶל
  choice: tidak mengindahkan
  rationale: Secara harfiah idiom ini berarti 'tidak menaruh hatinya kepada'; dalam konteks, maksudnya ialah tidak memedulikan atau menanggapi peringatan itu dengan sungguh-sungguh.
- source_word: דְּבַר יְהוָה
  choice: firman Yahweh
  rationale: דָּבָר di sini menunjuk pada perkataan atau pesan peringatan Yahweh. 'Firman' mempertahankan ungkapan alkitabiah yang lazim dan tetap wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan sebuah gelar.
- source_word: וַיַּעֲזֹב
  choice: membiarkan ... tetap
  rationale: Dalam konteks ini, verba tersebut menggambarkan tindakan tidak memindahkan para hamba dan ternak dari padang sehingga mereka tetap berada di sana.
- source_word: עֲבָדָיו
  choice: hamba-hambanya
  rationale: עֶבֶד dapat berarti hamba atau budak; konteks menyoroti orang-orang dalam rumah tangga yang dibiarkan di luar, bukan status hukum mereka.
- source_word: מִקְנֵהוּ
  choice: ternaknya
  rationale: Istilah ini mencakup hewan peliharaan sebagai milik atau kawanan; 'ternak' merupakan padanan kolektif yang alami.
- source_word: בַּשָּׂדֶה
  choice: di padang
  rationale: Padanan lokatif langsung yang menyampaikan bahwa para hamba dan ternak itu tetap berada di tempat terbuka.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama diri ilahi; 'Yahweh' mempertahankannya sebagai nama dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Mengindahkan' menyampaikan daya idiom Ibrani secara ringkas, sedangkan catatan kaki mempertahankan gambaran harfiahnya.
