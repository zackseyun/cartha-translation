  text: וְ/אוּלָ֗ם בַּ/עֲב֥וּר זֹאת֙ הֶעֱמַדְתִּ֔י/ךָ בַּ/עֲב֖וּר הַרְאֹתְ/ךָ֣ אֶת כֹּחִ֑/י וּ/לְמַ֛עַן סַפֵּ֥ר שְׁמִ֖/י בְּ/כָל הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/016.yaml
  text: 'But for this purpose I have let you stand: to show you my power[a], and so that my name may be proclaimed in all the earth.'
translation:
  language: id
  text: 'Namun, justru untuk tujuan inilah Aku membiarkan engkau tetap berdiri[a]: untuk memperlihatkan kepadamu kuasa-Ku dan supaya nama-Ku diberitakan di seluruh bumi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku membuat engkau tetap berdiri.” Ungkapan Ibrani dapat dipahami sebagai menyebabkan Firaun berdiri atau tetap ada; dalam konteks ini, kemungkinan besar maksudnya ialah bahwa Allah membiarkannya tetap hidup dan tidak langsung memusnahkannya.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאוּלָם
  choice: Namun
  rationale: Menandai pertentangan kuat dengan ayat sebelumnya dan tetap alami dalam bahasa Indonesia modern.
- source_word: בַּעֲבוּר זֹאת
  choice: justru untuk tujuan inilah
  rationale: Mengungkapkan maksud ilahi, bukan sekadar sebab; 'justru' memperjelas kontras konteks tanpa menambah gagasan baru.
- source_word: הֶעֱמַדְתִּיךָ
  choice: Aku membiarkan engkau tetap berdiri
  rationale: Bentuk Hifil dari עמד dapat berarti menyebabkan seseorang tetap berdiri atau terus ada. Dalam konteks, Firaun tidak langsung dimusnahkan; ungkapan ini mempertahankan citra Ibrani sekaligus memberi ruang bagi makna dipertahankan hidup.
- source_word: בַּעֲבוּר הַרְאֹתְךָ
  choice: untuk memperlihatkan kepadamu
  rationale: Menyampaikan klausa tujuan dengan jelas dan mempertahankan objek pronominal orang kedua.
- source_word: כֹּחִי
  choice: kuasa-Ku
  rationale: כח menunjuk pada kekuatan atau kuasa; 'kuasa' paling sesuai dengan peragaan tindakan ilahi dalam rangkaian tulah.
- source_word: וּלְמַעַן
  choice: dan supaya
  rationale: Memperkenalkan tujuan kedua yang sejajar dengan tujuan sebelumnya secara alami dalam bahasa Indonesia.
- source_word: סַפֵּר
  choice: diberitakan
  rationale: Bentuk Piel berarti menceritakan atau menyatakan. Bentuk pasif mempertahankan pelaku yang tidak disebutkan secara khusus dan sesuai dengan cakupan universalnya.
- source_word: שְׁמִי
  choice: nama-Ku
  rationale: Mempertahankan ungkapan Ibrani yang mencakup identitas dan kemasyhuran Allah tanpa menguraikannya di dalam teks utama.
- source_word: בְּכָל הָאָרֶץ
  choice: di seluruh bumi
  rationale: Dengan כָּל dan konteks kemasyhuran luas, 'bumi' lebih tepat daripada 'negeri' dan menyampaikan cakupan universal.
theological_decisions:
- issue: Makna הֶעֱמַדְתִּיךָ sehubungan dengan Firaun
  choice: Allah menyatakan bahwa Ia membiarkan Firaun tetap berdiri atau terus hidup demi tujuan ilahi.
  alternative: Allah telah membangkitkan Firaun atau menempatkannya dalam kedudukan kerajaan untuk tujuan tersebut.
  rationale: Konteks langsung membandingkan tindakan yang sebenarnya dapat Allah lakukan—melenyapkan Firaun—dengan kenyataan bahwa ia masih berdiri. Karena itu, keberlangsungan hidup paling mungkin menjadi makna utama, tetapi catatan kaki mempertahankan kemungkinan terjemahan yang lebih harfiah-kausatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'engkau' dipakai karena Allah berbicara langsung kepada Firaun; kapitalisasi pronomina untuk Allah mengikuti kebiasaan penerbitan Alkitab Indonesia. Struktur dua klausa tujuan dipertahankan, demikian pula citra 'tetap berdiri' agar ambiguitas sumber tidak dihapus.
