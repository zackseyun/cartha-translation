base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/027.yaml
  text: Then Pharaoh sent and called for Moses and Aaron[a], and said to them, “I have sinned this time. Yahweh is in the right[b], and I and my people are the wicked ones.”
translation:
  language: id
  text: Kemudian Firaun mengutus dan memanggil Musa dan Harun. Ia berkata kepada mereka, “Kali ini aku telah berdosa. Yahweh benar[a], dan aku serta rakyatku adalah orang-orang fasik[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yahweh adil,” atau “Yahweh berada di pihak yang benar.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “aku serta rakyatku bersalah,” atau “aku serta rakyatku berada di pihak yang salah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... וַיִּקְרָא לְ
  choice: mengutus orang untuk memanggil
  rationale: Ungkapan ini mempertahankan tindakan ‘mengutus’ dan ‘memanggil’ sekaligus, sambil mengungkapkan pelaku yang tersirat agar rangkaiannya alami dalam bahasa Indonesia.
- source_word: חָטָאתִי הַפָּעַם
  choice: Kali ini aku telah berdosa
  rationale: Urutan ini alami dalam bahasa Indonesia dan menyampaikan pengakuan Firaun atas kesalahan yang telah dilakukannya pada peristiwa ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama pribadi Yahweh, bukan diganti dengan gelar.
- source_word: הַצַּדִּיק
  choice: berada di pihak yang benar
  rationale: Dalam kontras pengakuan yang bernuansa hukum dan moral ini, frasa tersebut menyatakan bahwa Yahweh benar dalam tindakan-Nya tanpa menghilangkan kemungkinan arti ‘benar’ atau ‘adil’ yang lebih umum.
- source_word: הָרְשָׁעִים
  choice: bersalah
  rationale: Dalam pertentangan langsung dengan הַצַּדִּיק, kata ini menyatakan bahwa Firaun dan rakyatnya berada di pihak yang salah dan menanggung kesalahan moral; alternatif yang lebih harfiah dicatat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian ilahi secara langsung; transliterasi mempertahankannya sebagai nama pribadi.
- issue: Kekuatan pengakuan Firaun tentang Yahweh dan pihaknya sendiri
  choice: Yahweh berada di pihak yang benar; Firaun dan rakyatnya bersalah
  alternative: Yahweh benar/adil; Firaun dan rakyatnya adalah orang-orang fasik
  rationale: Pilihan utama menampilkan kontras hukum-moral yang langsung dan wajar dalam bahasa Indonesia, sedangkan catatan kaki mempertahankan kemungkinan penggambaran sifat yang lebih eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. ‘Ia berkata’ dipakai untuk menghindari pengulangan nama Firaun, sementara bentuk pengakuan langsung dibuat ringkas dan mudah dipahami.
