review_pass:
  verdict: revise
  source_fidelity: Draf menambahkan objek "orang" pada "mengutus", padahal teks Ibrani hanya menyatakan bahwa Firaun mengutus lalu memanggil Musa dan Harun. Tambahan itu tidak perlu dan membatasi rujukan verba. Selain itu, רְשָׁעִים menyatakan "orang-orang fasik/jahat" dan lebih kuat daripada "bersalah".
  naturalness: Bahasa draf umumnya baku dan jelas. "Mengutus dan memanggil Musa dan Harun" tetap alami dalam narasi Indonesia tanpa menambahkan "orang". "Yahweh benar" merupakan ungkapan langsung dan wajar; "aku dan rakyatku adalah orang-orang fasik" mempertahankan predikasi nominal jamak sumber.
  terminology: '"Yahweh" tepat untuk יהוה. "Rakyatku" tepat untuk עַמִּי. Untuk הַצַּדִּיק dan הָרְשָׁעִים, "benar" dan "orang-orang fasik" menjaga kontras moral-yudisial serta bobot leksikalnya; alternatif "adil" dan "berada di pihak yang salah/bersalah" dapat dicatat.'
  issues:
  - severity: medium
    issue: Tambahan "orang" dalam "mengutus orang untuk memanggil".
    rationale: וַיִּשְׁלַח tidak menyebut objek. Bentuk tersebut dapat diterjemahkan "Firaun mengutus dan memanggil Musa dan Harun," tanpa mengandaikan secara eksplisit bahwa yang diutus adalah orang.
  - severity: medium
    issue: '"Bersalah" melemahkan הָרְשָׁעִים.'
    rationale: Kata sumber adalah adjektiva jamak definit "orang-orang fasik/jahat", bukan sekadar pengakuan bersalah. Terjemahan utama sebaiknya mempertahankan bobot moral dan bentuk predikatifnya.
  - severity: low
    issue: Penanda catatan kaki a dan b tidak selaras dengan cakupan alternatif Inggris.
    rationale: Catatan a pada draf membahas Yahweh benar/adil, dan b membahas orang-orang fasik; penempatan dapat dipertahankan bila teks utama direvisi, tetapi alternatif perlu mencerminkan pilihan utama secara konsisten.
  revised_text: Kemudian Firaun mengutus dan memanggil Musa dan Harun. Ia berkata kepada mereka, “Kali ini aku telah berdosa. Yahweh benar[a], dan aku serta rakyatku adalah orang-orang fasik[b].”
