revisions:
- from: Kemudian Firaun mengutus orang untuk memanggil Musa dan Harun. Ia berkata kepada mereka, “Kali ini aku telah berdosa. Yahweh berada di pihak yang benar[a], sedangkan aku dan rakyatku bersalah[b].”
  to: Kemudian Firaun mengutus dan memanggil Musa dan Harun. Ia berkata kepada mereka, “Kali ini aku telah berdosa. Yahweh benar[a], dan aku serta rakyatku adalah orang-orang fasik[b].”
  rationale: Revisi menghilangkan tambahan "orang" yang tidak ada dalam teks sumber, mempertahankan dua verba berurutan "mengutus dan memanggil", dan menerjemahkan הָרְשָׁעִים dengan "orang-orang fasik" agar kekuatan moral serta bentuk jamaknya tidak berkurang. "Yahweh benar" menyampaikan הַצַּדִּיק secara langsung; nuansa yudisial dicatat sebagai alternatif.
