base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/024.yaml
  text: There was hail[a], and fire flashing within the hail, very severe—such as had never been in all the land of Egypt since it became a nation.
translation:
  language: id
  text: Terjadilah hujan es, dan api[a] menyambar-nyambar di tengah hujan es itu. Hujan es itu sangat dahsyat—belum pernah terjadi yang seperti itu di seluruh negeri Mesir sejak Mesir menjadi suatu bangsa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “api menjalar di tengah hujan es itu.” Kata Ibrani yang dipakai secara harfiah berarti “api” dan mungkin menggambarkan kilatan-kilatan seperti kilat di dalam badai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בָרָד
  choice: Turunlah hujan es
  rationale: Ungkapan naratif eksistensial ini secara alami menyatakan terjadinya hujan es; dalam bahasa Indonesia, hujan es lazim dikatakan 'turun'.
- source_word: וְאֵשׁ
  choice: dan api
  rationale: Kata Ibrani secara harfiah berarti 'api'. Teks utama mempertahankan citra tersebut tanpa langsung menafsirkannya sebagai kilat.
- source_word: מִתְלַקַּחַת
  choice: menyambar-nyambar
  rationale: Partisipel Hitpael ini menggambarkan api yang bergerak atau berkilat secara berulang; 'menyambar-nyambar' menyampaikan gerak yang hidup dan cocok dengan suasana badai.
- source_word: בְּתוֹךְ הַבָּרָד
  choice: di tengah hujan es itu
  rationale: Menerjemahkan makna lokasi di bagian tengah atau di antara curahan hujan es sambil mempertahankan gambaran mencolok dalam teks.
- source_word: כָּבֵד מְאֹד
  choice: sangat dahsyat
  rationale: Secara harfiah 'sangat berat', tetapi dalam konteks badai ungkapan ini menyatakan intensitas luar biasa; 'sangat dahsyat' alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר לֹא הָיָה כָמֹהוּ
  choice: belum pernah terjadi yang seperti itu
  rationale: Menyampaikan perbandingan bahwa peristiwa tersebut tidak tertandingi sebelumnya tanpa mengurangi kekuatan pernyataannya.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: di seluruh negeri Mesir
  rationale: '''Negeri Mesir'' merupakan padanan wilayah yang alami dan bermartabat dalam bahasa Indonesia modern.'
- source_word: מֵאָז הָיְתָה לְגוֹי
  choice: sejak Mesir menjadi suatu bangsa
  rationale: Rujukan pronominal diperjelas sebagai Mesir agar alami dalam bahasa Indonesia. לְגוֹי menunjukkan peralihan menjadi bangsa atau entitas kebangsaan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. Citra harfiah 'api' dipertahankan, sedangkan kemungkinan bahwa yang dimaksud adalah kilat dijelaskan dalam catatan kaki. 'Badai itu' ditambahkan sebagai rujukan wacana yang alami untuk merangkum hujan es dan api sebagai fenomena yang sangat dahsyat.
