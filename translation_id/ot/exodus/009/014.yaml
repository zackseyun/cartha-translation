source:
  edition: WLC
  text: כִּ֣י בַּ/פַּ֣עַם הַ/זֹּ֗את אֲנִ֨י שֹׁלֵ֜חַ אֶת כָּל מַגֵּפֹתַ/י֙ אֶֽל לִבְּ/ךָ֔ וּ/בַ/עֲבָדֶ֖י/ךָ וּ/בְ/עַמֶּ֑/ךָ בַּ/עֲב֣וּר תֵּדַ֔ע כִּ֛י אֵ֥ין כָּמֹ֖/נִי בְּ/כָל הָ/אָֽרֶץ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/014.yaml
  text: For this time I am sending all my plagues against your heart[a], and against your servants and your people[b], so that you may know that there is none like me in all the earth.
translation:
  language: id
  text: Sebab kali ini Aku akan mendatangkan segala tulah-Ku atas hatimu, atas para pegawaimu dan rakyatmu, supaya engkau tahu bahwa tidak ada yang seperti Aku di seluruh bumi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di seluruh negeri.” Kata Ibrani yang sama dapat berarti “bumi” atau “negeri”; di sini “bumi” dipakai karena pernyataan tersebut menekankan bahwa TUHAN tidak tertandingi secara universal.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menghubungkan ayat ini dengan penjelasan sebelumnya mengenai maksud tindakan TUHAN; bentuk ini wajar dan tetap menunjukkan hubungan kausal.
- source_word: בַּפַּעַם הַזֹּאת
  choice: kali ini
  rationale: Ungkapan temporal idiomatis yang menunjuk pada rangkaian tindakan yang segera menyusul.
- source_word: שֹׁלֵחַ
  choice: Aku akan mendatangkan
  rationale: Partisip Ibrani dalam konteks ini menyatakan tindakan yang segera dilakukan. 'Mendatangkan' terdengar alami untuk tulah tanpa menghilangkan gagasan bahwa TUHAN mengutusnya.
- source_word: כָּל מַגֵּפֹתַי
  choice: segala tulah-Ku
  rationale: מַגֵּפָה berarti pukulan atau tulah penghukuman; 'tulah' paling sesuai dengan konteks Keluaran dan bahasa Indonesia Alkitabiah yang tetap mudah dipahami.
- source_word: אֶל לִבְּךָ
  choice: ke dalam hatimu
  rationale: Mempertahankan unsur arah dari אֶל dan metafora לֵב, sehingga sasaran pribadi dan batiniah tidak diratakan menjadi sekadar 'kepadamu'.
- source_word: וּבַעֲבָדֶיךָ
  choice: kepada para pegawaimu
  rationale: עֶבֶד di lingkungan istana menunjuk kepada para pelayan atau pejabat Firaun, bukan budak dalam arti sempit; 'pegawai' cukup luas dan alami.
- source_word: וּבְעַמֶּךָ
  choice: dan kepada rakyatmu
  rationale: עַם menunjuk kepada orang Mesir di bawah pemerintahan Firaun; 'rakyatmu' menyampaikan relasi politik tersebut.
- source_word: בַּעֲבוּר
  choice: supaya
  rationale: Menandai tujuan tindakan TUHAN secara ringkas dan alami.
- source_word: תֵּדַע
  choice: engkau tahu
  rationale: Bentuk imperfek sesudah penanda tujuan menyatakan hasil yang dimaksud; 'supaya engkau tahu' adalah padanan Indonesia yang idiomatis.
- source_word: אֵין כָּמֹנִי
  choice: tidak ada yang seperti Aku
  rationale: Mempertahankan pernyataan ketakterbandingan secara langsung tanpa menambahkan rumusan doktrinal.
- source_word: בְּכָל הָאָרֶץ
  choice: di seluruh bumi
  rationale: אֶרֶץ dapat berarti negeri atau bumi; konteks pernyataan ketakterbandingan TUHAN mendukung cakupan universal, sementara alternatif lokal dicatat dalam catatan kaki.
theological_decisions:
- issue: Sasaran tulah pada 'hati' Firaun
  choice: Mempertahankan ungkapan 'ke dalam hatimu'
  alternative: kepadamu sendiri / terhadap dirimu
  rationale: Teks Ibrani secara eksplisit menyebut hati. Mempertahankannya menjaga kaitan naratif dengan hati Firaun serta ketegangan mengenai dimensi pribadi dan batiniah penghukuman.
- issue: Cakupan ketakterbandingan TUHAN
  choice: 'Universal: ''di seluruh bumi'''
  alternative: 'Lokal: ''di seluruh negeri'''
  rationale: Dalam konteks maksud rangkaian tulah, pernyataan ini paling wajar menegaskan keunikan TUHAN secara universal, tetapi polisemi אֶרֶץ tetap diakui dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan cukup dekat dengan bentuk Ibrani. Kapitalisasi kata ganti ilahi mengikuti kebiasaan luas dalam teks Alkitab bahasa Indonesia. Metafora 'hati' dipertahankan, sedangkan catatan kaki menjelaskan nuansanya dan ambiguitas cakupan אֶרֶץ.
