id: EXO.9.23
reference: Exodus 9:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּ֨ט מֹשֶׁ֣ה אֶת מַטֵּ/הוּ֮ עַל הַ/שָּׁמַיִם֒ וַֽ/יהוָ֗ה נָתַ֤ן קֹלֹת֙ וּ/בָרָ֔ד וַ/תִּ֥הֲלַךְ אֵ֖שׁ אָ֑רְצָ/ה וַ/יַּמְטֵ֧ר יְהוָ֛ה בָּרָ֖ד עַל אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/023.yaml
  text: So Moses stretched out his staff toward the sky[a], and Yahweh sent thunder and hail, and fire came down to the earth. And Yahweh rained hail on the land of Egypt.
translation:
  language: id
  text: Lalu Musa mengulurkan tongkatnya ke arah langit, dan Yahweh mendatangkan guruh dan hujan es; api pun turun ke bumi.[a] Yahweh menurunkan hujan es ke atas tanah Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “api bergerak menuju bumi”; dalam konteks ini, “api” kemungkinan menunjuk pada kilat.
    reason: Menjaga gambaran harfiah dan gerak dalam teks Ibrani sambil menjelaskan rujukan meteorologis yang mungkin.
lexical_decisions:
- source_word: וַיֵּט
  choice: mengulurkan
  rationale: Kata נָטָה di sini menggambarkan tindakan mengarahkan atau merentangkan tongkat; 'mengulurkan' alami dalam bahasa Indonesia dan sesuai dengan konteks tulah.
- source_word: מַטֵּהוּ
  choice: tongkatnya
  rationale: מַטֶּה berarti tongkat atau batang; 'tongkat' merupakan padanan modern yang jelas untuk alat yang digunakan Musa.
- source_word: עַל הַשָּׁמַיִם
  choice: ke arah langit
  rationale: Ungkapan ini dalam konteks gerakan tongkat menyatakan arah ke langit; padanan ini alami dan tidak memaksakan arti 'di atas'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: נָתַן קֹלֹת וּבָרָד
  choice: mendatangkan guruh dan hujan es
  rationale: Secara harfiah נָתַן berarti 'memberikan', tetapi bersama קֹלֹת וּבָרָד ungkapan ini secara idiomatis menyatakan bahwa Yahweh mendatangkan fenomena badai tersebut.
- source_word: קֹלֹת
  choice: guruh
  rationale: Bentuk jamak 'suara-suara' dalam konteks badai merujuk pada bunyi guruh; 'guruh' mempertahankan corak yang bermartabat dan jelas.
- source_word: וַתִּהֲלַךְ אֵשׁ אָרְצָה
  choice: api pun menyambar ke bumi
  rationale: Bahasa Ibrani menggambarkan api bergerak menuju bumi. 'Menyambar' menyampaikan gerak yang hidup dan alami dalam konteks badai, sementara 'api' tetap dipertahankan dan tidak langsung diganti dengan 'kilat'.
- source_word: וַיַּמְטֵר
  choice: menurunkan hujan es
  rationale: Bentuk kausatif kata kerja מָטַר berarti membuat turun seperti hujan; konstruksi Indonesia ini lebih alami daripada 'menghujankan'.
- source_word: אֶרֶץ מִצְרָיִם
  choice: tanah Mesir
  rationale: Padanan ini mempertahankan unsur geografis אֶרֶץ dan menyatakan cakupan tulah dengan ringkas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan fungsi nama itu tanpa menggantinya dengan gelar.
- issue: Identitas אֵשׁ dalam badai
  choice: api
  alternative: kilat
  rationale: Walaupun dalam konteks ini kemungkinan besar menunjuk pada kilat, kata sumber secara eksplisit berarti 'api'. Teks utama mempertahankan gambaran tersebut, dan catatan kaki menjelaskan rujukan yang mungkin.
translation_notes:
  register: Bahasa Indonesia standar modern dengan gaya naratif yang wajar dan bermartabat. 'Guruh' dipilih untuk bunyi petir, sedangkan 'hujan es' dipakai sebagai istilah umum yang mudah dipahami. Tanda catatan kaki ditempatkan tepat setelah klausa yang diterangkannya.
