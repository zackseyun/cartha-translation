  text: הַ/יָּרֵא֙ אֶת דְּבַ֣ר יְהוָ֔ה מֵֽ/עַבְדֵ֖י פַּרְעֹ֑ה הֵנִ֛יס אֶת עֲבָדָ֥י/ו וְ/אֶת מִקְנֵ֖/הוּ אֶל הַ/בָּתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/020.yaml
  text: Whoever among Pharaoh’s servants feared the word of Yahweh hurried his servants and his livestock into the houses[a][b].
translation:
  language: id
  text: Siapa pun di antara para hamba Firaun yang takut akan firman Yahweh segera membawa hamba-hambanya dan ternaknya masuk ke dalam rumah-rumah[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Orang di antara para hamba Firaun yang takut akan firman Yahweh.”
    reason: 'Alternatif ini mencerminkan secara lebih harfiah artikel dengan partisip substantival: ''orang yang takut''.'
  - marker: b
    text: Secara harfiah, “membuat ... melarikan diri”; maksudnya, ia lekas membawa mereka ke tempat berlindung.
    reason: Catatan ini mempertahankan arti kausatif הֵנִיס sambil menjelaskan penggunaannya dalam konteks.
lexical_decisions:
- source_word: הַיָּרֵא
  choice: Siapa pun ... yang takut
  rationale: Artikel dengan partisip berfungsi secara substantival dan menunjuk pada anggota mana pun dari kelompok para hamba Firaun; bentuk ini alami dalam bahasa Indonesia sekaligus mempertahankan cakupan kelompok tersebut.
- source_word: דְּבַר יְהוָה
  choice: firman Yahweh
  rationale: דָּבָר berarti 'perkataan', 'firman', atau 'pesan'. 'Firman Yahweh' mempertahankan ungkapan Alkitabiah tanpa mempersempitnya secara interpretatif menjadi 'peringatan'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai 'Yahweh', bukan diganti dengan suatu gelar.
- source_word: מֵעַבְדֵי פַרְעֹה
  choice: di antara para hamba Firaun
  rationale: 'Preposisi מִן bersifat partitif: orang yang dimaksud berasal dari kelompok para hamba Firaun.'
- source_word: הֵנִיס
  choice: segera membawa ... masuk
  rationale: Bentuk Hifil dari נוּס secara harfiah berarti 'membuat lari'. Dalam konteks tindakan memasukkan orang dan ternak ke tempat berlindung sebelum hujan es, terjemahan ini menyampaikan gerakan yang mendesak tanpa menambahkan kepanikan yang tidak dinyatakan.
- source_word: עֲבָדָיו
  choice: hamba-hambanya
  rationale: עֶבֶד dapat berarti hamba atau budak. 'Hamba-hamba' mempertahankan istilah luas sumber dan hubungan mereka dengan kepala rumah tangga tanpa menentukan status sosial lebih jauh.
- source_word: מִקְנֵהוּ
  choice: ternaknya
  rationale: מִקְנֶה mencakup hewan ternak secara umum; 'ternak' lebih tepat daripada istilah yang hanya menunjuk sapi.
- source_word: אֶל הַבָּתִּים
  choice: masuk ke dalam rumah-rumah
  rationale: Ungkapan ini menunjukkan gerakan menuju bagian dalam bangunan-bangunan tempat berlindung dan mempertahankan bentuk jamak Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi secara langsung; 'Yahweh' mempertahankannya sebagai nama pribadi, bukan menggantinya dengan gelar.
- issue: Makna takut terhadap firman Yahweh
  choice: takut akan firman Yahweh
  alternative: menghormati pesan Yahweh atau takut terhadap peringatan Yahweh
  rationale: Terjemahan mempertahankan objek yang tidak lazim tetapi disengaja dalam bahasa Ibrani, tanpa menguraikannya menjadi sekadar rasa hormat atau membatasi דָּבָר menjadi peringatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Pengulangan 'hamba' sengaja mempertahankan hubungan leksikal עֶבֶד dalam kedua frasa. 'Segera membawa ... masuk' menyampaikan urgensi tindakan secara alami; kedua penanda catatan kaki dicantumkan dalam teks utama.
