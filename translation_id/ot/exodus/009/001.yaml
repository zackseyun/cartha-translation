  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה וְ/דִבַּרְתָּ֣ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/001.yaml
  text: 'Then the LORD said to Moses, "Go in to Pharaoh and say to him, ''Thus says the LORD, the God of the Hebrews: Let my people go, so that they may serve me.''"'
translation:
  language: id
  text: 'Kemudian TUHAN berfirman kepada Musa, “Datanglah menghadap Firaun dan katakan kepadanya, ‘Beginilah firman TUHAN, Allah orang Ibrani: Biarkan umat-Ku pergi supaya mereka beribadah kepada-Ku.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: Datanglah menghadap Firaun
  rationale: Ungkapan ini secara harfiah memakai verba ‘datang/masuk’, tetapi dalam konteks audiensi kerajaan berarti datang menghadap Firaun; pilihan ini mempertahankan arah verba Ibrani sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: וְדִבַּרְתָּ אֵלָיו
  choice: dan katakan kepadanya
  rationale: Bentuk דִבֶּר dapat berarti berbicara atau menyampaikan perkataan; ‘katakan kepadanya’ paling wajar karena langsung diikuti isi pesan.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia untuk nama ilahi YHWH dengan huruf kapital penuh.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: Biarkan umat-Ku pergi
  rationale: Imperatif שַׁלַּח dalam konteks ini menuntut pembebasan atau izin pergi; rumusan ini alami dan mempertahankan tuntutan langsung.
- source_word: וְיַעַבְדֻנִי
  choice: supaya mereka beribadah kepada-Ku
  rationale: עבד dapat berarti melayani atau beribadah. Dalam tuntutan agar Israel pergi demi mengabdi kepada Allah, ‘beribadah’ menyampaikan fungsi religius yang dimaksud tanpa meniadakan nuansa pelayanan.
theological_decisions:
- issue: Makna עבד dalam tujuan pembebasan Israel
  choice: beribadah kepada-Ku
  alternative: melayani Aku
  rationale: Konteks tulah dan permintaan untuk membiarkan Israel pergi menunjuk pada pelayanan kultis kepada Allah. ‘Beribadah’ merupakan ungkapan Indonesia yang paling jelas, sementara hubungan sebagai umat yang melayani Allah tetap tersirat.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Sapaan langsung serta formula kenabian dipertahankan. Tanda petik bertingkat membedakan perkataan TUHAN kepada Musa dari pesan yang harus disampaikan kepada Firaun.
