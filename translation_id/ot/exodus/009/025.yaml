  text: וַ/יַּ֨ךְ הַ/בָּרָ֜ד בְּ/כָל אֶ֣רֶץ מִצְרַ֗יִם אֵ֚ת כָּל אֲשֶׁ֣ר בַּ/שָּׂדֶ֔ה מֵ/אָדָ֖ם וְ/עַד בְּהֵמָ֑ה וְ/אֵ֨ת כָּל עֵ֤שֶׂב הַ/שָּׂדֶה֙ הִכָּ֣ה הַ/בָּרָ֔ד וְ/אֶת כָּל עֵ֥ץ הַ/שָּׂדֶ֖ה שִׁבֵּֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/025.yaml
  text: And the hail struck throughout all the land of Egypt everything that was in the field[a], from man to beast. The hail struck every plant of the field, and shattered every tree of the field.
translation:
  language: id
  text: Hujan es menghantam segala sesuatu yang ada di ladang di seluruh tanah Mesir, dari manusia sampai ternak. Hujan es menghantam setiap tanaman di ladang dan mematahkan setiap pohon di ladang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּךְ / הִכָּה
  choice: menghantam
  rationale: Kedua bentuk berasal dari נכה. “Menghantam” menyampaikan pukulan keras dan daya rusak hujan es secara alami dalam bahasa Indonesia, serta mempertahankan pengulangan verba sumber.
- source_word: הַבָּרָד
  choice: hujan es
  rationale: Padanan baku dan mudah dipahami untuk fenomena cuaca ini; diulang sesuai teks Ibrani.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: di seluruh tanah Mesir
  rationale: Menyampaikan cakupan menyeluruh dari בְּכָל tanpa menambah gagasan di luar teks.
- source_word: אֵת כָּל אֲשֶׁר בַּשָּׂדֶה
  choice: segala sesuatu yang ada di ladang
  rationale: Mempertahankan keluasan כָּל אֲשֶׁר dan latar agraris בַּשָּׂדֶה.
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  choice: dari manusia sampai ternak
  rationale: Ungkapan rentang ini mencakup manusia dan hewan. “Manusia” mewakili אָדָם secara umum, sedangkan “ternak” sesuai dengan בְּהֵמָה dalam konteks hewan peliharaan yang berada di ladang.
- source_word: עֵשֶׂב הַשָּׂדֶה
  choice: setiap tanaman di ladang
  rationale: עֵשֶׂב mencakup tumbuh-tumbuhan atau vegetasi; “tanaman” jelas, modern, dan cocok dengan konteks kerusakan pertanian.
- source_word: עֵץ הַשָּׂדֶה
  choice: setiap pohon di ladang
  rationale: Padanan langsung yang mempertahankan pengulangan frasa tentang ladang.
- source_word: שִׁבֵּר
  choice: mematahkan
  rationale: Bentuk intensif verba שבר menunjukkan kerusakan kuat. Untuk pohon, “mematahkan” lebih alami dan konkret daripada “menghancurkan” atau “meremukkan”.
theological_decisions:
- issue: Cakupan אָדָם dalam ungkapan מֵאָדָם וְעַד בְּהֵמָה
  choice: manusia
  alternative: orang; laki-laki
  rationale: Di sini אָדָם bukan menunjuk secara khusus kepada laki-laki, melainkan manusia sebagai golongan yang dipertentangkan dengan ternak. “Manusia” mempertahankan cakupan umum tersebut tanpa menambahkan pembatasan gender.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami sambil mempertahankan tiga unsur korban—makhluk hidup, tanaman, dan pohon—serta pengulangan “hujan es menghantam” dalam teks sumber.
