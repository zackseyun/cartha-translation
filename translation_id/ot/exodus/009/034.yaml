base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/034.yaml
  text: But when Pharaoh saw that the rain and the hail and the thunder had ceased[a], he continued to sin and hardened his heart, he and his servants.
translation:
  language: id
  text: Namun, ketika Firaun melihat bahwa hujan, hujan es, dan guruh[a] telah berhenti, ia terus berbuat dosa dan mengeraskan hatinya—ia dan para pegawainya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “suara-suara”; dalam konteks badai ini, yang dimaksud ialah bunyi guruh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: melihat
  rationale: Kata ראה dalam narasi lazim berarti 'melihat'; di sini kata itu juga secara alami mencakup kesadaran Firaun bahwa badai telah berhenti.
- source_word: כִּי
  choice: bahwa
  rationale: Kata כִּי memperkenalkan isi yang dilihat Firaun, sedangkan hubungan waktunya dinyatakan oleh 'ketika' pada klausa utama.
- source_word: חָדַל
  choice: telah berhenti
  rationale: Kata חדל berarti berhenti atau berakhir; bentuk ini menunjukkan bahwa berhentinya badai sudah terjadi ketika Firaun menyadarinya.
- source_word: הַמָּטָר וְהַבָּרָד וְהַקֹּלֹת
  choice: hujan, hujan es, dan guruh
  rationale: מטר dan ברד diterjemahkan secara langsung. Bentuk jamak קֹלוֹת secara harfiah berarti 'suara-suara', tetapi dalam konteks badai menunjuk pada bunyi guruh.
- source_word: וַיֹּסֶף לַחֲטֹא
  choice: ia berbuat dosa lagi
  rationale: Susunan יסף dengan infinitif dapat berarti melakukan sesuatu lagi atau terus melakukannya. Dalam urutan narasi ini, 'berbuat dosa lagi' menyampaikan tindakan berulang tanpa mempersempitnya menjadi proses yang semata-mata berkelanjutan.
- source_word: וַיַּכְבֵּד לִבּוֹ
  choice: mengeraskan hatinya
  rationale: Secara harfiah כבד berkaitan dengan menjadi berat, tetapi ungkapan ini dalam kisah Firaun menyatakan sikap hati yang keras atau tidak mau tunduk. Ungkapan Indonesia ini mempertahankan kaitan tematisnya.
- source_word: הוּא וַעֲבָדָיו
  choice: ia dan para pegawainya
  rationale: עבדים dapat berarti hamba, budak, atau pejabat. Dalam lingkungan istana Firaun, 'para pegawainya' secara wajar menunjuk orang-orang yang melayani pemerintahan atau istananya, tanpa mengharuskan makna budak.
- source_word: וַ
  choice: Namun
  rationale: Waw membuka kelanjutan narasi, sementara 'Namun' secara wajar menandai pertentangan dengan pengakuan Firaun sebelumnya.
theological_decisions:
- issue: Pelaku dan cakupan pengerasan hati
  choice: Ayat ini secara eksplisit menyatakan bahwa Firaun mengeraskan hatinya sendiri, lalu menambahkan 'ia dan para pegawainya'.
  alternative: Frasa penutup dapat dipahami memperluas keterlibatan dalam pengerasan hati kepada Firaun dan para pegawainya, atau sebagai penegasan aposisional mengenai pihak-pihak yang kembali berdosa.
  rationale: Bahasa Ibrani menyebut objek tunggal 'hatinya' milik Firaun, tetapi frasa penutup berbentuk jamak secara makna. Tanda pisah mempertahankan tambahan yang agak longgar ini tanpa memaksakan satu hubungan sintaksis atau kesimpulan doktrinal tentang cakupannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Firaun' mengikuti bentuk yang lazim dalam bahasa Indonesia. 'Guruh' dipilih sebagai istilah ringkas dan jelas untuk bunyi guntur, sedangkan catatan kaki mempertahankan bentuk harfiah Ibraninya. Tanda pisah menjaga penekanan frasa penutup sekaligus mempertahankan ambiguitas hubungannya dengan dua tindakan sebelumnya.
