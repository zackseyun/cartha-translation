  yaml_path: translation/ot/exodus/009/031.yaml
  text: And the flax and the barley were struck down[b][a], because the barley was in the ear and the flax was in bud.
translation:
  language: id
  text: Tanaman rami dan jelai itu telah dihantam, sebab jelai sudah berbulir[a] dan rami sudah berkuncup[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sedang masak.”
    reason: lexical_alternative
  - marker: b
    text: Atau “sudah berbunga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפִּשְׁתָּה
  choice: tanaman rami
  rationale: פִּשְׁתָּה menunjuk pada flax, yakni tanaman penghasil serat linen. Dalam bahasa Indonesia, “tanaman rami” merupakan padanan yang mudah dipahami dalam konteks pertanian ini.
- source_word: הַשְּׂעֹרָה
  choice: jelai
  rationale: שְׂעֹרָה secara langsung menunjuk pada jelai, salah satu tanaman biji-bijian yang terkena tulah.
- source_word: נֻכָּתָה
  choice: telah dihantam
  rationale: Bentuk pasif dari נכה ini menyatakan bahwa kedua tanaman terkena pukulan yang merusak. “Telah dihantam” mempertahankan gambaran tindakan keras tanpa menambahkan pelaku yang tidak disebutkan dalam ayat ini.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan mengapa kedua tanaman itu rentan terhadap hantaman. “Sebab” alami dan jelas dalam bahasa Indonesia.
- source_word: אָבִיב
  choice: sudah berbulir
  rationale: אָבִיב menggambarkan jelai pada tahap ketika bulirnya telah terbentuk dan sedang menuju kematangan. “Sudah berbulir” mempertahankan gambaran pertanian yang konkret.
- source_word: גִּבְעֹל
  choice: sudah berkuncup
  rationale: גִּבְעֹל menunjukkan tahap pertumbuhan lanjut pada tanaman rami, tetapi rincian tepatnya tidak sepenuhnya pasti. “Sudah berkuncup” ringkas dan konkret tanpa memberi kepastian berlebihan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Kata “tanaman” ditambahkan pada “rami” agar pembaca tidak mengira yang dimaksud adalah serat atau kain. Penanda catatan kaki ditempatkan langsung sesudah ungkapan yang dijelaskannya.
