  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ מֹשֶׁ֔ה כְּ/צֵאתִ/י֙ אֶת הָ/עִ֔יר אֶפְרֹ֥שׂ אֶת כַּפַּ֖/י אֶל יְהוָ֑ה הַ/קֹּל֣וֹת יֶחְדָּל֗וּ/ן וְ/הַ/בָּרָד֙ לֹ֣א יִֽהְיֶה ע֔וֹד לְמַ֣עַן תֵּדַ֔ע כִּ֥י לַ/יהוָ֖ה הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/029.yaml
  text: Moses said to him[a], “As soon as I have gone out of the city, I will spread out my hands to Yahweh; the thunder will cease, and the hail will be no more[b], so that you may know that the earth belongs to Yahweh.”
translation:
  language: id
  text: Musa berkata kepadanya, “Begitu aku keluar dari kota, aku akan menadahkan kedua tanganku kepada Yahweh. Guruh[a] akan berhenti, dan hujan es tidak akan turun lagi, supaya engkau mengetahui bahwa bumi milik Yahweh.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “suara-suara”; dalam konteks badai ini, yang dimaksud adalah guruh.
    reason: lexical_alternative
  - marker: b
    text: Atau, “bahwa negeri milik Yahweh.”
    reason: alternative_reading
lexical_decisions:
- source_word: כְּצֵאתִי
  choice: Begitu aku keluar
  rationale: Konstruksi כְּ dengan infinitif konstruk dan sufiks orang pertama menyatakan waktu; dalam konteks ini, “begitu” menyampaikan tindakan yang segera menyusul keluarnya Musa dari kota secara alami.
- source_word: אֶפְרֹשׂ אֶת־כַּפַּי
  choice: aku akan menadahkan kedua tanganku
  rationale: Ungkapan ini menggambarkan tangan yang dibentangkan atau ditadahkan dalam doa. “Menadahkan kedua tangan” merupakan ungkapan Indonesia yang alami dan mempertahankan gerak tubuh permohonan.
- source_word: יְהוָה / לַיהוָה
  choice: Yahweh / milik Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” untuk mempertahankan nama perjanjian yang hadir langsung dalam teks Ibrani; לְ pada klausa terakhir menyatakan kepemilikan.
- source_word: הַקֹּלוֹת
  choice: Guruh
  rationale: Secara harfiah bentuk jamak ini berarti “suara-suara”, tetapi dalam konteks badai dan hujan es menunjuk pada bunyi guruh.
- source_word: יֶחְדָּלוּן
  choice: akan berhenti
  rationale: Kata חדל berarti berhenti atau berakhir; pilihan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: וְהַבָּרָד לֹא יִהְיֶה עוֹד
  choice: dan hujan es tidak akan turun lagi
  rationale: Terjemahan ini menyampaikan bahwa hujan es tidak akan berlanjut atau terjadi lagi, dengan ungkapan Indonesia yang alami untuk fenomena cuaca.
- source_word: לְמַעַן תֵּדַע
  choice: Dengan demikian, engkau akan tahu
  rationale: לְמַעַן menyatakan tujuan atau hasil yang dimaksudkan. Ungkapan ini mempertahankan hubungan tindakan dan pengetahuan tanpa terasa kaku.
- source_word: כִּי לַיהוָה הָאָרֶץ
  choice: bahwa bumi ini milik Yahweh
  rationale: לְ menyatakan kepemilikan, sedangkan הָאָרֶץ dapat berarti bumi atau negeri. “Bumi” sesuai dengan cakupan deklarasi kedaulatan dalam konteks ini, sementara alternatif “negeri” dicatat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Cakupan הָאָרֶץ
  choice: bumi ini
  alternative: negeri ini
  rationale: Pernyataan kepada Firaun dapat dipahami sebagai penegasan kepemilikan Yahweh atas seluruh bumi. Namun, karena הָאָרֶץ juga dapat menunjuk pada suatu negeri, kemungkinan itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Engkau” dipakai untuk sapaan tunggal kepada Firaun, dan “menadahkan kedua tangan” mempertahankan citra doa secara alami.
