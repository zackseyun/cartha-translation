  yaml_path: translation/ot/exodus/009/012.yaml
  text: But Yahweh hardened Pharaoh's heart[a], and he did not listen to them, just as Yahweh had spoken to Moses.
translation:
  language: id
  text: Namun, Yahweh mengeraskan hati Firaun[a], dan ia tidak mendengarkan mereka, sebagaimana Yahweh telah berfirman kepada Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “meneguhkan hati Firaun” atau “membuat hati Firaun kuat”. Verba Ibraninya secara lebih harfiah berarti “membuat kuat/teguh”, tetapi dalam konteks ini menunjuk pada sikap keras kepala Firaun dalam perlawanannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: mengeraskan
  rationale: Secara harfiah verba חזק berarti membuat kuat atau teguh. Dalam ungkapan berulang mengenai hati Firaun, bentuk ini menyatakan keteguhan yang menjadi sikap keras kepala; “mengeraskan” adalah padanan Indonesia yang alami sambil mempertahankan tindakan langsung Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap terlihat.
- source_word: לֵב פַּרְעֹה
  choice: hati Firaun
  rationale: Rangkaian konstruksi diterjemahkan secara idiomatis. “Hati” dipertahankan karena dalam pemikiran Ibrani mencakup pusat kehendak dan sikap, tanpa mempersempitnya melalui parafrasa.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: sehingga ia tidak mendengarkan mereka
  rationale: שׁמע dengan אֶל berarti mendengarkan atau mengindahkan. “Mendengarkan” mempertahankan keluasan maknanya, sedangkan “menaati” akan terlalu mempersempit. Konjungsi וְ dalam konteks ini wajar dipahami sebagai hasil dari pengerasan hati.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: tepat seperti yang telah Yahweh firmankan kepada Musa
  rationale: כַּאֲשֶׁר menyatakan kesesuaian dengan perkataan sebelumnya. Bentuk “telah ... firmankan” menunjukkan bahwa firman tersebut mendahului peristiwa ini; “berfirman” sesuai dengan ujaran ilahi dalam ragam Indonesia yang bermartabat.
theological_decisions:
- issue: Tindakan ilahi dalam pengerasan hati Firaun
  choice: Yahweh mengeraskan hati Firaun
  alternative: Yahweh meneguhkan hati Firaun / membuat hati Firaun kuat
  rationale: Teks Ibrani secara eksplisit menempatkan Yahweh sebagai subjek dan hati Firaun sebagai objek. Terjemahan tidak mengubahnya menjadi tindakan yang sekadar diizinkan, sementara catatan kaki mempertahankan nuansa harfiah verba חזק.
- issue: Hubungan pengerasan hati dengan tidak mendengarkan
  choice: sehingga ia tidak mendengarkan mereka
  alternative: dan ia tidak mendengarkan mereka
  rationale: 'Waw dapat berfungsi sebagai penghubung sederhana, tetapi dalam konteks ini klausa kedua secara alami menyatakan akibat. Pilihan ini tidak menghapus tindakan Firaun sendiri: ia tetap menjadi subjek dari “tidak mendengarkan”.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Firaun” mengikuti bentuk Indonesia yang lazim; “Yahweh” mempertahankan nama ilahi. Struktur kalimat dibuat alami tanpa menghilangkan ambiguitas leksikal utama, yang dicatat dalam catatan kaki.
