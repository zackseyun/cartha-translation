  to: Lalu mereka mengambil jelaga dari tungku dan berdiri di hadapan Firaun. Musa melemparkannya ke arah langit, lalu timbullah pada manusia dan hewan bisul-bisul dengan lepuh yang bermunculan.
  rationale: Revisi mengganti verba yang terlalu interpretatif dengan “melemparkannya,” memakai “tungku” sebagai padanan langsung bagi כִּבְשָׁן, dan memperjelas gambaran penyakit sebagai bisul dengan lepuh yang bermunculan. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual penting yang perlu dibawa ke pembaca.
