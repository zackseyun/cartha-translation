base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/010.yaml
  text: So they took soot from the kiln and stood before Pharaoh[a], and Moses threw it toward the sky[b], and it became boils with blisters breaking out on man and on beast.
translation:
  language: id
  text: Lalu mereka mengambil jelaga dari tungku dan berdiri di hadapan Firaun. Musa melemparkannya ke arah langit, lalu timbullah pada manusia dan hewan bisul-bisul dengan lepuh yang bermunculan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִּיחַ
  choice: jelaga
  rationale: Kata ini menunjuk pada serbuk hitam halus atau jelaga, bukan abu secara umum.
- source_word: הַכִּבְשָׁן
  choice: tempat pembakaran
  rationale: כִּבְשָׁן berarti tungku atau tempat pembakaran; pilihan ini alami dalam bahasa Indonesia dan tidak mempersempit jenis tungkunya.
- source_word: לִפְנֵי פַרְעֹה
  choice: di hadapan Firaun
  rationale: Ungkapan ini berarti berada dalam kehadiran Firaun.
- source_word: וַיִּזְרֹק אֹתוֹ מֹשֶׁה
  choice: Musa menghamburkannya
  rationale: Verba dasarnya berarti melemparkan; dalam konteks bahan serbuk yang dilempar ke udara, 'menghamburkan' menyampaikan tindakan secara alami tanpa menambahkan sarana.
- source_word: הַשָּׁמָיְמָה
  choice: ke arah langit
  rationale: Akhiran penunjuk arah menyatakan gerak ke atas; 'langit' mempertahankan arti fisik langsung tanpa muatan teologis tambahan.
- source_word: שְׁחִין
  choice: bisul-bisul
  rationale: Kata ini menunjuk pada bisul atau radang kulit; bentuk ulang wajar untuk gejala yang muncul pada banyak manusia dan hewan.
- source_word: אֲבַעְבֻּעֹת
  choice: melepuh
  rationale: Istilah ini mengacu pada lepuh atau gelembung pada bisul; 'melepuh' menyampaikan ciri tersebut secara ringkas dan alami.
- source_word: פֹּרֵחַ
  choice: yang merebak
  rationale: Partisip ini menggambarkan bisul yang tumbuh atau pecah keluar; 'merebak' sesuai untuk wabah sekaligus erupsi kulit.
- source_word: בָּאָדָם
  choice: pada manusia
  rationale: אָדָם bersifat kolektif dan di sini menunjuk kepada manusia secara umum, berlawanan dengan hewan.
- source_word: וּבַבְּהֵמָה
  choice: dan hewan
  rationale: בְּהֵמָה adalah bentuk kolektif bagi binatang; 'hewan' merupakan padanan modern yang luas dan tidak membatasi maknanya pada ternak.
theological_decisions:
- issue: Makna kolektif אָדָם dalam pasangan manusia-hewan
  choice: manusia
  alternative: orang; umat manusia
  rationale: '''Manusia'' mencakup semua manusia tanpa menghilangkan kontras kolektif dengan hewan dan tanpa memberi kesan bahwa yang dimaksud hanya laki-laki.'
translation_notes:
  register: Bahasa Indonesia baku modern, naratif, dan bermartabat. Susunan kalimat mempertahankan urutan tindakan Ibrani sambil memakai ungkapan yang alami. Tidak diperlukan catatan kaki karena alternatif leksikal tidak menimbulkan ambiguitas penting bagi pembaca.
