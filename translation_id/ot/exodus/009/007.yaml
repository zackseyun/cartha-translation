base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/007.yaml
  text: Pharaoh sent[a], and behold, not even one of Israel’s livestock had died. But Pharaoh’s heart was heavy[b], and he did not let the people go.
translation:
  language: id
  text: Firaun mengutus[a], dan ternyata tidak seekor pun dari ternak orang Israel yang mati. Namun, hati Firaun menjadi berat[b], dan ia tidak membiarkan bangsa itu pergi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Firaun mengutus”; orang yang diutus dan tujuan pengutusan tidak disebutkan.
    reason: implicit_object
  - marker: b
    text: Secara harfiah, “hati Firaun menjadi berat,” sebuah ungkapan yang menggambarkan bahwa ia menjadi keras atau keras kepala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengutus orang
  rationale: Kata kerja שׁלח berarti “mengutus” atau “menyuruh pergi”; objeknya tidak disebutkan dalam bahasa Ibrani. Bahasa Indonesia memerlukan pelengkap agar kalimatnya wajar, sehingga “orang” ditambahkan tanpa menentukan siapa yang diutus.
- source_word: וְהִנֵּה
  choice: dan ternyata
  rationale: Partikel הִנֵּה menarik perhatian kepada hasil yang didapati. Dalam narasi Indonesia modern, “ternyata” menyampaikan daya penunjuk dan unsur penemuan itu secara alami.
- source_word: לֹא מֵת מִמִּקְנֵה יִשְׂרָאֵל עַד אֶחָד
  choice: tidak seekor pun dari ternak orang Israel yang mati
  rationale: Ungkapan עַד אֶחָד menegaskan bahwa bahkan satu ekor pun tidak mati. מִקְנֶה mencakup ternak secara luas, bukan hanya sapi.
- source_word: וַיִּכְבַּד לֵב פַּרְעֹה
  choice: hati Firaun menjadi berat
  rationale: Terjemahan ini mempertahankan metafora Ibrani bahwa hati Firaun “menjadi berat,” yang dalam konteks menyatakan sikap keras dan keras kepala, tanpa mengubahnya menjadi bentuk pasif atau menentukan pelakunya.
- source_word: וְלֹא שִׁלַּח אֶת הָעָם
  choice: dan ia tidak membiarkan bangsa itu pergi
  rationale: Dalam konteks Keluaran, שׁלח dengan bangsa itu sebagai objek berarti membebaskan atau membiarkan mereka pergi. Ungkapan ini alami dan tepat dalam bahasa Indonesia.
theological_decisions:
- issue: Pelaku dalam kekerasan hati Firaun
  choice: hati Firaun menjadi berat
  alternative: hati Firaun dikeraskan; Firaun mengeraskan hatinya
  rationale: Teks Ibrani menempatkan “hati Firaun” sebagai subjek dari kata kerja כבד dan tidak menyebut pelaku dari luar. Metafora langsung dipertahankan agar ketegangan tentang tanggung jawab manusia dan tindakan ilahi dalam rangkaian kisah Keluaran tidak diselesaikan secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif khidmat. “Ternyata” dipakai sebagai padanan alami untuk partikel penunjuk הִנֵּה; metafora “hati menjadi berat” dipertahankan dan dijelaskan melalui catatan kaki.
