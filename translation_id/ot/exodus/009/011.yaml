  text: וְ/לֹֽא יָכְל֣וּ הַֽ/חַרְטֻמִּ֗ים לַ/עֲמֹ֛ד לִ/פְנֵ֥י מֹשֶׁ֖ה מִ/פְּנֵ֣י הַ/שְּׁחִ֑ין כִּֽי הָיָ֣ה הַ/שְּׁחִ֔ין בַּֽ/חֲרְטֻמִּ֖ם וּ/בְ/כָל מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/011.yaml
  text: And the magicians were not able to stand before Moses because of the boils[a], for the boils were on the magicians and on all the Egyptians.
translation:
  language: id
  text: Para ahli sihir itu tidak dapat berdiri di hadapan Musa karena bisul-bisul tersebut, sebab bisul-bisul itu ada pada para ahli sihir dan di seluruh Mesir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi “di seluruh Mesir”. Konteksnya menyiratkan bahwa bisul-bisul itu menimpa orang-orang di seluruh negeri Mesir.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: para ahli sihir
  rationale: Dalam kisah Keluaran, istilah ini menunjuk kepada para ahli ritual di istana Firaun yang menentang atau meniru Musa dan Harun. 'Para ahli sihir' merupakan padanan Indonesia yang jelas dan lazim tanpa menentukan secara berlebihan fungsi teknis mereka.
- source_word: לַעֲמֹד לִפְנֵי מֹשֶׁה
  choice: berdiri di hadapan Musa
  rationale: Ungkapan Ibrani dipertahankan secara cukup formal; dalam konteks ini artinya mereka tidak sanggup tampil atau berada di hadapan Musa karena penyakit itu.
- source_word: מִפְּנֵי הַשְּׁחִין
  choice: karena bisul-bisul tersebut
  rationale: מִפְּנֵי menyatakan sebab, sedangkan שְׁחִין adalah sebutan kolektif bagi radang atau bisul pada kulit. Bentuk jamak alami dalam bahasa Indonesia untuk wabah berupa banyak bisul.
- source_word: הַשְּׁחִין
  choice: bisul-bisul itu
  rationale: Pengulangan dipertahankan untuk mengikuti penekanan teks Ibrani, dengan bentuk jamak yang menyampaikan makna kolektifnya.
- source_word: בַּחֲרְטֻמִּם
  choice: pada para ahli sihir
  rationale: Preposisi ב secara kontekstual menunjukkan bahwa bisul-bisul itu mengenai tubuh para ahli sihir.
- source_word: וּבְכָל מִצְרָיִם
  choice: dan di seluruh Mesir
  rationale: Terjemahan ini mempertahankan bentuk harfiah dan cakupan geografis ungkapan Ibrani. Konteks menyiratkan bahwa wabah itu menimpa orang-orang di seluruh negeri, tanpa mengganti metonimia asli dengan 'semua orang Mesir'.
theological_decisions: []
