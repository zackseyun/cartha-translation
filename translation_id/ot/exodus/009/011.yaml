  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti alur Ibrani dengan pengulangan 'bisul-bisul' dipertahankan; ungkapan geografis-metonomis pada akhir ayat juga dipertahankan dan dijelaskan melalui catatan kaki.
