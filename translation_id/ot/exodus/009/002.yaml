lexical_decisions:
- source_word: כִּי אִם
  choice: Sebab, jika
  rationale: Gabungan ini mengaitkan ancaman tersebut dengan ayat sebelumnya sekaligus memperkenalkan syarat; bentuk ini mempertahankan kedua fungsi itu dalam bahasa Indonesia yang wajar.
- source_word: מָאֵן
  choice: menolak
  rationale: Kata kerja ini menyatakan penolakan yang disengaja, bukan sekadar ketidakmampuan atau keengganan.
- source_word: לְשַׁלֵּחַ
  choice: membiarkan mereka pergi
  rationale: Dalam konteks keluaran Israel, ungkapan ini berarti mengizinkan umat itu berangkat; pilihan ini alami dan tepat dalam bahasa Indonesia.
- source_word: וְעוֹדְךָ
  choice: dan masih
  rationale: Bentuk ini menunjukkan bahwa tindakan Firaun terus berlangsung.
- source_word: מַחֲזִיק בָּם
  choice: menahan mereka
  rationale: Partisip ini menggambarkan tindakan yang berlanjut, yakni tetap menguasai dan tidak melepaskan mereka. 'Menahan' menyampaikan maksud kontekstual itu secara ringkas tanpa menghilangkan aspek keberlanjutan yang dinyatakan oleh 'masih'.
