  terminology: “Engkau” tepat untuk sapaan tunggal kepada Firaun dan selaras dengan register naratif-peringatan. “Menahan” tepat dalam konteks Firaun yang tidak mengizinkan Israel pergi. Namun, “mencengkeram” dalam catatan kaki terlalu fisik dan lebih sempit daripada חזק dengan ב dalam konteks ini, yang menandakan tetap menahan atau menguasai/mengekang.
