id: EXO.9.4
reference: Exodus 9:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הִפְלָ֣ה יְהוָ֔ה בֵּ֚ין מִקְנֵ֣ה יִשְׂרָאֵ֔ל וּ/בֵ֖ין מִקְנֵ֣ה מִצְרָ֑יִם וְ/לֹ֥א יָמ֛וּת מִ/כָּל לִ/בְנֵ֥י יִשְׂרָאֵ֖ל דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/004.yaml
  text: But Yahweh will make a distinction between the livestock of Israel and the livestock of Egypt[a], so that nothing belonging to the sons of Israel will die.
translation:
  language: id
  text: Namun, Yahweh akan membedakan antara ternak Israel dan ternak Mesir, sehingga tidak seekor pun dari ternak milik keturunan Israel akan mati.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִפְלָה
  choice: akan membedakan
  rationale: Bentuk Hifil dari פלא di sini menyatakan tindakan membuat pemisahan atau perbedaan yang nyata; “membedakan” alami dalam bahasa Indonesia dan mempertahankan nuansa kausatif dalam konteks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: בֵּין ... וּבֵין
  choice: antara ... dan ...
  rationale: Pasangan preposisi korelatif ini menandai pembedaan antara dua kelompok.
- source_word: מִקְנֵה
  choice: ternak
  rationale: מִקְנֶה mencakup hewan-hewan peliharaan sebagai milik, bukan hanya sapi; “ternak” merupakan padanan Indonesia yang luas dan wajar.
- source_word: מִצְרָיִם
  choice: Mesir
  rationale: Dalam frasa konstruksi “ternak Mesir”, nama negeri dipakai secara kolektif dan sesuai dengan bentuk teks Ibrani.
- source_word: וְלֹא יָמוּת
  choice: sehingga ... tidak ... akan mati
  rationale: Hubungan hasil dibuat jelas secara alami dalam bahasa Indonesia, sambil mempertahankan penyangkalan dan acuan waktu mendatang.
- source_word: מִכָּל ... דָּבָר
  choice: tidak seekor pun
  rationale: Dalam konteks ternak, ungkapan negatif distributif ini berarti tidak satu pun yang mati. “Tidak seekor pun” menyampaikan daya penegasnya secara idiomatis tanpa memakai “sesuatu” yang kabur.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: milik keturunan Israel
  rationale: Preposisi ל menyatakan kepemilikan dalam konteks ini. בְּנֵי יִשְׂרָאֵל adalah ungkapan kebangsaan genealogis; “keturunan Israel” mempertahankan unsur tersebut dan mencakup umat secara kolektif.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Penerjemahan בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak lelaki Israel; orang Israel
  rationale: Ungkapan maskulin jamak ini berfungsi sebagai sebutan baku bagi bangsa keturunan Israel secara keseluruhan. Terjemahan “keturunan Israel” mempertahankan dimensi genealogis tanpa menyiratkan bahwa hanya laki-laki yang dimaksud.
- issue: Cakupan hal yang tidak akan mati
  choice: tidak seekor pun dari ternak milik keturunan Israel
  alternative: tidak ada sesuatu pun milik keturunan Israel
  rationale: Konteks langsung membahas מִקְנֵה, sehingga דָּבָר dalam konstruksi negatif merujuk pada satu pun dari ternak itu. Perumusan ini memperjelas rujukan tanpa memperluas janji kepada seluruh harta benda.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Namun” menyatakan kontras dengan tulah atas ternak Mesir. Susunan kalimat dibuat alami, sedangkan pengulangan “ternak” dipertahankan untuk memperjelas dua kelompok yang dibedakan.
