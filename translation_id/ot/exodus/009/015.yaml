base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/015.yaml
  text: For by now I could have stretched out my hand and struck you and your people with pestilence[a], and you would have been cut off from the earth.
translation:
  language: id
  text: Sebab, pada saat ini Aku sebenarnya sudah dapat mengulurkan tangan-Ku dan menghantam engkau serta rakyatmu dengan wabah penyakit[a], dan engkau tentu sudah dilenyapkan dari bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Sebab sekarang Aku telah mengulurkan tangan-Ku dan menghantam engkau serta rakyatmu dengan wabah penyakit, dan engkau telah dilenyapkan dari bumi.” Bentuk-bentuk verba Ibraninya secara formal berbentuk lampau, tetapi konteks sangat mendukung pengertian kontrafaktual.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai penjelasan bagi pernyataan sebelumnya dan mempertahankan hubungan kausal dalam konteks.
- source_word: עַתָּה
  choice: sekarang ini
  rationale: Menyampaikan acuan waktu kini; bersama unsur kontrafaktual dalam kalimat, frasa ini menunjukkan apa yang sebenarnya dapat sudah terjadi.
- source_word: שָׁלַחְתִּי אֶת־יָדִי
  choice: Aku sebenarnya dapat saja mengulurkan tangan-Ku
  rationale: Ungkapan 'mengulurkan tangan' mempertahankan idiom Ibrani tentang tindakan atau penghakiman ilahi. 'Sebenarnya dapat saja' mengungkapkan daya kontrafaktual yang dituntut konteks, meskipun bentuk verba Ibraninya secara formal berbentuk lampau.
- source_word: וָאַךְ
  choice: dan menghantam
  rationale: Dalam konteks penghukuman, נכה menyatakan tindakan memukul atau menimpakan bencana; 'menghantam' kuat, alami, dan tidak arkais.
- source_word: אֹתְךָ וְאֶת־עַמְּךָ
  choice: engkau serta rakyatmu
  rationale: Terjemahan langsung atas kedua objek penghukuman; 'rakyatmu' sesuai untuk bangsa yang berada di bawah Firaun.
- source_word: בַּדָּבֶר
  choice: dengan wabah penyakit
  rationale: דֶּבֶר menunjuk pada sampar atau penyakit menular yang mematikan. 'Wabah penyakit' jelas bagi pembaca modern dan tidak mengaburkannya dengan keseluruhan rangkaian tulah.
- source_word: וַתִּכָּחֵד
  choice: sehingga engkau sudah dilenyapkan
  rationale: Bentuk Niphal dari כחד menyatakan dihapuskan atau dimusnahkan. Konstruksi ini menyampaikan akibat kontrafaktual secara alami dalam bahasa Indonesia.
- source_word: מִן־הָאָרֶץ
  choice: dari bumi
  rationale: אָרֶץ dapat berarti 'negeri' atau 'bumi'; di sini 'bumi' paling tepat untuk gambaran pemusnahan total, bukan sekadar pengusiran dari wilayah Mesir.
theological_decisions:
- issue: Daya kontrafaktual rangkaian verba
  choice: Menerjemahkan sebagai tindakan yang sebenarnya dapat saja dilakukan dan akibat yang sudah akan terjadi.
  alternative: 'Menerjemahkan bentuk-bentuk verba secara formal sebagai lampau: ''Sekarang Aku telah mengulurkan tangan-Ku ... dan engkau telah dilenyapkan.'''
  rationale: Konteks langsung, khususnya ayat 16, membedakan apa yang dapat dilakukan Allah dari alasan Firaun tetap dibiarkan hidup. Terjemahan lampau sederhana bertentangan secara pragmatis dengan kenyataan bahwa Firaun masih hidup dan sedang disapa. Catatan kaki tetap mempertahankan bentuk formal dan ambiguitas sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada luhur namun mudah dipahami. Kata ganti ilahi ditulis dengan huruf kapital menurut kebiasaan penerbitan Alkitab Indonesia. 'Engkau' mempertahankan sapaan tunggal kepada Firaun, sedangkan 'rakyatmu' terdengar lebih alami daripada 'bangsamu' dalam relasi penguasa-rakyat.
