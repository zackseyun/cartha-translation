  yaml_path: translation/ot/exodus/009/032.yaml
  text: But the wheat and the spelt were not struck down[b][a], because they were late-ripening.
translation:
  language: id
  text: Namun, gandum dan emmer[a] tidak terkena hantaman hujan es, karena keduanya belum matang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Emmer adalah sejenis gandum; istilah Ibrani ini juga dapat merujuk kepada spelt.
    reason: cultural_note
  - marker: b
    text: 'Atau: “karena keduanya masak lebih lambat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחִטָּה
  choice: Namun, gandum
  rationale: חִטָּה berarti gandum. Konjungsi וְ secara bentuk berarti 'dan', tetapi di sini menyatakan kontras dengan tanaman yang rusak dalam ayat sebelumnya, sehingga 'Namun' wajar dalam bahasa Indonesia.
- source_word: וְהַכֻּסֶּמֶת
  choice: dan sekoi
  rationale: כֻּסֶּמֶת menunjuk pada sejenis serealia yang biasanya diidentifikasi sebagai spelt atau emmer. 'Sekoi' dipakai sebagai padanan Indonesia yang cukup dikenal, sementara catatan kaki mempertahankan ketidakpastian identifikasinya.
- source_word: לֹא נֻכּוּ
  choice: tidak dihantam
  rationale: Bentuk pasif dari נכה menyatakan bahwa tanaman itu tidak terkena hantaman hujan es. 'Dihantam' mempertahankan gambaran tindakan keras tanpa sekadar meratakannya menjadi 'tidak rusak'.
- source_word: כִּי
  choice: karena
  rationale: כִּי memperkenalkan alasan mengapa kedua jenis tanaman itu tidak terkena kehancuran.
- source_word: אֲפִילֹת הֵנָּה
  choice: keduanya belum masak
  rationale: Ungkapan feminin jamak ini dalam konteks pertanian kemungkinan berarti tanaman tersebut masih terlambat atau belum berkembang hingga matang, sehingga terlindung dari kerusakan yang menimpa tanaman yang lebih dahulu tumbuh.
