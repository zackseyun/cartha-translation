  source_fidelity: 'Secara umum draf setia pada teks Ibrani: perintah awal ditujukan kepada Musa dan Harun (jamak), kemudian tindakan melempar secara khusus dilakukan Musa (tunggal); bahan itu adalah jelaga dari tungku; dan tindakan dilakukan dalam pandangan Firaun. Namun, kata kerja Indonesia “menghamburkan” dapat menyatakan tindakan menebar atau menyebarkan, sedangkan זָרַק terutama berarti melemparkan/melontarkan. “Melemparkannya” mempertahankan tindakan sumber tanpa menambahkan cara penyebaran.'
