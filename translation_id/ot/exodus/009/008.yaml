base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/008.yaml
  text: Then Yahweh said to Moses and to Aaron[a], “Take for yourselves handfuls of soot from a furnace[c][b], and let Moses throw it toward the sky before Pharaoh’s eyes.”
translation:
  language: id
  text: Kemudian Yahweh berfirman kepada Musa dan Harun, “Ambillah masing-masing segenggam penuh[a] jelaga[b] dari tungku, lalu Musa hendaklah melemparkannya ke arah langit[c] di depan mata Firaun.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sepenuh genggaman tangan kalian.”
    reason: lexical_alternative
  - marker: b
    text: “Jelaga” juga dapat diterjemahkan “serbuk jelaga” atau, secara lebih umum, “abu”; namun kata Ibraninya lebih khusus menunjuk pada jelaga dari tungku.
    reason: lexical_alternative
  - marker: c
    text: Atau “ke arah surga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani dan membedakannya dari gelar seperti ‘Tuhan’.
- source_word: וַיֹּאמֶר
  choice: berfirman
  rationale: Dalam konteks Allah sebagai subjek, ‘berfirman’ merupakan padanan bahasa Indonesia yang wajar dan bermartabat untuk tindakan berbicara.
- source_word: קְחוּ לָכֶם
  choice: Ambillah bagi kalian
  rationale: Bentuk perintahnya jamak, sedangkan לָכֶם memberi nuansa datif/refleksif ‘bagi kalian’; susunan ini mempertahankan keduanya.
- source_word: מְלֹא חָפְנֵיכֶם
  choice: masing-masing segenggam penuh
  rationale: Ungkapan ini menyatakan sebanyak yang memenuhi genggaman tangan orang-orang yang disapa. ‘Masing-masing’ memperjelas bahwa perintah jamak itu ditujukan kepada Musa dan Harun tanpa mengubah jumlah bahan secara berlebihan.
- source_word: פִּיחַ
  choice: jelaga
  rationale: Kata ini menunjuk pada serbuk residu hitam yang halus, khususnya dari tungku, sehingga ‘jelaga’ lebih tepat daripada istilah umum ‘abu’.
- source_word: כִּבְשָׁן
  choice: tungku
  rationale: Istilah Ibrani dapat menunjuk pada tungku pembakaran atau tanur; ‘tungku’ adalah padanan Indonesia yang luas dan tidak terlalu membatasi jenisnya.
- source_word: וּזְרָקוֹ
  choice: lalu hendaklah Musa menghamburkannya
  rationale: Pelaku bergeser dari perintah jamak kepada Musa seorang. ‘Menghamburkan’ sesuai dengan tindakan melemparkan serbuk halus, sedangkan ‘hendaklah’ mempertahankan sifat instruksinya.
- source_word: הַשָּׁמַיְמָה
  choice: ke arah langit
  rationale: Akhiran direktif menyatakan gerak ke arah atas. Dalam tindakan fisik ini, ‘langit’ alami dalam bahasa Indonesia dan tidak memaksakan arti teologis ‘surga’.
- source_word: לְעֵינֵי פַרְעֹה
  choice: di depan mata Firaun
  rationale: Padanan ini mempertahankan gambaran konkret idiom Ibrani dan menekankan bahwa tindakan itu dilakukan dalam penglihatan Firaun.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama diri ilahi, bukan sekadar gelar. ‘Yahweh’ mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar.
- issue: Makna הַשָּׁמַיְמָה dalam tindakan melempar jelaga
  choice: ke arah langit
  alternative: ke arah surga
  rationale: Konteks menggambarkan arah gerak fisik ke atas. Pilihan ‘langit’ menjaga kemungkinan referen spasial yang langsung dan menghindari penyempitan menjadi tempat tinggal ilahi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang bermartabat. ‘Berfirman’ dipakai secara alami ketika Allah berbicara; struktur perintah tetap jelas bagi pembaca umum. Penempatan penanda catatan kaki mengikuti kata atau frasa yang benar-benar dijelaskan.
