  terminology: “Yahweh,” “Musa,” “Harun,” “Firaun,” “jelaga,” “tungku,” dan “langit” sudah sesuai. “Berfirman” cocok dengan register naratif Alkitab bahasa Indonesia. Catatan alternatif “surga” dipertahankan sebagai kemungkinan leksikal, sementara teks utama tepat memakai “langit” dalam konteks gerak fisik ke atas.
