  text: וַֽ/יֶּחֱזַק֙ לֵ֣ב פַּרְעֹ֔ה וְ/לֹ֥א שִׁלַּ֖ח אֶת בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/035.yaml
  text: So Pharaoh’s heart was hardened[a], and he did not let the sons of Israel go[c][b], just as Yahweh had spoken through Moses.
translation:
  language: id
  text: Maka hati Firaun menjadi keras[a], dan ia tidak membiarkan orang Israel pergi[b], tepat seperti yang telah difirmankan Yahweh melalui Musa.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “hati Firaun bertambah keras” atau “hati Firaun menjadi teguh.” Verba Ibrani berarti menjadi kuat atau teguh, dan di sini menggambarkan sikap keras kepala.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “anak-anak lelaki Israel”; ungkapan ini menunjuk kepada orang Israel atau bangsa Israel.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “dengan tangan Musa,” suatu ungkapan yang berarti “melalui Musa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: menjadi keras
  rationale: Bentuk Qal menyatakan bahwa hati Firaun menjadi kuat atau teguh; dalam konteks ini, ungkapan tersebut menggambarkan keteguhan yang membangkang. Terjemahan ini mempertahankan motif kekerasan hati tanpa menentukan pelaku yang mengeraskannya.
- source_word: לֵב פַּרְעֹה
  choice: hati Firaun
  rationale: Padanan langsung dan alami dalam bahasa Indonesia yang mempertahankan fokus Ibrani pada kehendak serta sikap batin Firaun.
- source_word: שִׁלַּח
  choice: membiarkan ... pergi
  rationale: Dalam kisah keluaran, verba ini mengacu pada izin Firaun agar Israel berangkat. Ungkapan ini alami dan tepat dalam konteks.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah berarti 'anak-anak lelaki Israel', tetapi dalam konteks menunjuk secara kolektif kepada bangsa Israel. 'Orang Israel' jelas, alami, dan mencakup seluruh umat; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: כַּאֲשֶׁר
  choice: tepat seperti
  rationale: Menandai kesesuaian antara kejadian ini dan firman ilahi sebelumnya.
- source_word: דִּבֶּר יְהוָה
  choice: yang telah difirmankan Yahweh
  rationale: Bentuk lampau dengan 'telah' menunjukkan bahwa firman itu disampaikan sebelumnya dan kini terbukti terjadi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan agar nama pribadi dalam teks Ibrani tetap tampak, alih-alih diganti dengan sebuah gelar.
- source_word: בְּיַד מֹשֶׁה
  choice: melalui Musa
  rationale: Ungkapan harfiah 'dengan tangan Musa' merupakan idiom perantaraan atau keagenan; 'melalui Musa' menyampaikan maknanya secara alami.
theological_decisions:
- issue: Pelaku dalam pengerasan hati Firaun
  choice: hati Firaun menjadi keras
  alternative: hati Firaun dikeraskan; Firaun mengeraskan hatinya
  rationale: Klausa Ibrani ini menyatakan bahwa hati itu menjadi kuat atau keras, tetapi tidak secara eksplisit menyebut Allah maupun Firaun sebagai pelaku. Pilihan ini mempertahankan ketegangan teologis dalam narasi tanpa menambahkan sebab yang tidak dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sedangkan ungkapan Ibrani yang penting dan alternatif maknanya dipertahankan melalui catatan kaki.
