  yaml_path: translation/ot/exodus/009/026.yaml
  text: Only in the land of Goshen[a], where the sons of Israel were, was there no hail.
translation:
  language: id
  text: Hanya di tanah Gosyen, tempat orang Israel[a] berada, tidak ada hujan es.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak lelaki Israel”; dapat juga diterjemahkan “keturunan Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Hanya
  rationale: Menandai pembatasan yang tegas dan secara alami dipertahankan pada awal kalimat.
- source_word: בְּאֶרֶץ גֹּשֶׁן
  choice: di tanah Gosyen
  rationale: Preposisi בְּ dengan אֶרֶץ menunjuk lokasi dalam suatu wilayah; nama tempat ditransliterasikan sebagai Gosyen sesuai bentuk Indonesia yang lazim.
- source_word: אֲשֶׁר שָׁם
  choice: tempat ... berada
  rationale: Ungkapan relatif-lokatif ini diterjemahkan secara alami dalam bahasa Indonesia tanpa menambah makna.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah berarti 'anak-anak lelaki Israel', tetapi dalam konteks ini merupakan sebutan kolektif bagi bangsa Israel; 'orang Israel' jelas, alami, dan tidak mempersempit kelompok itu hanya kepada laki-laki.
- source_word: לֹא הָיָה
  choice: tidak ada
  rationale: Bentuk negatif dari היה berfungsi secara eksistensial dan menyatakan ketiadaan hujan es.
- source_word: בָּרָד
  choice: hujan es
  rationale: Padanan baku bahasa Indonesia untuk fenomena cuaca yang dimaksud.
theological_decisions:
- issue: Penerjemahan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak lelaki Israel / keturunan Israel
  rationale: Walaupun bentuk Ibraninya secara harfiah 'anak-anak lelaki Israel', ungkapan tersebut di sini berfungsi sebagai nama kolektif bangsa itu. Teks utama memakai padanan Indonesia yang alami, sementara bentuk harfiahnya dipertahankan dalam catatan agar nuansa sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan awal 'Hanya di tanah Gosyen' mempertahankan penekanan pembatasan dalam teks Ibrani; klausa berikutnya dibuat idiomatis bagi pembaca umum.
