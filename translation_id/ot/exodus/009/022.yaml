  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁה נְטֵ֤ה אֶת יָֽדְ/ךָ֙ עַל הַ/שָּׁמַ֔יִם וִ/יהִ֥י בָרָ֖ד בְּ/כָל אֶ֣רֶץ מִצְרָ֑יִם עַל הָ/אָדָ֣ם וְ/עַל הַ/בְּהֵמָ֗ה וְ/עַ֛ל כָּל עֵ֥שֶׂב הַ/שָּׂדֶ֖ה בְּ/אֶ֥רֶץ מִצְרָֽיִם־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/022.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand toward the sky[b], so that hail may come over all the land of Egypt—on man and on beast and on every plant of the field in the land of Egypt.”
translation:
  language: id
  text: Kemudian Yahweh berfirman kepada Musa, “Ulurkan tanganmu ke arah langit[a], supaya turun hujan es di seluruh tanah Mesir—menimpa manusia, ternak, dan setiap tumbuhan di ladang di tanah Mesir.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “surga.” Kata Ibrani yang sama dapat berarti “langit” atau “surga”; di sini konteksnya menunjuk pada langit tempat hujan es turun.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama pribadi ilahi yang diwakili Tetragramaton, bukan menggantinya dengan gelar.
- source_word: נְטֵה אֶת יָדְךָ
  choice: Ulurkan tanganmu
  rationale: Ungkapan Indonesia yang alami untuk perintah mengulurkan atau membentangkan tangan.
- source_word: עַל הַשָּׁמַיִם
  choice: ke arah langit
  rationale: Preposisi menyatakan arah, sedangkan konteks meteorologis menunjuk pada langit yang tampak; kemungkinan leksikal 'surga' dicatat dalam catatan kaki.
- source_word: וִיהִי בָרָד
  choice: supaya turun hujan es
  rationale: Menangkap daya jussif sebagai hasil yang dikehendaki dari perintah sebelumnya. Kata 'turun' menyatakan secara alami datangnya hujan es tanpa mengubahnya menjadi perintah langsung tersendiri.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: di seluruh tanah Mesir
  rationale: Menyampaikan cakupan menyeluruh dari frasa Ibrani dan mempertahankan istilah geografis 'tanah Mesir'.
- source_word: הָאָדָם
  choice: manusia
  rationale: Nomina kolektif ini merujuk kepada manusia pada umumnya sebagai pasangan kontras dengan hewan, bukan khusus laki-laki.
- source_word: הַבְּהֵמָה
  choice: ternak
  rationale: Dalam konteks tulah Mesir, istilah ini paling wajar menunjuk kepada hewan peliharaan atau ternak yang berada di luar; lebih tepat secara kontekstual daripada 'binatang buas'.
- source_word: כָּל עֵשֶׂב הַשָּׂדֶה
  choice: setiap tumbuhan di ladang
  rationale: עֵשֶׂב mencakup tumbuh-tumbuhan atau vegetasi; pilihan ini jelas, luas, dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Transliterasi ini mempertahankan nama perjanjian sebagai nama pribadi dan tidak menggantinya dengan gelar.
- issue: Cakupan הָאָדָם
  choice: manusia
  alternative: orang; umat manusia
  rationale: Bentuk tunggal berfungsi secara kolektif dan mencakup manusia secara umum dalam kontras dengan ternak.
- issue: Daya modal וִיהִי setelah perintah
  choice: supaya turun hujan es
  alternative: dan biarlah ada hujan es
  rationale: Terjemahan ini mempertahankan hubungan perintah-hasil tanpa memastikan apakah bentuk tersebut harus dibaca sebagai perintah mandiri atau semata-mata akibat mekanis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif yang bermartabat. Pengulangan terakhir 'di tanah Mesir' dipertahankan karena terdapat dalam teks Ibrani dan menegaskan cakupan. Penanda catatan kaki ditempatkan langsung setelah frasa yang diterangkan.
