language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הַשְׁכֵּ֣ם בַּ/בֹּ֔קֶר וְ/הִתְיַצֵּ֖ב לִ/פְנֵ֣י פַרְעֹ֑ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/009/013.yaml
  text: 'Then Yahweh said to Moses[a], “Rise early in the morning and present yourself before Pharaoh, and say to him, ‘Thus says Yahweh, the God of the Hebrews: Let my people go, so that they may serve me.’”'
translation:
  language: id
  text: 'Kemudian Yahweh berfirman kepada Musa, “Bangunlah pagi-pagi, berdirilah di hadapan Firaun, dan katakan kepadanya, ‘Beginilah firman Yahweh, Allah orang Ibrani: Biarkan umat-Ku pergi supaya mereka melayani-Ku.[a]’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “beribadah kepada-Ku.” Kata Ibrani yang dipakai dapat berarti melayani Allah, termasuk beribadah kepada-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan membedakannya dari gelar seperti Tuhan.
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: Bangunlah pagi-pagi
  rationale: Mengungkapkan perintah untuk bangun dini hari secara alami tanpa mengulang keterangan waktu.
- source_word: וְהִתְיַצֵּב לִפְנֵי
  choice: berdirilah di hadapan
  rationale: Mempertahankan gambaran mengambil posisi atau tampil di hadapan seseorang, sekaligus sesuai dengan suasana resmi ketika Musa menghadap Firaun.
- source_word: כֹּה אָמַר
  choice: Beginilah firman
  rationale: Merupakan rumusan utusan ilahi yang formal dan lazim dalam bahasa Indonesia Alkitabiah modern.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: Allah orang Ibrani
  rationale: Menerjemahkan rangkaian konstruksi Ibrani secara langsung dan alami.
- source_word: שַׁלַּח אֶת עַמִּי
  choice: Biarkan umat-Ku pergi
  rationale: Menyampaikan tuntutan pelepasan dengan jelas; 'umat-Ku' mempertahankan penanda kepunyaan dan nuansa umat perjanjian.
- source_word: וְיַעַבְדֻנִי
  choice: supaya mereka melayani-Ku
  rationale: Konjungsi dan bentuk verba menyatakan tujuan. 'Melayani' mempertahankan cakupan עבד yang meliputi pengabdian dan ibadah tanpa membatasinya hanya pada kegiatan ritual.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks memakai nama perjanjian secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama pribadi, bukan menggantinya dengan sebuah gelar.
- issue: Cakupan makna וְיַעַבְדֻנִי
  choice: supaya mereka melayani-Ku
  alternative: supaya mereka beribadah kepada-Ku
  rationale: '''Melayani'' menjaga makna luas pelayanan dan pengabdian kepada Allah, yang mencakup ibadah, tanpa mempersempitnya pada tindakan kultis saja.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'berfirman' serta formula 'Beginilah firman' mempertahankan suasana resmi, sedangkan susunan kalimat tetap mudah dipahami pembaca umum.
