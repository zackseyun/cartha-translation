translation:
  language: id
  text: Ia membuat batang-batang pengusung dari kayu akasia dan melapisinya dengan emas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia membuat
  rationale: Bentuk wayyiqtol Qal dari עשה meneruskan rangkaian narasi dengan arti 'dan ia membuat'. Dalam bahasa Indonesia, konjungsi awal tidak perlu diungkapkan agar narasi tetap alami.
- source_word: בַּדֵּי
  choice: kayu-kayu pengusung
  rationale: Dalam konteks perlengkapan Kemah Suci, בַּד menunjuk pada batang kayu yang dipakai untuk mengusung benda kudus. Pilihan ini jelas bagi pembaca modern dan membedakannya dari tiang yang ditegakkan.
- source_word: עֲצֵי שִׁטִּים
  choice: dari kayu akasia
  rationale: Rangkaian konstruksi ini menunjuk pada bahan yang berasal dari pohon akasia; 'kayu akasia' merupakan padanan Indonesia yang alami dan mudah dipahami.
- source_word: וַיְצַף
  choice: dan melapisinya
  rationale: Dalam konteks pengerjaan benda, צפה berarti menutupi permukaan dengan suatu bahan, yakni melapisinya. Akhiran '-nya' secara alami merujuk pada kayu-kayu pengusung yang jamak secara makna.
- source_word: אֹתָם
  choice: -nya
  rationale: Pronomina objek jamak maskulin merujuk kembali kepada kayu-kayu pengusung. Bahasa Indonesia lazim memakai enklitik '-nya' tanpa membedakan jumlah.
- source_word: זָהָב
  choice: dengan emas
  rationale: Emas adalah bahan pelapis; preposisi 'dengan' diperlukan untuk ungkapan Indonesia yang alami.
