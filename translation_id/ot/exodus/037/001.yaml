  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֧עַשׂ בְּצַלְאֵ֛ל אֶת הָ/אָרֹ֖ן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֨יִם וָ/חֵ֜צִי אָרְכּ֗/וֹ וְ/אַמָּ֤ה וָ/חֵ֨צִי֙ רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/001.yaml
  text: Bezalel made the ark of acacia wood. Its length was two and a half cubits[a], its width one and a half cubits, and its height one and a half cubits.
translation:
  language: id
  text: Bezalel membuat tabut[a] itu dari kayu akasia. Panjangnya dua setengah hasta, lebarnya satu setengah hasta, dan tingginya satu setengah hasta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “peti”. Kata Ibrani yang dipakai dapat merujuk secara umum kepada sebuah peti, tetapi dalam konteks Kemah Suci ini “tabut” adalah padanan yang paling tepat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: membuat
  rationale: Kata kerja עשה adalah istilah umum untuk membuat atau mengerjakan; “membuat” langsung, alami, dan tidak menambahkan nuansa yang tidak dinyatakan teks.
- source_word: בְּצַלְאֵל
  choice: Bezalel
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: הָאָרֹן
  choice: tabut itu
  rationale: אָרוֹן dapat berarti peti, tetapi dalam konteks Kemah Suci menunjuk kepada benda kudus yang secara konvensional disebut “tabut”. Unsur definit pada bahasa Ibrani diungkapkan secara alami dengan “itu”.
- source_word: עֲצֵי שִׁטִּים
  choice: dari kayu akasia
  rationale: Frasa konstruksi Ibrani ini secara idiomatis menunjuk kepada bahan pembuatannya, yaitu kayu akasia.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: dua setengah hasta
  rationale: Ukuran kuno אַמָּה dipertahankan sebagai “hasta”, istilah baku bahasa Indonesia, tanpa konversi yang dapat memberi kesan ketepatan modern yang tidak ada dalam teks.
- source_word: אָרְכּוֹ
  choice: panjangnya
  rationale: Bentuk bersufiks ini menyatakan ukuran panjang tabut secara langsung.
- source_word: וְאַמָּה וָחֵצִי
  choice: satu setengah hasta
  rationale: Ungkapan ini diterjemahkan dalam susunan bilangan yang alami dalam bahasa Indonesia.
- source_word: רָחְבּוֹ
  choice: lebarnya
  rationale: רֹחַב dalam konteks ukuran benda menunjuk kepada dimensi lebar.
- source_word: קֹמָתוֹ
  choice: tingginya
  rationale: קוֹמָה di sini menunjuk kepada dimensi vertikal benda, sehingga “tingginya” merupakan padanan kontekstual yang jelas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur tiga ukuran dipertahankan secara sejajar, dan satuan kuno “hasta” tidak dikonversi.
