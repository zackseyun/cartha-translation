    rationale: Dalam konteks ini טַבְּעֹת adalah cincin/fitting logam untuk memasukkan batang pengusung, bukan gelang perhiasan. 'Cincin emas' lebih tepat dan jelas.
  - severity: medium
    issue: '''kayu-kayu pengusung'' menambahkan spesifikasi bahan'
    rationale: בַדִּים berarti batang atau tongkat pengusung; ayat ini tidak menyebut bahan kayu. Tambahan ini sebaiknya dihindari demi kesetiaan pada teks.
  - severity: low
