base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/027.yaml
  text: And he made for it two rings of gold under its rim[a], on its two side frames, on its two sides[b], as holders for poles with which to carry it.
translation:
  language: id
  text: Ia membuat dua cincin emas untuk mezbah itu di bawah tepi hiasnya[a], pada kedua bagian sampingnya, pada kedua sisinya[b], sebagai tempat bagi batang-batang pengusung untuk mengusungnya dengan batang-batang itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di bawah lis hiasnya.” Kata Ibrani זֵר menunjuk pada tepi, bingkai, atau lis hias yang mengelilingi bagian atas.
    reason: lexical_alternative
  - marker: b
    text: 'Teks Ibrani mengulang dua ungkapan yang berhubungan: “pada kedua bagian sampingnya, pada kedua sisinya.” Terjemahan ini mempertahankan keduanya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁתֵּי טַבְּעֹת זָהָב
  choice: dua gelang emas
  rationale: טַבְּעֹת menunjuk pada gelang logam yang dipasang sebagai perlengkapan untuk pengusungan; konstruksi bahannya wajar diterjemahkan secara langsung sebagai 'gelang emas'.
- source_word: עָשָׂה לוֹ
  choice: Ia membuat ... untuk mezbah itu
  rationale: Akhiran pronominal mengacu pada mezbah yang sedang dibuat. Penyebutan eksplisit 'mezbah itu' memperjelas acuannya dalam bahasa Indonesia tanpa mengubah makna.
- source_word: מִתַּחַת לְזֵרוֹ
  choice: di bawah bingkainya
  rationale: זֵר dalam konteks perabot Kemah Suci adalah tepian atau lis hias yang mengelilingi bagian atas. 'Bingkai' merupakan padanan alami, dengan alternatif leksikal dicatat dalam catatan kaki.
- source_word: עַל שְׁתֵּי צַלְעֹתָיו
  choice: pada kedua bagian sampingnya
  rationale: צלע dapat berarti rusuk, sisi, atau bagian struktural di samping. 'Bagian samping' mempertahankan nuansa bagian struktural tanpa membuat bentuk benda itu terlalu spesifik.
- source_word: עַל שְׁנֵי צִדָּיו
  choice: pada kedua sisinya
  rationale: צד adalah istilah umum untuk sisi. Frasa ini tetap dipertahankan bersama frasa sebelumnya agar pengulangan dalam teks Ibrani tidak dihilangkan.
- source_word: לְבָתִּים לְבַדִּים
  choice: sebagai tempat memasukkan kayu-kayu pengusung
  rationale: בָּתִּים secara harfiah berarti 'rumah-rumah', tetapi di sini menunjuk pada tempat atau selongsong bagi batang pengusung. Ungkapan pilihan menjelaskan fungsi gelang tersebut secara alami.
- source_word: לָשֵׂאת אֹתוֹ בָּהֶם
  choice: untuk mengusungnya
  rationale: Infinitif menyatakan tujuan, sedangkan בָּהֶם menunjuk pada sarana, yakni kayu-kayu pengusung yang baru disebutkan. Bahasa Indonesia tidak perlu mengulang 'dengan kayu-kayu itu'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ia' mengikuti gaya naratif kitab ini; 'kayu-kayu pengusung' dipilih sebagai istilah konkret dan mudah dipahami. Pengulangan spasial teks sumber sengaja dipertahankan.
