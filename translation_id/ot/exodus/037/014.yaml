  text: Cincin-cincin itu berada di dekat bingkai, sebagai tempat bagi tongkat-tongkat pengusung untuk membawa meja itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְעֻמַּת הַמִּסְגֶּרֶת
  choice: di dekat bingkai
  rationale: Dalam konteks penempatan cincin pada meja, frasa ini menunjukkan posisi cincin berdekatan dengan bingkai; pilihan ini alami dalam bahasa Indonesia dan tidak memaksakan arti geometris 'berhadapan dengan'.
- source_word: בָּתִּים לַבַּדִּים
  choice: tempat memasukkan kayu-kayu pengusung
  rationale: Secara harfiah berarti 'rumah/tempat bagi kayu-kayu pengusung'; ungkapan Indonesia ini menjelaskan fungsi cincin secara konkret tanpa menambah gagasan baru.
- source_word: לָשֵׂאת אֶת־הַשֻּׁלְחָן
  choice: untuk mengangkut meja itu
  rationale: Menyampaikan tujuan kayu pengusung dengan verba Indonesia yang wajar; 'meja itu' mempertahankan penandaan objek tertentu.
