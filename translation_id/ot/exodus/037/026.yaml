  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְצַ֨ף אֹת֜/וֹ זָהָ֣ב טָה֗וֹר אֶת גַּגּ֧/וֹ וְ/אֶת קִירֹתָ֛י/ו סָבִ֖יב וְ/אֶת קַרְנֹתָ֑י/ו וַ/יַּ֥עַשׂ ל֛/וֹ זֵ֥ר זָהָ֖ב סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/026.yaml
  text: He overlaid it with pure gold—its top[a], its sides all around, and its horns—and he made for it a gold molding all around.
translation:
  language: id
  text: Ia melapisinya dengan emas murni—bagian atasnya, sisi-sisinya di sekeliling, dan tanduk-tanduknya—lalu membuat bingkai emas di sekelilingnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mahkota emas di sekelilingnya.” Istilah Ibrani ini menunjuk pada tepian atau jalur hias yang mengelilingi benda tersebut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַף
  choice: melapisinya
  rationale: Dalam konteks pembuatan perlengkapan Kemah Suci, verba צפה menunjuk pada pelapisan benda kayu dengan logam; “melapisi” merupakan padanan Indonesia yang alami dan tepat.
- source_word: זָהָב טָהוֹר
  choice: emas murni
  rationale: Ungkapan ini menyatakan mutu atau kemurnian emas secara langsung dan idiomatis.
- source_word: גַּגּוֹ
  choice: bagian atasnya
  rationale: Walaupun גג biasanya dapat berarti “atap”, pada mazbah kecil kata ini menunjuk pada permukaan atasnya; “bagian atas” lebih alami dalam bahasa Indonesia.
- source_word: קִירֹתָיו
  choice: sisi-sisinya
  rationale: Secara harfiah kata ini dapat berarti “dinding-dindingnya”, tetapi untuk sebuah perlengkapan portabel, “sisi-sisinya” lebih wajar dan tetap menunjuk pada permukaan tegaknya.
- source_word: סָבִיב
  choice: di sekeliling
  rationale: Padanan ini menyampaikan cakupan yang mengitari seluruh benda dengan jelas dan alami.
- source_word: קַרְנֹתָיו
  choice: tanduk-tanduknya
  rationale: Istilah kultis bagi tonjolan pada sudut-sudut mazbah dipertahankan secara harfiah sesuai terminologi perlengkapan ibadah dalam Alkitab.
- source_word: זֵר
  choice: bingkai
  rationale: Kata ini menunjuk pada tepian atau jalur hias yang mengelilingi benda. “Bingkai” mudah dipahami dalam bahasa Indonesia, sedangkan padanan tradisional “mahkota” dapat disalahpahami sebagai penutup kepala kerajaan dan karena itu dicatat sebagai alternatif.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Susunan unsur yang dilapisi dipertahankan, demikian pula istilah kultis “tanduk-tanduk”. Penanda catatan kaki ditempatkan sesudah “bingkai emas di sekelilingnya” karena catatan menjelaskan istilah זֵר, bukan גַּגּוֹ.
