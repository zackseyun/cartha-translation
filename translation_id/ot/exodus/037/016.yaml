base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/016.yaml
  text: 'He made the utensils that were on the table: its plates[a], its cups, its pitchers, and its bowls with which the drink offering was poured out, of pure gold.'
translation:
  language: id
  text: 'Ia membuat perlengkapan yang ada di atas meja itu dari emas murni: pinggan-pinggannya[a], cawan-cawannya, kendi-kendinya, dan mangkuk-mangkuknya untuk menuangkan persembahan minuman.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pinggan-pinggannya, mangkuk-mangkuk kecilnya, kendi-kendinya, dan mangkuk-mangkuknya.” Beberapa istilah untuk wadah dalam ayat ini langka atau khusus pada konteks ini, sehingga padanan tepatnya tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּלִים
  choice: perlengkapan
  rationale: Istilah ini mencakup berbagai alat atau wadah. “Perlengkapan” alami dalam bahasa Indonesia dan sesuai dengan daftar benda-benda meja yang mengikutinya.
- source_word: אֲשֶׁר עַל הַשֻּׁלְחָן
  choice: yang ada di atas meja itu
  rationale: Mempertahankan arti langsung frasa Ibrani, yakni benda-benda yang berada di atas meja, tanpa mempersempitnya menjadi sekadar benda yang dibuat untuk meja.
- source_word: קְעָרֹתָיו
  choice: pinggan-pinggannya
  rationale: קְעָרָה menunjuk pada pinggan atau wadah ceper; “pinggan” sesuai dengan konteks perlengkapan meja dan tetap mudah dipahami.
- source_word: כַּפֹּתָיו
  choice: cawan-cawannya
  rationale: Dalam konteks perlengkapan Kemah Suci, kata ini tampaknya menunjuk pada wadah kecil. “Cawan” memberikan padanan yang konkret tanpa mengklaim bentuk yang terlalu pasti.
- source_word: מְנַקִּיֹּתָיו
  choice: kendi-kendinya
  rationale: Istilah langka ini tampaknya menunjuk pada wadah untuk menampung atau menuang cairan. “Kendi” merupakan padanan modern yang wajar, tetapi ketidakpastian tepatnya dicatat dalam catatan kaki.
- source_word: הַקְּשָׂוֹת
  choice: mangkuk-mangkuknya
  rationale: Kata ini menunjuk pada jenis wadah lain yang berkaitan dengan pencurahan. “Mangkuk” jelas bagi pembaca modern, sementara catatan kaki mengakui bahwa bentuk tepat wadah itu tidak pasti.
- source_word: אֲשֶׁר יֻסַּךְ בָּהֵן
  choice: yang digunakan untuk mencurahkan persembahan curahan
  rationale: Ungkapan ini menyampaikan fungsi kultis verba נסך secara alami dalam bahasa Indonesia. Bentuk pasif Ibrani dialihkan menjadi konstruksi fungsi agar tidak menghasilkan pengulangan yang kaku seperti “persembahan curahan dicurahkan”.
- source_word: זָהָב טָהוֹר
  choice: dari emas murni
  rationale: Frasa bahan ditempatkan lebih awal dalam kalimat Indonesia agar jelas bahwa semua perlengkapan yang didaftarkan dibuat dari emas murni.
