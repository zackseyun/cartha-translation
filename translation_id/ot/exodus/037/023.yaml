translation:
  language: id
  text: Ia membuat ketujuh pelitanya, penjepit-penjepitnya[a], dan baki-bakinya[b] dari emas murni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sepit-sepit.” Istilah Ibrani ini menunjuk kepada perkakas pelita untuk menangani sumbu.
    reason: lexical_alternative
  - marker: b
    text: Atau “wadah-wadah bara.” Dalam konteks ini, istilah tersebut kemungkinan menunjuk kepada wadah atau baki kecil yang berkaitan dengan kandil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia membuat
  rationale: Bentuk wayyiqtol dari עשה melanjutkan narasi; dalam bahasa Indonesia modern, alurnya wajar disampaikan dengan verba sederhana tanpa harus menerjemahkan וַ secara tersendiri.
- source_word: נֵרֹתֶיהָ שִׁבְעָה
  choice: ketujuh pelitanya
  rationale: נֵרוֹת berarti pelita, bukan kaki pelita. Sufiks feminin tunggal merujuk kepada kaki pelita dalam konteks, dan bentuk 'ketujuh pelitanya' alami serta mempertahankan jumlahnya.
- source_word: מַלְקָחֶיהָ
  choice: sepit-sepitnya
  rationale: Istilah ini menunjuk kepada perkakas untuk menangani sumbu pelita. 'Sepit' cukup konkret dan tidak membatasi fungsinya hanya pada pemadaman atau pemotongan sumbu.
- source_word: מַחְתֹּתֶיהָ
  choice: baki-bakinya
  rationale: Dalam konteks perlengkapan kaki pelita, istilah ini menunjuk kepada wadah kecil atau baki yang terkait dengan perawatan pelita. 'Baki' menghindari kesan bahwa benda ini pasti perbaraan mezbah, sambil mempertahankan makna wadah yang konkret.
- source_word: זָהָב טָהוֹר
  choice: dari emas murni
  rationale: Frasa bahan ini secara alami menyatakan bahwa pelita beserta perkakasnya dibuat dari emas murni.
