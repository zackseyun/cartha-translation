translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Bentuk jamak ulang dipakai untuk mencerminkan nomina-nomina jamak Ibrani, sedangkan sufiks -nya mempertahankan hubungan semua benda itu dengan kaki pelita yang disebut dalam konteks.
