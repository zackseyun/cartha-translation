  text: He made the altar of incense of acacia wood. Its length was one cubit[a], and its width one cubit—it was square—and its height was two cubits. Its horns were of one piece with it.
translation:
  language: id
  text: Ia membuat mezbah dupa[a] dari kayu akasia. Panjangnya satu hasta dan lebarnya satu hasta—bentuknya persegi—dan tingginya dua hasta. Tanduk-tanduknya merupakan satu kesatuan dengan mezbah itu.
  philosophy: optimal-equivalence
  footnotes:
