  yaml_path: translation/ot/exodus/037/007.yaml
  text: He made two cherubim of gold; he made them of hammered work[a], from the two ends of the mercy seat.
translation:
  language: id
  text: Ia membuat dua kerub dari emas tempaan; ia membuat keduanya dari kedua ujung tutup pendamaian[a] itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yakni, penutup tabut. Istilah Ibrani ini berkaitan dengan pendamaian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia membuat
  rationale: Bentuk naratif ini melanjutkan urutan tindakan. Dalam bahasa Indonesia modern, alur tersebut dapat disampaikan secara alami tanpa selalu menerjemahkan waw dengan “dan” atau “lalu”.
- source_word: שְׁנֵי כְרֻבִים
  choice: dua kerub
  rationale: “Kerub” adalah bentuk serapan yang lazim dalam bahasa Indonesia untuk makhluk surgawi yang digambarkan pada perlengkapan Kemah Suci.
- source_word: זָהָב
  choice: dari emas
  rationale: Kata benda ini menyatakan bahan pembuatan kedua kerub.
- source_word: מִקְשָׁה
  choice: dengan ditempa
  rationale: Istilah ini menunjuk pada pengerjaan logam dengan cara ditempa. Pilihan ini mempertahankan cara pembuatannya tanpa mempersempit makna menjadi “dari satu bagian,” yang merupakan implikasi kontekstual.
- source_word: עָשָׂה אֹתָם
  choice: ia membuat keduanya
  rationale: Pengulangan kata kerja עשה dipertahankan untuk mencerminkan penekanan teks sumber pada pembuatan dan cara pengerjaannya.
- source_word: מִשְּׁנֵי קְצוֹת
  choice: dari kedua ujung
  rationale: Preposisi מִן menyatakan asal atau titik tempat kerub-kerub itu muncul sebagai bagian dari penutup tersebut, bukan sekadar lokasinya.
- source_word: הַכַּפֹּרֶת
  choice: tutup pendamaian
  rationale: Istilah ini menunjuk pada penutup emas tabut dan berkaitan secara leksikal serta ritual dengan pendamaian. “Tutup pendamaian” transparan, alami, dan sesuai dengan fungsi benda tersebut.
theological_decisions:
- issue: Terjemahan הַכַּפֹּרֶת dalam konteks Kemah Suci
  choice: tutup pendamaian
  alternative: tutup tabut; takhta belas kasihan
  rationale: Teks menunjuk pada penutup tabut tempat kedua kerub dibuat. “Tutup pendamaian” mempertahankan hubungan istilah itu dengan pendamaian tanpa mengubah benda tersebut menjadi kursi atau takhta secara eksplisit. Catatan kaki menjelaskan rujukan konkretnya dan tidak menetapkan penafsiran doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan “membuat” dipertahankan karena terdapat dalam teks Ibrani. Frasa “dengan ditempa” menyampaikan teknik pengerjaan logam secara wajar bagi pembaca umum.
