  text: one cherub from one end on this side[a], and one cherub from one end on that side; from the mercy seat he made the cherubim on its two ends.
translation:
  language: id
  text: Ia membuat satu kerub dari ujung yang satu dan satu kerub dari ujung yang lain; dari tutup pendamaian[a] itu Ia membuat kerub-kerub itu pada kedua ujungnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tutup”; Ibrani kapporet, yaitu tutup emas pada tabut.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרוּב
  choice: kerub
  rationale: Istilah baku bahasa Indonesia untuk makhluk penjaga takhta yang dikaitkan dengan tabut; mempertahankan rujukan khusus tanpa parafrasa spekulatif.
- source_word: מִקָּצָה מִזֶּה ... מִקָּצָה מִזֶּה
  choice: pada ujung yang satu ... pada ujung yang lain
  rationale: Ungkapan berpasangan ini menunjuk kedua ujung yang berlawanan. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan pembedaan ruangnya.
- source_word: הַכַּפֹּרֶת
  choice: tutup pendamaian
  rationale: Istilah ini menunjuk tutup emas tabut dalam konteks ibadah. 'Tutup pendamaian' mempertahankan baik bentuk bendanya maupun hubungan kultisnya, sedangkan alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: עָשָׂה
  choice: ia membuat
  rationale: Kata kerja umum ini secara langsung berarti 'membuat'. Subjek tersirat dinyatakan agar kalimat Indonesia dapat berdiri dengan jelas.
- source_word: מִשְּׁנֵי קצוותיו
  choice: pada kedua ujungnya
  rationale: Frasa ini menyatakan letak kedua kerub pada dua ujung tutup pendamaian; 'pada' paling alami untuk hubungan ruang tersebut.
theological_decisions:
- issue: Penerjemahan הַכַּפֹּרֶת dalam konteks Kemah Suci
  choice: tutup pendamaian
  alternative: tutup; tutup pengampunan
  rationale: Kata ini adalah istilah khusus bagi tutup tabut dan memiliki kaitan dengan ritus pendamaian. Terjemahan utama mempertahankan kedua unsur itu tanpa menetapkan penafsiran teologis yang lebih sempit; alternatif harfiah dicantumkan demi transparansi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan berulang dipertahankan karena mencerminkan penekanan sumber pada kedua kerub dan kedua ujung, sementara preposisi disesuaikan agar alami dalam bahasa Indonesia.
