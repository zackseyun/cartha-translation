  text: Their buds and their branches were of one piece with it[c][b][a]; all of it was one hammered work of pure gold.
translation:
  language: id
  text: Kuncup-kuncupnya[a] dan cabang-cabangnya dibentuk menjadi satu dengan kandil itu[b]; seluruh kandil itu adalah satu karya tempaan[c] dari emas murni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “hiasan-hiasan bulatnya” atau “tombol-tombolnya.” Istilah Ibrani ini menunjuk pada unsur hias berbentuk bulat, yang di sini tampaknya memakai gambaran tumbuhan.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “berasal darinya.” Maksudnya, kuncup-kuncup dan cabang-cabang itu dibuat sebagai bagian yang menyatu dengan kandil.'
    reason: lexical_alternative
  - marker: c
    text: 'Dapat juga diterjemahkan: “satu bagian yang ditempa” atau “ditempa dari satu bagian.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפְתֹּרֵיהֶם
  choice: kuncup-kuncupnya
  rationale: Dalam gambaran kandil, כַּפְתּוֹר menunjuk pada hiasan bulat yang terkait dengan bentuk tumbuhan. “Kuncup-kuncup” menyampaikan citra tersebut secara alami, sementara kemungkinan arti “tombol-tombol” dicatat dalam catatan kaki.
- source_word: וּקְנֹתָם
  choice: dan cabang-cabangnya
  rationale: קָנֶה secara dasar dapat berarti buluh atau tangkai, tetapi dalam konteks kandil menunjuk pada lengan-lengan yang mencabang; “cabang-cabang” merupakan padanan Indonesia yang paling jelas dan wajar.
- source_word: מִמֶּנָּה הָיוּ
  choice: menyatu dengan kandil itu
  rationale: Secara harfiah ungkapan ini berarti “berasal darinya”; dalam konteks pengerjaan logam, maksudnya ialah bahwa kuncup dan cabang dibentuk sebagai bagian integral dari kandil, bukan dipasang terpisah.
- source_word: כֻּלָּהּ
  choice: seluruh kandil itu
  rationale: Akhiran feminin tunggal mengacu kepada kandil sebagai keseluruhan. Penyebutan ulang “kandil” memperjelas acuannya dalam bahasa Indonesia.
- source_word: מִקְשָׁה אַחַת
  choice: satu kesatuan hasil tempaan
  rationale: מִקְשָׁה menyatakan benda logam yang dibentuk dengan ditempa, sedangkan אַחַת menekankan kesatuannya. Rumusan ini menyampaikan baik cara pengerjaan maupun konstruksi yang utuh.
- source_word: זָהָב טָהוֹר
  choice: emas murni
  rationale: Padanan baku dan tepat bagi keterangan bahan dalam konteks perlengkapan Kemah Suci.
