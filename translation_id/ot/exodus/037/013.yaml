lexical_decisions:
- source_word: וַיִּצֹק
  choice: menuang
  rationale: Dalam konteks pengerjaan logam, verba ini menunjuk pada penuangan logam cair ke dalam cetakan. Bahasa Indonesia secara alami dapat memakai “menuang” tanpa menghilangkan konteks pembuatan gelang emas.
- source_word: לוֹ
  choice: untuk meja itu
  rationale: Pronomina ini merujuk kepada meja pada konteks sebelumnya; penyebutan eksplisit menghindari ketidakjelasan dalam bahasa Indonesia.
- source_word: טַבְּעֹת זָהָב
  choice: gelang emas
  rationale: “Gelang” merupakan istilah yang jelas untuk cincin atau simpai logam tempat kayu pengusung dimasukkan, sedangkan “emas” mempertahankan bahan yang disebutkan.
- source_word: וַיִּתֵּן
  choice: memasang
  rationale: Dalam konteks perlengkapan perabot, “memasang” lebih alami dan tepat daripada terjemahan umum “menaruh”, karena gelang-gelang itu ditempatkan sebagai bagian tetap pada meja.
- source_word: עַל אַרְבַּע הַפֵּאֹת
  choice: pada keempat sudut
  rationale: פֵּאָה menunjuk pada ujung atau sudut; “keempat sudut” paling sesuai dengan bentuk meja dan penempatan empat gelang.
- source_word: אֲשֶׁר לְאַרְבַּע רַגְלָיו
  choice: di dekat keempat kakinya
  rationale: Frasa ini menghubungkan sudut-sudut tersebut dengan empat kaki meja. “Di dekat” menyampaikan hubungan lokatif tanpa memaksakan bahwa sudut-sudut itu merupakan milik kaki-kaki tersebut.
