source:
  edition: WLC
  text: וַ/יַּ֜עַשׂ אֶת שֶׁ֤מֶן הַ/מִּשְׁחָה֙ קֹ֔דֶשׁ וְ/אֶת קְטֹ֥רֶת הַ/סַּמִּ֖ים טָה֑וֹר מַעֲשֵׂ֖ה רֹקֵֽחַ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/029.yaml
  text: He made the holy anointing oil and the pure fragrant incense[b][a], the work of a perfumer.
translation:
  language: id
  text: Ia membuat minyak urapan kudus dan dupa harum yang murni[a], buatan seorang peracik wewangian[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dupa dari rempah-rempah” atau “dupa berbumbu harum.” Ungkapan Ibrani secara harfiah merujuk pada dupa yang dibuat dari bahan-bahan aromatik.
    reason: lexical_alternative
  - marker: b
    text: Atau “hasil racikan seorang peracik wewangian.” Frasa Ibrani menonjolkan pengolahan terampil oleh seorang ahli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia membuat
  rationale: Bentuk wayyiqtol dari עשה menyatakan tindakan lampau dalam rangkaian narasi. “Ia membuat” alami dalam bahasa Indonesia dan tidak perlu menambahkan penghubung yang tidak diperlukan.
- source_word: שֶׁמֶן הַמִּשְׁחָה קֹדֶשׁ
  choice: minyak urapan kudus
  rationale: Frasa ini menunjuk pada minyak untuk pengurapan yang dikhususkan bagi penggunaan sakral. Pilihan ini ringkas, jelas, dan mempertahankan istilah kultis “kudus”.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: dupa harum
  rationale: Secara harfiah ungkapan ini merujuk pada dupa yang dibuat dari bahan-bahan aromatik. “Dupa harum” menyampaikan unsur aromatik dengan bahasa Indonesia yang alami, sementara alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: טָהוֹר
  choice: yang murni
  rationale: Dalam konteks bahan kultis, טָהוֹר menyatakan kemurnian. Bentuk relatif “yang murni” secara jelas menerangkan dupa.
- source_word: מַעֲשֵׂה רֹקֵחַ
  choice: buatan seorang peracik wewangian
  rationale: Ungkapan nominal ini menekankan hasil kerja terampil seorang ahli yang meramu bahan-bahan harum. “Peracik wewangian” lebih tepat dalam konteks ini daripada “pembuat parfum” dan tetap mudah dipahami.
