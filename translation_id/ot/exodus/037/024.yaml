  yaml_path: translation/ot/exodus/037/024.yaml
  text: He made it and all its utensils from a talent of pure gold[a].
translation:
  language: id
  text: Ia membuat kandil itu dan segala perlengkapannya dari satu talenta emas murni.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “segala perkakasnya”, “segala wadahnya”, atau “segala bendanya”. Kata Ibrani כֵּלִים mencakup berbagai benda atau alat yang berkaitan dengan kandil.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּכָּר
  choice: satu talenta
  rationale: Dalam konteks pembuatan Kemah Suci, kata ini menunjuk pada satuan berat. Bentuk “talenta” mempertahankan ukuran kuno tanpa mengubahnya menjadi perkiraan modern.
- source_word: זָהָב טָהוֹר
  choice: emas murni
  rationale: Ungkapan ini secara alami menyatakan mutu atau kemurnian bahan emas dalam konteks pengerjaan benda kudus.
- source_word: עָשָׂה
  choice: Ia membuat
  rationale: Kata kerja umum ini berarti “membuat”; pilihan langsung tersebut sesuai dengan uraian pengerjaan kandil.
- source_word: אֹתָהּ
  choice: kandil itu
  rationale: Pronomina feminin tunggal mengacu kepada kandil dalam konteks sebelumnya. Penyebutan ulang membuat rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: וְאֵת כָּל כֵּלֶיהָ
  choice: dan segala perlengkapannya
  rationale: כֵּלִים merupakan istilah luas untuk benda, perkakas, atau wadah yang terkait. “Perlengkapannya” mempertahankan keluasan makna dan cocok untuk benda-benda yang menyertai kandil.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. “Kandil” dipakai sebagai rujukan kontekstual kepada benda feminin yang disebut sebelumnya; “talenta” dipertahankan sebagai satuan berat kuno. Penanda catatan kaki ditempatkan setelah kalimat.
