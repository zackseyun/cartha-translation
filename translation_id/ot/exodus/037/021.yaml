  text: and a bulb under two branches from it[a], and a bulb under two branches from it, and a bulb under two branches from it, for the six branches coming out from it.
translation:
  language: id
  text: Ada satu bonggol di bawah dua cabang yang keluar darinya,[a] satu bonggol di bawah dua cabang yang keluar darinya, dan satu bonggol di bawah dua cabang yang keluar darinya—untuk keenam cabang yang keluar darinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bulatan”; kata Ibrani כפתר menunjuk pada unsur hias berbentuk bulat pada kaki pelita.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַפְתֹּר
  choice: bonggol
  rationale: Dalam uraian kaki pelita, kata ini menunjuk pada unsur hias berbentuk bulat. “Bonggol” menyampaikan bentuk yang menonjol dan membulat dengan bahasa Indonesia yang wajar; kemungkinan lain dicatat dalam catatan kaki.
- source_word: תַּחַת
  choice: di bawah
  rationale: Padanan langsung dan alami untuk posisi bonggol terhadap setiap pasangan cabang.
- source_word: שְׁנֵי הַקָּנִים
  choice: pasangan cabang
  rationale: Secara harfiah berarti “dua cabang”. Dalam susunan kaki pelita, tiap bonggol berada di bawah dua cabang yang berpasangan; “pasangan cabang” membuat hubungan distributif itu jelas tanpa mengubah acuannya.
- source_word: מִמֶּנָּה
  choice: yang keluar darinya
  rationale: Pronomina feminin tunggal mengacu kepada kaki pelita. Bentuk “darinya” mempertahankan pronomina Ibrani tanpa menggantinya secara eksplisit dengan nomina acuannya.
- source_word: לְשֵׁשֶׁת הַקָּנִים
  choice: untuk keenam cabang
  rationale: Mempertahankan fungsi frasa penutup sebagai rangkuman yang menghubungkan ketiga bonggol dengan seluruh enam cabang samping.
- source_word: הַיֹּצְאִים מִמֶּנָּה
  choice: yang keluar darinya
  rationale: Menyampaikan gambaran cabang-cabang yang berasal dan menonjol dari kaki pelita dengan ungkapan Indonesia yang transparan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan pola Ibrani dipertahankan, tetapi “pertama”, “kedua”, dan “ketiga” ditambahkan untuk memperjelas bahwa yang dimaksud ialah tiga pasangan berbeda dari keenam cabang; tambahan ini bersifat implisit dalam susunan distributif ayat.
