  source_fidelity: 'Terjemahan secara setia menyampaikan semua unsur Ibrani: kerub bersayap terentang ke atas, menaungi kaporet dengan sayap, wajah saling berhadapan, dan wajah mengarah kepada kaporet. Penyebutan “kedua” selaras dengan konteks langsung pembuatan dua kerub (Kel. 37:7–8) dan tidak mengubah gambaran ayat.'
  naturalness: Bahasa Indonesia modern, jelas, dan cukup khidmat. “Membentangkan sayap mereka ke atas,” “menaungi,” serta “saling berhadapan” terdengar wajar. Pemisahan menjadi dua kalimat tetap mempertahankan hubungan dan penegasan paralel dalam teks sumber.
  terminology: “Kerub” merupakan istilah yang mapan, dan “tutup pendamaian” secara tepat menunjukkan benda kultis הַכַּפֹּרֶת tanpa menghilangkan alternatif leksikal melalui catatan kaki. “Menaungi” cocok untuk סֹכְכִים dan tidak menyiratkan penutupan total.
