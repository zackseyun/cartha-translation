  text: וַ/יִּהְי֣וּ הַ/כְּרֻבִים֩ פֹּרְשֵׂ֨י כְנָפַ֜יִם לְ/מַ֗עְלָ/ה סֹֽכְכִ֤ים בְּ/כַנְפֵי/הֶם֙ עַל הַ/כַּפֹּ֔רֶת וּ/פְנֵי/הֶ֖ם אִ֣ישׁ אֶל אָחִ֑י/ו אֶל הַ/כַּפֹּ֔רֶת הָי֖וּ פְּנֵ֥י הַ/כְּרֻבִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/009.yaml
  text: The cherubim had their wings spread upward[a], overshadowing the mercy seat with their wings, and their faces were toward one another; the faces of the cherubim were toward the mercy seat.
translation:
  language: id
  text: Kedua kerub itu membentangkan sayap mereka ke atas, menaungi tutup pendamaian[a] dengan sayap mereka. Wajah mereka saling berhadapan; wajah kedua kerub itu menghadap tutup pendamaian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “penutup.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכְּרֻבִים
  choice: kedua kerub itu
  rationale: Konteks menyebut dua sosok, dan “kerub” merupakan istilah serapan yang sudah dikenal dalam bahasa Indonesia. Bentuk ini lebih alami daripada mengulang bentuk jamak “kerub-kerub” dalam setiap penyebutan.
- source_word: פֹּרְשֵׂי כְנָפַיִם לְמַעְלָה
  choice: membentangkan sayap mereka ke atas
  rationale: Mengungkapkan postur sayap yang terentang ke arah atas dalam bahasa Indonesia yang alami, tanpa menghilangkan unsur arah לְמַעְלָה.
- source_word: סֹכְכִים
  choice: menaungi
  rationale: Kata ini menggambarkan sayap yang menutupi dari atas tanpa harus menyiratkan bahwa benda di bawahnya tertutup sama sekali.
- source_word: הַכַּפֹּרֶת
  choice: tutup pendamaian
  rationale: Menunjuk secara jelas pada tutup tabut sebagai benda kultis dan tetap mempertahankan kaitan istilah itu dengan pendamaian. Arti yang lebih harfiah, “penutup,” dicantumkan dalam catatan kaki.
- source_word: בְּכַנְפֵיהֶם
  choice: dengan sayap mereka
  rationale: 'Menerjemahkan beth instrumental secara alami: sayap merupakan sarana yang dipakai untuk menaungi tutup itu.'
- source_word: וּפְנֵיהֶם אִישׁ אֶל אָחִיו
  choice: Wajah mereka saling berhadapan
  rationale: Menyampaikan ungkapan timbal balik Ibrani “masing-masing kepada saudaranya” dengan jelas dan wajar dalam bahasa Indonesia.
- source_word: אֶל הַכַּפֹּרֶת הָיוּ פְּנֵי הַכְּרֻבִים
  choice: wajah kedua kerub itu menghadap tutup pendamaian
  rationale: Mempertahankan penyebutan eksplisit tentang wajah dan pengulangan “tutup pendamaian,” sebagaimana dalam teks Ibrani.
theological_decisions:
- issue: Penerjemahan הַכַּפֹּרֶת dalam konteks Kemah Suci
  choice: tutup pendamaian
  alternative: penutup
  rationale: “Penutup” adalah arti konkret yang lebih langsung, sedangkan “tutup pendamaian” mengenali fungsi kultis khusus benda tersebut. Catatan kaki menjaga transparansi leksikal tanpa memaksakan penafsiran doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Struktur paralel tentang arah wajah dipertahankan, tetapi susunan katanya dibuat alami bagi pembaca masa kini.
