base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/018.yaml
  text: 'And six branches were coming out from its sides: three branches of the lampstand from its one side[b][a], and three branches of the lampstand from its second side.'
translation:
  language: id
  text: 'Enam cabang menjulur dari sisi-sisinya: tiga cabang kandil dari sisinya yang satu[a], dan tiga cabang kandil dari sisinya yang kedua.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari sisinya yang satu ... dari sisinya yang kedua”; ungkapan ini juga dapat diterjemahkan “dari satu sisi ... dari sisi yang lain”.
    reason: lexical_alternative
lexical_decisions:
- source_word: קָנִים / קְנֵי
  choice: cabang
  rationale: Dalam konteks kandil Kemah Suci, kata ini menunjuk pada batang-batang yang bercabang dari batang utama. “Cabang” mempertahankan gambaran bentuknya dan wajar dalam bahasa Indonesia.
- source_word: יֹצְאִים
  choice: menjulur
  rationale: Partisip Ibrani ini menggambarkan keenam cabang yang keluar dan memanjang dari kandil. “Menjulur” menyampaikan arah keluar secara alami tanpa mengubahnya menjadi pernyataan statis.
- source_word: מִצִּדֶּיהָ / מִצִּדָּהּ
  choice: dari sisi-sisinya / dari sisinya
  rationale: צד berarti “sisi”. Terjemahan ini mempertahankan bentuk jamak pada pernyataan awal dan perincian masing-masing sisi sesudahnya.
- source_word: מְנֹרָה
  choice: kandil
  rationale: Dalam konteks perlengkapan Kemah Suci, “kandil” merupakan padanan Indonesia yang ringkas dan lazim bagi tempat lampu bercabang ini, tanpa memakai transliterasi “menorah”.
- source_word: הָאֶחָד
  choice: sisinya yang satu
  rationale: Ungkapan ini mempertahankan kepemilikan dan kontras berpasangan yang dinyatakan teks Ibrani.
- source_word: הַשֵּׁנִי
  choice: sisinya yang kedua
  rationale: שני secara harfiah berarti “kedua”. Pilihan ini mempertahankan kesejajaran formal dengan “yang satu”, meskipun bahasa Indonesia alami juga dapat mengatakan “sisi yang lain”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan kalimat mempertahankan pola perincian teks Ibrani, sedangkan “menjulur” mengungkapkan daya deskriptif partisip יֹצְאִים secara alami.
