  text: He cast for it four rings of gold on its four feet[c][b][a], with two rings on one side and two rings on the other side.
translation:
  language: id
  text: Ia menuang emas menjadi empat gelang untuk peti itu, pada keempat kakinya,[a] dua gelang pada sisi yang satu dan dua gelang pada sisi yang lain.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pada keempat sudutnya” atau “pada keempat penyangganya”; kata Ibrani yang dipakai dapat berarti kaki, bagian paling bawah, atau titik penyangga.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “pada sisinya yang satu ... pada sisinya yang kedua”; maksudnya, dua gelang pada masing-masing sisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצֹק
  choice: Ia menuang
  rationale: Dalam konteks pengerjaan logam, יצק menunjuk pada penuangan logam cair ke dalam cetakan; “menuang” alami dalam bahasa Indonesia dan mempertahankan gambaran prosesnya.
- source_word: לוֹ
  choice: untuk peti itu
  rationale: Akhiran pronominal merujuk pada peti yang dibuat dalam konteks sebelumnya; penyebutan eksplisit menghindari bentuk “untuknya” yang dapat terdengar merujuk kepada orang.
- source_word: טַבְּעֹת זָהָב
  choice: gelang emas
  rationale: Istilah ini menunjuk pada gelang/cincin pengait dari emas pada perabot Kemah Suci; “gelang emas” ringkas dan alami.
- source_word: פַּעֲמֹתָיו
  choice: keempat kakinya
  rationale: Kata ini dapat menunjuk pada kaki, ujung bawah, atau titik penyangga. “Kaki” merupakan padanan langsung yang sesuai dengan letak gelang pada bagian bawah peti, sementara ketidakpastian leksikal dicatat dalam catatan kaki.
- source_word: צַלְעוֹ
  choice: sisi
  rationale: Dalam uraian benda atau bangunan, צלע secara alami berarti sisi.
- source_word: הָאֶחָת ... הַשֵּׁנִית
  choice: sisi yang satu ... sisi yang lain
  rationale: Ungkapan ini tetap mencerminkan pasangan harfiah “yang satu ... yang kedua” tetapi lebih wajar dalam bahasa Indonesia.
