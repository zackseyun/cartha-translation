translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Subjek “Ia” dipertahankan sesuai bentuk verba Ibrani dan konteks Bezalel; “peti itu” dibuat eksplisit agar rujukan pronomina jelas. Semua penanda catatan kaki ditempatkan dalam teks utama.
