  text: He overlaid it with pure gold[a], and made for it a gold molding all around.
translation:
  language: id
  text: Ia melapisinya dengan emas murni dan membuat bingkai emas di sekelilingnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “lis emas”; secara tradisional: “mahkota emas.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַף אֹתוֹ
  choice: Ia melapisinya
  rationale: Kata kerja צפה dalam konteks pembuatan perlengkapan Kemah Suci menunjuk pada pelapisan benda dengan bahan logam; pronomina objek merujuk pada meja dalam ayat sebelumnya.
- source_word: זָהָב טָהוֹר
  choice: emas murni
  rationale: Ungkapan ini menyatakan emas berkadar tinggi; 'emas murni' merupakan padanan Indonesia yang alami dan tepat.
- source_word: וַיַּעַשׂ לוֹ
  choice: membuat ... di sekelilingnya
  rationale: Relasi לֹו dipertahankan secara alami melalui pronomina '-nya', yang menunjukkan bahwa bingkai itu dibuat untuk meja tersebut.
- source_word: זֵר זָהָב
  choice: bingkai emas
  rationale: זֵר di sini menunjuk pada tepian atau lis yang dibuat mengelilingi meja. 'Bingkai' mudah dipahami dalam bahasa Indonesia modern tanpa menghadirkan kesan mahkota kerajaan.
- source_word: סָבִיב
  choice: di sekelilingnya
  rationale: Padanan ini menyampaikan bahwa bingkai tersebut mengitari meja.
