  source_fidelity: Terjemahan dengan tepat merepresentasikan וַיְצַף sebagai pelapisan logam, זָהָב טָהוֹר sebagai “emas murni,” serta זֵר זָהָב סָבִיב sebagai bingkai/tepian emas yang mengelilingi meja. Pronomina pada “melapisinya” dan “sekelilingnya” jelas merujuk kepada meja dari ayat sebelumnya. Nuansa datif לּוֹ tersampaikan secara wajar melalui konstruksi bahwa bingkai itu dibuat mengelilingi benda tersebut.
