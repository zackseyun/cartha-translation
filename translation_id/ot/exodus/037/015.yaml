  text: Ia membuat tongkat-tongkat pengusung itu dari kayu akasia dan melapisinya dengan emas untuk membawa meja itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia membuat
  rationale: Bentuk wayyiqtol melanjutkan urutan tindakan dalam narasi. Dalam bahasa Indonesia, hubungan urutan itu dapat disampaikan secara alami tanpa harus menambahkan "dan" atau "kemudian".
- source_word: הַבַּדִּים
  choice: kayu-kayu pengusung itu
  rationale: בַּדִּים menunjuk pada batang-batang yang dipakai untuk mengusung perabot kudus. "Kayu pengusung" jelas, alami, dan membedakannya dari tiang bangunan.
- source_word: עֲצֵי שִׁטִּים
  choice: dari kayu akasia
  rationale: Frasa konstruksi ini secara idiomatis menyatakan bahan pembuatannya, yaitu kayu akasia.
- source_word: וַיְצַף אֹתָם זָהָב
  choice: dan melapisinya dengan emas
  rationale: Dalam konteks pengerjaan benda kudus, צפה berarti menutupi permukaan dengan lapisan logam. "Melapisinya dengan emas" merupakan padanan Indonesia yang tepat dan wajar.
- source_word: לָשֵׂאת
  choice: untuk mengangkut
  rationale: Infinitif berawalan ל menyatakan tujuan. "Mengangkut" dengan tepat menggambarkan pemindahan meja memakai kayu-kayu pengusung.
- source_word: הַשֻּׁלְחָן
  choice: meja itu
  rationale: Kata sandang Ibrani menunjuk pada meja yang telah disebut dan dikenal dalam konteks Kemah Suci; bentuk "meja itu" mempertahankan kekhususan tersebut.
