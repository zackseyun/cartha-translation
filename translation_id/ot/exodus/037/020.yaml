translation:
  language: id
  text: Pada kaki pelita itu ada empat cawan berbentuk bunga badam,[a] dengan bonggol-bonggolnya dan bunga-bunganya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “empat cawan berbentuk badam, dengan kenop-kenopnya dan bunga-bunganya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בַ/מְּנֹרָה
  choice: Pada kaki pelita itu ada
  rationale: Preposisi ב menandai lokasi pada benda tersebut. Dalam konteks perlengkapan Kemah Suci, “pada kaki pelita” menyatakan bahwa hiasan-hiasan itu merupakan bagian yang melekat padanya; “kaki pelita” adalah istilah Indonesia yang alami untuk מְנֹרָה.
- source_word: אַרְבָּעָה
  choice: empat
  rationale: Bilangan pokok yang menerangkan גְבִעִים.
- source_word: גְבִעִים
  choice: cawan
  rationale: Kata ini menunjuk pada unsur hias berbentuk wadah atau cawan; “cawan” mempertahankan bentuk benda secara jelas dan sesuai dengan konteks lampu.
- source_word: מְשֻׁקָּדִים
  choice: berbentuk bunga badam
  rationale: Partisip pasif ini menggambarkan cawan-cawan yang dibuat menurut pola bunga badam. Pilihan ini menyampaikan bentuk hiasannya secara alami tanpa menafsirkannya sekadar sebagai gambar yang ditempelkan.
- source_word: כַּפְתֹּרֶיהָ
  choice: kuncup
  rationale: Dalam uraian kaki pelita, istilah ini menunjuk pada tonjolan hias yang menyerupai bonggol atau kuncup. “Kuncup” cocok dengan citra tumbuhan, tetapi kemungkinan arti “bonggol” dipertahankan dalam catatan kaki.
- source_word: וּפְרָחֶיהָ
  choice: dan bunganya
  rationale: Kata ini berarti bunga atau kuntum bunga. Bentuk posesif feminin tunggal mengacu pada kaki pelita.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kaki pelita” dipakai sebagai istilah yang mudah dipahami untuk lampstand, sedangkan susunan kalimat dibuat alami sambil mempertahankan unsur-unsur hias dalam teks Ibrani. Kata “beserta” memperjelas hubungan appositional yang padat dalam bahasa Ibrani tanpa mengubah acuannya.
