  yaml_path: translation/ot/exodus/037/006.yaml
  text: He made the mercy seat of pure gold; its length was two and a half cubits[a], and its width a cubit and a half.
translation:
  language: id
  text: Ia membuat tutup pendamaian[a] dari emas murni, panjangnya dua setengah hasta dan lebarnya satu setengah hasta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “takhta pendamaian.” Istilah Ibrani ini menunjuk pada penutup emas tabut dan berkaitan dengan pendamaian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia membuat
  rationale: Bentuk wayyiqtol dari עשה menyatakan tindakan lampau yang berurutan; bahasa Indonesia dapat tidak menerjemahkan waw secara tersendiri agar narasi tetap alami.
- source_word: כַּפֹּרֶת
  choice: tutup pendamaian
  rationale: Istilah ini menunjuk pada penutup emas tabut yang berkaitan erat dengan ritus pendamaian. Pilihan ini lebih mudah dipahami pembaca modern daripada istilah tradisional yang dapat mengaburkan bahwa benda tersebut adalah penutup.
- source_word: זָהָב טָהוֹר
  choice: dari emas murni
  rationale: Ungkapan bahan diterjemahkan secara alami dengan preposisi 'dari'.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: dua setengah hasta
  rationale: Menyampaikan ukuran Ibrani secara idiomatis dengan mempertahankan satuan kuno.
- source_word: אָרְכָּהּ
  choice: panjangnya
  rationale: Pronomina sufiks mengacu kepada tutup pendamaian; bentuk '-nya' mempertahankan acuan itu secara ringkas.
- source_word: וְאַמָּה וָחֵצִי
  choice: dan ... satu setengah hasta
  rationale: Menerjemahkan ukuran harfiah satu hasta dan setengah secara alami dalam bahasa Indonesia.
- source_word: רָחְבָּהּ
  choice: lebarnya
  rationale: Padanan modern dan jelas bagi istilah dimensi lebar, dengan sufiks yang mengacu kepada tutup tersebut.
theological_decisions:
- issue: Penerjemahan כַּפֹּרֶת dalam konteks ibadah
  choice: tutup pendamaian
  alternative: tutup belas kasihan; penutup
  rationale: Pilihan ini mempertahankan fungsi bendanya sebagai penutup tabut sekaligus kaitannya dengan pendamaian, tanpa menyempitkannya menjadi sekadar penutup ataupun menambahkan klaim doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Satuan 'hasta' dipertahankan sebagai ukuran kuno yang lazim dalam terjemahan Alkitab; susunan ukuran dibuat alami tanpa menghilangkan rincian teks sumber.
