  text: He made for it a frame a handbreadth wide all around[b][a], and he made a gold molding around its frame.
translation:
  language: id
  text: Ia membuat bingkai[a] selebar satu telapak tangan di sekeliling meja itu, lalu membuat lis emas[b] di sekeliling bingkai itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pinggiran” atau “pembatas” untuk “bingkai.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara tradisional: “mahkota emas”; di sini “lis emas” menunjuk pada tepian hias di sekeliling bingkai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְגֶּרֶת
  choice: bingkai
  rationale: Kata ini menunjuk pada bagian pembatas atau rangka yang menyatu dengan meja. 'Bingkai' jelas dalam bahasa Indonesia modern dan sesuai dengan konteks konstruksi.
- source_word: טֹפַח
  choice: selebar satu telapak tangan
  rationale: Kata ini menyatakan satuan ukuran berdasarkan lebar telapak tangan. Penambahan 'selebar' menjelaskan hubungan ukurannya secara alami tanpa menambah gagasan baru.
- source_word: סָבִיב
  choice: di sekelilingnya
  rationale: Ungkapan ini menyatakan bahwa bingkai tersebut mengelilingi meja pada semua sisinya.
- source_word: זֵר
  choice: lis
  rationale: Dalam konteks perlengkapan Kemah Suci, kata ini menunjuk pada tepian hias. 'Lis' menyampaikan unsur tepian dekoratif dengan lebih tepat daripada terjemahan tradisional 'mahkota'.
- source_word: זָהָב
  choice: emas
  rationale: Nomina ini menyatakan bahan lis tersebut, yaitu emas.
- source_word: לְמִסְגַּרְתּוֹ
  choice: di sekeliling bingkainya
  rationale: Terjemahan ini mempertahankan akhiran posesif dan, bersama סָבִיב, menyatakan hubungan lis dengan bingkai serta letaknya yang mengelilingi bingkai itu.
