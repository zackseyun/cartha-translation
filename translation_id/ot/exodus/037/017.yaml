  yaml_path: translation/ot/exodus/037/017.yaml
  text: He made the lampstand of pure gold[a]. He made the lampstand of hammered work; its base and its shaft, its cups, its buds[b], and its blossoms were of one piece with it.
translation:
  language: id
  text: Ia membuat kaki pelita dari emas murni. Kaki pelita itu dibuatnya dengan ditempa[a]; alasnya, batangnya, cawan-cawannya, kuntum-kuntumnya[b], dan bunga-bunganya merupakan satu kesatuan dengannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebagai hasil tempaan.” Istilah Ibrani ini menunjuk pada logam yang dibentuk dengan ditempa.
    reason: lexical_alternative
  - marker: b
    text: Atau, “tombol-tombolnya.” Istilah Ibrani ini menunjuk pada tonjolan hias; “kuntum-kuntum” dipilih karena rancangan kaki pelita menyerupai tumbuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְּנֹרָה
  choice: kaki pelita
  rationale: Menunjuk pada penyangga pelita bercabang dalam perlengkapan Kemah Suci, bukan pada sebuah pelita saja. “Kaki pelita” tepat dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: זָהָב טָהוֹר
  choice: emas murni
  rationale: Dalam keterangan bahan, טָהוֹר menyatakan kemurnian atau pemurnian logam; “emas murni” merupakan padanan Indonesia yang alami.
- source_word: מִקְשָׁה
  choice: dari satu tempaan
  rationale: Istilah ini menggambarkan benda logam yang dibentuk dengan ditempa sebagai satu kesatuan, bukan dirakit dari bagian-bagian terpisah.
- source_word: יְרֵכָהּ
  choice: alasnya
  rationale: Walaupun arti dasarnya berkaitan dengan paha atau sisi, dalam konteks perlengkapan ini kata tersebut menunjuk pada bagian bawah yang menyangga kaki pelita.
- source_word: קָנָהּ
  choice: batangnya
  rationale: Bentuk tunggal ini menunjuk pada unsur struktural utama atau batang tengah kaki pelita.
- source_word: גְּבִיעֶיהָ
  choice: cawan-cawannya
  rationale: Menggambarkan unsur hias berbentuk cawan; padanan ini mempertahankan bentuk konkret istilah Ibrani.
- source_word: כַּפְתֹּרֶיהָ
  choice: kuntum-kuntumnya
  rationale: Kata ini menunjuk pada tonjolan hias seperti tombol. “Kuntum” dipilih karena rancangan kaki pelita memakai citra tumbuhan, sementara alternatif yang lebih netral dicatat dalam catatan kaki.
- source_word: פְרָחֶיהָ
  choice: bunga-bunganya
  rationale: Padanan langsung dan alami yang mempertahankan motif tumbuhan serta berpasangan dengan “kuntum-kuntumnya”.
- source_word: מִמֶּנָּה הָיוּ
  choice: menyatu dengannya
  rationale: Frasa ini menyatakan bahwa semua bagian tersebut berasal dari dan menjadi bagian integral kaki pelita, bukan dipasang secara terpisah.
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: Ia membuat ... dibuatnya
  rationale: Pengulangan verba עשה dipertahankan sambil memakai susunan yang alami dalam bahasa Indonesia.
