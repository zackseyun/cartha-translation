translation:
  language: id
  text: Ia memasukkan batang-batang pengusung itu ke dalam gelang-gelang pada sisi-sisi tabut itu untuk mengusung tabut itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֵא
  choice: memasukkan
  rationale: Dalam konstruksi ini, verba בוא menyatakan tindakan menempatkan kayu-kayu pengusung ke dalam gelang-gelang. “Memasukkan” menyampaikan gerakan tersebut secara alami dan tepat dalam bahasa Indonesia.
- source_word: הַבַּדִּים
  choice: kayu-kayu pengusung
  rationale: בַּדִּים menunjuk pada batang-batang yang digunakan untuk mengangkut perlengkapan kudus. “Kayu-kayu pengusung” jelas, wajar, dan sesuai dengan fungsi benda itu.
- source_word: בַּטַּבָּעֹת
  choice: ke dalam gelang-gelang
  rationale: Preposisi ב dalam konteks tindakan memasukkan menunjukkan penempatan di bagian dalam gelang. “Ke dalam” memperjelas hubungan fisiknya tanpa menambah makna.
- source_word: עַל צַלְעֹת הָאָרֹן
  choice: pada sisi-sisi tabut
  rationale: צְלָעוֹת dapat menunjuk pada sisi atau struktur samping. Dalam konteks tabut, “sisi-sisi” merupakan padanan yang alami dan cukup tepat.
- source_word: הָאָרֹן
  choice: tabut
  rationale: אָרוֹן di sini adalah peti kudus dalam perlengkapan Kemah Suci. “Tabut” merupakan istilah Indonesia yang mapan dalam konteks ini.
- source_word: לָשֵׂאת
  choice: untuk mengangkut
  rationale: Infinitif נשׂא menyatakan tujuan pemasangan kayu-kayu itu. “Untuk mengangkut” jelas dan idiomatis dalam bahasa Indonesia modern.
