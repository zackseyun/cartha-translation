  text: He overlaid it with pure gold[a], inside and outside, and made for it a surrounding border of gold.
translation:
  language: id
  text: Ia melapisinya dengan emas murni, pada bagian dalam dan luar, lalu membuat tepi emas di sekelilingnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "pelipit emas di sekelilingnya" atau "tepi emas yang mengelilinginya." Kata Ibrani זֵר menunjuk pada tepian hias yang mengelilingi benda tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַפֵּהוּ
  choice: Ia melapisinya
  rationale: Bentuk piel dari צפה dalam konteks pengerjaan ini menyatakan pelapisan suatu benda dengan logam; 'melapisi' tepat dan alami dalam bahasa Indonesia.
- source_word: זָהָב טָהוֹר
  choice: dengan emas murni
  rationale: Ungkapan ini menunjuk pada emas yang murni atau bersih; 'emas murni' merupakan padanan baku dan jelas.
- source_word: מִבַּיִת וּמִחוּץ
  choice: bagian dalam dan luarnya
  rationale: Pasangan ungkapan ini menunjuk pada kedua permukaan benda, yaitu sisi dalam dan sisi luar.
- source_word: וַיַּעַשׂ לוֹ
  choice: lalu membuat ... di sekelilingnya
  rationale: Pronomina pada לוֹ merujuk kepada benda tersebut. Dalam bahasa Indonesia, hubungan itu tersampaikan secara alami melalui 'di sekelilingnya' tanpa perlu mempertahankan bentuk harfiah 'membuat baginya'.
- source_word: זֵר זָהָב
  choice: bingkai emas
  rationale: Dalam konteks perabot Kemah Suci, זֵר menunjuk pada tepian hias yang mengelilingi benda. 'Bingkai emas' mudah dipahami dan tidak memberi kesan mahkota kerajaan.
- source_word: סָבִיב
  choice: di sekelilingnya
  rationale: Kata ini menegaskan bahwa bingkai tersebut mengitari benda itu.
