base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/019.yaml
  text: Three almond-blossom-shaped cups were on the one branch[a], with bulb and flower; and three almond-blossom-shaped cups were on one branch, with bulb and flower[b]. So it was for the six branches coming out from the lampstand.
translation:
  language: id
  text: Pada satu cabang terdapat tiga cawan berbentuk bunga badam[a], dengan bonggol[b] dan bunga; dan pada satu cabang terdapat tiga cawan berbentuk bunga badam, dengan bonggol dan bunga. Demikianlah pada keenam cabang yang keluar dari kaki pelita itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tiga cawan yang dibuat seperti bunga badam ... dan tiga cawan yang dibuat seperti bunga badam.”
    reason: lexical_alternative
  - marker: b
    text: “Bonggol” menunjuk pada hiasan bundar yang menonjol; dapat juga diterjemahkan “tombol”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבִעִים
  choice: cawan
  rationale: Kata ini menunjuk pada hiasan berbentuk wadah atau cawan pada kaki pelita. “Cawan” mempertahankan gambaran bentuk bendanya tanpa memakai istilah teknis yang kurang umum.
- source_word: מְשֻׁקָּדִים
  choice: berbentuk bunga badam
  rationale: Bentuk ini berkaitan dengan pohon badam dan, dalam uraian kaki pelita, menggambarkan cawan-cawan yang dibuat menyerupai bunga badam.
- source_word: קָנֶה
  choice: cabang
  rationale: Dalam konteks kaki pelita, kata ini menunjuk pada lengan yang menjulur dari batang utama. “Cabang” alami dalam bahasa Indonesia dan sesuai dengan citra tumbuhan pada rancangan tersebut.
- source_word: כַּפְתֹּר
  choice: bonggol
  rationale: Kata ini menunjuk pada hiasan bundar yang menonjol. “Bonggol” menyampaikan bentuk organik dan membulat dengan lebih jelas daripada “tombol”, yang dalam bahasa Indonesia modern sering diasosiasikan dengan alat pengendali.
- source_word: פֶרַח
  choice: bunga
  rationale: Kata ini berarti bunga atau hiasan bunga. “Bunga” merupakan padanan yang langsung, wajar, dan mudah dipahami.
- source_word: כֵּן
  choice: demikian juga
  rationale: Kata ini menerapkan pola yang baru saja dijelaskan kepada keenam cabang, sehingga “demikian juga” menyatakan pengulangan pola itu secara alami.
- source_word: הַיֹּצְאִים מִן הַמְּנֹרָה
  choice: yang keluar dari kaki pelita itu
  rationale: Ungkapan ini menggambarkan keenam cabang yang menjulur dari bagian utama kaki pelita; terjemahan ini mempertahankan citra sumber secara transparan.
- source_word: מְנֹרָה
  choice: kaki pelita
  rationale: Istilah benda umum ini diterjemahkan, bukan ditransliterasikan. “Kaki pelita” merupakan ungkapan Indonesia yang dikenal untuk penyangga lampu bercabang tersebut.
