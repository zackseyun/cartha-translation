  text: וַ/יַּ֥עַשׂ אֶת הַ/שֻּׁלְחָ֖ן עֲצֵ֣י שִׁטִּ֑ים אַמָּתַ֤יִם אָרְכּ/וֹ֙ וְ/אַמָּ֣ה רָחְבּ֔/וֹ וְ/אַמָּ֥ה וָ/חֵ֖צִי קֹמָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/037/010.yaml
  text: He made the table of acacia wood; its length was two cubits[a], its width one cubit, and its height one and a half cubits.
translation:
  language: id
  text: Ia membuat meja itu dari kayu akasia. Panjangnya dua hasta, lebarnya satu hasta, dan tingginya satu setengah hasta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia membuat
  rationale: Bentuk wayyiqtol menyatakan tindakan lampau berurutan. 'Ia membuat' alami dalam narasi Indonesia; konjungsi waw tidak perlu selalu diterjemahkan sebagai 'dan' pada awal ayat.
- source_word: הַשֻּׁלְחָן
  choice: meja itu
  rationale: Kata benda ini berarti 'meja'; artikel definit Ibrani disampaikan secara alami dengan 'itu', menunjuk pada meja yang telah diperintahkan sebelumnya.
- source_word: עֲצֵי שִׁטִּים
  choice: dari kayu akasia
  rationale: Frasa konstruksi ini secara idiomatis berarti kayu dari pohon akasia. Istilah modern 'kayu akasia' jelas dan tidak mempertahankan transliterasi kuno yang kurang dikenal.
- source_word: אַמָּתַיִם
  choice: dua hasta
  rationale: אַמָּה adalah satuan panjang kuno yang lazim diterjemahkan 'hasta' dalam bahasa Indonesia; bentuk dual menyatakan dua hasta.
- source_word: אָרְכּוֹ
  choice: panjangnya
  rationale: Nomina dengan sufiks orang ketiga maskulin tunggal merujuk pada panjang meja.
- source_word: וְאַמָּה רָחְבּוֹ
  choice: lebarnya satu hasta
  rationale: Frasa nominal ini memberikan ukuran lebar. Susunan Indonesia mempertahankan nilai ukur secara tepat dan alami.
- source_word: וְאַמָּה וָחֵצִי
  choice: satu setengah hasta
  rationale: Ungkapan harfiahnya 'satu hasta dan setengah'; 'satu setengah hasta' adalah bentuk Indonesia modern yang ringkas dengan nilai sama.
- source_word: קֹמָתוֹ
  choice: tingginya
  rationale: Dalam konteks dimensi sebuah benda, קוֹמָה menunjuk pada ukuran vertikal, yaitu tinggi.
