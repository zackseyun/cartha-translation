  text: Ia membuat tongkat-tongkat pengusung itu dari kayu akasia dan melapisinya dengan emas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia membuat
  rationale: Bentuk wayyiqtol Qal dari עשה menyatakan tindakan lampau dalam rangkaian narasi. Konjungsi waw tidak perlu diterjemahkan secara terpisah pada awal kalimat agar bahasa Indonesia tetap alami.
- source_word: הַבַּדִּים
  choice: kayu-kayu pengusung itu
  rationale: Dalam konteks perlengkapan Kemah Suci, בַּדִּים menunjuk pada batang-batang kayu yang digunakan untuk mengusung benda suci. Pilihan ini lebih jelas dan alami daripada 'batang-batang' saja.
- source_word: עֲצֵי שִׁטִּים
  choice: dari kayu akasia
  rationale: Frasa konstruksi ini menyatakan bahan pembuatannya, yaitu kayu akasia.
- source_word: וַיְצַף
  choice: lalu melapisinya
  rationale: Dalam konteks pengerjaan benda, צפה berarti menyalut atau melapisi permukaannya. 'Lalu' menyampaikan kelanjutan tindakan dalam bentuk wayyiqtol secara alami.
- source_word: אֹתָם
  choice: -nya
  rationale: Pronomina objek jamak ini merujuk kepada kayu-kayu pengusung. Bahasa Indonesia secara alami dapat memakai enklitik '-nya' tanpa menandai jumlah.
- source_word: זָהָב
  choice: dengan emas
  rationale: Emas adalah bahan yang digunakan untuk melapisi kayu-kayu pengusung tersebut; preposisi 'dengan' menyatakan bahan pelapis secara wajar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Istilah 'kayu-kayu pengusung' dipakai untuk menjelaskan fungsi benda tanpa menambahkan informasi yang tidak tersirat dalam konteks leksikal.
