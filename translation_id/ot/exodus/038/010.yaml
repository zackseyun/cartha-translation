  text: עַמּוּדֵי/הֶ֣ם עֶשְׂרִ֔ים וְ/אַדְנֵי/הֶ֥ם עֶשְׂרִ֖ים נְחֹ֑שֶׁת וָוֵ֧י הָ/עַמֻּדִ֛ים וַ/חֲשֻׁקֵי/הֶ֖ם כָּֽסֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/010.yaml
  text: Their pillars were twenty[a], and their twenty bases were bronze[b]; the hooks of the pillars and their bands were silver.
translation:
  language: id
  text: Tiang-tiangnya berjumlah dua puluh, dan kedua puluh alasnya terbuat dari perunggu; kait-kait pada tiang-tiang itu dan pengikat-pengikatnya terbuat dari perak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani yang diterjemahkan “pengikat-pengikat” mungkin menunjuk pada gelang, pita, atau batang penghubung yang terpasang pada tiang-tiang.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵיהֶם
  choice: tiang-tiangnya
  rationale: עַמּוּדִים menunjuk pada tiang struktural yang menopang tirai pelataran; akhiran pronominal dipertahankan secara alami dengan -nya.
- source_word: עֶשְׂרִים
  choice: dua puluh
  rationale: Bilangan pokok ini muncul dua kali dan diterjemahkan secara langsung.
- source_word: אַדְנֵיהֶם
  choice: alasnya
  rationale: Dalam konteks Kemah Suci, אֶדֶן adalah alas atau soket tempat tiang berdiri; 'alas' lebih mudah dipahami dalam bahasa Indonesia modern.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: נְחֹשֶׁת dapat berarti tembaga atau perunggu; 'perunggu' merupakan padanan kontekstual dan konvensional untuk perlengkapan Kemah Suci.
- source_word: וָוֵי הָעַמֻּדִים
  choice: kait-kait pada tiang-tiang itu
  rationale: וָוִים adalah kait atau perlengkapan penyambung yang terkait dengan tiang; frasa Indonesia ini menyatakan hubungan konstruksi Ibrani secara jelas.
- source_word: חֲשֻׁקֵיהֶם
  choice: pengikat-pengikatnya
  rationale: Istilah ini menunjuk pada unsur yang dipasang pada atau menghubungkan tiang-tiang. 'Pengikat' cukup luas untuk mempertahankan ketidakpastian bentuk bendanya tanpa memakai istilah teknis yang usang.
- source_word: כָּסֶף
  choice: perak
  rationale: Istilah bahan ini diterjemahkan secara langsung.
