  text: וְ/הָ/אֲדָנִ֣ים לָֽ/עַמֻּדִים֮ נְחֹשֶׁת֒ וָוֵ֨י הָֽ/עַמּוּדִ֜ים וַ/חֲשׁוּקֵי/הֶם֙ כֶּ֔סֶף וְ/צִפּ֥וּי רָאשֵׁי/הֶ֖ם כָּ֑סֶף וְ/הֵם֙ מְחֻשָּׁקִ֣ים כֶּ֔סֶף כֹּ֖ל עַמֻּדֵ֥י הֶ/חָצֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/017.yaml
  text: The bases for the pillars were bronze[a], and the hooks of the pillars and their bands were silver, and the overlay of their tops was silver[b]; all the pillars of the courtyard were banded with silver.
translation:
  language: id
  text: Alas-alas bagi tiang-tiang itu terbuat dari perunggu[a]. Kait-kait pada tiang-tiang itu dan gelang-gelang pengikatnya terbuat dari perak, dan lapisan pada puncak-puncaknya juga dari perak[b]. Semua tiang pelataran itu dilengkapi gelang pengikat dari perak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “soket-soket” untuk “alas-alas.”
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani yang diterjemahkan “gelang-gelang pengikat” menunjuk pada perlengkapan perak yang berkaitan dengan tiang-tiang, tetapi bentuk arsitekturalnya yang tepat tidak diketahui dengan pasti.
    reason: cultural_note
lexical_decisions:
- source_word: אֲדָנִים
  choice: alas-alas
  rationale: Dalam konteks Kemah Suci, kata ini menunjuk pada tumpuan atau soket penyangga tiang. 'Alas' jelas dan wajar dalam bahasa Indonesia modern.
- source_word: עַמֻּדִים
  choice: tiang-tiang
  rationale: Kata ini menunjuk pada penyangga tegak; 'tiang' paling alami untuk bangunan pelataran Kemah Suci.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Dalam uraian perlengkapan Kemah Suci, 'perunggu' merupakan padanan konvensional dan masuk akal, meskipun secara leksikal tembaga juga mungkin.
- source_word: וָוֵי
  choice: kait-kait
  rationale: Kata ini menunjuk pada kait yang terpasang pada tiang-tiang dalam struktur pelataran.
- source_word: חֲשׁוּקֵיהֶם
  choice: gelang-gelang pengikatnya
  rationale: Bentuk persis unsur arsitektural ini tidak pasti. Pilihan ini menyampaikan benda perak yang melingkari atau mengikat tiang tanpa menentukan bentuknya secara berlebihan.
- source_word: צִפּוּי
  choice: lapisan
  rationale: Kata ini menyatakan lapisan penutup dari logam; 'lapisan' ringkas dan alami.
- source_word: רָאשֵׁיהֶם
  choice: puncak-puncaknya
  rationale: Secara harfiah berarti 'kepala-kepalanya' dan di sini menunjuk pada bagian paling atas dari tiang.
- source_word: מְחֻשָּׁקִים
  choice: dilengkapi gelang pengikat
  rationale: Pilihan ini mempertahankan kaitan leksikal dengan חֲשׁוּקֵיהֶם dan menghindari istilah arsitektural yang terlalu teknis.
- source_word: חָצֵר
  choice: pelataran
  rationale: Dalam konteks Kemah Suci, kata ini menunjuk pada kawasan luar yang dikelilingi tirai; 'pelataran' merupakan istilah Indonesia yang jelas dan lazim.
