  text: Ia mengecor empat cincin pada keempat sudut kisi-kisi perunggu itu sebagai tempat bagi batang-batang pengusung.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pada keempat ujung” kisi-kisi perunggu itu.'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “rumah-rumah bagi batang-batang pengusung,” yaitu wadah atau dudukan untuk menerimanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצֹק
  choice: Ia menuang
  rationale: Kata kerja יצק dalam konteks pengerjaan logam berarti menuang logam cair untuk membentuk benda; 'menuang' alami dalam bahasa Indonesia dan sesuai dengan pembuatan gelang logam.
- source_word: אַרְבַּע טַבָּעֹת
  choice: empat gelang
  rationale: טַבָּעֹת menunjuk pada gelang-gelang logam yang menjadi kait atau tempat memasukkan alat pengusung.
- source_word: בְּאַרְבַּע הַקְּצָוֺת
  choice: pada keempat sudut
  rationale: קָצֶה dapat berarti ujung, tepi, atau bagian terluar; dalam konteks kisi-kisi berbentuk persegi, 'sudut' paling jelas, sementara kemungkinan 'ujung' dipertahankan dalam catatan kaki.
- source_word: לְמִכְבַּר הַנְּחֹשֶׁת
  choice: kisi-kisi perunggu itu
  rationale: מִכְבָּר adalah anyaman atau kisi-kisi, sedangkan נְחֹשֶׁת dalam konteks ini paling tepat diterjemahkan 'perunggu'.
- source_word: בָּתִּים
  choice: tempat memasukkan
  rationale: Secara harfiah berarti 'rumah-rumah', tetapi di sini menunjuk pada wadah atau dudukan yang menerima kayu pengusung; ungkapan fungsional ini jelas bagi pembaca modern.
- source_word: לַבַּדִּים
  choice: kayu-kayu pengusung
  rationale: בַּדִּים adalah batang-batang yang digunakan untuk mengusung perlengkapan Kemah Suci; 'kayu-kayu pengusung' menjelaskan fungsi dan bahannya secara alami dalam konteks ini.
