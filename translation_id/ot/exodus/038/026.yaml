  text: בֶּ֚קַע לַ/גֻּלְגֹּ֔לֶת מַחֲצִ֥ית הַ/שֶּׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ לְ/כֹ֨ל הָ/עֹבֵ֜ר עַל הַ/פְּקֻדִ֗ים מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה לְ/שֵׁשׁ מֵא֥וֹת אֶ֨לֶף֙ וּ/שְׁלֹ֣שֶׁת אֲלָפִ֔ים וַ/חֲמֵ֥שׁ מֵא֖וֹת וַ/חֲמִשִּֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/026.yaml
  text: 'a beka per head[a], that is, half a shekel by the sanctuary shekel, for everyone who passed over to those counted[c][b], from twenty years old and upward: 603,550.'
translation:
  language: id
  text: satu beka[a] per kepala[b], yaitu setengah syikal menurut syikal tempat kudus, bagi setiap orang yang masuk dalam daftar orang-orang yang dihitung[c], yang berumur dua puluh tahun ke atas—603.550 orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Satu beka sama dengan setengah syikal menurut standar tempat kudus.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “per tengkorak”; ungkapan Ibrani yang berarti setiap orang yang dihitung.
    reason: lexical_alternative
  - marker: c
    text: Secara lebih harfiah, “setiap orang yang lewat di antara orang-orang yang dihitung.” Bahasa Ibrani memakai gambaran orang yang lewat untuk didaftarkan dalam sensus.
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּקַע
  choice: beka
  rationale: Istilah khusus untuk satuan berat yang nilainya dijelaskan langsung oleh frasa berikutnya sebagai setengah syikal; transliterasi mempertahankan istilah budaya sumber.
- source_word: לַגֻּלְגֹּלֶת
  choice: per kepala
  rationale: Secara harfiah berarti 'per tengkorak', tetapi merupakan ungkapan penghitungan untuk setiap orang. 'Per kepala' mempertahankan idiom itu secara wajar dalam bahasa Indonesia.
- source_word: מַחֲצִית הַשֶּׁקֶל
  choice: setengah syikal
  rationale: Padanan langsung bagi frasa yang menjelaskan nilai satu beka.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: menurut syikal tempat kudus
  rationale: Menunjukkan bahwa beratnya ditentukan menurut standar syikal yang berlaku di tempat kudus.
- source_word: לְכֹל הָעֹבֵר עַל הַפְּקֻדִים
  choice: bagi setiap orang yang masuk dalam daftar orang-orang yang dihitung
  rationale: Mengungkapkan konteks sensus secara alami, sementara gambaran harfiahnya tentang orang yang 'lewat' dipertahankan dalam catatan kaki.
- source_word: הַפְּקֻדִים
  choice: orang-orang yang dihitung
  rationale: Mempertahankan makna pasif dalam konteks pencatatan sensus.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: yang berumur dua puluh tahun ke atas
  rationale: Ungkapan usia yang alami dan tepat dalam bahasa Indonesia modern.
- source_word: לְשֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: 603.550 orang
  rationale: Angka ditulis dengan format angka Indonesia agar mudah dibaca; kata 'orang' memperjelas bahwa jumlah tersebut adalah jumlah mereka yang dihitung.
