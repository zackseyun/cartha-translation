revisions:
- from: Dari seribu tujuh ratus tujuh puluh lima syikal perak itu, ia membuat kait-kait untuk tiang-tiang, melapisi bagian atasnya, dan memasang gelang-gelang pengikat pada tiang-tiang itu.
  to: Dengan seribu tujuh ratus tujuh puluh lima itu, ia membuat kait-kait untuk tiang-tiang, melapisi bagian atasnya, dan memasang pita-pita pengikat pada tiang-tiang itu.[a]
  rationale: Revisi menghapus penyebutan “syikal perak” yang hanya tersirat dari konteks sebelumnya, mengganti istilah yang berpotensi menyesatkan “gelang-gelang” dengan “pita-pita pengikat,” dan menambahkan catatan kaki pada unsur leksikal yang mempunyai alternatif penerjemahan. Makna dan gaya inventaris naratif tetap dipertahankan.
