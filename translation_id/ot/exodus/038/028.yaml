  text: And with the one thousand seven hundred and seventy-five he made hooks for the pillars[a], overlaid their tops, and made bands for them.
translation:
  language: id
  text: Dengan seribu tujuh ratus tujuh puluh lima itu, ia membuat kait-kait untuk tiang-tiang, melapisi bagian atasnya, dan memasang pita-pita pengikat pada tiang-tiang itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mengikat tiang-tiang itu dengan pita-pita.” Kata kerja Ibrani ini menunjuk pada pemberian atau pemasangan pita-pita pengikat pada tiang-tiang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת הָאֶלֶף וּשְׁבַע הַמֵּאוֹת וַחֲמִשָּׁה וְשִׁבְעִים
  choice: Dari seribu tujuh ratus tujuh puluh lima syikal perak itu
  rationale: Frasa ini melanjutkan perhitungan perak pada ayat sebelumnya. Satuan dan bahannya tersirat dari konteks dekat, sehingga dinyatakan agar jumlah tersebut terbaca wajar dan jelas dalam bahasa Indonesia.
- source_word: עָשָׂה
  choice: ia membuat
  rationale: Padanan umum dan alami untuk tindakan pembuatan dalam konteks pembangunan Kemah Suci.
- source_word: וָוִים
  choice: kait-kait
  rationale: Dalam konteks perlengkapan Kemah Suci, istilah ini menunjuk pada kait logam yang dipasang pada tiang.
- source_word: לָעַמּוּדִים
  choice: untuk tiang-tiang
  rationale: Tiang merupakan istilah Indonesia yang alami bagi unsur penyangga struktural ini.
- source_word: וְצִפָּה רָאשֵׁיהֶם
  choice: melapisi bagian atasnya
  rationale: Kata kerja piel צפה berarti melapisi dengan logam, sedangkan 'kepala mereka' secara idiomatis menunjuk pada bagian atas tiang.
- source_word: וְחִשַּׁק אֹתָם
  choice: dan memasang gelang-gelang pengikat pada tiang-tiang itu
  rationale: Dalam konteks ini, kata kerja tersebut berarti melengkapi tiang dengan gelang atau pita pengikat. Rumusan ini lebih mudah dipahami daripada istilah teknis yang tidak lazim.
