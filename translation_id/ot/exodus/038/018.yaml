  text: וּ/מָסַ֞ךְ שַׁ֤עַר הֶ/חָצֵר֙ מַעֲשֵׂ֣ה רֹקֵ֔ם תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר וְ/עֶשְׂרִ֤ים אַמָּה֙ אֹ֔רֶךְ וְ/קוֹמָ֤ה בְ/רֹ֨חַב֙ חָמֵ֣שׁ אַמּ֔וֹת לְ/עֻמַּ֖ת קַלְעֵ֥י הֶ/חָצֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/018.yaml
  text: And the screen for the gate of the courtyard was the work of an embroiderer[a], in blue and purple and scarlet yarn, and fine twined linen, twenty cubits long, and five cubits high[c][b], corresponding in width to the hangings of the courtyard.
translation:
  language: id
  text: Tirai pintu gerbang pelataran itu dibuat oleh seorang penyulam[a] dari benang biru, ungu, dan merah tua, serta lenan halus yang dipintal. Panjangnya dua puluh hasta dan tingginya lima hasta[b], sama dengan tinggi tirai-tirai pelataran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Tirai jalan masuk ke pelataran itu merupakan karya seorang perajin tenun berpola.”'
    reason: מָסַךְ שַׁעַר dapat dipahami sebagai tirai pada jalan masuk, dan רֹקֵם dapat menunjuk pada penyulam atau perajin yang menghasilkan tenunan berpola dan berwarna.
  - marker: b
    text: 'Secara harfiah: “tingginya, pada lebarnya, lima hasta, sesuai dengan tirai-tirai pelataran.” Ungkapan ukuran dalam bahasa Ibrani ini tidak lazim; maksudnya tampaknya bahwa tingginya sama dengan tinggi tirai-tirai pelataran.'
    reason: Mempertahankan ketidaklaziman sintaksis בְרֹחַב dan memberi pembaca akses kepada bentuk sumber tanpa membebani teks utama.
lexical_decisions:
- source_word: מָסַךְ שַׁעַר הֶחָצֵר
  choice: tirai pintu gerbang pelataran
  rationale: מָסַךְ menunjuk pada penghalang atau penutup tekstil pada jalan masuk; 'tirai' alami dalam bahasa Indonesia dan tetap dibedakan dari קְלָעִים, tirai-tirai yang mengelilingi pelataran.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: dibuat oleh seorang penyulam
  rationale: Ungkapan ini menekankan hasil kerja perajin tekstil terampil; bentuk verbal ini lebih alami daripada terjemahan nominal yang kaku.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: benang biru, ungu, dan merah tua
  rationale: Istilah-istilah tersebut menyatakan bahan tekstil berwarna. 'Benang' ditambahkan secara wajar dari konteks, sedangkan 'merah tua' menyampaikan warna scarlet tanpa menyiratkan bahan pewarnanya.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: lenan halus yang dipintal
  rationale: Menerjemahkan jenis bahan dan sifat pemintalannya secara jelas dalam bahasa Indonesia modern.
- source_word: עֶשְׂרִים אַמָּה אֹרֶךְ
  choice: panjangnya dua puluh hasta
  rationale: Mempertahankan satuan kuno 'hasta' dan menyajikan rumus ukuran secara alami.
- source_word: וְקוֹמָה בְרֹחַב חָמֵשׁ אַמּוֹת לְעֻמַּת קַלְעֵי הֶחָצֵר
  choice: tingginya lima hasta, sama dengan tinggi tirai-tirai pelataran
  rationale: Konstruksi Ibrani tentang ukuran agak tidak biasa. Dalam konteks, ukuran lima hasta paling mungkin menyatakan tinggi tirai pintu gerbang yang bersesuaian dengan tirai-tirai pelataran; catatan kaki mempertahankan bentuk ungkapan Ibrani yang lebih harfiah.
