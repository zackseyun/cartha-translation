  text: Tirai-tirai sepanjang lima belas hasta untuk satu sisi; tiang-tiangnya tiga dan alas-alasnya tiga.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְלָעִים
  choice: tirai-tirai
  rationale: Dalam konteks pelataran Kemah Suci, kata ini menunjuk pada bentangan kain yang membentuk pagar pelataran. "Tirai-tirai" merupakan padanan Indonesia yang alami dan mempertahankan bentuk jamaknya.
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: sepanjang lima belas hasta
  rationale: Bahasa Ibrani hanya menyatakan ukuran, tetapi dalam bahasa Indonesia penambahan "sepanjang" secara wajar memperjelas bahwa ukuran itu mengacu pada bentangan tirai.
- source_word: אֶל הַכָּתֵף
  choice: pada satu sisi
  rationale: כָּתֵף secara harfiah dapat berarti "bahu" atau "sisi"; di sini istilah itu menunjuk pada salah satu sisi di samping pintu gerbang pelataran.
- source_word: עַמּוּדֵיהֶם
  choice: ketiga tiangnya
  rationale: עַמּוּד berarti tiang atau pilar. "Tiang" lebih alami dalam bahasa Indonesia untuk struktur penyangga tirai pelataran.
- source_word: אַדְנֵיהֶם
  choice: ketiga alasnya
  rationale: Istilah ini menunjuk pada alas atau dudukan tempat tiang ditegakkan. "Alas" jelas, ringkas, dan sesuai konteks bangunan.
