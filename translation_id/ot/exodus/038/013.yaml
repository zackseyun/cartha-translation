  text: And for the east side[a], eastward, fifty cubits.
translation:
  language: id
  text: Dan untuk sisi timur, ke arah matahari terbit, lima puluh hasta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לִ/פְאַת
  choice: Dan untuk sisi
  rationale: פאה berarti sisi, tepi, atau batas. Dalam konteks ukuran pelataran Kemah Suci, “sisi” paling alami; awalan וְ dan לִ dipertahankan dengan “Dan untuk” sesuai gaya uraian yang berkoordinasi.
- source_word: קֵדְמָה
  choice: timur
  rationale: Kata ini dapat berarti arah depan atau timur. Bersama מִזְרָחָה, makna arah timur jelas.
- source_word: מִזְרָחָה
  choice: ke arah matahari terbit
  rationale: מזרח secara harfiah berkaitan dengan tempat terbitnya matahari dan berarti timur. Ungkapan ini mempertahankan pasangan penunjuk arah dalam bahasa Ibrani tanpa menghilangkan citra matahari terbit.
- source_word: חֲמִשִּׁים
  choice: lima puluh
  rationale: Padanan langsung untuk bilangan kardinal lima puluh.
- source_word: אַמָּה
  choice: hasta
  rationale: אַמָּה adalah satuan panjang kuno yang secara baku diterjemahkan “hasta” dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Susunan ringkas mempertahankan gaya pengukuran teks Ibrani serta pengulangan arah “timur, ke arah matahari terbit” tanpa membuatnya lebih eksplisit daripada sumber.
