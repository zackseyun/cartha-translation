  text: וַ/יַּ֖עַשׂ אֶת הֶ/חָצֵ֑ר לִ/פְאַ֣ת נֶ֣גֶב תֵּימָ֗נָ/ה קַלְעֵ֤י הֶֽ/חָצֵר֙ שֵׁ֣שׁ מָשְׁזָ֔ר מֵאָ֖ה בָּ/אַמָּֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/009.yaml
  text: He made the courtyard. On the south side[a], toward the south, the hangings of the courtyard were of finely twisted linen, a hundred cubits long.
translation:
  language: id
  text: Ia membuat pelataran itu. Pada sisi selatan, ke arah selatan, kain-kain pembatas[a] pelataran itu terbuat dari linen halus yang dipintal, sepanjang seratus hasta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tirai-tirai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia membuat
  rationale: Bentuk wayyiqtol melanjutkan rangkaian tindakan dalam narasi. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan arti dasar verba עשה.
- source_word: הֶחָצֵר
  choice: pelataran itu
  rationale: Dalam konteks Kemah Suci, חָצֵר menunjuk pada area terbuka yang berpagar di sekelilingnya. 'Pelataran' jelas dan sesuai dengan ragam Indonesia modern.
- source_word: לִפְאַת
  choice: Pada ... sisi
  rationale: Dalam konstruksi dengan penunjuk arah, kata ini mengacu pada sisi atau bagian tertentu; 'pada ... sisi' merupakan padanan Indonesia yang wajar.
- source_word: נֶגֶב תֵּימָנָה
  choice: sisi selatan, ke arah selatan
  rationale: Kedua unsur Ibrani sama-sama menyatakan arah selatan. Keduanya dipertahankan agar kepenuhan dan pengulangan penegasan dalam teks sumber tidak dihilangkan.
- source_word: קַלְעֵי הֶחָצֵר
  choice: kain-kain pembatas pelataran itu
  rationale: Dalam konteks Kemah Suci, קְלָעִים adalah bentangan kain yang membentuk batas pelataran. 'Kain-kain pembatas' menjelaskan fungsi bendanya secara alami tanpa menganggapnya sebagai dinding padat.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: linen halus yang dipintal
  rationale: שֵׁשׁ menyatakan linen bermutu halus, sedangkan מָשְׁזָר menunjukkan bahan yang dipintal atau dipilin. Terjemahan ini mempertahankan kedua unsur tersebut dengan ungkapan yang mudah dipahami.
- source_word: מֵאָה בָּאַמָּה
  choice: sepanjang seratus hasta
  rationale: Frasa ini memberikan ukuran bentangan kain. Kata 'sepanjang' membuat dimensi yang tersirat dalam bahasa Ibrani menjadi jelas dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan arah selatan dipertahankan karena mencerminkan bentuk teks Ibrani. Istilah ukuran kuno 'hasta' dipertahankan tanpa konversi agar tidak memberi ketepatan modern yang semu.
