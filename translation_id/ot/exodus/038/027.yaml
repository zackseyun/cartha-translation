base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/027.yaml
  text: 'The hundred talents of silver were for casting the bases of the sanctuary and the bases of the veil: one hundred bases for the hundred talents[b][a], a talent for each base.'
translation:
  language: id
  text: 'Seratus talenta perak itu digunakan untuk mengecor alas-alas untuk tempat kudus dan alas-alas untuk tabir[a]: seratus alas dari seratus talenta, satu talenta untuk setiap alas.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tabir” ialah tirai bagian dalam yang memisahkan ruang kudus dari ruang mahakudus.
    reason: cultural_note
  - marker: b
    text: “Alas” dapat juga diterjemahkan “soket”, yaitu bagian fondasi logam Kemah Suci.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: digunakan
  rationale: Dalam konteks laporan penggunaan bahan, bentuk ini memperkenalkan peruntukan perak; 'digunakan' menyampaikan fungsi tersebut secara alami dalam bahasa Indonesia.
- source_word: מְאַת כִּכַּר הַכֶּסֶף
  choice: seratus talenta perak
  rationale: Mempertahankan jumlah dan satuan berat secara ringkas dan wajar.
- source_word: לָצֶקֶת
  choice: untuk menuang
  rationale: Infinitif menyatakan tujuan, sedangkan dalam konteks pengerjaan logam kata ini menunjuk pada penuangan logam cair ke dalam cetakan.
- source_word: אַדְנֵי
  choice: alas-alas
  rationale: Menunjuk pada bagian fondasi logam di bawah rangka Kemah Suci dan tiang-tiang tabir; 'alas' mudah dipahami dalam bahasa Indonesia modern.
- source_word: הַקֹּדֶשׁ
  choice: tempat kudus
  rationale: Di sini menunjuk pada bangunan suci secara umum, yang alas-alasnya dibedakan dari alas-alas tabir.
- source_word: הַפָּרֹכֶת
  choice: tabir
  rationale: Istilah ini menunjuk secara khusus pada tirai bagian dalam yang memisahkan ruang kudus dari ruang mahakudus.
- source_word: מְאַת אֲדָנִים לִמְאַת הַכִּכָּר
  choice: seratus alas dari seratus talenta
  rationale: Menyatakan hubungan antara jumlah alas yang dibuat dan jumlah talenta yang digunakan tanpa menambah rincian yang tidak tersurat.
- source_word: כִּכָּר לָאָדֶן
  choice: satu talenta untuk setiap alas
  rationale: Menyampaikan rasio pembagian satu talenta bagi masing-masing alas secara jelas dan idiomatis.
