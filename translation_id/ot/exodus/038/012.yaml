  yaml_path: translation/ot/exodus/038/012.yaml
  text: And for the west side there were hangings of fifty cubits[a], with ten of their pillars and ten of their bases; the hooks of the pillars and their bands were silver.
translation:
  language: id
  text: Di sisi barat terdapat tirai sepanjang lima puluh hasta; tiang-tiangnya sepuluh dan alas-alasnya sepuluh. Kait-kait pada tiang dan pengikat-pengikatnya[a] terbuat dari perak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani untuk perlengkapan tiang ini bersifat teknis; kata ini dapat merujuk pada gelang-gelang, batang-batang penghubung, atau bagian-bagian hiasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִפְאַת יָם
  choice: Di sisi barat
  rationale: יָם secara harfiah berarti “laut”, tetapi dalam keterangan arah ini merupakan sebutan idiomatis bagi barat. Ungkapan ini menyampaikan arah secara alami dalam bahasa Indonesia.
- source_word: קְלָעִים
  choice: tirai
  rationale: Dalam konteks pelataran Kemah Suci, kata ini menunjuk pada bentangan kain yang membentuk pagar pelataran. “Tirai” jelas dan mudah dipahami tanpa menentukan bentuk tekstil secara berlebihan.
- source_word: חֲמִשִּׁים בָּאַמָּה
  choice: sepanjang lima puluh hasta
  rationale: אַמָּה adalah satuan hasta. Kata “sepanjang” menyatakan ukuran bentangan tirai yang tersirat dalam konstruksi Ibrani.
- source_word: עַמּוּדֵיהֶם עֲשָׂרָה
  choice: dengan sepuluh tiang
  rationale: עַמּוּדִים menunjuk pada tiang-tiang penyangga. “Dengan” mengalihkan gaya daftar Ibrani ke dalam susunan Indonesia yang lancar.
- source_word: וְאַדְנֵיהֶם עֲשָׂרָה
  choice: dan sepuluh alasnya
  rationale: אֶדֶן dalam konstruksi Kemah Suci adalah alas atau soket tempat tiang berdiri. “Alas” merupakan istilah umum yang jelas bagi pembaca modern.
- source_word: וָוֵי הָעַמֻּדִים
  choice: Kait-kait tiang
  rationale: וָוִים dalam bagian konstruksi ini menunjuk pada kait yang terpasang pada tiang.
- source_word: וַחֲשׁוּקֵיהֶם
  choice: dan batang-batang penghubungnya
  rationale: Istilah teknis ini menunjuk pada perlengkapan tiang, tetapi bentuk tepatnya tidak pasti. “Batang-batang penghubung” memberikan gambaran fungsional yang masuk akal, sementara catatan kaki mempertahankan kemungkinan lain.
- source_word: כָּסֶף
  choice: terbuat dari perak
  rationale: Nomina bahan ini berfungsi sebagai predikat bagi kait dan perlengkapan tiang. “Terbuat dari perak” merupakan ungkapan Indonesia yang alami dan tepat.
