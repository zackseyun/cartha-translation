translation:
  language: id
  text: Ia membuat tanduk-tanduk pada keempat sudut mezbah itu. Tanduk-tanduk itu merupakan satu kesatuan dengan mezbah itu,[a] lalu ia melapisi mezbah itu dengan perunggu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “darinya ada tanduk-tanduknya,” yang menunjukkan bahwa tanduk-tanduk itu merupakan bagian utuh dari mezbah dan bukan dibuat terpisah lalu dipasang.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani neḥosyet dapat berarti “perunggu” atau “tembaga”; “perunggu” adalah terjemahan yang lazim dalam konteks Kemah Suci.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia membuat
  rationale: Bentuk naratif dari עשה menyatakan tindakan langsung; “Ia membuat” alami dalam bahasa Indonesia modern.
- source_word: קַרְנֹתָיו
  choice: tanduk-tanduk
  rationale: קֶרֶן secara harfiah berarti “tanduk” dan dalam konteks mezbah menunjuk pada tonjolan berbentuk tanduk di sudut-sudutnya; istilah konkret ini dipertahankan.
- source_word: עַל אַרְבַּע פִּנֹּתָיו
  choice: pada keempat sudut mezbah itu
  rationale: Frasa ini menunjukkan letak tanduk-tanduk tersebut. Penyebutan “mezbah itu” memperjelas acuan pronomina Ibrani tanpa mengubah makna.
- source_word: מִמֶּנּוּ הָיוּ קַרְנֹתָיו
  choice: Tanduk-tanduk tersebut menyatu dengan mezbah itu
  rationale: Secara harfiah, “darinya ada tanduk-tanduknya”; dalam konteks pembuatan, ungkapan ini menunjukkan bahwa tanduk-tanduk itu merupakan bagian utuh dari mezbah, bukan benda terpisah yang kemudian dipasang.
- source_word: וַיְצַף אֹתוֹ
  choice: lalu ia melapisi mezbah itu
  rationale: צפה dalam konteks perlengkapan Kemah Suci berarti melapisi suatu benda dengan logam. “Mezbah itu” memperjelas objek pronomina.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: נְחֹשֶׁת dapat menunjuk pada tembaga atau perunggu. “Perunggu” merupakan padanan konvensional dan sesuai untuk perlengkapan Kemah Suci, sementara kemungkinan “tembaga” dicatat dalam catatan kaki.
