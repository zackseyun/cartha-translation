  text: וַ/יַּ֛עַשׂ אֶת מִזְבַּ֥ח הָ/עֹלָ֖ה עֲצֵ֣י שִׁטִּ֑ים חָמֵשׁ֩ אַמּ֨וֹת אָרְכּ֜/וֹ וְ/חָֽמֵשׁ אַמּ֤וֹת רָחְבּ/וֹ֙ רָב֔וּעַ וְ/שָׁלֹ֥שׁ אַמּ֖וֹת קֹמָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/001.yaml
  text: He made the altar of burnt offering of acacia wood[a], five cubits its length and five cubits its width, square, and three cubits its height.
translation:
  language: id
  text: Ia membuat mezbah kurban bakaran dari kayu akasia. Panjangnya lima hasta dan lebarnya lima hasta, berbentuk persegi[a], serta tingginya tiga hasta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bersegi empat.”'
    reason: Alternatif leksikal bagi רָבוּעַ; kedua ungkapan menyatakan bahwa denah mezbah itu memiliki empat sisi dengan panjang dan lebar yang sama.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia membuat
  rationale: Bentuk wayyiqtol dari עשה melanjutkan narasi dengan tindakan lampau. “Ia membuat” wajar dalam bahasa Indonesia dan tidak menambahkan nuansa yang tidak ada dalam teks.
- source_word: מִזְבַּח הָעֹלָה
  choice: mezbah kurban bakaran
  rationale: Frasa konstruksi ini menunjuk pada mezbah yang digunakan untuk עֹלָה, yaitu kurban yang dibakar seluruhnya. “Mezbah kurban bakaran” ringkas, jelas, dan selaras dengan istilah Alkitab bahasa Indonesia yang dikenal luas.
- source_word: עֲצֵי שִׁטִּים
  choice: dari kayu akasia
  rationale: שִׁטִּים menunjuk pada jenis pohon akasia. Nama modern “akasia” lebih mudah dipahami daripada transliterasi tradisional.
- source_word: חָמֵשׁ אַמּוֹת
  choice: lima hasta
  rationale: אַמָּה adalah satuan hasta. Satuan asli dipertahankan agar konsisten dengan ukuran-ukuran Kemah Suci dan untuk menghindari ketepatan semu dari konversi modern.
- source_word: אָרְכּוֹ
  choice: panjangnya
  rationale: Akhiran pronominal merujuk kepada mezbah; “panjangnya” menyampaikan bentuk posesif itu secara alami.
- source_word: רָחְבּוֹ
  choice: lebarnya
  rationale: Dalam keterangan ukuran, רֹחַב secara alami diterjemahkan “lebar”; akhiran pronominal dinyatakan dengan “-nya”.
- source_word: רָבוּעַ
  choice: berbentuk persegi
  rationale: Kata sifat ini berarti persegi atau bersegi empat. “Berbentuk persegi” adalah ungkapan modern yang jelas untuk altar dengan panjang dan lebar yang sama.
- source_word: קֹמָתוֹ
  choice: tingginya
  rationale: Dalam konteks bangunan, קוֹמָה berarti tinggi. “Tingginya” merupakan padanan Indonesia yang langsung dan idiomatis.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “mezbah,” “kurban bakaran,” dan “hasta” dipertahankan karena dikenal dalam konteks Alkitab, sedangkan susunan kalimat dibuat alami bagi pembaca masa kini. Penanda catatan kaki ditempatkan pada “persegi,” yaitu kata yang memang memiliki alternatif leksikal.
