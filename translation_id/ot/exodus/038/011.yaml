base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/011.yaml
  text: And for the north side there were a hundred cubits[a], their twenty pillars and their twenty bases of bronze, and the hooks of the pillars and their bands were of silver.
translation:
  language: id
  text: Di sisi utara panjangnya seratus hasta. Ada dua puluh tiang dengan dua puluh alas dari perunggu. Kait-kait pada tiang dan pengikat-pengikatnya[a] terbuat dari perak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gelang-gelangnya” atau “batang-batang penghubungnya”. Istilah Ibrani ini menunjuk pada perlengkapan perak pada tiang, tetapi bentuk tepatnya tidak diketahui.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְאַת צָפוֹן
  choice: di sisi utara
  rationale: Frasa ini menunjuk pada sisi utara pelataran; bentuk dengan “di” terdengar alami dalam bahasa Indonesia dan sesuai dengan konteks uraian bangunan.
- source_word: מֵאָה בָאַמָּה
  choice: panjangnya seratus hasta
  rationale: Teks Ibrani menyatakan ukuran secara eliptis. Penambahan “panjangnya” memperjelas fungsi angka tanpa menambah unsur substantif.
- source_word: עַמּוּדֵיהֶם
  choice: dua puluh tiang
  rationale: עַמּוּדִים adalah tiang-tiang struktural pelataran. Pronomina jamak Ibrani tidak perlu ditiru secara kaku karena acuannya sudah jelas dalam bahasa Indonesia.
- source_word: אַדְנֵיהֶם
  choice: dua puluh alas
  rationale: Dalam uraian Kemah Suci, אדן menunjuk pada alas atau soket penopang tiang. “Alas” lebih mudah dipahami pembaca umum.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: “Perunggu” merupakan padanan lazim bagi bahan logam ini dalam konteks perlengkapan Kemah Suci, walaupun istilah Ibraninya juga dapat mencakup tembaga atau paduan tembaga.
- source_word: וָוֵי הָעַמּוּדִים
  choice: kait-kait pada tiang
  rationale: וָוִים di sini paling mungkin menunjuk pada kait yang terpasang pada tiang, bukan pasak kemah.
- source_word: חֲשֻׁקֵיהֶם
  choice: pengikat-pengikatnya
  rationale: Istilah ini menunjuk pada perlengkapan perak yang mengikat, melingkari, atau menghubungkan bagian tiang, tetapi bentuk arsitektural tepatnya tidak pasti. “Pengikat” mempertahankan gagasan dasarnya dengan bahasa yang wajar.
- source_word: כָּסֶף
  choice: perak
  rationale: Padanan langsung bagi bahan pembuat kait dan pengikat tersebut.
