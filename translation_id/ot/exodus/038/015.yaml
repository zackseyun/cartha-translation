base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/015.yaml
  text: And for the other side[a], on this side and on that side of the gate of the courtyard, there were hangings of fifteen cubits, their pillars three[b], and their bases three.
translation:
  language: id
  text: Pada sisi yang lain[a], di sebelah sini dan di sebelah sana dari pintu gerbang pelataran, terdapat tirai sepanjang lima belas hasta, dengan tiga tiang dan tiga alas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pada kedua sisi pintu gerbang pelataran.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “tiga soket.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לַכָּתֵף ... הַשֵּׁנִית
  choice: pada sisi yang lain
  rationale: כָּתֵף secara harfiah berarti 'bahu' dan secara arsitektural dapat menunjuk pada sisi atau bagian samping. Dalam konteks ini, frasa tersebut menunjuk pada bagian samping lain yang mengapit pintu gerbang.
- source_word: מִזֶּה וּמִזֶּה
  choice: di sebelah sini dan di sebelah sana
  rationale: Ungkapan ini mempertahankan cara Ibrani menyatakan dua bagian yang berada pada kedua sisi pintu gerbang.
- source_word: לְשַׁעַר הֶחָצֵר
  choice: dari pintu gerbang pelataran
  rationale: Frasa ini menghubungkan kedua bagian samping dengan pintu gerbang pelataran; 'dari' menghasilkan hubungan spasial yang alami dalam bahasa Indonesia.
- source_word: קְלָעִים
  choice: tirai
  rationale: Dalam konteks Kemah Suci, kata ini menunjuk pada kain gantung yang membentuk pembatas pelataran. 'Tirai' jelas dan lazim bagi pembaca Indonesia.
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: sepanjang lima belas hasta
  rationale: Bahasa Indonesia memerlukan penanda dimensi agar ukuran tirai terbaca alami. 'Hasta' mempertahankan satuan kuno tanpa konversi.
- source_word: עַמֻּדֵיהֶם שְׁלֹשָׁה
  choice: dengan tiga tiang
  rationale: Bentuk inventaris tanpa verba dalam bahasa Ibrani diungkapkan secara alami dalam bahasa Indonesia dengan 'dengan'. 'Tiang' tepat untuk unsur penyangga tirai pelataran.
- source_word: וְאַדְנֵיהֶם שְׁלֹשָׁה
  choice: dan tiga alas
  rationale: אֶדֶן dapat berarti alas atau soket konstruksi. 'Alas' lebih mudah dipahami dan tetap sesuai dengan fungsi strukturalnya.
