base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/019.yaml
  text: Their four pillars and their four bronze bases[a], their hooks of silver[c][b], and the overlay of their tops and their bands of silver.
translation:
  language: id
  text: Keempat tiangnya dan keempat alasnya terbuat dari perunggu; kait-kaitnya terbuat dari perak, dan lapisan pada puncaknya serta pengikat-pengikatnya juga terbuat dari perak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk tepat unsur-unsur perak yang diterjemahkan sebagai “pengikat-pengikat” tidak diketahui dengan pasti; istilah ini juga dapat dipahami sebagai gelang atau batang penghubung.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדֵיהֶם
  choice: tiangnya
  rationale: עַמּוּד menunjuk pada tiang penyangga dalam bangunan pelataran Kemah Suci; “tiang” merupakan istilah Indonesia yang alami dan tepat.
- source_word: אַדְנֵיהֶם
  choice: alasnya
  rationale: אֶדֶן adalah bagian logam penopang pada kaki tiang. “Alas” mudah dipahami tanpa menyatakan bentuk teknisnya secara berlebihan.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Dalam daftar bahan Kemah Suci, נְחֹשֶׁת lazim dipahami sebagai perunggu, meskipun cakupan katanya dapat mencakup tembaga.
- source_word: וָוֵיהֶם
  choice: kait-kaitnya
  rationale: וָו menunjuk pada perangkat untuk mengaitkan atau memasang bagian-bagian pelataran; “kait” paling sesuai dengan fungsi yang tersirat dalam konteks.
- source_word: כֶּסֶף
  choice: perak
  rationale: כֶּסֶף secara langsung menyatakan bahan perak dalam konteks ini.
- source_word: צִפּוּי רָאשֵׁיהֶם
  choice: lapisan pada puncaknya
  rationale: צִפּוּי berarti lapisan atau pelapis, sedangkan רָאשֵׁיהֶם secara harfiah berarti “kepala/puncaknya.” Ungkapan ini mempertahankan konstruksi nominal dan tidak mengandaikan bentuk khusus.
- source_word: חֲשֻׁקֵיהֶם
  choice: pengikat-pengikatnya
  rationale: Bentuk tepat unsur yang disebut חֲשֻׁקִים tidak pasti. “Pengikat” mempertahankan gagasan unsur yang mengikat atau menghubungkan tanpa terlalu menentukan bahwa benda itu berupa gelang atau batang.
