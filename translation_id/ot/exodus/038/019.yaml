  source_fidelity: 'Teks Indonesia secara utuh mencerminkan unsur-unsur Ibrani dan urutannya: empat tiang, empat alas perunggu, kait perak, lapisan pada puncak, dan unsur pengikat perak. Penambahan “terbuat dari” secara tepat mengungkapkan hubungan bahan yang ringkas dalam bahasa Ibrani tanpa menambahkan makna teknis.'
