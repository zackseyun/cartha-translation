translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan daftar yang jelas. Kata “terbuat dari” ditambahkan untuk mengungkapkan hubungan bahan yang dalam bahasa Ibrani dinyatakan secara ringkas. Akhiran -nya mempertahankan hubungan semua unsur dengan keempat tiang yang disebutkan.
