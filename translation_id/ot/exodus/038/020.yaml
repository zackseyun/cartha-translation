base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/020.yaml
  text: And all the pegs for the tabernacle and for the surrounding courtyard were bronze[a].
translation:
  language: id
  text: Semua patok untuk Kemah Suci dan untuk pelataran di sekelilingnya terbuat dari perunggu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tembaga.” Kata Ibrani נְחֹשֶׁת dapat berarti tembaga atau perunggu, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: Semua
  rationale: Dalam konteks daftar ini, וְ berfungsi melanjutkan uraian sebelumnya, sedangkan כָל dengan nomina jamak paling alami diterjemahkan 'semua'.
- source_word: הַיְתֵדֹת
  choice: patok
  rationale: יָתֵד menunjuk pada patok yang digunakan untuk menambatkan atau mengokohkan bangunan kain; 'patok' ringkas dan lazim dalam bahasa Indonesia.
- source_word: לַמִּשְׁכָּן
  choice: untuk Kemah Suci
  rationale: מִשְׁכָּן secara harfiah berarti tempat kediaman, tetapi dalam konteks Keluaran merupakan sebutan khusus bagi Kemah Suci; pilihan ini jelas dan mapan bagi pembaca Indonesia.
- source_word: וְלֶחָצֵר סָבִיב
  choice: dan untuk pelataran di sekelilingnya
  rationale: חָצֵר adalah area terbuka berpagar, dan סָבִיב menyatakan letaknya mengelilingi Kemah Suci. Akhiran '-nya' memperjelas rujukan spasial yang tersirat tanpa mengubah makna.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Dalam konteks bahan Kemah Suci, נְחֹשֶׁת secara tradisional dan wajar diterjemahkan 'perunggu', meskipun istilah Ibraninya juga dapat menunjuk pada tembaga.
