  terminology: “Kemah Suci” merupakan padanan mapan dan jelas untuk מִשְׁכָּן dalam konteks Keluaran. “Patok” cukup tepat untuk יְתֵדֹת dalam konteks perlengkapan kemah, sedangkan “pelataran” tepat untuk חָצֵר. “Perunggu” adalah pilihan kontekstual yang baik untuk נְחֹשֶׁת; catatan kaki dengan alternatif “tembaga” mempertahankan keluasan leksikal istilah Ibrani.
