translation:
  language: id
  text: Ia membuat batang-batang pengusung itu dari kayu akasia dan melapisinya dengan perunggu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani yang diterjemahkan “perunggu” juga dapat berarti “tembaga”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia membuat
  rationale: Bentuk wayyiqtol Qal dari עשה melanjutkan rangkaian narasi. Dalam bahasa Indonesia, urutan tindakan tersampaikan secara alami tanpa harus menerjemahkan waw secara tersendiri pada awal kalimat.
- source_word: הַבַּדִּים
  choice: kayu-kayu pengusung itu
  rationale: Dalam konteks perlengkapan Kemah Suci, בַּדִּים menunjuk pada batang kayu yang dipakai untuk mengusung. Pilihan ini lebih jelas daripada 'batang-batang' dan menghindari kesan bahwa benda tersebut merupakan palang struktural.
- source_word: עֲצֵי שִׁטִּים
  choice: dari kayu akasia
  rationale: Frasa konstruksi ini secara idiomatis menunjuk pada bahan kayu akasia; 'akasia' merupakan nama yang transparan bagi pembaca Indonesia modern.
- source_word: וַיְצַף
  choice: lalu melapisinya
  rationale: Dalam konteks pekerjaan logam, צפה berarti menyalut atau melapisi sebuah benda dengan logam. 'Lalu' menyampaikan kelanjutan tindakan naratif secara alami.
- source_word: אֹתָם
  choice: -nya
  rationale: Akhiran objek jamak merujuk kembali kepada kayu-kayu pengusung. Dalam bahasa Indonesia, klitik '-nya' dapat merujuk pada anteseden jamak tanpa perlu menandai jumlah lagi.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Istilah ini dapat berarti tembaga ataupun perunggu. 'Perunggu' dipilih sebagai sebutan konvensional dan masuk akal untuk perlengkapan Kemah Suci, sedangkan kemungkinan 'tembaga' dipertahankan dalam catatan kaki.
