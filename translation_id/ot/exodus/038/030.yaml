  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ בָּ֗/הּ אֶת אַדְנֵי֙ פֶּ֚תַח אֹ֣הֶל מוֹעֵ֔ד וְ/אֵת֙ מִזְבַּ֣ח הַ/נְּחֹ֔שֶׁת וְ/אֶת מִכְבַּ֥ר הַ/נְּחֹ֖שֶׁת אֲשֶׁר ל֑/וֹ וְ/אֵ֖ת כָּל כְּלֵ֥י הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/030.yaml
  text: With it he made the bases for the entrance of the tent of meeting[a], the bronze altar, the bronze grating for it[b], and all the utensils of the altar.
translation:
  language: id
  text: Dengan perunggu itu ia membuat alas-alas untuk pintu masuk Kemah Pertemuan[a], mezbah perunggu, kisi-kisi perunggu untuk mezbah itu[b], dan semua perlengkapan mezbah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “soket-soket untuk pintu masuk Kemah Pertemuan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “jaringan perunggu milik mezbah itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ia membuat
  rationale: Kata kerja umum עשה dalam narasi pembuatan; “membuat” alami dan tepat.
- source_word: בָּהּ
  choice: Dengan perunggu itu
  rationale: Pronomina feminin merujuk pada perunggu dalam ayat sebelumnya; rujukannya dibuat eksplisit agar jelas dalam bahasa Indonesia.
- source_word: אַדְנֵי
  choice: alas-alas
  rationale: Dalam konteks Kemah Suci, istilah ini menunjuk pada penyangga atau soket logam; “alas-alas” jelas bagi pembaca umum tanpa menghilangkan alternatif teknis.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: pintu masuk Kemah Pertemuan
  rationale: פֶּתַח berarti bukaan atau jalan masuk; bentuk ini alami dalam bahasa Indonesia. Nama אֹהֶל מוֹעֵד diterjemahkan dengan istilah Alkitabiah Indonesia yang mapan.
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: mezbah perunggu
  rationale: Mempertahankan istilah kultis “mezbah” dan menerjemahkan נְחֹשֶׁת sebagai “perunggu”, sesuai konteks bahan Kemah Suci.
- source_word: מִכְבַּר הַנְּחֹשֶׁת
  choice: kisi-kisi perunggu
  rationale: מִכְבָּר menunjuk pada benda berjeruji atau berjaring yang terkait dengan mezbah; “kisi-kisi” konkret dan mudah dipahami.
- source_word: אֲשֶׁר לוֹ
  choice: untuk mezbah itu
  rationale: Frasa ini menyatakan hubungan kisi-kisi dengan mezbah tanpa menentukan secara berlebihan apakah letaknya pada, di dalam, atau milik mezbah; nomina diulang untuk menghindari rujukan pronominal yang kabur.
- source_word: כָּל כְּלֵי הַמִּזְבֵּחַ
  choice: semua perlengkapan mezbah
  rationale: כְּלִים merupakan istilah luas bagi perkakas atau peralatan; “perlengkapan” alami dan mencakup berbagai benda pelayanan mezbah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah “Kemah Pertemuan” dan “mezbah” dipertahankan karena telah mapan dalam penggunaan Alkitabiah Indonesia; struktur kalimat mengikuti daftar benda dalam bahasa Ibrani sambil memperjelas rujukan בָּהּ.
