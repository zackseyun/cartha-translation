  to: Inilah catatan perhitungan[a] mengenai Kemah Suci, yaitu Kemah Kesaksian.[b] Catatan itu dibuat atas perintah Musa melalui pelayanan orang-orang Lewi di bawah pengawasan Itamar,[c] anak Harun, imam itu.
