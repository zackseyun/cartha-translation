  text: אֵ֣לֶּה פְקוּדֵ֤י הַ/מִּשְׁכָּן֙ מִשְׁכַּ֣ן הָ/עֵדֻ֔ת אֲשֶׁ֥ר פֻּקַּ֖ד עַל פִּ֣י מֹשֶׁ֑ה עֲבֹדַת֙ הַ/לְוִיִּ֔ם בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/021.yaml
  text: These are the records of the tabernacle[a], the tabernacle of the testimony, as they were recorded at the command of Moses[c][b], by the service of the Levites under the direction of Ithamar son of Aaron the priest.
translation:
  language: id
  text: Inilah catatan perhitungan[a] mengenai Kemah Suci, yaitu Kemah Kesaksian.[b] Catatan itu dibuat atas perintah Musa melalui pelayanan orang-orang Lewi di bawah pengawasan Itamar,[c] anak Harun, imam itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “daftar perincian” atau “catatan pertanggungjawaban”; istilah Ibrani menunjuk pada perhitungan resmi.
    reason: lexical_alternative
  - marker: b
    text: “Kesaksian” kemungkinan merujuk pada kesaksian perjanjian, terutama loh-loh yang ditempatkan di dalam tabut.
    reason: cultural_note
  - marker: c
    text: Secara harfiah, “dengan tangan Itamar,” suatu ungkapan yang dapat menyatakan perantaraan atau pengawasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקוּדֵי
  choice: catatan perhitungan
  rationale: Bentuk nominal dari פקד di sini menunjuk pada perhitungan atau pertanggungjawaban resmi mengenai bahan-bahan Kemah Suci. Pilihan ini mempertahankan nuansa administratif sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: מִשְׁכָּן adalah sebutan baku bagi bangunan tempat kudus dalam kitab Keluaran. 'Kemah Suci' jelas bagi pembaca Indonesia dan sesuai dengan konteks, meskipun arti dasarnya adalah 'tempat kediaman'.
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: Kemah Kesaksian
  rationale: Pengulangan secara aposisional dipertahankan dan עֵדֻת diterjemahkan 'Kesaksian' agar kaitannya dengan kesaksian perjanjian tetap terbuka tanpa mempersempitnya dalam teks utama.
- source_word: פֻּקַּד
  choice: dibuat
  rationale: Dalam kaitannya dengan פְקוּדֵי, verba pasif ini menyatakan pelaksanaan pencatatan atau perhitungan resmi. 'Catatan itu dibuat' menyampaikan tindakan tersebut secara idiomatis tanpa mengulang 'dihitung' secara kaku.
- source_word: עַל פִּי מֹשֶׁה
  choice: atas perintah Musa
  rationale: Ungkapan harfiah 'menurut mulut Musa' merupakan idiom yang berarti menurut perkataan atau perintah Musa.
- source_word: עֲבֹדַת הַלְוִיִּם
  choice: sebagai bagian dari pelayanan orang Lewi
  rationale: עֲבֹדָה dalam konteks Kemah Suci menunjuk pada tugas pelayanan atau pekerjaan yang ditetapkan. Rumusan ini menghubungkannya secara alami dengan pembuatan catatan resmi.
- source_word: בְּיַד אִיתָמָר
  choice: di bawah pengawasan Itamar
  rationale: Ungkapan 'dengan tangan Itamar' di sini menyatakan perantaraan atau kewenangan pengawasan, bukan tindakan tangan secara harfiah.
- source_word: הַכֹּהֵן
  choice: sang imam
  rationale: Gelar definitif ini mengidentifikasi Harun sebagai imam; 'sang imam' mempertahankan fungsi aposisionalnya dengan gaya yang ringkas dan bermartabat.
theological_decisions:
- issue: Makna 'Kesaksian' dalam sebutan Kemah Kesaksian
  choice: Mempertahankan istilah 'Kesaksian' dalam teks utama
  alternative: Kemah dokumen perjanjian
  rationale: Konteks kemungkinan besar merujuk pada kesaksian perjanjian, terutama loh-loh yang ditempatkan dalam tabut, tetapi teks Ibrani tidak menguraikannya di ayat ini. Terjemahan tidak mempersempit rujukan itu secara dogmatis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dipecah secara ringan agar hubungan administratif dalam teks Ibrani dapat dipahami pembaca umum, sementara pengulangan 'Kemah Suci, yaitu Kemah Kesaksian' dan ambiguitas istilah 'Kesaksian' tetap dipertahankan.
