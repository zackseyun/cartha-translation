translation:
  language: id
  text: Tembaga[a] dari persembahan unjukan[b] itu berjumlah tujuh puluh talenta dan 2.400 syikal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “perunggu”; kata Ibrani נְחֹשֶׁת dapat berarti tembaga atau perunggu, bergantung pada konteks.'
    reason: lexical_alternative
  - marker: b
    text: “Persembahan unjukan” adalah istilah khusus bagi sesuatu yang dipersembahkan di hadapan TUHAN melalui gerakan ritual mengayunkannya; istilah ini juga dapat dipahami lebih umum sebagai persembahan yang disajikan atau sumbangan.
    reason: cultural_note
lexical_decisions:
- source_word: נְחֹשֶׁת
  choice: tembaga
  rationale: Istilah Ibrani ini dapat menunjuk pada tembaga atau perunggu. Dalam bahasa Indonesia, 'tembaga' merupakan padanan tradisional dan alami untuk bahan logam perlengkapan Kemah Suci, sementara kemungkinan 'perunggu' tetap dicatat dalam catatan kaki.
- source_word: הַתְּנוּפָה
  choice: persembahan unjukan
  rationale: Istilah teknis ini menunjuk pada persembahan yang disajikan di hadapan TUHAN dengan gerakan ritual mengunjukkan atau mengayunkannya. 'Persembahan unjukan' mempertahankan sifat teknis ritual tersebut.
- source_word: שִׁבְעִים כִּכָּר
  choice: tujuh puluh talenta
  rationale: כִּכָּר adalah satuan berat kuno yang besar. Satuan asli dipertahankan agar tidak memberi kesan ketepatan modern yang belum tentu pasti.
- source_word: וְאַלְפַּיִם וְאַרְבַּע מֵאוֹת שָׁקֶל
  choice: dan 2.400 syikal
  rationale: שֶׁקֶל adalah satuan berat kuno; bentuk Indonesia 'syikal' dipertahankan, sedangkan angka ditulis dengan angka modern agar mudah dibaca.
- source_word: וְ
  choice: dan
  rationale: Kata penghubung ini mengaitkan jumlah tersebut dengan daftar inventaris pada ayat sebelumnya. Dalam susunan Indonesia yang alami, hubungan itu dipertahankan tanpa harus membuka kalimat dengan 'Dan'.
