  text: וְ/כֶ֛סֶף פְּקוּדֵ֥י הָ/עֵדָ֖ה מְאַ֣ת כִּכָּ֑ר וְ/אֶלֶף֩ וּ/שְׁבַ֨ע מֵא֜וֹת וַ/חֲמִשָּׁ֧ה וְ/שִׁבְעִ֛ים שֶׁ֖קֶל בְּ/שֶׁ֥קֶל הַ/קֹּֽדֶשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/025.yaml
  text: And the silver of those counted from the congregation was one hundred talents and one thousand seven hundred seventy-five shekels[b][a], according to the sanctuary shekel.
translation:
  language: id
  text: Perak dari orang-orang yang dihitung dalam umat itu berjumlah seratus talenta dan seribu tujuh ratus tujuh puluh lima syikal, menurut syikal kudus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Artinya, ditimbang menurut standar berat syikal yang berlaku untuk tempat kudus.
    reason: cultural_note
lexical_decisions:
- source_word: כֶסֶף
  choice: perak
  rationale: Dalam konteks laporan bahan Kemah Suci, kata ini menunjuk pada logam perak yang dikumpulkan, bukan uang secara abstrak.
- source_word: פְּקוּדֵי
  choice: orang-orang yang dihitung
  rationale: Bentuk ini menunjuk pada mereka yang didaftarkan atau dihitung dalam sensus dan mempertahankan kaitannya dengan konteks pendataan.
- source_word: הָעֵדָה
  choice: umat
  rationale: Di sini istilah tersebut menunjuk pada komunitas Israel secara kolektif; 'umat' alami dan bermartabat dalam bahasa Indonesia, tanpa harus menyiratkan bahwa mereka sedang berhimpun.
- source_word: מְאַת כִּכָּר
  choice: seratus talenta
  rationale: '''Talenta'' mempertahankan nama satuan berat besar kuno dan menghindari konversi modern yang tidak pasti.'
- source_word: וְאֶלֶף וּשְׁבַע מֵאוֹת וַחֲמִשָּׁה וְשִׁבְעִים שֶׁקֶל
  choice: dan seribu tujuh ratus tujuh puluh lima syikal
  rationale: Urutan bilangan aditif Ibrani disajikan sebagai jumlah utuh dalam bentuk Indonesia yang jelas.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: menurut syikal kudus
  rationale: Ungkapan ini menyatakan standar berat yang dipakai. 'Menurut' menyampaikan fungsi pengukuran itu, sementara 'syikal kudus' menerjemahkan unsur leksikal הַקֹּדֶשׁ secara ringkas.
theological_decisions:
- issue: Makna 'syikal kudus' sebagai standar pengukuran
  choice: Mempertahankan ungkapan 'syikal kudus' dalam teks dan menjelaskan fungsinya dalam catatan kaki
  alternative: syikal tempat kudus
  rationale: Konstruksi Ibrani dapat dipahami sebagai syikal yang terkait dengan kekudusan atau tempat kudus. Terjemahan utama mempertahankan bentuk padat teks, sedangkan catatan menjelaskan bahwa yang dimaksud ialah standar berat resmi yang digunakan untuk keperluan tempat kudus.
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bernada laporan resmi. Istilah satuan kuno 'talenta' dan 'syikal' dipertahankan agar tidak memasukkan perkiraan konversi modern ke dalam teks.
