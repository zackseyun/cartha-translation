  text: All the hangings of the courtyard all around were of finely twisted linen[a].
translation:
  language: id
  text: Semua tirai di sekeliling pelataran itu terbuat dari kain linen yang dipintal halus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Semua bentangan kain di sekeliling pelataran itu terbuat dari linen yang dipintal halus.”
    reason: Alternatif leksikal untuk קַלְעֵי; mempertahankan makna frasa tekstil שֵׁשׁ מָשְׁזָר.
lexical_decisions:
- source_word: כָּל
  choice: Semua
  rationale: Menyatakan keseluruhan tirai secara kolektif dan wajar dalam bahasa Indonesia.
- source_word: קַלְעֵי
  choice: tirai
  rationale: Menunjuk pada bentangan kain yang membentuk pembatas pelataran; 'tirai' jelas dan alami dalam konteks bangunan Kemah Suci.
- source_word: הֶחָצֵר
  choice: pelataran
  rationale: Dalam konteks Kemah Suci, חָצֵר adalah ruang terbuka berpagar di bagian luar; 'pelataran' merupakan istilah Indonesia yang tepat dan bermartabat.
- source_word: סָבִיב
  choice: di sekelilingnya
  rationale: Mengungkapkan bahwa tirai itu membentang mengitari seluruh pelataran.
- source_word: שֵׁשׁ
  choice: kain linen
  rationale: Menunjuk pada bahan linen; penambahan 'kain' membuat jenis bahannya jelas dan alami bagi pembaca Indonesia.
- source_word: מָשְׁזָר
  choice: yang dipintal halus
  rationale: Menggambarkan pengerjaan benang yang dipintal atau dipilin; frasa ini alami dan mempertahankan keterangan mutu pengerjaannya.
