translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya ringkas dan bermartabat. Istilah 'pelataran' dipilih untuk konteks Kemah Suci, sedangkan 'tirai' mempertahankan gambaran kain pembatas tanpa memberi kesan dinding permanen.
