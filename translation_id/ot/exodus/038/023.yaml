revisions:
- from: Bersama dia ada Oholiab bin Ahisamakh[a], dari suku Dan, seorang perajin, perancang, dan penyulam yang bekerja dengan benang biru, ungu, dan kirmizi[b], serta lenan halus.
  to: Bersama dia juga ada Oholiab, anak Ahisamakh[a], dari suku Dan, seorang perajin, perancang, dan penyulam dalam pengerjaan kain biru, ungu, merah kirmizi[b], dan lenan halus.
  rationale: Revisi menghindari pembatasan bahan biru dan ungu sebagai “benang,” yang tidak dinyatakan secara eksplisit oleh teks Ibrani, dan memperbaiki kelancaran pengantar ayat. Istilah keahlian serta urutan empat bahan/warna dipertahankan. “Anak Ahisamakh” digunakan sebagai padanan baku yang netral untuk patronimik Ibrani.
