base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/023.yaml
  text: And with him was Oholiab son of Ahisamach[a], of the tribe of Dan, an engraver, a designer, and an embroiderer in blue, in purple, in scarlet yarn[b], and in fine linen.
translation:
  language: id
  text: Bersama dia juga ada Oholiab, anak Ahisamakh[a], dari suku Dan, seorang perajin, perancang, dan penyulam dalam pengerjaan kain biru, ungu, merah kirmizi[b], dan lenan halus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Aholiab”; transliterasi nama Ibrani ini dapat berbeda.
    reason: lexical_alternative
  - marker: b
    text: Frasa Ibrani ini menunjuk pada bahan tekstil berwarna merah kirmizi; bentuk bahan itu tidak dirinci dan dapat diterjemahkan secara singkat “kirmizi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִתּוֹ
  choice: Bersama dia ada
  rationale: Ungkapan ini menghubungkan Oholiab dengan Bezaleel pada ayat sebelumnya. Kata “ada” melengkapi konstruksi Ibrani tanpa verba agar alami dalam bahasa Indonesia.
- source_word: אָהֳלִיאָב בֶּן אֲחִיסָמָךְ
  choice: Oholiab bin Ahisamakh
  rationale: Nama diri ditransliterasikan dari bahasa Ibrani, sedangkan “bin” secara ringkas dan wajar menyatakan hubungan ayah-anak.
- source_word: לְמַטֵּה דָן
  choice: dari suku Dan
  rationale: Frasa ini menunjukkan asal atau keanggotaan suku.
- source_word: חָרָשׁ
  choice: perajin
  rationale: Kata Ibrani ini dapat menunjuk kepada pekerja terampil dalam berbagai kerajinan. “Perajin” mempertahankan cakupan umumnya dan sesuai dengan konteks pembuatan Kemah Suci.
- source_word: וְחֹשֵׁב
  choice: perancang
  rationale: Partisip ini menunjuk kepada orang yang merancang atau menghasilkan pola artistik; “perancang” menyampaikan unsur perencanaan kreatif tanpa membatasi tekniknya.
- source_word: וְרֹקֵם
  choice: penyulam
  rationale: Istilah ini menunjuk kepada pekerja sulam atau pembuat ragam hias pada kain.
- source_word: בַּתְּכֵלֶת וּבָאַרְגָּמָן
  choice: dengan benang biru, ungu
  rationale: Dalam konteks tekstil Kemah Suci, kedua istilah warna ini mengacu pada bahan berwarna. Kata “benang” dibuat eksplisit agar maksud tekstilnya jelas dalam bahasa Indonesia.
- source_word: וּבְתוֹלַעַת הַשָּׁנִי
  choice: dan kirmizi
  rationale: Ungkapan Ibrani menunjuk kepada bahan tekstil yang dicelup merah kirmizi. Kata “benang” yang telah disebut berlaku juga pada unsur ini, sementara catatan kaki mempertahankan ketidakpastian bentuk bahannya.
- source_word: וּבַשֵּׁשׁ
  choice: serta lenan halus
  rationale: Dalam konteks Kemah Suci, שֵׁשׁ adalah lenan bermutu halus; “lenan halus” merupakan padanan Indonesia yang jelas dan khusus.
