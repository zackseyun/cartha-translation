base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/003.yaml
  text: 'He made all the utensils of the altar: the pots[a], the shovels, the basins, the forks, and the firepans[b]. He made all its utensils of bronze.'
translation:
  language: id
  text: 'Ia membuat semua perkakas mezbah itu: periuk[a], sekop, bokor, garpu, dan wadah bara. Ia membuat semua perkakasnya dari perunggu.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani yang diterjemahkan “periuk” mungkin secara lebih khusus menunjuk pada wadah untuk mengangkut abu.
    reason: lexical_alternative
  - marker: b
    text: Atau “tembaga”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי הַמִּזְבֵּחַ
  choice: perkakas mezbah
  rationale: כְּלִי adalah istilah luas untuk peralatan atau bejana. “Perkakas” mencakup berbagai alat yang disebutkan dalam daftar dan terdengar alami dalam bahasa Indonesia modern.
- source_word: הַמִּזְבֵּחַ
  choice: mezbah
  rationale: “Mezbah” merupakan padanan baku dan ringkas untuk מִזְבֵּחַ dalam konteks ibadah Israel.
- source_word: הַסִּירֹת
  choice: periuk-periuk
  rationale: סִירוֹת pada dasarnya berarti periuk atau wadah sejenis. Konteks memungkinkan fungsi sebagai wadah abu, tetapi unsur “abu” tidak dinyatakan secara eksplisit dalam teks Ibrani.
- source_word: הַיָּעִים
  choice: penyodok-penyodok
  rationale: יַע menunjuk pada alat untuk menyodok atau menyekop; “penyodok” sesuai dengan penggunaan di sekitar mezbah.
- source_word: הַמִּזְרָקֹת
  choice: bokor-bokor
  rationale: מִזְרָקֹת adalah bejana ritual untuk menampung atau memercikkan cairan, khususnya darah. “Bokor” mempertahankan nuansa bejana upacara tanpa menambahkan fungsi yang tidak disebutkan.
- source_word: הַמִּזְלָגֹת
  choice: garpu-garpu
  rationale: Kata ini menunjuk pada perkakas bercabang seperti garpu. Padanan ini jelas dan tidak mempersempit maknanya menjadi alat khusus untuk daging.
- source_word: הַמַּחְתֹּת
  choice: wadah-wadah bara
  rationale: מַחְתָּה menunjuk pada wadah untuk mengambil atau membawa bara. “Wadah bara” lebih transparan bagi pembaca modern daripada istilah teknis atau arkais.
- source_word: כָּל כֵּלָיו
  choice: semua perkakasnya
  rationale: Akhiran pronominal mengacu kepada mezbah. Pengulangan “perkakas” menjaga hubungan dengan frasa pertama dan mempertahankan struktur teks.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Dalam konteks perlengkapan Kemah Suci, נְחֹשֶׁת lazim dan masuk akal diterjemahkan “perunggu”, meskipun secara leksikal “tembaga” juga mungkin.
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: Ia membuat ... dibuatnya
  rationale: Dua pemakaian עשה dipertahankan. Kalimat kedua dibuat pasif-agentif secara alami dalam bahasa Indonesia, tanpa menghilangkan penegasan bahwa orang yang sama membuat semua perkakas itu.
