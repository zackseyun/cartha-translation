base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/007.yaml
  text: He put the poles into the rings on the sides of the altar[a], to carry it with them. He made it hollow[b], with boards.
translation:
  language: id
  text: Ia memasukkan kayu-kayu pengusung itu ke dalam gelang-gelang pada sisi-sisi mazbah[a] untuk mengusungnya dengan kayu-kayu itu. Ia membuatnya berongga, dari papan-papan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Ia membawa kayu-kayu pengusung itu ke dalam gelang-gelang.” Kata kerja Ibrani secara lebih harfiah berarti “membawa”, tetapi dalam konteks ini menunjuk pada penempatan kayu-kayu itu pada posisinya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “berongga, papan-papan.” Frasa ini tampaknya berarti bahwa mazbah itu dibuat sebagai struktur berongga dari papan-papan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֵא
  choice: Ia memasukkan
  rationale: Bentuk kausatif dari בוא dalam konteks ini menyatakan tindakan menempatkan kayu pengusung ke dalam gelang; 'memasukkan' alami dan mempertahankan arah geraknya.
- source_word: הַבַּדִּים
  choice: kayu-kayu pengusung
  rationale: Dalam konteks Kemah Suci, istilah ini menunjuk pada batang kayu yang digunakan untuk mengangkut perlengkapan kudus; pilihan ini lebih jelas daripada sekadar 'kayu-kayu'.
- source_word: בַּטַּבָּעֹת
  choice: ke dalam gelang-gelang
  rationale: Preposisi ב dengan verba gerak menunjukkan penempatan ke dalam gelang-gelang.
- source_word: עַל צַלְעֹת הַמִּזְבֵּחַ
  choice: pada sisi-sisi mazbah
  rationale: צלעות menunjuk pada sisi atau bagian samping; terjemahan ini mempertahankan lokasi fisik tanpa memperinci lebih jauh.
- source_word: לָשֵׂאת אֹתוֹ בָּהֶם
  choice: untuk mengangkutnya dengan kayu-kayu itu
  rationale: Klausa infinitif menyatakan tujuan, dan anteseden pronomina jamak diperjelas sebagai kayu-kayu pengusung.
- source_word: נְבוּב
  choice: berongga
  rationale: Kata ini menggambarkan struktur mazbah yang kosong di bagian dalam.
- source_word: לֻחֹת
  choice: dari papan-papan
  rationale: Frasa Ibrani bersifat eliptis, secara harfiah mendekati 'berongga, papan-papan'; 'dari papan-papan' menyampaikan bahan atau konstruksinya tanpa terlalu menjelaskan.
- source_word: עָשָׂה אֹתוֹ
  choice: Ia membuat mazbah itu
  rationale: Objek pronominal diperjelas sebagai mazbah agar rujukannya langsung dan alami dalam bahasa Indonesia.
