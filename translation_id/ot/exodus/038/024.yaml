base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/024.yaml
  text: All the gold that was used for the work[a], in all the work of the sanctuary—the gold of the wave offering—was twenty-nine talents and seven hundred thirty shekels[b], according to the sanctuary shekel.
translation:
  language: id
  text: Seluruh emas yang digunakan untuk seluruh pekerjaan tempat kudus—emas persembahan unjukan[a]—berjumlah 29 talenta dan 730 syikal, menurut syikal tempat kudus.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Persembahan unjukan” adalah persembahan yang disajikan di hadapan TUHAN dengan suatu gerakan ritual.
    reason: cultural_note
  - marker: b
    text: “Syikal tempat kudus” adalah standar berat yang dipakai dalam konteks ibadah.
    reason: cultural_note
lexical_decisions:
- source_word: הֶעָשׂוּי לַמְּלָאכָה
  choice: yang digunakan untuk pekerjaan itu
  rationale: Partisipel pasif עשה dalam konteks laporan pembangunan menunjuk pada emas yang dipakai dalam pekerjaan Kemah Suci; “digunakan” lebih jelas daripada “dibuat,” yang dapat menyiratkan bahwa emas itu sendiri dibuat.
- source_word: בְּכֹל מְלֶאכֶת הַקֹּדֶשׁ
  choice: untuk segala pekerjaan di tempat kudus
  rationale: Frasa ini merangkum seluruh pekerjaan yang berkaitan dengan tempat kudus. Preposisi diterjemahkan secara idiomatis sesuai hubungannya dengan emas yang digunakan bagi proyek tersebut.
- source_word: זְהַב הַתְּנוּפָה
  choice: emas persembahan unjukan
  rationale: תְּנוּפָה adalah istilah ibadah bagi persembahan yang disajikan di hadapan TUHAN dengan gerakan ritual; “persembahan unjukan” mempertahankan istilah khusus itu.
- source_word: תֵּשַׁע וְעֶשְׂרִים כִּכָּר וּשְׁבַע מֵאוֹת וּשְׁלֹשִׁים שֶׁקֶל
  choice: 29 talenta dan 730 syikal
  rationale: Angka disajikan menurut urutan alami bahasa Indonesia modern, sementara satuan berat kuno dipertahankan agar tidak memberi konversi modern yang terlalu pasti.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: menurut syikal tempat kudus
  rationale: Frasa ini menyatakan standar berat resmi yang dipakai; “menurut” menyampaikan fungsi normatif preposisi בְּ secara alami.
