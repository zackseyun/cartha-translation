translation:
  language: id
  text: alas-alas di sekeliling pelataran[a], alas-alas pintu gerbang pelataran, semua pasak Kemah Suci[b], dan semua pasak di sekeliling pelataran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tumpuan-tumpuan” untuk “alas-alas.”
    reason: lexical_alternative
  - marker: b
    text: Atau “patok-patok” untuk “pasak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַדְנֵי
  choice: alas-alas
  rationale: Dalam konteks pembangunan Kemah Suci, istilah ini menunjuk pada bagian fondasi tempat tiang atau rangka dipasang. 'Alas' konkret, mudah dipahami, dan cocok bagi pelataran maupun pintu gerbang.
- source_word: חָצֵר
  choice: pelataran
  rationale: '''Pelataran'' secara alami menunjuk pada ruang terbuka yang dibatasi di sekeliling tempat suci.'
- source_word: סָבִיב
  choice: di sekelilingnya
  rationale: Ungkapan ini mempertahankan arti bahwa unsur-unsur tersebut berada mengitari seluruh pelataran, tanpa mengubahnya menjadi sifat yang berpotensi ambigu.
- source_word: שַׁעַר
  choice: pintu gerbang
  rationale: Istilah ini menunjuk pada akses masuk pelataran; 'pintu gerbang' merupakan padanan Indonesia yang jelas dan lazim.
- source_word: יִתְדֹת
  choice: pasak
  rationale: '''Pasak'' tepat untuk benda yang ditancapkan guna menahan atau mengikat Kemah Suci dan pelatarannya.'
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: Dalam konteks Keluaran, istilah ini merupakan sebutan khusus bagi tempat kudus portabel. 'Kemah Suci' alami dalam bahasa Indonesia dan mempertahankan kekhususan rujukannya.
- source_word: כָּל
  choice: semua
  rationale: '''Semua'' secara wajar mencakup keseluruhan pasak dalam kedua kelompok yang disebutkan.'
- source_word: וְאֵת / וְאֶת
  choice: dan
  rationale: Gabungan waw dengan penanda objek langsung meneruskan daftar inventaris; dalam bahasa Indonesia, koordinasi dengan 'dan' cukup, sedangkan penanda objeknya tidak perlu diterjemahkan tersendiri.
