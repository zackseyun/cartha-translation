  source_fidelity: 'Teks Indonesia secara tepat mencerminkan unsur-unsur utama Ibrani: pembuatan kisi-kisi bagi mezbah, konstruksi berjaring dari perunggu, letaknya di bawah כַּרְכֻּבּוֹ, serta rentangnya dari bawah hingga pertengahan. Penjelasan "tingginya" merupakan penjelasan spasial yang wajar dalam konteks benda mezbah dan tidak mengubah makna.'
