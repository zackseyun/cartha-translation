id: EXO.38.4
reference: Exodus 38:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ לַ/מִּזְבֵּ֨חַ֙ מִכְבָּ֔ר מַעֲשֵׂ֖ה רֶ֣שֶׁת נְחֹ֑שֶׁת תַּ֧חַת כַּרְכֻּבּ֛/וֹ מִ/לְּ/מַ֖טָּה עַד חֶצְיֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/004.yaml
  text: He made for the altar a grating[a], a network of bronze, under its ledge, beneath[c][b], up to its halfway point.
translation:
  language: id
  text: Ia membuat untuk mezbah itu sebuah kisi-kisi[a] dari perunggu, berupa anyaman jala, di bawah bingkai mezbah itu[b], dari bagian bawah sampai ke pertengahan tingginya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jeruji, buatan berbentuk jala, dari perunggu.”
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani bagi bagian struktural mezbah ini juga dapat diterjemahkan “birai”, “pinggiran”, atau “tonjolan yang mengelilinginya”.
    reason: lexical_alternative
  - marker: c
    text: 'Secara lebih harfiah: “dari bawah sampai ke pertengahannya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia membuat
  rationale: Bentuk wayyiqtol melanjutkan rangkaian narasi. Dalam bahasa Indonesia, kesinambungan itu dapat dinyatakan secara alami tanpa harus mengawali kalimat dengan “dan”.
- source_word: לַמִּזְבֵּחַ
  choice: untuk mezbah itu
  rationale: Preposisi ל menunjukkan bahwa benda tersebut dibuat bagi atau untuk mezbah, bukan sekadar berada di atasnya.
- source_word: מִכְבָּר
  choice: sebuah kisi-kisi
  rationale: Kata ini menunjuk pada struktur menyerupai jeruji atau kisi. “Kisi-kisi” mudah dipahami dan sesuai dengan keterangan tentang bentuk jala yang mengikutinya.
- source_word: מַעֲשֵׂה רֶשֶׁת
  choice: berupa anyaman jala
  rationale: Secara harfiah frasa ini berarti karya atau bentukan jala. Pilihan ini mempertahankan gambaran konstruksi berjaring dalam bahasa Indonesia yang wajar.
- source_word: נְחֹשֶׁת
  choice: dari perunggu
  rationale: Dalam konteks perlengkapan Kemah Suci, “perunggu” merupakan padanan yang lazim dan masuk akal; “tembaga” tetap mungkin secara leksikal.
- source_word: תַּחַת
  choice: di bawah
  rationale: Padanan ruang yang langsung, jelas, dan alami.
- source_word: כַּרְכֻּבּוֹ
  choice: bingkai mezbah itu
  rationale: Istilah Ibrani ini menunjuk pada unsur struktural yang mengelilingi atau menonjol pada mezbah, tetapi bentuk tepatnya tidak pasti. “Bingkai” cukup umum dan tidak terlalu menentukan rekonstruksi fisiknya.
- source_word: מִלְּמַטָּה
  choice: dari bagian bawah
  rationale: Mempertahankan unsur מן, “dari,” dan menunjukkan titik awal rentang vertikal kisi-kisi.
- source_word: עַד חֶצְיוֹ
  choice: sampai ke pertengahan tingginya
  rationale: Menunjukkan batas vertikal pada separuh tinggi mezbah secara jelas, tanpa mengubahnya menjadi ukuran yang lebih khusus.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang tetap dekat pada bentuk dan hubungan ruang dalam teks Ibrani. Istilah teknis dibuat cukup mudah dipahami, sedangkan ketidakpastian bentuk כַּרְכֻּב dijaga melalui catatan kaki.
