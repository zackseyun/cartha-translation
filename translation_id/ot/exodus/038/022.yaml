id: EXO.38.22
reference: Exodus 38:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בְצַלְאֵ֛ל בֶּן אוּרִ֥י בֶן ח֖וּר לְ/מַטֵּ֣ה יְהוּדָ֑ה עָשָׂ֕ה אֵ֛ת כָּל אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/038/022.yaml
  text: And Bezalel son of Uri[a], son of Hur, of the tribe of Judah, made all that Yahweh had commanded Moses.
translation:
  language: id
  text: Bezalel, anak Uri, anak Hur, dari suku Yehuda, membuat semua yang diperintahkan Yahweh[a] kepada Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN”.'
    reason: Menjelaskan bentuk nama ilahi dalam teks sumber serta padanan tradisionalnya.
lexical_decisions:
- source_word: וּבְצַלְאֵל
  choice: Bezalel
  rationale: Konjungsi ו menghubungkan ayat ini dengan uraian sebelumnya, tetapi tidak perlu diterjemahkan secara tersendiri karena pembukaan langsung dengan nama tokoh lebih alami dalam bahasa Indonesia dan hubungan naratif tetap jelas.
- source_word: בֶּן אוּרִי בֶן חוּר
  choice: anak Uri, anak Hur
  rationale: Dalam urutan silsilah ini, בֶּן paling wajar berarti 'anak'. Susunan berulang dipertahankan agar hubungan genealogis tetap dekat dengan bentuk Ibrani.
- source_word: לְמַטֵּה יְהוּדָה
  choice: dari suku Yehuda
  rationale: מַטֶּה secara harfiah dapat berarti 'tongkat', tetapi dalam konteks afiliasi Israel berarti 'suku'; preposisi לְ menyatakan keanggotaan atau asal kelompok.
- source_word: עָשָׂה
  choice: membuat
  rationale: Dalam konteks pengerjaan Kemah Suci, verba עשה menunjuk pada tindakan menghasilkan atau mengerjakan benda-benda yang diperintahkan, sehingga 'membuat' lebih tepat daripada sekadar 'melakukan'.
- source_word: אֵת כָּל אֲשֶׁר
  choice: semua yang
  rationale: Ungkapan ini menyatakan keseluruhan hal yang diperintahkan. 'Semua yang' ringkas, alami, dan mempertahankan cakupan menyeluruh teks.
- source_word: צִוָּה
  choice: diperintahkan
  rationale: Bentuk pasif relatif dalam bahasa Indonesia menghasilkan kalimat yang alami sambil mempertahankan Yahweh sebagai pelaku perintah dan Musa sebagai penerimanya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, agar nama pribadi dalam teks sumber tetap terlihat.
- source_word: אֶת מֹשֶׁה
  choice: kepada Musa
  rationale: אֵת menandai Musa sebagai objek dari verba 'memerintahkan'. Dalam idiom bahasa Indonesia, penerima perintah dinyatakan secara alami dengan 'kepada Musa'.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. Bentuk 'Yahweh' mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar; catatan kaki memberi tahu pembaca mengenai bentuk Ibraninya dan kebiasaan penerjemahan tradisional.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur silsilah dipertahankan tanpa membuat kalimat terasa kaku. Penanda catatan kaki ditempatkan sesudah 'Yahweh' karena catatan itu menerangkan nama ilahi, bukan nama Uri.
