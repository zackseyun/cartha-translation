  yaml_path: translation/ot/exodus/038/008.yaml
  text: He made the basin of bronze and its stand of bronze from the mirrors of the women who served at the entrance to the tent of meeting[a][b].
translation:
  language: id
  text: Ia membuat bejana dari perunggu dan penyangganya dari perunggu, dari cermin-cermin[b] para perempuan yang melayani[a] di pintu masuk Kemah Pertemuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “para perempuan yang berkumpul di pintu masuk Kemah Pertemuan.” Ungkapan Ibrani ini dapat menekankan perkumpulan yang teratur maupun pelayanan.'
    reason: alternative_reading
  - marker: b
    text: Cermin pada zaman itu biasanya dibuat dari logam yang dipoles, umumnya perunggu, bukan dari kaca.
    reason: cultural_note
lexical_decisions:
- source_word: כִּיּוֹר
  choice: bejana pembasuhan
  rationale: Menunjuk pada bejana besar untuk membasuh dalam pelayanan Kemah Suci. Pilihan ini menjelaskan fungsinya secara alami dalam bahasa Indonesia modern tanpa memakai istilah kuno.
- source_word: כַּן
  choice: penyangga
  rationale: Menunjuk pada alas atau struktur yang menopang bejana; 'penyangga' jelas dan alami untuk benda fisik ini.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Dalam konteks perlengkapan Kemah Suci, istilah ini secara wajar diterjemahkan 'perunggu', meskipun kata Ibraninya dapat mencakup tembaga dan paduannya.
- source_word: בְּמַרְאֹת
  choice: dengan memakai cermin-cermin milik
  rationale: Preposisi ב dipahami sebagai penanda bahan atau sumber. Ungkapan ini menyampaikan bahwa logam cermin-cermin tersebut dipakai untuk membuat bejana dan penyangganya, tanpa menyiratkan cermin kaca modern.
- source_word: הַצֹּבְאֹת אֲשֶׁר צָבְאוּ
  choice: para perempuan yang melayani
  rationale: Pengulangan akar צבא dapat menggambarkan pengerahan atau perkumpulan untuk suatu pelayanan. 'Melayani' menyampaikan kegiatan yang bertujuan dalam konteks tempat suci tanpa menegaskan jabatan keimaman yang tidak disebutkan teks.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: di pintu masuk Kemah Pertemuan
  rationale: Terjemahan yang alami dan tepat bagi lokasi di jalan masuk menuju kemah; nama 'Kemah Pertemuan' dipertahankan sebagai sebutan baku.
- source_word: וַיַּעַשׂ
  choice: Ia membuat
  rationale: Bentuk naratif lampau dengan subjek tunggal diterjemahkan secara langsung; konteks sebelumnya menyediakan rujukan bagi 'Ia'.
theological_decisions:
- issue: Identitas dan peranan הַצֹּבְאֹת אֲשֶׁר צָבְאוּ
  choice: para perempuan yang melayani di pintu masuk Kemah Pertemuan
  alternative: para perempuan yang berkumpul di pintu masuk Kemah Pertemuan
  rationale: Akar צבא dapat berarti berkumpul atau dikerahkan untuk pelayanan. Teks tidak merinci jabatan keimaman ataupun fungsi liturgis mereka, sehingga 'melayani' mempertahankan kegiatan yang bertujuan tanpa memasukkan doktrin yang melampaui teks; kemungkinan makna 'berkumpul' dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Bejana pembasuhan' dipilih agar fungsi כִּיּוֹר langsung dipahami; 'Kemah Pertemuan' mengikuti istilah Alkitabiah Indonesia yang umum. Kedua penanda catatan kaki ditempatkan pada frasa yang relevan dalam teks utama.
