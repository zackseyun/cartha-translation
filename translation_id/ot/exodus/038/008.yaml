revisions:
- from: Ia membuat bejana pembasuhan dari perunggu dan penyangganya dari perunggu, dengan memakai cermin-cermin milik para perempuan yang melayani di pintu masuk Kemah Pertemuan[a][b].
  to: Ia membuat bejana dari perunggu dan penyangganya dari perunggu, dari cermin-cermin[b] para perempuan yang melayani[a] di pintu masuk Kemah Pertemuan.
  rationale: Revisi mengembalikan makna bahan/sumber dari preposisi Ibrani pada “dari cermin-cermin,” menghapus tambahan yang tidak diperlukan (“milik”), dan memakai “bejana” sebagai padanan langsung bagi כִּיּוֹר. Terjemahan “para perempuan yang melayani” dipertahankan, dengan alternatif “berkumpul” dalam catatan kaki untuk menjaga ambiguitas leksikal צבא. Penanda catatan kaki diposisikan ulang sesuai rujukannya.
