  yaml_path: translation/ot/exodus/002/001.yaml
  text: A man from the house of Levi went and took a daughter of Levi as his wife[a].
translation:
  language: id
  text: Seorang laki-laki dari kaum Lewi pergi dan memperistri seorang perempuan keturunan Lewi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seorang anak perempuan Lewi”, yaitu seorang perempuan keturunan Lewi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: pergi
  rationale: Kata kerja הלך pada bentuk wayyiqtol biasanya berarti “pergi”. Terjemahan ini mempertahankan urutan tindakan dalam bahasa Ibrani tanpa menambahkan penanda waktu yang tidak ada dalam teks sumber.
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: אִישׁ di sini menunjuk kepada seorang pria yang pada awal kisah belum disebutkan namanya. “Seorang laki-laki” mempertahankan anonimitas naratif itu.
- source_word: מִבֵּית לֵוִי
  choice: dari kaum Lewi
  rationale: Ungkapan בֵּית לֵוִי menunjukkan garis keluarga atau kelompok keturunan Lewi. Dalam bahasa Indonesia, “kaum Lewi” terdengar alami dan tetap membawa nuansa genealogis, tanpa mempersempitnya menjadi keluarga inti.
- source_word: וַיִּקַּח
  choice: memperistri
  rationale: לקח secara harfiah berarti “mengambil”, tetapi dalam konteks perkawinan berarti mengambil seorang perempuan sebagai istri. “Memperistri” menyampaikan makna idiomatisnya secara jelas dan wajar dalam bahasa Indonesia.
- source_word: אֶת
  choice: '[penanda objek langsung, tidak diterjemahkan]'
  rationale: אֶת menandai objek langsung tertentu dalam bahasa Ibrani dan tidak memerlukan padanan kata tersendiri dalam bahasa Indonesia.
- source_word: בַּת לֵוִי
  choice: seorang perempuan keturunan Lewi
  rationale: Secara harfiah ungkapan ini berbunyi “seorang anak perempuan Lewi”, tetapi secara genealogis berarti seorang perempuan dari garis keturunan Lewi. Pilihan ini menghindari kesan keliru bahwa ia adalah anak langsung Lewi, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
