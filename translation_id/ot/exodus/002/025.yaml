  text: Allah melihat orang Israel, dan Allah tahu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Allah mengetahui.” Teks Ibrani tidak menyebutkan objek dari kata kerja ini.'
    reason: Menjelaskan bahwa objek bagi kata kerja Ibrani tidak dinyatakan dan bahwa terjemahan alternatif yang lebih formal juga mungkin.
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah berarti “anak-anak Israel,” tetapi dalam konteks ini merupakan sebutan kolektif bagi bangsa Israel; “orang Israel” lebih alami dalam bahasa Indonesia modern.
- source_word: וַיַּרְא
  choice: melihat
  rationale: Mempertahankan arti langsung verba ראה tanpa menambahkan penafsiran seperti “memperhatikan.”
- source_word: וַיֵּדַע
  choice: mengetahui
  rationale: Menerjemahkan verba ידע secara langsung dan mempertahankan ketegangan serta ketidaklengkapan objek dalam teks Ibrani.
theological_decisions:
- issue: Makna tindakan Allah dalam frasa penutup tanpa objek eksplisit
  choice: Allah mengetahui
  alternative: Allah memperhatikan keadaan mereka
  rationale: Teks sumber hanya menyatakan bahwa Allah “mengetahui” tanpa menyebut objek. Terjemahan tidak mengisi objek atau menjelaskan tindakan itu secara teologis, sehingga ambiguitas asli tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Pengulangan “Allah” dipertahankan sesuai penekanan teks Ibrani; “orang Israel” dipilih sebagai padanan idiomatis bagi sebutan kolektif harfiah “anak-anak Israel.”
