  text: וַ/תֵּ֤רֶד בַּת פַּרְעֹה֙ לִ/רְחֹ֣ץ עַל הַ/יְאֹ֔ר וְ/נַעֲרֹתֶ֥י/הָ הֹלְכֹ֖ת עַל יַ֣ד הַ/יְאֹ֑ר וַ/תֵּ֤רֶא אֶת הַ/תֵּבָה֙ בְּ/ת֣וֹךְ הַ/סּ֔וּף וַ/תִּשְׁלַ֥ח אֶת אֲמָתָ֖/הּ וַ/תִּקָּחֶֽ/הָ־־־־־
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/005.yaml
  text: Then Pharaoh’s daughter went down to bathe at the Nile[a], while her young women were walking along the bank of the Nile. She saw the basket in the midst of the reeds[c][b], and she sent her servant girl and took it.
translation:
  language: id
  text: Kemudian putri Firaun turun untuk mandi di Sungai Nil, sementara dayang-dayangnya berjalan menyusuri tepi sungai itu. Ia melihat keranjang di tengah rumpun gelagah[a], lalu mengutus pelayan perempuannya dan mengambil keranjang itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “keranjang” juga dipakai untuk “bahtera” Nuh dalam Kejadian 6–9.
    reason: cross_reference
  - marker: b
    text: Secara lebih dekat, “ia mengutus pelayan perempuannya, lalu ia mengambilnya.” Menurut pembacaan tradisional lain, frasa itu dipahami sebagai “ia mengulurkan tangannya dan mengambilnya.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּרֶד
  choice: turun
  rationale: Mempertahankan makna arah dasar verba ירד dengan ungkapan Indonesia yang wajar.
- source_word: בַּת פַּרְעֹה
  choice: putri Firaun
  rationale: Bentuk konstruksi Ibrani dialihkan secara idiomatis; 'putri' wajar bagi anak perempuan seorang penguasa.
- source_word: לִרְחֹץ
  choice: untuk mandi
  rationale: Dalam konteks pergi ke Sungai Nil, רחץ paling alami dipahami sebagai mandi, bukan sekadar membasuh.
- source_word: עַל הַיְאֹר
  choice: di Sungai Nil
  rationale: Preposisi עַל berfungsi lokatif dalam konteks ini; 'di' alami dalam bahasa Indonesia dan tidak menyiratkan berada di atas permukaan air.
- source_word: וְנַעֲרֹתֶיהָ
  choice: dayang-dayangnya
  rationale: נערות menunjuk para perempuan muda yang menyertai putri Firaun; 'dayang-dayang' menyampaikan fungsi mereka secara alami dalam konteks istana, meski fungsi itu bersifat kontekstual.
- source_word: הֹלְכֹת
  choice: berjalan
  rationale: Partisipel menggambarkan tindakan latar yang sedang berlangsung, yang ditopang oleh 'sementara'.
- source_word: עַל יַד הַיְאֹר
  choice: menyusuri tepi sungai itu
  rationale: Idiom עַל יַד berarti di sisi atau sepanjang; terjemahan ini menyampaikan lokasi dan gerakan secara alami.
- source_word: הַתֵּבָה
  choice: keranjang
  rationale: Dalam konteks bayi Musa, 'keranjang' paling jelas menggambarkan wadah kecil tersebut; hubungan leksikal dengan bahtera Nuh dipertahankan dalam catatan kaki.
- source_word: בְּתוֹךְ הַסּוּף
  choice: di tengah rumpun gelagah
  rationale: סוּף menunjuk tumbuhan air seperti gelagah atau papirus; 'rumpun gelagah' memberikan gambaran lokasi yang alami tanpa menentukan spesies secara berlebihan.
- source_word: וַתִּשְׁלַח אֶת אֲמָתָהּ וַתִּקָּחֶהָ
  choice: lalu menyuruh pelayan perempuannya mengambilnya
  rationale: Secara harfiah rangkaian ini adalah 'ia mengutus pelayan perempuannya, lalu mengambilnya'; bahasa Indonesia secara alami menyatakan maksud pengutusan itu sebagai menyuruh pelayan mengambil keranjang. Alternatif tradisional 'mengulurkan tangannya' dicatat.
theological_decisions:
- issue: Hubungan תֵּבָה dalam kisah Musa dengan bahtera Nuh
  choice: keranjang dalam teks utama, dengan hubungan leksikal dijelaskan dalam catatan kaki
  alternative: bahtera
  rationale: Ukuran dan konteks benda di sini mendukung 'keranjang', sementara pemakaian kata Ibrani yang sama dalam Kejadian 6–9 tetap penting dan tidak boleh disembunyikan.
- issue: Pembacaan אֲמָתָהּ
  choice: pelayan perempuannya
  alternative: tangannya
  rationale: Teks Masoret dan konstruksi dengan שׁלח paling langsung mendukung seseorang yang disuruh pergi. Pembacaan tradisional 'tangannya' merupakan alternatif yang layak dicatat, bukan dimasukkan diam-diam ke teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. 'Firaun' dan 'Sungai Nil' mengikuti bentuk yang lazim. Susunan klausa mempertahankan tindakan utama dan tindakan latar teks Ibrani, sedangkan klausa terakhir dibuat idiomatis tanpa menghapus alternatif tekstual/tradisional.
