  text: Pharaoh’s daughter said to her, “Go.” So the young woman went and called the child’s mother.
translation:
  language: id
  text: Putri Firaun berkata kepadanya, “Pergilah.” Lalu perempuan muda itu pergi dan memanggil ibu anak itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּת פַּרְעֹה
  choice: Putri Firaun
  rationale: Frasa konstruksi ini berarti anak perempuan Firaun; bentuk ini alami dan ringkas dalam bahasa Indonesia modern.
- source_word: לֵכִי
  choice: Pergilah
  rationale: Imperatif feminin tunggal dari הלך. Bentuk “Pergilah” mempertahankan perintah yang singkat dan langsung.
- source_word: הָעַלְמָה
  choice: perempuan muda itu
  rationale: עַלְמָה menunjuk kepada seorang perempuan muda; pilihan ini mempertahankan cakupan leksikalnya tanpa memakai istilah arkais atau mempersempitnya menjadi “gadis”.
- source_word: וַתִּקְרָא אֶת אֵם הַיָּלֶד
  choice: memanggil ibu anak itu
  rationale: קרא dengan penanda objek dapat berarti memanggil atau menyuruh datang. “Memanggil” alami dalam konteks dan mempertahankan kelangsungan narasi Ibrani.
- source_word: הַיָּלֶד
  choice: anak itu
  rationale: יֶלֶד berarti anak atau anak laki-laki. Konteks menunjukkan bayi Musa, tetapi “anak itu” mengikuti kadar kekhususan frasa Ibrani.
