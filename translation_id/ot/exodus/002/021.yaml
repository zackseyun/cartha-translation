  text: And Moses agreed to dwell with the man[b][a], and he gave Zipporah his daughter to Moses.
translation:
  language: id
  text: Musa bersedia tinggal bersama orang itu[a], lalu orang itu memberikan Zipora[b], anak perempuannya, kepada Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Musa setuju untuk tinggal bersama orang itu.” Kata kerja Ibrani yang digunakan dapat menyatakan kesediaan, persetujuan, atau kerelaan.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, orang itu memberikan Zipora kepada Musa untuk menjadi istrinya.
    reason: cultural_note
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: bersedia
  rationale: Dalam bentuk dan konstruksi ini, יאל menyatakan kemauan atau persetujuan. “Bersedia” alami dalam bahasa Indonesia dan tetap mempertahankan nuansa kehendak tanpa memaksakan arti yang lebih sempit.
- source_word: לָשֶׁבֶת
  choice: tinggal
  rationale: Walaupun ישב secara dasar dapat berarti “duduk”, dalam konteks ini infinitif tersebut menunjuk pada menetap atau hidup bersama seseorang; “tinggal” adalah padanan Indonesia yang paling alami.
- source_word: אֶת הָאִישׁ
  choice: bersama orang itu
  rationale: Dalam konstruksi ישב את, partikel אֶת menyertai orang yang dengannya Musa tinggal. “Orang itu” mempertahankan nomina umum הָאִישׁ tanpa memasukkan nama yang tidak terdapat dalam ayat ini.
- source_word: וַיִּתֵּן
  choice: lalu orang itu memberikan
  rationale: נתן secara langsung berarti “memberikan”. Subjek diulangi sebagai “orang itu” agar rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: צִפֹּרָה
  choice: Zipora
  rationale: Nama Ibrani צִפֹּרָה ditransliterasikan sesuai bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בִתּוֹ
  choice: anak perempuannya
  rationale: Akhiran pronominal menunjuk kepada orang itu sebagai ayah Zipora; bentuk ini menerjemahkan hubungan tersebut secara langsung.
- source_word: לְמֹשֶׁה
  choice: kepada Musa
  rationale: Preposisi לְ menandai penerima. Makna perkawinan tersirat oleh konteks dan dijelaskan dalam catatan kaki, bukan ditambahkan diam-diam ke teks utama.
