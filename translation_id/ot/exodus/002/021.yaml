translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Urutan klausa Ibrani dipertahankan, sedangkan subjek klausa kedua diperjelas untuk mencegah ambiguitas rujukan. Semua penanda catatan kaki ditempatkan pada unsur teks yang diterangkannya.
