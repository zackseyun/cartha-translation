base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/009.yaml
  text: Then Pharaoh’s daughter said to her[a], “Take this child and nurse him for me, and I will give you your wages.” So the woman took the child and nursed him.
translation:
  language: id
  text: Lalu putri Firaun berkata kepadanya, “Bawalah anak ini dan susuilah dia untukku; aku akan memberimu upah.” Maka perempuan itu mengambil anak itu dan menyusuinya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּת פַּרְעֹה
  choice: putri Firaun
  rationale: Bentuk konstruksi ini menyatakan hubungan keluarga; “putri Firaun” alami dan tepat dalam bahasa Indonesia.
- source_word: הֵילִיכִי
  choice: Bawalah
  rationale: Imperatif hifil dari הלך di sini menyuruh perempuan itu membawa anak tersebut pergi untuk diasuh dan disusui; “bawalah” mempertahankan unsur gerak dengan wajar.
- source_word: הַיֶּלֶד הַזֶּה
  choice: anak ini
  rationale: יֶלֶד dapat berarti anak atau anak laki-laki; konteks telah menunjukkan jenis kelaminnya, tetapi ungkapan umum “anak ini” paling dekat dengan bentuk Ibrani.
- source_word: וְהֵינִקִהוּ לִי
  choice: dan susuilah dia untukku
  rationale: Kata kerja ינק dalam bentuk kausatif menunjuk pada tindakan menyusui bayi. “Untukku” mempertahankan לִי, yakni pelayanan yang dilakukan atas nama putri Firaun.
- source_word: וַאֲנִי אֶתֵּן אֶת שְׂכָרֵךְ
  choice: aku akan memberimu upah
  rationale: שָׂכָר berarti upah atau bayaran atas pekerjaan; rumusan ini dekat dengan susunan Ibrani sekaligus alami dalam bahasa Indonesia.
- source_word: הָאִשָּׁה
  choice: perempuan itu
  rationale: Teks menyebutnya “perempuan itu,” bukan “ibunya.” Pilihan ini tidak menambahkan identitas yang hanya diketahui dari konteks.
- source_word: וַתִּקַּח הָאִשָּׁה הַיֶּלֶד
  choice: Maka perempuan itu membawa anak tersebut
  rationale: לקח dapat berarti mengambil atau membawa. Karena ia menerima anak itu untuk dibawa dan disusui, “membawa” paling alami dalam konteks ini.
- source_word: וַתְּנִיקֵהוּ
  choice: dan menyusuinya
  rationale: Bentuk hifil menyatakan bahwa perempuan itu menyusui anak tersebut; pilihan ini konsisten dengan perintah sebelumnya dan jelas dalam bahasa Indonesia modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Menyusui” dipilih karena secara jelas berarti memberi ASI dalam konteks bayi; tidak diperlukan catatan kaki leksikal seperti dalam bahasa Inggris, karena ambiguitas kata “nurse” tidak muncul dalam bahasa Indonesia.
