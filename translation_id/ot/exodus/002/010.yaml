  text: וַ/יִגְדַּ֣ל הַ/יֶּ֗לֶד וַ/תְּבִאֵ֨/הוּ֙ לְ/בַת פַּרְעֹ֔ה וַֽ/יְהִי לָ֖/הּ לְ/בֵ֑ן וַ/תִּקְרָ֤א שְׁמ/וֹ֙ מֹשֶׁ֔ה וַ/תֹּ֕אמֶר כִּ֥י מִן הַ/מַּ֖יִם מְשִׁיתִֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/010.yaml
  text: When the child grew[a], she brought him to Pharaoh’s daughter, and he became her son. She named him Moses, for she said[b], “I drew him out of the water.”
translation:
  language: id
  text: Ketika anak itu sudah besar, ibunya membawanya kepada putri Firaun, lalu ia menjadi anaknya.[a] Putri Firaun menamainya Musa, sebab ia berkata, “Aku telah menariknya keluar dari air.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ia menjadi anak baginya”; dapat pula dipahami, “ia menjadi seperti anak baginya.”
    reason: lexical_alternative
  - marker: b
    text: Nama Musa terdengar mirip dengan ungkapan Ibrani yang berarti “aku menariknya keluar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִגְדַּל
  choice: bertambah besar
  rationale: Kata גדל dalam konteks ini menunjuk pada pertumbuhan anak dalam usia; ‘bertambah besar’ alami dalam bahasa Indonesia dan tidak menyiratkan kebesaran status.
- source_word: הַיֶּלֶד
  choice: anak itu
  rationale: יֶלֶד dapat berarti anak atau anak laki-laki; ‘anak itu’ mempertahankan cakupan umum dan kesinambungan dengan konteks bayi sebelumnya.
- source_word: וַתְּבִאֵהוּ
  choice: ibunya membawanya
  rationale: Bentuk kausatif בוא berarti ‘membawa’. Subjek tersiratnya diperjelas sebagai ibu anak itu berdasarkan konteks ayat sebelumnya.
- source_word: לְבַת פַּרְעֹה
  choice: kepada putri Firaun
  rationale: Ungkapan ini secara alami menyatakan tujuan tindakan membawa dan hubungan ‘putri Firaun’.
- source_word: וַיְהִי לָהּ לְבֵן
  choice: lalu ia menjadi anaknya
  rationale: Idiom ini menyatakan bahwa Musa memperoleh kedudukan sebagai anak putri Firaun, tanpa menambahkan prosedur hukum yang tidak disebutkan.
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: Putri Firaun menamainya
  rationale: Rumus harfiah ‘memanggil namanya’ diterjemahkan secara idiomatis sebagai ‘menamainya’; subjek diperjelas agar rujukannya tidak rancu dalam bahasa Indonesia.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Mengikuti bentuk baku nama tokoh ini dalam bahasa Indonesia.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan atau penjelasan atas pemberian nama.
- source_word: מִן הַמַּיִם
  choice: keluar dari air
  rationale: Secara harfiah berarti ‘dari air’; ‘keluar dari air’ sesuai dengan konteks penyelamatan dan verba berikutnya.
- source_word: מְשִׁיתִהוּ
  choice: Aku telah menariknya keluar
  rationale: Verba משה berarti menarik keluar. Bentuk ini mempertahankan kaitan bunyi yang dimaksud teks dengan nama Musa, meskipun permainan katanya tidak sepenuhnya tampak dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat hubungan Musa dengan putri Firaun dalam וַיְהִי לָהּ לְבֵן
  choice: Musa menjadi anak putri Firaun
  alternative: Musa menjadi seperti anak baginya
  rationale: Bahasa Ibrani menyatakan hubungan filial yang nyata dalam narasi, tetapi tidak menjelaskan prosedur adopsi formal. Terjemahan mempertahankan pernyataan yang kuat tanpa menambahkan rincian kelembagaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Penyebutan ‘ibunya’ serta pengulangan ‘Putri Firaun’ memperjelas subjek yang tersirat dalam bahasa Ibrani dan menghindari kerancuan pronomina. Penanda catatan kaki ditempatkan langsung setelah klausa yang dijelaskan.
