base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/020.yaml
  text: And he said to his daughters, “Then where is he? Why is it that you left the man? Call him, so that he may eat bread.”
translation:
  language: id
  text: Lalu ia berkata kepada anak-anak perempuannya, “Jadi, di mana dia? Mengapa kalian meninggalkan orang itu? Panggillah dia supaya dia makan roti.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַיּוֹ
  choice: Jadi, di mana dia?
  rationale: Bentuk tanya ini meminta lokasi orang itu; partikel penghubung diterjemahkan “Jadi” untuk menyampaikan respons langsung sang ayah secara alami.
- source_word: לָמָּה זֶּה
  choice: Mengapa
  rationale: Ungkapan ini menandai pertanyaan bernada heran atau menegur. Dalam bahasa Indonesia modern, “Mengapa” menyampaikan fungsi tersebut tanpa ungkapan yang kaku.
- source_word: עֲזַבְתֶּן
  choice: kalian meninggalkan
  rationale: Verba berbentuk feminin jamak dan ditujukan kepada anak-anak perempuannya; “kalian” mempertahankan jumlah jamak.
- source_word: קִרְאֶן לוֹ
  choice: Panggillah dia
  rationale: Imperatif feminin jamak memerintahkan para anak perempuan untuk memanggil atau mengundang orang itu datang.
- source_word: וְיֹאכַל לָחֶם
  choice: supaya ia makan
  rationale: “Makan roti” merupakan ungkapan umum untuk makan atau menikmati hidangan. Terjemahan “makan” terdengar alami dan tidak membatasi hidangan pada roti secara harfiah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Dialog dipertahankan lugas dengan nada heran sekaligus mendesak. Pronomina “ia” digunakan dalam narasi dan klausa tujuan, sedangkan “dia” dalam dialog agar alami.
