  yaml_path: translation/ot/exodus/002/018.yaml
  text: When they came to Reuel their father[a], he said, “Why have you come back so quickly today?”
translation:
  language: id
  text: Ketika mereka sampai kepada Rehuel, ayah mereka, ia bertanya, “Mengapa kalian pulang begitu cepat hari ini?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתָּבֹאנָה
  choice: Ketika mereka sampai
  rationale: Bentuk wayyiqtol feminin jamak meneruskan alur cerita dan merujuk kepada anak-anak perempuan itu; konstruksi temporal ini alami dalam bahasa Indonesia.
- source_word: אֶל רְעוּאֵל
  choice: kepada Rehuel
  rationale: Preposisi אֶל menyatakan arah menuju seseorang. Nama Ibrani רְעוּאֵל ditransliterasikan sebagai “Rehuel” agar mendekati bentuk Ibraninya.
- source_word: אֲבִיהֶן
  choice: ayah mereka
  rationale: Nomina אָב dengan sufiks feminin jamak secara langsung berarti “ayah mereka” dalam konteks ini.
- source_word: וַיֹּאמֶר
  choice: ia bertanya
  rationale: Secara leksikal berarti “ia berkata”, tetapi karena ujaran berikutnya berupa pertanyaan, “ia bertanya” merupakan padanan naratif Indonesia yang alami tanpa mengubah fungsi tuturannya.
- source_word: מַדּוּעַ
  choice: Mengapa
  rationale: Kata tanya ini meminta alasan dan secara langsung sepadan dengan “mengapa”.
- source_word: מִהַרְתֶּן בֹּא
  choice: kalian pulang begitu cepat
  rationale: Gabungan bentuk Piel dari מהר (“bergegas/cepat”) dengan infinitif בוא (“datang”) berarti bergegas datang. Dalam konteks mereka kembali kepada ayahnya, “pulang begitu cepat” menyampaikan makna situasional dengan wajar.
- source_word: הַיּוֹם
  choice: hari ini
  rationale: Ungkapan harfiah “hari itu/si hari” berfungsi idiomatis sebagai “hari ini”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang alami dan bermartabat. “Kalian” dipakai untuk menandai sapaan orang kedua jamak yang jelas kepada para anak perempuan; “pulang” mengungkapkan kepulangan mereka kepada ayahnya tanpa menambahkan muatan teologis.
