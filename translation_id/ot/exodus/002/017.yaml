  text: Then the shepherds came and drove them away[a], but Moses stood up and saved them, and watered their flock.
translation:
  language: id
  text: Kemudian para gembala datang dan mengusir mereka, tetapi Musa bangkit, menyelamatkan mereka, dan memberi minum kawanan ternak mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ הָרֹעִים
  choice: Kemudian para gembala datang
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita, sehingga 'Kemudian' wajar dalam narasi Indonesia. הָרֹעִים menunjuk kepada orang-orang yang menggembalakan ternak.
- source_word: וַיְגָרְשׁוּם
  choice: mengusir mereka
  rationale: גרש menyatakan tindakan menghalau atau mengusir; akhiran objek merujuk kepada para perempuan dalam konteks sebelumnya.
- source_word: וַיָּקָם מֹשֶׁה
  choice: Musa bangkit
  rationale: קום di sini menandai respons Musa yang tegas dan mulai bertindak; 'bangkit' mempertahankan daya ungkap itu dengan bahasa naratif yang wajar.
- source_word: וַיּוֹשִׁעָן
  choice: membela dan menyelamatkan mereka
  rationale: Bentuk Hifil dari ישׁע berarti menyelamatkan atau melepaskan. Dalam konteks gangguan para gembala, 'membela dan menyelamatkan' menyampaikan tindakan penyelamatan tanpa menyiratkan bahwa mereka pasti terancam kematian.
- source_word: וַיַּשְׁקְ
  choice: memberi minum
  rationale: שקה berarti memberi minum atau menyediakan air; ungkapan ini alami ketika objeknya kawanan ternak.
- source_word: צֹאנָם
  choice: kawanan ternak mereka
  rationale: צאן adalah nomina kolektif untuk ternak kecil, biasanya domba dan kambing. 'Kawanan ternak' menjaga cakupan tersebut tanpa mempersempitnya menjadi domba saja.
