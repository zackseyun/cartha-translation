  text: She opened it and saw him[a], the child, and behold, a boy was crying. She had compassion on him and said[c][b], “This is one of the Hebrews’ children.”
translation:
  language: id
  text: Perempuan itu membuka peti itu dan melihat anak itu. Lihatlah, seorang anak laki-laki sedang menangis. Ia menaruh belas kasihan kepadanya lalu berkata, “Ini salah satu anak orang Ibrani.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּפְתַּח
  choice: Ketika perempuan itu membukanya
  rationale: Verba berarti ‘membuka’; objek pronominal ‘-nya’ dipasok secara wajar dari konteks, yaitu peti pada ayat sebelumnya. Hubungan waktu dibuat alami dalam bahasa Indonesia tanpa mengubah urutan peristiwa.
- source_word: וַתִּרְאֵהוּ אֶת הַיֶּלֶד
  choice: ia melihat anak itu
  rationale: Sufiks maskulin tunggal pada verba diikuti frasa penjelas ‘anak itu’. Bahasa Indonesia dapat menyatukan keduanya secara alami sebagai ‘melihat anak itu’, tanpa pengulangan kaku ‘melihatnya, anak itu’.
- source_word: וְהִנֵּה
  choice: dan ternyata
  rationale: Partikel הִנֵּה menarik perhatian secara hidup kepada keadaan yang baru tampak. ‘Ternyata’ menyampaikan unsur penemuan atau kejutan dengan bahasa Indonesia modern dan wajar.
- source_word: נַעַר בֹּכֶה
  choice: anak laki-laki itu sedang menangis
  rationale: נַעַר di sini menunjuk bayi Musa sebagai anak laki-laki, sedangkan bentuk partisipel בֹּכֶה menggambarkan tindakan yang sedang berlangsung.
- source_word: וַתַּחְמֹל עָלָיו
  choice: Ia merasa iba kepadanya
  rationale: חמל dengan עַל menyatakan rasa iba atau belas kasihan. Pilihan ini mempertahankan respons emosional tanpa lebih dahulu memasukkan gagasan tindakan menyelamatkan.
- source_word: מִיַּלְדֵי הָעִבְרִים
  choice: salah satu anak orang Ibrani
  rationale: Konstruksi dengan מִן bersifat partitif, yakni satu dari antara anak-anak milik kelompok orang Ibrani. Ungkapan ini alami dan jelas dalam bahasa Indonesia.
- source_word: זֶה
  choice: Ini
  rationale: Kata tunjuk tersebut menunjuk langsung kepada anak yang ada di hadapannya; ‘Ini’ merupakan bentuk langsung dan idiomatis dalam ujaran Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. ‘Perempuan itu’ memperjelas subjek yang tersirat dari konteks; ‘peti’ tidak diulang dalam ayat ini. Terjemahan menghindari susunan harfiah yang janggal ‘melihatnya, anak itu’, tetapi tetap mempertahankan identitas anak, jenis kelamin laki-laki, tangisan yang sedang berlangsung, dan rasa iba sang perempuan.
