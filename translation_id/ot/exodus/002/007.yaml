  naturalness: Bahasa Indonesia modern dan alurnya alami. “Bolehkah aku pergi memanggil ... untukmu” secara idiomatis menyampaikan bentuk tanya-tawaran Ibrani. Pengulangan “untukmu/bagimu” mempertahankan dua datif feminin tunggal tanpa menjadi janggal.
