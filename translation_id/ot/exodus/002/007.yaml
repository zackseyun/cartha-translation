language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תֹּ֣אמֶר אֲחֹת/וֹ֮ אֶל בַּת פַּרְעֹה֒ הַ/אֵלֵ֗ךְ וְ/קָרָ֤אתִי לָ/ךְ֙ אִשָּׁ֣ה מֵינֶ֔קֶת מִ֖ן הָ/עִבְרִיֹּ֑ת וְ/תֵינִ֥ק לָ֖/ךְ אֶת הַ/יָּֽלֶד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/007.yaml
  text: Then his sister said to Pharaoh’s daughter[a], “Shall I go and call a nursing woman from the Hebrew women for you, so that she may nurse the child for you?”
translation:
  language: id
  text: Lalu saudara perempuan anak itu berkata kepada putri Firaun, “Bolehkah aku pergi memanggil seorang perempuan Ibrani yang sedang menyusui[a] untukmu, supaya ia menyusui anak ini bagimu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seorang inang penyusu dari kalangan perempuan Ibrani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Lalu ... berkata
  rationale: Waw-konsekutif melanjutkan alur narasi; “Lalu” menyatakan urutan secara alami dalam bahasa Indonesia.
- source_word: אֲחֹתוֹ
  choice: saudara perempuan anak itu
  rationale: Akhiran pronominal maskulin tunggal merujuk secara kontekstual kepada bayi tersebut. Bentuk ini memperjelas rujukan tanpa menyebut nama Musa, yang tidak terdapat dalam teks ayat ini.
- source_word: בַּת פַּרְעֹה
  choice: putri Firaun
  rationale: Rangkaian konstruksi Ibrani diterjemahkan dengan bentuk Indonesia yang alami dan ringkas.
- source_word: הַאֵלֵךְ
  choice: Bolehkah aku pergi
  rationale: Bentuk tanya dengan imperfek orang pertama menyampaikan tawaran atau permohonan izin yang sopan.
- source_word: וְקָרָאתִי
  choice: memanggil
  rationale: קרא di sini berarti memanggil atau mendatangkan seseorang; “memanggil” mempertahankan keluasan makna tanpa menambahkan gagasan menjemput.
- source_word: אִשָּׁה מֵינֶקֶת
  choice: seorang perempuan ... yang sedang menyusui
  rationale: Ungkapan ini secara harfiah menunjuk kepada perempuan yang menyusui dan dengan demikian mampu menyusui bayi lain; terjemahan ini jelas dan tidak terlalu teknis.
- source_word: מִן הָעִבְרִיֹּת
  choice: perempuan Ibrani
  rationale: Preposisi מִן menunjukkan bahwa perempuan itu dipilih dari kalangan para perempuan Ibrani; ungkapan alami Indonesia menyampaikan keanggotaan kelompok tersebut.
- source_word: וְתֵינִק
  choice: supaya ia menyusui
  rationale: Hifil dari ינק berarti menyebabkan mengisap, yakni menyusui. Dalam konteks usulan ini, klausa tujuan “supaya” paling alami.
- source_word: לָךְ
  choice: untukmu ... bagimu
  rationale: Kedua kemunculan pronomina datif feminin tunggal dipertahankan untuk menunjukkan bahwa perempuan itu dipanggil dan menyusui atas kepentingan putri Firaun.
- source_word: הַיָּלֶד
  choice: anak ini
  rationale: יֶלֶד berarti anak; demonstratif “ini” membuat rujukan deiktis dalam percakapan terdengar alami tanpa mengubah identitas referennya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Saudara perempuan anak itu” dipilih daripada “saudarinya” agar rujukannya jelas. “Inang penyusu” dicantumkan sebagai alternatif leksikal karena tepat secara fungsi, tetapi kurang umum dalam percakapan modern.
