  text: וַ/יְהִי֩ בַ/יָּמִ֨ים הָֽ/רַבִּ֜ים הָ/הֵ֗ם וַ/יָּ֨מָת֙ מֶ֣לֶךְ מִצְרַ֔יִם וַ/יֵּאָנְח֧וּ בְנֵֽי יִשְׂרָאֵ֛ל מִן הָ/עֲבֹדָ֖ה וַ/יִּזְעָ֑קוּ וַ/תַּ֧עַל שַׁוְעָתָ֛/ם אֶל הָ/אֱלֹהִ֖ים מִן הָ/עֲבֹדָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/023.yaml
  text: It happened in those many days that the king of Egypt died[a], and the sons of Israel groaned because of the slavery and cried out[c][b], and their cry for help went up to God because of the slavery.
translation:
  language: id
  text: Pada masa yang panjang itu,[a] raja Mesir mati. Orang Israel[b] mengeluh karena perbudakan[c] dan berseru. Seruan mereka untuk meminta pertolongan naik kepada Allah karena perbudakan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Pada hari-hari yang banyak itu”; dapat juga diterjemahkan, “Dalam masa yang panjang itu.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak-anak lelaki Israel”; ungkapan ini merujuk secara kolektif kepada orang Israel.
    reason: lexical_alternative
  - marker: c
    text: Atau “kerja paksa” atau “pekerjaan berat”; istilah Ibrani di sini menunjuk pada pekerjaan yang menindas dalam keadaan perbudakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַיָּמִים הָרַבִּים הָהֵם
  choice: Setelah waktu yang lama itu berlalu
  rationale: Ungkapan ini menandai berlalunya suatu masa yang panjang dalam alur cerita. Bentuk Indonesia ini alami dan mempertahankan sifat waktunya yang tidak tentu; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: וַיָּמָת מֶלֶךְ מִצְרַיִם
  choice: raja Mesir mati
  rationale: Pernyataan naratif langsung yang mempertahankan rujukan dan urutan peristiwanya.
- source_word: וַיֵּאָנְחוּ
  choice: mengeluh
  rationale: Kata kerja ini menyatakan keluhan atau erangan akibat penderitaan; 'mengeluh' terasa wajar dalam bahasa Indonesia dan tetap berbobot dalam konteks penindasan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Orang Israel
  rationale: Secara harfiah 'anak-anak lelaki Israel', tetapi ungkapan tersebut merupakan sebutan kolektif bagi umat Israel. 'Orang Israel' menyampaikan rujukan kolektif itu secara alami tanpa menyiratkan bahwa hanya laki-laki yang dimaksud.
- source_word: מִן הָעֲבֹדָה
  choice: karena perbudakan
  rationale: Dalam konteks ini עֲבֹדָה adalah kerja paksa yang menindas, bukan pekerjaan atau pelayanan netral. 'Perbudakan' menyampaikan keadaan koersif yang menyebabkan keluhan mereka.
- source_word: וַיִּזְעָקוּ
  choice: berseru
  rationale: Kata kerja ini menyatakan seruan kuat yang timbul dari kesesakan. Objeknya dibiarkan tersirat sebagaimana dalam bahasa Ibrani.
- source_word: וַתַּעַל שַׁוְעָתָם
  choice: Seruan mereka meminta pertolongan naik
  rationale: שַׁוְעָה adalah seruan untuk mendapat pertolongan, dan 'naik' mempertahankan metafora vertikal bahasa Ibrani.
- source_word: אֶל הָאֱלֹהִים
  choice: kepada Allah
  rationale: Padanan Indonesia yang langsung dan idiomatis; tidak ada perluasan teologis di luar teks.
- source_word: מִן הָעֲבֹדָה (kemunculan kedua)
  choice: karena perbudakan itu
  rationale: Pengulangan dipertahankan untuk mencerminkan bingkai retoris teks Ibrani, sedangkan 'itu' membuat rujukannya alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna עֲבֹדָה dalam penindasan Israel
  choice: perbudakan
  alternative: kerja; pekerjaan berat; kerja paksa
  rationale: Konteks keluaran menunjukkan kerja koersif dalam kondisi perbudakan. Pilihan ini tidak melunakkan beratnya keadaan dan bukan penambahan doktrinal.
- issue: Penerjemahan בְּנֵי יִשְׂרָאֵל
  choice: Orang Israel
  alternative: anak-anak Israel; keturunan Israel
  rationale: Ungkapan Ibrani berbentuk maskulin, tetapi berfungsi sebagai sebutan etnis kolektif. Bahasa Indonesia modern lazim memakai 'Orang Israel' untuk seluruh umat, sehingga cakupannya tidak dipersempit secara keliru.
- issue: Arah seruan kepada Allah
  choice: naik kepada Allah
  alternative: sampai kepada Allah
  rationale: Pilihan utama mempertahankan metafora vertikal sumber tanpa menjelaskan cara Allah mendengar atau memberi tanggapan, yang baru dinyatakan dalam ayat berikutnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang bermartabat dan mudah dipahami. Kalimat panjang Ibrani dibagi menjadi tiga kalimat agar alami dalam bahasa Indonesia, sementara urutan peristiwa, pengulangan 'perbudakan', dan metafora seruan yang 'naik' tetap dipertahankan.
