base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/019.yaml
  text: They said[a], “An Egyptian man rescued us from the hand of the shepherds[b], and he even drew water for us and watered the flock.”
translation:
  language: id
  text: Mereka berkata, “Seorang pria Mesir menyelamatkan kami dari tangan para gembala[a]. Ia bahkan menimba air untuk kami[b] dan memberi minum kawanan ternak itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini secara harfiah berarti “dari tangan para gembala”, yaitu dari kuasa mereka.
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani memakai infinitif absolut bersama kata kerja “menimba” untuk memberikan penekanan: secara harfiah, “ia sungguh menimba untuk kami.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמַרְןָ
  choice: Kata mereka
  rationale: Bentuk wayyiqtol orang ketiga jamak feminin memperkenalkan jawaban para anak perempuan. Kata penghubung waw tidak perlu dinyatakan agar kalimat Indonesia mengalir alami.
- source_word: אִישׁ מִצְרִי
  choice: Seorang laki-laki Mesir
  rationale: Menyatakan kedua unsur Ibrani, אִישׁ ‘laki-laki’ dan מִצְרִי ‘Mesir’, dalam ungkapan Indonesia yang alami.
- source_word: הִצִּילָנוּ
  choice: menyelamatkan kami
  rationale: Bentuk hifil dari נצל menyatakan tindakan melepaskan atau menyelamatkan dari bahaya nyata.
- source_word: מִיַּד
  choice: dari tangan
  rationale: Mempertahankan gambaran idiom Ibrani ‘dari tangan’, yang dalam konteks berarti dari kuasa atau kekuasaan pihak lain.
- source_word: הָרֹעִים
  choice: para gembala
  rationale: Partisipel dari רעה menunjuk kepada para lelaki yang menggembalakan ternak dan sebelumnya mengusir para perempuan itu.
- source_word: וְגַם
  choice: Ia bahkan
  rationale: Menandai bahwa laki-laki itu bukan hanya menyelamatkan mereka, tetapi juga melakukan tindakan tambahan yang patut ditekankan.
- source_word: דָּלֹה דָלָה
  choice: benar-benar menimba air
  rationale: Gabungan infinitif absolut dan verba finit dari דלה mengintensifkan tindakan. ‘Benar-benar’ menyampaikan penekanan itu secara wajar dalam bahasa Indonesia.
- source_word: לָנוּ
  choice: untuk kami
  rationale: Pronomina datif menunjukkan bahwa air itu ditimba demi kepentingan mereka.
- source_word: וַיַּשְׁקְ
  choice: memberi minum
  rationale: Bentuk hifil dari שקה berarti menyebabkan minum atau menyediakan air bagi ternak.
- source_word: אֶת הַצֹּאן
  choice: kawanan ternak itu
  rationale: צאן adalah nomina kolektif untuk ternak kecil, biasanya domba dan kambing; ‘kawanan ternak’ mempertahankan cakupan ini tanpa membatasi jenisnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Gambaran ‘dari tangan’ dipertahankan, sedangkan konstruksi penegasan Ibrani disampaikan secara idiomatis dengan ‘benar-benar’.
