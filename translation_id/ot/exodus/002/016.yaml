base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/016.yaml
  text: The priest of Midian had seven daughters[b][a], and they came and drew water and filled the troughs to water their father's flock.
translation:
  language: id
  text: Imam Midian itu[a] mempunyai tujuh anak perempuan. Mereka datang dan menimba air,[b] lalu mengisi bak-bak minum untuk memberi minum ternak ayah mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Seorang imam dari Midian.” Bahasa Ibrani dapat menunjuk kepada imam tertentu atau sekadar seorang imam yang terkait dengan Midian.'
    reason: lexical_alternative
  - marker: b
    text: “Menimba air” menerjemahkan kata kerja yang berarti menarik atau mengangkat air dari sumur.
    reason: cultural_note
lexical_decisions:
- source_word: וּלְכֹהֵן מִדְיָן
  choice: Imam di Midian itu
  rationale: כֹהֵן berarti “imam”; מִדְיָן menyatakan kaitan dengan wilayah Midian. Bentuk Indonesia ini wajar dalam narasi dan mempertahankan kemungkinan bahwa orang itu adalah imam tertentu yang diperkenalkan dalam kisah.
- source_word: שֶׁבַע בָּנוֹת
  choice: mempunyai tujuh anak perempuan
  rationale: Klausa nominal Ibrani yang secara harfiah berarti “pada imam ... ada tujuh anak perempuan” paling alami diungkapkan sebagai kepemilikan dalam bahasa Indonesia.
- source_word: וַתָּבֹאנָה
  choice: Mereka datang
  rationale: Bentuk naratif dari בוא menyatakan kedatangan ketujuh anak perempuan itu.
- source_word: וַתִּדְלֶנָה
  choice: menimba air
  rationale: דלה dalam konteks ini berarti menarik atau mengangkat air dari sumur; objek “air” tersirat dalam bahasa Ibrani dan dinyatakan agar alami serta jelas dalam bahasa Indonesia.
- source_word: וַתְּמַלֶּאנָה אֶת־הָרְהָטִים
  choice: mengisi palungan-palungan
  rationale: רְהָטִים menunjuk pada wadah atau saluran tempat minum ternak. “Palungan-palungan” merupakan padanan konkret dan mudah dipahami.
- source_word: לְהַשְׁקֹות צֹאן
  choice: untuk memberi minum kawanan ternak
  rationale: Bentuk kausatif שקה berarti membuat ternak minum. צֹאן adalah istilah kolektif bagi ternak kecil, terutama domba dan kambing, sehingga “kawanan ternak” menjaga cakupannya tanpa membatasinya pada satu jenis.
- source_word: אֲבִיהֶן
  choice: ayah mereka
  rationale: Akhiran pronominal feminin jamak merujuk kepada ketujuh anak perempuan dan diterjemahkan dengan bentuk kepunyaan yang alami.
theological_decisions:
- issue: Apakah כֹהֵן מִדְיָן menunjuk pada imam tertentu atau seorang imam yang belum tertentu
  choice: Imam di Midian itu
  alternative: Seorang imam di Midian
  rationale: Bahasa Ibrani tidak memakai kata sandang pada כֹהֵן, tetapi konstruksi kepunyaan dan pengenalan tokoh memungkinkan pembacaan tertentu maupun tak tentu. Teks utama mengikuti alur naratif dengan bentuk tertentu, sementara catatan kaki mempertahankan alternatif yang sah.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Urutan tindakan dalam narasi Ibrani dipertahankan. Konjungsi awal waw tidak diberi padanan temporal seperti “pada waktu itu” karena tidak ada penanda waktu eksplisit dalam sumber.
