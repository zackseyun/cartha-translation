base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/013.yaml
  text: He went out the next day[a], and behold, two Hebrew men were fighting. And he said to the wicked one[b], “Why are you striking your companion?”
translation:
  language: id
  text: Keesokan harinya Musa keluar. Tampaklah dua orang Ibrani sedang berkelahi. Musa berkata kepada orang yang bersalah itu[a], “Mengapa engkau memukul sesamamu[b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang jahat itu” atau “orang fasik itu.”
    reason: lexical_alternative
  - marker: b
    text: Atau “kawanmu” atau “rekanmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: Musa keluar lagi
  rationale: Bentuk wayyiqtol dari יצא melanjutkan narasi. Nama Musa dinyatakan agar subjek yang tersirat jelas dalam bahasa Indonesia, sedangkan 'lagi' secara alami menghubungkan tindakan ini dengan keluarnya Musa pada ayat sebelumnya.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: Keesokan harinya
  rationale: Secara harfiah berarti 'pada hari kedua'; dalam alur naratif, 'keesokan harinya' menyampaikan hubungan waktunya secara alami.
- source_word: וְהִנֵּה
  choice: Tampaklah
  rationale: הִנֵּה menandai apa yang tiba-tiba terlihat atau diperhatikan. 'Tampaklah' mempertahankan daya presentatifnya tanpa memakai ungkapan Indonesia yang terasa kaku.
- source_word: שְׁנֵי אֲנָשִׁים עִבְרִים
  choice: dua orang Ibrani
  rationale: Menyampaikan jumlah, identitas etnis, dan rujukan kepada laki-laki secara wajar; dalam bahasa Indonesia, 'orang' tidak perlu ditambah 'laki-laki' karena konteks dan bentuk Ibrani sudah cukup terwakili.
- source_word: נִצִּים
  choice: sedang berkelahi
  rationale: Partisipel Nifal menunjukkan pertikaian yang sedang berlangsung, dan tindakan memukul dalam klausa berikutnya mendukung arti konflik fisik.
- source_word: לָרָשָׁע
  choice: orang yang bersalah itu
  rationale: רָשָׁע dapat berarti orang fasik/jahat atau pihak yang bersalah. Dalam sengketa khusus ini, frasa tersebut menunjuk pihak yang bertindak salah tanpa harus menetapkan watak tetapnya.
- source_word: לָמָּה תַכֶּה
  choice: Mengapa engkau memukul
  rationale: Bentuk imperfek dalam pertanyaan ini paling alami dipahami sebagai tindakan yang sedang berlangsung. 'Engkau' memberi ragam langsung yang bermartabat.
- source_word: רֵעֶךָ
  choice: sesamamu
  rationale: רֵעַ dapat berarti kawan, sesama, atau tetangga. 'Sesamamu' cocok untuk seorang Ibrani terhadap orang Ibrani lain dan tidak membatasi relasinya pada persahabatan.
theological_decisions:
- issue: Cakupan penilaian רָשָׁע
  choice: orang yang bersalah itu
  alternative: orang jahat itu / orang fasik itu
  rationale: Terjemahan utama mempertahankan penilaian moral terhadap pelaku, tetapi membiarkan konteks menentukan bahwa ia adalah pihak yang bersalah dalam pertikaian ini; alternatif yang lebih kuat dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. Nama Musa diulang demi kejelasan subjek; 'tampaklah' menjaga daya wacana הִנֵּה; pronomina 'engkau' dipakai dalam ujaran langsung.
