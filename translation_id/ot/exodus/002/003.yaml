  text: וְ/לֹא יָכְלָ֣ה עוֹד֮ הַצְּפִינ/וֹ֒ וַ/תִּֽקַּֽח ל/וֹ֙ תֵּ֣בַת גֹּ֔מֶא וַ/תַּחְמְרָ֥/ה בַ/חֵמָ֖ר וּ/בַ/זָּ֑פֶת וַ/תָּ֤שֶׂם בָּ/הּ֙ אֶת הַ/יֶּ֔לֶד וַ/תָּ֥שֶׂם בַּ/סּ֖וּף עַל שְׂפַ֥ת הַ/יְאֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/003.yaml
  text: But when she could no longer hide him[a], she took for him a papyrus basket and coated it with bitumen and pitch. Then she put the child in it and placed it among the reeds by the bank of the Nile.
translation:
  language: id
  text: Namun, ketika ia tidak dapat lagi menyembunyikannya, ia mengambil sebuah keranjang dari papirus[a] untuk anak itu dan melapisinya dengan bitumen dan ter. Kemudian ia menaruh anak itu di dalamnya dan meletakkannya di antara gelagah di tepi Sungai Nil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bahtera dari papirus.” Kata Ibrani tebah juga digunakan untuk bahtera Nuh dalam kitab Kejadian, sehingga menimbulkan gema sastra tentang penyelamatan melalui air.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצְּפִינוֹ
  choice: menyembunyikannya
  rationale: Bentuk Hifil dari צפן dengan akhiran orang ketiga maskulin tunggal berarti menyembunyikan dia. Pilihan ini alami dan tetap mempertahankan tindakan konkret dalam teks.
- source_word: תֵּבַת
  choice: keranjang
  rationale: Kata תֵּבָה menunjuk pada wadah atau peti; dalam konteks ini, wadah kecil dari papirus untuk bayi. “Keranjang” mudah dipahami dalam bahasa Indonesia modern, sedangkan kaitan leksikalnya dengan bahtera Nuh dipertahankan dalam catatan kaki.
- source_word: גֹּמֶא
  choice: papirus
  rationale: Kata ini secara khusus menunjuk pada tanaman papirus, bukan sekadar gelagah pada umumnya, dan sesuai dengan latar Mesir.
- source_word: וַתַּחְמְרָה בַחֵמָר
  choice: melapisinya dengan bitumen
  rationale: Kata kerja tersebut berarti mengolesi atau melapisi, sedangkan חֵמָר berarti bitumen atau aspal alam. Ungkapan ini tepat dan jelas.
- source_word: וּבַזָּפֶת
  choice: dan ter
  rationale: זֶפֶת menunjuk pada bahan pelapis kedap air berupa ter atau pitch. “Ter” merupakan istilah Indonesia yang ringkas dan umum.
- source_word: הַיֶּלֶד
  choice: anak itu
  rationale: יֶלֶד berarti anak atau anak laki-laki. “Anak itu” setia pada cakupan katanya tanpa mempersempitnya menjadi “bayi” dalam teks utama.
- source_word: בַּסּוּף
  choice: di antara rumpun gelagah
  rationale: סוּף menunjuk pada gelagah atau tumbuhan air sejenis. Frasa ini menggambarkan wadah tersebut diletakkan di tengah vegetasi tepi sungai.
- source_word: עַל שְׂפַת הַיְאֹר
  choice: di tepi Sungai Nil
  rationale: Dalam konteks kitab Keluaran, יְאֹר merujuk pada Sungai Nil. “Di tepi Sungai Nil” alami dalam bahasa Indonesia dan mempertahankan latar Mesir.
- source_word: לֹא יָכְלָה עוֹד
  choice: tidak dapat lagi
  rationale: Gabungan ini menyatakan bahwa kemampuan tersebut telah mencapai batasnya. “Tidak dapat lagi” adalah padanan Indonesia yang langsung dan alami.
- source_word: לּוֹ
  choice: untuk anak itu
  rationale: Pronomina datif dipertahankan secara eksplisit dengan menyebut referennya agar jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Gema sastra antara wadah Musa dan bahtera Nuh
  choice: Memakai “keranjang” dalam teks utama dan menjelaskan “bahtera” dalam catatan kaki
  alternative: Menerjemahkan תֵּבָה sebagai “bahtera” dalam teks utama
  rationale: “Keranjang” lebih sesuai dengan ukuran dan fungsi benda dalam konteks langsung, tetapi kata Ibrani yang sama dipakai bagi bahtera Nuh. Catatan kaki mempertahankan gema pembebasan melalui air tanpa membuat benda kecil ini terdengar seperti kapal besar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Istilah bahan “bitumen” dipertahankan demi ketepatan, sementara “ter” dipakai sebagai istilah pelapis yang lebih umum. Penanda catatan kaki ditempatkan langsung sesudah frasa yang dijelaskannya.
