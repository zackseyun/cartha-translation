base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/012.yaml
  text: He looked this way and that[a], and when he saw that there was no one there, he struck down the Egyptian and hid him in the sand.
translation:
  language: id
  text: Ia menoleh ke sana kemari dan, ketika melihat bahwa tidak ada siapa-siapa[a], ia memukul orang Mesir itu sampai mati, lalu menyembunyikannya di dalam pasir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak ada seorang pun laki-laki”; dalam konteks ini ungkapan Ibrani tersebut dapat berarti bahwa tidak ada siapa pun di sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן כֹּה וָכֹה
  choice: Ia menoleh ke sana kemari
  rationale: Gabungan verba פנה dengan ungkapan כֹּה וָכֹה menggambarkan tindakan mengarahkan pandangan ke berbagai arah. Terjemahan ini alami dalam bahasa Indonesia dan mempertahankan tindakan mengamati keadaan sekitar.
- source_word: וַיַּרְא כִּי אֵין אִישׁ
  choice: ketika melihat bahwa tidak ada siapa-siapa
  rationale: Dalam konteks ini, אִישׁ berfungsi secara umum untuk menyatakan bahwa tidak ada orang yang hadir atau dapat menyaksikan tindakannya. 'Tidak ada siapa-siapa' adalah ungkapan Indonesia yang alami; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וַיַּךְ אֶת הַמִּצְרִי
  choice: ia memukul orang Mesir itu sampai mati
  rationale: נכה pada dasarnya berarti 'memukul' atau 'menghantam', sedangkan konteks penyembunyian korban menunjukkan akibat yang mematikan. Frasa ini mempertahankan tindakan yang dinyatakan verba Ibrani sekaligus memperjelas hasilnya tanpa menggantinya begitu saja dengan 'membunuh'.
- source_word: וַיִּטְמְנֵהוּ
  choice: menyembunyikannya
  rationale: טמן berarti menyembunyikan atau menutupi. Bentuk pronominal ini mengikuti objek sebelumnya tanpa menambahkan kata 'mayat', yang tidak disebutkan secara eksplisit dalam bahasa Ibrani.
- source_word: בַּחוֹל
  choice: di dalam pasir
  rationale: חוֹל berarti 'pasir'. 'Di dalam pasir' secara alami menggambarkan tubuh yang ditutupi atau dibenamkan dalam pasir.
