  text: וַ֠/יֹּאמֶר מִ֣י שָֽׂמְ/ךָ֞ לְ/אִ֨ישׁ שַׂ֤ר וְ/שֹׁפֵט֙ עָלֵ֔י/נוּ הַ/לְ/הָרְגֵ֨/נִי֙ אַתָּ֣ה אֹמֵ֔ר כַּ/אֲשֶׁ֥ר הָרַ֖גְתָּ אֶת הַ/מִּצְרִ֑י וַ/יִּירָ֤א מֹשֶׁה֙ וַ/יֹּאמַ֔ר אָכֵ֖ן נוֹדַ֥ע הַ/דָּבָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/014.yaml
  text: But he said[a], “Who made you a ruler and a judge over us? Are you saying, ‘Will you kill me as you killed the Egyptian?’” Then Moses was afraid and said, “Surely the matter has become known.”
translation:
  language: id
  text: Tetapi orang itu berkata, “Siapa yang mengangkat engkau menjadi penguasa dan hakim atas kami? Apakah engkau bermaksud[a] membunuh aku seperti engkau membunuh orang Mesir itu?” Lalu Musa menjadi takut dan berkata, “Ternyata perkara itu sudah diketahui.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apakah engkau mengatakan bahwa engkau akan membunuh aku seperti engkau membunuh orang Mesir itu?”
    reason: Mempertahankan kemungkinan bahwa אַתָּה אֹמֵר diterjemahkan lebih dekat sebagai “engkau mengatakan,” bukan sebagai ungkapan niat (“bermaksud”).
lexical_decisions:
- source_word: מִי שָׂמְךָ
  choice: Siapa yang mengangkat engkau
  rationale: שׂים dalam konteks tantangan terhadap wewenang berarti menetapkan atau mengangkat; bentuk ini wajar dan tetap mempertahankan pertanyaan langsung.
- source_word: לְאִישׁ שַׂר וְשֹׁפֵט
  choice: menjadi penguasa dan hakim
  rationale: אִישׁ berfungsi dalam rangkaian predikatif dan tidak perlu diterjemahkan secara kaku sebagai 'seorang laki-laki'; 'penguasa dan hakim' menyampaikan kedua jabatan dengan alami.
- source_word: עָלֵינוּ
  choice: atas kami
  rationale: עַל di sini menandai wewenang yang dijalankan terhadap kelompok pembicara.
- source_word: הַלְהָרְגֵנִי אַתָּה אֹמֵר
  choice: Apakah engkau bermaksud membunuh aku
  rationale: Secara harfiah konstruksi ini mengandung verba 'berkata', tetapi dalam konteksnya אֹמֵר dapat menyatakan maksud atau niat. Terjemahan ini alami dalam bahasa Indonesia dan mempertahankan daya tuduh pertanyaan.
- source_word: כַּאֲשֶׁר הָרַגְתָּ אֶת־הַמִּצְרִי
  choice: seperti engkau membunuh orang Mesir itu
  rationale: כַּאֲשֶׁר menyatakan perbandingan dengan tindakan sebelumnya, sedangkan artikel pada הַמִּצְרִי menunjuk kepada orang Mesir tertentu.
- source_word: וַיִּירָא מֹשֶׁה
  choice: Lalu Musa menjadi takut
  rationale: Menyampaikan urutan naratif dan respons takut Musa dengan bahasa Indonesia yang lugas.
- source_word: אָכֵן
  choice: Ternyata
  rationale: Dalam konteks ini partikel tersebut menandai kesimpulan atau kesadaran mendadak Musa, bukan sekadar penegasan abstrak.
- source_word: נוֹדַע הַדָּבָר
  choice: perkara itu sudah diketahui
  rationale: Nifal נוֹדַע menunjukkan bahwa perkara tersebut telah diketahui atau tersingkap; 'perkara itu' merujuk pada pembunuhan yang baru disebut.
theological_decisions:
- issue: Terjemahan לְאִישׁ dalam rangkaian לְאִישׁ שַׂר וְשֹׁפֵט
  choice: 'Tidak menerjemahkan אִישׁ secara terpisah: “menjadi penguasa dan hakim”'
  alternative: “menjadi seorang laki-laki, penguasa, dan hakim” atau “menjadi seseorang, penguasa, dan hakim”
  rationale: Dalam susunan ini אִישׁ memperkenalkan status atau peran dan terjemahan harfiah akan janggal serta dapat memberi kesan bahwa kelelakian Musa sedang dipersoalkan. Penghilangan unsur yang tidak idiomatis ini tidak mengubah tantangan terhadap wewenang Musa.
- issue: Daya makna אַתָּה אֹמֵר
  choice: “engkau bermaksud”
  alternative: '“engkau berkata” atau “apakah engkau mengatakan: ‘Aku akan membunuhmu’”'
  rationale: Konstruksi Ibrani dapat dipahami secara harfiah sebagai 'engkau berkata', tetapi secara idiomatis menunjuk pada niat. Terjemahan utama memakai bentuk alami tanpa menjadikannya pernyataan eksplisit yang tidak ada dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina “engkau” dipakai untuk dialog Alkitab yang langsung; “orang Mesir itu” mempertahankan rujukan tertentu. Tidak diperlukan catatan kaki karena ambiguitas אֹמֵר dapat disampaikan secara memadai dengan “bermaksud”.
