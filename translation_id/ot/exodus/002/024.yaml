base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/024.yaml
  text: God heard their groaning[a], and God remembered his covenant with Abraham, with Isaac[b], and with Jacob.
translation:
  language: id
  text: Allah mendengar rintihan mereka[a], dan Allah mengingat[b] perjanjian-Nya dengan Abraham, dengan Ishak, dan dengan Yakub.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keluhan mereka”. Kata benda Ibrani ini dapat menunjuk pada seruan atau rintihan akibat penindasan.
    reason: lexical_alternative
  - marker: b
    text: “Mengingat” merupakan bahasa perjanjian. Ungkapan ini tidak menyiratkan bahwa Allah sebelumnya lupa, melainkan bahwa Dia berpaling untuk bertindak dengan setia sesuai dengan perjanjian-Nya.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: mendengar
  rationale: Bentuk naratif dari שׁמע di sini paling wajar berarti bahwa Allah mendengar rintihan Israel; pilihan ini tidak menambahkan gagasan tindakan mendengarkan yang berlangsung lama.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk katanya secara morfologis jamak, verba yang menyertainya berbentuk tunggal dan kata ini menunjuk kepada satu-satunya Allah Israel.
- source_word: נַאֲקָתָם
  choice: rintihan mereka
  rationale: נַאֲקָה menunjuk pada rintihan atau seruan pedih akibat penindasan. 'Rintihan' alami dalam bahasa Indonesia dan mempertahankan sifat penderitaan tanpa menjadikannya ratapan formal.
- source_word: וַיִּזְכֹּר
  choice: mengingat
  rationale: Makna leksikal langsungnya adalah 'mengingat'. Dalam konteks perjanjian kata ini mengisyaratkan tindakan setia yang menyusul, tetapi implikasi itu tidak dimasukkan sebagai parafrasa ke dalam teks utama.
- source_word: בְּרִיתוֹ
  choice: perjanjian-Nya
  rationale: בְּרִית adalah istilah baku untuk perjanjian, dan sufiksnya menyatakan bahwa perjanjian itu milik Allah. Huruf kapital pada '-Nya' mengikuti kelaziman bahasa Indonesia untuk rujukan kepada Allah.
- source_word: אֶת אַבְרָהָם אֶת יִצְחָק וְאֶת יַעֲקֹב
  choice: dengan Abraham, dengan Ishak, dan dengan Yakub
  rationale: Preposisi 'dengan' yang dipasok sesudah 'perjanjian' menyatakan hubungan para leluhur dengan perjanjian secara alami. Pengulangannya mempertahankan penekanan dan irama bahasa Ibrani.
theological_decisions:
- issue: Bahasa antropomorfis dalam ungkapan 'Allah mengingat'
  choice: Mempertahankan 'mengingat' dalam teks utama tanpa perluasan penjelasan.
  alternative: Allah memperhatikan kembali perjanjian-Nya; Allah bertindak berdasarkan perjanjian-Nya.
  rationale: Bahasa Ibrani memakai bahasa perjanjian yang antropomorfis. Mengubahnya menjadi 'bertindak berdasarkan' akan menafsirkan implikasinya alih-alih menerjemahkan ungkapannya, serta menghilangkan ketegangan teologis yang sengaja dipertahankan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat mempertahankan pengulangan nama Allah serta pengulangan 'dengan' untuk mencerminkan penekanan dan irama sumber Ibrani tanpa terasa kaku.
