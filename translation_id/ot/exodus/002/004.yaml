  naturalness: Kalimat revisi tetap baku, modern, dan lancar. “Saudarinya berdiri dari kejauhan” merupakan ungkapan naratif yang alami; “dari kejauhan” tidak melemahkan jarak menjadi sekadar “agak jauh.”
  terminology: “Saudarinya” secara eksplisit mempertahankan jenis kelamin dan hubungan keluarga tanpa mengimpor urutan usia dari konteks. Bentuk pasif “akan dilakukan terhadapnya” mempertahankan nuansa Nifal יֵּעָשֶׂה dan sasaran לּוֹ.
