translation:
  language: id
  text: Saudarinya berdiri dari kejauhan[a] untuk mengetahui apa yang akan dilakukan terhadapnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari jauh.”
    reason: lexical_alternative
  - marker: b
    text: Atau “untuk mencari tahu apa yang akan terjadi padanya.” Secara lebih harfiah, teks Ibrani berbunyi “untuk mengetahui apa yang akan dilakukan terhadapnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּתַצַּב
  choice: berdiri
  rationale: Bentuk Hitpael dari יצב menyatakan mengambil atau mempertahankan posisi berdiri; “berdiri” alami dalam bahasa Indonesia dan tidak melebih-lebihkan unsur refleksifnya.
- source_word: אֲחֹתוֹ
  choice: kakaknya
  rationale: Secara harfiah berarti “saudarinya.” Dalam konteks Musa, saudari itu lebih tua, sehingga “kakaknya” merupakan padanan Indonesia yang alami dan tepat.
- source_word: מֵרָחֹק
  choice: agak jauh
  rationale: Frasa ini menyatakan jarak secara ruang. “Agak jauh” alami dalam bahasa Indonesia dan mempertahankan gambaran bahwa ia mengamati dari kejauhan tanpa menentukan jarak persis.
- source_word: לְדֵעָה
  choice: untuk mengetahui
  rationale: Infinitif ידע dengan ל menyatakan tujuan. “Untuk mengetahui” dekat dengan bentuk Ibrani, sementara konteksnya menyiratkan menantikan hasil.
- source_word: מַה
  choice: apa
  rationale: Kata tanya yang memperkenalkan isi dari hal yang ingin diketahuinya.
- source_word: יֵּעָשֶׂה
  choice: akan dilakukan
  rationale: Nifal imperfek dari עשה mempertahankan bentuk pasif, yakni sesuatu yang akan dilakukan, alih-alih langsung diparafrasakan sebagai sesuatu yang akan terjadi.
- source_word: לוֹ
  choice: terhadap anak itu
  rationale: Preposisi ל dengan verba pasif dapat menunjuk pada apa yang dilakukan kepada atau bagi seseorang. “Terhadap anak itu” mempertahankan sasaran tindakan dan menghindari ambiguitas pronomina Indonesia.
