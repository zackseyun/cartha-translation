translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. “Kakaknya” dipilih karena jenis kelamin dan hubungan usia diketahui dari konteks, sedangkan “anak itu” memperjelas rujukan לוֹ secara alami. Semua penanda catatan kaki ditempatkan dalam teks utama.
