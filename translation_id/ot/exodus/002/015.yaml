base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/015.yaml
  text: When Pharaoh heard this matter[a], he sought to kill Moses. But Moses fled from Pharaoh and stayed in the land of Midian[b], and he sat down by the well.
translation:
  language: id
  text: Ketika Firaun mendengar tentang perkara itu[a], ia berusaha membunuh Musa. Namun, Musa melarikan diri dari Firaun, lalu tinggal di tanah Midian[b] dan duduk di dekat sumur itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “mendengar perkara itu” atau “mengetahui kejadian itu”.
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani memakai kata kerja yang sama dua kali: pertama dalam arti “tinggal” di Midian, kemudian dalam arti harfiah “duduk” di dekat sumur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: mendengar tentang
  rationale: Kata שׁמע pada dasarnya berarti ‘mendengar’. Dalam konteks ini, frasa tersebut menyatakan bahwa Firaun mengetahui peristiwa yang dilaporkan; ‘mendengar tentang’ wajar dalam bahasa Indonesia dan tetap dekat dengan ungkapan Ibrani.
- source_word: הַדָּבָר הַזֶּה
  choice: perkara itu
  rationale: דבר di sini menunjuk pada peristiwa pembunuhan orang Mesir yang baru diceritakan. ‘Perkara itu’ mempertahankan keluasan makna sumber tanpa menjelaskannya secara berlebihan.
- source_word: וַיְבַקֵּשׁ לַהֲרֹג
  choice: berusaha membunuh
  rationale: בקש yang diikuti infinitif dapat menyatakan upaya atau maksud untuk melakukan sesuatu. ‘Berusaha membunuh’ menyampaikan unsur kehendak dan tindakan secara alami.
- source_word: וַיִּבְרַח ... מִפְּנֵי
  choice: melarikan diri dari
  rationale: Ungkapan ברח מִפְּנֵי secara harfiah menggambarkan tindakan lari dari hadapan seseorang. ‘Melarikan diri dari’ merupakan padanan Indonesia yang jelas dan alami.
- source_word: וַיֵּשֶׁב בְּאֶרֶץ מִדְיָן
  choice: tinggal di tanah Midian
  rationale: ישׁב dapat berarti duduk, tinggal, menetap, atau berdiam. Dalam pemakaian pertama ini, ‘tinggal’ menunjukkan keberadaan Musa di Midian tanpa menyiratkan tingkat kepermanenan yang tidak dinyatakan secara tegas.
- source_word: וַיֵּשֶׁב עַל הַבְּאֵר
  choice: duduk di dekat sumur itu
  rationale: Pemakaian kedua ישׁב memiliki arti konkret ‘duduk’. Dalam konteks ini, עַל paling alami diterjemahkan ‘di dekat’, sedangkan artikel tertentu pada הַבְּאֵר dipertahankan dengan ‘sumur itu’.
- source_word: פַּרְעֹה
  choice: Firaun
  rationale: Bentuk baku bahasa Indonesia untuk gelar penguasa Mesir.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk baku nama tokoh ini dalam tradisi bahasa Indonesia.
