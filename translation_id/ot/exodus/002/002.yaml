  text: וַ/תַּ֥הַר הָ/אִשָּׁ֖ה וַ/תֵּ֣לֶד בֵּ֑ן וַ/תֵּ֤רֶא אֹת/וֹ֙ כִּי ט֣וֹב ה֔וּא וַֽ/תִּצְפְּנֵ֖/הוּ שְׁלֹשָׁ֥ה יְרָחִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/002.yaml
  text: The woman became pregnant and gave birth to a son. When she saw that he was good[a], she hid him for three months.
translation:
  language: id
  text: Perempuan itu mengandung dan melahirkan seorang anak laki-laki. Ketika ia melihat bahwa anak itu baik[a], ia menyembunyikannya selama tiga bulan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "elok" atau "indah". Kata Ibrani yang dipakai berarti "baik", tetapi dalam konteks ini juga dapat berarti elok, menyenangkan, atau bagus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּהַר
  choice: mengandung
  rationale: Kata kerja הרה menyatakan menjadi hamil atau mengandung. 'Mengandung' alami dalam bahasa Indonesia dan mempertahankan urutan peristiwa.
- source_word: הָאִשָּׁה
  choice: perempuan itu
  rationale: Teks Ibrani secara eksplisit menyebut 'perempuan itu', bukan 'istrinya'; pilihan ini tidak menambahkan hubungan yang hanya diketahui dari konteks.
- source_word: וַתֵּלֶד בֵּן
  choice: melahirkan seorang anak laki-laki
  rationale: Ungkapan ילד + בן adalah ungkapan lazim untuk kelahiran seorang anak laki-laki; terjemahan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: וַתֵּרֶא אֹתוֹ כִּי טוֹב הוּא
  choice: Ketika ia melihat bahwa anak itu baik
  rationale: Bentuk dengan objek dan klausa כִּי secara alami menyatakan penilaian sang ibu. 'Ketika' menyampaikan alur narasi dengan lancar tanpa mengubah hubungan peristiwanya.
- source_word: כִּי טוֹב הוּא
  choice: bahwa anak itu baik
  rationale: טוֹב terutama berarti 'baik', tetapi dalam konteks ini dapat pula berarti elok, menyenangkan, atau bagus. 'Baik' mempertahankan keluasan makna dan kemungkinan gema bahasa Kejadian 1.
- source_word: וַתִּצְפְּנֵהוּ
  choice: ia menyembunyikannya
  rationale: צפן berarti menyembunyikan atau merahasiakan. 'Menyembunyikannya' merupakan padanan langsung dan alami dalam narasi.
- source_word: שְׁלֹשָׁה יְרָחִים
  choice: selama tiga bulan
  rationale: יֶרַח berarti bulan, pada dasarnya bulan kamariah. 'Tiga bulan' menyampaikan maksudnya secara tepat tanpa teknis yang tidak diperlukan.
theological_decisions:
- issue: Gambaran bayi dengan kata טוֹב
  choice: baik
  alternative: elok; indah; bagus
  rationale: Makna dasar kata Ibrani itu adalah 'baik'. Pilihan ini tidak mempersempitnya menjadi penilaian fisik semata dan mempertahankan kemungkinan kaitan sastra dengan pemakaian טוֹב sebelumnya dalam Kitab Kejadian. Makna estetis yang mungkin dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'ia' menjaga narasi tetap ringkas; 'anak itu' memperjelas rujukan sebelum enklitik '-nya'. Penanda catatan kaki [a] ditempatkan langsung sesudah kata yang dijelaskan.
