  to: Pada masa itu, setelah Musa dewasa, ia pergi menemui saudara-saudaranya[a] dan melihat kerja berat yang mereka tanggung. Ia melihat seorang Mesir sedang memukul seorang Ibrani, seorang dari antara saudara-saudaranya.
  rationale: 'Revisi terbatas pada dua pilihan yang lebih netral dan setia pada cakupan makna Ibrani: formula waktu diterjemahkan “Pada masa itu,” dan tindakan kekerasan diterjemahkan “sedang memukul,” bukan “sedang memukuli.” Frasa akhir sedikit diperjelas menjadi “seorang dari antara saudara-saudaranya” agar kepemilikan “saudaranya” jelas merujuk kepada Musa dan pengulangan istilah kekerabatan tetap terpelihara.'
