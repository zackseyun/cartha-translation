  terminology: “Saudara-saudaranya” dengan catatan kaki mempertahankan bahasa kekerabatan אֶחָיו / מֵאֶחָיו dengan baik. “Orang Mesir” dan “orang Ibrani” alami dalam bahasa Indonesia dan tidak perlu diberi penanda gender. “Kerja berat yang mereka tanggung” merupakan padanan kontekstual yang layak untuk beban mereka.
