  source_fidelity: 'Secara keseluruhan draf setia pada teks Ibrani: perkembangan Musa menuju dewasa, keberangkatannya kepada saudara-saudaranya, pengamatannya atas beban mereka, serta serangan seorang Mesir terhadap seorang Ibrani semuanya terwakili. Namun, “sedang memukuli” cenderung menyatakan pemukulan berulang dan lebih kuat daripada partisip מַכֶּה, yang cukup menyatakan tindakan memukul/menyerang yang sedang berlangsung.'
