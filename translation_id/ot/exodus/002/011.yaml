  text: וַ/יְהִ֣י בַּ/יָּמִ֣ים הָ/הֵ֗ם וַ/יִּגְדַּ֤ל מֹשֶׁה֙ וַ/יֵּצֵ֣א אֶל אֶחָ֔י/ו וַ/יַּ֖רְא בְּ/סִבְלֹתָ֑/ם וַ/יַּרְא֙ אִ֣ישׁ מִצְרִ֔י מַכֶּ֥ה אִישׁ עִבְרִ֖י מֵ/אֶחָֽי/ו׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/002/011.yaml
  text: It happened in those days[a], when Moses had grown up, that he went out to his brothers and saw their burdens. And he saw an Egyptian man striking a Hebrew man, one of his brothers.
translation:
  language: id
  text: Pada masa itu, setelah Musa dewasa, ia pergi menemui saudara-saudaranya[a] dan melihat kerja berat yang mereka tanggung. Ia melihat seorang Mesir sedang memukul seorang Ibrani, seorang dari antara saudara-saudaranya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kaum kerabatnya” atau “bangsanya”; bahasa Ibrani memakai sebutan kekeluargaan untuk menyatakan solidaritas Musa dengan orang-orang Ibrani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: Pada waktu itu
  rationale: Ungkapan ini menyampaikan peralihan waktu dalam narasi secara alami dalam bahasa Indonesia tanpa memakai rumusan yang kaku atau arkais.
- source_word: וַיִּגְדַּל
  choice: setelah Musa dewasa
  rationale: Dalam konteks ini verba tersebut menunjuk pada tercapainya kedewasaan, bukan kebesaran atau kedudukan; 'setelah' memperjelas urutan tindakan.
- source_word: אֶל אֶחָיו
  choice: menemui saudara-saudaranya
  rationale: Mempertahankan bahasa kekerabatan Ibrani dan solidaritas Musa dengan orang-orang Ibrani; 'menemui' secara alami menyampaikan gerak keluar menuju mereka.
- source_word: בְּסִבְלֹתָם
  choice: kerja berat yang mereka tanggung
  rationale: Nomina ini merujuk pada beban yang ditanggung, dalam konteks berupa kerja paksa yang menindas. Pilihan ini mempertahankan unsur kerja dan beban tanpa membatasi maknanya secara berlebihan.
- source_word: אִישׁ מִצְרִי
  choice: seorang Mesir
  rationale: Dalam bahasa Indonesia, identitas etnis sudah secara alami menunjuk kepada orang; penambahan 'laki-laki' tidak diperlukan.
- source_word: מַכֶּה
  choice: sedang memukuli
  rationale: Bentuk partisip menunjukkan tindakan fisik yang sedang berlangsung; 'memukuli' menyampaikan serangan berulang atau pemukulan yang sesuai dengan konteks penindasan.
- source_word: אִישׁ עִבְרִי
  choice: seorang Ibrani
  rationale: Ungkapan yang alami dan tepat dalam bahasa Indonesia, tanpa perlu menambahkan 'laki-laki' yang sudah tersirat oleh konteks dan nomina Ibrani.
- source_word: מֵאֶחָיו
  choice: salah seorang saudaranya
  rationale: Menjaga pengulangan bahasa kekerabatan dari frasa sebelumnya dan menekankan identifikasi Musa dengan orang Ibrani itu.
theological_decisions:
- issue: Bahasa kekerabatan אֶחָיו / מֵאֶחָיו
  choice: saudara-saudaranya / salah seorang saudaranya
  alternative: kaum kerabatnya / bangsanya
  rationale: Terjemahan ini mempertahankan metafora keluarga dalam teks Ibrani dan solidaritas Musa dengan orang-orang Ibrani, tanpa mengubahnya menjadi istilah identitas nasional yang lebih interpretatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara pengulangan bahasa kekerabatan dan gambaran beban kerja dalam sumber Ibrani tetap dipertahankan.
