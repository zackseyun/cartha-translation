    reason: alternative_reading
lexical_decisions:
- source_word: וַתֵּלֶד בֵּן
  choice: Ia melahirkan seorang anak laki-laki
  rationale: Bentuk wayyiqtol dari ילד menyatakan tindakan melahirkan, sedangkan בֵּן berarti anak laki-laki atau putra. Ungkapan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: וַיִּקְרָא אֶת־שְׁמוֹ
  choice: lalu Musa menamainya
  rationale: Secara harfiah idiom Ibrani ini berarti 'memanggil namanya'. 'Menamainya' merupakan padanan Indonesia yang alami; nama Musa disebut untuk memperjelas pergantian pelaku dari perempuan yang melahirkan kepada laki-laki yang memberi nama.
- source_word: גֵּרְשֹׁם
  choice: Gersom
  rationale: Bentuk 'Gersom' mengikuti ejaan nama Alkitab yang lazim dalam bahasa Indonesia, sementara catatan kaki mempertahankan permainan bunyi Ibraninya.
- source_word: כִּי אָמַר
  choice: sebab katanya
  rationale: כִּי memperkenalkan alasan atau penjelasan pemberian nama. 'Sebab katanya' ringkas, alami, dan mempertahankan fungsi penjelas tersebut.
- source_word: גֵּר
  choice: pendatang
  rationale: גֵּר menunjuk kepada orang nonpribumi yang tinggal di tengah masyarakat lain. 'Pendatang' lebih alami dan bermartabat daripada 'orang asing' dalam konteks ini serta tidak searkais 'penumpang'.
- source_word: הָיִיתִי
  choice: Aku telah menjadi
  rationale: Bentuk perfektif dapat menunjuk keadaan Musa hingga saat pemberian nama. 'Telah menjadi' mempertahankan kemungkinan nuansa keadaan yang berlanjut tanpa menutup pembacaan lampau sederhana.
- source_word: בְּאֶרֶץ נָכְרִיָּה
  choice: di negeri asing
  rationale: נָכְרִיָּה berarti asing atau bukan milik bangsanya. 'Negeri asing' merupakan ungkapan Indonesia yang jelas dan dekat dengan struktur sumber.
