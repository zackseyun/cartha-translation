  text: She gave birth to a son[a], and he called his name Gershom, for he said[b], “I have been a sojourner in a foreign land.”
translation:
  language: id
  text: Ia melahirkan seorang anak laki-laki, lalu Musa menamainya Gersom[a], sebab katanya[b], “Aku pernah menjadi seorang pendatang di negeri asing.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Gersom terdengar seperti ungkapan Ibrani yang berarti “pendatang di sana”, sesuai dengan penjelasan Musa tentang nama itu.
    reason: lexical_alternative
  - marker: b
