  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה אֱמֹ֣ר אֶֽל אַהֲרֹ֡ן קַ֣ח מַטְּ/ךָ֣ וּ/נְטֵֽה יָדְ/ךָ֩ עַל מֵימֵ֨י מִצְרַ֜יִם עַֽל נַהֲרֹתָ֣/ם עַל יְאֹרֵי/הֶ֣ם וְ/עַל אַגְמֵי/הֶ֗ם וְ/עַ֛ל כָּל מִקְוֵ֥ה מֵימֵי/הֶ֖ם וְ/יִֽהְיוּ דָ֑ם וְ/הָ֤יָה דָם֙ בְּ/כָל אֶ֣רֶץ מִצְרַ֔יִם וּ/בָ/עֵצִ֖ים וּ/בָ/אֲבָנִֽים־־־־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/019.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Take your staff and stretch out your hand over the waters of Egypt—over their rivers, over their Nile canals, over their ponds, and over every collection of their waters—that they may become blood. And there will be blood throughout all the land of Egypt[b], even in wooden and stone vessels.’”
translation:
  language: id
  text: Kemudian Yahweh berfirman kepada Musa, “Katakanlah kepada Harun, ‘Ambillah tongkatmu dan ulurkan tanganmu ke atas perairan Mesir—ke atas sungai-sungai mereka, saluran-saluran Sungai Nil mereka, kolam-kolam mereka, dan segala tempat air mereka terkumpul—supaya semuanya menjadi darah. Darah akan ada di seluruh tanah Mesir, bahkan di dalam wadah-wadah kayu dan batu[a].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “di dalam kayu dan di dalam batu,” kemungkinan besar maksudnya wadah-wadah yang terbuat dari kayu dan batu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung, bukan menggantinya dengan gelar.
- source_word: מַטְּךָ
  choice: tongkatmu
  rationale: מַטֶּה menunjuk pada tongkat konkret yang dipakai Harun dalam rangkaian tulah.
- source_word: וּנְטֵה יָדְךָ
  choice: ulurkan tanganmu
  rationale: Ungkapan ini mempertahankan tindakan simbolis dalam bahasa Indonesia yang alami.
- source_word: מֵימֵי מִצְרַיִם
  choice: perairan Mesir
  rationale: Merangkum berbagai jenis sumber dan kumpulan air yang kemudian diperinci.
- source_word: נַהֲרֹתָם
  choice: sungai-sungai mereka
  rationale: Membedakan נָהָר yang umum dari יְאֹר yang secara khas berkaitan dengan Sungai Nil.
- source_word: יְאֹרֵיהֶם
  choice: saluran-saluran Sungai Nil mereka
  rationale: Dalam konteks Mesir, יְאֹר menunjuk pada aliran atau saluran yang terkait dengan Sungai Nil; terjemahan ini mempertahankan kekhususan geografisnya.
- source_word: אַגְמֵיהֶם
  choice: kolam-kolam mereka
  rationale: אָדָם? No. אָגַם denotes pooled or marshy water; 'kolam-kolam' is readable and fits the enumerated water bodies.
- source_word: כָּל מִקְוֵה מֵימֵיהֶם
  choice: segala tempat air mereka terkumpul
  rationale: מִקְוֶה denotes a gathering or collected body of water; this wording avoids over-specifying reservoirs while remaining natural.
- source_word: וְיִהְיוּ דָם
  choice: supaya semuanya menjadi darah
  rationale: The prefixed verb after the commands expresses intended result; 'semuanya' naturally refers back to the listed waters.
- source_word: וְהָיָה דָם בְּכָל אֶרֶץ מִצְרַיִם
  choice: Darah akan ada di seluruh tanah Mesir
  rationale: Preserves the resulting state and the comprehensive force of בְּכָל.
- source_word: וּבָעֵצִים וּבָאֲבָנִים
  choice: bahkan di dalam wadah-wadah kayu dan batu
  rationale: The materials are most plausibly metonymic for receptacles holding water; 'bahkan' conveys the surprising extension to stored water. The Hebrew ellipsis is retained in a footnote.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Mempertahankan nama pribadi ilahi dalam bentuk transliterasi yang lazim secara akademis tanpa menggantinya dengan gelar.
- issue: Makna וּבָעֵצִים וּבָאֲבָנִים
  choice: wadah-wadah kayu dan batu
  alternative: secara harfiah, “di dalam kayu dan di dalam batu”
  rationale: Konteks membahas air di seluruh Mesir, sehingga kayu dan batu paling mungkin merupakan metonimia untuk wadah yang terbuat dari bahan tersebut. Karena teks Ibrani bersifat eliptis, bentuk harfiahnya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “mereka” dipertahankan dalam daftar untuk mencerminkan bentuk Ibrani dan memperjelas cakupan seluruh sistem perairan Mesir; ungkapan eliptis pada akhir ayat dibuat eksplisit dalam teks dan bentuk harfiahnya dicatat.
