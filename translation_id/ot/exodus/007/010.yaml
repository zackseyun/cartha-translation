base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/010.yaml
  text: So Moses and Aaron went in to Pharaoh[a], and they did so, just as Yahweh had commanded. Then Aaron threw down his staff before Pharaoh and before his servants, and it became a serpent.
translation:
  language: id
  text: Musa dan Harun menghadap Firaun dan melakukan tepat seperti yang Yahweh perintahkan. Harun melemparkan tongkatnya di hadapan Firaun dan di hadapan para pegawainya, lalu tongkat itu menjadi seekor ular.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani tannin juga dapat berarti reptil besar atau makhluk seperti naga; di sini agaknya menunjuk kepada ular dalam tanda di hadapan Firaun.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא ... אֶל־פַּרְעֹה
  choice: menghadap Firaun
  rationale: Dalam konteks istana, frasa ini menyatakan bahwa Musa dan Harun datang memasuki hadirat Firaun; 'menghadap' alami dalam bahasa Indonesia dan menyampaikan nuansa audiensi tanpa menambah detail.
- source_word: וַיַּעַשׂוּ כֵן כַּאֲשֶׁר צִוָּה
  choice: melakukan tepat seperti yang diperintahkan
  rationale: Ungkapan ini menandai pelaksanaan yang sesuai dengan perintah sebelumnya; 'tepat seperti' mempertahankan penekanan pada kesesuaian tindakan mereka.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: וַיַּשְׁלֵךְ
  choice: melemparkan
  rationale: Kata kerja ini berarti melemparkan atau mencampakkan; 'melemparkan' jelas dan wajar untuk tindakan tanda di hadapan Firaun.
- source_word: מַטֵּהוּ
  choice: tongkatnya
  rationale: '''Tongkat'' adalah padanan Indonesia modern yang alami bagi tongkat yang dibawa Harun dan digunakan dalam tanda-tanda.'
- source_word: לִפְנֵי פַרְעֹה וְלִפְנֵי עֲבָדָיו
  choice: di hadapan Firaun dan para pegawainya
  rationale: '''Di hadapan'' mempertahankan sifat publik tindakan itu. Dalam lingkungan kerajaan, עֲבָדִים dapat menunjuk para pelayan atau pejabat raja; ''para pegawai'' menyampaikan fungsi istana tanpa menyiratkan bahwa mereka budak rumah tangga.'
- source_word: וַיְהִי לְתַנִּין
  choice: tongkat itu menjadi seekor ular besar
  rationale: תַנִּין memiliki cakupan makna lebih luas daripada נָחָשׁ dan dapat menunjuk reptil besar atau makhluk seperti naga. Dalam tanda ini, 'ular besar' alami sekaligus mempertahankan perbedaan leksikal dari istilah umum untuk ular pada Keluaran 4:3.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi. 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Identitas תַנִּין dalam tanda di hadapan Firaun
  choice: ular besar
  alternative: ular; reptil besar; makhluk seperti naga
  rationale: Konteks mendukung sejenis ular, tetapi istilah Ibraninya mempunyai cakupan lebih luas dan berbeda dari נָחָשׁ. Terjemahan utama tidak memaksakan gambaran naga, sedangkan catatan kaki mempertahankan ambiguitas leksikal yang asli.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Menghadap Firaun' dipilih sebagai ungkapan istana yang alami. Nama Yahweh dipertahankan. Penanda catatan kaki ditempatkan langsung setelah frasa yang diterangkannya.
