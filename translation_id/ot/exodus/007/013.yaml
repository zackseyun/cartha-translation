  text: But Pharaoh's heart was hardened[a], and he did not listen to them, just as Yahweh had spoken.
translation:
  language: id
  text: Namun, hati Firaun mengeras[a], dan ia tidak mendengarkan mereka, seperti yang telah difirmankan Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “hati Firaun menjadi keras.” Secara lebih harfiah, kata Ibraninya berarti “menjadi kuat/teguh”; dalam konteks ini menunjuk pada hati yang menjadi keras.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק
  choice: mengeras
  rationale: Bentuk Ibrani ini menyatakan bahwa hati Firaun menjadi kuat atau keras tanpa menyebut pelaku yang mengeraskannya. Dalam bahasa Indonesia, “mengeras” menyampaikan perubahan keadaan itu secara alami dan tidak menambahkan agen.
- source_word: לֵב פַּרְעֹה
  choice: hati Firaun
  rationale: “Hati” merupakan padanan lazim untuk לֵב dan di sini mencakup batin, kehendak, serta sikap Firaun.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: dan ia tidak mau mendengarkan mereka
  rationale: שׁמע dengan אֶל dalam konteks ini berarti mendengarkan atau mengindahkan. Penambahan “mau” mengungkapkan penolakan untuk mengindahkan, bukan ketidakmampuan mendengar.
- source_word: כַּאֲשֶׁר
  choice: tepat seperti
  rationale: Ungkapan ini menandai kesesuaian antara peristiwa tersebut dan firman Yahweh sebelumnya.
- source_word: דִּבֶּר
  choice: telah difirmankan
  rationale: Bentuk “telah” memperjelas bahwa firman itu disampaikan sebelumnya, sedangkan “difirmankan” merupakan diksi Indonesia yang wajar dan bermartabat untuk perkataan Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
theological_decisions:
- issue: Pelaku dalam pengerasan hati Firaun
  choice: hati Firaun mengeras
  alternative: hati Firaun dikeraskan
  rationale: Kata kerja Ibrani menyatakan hati itu menjadi kuat atau keras, tetapi ayat ini tidak menyebut agen. Terjemahan “mengeras” mempertahankan ketegangan naratif tanpa secara khusus menetapkan Allah atau Firaun sebagai pelaku dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum sambil mempertahankan nama Yahweh dan ketidakjelasan mengenai agen pengerasan hati.
