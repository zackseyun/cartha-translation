  - severity: low
    issue: Urutan “ambillah di tanganmu tongkat” kurang alami dalam bahasa Indonesia.
    rationale: Makna dasarnya dapat dipahami, tetapi “bawalah tongkat ... itu di tanganmu” adalah bentuk yang lebih idiomatis dan tetap menyatakan bahwa tongkat itu harus dibawa di tangan.
