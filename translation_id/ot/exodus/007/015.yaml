  text: לֵ֣ךְ אֶל פַּרְעֹ֞ה בַּ/בֹּ֗קֶר הִנֵּה֙ יֹצֵ֣א הַ/מַּ֔יְמָ/ה וְ/נִצַּבְתָּ֥ לִ/קְרָאת֖/וֹ עַל שְׂפַ֣ת הַ/יְאֹ֑ר וְ/הַ/מַּטֶּ֛ה אֲשֶׁר נֶהְפַּ֥ךְ לְ/נָחָ֖שׁ תִּקַּ֥ח בְּ/יָדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/015.yaml
  text: Go to Pharaoh in the morning[a]. Look, he is going out to the water, and you shall stand to meet him on the bank of the Nile[b], and you shall take in your hand the staff that was turned into a serpent.
translation:
  language: id
  text: Pergilah kepada Firaun pada pagi hari. Lihat, ia sedang keluar menuju air. Berdirilah untuk menemuinya di tepi Sungai Nil[a], dan bawalah tongkat yang telah berubah menjadi ular itu di tanganmu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sungai itu.” Dalam kitab Keluaran, kata Ibrani יְאֹר biasanya secara khusus menunjuk kepada Sungai Nil.'
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani נָחָשׁ berarti “ular.” Dalam beberapa terjemahan Inggris, kata ini juga diterjemahkan “serpent.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ אֶל־פַּרְעֹה
  choice: Pergilah kepada Firaun
  rationale: Bentuk imperatif memberi perintah langsung, sedangkan אֶל menyatakan arah kepada seseorang. Ungkapan ini formal tetapi tetap wajar dalam bahasa Indonesia.
- source_word: בַּבֹּקֶר
  choice: pada pagi hari
  rationale: Frasa ini menyatakan waktu tanpa secara eksplisit mengatakan 'besok', sehingga unsur yang tidak terdapat dalam teks sumber tidak ditambahkan.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Kata ini menarik perhatian kepada tindakan Firaun yang segera dijelaskan. 'Lihat' mempertahankan fungsi deiktiknya tanpa memakai ungkapan arkais.
- source_word: יֹצֵא הַמַּיְמָה
  choice: ia sedang keluar menuju air
  rationale: Partisipel יֹצֵא dapat menggambarkan tindakan yang sedang berlangsung, dan akhiran arah pada הַמַּיְמָה menunjukkan gerak menuju air.
- source_word: וְנִצַּבְתָּ לִקְרָאתוֹ
  choice: Berdirilah untuk menemuinya
  rationale: Bentuk Nifal menyampaikan tindakan mengambil posisi atau berdiri, sementara לִקְרָאתוֹ berarti pergi atau berada untuk menemui seseorang. Terjemahan ini tidak menambahkan nuansa konfrontasi yang tidak wajib.
- source_word: עַל שְׂפַת הַיְאֹר
  choice: di tepi Sungai Nil
  rationale: שָׂפָה berarti tepi dalam konteks perairan. Dalam kisah Keluaran, יְאֹר secara khusus menunjuk kepada Sungai Nil.
- source_word: הַמַּטֶּה
  choice: tongkat
  rationale: מַטֶּה menunjuk kepada tongkat yang dibawa Musa; 'tongkat' adalah padanan Indonesia yang alami dan sesuai konteks.
- source_word: אֲשֶׁר נֶהְפַּךְ לְנָחָשׁ
  choice: yang telah berubah menjadi ular
  rationale: Nifal נֶהְפַּךְ dapat menyatakan bahwa sesuatu berubah atau dijadikan berubah. 'Telah berubah' mempertahankan hasil peristiwa sebelumnya tanpa menentukan pelaku secara eksplisit; נָחָשׁ secara alami diterjemahkan 'ular'.
- source_word: תִּקַּח בְּיָדֶךָ
  choice: ambillah di tanganmu
  rationale: Bentuk imperfek berfungsi sebagai perintah dalam rangkaian ini. Frasa 'di tanganmu' dipertahankan karena merupakan gambaran konkret dalam bahasa Ibrani.
theological_decisions:
- issue: Rujukan יְאֹר
  choice: Sungai Nil
  alternative: sungai itu
  rationale: Dalam latar Mesir dan pemakaian kitab Keluaran, kata ini menunjuk secara khusus kepada Sungai Nil. Pilihan ini memperjelas rujukan historis tanpa menambahkan penafsiran doktrinal.
- issue: Nuansa נֶהְפַּךְ
  choice: telah berubah menjadi
  alternative: telah diubah menjadi
  rationale: Bentuk Nifal memungkinkan pengungkapan perubahan tanpa menyebut pelaku. Terjemahan terpilih mempertahankan ketaktertentuan gramatikal itu, sedangkan bentuk pasif Indonesia akan lebih menonjolkan adanya pelaku.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk imperatif memakai akhiran -lah agar rangkaian perintah terdengar jelas dan alami. Kata ganti 'ia' dipakai untuk Firaun, sedangkan sapaan orang kedua tunggal dipertahankan melalui bentuk verba dan '-mu'.
