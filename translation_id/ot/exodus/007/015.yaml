  source_fidelity: 'Teks pokok pada umumnya setia pada bahasa Ibrani: perintah kepada Musa, keterangan waktu pagi, keluarnya Firaun ke air, tindakan mengambil posisi untuk menemui dia di tepi Nil, dan tongkat yang berubah menjadi ular semuanya terwakili. “Telah berubah menjadi” dengan tepat tidak memaksakan pelaku perubahan yang tidak dinyatakan secara eksplisit oleh bentuk Nifal. Namun, catatan [b] memasukkan padanan yang tidak didukung oleh נָחָשׁ.'
  naturalness: Bahasa baku dan register naratifnya baik. Frasa “ambillah di tanganmu tongkat” terasa kurang idiomatis karena penempatan “di tanganmu” dapat terdengar seolah-olah tongkat itu diambil dari tangan. “Bawalah ... di tanganmu” lebih alami serta mempertahankan gambaran konkret teks sumber.
  terminology: “Firaun,” “Sungai Nil,” “tongkat,” dan “ular” tepat. Catatan [b] keliru karena “ular besar” dan khususnya “naga ular” bukan alternatif leksikal yang aman bagi Ibrani נָחָשׁ dalam ayat ini. Bahasa Indonesia tidak memiliki pembedaan baku yang setara persis dengan pilihan Inggris snake/serpent; “ular” adalah padanan yang tepat.
  issues:
