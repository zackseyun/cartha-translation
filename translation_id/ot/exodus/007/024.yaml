  text: וַ/יַּחְפְּר֧וּ כָל מִצְרַ֛יִם סְבִיבֹ֥ת הַ/יְאֹ֖ר מַ֣יִם לִ/שְׁתּ֑וֹת כִּ֣י לֹ֤א יָֽכְלוּ֙ לִ/שְׁתֹּ֔ת מִ/מֵּימֵ֖י הַ/יְאֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/024.yaml
  text: And all the Egyptians dug around the Nile for water to drink[a], because they could not drink from the water of the Nile.
translation:
  language: id
  text: Semua orang Mesir menggali di sekitar Sungai Nil untuk mendapatkan air minum, karena mereka tidak dapat minum dari air Sungai Nil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, “sungai” (ye'or); dalam Kitab Keluaran istilah ini secara khusus merujuk kepada Sungai Nil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְפְּרוּ
  choice: menggali
  rationale: Kata kerja חפר berarti menggali. Terjemahan ini langsung dan tidak menambahkan gagasan tentang sumur, yang tidak disebutkan secara eksplisit dalam teks Ibrani.
- source_word: כָל מִצְרַיִם
  choice: semua orang Mesir
  rationale: Secara harfiah ungkapan ini dapat berarti 'seluruh Mesir', tetapi dalam konteks ini menunjuk secara kolektif kepada penduduk Mesir yang mencari air.
- source_word: סְבִיבֹת הַיְאֹר
  choice: di sekitar Sungai Nil
  rationale: סְבִיבֹת menunjuk pada daerah sekeliling, sedangkan הַיְאֹר dalam kisah Keluaran ini secara khusus merujuk kepada Sungai Nil.
- source_word: מַיִם לִשְׁתּוֹת
  choice: untuk mendapatkan air minum
  rationale: Ungkapan Ibrani secara harfiah berarti 'air untuk diminum'. Penambahan 'mendapatkan' menyatakan secara alami tujuan tindakan menggali tanpa menambahkan objek yang tidak ada dalam sumber.
- source_word: כִּי לֹא יָכְלוּ
  choice: karena mereka tidak dapat
  rationale: כִּי di sini memperkenalkan alasan mereka menggali; 'karena' menyatakan hubungan sebab secara jelas.
- source_word: לִשְׁתֹּת מִמֵּימֵי הַיְאֹר
  choice: minum dari air Sungai Nil
  rationale: Preposisi מִן menyatakan sumber. Susunan ini mempertahankan hubungan tersebut dalam bahasa Indonesia yang wajar.
