translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang jelas dan bermartabat. Nama 'Sungai Nil' dipakai untuk memperjelas rujukan geografis, sementara catatan kaki mempertahankan informasi bahwa teks Ibrani memakai istilah umum yang dalam konteks ini menunjuk kepada Sungai Nil.
