  text: And each man threw down his staff[a], and they became serpents; but Aaron’s staff swallowed up their staffs.
translation:
  language: id
  text: Masing-masing melemparkan tongkatnya, lalu tongkat-tongkat itu menjadi ular besar[a]. Namun, tongkat Harun menelan tongkat-tongkat mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “makhluk seperti naga” atau “reptil besar”; kata Ibrani tannin dapat menunjuk makhluk menyerupai ular dengan cakupan yang lebih luas daripada kata yang lazim untuk “ular”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁלִיכוּ
  choice: melemparkan
  rationale: Dalam konteks ini, שׁלך menyatakan tindakan melemparkan atau menjatuhkan suatu benda di hadapan seseorang. “Melemparkan” alami dalam bahasa Indonesia dan cukup mempertahankan gerak tindakan itu.
- source_word: אִישׁ מַטֵּהוּ
  choice: masing-masing ... tongkatnya
  rationale: 'אִישׁ yang diikuti bentuk tunggal bersufiks berfungsi distributif: setiap orang bertindak dengan tongkatnya sendiri. “Masing-masing ... tongkatnya” menyampaikan hal itu secara alami tanpa menambahkan kata “orang” yang tidak diperlukan.'
- source_word: מַטֵּהוּ / מַטֵּה / מַטֹּתָם
  choice: tongkatnya / tongkat / tongkat-tongkat mereka
  rationale: מַטֶּה berarti tongkat atau batang. “Tongkat” sesuai dengan benda konkret dalam kisah ini, dan bentuk tunggal serta jamaknya dipertahankan menurut konteks.
- source_word: וַיִּהְיוּ
  choice: menjadi
  rationale: היה di sini menyatakan perubahan atau hasil. “Menjadi” menyampaikan transformasi itu dengan lugas.
- source_word: לְתַנִּינִם
  choice: ular besar
  rationale: תַּנִּין memiliki cakupan makna lebih luas daripada kata Ibrani yang lazim untuk ular dan dapat menunjuk makhluk reptil besar atau makhluk menyerupai naga. Dalam konteks tanda di hadapan Firaun, “ular besar” jelas dan tetap memberi ruang bagi keluasan istilah sumber; alternatif dicatat dalam catatan kaki.
- source_word: וַיִּבְלַע
  choice: menelan
  rationale: בלע berarti menelan atau melahap. “Menelan” merupakan padanan langsung dan alami; objek yang tidak lagi tersisa sudah tersirat oleh verba tersebut.
- source_word: אֶת
  choice: '[penanda objek langsung, tidak diterjemahkan]'
  rationale: אֶת menandai objek langsung definit dalam bahasa Ibrani dan tidak mempunyai padanan leksikal tersendiri dalam bahasa Indonesia.
