  register: Bahasa Indonesia modern, lugas, dan bermartabat. Ungkapan usia dibuat idiomatis, sedangkan bentuk Ibrani yang lebih harfiah dipertahankan dalam catatan kaki. Penanda [a] dalam teks utama sesuai dengan catatan kaki.
