base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/007.yaml
  text: Moses was eighty years old[a], and Aaron was eighty-three years old, when they spoke to Pharaoh.
translation:
  language: id
  text: Musa berumur delapan puluh tahun[a], dan Harun berumur delapan puluh tiga tahun ketika mereka berbicara kepada Firaun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Musa adalah anak delapan puluh tahun, dan Harun anak tiga dan delapan puluh tahun, ketika mereka berbicara kepada Firaun.”'
    reason: Alternatif leksikal yang memperlihatkan bentuk ungkapan umur dan urutan bilangan dalam bahasa Ibrani.
lexical_decisions:
- source_word: בֶּן ... שָׁנָה
  choice: berumur ... tahun
  rationale: Ungkapan umur dalam bahasa Ibrani secara harfiah memakai pola “anak ... tahun”; bahasa Indonesia modern secara alami menyatakannya dengan “berumur ... tahun”.
- source_word: שְׁמֹנִים שָׁנָה
  choice: delapan puluh tahun
  rationale: Bilangan usia ini berarti delapan puluh tahun dan dipadukan secara idiomatis dengan “berumur”.
- source_word: שָׁלֹשׁ וּשְׁמֹנִים שָׁנָה
  choice: delapan puluh tiga tahun
  rationale: Urutan harfiah bahasa Ibrani adalah “tiga dan delapan puluh”; bahasa Indonesia modern menggunakan urutan “delapan puluh tiga”.
- source_word: בְּדַבְּרָם
  choice: ketika mereka berbicara
  rationale: Preposisi ב pada bentuk infinitif dengan akhiran pronominal berfungsi temporal di sini, yaitu menunjukkan waktu ketika tindakan berbicara berlangsung.
- source_word: אֶל
  choice: kepada
  rationale: Dalam konteks perkataan yang diarahkan kepada seseorang, “kepada” merupakan padanan bahasa Indonesia yang alami.
- source_word: פַּרְעֹה
  choice: Firaun
  rationale: Bentuk baku bahasa Indonesia untuk gelar penguasa Mesir tersebut.
- source_word: וּ
  choice: dan
  rationale: Waw yang menghubungkan penyebutan Musa dan Harun diterjemahkan dengan “dan”; waw pada awal ayat tidak perlu dinyatakan tersendiri karena kesinambungan narasi sudah jelas dalam bahasa Indonesia.
