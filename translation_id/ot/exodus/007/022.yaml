  text: וַ/יַּֽעֲשׂוּ כֵ֛ן חַרְטֻמֵּ֥י מִצְרַ֖יִם בְּ/לָטֵי/הֶ֑ם וַ/יֶּחֱזַ֤ק לֵב פַּרְעֹה֙ וְ/לֹא שָׁמַ֣ע אֲלֵ/הֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/022.yaml
  text: But the magicians of Egypt did the same by their secret arts[a], and Pharaoh’s heart was hardened, and he did not listen to them[b], just as Yahweh had spoken.
translation:
  language: id
  text: Namun, para ahli sihir Mesir melakukan hal yang sama dengan ilmu rahasia mereka[a]. Hati Firaun pun menjadi keras[b], dan ia tidak mendengarkan mereka, tepat seperti yang telah difirmankan Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan mantra-mantra mereka” atau “dengan ilmu gaib mereka.”
    reason: lexical_alternative
  - marker: b
    text: Atau “Hati Firaun dikeraskan.” Bahasa Ibrani dalam ayat ini tidak menyebutkan secara eksplisit siapa yang mengeraskannya.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: melakukan hal yang sama
  rationale: Ungkapan ini secara harfiah berarti ‘melakukan demikian’; pilihan ini secara alami mengaitkan tindakan para ahli sihir dengan tanda sebelumnya.
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: para ahli sihir Mesir
  rationale: Dalam konteks Keluaran, istilah ini menunjuk para ahli ritual istana Firaun yang meniru tanda-tanda; ‘ahli sihir’ jelas dan lazim dalam bahasa Indonesia.
- source_word: בְּלָטֵיהֶם
  choice: dengan ilmu rahasia mereka
  rationale: Frasa ini menyatakan sarana berupa praktik magis yang tersembunyi atau rahasia, tanpa menentukan tekniknya secara berlebihan.
- source_word: וַיֶּחֱזַק לֵב פַּרְעֹה
  choice: Hati Firaun pun menjadi keras
  rationale: Bentuk Ibrani menggambarkan keadaan atau hasil tanpa menyebut pelaku yang mengeraskan; terjemahan ini mempertahankan ketidakjelasan tersebut.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: ia tidak mau mendengarkan mereka
  rationale: שׁמע dengan אֶל bermakna mendengarkan atau mengindahkan. ‘Tidak mau mendengarkan’ menyampaikan penolakan Firaun secara wajar; ‘mereka’ merujuk kepada Musa dan Harun dalam konteks.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: tepat seperti yang telah difirmankan Yahweh
  rationale: Formula ini menunjuk kembali kepada perkataan Yahweh sebelumnya; ‘telah difirmankan’ sesuai dengan urutan narasi dan register Alkitab yang tetap mudah dipahami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
theological_decisions:
- issue: Pelaku pengerasan hati Firaun
  choice: Hati Firaun pun menjadi keras
  alternative: Hati Firaun dikeraskan; Firaun mengeraskan hatinya
  rationale: Ayat ini tidak secara eksplisit menyebut Allah maupun Firaun sebagai pelaku pengerasan. Bentuk intransitif mempertahankan ambiguitas dan ketegangan teologis teks.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. ‘Namun’ menjaga hubungan kontras dengan ayat sebelumnya; ‘pun’ menandai kelanjutan akibat dalam narasi. Nama Yahweh dipertahankan. Semua penanda catatan kaki dicantumkan dalam teks utama.
