  naturalness: Teks yang direvisi tetap memakai bahasa Indonesia baku dan alami. “Belum mendengarkan” menyampaikan makna “hingga sekarang ... tidak mendengarkan” secara idiomatis. Tanda kutip penutup juga diseragamkan.
  terminology: “Yahweh” dengan tepat mempertahankan nama ilahi. “Allah orang Ibrani” mempertahankan sebutan etnis dalam bahasa sumber. “Melayani Aku” mempertahankan keluasan makna עבד, sedangkan “beribadah kepada-Ku” ditempatkan sebagai alternatif leksikal dalam catatan kaki.
