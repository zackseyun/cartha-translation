source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ אֵלָ֗י/ו יְהוָ֞ה אֱלֹהֵ֤י הָ/עִבְרִים֙ שְׁלָחַ֤/נִי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר שַׁלַּח֙ אֶת עַמִּ֔/י וְ/יַֽעַבְדֻ֖/נִי בַּ/מִּדְבָּ֑ר וְ/הִנֵּ֥ה לֹא שָׁמַ֖עְתָּ עַד כֹּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/016.yaml
  text: 'And you shall say to him[a], ‘Yahweh, the God of the Hebrews, has sent me to you, saying: Let my people go, so that they may serve me in the wilderness. But behold, until now you have not listened.’'
translation:
  language: id
  text: 'Katakanlah kepadanya, ‘Yahweh, Allah orang Ibrani, telah mengutus aku kepadamu dengan pesan: Biarkan umat-Ku pergi supaya mereka melayani Aku[a] di padang belantara. Tetapi lihatlah, sampai sekarang engkau belum mendengarkan.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “beribadah kepada-Ku.” Kata Ibrani yang dipakai dapat berarti melayani secara umum maupun beribadah dalam arti keagamaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: Allah orang Ibrani
  rationale: Mempertahankan sebutan etnis עִבְרִים dan mengungkapkan konstruksi kepunyaan secara alami dalam bahasa Indonesia.
- source_word: שְׁלָחַנִי
  choice: telah mengutus aku
  rationale: Bentuk qatal menyatakan pengutusan yang sudah terjadi dan tetap relevan bagi penyampaian pesan saat ini.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: Biarkan umat-Ku pergi
  rationale: Menyampaikan tuntutan pembebasan secara jelas dan wajar tanpa mempersempitnya menjadi sekadar tindakan mengirim.
- source_word: וְיַעַבְדֻנִי
  choice: supaya mereka beribadah kepada-Ku
  rationale: Dalam rumusan tuntutan kepada Firaun dan lokasi padang belantara, verba עבד menunjuk pada pelayanan kepada Allah yang bersifat keagamaan; 'beribadah' merupakan ungkapan Indonesia yang alami, sementara cakupan makna 'melayani' dicatat dalam catatan kaki.
- source_word: בַּמִּדְבָּר
  choice: di padang belantara
  rationale: Menggambarkan wilayah liar yang tidak dihuni tanpa mengharuskannya berupa gurun pasir.
- source_word: וְהִנֵּה
  choice: Namun
  rationale: Dalam konteks ini הִנֵּה menyoroti keadaan yang berlawanan dengan tuntutan sebelumnya. Bahasa Indonesia modern tidak memerlukan padanan deiktis harfiah seperti 'lihatlah' agar fungsi wacananya tersampaikan.
- source_word: לֹא שָׁמַעְתָּ
  choice: engkau tidak mau mendengarkan
  rationale: שׁמע di sini berarti mengindahkan atau menaati, bukan sekadar mendengar bunyi. 'Tidak mau mendengarkan' mempertahankan citra mendengar sekaligus menyatakan penolakan Firaun.
- source_word: עַד כֹּה
  choice: sampai sekarang
  rationale: Padanan idiomatis bagi ungkapan temporal yang berarti hingga saat ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama pribadi ilahi secara langsung; transliterasi 'Yahweh' mempertahankan hal itu tanpa menggantinya dengan gelar.
- issue: Makna וְיַעַבְדֻנִי dalam tuntutan keluaran
  choice: beribadah kepada-Ku
  alternative: melayani Aku
  rationale: Konteks perjalanan ke padang belantara menonjolkan pelayanan keagamaan. Karena verba עבד juga dapat berarti pelayanan secara lebih luas, alternatif itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'engkau' dipakai untuk sapaan tunggal kepada Firaun; kapitalisasi pada 'umat-Ku' dan 'kepada-Ku' menandai rujukan kepada Allah sesuai kebiasaan penerbitan Alkitab Indonesia. Struktur ujaran langsung dipertahankan tanpa kekakuan yang tidak alami.
