revisions:
- from: 'Katakanlah kepadanya, ‘Yahweh, Allah orang Ibrani, telah mengutus aku kepadamu untuk berkata: Biarkan umat-Ku pergi supaya mereka beribadah kepada-Ku[a] di padang belantara. Namun, sampai sekarang engkau tidak mau mendengarkan.’”'
  to: 'Katakanlah kepadanya, ‘Yahweh, Allah orang Ibrani, telah mengutus aku kepadamu dengan pesan: Biarkan umat-Ku pergi supaya mereka melayani Aku[a] di padang belantara. Tetapi lihatlah, sampai sekarang engkau belum mendengarkan.’'
  rationale: Revisi mengembalikan keluasan leksikal עבד dengan memakai “melayani Aku” sebagai terjemahan utama dan mempertahankan “beribadah kepada-Ku” sebagai alternatif. “Belum mendengarkan” menghindari tambahan makna volisional, sementara “Tetapi lihatlah” mencerminkan kontras dan penegasan dalam וְהִנֵּה. Struktur pesan yang diperkenalkan oleh לֵאמֹר diterjemahkan secara alami dengan “dengan pesan”, dan tanda kutip diperbaiki.
