    rationale: “Beribadah” adalah kemungkinan yang sah dalam konteks ini, tetapi עבד memiliki cakupan lebih luas, yakni melayani, termasuk pelayanan/ibadah kepada Allah. Teks utama sebaiknya tidak mempersempitnya; alternatif “beribadah” cocok dicatat dalam catatan kaki.
