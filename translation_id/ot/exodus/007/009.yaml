base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/009.yaml
  text: When Pharaoh speaks to you[a], saying, ‘Produce a sign for yourselves,’ then you shall say to Aaron, ‘Take your staff and throw it down before Pharaoh; let it become a serpent.’
translation:
  language: id
  text: Apabila Firaun berkata kepada kalian, ‘Adakanlah bagi kalian suatu tanda,’ katakanlah kepada Harun, ‘Ambillah tongkatmu dan lemparkanlah ke hadapan Firaun; biarlah tongkat itu menjadi ular besar[a].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani tannin dapat menunjuk pada ular besar, makhluk laut, atau makhluk mirip naga, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Apabila
  rationale: Dalam konteks ini, כִּי memperkenalkan keadaan mendatang yang diantisipasi, bukan alasan kausal. ‘Apabila’ mempertahankan nuansa temporal-kondisionalnya.
- source_word: יְדַבֵּר אֲלֵיכֶם
  choice: berkata kepada kalian
  rationale: Bentuk imperfek dalam klausa temporal-kondisional ini wajar diterjemahkan sebagai kejadian yang akan dihadapi. Bentuk jamak ‘kalian’ mempertahankan sufiks orang kedua jamak Ibrani.
- source_word: מוֹפֵת
  choice: tanda
  rationale: מוֹפֵת menunjuk pada tanda luar biasa atau pertanda. ‘Tanda’ jelas dan sesuai dengan tindakan pembuktian yang diminta Firaun.
- source_word: תְּנוּ לָכֶם
  choice: Tunjukkanlah ... untuk membuktikan diri kalian
  rationale: Secara harfiah berarti ‘berikanlah bagi diri kalian’. Ungkapan Indonesia ini menyampaikan tuntutan agar mereka menyediakan tanda sebagai bukti kewenangan mereka, sekaligus mempertahankan fungsi לָכֶם.
- source_word: וְאָמַרְתָּ אֶל אַהֲרֹן
  choice: katakanlah kepada Harun
  rationale: Rangkaian waw melanjutkan prosedur yang harus dilakukan Musa. Subjek tunggal tersirat dipertahankan melalui bentuk perintah dalam konteks.
- source_word: מַטְּךָ
  choice: tongkatmu
  rationale: מַטֶּה berarti tongkat atau gada; ‘tongkat’ merupakan padanan Indonesia yang alami dalam konteks benda yang dibawa Harun.
- source_word: וְהַשְׁלֵךְ
  choice: lemparkanlah
  rationale: Kata kerja ini berarti melemparkan atau mencampakkan. ‘Lemparkanlah’ menyampaikan tindakan konkret tanpa nada arkais.
- source_word: לִפְנֵי פַרְעֹה
  choice: ke hadapan Firaun
  rationale: Padanan ini mempertahankan arti tindakan yang dilakukan di depan dan dalam kehadiran resmi Firaun.
- source_word: יְהִי
  choice: biarlah ... menjadi
  rationale: Bentuk jusif menyatakan hasil yang dikehendaki dari perintah, bukan sekadar prediksi masa depan.
- source_word: תַנִּין
  choice: ular besar
  rationale: תַנִּין lebih luas daripada istilah biasa untuk ular dan dapat menunjuk reptil besar, makhluk laut, atau makhluk mirip naga. ‘Ular besar’ cocok dengan konteks tanda di hadapan Firaun tanpa menghapus keluasan leksikalnya, yang dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna תַנִּין dalam kisah tanda tongkat
  choice: ular besar
  alternative: ular; makhluk besar mirip naga; makhluk laut
  rationale: Konteks transformasi tongkat mendukung makhluk menyerupai ular, tetapi istilah Ibraninya memiliki cakupan lebih luas daripada נָחָשׁ. Terjemahan utama tidak dibuat terlalu mitologis, sedangkan ambiguitas asli dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. ‘Kalian’ dipakai untuk menunjukkan bahwa bentuk Ibrani yang ditujukan kepada Musa dan Harun adalah jamak. Bentuk ‘-lah’ menjaga nuansa perintah tanpa terdengar kuno.
