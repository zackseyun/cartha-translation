  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה כָּבֵ֖ד לֵ֣ב פַּרְעֹ֑ה מֵאֵ֖ן לְ/שַׁלַּ֥ח הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/014.yaml
  text: Then Yahweh said to Moses[a], “Pharaoh’s heart is heavy; he refuses to let the people go.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa, “Hati Firaun berat[a]; ia menolak membiarkan bangsa itu pergi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Hati Firaun keras.” Kata sifat Ibrani ini secara harfiah berarti “berat,” sebagai metafora untuk sikap keras kepala atau tidak tanggap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi. “Lalu” menyatakan kesinambungan itu secara alami, sedangkan “berfirman” sesuai untuk perkataan Yahweh dalam ragam Alkitab Indonesia yang modern dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֶל־מֹשֶׁה
  choice: kepada Musa
  rationale: Padanan Indonesia yang alami bagi preposisi אֶל dan bentuk baku nama מֹשֶׁה.
- source_word: כָּבֵד לֵב פַּרְעֹה
  choice: Hati Firaun berat
  rationale: Terjemahan ini mempertahankan metafora konkret “berat” dan hubungan konstruksi “hati Firaun,” tanpa meratakannya menjadi istilah umum “keras hati.”
- source_word: מֵאֵן
  choice: ia menolak
  rationale: Bentuk ini menggambarkan sikap penolakan Firaun yang sedang berlangsung; “ia menolak” menyampaikannya dengan ringkas dan alami.
- source_word: לְשַׁלַּח
  choice: membiarkan ... pergi
  rationale: Dalam konteks Keluaran, verba ini menunjuk pada tindakan Firaun mengizinkan umat itu berangkat. Ungkapan ini alami dalam bahasa Indonesia dan tetap mencerminkan makna melepaskan atau menyuruh pergi.
- source_word: הָעָם
  choice: bangsa itu
  rationale: Kata Ibrani menyebut kelompok yang sudah diketahui dari konteks. “Bangsa itu” wajar dalam konteks Israel sebagai suatu umat tanpa menambahkan nama yang tidak tertulis dalam ayat ini.
theological_decisions:
- issue: Menggambarkan keadaan batin Firaun tanpa menghapus keragaman kosakata motif pengerasan hati
  choice: Hati Firaun berat
  alternative: Hati Firaun keras
  rationale: Teks Ibrani memakai כָּבֵד, “berat,” bukan verba atau adjektiva lain yang lazim diterjemahkan “keras.” Mempertahankan metafora ini menghormati perbedaan kosakata dalam rangkaian kisah pengerasan hati dan tidak menjelaskan ketegangan teologis secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Metafora Ibrani yang tidak lazim dipertahankan dalam teks utama, dengan padanan idiomatis dijelaskan melalui catatan kaki.
