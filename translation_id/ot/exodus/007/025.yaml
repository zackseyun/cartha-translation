translation:
  language: id
  text: Genaplah tujuh hari setelah Yahweh memukul Sungai Nil.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Tujuh hari berlalu setelah Yahweh memukul Sungai Nil.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “sungai”; dalam konteks ini istilah tersebut merujuk pada Sungai Nil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּלֵא
  choice: pun genap
  rationale: Bentuk Nifal wayyiqtol dari מלא menyatakan bahwa suatu jangka waktu mencapai kepenuhannya. 'Pun genap' mempertahankan nuansa hasil/penyelesaian sekaligus wajar dalam bahasa Indonesia.
- source_word: שִׁבְעַת יָמִים
  choice: tujuh hari
  rationale: Ungkapan bilangan dan nomina yang secara langsung menunjuk jangka waktu tujuh hari.
- source_word: אַחֲרֵי
  choice: setelah
  rationale: Preposisi temporal yang menunjukkan waktu sesudah suatu tindakan.
- source_word: הַכּוֹת
  choice: memukul
  rationale: Infinitif konstruk dari נכה sesudah אַחֲרֵי berarti 'setelah memukul'. 'Memukul' jelas, modern, dan mempertahankan gambaran tindakan penghukuman dalam konteks tulah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber dipertahankan.
- source_word: הַיְאֹר
  choice: Sungai Nil
  rationale: Dalam konteks kitab Keluaran, יְאֹר secara khusus merujuk pada Sungai Nil, bukan sekadar sungai pada umumnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan khidmat. Partikel 'pun' memberi alur naratif yang alami, sedangkan 'genap' menjaga nuansa bahwa masa tujuh hari mencapai kepenuhannya.
