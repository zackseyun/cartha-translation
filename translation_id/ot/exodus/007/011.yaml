  to: Lalu Firaun pun memanggil orang-orang bijak dan para penyihir. Para ahli ilmu gaib Mesir itu pun melakukan hal yang sama dengan ilmu gaib mereka[a].
  rationale: Revisi mengganti padanan utama yang terlalu sempit dengan “ilmu gaib,” yang mencakup kemungkinan praktik atau seni rahasia tanpa menyatakan mekanisme maupun bentuk tertentu. Catatan kaki mempertahankan “mantra-mantra” sebagai kemungkinan. Pengulangan “pun” mempertahankan kedua penekanan גַּם, dan kelompok terakhir dinyatakan secara eksplisit agar struktur kalimat Indonesia jelas.
