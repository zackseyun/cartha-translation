  text: וַ/יִּקְרָא֙ גַּם פַּרְעֹ֔ה לַֽ/חֲכָמִ֖ים וְ/לַֽ/מְכַשְּׁפִ֑ים וַ/יַּֽעֲשׂ֨וּ גַם הֵ֜ם חַרְטֻמֵּ֥י מִצְרַ֛יִם בְּ/לַהֲטֵי/הֶ֖ם כֵּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/011.yaml
  text: Then Pharaoh also called for the wise men and the sorcerers[a], and they too, the magicians of Egypt, did the same by their enchantments.
translation:
  language: id
  text: Lalu Firaun pun memanggil orang-orang bijak dan para penyihir. Para ahli ilmu gaib Mesir itu pun melakukan hal yang sama dengan ilmu gaib mereka[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dengan mantra-mantra mereka.” Kata Ibrani ini dapat menunjuk kepada mantra atau praktik gaib; nuansa tepatnya tidak pasti.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: memanggil
  rationale: Dalam konteks ini, קרא berarti memanggil orang untuk menghadap; “memanggil” menyampaikan tindakan Firaun secara wajar dalam bahasa Indonesia.
- source_word: גַּם
  choice: pun
  rationale: Partikel “pun” secara alami menandai bahwa Firaun, sebagai tanggapan atas peristiwa sebelumnya, turut bertindak.
- source_word: חֲכָמִים
  choice: orang-orang bijak
  rationale: Ungkapan ini menunjuk kepada orang-orang terpelajar atau penasihat ahli di lingkungan istana tanpa mempersempit peran mereka secara berlebihan.
- source_word: מְכַשְּׁפִים
  choice: para penyihir
  rationale: Istilah dari akar כשׁף menunjuk kepada pelaku sihir; pilihan ini mempertahankan perbedaannya dari חַרְטֻמִּים pada bagian berikut.
- source_word: וַיַּעֲשׂוּ ... כֵּן
  choice: melakukan hal yang sama
  rationale: Gabungan עשה dan כֵּן secara idiomatis menyatakan bahwa mereka meniru tindakan atau tanda yang baru saja dilakukan.
- source_word: גַם הֵם
  choice: mereka pun
  rationale: Pilihan ini mempertahankan penekanan bahwa para ahli Mesir juga melakukan hal yang sama.
- source_word: חַרְטֻמֵּי מִצְרַיִם
  choice: para ahli ilmu gaib Mesir
  rationale: Istilah ini menunjuk kepada para ahli ritual istana Mesir. “Ahli ilmu gaib” jelas bagi pembaca modern sekaligus membedakannya dari מְכַשְּׁפִים, “para penyihir”.
- source_word: בְּלַהֲטֵיהֶם
  choice: dengan mantra-mantra mereka
  rationale: Dalam konteks ini, לַהֲטִים menunjuk kepada sarana praktik gaib atau jampi yang mereka gunakan. “Mantra-mantra” alami dalam bahasa Indonesia, sementara catatan kaki mempertahankan ketidakpastian nuansanya.
theological_decisions:
- issue: Hakikat kuasa para ahli Mesir
  choice: Menyatakan secara fenomenologis bahwa mereka “melakukan hal yang sama dengan mantra-mantra mereka” tanpa menjelaskan mekanismenya.
  alternative: Menegaskan bahwa mereka melakukan mukjizat supernatural yang nyata, atau sebaliknya hanya memakai tipu daya dan keterampilan tangan.
  rationale: Teks Ibrani menyatakan bahwa mereka meniru tindakan tersebut melalui לַהֲטִים mereka, tetapi tidak menerangkan apakah hasil itu berasal dari kuasa supernatural, ilusi, atau penipuan. Terjemahan tidak boleh menyelesaikan pertanyaan yang dibiarkan terbuka oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Orang-orang bijak,” “para penyihir,” dan “para ahli ilmu gaib Mesir” dipilih untuk menjaga perbedaan istilah Ibrani tanpa membuat kalimat terasa teknis. Penanda [a] ditempatkan langsung setelah frasa yang dijelaskannya.
