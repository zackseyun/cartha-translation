  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה רְאֵ֛ה נְתַתִּ֥י/ךָ אֱלֹהִ֖ים לְ/פַרְעֹ֑ה וְ/אַהֲרֹ֥ן אָחִ֖י/ךָ יִהְיֶ֥ה נְבִיאֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/001.yaml
  text: Then Yahweh said to Moses[a], “See, I have made you God to Pharaoh, and Aaron your brother will be your prophet.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa, “Lihatlah, Aku telah menjadikan engkau sebagai Allah bagi Firaun, dan Harun, saudaramu, akan menjadi nabimu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan untuk mempertahankan nama pribadi yang terdapat dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Waw-konsekutif melanjutkan urutan narasi; “Lalu” alami dalam bahasa Indonesia, sedangkan “berfirman” sesuai untuk ujaran Yahweh dalam ragam Alkitab Indonesia yang tetap mudah dipahami.
- source_word: רְאֵה
  choice: Lihatlah
  rationale: Imperatif ini menarik perhatian Musa kepada pernyataan berikutnya dan dipertahankan secara langsung.
- source_word: נְתַתִּיךָ
  choice: Aku telah menjadikan engkau
  rationale: Secara harfiah verba berarti “memberikan/menempatkan”, tetapi dengan pelengkap predikatif אֱלֹהִים, makna resultatif “menjadikan” paling wajar dalam bahasa Indonesia.
- source_word: אֱלֹהִים
  choice: sebagai Allah
  rationale: Teks secara langsung mempredikatkan אֱלֹהִים kepada Musa dalam relasinya dengan Firaun. “Sebagai Allah bagi Firaun” mempertahankan ketegangan dan gambaran perwakilan ilahi tanpa menambahkan kata pembanding yang tidak ada dalam teks.
- source_word: לְפַרְעֹה
  choice: bagi Firaun
  rationale: Preposisi לְ menyatakan relasi Musa terhadap Firaun; “bagi Firaun” alami dan mempertahankan struktur paralel dengan Harun sebagai nabi Musa.
- source_word: אָחִיךָ
  choice: saudaramu
  rationale: Padanan langsung dan alami bagi sebutan hubungan keluarga dalam teks.
- source_word: יִהְיֶה נְבִיאֶךָ
  choice: akan menjadi nabimu
  rationale: Bentuk imperfek menyatakan peran yang akan dijalankan Harun, dan נָבִיא adalah istilah biasa untuk “nabi”, bukan sekadar juru bicara.
theological_decisions:
- issue: Musa disebut אֱלֹהִים dalam hubungannya dengan Firaun
  choice: sebagai Allah bagi Firaun
  alternative: seperti Allah bagi Firaun
  rationale: 'Bahasa Ibrani tidak memakai penanda perbandingan. Terjemahan utama mempertahankan predikasi yang mencolok dan paralelnya: Musa berada dalam kedudukan Allah terhadap Firaun, sedangkan Harun menjadi nabi Musa. Konteks menunjukkan fungsi representatif, tetapi penjelasan itu tidak perlu disisipkan dengan mengubah teks menjadi perbandingan eksplisit.'
- issue: Pemakaian huruf kapital pada אֱלֹהִים
  choice: Allah
  alternative: allah
  rationale: Dalam konstruksi ini Musa menjalankan peran representatif Allah Israel di hadapan Firaun; “Allah” lebih tepat daripada sebutan umum “allah” atau “seorang dewa”, tanpa menyatakan bahwa Musa menjadi ilahi menurut hakikatnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi “Aku” ditulis dengan huruf kapital sesuai kebiasaan luas dalam penerbitan Alkitab Indonesia. Struktur yang tegas dipertahankan untuk mencerminkan ungkapan Ibrani yang sengaja mencolok.
