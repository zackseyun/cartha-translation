  source_fidelity: 'Teks Indonesia secara setia menerjemahkan unsur-unsur Ibrani: waw naratif (“Lalu”), nama ilahi Yahweh, imperatif רְאֵה (“Lihatlah”), bentuk perfektif resultatif נְתַתִּיךָ (“Aku telah menjadikan engkau”), predikasi langsung אֱלֹהִים (“sebagai Allah”), relasi dengan Firaun, serta peran Harun sebagai nabi Musa. Frasa “sebagai Allah bagi Firaun” menyampaikan fungsi representatif yang dimaksud konteks tanpa memasukkan perbandingan eksplisit “seperti” yang tidak terdapat dalam teks sumber.'
  naturalness: Bahasa Indonesia baku, jelas, dan bernada khidmat secara wajar. “Yahweh berfirman kepada Musa” dan “Harun, saudaramu, akan menjadi nabimu” mengalir baik. Penggunaan “engkau” sesuai dengan register naratif-kitab suci modern yang formal.
  terminology: '“Yahweh,” “Allah,” “Firaun,” dan “nabi” dipakai secara konsisten dan tepat. Kapitalisasi “Aku” sesuai konvensi Alkitab Indonesia. Tidak diperlukan catatan kaki Indonesia: terjemahan mempertahankan predikasi Ibrani yang langsung, sementara konteksnya sendiri membatasi maknanya pada peran representatif, bukan perubahan hakikat Musa.'
