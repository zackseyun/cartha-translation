  text: וְ/לֹֽא יִשְׁמַ֤ע אֲלֵ/כֶם֙ פַּרְעֹ֔ה וְ/נָתַתִּ֥י אֶת יָדִ֖/י בְּ/מִצְרָ֑יִם וְ/הוֹצֵאתִ֨י אֶת צִבְאֹתַ֜/י אֶת עַמִּ֤/י בְנֵֽי יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם בִּ/שְׁפָטִ֖ים גְּדֹלִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/004.yaml
  text: Pharaoh will not listen to you[a], and I will lay my hand on Egypt and bring out my hosts—my people[c][b], the sons of Israel—from the land of Egypt with great judgments.
translation:
  language: id
  text: Firaun tidak akan mendengarkan kalian, dan Aku akan meletakkan tangan-Ku atas Mesir serta membawa pasukan-Ku—umat-Ku, bani Israel[a]—keluar dari tanah Mesir dengan hukuman-hukuman besar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Israel”; ungkapan ini berarti keturunan atau umat Israel.
    reason: lexical_alternative
  - marker: b
    text: Atau, “melalui tindakan-tindakan penghakiman yang besar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁמַע אֲלֵכֶם
  choice: mendengarkan kalian
  rationale: Konstruksi שׁמע אֶל berarti mendengarkan atau mengindahkan. 'Mendengarkan' mempertahankan arti langsung tanpa secara eksplisit mengubahnya menjadi 'menaati'; bentuk jamak 'kalian' mencerminkan אֲלֵכֶם.
- source_word: וְנָתַתִּי אֶת יָדִי בְּמִצְרַיִם
  choice: Aku akan menimpakan tangan-Ku atas Mesir
  rationale: Ungkapan ini menyatakan tindakan ilahi yang tegas terhadap Mesir. 'Menimpakan tangan-Ku atas' mempertahankan citra tangan dan nuansa penghukuman, tanpa memakai 'mengulurkan' yang tidak terdapat dalam teks ayat ini.
- source_word: צִבְאֹתַי
  choice: pasukan-pasukan-Ku
  rationale: צָבָא dapat menunjuk kepada pasukan, bala tentara, atau kelompok-kelompok yang terorganisasi. Bentuk ulang mempertahankan jamak dan menyampaikan citra korporat-militer yang nyata dalam istilah Ibrani.
- source_word: עַמִּי בְנֵי יִשְׂרָאֵל
  choice: umat-Ku, bani Israel
  rationale: '''Umat-Ku'' dan ''bani Israel'' dipertahankan dalam hubungan aposisional. ''Bani Israel'' adalah ungkapan Indonesia yang mapan bagi keturunan Israel dan tidak membatasi rujukan hanya kepada laki-laki.'
- source_word: בִּשְׁפָטִים גְּדֹלִים
  choice: dengan hukuman-hukuman yang dahsyat
  rationale: שְׁפָטִים di sini menunjuk pada pelaksanaan keputusan atau hukuman ilahi terhadap Mesir. 'Hukuman-hukuman' mempertahankan bentuk jamak, sedangkan 'dahsyat' menyampaikan besarnya tindakan tersebut secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Sebutan Israel sebagai צִבְאֹתַי
  choice: pasukan-pasukan-Ku
  alternative: rombongan-rombongan-Ku; bala tentara-Ku
  rationale: Pilihan ini mempertahankan gambaran umat Israel sebagai kelompok-kelompok terorganisasi milik Allah, termasuk asosiasi militernya, tanpa menyatakan bahwa mereka semata-mata tentara.
- issue: Cakupan בְנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: keturunan Israel; orang Israel
  rationale: '''Bani Israel'' mempertahankan identitas genealogis-kovenantal ungkapan Ibrani dan dalam pemakaian Indonesia lazim mencakup seluruh umat, bukan hanya anak laki-laki.'
- issue: Sifat שְׁפָטִים
  choice: hukuman-hukuman
  alternative: tindakan-tindakan penghakiman
  rationale: Konteks menekankan keputusan hukum Allah yang dilaksanakan atas Mesir. Terjemahan ini menjaga dimensi yudisial tanpa mereduksinya menjadi bencana alam biasa.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. ''Namun ... maka'' menjaga hubungan wacana: penolakan Firaun diikuti tindakan Allah. Tanda pisah mempertahankan aposisi antara ''pasukan-pasukan-Ku'' dan ''umat-Ku, bani Israel''.'
