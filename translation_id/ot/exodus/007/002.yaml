base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/002.yaml
  text: You shall speak all that I command you[a], and Aaron your brother shall speak to Pharaoh, that he may send the sons of Israel out from his land.
translation:
  language: id
  text: Engkau harus menyampaikan segala yang Kuperintahkan kepadamu, dan Harun, saudaramu, harus berbicara kepada Firaun supaya ia membiarkan keturunan Israel[a] pergi dari negerinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak lelaki Israel”; dapat juga diterjemahkan “orang Israel” atau, menurut ungkapan tradisional, “anak-anak Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְדַבֵּר
  choice: harus menyampaikan
  rationale: Bentuk ini menyatakan tugas yang diperintahkan kepada Musa. “Menyampaikan” wajar dalam bahasa Indonesia ketika isi pesannya disebutkan, meskipun penerimanya tidak dinyatakan dalam klausa ini.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּךָּ
  choice: segala yang Kuperintahkan kepadamu
  rationale: Mempertahankan cakupan menyeluruh dari כָּל dan memungkinkan bentuk imperfek אֲצַוֶּךָּ menunjuk pada perintah Allah yang diberikan dalam penugasan ini dan selanjutnya.
- source_word: אַהֲרֹן אָחִיךָ
  choice: Harun, saudaramu
  rationale: Mengikuti urutan Ibrani sambil memakai aposisi yang alami dan jelas dalam bahasa Indonesia.
- source_word: יְדַבֵּר אֶל־פַּרְעֹה
  choice: harus berbicara kepada Firaun
  rationale: אֶל dengan דבר secara langsung berarti berbicara kepada seseorang; “harus” mempertahankan daya perintah dalam konteks penugasan.
- source_word: וְשִׁלַּח
  choice: supaya ia membiarkan ... pergi
  rationale: Dalam konteks Keluaran, שׁלח sering berarti mengizinkan atau menyuruh suatu kelompok pergi. “Supaya” menyatakan hubungan tujuan/hasil tanpa memastikan bahwa tindakan Firaun langsung terlaksana.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Secara harfiah berarti “anak-anak lelaki Israel,” tetapi sebagai sebutan kolektif menunjuk kepada bangsa keturunan Israel. “Keturunan Israel” mempertahankan gagasan garis keturunan tanpa menimbulkan kesan bahwa yang dimaksud hanya anak-anak atau hanya laki-laki.
- source_word: מֵאַרְצוֹ
  choice: dari negerinya
  rationale: Prefiks מִן menyatakan gerak meninggalkan wilayah milik atau kekuasaan Firaun; “dari negerinya” alami dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan וְשִׁלַּח dengan perkataan Harun kepada Firaun
  choice: supaya ia membiarkan
  alternative: dan ia akan membiarkan
  rationale: Konstruksi ini dapat dipahami sebagai tujuan atau hasil yang diharapkan dari perkataan Harun. Terjemahan “supaya” menjaga ketegangan itu dan tidak menyatakan seolah-olah Firaun pasti segera menuruti perkataan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “Engkau” serta bentuk pronominal “Ku-” dipakai untuk tuturan Allah kepada Musa. Struktur kalimat mempertahankan kesejajaran antara tugas Musa dan tugas Harun, sedangkan istilah kolektif dibuat jelas bagi pembaca masa kini.
