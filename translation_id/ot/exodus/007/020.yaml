  text: וַ/יַּֽעֲשׂוּ כֵן֩ מֹשֶׁ֨ה וְ/אַהֲרֹ֜ן כַּ/אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֗ה וַ/יָּ֤רֶם בַּ/מַּטֶּה֙ וַ/יַּ֤ךְ אֶת הַ/מַּ֨יִם֙ אֲשֶׁ֣ר בַּ/יְאֹ֔ר לְ/עֵינֵ֣י פַרְעֹ֔ה וּ/לְ/עֵינֵ֖י עֲבָדָ֑י/ו וַ/יֵּהָֽפְכ֛וּ כָּל הַ/מַּ֥יִם אֲשֶׁר בַּ/יְאֹ֖ר לְ/דָֽם־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/020.yaml
  text: So Moses and Aaron did so[a], just as Yahweh had commanded. And he raised the staff and struck the water that was in the Nile before Pharaoh's eyes and before the eyes of his servants, and all the water that was in the Nile was turned to blood.
translation:
  language: id
  text: Maka Musa dan Harun melakukan hal itu tepat seperti yang diperintahkan Yahweh. Ia mengangkat tongkat itu lalu memukul air di Sungai Nil[a] di depan mata Firaun dan di depan mata para hambanya. Seluruh air di Sungai Nil pun berubah menjadi darah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “sungai”; dalam kitab Keluaran, istilah Ibrani ini biasanya menunjuk secara khusus kepada Sungai Nil.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: melakukan semuanya itu
  rationale: Mengungkapkan tindakan Musa dan Harun yang sesuai dengan perintah sebelumnya secara alami dalam bahasa Indonesia; kata “semuanya” memperjelas rujukan tanpa menambah tindakan baru.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: tepat seperti yang diperintahkan
  rationale: Mempertahankan daya pembanding כַּאֲשֶׁר dan menunjukkan bahwa tindakan mereka sepenuhnya sesuai dengan perintah yang telah diberikan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi yang dinyatakan langsung dalam teks Ibrani.
- source_word: וַיָּרֶם
  choice: Ia mengangkat
  rationale: Mempertahankan bentuk verba tunggal dan ketidakjelasan eksplisit mengenai apakah pelakunya Musa atau Harun; konteks dekat mengarah kepada Harun, tetapi ayat ini sendiri hanya memakai bentuk tunggal.
- source_word: בַּמַּטֶּה
  choice: tongkat itu
  rationale: “Tongkat” merupakan padanan modern dan wajar bagi מַטֶּה dalam konteks narasi ini; artikel tertentu diterjemahkan dengan “itu” karena tongkat tersebut sudah dikenal dari konteks.
- source_word: וַיַּךְ אֶת־הַמַּיִם
  choice: memukul air
  rationale: Menerjemahkan tindakan נכה secara langsung dan jelas tanpa memakai diksi arkais.
- source_word: הַיְאֹר
  choice: Sungai Nil
  rationale: Dalam kisah Keluaran, יְאֹר menunjuk secara khusus kepada Sungai Nil. Nama acuannya digunakan dalam teks utama, sedangkan arti harfiahnya dicatat dalam catatan kaki.
- source_word: לְעֵינֵי ... וּלְעֵינֵי
  choice: di depan mata Firaun dan di depan mata para hambanya
  rationale: Mempertahankan pengulangan ungkapan Ibrani dan penekanan bahwa peristiwa itu terjadi secara terbuka di hadapan para saksi.
- source_word: עֲבָדָיו
  choice: para hambanya
  rationale: Menyampaikan arti dasar עֶבֶד tanpa menentukan bahwa mereka pejabat atau pelayan istana, sebab pangkat mereka tidak dinyatakan oleh kata Ibrani.
- source_word: וַיֵּהָפְכוּ ... לְדָם
  choice: berubah menjadi darah
  rationale: Ungkapan Indonesia yang alami untuk perubahan hasil yang dinyatakan teks Ibrani; “seluruh air” diperlakukan sebagai nomina massa.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama tersebut alih-alih menggantinya dengan gelar.
- issue: Identitas pelaku verba tunggal וַיָּרֶם dan וַיַּךְ
  choice: Ia
  alternative: Harun
  rationale: Walaupun perintah pada ayat sebelumnya dan konteks narasi mengarah kepada Harun, teks ayat ini memakai verba tunggal tanpa menyebut nama pelakunya. Kata ganti “Ia” mempertahankan ketidakjelasan gramatikal itu dan tidak menambahkan identifikasi yang tidak eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif yang lugas dan bermartabat. Pengulangan “di depan mata” dipertahankan untuk mencerminkan penekanan teks Ibrani. Semua penanda catatan kaki ditempatkan pada istilah yang dijelaskannya.
