translation:
  language: id
  text: Katak-katak itu akan naik menimpamu[a], rakyatmu, dan semua pelayanmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, pada frasa “rakyatmu”, “di antara rakyatmu”. Preposisi Ibrani yang sama dipakai dalam ketiga frasa, tetapi konteksnya mendukung pengertian bahwa katak-katak itu datang menimpa Firaun dan rakyatnya sebagai tulah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָה
  choice: merayapi engkau
  rationale: Preposisi בְּ bersama verba עָלָה dalam konteks tulah menyatakan katak-katak naik dan mengenai tubuh Firaun. “Merayapi engkau” alami dalam bahasa Indonesia dan mempertahankan kesan serbuan yang menimpa dirinya.
- source_word: וּבְעַמְּךָ
  choice: rakyatmu
  rationale: עַם menunjuk kepada rakyat Firaun. Preposisi yang diulang dalam bahasa Ibrani dicakup oleh verba “merayapi” dalam susunan Indonesia, sehingga ketiga sasaran tetap sejajar.
- source_word: וּבְכָל עֲבָדֶיךָ
  choice: semua pegawaimu
  rationale: עֶבֶד dapat berarti hamba, pelayan, budak, atau orang bawahan. Dalam sapaan kepada raja, “pegawai” cukup luas untuk orang-orang yang melayani Firaun tanpa secara khusus menetapkan status mereka sebagai budak atau pejabat tinggi.
- source_word: יַעֲלוּ
  choice: akan naik
  rationale: Bentuk imperfek עָלָה menyatakan tindakan mendatang dan mempertahankan gambaran katak-katak yang naik dari sungai atau tempat asalnya.
- source_word: הַצְפַרְדְּעִים
  choice: katak-katak itu
  rationale: Bentuk jamak dengan artikel tertentu menunjuk kepada kawanan katak dalam tulah yang sedang diumumkan; pengulangan kata menyatakan jamak secara alami dalam bahasa Indonesia.
