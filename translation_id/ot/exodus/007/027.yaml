  text: But if you refuse to let them go[a], behold, I will strike all your territory with frogs.
translation:
  language: id
  text: Tetapi jika engkau menolak membiarkan mereka pergi, lihatlah, Aku akan menghantam seluruh wilayahmu dengan katak-katak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Dan jika engkau menolak membiarkan mereka pergi, lihatlah, Aku akan segera menghantam seluruh negerimu dengan katak-katak.” Bentuk partisip dalam bahasa Ibrani dapat menyatakan tindakan yang segera akan terjadi atau tindakan pada masa mendatang.'
    reason: Menunjukkan dua kemungkinan bagi וְאִם dan nuansa waktu partisip נֹגֵף, serta alternatif wajar bagi גְּבוּל sebagai “negeri”.
lexical_decisions:
- source_word: וְאִם
  choice: Tetapi jika
  rationale: Gabungan konjungsi dan partikel syarat memperkenalkan kemungkinan yang berlawanan dengan tuntutan sebelumnya; “tetapi jika” menyampaikan hubungan itu secara alami.
- source_word: מָאֵן
  choice: menolak
  rationale: Kata kerja ini menyatakan penolakan yang disengaja, bukan sekadar ketidakmampuan atau keraguan.
- source_word: לְשַׁלֵּחַ
  choice: membiarkan mereka pergi
  rationale: Dalam konteks Keluaran, ungkapan ini berarti melepaskan umat Israel dari penahanan; bentuk ini alami dalam bahasa Indonesia dan tidak mempersempit maknanya.
- source_word: הִנֵּה
  choice: lihatlah
  rationale: Partikel ini menarik perhatian secara khidmat kepada penghukuman yang segera diumumkan; “lihatlah” mempertahankan fungsi seruan tersebut.
- source_word: אָנֹכִי
  choice: Aku
  rationale: Pronomina mandiri menegaskan pelaku tindakan. Huruf kapital mengikuti pemakaian bahasa Indonesia ketika Allah berbicara tentang diri-Nya.
- source_word: נֹגֵף
  choice: akan menghantam
  rationale: Partisip ini, bersama הִנֵּה, dapat menyatakan tindakan yang akan atau segera terjadi. “Akan menghantam” mempertahankan gambaran pukulan penghukuman tanpa menetapkan kadar kesegeraan yang tidak sepenuhnya pasti.
- source_word: כָּל גְּבוּלְךָ
  choice: seluruh wilayahmu
  rationale: Di sini גְּבוּל menunjuk kepada segenap daerah kekuasaan Firaun, bukan hanya garis perbatasannya.
- source_word: בַּצְפַרְדְּעִים
  choice: dengan katak-katak
  rationale: Preposisi ב menandai sarana penghukuman. Bentuk ulang menyatakan jamak secara jelas dan alami.
