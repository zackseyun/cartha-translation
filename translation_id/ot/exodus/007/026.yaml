  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה וְ/אָמַרְתָּ֣ אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה שַׁלַּ֥ח אֶת עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/026.yaml
  text: 'And Yahweh said to Moses[a], “Go in to Pharaoh and say to him, ‘Thus says Yahweh: Let my people go, so that they may serve me.’”'
translation:
  language: id
  text: 'Lalu Yahweh berfirman kepada Musa, “Pergilah menghadap Firaun dan katakan kepadanya, ‘Beginilah firman Yahweh: Biarkan umat-Ku pergi agar mereka melayani Aku[a].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyembah Aku.” Kata kerja Ibrani ini dapat merujuk pada pelayanan kepada Allah, termasuk penyembahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. “Lalu” terdengar alami dalam bahasa Indonesia, sedangkan “berfirman” merupakan ungkapan yang bermartabat dan lazim untuk tuturan ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan gelar seperti “TUHAN”.
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: Pergilah menghadap Firaun
  rationale: Kata בוא dapat berarti datang, pergi, atau masuk menurut sudut pandang. Dalam konteks istana, “menghadap Firaun” secara alami menyampaikan tindakan memasuki hadiratnya tanpa memaksakan arah deiktis “datang”.
- source_word: וְאָמַרְתָּ אֵלָיו
  choice: dan katakan kepadanya
  rationale: Rangkaian ini meneruskan perintah pertama dan dalam bahasa Indonesia wajar dinyatakan dengan imperatif “katakan”.
- source_word: כֹּה אָמַר יְהוָה
  choice: Beginilah firman Yahweh
  rationale: Ungkapan ini mempertahankan sifat resmi dan berwibawa dari formula pembawa pesan ilahi.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: Biarkan umat-Ku pergi
  rationale: Dalam konteks tuntutan kepada Firaun, frasa ini menuntut pembebasan umat, bukan sekadar menyuruh mereka berpindah tempat.
- source_word: עַמִּי
  choice: umat-Ku
  rationale: Akhiran orang pertama tunggal dipertahankan, termasuk klaim relasional Yahweh atas Israel. “Umat” paling alami untuk suatu bangsa yang berada dalam hubungan dengan Allah.
- source_word: וְיַעַבְדֻנִי
  choice: agar mereka melayani Aku
  rationale: Bentuk verba ini paling mungkin menyatakan tujuan pembebasan. “Melayani” mempertahankan cakupan עבד yang lebih luas daripada ibadah ritual saja, namun tetap dapat mencakup penyembahan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung. “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan suatu gelar.
- issue: Makna וְיַעַבְדֻנִי sebagai tujuan pembebasan Israel
  choice: agar mereka melayani Aku
  alternative: agar mereka menyembah Aku
  rationale: עבד ketika Allah menjadi objek dapat mencakup penyembahan, tetapi maknanya lebih luas, yaitu mengabdi atau melayani. Pilihan utama menjaga keluasan itu dan tidak membatasi maksud ayat hanya pada tindakan ibadah ritual.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Menghadap Firaun” dipilih sebagai ungkapan alami untuk konteks audiensi kerajaan. Kapitalisasi pada “umat-Ku” dan “Aku” mengikuti gaya penghormatan yang lazim dalam penerjemahan Alkitab bahasa Indonesia.
