  text: וְ/יָדְע֤וּ מִצְרַ֨יִם֙ כִּֽי אֲנִ֣י יְהוָ֔ה בִּ/נְטֹתִ֥/י אֶת יָדִ֖/י עַל מִצְרָ֑יִם וְ/הוֹצֵאתִ֥י אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מִ/תּוֹכָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/005.yaml
  text: And the Egyptians will know that I am Yahweh when I stretch out my hand against Egypt and bring the sons of Israel out from among them[a][b].
translation:
  language: id
  text: Orang Mesir akan mengetahui bahwa Akulah Yahweh ketika Aku mengulurkan tangan-Ku melawan Mesir dan mengeluarkan orang Israel dari tengah-tengah mereka.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Israel”; maksudnya orang Israel atau keturunan Israel.
    reason: lexical_alternative
  - marker: b
    text: Nama ilahi dalam bahasa Ibrani adalah YHWH, yang ditransliterasikan di sini sebagai “Yahweh”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָדְעוּ מִצְרַיִם
  choice: Orang Mesir akan mengetahui
  rationale: Bentuk perfektum dengan waw dalam konteks nubuat menyatakan hasil yang akan terjadi. מִצְרַיִם di sini merujuk kepada penduduk Mesir, bukan semata-mata negerinya.
- source_word: כִּי אֲנִי יְהוָה
  choice: bahwa Akulah Yahweh
  rationale: כִּי memperkenalkan isi pengetahuan mereka. Bentuk 'Akulah' secara alami mempertahankan penekanan pada identitas ilahi, dan nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh'.
- source_word: בִּנְטֹתִי אֶת־יָדִי
  choice: ketika Aku mengulurkan tangan-Ku
  rationale: ב dengan infinitif konstruk bernilai temporal. Ungkapan konkret 'tangan-Ku' dipertahankan, bukan diabstraksikan menjadi 'kuasa-Ku'.
- source_word: עַל־מִצְרָיִם
  choice: melawan Mesir
  rationale: Dalam konteks penghukuman, עַל menunjukkan tindakan yang diarahkan menentang Mesir.
- source_word: וְהוֹצֵאתִי
  choice: dan membawa ... keluar
  rationale: 'Bentuk Hifil dari יצא bersifat kausatif: membuat atau membawa pihak lain keluar.'
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan harfiah 'anak-anak lelaki Israel' merupakan sebutan kolektif bagi bangsa Israel. 'Orang Israel' menyampaikan rujukan itu dengan wajar dan inklusif dalam bahasa Indonesia modern tanpa menyiratkan bahwa hanya laki-laki yang dibawa keluar.
- source_word: מִתּוֹכָם
  choice: dari tengah-tengah mereka
  rationale: Mempertahankan gagasan bahwa Israel dikeluarkan dari lingkungan atau tengah bangsa Mesir; pronomina jamak merujuk kepada orang Mesir.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama pribadi ilahi secara langsung. 'Yahweh' mempertahankan nama itu, sedangkan 'TUHAN' menggantinya dengan gelar.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak lelaki Israel; keturunan Israel
  rationale: Dalam konteks keluarnya seluruh umat, konstruksi maskulin ini berfungsi sebagai sebutan kolektif. Terjemahan 'orang Israel' menghindari kesan keliru bahwa ayat hanya berbicara tentang laki-laki, sementara bentuk sumber dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Huruf kapital pada pronomina yang merujuk kepada Allah mengikuti kebiasaan penerbitan Alkitab Indonesia. Citra antropomorfis 'mengulurkan tangan' dipertahankan, dan struktur kalimat tetap dekat dengan urutan serta hubungan logis teks Ibrani.
