    text: 'Atau: “bak-bak adonanmu.”'
    reason: מִשְׁאֶרֶת dapat menunjuk wadah pengadonan berbentuk mangkuk, bak, atau palung; bentuk persisnya tidak pasti.
  revision_rationale: Revisi mempertajam gambaran proliferasi dalam וְשָׁרַץ, menghapus penekanan tambahan yang tidak ada dalam sumber, dan memperjelas cakupan distributif rumah para pelayan. Urutan lokasi, gerak “naik lalu masuk,” serta ketidakpastian leksikal pada wadah pengadonan tetap dipertahankan.
