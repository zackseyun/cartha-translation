translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Pengulangan "katak" pada kalimat kedua memperjelas subjek dalam bahasa Indonesia, sedangkan titik koma membantu mempertahankan rangkaian lokasi yang panjang. Penanda catatan kaki ditempatkan pada istilah yang benar-benar memiliki alternatif leksikal, yaitu wadah pengadonan.
