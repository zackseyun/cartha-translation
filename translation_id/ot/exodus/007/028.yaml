base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/028.yaml
  text: The Nile will swarm with frogs[a], and they will come up and enter your house, your bedroom, and your bed, and the houses of your servants and your people, and your ovens and your kneading bowls.
translation:
  language: id
  text: Sungai Nil akan berlimpah dengan katak-katak. Katak-katak itu akan naik lalu masuk ke rumahmu, ke kamar tidurmu, dan ke atas tempat tidurmu; ke rumah-rumah para pelayanmu dan di antara rakyatmu; ke dalam tungku-tungkumu dan wadah-wadah pengadonanmu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bak-bak adonanmu.”'
    reason: מִשְׁאֶרֶת dapat menunjuk wadah pengadonan berbentuk mangkuk, bak, atau palung; bentuk persisnya tidak pasti.
lexical_decisions:
- source_word: וְשָׁרַץ
  choice: akan penuh dengan
  rationale: Kata kerja שׁרץ menggambarkan makhluk-makhluk kecil yang muncul atau bergerak dalam jumlah sangat banyak. Ungkapan "akan penuh dengan" terdengar alami dalam bahasa Indonesia dan mempertahankan gambaran kelimpahan itu.
- source_word: הַיְאֹר
  choice: Sungai Nil
  rationale: Dalam latar Mesir di kitab Keluaran, יְאֹר menunjuk secara khusus kepada Sungai Nil, bukan sekadar sungai pada umumnya.
- source_word: צְפַרְדְּעִים
  choice: katak
  rationale: Padanan langsung bagi nomina jamak Ibrani; dalam bahasa Indonesia bentuk tanpa reduplikasi dapat bermakna jamak setelah konstruksi "penuh dengan".
- source_word: וְעָלוּ וּבָאוּ
  choice: akan naik lalu masuk
  rationale: עלה menyatakan gerakan naik dari sungai ke daratan, sedangkan בוא dengan frasa-frasa berpreposisi berikutnya menyatakan masuk ke berbagai tempat.
- source_word: בְּבֵיתֶךָ
  choice: ke rumahmu
  rationale: Dalam rangkaian lokasi fisik ini, בַּיִת menunjuk kepada kediaman Firaun, bukan rumah tangga dalam arti kelompok keluarga.
- source_word: וּבַחֲדַר מִשְׁכָּבְךָ
  choice: ke kamar tidurmu
  rationale: Secara harfiah berarti "ruang tempat engkau berbaring"; "kamar tidur" adalah padanan modern yang tepat dan wajar.
- source_word: וְעַל מִטָּתֶךָ
  choice: ke atas tempat tidurmu
  rationale: Preposisi עַל dipertahankan secara eksplisit agar serbuan katak sampai ke permukaan tempat tidur tetap tergambar jelas.
- source_word: וּבְבֵית עֲבָדֶיךָ
  choice: ke rumah para pelayanmu
  rationale: Bentuk tunggal konstruksi בֵית dengan pemilik jamak dapat dipahami secara distributif, yaitu rumah-rumah milik atau tempat tinggal para pelayan. "Pelayan" menjaga arti umum עֶבֶד dalam konteks ini tanpa menetapkan status sosial yang lebih khusus daripada yang dinyatakan ayat.
- source_word: וּבְעַמֶּךָ
  choice: di antara rakyatmu
  rationale: Karena manusia bukan lokasi yang secara harfiah dimasuki, "di antara" mengungkapkan fungsi lokatif preposisi ב secara alami sambil memperluas tulah kepada seluruh rakyat Firaun.
- source_word: וּבְתַנּוּרֶיךָ
  choice: ke dalam tungku-tungkumu
  rationale: תַּנּוּר menunjuk tungku domestik untuk memanggang atau membakar makanan; "tungku" lebih sesuai dengan peralatan dunia kuno daripada oven modern.
- source_word: וּבְמִשְׁאֲרוֹתֶיךָ
  choice: wadah-wadah pengadonanmu
  rationale: מִשְׁאֶרֶת menunjuk wadah tempat mengolah atau menyimpan adonan. Padanan ini cukup luas untuk mempertahankan ketidakpastian mengenai bentuk persis wadah tersebut.
