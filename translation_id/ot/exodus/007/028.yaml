revisions:
- from: Sungai Nil akan penuh dengan katak. Katak-katak itu akan naik lalu masuk ke rumahmu, ke kamar tidurmu, dan ke atas tempat tidurmu; ke rumah para pelayanmu dan di antara rakyatmu; bahkan ke dalam tungku-tungkumu dan wadah-wadah pengadonanmu[a].
  to: Sungai Nil akan berlimpah dengan katak-katak. Katak-katak itu akan naik lalu masuk ke rumahmu, ke kamar tidurmu, dan ke atas tempat tidurmu; ke rumah-rumah para pelayanmu dan di antara rakyatmu; ke dalam tungku-tungkumu dan wadah-wadah pengadonanmu[a].
  rationale: Revisi mempertajam gambaran proliferasi dalam וְשָׁרַץ, menghapus penekanan tambahan yang tidak ada dalam sumber, dan memperjelas cakupan distributif rumah para pelayan. Urutan lokasi, gerak “naik lalu masuk,” serta ketidakpastian leksikal pada wadah pengadonan tetap dipertahankan.
