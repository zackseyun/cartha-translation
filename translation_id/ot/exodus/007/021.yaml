  text: And the fish in the Nile died[a], and the Nile stank, so that the Egyptians could not drink water from the Nile. And there was blood throughout all the land of Egypt.
translation:
  language: id
  text: Ikan di Sungai Nil mati, lalu sungai itu berbau busuk, sehingga orang Mesir tidak dapat minum air dari Sungai Nil. Di seluruh negeri Mesir ada darah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַדָּגָה
  choice: ikan-ikan
  rationale: Nomina tunggal kolektif ini merujuk pada ikan di sungai secara keseluruhan; bentuk ulang merupakan ungkapan Indonesia yang alami untuk makna jamak kolektif.
- source_word: יְאֹר
  choice: Sungai Nil
  rationale: Dalam konteks kitab Keluaran, kata ini secara khusus menunjuk kepada Sungai Nil; penyebutan nama sungai memperjelas acuannya dalam bahasa Indonesia.
- source_word: מֵתָה
  choice: mati
  rationale: Menyampaikan tindakan selesai dalam urutan narasi secara langsung dan alami.
- source_word: וַיִּבְאַשׁ
  choice: berbau busuk
  rationale: Menangkap makna sungai yang mengeluarkan bau tidak sedap dengan ungkapan Indonesia yang jelas dan kuat.
- source_word: וְלֹא יָכְלוּ
  choice: tidak dapat
  rationale: Padanan baku dan alami untuk menyatakan ketidakmampuan.
- source_word: לִשְׁתּוֹת מַיִם מִן הַיְאֹר
  choice: minum air dari Sungai Nil
  rationale: Mempertahankan verba, objek 'air', dan sumbernya sebagaimana dinyatakan dalam bahasa Ibrani.
- source_word: וַיְהִי הַדָּם
  choice: Darah ada
  rationale: Mempertahankan konstruksi eksistensial teks Ibrani tanpa menjelaskan lebih jauh asal atau bentuk darah itu.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: di seluruh tanah Mesir
  rationale: Menyampaikan cakupan menyeluruh dari frasa Ibrani dalam ragam bahasa Alkitab yang tetap mudah dipahami.
