source:
  edition: WLC
  text: וַ/יַּ֥עַשׂ מֹשֶׁ֖ה וְ/אַהֲרֹ֑ן כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֹתָ֖/ם כֵּ֥ן עָשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/006.yaml
  text: So Moses and Aaron did just as Yahweh had commanded them[a]; so they did.
translation:
  language: id
  text: Musa dan Harun melakukan tepat seperti yang diperintahkan Yahweh[a] kepada mereka; demikianlah mereka melakukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: melakukan
  rationale: Kata kerja עשה bermakna luas, ‘melakukan/membuat’. Dalam konteks menaati perintah, ‘melakukan’ paling alami dan memungkinkan pengulangan kata kerja Ibrani tetap terdengar.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: וְאַהֲרֹן
  choice: dan Harun
  rationale: Koordinasi sederhana dengan Musa serta bentuk nama yang baku dalam bahasa Indonesia.
- source_word: כַּאֲשֶׁר
  choice: tepat seperti
  rationale: Mengungkapkan kesesuaian tindakan mereka dengan perintah secara jelas, tanpa menambahkan gagasan di luar teks.
- source_word: צִוָּה
  choice: yang diperintahkan
  rationale: צוה menyatakan pemberian perintah. Konstruksi pasif relatif ini alami dalam bahasa Indonesia dan mempertahankan Yahweh sebagai pelaku perintah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH, bukan menggantinya dengan gelar, sesuai bukti teks sumber.
- source_word: אֹתָם
  choice: kepada mereka
  rationale: Akhiran orang ketiga jamak merujuk kepada Musa dan Harun; ‘kepada mereka’ merupakan pelengkap alami bagi ‘diperintahkan’ dalam bahasa Indonesia.
- source_word: כֵּן
  choice: demikianlah
  rationale: Menegaskan bahwa tindakan mereka sesuai dengan perintah dan mempertahankan fungsi resumptif unsur Ibrani.
- source_word: עָשׂוּ
  choice: mereka melakukannya
  rationale: Mempertahankan pengulangan עשה pada akhir ayat sambil memakai bentuk Indonesia yang wajar; ‘-nya’ merujuk pada apa yang diperintahkan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani secara langsung memakai Tetragramaton. ‘Yahweh’ mempertahankan nama pribadi ilahi, sedangkan ‘TUHAN’ menggantinya dengan gelar dan ‘Yehuwa’ mencerminkan bentuk tradisional lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan verba sumber dipertahankan untuk menyampaikan penekanan naratif pada ketaatan Musa dan Harun.
