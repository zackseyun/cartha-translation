base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/018.yaml
  text: And the fish that are in the Nile will die[a], and the Nile will stink[b], and the Egyptians will be unable to drink water from the Nile.
translation:
  language: id
  text: Ikan-ikan yang ada di Sungai Nil akan mati, Sungai Nil akan berbau busuk, dan orang Mesir akan kepayahan[a] untuk minum air dari Sungai Nil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "tidak akan sanggup". Kata Ibrani yang digunakan dapat berarti menjadi letih atau kepayahan sehingga tidak mampu melakukan sesuatu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּגָה
  choice: ikan-ikan
  rationale: Nomina tunggal kolektif ini menunjuk pada seluruh ikan di sungai; bentuk ulang merupakan ungkapan kolektif yang alami dalam bahasa Indonesia.
- source_word: יְאֹר
  choice: Sungai Nil
  rationale: Dalam konteks kitab Keluaran, istilah ini secara khusus menunjuk pada Sungai Nil; penyebutan nama sungai memperjelas rujukannya.
- source_word: תָּמוּת
  choice: akan mati
  rationale: Padanan langsung dan wajar untuk verba מות dalam konteks nubuat tentang kematian ikan.
- source_word: וּבָאַשׁ
  choice: akan berbau busuk
  rationale: Verba באש menyatakan menjadi busuk atau mengeluarkan bau busuk; pilihan ini jelas dan alami tanpa memperhalus gambaran Ibrani.
- source_word: וְנִלְאוּ
  choice: akan kepayahan
  rationale: Bentuk Nifal dari לאה membawa gagasan menjadi letih atau tidak sanggup karena keletihan. 'Akan kepayahan' mempertahankan nuansa proses dan tidak menyederhanakannya hanya menjadi ketidakmampuan.
- source_word: לִשְׁתּוֹת מַיִם
  choice: untuk minum air
  rationale: Mempertahankan objek 'air' yang disebut secara eksplisit dalam bahasa Ibrani.
- source_word: מִן הַיְאֹר
  choice: dari Sungai Nil
  rationale: Padanan preposisional yang alami dan tepat dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan kalimat yang jelas dan bermartabat. 'Berbau busuk' mempertahankan daya gambarnya, sedangkan 'kepayahan' menjaga ambiguitas leksikal antara keletihan dan ketidakmampuan.
