  yaml_path: translation/ot/exodus/007/023.yaml
  text: Pharaoh turned and went into his house[a], and he did not take even this to heart.
translation:
  language: id
  text: Firaun berpaling, lalu masuk ke rumahnya. Bahkan hal ini pun tidak dipedulikannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ia tidak mengarahkan hatinya bahkan kepada hal ini”; atau, “ia sama sekali tidak mengindahkan hal ini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֶן
  choice: berpaling
  rationale: Kata פנה menyatakan tindakan berbalik atau berpaling. Pilihan ini mempertahankan gerak naratif tanpa menambahkan arah yang tidak dinyatakan secara eksplisit.
- source_word: פַּרְעֹה
  choice: Firaun
  rationale: Bentuk baku dalam bahasa Indonesia untuk gelar penguasa Mesir.
- source_word: וַיָּבֹא אֶל בֵּיתוֹ
  choice: lalu masuk ke rumahnya
  rationale: Konstruksi בוא אֶל menyatakan gerak menuju atau masuk ke suatu tempat. Dalam konteks ini, 'masuk ke rumahnya' menyampaikan bahwa Firaun kembali memasuki kediamannya tanpa mengganti 'rumah' dengan 'istana'.
- source_word: וְלֹא שָׁת לִבּוֹ
  choice: tidak dipedulikannya
  rationale: Ungkapan Ibrani ini secara harfiah berbicara tentang menaruh atau menetapkan hati, tetapi secara idiomatis berarti memberi perhatian atau mengindahkan. 'Tidak dipedulikannya' alami dalam bahasa Indonesia modern dan tetap menunjukkan sikap Firaun yang mengabaikan peristiwa tersebut.
- source_word: גַּם לָזֹאת
  choice: Bahkan hal ini pun
  rationale: 'Gabungan ''bahkan ... pun'' secara alami menyampaikan daya tekan גַּם: peristiwa ini sekalipun tidak mendapat perhatian Firaun.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan dua kalimat menjaga alur tindakan dan menonjolkan sikap Firaun. Ungkapan idiomatis dipakai dalam teks utama, sedangkan gambaran harfiah tentang hati dipertahankan dalam catatan kaki.
