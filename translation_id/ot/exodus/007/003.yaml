  yaml_path: translation/ot/exodus/007/003.yaml
  text: But I will harden Pharaoh’s heart[a], and I will multiply my signs and my wonders in the land of Egypt.
translation:
  language: id
  text: Namun, Aku akan mengeraskan hati Firaun[a] dan memperbanyak tanda-tanda serta keajaiban-keajaiban-Ku di negeri Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membuat hati Firaun keras” atau “membuat hati Firaun bersikeras.” Kata kerja Ibrani berbentuk kausatif dan menyatakan pengerasan itu secara langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: Namun, Aku
  rationale: Konjungsi yang disertai kata ganti eksplisit memberi tekanan atau kontras dalam konteks. “Namun, Aku” menyampaikannya secara alami dalam bahasa Indonesia.
- source_word: אַקְשֶׁה
  choice: akan mengeraskan
  rationale: 'Bentuk Hifil dari קשׁה bersifat kausatif: membuat keras atau mengeraskan. Pilihan ini mempertahankan tindakan langsung Allah tanpa mengubahnya menjadi sekadar izin.'
- source_word: לֵב פַּרְעֹה
  choice: hati Firaun
  rationale: Frasa konstruksi ini paling alami diterjemahkan “hati Firaun”. Metafora “hati” dipertahankan dan tidak dipersempit menjadi pikiran atau kemauan.
- source_word: וְהִרְבֵּיתִי
  choice: dan memperbanyak
  rationale: Dalam rangkaian ini bentuk verba menyatakan tindakan mendatang. “Memperbanyak” mempertahankan unsur kausatif dan cocok dengan tanda serta keajaiban sebagai objek.
- source_word: אֹתֹתַי
  choice: tanda-tanda-Ku
  rationale: אוֹת lazim berarti “tanda”; bentuk jamak dan sufiks milik orang pertama dipertahankan.
- source_word: מוֹפְתַי
  choice: keajaiban-keajaiban-Ku
  rationale: מוֹפֵת dapat berarti keajaiban atau pertanda. “Keajaiban” paling jelas dalam konteks karya ilahi dan tidak mempersempit maknanya menjadi alamat atau firasat.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: di tanah Mesir
  rationale: Kata אֶרֶץ dinyatakan secara eksplisit dalam bahasa Ibrani; “tanah Mesir” mempertahankannya dengan ungkapan Indonesia yang wajar.
theological_decisions:
- issue: Tindakan Allah dalam pengerasan hati Firaun
  choice: Aku akan mengeraskan hati Firaun
  alternative: Aku akan membiarkan hati Firaun menjadi keras
  rationale: Bentuk Hifil menyajikan tindakan Allah secara kausatif dan langsung. Terjemahan utama mempertahankan ketegangan teologis itu dan tidak melunakkannya menjadi tindakan yang hanya mengizinkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Kapitalisasi kata ganti yang merujuk kepada Allah mengikuti kelaziman penerbitan Alkitab Indonesia. Pengulangan jamak dipakai pada “tanda-tanda” dan “keajaiban-keajaiban” agar bentuk jamak sumber tampak jelas.
