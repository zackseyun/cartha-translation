  text: כֹּ֚ה אָמַ֣ר יְהוָ֔ה בְּ/זֹ֣את תֵּדַ֔ע כִּ֖י אֲנִ֣י יְהוָ֑ה הִנֵּ֨ה אָנֹכִ֜י מַכֶּ֣ה בַּ/מַּטֶּ֣ה אֲשֶׁר בְּ/יָדִ֗/י עַל הַ/מַּ֛יִם אֲשֶׁ֥ר בַּ/יְאֹ֖ר וְ/נֶהֶפְכ֥וּ לְ/דָֽם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/007/017.yaml
  text: 'Thus says Yahweh: By this you will know that I am Yahweh: behold[a], I am striking the water that is in the Nile with the staff that is in my hand, and it will be turned to blood.'
translation:
  language: id
  text: 'Beginilah firman Yahweh, “Dengan ini engkau akan tahu bahwa Akulah Yahweh: Lihat, aku akan memukul air di Sungai Nil dengan tongkat yang ada di tanganku, dan air itu akan berubah menjadi darah.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּה אָמַר יְהוָה
  choice: Beginilah firman Yahweh
  rationale: Ungkapan ini mempertahankan rumusan resmi penyampaian pesan ilahi dalam bahasa Indonesia yang alami dan bermartabat; nama יהוה ditransliterasikan sebagai Yahweh.
- source_word: בְּזֹאת
  choice: Dengan inilah
  rationale: 'Preposisi בְּ bersifat instrumental: tindakan atau tanda berikut menjadi sarana yang membuat Firaun mengenal siapa Yahweh.'
- source_word: תֵּדַע
  choice: engkau akan tahu
  rationale: Bentuk imperfek menyatakan akibat yang akan terjadi. 'Engkau' mempertahankan sapaan orang kedua tunggal kepada Firaun.
- source_word: כִּי אֲנִי יְהוָה
  choice: bahwa Akulah Yahweh
  rationale: Bentuk 'Akulah' menyampaikan penegasan pada אֲנִי dan mempertahankan pernyataan pengenalan diri dengan nama ilahi.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Kata ini menarik perhatian kepada tindakan yang segera terjadi. 'Lihat' lebih wajar dalam bahasa Indonesia modern daripada bentuk arkais seperti 'sesungguhnya' dalam fungsi deiktis ini.
- source_word: אָנֹכִי מַכֶּה
  choice: aku akan memukul
  rationale: Partisip dengan pronomina mandiri menggambarkan tindakan yang segera atau sudah di ambang pelaksanaan. Bentuk masa depan dekat tersirat secara alami dari konteks Indonesia tanpa menyatakan bahwa pukulan telah berlangsung saat ucapan disampaikan.
- source_word: בַּמַּטֶּה אֲשֶׁר בְּיָדִי
  choice: dengan tongkat yang ada di tanganku
  rationale: '''Tongkat'' merupakan padanan alami bagi מַטֶּה dalam konteks Musa; klausa relatif dipertahankan karena teks menonjolkan alat yang berada di tangan pembicara.'
- source_word: עַל הַמַּיִם אֲשֶׁר בַּיְאֹר
  choice: air di Sungai Nil
  rationale: Dalam konstruksi dengan verba 'memukul', bahasa Indonesia secara alami memakai objek langsung. יְאֹר di konteks Mesir menunjuk kepada Sungai Nil.
- source_word: וְנֶהֶפְכוּ לְדָם
  choice: dan air itu akan berubah menjadi darah
  rationale: Bahasa Indonesia memperlakukan 'air' sebagai nomina massa tunggal, sedangkan verba Ibrani berbentuk jamak karena bersesuaian dengan הַמַּיִם. 'Berubah menjadi' mempertahankan makna transformasi tanpa memaksakan pelaku pasif.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama perjanjian יהוה secara langsung. 'Yahweh' mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Daya penegasan כִּי אֲנִי יְהוָה
  choice: bahwa Akulah Yahweh
  alternative: bahwa aku adalah Yahweh
  rationale: '''Akulah'' mempertahankan penekanan pengenalan diri dalam konteks rangkaian tulah tanpa menambahkan penafsiran ontologis di luar teks.'
- issue: Pelaku gramatikal tindakan memukul
  choice: aku akan memukul
  alternative: Aku sedang memukul; Aku hendak memukul
  rationale: אָנֹכִי secara gramatikal menunjuk kepada Yahweh, walaupun tongkat secara naratif berada di tangan Musa. Terjemahan mempertahankan ketegangan antara tindakan ilahi dan perantaraan manusia tanpa menjelaskannya secara denominatif.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan khidmat. Kata ganti 'engkau' dipakai untuk sapaan tunggal kepada Firaun, sedangkan 'aku' mengikuti ujaran langsung Yahweh. Kapitalisasi 'Akulah' menandai awal unsur pronominal yang ditegaskan setelah 'bahwa', bukan pemberian gelar baru. Tidak diperlukan catatan kaki karena pergeseran jamak Ibrani 'air-air' menjadi nomina massa Indonesia tidak menghilangkan alternatif makna yang penting.
