translation:
  language: id
  text: Buatlah tirai dari bulu kambing untuk menjadi kemah di atas Kemah Suci; buatlah sebelas tirai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tirai-tirai dari kambing.” Dalam bahasa Ibrani, kata “kambing” di sini menunjuk pada bahan yang berasal dari kambing, yaitu bulu kambing.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Buatlah
  rationale: Bentuk Qal dalam rangkaian petunjuk diterjemahkan sebagai perintah langsung yang alami dalam bahasa Indonesia.
- source_word: יְרִיעֹת
  choice: lembar tirai
  rationale: Dalam konteks pembangunan Kemah Suci, kata ini menunjuk pada lembaran kain besar; frasa ini juga memungkinkan jumlah sebelas dinyatakan dengan jelas.
- source_word: עִזִּים
  choice: bulu kambing
  rationale: Secara harfiah berarti 'kambing', tetapi konstruksi ini menunjuk pada bahan yang berasal dari kambing, yaitu bulunya.
- source_word: לְאֹהֶל
  choice: untuk membentuk kemah
  rationale: 'Preposisi לְ menyatakan tujuan atau fungsi: tirai-tirai itu digunakan sebagai lapisan kemah.'
- source_word: עַל הַמִּשְׁכָּן
  choice: di atas Kemah Suci
  rationale: עַל menyatakan posisi di atas, sedangkan מִשְׁכָּן adalah istilah khusus bagi tempat kudus portabel dalam konteks Keluaran; 'Kemah Suci' merupakan padanan Indonesia yang jelas dan lazim.
- source_word: עַשְׁתֵּי עֶשְׂרֵה יְרִיעֹת תַּעֲשֶׂה אֹתָם
  choice: Buatlah sebelas lembar tirai
  rationale: Susunan diatur secara alami dalam bahasa Indonesia sambil mempertahankan jumlah dan objek yang diperintahkan.
