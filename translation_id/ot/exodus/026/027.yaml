  text: וַ/חֲמִשָּׁ֣ה בְרִיחִ֔ם לְ/קַרְשֵׁ֥י צֶֽלַע הַ/מִּשְׁכָּ֖ן הַ/שֵּׁנִ֑ית וַ/חֲמִשָּׁ֣ה בְרִיחִ֗ם לְ/קַרְשֵׁי֙ צֶ֣לַע הַ/מִּשְׁכָּ֔ן לַ/יַּרְכָתַ֖יִם יָֽמָּ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/027.yaml
  text: and five bars for the boards of the second side of the tabernacle[b][a], and five bars for the boards of the side of the tabernacle at the rear westward.
translation:
  language: id
  text: dan lima batang pengikat untuk papan-papan pada sisi kedua Kemah Suci,[a] serta lima batang pengikat untuk papan-papan pada sisi Kemah Suci yang di bagian belakang, ke arah barat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sisi yang satu lagi dari Kemah Suci.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di bagian belakang, ke arah barat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרִיחִם
  choice: batang pengikat
  rationale: Dalam konteks pembangunan Kemah Suci, istilah ini menunjuk pada batang horizontal yang menyatukan papan-papan. 'Batang pengikat' jelas dan alami dalam bahasa Indonesia.
- source_word: קַרְשֵׁי
  choice: papan-papan
  rationale: Istilah ini menunjuk pada unsur kayu struktural Kemah Suci. 'Papan-papan' mempertahankan arti konkret tanpa menafsirkan bentuknya secara berlebihan.
- source_word: צֶלַע
  choice: sisi
  rationale: Dalam uraian arsitektural ini, kata tersebut menyatakan sisi Kemah Suci.
- source_word: הַשֵּׁנִית
  choice: kedua
  rationale: Terjemahan ini mempertahankan arti harfiah kata Ibrani, sambil mencatat kemungkinan kontekstual 'yang satu lagi' dalam catatan kaki.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: Dalam konteks Kitab Keluaran, istilah ini menjadi sebutan tetap bagi tempat kudus berbentuk kemah. 'Kemah Suci' merupakan padanan Indonesia yang jelas dan lazim.
- source_word: לַיַּרְכָתַיִם
  choice: di bagian belakang
  rationale: Bentuk ini menunjuk pada bagian paling belakang atau ujung belakang bangunan.
- source_word: יָמָּה
  choice: ke arah barat
  rationale: Adverbia arah ini secara idiomatis berarti 'ke arah barat'; secara etimologis berkaitan dengan arah laut.
- source_word: וַחֲמִשָּׁה ... וַחֲמִשָּׁה
  choice: dan lima ... serta lima
  rationale: Koordinasi dan pengulangan jumlah dalam bahasa Ibrani dipertahankan, dengan 'serta' pada bagian kedua agar kalimat Indonesia tetap alami.
