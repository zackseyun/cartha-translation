  source_fidelity: 'Teks Indonesia dengan tepat menyampaikan dimensi distributif dalam teks Ibrani: setiap tirai panjangnya dua puluh delapan hasta dan lebarnya empat hasta, dengan satu ukuran yang berlaku bagi semuanya. Istilah “harus” secara wajar mencerminkan bentuk instruksional העתיד Ibrani dalam konteks perintah pembangunan.'
