  text: אֹ֣רֶךְ הַ/יְרִיעָ֣ה הָֽ/אַחַ֗ת שְׁמֹנֶ֤ה וְ/עֶשְׂרִים֙ בָּֽ/אַמָּ֔ה וְ/רֹ֨חַב֙ אַרְבַּ֣ע בָּ/אַמָּ֔ה הַ/יְרִיעָ֖ה הָ/אֶחָ֑ת מִדָּ֥ה אַחַ֖ת לְ/כָל הַ/יְרִיעֹֽת׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/002.yaml
  text: The length of each curtain shall be twenty-eight cubits[a], and the width of each curtain four cubits[b]; all the curtains shall have one measure.
translation:
  language: id
  text: Panjang setiap tirai harus dua puluh delapan hasta[a], dan lebar setiap tirai empat hasta. Semua tirai itu harus berukuran sama.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Satu hasta kira-kira 45 sentimeter; dua puluh delapan hasta kira-kira 12,6 meter.
    reason: unit_conversion
  - marker: b
    text: Secara harfiah, “satu ukuran untuk semua tirai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ
  choice: panjang
  rationale: Dalam petunjuk mengenai Kemah Suci, kata ini menyatakan ukuran memanjang; “panjang” adalah istilah pengukuran yang baku dan alami dalam bahasa Indonesia.
- source_word: הַיְרִיעָה
  choice: tirai
  rationale: Dalam konteks Kemah Suci, יְרִיעָה menunjuk pada lembaran kain besar yang menjadi bagian penutup; “tirai” mempertahankan istilah yang jelas dan lazim.
- source_word: הָאַחַת / הָאֶחָת
  choice: setiap
  rationale: Secara harfiah berarti “yang satu”, tetapi bentuk ini dipakai secara distributif untuk menyatakan ukuran masing-masing tirai.
- source_word: שְׁמֹנֶה וְעֶשְׂרִים
  choice: dua puluh delapan
  rationale: Padanan langsung bilangan pokok Ibrani dalam susunan bilangan Indonesia yang baku.
- source_word: בָּאַמָּה
  choice: hasta
  rationale: אַמָּה adalah satuan panjang kuno yang secara tradisional dan tepat disebut “hasta” dalam bahasa Indonesia.
- source_word: וְרֹחַב
  choice: dan lebar
  rationale: “Lebar” merupakan pasangan alami dari “panjang” dalam penyebutan dimensi.
- source_word: אַרְבַּע
  choice: empat
  rationale: Padanan langsung bilangan pokok.
- source_word: מִדָּה אַחַת
  choice: berukuran sama
  rationale: Ungkapan harfiahnya “satu ukuran”; dalam konteks ini maksudnya semua tirai memiliki ukuran yang sama. Rumusan Indonesia ini alami tanpa mengubah acuannya.
- source_word: לְכָל הַיְרִיעֹת
  choice: semua tirai itu
  rationale: Frasa ini menyatakan bahwa ukuran tunggal tersebut berlaku bagi seluruh tirai dalam rangkaian.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan distributif Ibrani diterjemahkan dengan “setiap” agar jelas bagi pembaca umum, sementara bentuk harfiahnya pada klausa penutup dicatat dalam catatan kaki.
