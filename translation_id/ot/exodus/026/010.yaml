base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/010.yaml
  text: And you shall make fifty loops on the edge of the one curtain[a], the outermost one in the set joined together, and fifty loops on the edge of the second curtain that is joined to it.
translation:
  language: id
  text: Buatlah lima puluh gelung pada tepi kain yang satu, yang paling luar dalam rangkaian yang disambungkan itu[a], dan lima puluh gelung pada tepi kain kedua yang disambungkan dengannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam sambungan itu.” Istilah Ibrani ini menunjuk pada satu unit yang terbentuk dengan menyambungkan beberapa kain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Buatlah
  rationale: Bentuk perfek Qal dengan waw dalam konteks petunjuk berfungsi sebagai perintah; bentuk imperatif Indonesia menyampaikan daya arahannya secara alami.
- source_word: לֻלָאֹת
  choice: sosok
  rationale: Nomina ini menunjuk pada sosok-sosok dari kain untuk menyambungkan kain-kain Kemah Suci; istilah ringkas ini lazim dan fungsinya jelas dari konteks.
- source_word: שְׂפַת
  choice: tepi
  rationale: Secara harfiah berarti 'bibir', tetapi untuk bahan kain padanan Indonesia yang wajar ialah 'tepi'.
- source_word: הַיְרִיעָה
  choice: kain
  rationale: Dalam konteks Kemah Suci, kata ini menunjuk pada lembaran kain besar; 'kain' alami dan tidak menyiratkan fungsi penutup jendela seperti 'tirai' dalam pemakaian umum.
- source_word: הָאֶחָת
  choice: yang satu
  rationale: Mempertahankan ungkapan Ibrani 'yang satu' dan tidak mengubahnya secara diam-diam menjadi 'yang pertama'.
- source_word: הַקִּיצֹנָה
  choice: kain paling luar
  rationale: Adjektiva ini menyatakan posisi di ujung atau bagian terluar; pengulangan 'kain' memperjelas acuannya dalam bahasa Indonesia.
- source_word: בַּחֹבָרֶת
  choice: dalam rangkaian yang disambungkan itu
  rationale: Nomina ini merujuk kepada satu unit atau rangkaian yang terbentuk dari kain-kain yang disambungkan; frasa ini lebih jelas daripada padanan teknis yang kaku.
- source_word: הַחֹבֶרֶת
  choice: yang disambungkan dengannya
  rationale: Bentuk terkait ini menggambarkan kain kedua sebagai bagian yang tersambung; padanan ini mempertahankan hubungan antarkain tanpa mereduksinya menjadi sekadar 'rangkaian kedua'.
- source_word: הַשֵּׁנִית
  choice: kain kedua
  rationale: Ordinal ini membedakan kain tersebut dari 'kain yang satu'; nomina diulangi agar jelas dan alami.
