  terminology: '"Kain" tetap dapat dipakai untuk יְרִיעָה dalam konteks konstruksi Kemah Suci. "Gelung" menggantikan "sosok" demi ketepatan istilah konstruksi. Catatan kaki menjelaskan alternatif leksikal bagi חֹבֶרֶת.'
