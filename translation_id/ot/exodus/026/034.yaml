  yaml_path: translation/ot/exodus/026/034.yaml
  text: And you shall place the mercy seat on the ark of the testimony in the Most Holy Place[a][b][c].
translation:
  language: id
  text: Letakkanlah tutup pendamaian[a] di atas tabut kesaksian[b] di Ruang Mahakudus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tutup pengampunan.” Istilah Ibrani menunjuk pada penutup tabut yang berkaitan dengan pendamaian.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “tabut kesaksian”; sebutan “tabut perjanjian” juga dikenal dalam bagian-bagian lain.'
    reason: source_clarification
  - marker: c
    text: 'Secara harfiah: “tempat kudus dari segala tempat kudus,” suatu ungkapan Ibrani yang berarti tempat paling kudus.'
    reason: idiom_clarification
lexical_decisions:
- source_word: וְ/נָתַתָּ
  choice: Letakkanlah
  rationale: Bentuk Qal perfektif orang kedua tunggal maskulin dengan waw dalam rangkaian petunjuk berfungsi sebagai perintah. Bentuk ini alami dan tegas dalam bahasa Indonesia.
- source_word: הַכַּפֹּרֶת
  choice: tutup pendamaian
  rationale: Istilah ini menunjuk pada penutup tabut yang berkaitan dengan ritus pendamaian. Pilihan ini lebih transparan bagi pembaca modern daripada istilah tradisional yang kurang jelas.
- source_word: עַל
  choice: di atas
  rationale: Preposisi ini menyatakan posisi penutup pada bagian atas tabut.
- source_word: אֲרוֹן הָעֵדֻת
  choice: tabut kesaksian
  rationale: Terjemahan ini mengikuti bunyi Ibrani secara langsung, yaitu 'tabut kesaksian', tanpa menggantinya dengan sebutan 'tabut perjanjian'.
- source_word: בְּ/קֹדֶשׁ הַקֳּדָשִׁים
  choice: di Ruang Mahakudus
  rationale: Ungkapan superlatif Ibrani menunjuk pada ruang paling kudus dalam Kemah Suci. 'Ruang Mahakudus' jelas, ringkas, dan lazim dalam bahasa Indonesia Alkitabiah.
theological_decisions:
- issue: Cara menerjemahkan כַּפֹּרֶת tanpa memasukkan penafsiran doktrinal berlebihan
  choice: tutup pendamaian
  alternative: tutup pengampunan; tutup tabut
  rationale: '''Tutup pendamaian'' mempertahankan kaitan kultis istilah tersebut sekaligus menyatakan bahwa benda itu adalah penutup, tanpa menjelaskan lebih jauh mekanisme pendamaian.'
- issue: Apakah אֲרוֹן הָעֵדֻת diselaraskan menjadi 'tabut perjanjian'
  choice: tabut kesaksian
  alternative: tabut perjanjian
  rationale: Teks Ibrani ayat ini secara eksplisit memakai 'kesaksian'. Terjemahan mempertahankan istilah sumber dan tidak melakukan harmonisasi diam-diam.
- issue: Cara menyampaikan superlatif קֹדֶשׁ הַקֳּדָשִׁים
  choice: Ruang Mahakudus
  alternative: Tempat Yang Mahakudus; Yang Kudus dari segala yang kudus
  rationale: Pilihan utama menyampaikan ruang terdalam tempat kudus secara alami dan bermartabat, sementara bentuk harfiah Ibrani dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk perintah memakai akhiran -lah. Istilah kultis dipertahankan secukupnya, dengan alternatif dan bentuk harfiah dijelaskan melalui catatan kaki.
