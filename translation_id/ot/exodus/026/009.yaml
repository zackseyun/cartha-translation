  yaml_path: translation/ot/exodus/026/009.yaml
  text: And you shall join the five curtains separately[a], and the six curtains separately; and you shall fold the sixth curtain double at the front of the tent.
translation:
  language: id
  text: Sambungkanlah kelima lembar kain itu menjadi satu, dan keenam lembar kain yang lain menjadi satu. Lipatlah lembar kain yang keenam menjadi dua pada bagian depan kemah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חִבַּרְתָּ
  choice: sambungkanlah ... menjadi satu
  rationale: Kata kerja חָבַר berarti menyambungkan atau menggabungkan. Ungkapan ini secara alami menyatakan bahwa setiap kelompok lembar kain disatukan sebagai satu rangkaian.
- source_word: יְרִיעֹת / יְרִיעָה
  choice: lembar kain
  rationale: Dalam konteks Kemah Suci, יְרִיעָה menunjuk pada bentangan kain pembentuk penutup. 'Lembar kain' lebih jelas bagi pembaca modern daripada sekadar 'tirai', tanpa mengubah fungsi bendanya.
- source_word: לְבָד
  choice: menjadi satu ... yang lain menjadi satu
  rationale: 'Di sini לְבָד membedakan dua rangkaian: lima lembar dalam satu kelompok dan enam lembar dalam kelompok lain. Susunan ini menyampaikan pemisahan kelompok secara alami dalam bahasa Indonesia.'
- source_word: כָפַלְתָּ
  choice: lipatlah ... menjadi dua
  rationale: Kata ini menyatakan pelipatan atau penggandaan kain; 'menjadi dua' mempertahankan gagasan bahwa lembar keenam dilipat rangkap.
- source_word: הַשִּׁשִּׁית
  choice: yang keenam
  rationale: Padanan langsung untuk kata bilangan bertingkat yang menerangkan lembar kain.
- source_word: אֶל מוּל פְּנֵי
  choice: pada bagian depan
  rationale: Ungkapan ruang ini menunjukkan posisi pada atau menghadap sisi depan kemah. 'Pada bagian depan' alami dalam konteks petunjuk pembangunan.
- source_word: הָאֹהֶל
  choice: kemah
  rationale: Bahasa Ibrani memakai kata umum untuk 'kemah'. Pilihan ini mempertahankan kata sumber tanpa menggantinya dengan istilah yang lebih interpretatif seperti 'Kemah Suci'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bernada instruksional. Bentuk imperatif dengan enklitik -lah mencerminkan perintah Ibrani secara wajar dan bermartabat. Dua kelompok kain dinyatakan secara eksplisit agar fungsi לְבָד tidak kabur.
