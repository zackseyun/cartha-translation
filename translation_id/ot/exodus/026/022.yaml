base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/022.yaml
  text: And for the rear side of the tabernacle[a], westward, you shall make six boards.
translation:
  language: id
  text: Untuk bagian belakang Kemah Suci[a], di sebelah barat, haruslah engkau membuat enam papan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rangka-rangka” sebagai ganti “papan”, jika unsur-unsur struktural itu dipahami sebagai kerangka terbuka dan bukan papan kayu utuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְיַרְכְּתֵי
  choice: Untuk bagian belakang
  rationale: Bentuk ini menunjuk pada bagian paling jauh atau belakang dari bangunan; dalam konteks arsitektural, “bagian belakang” alami dan tepat dalam bahasa Indonesia.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: מִשְׁכָּן adalah istilah baku bagi bangunan tempat kudus dalam Keluaran. “Kemah Suci” jelas bagi pembaca Indonesia dan mempertahankan rujukan khusus tersebut.
- source_word: יָמָּה
  choice: di sebelah barat
  rationale: Secara harfiah berarti “ke arah laut” dan secara idiomatis menunjukkan arah barat. Dalam deskripsi letak bangunan, “di sebelah barat” lebih alami daripada “ke arah barat”.
- source_word: תַּעֲשֶׂה
  choice: haruslah engkau membuat
  rationale: Bentuk imperfek orang kedua tunggal dalam rangkaian petunjuk ini mempunyai daya perintah. Susunan ini mempertahankan gaya instruksional yang tegas dan bermartabat.
- source_word: שִׁשָּׁה
  choice: enam
  rationale: Padanan langsung untuk bilangan pokok yang menerangkan unsur bangunan berikutnya.
- source_word: קְרָשִׁים
  choice: papan
  rationale: Dalam konteks Kemah Suci, קֶרֶשׁ menunjuk pada unit kayu struktural pembentuk dinding. “Papan” adalah padanan konvensional dan mudah dipahami, sementara bentuk tepat unsur itu tetap diperdebatkan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Urutan keterangan dipertahankan sedekat mungkin dengan teks Ibrani tanpa mengorbankan kealamian. Pronomina “engkau” mempertahankan bentuk perintah orang kedua tunggal.
