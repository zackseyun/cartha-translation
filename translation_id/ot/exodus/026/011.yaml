  text: And you shall make fifty bronze clasps[a], and put the clasps into the loops, and join the tent together[c][b], so that it may be one.
translation:
  language: id
  text: Buatlah lima puluh pengait dari perunggu[a], lalu masukkanlah pengait-pengait itu ke dalam gelung-gelung dan satukanlah kemah itu, sehingga menjadi satu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari tembaga”. Kata Ibrani נְחֹשֶׁת dapat merujuk pada tembaga atau perunggu, bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, kedua rangkaian lembar penutup itu disatukan sehingga membentuk satu kemah yang utuh.
    reason: cultural_note
lexical_decisions:
- source_word: קַרְסֵי נְחֹשֶׁת
  choice: pengait dari perunggu
  rationale: קַרְסִים menunjuk pada alat pengikat yang menghubungkan lembar-lembar penutup; 'pengait' jelas dan wajar dalam konteks konstruksi. נְחֹשֶׁת dapat berarti tembaga atau perunggu, tetapi 'perunggu' merupakan padanan konvensional dan sesuai konteks perlengkapan Kemah Suci.
- source_word: חֲמִשִּׁים
  choice: lima puluh
  rationale: Bilangan kardinal yang secara langsung menerangkan jumlah pengait.
- source_word: וְהֵבֵאתָ אֶת הַקְּרָסִים בַּלֻּלָאֹת
  choice: masukkanlah pengait-pengait itu ke dalam gelung-gelung
  rationale: Bentuk kausatif dari בוא di sini menyatakan tindakan menempatkan atau memasukkan pengait ke dalam gelung; 'masukkanlah' alami dan tepat dalam bahasa Indonesia.
- source_word: וְחִבַּרְתָּ אֶת הָאֹהֶל
  choice: sambungkanlah kedua bagian kemah itu
  rationale: חבר berarti menghubungkan atau menyatukan. Penyebutan 'kedua bagian' membuat objek tindakan jelas dari konteks dekat, yakni dua rangkaian lembar penutup, tanpa mengubah hasil akhirnya sebagai satu kemah.
- source_word: וְהָיָה אֶחָד
  choice: sehingga menjadi satu
  rationale: Klausa ini menyatakan hasil penyambungan. 'Sehingga menjadi satu' menyampaikan fungsi resultatifnya secara alami.
