  text: וְ/עָשִׂ֤יתָ מָסָךְ֙ לְ/פֶ֣תַח הָ/אֹ֔הֶל תְּכֵ֧לֶת וְ/אַרְגָּמָ֛ן וְ/תוֹלַ֥עַת שָׁנִ֖י וְ/שֵׁ֣שׁ מָשְׁזָ֑ר מַעֲשֵׂ֖ה רֹקֵֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/036.yaml
  text: You shall make a screen for the entrance of the tent[a], of blue and purple and scarlet yarn, and fine twisted linen, the work of an embroiderer.
translation:
  language: id
  text: Haruslah engkau membuat tirai untuk pintu masuk Kemah itu,[a] dari benang biru, ungu, dan merah tua, serta linen halus yang dipintal, hasil karya seorang penyulam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kain penutup” atau “tabir” pada pintu masuk; “tirai” dipakai di sini untuk membedakannya dari tabir bagian dalam yang disebut sebelumnya dalam pasal ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָסָךְ
  choice: tirai
  rationale: Kata ini menunjuk pada kain gantung yang berfungsi sebagai penutup atau penyekat. Dalam bahasa Indonesia, “tirai” paling alami untuk penutup pintu masuk; catatan kaki menjelaskan pembedaan kontekstualnya dari tabir bagian dalam.
- source_word: לְפֶתַח הָאֹהֶל
  choice: untuk pintu masuk Kemah itu
  rationale: פֶתַח berarti bukaan atau pintu masuk, sedangkan אֹהֶל berarti kemah. Kapitalisasi “Kemah” membantu menunjukkan bangunan ibadah khusus dalam konteks tanpa mengganti arti leksikalnya dengan istilah yang lebih interpretatif.
- source_word: תְּכֵלֶת
  choice: benang biru
  rationale: Istilah ini menunjuk pada bahan tekstil berwarna biru atau biru keunguan yang bernilai tinggi. “Biru” merupakan padanan yang jelas dan lazim; “benang” dinyatakan untuk memperjelas konteks tekstil.
- source_word: אַרְגָּמָן
  choice: ungu
  rationale: Istilah ini menunjuk pada bahan yang dicelup ungu. “Ungu” merupakan padanan konvensional dan cukup tepat dalam daftar bahan tekstil ini.
- source_word: תוֹלַעַת שָׁנִי
  choice: merah tua
  rationale: Ungkapan ini secara idiomatis menunjuk pada bahan berwarna scarlet, bukan secara harfiah pada ulat. “Merah tua” adalah ungkapan Indonesia yang alami untuk warna tekstil tersebut, sementara kata “benang” pada awal rangkaian berlaku bagi ketiga warna.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: linen halus yang dipintal
  rationale: שֵׁשׁ menunjuk pada linen halus, dan מָשְׁזָר menyatakan bahwa serat atau benangnya dipintal. Padanan ini mempertahankan mutu bahan dan cara pembuatannya.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: hasil karya seorang penyulam
  rationale: Frasa ini menekankan pekerjaan dekoratif seorang perajin tekstil. “Hasil karya seorang penyulam” mempertahankan bentuk konstruksi dan fokus pada keahlian pembuatnya.
- source_word: וְעָשִׂיתָ
  choice: Haruslah engkau membuat
  rationale: Dalam rangkaian petunjuk ini, bentuk tersebut memiliki daya perintah. “Haruslah engkau membuat” mempertahankan ragam instruksional yang khidmat dan alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan daftar bahan dibuat alami bagi pembaca Indonesia, dengan “benang” mencakup tiga warna pertama. Istilah “tirai” dipilih karena paling wajar untuk penutup pintu masuk, sedangkan catatan kaki mempertahankan alternatif leksikal dan pembedaan dari tabir bagian dalam.
