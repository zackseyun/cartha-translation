base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/008.yaml
  text: The length of each curtain shall be thirty cubits[a], and the width of each curtain four cubits[b]; all eleven curtains shall have one measure.
translation:
  language: id
  text: Panjang setiap lembar kain[a] harus tiga puluh hasta, dan lebar setiap lembar kain harus empat hasta; kesebelas lembar kain itu harus memiliki satu ukuran[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “lembar kain yang satu”; bentuk Ibrani ini digunakan secara distributif, yaitu untuk setiap lembar kain.
    reason: lexical_alternative
  - marker: b
    text: Atau “berukuran sama.” Ungkapan Ibraninya secara harfiah adalah “satu ukuran” dan menegaskan bahwa kesebelas lembar itu memiliki ukuran yang seragam.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ
  choice: panjang
  rationale: Istilah ukuran yang wajar dalam bahasa Indonesia dan berpasangan langsung dengan רֹחַב, “lebar”.
- source_word: יְרִיעָה
  choice: lembar kain
  rationale: Dalam konteks Kemah Suci, kata ini menunjuk pada bagian besar dari bahan tenunan yang menjadi penutup. “Lembar kain” lebih konkret dan alami daripada sekadar “tirai” untuk bagian-bagian penutup ini.
- source_word: הָאַחַת / הָאֶחָת
  choice: setiap
  rationale: 'Secara harfiah berarti “yang satu”, tetapi dalam konteks pemberian ukuran bentuk ini bersifat distributif: ukuran tersebut berlaku bagi tiap-tiap lembar.'
- source_word: שְׁלֹשִׁים בָּאַמָּה
  choice: tiga puluh hasta
  rationale: Mempertahankan satuan kuno אַמָּה sebagai “hasta” tanpa konversi perkiraan ke satuan modern.
- source_word: רֹחַב
  choice: lebar
  rationale: Padanan Indonesia modern yang jelas untuk dimensi yang dipasangkan dengan panjang.
- source_word: אַרְבַּע בָּאַמָּה
  choice: empat hasta
  rationale: Menerjemahkan angka dan satuan sumber secara langsung serta konsisten.
- source_word: מִדָּה אַחַת
  choice: satu ukuran
  rationale: Mengikuti ungkapan Ibrani secara dekat dan tetap dapat dipahami sebagai penegasan bahwa ukurannya seragam.
- source_word: לְעַשְׁתֵּי עֶשְׂרֵה יְרִיעֹת
  choice: kesebelas lembar kain itu
  rationale: Menunjukkan seluruh kumpulan yang terdiri dari sebelas lembar dan menjadikannya subjek alami dalam klausa bahasa Indonesia.
