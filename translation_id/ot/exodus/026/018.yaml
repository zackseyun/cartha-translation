base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/018.yaml
  text: 'And you shall make the frames for the tabernacle: twenty frames for the south side[a], southward.'
translation:
  language: id
  text: 'Buatlah papan-papan[a] untuk Kemah Suci: dua puluh papan untuk sisi selatan, ke arah selatan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rangka-rangka”; istilah Ibrani ini menunjuk pada bagian-bagian struktural Kemah Suci dan dapat dipahami sebagai papan atau rangka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Buatlah
  rationale: Bentuk perfek Qal dengan waw dalam konteks petunjuk berfungsi sebagai perintah. Bentuk imperatif ini menyampaikan daya perintah secara alami dan ringkas dalam bahasa Indonesia.
- source_word: הַקְּרָשִׁים
  choice: papan-papan
  rationale: קֶרֶשׁ menunjuk pada bagian-bagian struktural tegak Kemah Suci. “Papan-papan” konkret dan lazim dalam bahasa Indonesia, sementara kemungkinan makna “rangka-rangka” dicatat dalam catatan kaki.
- source_word: לַמִּשְׁכָּן
  choice: untuk Kemah Suci
  rationale: מִשְׁכָּן adalah sebutan baku bagi bangunan tempat kudus dalam konteks Keluaran. “Kemah Suci” merupakan padanan Indonesia yang jelas dan sudah dikenal.
- source_word: עֶשְׂרִים קֶרֶשׁ
  choice: dua puluh papan
  rationale: Konstruksi Ibrani memakai bilangan dengan nomina tunggal, sedangkan bahasa Indonesia secara alami tidak mengulang nomina sesudah bilangan.
- source_word: לִפְאַת
  choice: untuk sisi
  rationale: Dalam uraian bangunan, פֵאָה paling tepat dipahami sebagai sisi, bukan sudut atau tepi.
- source_word: נֶגְבָּה תֵימָנָה
  choice: selatan, ke arah selatan
  rationale: Kedua istilah penunjuk arah dipertahankan agar kepenuhan dan penegasan arah dalam teks Ibrani tidak dilebur menjadi satu kata sifat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Imperatif “Buatlah” cocok untuk rangkaian petunjuk pembangunan. Pengulangan arah selatan sengaja dipertahankan karena mencerminkan dua istilah arah dalam teks Ibrani.
