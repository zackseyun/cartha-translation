base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/037.yaml
  text: And you shall make for the screen five pillars of acacia wood[a], and overlay them with gold; their hooks shall be of gold[b]; and you shall cast for them five bases of bronze.
translation:
  language: id
  text: Untuk tirai pintu itu[a] haruslah kaubuat lima tiang dari kayu akasia dan kaulapisi dengan emas; kait-kaitnya harus dari emas. Untuk tiang-tiang itu haruslah kaubuat lima alas tuangan dari perunggu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tirai” atau “tabir”. Istilah Ibrani di sini menunjuk pada tirai jalan masuk, yang berbeda dari tabir bagian dalam yang memisahkan Ruang Kudus dari Ruang Mahakudus.
    reason: lexical_alternative
  - marker: b
    text: Atau “lima soket dari perunggu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מָּסָךְ
  choice: tirai pintu
  rationale: Istilah ini menunjuk pada tirai penutup jalan masuk Kemah Suci, bukan tabir bagian dalam. 'Tirai pintu' menyatakan bentuk sekaligus fungsinya secara alami dalam bahasa Indonesia.
- source_word: עַמּוּדֵי שִׁטִּים
  choice: tiang dari kayu akasia
  rationale: עַמּוּדִים berarti tiang-tiang penyangga, sedangkan שִׁטִּים adalah kayu akasia yang dipakai dalam pembangunan Kemah Suci.
- source_word: וְצִפִּיתָ אֹתָם זָהָב
  choice: kaulapisi dengan emas
  rationale: Kata kerja צפה dalam konstruksi ini berarti menutup permukaan suatu benda dengan lapisan logam.
- source_word: וָוֵיהֶם
  choice: kait-kaitnya
  rationale: Dalam konteks perlengkapan Kemah Suci, וָוִים paling mungkin merujuk pada kait yang berkaitan dengan pemasangan tirai.
- source_word: אַדְנֵי נְחֹשֶׁת
  choice: alas dari perunggu
  rationale: אַדָן adalah alas atau soket penyangga bagi tiang; 'alas' mudah dipahami dan sesuai dengan fungsi strukturalnya.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Dalam uraian bahan Kemah Suci, 'perunggu' merupakan padanan modern yang paling wajar; 'kuningan' tidak sesuai dengan metalurgi kuno.
- source_word: וְיָצַקְתָּ לָהֶם
  choice: untuk tiang-tiang itu haruslah kautuang
  rationale: יצק merujuk pada pembuatan benda logam dengan menuangkannya ke dalam cetakan, dan לָהֶם menunjukkan bahwa alas tersebut dibuat bagi tiang-tiang itu.
