translation:
  language: id
  text: Haruslah engkau membuat lima batang dari kayu akasia untuk rangka-rangka pada sisi yang satu dari Kemah Suci.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “papan-papan” alih-alih “rangka-rangka”; istilah Ibrani ini menunjuk pada unsur-unsur struktural Kemah Suci.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Haruslah engkau membuat
  rationale: Bentuk perfektum Qal dengan konjungsi dalam rangkaian petunjuk berfungsi sebagai perintah; ungkapan ini mempertahankan gaya instruksional dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: בְרִיחִם
  choice: batang
  rationale: Dalam konteks pembangunan Kemah Suci, kata ini menunjuk pada batang struktural yang menyatukan rangka-rangka. 'Batang' akurat tanpa menambahkan arah melintang yang tidak dinyatakan secara eksplisit.
- source_word: עֲצֵי שִׁטִּים
  choice: dari kayu akasia
  rationale: Rangkaian konstruksi Ibrani ini secara idiomatis berarti 'kayu akasia'; istilah tersebut jelas dan lazim dalam bahasa Indonesia modern.
- source_word: חֲמִשָּׁה
  choice: lima
  rationale: Bilangan pokok yang menerangkan jumlah batang.
- source_word: לְקַרְשֵׁי
  choice: untuk rangka-rangka
  rationale: Dalam konteks Kemah Suci, קֶרֶשׁ menunjuk pada unsur struktural tegak. 'Rangka-rangka' menonjolkan fungsinya, sedangkan alternatif 'papan-papan' dipertahankan dalam catatan kaki karena bentuk tepat unsur itu tidak sepenuhnya pasti.
- source_word: צֶלַע
  choice: sisi
  rationale: Di sini kata tersebut menunjuk pada salah satu sisi lateral bangunan, bukan tulang rusuk secara harfiah.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: Istilah ini merupakan sebutan Indonesia yang mapan dan mudah dipahami bagi tempat kediaman kudus yang dapat dipindahkan dalam konteks Keluaran.
- source_word: הָאֶחָד
  choice: salah satu
  rationale: Ungkapan ini menunjuk pada satu sisi tertentu dari pasangan sisi dan mengantisipasi sisi lainnya pada ayat berikutnya; 'salah satu' lebih alami daripada 'sisi yang satu' dalam susunan kalimat ini.
