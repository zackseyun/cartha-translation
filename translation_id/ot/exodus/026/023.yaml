translation:
  language: id
  text: Engkau harus membuat dua papan untuk sudut-sudut Kemah Suci di bagian belakang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “untuk bagian-bagian sudut Kemah Suci, di kedua bagian belakang.” Istilah-istilah Ibraninya bersifat arsitektural dan agak teknis.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁנֵי
  choice: dua
  rationale: Bentuk konstruk dari kata bilangan ini memperkenalkan unsur bangunan berikutnya. Konjungsi Ibrani tidak perlu diterjemahkan tersendiri karena urutan instruksi sudah wajar dalam bahasa Indonesia.
- source_word: קְרָשִׁים
  choice: papan
  rationale: Dalam konteks pembangunan Kemah Suci, kata ini menunjuk pada unsur kayu struktural pembentuk dinding; 'papan' merupakan padanan yang jelas tanpa menafsirkan bentuknya secara berlebihan.
- source_word: תַּעֲשֶׂה
  choice: Haruslah engkau membuat
  rationale: Bentuk imperfek orang kedua tunggal dalam rangkaian petunjuk ini memiliki daya perintah. Susunan ini mempertahankan nada instruktif yang khidmat dan jelas.
- source_word: לִ/מְקֻצְעֹת
  choice: untuk sudut-sudut
  rationale: Istilah arsitektural ini menunjuk pada sudut atau titik pertemuan bersudut. Terjemahan ini mempertahankan makna umum tanpa memastikan bahwa yang dimaksud ialah komponen khusus berbentuk sudut.
- source_word: הַ/מִּשְׁכָּן
  choice: Kemah Suci
  rationale: Dalam konteks kitab Keluaran, istilah ini adalah nama lazim dalam bahasa Indonesia bagi tempat kediaman kudus portabel, meskipun secara harfiah berarti 'tempat kediaman'.
- source_word: בַּ/יַּרְכָתָיִם
  choice: di bagian belakang
  rationale: Bentuk dual ini menunjuk pada kedua bagian atau ujung belakang. Dalam kalimat utama, ungkapan yang lebih umum dipilih agar alami; nuansa dual dan kemungkinan teknisnya dicatat dalam catatan kaki.
