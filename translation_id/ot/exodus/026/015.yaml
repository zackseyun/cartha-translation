  text: And you shall make the frames for the tabernacle of acacia wood[b][a], standing upright.
translation:
  language: id
  text: Buatlah papan-papan dari kayu akasia untuk Kemah Suci, yang berdiri tegak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “rangka-rangka”; istilah Ibrani ini menunjuk pada unsur-unsur kayu struktural Kemah Suci.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Haruslah engkau membuat
  rationale: Bentuk perfektum Qal dengan waw dalam rangkaian petunjuk menyatakan perintah. Susunan ini alami dan bermartabat dalam bahasa Indonesia serta mempertahankan daya imperatifnya.
- source_word: הַקְּרָשִׁים
  choice: rangka-rangka
  rationale: Istilah קְרָשִׁים menunjuk unsur kayu struktural Kemah Suci. 'Rangka-rangka' menonjolkan fungsinya sebagai bagian konstruksi; kemungkinan 'papan-papan' dicatat dalam catatan kaki.
- source_word: לַמִּשְׁכָּן
  choice: untuk Kemah Suci
  rationale: מִשְׁכָּן adalah istilah teknis bagi tempat kudus portabel dalam konteks Keluaran. 'Kemah Suci' merupakan padanan Indonesia yang mapan dan mudah dipahami.
- source_word: עֲצֵי שִׁטִּים
  choice: dari kayu akasia
  rationale: Rangkaian konstruksi ini berarti kayu dari pohon akasia. Frasa Indonesia tersebut jelas dan idiomatis.
- source_word: עֹמְדִים
  choice: dalam posisi tegak
  rationale: Partisipel ini menerangkan orientasi unsur-unsur struktural tersebut. Terjemahan ini mempertahankan gagasan bahwa rangka-rangka itu berdiri tegak tanpa meleburkannya secara diam-diam menjadi sifat bawaan.
