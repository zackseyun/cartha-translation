base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/025.yaml
  text: 'There shall be eight frames[a], with their silver bases: sixteen bases[b], two bases under one frame and two bases under the other frame.'
translation:
  language: id
  text: 'Harus ada delapan rangka[a] dengan alas-alasnya dari perak: enam belas alas[b], dua alas di bawah rangka yang satu dan dua alas di bawah rangka yang lain.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “papan”.
    reason: lexical_alternative
  - marker: b
    text: Atau “soket”.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְרָשִׁים
  choice: rangka
  rationale: Dalam konteks pembangunan Kemah Suci, kata ini menunjuk pada bagian-bagian struktural yang tegak. “Rangka” menyampaikan fungsinya dengan wajar dalam bahasa Indonesia modern, sementara “papan” tetap dicatat sebagai alternatif leksikal.
- source_word: אַדְנֵי/הֶם ... אֲדָנִים
  choice: alas
  rationale: Kata ini menunjuk pada penopang di bawah rangka. “Alas” jelas dan mudah dipahami; “soket” merupakan alternatif yang lebih menonjolkan bentuk atau fungsi sebagai tempat pemasangan.
- source_word: כֶּסֶף
  choice: perak
  rationale: Padanan langsung untuk bahan pembuat alas-alas tersebut.
- source_word: שִׁשָּׁה עָשָׂר
  choice: enam belas
  rationale: Padanan baku untuk bilangan kardinal Ibrani.
- source_word: תַּחַת
  choice: di bawah
  rationale: Padanan spasial langsung yang sesuai dengan petunjuk konstruksi.
- source_word: הַקֶּרֶשׁ הָאֶחָד
  choice: rangka yang satu ... rangka yang lain
  rationale: Ungkapan Ibrani yang diulang bersifat distributif. Rumusan ini alami dalam bahasa Indonesia dan tidak menyiratkan urutan.
- source_word: וְהָיוּ
  choice: Harus ada
  rationale: Menyampaikan nilai preskriptif dalam rangkaian petunjuk konstruksi sekaligus menghasilkan pernyataan inventaris yang alami dalam bahasa Indonesia.
