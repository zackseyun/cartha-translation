translation:
  language: id
  text: Lima lembar kain harus disambungkan satu dengan yang lain[a], dan lima lembar kain harus disambungkan satu dengan yang lain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seorang perempuan kepada saudarinya,” sebuah ungkapan yang berarti bahwa lembaran-lembaran kain yang bersesuaian disambungkan satu dengan yang lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְרִיעֹת
  choice: helai tenda
  rationale: Dalam petunjuk pembuatan Kemah Suci, kata ini menunjuk pada lembaran besar kain yang membentuk penutup tenda. 'Helai tenda' alami dalam bahasa Indonesia dan membedakannya dari tirai biasa.
- source_word: תִּהְיֶיןָ
  choice: harus
  rationale: Bentuk imperfek היה dalam rangkaian petunjuk ini menyatakan ketentuan yang harus dilaksanakan; 'harus' menyampaikan daya preskriptifnya secara wajar.
- source_word: חֹבְרֹת
  choice: disambungkan
  rationale: Bentuk pasif dari חבר menyatakan bahwa lembaran-lembaran itu dihubungkan menjadi satu; 'disambungkan' tepat untuk konteks pengerjaan konstruksi.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: satu dengan yang lain
  rationale: Ungkapan harfiahnya, 'seorang perempuan kepada saudarinya,' merupakan idiom kesalingan bagi benda-benda berjenis feminin. Padanan ini mempertahankan maknanya dalam bahasa Indonesia yang alami.
- source_word: חֲמֵשׁ ... וְחָמֵשׁ
  choice: Lima ... dan lima
  rationale: Susunan berulang ini membagi kesepuluh helai tenda menjadi dua kelompok, masing-masing terdiri atas lima helai, tanpa menambahkan unsur yang tidak dinyatakan dalam teks.
