base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/004.yaml
  text: And you shall make loops of blue on the edge of the one curtain at the end of the first set joined together[c][b][a]; and so you shall do on the edge of the outermost curtain in the second set joined together.
translation:
  language: id
  text: Buatlah gelung-gelung dari bahan biru[a] pada tepi kain tenda yang satu, yang berada di ujung rangkaian pertama[b]. Lakukan hal yang sama pada tepi kain tenda paling ujung[c] dalam rangkaian kedua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “biru” atau “ungu kebiruan”. Kata Ibrani תְּכֵלֶת menunjuk pada bahan berwarna biru khas yang digunakan dalam Kemah Suci.
    reason: lexical_alternative
  - marker: b
    text: “Rangkaian” berarti sekelompok kain tenda yang disambungkan menjadi satu kesatuan; secara lebih harfiah dapat diterjemahkan “sambungan”.
    reason: lexical_alternative
  - marker: c
    text: Atau “kain tenda paling luar”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלְאֹת
  choice: sosok-sosok
  rationale: Kata ini menunjuk pada gelung atau sosok tekstil yang dipakai untuk mengaitkan kain-kain tenda; 'sosok' adalah istilah Indonesia yang ringkas dan tepat untuk gelung pengait.
- source_word: תְּכֵלֶת
  choice: bahan biru
  rationale: Istilah Ibrani menunjuk pada bahan tekstil berwarna biru khas, bukan semata-mata warna abstrak; 'bahan biru' mempertahankan makna material tanpa menentukan bahwa bahannya pasti benang.
- source_word: שְׂפַת
  choice: tepi
  rationale: Dalam konteks tekstil, 'tepi' merupakan padanan Indonesia yang alami dan jelas.
- source_word: יְרִיעָה
  choice: kain tenda
  rationale: Dalam konteks Kemah Suci, kata ini menunjuk pada lembaran kain penutup; 'kain tenda' lebih konkret daripada 'tirai' dan selaras dengan fungsi bendanya.
- source_word: הָאֶחָת
  choice: yang satu
  rationale: Mempertahankan bentuk harfiah 'yang satu' dan tidak mengubahnya menjadi bilangan urut 'pertama'.
- source_word: מִקָּצָה
  choice: di ujung
  rationale: Ungkapan ini menyatakan letak pada bagian paling ujung.
- source_word: חֹבָרֶת / מַחְבֶּרֶת
  choice: rangkaian
  rationale: Kedua istilah berkerabat ini menunjuk pada kelompok kain yang disambungkan menjadi satu unit; 'rangkaian' menyampaikan kesatuan hasil penyambungan secara alami.
- source_word: וְכֵן
  choice: Lakukan hal yang sama
  rationale: Mengungkapkan instruksi paralel secara jelas dan alami dalam bahasa Indonesia modern.
- source_word: הַקִּיצוֹנָה
  choice: paling luar
  rationale: Menunjukkan kain yang berada pada posisi terluar atau paling ujung dalam rangkaian.
- source_word: הַשֵּׁנִית
  choice: kedua
  rationale: Menandai rangkaian kedua dari dua rangkaian kain.
