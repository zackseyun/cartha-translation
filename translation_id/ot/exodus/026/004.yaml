revisions:
- from: Buatlah sosok-sosok dari bahan biru[a] pada tepi kain tenda yang satu, di ujung rangkaian pertama[b]. Lakukan hal yang sama pada tepi kain tenda paling luar[c] dalam rangkaian kedua.
  to: Buatlah gelung-gelung dari bahan biru[a] pada tepi kain tenda yang satu, yang berada di ujung rangkaian pertama[b]. Lakukan hal yang sama pada tepi kain tenda paling ujung[c] dalam rangkaian kedua.
  rationale: Revisi mengganti padanan yang keliru untuk לֻלְאֹת dengan “gelung-gelung,” mempertahankan istilah tekstil yang alami dan makna penghubungnya. Struktur kalimat pertama diperjelas agar “di ujung rangkaian pertama” menerangkan kain tenda, sesuai sintaks dan konteks dua rangkaian kain dalam ayat ini. Catatan c diselaraskan dengan alternatif yang benar-benar membedakan “paling ujung” dan “paling luar.”
