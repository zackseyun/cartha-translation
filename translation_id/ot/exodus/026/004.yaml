    rationale: Frasa itu dapat dibaca sebagai keterangan bagi gelung-gelung, padahal teks menunjuk pada kain tenda yang satu, yakni kain pada ujung rangkaian pertama. Anak kalimat relatif memperjelas hubungan tanpa menambah makna.
