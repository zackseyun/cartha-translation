  terminology: “Tabir,” “pengait-pengait,” “Tabut Kesaksian,” “Tempat Kudus,” dan “Tempat Mahakudus” tepat untuk konteks ini. Catatan kaki alternatif “Tabut Perjanjian” ditempatkan pada jangkar yang benar. Catatan kaki untuk קֹדֶשׁ הַקֳּדָשִׁים perlu memperbaiki parafrasa harfiahnya.
