base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/033.yaml
  text: And you shall place the veil under the clasps[a], and there, within the veil, you shall bring the ark of the testimony[b]; and the veil shall separate for you between the Holy Place and the Most Holy Place.
translation:
  language: id
  text: Pasanglah tabir itu di bawah pengait-pengait, lalu bawalah Tabut Kesaksian[a] ke sana, ke balik tabir itu. Tabir itu akan memisahkan Tempat Kudus dari Tempat Mahakudus bagi kalian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Tabut Perjanjian.” Dalam bahasa Ibrani, teks di sini berbunyi “Tabut Kesaksian.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kudus dari segala yang kudus,” sebuah ungkapan superlatif Ibrani.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרֹכֶת
  choice: tabir
  rationale: Kata ini menunjuk pada kain pemisah bagian terdalam Kemah Suci. “Tabir” merupakan istilah Indonesia yang wajar, bermartabat, dan cukup khusus untuk penyekat ruang sakral.
- source_word: קְרָסִים
  choice: pengait-pengait
  rationale: Istilah ini menunjuk pada alat penyambung kain-kain Kemah Suci. “Pengait” menyampaikan fungsi tersebut tanpa menentukan bentuk mekanisnya secara berlebihan.
- source_word: מִבֵּית לַפָּרֹכֶת
  choice: ke sebelah dalam tabir itu
  rationale: Ungkapan ini menunjukkan ruang di sisi dalam atau di balik tabir. Pilihan ini mempertahankan arah gerak verba “bawalah” sekaligus memperjelas letak tabut.
- source_word: אֲרוֹן הָעֵדוּת
  choice: Tabut Kesaksian
  rationale: Teks Ibrani secara eksplisit memakai עֵדוּת, “kesaksian,” bukan בְּרִית, “perjanjian.” Karena itu, terjemahan utama mempertahankan istilah sumber dan tidak menyelaraskannya diam-diam dengan gelar tradisional “Tabut Perjanjian.”
- source_word: וְהִבְדִּילָה
  choice: akan memisahkan
  rationale: Bentuk kausatif dari בדל menyatakan tindakan atau fungsi membuat pemisahan. “Akan memisahkan” alami dalam bahasa Indonesia dan sesuai dengan fungsi tabir.
- source_word: לָכֶם
  choice: bagimu
  rationale: Pronomina datif jamak dipertahankan untuk menunjukkan bahwa tabir itu menjalankan fungsi pemisahan bagi umat Israel. Dalam konteks firman kepada Musa, bentuk tunggal kolektif “bagimu” tetap alami.
- source_word: הַקֹּדֶשׁ
  choice: Tempat Kudus
  rationale: Dalam konteks ini, istilah tersebut menunjuk pada ruang kudus di bagian luar, yang dibedakan dari ruang terdalam. Huruf kapital membantu menandai nama teknis ruang itu.
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: Tempat Mahakudus
  rationale: Konstruksi harfiahnya adalah “kudus segala kudus,” suatu bentuk superlatif Ibrani. “Tempat Mahakudus” menyampaikan maknanya secara jelas dan mempertahankan pembedaan ruang sakral.
theological_decisions:
- issue: Istilah bagi ruang kudus terdalam
  choice: Tempat Mahakudus
  alternative: Ruang Maha Kudus; Yang Mahakudus; secara harfiah “kudus segala kudus”
  rationale: Pilihan ini menyampaikan daya superlatif ungkapan Ibrani קֹדֶשׁ הַקֳּדָשִׁים dalam bahasa Indonesia modern tanpa menghapus bentuk harfiahnya, yang dicatat dalam catatan kaki.
- issue: Penerjemahan עֵדוּת dalam gelar tabut
  choice: Tabut Kesaksian
  alternative: Tabut Perjanjian
  rationale: Walaupun “Tabut Perjanjian” merupakan gelar yang lebih dikenal, ayat ini memakai kata “kesaksian.” Terjemahan mempertahankan pilihan leksikal teks sumber dan mencatat gelar alternatif yang lazim tanpa menyamakan kedua istilah itu.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan khidmat. Bentuk imperatif “Pasanglah” dan “bawalah” lebih alami daripada mempertahankan rangkaian “dan engkau harus,” sedangkan istilah teknis Kemah Suci—“tabir,” “Tabut Kesaksian,” “Tempat Kudus,” dan “Tempat Mahakudus”—dipertahankan secara konsisten. Penempatan penanda catatan kaki diperbaiki menurut isi catatan: [a] sesudah “Tabut Kesaksian” dan [b] sesudah “Tempat Mahakudus.”'
