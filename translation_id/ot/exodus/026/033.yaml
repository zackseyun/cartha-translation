  source_fidelity: 'Teks utama pada dasarnya setia: tabir ditempatkan di bawah pengait, Tabut Kesaksian dibawa ke sisi dalam tabir, dan tabir memisahkan dua ruang sakral. Namun, לָכֶם adalah bentuk jamak dan sebaiknya tidak dijelaskan atau diterjemahkan sebagai bentuk tunggal “bagimu.”'
