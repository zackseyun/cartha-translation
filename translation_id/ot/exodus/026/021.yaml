translation:
  language: id
  text: 'dan empat puluh alasnya[a] terbuat dari perak: dua alas di bawah bingkai yang satu[b], dan dua alas di bawah bingkai yang lainnya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “soket”; istilah Ibrani ini menunjuk pada penopang dari perak tempat bingkai Kemah Suci dipasang.
    reason: lexical_alternative
  - marker: b
    text: Secara tradisional diterjemahkan “papan”; istilah Ibrani ini menggambarkan setiap unsur struktural tegak Kemah Suci.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעִים אַדְנֵי/הֶם
  choice: dan keempat puluh alasnya
  rationale: Konjungsi וְ melanjutkan uraian ayat sebelumnya, sedangkan akhiran pronominal pada אַדְנֵיהֶם diterjemahkan secara alami dengan -nya.
- source_word: אַדְנֵי/הֶם / אֲדָנִים
  choice: alasnya / alas
  rationale: Dalam konteks Kemah Suci, אֶדֶן menunjuk pada penopang berongga tempat bingkai dipasang. 'Alas' jelas dan alami; kemungkinan 'soket' dicatat dalam catatan kaki.
- source_word: כָּסֶף
  choice: terbuat dari perak
  rationale: Nomina ini menyatakan bahan pembuat alas; frasa ini merupakan ungkapan Indonesia yang wajar dan eksplisit.
- source_word: תַּחַת
  choice: di bawah
  rationale: Padanan langsung dan alami untuk posisi fisik penopang terhadap bingkai.
- source_word: הַ/קֶּרֶשׁ
  choice: bingkai
  rationale: קֶרֶשׁ menunjuk pada unsur struktural tegak Kemah Suci. 'Bingkai' mengomunikasikan fungsinya lebih baik daripada 'papan', meskipun alternatif tradisional itu dicatat.
- source_word: הָ/אֶחָד ... הָ/אֶחָד
  choice: yang satu ... yang lainnya
  rationale: Pengulangan harfiah 'yang satu ... yang satu' dalam konteks ini bersifat distributif. Bahasa Indonesia memakai pasangan 'yang satu ... yang lainnya' agar kontras dua unsur tersampaikan tanpa mengubah pola dua alas bagi setiap bingkai.
