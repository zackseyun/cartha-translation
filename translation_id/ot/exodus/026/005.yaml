base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/005.yaml
  text: You shall make fifty loops on the one curtain[a], and you shall make fifty loops on the edge of the curtain that is in the second set; the loops shall be opposite one another.
translation:
  language: id
  text: Buatlah lima puluh gelung pada tirai yang satu, dan buatlah lima puluh gelung pada tepi tirai yang termasuk dalam rangkaian kedua. Gelung-gelung itu harus berhadapan satu sama lain.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seorang perempuan kepada saudarinya,” sebuah ungkapan Ibrani yang menyatakan bahwa gelung-gelung itu berpadanan atau sejajar dengan pasangannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  choice: lubang pengait
  rationale: Kata ini menunjuk pada gelung atau lubang dari bahan yang dipakai untuk menyambungkan tirai dengan kait emas pada ayat berikutnya. 'Lubang pengait' jelas bagi pembaca modern dan membedakannya dari kait logam.
- source_word: יְרִיעָה
  choice: tirai
  rationale: Dalam konteks Kemah Suci, istilah ini menunjuk pada lembaran kain besar yang menjadi penutup; 'tirai' merupakan padanan Indonesia yang alami dan lazim.
- source_word: הָאֶחָת
  choice: yang satu
  rationale: Padanan ini mempertahankan ungkapan Ibrani yang membedakan tirai tersebut dari pasangannya tanpa menambahkan urutan 'pertama' yang tidak dinyatakan.
- source_word: קְצֵה
  choice: tepi
  rationale: Istilah ini menunjuk pada batas luar tirai; 'tepi' paling sesuai dengan konteks pemasangan lubang pengait.
- source_word: מַחְבֶּרֶת
  choice: rangkaian
  rationale: Dalam konteks ayat 3, kata ini menunjuk pada kelompok tirai yang telah disambungkan menjadi satu unit. 'Rangkaian' menyampaikan baik pengelompokan maupun keterhubungannya.
- source_word: הַשֵּׁנִית
  choice: yang kedua
  rationale: Ini adalah padanan langsung yang mengidentifikasi rangkaian tirai kedua.
- source_word: מַקְבִּילֹת
  choice: saling berhadapan
  rationale: Bentuk ini menyatakan bahwa kedua deretan lubang pengait ditempatkan berseberangan dan sejajar sehingga dapat dipasangkan.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: saling
  rationale: Idiom harfiahnya, 'seorang perempuan kepada saudarinya', menyatakan hubungan timbal balik antara benda-benda yang berpadanan. 'Saling' memberikan makna idiomatisnya secara alami, sementara gambaran harfiahnya dicatat dalam catatan kaki.
