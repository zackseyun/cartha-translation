  text: וְ/יִֽהְי֣וּ תֹֽאֲמִים֮ מִ/לְּ/מַטָּה֒ וְ/יַחְדָּ֗ו יִהְי֤וּ תַמִּים֙ עַל רֹאשׁ֔/וֹ אֶל הַ/טַּבַּ֖עַת הָ/אֶחָ֑ת כֵּ֚ן יִהְיֶ֣ה לִ/שְׁנֵי/הֶ֔ם לִ/שְׁנֵ֥י הַ/מִּקְצֹעֹ֖ת יִהְיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/024.yaml
  text: They shall be paired at the bottom[a], and together they shall be complete at its top, to the first ring. So it shall be for both of them[c][b]; they shall be for the two corners.
translation:
  language: id
  text: Kedua papan itu harus berpasangan di bagian bawah[a] dan bersama-sama harus utuh di bagian atasnya, hingga gelang yang satu itu[b]. Demikianlah harus dibuat untuk keduanya; keduanya harus untuk kedua sudut itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dipadankan”; bahasa Ibrani menggambarkan kedua papan sebagai pasangan yang serasi.
    reason: lexical_alternative
  - marker: b
    text: Atau “sampai pada gelang yang satu itu” atau “sampai pada gelang pertama.” Ungkapan Ibraninya dapat dipahami dengan beberapa cara.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹאֲמִים
  choice: berpasangan
  rationale: Bentuk ini menunjukkan dua papan yang dipadankan sebagai sepasang; 'berpasangan' alami dalam bahasa Indonesia dan tidak menentukan teknik pertukangan yang tidak dijelaskan.
- source_word: מִלְּמַטָּה
  choice: di bagian bawah
  rationale: Menunjukkan ujung bawah papan-papan tersebut secara jelas dan wajar.
- source_word: וְיַחְדָּו
  choice: menyatu
  rationale: Dalam konteks bangunan, kata ini menyatakan bahwa kedua papan bertemu atau berfungsi bersama; 'menyatu' menghasilkan kalimat Indonesia yang alami.
- source_word: תַמִּים
  choice: dengan utuh
  rationale: Menunjukkan keutuhan atau kelengkapan struktural, bukan kesempurnaan moral, sambil tidak menetapkan cara penyambungannya.
- source_word: עַל רֹאשׁוֹ
  choice: di bagian atasnya
  rationale: רֹאשׁ secara idiomatis menunjuk ujung atas. Akhiran tunggal dipertahankan karena dapat merujuk pada susunan pasangan tersebut secara kolektif.
- source_word: אֶל הַטַּבַּעַת הָאֶחָת
  choice: sampai pada satu gelang
  rationale: Mengikuti nilai numeral אֶחָת tanpa memaksakan arti ordinal 'pertama'; gelang tersebut kemungkinan merupakan titik pertemuan di atas.
- source_word: כֵּן יִהְיֶה לִשְׁנֵיהֶם
  choice: Demikianlah keduanya harus dibuat
  rationale: Menyampaikan bahwa ketentuan konstruksi yang sama berlaku pada kedua papan dalam gaya instruksi Indonesia yang jelas.
- source_word: לִשְׁנֵי הַמִּקְצֹעֹת
  choice: menjadi kedua sudut itu
  rationale: מִקְצֹעֹת paling langsung menunjuk dua sudut; terjemahan tidak menambahkan lokasi 'belakang' yang hanya diperoleh dari konteks lebih luas.
