  to: Dan satu hasta di sisi yang satu dan satu hasta di sisi yang lain[a], dari kelebihan panjang kain-kain kemah itu, akan terjuntai di sisi-sisi Kemah Suci[b], di sisi yang satu dan di sisi yang lain, untuk menutupinya.
