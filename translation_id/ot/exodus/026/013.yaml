base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/013.yaml
  text: And the extra cubit on this side and the extra cubit on that side[a], from the surplus in the length of the tent curtains, shall hang over the sides of the tabernacle on this side and on that side[b], to cover it.
translation:
  language: id
  text: Dan satu hasta di sisi yang satu dan satu hasta di sisi yang lain[a], dari kelebihan panjang kain-kain kemah itu, akan terjuntai di sisi-sisi Kemah Suci[b], di sisi yang satu dan di sisi yang lain, untuk menutupinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “satu hasta pada satu sisi dan satu hasta pada sisi yang lain.” Dalam bahasa Ibrani, kata “hasta” diulang bersama penunjuk sisi; frasa itu menunjuk pada ukuran yang tersisa pada masing-masing sisi.
    reason: lexical_alternative
  - marker: b
    text: “Kemah Suci” menerjemahkan kata Ibrani mishkan, yaitu bangunan kediaman kudus di bawah penutup kemah.
    reason: cultural_note
lexical_decisions:
- source_word: הָאַמָּה
  choice: satu hasta yang berlebih
  rationale: אַמָּה adalah ukuran baku 'hasta'; konteks בָּעֹדֵף menunjukkan bahwa satu hasta tersebut merupakan bagian yang berlebih pada masing-masing sisi.
- source_word: מִזֶּה ... מִזֶּה
  choice: di sisi yang satu ... di sisi yang lain
  rationale: Ungkapan demonstratif ini menunjuk pada dua sisi yang berlawanan; bentuk tersebut alami dalam uraian arsitektural bahasa Indonesia.
- source_word: בָּעֹדֵף
  choice: kelebihan
  rationale: Kata ini menyatakan bagian yang tersisa atau melebihi ukuran bangunan, yaitu panjang kain kemah yang berlebih.
- source_word: אֹרֶךְ
  choice: panjang
  rationale: Padanan ruang yang langsung dan wajar dalam konteks ukuran bangunan.
- source_word: יְרִיעֹת הָאֹהֶל
  choice: kain-kain kemah
  rationale: יְרִיעוֹת menunjuk pada lembaran atau bentangan kain, sedangkan הָאֹהֶל menerangkan lapisan kemah itu.
- source_word: יִהְיֶה סָרוּחַ
  choice: harus terjuntai
  rationale: Frasa ini menggambarkan bahan berlebih yang memanjang ke bawah atau menggantung melewati sisi bangunan.
- source_word: צִדֵּי הַמִּשְׁכָּן
  choice: kedua sisi Kemah Suci
  rationale: Bentuk jamak צִדֵּי menunjuk pada sisi-sisi bangunan; מִשְׁכָּן adalah tempat kediaman kudus yang secara konvensional disebut Kemah Suci dalam bahasa Indonesia.
- source_word: לְכַסֹּתוֹ
  choice: untuk menutupinya
  rationale: Infinitif ini menyatakan tujuan terjuntainya kain yang berlebih, yakni menutupi Kemah Suci.
