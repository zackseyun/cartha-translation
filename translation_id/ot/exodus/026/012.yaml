base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/012.yaml
  text: And the overhang that remains from the tent curtains[a]—the half curtain that remains over[b]—shall hang over the back of the tabernacle.
translation:
  language: id
  text: Bagian berlebih yang tersisa dari kain-kain penutup kemah itu[a]—yaitu setengah dari kain penutup yang berlebih—harus terjuntai menutupi bagian belakang Kemah Suci.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sisa yang tertinggal dari kain-kain penutup kemah itu.”
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani membedakan “kemah” (lapisan penutup) dari “Kemah Suci” (bangunan tempat kediaman).
    reason: cultural_note
lexical_decisions:
- source_word: סֶרַח
  choice: bagian berlebih
  rationale: Kata ini menunjuk pada sisa bahan yang menonjol atau berjuntai. Dalam konteks bentuk kemah, “bagian berlebih” menyatakan kelebihan bahan tanpa menghilangkan fungsi spasialnya, yang kemudian dijelaskan oleh kata “terjuntai”.
- source_word: הָעֹדֵף / הָעֹדֶפֶת
  choice: yang tersisa / yang berlebih
  rationale: Kedua bentuk berasal dari עודף dan menyatakan sesuatu yang tersisa atau melebihi ukuran yang diperlukan. Variasi alami dalam bahasa Indonesia menghindari pengulangan yang kaku sambil mempertahankan maknanya.
- source_word: יְרִיעֹת
  choice: kain-kain penutup
  rationale: Dalam konteks Kemah Suci, kata ini mengacu pada lembaran-lembaran kain besar yang membentuk lapisan penutup. “Kain-kain penutup” lebih jelas bagi pembaca Indonesia daripada sekadar “tirai”.
- source_word: הָאֹהֶל
  choice: kemah itu
  rationale: אֹהֶל di sini menunjuk pada lapisan kemah atau penutupnya, dan tetap dibedakan dari מִשְׁכָּן yang disebut kemudian.
- source_word: חֲצִי הַיְרִיעָה
  choice: setengah dari kain penutup
  rationale: Frasa konstruksi ini menunjuk pada separuh dari satu lembar kain penutup. Bentuk ini alami dan mempertahankan acuan tunggalnya.
- source_word: תִּסְרַח
  choice: harus terjuntai menutupi
  rationale: Kata kerja ini menggambarkan bagian berlebih yang menggantung atau memanjang ke bawah. “Terjuntai menutupi” menyampaikan gerak sekaligus letaknya terhadap bagian belakang bangunan.
- source_word: עַל אֲחֹרֵי
  choice: menutupi bagian belakang
  rationale: Gabungan ini menunjukkan bahwa kain berada di atas atau melampaui sisi belakang bangunan. Ungkapan ini alami dalam bahasa Indonesia untuk kain yang berjuntai pada sisi tersebut.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: מִשְׁכָּן adalah istilah teknis bagi tempat kediaman kudus atau struktur tabernakel. “Kemah Suci” merupakan padanan Indonesia yang jelas dan mapan dalam konteks ini.
