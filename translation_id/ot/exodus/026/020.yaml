  yaml_path: translation/ot/exodus/026/020.yaml
  text: And for the second side of the tabernacle[a], on the north side, twenty frames.
translation:
  language: id
  text: Untuk sisi kedua Kemah Suci, di sebelah utara, buatlah dua puluh rangka[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “papan.” Istilah Ibrani ini dapat menunjuk pada bagian-bagian struktur tegak Kemah Suci.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/צֶלַע
  choice: Untuk ... sisi
  rationale: Gabungan kata penghubung dan preposisi memperkenalkan spesifikasi konstruksi berikutnya. Dalam konteks Kemah Suci, צֶלַע menunjuk pada sisi atau dinding samping, bukan rusuk secara harfiah.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: מִשְׁכָּן adalah istilah baku dalam bagian ini untuk tempat ibadah berbentuk kemah. 'Kemah Suci' alami dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: הַשֵּׁנִית
  choice: kedua
  rationale: Kata sifat ini menandai sisi kedua yang berpadanan dengan sisi yang disebut pada ayat sebelumnya.
- source_word: לִ/פְאַת צָפוֹן
  choice: yaitu sisi utara
  rationale: Frasa ini menunjukkan orientasi sisi tersebut ke arah utara. 'Yaitu sisi utara' memperjelas hubungan aposisionalnya secara alami.
- source_word: עֶשְׂרִים
  choice: dua puluh
  rationale: Padanan langsung untuk bilangan kardinal.
- source_word: קָרֶשׁ
  choice: rangka
  rationale: Dalam uraian konstruksi Kemah Suci, קֶרֶשׁ menunjuk pada unsur-unsur struktural tegak pembentuk dinding. 'Rangka' menyampaikan fungsi struktural itu, sedangkan 'papan' tetap merupakan kemungkinan leksikal.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata kerja 'buatlah' ditambahkan untuk melengkapi konstruksi eliptis bahasa Ibrani berdasarkan perintah konstruksi dalam konteks terdekat; tidak mengubah isi spesifikasi.
