    rationale: Teks Ibrani memakai frasa nominal (‘kait-kaitnya emas’; ‘di atas empat alas perak’) yang berada dalam lingkup perintah sebelumnya, tanpa modal eksplisit. Penghapusan ‘harus’ lebih setia tanpa mengubah maksud instruksional.
