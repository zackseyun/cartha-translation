translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk perintah ‘Gantungkanlah’ mempertahankan corak petunjuk pembangunan. Klausa terakhir memperjelas bahwa tiang-tiang berdiri di atas alas, hubungan yang tersirat dalam susunan Ibrani.
