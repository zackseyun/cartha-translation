  text: And you shall hang it on four pillars of acacia wood overlaid with gold[a], their hooks being of gold, on four silver bases.
translation:
  language: id
  text: Gantungkanlah tirai itu pada empat tiang kayu akasia yang dilapisi emas; kait-kaitnya dari emas, dan keempat tiang itu berdiri di atas empat alas perak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: empat soket perak.'
    reason: אֶדֶן dapat berarti alas penyangga atau soket tempat tiang dipasang.
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Gantungkanlah
  rationale: Secara umum נתן berarti ‘menaruh’ atau ‘menempatkan’, tetapi objeknya adalah tirai dan penempatannya pada tiang-tiang; karena itu, ‘gantungkanlah’ menyatakan tindakan yang dimaksud secara alami dalam bahasa Indonesia.
- source_word: אֹתָהּ
  choice: tirai itu
  rationale: Pronomina objek feminin tunggal ini merujuk kepada tirai pada ayat sebelumnya. Penyebutan kembali nomina lebih jelas dan alami dalam bahasa Indonesia daripada hanya ‘itu’.
- source_word: עַמּוּדֵי שִׁטִּים
  choice: tiang kayu akasia
  rationale: עַמּוּדִים adalah penyangga yang berdiri, sedangkan שִׁטִּים menunjuk pada kayu akasia sebagai bahannya.
- source_word: מְצֻפִּים זָהָב
  choice: dilapisi emas
  rationale: Bentuk pasif צפה menyatakan bahwa permukaan tiang ditutup atau disalut dengan emas; ‘dilapisi emas’ tepat dan lazim dalam bahasa Indonesia modern.
- source_word: וָוֵיהֶם
  choice: kait-kaitnya
  rationale: וָוִים menunjuk pada kait atau pasak yang terpasang pada tiang untuk menggantungkan tirai; ‘kait’ paling sesuai dengan fungsinya dalam konteks ini.
- source_word: אַדְנֵי כָסֶף
  choice: alas perak
  rationale: אֶדֶן dalam konstruksi Kemah Suci adalah penyangga bawah atau soket tempat tiang berdiri. ‘Alas’ mudah dipahami, sedangkan arti yang lebih teknis dipertahankan dalam catatan kaki.
