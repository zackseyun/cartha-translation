base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/019.yaml
  text: 'And you shall make forty silver bases under the twenty frames: two bases under one frame for its two tenons[b][a], and two bases under the next frame for its two tenons.'
translation:
  language: id
  text: 'Buatlah empat puluh alas perak[a] di bawah dua puluh rangka itu: dua alas di bawah satu rangka untuk kedua purusnya[c], dan dua alas di bawah rangka yang berikutnya untuk kedua purusnya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dudukan perak” atau “soket perak”; istilah Ibrani ini dapat menunjuk pada dudukan berlubang dalam konstruksi Kemah Suci.
    reason: lexical_alternative
  - marker: c
    text: Purus ialah tonjolan pada ujung kayu yang dimasukkan ke dalam lubang pasangannya; secara harfiah, bahasa Ibraninya berbunyi “kedua tangannya”.
    reason: lexical_clarification
lexical_decisions:
- source_word: אַדְנֵי כֶסֶף
  choice: alas perak
  rationale: Dalam konteks Kemah Suci, אֶדֶן adalah penopang atau dudukan berlubang bagi bagian tegak. “Alas” jelas dan alami dalam bahasa Indonesia, sedangkan alternatif “dudukan” dicatat dalam catatan kaki.
- source_word: תַּעֲשֶׂה
  choice: buatlah
  rationale: Bentuk imperfek orang kedua tunggal dalam rangkaian petunjuk ini berfungsi sebagai perintah. “Buatlah” menyampaikan daya direktifnya secara wajar dan ringkas.
- source_word: תַּחַת
  choice: di bawah
  rationale: Preposisi ini secara langsung menyatakan letak alas terhadap rangka.
- source_word: הַקָּרֶשׁ / הַקֶּרֶשׁ
  choice: rangka
  rationale: קֶרֶשׁ menunjuk pada bagian struktur tegak Kemah Suci. “Rangka” menonjolkan fungsi strukturalnya; alternatif tradisional “papan” dipertahankan dalam catatan kaki.
- source_word: שְׁנֵי אֲדָנִים
  choice: dua alas
  rationale: Terjemahan ini mempertahankan jumlah dan konsisten dengan terjemahan אֶדֶן pada awal ayat.
- source_word: לִשְׁתֵּי יְדֹתָיו
  choice: untuk kedua purusnya
  rationale: Secara harfiah ungkapan ini berarti “untuk kedua tangannya”, tetapi dalam konteks pertukangan יָדוֹת menunjuk pada tonjolan sambungan. “Purus” adalah istilah Indonesia yang tepat untuk bagian kayu yang masuk ke dalam lubang pasangannya.
- source_word: הָאֶחָד ... הָאֶחָד
  choice: rangka yang satu ... rangka yang berikutnya
  rationale: Pengulangan “yang satu” dalam bahasa Ibrani bersifat distributif. “Yang berikutnya” pada penyebutan kedua menghindari pengulangan kaku sambil mempertahankan maksud bahwa setiap rangka ditopang dua alas.
