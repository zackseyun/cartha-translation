  terminology: “Alas perak”, “rangka”, dan “purus” sesuai konteks konstruksi. Catatan untuk “purus” membantu pembaca umum. Catatan alternatif bagi אֶדֶן lebih alami bila menyebut “dudukan berlubang” daripada “alas berbentuk soket”.
