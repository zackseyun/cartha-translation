  text: Each board is to have two tenons joined one to another[a]; this is how you shall make all the boards of the tabernacle.
translation:
  language: id
  text: Setiap papan harus memiliki dua pasak sambungan yang dipasangkan satu dengan yang lain.[a] Demikianlah harus kamu buat semua papan Kemah Suci.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “dua tangan untuk papan yang satu, dipasangkan, seorang perempuan kepada saudarinya.” Di sini “tangan” menunjuk pada bagian sambungan yang menonjol, yaitu pasak sambungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדוֹת
  choice: pasak sambungan
  rationale: Secara harfiah berarti 'tangan', tetapi dalam konteks pertukangan menunjuk pada bagian papan yang menonjol untuk dipasang pada alas. 'Pasak sambungan' lebih mudah dipahami pembaca umum daripada istilah teknis 'pen'.
- source_word: מְשֻׁלָּבֹת
  choice: sejajar
  rationale: Partisip pasif ini menggambarkan kedua bagian sambungan yang diatur secara berpasangan atau bersesuaian. Dalam konteks dua tonjolan pada satu papan, 'sejajar' menyampaikan hubungan konstruktifnya tanpa mengandaikan bahwa keduanya saling mengunci.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: satu dengan yang lain
  rationale: Ungkapan harfiah 'seorang perempuan kepada saudarinya' merupakan idiom untuk dua bagian sejenis yang saling bersesuaian.
- source_word: קֶרֶשׁ
  choice: papan
  rationale: Menunjuk pada unsur kayu tegak dalam struktur Kemah Suci; 'papan' merupakan padanan Indonesia yang jelas dan tidak menafsirkan bentuknya secara berlebihan.
- source_word: מִשְׁכָּן
  choice: Kemah Suci
  rationale: Dalam konteks Keluaran, kata ini menjadi sebutan bagi tempat kudus portabel. 'Kemah Suci' adalah istilah Indonesia yang lazim dan mudah dipahami.
- source_word: כֵּן תַּעֲשֶׂה
  choice: Demikianlah harus kamu buat
  rationale: Mempertahankan daya perintah dan acuan kepada pola yang baru saja ditetapkan.
- source_word: שְׁתֵּי
  choice: dua
  rationale: Padanan langsung untuk bilangan yang menerangkan pasak sambungan.
- source_word: לַקֶּרֶשׁ הָאֶחָד
  choice: Setiap papan
  rationale: Walaupun bentuknya secara formal berarti 'pada papan yang satu', konteksnya bersifat distributif dan berlaku bagi tiap papan.
