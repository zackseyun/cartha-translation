  text: And you shall make for the tent a covering of rams’ skins dyed red[a], and a covering of tahash skins above.
translation:
  language: id
  text: Buatlah penutup bagi Kemah itu dari kulit domba jantan yang diwarnai merah, dan penutup dari kulit tahas di atasnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani tahas tidak pasti. Istilah ini mungkin menunjuk pada hewan tertentu atau pada sejenis kulit yang tahan lama; usulan terjemahannya antara lain “kulit berkualitas tinggi”, “kulit pesut”, atau “kulit duyung”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Buatlah
  rationale: Bentuk perfektif Qal dengan waw dalam rangkaian petunjuk berfungsi sebagai perintah; bentuk imperatif Indonesia menyampaikan daya arahannya secara alami.
- source_word: מִכְסֶה לָאֹהֶל
  choice: bagi Kemah itu penutup
  rationale: מִכְסֶה berarti penutup atau lapisan pelindung, sedangkan אֹהֶל secara harfiah berarti kemah. Huruf kapital dan penunjuk 'itu' menandai kemah khusus dalam konteks tanpa mengganti istilah sumber dengan 'Kemah Suci'.
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: kulit domba jantan yang diwarnai merah
  rationale: Ungkapan ini menyebut kulit domba jantan yang dibuat menjadi merah; 'diwarnai merah' menyampaikan proses pengolahannya secara jelas dan wajar.
- source_word: וּמִכְסֵה
  choice: dan ... penutup
  rationale: Pengulangan kata 'penutup' mempertahankan dua lapisan yang disebutkan teks tanpa menambahkan kata interpretatif seperti 'satu lagi'.
- source_word: עֹרֹת תְּחָשִׁים
  choice: kulit tahas
  rationale: Identitas תְּחָשִׁים tidak pasti. Transliterasi 'tahas' mempertahankan ketidakpastian leksikal dan menghindari penetapan spekulatif atas jenis hewan atau kulit tertentu.
- source_word: מִלְמָעְלָה
  choice: di atasnya
  rationale: Dalam konteks susunan lapisan, frasa ini menunjukkan bahwa penutup kedua ditempatkan di bagian atas. 'Di atasnya' alami dalam bahasa Indonesia dan membuat hubungan spasial yang tersirat menjadi jelas.
