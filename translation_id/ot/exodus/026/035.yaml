base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/035.yaml
  text: And you shall place the table outside the veil[a], and the lampstand opposite the table on the south side of the tabernacle[b]; and you shall put the table on the north side.
translation:
  language: id
  text: Haruslah engkau menempatkan meja itu di luar tabir[a], dan tempat pelita[b] berhadapan dengan meja itu, di sisi selatan Kemah Suci. Meja itu harus kautaruh di sisi utara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tirai.” Kata Ibrani פָּרֹכֶת menunjuk pada tirai pemisah bagian dalam Kemah Suci.
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: menorah; diterjemahkan “tempat pelita.”'
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Haruslah engkau menempatkan
  rationale: Bentuk perfektum dengan waw dalam rangkaian petunjuk berfungsi sebagai perintah; 'menempatkan' menyampaikan tindakan mengatur posisi secara alami.
- source_word: הַשֻּׁלְחָן
  choice: meja itu
  rationale: Nomina Ibrani hanya menyebut 'meja'; identifikasi lebih lengkap tidak ditambahkan karena tidak tersurat dalam ayat ini.
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: di luar tabir
  rationale: פָּרֹכֶת adalah tirai pemisah bagian dalam Kemah Suci; 'tabir' merupakan padanan Indonesia yang khusus dan dikenal dalam konteks ini.
- source_word: הַמְּנֹרָה
  choice: kaki pelita
  rationale: Istilah diterjemahkan menurut fungsi bendanya, bukan ditransliterasikan, sehingga jelas bagi pembaca Indonesia dan tetap sesuai dengan benda penerang bercabang dalam Kemah Suci.
- source_word: נֹכַח
  choice: berhadapan dengan
  rationale: Ungkapan ini secara alami menunjukkan posisi saling berseberangan atau menghadap.
- source_word: עַל צֶלַע הַמִּשְׁכָּן תֵּימָנָה
  choice: di sisi selatan Kemah Suci
  rationale: צֶלַע berarti sisi, sedangkan תֵּימָנָה menunjukkan arah selatan; susunan ini alami dalam bahasa Indonesia.
- source_word: וְהַשֻּׁלְחָן תִּתֵּן
  choice: Meja itu harus kautaruh
  rationale: נָתַן dalam konteks penataan benda berarti menaruh atau menempatkan; konstruksi ini mempertahankan penekanan awal pada meja.
- source_word: עַל צֶלַע צָפוֹן
  choice: di sisi utara
  rationale: Padanan langsung dan idiomatis bagi petunjuk lokasi di sisi utara.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'Haruslah engkau' mempertahankan nada instruksi ilahi, sedangkan 'kautaruh' menjaga kelancaran tanpa mengurangi ketepatan. 'Kemah Suci' dipakai sebagai padanan kontekstual מִשְׁכָּן.
