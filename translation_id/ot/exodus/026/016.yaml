  text: Panjang setiap papan adalah sepuluh hasta, dan lebarnya satu setengah hasta.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “papan” juga dapat dipahami sebagai “rangka” atau unsur tegak suatu rangka.
