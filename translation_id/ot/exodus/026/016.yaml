lexical_decisions:
- source_word: קֶרֶשׁ
  choice: papan
  rationale: Dalam konteks pembangunan Kemah Suci, kata ini menunjuk pada unsur kayu tegak dalam strukturnya. “Papan” merupakan padanan Indonesia yang alami dan tradisional tanpa menentukan bentuk konstruksinya secara berlebihan.
- source_word: עֶשֶׂר אַמּוֹת
  choice: sepuluh hasta
  rationale: Mempertahankan satuan ukuran kuno dan menyampaikan nilainya secara langsung.
- source_word: אֹרֶךְ
  choice: panjang
  rationale: Padanan baku dan alami untuk dimensi ini dalam uraian konstruksi.
- source_word: וְאַמָּה וַחֲצִי הָאַמָּה
  choice: satu setengah hasta
  rationale: Ungkapan Indonesia yang alami dan tepat untuk ukuran harfiah “satu hasta dan setengah hasta”.
- source_word: רֹחַב
  choice: lebar
  rationale: Padanan modern yang jelas untuk dimensi tersebut.
- source_word: הַקֶּרֶשׁ הָאֶחָד
  choice: setiap papan
  rationale: Bentuk tunggal dengan אֶחָד menyatakan ukuran masing-masing unsur; “setiap papan” menyampaikan makna distributif itu secara alami.
