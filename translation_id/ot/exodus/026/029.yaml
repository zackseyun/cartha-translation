translation:
  language: id
  text: Lapislah rangka-rangka itu[a] dengan emas. Buatlah cincin-cincinnya dari emas sebagai tempat bagi palang-palang[b], dan lapisi palang-palang itu dengan emas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “papan-papan.” Kata Ibrani ini menunjuk pada bagian-bagian struktural Kemah Suci.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “rumah-rumah bagi palang-palang,” yakni tempat atau penahan bagi palang-palang itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְּרָשִׁים
  choice: rangka-rangka
  rationale: Dalam konteks Kemah Suci, kata ini menunjuk pada bagian-bagian tegak pembentuk struktur. “Rangka-rangka” menyampaikan fungsi tersebut secara alami, sementara “papan-papan” juga mungkin.
- source_word: תְּצַפֶּה / וְצִפִּיתָ
  choice: melapisi / lapisi
  rationale: Bentuk piel dari צפה di sini berarti memberi lapisan suatu bahan, khususnya emas, bukan sekadar menutupi secara umum.
- source_word: זָהָב
  choice: emas
  rationale: Istilah bahan ini diterjemahkan langsung; pengulangannya dipertahankan sesuai teks Ibrani.
- source_word: טַבְּעֹתֵיהֶם
  choice: gelang-gelangnya
  rationale: טַבַּעַת berarti gelang atau cincin logam; “gelang-gelang” lazim dan jelas untuk perangkat pada struktur Kemah Suci.
- source_word: תַּעֲשֶׂה
  choice: buatlah
  rationale: Imperatif Indonesia menyampaikan daya perintah dari bentuk Ibrani dalam rangkaian petunjuk ini secara wajar.
- source_word: בָּתִּים לַבְּרִיחִם
  choice: sebagai tempat bagi kayu-kayu palang
  rationale: Secara harfiah berarti “rumah-rumah bagi kayu-kayu palang.” “Tempat” menyampaikan fungsi gelang sebagai penahan atau wadah masuknya palang tanpa memberi rincian teknis yang tidak dinyatakan.
- source_word: הַבְּרִיחִם
  choice: kayu-kayu palang
  rationale: בְּרִיחַ menunjuk pada palang yang menyatukan rangka. “Kayu-kayu palang” jelas dalam bahasa Indonesia dan sesuai dengan bahan yang ditetapkan dalam konteks sebelumnya.
