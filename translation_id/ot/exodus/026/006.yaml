  text: וְ/עָשִׂ֕יתָ חֲמִשִּׁ֖ים קַרְסֵ֣י זָהָ֑ב וְ/חִבַּרְתָּ֨ אֶת הַ/יְרִיעֹ֜ת אִשָּׁ֤ה אֶל אֲחֹתָ/הּ֙ בַּ/קְּרָסִ֔ים וְ/הָיָ֥ה הַ/מִּשְׁכָּ֖ן אֶחָֽד־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/006.yaml
  text: And you shall make fifty gold clasps[a], and join the curtains to one another with the clasps, so that the tabernacle may be one.
translation:
  language: id
  text: Buatlah lima puluh pengait emas, lalu sambungkanlah lembar-lembar kain itu satu dengan yang lain[a] dengan pengait-pengait tersebut, sehingga Kemah Suci itu menjadi satu kesatuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seorang perempuan kepada saudarinya”—sebuah ungkapan Ibrani yang berarti lembar-lembar kain itu dipasangkan satu dengan yang lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Buatlah
  rationale: Bentuk perfektum Qal dengan waw dalam rangkaian petunjuk berfungsi sebagai perintah; bentuk imperatif Indonesia menyampaikan daya arahannya secara alami.
- source_word: חֲמִשִּׁים קַרְסֵי זָהָב
  choice: lima puluh pengait emas
  rationale: קֶרֶס menunjuk pada alat penyambung lembaran kain. 'Pengait' cukup umum sehingga tidak menentukan bentuk alat itu secara berlebihan, sedangkan 'emas' menyatakan bahannya.
- source_word: וְחִבַּרְתָּ
  choice: lalu sambungkanlah
  rationale: חבר berarti menyambungkan atau menggabungkan. 'Lalu sambungkanlah' alami dalam urutan petunjuk pengerjaan.
- source_word: הַיְרִיעֹת
  choice: lembar-lembar kain itu
  rationale: יְרִיעָה dalam konteks ini adalah panel atau lembaran kain pembentuk Kemah Suci; pilihan ini lebih konkret daripada 'tirai' dan tidak menyiratkan fungsi sebagai penutup jendela.
- source_word: אִשָּׁה אֶל אֲחֹתָהּ
  choice: satu dengan yang lain
  rationale: Ungkapan harfiahnya 'seorang perempuan kepada saudarinya' merupakan idiom Ibrani untuk benda-benda yang dipasangkan satu sama lain. Terjemahan idiomatis mempertahankan maksudnya, sementara bentuk harfiah dicatat dalam catatan kaki.
- source_word: בַּקְּרָסִים
  choice: dengan pengait-pengait tersebut
  rationale: Preposisi בְּ menyatakan alat. Kata 'tersebut' memperjelas bahwa pengait yang dipakai adalah lima puluh pengait yang baru diperintahkan untuk dibuat.
- source_word: וְהָיָה הַמִּשְׁכָּן אֶחָד
  choice: sehingga Kemah Suci itu menjadi satu kesatuan
  rationale: Klausa ini menyatakan hasil penyambungan. 'Kemah Suci' adalah istilah Indonesia yang dikenal untuk מִשְׁכָּן dalam konteks tempat kudus, dan 'satu kesatuan' menyampaikan bahwa seluruh susunan kain menjadi satu.
theological_decisions:
- issue: Penerjemahan הַמִּשְׁכָּן
  choice: Kemah Suci
  alternative: tempat kediaman; Kemah Pertemuan
  rationale: '''Kemah Suci'' mempertahankan pengertian teknis bangunan kudus portabel dalam kitab Keluaran. ''Tempat kediaman'' lebih harfiah tetapi terlalu umum, sedangkan ''Kemah Pertemuan'' biasanya menerjemahkan istilah Ibrani yang berbeda, אֹהֶל מוֹעֵד.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas dalam bentuk petunjuk kerja. Istilah teknis dipertahankan hanya sejauh membantu pembaca umum; ungkapan Ibrani yang tidak alami dialihkan secara idiomatis dan bentuk harfiahnya disimpan dalam catatan kaki.
