translation:
  language: id
  text: Dirikanlah Kemah Suci itu menurut pola yang telah kaulihat di gunung.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַהֲקֵמֹתָ
  choice: Dirikanlah
  rationale: Bentuk Hifil dari קום menyatakan tindakan membuat bangunan itu berdiri; dalam konteks petunjuk ilahi, imperatif bahasa Indonesia menyampaikan daya perintah secara alami.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: Istilah ini jelas dan lazim dipahami pembaca Indonesia sebagai kemah tempat kediaman ilahi dalam Keluaran, tanpa memakai kata serapan yang kurang umum.
- source_word: כְּמִשְׁפָּטוֹ
  choice: menurut ketentuan
  rationale: מִשְׁפָּט di sini menunjuk pada tata cara atau ketentuan yang ditetapkan bagi pendirian Kemah Suci. Pilihan ini mempertahankan nuansa normatif yang lebih kuat daripada sekadar 'pola'.
- source_word: אֲשֶׁר הָרְאֵיתָ
  choice: yang telah kaulihat
  rationale: Terjemahan langsung bentuk aktif Ibrani mempertahankan bahwa Musa melihat tata ketentuan itu, tanpa mengubahnya menjadi bentuk pasif tersirat.
- source_word: בָּהָר
  choice: di gunung
  rationale: Preposisi בְּ dalam konteks lokasi Musa secara alami diterjemahkan 'di'; konteks yang lebih luas mengidentifikasi gunung tersebut.
theological_decisions:
- issue: Apakah אֲשֶׁר הָרְאֵיתָ dibuat pasif untuk menegaskan bahwa Allah memperlihatkannya?
  choice: 'Mempertahankan bentuk aktif: ''yang telah kaulihat''.'
  alternative: '''yang telah diperlihatkan kepadamu''.'
  rationale: Teks Ibrani secara gramatikal berkata 'yang telah kaulihat'. Konteks memang menyiratkan bahwa Allah memperlihatkannya, tetapi terjemahan utama tidak perlu menambahkan agen atau mengubah sudut pandang.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. 'Dirikanlah' cocok untuk pembangunan struktur, sedangkan 'Kemah Suci' memberi rujukan yang mudah dikenali. Susunan kalimat mempertahankan hubungan langsung antara ketentuan pendirian dan apa yang Musa lihat di gunung.
