base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/031.yaml
  text: And you shall make a veil of blue[a], purple, and scarlet yarn, and fine twisted linen; it shall be made with cherubim[c][b], the work of a skillful designer.
translation:
  language: id
  text: Haruslah engkau membuat sebuah tabir[a] dari benang biru, ungu, dan merah kirmizi[b], serta linen halus berpilin. Tabir itu harus dibuat dengan gambar kerubim, sebagai karya seorang perancang yang terampil.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tirai”. Istilah Ibrani ini menunjuk pada tirai bagian dalam yang memisahkan Ruang Kudus dari Ruang Mahakudus.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibraninya secara lebih harfiah menunjuk pada bahan berwarna merah kirmizi; zat pewarna ini secara tradisional dikaitkan dengan serangga.
    reason: cultural_note
  - marker: c
    text: Atau “sebagai karya seorang penenun artistik” atau “dikerjakan dengan terampil”. Ungkapan Ibrani ini menunjukkan pengerjaan artistik oleh seorang ahli.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָרֹכֶת
  choice: tabir
  rationale: Istilah ini menunjuk pada tirai bagian dalam yang memisahkan Ruang Kudus dari Ruang Mahakudus. “Tabir” merupakan istilah Indonesia yang tepat dan lazim dalam konteks tempat suci.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: benang biru, ungu, dan merah tua
  rationale: Ketiga istilah menunjuk pada bahan tekstil berwarna; “benang” dinyatakan sekali agar daftar itu alami dalam bahasa Indonesia. “Merah tua” menyampaikan warna bahan yang dicelup tanpa memasukkan asal zat pewarnanya ke dalam teks utama.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: linen halus yang dipintal
  rationale: Terjemahan ini mempertahankan baik jenis bahannya, yakni linen halus, maupun sifat pengerjaannya sebagai benang yang dipintal.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: oleh seorang perancang yang terampil
  rationale: Ungkapan Ibrani menandakan pengerjaan artistik oleh ahli. Pilihan ini tidak mempersempit tekniknya menjadi sulaman atau tenunan tertentu.
- source_word: יַעֲשֶׂה אֹתָהּ
  choice: harus dibuat
  rationale: Bentuk orang ketiga tunggal dengan objek feminin berfungsi secara impersonal dalam rangkaian petunjuk; bentuk pasif Indonesia menyampaikan daya instruksionalnya secara alami.
- source_word: כְּרֻבִים
  choice: dengan gambar kerub
  rationale: Kerub merupakan unsur rancangan pada tabir. “Gambar kerub” menjelaskan bahwa yang dimaksud adalah representasi artistik pada kain, sedangkan “kerub” dipakai sebagai bentuk Indonesia yang lazim.
theological_decisions:
- issue: Bahasa tentang tempat ibadah dan pengerjaan artistik tanpa memasukkan simbolisme teologis dari bagian Alkitab yang lebih kemudian
  choice: Menerjemahkan ayat sebagai petunjuk konkret pembuatan tabir dengan gambar kerub.
  alternative: Menggunakan bahasa simbolis yang menonjolkan makna teologis tabir dalam teks-teks yang lebih kemudian.
  rationale: Ayat ini sendiri memberikan petunjuk arsitektural dan artistik. Terjemahan utama tidak seharusnya memasukkan penafsiran teologis yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “Haruslah engkau” mempertahankan gaya instruksi langsung, sementara kalimat kedua mengikuti peralihan Ibrani ke konstruksi impersonal. Istilah teknis dijelaskan melalui catatan kaki tanpa membebani teks utama.
