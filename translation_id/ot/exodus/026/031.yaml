revisions:
- from: Haruslah engkau membuat sebuah tabir[a] dari benang biru, ungu, dan merah tua[b], serta linen halus yang dipintal. Tabir itu harus dibuat dengan gambar kerub oleh seorang perancang yang terampil.[c]
  to: Haruslah engkau membuat sebuah tabir[a] dari benang biru, ungu, dan merah kirmizi[b], serta linen halus berpilin. Tabir itu harus dibuat dengan gambar kerubim, sebagai karya seorang perancang yang terampil.[c]
  rationale: Revisi mengembalikan fungsi מַעֲשֵׂה חֹשֵׁב sebagai keterangan mengenai karya/pengerjaan, bukan sebagai penetapan pelaku. Istilah warna disesuaikan menjadi “merah kirmizi” agar lebih setia pada scarlet, dan “linen halus berpilin” menyampaikan kualitas מָשְׁזָר secara ringkas. Semua penanda catatan kaki dipertahankan dan ditempatkan pada unsur yang dijelaskannya.
