  terminology: '"Palang" suitably renders בְּרִיחַ. "Kerangka-kerangka" is retained as the stated lexical choice for the upright structural members, with the footnote appropriately noting "papan-papan" as an alternative. The terminology does not impose a disputed reconstruction of the tabernacle''s construction.'
