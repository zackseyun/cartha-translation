  text: And the middle bar[a], in the midst of the frames, shall extend from end to end.
translation:
  language: id
  text: Palang tengah itu, di tengah-tengah kerangka-kerangka itu,[a] harus membentang dari ujung ke ujung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “papan-papan”. Istilah Ibraninya menunjuk pada bagian-bagian struktural tegak Kemah Suci; “kerangka-kerangka” dipilih agar tidak memberi kesan bahwa bagian itu sekadar papan datar.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּרִיחַ
  choice: palang
  rationale: Dalam konteks pembangunan Kemah Suci, istilah ini menunjuk pada batang melintang yang mengikat bagian-bagian tegak; “palang” merupakan istilah arsitektural Indonesia yang alami.
- source_word: הַתִּיכֹן
  choice: yang di tengah
  rationale: Menandai palang yang berada pada posisi tengah di antara palang-palang lainnya.
- source_word: בְּתוֹךְ
  choice: di antara
  rationale: Mempertahankan arti lokatif di tengah atau di dalam susunan kerangka tanpa menambahkan mekanisme bahwa palang melewati lubang-lubang.
- source_word: הַקְּרָשִׁים
  choice: kerangka-kerangka
  rationale: Istilah Ibrani menunjuk pada unsur-unsur struktural tegak Kemah Suci. “Kerangka” menghindari kesan bahwa yang dimaksud hanyalah papan tipis dan tetap mempertahankan kemungkinan bentuk konstruksinya.
- source_word: מַבְרִחַ
  choice: harus membentang
  rationale: Partisip Hifil ini menggambarkan palang yang merentang sepanjang struktur. “Membentang” menyampaikan cakupan tersebut tanpa secara pasti menyatakan bahwa palang itu menembus lubang.
- source_word: מִן הַקָּצֶה אֶל הַקָּצֶה
  choice: dari ujung ke ujung
  rationale: Ungkapan alami dalam bahasa Indonesia yang menyatakan rentang penuh dari satu sisi hingga sisi lainnya.
