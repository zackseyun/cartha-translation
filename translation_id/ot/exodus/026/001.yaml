  text: וְ/אֶת הַ/מִּשְׁכָּ֥ן תַּעֲשֶׂ֖ה עֶ֣שֶׂר יְרִיעֹ֑ת שֵׁ֣שׁ מָשְׁזָ֗ר וּ/תְכֵ֤לֶת וְ/אַרְגָּמָן֙ וְ/תֹלַ֣עַת שָׁנִ֔י כְּרֻבִ֛ים מַעֲשֵׂ֥ה חֹשֵׁ֖ב תַּעֲשֶׂ֥ה אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/026/001.yaml
  text: And you shall make the tabernacle with ten curtains of finely twisted linen[a], and blue and purple and scarlet yarn; with cherubim, the work of a skillful designer, you shall make them.
translation:
  language: id
  text: “Kemah Suci itu harus kaubuat dari sepuluh lembar kain lenan halus yang dipintal, dengan benang biru, ungu, dan merah kirmizi. Buatlah motif kerub pada kain-kain itu dengan pengerjaan artistik seorang perancang yang terampil.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan motif kerub yang dikerjakan secara terampil pada kain-kain itu.” Ungkapan Ibrani מַעֲשֵׂה חֹשֵׁב menunjuk pada pengerjaan artistik berpola dalam kain.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: Istilah ini menyampaikan fungsi מִשְׁכָּן sebagai tempat kediaman kudus Allah dalam konteks tempat ibadah, sekaligus lebih mudah dipahami pembaca Indonesia modern daripada istilah serapan teknis seperti “tabernakel”.
- source_word: יְרִיעֹת
  choice: helai kain
  rationale: Dalam petunjuk pembangunan Kemah Suci, kata ini menunjuk pada lembaran-lembaran kain besar. “Helai kain” alami dalam bahasa Indonesia dan memungkinkan acuan jamak selanjutnya tetap jelas.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: lenan halus yang dipintal
  rationale: שֵׁשׁ menunjuk pada lenan halus, sedangkan מָשְׁזָר menerangkan benangnya sebagai bahan yang dipintal atau dipilin. Frasa ini mempertahankan bahan dan cara pengerjaannya.
- source_word: תְּכֵלֶת
  choice: benang biru
  rationale: Kata ini menunjuk pada bahan tekstil berwarna biru dalam daftar bahan Kemah Suci. “Benang” dibuat eksplisit dari konteks tekstil agar deret bahan terbaca alami.
- source_word: אַרְגָּמָן
  choice: ungu
  rationale: Istilah ini menunjuk pada bahan yang dicelup ungu; dalam rangkaian “benang biru, ungu, dan merah tua”, kata “benang” berlaku bagi semua warna.
- source_word: תֹלַעַת שָׁנִי
  choice: merah tua
  rationale: Ungkapan ini menunjuk pada warna tekstil merah menyala atau kirmizi. “Merah tua” merupakan padanan Indonesia yang jelas tanpa mengharuskan istilah warna yang kurang umum.
- source_word: כְּרֻבִים
  choice: gambar-gambar kerub
  rationale: “Kerub” mempertahankan istilah makhluk surgawi dalam konteks ibadah. “Gambar-gambar” memperjelas bahwa kerub merupakan motif yang dikerjakan pada kain, bukan makhluk yang dibuat terpisah.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: hasil karya seorang perancang yang terampil
  rationale: Ungkapan ini menekankan pengerjaan artistik yang dirancang dengan keahlian, kemungkinan berupa motif yang ditenun ke dalam kain, bukan sekadar kerja tangan biasa.
- source_word: וְאֶת ... תַּעֲשֶׂה
  choice: Kemah Suci itu harus kaubuat
  rationale: Bentuk ini mempertahankan sifat perintah dan penekanan awal pada objek. Kata penghubung Ibrani berfungsi melanjutkan rangkaian petunjuk dan tidak perlu diterjemahkan secara mekanis dengan “dan” dalam ayat Indonesia yang berdiri sendiri.
- source_word: אֹתָם
  choice: pada kain-kain itu
  rationale: Pronomina jamak merujuk kembali kepada sepuluh helai kain. Acuan diperjelas secara alami agar tidak ambigu dalam bahasa Indonesia.
theological_decisions: []
