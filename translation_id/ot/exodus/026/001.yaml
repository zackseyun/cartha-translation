  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “kaubuat” menjaga sapaan tunggal dalam perintah Ibrani. Istilah kultis “Kemah Suci” dan “kerub” dipertahankan, sedangkan susunan kalimat disesuaikan agar jelas bagi pembaca umum.
