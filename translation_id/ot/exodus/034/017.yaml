translation:
  language: id
  text: Jangan membuat ilah-ilah dari logam tuangan untuk dirimu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ilah-ilah tuangan” atau “ilah-ilah dari logam cor.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי
  choice: ilah-ilah
  rationale: Bentuk jamak konstruktus dari אֱלֹהִים dalam konteks larangan penyembahan berhala paling tepat diterjemahkan secara konkret sebagai “ilah-ilah”; hubungannya dengan מַסֵּכָה dinyatakan melalui frasa “dari logam tuangan”.
- source_word: מַסֵּכָה
  choice: dari logam tuangan
  rationale: Nomina ini menunjuk pada sesuatu yang dibuat dengan menuang logam cair, khususnya patung berhala. Frasa ini mempertahankan unsur bahan dan proses pembuatannya tanpa menambahkan kata “patung” ke dalam teks utama.
- source_word: לֹא
  choice: jangan
  rationale: Negasi dalam konteks hukum ini menyatakan larangan langsung; “jangan” merupakan bentuk perintah negatif yang alami dalam bahasa Indonesia.
- source_word: תַעֲשֶׂה
  choice: membuat
  rationale: Bentuk imperfek orang kedua tunggal maskulin memiliki daya perintah dalam konteks larangan dan secara alami dinyatakan dengan konstruksi “jangan membuat”.
- source_word: לָּךְ
  choice: bagi dirimu
  rationale: Preposisi dengan sufiks orang kedua tunggal menandai kepentingan atau peruntukan pribadi. “Bagi dirimu” mempertahankan nuansa tersebut dengan jelas.
theological_decisions:
- issue: Hakikat benda yang dilarang
  choice: Larangan membuat ilah-ilah dari logam tuangan
  alternative: Larangan membuat patung-patung tuangan bagi diri sendiri
  rationale: Bahasa Ibrani menggabungkan kata “ilah-ilah” dengan istilah yang berkaitan dengan benda hasil tuangan. Terjemahan ini mempertahankan kedua unsur itu dan tidak mereduksinya menjadi sekadar “patung”, sekaligus tidak menambahkan penjelasan teologis yang melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan bentuk larangan yang langsung dan bermartabat. “Ilah-ilah” dipilih untuk menunjuk dewa-dewa yang dijadikan objek penyembahan, sedangkan “logam tuangan” menyampaikan bahan sekaligus proses pembuatan secara mudah dipahami.
