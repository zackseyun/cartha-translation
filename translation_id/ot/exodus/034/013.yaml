  yaml_path: translation/ot/exodus/034/013.yaml
  text: Instead[a], you shall tear down their altars, shatter their pillars[b], and cut down their Asherah poles.
translation:
  language: id
  text: Sebaliknya[a], mezbah-mezbah mereka harus kamu robohkan, tugu-tugu mereka harus kamu hancurkan, dan tiang-tiang Asyera mereka harus kamu tebang[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Sebab mezbah-mezbah mereka harus kamu robohkan ….” Kata penghubung Ibrani ini juga dapat berarti “sebab”, tetapi dalam konteks ini dapat dipahami sebagai peralihan yang menyatakan tindakan sebaliknya setelah larangan sebelumnya.'
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “Asyera-Asyera mereka”; maksudnya benda-benda kultis yang berkaitan dengan Asyera, kemungkinan berupa tiang atau lambang kayu.'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebaliknya
  rationale: Dalam konteks, kata penghubung ini menyatakan tindakan yang harus dilakukan Israel sebagai kebalikan dari larangan pada ayat sebelumnya. Makna dasar 'sebab' tetap dicatat sebagai alternatif.
- source_word: מִזְבְּחֹתָם
  choice: mezbah-mezbah mereka
  rationale: Mempertahankan bentuk jamak dan akhiran pronominal orang ketiga jamak; 'mezbah' merupakan istilah baku dan mudah dipahami dalam konteks ibadah.
- source_word: תִּתֹּצוּן
  choice: harus kamu robohkan
  rationale: Verba נתץ menunjuk pada tindakan merobohkan atau membongkar bangunan; 'robohkan' alami untuk mezbah dan menyampaikan daya perintah bentuk imperfek dalam konteks ini.
- source_word: מַצֵּבֹתָם
  choice: tugu-tugu batu mereka
  rationale: מַצֵּבָה adalah batu yang didirikan, di sini sebagai benda kultis. 'Tugu batu' lebih konkret bagi pembaca modern daripada sekadar 'tiang' dan tidak mengaburkan bahannya.
- source_word: תְּשַׁבֵּרוּן
  choice: harus kamu hancurkan
  rationale: Bentuk Piel dari שׁבר menyatakan tindakan memecahkan dengan kuat; 'hancurkan' cocok untuk tugu batu.
- source_word: אֲשֵׁרָיו
  choice: tiang-tiang Asyera mereka
  rationale: Bentuk jamak ini menunjuk pada benda kultis yang berkaitan dengan Asyera. Pilihan ini mempertahankan hubungan dengan nama Asyera sekaligus menyatakan bahwa yang ditebang adalah objek fisik.
- source_word: תִּכְרֹתוּן
  choice: harus kamu tebang
  rationale: כרת berarti memotong; bersama benda-benda Asyera yang kemungkinan terbuat dari kayu, 'tebang' merupakan padanan yang alami dan konkret.
theological_decisions:
- issue: Rujukan אֲשֵׁרָיו
  choice: benda-benda kultis yang berkaitan dengan Asyera, diterjemahkan 'tiang-tiang Asyera'
  alternative: Asyerim; patung atau lambang Asyera
  rationale: Daftar ini menyebut benda-benda fisik yang harus dimusnahkan, dan verba 'tebang' mendukung rujukan kepada objek kayu. Terjemahan ini tetap menjaga kaitannya dengan Asyera tanpa menyamakan objek tersebut begitu saja dengan dewanya.
- issue: Fungsi כִּי pada awal ayat
  choice: kontras, 'Sebaliknya'
  alternative: kausal, 'Sebab'
  rationale: Sesudah larangan membuat perjanjian dalam konteks sebelumnya, ayat ini secara alami menyatakan tindakan kebalikannya. Namun, karena כִּי lazim pula bermakna 'sebab', kemungkinan itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan tiga klausa paralel dipertahankan, dengan pengulangan 'harus kamu' untuk menyampaikan daya perintah dan ritme hukum. Istilah 'Asyera' dipakai sebagai ejaan Indonesia yang lazim.
