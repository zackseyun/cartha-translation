  source_fidelity: Terjemahan secara cermat mengikuti konstruksi Ibrani רֵאשִׁית בִּכּוּרֵי אַדְמָתְךָ sebagai prioritas/yang pertama dari hasil pertama tanah, tanpa menjadikan nuansa ‘terbaik’ sebagai makna utama. ‘Rumah Yahweh, Allahmu’ mempertahankan בֵּית dan nama ilahi יהוה; ‘merebus anak kambing dalam susu induknya’ tepat untuk לֹא תְבַשֵּׁל גְּדִי בַּחֲלֵב אִמּוֹ.
