  terminology: ‘Yahweh’ konsisten dengan kebijakan yang diberikan dan mempertahankan nama diri ilahi. ‘Allahmu’, ‘rumah’, ‘anak kambing’, dan ‘susu induknya’ adalah padanan yang tepat serta alami. Catatan kaki secara tepat menyajikan ‘bagian terbaik’ sebagai alternatif, bukan sebagai kepastian tafsir.
