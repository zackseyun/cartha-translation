  text: רֵאשִׁ֗ית בִּכּוּרֵי֙ אַדְמָ֣תְ/ךָ֔ תָּבִ֕יא בֵּ֖ית יְהוָ֣ה אֱלֹהֶ֑י/ךָ לֹא תְבַשֵּׁ֥ל גְּדִ֖י בַּ/חֲלֵ֥ב אִמּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/026.yaml
  text: You shall bring the first of the firstfruits of your ground to the house of Yahweh your God[a]. You shall not boil a young goat in its mother's milk.
translation:
  language: id
  text: Bawalah bagian pertama dari hasil pertama tanahmu ke rumah Yahweh, Allahmu.[a] Janganlah merebus anak kambing dalam susu induknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bagian terbaik dari hasil pertama tanahmu.”'
    reason: Alternatif ini mencerminkan kemungkinan bahwa רֵאשִׁית dalam konteks persembahan menunjuk pada bagian utama atau pilihan, bukan hanya bagian yang pertama secara urutan.
lexical_decisions:
- source_word: רֵאשִׁית בִּכּוּרֵי
  choice: bagian pertama dari hasil pertama
  rationale: Mempertahankan susunan Ibrani yang menekankan bagian awal dari hasil paling awal, tanpa memperluas maknanya menjadi 'yang terbaik'.
- source_word: אַדְמָתְךָ
  choice: tanahmu
  rationale: Merujuk pada tanah garapan yang menghasilkan panen; 'tanahmu' konkret dan alami dalam konteks pertanian.
- source_word: תָּבִיא
  choice: Bawalah
  rationale: Bentuk imperatif Indonesia menyampaikan daya perintah dari bentuk hukum Ibrani secara lugas dan wajar.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: rumah Yahweh, Allahmu
  rationale: Menerjemahkan בֵּית secara harfiah sebagai 'rumah' dan mempertahankan nama ilahi Yahweh; 'bait' dapat menyiratkan bangunan yang lebih khusus.
- source_word: לֹא תְבַשֵּׁל
  choice: Janganlah merebus
  rationale: בשל dalam konteks ini paling tepat dinyatakan dengan 'merebus'; 'janganlah' mempertahankan ragam hukum yang bermartabat.
- source_word: גְּדִי
  choice: anak kambing
  rationale: Padanan Indonesia modern yang jelas bagi kambing yang masih muda.
- source_word: בַּחֲלֵב אִמּוֹ
  choice: dalam susu induknya
  rationale: Ungkapan alami dalam bahasa Indonesia yang mempertahankan gambaran harfiah dan hubungan hewan dengan induknya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memuat nama diri ilahi YHWH; 'Yahweh' mempertahankannya sebagai nama, bukan menggantinya dengan gelar.
- issue: Makna רֵאשִׁית dalam gabungan רֵאשִׁית בִּכּוּרֵי
  choice: bagian pertama dari hasil pertama
  alternative: yang terbaik dari hasil pertama
  rationale: Pilihan utama menjaga gagasan prioritas yang dinyatakan langsung oleh רֵאשִׁית dan tidak memastikan nuansa kualitas yang mungkin tersirat tetapi tidak eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bermartabat. Bentuk perintah 'Bawalah' dan larangan 'Janganlah' mempertahankan corak hukum perjanjian tanpa menjadi terlalu arkais.
