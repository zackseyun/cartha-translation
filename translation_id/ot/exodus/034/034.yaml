  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בְ/בֹ֨א מֹשֶׁ֜ה לִ/פְנֵ֤י יְהוָה֙ לְ/דַבֵּ֣ר אִתּ֔/וֹ יָסִ֥יר אֶת הַ/מַּסְוֶ֖ה עַד צֵאת֑/וֹ וְ/יָצָ֗א וְ/דִבֶּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל אֵ֖ת אֲשֶׁ֥ר יְצֻוֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/034.yaml
  text: But whenever Moses went in before Yahweh to speak with him[a], he would remove the veil until he came out; then he would come out and speak to the sons of Israel what he had been commanded.
translation:
  language: id
  text: Namun, setiap kali Musa masuk menghadap Yahweh untuk berbicara dengan-Nya, ia menanggalkan selubung itu sampai ia keluar. Kemudian ia keluar dan menyampaikan kepada orang Israel[a] apa yang diperintahkan kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “umat Israel.” Secara harfiah, bahasa Ibrani berbunyi “anak-anak Israel.”
    reason: Menjelaskan bentuk harfiah dari בְּנֵי יִשְׂרָאֵל dan memberi padanan kolektif alternatif tanpa menyiratkan rujukan eksklusif kepada laki-laki.
lexical_decisions:
- source_word: וּבְבֹא מֹשֶׁה
  choice: Namun, setiap kali Musa masuk
  rationale: Konstruksi ב dengan infinitif menunjukkan keadaan yang berulang. “Setiap kali” menyampaikan aspek kebiasaan, sedangkan “namun” mempertahankan kontras ringan dengan ayat sebelumnya.
- source_word: לִפְנֵי יְהוָה
  choice: menghadap Yahweh
  rationale: לִפְנֵי berarti “di hadapan/ke hadapan.” Dalam konteks seseorang masuk untuk bertemu, “menghadap” alami dalam bahasa Indonesia dan tetap menyatakan kehadiran langsung. Nama perjanjian יְהוָה ditransliterasikan “Yahweh.”
- source_word: לְדַבֵּר אִתּוֹ
  choice: untuk berbicara dengan-Nya
  rationale: Infinitif menyatakan tujuan, dan אִתּוֹ mendukung nuansa berbicara “dengan” Dia, bukan sekadar menyampaikan sesuatu “kepada” Dia.
- source_word: יָסִיר אֶת־הַמַּסְוֶה
  choice: ia menanggalkan selubung itu
  rationale: Bentuk imperfek dalam kerangka berulang menyatakan kebiasaan. “Menanggalkan” tepat untuk melepas sesuatu yang dikenakan, dan “selubung” menunjuk penutup wajah Musa.
- source_word: עַד־צֵאתוֹ
  choice: sampai ia keluar
  rationale: 'Frasa ini menyatakan batas waktu: selubung tetap dilepas hingga Musa keluar.'
- source_word: וְיָצָא וְדִבֶּר
  choice: Kemudian ia keluar dan menyampaikan
  rationale: Rangkaian verba meneruskan urutan tindakan yang biasa dilakukan. “Menyampaikan” sesuai dengan konteks Musa meneruskan perintah yang diterimanya.
- source_word: אֶל־בְּנֵי יִשְׂרָאֵל
  choice: kepada bani Israel
  rationale: “Bani Israel” merupakan ungkapan Indonesia yang mapan dan cukup dekat dengan bentuk Ibrani “anak-anak lelaki Israel,” sambil secara idiomatis menunjuk komunitas Israel.
- source_word: אֵת אֲשֶׁר יְצֻוֶּה
  choice: apa yang diperintahkan kepadanya
  rationale: Bentuk pasif mempertahankan fokus teks pada perintah yang diterima Musa tanpa menambahkan subjek pelaku secara eksplisit.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian dan tidak menggantinya dengan gelar.
- issue: Cakupan ungkapan בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: orang Israel; umat Israel; anak-anak lelaki Israel
  rationale: Ungkapan ini secara harfiah berbentuk maskulin, tetapi secara idiomatis menamai komunitas keturunan Israel. “Bani Israel” mempertahankan bentuk tradisional yang dekat dengan sumber tanpa menyiratkan bahwa hanya laki-laki yang dimaksud.
- issue: Pelaku dalam bentuk pasif יְצֻוֶּה
  choice: tidak disebutkan secara eksplisit
  alternative: apa yang diperintahkan Yahweh kepadanya
  rationale: Konteks menunjukkan bahwa Yahweh adalah pemberi perintah, tetapi bentuk Ibrani sendiri pasif dan tidak menyebut pelaku. Terjemahan mempertahankan ketidaktersuratan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur dua kalimat menghindari rangkaian klausa yang terlalu panjang, sedangkan pola “setiap kali” mempertahankan sifat tindakan yang berulang.
