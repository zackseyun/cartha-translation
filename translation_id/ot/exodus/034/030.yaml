  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֨רְא אַהֲרֹ֜ן וְ/כָל בְּנֵ֤י יִשְׂרָאֵל֙ אֶת מֹשֶׁ֔ה וְ/הִנֵּ֥ה קָרַ֖ן ע֣וֹר פָּנָ֑י/ו וַ/יִּֽירְא֖וּ מִ/גֶּ֥שֶׁת אֵלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/030.yaml
  text: When Aaron and all the sons of Israel saw Moses[a], behold, the skin of his face was radiant, and they were afraid to come near him.
translation:
  language: id
  text: Ketika Harun dan semua bani Israel melihat Musa, tampaklah bahwa kulit wajahnya bercahaya[a], sehingga mereka takut mendekatinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersinar” atau “memancarkan sinar”. Verba Ibrani ini jarang dipakai dan dalam sejarah juga pernah diterjemahkan “bertanduk”, tetapi konteksnya lebih mendukung makna pancaran cahaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: melihat
  rationale: Bentuk naratif dari ראה paling wajar diterjemahkan dengan verba umum 'melihat'.
- source_word: וְכָל בְּנֵי יִשְׂרָאֵל
  choice: dan semua bani Israel
  rationale: '''Bani Israel'' mempertahankan ungkapan kekerabatan Ibrani sekaligus merupakan sebutan kolektif yang dikenal dan wajar dalam bahasa Indonesia.'
- source_word: וְהִנֵּה
  choice: tampaklah bahwa
  rationale: Ungkapan ini menyampaikan perhatian mendadak terhadap keadaan yang terlihat, dengan gaya naratif Indonesia yang lebih alami daripada terjemahan harfiah 'lihatlah'.
- source_word: קָרַן
  choice: bercahaya
  rationale: Dalam konteks ini verba langka tersebut menunjuk pada keluarnya sinar atau pancaran dari kulit wajah Musa; 'bercahaya' jelas dan alami tanpa menentukan secara berlebihan bentuk pancarannya.
- source_word: עוֹר פָּנָיו
  choice: kulit wajahnya
  rationale: Terjemahan ini mempertahankan unsur konkret עוֹר, 'kulit', yang dinyatakan secara eksplisit dalam bahasa Ibrani.
- source_word: וַיִּירְאוּ
  choice: mereka takut
  rationale: Ungkapan ini secara langsung dan alami menyatakan reaksi ketakutan mereka.
- source_word: מִגֶּשֶׁת אֵלָיו
  choice: mendekatinya
  rationale: Konstruksi מִן dengan infinitif menyatakan bahwa ketakutan menahan mereka dari mendekati Musa; dalam bahasa Indonesia makna itu tersampaikan secara idiomatis oleh 'takut mendekatinya'.
theological_decisions:
- issue: Penerjemahan בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: orang Israel; anak-anak Israel
  rationale: '''Bani Israel'' mempertahankan citra keturunan atau ikatan keluarga dalam sebutan Ibrani, tetapi dalam pemakaian Indonesia tetap dapat menunjuk kepada umat Israel secara kolektif tanpa menyiratkan bahwa hanya laki-laki yang hadir.'
- issue: Makna קָרַן pada kulit wajah Musa
  choice: bercahaya
  alternative: bersinar; memancarkan sinar; bertanduk
  rationale: Konteks perjumpaan Musa dengan TUHAN dan ketakutan umat mendukung makna pancaran cahaya. Hubungan leksikal dengan kata 'tanduk' telah menghasilkan terjemahan historis 'bertanduk', tetapi konteks ini tidak mendukung tanduk harfiah; alternatif itu tetap dicatat untuk menjaga sejarah ambiguitas leksikal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami bagi pembaca umum; 'tampaklah bahwa' mempertahankan daya penunjuk וְהִנֵּה, sedangkan 'bani Israel' mempertahankan corak kekerabatan sumber tanpa terdengar janggal.
