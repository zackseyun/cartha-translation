id: EXO.34.2
reference: Exodus 34:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וֶ/הְיֵ֥ה נָכ֖וֹן לַ/בֹּ֑קֶר וְ/עָלִ֤יתָ בַ/בֹּ֨קֶר֙ אֶל הַ֣ר סִינַ֔י וְ/נִצַּבְתָּ֥ לִ֛/י שָׁ֖ם עַל רֹ֥אשׁ הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/002.yaml
  text: And be ready by the morning[b][a], and in the morning come up to Mount Sinai and present yourself there to me on the top of the mountain.
translation:
  language: id
  text: Hendaklah engkau sudah siap saat pagi tiba. Pada pagi hari, naiklah ke Gunung Sinai dan berdirilah di sana di hadapan-Ku[a], di puncak gunung itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “berdirilah di sana bagi-Ku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהְיֵה נָכוֹן לַבֹּקֶר
  choice: Hendaklah engkau sudah siap saat pagi tiba
  rationale: Ungkapan perintah ini menyatakan bahwa Musa harus berada dalam keadaan siap ketika pagi tiba. Bentuk ini alami dalam bahasa Indonesia dan tetap membedakan frasa tersebut dari keterangan waktu pada perintah berikutnya.
- source_word: וְעָלִיתָ
  choice: naiklah
  rationale: Kata kerja ini berarti naik atau mendaki. Pilihan 'naiklah' alami untuk gerak menuju gunung dan tidak memaksakan orientasi 'datang' atau 'pergi' yang tidak perlu dibedakan dalam bahasa Indonesia.
- source_word: בַבֹּקֶר
  choice: Pada pagi hari
  rationale: Frasa ini menunjukkan waktu Musa harus naik dan dipertahankan terpisah dari tuntutan untuk sudah siap saat pagi tiba.
- source_word: אֶל הַר סִינַי
  choice: ke Gunung Sinai
  rationale: Ini adalah bentuk nama tempat yang lazim dan jelas dalam bahasa Indonesia modern.
- source_word: וְנִצַּבְתָּ לִי שָׁם
  choice: berdirilah di sana di hadapan-Ku
  rationale: Bentuk Niphal dari נצב menyatakan berdiri atau mengambil tempat. Dalam konteks perjumpaan dengan Allah, 'di hadapan-Ku' menyampaikan fungsi לִי secara alami tanpa menghilangkan tindakan berdiri.
- source_word: עַל רֹאשׁ הָהָר
  choice: di puncak gunung itu
  rationale: רֹאשׁ secara topografis berarti bagian teratas atau puncak; 'di puncak' merupakan ungkapan Indonesia yang alami.
theological_decisions:
- issue: Orientasi gerak dalam וְעָלִיתָ
  choice: naiklah
  alternative: datanglah naik / pergilah naik
  rationale: Bahasa Ibrani menyatakan gerak naik tanpa harus menetapkan orientasi deiktis. 'Naiklah' mempertahankan keterbukaan itu dan tidak menambahkan penafsiran tentang posisi pembicara.
- issue: Makna relasional לִי setelah וְנִצַּבְתָּ
  choice: di hadapan-Ku
  alternative: bagi-Ku / kepada-Ku
  rationale: Konstruksi ini dapat dipahami secara harfiah sebagai berdiri 'bagi-Ku' atau 'kepada-Ku', tetapi dalam konteks pemanggilan Musa untuk menghadap Allah, 'di hadapan-Ku' adalah padanan Indonesia yang jelas. Catatan kaki mempertahankan bentuk yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Sapaan tunggal 'engkau' dipakai untuk Musa, sedangkan huruf kapital pada '-Ku' menandai pembicara ilahi menurut kebiasaan penerbitan Alkitab bahasa Indonesia. Pengulangan 'pagi' dipertahankan karena mencerminkan dua frasa berbeda dalam teks Ibrani.
