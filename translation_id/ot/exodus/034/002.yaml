  source_fidelity: 'Teks Indonesia dengan setia menyampaikan urutan dan isi Ibrani: Musa harus sudah siap untuk pagi hari, kemudian pada pagi hari naik ke Gunung Sinai dan mengambil tempat di hadapan Allah di puncak gunung. Pengulangan dua keterangan waktu pagi dipertahankan. "Naiklah" secara tepat mempertahankan makna עלה tanpa memaksakan nuansa deiktis "datang" atau "pergi".'
