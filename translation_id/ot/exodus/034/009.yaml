  text: וַ/יֹּ֡אמֶר אִם נָא֩ מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ אֲדֹנָ֔/י יֵֽלֶךְ נָ֥א אֲדֹנָ֖/י בְּ/קִרְבֵּ֑/נוּ כִּ֤י עַם קְשֵׁה עֹ֨רֶף֙ ה֔וּא וְ/סָלַחְתָּ֛ לַ/עֲוֺנֵ֥/נוּ וּ/לְ/חַטָּאתֵ֖/נוּ וּ/נְחַלְתָּֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/009.yaml
  text: And he said[a], “If now I have found favor in your eyes, Lord, please let the Lord go in our midst, though it is a stiff-necked people; and forgive our iniquity and our sin[b], and take us as your inheritance.”
translation:
  language: id
  text: Lalu ia berkata, “Jika aku telah mendapat perkenanan di mata-Mu, ya Tuhan, kiranya Tuhan berjalan di tengah-tengah kami[a], sekalipun bangsa ini tegar tengkuk. Ampunilah kesalahan dan dosa kami, dan ambillah kami sebagai pusaka-Mu[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berjalan di tengah-tengah kami”; ungkapan ini juga dapat dipahami sebagai “berjalan di antara kami” atau “menyertai kami.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “jadikanlah kami milik-Mu.” Kata Ibrani ini dapat berarti mengambil atau menetapkan sebagai pusaka atau kepunyaan.
    reason: alternative_reading
lexical_decisions:
- source_word: חֵן בְּעֵינֶיךָ
  choice: mendapat perkenanan di mata-Mu
  rationale: Mempertahankan idiom Ibrani yang masih jelas dan wajar dalam bahasa Indonesia serta menyampaikan penerimaan relasional tanpa menambahkan muatan teologis yang tidak dinyatakan.
- source_word: אֲדֹנָי
  choice: Tuhan
  rationale: Bentuk ini merupakan gelar sapaan, bukan nama ilahi YHWH. Pengulangan “Tuhan” dipertahankan sesuai teks sumber.
- source_word: יֵלֶךְ נָא ... בְּקִרְבֵּנוּ
  choice: kiranya Tuhan berjalan di tengah-tengah kami
  rationale: “Kiranya” menyampaikan nuansa permohonan נָא, sedangkan “berjalan di tengah-tengah” mempertahankan gambaran gerak dan kehadiran dalam bahasa Ibrani.
- source_word: קְשֵׁה עֹרֶף
  choice: tegar tengkuk
  rationale: Ungkapan Indonesia ini mempertahankan metafora Ibrani tentang sikap keras kepala dan gema perjanjiannya dalam kitab Keluaran.
- source_word: עָוֹן
  choice: kesalahan
  rationale: Menyampaikan pelanggaran moral dengan bahasa Indonesia yang alami dan tetap membedakannya dari חַטָּאת, “dosa”.
- source_word: חַטָּאת
  choice: dosa
  rationale: Padanan langsung dan lazim yang sesuai dengan permohonan pengampunan.
- source_word: וּנְחַלְתָּנוּ
  choice: ambillah kami sebagai milik pusaka-Mu
  rationale: Mengungkapkan tindakan Tuhan mengambil Israel menjadi kepunyaan perjanjian-Nya, sambil mempertahankan unsur pusaka atau warisan dalam verba Ibrani.
theological_decisions:
- issue: Hubungan logis כִּי dengan ketegartengkukan bangsa itu
  choice: sekalipun bangsa ini tegar tengkuk
  alternative: karena bangsa ini tegar tengkuk
  rationale: Dalam konteks permohonan agar Tuhan tetap hadir, klausa ini paling mungkin bersifat konsesif. Namun kemungkinan kausal yang secara leksikal dimiliki כִּי tidak dihapus dan dicatat sebagai alternatif.
- issue: Gelar אֲדֹנָי dalam doa kepada YHWH
  choice: Tuhan
  alternative: Tuhanku
  rationale: Teks memakai gelar אֲדֹנָי, bukan nama YHWH. “Tuhan” mempertahankan gelar tersebut tanpa mengubahnya menjadi bentuk khusus bagi nama ilahi; kemungkinan nuansa posesif tidak dibuat eksplisit.
- issue: Makna וּנְחַלְתָּנוּ
  choice: ambillah kami sebagai milik pusaka-Mu
  alternative: jadikanlah kami milik-Mu
  rationale: Pilihan utama mempertahankan gagasan umat sebagai pusaka atau kepunyaan Tuhan tanpa mereduksinya sekadar menjadi kepemilikan umum.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pada pronomina yang merujuk kepada Tuhan mengikuti kebiasaan umum penerbitan Alkitab berbahasa Indonesia. Metafora “tegar tengkuk” dan pengulangan gelar “Tuhan” dipertahankan demi kedekatan pada bentuk serta ketegangan teks sumber.
