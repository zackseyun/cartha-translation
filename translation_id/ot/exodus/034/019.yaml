  text: כָּל פֶּ֥טֶר רֶ֖חֶם לִ֑/י וְ/כָֽל מִקְנְ/ךָ֙ תִּזָּכָ֔ר פֶּ֖טֶר שׁ֥וֹר וָ/שֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/019.yaml
  text: Every firstborn of the womb is mine[a], and every male firstborn among your livestock[c][b], whether ox or sheep.
translation:
  language: id
  text: Setiap anak sulung[a] adalah milik-Ku[b], demikian juga setiap anak sulung jantan dari ternakmu[c], baik lembu maupun domba.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “setiap yang membuka kandungan.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “adalah bagi-Ku.”
    reason: lexical_alternative
  - marker: c
    text: Teks Ibrani secara khusus menyebut anak sulung yang jantan di antara ternak.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל פֶּטֶר רֶחֶם
  choice: Setiap anak sulung
  rationale: Ungkapan Ibrani ini secara harfiah menunjuk pada setiap yang membuka kandungan, yaitu anak yang pertama lahir. “Setiap anak sulung” menyampaikan maknanya secara wajar dalam bahasa Indonesia, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: לִי
  choice: adalah milik-Ku
  rationale: Frasa berpreposisi ini menyatakan klaim kepunyaan Allah secara ringkas dan langsung.
- source_word: מִקְנְךָ
  choice: ternakmu
  rationale: Kata ini mencakup hewan piaraan berupa kawanan besar maupun kecil; “ternak” merupakan padanan Indonesia yang luas dan alami.
- source_word: תִּזָּכָר
  choice: jantan
  rationale: Dalam konteks hukum tentang anak sulung, bentuk ini menentukan jenis kelamin hewan yang dimaksud. Terjemahan “jantan” menghindari arti harfiah yang menyesatkan seperti “diingat”.
- source_word: פֶּטֶר שׁוֹר וָשֶׂה
  choice: anak sulung ... baik lembu maupun domba
  rationale: Frasa ini menjelaskan anak pertama dari jenis ternak yang disebutkan; susunan “baik ... maupun ...” terdengar alami dan mempertahankan cakupan kedua kategori tersebut.
theological_decisions:
- issue: Klaim kepunyaan ilahi atas anak sulung
  choice: Ayat ini menyatakan bahwa anak sulung adalah milik TUHAN.
  alternative: Menyatakan secara eksplisit bahwa semua yang disebut harus dipersembahkan atau dikurbankan.
  rationale: Teks Ibrani secara langsung menyatakan kepunyaan (“milik-Ku”), tetapi ayat ini sendiri tidak menguraikan cara pelaksanaan klaim tersebut. Terjemahan tidak menambahkan penjelasan teologis atau ritual yang tidak dinyatakan di sini.
- issue: Cakupan jenis kelamin pada ternak
  choice: Keterangan “jantan” diterapkan pada anak sulung dari ternak.
  alternative: Menerapkan keterangan “jantan” juga pada klausa pertama secara eksplisit.
  rationale: Kata תִּזָּכָר muncul dalam klausa tentang ternak. Terjemahan mempertahankan penempatannya dan tidak mempersempit klausa pertama melebihi yang dinyatakan dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Anak sulung” dipilih agar idiom Ibrani mudah dipahami pembaca umum; bentuk harfiahnya dipertahankan dalam catatan kaki. Kata ganti “-Ku” mengikuti kebiasaan penulisan untuk ujaran ilahi.
