  terminology: “Anak sulung,” “jantan,” “ternak,” “lembu,” dan “domba” konsisten dengan istilah Indonesia modern serta cakupan leksikal Ibrani. Catatan kaki a dan c berguna dan terjangkar tepat; catatan b secara memadai mencatat kemungkinan nuansa preposisi לִי tanpa mengubah makna utama.
