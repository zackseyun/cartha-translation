  source_fidelity: Terjemahan dengan tepat menyampaikan כָּל פֶּטֶר רֶחֶם לִי sebagai “Setiap anak sulung adalah milik-Ku.” Istilah “anak sulung” merupakan pengungkapan idiomatis yang setia untuk “yang membuka kandungan,” dan catatan kaki mempertahankan bentuk harfiahnya. Klausa kedua dengan tepat membatasi yang dimaksud pada ternak jantan serta mempertahankan penyebutan lembu dan domba. Tidak ada penambahan tuntutan ritual atau penafsiran teologis di luar klaim kepunyaan yang dinyatakan teks.
