  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/רֶ֤דֶת מֹשֶׁה֙ מֵ/הַ֣ר סִינַ֔י וּ/שְׁנֵ֨י לֻחֹ֤ת הָֽ/עֵדֻת֙ בְּ/יַד מֹשֶׁ֔ה בְּ/רִדְתּ֖/וֹ מִן הָ/הָ֑ר וּ/מֹשֶׁ֣ה לֹֽא יָדַ֗ע כִּ֥י קָרַ֛ן ע֥וֹר פָּנָ֖י/ו בְּ/דַבְּר֥/וֹ אִתּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/029.yaml
  text: And it happened[a], when Moses came down from Mount Sinai with the two tablets of the testimony in Moses' hand as he came down from the mountain[c][b], that Moses did not know that the skin of his face shone because he had spoken with him.
translation:
  language: id
  text: Ketika Musa turun dari Gunung Sinai dengan kedua loh kesaksian di tangannya—ketika ia turun dari gunung itu—Musa tidak tahu bahwa kulit wajahnya memancarkan sinar[a] ketika ia berbicara dengan-Nya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bercahaya” atau “mengeluarkan sinar”. Secara historis kata Ibrani ini juga pernah diterjemahkan “bertanduk”, tetapi makna itu kurang sesuai dengan konteks.
    reason: lexical_alternative
  - marker: b
    text: '“-Nya” merujuk kepada TUHAN. Frasa ini juga dapat dipahami secara kausal: “karena ia telah berbicara dengan-Nya”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי בְּרֶדֶת
  choice: Ketika ... turun
  rationale: Dalam konteks naratif ini, וַיְהִי diikuti konstruksi temporal secara alami dinyatakan dengan 'ketika' dalam bahasa Indonesia; tidak perlu diterjemahkan secara mekanis sebagai 'terjadilah'.
- source_word: בְּרֶדֶת ... בְּרִדְתּוֹ
  choice: Ketika Musa turun ... ketika ia turun
  rationale: Kedua konstruksi infinitif menandai latar waktu. Pengulangannya dipertahankan, tetapi yang kedua memakai pronomina agar alami dalam bahasa Indonesia.
- source_word: מֵהַר סִינַי
  choice: dari Gunung Sinai
  rationale: Padanan baku dan alami bagi nama tempat tersebut.
- source_word: שְׁנֵי לֻחֹת הָעֵדֻת
  choice: kedua loh kesaksian
  rationale: '''Loh'' lazim untuk lempeng batu dalam konteks ini, sedangkan ''kesaksian'' mempertahankan istilah perjanjian עֵדוּת tanpa mempersempit maknanya menjadi tafsiran tertentu.'
- source_word: בְּיַד מֹשֶׁה
  choice: di tangannya
  rationale: Mengikuti bentuk tunggal Ibrani dan mempertahankan gambaran konkret, sambil menghindari pengulangan nama Musa yang terasa kaku dalam bahasa Indonesia.
- source_word: לֹא יָדַע
  choice: tidak tahu
  rationale: Padanan langsung, jelas, dan alami.
- source_word: קָרַן
  choice: memancarkan sinar
  rationale: Verba ini dalam konteks tersebut menyatakan keluarnya sinar atau pancaran. Pilihan ini lebih konkret daripada 'bercahaya' dan tidak menimbulkan gambaran fisik 'bertanduk' yang kurang sesuai dengan konteks.
- source_word: עוֹר פָּנָיו
  choice: kulit wajahnya
  rationale: Mempertahankan penyebutan eksplisit עוֹר, 'kulit', bukan menyederhanakannya menjadi 'wajahnya' saja.
- source_word: בְּדַבְּרוֹ אִתּוֹ
  choice: karena Dia telah berbicara dengannya
  rationale: ב dengan infinitif dapat dipahami secara kausal atau temporal. Teks utama memakai hubungan kausal yang paling wajar dalam konteks, sedangkan kemungkinan temporal dicatat dalam catatan kaki.
- source_word: אִתּוֹ
  choice: dengannya
  rationale: Pronomina dipertahankan. Subjek tersirat dari 'berbicara' dijelaskan sebagai 'Dia' karena konteks menunjuk kepada TUHAN, sementara catatan kaki menyatakan rujukannya.
theological_decisions:
- issue: Makna קָרַן pada wajah Musa
  choice: memancarkan sinar
  alternative: bercahaya; mengeluarkan sinar; bertanduk
  rationale: Konteks kemuliaan yang tampak pada Musa mendukung makna pancaran sinar. Alternatif historis 'bertanduk' berasal dari hubungan leksikal dengan kata benda 'tanduk', tetapi kurang cocok dengan konteks ini.
- issue: Hubungan semantis בְּדַבְּרוֹ
  choice: 'kausal: ''karena Dia telah berbicara dengannya'''
  alternative: 'temporal: ''ketika Dia berbicara dengannya'''
  rationale: Konstruksi Ibrani memungkinkan kedua nuansa. Hubungan kausal paling alami dalam alur ini, tetapi ambiguitas aslinya dijaga melalui catatan kaki.
- issue: Rujukan pelaku dalam בְּדַבְּרוֹ אִתּוֹ
  choice: '''Dia'' merujuk kepada TUHAN, sedangkan objek tetap pronominal (''dengannya'')'
  alternative: menyebut 'TUHAN' secara eksplisit dalam teks utama
  rationale: Bahasa Ibrani memakai pronomina dan konteks sebelumnya menunjukkan bahwa pelakunya adalah TUHAN. Kapitalisasi 'Dia' membantu pembaca Indonesia tanpa memasukkan nama ilahi ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda pisah menandai pengulangan temporal Ibrani tanpa membuat kalimat sulit diikuti. Kapitalisasi 'Dia' dipakai untuk memperjelas rujukan ilahi dalam kebiasaan penulisan Indonesia, sementara catatan kaki menjaga transparansi tekstual.
