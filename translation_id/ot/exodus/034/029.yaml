revisions:
- from: Ketika Musa turun dari Gunung Sinai dengan kedua loh kesaksian di tangannya—ketika ia turun dari gunung itu—Musa tidak tahu bahwa kulit wajahnya memancarkan sinar[a] karena Dia telah berbicara dengannya.[b]
  to: Ketika Musa turun dari Gunung Sinai dengan kedua loh kesaksian di tangannya—ketika ia turun dari gunung itu—Musa tidak tahu bahwa kulit wajahnya memancarkan sinar[a] ketika ia berbicara dengan-Nya.[b]
  rationale: Revisi memulihkan Musa sebagai subjek dari “berbicara” dan TUHAN sebagai rujukan pronomina setelah “dengan,” sesuai sintaks Ibrani. Terjemahan utama memakai “ketika” untuk mempertahankan nuansa temporal konstruksi בְּדַבְּרוֹ, sementara pembacaan kausal tetap tersedia dalam catatan kaki. Semua unsur pokok lain, termasuk pengulangan turunnya Musa, istilah “loh kesaksian,” dan penyebutan eksplisit “kulit wajahnya,” dipertahankan.
