language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/רָא֤וּ בְנֵֽי יִשְׂרָאֵל֙ אֶת פְּנֵ֣י מֹשֶׁ֔ה כִּ֣י קָרַ֔ן ע֖וֹר פְּנֵ֣י מֹשֶׁ֑ה וְ/הֵשִׁ֨יב מֹשֶׁ֤ה אֶת הַ/מַּסְוֶה֙ עַל פָּנָ֔י/ו עַד בֹּא֖/וֹ לְ/דַבֵּ֥ר אִתּֽ/וֹ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/035.yaml
  text: And the sons of Israel saw Moses’ face[a], that the skin of Moses’ face shone[c][b]; and Moses would put the veil back over his face until he went in to speak with him.
translation:
  language: id
  text: Orang Israel melihat wajah Musa dan melihat bahwa kulit wajahnya bercahaya.[a] Lalu Musa kembali mengenakan selubung pada wajahnya sampai ia masuk untuk berbicara dengan-Nya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “bercahaya” juga dapat berarti “memancarkan sinar.”
    reason: lexical_alternative
  - marker: b
    text: “Dengan-Nya” merujuk kepada TUHAN dalam konteks langsung (ayat 34).
    reason: cross_reference
lexical_decisions:
- source_word: וְרָאוּ
  choice: melihat
  rationale: Bentuk wayyiqtol melanjutkan rangkaian naratif, tetapi konteks ayat 34–35 merangkum tindakan yang berulang; bahasa Indonesia tidak memerlukan penanda habitual khusus di sini.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Orang Israel
  rationale: Ungkapan ini alami dalam bahasa Indonesia modern dan mencakup umat Israel secara kolektif; terjemahan harfiah 'anak-anak lelaki Israel' dapat keliru dipahami sebagai hanya laki-laki muda.
- source_word: פְּנֵי מֹשֶׁה
  choice: wajah Musa
  rationale: Bentuk milik alami dalam bahasa Indonesia yang mempertahankan acuan konkret kepada wajah Musa.
- source_word: כִּי
  choice: dan melihat bahwa
  rationale: כִּי memperkenalkan isi yang mereka amati. Pengulangan 'melihat' membuat hubungan sintaksis jelas dan wajar dalam bahasa Indonesia tanpa mengubah makna.
- source_word: קָרַן
  choice: bercahaya
  rationale: Kata kerja ini menyatakan bahwa cahaya atau sinar terpancar; 'bercahaya' jelas, alami, dan tidak mengikuti salah pengertian lama 'bertanduk'.
- source_word: עוֹר פְּנֵי מֹשֶׁה
  choice: kulit wajahnya
  rationale: עוֹר secara khusus berarti 'kulit'. Sufiks Indonesia menghindari pengulangan nama Musa yang kaku sambil tetap mempertahankan ketepatan ungkapan.
- source_word: וְהֵשִׁיב
  choice: kembali mengenakan
  rationale: Bentuk Hifil dari שוב berarti mengembalikan atau memasang kembali. Dalam konteks selubung wajah, 'kembali mengenakan' merupakan ungkapan Indonesia yang alami dan menyampaikan tindakan berulang.
- source_word: הַמַּסְוֶה
  choice: selubung
  rationale: '''Selubung'' cocok untuk penutup wajah dan bernada wajar serta bermartabat; ''topeng'' membawa asosiasi modern yang tidak diperlukan.'
- source_word: עַל־פָּנָיו
  choice: pada wajahnya
  rationale: Ungkapan ini secara alami menyatakan letak selubung sebagai penutup wajah.
- source_word: עַד בֹּאוֹ
  choice: sampai ia masuk
  rationale: Konstruksi ini menandai batas waktu tindakan, yaitu sampai Musa masuk kembali ke hadirat TUHAN.
- source_word: לְדַבֵּר אִתּוֹ
  choice: untuk berbicara dengan-Nya
  rationale: Pronomina Ibrani dipertahankan. Huruf kapital mengikuti kebiasaan ejaan Alkitab Indonesia untuk pronomina yang merujuk kepada Allah, sedangkan catatan kaki menjelaskan acuannya.
theological_decisions:
- issue: Acuan pronomina dalam לְדַבֵּר אִתּוֹ
  choice: Mempertahankan pronomina 'dengan-Nya' dalam teks utama.
  alternative: Menerjemahkan secara eksplisit 'dengan TUHAN'.
  rationale: Teks Ibrani memakai pronomina, dan konteks langsung ayat 34 menunjukkan bahwa acuannya adalah TUHAN. Mempertahankan pronomina menjaga bentuk sumber tanpa menyisipkan nama ilahi ke dalam ayat.
- issue: Sifat cahaya pada wajah Musa
  choice: Menerjemahkan קָרַן sebagai 'bercahaya'.
  alternative: Memakai 'memancarkan sinar' atau salah pengertian tradisional 'bertanduk'.
  rationale: Makna dalam konteks ialah pancaran cahaya. 'Bercahaya' mempertahankan gambaran itu tanpa berspekulasi tentang mekanisme atau bentuk sinarnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sambil mempertahankan penyebutan khusus 'kulit wajah' dan pronomina sumber. Tindakan yang bersifat kebiasaan dipahami dari konteks rangkuman ayat 34–35, tanpa menambahkan kata 'biasanya' yang tidak dinyatakan secara leksikal.
