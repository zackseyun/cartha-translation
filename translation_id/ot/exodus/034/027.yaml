  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה כְּתָב לְ/ךָ֖ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֑לֶּה כִּ֞י עַל פִּ֣י הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה כָּרַ֧תִּי אִתְּ/ךָ֛ בְּרִ֖ית וְ/אֶת יִשְׂרָאֵֽל־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/027.yaml
  text: Then Yahweh said to Moses[a], “Write these words for yourself, for according to these words I have made a covenant with you and with Israel.”
translation:
  language: id
  text: Kemudian Yahweh berfirman kepada Musa, “Tuliskanlah kata-kata ini untukmu, sebab sesuai dengan kata-kata ini Aku telah mengadakan perjanjian[a] dengan engkau dan dengan Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani secara harfiah: “memotong perjanjian.”'
    reason: Menjelaskan idiom Ibrani כּרת ברית, yang secara harfiah memakai kata “memotong” tetapi berarti mengadakan atau menetapkan perjanjian.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama diri ilahi yang terdapat dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: וַיֹּאמֶר
  choice: berfirman
  rationale: Dalam bahasa Indonesia, “berfirman” merupakan padanan yang alami dan bermartabat ketika Allah memperkenalkan ucapan langsung.
- source_word: כְּתָב לְךָ
  choice: Tuliskanlah ... untukmu
  rationale: “Tuliskanlah” menyampaikan imperatif langsung, sedangkan “untukmu” mempertahankan datif לְךָ tanpa membuat kalimat terlalu kaku.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: kata-kata ini
  rationale: Dalam konteks perintah untuk menulis, דְּבָרִים secara wajar berarti kata-kata; pilihan ini juga memungkinkan pengulangan istilah sumber dipertahankan.
- source_word: כִּי עַל פִּי הַדְּבָרִים הָאֵלֶּה
  choice: sebab berdasarkan kata-kata inilah
  rationale: “Sebab” menyatakan hubungan alasan, sementara “berdasarkan” menyampaikan makna idiom עַל־פִּי sebagai dasar atau kesesuaian. Partikel “-lah” menandai penekanan pada kata-kata tersebut.
- source_word: כָּרַתִּי ... בְּרִית
  choice: Aku telah mengikat perjanjian
  rationale: “Mengikat perjanjian” adalah ungkapan Indonesia yang alami bagi tindakan menetapkan perjanjian, sekaligus lebih dekat kepada citra idiom Ibrani daripada sekadar “membuat”; bentuk “telah” menyatakan tindakan yang sudah terlaksana dan tetap relevan.
- source_word: אִתְּךָ ... וְאֶת יִשְׂרָאֵל
  choice: dengan engkau dan dengan Israel
  rationale: Pengulangan “dengan” memperjelas bahwa Musa dan Israel sama-sama tercakup sebagai pihak dalam perjanjian. “Engkau” dipilih untuk ragam langsung yang bermartabat.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Transliterasi “Yahweh” mempertahankan nama pribadi dalam teks sumber dan menghindari penggantian nama itu dengan gelar.
- issue: Makna idiom perjanjian כָּרַתִּי ... בְּרִית
  choice: Aku telah mengikat perjanjian
  alternative: Aku telah membuat perjanjian; secara harfiah, Aku telah memotong perjanjian
  rationale: “Mengikat perjanjian” menyampaikan makna idiom secara alami dalam bahasa Indonesia, sedangkan bentuk harfiahnya dicatat dalam catatan kaki agar citra bahasa sumber tidak hilang.
- issue: Lingkup frasa “dengan engkau dan dengan Israel”
  choice: Musa dan Israel sama-sama disebut dalam rumusan perjanjian
  alternative: Menganggap “engkau” semata-mata mewakili Israel
  rationale: Terjemahan mempertahankan kedua unsur sebagaimana tertulis dan tidak menentukan lebih jauh hubungan teologis antara peran Musa dan Israel.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “kata-kata” dan “dengan” dipertahankan untuk mencerminkan struktur teks Ibrani, sementara susunan keseluruhan dibuat alami bagi pembaca umum.
