  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי אוֹרִ֤ישׁ גּוֹיִם֙ מִ/פָּנֶ֔י/ךָ וְ/הִרְחַבְתִּ֖י אֶת גְּבוּלֶ֑/ךָ וְ/לֹא יַחְמֹ֥ד אִישׁ֙ אֶֽת אַרְצְ/ךָ֔ בַּ/עֲלֹֽתְ/ךָ֗ לֵ/רָאוֹת֙ אֶת פְּנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ שָׁלֹ֥שׁ פְּעָמִ֖ים בַּ/שָּׁנָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/024.yaml
  text: For I will drive out nations from before you and enlarge your border[c][b][a], and no man will covet your land when you go up to appear before Yahweh your God three times in the year.
translation:
  language: id
  text: Sebab Aku akan menghalau bangsa-bangsa dari hadapanmu dan memperluas wilayahmu. Tidak seorang pun[a] akan mengingini negerimu ketika engkau naik untuk menghadap[b] Yahweh, Allahmu, tiga kali setahun.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani memakai nomina maskulin tunggal, secara harfiah “seorang laki-laki”, dengan cakupan representatif. Dalam konteksnya, tidak seorang pun akan mengincar negeri itu ketika kaum laki-laki Israel pergi merayakan perayaan ziarah.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “melihat wajah Yahweh, Allahmu.” Ungkapan ini dapat diterjemahkan “tampil di hadapan Yahweh”; dalam konteks ini artinya datang menghadap-Nya dalam ibadah.
    reason: lexical_alternative
  - marker: c
    text: Atau “tiga kali dalam setahun”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini menjelaskan dasar bagi perintah sebelumnya tentang perayaan ziarah.
- source_word: אוֹרִישׁ
  choice: Aku akan menghalau
  rationale: Bentuk Hifil dari ירשׁ di sini menyatakan bahwa Allah akan menyingkirkan bangsa-bangsa dari hadapan Israel.
- source_word: גּוֹיִם
  choice: bangsa-bangsa
  rationale: Dalam konteks tanah dan penaklukan, kata ini menunjuk kepada kelompok-kelompok bangsa yang mendiami wilayah tersebut.
- source_word: מִפָּנֶיךָ
  choice: dari hadapanmu
  rationale: Mempertahankan gambaran idiomatis Ibrani tentang penyingkiran dari hadapan atau jalan Israel.
- source_word: וְהִרְחַבְתִּי אֶת־גְּבוּלֶךָ
  choice: dan memperluas wilayahmu
  rationale: גְּבוּל dapat berarti batas maupun wilayah; dalam bahasa Indonesia, 'memperluas wilayahmu' lebih alami daripada 'memperluas batasmu' dan tetap menyampaikan perluasan teritorial.
- source_word: לֹא יַחְמֹד
  choice: tidak ... akan mengingini
  rationale: חמד menyatakan hasrat terhadap milik orang lain, seperti dalam larangan mengingini; pilihan ini mempertahankan kaitan leksikal tersebut.
- source_word: אִישׁ
  choice: seorang pun
  rationale: Nomina maskulin tunggal ini dipakai secara representatif. Ungkapan 'tidak seorang pun' menyampaikan cakupan generiknya secara alami tanpa menghilangkan informasi bentuk sumber, yang dijelaskan dalam catatan kaki.
- source_word: אַרְצְךָ
  choice: negerimu
  rationale: Kata אֶרֶץ di sini menunjuk kepada tanah atau negeri milik Israel sebagai wilayah perjanjian.
- source_word: בַּעֲלֹתְךָ
  choice: ketika engkau pergi
  rationale: Secara harfiah berarti 'ketika engkau naik'; dalam konteks ziarah, maksudnya pergi ke tempat ibadah. Unsur tujuan dinyatakan oleh 'menghadap' sesudahnya.
- source_word: לֵרָאוֹת אֶת־פְּנֵי
  choice: menghadap
  rationale: Ungkapan ziarah ini berarti hadir atau tampil di hadapan Allah dalam ibadah; 'menghadap' ringkas, alami, dan tetap bernuansa hormat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama diri ilahi ditransliterasikan, bukan diganti dengan gelar.
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: tiga kali setahun
  rationale: Terjemahan idiomatis dan tepat untuk frekuensi tiga kali dalam satu tahun.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks sumber memakai nama ilahi secara langsung; 'Yahweh' mempertahankan nama pribadi itu tanpa menggantinya dengan gelar.
- issue: Nomina maskulin representatif אִישׁ
  choice: tidak seorang pun
  alternative: tidak ada laki-laki yang
  rationale: 'Walaupun bentuk Ibraninya maskulin tunggal, dalam klausa ini cakupannya representatif: tidak ada pihak yang akan mengingini negeri itu. Catatan kaki mempertahankan informasi gramatikal dan kaitannya dengan ziarah kaum laki-laki.'
- issue: Ungkapan לֵרָאוֹת אֶת־פְּנֵי יְהוָה
  choice: menghadap Yahweh
  alternative: melihat wajah Yahweh atau tampil di hadapan Yahweh
  rationale: Ungkapan ini berkaitan dengan kehadiran di hadapan Allah dalam ibadah. Terjemahan utama menyampaikan fungsi idiomatisnya, sedangkan catatan kaki menjaga bentuk dan kemungkinan nuansa ungkapan sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal 'engkau' kepada Israel dan gaya yang khidmat tetapi mudah dipahami. Susunan kalimat dibagi menjadi dua agar janji perlindungan terbaca jelas. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
