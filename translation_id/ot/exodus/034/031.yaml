base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/031.yaml
  text: But Moses called to them[a], and Aaron and all the leaders of the congregation returned to him, and Moses spoke to them.
translation:
  language: id
  text: Namun, Musa memanggil mereka. Lalu Harun dan semua pemimpin umat[a] kembali kepadanya, dan Musa berbicara kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semua kepala umat” atau “semua pemimpin komunitas itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֲלֵהֶם
  choice: Musa memanggil mereka
  rationale: קרא dengan אֶל menunjukkan bahwa Musa memanggil atau berseru kepada mereka. “Memanggil mereka” alami dalam bahasa Indonesia dan tidak memberi kesan perintah resmi sekuat “memerintahkan mereka datang”.
- source_word: וַיָּשֻׁבוּ אֵלָיו
  choice: kembali kepadanya
  rationale: שׁוב secara langsung berarti kembali. Ungkapan ini mempertahankan kaitan naratif bahwa mereka sebelumnya menjauh atau tidak berani mendekat.
- source_word: הַנְּשִׂאִים
  choice: pemimpin
  rationale: נָשִׂיא di sini menunjuk para tokoh yang memimpin umat. “Pemimpin” jelas, modern, dan tidak membawa nuansa kebangsawanan yang dapat timbul dari “pangeran”.
- source_word: בָּעֵדָה
  choice: umat
  rationale: עֵדָה menunjuk komunitas Israel sebagai perhimpunan bersama. “Umat” wajar dalam konteks Israel dan menghindari pembatasan makna “jemaat” pada perkumpulan ibadah atau gereja.
- source_word: וַיְדַבֵּר
  choice: berbicara
  rationale: דבר dalam bentuk piel adalah verba umum untuk menyampaikan perkataan. “Berbicara” mempertahankan makna tanpa menambahkan isi atau sifat pembicaraan.
- source_word: וַ
  choice: Namun / Lalu / dan
  rationale: 'Rangkaian waw diterjemahkan sesuai fungsi wacananya: “Namun” menampilkan kontras ringan dengan ketakutan pada ayat sebelumnya, “Lalu” melanjutkan urutan tindakan, dan “dan” menghubungkan tindakan terakhir secara alami.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat pertama dipisahkan agar urutan tindakan mudah dipahami. “Umat” dipilih untuk עֵדָה karena sesuai dengan komunitas Israel dalam konteks ini; penanda catatan ditempatkan langsung sesudah frasa yang diterangkannya.
