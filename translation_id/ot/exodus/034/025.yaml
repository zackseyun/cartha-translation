  text: You shall not slaughter the blood of my sacrifice with leaven[a], and the sacrifice of the feast of the Passover shall not remain until the morning.
translation:
  language: id
  text: Janganlah engkau menyembelih kurban-Ku dengan sesuatu yang beragi[a], dan kurban hari raya Paskah jangan dibiarkan sampai pagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Janganlah engkau menyembelih darah kurban-Ku bersama ragi.” Ungkapan Ibraninya padat dan dapat berarti “sementara sesuatu yang beragi masih ada” atau “bersama roti beragi.”'
    reason: Menjelaskan bentuk harfiah yang tidak wajar dalam bahasa Indonesia serta mempertahankan kemungkinan cakupan עַל חָמֵץ.
lexical_decisions:
- source_word: תִשְׁחַט
  choice: menyembelih
  rationale: Kata kerja שׁחט menunjuk pada penyembelihan, khususnya penyembelihan hewan dalam konteks kurban; “menyembelih” lebih tepat daripada “membunuh” dan tidak seluas “mempersembahkan”.
- source_word: עַל חָמֵץ
  choice: dengan sesuatu yang beragi
  rationale: Dalam larangan ibadah ini, עַל menyatakan keterkaitan atau kebersamaan. Ungkapan ini dibuat alami dalam bahasa Indonesia tanpa menentukan secara berlebihan apakah yang dimaksud ialah roti beragi atau keberadaan ragi secara umum.
- source_word: דַּם זִבְחִי
  choice: kurban bagi-Ku
  rationale: Secara harfiah frasa ini berbunyi “darah kurban-Ku”. Karena darah tidak lazim dikatakan “disembelih” dalam bahasa Indonesia, terjemahan utama menyampaikan tindakan penyembelihan kurban yang darahnya menjadi pokok aturan. Unsur kepunyaan ilahi dinyatakan secara alami dengan “bagi-Ku”.
- source_word: יָלִין לַבֹּקֶר
  choice: jangan dibiarkan sampai pagi
  rationale: Dalam konteks makanan atau bagian kurban, לין berarti dibiarkan tersisa sepanjang malam. “Sampai pagi” mempertahankan batas waktu yang dinyatakan teks tanpa pengulangan.
- source_word: זֶבַח חַג הַפָּסַח
  choice: kurban hari raya Paskah
  rationale: Rangkaian nomina Ibrani yang padat ini mempertahankan unsur kurban, hari raya, dan Paskah dalam susunan bahasa Indonesia yang wajar.
- source_word: הַפָּסַח
  choice: Paskah
  rationale: “Paskah” adalah istilah baku dalam Alkitab bahasa Indonesia untuk perayaan Israel ini dan tidak memerlukan transliterasi “Pesakh” dalam teks utama.
theological_decisions:
- issue: Istilah perayaan perjanjian tanpa memasukkan asosiasi doktrinal yang lebih kemudian
  choice: Paskah
  alternative: Pesakh
  rationale: “Paskah” mempertahankan hubungan kanonis yang lazim dikenal pembaca Indonesia, sedangkan ayat tetap berbicara tentang perayaan Israel dalam konteks hukum Musa tanpa menambahkan penafsiran teologis kemudian.
- issue: Hubungan sintaksis antara darah dan tindakan penyembelihan
  choice: menyembelih kurban bagi-Ku
  alternative: menyembelih darah kurban-Ku
  rationale: Bahasa Ibrani secara padat menempatkan “darah kurban-Ku” sesudah kata kerja “menyembelih”. Terjemahan utama menghindari ungkapan Indonesia yang tidak wajar seolah-olah darah itu sendiri disembelih, tanpa mengubah larangan tersebut menjadi tindakan ritual lain yang tidak disebutkan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk tunggal “engkau” dipertahankan karena kata kerja Ibrani berbentuk orang kedua tunggal. “Janganlah” sesuai untuk larangan perjanjian, sedangkan “dibiarkan sampai pagi” terdengar alami dalam ketentuan tentang sisa kurban.
