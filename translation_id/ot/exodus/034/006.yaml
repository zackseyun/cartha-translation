base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/006.yaml
  text: Then Yahweh passed before him and proclaimed[a], “Yahweh, Yahweh, a God compassionate and gracious, slow to anger, and abounding in steadfast love and faithfulness.”
translation:
  language: id
  text: Lalu Yahweh lewat di hadapannya dan berseru, “Yahweh, Yahweh, Allah yang berbelas kasih dan penuh kemurahan, lambat marah, serta berlimpah dalam kasih setia dan kesetiaan[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berlimpah dalam kasih setia dan kebenaran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: lewat
  rationale: Dalam konteks narasi ini, עבר menggambarkan gerakan melintasi atau melewati seseorang; “lewat di hadapannya” menyampaikan hubungan ruang secara alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, dan pengulangannya dipertahankan sesuai teks Ibrani.
- source_word: עַל־פָּנָיו
  choice: di hadapannya
  rationale: Ungkapan ini secara harfiah berkaitan dengan wajah atau bagian depan seseorang; “di hadapannya” merupakan padanan Indonesia yang wajar dan bermartabat.
- source_word: וַיִּקְרָא
  choice: menyerukan
  rationale: קרא di sini menunjuk pada pengucapan lantang dan khidmat dalam pernyataan diri ilahi; “menyerukan” mempertahankan daya ucap tersebut.
- source_word: אֵל
  choice: Allah
  rationale: אֵל berfungsi secara aposisional sesudah nama ilahi dan memperkenalkan sifat-sifat-Nya; dalam bahasa Indonesia, “Allah yang ...” menyampaikan fungsi ini secara alami tanpa menambahkan unsur pada rangkaian nama.
- source_word: רַחוּם
  choice: berbelas kasih
  rationale: רחום menyatakan belas kasih yang mendalam; pilihan ini jelas dan lazim dalam bahasa Indonesia modern.
- source_word: חַנּוּן
  choice: beranugerah
  rationale: חנון menyatakan sifat yang memberikan kemurahan atau anugerah. “Beranugerah” mempertahankan kaitannya dengan anugerah dan membedakannya dari רחום.
- source_word: אֶרֶךְ אַפַּיִם
  choice: lambat marah
  rationale: Idiom Ibrani yang secara harfiah berarti “panjang hidung” menunjuk pada sifat tidak lekas marah; “lambat marah” adalah padanan idiomatis yang langsung dan tepat.
- source_word: רַב
  choice: berlimpah
  rationale: Bersama nomina abstrak berikutnya, רַב menyatakan kelimpahan, bukan sekadar kebesaran.
- source_word: חֶסֶד
  choice: kasih setia
  rationale: חסד mencakup kasih, kebaikan, dan loyalitas yang teguh; “kasih setia” merupakan padanan ringkas yang mempertahankan unsur kasih dan keteguhan.
- source_word: אֱמֶת
  choice: kesetiaan
  rationale: Dalam pasangan חסד ואמת, kata ini menonjolkan keterandalan dan keteguhan karakter Allah. Arti leksikal “kebenaran” tetap dicatat dalam catatan kaki.
theological_decisions:
- issue: Pengulangan nama ilahi יְהוָה
  choice: Yahweh, Yahweh
  alternative: Tuhan Allah
  rationale: Teks Ibrani mengulang nama perjanjian itu dan baru kemudian memakai אֵל. Terjemahan mempertahankan pengulangan serta tidak memasukkan “Allah” ke dalam rangkaian nama.
- issue: Makna אֱמֶת dalam pasangan חֶסֶד וֶאֱמֶת
  choice: kesetiaan
  alternative: kebenaran
  rationale: “Kesetiaan” paling sesuai dengan nuansa keterandalan dalam uraian karakter Allah, tetapi “kebenaran” juga merupakan arti leksikal yang sah dan karena itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan atribut mengikuti alur Ibrani, sementara idiom diterjemahkan secara alami. Penanda catatan kaki ditempatkan langsung sesudah kata yang memiliki alternatif leksikal.
