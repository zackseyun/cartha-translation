  text: and you take some of his daughters for your sons[b][a], and his daughters prostitute themselves after their gods and make your sons prostitute themselves after their gods.
translation:
  language: id
  text: dan engkau mengambil beberapa anak perempuannya untuk anak-anak lelakimu, dan anak-anak perempuannya berzina mengikuti ilah-ilah mereka[a], serta membuat anak-anak lelakimu berzina mengikuti ilah-ilah mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melacurkan diri.” Bahasa Ibrani memakai bahasa perzinaan secara metaforis untuk mengikuti ilah-ilah lain.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, anak-anak perempuan itu akan menyeret anak-anak lelakimu ke dalam penyembahan berhala dengan membuat mereka mengikuti ilah-ilah mereka.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: lalu engkau mengambil
  rationale: Bentuk Qal dengan waw dalam rangkaian peringatan menyatakan akibat yang mungkin terjadi. Kata “mengambil” mempertahankan ungkapan sumber; konteksnya ialah mengambil perempuan untuk dijadikan istri bagi anak-anak lelaki.
- source_word: מִבְּנֹתָיו
  choice: beberapa anak perempuannya
  rationale: Preposisi מִן dipahami secara partitif, yaitu mengambil dari antara anak-anak perempuannya.
- source_word: לְבָנֶיךָ
  choice: untuk anak-anak lelakimu
  rationale: לְ menyatakan peruntukan dalam pengaturan perkawinan; penyebutan jenis kelamin dipertahankan sesuai teks Ibrani.
- source_word: וְזָנוּ ... אַחֲרֵי אֱלֹהֵיהֶן
  choice: anak-anak perempuannya berzina dengan mengikuti ilah-ilah mereka
  rationale: Kata זנה mempertahankan metafora seksual bagi ketidaksetiaan kultis, sedangkan אַחֲרֵי diungkapkan secara alami sebagai “dengan mengikuti” agar arah metaforanya jelas dalam bahasa Indonesia.
- source_word: וְהִזְנוּ אֶת־בָּנֶיךָ
  choice: serta membuat anak-anak lelakimu berzina
  rationale: 'Bentuk Hifil bersifat kausatif: para perempuan itu menyebabkan anak-anak lelaki Israel melakukan ketidaksetiaan kultis yang sama.'
- source_word: אֱלֹהֵיהֶן
  choice: ilah-ilah mereka
  rationale: Bentuknya jamak dengan sufiks feminin jamak dan menunjuk kepada dewa-dewa bangsa lain; “ilah-ilah” mempertahankan kontras dengan TUHAN.
theological_decisions:
- issue: Metafora זנה dalam konteks penyembahan berhala
  choice: berzina dengan mengikuti ilah-ilah mereka
  alternative: menyembah berhala / tidak setia
  rationale: Bahasa sumber sengaja memakai gambaran perzinaan untuk kemurtadan kultis. Terjemahan mempertahankan ketegangan dan daya teologis metafora itu tanpa mereduksinya menjadi penjelasan abstrak.
- issue: Bahasa bergender dalam בנותיו dan בניך
  choice: anak-anak perempuannya dan anak-anak lelakimu
  alternative: anak-anak mereka dan anak-anakmu
  rationale: Teks sumber secara khusus menyebut perempuan dan lelaki dalam konteks perkawinan; terjemahan mengikuti rincian tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. “Engkau” mempertahankan sapaan tunggal orang kedua. “Berzina” dipilih untuk menjaga metafora kuat dari teks Ibrani, sementara frasa “dengan mengikuti” membuat makna kultisnya dapat dipahami pembaca umum.
