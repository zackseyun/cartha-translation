  yaml_path: translation/ot/exodus/034/023.yaml
  text: Three times in the year all your males shall appear before the Lord Yahweh[b][a], the God of Israel.
translation:
  language: id
  text: Tiga kali dalam setahun, semua laki-laki di antaramu harus menghadap Tuhan Yahweh[a][b], Allah Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di hadapan wajah (seseorang).” Ini adalah ungkapan Ibrani yang berarti “di hadapan” atau “dalam kehadiran.”'
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani memakai dua sebutan yang berbeda: “Tuhan” (ha’adon) dan nama ilahi YHWH, yang di sini ditulis “Yahweh”. Terjemahan tradisional kadang memakai “Tuhan ALLAH”.'
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: Tiga kali dalam setahun
  rationale: Ungkapan ini menyatakan frekuensi dalam siklus tahunan. Bentuk ini alami dalam bahasa Indonesia dan tetap dekat dengan susunan Ibrani.
- source_word: יֵרָאֶה
  choice: harus menghadap
  rationale: Bentuk Niphal dari ראה di sini merupakan ungkapan peribadatan tentang hadir di hadapan Allah. Dalam bahasa Indonesia, “harus menghadap” secara alami menyampaikan kewajiban untuk datang dan hadir di hadapan-Nya, tanpa memakai bentuk pasif “harus terlihat” yang dapat menyesatkan.
- source_word: כָּל זְכוּרְךָ
  choice: semua laki-laki di antaramu
  rationale: זָכוּר secara khusus menunjuk kepada orang berjenis kelamin laki-laki. Terjemahan ini mempertahankan cakupan maskulin teks sekaligus lebih alami daripada “semua laki-lakimu”.
- source_word: אֶת פְּנֵי
  choice: menghadap
  rationale: Secara harfiah ungkapan ini berkaitan dengan “wajah” dan berarti berada di hadapan atau dalam hadirat seseorang. Digabungkan dengan verba sebelumnya, “menghadap” merupakan padanan Indonesia yang ringkas dan alami.
- source_word: הָאָדֹן
  choice: Tuhan
  rationale: Kata אָדוֹן dengan artikel berfungsi sebagai gelar ilahi. “Tuhan” adalah padanan Indonesia yang lazim dan tetap dibedakan dari nama ilahi yang menyusul.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga perbedaan antara הָאָדֹן dan יְהוָה tetap terlihat.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Rangkaian konstruksi ini mengidentifikasi Yahweh sebagai Allah Israel. “Allah Israel” adalah bentuk Indonesia yang baku, jelas, dan ringkas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה setelah gelar הָאָדֹן
  choice: Tuhan Yahweh
  alternative: Tuhan ALLAH; Tuhan, yaitu Yahweh; Penguasa Yahweh
  rationale: Teks Ibrani menempatkan gelar הָאָדֹן dan nama יְהוָה secara berurutan. “Tuhan Yahweh” mempertahankan keduanya tanpa melebur nama pribadi menjadi gelar atau menyisipkan hubungan penjelas yang tidak dinyatakan secara eksplisit.
- issue: Bahasa kewajiban yang secara khusus menyebut laki-laki
  choice: semua laki-laki di antaramu
  alternative: semua orang di antaramu; semua priamu
  rationale: Teks Ibrani secara eksplisit memakai istilah maskulin yang menunjuk kepada para laki-laki yang diwajibkan menghadiri perayaan ziarah. Terjemahan tidak memperluasnya menjadi semua orang.
- issue: Nuansa bentuk Niphal יֵרָאֶה
  choice: harus menghadap
  alternative: harus tampak; harus hadir di hadapan; harus memperlihatkan diri
  rationale: Bentuk Ibrani dapat secara formal dipahami sebagai “tampak/dilihat”, tetapi dalam konteks peribadatan ini berfungsi sebagai ungkapan untuk menghadap Allah. Pilihan utama menyampaikan fungsi tersebut, sedangkan kemungkinan bentuk harfiahnya dicatat tanpa membangun kesimpulan teologis tambahan.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. “Dalam setahun” serta “di antaramu” dipilih agar mudah dipahami pembaca umum. Urutan “Tuhan Yahweh” mempertahankan rangkaian gelar dan nama dalam teks Ibrani. Penanda catatan kaki [a] dan [b] ditempatkan langsung sesudah frasa yang diterangkan.
