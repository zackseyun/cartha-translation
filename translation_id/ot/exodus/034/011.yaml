base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/011.yaml
  text: Keep what I am commanding you today[a]. Behold, I am driving out before you the Amorites, the Canaanites, the Hittites, the Perizzites, the Hivites[b], and the Jebusites.
translation:
  language: id
  text: Indahkanlah apa yang Kuperintahkan kepadamu hari ini.[a] Sesungguhnya, Aku akan menghalau dari hadapanmu[b] orang Amori, Kanaan, Het, Feris, Hewi, dan Yebus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Peliharalah apa yang Kuperintahkan kepadamu hari ini” atau “Berhati-hatilah mengenai apa yang Kuperintahkan kepadamu hari ini.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani secara harfiah berarti “dari hadapanmu”, yakni menyingkirkan mereka dari depanmu atau dari kehadiranmu.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמָר לְךָ
  choice: Perhatikanlah
  rationale: Imperatif שׁמר dapat berarti menjaga, memelihara, atau memperhatikan dengan maksud menaatinya. Dalam konstruksi ini, “Perhatikanlah” terdengar wajar dalam bahasa Indonesia dan mempertahankan cakupan makna tanpa menambahkan kata “lakukanlah” yang tidak dinyatakan secara eksplisit.
- source_word: אֵת אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: apa yang Kuperintahkan kepadamu hari ini
  rationale: Menerjemahkan klausa relatif dan bentuk partisipial secara alami. Bentuk “Kuperintahkan” dapat menyampaikan perintah yang sedang diberikan dalam konteks ini.
- source_word: הִנְנִי
  choice: Sesungguhnya
  rationale: Menandai dan menegaskan tindakan ilahi yang segera atau pasti. “Sesungguhnya” mempertahankan nada khidmat tanpa memakai bentuk arkais yang kurang lazim.
- source_word: גֹרֵשׁ
  choice: Aku akan menghalau
  rationale: Partisipel sesudah הִנְנִי dapat menyatakan tindakan yang sudah di ambang pelaksanaan atau dipastikan. Bentuk mendatang paling alami dalam bahasa Indonesia untuk janji dalam konteks ini, sedangkan “menghalau” mempertahankan arti mengusir keluar.
- source_word: מִפָּנֶיךָ
  choice: dari hadapanmu
  rationale: Mempertahankan gambaran idiom Ibrani tentang penyingkiran dari depan atau hadapan Israel, sambil tetap dapat dipahami dalam bahasa Indonesia.
- source_word: הָאֱמֹרִי וְהַכְּנַעֲנִי וְהַחִתִּי וְהַפְּרִזִּי וְהַחִוִּי וְהַיְבוּסִי
  choice: orang Amori, Kanaan, Het, Feris, Hewi, dan Yebus
  rationale: Nama-nama bangsa kolektif tunggal dalam bahasa Ibrani diterjemahkan dengan bentuk etnonim Indonesia yang lazim dan didahului “orang” untuk memperjelas bahwa yang dimaksud ialah kelompok-kelompok bangsa.
theological_decisions:
- issue: Nuansa imperatif שׁמר dalam konteks perjanjian
  choice: Perintah untuk memperhatikan dengan sungguh-sungguh apa yang Allah perintahkan
  alternative: “Peliharalah apa yang Kuperintahkan” atau “Berhati-hatilah mengenai apa yang Kuperintahkan”
  rationale: Kata Ibrani mencakup nuansa menjaga, mengindahkan, dan menaati. “Perhatikanlah” tidak mereduksinya menjadi sekadar peringatan, tetapi juga tidak menambahkan rumusan “lakukanlah” yang tidak tertulis secara eksplisit.
- issue: Aspek tindakan Allah dalam הִנְנִי גֹרֵשׁ
  choice: Aku akan menghalau
  alternative: “Aku sedang menghalau”
  rationale: Konstruksi ini dapat menggambarkan tindakan yang segera, tengah dimulai, atau dipastikan. Bentuk mendatang sesuai dengan konteks janji penyingkiran bangsa-bangsa tanpa mengurangi kepastian tindakan Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Susunan daftar bangsa dibuat alami tanpa menghilangkan satu pun etnonim.
