lexical_decisions:
- source_word: וַיְמַהֵר
  choice: segera
  rationale: Kata kerja מהר menyatakan tindakan yang dilakukan dengan cepat atau tergesa. Dalam konteks ini, "segera" terdengar alami dan menekankan tanggapan Musa yang langsung.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk baku nama tokoh ini dalam Alkitab berbahasa Indonesia.
- source_word: וַיִּקֹּד
  choice: membungkuk
  rationale: Kata kerja קדד menunjuk pada gerakan menundukkan atau membungkukkan tubuh. Pilihan ini mempertahankan tindakan jasmani yang dibedakan dari tindakan menyembah sesudahnya.
- source_word: אַרְצָה
  choice: sampai ke tanah
  rationale: Bentuk berarah dari אֶרֶץ menunjukkan gerakan menuju tanah. "Sampai ke tanah" secara alami menggambarkan dalamnya gerakan membungkuk tersebut.
- source_word: וַיִּשְׁתָּחוּ
  choice: menyembah
  rationale: Dalam konteks tanggapan Musa terhadap penyataan TUHAN, bentuk kata kerja שׁחה menyatakan sujud penuh hormat sebagai ibadah. Karena tindakan membungkuk sudah disebut sebelumnya, "menyembah" menyampaikan makna devosional tanpa mengaburkan urutan kedua tindakan.
theological_decisions:
- issue: Apakah kata kerja terakhir diterjemahkan sebagai tindakan jasmani semata atau sebagai penyembahan
  choice: menyembah
  alternative: bersujud
  rationale: Konteksnya adalah tanggapan hormat Musa terhadap penyataan diri TUHAN. Kata Ibrani itu dapat menunjuk pada sujud jasmani, tetapi di sini tindakan tersebut berfungsi sebagai penyembahan; sementara itu, gerakan jasmaninya sudah dinyatakan oleh kata kerja sebelumnya. Catatan kaki mempertahankan kemungkinan nuansa jasmani tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dibuat alami dengan "lalu" untuk menandai tindakan berurutan. Penanda catatan kaki ditempatkan sesudah "menyembah" sesuai cakupan alternatif yang diberikan.
