  terminology: “Yahweh” tepat untuk יהוה dan “loh batu” adalah istilah Indonesia yang mapan. “Memahat” merupakan pilihan yang aman untuk פסל dalam konteks pembentukan loh batu. Catatan alternatif “menatah” tetap relevan.
