source:
  edition: WLC
  text: וַ/יִּפְסֹ֡ל שְׁנֵֽי לֻחֹ֨ת אֲבָנִ֜ים כָּ/רִאשֹׁנִ֗ים וַ/יַּשְׁכֵּ֨ם מֹשֶׁ֤ה בַ/בֹּ֨קֶר֙ וַ/יַּ֨עַל֙ אֶל הַ֣ר סִינַ֔י כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ וַ/יִּקַּ֣ח בְּ/יָד֔/וֹ שְׁנֵ֖י לֻחֹ֥ת אֲבָנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/004.yaml
  text: So he cut two stone tablets like the first ones[a], and Moses rose early in the morning and went up Mount Sinai, just as Yahweh had commanded him[b], and he took the two stone tablets in his hand.
translation:
  language: id
  text: Lalu Musa memahat dua loh batu seperti loh-loh yang pertama[a]. Musa bangun pagi-pagi dan naik ke Gunung Sinai, seperti yang telah diperintahkan Yahweh kepadanya. Ia membawa kedua loh batu itu di tangannya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menatah dua loh batu seperti loh-loh yang pertama.”'
    reason: פסל dapat menunjuk pada pemahatan atau penatahan batu; catatan ini mempertahankan alternatif leksikal yang dekat.
  - marker: b
    text: 'Secara harfiah: “di tangannya”; bentuk tunggal ini dapat dipakai secara idiomatis.'
    reason: Dua loh mungkin secara praktis dipegang dengan kedua tangan, tetapi teks Ibrani memakai bentuk tunggal dan tidak perlu dinormalisasi tanpa penjelasan.
lexical_decisions:
- source_word: וַיִּפְסֹל
  choice: memahat
  rationale: Kata פסל di sini menyatakan tindakan membentuk batu menjadi loh. “Memahat” konkret, wajar dalam bahasa Indonesia, dan sesuai dengan konteks.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: dua loh batu / kedua loh batu itu
  rationale: “Loh batu” merupakan padanan Indonesia yang mapan untuk lempengan perjanjian; penyebutan kedua memakai bentuk definit “kedua ... itu” karena acuannya sudah jelas.
- source_word: כָּרִאשֹׁנִים
  choice: seperti yang pertama
  rationale: Mempertahankan perbandingan dengan pasangan loh terdahulu tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: וַיַּשְׁכֵּם ... בַבֹּקֶר
  choice: Keesokan paginya, Musa bangun pagi-pagi
  rationale: Ungkapan ini menyatakan bahwa Musa bangun atau bertindak dini hari. “Keesokan paginya” menghubungkan peristiwa ini secara alami dengan perintah pada ayat sebelumnya, sedangkan “bangun pagi-pagi” mempertahankan penekanan pada waktu awal.
- source_word: וַיַּעַל אֶל הַר סִינַי
  choice: naik ke Gunung Sinai
  rationale: Padanan langsung dan alami yang mempertahankan gerak mendaki menuju gunung.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֹתוֹ
  choice: tepat seperti yang diperintahkan Yahweh kepadanya
  rationale: “Tepat seperti” menyampaikan kesesuaian tindakan Musa dengan perintah sebelumnya; bentuk pasif menghasilkan susunan Indonesia yang jelas dan tidak mengubah pelaku perintah.
- source_word: וַיִּקַּח בְּיָדוֹ
  choice: Ia membawa ... di tangannya
  rationale: Dalam konteks perjalanan mendaki, לקח dapat diterjemahkan alami sebagai “membawa”. Bentuk tunggal idiomatis בְּיָדוֹ dipertahankan sebagai “di tangannya”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks sumber memakai nama pribadi ilahi. “Yahweh” mempertahankan nama itu secara langsung dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kalimat Ibrani yang panjang dipecah menjadi tiga kalimat agar mudah dibaca, sementara urutan tindakan dan pengulangan “loh batu” dipertahankan.
