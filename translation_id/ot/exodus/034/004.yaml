  to: Lalu Musa memahat dua loh batu seperti loh-loh yang pertama[a]. Musa bangun pagi-pagi dan naik ke Gunung Sinai, seperti yang telah diperintahkan Yahweh kepadanya. Ia membawa kedua loh batu itu di tangannya[b].
