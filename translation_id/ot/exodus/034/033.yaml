translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Susunan temporal “Ketika Musa selesai...” mengikuti alur Ibrani secara alami. Penanda catatan kaki [a] ditempatkan tepat setelah frasa yang memiliki alternatif leksikal.
