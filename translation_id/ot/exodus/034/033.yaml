  text: When Moses finished speaking with them[a], he put a veil over his face.
translation:
  language: id
  text: Ketika Musa selesai berbicara dengan mereka,[a] ia menutupi wajahnya dengan selubung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berhenti berbicara dengan mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַל
  choice: selesai
  rationale: Bentuk wayyiqtol dari כלה menandai berakhir atau tuntasnya tindakan Musa; frasa Indonesia “selesai berbicara” alami dan tepat.
- source_word: מִדַּבֵּר
  choice: berbicara
  rationale: Infinitif konstruk דבר dengan prefiks מ setelah כלה menyatakan selesainya tindakan berbicara; dalam bahasa Indonesia paling alami dirangkai sebagai “selesai berbicara”.
- source_word: אִתָּם
  choice: dengan mereka
  rationale: Preposisi אֵת dengan sufiks orang ketiga jamak secara langsung berarti “dengan mereka”; pilihan ini mempertahankan bentuk Ibrani tanpa mengubahnya menjadi “kepada mereka”.
- source_word: וַיִּתֵּן
  choice: memasang
  rationale: נתן dengan עַל menyatakan penempatan sesuatu pada atau di atas sesuatu. Untuk benda penutup wajah, “memasang” terdengar alami dalam bahasa Indonesia modern.
- source_word: עַל פָּנָיו
  choice: pada wajahnya
  rationale: Ungkapan ini secara harfiah berarti “pada/di atas wajahnya”; “pada wajahnya” alami dan tetap menyampaikan letak selubung tersebut.
- source_word: מַסְוֶה
  choice: selubung
  rationale: Nomina ini menunjuk pada penutup wajah dalam konteks ini. “Selubung” merupakan istilah Indonesia yang bermartabat dan tidak secara keliru menyiratkan jenis pakaian tertentu.
