base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/001.yaml
  text: Then Yahweh said to Moses[a], “Cut for yourself two stone tablets like the first ones, and I will write on the tablets the words that were on the first tablets[b], which you broke.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa, “Pahatlah untukmu dua loh batu seperti yang pertama. Aku akan menuliskan pada loh-loh itu kata-kata yang ada pada loh-loh pertama, yang telah kaupecahkan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berfirman
  rationale: Dalam bahasa Indonesia, verba ujar yang subjeknya Allah secara wajar dan bermartabat diterjemahkan “berfirman”; bentuk naratif berurutan וַ־ diwakili oleh “Lalu”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: פְּסָל לְךָ
  choice: Pahatlah untukmu
  rationale: Imperatif פסל menyatakan tindakan membentuk batu dengan memahat atau menetaknya. “Pahatlah” konkret dan lazim untuk batu, sedangkan “untukmu” mempertahankan pronomina datif לְךָ tanpa menambahkan penekanan “sendiri” yang tidak wajib.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: dua loh batu
  rationale: “Loh batu” merupakan padanan Indonesia yang ringkas dan mapan bagi dua lempeng batu bertulis.
- source_word: כָּרִאשֹׁנִים
  choice: seperti yang pertama
  rationale: Ungkapan ini mempertahankan perbandingan dengan dua loh terdahulu; bentuk jamak dipahami dari “dua loh batu” dalam konteks.
- source_word: וְכָתַבְתִּי עַל הַלֻּחֹת
  choice: Aku akan menuliskan pada loh-loh itu
  rationale: Bentuk orang pertama menyatakan tindakan Yahweh yang akan datang. “Menuliskan pada” secara alami menunjukkan permukaan tempat tulisan dibuat.
- source_word: הַדְּבָרִים
  choice: kata-kata
  rationale: דברים secara langsung berarti “kata-kata” atau “perkataan”; “perintah-perintah” akan mempersempit makna secara interpretatif.
- source_word: אֲשֶׁר שִׁבַּרְתָּ
  choice: yang telah kaupecahkan
  rationale: שבר berarti memecahkan atau menghancurkan. “Telah kaupecahkan” menyampaikan tindakan lampau Musa dengan jelas dan mempertahankan sapaan orang kedua tunggal.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Makna הַדְּבָרִים pada loh
  choice: kata-kata
  alternative: perintah-perintah
  rationale: Walaupun konteksnya adalah ketetapan perjanjian, ayat ini memakai istilah umum דברים. Terjemahan tidak mempersempitnya menjadi “perintah-perintah”.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Berfirman” dipakai sebagai verba ujar yang lazim ketika Allah menjadi subjek. Kalimat Ibrani yang panjang dibagi menjadi dua kalimat langsung agar mudah dibaca tanpa mengubah hubungan maknanya.
