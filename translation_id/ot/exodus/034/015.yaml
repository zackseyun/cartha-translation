  variant: modern standard Indonesian
source:
  edition: WLC
  text: פֶּן תִּכְרֹ֥ת בְּרִ֖ית לְ/יוֹשֵׁ֣ב הָ/אָ֑רֶץ וְ/זָנ֣וּ אַחֲרֵ֣י אֱלֹֽהֵי/הֶ֗ם וְ/זָבְחוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם וְ/קָרָ֣א לְ/ךָ֔ וְ/אָכַלְתָּ֖ מִ/זִּבְחֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/015.yaml
  text: lest you make a covenant with the inhabitants of the land[a], and they prostitute themselves after their gods and sacrifice to their gods[c][b], and one of them invites you and you eat from his sacrifice.
translation:
  language: id
  text: Jangan sampai engkau mengikat perjanjian dengan penduduk negeri itu, lalu mereka berzina dengan menyembah ilah-ilah mereka[a] dan mempersembahkan kurban kepada ilah-ilah mereka, kemudian salah seorang dari mereka mengundang engkau dan engkau makan dari kurbannya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mereka berzina mengikuti ilah-ilah mereka.” Bahasa Ibrani memakai gambaran ketidaksetiaan seksual untuk penyembahan berhala.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ia mengundang engkau”; bentuk tunggal ini kemungkinan bermakna distributif, yaitu “salah seorang dari mereka.” “Makan dari kurbannya” merujuk pada makanan yang berasal dari atau terkait dengan persembahan kurban itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: Jangan sampai
  rationale: Mengungkapkan peringatan terhadap akibat yang mungkin terjadi secara alami dalam bahasa Indonesia.
- source_word: תִּכְרֹת בְּרִית
  choice: mengikat perjanjian
  rationale: Padanan idiomatis Indonesia bagi ungkapan harfiah Ibrani 'memotong perjanjian', dengan tetap mempertahankan bobot perjanjiannya.
- source_word: לְיוֹשֵׁב הָאָרֶץ
  choice: dengan penduduk negeri itu
  rationale: Bentuk tunggal kolektif יוֹשֵׁב merujuk kepada orang-orang yang mendiami negeri tersebut.
- source_word: וְזָנוּ אַחֲרֵי אֱלֹהֵיהֶם
  choice: mereka berzina dengan mengikuti ilah-ilah mereka
  rationale: Mempertahankan metafora ketidaksetiaan seksual dalam זנה sekaligus menyampaikan fungsi אַחֲרֵי secara wajar.
- source_word: וְזָבְחוּ לֵאלֹהֵיהֶם
  choice: mempersembahkan kurban kepada ilah-ilah mereka
  rationale: Menjelaskan tindakan pengurbanan dalam konteks ibadah tanpa memperluas maknanya.
- source_word: וְקָרָא לְךָ
  choice: salah seorang dari mereka mengundang engkau
  rationale: Kata kerja tunggal sesudah subjek jamak paling wajar dipahami secara distributif; 'mengundang' sesuai dengan konteks jamuan kurban.
- source_word: וְאָכַלְתָּ מִזִּבְחוֹ
  choice: engkau ikut makan dari kurbannya
  rationale: '''Dari kurbannya'' dekat dengan bentuk Ibrani; kata ''ikut'' memperjelas partisipasi dalam santapan tanpa mengganti kurban dengan tafsiran yang lebih khusus.'
theological_decisions:
- issue: Penyembahan berhala digambarkan sebagai ketidaksetiaan seksual
  choice: Mempertahankan metafora secara eksplisit dengan 'berzina dengan mengikuti ilah-ilah mereka'.
  alternative: Mengikuti ilah-ilah mereka; berlaku tidak setia dengan menyembah ilah-ilah mereka.
  rationale: Bahasa Ibrani sengaja memakai זנה untuk memberi gambaran tajam tentang ketidaksetiaan; menghapus metafora akan mengurangi daya teologis dan sastranya.
- issue: Peralihan dari kata kerja jamak kepada bentuk tunggal dalam undangan
  choice: Menerjemahkannya secara distributif sebagai 'salah seorang dari mereka mengundang engkau'.
  alternative: '''Ia mengundang engkau'' atau ''mereka mengundang engkau''.'
  rationale: Bentuk tunggal Ibrani tetap dipertahankan maknanya sebagai satu orang dari kelompok penduduk, tanpa menghasilkan rujukan yang kabur dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'engkau' mempertahankan sapaan tunggal Ibrani. 'Ilah-ilah' membedakan dewa-dewa yang disembah penduduk dari Allah Israel. Metafora yang keras dipertahankan, sedangkan susunan kalimat dibuat alami bagi pembaca Indonesia.
