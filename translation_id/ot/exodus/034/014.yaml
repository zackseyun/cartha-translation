id: EXO.34.14
reference: Exodus 34:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֛י לֹ֥א תִֽשְׁתַּחֲוֶ֖ה לְ/אֵ֣ל אַחֵ֑ר כִּ֤י יְהוָה֙ קַנָּ֣א שְׁמ֔/וֹ אֵ֥ל קַנָּ֖א הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/014.yaml
  text: For you shall not bow down to another god[a], for Yahweh, whose name is Jealous[c][b], is a jealous God.
translation:
  language: id
  text: Sebab engkau tidak boleh sujud menyembah kepada allah lain[a], karena Yahweh—nama-Nya Cemburu[b]—adalah Allah yang cemburu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyembah allah lain.” Kata kerja Ibrani secara harfiah menunjuk pada tindakan membungkuk atau bersujud, sering kali sebagai tindakan penyembahan.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “sebab Yahweh—Cemburu nama-Nya—adalah Allah yang cemburu.”'
    reason: lexical_alternative
  - marker: c
    text: “Cemburu” di sini menyatakan tuntutan perjanjian Yahweh bahwa hanya Dia yang boleh disembah oleh umat-Nya, bukan iri hati yang berdosa.
    reason: cultural_note
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: sujud menyembah
  rationale: Bentuk hitpael dari שׁחה menunjuk pada tindakan membungkuk atau bersujud, sering sebagai tindakan penyembahan. Ungkapan “sujud menyembah” mempertahankan tindakan konkret sekaligus menjelaskan maknanya dalam konteks.
- source_word: לְאֵל אַחֵר
  choice: kepada allah lain
  rationale: אֵל berarti “allah” dan אַחֵר berarti “lain”. Terjemahan ini langsung dan tidak mempersempitnya menjadi “allah asing”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap tampak dan tidak diganti dengan gelar.
- source_word: קַנָּא
  choice: Cemburu / cemburu
  rationale: Kata ini menyatakan tuntutan eksklusif Yahweh atas penyembahan umat perjanjian-Nya. Huruf kapital dipakai ketika kata itu berfungsi sebagai nama, sedangkan huruf kecil dipakai ketika menjadi sifat.
- source_word: שְׁמוֹ
  choice: nama-Nya
  rationale: Terjemahan ini mempertahankan bentuk lugas bahasa Ibrani bahwa “Cemburu” dinyatakan sebagai nama atau sebutan-Nya.
- source_word: אֵל קַנָּא הוּא
  choice: adalah Allah yang cemburu
  rationale: Susunan ini mempertahankan predikasi bahwa Dia adalah Allah yang cemburu dan terdengar wajar dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung; transliterasi mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Makna קַנָּא sebagai nama dan sifat ilahi
  choice: Cemburu / cemburu
  alternative: Giat / penuh gairah
  rationale: “Cemburu” mempertahankan pengulangan dan ketegangan retoris teks, yaitu tuntutan eksklusif Yahweh atas penyembahan umat-Nya, tanpa melunakkannya menjadi sekadar semangat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. “Engkau” dipertahankan karena bentuk Ibrani tunggal dan konteks amanat perjanjian. Huruf kecil pada “allah lain” membedakannya dari sebutan bagi Allah Israel, sedangkan struktur dengan tanda pisah mempertahankan penekanan kalimat Ibrani.
