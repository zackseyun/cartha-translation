  text: אֶת חַ֣ג הַ/מַּצּוֹת֮ תִּשְׁמֹר֒ שִׁבְעַ֨ת יָמִ֜ים תֹּאכַ֤ל מַצּוֹת֙ אֲשֶׁ֣ר צִוִּיתִ֔/ךָ לְ/מוֹעֵ֖ד חֹ֣דֶשׁ הָ/אָבִ֑יב כִּ֚י בְּ/חֹ֣דֶשׁ הָֽ/אָבִ֔יב יָצָ֖אתָ מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/018.yaml
  text: You shall keep the Feast of Unleavened Bread[a]. For seven days you shall eat unleavened bread, as I commanded you, at the appointed time in the month of Abib[c][b]; for in the month of Abib you came out from Egypt.
translation:
  language: id
  text: Rayakanlah Hari Raya Roti Tidak Beragi.[a] Selama tujuh hari engkau harus makan roti tidak beragi, seperti yang telah Kuperintahkan kepadamu, pada waktu yang ditetapkan dalam bulan Abib,[b] sebab pada bulan Abib engkau keluar dari Mesir.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Perayaan Roti Tidak Beragi.” Kata Ibrani yang digunakan dapat menunjuk pada hari raya atau perayaan keagamaan yang ditetapkan.'
    reason: lexical_alternative
  - marker: b
    text: Abib adalah bulan pada awal musim semi yang dikaitkan dengan keluarnya Israel dari Mesir.
    reason: cultural_note
  - marker: c
    text: 'Atau: “engkau pergi dari Mesir.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג הַמַּצּוֹת
  choice: Hari Raya Roti Tidak Beragi
  rationale: חַג menunjuk pada perayaan keagamaan yang ditetapkan, sedangkan מַצּוֹת berarti roti yang tidak beragi. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan nuansa nama resmi perayaan.
- source_word: תִּשְׁמֹר
  choice: Rayakanlah
  rationale: Dalam konteks hari raya, שׁמר berarti menaati atau menjalankan perayaan yang ditetapkan. Imperatif ini menyampaikan daya perintah Ibrani dengan lebih alami daripada terjemahan harfiah 'jagalah'.
- source_word: שִׁבְעַת יָמִים תֹּאכַל מַצּוֹת
  choice: Selama tujuh hari engkau harus makan roti tidak beragi
  rationale: Menandai durasi tujuh hari dan kewajiban makan roti tanpa ragi. 'Engkau' mempertahankan orang kedua tunggal maskulin yang secara korporat ditujukan kepada Israel.
- source_word: אֲשֶׁר צִוִּיתִךָ
  choice: seperti yang telah Kuperintahkan kepadamu
  rationale: Klausa ini merujuk pada perintah ilahi sebelumnya. 'Telah Kuperintahkan' menyatakan tindakan lampau tanpa menambah penafsiran.
- source_word: לְמוֹעֵד
  choice: pada waktu yang ditetapkan
  rationale: מוֹעֵד adalah waktu atau musim yang sudah ditentukan, khususnya bagi perayaan suci.
- source_word: חֹדֶשׁ הָאָבִיב
  choice: bulan Abib
  rationale: Mempertahankan sebutan Ibrani bagi bulan awal musim semi dan tidak menggantinya dengan nama kalender yang lebih kemudian.
- source_word: כִּי
  choice: sebab
  rationale: 'Memperlihatkan hubungan alasan: keluarnya Israel dari Mesir menjadi dasar bagi perayaan tersebut.'
- source_word: יָצָאתָ מִמִּצְרָיִם
  choice: engkau keluar dari Mesir
  rationale: יצא berarti keluar atau berangkat keluar. Ungkapan Indonesia ini alami dan mempertahankan motif eksodus.
theological_decisions:
- issue: Istilah perayaan perjanjian
  choice: Hari Raya Roti Tidak Beragi sebagai nama perayaan resmi
  alternative: Perayaan Roti Tidak Beragi
  rationale: Kapitalisasi dan frasa 'Hari Raya' mempertahankan bobot liturgis perayaan yang ditetapkan Allah tanpa memasukkan doktrin yang lebih kemudian.
- issue: Orang kedua tunggal yang menunjuk Israel secara korporat
  choice: Mempertahankan bentuk tunggal 'engkau'
  alternative: Menggunakan bentuk jamak 'kalian' atau menyebut 'Israel' secara eksplisit
  rationale: Teks Ibrani memakai orang kedua maskulin tunggal. 'Engkau' mempertahankan bentuk sumber dan memungkinkan rujukan korporat tetap tersirat.
- issue: Hubungan klausa אֲשֶׁר צִוִּיתִךָ
  choice: Menghubungkannya secara umum dengan pelaksanaan perayaan yang diperintahkan
  alternative: Membatasi rujukannya hanya pada waktu pelaksanaan
  rationale: Susunan Ibrani memungkinkan klausa relatif berkaitan dengan perintah pelaksanaan secara lebih luas; terjemahan tidak mempersempitnya secara tidak perlu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada perintah yang khidmat tetapi mudah dipahami. 'Engkau' dipakai untuk mempertahankan bentuk tunggal Ibrani dan register Alkitab yang wajar; 'Kuperintahkan' menunjukkan bahwa pembicara ilahi berbicara dalam orang pertama.
