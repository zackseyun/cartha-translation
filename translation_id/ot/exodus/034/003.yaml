  text: וְ/אִישׁ֙ לֹֽא יַעֲלֶ֣ה עִמָּ֔/ךְ וְ/גַם אִ֥ישׁ אַל יֵרָ֖א בְּ/כָל הָ/הָ֑ר גַּם הַ/צֹּ֤אן וְ/הַ/בָּקָר֙ אַל יִרְע֔וּ אֶל מ֖וּל הָ/הָ֥ר הַ/הֽוּא־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/003.yaml
  text: And no man shall go up with you[a], and indeed no man shall be seen anywhere on the mountain[b]; even the flock and the herd must not graze in front of that mountain.
translation:
  language: id
  text: Jangan seorang pun[a] naik bersamamu, dan jangan pula seorang pun terlihat[b] di mana pun di gunung itu. Bahkan kambing domba dan sapi jangan merumput di depan gunung itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “seorang” berbentuk maskulin tunggal, tetapi di sini dipakai secara umum untuk siapa saja.
    reason: lexical_alternative
  - marker: b
    text: Atau “menampakkan diri.” Dalam bentuk ini, kata kerja Ibrani tersebut dapat berarti “terlihat” atau “menampakkan diri/muncul.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: seorang pun
  rationale: Dalam kedua larangan ini, nomina maskulin tunggal tersebut berfungsi secara generik. Ungkapan “seorang pun” alami dalam bahasa Indonesia dan dengan jelas mencakup siapa saja.
- source_word: יַעֲלֶה עִמָּךְ
  choice: naik bersamamu
  rationale: Kata עלה menyatakan gerak naik menuju gunung; “naik bersamamu” mempertahankan arah dan relasi penyertaan secara ringkas.
- source_word: וְגַם
  choice: dan jangan pula
  rationale: “Pula” menyampaikan unsur penambahan dan penguatan partikel גם, sedangkan “jangan” menerjemahkan partikel larangan אַל yang mengikutinya.
- source_word: אַל יֵרָא
  choice: jangan ... terlihat
  rationale: Bentuk Nifal dari ראה dapat berarti “terlihat” atau “menampakkan diri/muncul.” Teks utama memakai arti pasif yang alami, sementara alternatifnya dipertahankan dalam catatan kaki.
- source_word: בְּכָל הָהָר
  choice: di mana pun di gunung itu
  rationale: Ungkapan ini melarang kehadiran di bagian mana pun dari seluruh kawasan gunung; bentuk distributif ini jelas dan wajar dalam bahasa Indonesia.
- source_word: הַצֹּאן וְהַבָּקָר
  choice: kambing domba dan sapi
  rationale: Pasangan ini membedakan ternak kecil dari ternak besar. “Kambing domba dan sapi” merupakan padanan Indonesia yang konkret dan mudah dipahami.
- source_word: אַל יִרְעוּ
  choice: jangan merumput
  rationale: Dengan ternak sebagai subjek, רעה berarti makan rumput atau merumput; padanan ini langsung dan alami.
- source_word: אֶל מוּל
  choice: di depan
  rationale: Gabungan ini menunjukkan lokasi yang berhadapan dengan atau berada di depan suatu tempat. “Di depan” mempertahankan relasi ruang tanpa menambah rincian yang tidak dinyatakan.
- source_word: הָהָר הַהוּא
  choice: gunung itu
  rationale: Demonstrativa tersebut menunjuk secara khusus kepada gunung yang sedang dibicarakan; “gunung itu” adalah padanan langsung.
