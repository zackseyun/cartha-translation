  text: הִשָּׁ֣מֶר לְ/ךָ֗ פֶּן תִּכְרֹ֤ת בְּרִית֙ לְ/יוֹשֵׁ֣ב הָ/אָ֔רֶץ אֲשֶׁ֥ר אַתָּ֖ה בָּ֣א עָלֶ֑י/הָ פֶּן יִהְיֶ֥ה לְ/מוֹקֵ֖שׁ בְּ/קִרְבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/012.yaml
  text: Be careful[a], lest you make a covenant with the inhabitants of the land into which you are going[d][c][b], lest it become a snare in your midst.
translation:
  language: id
  text: Berhati-hatilah[a], jangan sampai engkau mengikat perjanjian[b] dengan penduduk negeri yang akan kaumasuki. Jangan sampai perjanjian itu[c] menjadi jerat[d] di tengah-tengahmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Jagalah dirimu” atau “Waspadalah.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “memotong perjanjian”, sebuah ungkapan Ibrani yang berarti membuat atau mengadakan perjanjian.'
    reason: lexical_alternative
  - marker: c
    text: Kata kerja Ibrani tidak menyebutkan subjeknya secara eksplisit. Acuan yang paling wajar ialah perjanjian itu, meskipun penduduk negeri tersebut atau keadaan itu secara umum juga mungkin dimaksudkan.
    reason: textual_ambiguity
  - marker: d
    text: Atau “perangkap”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Jagalah dirimu
  rationale: Bentuk perintah Nifal dengan לְךָ merupakan rumusan peringatan refleksif. Pilihan ini mempertahankan unsur menjaga diri dan tetap wajar dalam bahasa Indonesia.
- source_word: פֶּן
  choice: jangan sampai
  rationale: פֶּן memperkenalkan akibat yang harus diwaspadai atau dicegah. Pengulangan “jangan sampai” mempertahankan susunan peringatan yang berulang dalam bahasa Ibrani.
- source_word: תִּכְרֹת בְּרִית
  choice: mengikat perjanjian
  rationale: Secara harfiah ungkapan ini berarti “memotong perjanjian”, tetapi merupakan idiom untuk membuat atau mengadakan perjanjian. “Mengikat perjanjian” alami dan jelas dalam bahasa Indonesia.
- source_word: לְיוֹשֵׁב הָאָרֶץ
  choice: dengan penduduk negeri
  rationale: Partisip tunggal יוֹשֵׁב dipakai secara kolektif. “Penduduk negeri” menyampaikan pengertian kolektif itu secara ringkas.
- source_word: אֲשֶׁר אַתָּה בָּא עָלֶיהָ
  choice: yang akan kaumasuki
  rationale: Klausa ini menunjuk kepada negeri yang sedang dituju dan hendak dimasuki Israel. Bentuk masa depan sesuai dengan konteks perjalanan mereka.
- source_word: יִהְיֶה
  choice: menjadi
  rationale: Kata kerja tunggal paling wajar merujuk kepada perjanjian yang baru disebut. “Menjadi” menyampaikan perubahan perjanjian tersebut menjadi sumber bahaya.
- source_word: לְמוֹקֵשׁ
  choice: jerat
  rationale: מוֹקֵשׁ berarti jerat atau perangkap dan di sini dipakai sebagai metafora bagi sesuatu yang menjerumuskan.
- source_word: בְּקִרְבֶּךָ
  choice: di tengah-tengahmu
  rationale: Ungkapan ini mempertahankan bentuk orang kedua tunggal yang ditujukan kepada Israel sebagai satu umat, tanpa mengubahnya menjadi gagasan psikologis “di dalam dirimu”.
theological_decisions:
- issue: Acuan kata kerja tunggal terakhir
  choice: “Perjanjian itu” menjadi jerat.
  alternative: Penduduk negeri itu, atau keadaan tersebut secara umum, menjadi jerat.
  rationale: “Perjanjian” adalah anteseden tunggal terdekat dan paling koheren. Namun, karena bahasa Ibrani hanya memakai kata kerja tunggal tanpa subjek eksplisit, catatan kaki mempertahankan kemungkinan acuan lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan tunggal “engkau/-mu” dipertahankan karena teks Ibrani menyapa Israel secara tunggal sebagai satu umat. Pengulangan “jangan sampai” mempertahankan tekanan retoris kedua kemunculan פֶּן.
