  yaml_path: translation/ot/exodus/034/005.yaml
  text: And Yahweh came down in the cloud and stood there with him[a], and proclaimed the name of Yahweh.
translation:
  language: id
  text: Lalu Yahweh turun dalam awan dan berdiri di sana bersama Musa. Ia menyerukan dengan nama Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menyerukan nama Yahweh” atau “berseru kepada nama Yahweh.” Secara harfiah, teks Ibrani memakai preposisi sebelum “nama Yahweh”; preposisi itu dapat dipahami antara lain sebagai “dengan,” “dalam,” atau, menurut pembacaan lain, “kepada.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: turun
  rationale: Kata kerja ירד menyatakan gerakan turun; bentuk sederhana “turun” alami dalam narasi Indonesia dan mempertahankan gerak konkretnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh” agar nama pribadi yang terdapat dalam teks Ibrani tetap dipertahankan, bukan diganti dengan gelar.
- source_word: בֶּעָנָן
  choice: dalam awan
  rationale: Preposisi ב paling wajar menyatakan lokasi di sini, dan unsur penentunya menunjuk kepada awan yang sudah dikenal dalam konteks penampakan ilahi di kitab Keluaran.
- source_word: וַיִּתְיַצֵּב
  choice: berdiri
  rationale: Bentuk hitpael dari יצב berarti mengambil posisi atau berdiri; “berdiri” ringkas, alami, dan tidak terlalu formal.
- source_word: עִמּוֹ שָׁם
  choice: di sana bersama Musa
  rationale: עִמּוֹ berarti “bersamanya” dan שָׁם berarti “di sana”. Nama Musa dipakai sebagai pengganti pronomina agar rujukannya jelas dan kalimat Indonesia tidak menimbulkan kesan bahwa Yahweh berdiri bersama diri-Nya sendiri.
- source_word: וַיִּקְרָא
  choice: Ia menyerukan
  rationale: קרא dapat berarti memanggil, menyebut, atau menyerukan. Dalam konteks deklarasi yang berlanjut pada ayat berikutnya, “menyerukan” mempertahankan nuansa ucapan lantang tanpa sepenuhnya menutup kemungkinan konstruksi alternatif.
- source_word: בְשֵׁם יְהוָה
  choice: nama Yahweh
  rationale: Sesudah “menyerukan”, objek langsung menghasilkan ungkapan Indonesia yang alami. Namun, karena teks Ibrani secara harfiah memakai preposisi בְּ (“dalam/dengan/pada”), kemungkinan bacaan lain dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian sebagai nama pribadi dan tidak menggantinya dengan sebuah gelar.
- issue: Subjek וַיִּקְרָא
  choice: Yahweh tetap menjadi subjek, dinyatakan dengan “Ia”
  alternative: Musa sebagai subjek
  rationale: 'Rangkaian wayyiqtol paling alami melanjutkan Yahweh sebagai subjek: Yahweh turun, berdiri, lalu menyerukan. Isi deklarasi pada ayat berikutnya juga mendukung pembacaan ini, walaupun bahasa sumber tidak mengulang subjek secara eksplisit.'
- issue: Fungsi frasa בְשֵׁם יְהוָה
  choice: “menyerukan nama Yahweh”
  alternative: “berseru kepada nama Yahweh” atau “menyerukan dalam/dengan nama Yahweh”
  rationale: Konteks berikutnya mendukung deklarasi nama dan sifat Yahweh, tetapi preposisi Ibrani memungkinkan analisis lain. Ambiguitas itu dipertahankan melalui catatan kaki dan tidak diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. “Lalu” mengalirkan urutan tindakan; “Musa” memperjelas referen pronomina. Penanda catatan kaki [a] dicantumkan langsung sesudah klausa yang dijelaskannya.
