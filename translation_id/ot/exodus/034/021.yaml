base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/021.yaml
  text: Six days you shall work[a], but on the seventh day you shall cease; in plowing time and in harvest you shall cease.
translation:
  language: id
  text: Enam hari lamanya engkau harus bekerja, tetapi pada hari ketujuh engkau harus berhenti[a]; pada musim membajak dan pada musim menuai engkau harus berhenti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “beristirahat.” Kata kerja Ibrani ini pada dasarnya berarti “berhenti” atau “berhenti bekerja” dan, dalam arti yang lebih luas, “beristirahat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Enam hari lamanya
  rationale: Mengungkapkan rentang waktu enam hari secara alami dalam bahasa Indonesia sambil mempertahankan bentuk ringkas teks Ibrani.
- source_word: תַּעֲבֹד
  choice: engkau harus bekerja
  rationale: Bentuk imperfek Qal orang kedua tunggal maskulin berfungsi sebagai ketetapan perjanjian; 'harus' mempertahankan daya preskriptifnya.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: tetapi pada hari ketujuh
  rationale: Waw secara harfiah dapat berarti 'dan', tetapi di sini menyatakan pertentangan antara enam hari bekerja dan hari ketujuh untuk berhenti.
- source_word: תִּשְׁבֹּת
  choice: engkau harus berhenti
  rationale: Kata שׁבת pada dasarnya berarti berhenti atau menghentikan kegiatan, dan secara luas dapat berarti beristirahat. 'Berhenti' mempertahankan penekanan pada penghentian pekerjaan.
- source_word: בֶּחָרִישׁ
  choice: pada musim membajak
  rationale: Nomina חרישׁ dapat menunjuk pada pembajakan atau musim membajak; konteks pertanian mendukung nuansa waktu atau musim.
- source_word: וּבַקָּצִיר
  choice: dan musim menuai pun
  rationale: קציר berarti panen atau musim menuai. Partikel 'pun' secara alami menegaskan bahwa ketetapan tetap berlaku bahkan pada masa pertanian yang sibuk.
- source_word: תִּשְׁבֹּת (kemunculan kedua)
  choice: engkau harus berhenti
  rationale: Pengulangan kata kerja Ibrani dipertahankan untuk menegaskan kewajiban berhenti bekerja pada hari ketujuh, termasuk selama musim pertanian penting.
theological_decisions:
- issue: Penerjemahan kata kerja terkait Sabat שׁבת
  choice: berhenti
  alternative: beristirahat
  rationale: '''Berhenti'' mencerminkan makna leksikal utama, yaitu menghentikan pekerjaan, tanpa mempersempitnya menjadi pengalaman memulihkan tenaga. Alternatif ''beristirahat'' tetap dicatat karena merupakan perluasan makna yang sah.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'engkau' mempertahankan sapaan orang kedua tunggal dalam teks Ibrani. Struktur paralel dan pengulangan 'engkau harus berhenti' dipertahankan; 'pun' memperjelas penekanan bahwa penghentian berlaku juga pada musim membajak dan menuai.
