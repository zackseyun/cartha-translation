  text: וְ/חַ֤ג שָׁבֻעֹת֙ תַּעֲשֶׂ֣ה לְ/ךָ֔ בִּכּוּרֵ֖י קְצִ֣יר חִטִּ֑ים וְ/חַג֙ הָֽ/אָסִ֔יף תְּקוּפַ֖ת הַ/שָּׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/022.yaml
  text: And you shall observe for yourself the Feast of Weeks[a], the firstfruits of the wheat harvest, and the Feast of Ingathering at the turn of the year.
translation:
  language: id
  text: Rayakanlah Hari Raya Tujuh Minggu dengan hasil pertama dari panen gandum, dan Hari Raya Pengumpulan Hasil pada pergantian tahun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pada akhir tahun.” Ungkapan Ibrani secara harfiah menunjuk pada perputaran atau siklus tahun.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג
  choice: Hari Raya
  rationale: Menunjuk pada perayaan keagamaan, khususnya perayaan ziarah. “Hari Raya” alami dan bermartabat dalam bahasa Indonesia serta sesuai untuk nama perayaan Israel.
- source_word: שָׁבֻעֹת
  choice: Tujuh Minggu
  rationale: Secara leksikal berarti “minggu-minggu” dan merupakan nama perayaan yang dihitung berdasarkan tujuh minggu. Bentuk “Tujuh Minggu” mempertahankan sebutan Ibrani secara transparan tanpa menggantinya dengan nama tradisional yang lebih kemudian.
- source_word: תַּעֲשֶׂה לְךָ
  choice: Rayakanlah
  rationale: Secara harfiah berarti “engkau harus membuat/melakukan bagimu,” tetapi bersama חַג merupakan idiom untuk merayakan atau menjalankan suatu hari raya. “Rayakanlah” menyampaikan kewajiban itu secara wajar; unsur לְךָ tidak diterjemahkan tersendiri karena “bagi dirimu” akan terasa kaku dan tidak menambah makna yang jelas dalam bahasa Indonesia.
- source_word: בִּכּוּרֵי
  choice: hasil pertama dari
  rationale: Menunjuk pada hasil awal panen yang dikhususkan sebagai hasil pertama. Frasa ini mudah dipahami pembaca umum dan tidak memaksakan rincian tindakan mempersembahkan yang tidak dinyatakan secara eksplisit dalam ayat.
- source_word: קְצִיר חִטִּים
  choice: panen gandum
  rationale: Frasa konstruksi ini berarti panen atau penuaian gandum. “Panen gandum” merupakan ungkapan Indonesia modern yang ringkas dan alami.
- source_word: הָאָסִיף
  choice: Pengumpulan Hasil
  rationale: Menunjuk pada pengumpulan masuk hasil pertanian dan berfungsi sebagai nama perayaan. “Pengumpulan Hasil” mempertahankan gambaran tindakan dalam istilah Ibrani.
- source_word: תְּקוּפַת הַשָּׁנָה
  choice: pada pergantian tahun
  rationale: תְּקוּפָה menggambarkan perputaran, siklus, atau titik balik. “Pergantian tahun” mempertahankan citra itu lebih baik daripada langsung menyempitkannya menjadi “akhir tahun”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya perintah yang langsung dan bermartabat. Nama-nama hari raya memakai huruf kapital. Kata “dengan” dipakai untuk menyatakan hubungan Hari Raya Tujuh Minggu dengan hasil pertama panen gandum tanpa menambahkan tindakan mempersembahkan yang tidak disebutkan secara eksplisit.
