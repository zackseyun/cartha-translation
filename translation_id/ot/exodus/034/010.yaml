  text: וַ/יֹּ֗אמֶר הִנֵּ֣ה אָנֹכִי֮ כֹּרֵ֣ת בְּרִית֒ נֶ֤גֶד כָּֽל עַמְּ/ךָ֙ אֶעֱשֶׂ֣ה נִפְלָאֹ֔ת אֲשֶׁ֛ר לֹֽא נִבְרְא֥וּ בְ/כָל הָ/אָ֖רֶץ וּ/בְ/כָל הַ/גּוֹיִ֑ם וְ/רָאָ֣ה כָל הָ֠/עָם אֲשֶׁר אַתָּ֨ה בְ/קִרְבּ֜/וֹ אֶת מַעֲשֵׂ֤ה יְהוָה֙ כִּֽי נוֹרָ֣א ה֔וּא אֲשֶׁ֥ר אֲנִ֖י עֹשֶׂ֥ה עִמָּֽ/ךְ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/010.yaml
  text: And he said, “Look, I am making a covenant. Before all your people I will do wonders such as have not been created in all the earth or among any of the nations. And all the people in whose midst you are will see the work of the LORD, for what I am doing with you is awe-inspiring.”
translation:
  language: id
  text: Lalu Ia berfirman, “Lihatlah, Aku mengadakan perjanjian. Di hadapan seluruh umatmu, Aku akan melakukan keajaiban-keajaiban yang belum pernah diciptakan di seluruh bumi ataupun di antara bangsa mana pun. Seluruh umat yang di tengah-tengahnya engkau berada akan melihat perbuatan TUHAN, sebab apa yang Kulakukan bersamamu sangat dahsyat.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹּרֵת בְּרִית
  choice: mengadakan perjanjian
  rationale: Ungkapan Ibrani harfiah berarti 'memotong perjanjian', tetapi dalam bahasa Indonesia idiom yang wajar dan tepat ialah 'mengadakan perjanjian'.
- source_word: נֶגֶד כָּל עַמְּךָ
  choice: di hadapan seluruh bangsamu
  rationale: Menjaga makna tindakan yang dilakukan secara terbuka di depan umat Musa.
- source_word: נִפְלָאֹת
  choice: keajaiban-keajaiban
  rationale: Menunjuk pada tindakan luar biasa Allah, tanpa mempersempitnya hanya menjadi mukjizat dalam pengertian teknis.
- source_word: לֹא נִבְרְאוּ
  choice: belum pernah diciptakan
  rationale: Mempertahankan verba pasif dari akar ברא dan daya ungkap tindakan-tindakan yang sama sekali belum pernah diwujudkan.
- source_word: נוֹרָא
  choice: membangkitkan rasa gentar
  rationale: Kata ini dapat mencakup kedahsyatan yang menimbulkan takut sekaligus takjub; pilihan ini mempertahankan unsur gentar yang kuat.
- source_word: עֹשֶׂה עִמָּךְ
  choice: Kulakukan bersamamu
  rationale: Mempertahankan ambiguitas preposisi עִם, yang dapat dipahami sebagai 'bersama engkau' atau 'terhadap/bagimu', tanpa diam-diam memilih salah satunya.
theological_decisions:
- issue: Identitas penutur dan penggunaan nama ilahi
  choice: Ia berfirman; TUHAN
  alternative: ia berkata; Yahweh
  rationale: Konteks mengidentifikasi penutur sebagai Allah, sehingga 'berfirman' alami dalam register Alkitab Indonesia. Tetragramaton ditampilkan sebagai TUHAN sesuai konvensi luas Indonesia, tanpa menambahkan penafsiran denominasi.
- issue: Sifat perbuatan Allah sebagai נוֹרָא
  choice: sungguh membangkitkan rasa gentar
  alternative: menakjubkan / dahsyat / mengagumkan
  rationale: Terjemahan ini menjaga ketegangan antara rasa takut, kedahsyatan, dan kekaguman yang terkandung dalam kata Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan tunggal 'engkau' dipertahankan karena ditujukan kepada Musa, sedangkan 'bangsamu' dan 'seluruh bangsa' membedakan umat Musa dari bangsa-bangsa lain.
