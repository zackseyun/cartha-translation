revisions:
- from: Lalu Ia berfirman, “Lihatlah, Aku mengadakan perjanjian. Di hadapan seluruh bangsamu, Aku akan melakukan keajaiban-keajaiban yang belum pernah diciptakan di seluruh bumi ataupun di antara bangsa mana pun. Seluruh bangsa yang di tengah-tengahnya engkau berada akan melihat perbuatan TUHAN, sebab apa yang Kulakukan bersamamu sungguh membangkitkan rasa gentar.”
  to: Lalu Ia berfirman, “Lihatlah, Aku mengadakan perjanjian. Di hadapan seluruh umatmu, Aku akan melakukan keajaiban-keajaiban yang belum pernah diciptakan di seluruh bumi ataupun di antara bangsa mana pun. Seluruh umat yang di tengah-tengahnya engkau berada akan melihat perbuatan TUHAN, sebab apa yang Kulakukan bersamamu sangat dahsyat.”
  rationale: The revision consistently renders עַם as “umat” and retains “bangsa-bangsa” for גּוֹיִם, preserving an important lexical distinction in the Hebrew. It also replaces the longer final expression with an idiomatic predicate that directly conveys the fearsome, awe-inspiring force of נוֹרָא. The wording “bersamamu” is retained to preserve the breadth of עִמָּךְ.
