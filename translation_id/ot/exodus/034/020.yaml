id: EXO.34.20
reference: Exodus 34:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/פֶ֤טֶר חֲמוֹר֙ תִּפְדֶּ֣ה בְ/שֶׂ֔ה וְ/אִם לֹ֥א תִפְדֶּ֖ה וַ/עֲרַפְתּ֑/וֹ כֹּ֣ל בְּכ֤וֹר בָּנֶ֨י/ךָ֙ תִּפְדֶּ֔ה וְ/לֹֽא יֵרָא֥וּ פָנַ֖/י רֵיקָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/020.yaml
  text: You shall redeem the firstborn of a donkey with a lamb[a]; and if you do not redeem it, then you shall break its neck. You shall redeem every firstborn of your sons[c][b]. And none shall appear before me empty-handed.
translation:
  language: id
  text: Anak sulung keledai harus kautebus dengan seekor domba[a]. Jika tidak kautebus, patahkanlah lehernya. Setiap anak laki-laki sulungmu harus kautebus. Tidak seorang pun boleh menghadap-Ku[b] dengan tangan kosong[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seekor kambing”; kata Ibrani שֶׂה dapat menunjuk pada seekor domba atau kambing dari kawanan ternak kecil.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menghadap wajah-Ku”; ini merupakan ungkapan Ibrani untuk datang ke hadapan Allah.
    reason: lexical_alternative
  - marker: c
    text: Maksudnya, tanpa membawa pemberian atau persembahan.
    reason: cultural_note
lexical_decisions:
- source_word: פֶטֶר חֲמוֹר
  choice: anak sulung keledai
  rationale: פֶטֶר secara harfiah menunjuk pada yang pertama membuka rahim; dalam ketentuan hukum ini, “anak sulung keledai” menyampaikan maksudnya secara ringkas dan alami.
- source_word: תִּפְדֶּה
  choice: harus kautebus
  rationale: פדה dalam konteks hukum dan ibadah berarti membebaskan melalui pengganti atau pembayaran. Bentuk “harus kautebus” menyampaikan daya wajib dari ketentuan ini.
- source_word: בְשֶׂה
  choice: dengan seekor domba
  rationale: שֶׂה menunjuk pada seekor hewan dari kawanan ternak kecil dan dapat berupa domba atau kambing. “Seekor domba” alami dalam bahasa Indonesia, sedangkan cakupan yang lebih luas dipertahankan dalam catatan kaki.
- source_word: וַעֲרַפְתּוֹ
  choice: patahkanlah lehernya
  rationale: ערף secara khusus berarti mematahkan tengkuk atau leher; terjemahan ini jelas dan tepat untuk tindakan yang diperintahkan.
- source_word: כֹּל בְּכוֹר בָּנֶיךָ
  choice: setiap anak laki-laki sulungmu
  rationale: Ungkapan ini secara khusus merujuk kepada anak laki-laki sulung. Pilihan ini mempertahankan penandaan gender sumber dan lebih alami daripada susunan harfiah “setiap anak sulung dari anak-anak lelakimu”.
- source_word: יֵרָאוּ פָנַי
  choice: menghadap-Ku
  rationale: Bentuk Niphal ראה bersama פָנַי merupakan idiom untuk datang menghadap Allah dalam ibadah. “Menghadap-Ku” alami dan tetap mempertahankan ujaran langsung ilahi.
- source_word: רֵיקָם
  choice: dengan tangan kosong
  rationale: Dalam konteks ibadah, רֵיקָם berarti datang tanpa membawa pemberian atau persembahan. Idiom Indonesia ini menyampaikan makna tersirat tersebut tanpa memasukkannya langsung ke dalam teks.
theological_decisions:
- issue: Rujukan ilahi orang pertama dalam klausa terakhir
  choice: menghadap-Ku
  alternative: menghadap wajah-Ku; hadir di hadirat-Ku
  rationale: Bahasa Ibrani secara harfiah menyebut “wajah-Ku”, tetapi ungkapan itu idiomatis. “Menghadap-Ku” menjaga ujaran langsung Allah tanpa menambahkan nuansa teologis yang tidak dituntut teks.
- issue: Bahasa bergender dalam בָּנֶיךָ
  choice: anak laki-laki sulungmu
  alternative: anak sulungmu; anak-anakmu yang sulung
  rationale: בָּנֶיךָ secara eksplisit berarti “anak-anak lelakimu”. Penandaan laki-laki dipertahankan dan tidak dinetralkan menjadi “anak-anak” secara umum.
- issue: Cakupan larangan pada וְלֹא יֵרָאוּ
  choice: Tidak seorang pun boleh
  alternative: Janganlah mereka
  rationale: Bentuk jamak Ibrani berfungsi sebagai larangan umum bagi semua orang yang datang menghadap. Rumusan ini menyampaikan cakupan umum itu secara alami tanpa membatasi kelompok yang dimaksud.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-ibadah yang lugas dan bermartabat. Bentuk terikat “kautebus” mempertahankan sapaan orang kedua tunggal dari teks, sedangkan kapitalisasi “-Ku” mengikuti kebiasaan penerbitan Indonesia untuk rujukan ilahi.
