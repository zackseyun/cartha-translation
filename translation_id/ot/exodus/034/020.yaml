  source_fidelity: 'Terjemahan dengan setia menyampaikan seluruh unsur Ibrani: anak sulung keledai ditebus dengan seekor domba (שֶׂה), konsekuensi bila tidak ditebus berupa pematahan leher, penebusan setiap anak laki-laki sulung, serta larangan menghadap Allah dengan tangan kosong. Bentuk orang kedua tunggal pada ''kautebus'' selaras dengan ujaran ilahi kepada Israel, sementara larangan umum pada klausa terakhir tersampaikan secara wajar.'
  naturalness: Bahasa Indonesia baku modern, lugas, dan sesuai register hukum-ibadah. 'Harus kautebus' dan 'patahkanlah lehernya' jelas serta idiomatis dalam gaya instruksional. 'Tidak seorang pun boleh menghadap-Ku dengan tangan kosong' adalah perumusan alami bagi idiom Ibrani tersebut.
