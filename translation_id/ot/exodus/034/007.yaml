  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: נֹצֵ֥ר חֶ֨סֶד֙ לָ/אֲלָפִ֔ים נֹשֵׂ֥א עָוֺ֛ן וָ/פֶ֖שַׁע וְ/חַטָּאָ֑ה וְ/נַקֵּה֙ לֹ֣א יְנַקֶּ֔ה פֹּקֵ֣ד עֲוֺ֣ן אָב֗וֹת עַל בָּנִים֙ וְ/עַל בְּנֵ֣י בָנִ֔ים עַל שִׁלֵּשִׁ֖ים וְ/עַל רִבֵּעִֽים׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/007.yaml
  text: keeping steadfast love for thousands[a], forgiving iniquity and transgression and sin, but he will by no means leave unpunished, visiting the iniquity of fathers on children and on children's children[c][b], to the third and to the fourth generation.
translation:
  language: id
  text: yang memelihara kasih setia kepada beribu-ribu[a], yang mengampuni kesalahan, pelanggaran, dan dosa, tetapi sama sekali tidak membebaskan orang yang bersalah[b], yang membalaskan kesalahan para ayah[c] kepada anak-anak dan cucu-cucu mereka, sampai keturunan yang ketiga dan keempat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepada seribu keturunan”; teks Ibrani hanya mengatakan “kepada beribu-ribu”, kemungkinan sebagai kontras antara kasih setia Allah yang bertahan lama dan penghakiman sampai keturunan ketiga dan keempat.
    reason: alternative_reading
  - marker: b
    text: Dapat juga diterjemahkan “sama sekali tidak menyatakan orang yang bersalah bebas” atau “pasti tidak membiarkan orang yang bersalah tanpa hukuman”.
    reason: lexical_alternative
  - marker: c
    text: Teks Ibrani secara khusus mengatakan “para ayah”; maksud keseluruhan ungkapan ini berkaitan dengan keturunan dari generasi ke generasi.
    reason: cultural_note
lexical_decisions:
- source_word: נֹצֵר
  choice: memelihara
  rationale: Partisipel Qal ini menyatakan tindakan terus-menerus dalam menjaga atau mempertahankan; “memelihara” alami dalam bahasa Indonesia dan tetap mencerminkan kesinambungan tindakan.
- source_word: חֶסֶד
  choice: kasih setia
  rationale: Ungkapan ini mempertahankan unsur kasih sekaligus kesetiaan relasional-perjanjian yang terkandung dalam istilah Ibrani.
- source_word: לָאֲלָפִים
  choice: kepada beribu-ribu
  rationale: Teks Ibrani hanya menyebut “beribu-ribu” tanpa secara eksplisit menambahkan orang atau keturunan; terjemahan utama mempertahankan keluasan itu.
- source_word: נֹשֵׂא
  choice: mengampuni
  rationale: Walaupun arti dasarnya ialah mengangkat atau menanggung, bersama rangkaian istilah dosa kata ini secara idiomatis berarti mengampuni.
- source_word: עָוֺן
  choice: kesalahan
  rationale: “Kesalahan” dapat mencakup perbuatan menyimpang serta bobot pertanggungjawabannya tanpa memakai istilah Indonesia yang terlalu arkais.
- source_word: פֶשַׁע
  choice: pelanggaran
  rationale: Kata ini menunjuk pada pelanggaran atau pemberontakan; “pelanggaran” tepat dalam rangkaian tiga istilah tentang dosa.
- source_word: חַטָּאָה
  choice: dosa
  rationale: Ini merupakan padanan langsung, lazim, dan jelas bagi pembaca Indonesia.
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  choice: tetapi sama sekali tidak membebaskan dari hukuman
  rationale: Konstruksi infinitif absolut dengan verba finit menegaskan penyangkalan. “Sama sekali tidak” menyampaikan penekanan itu, sedangkan “membebaskan dari hukuman” mempertahankan nuansa yudisial tanpa menambahkan objek “orang yang bersalah” yang tidak tertulis eksplisit.
- source_word: פֹּקֵד
  choice: membalaskan
  rationale: Dalam konteks penghakiman, kata ini menyatakan bahwa kesalahan tidak diabaikan, melainkan ditindak. “Membalaskan” mempertahankan daya penghakiman ungkapan tanpa menjabarkan mekanismenya.
- source_word: עֲוֺן אָבוֹת
  choice: kesalahan para ayah
  rationale: Terjemahan ini mempertahankan bentuk maskulin spesifik dalam teks sumber dan konsisten menerjemahkan עָוֺן sebagai “kesalahan”.
- source_word: עַל בָּנִים וְעַל בְּנֵי בָנִים
  choice: kepada anak-anak dan cucu-cucu mereka
  rationale: Ungkapan Indonesia ini alami dan menyatakan urutan keturunan yang dimaksud oleh “anak-anak dan anak-anak dari anak-anak”.
- source_word: עַל שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: sampai keturunan yang ketiga dan keempat
  rationale: Kata “keturunan” tersirat dari rangkaian keluarga dan perlu dinyatakan agar ungkapan ordinalnya jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Ketegangan antara pengampunan ilahi dan keadilan dalam וְנַקֵּה לֹא יְנַקֶּה
  choice: Mempertahankan pernyataan penuh tentang pengampunan sekaligus penegasan bahwa Allah sama sekali tidak membebaskan dari hukuman.
  alternative: “tetapi pasti tidak menyatakan bebas” atau “tetapi tidak sekali-kali membebaskan orang yang bersalah”
  rationale: Ayat ini dengan sengaja menempatkan belas kasih dan penghakiman berdampingan. Terjemahan tidak melunakkan salah satunya dan tidak menambahkan objek teologis yang tidak eksplisit dalam teks.
- issue: Apakah “keturunan” perlu ditambahkan sesudah לָאֲלָפִים
  choice: Tidak menambahkan “keturunan” dalam teks utama.
  alternative: “kepada seribu keturunan” atau “kepada beribu-ribu keturunan”
  rationale: Berbeda dari beberapa nas sejajar, ayat ini hanya mengatakan “beribu-ribu”. Teks utama mempertahankan ketidakspesifikan tersebut, sedangkan kemungkinan makna antargenerasi dicatat dalam catatan kaki.
- issue: Cakupan antargenerasi dari kesalahan para ayah
  choice: Mempertahankan ungkapan bahwa kesalahan para ayah dibalaskan kepada keturunan hingga yang ketiga dan keempat.
  alternative: Memparafrasakannya sebagai akibat sosial yang diwariskan atau membatasinya hanya kepada keturunan yang mengulangi dosa yang sama.
  rationale: Teks ayat ini sendiri tidak menjelaskan mekanisme atau syaratnya. Terjemahan mempertahankan ketegangan dan tidak memasukkan harmonisasi teologis dari luar ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan struktur pengakuan ilahi yang berulang. Istilah “kasih setia”, “pelanggaran”, dan “dosa” dipertahankan karena jelas serta memiliki bobot teologis tanpa bersifat denominasi. “Beribu-ribu” sengaja dibiarkan tanpa nomina penjelas untuk mempertahankan ambiguitas sumber.
