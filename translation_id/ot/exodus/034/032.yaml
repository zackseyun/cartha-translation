  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵ֥ן נִגְּשׁ֖וּ כָּל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/יְצַוֵּ֕/ם אֵת֩ כָּל אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אִתּ֖/וֹ בְּ/הַ֥ר סִינָֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/032.yaml
  text: Afterward all the sons of Israel came near[a], and he commanded them all that Yahweh had spoken with him on Mount Sinai.
translation:
  language: id
  text: Sesudah itu, semua bani Israel[a] mendekat, lalu ia memerintahkan kepada mereka segala sesuatu yang telah Yahweh firmankan kepadanya di Gunung Sinai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “semua putra Israel.” “Bani Israel” adalah sebutan kebangsaan bagi orang Israel secara keseluruhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: Sesudah itu
  rationale: Ungkapan ini menandai urutan waktu setelah peristiwa sebelumnya. “Sesudah itu” alami dalam bahasa Indonesia modern dan mempertahankan peralihan naratif.
- source_word: נִגְּשׁוּ
  choice: mendekat
  rationale: Bentuk Nifal dari נגשׁ menyatakan gerakan datang mendekat. Pilihan ini mempertahankan tindakan konkret dalam konteks bangsa itu menghampiri Musa.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: semua bani Israel
  rationale: “Bani Israel” merupakan ungkapan kebangsaan yang sudah dikenal dalam bahasa Indonesia dan tetap mencerminkan unsur בְּנֵי, tanpa menghasilkan frasa “semua anak laki-laki Israel” yang dapat disalahpahami sebagai hanya laki-laki muda.
- source_word: וַיְצַוֵּם
  choice: lalu ia memerintahkan kepada mereka
  rationale: צוה menyatakan pemberian perintah, bukan sekadar pengajaran atau pemberitahuan. Kata “lalu” meneruskan urutan tindakan dalam narasi.
- source_word: אֵת כָּל אֲשֶׁר
  choice: segala sesuatu yang
  rationale: Frasa ini mencakup seluruh isi yang disampaikan dan diterjemahkan secara alami dalam bahasa Indonesia.
- source_word: דִּבֶּר יְהוָה אִתּוֹ
  choice: yang telah Yahweh firmankan kepadanya
  rationale: “Telah” menunjukkan bahwa firman Yahweh di Sinai mendahului perintah Musa kepada bangsa itu. “Firmankan kepadanya” merupakan padanan Indonesia yang alami dan bermartabat bagi perkataan ilahi, walaupun אִתּוֹ secara lebih harfiah dapat berarti “dengannya”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai “Yahweh” untuk mempertahankan nama perjanjian yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: בְּהַר סִינָי
  choice: di Gunung Sinai
  rationale: Preposisi בְּ dapat menandai lokasi. “Di Gunung Sinai” merupakan ungkapan Indonesia yang wajar dan tidak menentukan secara berlebihan apakah percakapan itu berlangsung tepat di puncak atau secara umum di kawasan gunung.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama diri ilahi. “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Cakupan ungkapan בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: orang Israel atau anak-anak lelaki Israel
  rationale: Secara bentuk, בְּנֵי adalah jamak maskulin dari “anak laki-laki/putra,” tetapi keseluruhan frasa berfungsi sebagai sebutan kebangsaan bagi umat Israel. “Bani Israel” mempertahankan bentuk tradisional yang dekat dengan sumber tanpa mempersempit rujukannya hanya kepada kaum laki-laki.
- issue: Nuansa דִּבֶּר ... אִתּוֹ
  choice: firmankan kepadanya
  alternative: bicarakan dengannya
  rationale: אִתּוֹ dapat mempertahankan nuansa berbicara “dengan” Musa. Namun, dalam bahasa Indonesia, “Yahweh bicarakan dengannya” tidak alami dan dapat memberi kesan perundingan; “firmankan kepadanya” menyampaikan hubungan ujaran secara jelas tanpa menambahkan isi teologis.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Struktur kalimat mengikuti urutan tindakan dalam teks Ibrani, sementara “bani Israel” dipertahankan sebagai ungkapan kebangsaan yang dikenal dan dijelaskan melalui catatan kaki.
