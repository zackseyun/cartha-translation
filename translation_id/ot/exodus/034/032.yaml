  terminology: “Yahweh” konsisten dengan sumber dan kebijakan nama ilahi. “Bani Israel” merupakan padanan nasional-kovenantal yang lazim serta tidak membatasi rujukan hanya kepada anak laki-laki; catatan kaki menjelaskan hubungannya dengan bentuk harfiah Ibrani. Istilah “firmankan” sesuai untuk ujaran ilahi dan register naskah.
