  source_fidelity: 'Terjemahan dengan tepat mengikuti urutan dan isi teks Ibrani: penanda waktu וְאַחֲרֵי כֵן diterjemahkan “Sesudah itu”; נִגְּשׁוּ sebagai tindakan mendekat; וַיְצַוֵּם mempertahankan daya perintah; dan “telah ... firmankan” secara wajar menunjukkan bahwa perkataan Yahweh mendahului tindakan Musa. “Di Gunung Sinai” setia pada keterangan lokasi. Pergeseran idiomatis dari “berbicara dengan dia” ke “memfirmankan kepadanya” dapat diterima dalam bahasa Indonesia dan tidak mengubah isi yang dikomunikasikan.'
