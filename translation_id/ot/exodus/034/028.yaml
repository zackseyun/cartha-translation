  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יְהִי שָׁ֣ם עִם יְהוָ֗ה אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔ל וּ/מַ֖יִם לֹ֣א שָׁתָ֑ה וַ/יִּכְתֹּ֣ב עַל הַ/לֻּחֹ֗ת אֵ֚ת דִּבְרֵ֣י הַ/בְּרִ֔ית עֲשֶׂ֖רֶת הַ/דְּבָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/034/028.yaml
  text: And he was there with Yahweh forty days and forty nights[a]; he ate no bread and drank no water. And he wrote on the tablets the words of the covenant[b], the ten words.
translation:
  language: id
  text: Ia berada di sana bersama Yahweh selama empat puluh hari dan empat puluh malam; ia tidak makan roti dan tidak minum air. Ia menulis[a] pada loh-loh itu perkataan perjanjian, yakni sepuluh perkataan itu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Subjek kata “menulis” tidak disebutkan secara eksplisit. Dalam alur ayat ini, “Ia” paling langsung merujuk kepada Musa; tetapi dapat juga dipahami sebagai Yahweh, sebab di bagian lain penulisan pada loh-loh itu dikaitkan dengan Yahweh (lihat Kel. 34:1; Ul. 10:4).
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “sepuluh perkataan”; secara tradisional disebut “Sepuluh Perintah”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi empat huruf dan membedakannya dari gelar 'Tuhan'.
- source_word: וַיְהִי שָׁם עִם
  choice: Ia tinggal di sana bersama
  rationale: Mengungkapkan keberadaan Musa di sana bersama Yahweh dalam bahasa Indonesia yang alami tanpa menambahkan gagasan lain.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: empat puluh hari dan empat puluh malam
  rationale: Padanan langsung dan lazim bagi ungkapan durasi dalam bahasa Ibrani.
- source_word: לֶחֶם לֹא אָכַל
  choice: ia tidak makan roti
  rationale: Mempertahankan nomina konkret 'roti' dan tidak memperluasnya menjadi 'makanan'.
- source_word: וּמַיִם לֹא שָׁתָה
  choice: dan tidak minum air
  rationale: Padanan langsung yang mempertahankan kesejajaran dengan klausa sebelumnya.
- source_word: וַיִּכְתֹּב
  choice: Ia menuliskan
  rationale: Pronomina mempertahankan subjek maskulin tunggal yang tidak disebutkan secara eksplisit; konteks langsung mengarah kepada Musa, tetapi kemungkinan rujukan kepada Yahweh dicatat dalam catatan kaki.
- source_word: עַל הַלֻּחֹת
  choice: pada loh-loh itu
  rationale: Istilah 'loh' lazim untuk lempeng batu perjanjian; bentuk ulang menyatakan bentuk jamak Ibrani.
- source_word: דִּבְרֵי הַבְּרִית
  choice: perkataan-perkataan perjanjian
  rationale: Mempertahankan hubungan konstruksi antara 'perkataan-perkataan' dan 'perjanjian'.
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: kesepuluh firman
  rationale: Mempertahankan arti harfiah 'sepuluh perkataan/firman' dengan ungkapan Indonesia yang wajar dan bermartabat; sebutan tradisional dicatat dalam catatan kaki.
theological_decisions:
- issue: Subjek וַיִּכְתֹּב ('menuliskan')
  choice: Memakai 'Ia' tanpa menyebut Musa atau Yahweh secara eksplisit; alur terdekat secara alami menunjuk kepada Musa.
  alternative: Memahami 'Ia' sebagai Yahweh berdasarkan Keluaran 34:1 dan Ulangan 10:4.
  rationale: Bentuk Ibraninya hanya orang ketiga maskulin tunggal dan tidak menyebut ulang subjek. Sintaksis langsung meneruskan tindakan Musa, sedangkan konteks kanonis mengaitkan penulisan pada loh dengan Yahweh. Terjemahan utama dan catatan kaki mempertahankan ketegangan ini.
- issue: Pemaknaan עֲשֶׂרֶת הַדְּבָרִים
  choice: kesepuluh firman
  alternative: Sepuluh Perintah
  rationale: Teks Ibrani secara harfiah menyebut 'sepuluh perkataan'. Padanan tradisional yang lebih interpretatif tetap diberikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan struktur yang mudah dipahami. 'Yahweh' dipertahankan sebagai nama ilahi. 'Loh-loh' mengikuti istilah Alkitab Indonesia yang mapan, sedangkan 'yaitu' memperjelas bahwa kesepuluh firman merupakan aposisi bagi perkataan-perkataan perjanjian.
