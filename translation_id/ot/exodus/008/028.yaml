  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּכְבֵּ֤ד פַּרְעֹה֙ אֶת לִבּ֔/וֹ גַּ֖ם בַּ/פַּ֣עַם הַ/זֹּ֑את וְ/לֹ֥א שִׁלַּ֖ח אֶת הָ/עָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/028.yaml
  text: But Pharaoh hardened his heart this time also[a], and did not let the people go.
translation:
  language: id
  text: Namun, kali ini pun Firaun mengeraskan hatinya[a] dan tidak membiarkan bangsa itu pergi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “membuat hatinya berat.” Ungkapan ini berarti bahwa Firaun bersikap keras kepala atau tidak tanggap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְבֵּד
  choice: mengeraskan
  rationale: Secara harfiah verba כבד berkaitan dengan keadaan berat, tetapi bersama 'hati' ungkapan ini menyatakan sikap keras kepala atau tidak tanggap. 'Mengeraskan' alami dalam bahasa Indonesia, mempertahankan tindakan aktif Firaun, dan selaras dengan motif naratif kitab Keluaran.
- source_word: לִבּוֹ
  choice: hatinya
  rationale: '''Hati'' tepat dipertahankan karena dalam pemikiran Ibrani menunjuk pada pusat kehendak dan sikap batin.'
- source_word: גַּם בַּפַּעַם הַזֹּאת
  choice: kali ini pun
  rationale: Gabungan ini menyatakan bahwa Firaun kembali melakukan hal yang sama pada kesempatan ini. 'Kali ini pun' ringkas dan wajar dalam bahasa Indonesia.
- source_word: וְלֹא שִׁלַּח
  choice: dan tidak membiarkan ... pergi
  rationale: Dalam konteks Keluaran, שׁלח dengan bangsa itu sebagai objek berarti mengizinkan atau melepaskan mereka untuk pergi. Ungkapan ini alami dan tetap mempertahankan nuansa penolakan izin.
- source_word: הָעָם
  choice: bangsa itu
  rationale: Nomina kolektif tentu ini merujuk kepada umat Israel. 'Bangsa itu' mempertahankan sifat kolektif dan rujukan yang sudah dikenal dalam konteks.
- source_word: וַ
  choice: Namun
  rationale: Waw memajukan narasi, tetapi dalam konteks ini juga memperlihatkan tanggapan Firaun yang berlawanan setelah tulah mereda. 'Namun' menyampaikan hubungan wacana tersebut secara alami.
theological_decisions:
- issue: Pelaku dalam pengerasan hati Firaun
  choice: Firaun mengeraskan hatinya sendiri
  alternative: Hati Firaun menjadi keras
  rationale: Bentuk Ibrani menempatkan Firaun sebagai subjek yang bertindak. Terjemahan mempertahankan keagenan itu tanpa menghapus ketegangan naratif dengan ayat-ayat lain yang menyebut Allah mengeraskan hati Firaun.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Susunan 'kali ini pun' dipilih agar penambahan dan pengulangan dalam bahasa Ibrani terdengar alami.
