reference: Exodus 8:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּאמְר֤וּ הַֽ/חַרְטֻמִּים֙ אֶל פַּרְעֹ֔ה אֶצְבַּ֥ע אֱלֹהִ֖ים הִ֑וא וַ/יֶּחֱזַ֤ק לֵב פַּרְעֹה֙ וְ/לֹֽא שָׁמַ֣ע אֲלֵ/הֶ֔ם כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/015.yaml
  text: Then the magicians said to Pharaoh[a], “This is the finger of God.” But Pharaoh’s heart was hardened, and he did not listen to them[c][b], just as Yahweh had spoken.
translation:
  language: id
  text: Lalu para ahli sihir berkata kepada Firaun, “Ini adalah jari Allah[a].” Namun hati Firaun mengeras[b], dan ia tidak mendengarkan mereka, seperti yang telah difirmankan Yahweh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jari Allah”; ungkapan ini menyatakan bahwa kuasa Allah sendiri sedang bekerja.
    reason: cultural_note
  - marker: b
    text: Dapat juga diterjemahkan “hati Firaun menjadi kuat/keras.” Klausa Ibrani ini tidak menyebutkan siapa yang mengeraskan hatinya.
    reason: lexical_alternative
  - marker: c
    text: 'Ibrani: YHWH, nama ilahi yang secara tradisional diterjemahkan “TUHAN.”'
    reason: alternative_reading
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: para ahli sihir
  rationale: Istilah ini menunjuk kepada para ahli ritual dan ilmu gaib Firaun. “Para ahli sihir” jelas, wajar dalam bahasa Indonesia, dan tidak mempersempit peran mereka melebihi teks.
- source_word: אֶצְבַּע אֱלֹהִים הִוא
  choice: Ini adalah jari Allah
  rationale: Mempertahankan gambaran konkret dari klausa nominal Ibrani sekaligus mengungkapkan secara alami bahwa kuasa ilahi sedang bekerja.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk Ibrani ini dapat memiliki pemakaian lain dalam konteks berbeda, di sini rujukan tunggal kepada Allah paling sesuai dengan konteks pertarungan tanda-tanda dalam kisah Keluaran.
- source_word: וַיֶּחֱזַק לֵב פַּרְעֹה
  choice: hati Firaun mengeras
  rationale: Kata kerja חזק menggambarkan hati yang menjadi kuat, teguh, atau keras. Bentuk intransitif “mengeras” menyampaikan sikap keras kepala tanpa menetapkan pelaku yang mengeraskan, sebab klausa Ibrani ini tidak menyebutkannya.
- source_word: שָׁמַע אֲלֵהֶם
  choice: ia tidak mendengarkan mereka
  rationale: שׁמע dengan אֶל berarti mendengarkan atau mengindahkan. Pilihan ini alami dan tidak menambahkan unsur kemauan atau ketaatan yang tidak dinyatakan secara eksplisit.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: seperti yang telah difirmankan Yahweh
  rationale: Ungkapan ini merujuk kembali kepada pernyataan ilahi sebelumnya. “Telah difirmankan” menjaga urutan naratif dan ragam bahasa Kitab Suci yang bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh” agar nama pribadi yang terdapat dalam teks Ibrani tetap terlihat, bukan diganti dengan gelar.
theological_decisions:
- issue: Pelaku dalam pengerasan hati Firaun
  choice: hati Firaun mengeras
  alternative: hati Firaun dikeraskan; Firaun mengeraskan hatinya
  rationale: Teks pada klausa ini tidak menyebut Allah ataupun Firaun sebagai pelaku langsung. Bentuk intransitif mempertahankan ketegangan teologis dan tidak menentukan pelaku secara tersirat.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama perjanjian YHWH. “Yahweh” mempertahankan nama tersebut secara langsung dan membedakannya dari gelar umum.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang jelas dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sedangkan metafora “jari Allah,” ketidakjelasan pelaku pengerasan hati, dan nama ilahi dipertahankan serta dijelaskan melalui catatan kaki.
