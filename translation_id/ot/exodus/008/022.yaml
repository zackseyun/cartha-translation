  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה לֹ֤א נָכוֹן֙ לַ/עֲשׂ֣וֹת כֵּ֔ן כִּ֚י תּוֹעֲבַ֣ת מִצְרַ֔יִם נִזְבַּ֖ח לַ/יהוָ֣ה אֱלֹהֵ֑י/נוּ הֵ֣ן נִזְבַּ֞ח אֶת תּוֹעֲבַ֥ת מִצְרַ֛יִם לְ/עֵינֵי/הֶ֖ם וְ/לֹ֥א יִסְקְלֻֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/022.yaml
  text: But Moses said[a], “It would not be right to do so, because we would sacrifice to Yahweh our God what is detestable to the Egyptians. If we sacrifice what is detestable to the Egyptians before their eyes, will they not stone us?”
translation:
  language: id
  text: Namun Musa berkata, “Tidak patut kita berbuat demikian, sebab yang akan kita persembahkan sebagai korban kepada Yahweh, Allah kita, adalah sesuatu yang dianggap menjijikkan oleh orang Mesir.[a] Jika kita mempersembahkan sebagai korban sesuatu yang dianggap menjijikkan oleh orang Mesir di depan mata mereka, bukankah mereka akan merajam kita?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “kejijikan orang Mesir.” Frasa ini kemungkinan berarti sesuatu yang dipandang menjijikkan oleh orang Mesir.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָכוֹן
  choice: patut
  rationale: Dalam konteks ini kata tersebut menyatakan apa yang layak atau semestinya dilakukan; “tidak patut” alami dalam bahasa Indonesia dan mempertahankan unsur kepantasan praktis serta moral.
- source_word: לַעֲשׂוֹת כֵּן
  choice: berbuat demikian
  rationale: Ungkapan idiomatis ini berarti melakukan seperti yang baru saja diusulkan; “berbuat demikian” ringkas dan bermartabat.
- source_word: תּוֹעֲבַת מִצְרַיִם
  choice: sesuatu yang dianggap menjijikkan oleh orang Mesir
  rationale: Frasa konstruksi ini dapat secara harfiah dibaca “kejijikan orang Mesir,” tetapi konteks mendukung arti objektif, yakni sesuatu yang dipandang menjijikkan oleh mereka. Kata “dianggap” menjaga agar penilaian itu jelas berasal dari orang Mesir.
- source_word: נִזְבַּח
  choice: akan kita kurbankan / kita mengurbankan
  rationale: Bentuk imperfek menyatakan tindakan yang dimaksudkan atau dibayangkan dalam usulan Firaun; bentuk Indonesia disesuaikan secara alami dengan klausa sebab dan kondisi.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Konstruksi posesif diterjemahkan langsung dan mempertahankan identitas relasional umat dengan Allah mereka.
- source_word: הֵן
  choice: Jika
  rationale: Di sini partikel tersebut memperkenalkan keadaan hipotesis yang menjadi dasar pertanyaan retoris.
- source_word: לְעֵינֵיהֶם
  choice: di depan mata mereka
  rationale: Terjemahan ini mempertahankan gambaran konkret dari idiom Ibrani dan menekankan bahwa tindakan itu disaksikan langsung.
- source_word: יִסְקְלֻנוּ
  choice: mereka akan merajam kita
  rationale: Kata kerja ini secara khusus menunjuk pada penyerangan atau penghukuman dengan batu; “merajam” tepat dan lazim dalam ragam Alkitab Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Makna תּוֹעֲבַת מִצְרַיִם
  choice: sesuatu yang dianggap menjijikkan oleh orang Mesir
  alternative: kejijikan orang Mesir
  rationale: Konteks menyoroti keberatan religius orang Mesir dan kemungkinan reaksi keras mereka. Terjemahan utama menyatakan arti objektif yang paling mungkin, sementara bentuk harfiahnya dicatat agar ketegangan leksikal tidak disembunyikan.
- issue: Daya pertanyaan וְלֹא יִסְקְלֻנוּ
  choice: bukankah mereka akan merajam kita?
  alternative: dan tidakkah mereka akan merajam kita?
  rationale: “Bukankah” menyampaikan pertanyaan retoris yang mengharapkan jawaban ya, tanpa mengubah ancaman menjadi pernyataan mutlak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang wajar dan bermartabat. “Mengurbankan” dipilih untuk tindakan persembahan korban, sedangkan “merajam” mempertahankan kekhususan tindakan dengan batu. Penanda catatan kaki [a] ditempatkan tepat setelah frasa yang dijelaskannya.
