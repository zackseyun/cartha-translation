  yaml_path: translation/ot/exodus/008/003.yaml
  text: And the magicians did the same by their secret arts[a], and they brought up the frogs over the land of Egypt.
translation:
  language: id
  text: Para ahli sihir itu melakukan hal yang sama dengan ilmu rahasia mereka[a], dan mereka membuat katak-katak muncul di atas tanah Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan mantra-mantra mereka” atau “dengan ilmu gaib mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: melakukan hal yang sama
  rationale: Ungkapan עשה כֵן menyatakan tindakan dengan cara yang sama seperti tindakan sebelumnya; pilihan ini alami dalam bahasa Indonesia dan mempertahankan daya bandingnya.
- source_word: הַחֲרְטֻמִּים
  choice: para ahli sihir
  rationale: Dalam konteks Keluaran, istilah ini menunjuk kepada praktisi istana Firaun yang memakai keahlian magis atau esoteris. 'Para ahli sihir' jelas dan lazim tanpa mempersempit peran mereka secara berlebihan.
- source_word: בְּלָטֵיהֶם
  choice: dengan ilmu rahasia mereka
  rationale: Kata ini menunjuk kepada praktik magis yang tersembunyi atau esoteris. Terjemahan ini menyampaikan sarana tindakan sekaligus sifat rahasianya tanpa menentukan teknik yang tidak dijelaskan teks.
- source_word: וַיַּעֲלוּ
  choice: membuat ... bermunculan
  rationale: 'Bentuk Hifil dari עלה bersifat kausatif: mereka menyebabkan katak-katak naik atau muncul. ''Membuat ... bermunculan'' mempertahankan unsur kausatif dan terdengar alami dalam konteks banyak katak.'
- source_word: אֶת הַצְפַרְדְּעִים
  choice: katak-katak
  rationale: Nomina jamak tertentu ini merujuk kepada katak-katak dalam tulah yang sedang dibicarakan; pengulangan kata menyatakan jamak secara jelas dalam bahasa Indonesia.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: di seluruh tanah Mesir
  rationale: עַל dapat berarti 'di atas/atas', dan dalam konteks ini menggambarkan katak-katak yang muncul serta tersebar meliputi negeri Mesir. 'Di seluruh' menyampaikan cakupan itu secara alami.
theological_decisions:
- issue: Hakikat tindakan para ahli sihir
  choice: Melaporkan secara langsung bahwa mereka juga membuat katak-katak bermunculan.
  alternative: Menggambarkannya sebagai peniruan semu, tipuan, atau tindakan yang hanya tampak berhasil.
  rationale: Narasi Ibrani menyatakan tindakan itu tanpa kualifikasi. Terjemahan tidak boleh memasukkan penjelasan skeptis, naturalistis, atau polemis yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Tanda titik koma dipakai untuk memperlihatkan bahwa klausa kedua menjabarkan hasil tindakan yang sama tanpa mengaburkan urutan narasi.
