  text: And they piled them up in heap after heap[a], and the land stank.
translation:
  language: id
  text: Mereka mengumpulkan katak-katak itu dalam tumpukan demi tumpukan,[a] dan negeri itu berbau busuk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam tumpukan-tumpukan” atau “tumpukan demi tumpukan”; bahasa Ibrani mengulang kata “tumpukan” untuk memberi penekanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְבְּרוּ
  choice: menumpuk
  rationale: Kata kerja צבר menyatakan tindakan mengumpulkan sesuatu menjadi tumpukan; “menumpuk” konkret, alami, dan sesuai dengan konteks bangkai katak.
- source_word: אֹתָם
  choice: bangkai-bangkai itu
  rationale: Pronomina objek ini merujuk kepada katak-katak yang mati dalam konteks langsung. Penyebutan “bangkai-bangkai itu” memperjelas acuannya secara alami tanpa mengubah makna.
- source_word: חֳמָרִם חֳמָרִם
  choice: menjadi bertumpuk-tumpuk
  rationale: Pengulangan nomina Ibrani memberi makna distributif dan penekanan pada banyaknya tumpukan. Ungkapan ini mempertahankan daya pengulangan dalam bahasa Indonesia yang wajar.
- source_word: וַתִּבְאַשׁ
  choice: berbau busuk
  rationale: Kata באש berarti mengeluarkan bau busuk. “Berbau busuk” langsung, jelas, dan lazim dalam bahasa Indonesia modern.
- source_word: הָאָרֶץ
  choice: seluruh negeri
  rationale: Dalam kisah tulah, אֶרֶץ menunjuk pada negeri atau wilayah yang terkena dampak, bukan seluruh bumi. Kata “seluruh” menyampaikan cakupan idiomatis yang tersirat oleh pernyataan tentang negeri itu.
