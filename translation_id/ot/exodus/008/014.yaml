base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/014.yaml
  text: And the magicians did the same by their secret arts to bring out the gnats[a], but they were not able; and the gnats were on man and on beast.
translation:
  language: id
  text: Para ahli sihir melakukan hal yang sama dengan ilmu rahasia mereka untuk memunculkan agas[a], tetapi mereka tidak mampu; dan agas-agas itu ada pada manusia dan hewan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kutu”. Jenis serangga yang dimaksud oleh istilah Ibrani ini tidak dapat dipastikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחַרְטֻמִּים
  choice: para ahli sihir
  rationale: Istilah ini menunjuk kepada para ahli ritual atau sihir di istana Firaun. 'Para ahli sihir' merupakan padanan Indonesia yang alami dan tidak terlalu mempersempit cara kerja mereka.
- source_word: בְּלָטֵיהֶם
  choice: dengan ilmu rahasia mereka
  rationale: Frasa ini merujuk pada praktik tersembunyi atau gaib; 'ilmu rahasia' mempertahankan nuansa tersebut dalam bahasa Indonesia yang jelas.
- source_word: לְהוֹצִיא
  choice: untuk memunculkan
  rationale: Bentuk kausatif dari יצא berarti membuat keluar atau membawa keluar; dalam konteks ini, 'memunculkan' secara alami menyatakan upaya menghasilkan serangga itu.
- source_word: הַכִּנִּים / הַכִּנָּם
  choice: agas
  rationale: Jenis serangganya tidak dapat dipastikan. 'Agas' merupakan padanan modern yang lazim, sementara alternatif 'kutu' dipertahankan dalam catatan kaki.
- source_word: וְלֹא יָכֹלוּ
  choice: tetapi mereka tidak mampu
  rationale: Padanan ini menyatakan ketidakmampuan secara langsung dan alami.
- source_word: בָּאָדָם
  choice: pada manusia
  rationale: אָדָם di sini adalah nomina tunggal kolektif yang berarti umat manusia, bukan seorang laki-laki tertentu. 'Manusia' menyampaikan cakupan kolektif itu secara tepat dalam bahasa Indonesia.
- source_word: וּבַבְּהֵמָה
  choice: dan hewan
  rationale: בְּהֵמָה dipakai secara kolektif dan berpasangan dengan manusia. 'Hewan' mempertahankan pasangan manusia-hewan tanpa membatasi makna hanya pada ternak.
theological_decisions:
- issue: Makna kolektif אָדָם
  choice: manusia
  alternative: orang; umat manusia
  rationale: Kata Ibrani berbentuk tunggal tetapi digunakan secara kolektif dan dikontraskan dengan בְּהֵמָה. 'Manusia' mempertahankan makna representatif umum tanpa menyiratkan seorang laki-laki tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dua kalimat menghindari kalimat majemuk yang kaku. Pengulangan 'agas-agas' pada klausa terakhir memperjelas rujukan dan mencerminkan peralihan bentuk dalam teks Ibrani.
