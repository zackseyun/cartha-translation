  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּֽעֲשׂוּ כֵ֗ן וַ/יֵּט֩ אַהֲרֹ֨ן אֶת יָד֤/וֹ בְ/מַטֵּ֨/הוּ֙ וַ/יַּךְ֙ אֶת עֲפַ֣ר הָ/אָ֔רֶץ וַ/תְּהִי֙ הַ/כִּנָּ֔ם בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה כָּל עֲפַ֥ר הָ/אָ֛רֶץ הָיָ֥ה כִנִּ֖ים בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/013.yaml
  text: And they did so[a]. Aaron stretched out his hand with his staff and struck the dust of the earth, and the gnats came upon man and beast[b]. All the dust of the earth became gnats throughout all the land of Egypt.
translation:
  language: id
  text: Mereka pun melakukannya. Harun mengulurkan tangannya dengan tongkatnya dan memukul debu tanah. Lalu agas[a] menyerang manusia[b] dan ternak. Di seluruh tanah Mesir, semua debu tanah berubah menjadi agas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kutu”; jenis serangga yang dimaksud oleh istilah Ibrani כִּנִּים tidak dapat dipastikan.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani di sini menunjuk manusia secara kolektif.
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: Mereka pun melakukannya
  rationale: Formula naratif ini menyatakan bahwa mereka menjalankan perintah sebelumnya; partikel “pun” mengalir alami dalam narasi Indonesia.
- source_word: וַיֵּט אַהֲרֹן אֶת יָדוֹ בְמַטֵּהוּ
  choice: Harun mengulurkan tangannya dengan tongkatnya
  rationale: Mempertahankan tindakan mengulurkan tangan serta frasa penyerta/instrumental “dengan tongkatnya” tanpa menentukan lebih jauh bagaimana tongkat itu dipegang.
- source_word: וַיַּךְ אֶת עֲפַר הָאָרֶץ
  choice: dan memukul debu tanah
  rationale: “Memukul” merupakan padanan langsung dan wajar bagi נכה; “debu tanah” mempertahankan citra dan pengulangan עֲפַר הָאָרֶץ.
- source_word: הַכִּנָּם / כִנִּים
  choice: agas
  rationale: Identifikasi zoologis istilah Ibrani ini tidak pasti. “Agas” merupakan padanan Indonesia yang wajar bagi serangga kecil yang mengerumun, sedangkan kemungkinan “kutu” dicatat dalam catatan kaki.
- source_word: וַתְּהִי הַכִּנָּם בָּאָדָם וּבַבְּהֵמָה
  choice: Lalu agas menyerang manusia dan ternak
  rationale: Secara harfiah serangga itu “ada pada” manusia dan hewan. “Menyerang” menyampaikan timbulnya gangguan/wabah secara alami tanpa menyatakan mekanisme zoologis tertentu.
- source_word: בָּאָדָם
  choice: manusia
  rationale: אָדָם dipakai secara kolektif untuk umat manusia, bukan khusus laki-laki; “manusia” tepat dan alami dalam bahasa Indonesia.
- source_word: בַּבְּהֵמָה
  choice: ternak
  rationale: בְּהֵמָה dalam pasangan ini paling wajar menunjuk hewan peliharaan atau ternak yang terkena tulah.
- source_word: כָּל עֲפַר הָאָרֶץ הָיָה כִנִּים
  choice: semua debu tanah berubah menjadi agas
  rationale: “Berubah menjadi” mengungkapkan secara jelas makna hasil dari הָיָה, sambil mempertahankan cakupan כָּל.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: Di seluruh tanah Mesir
  rationale: Mengungkapkan cakupan distributif frasa Ibrani dengan susunan yang alami dan bermartabat.
theological_decisions:
- issue: Cakupan אָדָם
  choice: manusia
  alternative: orang; manusia laki-laki
  rationale: Dalam kontras dengan ternak, אָדָם bersifat kolektif dan mencakup manusia pada umumnya. Terjemahan tidak mempersempitnya menjadi laki-laki saja.
- issue: Sifat perubahan debu menjadi serangga
  choice: berubah menjadi agas
  alternative: menjadi seolah-olah agas; menghasilkan agas
  rationale: Teks memakai הָיָה dengan predikat כִנִּים dan secara lugas menggambarkan debu menjadi agas. Terjemahan mempertahankan pernyataan tersebut tanpa merasionalisasi atau menjelaskan mekanismenya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. “Agas” dipilih sebagai istilah utama, sementara ketidakpastian zoologis dipertahankan dalam catatan kaki. Semua penanda catatan kaki ditempatkan langsung pada kata yang dijelaskan.
