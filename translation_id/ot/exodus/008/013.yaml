  source_fidelity: 'Terjemahan secara setia mencerminkan rangkaian Ibrani: pelaksanaan perintah, Harun mengulurkan tangan dengan tongkatnya, memukul debu tanah, agas pada manusia dan ternak, serta seluruh debu tanah menjadi agas di seluruh tanah Mesir. Frasa “menyerang manusia dan ternak” merupakan pengungkapan naratif yang wajar untuk adanya wabah pada kedua kelompok itu, tanpa menambahkan rincian zoologis.'
  naturalness: Bahasa Indonesia baku, jelas, dan mengalir. “Debu tanah,” “ternak,” dan “Di seluruh tanah Mesir” cocok untuk register naratif yang bermartabat. Susunan kalimat terakhir dengan keterangan tempat di depan tetap alami dan menegaskan cakupan universal teks Ibrani.
  terminology: “Harun” tepat. “Agas” dapat dipertahankan sebagai pilihan utama untuk כִּנִּים, dengan ketidakpastian identifikasi zoologis dan alternatif “kutu” dicatat secara memadai. “Manusia” tepat untuk אָדָם yang kolektif, dan catatan kaki b menjelaskan cakupannya tanpa beban penafsiran. “Ternak” merupakan padanan kontekstual yang baik untuk בְּהֵמָה.
