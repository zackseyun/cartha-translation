  terminology: “Yahweh” konsisten dengan kebijakan yang diberikan. “Kawanan besar serangga” tidak mengunci identitas עָרֹב sebagai lalat; catatan kaki dengan tepat menyebut pemahaman tradisional tanpa menjadikannya kepastian. “Hamba-hambanya” mempertahankan keluasan עֲבָדָיו dan lebih idiomatis daripada “para hambanya” dalam konstruksi ini.
