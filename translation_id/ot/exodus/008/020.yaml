  to: Yahweh pun berbuat demikian. Kawanan besar serangga[a] masuk ke rumah Firaun dan ke rumah-rumah hamba-hambanya. Seluruh tanah Mesir itu rusak akibat kawanan serangga itu.
  rationale: Revisi terbatas pada kelancaran idiom dan konsistensi rujukan tanpa mengubah makna. Bentuk “kawanan besar serangga” mempertahankan ambiguitas עָרֹב dan daya intensif כָּבֵד. “Seluruh tanah Mesir itu rusak” menyampaikan cakupan menyeluruh dan akibat kerusakan yang dinyatakan bentuk Nifal תִּשָּׁחֵת.
