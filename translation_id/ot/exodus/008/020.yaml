base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/020.yaml
  text: And Yahweh did so[a], and a heavy swarm came into Pharaoh’s house and into his servants’ houses, and throughout all the land of Egypt the land was ruined because of the swarm.
translation:
  language: id
  text: Yahweh pun berbuat demikian. Kawanan besar serangga[a] masuk ke rumah Firaun dan ke rumah-rumah hamba-hambanya. Seluruh tanah Mesir itu rusak akibat kawanan serangga itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini dapat menunjuk pada kawanan yang sangat besar; jenis serangganya tidak pasti dan secara tradisional dipahami sebagai lalat.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap dipertahankan dan tidak diganti dengan gelar.
- source_word: וַיַּעַשׂ ... כֵּן
  choice: pun berbuat demikian
  rationale: Ungkapan ini menyampaikan secara wajar bahwa Yahweh melaksanakan apa yang telah dinyatakan sebelumnya; “pun” mempertahankan alur naratif.
- source_word: וַיָּבֹא
  choice: masuk
  rationale: Walaupun verba dasarnya berarti “datang”, keterangan arah menuju rumah Firaun membuat “masuk” alami dalam bahasa Indonesia.
- source_word: עָרֹב כָּבֵד
  choice: sekawanan besar serangga
  rationale: עָרֹב menunjuk pada kawanan pengganggu yang jenisnya tidak pasti, sedangkan כָּבֵד menekankan besarnya atau dahsyatnya kawanan itu. Pilihan ini tidak menentukan spesies tertentu.
- source_word: בֵּיתָה פַרְעֹה
  choice: ke rumah Firaun
  rationale: Akhiran penunjuk arah pada בֵּיתָה menyatakan gerak masuk atau menuju rumah Firaun. “Rumah” dipertahankan tanpa mempersempitnya menjadi “istana”.
- source_word: וּבֵית עֲבָדָיו
  choice: ke rumah-rumah para hambanya
  rationale: Bentuk tunggal “rumah” dengan pemilik jamak dipahami secara distributif. “Hamba” mempertahankan cakupan עֶבֶד tanpa membatasinya hanya pada pejabat.
- source_word: וּבְכָל אֶרֶץ מִצְרַיִם
  choice: di seluruh tanah Mesir
  rationale: Menyatakan jangkauan menyeluruh secara dekat dengan susunan dan citra teks Ibrani.
- source_word: תִּשָּׁחֵת הָאָרֶץ
  choice: negeri itu rusak
  rationale: Bentuk Nifal dari שׁחת menunjukkan bahwa negeri itu mengalami kerusakan berat, tetapi tidak harus berarti musnah sepenuhnya.
- source_word: מִפְּנֵי הֶעָרֹב
  choice: akibat kawanan serangga itu
  rationale: Dalam konteks ini מִפְּנֵי menyatakan sebab; “akibat” jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. Transliterasi “Yahweh” mempertahankan nama itu alih-alih menggantinya dengan gelar.
- issue: Identitas עָרֹב
  choice: kawanan serangga tanpa menentukan spesies
  alternative: lalat pikat atau lalat
  rationale: Jenis makhluk dalam istilah Ibrani ini tidak pasti. Teks utama mempertahankan ketidakpastian tersebut dan catatan kaki mencatat pemahaman tradisional.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif dibuat lancar dengan kalimat-kalimat pendek, sambil mempertahankan pengulangan konseptual tentang tanah atau negeri dan tanpa menentukan jenis serangga secara berlebihan.
