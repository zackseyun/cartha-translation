  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה הִנֵּ֨ה אָנֹכִ֜י יוֹצֵ֤א מֵֽ/עִמָּ/ךְ֙ וְ/הַעְתַּרְתִּ֣י אֶל יְהוָ֔ה וְ/סָ֣ר הֶ/עָרֹ֗ב מִ/פַּרְעֹ֛ה מֵ/עֲבָדָ֥י/ו וּ/מֵ/עַמּ֖/וֹ מָחָ֑ר רַ֗ק אַל יֹסֵ֤ף פַּרְעֹה֙ הָתֵ֔ל לְ/בִלְתִּי֙ שַׁלַּ֣ח אֶת הָ/עָ֔ם לִ/זְבֹּ֖חַ לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/025.yaml
  text: And Moses said[a], “Look, I am going out from you, and I will plead with Yahweh, and the swarm will depart from Pharaoh, from his servants, and from his people tomorrow. Only let Pharaoh not continue to mock by not letting the people go to sacrifice to Yahweh.”
translation:
  language: id
  text: Lalu Musa berkata, “Aku sekarang akan pergi meninggalkanmu dan memohon kepada Yahweh. Besok kawanan[a] itu akan pergi dari Firaun, dari para pegawainya, dan dari rakyatnya. Hanya saja, janganlah Firaun kembali berlaku curang dengan tidak membiarkan bangsa itu pergi untuk mempersembahkan kurban kepada Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani עָרֹב mungkin secara lebih khusus menunjuk pada kawanan lalat atau serangga lain yang berkerumun; jenis tepatnya tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה אָנֹכִי יוֹצֵא מֵעִמָּךְ
  choice: Aku akan pergi meninggalkanmu
  rationale: הִנֵּה memberi penekanan pada pernyataan yang segera menyusul, tetapi dalam bahasa Indonesia modern penekanan itu dapat disampaikan secara alami tanpa kata seru tersendiri. Frasa ini mempertahankan gerak konkret יצא dan makna berpisah dari hadapan Firaun.
- source_word: וְהַעְתַּרְתִּי אֶל יְהוָה
  choice: dan memohon kepada Yahweh
  rationale: עתר di sini menunjuk pada permohonan sungguh-sungguh atau syafaat, bukan sekadar berdoa secara umum.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani.
- source_word: וְסָר הֶעָרֹב
  choice: kawanan itu akan menjauh
  rationale: סור bersifat intransitif, yakni pergi atau menjauh. עָרֹב menunjuk pada kawanan makhluk pengganggu, tetapi jenis tepatnya tidak pasti.
- source_word: מִפַּרְעֹה מֵעֲבָדָיו וּמֵעַמּוֹ
  choice: dari Firaun, dari para pegawainya, dan dari rakyatnya
  rationale: Pengulangan kata 'dari' mempertahankan penekanan dan cakupan tiga kelompok dalam bahasa sumber. עֲבָדָיו dalam lingkungan istana secara alami dapat berarti para pegawai atau pejabat Firaun.
- source_word: רַק
  choice: Hanya saja
  rationale: Menandai pembatasan sekaligus peringatan Musa secara wajar dalam bahasa Indonesia.
- source_word: אַל יֹסֵף פַּרְעֹה הָתֵל
  choice: janganlah Firaun kembali mempermainkan kami
  rationale: Konstruksi יסף dengan התל menyatakan pengulangan tindakan memperdaya atau mempermainkan. Objek 'kami' tersirat oleh konteks interpersonal dan membuat ungkapan Indonesia lengkap tanpa mengubah sasaran tindakan.
- source_word: לְבִלְתִּי שַׁלַּח אֶת הָעָם
  choice: dengan tidak membiarkan bangsa ini pergi
  rationale: Infinitif ini menjelaskan bentuk tindakan mempermainkan tersebut, yaitu tidak melepaskan umat itu.
- source_word: לִזְבֹּחַ לַיהוָה
  choice: untuk mempersembahkan kurban kepada Yahweh
  rationale: זבח secara khusus merujuk pada tindakan mempersembahkan kurban, bukan ibadah dalam arti umum.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Identifikasi עָרֹב
  choice: kawanan
  alternative: kawanan lalat atau kawanan campuran
  rationale: Jenis makhluk yang dimaksud tidak dapat dipastikan. Istilah umum mempertahankan ketidakpastian leksikal dalam teks sumber.
- issue: Nuansa הָתֵל
  choice: mempermainkan kami
  alternative: menipu atau memperdaya
  rationale: Kata ini memadukan unsur penipuan dan perlakuan meremehkan. 'Mempermainkan' menjaga kedua nuansa itu tanpa menyederhanakannya menjadi kebohongan semata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Firaun', 'kurban', dan 'Yahweh' dipakai secara konsisten; struktur pengulangan sumber dipertahankan bila tetap alami. Penanda catatan kaki [a] ditempatkan setelah kalimat yang memuat istilah 'kawanan'.
