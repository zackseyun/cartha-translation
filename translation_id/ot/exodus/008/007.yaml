base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/007.yaml
  text: And the frogs will depart from you[a], and from your houses, and from your servants, and from your people; only in the Nile will they remain.
translation:
  language: id
  text: Katak-katak itu akan pergi darimu, dari rumah-rumahmu, dari hamba-hambamu, dan dari rakyatmu; hanya di Sungai Nil[a] katak-katak itu akan tetap tinggal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di sungai itu.” Kata Ibrani יְאֹר dapat berarti “sungai,” tetapi dalam kitab Keluaran biasanya menunjuk secara khusus kepada Sungai Nil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָרוּ
  choice: akan pergi
  rationale: Kata סוּר dalam konteks ini menyatakan bahwa katak-katak itu pergi atau menjauh. “Akan pergi” alami dalam bahasa Indonesia dan tidak menyiratkan bahwa katak-katak itu langsung dimusnahkan.
- source_word: הַצְפַרְדְּעִים
  choice: katak-katak itu
  rationale: Bentuk jamak tertentu diterjemahkan secara langsung sebagai “katak-katak itu,” yaitu katak-katak dalam tulah yang sedang dibicarakan.
- source_word: מִמְּךָ
  choice: darimu
  rationale: Preposisi מִן dengan akhiran orang kedua tunggal maskulin secara langsung berarti “darimu,” dengan Firaun sebagai orang yang disapa.
- source_word: וּמִבָּתֶּיךָ
  choice: dari rumah-rumahmu
  rationale: Bentuk Ibrani adalah jamak, sehingga “rumah-rumahmu” mempertahankan jumlah dalam teks sumber.
- source_word: וּמֵעֲבָדֶיךָ
  choice: dari hamba-hambamu
  rationale: עֶבֶד dapat berarti hamba, budak, atau pejabat. Dalam konteks lingkaran orang-orang di bawah kekuasaan Firaun, “hamba-hamba” cukup luas dan tidak mempersempit makna menjadi pejabat atau status perbudakan tertentu.
- source_word: וּמֵעַמֶּךָ
  choice: dari rakyatmu
  rationale: עַם di sini menunjuk kepada penduduk yang berada di bawah pemerintahan Firaun; “rakyatmu” lebih tepat secara kontekstual daripada sekadar “orang-orangmu.”
- source_word: רַק
  choice: hanya
  rationale: רַק membatasi pernyataan dengan menyebut satu-satunya tempat katak-katak itu akan tetap ada.
- source_word: בַּיְאֹר
  choice: di Sungai Nil
  rationale: יְאֹר dapat berarti sungai, tetapi dalam kitab Keluaran lazimnya menunjuk secara khusus kepada Sungai Nil. Nama geografis ini memberi kejelasan konteks tanpa menghilangkan alternatif leksikal, yang dicatat dalam catatan kaki.
- source_word: תִּשָּׁאַרְנָה
  choice: katak-katak itu akan tetap ada
  rationale: Bentuk Nifal dari שׁאר menyatakan tetap tinggal atau tersisa. “Akan tetap ada” menyampaikan kelangsungan keberadaan katak-katak di Sungai Nil dan mempertahankan penekanan klausa akhir.
theological_decisions: []
