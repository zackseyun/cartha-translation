  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקְרָ֨א פַרְעֹ֜ה לְ/מֹשֶׁ֣ה וּֽ/לְ/אַהֲרֹ֗ן וַ/יֹּ֨אמֶר֙ הַעְתִּ֣ירוּ אֶל יְהוָ֔ה וְ/יָסֵר֙ הַֽ/צְפַרְדְּעִ֔ים מִמֶּ֖/נִּי וּ/מֵֽ/עַמִּ֑/י וַ/אֲשַׁלְּחָה֙ אֶת הָ/עָ֔ם וְ/יִזְבְּח֖וּ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/004.yaml
  text: Then Pharaoh called for Moses and Aaron and said[a], “Pray to Yahweh, that he may remove the frogs from me and from my people, and I will let the people go[b], so that they may sacrifice to Yahweh.”
translation:
  language: id
  text: Lalu Firaun memanggil Musa dan Harun dan berkata, “Mohonlah dengan sungguh-sungguh kepada Yahweh[a] agar Ia menyingkirkan katak-katak itu dari aku dan dari rakyatku. Aku akan membiarkan bangsa itu pergi supaya mereka mempersembahkan kurban kepada Yahweh.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “Mohonlah dengan sungguh-sungguh kepada Yahweh.” Kata kerjanya dapat mengandung arti memohon dengan mendesak atau menjadi perantara, bukan sekadar berdoa biasa.'
    reason: lexical_alternative
  - marker: b
    text: Atau, “dan mereka akan mempersembahkan kurban kepada Yahweh.” Dalam bahasa Ibrani, klausa ini dapat dibaca sebagai koordinasi sederhana, meskipun dalam konteks ini kemungkinan besar menyatakan tujuan Firaun membiarkan bangsa itu pergi.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: memanggil
  rationale: Dalam konstruksi dengan לְ yang menunjuk orang, קרא berarti memanggil atau menyuruh orang datang. 'Memanggil' alami dalam bahasa Indonesia dan mencakup gagasan bahwa Musa dan Harun disuruh menghadap.
- source_word: פַרְעֹה
  choice: Firaun
  rationale: Bentuk baku dalam bahasa Indonesia untuk gelar penguasa Mesir.
- source_word: הַעְתִּירוּ
  choice: Mohonlah dengan sungguh-sungguh
  rationale: Bentuk Hifil dari עתר dalam konteks doa mengandung nuansa memohon dengan mendesak atau menjadi perantara; ungkapan ini mempertahankan kekuatannya tanpa memakai istilah teknis.
- source_word: אֶל יְהוָה
  choice: kepada Yahweh
  rationale: אֶל menandai pihak yang menjadi tujuan permohonan. Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh' untuk mempertahankan nama perjanjian dalam teks sumber.
- source_word: וְיָסֵר
  choice: agar Ia menyingkirkan
  rationale: Hifil סור berarti menyingkirkan atau menjauhkan. Sesudah perintah untuk memohon, bentuk verba ini secara alami menyatakan isi atau hasil yang diminta.
- source_word: הַצְפַרְדְּעִים
  choice: katak-katak itu
  rationale: Nomina jamak dengan artikel menunjuk katak-katak yang sedang menjadi tulah; 'itu' menyampaikan sifat definitnya secara alami.
- source_word: מִמֶּנִּי וּמֵעַמִּי
  choice: dari aku dan dari rakyatku
  rationale: Preposisi מִן yang diulang dipertahankan demi penekanan. 'Rakyatku' paling alami ketika Firaun berbicara tentang bangsa yang diperintahnya.
- source_word: וַאֲשַׁלְּחָה
  choice: Aku akan membiarkan ... pergi
  rationale: Bentuk kohortatif menyatakan niat atau janji Firaun. Dalam konteks Keluaran, שלח dengan objek bangsa berarti membiarkan pergi atau melepaskan.
- source_word: אֶת הָעָם
  choice: bangsa itu
  rationale: הָעָם merujuk kepada Israel sebagai satu bangsa yang ditahan Firaun; 'bangsa itu' jelas dan mempertahankan sifat definitnya.
- source_word: וְיִזְבְּחוּ
  choice: supaya mereka mempersembahkan kurban
  rationale: Bentuk prefiks setelah pernyataan Firaun paling wajar menyatakan tujuan yang dimaksudkan. זבח berarti menyembelih atau mempersembahkan kurban; ungkapan ini jelas dalam bahasa Indonesia modern.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi לְ menandai penerima persembahan, dan nama ilahi dipertahankan sebagai 'Yahweh'.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama ilahi tanpa menggantinya dengan gelar; catatan menjelaskan bentuk sumber.
- issue: Hubungan klausa terakhir dengan janji Firaun
  choice: 'tujuan: ''supaya mereka mempersembahkan kurban kepada Yahweh'''
  alternative: 'koordinasi sederhana: ''dan mereka akan mempersembahkan kurban kepada Yahweh'''
  rationale: Verba prefiks yang mengikuti bentuk kohortatif dapat menyatakan tujuan atau hasil yang dimaksudkan. Terjemahan utama memakai hubungan tujuan yang paling alami dalam konteks, sementara kemungkinan koordinasi dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat tanpa menjadi kaku. 'Mohonlah dengan sungguh-sungguh' mempertahankan desakan leksikal; 'mempersembahkan kurban' mudah dipahami dan tetap sesuai dengan konteks ibadah. Semua penanda catatan kaki ditempatkan dalam teks utama.
