base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/008.yaml
  text: So Moses and Aaron went out from Pharaoh[a], and Moses cried out to Yahweh concerning the frogs that he had set upon Pharaoh.
translation:
  language: id
  text: Lalu Musa dan Harun pergi dari hadapan Firaun, dan Musa berseru kepada Yahweh mengenai katak-katak yang telah didatangkan-Nya kepada Firaun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang telah ditaruh-Nya bagi Firaun.” Kata kerja Ibrani ini juga dapat dipahami sebagai “yang telah Ia tetapkan terhadap Firaun”; dalam konteks tulah, “didatangkan kepada Firaun” menyatakan maksudnya secara idiomatis. Subjek “-Nya” tidak disebutkan secara eksplisit dalam klausa Ibrani, tetapi konteks paling kuat menunjuk kepada Yahweh.
    reason: lexical_alternative_and_implicit_subject
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: meninggalkan
  rationale: Bentuk naratif dari יצא menyatakan gerak keluar dari hadapan Firaun; “meninggalkan Firaun” alami dalam bahasa Indonesia dan jelas menyampaikan perpisahan dari hadapannya.
- source_word: מֵעִם
  choice: Firaun
  rationale: Dalam gabungan dengan verba keluar, מֵעִם berarti menjauh dari hadapan atau kebersamaan dengan seseorang; konstruksi “meninggalkan Firaun” menyampaikan maknanya secara wajar tanpa ungkapan kaku.
- source_word: וַיִּצְעַק
  choice: berseru
  rationale: צעק menunjukkan seruan kuat, di sini sebagai permohonan kepada Allah. “Berseru” mempertahankan intensitasnya tanpa mempersempit makna menjadi sekadar “berdoa”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai “Yahweh”, bukan diganti dengan suatu gelar.
- source_word: עַל דְּבַר
  choice: mengenai
  rationale: Ungkapan ini berarti “mengenai/berkenaan dengan” dan di sini menunjuk pada katak-katak sebagai pokok seruan Musa.
- source_word: הַצְפַרְדְּעִים
  choice: katak-katak
  rationale: Bentuk jamak tentu merujuk kepada katak-katak dalam tulah tersebut.
- source_word: אֲשֶׁר שָׂם לְפַרְעֹה
  choice: yang telah didatangkan-Nya atas Firaun
  rationale: שׂים secara harfiah berarti “menaruh/menempatkan”, tetapi dalam konteks tulah, “mendatangkan atas” secara idiomatis menyatakan bahwa katak-katak itu dikenakan kepada Firaun. Bentuk “-Nya” mempertahankan rujukan subjek yang secara kontekstual paling mungkin adalah Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama diri ilahi secara langsung; “Yahweh” mempertahankannya sebagai nama dan tidak menggantinya dengan gelar.
- issue: Subjek tersirat pada אֲשֶׁר שָׂם
  choice: Yahweh, dinyatakan melalui akhiran hormat “-Nya”
  alternative: Musa atau subjek yang dibiarkan sepenuhnya tidak dinyatakan
  rationale: Subjek verba maskulin tunggal tidak disebut secara eksplisit dalam klausa, tetapi konteks tulah dan penyebutan Yahweh segera sebelumnya paling alami menunjuk kepada Yahweh. Catatan kaki menjaga agar unsur tersirat ini transparan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Meninggalkan Firaun” menghindari kekakuan “keluar dari hadapan Firaun”; “berseru” mempertahankan daya emosional צעק. Penanda catatan kaki ditempatkan langsung sesudah klausa yang dijelaskannya.
