base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/023.yaml
  text: We will go a three days' journey into the wilderness and sacrifice to Yahweh our God[b][a], just as he tells us.
translation:
  language: id
  text: Kami akan pergi tiga hari perjalanan jauhnya ke padang belantara dan mempersembahkan kurban kepada Yahweh, Allah kami, seperti yang akan Dia firmankan kepada kami.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seperti yang Dia firmankan kepada kami.”
    reason: Bentuk imperfek Ibrani dapat dipahami sebagai perkataan yang akan disampaikan atau sebagai petunjuk yang dinyatakan secara kini atau umum.
lexical_decisions:
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: menempuh perjalanan tiga hari
  rationale: Ungkapan Ibrani memakai lamanya perjalanan sebagai ukuran jarak. Rumusan ini alami dalam bahasa Indonesia dan tetap mempertahankan gambaran perjalanan selama tiga hari.
- source_word: נֵלֵךְ
  choice: Kami akan menempuh
  rationale: Bentuk imperfek orang pertama jamak paling wajar menyatakan tindakan yang akan dilakukan; kata 'menempuh' dipadukan dengan frasa perjalanan agar idiomatis.
- source_word: בַּמִּדְבָּר
  choice: ke padang belantara
  rationale: מִדְבָּר menunjuk daerah liar atau tanah terbuka yang tidak dihuni, bukan selalu gurun pasir. Preposisi 'ke' sesuai dengan verba gerak.
- source_word: וְזָבַחְנוּ
  choice: dan mempersembahkan kurban
  rationale: זבח mengacu pada penyembelihan atau persembahan kurban. Frasa ini jelas menyampaikan tindakan ibadah tanpa menambahkan jenis kurban yang tidak disebutkan.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama ilahi dalam teks sumber tetap tampak.
- source_word: אֱלֹהֵינוּ
  choice: Allah kami
  rationale: Bentuk konstruksi dengan sufiks orang pertama jamak diterjemahkan langsung dan alami sebagai 'Allah kami'.
- source_word: כַּאֲשֶׁר
  choice: tepat seperti
  rationale: כַּאֲשֶׁר menyatakan kesesuaian; 'tepat seperti' menegaskan bahwa persembahan dilakukan menurut petunjuk ilahi.
- source_word: יֹאמַר אֵלֵינוּ
  choice: yang akan Dia firmankan kepada kami
  rationale: Imperfek יֹאמַר dapat menunjuk perkataan yang akan diberikan. 'Firmankan' sesuai dengan konteks perkataan Allah, sementara kemungkinan nuansa kini atau umum dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama diri perjanjian tanpa menggantinya dengan gelar.
- issue: Nuansa waktu יֹאמַר
  choice: yang akan Dia firmankan kepada kami
  alternative: yang Dia firmankan kepada kami
  rationale: Bentuk imperfek mendukung acuan ke petunjuk yang akan diberikan, tetapi juga dapat dipahami dengan nuansa kini atau umum; alternatif itu dicatat tanpa memaksakan satu penafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Padang belantara' dipilih daripada 'gurun' agar cakupan מִדְבָּר tidak dipersempit menjadi gurun pasir. Nama Yahweh dipertahankan sebagai nama diri.
