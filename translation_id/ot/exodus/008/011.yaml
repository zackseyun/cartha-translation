base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/011.yaml
  text: But when Pharaoh saw that there was relief[a], he hardened his heart and did not listen to them, just as Yahweh had said.
translation:
  language: id
  text: Namun, ketika Firaun melihat bahwa ada kelegaan[a], ia mengeraskan hatinya dan tidak mendengarkan mereka, sebagaimana yang telah difirmankan Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ada kelonggaran” atau “ada kesempatan bernapas.” Istilah Ibrani dapat menunjuk pada kelegaan, meredanya tekanan, atau suatu jeda.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: melihat
  rationale: Mempertahankan arti dasar ראה sekaligus wajar untuk pengenalan Firaun atas perubahan keadaan.
- source_word: כִּי הָיְתָה הָרְוָחָה
  choice: bahwa keadaan sudah lega
  rationale: הָרְוָחָה menunjuk pada kelegaan, kelonggaran, atau jeda dari tekanan. Ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan meredanya tulah.
- source_word: וְהַכְבֵּד אֶת לִבּוֹ
  choice: ia mengeraskan hatinya
  rationale: Bentuk kausatif aktif menempatkan Firaun sebagai pelaku. Ungkapan baku ini menyampaikan metafora Ibrani tentang sikap keras kepala tanpa mengubahnya menjadi bentuk pasif.
- source_word: וְלֹא שָׁמַע אֲלֵהֶם
  choice: dan tidak mau mendengarkan mereka
  rationale: שׁמע dengan אֶל berarti mendengarkan atau mengindahkan. 'Tidak mau' menyatakan penolakan yang disengaja dalam konteks, tanpa mempersempitnya secara berlebihan menjadi 'tidak menaati'.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: tepat seperti yang telah difirmankan Yahweh
  rationale: Menandai kesesuaian peristiwa dengan firman ilahi sebelumnya; 'telah' menyampaikan keberlakuan ujaran terdahulu dalam alur narasi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi sebagai nama diri, bukan menggantinya dengan gelar.
theological_decisions:
- issue: Pelaku pengerasan hati Firaun
  choice: Firaun digambarkan mengeraskan hatinya sendiri.
  alternative: Hatinya menjadi keras secara pasif atau Allah tersirat sebagai pelaku dalam ayat ini.
  rationale: Teks Ibrani memakai bentuk kausatif aktif dengan Firaun sebagai subjek. Terjemahan ini mempertahankan ketegangan dengan ayat-ayat lain yang menyebut Allah mengeraskan hati Firaun tanpa memasukkan gagasan itu ke dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Keadaan sudah lega' dipilih agar gambaran meredanya tekanan tetap jelas bagi pembaca umum; penanda [a] dicantumkan langsung dalam teks.
