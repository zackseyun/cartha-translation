base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/012.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Stretch out your staff and strike the dust of the earth, and it will become gnats throughout all the land of Egypt.’”
translation:
  language: id
  text: Kemudian Yahweh berfirman kepada Musa, “Katakanlah kepada Harun, ‘Ulurkan tongkatmu dan pukullah debu tanah. Debu itu akan menjadi agas[a] di seluruh negeri Mesir.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kutu”; istilah Ibrani ini mengacu pada serangga kecil yang menggigit atau mengganggu, tetapi jenisnya yang tepat tidak diketahui.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi secara langsung, sesuai bentuk nama diri dalam teks Ibrani.
- source_word: וַיֹּאמֶר
  choice: Kemudian ... berfirman
  rationale: ‘Kemudian’ menyampaikan kemajuan alur narasi dari waw-konsekutif; ‘berfirman’ merupakan ungkapan Indonesia yang wajar dan bermartabat untuk perkataan Allah.
- source_word: אֱמֹר
  choice: Katakanlah
  rationale: Bentuk imperatif kepada Musa yang memperkenalkan perkataan langsung untuk disampaikan kepada Harun.
- source_word: נְטֵה
  choice: Ulurkan
  rationale: Secara alami menyatakan tindakan merentangkan atau mengarahkan tongkat ke depan.
- source_word: מַטְּךָ
  choice: tongkatmu
  rationale: Padanan modern dan jelas bagi tongkat yang dibawa Harun.
- source_word: וְהַךְ
  choice: dan pukullah
  rationale: Mempertahankan daya imperatif verba נכה tanpa menggunakan ungkapan yang kuno.
- source_word: עֲפַר הָאָרֶץ
  choice: debu tanah
  rationale: Ungkapan Indonesia yang alami untuk debu atau partikel halus dari permukaan tanah.
- source_word: וְהָיָה לְכִנִּם
  choice: Debu itu akan menjadi agas
  rationale: Mengungkapkan hasil perubahan secara jelas. ‘Agas’ menunjuk serangga kecil yang mengganggu, tetapi ketidakpastian jenisnya tetap dijelaskan dalam catatan kaki.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: di seluruh negeri Mesir
  rationale: Menyampaikan cakupan menyeluruh atas wilayah Mesir dalam bahasa Indonesia yang alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri; ‘Yahweh’ mempertahankan nama itu tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat langsung dipertahankan, sedangkan ungkapan dibuat alami bagi pembaca umum. Catatan kaki menjaga ketidakpastian leksikal pada nama serangga.
