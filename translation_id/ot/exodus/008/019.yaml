  yaml_path: translation/ot/exodus/008/019.yaml
  text: And I will make a distinction between my people and your people[a]. Tomorrow this sign will happen.
translation:
  language: id
  text: Aku akan membuat perbedaan antara umat-Ku dan rakyatmu.[a] Besok tanda ini akan terjadi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penebusan” atau “pembebasan”; kata Ibrani ini dapat menunjuk pada tindakan Allah yang menebus, yang dalam konteks ini tampak melalui pembedaan antara Israel dan Mesir.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי
  choice: Aku akan membuat
  rationale: Kata kerja שׂים secara harfiah berarti ‘menaruh/menetapkan’, tetapi dengan objek abstrak פְדֻת dan konstruksi ‘antara ... dan ...’, ‘membuat’ menyampaikan maknanya secara alami dalam bahasa Indonesia.
- source_word: פְדֻת
  choice: perbedaan
  rationale: Dalam konteks ini, istilah tersebut menunjuk pada tindakan Allah yang membedakan Israel dari Mesir. Makna leksikal ‘penebusan’ atau ‘pembebasan’ tetap dipertahankan dalam catatan kaki.
- source_word: בֵּין ... וּבֵין
  choice: antara ... dan ...
  rationale: Padanan langsung dan alami bagi konstruksi korelatif yang menandai pembedaan dua kelompok.
- source_word: עַמִּי
  choice: umat-Ku
  rationale: ‘Umat’ sesuai untuk bangsa yang menjadi milik Allah, yakni Israel, dan bentuk ‘-Ku’ menyatakan kepemilikan orang pertama.
- source_word: עַמֶּךָ
  choice: rakyatmu
  rationale: Merujuk kepada rakyat Firaun, yaitu orang Mesir; ‘rakyatmu’ membedakannya secara alami dari sebutan perjanjian ‘umat-Ku’ tanpa mengubah acuannya.
- source_word: לְמָחָר
  choice: Besok
  rationale: Padanan temporal langsung; penempatannya di awal kalimat mempertahankan penekanan teks Ibrani.
- source_word: יִהְיֶה
  choice: akan terjadi
  rationale: Dengan ‘tanda ini’ sebagai subjek, ‘akan terjadi’ merupakan ungkapan bahasa Indonesia yang alami untuk keberlangsungan peristiwa yang diumumkan.
- source_word: הָאֹת הַזֶּה
  choice: tanda ini
  rationale: אוֹת lazim berarti tanda ilahi atau tindakan yang menjadi bukti dalam konteks tulah-tulah di kitab Keluaran.
theological_decisions:
- issue: Apakah פְדֻת diterjemahkan menurut nuansa teologisnya (‘penebusan/pembebasan’) atau menurut fungsi kontekstualnya sebagai pembedaan
  choice: perbedaan
  alternative: penebusan atau pembebasan
  rationale: Bingkai sintaksis ‘antara umat-Ku dan rakyatmu’ menekankan hasil konkret tindakan penyelamatan Allah, yaitu pembedaan Israel dari Mesir. Nuansa penebusan tidak dihapus, melainkan dijaga dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Aku’ dipakai untuk tuturan langsung Allah; ‘umat-Ku’ mempertahankan nuansa relasional, sedangkan ‘rakyatmu’ cocok bagi rakyat Firaun. Penanda catatan kaki ditempatkan tepat setelah klausa yang memuat istilah terkait.
