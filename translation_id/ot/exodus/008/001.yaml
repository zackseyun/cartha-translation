source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁה֒ אֱמֹ֣ר אֶֽל אַהֲרֹ֗ן נְטֵ֤ה אֶת יָדְ/ךָ֙ בְּ/מַטֶּ֔/ךָ עַל הַ֨/נְּהָרֹ֔ת עַל הַ/יְאֹרִ֖ים וְ/עַל הָ/אֲגַמִּ֑ים וְ/הַ֥עַל אֶת הַֽ/צְפַרְדְּעִ֖ים עַל אֶ֥רֶץ מִצְרָֽיִם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/001.yaml
  text: Then Yahweh said to Moses[a], “Say to Aaron, ‘Stretch out your hand with your staff over the rivers, over the canals, and over the pools, and bring up the frogs over the land of Egypt.’”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa, “Katakanlah kepada Harun, ‘Ulurkan tanganmu dengan tongkatmu di atas sungai-sungai, di atas saluran-saluran[a], dan di atas kolam-kolam, lalu naikkanlah katak-katak ke atas tanah Mesir.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “saluran-saluran Sungai Nil”; istilah Ibrani ini dalam konteks Mesir sering menunjuk pada perairan yang berkaitan dengan Sungai Nil.
    reason: Mencatat kemungkinan pengertian khusus יְאֹרִים tanpa menjadikannya pembatasan yang tidak perlu dalam teks utama.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan membedakannya dari gelar seperti “Tuhan”.
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Bentuk naratif ini melanjutkan urutan peristiwa; “lalu” wajar dalam narasi Indonesia, sedangkan “berfirman” sesuai untuk ucapan Allah.
- source_word: אֱמֹר
  choice: Katakanlah
  rationale: Padanan imperatif yang alami dan tepat untuk perintah kepada Musa agar menyampaikan perkataan berikutnya.
- source_word: נְטֵה אֶת־יָדְךָ
  choice: Ulurkan tanganmu
  rationale: Mempertahankan gambaran tindakan mengulurkan tangan tanpa memperluas “tangan” menjadi “lengan”.
- source_word: בְּמַטֶּךָ
  choice: dengan tongkatmu
  rationale: 'Preposisi dipahami secara instrumental: Harun mengulurkan tangannya dengan menggunakan tongkatnya.'
- source_word: הַנְּהָרֹת
  choice: sungai-sungai
  rationale: Padanan umum yang mempertahankan unsur pertama dalam daftar tiga jenis perairan.
- source_word: הַיְאֹרִים
  choice: saluran-saluran Sungai Nil
  rationale: Dalam konteks Mesir, bentuk jamak istilah ini menunjuk pada aliran atau saluran yang berkaitan dengan Sungai Nil; terjemahan ini membedakannya dari sungai-sungai dan kolam-kolam.
- source_word: הָאֲגַמִּים
  choice: kolam-kolam
  rationale: Menggambarkan kumpulan air dan mempertahankan perbedaannya dari sungai serta saluran Sungai Nil.
- source_word: וְהַעַל
  choice: lalu buatlah ... naik
  rationale: Mempertahankan bentuk kausatif verba עלה, yakni menyebabkan katak-katak naik.
- source_word: הַצְפַרְדְּעִים
  choice: katak-katak
  rationale: Padanan langsung bagi hewan yang menjadi tulah dalam konteks ini.
- source_word: עַל אֶרֶץ מִצְרָיִם
  choice: ke tanah Mesir
  rationale: Dalam hubungan dengan verba “naik”, preposisi עַל secara alami menyatakan gerakan menuju atau ke atas daratan Mesir tanpa menambahkan gagasan “di seluruh” yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama perjanjian itu alih-alih menggantinya dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan “ke atas” dipertahankan pada ketiga jenis perairan untuk mencerminkan susunan Ibrani, sementara “lalu buatlah ... naik” menyampaikan bentuk kausatif secara wajar.
