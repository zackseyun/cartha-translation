  naturalness: Bahasa umumnya baku, jelas, dan sesuai register naratif yang khidmat. «Sesuai dengan perkataanmu» lebih alami dan lebih dekat pada elipsis ujaran Ibrani daripada «Jadilah sesuai perkataanmu».
  terminology: «Yahweh, Allah kita» secara tepat mempertahankan nama ilahi יהוה dan אֱלֹהֵינוּ sebagai rujukan tunggal. «Tidak ada yang seperti Yahweh, Allah kita» mempertahankan cakupan terbuka dari teks sumber tanpa menambahkan nomina seperti «allah» atau «dewa».
