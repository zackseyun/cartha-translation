  yaml_path: translation/ot/exodus/008/006.yaml
  text: He said[a], “Tomorrow.” And he said, “According to your word, so that you may know that there is no one like Yahweh our God.”
translation:
  language: id
  text: Ia menjawab, “Besok.” Lalu Musa berkata, “Sesuai dengan perkataanmu, supaya engkau tahu bahwa tidak ada yang seperti Yahweh, Allah kita.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ia menjawab / Lalu Musa berkata
  rationale: Kedua bentuk adalah verba naratif dari אמר. Pada kemunculan pertama, konteks menunjukkan jawaban Firaun; pada kemunculan kedua, konteks menunjukkan Musa sebagai pembicara. Nama Musa dicantumkan agar pergantian pembicara jelas dalam bahasa Indonesia.
- source_word: לְמָחָר
  choice: Besok
  rationale: Jawaban waktu yang langsung dan alami dalam bahasa Indonesia.
- source_word: כִּדְבָרְךָ
  choice: sesuai perkataanmu
  rationale: Mempertahankan idiom Ibrani ‘sesuai perkataanmu’ sekaligus tetap mudah dipahami.
- source_word: לְמַעַן תֵּדַע
  choice: supaya engkau tahu
  rationale: לְמַעַן memperkenalkan tujuan; bentuk orang kedua tunggal ditujukan kepada Firaun dan dipertahankan dengan ‘engkau’.
- source_word: אֵין כַּיהוָה
  choice: tidak ada yang seperti Yahweh
  rationale: אֵין menyatakan ketiadaan, sedangkan כְּ menandai perbandingan; terjemahan ini mempertahankan penegasan bahwa tiada satu pun yang sebanding dengan Yahweh.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Dalam konteks ini אֱלֹהִים merujuk kepada Allah Israel yang tunggal, dengan sufiks orang pertama jamak ‘kita’.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Nama perjanjian יְהוָה ditransliterasikan sebagai ‘Yahweh’, sehingga nama yang hadir secara eksplisit dalam teks sumber tetap terlihat dan tidak diganti dengan gelar.
- issue: Cakupan perbandingan אֵין כַּיהוָה
  choice: tidak ada yang seperti Yahweh
  alternative: tidak ada Allah seperti Yahweh
  rationale: Teks Ibrani tidak menyertakan nomina sesudah אֵין sebelum frasa perbandingan. Rumusan ‘tidak ada yang seperti’ mempertahankan cakupan terbuka itu dan tidak membatasinya secara eksplisit hanya kepada para ilah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. ‘Engkau’ dipakai untuk sapaan tunggal kepada Firaun. Ungkapan ‘Jadilah sesuai perkataanmu’ mempertahankan bentuk penerimaan/peneguhan perkataan Firaun tanpa menambahkan rincian yang tidak dinyatakan dalam ayat.
