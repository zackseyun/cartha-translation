  text: So Moses went out from Pharaoh and pleaded with Yahweh[a].
translation:
  language: id
  text: Lalu Musa pergi dari hadapan Firaun dan memohon dengan sungguh-sungguh kepada Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “berdoa dengan sungguh-sungguh kepada Yahweh.” Kata kerja Ibraninya menyatakan permohonan atau doa yang mendesak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: meninggalkan
  rationale: Bentuk Qal wayyiqtol dari יצא menyatakan kepergian fisik dalam rangkaian narasi. Dalam konteks מֵעִם פַּרְעֹה, 'meninggalkan Firaun' alami dalam bahasa Indonesia dan menyampaikan bahwa Musa pergi dari hadapan Firaun.
- source_word: מֵעִם
  choice: dari (tercakup dalam 'meninggalkan Firaun')
  rationale: Gabungan מִן dan עִם menandai pemisahan dari kebersamaan atau hadapan seseorang. Maknanya tersampaikan secara idiomatis oleh konstruksi 'meninggalkan Firaun'.
- source_word: פַּרְעֹה
  choice: Firaun
  rationale: Bentuk baku bahasa Indonesia untuk gelar penguasa Mesir dalam Kitab Keluaran.
- source_word: וַיֶּעְתַּר
  choice: memohon dengan sungguh-sungguh
  rationale: Kata kerja עתר menyatakan permohonan atau doa yang mendesak dan sungguh-sungguh, bukan sekadar tindakan berdoa secara umum.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi אֶל menandai pihak yang dituju oleh permohonan; 'kepada' merupakan padanan alami dan langsung dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri melalui transliterasi 'Yahweh', bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. 'Yahweh' mempertahankan fungsi nama diri dan mengikuti bukti sumber tanpa menggantinya dengan gelar.
- issue: Nuansa doa syafaat Musa dalam וַיֶּעְתַּר
  choice: memohon dengan sungguh-sungguh kepada Yahweh
  alternative: berdoa kepada Yahweh
  rationale: Pilihan ini mempertahankan intensitas leksikal עתר tanpa menambahkan isi atau hasil permohonan yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Lalu' menjaga kesinambungan narasi; 'memohon dengan sungguh-sungguh' mudah dipahami sekaligus mempertahankan daya kata kerja Ibrani.
