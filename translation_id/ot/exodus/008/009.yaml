  text: וַ/יַּ֥עַשׂ יְהוָ֖ה כִּ/דְבַ֣ר מֹשֶׁ֑ה וַ/יָּמֻ֨תוּ֙ הַֽ/צְפַרְדְּעִ֔ים מִן הַ/בָּתִּ֥ים מִן הַ/חֲצֵרֹ֖ת וּ/מִן הַ/שָּׂדֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/009.yaml
  text: And the LORD did according to the word of Moses, and the frogs died out of the houses, out of the courtyards, and out of the fields.
translation:
  language: id
  text: TUHAN melakukan sesuai dengan perkataan Musa. Katak-katak itu pun mati di rumah-rumah, di halaman-halaman, dan di ladang-ladang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia untuk nama ilahi YHWH dengan huruf kapital, tanpa memasukkan vokalisasi tertentu ke dalam teks utama.
- source_word: כִדְבַר מֹשֶׁה
  choice: sesuai dengan perkataan Musa
  rationale: Mencerminkan ungkapan Ibrani secara wajar; דָּבָר di sini menunjuk pada ucapan atau permintaan yang disampaikan Musa.
- source_word: וַיָּמֻתוּ הַצְפַרְדְּעִים
  choice: Katak-katak itu pun mati
  rationale: Bentuk jamak dan artikel tentu dipertahankan; kata 'pun' secara alami menandai hasil lanjutan dalam narasi.
- source_word: מִן הַבָּתִּים מִן הַחֲצֵרֹת וּמִן הַשָּׂדֹת
  choice: di rumah-rumah, di halaman-halaman, dan di ladang-ladang
  rationale: Dalam konteks verba 'mati', מִן menyatakan lokasi atau lingkungan tempat katak-katak mati, bukan gerakan keluar. Pengulangan bentuk jamak dipertahankan.
theological_decisions:
- issue: Penyajian nama perjanjian יהוה
  choice: TUHAN
  alternative: YHWH atau Yahweh
  rationale: Pilihan ini mempertahankan tradisi penerjemahan Indonesia yang dikenal luas dan tidak menetapkan rekonstruksi pelafalan dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Struktur dua klausa Ibrani dipisahkan menjadi dua kalimat agar alami, sedangkan hubungan akibat tetap ditandai oleh 'pun'.
