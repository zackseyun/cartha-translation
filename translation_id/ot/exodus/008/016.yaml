  naturalness: Bahasa terjemahan baku dan jelas. “Lihatlah” lebih alami sebagai padanan הִנֵּה dalam konteks ini, dan “sedang pergi menuju air” mempertahankan ungkapan sumber tanpa menambahkan “Sungai Nil,” yang tidak tertulis pada ayat ini.
  terminology: “TUHAN” untuk יהוה, “Firaun,” “umat-Ku,” dan “beribadah kepada-Ku” dapat diterima. “Beribadah” secara wajar menyampaikan nuansa kultis עבד dalam konteks tuntutan pembebasan ini, tanpa meniadakan unsur pelayanan.
