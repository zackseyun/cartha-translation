base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/016.yaml
  text: 'Then the LORD said to Moses, “Rise early in the morning and station yourself before Pharaoh. Look, he is going out to the water, and you shall say to him, ‘Thus says the LORD: Let my people go, so that they may serve me.’”'
translation:
  language: id
  text: 'Lalu TUHAN berfirman kepada Musa, “Bangunlah pagi-pagi dan berdirilah di hadapan Firaun. Lihatlah, ia sedang pergi menuju air. Katakanlah kepadanya, ‘Beginilah firman TUHAN: Biarkan umat-Ku pergi supaya mereka beribadah kepada-Ku.’”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: Bangunlah pagi-pagi
  rationale: Ungkapan idiomatis Ibrani ini menyatakan bangun atau bertindak pada pagi-pagi sekali; terjemahan ini alami dan tetap dekat dengan bentuk sumber.
- source_word: וְהִתְיַצֵּב לִפְנֵי פַרְעֹה
  choice: dan berdirilah di hadapan Firaun
  rationale: Hitpael dari יצב menyiratkan mengambil posisi atau menempatkan diri; 'berdirilah di hadapan' mempertahankan gambaran konkret dan nada perintah.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Mempertahankan penanda perhatian dalam teks sumber tanpa memakai 'sesungguhnya' yang kurang alami dalam konteks naratif ini.
- source_word: יוֹצֵא הַמָּיְמָה
  choice: ia akan keluar menuju ke air
  rationale: Partisipel menggambarkan tindakan yang segera atau sudah direncanakan; 'akan keluar' sesuai konteks, sedangkan akhiran direktif pada מימה diterjemahkan 'menuju ke air'.
- source_word: שַׁלַּח עַמִּי
  choice: Biarkan umat-Ku pergi
  rationale: Piel imperatif שלח dalam konteks ini menuntut pelepasan; pilihan ini alami dalam bahasa Indonesia dan mempertahankan tuntutan langsung.
- source_word: וְיַעַבְדֻנִי
  choice: supaya mereka beribadah kepada-Ku
  rationale: עבד dapat berarti melayani atau beribadah. Dalam tuntutan pembebasan Israel untuk menghadap TUHAN, 'beribadah' menyampaikan maksud kultisnya dengan jelas.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH atau Yahweh
  rationale: Memakai konvensi Alkitab bahasa Indonesia yang luas dikenal, dengan huruf kapital untuk membedakannya sebagai representasi nama ilahi, tanpa mengimpor rekonstruksi pelafalan ke dalam teks utama.
- issue: Makna עבד dalam tujuan pembebasan Israel
  choice: beribadah kepada-Ku
  alternative: melayani Aku
  rationale: Konteks Keluaran menekankan pelayanan kepada Allah yang terwujud dalam ibadah; pilihan ini tidak meniadakan nuansa pengabdian, tetapi menyampaikan maksud kontekstual secara alami.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Struktur perintah serta formula kenabian dipertahankan, sementara urutan kata disesuaikan agar alami bagi pembaca Indonesia.
