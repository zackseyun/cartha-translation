  source_fidelity: 'Teks Indonesia menyampaikan seluruh unsur Ibrani secara akurat: ujaran Firaun, izin untuk pergi, tujuan mempersembahkan kurban kepada Yahweh, lokasi di padang gurun, pembatasan agar tidak pergi jauh, serta permintaan agar mereka memohon dengan sungguh-sungguh baginya. Penekanan pada larangan untuk pergi jauh tersampaikan secara idiomatis melalui “jangan pergi terlalu jauh.”'
