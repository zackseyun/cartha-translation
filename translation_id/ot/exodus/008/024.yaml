  text: וַ/יֹּ֣אמֶר פַּרְעֹ֗ה אָנֹכִ֞י אֲשַׁלַּ֤ח אֶתְ/כֶם֙ וּ/זְבַחְתֶּ֞ם לַ/יהוָ֤ה אֱלֹֽהֵי/כֶם֙ בַּ/מִּדְבָּ֔ר רַ֛ק הַרְחֵ֥ק לֹא תַרְחִ֖יקוּ לָ/לֶ֑כֶת הַעְתִּ֖ירוּ בַּעֲדִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/024.yaml
  text: Then Pharaoh said, “I will let you go, so that you may sacrifice to Yahweh your God in the wilderness. Only, you must not go very far away. Plead for me.”
translation:
  language: id
  text: Lalu Firaun berkata, “Aku akan membiarkan kalian pergi untuk mempersembahkan kurban kepada Yahweh, Allah kalian, di padang gurun. Hanya saja, jangan pergi terlalu jauh. Berdoalah dengan sungguh-sungguh untukku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “Lalu” menyatakan urutan secara wajar dalam narasi Indonesia.
- source_word: פַּרְעֹה
  choice: Firaun
  rationale: Bentuk baku bahasa Indonesia untuk gelar raja Mesir.
- source_word: אָנֹכִי אֲשַׁלַּח אֶתְכֶם
  choice: Aku akan membiarkan kalian pergi
  rationale: Dalam konteks perundingan ini, שׁלח berarti mengizinkan atau melepaskan mereka untuk pergi. “Kalian” menyatakan objek jamak dengan jelas.
- source_word: וּזְבַחְתֶּם
  choice: untuk mempersembahkan kurban
  rationale: Klausa ini menyatakan tujuan dari izin untuk pergi. “Mempersembahkan kurban” alami dan tepat bagi tindakan ritual זבח.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri perjanjian, bukan diganti dengan gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allah kalian
  rationale: Konstruksi posesif jamak diterjemahkan langsung dan dibedakan dari sapaan tunggal.
- source_word: בַּמִּדְבָּר
  choice: di padang gurun
  rationale: Padanan Indonesia yang lazim untuk wilayah liar atau tidak dibudidayakan tanpa mempersempit maknanya menjadi gurun pasir semata.
- source_word: רַק
  choice: Hanya saja
  rationale: Memperkenalkan syarat pembatas yang dikenakan Firaun dengan alami.
- source_word: הַרְחֵק לֹא תַרְחִיקוּ לָלֶכֶת
  choice: jangan pergi terlalu jauh
  rationale: Infinitif absolut bersama verba seakar memberi penekanan pada jarak; larangan idiomatis ini mempertahankan daya pembatasnya.
- source_word: הַעְתִּירוּ בַּעֲדִי
  choice: Berdoalah dengan sungguh-sungguh untukku
  rationale: Bentuk hiphil עתר menunjuk pada permohonan doa yang sungguh-sungguh demi kepentingan Firaun; padanan ini lebih jelas bagi pembaca umum daripada “mohonkanlah”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan fungsinya sebagai nama diri Allah tanpa menggantinya dengan gelar.
- issue: Objek tersirat dari הַעְתִּירוּ
  choice: Berdoalah dengan sungguh-sungguh untukku
  alternative: Mohonkanlah untukku
  rationale: Teks tidak menyebutkan secara eksplisit kepada siapa permohonan itu ditujukan, meski konteksnya jelas mengarah kepada Yahweh. Terjemahan tidak menambahkan objek ilahi yang tidak tertulis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Aku/kalian” mempertahankan pembedaan orang pertama tunggal dan orang kedua jamak; susunan kalimat dibuat alami tanpa menghilangkan pembatasan tegas Firaun.
