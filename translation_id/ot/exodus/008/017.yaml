base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/017.yaml
  text: For if you do not let my people go[a], behold, I am sending the swarm upon you, upon your servants, upon your people, and into your houses. The houses of Egypt will be filled with the swarm[b], and also the ground on which they are.
translation:
  language: id
  text: Sebab, jika engkau tidak membiarkan umat-Ku pergi, sesungguhnya Aku akan mengirimkan kawanan[a] kepadamu, kepada para hambamu, kepada rakyatmu, dan ke rumah-rumahmu. Rumah-rumah orang Mesir akan dipenuhi kawanan itu, demikian juga tanah[b] tempat mereka berada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “lalat.” Kata Ibrani עָרֹב mungkin menunjuk suatu kawanan dan secara tradisional dipahami sebagai lalat, tetapi jenis makhluknya tidak dapat dipastikan.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “negeri.” Kata Ibrani אֲדָמָה dapat berarti tanah atau negeri.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Sebab, jika
  rationale: Gabungan ini memperkenalkan peringatan bersyarat yang berlandaskan perkataan sebelumnya; “Sebab, jika” mempertahankan hubungan logis tersebut secara wajar dalam bahasa Indonesia.
- source_word: אֵינְךָ מְשַׁלֵּחַ אֶת עַמִּי
  choice: engkau tidak membiarkan umat-Ku pergi
  rationale: Dalam kisah Keluaran, שׁלח dengan עַמִּי menyatakan pembebasan atau pemberian izin untuk pergi, bukan sekadar mengutus.
- source_word: הִנְנִי מַשְׁלִיחַ
  choice: sesungguhnya Aku akan mengirimkan
  rationale: הִנְנִי memberi tekanan khidmat pada pengumuman, sedangkan bentuk partisip menyatakan tindakan yang segera dan pasti terjadi. Bentuk mendatang lebih alami dalam konteks ancaman bahasa Indonesia.
- source_word: הֶעָרֹב
  choice: kawanan
  rationale: Identitas tepat עָרֹב tidak pasti. “Kawanan” mempertahankan gagasan kumpulan makhluk tanpa menetapkan bahwa yang dimaksud pasti lalat.
- source_word: בְּךָ ... וּבַעֲבָדֶיךָ וּבְעַמְּךָ
  choice: kepadamu, kepada para pegawaimu, kepada rakyatmu
  rationale: Preposisi ב menandai pihak-pihak yang akan terkena tulah. Pengulangan “kepada” mempertahankan susunan retoris sumber.
- source_word: עֲבָדֶיךָ
  choice: para pegawaimu
  rationale: Dalam konteks istana Firaun, עֶבֶד dapat menunjuk para abdi atau pejabat kerajaan. “Pegawai” dapat dipahami pembaca modern tanpa menyempitkannya menjadi budak.
- source_word: וּבְבָתֶּיךָ
  choice: dan ke rumah-rumahmu
  rationale: Meskipun ב pada dasarnya berarti “di/dalam”, arah gerak kawanan yang dikirim membuat “ke” alami; kalimat berikutnya menegaskan bahwa rumah-rumah itu akan dipenuhi.
- source_word: וּמָלְאוּ בָּתֵּי מִצְרַיִם
  choice: Rumah-rumah orang Mesir akan dipenuhi
  rationale: Ungkapan ini menyampaikan akibat bahwa rumah-rumah di Mesir, yakni rumah orang Mesir, menjadi penuh oleh kawanan tersebut.
- source_word: וְגַם הָאֲדָמָה
  choice: demikian juga tanah
  rationale: אֲדָמָה dapat berarti tanah atau negeri. Dalam kontras dengan rumah-rumah dan dengan frasa “tempat mereka berada”, “tanah” secara alami menunjuk permukaan yang tertutupi.
- source_word: אֲשֶׁר הֵם עָלֶיהָ
  choice: tempat mereka berada
  rationale: Terjemahan ini mempertahankan acuan jamak “mereka” dan menyampaikan hubungan lokatif secara alami tanpa menambahkan bahwa mereka sedang berdiri.
