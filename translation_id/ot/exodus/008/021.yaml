  text: Then Pharaoh called Moses and Aaron and said[a], “Go, sacrifice to your God in the land.”
translation:
  language: id
  text: Kemudian Firaun memanggil Musa dan Harun, lalu berkata, “Pergilah, persembahkanlah kurban kepada Allahmu di negeri ini.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di negeri itu”; maksudnya, di Mesir.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: memanggil
  rationale: Dalam konteks narasi ini, קרא berarti memanggil atau menyuruh datang. 'Memanggil' alami dalam bahasa Indonesia dan tidak melebihkan nuansa resmi seperti 'memanggil menghadap'.
- source_word: פַרְעֹה
  choice: Firaun
  rationale: Bentuk baku bahasa Indonesia untuk gelar raja Mesir.
- source_word: אֶל מֹשֶׁה וּלְאַהֲרֹן
  choice: Musa dan Harun
  rationale: Dengan verba 'memanggil', objek langsung tanpa preposisi merupakan susunan yang paling alami dalam bahasa Indonesia.
- source_word: וַיֹּאמֶר
  choice: lalu berkata
  rationale: Menerjemahkan verba naratif אמר sambil menandai kelanjutan tindakan; lawan bicara sudah jelas dari konteks.
- source_word: לְכוּ
  choice: Pergilah
  rationale: Imperatif jamak הלך yang memberi izin atau perintah untuk pergi; sufiks '-lah' menghasilkan perintah yang wajar dan bermartabat.
- source_word: זִבְחוּ
  choice: persembahkanlah kurban
  rationale: זבח merujuk pada tindakan mempersembahkan kurban. Ungkapan ini lebih jelas dan alami bagi pembaca Indonesia daripada memakai 'berkurban', yang dapat menimbulkan asosiasi berbeda.
- source_word: לֵאלֹהֵיכֶם
  choice: kepada Allahmu
  rationale: Lamed menandai tujuan atau penerima persembahan. Bentuk sumber memiliki sufiks orang kedua jamak, tetapi bahasa Indonesia lazim memakai '-mu' untuk kepunyaan kolektif ketika menyapa suatu kelompok.
- source_word: בָּאָרֶץ
  choice: di negeri ini
  rationale: Secara harfiah berarti 'di negeri itu/di negeri tersebut', tetapi dalam ujaran Firaun konteks deiktisnya adalah negeri tempat mereka berada, yaitu Mesir. 'Di negeri ini' mempertahankan sebutan umum tanpa menggantinya langsung dengan 'Mesir'.
