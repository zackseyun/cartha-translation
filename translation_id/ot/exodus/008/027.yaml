id: EXO.8.27
reference: Exodus 8:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֤עַשׂ יְהוָה֙ כִּ/דְבַ֣ר מֹשֶׁ֔ה וַ/יָּ֨סַר֙ הֶ/עָרֹ֔ב מִ/פַּרְעֹ֖ה מֵ/עֲבָדָ֣י/ו וּ/מֵ/עַמּ֑/וֹ לֹ֥א נִשְׁאַ֖ר אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/027.yaml
  text: And Yahweh did according to Moses' word[a], and removed the swarm from Pharaoh, from his servants, and from his people; not one remained.
translation:
  language: id
  text: Yahweh bertindak sesuai dengan perkataan Musa dan menyingkirkan kawanan serangga[a] dari Firaun, dari para pegawainya, dan dari rakyatnya. Tidak seekor pun tersisa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kawanan lalat”. Kata Ibrani עָרֹב menunjuk pada wabah berupa kawanan makhluk pengganggu, tetapi istilah itu sendiri tidak menentukan spesiesnya secara pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani sebagai nama pribadi, bukan menggantinya dengan gelar.
- source_word: וַיַּעַשׂ
  choice: bertindak
  rationale: Dalam konstruksi 'sesuai dengan perkataan Musa', 'bertindak' mengungkapkan makna luas עשה secara alami dan menghindari ungkapan Indonesia yang kaku.
- source_word: כִּדְבַר מֹשֶׁה
  choice: sesuai dengan perkataan Musa
  rationale: Mempertahankan unsur דָּבָר sebagai perkataan atau pernyataan sambil memakai susunan Indonesia yang wajar.
- source_word: וַיָּסַר
  choice: menyingkirkan
  rationale: Bentuk Hifil dari סור menyatakan tindakan menjauhkan atau menghilangkan wabah dari pihak-pihak yang disebutkan.
- source_word: הֶעָרֹב
  choice: kawanan serangga
  rationale: עָרֹב menunjuk pada wabah berupa kawanan makhluk pengganggu; 'serangga' cocok dengan konteks tanpa menentukan spesies tertentu.
- source_word: מִפַּרְעֹה מֵעֲבָדָיו וּמֵעַמּוֹ
  choice: dari Firaun, dari para pegawainya, dan dari rakyatnya
  rationale: Pengulangan 'dari' mencerminkan pengulangan preposisi מִן dan menegaskan bahwa wabah disingkirkan dari ketiga lingkup tersebut. עֲבָדִים di lingkungan istana diterjemahkan 'pegawai' agar tidak otomatis mempersempit maknanya menjadi budak.
- source_word: לֹא נִשְׁאַר אֶחָד
  choice: Tidak seekor pun tersisa
  rationale: Mempertahankan penekanan singular אֶחָד; penggolong 'seekor' disesuaikan dengan kawanan makhluk hidup.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama perjanjian, bukan menggantinya dengan sebuah gelar.
- issue: Identitas עָרֹב
  choice: kawanan serangga
  alternative: kawanan lalat; kawanan campuran
  rationale: Istilah Ibrani tidak menetapkan spesies secara pasti. Terjemahan utama tidak memilih identifikasi khusus yang melampaui bukti leksikal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Pengulangan 'dari' dipertahankan untuk mengikuti penekanan Ibrani, sedangkan kalimat terakhir dipisahkan agar penutupnya tegas.
