translation:
  language: id
  text: Lalu Harun mengulurkan tangannya di atas perairan Mesir, lalu katak-katak[a] itu muncul dan menutupi tanah Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani memakai bentuk tunggal, “katak”, yang kemungkinan berfungsi secara kolektif; karena itu diterjemahkan “katak-katak”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: mengulurkan
  rationale: Dalam konteks tanda tulah, verba נטה menggambarkan tindakan merentangkan atau mengulurkan tangan; “mengulurkan” alami dalam bahasa Indonesia dan mempertahankan gerak tindakan tersebut.
- source_word: יָדוֹ
  choice: tangannya
  rationale: Teks Ibrani secara konkret menyebut “tangannya,” bukan lengannya.
- source_word: עַל
  choice: ke atas
  rationale: Ungkapan ini menyampaikan arah atau posisi tangan terhadap perairan dengan bahasa Indonesia yang alami.
- source_word: מֵימֵי מִצְרָיִם
  choice: perairan Mesir
  rationale: Bentuk jamak konstruksi menunjuk secara kolektif pada berbagai badan air di Mesir; “perairan” ringkas dan idiomatis.
- source_word: וַתַּעַל
  choice: bermunculan
  rationale: Verba עלה menggambarkan katak-katak naik keluar dari air dan muncul di daratan; “bermunculan” juga sesuai dengan subjek kolektif yang sangat banyak.
- source_word: הַצְּפַרְדֵּעַ
  choice: katak-katak
  rationale: Walaupun secara bentuk merupakan nomina tunggal berartikel, kata ini kemungkinan berfungsi sebagai tunggal kolektif, sehingga bentuk jamak lebih alami dalam bahasa Indonesia.
- source_word: וַתְּכַס
  choice: menutupi
  rationale: Pilihan ini langsung mencerminkan makna dasar כסה tanpa menambahkan gambaran yang tidak dinyatakan teks.
- source_word: אֶרֶץ מִצְרָיִם
  choice: tanah Mesir
  rationale: אֶרֶץ di sini menunjuk wilayah atau daratan Mesir; “tanah Mesir” mempertahankan citra spasial dan kontras dengan perairannya.
