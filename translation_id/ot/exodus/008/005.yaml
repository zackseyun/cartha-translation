  text: וַ/יֹּ֣אמֶר מֹשֶׁ֣ה לְ/פַרְעֹה֮ הִתְפָּאֵ֣ר עָלַ/י֒ לְ/מָתַ֣י אַעְתִּ֣יר לְ/ךָ֗ וְ/לַ/עֲבָדֶ֨י/ךָ֙ וּֽ/לְ/עַמְּ/ךָ֔ לְ/הַכְרִית֙ הַֽ/צֲפַרְדְּעִ֔ים מִמְּ/ךָ֖ וּ/מִ/בָּתֶּ֑י/ךָ רַ֥ק בַּ/יְאֹ֖ר תִּשָּׁאַֽרְנָה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/005.yaml
  text: 'And Moses said to Pharaoh[a], “Have this honor over me: when shall I plead for you, for your servants, and for your people, to cut off the frogs from you and from your houses? Only in the Nile shall they remain.”'
translation:
  language: id
  text: Lalu Musa berkata kepada Firaun[a], “Silakan tentukan kapan aku akan memohon bagi engkau, bagi para pegawaimu, dan bagi rakyatmu, supaya katak-katak itu lenyap darimu dan dari rumah-rumahmu. Katak-katak itu hanya akan tersisa di Sungai Nil.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Bermegahlah atas aku” atau “Ambillah kehormatan atas aku.” Ungkapan Ibrani ini sulit; dalam konteksnya, Musa mempersilakan Firaun menentukan kapan Musa akan memohon.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְפָּאֵר עָלַי
  choice: Silakan tentukan
  rationale: Ungkapan Ibrani ini sulit dan secara harfiah berkaitan dengan membanggakan diri atau mengambil kehormatan atas Musa. Dalam konteks, Musa memberi Firaun kehormatan untuk menentukan waktu; terjemahan ini menyampaikan fungsi idiom tersebut secara alami, sementara nuansa harfiahnya dicatat dalam catatan kaki.
- source_word: לְמָתַי
  choice: kapan
  rationale: Kata tanya ini meminta Firaun menentukan waktu permohonan Musa.
- source_word: אַעְתִּיר
  choice: aku harus memohon
  rationale: Bentuk Hifil dari עתר menunjuk pada permohonan sungguh-sungguh, dalam konteks ini kepada Allah. 'Memohon' alami dan tidak menambahkan istilah teologis teknis.
- source_word: לְךָ וְלַעֲבָדֶיךָ וּלְעַמְּךָ
  choice: bagi engkau, bagi para pegawaimu, dan bagi rakyatmu
  rationale: Pengulangan 'bagi' mempertahankan tekanan struktur Ibrani. עֲבָדִים dalam lingkungan istana Firaun dapat menunjuk para pegawai atau pejabat; 'pegawai' lebih wajar daripada 'hamba' dalam konteks ini.
- source_word: לְהַכְרִית
  choice: supaya ... dilenyapkan
  rationale: כרת secara harfiah berarti 'memotong' atau 'melenyapkan'. Bentuk pasif ini alami dalam bahasa Indonesia dan menyatakan penghapusan katak-katak dari tempat-tempat yang disebutkan.
- source_word: הַצֲפַרְדְּעִים
  choice: katak-katak itu
  rationale: Padanan langsung yang mempertahankan bentuk jamak dan rujukan tertentu.
- source_word: מִמְּךָ וּמִבָּתֶּיךָ
  choice: dari engkau dan dari rumah-rumahmu
  rationale: Pengulangan preposisi dipertahankan untuk membedakan Firaun sendiri dari rumah-rumahnya.
- source_word: רַק
  choice: hanya
  rationale: 'Menandai pengecualian: katak-katak akan disingkirkan dari tempat lain, tetapi tetap berada di Sungai Nil.'
- source_word: בַּיְאֹר
  choice: di Sungai Nil
  rationale: יְאֹר dalam latar Mesir pada kitab Keluaran merujuk secara khusus kepada Sungai Nil.
- source_word: תִּשָּׁאַרְנָה
  choice: akan tinggal
  rationale: Bentuk Nifal dari שׁאר menyatakan tetap ada atau tersisa. 'Akan tinggal' jelas dan alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Engkau' dipakai dalam dialog langsung kepada Firaun; 'para pegawaimu' menghindari kesan bahwa עֲבָדִים di sini harus berarti budak. Susunan kalimat dibuat alami tanpa menghilangkan cakupan permohonan atau pengecualian Sungai Nil.
