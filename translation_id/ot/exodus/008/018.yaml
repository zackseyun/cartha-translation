source:
  edition: WLC
  text: וְ/הִפְלֵיתִי֩ בַ/יּ֨וֹם הַ/ה֜וּא אֶת אֶ֣רֶץ גֹּ֗שֶׁן אֲשֶׁ֤ר עַמִּ/י֙ עֹמֵ֣ד עָלֶ֔י/הָ לְ/בִלְתִּ֥י הֱיֽוֹת שָׁ֖ם עָרֹ֑ב לְמַ֣עַן תֵּדַ֔ע כִּ֛י אֲנִ֥י יְהוָ֖ה בְּ/קֶ֥רֶב הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/008/018.yaml
  text: But on that day I will set apart the land of Goshen[a], where my people dwell, so that no swarm will be there[b], in order that you may know that I am Yahweh in the midst of the land.
translation:
  language: id
  text: Namun, pada hari itu Aku akan membedakan tanah Gosyen, tempat umat-Ku tinggal, sehingga tidak akan ada kawanan serangga[a] di sana, supaya engkau mengetahui bahwa Akulah Yahweh di tengah negeri[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani עָרֹב dapat berarti “kawanan”, “kawanan serangga”, atau mungkin jenis serangga tertentu; jenisnya tidak dapat dipastikan.
    reason: lexical_alternative
  - marker: b
    text: Atau “di tengah bumi”. Dalam konteks ini, ungkapan Ibrani tersebut kemungkinan besar merujuk pada negeri Mesir.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִפְלֵיתִי
  choice: Namun, ... Aku akan membedakan
  rationale: Bentuk Hifil dari פלא di sini menyatakan tindakan membuat pembedaan atau memperlakukan secara tersendiri. 'Membedakan' mempertahankan makna dasarnya, sedangkan 'Namun' menyampaikan kontras waw dengan keadaan Mesir lainnya.
- source_word: אֶרֶץ גֹּשֶׁן
  choice: tanah Gosyen
  rationale: אֶרֶץ menunjuk pada wilayah atau tanah Gosyen; bentuk ini alami dan mempertahankan istilah geografis teks sumber.
- source_word: עַמִּי עֹמֵד עָלֶיהָ
  choice: tempat umat-Ku tinggal
  rationale: Walaupun עֹמֵד secara harfiah berarti 'berdiri', dalam konstruksi ini maknanya adalah menetap atau berada di suatu wilayah.
- source_word: לְבִלְתִּי הֱיוֹת שָׁם
  choice: sehingga tidak akan ada ... di sana
  rationale: 'Konstruksi infinitif menyatakan tujuan atau hasil: wabah tersebut tidak akan terjadi di Gosyen.'
- source_word: עָרֹב
  choice: kawanan serangga
  rationale: Jenis makhluk yang dimaksud tidak pasti. 'Kawanan serangga' cukup jelas dalam konteks tulah tanpa mempersempitnya secara tidak berdasar menjadi lalat saja; ketidakpastian leksikal dicatat dalam catatan kaki.
- source_word: לְמַעַן תֵּדַע
  choice: Dengan demikian, engkau akan mengetahui
  rationale: Frasa ini menyatakan tujuan ilahi dan kata kerjanya berbentuk orang kedua tunggal, ditujukan kepada Firaun. 'Engkau' menjaga bentuk tunggal dan register yang bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: di tengah-tengah negeri ini
  rationale: בְּקֶרֶב menyatakan keberadaan di tengah, sedangkan הָאָרֶץ dalam konteks paling wajar menunjuk pada negeri Mesir. Kata 'ini' membuat rujukan kontekstual tersebut alami dalam bahasa Indonesia tanpa menghapus kemungkinan cakupan yang lebih luas, yang dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama diri ilahi secara langsung. 'Yahweh' mempertahankan nama tersebut, bukan menggantinya dengan gelar.
- issue: Cakupan בְּקֶרֶב הָאָרֶץ
  choice: di tengah-tengah negeri ini
  alternative: di tengah-tengah bumi
  rationale: Dalam kisah tulah, rujukan paling dekat ialah negeri Mesir, tetapi kata אֶרֶץ juga dapat berarti 'bumi'. Kemungkinan yang lebih luas dipertahankan dalam catatan kaki agar ketegangan cakupan tidak diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Pronomina 'Aku' dan bentuk terikat '-Ku' dikapitalisasi karena merupakan ucapan langsung Allah; 'engkau' mempertahankan sapaan orang kedua tunggal kepada Firaun. Istilah 'kawanan serangga' dipilih agar mudah dipahami tanpa menyatakan kepastian zoologis yang tidak terdapat dalam bahasa Ibrani.
