translation:
  language: id
  text: Lalu mereka memasang kedua tali emas itu pada kedua cincin di ujung-ujung tutup dada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kedua rantai emas itu.” Istilah Ibrani ini dapat berarti tali yang dipilin atau untaian menyerupai rantai; di sini benda-benda tersebut terbuat dari emas dan dipasang pada tutup dada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Lalu mereka memasang
  rationale: Dalam konstruksi ini, נתן berarti menaruh atau menempatkan sesuatu pada sesuatu yang lain. Karena tali dihubungkan dengan gelang, “memasang” paling alami dalam bahasa Indonesia dan sesuai dengan konteks pembuatan perlengkapan.
- source_word: שְׁתֵּי
  choice: kedua
  rationale: Bentuk bilangan ini menunjuk tepat pada dua benda tertentu; “kedua” ringkas dan alami.
- source_word: הָעֲבֹתֹת
  choice: tali
  rationale: Istilah ini dapat menunjuk tali yang dipilin atau untaian menyerupai rantai. “Tali” mempertahankan gambaran dasarnya, sedangkan kemungkinan “rantai” dicatat dalam catatan kaki.
- source_word: הַזָּהָב
  choice: emas
  rationale: Kata benda ini menyatakan bahan tali; frasa atributif “tali emas” alami dan jelas dalam bahasa Indonesia.
- source_word: עַל
  choice: pada
  rationale: Preposisi ini menyatakan bahwa tali ditempatkan atau dipasang pada gelang.
- source_word: הַטַּבָּעֹת
  choice: gelang
  rationale: טבעת menunjuk benda berbentuk cincin yang menjadi tempat pengait pada perlengkapan Kemah Suci. “Gelang” merupakan istilah yang wajar dalam konteks perlengkapan tersebut.
- source_word: קְצֹוֹת
  choice: ujung-ujung
  rationale: Bentuk jamak ini menunjuk bagian-bagian terluar; pengulangan “ujung-ujung” mempertahankan makna jamak secara alami.
- source_word: הַחֹשֶׁן
  choice: tutup dada
  rationale: Dalam konteks pakaian imam, חֹשֶׁן adalah perlengkapan yang dikenakan di dada. “Tutup dada” jelas, ringkas, dan mudah dipahami pembaca modern.
