  text: וַ/יִּרְכְּס֣וּ אֶת הַ/חֹ֡שֶׁן מִ/טַּבְּעֹתָי/ו֩ אֶל טַבְּעֹ֨ת הָ/אֵפֹ֜ד בִּ/פְתִ֣יל תְּכֵ֗לֶת לִֽ/הְיֹת֙ עַל חֵ֣שֶׁב הָ/אֵפֹ֔ד וְ/לֹֽא יִזַּ֣ח הַ/חֹ֔שֶׁן מֵ/עַ֖ל הָ/אֵפֹ֑ד כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/021.yaml
  text: They fastened the breastpiece by its rings to the rings of the ephod with a cord of blue[a], so that it would be on the skillfully woven band of the ephod, and so that the breastpiece would not come loose from on the ephod[b], just as Yahweh had commanded Moses.
translation:
  language: id
  text: Mereka mengikatkan tutup dada itu dari gelang-gelangnya kepada gelang-gelang efod dengan tali biru[a], agar tutup dada itu berada di atas sabuk tenunan efod dan tidak terlepas dari efod[b], seperti yang diperintahkan Yahweh kepada Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dengan tali berwarna biru.”'
    reason: Alternatif susunan frasa untuk פְּתִיל תְּכֵלֶת tanpa mengubah maknanya.
  - marker: b
    text: 'Secara lebih harfiah: “tidak bergeser dari atas efod.”'
    reason: Ungkapan Ibrani מֵעַל memuat nuansa spasial “dari atas”, sedangkan teks utama memakai ungkapan Indonesia yang lebih alami.
lexical_decisions:
- source_word: וַיִּרְכְּסוּ
  choice: Mereka mengikat
  rationale: Kata kerja ini menyatakan tindakan menyatukan dan mengencangkan bagian-bagian pakaian. 'Mengikat' alami dalam konteks penggunaan tali dan tetap mencerminkan tindakan pengikatan.
- source_word: הַחֹשֶׁן
  choice: tutup dada
  rationale: Dalam konteks pakaian imam, istilah ini menunjuk pada perlengkapan berhias yang dikenakan di dada, bukan zirah. 'Tutup dada' jelas bagi pembaca Indonesia dan menghindari kesan perlengkapan perang.
- source_word: מִטַּבְּעֹתָיו ... אֶל טַבְּעֹת הָאֵפֹד
  choice: melalui gelang-gelangnya pada gelang-gelang efod
  rationale: Ungkapan ini menyampaikan bahwa gelang-gelang tutup dada menjadi titik pengikatan menuju gelang-gelang efod. 'Melalui ... pada' menghasilkan konstruksi Indonesia yang wajar.
- source_word: בִּפְתִיל תְּכֵלֶת
  choice: dengan tali biru
  rationale: פְתִיל adalah tali atau benang untuk mengikat, sedangkan תְּכֵלֶת menunjuk pada warna/bahan celup biru. 'Tali biru' ringkas, alami, dan sesuai fungsi benda tersebut.
- source_word: חֵשֶׁב הָאֵפֹד
  choice: sabuk tenunan efod
  rationale: Dalam konteks ini חֵשֶׁב adalah pita atau sabuk berhias yang ditenun dan menjadi bagian dari efod. 'Sabuk tenunan' mempertahankan fungsi serta sifat buatannya tanpa menambahkan rincian yang tidak eksplisit.
- source_word: וְלֹא יִזַּח
  choice: tidak terlepas
  rationale: Bentuk ini menyatakan bahwa tutup dada tidak bergeser atau terpisah dari tempatnya. 'Tidak terlepas' idiomatis dan tepat dalam konteks pengikatan.
- source_word: מֵעַל הָאֵפֹד
  choice: dari efod
  rationale: Walaupun ungkapan Ibrani secara harfiah mengandung nuansa 'dari atas', dalam bahasa Indonesia 'terlepas dari efod' secara alami sudah menyampaikan pemisahan dari posisi di atas efod.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks adalah Tetragramaton; transliterasi 'Yahweh' mempertahankannya sebagai nama diri, bukan menggantinya dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai nama diri ilahi secara langsung. 'Yahweh' mempertahankan fungsi nama itu dan merupakan bentuk transliterasi modern yang luas dipakai.
- issue: Hubungan spasial tutup dada dengan efod
  choice: tetap berada di atas sabuk tenunan efod dan tidak terlepas dari efod
  alternative: berada pada sabuk tenunan efod dan tidak bergeser dari atas efod
  rationale: Terjemahan utama mempertahankan posisi tutup dada sekaligus tujuan pengikatannya dalam bahasa Indonesia yang alami; alternatif yang lebih harfiah dicatat karena מֵעַל secara eksplisit dapat membawa nuansa 'dari atas'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah teknis pakaian imam dipertahankan secara mudah dipahami; 'efod' ditransliterasikan sebagai nama khusus pakaian imam, sedangkan sintaksis disusun alami tanpa menghilangkan hubungan spasial dan fungsi pengikatannya.
