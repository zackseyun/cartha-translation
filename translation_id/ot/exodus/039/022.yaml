  yaml_path: translation/ot/exodus/039/022.yaml
  text: And he made the robe of the ephod[a], the work of a weaver[b], all of blue.
translation:
  language: id
  text: Ia membuat jubah efod itu, tenunan seorang penenun, seluruhnya dari benang biru.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani yang diterjemahkan “benang biru” menunjuk pada bahan tekstil biru bernilai tinggi yang digunakan untuk Kemah Suci dan pakaian imam.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia membuat
  rationale: Bentuk wayyiqtol melanjutkan urutan tindakan dalam narasi. Bahasa Indonesia tidak perlu selalu menyatakan waw dengan “dan”; “Ia membuat” tetap alami dan mempertahankan subjek maskulin tunggal dari konteks.
- source_word: מְעִיל הָאֵפֹד
  choice: jubah efod itu
  rationale: מְעִיל adalah jubah luar, sedangkan אֵפֹד merupakan istilah teknis bagi pakaian imam yang tidak memiliki padanan sederhana. Hubungan kedua nomina dipertahankan secara ringkas sebagai “jubah efod”.
- source_word: מַעֲשֵׂה אֹרֵג
  choice: buatan penenun
  rationale: Ungkapan ini secara harfiah berarti pekerjaan atau hasil karya seorang penenun. “Buatan penenun” alami dalam bahasa Indonesia dan tidak menambahkan gagasan “mahir” yang tidak dinyatakan dalam ayat.
- source_word: כְּלִיל
  choice: seluruhnya dari
  rationale: Kata ini menyatakan keseluruhan atau kelengkapan. Dalam deskripsi pakaian, “seluruhnya dari” dengan jelas menerangkan bahan seluruh jubah.
- source_word: תְּכֵלֶת
  choice: benang biru
  rationale: Istilah ini menunjuk pada bahan tekstil berwarna biru hasil pewarnaan yang digunakan untuk Kemah Suci dan pakaian imam, bukan sekadar warna abstrak. “Benang biru” menyampaikan konteks tekstil dengan bahasa yang mudah dipahami.
