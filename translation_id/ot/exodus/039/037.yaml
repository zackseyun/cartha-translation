  text: the pure lampstand[a], its lamps—the lamps set in order—and all its utensils, and the oil for the light,
translation:
  language: id
  text: kandil murni itu, pelita-pelitanya—pelita-pelita yang ditata—beserta segala perkakasnya, dan minyak untuk penerangan,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְּנֹרָה
  choice: kandil
  rationale: מְנוֹרָה menunjuk pada penyangga bercabang yang menampung pelita-pelita. “Kandil” merupakan istilah Indonesia yang ringkas dan lazim dalam konteks perlengkapan Kemah Suci, serta tidak menyamakannya dengan satu pelita saja.
- source_word: הַטְּהֹרָה
  choice: murni
  rationale: טָהוֹר di sini menggambarkan kemurnian benda kudus, kemungkinan juga bahan emasnya, dalam konteks perlengkapan tempat suci. “Murni” lebih tepat daripada “bersih” untuk benda tersebut.
- source_word: נֵרֹתֶיהָ
  choice: pelita-pelitanya
  rationale: נֵרֹתֶיהָ menunjuk pada pelita-pelita individual yang menjadi bagian dari kandil; bentuk posesif bahasa Indonesia mempertahankan hubungan itu dengan alami.
- source_word: נֵרֹת הַמַּעֲרָכָה
  choice: pelita-pelita yang ditata
  rationale: מַעֲרָכָה menyatakan penataan atau susunan yang teratur. Ungkapan ini mempertahankan penekanan Ibrani pada pelita-pelita yang ditata sebagaimana ditentukan tanpa menghasilkan frasa Indonesia yang kaku.
- source_word: כָּל כֵּלֶיהָ
  choice: segala perkakasnya
  rationale: כְּלִי merupakan istilah luas bagi alat, perlengkapan, atau wadah. “Perkakas” mencakup alat-alat terkait kandil tanpa mempersempit maknanya.
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: minyak untuk penerangan
  rationale: Frasa konstruksi ini berarti minyak yang digunakan untuk menghasilkan terang. Pilihan ini jelas, alami, dan tetap dekat dengan fungsi yang dinyatakan teks.
