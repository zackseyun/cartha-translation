translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan khidmat, mengikuti gaya daftar inventaris dalam konteks pasal ini. Tanda pisah memperlihatkan bahwa “pelita-pelita yang ditata” menjelaskan “pelita-pelitanya”, sementara koma akhir dipertahankan karena ayat ini merupakan bagian dari daftar yang berlanjut.
