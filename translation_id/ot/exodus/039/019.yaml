  naturalness: Bahasa baku dan mudah dibaca, tetapi “cincin emas” lebih idiomatis dan tepat untuk komponen pengait. Frasa lokasi yang direvisi lebih langsung tanpa menambahkan penjelasan eksplanatif dalam teks utama.
  terminology: “Efod” tepat dipertahankan sebagai istilah perlengkapan imam. “Tutup dada” dapat dipertahankan sebagai istilah yang sudah lazim; catatan kaki menjelaskan sisi yang dimaksud tanpa menetapkan secara berlebihan rincian konstruksinya.
