translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan struktur yang jelas. Istilah “efod” dipertahankan sebagai nama perlengkapan khusus imam, sedangkan “yakni” memperjelas bahwa frasa berikutnya menerangkan lokasi kedua gelang.
