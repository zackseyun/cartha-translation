base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/019.yaml
  text: They made two gold rings and put them on the two ends of the breastpiece[b][a], on its edge that was on the inner side toward the ephod.
translation:
  language: id
  text: Mereka membuat dua cincin emas dan memasangnya pada kedua ujung tutup dada itu, pada tepinya di sisi yang menghadap ke arah efod, di sebelah dalam[b][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang berseberangan dengan efod.”
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani memakai kata yang secara harfiah berarti “ke arah rumah”; di sini artinya “ke dalam” atau “di sisi dalam,” yakni sisi tutup dada yang dekat dengan efod.
    reason: cultural_note
lexical_decisions:
- source_word: טַבְּעֹת זָהָב
  choice: gelang emas
  rationale: טַבָּעַת menunjuk pada gelang atau cincin pengait. Dalam konteks perlengkapan imam, “gelang emas” merupakan ungkapan Indonesia yang alami dan tetap menyatakan bahannya.
- source_word: הַחֹשֶׁן
  choice: tutup dada
  rationale: חֹשֶׁן adalah perlengkapan berhias seperti kantong yang dikenakan imam besar pada dada. “Tutup dada” mempertahankan istilah yang mudah dipahami tanpa menyiratkan baju zirah.
- source_word: שְׂפָתוֹ
  choice: tepinya
  rationale: שָׂפָה secara harfiah berarti bibir, pinggir, atau tepi; untuk benda buatan, “tepi” paling wajar dalam bahasa Indonesia.
- source_word: אֲשֶׁר אֶל עֵבֶר הָאֵפֹד
  choice: menghadap efod
  rationale: עֵבֶר dapat menyatakan sisi, arah, atau posisi yang berhadapan. “Menghadap efod” menyampaikan hubungan ruangnya dengan alami, sementara kemungkinan “ke arah” atau “berseberangan dengan” dicatat dalam catatan kaki.
- source_word: בָּיְתָה
  choice: di sebelah dalam
  rationale: Bentuk berarah dari בַּיִת secara harfiah berarti “ke arah rumah/dalam” dan di sini menunjukkan sisi tutup dada yang berada di bagian dalam, dekat efod.
- source_word: וַיָּשִׂימוּ עַל
  choice: dan memasangnya pada
  rationale: שׂוּם berarti menaruh atau menempatkan. Karena gelang berfungsi sebagai bagian perlengkapan yang dipasangkan, “memasang” alami dalam konteks konstruksi ini.
- source_word: שְׁנֵי קְצוֹת
  choice: kedua ujung
  rationale: קָצֶה berarti ujung atau bagian terluar. “Kedua ujung” jelas dan tidak mempersempit bentuknya menjadi sudut.
