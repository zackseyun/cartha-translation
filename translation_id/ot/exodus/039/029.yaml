base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/029.yaml
  text: and the sash of finely twisted linen[a], and blue and purple and scarlet yarn, the work of an embroiderer[b], just as Yahweh had commanded Moses.
translation:
  language: id
  text: dan ikat pinggang dari linen halus yang dipintal serta benang biru, ungu, dan kirmizi, hasil karya seorang penyulam, tepat seperti yang diperintahkan Yahweh kepada Musa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאַבְנֵט
  choice: ikat pinggang
  rationale: Dalam konteks pakaian imam, istilah ini menunjuk pada kain pengikat yang dikenakan di pinggang. “Ikat pinggang” alami dan jelas dalam bahasa Indonesia.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: linen halus yang dipintal
  rationale: Mempertahankan baik jenis bahannya, yaitu linen halus, maupun cara pengolahannya sebagai benang yang dipintal.
- source_word: תְכֵלֶת
  choice: benang biru
  rationale: Istilah ini menunjuk pada bahan tekstil berwarna biru; “benang” dibuat eksplisit karena konteksnya adalah pembuatan ikat pinggang.
- source_word: אַרְגָּמָן
  choice: ungu
  rationale: Padanan warna yang lazim dan memadai bagi bahan tekstil berwarna ungu dalam konteks Kemah Suci.
- source_word: תוֹלַעַת שָׁנִי
  choice: merah tua
  rationale: Ungkapan ini menunjuk pada bahan yang diwarnai merah menyala atau kirmizi; “merah tua” merupakan ungkapan Indonesia yang mudah dipahami tanpa mengubahnya menjadi nama bahan.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: hasil karya seorang penyulam
  rationale: Mempertahankan penekanan sumber pada keahlian pengrajin dan pada pekerjaan dekoratif tekstil.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan sebuah gelar.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: tepat seperti yang diperintahkan Yahweh kepada Musa
  rationale: “Tepat seperti” menonjolkan kesesuaian penuh antara pelaksanaan dan perintah ilahi dalam formula berulang kitab Keluaran.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama pribadi ilahi secara langsung; “Yahweh” mempertahankan fungsi nama itu tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam bermartabat dan mudah dipahami. Susunan daftar bahan dibuat alami, sementara hubungan ayat ini dengan daftar benda pada ayat-ayat sebelumnya dipertahankan melalui kata pembuka “dan”.
