  text: the turban of fine linen[a], the ornate caps of fine linen, and the undergarments of finely twisted linen,
translation:
  language: id
  text: serban dari linen halus, penutup-penutup kepala berhias dari linen halus, dan pakaian dalam dari linen halus yang dipilin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan pakaian dalam dari linen, linen halus yang dipilin.” Susunan kata Ibrani memungkinkan frasa terakhir, “linen halus yang dipilin,” terutama dikaitkan dengan benda terakhir, meskipun frasa itu juga menggemakan keterangan bahan yang digunakan di seluruh bagian tentang pakaian imam.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּצְנֶפֶת
  choice: serban
  rationale: Istilah ini menunjuk pada penutup kepala imam, khususnya serban imam besar; “serban” merupakan padanan Indonesia yang lazim dan cukup tepat dalam konteks ini.
- source_word: שֵׁשׁ
  choice: linen halus
  rationale: שֵׁשׁ menunjuk pada linen bermutu halus, bukan sekadar kain linen pada umumnya.
- source_word: פַּאֲרֵי הַמִּגְבָּעֹת
  choice: tudung-tudung berhias
  rationale: Frasa konstruksi ini menggambarkan penutup kepala para imam sebagai benda yang indah atau berornamen. “Tudung-tudung berhias” mempertahankan nuansa penghiasannya tanpa menganggap פַּאֲרֵי sebagai benda terpisah.
- source_word: מִכְנְסֵי הַבָּד
  choice: pakaian dalam dari kain linen
  rationale: מִכְנָסַיִם adalah pakaian bagian bawah yang dikenakan imam sebagai pakaian dalam; הַבָּד menyatakan bahannya, yaitu kain linen.
- source_word: מָשְׁזָר
  choice: yang dipintal
  rationale: Kata ini menggambarkan benang yang dipintal atau dipilin. “Yang dipintal” menyampaikan teknik tekstil tersebut secara alami dalam bahasa Indonesia.
