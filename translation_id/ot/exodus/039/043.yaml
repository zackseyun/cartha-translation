  text: And Moses saw all the work, and behold, they had done it; just as Yahweh had commanded, so they had done it. And Moses blessed them.
translation:
  language: id
  text: Musa melihat seluruh pekerjaan itu, dan sesungguhnya, mereka telah mengerjakannya tepat seperti yang Yahweh perintahkan; demikianlah mereka mengerjakannya. Lalu Musa memberkati mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: melihat
  rationale: Makna dasar ראה ialah ‘melihat’. Dalam konteks ini Musa meninjau hasil pekerjaan yang telah selesai; ‘melihat’ tetap alami dan tidak menambahkan gagasan pemeriksaan resmi yang tidak dinyatakan secara eksplisit.
- source_word: כָּל הַמְּלָאכָה
  choice: seluruh pekerjaan itu
  rationale: מְלָאכָה menunjuk pada pekerjaan atau hasil pekerjaan. ‘Seluruh pekerjaan itu’ jelas dalam konteks pembuatan Kemah Suci dan mempertahankan cakupan כָּל.
- source_word: וְהִנֵּה
  choice: dan ternyata
  rationale: הִנֵּה menarik perhatian pada keadaan yang disaksikan Musa. Dalam narasi Indonesia modern, ‘dan ternyata’ menyampaikan penemuan dan penegasan tersebut secara wajar tanpa gaya arkais.
- source_word: עָשׂוּ אֹתָהּ
  choice: mereka telah mengerjakannya
  rationale: עשה dapat berarti ‘melakukan’ atau ‘membuat’. Karena pronomina merujuk kepada ‘pekerjaan’, ‘mengerjakannya’ alami dalam bahasa Indonesia dan tetap cukup luas untuk mencakup seluruh pengerjaan.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה
  choice: tepat seperti yang diperintahkan Yahweh
  rationale: כַּאֲשֶׁר menyatakan kesesuaian dengan perintah; ‘tepat seperti’ menonjolkan kesesuaian itu secara alami. Bentuk pasif ‘yang diperintahkan Yahweh’ menghindari objek tersirat yang terasa janggal dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai ‘Yahweh’, sehingga nama pribadi dalam teks sumber dipertahankan dan tidak diganti dengan gelar.
- source_word: כֵּן עָשׂוּ
  choice: demikianlah mereka mengerjakannya
  rationale: Klausa ini sengaja mengulangi עשה untuk menegaskan ketaatan yang persis. Pengulangan dipertahankan, meski sedikit berat, agar tekanan retoris sumber tidak hilang.
- source_word: וַיְבָרֶךְ אֹתָם מֹשֶׁה
  choice: Lalu Musa memberkati mereka
  rationale: ברך dalam bentuk piel berarti ‘memberkati’. ‘Lalu’ melanjutkan urutan naratif secara alami, sementara susunan nama subjek disesuaikan dengan sintaksis Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi. ‘Yahweh’ mempertahankan nama itu secara transparan, tanpa menggantinya dengan gelar atau memilih bentuk ‘Yehovah’ yang kurang sesuai dengan rekonstruksi pelafalan yang umum diterima.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur pengulangan Ibrani dipertahankan untuk menegaskan bahwa pekerjaan itu dilakukan persis sesuai perintah, tetapi partikel וְהִנֵּה diterjemahkan secara idiomatis sebagai ‘dan ternyata’ alih-alih ‘lihatlah’.
