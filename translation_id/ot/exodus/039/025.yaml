base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/025.yaml
  text: They made bells of pure gold[a], and they put the bells among the pomegranates on the hem of the robe, all around, among the pomegranates.
translation:
  language: id
  text: Mereka membuat lonceng-lonceng dari emas murni, lalu memasang lonceng-lonceng itu di antara buah-buah delima pada kelim jubah itu, di sekeliling kelim itu, di antara buah-buah delima.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di tengah-tengah buah-buah delima.” Ungkapan Ibrani menggambarkan letak lonceng-lonceng itu dalam hubungannya dengan hiasan-hiasan berbentuk buah delima.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Mereka membuat
  rationale: Bentuk wayyiqtol dari עשה melanjutkan urutan pekerjaan; ungkapan ini alami dalam narasi Indonesia.
- source_word: פַעֲמֹנֵי זָהָב טָהוֹר
  choice: lonceng-lonceng dari emas murni
  rationale: Menjaga bentuk jamak serta menyatakan bahan dan mutunya secara langsung.
- source_word: וַיִּתְּנוּ
  choice: lalu memasang
  rationale: נתן di sini berarti menempatkan benda pada susunan pakaian; 'memasang' lebih tepat dan alami daripada sekadar 'menaruh'.
- source_word: בְּתוֹךְ הָרִמֹּנִים
  choice: di antara buah-buah delima
  rationale: Secara harfiah berarti 'di tengah-tengah buah-buah delima'; dalam susunan hiasan ini, 'di antara' menyampaikan hubungan letaknya secara alami tanpa menghilangkan ambiguitas yang dicatat.
- source_word: הָרִמֹּנִים
  choice: buah-buah delima
  rationale: Ibrani menyebut buah delima secara langsung; konteks menunjukkan bahwa yang dimaksud ialah hiasan berbentuk buah delima.
- source_word: עַל שׁוּלֵי הַמְּעִיל
  choice: pada kelim jubah
  rationale: שׁוּלֵי menunjuk bagian tepi bawah atau kelim, sedangkan מְעִיל adalah jubah imam dalam konteks ini.
- source_word: סָבִיב
  choice: sekelilingnya
  rationale: Menunjukkan bahwa susunan tersebut mengitari kelim jubah.
- source_word: בְּתוֹךְ הָרִמֹּנִים (diulang)
  choice: di antara buah-buah delima
  rationale: Pengulangan sumber dipertahankan karena menegaskan pola penempatan dan merupakan ciri struktural ayat.
