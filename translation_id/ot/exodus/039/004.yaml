translation:
  language: id
  text: Mereka membuat untuk efod itu sepasang bagian bahu[a] yang tersambung; pada kedua ujungnya efod itu disambungkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tali-tali bahu”. Istilah Ibrani ini menunjuk pada bagian-bagian efod yang terletak di atas bahu dan menghubungkan bagian-bagiannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֵפֹת
  choice: bagian-bagian bahu
  rationale: Bentuk jamak ini secara harfiah berkaitan dengan bahu dan dalam konteks efod menunjuk pada bagian pakaian yang terletak di atas bahu serta menghubungkan bagian-bagiannya. Pilihan ini konkret tanpa memastikan bahwa bentuknya berupa tali.
- source_word: עָשׂוּ
  choice: mereka membuat
  rationale: Bentuk qal perfektum orang ketiga jamak dari עשה memakai verba umum 'membuat' dan sesuai dengan rangkaian pekerjaan pembuatan dalam pasal ini.
- source_word: ל/וֹ
  choice: untuk efod itu
  rationale: Akhiran pronominal maskulin tunggal merujuk pada efod. Penyebutan ulang nomina membuat rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: חֹבְרֹת
  choice: menyambungkannya pada efod
  rationale: Bentuk dari חבר menyatakan hubungan atau penyambungan. Susunan verbal ini menjelaskan bahwa bagian-bagian bahu dipasang tersambung pada efod, tanpa menghilangkan gagasan penghubungan.
- source_word: עַל שְׁנֵי קצוות/ו
  choice: pada kedua ujungnya
  rationale: Frasa ini menunjuk pada dua ujung atau sisi terluar efod. 'Pada kedua ujungnya' merupakan ungkapan Indonesia yang lugas dan alami.
- source_word: חֻבָּר
  choice: disambungkan
  rationale: Pual perfektum orang ketiga tunggal dari חבר bersifat pasif. Pengulangan akar dengan 'menyambungkan/disambungkan' mempertahankan penekanan Ibrani pada hubungan antarbagiannya.
