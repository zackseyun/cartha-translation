base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/007.yaml
  text: And he set them on the shoulder pieces of the ephod as memorial stones for the sons of Israel[b][a], just as Yahweh had commanded Moses.
translation:
  language: id
  text: Ia menempatkan kedua batu itu pada tali bahu efod sebagai batu-batu peringatan[a] bagi anak-anak Israel[b], tepat seperti yang diperintahkan Yahweh kepada Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “batu-batu pengingat.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “putra-putra Israel”; ungkapan Ibrani baku yang merujuk kepada umat Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם אֹתָם
  choice: Ia memasang keduanya
  rationale: Kata kerja שׂוּם berarti menaruh, menempatkan, atau memasang. Dalam konteks pembuatan pakaian imam, “memasang” menyatakan tindakan konkret dengan alami. “Keduanya” memperjelas bahwa pronomina itu mengacu pada dua batu krisopras dalam ayat sebelumnya.
- source_word: עַל כִּתְפֹת הָאֵפֹד
  choice: pada bagian-bagian bahu efod
  rationale: כָּתֵף secara harfiah berarti “bahu”, tetapi di sini menunjuk pada komponen efod yang terletak di bahu. “Bagian-bagian bahu” jelas dalam konteks konstruksi pakaian dan mempertahankan bentuk jamaknya.
- source_word: אַבְנֵי זִכָּרוֹן
  choice: sebagai batu-batu peringatan
  rationale: Frasa konstruksi ini berarti batu-batu yang berfungsi sebagai peringatan atau pengingat. “Batu-batu peringatan” alami dan mempertahankan fungsi yang dinyatakan teks.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: bagi anak-anak Israel
  rationale: Terjemahan ini mempertahankan bentuk ungkapan Ibrani בְּנֵי יִשְׂרָאֵל secara transparan. Catatan kaki menjelaskan bahwa ungkapan baku tersebut merujuk kepada umat Israel, bukan hanya anak-anak dalam arti usia.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: tepat seperti yang diperintahkan Yahweh kepada Musa
  rationale: כַּאֲשֶׁר menyatakan kesesuaian dengan perintah sebelumnya. Bentuk pasif relatif “yang diperintahkan” alami dalam bahasa Indonesia, sementara nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung. “Yahweh” mempertahankan nama perjanjian itu alih-alih menggantinya dengan gelar.
- issue: Penerjemahan ungkapan בְּנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  alternative: orang Israel; bani Israel
  rationale: “Anak-anak Israel” mempertahankan bentuk maskulin ungkapan sumber dan hubungan genealogisnya, sedangkan catatan kaki menjaga agar cakupan kolektifnya tidak disalahpahami.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Istilah teknis “efod” dipertahankan. Bentuk “bagian-bagian bahu” dipilih untuk menjelaskan komponen pakaian tanpa menguraikan teks secara berlebihan.
