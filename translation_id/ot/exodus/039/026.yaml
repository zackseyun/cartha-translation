base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/026.yaml
  text: a bell and a pomegranate[a], a bell and a pomegranate, around the hem of the robe, all around, for ministering, just as Yahweh had commanded Moses.
translation:
  language: id
  text: Sebuah lonceng dan sebuah delima, sebuah lonceng dan sebuah delima, di sekeliling kelim jubah itu, untuk pelayanan[a], tepat seperti yang telah Yahweh perintahkan kepada Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk melayani.” Infinitif Ibrani menyatakan tujuan jubah itu dalam pelayanan keimaman.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּעֲמֹן
  choice: giring-giring
  rationale: Kata benda ini menunjuk pada lonceng kecil yang dipasang pada pakaian. 'Giring-giring' alami dalam bahasa Indonesia untuk benda kecil yang berbunyi ketika digerakkan; unsur emas tidak ditambahkan karena tidak tersurat dalam ayat ini.
- source_word: רִמּוֹן
  choice: delima
  rationale: Makna harfiahnya ialah buah delima. Dalam konteks ini yang dimaksud adalah hiasan berbentuk delima, tetapi bentuk ringkas 'delima' mempertahankan ungkapan Ibrani dan dipahami dari konteks.
- source_word: עַל שׁוּלֵי הַמְּעִיל סָבִיב
  choice: mengelilingi kelim jubah itu
  rationale: שׁוּלֵי menunjuk pada bagian tepi bawah atau kelim, sedangkan סָבִיב menegaskan penempatan di sekelilingnya. Susunan ini menyampaikan keduanya secara alami tanpa mengulang 'sekeliling'.
- source_word: לְשָׁרֵת
  choice: untuk pelayanan
  rationale: Infinitif berawalan ל menyatakan tujuan dan dalam konteks Kemah Suci menunjuk pada pelayanan imam. Bentuk nominal ini tetap membuka kemungkinan nuansa 'untuk melayani'.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: tepat seperti yang diperintahkan Yahweh kepada Musa
  rationale: כַּאֲשֶׁר menyatakan kesesuaian dengan perintah sebelumnya; 'tepat seperti' mempertahankan tekanannya. Nama ilahi ditransliterasikan 'Yahweh', dan konstruksi verba diterjemahkan secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama diri ilahi YHWH. 'Yahweh' mempertahankan nama tersebut, bukan menggantinya dengan gelar, tanpa memasukkan penafsiran denominasi tertentu.
- issue: Fungsi לְשָׁרֵת
  choice: untuk pelayanan
  alternative: untuk melayani
  rationale: Bentuk Ibrani menyatakan tujuan pakaian itu dalam pelayanan keimaman. Terjemahan utama mempertahankan nuansa institusional, sedangkan catatan kaki mencatat padanan verbal yang juga mungkin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Giring-giring' dipilih daripada 'lonceng' untuk benda kecil pada kelim pakaian; pola berulang Ibrani dipertahankan. Penanda catatan kaki ditempatkan langsung setelah frasa yang dijelaskan.
