  yaml_path: translation/ot/exodus/039/034.yaml
  text: the covering of ram skins dyed red[a], the covering of fine leather, and the veil of the screen;
translation:
  language: id
  text: penutup dari kulit domba jantan yang diwarnai merah, penutup dari kulit takhas[a], dan tabir penyekat;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Arti kata Ibrani תְּחָשִׁים (tekhasyim) tidak pasti. Kata ini mungkin menunjuk pada kulit hewan tertentu; secara tradisional diterjemahkan antara lain sebagai kulit lumba-lumba atau dugong, atau ditransliterasikan sebagai “kulit takhas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְסֵה
  choice: penutup
  rationale: Padanan nominal yang lugas dan alami untuk sesuatu yang menutupi, tanpa memperinci bentuk atau susunannya.
- source_word: עוֹרֹת הָאֵילִם הַמְאָדָּמִים
  choice: kulit domba jantan yang diwarnai merah
  rationale: Menyatakan jenis kulit dan makna kausatif/pasif dari הַמְאָדָּמִים, yakni dibuat merah atau diwarnai merah, bukan sekadar berwarna merah secara alami.
- source_word: עֹרֹת הַתְּחָשִׁים
  choice: kulit takhas
  rationale: Referen תְּחָשִׁים tidak pasti. Transliterasi menghindari penentuan jenis hewan atau mutu kulit yang tidak dapat dipastikan dari sumber, sementara catatan kaki menjelaskan persoalannya.
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: tabir penyekat
  rationale: פָּרֹכֶת adalah tabir bagian dalam, sedangkan הַמָּסָךְ menerangkan fungsi penutup/pemisahnya. 'Tabir penyekat' menyampaikan hubungan frasa secara alami tanpa menghasilkan ungkapan Indonesia yang janggal seperti 'tabir dari tirai'.
