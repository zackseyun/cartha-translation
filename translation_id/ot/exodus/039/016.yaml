  text: They made two gold settings and two gold rings[a], and they put the two rings on the two ends of the breastpiece.
translation:
  language: id
  text: Mereka membuat dua bingkai emas[a] dan dua cincin emas, lalu memasang kedua cincin itu pada kedua ujung tutup dada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dudukan” atau “bingkai kerawang”; istilah Ibrani ini menunjuk pada hasil kerajinan emas yang digunakan sebagai bingkai atau tempat pemasangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Mereka membuat
  rationale: Bentuk wayyiqtol dari עשה meneruskan urutan tindakan. Bahasa Indonesia dapat menyatakan urutan itu secara alami tanpa memulai kalimat dengan “dan”.
- source_word: שְׁתֵּי מִשְׁבְּצֹת זָהָב
  choice: dua bingkai emas
  rationale: מִשְׁבְּצֹת menunjuk pada hasil kerajinan emas yang berfungsi sebagai bingkai atau dudukan. “Bingkai” jelas dalam konteks perhiasan dan tidak menentukan teknik pembuatannya secara berlebihan.
- source_word: וּשְׁתֵּי טַבְּעֹת זָהָב
  choice: dan dua cincin emas
  rationale: טַבְּעֹת adalah cincin-cincin yang menjadi titik pengikat. Pengulangan “emas” dipertahankan sesuai struktur dan penekanan teks Ibrani.
- source_word: וַיִּתְּנוּ
  choice: lalu memasang
  rationale: נתן di sini berarti menempatkan atau memasang pada bagian pakaian imam. “Lalu” menyampaikan kelanjutan tindakan, sedangkan “memasang” alami dalam konteks pembuatan benda.
- source_word: עַל שְׁנֵי קְצוֹת
  choice: pada kedua ujung
  rationale: Frasa ini secara konkret menunjuk pada dua ujung benda. “Kedua ujung” merupakan ungkapan Indonesia yang alami dan tepat.
- source_word: הַחֹשֶׁן
  choice: penutup dada
  rationale: Dalam konteks pakaian imam besar, חֹשֶׁן adalah perlengkapan khusus yang dikenakan pada dada. “Penutup dada” jelas, bermartabat, dan tidak menambahkan sebutan yang tidak muncul dalam ayat ini.
