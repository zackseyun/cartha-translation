lexical_decisions:
- source_word: רָבוּעַ
  choice: bujur sangkar
  rationale: Menunjukkan bentuk persegi dengan empat sisi; ungkapan ini alami dan tepat dalam bahasa Indonesia modern.
- source_word: הָיָה
  choice: bentuknya
  rationale: Dalam konteks ini verba tersebut berfungsi sebagai kopula yang menggambarkan keadaan atau bentuk tutup dada.
- source_word: כָּפוּל
  choice: berlapis dua
  rationale: Menjaga gagasan bahwa benda itu dibuat rangkap dua atau dilipat sehingga menjadi dua lapis, tanpa memastikan secara berlebihan cara pembuatannya.
- source_word: עָשׂוּ
