  text: tabut kesaksian, tongkat-tongkat pengusungnya, dan tutup pendamaian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penutup tabut”; istilah Ibrani ini menunjuk pada penutup tabut dan berkaitan dengan pendamaian.
