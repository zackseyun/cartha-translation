lexical_decisions:
- source_word: אֲרֹן
  choice: tabut
  rationale: Istilah baku dalam bahasa Indonesia untuk peti suci dalam konteks Kemah Suci.
- source_word: הָעֵדֻת
  choice: kesaksian
  rationale: Menerjemahkan arti langsung עֵדוּת dan mempertahankan kaitan tabut dengan loh-loh yang menjadi kesaksian, tanpa menggantinya dengan penafsiran 'perjanjian'.
- source_word: בַּדָּיו
  choice: kayu-kayu pengusungnya
  rationale: Dalam konteks perlengkapan Kemah Suci, בַּד menunjuk pada batang yang dipakai untuk mengusung benda suci; pilihan ini alami dan menjelaskan fungsinya.
- source_word: הַכַּפֹּרֶת
  choice: tutup pendamaian
  rationale: Menunjukkan bahwa benda itu adalah penutup tabut sekaligus mempertahankan hubungan leksikal dan ritualnya dengan pendamaian.
theological_decisions:
- issue: Penerjemahan הַכַּפֹּרֶת sebagai perlengkapan ibadah
  choice: tutup pendamaian
  alternative: tutup pendamaian dosa; tutup tabut
  rationale: Pilihan ini mempertahankan bentuk bendanya sebagai tutup dan nuansa ritual pendamaian tanpa menambahkan kata 'dosa' yang tidak dinyatakan dalam istilah Ibrani atau menghilangkan nuansa teologisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Frasa ini merupakan kelanjutan dari daftar pada ayat sebelumnya, sehingga tidak dibentuk menjadi kalimat lengkap.
