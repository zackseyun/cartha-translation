  text: 'Then they brought the tabernacle to Moses—the tent and all its furnishings: its clasps[a], its frames, its bars, its pillars[b], and its bases.'
translation:
  language: id
  text: 'Kemudian mereka membawa Kemah Suci kepada Musa—kemah itu beserta segala perlengkapannya: kait-kaitnya, rangka-rangkanya[a], palang-palangnya, tiang-tiangnya, dan alas-alasnya[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “papan-papannya.” Istilah Ibrani ini menunjuk pada bagian-bagian struktural tegak Kemah Suci.
    reason: lexical_alternative
  - marker: b
    text: Atau “dudukan-dudukannya.” Istilah Ibrani ini dapat menunjuk pada bagian dasar berlubang tempat rangka atau tiang dipasang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: Kemudian mereka membawa
  rationale: Bentuk wayyiqtol Hifil dari בוא melanjutkan urutan narasi dan di sini berarti membawa sesuatu kepada seseorang. “Kemudian” menyampaikan perkembangan tindakan secara alami.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: מִשְׁכָּן menunjuk pada tempat kediaman kudus yang portabel dalam kitab Keluaran. “Kemah Suci” merupakan istilah Indonesia yang jelas dan lazim dalam konteks ini.
- source_word: אֶל מֹשֶׁה
  choice: kepada Musa
  rationale: Preposisi אֶל menyatakan arah menuju seseorang; “kepada Musa” mempertahankan makna langsungnya.
- source_word: הָאֹהֶל
  choice: kemah itu
  rationale: אֹהֶל berarti “kemah” dan di sini menjelaskan komponen kemah dari Kemah Suci. Bentuk “kemah itu” mempertahankan pembedaan leksikal sumber tanpa menambahkan tafsiran teknis.
- source_word: כָּל כֵּלָיו
  choice: segala perlengkapannya
  rationale: כֵּלִים mencakup berbagai barang, perkakas, atau komponen. “Segala perlengkapannya” cukup luas untuk mencakup unsur-unsur konstruksi yang kemudian dirinci.
- source_word: קְרָסָיו
  choice: kait-kaitnya
  rationale: קְרָסִים adalah pengait atau penyambung yang digunakan untuk menyatukan tirai-tirai Kemah Suci. “Kait-kait” jelas dan sesuai dengan fungsi tersebut.
- source_word: קְרָשָׁיו
  choice: rangka-rangkanya
  rationale: קְרָשִׁים menunjuk pada unsur-unsur struktural tegak Kemah Suci. “Rangka-rangka” menyatakan fungsinya dengan baik, sementara alternatif tradisional “papan-papan” dicatat dalam catatan kaki.
- source_word: בריחו
  choice: palang-palangnya
  rationale: בְּרִיחַ adalah palang yang mengikat atau menahan rangka-rangka agar menyatu. “Palang” merupakan padanan yang tepat dan alami.
- source_word: עַמֻּדָיו
  choice: tiang-tiangnya
  rationale: עַמּוּד menunjuk pada penyangga vertikal. “Tiang” adalah istilah Indonesia yang alami dan tepat untuk struktur kemah.
- source_word: אֲדָנָיו
  choice: alas-alasnya
  rationale: אֶדֶן dalam uraian Kemah Suci adalah bagian dasar tempat unsur struktural dipasang. “Alas” mudah dipahami, sedangkan sifatnya sebagai dudukan berlubang dijelaskan dalam catatan kaki.
