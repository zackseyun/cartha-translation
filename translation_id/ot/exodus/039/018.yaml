translation:
  language: id
  text: Kedua ujung dari kedua rantai jalinan itu diletakkan pada kedua bingkai[a], lalu ditempatkan pada bagian bahu efod[b], di bagian depannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dudukan.”
    reason: lexical_alternative
  - marker: b
    text: Efod adalah pakaian imam yang memiliki bagian bahu.
    reason: cultural_clarification
lexical_decisions:
- source_word: קְצוֹת
  choice: ujung
  rationale: Kata ini menunjuk pada titik-titik paling akhir dari suatu benda; 'ujung' merupakan padanan Indonesia yang alami dan tepat.
- source_word: הָעֲבֹתֹת
  choice: rantai jalinan
  rationale: Dalam konteks perlengkapan Kemah Suci, istilah ini menunjuk pada rantai yang dibuat dengan cara dijalin atau dipilin, bukan tali biasa.
- source_word: מִּשְׁבְּצֹת
  choice: bingkai
  rationale: Istilah ini menunjuk pada dudukan atau bingkai logam tempat perlengkapan perhiasan dipasang. 'Bingkai' cukup alami dalam bahasa Indonesia tanpa menentukan teknik pembuatannya secara berlebihan.
- source_word: וַיִּתְּנֻם
  choice: mereka menempatkannya
  rationale: Bentuk dari נתן di sini berarti meletakkan atau menempatkan; terjemahan ini tidak menambahkan gagasan 'mengikat' yang tidak dinyatakan secara eksplisit.
- source_word: כִּתְפֹת
  choice: bagian-bagian bahu
  rationale: Dalam konteks pakaian efod, kata ini mengacu pada bagian pakaian yang terletak di bahu, bukan sekadar bahu tubuh.
- source_word: אֶל מוּל פָּנָיו
  choice: di sisi depannya
  rationale: Frasa ruang ini menunjukkan bahwa penempatannya berada pada sisi efod yang menghadap ke depan; akhiran pronominal dipahami merujuk kepada efod.
