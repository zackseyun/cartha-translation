    issue: “tatahan emas” untuk מִשְׁבְּצֹת זָהָב
    rationale: Tatahan biasanya adalah hiasan yang ditanamkan pada suatu permukaan, sedangkan frasa Ibrani menggambarkan batu-batu yang dipasang/dikelilingi dalam bingkai atau tempat emas.
  - severity: low
    issue: Klausa aktif “dan mengukirnya”
    rationale: Subjek manusia tersirat memang mungkin dari וַיַּעֲשׂוּ, tetapi bentuk Ibrani untuk batu-batu tersebut adalah pasif. Terjemahan pasif membuat hubungan sintaktis dan makna lebih jelas.
  - severity: low
    issue: “anak-anak lelaki Israel”
    rationale: Padanan ini gramatikal, tetapi kurang alami sebagai sebutan genealogis dalam bahasa Indonesia baku. “Putra-putra Israel” mempertahankan maskulin plural dan register kitab suci.
  revised_text: Mereka membuat batu-batu oniks[a] itu, dipasang dalam bingkai emas dan diukir seperti ukiran meterai, sesuai dengan nama-nama putra Israel.
