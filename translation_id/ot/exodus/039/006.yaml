  text: וַֽ/יַּעֲשׂוּ֙ אֶת אַבְנֵ֣י הַ/שֹּׁ֔הַם מֻֽסַבֹּ֖ת מִשְׁבְּצֹ֣ת זָהָ֑ב מְפֻתָּחֹת֙ פִּתּוּחֵ֣י חוֹתָ֔ם עַל שְׁמ֖וֹת בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/006.yaml
  text: And they made the onyx stones[a], enclosed in settings of gold, engraved like the engravings of a seal, according to the names of the sons of Israel.
translation:
  language: id
  text: Mereka membuat batu-batu oniks[a] itu, dipasang dalam bingkai emas dan diukir seperti ukiran meterai, sesuai dengan nama-nama putra Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “batu-batu syoham”; jenis batu permata yang dimaksud tidak dapat dipastikan, meskipun “oniks” merupakan terjemahan tradisional.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Mereka membuat
  rationale: Kata kerja עשה bermakna luas, yaitu 'membuat/mengerjakan'; dalam konteks pekerjaan para perajin, 'membuat' merupakan padanan yang langsung dan alami.
- source_word: אַבְנֵי הַשֹּׁהַם
  choice: batu-batu oniks
  rationale: Oniks adalah padanan tradisional dan mudah dipahami untuk שֹׁהַם, tetapi identifikasi mineralnya tidak pasti; ketidakpastian itu dipertahankan dalam catatan kaki.
- source_word: מֻסַבֹּת מִשְׁבְּצֹת זָהָב
  choice: yang dikelilingi tatahan emas
  rationale: Ungkapan ini menggambarkan batu-batu yang dikelilingi atau dipasang dalam struktur emas. 'Tatahan emas' menyampaikan karya pemasangan perhiasan tanpa menentukan teknik logam secara berlebihan.
- source_word: מְפֻתָּחֹת פִּתּוּחֵי חוֹתָם
  choice: mengukirnya seperti ukiran meterai
  rationale: Bentuk pasif dan konstruksi serumpun menekankan pengukiran dengan corak atau cara pengukiran meterai. Dalam bahasa Indonesia, klausa aktif ini lebih alami, sementara perbandingan dengan ukiran meterai tetap terpelihara.
- source_word: עַל שְׁמוֹת
  choice: sesuai dengan nama
  rationale: 'Di sini עַל menyatakan hubungan atau kesesuaian: ukiran dibuat menurut nama-nama yang dimaksud. ''Sesuai dengan nama'' mempertahankan relasi tersebut.'
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: anak-anak lelaki Israel
  rationale: Padanan ini mempertahankan bentuk maskulin jamak בני serta idiom leluhur Israel, dan menghindari penafsiran ulang sebagai sebutan umum 'orang Israel'.
theological_decisions:
- issue: Sebutan perjanjian yang bergender בְּנֵי יִשְׂרָאֵל
  choice: anak-anak lelaki Israel
  alternative: anak-anak Israel; orang Israel
  rationale: Teks Ibrani secara eksplisit memakai bentuk maskulin jamak dalam ungkapan baku. Terjemahan mempertahankan unsur gender dan hubungan genealogisnya tanpa menambahkan penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara citra pekerjaan perajin, pengukiran meterai, ketidakpastian nama batu, dan bentuk maskulin pada sebutan keturunan Israel tetap dipertahankan.
