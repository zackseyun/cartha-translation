translation:
  language: id
  text: Mereka membuat dua cincin emas dan memasangnya pada kedua bagian bahu efod itu, di bagian bawah, pada sisi depannya, sejajar dengan tempat penyambungannya, di atas sabuk tenun efod itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טַבְּעֹת
  choice: gelang
  rationale: Dalam konteks perlengkapan Kemah Suci, kata ini menunjuk pada gelang atau cincin logam untuk mengikat atau menyambungkan bagian-bagian; “gelang” merupakan istilah Indonesia yang wajar untuk komponen ini.
- source_word: כִתְפֹת
  choice: bagian bahu
  rationale: Kata ini di sini menunjuk pada bagian pakaian yang terletak di bahu, bukan semata-mata bahu secara anatomis.
- source_word: אֵפֹד
  choice: efod
  rationale: Istilah teknis bagi pakaian imam ini dipertahankan sebagai transliterasi karena tidak ada padanan pakaian Indonesia yang tepat.
- source_word: מִלְמַטָּה
  choice: di sebelah bawah
  rationale: Ungkapan ini menyatakan letak yang lebih rendah pada bagian bahu efod.
- source_word: מִמּוּל פָּנָיו
  choice: pada sisi depannya
  rationale: Secara harfiah berkaitan dengan bagian yang menghadap ke depan; untuk sebuah pakaian, “sisi depannya” jelas dan alami.
- source_word: לְעֻמַּת מֶחְבַּרְתּוֹ
  choice: berhadapan dengan tempat penyambungannya
  rationale: Terjemahan ini mempertahankan hubungan posisi yang dinyatakan לְעֻמַּת dan arti umum מֶחְבֶּרֶת sebagai tempat bagian-bagian disambungkan, tanpa mempersempitnya menjadi jahitan tertentu.
- source_word: חֵשֶׁב
  choice: sabuk tenunan
  rationale: Dalam uraian efod, istilah ini menunjuk pada bagian tenunan menyerupai sabuk yang menyatu dengan atau berfungsi mengikat efod; pilihan ini jelas tanpa menambahkan unsur yang tidak dinyatakan langsung dalam ayat.
- source_word: וַיִּתְּנֻם
  choice: memasangnya
  rationale: Dalam konteks gelang yang ditempatkan pada pakaian untuk fungsi penyambungan, “memasangnya” lebih tepat daripada sekadar “menaruhnya”.
