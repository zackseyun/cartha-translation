  yaml_path: translation/ot/exodus/039/042.yaml
  text: According to all that Yahweh had commanded Moses[a], so the sons of Israel did all the work.
translation:
  language: id
  text: Sesuai dengan segala yang Yahweh perintahkan kepada Musa, demikianlah orang Israel melaksanakan seluruh pekerjaan itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak lelaki Israel”; ungkapan Ibrani ini merupakan sebutan umum bagi umat Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר
  choice: Sesuai dengan segala yang
  rationale: Gabungan כְּ dengan כֹּל menyatakan kesesuaian dengan seluruh isi perintah; bentuk ini alami dalam bahasa Indonesia dan mempertahankan kaitannya dengan כֵּן.
- source_word: צִוָּה
  choice: telah diperintahkan
  rationale: Verba ini berarti 'memerintahkan'. Bentuk 'telah' menunjukkan bahwa perintah mendahului pelaksanaan pekerjaan tanpa menambah makna yang tidak ada dalam sumber.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton dialihaksarakan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֶת מֹשֶׁה
  choice: kepada Musa
  rationale: Dengan verba צוה, Musa adalah orang yang menerima perintah. Bahasa Indonesia secara idiomatis memakai konstruksi pasif 'diperintahkan ... kepada Musa'.
- source_word: כֵּן
  choice: demikianlah
  rationale: 'Kata ini menghubungkan tindakan Israel dengan pola yang dinyatakan pada awal ayat: mereka bertindak sesuai dengan semua perintah itu.'
- source_word: עָשׂוּ
  choice: melaksanakan
  rationale: Dalam konteks ini עשה berarti menjalankan atau mengerjakan seluruh tugas yang diperintahkan. 'Melaksanakan' lebih alami daripada 'melakukan pekerjaan' dan tetap mencakup pengerjaan benda maupun pelayanan terkait.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah berarti 'anak-anak lelaki Israel', tetapi merupakan sebutan kolektif baku bagi umat Israel. 'Orang Israel' menyampaikan rujukan korporatnya secara alami dalam bahasa Indonesia; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: אֵת כָּל הָעֲבֹדָה
  choice: seluruh pekerjaan itu
  rationale: עֲבֹדָה dapat berarti pekerjaan, tugas, atau pelayanan. Dalam konteks pembuatan Kemah Suci, 'seluruh pekerjaan itu' jelas dan mempertahankan cakupan total כָּל.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi secara langsung; 'Yahweh' mempertahankannya sebagai nama diri dan bukan menggantinya dengan gelar.
- issue: Penerjemahan sebutan kolektif בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel atau putra-putra Israel
  rationale: Ungkapan Ibrani secara harfiah berbentuk maskulin, tetapi di sini berfungsi sebagai sebutan perjanjian bagi umat Israel secara keseluruhan. Terjemahan utama menyampaikan fungsi kolektif itu, sedangkan bentuk harfiahnya dipertahankan dalam catatan kaki agar data sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan korelatif 'Sesuai dengan ... demikianlah ...' mempertahankan struktur penegasan Ibrani, sementara 'melaksanakan seluruh pekerjaan itu' terdengar alami bagi pembaca umum.
