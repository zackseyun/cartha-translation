base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/008.yaml
  text: 'He made the breastpiece[a], the work of a skillful designer, like the work of the ephod: of gold, blue, purple, scarlet yarn[b], and finely twisted linen.'
translation:
  language: id
  text: 'Ia membuat tutup dada[a] itu, karya seorang perancang yang terampil[b], dibuat seperti efod: dari emas, benang biru, ungu, dan merah tua, serta linen halus yang dipintal.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "pelindung dada". Istilah Ibrani ini menunjuk pada perlengkapan imam yang dikenakan di dada dan tidak dengan sendirinya berarti zirah logam.
    reason: lexical_alternative
  - marker: b
    text: Atau "karya seorang penenun ahli". Ungkapan Ibrani ini menekankan pengerjaan berpola yang terampil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia membuat
  rationale: Bentuk wayyiqtol melanjutkan rangkaian narasi dengan tindakan lampau; dalam bahasa Indonesia, urutannya cukup dinyatakan tanpa harus menambahkan "lalu".
- source_word: הַחֹשֶׁן
  choice: tutup dada
  rationale: Istilah ini menunjuk perlengkapan khusus imam yang dikenakan pada dada dan terkait dengan efod. "Tutup dada" menghindari kesan zirah logam yang dapat muncul dari istilah "pelindung dada".
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: sebagai karya seorang perancang terampil
  rationale: Ungkapan ini menekankan keahlian artistik dalam merancang atau mengerjakan pola, bukan sekadar pembuatan biasa.
- source_word: כְּמַעֲשֵׂה אֵפֹד
  choice: seperti pengerjaan efod
  rationale: Perbandingan tersebut menghubungkan teknik pengerjaan tutup dada dengan teknik pengerjaan efod.
- source_word: אֵפֹד
  choice: efod
  rationale: Istilah teknis kultis ini tidak mempunyai padanan Indonesia yang tepat; transliterasi mempertahankan kekhususannya.
- source_word: זָהָב תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: benang emas, biru, ungu, dan merah tua
  rationale: Dalam konteks tekstil, unsur-unsur ini merupakan bahan atau benang berwarna. Kata "benang" ditempatkan sekali pada awal daftar agar kalimat alami dan jelas.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: serta linen halus yang dipintal
  rationale: שֵׁשׁ berarti linen halus, sedangkan מָשְׁזָר menunjukkan bahwa serat atau benangnya dipintal; terjemahan mempertahankan kedua unsur tersebut.
