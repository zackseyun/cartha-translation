lexical_decisions:
- source_word: מִזְבַּח הַזָּהָב
  choice: mezbah emas
  rationale: Frasa ini secara harfiah memakai nomina 'emas' secara atributif. 'Mezbah emas' alami dalam bahasa Indonesia dan mempertahankan bentuk Ibraninya.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: minyak urapan
  rationale: Ungkapan ini menunjuk pada minyak yang digunakan untuk pengurapan; 'minyak urapan' merupakan istilah ritual yang ringkas dan jelas.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: ukupan harum
  rationale: קְטֹרֶת berarti bahan yang dibakar sebagai ukupan, sedangkan הַסַּמִּים menunjuk pada rempah atau bahan aromatik. 'Ukupan harum' menyampaikan maknanya secara alami tanpa menambah rincian yang tidak dinyatakan.
- source_word: מָסַךְ
  choice: tirai
  rationale: Dalam konteks Kemah Suci, kata ini menunjuk pada kain penutup yang digantung pada jalan masuk. 'Tirai' adalah padanan Indonesia yang alami dan dapat dibedakan secara kontekstual dari tabir bagian dalam.
- source_word: פֶּתַח הָאֹהֶל
  choice: untuk pintu masuk Kemah
  rationale: פֶּתַח berarti bukaan atau pintu masuk. Kapitalisasi 'Kemah' memperjelas bahwa yang dimaksud ialah Kemah Suci dalam konteks ini tanpa menyisipkan kata 'Suci' yang tidak terdapat pada frasa sumber.
- source_word: וְאֵת ... וְאֵת ... וְאֵת ... וְאֵת
  choice: daftar dipisahkan koma dengan 'dan' sebelum unsur terakhir
  rationale: Pengulangan וְאֵת menandai rangkaian objek. Susunan daftar ini lebih alami dalam bahasa Indonesia sambil mempertahankan keempat unsur.
