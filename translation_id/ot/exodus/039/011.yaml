translation:
  language: id
  text: 'dan baris kedua: batu pirus[a], batu safir, dan batu intan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Identifikasi tepat beberapa batu permata kuno tidak pasti. נֹפֶךְ juga dapat diterjemahkan “zamrud” atau “batu delima”, dan יָהֲלֹם juga dapat diterjemahkan “yakut kuning” atau “yaspis”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/טּוּר
  choice: dan baris
  rationale: Dalam konteks susunan permata pada tutup dada, טוּר menunjuk pada baris atau deret batu; “baris” paling alami dalam bahasa Indonesia, sementara וְ diterjemahkan “dan” untuk mempertahankan kesinambungan daftar.
- source_word: הַ/שֵּׁנִי
  choice: kedua
  rationale: Adjektiva bilangan bertingkat yang berarti “kedua”; frasa “baris kedua” merupakan susunan alami dalam bahasa Indonesia.
- source_word: נֹפֶךְ
  choice: batu pirus
  rationale: Identifikasi mineral kuno ini tidak pasti. “Batu pirus” merupakan padanan modern yang masuk akal; alternatif tradisional dicatat dalam catatan kaki.
- source_word: סַפִּיר
  choice: batu safir
  rationale: Padanan baku dan paling dikenal untuk סַפִּיר, meskipun batu kuno tersebut belum tentu identik secara mineralogis dengan safir modern.
- source_word: וְ/יָהֲלֹם
  choice: dan batu intan
  rationale: Identifikasi יָהֲלֹם tidak pasti. “Batu intan” mempertahankan padanan tradisional yang umum dan struktur daftar; kemungkinan lain dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku yang ringkas dan bermartabat. Pengulangan “batu” membuat nama-nama permata jelas bagi pembaca umum. Tanda titik dua mempertahankan bentuk daftar pada teks sumber.
