  yaml_path: translation/ot/exodus/039/031.yaml
  text: And they attached to it a cord of blue yarn[a], to put it above on the turban, just as Yahweh had commanded Moses.
translation:
  language: id
  text: Lalu mereka memasang padanya seutas tali dari benang biru[a] untuk menempatkan lempeng itu di bagian atas serban, tepat seperti yang diperintahkan Yahweh kepada Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seutas tali biru” atau “seutas tali ungu kebiruan”; kata Ibrani תְּכֵלֶת menunjuk pada bahan berwarna biru khas yang digunakan dalam Kemah Suci.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ עָלָיו
  choice: mereka memasang padanya
  rationale: נתן secara harfiah berarti 'menaruh/memberikan', tetapi dengan עַל dan konteks pengikatan lempeng emas, 'memasang padanya' menyampaikan tindakan fungsional secara alami tanpa memperluas makna.
- source_word: פְּתִיל
  choice: seutas tali
  rationale: Kata ini menunjuk pada benang yang dipilin atau tali; 'seutas tali' sesuai dengan fungsi pengikatnya.
- source_word: תְּכֵלֶת
  choice: benang biru
  rationale: Istilah ini menunjuk pada bahan tekstil berwarna biru atau biru keunguan yang khas dalam perlengkapan Kemah Suci; 'benang biru' menyampaikan bahan dan warnanya.
- source_word: לָתֵת
  choice: untuk menempatkannya
  rationale: Bentuk infinitif ini menyatakan tujuan. Akhiran '-nya' secara alami merujuk pada lempeng/mahkota kudus yang disebut dalam ayat sebelumnya.
- source_word: הַמִּצְנֶפֶת
  choice: serban
  rationale: Istilah ini menunjuk secara khusus pada penutup kepala imam besar; 'serban' adalah padanan Indonesia yang jelas dan lazim.
- source_word: מִלְמָעְלָה
  choice: di bagian atas
  rationale: Adverbia ini menunjukkan posisi di atas atau pada bagian atas. Ungkapan ini mempertahankan keterangan posisi tanpa menentukan secara berlebihan apakah yang dimaksud bagian depan atau puncak.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: tepat seperti yang diperintahkan Yahweh kepada Musa
  rationale: Formula penggenapan ini menekankan kesesuaian tindakan dengan perintah ilahi; 'tepat seperti' mempertahankan penekanan tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memuat nama perjanjian יְהוָה. Transliterasi 'Yahweh' mempertahankannya sebagai nama diri, bukan menggantinya dengan gelar.
- issue: Rujukan pronomina dalam לָתֵת
  choice: menempatkannya, dengan '-nya' merujuk pada lempeng/mahkota kudus
  alternative: menempatkan tali itu
  rationale: Konteks ayat sebelumnya dan fungsi tali mendukung bahwa benda yang ditempatkan pada serban ialah lempeng/mahkota kudus. Terjemahan mempertahankan pronomina sehingga hubungan antarayat tetap tampak tanpa mengulang nomina yang tidak ada dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang luhur namun mudah dipahami. 'Lalu' mengikuti kesinambungan narasi וַ־; 'serban' dipilih sebagai istilah konkret dan umum. Susunan kalimat dijaga alami sambil mempertahankan keterangan posisi dan formula ketaatan dari teks Ibrani.
