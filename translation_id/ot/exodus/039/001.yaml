base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/001.yaml
  text: And from the blue[a], the purple, and the scarlet yarn they made finely woven garments for ministering in the sanctuary, and they made the holy garments for Aaron, just as Yahweh had commanded Moses.
translation:
  language: id
  text: Dari benang biru, ungu, dan merah tua, mereka membuat pakaian tenunan halus[a] untuk melayani di tempat kudus. Mereka juga membuat pakaian kudus bagi Harun, tepat seperti yang diperintahkan Yahweh kepada Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pakaian untuk pelayanan.” Ungkapan Ibrani ini bersifat khusus dan dapat menekankan fungsi pakaian tersebut dalam pelayanan di Kemah Suci atau pengerjaannya yang halus.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַתְּכֵלֶת וְהָאַרְגָּמָן וְתוֹלַעַת הַשָּׁנִי
  choice: dari benang biru, ungu, dan merah tua
  rationale: Istilah-istilah ini menunjuk pada bahan tekstil berwarna yang lazim dalam uraian Kemah Suci. Kata “benang” memperjelas konteks pembuatan pakaian tanpa menentukan secara berlebihan corak zat pewarna kuno.
- source_word: בִגְדֵי שְׂרָד
  choice: pakaian tenunan halus
  rationale: Ungkapan khusus ini kemungkinan menunjuk pada pakaian resmi yang dikerjakan untuk pelayanan Kemah Suci. Karena nuansa שְׂרָד tidak pasti dan dapat menekankan pengerjaan atau fungsi pakaian, alternatifnya dicatat dalam catatan kaki.
- source_word: לְשָׁרֵת
  choice: untuk melayani
  rationale: Bentuk ini menyatakan tujuan dan dalam konteks merujuk pada pelaksanaan pelayanan resmi di tempat kudus.
- source_word: בַּקֹּדֶשׁ
  choice: di tempat kudus
  rationale: Istilah ini menunjuk pada lingkup sakral tempat pelayanan berlangsung. “Tempat kudus” mempertahankan ungkapan Ibrani tanpa membatasinya secara pasti pada salah satu ruang tertentu.
- source_word: בִגְדֵי הַקֹּדֶשׁ
  choice: pakaian kudus
  rationale: Terjemahan langsung ini mempertahankan sebutan resmi bagi pakaian imam Harun dan membedakannya dari ungkapan sebelumnya.
- source_word: לְאַהֲרֹן
  choice: bagi Harun
  rationale: Preposisi tersebut menyatakan peruntukan pakaian itu bagi Harun.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani dipertahankan dan tidak diganti dengan gelar.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: tepat seperti yang diperintahkan Yahweh kepada Musa
  rationale: Ungkapan ini merangkum kesesuaian pekerjaan tersebut dengan perintah Yahweh yang telah disampaikan kepada Musa.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama ilahi secara langsung. Bentuk “Yahweh” mempertahankan nama perjanjian tersebut dan tidak menggantinya dengan sebuah gelar.
- issue: Cakupan makna הַקֹּדֶשׁ
  choice: tempat kudus
  alternative: ruang kudus; kawasan kudus
  rationale: Konteks menunjukkan lingkungan sakral pelayanan Kemah Suci, tetapi tidak mengharuskan pembaca memahami istilah ini hanya sebagai ruangan tertentu. Terjemahan yang dipilih mempertahankan keluasan itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat dan mudah dipahami. “Mereka juga membuat” dipakai untuk menyampaikan kelanjutan waw berulang secara alami. Istilah kultis dipertahankan tanpa memasukkan terminologi khas denominasi tertentu.
