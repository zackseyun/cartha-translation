lexical_decisions:
- source_word: מִזְבַּח הַנְּחֹשֶׁת
  choice: mezbah perunggu
  rationale: מִזְבַּח berarti tempat persembahan atau mezbah. Dalam konteks ini bendanya terbuat dari נְחֹשֶׁת, yang secara kontekstual lazim dipahami sebagai perunggu; teks ayat ini sendiri tidak mengulang sebutan lengkap 'mezbah kurban bakaran'.
- source_word: מִכְבַּר הַנְּחֹשֶׁת
  choice: kisi-kisi perunggu
  rationale: מִכְבַּר menunjuk pada struktur berjalin atau berkisi yang terkait dengan mezbah. 'Kisi-kisi' jelas dalam bahasa Indonesia modern dan tidak menentukan secara berlebihan bentuk tepatnya.
- source_word: אֲשֶׁר לוֹ
  choice: yang menjadi bagiannya
  rationale: Ungkapan ini menyatakan hubungan kisi-kisi tersebut dengan mezbah, tetapi tidak secara tegas menentukan posisi tepatnya. Terjemahan ini mempertahankan hubungan itu tanpa menambahkan rincian lokasi.
- source_word: בַּדָּיו
  choice: kayu-kayu pengusungnya
  rationale: בַּדִּים adalah batang-batang yang dipakai untuk mengusung perlengkapan Kemah Suci. 'Kayu-kayu pengusung' alami dan lebih informatif daripada sekadar 'batang-batang'.
- source_word: כָּל־כֵּלָיו
  choice: segala perkakasnya
  rationale: כֵּלִים merupakan istilah luas bagi berbagai alat atau perlengkapan. 'Perkakas' sesuai untuk alat-alat yang digunakan bersama mezbah.
- source_word: כִּיֹּר
  choice: bak pembasuhan
  rationale: כִּיֹּר menunjuk pada wadah besar untuk pembasuhan. 'Bak pembasuhan' mudah dipahami pembaca modern dan menyampaikan fungsinya dalam konteks ibadah.
- source_word: כַּנּוֹ
  choice: penyangganya
  rationale: כֵּן di sini adalah bagian yang menopang bak. 'Penyangga' menyampaikan fungsi tersebut, sementara 'alas' juga mungkin.
