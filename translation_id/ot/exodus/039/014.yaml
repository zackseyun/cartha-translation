source:
  edition: WLC
  text: וְ֠/הָ/אֲבָנִים עַל שְׁמֹ֨ת בְּנֵי יִשְׂרָאֵ֥ל הֵ֛נָּה שְׁתֵּ֥ים עֶשְׂרֵ֖ה עַל שְׁמֹתָ֑/ם פִּתּוּחֵ֤י חֹתָם֙ אִ֣ישׁ עַל שְׁמ֔/וֹ לִ/שְׁנֵ֥ים עָשָׂ֖ר שָֽׁבֶט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/014.yaml
  text: And the stones corresponded to the names of the sons of Israel[a], twelve according to their names, engraved like a signet, each according to its name[c][b], for the twelve tribes.
translation:
  language: id
  text: Batu-batu itu sesuai dengan nama-nama putra-putra Israel[a][c]—dua belas batu, menurut nama mereka. Batu-batu itu diukir seperti ukiran pada meterai[b], masing-masing menurut namanya, untuk kedua belas suku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memuat nama-nama putra-putra Israel.” Kata depan Ibrani dapat menyatakan hubungan erat atau kesesuaian.
    reason: lexical_alternative
  - marker: b
    text: Atau “dengan ukiran-ukiran meterai.” Maksudnya ialah ukiran tulisan seperti yang dibuat pada sebuah meterai.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “putra-putra Israel.” Dalam konteks ini, yang dimaksud ialah para putra Israel yang namanya menjadi nama kedua belas suku; ungkapan Ibrani ini juga dipakai bagi umat keturunan Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָאֲבָנִים
  choice: Batu-batu itu
  rationale: Kata benda tentu dengan kata penghubung; “batu-batu” mempertahankan arti dasarnya dalam konteks tutup dada tanpa menambahkan bahwa semuanya batu permata.
- source_word: עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: berpadanan dengan nama-nama putra Israel
  rationale: עַל di sini menyatakan hubungan atau kesesuaian, bukan sekadar posisi “di atas”. “Berpadanan dengan” mempertahankan hubungan itu tanpa memastikan apakah nama-nama tersebut hanya tertera atau juga diwakili oleh setiap batu.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: putra Israel
  rationale: Ungkapan ini secara dekat menerjemahkan bentuk maskulin Ibrani dan, dalam konteks ini, menunjuk kepada para putra Israel yang menjadi asal nama kedua belas suku.
- source_word: הֵנָּה שְׁתֵּים עֶשְׂרֵה
  choice: dua belas batu
  rationale: Kata ganti Ibrani dan bilangan menegaskan jumlah batu. Pengulangan “batu” membuat acuannya jelas dan alami dalam bahasa Indonesia.
- source_word: עַל שְׁמֹתָם
  choice: menurut nama mereka
  rationale: Mempertahankan pola hubungan dengan nama yang diulangi dalam teks Ibrani.
- source_word: פִּתּוּחֵי חֹתָם
  choice: diukir seperti meterai
  rationale: Frasa ini menggambarkan cara pengukiran sebagaimana tulisan pada meterai; bentuk verbal ini alami dalam bahasa Indonesia sambil mempertahankan perbandingannya.
- source_word: אִישׁ עַל שְׁמוֹ
  choice: masing-masing menurut namanya
  rationale: אִישׁ dipakai secara distributif. Bentuk Indonesia ini mempertahankan kaitan satu per satu antara batu dan nama tanpa memaksakan pronomina bergender.
- source_word: לִשְׁנֵים עָשָׂר שָׁבֶט
  choice: untuk kedua belas suku
  rationale: Kata depan ל menyatakan hubungan atau peruntukan batu-batu itu bagi kedua belas suku.
theological_decisions:
- issue: Cakupan sebutan בְּנֵי יִשְׂרָאֵל
  choice: putra Israel
  alternative: orang Israel / keturunan Israel
  rationale: Dalam konteks dua belas nama dan dua belas suku, rujukan langsungnya adalah para putra Israel, sedangkan ungkapan yang sama juga menjadi sebutan perjanjian bagi keturunan mereka. Terjemahan utama mempertahankan bentuk konkret teks dan catatan menjelaskan cakupannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Kalimat panjang Ibrani dibagi menjadi dua kalimat agar mudah dipahami, sedangkan pengulangan tentang nama, jumlah dua belas, dan hubungan masing-masing batu dengan satu nama tetap dipertahankan.
