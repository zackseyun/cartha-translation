  terminology: “Putra-putra Israel” mempertahankan rujukan langsung kepada dua belas anak laki-laki Israel tanpa menggantinya dengan “orang Israel,” yang akan mengaburkan hubungan antara nama-nama itu dan suku-suku. “Suku” tepat untuk שָׁבֶט.
