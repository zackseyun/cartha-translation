translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan lokasi ditempatkan di awal agar kalimat mengalir alami. Istilah “buah-buah delima” mempertahankan ungkapan konkret Ibrani tanpa secara diam-diam menggantinya dengan “hiasan berbentuk buah delima.”
