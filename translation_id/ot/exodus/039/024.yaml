  text: And they made pomegranates of blue and purple and scarlet yarn[a], twisted[b], on the hem of the robe.
translation:
  language: id
  text: Pada kelim jubah itu mereka membuat buah-buah delima dari benang biru, ungu, dan merah kirmizi yang dipilin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “delima.” Dalam konteks pakaian imam, istilah ini merujuk pada hiasan tekstil berbentuk buah delima. Kata “benang” memperjelas bahwa rangkaian warna ini menyebut bahan tekstil; “yang dipilin” menerangkan pengerjaan benangnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: mereka membuat
  rationale: Bentuk wayyiqtol Qal orang ketiga jamak dari עשה menyatakan tindakan naratif biasa; “membuat” merupakan padanan Indonesia yang langsung dan alami.
- source_word: עַל שׁוּלֵי הַמְּעִיל
  choice: pada kelim jubah itu
  rationale: עַל menunjukkan lokasi, sedangkan bentuk jamak konstruksi שׁוּלֵי menunjuk bagian tepi bawah pakaian. “Kelim” tepat untuk tepi bawah jubah dan tetap mudah dipahami.
- source_word: רִמּוֹנֵי
  choice: buah-buah delima
  rationale: Teks Ibrani hanya menyebut “delima”; dalam konteks ini yang dimaksud ialah hiasan tekstil berbentuk buah delima. Terjemahan utama mempertahankan penamaan konkret sumber.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: benang biru, ungu, dan merah tua
  rationale: Ketiga istilah menunjuk bahan tekstil berwarna dalam uraian Kemah Suci. “Benang” ditambahkan satu kali untuk memperjelas jenis bahannya, sementara warna diterjemahkan dengan istilah Indonesia yang lazim.
- source_word: מָשְׁזָר
  choice: yang dipintal
  rationale: Bentuk ini menggambarkan bahan tekstil yang dipilin atau dipintal. “Dipintal” alami dalam bahasa Indonesia dan menghubungkannya dengan rangkaian benang yang mendahuluinya.
