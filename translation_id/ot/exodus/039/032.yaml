  text: וַ/תֵּ֕כֶל כָּל עֲבֹדַ֕ת מִשְׁכַּ֖ן אֹ֣הֶל מוֹעֵ֑ד וַֽ/יַּעֲשׂוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה כֵּ֥ן עָשֽׂוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/032.yaml
  text: Thus all the work of the tabernacle[a], the tent of meeting, was finished, and the sons of Israel did according to all that Yahweh had commanded Moses[b]; so they did.
translation:
  language: id
  text: Demikianlah seluruh pekerjaan untuk Kemah Suci, yaitu Kemah Pertemuan, selesai. Orang Israel melakukan segala sesuatu tepat seperti yang diperintahkan Yahweh kepada Musa; demikianlah mereka melakukannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּכֶל
  choice: selesai
  rationale: Dalam konteks ini, verba כלה menyatakan bahwa seluruh proyek telah dituntaskan. Bentuk 'selesai' alami dalam bahasa Indonesia dan tetap menempatkan fokus pada pekerjaan.
- source_word: כָּל עֲבֹדַת
  choice: seluruh pekerjaan
  rationale: Menggabungkan daya cakup כָּל dengan makna עֲבֹדָה sebagai pekerjaan pembuatan tempat suci, bukan terutama pelayanan ritual.
- source_word: מִשְׁכַּן
  choice: Kemah Suci
  rationale: Istilah yang jelas dan lazim dalam bahasa Indonesia untuk tempat kudus portabel Israel; unsur 'kemah' mempertahankan sifat bangunannya, sedangkan 'suci' menjelaskan fungsi khususnya.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Menerjemahkan gelar tempat kudus sebagai tempat pertemuan yang ditetapkan, dengan bentuk yang alami dan mapan dalam bahasa Indonesia.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Orang Israel
  rationale: Ungkapan Ibrani harfiah 'anak-anak Israel' berfungsi sebagai sebutan kolektif bagi bangsa Israel. 'Orang Israel' menyampaikan rujukan korporat itu secara alami tanpa menyiratkan hanya keturunan laki-laki.
- source_word: כְּכֹל אֲשֶׁר
  choice: segala sesuatu tepat seperti yang
  rationale: Menyatakan kesesuaian penuh dengan perintah. Kata 'tepat' membuat daya komparatif prefiks כְּ jelas tanpa mengubah isi.
- source_word: צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: yang diperintahkan Yahweh kepada Musa
  rationale: Bentuk pasif Indonesia ini mempertahankan Yahweh sebagai sumber perintah dan Musa sebagai penerimanya dengan urutan yang wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה, bukan menggantinya dengan gelar.
- source_word: כֵּן עָשׂוּ
  choice: demikianlah mereka melakukannya
  rationale: Mempertahankan pengulangan penutup dalam teks Ibrani, yang menegaskan ketaatan penuh, sambil tetap alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama pribadi ilahi secara langsung. 'Yahweh' mempertahankan nama tersebut, sedangkan 'TUHAN' merupakan penggantian tradisional dengan sebuah gelar.
- issue: Cakupan ungkapan korporat בְּנֵי יִשְׂרָאֵל
  choice: Orang Israel
  alternative: anak-anak Israel
  rationale: Ungkapan ini adalah sebutan kebangsaan kolektif. Pilihan 'Orang Israel' menjaga cakupan seluruh komunitas dan terdengar wajar dalam bahasa Indonesia modern; bentuk harfiah dapat disalahpahami sebagai anak-anak secara usia atau hanya putra-putra.
- issue: Pengulangan tindakan pada akhir ayat
  choice: 'dipertahankan: ''demikianlah mereka melakukannya'''
  alternative: dihilangkan demi kelancaran
  rationale: Pengulangan כֵּן עָשׂוּ memiliki fungsi penegasan teologis dan sastra bahwa pekerjaan dilakukan sesuai perintah, sehingga tidak sebaiknya dihaluskan hingga hilang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kalimat dibagi menjadi dua agar mudah dibaca, tetapi struktur kesimpulan dan penegasan ketaatan dalam bahasa Ibrani tetap dipertahankan. Kapitalisasi 'Kemah Suci' dan 'Kemah Pertemuan' menandai sebutan khusus bagi tempat kudus.
