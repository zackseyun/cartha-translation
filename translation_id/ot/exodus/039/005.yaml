base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/005.yaml
  text: 'And the skillfully woven band of his ephod[a], which was on it, was of one piece with it and made like it: of gold, blue, purple, scarlet yarn, and fine twisted linen, just as Yahweh had commanded Moses.'
translation:
  language: id
  text: Sabuk tenunan indah pada efodnya[a], yang ada padanya, merupakan satu kesatuan dengan efod itu dan dikerjakan dengan cara yang sama, dari emas, benang biru, ungu, dan merah tua, serta lenan halus yang dipintal, tepat seperti yang diperintahkan Yahweh kepada Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sabuk berhias pada efodnya ... berasal dari efod itu dan memiliki pengerjaan yang sama.” Bahasa Ibrani menekankan bahwa sabuk tersebut merupakan bagian integral dari efod dan pengerjaannya serasi dengan efod itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵשֶׁב אֲפֻדָּתוֹ
  choice: sabuk tenunan indah pada efodnya
  rationale: Dalam konteks pakaian imam, חֵשֶׁב menunjuk pada sabuk atau pengikat tenunan yang menjadi bagian dari efod. Pilihan ini menyampaikan fungsi tekstil dan mutu pengerjaannya, sedangkan bentuk posesif pada אֲפֻדָּתוֹ dipertahankan dengan '-nya'.
- source_word: אֲשֶׁר עָלָיו
  choice: yang terpasang padanya
  rationale: Secara harfiah berarti 'yang di atas/padanya'. Dalam konteks pakaian, 'terpasang padanya' menyampaikan letak serta hubungan sabuk dengan efod tanpa menetapkan cara pemasangan yang tidak disebutkan.
- source_word: מִמֶּנּוּ הוּא
  choice: menyatu dengan efod itu
  rationale: Ungkapan ini menekankan bahwa sabuk berasal dari atau merupakan bagian integral dari efod, bukan aksesori yang sepenuhnya terpisah.
- source_word: כְּמַעֲשֵׂהוּ
  choice: dibuat dengan pengerjaan yang sama
  rationale: Terjemahan ini mempertahankan gagasan bahwa corak atau mutu pengerjaan sabuk sesuai dengan pengerjaan efod.
- source_word: זָהָב תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: emas, benang biru, ungu, dan merah tua
  rationale: Istilah warna dibaca sebagai bahan tekstil dalam daftar bahan. Kata 'benang' dicantumkan sekali dan berlaku alami bagi ketiga warna, sementara emas tetap disebut tersendiri.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: lenan halus yang dipintal
  rationale: Mempertahankan baik mutu bahan שֵׁשׁ maupun keadaan benang yang dipintal sebagaimana dinyatakan oleh מָשְׁזָר.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: tepat seperti yang diperintahkan Yahweh kepada Musa
  rationale: Menyampaikan formula ketaatan dengan jelas dan mempertahankan nama ilahi יהוה sebagai 'Yahweh'.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung; 'Yahweh' mempertahankan nama tersebut dan mengikuti lapisan konsultasi yang diberikan.
- issue: Hubungan sabuk dengan efod
  choice: menyatu dengan efod itu
  alternative: berasal darinya
  rationale: Konteks pakaian dan frasa מִמֶּנּוּ הוּא mendukung hubungan integral, tetapi catatan kaki tetap menyimpan kemungkinan ungkapan yang lebih harfiah dan kurang interpretatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah teknis 'efod' dipertahankan karena menunjuk pada pakaian imam tertentu. Susunan bahan dibuat alami dalam bahasa Indonesia tanpa menghilangkan rincian tekstil dari teks Ibrani.
