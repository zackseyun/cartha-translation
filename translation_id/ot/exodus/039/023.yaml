translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Kalimat dibagi menjadi dua agar rincian konstruksi pakaian mudah dipahami. Ketidakpastian istilah teknis תַּחְרָא dipertahankan melalui catatan kaki.
