  text: And the opening of the robe was in the middle of it[a], like the opening of a coat of mail, with a binding around its opening, so that it would not be torn.
translation:
  language: id
  text: Lubang leher pada jubah itu berada di tengahnya, seperti lubang leher pada baju zirah[a], dengan tepi di sekeliling lubang itu supaya tidak robek.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani תַּחְרָא jarang dipakai; maknanya tidak pasti, tetapi biasanya dipahami sebagai sejenis pakaian pelindung. Dapat juga diterjemahkan “baju rantai” atau “zirah dada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִי הַמְּעִיל
  choice: lubang leher jubah
  rationale: Dalam konteks pakaian, פֶּה menunjuk pada bukaan; karena bukaan ini berada di tengah jubah dan menjadi jalan masuk kepala, 'lubang leher' paling jelas dan alami dalam bahasa Indonesia.
- source_word: בְּתוֹכוֹ
  choice: berada di tengahnya
  rationale: Frasa ini menyatakan letak bukaan pada bagian tengah pakaian.
- source_word: כְּפִי תַחְרָא
  choice: seperti lubang leher baju zirah
  rationale: תַּחְרָא adalah istilah langka bagi pakaian pelindung atau zirah. 'Baju zirah' dapat dipahami pembaca modern, sedangkan catatan kaki mempertahankan ketidakpastian jenis persisnya.
- source_word: שָׂפָה
  choice: tepian
  rationale: Secara harfiah berarti 'bibir/tepi'; dalam konteks ini menunjuk pada tepi yang dibuat mengelilingi dan memperkuat lubang pakaian tanpa menambahkan bahan atau teknik yang tidak dinyatakan.
- source_word: לְפִיו סָבִיב
  choice: di sekeliling lubang itu
  rationale: Menyampaikan bahwa tepian tersebut mengitari seluruh bukaan dengan wajar dalam bahasa Indonesia.
- source_word: לֹא יִקָּרֵעַ
  choice: supaya tidak robek
  rationale: Bentuk ini paling wajar dipahami sebagai tujuan atau hasil yang dimaksudkan dari tepian penguat tersebut.
