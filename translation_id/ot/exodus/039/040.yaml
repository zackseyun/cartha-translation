lexical_decisions:
- source_word: קַלְעֵי
  choice: tirai-tirai
  rationale: Dalam konteks halaman Kemah Suci, kata ini menunjuk pada lembaran kain tenun yang membentuk pagar keliling. “Tirai-tirai” wajar dalam bahasa Indonesia dan tetap dapat dibedakan dari tirai khusus pada pintu gerbang.
- source_word: חָצֵר
  choice: halaman
  rationale: Yang dimaksud ialah area terbuka berpagar di sekeliling Kemah Suci. “Halaman” jelas dan alami dalam bahasa Indonesia modern; “pelataran” merupakan alternatif yang lebih formal.
- source_word: עַמֻּדֶיהָ
  choice: tiang-tiangnya
  rationale: Kata ini menunjuk pada penyangga tegak bagi tirai-tirai halaman. “Tiang” lebih tepat dan alami daripada “pilar” untuk bangunan portabel ini.
- source_word: אֲדָנֶיהָ
  choice: alas-alasnya
  rationale: Kata ini menunjuk pada bagian fondasi tempat tiang dipasang. “Alas” mudah dipahami, sedangkan “soket” lebih teknis.
- source_word: הַמָּסָךְ
  choice: tirai penutup
  rationale: Istilah ini menunjuk pada tirai yang menutup jalan masuk. Tambahan “penutup” membedakannya dari tirai-tirai keliling halaman tanpa menyiratkan benda yang kaku.
- source_word: לְשַׁעַר הֶחָצֵר
  choice: untuk pintu gerbang halaman
  rationale: Preposisi menyatakan peruntukan tirai, yakni bagi jalan masuk halaman. “Pintu gerbang” mempertahankan makna שַׁעַר sambil terdengar alami.
- source_word: מֵיתָרָיו
  choice: tali-temalinya
  rationale: Kata ini menunjuk pada tali pengikat atau penegang struktur. “Tali-temali” menyampaikan makna kolektifnya dengan jelas.
- source_word: וִיתֵדֹתֶיהָ
  choice: patok-patoknya
  rationale: Yang dimaksud ialah patok yang ditancapkan ke tanah untuk menahan tali. “Patok” merupakan istilah Indonesia yang ringkas dan tepat.
- source_word: כָּל כְּלֵי עֲבֹדַת
  choice: segala perlengkapan untuk pelayanan di
  rationale: כְּלֵי bersifat luas dan kolektif, sehingga “perlengkapan” lebih alami daripada membatasinya pada perkakas atau perkakas makan. עֲבֹדָה di sini menunjuk pada tugas pelayanan yang dilakukan berkaitan dengan tempat suci.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: Sebutan ini menyampaikan bahwa tempat kediaman kudus tersebut berupa bangunan kemah portabel dan merupakan padanan yang mapan serta mudah dipahami.
- source_word: לְאֹהֶל מוֹעֵד
  choice: yaitu Kemah Pertemuan
  rationale: Frasa ini menjadi sebutan bagi tempat suci yang baru disebut. “Kemah Pertemuan” mempertahankan unsur אֹהֶל dan מוֹעֵד, sedangkan “yaitu” membuat hubungan penyebutan itu jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Hubungan antara הַמִּשְׁכָּן dan לְאֹהֶל מוֹעֵד
  choice: Kemah Suci, yaitu Kemah Pertemuan
  alternative: Kemah Suci, untuk Kemah Pertemuan
  rationale: Dalam daftar inventaris ini kedua ungkapan menunjuk pada kompleks tempat suci yang sama dari sudut sebutan yang berbeda. “Yaitu” menghasilkan bahasa Indonesia yang alami tanpa memasukkan pembedaan teologis antara dua tempat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya daftar inventaris yang khidmat tetapi mudah dipahami. Bentuk jamak dinyatakan dengan pengulangan atau istilah kolektif sesuai kelaziman bahasa Indonesia. Tanda titik koma dipertahankan karena ayat ini merupakan bagian dari daftar yang berlanjut dari konteks sebelumnya.
