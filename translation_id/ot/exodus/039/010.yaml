base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/010.yaml
  text: 'And they mounted on it four rows of stones: the first row was a ruby[a], a topaz, and an emerald.'
translation:
  language: id
  text: Mereka memasang padanya empat baris batu permata. Baris pertama terdiri atas batu delima[a], batu topas, dan batu zamrud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jenis persis batu-batu permata ini tidak dapat dipastikan. “Batu delima”, “batu topas”, dan “batu zamrud” mengikuti terjemahan tradisional yang umum. Kemungkinan padanan lainnya ialah “karnelian” untuk batu delima, “krisolit” untuk batu topas, dan sejenis batu hijau cerah atau batu berkilau lainnya untuk batu zamrud.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלְאוּ
  choice: Mereka memasang
  rationale: Secara harfiah verba ini berarti 'memenuhi', tetapi dalam konteks batu-batu permata yang ditempatkan pada tutup dada, 'memasang' menyampaikan tindakan tersebut secara alami dalam bahasa Indonesia.
- source_word: בּוֹ
  choice: padanya
  rationale: Pronomina ini merujuk kepada tutup dada; 'padanya' mempertahankan hubungan itu tanpa menentukan secara berlebihan apakah batu-batu tersebut berada 'di dalam' atau 'di atas' permukaannya.
- source_word: אַרְבָּעָה טוּרֵי אָבֶן
  choice: empat baris batu permata
  rationale: טוּרֵי berarti 'baris-baris', sedangkan אָבֶן dipakai secara kolektif. Tambahan 'permata' memperjelas konteks perhiasan dan alami dalam bahasa Indonesia.
- source_word: טוּר
  choice: baris
  rationale: '''Baris'' konsisten dengan frasa sebelumnya dan cocok untuk susunan batu-batu pada tutup dada.'
- source_word: אֹדֶם
  choice: batu delima
  rationale: Identifikasi mineralnya tidak pasti. 'Batu delima' merupakan padanan tradisional yang dikenal luas; kemungkinan 'karnelian' dicatat dalam catatan kaki.
- source_word: פִּטְדָה
  choice: batu topas
  rationale: Identifikasi tepatnya tidak pasti, tetapi 'topas' adalah padanan tradisional yang umum; kemungkinan krisolit dipertahankan dalam catatan kaki.
- source_word: בָרֶקֶת
  choice: batu zamrud
  rationale: Istilah ini mungkin menunjuk pada batu yang berkilau atau memancarkan cahaya. 'Zamrud' mengikuti padanan tradisional, sementara ketidakpastian leksikal dinyatakan dalam catatan kaki.
- source_word: הַטּוּר הָאֶחָד
  choice: Baris pertama terdiri atas
  rationale: Dalam konteks empat baris, ungkapan ini menunjuk kepada baris pertama. 'Terdiri atas' melengkapi daftar secara wajar dalam bahasa Indonesia.
