  source_fidelity: 'Terjemahan ini setia pada struktur dan isi teks Ibrani: tindakan menempatkan/memasang empat baris batu pada tutup dada, lalu daftar tiga batu dalam baris pertama. “Memasang padanya” merupakan pengungkapan idiomatis yang sah untuk וַיְמַלְאוּ בּוֹ dalam konteks tatahan batu, tanpa memaksakan lokasi “di dalam” atau “di atas.”'
