id: EXO.39.30
reference: Exodus 39:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֛וּ אֶת צִ֥יץ נֵֽזֶר הַ/קֹּ֖דֶשׁ זָהָ֣ב טָה֑וֹר וַ/יִּכְתְּב֣וּ עָלָ֗י/ו מִכְתַּב֙ פִּתּוּחֵ֣י חוֹתָ֔ם קֹ֖דֶשׁ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/030.yaml
  text: They made the plate[a], the holy crown, of pure gold, and they inscribed on it, like the engraving of a seal, “Holy to Yahweh.”
translation:
  language: id
  text: Mereka membuat lempeng itu, yaitu mahkota kudus, dari emas murni. Pada lempeng itu mereka menuliskan, seperti ukiran meterai, “Kudus bagi Yahweh.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kekudusan bagi Yahweh.”
    reason: Frasa Ibrani dapat dipahami sebagai pernyataan dedikatif, 'Kudus bagi Yahweh,' atau sebagai frasa nominal, 'Kekudusan bagi Yahweh.'
lexical_decisions:
- source_word: צִיץ
  choice: lempeng
  rationale: Dalam konteks pakaian imam, kata ini menunjuk pada lempeng emas yang dipasang pada serban; 'lempeng' jelas dan sesuai dengan bahan yang disebutkan.
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: mahkota kudus
  rationale: נֵזֶר berarti mahkota atau diadem yang dikhususkan. Frasa 'yaitu mahkota kudus' mempertahankan hubungan aposisional dengan lempeng tanpa meleburkan kedua nomina.
- source_word: זָהָב טָהוֹר
  choice: emas murni
  rationale: Padanan alami dalam bahasa Indonesia yang mempertahankan penekanan pada mutu dan kemurnian bahan.
- source_word: וַיִּכְתְּבוּ עָלָיו
  choice: pada lempeng itu mereka menuliskan
  rationale: Kata kerjanya secara dasar berarti 'menulis'; 'menuliskan' sesuai untuk tulisan pada sebuah benda, sedangkan sifat ukirannya dijelaskan oleh frasa berikutnya.
- source_word: מִכְתַּב פִּתּוּחֵי חוֹתָם
  choice: seperti ukiran meterai
  rationale: Ungkapan ini menerangkan cara tulisan itu dibuat, yakni menyerupai ukiran pada meterai.
- source_word: קֹדֶשׁ לַיהוָה
  choice: Kudus bagi Yahweh
  rationale: Mempertahankan bentuk prasasti yang singkat dan daya dedikatif frasa Ibrani. Kemungkinan nominal 'Kekudusan bagi Yahweh' dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama pribadi dalam teks sumber.
- issue: Makna prasasti קֹדֶשׁ לַיהוָה
  choice: Kudus bagi Yahweh
  alternative: Kekudusan bagi Yahweh
  rationale: Nomina Ibrani קֹדֶשׁ dapat dipahami secara predikatif/dedikatif atau sebagai nomina abstrak. Teks utama memakai rumusan Indonesia yang ringkas dan alami, sementara alternatif yang lebih nominal dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur dipecah menjadi dua kalimat agar mudah dibaca tanpa menghilangkan hubungan antarklausa. Istilah 'meterai' dipilih untuk חוֹתָם karena sesuai dengan konteks ukiran kuno.
