base_translation:
  language: en
  yaml_path: translation/ot/exodus/039/003.yaml
  text: They hammered out sheets of gold and cut it into threads[a], to work it into the blue and into the purple and into the scarlet yarn and into the fine linen[c][b], the work of a skillful designer.
translation:
  language: id
  text: Mereka menempa emas menjadi lembaran-lembaran tipis[a], lalu memotongnya menjadi benang-benang emas[b] untuk ditenunkan ke dalam benang biru, ungu, dan merah tua serta lenan halus—pekerjaan seorang perancang yang terampil[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “kepingan-kepingan emas.” Kata Ibraninya menunjuk pada potongan logam tipis yang ditempa.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “memotongnya menjadi pita-pita tipis.” Maksudnya, emas itu dipersiapkan menjadi filamen halus agar dapat ditenun ke dalam kain.
    reason: lexical_alternative
  - marker: c
    text: “Pekerjaan seorang perancang yang terampil” menerjemahkan suatu ungkapan teknis bagi pengerjaan artistik oleh seorang ahli. Dapat juga diterjemahkan “pekerjaan seorang perajin yang terampil” atau “tenunan artistik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְרַקְּעוּ אֶת פַּחֵי הַזָּהָב
  choice: Mereka menempa emas menjadi lembaran-lembaran tipis
  rationale: Dalam konteks pengerjaan logam, רקע menyatakan tindakan menempa logam hingga pipih, sedangkan פַּחֵי menunjuk pada kepingan atau lembaran logam tipis. Rumusan ini alami dalam bahasa Indonesia dan mempertahankan tindakan serta hasilnya.
- source_word: וְקִצֵּץ פְּתִילִם
  choice: lalu mengirisnya menjadi benang-benang
  rationale: Bentuk tunggal verba Ibrani setelah subjek jamak dapat dipahami sebagai kelanjutan tindakan kelompok tersebut. 'Mengirisnya menjadi benang-benang' menyampaikan bahwa lembaran emas dipotong menjadi filamen sempit untuk ditenun.
- source_word: לַעֲשׂוֹת בְּתוֹךְ
  choice: untuk ditenunkan ke dalam
  rationale: Secara harfiah ungkapan ini berarti 'untuk mengerjakan/membuat di tengah/dalam'. Dalam konteks tekstil, maksudnya ialah memasukkan filamen emas ke dalam tenunan; bentuk pasif 'ditenunkan' menjelaskan proses tanpa menambahkan bahan baru.
- source_word: הַתְּכֵלֶת וְהָאַרְגָּמָן וְתוֹלַעַת הַשָּׁנִי
  choice: benang biru, ungu, dan merah tua
  rationale: Ketiga istilah menunjuk pada bahan tekstil berwarna. Kata 'benang' dinyatakan sekali dan mencakup ketiga warna agar jelas dan tidak bertele-tele; 'merah tua' merupakan padanan Indonesia yang wajar bagi warna scarlet.
- source_word: הַשֵּׁשׁ
  choice: lenan halus
  rationale: Dalam konteks Kemah Suci, שֵׁשׁ menunjuk pada lenan berkualitas halus.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: sebagai karya seorang perancang yang terampil
  rationale: Ungkapan teknis ini menyatakan pengerjaan artistik yang dirancang dengan keahlian. 'Perancang yang terampil' menjaga unsur rancangan dan keterampilan tanpa membatasi pelakunya pada jabatan kerajinan yang terlalu spesifik.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Urutan bahan dipertahankan, tetapi kata 'benang' dipakai secara distributif untuk ketiga bahan berwarna. Penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
