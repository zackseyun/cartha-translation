  to: Mereka menempa emas menjadi lembaran-lembaran tipis[a], lalu memotongnya menjadi benang-benang emas[b] untuk ditenunkan ke dalam benang biru, ungu, dan merah tua serta lenan halus—pekerjaan seorang perancang yang terampil[c].
