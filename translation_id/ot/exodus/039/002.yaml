  text: And he made the ephod of gold[a], blue, purple, scarlet yarn[b], and finely twisted linen.
translation:
  language: id
  text: Ia membuat efod itu dari emas, benang biru, benang ungu, benang merah kirmizi, dan lenan halus yang dipilin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia membuat
  rationale: Bentuk wayyiqtol dari עשה melanjutkan rangkaian narasi dengan tindakan lampau sederhana. Dalam bahasa Indonesia, urutan naratif sudah jelas tanpa harus menambahkan kata penghubung.
- source_word: הָאֵפֹד
  choice: efod itu
  rationale: אֵפֹד adalah istilah khusus bagi perlengkapan atau pakaian imam. Bentuk transliterasi "efod" mempertahankan istilah kultisnya, sedangkan "itu" menandai ketakrifan.
- source_word: זָהָב
  choice: emas
  rationale: Kata ini secara langsung menyebut bahan emas. Konteks ayat berikutnya menjelaskan bahwa emas tersebut dikerjakan menjadi benang, tetapi rincian itu tidak ditambahkan ke ayat ini.
- source_word: תְּכֵלֶת
  choice: benang biru
  rationale: Istilah ini menunjuk pada bahan tekstil berwarna biru dalam perlengkapan Kemah Suci. "Benang" dibuat eksplisit dari konteks pembuatan tekstil agar daftar bahan alami dalam bahasa Indonesia.
- source_word: וְאַרְגָּמָן
  choice: ungu
  rationale: Istilah warna dan bahan tekstil ini secara wajar diterjemahkan "ungu"; kata "benang" dari unsur sebelumnya juga menaungi unsur ini dalam daftar.
- source_word: וְתוֹלַעַת שָׁנִי
  choice: merah tua
  rationale: Ungkapan ini menunjuk pada bahan yang dicelup dengan warna scarlet. "Merah tua" merupakan padanan Indonesia yang alami dalam konteks warna tekstil, tanpa menentukan bahan lebih jauh daripada teks.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: serta lenan halus yang dipintal
  rationale: שֵׁשׁ berarti lenan halus, sedangkan מָשְׁזָר menerangkan bahwa bahan itu dipintal atau dipilin. Susunan ini jelas dan alami dalam bahasa Indonesia modern.
