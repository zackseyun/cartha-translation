  yaml_path: translation/ot/exodus/039/015.yaml
  text: And they made on the breastpiece chains of braided work[a], like cords, of pure gold.
translation:
  language: id
  text: Pada tutup dada itu mereka membuat rantai-rantai dari emas murni, berupa jalinan seperti tali.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berupa pilinan seperti tali” atau “dibuat dengan pola tali”. Teks Ibrani menggambarkan rantai yang dibuat dengan pola terjalin atau menyerupai tali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: mereka membuat
  rationale: Bentuk naratif dari עשה paling langsung dan wajar diterjemahkan dengan “membuat”.
- source_word: עַל הַחֹשֶׁן
  choice: pada tutup dada itu
  rationale: עַל menyatakan penempatan atau pemasangan pada חֹשֶׁן, perlengkapan imam besar yang dikenakan di dada; “tutup dada” jelas dan alami dalam bahasa Indonesia.
- source_word: שַׁרְשְׁרֹת
  choice: rantai-rantai
  rationale: Nomina jamak ini menunjuk pada rantai; bentuk ulang mempertahankan makna jamaknya secara jelas.
- source_word: גַּבְלֻת מַעֲשֵׂה עֲבֹת
  choice: berupa jalinan seperti tali
  rationale: Gabungan ungkapan ini menggambarkan rantai yang dikerjakan dalam pola terjalin, terpilin, atau menyerupai tali. Pilihan ini menyampaikan bentuk dan pengerjaannya tanpa kepastian berlebihan tentang teknik yang dimaksud.
- source_word: זָהָב טָהוֹר
  choice: dari emas murni
  rationale: Ungkapan bahan ini diterjemahkan secara alami dan tepat sebagai “dari emas murni”.
