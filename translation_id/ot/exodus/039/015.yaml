  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Istilah teknis dijelaskan secara alami, sementara ketidakpastian mengenai tepatnya teknik pembuatan rantai dipertahankan dalam catatan kaki.
