  text: 'and the fourth row: beryl[a], onyx, and jasper[b], mounted in settings of gold in their mountings.'
translation:
  language: id
  text: 'dan baris yang keempat: beril[a], oniks, dan yaspis, semuanya dipasang pada tatahan emas, pada dudukannya masing-masing.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Identifikasi tepat beberapa batu permata pada tutup dada imam besar tidak pasti. “Beril,” “oniks,” dan “yaspis” adalah padanan tradisional yang umum.
    reason: lexical_alternative
  - marker: b
    text: Atau, “dilingkupi oleh tatahan emas pada dudukannya masing-masing.” Frasa Ibrani pada bagian akhir bersifat teknis dan mungkin menunjuk pada cara batu-batu itu dipasang dalam rongga atau dudukan yang telah ditentukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר הָרְבִיעִי
  choice: dan baris yang keempat
  rationale: Dalam daftar batu pada tutup dada, טוּר menunjuk pada satu baris batu; konjungsi וְ diterjemahkan secara wajar sebagai 'dan'.
- source_word: תַּרְשִׁישׁ
  choice: batu beril
  rationale: Identifikasi mineral ini tidak pasti. 'Beril' merupakan padanan tradisional yang umum, tetapi ketidakpastiannya dinyatakan dalam catatan kaki.
- source_word: שֹׁהַם
  choice: batu krisopras
  rationale: Identifikasi שֹׁהַם diperdebatkan. Dalam konteks daftar batu permata Perjanjian Lama, 'krisopras' dipilih sebagai nama batu yang dikenal dalam bahasa Indonesia, sambil mencatat alternatif tradisional 'batu oniks'.
- source_word: וְיָשְׁפֵה
  choice: dan batu yaspis
  rationale: יָשְׁפֵה lazim dipadankan dengan yaspis; konjungsi dipertahankan.
- source_word: מוּסַבֹּת מִשְׁבְּצֹת זָהָב
  choice: semuanya dipasang dalam tatahan emas
  rationale: Bentuk pasif מוּסַבֹּת menyatakan bahwa batu-batu itu dipasang atau dilingkupi, sedangkan מִשְׁבְּצֹת זָהָב menunjuk pada tatahan atau dudukan dari emas.
- source_word: בְּמִלֻּאֹתָם
  choice: pada tempatnya masing-masing
  rationale: Ungkapan teknis ini berkaitan dengan penempatan batu dalam rongga atau dudukannya. Terjemahan ini alami dalam bahasa Indonesia dan mempertahankan gagasan bahwa setiap batu dipasang pada tempat yang ditentukan.
