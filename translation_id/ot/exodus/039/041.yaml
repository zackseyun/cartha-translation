  yaml_path: translation/ot/exodus/039/041.yaml
  text: the garments of woven work for ministering in the sanctuary[a], the holy garments for Aaron the priest, and the garments of his sons for serving as priests.
translation:
  language: id
  text: pakaian tenunan untuk melayani di tempat kudus[a], pakaian kudus untuk Harun sang imam, dan pakaian putra-putranya untuk menjalankan tugas sebagai imam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pakaian pelayanan”; ungkapan Ibrani ini tampaknya menunjuk pada kain atau pakaian yang dibuat secara khusus untuk pelayanan di tempat kudus.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי
  choice: pakaian
  rationale: בֶּגֶד berarti pakaian. Pilihan ini alami dalam bahasa Indonesia dan sesuai untuk busana keimaman tanpa memasukkan istilah gerejawi yang lebih kemudian.
- source_word: הַשְּׂרָד
  choice: hasil tenunan
  rationale: Dalam konteks Kemah Suci, שְׂרָד menunjuk pada hasil kerja tekstil khusus. Frasa ini mempertahankan nuansa pengerjaan kain dan tidak menyamakannya begitu saja dengan pakaian kudus yang disebut sesudahnya.
- source_word: לְשָׁרֵת
  choice: untuk melayani
  rationale: שׁרת menyatakan pelayanan resmi, khususnya pelayanan ibadah. 'Melayani' jelas dan wajar, sementara konteks tempat kudus memberi nuansa sakralnya.
- source_word: בַּקֹּדֶשׁ
  choice: di tempat kudus
  rationale: קֹדֶשׁ di sini menunjuk pada kawasan sakral tempat pelayanan Kemah Suci berlangsung. 'Tempat kudus' mempertahankan cakupan istilah Ibraninya tanpa mempersempitnya secara tidak perlu.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: pakaian kudus
  rationale: Terjemahan langsung dan wajar bagi sebutan baku untuk pakaian keimaman yang dikhususkan bagi pelayanan suci.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: bagi Imam Harun
  rationale: Susunan ini alami dalam bahasa Indonesia. Gelar 'Imam' ditempatkan sebelum nama, sebagaimana lazim untuk jabatan yang melekat pada nama orang.
- source_word: בִּגְדֵי בָנָיו
  choice: pakaian anak-anaknya
  rationale: Mempertahankan hubungan kepunyaan dalam bahasa Indonesia yang ringkas dan jelas; dalam konteks ini anak-anak Harun adalah para putranya yang bertugas sebagai imam.
- source_word: לְכַהֵן
  choice: untuk menjalankan tugas sebagai imam
  rationale: Kata kerja denominatif dari כֹּהֵן berarti bertindak atau bertugas sebagai imam. Pilihan ini menyatakan fungsi jabatan dengan jelas dan alami.
theological_decisions:
- issue: Hubungan antara בִּגְדֵי הַשְּׂרָד dan בִּגְדֵי הַקֹּדֶשׁ
  choice: 'Mempertahankan kedua ungkapan sebagai sebutan yang berbeda: pakaian hasil tenunan untuk pelayanan di tempat kudus, lalu pakaian kudus bagi Harun dan anak-anaknya.'
  alternative: Memahami keduanya sebagai sebutan yang hampir bersinonim dan menerjemahkan yang pertama sebagai 'pakaian pelayanan'.
  rationale: Pengulangan bahasa Ibrani sebaiknya dipertahankan tanpa memastikan secara berlebihan apakah kedua kelompok tersebut sepenuhnya terpisah. Catatan kaki menyajikan alternatif leksikal yang sah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur daftar Ibrani dipertahankan, sedangkan ungkapan jabatan dibuat alami bagi pembaca umum.
