  text: the table[a], all its utensils, and the bread of the Presence—
translation:
  language: id
  text: meja, semua perlengkapannya, dan roti Hadirat[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara tradisional, “roti sajian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: meja itu
  rationale: שֻׁלְחָן berarti meja. Bentuk definitnya diterjemahkan dengan 'itu', sedangkan konteks sudah menunjukkan bahwa ini salah satu perlengkapan Kemah Suci.
- source_word: כָּל כֵּלָיו
  choice: semua perlengkapannya
  rationale: כְּלִי dapat berarti perkakas, wadah, atau barang perlengkapan. 'Perlengkapan' cukup luas dan alami untuk seluruh benda yang digunakan bersama meja tersebut.
- source_word: לֶחֶם הַפָּנִים
  choice: roti Sajian
  rationale: Ungkapan harfiahnya adalah 'roti wajah/hadirat'. Dalam konteks ibadah, roti itu disajikan tetap di hadapan TUHAN; 'roti Sajian' merupakan istilah Indonesia yang ringkas dan mudah dipahami, sementara nuansa harfiahnya dijelaskan dalam catatan kaki.
- source_word: אֶת ... אֶת ... וְאֵת
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel-partikel ini menandai dan mengoordinasikan objek langsung dalam daftar. Fungsinya disampaikan secara alami melalui susunan daftar dan kata 'dan'.
theological_decisions:
- issue: Makna לֶחֶם הַפָּנִים
  choice: roti Sajian
  alternative: roti Hadirat
  rationale: Bahasa Ibrani memungkinkan nuansa 'wajah' atau 'hadirat'. Teks utama memakai istilah yang alami dalam bahasa Indonesia tanpa menentukan secara berlebihan bagaimana kehadiran ilahi dipahami; catatan kaki mempertahankan bentuk dan alternatif makna ungkapan Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Frasa ini dipertahankan sebagai bagian dari daftar ayat-ayat sekitarnya, termasuk tanda pisah pada akhir yang menandakan kelanjutan daftar.
