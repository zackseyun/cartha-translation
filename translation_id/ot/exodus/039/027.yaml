  text: They made the tunics of fine linen[a], the work of a weaver, for Aaron and for his sons.
translation:
  language: id
  text: Mereka membuat tunik-tunik dari linen halus, hasil pekerjaan seorang penenun,[a] untuk Harun dan putra-putranya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hasil tenunan.” Secara harfiah, “pekerjaan seorang penenun.” Frasa Ibrani ini menekankan bahwa tunik-tunik tersebut dibuat dengan cara ditenun.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: Mereka membuat
  rationale: Bentuk wayyiqtol Qal dari עשה melanjutkan rangkaian tindakan. Dalam bahasa Indonesia modern, alur naratif sudah cukup jelas tanpa menerjemahkan waw secara kaku dengan “Dan”.
- source_word: הַכָּתְנֹת
  choice: tunik-tunik
  rationale: כָּתְנֹת adalah bentuk jamak dari כֻּתֹּנֶת, yaitu pakaian badan semacam tunik. “Tunik-tunik” lebih tepat daripada istilah umum seperti “pakaian” atau “jubah”.
- source_word: שֵׁשׁ
  choice: linen halus
  rationale: Dalam konteks Kemah Suci dan pakaian imam, שֵׁשׁ menunjuk pada linen berkualitas halus.
- source_word: מַעֲשֵׂה אֹרֵג
  choice: hasil tenunan
  rationale: Frasa ini menekankan cara pengerjaan oleh penenun. “Hasil tenunan” alami dalam bahasa Indonesia dan tetap menyatakan bahwa tunik-tunik itu dibuat dengan cara ditenun.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: untuk Harun dan anak-anaknya
  rationale: Ungkapan ini menyatakan bahwa pakaian tersebut diperuntukkan bagi Harun dan putra-putranya dalam konteks pelayanan imam. “Anak-anaknya” merupakan padanan Indonesia yang alami, sementara konteks sudah memperjelas bahwa yang dimaksud ialah para putranya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Istilah “tunik” dipakai untuk ketepatan jenis pakaian; susunan kalimat menjaga penekanan teks Ibrani pada bahan dan cara pembuatannya.
