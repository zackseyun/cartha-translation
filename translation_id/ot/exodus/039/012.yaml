translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Istilah “batu lesyem” mempertahankan ketidakpastian leksikal sumber, sedangkan “akik” dan “kecubung” memakai nama batu yang dikenal pembaca modern.
