  text: 'and the third row: jacinth[a], agate[b], and amethyst.'
translation:
  language: id
  text: 'dan baris ketiga: batu lesyem[a], akik[b], dan kecubung.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Identitas pasti beberapa batu permata kuno pada tutup dada imam besar tidak diketahui. Batu lesyem mungkin sejenis yakut kuning atau ambar; dalam tradisi lama disebut juga ligur.
    reason: lexical_alternative
  - marker: b
    text: Atau “oniks”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר
  choice: dan baris
  rationale: Dalam daftar batu pada tutup dada, טוּר menunjuk pada susunan batu dalam satu baris; awalan וְ diterjemahkan sebagai “dan” untuk mempertahankan kesinambungan daftar.
- source_word: הַשְּׁלִישִׁי
  choice: ketiga
  rationale: Kata bilangan bertingkat ini secara langsung menyatakan urutan baris.
- source_word: לֶשֶׁם
  choice: batu lesyem
  rationale: Identitas mineral kuno ini tidak pasti. Transliterasi yang diberi penjelasan kaki menghindari kepastian semu dari padanan seperti yakut kuning atau ambar.
- source_word: שְׁבוֹ
  choice: akik
  rationale: “Akik” merupakan padanan tradisional yang mudah dipahami, tetapi identifikasi batu kuno tersebut tidak pasti dan kemungkinan “oniks” dicatat dalam catatan kaki.
- source_word: וְאַחְלָמָה
  choice: dan kecubung
  rationale: אַחְלָמָה lazim diidentifikasi sebagai amethyst; “kecubung” adalah nama Indonesianya yang umum, dan awalan וְ diterjemahkan sebagai “dan”.
