  text: So the people carried their dough before it was leavened[a], with their kneading bowls bound up in their cloaks on their shoulders.
translation:
  language: id
  text: Maka bangsa itu membawa adonan mereka sebelum adonan itu beragi, dengan wadah-wadah untuk mengadon yang dibungkus dalam jubah mereka dan disandang di bahu mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “palung-palung untuk mengadon mereka.” Istilah Ibrani ini menunjuk kepada wadah yang digunakan untuk menyiapkan adonan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא
  choice: membawa
  rationale: Dalam konteks keberangkatan, verba נשׂא menyatakan mengangkat lalu membawa barang; “membawa” paling alami dalam bahasa Indonesia.
- source_word: הָעָם
  choice: bangsa itu
  rationale: עָם menunjuk secara kolektif kepada bangsa Israel yang sedang berangkat. “Bangsa itu” mempertahankan acuan kolektif tersebut.
- source_word: בְּצֵקוֹ
  choice: adonan mereka
  rationale: Akhiran Ibrani berbentuk tunggal karena subjeknya kolektif, tetapi bahasa Indonesia secara wajar memakai “mereka” untuk para anggota bangsa itu.
- source_word: טֶרֶם יֶחְמָץ
  choice: sebelum beragi
  rationale: Ungkapan ini menyatakan bahwa adonan belum mengalami proses pengembangan oleh ragi; “sebelum beragi” ringkas dan sesuai dengan konteks Paskah.
- source_word: מִשְׁאֲרֹתָם
  choice: wadah-wadah pengadon mereka
  rationale: Istilah ini menunjuk kepada wadah yang dipakai untuk mengolah atau mengadon adonan. “Wadah pengadon” jelas bagi pembaca modern tanpa memastikan bentuk wadah yang tidak dinyatakan oleh kata Ibraninya.
- source_word: צְרֻרֹת
  choice: terikat
  rationale: Partisip pasif dari צרר menggambarkan wadah-wadah yang telah diikat atau dibundel agar dapat dibawa.
- source_word: בְּשִׂמְלֹתָם
  choice: dalam jubah mereka
  rationale: שִׂמְלָה biasanya menunjuk kepada pakaian luar atau jubah yang di sini dipakai untuk membungkus dan mengikat barang.
- source_word: עַל שִׁכְמָם
  choice: dipikul di atas bahu
  rationale: Frasa ini menggambarkan bungkusan yang dibawa pada bahu; bentuk pasif “dipikul” menghasilkan ungkapan Indonesia yang alami.
