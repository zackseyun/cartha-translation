base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/043.yaml
  text: 'And Yahweh said to Moses and Aaron[a], “This is the statute of the Passover: no foreigner may eat of it.”'
translation:
  language: id
  text: 'Lalu Yahweh berfirman kepada Musa dan Harun, “Inilah ketetapan tentang Paskah: tidak seorang asing pun boleh memakannya.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “setiap anak keasingan.” Ungkapan Ibrani ini adalah sebutan bagi orang asing atau orang luar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Bentuk naratif וַיֹּאמֶר melanjutkan alur. Dalam bahasa Indonesia, “berfirman” merupakan padanan wajar dan bermartabat ketika Allah menjadi subjek.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: זֹאת חֻקַּת הַפָּסַח
  choice: Inilah ketetapan tentang Paskah
  rationale: “Ketetapan” mempertahankan corak hukum חֻקָּה, sedangkan “tentang Paskah” secara alami menunjukkan bahwa aturan berikut mengatur perayaan atau kurban Paskah tanpa mempersempit acuannya.
- source_word: כָּל בֶּן נֵכָר
  choice: Tidak seorang pun yang berasal dari bangsa asing
  rationale: Bersama verba negatif, כָּל paling alami dinyatakan “tidak seorang pun”. Idiom בֶּן נֵכָר menunjuk kepada orang asing; rumusan ini mempertahankan unsur asal-usul asing tanpa terjemahan harfiah yang janggal.
- source_word: לֹא יֹאכַל בּוֹ
  choice: boleh memakannya
  rationale: Dalam konteks hukum, bentuk negatif menyatakan larangan. Objek “-nya” merujuk secara alami kepada Paskah, khususnya makanan atau kurban Paskah yang disantap.
theological_decisions:
- issue: Identitas orang yang dilarang ikut makan Paskah
  choice: yang berasal dari bangsa asing
  alternative: orang asing di luar komunitas perjanjian; orang asing yang tidak bersunat
  rationale: Ayat ini sendiri hanya memakai idiom בֶּן נֵכָר. Terjemahan tidak menambahkan syarat “tidak bersunat”, yang baru diperjelas oleh konteks berikutnya, dan catatan menjelaskan nuansa sosial-perjanjiannya tanpa mempersempit teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif-hukum yang khidmat tetapi mudah dipahami. “Berfirman” dipakai secara idiomatis untuk perkataan Allah; “ketetapan” mempertahankan nada legal. Penanda catatan [a] ditempatkan sesudah klausa yang dijelaskannya.
