base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/035.yaml
  text: And the sons of Israel did according to the word of Moses[a], and they asked the Egyptians for articles of silver and articles of gold and clothing.
translation:
  language: id
  text: Orang Israel melakukan sesuai dengan perkataan Musa. Mereka meminta kepada orang Mesir benda-benda perak, benda-benda emas, dan pakaian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “meminta” juga dapat diterjemahkan “memohon”. Terjemahan “meminjam” menyiratkan kewajiban untuk mengembalikan, yang tidak dinyatakan oleh kata ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Orang Israel
  rationale: Ungkapan harfiah 'anak-anak Israel' berfungsi sebagai sebutan kolektif bagi bangsa Israel. 'Orang Israel' lebih alami dalam bahasa Indonesia modern tanpa kehilangan rujukan korporatnya.
- source_word: עָשׂוּ כִּדְבַר מֹשֶׁה
  choice: melakukan seperti yang dikatakan Musa
  rationale: Konstruksi ini menyatakan bahwa mereka bertindak sesuai dengan perkataan Musa. Rumusan ini alami dan tetap mempertahankan hubungan langsung dengan perkataan Musa tanpa mempersempit דָּבָר menjadi perintah formal.
- source_word: וַיִּשְׁאֲלוּ
  choice: meminta
  rationale: Kata שׁאל pada dasarnya berarti meminta atau memohon. 'Meminjam' akan memasukkan gagasan kewajiban mengembalikan yang tidak dinyatakan oleh kata Ibrani ini.
- source_word: מִמִּצְרַיִם
  choice: kepada orang Mesir
  rationale: Secara bentuk berarti 'dari Mesir', tetapi dalam konteks nama negeri itu menunjuk kepada penduduknya sebagai pihak yang dimintai barang. Bahasa Indonesia secara alami memakai 'meminta kepada orang Mesir'.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: barang-barang dari perak, barang-barang dari emas
  rationale: כְּלִי mencakup berbagai benda, perkakas, atau wadah. 'Barang-barang' menjaga cakupan luas itu, sedangkan 'dari perak/emas' menyatakan bahannya secara jelas.
- source_word: וּשְׂמָלֹת
  choice: pakaian
  rationale: שִׂמְלָה adalah istilah umum untuk pakaian atau kain sandang; 'pakaian' merupakan padanan modern yang luas dan wajar.
theological_decisions:
- issue: Makna וַיִּשְׁאֲלוּ dalam konteks keluarnya Israel dan pengambilan harta Mesir
  choice: meminta
  alternative: meminjam; merampas
  rationale: '''Meminta'' mempertahankan arti leksikal dasar tanpa menyiratkan bahwa barang itu harus dikembalikan atau bahwa tindakan meminta itu sendiri berarti merampas. Hasil yang dalam konteks selanjutnya digambarkan sebagai menjarah Mesir tidak dipaksakan ke dalam verba ini.'
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Orang Israel' dipilih daripada bentuk harfiah 'anak-anak Israel'; susunan barang dari perak, barang dari emas, dan pakaian mengikuti urutan teks Ibrani. Penanda catatan kaki ditempatkan setelah kalimat yang memuat kata terkait.
