id: EXO.12.46
reference: Exodus 12:46
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בְּ/בַ֤יִת אֶחָד֙ יֵאָכֵ֔ל לֹא תוֹצִ֧יא מִן הַ/בַּ֛יִת מִן הַ/בָּשָׂ֖ר ח֑וּצָ/ה וְ/עֶ֖צֶם לֹ֥א תִשְׁבְּרוּ בֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/046.yaml
  text: It shall be eaten in one house; you shall not take any of the meat outside the house[a], and you shall not break a bone of it.
translation:
  language: id
  text: Hewan itu harus dimakan dalam satu rumah; jangan membawa sedikit pun dari dagingnya ke luar rumah[a], dan jangan mematahkan satu pun tulangnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam satu rumah tangga.” Kata Ibrani yang dipakai dapat merujuk pada bangunan rumah ataupun rumah tangga yang berkumpul di sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבַיִת אֶחָד
  choice: dalam satu rumah
  rationale: בַּיִת dapat berarti bangunan rumah atau rumah tangga. Kontras langsung dengan membawa daging ke luar mendukung arti ruang fisik, sedangkan catatan kaki mempertahankan kemungkinan arti sosialnya.
- source_word: יֵאָכֵל
  choice: harus dimakan
  rationale: Bentuk Nifal imperfek menyatakan ketentuan pasif mengenai hewan Paskah; 'harus dimakan' alami dalam bahasa Indonesia dan mempertahankan daya wajibnya.
- source_word: לֹא תוֹצִיא
  choice: jangan membawa
  rationale: Bentuk Hifil dari יצא berarti menyebabkan keluar atau membawa keluar. Bentuk larangan ini langsung dan wajar dalam bahasa Indonesia.
- source_word: מִן הַבַּיִת ... חוּצָה
  choice: ke luar rumah
  rationale: Gabungan frasa sumber dan adverbia berarah menyatakan perpindahan dari dalam rumah menuju bagian luarnya.
- source_word: מִן הַבָּשָׂר
  choice: sedikit pun dari dagingnya
  rationale: בָּשָׂר dalam konteks makanan berarti 'daging'; מִן bersifat partitif, dan 'sedikit pun' memperjelas bahwa tidak ada bagian daging yang boleh dibawa keluar.
- source_word: וְעֶצֶם לֹא תִשְׁבְּרוּ בוֹ
  choice: dan jangan mematahkan satu pun tulangnya
  rationale: Kata עֶצֶם berbentuk tunggal tetapi berdaya distributif dalam larangan ini. 'Satu pun tulangnya' menyampaikan bahwa tidak ada tulang hewan itu yang boleh dipatahkan.
theological_decisions:
- issue: Acuan pronomina terakhir בוֹ
  choice: hewan Paskah secara keseluruhan, dinyatakan dengan '-nya'
  alternative: anak domba secara khusus
  rationale: Pronomina maskulin tunggal mengacu pada korban Paskah yang sedang dibicarakan. Akhiran '-nya' mempertahankan acuan langsung tanpa memasukkan nomina yang lebih khusus daripada yang terdapat dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang lugas dan bermartabat. 'Hewan itu' ditambahkan secara minimal agar bentuk pasif memiliki subjek yang alami dalam bahasa Indonesia dan agar pronomina pada klausa terakhir jelas, tanpa mempersempitnya menjadi 'anak domba'.
