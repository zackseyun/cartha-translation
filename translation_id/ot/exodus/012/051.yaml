source:
  edition: WLC
  text: וַ/יְהִ֕י בְּ/עֶ֖צֶם הַ/יּ֣וֹם הַ/זֶּ֑ה הוֹצִ֨יא יְהוָ֜ה אֶת בְּנֵ֧י יִשְׂרָאֵ֛ל מֵ/אֶ֥רֶץ מִצְרַ֖יִם עַל צִבְאֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/051.yaml
  text: And on that very day[b][a], Yahweh brought the sons of Israel out from the land of Egypt according to their divisions.
translation:
  language: id
  text: Dan tepat pada hari itu, Yahweh membawa anak-anak Israel[a] keluar dari tanah Mesir menurut kelompok-kelompok mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keturunan Israel” atau “orang Israel.” Secara harfiah, bahasa Ibrani berbunyi “anak-anak lelaki Israel,” tetapi ungkapan kekeluargaan ini dipakai secara korporat untuk umat Israel.
    reason: lexical_alternative
  - marker: b
    text: Atau “menurut rombongan-rombongan mereka” atau “menurut pasukan-pasukan mereka.” Istilah Ibrani dapat menunjuk bala tentara, pasukan, atau kelompok-kelompok yang tersusun; di sini tidak harus berarti satuan tempur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Dan
  rationale: Bentuk naratif ini menghubungkan pernyataan dengan konteks sebelumnya. Dalam bahasa Indonesia modern, fungsi wacananya cukup disampaikan dengan “Dan” tanpa formula arkais “maka terjadilah”.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: tepat pada hari itu
  rationale: Ungkapan ini menegaskan ketepatan waktunya. “Tepat pada hari itu” alami dalam bahasa Indonesia dan mempertahankan daya tekan teks Ibrani.
- source_word: הוֹצִיא
  choice: membawa ... keluar
  rationale: Bentuk Hifil dari יצא bersifat kausatif, yaitu membuat atau membawa seseorang keluar. Pilihan ini alami dan tidak menentukan cara keluarnya secara berlebihan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  rationale: Ungkapan kekeluargaan korporat dalam bahasa Ibrani dipertahankan dengan bentuk Indonesia yang mapan dan mencakup seluruh umat Israel dalam konteks ini.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: keluar dari tanah Mesir
  rationale: Kata אֶרֶץ dipertahankan sebagai “tanah,” sedangkan unsur gerak keluar dinyatakan secara alami bersama verba.
- source_word: עַל צִבְאֹתָם
  choice: menurut pasukan-pasukan mereka
  rationale: צָבָא dapat menunjuk pasukan, bala tentara, atau kelompok yang tersusun. Bentuk jamak ini mempertahankan gambaran Israel yang keluar dalam satuan-satuan teratur tanpa menyatakan bahwa mereka sedang bertempur.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan sebuah gelar.
- issue: Sebutan korporat בְּנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  alternative: orang Israel atau keturunan Israel
  rationale: Pilihan ini mempertahankan metafora kekeluargaan dalam teks sumber. Dalam konteks ini ungkapan tersebut bersifat korporat dan mencakup umat Israel, bukan hanya laki-laki.
- issue: Nuansa צִבְאֹתָם
  choice: pasukan-pasukan mereka
  alternative: rombongan-rombongan mereka atau kelompok-kelompok mereka
  rationale: Istilah sumber memiliki nuansa susunan kolektif yang dapat bersifat militer, tetapi konteks tidak mengharuskan unit tempur. Terjemahan utama mempertahankan ketegangan itu, sedangkan catatan menjelaskan cakupannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat lugas; nama Yahweh dipertahankan, metafora kekeluargaan dijaga, dan kemungkinan nuansa militer pada צִבְאֹתָם tidak dihapus maupun dipaksakan.
