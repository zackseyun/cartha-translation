translation:
  language: id
  text: Janganlah kamu makan apa pun yang beragi[a]; di semua tempat tinggalmu[b] makanlah roti tidak beragi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “segala sesuatu yang beragi.” Istilah Ibrani ini lebih luas daripada roti saja dan mencakup apa pun yang dibuat beragi.
    reason: lexical_alternative
  - marker: b
    text: Atau, “di seluruh permukimanmu.” Frasa ini menunjuk pada semua tempat tinggalmu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מַחְמֶצֶת
  choice: apa pun yang beragi
  rationale: Dalam larangan ini, כָּל memberi cakupan menyeluruh, sedangkan מַחְמֶצֶת menunjuk pada sesuatu yang dibuat beragi, bukan hanya roti. Ungkapan ini alami dalam bahasa Indonesia dan tidak mempersempit cakupan objeknya.
- source_word: לֹא תֹאכֵלוּ
  choice: Janganlah kamu makan
  rationale: Bentuk imperfek dengan לֹא berfungsi sebagai larangan. Pilihan ini mempertahankan nada hukum yang tegas sekaligus wajar dalam bahasa Indonesia modern.
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: di setiap tempat tinggalmu
  rationale: Frasa ini mencakup semua tempat umat itu menetap atau tinggal. Bentuk tunggal kolektif '-mu' sesuai dengan sapaan orang kedua jamak Ibrani ketika ditujukan kepada umat sebagai kelompok.
- source_word: תֹּאכְלוּ
  choice: kamu harus makan
  rationale: Imperfek ini berfungsi sebagai perintah positif yang mengimbangi larangan pada klausa pertama. 'Harus' menyampaikan kewajiban tanpa memakai bentuk yang kaku.
- source_word: מַצּוֹת
  choice: roti tidak beragi
  rationale: Istilah ini menunjuk pada roti yang dibuat tanpa ragi. Terjemahan ini baku, jelas, dan mudah dipahami.
