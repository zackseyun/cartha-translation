  text: כָּל עֲדַ֥ת יִשְׂרָאֵ֖ל יַעֲשׂ֥וּ אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/047.yaml
  text: All the congregation of Israel shall do it[a].
translation:
  language: id
  text: Seluruh umat Israel harus melakukannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Seluruh jemaah Israel harus merayakannya.”'
    reason: Alternatif ini menampilkan arti komunal עֲדַת sebagai “jemaah” dan memahami עשה secara kontekstual sebagai merayakan Paskah.
lexical_decisions:
- source_word: כָּל
  choice: Seluruh
  rationale: Kata pembilang ini menyatakan totalitas; “seluruh” secara alami menerangkan umat Israel sebagai satu kesatuan.
- source_word: עֲדַת
  choice: umat
  rationale: Dalam konteks ini עֵדָה menunjuk kepada komunitas Israel yang berhimpun sebagai umat perjanjian. “Umat” alami dalam bahasa Indonesia dan mempertahankan nuansa komunalnya.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama diri dipertahankan dalam bentuk baku bahasa Indonesia.
- source_word: יַעֲשׂוּ
  choice: harus melakukannya
  rationale: Bentuk verba ini menyatakan pelaksanaan ketetapan dalam konteks Paskah. “Harus” menyampaikan daya wajibnya secara wajar dalam bahasa Indonesia modern, sedangkan “melakukannya” tetap dekat dengan makna luas עשה.
- source_word: אֹתוֹ
  choice: -nya dalam “melakukannya”
  rationale: Pronomina objek maskulin tunggal merujuk kembali kepada perayaan atau ketetapan Paskah dalam konteks dekat. Bentuk “-nya” mempertahankan rujukan pronominal tanpa menentukannya secara berlebihan.
theological_decisions:
- issue: Subjek kolektif dalam perintah Paskah
  choice: “Seluruh umat Israel” menyapa umat perjanjian secara kolektif.
  alternative: Setiap orang Israel secara individual harus melakukannya.
  rationale: Nomina kolektif עֵדָה dengan nama bangsa menunjuk kepada seluruh komunitas sebagai satu tubuh, tanpa harus menyatakan bahwa tekanannya terletak pada setiap individu secara terpisah.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. “Umat” dipilih daripada “jemaat” agar tidak memberi kesan khusus gerejawi, sementara catatan kaki mempertahankan alternatif leksikal dan kontekstual.
