  text: One law shall be for the native and for the sojourner who sojourns among you[a].
translation:
  language: id
  text: Satu hukum berlaku bagi orang Israel asli maupun bagi orang asing yang tinggal di tengah-tengah kamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Satu ketetapan berlaku bagi orang Israel asli maupun bagi orang asing yang menetap di tengah-tengah kamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרָה
  choice: hukum
  rationale: Dalam konteks ketetapan Paskah ini, kata tersebut menunjuk pada aturan yang mengikat; “hukum” paling alami dan tepat dalam bahasa Indonesia.
- source_word: אַחַת
  choice: satu
  rationale: Mempertahankan penekanan Ibrani pada satu standar hukum yang sama bagi kedua kelompok.
- source_word: יִהְיֶה
  choice: berlaku
  rationale: Secara harfiah berarti “akan ada/menjadi,” tetapi dalam pernyataan hukum bahasa Indonesia, “berlaku” menyampaikan fungsi kalimat dengan jelas tanpa menambah makna.
- source_word: אֶזְרָח
  choice: orang Israel asli
  rationale: Menunjuk pada anggota asli komunitas Israel; penambahan “Israel” memperjelas rujukan dalam bahasa Indonesia tanpa memakai kategori politik modern seperti “warga negara.”
- source_word: גֵּר
  choice: pendatang
  rationale: Menunjuk pada orang bukan asli yang menetap di tengah komunitas; “pendatang” mudah dipahami dan tidak memiliki konotasi keras seperti beberapa padanan lain.
- source_word: הַגָּר
  choice: yang tinggal
  rationale: Menyampaikan partisip yang menerangkan bahwa pendatang itu menetap di tengah komunitas, dengan ungkapan Indonesia yang alami.
- source_word: בְּתוֹכְכֶם
  choice: di tengah-tengah kamu
  rationale: Mencerminkan ungkapan Ibrani secara dekat dan tetap jelas dalam bahasa Indonesia modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk legal “satu hukum berlaku bagi” dipilih agar alami sekaligus dekat dengan susunan Ibrani; “kamu” mempertahankan sapaan jamak dalam konteks komunitas.
