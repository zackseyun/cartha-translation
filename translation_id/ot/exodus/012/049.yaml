  verdict: revise
  source_fidelity: Revisi diperlukan terutama pada padanan גֵּר. “Pendatang” dapat merujuk pada orang yang baru datang atau tidak menetap, sedangkan גֵּר, yang ditegaskan lagi oleh partisipel הַגָּר, menunjuk pada orang asing yang tinggal/menetap di dalam komunitas. “Orang Israel asli” dapat dipertahankan untuk אֶזְרָח karena konteksnya adalah komunitas Israel dan ini menghindari konotasi kontemporer yang kurang sesuai dari “orang asli” tanpa penjelas.
  naturalness: Struktur “Satu hukum berlaku bagi ... maupun bagi ...” adalah baku dan alami dalam pernyataan hukum. “Orang asing yang tinggal di tengah-tengah kamu” jelas, modern, dan menyampaikan status menetap yang dimaksud teks.
  terminology: “Hukum” tepat untuk תּוֹרָה dalam konteks peraturan Paskah. “Orang asing yang tinggal” lebih tepat daripada “pendatang” untuk גֵּר ... הַגָּר. Catatan alternatif dengan “ketetapan” tetap layak sebagai kemungkinan leksikal.
  issues:
