  text: וַ/יְהִ֣י בַּ/חֲצִ֣י הַ/לַּ֗יְלָה וַֽ/יהוָה֮ הִכָּ֣ה כָל בְּכוֹר֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ מִ/בְּכֹ֤ר פַּרְעֹה֙ הַ/יֹּשֵׁ֣ב עַל כִּסְא֔/וֹ עַ֚ד בְּכ֣וֹר הַ/שְּׁבִ֔י אֲשֶׁ֖ר בְּ/בֵ֣ית הַ/בּ֑וֹר וְ/כֹ֖ל בְּכ֥וֹר בְּהֵמָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/029.yaml
  text: And at midnight Yahweh struck down every firstborn in the land of Egypt[a], from the firstborn of Pharaoh, who sat on his throne, to the firstborn of the captive who was in the prison pit, and every firstborn of the livestock.
translation:
  language: id
  text: Pada tengah malam, Yahweh menewaskan setiap anak sulung di tanah Mesir, dari anak sulung Firaun yang duduk di takhtanya sampai anak sulung tawanan yang berada di dalam penjara bawah tanah, serta setiap anak sulung ternak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בַּחֲצִי הַלַּיְלָה
  choice: Pada tengah malam
  rationale: Ungkapan naratif וַיְהִי tidak perlu diterjemahkan secara harfiah dalam bahasa Indonesia; keterangan waktu secara alami membuka peristiwa, sedangkan בַּחֲצִי הַלַּיְלָה berarti ‘pada tengah malam’.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks Ibrani dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: הִכָּה
  choice: menewaskan
  rationale: Dalam konteks tulah ini, tindakan memukul mengakibatkan kematian. ‘Menewaskan’ menyampaikan hasil mematikan itu secara jelas dan tetap mempertahankan nuansa tindakan penghukuman.
- source_word: כָל בְּכוֹר
  choice: setiap anak sulung
  rationale: כָל bersifat distributif dan בְּכוֹר menunjuk kepada keturunan yang lahir pertama; frasa ini alami dan tepat dalam bahasa Indonesia.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: di tanah Mesir
  rationale: Terjemahan ini mempertahankan ungkapan geografis formal ‘tanah Mesir’.
- source_word: מִבְּכֹר פַּרְעֹה ... עַד בְּכוֹר הַשְּׁבִי
  choice: dari anak sulung Firaun ... sampai anak sulung tawanan
  rationale: Struktur ‘dari ... sampai ...’ mempertahankan rentang sosial yang dinyatakan oleh מִן ... עַד.
- source_word: הַיֹּשֵׁב עַל כִּסְאוֹ
  choice: yang duduk di takhtanya
  rationale: Partisipel tersebut menggambarkan kedudukan kerajaan Firaun; bentuk ini alami dan tidak menambahkan penafsiran.
- source_word: אֲשֶׁר בְּבֵית הַבּוֹר
  choice: yang berada di dalam penjara bawah tanah
  rationale: בּוֹר secara harfiah berarti lubang atau liang dan dalam konteks penahanan menunjuk tempat kurungan seperti ruang tahanan bawah tanah; pilihan ini mempertahankan citra konkretnya tanpa ungkapan Indonesia yang janggal.
- source_word: וְכֹל בְּכוֹר בְּהֵמָה
  choice: serta setiap anak sulung ternak
  rationale: בְּהֵמָה di sini mencakup hewan peliharaan atau ternak secara luas, bukan hanya sapi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks sumber memakai Tetragramaton sebagai nama diri. Bentuk ‘Yahweh’ mempertahankan nama itu dan menghindari penggantiannya dengan sebuah gelar.
- issue: Kekuatan makna הִכָּה dalam konteks tulah anak sulung
  choice: menewaskan
  alternative: memukul atau membunuh
  rationale: Konteks memastikan akibatnya adalah kematian. ‘Menewaskan’ mengungkapkan akibat tersebut dengan wajar tanpa mereduksi tindakan itu menjadi kata umum ‘membunuh’.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan khidmat. Struktur rentang dari keluarga kerajaan hingga tawanan dipertahankan. Tidak diperlukan catatan kaki karena ‘tawanan’ dan ‘penjara bawah tanah’ dapat memuat unsur leksikal utama teks sumber secara jelas.
