- from: Lalu Musa memanggil semua tua-tua Israel dan berkata kepada mereka, “Tariklah dan ambillah bagi kalian ternak dari kawanan menurut kaum keluarga kalian, lalu sembelihlah kurban Paskah[a].”
  to: Lalu Musa memanggil semua tua-tua Israel dan berkata kepada mereka, “Tariklah keluar dan ambillah untuk kalian ternak kecil menurut kaum keluarga kalian, lalu sembelihlah kurban Paskah[a].”
  rationale: Revisi mengganti padanan yang berpotensi terlalu luas bagi צֹאן dengan "ternak kecil," sehingga domba maupun kambing tetap tercakup tanpa memasukkan ternak besar. "Tariklah keluar" mempertahankan gaya konkret dan dua-perintah dari bahasa Ibrani, sambil catatan kaki mengakui bahwa arti kontekstualnya dapat berupa memilih atau memisahkan hewan dari kawanan. Catatan kaki a tetap ditempatkan pada "kurban Paskah"; catatan b disediakan untuk alternatif leksikal מִשְׁכוּ, meskipun jangkar b belum dipasang dalam teks karena pembacaannya bersifat penjelasan tambahan, bukan diperlukan untuk pemahaman utama.
