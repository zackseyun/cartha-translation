  text: וַ/יִּקְרָ֥א מֹשֶׁ֛ה לְ/כָל זִקְנֵ֥י יִשְׂרָאֵ֖ל וַ/יֹּ֣אמֶר אֲלֵ/הֶ֑ם מִֽשְׁכ֗וּ וּ/קְח֨וּ לָ/כֶ֥ם צֹ֛אן לְ/מִשְׁפְּחֹתֵי/כֶ֖ם וְ/שַׁחֲט֥וּ הַ/פָּֽסַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/021.yaml
  text: Then Moses called for all the elders of Israel and said to them[a], “Draw out and take for yourselves sheep according to your families[c][b], and slaughter the Passover lamb.”
translation:
  language: id
  text: Lalu Musa memanggil semua tua-tua Israel dan berkata kepada mereka, “Tariklah keluar dan ambillah untuk kalian ternak kecil menurut kaum keluarga kalian, lalu sembelihlah kurban Paskah[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Paskah”; maksudnya ialah hewan atau kurban Paskah yang harus disembelih.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: memanggil
  rationale: Dalam konteks ini verba קרא menyatakan bahwa Musa memanggil para tua-tua untuk menyampaikan perintah; ‘memanggil’ alami dan tetap dekat dengan bentuk Ibrani.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: tua-tua Israel
  rationale: Ungkapan baku untuk para pemimpin atau wakil yang diakui di tengah Israel.
- source_word: מִשְׁכוּ
  choice: Tariklah
  rationale: Mempertahankan arti konkret משך, yakni menarik atau mengeluarkan; dalam konteks ini dapat berarti menarik keluar atau memilih seekor ternak dari kawanan.
- source_word: וּקְחוּ
  choice: ambillah
  rationale: Menerjemahkan imperatif kedua secara tersendiri sehingga pasangan perintah dalam bahasa Ibrani tidak dilebur.
- source_word: לָכֶם
  choice: bagi kalian
  rationale: Menyampaikan fungsi datif bahwa mereka mengambil hewan itu untuk keperluan kelompok mereka sendiri.
- source_word: צֹאן
  choice: ternak dari kawanan
  rationale: צֹאן menunjuk secara kolektif pada ternak kecil, termasuk domba dan kambing; pilihan ini tidak mempersempitnya menjadi anak domba saja, sejalan dengan Keluaran 12:5.
- source_word: לְמִשְׁפְּחֹתֵיכֶם
  choice: menurut kaum keluarga kalian
  rationale: מִשְׁפָּחָה dapat menunjuk keluarga besar atau kaum; ungkapan ini mempertahankan pengaturan berdasarkan kelompok kekerabatan.
- source_word: וְשַׁחֲטוּ
  choice: sembelihlah
  rationale: Padanan Indonesia yang tepat bagi tindakan menyembelih hewan, termasuk dalam konteks kurban.
- source_word: הַפָּסַח
  choice: kurban Paskah
  rationale: Secara harfiah berbunyi ‘Paskah’, tetapi di sini secara metonimis menunjuk hewan kurban Paskah. ‘Kurban Paskah’ menjelaskan referennya tanpa membatasinya menjadi anak domba.
theological_decisions:
- issue: Referen הַפָּסַח
  choice: kurban Paskah
  alternative: Paskah; anak domba Paskah
  rationale: Konteks menunjukkan bahwa istilah itu menunjuk hewan yang disembelih. ‘Kurban Paskah’ mempertahankan metonimi dengan cukup jelas dan menghindari penyempitan menjadi anak domba, sebab Keluaran 12:5 juga mengizinkan kambing.
- issue: Cakupan צֹאן
  choice: ternak dari kawanan
  alternative: domba; ternak kecil
  rationale: Kata Ibrani mencakup domba maupun kambing. Terjemahan utama menjaga keluasan ini dan tidak menyelesaikan ambiguitas leksikal secara sempit.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk jamak ‘kalian’ dipakai karena perintah ditujukan kepada semua tua-tua Israel. ‘Kaum keluarga’ dipilih untuk mencakup keluarga besar atau kelompok kekerabatan, sedangkan ‘kurban Paskah’ menghindari pembatasan yang tidak terdapat dalam הַפָּסַח.
