  source_fidelity: Revisi diperlukan terutama untuk צֹאן. Terjemahan "ternak dari kawanan" berusaha menjaga cakupan domba dan kambing, tetapi "ternak" dalam penggunaan Indonesia modern dapat mencakup sapi dan ternak besar. "Ternak kecil" lebih dekat dengan cakupan צֹאן. Dua imperatif מִשְׁכוּ וּקְחוּ tetap diterjemahkan terpisah; penambahan "keluar" memperjelas daya konkret dari מִשְׁכוּ tanpa mengubah maksudnya.
  naturalness: '"Tariklah keluar dan ambillah untuk kalian" lebih lancar dan jelas daripada "Tariklah dan ambillah bagi kalian." "Kaum keluarga kalian" tetap sesuai untuk מִשְׁפְּחֹתֵיכֶם dalam ragam Indonesia modern yang bermartabat.'
  terminology: '"Tua-tua Israel," "Paskah," dan "kurban Paskah" dapat dipertahankan. "Kurban Paskah" secara wajar menjelaskan penggunaan metonimis הַפָּסַח sebagai hewan/korban yang disembelih, sementara catatan kaki mempertahankan bentuk harfiahnya dan tidak menyempitkannya menjadi anak domba.'
