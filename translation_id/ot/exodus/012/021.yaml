    rationale: Kata "ternak" tanpa pembatas yang tepat dapat mencakup ternak besar; צֹאן secara khusus menunjuk ternak kecil, khususnya domba dan kambing. Frasa "dari kawanan" tidak sejelas "ternak kecil" dalam membatasi cakupan tersebut.
  - severity: low
