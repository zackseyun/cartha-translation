  yaml_path: translation/ot/exodus/012/007.yaml
  text: And they shall take some of the blood and put it on the two doorposts and on the lintel of the houses in which they eat it[a].
translation:
  language: id
  text: Mereka harus mengambil sebagian dari darah itu dan membubuhkannya pada kedua tiang pintu dan pada ambang atas pintu rumah-rumah tempat mereka memakannya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tempat mereka akan memakannya.” Bentuk imperfek Ibrani dapat mengandung nuansa masa depan dalam konteks petunjuk ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: Mereka harus mengambil
  rationale: Bentuk perfek dengan waw dalam rangkaian petunjuk ini menyampaikan daya instruktif. 'Harus mengambil' terdengar wajar dalam bahasa Indonesia dan mempertahankan nada perintah.
- source_word: מִן הַדָּם
  choice: sedikit dari darah itu
  rationale: 'Preposisi מִן bersifat partitif: yang diambil ialah sebagian darah, bukan seluruhnya. ''Sedikit dari'' menyatakan hal itu secara alami.'
- source_word: וְנָתְנוּ
  choice: dan membubuhkannya
  rationale: נתן memiliki arti luas 'memberi/menaruh'. Dalam konteks mengoleskan atau menempatkan darah pada bagian pintu, 'membubuhkan' konkret dan alami tanpa menentukan cara penerapannya.
- source_word: עַל שְׁתֵּי הַמְּזוּזֹת
  choice: pada kedua tiang pintu
  rationale: מְזוּזוֹת menunjuk pada dua bagian tegak di sisi-sisi pintu; 'kedua tiang pintu' merupakan padanan Indonesia yang tepat dan mudah dipahami.
- source_word: וְעַל הַמַּשְׁקוֹף
  choice: dan ambang atas
  rationale: מַשְׁקוֹף menunjuk pada bagian melintang di atas pintu. 'Ambang atas' lebih mudah dipahami pembaca umum daripada istilah teknis seperti 'balok ambang'.
- source_word: עַל הַבָּתִּים
  choice: rumah-rumah
  rationale: Frasa ini mengidentifikasi rumah-rumah yang bagian pintunya diberi darah. Hubungan tersebut disampaikan secara alami melalui rangkaian 'tiang pintu dan ambang atas rumah-rumah'.
- source_word: אֲשֶׁר יֹאכְלוּ אֹתוֹ בָהֶם
  choice: tempat mereka memakannya
  rationale: Klausa relatif ini menerangkan rumah-rumah sebagai lokasi mereka memakan hewan itu. Bentuk imperfek Ibrani dapat bernuansa kini-prosedural atau masa depan dalam konteks instruksi; teks utama memakai ungkapan Indonesia yang ringkas, sedangkan alternatif futur dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada instruktif yang bermartabat. 'Ambang atas' dipilih agar istilah arsitektural dapat dipahami pembaca umum; pronomina '-nya' pada 'membubuhkannya' merujuk kepada darah, sedangkan pada 'memakannya' merujuk kepada hewan Paskah dari konteks sebelumnya.
