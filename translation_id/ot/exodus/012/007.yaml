  - severity: low
    issue: “Ambang atas” dapat dibuat lebih eksplisit.
    rationale: Kata “pintu” memperjelas bahwa yang dimaksud ialah balok horizontal di atas bukaan pintu, bukan ambang bagian lain dari rumah.
