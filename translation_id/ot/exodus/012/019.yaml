review_pass:
  verdict: revise
  source_fidelity: 'Drafsetia pada struktur dan leksikon utama ayat: durasi tujuh hari, larangan adanya ragi di rumah-rumah, cakupan makanan beragi, serta kontras antara ger dan penduduk asli terpelihara. Namun, “harus dilenyapkan” lebih menentukan dan dalam bahasa Indonesia terutama menyiratkan pembinasaan/kematian, padahal makna tepat idiom Ibrani כרת di sini diperdebatkan. Terjemahan perlu mempertahankan idiom tersebut tanpa menetapkan pelaksanaannya.'
  naturalness: Bahasanya baku dan mengalir. “Tidak boleh ada ragi” dan “sesuatu yang beragi” alami dalam konteks hukum ritual. “Dilenyapkan dari umat Israel” kurang idiomatis karena “dilenyapkan” lazimnya bermakna dimusnahkan, bukan terutama dipisahkan dari sebuah komunitas.
  terminology: “Ragi,” “rumah-rumahmu,” “umat Israel,” “pendatang,” dan “penduduk asli negeri itu” dapat diterima dalam bahasa Indonesia modern. Untuk כרת, “diputuskan dari umat Israel” mempertahankan idiom sanksi perjanjian dan ambiguitasnya dengan lebih baik daripada “dilenyapkan.”
  issues:
  - severity: medium
    issue: “Orang itu harus dilenyapkan dari umat Israel” terlalu menafsirkan וְנִכְרְתָה.
    rationale: Kata “dilenyapkan” dalam pemakaian Indonesia cenderung menyatakan pemusnahan atau kematian. Frasa Ibrani “dipotong/diputuskan dari” menyatakan sanksi perjanjian yang bentuk pelaksanaannya tidak ditentukan secara pasti oleh ayat ini. Padanan idiomatis “harus diputuskan dari” menjaga ketegangan sumber.
  - severity: low
    issue: Catatan kaki a menyebut “Secara harfiah, ‘jiwa itu harus dilenyapkan.’”
    rationale: Catatan ini mengulangi penafsiran “dilenyapkan” dan tidak mencerminkan secara tepat unsur preposisional מֵעֲדַת יִשְׂרָאֵל, “dari umat Israel.” Catatan sebaiknya menjelaskan idiom Ibrani tanpa menyatakan “secara harfiah” secara tidak lengkap.
  revised_text: Selama tujuh hari tidak boleh ada ragi di rumah-rumahmu, sebab siapa pun yang makan sesuatu yang beragi, orang itu harus diputuskan dari umat Israel[a], baik ia pendatang[b] maupun penduduk asli negeri itu.
