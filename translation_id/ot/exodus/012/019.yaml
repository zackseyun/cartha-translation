- from: Selama tujuh hari tidak boleh ada ragi di rumah-rumahmu, sebab siapa pun yang makan sesuatu yang beragi, orang itu harus dilenyapkan dari umat Israel[a], baik ia pendatang[b] maupun penduduk asli negeri itu.
  to: Selama tujuh hari tidak boleh ada ragi di rumah-rumahmu, sebab siapa pun yang makan sesuatu yang beragi, orang itu harus diputuskan dari umat Israel[a], baik ia pendatang[b] maupun penduduk asli negeri itu.
  rationale: Revisi tunggal pada sanksi “harus diputuskan dari” menggantikan “harus dilenyapkan” agar idiom כרת dan ketidakpastian mengenai bentuk hukumannya tetap terpelihara. Catatan kaki a diselaraskan dengan teks revisi dan menjelaskan ambiguitas idiom itu tanpa menganggapnya sebagai kematian atau pengucilan secara pasti.
