  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שִׁבְעַ֣ת יָמִ֔ים שְׂאֹ֕ר לֹ֥א יִמָּצֵ֖א בְּ/בָתֵּי/כֶ֑ם כִּ֣י כָּל אֹכֵ֣ל מַחְמֶ֗צֶת וְ/נִכְרְתָ֞ה הַ/נֶּ֤פֶשׁ הַ/הִוא֙ מֵ/עֲדַ֣ת יִשְׂרָאֵ֔ל בַּ/גֵּ֖ר וּ/בְ/אֶזְרַ֥ח הָ/אָֽרֶץ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/019.yaml
  text: For seven days no leaven is to be found in your houses[a], for whoever eats anything leavened, that person shall be cut off from the congregation of Israel[c][b], whether a sojourner or a native of the land.
translation:
  language: id
  text: Selama tujuh hari tidak boleh ada ragi di rumah-rumahmu, sebab siapa pun yang makan sesuatu yang beragi, orang itu harus diputuskan dari umat Israel[a], baik ia pendatang[b] maupun penduduk asli negeri itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani “harus diputuskan dari umat Israel” dapat menunjuk pada pengucilan, kematian, atau penghukuman ilahi, bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang asing yang menetap.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Selama tujuh hari
  rationale: Frasa ini menyatakan jangka waktu; bentuk ini alami dalam bahasa Indonesia dan mempertahankan durasinya.
- source_word: שְׂאֹר
  choice: ragi
  rationale: Menunjuk pada bahan pengembang, bukan makanan beragi secara umum. 'Ragi' merupakan padanan Indonesia yang jelas dalam konteks ini.
- source_word: לֹא יִמָּצֵא
  choice: tidak boleh ada
  rationale: Bentuk pasif Ibrani menyatakan larangan atas keberadaan ragi. Ungkapan ini alami dan menyampaikan bahwa ragi tidak boleh didapati atau hadir.
- source_word: בְּבָתֵּיכֶם
  choice: di rumah-rumahmu
  rationale: Mempertahankan bentuk jamak dan rujukan pada tempat tinggal atau rumah tangga umat Israel.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi larangan sebelumnya.
- source_word: כָּל אֹכֵל
  choice: siapa pun yang makan
  rationale: Konstruksi partisip dengan כָּל bersifat umum dan mencakup setiap orang.
- source_word: מַחְמֶצֶת
  choice: sesuatu yang beragi
  rationale: Maknanya lebih luas daripada roti saja dan mencakup apa pun yang telah diberi ragi.
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: orang itu harus dilenyapkan
  rationale: נֶפֶשׁ di sini menunjuk pada pribadi. 'Dilenyapkan' mempertahankan kerasnya sanksi perjanjian tanpa menentukan apakah pelaksanaannya berupa kematian, pengucilan, atau penghukuman ilahi.
- source_word: מֵעֲדַת יִשְׂרָאֵל
  choice: dari umat Israel
  rationale: עֵדָה menunjuk pada himpunan atau komunitas Israel. 'Umat Israel' alami dalam bahasa Indonesia dan tetap memuat pengertian komunal.
- source_word: בַּגֵּר
  choice: pendatang
  rationale: גֵּר adalah orang bukan pribumi yang menetap di tengah Israel; 'pendatang' jelas dan tidak membawa kategori kewarganegaraan modern.
- source_word: וּבְאֶזְרַח הָאָרֶץ
  choice: penduduk asli negeri itu
  rationale: Mempertahankan kontras sosial dengan גֵּר tanpa memasukkan konsep kewarganegaraan modern.
theological_decisions:
- issue: Makna sanksi perjanjian וְנִכְרְתָה
  choice: orang itu harus dilenyapkan dari umat Israel
  alternative: orang itu harus dihukum mati; orang itu harus dikeluarkan dari umat Israel
  rationale: Ungkapan Ibrani menyatakan sanksi perjanjian, tetapi konteks tidak memastikan apakah yang dimaksud adalah kematian, pengucilan, atau tindakan penghukuman ilahi. Terjemahan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan hukum dipertahankan, tetapi ungkapan dibuat alami bagi pembaca umum. Istilah denominatif dihindari; ambiguitas sanksi perjanjian dipertahankan dalam teks dan dijelaskan dalam catatan kaki.
