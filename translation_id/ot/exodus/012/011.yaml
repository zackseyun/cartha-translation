  text: וְ/כָכָה֮ תֹּאכְל֣וּ אֹת/וֹ֒ מָתְנֵי/כֶ֣ם חֲגֻרִ֔ים נַֽעֲלֵי/כֶם֙ בְּ/רַגְלֵי/כֶ֔ם וּ/מַקֶּלְ/כֶ֖ם בְּ/יֶדְ/כֶ֑ם וַ/אֲכַלְתֶּ֤ם אֹת/וֹ֙ בְּ/חִפָּז֔וֹן פֶּ֥סַח ה֖וּא לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/011.yaml
  text: 'And this is how you shall eat it: with your waist belted[a], your sandals on your feet, and your staff in your hand. You shall eat it in haste[b]; it is the Passover of Yahweh.'
translation:
  language: id
  text: 'Beginilah kamu harus memakannya: dengan pakaianmu tersingsing pada pinggang[a], sandalmu di kakimu, dan tongkatmu di tanganmu. Kamu harus memakannya dengan tergesa-gesa; itulah Paskah bagi Yahweh.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani memakai ungkapan “pinggangmu diikat,” yang berarti pakaian disingsingkan dan diikat pada pinggang agar siap segera berangkat.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “itulah Paskah milik Yahweh” atau “itulah Paskah untuk Yahweh.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְכָכָה
  choice: Beginilah
  rationale: Ungkapan ini secara alami memperkenalkan cara atau keadaan yang diperintahkan untuk menyantap makanan tersebut.
- source_word: תֹּאכְלוּ
  choice: kamu harus memakannya
  rationale: Bentuk imperfek orang kedua jamak dalam konteks instruksi menyatakan kewajiban; 'harus' menyampaikan daya perintah dengan jelas dalam bahasa Indonesia modern.
- source_word: מָתְנֵיכֶם חֲגֻרִים
  choice: pinggangmu berikat
  rationale: Terjemahan ini mempertahankan gambaran konkret tentang pakaian yang diikat pada pinggang sebagai tanda kesiapan, tanpa memakai ungkapan yang terlalu arkais.
- source_word: נַעֲלֵיכֶם בְּרַגְלֵיכֶם
  choice: sandalmu terpasang di kakimu
  rationale: נַעַל menunjuk pada alas kaki, khususnya sandal dalam konteks dunia kuno; 'terpasang' menegaskan bahwa mereka siap berangkat.
- source_word: וּמַקֶּלְכֶם בְּיֶדְכֶם
  choice: dan tongkatmu di tanganmu
  rationale: מַקֵּל berarti tongkat atau staf; 'tongkat' alami dalam bahasa Indonesia dan sesuai dengan konteks perjalanan.
- source_word: בְּחִפָּזוֹן
  choice: dengan tergesa-gesa
  rationale: Ungkapan ini menyampaikan ketergesaan dan kesiapan untuk segera berangkat.
- source_word: פֶּסַח
  choice: Pesakh
  rationale: Transliterasi istilah Ibrani mempertahankan nama perayaan/ritus yang muncul dalam teks dan lazim dipakai dalam konteks Alkitab bahasa Indonesia.
- source_word: הוּא לַיהוָה
  choice: itulah Pesakh bagi Yahweh
  rationale: Preposisi לְ dipertahankan sebagai 'bagi', sehingga relasi peruntukan atau orientasi kepada Yahweh tidak dipersempit menjadi kepemilikan saja.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memuat Tetragramaton secara langsung; 'Yahweh' mempertahankan nama tersebut, sedangkan 'TUHAN' merupakan penggantian tradisional dengan gelar.
- issue: Relasi dalam frasa פֶּסַח הוּא לַיהוָה
  choice: itulah Pesakh bagi Yahweh
  alternative: itulah Pesakh milik Yahweh
  rationale: לַיהוָה dapat menyatakan peruntukan, orientasi, atau kepunyaan. 'Bagi Yahweh' menjaga keluasan relasi itu dan menghindari penyempitan tanpa dasar.
- issue: Makna ungkapan מָתְנֵיכֶם חֲגֻרִים
  choice: pinggangmu berikat
  alternative: dengan pakaian siap untuk berangkat
  rationale: Pilihan utama mempertahankan metafora tubuh dan pakaian dalam teks, sementara catatan kaki menerangkan makna pragmatisnya sebagai kesiapan untuk segera berangkat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk orang kedua tunggal kolektif 'kamu' mewakili akhiran jamak Ibrani secara alami dalam bahasa Indonesia. Susunan kalimat mempertahankan rangkaian konkret kesiapan perjalanan dan ketergesaan dalam teks sumber.
