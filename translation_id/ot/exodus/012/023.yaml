    issue: Verba “melintas” tidak menyatakan dengan jelas bahwa Yahweh bergerak melalui Mesir.
    rationale: וְעָבַר dalam konteks ini berarti melewati atau melintasi negeri Mesir untuk memukulnya. “Melintasi Mesir” menyampaikan arah dan cakupan tindakan itu dengan lebih tepat.
  - severity: low
    issue: Frasa “pelaksana penghakiman yang bersifat malaikat” dalam catatan kaki b kurang alami.
    rationale: Ibrani tidak mengidentifikasi pembinasa itu sebagai malaikat; catatan perlu menyatakan bahwa ini hanya salah satu pemahaman, dengan ungkapan Indonesia yang lebih wajar.
