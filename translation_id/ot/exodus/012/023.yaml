  verdict: revise
  source_fidelity: Makna pokoknya setia pada Ibrani. Namun, וְעָבַר lebih jelas diterjemahkan “melintasi Mesir” daripada “melintas”, karena tindakan Yahweh berlangsung melalui negeri Mesir. Pembedaan antara Yahweh dan “si pembinasa” serta ketidakjelasan identitas pembinasa dipertahankan dengan baik.
  naturalness: Bahasa umumnya baku dan jelas. “Melintasi Mesir untuk menghantamnya” lebih idiomatis dan eksplisit daripada “melintas untuk menghantam Mesir.” Catatan kaki b perlu dirumuskan lebih alami dalam bahasa Indonesia.
  terminology: “Yahweh,” “ambang atas,” “kedua tiang pintu,” dan “si pembinasa” sesuai dengan sumber dan register. “Melewati pintu itu” secara sengaja membedakannya dari “melintasi Mesir” dan mempertahankan keterkaitan leksikal dengan Paskah tanpa menetapkan nuansa “melindungi” sebagai makna tunggal.
  issues:
