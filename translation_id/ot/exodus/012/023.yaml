  text: וְ/עָבַ֣ר יְהוָה֮ לִ/נְגֹּ֣ף אֶת מִצְרַיִם֒ וְ/רָאָ֤ה אֶת הַ/דָּם֙ עַל הַ/מַּשְׁק֔וֹף וְ/עַ֖ל שְׁתֵּ֣י הַ/מְּזוּזֹ֑ת וּ/פָסַ֤ח יְהוָה֙ עַל הַ/פֶּ֔תַח וְ/לֹ֤א יִתֵּן֙ הַ/מַּשְׁחִ֔ית לָ/בֹ֥א אֶל בָּתֵּי/כֶ֖ם לִ/נְגֹּֽף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/023.yaml
  text: For Yahweh will pass through to strike Egypt[a], and when he sees the blood on the lintel and on the two doorposts[b], Yahweh will pass over the doorway and will not allow the destroyer to enter your houses to strike.
translation:
  language: id
  text: Sebab Yahweh akan melintasi Mesir untuk menghantamnya. Ketika Ia melihat darah pada ambang atas dan pada kedua tiang pintu, Yahweh akan melewati pintu itu[a] dan tidak akan membiarkan si pembinasa[b] masuk ke rumah-rumah kalian untuk menghantam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan meluputkan” atau “akan melindungi”; verba Ibrani ini berkaitan dengan nama perayaan Paskah.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani tidak menjelaskan identitas “si pembinasa”; sebagian memahaminya sebagai malaikat yang melaksanakan penghakiman.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar.
- source_word: וְעָבַר
  choice: akan melintas
  rationale: עבר menggambarkan gerakan melintasi atau melalui wilayah Mesir; pilihan ini juga membedakannya dari פסח dalam klausa berikutnya.
- source_word: לִנְגֹּף
  choice: untuk menghantam
  rationale: נגף di sini menunjuk pada tindakan penghakiman yang mematikan. 'Menghantam' jelas, kuat, dan tidak arkais.
- source_word: מִצְרַיִם
  choice: Mesir
  rationale: Nama tempat yang baku; dalam konteks ini menjadi sasaran penghukuman.
- source_word: וְרָאָה
  choice: Ketika Ia melihat
  rationale: Bentuk ini meneruskan rangkaian tindakan yang akan terjadi dan secara wajar mengandung hubungan waktu.
- source_word: הַדָּם
  choice: darah
  rationale: Mengacu pada darah yang sebelumnya diperintahkan untuk dibubuhkan pada rumah; kejelasannya terpelihara secara alami tanpa artikel dalam bahasa Indonesia.
- source_word: הַמַּשְׁקוֹף
  choice: ambang atas
  rationale: Menunjuk pada bagian mendatar di sebelah atas rangka pintu; istilah ini lebih mudah dipahami pembaca umum daripada istilah teknis 'lintel'.
- source_word: שְׁתֵּי הַמְּזוּזֹת
  choice: kedua tiang pintu
  rationale: Menunjuk pada dua bagian tegak rangka pintu dan diterjemahkan secara tepat serta alami.
- source_word: וּפָסַח
  choice: akan melewati
  rationale: Mempertahankan gambaran dasar verba פסח dan kaitannya dengan peristiwa Paskah, tanpa menutup kemungkinan nuansa 'meluputkan' atau 'melindungi'.
- source_word: עַל הַפֶּתַח
  choice: pintu itu
  rationale: פתח menunjuk pada bukaan atau jalan masuk rumah. 'Pintu itu' alami dalam bahasa Indonesia dan tetap merujuk pada tempat yang telah ditandai darah.
- source_word: וְלֹא יִתֵּן
  choice: tidak akan membiarkan
  rationale: נתן dengan infinitif di sini merupakan ungkapan idiomatis yang berarti mengizinkan atau membiarkan.
- source_word: הַמַּשְׁחִית
  choice: si pembinasa
  rationale: Menerjemahkan agen pembinasaan secara definit tanpa menambahkan identitas sebagai malaikat, yang tidak dinyatakan oleh teks Ibrani.
theological_decisions:
- issue: Hubungan antara Yahweh dan 'si pembinasa'
  choice: Yahweh dan si pembinasa disebut secara berbeda; Yahweh bertindak dalam penghakiman sekaligus mencegah si pembinasa memasuki rumah-rumah umat-Nya.
  alternative: Menganggap 'si pembinasa' sebagai sebutan lain bagi Yahweh sendiri, atau menyebutnya secara eksplisit sebagai malaikat pembinasa.
  rationale: Teks Ibrani membedakan יְהוָה dari הַמַּשְׁחִית, tetapi tidak menjelaskan identitas pembinasa itu. Terjemahan mempertahankan pembedaan dan ketidakjelasan tersebut.
- issue: Makna פסח dalam ayat ini
  choice: Menerjemahkannya sebagai 'melewati' dalam teks utama sambil mencatat kemungkinan nuansa 'meluputkan' atau 'melindungi'.
  alternative: Menerjemahkannya langsung sebagai 'meluputkan' atau 'melindungi'.
  rationale: Pilihan utama mempertahankan citra gerak dan kaitan leksikalnya dengan peristiwa Paskah, sedangkan catatan kaki menjaga keluasan makna verba yang diperdebatkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang wajar dan khidmat. Pronomina 'Ia' dipakai untuk Yahweh, sedangkan 'kalian' menyampaikan bentuk jamak orang kedua secara jelas. Penanda catatan kaki ditempatkan tepat sesudah unsur yang dijelaskannya.
