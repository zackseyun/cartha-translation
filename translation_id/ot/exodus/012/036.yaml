source:
  edition: WLC
  text: וַֽ/יהוָ֞ה נָתַ֨ן אֶת חֵ֥ן הָ/עָ֛ם בְּ/עֵינֵ֥י מִצְרַ֖יִם וַ/יַּשְׁאִל֑וּ/ם וַֽ/יְנַצְּל֖וּ אֶת מִצְרָֽיִם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/036.yaml
  text: And Yahweh gave the people favor in the eyes of the Egyptians[a], so that they let them have what they asked; and they plundered Egypt.
translation:
  language: id
  text: TUHAN memberikan kepada bangsa itu perkenanan di mata orang Mesir, sehingga orang Mesir memberikan kepada mereka apa yang mereka minta.[a] Demikianlah mereka menjarah Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, menurut terjemahan yang lebih tradisional, “sehingga orang Mesir meminjamkan kepada mereka.” Kata kerja Ibrani di sini dapat dipahami sebagai meminjamkan atau sebagai memberikan apa yang diminta.
    reason: alternative_reading
lexical_decisions:
- source_word: וַֽיהוָה
  choice: TUHAN
  rationale: Menerjemahkan nama ilahi dengan bentuk baku bahasa Indonesia yang mengikuti tradisi penghormatan, tanpa menghilangkan bahwa subjeknya adalah YHWH.
- source_word: נָתַן אֶת־חֵן
  choice: membuat ... mendapat kemurahan hati
  rationale: Secara harfiah berarti 'memberikan kemurahan'; susunan ini mengungkapkan bahwa TUHAN menimbulkan sikap baik orang Mesir terhadap bangsa Israel dalam bahasa Indonesia yang alami.
- source_word: בְּעֵינֵי מִצְרַיִם
  choice: di mata orang Mesir
  rationale: Mempertahankan idiom Ibrani yang juga jelas dan lazim dalam bahasa Indonesia; מִצְרַיִם di sini menunjuk secara kolektif kepada orang Mesir.
- source_word: וַיַּשְׁאִלוּם
  choice: orang Mesir memberikan kepada mereka apa yang mereka minta
  rationale: Dalam konteks ini bentuk Hifil dari שאל menunjukkan tanggapan positif terhadap permintaan Israel. Terjemahan ini alami dan tidak memaksakan gagasan pinjaman yang harus dikembalikan; kemungkinan tradisional dicatat dalam catatan kaki.
- source_word: וַיְנַצְּלוּ אֶת־מִצְרָיִם
  choice: Demikianlah mereka menjarah Mesir
  rationale: Bentuk Piel נצל menyatakan tindakan melucuti atau merampas. 'Menjarah' mempertahankan daya ungkap teks, sedangkan 'Demikianlah' memperjelas hasil dari pemberian barang-barang tersebut.
theological_decisions:
- issue: Apakah וַיַּשְׁאִלוּם berarti orang Mesir meminjamkan barang atau memberikan apa yang diminta
  choice: orang Mesir memberikan kepada mereka apa yang mereka minta
  alternative: orang Mesir meminjamkan barang-barang kepada mereka
  rationale: Konteks kemurahan hati dan hasil berupa penjarahan Mesir mendukung pengertian bahwa permintaan Israel dipenuhi, tetapi makna 'meminjamkan' memiliki sejarah penafsiran yang panjang dan secara leksikal mungkin, sehingga dipertahankan dalam catatan kaki.
- issue: Identitas pelaku dalam וַיַּשְׁאִלוּם
  choice: menyebut 'orang Mesir' secara eksplisit
  alternative: menggunakan pronomina 'mereka'
  rationale: Bahasa Ibrani memungkinkan referen dipahami dari konteks. Penyebutan eksplisit mencegah kerancuan dalam bahasa Indonesia antara bangsa Israel dan orang Mesir tanpa mengubah hubungan antarklausa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Idiom 'di mata' dipertahankan karena alami dalam bahasa sasaran. Tanda baca membagi rangkaian Ibrani menjadi dua kalimat agar pelaku dan hasil tindakan mudah dipahami.
