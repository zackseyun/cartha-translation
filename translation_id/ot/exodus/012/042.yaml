  naturalness: “Itulah malam” kurang jelas sebagai pembuka mandiri, sedangkan “bani Israel” terasa arkais untuk bahasa Indonesia baku modern. “Anak-anak Israel” adalah padanan yang lebih lazim dan tetap dekat dengan בני ישראל.
  terminology: “Malam berjaga-jaga” secara aman mempertahankan ketegangan antara berjaga/menjaga dan peringatan. Nama ilahi “Yahweh” sudah tepat. Catatan kaki perlu membedakan “berjaga” dari “pengawasan” dan menjelaskan kemungkinan nuansa peringatan tanpa menyatakan salah satu pelaku secara pasti.
  issues:
  - severity: medium
    issue: Alternatif “malam pengawasan” dalam catatan kaki tidak tepat.
    rationale: Pengawasan dalam bahasa Indonesia terutama berarti supervisi atau kontrol, bukan tindakan berjaga/menjaga yang tercakup dalam שִׁמֻּרִים.
  - severity: medium
