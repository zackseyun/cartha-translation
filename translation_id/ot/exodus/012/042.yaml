  revised_text: Malam itu adalah malam berjaga-jaga bagi Yahweh untuk membawa mereka keluar dari tanah Mesir. Malam yang sama itu adalah malam berjaga-jaga bagi Yahweh bagi semua anak-anak Israel, turun-temurun.
