revisions:
- from: Itulah malam berjaga-jaga bagi Yahweh[a] untuk membawa mereka keluar dari tanah Mesir. Malam yang sama ini adalah malam berjaga-jaga bagi Yahweh untuk seluruh bani Israel turun-temurun.
  to: Malam itu adalah malam berjaga-jaga bagi Yahweh untuk membawa mereka keluar dari tanah Mesir. Malam yang sama itu adalah malam berjaga-jaga bagi Yahweh bagi semua anak-anak Israel, turun-temurun.
  rationale: Revisi memperjelas pembuka dan memakai “anak-anak Israel” sebagai padanan modern yang dekat dengan teks sumber. Frasa “malam berjaga-jaga bagi Yahweh” dan “untuk membawa mereka keluar” dipertahankan agar hubungan yang padat dan tidak sepenuhnya terurai dalam bahasa Ibrani tidak dipersempit. Catatan kaki diperbaiki untuk memberi alternatif leksikal yang wajar serta menjelaskan ambiguitas tanpa menetapkan penafsiran tunggal.
