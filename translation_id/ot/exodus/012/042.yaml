  text: לֵ֣יל שִׁמֻּרִ֥ים הוּא֙ לַֽ/יהוָ֔ה לְ/הוֹצִיאָ֖/ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם הֽוּא הַ/לַּ֤יְלָה הַ/זֶּה֙ לַֽ/יהוָ֔ה שִׁמֻּרִ֛ים לְ/כָל בְּנֵ֥י יִשְׂרָאֵ֖ל לְ/דֹרֹתָֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/042.yaml
  text: It was a night of vigil for Yahweh[a], to bring them out from the land of Egypt; this same night is a vigil for Yahweh for all the children of Israel throughout their generations.
translation:
  language: id
  text: Malam itu adalah malam berjaga-jaga bagi Yahweh untuk membawa mereka keluar dari tanah Mesir. Malam yang sama itu adalah malam berjaga-jaga bagi Yahweh bagi semua anak-anak Israel, turun-temurun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵיל שִׁמֻּרִים
  choice: malam berjaga-jaga
  rationale: Bentuk konstruk לֵיל diikuti שִׁמֻּרִים menunjuk pada malam yang ditandai oleh tindakan menjaga atau berjaga. Ungkapan ini mempertahankan nuansa konkret sekaligus kemungkinan makna peringatan yang dijalankan.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menyatakan hubungan atau peruntukan. “Bagi Yahweh” alami dalam bahasa Indonesia dan tidak mempersempit frasa menjadi hanya tindakan Allah atau hanya ibadah umat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: לְהוֹצִיאָם
  choice: untuk membawa mereka keluar
  rationale: Infinitif dengan ל dapat menyatakan tujuan atau hasil. Terjemahan ini mempertahankan bentuk tujuan tanpa mengubahnya menjadi anak kalimat waktu.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: dari tanah Mesir
  rationale: Mempertahankan kata אֶרֶץ, “tanah/negeri”, yang disebut secara eksplisit dalam teks Ibrani.
- source_word: הוּא הַלַּיְלָה הַזֶּה
  choice: Malam yang sama ini
  rationale: Gabungan kata ganti dan frasa demonstratif memberi penegasan identitas serta menghubungkan klausa kedua dengan malam yang baru disebutkan.
- source_word: לְכָל בְּנֵי יִשְׂרָאֵל
  choice: untuk seluruh bani Israel
  rationale: “Bani Israel” mempertahankan ungkapan kekerabatan בְּנֵי יִשְׂרָאֵל dan tetap dikenal dalam ragam bahasa Indonesia yang bermartabat.
- source_word: לְדֹרֹתָם
  choice: turun-temurun
  rationale: Ungkapan Indonesia yang alami untuk keberlanjutan sepanjang generasi-generasi mereka.
theological_decisions:
- issue: Penulisan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Pelaku dan corak berjaga dalam שִׁמֻּרִים
  choice: Mempertahankan ungkapan “malam berjaga-jaga” dan menjelaskan ambiguitas dalam catatan kaki
  alternative: malam ketika Yahweh berjaga atau malam peringatan bagi Israel
  rationale: Konteks memungkinkan kaitan dengan tindakan Yahweh menjaga dan membebaskan, sekaligus dengan kewajiban Israel memperingati malam itu sepanjang generasi. Teks utama tidak memilih salah satu secara eksklusif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan “bagi Yahweh” serta “malam berjaga-jaga” sengaja dipertahankan agar hubungan gramatikal dan ketegangan makna dalam teks Ibrani tidak dijelaskan secara berlebihan.
