  text: This month shall be for you the beginning of months[a]; it shall be the first month of the year for you.
translation:
  language: id
  text: Bulan ini akan menjadi yang pertama di antara bulan-bulan bagi kamu; bulan ini akan menjadi bulan pertama bagi kamu di antara bulan-bulan dalam setahun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Bulan baru ini.” Kata Ibrani yang diterjemahkan “bulan” berkaitan dengan siklus bulan baru, tetapi dalam konteks ini menunjuk pada bulan dalam kalender.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹדֶשׁ הַזֶּה
  choice: Bulan ini
  rationale: Dalam konteks penetapan kalender, חֹדֶשׁ secara wajar berarti “bulan”, meskipun kata itu juga berkaitan dengan bulan baru.
- source_word: לָכֶם
  choice: bagi kamu
  rationale: Preposisi ini menyatakan acuan bagi umat Israel sebagai pihak yang menerima penetapan kalender tersebut; pengulangannya dipertahankan.
- source_word: רֹאשׁ חֳדָשִׁים
  choice: permulaan segala bulan
  rationale: רֹאשׁ secara harfiah berarti “kepala”, tetapi dalam urutan waktu berarti “permulaan” atau yang pertama. “Segala bulan” menyampaikan bentuk jamak takrif secara alami.
- source_word: רִאשׁוֹן הוּא
  choice: bulan ini akan menjadi bulan pertama
  rationale: רִאשׁוֹן menyatakan urutan pertama; nomina “bulan” dan subjek “bulan ini” dinyatakan kembali agar klausa Indonesia jelas dan alami.
- source_word: לְחָדְשֵׁי הַשָּׁנָה
  choice: dalam setahun
  rationale: Frasa ini menentukan lingkup penghitungan, yakni bulan-bulan dalam satu tahun. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan makna kalender.
theological_decisions:
- issue: Daya klausa nominal Ibrani dalam konteks penetapan hukum
  choice: akan menjadi
  alternative: adalah / merupakan
  rationale: Bahasa Ibrani tidak memakai verba eksplisit, tetapi konteksnya menetapkan kalender Israel. “Akan menjadi” menyampaikan daya institusional tanpa menambahkan isi doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel serta pengulangan “bagi kamu” dipertahankan untuk mencerminkan penekanan teks Ibrani; “bulan ini” diulang demi kejelasan. Penanda catatan kaki ditempatkan sesudah klausa yang dijelaskannya.
