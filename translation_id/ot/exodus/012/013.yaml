review_pass:
  verdict: revise
  source_fidelity: Terjemahan secara umum mengikuti struktur Ibrani dengan baik, termasuk fungsi temporal 'Ketika Aku melihat' dan pelestarian makna leksikal פָּסַח. Namun, 'pada rumah-rumah' kurang tepat untuk עַל הַבָּתִּים dalam konteks darah sebagai tanda pada rumah-rumah; 'di rumah-rumah' lebih alami dan cukup mencerminkan lokasi tanda tersebut. Klausa akhir juga lebih jelas bila 'tulah yang membinasakan' ditempatkan sebagai satu kesatuan sebelum keterangan 'di tengah-tengahmu'.
  naturalness: '''Aku akan melewatimu'' lebih idiomatis daripada ''Aku akan melewati kamu'' dan tetap mempertahankan ambiguitas/gambaran dasar verba Ibrani. ''Di tengah-tengahmu'' merupakan ungkapan baku yang lebih lancar daripada ''di antara kamu'' dalam kalimat ini. Penempatan keterangan temporal di akhir dipertahankan.'
  terminology: '''Darah'', ''tanda'', ''tulah'', dan ''tanah Mesir'' sesuai register Alkitab Indonesia modern. ''Membinasakan'' mempertahankan pembacaan verbal/resultatif tanpa menjadikan מַשְׁחִית seorang agen personal dalam teks utama. Catatan alternatif substantival perlu dirumuskan secara netral dan tanpa hubungan kausal (''karena'') yang tidak dinyatakan oleh teks.'
  issues:
  - severity: medium
    issue: Frasa 'pada rumah-rumah' kurang sesuai dalam konteks tanda darah.
    rationale: עַל dalam ayat ini menunjuk tanda darah yang terkait dengan/berada pada rumah-rumah. Dalam bahasa Indonesia, 'di rumah-rumah' lebih alami daripada 'pada rumah-rumah' dan tidak mengaburkan hubungan spasialnya.
  - severity: low
    issue: '''Aku akan melewati kamu'' kurang idiomatis.'
    rationale: Bentuk enklitik 'Aku akan melewatimu' adalah bahasa Indonesia baku yang lebih lancar serta masih mempertahankan pilihan terjemahan 'pass over'.
  - severity: medium
    issue: Catatan kaki b memakai 'karena pembinasa'.
    rationale: '''Karena'' menyatakan sebab yang tidak secara langsung dikodekan oleh לְמַשְׁחִית. Catatan perlu hanya menyatakan bahwa frasa itu dapat dipahami sebagai nomina ''pembinasa'', tanpa menambahkan relasi kausal.'
  revised_text: Darah itu akan menjadi tanda bagimu di rumah-rumah tempat kamu berada. Ketika Aku melihat darah itu, Aku akan melewatimu[a], dan tidak akan ada tulah yang membinasakan di tengah-tengahmu ketika Aku memukul tanah Mesir.[b]
