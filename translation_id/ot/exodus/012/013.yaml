base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/013.yaml
  text: And the blood shall be a sign for you on the houses where you are[a]. When I see the blood, I will pass over you[b], and no plague will be among you to destroy, when I strike the land of Egypt.
translation:
  language: id
  text: Darah itu akan menjadi tanda bagimu di rumah-rumah tempat kamu berada. Ketika Aku melihat darah itu, Aku akan melewatimu[a], dan tidak akan ada tulah yang membinasakan di tengah-tengahmu ketika Aku memukul tanah Mesir.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku akan menyelamatkan kamu” atau “Aku akan melindungi kamu.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “dan tidak akan ada tulah di tengah-tengahmu untuk pembinasa,” dengan memahami kata Ibrani itu sebagai kata benda yang berarti “pembinasa.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה הַדָּם לָכֶם לְאֹת
  choice: Darah itu akan menjadi tanda bagimu
  rationale: Bentuk verba dalam konteks petunjuk dan janji ini menyatakan hasil yang akan berlaku; 'akan menjadi' alami dalam bahasa Indonesia. 'Bagimu' mempertahankan nuansa manfaat atau acuan dari לָכֶם.
- source_word: עַל הַבָּתִּים אֲשֶׁר אַתֶּם שָׁם
  choice: pada rumah-rumah tempat kamu berada
  rationale: '''Pada'' menyampaikan hubungan tempat tanpa menyiratkan bahwa seluruh darah berada di atas rumah; klausa relatif diterjemahkan secara lugas dan alami.'
- source_word: וְרָאִיתִי אֶת־הַדָּם
  choice: Ketika Aku melihat darah itu
  rationale: Walaupun secara bentuk terkoordinasi, klausa ini berfungsi temporal dalam urutan tindakan.
- source_word: וּפָסַחְתִּי עֲלֵכֶם
  choice: Aku akan melewati kamu
  rationale: '''Melewati'' mempertahankan gambaran dasar dan kaitan istilah dengan Paskah, sementara kemungkinan makna ''menyelamatkan'' atau ''melindungi'' dicatat tanpa dipaksakan ke teks utama.'
- source_word: וְלֹא יִהְיֶה בָכֶם נֶגֶף
  choice: tidak akan ada tulah di antara kamu
  rationale: '''Tulah'' sesuai dengan konteks rangkaian tulah Mesir, dan ''di antara kamu'' mencerminkan בָכֶם secara alami.'
- source_word: לְמַשְׁחִית
  choice: yang membinasakan
  rationale: Frasa sulit ini dipahami secara verbal/resultatif sebagai sifat atau akibat tulah, tanpa mewajibkan personifikasi sebagai 'pembinasa'.
- source_word: בְּהַכֹּתִי בְּאֶרֶץ מִצְרָיִם
  choice: ketika Aku memukul tanah Mesir
  rationale: Infinitif dengan בְּ menyatakan waktu. 'Memukul' mempertahankan metafora tindakan ilahi, sedangkan 'tanah Mesir' adalah padanan baku dan langsung.
theological_decisions:
- issue: Makna וּפָסַחְתִּי עֲלֵכֶם dalam penetapan Paskah
  choice: Aku akan melewati kamu
  alternative: Aku akan menyelamatkan kamu; Aku akan melindungi kamu
  rationale: Teks utama mempertahankan gambaran leksikal dan kaitannya dengan nama Paskah, sedangkan nuansa tindakan menyelamatkan atau melindungi tetap diakui dalam catatan kaki.
- issue: Apakah לְמַשְׁחִית menunjuk pada kebinasaan atau sosok pembinasa
  choice: yang membinasakan
  alternative: karena pembinasa; sebagai pembinasa
  rationale: Bentuk Ibrani memungkinkan pemahaman verbal maupun substantival. Terjemahan utama tidak memasukkan agen personal secara eksplisit, tetapi bacaan substantival dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Penanda catatan kaki [a] dan [b] keduanya dicantumkan dalam teks utama; [b] ditempatkan setelah kalimat agar tidak mengganggu alur klausa yang panjang.
