  to: Darah itu akan menjadi tanda bagimu di rumah-rumah tempat kamu berada. Ketika Aku melihat darah itu, Aku akan melewatimu[a], dan tidak akan ada tulah yang membinasakan di tengah-tengahmu ketika Aku memukul tanah Mesir.[b]
  rationale: Revisi memperbaiki kelancaran bahasa Indonesia dan ketepatan hubungan spasial tanda darah dengan rumah-rumah. Teks utama tetap mempertahankan pembacaan verbal dari לְמַשְׁחִית, sedangkan catatan kaki mempertahankan kemungkinan pembacaan substantival secara netral. Jangkar [a] tetap ditempatkan pada 'melewatimu', dan [b] tetap mengacu pada klausa tulah/pembinasa.
