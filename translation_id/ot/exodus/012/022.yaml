  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/לְקַחְתֶּ֞ם אֲגֻדַּ֣ת אֵז֗וֹב וּ/טְבַלְתֶּם֮ בַּ/דָּ֣ם אֲשֶׁר בַּ/סַּף֒ וְ/הִגַּעְתֶּ֤ם אֶל הַ/מַּשְׁקוֹף֙ וְ/אֶל שְׁתֵּ֣י הַ/מְּזוּזֹ֔ת מִן הַ/דָּ֖ם אֲשֶׁ֣ר בַּ/סָּ֑ף וְ/אַתֶּ֗ם לֹ֥א תֵצְא֛וּ אִ֥ישׁ מִ/פֶּֽתַח בֵּית֖/וֹ עַד בֹּֽקֶר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/022.yaml
  text: And you shall take a bunch of hyssop and dip it in the blood that is in the basin[a], and touch the lintel and the two doorposts with some of the blood that is in the basin. And none of you shall go out from the entrance of his house until morning.
translation:
  language: id
  text: Ambillah seikat hisop dan celupkanlah ke dalam darah yang ada di dalam baskom[a]. Lalu sentuhkanlah sebagian darah yang ada di dalam baskom itu pada ambang atas dan kedua tiang pintu. Jangan seorang pun dari kalian keluar dari pintu rumahnya sampai pagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “ambang pintu” untuk “baskom” (Ibrani: saf). Di sini “baskom” lebih mungkin karena darah disebut berada di dalamnya dan hisop dicelupkan ke dalamnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲגֻדַּת אֵזוֹב
  choice: seikat hisop
  rationale: אֲגֻדָּה menunjuk pada kumpulan yang diikat; 'seikat' alami dalam bahasa Indonesia dan mempertahankan bentuk konkret alat ritual tersebut. אֵזוֹב diterjemahkan secara konvensional sebagai 'hisop', meskipun identifikasi botanisnya tidak pasti.
- source_word: וּטְבַלְתֶּם בַּדָּם
  choice: celupkanlah ke dalam darah
  rationale: Dengan טבל, preposisi ב menandai medium tempat sesuatu dicelupkan. 'Ke dalam darah' merupakan ungkapan Indonesia yang alami.
- source_word: הַסַּף
  choice: baskom
  rationale: Darah dikatakan berada 'di dalam' סַף dan hisop dicelupkan ke dalamnya, sehingga wadah penampung darah paling sesuai dengan konteks. Alternatif 'ambang pintu' dicatat dalam catatan kaki.
- source_word: וְהִגַּעְתֶּם
  choice: sentuhkanlah
  rationale: Bentuk Hifil dari נגע menyatakan tindakan membuat sesuatu bersentuhan dengan permukaan; 'sentuhkanlah' mempertahankan tindakan konkret tanpa menambah gagasan seperti mengoles atau memercik.
- source_word: הַמַּשְׁקוֹף
  choice: ambang atas
  rationale: Istilah ini menunjuk pada bagian horizontal di atas bukaan pintu. 'Ambang atas' lebih mudah dipahami pembaca umum daripada istilah teknis 'palang ambang'.
- source_word: שְׁתֵּי הַמְּזוּזֹת
  choice: kedua tiang pintu
  rationale: מְזוּזוֹת adalah dua bagian vertikal pada sisi bukaan pintu; 'kedua tiang pintu' jelas dan alami.
- source_word: מִן הַדָּם
  choice: sebagian darah
  rationale: מִן menyatakan bahwa darah yang digunakan diambil dari darah dalam wadah. 'Sebagian darah' menyampaikan makna partitif secara alami.
- source_word: לֹא תֵצְאוּ אִישׁ
  choice: jangan seorang pun dari kalian keluar
  rationale: אִישׁ sesudah larangan jamak berfungsi distributif. Rumusan ini menyampaikan bahwa larangan berlaku kepada tiap orang.
- source_word: מִפֶּתַח בֵּיתוֹ
  choice: dari pintu rumahnya
  rationale: פֶּתַח adalah bukaan atau pintu masuk. 'Pintu rumahnya' ringkas dan alami serta mempertahankan sufiks tunggal distributif pada בֵּיתוֹ.
- source_word: עַד בֹּקֶר
  choice: sampai pagi
  rationale: Padanan temporal langsung dan alami bagi frasa Ibrani tersebut.
theological_decisions:
- issue: Ungkapan distributif bergender אִישׁ ... בֵּיתוֹ
  choice: Jangan seorang pun dari kalian keluar dari pintu rumahnya
  alternative: Janganlah kalian keluar dari pintu rumah kalian masing-masing
  rationale: '''Seorang pun ... rumahnya'' mempertahankan bentuk tunggal distributif teks Ibrani. Dalam konteks ini, אִישׁ menyatakan setiap orang dan tidak membatasi perintah hanya kepada laki-laki.'
- issue: Makna הַסַּף dalam ayat ini
  choice: baskom
  alternative: ambang pintu
  rationale: Sintaksis terdekat menyebut darah berada di dalam סַף dan hisop dicelupkan ke dalamnya, sehingga makna wadah lebih kuat. Karena 'ambang pintu' tetap merupakan kemungkinan leksikal yang nyata, alternatif itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya perintah yang lugas dan bermartabat. Bentuk '-lah' dipakai pada rangkaian perintah positif, sedangkan larangan dirumuskan secara alami dengan 'jangan'. Istilah 'hisop' dipertahankan sebagai nama tumbuhan ritual konvensional.
