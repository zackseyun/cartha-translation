  text: Take both your flocks and your herds[a], just as you have said, and go—and bless me also.
translation:
  language: id
  text: Bawalah baik kawanan kambing dan domba kalian maupun kawanan sapi kalian, seperti yang kalian katakan, lalu pergilah dan berkatilah aku juga.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Berkatilah bahkan aku.” Perkataan Firaun mungkin menekankan bahwa dirinya pun mengharapkan berkat ketika Israel pergi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם צֹאנְכֶם גַּם בְּקַרְכֶם
  choice: juga kawanan kambing domba dan kawanan sapi kalian
  rationale: Dua kali גַּם mengoordinasikan kedua kelompok ternak dengan penekanan bahwa semuanya boleh dibawa. Dalam bahasa Indonesia, satu 'juga' dan penghubung 'dan' menyampaikan susunan itu secara alami. צֹאן menunjuk ternak kecil, terutama kambing dan domba, sedangkan בָּקָר menunjuk sapi atau ternak besar.
- source_word: קְחוּ
  choice: Bawalah
  rationale: Imperatif jamak לקח dalam konteks keberangkatan berarti membawa serta ternak itu; 'bawalah' lebih alami daripada 'ambillah' dalam bahasa Indonesia.
- source_word: כַּאֲשֶׁר דִּבַּרְתֶּם
  choice: seperti yang telah kalian katakan
  rationale: Mempertahankan daya banding כַּאֲשֶׁר dan rujukannya kepada tuntutan yang sebelumnya disampaikan oleh Musa dan Harun.
- source_word: וָלֵכוּ
  choice: lalu pergilah
  rationale: Imperatif הלך memerintahkan mereka berangkat. 'Lalu' menyatakan urutan secara wajar tanpa menambahkan makna kausal.
- source_word: וּבֵרַכְתֶּם גַּם אֹתִי
  choice: Berkatilah aku juga
  rationale: Bentuk piel ברך diterjemahkan langsung sebagai 'berkatilah'. גַּם אֹתִי menambahkan Firaun sebagai penerima berkat; ungkapan ini tetap dapat dipahami dengan tekanan 'aku juga' atau 'bahkan aku'.
theological_decisions:
- issue: Sifat permintaan Firaun akan berkat
  choice: Permintaan langsung, 'Berkatilah aku juga,' tanpa menjelaskan cara atau jenis berkatnya.
  alternative: Permohonan syafaat kepada Allah Israel, atau ungkapan perpisahan yang disertai harapan baik.
  rationale: Kata ברך jelas berarti 'memberkati', tetapi ayat ini tidak menerangkan apakah Firaun meminta perantaraan di hadapan Allah Israel atau sekadar berkat perpisahan. Terjemahan sederhana mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. 'Kalian' dipakai untuk mempertahankan bentuk orang kedua jamak Ibrani; 'kambing domba' dan 'sapi' membuat dua kategori ternak lebih jelas bagi pembaca umum.
