revisions:
- from: Jika jumlah anggota suatu keluarga terlalu sedikit untuk menghabiskan seekor anak domba[a], keluarga itu harus bergabung dengan tetangga terdekat, sesuai dengan jumlah orangnya. Dengan memperhitungkan banyaknya yang dapat dimakan setiap orang[b], kamu harus menentukan jumlah orang untuk setiap anak domba.
  to: Jika sebuah rumah tangga terlalu kecil untuk seekor anak domba[a], ia dan tetangganya yang paling dekat dengan rumahnya harus mengambil seekor anak domba menurut jumlah orang. Setiap orang harus diperhitungkan untuk anak domba itu menurut banyaknya yang dapat dimakannya[b].
  rationale: Revisi menghilangkan tambahan makna yang tidak dinyatakan, memulihkan tindakan bersama antara rumah tangga dan tetangga terdekatnya, serta menerjemahkan perhitungan peserta menurut kemampuan makan tanpa membatasi secara berlebihan makna kata kerja Ibrani. Catatan kaki mempertahankan keluasan leksikal שֶׂה dan alternatif susunan untuk klausa terakhir.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:04:32Z'
review_pass:
  verdict: revise
  source_fidelity: Perlu revisi. Terjemahan menambahkan gagasan eksplisit “untuk menghabiskan,” padahal Ibrani hanya menyatakan rumah tangga terlalu sedikit dibandingkan dengan seekor שֶׂה. Selain itu, “keluarga itu harus bergabung” menghilangkan subjek “ia dan tetangganya” serta tindakan mengambil hewan bersama. Kalimat terakhir, “menentukan jumlah orang untuk setiap anak domba,” terlalu mempersempit tindakan menghitung/memperhitungkan untuk hewan itu dan mengubah susunan perintah sumber.
  naturalness: Bahasa draf umumnya alami, tetapi “sesuai dengan jumlah orangnya” kurang jelas rujukannya, dan bentuk perintah “kamu harus” di tengah rujukan rumah tangga terdengar kurang mulus. Revisi memakai bentuk kolektif yang jelas dan tetap baku.
  terminology: “Rumah tangga” sesuai untuk הַבַּיִת dalam konteks ini. “Anak domba” dapat dipakai dalam teks utama, dengan catatan bahwa שֶׂה juga dapat berarti kambing muda/ternak kecil dari kawanan. “Orang” tepat untuk נְפָשֹׁת; jangan memaksakan “jiwa.”
  issues:
  - severity: medium
    issue: Penambahan “untuk menghabiskan”
    rationale: Ungkapan מִהְיוֹת מִשֶּׂה menyatakan ketidakcukupan rumah tangga dalam kaitannya dengan seekor hewan, bukan secara eksplisit tindakan menghabiskan.
  - severity: medium
    issue: “Keluarga itu harus bergabung dengan tetangga terdekat”
    rationale: Ini mengaburkan bahwa rumah tangga tersebut dan tetangga yang paling dekat dengan rumahnya harus mengambil seekor hewan bersama-sama.
  - severity: medium
    issue: “menentukan jumlah orang untuk setiap anak domba”
    rationale: תָּכֹסּוּ עַל־הַשֶּׂה memerintahkan perhitungan/penetapan menurut konsumsi untuk hewan itu; frasa draf menjadikannya semata-mata penentuan jumlah peserta dan memakai “setiap” yang tidak dinyatakan.
  - severity: low
    issue: Rujukan “orangnya” tidak tegas
    rationale: “Menurut jumlah orang” lebih langsung mencerminkan בְּמִכְסַת נְפָשֹׁת.
