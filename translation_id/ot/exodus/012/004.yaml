base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/004.yaml
  text: And if the household is too small for a lamb[a], then he and his nearest neighbor shall take one according to the number of persons; each man according to what he can eat[b], you shall count for the lamb.
translation:
  language: id
  text: Jika sebuah rumah tangga terlalu kecil untuk seekor anak domba[a], ia dan tetangganya yang paling dekat dengan rumahnya harus mengambil seekor anak domba menurut jumlah orang. Setiap orang harus diperhitungkan untuk anak domba itu menurut banyaknya yang dapat dimakannya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani שֶׂה dapat merujuk lebih luas kepada seekor ternak kecil, dari domba atau kambing; “anak domba” dipakai di sini sesuai konteks Paskah.
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Setiap orang menurut banyaknya yang dapat dimakannya, harus kamu perhitungkan untuk anak domba itu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְעַט הַבַּיִת מִהְיֹת מִשֶּׂה
  choice: jumlah anggota suatu keluarga terlalu sedikit untuk menghabiskan seekor anak domba
  rationale: הַבַּיִת menunjuk pada keluarga atau rumah tangga, sedangkan konstruksi יִמְעַט ... מִהְיֹת menyatakan ketidakcukupan jumlah. Penambahan eksplisit 'untuk menghabiskan' menjelaskan hubungan kontekstual dengan porsi makanan tanpa mengubah maksud.
- source_word: שֶׂה
  choice: anak domba
  rationale: Dalam konteks Paskah, 'anak domba' merupakan ungkapan Indonesia yang alami, tetapi istilah Ibrani dapat mencakup ternak kecil dari domba atau kambing; keluasan ini dipertahankan dalam catatan kaki.
- source_word: וְלָקַח הוּא וּשְׁכֵנוֹ הַקָּרֹב אֶל־בֵּיתוֹ
  choice: keluarga itu harus bergabung dengan tetangga terdekat
  rationale: Secara harfiah mereka 'mengambil' hewan itu bersama-sama. Dalam bahasa Indonesia, 'bergabung dengan' menyampaikan tindakan bersama dengan rumah tangga tetangga secara wajar, sedangkan objeknya dipahami dari konteks.
- source_word: בְּמִכְסַת נְפָשֹׁת
  choice: sesuai dengan jumlah orangnya
  rationale: מִכְסָה menyatakan hitungan atau jumlah, dan נְפָשֹׁת di sini berarti orang-orang, bukan jiwa yang terpisah dari tubuh.
- source_word: אִישׁ לְפִי אָכְלוֹ
  choice: dengan memperhitungkan banyaknya yang dapat dimakan setiap orang
  rationale: אִישׁ bersifat distributif, dan לְפִי אָכְלוֹ mengacu pada kapasitas makan masing-masing. Terjemahan ini alami dalam bahasa Indonesia dan menjaga dasar perhitungan itu.
- source_word: תָּכֹסּוּ עַל־הַשֶּׂה
  choice: kamu harus menentukan jumlah orang untuk setiap anak domba
  rationale: Kata kerja yang jarang ini dalam konteks menyatakan menghitung atau menetapkan peserta berkenaan dengan hewan tersebut. Pilihan ini memperjelas hasil perhitungannya sambil mempertahankan nuansa penghitungan.
