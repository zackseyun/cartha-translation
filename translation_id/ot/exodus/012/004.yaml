translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang wajar dan bermartabat. Bentuk tunggal kolektif 'keluarga itu' menghindari pronomina maskulin yang janggal dalam bahasa Indonesia. Struktur kalimat diperjelas agar hubungan antara jumlah peserta dan kemampuan makan mudah dipahami.
