  source_fidelity: 'Teks dengan tepat mencerminkan urutan dan isi Ibrani: panggilan pada malam hari, dua perintah mendesak untuk bangun dan keluar dari antara rakyat Firaun, penegasan bahwa Musa-Harun serta orang Israel harus pergi, lalu perintah untuk beribadah kepada Yahweh sesuai permintaan mereka. Subjek tersirat “ia” tepat dan tidak menambahkan nama Firaun ke dalam teks.'
