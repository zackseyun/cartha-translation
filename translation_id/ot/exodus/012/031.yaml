  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקְרָא֩ לְ/מֹשֶׁ֨ה וּֽ/לְ/אַהֲרֹ֜ן לַ֗יְלָה וַ/יֹּ֨אמֶר֙ ק֤וּמוּ צְּאוּ֙ מִ/תּ֣וֹךְ עַמִּ֔/י גַּם אַתֶּ֖ם גַּם בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/לְכ֛וּ עִבְד֥וּ אֶת יְהוָ֖ה כְּ/דַבֶּרְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/031.yaml
  text: Then he called for Moses and Aaron by night and said[a], “Rise up, go out from among my people, both you and the sons of Israel, and go, serve Yahweh[b], as you have said.”
translation:
  language: id
  text: Malam itu ia memanggil Musa dan Harun, lalu berkata, “Bangunlah! Keluarlah dari tengah-tengah rakyatku, baik kamu maupun orang Israel[a]. Pergilah dan beribadahlah kepada Yahweh, seperti yang telah kamu katakan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: ia memanggil
  rationale: Dalam konteks ini קרא menyatakan panggilan mendesak kepada Musa dan Harun. “Memanggil” alami dalam bahasa Indonesia dan tidak menambahkan kadar formal yang tidak dinyatakan teks.
- source_word: לַיְלָה
  choice: malam itu
  rationale: Kata ini berfungsi sebagai keterangan waktu. “Malam itu” alami dalam narasi Indonesia dan mempertahankan penekanan bahwa panggilan terjadi pada malam hari.
- source_word: קוּמוּ צְּאוּ
  choice: Bangunlah! Keluarlah
  rationale: Dua bentuk imperatif dipertahankan secara terpisah agar urutan dan desakan perintah dalam bahasa Ibrani tetap terasa.
- source_word: מִתּוֹךְ עַמִּי
  choice: dari tengah-tengah rakyatku
  rationale: Ungkapan ini mempertahankan gambaran keluar dari tengah komunitas milik si pembicara; “rakyatku” cocok dengan konteks perkataan penguasa.
- source_word: גַּם אַתֶּם גַּם בְּנֵי יִשְׂרָאֵל
  choice: baik kamu maupun orang Israel
  rationale: Pola berulang גַּם...גַּם menyertakan kedua kelompok dengan tegas. “Orang Israel” merupakan padanan Indonesia yang wajar untuk idiom harfiah “anak-anak Israel,” yang dicatat dalam catatan kaki.
- source_word: וּלְכוּ עִבְדוּ
  choice: Pergilah dan beribadahlah
  rationale: Kedua perintah tetap dibedakan. Dalam konteks permintaan Israel untuk mengadakan ibadah bagi Yahweh, “beribadah” menyampaikan pelayanan religius yang dimaksud, walaupun עבד secara leksikal juga dapat berarti melayani atau mengabdi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber dipertahankan.
- source_word: כְּדַבֶּרְכֶם
  choice: seperti yang telah kamu katakan
  rationale: Frasa ini menyatakan kesesuaian dengan permintaan yang sebelumnya disampaikan Musa dan Harun; bentuk perfektif Indonesia cocok dengan rujukan tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Cakupan makna עבד ketika objeknya Yahweh
  choice: beribadah kepada
  alternative: mengabdi kepada atau melayani
  rationale: Konteks Keluaran 12 menunjuk pada pelayanan religius yang berulang kali diminta Musa. “Beribadah” paling alami dalam bahasa Indonesia di sini, meskipun makna dasar kata itu lebih luas dan dapat mencakup pelayanan atau pengabdian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang tegas dan bermartabat. Kalimat perintah dibuat singkat untuk mempertahankan urgensi teks Ibrani. Nama Firaun tidak ditambahkan karena ayat sumber hanya memakai subjek tersirat “ia”; rujukannya diperoleh dari konteks.
