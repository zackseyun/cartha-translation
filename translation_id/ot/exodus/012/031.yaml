  terminology: “Yahweh” dengan tepat mempertahankan Tetragramaton. “Orang Israel” adalah padanan alami bagi בני ישראל, sementara catatan kaki menyediakan idiom harfiahnya. “Beribadahlah kepada Yahweh” sesuai konteks pelayanan religius עבד dan wajar dalam bahasa Indonesia, tanpa mengubah maksud ayat.
