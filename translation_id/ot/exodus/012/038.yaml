  register: Bahasa Indonesia baku modern dengan gaya naratif yang bermartabat dan mudah dipahami. Frasa tentang kelompok yang menyertai Israel dibuat alami tanpa mempersempit ketidakjelasan asli mengenai identitas mereka.
