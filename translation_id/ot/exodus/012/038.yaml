  text: וְ/גַם עֵ֥רֶב רַ֖ב עָלָ֣ה אִתָּ֑/ם וְ/צֹ֣אן וּ/בָקָ֔ר מִקְנֶ֖ה כָּבֵ֥ד מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/038.yaml
  text: A mixed multitude also went up with them[a], and flocks and herds—a very great amount of livestock.
translation:
  language: id
  text: Sejumlah besar orang dari berbagai kalangan juga berangkat bersama mereka[a], beserta kawanan kambing domba dan kawanan sapi—ternak yang sangat banyak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “rombongan campuran yang besar” atau “kerumunan besar yang beragam.” Frasa Ibrani עֵרֶב רַב menunjuk kepada kelompok heterogen yang menyertai Israel, tanpa menyebut secara khusus latar belakang mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: juga
  rationale: Menyampaikan daya tambah dari gabungan konjungsi dan adverbia secara ringkas dan alami dalam bahasa Indonesia.
- source_word: עֵרֶב רַב
  choice: sejumlah besar orang dari berbagai kalangan
  rationale: Mengungkapkan suatu kelompok heterogen yang besar tanpa menentukan etnis atau asal-usul mereka, yang tidak dinyatakan secara khusus oleh frasa Ibrani.
- source_word: עָלָה
  choice: berangkat
  rationale: Dalam konteks perjalanan keluar dari Mesir, kata ini menyatakan gerak perjalanan. 'Berangkat' terdengar alami dalam narasi Indonesia tanpa memakai padanan spasial yang kaku.
- source_word: אִתָּם
  choice: bersama mereka
  rationale: Menerjemahkan preposisi komitatif dengan sufiks orang ketiga jamak yang merujuk kepada orang Israel dalam konteks.
- source_word: וְצֹאן וּבָקָר
  choice: beserta kawanan kambing domba dan kawanan sapi
  rationale: צֹאן adalah ternak kecil secara kolektif, terutama domba dan kambing, sedangkan בָּקָר adalah ternak besar atau sapi. Ungkapan ini mempertahankan pembedaan kedua kelompok.
- source_word: מִקְנֶה
  choice: ternak
  rationale: Istilah kolektif ini mencakup hewan peliharaan sebagai milik; 'ternak' merupakan padanan Indonesia yang luas dan wajar.
- source_word: כָּבֵד מְאֹד
  choice: yang sangat banyak
  rationale: Secara harfiah berarti 'sangat berat', tetapi ketika menerangkan ternak, ungkapan ini secara idiomatis menunjukkan jumlah yang amat besar.
