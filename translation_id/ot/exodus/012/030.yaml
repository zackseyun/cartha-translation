base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/030.yaml
  text: And Pharaoh rose in the night[a], he and all his servants and all Egypt, and there was a great cry in Egypt[b], for there was no house where there was not someone dead.
translation:
  language: id
  text: Pada malam itu Firaun bangun bersama semua pegawainya dan seluruh Mesir[a]. Terdengarlah jeritan hebat di Mesir, sebab tidak ada rumah yang tidak ada orang mati di dalamnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Seluruh Mesir” memakai nama negeri untuk menyebut penduduk Mesir secara kolektif.
    reason: cultural_note
  - marker: b
    text: Dapat juga diterjemahkan, “sebab tidak ada rumah tanpa orang mati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: bangun
  rationale: Bentuk Qal wayyiqtol dari קום menyatakan tindakan lampau dalam alur narasi. “Bangun” alami dalam bahasa Indonesia dan sesuai dengan tindakan pada malam hari.
- source_word: לַיְלָה הוּא
  choice: pada malam itu
  rationale: Gabungan kata “malam” dengan kata ganti penunjuk berfungsi menetapkan waktunya. “Pada malam itu” jelas, alami, dan mempertahankan kaitannya dengan malam yang sedang diceritakan.
- source_word: עֲבָדָיו
  choice: semua pegawainya
  rationale: עֶבֶד dapat berarti hamba, budak, atau pelayan/pegawai. Dalam lingkungan istana Firaun, “pegawai” menyampaikan maksud para pelayan atau pejabat istana tanpa menekankan status perbudakan yang tidak ditonjolkan konteks.
- source_word: וְכָל מִצְרַיִם
  choice: dan seluruh Mesir
  rationale: Teks Ibrani memakai nama negeri secara kolektif untuk penduduknya. Metonimia ini dipertahankan dalam teks utama dan dijelaskan dalam catatan kaki.
- source_word: צְעָקָה גְדֹלָה
  choice: jeritan hebat
  rationale: צְעָקָה adalah jeritan atau pekikan dalam kesusahan, sedangkan גְדֹלָה menyatakan besarnya. “Jeritan hebat” ringkas dan kuat dalam narasi Indonesia.
- source_word: אֵין בַּיִת אֲשֶׁר אֵין שָׁם מֵת
  choice: tidak ada satu rumah pun yang di dalamnya tidak ada orang mati
  rationale: Rumusan ini mempertahankan pengulangan negatif yang memberi penekanan dalam bahasa Ibrani, sekaligus tetap dapat dipahami dalam bahasa Indonesia. בַּיִת diterjemahkan sebagai “rumah”, bukan ditafsirkan langsung sebagai “keluarga” atau “rumah tangga”.
- source_word: מֵת
  choice: orang mati
  rationale: Partisip ini dipakai sebagai nomina dan merujuk kepada seseorang yang mati. “Orang mati” mempertahankan bentuk tak tentu tanpa menambahkan identitas.
