source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֮ אֶת הַ/מַּצּוֹת֒ כִּ֗י בְּ/עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה הוֹצֵ֥אתִי אֶת צִבְאוֹתֵי/כֶ֖ם מֵ/אֶ֣רֶץ מִצְרָ֑יִם וּ/שְׁמַרְתֶּ֞ם אֶת הַ/יּ֥וֹם הַ/זֶּ֛ה לְ/דֹרֹתֵי/כֶ֖ם חֻקַּ֥ת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/017.yaml
  text: And you shall keep the Feast of Unleavened Bread[a], because on this very day I brought your hosts out from the land of Egypt[c][b]. And you shall keep this day throughout your generations as a permanent statute.
translation:
  language: id
  text: Kamu harus merayakan Hari Raya Roti Tidak Beragi[a], sebab tepat pada hari ini Aku membawa pasukan-pasukanmu[b] keluar dari tanah Mesir. Kamu harus memperingati hari ini turun-temurun sebagai ketetapan untuk selamanya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “roti-roti yang tidak beragi”; ungkapan ini juga dapat menunjuk pada perayaan Roti Tidak Beragi.
    reason: lexical_alternative
  - marker: b
    text: Atau “rombongan-rombonganmu”, “kelompok-kelompokmu”, atau “barisan-barisanmu”. Istilah Ibrani menggambarkan Israel sebagai kumpulan yang tersusun ketika keluar dari Mesir.
    reason: lexical_alternative
  - marker: c
    text: Atau “sebagai ketetapan abadi” atau “sebagai ketetapan tetap”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: harus merayakan / harus memperingati
  rationale: 'Dalam konteks ritual, שׁמר berarti menaati atau menjalankan suatu perayaan. Objek yang berbeda menuntut padanan Indonesia yang alami: perayaan dirayakan, sedangkan hari diperingati; keduanya mempertahankan daya perintah bentuk Ibrani.'
- source_word: הַמַּצּוֹת
  choice: Hari Raya Roti Tidak Beragi
  rationale: Secara harfiah berarti 'roti-roti/hal-hal yang tidak beragi', tetapi dalam konteks ini menunjuk secara metonimis kepada perayaannya. Penambahan 'Hari Raya' membuat maksud ritualnya jelas dalam bahasa Indonesia, sementara catatan kaki mempertahankan bentuk harfiahnya.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: tepat pada hari ini
  rationale: Ungkapan ini menekankan ketepatan hari; 'tepat pada hari ini' alami dan mempertahankan penekanan עֶצֶם.
- source_word: הוֹצֵאתִי
  choice: Aku membawa ... keluar
  rationale: Bentuk hifil dari יצא menyatakan tindakan menyebabkan keluar; padanan ini tepat dan wajar dalam bahasa Indonesia.
- source_word: צִבְאוֹתֵיכֶם
  choice: rombongan-rombonganmu
  rationale: צָבָא dapat menunjuk pasukan atau kelompok yang teratur. 'Rombongan-rombongan' mempertahankan gagasan kelompok-kelompok Israel yang tersusun tanpa menyiratkan bahwa semuanya tentara.
- source_word: לְדֹרֹתֵיכֶם
  choice: turun-temurun
  rationale: Padanan Indonesia yang lazim untuk pelaksanaan yang berlanjut sepanjang generasi-generasi berikutnya.
- source_word: חֻקַּת עוֹלָם
  choice: sebagai ketetapan untuk selamanya
  rationale: חֻקָּה adalah ketentuan atau ketetapan yang ditetapkan, sedangkan עוֹלָם menyatakan keberlangsungan tanpa batas yang disebutkan. Terjemahan ini mempertahankan kekuatan idiom dan menghindari penyempitan tafsir.
theological_decisions:
- issue: Apakah הַמַּצּוֹת menunjuk roti tidak beragi itu sendiri atau perayaannya
  choice: Hari Raya Roti Tidak Beragi dalam teks utama
  alternative: roti tidak beragi
  rationale: Dengan verba 'menjaga/menjalankan' dan konteks penetapan hari, rujukan kepada perayaan paling alami, tetapi bentuk harfiah tetap dicatat karena bahasa Ibraninya tidak memuat kata 'hari raya'.
- issue: Cakupan waktu חֻקַּת עוֹלָם
  choice: ketetapan untuk selamanya
  alternative: ketetapan tetap / ketetapan abadi
  rationale: Terjemahan ini mempertahankan daya temporal עוֹלָם tanpa memutuskan secara tersirat perdebatan teologis mengenai penerapan ketetapan tersebut di luar konteks perjanjian yang sedang dibicarakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi ditulis dengan huruf kapital. 'Kamu' dipertahankan sebagai sapaan jamak yang dapat dipahami dari konteks komunal; pengulangan struktur perintah Ibrani dipertahankan, dengan variasi verba yang alami bagi masing-masing objek.
