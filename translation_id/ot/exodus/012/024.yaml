  text: And you shall keep this thing as a statute for you and for your sons forever[a][b].
translation:
  language: id
  text: Kamu harus menjalankan hal ini sebagai ketetapan bagimu dan bagi anak-anak lelakimu selama-lamanya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “hal ini” atau “perkataan ini.” Istilah Ibrani yang dipakai dapat berarti perkara, hal, atau perkataan.
    reason: lexical_alternative
  - marker: b
    text: Atau “anak-anakmu” atau “keturunanmu.” Teks Ibrani berbunyi “anak-anak lelakimu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Kamu harus memelihara
  rationale: Kata שׁמר dalam konteks hukum-perjanjian berarti menaati sekaligus terus menjalankan. 'Memelihara' mempertahankan kedua nuansa itu dan cocok dengan bentuk jamak Ibrani yang dalam bahasa Indonesia dapat dinyatakan dengan 'kamu' tanpa penandaan jumlah.
- source_word: הַדָּבָר הַזֶּה
  choice: ketetapan ini
  rationale: Secara leksikal דָּבָר dapat berarti perkara, hal, atau firman. Dalam konteks ini frasa tersebut menunjuk pada perayaan Paskah yang baru saja diperintahkan; 'ketetapan ini' wajar dalam bahasa Indonesia, sementara keluasan istilah Ibraninya dicatat dalam catatan kaki.
- source_word: לְחָק
  choice: ketetapan
  rationale: חֹק menunjuk pada sesuatu yang ditentukan atau ditetapkan sebagai kewajiban tetap. 'Ketetapan' mempertahankan daya hukum-perjanjiannya.
- source_word: לְךָ וּלְבָנֶיךָ
  choice: bagi kamu dan anak-anak lelakimu
  rationale: Teks Ibrani secara harfiah menyebut 'bagimu dan bagi anak-anak lelakimu'. Bentuk itu dipertahankan agar tidak secara diam-diam diperluas menjadi 'anak-anak' atau 'keturunan'.
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Gabungan עַד dan עוֹלָם menyatakan keberlangsungan tanpa batas yang ditentukan; 'untuk selama-lamanya' merupakan padanan Indonesia yang alami dan kuat.
theological_decisions:
- issue: Cakupan bahasa pewarisan perjanjian dalam 'anak-anak lelakimu'
  choice: Mempertahankan 'anak-anak lelakimu' dalam teks utama
  alternative: '''anak-anakmu'' atau ''keturunanmu'''
  rationale: Bahasa Ibrani secara eksplisit berbunyi 'anak-anak lelakimu'. Walaupun dalam konteks rumah tangga perjanjian ungkapan ini dapat berfungsi secara representatif, perluasan itu tidak dimasukkan tanpa penanda ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kamu' dipakai sebagai sapaan jamak yang tidak dibedakan bentuknya dalam bahasa Indonesia; 'harus' menyampaikan daya imperatif dari konstruksi Ibrani. Penempatan catatan kaki mengikuti klausa yang diterangkannya.
