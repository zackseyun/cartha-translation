  yaml_path: translation/ot/exodus/012/044.yaml
  text: But every man's servant[a], bought with silver—when you have circumcised him[b], then he may eat of it.
translation:
  language: id
  text: Namun, setiap budak milik seseorang[a] yang dibeli dengan uang—setelah engkau menyunatnya[b], barulah ia boleh memakannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dapat diterjemahkan, “setiap budak seseorang, yang dibeli dengan perak.”
    reason: lexical_alternative
  - marker: b
    text: Artinya, ia baru boleh ikut makan perjamuan Paskah setelah disunat.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כָל
  choice: Namun, setiap
  rationale: Kata וְ menghubungkan aturan ini dengan larangan sebelumnya dan dalam konteks ini bernuansa kontras; כָּל dipertahankan dengan “setiap”.
- source_word: עֶבֶד אִישׁ
  choice: budak milik seseorang
  rationale: עֶבֶד dalam konteks pembelian menunjuk pada orang dalam status perbudakan, bukan sekadar pelayan; אִישׁ menandai pemiliknya. Ungkapan ini alami dalam bahasa Indonesia tanpa mengaburkan relasi kepemilikan.
- source_word: מִקְנַת כָּסֶף
  choice: yang dibeli dengan uang
  rationale: Secara harfiah frasa ini berkaitan dengan perolehan melalui perak; karena כֶּסֶף juga lazim berarti uang, “dibeli dengan uang” menyampaikan idiom ekonomi itu secara jelas dan alami.
- source_word: וּ/מַלְתָּה אֹתוֹ
  choice: setelah engkau menyunatnya
  rationale: Bentuk verba dalam rangkaian hukum ini menyatakan tindakan yang harus lebih dahulu dilakukan; “engkau” mempertahankan sapaan orang kedua tunggal.
- source_word: אָז יֹאכַל בּוֹ
  choice: barulah ia boleh memakannya
  rationale: אָז menandai akibat sesudah prasyarat dipenuhi dan dipertegas secara alami dengan “barulah”; bentuk imperfek dipahami sebagai izin untuk ikut makan, bukan sekadar peristiwa masa depan.
theological_decisions:
- issue: Istilah bagi orang yang dibeli dalam konteks hukum perjanjian
  choice: budak
  alternative: hamba; pelayan
  rationale: Penyebutan pembelian dengan uang membuat status perbudakan dan kepemilikan menonjol. “Budak” mempertahankan kenyataan sosial teks dan tidak memperhalusnya menjadi hubungan pelayanan biasa.
- issue: Cara menyatakan אִישׁ sebagai pemilik
  choice: milik seseorang
  alternative: milik seorang laki-laki; milik tuannya
  rationale: Dalam konstruksi ini אִישׁ mengidentifikasi seorang pemilik individual. “Seseorang” alami sebagai subjek hukum representatif dalam bahasa Indonesia; menyebut “laki-laki” akan memberi penekanan gender yang tidak diperlukan oleh fungsi frasa, sedangkan “tuannya” menambahkan istilah yang tidak eksplisit.
- issue: Hubungan sunat dengan keikutsertaan dalam perjamuan Paskah
  choice: sunat dinyatakan sebagai prasyarat sebelum ia boleh makan
  alternative: urutan tindakan tanpa penegasan izin
  rationale: Rangkaian וּמַלְתָּה ... אָז יֹאכַל menunjukkan bahwa penyunatan mendahului dan memungkinkan keikutsertaan. Terjemahan tidak memperluasnya menjadi pernyataan doktrinal di luar aturan khusus ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Budak” dipilih demi ketepatan historis; “engkau” mempertahankan sapaan hukum orang kedua tunggal. Tanda pisah menandai peralihan dari identifikasi budak kepada syarat keikutsertaannya.
