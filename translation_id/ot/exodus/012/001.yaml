  text: TUHAN berfirman kepada Musa dan Harun di tanah Mesir,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berfirman
  rationale: Dalam konteks ujaran ilahi, 'berfirman' merupakan padanan Indonesia yang alami dan bermartabat; waw konsekutif diteruskan melalui alur naratif tanpa menambahkan kata penghubung yang kaku.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia untuk nama perjanjian YHWH dengan bentuk kapital TUHAN.
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: kepada Musa dan Harun
  rationale: Preposisi kedua tidak perlu diulang dalam bahasa Indonesia karena cakupannya jelas dan bentuk ini lebih alami.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: di tanah Mesir
  rationale: Mempertahankan unsur אֶרֶץ secara eksplisit sekaligus memakai ungkapan Indonesia yang wajar.
- source_word: לֵאמֹר
  choice: '[diwujudkan dengan tanda koma]'
  rationale: Infinitif pengantar kutipan langsung ini paling alami dinyatakan dengan tanda baca karena isi firman berlanjut pada ayat berikutnya; menerjemahkannya sebagai 'demikian' akan terasa kaku.
