  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/כִֽי יָג֨וּר אִתְּ/ךָ֜ גֵּ֗ר וְ/עָ֣שָׂה פֶסַח֮ לַ/יהוָה֒ הִמּ֧וֹל ל֣/וֹ כָל זָכָ֗ר וְ/אָז֙ יִקְרַ֣ב לַ/עֲשֹׂת֔/וֹ וְ/הָיָ֖ה כְּ/אֶזְרַ֣ח הָ/אָ֑רֶץ וְ/כָל עָרֵ֖ל לֹֽא יֹ֥אכַל בּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/048.yaml
  text: If a sojourner resides with you and keeps the Passover to Yahweh[a], every male belonging to him must be circumcised; then he may come near to keep it, and he shall be like a native of the land[c][b]. But no uncircumcised person may eat of it.
translation:
  language: id
  text: Jika seorang pendatang menetap di tengah-tengahmu dan hendak merayakan Paskah bagi Yahweh, setiap laki-laki yang termasuk dalam rumah tangganya harus disunat. Sesudah itu, ia boleh mendekat untuk merayakannya dan akan menjadi seperti penduduk asli negeri itu. Namun, setiap laki-laki yang tidak bersunat tidak boleh memakannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak boleh makan darinya,” yaitu tidak boleh turut makan dalam perjamuan Paskah.
    reason: clarification
lexical_decisions:
- source_word: גֵּר
  choice: pendatang
  rationale: Menunjuk kepada orang bukan pribumi yang menetap di tengah Israel, bukan sekadar pelancong. 'Pendatang' alami dalam bahasa Indonesia modern, sementara unsur menetap dinyatakan oleh verba berikutnya.
- source_word: יָגוּר אִתְּךָ
  choice: menetap di tengah-tengahmu
  rationale: גור menyatakan tinggal sebagai orang asing atau pendatang. Ungkapan ini mempertahankan gagasan hidup di dalam komunitas Israel, bukan sekadar tinggal bersama satu individu.
- source_word: וְעָשָׂה פֶסַח
  choice: hendak merayakan Paskah
  rationale: Secara harfiah berarti 'melakukan/mengadakan Paskah'. Dalam konstruksi bersyarat ini, 'hendak merayakan' menyampaikan maksud untuk menjalankan perayaan tanpa menyatakan bahwa hal itu sudah dilakukan sebelum syarat sunat dipenuhi.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menandai peruntukan ibadah tersebut, dan nama ilahi יהוה ditransliterasikan sebagai 'Yahweh'.
- source_word: הִמּוֹל לוֹ כָל זָכָר
  choice: setiap laki-laki yang termasuk dalam rumah tangganya harus disunat
  rationale: Konstruksi ini menyatakan tuntutan agar semua laki-laki yang menjadi tanggungannya disunat. 'Rumah tangganya' memperjelas cakupan sosial לוֹ tanpa membatasinya pada keturunan biologis.
- source_word: וְאָז יִקְרַב לַעֲשֹׂתוֹ
  choice: Sesudah itu, ia boleh mendekat untuk merayakannya
  rationale: קרב mempertahankan citra mendekat untuk ikut serta dalam ritus, sedangkan 'boleh' menyampaikan izin yang berlaku setelah persyaratan dipenuhi.
- source_word: כְּאֶזְרַח הָאָרֶץ
  choice: seperti penduduk asli negeri itu
  rationale: אֶזְרַח menunjuk anggota pribumi atau kelahiran negeri tersebut. Pilihan ini mempertahankan perbandingan status dalam konteks hukum.
- source_word: וְכָל עָרֵל לֹא יֹאכַל בּוֹ
  choice: Namun, setiap laki-laki yang tidak bersunat tidak boleh memakannya
  rationale: עָרֵל berbentuk maskulin dan konteks langsung membahas kewajiban sunat bagi laki-laki. Larangan makan menyatakan ketidaklayakan ikut dalam perjamuan Paskah.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung; transliterasi 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Kelayakan pendatang untuk mengikuti Paskah
  choice: Pendatang dapat ikut setelah semua laki-laki dalam rumah tangganya disunat, lalu diperlakukan seperti penduduk asli dalam konteks ini.
  alternative: Memahami ayat sebagai penolakan etnis mutlak atau sebagai penghapusan semua batas perjanjian.
  rationale: Ayat memadukan penerimaan pendatang dengan syarat sunat. Terjemahan mempertahankan ketegangan tersebut tanpa memasukkan kesimpulan teologis dari masa kemudian.
- issue: Cakupan עָרֵל
  choice: laki-laki yang tidak bersunat
  alternative: orang yang tidak bersunat
  rationale: Bentuk Ibrani maskulin tunggal berfungsi secara umum, tetapi konteks biologis dan ritual sunat secara khusus menyangkut laki-laki. Pilihan eksplisit ini menghindari kesan bahwa perempuan juga diwajibkan disunat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk tunggal '-mu' dipertahankan karena teks Ibrani menyapa satu orang sebagai wakil umat. 'Paskah' digunakan sebagai istilah mapan untuk פֶסַח; 'merayakan' dipilih sebagai idiom Indonesia bagi pelaksanaan ritus tersebut.
