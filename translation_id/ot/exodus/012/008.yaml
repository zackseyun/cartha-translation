  text: They shall eat the meat that night[a], roasted over the fire[b]; with unleavened bread and bitter herbs they shall eat it.
translation:
  language: id
  text: Malam itu mereka harus memakan daging itu[a], yang dipanggang di atas api[b]; mereka harus memakannya dengan roti tidak beragi dan sayur pahit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “pada malam ini.” Frasa Ibraninya secara harfiah berarti “pada malam ini,” dan menunjuk pada malam khusus perjamuan Paskah yang sedang ditetapkan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “panggang dengan api” atau “hasil panggangan api.” Frasa ini menegaskan bahwa daging itu harus dipanggang dengan api, bukan dimasak dengan cara lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכְלוּ
  choice: mereka harus memakan
  rationale: Bentuk perfektum Qal dengan waw dalam konteks petunjuk ritual menyatakan kewajiban. Ungkapan 'harus memakan' menyampaikan daya perintah secara alami dalam bahasa Indonesia modern.
- source_word: הַבָּשָׂר
  choice: dagingnya
  rationale: Dalam konteks makanan, בָּשָׂר secara alami berarti 'daging'. Akhiran '-nya' memperjelas bahwa yang dimaksud ialah daging hewan Paskah yang telah disebutkan.
- source_word: בַּלַּיְלָה הַזֶּה
  choice: Malam itu
  rationale: Frasa Ibrani secara harfiah berarti 'pada malam ini/itu' dan menunjuk kepada malam khusus yang sedang ditetapkan. 'Malam itu' alami dalam petunjuk naratif bahasa Indonesia.
- source_word: צְלִי אֵשׁ
  choice: yang dipanggang dengan api
  rationale: Frasa konstruksi ini menunjukkan daging yang dimasak melalui pemanggangan dengan api, berlawanan dengan direbus dalam ayat berikutnya.
- source_word: וּמַצּוֹת
  choice: bersama roti tidak beragi
  rationale: מַצּוֹת merujuk pada roti yang dibuat tanpa ragi. 'Roti tidak beragi' merupakan padanan yang jelas dan lazim.
- source_word: עַל
  choice: bersama
  rationale: Walaupun arti dasarnya dapat berupa 'di atas', dalam konteks hidangan kata ini menyatakan penyertaan makanan.
- source_word: מְרֹרִים
  choice: sayur pahit
  rationale: Bentuk jamak ini secara harfiah menunjuk pada bahan makanan yang pahit; dalam konteks perjamuan Paskah, 'sayur pahit' adalah ungkapan Indonesia yang alami tanpa menentukan jenis tumbuhannya.
- source_word: יֹאכְלֻהוּ
  choice: mereka harus memakannya
  rationale: Bentuk imperfek dengan sufiks objek mengulangi dan menegaskan ketentuan makan serta merujuk kembali kepada daging itu. Pengulangan dipertahankan mengikuti penekanan teks Ibrani.
