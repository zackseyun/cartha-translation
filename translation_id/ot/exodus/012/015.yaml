source:
  edition: WLC
  text: שִׁבְעַ֤ת יָמִים֙ מַצּ֣וֹת תֹּאכֵ֔לוּ אַ֚ךְ בַּ/יּ֣וֹם הָ/רִאשׁ֔וֹן תַּשְׁבִּ֥יתוּ שְּׂאֹ֖ר מִ/בָּתֵּי/כֶ֑ם כִּ֣י כָּל אֹכֵ֣ל חָמֵ֗ץ וְ/נִכְרְתָ֞ה הַ/נֶּ֤פֶשׁ הַ/הִוא֙ מִ/יִּשְׂרָאֵ֔ל מִ/יּ֥וֹם הָ/רִאשֹׁ֖ן עַד י֥וֹם הַ/שְּׁבִעִֽי׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/015.yaml
  text: For seven days you shall eat unleavened bread[a]. But on the first day you shall remove leaven from your houses, for whoever eats anything leavened, that person shall be cut off from Israel[b], from the first day to the seventh day.
translation:
  language: id
  text: Selama tujuh hari kamu harus makan roti tidak beragi. Namun, pada hari pertama kamu harus menyingkirkan ragi[a] dari rumah-rumahmu, sebab setiap orang yang memakan apa pun yang beragi akan diputuskan dari Israel[b], dari hari pertama sampai hari ketujuh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menyebabkan ragi tidak ada lagi.” Dapat juga diterjemahkan “membuangkan” atau “memusnahkan ragi dari rumah-rumahmu.”
    reason: lexical_alternative
  - marker: b
    text: “Akan diputuskan” adalah ungkapan hukum dalam bahasa Ibrani. Ungkapan ini dapat merujuk pada pengusiran dari komunitas, kematian, atau penghukuman ilahi; ayat ini sendiri tidak menyebutkan cara persisnya.
    reason: alternative_reading
lexical_decisions:
- source_word: מַצּוֹת
  choice: roti tidak beragi
  rationale: Istilah ini menunjuk pada roti yang dibuat tanpa bahan pengembang; ungkapan ini jelas, alami, dan sesuai dengan konteks ritual Paskah.
- source_word: אַךְ
  choice: Namun
  rationale: Partikel ini menandai peralihan yang membatasi atau menegaskan, dari perintah umum kepada kewajiban khusus pada hari pertama.
- source_word: תַּשְׁבִּיתוּ
  choice: kamu harus menyingkirkan
  rationale: Bentuk Hifil dari שׁבת secara harfiah berarti menyebabkan berhenti atau lenyap; dalam konteks ini tindakan praktisnya ialah menyingkirkan ragi dari rumah.
- source_word: שְּׂאֹר
  choice: ragi
  rationale: Kata ini menunjuk pada bahan fermentasi atau pengembang. 'Ragi' merupakan padanan Indonesia yang ringkas dan mudah dipahami, termasuk dalam konteks larangan ritual.
- source_word: חָמֵץ
  choice: apa pun yang beragi
  rationale: Cakupannya ialah sesuatu yang telah beragi, tidak harus terbatas pada roti; pilihan ini mempertahankan keluasan makna tersebut.
- source_word: וְנִכְרְתָה
  choice: harus dilenyapkan
  rationale: Kata kerja pasif ini merupakan ungkapan hukum-perjanjian tentang seseorang yang 'diputuskan' dari umat. 'Dilenyapkan dari Israel' mempertahankan bobot sanksinya tanpa menentukan mekanismenya.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: setiap orang
  rationale: Dalam rumusan hukum, נֶפֶשׁ mengacu pada pribadi atau individu, bukan secara khusus pada 'jiwa' sebagai unsur antropologis.
- source_word: מִיִּשְׂרָאֵל
  choice: dari Israel
  rationale: Frasa ini mempertahankan bentuk ringkas teks Ibrani dan menunjuk pada keterputusan dari umat perjanjian.
- source_word: מִיּוֹם הָרִאשֹׁן עַד יוֹם הַשְּׁבִעִי
  choice: dari hari pertama sampai hari ketujuh
  rationale: Frasa waktu ini ditempatkan mengikuti urutan Ibrani dan paling wajar menerangkan masa berlakunya sanksi terhadap pemakanan makanan beragi.
theological_decisions:
- issue: Makna sanksi וְנִכְרְתָה ('dilenyapkan/diputuskan')
  choice: Memakai ungkapan 'harus dilenyapkan dari Israel' tanpa menentukan cara pelaksanaan sanksi.
  alternative: Dikeluarkan dari komunitas; dihukum mati; atau disingkirkan melalui penghukuman ilahi.
  rationale: Teks menyatakan sanksi perjanjian dengan tegas, tetapi tidak menjelaskan apakah yang dimaksud ialah pengusiran, kematian, atau tindakan penghakiman ilahi. Terjemahan dan catatan mempertahankan ketegangan itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-ritual yang khidmat tetapi tetap mudah dipahami. Bentuk jamak orang kedua diterjemahkan dengan 'kamu' secara kolektif; 'rumah-rumahmu' mempertahankan bentuk jamak sumber. Penanda catatan kaki [a] dan [b] dicantumkan pada bagian teks yang relevan.
