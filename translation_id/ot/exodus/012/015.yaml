  naturalness: Bahasa Indonesia baku dan mengalir. “Diputuskan dari Israel” sedikit lebih formal daripada “dilenyapkan,” tetapi sesuai dengan register hukum-ritual dan dapat dijelaskan dengan catatan kaki.
  terminology: “Roti tidak beragi,” “ragi,” dan “apa pun yang beragi” merupakan padanan yang jelas dan setia. “Diputuskan dari Israel” mempertahankan ambiguitas idiom Ibrani כרת lebih baik daripada “dilenyapkan.”
