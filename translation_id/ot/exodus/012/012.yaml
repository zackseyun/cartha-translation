  text: וְ/עָבַרְתִּ֣י בְ/אֶֽרֶץ מִצְרַיִם֮ בַּ/לַּ֣יְלָה הַ/זֶּה֒ וְ/הִכֵּיתִ֤י כָל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם מֵ/אָדָ֖ם וְ/עַד בְּהֵמָ֑ה וּ/בְ/כָל אֱלֹהֵ֥י מִצְרַ֛יִם אֶֽעֱשֶׂ֥ה שְׁפָטִ֖ים אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/012.yaml
  text: For I will pass through the land of Egypt on this night[a], and I will strike every firstborn in the land of Egypt, from man to beast; and against all the gods of Egypt I will execute judgments[c][b]. I am Yahweh.
translation:
  language: id
  text: Sebab Aku akan melintasi tanah Mesir pada malam ini[a] dan akan memukul setiap anak sulung di tanah Mesir, dari manusia sampai hewan[b]. Aku akan menjatuhkan hukuman atas semua dewa Mesir. Akulah Yahweh.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku akan melalui.” Kata kerja ini berarti bergerak melintasi tanah Mesir, bukan “melewati” dalam arti menyelamatkan atau tidak menghukum.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dari manusia sampai hewan.”'
    reason: lexical_alternative
  - marker: c
    text: 'Ibrani: YHWH, nama ilahi yang secara tradisional diterjemahkan “TUHAN”; bentuk alternatifnya “Yahweh.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַרְתִּי
  choice: Aku akan melintasi
  rationale: Dengan בְאֶרֶץ, verba עבר menyatakan bergerak melintasi wilayah Mesir, bukan ‘melewati’ dalam arti tidak menghukum atau menyayangkan.
- source_word: בְאֶרֶץ מִצְרַיִם
  choice: tanah Mesir
  rationale: Mempertahankan unsur אֶרֶץ dan cakupan geografis tindakan tersebut dalam ungkapan Indonesia yang alami.
- source_word: בַּלַּיְלָה הַזֶּה
  choice: pada malam ini
  rationale: Ungkapan waktu yang alami sekaligus mempertahankan penegasan demonstratif ‘ini’.
- source_word: וְהִכֵּיתִי
  choice: membunuh
  rationale: נכה secara harfiah berarti menyerang atau memukul, tetapi dalam konteks tulah anak sulung tindakan itu berakibat kematian; ‘membunuh’ menyampaikan maksud kontekstual secara jelas dalam bahasa Indonesia.
- source_word: כָּל בְּכוֹר
  choice: setiap anak sulung
  rationale: Mewakili konstruksi kolektif tunggal tanpa menambahkan ‘laki-laki’, yang tidak dinyatakan secara eksplisit dalam ayat ini.
- source_word: מֵאָדָם וְעַד בְּהֵמָה
  choice: dari manusia sampai hewan
  rationale: Mempertahankan bentuk merisme Ibrani yang mencakup manusia dan hewan, dengan istilah Indonesia modern dan wajar.
- source_word: וּבְכָל אֱלֹהֵי מִצְרַיִם
  choice: terhadap semua dewa Mesir
  rationale: Preposisi dan idiom berikutnya menunjukkan tindakan penghukuman yang diarahkan kepada dewa-dewa Mesir; ‘dewa’ mempertahankan makna langsung אֱלֹהִים tanpa menafsirkannya sebagai berhala atau penguasa.
- source_word: אֶעֱשֶׂה שְׁפָטִים
  choice: Aku akan menjatuhkan hukuman
  rationale: Mengungkapkan daya yudisial idiom tersebut dengan bahasa Indonesia yang alami dan berbobot; bentuk jamak Ibrani berfungsi sebagai ungkapan tindakan-tindakan penghakiman.
- source_word: אֲנִי יְהוָה
  choice: Akulah Yahweh
  rationale: Bentuk ‘Akulah’ mempertahankan penegasan identitas, sedangkan ‘Yahweh’ menghadirkan nama perjanjian yang tertulis dalam teks Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama pribadi ilahi, sedangkan tradisi ‘TUHAN’ dicatat dalam catatan kaki.
- issue: Status אֱלֹהֵי מִצְרַיִם
  choice: semua dewa Mesir
  alternative: semua berhala Mesir; semua penguasa Mesir
  rationale: Teks secara langsung menyebut dewa-dewa Mesir. Terjemahan tidak mereduksinya menjadi berhala material atau penguasa manusia dan membiarkan ketegangan teologis teks tetap ada.
- issue: Daya tindakan וְהִכֵּיתִי terhadap anak sulung
  choice: membunuh
  alternative: memukul; menghantam; memukul mati
  rationale: Walaupun verba dasarnya berarti memukul atau menyerang, konteks tulah anak sulung menunjukkan kematian. Pilihan ini menjelaskan akibat yang dimaksud tanpa menambahkan pembatasan yang tidak ada dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan langsung. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia. Struktur klausa mengikuti urutan Ibrani sejauh tetap alami; ‘dari manusia sampai hewan’ sengaja dipertahankan agar cakupan merisme sumber terlihat.
