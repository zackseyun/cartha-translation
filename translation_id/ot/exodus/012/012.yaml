    issue: ‘membunuh’ menerjemahkan וְהִכֵּיתִי terlalu spesifik.
    rationale: Verba נכה menyatakan memukul atau menyerang. Kematian merupakan akibat yang jelas dari konteks tulah, tetapi tidak dieksplisitkan oleh verba pada ayat ini; ‘memukul’ lebih setia pada bentuk sumber.
  - severity: low
    issue: Catatan kaki a memakai frasa ‘melewati seluruh’.
