  to: Mereka memanggang adonan yang telah mereka bawa keluar dari Mesir menjadi roti bundar tidak beragi. Adonan itu belum beragi karena mereka telah diusir dari Mesir dan tidak dapat berlambat-lambat; mereka juga tidak menyiapkan bekal untuk diri mereka sendiri.
  rationale: Revisi terbatas pada penghapusan 'belum' dalam klausa terakhir agar tidak menambahkan aspek temporal yang tidak eksplisit dalam teks sumber, serta pada penggantian 'bagi' dengan 'untuk' demi kelancaran bahasa Indonesia. Struktur, istilah utama, dan hubungan kausal draf dipertahankan.
