  source_fidelity: 'Terjemahan pada dasarnya setia kepada urutan dan hubungan sebab-akibat teks Ibrani: adonan itu dipanggang menjadi roti tidak beragi sebab belum beragi; mereka diusir, tidak dapat menunda, dan tidak menyiapkan bekal. Namun, ''belum menyiapkan'' menambahkan nuansa temporal ''not yet'' yang tidak dinyatakan secara eksplisit oleh bentuk perfektif Ibrani.'
  naturalness: Bahasanya baku dan jelas. 'Untuk diri mereka sendiri' lebih lazim daripada 'bagi diri mereka sendiri' dalam konteks menyiapkan bekal.
  terminology: '''Adonan'', ''roti bundar tidak beragi'', ''diusir'', dan ''bekal'' merupakan padanan yang baik. ''Roti bundar'' secara wajar mencerminkan עֻגֹת tanpa menyiratkan kue manis.'
  issues:
