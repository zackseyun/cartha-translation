  text: וַ/יֹּאפ֨וּ אֶת הַ/בָּצֵ֜ק אֲשֶׁ֨ר הוֹצִ֧יאוּ מִ/מִּצְרַ֛יִם עֻגֹ֥ת מַצּ֖וֹת כִּ֣י לֹ֣א חָמֵ֑ץ כִּֽי גֹרְשׁ֣וּ מִ/מִּצְרַ֗יִם וְ/לֹ֤א יָֽכְלוּ֙ לְ/הִתְמַהְמֵ֔הַּ וְ/גַם צֵדָ֖ה לֹא עָשׂ֥וּ לָ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/039.yaml
  text: 'They baked the dough they had brought out of Egypt into unleavened cakes, since it had not become leavened: they had been driven out of Egypt and could not delay, and had not prepared provisions for themselves.'
translation:
  language: id
  text: Mereka memanggang adonan yang telah mereka bawa keluar dari Mesir menjadi roti bundar tidak beragi. Adonan itu belum beragi karena mereka telah diusir dari Mesir dan tidak dapat berlambat-lambat; mereka juga tidak menyiapkan bekal untuk diri mereka sendiri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאפוּ
  choice: Mereka memanggang
  rationale: Bentuk naratif ini menyatakan tindakan berikutnya; dalam ayat mandiri, penghubung awal tidak perlu dinyatakan agar bahasa Indonesia alami.
- source_word: הַבָּצֵק
  choice: adonan
  rationale: בצק menunjuk pada adonan, dan padanan ini jelas serta lazim dalam bahasa Indonesia modern.
- source_word: אֲשֶׁר הוֹצִיאוּ מִמִּצְרַיִם
  choice: yang telah mereka bawa keluar dari Mesir
  rationale: Klausa relatif ini menerangkan adonan; bentuk lampau dengan 'telah' memperjelas bahwa adonan itu dibawa sebelum dipanggang.
- source_word: עֻגֹת מַצּוֹת
  choice: roti bundar tidak beragi
  rationale: עֻגֹת merujuk pada roti atau kue roti berbentuk bundar, sedangkan מַצּוֹת menyatakan bahwa roti itu tidak beragi. 'Roti bundar' menghindari kesan kue manis.
- source_word: כִּי לֹא חָמֵץ
  choice: Adonan itu belum beragi
  rationale: חָמֵץ di sini adalah verba yang menyatakan adonan menjadi beragi; 'belum beragi' mempertahankan keadaan yang belum terjadi tanpa menyamakannya semata-mata dengan proses mengembang.
- source_word: כִּי גֹרְשׁוּ מִמִּצְרַיִם
  choice: karena mereka telah diusir dari Mesir
  rationale: Bentuk pasif ini menyatakan pengusiran secara paksa, bukan keberangkatan sukarela.
- source_word: וְלֹא יָכְלוּ לְהִתְמַהְמֵהַּ
  choice: dan tidak dapat berlambat-lambat
  rationale: התמהמה berarti menunda atau tinggal lebih lama; ungkapan ini alami dan mempertahankan desakan keadaan.
- source_word: וְגַם צֵדָה לֹא עָשׂוּ לָהֶם
  choice: mereka juga belum menyiapkan bekal bagi diri mereka sendiri
  rationale: צֵדָה adalah bekal atau persediaan untuk perjalanan. 'Juga' mempertahankan unsur tambahan, dan לָהֶם diterjemahkan langsung sebagai 'bagi diri mereka sendiri'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dibagi menjadi dua kalimat agar rangkaian sebab tetap jelas. Istilah 'roti bundar tidak beragi' dipilih untuk menyampaikan bentuk עֻגֹת tanpa menimbulkan kesan makanan penutup.
