source:
  edition: WLC
  text: וְ/הָיָ֤ה לָ/כֶם֙ לְ/מִשְׁמֶ֔רֶת עַ֣ד אַרְבָּעָ֥ה עָשָׂ֛ר י֖וֹם לַ/חֹ֣דֶשׁ הַ/זֶּ֑ה וְ/שָׁחֲט֣וּ אֹת֗/וֹ כֹּ֛ל קְהַ֥ל עֲדַֽת יִשְׂרָאֵ֖ל בֵּ֥ין הָ/עַרְבָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/006.yaml
  text: And it shall be kept by you until the fourteenth day of this month[a], and the whole assembly of the congregation of Israel shall slaughter it between the evenings.
translation:
  language: id
  text: Hewan itu harus kamu pelihara sampai hari keempat belas bulan ini. Lalu seluruh perhimpunan umat Israel harus menyembelihnya pada waktu senja.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di antara dua petang,” sebuah ungkapan Ibrani yang biasanya dipahami sebagai waktu sekitar matahari terbenam atau senja.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה לָכֶם לְמִשְׁמֶרֶת
  choice: Hewan itu harus kamu pelihara
  rationale: Gabungan ini secara harfiah menyatakan bahwa hewan tersebut harus berada dalam penjagaan mereka. Bentuk aktif dengan subjek jamak 'kamu' alami dalam bahasa Indonesia dan mempertahankan tanggung jawab umat untuk memeliharanya.
- source_word: עַד אַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ הַזֶּה
  choice: sampai hari keempat belas bulan ini
  rationale: Ungkapan tanggal Ibrani diterjemahkan dengan bentuk baku dan jelas dalam bahasa Indonesia.
- source_word: וְשָׁחֲטוּ אֹתוֹ
  choice: harus menyembelihnya
  rationale: Kata שׁחט secara khusus menunjuk pada penyembelihan hewan, bukan sekadar tindakan membunuh.
- source_word: כֹּל קְהַל עֲדַת יִשְׂרָאֵל
  choice: seluruh perhimpunan umat Israel
  rationale: Terjemahan ini mempertahankan unsur kolektif ganda קהל dan עדה tanpa menghasilkan frasa Indonesia yang terlalu kaku. 'Perhimpunan umat' menegaskan bahwa Israel bertindak sebagai satu kesatuan.
- source_word: בֵּין הָעַרְבָּיִם
  choice: pada waktu senja
  rationale: Idiom ini secara harfiah berarti 'di antara dua petang' dan menunjuk pada rentang waktu sekitar matahari terbenam. 'Pada waktu senja' jelas dan alami, sedangkan bentuk harfiahnya dicatat dalam catatan kaki untuk menjaga ambiguitas leksikal.
theological_decisions:
- issue: Subjek kolektif dalam perintah penyembelihan
  choice: seluruh perhimpunan umat Israel harus menyembelihnya
  alternative: setiap keluarga harus menyembelih hewannya sendiri
  rationale: Teks Ibrani menyebut Israel secara kolektif sebagai pelaku. Walaupun konteks sekitar menunjukkan pelaksanaan menurut keluarga, terjemahan tidak menguraikan subjek kolektif itu menjadi tindakan masing-masing keluarga.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Hewan itu' memperjelas acuan pronomina kepada anak domba atau kambing yang dipilih dalam konteks sebelumnya. Bentuk jamak 'kamu' dipahami dari konteks sebagai sapaan kepada umat. Penanda catatan kaki ditempatkan langsung sesudah frasa yang dijelaskannya.
