  yaml_path: translation/ot/exodus/012/028.yaml
  text: Then the sons of Israel went and did so; just as Yahweh had commanded Moses and Aaron[a], so they did.
translation:
  language: id
  text: Lalu orang Israel[a] pergi dan melakukannya; tepat seperti yang Yahweh perintahkan kepada Musa dan Harun, demikianlah mereka melakukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Israel”; atau, “keturunan Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: pergi
  rationale: Bentuk wayyiqtol dari הלך melanjutkan alur narasi. “Pergi” menerjemahkan verba itu secara langsung tanpa menambahkan tujuan yang hanya tersirat dari konteks.
- source_word: וַיַּעֲשׂוּ
  choice: melakukannya
  rationale: Verba עשה mengacu kembali pada petunjuk Paskah yang telah diberikan. Akhiran “-nya” menyampaikan rujukan balik tersebut secara wajar dalam bahasa Indonesia tanpa merinci objek yang tidak disebutkan di sini.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Ungkapan harfiahnya ialah “anak-anak lelaki Israel,” tetapi dalam konteks ini menunjuk kepada umat yang berasal dari Israel. “Keturunan Israel” mempertahankan hubungan genealogis ungkapan Ibrani tanpa memberi kesan bahwa yang dimaksud hanya laki-laki.
- source_word: כַּאֲשֶׁר
  choice: tepat seperti
  rationale: Ungkapan ini menyatakan kesesuaian tindakan mereka dengan perintah. “Tepat seperti” menampilkan penekanan tersebut dengan jelas.
- source_word: צִוָּה
  choice: yang diperintahkan
  rationale: Bentuk perfektum menyatakan perintah yang sudah diberikan sebelum tindakan Israel. Konstruksi relatif ini alami dalam bahasa Indonesia dan tidak perlu menandai aspek lampau secara berlebihan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh,” bukan diganti dengan sebuah gelar.
- source_word: אֶת מֹשֶׁה וְאַהֲרֹן
  choice: kepada Musa dan Harun
  rationale: Penanda objek אֶת menempatkan Musa dan Harun sebagai orang yang diperintah Yahweh. Dalam bahasa Indonesia, verba “memerintahkan” secara alami memakai “kepada” untuk penerima perintah.
- source_word: כֵּן עָשׂוּ
  choice: demikianlah mereka melakukannya
  rationale: Klausa penutup ini mengulangi dan menegaskan ketaatan Israel. “Demikianlah” mempertahankan daya resumptif dan penekanannya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama pribadi perjanjian יהוה. Bentuk “Yahweh” mempertahankannya sebagai nama dan tidak menggantinya dengan gelar.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak lelaki Israel; orang Israel
  rationale: Secara bentuk, frasa ini maskulin dan bersifat kekeluargaan, tetapi secara idiomatis menunjuk kepada komunitas Israel. “Keturunan Israel” menjaga unsur asal-usul tanpa mempersempit acuannya hanya kepada laki-laki.
- issue: Pengulangan pernyataan ketaatan
  choice: mempertahankan kedua klausa tindakan
  alternative: meringkasnya menjadi satu pernyataan
  rationale: Teks Ibrani mula-mula menyatakan bahwa Israel bertindak, lalu menegaskan bahwa tindakan itu tepat sesuai perintah. Pengulangan ini bermakna retoris dan tidak dihapus.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan kalimat mempertahankan gerak naratif serta pengulangan penegas dalam bahasa Ibrani, sambil memakai bentuk yang tetap mudah dipahami pembaca umum.
