translation:
  language: id
  text: Jangan biarkan sedikit pun darinya tersisa sampai pagi. Apa pun yang masih tersisa sampai pagi harus kamu bakar dengan api.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תוֹתִירוּ
  choice: tinggalkan
  rationale: Bentuk Hifil dari יתר di sini berarti membiarkan sesuatu tersisa. Dalam larangan ini, “jangan tinggalkan” merupakan ungkapan Indonesia yang alami dan tepat.
- source_word: מִמֶּנּוּ
  choice: sedikit pun darinya
  rationale: מן dengan sufiks pronominal berarti “darinya”; dalam klausa negatif, “sedikit pun” menyatakan secara alami bahwa tidak ada bagian yang boleh tersisa.
- source_word: עַד בֹּקֶר
  choice: sampai pagi
  rationale: Frasa ini menetapkan batas waktu dan paling alami diterjemahkan “sampai pagi” tanpa menambahkan rincian yang tidak ada dalam teks.
- source_word: הַנֹּתָר
  choice: apa yang tersisa
  rationale: Partisipel Nifal dari יתר menunjuk pada bagian yang masih tertinggal; “apa yang tersisa” jelas dan mempertahankan bentuk substantivalnya.
- source_word: בָּאֵשׁ
  choice: dengan api
  rationale: Preposisi ב menandai sarana pembakaran. “Dengan api” dekat dengan bentuk sumber dan dapat dipahami dengan jelas dalam bahasa Indonesia.
- source_word: תִּשְׂרֹפוּ
  choice: harus kamu bakar
  rationale: Bentuk imperfek dalam konteks petunjuk hukum ini memiliki daya perintah. “Harus kamu bakar” menyampaikan kewajiban secara jelas dan bermartabat.
theological_decisions:
- issue: Sifat perintah mengenai sisa daging Paskah
  choice: Larangan langsung yang diikuti perintah wajib untuk memusnahkan sisanya
  alternative: Petunjuk praktis semata tanpa daya hukum
  rationale: 'Ayat ini memberikan dua petunjuk ritual yang mengikat: tidak membiarkan bagian apa pun sampai pagi dan membakar bagian yang ternyata tersisa. Terjemahan tidak menambahkan makna simbolis yang tidak dinyatakan dalam ayat.'
translation_notes:
  register: Bahasa Indonesia baku, modern, jelas, dan bermartabat. Pergantian dari bentuk jamak Ibrani ke “kamu” dipahami secara kolektif sesuai pemakaian umum dalam petunjuk yang ditujukan kepada umat. Tidak diperlukan catatan kaki karena alternatif leksikal pada lapisan konsultasi Inggris tidak mencerminkan ambiguitas penting yang perlu ditampilkan dalam terjemahan Indonesia.
