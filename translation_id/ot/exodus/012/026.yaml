  text: And when your sons say to you[a], ‘What is this service to you?’
translation:
  language: id
  text: Dan apabila anak-anak lelaki kalian berkata kepada kalian, “Apakah arti ibadah ini bagi kalian?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Apakah ibadah ini bagi kalian?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Dan apabila
  rationale: Formula Ibrani ini memperkenalkan keadaan yang akan terjadi. ‘Dan apabila’ wajar dalam bahasa Indonesia dan tetap mempertahankan nuansa temporal-kontingennya.
- source_word: יֹאמְרוּ אֲלֵיכֶם
  choice: berkata kepada kalian
  rationale: Menerjemahkan verba אמר secara langsung sebagai ‘berkata’, bukan menafsirkannya sebagai ‘bertanya’; bentuk jamak orang kedua dinyatakan dengan ‘kalian’.
- source_word: בְּנֵיכֶם
  choice: anak-anak lelaki kalian
  rationale: בָּנִים berbentuk maskulin jamak dan di sini diterjemahkan secara spesifik, tanpa digeneralisasi menjadi ‘anak-anak’.
- source_word: הָעֲבֹדָה הַזֹּאת
  choice: ibadah ini
  rationale: Dalam konteks Paskah, עֲבֹדָה menunjuk pada pelayanan atau pelaksanaan ibadah yang ditetapkan. ‘Ibadah’ alami bagi pembaca Indonesia, sementara alternatif yang lebih formal dicatat dalam catatan kaki.
- source_word: מָה ... לָכֶם
  choice: Apakah arti ... bagi kalian?
  rationale: Ungkapan harfiah ‘Apa ... bagi kalian?’ dalam konteks ini menanyakan makna atau signifikansi ibadah tersebut. Rumusan ini alami dalam bahasa Indonesia, dengan bentuk lebih formal dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Cakupan pertanyaan anak-anak mengenai עֲבֹדָה
  choice: Tidak menentukan apakah pertanyaan itu bernada ingin tahu, kritis, atau menjauhkan diri
  alternative: Menambahkan nuansa seperti ‘mengapa kalian melakukan upacara ini?’
  rationale: Teks Ibrani hanya menyampaikan pertanyaan mengenai arti atau hubungan ibadah itu bagi komunitas yang disapa; nada dan motivasinya dibiarkan terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Kalian’ digunakan untuk menandai bentuk jamak orang kedua dalam bahasa Ibrani; ‘anak-anak lelaki’ mempertahankan gender gramatikal sumber. Rumusan utama mengutamakan kealamian, sedangkan bentuk pertanyaan yang lebih formal dan dekat dengan susunan Ibrani diberikan dalam catatan kaki.
