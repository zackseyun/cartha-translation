base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/016.yaml
  text: On the first day there shall be a holy assembly for you[a], and on the seventh day a holy assembly. No work shall be done on them[c][b], except what every person must eat—that alone may be prepared for you.
translation:
  language: id
  text: Pada hari pertama harus ada pertemuan kudus bagi kamu sekalian[a], dan pada hari ketujuh harus ada pertemuan kudus. Pekerjaan apa pun tidak boleh dilakukan pada kedua hari itu. Apa yang akan dimakan oleh setiap orang[b], itulah saja yang boleh disiapkan bagi kamu sekalian[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pertemuan suci”; secara tradisional, “perhimpunan kudus.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bagi setiap nefesh.” Dalam konteks ini, nefesh berarti setiap orang, bukan khususnya “jiwa” dalam pengertian modern.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “hanya itulah yang boleh dilakukan bagi kamu sekalian.” Dalam konteks ini, yang dimaksud ialah menyiapkan makanan yang akan dimakan.
    reason: translation_clarity
lexical_decisions:
- source_word: מִקְרָא קֹדֶשׁ
  choice: pertemuan kudus
  rationale: Ungkapan ini menunjuk pada pertemuan sakral yang diserukan atau dihimpunkan. “Pertemuan kudus” jelas dalam bahasa Indonesia modern dan mempertahankan unsur perhimpunan serta kekudusannya.
- source_word: יִהְיֶה לָכֶם
  choice: harus ada ... bagi kalian
  rationale: Pilihan ini mempertahankan bentuk eksistensial היה dan nuansa datif לָכֶם, sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: כָּל מְלָאכָה לֹא יֵעָשֶׂה
  choice: Pekerjaan apa pun tidak boleh dilakukan
  rationale: “Apa pun” menyampaikan cakupan כָּל dalam larangan, sedangkan bentuk pasif mempertahankan Nifal יֵעָשֶׂה tanpa mempersempit jenis pekerjaannya.
- source_word: בָהֶם
  choice: pada kedua hari itu
  rationale: Akhiran jamak mengacu pada hari pertama dan hari ketujuh. Penyebutan eksplisit “kedua hari itu” lebih alami dan tidak ambigu dalam bahasa Indonesia.
- source_word: אַךְ
  choice: hanya
  rationale: Di sini partikel tersebut membatasi larangan dengan menetapkan satu-satunya pengecualian.
- source_word: אֲשֶׁר יֵאָכֵל לְכָל נֶפֶשׁ
  choice: apa yang akan dimakan setiap orang
  rationale: Frasa ini dipertahankan tanpa menambahkan gagasan keharusan yang tidak dinyatakan secara eksplisit. נֶפֶשׁ dalam konteks hukum ini berarti orang, bukan “jiwa” sebagai bagian nonjasmani.
- source_word: הוּא לְבַדּוֹ
  choice: hanya ... yang
  rationale: Konstruksi fokus bahasa Indonesia ini menyampaikan penegasan eksklusif dari pronomina dan לְבַדּוֹ.
- source_word: יֵעָשֶׂה לָכֶם
  choice: boleh disiapkan bagi kalian
  rationale: Dalam konteks pengecualian mengenai makanan, “disiapkan” menyatakan tindakan yang tersirat; “bagi kalian” mempertahankan nilai datif לָכֶם.
