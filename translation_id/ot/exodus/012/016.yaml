  to: Pada hari pertama harus ada pertemuan kudus bagi kamu sekalian[a], dan pada hari ketujuh harus ada pertemuan kudus. Pekerjaan apa pun tidak boleh dilakukan pada kedua hari itu. Apa yang akan dimakan oleh setiap orang[b], itulah saja yang boleh disiapkan bagi kamu sekalian[c].
