translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-keagamaan yang lugas dan bermartabat. “Kalian” dipakai untuk memperjelas bahwa sapaan Ibrani berbentuk jamak; susunan pasif dipertahankan pada larangan kerja.
