revisions:
- from: Katakanlah, ‘Itulah kurban Paskah bagi Yahweh,[a] yang melewati rumah-rumah bani Israel di Mesir ketika Ia menghantam orang Mesir, tetapi menyelamatkan rumah-rumah kita.’ Lalu umat itu berlutut dan sujud menyembah.
  to: Katakanlah, ‘Inilah kurban Paskah[a] bagi Yahweh, yang melewati rumah-rumah bani Israel di Mesir ketika Ia menghantam Mesir dan menyelamatkan rumah-rumah kami.’ Lalu bangsa itu menunduk dan menyembah.
  rationale: Revisi mempertahankan konstruksi “kurban Paskah bagi Yahweh,” hubungan antara Paskah dan “melewati,” serta rujukan komunal “rumah-rumah kami.” Konjungsi tambahan dihapus, “Mesir” dipertahankan sesuai sumber, dan respons umat diterjemahkan dengan dua verba yang lebih setia dan alami. Catatan kaki dipertahankan isinya, tetapi penandanya dipasang pada lokasi yang tepat.
