source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֡ם זֶֽבַח פֶּ֨סַח ה֜וּא לַֽ/יהוָ֗ה אֲשֶׁ֣ר פָּ֠סַח עַל בָּתֵּ֤י בְנֵֽי יִשְׂרָאֵל֙ בְּ/מִצְרַ֔יִם בְּ/נָגְפּ֥/וֹ אֶת מִצְרַ֖יִם וְ/אֶת בָּתֵּ֣י/נוּ הִצִּ֑יל וַ/יִּקֹּ֥ד הָ/עָ֖ם וַ/יִּֽשְׁתַּחֲוּֽוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/027.yaml
  text: you shall say[a], ‘It is the Passover sacrifice to Yahweh[c][b], who passed over the houses of the sons of Israel in Egypt when he struck Egypt and delivered our houses.’ And the people bowed down and worshiped.
translation:
  language: id
  text: Katakanlah, ‘Inilah kurban Paskah[a] bagi Yahweh, yang melewati rumah-rumah bani Israel di Mesir ketika Ia menghantam Mesir dan menyelamatkan rumah-rumah kami.’ Lalu bangsa itu menunduk dan menyembah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “melewati” berasal dari akar yang sama dengan kata “Paskah”; kata itu juga dapat mengandung arti melindungi atau tidak membinasakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶבַח פֶּסַח
  choice: kurban Paskah
  rationale: Ungkapan konstruksi ini menunjuk kepada kurban yang berkaitan dengan Paskah; terjemahan ini alami dalam bahasa Indonesia dan mempertahankan makna ritualnya.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menyatakan peruntukan atau persembahan kepada Yahweh; 'bagi' wajar dalam ungkapan tentang kurban.
- source_word: פָּסַח
  choice: melewati
  rationale: Mempertahankan hubungan bunyi dan makna dengan nama Paskah, sementara catatan kaki menjelaskan kemungkinan nuansa melindungi atau tidak membinasakan.
- source_word: בָּתֵּי בְנֵי יִשְׂרָאֵל
  choice: rumah-rumah bani Israel
  rationale: '''Bani Israel'' merupakan ungkapan Indonesia yang ringkas, dikenal luas, dan mempertahankan idiom kekerabatan Ibrani.'
- source_word: בְּנָגְפּוֹ אֶת מִצְרַיִם
  choice: ketika Ia menghantam orang Mesir
  rationale: Konstruksi temporal בְּ + infinitif diterjemahkan 'ketika'; objek 'Mesir' secara metonimis menunjuk kepada penduduknya dalam konteks penghukuman.
- source_word: הִצִּיל
  choice: menyelamatkan
  rationale: Hifil נצל berarti melepaskan atau menyelamatkan dari bahaya; pilihan ini lebih tepat daripada sekadar 'tidak membinasakan' dan tetap alami dengan objek 'rumah-rumah kita'.
- source_word: וַיִּקֹּד ... וַיִּשְׁתַּחֲווּ
  choice: berlutut dan sujud menyembah
  rationale: Mempertahankan dua tindakan berurutan—merendahkan tubuh lalu bersujud dalam penyembahan—tanpa menghasilkan pengulangan yang janggal.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menyebut nama perjanjian יהוה secara langsung; transliterasi 'Yahweh' menjaga pembedaan nama diri tersebut.
- issue: Makna ganda פָּסַח
  choice: melewati
  alternative: melindungi / tidak membinasakan
  rationale: Terjemahan utama mempertahankan kaitan verbal dengan 'Paskah', sedangkan nuansa perlindungan yang mungkin terkandung dalam kata tersebut dicatat tanpa menutup ambiguitas.
- issue: Ungkapan בְנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: orang Israel / keturunan Israel
  rationale: Pilihan ini mempertahankan citra kekerabatan sumber tanpa menyiratkan bahwa hanya laki-laki yang dimaksud.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kurban' dipilih menurut ejaan baku. Kapitalisasi 'Ia' dipakai sebagai penghormatan kepada Allah. Kontras implisit antara menghantam orang Mesir dan menyelamatkan rumah Israel dibuat alami dengan 'tetapi' tanpa mengubah hubungan makna.
