  source_fidelity: Revisi diperlukan terutama untuk menghilangkan konjungsi pertentangan “tetapi,” yang tidak dinyatakan dalam teks Ibrani (hanya waw koordinatif), serta untuk mempertahankan objek “Mesir” sebagaimana sumber, tanpa menjadikannya secara eksplisit “orang Mesir.” Respons dua tahap pada akhir ayat sebaiknya tidak diterjemahkan sebagai “berlutut,” sebab וַיִּקֹּד berarti membungkuk/menunduk.
  naturalness: Teks revisi memakai bahasa Indonesia baku dan khidmat. “Menunduk dan menyembah” menyampaikan urutan tindakan dengan alami tanpa pengulangan fisik yang kaku.
  terminology: “Kurban Paskah,” “Yahweh,” dan “bani Israel” dapat dipertahankan. Penanda catatan kaki dipindahkan agar melekat pada “Paskah,” yakni unsur yang hubungannya dengan verba “melewati” dijelaskan oleh catatan tersebut.
  issues:
  - severity: medium
    issue: Penambahan “tetapi”
    rationale: Teks Ibrani menghubungkan tindakan menghantam Mesir dan menyelamatkan rumah-rumah Israel dengan waw “dan”; “tetapi” mempertegas pertentangan yang tersirat secara konteks, tetapi tidak dinyatakan secara leksikal.
  - severity: low
    issue: “orang Mesir” menggantikan “Mesir”
    rationale: Mesir dapat dipahami secara metonimis sebagai penduduknya, tetapi mempertahankan “Mesir” lebih dekat kepada objek eksplisit אֶת־מִצְרַיִם dan tidak perlu mempersempit rujukan.
  - severity: medium
    issue: “berlutut” untuk וַיִּקֹּד
    rationale: Verba ini menunjuk pada membungkuk atau menundukkan diri, bukan secara khusus berlutut. Terjemahan revisi juga tetap membedakannya dari tindakan menyembah berikutnya.
  - severity: low
    issue: Letak penanda catatan kaki
    rationale: Catatan menjelaskan hubungan akar kata antara “Paskah” dan “melewati,” bukan nama Yahweh; penanda perlu ditempatkan pada istilah yang dijelaskan.
