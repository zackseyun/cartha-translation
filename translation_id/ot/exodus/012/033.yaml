  text: וַ/תֶּחֱזַ֤ק מִצְרַ֨יִם֙ עַל הָ/עָ֔ם לְ/מַהֵ֖ר לְ/שַׁלְּחָ֣/ם מִן הָ/אָ֑רֶץ כִּ֥י אָמְר֖וּ כֻּלָּ֥/נוּ מֵתִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/033.yaml
  text: And the Egyptians urged the people on[a], hurrying to send them out of the land, for they said, “We are all dead men.”
translation:
  language: id
  text: Orang-orang Mesir mendesak bangsa itu agar segera pergi dari negeri itu, sebab kata mereka, “Kita semua akan mati!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֶּחֱזַק מִצְרַיִם עַל־הָעָם
  choice: Orang-orang Mesir mendesak bangsa itu
  rationale: Bentuk nama tempat מִצְרַיִם berfungsi secara kolektif sebagai penduduk Mesir, sedangkan חזק dengan עַל menyatakan tekanan yang kuat. 'Mendesak' menyampaikan daya paksa itu secara alami dalam bahasa Indonesia.
- source_word: לְמַהֵר לְשַׁלְּחָם
  choice: agar segera pergi
  rationale: Dua infinitif berurutan menonjolkan tujuan yang disertai ketergesaan. Dalam konteks, orang Mesir mendesak bangsa Israel untuk meninggalkan negeri itu; ungkapan ini menyampaikan desakan tersebut secara alami tanpa pengulangan yang kaku.
- source_word: מִן־הָאָרֶץ
  choice: dari negeri itu
  rationale: Frasa Ibrani secara harfiah berarti 'dari negeri itu', yang dalam konteks merujuk kepada Mesir. 'Negeri' sesuai bagi wilayah politik yang dimaksud.
- source_word: כִּי אָמְרוּ
  choice: sebab kata mereka
  rationale: כִּי memperkenalkan alasan bagi desakan orang Mesir. 'Sebab kata mereka' ringkas dan wajar dalam narasi Indonesia.
- source_word: כֻּלָּנוּ מֵתִים
  choice: Kita semua akan mati!
  rationale: Partisip מֵתִים dalam seruan ini menyatakan ancaman kematian yang sedang berlangsung atau segera terjadi, bukan bahwa para penutur secara harfiah sudah mati. Bentuk futur dekat dalam bahasa Indonesia menyampaikan maksud kontekstualnya dengan jelas.
theological_decisions:
- issue: Nuansa waktu dalam מֵתִים
  choice: akan mati
  alternative: sudah mati / sedang sekarat
  rationale: Konteks tulah anak sulung menunjukkan ketakutan bahwa kematian akan melanda semuanya. Terjemahan tidak menjadikan ucapan itu pernyataan bahwa semua orang Mesir telah mati, tetapi mempertahankan seruan akan bahaya kematian yang segera.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Bangsa itu' mempertahankan rujukan kontekstual הָעָם kepada Israel, sedangkan tanda seru mencerminkan kepanikan dalam ucapan langsung.
