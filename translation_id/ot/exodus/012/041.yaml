id: EXO.12.41
reference: Exodus 12:41
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֗י מִ/קֵּץ֙ שְׁלֹשִׁ֣ים שָׁנָ֔ה וְ/אַרְבַּ֥ע מֵא֖וֹת שָׁנָ֑ה וַ/יְהִ֗י בְּ/עֶ֨צֶם֙ הַ/יּ֣וֹם הַ/זֶּ֔ה יָֽצְא֛וּ כָּל צִבְא֥וֹת יְהוָ֖ה מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/041.yaml
  text: And at the end of four hundred and thirty years[a], on that very day, all the hosts of Yahweh went out from the land of Egypt.
translation:
  language: id
  text: Dan setelah genap empat ratus tiga puluh tahun, tepat pada hari itu, seluruh barisan Yahweh[a] keluar dari tanah Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seluruh pasukan Yahweh.” Kata Ibrani yang dipakai dapat berarti barisan atau pasukan yang terorganisasi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ
  choice: setelah genap
  rationale: Ungkapan ini menandai tercapainya akhir suatu jangka waktu. “Setelah genap” alami dalam bahasa Indonesia dan menegaskan bahwa masa 430 tahun itu telah lengkap.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: empat ratus tiga puluh tahun
  rationale: Urutan bilangan disesuaikan dengan tata bahasa Indonesia tanpa mengubah jumlah keseluruhan 430 tahun.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: tepat pada hari itu
  rationale: Idiom Ibrani ini menekankan ketepatan hari yang dimaksud; pilihan ini mempertahankan penekanan tersebut dalam bahasa Indonesia modern.
- source_word: יָצְאוּ
  choice: keluar
  rationale: Kata kerja יָצָא secara langsung menyatakan gerak keluar atau keberangkatan; “keluar” mempertahankan kesederhanaan narasi.
- source_word: כָּל צִבְאוֹת
  choice: seluruh barisan
  rationale: צָבָא dapat menunjuk pasukan, kelompok yang tersusun, atau rombongan terorganisasi. “Seluruh barisan” mempertahankan nuansa keteraturan dan corak kemiliteran tanpa memastikan bahwa mereka sedang bertindak sebagai tentara tempur.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks sumber tetap tampak, bukan diganti dengan gelar.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: dari tanah Mesir
  rationale: Terjemahan ini mempertahankan unsur אֶרֶץ, “tanah/negeri”, sekaligus terdengar wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung. “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan sebuah gelar.
- issue: Nuansa צִבְאוֹת יְהוָה
  choice: seluruh barisan Yahweh
  alternative: seluruh pasukan Yahweh
  rationale: Istilah צִבְאוֹת mempunyai nuansa kelompok yang tersusun dan dapat pula berarti pasukan. “Barisan” menjaga keluasan makna itu tanpa menghilangkan corak kolektif dan kemiliterannya.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan khidmat. Pengulangan formula וַיְהִי tidak ditiru secara kaku; “Dan setelah genap” mempertahankan kesinambungan narasi serta penandaan selesainya jangka waktu, sedangkan “tepat pada hari itu” membawa penekanan formula kedua.
