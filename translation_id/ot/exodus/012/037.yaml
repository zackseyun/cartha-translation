  text: וַ/יִּסְע֧וּ בְנֵֽי יִשְׂרָאֵ֛ל מֵ/רַעְמְסֵ֖ס סֻכֹּ֑תָ/ה כְּ/שֵׁשׁ מֵא֨וֹת אֶ֧לֶף רַגְלִ֛י הַ/גְּבָרִ֖ים לְ/בַ֥ד מִ/טָּֽף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/037.yaml
  text: And the sons of Israel journeyed from Rameses to Succoth[a], about six hundred thousand men on foot[d][c][b], besides children.
translation:
  language: id
  text: Kemudian bani Israel berangkat dari Raamses menuju Sukot. Jumlah laki-laki yang berjalan kaki sekitar enam ratus ribu orang, belum termasuk anak-anak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani טַף dapat menunjuk kepada anak-anak kecil atau anggota keluarga kecil yang menjadi tanggungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: berangkat
  rationale: Dalam konteks perpindahan rombongan, נסע menunjuk pada tindakan meninggalkan tempat dan memulai perjalanan; “berangkat” alami dan tepat dalam bahasa Indonesia.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: Ungkapan ini mempertahankan gambaran kekerabatan harfiah ‘anak-anak/keturunan Israel’ dan sudah dikenal dalam ragam Alkitab bahasa Indonesia tanpa harus berarti hanya anak laki-laki.
- source_word: מֵרַעְמְסֵס
  choice: dari Raamses
  rationale: Preposisi מִן menyatakan titik asal; “Raamses” merupakan bentuk nama tempat yang lazim dalam tradisi Indonesia.
- source_word: סֻכֹּתָה
  choice: menuju Sukot
  rationale: Akhiran ה direktif pada nama tempat menyatakan gerak ke arah tujuan; “menuju” menyampaikan nuansa itu secara alami.
- source_word: כְּשֵׁשׁ מֵאוֹת אֶלֶף
  choice: sekitar enam ratus ribu
  rationale: Prefiks כְּ pada bilangan menunjukkan perkiraan, sehingga “sekitar” menghindari kesan angka yang mutlak tepat.
- source_word: רַגְלִי הַגְּבָרִים
  choice: laki-laki yang berjalan kaki
  rationale: רַגְלִי menunjukkan orang yang bepergian dengan berjalan kaki, sedangkan הַגְּבָרִים secara khusus menunjuk laki-laki; susunan ini jelas dan wajar dalam bahasa Indonesia.
- source_word: לְבַד מִטָּף
  choice: belum termasuk anak-anak
  rationale: Frasa ini mengecualikan טַף dari jumlah tersebut. “Anak-anak” adalah padanan alami, sementara cakupan istilah Ibrani dapat meliputi anak kecil atau tanggungan kecil dan dijelaskan dalam catatan.
