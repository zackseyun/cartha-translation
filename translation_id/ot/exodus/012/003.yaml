revisions:
- from: 'Sampaikanlah kepada seluruh umat Israel: ‘Pada hari kesepuluh bulan ini, hendaklah setiap laki-laki mengambil bagi dirinya seekor anak domba[a] menurut kaum keluarga ayahnya, seekor anak domba untuk setiap rumah tangga.’'
  to: 'Berbicaralah kepada seluruh umat Israel: ‘Pada hari kesepuluh bulan ini, hendaklah setiap laki-laki mengambil bagi dirinya seekor anak domba[a] bagi kaum keluarganya dari pihak ayah, seekor anak domba untuk setiap rumah tangga.’'
  rationale: Revisi memperjelas bahwa ‘rumah para ayah’ adalah kelompok keluarga menurut garis ayah, tanpa mengubah struktur distributif ayat. Catatan kaki diperbaiki agar tidak menambahkan pembatasan usia yang tidak dinyatakan oleh istilah Ibrani.
