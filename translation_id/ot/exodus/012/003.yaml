base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/003.yaml
  text: Speak to all the congregation of Israel[a], saying, ‘On the tenth day of this month each man shall take for himself a lamb according to his fathers’ house, a lamb for the household.’
translation:
  language: id
  text: 'Berbicaralah kepada seluruh umat Israel: ‘Pada hari kesepuluh bulan ini, hendaklah setiap laki-laki mengambil bagi dirinya seekor anak domba[a] bagi kaum keluarganya dari pihak ayah, seekor anak domba untuk setiap rumah tangga.’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani שֶׂה dapat menunjuk lebih luas kepada hewan dari kawanan, baik domba maupun kambing. Di sini diterjemahkan ‘anak domba’ karena konteks Paskah dan penggunaan yang lazim.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ
  choice: Sampaikanlah
  rationale: Bentuk perintah jamak dari דבר memerintahkan penyampaian pesan kepada umat. ‘Sampaikanlah’ alami dalam bahasa Indonesia dan mencakup tindakan berbicara yang diikuti isi pesan.
- source_word: כָּל עֲדַת יִשְׂרָאֵל
  choice: seluruh umat Israel
  rationale: עֵדָה menunjuk kepada komunitas Israel sebagai satu kesatuan yang berhimpun. ‘Seluruh umat Israel’ mempertahankan makna korporatnya dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: לֵאמֹר
  choice: ': ‘…’'
  rationale: Infinitif pengutip ini memperkenalkan isi perkataan. Dalam bahasa Indonesia modern, tanda titik dua dan petik menyampaikan fungsinya dengan lebih alami daripada terjemahan harfiah ‘dengan berkata’.
- source_word: בֶּעָשֹׂר לַחֹדֶשׁ הַזֶּה
  choice: Pada hari kesepuluh bulan ini
  rationale: Teks Ibrani secara harfiah berbunyi ‘pada yang kesepuluh dari bulan ini’; penambahan ‘hari’ memperjelas ungkapan waktu tanpa mengubah makna.
- source_word: וְיִקְחוּ לָהֶם אִישׁ
  choice: hendaklah setiap laki-laki mengambil bagi dirinya
  rationale: Bentuk verba memiliki daya direktif dalam konteks petunjuk ini. אִישׁ bersifat distributif, sedangkan לָהֶם menyatakan bahwa masing-masing mengambil bagi dirinya sendiri.
- source_word: שֶׂה
  choice: seekor anak domba
  rationale: שֶׂה dapat menunjuk kepada seekor hewan kecil dari kawanan, baik domba maupun kambing. ‘Anak domba’ dipilih karena konteks Paskah dan kelaziman bahasa Indonesia, sementara cakupan leksikal yang lebih luas dicatat dalam catatan kaki.
- source_word: לְבֵית אָבֹת
  choice: menurut kaum keluarga ayahnya
  rationale: Ungkapan ini menunjuk kepada unit kekerabatan patrilineal atau keluarga leluhur. Terjemahan ini mempertahankan unsur ‘ayah’ dan struktur sosial yang tersirat dalam teks.
- source_word: שֶׂה לַבָּיִת
  choice: seekor anak domba untuk setiap rumah tangga
  rationale: בַּיִת di sini menunjuk kepada rumah tangga sebagai unit sosial, bukan semata-mata bangunan. Kata ‘setiap’ mengungkapkan hubungan distributif yang sudah tersirat dalam konstruksi Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur perintah dipertahankan, tetapi konstruksi pengutip Ibrani dialihkan menjadi tanda baca yang alami. Istilah kekerabatan patrilineal dipertahankan tanpa menjadikannya istilah teknis yang sulit dipahami.
