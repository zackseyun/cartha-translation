revisions:
- from: Apabila kamu memasuki negeri yang akan Yahweh berikan kepadamu, seperti yang telah difirmankan-Nya,[a] kamu harus tetap melaksanakan ibadah ini.[b]
  to: Apabila kamu memasuki negeri yang akan Yahweh berikan kepadamu, seperti yang telah difirmankan-Nya,[a] hendaklah kamu memelihara ritus ini.[b]
  rationale: Revisi menghapus ‘tetap’, yang menambahkan aspek tidak tersurat, dan mengganti ‘ibadah’ dengan ‘ritus’ agar objek pemeliharaan yang dimaksud—pelaksanaan Paskah—lebih jelas. ‘Hendaklah kamu memelihara’ mempertahankan daya imperatif-futurum dari וּשְׁמַרְתֶּם dan lazim dalam register Alkitab Indonesia. Catatan kaki diselaraskan dengan terjemahan utama dan konteks sumber.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T21:04:42Z'
review_pass:
  verdict: revise
  source_fidelity: 'Terjemahan pada dasarnya setia: ‘memasuki negeri’, masa depan ‘akan ... berikan’, dan nama Yahweh tepat. Namun ‘tetap’ tidak dinyatakan oleh וּשְׁמַרְתֶּם dan menambahkan nuansa keberlanjutan. ‘Ibadah ini’ dapat dipahami sebagai tindakan penyembahan secara umum, sedangkan הָעֲבֹדָה ini menunjuk khusus pada pelaksanaan/ritus Paskah.'
  naturalness: Susunan kalimatnya alami dalam bahasa Indonesia baku. ‘Kamu harus melaksanakan’ jelas, tetapi ‘harus’ sedikit lebih eksplisit daripada bentuk imperfek Ibrani yang berfungsi sebagai perintah/ketetapan masa depan; ‘hendaklah kamu pelihara’ atau ‘harus kamu laksanakan’ lebih dekat. ‘Pelaksanaan ibadah ini’ terdengar agak berulang dalam catatan kaki.
  terminology: ‘Yahweh’ mempertahankan Tetragramaton dengan tepat. Untuk עֲבֹדָה dalam konteks Paskah, ‘ritus ini’ atau ‘upacara ini’ lebih spesifik daripada ‘ibadah ini’; ‘ritus ini’ tetap formal dan tidak menambahkan tafsiran denominasi.
  issues:
  - severity: medium
    issue: Kata ‘tetap’ menambahkan nuansa yang tidak ada dalam teks sumber.
    rationale: וּשְׁמַרְתֶּם berarti ‘kamu akan/harus memelihara, menaati, atau menjalankan’; ayat ini tidak secara leksikal menyatakan ‘tetap’ atau ‘terus’.
  - severity: low
    issue: ‘Ibadah ini’ kurang spesifik bagi הָעֲבֹדָה הַזֹּאת.
    rationale: Dalam konteks langsung (Kel. 12:24–27), istilah itu menunjuk pada ritus atau upacara Paskah yang harus dipelihara, bukan ibadah dalam pengertian umum.
  - severity: low
    issue: Catatan kaki a membalik hubungan antara terjemahan utama dan alternatif secara kurang tepat.
    rationale: Teks utama sudah menerjemahkan makna harfiah ‘seperti yang telah difirmankan-Nya’, sedangkan ‘seperti yang telah dijanjikan-Nya’ adalah pemaknaan kontekstual; catatan sebaiknya menyatakannya sebagai alternatif kontekstual tanpa mengklaim bahwa bentuk harfiah adalah alternatif.
  revised_text: Apabila kamu memasuki negeri yang akan Yahweh berikan kepadamu, seperti yang telah difirmankan-Nya,[a] hendaklah kamu memelihara ritus ini.[b]
