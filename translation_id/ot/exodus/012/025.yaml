  text: וְ/הָיָ֞ה כִּֽי תָבֹ֣אוּ אֶל הָ/אָ֗רֶץ אֲשֶׁ֨ר יִתֵּ֧ן יְהוָ֛ה לָ/כֶ֖ם כַּ/אֲשֶׁ֣ר דִּבֵּ֑ר וּ/שְׁמַרְתֶּ֖ם אֶת הָ/עֲבֹדָ֥ה הַ/זֹּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/025.yaml
  text: And when you come into the land that Yahweh will give you[a], just as he promised[b], you shall keep this service.
translation:
  language: id
  text: Apabila kamu memasuki negeri yang akan Yahweh berikan kepadamu, seperti yang telah difirmankan-Nya,[a] hendaklah kamu memelihara ritus ini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seperti yang telah dijanjikan-Nya.” Secara harfiah, bahasa Ibraninya berbunyi “seperti yang telah difirmankan-Nya”; dalam konteks ini, firman itu merujuk pada janji yang telah diberikan sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “upacara ini” atau “pelayanan ini.” Istilah Ibrani ini merujuk pada ritus Paskah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Apabila
  rationale: Formula ini memperkenalkan keadaan yang akan terjadi pada masa depan; “apabila” menyampaikan fungsi temporalnya secara alami dalam bahasa Indonesia.
- source_word: תָבֹאוּ אֶל הָאָרֶץ
  choice: kamu memasuki negeri
  rationale: בוא dengan אֶל dapat berarti datang atau masuk ke suatu tempat. “Memasuki negeri” alami dalam konteks Israel masuk ke negeri yang dijanjikan.
- source_word: אֲשֶׁר יִתֵּן יְהוָה לָכֶם
  choice: yang akan Yahweh berikan kepadamu
  rationale: Bentuk verba paling wajar dipahami sebagai masa depan dalam konteks ini, dan nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh”.
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: seperti yang telah difirmankan-Nya
  rationale: דבר secara harfiah berarti “berbicara/berfirman.” Ungkapan ini menunjuk pada firman Yahweh sebelumnya dan membiarkan sifat janjinya ditangkap dari konteks tanpa mengganti verba dengan “menjanjikan”.
- source_word: וּשְׁמַרְתֶּם
  choice: kamu harus tetap melaksanakan
  rationale: שׁמר dengan objek berupa ketetapan ritual menyatakan kewajiban untuk menaati atau terus menjalankannya. Pilihan ini jelas dan wajar dalam bahasa Indonesia.
- source_word: הָעֲבֹדָה הַזֹּאת
  choice: ibadah ini
  rationale: עֲבֹדָה di sini merujuk pada pelayanan atau tata ibadah Paskah, bukan pekerjaan biasa. “Ibadah” ringkas, alami, dan sesuai konteks ritual.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung; “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Daya makna כַּאֲשֶׁר דִּבֵּר
  choice: seperti yang telah difirmankan-Nya
  alternative: seperti yang telah dijanjikan-Nya
  rationale: Konteks memberi nuansa janji, tetapi verba Ibrani sendiri berarti “berbicara.” Terjemahan utama mempertahankan bentuk sumber, sedangkan alternatif yang menonjolkan janji dicatat dalam catatan kaki.
- issue: Makna ritual הָעֲבֹדָה הַזֹּאת
  choice: ibadah ini
  alternative: upacara ini; pelayanan ini
  rationale: Dalam konteks Paskah, עֲבֹדָה adalah pelaksanaan ritual yang diperintahkan. “Ibadah” menyampaikan dimensi religius tanpa menambahkan rincian denominasi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Memasuki negeri” dipilih daripada bentuk yang lebih harfiah “datang ke negeri”; “ibadah” dipakai dalam arti tata pelayanan ritual Paskah.
