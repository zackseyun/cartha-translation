  yaml_path: translation/ot/exodus/012/045.yaml
  text: A sojourner or a hired worker shall not eat of it[a][b].
translation:
  language: id
  text: Orang asing yang menetap[a] dan pekerja upahan tidak boleh memakannya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pendatang yang menetap” atau “penduduk sementara.”
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, santapan Paskah; secara lebih sempit, hewan Paskah.
    reason: cross_reference
lexical_decisions:
- source_word: תּוֹשָׁב
  choice: orang asing yang menetap
  rationale: Istilah ini menunjuk pada orang bukan pribumi yang tinggal di tengah Israel tanpa sepenuhnya menjadi bagian dari komunitas perjanjian. Frasa ini menyampaikan sekaligus status menetap dan statusnya sebagai orang luar.
- source_word: שָׂכִיר
  choice: pekerja upahan
  rationale: Istilah ini menunjuk pada orang yang bekerja dengan menerima upah; padanan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: לֹא יֹאכַל
  choice: tidak boleh memakan
  rationale: Bentuk imperfek yang dinegasikan dalam konteks hukum menyatakan larangan. 'Tidak boleh' mempertahankan daya normatifnya secara alami dalam bahasa Indonesia.
- source_word: בּוֹ
  choice: memakannya
  rationale: Dengan verba 'makan', preposisi בְּ di sini menyatakan turut makan atau mengambil bagian dari sesuatu. Bentuk pronominal '-nya' ringkas dan alami, sementara konteks menentukan acuannya.
- source_word: וְ
  choice: dan
  rationale: Konjungsi Ibrani secara langsung berarti 'dan' dan menggabungkan dua golongan yang sama-sama terkena larangan; tidak perlu mengubahnya menjadi 'atau'.
theological_decisions:
- issue: Acuan pronomina בּוֹ ('-nya') dalam peraturan Paskah
  choice: Pronomina dibiarkan ringkas sebagai '-nya', dengan konteks dan catatan menjelaskan bahwa acuannya ialah santapan Paskah.
  alternative: Menjelaskannya secara eksplisit sebagai 'daging anak domba Paskah'.
  rationale: Teks Ibrani tidak mengulang nomina acuannya. Mempertahankan pronomina menjaga keringkasan dan ambiguitas lingkup antara santapan Paskah secara umum dan hewan Paskah secara lebih khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernuansa hukum. Susunan mempertahankan konjungsi 'dan' dari teks Ibrani serta membiarkan acuan pronomina ditentukan oleh konteks.
