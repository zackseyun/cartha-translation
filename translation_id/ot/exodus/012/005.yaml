base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/005.yaml
  text: Your lamb shall be without blemish[a], a male a year old; you shall take it from the sheep or from the goats.
translation:
  language: id
  text: Seekor hewan dari kawanan harus tidak bercacat[a], jantan, dan berumur satu tahun. Kamu harus mengambilnya dari domba atau dari kambing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani שֶׂה dapat menunjuk secara lebih luas kepada hewan dari kawanan, termasuk domba atau kambing; klausa berikutnya menegaskan bahwa hewan itu dapat diambil dari domba atau dari kambing.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֶׂה
  choice: hewan dari kawanan
  rationale: Kata ini dapat menunjuk pada seekor domba atau kambing kecil. Ungkapan yang lebih luas menghindari pembatasan keliru pada anak domba, sedangkan klausa terakhir menyebut kedua jenis ternak yang diperbolehkan.
- source_word: תָמִים
  choice: tidak bercacat
  rationale: Dalam konteks persembahan, kata ini menyatakan bahwa hewan itu bebas dari cacat, bukan sempurna dalam arti umum.
- source_word: זָכָר
  choice: jantan
  rationale: Padanan biologis yang langsung, tepat, dan alami bagi hewan.
- source_word: בֶּן שָׁנָה
  choice: berumur setahun
  rationale: Menerjemahkan idiom Ibrani secara alami. Ungkapan tersebut dapat dipahami sebagai hewan dalam tahun pertamanya, sehingga nuansa itu dicatat dalam catatan kaki.
- source_word: יִהְיֶה לָכֶם
  choice: haruslah
  rationale: Menyampaikan daya preskriptif dari ketentuan yang berlaku bagi umat tanpa menerjemahkan datif לָכֶם secara kaku.
- source_word: מִן הַכְּבָשִׂים וּמִן הָעִזִּים
  choice: dari antara domba atau kambing
  rationale: Kedua kelompok ternak merupakan pilihan sumber hewan. 'Atau' menyampaikan makna alternatif yang dimaksud oleh konteks, meskipun teks Ibrani memakai penghubung yang secara bentuk lazim berarti 'dan'.
- source_word: תִּקָּחוּ
  choice: Kamu harus mengambilnya
  rationale: Bentuk orang kedua jamak menyampaikan instruksi yang mengikat. Objek '-nya' disuplai secara alami dari hewan tunggal yang telah disebut.
theological_decisions:
- issue: Jenis hewan Paskah
  choice: Memakai istilah umum 'hewan dari kawanan' dan mempertahankan pilihan domba atau kambing.
  alternative: Menerjemahkan שֶׂה sebagai 'anak domba'.
  rationale: Teks Ibrani tidak membatasi hewan itu pada domba; klausa berikutnya secara eksplisit mengizinkan hewan dari domba maupun kambing. Pilihan ini menjaga cakupan asli tanpa mengutamakan gambaran teologis yang kemudian lebih lazim.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk jamak 'kamu' dipakai secara kolektif sesuai konteks umat Israel. Catatan kaki b tidak dipasang karena setiap penanda wajib muncul dalam teks utama.
