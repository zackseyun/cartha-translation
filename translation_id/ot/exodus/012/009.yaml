  text: Do not eat any of it raw or boiled in water[a], but only roasted over the fire, with its head, its legs, and its inner parts.
translation:
  language: id
  text: Jangan makan sedikit pun darinya dalam keadaan mentah atau direbus dalam air, tetapi hanya dalam keadaan dipanggang di atas api, dengan kepala, kaki, dan isi perutnya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara harfiah, "kepalanya dengan kakinya dan dengan isi perutnya."
    reason: Menunjukkan susunan daftar Ibrani yang lebih harfiah, termasuk pengulangan unsur penghubung.
lexical_decisions:
- source_word: נָא
  choice: dalam keadaan mentah
  rationale: Dalam konteks pengolahan daging, kata ini menunjuk pada daging yang tidak dimasak dengan api atau direbus. Ungkapan ini jelas dan alami dalam bahasa Indonesia.
- source_word: וּבָשֵׁל מְבֻשָּׁל בַּמָּיִם
  choice: atau direbus dalam air
  rationale: Bentuk intensif dari בשל disertai frasa 'dalam air' secara khusus menunjuk pada perebusan; terjemahan ini mempertahankan cara memasak yang dilarang.
- source_word: כִּי אִם
  choice: melainkan hanya
  rationale: Frasa ini menyatakan pengecualian dan pertentangan yang tegas, sekaligus menekankan bahwa cara berikutnya adalah satu-satunya yang diperbolehkan.
- source_word: צְלִי אֵשׁ
  choice: yang dipanggang di atas api
  rationale: Ungkapan Ibrani menunjuk pada daging yang dipanggang dengan api. Pilihan ini alami dan mempertahankan sarana memasaknya.
- source_word: רֹאשׁוֹ עַל־כְּרָעָיו וְעַל־קִרְבּוֹ
  choice: beserta kepala, kaki, dan isi perutnya
  rationale: עַל yang berulang berfungsi menghubungkan bagian-bagian hewan yang harus ikut dipanggang. 'Isi perut' cukup konkret tanpa memakai istilah yang terlalu teknis.
- source_word: מִמֶּנּוּ
  choice: sedikit pun darinya
  rationale: Preposisi מן memiliki arti partitif. Dalam larangan ini, 'sedikit pun darinya' menyampaikan bahwa tidak ada bagian yang boleh dimakan dengan cara tersebut.
