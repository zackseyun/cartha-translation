  text: וְ/הָיָה֩ הַ/יּ֨וֹם הַ/זֶּ֤ה לָ/כֶם֙ לְ/זִכָּר֔וֹן וְ/חַגֹּתֶ֥ם אֹת֖/וֹ חַ֣ג לַֽ/יהוָ֑ה לְ/דֹרֹ֣תֵי/כֶ֔ם חֻקַּ֥ת עוֹלָ֖ם תְּחָגֻּֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/014.yaml
  text: And this day shall be for you as a memorial[a], and you shall celebrate it as a feast to Yahweh; throughout your generations, you shall celebrate it as a permanent statute.
translation:
  language: id
  text: Hari ini harus menjadi peringatan bagimu, dan kamu harus merayakannya sebagai hari raya bagi Yahweh. Turun-temurun kamu harus merayakannya sebagai ketetapan yang tetap berlaku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketetapan untuk selama-lamanya” atau “ketetapan kekal.” Ungkapan Ibrani חֻקַּת עוֹלָם sering menunjuk pada ketetapan yang berlaku terus-menerus dan berkelanjutan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה הַיּוֹם הַזֶּה
  choice: Hari ini harus menjadi
  rationale: Dalam konteks instruksi hukum, bentuk ini menyatakan penetapan yang berlaku ke depan. Susunan Indonesia ini alami dan tetap mempertahankan daya wajibnya.
- source_word: לָכֶם לְזִכָּרוֹן
  choice: hari peringatan bagimu
  rationale: זִכָּרוֹן menunjuk pada peringatan atau sarana untuk mengenang; frasa ini menyampaikan fungsi peringatan bagi umat tanpa menambahkan objek yang tidak disebutkan.
- source_word: וְחַגֹּתֶם אֹתוֹ חַג
  choice: kamu harus merayakannya sebagai hari raya
  rationale: חגג dan חַג adalah verba dan nomina serumpun yang menunjuk pada perayaan hari raya. Terjemahan ini mempertahankan hubungan maknanya secara wajar dalam bahasa Indonesia.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menandai bahwa perayaan itu diperuntukkan bagi atau diarahkan kepada Yahweh; nama perjanjian יהוה ditransliterasikan sebagai Yahweh.
- source_word: לְדֹרֹתֵיכֶם
  choice: Turun-temurun
  rationale: Ungkapan ini menyatakan keberlangsungan kewajiban melintasi generasi-generasi umat. 'Turun-temurun' ringkas, alami, dan tepat.
- source_word: חֻקַּת עוֹלָם
  choice: ketetapan tetap
  rationale: חֻקָּה adalah ketetapan yang ditentukan, sedangkan עוֹלָם dalam rumusan hukum ini menyatakan keberlakuan yang terus berlangsung. Pilihan ini mempertahankan daya hukumnya tanpa memaksakan klaim filosofis tentang durasi mutlak.
- source_word: תְּחָגֻּהוּ
  choice: kamu harus merayakannya
  rationale: Pengulangan verba menegaskan kembali kewajiban merayakan hari itu; terjemahan yang sama menjaga konsistensi dan penekanan teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama ilahi יהוה secara langsung. 'Yahweh' mempertahankan nama perjanjian itu, bukan menggantinya dengan gelar.
- issue: Daya ungkapan חֻקַּת עוֹלָם
  choice: ketetapan tetap
  alternative: ketetapan untuk selama-lamanya; ketetapan kekal
  rationale: Ungkapan tersebut menandai ketetapan yang terus berlaku turun-temurun. 'Tetap' mempertahankan sifat berkelanjutannya sekaligus tidak menutup ambiguitas cakupan עוֹלָם dalam bahasa hukum perjanjian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'merayakannya' dipertahankan karena mencerminkan penegasan dalam teks Ibrani. 'Hari raya' lebih alami bagi pembaca umum daripada istilah teknis 'perayaan ziarah'.
