  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּֽעֲשׂ֖וּ כָּל בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֥ה וְ/אֶֽת אַהֲרֹ֖ן כֵּ֥ן עָשֽׂוּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/050.yaml
  text: And all the sons of Israel did as Yahweh had commanded Moses and Aaron[b][a]; so they did.
translation:
  language: id
  text: Seluruh keturunan Israel[a] melakukan seperti yang diperintahkan Yahweh[b] kepada Musa dan Harun; demikianlah mereka melakukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Israel”; dapat juga diterjemahkan “orang Israel.”
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: YHWH, yang secara tradisional diterjemahkan “TUHAN.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעֲשׂוּ ... עָשׂוּ
  choice: melakukan ... melakukannya
  rationale: Kata kerja עשה berarti ‘melakukan/membuat’. Dalam konteks menaati perintah, ‘melakukan’ paling alami; pengulangannya pada akhir ayat dipertahankan untuk menjaga penekanan teks Ibrani.
- source_word: כָּל
  choice: seluruh
  rationale: כָּל menyatakan keseluruhan kelompok. ‘Seluruh’ sesuai dengan frasa kolektif sesudahnya.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Secara harfiah berarti ‘anak-anak Israel’, tetapi merupakan sebutan etnofamilial bagi umat Israel. ‘Keturunan Israel’ mempertahankan unsur kekerabatan dan tetap wajar dalam bahasa Indonesia modern.
- source_word: כַּאֲשֶׁר
  choice: seperti yang
  rationale: Ungkapan ini menyatakan kesesuaian tindakan mereka dengan perintah yang telah diberikan.
- source_word: צִוָּה
  choice: diperintahkan
  rationale: Bentuk aktif Ibrani dialihkan secara alami menjadi konstruksi pasif bahasa Indonesia, dengan Yahweh tetap sebagai pemberi perintah dan Musa serta Harun sebagai penerimanya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar.
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: kepada Musa dan Harun
  rationale: Penanda objek menunjukkan bahwa Musa dan Harun adalah orang-orang yang diperintah Yahweh; ‘kepada’ mengungkapkan hubungan ini secara idiomatis dalam bahasa Indonesia.
- source_word: כֵּן
  choice: demikianlah
  rationale: כֵּן menegaskan bahwa tindakan mereka tepat sesuai dengan perintah. ‘Demikianlah’ mempertahankan penekanan penutup itu.
theological_decisions:
- issue: Penerjemahan nama perjanjian יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi YHWH secara langsung. Bentuk ‘Yahweh’ mempertahankannya sebagai nama diri, sedangkan ‘TUHAN’ adalah penggantian tradisional dengan gelar.
- issue: Penerjemahan בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak Israel; orang Israel
  rationale: Ungkapan Ibrani secara harfiah berbentuk familial, tetapi berfungsi sebagai sebutan kolektif bagi umat Israel. ‘Keturunan Israel’ menjaga citra kekerabatan tanpa membatasi rujukan hanya kepada laki-laki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur ganda ‘melakukan ... melakukannya’ sengaja dipertahankan untuk mencerminkan pengulangan dan penekanan dalam teks Ibrani.
