  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur penanggalan Ibrani dipertahankan, sedangkan urutan bilangan disesuaikan dengan idiom Indonesia. Penanda catatan kaki ditempatkan pada kemunculan pertama dan catatannya berlaku juga bagi kemunculan kedua.
