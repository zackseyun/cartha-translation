base_translation:
  language: en
  yaml_path: translation/ot/exodus/012/018.yaml
  text: In the first month[a], on the fourteenth day of the month at evening, you shall eat unleavened bread, until the twenty-first day of the month at evening.
translation:
  language: id
  text: Pada bulan pertama, pada hari keempat belas bulan itu, pada waktu petang[a], kamu harus makan roti tidak beragi sampai hari kedua puluh satu bulan itu, pada waktu petang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pada petang hari”; demikian juga pada kemunculan kedua frasa ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרִאשֹׁן
  choice: Pada bulan pertama
  rationale: Dalam rumus penanggalan ini, unsur 'bulan' dipahami dari לַחֹדֶשׁ dalam klausa yang sama; penyebutannya secara eksplisit menghasilkan bahasa Indonesia yang jelas dan wajar.
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם
  choice: pada hari keempat belas
  rationale: Ungkapan bilangan kardinal Ibrani ini berfungsi sebagai tanggal; bentuk ordinal Indonesia menyampaikan maknanya secara alami.
- source_word: לַחֹדֶשׁ
  choice: bulan itu
  rationale: Dalam rumus tanggal, חֹדֶשׁ berarti 'bulan', bukan 'bulan baru'. Kata 'itu' secara alami merujuk kembali kepada bulan pertama.
- source_word: בָּעֶרֶב / בָּעָרֶב
  choice: pada waktu petang
  rationale: Ungkapan ini menandai batas waktu pada kedua ujung masa perayaan. 'Pada waktu petang' cukup tepat tanpa mempersempitnya menjadi suatu titik seperti saat matahari terbenam.
- source_word: תֹּאכְלוּ
  choice: kamu harus makan
  rationale: Bentuk imperfek dalam konteks ketetapan ini memiliki daya instruktif; 'harus' menyampaikan kewajiban dengan bahasa Indonesia modern.
- source_word: מַצֹּת
  choice: roti tidak beragi
  rationale: Istilah ini menunjuk pada roti yang dibuat tanpa ragi dalam konteks Paskah; terjemahan langsung lebih mudah dipahami daripada transliterasi.
- source_word: עַד
  choice: sampai
  rationale: Menandai batas akhir masa makan roti tidak beragi.
- source_word: יוֹם הָאֶחָד וְעֶשְׂרִים
  choice: hari kedua puluh satu
  rationale: Ini adalah cara Ibrani menyatakan tanggal kedua puluh satu; bentuk ordinal Indonesia paling wajar.
theological_decisions: []
