  text: The dwelling of the sons of Israel[a], who lived in Egypt, was four hundred thirty years.
translation:
  language: id
  text: Masa tinggal keturunan Israel[a] di Mesir adalah 430 tahun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah saksi kuno memuat, “Masa tinggal keturunan Israel dan nenek moyang mereka di Mesir dan Kanaan adalah 430 tahun.”
    reason: textual_variant
lexical_decisions:
- source_word: מוֹשַׁב
  choice: masa tinggal
  rationale: Dalam konteks ini, kata tersebut menunjuk pada lamanya atau masa mereka tinggal, bukan semata-mata tempat tinggal. “Masa tinggal” menyampaikan fungsi nomina itu secara alami dalam bahasa Indonesia.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Secara harfiah berarti “anak-anak Israel”, tetapi dalam konteks kebangsaan dan perjanjian ungkapan ini menunjuk kepada keturunan Israel. Pilihan ini alami bagi pembaca modern dan tidak memberi kesan bahwa yang dimaksud hanya anak-anak kecil.
- source_word: אֲשֶׁר יָשְׁבוּ
  choice: yang menetap
  rationale: Kata kerja יָשְׁבוּ berarti tinggal atau menetap. “Yang menetap” mempertahankan bentuk klausa relatif jamak dan cocok dengan konteks masa kediaman.
- source_word: בְּמִצְרָיִם
  choice: di Mesir
  rationale: Padanan lokatif langsung bagi preposisi בְּ dan nama tempat מִצְרָיִם.
- source_word: שְׁלֹשִׁים שָׁנָה וְאַרְבַּע מֵאוֹת שָׁנָה
  choice: 430 tahun
  rationale: Urutan bilangan disesuaikan dengan kelaziman bahasa Indonesia tanpa mengubah jumlah yang dinyatakan teks Ibrani.
theological_decisions:
- issue: 'Cakupan masa 430 tahun: hanya di Mesir atau mencakup masa para leluhur di Kanaan'
  choice: Teks utama mengikuti teks Masoret dan menyatakan bahwa keturunan Israel menetap di Mesir selama 430 tahun.
  alternative: Sejumlah saksi kuno memperluas masa itu dengan menyebut Mesir dan Kanaan serta para leluhur Israel.
  rationale: WLC yang menjadi sumber utama secara eksplisit hanya berbunyi “di Mesir”. Namun, varian kuno tersebut penting bagi persoalan kronologi, sehingga dicatat dalam catatan kaki tanpa dimasukkan ke teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Masa tinggal” dipilih agar makna duratif jelas, sedangkan “keturunan Israel” menyampaikan idiom Ibrani secara alami. Angka ditulis dengan numeralia untuk keterbacaan.
