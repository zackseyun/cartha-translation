  text: And for the second side there shall be fifteen cubits of hangings[c][b][a], with three pillars and their three bases.
translation:
  language: id
  text: Untuk sisi yang kedua, tirai sepanjang lima belas hasta[a], dengan tiga tiangnya dan tiga alasnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “hasta” tidak terdapat dalam teks Ibrani ayat ini, tetapi tersirat dari susunan yang sejajar dalam ayat 14.
    reason: implied_unit
  - marker: b
    text: Atau “soket”, yaitu bagian fondasi tempat tiang berdiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לַ/כָּתֵף
  choice: Untuk sisi
  rationale: כָּתֵף secara harfiah berarti “bahu”, tetapi dalam konteks arsitektur pelataran Kemah Suci menunjuk pada sisi atau bagian samping. “Untuk sisi” wajar dalam rangkaian petunjuk pembangunan.
- source_word: הַ/שֵּׁנִית
  choice: yang kedua
  rationale: Menerjemahkan langsung kata bilangan bertingkat Ibrani dan tidak menggantinya dengan penafsiran kontekstual “yang lain”.
- source_word: חְמֵשׁ עֶשְׂרֵה
  choice: sepanjang lima belas hasta
  rationale: Teks Ibrani hanya menyatakan “lima belas”, tetapi berdasarkan konstruksi sejajar dalam ayat 14, angka ini menyatakan ukuran panjang dan satuan hasta dilesapkan. Kata “sepanjang” memperjelas bahwa yang dimaksud bukan lima belas buah tirai.
- source_word: קְלָעִים
  choice: tirai-tirainya
  rationale: Dalam konteks pelataran, bentuk jamak ini menunjuk pada bentangan kain tenun yang menjadi pembatas. “Tirai” lebih alami dalam bahasa Indonesia daripada “kain gantung”, sedangkan akhiran -nya menyatakan keterkaitannya dengan sisi tersebut.
- source_word: עַמֻּדֵי/הֶם
  choice: tiga tiang
  rationale: עַמּוּד menunjuk pada penyangga tegak bagi tirai. “Tiang” merupakan istilah Indonesia yang alami dan tepat dalam konteks bangunan ini; hubungan posesif sudah jelas dari susunan kalimat.
- source_word: וְ/אַדְנֵי/הֶם
  choice: dan tiga alas
  rationale: אֶדֶן ialah bagian fondasi atau dudukan tempat tiang berdiri. “Alas” mudah dipahami, sedangkan arti teknis “soket” dicatat sebagai alternatif.
