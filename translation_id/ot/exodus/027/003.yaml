revisions:
- from: Buatlah wadah-wadahnya untuk membuang abunya[a], juga sekop-sekopnya, bokor-bokornya, garpu-garpunya, dan perbaraan-perbaraannya. Semua perkakasnya harus kaubuat dari perunggu[b].
  to: Buatlah wadah-wadahnya untuk membersihkan abunya[a], sekop-sekopnya, baskom-baskomnya, garpu-garpunya, dan panci-panci baranya. Semua perkakasnya harus kaubuat dari perunggu[b].
  rationale: Revisi mengganti istilah yang kurang lazim atau kurang jelas dengan padanan Indonesia baku modern yang tetap sepadan dengan istilah Ibrani. Struktur daftar, rujukan pronominal kepada mazbah, daya perintah, dan alternatif leksikal untuk נְחֹשֶׁת dipertahankan.
