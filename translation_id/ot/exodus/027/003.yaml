  text: וְ/עָשִׂ֤יתָ סִּֽירֹתָי/ו֙ לְ/דַשְּׁנ֔/וֹ וְ/יָעָי/ו֙ וּ/מִזְרְקֹתָ֔י/ו וּ/מִזְלְגֹתָ֖י/ו וּ/מַחְתֹּתָ֑י/ו לְ/כָל כֵּלָ֖י/ו תַּעֲשֶׂ֥ה נְחֹֽשֶׁת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/003.yaml
  text: You shall make its pots for removing its ashes[a], and its shovels, and its basins, and its forks, and its firepans[b]; you shall make all its utensils of bronze.
translation:
  language: id
  text: Buatlah wadah-wadahnya untuk membersihkan abunya[a], sekop-sekopnya, baskom-baskomnya, garpu-garpunya, dan panci-panci baranya. Semua perkakasnya harus kaubuat dari perunggu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “untuk menyingkirkan abu berlemaknya”; ungkapan ini mengacu pada pembersihan abu yang tersisa dari persembahan di mazbah.
    reason: lexical_alternative
  - marker: b
    text: Atau “tembaga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Buatlah
  rationale: Bentuk Qal orang kedua tunggal maskulin dalam rangkaian petunjuk ini berfungsi sebagai perintah; bentuk imperatif Indonesia menyampaikan daya direktifnya secara alami.
- source_word: סִּירֹתָיו
  choice: wadah-wadahnya
  rationale: Kata ini menunjuk pada bejana atau wadah. Fungsi khususnya dinyatakan oleh frasa berikutnya, sehingga tidak perlu memasukkan unsur 'abu' ke dalam nama bendanya.
- source_word: לְדַשְּׁנוֹ
  choice: untuk membuang abunya
  rationale: Dalam konteks mazbah, bentuk Piel ini mengacu pada penyingkiran sisa abu berlemak dari persembahan; terjemahan ini menyatakan fungsi alat dengan jelas, sedangkan nuansa harfiahnya dicatat dalam catatan kaki.
- source_word: יָעָיו
  choice: sekop-sekopnya
  rationale: Istilah ini menunjuk pada alat untuk menyendok atau memindahkan abu maupun bara; 'sekop' jelas dan lazim dalam konteks ini.
- source_word: מִזְרְקֹתָיו
  choice: bokor-bokornya
  rationale: Kata ini menunjuk pada bejana ritual yang dapat dipakai untuk menampung atau memercikkan cairan, khususnya darah; 'bokor' mempertahankan nuansa bejana upacara.
- source_word: מִזְלְגֹתָיו
  choice: garpu-garpunya
  rationale: Nomina ini menunjuk pada perkakas bercabang seperti garpu; terjemahan tidak menambahkan fungsi yang tidak dinyatakan secara eksplisit.
- source_word: מַחְתֹּתָיו
  choice: perbaraan-perbaraannya
  rationale: Istilah ini lazim menunjuk pada wadah untuk membawa bara atau api. 'Perbaraan' ringkas dan sesuai dengan konteks perlengkapan mazbah.
- source_word: לְכָל־כֵּלָיו
  choice: semua perkakasnya
  rationale: כְּלִי merupakan istilah luas bagi alat, benda, atau perlengkapan; 'perkakas' secara alami mencakup seluruh alat mazbah yang baru disebutkan.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Dalam konteks perlengkapan Kemah Suci, istilah ini secara tradisional dan masuk akal menunjuk pada perunggu, meskipun tembaga juga mungkin secara leksikal.
