  text: You shall make the altar of acacia wood[a], five cubits long and five cubits wide; the altar shall be square, and its height shall be three cubits.
translation:
  language: id
  text: Buatlah mezbah dari kayu akasia, panjangnya lima hasta dan lebarnya lima hasta. Mezbah itu harus berbentuk persegi[a], dan tingginya tiga hasta.
  philosophy: optimal-equivalence
