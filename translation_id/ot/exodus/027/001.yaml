lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Buatlah
  rationale: Bentuk verbal ini dalam rangkaian petunjuk berfungsi sebagai perintah; “Buatlah” menyampaikan daya perintah secara alami dan langsung dalam bahasa Indonesia.
- source_word: הַמִּזְבֵּחַ
  choice: mazbah
  rationale: “Mazbah” adalah istilah baku dalam bahasa Indonesia untuk tempat persembahan kurban dan membedakannya dari altar dalam pemakaian umum lainnya.
- source_word: עֲצֵי שִׁטִּים
  choice: dari kayu akasia
  rationale: Frasa konstruksi ini menyatakan bahan pembuatannya; “kayu akasia” merupakan padanan modern yang jelas.
- source_word: חָמֵשׁ אַמּוֹת אֹרֶךְ
  choice: panjangnya lima hasta
  rationale: Ungkapan ukuran diterjemahkan dengan susunan dimensional yang alami dalam bahasa Indonesia, sambil mempertahankan satuan hasta.
- source_word: וְחָמֵשׁ אַמּוֹת רֹחַב
  choice: lebarnya lima hasta
  rationale: Padanan ini menjaga kesejajaran dengan ukuran panjang dan menyampaikan dimensi secara jelas.
- source_word: רָבוּעַ יִהְיֶה
  choice: harus berbentuk persegi
  rationale: רָבוּעַ menunjukkan bentuk dengan panjang dan lebar sama; “berbentuk persegi” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: וְשָׁלֹשׁ אַמּוֹת קֹמָתוֹ
  choice: dan tingginya tiga hasta
  rationale: Terjemahan ini mempertahankan sufiks kepunyaan pada קֹמָתוֹ dan menyajikan ukuran secara ringkas serta alami.
