  text: וְ/כֵ֨ן לִ/פְאַ֤ת צָפוֹן֙ בָּ/אֹ֔רֶךְ קְלָעִ֖ים מֵ֣אָה אֹ֑רֶךְ ו/עמד/ו עֶשְׂרִ֗ים וְ/אַדְנֵי/הֶ֤ם עֶשְׂרִים֙ נְחֹ֔שֶׁת וָוֵ֧י הָֽ/עַמֻּדִ֛ים וַ/חֲשֻׁקֵי/הֶ֖ם כָּֽסֶף׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/011.yaml
  text: 'And likewise for the north side in length: hangings a hundred cubits long[a], its twenty pillars and their twenty bronze bases[b], and the hooks of the pillars and their bands shall be silver.'
translation:
  language: id
  text: Demikian pula, pada sisi utara, harus ada tirai sepanjang seratus hasta,[a] dengan dua puluh tiang dan dua puluh alas dari tembaga.[b] Kait-kait pada tiang dan pengikat-pengikatnya[c] harus dari perak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani secara harfiah berbunyi “seratus panjangnya”; satuan “hasta” dilengkapi berdasarkan ukuran-ukuran dalam konteks langsung.
    reason: cultural_note
  - marker: b
    text: Kata Ibrani yang diterjemahkan “tembaga” juga dapat menunjuk pada perunggu atau paduan tembaga.
    reason: lexical_alternative
  - marker: c
    text: Istilah Ibrani ini menunjuk pada bagian yang melingkari atau menghubungkan tiang; bentuk teknisnya tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן
  choice: Demikian juga
  rationale: Menandai bahwa ketentuan untuk sisi utara sejajar dengan ketentuan bagi sisi sebelumnya.
- source_word: לִפְאַת צָפוֹן בָּאֹרֶךְ
  choice: di sisi utara, sepanjang sisi itu
  rationale: Menyampaikan baik letak sisi maupun dimensi memanjangnya dengan ungkapan Indonesia yang alami.
- source_word: קְלָעִים
  choice: tirai
  rationale: Dalam konteks pelataran Kemah Suci, kata ini menunjuk pada bentangan kain yang membentuk pembatas; 'tirai' jelas dan mudah dipahami.
- source_word: מֵאָה אֹרֶךְ
  choice: sepanjang seratus hasta
  rationale: Teks Ibrani tidak menyebut satuannya secara eksplisit, tetapi konteks ukuran pelataran dengan jelas menunjukkan hasta; penambahan ini dijelaskan dalam catatan kaki.
- source_word: עַמֻּדָיו
  choice: dua puluh tiang
  rationale: Kata ini menunjuk pada tiang-tiang penyangga tirai di sisi utara.
- source_word: אַדְנֵיהֶם
  choice: alasnya
  rationale: Dalam uraian Kemah Suci, kata ini adalah alas atau soket tempat tiang berdiri; 'alas' lebih mudah dipahami dalam bahasa Indonesia modern.
- source_word: נְחֹשֶׁת
  choice: tembaga
  rationale: Istilah Ibrani dapat mencakup tembaga atau paduan tembaga seperti perunggu; 'tembaga' mempertahankan sebutan bahan yang lazim sambil mencatat cakupan maknanya.
- source_word: וָוֵי הָעַמֻּדִים
  choice: kait-kait tiang
  rationale: Menunjuk pada kait yang terpasang pada tiang untuk mendukung atau menghubungkan bagian pelataran.
- source_word: חֲשֻׁקֵיהֶם
  choice: gelang-gelang pengikatnya
  rationale: Istilah ini menunjuk pada bagian yang melingkari atau menghubungkan tiang; terjemahan ini cukup konkret tanpa menetapkan bentuk teknis yang tidak pasti.
- source_word: כָּסֶף
  choice: perak
  rationale: Sebutan bahan yang langsung dan tidak ambigu dalam konteks ini.
theological_decisions: []
