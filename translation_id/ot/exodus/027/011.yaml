  register: Bahasa Indonesia baku modern dengan nada bermartabat dan jelas. Susunan daftar Ibrani dibuat menjadi kalimat alami tanpa menghilangkan rincian ukuran, jumlah, atau bahan. Istilah teknis yang maknanya tidak sepenuhnya pasti dipertahankan secara cukup luas dan dijelaskan melalui catatan kaki.
