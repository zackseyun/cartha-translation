translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Bentuk imperatif ‘Pasanglah’ sesuai dengan rangkaian petunjuk langsung. Istilah arsitektural ‘birai’ dipertahankan karena ringkas, dengan alternatif yang lebih umum dalam catatan kaki.
