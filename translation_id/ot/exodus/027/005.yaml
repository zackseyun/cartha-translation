  text: And you shall put it under the ledge of the altar from below[b][a], and the net shall extend to halfway up the altar.
translation:
  language: id
  text: Pasanglah jala itu di bawah birai mezbah, dari bawah,[a] dan jala itu harus terentang hingga setengah tinggi mezbah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bingkai mezbah.” Kata Ibrani yang diterjemahkan “birai” dapat menunjuk pada tepian atau bingkai yang menonjol. Hubungan tepat “dari bawah” dengan struktur atau cara pemasangan mezbah tidak sepenuhnya jelas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה אֹתָהּ
  choice: Pasanglah jala itu
  rationale: Dalam petunjuk pembuatan ini, נתן dengan objek dan keterangan tempat secara alami berarti ‘memasang’ atau ‘menempatkan’. Objek eksplisit ‘jala itu’ memperjelas rujukan pronomina feminin kepada רשת pada ayat sebelumnya.
- source_word: תַּחַת
  choice: di bawah
  rationale: Menunjukkan posisi yang lebih rendah daripada birai mezbah.
- source_word: כַּרְכֹּב
  choice: birai
  rationale: Istilah ini menunjuk pada tepian atau bingkai yang menonjol pada mezbah. ‘Birai’ cukup tepat untuk unsur struktural tersebut, sementara alternatif ‘bingkai’ dicatat dalam catatan kaki.
- source_word: מִלְּמָטָּה
  choice: pada bagian bawahnya
  rationale: Mempertahankan rincian spasial bahwa pemasangan dilakukan pada sisi atau bagian bawah, tanpa menentukan mekanisme konstruksi yang tidak dijelaskan teks.
- source_word: וְהָיְתָה הָרֶשֶׁת עַד
  choice: dan jala itu harus terentang sampai
  rationale: Mempertahankan koordinasi Ibrani dengan ‘dan’, sedangkan ‘terentang sampai’ menyampaikan keadaan atau jangkauan jala secara wajar dalam bahasa Indonesia.
- source_word: חֲצִי הַמִּזְבֵּחַ
  choice: pertengahan tinggi mezbah
  rationale: Secara harfiah berarti ‘setengah/pertengahan mezbah’; konteks vertikal menunjukkan titik tengah ketinggian mezbah. Rumusan ini menjelaskan relasi spasial tanpa menyiratkan bahwa jala menutupi separuh luas mezbah.
