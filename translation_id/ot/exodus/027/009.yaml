  text: וְ/עָשִׂ֕יתָ אֵ֖ת חֲצַ֣ר הַ/מִּשְׁכָּ֑ן לִ/פְאַ֣ת נֶֽגֶב תֵּ֠ימָנָ/ה קְלָעִ֨ים לֶ/חָצֵ֜ר שֵׁ֣שׁ מָשְׁזָ֗ר מֵאָ֤ה בָֽ/אַמָּה֙ אֹ֔רֶךְ לַ/פֵּאָ֖ה הָ/אֶחָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/009.yaml
  text: And you shall make the court of the tabernacle. For the south side[a], southward, there shall be hangings for the court of finely twisted linen, a hundred cubits long for one side.
translation:
  language: id
  text: Engkau harus membuat pelataran Kemah Suci. Untuk sisi selatan, ke arah selatan, harus ada tirai-tirai[a] untuk pelataran itu dari linen halus yang dipintal, panjang seratus hasta untuk satu sisi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kain-kain pembatas.” Istilah Ibrani ini menunjuk pada panel-panel kain yang membentuk batas pelataran.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲצַר
  choice: pelataran
  rationale: Menunjuk pada ruang terbuka berpagar yang mengelilingi Kemah Suci; 'pelataran' alami dan lazim dalam konteks bangunan suci.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: Dalam konteks Keluaran, istilah ini menunjuk pada tempat kudus berbentuk kemah; 'Kemah Suci' jelas bagi pembaca Indonesia modern.
- source_word: לִפְאַת נֶגֶב תֵּימָנָה
  choice: Pada sisi selatan, ke arah selatan
  rationale: Mempertahankan pengulangan orientasi selatan dalam bahasa Ibrani tanpa membuat kalimat terlalu kaku.
- source_word: קְלָעִים
  choice: tirai-tirai
  rationale: Menunjuk pada panel-panel kain yang membentuk batas pelataran. Bentuk jamak mempertahankan bentuk sumber.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: linen halus yang dipintal
  rationale: Menyampaikan bahan dan pengerjaannya secara jelas; 'dipintal' mempertahankan unsur מָשְׁזָר.
- source_word: מֵאָה בָאַמָּה
  choice: seratus hasta
  rationale: Mempertahankan satuan ukuran kuno sebagaimana dalam teks sumber.
- source_word: אֹרֶךְ
  choice: panjangnya
  rationale: Ungkapan ukuran diterjemahkan secara idiomatis dalam bahasa Indonesia.
- source_word: לַפֵּאָה הָאֶחָת
  choice: untuk sisi yang satu itu
  rationale: Mempertahankan acuan tunggal dan unsur definit dalam frasa Ibrani.
