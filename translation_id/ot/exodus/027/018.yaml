base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/018.yaml
  text: The length of the court shall be a hundred cubits[a], and the width fifty cubits, and the height five cubits, of finely twisted linen[b], with their bases of bronze.
translation:
  language: id
  text: Panjang pelataran itu seratus hasta, lebarnya lima puluh hasta,[a] dan tingginya lima hasta. Tirainya terbuat dari linen halus yang dipintal, dan alas-alasnya[b] dari perunggu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi “lima puluh dengan lima puluh.” Ungkapan ini tidak lazim; beberapa terjemahan meratakannya menjadi “lima puluh hasta.”
    reason: alternative_reading
  - marker: b
    text: Atau “soket-soketnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹרֶךְ הֶחָצֵר
  choice: Panjang pelataran itu
  rationale: Memakai istilah arsitektural yang wajar; “pelataran” menunjuk pada area berpagar di sekeliling Kemah Suci.
- source_word: מֵאָה בָאַמָּה
  choice: seratus hasta
  rationale: Mempertahankan satuan ukuran sumber agar selaras dengan uraian pembangunan Kemah Suci.
- source_word: חֲמִשִּׁים בַּחֲמִשִּׁים
  choice: lima puluh hasta di seluruh bagiannya
  rationale: Ungkapan Ibrani yang tidak lazim dipahami sebagai lebar lima puluh hasta yang berlaku merata; bentuk harfiahnya dicatat agar ambiguitas sumber tetap terlihat.
- source_word: וְקֹמָה חָמֵשׁ אַמּוֹת
  choice: dan tingginya lima hasta
  rationale: Menyampaikan dimensi vertikal secara langsung dan alami dalam bahasa Indonesia.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: linen halus yang dipintal
  rationale: שֵׁשׁ adalah linen halus dalam konteks Kemah Suci, sedangkan מָשְׁזָר menunjukkan benang atau bahan yang dipintal.
- source_word: וְאַדְנֵיהֶם
  choice: dan alas-alasnya
  rationale: אַדֶן menunjuk pada penyangga logam di bagian bawah tiang; “alas” lebih mudah dipahami daripada istilah teknis “soket”.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Padanan konvensional dan kontekstual untuk logam yang digunakan dalam perlengkapan Kemah Suci, meskipun kata itu juga dapat menunjuk pada tembaga.
