source:
  edition: WLC
  text: וְ/רֹ֤חַב הֶֽ/חָצֵר֙ לִ/פְאַת יָ֔ם קְלָעִ֖ים חֲמִשִּׁ֣ים אַמָּ֑ה עַמֻּדֵי/הֶ֣ם עֲשָׂרָ֔ה וְ/אַדְנֵי/הֶ֖ם עֲשָׂרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/012.yaml
  text: And for the width of the court on the west side[a], there shall be hangings of fifty cubits[b], with ten pillars and ten bases.
translation:
  language: id
  text: Untuk lebar pelataran di sisi barat[a], harus ada tirai sepanjang lima puluh hasta, dengan sepuluh tiang dan sepuluh alas[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di sisi laut”; dalam bahasa Ibrani, ini merupakan ungkapan umum untuk sisi barat.
    reason: lexical_alternative
  - marker: b
    text: Atau “dudukan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/רֹחַב הֶֽ/חָצֵר֙
  choice: Untuk lebar pelataran
  rationale: רֹחַב berarti 'lebar', sedangkan חָצֵר menunjuk pada pelataran berpagar di sekeliling Kemah Suci. Bentuk 'Untuk lebar pelataran' wajar dalam rangkaian petunjuk arsitektural ini.
- source_word: לִ/פְאַת יָ֔ם
  choice: di sisi barat
  rationale: פֵאָה berarti 'sisi' atau 'tepi'. יָם secara harfiah berarti 'laut', tetapi lazim dipakai sebagai penunjuk arah barat; terjemahan utama menyampaikan arah yang dimaksud, sementara arti harfiahnya dicatat dalam catatan kaki.
- source_word: קְלָעִ֖ים
  choice: tirai
  rationale: Dalam konteks pelataran Kemah Suci, kata ini menunjuk pada bentangan kain yang membentuk pembatas. 'Tirai' alami dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: חֲמִשִּׁ֣ים אַמָּ֑ה
  choice: sepanjang lima puluh hasta
  rationale: Frasa tersebut memberikan ukuran tirai. 'Hasta' mempertahankan satuan kuno, dan 'sepanjang' memperjelas fungsi ukuran tanpa mengubah nilainya.
- source_word: עַמֻּדֵי/הֶ֣ם עֲשָׂרָ֔ה
  choice: dengan sepuluh tiang
  rationale: עַמּוּד berarti tiang atau pilar. Susunan ini mengungkapkan jumlah penyangga secara alami dalam bahasa Indonesia; sufiks jamak Ibrani merujuk pada perangkat tirai tersebut.
- source_word: וְ/אַדְנֵי/הֶ֖ם עֲשָׂרָֽה
  choice: dan sepuluh alas
  rationale: אֶדֶן dalam uraian Kemah Suci adalah bagian dasar atau dudukan bagi tiang. 'Alas' merupakan istilah umum yang mudah dipahami; kemungkinan 'dudukan' dicatat sebagai alternatif.
