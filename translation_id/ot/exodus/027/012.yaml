  source_fidelity: 'Terjemahan menyampaikan seluruh unsur teks Ibrani: lebar pelataran, sisi barat (Ibrani harfiah: sisi laut), tirai berukuran lima puluh hasta, serta sepuluh tiang dan sepuluh alas. Bentuk ''harus ada'' sesuai dengan gaya instruksional konstruksi dalam konteksnya. Penghilangan sufiks posesif pada ''tiang'' dan ''alas'' tidak mengurangi rujukan atau makna dalam bahasa Indonesia.'
