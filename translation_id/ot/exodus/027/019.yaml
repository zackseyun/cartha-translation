  yaml_path: translation/ot/exodus/027/019.yaml
  text: All the utensils of the tabernacle for all its service[a], and all its pegs, and all the pegs of the courtyard, shall be bronze.
translation:
  language: id
  text: Segala perlengkapan Kemah Suci untuk seluruh pelayanannya, semua patoknya, dan semua patok pelataran harus terbuat dari perunggu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tembaga”; kata Ibrani נְחֹשֶׁת dapat merujuk secara luas pada logam berbahan dasar tembaga.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּלֵי
  choice: perlengkapan
  rationale: כְּלִי merupakan istilah luas untuk berbagai benda atau alat. 'Perlengkapan' alami dalam bahasa Indonesia dan tidak membatasi maknanya hanya pada perabot atau perkakas tertentu.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: מִשְׁכָּן menunjuk pada tempat kediaman kudus. 'Kemah Suci' adalah istilah Indonesia yang mapan, jelas, dan sesuai dengan konteks ini.
- source_word: בְּכֹל עֲבֹדָתוֹ
  choice: untuk seluruh pelayanannya
  rationale: Frasa ini menyatakan bahwa perlengkapan tersebut dipakai bagi seluruh pekerjaan atau pelayanan yang berkaitan dengan Kemah Suci. 'Untuk' menyampaikan fungsi atau tujuan secara alami.
- source_word: יְתֵדֹתָיו
  choice: semua patoknya
  rationale: יָתֵד adalah patok yang digunakan untuk menambatkan atau mengokohkan struktur. 'Patok' ringkas dan tepat dalam konteks kemah.
- source_word: יִתְדֹת הֶחָצֵר
  choice: semua patok pelataran
  rationale: חָצֵר adalah area berpagar yang mengelilingi Kemah Suci. 'Pelataran' merupakan padanan yang jelas dan lazim dalam konteks bangunan ibadah.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: נְחֹשֶׁת dapat menunjuk pada tembaga atau logam berbahan dasar tembaga, termasuk perunggu. 'Perunggu' sesuai dengan konvensi daftar bahan Kemah Suci, sementara alternatif leksikalnya dicatat dalam catatan kaki.
