  text: Fifteen cubits of hangings for the shoulder[a], with their three pillars and their three bases.
translation:
  language: id
  text: Untuk sisi yang satu, tirai sepanjang lima belas hasta, dengan tiga tiangnya dan tiga alasnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲמֵשׁ עֶשְׂרֵה אַמָּה
  choice: sepanjang lima belas hasta
  rationale: Ungkapan ini menyatakan ukuran panjang. Penambahan 'sepanjang' membuat hubungan ukuran dengan tirai jelas dan alami dalam bahasa Indonesia tanpa menambah isi substantif.
- source_word: קְלָעִים
  choice: tirai
  rationale: Dalam konteks pelataran Kemah Suci, istilah ini menunjuk pada bentangan kain yang membentuk pagar pelataran; 'tirai' merupakan padanan Indonesia yang alami dan mudah dipahami.
- source_word: לַכָּתֵף
  choice: pada sisi yang satu
  rationale: Secara harfiah berarti 'pada bahu', tetapi dalam uraian bangunan kata ini menunjuk pada sisi atau bagian samping di sebelah pintu gerbang. 'Sisi yang satu' sesuai dengan pasangan sisi lainnya pada ayat berikut.
- source_word: עַמֻּדֵיהֶם
  choice: tiga tiang
  rationale: עַמּוּד menunjuk pada tiang penyangga. Sufiks jamaknya tidak perlu dinyatakan secara terpisah karena hubungan dengan tirai pada sisi tersebut sudah jelas dalam susunan bahasa Indonesia.
- source_word: אַדְנֵיהֶם
  choice: tiga alasnya
  rationale: אֶדֶן menunjuk pada alas atau dudukan yang menopang tiang. 'Alas' jelas dan alami; akhiran '-nya' mempertahankan hubungan posesif dalam bahasa Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan diubah secara wajar agar ukuran, lokasi, dan unsur penyangga terbaca jelas. Tidak diperlukan catatan kaki karena makna 'sisi' merupakan pemakaian kontekstual yang lazim, sedangkan 'alas' cukup mencakup fungsi dudukan tiang.
