  source_fidelity: 'Draf pada dasarnya setia pada Ibrani: מִכְבָּר diterjemahkan «kisi-kisi», מַעֲשֵׂה רֶשֶׁת mempertahankan gambaran anyaman/jala, נְחֹשֶׁת diterjemahkan «perunggu», dan «keempat sudutnya» merupakan pemaknaan yang wajar bagi קְצוֹתָיו, dengan alternatif «ujung» dicatat. Namun, טַבְּעֹת lebih tepat diterjemahkan «cincin» daripada «gelang», karena dalam konteks perlengkapan mezbah kata itu menunjuk pada cincin pemasangan, bukan perhiasan gelang.'
