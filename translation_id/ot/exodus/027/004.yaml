  terminology: «Mezbah», «kisi-kisi», «jala», dan «perunggu» sesuai dengan ragam Alkitab Indonesia modern yang baku. «Cincin» adalah istilah teknis yang lebih konsisten untuk טַבְּעֹת dalam petunjuk perlengkapan Kemah Suci.
