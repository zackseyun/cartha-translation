  text: You shall make for it a grating[a], a network of bronze[b], and on the network you shall make four bronze rings at its four corners.
translation:
  language: id
  text: Haruslah engkau membuat untuk mezbah itu sebuah kisi-kisi, yaitu anyaman jala dari perunggu; pada jala itu haruslah engkau membuat empat cincin perunggu pada keempat sudutnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pada keempat ujungnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכְבָּר
  choice: kisi-kisi
  rationale: Menunjuk pada struktur berlubang atau berjeruji yang dipasang pada mezbah; “kisi-kisi” alami dalam bahasa Indonesia dan sesuai dengan bentuk yang dijelaskan.
- source_word: מַעֲשֵׂה רֶשֶׁת
  choice: berupa jala
  rationale: Secara harfiah berarti “buatan/pekerjaan jala.” Ungkapan ini mempertahankan gambaran konstruksi berjaring sekaligus menghasilkan kalimat Indonesia yang wajar.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Dalam konteks perlengkapan Kemah Suci, “perunggu” merupakan padanan baku dan kemungkinan menunjuk pada tembaga atau paduan berbasis tembaga.
- source_word: עַל הָרֶשֶׁת
  choice: pada jala itu
  rationale: Preposisi עַל paling wajar menyatakan lokasi cincin pada jala, dan pengulangan “jala” mempertahankan kaitan leksikal dengan רֶשֶׁת sebelumnya.
- source_word: טַבְּעֹת
  choice: gelang
  rationale: Kata ini lazim menunjuk gelang logam sebagai tempat memasukkan kayu pengusung atau sebagai titik pengikat pada perlengkapan Kemah Suci.
- source_word: קְצוֹתָיו
  choice: sudutnya
  rationale: Secara leksikal berarti ujung-ujung atau bagian-bagian terluar; untuk benda persegi dengan empat titik terluar, “sudut” paling jelas dan idiomatis, sementara arti yang lebih harfiah dicatat dalam catatan kaki.
- source_word: לּוֹ
  choice: untuk mezbah itu
  rationale: Pronomina ini merujuk kepada mezbah dari konteks sebelumnya. Menyebut kembali “mezbah” menghindari ketidakjelasan pronomina bahasa Indonesia.
- source_word: וְעָשִׂיתָ
  choice: Haruslah engkau membuat
  rationale: Bentuk ini melanjutkan rangkaian perintah. “Haruslah engkau membuat” mempertahankan daya instruktif dan ragam bahasa yang khidmat namun tetap mudah dipahami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “engkau” dipakai karena perintah ditujukan kepada Musa sebagai orang kedua tunggal. Istilah teknis dibuat jelas tanpa menghilangkan citra kisi dan jala dalam teks Ibrani.
