  to: Haruslah engkau membuat untuk mezbah itu sebuah kisi-kisi, yaitu anyaman jala dari perunggu; pada jala itu haruslah engkau membuat empat cincin perunggu pada keempat sudutnya.[a]
  rationale: Revisi terbatas pada penggantian «gelang» dengan «cincin» demi ketepatan leksikal dan kejelasan idiomatis. Catatan kaki tentang alternatif «ujung» dipertahankan. Catatan kaki lama untuk «kisi-kisi» tidak diperlukan dalam teks revisi karena «yaitu anyaman jala dari perunggu» sudah menyatakan hubungan antara kisi-kisi dan pekerjaan jala secara langsung dan wajar.
