id: EXO.27.21
reference: Exodus 27:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בְּ/אֹ֣הֶל מוֹעֵד֩ מִ/ח֨וּץ לַ/פָּרֹ֜כֶת אֲשֶׁ֣ר עַל הָ/עֵדֻ֗ת יַעֲרֹךְ֩ אֹת֨/וֹ אַהֲרֹ֧ן וּ/בָנָ֛י/ו מֵ/עֶ֥רֶב עַד בֹּ֖קֶר לִ/פְנֵ֣י יְהוָ֑ה חֻקַּ֤ת עוֹלָם֙ לְ/דֹ֣רֹתָ֔/ם מֵ/אֵ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/021.yaml
  text: In the tent of meeting[a], outside the veil that is before the testimony, Aaron and his sons shall arrange it before Yahweh from evening until morning[c][b]. It shall be a perpetual statute throughout their generations from the Israelites.
translation:
  language: id
  text: Di Kemah Pertemuan, di luar tabir[a] yang berada di depan Kesaksian[b], Harun dan anak-anaknya harus menatanya[c] di hadapan Yahweh dari petang sampai pagi. Inilah ketetapan untuk selamanya bagi orang Israel turun-temurun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tirai”. Tabir ini memisahkan ruang terdalam Kemah Suci dari ruang di luarnya.'
    reason: lexical_alternative
  - marker: b
    text: “Kesaksian” kemungkinan besar merujuk pada loh-loh perjanjian yang disimpan di dalam tabut; karena itu, tabir tersebut berada di depan tabut itu.
    reason: cultural_note
  - marker: c
    text: 'Atau: “mengaturnya” atau “mengurusnya”. Kata Ibrani ini dapat menunjuk pada penataan dan pemeliharaan pelita dalam ibadah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֹהֶל מוֹעֵד
  choice: Di Kemah Pertemuan
  rationale: Memakai sebutan teknis yang lazim dan jelas untuk tempat ibadah Israel tanpa menghilangkan makna pertemuan.
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: di luar tabir
  rationale: פָּרֹכֶת adalah penyekat ruang kudus bagian dalam; 'tabir' mempertahankan nuansa khusus tempat ibadah dan tetap mudah dipahami.
- source_word: אֲשֶׁר עַל הָעֵדֻת
  choice: yang berada di depan Kesaksian
  rationale: Dalam gambaran tata ruang Kemah Suci, עַל menunjukkan posisi tabir terhadap Kesaksian yang tersimpan di dalam tabut. 'Di depan' menyampaikan hubungan ruang itu secara alami.
- source_word: יַעֲרֹךְ אֹתוֹ
  choice: harus menatanya
  rationale: ערך berarti menata atau mengatur agar siap dan terpelihara. Bentuk pronominal '-nya' mempertahankan rujukan objek tunggal dalam bahasa Ibrani tanpa menjelaskan secara berlebihan apakah yang dimaksud terutama pelita atau pelayanannya.
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: dari petang sampai pagi
  rationale: Ungkapan waktu yang lugas dan alami, yang menunjukkan berlangsungnya tugas sepanjang malam.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: '''Di hadapan'' mempertahankan ungkapan kehadiran ilahi dalam konteks ibadah, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai ''Yahweh''.'
- source_word: חֻקַּת עוֹלָם
  choice: ketetapan untuk selamanya
  rationale: Menyampaikan sifat tetap dan berkelanjutan dari ketetapan ibadah itu tanpa memakai bentuk Indonesia yang kaku.
- source_word: לְדֹרֹתָם מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: bagi orang Israel turun-temurun
  rationale: Menyampaikan bahwa ketetapan tersebut berlaku bagi umat Israel sepanjang generasi mereka. Susunan ini lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'dari orang Israel' yang dapat mengaburkan fungsi frasa.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks sumber secara langsung memakai nama perjanjian יְהוָה. 'Yahweh' mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Daya berlaku חֻקַּת עוֹלָם dalam peraturan ibadah
  choice: ketetapan untuk selamanya
  alternative: ketetapan tetap; ketetapan abadi
  rationale: Pilihan ini mempertahankan daya ikat dan kesinambungan ketetapan tersebut dalam rumusan perjanjian, tanpa menambahkan penjelasan teologis tentang cakupan akhirnya.
- issue: Rujukan הָעֵדֻת
  choice: Kesaksian
  alternative: loh-loh Kesaksian; ketetapan perjanjian
  rationale: Istilah teknis Ibrani dipertahankan agar teks tidak mempersempit rujukannya secara diam-diam; catatan kaki menjelaskan rujukan yang paling mungkin.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Istilah teknis 'Kemah Pertemuan', 'tabir', dan 'Kesaksian' dipertahankan karena penting bagi tata ruang dan ibadah Kemah Suci; catatan kaki memberi penjelasan tanpa membebani teks utama.
