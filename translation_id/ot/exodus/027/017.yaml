  yaml_path: translation/ot/exodus/027/017.yaml
  text: All the pillars around the courtyard shall be banded with silver[c][b][a], with their hooks of silver and their bases of bronze.
translation:
  language: id
  text: Semua tiang di sekeliling pelataran harus diberi pengikat dari perak[a]; kait-kaitnya harus dari perak, dan alas-alasnya dari perunggu[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dihubungkan dengan batang-batang perak” atau “dilingkari dengan perak.” Istilah Ibraninya menunjuk pada pengikat atau pekerjaan penghubung dari perak pada tiang-tiang itu.
    reason: lexical_alternative
  - marker: b
    text: Atau “soket-soketnya,” yaitu alas logam tempat tiang-tiang itu ditancapkan.
    reason: lexical_alternative
  - marker: c
    text: “Perunggu” juga dapat diterjemahkan “tembaga,” sebab istilah Ibraninya dapat mencakup tembaga atau logam paduan tembaga dalam pemakaian kuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל עַמּוּדֵי
  choice: Semua tiang
  rationale: Menyatakan keseluruhan penyangga tegak pelataran; 'semua tiang' alami dan tepat dalam konteks bangunan Kemah Suci.
- source_word: הֶחָצֵר סָבִיב
  choice: di sekeliling pelataran
  rationale: חָצֵר menunjuk pada area luar yang berpagar, sedangkan סָבִיב mencakup sisi-sisi di sekelilingnya.
- source_word: מְחֻשָּׁקִים כֶּסֶף
  choice: diberi pengikat dari perak
  rationale: Bentuk partisip pasif ini menunjuk pada perlengkapan pengikat, gelang, atau batang penghubung dari perak; pilihan ini mempertahankan cakupan makna tanpa memakai istilah teknis yang usang.
- source_word: וָוֵיהֶם
  choice: kait-kaitnya
  rationale: Dalam uraian Kemah Suci, וָו biasanya menunjuk pada kait tempat tirai dipasang.
- source_word: אַדְנֵיהֶם
  choice: alas-alasnya
  rationale: Menunjuk pada penopang logam tempat tiang ditancapkan; 'alas' mudah dipahami, sementara kemungkinan 'soket' dicatat dalam catatan kaki.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Istilah ini lazim diterjemahkan 'perunggu' dalam konteks metalurgi Kemah Suci, meskipun dapat mencakup tembaga atau paduan tembaga.
