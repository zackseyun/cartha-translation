  naturalness: Teks revisi tetap memakai bahasa Indonesia baku dan jelas. “Dan engkau” mempertahankan peralihan serta penegasan sapaan dalam וְאַתָּה tanpa terasa tidak alami. “Untuk membuat pelita tetap menyala” menyatakan tujuan dan nuansa kausatif secara lebih langsung daripada “supaya pelita tetap menyala.”
  terminology: “Anak-anak Israel,” “minyak zaitun murni,” “penerangan,” dan “pelita” sesuai dengan register naratif-instruktif Alkitab dalam bahasa Indonesia. Catatan mengenai “tetap” secara tepat menjaga kemungkinan תָּמִיד sebagai pemeliharaan kultis yang teratur, bukan klaim tentang nyala tanpa putus setiap detik.
