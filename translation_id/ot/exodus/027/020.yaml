  text: וְ/אַתָּ֞ה תְּצַוֶּ֣ה אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/יִקְח֨וּ אֵלֶ֜י/ךָ שֶׁ֣מֶן זַ֥יִת זָ֛ךְ כָּתִ֖ית לַ/מָּא֑וֹר לְ/הַעֲלֹ֥ת נֵ֖ר תָּמִֽיד׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/020.yaml
  text: And you shall command the sons of Israel that they bring to you pure beaten olive oil for the light[c][b][a], to cause a lamp to burn continually.
translation:
  language: id
  text: Dan engkau harus memerintahkan anak-anak Israel agar mereka membawa kepadamu minyak zaitun murni dari buah zaitun yang ditumbuk[b] untuk penerangan, untuk membuat pelita tetap menyala[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam pemakaian yang berkaitan dengan Kemah Suci, “tetap” dapat berarti dipelihara secara teratur dan berkelanjutan, bukan selalu tanpa jeda sesaat pun. Bandingkan Keluaran 27:21 dan Imamat 24:2–4.
    reason: cross_reference
  - marker: b
    text: “Ditumbuk” dapat juga diterjemahkan “dihancurkan”; maksudnya ialah minyak bermutu tinggi yang diperoleh dengan menumbuk buah zaitun, bukan melalui pemerasan biasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Engkau
  rationale: Pronomina mandiri menegaskan sapaan langsung kepada Musa dan menandai sedikit peralihan wacana. Bahasa Indonesia tidak perlu menerjemahkan waw secara mekanis dengan “dan”.
- source_word: תְּצַוֶּה
  choice: harus memerintahkan
  rationale: Bentuk piel menyatakan perintah atau penugasan; “harus memerintahkan” mempertahankan daya direktifnya dalam bahasa Indonesia modern.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Ungkapan harfiah “anak-anak lelaki Israel” merupakan sebutan baku bagi komunitas perjanjian. “Keturunan Israel” mempertahankan hubungan genealogis tanpa memberi kesan bahwa hanya laki-laki yang dimaksud.
- source_word: וְיִקְחוּ אֵלֶיךָ
  choice: agar mereka membawa kepadamu
  rationale: Dalam konteks penyediaan barang, לקח dengan אֶל secara idiomatis berarti mengambil atau memperoleh lalu membawanya kepada Musa.
- source_word: שֶׁמֶן זַיִת זָךְ
  choice: minyak zaitun murni
  rationale: Frasa ini menunjuk kepada minyak dari buah zaitun yang bersih atau jernih; “murni” adalah padanan alami yang tetap mencakup kualitas tersebut.
- source_word: כָּתִית
  choice: dari buah zaitun yang ditumbuk
  rationale: Kata ini menerangkan minyak yang dihasilkan dari zaitun yang ditumbuk atau dihancurkan, bukan hasil pemerasan biasa. Ungkapan eksplisit ini lebih alami daripada “minyak tumbuk”.
- source_word: לַמָּאוֹר
  choice: untuk penerangan
  rationale: מָאוֹר menunjuk kepada penerangan atau cahaya. “Untuk penerangan” alami dalam konteks fungsi minyak dan tidak menambahkan perangkat yang tidak disebutkan.
- source_word: לְהַעֲלֹת נֵר
  choice: supaya pelita ... menyala
  rationale: Secara harfiah idiom kausatif ini berarti membuat pelita naik, tetapi dalam pemakaian nyata menunjuk pada menyalakan dan memelihara nyalanya.
- source_word: תָּמִיד
  choice: tetap
  rationale: Dalam petunjuk Kemah Suci, kata ini dapat menyatakan pemeliharaan yang berlangsung secara teratur dan terus-menerus, tanpa harus berarti tidak pernah padam sesaat pun.
theological_decisions:
- issue: Cakupan sebutan בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak lelaki Israel; orang Israel; umat Israel
  rationale: Dalam konteks ini ungkapan maskulin genealogis tersebut adalah sebutan baku bagi komunitas Israel, bukan pernyataan bahwa perempuan dikecualikan. “Keturunan Israel” mempertahankan unsur asal-usul sekaligus menyampaikan cakupan kolektifnya secara wajar.
- issue: Arti keberlangsungan תָּמִיד
  choice: tetap menyala
  alternative: menyala terus-menerus; dinyalakan secara teratur
  rationale: Terjemahan utama mempertahankan gagasan keberlangsungan, sedangkan catatan menjelaskan bahwa dalam konteks peribadatan istilah ini dapat merujuk pada pemeliharaan rutin dan berkelanjutan, bukan mutlak setiap saat tanpa jeda.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Engkau” mempertahankan sapaan tunggal kepada Musa; susunan kalimat dibuat alami tanpa menghilangkan daya perintah atau istilah peribadatan.
