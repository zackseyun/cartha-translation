base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/007.yaml
  text: Its poles shall be put into the rings[b][a], and the poles shall be on the two sides of the altar when it is carried.
translation:
  language: id
  text: Kayu-kayu pengusungnya harus dimasukkan ke dalam gelang-gelang itu[a]. Kayu-kayu pengusung itu harus berada pada kedua sisi[b] mazbah ketika mazbah itu diangkut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “harus dibawa ke dalam gelang-gelang itu.” Bentuk kata kerja Ibraninya pasif dan dalam konteks ini menggambarkan pemasangan kayu-kayu pengusung untuk pengangkutan.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “sisi” juga dapat berarti bagian samping atau rusuk.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּבָא
  choice: harus dimasukkan
  rationale: Bentuk Hofal dari בוא menyatakan tindakan pasif-kausatif. Dalam konteks gelang untuk pengangkutan, 'dimasukkan' menyampaikan tindakan memasang kayu pengusung secara alami sekaligus mempertahankan unsur pasif.
- source_word: בַּדָּיו / הַבַּדִּים
  choice: kayu-kayu pengusungnya / kayu-kayu pengusung itu
  rationale: בַּד menunjuk pada batang kayu yang dipakai untuk mengangkut perlengkapan kudus. 'Kayu pengusung' jelas, konkret, dan lazim dalam konteks ini.
- source_word: בַּטַּבָּעֹת
  choice: ke dalam gelang-gelang itu
  rationale: Preposisi ב dalam konteks ini menunjukkan gelang sebagai tempat masuknya kayu pengusung. 'Ke dalam' membuat tindakan penyisipan jelas tanpa mengubah makna.
- source_word: וְהָיוּ
  choice: harus berada
  rationale: Ungkapan ini menetapkan posisi kayu-kayu pengusung setelah dimasukkan. 'Harus berada' sesuai dengan corak instruksi dan tidak menambahkan gagasan bahwa kayu itu wajib terus dibiarkan terpasang.
- source_word: שְׁתֵּי צַלְעֹת
  choice: kedua sisi
  rationale: צלעות dapat berarti sisi, bagian samping, atau rusuk. 'Kedua sisi' paling alami dalam konstruksi mazbah dan tetap mempertahankan keluasan maknanya.
- source_word: הַמִּזְבֵּחַ
  choice: mazbah
  rationale: '''Mazbah'' merupakan istilah Indonesia yang mapan untuk מזבח dalam konteks ibadah Israel dan membedakannya dari meja biasa.'
- source_word: בִּשְׂאֵת אֹתוֹ
  choice: ketika mazbah itu diangkut
  rationale: Infinitif konstruk נשׂא dengan ב menyatakan keadaan atau waktu. Penyebutan ulang 'mazbah itu' memperjelas rujukan pronomina Ibrani tanpa memasukkan pelaku yang tidak disebutkan.
