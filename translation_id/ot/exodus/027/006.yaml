lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Haruslah engkau membuat
  rationale: Bentuk perfektum Qal orang kedua tunggal maskulin dengan waw dalam konteks petunjuk berfungsi sebagai perintah; susunan ini mempertahankan daya arahannya dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: בַדִּים / בַּדֵּי
  choice: kayu-kayu pengusung
  rationale: Istilah ini menunjuk pada batang kayu untuk mengangkut perlengkapan Kemah Suci. Pilihan ini lebih jelas daripada sekadar 'batang' dan lebih alami daripada istilah arkais.
- source_word: לַמִּזְבֵּחַ
  choice: untuk mazbah itu
  rationale: Frasa sumber hanya menyebut mazbah; kata 'itu' menandai rujukan yang sudah dikenal dari konteks tanpa menambahkan jenis mazbah yang tidak disebut dalam ayat ini.
- source_word: עֲצֵי שִׁטִּים
  choice: kayu akasia
  rationale: Frasa konstruksi ini menyatakan bahan dan secara wajar diterjemahkan 'kayu akasia' dalam bahasa Indonesia modern.
- source_word: וְצִפִּיתָ
  choice: dan haruslah engkau melapisinya
  rationale: Bentuk Piel dari צפה dalam konteks pembuatan perlengkapan berarti melapisi dengan logam; 'melapisi' mempertahankan makna kerajinan tanpa menentukan teknik modern tertentu.
- source_word: אֹתָם
  choice: -nya dalam 'melapisinya'
  rationale: Pronomina jamak sumber merujuk pada kayu-kayu pengusung. Dalam bahasa Indonesia, klitik '-nya' secara alami mengacu pada keseluruhan benda jamak tersebut.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Dalam konteks perlengkapan Kemah Suci, istilah ini lazim dipahami sebagai perunggu, tetapi secara leksikal dapat pula berarti tembaga; alternatif itu dipertahankan dalam catatan kaki.
