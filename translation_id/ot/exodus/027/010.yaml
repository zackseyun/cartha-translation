lexical_decisions:
- source_word: עַמֻּדָיו
  choice: kedua puluh tiangnya
  rationale: עַמּוּד berarti 'tiang' atau 'pilar'. Akhiran orang ketiga maskulin tunggal merujuk pada sisi atau tirai yang dibicarakan dalam ayat sebelumnya; bentuk posesif '-nya' mempertahankan kaitan itu secara alami.
- source_word: אַדְנֵיהֶם
  choice: kedua puluh alasnya
  rationale: Dalam konteks Kemah Suci, אֶדֶן menunjuk pada alas atau soket yang menopang tiang. 'Alas' mudah dipahami dalam bahasa Indonesia modern, sedangkan 'soket' lebih teknis.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: נְחֹשֶׁת dapat menunjuk pada tembaga atau perunggu. 'Perunggu' adalah padanan lazim dan sesuai untuk perlengkapan Kemah Suci.
- source_word: וָוֵי
  choice: kait-kait
  rationale: וָו biasanya menunjuk pada kait dalam konstruksi Kemah Suci; bentuk ulang menandai jamak secara jelas dan alami.
- source_word: חֲשֻׁקֵיהֶם
  choice: pengikat-pengikatnya
  rationale: Rujukan arsitektural חֲשֻׁקִים tidak sepenuhnya pasti. 'Pengikat-pengikat' mempertahankan gagasan unsur yang mengikat atau menghubungkan tanpa menentukan bentuknya secara berlebihan.
- source_word: כָּסֶף
  choice: terbuat dari perak
  rationale: כֶּסֶף secara langsung berarti 'perak'. Ungkapan 'terbuat dari perak' menyatakan bahan secara alami dalam bahasa Indonesia.
- source_word: וְ
  choice: dengan / dan / sedangkan
  rationale: Konjungsi awal melanjutkan uraian ayat sebelumnya dan wajar diterjemahkan 'dengan'. Konjungsi berikutnya mengoordinasikan unsur-unsur daftar; 'sedangkan' memperjelas peralihan kepada perlengkapan tiang tanpa mengubah hubungan dasarnya.
