  text: And you shall make its horns on its four corners[a]; its horns shall be of one piece with it[b], and you shall overlay it with bronze.
translation:
  language: id
  text: Buatlah tanduk-tanduknya pada keempat sudutnya; tanduk-tanduknya harus merupakan satu kesatuan dengan mezbah itu,[a] dan lapisilah mezbah itu dengan perunggu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tanduk-tanduknya harus berasal darinya,” yaitu dibentuk menyatu dengan mezbah dan bukan dipasang secara terpisah.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani nechoshet dapat berarti perunggu atau tembaga; “perunggu” dipilih sebagai arti yang paling mungkin dalam konteks pembuatan ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Buatlah
  rationale: Bentuk perfektum Qal dengan waw dalam rangkaian petunjuk berfungsi sebagai perintah. Bentuk imperatif Indonesia menyampaikan daya instruksionalnya secara alami.
- source_word: קַרְנֹתָיו
  choice: tanduk-tanduknya
  rationale: קֶרֶן secara harfiah berarti 'tanduk' dan dalam konteks mezbah menunjuk pada tonjolan berbentuk tanduk. Pilihan ini mempertahankan gambaran konkret teks sumber.
- source_word: עַל אַרְבַּע פִּנֹּתָיו
  choice: pada keempat sudutnya
  rationale: עַל berarti 'pada/di atas', sedangkan פִּנָּה berarti 'sudut'. Ungkapan ini alami dalam bahasa Indonesia dan dekat dengan susunan Ibrani.
- source_word: מִמֶּנּוּ תִּהְיֶיןָ קַרְנֹתָיו
  choice: Tanduk-tanduk itu harus menjadi satu bagian dengan mezbah tersebut
  rationale: Secara harfiah, frasa ini berbunyi 'darinya tanduk-tanduknya akan ada'. Dalam konteks pembuatan, maksudnya ialah tanduk-tanduk itu dibentuk secara integral dengan mezbah, bukan dipasang secara terpisah.
- source_word: וְצִפִּיתָ אֹתוֹ
  choice: dan lapisilah mezbah itu
  rationale: Piel צפה berarti melapisi atau menyalut suatu benda dengan bahan tertentu. Penyebutan ulang 'mezbah itu' memperjelas acuan pronomina tanpa mengubah makna.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: נְחֹשֶׁת dapat berarti perunggu atau tembaga. Dalam konteks perlengkapan Kemah Suci dan teknologi logam kuno, 'perunggu' merupakan pilihan yang paling mungkin dan lazim.
