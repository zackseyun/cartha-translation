  text: And the width of the court on the east side[a], toward the sunrise, shall be fifty cubits.
translation:
  language: id
  text: Lebar pelataran di sisi timur, ke arah matahari terbit, harus lima puluh hasta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְרֹחַב
  choice: Lebar
  rationale: רֹחַב menyatakan ukuran lebar. Dalam bahasa Indonesia, koordinasi dengan ayat sebelumnya dapat dipahami tanpa harus menerjemahkan וְ secara tersendiri; pembukaan dengan “Lebar” lebih alami dalam rangkaian petunjuk ukuran.
- source_word: הֶחָצֵר
  choice: pelataran
  rationale: חָצֵר di sini menunjuk pada area luar Kemah Suci yang berpagar. “Pelataran” merupakan istilah Indonesia yang ringkas, wajar, dan sesuai dengan konteks tempat kudus.
- source_word: לִפְאַת קֵדְמָה
  choice: di sisi timur
  rationale: פֵאָה dapat berarti sisi, tepi, atau penjuru; bersama penunjuk arah קֵדְמָה, ungkapan “di sisi timur” menyampaikan konstruksi Ibrani secara alami.
- source_word: מִזְרָחָה
  choice: ke arah matahari terbit
  rationale: מִזְרָח berkaitan dengan tempat terbitnya matahari dan arah timur. Pilihan ini mempertahankan penegasan arah yang berulang dalam teks Ibrani tanpa sekadar mengulang kata “timur”.
- source_word: חֲמִשִּׁים אַמָּה
  choice: lima puluh hasta
  rationale: Bilangan dan satuan ukuran diterjemahkan langsung. “Hasta” adalah padanan Indonesia yang lazim untuk אַמָּה dan mempertahankan satuan kuno tanpa konversi dalam teks utama.
