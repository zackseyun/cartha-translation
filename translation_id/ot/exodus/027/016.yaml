  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/לְ/שַׁ֨עַר הֶֽ/חָצֵ֜ר מָסָ֣ךְ עֶשְׂרִ֣ים אַמָּ֗ה תְּכֵ֨לֶת וְ/אַרְגָּמָ֜ן וְ/תוֹלַ֧עַת שָׁנִ֛י וְ/שֵׁ֥שׁ מָשְׁזָ֖ר מַעֲשֵׂ֣ה רֹקֵ֑ם עַמֻּֽדֵי/הֶם֙ אַרְבָּעָ֔ה וְ/אַדְנֵי/הֶ֖ם אַרְבָּעָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/027/016.yaml
  text: And for the gate of the courtyard there shall be a screen twenty cubits long[a], of blue, purple, and scarlet yarn, and fine twined linen, the work of an embroiderer[c][b], with their four pillars and their four bases.
translation:
  language: id
  text: Untuk pintu gerbang pelataran harus dibuat sebuah tirai[a] sepanjang dua puluh hasta[b] dari benang biru, ungu, dan kirmizi serta lenan halus yang dipintal, hasil karya seorang penyulam, beserta keempat tiangnya dan keempat alasnya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tabir” atau “kain penutup” untuk jalan masuk.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dua puluh hasta”; kata “sepanjang” ditambahkan untuk memperjelas ukuran dalam petunjuk arsitektural ini.'
    reason: lexical_alternative
  - marker: c
    text: Atau “keempat soketnya”; yang dimaksud ialah dudukan tempat tiang dipasang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְשַׁעַר הֶחָצֵר
  choice: Untuk pintu gerbang pelataran
  rationale: שַׁעַר menunjuk pada pintu gerbang atau jalan masuk, sedangkan חָצֵר adalah pelataran berpagar. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan gambaran arsitekturalnya.
- source_word: מָסָךְ
  choice: sebuah tirai
  rationale: Dalam konteks Kemah Suci, kata ini menunjuk pada kain penutup di jalan masuk, bukan pintu yang padat. 'Tirai' jelas dan mudah dipahami.
- source_word: עֶשְׂרִים אַמָּה
  choice: sepanjang dua puluh hasta
  rationale: Teks Ibrani secara harfiah berbunyi 'dua puluh hasta'. Kata 'sepanjang' ditambahkan untuk memperjelas bahwa angka itu menyatakan ukuran bentangan tirai.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: benang biru, ungu, dan kirmizi
  rationale: Ketiga istilah menunjuk pada bahan tekstil berwarna. 'Benang' menyatakan konteks bahannya secara kolektif, sedangkan 'kirmizi' merupakan padanan Indonesia yang tepat dan bermartabat untuk warna merah tua ini.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: serta lenan halus yang dipintal
  rationale: שֵׁשׁ berarti lenan halus, dan מָשְׁזָר menjelaskan bahwa bahannya dibuat dari benang yang dipintal atau dipilin.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: hasil karya seorang penyulam
  rationale: Ungkapan ini menyatakan pekerjaan seorang perajin tekstil yang membuat pola beraneka warna. 'Penyulam' mempertahankan bentuk pelaku dan nuansa keterampilan khusus.
- source_word: עַמֻּדֵיהֶם אַרְבָּעָה וְאַדְנֵיהֶם אַרְבָּעָה
  choice: beserta keempat tiangnya dan keempat alasnya
  rationale: Akhiran posesif jamak dalam bahasa Ibrani dipertahankan secara semantis melalui '-nya'. אֶדֶן adalah alas atau soket penyangga tiang; 'alas' lebih mudah dipahami dalam bahasa Indonesia umum.
