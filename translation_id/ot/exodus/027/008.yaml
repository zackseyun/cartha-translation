  terminology: “Mezbah” merupakan istilah yang tepat dan lazim. “Berongga”, “papan-papan”, “gunung”, dan bentuk pasif “diperlihatkan” selaras dengan makna leksikal Ibrani dan tidak memaksakan penafsiran teologis.
