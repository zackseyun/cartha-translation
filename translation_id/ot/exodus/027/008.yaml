  yaml_path: translation/ot/exodus/027/008.yaml
  text: You shall make it hollow[a], with boards; as it was shown to you on the mountain, so shall they make it.
translation:
  language: id
  text: Buatlah mezbah itu berongga, dari papan-papan.[a] Seperti yang telah diperlihatkan kepadamu di gunung, demikianlah mereka harus membuatnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Buatlah mezbah itu dari papan-papan sehingga bagian dalamnya berongga.” Bahasa Ibrani menggambarkan mezbah sebagai bangunan berongga dari papan, bukan sebagai benda pejal.
    reason: lexical_alternative
lexical_decisions:
- source_word: נְבוּב לֻחֹת
  choice: berongga, dari papan-papan
  rationale: Ungkapan ini menggambarkan mezbah sebagai bangunan berongga yang dibuat dari papan, bukan sebagai benda pejal. Susunan ini alami dalam bahasa Indonesia dan tetap mempertahankan hubungan kedua unsur Ibrani.
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: Buatlah mezbah itu
  rationale: Bentuk orang kedua tunggal menyampaikan perintah kepada Musa. Kata ganti objek dijelaskan sebagai 'mezbah itu' agar rujukannya jelas dalam ayat mandiri.
- source_word: כַּאֲשֶׁר
  choice: Seperti
  rationale: Kata ini memperkenalkan perbandingan dengan pola yang diperlihatkan di gunung.
- source_word: הֶרְאָה אֹתְךָ
  choice: yang telah diperlihatkan kepadamu
  rationale: Bentuk Hofal orang ketiga tunggal dipertahankan sebagai pasif, sehingga pelaku ilahi yang tersirat tidak disebutkan secara eksplisit.
- source_word: בָּהָר
  choice: di gunung
  rationale: Dalam bahasa Indonesia, 'di gunung' merupakan ungkapan lokasi yang wajar dan tidak memaksakan arti preposisi Ibrani secara berlebihan.
- source_word: כֵּן יַעֲשׂוּ
  choice: demikianlah mereka harus membuatnya
  rationale: Terjemahan ini mempertahankan struktur perbandingan dan bentuk jamak yang menunjuk kepada para pelaksana pembangunan; 'harus' menyampaikan daya perintah dalam konteks.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Imperatif 'Buatlah' menjaga daya perintah, sedangkan bentuk pasif 'telah diperlihatkan' mempertahankan ketidaktersuratan pelaku dalam teks Ibrani.
