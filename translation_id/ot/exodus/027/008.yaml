  source_fidelity: Terjemahan dengan tepat menyampaikan נְבוּב לֻחֹת sebagai mezbah berongga yang berkaitan dengan papan-papan, tanpa menyatakannya sebagai mezbah pejal. Bentuk perintah tunggal kepada Musa dipertahankan dalam “Buatlah”, sedangkan Hofal הֶרְאָה diterjemahkan secara pasif (“telah diperlihatkan kepadamu”), sehingga pelaku yang tersirat tidak ditambahkan. Klausa penutup mempertahankan perbandingan dan verba jamak yang merujuk kepada para pembuatnya.
