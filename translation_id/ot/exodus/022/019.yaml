  text: זֹבֵ֥חַ לָ/אֱלֹהִ֖ים יָֽחֳרָ֑ם בִּלְתִּ֥י לַ/יהוָ֖ה לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/019.yaml
  text: Whoever sacrifices to any god[a], except to Yahweh alone, shall be devoted to destruction.
translation:
  language: id
  text: Siapa pun yang mempersembahkan kurban kepada ilah mana pun selain Yahweh saja harus dikhususkan untuk dimusnahkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “harus ditempatkan di bawah larangan pemusnahan” atau “harus dimusnahkan sama sekali.” Kata kerja Ibrani ini menyatakan bahwa seseorang dikhususkan secara tidak dapat ditarik kembali untuk dimusnahkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹבֵחַ
  choice: Siapa pun yang mempersembahkan kurban
  rationale: Partisipel Qal dipakai secara substantival untuk menyatakan siapa saja yang melakukan tindakan itu. Frasa ini alami dalam bahasa Indonesia dan mempertahankan makna kultis berupa persembahan kurban.
- source_word: לָאֱלֹהִים
  choice: kepada ilah mana pun
  rationale: אֱלֹהִים berbentuk jamak, tetapi dalam konteks larangan ini berfungsi secara generik-distributif untuk dewa apa pun selain Yahweh. 'Ilah mana pun' mempertahankan cakupan tersebut tanpa menyiratkan bahwa banyak ilah itu sah.
- source_word: יָחֳרָם
  choice: harus dikhususkan untuk dimusnahkan
  rationale: Bentuk Hofal dari חרם menyatakan bahwa seseorang ditempatkan di bawah larangan khusus dan diserahkan secara tidak dapat ditarik kembali kepada kebinasaan. Terjemahan ini mempertahankan unsur pengkhususan sekaligus hukuman.
- source_word: בִּלְתִּי
  choice: selain
  rationale: Dalam konstruksi ini, בִּלְתִּי memperkenalkan pengecualian; 'selain' adalah padanan Indonesia yang jelas dan alami.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh', dan preposisinya dipertahankan sesuai hubungan dengan tindakan mempersembahkan kurban.
- source_word: לְבַדּוֹ
  choice: saja
  rationale: 'Kata ini menegaskan eksklusivitas: kurban hanya boleh dipersembahkan kepada Yahweh. ''Saja'' terdengar alami setelah nama ilahi.'
theological_decisions:
- issue: Makna hukuman חרם dalam hukum mengenai persembahan kurban kepada ilah lain
  choice: harus dikhususkan untuk dimusnahkan
  alternative: harus dimusnahkan sama sekali; harus ditempatkan di bawah larangan pemusnahan
  rationale: 'Istilah Ibrani ini mengandung lebih dari sekadar pelaksanaan hukuman mati: orang tersebut ditempatkan di bawah חרם, yakni diserahkan secara tak dapat ditarik kembali kepada pemusnahan. Rumusan utama mempertahankan bobot konsekratif dan penghukumannya tanpa memakai jargon yang terlalu asing.'
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama perjanjian יהוה secara langsung. 'Yahweh' mempertahankan nama tersebut, bukan menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kurban' dipilih untuk konteks persembahan kultis; 'ilah' membedakan dewa yang disembah dari nama Yahweh. Penanda catatan kaki ditempatkan tepat setelah klausa hukuman yang dijelaskannya.
