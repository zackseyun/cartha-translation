id: EXO.22.22
reference: Exodus 22:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִם עַנֵּ֥ה תְעַנֶּ֖ה אֹת֑/וֹ כִּ֣י אִם צָעֹ֤ק יִצְעַק֙ אֵלַ֔/י שָׁמֹ֥עַ אֶשְׁמַ֖ע צַעֲקָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/022.yaml
  text: If you indeed afflict him[a], and if he indeed cries out to me[b], I will surely hear his cry.
translation:
  language: id
  text: Jika engkau sungguh-sungguh menindas dia[a], dan jika dia sungguh-sungguh berseru kepada-Ku[b], Aku pasti mendengar seruannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani memakai kata ganti maskulin tunggal, yang di sini berlaku bagi setiap janda atau anak yatim yang disebut pada ayat sebelumnya.
    reason: cultural_note
  - marker: b
    text: Dalam ungkapan “sungguh-sungguh menindas,” “sungguh-sungguh berseru,” dan “pasti mendengar,” bahasa Ibrani mengulang akar verba melalui gabungan infinitif absolut dan verba finit untuk memberi penegasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Partikel ini memperkenalkan syarat dan paling langsung diterjemahkan dengan “jika” dalam konteks hukum ini.
- source_word: עַנֵּה תְעַנֶּה
  choice: sungguh-sungguh menindas
  rationale: Gabungan infinitif absolut dan verba finit menegaskan tindakan. “Sungguh-sungguh” mempertahankan penekanan itu, sedangkan “menindas” menyampaikan perlakuan yang menyengsarakan dalam konteks larangan terhadap orang rentan.
- source_word: אֹתוֹ
  choice: dia
  rationale: Akhiran Ibrani berbentuk maskulin tunggal dan menunjuk secara distributif kepada setiap janda atau anak yatim yang disebut pada ayat sebelumnya. “Dia” mempertahankan bentuk tunggal tanpa menandai gender dalam bahasa Indonesia.
- source_word: כִּי אִם
  choice: dan jika
  rationale: Dalam rangkaian ini frasa tersebut melanjutkan kondisi dengan tindakan berikutnya, bukan menyatakan pertentangan.
- source_word: צָעֹק יִצְעַק
  choice: dia sungguh-sungguh berseru
  rationale: Infinitif absolut bersama verba imperfek memberi penegasan. “Sungguh-sungguh berseru” menyampaikan intensitas tanpa menambahkan alasan atau isi seruan.
- source_word: אֵלַי
  choice: kepada-Ku
  rationale: Menyatakan arah seruan kepada Allah secara langsung dan alami.
- source_word: שָׁמֹעַ אֶשְׁמַע
  choice: Aku pasti mendengar
  rationale: Konstruksi infinitif absolut dengan verba finit menegaskan kepastian tanggapan Allah. “Pasti” mengungkapkan penekanan itu secara idiomatis.
- source_word: צַעֲקָתוֹ
  choice: seruannya
  rationale: Pilihan ini alami dalam bahasa Indonesia dan mempertahankan hubungan leksikal dengan verba “berseru” dalam klausa sebelumnya.
theological_decisions:
- issue: Kata ganti tunggal bagi orang yang ditindas
  choice: dia / seruannya
  alternative: mereka / seruan mereka
  rationale: Akhiran Ibrani berbentuk maskulin tunggal, tetapi dalam konteksnya menunjuk secara distributif kepada siapa pun dari kelompok rentan pada ayat sebelumnya. Bahasa Indonesia memungkinkan bentuk tunggal “dia” tanpa menetapkan gender, sehingga bentuk sumber dan cakupan konteks sama-sama terpelihara.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Bentuk “engkau” mempertahankan sapaan tunggal dalam teks Ibrani; kapitalisasi pada “-Ku” dan “Aku” menandai pembicara ilahi menurut konvensi penerbitan Alkitab bahasa Indonesia.
