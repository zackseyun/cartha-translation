base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/029.yaml
  text: 'You shall do the same with your ox and with your flock: seven days it shall remain with its mother[b][a]; on the eighth day you shall give it to me.'
translation:
  language: id
  text: 'Demikianlah harus kaulakukan terhadap lembumu dan kawanan kambing dombamu: tujuh hari lamanya hewan itu harus tetap bersama induknya[a]; pada hari kedelapan haruslah kauberikan hewan itu kepada-Ku.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “ia akan berada bersama induknya.” Kata “tetap” mengungkapkan makna duratif dalam konteks ini. Perintah ini berlanjut dari konteks sebelumnya mengenai persembahan anak sulung, meskipun kata “sulung” tidak diulang dalam ayat ini.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן תַּעֲשֶׂה
  choice: Lakukanlah hal yang sama
  rationale: Mengungkapkan daya komparatif כֵּן dan kekuatan perintah dari bentuk imperfek dalam konteks hukum, sambil menghubungkannya dengan ketentuan sebelumnya.
- source_word: לְשֹׁרְךָ
  choice: terhadap lembu
  rationale: Preposisi לְ menyatakan hal yang dikenai aturan. 'Lembu' merupakan istilah umum yang wajar dan tidak mempersempit makna menjadi lembu jantan.
- source_word: לְצֹאנֶךָ
  choice: kawanan kambing dombamu
  rationale: צֹאן adalah sebutan kolektif bagi ternak kecil, terutama domba dan kambing; 'kawanan kambing domba' menyampaikan cakupan itu secara jelas dalam bahasa Indonesia.
- source_word: שִׁבְעַת יָמִים יִהְיֶה עִם אִמּוֹ
  choice: selama tujuh hari ... harus tetap bersama induknya
  rationale: Frasa waktu menunjukkan durasi. Secara harfiah verba berarti 'akan berada', tetapi 'harus tetap bersama' menyampaikan makna duratif dan daya normatif konteks hukum.
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: pada hari kedelapan
  rationale: Padanan temporal yang langsung, alami, dan tepat.
- source_word: תִּתְּנוֹ לִי
  choice: haruslah kamu memberikannya kepada-Ku
  rationale: Mempertahankan arti langsung נתן, objek pronominal, dan tuntutan perjanjian yang diarahkan kepada Allah.
theological_decisions:
- issue: Acuan kepada hewan yang sulung
  choice: Menampilkan 'anak yang sulung itu' sebagai unsur tersirat dari konteks ayat sebelumnya dan menandainya dengan catatan kaki.
  alternative: 'Tidak mengulang ''yang sulung'' dalam teks utama: ''selama tujuh hari anaknya harus tetap bersama induknya.'''
  rationale: Bahasa Ibrani ayat ini tidak mengulang kata 'yang sulung', tetapi כֵּן mengaitkan perintah ini dengan tuntutan mengenai anak sulung dalam konteks sebelumnya. Penambahan terbatas ini mencegah acuan yang kabur tanpa mengembangkan teologi korban melampaui sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam hukum-perjanjian yang lugas dan bermartabat. 'Kambing domba' dipakai untuk cakupan kolektif צֹאן, sedangkan kapitalisasi pada '-Ku' mengikuti konvensi Indonesia untuk rujukan kepada Allah.
