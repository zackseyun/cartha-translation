translation:
  language: id
  text: Tetapi jika binatang itu benar-benar dicuri darinya[a], ia harus memberikan ganti rugi kepada pemiliknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jika dengan pencurian itu dicuri dari padanya.” Bahasa Ibrani memakai pengulangan bentuk kata kerja untuk penegasan; maksudnya dapat juga, “jika itu memang dicuri ketika berada dalam penjagaannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Tetapi jika
  rationale: Dalam rangkaian hukum kasus ini, penghubung tersebut memperkenalkan keadaan yang berlawanan dengan kasus sebelumnya; “tetapi jika” menyampaikan fungsi itu secara alami.
- source_word: גָּנֹב יִגָּנֵב
  choice: benar-benar dicuri
  rationale: Gabungan infinitif absolut dan verba finit dari akar yang sama menegaskan tindakan pencurian. “Benar-benar dicuri” mempertahankan penekanan tersebut dalam bahasa Indonesia. Objek tersirat dijelaskan sebagai “binatang itu” berdasarkan konteks langsung.
- source_word: מֵעִמּוֹ
  choice: darinya
  rationale: Secara harfiah berarti “dari bersamanya”; dalam konteks hukum ini, maksudnya ialah binatang itu dicuri ketika berada dalam penjagaannya. “Darinya” merupakan padanan langsung dan alami, sementara nuansa penjagaan diterangkan dalam catatan kaki.
- source_word: יְשַׁלֵּם
  choice: harus memberikan ganti rugi
  rationale: Bentuk piel שלם dalam konteks hukum menyatakan pembayaran kompensasi atau penggantian kerugian. Frasa ini menyampaikan kewajiban hukum dengan jelas.
- source_word: לִבְעָלָיו
  choice: kepada pemiliknya
  rationale: בעל dalam konteks ini menunjuk kepada pemilik binatang yang dipercayakan. Bentuk pronominalnya dinyatakan secara alami dengan “-nya”.
