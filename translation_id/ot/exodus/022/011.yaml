translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernuansa hukum tanpa menjadi kaku. “Ia” dipakai untuk orang yang menerima titipan, sedangkan “pemiliknya” tetap alami dan tidak menambah penafsiran teologis.
