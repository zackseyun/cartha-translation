base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/015.yaml
  text: If a man seduces a virgin who is not betrothed[a], and lies with her[b], he must surely pay the bride-price for her to be his wife.
translation:
  language: id
  text: Jika seorang laki-laki membujuk seorang perawan yang belum bertunangan, lalu bersetubuh dengannya, ia wajib membayar mahar perkawinan agar perempuan itu menjadi istrinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Mahar perkawinan” menerjemahkan istilah Ibrani mohar, yaitu pembayaran yang berkaitan dengan perkawinan dan diberikan oleh pihak laki-laki atau keluarganya, bukan harta yang dibawa oleh pihak perempuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְפַתֶּה
  choice: membujuk
  rationale: Bentuk Piel dari פתה di sini menyatakan tindakan membujuk atau memikat dalam konteks seksual. “Membujuk” mempertahankan cakupan makna itu tanpa memasukkan unsur kekerasan yang tidak dinyatakan oleh kata tersebut.
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Nomina tunggal maskulin ini menunjuk kepada seorang laki-laki; terjemahan mempertahankan kekhususan gender sumber.
- source_word: בְּתוּלָה
  choice: seorang perawan
  rationale: Dalam konteks hukum dan perkawinan ini, בְּתוּלָה menunjuk kepada perempuan yang belum pernah berhubungan seksual; “perawan” mempertahankan status yang relevan bagi ketentuan tersebut.
- source_word: אֲשֶׁר לֹא אֹרָשָׂה
  choice: yang belum bertunangan
  rationale: Bentuk pasif ini menyatakan bahwa perempuan tersebut belum terikat dalam pertunangan resmi. “Belum bertunangan” alami dalam bahasa Indonesia modern dan cukup tepat secara hukum-sosial.
- source_word: וְשָׁכַב עִמָּהּ
  choice: lalu tidur dengannya
  rationale: שׁכב dengan עִם merupakan ungkapan baku bagi hubungan seksual. “Tidur dengannya” adalah ungkapan Indonesia yang alami dan tetap santun.
- source_word: מָהֹר יִמְהָרֶנָּה
  choice: ia harus membayar penuh mahar perkawinan
  rationale: Gabungan infinitif absolut dan bentuk verba berhingga menegaskan kewajiban. Akar מהר di sini merujuk pada pembayaran mohar oleh pihak laki-laki sehubungan dengan perkawinan. “Mahar perkawinan” lebih mudah dipahami dalam bahasa Indonesia, sedangkan catatan menjelaskan ciri pembayaran tersebut.
- source_word: לּוֹ לְאִשָּׁה
  choice: untuk mengambil perempuan itu sebagai istrinya
  rationale: Frasa ini menyatakan hasil perkawinan yang terkait dengan pembayaran tersebut. “Mengambil ... sebagai istrinya” menyampaikan hubungan sintaksis dan akibat hukumnya secara alami.
theological_decisions:
- issue: Sifat tindakan seksual yang digambarkan oleh פתה
  choice: Bujukan seksual, tanpa menyatakan adanya kekerasan
  alternative: Pemerkosaan atau pelanggaran seksual dengan paksaan
  rationale: Makna lazim Piel פתה mendukung “membujuk” atau “memikat”. Terjemahan tidak menambahkan paksaan yang tidak dinyatakan dalam ayat ini, sekaligus tidak membuat penilaian lebih jauh mengenai seluruh keadaan atau tingkat kebebasan pihak perempuan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Ungkapan “tidur dengannya” dipilih sebagai idiom seksual yang umum dan santun; “mahar perkawinan” disertai catatan agar perbedaan budaya dan arah pembayarannya tidak kabur.
