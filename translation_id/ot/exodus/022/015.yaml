review_pass:
  verdict: revise
  source_fidelity: Terjemahan pada dasarnya setia kepada Ibrani. Namun, “membayar penuh” dapat menyiratkan kuantitas atau pelunasan penuh yang tidak dinyatakan secara khusus oleh konstruksi infinitif absolut + imperfect; konstruksi itu terutama menegaskan kewajiban. “Bersetubuh dengannya” secara lebih jelas menyampaikan idiom seksual וְשָׁכַב עִמָּהּ daripada “tidur dengannya.”
  naturalness: Versi revisi memakai bahasa Indonesia modern dan bermartabat. “Bersetubuh” tepat dalam register hukum/kitab suci dan menghindari ambiguitas nonseksual dari “tidur dengannya.” “Agar perempuan itu menjadi istrinya” lebih alami daripada “untuk mengambil perempuan itu sebagai istrinya,” tanpa mengubah hasil perkawinan yang dinyatakan teks.
  terminology: “Perawan,” “bertunangan,” dan “mahar perkawinan” sesuai konteks hukum kuno. Catatan kaki dengan tepat menjelaskan bahwa mohar adalah pembayaran dari pihak laki-laki atau keluarganya, bukan harta yang dibawa pihak perempuan. “Membujuk” mempertahankan makna פתה tanpa menambahkan paksaan.
  issues:
  - severity: medium
    issue: “Tidur dengannya” berpotensi ambigu dalam bahasa Indonesia.
    rationale: Ungkapan Ibrani שׁכב עם adalah idiom untuk hubungan seksual. “Bersetubuh dengannya” menyampaikan makna itu secara eksplisit, santun, dan sesuai register hukum.
  - severity: low
    issue: “Membayar penuh” menambahkan nuansa kuantitas/pelunasan.
    rationale: Penegasan Ibrani מָהֹר יִמְהָרֶנָּה menekankan kepastian kewajiban membayar, bukan bahwa suatu jumlah disebut dibayar “penuh.” “Wajib membayar” cukup menangkap daya wajibnya.
  - severity: low
    issue: “Mengambil perempuan itu sebagai istrinya” kurang alami dan dapat membawa nuansa tindakan sepihak.
    rationale: Frasa לּוֹ לְאִשָּׁה menyatakan hasil atau tujuan perkawinan. “Agar perempuan itu menjadi istrinya” menyampaikan relasi yang sama secara lebih netral dan alami.
  revised_text: Jika seorang laki-laki membujuk seorang perawan yang belum bertunangan, lalu bersetubuh dengannya, ia wajib membayar mahar perkawinan agar perempuan itu menjadi istrinya.[a]
