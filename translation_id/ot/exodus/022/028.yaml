  yaml_path: translation/ot/exodus/022/028.yaml
  text: You shall not delay the fullness of your harvest and the outflow of your press[a]. You shall give to me the firstborn of your sons.
translation:
  language: id
  text: Janganlah menunda mempersembahkan hasil panenmu yang berlimpah dan hasil perasanmu[a]. Anak sulung laki-lakimu harus kauberikan kepada-Ku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepenuhanmu dan cairanmu.” Kedua istilah Ibrani ini tampaknya menunjuk pada hasil pertanian padat dan cair; mungkin secara khusus gandum dan anggur, tetapi kepastiannya tidak diketahui.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְלֵאָתְךָ
  choice: hasil panenmu yang berlimpah
  rationale: Nomina ini secara harfiah menunjuk pada kepenuhan atau hasil yang penuh. Dalam konteks hukum persembahan, ungkapan ini secara alami dipahami sebagai hasil panen yang melimpah.
- source_word: וְדִמְעֲךָ
  choice: hasil perasanmu
  rationale: Walaupun nomina ini dapat berarti 'air mata', dalam konteks pertanian istilah ini menunjuk pada hasil cair yang diperas, kemungkinan anggur atau minyak. 'Hasil perasanmu' mempertahankan gambaran itu tanpa mempersempit maknanya.
- source_word: לֹא תְאַחֵר
  choice: Janganlah menunda mempersembahkan
  rationale: Bentuk verba berarti menunda atau mengundurkan. Penambahan 'mempersembahkan' menyatakan tindakan yang tersirat oleh konteks hukum dan menghasilkan bahasa Indonesia yang jelas.
- source_word: בְּכוֹר בָּנֶיךָ
  choice: Anak sulung dari antara anak-anak lelakimu
  rationale: בְּכוֹר adalah anak sulung, sedangkan בָּנֶיךָ secara khusus berarti anak-anak lelakimu. Rumusan ini mempertahankan jenis kelamin yang dinyatakan teks dan menjelaskan hubungan partitifnya.
- source_word: תִּתֶּן לִּי
  choice: harus kauberikan kepada-Ku
  rationale: Bentuk imperfek dalam hukum menyatakan kewajiban. 'Harus kauberikan' terdengar alami dan tegas dalam bahasa Indonesia, sementara 'kepada-Ku' mempertahankan penekanan pada penerima ilahi.
theological_decisions:
- issue: Makna pasangan hasil pertanian מְלֵאָה / דִמְעָה
  choice: Hasil panen yang berlimpah dan hasil perasan
  alternative: Gandum dan anggur secara khusus; atau hasil pertama secara umum tanpa membedakan hasil padat dan cair
  rationale: Teks Ibrani tampaknya memasangkan hasil pertanian padat dengan hasil cair dari pemerasan. Terjemahan tidak membatasi hasil cair itu pada anggur saja, sehingga ambiguitas aslinya tetap terpelihara.
- issue: Cakupan בָּנֶיךָ
  choice: anak-anak lelakimu
  alternative: anak-anakmu
  rationale: Kata Ibrani yang digunakan berbentuk maskulin dan dalam konteks ini merujuk kepada anak lelaki; terjemahan tidak menetralkannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum yang khidmat. Bentuk 'kauberikan' mengikuti ejaan baku; kapital pada '-Ku' menandai Allah sebagai pembicara. Kata 'mempersembahkan' dibuat eksplisit demi kejelasan konteks, tanpa menentukan jenis persembahan lebih jauh.
