translation:
  language: id
  text: maka murka-Ku akan menyala, dan Aku akan membunuh kalian dengan pedang, dan istri-istri kalian akan menjadi janda dan putra-putra kalian akan menjadi yatim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam konteks ini, mereka menjadi yatim karena ayah mereka dibunuh.
    reason: lexical_clarification
lexical_decisions:
- source_word: וְחָרָה אַפִּי
  choice: maka murka-Ku akan menyala
  rationale: Ungkapan חרה אף menyatakan kemarahan yang berkobar. 'Murka-Ku akan menyala' mempertahankan metafora sumber sekaligus terdengar wajar dan bermartabat dalam bahasa Indonesia.
- source_word: וְהָרַגְתִּי אֶתְכֶם
  choice: dan Aku akan membunuh kalian
  rationale: הרג adalah verba umum untuk membunuh. Bentuk orang kedua jamak dinyatakan dengan 'kalian' agar jumlahnya jelas.
- source_word: בֶּחָרֶב
  choice: dengan pedang
  rationale: Preposisi בְּ di sini menandai alat atau sarana; 'dengan pedang' mempertahankan gambaran konkret penghakiman dengan kekerasan.
- source_word: וְהָיוּ נְשֵׁיכֶם אַלְמָנוֹת
  choice: sehingga istri-istri kalian menjadi janda
  rationale: Dalam konteks keluarga, נָשִׁים berarti para istri. Hubungan akibat dari hukuman sebelumnya dinyatakan secara alami dengan 'sehingga ... menjadi'.
- source_word: וּבְנֵיכֶם יְתֹמִים
  choice: dan anak-anak lelaki kalian menjadi yatim
  rationale: בנים dipertahankan sebagai istilah khusus laki-laki, sedangkan יְתוֹמִים diterjemahkan 'yatim', yang dalam pemakaian Indonesia secara khusus berarti anak yang kehilangan ayah.
theological_decisions:
- issue: Ungkapan antropomorfis tentang kemarahan ilahi
  choice: maka murka-Ku akan menyala
  alternative: maka hidung-Ku akan menjadi panas; maka amarah-Ku akan berkobar
  rationale: Terjemahan harfiah anggota tubuh akan mengaburkan idiom Ibrani. Pilihan ini menyampaikan penghakiman ilahi dan tetap mempertahankan metafora nyala.
- issue: Istilah keturunan yang berjenis kelamin laki-laki
  choice: anak-anak lelaki kalian
  alternative: anak-anak kalian
  rationale: Teks sumber memakai בנים, 'anak-anak lelaki/putra-putra'. Karena konteks tidak menuntut generalisasi, kekhususan itu dipertahankan.
- issue: Makna יָתוֹם dalam konteks kematian para ayah
  choice: yatim
  alternative: yatim piatu
  rationale: Akibat yang digambarkan ialah kematian para suami/ayah, bukan para ibu. 'Yatim' secara tepat menunjukkan kehilangan ayah, sedangkan 'yatim piatu' akan menambahkan kehilangan ibu yang tidak disebutkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk memperjelas orang kedua jamak. Kapitalisasi pronomina ilahi mengikuti kebiasaan luas penerbitan Alkitab bahasa Indonesia. Konjungsi 'sehingga' mengungkapkan akibat yang jelas dalam urutan kalimat tanpa mengubah isi.
