  yaml_path: translation/ot/exodus/022/001.yaml
  text: If the thief is found breaking in and is struck so that he dies[b][a], there is no bloodguilt for him.
translation:
  language: id
  text: Jika seorang pencuri kedapatan melakukan pembobolan, lalu ia dipukul hingga mati, orang yang memukulnya tidak bersalah atas pertumpahan darah itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak ada darah baginya.” Ini adalah ungkapan hukum yang berarti bahwa orang yang memukul pencuri itu tidak memikul kesalahan atas darah yang tertumpah dalam keadaan ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמַּחְתֶּרֶת
  choice: sedang membobol
  rationale: Nomina ini menunjuk pada tindakan masuk secara paksa atau diam-diam, khususnya dengan membongkar atau menggali tembok. Ungkapan verbal ini paling alami dalam bahasa Indonesia modern tanpa membatasi caranya sebagai terowongan.
- source_word: יִמָּצֵא
  choice: kedapatan
  rationale: Bentuk nifal menyatakan bahwa pencuri itu didapati dalam keadaan melakukan pembobolan; 'kedapatan' ringkas dan sesuai dengan rumusan hukum bersyarat.
- source_word: הַגַּנָּב
  choice: seorang pencuri
  rationale: Kata ini adalah istilah umum untuk pencuri. Dalam konstruksi bersyarat bahasa Indonesia, 'seorang pencuri' lebih alami daripada 'pencuri itu' pada penyebutan pertama.
- source_word: וְהֻכָּה
  choice: lalu dipukul
  rationale: Bentuk pasif dari נכה berarti dikenai pukulan. 'Dipukul' tidak menyiratkan pukulan berulang seperti 'dipukuli'.
- source_word: וָמֵת
  choice: hingga mati
  rationale: Rangkaian verba menyatakan akibat dari pukulan. 'Hingga mati' menyampaikan hubungan hasil secara alami, tanpa memastikan maksud pelaku.
- source_word: אֵין לוֹ דָּמִים
  choice: orang yang memukulnya tidak menanggung utang darah
  rationale: דָּמִים adalah idiom hukum tentang tanggung jawab atas darah yang tertumpah. Subjek rujukan dijelaskan agar tidak rancu, sedangkan 'utang darah' mempertahankan kategori hukum Ibrani dan tidak mempersempitnya menjadi istilah pidana modern.
theological_decisions:
- issue: Status hukum kematian pencuri dalam pembobolan
  choice: Menyatakan bahwa orang yang memukul tidak menanggung utang darah dalam kasus ini.
  alternative: Ia tidak bersalah melakukan pembunuhan.
  rationale: Teks Ibrani menetapkan ketiadaan tanggung jawab atas darah dalam keadaan tertentu, bukan memberi pembenaran umum untuk membunuh. 'Utang darah' menjaga kategori hukum-perjanjian dan menghindari penyamaan langsung dengan klasifikasi pidana modern.
translation_notes:
  register: Bahasa hukum yang jelas, modern, dan bermartabat. 'Membobol' dipilih sebagai padanan idiomatis untuk tindakan masuk dengan membongkar atau secara sembunyi-sembunyi. Penanda catatan kaki ditempatkan sesudah klausa yang dijelaskannya.
