  text: You shall not let a sorceress live[a].
translation:
  language: id
  text: Jangan biarkan seorang perempuan ahli sihir tetap hidup.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "seorang penyihir perempuan." Kata benda Ibrani ini berbentuk feminin tunggal dan secara khusus merujuk kepada perempuan yang mempraktikkan ilmu sihir.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְכַשֵּׁפָה
  choice: seorang perempuan ahli sihir
  rationale: Nomina Ibrani ini berbentuk feminin tunggal dan menunjuk secara khusus kepada perempuan yang mempraktikkan ilmu sihir. Ungkapan ini mempertahankan penandaan gender secara jelas dalam bahasa Indonesia modern.
- source_word: לֹא
  choice: jangan
  rationale: Partikel negasi ini, bersama bentuk verba orang kedua dalam konteks hukum, secara alami dinyatakan sebagai larangan dengan kata 'jangan'.
- source_word: תְחַיֶּה
  choice: biarkan ... tetap hidup
  rationale: Bentuk Piel imperfek orang kedua maskulin tunggal dari חיה di sini berarti membuat atau membiarkan tetap hidup. Terjemahan ini dekat dengan susunan Ibrani dan tidak memperluasnya menjadi rumusan hukuman mati yang lebih eksplisit.
theological_decisions:
- issue: Gender pelaku yang disebutkan
  choice: Mempertahankan bentuk feminin tunggal dengan 'seorang perempuan ahli sihir'.
  alternative: Menerjemahkan secara generik sebagai 'ahli sihir' atau 'orang yang melakukan sihir'.
  rationale: Teks Ibrani secara eksplisit memakai nomina feminin tunggal; penandaan tersebut perlu dipertahankan dan tidak dinetralkan.
- issue: Daya larangan hukum
  choice: Menerjemahkan sebagai larangan membiarkan orang itu tetap hidup.
  alternative: Menerjemahkan lebih interpretatif sebagai 'harus dihukum mati'.
  rationale: Walaupun akibat hukumnya menyiratkan kematian dalam konteks hukum perjanjian, teks Ibrani sendiri berbunyi 'jangan biarkan tetap hidup'. Terjemahan mempertahankan ungkapan itu tanpa menambahkan mekanisme penghukuman.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. 'Perempuan ahli sihir' dipilih karena alami serta mempertahankan gender feminin yang ditandai dalam bahasa Ibrani; 'tetap hidup' memperjelas daya resultatif verba tanpa mengubahnya menjadi formula hukuman yang lebih eksplisit.
