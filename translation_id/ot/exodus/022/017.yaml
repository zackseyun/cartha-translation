  source_fidelity: Teks Indonesia mempertahankan nomina feminin tunggal מְכַשֵּׁפָה melalui “seorang perempuan ahli sihir” dan menerjemahkan לֹא תְחַיֶּה secara dekat sebagai larangan untuk membiarkannya tetap hidup. Terjemahan ini tidak menambahkan cara pelaksanaan hukuman yang tidak dinyatakan dalam teks Ibrani.
  naturalness: “Jangan biarkan seorang perempuan ahli sihir tetap hidup” merupakan bahasa Indonesia baku yang jelas, ringkas, dan cocok bagi register hukum. Susunannya alami meskipun bernada formal, sebagaimana layak untuk perundang-undangan kuno.
  terminology: “Ahli sihir” merupakan padanan yang tepat untuk pelaku praktik sihir; penambahan “perempuan” mempertahankan penandaan feminin eksplisit dalam bahasa Ibrani. Catatan kaki menawarkan “penyihir perempuan” sebagai alternatif leksikal tanpa mengaburkan gender atau memperkenalkan penafsiran tambahan.
