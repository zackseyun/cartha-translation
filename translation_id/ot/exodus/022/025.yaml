translation:
  language: id
  text: Jika engkau mengambil pakaian luar[a] sesamamu sebagai jaminan, engkau harus mengembalikannya kepadanya sebelum matahari terbenam.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pakaian” atau “jubah.” Istilah Ibrani ini menunjuk pada penutup luar yang dapat dipakai sebagai pelindung pada malam hari.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “sampai datangnya matahari”; ungkapan ini dalam konteks ini berarti sebelum matahari terbenam.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Mempertahankan bentuk bersyarat dalam hukum kasuistik Ibrani; “apabila” juga mungkin, tetapi “jika” lebih langsung.
- source_word: חָבֹל תַּחְבֹּל
  choice: mengambil ... sebagai jaminan
  rationale: Gabungan infinitif absolut dan bentuk verba menegaskan tindakan mengambil barang gadai. Pengulangan harfiah tidak alami dalam bahasa Indonesia, sehingga makna hukumnya dinyatakan dengan jelas.
- source_word: שַׂלְמַת
  choice: jubah
  rationale: Kata ini menunjuk pada pakaian luar atau penutup tubuh yang juga dapat melindungi pemakainya pada malam hari; “jubah” ringkas dan mudah dipahami.
- source_word: רֵעֶךָ
  choice: sesamamu
  rationale: Dalam konteks hukum sosial, “sesamamu” menyampaikan hubungan dengan orang lain dalam komunitas tanpa membatasinya pada orang yang tinggal berdekatan.
- source_word: עַד בֹּא הַשֶּׁמֶשׁ
  choice: sebelum matahari terbenam
  rationale: Ungkapan harfiahnya, “sampai datangnya matahari,” merupakan idiom kontekstual untuk terbenamnya matahari; terjemahan ini menyatakan batas waktunya secara alami.
- source_word: תְּשִׁיבֶנּוּ לוֹ
  choice: engkau harus mengembalikannya kepadanya
  rationale: Bentuk kausatif dari שוב berarti membuat sesuatu kembali atau memulihkannya kepada pemilik; “harus” menyampaikan daya wajib dari ketentuan hukum ini.
