  text: You shall not afflict any widow or orphan[a][b].
translation:
  language: id
  text: Janganlah kamu menindas janda atau anak yatim mana pun.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anak tanpa ayah” untuk “anak yatim.”
    reason: lexical_alternative
  - marker: b
    text: Atau “menyengsarakan” atau “memperlakukan dengan buruk” untuk “menindas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: seorang ... pun
  rationale: Dalam larangan dengan nomina tunggal, כָּל bersifat distributif dan mencakup siapa pun dalam kedua golongan itu. Konstruksi Indonesia “seorang ... pun” menyampaikan daya cakup tersebut secara alami.
- source_word: אַלְמָנָה
  choice: janda
  rationale: Padanan baku, langsung, dan alami untuk perempuan yang suaminya telah meninggal.
- source_word: יָתוֹם
  choice: anak yatim
  rationale: Dalam konteks hukum Ibrani, istilah ini menunjuk anak yang kehilangan ayah, meskipun dapat pula dipahami lebih luas sebagai anak tanpa orang tua. “Anak yatim” merupakan padanan Indonesia yang paling alami.
- source_word: לֹא
  choice: jangan
  rationale: Bentuk negasi ini menyatakan larangan dan secara alami diterjemahkan dengan “jangan”.
- source_word: תְעַנּוּן
  choice: menindas
  rationale: Bentuk Piel dari ענה di sini berarti menyebabkan penderitaan atau memperlakukan dengan keras. “Menindas” mempertahankan bobot tindakan itu, sementara “menyengsarakan” dan “memperlakukan dengan buruk” tetap mungkin.
