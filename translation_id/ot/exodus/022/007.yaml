base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/007.yaml
  text: If the thief is not found[a], the owner of the house shall come near to God to determine whether he has not laid his hand on his neighbor’s property.
translation:
  language: id
  text: Jika pencuri itu tidak ditemukan, pemilik rumah harus menghadap Allah[a] untuk menentukan apakah ia tidak mengulurkan tangannya kepada milik sesamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: para hakim. Teks Ibrani berbunyi “Allah”, tetapi dalam beberapa konteks hukum istilah ini mungkin menunjuk kepada para hakim yang bertindak dengan kewenangan ilahi.'
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּצֵא הַגַּנָּב
  choice: pencuri itu tidak ditemukan
  rationale: Bentuk Nifal dari מצא menyatakan keadaan pasif, yaitu pencuri itu tidak ditemukan. Pilihan ini tidak mempersempit maknanya menjadi sekadar tertangkap.
- source_word: וְנִקְרַב
  choice: harus menghadap
  rationale: Dalam konteks hukum, קרב bentuk Nifal dapat berarti datang mendekat atau dibawa mendekat. 'Menghadap' menyampaikan tindakan mendekat untuk suatu pemeriksaan resmi secara alami dalam bahasa Indonesia tanpa menentukan siapa yang membawanya.
- source_word: בַּעַל הַבַּיִת
  choice: pemilik rumah
  rationale: Ungkapan ini menunjuk kepada orang yang memiliki atau menguasai rumah tersebut; 'pemilik rumah' merupakan padanan hukum yang jelas dan wajar.
- source_word: אֶל הָאֱלֹהִים
  choice: menghadap Allah
  rationale: Teks Ibrani secara langsung memakai אֱלֹהִים, 'Allah'. Kata kerja 'menghadap' sesuai dengan suasana pemeriksaan hukum, sementara kemungkinan bahwa istilah ini menunjuk kepada para hakim dipertahankan dalam catatan kaki.
- source_word: אִם לֹא שָׁלַח יָדוֹ
  choice: apakah ia tidak mengambil
  rationale: Ungkapan harfiah 'mengulurkan tangannya' dalam konteks ini menyatakan tindakan mengambil atau memakai secara tidak sah. 'Mengambil' menyampaikan maksud hukumnya dengan jelas, sedangkan unsur negatif dan ketidakpastian tetap dipertahankan.
- source_word: בִּמְלֶאכֶת רֵעֵהוּ
  choice: milik sesamanya
  rationale: Dalam konteks barang yang dipercayakan, מְלָאכָה menunjuk kepada apa yang menjadi milik atau berada dalam urusan sesama. 'Milik sesamanya' cukup luas dan tidak membatasinya pada satu jenis barang.
theological_decisions:
- issue: Makna אֱלֹהִים dalam perkara hukum ini
  choice: Allah
  alternative: para hakim
  rationale: Nilai leksikal langsung teks Ibrani adalah 'Allah'. Namun, dalam beberapa konteks hukum perjanjian, istilah tersebut dapat dipahami sebagai para hakim yang menjalankan kewenangan ilahi. Teks utama mempertahankan bacaan langsung dan catatan kaki menyajikan kemungkinan yudisial itu tanpa menutup ambiguitas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Rumusan hukum dibuat jelas bagi pembaca umum. 'Menghadap' dipilih agar lebih alami daripada 'datang mendekat', dan ambiguitas אֱלֹהִים dipertahankan melalui catatan kaki.
