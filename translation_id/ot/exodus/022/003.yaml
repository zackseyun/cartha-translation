  text: If the stolen item is actually found alive in his possession—whether ox[a], donkey, or sheep—he shall repay double.
translation:
  language: id
  text: Jika barang curian itu benar-benar ditemukan masih hidup dalam penguasaannya[a]—entah sapi, keledai, atau domba—ia harus mengganti dua kali lipat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jika barang curian itu sungguh-sungguh ditemukan di tangannya.” Bahasa Ibrani memakai gabungan bentuk kata kerja untuk memberi penegasan (“sungguh-sungguh ditemukan”), dan ungkapan “di tangannya” berarti berada dalam penguasaan atau miliknya.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Partikel bersyarat ini memperkenalkan ketentuan dalam hukum kasuistik.
- source_word: הִמָּצֵא תִמָּצֵא
  choice: benar-benar ditemukan
  rationale: Gabungan infinitif absolut dan verba finit Nifal menegaskan tindakan menemukan; “benar-benar ditemukan” menyampaikan penekanan itu secara wajar dalam bahasa Indonesia modern.
- source_word: בְיָדוֹ
  choice: dalam penguasaannya
  rationale: Secara harfiah berarti “di tangannya”, tetapi dalam konteks hukum ungkapan ini menunjuk pada kepemilikan, penguasaan, atau kendali atas barang tersebut.
- source_word: הַגְּנֵבָה
  choice: barang curian itu
  rationale: Nomina ini di sini menunjuk pada benda atau harta yang dicuri, bukan tindakan pencurian. “Barang curian” jelas dan alami dalam konteks hukum.
- source_word: מִשּׁוֹר עַד חֲמוֹר עַד שֶׂה
  choice: baik sapi, keledai, maupun domba
  rationale: Rangkaian ini menyebut beberapa jenis ternak yang mungkin menjadi barang curian. Susunan “baik … maupun …” menyampaikan cakupan distributifnya dengan alami.
- source_word: חַיִּים
  choice: hidup
  rationale: Kata ini menyatakan bahwa hewan curian tersebut ditemukan dalam keadaan hidup, berbeda dari keadaan sudah disembelih atau mati.
- source_word: שְׁנַיִם יְשַׁלֵּם
  choice: ia harus membayar ganti rugi dua kali lipat
  rationale: Formula hukum ini mewajibkan penggantian sebesar dua kali nilai atau jumlah yang dicuri. Frasa ini mempertahankan daya wajib dan sifat restitutifnya.
