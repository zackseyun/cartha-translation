translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan subjek 'laki-laki itu' menghindari ketidakjelasan pronomina. Istilah 'mahar' dipakai dalam arti pembayaran perkawinan kepada keluarga perempuan dalam konteks Israel kuno, bukan untuk memasukkan ketentuan tradisi keagamaan modern.
