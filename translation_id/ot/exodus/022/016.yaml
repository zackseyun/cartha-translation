  source_fidelity: 'Teks ini dengan setia menerjemahkan unsur-unsur utama Ibrani: kondisi אִם, penegasan מָאֵן יְמָאֵן melalui “dengan tegas menolak,” persetujuan ayah untuk “memberikan dia kepada laki-laki itu,” serta kewajiban laki-laki tersebut untuk menimbang perak menurut ukuran mahar yang berlaku bagi para perawan. “Harus menimbang perak” secara tepat mempertahankan arti konkret יִשְׁקֹל tanpa menghilangkan fungsi pembayarannya dalam konteks hukum.'
