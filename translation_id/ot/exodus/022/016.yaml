base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/016.yaml
  text: If her father absolutely refuses to give her to him[b][a], he shall weigh out silver equal to the bride-price for virgins.
translation:
  language: id
  text: Jika ayahnya dengan tegas menolak memberikan dia kepada laki-laki itu[a], laki-laki itu harus menimbang perak senilai mahar bagi para perawan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menikahkan dia dengan laki-laki itu.” Secara harfiah, “memberikan dia kepadanya”; dalam konteks ini ungkapan tersebut merujuk pada persetujuan ayah atas perkawinan.
    reason: lexical_alternative
  - marker: b
    text: Perak pada masa itu dibayarkan dengan menimbang logam menurut beratnya, bukan dengan memakai uang logam.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Partikel syarat baku yang memperkenalkan kondisi dalam hukum kasus.
- source_word: מָאֵן יְמָאֵן
  choice: dengan tegas menolak
  rationale: Infinitif absolut yang diikuti verba finit menguatkan tindakan penolakan; frasa ini menyampaikan penegasan tersebut secara alami dalam bahasa Indonesia.
- source_word: אָבִיהָ
  choice: ayahnya
  rationale: Bentuk dengan sufiks feminin tunggal orang ketiga berarti 'ayahnya', yakni ayah perempuan yang dibicarakan dalam ayat sebelumnya.
- source_word: לְתִתָּהּ לוֹ
  choice: memberikan dia kepada laki-laki itu
  rationale: Mempertahankan ungkapan Ibrani secara dekat; dalam konteks hukum perkawinan, ungkapan ini mengacu pada persetujuan ayah untuk menikahkan anak perempuannya.
- source_word: כֶּסֶף
  choice: perak
  rationale: Makna konkretnya adalah perak, yang dalam transaksi kuno berfungsi sebagai alat pembayaran.
- source_word: יִשְׁקֹל
  choice: harus menimbang
  rationale: Secara harfiah berarti 'menimbang' dan mencerminkan pembayaran dengan logam perak berdasarkan berat, bukan dengan uang logam.
- source_word: כְּמֹהַר
  choice: senilai mahar
  rationale: מֹהַר menunjuk pada pembayaran perkawinan kepada keluarga mempelai perempuan; 'senilai' menyampaikan unsur perbandingan כְּ dengan wajar.
- source_word: הַבְּתוּלֹת
  choice: bagi para perawan
  rationale: Bentuk jamak dengan artikel merujuk secara umum pada besaran mahar yang berlaku bagi perempuan-perempuan perawan.
