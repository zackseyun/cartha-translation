  terminology: “Jubah” sesuai bagi שִׂמְלָה dalam konteks pakaian luar yang dipakai sebagai penutup malam. “Penuh belas kasihan” merupakan terjemahan yang baik untuk חַנּוּן. Catatan kaki sebaiknya menawarkan alternatif leksikal yang lebih dekat daripada “murah hati,” yang terutama berarti dermawan.
