  text: כִּ֣י הִ֤וא כסות/ה לְ/בַדָּ֔/הּ הִ֥וא שִׂמְלָת֖/וֹ לְ/עֹר֑/וֹ בַּ/מֶּ֣ה יִשְׁכָּ֔ב וְ/הָיָה֙ כִּֽי יִצְעַ֣ק אֵלַ֔/י וְ/שָׁמַעְתִּ֖י כִּֽי חַנּ֥וּן אָֽנִי־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/026.yaml
  text: For it is his only covering; it is his cloak for his skin. In what will he lie down? And if he cries out to me[a], I will hear, for I am compassionate.
translation:
  language: id
  text: Sebab itulah satu-satunya penutupnya; itulah jubah yang menutupi kulitnya. Dengan apa ia akan tidur? Jika ia berseru kepada-Ku, Aku akan mendengarnya, sebab Aku penuh belas kasihan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pengasih” atau “berbelas kasihan.”'
    reason: Alternatif leksikal bagi חַנּוּן.
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan bagi perintah pada ayat sebelumnya dan mempertahankan hubungan penjelasnya.
- source_word: כְּסוּתֹה לְבַדָּהּ
  choice: satu-satunya penutup tubuhnya
  rationale: Ketiv/Qere menunjuk pada penutup milik orang itu, sedangkan לְבַדָּהּ menegaskan bahwa tidak ada penutup lain; 'tubuh' ditambahkan secara idiomatis untuk memperjelas fungsi penutup tanpa mengubah makna.
- source_word: שִׂמְלָתוֹ לְעֹרוֹ
  choice: pakaiannya untuk kulitnya
  rationale: Mempertahankan gambaran konkret עוֹר, 'kulit', dan menerjemahkan שִׂמְלָה secara umum sebagai pakaian yang juga dapat dipakai sebagai selimut malam.
- source_word: בַּמֶּה יִשְׁכָּב
  choice: Dengan apa ia akan berbaring?
  rationale: Pertanyaan retoris ini mempertahankan unsur instrumental בַּמֶּה dan arti dasar שׁכב, yakni berbaring.
- source_word: וְהָיָה כִּי יִצְעַק אֵלַי
  choice: Jika ia berseru kepada-Ku
  rationale: Konstruksi kontingensi Ibrani dialihkan secara wajar ke bahasa Indonesia tanpa ungkapan harfiah yang kaku; צעק menyatakan seruan minta tolong dalam kesusahan.
- source_word: וְשָׁמַעְתִּי
  choice: Aku akan mendengarnya
  rationale: Objek tersirat dibuat eksplisit secara alami dalam bahasa Indonesia, sambil mempertahankan arti bahwa Allah mendengar dan menanggapi seruan itu.
- source_word: חַנּוּן
  choice: penuh belas kasihan
  rationale: Mengungkapkan sifat Allah yang berkenan menolong orang rentan; pilihan ini alami dalam bahasa Indonesia dan sesuai konteks, sementara nuansa 'murah hati' atau 'pengasih' tetap mungkin.
theological_decisions:
- issue: Penerjemahan sifat ilahi חַנּוּן
  choice: penuh belas kasihan
  alternative: pengasih; murah hati
  rationale: Dalam konteks hukum perlindungan orang miskin, ungkapan ini menonjolkan belas kasihan Allah terhadap orang yang berseru tanpa mempersempit istilah tersebut menjadi rumusan doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'ia' menjaga kelancaran narasi hukum; kapitalisasi pada enklitik dalam 'kepada-Ku' menandai rujukan ilahi sesuai kebiasaan penerbitan Alkitab Indonesia. Tanda catatan kaki ditempatkan setelah klausa yang memuat istilah terkait.
