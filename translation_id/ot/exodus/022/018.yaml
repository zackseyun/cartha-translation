translation:
  language: id
  text: Siapa pun yang bersetubuh dengan seekor binatang pasti dihukum mati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “pasti akan dihukum mati.” Rumusan hukum Ibrani ini menegaskan kepastian hukuman mati.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל שֹׁכֵב
  choice: Siapa pun yang bersetubuh
  rationale: כָּל yang diikuti partisip membentuk ungkapan umum tak tentu, sehingga wajar diterjemahkan “siapa pun yang”. שׁכב dengan עִם merupakan ungkapan untuk hubungan seksual; “bersetubuh” menyampaikan maknanya secara jelas, bermartabat, dan tidak rancu.
- source_word: עִם
  choice: dengan
  rationale: Preposisi ini menghubungkan tindakan seksual dengan objeknya dan secara langsung sepadan dengan “dengan”.
- source_word: בְּהֵמָה
  choice: seekor binatang
  rationale: Kata ini menunjuk pada binatang atau hewan; “seekor binatang” alami dalam bahasa Indonesia dan mempertahankan bentuk tunggal tak tentu.
- source_word: מוֹת יוּמָת
  choice: harus dihukum mati
  rationale: Gabungan infinitif absolut dan bentuk pasif verba מות menegaskan kepastian hukuman mati. “Harus dihukum mati” mempertahankan daya wajib, pasif, dan yudisial rumusan hukum ini.
theological_decisions:
- issue: Penerjemahan rumusan hukum tentang hukuman mati
  choice: harus dihukum mati
  alternative: pasti akan mati
  rationale: Bentuk Ibrani secara harfiah dapat dicerminkan sebagai “pasti akan mati”, tetapi dalam konteks hukum bentuk pasifnya menyatakan hukuman mati yang pasti. Terjemahan utama memperjelas daya yudisial tanpa menetapkan pelaksana atau cara penghukuman.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada hukum. “Bersetubuh” dipilih daripada ungkapan yang lebih samar agar makna seksual sumber jelas tanpa menjadi vulgar; “dihukum mati” mempertahankan sifat pasif dan yudisial teks.
