translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan gaya hukum yang tetap mudah dipahami. Istilah “ternak” dipilih daripada “binatang” karena konteksnya adalah hewan peliharaan yang merumput dan merusak lahan. Penanda catatan kaki [a] dan [b] dicantumkan dalam teks utama.
