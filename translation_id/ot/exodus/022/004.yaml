  naturalness: “Dirumputi” kurang lazim dalam bahasa Indonesia baku untuk kerusakan tanaman oleh ternak. “Dimakan ternak” jelas, alami, dan sesuai konteks hukum. Susunan revisi mempertahankan gaya hukum kasuistik yang modern.
  terminology: “Ternak,” “ladang,” “kebun anggur,” dan “memberikan ganti rugi” sesuai dengan konteks agraris dan hukum. “Yang terbaik” mempertahankan keluasan makna מֵיטַב tanpa menambahkan bentuk kompensasi tertentu.
