  to: Jika seseorang menyebabkan suatu ladang atau kebun anggur dimakan ternak[a], dan ia melepaskan ternaknya sehingga ternak itu merumput di ladang orang lain[b], ia harus memberikan ganti rugi dari yang terbaik dari ladangnya dan yang terbaik dari kebun anggurnya.
