base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/004.yaml
  text: If a man causes a field or vineyard to be grazed over[a], and lets his animal loose so that it grazes in another man's field[b], he shall make restitution from the best of his own field and the best of his own vineyard.
translation:
  language: id
  text: Jika seseorang menyebabkan suatu ladang atau kebun anggur dimakan ternak[a], dan ia melepaskan ternaknya sehingga ternak itu merumput di ladang orang lain[b], ia harus memberikan ganti rugi dari yang terbaik dari ladangnya dan yang terbaik dari kebun anggurnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “membakar suatu ladang atau kebun anggur.” Dalam beberapa konteks kata kerja Ibrani בער dapat berarti “membakar”, tetapi penyebutan tentang pelepasan ternak sesudahnya sangat mendukung arti ternak merumput atau memakan tanaman di sini.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “di ladang lain”; kepemilikan oleh orang lain tersirat dalam konteks hukum ini.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Jika
  rationale: Dalam rumusan hukum kasuistik, כִּי memperkenalkan suatu keadaan bersyarat; “jika” merupakan padanan hukum yang alami dalam bahasa Indonesia.
- source_word: יַבְעֶר
  choice: membiarkan ... dirumputi
  rationale: Bentuk Hifil menyatakan penyebab, dan konteks pelepasan ternak mendukung makna membiarkan lahan dimakan atau dirumputi, bukan membakarnya.
- source_word: שָׂדֶה אוֹ כֶרֶם
  choice: ladangnya atau kebun anggurnya
  rationale: Kedua istilah pertanian diterjemahkan secara langsung; sufiks kepunyaan dipahami dari rangkaian kalimat dan dinyatakan agar hubungan dengan ternak milik pelaku jelas.
- source_word: וְשִׁלַּח אֶת־בְּעִירֹה
  choice: lalu melepaskan ternaknya
  rationale: שִׁלַּח berarti melepas atau membiarkan pergi, sedangkan בְּעִיר menunjuk pada hewan ternak. “Ternaknya” alami dalam konteks kerusakan lahan dan dapat berfungsi secara generik.
- source_word: וּבִעֵר בִּשְׂדֵה אַחֵר
  choice: sehingga ternak itu merumput di ladang orang lain
  rationale: Pengulangan בער meneruskan gambaran ternak yang memakan tanaman. “Sehingga” menyatakan hasil pelepasan ternak secara alami tanpa menghilangkan kaitan tindakannya.
- source_word: אַחֵר
  choice: orang lain
  rationale: Secara harfiah berarti “yang lain”; dalam konteks hukum, maksudnya ialah lahan milik pihak lain, sehingga kepemilikan tersirat dibuat jelas.
- source_word: מֵיטַב שָׂדֵהוּ וּמֵיטַב כַּרְמוֹ
  choice: dengan hasil terbaik dari ladangnya sendiri dan hasil terbaik dari kebun anggurnya sendiri
  rationale: מֵיטַב menunjuk pada bagian atau hasil yang terbaik. Kata “hasil” memperjelas bentuk ganti rugi yang berasal dari lahan dan kebun pelaku, sedangkan “sendiri” menegaskan sumber pembayaran.
- source_word: יְשַׁלֵּם
  choice: ia harus mengganti kerugian
  rationale: Bentuk Piel dari שׁלם dalam hukum perjanjian menyatakan pembayaran kompensasi; “harus mengganti kerugian” menyampaikan kewajiban hukum dengan bahasa Indonesia yang wajar.
