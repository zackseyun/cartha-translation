  naturalness: Bahasa draf umumnya jelas dan wajar. Penggantian “hewan” dengan “barang” membuatnya lebih setia pada sumber dan tetap alami dalam ragam hukum Indonesia. “Biaya sewanya sudah mencakup risiko itu” menjelaskan idiom yang sangat ringkas tanpa mengklaim bahwa kerugian tertentu telah benar-benar terjadi.
  terminology: “Pemilik,” “peminjam,” dan “membayar ganti rugi” sesuai dengan konteks hukum. “Barang sewaan” mempertahankan kemungkinan bahwa yang dimaksud bukan hanya hewan. Catatan kaki perlu diperbaiki agar alternatif pekerja upahan tidak menyebut hewan yang tidak ada dalam ayat.
