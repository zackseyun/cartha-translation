    rationale: Alternatif personal dalam Ibrani tetap sangat eliptis dan tidak secara eksplisit menyebut hewan. Catatan perlu memakai rujukan yang lebih umum serta menjelaskan bahwa pemahaman tersebut bersifat alternatif.
