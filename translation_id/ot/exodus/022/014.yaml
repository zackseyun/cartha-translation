  yaml_path: translation/ot/exodus/022/014.yaml
  text: If its owner is with it[a], he shall not make restitution; if it is a hired thing, it came for its hire.
translation:
  language: id
  text: Jika pemiliknya ada bersama barang itu, si peminjam tidak perlu membayar ganti rugi. Jika barang itu barang sewaan, biaya sewanya sudah mencakup risiko itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jika ia seorang pekerja upahan, hal itu termasuk dalam upahnya.” Bahasa Ibraninya sangat ringkas dan dapat dipahami sebagai merujuk kepada barang sewaan atau kepada seorang pekerja upahan. Dalam konteks tanggung jawab atas barang pinjaman, teks utama memahaminya sebagai rujukan kepada barang sewaan.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּעָלָיו
  choice: pemiliknya
  rationale: Dalam konteks hukum mengenai hewan pinjaman atau sewaan, בַּעַל berarti pemilik; akhiran pronominalnya merujuk kepada hewan yang dibicarakan.
- source_word: עִמּוֹ
  choice: ada bersama hewan itu
  rationale: עִמּוֹ secara harfiah berarti 'bersamanya'. Penyebutan 'hewan itu' memperjelas rujukan pronomina menurut konteks tanpa mengubah keadaan hukum yang dimaksud, yaitu pemilik menyertai hewan tersebut.
- source_word: לֹא יְשַׁלֵּם
  choice: tidak perlu membayar ganti rugi
  rationale: Bentuk piel dari שׁלם dalam konteks hukum menyatakan pembayaran kompensasi atau ganti rugi. Ungkapan ini menyampaikan kewajiban hukum dengan wajar dalam bahasa Indonesia.
- source_word: שָׂכִיר
  choice: hewan itu disewa
  rationale: Walaupun שָׂכִיר lazim dipakai untuk pekerja upahan, konteks langsung membahas tanggung jawab atas hewan pinjaman. Karena itu, bacaan utama memahami kata ini secara eliptis sebagai hewan sewaan, sedangkan kemungkinan bacaan personal dipertahankan dalam catatan kaki.
- source_word: בָּא בִּשְׂכָרוֹ
  choice: kerugian tersebut sudah tercakup dalam biaya sewanya
  rationale: Ungkapan Ibrani ini sangat ringkas, secara harfiah kira-kira 'itu datang dengan/dalam sewanya'. Dalam konteks hukum penyewaan, maksudnya ialah bahwa risiko kerugian telah diperhitungkan dalam biaya sewa; terjemahan ini menyampaikan fungsi idiom tersebut dengan bahasa Indonesia yang jelas.
theological_decisions:
- issue: Subjek pada klausa אִם שָׂכִיר הוּא dan rujukan akhiran dalam בִּשְׂכָרוֹ
  choice: Klausa utama dipahami sebagai merujuk kepada hewan sewaan dan biaya sewanya.
  alternative: 'Klausa dapat dipahami sebagai merujuk kepada seorang pekerja upahan: ''Jika orang itu seorang pekerja upahan, hewan itu datang sebagai bagian dari upahnya.'''
  rationale: Bahasa Ibraninya ringkas dan memungkinkan kedua pemahaman. Konteks hukum tentang hewan pinjaman mendukung bacaan hewan sewaan, tetapi ambiguitas asli tidak dihapus dan dicatat secara terbuka.
translation_notes:
  register: Bahasa hukum dibuat jelas tetapi tetap wajar bagi pembaca umum. 'Si peminjam' dan 'hewan itu' memperjelas rujukan yang tersirat dari konteks ayat sebelumnya. Klausa terakhir diterjemahkan secara idiomatis agar dapat dipahami, sementara kemungkinan bacaan lain dipertahankan dalam catatan kaki.
