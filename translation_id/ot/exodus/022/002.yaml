base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/002.yaml
  text: But if the sun has risen on him[a], there is bloodguilt for him. He must surely make restitution. If he has nothing[c][b], then he shall be sold for his theft.
translation:
  language: id
  text: Namun, jika matahari sudah terbit atas pencuri itu[a], orang yang membunuhnya bersalah atas penumpahan darah[b]. Pencuri itu harus membayar ganti rugi sepenuhnya. Jika ia tidak mempunyai apa-apa, ia harus dijual karena pencuriannya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jika matahari telah terbit atasnya”; maksud hukumnya dapat diungkapkan sebagai “jika hal itu terjadi sesudah matahari terbit” atau “pada siang hari.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ada darah baginya.” Maksudnya, orang yang membunuh pencuri dalam keadaan ini bersalah atas penumpahan darah.
    reason: alternative_reading
  - marker: c
    text: Penjualan ini merupakan cara melunasi kewajiban ganti rugi akibat pencurian ketika pencuri tidak mempunyai sarana untuk membayarnya.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Namun, jika
  rationale: Partikel ini pada dasarnya menyatakan syarat, tetapi di sini kasusnya berlawanan dengan keadaan pada ayat sebelumnya; “Namun, jika” menyampaikan hubungan tersebut secara alami.
- source_word: זָרְחָה הַשֶּׁמֶשׁ עָלָיו
  choice: matahari sudah terbit atas pencuri itu
  rationale: Mempertahankan gambaran konkret Ibrani tentang matahari yang terbit atas orang itu, sambil memperjelas bahwa pronomina tersebut menunjuk kepada pencuri dalam konteks.
- source_word: דָּמִים לוֹ
  choice: orang yang membunuhnya menanggung utang darah
  rationale: Dalam konteks hukum, bentuk jamak דָּמִים menyatakan pertanggungjawaban atas penumpahan darah. Ungkapan “utang darah” mempertahankan bobot hukum dan moral frasa Ibrani, sedangkan subjek diperjelas dari kontras dengan ayat sebelumnya.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: harus membayar ganti rugi sepenuhnya
  rationale: Gabungan infinitif absolut dan bentuk verba menegaskan kewajiban pembayaran. “Membayar ganti rugi sepenuhnya” sesuai dengan konteks hukum pencurian dan menyampaikan penekanannya.
- source_word: אִם אֵין לוֹ
  choice: Jika ia tidak mempunyai apa-apa
  rationale: Terjemahan idiomatis bagi keadaan ketika pencuri tidak memiliki harta atau sarana untuk memenuhi kewajiban ganti rugi.
- source_word: וְנִמְכַּר
  choice: ia harus dijual
  rationale: Bentuk pasif menyatakan konsekuensi hukum berupa penjualan ke dalam pengabdian untuk melunasi kewajiban, tanpa memasukkan rincian yang tidak dinyatakan langsung dalam teks.
- source_word: בִּגְנֵבָתוֹ
  choice: karena pencuriannya
  rationale: Mempertahankan nomina Ibrani dan menyatakan dasar hukum penjualan itu secara ringkas.
theological_decisions:
- issue: Akibat hukum membunuh pencuri sesudah matahari terbit
  choice: Pembunuh pencuri menanggung utang darah apabila matahari sudah terbit atas pencuri itu.
  alternative: Ungkapan tentang matahari dapat dipahami lebih luas sebagai keadaan ketika ancaman dan identitas pelaku dapat diketahui dengan jelas, bukan semata-mata batas waktu matahari terbit.
  rationale: Teks utama mempertahankan gambaran waktu yang konkret dan kontras dengan kasus malam hari pada ayat sebelumnya. Implikasi yang lebih luas tidak dimasukkan ke dalam teks karena tidak dinyatakan secara eksplisit.
- issue: Peralihan subjek antara pertanggungjawaban darah dan pembayaran ganti rugi
  choice: Subjek kalimat pertama diperjelas sebagai orang yang membunuh pencuri, sedangkan subjek kewajiban ganti rugi diperjelas sebagai pencuri.
  alternative: Semua pronomina dapat dibiarkan tanpa penjelasan, mengikuti bentuk Ibrani secara lebih harfiah.
  rationale: Bahasa Ibrani mengandalkan konteks untuk peralihan subjek. Penyebutan nomina dalam bahasa Indonesia mencegah kesan keliru bahwa pembunuhlah yang harus mengganti barang curian, tanpa mengubah isi hukumnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah hukum “utang darah” mempertahankan corak konkret teks Ibrani, sementara “membayar ganti rugi sepenuhnya” dan penyebutan ulang “pencuri itu” membuat alur hukum jelas bagi pembaca umum. Semua penjelasan interpretatif tambahan ditempatkan dalam catatan kaki.
