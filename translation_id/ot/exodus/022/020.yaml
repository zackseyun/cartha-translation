  text: וְ/גֵ֥ר לֹא תוֹנֶ֖ה וְ/לֹ֣א תִלְחָצֶ֑/נּוּ כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/020.yaml
  text: You shall not mistreat a foreigner or oppress him[a], for you were foreigners in the land of Egypt.
translation:
  language: id
  text: Jangan perlakukan seorang pendatang dengan tidak adil dan jangan menindasnya[a], sebab dahulu kamu juga adalah pendatang di tanah Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang asing yang menetap.” Kata Ibrani גֵר menunjuk pada orang non-Israel yang tinggal menetap di tengah masyarakat Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵר / גֵרִים
  choice: pendatang
  rationale: Istilah ini menunjuk pada orang bukan pribumi yang menetap di tengah masyarakat Israel, bukan sekadar orang yang sedang lewat. “Pendatang” jelas dan wajar dalam bahasa Indonesia modern serta dapat dipakai secara konsisten dalam bentuk tunggal dan jamak.
- source_word: תוֹנֶה
  choice: perlakukan ... dengan tidak adil
  rationale: Bentuk Hifil dari ינה menyatakan perlakuan yang salah atau tidak adil. Ungkapan ini mempertahankan cakupan luas kata tersebut tanpa membatasinya hanya pada eksploitasi ekonomi.
- source_word: תִלְחָצֶנּוּ
  choice: menindasnya
  rationale: לחץ dalam konteks hukum ini menyatakan tekanan keras atau penindasan. Akhiran orang ketiga maskulin tunggal dipertahankan melalui “-nya” dan merujuk kepada “pendatang” tunggal.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi kedua larangan dan mempertahankan hubungan penjelas yang ringkas.
- source_word: הֱיִיתֶם
  choice: dahulu kamu pun adalah
  rationale: היה menyatakan keadaan Israel pada masa lampau. “Dahulu” memperjelas acuan waktunya, sedangkan “pun” menonjolkan kaitan etis antara pengalaman Israel dan perlakuan mereka terhadap pendatang.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: di tanah Mesir
  rationale: Terjemahan ini mempertahankan unsur אֶרֶץ secara alami dan tetap sesuai dengan ragam bahasa Alkitab yang bermartabat.
theological_decisions:
- issue: Rujukan tunggal maskulin yang berfungsi generik
  choice: Mempertahankan “pendatang” dalam bentuk tunggal dan akhiran “-nya”.
  alternative: Mengubahnya menjadi bentuk jamak, seperti “para pendatang ... mereka”.
  rationale: Teks Ibrani memakai גֵר tunggal dengan akhiran orang ketiga maskulin tunggal. Bahasa Indonesia memungkinkan bentuk tunggal generik dipertahankan secara alami tanpa menambahkan gender yang tidak perlu.
- issue: Pengulangan identitas Israel sebagai גֵרִים
  choice: Menerjemahkan istilah yang sama secara konsisten sebagai “pendatang”.
  alternative: Membedakan istilah pertama dan kedua, misalnya “orang asing” lalu “pendatang”.
  rationale: Pengulangan leksikal menghubungkan langsung kewajiban Israel dengan pengalaman mereka sendiri di Mesir; konsistensi menjaga daya teologis dan etis hubungan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk larangan langsung mempertahankan gaya hukum teks Ibrani; “pendatang” dipilih karena mudah dipahami sekaligus menunjukkan bahwa orang tersebut tinggal di tengah masyarakat, bukan hanya sedang berkunjung.
