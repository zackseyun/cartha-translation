  verdict: revise
  source_fidelity: Draf dengan tepat mempertahankan struktur bersyarat, penitipan uang atau barang, pencurian dari rumah penerima titipan, penemuan pencuri, dan kewajiban restitusi dua kali lipat. Namun, "semuanya itu" menambahkan penegasan totalitas yang tidak dinyatakan secara eksplisit oleh bentuk tunggal kolektif Ibrani dan kurang alami dalam konteks alternatif "uang atau barang".
  naturalness: Bahasanya umumnya lugas dan modern. "Barang titipan itu" lebih idiomatis daripada "semuanya itu" dan merujuk dengan jelas kepada harta yang dipercayakan. "Orang yang menerimanya" secara alami menjelaskan bahwa rumah yang dimaksud ialah rumah penerima titipan.
  terminology: '"Uang," "barang," "sesamanya," dan "pencuri" sesuai dengan cakupan istilah Ibrani. "Membayar ganti rugi dua kali lipat" menyampaikan fungsi yĕšallēm šĕnayim sebagai restitusi tanpa membatasi jenis barang yang dicuri.'
