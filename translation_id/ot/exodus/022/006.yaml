translation:
  language: id
  text: Jika seseorang menyerahkan uang atau barang kepada sesamanya untuk disimpan, lalu barang titipan itu dicuri dari rumah orang yang menerimanya, jika pencurinya ditemukan, pencuri itu harus membayar ganti rugi dua kali lipat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Jika
  rationale: Dalam rumusan hukum kasuistik, kata ini memperkenalkan syarat atau perkara hipotetis.
- source_word: יִתֵּן אִישׁ
  choice: seseorang menyerahkan
  rationale: אִישׁ secara harfiah berarti 'seorang laki-laki', tetapi dalam rumusan hukum ini berfungsi secara umum. 'Seseorang' alami dalam bahasa Indonesia dan tidak mempersempit cakupan hukum.
- source_word: אֶל רֵעֵהוּ
  choice: kepada sesamanya
  rationale: רֵעַ menunjuk kepada orang lain dalam lingkungan sosial atau komunitas; 'sesamanya' mempertahankan relasi tersebut tanpa menyiratkan kedekatan pribadi.
- source_word: כֶּסֶף
  choice: uang
  rationale: Makna harfiahnya 'perak', tetapi dalam konteks ekonomi dan penitipan, kata ini lazim merujuk pada uang.
- source_word: אוֹ כֵלִים
  choice: atau barang
  rationale: כֵלִים adalah istilah luas untuk perkakas, benda, atau barang milik. 'Barang' paling alami dan cukup luas dalam bahasa Indonesia.
- source_word: לִשְׁמֹר
  choice: untuk disimpan
  rationale: Infinitif ini menyatakan tujuan penitipan, yakni agar harta tersebut dijaga atau disimpan dengan aman.
- source_word: וְגֻנַּב
  choice: lalu semuanya itu dicuri
  rationale: Bentuk pasif merujuk secara kolektif kepada uang atau barang yang dititipkan. 'Semuanya itu' menghindari ketidakjelasan rujukan dalam bahasa Indonesia.
- source_word: מִבֵּית הָאִישׁ
  choice: dari rumah orang tersebut
  rationale: Yang dimaksud ialah rumah pihak yang menerima titipan. 'Orang tersebut' mengacu kembali kepadanya secara jelas.
- source_word: אִם יִמָּצֵא הַגַּנָּב
  choice: jika pencurinya ditemukan
  rationale: Nifal dari מצא secara formal berarti 'ditemukan'; terjemahan ini mempertahankan bentuk sumber tanpa menafsirkannya sebagai 'ditangkap'.
- source_word: יְשַׁלֵּם שְׁנָיִם
  choice: pencuri itu harus membayar dua kali lipat
  rationale: Ungkapan ini menetapkan pembayaran ganti rugi sebesar dua kali nilai yang dicuri. Subjek eksplisit 'pencuri itu' memperjelas rujukan pronomina Ibrani.
