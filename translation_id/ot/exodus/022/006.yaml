revisions:
- from: Jika seseorang menyerahkan uang atau barang kepada sesamanya untuk disimpan, lalu semuanya itu dicuri dari rumah orang tersebut, jika pencurinya ditemukan, pencuri itu harus membayar dua kali lipat.
  to: Jika seseorang menyerahkan uang atau barang kepada sesamanya untuk disimpan, lalu barang titipan itu dicuri dari rumah orang yang menerimanya, jika pencurinya ditemukan, pencuri itu harus membayar ganti rugi dua kali lipat.
  rationale: Revisi menghilangkan penambahan makna totalitas pada "semuanya itu," memperjelas pihak yang rumahnya menjadi lokasi pencurian, dan menyatakan pembayaran sebagai ganti rugi dua kali lipat, yang sesuai dengan fungsi restitutif ungkapan Ibrani. Struktur hukum kasuistik dan ambiguitas yang tidak perlu ditafsirkan tetap dipertahankan.
