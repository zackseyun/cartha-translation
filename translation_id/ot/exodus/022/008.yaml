base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/008.yaml
  text: For every case of wrongdoing involving an ox[a], a donkey, a sheep, a garment, or any lost thing about which someone says, ‘This is it,’ the case of both parties shall come before God[b]. The one whom God declares guilty shall pay double to his neighbor.
translation:
  language: id
  text: Untuk setiap perkara pelanggaran yang menyangkut sapi, keledai, domba[a], pakaian, atau barang hilang apa pun yang seseorang katakan, “Inilah itu,” perkara kedua belah pihak harus diajukan ke hadapan Allah[b]. Orang yang dinyatakan bersalah oleh Allah harus membayar dua kali lipat kepada sesamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani שֶׂה mencakup ternak kecil dan dapat menunjuk pada domba atau kambing.
    reason: lexical_alternative
  - marker: b
    text: Atau “para hakim” atau “pengadilan”; kata Ibrani אֱלֹהִים dapat menunjuk langsung kepada Allah atau, dalam konteks hukum, kepada para hakim yang menjalankan kewenangan ilahi.
    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר פֶּשַׁע
  choice: perkara pelanggaran
  rationale: Dalam konteks hukum, דָּבָר berarti perkara atau kasus, sedangkan פֶּשַׁע menunjuk pada pelanggaran atau perbuatan salah. Pilihan ini mempertahankan nuansa yuridis tanpa mempersempit jenis pelanggarannya.
- source_word: שׁוֹר
  choice: sapi
  rationale: Dalam daftar harta ternak, שׁוֹר dapat menunjuk pada seekor dari jenis sapi. “Sapi” lebih alami dan cukup luas dalam bahasa Indonesia modern daripada “lembu jantan”.
- source_word: חֲמוֹר
  choice: keledai
  rationale: Padanan langsung dan lazim dalam bahasa Indonesia modern.
- source_word: שֶׂה
  choice: domba
  rationale: “Domba” merupakan padanan representatif yang alami, tetapi istilah Ibrani ini lebih luas dan dapat menunjuk pada domba atau kambing; keluasan itu dicatat dalam catatan kaki.
- source_word: שַׂלְמָה
  choice: pakaian
  rationale: Istilah ini menunjuk pada sehelai atau jenis pakaian. “Pakaian” mempertahankan cakupan umum dan tidak mempersempitnya menjadi “jubah”.
- source_word: אֲבֵדָה
  choice: barang hilang
  rationale: Ungkapan ini secara alami menyampaikan benda atau milik yang hilang dalam konteks sengketa harta.
- source_word: אֲשֶׁר יֹאמַר כִּי הוּא זֶה
  choice: yang tentangnya seseorang berkata, “Inilah barangnya,”
  rationale: Rumusan ini mempertahankan sifat demonstratif dan identifikasi atas barang yang disengketakan tanpa menambahkan siapa pemiliknya.
- source_word: הָאֱלֹהִים / אֱלֹהִים
  choice: Allah
  rationale: Makna leksikal langsungnya adalah Allah. Kemungkinan bahwa istilah ini menunjuk pada para hakim atau pengadilan dalam konteks hukum dipertahankan dalam catatan kaki.
- source_word: יָבֹא דְּבַר שְׁנֵיהֶם
  choice: perkara kedua belah pihak harus dibawa
  rationale: “Kedua belah pihak” menyampaikan bentuk dual secara alami dalam ragam hukum Indonesia, sedangkan “harus dibawa” mengungkapkan gerak perkara ke hadapan otoritas yang memutus.
- source_word: יַרְשִׁיעֻן
  choice: dinyatakan bersalah
  rationale: Bentuk kausatif dari רשע berarti menyatakan seseorang bersalah dalam keputusan hukum, bukan sekadar menganggapnya jahat.
- source_word: יְשַׁלֵּם שְׁנַיִם
  choice: harus membayar dua kali lipat
  rationale: Ungkapan Ibrani menetapkan pembayaran atau ganti rugi sebesar dua kali nilai yang bersangkutan.
- source_word: לְרֵעֵהוּ
  choice: kepada sesamanya
  rationale: רֵעַ berarti sesama, rekan, atau orang lain yang terkait. “Sesamanya” mempertahankan cakupan relasional tanpa menyiratkan bahwa pihak tersebut harus tinggal berdekatan.
theological_decisions:
- issue: Makna אֱלֹהִים dalam konteks hukum ini
  choice: Allah
  alternative: para hakim / pengadilan
  rationale: Bentuk Ibraninya secara langsung berarti “Allah,” tetapi dalam konteks peradilan dapat dipahami sebagai para hakim yang menjalankan kewenangan di bawah Allah. Teks utama mempertahankan bentuk langsung, sedangkan alternatif yuridis dicatat agar ambiguitas asli tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan susunan hukum yang tetap mudah dipahami. “Perkara,” “kedua belah pihak,” dan “dinyatakan bersalah” menjaga konteks yuridis; ambiguitas penting pada שֶׂה dan אֱלֹהִים dipertahankan melalui catatan kaki.
