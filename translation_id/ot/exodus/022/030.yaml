  yaml_path: translation/ot/exodus/022/030.yaml
  text: And you shall be holy men to me[a]. You shall not eat flesh torn in the field[b]; you shall throw it to the dogs.
translation:
  language: id
  text: Kamu harus menjadi orang-orang yang kudus bagi-Ku.[a] Janganlah kamu memakan daging yang tercabik di padang; lemparkanlah itu kepada anjing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “orang-orang kudus” atau “orang-orang yang memiliki kekudusan.” Bentuk Ibraninya maskulin jamak, tetapi dalam sapaan hukum ini dapat mewakili komunitas perjanjian secara keseluruhan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי קֹדֶשׁ
  choice: orang-orang yang kudus
  rationale: Frasa konstruksi ini secara harfiah berarti ‘orang-orang kudus’ atau ‘orang-orang yang memiliki kekudusan’. Pilihan ini mempertahankan bentuk jamak yang merujuk kepada manusia tanpa membuat bahasa Indonesia menjadi kaku.
- source_word: תִּהְיוּן לִי
  choice: harus menjadi ... bagi-Ku
  rationale: Bentuk imperfek היה dengan לִי menyatakan kewajiban sekaligus hubungan dengan Allah. ‘Bagi-Ku’ mempertahankan unsur relasional, sedangkan ‘harus’ menyampaikan daya normatif hukum secara alami dalam bahasa Indonesia.
- source_word: בָשָׂר
  choice: daging
  rationale: Dalam konteks ketentuan tentang makanan, ‘daging’ merupakan padanan Indonesia yang paling alami dan tetap konkret.
- source_word: בַּשָּׂדֶה
  choice: di padang
  rationale: שָׂדֶה menunjuk ruang terbuka atau padang. ‘Di padang’ ringkas dan sesuai dengan gambaran spasial teks.
- source_word: טְרֵפָה
  choice: tercabik
  rationale: Kata ini menunjuk sesuatu yang diterkam atau dicabik sebagai mangsa. ‘Tercabik’ mempertahankan keadaan daging tersebut tanpa menyebut pelaku yang tidak dinyatakan secara eksplisit dalam bahasa Ibrani.
- source_word: לֹא תֹאכֵלוּ
  choice: Janganlah kamu memakan
  rationale: Larangan imperfek diterjemahkan dengan bentuk larangan baku yang jelas dan bermartabat dalam bahasa Indonesia modern.
- source_word: לַכֶּלֶב
  choice: kepada anjing
  rationale: Nomina Ibrani berbentuk tunggal dan dapat dipahami secara generik. Bahasa Indonesia juga dapat memakai ‘anjing’ tanpa penanda jumlah dalam arti generik, sehingga bentuk sumber tetap terjaga.
- source_word: תַּשְׁלִכוּן אֹתוֹ
  choice: lemparkanlah itu
  rationale: Bentuk ini menyatakan tindakan membuang atau melempar. ‘Lemparkanlah itu’ jelas, langsung, dan sesuai dengan corak perintah hukum.
theological_decisions:
- issue: Bahasa kekudusan dalam hukum perjanjian
  choice: orang-orang yang kudus bagi-Ku
  alternative: umat yang kudus bagi-Ku
  rationale: Terjemahan ini mempertahankan kekudusan sebagai status dan panggilan etis dalam hubungan dengan Allah. ‘Orang-orang’ mencerminkan bentuk אַנְשֵׁי tanpa membatasi penerapan ayat hanya kepada laki-laki, sebab bentuk maskulin jamak Ibrani dapat mewakili komunitas yang disapa.
- issue: Pelaku yang mencabik daging
  choice: tidak dinyatakan dalam teks utama
  alternative: daging yang dicabik binatang buas di padang
  rationale: טְרֵפָה menyiratkan mangsa yang tercabik, kemungkinan besar oleh binatang, tetapi pelakunya tidak disebutkan secara eksplisit. Terjemahan tidak menambahkan pelaku agar ambiguitas sumber tetap terpelihara.
translation_notes:
  register: Bahasa hukum yang lugas dan bermartabat digunakan dengan bentuk ‘harus’ dan ‘janganlah’. Ejaan ‘bagi-Ku’ mempertahankan konvensi penghormatan bahasa Indonesia untuk rujukan kepada Allah. Tanda catatan kaki [a] terdapat dalam teks utama dan sesuai dengan daftar catatan.
