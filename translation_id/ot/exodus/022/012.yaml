  text: But if it is torn by beasts[a], he shall bring it as evidence; he shall not make restitution for what was torn.
translation:
  language: id
  text: Namun, jika binatang itu benar-benar dicabik oleh binatang buas[a], ia harus membawanya sebagai bukti; ia tidak perlu memberi ganti rugi atas binatang yang tercabik itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jika binatang itu benar-benar tercabik, ia harus membawa binatang yang tercabik itu sebagai bukti; ia tidak perlu menggantinya.”
    reason: Alternatif ini mempertahankan penegasan konstruksi Ibrani dan tidak menyebut pelaku yang mencabiknya.
lexical_decisions:
- source_word: אִם
  choice: Namun, jika
  rationale: Memperkenalkan kasus bersyarat yang berlawanan dengan kasus hukum pada ayat sebelumnya; “Namun, jika” menjaga alur kasuistiknya.
- source_word: טָרֹף יִטָּרֵף
  choice: diterkam binatang buas
  rationale: Konstruksi infinitif absolut dengan verba finit menegaskan peristiwa diterkam atau dicabik. Dalam konteks ini, akar טרף lazim menggambarkan serangan hewan; ungkapan Indonesia ini menyampaikan situasinya secara alami tanpa harus menambahkan kata keterangan yang terasa berlebihan.
- source_word: יְבִאֵהוּ
  choice: ia harus membawanya
  rationale: Bentuk Hifil dari בוא berarti membawa atau menghadirkan. Akhiran pronominal maskulin tunggal paling wajar merujuk pada binatang atau sisa-sisanya yang dibawa untuk diperiksa.
- source_word: עֵד
  choice: sebagai bukti
  rationale: Secara harfiah berarti saksi atau kesaksian, tetapi di sini yang dihadirkan ialah bukti fisik. “Sebagai bukti” menyampaikan fungsi forensiknya dengan jelas dalam bahasa Indonesia.
- source_word: הַטְּרֵפָה
  choice: binatang yang diterkam itu
  rationale: Nomina ini menunjuk pada apa yang telah diterkam atau dicabik. Konteks menentukan bahwa yang dimaksud adalah binatang titipan tersebut, sehingga pilihan ini jelas tanpa menyempitkannya menjadi hanya bangkai atau sisa-sisa.
- source_word: לֹא יְשַׁלֵּם
  choice: ia tidak perlu memberi ganti rugi
  rationale: Dalam hukum perjanjian, bentuk Piel שלם menyatakan pembayaran kompensasi atau penggantian. “Memberi ganti rugi” mempertahankan nuansa hukumnya dalam bahasa Indonesia yang wajar.
