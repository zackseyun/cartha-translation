base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/009.yaml
  text: If a man gives his neighbor a donkey[a], or an ox, or a sheep, or any animal to keep, and it dies, or is injured, or is carried off, with no one seeing it[c][b],
translation:
  language: id
  text: Apabila seseorang menyerahkan kepada sesamanya seekor keledai, lembu, domba[a], atau hewan apa pun untuk dijaga, lalu hewan itu mati, terluka[b], atau dibawa pergi, tanpa ada yang melihatnya[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kambing”; kata Ibrani שֶׂה dapat menunjuk kepada seekor domba atau kambing dari kawanan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “patah.”
    reason: lexical_alternative
  - marker: c
    text: Artinya, tidak ada saksi mata yang melihat apa yang terjadi.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Apabila
  rationale: Memperkenalkan syarat dalam rumusan hukum kasuistis; “apabila” alami dalam bahasa hukum Indonesia dan tidak mengharuskan kepastian bahwa peristiwa itu terjadi.
- source_word: יִתֵּן
  choice: menyerahkan
  rationale: נתן secara dasar berarti “memberikan”, tetapi dalam konteks ini barang diserahkan ke dalam pemeliharaan orang lain. “Menyerahkan” menyampaikan tindakan itu tanpa menambahkan gagasan pemindahan hak milik.
- source_word: אִישׁ
  choice: seseorang
  rationale: Dalam hukum kasuistis, אִישׁ menunjuk kepada orang dalam kasus yang dikemukakan. Bahasa Indonesia lazim memakai “seseorang” tanpa mengubah daya representatif ketentuan itu.
- source_word: אֶל רֵעֵהוּ
  choice: kepada sesamanya
  rationale: רֵעַ menunjuk kepada orang lain dalam lingkungan sosial atau hukum; “sesamanya” mempertahankan hubungan antarpihak tanpa menyiratkan bahwa mereka tinggal berdekatan.
- source_word: חֲמוֹר
  choice: keledai
  rationale: Padanan modern dan langsung bagi hewan yang dimaksud.
- source_word: שׁוֹר
  choice: lembu
  rationale: Padanan umum dalam konteks ternak untuk שׁוֹר, tanpa secara tidak perlu menentukan jenis kelamin atau fungsi hewan.
- source_word: שֶׂה
  choice: domba
  rationale: Padanan alami dalam daftar ternak ini, sementara cakupan Ibrani yang juga dapat menunjuk kepada kambing dipertahankan dalam catatan kaki.
- source_word: וְכָל בְּהֵמָה
  choice: atau hewan apa pun
  rationale: בְּהֵמָה di sini mencakup hewan piaraan sebagai milik; frasa ini jelas dan alami bagi pembaca umum.
- source_word: לִשְׁמֹר
  choice: untuk dijaga
  rationale: Menunjukkan tujuan penyerahan hewan, yaitu agar berada dalam penjagaan atau pemeliharaan pihak lain.
- source_word: וּמֵת
  choice: lalu hewan itu mati
  rationale: Subjek “hewan itu” dinyatakan kembali agar rangkaian kondisi jelas dalam bahasa Indonesia.
- source_word: נִשְׁבַּר
  choice: terluka
  rationale: Bentuk pasif שׁבר secara harfiah berarti “dipatahkan/patah”, tetapi bila dikenakan pada hewan, “terluka” menyampaikan akibat fisiknya secara alami. Arti harfiah dicatat.
- source_word: נִשְׁבָּה
  choice: dibawa pergi
  rationale: שׁבה dalam bentuk pasif berarti dibawa atau ditawan. Pilihan ini tidak mempersempit pelakunya menjadi pencuri dan mempertahankan keluasan makna sumber.
- source_word: אֵין רֹאֶה
  choice: tanpa ada yang melihatnya
  rationale: Menyatakan bahwa tidak ada saksi mata atas kejadian tersebut, sesuai ungkapan Ibrani yang ringkas.
