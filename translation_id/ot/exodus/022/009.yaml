translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum naratif. Kalimat dibiarkan berakhir dengan koma karena ayat sumber yang diberikan merupakan anak kalimat kasus yang berlanjut ke ketentuan berikutnya. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan dan diurutkan [a], [b], [c].
