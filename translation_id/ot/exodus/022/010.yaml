base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/010.yaml
  text: an oath of Yahweh shall be between the two of them[a], that he has not put his hand to his neighbor’s property; and its owner shall accept it[c][b], and he shall not make restitution.
translation:
  language: id
  text: Sumpah demi Yahweh[a] harus berlaku di antara keduanya, bahwa ia tidak menjamah harta milik sesamanya.[b] Pemiliknya harus menerima sumpah itu,[c] dan ia tidak wajib membayar ganti rugi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “sumpah Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani “mengulurkan tangannya pada harta milik sesamanya” berarti mengambil, menyalahgunakan, atau mengusik barang milik orang lain.
    reason: cultural_note
  - marker: c
    text: Atau, secara lebih harfiah, “Pemiliknya harus menerimanya,” yakni menerima sumpah itu sebagai penyelesaian yang memadai.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבֻעַת יְהוָה
  choice: sumpah demi Yahweh
  rationale: Frasa konstruksi Ibrani secara harfiah berbunyi “sumpah Yahweh” dan dalam konteks hukum menunjuk pada sumpah yang mengikat dengan memanggil nama Yahweh. “Demi Yahweh” menyampaikan fungsi sumpah itu secara alami dalam bahasa Indonesia, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: בֵּין שְׁנֵיהֶם
  choice: di antara keduanya
  rationale: Mempertahankan penegasan Ibrani bahwa perkara hukum ini melibatkan dua pihak.
- source_word: אִם לֹא
  choice: bahwa ... tidak
  rationale: Dalam rumusan sumpah, ungkapan ini memperkenalkan isi yang disumpahkan, bukan syarat biasa.
- source_word: שָׁלַח יָדוֹ
  choice: mengulurkan tangannya terhadap
  rationale: Mempertahankan gambaran idiom Ibrani tentang tindakan mengambil, menyalahgunakan, atau mengusik sesuatu yang dipercayakan kepadanya; maknanya dijelaskan dalam catatan kaki.
- source_word: בִּמְלֶאכֶת רֵעֵהוּ
  choice: terhadap harta milik sesamanya
  rationale: Dalam konteks ini מְלָאכָה mengacu pada barang atau milik sesama yang dipercayakan, bukan pada pekerjaan abstrak.
- source_word: וְלָקַח בְּעָלָיו
  choice: Pemiliknya harus menerima sumpah itu
  rationale: Objek verba tidak dinyatakan secara eksplisit, tetapi konteks hukum menunjukkan bahwa pemilik menerima sumpah tersebut sebagai penyelesaian yang memadai. Catatan kaki mempertahankan kemungkinan terjemahan yang lebih harfiah.
- source_word: יְשַׁלֵּם
  choice: membayar ganti rugi
  rationale: Bentuk Piel dari שׁלם dalam hukum perjanjian menunjuk pada pembayaran kompensasi atau restitusi.
theological_decisions:
- issue: Pemakaian nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memuat nama pribadi ilahi, sehingga transliterasi “Yahweh” mempertahankan perbedaan antara nama itu dan gelar “Tuhan” tanpa menambahkan tafsiran denominasi.
- issue: Sifat sumpah dalam perkara hukum
  choice: sumpah demi Yahweh yang berlaku di antara kedua pihak
  alternative: sumpah milik atau yang berasal dari Yahweh
  rationale: Konstruksi “sumpah Yahweh” dapat dipahami secara harfiah sebagai hubungan genitif, tetapi fungsi kontekstualnya adalah sumpah yang diikrarkan dengan memanggil nama Yahweh. Catatan kaki menjaga bentuk sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak hukum yang jelas dan bermartabat. Susunan kalimat mempertahankan hubungan antara sumpah, penerimaan oleh pemilik, dan pembebasan dari kewajiban ganti rugi. Pronomina “orang itu” dipertahankan agar tidak menambahkan identifikasi subjek yang lebih khusus daripada teks Ibrani.
