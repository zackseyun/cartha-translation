  yaml_path: translation/ot/exodus/022/013.yaml
  text: And if a man borrows from his neighbor[a], and it is injured or dies, if its owner is not with it[b], he shall surely make restitution.
translation:
  language: id
  text: Jika seseorang meminjam sesuatu dari sesamanya, lalu yang dipinjam itu rusak[a] atau mati, sedangkan pemiliknya tidak ada bersamanya, ia wajib mengganti kerugian sepenuhnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “patah” atau “rusak.” Kata Ibrani ini dapat merujuk pada kerusakan benda pinjaman atau cedera hewan pinjaman.
    reason: lexical_alternative
  - marker: b
    text: Konstruksi Ibrani menegaskan kewajiban untuk membayar ganti rugi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Jika
  rationale: Memperkenalkan kasus bersyarat dalam kumpulan hukum; dalam bahasa Indonesia, hubungan dengan konteks sebelumnya tetap wajar tanpa menerjemahkan waw secara tersendiri.
- source_word: יִשְׁאַל
  choice: meminjam sesuatu
  rationale: Dalam konteks hukum ini, verba tersebut berarti meminjam. Penambahan 'sesuatu' memberi acuan alami bagi pronomina berikutnya tanpa menentukan apakah yang dipinjam barang atau hewan.
- source_word: אִישׁ
  choice: seseorang
  rationale: Dalam rumusan hukum, nomina maskulin tunggal ini berfungsi sebagai pelaku generik. 'Seseorang' merupakan padanan hukum Indonesia yang alami dan tidak mengubah cakupan ketentuan.
- source_word: מֵעִם רֵעֵהוּ
  choice: dari sesamanya
  rationale: רֵעַ menunjuk rekan atau sesama anggota masyarakat; 'sesamanya' alami dalam konteks hukum perjanjian dan tidak membatasi makna pada tetangga tempat tinggal.
- source_word: וְנִשְׁבַּר
  choice: barang itu rusak
  rationale: Secara harfiah berarti 'dipatahkan/menjadi patah', tetapi dapat mencakup kerusakan benda atau cedera hewan. 'Rusak' cocok untuk benda, sementara catatan kaki mempertahankan cakupan Ibraninya.
- source_word: אוֹ מֵת
  choice: atau mati
  rationale: Mempertahankan verba sederhana yang terutama mengisyaratkan bahwa yang dipinjam mungkin seekor hewan.
- source_word: בְּעָלָיו
  choice: pemiliknya
  rationale: Bentuk yang secara morfologis plural ini berfungsi idiomatis sebagai nomina tunggal, yaitu pemilik barang atau hewan pinjaman.
- source_word: אֵין עִמּוֹ
  choice: tidak berada di dekatnya
  rationale: Pronomina Ibrani dapat dipahami merujuk pada peminjam atau benda/hewan yang dipinjam. Ungkapan Indonesia ini mempertahankan ketidakjelasan acuan itu dan menyatakan bahwa pemilik tidak hadir.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: harus membayar ganti rugi sepenuhnya
  rationale: Konstruksi infinitif absolut dengan verba finit menegaskan kewajiban pembayaran. Padanan ini menyampaikan baik daya wajib maupun pemulihan kerugian secara penuh.
