  register: Bahasa hukum yang modern, lugas, dan bermartabat. Terjemahan mempertahankan kemungkinan bahwa objek pinjaman adalah barang atau hewan serta tidak memaksakan acuan pronomina yang tidak sepenuhnya tegas dalam bahasa Ibrani.
