revisions:
- from: Jika api menjalar lalu mengenai semak berduri[a], sehingga tumpukan gandum, gandum yang belum dituai, atau ladang terbakar habis, orang yang menyalakan api itu harus membayar ganti rugi sepenuhnya.[b]
  to: Jika api menyala lalu menjalar ke semak berduri[a], sehingga tumpukan gandum, gandum yang belum dituai, atau ladang terbakar habis, orang yang menyalakan api itu wajib memberikan ganti rugi.[b]
  rationale: Revisi mempertahankan urutan dan cakupan kerusakan dalam teks Ibrani, tetapi memperjelas bahwa api mulai menyala sebelum menjalar ke semak berduri. Kewajiban restitusi dinyatakan dalam ragam hukum Indonesia yang alami tanpa menafsirkan penegasan Ibrani sebagai penetapan jumlah kompensasi.
