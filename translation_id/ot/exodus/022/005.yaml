  yaml_path: translation/ot/exodus/022/005.yaml
  text: If a fire breaks out and catches in thorns[a], so that stacked grain or standing grain or the field is consumed[b], the one who started the fire must surely make restitution.
translation:
  language: id
  text: Jika api menyala lalu menjalar ke semak berduri[a], sehingga tumpukan gandum, gandum yang belum dituai, atau ladang terbakar habis, orang yang menyalakan api itu wajib memberikan ganti rugi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “lalu menemukan duri-duri.”
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani menegaskan kewajiban memberikan ganti rugi dengan memakai infinitif absolut bersama verba finit.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Jika
  rationale: Memperkenalkan kondisi dalam hukum kasuistik; “jika” alami dan mempertahankan sifat bersyaratnya.
- source_word: תֵצֵא אֵשׁ
  choice: api menjalar
  rationale: Secara harfiah api “keluar”; dalam konteks ini api bergerak keluar dari tempat asalnya dan menjadi tidak terkendali.
- source_word: וּמָצְאָה קֹצִים
  choice: lalu mengenai semak berduri
  rationale: Secara harfiah “dan menemukan duri-duri”; pilihan ini mempertahankan gagasan bahwa api mencapai bahan berduri tanpa membuat metafora harfiahnya terasa janggal.
- source_word: קֹצִים
  choice: semak berduri
  rationale: Dalam konteks kebakaran ladang, bentuk jamak ini menunjuk pada tumbuhan atau semak berduri yang dapat menyambar api; lebih jelas daripada “duri-duri” saja.
- source_word: וְנֶאֱכַל
  choice: terbakar habis
  rationale: Bentuk pasif dari אכל secara idiomatis menggambarkan sesuatu yang dilalap api; ungkapan ini alami dan jelas dalam bahasa Indonesia.
- source_word: גָּדִישׁ
  choice: tumpukan gandum
  rationale: Menunjuk pada hasil panen yang sudah dikumpulkan menjadi tumpukan.
- source_word: הַקָּמָה
  choice: gandum yang belum dituai
  rationale: Menunjuk pada tanaman gandum yang masih berdiri di ladang; ungkapan ini lebih langsung dipahami pembaca umum daripada “gandum yang masih berdiri”.
- source_word: הַשָּׂדֶה
  choice: ladang
  rationale: Padanan langsung dan alami bagi lahan pertanian yang terkena kebakaran.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: harus membayar ganti rugi sepenuhnya
  rationale: Gabungan infinitif absolut dan verba finit menegaskan kewajiban membayar; “sepenuhnya” menyampaikan penekanan itu dalam konteks hukum.
- source_word: הַמַּבְעִר אֶת הַבְּעֵרָה
  choice: orang yang menyalakan api itu
  rationale: Menyatakan secara alami orang yang menyebabkan api menyala, tanpa mengandaikan lebih jauh apakah penyebarannya disengaja.
