source:
  edition: WLC
  text: אִם כֶּ֣סֶף תַּלְוֶ֣ה אֶת עַמִּ֗/י אֶת הֶֽ/עָנִי֙ עִמָּ֔/ךְ לֹא תִהְיֶ֥ה ל֖/וֹ כְּ/נֹשֶׁ֑ה לֹֽא תְשִׂימ֥וּ/ן עָלָ֖י/ו נֶֽשֶׁךְ־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/024.yaml
  text: If you lend money to my people[a], to the poor among you, you shall not be like a creditor to him[c][b]; you shall not impose interest on him.
translation:
  language: id
  text: Jika engkau meminjamkan uang kepada umat-Ku, kepada orang miskin yang ada di antaramu,[a] janganlah engkau bertindak terhadapnya seperti penagih utang; janganlah kamu sekalian membebankan bunga kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ketika engkau meminjamkan uang kepada umat-Ku, yaitu kepada orang miskin yang ada di antaramu.” Bahasa Ibrani memakai bentuk kondisional yang lazim dalam rumusan hukum kasuistik.
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Partikel ini secara formal bersifat kondisional. Dalam rumusan hukum kasuistik Ibrani, maknanya dapat mendekati 'ketika'; 'jika' mempertahankan bentuk sumber dan tetap wajar dalam bahasa hukum Indonesia.
- source_word: כֶּסֶף
  choice: uang
  rationale: Secara harfiah berarti 'perak', tetapi dalam konteks pinjaman kata ini menunjuk pada uang.
- source_word: תַּלְוֶה
  choice: meminjamkan
  rationale: Bentuk Hifil dari לוה berarti memberikan pinjaman; 'meminjamkan' adalah padanan Indonesia yang langsung dan alami.
- source_word: עַמִּי
  choice: umat-Ku
  rationale: Akhiran orang pertama tunggal berarti 'umat-Ku'. 'Umat' sesuai dengan konteks komunitas perjanjian tanpa menambahkan nama Israel yang tidak terdapat dalam ayat.
- source_word: הֶעָנִי
  choice: orang miskin
  rationale: Adjektiva substantival maskulin tunggal ini menunjuk kepada seorang yang miskin. Bahasa Indonesia lazim memakai 'orang miskin' tanpa harus menambahkan 'laki-laki'.
- source_word: עִמָּךְ
  choice: yang ada di antaramu
  rationale: Secara harfiah 'bersamamu'; dalam konteks ini frasa tersebut menunjukkan orang miskin yang berada di tengah komunitas.
- source_word: כְּנֹשֶׁה
  choice: seperti penagih utang
  rationale: Partisipel נשה dapat menunjuk kepada pemberi pinjaman yang menekan orang untuk membayar. 'Penagih utang' menyampaikan unsur kreditur sekaligus tekanan penagihan dengan jelas.
- source_word: תְשִׂימוּן עָלָיו
  choice: membebankan ... kepadanya
  rationale: Idiom harfiahnya 'menaruh atasnya'; dalam konteks ekonomi, 'membebankan' menyampaikan tindakan mengenakan bunga secara alami.
- source_word: נֶשֶׁךְ
  choice: bunga
  rationale: Istilah ini menunjuk pada bunga pinjaman. 'Bunga' lebih tepat daripada 'riba' karena tidak dengan sendirinya membatasi atau memperluas arti melalui kategori hukum-keagamaan modern.
theological_decisions:
- issue: Daya hukum partikel אִם
  choice: Jika engkau meminjamkan
  alternative: Ketika engkau meminjamkan
  rationale: Bentuk kondisional sumber dipertahankan, sedangkan catatan kaki mengakui fungsi lazimnya dalam hukum kasuistik.
- issue: Identitas הֶעָנִי
  choice: orang miskin
  alternative: laki-laki miskin
  rationale: Walaupun bentuk Ibraninya maskulin tunggal, dalam bahasa Indonesia 'orang miskin' secara alami merujuk kepada individu tanpa menghapus ketunggalan atau menambahkan penegasan jenis kelamin yang tidak diperlukan.
- issue: Makna כְּנֹשֶׁה
  choice: bertindak terhadapnya seperti penagih utang
  alternative: menjadi seperti seorang kreditur baginya
  rationale: Padanan yang dipilih mempertahankan perbandingan dan menyampaikan nuansa menekan dalam penagihan, tanpa mengubah larangan ini menjadi larangan umum atas keberadaan seorang kreditur.
- issue: Cakupan pronomina orang kedua
  choice: engkau ... kamu sekalian
  alternative: kamu secara seragam
  rationale: Teks Ibrani bergeser dari orang kedua feminin tunggal pada עִמָּךְ dan verba tunggal תִהְיֶה ke bentuk jamak תְשִׂימוּן. Terjemahan mempertahankan pergeseran tunggal-jamak sejauh mungkin dalam bahasa Indonesia.
translation_notes:
  register: Bahasa modern, lugas, dan bermartabat. 'Umat-Ku' mempertahankan relasi perjanjian; 'penagih utang' lebih mudah dipahami daripada istilah teknis 'kreditur'. Pergeseran dari sapaan tunggal ke jamak dalam bahasa Ibrani sengaja dicerminkan dengan 'engkau' lalu 'kamu sekalian'. Penanda catatan kaki [a] ditempatkan setelah keseluruhan klausa kasus karena catatan menjelaskan baik nilai אִם maupun hubungan 'kepada umat-Ku' dengan 'orang miskin yang ada di antaramu'.
