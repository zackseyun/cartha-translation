  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֱלֹהִ֖ים לֹ֣א תְקַלֵּ֑ל וְ/נָשִׂ֥יא בְ/עַמְּ/ךָ֖ לֹ֥א תָאֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/022/027.yaml
  text: You shall not revile God[a], nor curse a ruler among your people.
translation:
  language: id
  text: Jangan menghina Allah[a] dan jangan mengutuk seorang pemimpin di antara bangsamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para hakim”; אֱלֹהִים dalam konteks tertentu dapat merujuk kepada para penguasa manusia, meskipun “Allah” paling sesuai dengan kesejajaran ayat ini.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks larangan hukum dan kesejajaran dengan pemimpin manusia pada klausa kedua, arti tunggal 'Allah' paling sesuai. Kemungkinan arti 'para hakim' tetap dicantumkan dalam catatan kaki.
- source_word: תְקַלֵּל
  choice: menghina
  rationale: Bentuk Piel dari קלל dapat berarti mengutuk, merendahkan, atau memperlakukan dengan hina. 'Menghina' menyampaikan gagasan ujaran yang merendahkan sekaligus mempertahankan perbedaan dari kata kerja ארר pada klausa kedua.
- source_word: נָשִׂיא
  choice: seorang pemimpin
  rationale: נָשִׂיא menunjuk kepada orang yang diangkat atau memiliki kedudukan sebagai kepala. 'Pemimpin' alami dalam bahasa Indonesia modern dan tidak memberi kesan khusus tentang gelar kebangsawanan.
- source_word: בְעַמְּךָ
  choice: di antara bangsamu
  rationale: Preposisi ב di sini secara idiomatis menunjukkan seorang pemimpin yang berada di tengah komunitas umat.
- source_word: תָאֹר
  choice: mengutuk
  rationale: ארר adalah kata kerja lazim untuk menyatakan kutuk; 'mengutuk' merupakan padanan Indonesia yang jelas dan langsung.
theological_decisions:
- issue: Acuan אֱלֹהִים
  choice: Allah
  alternative: para hakim
  rationale: Konteks hukum dan kesejajaran dengan pemimpin manusia mendukung acuan kepada Allah. Namun, karena אֱלֹהִים dalam konteks tertentu dapat dipahami sebagai penguasa atau hakim manusia, kemungkinan itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang lugas dan bermartabat. Dua kata kerja berbeda dipakai—'menghina' dan 'mengutuk'—untuk mempertahankan perbedaan leksikal dalam teks Ibrani.
