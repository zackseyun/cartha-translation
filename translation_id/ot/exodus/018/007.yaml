base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/007.yaml
  text: Moses went out to meet his father-in-law[a], bowed down, and kissed him. Then each asked the other about his welfare, and they went into the tent.
translation:
  language: id
  text: Musa keluar untuk menemui ayah mertuanya, lalu bersujud dan menciumnya. Mereka saling menanyakan kabar[a], kemudian masuk ke dalam kemah itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, masing-masing bertanya kepada yang lain tentang “damai” atau kesejahteraannya. Ungkapan Ibrani ini berarti menanyakan keadaan atau kesejahteraan seseorang.
    reason: Menjelaskan idiom Ibrani שאל לשלום serta unsur timbal balik אִישׁ לְרֵעֵהוּ.
lexical_decisions:
- source_word: לִקְרַאת
  choice: menyambut
  rationale: Dalam konteks kedatangan seorang kerabat, יצא לִקְרַאת berarti keluar untuk menemui dan menyambutnya; “menyambut” menyampaikan maksud itu secara alami dalam bahasa Indonesia.
- source_word: חֹתְנוֹ
  choice: mertuanya
  rationale: חֹתֵן di sini menunjuk kepada Yitro sebagai ayah mertua Musa. Bahasa Indonesia lazim memakai “mertua” tanpa membedakan ayah atau ibu ketika konteksnya sudah jelas.
- source_word: וַיִּשְׁתַּחוּ
  choice: bersujud
  rationale: Kata שׁחה menggambarkan membungkukkan diri sangat rendah atau bersujud. Pilihan ini mempertahankan tindakan fisiknya tanpa menerjemahkannya sebagai penyembahan.
- source_word: וַיִּשַּׁק לוֹ
  choice: menciumnya
  rationale: נשׁק dengan objek tidak langsung di sini menggambarkan ciuman sebagai salam yang lazim; “menciumnya” merupakan padanan Indonesia yang langsung dan alami.
- source_word: וַיִּשְׁאֲלוּ אִישׁ לְרֵעֵהוּ לְשָׁלוֹם
  choice: mereka saling menanyakan kabar
  rationale: Ungkapan שאל לשלום berarti menanyakan keadaan atau kesejahteraan seseorang. Bentuk timbal balik אִישׁ לְרֵעֵהוּ disampaikan oleh “saling,” sedangkan “menanyakan kabar” merupakan ungkapan Indonesia yang wajar.
- source_word: הָאֹהֱלָה
  choice: masuk ke dalam kemah
  rationale: Akhiran direktif menyatakan gerak menuju bagian dalam kemah. Teks Ibrani menyebut “kemah” itu tetapi tidak secara eksplisit mengatakan milik siapa, sehingga kepemilikan tidak ditambahkan.
theological_decisions:
- issue: Makna tindakan Musa bersujud di hadapan Yitro
  choice: Menerjemahkan tindakan fisiknya sebagai “bersujud” tanpa menyebutnya penyembahan
  alternative: “membungkuk memberi hormat” atau menafsirkannya sebagai tindakan penyembahan
  rationale: שׁחה dapat dipakai untuk penyembahan maupun penghormatan kepada manusia. Rangkaian penyambutan di sini mendukung tindakan penghormatan sosial, tetapi terjemahan sebaiknya mempertahankan tindakan yang dinyatakan teks dan tidak memasukkan penilaian teologis yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. “Mertua” dipilih karena lazim dan jelas dari konteks; “bersujud” mempertahankan kekuatan tindakan fisik; “menanyakan kabar” menyampaikan idiom Ibrani secara wajar. Penanda catatan kaki [a] ditempatkan tepat setelah frasa yang dijelaskannya.
