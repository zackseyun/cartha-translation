  yaml_path: translation/ot/exodus/018/018.yaml
  text: You will surely wear yourself out[a], both you and this people who are with you, because the matter is too heavy for you. You are not able to do it by yourself.
translation:
  language: id
  text: Engkau pasti akan kelelahan[a]—baik engkau maupun bangsa yang bersamamu ini—karena perkara ini terlalu berat bagimu. Engkau tidak sanggup melakukannya seorang diri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Engkau pasti akan menjadi letih lesu.” Ungkapan Ibrani mengulang kata kerja yang sama untuk memberi penekanan, secara harfiah, “menjadi layu, engkau akan menjadi layu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבֹל תִּבֹּל
  choice: Engkau pasti akan kelelahan
  rationale: Infinitif absolut yang diikuti bentuk imperfek menguatkan kepastian dan penekanan. Dalam konteks beban kerja Musa, 'pasti akan kelelahan' menyampaikan idiom Ibrani secara alami tanpa mengurangi daya peringatannya.
- source_word: גַּם אַתָּה גַּם הָעָם הַזֶּה
  choice: baik engkau maupun bangsa ... ini
  rationale: Pengulangan גַּם mencakup kedua pihak. 'Bangsa' mempertahankan bentuk kolektif tunggal עָם, dan konstruksi 'baik ... maupun ...' wajar dalam bahasa Indonesia.
- source_word: אֲשֶׁר עִמָּךְ
  choice: yang bersamamu
  rationale: Menerjemahkan klausa relatif secara ringkas dan alami, dengan sufiks orang kedua tunggal pada עִמָּךְ ditujukan kepada Musa.
- source_word: כִּי
  choice: karena
  rationale: Memperkenalkan alasan bagi peringatan Yitro.
- source_word: כָבֵד מִמְּךָ הַדָּבָר
  choice: perkara ini terlalu berat bagimu
  rationale: כָבֵד dipertahankan dengan metafora 'berat', sedangkan מִמְּךָ dalam konstruksi ini menyatakan bahwa beban tersebut melampaui kemampuan Musa. 'Perkara' menjaga keluasan makna דָּבָר dalam konteks pengadilan dan administrasi.
- source_word: לֹא תוּכַל עֲשֹׂהוּ
  choice: Engkau tidak sanggup melakukannya
  rationale: Menyatakan ketidakmampuan tanpa mempersempit makna umum עשה, 'melakukan'.
- source_word: לְבַדֶּךָ
  choice: seorang diri
  rationale: Ungkapan Indonesia yang alami untuk tindakan tanpa bantuan orang lain.
