  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע יִתְר֨וֹ כֹהֵ֤ן מִדְיָן֙ חֹתֵ֣ן מֹשֶׁ֔ה אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֤ה אֱלֹהִים֙ לְ/מֹשֶׁ֔ה וּ/לְ/יִשְׂרָאֵ֖ל עַמּ֑/וֹ כִּֽי הוֹצִ֧יא יְהוָ֛ה אֶת יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/001.yaml
  text: Jethro[a], the priest of Midian, Moses’ father-in-law, heard all that God had done for Moses and for Israel his people, that Yahweh had brought Israel out of Egypt.
translation:
  language: id
  text: 'Yitro, imam di Midian dan ayah mertua Musa, mendengar segala yang telah Allah lakukan bagi Musa dan bagi Israel, umat-Nya[a]: Yahweh telah membawa Israel keluar dari Mesir.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Israel, umat Musa.” Kata ganti dalam “umat-Nya” secara gramatikal dapat merujuk kepada Musa, meskipun dalam konteks kemungkinan besar merujuk kepada Allah.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: mendengar
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; bahasa Indonesia tidak memerlukan kata penghubung temporal tambahan di awal ayat.
- source_word: יִתְרוֹ
  choice: Yitro
  rationale: Transliterasi ini dekat dengan bentuk Ibrani dan lazim dipakai dalam Alkitab bahasa Indonesia.
- source_word: כֹהֵן מִדְיָן
  choice: imam di Midian
  rationale: Frasa konstruksi ini menyatakan jabatan Yitro dan kaitannya dengan Midian. 'Imam di Midian' alami dalam bahasa Indonesia tanpa menyiratkan bahwa ia satu-satunya imam seluruh wilayah itu.
- source_word: חֹתֵן מֹשֶׁה
  choice: mertua Musa
  rationale: Dalam konteks ini חֹתֵן menunjuk kepada ayah dari istri Musa; 'mertua' merupakan padanan Indonesia yang ringkas dan tepat secara kontekstual.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה אֱלֹהִים
  choice: segala yang telah dilakukan Allah
  rationale: '''Segala yang'' mempertahankan cakupan menyeluruh כָּל אֲשֶׁר, sedangkan ''telah dilakukan'' menandai tindakan yang mendahului peristiwa mendengar.'
- source_word: לְמֹשֶׁה וּלְיִשְׂרָאֵל
  choice: bagi Musa dan bagi Israel
  rationale: Preposisi ל menyatakan tindakan demi kepentingan atau untuk kebaikan Musa dan Israel; 'bagi' lebih tepat daripada sekadar arah tindakan.
- source_word: עַמּוֹ
  choice: umat-Nya
  rationale: Akhiran pronominal orang ketiga tunggal paling wajar merujuk kepada Allah, tetapi susunan utama tetap tidak menyebut referennya secara eksplisit; catatan kaki mempertahankan kemungkinan gramatikal bahwa akhiran itu merujuk kepada Musa.
- source_word: כִּי
  choice: yaitu bahwa
  rationale: כִּי memperkenalkan penjelasan atau isi khusus dari segala yang didengar Yitro. 'Yaitu bahwa' memperjelas hubungan aposisional secara alami dalam bahasa Indonesia.
- source_word: הוֹצִיא
  choice: telah membawa ... keluar
  rationale: Bentuk Hifil dari יצא berarti menyebabkan keluar atau membawa keluar, dan cocok dengan konteks eksodus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: מִמִּצְרָיִם
  choice: keluar dari Mesir
  rationale: Bersama הוֹצִיא, ungkapan ini secara alami menyatakan gerakan dari dalam Mesir ke luar.
theological_decisions:
- issue: Rujukan akhiran pronominal dalam עַמּוֹ
  choice: Israel sebagai umat Allah
  alternative: Israel sebagai umat Musa
  rationale: Allah adalah anteseden terdekat dan paling koheren, terlebih klausa berikut menyebut Yahweh sebagai pelaku pembebasan. Namun, karena secara gramatikal akhiran itu juga dapat dikaitkan dengan Musa, kemungkinan tersebut dicatat dan tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan nama ilahi Yahweh dan ambiguitas asli melalui catatan kaki.
