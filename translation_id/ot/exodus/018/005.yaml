  text: וַ/יָּבֹ֞א יִתְר֨וֹ חֹתֵ֥ן מֹשֶׁ֛ה וּ/בָנָ֥י/ו וְ/אִשְׁתּ֖/וֹ אֶל מֹשֶׁ֑ה אֶל הַ/מִּדְבָּ֗ר אֲשֶׁר ה֛וּא חֹנֶ֥ה שָׁ֖ם הַ֥ר הָ/אֱלֹהִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/005.yaml
  text: Then Jethro[a], Moses' father-in-law, came to Moses in the wilderness, where he was camped at the mountain of God[b], with his sons and his wife.
translation:
  language: id
  text: Lalu Yitro, ayah mertua Musa, datang kepada Musa bersama anak-anak dan istri Musa[a] di padang gurun tempat Musa sedang berkemah, di gunung Allah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anaknya dan istrinya.” Berdasarkan ayat 2–4, yang dimaksud adalah anak-anak dan istri Musa.
    reason: lexical_alternative
  - marker: b
    text: Sebutan “gunung Allah” berkaitan dengan Sinai/Horeb; nama itu sendiri tidak disebutkan dalam ayat ini.
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Lalu ... datang
  rationale: Bentuk wayyiqtol melanjutkan urutan kisah; “lalu” menyatakan perkembangan narasi secara alami dalam bahasa Indonesia.
- source_word: יִתְרוֹ
  choice: Yitro
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: חֹתֵן מֹשֶׁה
  choice: mertua Musa
  rationale: Istilah Indonesia “mertua” secara alami menyatakan hubungan kekerabatan ini tanpa perlu menambahkan “laki-laki,” karena Yitro sudah dikenal sebagai tokoh laki-laki.
- source_word: וּבָנָיו וְאִשְׁתּוֹ
  choice: bersama anak-anak dan istri Musa
  rationale: Kata penghubung menyatakan orang-orang yang menyertai Yitro. Konteks ayat 2–4 menunjukkan bahwa mereka adalah anak-anak dan istri Musa; catatan kaki mempertahankan informasi bahwa bentuk Ibrani secara harfiah memakai pronomina “-nya.”
- source_word: אֶל מֹשֶׁה
  choice: kepada Musa
  rationale: Preposisi אֶל menyatakan gerak menuju Musa tanpa menambahkan gagasan “menemui” yang tidak dinyatakan secara eksplisit.
- source_word: אֶל הַמִּדְבָּר
  choice: di padang gurun
  rationale: Walaupun אֶל biasanya menandai tujuan, dalam susunan Indonesia lokasi tujuan kedatangan paling alami dinyatakan dengan “di,” sesudah “datang kepada Musa.”
- source_word: אֲשֶׁר הוּא חֹנֶה שָׁם
  choice: tempat Musa sedang berkemah
  rationale: Klausa relatif menunjukkan lokasi perkemahan Musa. Nama “Musa” diulang agar rujukan pronomina jelas dalam bahasa Indonesia.
- source_word: הַר הָאֱלֹהִים
  choice: gunung Allah
  rationale: Frasa konstruksi diterjemahkan langsung dan tidak diganti dengan nama Sinai atau Horeb yang tidak muncul dalam ayat ini.
theological_decisions:
- issue: Rujukan akhiran pronominal pada “anak-anaknya” dan “istrinya”
  choice: Dinyatakan sebagai anak-anak dan istri Musa dalam teks utama.
  alternative: Akhiran itu dapat dibaca secara gramatikal sebagai merujuk kepada Yitro.
  rationale: Konteks langsung dalam Keluaran 18:2–4 menyebut istri Musa dan kedua anak Musa yang dibawa Yitro. Catatan kaki mempertahankan bentuk harfiah dan mengakui potensi ambiguitas pronominal Ibrani.
- issue: Identitas “gunung Allah”
  choice: Mempertahankan sebutan deskriptif “gunung Allah.”
  alternative: Gunung Sinai atau Horeb.
  rationale: Teks Ibrani ayat ini memakai הַר הָאֱלֹהִים, bukan nama Sinai atau Horeb; terjemahan tidak memasukkan nama yang tidak disebutkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Pengulangan nama Musa dipertahankan demi kejelasan rujukan, sedangkan “gunung Allah” diterjemahkan secara transparan tanpa penafsiran tambahan.
