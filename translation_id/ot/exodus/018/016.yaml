  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי יִהְיֶ֨ה לָ/הֶ֤ם דָּבָר֙ בָּ֣א אֵלַ֔/י וְ/שָׁ֣פַטְתִּ֔י בֵּ֥ין אִ֖ישׁ וּ/בֵ֣ין רֵעֵ֑/הוּ וְ/הוֹדַעְתִּ֛י אֶת חֻקֵּ֥י הָ/אֱלֹהִ֖ים וְ/אֶת תּוֹרֹתָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/016.yaml
  text: When they have a matter[a], it comes to me, and I judge between a man and his neighbor[c][b], and I make known the statutes of God and his laws.
translation:
  language: id
  text: Setiap kali mereka mempunyai suatu perkara[a], perkara itu datang kepadaku. Aku mengadili antara seseorang dan sesamanya[b], serta memberitahukan kepada mereka ketetapan-ketetapan Allah dan hukum-hukum-Nya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “suatu kasus” atau “suatu sengketa.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “antara seorang laki-laki dan sesamanya”; bentuk tunggal ini dapat berfungsi secara representatif.
    reason: cultural_note
  - marker: c
    text: Atau “petunjuk-petunjuk-Nya.” Kata Ibrani yang dipakai dapat berarti petunjuk atau pengajaran secara lebih luas, meskipun di sini konteksnya adalah hukum.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Setiap kali
  rationale: Dalam konteks ini, כִּי memperkenalkan keadaan yang berulang dan menjelaskan kebiasaan Musa; “setiap kali” menyampaikan nuansa temporal-kondisional secara alami.
- source_word: יִהְיֶה לָהֶם דָּבָר
  choice: mereka mempunyai suatu perkara
  rationale: דָּבָר luas maknanya, tetapi dalam konteks pengadilan menunjuk pada perkara atau sengketa. “Perkara” mempertahankan cakupan legal tanpa terlalu mempersempitnya.
- source_word: בָּא אֵלַי
  choice: perkara itu sampai kepadaku
  rationale: Bentuk בָּא adalah tunggal dan paling wajar dikaitkan dengan דָּבָר. Pengulangan “perkara itu” memperjelas subjek dalam bahasa Indonesia tanpa mengubah gambaran bahwa perkara tersebut datang kepada Musa.
- source_word: וְשָׁפַטְתִּי
  choice: Aku mengadili
  rationale: שׁפט di sini menunjuk pada tindakan memeriksa dan memutus perkara. “Mengadili” langsung, wajar, dan sesuai konteks yudisial.
- source_word: בֵּין אִישׁ וּבֵין רֵעֵהוּ
  choice: antara seseorang dan sesamanya
  rationale: Ungkapan Ibrani berbentuk tunggal representatif. Bahasa Indonesia tidak perlu menambahkan jenis kelamin yang tidak ditandai secara alami; “seseorang dan sesamanya” mempertahankan hubungan antarpihak dalam sengketa.
- source_word: וְהוֹדַעְתִּי
  choice: memberitahukan kepada mereka
  rationale: Bentuk Hifil dari ידע berarti menyebabkan orang mengetahui. “Memberitahukan” mempertahankan daya kausatifnya, sedangkan objek tak langsung “kepada mereka” dijelaskan dari konteks.
- source_word: חֻקֵּי הָאֱלֹהִים
  choice: ketetapan-ketetapan Allah
  rationale: חֻקִּים menunjuk pada ketentuan atau ketetapan yang ditetapkan. Pilihan ini formal tetapi tetap mudah dipahami.
- source_word: תּוֹרֹתָיו
  choice: hukum-hukum-Nya
  rationale: תּוֹרָה dapat berarti pengajaran atau petunjuk, tetapi dalam konteks penyelesaian perkara dan sejajar dengan “ketetapan-ketetapan,” “hukum-hukum” menyampaikan daya normatifnya dengan jelas. Bentuk jamak dipertahankan.
theological_decisions:
- issue: Ungkapan tunggal maskulin אִישׁ ... רֵעֵהוּ
  choice: seseorang dan sesamanya
  alternative: seorang laki-laki dan sesamanya
  rationale: Bentuk Ibrani merupakan ungkapan hukum tunggal yang representatif. “Seseorang” adalah padanan Indonesia yang alami dan tidak memaksakan pembatasan jenis kelamin yang belum tentu dimaksudkan oleh konstruksi tersebut; catatan kaki mempertahankan bentuk harfiahnya.
- issue: Makna תּוֹרֹתָיו dalam konteks hukum
  choice: hukum-hukum-Nya
  alternative: petunjuk-petunjuk-Nya
  rationale: Konteks pengadilan mendukung nuansa normatif, tetapi keluasan makna “petunjuk” tetap diakui dalam catatan kaki agar ketegangan leksikal tidak dihapus.
- issue: Subjek gramatikal בָּא
  choice: perkara itu sampai kepadaku
  alternative: mereka datang kepadaku
  rationale: Kata kerja tunggal paling langsung merujuk kembali kepada דָּבָר, “perkara.” Terjemahan ini mengikuti bentuk sumber dan menghindari penggantian diam-diam dengan subjek jamak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ilahi ditulis dengan bentuk hormat “-Nya.” Kalimat dipecah menjadi dua untuk kejernihan tanpa mengubah hubungan maknanya. Istilah legal dipilih agar dapat dipahami pembaca umum, sedangkan alternatif penting dicatat dalam catatan kaki.
