base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/023.yaml
  text: If you do this thing[a], and God so commands you, then you will be able to endure[d][c][b], and all this people also will go to their place in peace.
translation:
  language: id
  text: Jika engkau melakukan hal ini,[a] dan Allah memerintahkanmu demikian, engkau akan sanggup bertahan,[b] dan seluruh bangsa ini pun akan pulang ke tempat mereka masing-masing dengan damai.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perkara ini” atau “rencana ini.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “berdiri”; dalam konteks ini berarti tetap mampu menanggung beban atau bertahan.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “akan datang ke tempatnya.” Bentuk tunggal Ibrani mengikuti kata kolektif “bangsa”; maksudnya ialah setiap orang pulang ke tempatnya dengan damai.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Menandai syarat secara langsung dan alami dalam bahasa Indonesia.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: hal ini
  rationale: דָּבָר di sini menunjuk pada tindakan atau rencana yang baru saja diusulkan; 'hal ini' dekat dengan bentuk sumber tanpa mempersempit maknanya.
- source_word: וְצִוְּךָ אֱלֹהִים
  choice: dan Allah memerintahkannya kepadamu
  rationale: 'Mempertahankan koordinasi sebagai syarat tambahan: tindakan itu harus sesuai dengan perintah Allah. Akhiran ''-nya'' secara alami menunjuk kembali pada hal yang diusulkan.'
- source_word: וְיָכָלְתָּ עֲמֹד
  choice: engkau akan sanggup bertahan
  rationale: יכל menyatakan kemampuan, sedangkan עמד secara harfiah 'berdiri' tetapi dalam konteks ini berarti tetap mampu menanggung beban.
- source_word: כָּל־הָעָם הַזֶּה
  choice: seluruh bangsa ini
  rationale: עָם adalah nomina kolektif; 'seluruh bangsa ini' mempertahankan bentuk kolektif dan terdengar wajar dalam bahasa Indonesia.
- source_word: עַל־מְקֹמוֹ יָבֹא
  choice: akan pulang ke tempat mereka masing-masing
  rationale: Secara harfiah 'akan datang/pergi ke tempatnya.' Bentuk tunggal mengikuti nomina kolektif dan berdaya distributif; 'masing-masing' menjelaskannya secara alami tanpa mengubah maksud.
- source_word: בְשָׁלוֹם
  choice: dengan damai
  rationale: Mempertahankan keluasan שָׁלוֹם, yang dapat mencakup kedamaian, keselamatan, dan keadaan sejahtera.
theological_decisions:
- issue: Hubungan nasihat Yitro dengan perintah Allah
  choice: Klausa tentang perintah Allah dipertahankan sebagai syarat tambahan bagi tindakan Musa.
  alternative: Klausa itu dapat dipahami sebagai pernyataan atau harapan bahwa Allah akan memberi perintah.
  rationale: Dalam rangkaian bersyarat ini, pembacaan sebagai syarat tambahan paling sesuai dengan sintaksis dan tidak memberi kesan bahwa nasihat Yitro berlaku terlepas dari persetujuan Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang bermartabat dan mudah dipahami. Pronomina 'engkau' dipakai untuk sapaan tunggal kepada Musa. Susunan kalimat menjaga dua syarat dan dua hasil, sementara ungkapan kolektif Ibrani dibuat alami dalam bahasa Indonesia.
