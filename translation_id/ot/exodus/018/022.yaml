base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/022.yaml
  text: And let them judge the people at all times[a]. Then every great matter they shall bring to you, but every small matter they themselves shall judge. So make it lighter for yourself[b], and they will bear the burden with you.
translation:
  language: id
  text: Biarlah mereka mengadili bangsa itu setiap waktu. Setiap perkara besar harus mereka bawa kepadamu, tetapi setiap perkara kecil harus mereka putuskan sendiri.[a] Dengan demikian, ringankanlah bebanmu,[b] dan mereka akan menanggung beban itu bersamamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setiap perkara penting ... setiap perkara kurang penting.” Bahasa Ibrani secara harfiah memakai kata “besar” dan “kecil” untuk perkara-perkara yang diajukan guna diputuskan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ringankanlah dari atasmu.” Yang dimaksud ialah beban mengadili bangsa itu.
    reason: implicit_object
lexical_decisions:
- source_word: וְשָׁפְטוּ אֶת־הָעָם
  choice: Biarlah mereka mengadili bangsa itu
  rationale: Kata שׁפט dalam konteks ini berarti mengadili atau memutuskan perkara. Bentuk “biarlah” menyampaikan daya instruktif rangkaian verbal Ibrani tanpa menjadikannya sekadar ramalan.
- source_word: בְּכָל־עֵת
  choice: setiap waktu
  rationale: Terjemahan langsung yang mempertahankan cakupan temporal ungkapan Ibrani; maksudnya para hakim senantiasa tersedia, bukan bahwa mereka mengadili tanpa henti.
- source_word: כָּל־הַדָּבָר הַגָּדֹל ... כָּל־הַדָּבָר הַקָּטֹן
  choice: setiap perkara besar ... setiap perkara kecil
  rationale: “Perkara” sesuai dengan konteks pengadilan, sedangkan pasangan “besar/kecil” mempertahankan kontras leksikal teks Ibrani.
- source_word: יָבִיאוּ אֵלֶיךָ
  choice: harus mereka bawa kepadamu
  rationale: 'Menyatakan pengaturan yang diperintahkan Yitro: perkara besar harus diajukan kepada Musa.'
- source_word: יִשְׁפְּטוּ הֵם
  choice: harus mereka putuskan sendiri
  rationale: Pronomina eksplisit הֵם memberi penekanan kontrastif. “Sendiri” mempertahankan penekanan bahwa merekalah, bukan Musa, yang menangani perkara kecil.
- source_word: וְהָקֵל מֵעָלֶיךָ
  choice: ringankanlah bebanmu
  rationale: וְהָקֵל adalah imperatif Hifil, sehingga diterjemahkan sebagai perintah, bukan hasil prediktif. “Beban” tersirat dalam idiom ‘meringankan dari atasmu’ dan diperlukan agar wajar dalam bahasa Indonesia.
- source_word: וְנָשְׂאוּ אִתָּךְ
  choice: mereka akan ikut menanggungnya bersamamu
  rationale: נשׂא berarti menanggung atau memikul. Akhiran “-nya” merujuk pada beban tugas mengadili yang tersirat oleh konteks, sementara “bersamamu” mempertahankan אִתָּךְ.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “mengadili” dan “memutuskan perkara” memperjelas konteks yudisial tanpa membuat gaya ayat terlalu teknis. Penanda catatan kaki [a] dan [b] ditempatkan pada klausa yang diterangkannya.
