  to: Biarlah mereka mengadili bangsa itu setiap waktu. Setiap perkara besar harus mereka bawa kepadamu, tetapi setiap perkara kecil harus mereka putuskan sendiri.[a] Dengan demikian, ringankanlah bebanmu,[b] dan mereka akan menanggung beban itu bersamamu.
