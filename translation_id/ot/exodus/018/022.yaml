  naturalness: Bahasa umumnya baku dan jelas. “Mereka akan menanggung beban itu bersamamu” lebih langsung dan alami daripada “mereka akan ikut menanggungnya bersamamu.”
  terminology: “Mengadili,” “perkara,” dan “memutuskan” cocok dengan konteks משפט. Pasangan “besar/kecil” sebaiknya tetap dipertahankan; catatan kaki tidak sebaiknya mengganti ‘kecil’ dengan ‘ringan,’ karena itu dapat mengaburkan kontras leksikal Ibrani.
