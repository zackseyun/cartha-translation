  to: Ketika ayah mertua Musa melihat segala yang sedang dilakukannya bagi umat itu, ia berkata, “Apa yang sedang kaulakukan ini bagi umat itu? Mengapa engkau duduk seorang diri, sedangkan seluruh umat itu berdiri di hadapanmu[a] dari pagi sampai petang?”
