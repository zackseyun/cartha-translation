  text: וַ/יַּרְא֙ חֹתֵ֣ן מֹשֶׁ֔ה אֵ֛ת כָּל אֲשֶׁר ה֥וּא עֹשֶׂ֖ה לָ/עָ֑ם וַ/יֹּ֗אמֶר מָֽה הַ/דָּבָ֤ר הַ/זֶּה֙ אֲשֶׁ֨ר אַתָּ֤ה עֹשֶׂה֙ לָ/עָ֔ם מַדּ֗וּעַ אַתָּ֤ה יוֹשֵׁב֙ לְ/בַדֶּ֔/ךָ וְ/כָל הָ/עָ֛ם נִצָּ֥ב עָלֶ֖י/ךָ מִן בֹּ֥קֶר עַד עָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/014.yaml
  text: When Moses's father-in-law saw all that he was doing for the people[a], he said, “What is this thing that you are doing for the people? Why do you sit alone[b], while all the people stand before you from morning until evening?”
translation:
  language: id
  text: Ketika ayah mertua Musa melihat segala yang sedang dilakukannya bagi umat itu, ia berkata, “Apa yang sedang kaulakukan ini bagi umat itu? Mengapa engkau duduk seorang diri, sedangkan seluruh umat itu berdiri di hadapanmu[a] dari pagi sampai petang?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berdiri di atasmu.” Dalam konteks ini ungkapan tersebut berarti berdiri di hadapan Musa untuk menghadapnya, kemungkinan dalam perkara-perkara pengadilan.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹתֵן מֹשֶׁה
  choice: mertua Musa
  rationale: חֹתֵן menunjuk pada kerabat melalui perkawinan dan dalam konteks ini adalah ayah mertua Musa. Bahasa Indonesia lazim memakai bentuk ringkas “mertua Musa”; konteks sebelumnya memperjelas identitasnya.
- source_word: וַיַּרְא
  choice: melihat
  rationale: ראה adalah verba umum untuk melihat; pilihan ini mempertahankan kesederhanaan narasi tanpa menambahkan nuansa seperti mengamati atau menyadari.
- source_word: אֵת כָּל אֲשֶׁר הוּא עֹשֶׂה לָעָם
  choice: segala yang dilakukannya bagi bangsa itu
  rationale: Partisipel עֹשֶׂה menggambarkan kegiatan Musa yang sedang berlangsung. לָעָם paling wajar dipahami sebagai tindakan bagi kepentingan bangsa itu.
- source_word: מָה הַדָּבָר הַזֶּה אֲשֶׁר אַתָּה עֹשֶׂה לָעָם
  choice: Apa yang kaulakukan bagi bangsa ini?
  rationale: Ungkapan Indonesia ini alami dan langsung, serta menyampaikan pertanyaan tentang tindakan atau praktik Musa tanpa mempertahankan idiom Ibrani secara kaku.
- source_word: אַתָּה יוֹשֵׁב לְבַדֶּךָ
  choice: engkau duduk seorang diri
  rationale: ישב mempertahankan gambaran Musa yang duduk, kemungkinan dalam kapasitas mengadili, sedangkan לְבַדֶּךָ menekankan bahwa ia menjalankan tugas itu sendirian.
- source_word: וְכָל הָעָם נִצָּב עָלֶיךָ
  choice: sedangkan seluruh bangsa itu berdiri di hadapanmu
  rationale: נצב berarti berdiri. עַל secara harfiah dapat berarti “di atas/dekat,” tetapi dalam adegan ini menunjuk pada orang-orang yang hadir menghadap Musa; “di hadapanmu” menyampaikan konteks tersebut secara alami.
- source_word: מִן בֹּקֶר עַד עָרֶב
  choice: dari pagi sampai petang
  rationale: Ungkapan temporal ini menunjukkan rentang sepanjang hari. “Dari pagi sampai petang” alami dalam bahasa Indonesia dan tetap dekat dengan bentuk sumber.
