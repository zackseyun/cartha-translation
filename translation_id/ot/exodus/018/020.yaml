base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/020.yaml
  text: And you shall warn them about the statutes and the laws[b][a], and make known to them the way in which they must walk and the work that they must do.
translation:
  language: id
  text: Dan engkau harus memperingatkan mereka tentang ketetapan-ketetapan dan hukum-hukum[a], serta memberitahukan kepada mereka jalan yang harus mereka jalani[b] dan perbuatan yang harus mereka lakukan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “ajaran-ajaran” atau “petunjuk-petunjuk” (Ibrani: torot). Istilah ini dapat menunjuk pada pengajaran secara lebih luas, tetapi konteks hukum di sini mendukung terjemahan “hukum-hukum.”'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “jalan yang mereka akan berjalan di dalamnya.” Ungkapan ini memakai gambaran berjalan untuk menyatakan cara hidup atau perilaku; dalam konteks ini, jalan tersebut bersifat mengikat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזְהַרְתָּה
  choice: Peringatkanlah
  rationale: Bentuk Hifil dari זהר menyatakan peringatan atau nasihat yang sungguh-sungguh dan mengandung pertanggungjawaban. Bentuk imperatif alami dalam bahasa Indonesia sesuai dengan fungsi ujaran dalam konteks ini.
- source_word: הַחֻקִּים
  choice: ketetapan-ketetapan
  rationale: חֻקִּים menunjuk pada ketentuan yang telah ditetapkan; pilihan ini mempertahankan nuansa hukumnya sekaligus membedakannya dari תּוֹרֹת.
- source_word: הַתּוֹרֹת
  choice: hukum-hukum
  rationale: Walaupun תּוֹרָה dapat berarti pengajaran atau petunjuk secara luas, bentuk jamak ini, yang berdampingan dengan חֻקִּים dalam konteks peradilan, paling wajar dipahami sebagai hukum-hukum. Kemungkinan makna yang lebih luas dicatat dalam catatan kaki.
- source_word: וְהוֹדַעְתָּ
  choice: Beritahukanlah
  rationale: Bentuk Hifil dari ידע berarti menyebabkan orang mengetahui. 'Beritahukanlah' menyampaikan daya kausatif itu secara alami dalam bahasa Indonesia.
- source_word: הַדֶּרֶךְ
  choice: jalan
  rationale: '''Jalan'' mempertahankan metafora Ibrani tentang arah dan cara hidup.'
- source_word: יֵלְכוּ בָהּ
  choice: yang harus mereka jalani
  rationale: Frasa ini secara harfiah berbicara tentang berjalan di suatu jalan, tetapi secara kontekstual menunjuk pada perilaku yang diwajibkan. 'Harus' menyatakan daya preskriptif, sedangkan 'jalani' mempertahankan metafora jalan secara alami.
- source_word: הַמַּעֲשֶׂה
  choice: perbuatan
  rationale: מַעֲשֶׂה berarti sesuatu yang dilakukan. 'Perbuatan' cocok dengan perilaku konkret yang dituntut dan lebih alami daripada 'pekerjaan' dalam konteks ini.
- source_word: אֲשֶׁר יַעֲשׂוּן
  choice: yang harus mereka lakukan
  rationale: Klausa relatif ini menunjuk pada tindakan yang diwajibkan; 'harus' menyampaikan kekuatan preskriptif konteks tanpa mengubahnya menjadi sekadar pernyataan masa depan.
