  text: So Moses listened to the voice of his father-in-law and did all that he said[a].
translation:
  language: id
  text: Musa pun mendengarkan perkataan mertuanya dan melakukan segala yang dikatakannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menaati mertuanya.” Ungkapan Ibrani yang secara harfiah berarti “mendengarkan suara mertuanya” dapat mengandung arti mendengarkan dengan taat; klausa berikutnya memperjelas hal itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: mendengarkan
  rationale: Dalam konstruksi שׁמע לְקוֹל, verba ini berarti mendengarkan dengan tanggapan yang nyata, bahkan dapat berarti menaati. Pilihan ini mempertahankan citra mendengar, sedangkan klausa berikutnya memperjelas ketaatan Musa.
- source_word: לְקוֹל
  choice: perkataan
  rationale: Secara harfiah berarti 'kepada suara', tetapi dalam bahasa Indonesia modern 'mendengarkan perkataan' menyampaikan idiom Ibrani secara wajar tanpa mengubahnya menjadi sekadar 'nasihat'.
- source_word: חֹתְנוֹ
  choice: mertuanya
  rationale: Dalam konteks, kata ini menunjuk kepada Yitro, mertua Musa. Bahasa Indonesia tidak memerlukan penandaan gender karena rujukannya sudah jelas dari konteks.
- source_word: וַיַּעַשׂ
  choice: melakukan
  rationale: Ini adalah padanan langsung dan alami bagi verba umum עשה ketika diikuti klausa objek.
- source_word: כֹּל אֲשֶׁר אָמָר
  choice: segala yang dikatakannya
  rationale: Padanan ini mempertahankan cakupan menyeluruh dari כֹּל dan tidak menambahkan nuansa waktu yang tidak diwajibkan oleh bentuk Ibraninya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Mendengarkan perkataan' dipilih daripada terjemahan harfiah 'mendengarkan suara' agar idiomnya alami, sambil mempertahankan hubungan antara mendengar dan bertindak. Penanda catatan kaki [a] dicantumkan dalam teks utama.
