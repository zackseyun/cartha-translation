  yaml_path: translation/ot/exodus/018/027.yaml
  text: Then Moses sent his father-in-law away[a], and he went to his own land.
translation:
  language: id
  text: Lalu Musa melepas ayah mertuanya[a], dan ayah mertuanya itu pergi ke negerinya sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menyuruh ayah mertuanya pergi.”
    reason: Alternatif leksikal bagi וַיְשַׁלַּח; verba ini dapat menyatakan tindakan melepas atau menyuruh seseorang pergi.
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: melepas
  rationale: Bentuk Piel dari שׁלח dengan objek orang di sini berarti menyuruh pergi, melepas, atau mengantarkan pada keberangkatan. “Melepas” alami dalam bahasa Indonesia dan tidak menyiratkan pengusiran secara berlebihan.
- source_word: חֹתְנוֹ
  choice: mertuanya
  rationale: Dalam konteks ini חֹתֵן menunjuk kepada Yitro, ayah dari istri Musa. Bahasa Indonesia lazim memakai “mertua”; konteks pasal telah memperjelas hubungan tersebut.
- source_word: וַיֵּלֶךְ לוֹ
  choice: dan mertuanya itu pergi
  rationale: לוֹ merupakan datif idiomatis yang tidak perlu diterjemahkan tersendiri. Subjek diulangi sebagai “mertuanya itu” agar rujukan pronomina tidak ambigu dalam bahasa Indonesia.
- source_word: אֶל אַרְצוֹ
  choice: ke negerinya sendiri
  rationale: אֶרֶץ dapat berarti tanah atau negeri. “Negerinya sendiri” menyampaikan tujuan kepulangan dan daya posesif tanpa mengesankan negara-bangsa modern.
theological_decisions: []
translation_notes:
  register: Bahasa naratif modern, ringkas, dan bermartabat. Pengulangan “mertuanya” menghindari ambiguitas yang dapat timbul dari dua pemilik rujukan dalam frasa “ia pergi ke negerinya sendiri”.
