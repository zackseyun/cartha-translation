  text: וַ/יִּ֣חַדְּ יִתְר֔וֹ עַ֚ל כָּל הַ/טּוֹבָ֔ה אֲשֶׁר עָשָׂ֥ה יְהוָ֖ה לְ/יִשְׂרָאֵ֑ל אֲשֶׁ֥ר הִצִּיל֖/וֹ מִ/יַּ֥ד מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/009.yaml
  text: Jethro rejoiced over all the good that Yahweh had done for Israel[b][a], whom he had delivered from the hand of Egypt.
translation:
  language: id
  text: Yitro bersukacita atas segala kebaikan yang telah dilakukan Yahweh bagi Israel, yang telah dibebaskan-Nya dari tangan Mesir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan harfiah “dari tangan Mesir” berarti dari kuasa atau kekuasaan Mesir.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַדְּ
  choice: bersukacita
  rationale: Kata kerja ini menyatakan kegembiraan atau sukacita. “Bersukacita” alami dalam bahasa Indonesia dan sesuai dengan kuatnya tanggapan Yitro terhadap tindakan penyelamatan Allah.
- source_word: יִתְרוֹ
  choice: Yitro
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: עַל כָּל הַטּוֹבָה
  choice: atas segala kebaikan
  rationale: Preposisi עַל menunjukkan alasan atau hal yang menimbulkan sukacita, sedangkan bentuk tunggal kolektif הַטּוֹבָה paling wajar diterjemahkan “segala kebaikan”.
- source_word: אֲשֶׁר עָשָׂה יְהוָה לְיִשְׂרָאֵל
  choice: yang telah dilakukan Yahweh bagi Israel
  rationale: Bentuk “telah dilakukan” menunjukkan bahwa tindakan Yahweh mendahului sukacita Yitro; לְ menandai tindakan demi kepentingan Israel.
- source_word: אֲשֶׁר הִצִּילוֹ
  choice: yang telah dibebaskan-Nya
  rationale: Klausa relatif ini paling wajar merujuk kepada Israel sebagai kesatuan kolektif. Bentuk pasif dengan enklitik “-Nya” menghasilkan bahasa Indonesia yang alami sambil tetap menyatakan Yahweh sebagai pelaku.
- source_word: מִיַּד מִצְרָיִם
  choice: dari tangan Mesir
  rationale: Terjemahan ini mempertahankan metafora Ibrani tentang tangan sebagai kuasa atau kendali; maknanya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama ilahi YHWH. “Yahweh” mempertahankan nama pribadi tersebut dan mengikuti bentuk transliterasi yang paling luas diterima.
- issue: Acuan akhiran tunggal pada הִצִּילוֹ
  choice: Israel sebagai kesatuan kolektif
  alternative: sebab Ia telah membebaskannya
  rationale: Akhiran maskulin tunggal secara alami mengacu kepada Israel yang dipandang sebagai satu umat. Susunan Indonesia mempertahankan acuan itu tanpa memaksakan kata ganti bernyawa atau tak bernyawa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Metafora sumber “tangan Mesir” dipertahankan karena masih dapat dipahami, dengan penjelasan singkat dalam catatan kaki. Penanda catatan ditempatkan tepat sesudah ungkapan yang dijelaskan.
