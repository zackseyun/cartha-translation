  text: וַ/יִּקַּ֗ח יִתְרוֹ֙ חֹתֵ֣ן מֹשֶׁ֔ה אֶת צִפֹּרָ֖ה אֵ֣שֶׁת מֹשֶׁ֑ה אַחַ֖ר שִׁלּוּחֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/002.yaml
  text: Jethro[a], Moses’ father-in-law, took Zipporah, Moses’ wife, after he had sent her away.
translation:
  language: id
  text: Yitro, ayah mertua Musa, mengambil Zipora, istri Musa, sesudah Musa menyuruhnya pergi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sesudah Zipora disuruh pergi.” Secara harfiah, teks Ibrani menyatakan “sesudah pengirimannya pergi” dan tidak menyebutkan siapa pelaku tindakan itu.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: Kata kerja לָקַח pada dasarnya berarti “mengambil”. Pilihan ini mempertahankan keluasan maknanya tanpa memastikan apakah Yitro menerima Zipora dalam pemeliharaannya atau membawanya serta.
- source_word: יִתְרוֹ
  choice: Yitro
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: חֹתֵן מֹשֶׁה
  choice: mertua Musa
  rationale: חֹתֵן menunjuk pada kerabat laki-laki melalui perkawinan dan dalam konteks ini berarti ayah mertua Musa; “mertua Musa” merupakan ungkapan Indonesia yang alami dan tidak berlebihan.
- source_word: צִפֹּרָה
  choice: Zipora
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: אֵשֶׁת מֹשֶׁה
  choice: istri Musa
  rationale: Frasa konstruksi ini secara langsung mengidentifikasi Zipora sebagai istri Musa.
- source_word: אַחַר
  choice: sesudah
  rationale: Kata ini menyatakan urutan waktu; “sesudah” sesuai dengan ragam naratif yang bermartabat dan alami.
- source_word: שִׁלּוּחֶיהָ
  choice: Musa menyuruhnya pergi
  rationale: Bentuk nomina dengan sufiks feminin secara harfiah menunjuk pada “penyuruhannya pergi” tanpa menyebut pelaku. Konteks paling wajar menunjuk kepada Musa sebagai pelaku, tetapi ketidakjelasan sumber dipertahankan melalui catatan kaki.
theological_decisions:
- issue: Pelaku tersirat dalam frasa אַחַר שִׁלּוּחֶיהָ
  choice: “sesudah Musa menyuruhnya pergi”
  alternative: “sesudah ia disuruh pergi”
  rationale: Bahasa Ibrani memakai bentuk nominal dengan sufiks feminin dan tidak menyatakan siapa yang menyuruh Zipora pergi. Musa merupakan pelaku tersirat yang paling wajar menurut konteks, tetapi bentuk pasif tetap mungkin sehingga dicantumkan dalam catatan kaki agar ambiguitas asli tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang ringkas dan bernada naratif. Nama Yitro dan Zipora memakai bentuk Indonesia yang lazim. Pengulangan “Musa” dipertahankan demi kejelasan, sedangkan ambiguitas mengenai pelaku tindakan dijelaskan dalam catatan kaki.
