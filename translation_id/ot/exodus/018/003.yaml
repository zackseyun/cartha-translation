  yaml_path: translation/ot/exodus/018/003.yaml
  text: and her two sons[a], of whom the name of the one was Gershom, for he said, “I have been a foreigner in a foreign land.”
translation:
  language: id
  text: dan kedua anak laki-lakinya, yang seorang bernama Gersom, sebab Musa berkata, “Aku pernah tinggal sebagai pendatang di negeri asing.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku dahulu orang asing di negeri asing.” Kata Ibrani גֵּר dapat berarti pendatang, penduduk sementara, atau orang asing.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת שְׁנֵי בָנֶיהָ
  choice: dan kedua anak laki-lakinya
  rationale: Kata וְ menghubungkan ayat ini dengan klausa sebelumnya, sedangkan אֵת menandai objek langsung yang diteruskan dari ayat sebelumnya. שְׁנֵי בָנֶיהָ secara harfiah berarti ‘kedua anak laki-lakinya’.
- source_word: אֲשֶׁר שֵׁם הָאֶחָד
  choice: yang seorang bernama
  rationale: Ungkapan ini membedakan salah satu dari kedua anak itu tanpa menyatakan urutan kelahiran. Susunan ini alami dalam bahasa Indonesia dan tidak menafsirkan הָאֶחָד sebagai ‘yang pertama’.
- source_word: גֵּרְשֹׁם
  choice: Gersom
  rationale: Nama Ibrani ditransliterasikan dengan bentuk Indonesia yang lazim.
- source_word: כִּי אָמַר
  choice: sebab Musa berkata
  rationale: כִּי memperkenalkan alasan pemberian nama. Subjek tersirat diperjelas sebagai Musa agar kutipan mudah dipahami dalam bahasa Indonesia.
- source_word: גֵּר
  choice: pendatang
  rationale: גֵּר menunjuk orang yang tinggal di negeri yang bukan miliknya sebagai orang luar atau penduduk sementara. ‘Pendatang’ jelas dan alami, sembari mempertahankan kemungkinan nuansa tinggal sementara.
- source_word: הָיִיתִי
  choice: aku telah menjadi
  rationale: Bentuk qatal menyatakan keadaan yang dialami Musa. ‘Telah menjadi’ mempertahankan sifat reflektif perkataan itu tanpa memastikan apakah keadaan tersebut sudah berakhir.
- source_word: בְּאֶרֶץ נָכְרִיָּה
  choice: di negeri asing
  rationale: Terjemahan langsung dan alami bagi ungkapan yang berarti negeri yang bukan negeri sendiri.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. ‘Yang seorang’ mempertahankan pembedaan Ibrani tanpa mengubahnya menjadi urutan ‘yang pertama’. Penanda catatan kaki ditempatkan sesudah kutipan yang dijelaskannya.
