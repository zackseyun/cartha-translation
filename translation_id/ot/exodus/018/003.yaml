  naturalness: Susunan “yang seorang bernama Gersom” dan “negeri asing” alami dalam bahasa Indonesia baku modern. “Aku pernah tinggal sebagai pendatang” lebih idiomatis dan lebih jelas menyatakan keadaan hidup sebagai orang luar daripada “Aku telah menjadi pendatang.”
  terminology: “Anak laki-lakinya,” “Gersom,” dan “pendatang” dapat dipertahankan. Catatan kaki dengan tepat memberi alternatif “orang asing” dan menjelaskan rentang makna גֵּר.
