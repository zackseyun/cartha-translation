  text: וַ/יִּקַּ֞ח יִתְר֨וֹ חֹתֵ֥ן מֹשֶׁ֛ה עֹלָ֥ה וּ/זְבָחִ֖ים לֵֽ/אלֹהִ֑ים וַ/יָּבֹ֨א אַהֲרֹ֜ן וְ/כֹ֣ל זִקְנֵ֣י יִשְׂרָאֵ֗ל לֶ/אֱכָל לֶ֛חֶם עִם חֹתֵ֥ן מֹשֶׁ֖ה לִ/פְנֵ֥י הָ/אֱלֹהִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/012.yaml
  text: Then Jethro[a], Moses’ father-in-law, took a burnt offering and sacrifices for God, and Aaron and all the elders of Israel came to eat bread with Moses’ father-in-law before God.
translation:
  language: id
  text: Kemudian Yitro, ayah mertua Musa, mengambil kurban bakaran dan kurban-kurban bagi Allah. Harun dan semua tua-tua Israel datang untuk makan bersama[a] dengan ayah mertua Musa di hadapan Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “makan roti”; suatu ungkapan yang dapat berarti makan bersama.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: Makna dasar לקח adalah 'mengambil'. Pilihan ini mempertahankan bentuk teks Ibrani tanpa secara tersirat mengubahnya menjadi 'mempersembahkan', meskipun konteksnya jelas bersifat kurban.
- source_word: חֹתֵן מֹשֶׁה
  choice: mertua Musa
  rationale: Dalam konteks kisah ini, חֹתֵן menunjuk kepada ayah mertua Musa. Bahasa Indonesia lazim memakai bentuk ringkas 'mertua'.
- source_word: עֹלָה
  choice: kurban bakaran
  rationale: עֹלָה adalah istilah baku bagi kurban yang dibakar seluruhnya. 'Kurban bakaran' jelas, ringkas, dan sudah dikenal dalam bahasa Indonesia Alkitabiah.
- source_word: זְבָחִים
  choice: kurban-kurban
  rationale: Bentuk jamak זְבָחִים merupakan istilah yang lebih luas daripada עֹלָה. Bentuk ulang mempertahankan jumlah jamak dan pembedaan dari kurban bakaran.
- source_word: לֵאלֹהִים
  choice: bagi Allah
  rationale: Preposisi ל menyatakan arah atau peruntukan. 'Bagi Allah' secara alami menunjukkan bahwa kurban-kurban itu diperuntukkan bagi-Nya.
- source_word: וַיָּבֹא אַהֲרֹן וְכָל זִקְנֵי יִשְׂרָאֵל
  choice: Harun dan semua tua-tua Israel datang
  rationale: Walaupun verba Ibrani berbentuk tunggal dan mendahului subjek majemuk, bahasa Indonesia secara wajar menyajikan Harun dan semua tua-tua sebagai pelaku bersama.
- source_word: לֶאֱכָל לֶחֶם
  choice: untuk makan bersama
  rationale: Secara harfiah frasa ini berarti 'untuk makan roti', tetapi merupakan ungkapan Ibrani yang dapat berarti makan atau berbagi hidangan. 'Makan bersama' menyampaikan fungsi idiomatisnya secara alami; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: עִם חֹתֵן מֹשֶׁה
  choice: dengan mertua Musa
  rationale: Teks Ibrani mengulangi sebutan hubungan keluarga, bukan nama Yitro. Pengulangan itu dipertahankan.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: di hadapan Allah
  rationale: Ungkapan לִפְנֵי berarti 'di hadapan' atau 'dalam kehadiran'. 'Di hadapan Allah' mempertahankan nuansa khidmat dan latar peribadatan tanpa menambahkan tafsiran.
theological_decisions:
- issue: Makna frasa makan dalam konteks kurban
  choice: Teks menggambarkan makan bersama yang berkaitan dengan kurban dan berlangsung di hadapan Allah, tanpa secara eksplisit menamainya perjamuan perjanjian.
  alternative: Frasa itu hanya menyatakan bahwa mereka memakan roti biasa; atau terjemahan secara eksplisit menyebutnya perjamuan perjanjian.
  rationale: Kurban, keikutsertaan Harun dan para tua-tua, serta ungkapan 'di hadapan Allah' menunjukkan suasana makan sakral. Namun, teks sendiri tidak memakai istilah 'perjanjian', sehingga terjemahan tidak menambahkannya.
- issue: Referen אֱלֹהִים
  choice: Allah
  alternative: allah-allah atau para dewa
  rationale: Konteks narasi dan pemakaian dengan penanda definit pada akhir ayat menuntut referen tunggal, yaitu Allah Israel.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Nama יִתְרוֹ ditulis 'Yitro' agar dekat dengan bentuk Ibrani. Istilah 'tua-tua Israel' dipilih untuk jabatan komunitas, sedangkan struktur dua kalimat menghindari kalimat panjang tanpa mengubah urutan peristiwa.
