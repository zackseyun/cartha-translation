  source_fidelity: 'Bagian utama ayat diterjemahkan dengan setia: עתה ידעתי menyatakan pengakuan yang baru dicapai, יהוה dipertahankan sebagai "Yahweh", dan perbandingan מִכָּל־הָאֱלֹהִים diterjemahkan dengan tepat. Klausa terakhir memang eliptis dan rujukan pronominanya diperdebatkan. Draf berupaya mempertahankan kedua pronomina jamak, tetapi "orang-orang itu" menambahkan penunjukan demonstratif yang tidak ada dalam bahasa Ibrani dan membuat kalimat kurang idiomatis.'
  naturalness: '"Dalam perkara yang di dalamnya" terasa berlebihan dalam bahasa Indonesia modern. "Dalam hal yang mereka bertindak congkak" lebih ringkas dan alami, sambil tetap tidak menetapkan identitas kedua kelompok yang dirujuk oleh "mereka".'
  terminology: '"Yahweh", "ilah", dan "congkak" sesuai dengan register baku-khidmat dan pilihan istilah yang dipertahankan. Kapital "Ia" secara wajar menandai subjek tersirat dalam pembacaan utama tanpa mengubah catatan mengenai kesulitan teks.'
