source:
  edition: WLC
  text: עַתָּ֣ה יָדַ֔עְתִּי כִּֽי גָד֥וֹל יְהוָ֖ה מִ/כָּל הָ/אֱלֹהִ֑ים כִּ֣י בַ/דָּבָ֔ר אֲשֶׁ֥ר זָד֖וּ עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/011.yaml
  text: Now I know that Yahweh is greater than all the gods[a], because in the matter in which they acted arrogantly against them, he was above them.
translation:
  language: id
  text: Sekarang aku tahu bahwa Yahweh lebih besar daripada semua ilah, sebab dalam hal yang mereka bertindak congkak terhadap mereka, Ia mengatasi mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Klausa terakhir dalam bahasa Ibrani sulit dipahami. Terjemahan lain: “sebab justru dalam hal yang mereka lakukan dengan congkak terhadap mereka.” Klausa ini mungkin secara khusus menunjuk pada perlakuan congkak orang Mesir terhadap Israel dan pada keunggulan Yahweh yang dinyatakan melalui perkara itu.'
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה יָדַעְתִּי
  choice: Sekarang aku tahu
  rationale: Bentuk perfektum menyatakan keadaan pengetahuan yang kini tercapai berdasarkan peristiwa yang baru disaksikan; ungkapan ini alami dalam bahasa Indonesia dan tetap memuat nuansa pengakuan yang baru diperoleh.
- source_word: גָדוֹל יְהוָה מִכָּל הָאֱלֹהִים
  choice: Yahweh lebih besar daripada semua ilah
  rationale: Preposisi מִן bersama כָּל membentuk perbandingan, sehingga גָדוֹל diterjemahkan 'lebih besar'. Nama יהוה ditransliterasikan 'Yahweh', sedangkan bentuk jamak הָאֱלֹהִים dalam perbandingan ini diterjemahkan 'semua ilah'.
- source_word: בַדָּבָר
  choice: dalam perkara
  rationale: דָּבָר di sini menunjuk pada perkara atau rangkaian peristiwa yang sedang dibicarakan. 'Dalam perkara' mempertahankan bentuk ungkapan Ibrani tanpa mempersempit rujukannya secara berlebihan.
- source_word: זָדוּ
  choice: bertindak congkak
  rationale: Kata kerja ini menyatakan tindakan yang sombong, lancang, atau angkuh. 'Bertindak congkak' jelas, bermartabat, dan sesuai dengan konteks penindasan oleh pihak Mesir.
- source_word: עֲלֵיהֶם
  choice: terhadap orang-orang itu … mengatasi mereka
  rationale: Bentuk pronominal jamak dan hubungan sintaksisnya dalam klausa penutup sulit dipastikan. Terjemahan mempertahankan dua rujukan jamak tanpa menamai pihak-pihaknya di dalam teks utama, sambil menyampaikan kemungkinan bahwa Yahweh menunjukkan keunggulan-Nya atas para pelaku yang congkak.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama pribadi ilahi, bukan gelar. Transliterasi 'Yahweh' mempertahankan pembedaan itu tanpa menggantinya dengan gelar.
- issue: 'Makna klausa penutup yang padat: כִּי בַדָּבָר אֲשֶׁר זָדוּ עֲלֵיהֶם'
  choice: sebab dalam perkara yang di dalamnya mereka bertindak congkak terhadap orang-orang itu, Ia mengatasi mereka
  alternative: sebab justru dalam hal yang mereka lakukan dengan congkak terhadap mereka
  rationale: Bahasa Ibraninya padat dan secara sintaksis sukar; subjek tersirat dan rujukan pronomina tidak sepenuhnya jelas. Teks utama menyajikan kemungkinan bahwa Yahweh terbukti unggul atas para penindas dalam ranah kesombongan mereka sendiri, sedangkan catatan kaki mempertahankan pembacaan yang lebih harfiah dan terbuka.
- issue: Identitas 'semua ilah'
  choice: semua ilah
  alternative: semua makhluk ilahi; semua dewa
  rationale: Bentuk jamak אֱלֹהִים dalam konteks pengakuan Yitro paling wajar menunjuk pada ilah-ilah yang dibandingkan dengan Yahweh. Terjemahan tidak menambahkan penilaian tentang hakikat atau keberadaan mereka yang tidak dinyatakan langsung dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata 'aku' dipakai karena ini ucapan langsung Yitro; 'ilah' mempertahankan istilah keagamaan yang luas. Huruf kapital pada 'Ia' membantu memperjelas bahwa subjek tersirat dalam pembacaan utama ialah Yahweh, sementara catatan kaki mengakui ketidakpastian sintaksis teks Ibrani.
