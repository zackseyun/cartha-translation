  text: And it happened on the next day that Moses sat to judge the people[a], and the people stood before Moses from morning until evening.
translation:
  language: id
  text: Keesokan harinya, Musa duduk untuk mengadili bangsa itu, dan bangsa itu berdiri di hadapan Musa[a] dari pagi sampai petang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, "berdiri mengelilingi Musa." Kata depan Ibrani yang diterjemahkan "di hadapan" juga dapat dipahami secara lebih harfiah dalam arti spasial.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: Keesokan harinya
  rationale: Ungkapan ini secara alami menyampaikan kelanjutan narasi dan waktu pada hari berikutnya tanpa mempertahankan formula Ibrani secara kaku.
- source_word: וַיֵּשֶׁב
  choice: duduk
  rationale: Makna konkret verba dipertahankan; dalam konteks ini Musa mengambil posisi duduk untuk menjalankan tugas peradilan.
- source_word: לִשְׁפֹּט
  choice: untuk mengadili
  rationale: Infinitif שפט di sini menunjuk pada tindakan mendengar dan memutuskan perkara, sehingga 'mengadili' lebih tepat daripada arti pemerintahan yang lebih luas.
- source_word: הָעָם
  choice: bangsa itu
  rationale: עם merujuk secara kolektif kepada komunitas Israel yang telah disebut dalam konteks; 'bangsa itu' alami dan menjaga rujukan kolektif.
- source_word: וַיַּעֲמֹד
  choice: berdiri
  rationale: Terjemahan langsung mempertahankan gambaran postur orang-orang yang menunggu keputusan Musa.
- source_word: עַל מֹשֶׁה
  choice: di hadapan Musa
  rationale: Walaupun על secara dasar dapat berarti 'di atas' atau 'mengelilingi', bersama עמד konteksnya menunjukkan orang-orang berdiri menanti di depan Musa.
- source_word: מִן הַבֹּקֶר עַד הָעָרֶב
  choice: dari pagi sampai petang
  rationale: Ungkapan ini menyampaikan rentang waktu sepanjang hari secara alami dalam bahasa Indonesia.
