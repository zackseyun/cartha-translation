id: EXO.18.21
reference: Exodus 18:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אַתָּ֣ה תֶחֱזֶ֣ה מִ/כָּל הָ֠/עָם אַנְשֵׁי חַ֜יִל יִרְאֵ֧י אֱלֹהִ֛ים אַנְשֵׁ֥י אֱמֶ֖ת שֹׂ֣נְאֵי בָ֑צַע וְ/שַׂמְתָּ֣ עֲלֵ/הֶ֗ם שָׂרֵ֤י אֲלָפִים֙ שָׂרֵ֣י מֵא֔וֹת שָׂרֵ֥י חֲמִשִּׁ֖ים וְ/שָׂרֵ֥י עֲשָׂרֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/021.yaml
  text: But you shall select from all the people able men[a], those who fear God, men of truth, hating dishonest gain; and you shall appoint them over them as chiefs of thousands, chiefs of hundreds, chiefs of fifties[c][b], and chiefs of tens.
translation:
  language: id
  text: 'Tetapi engkau harus memilih dari antara seluruh rakyat itu laki-laki yang cakap[a], yang takut akan Allah, laki-laki yang dapat dipercaya[b], dan yang membenci keuntungan yang tidak jujur[c]. Engkau harus mengangkat mereka sebagai pemimpin atas rakyat itu: pemimpin atas seribu orang, seratus orang, lima puluh orang, dan sepuluh orang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani dapat juga diterjemahkan “laki-laki yang mampu” atau “laki-laki yang gagah berani”; maknanya dapat mencakup kekuatan, kecakapan, atau keberanian.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “laki-laki kebenaran”; dapat juga diterjemahkan “laki-laki yang jujur” atau “laki-laki yang setia”.
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan “keuntungan yang tidak adil”; ungkapan ini menunjuk pada penolakan terhadap laba yang diperoleh melalui ketidakadilan atau korupsi.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶחֱזֶה
  choice: harus memilih
  rationale: Secara dasar verba ini berkaitan dengan melihat atau mengamati, tetapi dalam konteks mengenali calon pemimpin yang memenuhi syarat, maksudnya ialah mencermati lalu memilih.
- source_word: מִכָּל הָעָם
  choice: dari antara seluruh bangsa itu
  rationale: Mengungkapkan makna partitif frasa Ibrani secara wajar dalam bahasa Indonesia dan mempertahankan rujukan kolektif kepada Israel.
- source_word: אַנְשֵׁי חַיִל
  choice: laki-laki yang cakap
  rationale: חַיִל dapat menyatakan kekuatan, kecakapan, kemampuan, atau keberanian. Dalam konteks peradilan dan administrasi ini, kecakapan paling menonjol, sedangkan 'laki-laki' mempertahankan bentuk maskulin sumber.
- source_word: יִרְאֵי אֱלֹהִים
  choice: yang takut akan Allah
  rationale: Ungkapan ini menyatakan rasa hormat dan ketundukan kepada Allah sebagai syarat moral.
- source_word: אַנְשֵׁי אֱמֶת
  choice: dapat dipercaya
  rationale: Secara harfiah berarti 'laki-laki kebenaran', tetapi אֱמֶת di sini mencakup kejujuran, kesetiaan, dan keandalan; 'dapat dipercaya' menyampaikan fungsi ungkapan itu dengan alami.
- source_word: שֹׂנְאֵי בָצַע
  choice: membenci keuntungan yang tidak jujur
  rationale: בָצַע menunjuk pada keuntungan yang diperoleh secara tidak adil atau korup; terjemahan ini tidak mempersempitnya hanya menjadi suap.
- source_word: וְשַׂמְתָּ עֲלֵהֶם
  choice: harus mengangkat mereka sebagai pemimpin atas bangsa itu
  rationale: Menyampaikan tindakan penetapan serta hubungan kewenangan, sambil memperjelas bahwa pronomina kedua merujuk kepada bangsa itu.
- source_word: שָׂרֵי
  choice: pemimpin atas
  rationale: שַׂר dapat berarti kepala, pemimpin, atau pejabat. 'Pemimpin' sesuai dengan konteks administratif tanpa memberi kesan militer yang tidak perlu.
- source_word: אֲלָפִים / מֵאוֹת / חֲמִשִּׁים / עֲשָׂרֹת
  choice: seribu orang, seratus orang, lima puluh orang, dan sepuluh orang
  rationale: Mempertahankan jenjang bilangan dalam teks sumber dengan susunan yang jelas dan alami bagi pembaca Indonesia.
theological_decisions:
- issue: Bahasa bergender dalam persyaratan kepemimpinan
  choice: laki-laki yang cakap
  alternative: orang-orang yang cakap
  rationale: Bahasa Ibrani memakai bentuk maskulin plural אַנְשֵׁי. Terjemahan mempertahankan bentuk itu tanpa menarik kesimpulan doktrinal yang melampaui ayat.
- issue: Makna takut akan Allah
  choice: yang takut akan Allah
  alternative: yang menghormati Allah
  rationale: Terjemahan langsung mempertahankan ketegangan teologis ungkapan יִרְאֵי אֱלֹהִים; maknanya mencakup rasa gentar, hormat, dan ketundukan, sehingga tidak dipersempit menjadi sekadar penghormatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'engkau' dipertahankan untuk sapaan tunggal kepada Musa. Struktur jenjang kepemimpinan dibuat ringkas tanpa menambahkan bahwa angka-angka tersebut pasti merupakan ukuran kelompok formal.
