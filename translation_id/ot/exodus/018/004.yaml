  text: וְ/שֵׁ֥ם הָ/אֶחָ֖ד אֱלִיעֶ֑זֶר כִּֽי אֱלֹהֵ֤י אָבִ/י֙ בְּ/עֶזְרִ֔/י וַ/יַּצִּלֵ֖/נִי מֵ/חֶ֥רֶב פַּרְעֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/004.yaml
  text: And the name of the other was Eliezer[a], for the God of my father was my help, and he delivered me from Pharaoh’s sword.
translation:
  language: id
  text: Nama anak yang lain ialah Eliezer[a], sebab Allah ayahku adalah penolongku dan telah menyelamatkan aku dari pedang Firaun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Eliezer berarti “Allahku adalah penolong.”
    reason: Menjelaskan permainan makna antara nama Ibrani אֱלִיעֶזֶר dan alasan pemberian nama yang langsung menyusul.
lexical_decisions:
- source_word: וְשֵׁם הָאֶחָד
  choice: Nama anak yang lain
  rationale: Dalam konteks dua putra Musa, הָאֶחָד secara idiomatis menunjuk kepada anak yang lain. Kata 'anak' dijelaskan dari konteks ayat sebelumnya agar ungkapan ini alami dalam bahasa Indonesia.
- source_word: אֱלִיעֶזֶר
  choice: Eliezer
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia; makna nama itu berkaitan dengan penjelasan yang menyusul.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan pemberian nama dengan hubungan kausal yang jelas dan wajar.
- source_word: אֱלֹהֵי אָבִי
  choice: Allah ayahku
  rationale: Mempertahankan susunan relasional Ibrani dan rujukannya kepada Allah yang disembah oleh ayah Musa.
- source_word: בְּעֶזְרִי
  choice: adalah penolongku
  rationale: Menerjemahkan nomina עֵזֶר sebagai 'penolong', sekaligus mempertahankan kaitan bunyi dan makna dengan nama Eliezer. Kopula disediakan demi kelancaran bahasa Indonesia tanpa memaksakan kala yang tidak dinyatakan dalam klausa nominal Ibrani.
- source_word: וַיַּצִּלֵנִי
  choice: dan telah menyelamatkan aku
  rationale: Bentuk verbal ini menyatakan tindakan penyelamatan yang sudah terjadi; 'menyelamatkan' alami dan tepat bagi pelepasan dari ancaman maut.
- source_word: מֵחֶרֶב פַּרְעֹה
  choice: dari pedang Firaun
  rationale: Menerjemahkan frasa konstruksi secara dekat; 'pedang' dapat menunjuk baik pada senjata maupun kuasa mematikan Firaun tanpa meniadakan metaforanya.
theological_decisions:
- issue: Tidak adanya penanda ujaran dalam penjelasan nama
  choice: Tidak menambahkan 'katanya' atau penanda ujaran lain
  alternative: Menambahkan 'sebab katanya' untuk menjadikan alasan itu ucapan langsung Musa
  rationale: Teks Ibrani langsung memberikan alasan nama tanpa verba berbicara. Terjemahan mempertahankan ketidakjelasan apakah kata-kata itu dipahami sebagai penjelasan Musa atau komentar narator.
- issue: Kala dalam klausa nominal בְּעֶזְרִי
  choice: Menggunakan 'adalah penolongku'
  alternative: Menggunakan 'telah menjadi penolongku' atau 'menolong aku'
  rationale: Bahasa Ibrani tidak menyatakan kopula atau kala secara eksplisit. 'Adalah penolongku' mempertahankan bentuk nominal dan tidak mempersempit pernyataan hanya kepada satu tindakan lampau.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan 'pedang Firaun' dipertahankan sebagai citra sumber. Tidak ditambahkan verba ujaran yang tidak terdapat dalam teks Ibrani.
