  yaml_path: translation/ot/exodus/018/026.yaml
  text: And they judged the people at all times. Every difficult matter they would bring to Moses[a], but every small matter they themselves would judge.
translation:
  language: id
  text: Mereka mengadili bangsa itu setiap saat. Setiap perkara sulit mereka bawa kepada Musa[a], tetapi setiap perkara kecil mereka adili sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “setiap kasus yang sukar ... setiap perkara ringan.” Dalam konteks peradilan, bahasa Ibrani mempertentangkan perkara yang sulit dengan perkara yang lebih kecil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ
  choice: Mereka mengadili
  rationale: Bentuk Qal ini merangkum tugas para hakim yang berlangsung terus dalam narasi; bentuk lampau tidak perlu ditandai secara morfologis dalam bahasa Indonesia.
- source_word: הָעָם
  choice: bangsa itu
  rationale: עם menunjuk kepada komunitas Israel secara keseluruhan; 'bangsa itu' alami dalam konteks naratif ini dan tidak menambahkan keterangan yang tidak tersurat.
- source_word: בְּכָל עֵת
  choice: setiap waktu
  rationale: Ungkapan ini menyatakan ketersediaan yang tetap atau berulang, bukan hanya satu peristiwa.
- source_word: הַדָּבָר הַקָּשֶׁה
  choice: setiap perkara yang sulit
  rationale: Dalam konteks peradilan, דבר berarti perkara atau kasus; bentuk definit dapat dipahami secara distributif sebagai setiap perkara dalam golongan ini.
- source_word: יְבִיאוּן אֶל מֹשֶׁה
  choice: mereka bawa kepada Musa
  rationale: Klausa ini menggambarkan kebiasaan berulang dalam pengaturan peradilan. Bahasa Indonesia dapat menyatakannya secara alami tanpa penanda aspek tambahan.
- source_word: כָל הַדָּבָר הַקָּטֹן
  choice: setiap perkara yang kecil
  rationale: Terjemahan ini mempertahankan kontras leksikal langsung antara perkara yang sulit dan yang kecil; 'ringan' atau 'sederhana' mungkin secara konteks, tetapi lebih interpretatif.
- source_word: יִשְׁפּוּטוּ הֵם
  choice: mereka adili sendiri
  rationale: Kata ganti mandiri הֵם memberi penekanan; 'sendiri' mempertahankan penegasan bahwa para hakim itulah yang memutus perkara-perkara kecil, bukan Musa.
