  text: עַתָּ֞ה שְׁמַ֤ע בְּ/קֹלִ/י֙ אִיעָ֣צְ/ךָ֔ וִ/יהִ֥י אֱלֹהִ֖ים עִמָּ֑/ךְ הֱיֵ֧ה אַתָּ֣ה לָ/עָ֗ם מ֚וּל הָֽ/אֱלֹהִ֔ים וְ/הֵבֵאתָ֥ אַתָּ֛ה אֶת הַ/דְּבָרִ֖ים אֶל הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/019.yaml
  text: Now listen to my voice[a]; I will advise you, and God be with you. You be for the people before God[c][b], and you shall bring the matters to God.
translation:
  language: id
  text: Sekarang, dengarkanlah aku. Aku akan menasihatimu, dan kiranya Allah menyertaimu.[a] Hendaklah engkau mewakili bangsa itu di hadapan Allah,[b] dan bawalah perkara-perkara kepada Allah.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bentuk Ibrani ini menyatakan harapan atau berkat: “Semoga Allah menyertaimu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “Jadilah engkau bagi bangsa itu di hadapan Allah.” Maksudnya, Musa menghadap Allah demi bangsa itu.'
    reason: alternative_reading
  - marker: c
    text: “Perkara-perkara” di sini merujuk pada persoalan atau perselisihan yang dibawa untuk mendapat keputusan.
    reason: cultural_note
lexical_decisions:
- source_word: עַתָּה
  choice: Sekarang
  rationale: Berfungsi sebagai penanda waktu sekaligus peralihan wacana yang mengantar nasihat Yitro berikutnya.
- source_word: שְׁמַע בְּקֹלִי
  choice: dengarkanlah aku
  rationale: Ungkapan Ibrani harfiahnya berarti 'dengarkanlah suaraku'; padanan Indonesia ini menyampaikan idiom tersebut secara alami tanpa memperkuatnya menjadi perintah untuk taat.
- source_word: אִיעָצְךָ
  choice: Aku akan menasihatimu
  rationale: Kata kerja יעץ berarti memberi nasihat atau pertimbangan; bentuk ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: וִיהִי אֱלֹהִים עִמָּךְ
  choice: dan kiranya Allah menyertaimu
  rationale: Bentuk yusif menyatakan harapan atau berkat; 'kiranya' mempertahankan nuansa itu secara alami.
- source_word: הֱיֵה אַתָּה לָעָם מוּל הָאֱלֹהִים
  choice: Hendaklah engkau mewakili bangsa itu di hadapan Allah
  rationale: Ungkapan harfiah 'jadilah engkau bagi bangsa itu di hadapan Allah' menyatakan fungsi Musa sebagai pihak yang menghadap Allah demi bangsa itu. 'Mewakili' membuat fungsi tersebut jelas tanpa menambahkan jabatan teknis.
- source_word: וְהֵבֵאתָ
  choice: dan bawalah
  rationale: Dalam rangkaian sesudah bentuk perintah, verba ini berfungsi sebagai instruksi lanjutan; imperatif Indonesia menyampaikan alurnya dengan alami.
- source_word: הַדְּבָרִים
  choice: perkara-perkara mereka
  rationale: דברים luas artinya, tetapi dalam konteks pengadilan ini menunjuk pada perkara atau persoalan bangsa yang dibawa untuk mendapat keputusan. Pronomina 'mereka' menjelaskan rujukan yang tersirat dalam konteks.
- source_word: אֶל הָאֱלֹהִים
  choice: kepada Allah
  rationale: Padanan langsung dan alami untuk arah tindakan Musa dalam membawa perkara-perkara itu.
theological_decisions:
- issue: Pemaknaan אֱלֹהִים dalam konteks narasi ini
  choice: Allah
  alternative: ilah-ilah / para hakim
  rationale: Konteks, konstruksi sintaksis, dan peran Musa yang membawa perkara kepada-Nya mendukung rujukan tunggal kepada Allah Israel; terjemahan tidak menambahkan penjelasan polemis seperti 'Allah yang benar'.
- issue: Kadar penafsiran peran perantaraan Musa
  choice: mewakili bangsa itu di hadapan Allah
  alternative: jadilah engkau bagi bangsa itu di hadapan Allah
  rationale: Terjemahan utama menyatakan fungsi representatif yang terkandung dalam idiom Ibrani secara alami, sedangkan bentuk yang lebih harfiah dicatat agar struktur dan keluasan ungkapan sumber tetap terlihat.
- issue: Nuansa וִיהִי sebagai harapan atau berkat
  choice: kiranya Allah menyertaimu
  alternative: Allah akan menyertaimu
  rationale: Bentuk Ibrani menyatakan harapan atau berkat, bukan janji deklaratif yang memastikan tindakan Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada nasihat yang khidmat tetapi mudah dipahami. 'Engkau' dipertahankan untuk percakapan personal dalam register Alkitab yang bermartabat; struktur idiomatis Indonesia dipilih pada 'dengarkanlah aku' dan 'mewakili bangsa itu', sementara nuansa sumber yang penting dijaga melalui catatan kaki.
