source:
  edition: WLC
  text: וַ/יִּבְחַ֨ר מֹשֶׁ֤ה אַנְשֵׁי חַ֨יִל֙ מִ/כָּל יִשְׂרָאֵ֔ל וַ/יִּתֵּ֥ן אֹתָ֛/ם רָאשִׁ֖ים עַל הָ/עָ֑ם שָׂרֵ֤י אֲלָפִים֙ שָׂרֵ֣י מֵא֔וֹת שָׂרֵ֥י חֲמִשִּׁ֖ים וְ/שָׂרֵ֥י עֲשָׂרֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/025.yaml
  text: 'Moses chose capable men from all Israel and appointed them as heads over the people: commanders of thousands[a], commanders of hundreds, commanders of fifties[b], and commanders of tens.'
translation:
  language: id
  text: 'Musa memilih orang-orang yang cakap dari seluruh Israel dan mengangkat mereka menjadi kepala atas bangsa itu: pemimpin atas seribu orang, pemimpin atas seratus orang, pemimpin atas lima puluh orang, dan pemimpin atas sepuluh orang.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבְחַר
  choice: memilih
  rationale: Kata kerja בחר berarti memilih; bentuk ini secara wajar meneruskan rangkaian narasi Ibrani.
- source_word: אַנְשֵׁי חַיִל
  choice: orang-orang yang cakap
  rationale: Dalam konteks peradilan dan pemerintahan, frasa ini menunjuk pada orang yang memiliki kemampuan dan kecakapan terbukti, bukan terutama keberanian militer.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: dari seluruh Israel
  rationale: Ungkapan ini menunjukkan bahwa mereka dipilih dari antara keseluruhan umat Israel.
- source_word: וַיִּתֵּן אֹתָם
  choice: mengangkat mereka
  rationale: Secara harfiah נתן berarti memberi atau menempatkan, tetapi di sini menyatakan penetapan seseorang dalam jabatan.
- source_word: רָאשִׁים
  choice: kepala
  rationale: Mempertahankan metafora Ibrani untuk orang yang memegang wewenang; ungkapan 'kepala atas bangsa itu' tetap dapat dipahami dalam bahasa Indonesia yang bermartabat.
- source_word: עַל הָעָם
  choice: atas bangsa itu
  rationale: Kata depan עַל di sini menyatakan kewenangan atas umat; 'bangsa itu' merujuk secara alami kepada Israel.
- source_word: שָׂרֵי
  choice: pemimpin atas
  rationale: שַׂר menunjuk pejabat atau penguasa yang diberi tanggung jawab. 'Pemimpin atas' menyampaikan wewenang administratif tanpa memberi kesan militer yang tidak harus ada dalam konteks ini.
- source_word: אֲלָפִים / מֵאוֹת / חֲמִשִּׁים / עֲשָׂרֹת
  choice: seribu orang, seratus orang, lima puluh orang, dan sepuluh orang
  rationale: Bilangan-bilangan ini menyatakan ukuran kelompok yang berada di bawah setiap pemimpin. Penambahan 'orang' memperjelas acuannya secara alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Terjemahan mempertahankan metafora 'kepala' tetapi memakai 'pemimpin' untuk שָׂר agar susunan administratif mudah dipahami. Tidak diperlukan catatan kaki karena alternatif leksikal tidak menimbulkan ambiguitas penting bagi pembaca.
