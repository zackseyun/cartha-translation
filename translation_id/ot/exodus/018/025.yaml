  source_fidelity: 'Teks Indonesia menyampaikan seluruh unsur Ibrani secara tepat: Musa memilih orang-orang yang cakap dari seluruh Israel, mengangkat mereka dalam otoritas atas umat, lalu menyebut jenjang seribu, seratus, lima puluh, dan sepuluh. "Mengangkat" tepat untuk נתן dalam konteks penetapan jabatan, dan "orang-orang yang cakap" sesuai dengan אַנְשֵׁי־חַיִל dalam konteks administratif.'
