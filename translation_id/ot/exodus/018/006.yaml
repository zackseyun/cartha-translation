  text: He said to Moses[a], “I, Jethro your father-in-law, am coming to you, with your wife and her two sons with her.”
translation:
  language: id
  text: Ia berkata kepada Musa, “Aku, Yitro, mertuamu, sedang datang kepadamu bersama istrimu dan kedua anak laki-lakinya[a] yang menyertainya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “kedua anak laki-lakinya.” Sejumlah terjemahan menghaluskannya menjadi “kedua anak laki-lakimu,” tetapi Teks Masoret memakai akhiran orang ketiga feminin tunggal yang merujuk kepada istri Musa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Ia berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. Dalam bahasa Indonesia, hubungan naratif ini dapat disampaikan secara wajar tanpa harus menambahkan kata “dan” atau “lalu”.
- source_word: אֶל מֹשֶׁה
  choice: kepada Musa
  rationale: אֶל menandai orang yang menjadi tujuan perkataan; “kepada Musa” adalah padanan Indonesia yang baku.
- source_word: אֲנִי
  choice: Aku
  rationale: Pronomina mandiri dalam bahasa Ibrani dipertahankan karena memberi penegasan pada identitas pembicara.
- source_word: חֹתֶנְךָ
  choice: mertuamu
  rationale: Dalam konteks ini חֹתֵן merujuk kepada Yitro sebagai ayah dari istri Musa. “Mertua” merupakan ungkapan Indonesia yang alami dan tidak perlu menentukan gender karena nama Yitro sudah menjelaskannya.
- source_word: יִתְרוֹ
  choice: Yitro
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בָּא אֵלֶיךָ
  choice: sedang datang kepadamu
  rationale: Partisipel בָּא menggambarkan kedatangan yang sedang berlangsung atau segera terjadi. “Sedang datang” mempertahankan aspek tersebut.
- source_word: וְאִשְׁתְּךָ
  choice: bersama istrimu
  rationale: Walaupun secara bentuk diawali konjungsi, konteks menunjukkan bahwa istri Musa ikut menyertai Yitro. “Bersama” menyampaikan hubungan penyertaan dengan alami.
- source_word: וּשְׁנֵי בָנֶיהָ
  choice: dan kedua anak laki-lakinya
  rationale: Akhiran orang ketiga feminin tunggal berarti “anak-anak laki-lakinya,” yaitu milik istri Musa. Bentuk ini dipertahankan dan tidak diubah menjadi “kedua anak laki-lakimu.”
- source_word: עִמָּהּ
  choice: yang menyertainya
  rationale: Frasa ini secara harfiah berarti “bersamanya” dan menegaskan bahwa kedua anak itu menyertai istri Musa. Bentuk klausa relatif lebih alami dalam bahasa Indonesia sambil mempertahankan informasinya.
theological_decisions:
- issue: Hubungan kedua anak laki-laki itu dengan Musa dan istrinya
  choice: kedua anak laki-lakinya
  alternative: kedua anak laki-lakimu
  rationale: Teks Masoret memakai akhiran orang ketiga feminin tunggal pada בָנֶיהָ, yang merujuk kepada istri Musa. Terjemahan tidak menyelaraskannya secara diam-diam menjadi orang kedua.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan “Aku, Yitro, mertuamu” mempertahankan penegasan dan aposisi dalam ucapan asli. “Yang menyertainya” menghindari pengulangan kaku “bersama ... bersamanya” tanpa menghilangkan unsur עִמָּהּ.
