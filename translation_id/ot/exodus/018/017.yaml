  text: Ayah mertua Musa berkata kepadanya, “Apa yang kaulakukan itu tidak baik.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. Dalam bahasa Indonesia modern, penghubung awal wa- tidak perlu diterjemahkan secara eksplisit di sini.
- source_word: חֹתֵן מֹשֶׁה
  choice: mertua Musa
  rationale: Rangkaian konstruksi ini berarti mertua Musa. Istilah Ibrani dapat menunjuk kerabat karena perkawinan; dalam konteks ini, 'mertua Musa' alami dan tidak menambahkan informasi yang tidak dinyatakan dalam ayat.
- source_word: אֵלָיו
  choice: kepadanya
  rationale: Pronomina ini merujuk kembali kepada Musa dan dapat dipertahankan secara alami sebagai 'kepadanya'.
- source_word: לֹא טוֹב
  choice: tidak baik
  rationale: Terjemahan langsung yang mempertahankan penilaian luas dari טוֹב tanpa mempersempitnya menjadi 'tidak benar' atau 'tidak bermanfaat'.
- source_word: הַדָּבָר אֲשֶׁר אַתָּה עֹשֶׂה
  choice: Apa yang kaulakukan itu
  rationale: Ungkapan nominal harfiah 'hal yang sedang engkau lakukan' disampaikan secara alami dalam bahasa Indonesia, sedangkan partisipel עֹשֶׂה tetap menunjukkan tindakan yang sedang berlangsung.
