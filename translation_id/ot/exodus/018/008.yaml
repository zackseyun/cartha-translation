id: EXO.18.8
reference: Exodus 18:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְסַפֵּ֤ר מֹשֶׁה֙ לְ/חֹ֣תְנ֔/וֹ אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ לְ/פַרְעֹ֣ה וּ/לְ/מִצְרַ֔יִם עַ֖ל אוֹדֹ֣ת יִשְׂרָאֵ֑ל אֵ֤ת כָּל הַ/תְּלָאָה֙ אֲשֶׁ֣ר מְצָאָ֣תַ/ם בַּ/דֶּ֔רֶךְ וַ/יַּצִּלֵ֖/ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/008.yaml
  text: Moses told his father-in-law all that Yahweh had done to Pharaoh and to Egypt for Israel’s sake[a], all the hardship that had come upon them on the way[b], and how Yahweh had delivered them.
translation:
  language: id
  text: Musa menceritakan kepada mertuanya segala yang telah dilakukan Yahweh terhadap Firaun dan Mesir demi Israel[a], segala kesukaran yang menimpa mereka dalam perjalanan[b], dan bagaimana Yahweh membebaskan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “karena Israel” atau “berkenaan dengan Israel.”
    reason: lexical_alternative
  - marker: b
    text: Atau “segala kesusahan” atau “segala kemalangan” yang menimpa mereka di jalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפֵּר
  choice: menceritakan
  rationale: Bentuk piel dari ספר berarti menceritakan atau menuturkan secara terperinci; “menceritakan” alami dalam narasi Indonesia.
- source_word: חֹתְנוֹ
  choice: mertuanya
  rationale: Dalam konteks ini istilah kekerabatan tersebut menunjuk kepada Yitro, ayah mertua Musa; “mertuanya” adalah ungkapan Indonesia yang ringkas dan wajar.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה יְהוָה לְפַרְעֹה וּלְמִצְרַיִם
  choice: segala yang telah dilakukan Yahweh terhadap Firaun dan Mesir
  rationale: “Terhadap” mempertahankan relasi umum preposisi ל tanpa secara eksplisit menafsirkannya sebagai “melawan,” sementara konteks tetap menunjukkan tindakan penghukuman.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: עַל אֹדוֹת יִשְׂרָאֵל
  choice: demi Israel
  rationale: Ungkapan ini secara alami menyampaikan bahwa tindakan Yahweh dilakukan berkenaan dengan dan untuk kepentingan Israel, sambil mencatat alternatif kausal dalam catatan kaki.
- source_word: הַתְּלָאָה
  choice: kesukaran
  rationale: Kata benda ini menunjuk pada kesusahan, penderitaan, atau kesulitan berat; “kesukaran” bermartabat dan mudah dipahami.
- source_word: מְצָאָתַם
  choice: menimpa mereka
  rationale: Secara harfiah kesukaran itu “menemukan” mereka, tetapi idiom Indonesia “menimpa mereka” menyampaikan personifikasi dan maknanya secara alami.
- source_word: בַּדֶּרֶךְ
  choice: dalam perjalanan
  rationale: Frasa ini merujuk pada perjalanan Israel setelah keluar dari Mesir; “dalam perjalanan” lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “di jalan.”
- source_word: וַיַּצִּלֵם
  choice: membebaskan mereka
  rationale: נצל berarti melepaskan atau menyelamatkan dari bahaya; “membebaskan” sesuai dengan konteks keluaran dan tidak menambahkan rumusan teologis yang lebih luas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa; TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar.
- issue: Nuansa עַל אֹדוֹת יִשְׂרָאֵל
  choice: demi Israel
  alternative: karena Israel; berkenaan dengan Israel
  rationale: “Demi Israel” menyampaikan orientasi tindakan Yahweh bagi kepentingan Israel, tetapi catatan kaki mempertahankan kemungkinan nuansa kausal atau referensial.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif yang bermartabat. Struktur deret dalam bahasa Ibrani dipertahankan, sedangkan ungkapan idiomatis disesuaikan agar jelas dan alami bagi pembaca umum.
