base_translation:
  language: en
  yaml_path: translation/ot/exodus/018/010.yaml
  text: And Yitro said[a], “Blessed be Yahweh, who delivered you from the hand of the Egyptians and from the hand of Pharaoh[b], who delivered the people from under the hand of the Egyptians.”
translation:
  language: id
  text: Lalu Yitro berkata, “Terpujilah Yahweh[a], yang telah melepaskan kalian dari tangan orang Mesir dan dari tangan Firaun, serta yang telah melepaskan bangsa itu dari bawah kekuasaan orang Mesir[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Yahweh terpuji” atau “Kiranya Yahweh dipuji.” Formula berkat dalam bahasa Ibrani dapat mengandung nuansa seruan, pernyataan, atau harapan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari tangan orang Mesir ... dari bawah tangan orang Mesir”; “tangan” merupakan kiasan bagi kuasa atau kendali yang menindas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר יִתְרוֹ
  choice: Lalu Yitro berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi. ‘Lalu’ menyatakan kelanjutan peristiwa secara alami, dan ‘Yitro’ mencerminkan bentuk nama Ibrani.
- source_word: בָּרוּךְ יְהוָה
  choice: Terpujilah Yahweh
  rationale: Ungkapan berkat dengan partisipel pasif ini paling alami dinyatakan sebagai seruan pujian dalam bahasa Indonesia, tanpa meniadakan kemungkinan nuansa pernyataan atau harapan.
- source_word: הִצִּיל
  choice: telah melepaskan
  rationale: Bentuk Hifil dari נצל menyatakan tindakan membebaskan atau menyelamatkan dari kuasa yang mengancam. ‘Melepaskan’ sesuai dengan gambaran tangan atau kekuasaan yang menindas dalam ayat ini.
- source_word: אֶתְכֶם
  choice: kalian
  rationale: Pronomina objek Ibrani berbentuk jamak. ‘Kalian’ menyatakan jumlah jamak dengan jelas dan wajar dalam bahasa Indonesia modern.
- source_word: מִיַּד מִצְרַיִם
  choice: dari tangan orang Mesir
  rationale: ‘Tangan’ mempertahankan metafora Ibrani bagi kuasa atau kendali, sedangkan ‘orang Mesir’ menyampaikan makna kolektif מִצְרַיִם dalam konteks ini.
- source_word: פַּרְעֹה
  choice: Firaun
  rationale: Ini adalah bentuk baku bahasa Indonesia untuk gelar penguasa Mesir.
- source_word: הָעָם
  choice: bangsa itu
  rationale: עם menunjuk kepada Israel sebagai kelompok kolektif. ‘Bangsa itu’ alami dalam konteks dan mempertahankan bentuk definit serta acuan pihak ketiga.
- source_word: מִתַּחַת יַד מִצְרָיִם
  choice: dari bawah tangan orang Mesir
  rationale: Terjemahan ini mempertahankan gambaran Ibrani tentang keadaan berada di bawah kuasa yang menindas serta membedakannya dari ungkapan sebelumnya yang lebih singkat.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama diri perjanjian יהוה. ‘Yahweh’ mempertahankan nama ilahi tersebut tanpa menggantinya dengan gelar.
- issue: Nuansa formula בָּרוּךְ יְהוָה
  choice: Terpujilah Yahweh
  alternative: Yahweh terpuji; Kiranya Yahweh dipuji
  rationale: Bentuk Ibrani dapat dipahami sebagai seruan pujian, pernyataan bahwa Yahweh terpuji, atau ungkapan harapan agar Ia dipuji. Pilihan utama terdengar alami dan khidmat, sementara catatan kaki mempertahankan rentang nuansanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur puitis-retoris ayat dipertahankan, termasuk pengulangan ‘telah melepaskan’ dan metafora ‘tangan’. ‘Kalian’ dipakai untuk menampilkan dengan jelas bahwa pronomina Ibrani berbentuk jamak.
