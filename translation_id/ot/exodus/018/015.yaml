  text: Moses said to his father-in-law[a], “Because the people come to me to seek God.”
translation:
  language: id
  text: Musa berkata kepada mertuanya, “Sebab orang-orang itu datang kepadaku untuk mencari Allah[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk memohon petunjuk kepada Allah” atau “untuk meminta keputusan dari Allah.” Ungkapan Ibrani ini dapat mencakup tindakan memohon bimbingan atau keputusan dari Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Bentuk naratif dari אמר secara wajar memperkenalkan jawaban Musa dengan verba lampau yang dalam narasi Indonesia cukup dinyatakan sebagai ‘berkata’.
- source_word: לְחֹתְנוֹ
  choice: kepada mertuanya
  rationale: Dalam konteks ini חֹתֵן menunjuk kepada Yitro sebagai mertua Musa. ‘Mertuanya’ alami dan tidak perlu mengulang nama Musa.
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atas tindakan Musa sebagai jawaban terhadap pertanyaan Yitro. ‘Sebab’ mempertahankan hubungan kausal dengan nada yang wajar dan bermartabat.
- source_word: יָבֹא אֵלַי הָעָם
  choice: bangsa itu datang kepadaku
  rationale: בוא + אֶל menyatakan gerak menuju Musa. Bentuk kini ‘datang’ sesuai dengan penjelasan tentang kebiasaan yang berlangsung.
- source_word: לִדְרֹשׁ
  choice: untuk mencari
  rationale: דרש ketika berobjek Allah dapat berarti mencari ataupun meminta petunjuk dari-Nya. ‘Mencari’ mempertahankan keluasan ungkapan Ibrani, sementara nuansa konsultatif dan hukum dicatat dalam catatan kaki.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Objek eksplisit dalam teks adalah Allah sendiri, bukan sekadar kehendak atau keputusan ilahi. ‘Allah’ merupakan padanan baku dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna ungkapan לִדְרֹשׁ אֱלֹהִים
  choice: untuk mencari Allah
  alternative: untuk meminta petunjuk Allah; untuk meminta keputusan dari Allah
  rationale: Ungkapan Ibrani dapat menunjuk pada pencarian akan Allah secara luas maupun konsultasi kepada Allah untuk mendapat petunjuk atau keputusan dalam konteks perselisihan. Teks utama mempertahankan keluasan itu tanpa mempersempitnya, dan alternatif yang lebih khusus disajikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan kalimat langsung yang alami. ‘Mertua’ dipilih sebagai istilah relasi yang ringkas, sedangkan ‘bangsa itu’ mempertahankan penyebutan kolektif הָעָם. Penanda catatan kaki ditempatkan tepat setelah frasa yang dijelaskan.
