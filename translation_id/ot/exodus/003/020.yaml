base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/020.yaml
  text: And I will stretch out my hand and strike Egypt with all my wonders that I will do in its midst[b][a]; and after that he will send you out.
translation:
  language: id
  text: Aku akan mengulurkan tangan-Ku[a] dan memukul Mesir dengan segala keajaiban-Ku yang akan Kulakukan di tengah-tengahnya. Sesudah itu, ia akan menyuruh kalian pergi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “mengirimkan tangan-Ku”. Ungkapan Ibrani ini berarti mengulurkan tangan untuk bertindak atau menunjukkan kuasa.
    reason: lexical_alternative
  - marker: b
    text: Atau “membiarkan kalian pergi”. Bahasa Ibrani secara lebih harfiah menyatakan bahwa ia akan menyuruh atau mengirim kalian keluar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי אֶת־יָדִי
  choice: Aku akan mengulurkan tangan-Ku
  rationale: Secara harfiah שׁלח berarti ‘mengirim’, tetapi bersama ‘tangan’ ungkapan ini menggambarkan tangan yang diulurkan untuk bertindak atau menunjukkan kuasa. ‘Mengulurkan tangan-Ku’ mempertahankan gambaran konkret Ibrani dan terdengar alami dalam bahasa Indonesia.
- source_word: וְהִכֵּיתִי
  choice: dan memukul
  rationale: Bentuk ini berasal dari נכה, ‘memukul’ atau ‘menghantam’. ‘Memukul’ jelas dan tidak menambahkan gagasan kematian atau pemusnahan yang tidak dinyatakan oleh kata tersebut.
- source_word: מִצְרַיִם
  choice: Mesir
  rationale: Nama ini menunjuk kepada Mesir sebagai negeri atau kesatuan kolektif, bukan hanya kepada orang-orang Mesir.
- source_word: בְּכֹל נִפְלְאֹתַי
  choice: dengan segala keajaiban-Ku
  rationale: נפלאות menunjuk kepada tindakan-tindakan luar biasa yang membangkitkan rasa takjub. ‘Keajaiban’ ringkas, mudah dipahami, dan mempertahankan bobot ungkapan sumber.
- source_word: אֲשֶׁר אֶעֱשֶׂה
  choice: yang akan Kulakukan
  rationale: Terjemahan langsung klausa relatif ini mempertahankan kesederhanaan kata kerja עשה, ‘melakukan’.
- source_word: בְּקִרְבּוֹ
  choice: di tengah-tengahnya
  rationale: Akhiran tunggal maskulin paling wajar merujuk kembali kepada Mesir sebagai suatu negeri atau kesatuan kolektif. Bentuk ini mempertahankan rujukan tunggal dan gambaran ruang dalam teks.
- source_word: וְאַחֲרֵי כֵן
  choice: Sesudah itu
  rationale: Ungkapan waktu ini menandai urutan kejadian secara jelas dan alami.
- source_word: יְשַׁלַּח אֶתְכֶם
  choice: ia akan menyuruh kalian pergi
  rationale: Subjek yang tersirat dari konteks ialah Firaun. ‘Menyuruh kalian pergi’ mempertahankan unsur aktif dari שׁלח dan membedakannya dari sekadar pemberian izin. ‘Kalian’ menunjukkan bahwa objeknya jamak.
theological_decisions:
- issue: Bahasa antropomorfis tentang tindakan Allah
  choice: Mempertahankan metafora tubuh ‘mengulurkan tangan-Ku’
  alternative: Mengabstrakkannya menjadi ‘menunjukkan kuasa-Ku’
  rationale: Bahasa Ibrani memakai gambaran konkret tentang tangan Allah untuk menggambarkan campur tangan-Nya. Mempertahankan gambaran itu menghormati bentuk dan ketegangan bahasa sumber tanpa memaksakan penafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Pronomina ‘kalian’ dipakai untuk menyatakan bentuk jamak Ibrani dengan jelas; ‘ia’ menjaga ragam naratif yang formal. Tanda catatan kaki ditempatkan langsung sesudah frasa yang dijelaskan.
