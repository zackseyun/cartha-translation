id: EXO.3.9
reference: Exodus 3:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֕ה הִנֵּ֛ה צַעֲקַ֥ת בְּנֵי יִשְׂרָאֵ֖ל בָּ֣אָה אֵלָ֑/י וְ/גַם רָאִ֨יתִי֙ אֶת הַ/לַּ֔חַץ אֲשֶׁ֥ר מִצְרַ֖יִם לֹחֲצִ֥ים אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/009.yaml
  text: And now[a], behold, the cry of the sons of Israel has come to me[b], and I have also seen the oppression with which the Egyptians are oppressing them.
translation:
  language: id
  text: Sekarang, lihatlah, seruan orang Israel telah sampai kepada-Ku, dan Aku juga telah melihat penindasan yang dilakukan orang Mesir terhadap mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Menandai peralihan wacana sekaligus hubungan dengan perkataan sebelumnya; dalam bahasa Indonesia, 'Sekarang' sudah alami tanpa harus menambahkan 'dan'.
- source_word: הִנֵּה
  choice: lihatlah
  rationale: Mempertahankan fungsi partikel penarik perhatian dengan ungkapan Indonesia modern dan bermartabat.
- source_word: צַעֲקַת
  choice: seruan
  rationale: Mengungkapkan teriakan yang timbul dari penderitaan dan permohonan akan pertolongan tanpa mempersempit maknanya.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Dalam bahasa Indonesia, sebutan kolektif ini alami, mencakup umat Israel, dan tidak menimbulkan kesan keliru bahwa yang dimaksud hanya anak laki-laki.
- source_word: בָּאָה אֵלַי
  choice: telah sampai kepada-Ku
  rationale: Menyampaikan idiom Ibrani 'telah datang kepada-Ku' secara alami serta mempertahankan relevansi hasil tindakan itu pada saat Allah berbicara.
- source_word: וְגַם
  choice: dan ... juga
  rationale: Mempertahankan hubungan tambahan dan penekanannya dalam susunan Indonesia yang wajar.
- source_word: רָאִיתִי
  choice: Aku ... telah melihat
  rationale: Bentuk perfektif menyatakan bahwa Allah sudah menyaksikan keadaan itu dan pengamatan tersebut relevan bagi tindakan-Nya sekarang.
- source_word: הַלַּחַץ
  choice: penindasan
  rationale: Paling tepat menggambarkan tekanan sosial dan pemaksaan yang dialami Israel di Mesir.
- source_word: מִצְרַיִם
  choice: orang Mesir
  rationale: Nama 'Mesir' di sini berfungsi secara kolektif sebagai pelaku jamak, sebagaimana ditegaskan oleh partisipel jamak לֹחֲצִים.
- source_word: לֹחֲצִים אֹתָם
  choice: yang dilakukan ... terhadap mereka
  rationale: Mengalihkan konstruksi serumpun 'penindasan yang dengannya mereka menindas' menjadi bahasa Indonesia yang alami sambil mempertahankan pelaku, tindakan, dan sasaran.
theological_decisions:
- issue: Sebutan perjanjian בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel / keturunan Israel
  rationale: Ungkapan Ibrani secara harfiah berarti 'anak-anak lelaki Israel', tetapi sebagai sebutan kolektif merujuk kepada umat Israel. 'Orang Israel' mempertahankan acuan kolektif secara jelas dalam bahasa Indonesia tanpa membatasi kelompok itu pada laki-laki.
- issue: Daya wacana הִנֵּה
  choice: lihatlah
  alternative: sesungguhnya / perhatikanlah
  rationale: '''Lihatlah'' mempertahankan seruan penarik perhatian, sedangkan ''sesungguhnya'' cenderung menggesernya menjadi penegasan proposisional.'
- issue: Subjek kolektif מִצְרַיִם dengan partisipel jamak
  choice: orang Mesir
  alternative: Mesir
  rationale: Partisipel jamak mendukung pemahaman bahwa rakyat atau para penguasa Mesirlah pelaku penindasan; pilihan ini menghindari personifikasi negara yang tidak perlu.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Tidak digunakan catatan kaki karena alternatif leksikal tidak diperlukan untuk memahami ayat ini dan penanda catatan tidak boleh ditambahkan tanpa kebutuhan tekstual.
