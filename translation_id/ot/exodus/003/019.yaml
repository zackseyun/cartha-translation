  text: וַ/אֲנִ֣י יָדַ֔עְתִּי כִּ֠י לֹֽא יִתֵּ֥ן אֶתְ/כֶ֛ם מֶ֥לֶךְ מִצְרַ֖יִם לַ/הֲלֹ֑ךְ וְ/לֹ֖א בְּ/יָ֥ד חֲזָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/019.yaml
  text: But I know that the king of Egypt will not let you go[a], except by a strong hand.
translation:
  language: id
  text: Tetapi Aku tahu bahwa raja Mesir tidak akan mengizinkan kalian pergi[a], kecuali dengan tangan yang kuat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “raja Mesir tidak akan mengizinkan kalian pergi, bahkan tidak dengan tangan yang kuat”; atau, “kecuali dengan tangan yang perkasa.” Klausa Ibraninya eliptis dan mungkin menekankan bahwa hanya kuasa yang luar biasa besar akan membuat Firaun menyerah.
    reason: alternative_reading
lexical_decisions:
- source_word: וַאֲנִי
  choice: Namun, Aku
  rationale: Konjungsi bersama pronomina mandiri menandai peralihan yang kontras dan tegas; “Namun, Aku” menyatakannya secara alami dalam bahasa Indonesia.
- source_word: יָדַעְתִּי
  choice: tahu
  rationale: Bentuk perfektif menyatakan pengetahuan ilahi yang pasti dan menetap; bentuk kini “tahu” paling wajar dalam konteks ini.
- source_word: כִּי
  choice: bahwa
  rationale: Memperkenalkan isi dari apa yang diketahui.
- source_word: לֹא יִתֵּן אֶתְכֶם ... לַהֲלֹךְ
  choice: tidak akan mengizinkan kalian pergi
  rationale: נתן dengan infinitif di sini berarti memberi izin atau membiarkan. “Mengizinkan kalian pergi” jelas, alami, dan mempertahankan bentuk jamak orang kedua.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: raja Mesir
  rationale: Padanan langsung dan alami bagi frasa konstruksi Ibrani tersebut.
- source_word: וְלֹא בְּיָד חֲזָקָה
  choice: kecuali oleh tangan yang kuat
  rationale: Klausa Ibrani bersifat eliptis. Terjemahan ini mempertahankan citra instrumental “tangan yang kuat” dan, selaras dengan ayat berikutnya, menyampaikan bahwa Firaun hanya akan menyerah di bawah kuasa yang memaksa, tanpa menambahkan pelaku secara eksplisit.
theological_decisions:
- issue: Penafsiran klausa eliptis וְלֹא בְּיָד חֲזָקָה
  choice: Firaun tidak akan mengizinkan Israel pergi kecuali oleh tangan yang kuat.
  alternative: Firaun tidak akan mengizinkan Israel pergi, bahkan tidak oleh tangan yang kuat.
  rationale: Susunan Ibrani sangat ringkas dan memungkinkan lebih dari satu pemahaman. Konteks langsung ayat 20, ketika Allah menyatakan bahwa Ia akan memukul Mesir dengan berbagai perbuatan ajaib, mendukung pengertian bahwa hanya kuasa yang sangat besar akan membuat Firaun menyerah. Kemungkinan alternatif tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang jelas dan bermartabat. “Kalian” mempertahankan bentuk jamak אֶתְכֶם secara alami; kapitalisasi “Aku” menunjukkan bahwa pembicara adalah Allah. Ungkapan “tangan yang kuat” dipertahankan sebagai motif penting dalam kitab Keluaran.
