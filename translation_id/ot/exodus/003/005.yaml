  source_fidelity: 'Terjemahan secara umum setia kepada teks Ibrani: larangan mendekat, perintah menanggalkan sandal, alasan kausal, dan pernyataan bahwa lokasi itu tanah kudus semuanya dipertahankan. “Dia berfirman” sesuai dengan konteks pembicara ilahi dan register naratif kitab suci.'
