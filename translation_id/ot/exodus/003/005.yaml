base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/005.yaml
  text: Then he said[a], “Do not come near here. Remove your sandals from your feet[b], because the place where you are standing is holy ground.”
translation:
  language: id
  text: Lalu Dia berfirman, “Jangan mendekat ke sini.[a] Tanggalkanlah sandalmu dari kakimu, sebab tempat engkau berdiri itu adalah tanah yang kudus.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jangan mendekati tempat ini.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tanah kekudusan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu Dia berfirman
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. Karena pembicara dalam konteks ini adalah Allah, “berfirman” merupakan padanan Indonesia yang wajar dan bermartabat tanpa menambah isi ujaran.
- source_word: אַל תִּקְרַב הֲלֹם
  choice: Jangan mendekat ke sini
  rationale: אַל dengan bentuk verbal menyatakan larangan, sedangkan הֲלֹם menunjuk ke lokasi pembicara. Susunan ini alami dalam bahasa Indonesia dan mempertahankan peringatan spasialnya.
- source_word: שַׁל נְעָלֶיךָ מֵעַל רַגְלֶיךָ
  choice: Tanggalkanlah sandalmu dari kakimu
  rationale: Imperatif שַׁל berarti melepaskan atau menanggalkan. “Sandal” mempertahankan kekonkretan budaya istilah Ibrani, dan “dari kakimu” mengikuti penyebutan anggota tubuh dalam teks sumber.
- source_word: כִּי
  choice: sebab
  rationale: Partikel ini memperkenalkan alasan bagi perintah sebelumnya. “Sebab” jelas, alami, dan sesuai dengan ragam naratif yang bermartabat.
- source_word: הַמָּקוֹם אֲשֶׁר אַתָּה עוֹמֵד עָלָיו
  choice: tempat engkau berdiri itu
  rationale: Frasa relatif menunjuk secara khusus kepada lokasi tempat Musa sedang berdiri. “Itu” menandai ketentuan tempat tersebut secara alami dalam bahasa Indonesia.
- source_word: אַדְמַת קֹדֶשׁ
  choice: tanah yang kudus
  rationale: Frasa konstruksi ini secara harfiah berarti “tanah kekudusan”. Bentuk “tanah yang kudus” menyampaikan maknanya dengan jelas dan alami sambil mempertahankan pernyataan tentang kesucian lokasi.
- source_word: הוּא
  choice: adalah
  rationale: Pronomina ini berfungsi dalam penegasan predikatif. “Adalah” membuat hubungan antara tempat tersebut dan tanah yang kudus jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Hakikat kekudusan lokasi
  choice: Menyatakan bahwa tempat itu adalah tanah yang kudus tanpa menjelaskan lebih lanjut sumber atau mekanisme kekudusannya.
  alternative: Menambahkan bahwa tanah itu menjadi kudus karena kehadiran Allah.
  rationale: Ayat ini menegaskan kekudusan tanah dalam perjumpaan ilahi tersebut, tetapi tidak secara eksplisit memberikan penjelasan teologis tambahan. Terjemahan mempertahankan klaim teks tanpa memperluasnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Kata ganti “engkau” sesuai untuk sapaan tunggal dalam konteks kitab suci; “sandalmu” dan “kakimu” mempertahankan bentuk tunggal kolektif pada anggota tubuh sebagaimana lazim dalam bahasa Indonesia.
