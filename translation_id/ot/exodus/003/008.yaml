id: EXO.3.8
reference: Exodus 3:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וָ/אֵרֵ֞ד לְ/הַצִּיל֣/וֹ מִ/יַּ֣ד מִצְרַ֗יִם וּֽ/לְ/הַעֲלֹת/וֹ֮ מִן הָ/אָ֣רֶץ הַ/הִוא֒ אֶל אֶ֤רֶץ טוֹבָה֙ וּ/רְחָבָ֔ה אֶל אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ אֶל מְק֤וֹם הַֽ/כְּנַעֲנִי֙ וְ/הַ֣/חִתִּ֔י וְ/הָֽ/אֱמֹרִי֙ וְ/הַ/פְּרִזִּ֔י וְ/הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/008.yaml
  text: And I have come down to deliver him from the hand of Egypt and to bring him up from that land to a good and broad land[a], to a land flowing with milk and honey, to the place of the Canaanite, the Hittite, the Amorite, the Perizzite, the Hivite[c][b], and the Jebusite.
translation:
  language: id
  text: Aku telah turun untuk membebaskannya[b] dari tangan Mesir[a] dan membawanya naik dari negeri itu ke negeri yang baik dan luas[c], ke negeri yang berlimpah susu dan madu, ke tempat orang Kanaan, orang Het, orang Amori, orang Feris, orang Hewi, dan orang Yebus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani “dari tangan Mesir” berarti dari kuasa atau kendali Mesir.
    reason: lexical_alternative
  - marker: b
    text: Kata ganti “-nya” dalam “membebaskannya” dan “membawanya” berbentuk tunggal dalam bahasa Ibrani dan menunjuk kepada Israel sebagai satu umat.
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan “negeri yang baik dan lapang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֵד
  choice: Aku telah turun
  rationale: Mempertahankan gambaran ruang yang antropomorfis dalam bahasa Ibrani, sementara bentuk perfektifnya disampaikan secara alami sebagai tindakan yang telah dimulai dan kini relevan.
- source_word: לְהַצִּילוֹ
  choice: untuk membebaskannya
  rationale: Bentuk Hifil dari נצל menyatakan tindakan melepaskan atau menyelamatkan dari bahaya maupun penindasan. 'Membebaskan' sesuai dengan konteks perbudakan di Mesir tanpa menambahkan muatan teologis yang tidak dinyatakan secara khusus di sini.
- source_word: מִיַּד מִצְרַיִם
  choice: dari tangan Mesir
  rationale: Mempertahankan metafora Ibrani tentang 'tangan' sebagai kuasa atau kendali. Catatan kaki menjelaskan idiom tersebut agar tidak disalahpahami secara harfiah.
- source_word: וּלְהַעֲלֹתוֹ
  choice: dan membawanya naik
  rationale: Mempertahankan unsur vertikal/geografis dari bentuk Hifil עלה serta pronomina tunggal kolektif yang menunjuk kepada Israel.
- source_word: מִן הָאָרֶץ הַהִוא
  choice: dari negeri itu
  rationale: Menerjemahkan frasa penunjuk secara langsung; 'negeri itu' merujuk kembali kepada Mesir.
- source_word: אֶל אֶרֶץ טוֹבָה וּרְחָבָה
  choice: ke negeri yang baik dan luas
  rationale: '''Baik'' menerjemahkan טוֹבָה dan ''luas'' menyampaikan רְחָבָה secara ringkas serta alami, dengan nuansa ruang yang lapang.'
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: negeri yang berlimpah susu dan madu
  rationale: '''Berlimpah'' menyampaikan citra kelimpahan dari partisip זָבַת secara alami dalam bahasa Indonesia; terjemahan harfiah ''mengalir dengan'' kurang idiomatis.'
- source_word: אֶל מְקוֹם
  choice: ke tempat
  rationale: Mempertahankan arti dasar מְקוֹם tanpa menggantinya dengan istilah geografis yang lebih interpretatif seperti 'wilayah'.
- source_word: הַכְּנַעֲנִי ... הַיְבוּסִי
  choice: orang Kanaan, orang Het, orang Amori, orang Feris, orang Hewi, dan orang Yebus
  rationale: Dalam bahasa Ibrani, tiap nama bangsa berbentuk tunggal dengan makna kolektif. Bentuk Indonesia 'orang + nama bangsa' dapat dibaca secara kolektif dan tetap alami.
theological_decisions:
- issue: Gerak ilahi yang antropomorfis dalam 'Aku telah turun'
  choice: Mempertahankan bahasa ruang secara langsung
  alternative: Menafsirkan sebagai 'Aku turun tangan' atau 'Aku datang untuk bertindak'
  rationale: Teks menggambarkan tindakan Allah dengan bahasa turun secara spasial. Mempertahankannya menjaga kekuatan naratif dan tidak menghapus antropomorfisme yang memang ada dalam sumber.
- issue: Pronomina tunggal kolektif bagi Israel
  choice: Menggunakan akhiran tunggal '-nya' dalam 'membebaskannya' dan 'membawanya'
  alternative: Menggunakan bentuk jamak 'mereka' demi memperjelas bahwa yang dimaksud ialah umat Israel
  rationale: Kedua akhiran pronominal dalam teks Ibrani berbentuk tunggal dan memandang Israel sebagai satu umat. Bentuk '-nya' mempertahankan perspektif kolektif itu tanpa menentukan gender.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat namun mudah dipahami. Metafora sumber dipertahankan bila masih jelas, sedangkan ungkapan yang terlalu kaku disampaikan secara idiomatis. Nama-nama bangsa mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
