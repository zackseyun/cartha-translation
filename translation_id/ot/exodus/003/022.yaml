revisions:
- from: Setiap perempuan harus meminta kepada tetangganya dan kepada perempuan yang tinggal di rumahnya barang-barang dari perak, barang-barang dari emas, dan pakaian. Kamu harus mengenakannya pada anak-anakmu, baik laki-laki maupun perempuan. Dengan demikian, kamu akan menjarah Mesir.[a]
  to: Setiap perempuan hendaklah meminta dari tetangganya dan dari perempuan yang tinggal di rumahnya barang-barang perak, barang-barang emas, dan pakaian. Kamu akan mengenakan semua itu pada putra-putramu dan putri-putrimu. Dengan demikian, kamu akan menjarah Mesir.[a]
  rationale: 'Revisi membetulkan arah relasi yang ditandai preposisi מִן menjadi ''dari''. Pilihan lainnya dipertahankan sejauh mungkin: ''meminta'' tidak mengandaikan pengembalian; ''perempuan yang tinggal di rumahnya'' tidak memaksakan apakah ia pendatang, penghuni sementara, atau tamu; dan ''menjarah'' mempertahankan daya Piel נצל. Catatan kaki tetap ditempatkan pada ''menjarah Mesir'' dan menawarkan alternatif leksikal yang setara.'
