  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/שָׁאֲלָ֨ה אִשָּׁ֤ה מִ/שְּׁכֶנְתָּ/הּ֙ וּ/מִ/גָּרַ֣ת בֵּיתָ֔/הּ כְּלֵי כֶ֛סֶף וּ/כְלֵ֥י זָהָ֖ב וּ/שְׂמָלֹ֑ת וְ/שַׂמְתֶּ֗ם עַל בְּנֵי/כֶם֙ וְ/עַל בְּנֹ֣תֵי/כֶ֔ם וְ/נִצַּלְתֶּ֖ם אֶת מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/022.yaml
  text: Each woman shall ask from her neighbor and from the woman staying in her house articles of silver and articles of gold[a], and clothing; and you shall put them on your sons and on your daughters[c][b]. So you will plunder Egypt.
translation:
  language: id
  text: Setiap perempuan hendaklah meminta dari tetangganya dan dari perempuan yang tinggal di rumahnya barang-barang perak, barang-barang emas, dan pakaian. Kamu akan mengenakan semua itu pada putra-putramu dan putri-putrimu. Dengan demikian, kamu akan menjarah Mesir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “merampasi” atau “melucuti” Mesir.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁאֲלָה
  choice: harus meminta
  rationale: Verba שׁאל pada dasarnya berarti 'meminta' atau 'memohon', bukan secara khusus 'meminjam'; konteks tidak menyatakan kewajiban mengembalikan.
- source_word: אִשָּׁה
  choice: setiap perempuan
  rationale: Bentuk tunggal tak tentu dipakai secara distributif dan paling alami disampaikan dengan 'setiap perempuan'.
- source_word: מִשְּׁכֶנְתָּהּ
  choice: kepada tetangganya
  rationale: Nomina ini feminin dalam bahasa Ibrani dan dalam konteks menunjuk tetangga perempuan; bahasa Indonesia tidak perlu menandai gender pada kata 'tetangga'.
- source_word: וּמִגָּרַת בֵּיתָהּ
  choice: kepada perempuan yang tinggal di rumahnya
  rationale: Partisip dari גור menunjuk seorang perempuan yang menetap atau menumpang di rumah itu; pilihan ini jelas dan tidak menentukan secara berlebihan apakah ia pendatang, penghuni, atau tamu.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: barang-barang dari perak, barang-barang dari emas
  rationale: כְּלִי merupakan istilah luas untuk barang, benda, perkakas, atau wadah; 'barang-barang' mempertahankan ketidakspesifikan jenisnya.
- source_word: וּשְׂמָלֹת
  choice: pakaian
  rationale: Istilah umum bagi pakaian; padanan Indonesia ini alami dan cukup luas.
- source_word: וְשַׂמְתֶּם עַל
  choice: harus mengenakannya pada
  rationale: Dalam konteks barang berharga dan pakaian yang dipasang pada anak-anak, 'mengenakan' menyampaikan שׂים + עַל secara idiomatis.
- source_word: בְּנֵיכֶם ... בְּנֹתֵיכֶם
  choice: anak-anakmu, baik laki-laki maupun perempuan
  rationale: Menjaga penyebutan eksplisit putra dan putri dalam bahasa Indonesia yang alami, sekaligus mempertahankan bentuk jamak kolektif.
- source_word: וְנִצַּלְתֶּם אֶת מִצְרָיִם
  choice: Dengan demikian, kamu akan menjarah Mesir
  rationale: Bentuk Piel dari נצל di sini berarti merampasi atau menjarah. 'Menjarah' mempertahankan daya ungkap teks dan tidak melunakkannya menjadi sekadar menerima pemberian.
theological_decisions:
- issue: Kemungkinan pelunakan moral-teologis atas pengambilan harta orang Mesir
  choice: kamu akan menjarah Mesir
  alternative: kamu akan merampasi Mesir / melucuti Mesir
  rationale: Teks Ibrani menggambarkan pembalikan keadaan dan perampasan, bukan peminjaman yang mengandaikan pengembalian. Terjemahan mempertahankan ketegangan tersebut tanpa menambahkan pembenaran teologis ke dalam ayat.
- issue: Identitas perempuan yang tinggal di rumah
  choice: perempuan yang tinggal di rumahnya
  alternative: perempuan pendatang yang menumpang di rumahnya / penghuni perempuan di rumahnya
  rationale: Bentuk גָּרַת dapat menyiratkan pendatang atau orang yang menetap sementara. Rumusan utama mempertahankan ambiguitas statusnya dan menghindari penentuan yang tidak diwajibkan konteks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Pronomina jamak orang kedua diterjemahkan 'kamu' secara kolektif karena bentuk Indonesia tidak membedakan tunggal dan jamak; konteks menunjukkan umat Israel secara keseluruhan. Hanya satu catatan kaki dipakai untuk alternatif penting pada נצל; arti dasar שׁאל sudah dinyatakan tanpa perlu catatan karena 'meminta' langsung mencerminkan bahasa Ibrani.
