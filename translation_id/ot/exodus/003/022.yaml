  terminology: '''Meminta'' mempertahankan makna dasar שׁאל tanpa mengimpor gagasan peminjaman. ''Barang-barang perak'' dan ''barang-barang emas'' mempertahankan keluasan כְּלֵי. ''Perempuan yang tinggal di rumahnya'' mempertahankan ketidakpastian yang wajar tentang status גָּרַת dan acuan ''rumahnya''.'
