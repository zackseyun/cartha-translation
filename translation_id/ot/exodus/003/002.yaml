  text: וַ֠/יֵּרָא מַלְאַ֨ךְ יְהֹוָ֥ה אֵלָ֛י/ו בְּ/לַבַּת אֵ֖שׁ מִ/תּ֣וֹךְ הַ/סְּנֶ֑ה וַ/יַּ֗רְא וְ/הִנֵּ֤ה הַ/סְּנֶה֙ בֹּעֵ֣ר בָּ/אֵ֔שׁ וְ/הַ/סְּנֶ֖ה אֵינֶ֥/נּוּ אֻכָּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/002.yaml
  text: Then the angel of Yahweh appeared to him in a flame of fire from the midst of the bush. He looked[a], and behold, the bush was burning with fire, but the bush was not consumed.
translation:
  language: id
  text: Lalu malaikat Yahweh[a] menampakkan diri kepadanya dalam nyala api dari tengah semak itu. Ia melihat, dan tampaklah semak itu menyala dalam api, tetapi semak itu tidak habis terbakar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “utusan Yahweh.” Kata Ibrani yang digunakan dapat berarti “malaikat” atau “utusan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: menampakkan diri
  rationale: Bentuk Niphal dari ראה dalam konteks penampakan paling alami diterjemahkan secara intransitif sebagai “menampakkan diri,” bukan sekadar “terlihat.”
- source_word: מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  rationale: מַלְאַךְ dapat berarti “utusan” atau “malaikat”; dalam konteks penampakan ilahi, “malaikat” merupakan padanan Indonesia yang paling wajar, sementara alternatif leksikal dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian yang ditulis dengan Tetragramaton dialihaksarakan sebagai “Yahweh,” sehingga nama diri dalam teks Ibrani tetap tampak.
- source_word: אֵלָיו
  choice: kepadanya
  rationale: Mencerminkan preposisi dan sufiks pronominal yang dalam konteks merujuk kepada Musa.
- source_word: בְּלַבַּת אֵשׁ
  choice: dalam nyala api
  rationale: Ungkapan ini mempertahankan citra nyala api dengan bahasa Indonesia yang alami dan ringkas.
- source_word: מִתּוֹךְ הַסְּנֶה
  choice: dari tengah semak duri itu
  rationale: מִתּוֹךְ menyatakan asal dari bagian tengah atau dalam; “semak duri” merupakan padanan kontekstual yang jelas bagi הַסְּנֶה.
- source_word: וַיַּרְא
  choice: Musa melihat
  rationale: Kata kerja berarti “ia melihat.” Nama “Musa” dipakai untuk memperjelas subjek dalam bahasa Indonesia tanpa mengubah rujukannya.
- source_word: וְהִנֵּה
  choice: dan tampaklah
  rationale: “Tampaklah” mempertahankan fungsi הִנֵּה sebagai penanda yang mengarahkan perhatian pada pemandangan mengejutkan, dengan ragam naratif Indonesia yang bermartabat.
- source_word: בֹּעֵר בָּאֵשׁ
  choice: menyala dalam api
  rationale: Bentuk partisip menunjukkan keadaan yang sedang berlangsung; terjemahan ini juga mempertahankan penyebutan eksplisit api.
- source_word: אֵינֶנּוּ אֻכָּל
  choice: tidak terbakar habis
  rationale: Bentuk pasif אכל dalam konteks api berarti tidak dihabiskan atau dilalap; “tidak terbakar habis” menyampaikan paradoks itu secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama diri ilahi secara langsung. “Yahweh” mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Penerjemahan מַלְאַךְ dalam konteks penampakan ilahi
  choice: malaikat
  alternative: utusan
  rationale: Istilah Ibrani dapat menunjuk utusan manusia atau surgawi. Konteks penampakan dari tengah api mendukung “malaikat,” tetapi teks tidak menentukan lebih jauh identitas atau hakikat tokoh tersebut; kemungkinan “utusan” dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang alami dan bermartabat. Partikel “-lah” pada “tampaklah” mempertahankan daya penunjuk הִנֵּה tanpa memakai ungkapan arkais yang lebih berat. Pengulangan “semak duri” dipertahankan untuk mengikuti penekanan teks sumber.
