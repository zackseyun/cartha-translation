  text: Then Moses said[a], “Let me turn aside and see this great sight, why the bush is not burned up.”
translation:
  language: id
  text: Lalu Musa berkata[a], “Aku akan menoleh ke sana untuk melihat pemandangan yang mengagumkan ini—mengapa semak itu tidak habis terbakar.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengapa semak itu tidak terbakar,” atau “mengapa semak itu tidak musnah.”
    reason: alternatif leksikal
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menyatakannya secara alami dalam bahasa Indonesia modern.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: אָסֻרָה נָּא
  choice: Aku akan menyimpang sebentar
  rationale: Kohortatif dengan נָא menyatakan kehendak atau dorongan diri. “Sebentar” membuat ungkapan itu wajar dalam bahasa Indonesia tanpa mengubah tujuan tindakan Musa.
- source_word: וְאֶרְאֶה
  choice: untuk melihat
  rationale: Dalam konteks ini, tindakan menyimpang dilakukan dengan tujuan mengamati fenomena tersebut; bentuk tujuan lebih alami dalam bahasa Indonesia.
- source_word: הַמַּרְאֶה הַגָּדֹל הַזֶּה
  choice: pemandangan yang luar biasa ini
  rationale: מַרְאֶה menunjuk pada sesuatu yang terlihat, sedangkan גָּדֹל di sini mengungkapkan sifat menakjubkan atau luar biasa, bukan sekadar ukuran fisik.
- source_word: מַדּוּעַ
  choice: mengapa
  rationale: Padanan langsung bagi kata tanya yang menanyakan alasan.
- source_word: לֹא יִבְעַר
  choice: tidak habis terbakar
  rationale: Secara leksikal verba ini berarti “terbakar/menyala.” Dalam konteks tanda tersebut, “tidak habis terbakar” secara alami menyampaikan keheranan bahwa semak itu terbakar tetapi tidak musnah, tanpa memakai bentuk pasif yang tidak dituntut morfologi Ibrani.
- source_word: הַסְּנֶה
  choice: semak itu
  rationale: סְנֶה berarti semak, mungkin semak berduri; “semak” cukup tepat tanpa menambahkan kekhususan yang tidak pasti.
theological_decisions:
- issue: Sifat fenomena semak yang terbakar
  choice: mengapa semak itu tidak habis terbakar
  alternative: mengapa semak itu tidak terbakar; mengapa semak itu tidak musnah
  rationale: Terjemahan ini mempertahankan verba “terbakar” sekaligus menyampaikan paradoks kontekstual bahwa api tidak menghabiskan semak. Terjemahan tidak menambahkan penafsiran teologis mengenai makna tanda tersebut.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Kalimat langsung mempertahankan gerak narasi serta rasa heran Musa. Tanda pisah membantu menandai pertanyaan penjelas yang mengikuti niat Musa untuk melihat.
