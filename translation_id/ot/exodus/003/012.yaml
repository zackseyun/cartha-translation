base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/012.yaml
  text: 'And he said[a], “Certainly I will be with you, and this will be the sign for you that I have sent you: when you bring the people out of Egypt, you will serve God on this mountain.”'
translation:
  language: id
  text: 'Lalu Dia berkata, “Sesungguhnya, Aku akan menyertai engkau. Inilah tanda bagimu bahwa Akulah yang telah mengutus engkau: ketika engkau membawa bangsa itu keluar dari Mesir, kamu sekalian akan beribadah kepada Allah[a] di gunung ini.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akan melayani Allah”. Kata Ibrani ini dapat berarti “melayani” dan, ketika Allah menjadi objeknya, “beribadah”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sesungguhnya
  rationale: Dalam konteks ini כִּי menegaskan jawaban dan jaminan Allah terhadap keberatan Musa. “Sesungguhnya” menyampaikan daya penegasan itu dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: אֶהְיֶה עִמָּךְ
  choice: Aku akan menyertai engkau
  rationale: Bentuk imperfek אֶהְיֶה berorientasi ke depan dan menjanjikan kehadiran Allah. “Menyertai” mengungkapkan kehadiran yang mendampingi secara alami dalam bahasa Indonesia.
- source_word: הָאוֹת
  choice: tanda
  rationale: אוֹת menunjuk pada tanda atau peneguhan; “tanda” merupakan padanan yang jelas dan konsisten.
- source_word: כִּי אָנֹכִי שְׁלַחְתִּיךָ
  choice: bahwa Akulah yang mengutus engkau
  rationale: Konstruksi ini menjelaskan apa yang diteguhkan oleh tanda. “Akulah” mempertahankan penekanan pada pronomina אָנֹכִי, sedangkan “mengutus” wajar untuk tindakan pengutusan yang mendasari amanat Musa.
- source_word: בְּהוֹצִיאֲךָ
  choice: ketika engkau membawa ... keluar
  rationale: Infinitif dengan בְּ dan sufiks orang kedua tunggal paling alami dipahami secara temporal. Musa adalah pelaku yang membawa bangsa itu keluar.
- source_word: הָעָם
  choice: bangsa itu
  rationale: Rujukannya adalah umat Israel yang harus dipimpin Musa. “Bangsa itu” mempertahankan bentuk definit dan cocok dengan konteks keluaran dari Mesir.
- source_word: תַּעַבְדוּן
  choice: kamu sekalian akan beribadah
  rationale: Bentuk verba ini adalah orang kedua jamak, sehingga peralihan dari Musa sebagai “engkau” kepada seluruh umat dinyatakan dengan “kamu sekalian”. עבד dapat berarti melayani dan, dengan Allah sebagai objek, beribadah; “beribadah” paling alami dalam konteks pertemuan di gunung, sementara keluasan leksikal dicatat dalam catatan kaki.
- source_word: אֶת־הָאֱלֹהִים
  choice: Allah
  rationale: הָאֱלֹהִים di sini menunjuk kepada Allah Israel. “Allah” adalah padanan baku tanpa tambahan penafsiran.
- source_word: עַל הָהָר הַזֶּה
  choice: di gunung ini
  rationale: Walau עַל secara harfiah dapat berarti “di atas”, dalam bahasa Indonesia lokasi ibadah pada gunung paling alami dinyatakan dengan “di gunung ini”, tanpa menghilangkan kekonkretan tempatnya.
theological_decisions:
- issue: Hakikat tanda yang dijanjikan
  choice: Tanda tersebut adalah ibadah umat kepada Allah di gunung itu sesudah mereka keluar dari Mesir.
  alternative: Tanda itu adalah janji penyertaan Allah saat ini, atau mencakup baik jaminan sekarang maupun penggenapan kelak.
  rationale: Susunan kalimat paling wajar mengarahkan “tanda” kepada klausa berikutnya tentang keluarnya umat dan ibadah di gunung. Terjemahan mempertahankan sifat tanda yang berorientasi pada penggenapan masa depan tanpa meniadakan kemungkinan hubungan eratnya dengan janji penyertaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Engkau” dipakai untuk Musa sebagai orang kedua tunggal, sedangkan “kamu sekalian” menandai perubahan gramatikal ke orang kedua jamak yang mencakup umat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
