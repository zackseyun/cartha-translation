revisions:
- from: 'Allah berfirman lagi kepada Musa, “Beginilah harus kaukatakan kepada bani Israel: ‘Yahweh,[a] Allah nenek moyangmu, Allah Abraham, Allah Ishak, dan Allah Yakub, telah mengutus aku kepadamu.’ Inilah nama-Ku untuk selama-lamanya, dan dengan nama inilah Aku harus diingat[b] turun-temurun.”'
  to: 'Allah berfirman lagi kepada Musa, “Beginilah harus kaukatakan kepada bani Israel: ‘Yahweh,[a] Allah nenek moyangmu, Allah Abraham, Allah Ishak, dan Allah Yakub, telah mengutus aku kepadamu.’ Inilah nama-Ku untuk selama-lamanya, dan inilah sebutan-Ku turun-temurun.”'
  rationale: Revisi mengganti parafrasa verbal yang menambahkan “harus” dengan klausa nominal yang mencerminkan teks Ibrani dan tetap komunikatif dalam bahasa Indonesia modern. Catatan [b] dipertahankan sebagai alternatif leksikal, tetapi penandanya tidak ditempatkan dalam teks utama karena “sebutan-Ku” sudah merupakan pilihan terjemahan utama; ini menghindari jangkar catatan yang tidak perlu. Catatan [a] diperjelas secara filologis.
