    rationale: YHWH adalah bentuk konsonantal; “Yahweh” lebih tepat disebut transliterasi atau pelafalan rekonstruktif/lazim dalam kajian, bukan pelafalan yang dapat dipastikan dari bentuk konsonantal itu sendiri.
