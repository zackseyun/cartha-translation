  text: וַ/יֹּאמֶר֩ ע֨וֹד אֱלֹהִ֜ים אֶל מֹשֶׁ֗ה כֹּֽה תֹאמַר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ יְהוָ֞ה אֱלֹהֵ֣י אֲבֹתֵי/כֶ֗ם אֱלֹהֵ֨י אַבְרָהָ֜ם אֱלֹהֵ֥י יִצְחָ֛ק וֵ/אלֹהֵ֥י יַעֲקֹ֖ב שְׁלָחַ֣/נִי אֲלֵי/כֶ֑ם זֶה שְּׁמִ֣/י לְ/עֹלָ֔ם וְ/זֶ֥ה זִכְרִ֖/י לְ/דֹ֥ר דֹּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/015.yaml
  text: 'God also said to Moses[a], “Thus you shall say to the sons of Israel: Yahweh, the God of your fathers, the God of Abraham, the God of Isaac, and the God of Jacob, has sent me to you. This is my name forever[b], and this is my memorial from generation to generation.”'
translation:
  language: id
  text: 'Allah berfirman lagi kepada Musa, “Beginilah harus kaukatakan kepada bani Israel: ‘Yahweh,[a] Allah nenek moyangmu, Allah Abraham, Allah Ishak, dan Allah Yakub, telah mengutus aku kepadamu.’ Inilah nama-Ku untuk selama-lamanya, dan inilah sebutan-Ku turun-temurun.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH, nama ilahi yang lazim ditransliterasikan “Yahweh”.'
    reason: Menjelaskan bentuk konsonantal nama ilahi dan dasar penggunaan “Yahweh”.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar seperti ‘TUHAN’.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: Ungkapan baku dan alami dalam bahasa Indonesia yang tetap mencerminkan bentuk kekerabatan kolektif harfiah ‘anak-anak lelaki/keturunan Israel’.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: Allah nenek moyangmu
  rationale: Dalam bahasa Indonesia, ‘nenek moyang’ adalah padanan idiomatis bagi leluhur dan tidak menyiratkan bahwa Allah hanya terkait dengan ayah langsung mereka.
- source_word: שְׁלָחַנִי
  choice: telah mengutus aku
  rationale: Menyatakan tindakan pengutusan yang sudah terjadi dan tetap relevan bagi kedatangan Musa.
- source_word: זֶה שְּׁמִי לְעֹלָם
  choice: Inilah nama-Ku untuk selama-lamanya
  rationale: Menyampaikan durasi berkelanjutan dari לְעֹלָם dalam ungkapan Indonesia yang wajar dan bermartabat.
- source_word: זִכְרִי
  choice: dengan nama inilah Aku harus diingat
  rationale: Mengungkapkan makna kontekstual ‘peringatan/sebutan yang dengannya Aku diingat’ secara lebih jelas daripada nomina abstrak ‘peringatan-Ku’.
- source_word: לְדֹר דֹּר
  choice: turun-temurun
  rationale: Padanan idiomatis Indonesia untuk kesinambungan dari generasi ke generasi.
- source_word: כֹּה תֹאמַר
  choice: Beginilah harus kaukatakan
  rationale: Mempertahankan formula instruksi langsung dengan gaya Indonesia yang alami.
- source_word: עוֹד
  choice: lagi
  rationale: Menandai kelanjutan ucapan Allah kepada Musa dalam konteks narasi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: YHWH atau TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama pribadi; ‘Yahweh’ menyajikan pelafalan yang lazim direkonstruksi, sedangkan catatan kaki mempertahankan bentuk konsonantal Ibraninya.
- issue: Makna זִכְרִי dalam kaitannya dengan nama ilahi
  choice: dengan nama inilah Aku harus diingat
  alternative: inilah peringatan-Ku
  rationale: Pilihan utama membuat hubungan antara nama dan ingatan lintas generasi menjadi jelas tanpa meniadakan kemungkinan nuansa ‘peringatan/sebutan’, yang dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. ‘Bani Israel’ mempertahankan corak kekerabatan kolektif tanpa kekakuan ‘anak-anak lelaki Israel’. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan baku Indonesia. Penempatan catatan [a] langsung setelah ‘Yahweh’ memperbaiki ketidakselarasan penanda dalam lapisan konsultasi Inggris.
