source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֔ה רָאֹ֥ה רָאִ֛יתִי אֶת עֳנִ֥י עַמִּ֖/י אֲשֶׁ֣ר בְּ/מִצְרָ֑יִם וְ/אֶת צַעֲקָתָ֤/ם שָׁמַ֨עְתִּי֙ מִ/פְּנֵ֣י נֹֽגְשָׂ֔י/ו כִּ֥י יָדַ֖עְתִּי אֶת מַכְאֹבָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/007.yaml
  text: Then Yahweh said[a], “I have surely seen the affliction of my people who are in Egypt, and I have heard their cry because of their oppressors[c][b], for I know their sufferings.”
translation:
  language: id
  text: Lalu Yahweh berfirman, “Aku sungguh-sungguh telah melihat penderitaan umat-Ku yang berada di Mesir, dan Aku telah mendengar jeritan mereka karena para penindas mereka, sebab Aku mengetahui kesengsaraan mereka.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama pribadi, bukan menggantinya dengan gelar.
- source_word: רָאֹה רָאִיתִי
  choice: Aku sungguh-sungguh telah melihat
  rationale: Konstruksi infinitif absolut dengan verba finit memberi penegasan; bentuk ini menyampaikan tekanan tersebut secara wajar dalam bahasa Indonesia.
- source_word: עֳנִי
  choice: penderitaan
  rationale: Mencakup keadaan sengsara akibat perlakuan keras tanpa mempersempit maknanya hanya menjadi tindakan penindasan.
- source_word: עַמִּי
  choice: umat-Ku
  rationale: Ungkapan alami dan bermartabat untuk sebutan relasional-perjanjian bagi Israel.
- source_word: בְּמִצְרָיִם
  choice: yang berada di Mesir
  rationale: Memperjelas bahwa frasa lokasi menerangkan umat Yahweh.
- source_word: צַעֲקָתָם
  choice: jeritan mereka
  rationale: Menggambarkan seruan kuat yang timbul dari keadaan tertekan.
- source_word: מִפְּנֵי נֹגְשָׂיו
  choice: karena para penindas mereka
  rationale: Menyampaikan hubungan sebab dan menunjuk kepada orang-orang yang memaksa atau menuntut kerja.
- source_word: כִּי
  choice: sebab
  rationale: Mempertahankan hubungan penjelasan dengan pernyataan sebelumnya.
- source_word: יָדַעְתִּי
  choice: Aku mengetahui
  rationale: Menyampaikan pengetahuan ilahi yang langsung dan personal tanpa melunakkannya menjadi sekadar kesadaran abstrak.
- source_word: מַכְאֹבָיו
  choice: kesengsaraan mereka
  rationale: Mewakili bentuk jamak yang mencakup berbagai rasa sakit dan derita umat.
theological_decisions:
- issue: Penerjemahan nama ilahi YHWH
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Nama perjanjian dipertahankan sebagai nama pribadi sesuai bentuk sumber, tanpa menggantinya dengan gelar.
- issue: Bahasa antropopatik tentang pengetahuan Allah
  choice: Aku mengetahui kesengsaraan mereka
  alternative: Aku menyadari kesengsaraan mereka; Aku telah memperhatikan kesakitan mereka
  rationale: Mempertahankan bahasa Ibrani tentang pengetahuan Allah yang personal dan terlibat, tanpa menjadikannya sekadar kesadaran abstrak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Pengulangan kosakata dihindari dengan memakai “penderitaan” untuk עֳנִי dan “kesengsaraan” untuk מַכְאֹבָיו, sambil tetap mempertahankan perbedaan leksikal sumber. Tidak diperlukan catatan kaki karena penegasan רָאֹה רָאִיתִי dapat disampaikan langsung dan alternatif lainnya tidak mengubah makna secara substansial.
