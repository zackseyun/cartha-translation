  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל מֹשֶׁ֔ה אֶֽהְיֶ֖ה אֲשֶׁ֣ר אֶֽהְיֶ֑ה וַ/יֹּ֗אמֶר כֹּ֤ה תֹאמַר֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל אֶֽהְיֶ֖ה שְׁלָחַ֥/נִי אֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/014.yaml
  text: 'And God said to Moses[a], “I AM WHO I AM.” And he said[b], “Thus you shall say to the sons of Israel: ‘I AM has sent me to you.’”'
translation:
  language: id
  text: 'Lalu Allah berfirman kepada Musa, “AKU ADALAH AKU.”[a] Dia berfirman lagi, “Beginilah harus kaukatakan kepada orang Israel: ‘AKU’ telah mengutus aku kepada kalian.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “AKU AKAN MENJADI APA YANG AKU AKAN MENJADI,” atau, “AKU AKAN MENJADI SIAPA YANG AKU AKAN MENJADI.” Kata kerja Ibrani di sini dapat menyatakan makna masa depan maupun makna kini.
    reason: alternative_reading
lexical_decisions:
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini bentuk yang secara morfologis jamak berfungsi sebagai sebutan tunggal bagi Allah Israel; “Allah” merupakan padanan baku dan alami dalam bahasa Indonesia.
- source_word: אֶהְיֶה
  choice: AKU
  rationale: Bentuk Qal imperfek orang pertama tunggal dari היה dapat menyatakan keadaan kini maupun mendatang. Dalam kemunculan kedua, bentuk ini dipakai sebagai sebutan ilahi; “AKU” mempertahankan fungsi nama dalam bahasa Indonesia, sementara makna verbal lengkap dan kemungkinan futurum dijelaskan dalam catatan kaki.
- source_word: אֶהְיֶה אֲשֶׁר אֶהְיֶה
  choice: AKU ADALAH AKU
  rationale: Ungkapan ini merupakan pengenalan diri yang khidmat. Terjemahan kini mempertahankan kesinambungan dengan bentuk singkat “AKU” dalam klausa berikutnya, sedangkan kemungkinan “Aku akan menjadi...” dipertahankan dalam catatan kaki.
- source_word: כֹּה תֹאמַר
  choice: Beginilah harus kaukatakan
  rationale: כֹּה memperkenalkan rumusan perkataan yang harus disampaikan, dan bentuk imperfek תֹאמַר memiliki daya direktif. Susunan ini alami sekaligus tegas dalam bahasa Indonesia.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: kepada keturunan Israel
  rationale: Secara harfiah berarti “anak-anak lelaki Israel,” tetapi dalam konteks kolektif menunjuk komunitas yang berasal dari Israel. “Keturunan Israel” menjaga hubungan genealogis tanpa memberi kesan bahwa hanya laki-laki yang dituju.
- source_word: שְׁלָחַנִי
  choice: telah mengutus aku
  rationale: Bentuk perfektif dengan sufiks orang pertama tunggal menyatakan tindakan pengutusan yang telah dilakukan dan tetap relevan bagi penyampaian Musa.
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman / Dia berfirman lagi
  rationale: Rangkaian wayyiqtol memajukan narasi. “Berfirman” sesuai untuk ucapan Allah dalam register Alkitab Indonesia, dan “lagi” menandai ujaran lanjutan tanpa mengubah isinya.
theological_decisions:
- issue: Makna sebutan diri ilahi אֶהְיֶה אֲשֶׁר אֶהְיֶה
  choice: AKU ADALAH AKU
  alternative: AKU AKAN MENJADI SEPERTI YANG AKU AKAN MENJADI; AKU AKAN MENJADI SIAPA AKU AKAN MENJADI
  rationale: Imperfek Ibrani memungkinkan nuansa kini maupun mendatang. Teks utama memakai bentuk pengenalan diri yang alami dan bersifat seperti nama, tetapi catatan kaki mempertahankan kemungkinan futurum agar ketegangan semantis teks Ibrani tidak diselesaikan secara sepihak.
- issue: Kapitalisasi sebutan ilahi
  choice: AKU ADALAH AKU; AKU
  alternative: Aku adalah Aku; Aku
  rationale: Huruf kapital menandai fungsi ungkapan itu sebagai sebutan diri ilahi yang khidmat dan memperjelas pengulangan אֶהְיֶה pada bagian kedua. Ini merupakan pilihan tipografis bahasa sasaran, bukan penandaan khusus dalam naskah Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina terikat “kau-” menjaga kelugasan perintah tunggal kepada Musa; “kalian” secara alami menandai penerima jamak. Sebutan “Allah” dan verba “berfirman” sesuai dengan register Alkitab Indonesia tanpa memakai bentuk yang terlalu arkais.
