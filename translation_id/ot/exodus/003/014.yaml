  to: 'Lalu Allah berfirman kepada Musa, “AKU ADALAH AKU.”[a] Dia berfirman lagi, “Beginilah harus kaukatakan kepada orang Israel: ‘AKU’ telah mengutus aku kepada kalian.”'
  rationale: Revisi terutama membedakan sebutan ilahi “AKU” yang dikutip dari pronomina “aku” yang merujuk kepada Musa dalam klausa pengutusan. Catatan kaki dipoles agar alternatif masa depan dari אֶהְיֶה tetap tersedia dalam bahasa Indonesia yang alami. Tidak ada penafsiran doktrinal tambahan.
