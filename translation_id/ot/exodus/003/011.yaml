  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל הָ֣/אֱלֹהִ֔ים מִ֣י אָנֹ֔כִי כִּ֥י אֵלֵ֖ךְ אֶל פַּרְעֹ֑ה וְ/כִ֥י אוֹצִ֛יא אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/011.yaml
  text: But Moses said to God[a], “Who am I that I should go to Pharaoh and that I should bring the sons of Israel out of Egypt?”
translation:
  language: id
  text: Namun Musa berkata kepada Allah, “Siapakah aku ini, sehingga aku harus pergi menghadap Firaun dan membawa keturunan Israel[a] keluar dari Mesir?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Israel”; secara harfiah, “anak-anak Israel.”
    reason: Menjelaskan alternatif idiomatis dan bentuk kekerabatan dari frasa Ibrani בְּנֵי יִשְׂרָאֵל tanpa membatasi rujukannya kepada laki-laki saja.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Bentuk naratif dari אמר secara wajar diterjemahkan dengan verba ujaran umum “berkata”.
- source_word: אֶל הָאֱלֹהִים
  choice: kepada Allah
  rationale: Walaupun אֱלֹהִים memakai artikel dalam bahasa Ibrani, rujukannya di sini ialah Allah dan idiom bahasa Indonesia tidak memerlukan artikel.
- source_word: מִי אָנֹכִי
  choice: Siapakah aku ini
  rationale: Ungkapan ini mempertahankan pertanyaan retoris Musa serta nuansa ketidaklayakannya tanpa menambahkan tafsiran.
- source_word: כִּי אֵלֵךְ
  choice: sehingga aku harus pergi
  rationale: כִּי memperkenalkan tindakan yang dipertanyakan sesudah “Siapakah aku”; “sehingga ... harus” menyampaikan tindakan yang ditugaskan atau diharapkan secara alami dalam bahasa Indonesia.
- source_word: אֶל פַּרְעֹה
  choice: menghadap Firaun
  rationale: “Menghadap” adalah ungkapan Indonesia yang alami untuk datang kepada seorang penguasa, sambil mempertahankan arah tindakan kepada Firaun.
- source_word: וְכִי אוֹצִיא
  choice: dan membawa ... keluar
  rationale: Bentuk Hifil אוֹצִיא bersifat kausatif, yakni menyebabkan pihak lain keluar; “membawa ... keluar” mempertahankan makna itu dan kesejajaran dua tugas Musa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Dalam konteks genealogis-kolektif ini, “keturunan Israel” mencakup umat yang berasal dari Israel tanpa memberi kesan bahwa yang dimaksud hanya anak laki-laki atau orang yang masih kanak-kanak.
- source_word: מִמִּצְרַיִם
  choice: keluar dari Mesir
  rationale: Gabungan “membawa ... keluar dari” menyampaikan verba kausatif dan preposisi sumber secara lengkap dan alami.
theological_decisions:
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: orang Israel; anak-anak Israel
  rationale: Frasa Ibrani berbentuk genealogis dan merujuk secara kolektif kepada umat Israel. “Keturunan Israel” menjaga citra kekerabatan serta cakupan seluruh umat, sedangkan “anak-anak Israel” dalam bahasa Indonesia modern mudah disalahpahami sebagai anak kecil.
- issue: Nuansa pertanyaan Musa
  choice: Siapakah aku ini, sehingga aku harus ...
  alternative: Siapakah aku, maka aku akan ...
  rationale: Pilihan ini mempertahankan ketegangan antara ketidaklayakan yang Musa rasakan dan tugas ilahi yang sedang dibebankan kepadanya, tanpa mengubah pertanyaan menjadi penolakan mutlak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Namun” menandai keberatan Musa dalam alur percakapan. “Menghadap Firaun” dipilih sebagai idiom yang lazim ketika seseorang datang kepada penguasa. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang dijelaskan.
