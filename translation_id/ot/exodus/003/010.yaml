  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֣ה לְכָ֔/ה וְ/אֶֽשְׁלָחֲ/ךָ֖ אֶל פַּרְעֹ֑ה וְ/הוֹצֵ֛א אֶת עַמִּ֥/י בְנֵֽי יִשְׂרָאֵ֖ל מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/010.yaml
  text: And now[a], come, and I will send you to Pharaoh, and bring my people, the sons of Israel, out of Egypt.
translation:
  language: id
  text: “Sekarang, pergilah! Aku akan mengutusmu kepada Firaun. Bawalah umat-Ku, Bani Israel[a], keluar dari Mesir.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Israel”. Secara harfiah, “anak-anak lelaki Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Menandai peralihan wacana menuju penugasan Musa; dalam bahasa Indonesia, “Sekarang” sudah menyampaikan fungsi penghubung dan temporal secara alami.
- source_word: לְכָה
  choice: pergilah
  rationale: Imperatif הלך dalam konteks pengutusan kepada Firaun paling alami dan tepat secara arah diterjemahkan “pergilah”; partikel -lah mempertahankan nada perintah yang tegas.
- source_word: וְאֶשְׁלָחֲךָ
  choice: Aku akan mengutusmu
  rationale: Menerjemahkan bentuk imperfek Qal dan sufiks orang kedua tunggal secara langsung tanpa menambahkan hubungan tujuan yang tidak dinyatakan eksplisit.
- source_word: אֶל־פַּרְעֹה
  choice: kepada Firaun
  rationale: Menyampaikan arah pengutusan dengan preposisi Indonesia yang lazim bagi pengutusan kepada seseorang.
- source_word: וְהוֹצֵא
  choice: Bawalah ... keluar
  rationale: Imperatif Hifil dari יצא bersifat kausatif, yakni menyebabkan pihak lain keluar; “bawalah ... keluar” alami dalam bahasa Indonesia dan mempertahankan daya perintahnya.
- source_word: עַמִּי
  choice: umat-Ku
  rationale: “Umat-Ku” merupakan ungkapan Indonesia yang alami dan bermakna kuat untuk kepunyaan kolektif serta relasi perjanjian; kapitalisasi sufiks mengikuti konvensi penghormatan kepada Allah.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Bani Israel
  rationale: “Bani Israel” dikenal dalam bahasa Indonesia sebagai sebutan bagi keturunan Israel dan mempertahankan unsur kekeluargaan serta leluhur tanpa memberi kesan bahwa yang dimaksud hanya anak-anak yang belum dewasa.
- source_word: מִמִּצְרָיִם
  choice: keluar dari Mesir
  rationale: Bersama verba kausatif הוציא, frasa ini secara alami menunjukkan gerakan keluar dari Mesir.
theological_decisions:
- issue: Sebutan umat perjanjian בְּנֵי יִשְׂרָאֵל
  choice: Bani Israel
  alternative: orang Israel; secara harfiah, anak-anak lelaki Israel
  rationale: “Bani Israel” menjaga identitas genealogis dan perjanjian yang terkandung dalam ungkapan Ibrani, sementara catatan kaki mempertahankan bentuk harfiah dan alternatif idiomatis tanpa membatasi kelompok itu pada anak-anak di bawah umur.
- issue: Hubungan antara pengutusan Allah dan perintah kepada Musa
  choice: 'Dua kalimat perintah dan pernyataan: “Pergilah! Aku akan mengutusmu ... Bawalah ...”'
  alternative: “Pergilah, sebab Aku akan mengutusmu ... dan bawalah ...”
  rationale: Susunan ini mempertahankan koordinasi Ibrani tanpa menambahkan hubungan sebab atau tujuan yang tidak dinyatakan secara eksplisit; Musa sungguh diperintah bertindak, sekaligus diutus oleh Allah.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. “Pergilah” dipilih daripada “marilah” karena arah penugasan ialah dari hadirat Allah menuju Firaun. Tanda seru menyampaikan ketegasan imperatif tanpa menambahkan isi. “Bani Israel” mempertahankan nuansa keturunan dan tetap mudah dikenali pembaca umum.
