id: EXO.3.4
reference: Exodus 3:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֥רְא יְהוָ֖ה כִּ֣י סָ֣ר לִ/רְא֑וֹת וַ/יִּקְרָא֩ אֵלָ֨י/ו אֱלֹהִ֜ים מִ/תּ֣וֹךְ הַ/סְּנֶ֗ה וַ/יֹּ֛אמֶר מֹשֶׁ֥ה מֹשֶׁ֖ה וַ/יֹּ֥אמֶר הִנֵּֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/004.yaml
  text: When Yahweh saw that he had turned aside to look[a], God called to him from the midst of the bush and said, “Moses, Moses!” And he said[c][b], “Here I am.”
translation:
  language: id
  text: Ketika Yahweh[a] melihat bahwa Musa berbelok untuk melihat, Allah memanggilnya dari tengah semak[b] itu dan berkata, “Musa, Musa!” Musa menjawab, “Aku di sini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Ibrani יהוה (YHWH); secara tradisional juga diterjemahkan “TUHAN”.
    reason: alternative_reading
  - marker: b
    text: Kata Ibrani ini dapat secara lebih khusus berarti “semak berduri”.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dan mempertahankan perbedaannya dari אֱלֹהִים dalam ayat yang sama.
- source_word: וַיַּרְא
  choice: melihat
  rationale: Arti naratif biasa dari ראה sesuai dengan tindakan Yahweh yang mengamati Musa.
- source_word: כִּי סָר לִרְאוֹת
  choice: bahwa Musa berbelok untuk melihat
  rationale: כִּי menyatakan isi yang dilihat; סָר menunjukkan perubahan arah, dan infinitif לִרְאוֹת menyatakan tujuan. Nama Musa diperjelas dalam bahasa Indonesia agar rujukan pronomina tidak kabur.
- source_word: וַיִּקְרָא אֵלָיו
  choice: memanggilnya
  rationale: Mengungkapkan secara alami tindakan memanggil yang diarahkan kepada Musa.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Padanan baku bahasa Indonesia bagi אֱלֹהִים dan mempertahankan istilah yang berbeda dari nama Yahweh.
- source_word: מִתּוֹךְ הַסְּנֶה
  choice: dari tengah semak itu
  rationale: Mempertahankan gambaran ruang bahwa suara berasal dari bagian tengah atau dalam semak.
- source_word: מֹשֶׁה מֹשֶׁה
  choice: Musa, Musa!
  rationale: Pengulangan nama dipertahankan sebagai sapaan langsung yang kuat dan pribadi.
- source_word: הִנֵּנִי
  choice: Aku di sini
  rationale: Ungkapan Indonesia yang alami untuk jawaban yang menyatakan kehadiran dan kesiapan tanpa menambahkan gagasan ketaatan yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Pemakaian יְהוָה dan אֱלֹהִים secara berdekatan
  choice: Menerjemahkan יְהוָה sebagai “Yahweh” dan אֱלֹהִים sebagai “Allah”.
  alternative: Menerjemahkan keduanya sebagai “Allah”, atau mengganti יְהוָה dengan gelar “TUHAN”.
  rationale: Teks Ibrani sengaja memakai dua sebutan yang berbeda. Mempertahankan perbedaan itu membuat terjemahan transparan terhadap sumber tanpa menyamakan nama pribadi dengan gelar atau sebutan umum.
- issue: Subjek perkataan terakhir וַיֹּאמֶר
  choice: Menyebut “Musa menjawab” secara eksplisit.
  alternative: Memakai “ia berkata”, yang dapat merujuk kepada Allah atau Musa dalam bahasa Indonesia.
  rationale: Konteks menunjukkan bahwa Musa memberi respons kepada panggilan ilahi. Penyebutan nama memperjelas rujukan tanpa mengubah isi jawaban.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat, dengan susunan naratif yang alami. Istilah “berbelok” mempertahankan tindakan Musa yang menyimpang dari jalurnya, sedangkan “Aku di sini” menyampaikan jawaban kesiapan secara lugas.
