  text: וְ/שָׁמְע֖וּ לְ/קֹלֶ֑/ךָ וּ/בָאתָ֡ אַתָּה֩ וְ/זִקְנֵ֨י יִשְׂרָאֵ֜ל אֶל מֶ֣לֶךְ מִצְרַ֗יִם וַ/אֲמַרְתֶּ֤ם אֵלָי/ו֙ יְהוָ֞ה אֱלֹהֵ֤י הָֽ/עִבְרִיִּים֙ נִקְרָ֣ה עָלֵ֔י/נוּ וְ/עַתָּ֗ה נֵֽלֲכָה נָּ֞א דֶּ֣רֶךְ שְׁלֹ֤שֶׁת יָמִים֙ בַּ/מִּדְבָּ֔ר וְ/נִזְבְּחָ֖ה לַֽ/יהוָ֥ה אֱלֹהֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/018.yaml
  text: And they will listen to your voice[a], and you and the elders of Israel will go to the king of Egypt and say to him, ‘Yahweh, the God of the Hebrews, has met with us. And now, please let us go a journey of three days into the wilderness, so that we may sacrifice to Yahweh our God.’
translation:
  language: id
  text: Mereka akan mendengarkan perkataanmu. Lalu engkau dan para tua-tua Israel akan pergi kepada raja Mesir dan berkata kepadanya, ‘Yahweh, Allah orang Ibrani, telah menjumpai kami.[a] Sekarang, izinkanlah kami pergi menempuh perjalanan tiga hari ke padang belantara untuk mempersembahkan kurban kepada Yahweh, Allah kami.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah mendatangi kami.” Ungkapan Ibrani dapat menyatakan bahwa Yahweh datang kepada atau berjumpa dengan mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְעוּ לְקֹלֶךָ
  choice: Mereka akan mendengarkan perkataanmu
  rationale: Kata שׁמע dapat berarti mendengar, mendengarkan, atau mengindahkan. Dalam konteks ini para tua-tua akan menerima perkataan Musa dan menanggapinya. “Mendengarkan” mempertahankan ruang antara sekadar mendengar dan menaati, sedangkan “perkataanmu” menyampaikan idiom harfiah “suaramu” secara wajar dalam bahasa Indonesia.
- source_word: וּבָאתָ אַתָּה וְזִקְנֵי יִשְׂרָאֵל
  choice: Lalu engkau bersama para tua-tua Israel harus menghadap
  rationale: Bentuk Ibrani menempatkan Musa dan para tua-tua sebagai pelaku yang datang kepada raja. “Menghadap” merupakan ungkapan Indonesia yang alami untuk datang menemui raja, sedangkan “harus” menyampaikan daya instruksional bentuk verbal dalam konteks amanat ilahi.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: raja Mesir
  rationale: Padanan konstruksi kepunyaan yang langsung, jelas, dan alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi empat huruf ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap terlihat.
- source_word: אֱלֹהֵי הָעִבְרִיִּים
  choice: Allah orang Ibrani
  rationale: Mempertahankan sebutan etnis dalam konstruksi Ibrani dengan bentuk Indonesia yang ringkas dan alami.
- source_word: נִקְרָה עָלֵינוּ
  choice: telah menjumpai kami
  rationale: Bentuk Nifal קרא dengan עַל menunjuk pada perjumpaan atau kedatangan yang dialami. “Menjumpai” menyatakan peristiwa pertemuan tanpa mempersempitnya menjadi panggilan verbal.
- source_word: נֵלֲכָה נָּא
  choice: izinkanlah kami pergi
  rationale: Kohortatif dengan partikel נָא menyatakan permohonan sopan kepada raja. “Izinkanlah” membuat arah permohonan jelas dalam bahasa Indonesia.
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: menempuh perjalanan tiga hari
  rationale: Ungkapan ini dapat menggambarkan jarak yang ditempuh dalam tiga hari maupun lamanya perjalanan. Terjemahan tersebut mempertahankan keluwesan itu.
- source_word: בַּמִּדְבָּר
  choice: ke padang belantara
  rationale: Preposisi arah disampaikan melalui “ke” setelah verba gerak. “Padang belantara” menggambarkan wilayah liar yang belum dihuni tanpa membatasinya pada gurun pasir.
- source_word: וְנִזְבְּחָה
  choice: untuk mempersembahkan kurban
  rationale: Kohortatif kedua menyatakan tujuan perjalanan dalam konteks permohonan. “Mempersembahkan kurban” lebih jelas daripada sekadar “berkurban” dan tetap umum secara kultis.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks secara langsung memakai nama perjanjian YHWH. Bentuk “Yahweh” mempertahankannya sebagai nama, bukan menggantinya dengan gelar.
- issue: Makna נִקְרָה עָלֵינוּ dalam bahasa perjumpaan ilahi
  choice: telah menjumpai kami
  alternative: telah mendatangi kami; telah memanggil kami
  rationale: Frasa tersebut menyatakan perjumpaan dengan Allah, tetapi tidak dengan sendirinya menetapkan bahwa yang dimaksud hanya panggilan verbal. Pilihan ini mempertahankan keluasan maknanya.
- issue: Hubungan וְנִזְבְּחָה dengan permohonan untuk pergi
  choice: 'tujuan: “untuk mempersembahkan kurban”'
  alternative: 'koordinasi: “dan kami akan mempersembahkan kurban”'
  rationale: Dalam rangkaian kohortatif ini, persembahan kurban paling wajar dipahami sebagai tujuan perjalanan. Terjemahan tujuan tidak menambahkan isi teologis di luar hubungan pragmatis dalam kalimat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Sapaan “engkau” dipakai untuk Musa dalam tuturan ilahi, “kami” dipakai dalam kutipan yang ditujukan kepada raja, dan istilah “para tua-tua Israel” dipertahankan sebagai sebutan kepemimpinan komunal. Penanda catatan kaki [a] ditempatkan langsung pada frasa yang diterangkannya.
