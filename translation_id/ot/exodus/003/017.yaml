  text: וָ/אֹמַ֗ר אַעֲלֶ֣ה אֶתְ/כֶם֮ מֵ/עֳנִ֣י מִצְרַיִם֒ אֶל אֶ֤רֶץ הַֽ/כְּנַעֲנִי֙ וְ/הַ֣/חִתִּ֔י וְ/הָֽ/אֱמֹרִי֙ וְ/הַ/פְּרִזִּ֔י וְ/הַ/חִוִּ֖י וְ/הַ/יְבוּסִ֑י אֶל אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/017.yaml
  text: And I have said[a], ‘I will bring you up out of the affliction of Egypt to the land of the Canaanites, the Hittites, the Amorites, the Perizzites, the Hivites[b], and the Jebusites—to a land flowing with milk and honey.’
translation:
  language: id
  text: Aku telah berfirman[a], ‘Aku akan membawa kalian keluar dari penderitaan di Mesir[b], naik ke negeri orang Kanaan, orang Het, orang Amori, orang Feris, orang Hewi, dan orang Yebus—ke negeri yang berlimpah susu dan madu.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku berfirman, ‘Aku akan membawa kalian keluar ...’” Kata kerja Ibraninya secara formal berbentuk lampau; teks utama menerjemahkannya sebagai pernyataan terdahulu yang tetap berlaku dalam konteks ini.
    reason: alternative_reading
  - marker: b
    text: “Penderitaan di Mesir” juga dapat diterjemahkan “penindasan di Mesir” atau “kesengsaraan akibat Mesir.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Aku telah berfirman
  rationale: Bentuk Ibrani ini secara formal menunjuk pada tindakan lampau, tetapi dalam konteksnya menyampaikan ketetapan Allah yang tetap berlaku. Bentuk perfek Indonesia mempertahankan kedua nuansa itu tanpa mengubahnya menjadi parafrasa seperti “Aku berjanji.”
- source_word: אַעֲלֶה אֶתְכֶם
  choice: Aku akan membawa kalian keluar
  rationale: Bentuk Hifil dari עלה secara harfiah berarti “membawa naik.” Dalam bahasa Indonesia, “membawa kalian keluar” lebih alami dalam konteks keluarnya Israel dari penderitaan Mesir, sementara arah menuju negeri tujuan tetap dinyatakan sesudahnya.
- source_word: מֵעֳנִי מִצְרַיִם
  choice: keluar dari penderitaan di Mesir
  rationale: עֳנִי mencakup penderitaan, kesengsaraan, dan penindasan. Frasa “di Mesir” secara alami menghubungkan penderitaan itu dengan tempat Israel mengalaminya tanpa memaksakan bahwa Mesir sendiri yang menderita.
- source_word: אֶל אֶרֶץ הַכְּנַעֲנִי ... הַיְבוּסִי
  choice: menuju negeri orang Kanaan ... orang Yebus
  rationale: Nama-nama bangsa berbentuk tunggal dalam bahasa Ibrani, tetapi menunjuk kepada kelompok penduduk. Pola “orang Kanaan” dan seterusnya jelas dan wajar dalam bahasa Indonesia.
- source_word: אֶל אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: menuju negeri yang berlimpah susu dan madu
  rationale: Ungkapan Ibrani ini menggambarkan kesuburan dan kelimpahan. “Berlimpah susu dan madu” mempertahankan gambaran pokoknya dalam bentuk yang alami dan dikenal luas dalam bahasa Indonesia.
theological_decisions:
- issue: Waktu dan daya berlaku pernyataan ilahi dalam וָאֹמַר
  choice: Aku telah berfirman
  alternative: Aku berfirman / Aku sudah mengatakan
  rationale: Terjemahan utama mempertahankan bentuk lampau sekaligus relevansi pernyataan itu bagi tindakan Allah yang akan datang. Pilihan ini tidak menambahkan rumusan janji atau kepastian teologis yang tidak dinyatakan secara eksplisit oleh verba tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti jamak “kalian” dipakai karena objek Ibraninya jamak dan ujaran ditujukan kepada umat Israel. “Berfirman” menandai ujaran ilahi secara wajar tanpa menambah isi teologis. Penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
