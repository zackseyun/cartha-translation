  yaml_path: translation/ot/exodus/003/021.yaml
  text: And I will give this people favor in the sight of the Egyptians[a], and when you go[b], you will not go empty-handed.
translation:
  language: id
  text: Aku akan membuat bangsa ini memperoleh perkenanan di mata orang Mesir[a]. Dan ketika kamu pergi, kamu tidak akan pergi dengan tangan kosong[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di mata orang Mesir”; maksudnya, bangsa ini akan dipandang berkenan oleh mereka.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “kamu tidak akan pergi tanpa membawa apa-apa.” Ungkapan Ibrani ini berarti pergi tanpa barang atau bekal.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Aku akan membuat ... mendapat
  rationale: Secara harfiah berarti 'Aku akan memberikan', tetapi dalam konstruksi dengan חֵן, ungkapan Indonesia 'membuat ... mendapat kemurahan hati' lebih alami dan tetap menegaskan tindakan Allah sebagai penyebabnya.
- source_word: חֵן
  choice: kemurahan hati
  rationale: Dalam konteks sosial ini חֵן menunjuk pada sikap baik atau perkenanan orang Mesir, bukan istilah teologis teknis.
- source_word: הָעָם הַזֶּה
  choice: bangsa ini
  rationale: עָם merupakan kata benda kolektif yang mengacu kepada Israel; 'bangsa ini' alami dalam bahasa Indonesia dan mempertahankan bentuk tunggal kolektif.
- source_word: בְּעֵינֵי מִצְרָיִם
  choice: di mata orang Mesir
  rationale: Mempertahankan idiom Ibrani yang juga lazim dan mudah dipahami dalam bahasa Indonesia, yaitu bagaimana bangsa itu dipandang oleh orang Mesir.
- source_word: וְהָיָה כִּי
  choice: Maka, ketika
  rationale: Mengungkapkan formula wacana Ibrani yang memperkenalkan keadaan pada masa mendatang tanpa mengikuti susunannya secara kaku.
- source_word: תֵלֵכוּן / תֵלְכוּ
  choice: kamu pergi / kamu tidak akan pergi
  rationale: הלך pada dasarnya berarti 'pergi'. Bentuk orang kedua jamak ditujukan kepada umat Israel secara kolektif; bahasa Indonesia tidak menandai jumlah pada pronomina 'kamu'.
- source_word: רֵיקָם
  choice: dengan tangan kosong
  rationale: Ungkapan ini menyampaikan makna idiomatis רֵיקָם, yakni pergi tanpa barang atau bekal, secara jelas dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Aku' dipakai untuk tuturan langsung Allah sesuai konteks; 'kamu' mempertahankan sapaan orang kedua tanpa menambahkan penanda jamak yang tidak diperlukan. Semua penanda catatan kaki dicantumkan dalam teks.
