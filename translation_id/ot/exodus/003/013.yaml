  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל הָֽ/אֱלֹהִ֗ים הִנֵּ֨ה אָנֹכִ֣י בָא֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ וְ/אָמַרְתִּ֣י לָ/הֶ֔ם אֱלֹהֵ֥י אֲבוֹתֵי/כֶ֖ם שְׁלָחַ֣/נִי אֲלֵי/כֶ֑ם וְ/אָֽמְרוּ לִ֣/י מַה שְּׁמ֔/וֹ מָ֥ה אֹמַ֖ר אֲלֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/013.yaml
  text: Then Moses said to God, “Look, when I come to the sons of Israel and say to them, ‘The God of your fathers has sent me to you,’ and they say to me, ‘What is his name?’ what shall I say to them?”
translation:
  language: id
  text: Lalu Musa berkata kepada Allah, “Ketika aku datang kepada orang Israel dan berkata kepada mereka, ‘Allah nenek moyang kalian telah mengutus aku kepada kalian,’ lalu mereka bertanya kepadaku, ‘Siapa nama-Nya?’ apa yang harus kukatakan kepada mereka?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה אָנֹכִי בָא
  choice: Ketika aku datang
  rationale: Dalam konteks ini הִנֵּה memperkenalkan keadaan yang dibayangkan Musa. Bahasa Indonesia alami tidak memerlukan padanan tersendiri seperti ‘lihatlah’; nuansanya terwakili oleh konstruksi situasional ‘ketika aku datang’.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah ‘anak-anak Israel’, tetapi ungkapan Ibrani ini lazim menunjuk bangsa Israel secara kolektif; ‘orang Israel’ jelas dan alami dalam bahasa Indonesia modern.
- source_word: אֱלֹהֵי אֲבוֹתֵיכֶם
  choice: Allah nenek moyangmu
  rationale: אָבוֹת dalam konteks asal-usul bangsa berarti para leluhur. ‘Nenek moyang’ menyampaikan rujukan kolektif itu secara wajar tanpa membatasinya hanya pada ayah biologis.
- source_word: מַה שְּׁמוֹ
  choice: Siapa nama-Nya?
  rationale: Pertanyaan Ibrani secara bentuk memakai ‘apa’, tetapi ungkapan Indonesia yang lazim untuk menanyakan nama pribadi adalah ‘siapa nama-Nya?’ Huruf kapital pada -Nya mengikuti konvensi penghormatan kepada Allah.
- source_word: מָה אֹמַר אֲלֵהֶם
  choice: apa yang harus kukatakan kepada mereka?
  rationale: Bentuk imperfek dalam pertanyaan deliberatif menyatakan tindakan yang patut dilakukan; ‘harus kukatakan’ menangkap fungsi ini secara alami.
theological_decisions:
- issue: Makna pertanyaan tentang nama Allah
  choice: Mempertahankan pertanyaan langsung ‘Siapa nama-Nya?’ tanpa penjelasan tambahan
  alternative: Menafsirkan pertanyaan sebagai permintaan tentang sifat, identitas, atau wewenang Allah
  rationale: Ayat hanya mencatat pertanyaan mengenai nama. Dimensi identitas dan karakter mungkin tersirat, tetapi tidak boleh disisipkan ke dalam teks utama.
- issue: Sebutan אֱלֹהִים
  choice: Allah
  alternative: Tuhan atau ilah
  rationale: Referennya adalah Allah yang berbicara kepada Musa. ‘Allah’ merupakan padanan baku dan tidak memasukkan nama ilahi yang baru dinyatakan pada ayat berikutnya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Dialog dibuat alami sambil mempertahankan pengulangan ‘kepada mereka’ dan alur pertanyaan Musa. Tidak ada catatan kaki karena tidak ada ambiguitas tekstual yang memerlukan penandaan dalam ayat ini.
