revisions:
- from: Musa sedang menggembalakan kawanan ternak Yitro, mertuanya, imam di Midian. Ia menggiring kawanan itu ke seberang padang gurun[a] dan tiba di gunung Allah, yakni Horeb.
  to: Musa sedang menggembalakan kawanan ternak Yitro, ayah mertuanya, imam Midian. Ia menggiring kawanan itu ke seberang padang gurun[a] dan tiba di gunung Allah, yaitu Horeb.
  rationale: Revisi memperjelas bahwa Yitro adalah ayah mertua Musa, memperketat hubungan “imam Midian” sesuai konstruksi Ibrani, dan memperbaiki keluwesan catatan kaki. Makna arah menuju Horeb tetap tercakup dalam “tiba di,” sementara “gunung Allah, yaitu Horeb” mempertahankan Horeb sebagai aposisi tanpa menafsirkan status teologis gunung tersebut.
