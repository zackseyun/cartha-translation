id: EXO.3.1
reference: Exodus 3:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מֹשֶׁ֗ה הָיָ֥ה רֹעֶ֛ה אֶת צֹ֛אן יִתְר֥וֹ חֹתְנ֖/וֹ כֹּהֵ֣ן מִדְיָ֑ן וַ/יִּנְהַ֤ג אֶת הַ/צֹּאן֙ אַחַ֣ר הַ/מִּדְבָּ֔ר וַ/יָּבֹ֛א אֶל הַ֥ר הָ/אֱלֹהִ֖ים חֹרֵֽבָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/001.yaml
  text: Moses was shepherding the flock of Jethro his father-in-law[a], the priest of Midian. He led the flock beyond the wilderness and came to the mountain of God, Horeb.
translation:
  language: id
  text: Musa sedang menggembalakan kawanan ternak Yitro, ayah mertuanya, imam Midian. Ia menggiring kawanan itu ke seberang padang gurun[a] dan tiba di gunung Allah, yaitu Horeb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ke sisi seberang padang gurun.”'
    reason: Alternatif leksikal untuk אַחַר הַמִּדְבָּר; frasa ini dapat menunjuk ke sisi jauh atau seberang padang gurun.
lexical_decisions:
- source_word: וּ/מֹשֶׁה
  choice: Musa
  rationale: Konjungsi וּ membuka adegan naratif baru; dalam bahasa Indonesia modern tidak perlu diterjemahkan dengan kata penghubung tersendiri.
- source_word: הָיָה רֹעֶה
  choice: sedang menggembalakan
  rationale: Konstruksi ini menyatakan tindakan yang sedang berlangsung pada masa lampau; bentuk Indonesia ini mempertahankan aspek tersebut secara alami.
- source_word: צֹאן
  choice: kawanan ternak
  rationale: צֹאן menunjuk secara kolektif pada ternak kecil, biasanya domba dan kambing; pilihan ini tidak mempersempitnya menjadi domba saja.
- source_word: יִתְרוֹ
  choice: Yitro
  rationale: Nama Ibrani ditransliterasikan menurut bentuk yang lazim dan dekat dengan pelafalan sumber.
- source_word: חֹתְנוֹ
  choice: mertuanya
  rationale: Dalam konteks ini istilah tersebut menunjukkan hubungan melalui perkawinan; 'mertua' alami dalam bahasa Indonesia dan tidak perlu mengulang pronomina.
- source_word: כֹּהֵן מִדְיָן
  choice: imam di Midian
  rationale: Frasa konstruksi ini mengidentifikasi kedudukan Yitro sehubungan dengan Midian; 'di Midian' mempertahankan kemungkinan bahwa ia adalah imam yang berkedudukan di sana tanpa memaksakan gagasan bahwa ia satu-satunya imam seluruh Midian.
- source_word: וַיִּנְהַג
  choice: Ia menggiring
  rationale: נהג dalam konteks kawanan ternak lazim berarti menggiring atau menuntun; 'menggiring' paling idiomatis untuk pergerakan kawanan.
- source_word: אַחַר הַמִּדְבָּר
  choice: ke seberang padang gurun
  rationale: אַחַר dalam konteks ruang dapat berarti ke sisi belakang atau seberang; terjemahan ini menyampaikan arah gerak tanpa menentukan arah mata angin.
- source_word: וַיָּבֹא
  choice: tiba
  rationale: Dalam rangkaian perjalanan, verba ini secara alami menandai sampainya Musa di tempat tujuan.
- source_word: הַר הָאֱלֹהִים
  choice: gunung Allah
  rationale: Terjemahan langsung mempertahankan ketegangan apakah sebutan itu bersifat retrospektif, antisipatif, atau sudah dikenal saat itu.
- source_word: חֹרֵבָה
  choice: yakni Horeb
  rationale: Akhiran lokatif menunjukkan gerak menuju Horeb, sementara susunan kalimat menempatkan Horeb sebagai penjelas identitas gunung itu; 'yakni' membuat aposisi tersebut jelas dan alami.
theological_decisions:
- issue: Apakah הַר הָאֱלֹהִים harus ditafsirkan sebagai gunung yang sudah suci pada saat itu atau sebagai sebutan retrospektif
  choice: gunung Allah
  alternative: gunung suci
  rationale: Bentuk langsung 'gunung Allah' tidak menjelaskan lebih jauh status kesuciannya dan dengan demikian mempertahankan ketegangan naratif dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. 'Kawanan ternak' menjaga cakupan domba dan kambing; 'menggiring' dipilih sebagai ungkapan alami dalam konteks penggembalaan. Penanda catatan kaki [a] ditempatkan tepat pada frasa yang memiliki alternatif leksikal.
