language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לֵ֣ךְ וְ/אָֽסַפְתָּ֞ אֶת זִקְנֵ֣י יִשְׂרָאֵ֗ל וְ/אָמַרְתָּ֤ אֲלֵ/הֶם֙ יְהוָ֞ה אֱלֹהֵ֤י אֲבֹֽתֵי/כֶם֙ נִרְאָ֣ה אֵלַ֔/י אֱלֹהֵ֧י אַבְרָהָ֛ם יִצְחָ֥ק וְ/יַעֲקֹ֖ב לֵ/אמֹ֑ר פָּקֹ֤ד פָּקַ֨דְתִּי֙ אֶתְ/כֶ֔ם וְ/אֶת הֶ/עָשׂ֥וּי לָ/כֶ֖ם בְּ/מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/016.yaml
  text: 'Go and gather the elders of Israel[a], and say to them, ‘Yahweh, the God of your fathers—the God of Abraham, Isaac, and Jacob—has appeared to me[b], saying: “I have surely attended to you and to what has been done to you in Egypt.”’'
translation:
  language: id
  text: '“Pergilah, kumpulkanlah para tua-tua Israel, lalu katakan kepada mereka, ‘Yahweh, Allah para leluhurmu[a]—Allah Abraham, Ishak, dan Yakub—telah menampakkan diri kepadaku dan berfirman: “Aku sungguh-sungguh telah memperhatikan kalian dan juga apa yang dilakukan terhadap kalian di Mesir.”’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Allah bapak-bapakmu”; yang dimaksud kemudian disebutkan sebagai Abraham, Ishak, dan Yakub.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ
  choice: Pergilah
  rationale: Bentuk imperatif langsung yang secara alami menyampaikan perintah kepada Musa.
- source_word: וְאָסַפְתָּ אֶת זִקְנֵי יִשְׂרָאֵל
  choice: kumpulkanlah para tua-tua Israel
  rationale: אָסף berarti menghimpun orang, sedangkan זִקְנֵי יִשְׂרָאֵל adalah sebutan bagi para pemimpin tua yang diakui dalam komunitas Israel. Istilah tradisional 'tua-tua' mempertahankan jabatan sosial tersebut tanpa mengubahnya menjadi sekadar orang lanjut usia.
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: lalu katakan kepada mereka
  rationale: Mengalihkan urutan tindakan secara wajar dalam bahasa Indonesia sambil mempertahankan pengantar kepada ucapan langsung.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: Allah para leluhurmu
  rationale: Ungkapan ini menghubungkan Allah Israel dengan garis leluhur mereka. 'Para leluhurmu' alami dalam bahasa Indonesia, sementara catatan kaki mempertahankan informasi bahwa bentuk Ibraninya secara harfiah berarti 'bapak-bapakmu' dan konteks langsung menyebut Abraham, Ishak, dan Yakub.
- source_word: נִרְאָה אֵלַי
  choice: telah menampakkan diri kepadaku
  rationale: Bentuk nifal ראה dalam konteks ini merupakan ungkapan lazim bagi penampakan ilahi; 'menampakkan diri' lebih alami daripada bentuk pasif harfiah.
- source_word: אֱלֹהֵי אַבְרָהָם יִצְחָק וְיַעֲקֹב
  choice: Allah Abraham, Ishak, dan Yakub
  rationale: Mempertahankan identifikasi perjanjian secara lengkap dan apposisional.
- source_word: לֵאמֹר
  choice: dan berfirman
  rationale: Memperkenalkan isi pesan ilahi. 'Berfirman' merupakan verba Indonesia yang wajar dan bermartabat ketika subjek tersiratnya adalah Allah.
- source_word: פָּקֹד פָּקַדְתִּי
  choice: Aku sungguh-sungguh telah memperhatikan kalian
  rationale: Infinitif absolut yang diikuti verba finit menguatkan tindakan. פקד di sini menyatakan perhatian ilahi yang bertujuan dan mengarah pada tindakan, bukan kunjungan sosial semata.
- source_word: וְאֶת הֶעָשׂוּי לָכֶם
  choice: dan apa yang dilakukan terhadap kalian
  rationale: Mempertahankan konstruksi pasif dan tidak menambahkan pelaku yang tidak disebutkan dalam bahasa Ibrani.
- source_word: בְּמִצְרָיִם
  choice: di Mesir
  rationale: Padanan lokasi yang langsung dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama perjanjian YHWH secara langsung; bentuk 'Yahweh' mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Penerjemahan אֲבֹתֵיכֶם
  choice: para leluhurmu, dengan catatan harfiah 'bapak-bapakmu'
  alternative: bapak-bapakmu; nenek moyangmu
  rationale: Bahasa Indonesia alami memakai 'leluhur' untuk garis keturunan. Nuansa patriarkal tidak dihapus, sebab catatan kaki menyatakan bentuk harfiahnya dan teks segera menentukannya sebagai Abraham, Ishak, dan Yakub.
- issue: Nuansa פקד dalam tindakan Allah
  choice: sungguh-sungguh telah memperhatikan
  alternative: benar-benar telah mengunjungi; telah mengindahkan
  rationale: Pilihan ini mempertahankan penegasan gramatikal dan perhatian ilahi yang aktif tanpa mempersempitnya menjadi kunjungan fisik atau menjelaskan secara berlebihan bentuk intervensinya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk jamak 'kalian' dipakai karena sapaan ilahi ditujukan kepada umat Israel secara kolektif. Tanda baca membedakan ucapan Musa dari firman ilahi di dalamnya. Penanda catatan kaki ditempatkan tepat pada ungkapan yang dijelaskan.
