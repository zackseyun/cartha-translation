  text: וַ/יֹּ֗אמֶר אָנֹכִי֙ אֱלֹהֵ֣י אָבִ֔י/ךָ אֱלֹהֵ֧י אַבְרָהָ֛ם אֱלֹהֵ֥י יִצְחָ֖ק וֵ/אלֹהֵ֣י יַעֲקֹ֑ב וַ/יַּסְתֵּ֤ר מֹשֶׁה֙ פָּנָ֔י/ו כִּ֣י יָרֵ֔א מֵ/הַבִּ֖יט אֶל הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/003/006.yaml
  text: Then he said, “I am the God of your father, the God of Abraham, the God of Isaac, and the God of Jacob.” And Moses hid his face, because he was afraid to look at God.
translation:
  language: id
  text: Lalu Dia berfirman, “Akulah Allah ayahmu, Allah Abraham, Allah Ishak, dan Allah Yakub.” Musa pun menutupi wajahnya karena ia takut memandang Allah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu Dia berfirman
  rationale: Waw-konsekutif melanjutkan urutan cerita. “Lalu” menyatakan urutan secara alami, sedangkan “berfirman” merupakan verba Indonesia yang wajar dan bermartabat untuk tuturan Allah.
- source_word: אָנֹכִי
  choice: Akulah
  rationale: Pronomina mandiri ini bersifat tegas. “Akulah” mempertahankan penekanan identifikasi dalam klausa tanpa verba.
- source_word: אֱלֹהֵי אָבִיךָ
  choice: Allah ayahmu
  rationale: Frasa konstruksi dan sufiks tunggal dipertahankan secara langsung; teks menyebut “ayahmu,” bukan bentuk jamak “nenek moyangmu.”
- source_word: אֱלֹהֵי אַבְרָהָם אֱלֹהֵי יִצְחָק וֵאלֹהֵי יַעֲקֹב
  choice: Allah Abraham, Allah Ishak, dan Allah Yakub
  rationale: Pengulangan אֱלֹהֵי dipertahankan karena memberi bobot retoris dan perjanjian; tidak diringkas menjadi “Allah Abraham, Ishak, dan Yakub.”
- source_word: וַיַּסְתֵּר
  choice: menyembunyikan
  rationale: Bentuk Hifil menyatakan tindakan menyembunyikan atau menutupi; “menyembunyikan wajahnya” alami dalam konteks Musa menghindari pandangan.
- source_word: פָּנָיו
  choice: wajahnya
  rationale: Makna harfiahnya cocok dengan tindakan jasmani Musa dalam peristiwa penampakan ilahi ini.
- source_word: כִּי יָרֵא
  choice: karena ia takut
  rationale: “Karena” mempertahankan fungsi kausal כִּי, dan “takut” menyampaikan keadaan yang dinyatakan יָרֵא.
- source_word: מֵהַבִּיט
  choice: memandang
  rationale: Sesudah verba takut, infinitif dengan מן menyatakan tindakan yang ditakuti. “Takut memandang” merupakan susunan Indonesia yang alami dan mempertahankan nuansa melihat dengan sengaja.
- source_word: אֶל הָאֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini referennya ialah Allah yang mengidentifikasikan diri sebagai Allah para leluhur; objek verba “memandang” tidak memerlukan padanan preposisi terpisah dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan אֱלֹהִים dalam identifikasi diri dan penampakan ilahi
  choice: Allah
  alternative: Sang ilahi
  rationale: Konteks secara eksplisit menunjuk kepada Allah para leluhur yang berbicara kepada Musa. “Allah” mempertahankan identifikasi personal dan perjanjian tanpa menambahkan rumusan doktrinal di luar teks.
- issue: Pengulangan rumus para leluhur
  choice: Allah Abraham, Allah Ishak, dan Allah Yakub
  alternative: Allah Abraham, Ishak, dan Yakub
  rationale: Mengulang “Allah” mengikuti struktur Ibrani serta mempertahankan tekanan retoris dan teologisnya.
- issue: Referen tunggal אָבִיךָ
  choice: ayahmu
  alternative: nenek moyangmu
  rationale: Bentuk Ibrani bertanda tunggal. Terjemahan tidak menentukan secara diam-diam apakah yang dimaksud ialah ayah biologis Musa atau leluhur tertentu, tetapi mempertahankan bentuk sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang bermartabat. Kapitalisasi pronomina “Dia” dipakai menurut kebiasaan Indonesia bagi rujukan kepada Allah. Pengulangan “Allah” sengaja dipertahankan, sementara struktur kalimat dibuat alami bagi pembaca umum.
