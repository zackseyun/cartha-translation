  yaml_path: translation/ot/exodus/004/026.yaml
  text: So he let him alone[a]. Then she said[b], “A bridegroom of blood,” because of the circumcision.
translation:
  language: id
  text: Maka ia membiarkannya.[a] Kemudian perempuan itu berkata, “Pengantin laki-laki berdarah,”[b] karena penyunatan itu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Konteks paling wajar menunjukkan bahwa TUHAN berhenti menyerang Musa. Namun, teks Ibrani ayat ini sendiri hanya berbunyi “ia membiarkannya” atau “ia menarik diri darinya.”
    reason: referential_ambiguity
  - marker: b
    text: Secara harfiah, “pengantin laki-laki berdarah,” sebuah ungkapan sulit yang mungkin merupakan seruan yang berkaitan dengan upacara penyunatan. Tidak jelas apakah ucapan ini ditujukan kepada Musa atau kepada anak itu.
    reason: lexical_alternative
  - marker: c
    text: 'Bahasa Ibrani memakai bentuk jamak: “karena penyunatan-penyunatan” atau “karena upacara-upacara sunat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרֶף מִמֶּנּוּ
  choice: Lalu ia membiarkannya
  rationale: Bentuk dari רפה dengan מִן menyatakan bahwa tindakan bermusuhan itu dihentikan. Ungkapan ini alami dalam bahasa Indonesia sekaligus mempertahankan pronomina sumber yang referennya ditentukan oleh konteks.
- source_word: אָז
  choice: Pada waktu itu
  rationale: Adverbia temporal ini menandai keadaan atau saat sesudah serangan berhenti; pilihan ini lebih tepat daripada menyiratkan akibat logis yang kuat.
- source_word: אָמְרָה
  choice: perempuan itu berkata
  rationale: Bentuk feminin menunjukkan bahwa penuturnya ialah perempuan, yakni Zipora dalam konteks sebelumnya. Penyebutan ini tetap sederhana dan tidak meninggikan makna verba אמר.
- source_word: חֲתַן דָּמִים
  choice: pengantin laki-laki berdarah
  rationale: Terjemahan ini mempertahankan susunan ungkapan Ibrani yang singkat dan sulit tanpa menetapkan apakah frasa itu menyatakan kejijikan, sebutan ritual, atau nuansa lain.
- source_word: לַמּוּלֹת
  choice: karena penyunatan itu
  rationale: Konteks mengaitkan ucapan Zipora dengan tindakan penyunatan yang baru dilakukan. Bentuk tunggal idiomatis dalam bahasa Indonesia dipakai dalam teks utama, sedangkan bentuk jamak Ibraninya dicatat dalam catatan kaki.
theological_decisions:
- issue: Referen pronomina dalam וַיִּרֶף מִמֶּנּוּ
  choice: Pronomina dipertahankan dalam teks utama; konteks paling wajar menunjuk kepada TUHAN sebagai pelaku dan Musa sebagai orang yang tidak lagi diserang.
  alternative: Mengeksplisitkan terjemahan menjadi “Lalu TUHAN berhenti menyerang Musa.”
  rationale: Ayat 24 menyebut TUHAN sebagai penyerang, tetapi teks ayat 26 sendiri hanya memakai pronomina. Mempertahankan pronomina menghindari penjelasan berlebihan sambil memberi keterangan kontekstual dalam catatan kaki.
- issue: Makna חֲתַן דָּמִים
  choice: Ungkapan harfiah “pengantin laki-laki berdarah” dipertahankan.
  alternative: Menafsirkannya sebagai seruan kejijikan, gelar ritual karena penyunatan, atau sebutan yang secara khusus ditujukan kepada Musa maupun anak itu.
  rationale: Daya emosional, fungsi budaya, dan orang yang disapa oleh ungkapan ini tidak sepenuhnya jelas. Terjemahan tidak boleh menyelesaikan ketegangan yang memang ada dalam sumber.
- issue: Bentuk jamak לַמּוּלֹת
  choice: Teks utama memakai “penyunatan itu,” dengan bentuk jamak sumber dijelaskan dalam catatan kaki.
  alternative: Menerjemahkan secara formal sebagai “karena penyunatan-penyunatan itu” atau “berkenaan dengan upacara-upacara sunat.”
  rationale: Bentuk jamak Ibrani langka dan dapat merujuk pada tindakan atau tata cara penyunatan. Bentuk tunggal lebih wajar dalam bahasa Indonesia untuk peristiwa yang baru diceritakan, tanpa menyembunyikan data bentuk sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan alur naratif sederhana. Ungkapan budaya yang sengaja samar dipertahankan secara cukup harfiah, sementara ketidakjelasan referen dan bentuk jamak yang langka dijelaskan melalui catatan kaki.
