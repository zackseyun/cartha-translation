  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁה֒ בְּ/לֶכְתְּ/ךָ֙ לָ/שׁ֣וּב מִצְרַ֔יְמָ/ה רְאֵ֗ה כָּל הַ/מֹּֽפְתִים֙ אֲשֶׁר שַׂ֣מְתִּי בְ/יָדֶ֔/ךָ וַ/עֲשִׂיתָ֖/ם לִ/פְנֵ֣י פַרְעֹ֑ה וַ/אֲנִי֙ אֲחַזֵּ֣ק אֶת לִבּ֔/וֹ וְ/לֹ֥א יְשַׁלַּ֖ח אֶת הָ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/021.yaml
  text: Then Yahweh said to Moses[a], “When you go back to Egypt, see that you do before Pharaoh all the wonders that I have put in your hand. But I will harden his heart[b], and he will not let the people go.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa, “Ketika engkau kembali ke Mesir, pastikanlah bahwa engkau melakukan di hadapan Firaun semua perbuatan ajaib[a] yang telah Kutaruh di tanganmu. Namun, Aku akan mengeraskan hatinya[b], dan ia tidak akan membiarkan bangsa itu pergi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semua tanda” atau “semua mukjizat.” Kata Ibrani ini menunjuk pada tindakan luar biasa yang memperlihatkan kuasa ilahi.
    reason: lexical_alternative
  - marker: b
    text: Atau “menguatkan hatinya” atau “membuat hatinya teguh.” Verba Ibrani ini dapat mengandung arti menguatkan atau membuat teguh; di sini, Firaun diteguhkan dalam penolakannya yang keras kepala.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, alih-alih menggantinya dengan sebuah gelar.
- source_word: בְּלֶכְתְּךָ לָשׁוּב מִצְרַיְמָה
  choice: Ketika engkau kembali ke Mesir
  rationale: Konstruksi infinitif diterjemahkan sebagai anak kalimat waktu yang alami; akhiran penunjuk arah pada nama Mesir dinyatakan dengan kata depan ‘ke’.
- source_word: רְאֵה
  choice: pastikanlah
  rationale: Dalam konteks ini, imperatif ‘lihatlah’ berfungsi sebagai perintah agar Musa memberi perhatian sungguh-sungguh dan melaksanakan tindakan berikutnya.
- source_word: הַמֹּפְתִים
  choice: perbuatan ajaib
  rationale: Istilah ini menunjuk pada tindakan luar biasa yang memperlihatkan kuasa ilahi dan dapat pula berfungsi sebagai tanda; ‘perbuatan ajaib’ terdengar alami dalam bahasa Indonesia.
- source_word: שַׂמְתִּי בְיָדֶךָ
  choice: yang telah Kutaruh di tanganmu
  rationale: Mempertahankan gambaran konkret Ibrani tentang sesuatu yang ditaruh dalam tangan Musa, dengan makna bahwa tindakan-tindakan itu dipercayakan dan dimampukan kepadanya.
- source_word: וַעֲשִׂיתָם לִפְנֵי פַרְעֹה
  choice: engkau melakukan di hadapan Firaun
  rationale: ‘Melakukan’ langsung mewakili verba עשה, sedangkan ‘di hadapan’ mempertahankan makna tindakan dalam kehadiran Firaun.
- source_word: וַאֲנִי
  choice: Namun, Aku
  rationale: Walaupun konjungsinya secara harfiah berarti ‘dan’, konteks menandai peralihan yang kontras dari tindakan Musa kepada tindakan Yahweh.
- source_word: אֲחַזֵּק אֶת לִבּוֹ
  choice: Aku akan mengeraskan hatinya
  rationale: Dalam kisah Firaun, bentuk kausatif dari חזק menggambarkan Allah membuat hati Firaun teguh dalam penolakannya. Ungkapan lazim ‘mengeraskan hati’ mempertahankan daya teologis teks.
- source_word: וְלֹא יְשַׁלַּח אֶת הָעָם
  choice: dan ia tidak akan membiarkan bangsa itu pergi
  rationale: Dalam konteks keluaran dari Mesir, שׁלח berarti mengizinkan atau melepaskan bangsa itu untuk pergi; bentuk ini alami dan tepat dalam bahasa Indonesia.
theological_decisions:
- issue: Tindakan ilahi terhadap hati Firaun
  choice: Aku akan mengeraskan hatinya
  alternative: Aku akan menguatkan hatinya; Aku akan membuat hatinya teguh
  rationale: Verba חזק dapat berarti ‘menguatkan’ atau ‘membuat teguh’, tetapi dalam alur kisah ini keteguhan tersebut tampil sebagai penolakan Firaun. Terjemahan utama mempertahankan ketegangan antara tindakan Allah dan tanggung jawab Firaun tanpa mencoba menyelesaikannya melalui parafrasa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan jelas. Pronomina ‘engkau’ dipakai untuk sapaan tunggal kepada Musa, dan bentuk terikat ‘Ku-’ serta ‘Aku’ dikapitalisasi karena merujuk kepada Yahweh. Citra ‘di tanganmu’ dan ungkapan ‘mengeraskan hatinya’ dipertahankan untuk menjaga bentuk serta ketegangan teks Ibrani.
