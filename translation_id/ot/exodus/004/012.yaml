  text: Now go[a], and I will be with your mouth and teach you what you shall speak.
translation:
  language: id
  text: Sekarang, pergilah. Aku akan menyertai mulutmu[a] dan mengajarimu apa yang harus kaukatakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Aku akan ada bersama mulutmu.”
    reason: Ungkapan Ibrani memakai formula kehadiran “ada bersama” dan nomina konkret “mulut”; teks utama memakai “menyertai” agar alami sambil mempertahankan “mulutmu”.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Jadi sekarang
  rationale: Penanda wacana sekaligus waktu ini menghubungkan perintah dengan jawaban TUHAN terhadap keberatan Musa; “Jadi sekarang” alami dalam bahasa Indonesia dan mempertahankan dorongan menuju tindakan berikutnya.
- source_word: לֵךְ
  choice: pergilah
  rationale: Imperatif Qal dari הלך diterjemahkan sebagai perintah langsung dan wajar dalam bahasa Indonesia.
- source_word: וְאָנֹכִי אֶהְיֶה
  choice: Aku akan menyertai
  rationale: Dalam konstruksi dengan עִם, ungkapan ini menyatakan kehadiran yang menyertai. Pronomina mandiri אָנֹכִי memberi penekanan pada Allah sendiri; kapitalisasi “Aku” menandai pembicara ilahi tanpa menambahkan gelar.
- source_word: עִם פִּיךָ
  choice: mulutmu
  rationale: Terjemahan konkret “mulutmu” mempertahankan citra Ibrani dan kaitannya dengan keberatan Musa mengenai kemampuan berbicara, alih-alih menjelaskannya menjadi sekadar “membantumu berbicara”.
- source_word: וְהוֹרֵיתִיךָ
  choice: dan mengajarimu
  rationale: Bentuk Hifil dari ירה di sini berarti mengajar atau memberi petunjuk. “Mengajarimu” jelas dan cocok dengan klausa isi yang menyusul.
- source_word: אֲשֶׁר תְּדַבֵּר
  choice: apa yang harus kaukatakan
  rationale: Klausa relatif ini menyatakan isi pengajaran ilahi dan tindakan bicara yang ditugaskan kepada Musa. “Harus kaukatakan” mempertahankan nuansa kewajiban, sedangkan “katakan” merupakan padanan Indonesia yang paling alami untuk tindakan berbicara dalam konteks ini.
theological_decisions:
- issue: Formula kehadiran ilahi dalam pengutusan
  choice: Aku akan menyertai mulutmu
  alternative: Aku akan membantumu berbicara
  rationale: 'Pilihan ini mempertahankan gambaran konkret dan agak tidak lazim dari teks sumber: Allah sendiri hadir menyertai mulut Musa. Terjemahan tidak mereduksinya menjadi penjelasan fungsional semata.'
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. Bentuk “pergilah” menyampaikan imperatif langsung; “kaukatakan” menjaga kelancaran tanpa mengurangi keseriusan ujaran ilahi. Penanda kaki [a] ditempatkan tepat pada ungkapan yang dijelaskan.
