  yaml_path: translation/ot/exodus/004/017.yaml
  text: And take this staff in your hand[b][a], with which you will perform the signs.
translation:
  language: id
  text: Bawalah tongkat[a] ini di tanganmu; dengan tongkat itu engkau akan melakukan tanda-tanda[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani dapat berarti “tongkat” atau “batang”; konteks Musa sebagai gembala mendukung terjemahan “tongkat.”
    reason: lexical_alternative
  - marker: b
    text: Atau “tanda-tanda ajaib.” Teks Ibrani hanya mengatakan “tanda-tanda”; sifat ajaibnya dipahami dari konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת
  choice: Bawalah
  rationale: Konjungsi וְ menghubungkan perintah ini dengan petunjuk sebelumnya, sedangkan penanda objek אֶת tidak diterjemahkan tersendiri. Dalam bahasa Indonesia, hubungan itu dapat tersirat secara alami dalam kelanjutan perintah.
- source_word: הַמַּטֶּה
  choice: tongkat
  rationale: מַטֶּה dapat menunjuk pada tongkat atau batang. 'Tongkat' paling sesuai dengan konteks Musa sebagai gembala dan merupakan padanan Indonesia yang wajar.
- source_word: הַזֶּה
  choice: ini
  rationale: Kata penunjuk ini mengacu pada tongkat tertentu yang telah disebutkan dalam konteks sebelumnya.
- source_word: תִּקַּח
  choice: Bawalah
  rationale: Bentuk imperfek Qal orang kedua tunggal maskulin berfungsi sebagai perintah. 'Bawalah' secara alami menyatakan bahwa Musa harus mengambil sekaligus membawa tongkat itu.
- source_word: בְּיָדֶךָ
  choice: di tanganmu
  rationale: Ini merupakan terjemahan langsung dan idiomatis dari frasa preposisional Ibrani.
- source_word: אֲשֶׁר ... בּוֹ
  choice: dengan tongkat itu
  rationale: Konstruksi relatif dan preposisi בּוֹ menyatakan alat yang digunakan. Pengulangan 'tongkat itu' lebih jelas dan alami dalam bahasa Indonesia daripada konstruksi kaku 'yang dengannya'.
- source_word: תַּעֲשֶׂה
  choice: engkau akan melakukan
  rationale: עָשָׂה pada dasarnya berarti 'melakukan' atau 'membuat'; bersama 'tanda-tanda', 'melakukan' menyampaikan tindakan yang akan dikerjakan tanpa menambah unsur yang tidak dinyatakan.
- source_word: הָאֹתֹת
  choice: tanda-tanda
  rationale: אוֹת berarti tanda, sering kali berupa tanda pengukuhan yang menakjubkan. Terjemahan 'tanda-tanda' mempertahankan ungkapan teks dan tidak menambahkan kata 'ajaib' ke dalam teks utama.
