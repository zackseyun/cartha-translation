translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'engkau' dipakai untuk sapaan tunggal dalam konteks ilahi kepada Musa. Kalimat dibagi dengan titik koma agar hubungan instrumental tetap jelas tanpa memakai konstruksi relatif yang kaku.
