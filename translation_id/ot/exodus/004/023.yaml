  to: Aku berkata kepadamu, ‘Biarkan anak-Ku pergi supaya ia beribadah kepada-Ku,’ tetapi engkau menolak membiarkannya pergi. Lihatlah, Aku akan membunuh anakmu, anak sulungmu.
