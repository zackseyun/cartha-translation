    issue: '"Suruhlah anak-Ku pergi" tidak tepat untuk שַׁלַּח dalam konteks ini.'
    rationale: Ungkapan tersebut dapat berarti memerintahkan anak itu pergi. Ibraninya menuntut Firaun melepaskan atau mengizinkan Israel—"anak-Ku"—pergi dari penahanan/perbudakan.
  - severity: low
    issue: '"Aku telah berkata" menambahkan nuansa lampau-sempurna.'
    rationale: וָאֹמַר paling langsung diterjemahkan "Aku berkata" dalam rangkaian ujaran ini; bentuk "telah" tidak diperlukan oleh teks sumber.
  revised_text: Aku berkata kepadamu, ‘Biarkan anak-Ku pergi supaya ia beribadah kepada-Ku,’ tetapi engkau menolak membiarkannya pergi. Lihatlah, Aku akan membunuh anakmu, anak sulungmu.
