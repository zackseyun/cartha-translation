base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/023.yaml
  text: And I said to you, ‘Send out my son so that he may serve me,’ but you refused to send him out. Look, I am about to kill your son, your firstborn.
translation:
  language: id
  text: Aku berkata kepadamu, ‘Biarkan anak-Ku pergi supaya ia beribadah kepada-Ku,’ tetapi engkau menolak membiarkannya pergi. Lihatlah, Aku akan membunuh anakmu, anak sulungmu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלַּח
  choice: suruhlah ... pergi
  rationale: Bentuk piel imperatif dari שׁלח dalam konteks tuntutan kepada Firaun berarti menyuruh atau membiarkan pihak yang ditahan pergi; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya tuntutannya.
- source_word: וְיַעַבְדֵנִי
  choice: supaya ia beribadah kepada-Ku
  rationale: עבד dengan Allah sebagai objek dalam konteks keluaran menunjuk pada pelayanan yang bersifat ibadah; 'beribadah kepada-Ku' menyampaikan maksud religius secara jelas.
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Mempertahankan penanda wacana yang menarik perhatian dan menegaskan ancaman yang segera menyusul.
- source_word: הֹרֵג
  choice: akan membunuh
  rationale: Partisip Ibrani sesudah אָנֹכִי mengungkapkan tindakan yang akan atau segera dilakukan; 'akan membunuh' mempertahankan ancaman langsung tanpa menambahkan penanda waktu yang tidak eksplisit.
- source_word: בְּכֹרֶךָ
  choice: anak sulungmu
  rationale: בכור dalam konstruksi dengan sufiks orang kedua tunggal maskulin merujuk pada putra sulung Firaun, sebagai padanan langsung bagi Israel yang disebut anak sulung Allah pada ayat sebelumnya.
theological_decisions:
- issue: Makna 'anak-Ku' dan 'anakmu'
  choice: Mempertahankan bahasa hubungan anak secara harfiah
  alternative: Mengganti dengan 'umat-Ku' atau menjelaskan bahwa yang dimaksud adalah Israel
  rationale: Teks sengaja membangun kesejajaran teologis antara Israel sebagai anak Allah dan anak sulung Firaun; penjelasan tambahan akan mengurangi daya retorisnya.
- issue: Kepastian ancaman ilahi
  choice: Aku akan membunuh
  alternative: Aku hendak membunuh / Aku segera membunuh
  rationale: Partisip הֹרֵג dapat membawa nuansa tindakan yang segera atau sudah ditetapkan. Bentuk futur Indonesia menyatakan ancaman pasti tanpa menentukan lebih jauh aspek waktunya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Kapital pada kata ganti yang merujuk kepada Allah mengikuti konvensi penerbitan Alkitab bahasa Indonesia; 'engkau' menjaga bentuk tunggal dan nada konfrontasi langsung kepada Firaun.
