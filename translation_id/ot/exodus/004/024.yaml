id: EXO.4.24
reference: Exodus 4:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֥י בַ/דֶּ֖רֶךְ בַּ/מָּל֑וֹן וַ/יִּפְגְּשֵׁ֣/הוּ יְהוָ֔ה וַ/יְבַקֵּ֖שׁ הֲמִיתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/024.yaml
  text: And it happened on the way[a], at the lodging place[b], that Yahweh met him and sought to put him to death.
translation:
  language: id
  text: Dalam perjalanan itu, di tempat bermalam[b], Yahweh menjumpainya[a] dan berupaya membunuhnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani tidak menyebutkan secara eksplisit siapa yang dimaksud dengan “-nya”; kata itu mungkin merujuk kepada Musa atau, menurut sebagian penafsiran, kepada anaknya.
    reason: alternative_reading
  - marker: b
    text: Atau “di tempat perkemahan malam”; kata Ibrani ini menunjuk pada tempat untuk bermalam, bukan selalu penginapan komersial.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Dalam perjalanan itu
  rationale: Bentuk naratif וַיְהִי membuka peristiwa baru. Dalam bahasa Indonesia, fungsi tersebut disampaikan secara alami melalui pembukaan adegan tanpa ungkapan arkais seperti 'maka terjadilah'.
- source_word: בַדֶּרֶךְ
  choice: dalam perjalanan itu
  rationale: Frasa ini menyatakan lokasi atau keadaan selama perjalanan; 'dalam perjalanan itu' alami dan dekat dengan makna Ibrani.
- source_word: בַמָּלוֹן
  choice: di tempat bermalam
  rationale: מָלוֹן menunjuk pada tempat untuk bermalam dan tidak harus berarti penginapan komersial.
- source_word: וַיִּפְגְּשֵׁהוּ
  choice: menjumpainya
  rationale: פגע pada dasarnya berarti bertemu atau menjumpai. Pilihan ini mempertahankan makna leksikal, sementara maksud yang mengancam dinyatakan oleh klausa berikutnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: וַיְבַקֵּשׁ
  choice: berupaya
  rationale: בקש berarti mencari atau berusaha mencapai sesuatu. 'Berupaya' mempertahankan daya verbal dan ketegangan naratif tanpa sekadar mengubahnya menjadi pernyataan niat.
- source_word: הֲמִיתוֹ
  choice: membunuhnya
  rationale: Bentuk kausatif dari מות dengan sufiks orang ketiga maskulin tunggal berarti menyebabkan dia mati; 'membunuhnya' jelas, wajar, dan langsung dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks menggunakan nama ilahi secara langsung; 'Yahweh' mempertahankannya sebagai nama pribadi, bukan menggantinya dengan gelar.
- issue: Acuan sufiks pronominal maskulin tunggal ('-nya')
  choice: Mempertahankan ambiguitas dengan '-nya'
  alternative: Musa atau anak Musa
  rationale: Ayat Ibrani tidak menyebutkan secara eksplisit siapa yang dijumpai dan hendak dibunuh. Menambahkan nama akan menyelesaikan ambiguitas yang dibiarkan terbuka oleh teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Struktur dibuat ringkas agar alami, sementara ambiguitas penting pada pronomina tetap dipertahankan.
