base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/013.yaml
  text: But he said[a], “Please, my Lord, send by the hand of whomever you will send.”
translation:
  language: id
  text: Namun Musa berkata[a], “Mohon, ya Tuhanku, utuslah dengan perantaraan siapa pun yang hendak Kauutus.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan mengungkapkan maksudnya secara lebih langsung, “Mohon, ya Tuhanku, utuslah orang lain.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Namun Musa berkata
  rationale: Bentuk wayyiqtol meneruskan narasi, tetapi konteks menunjukkan perlawanan Musa setelah jawaban-jawaban Allah; “Namun” menyampaikan daya adversatif itu. Nama Musa ditambahkan sebagai subjek tersirat agar wajar dan jelas dalam bahasa Indonesia.
- source_word: בִּי
  choice: Mohon
  rationale: Dalam ungkapan ini, בִּי merupakan permohonan sopan sebelum sapaan hormat, bukan berarti harfiah “di dalam aku.” “Mohon” terdengar alami dan menjaga nada takzim.
- source_word: אֲדֹנָי
  choice: ya Tuhanku
  rationale: Kata ini merupakan sapaan hormat kepada Allah dengan sufiks orang pertama tunggal. “Ya Tuhanku” mempertahankan unsur sapaan dan kepunyaan, serta tidak menyamakannya dengan nama ilahi יהוה.
- source_word: שְׁלַח־נָא
  choice: utuslah
  rationale: Imperatif שׁלח yang diperhalus oleh partikel permohonan נָא. Akhiran “-lah” memberi nuansa permintaan yang sopan; unsur kesopanan juga telah dinyatakan oleh “Mohon.”
- source_word: בְּיַד
  choice: dengan perantaraan
  rationale: Secara harfiah berarti “dengan tangan,” tetapi dalam konteks ini menyatakan pelaku atau sarana. “Dengan perantaraan” mempertahankan fungsi idiom itu dalam bahasa Indonesia yang jelas dan bermartabat.
- source_word: תִּשְׁלָח
  choice: yang hendak Kauutus
  rationale: Bentuk imperfek dalam konstruksi yang menyerupai klausa relatif tetap dibuat agak terbuka. “Hendak Kauutus” mempertahankan acuan kepada orang yang Allah akan atau bermaksud utus tanpa memasukkan kata “orang lain” ke dalam teks utama.
theological_decisions:
- issue: Makna permintaan Musa yang mengelak
  choice: 'Mempertahankan ketaksaan Ibrani: Musa meminta Allah mengutus dengan perantaraan siapa pun yang hendak Dia utus.'
  alternative: “Mohon, ya Tuhanku, utuslah orang lain.”
  rationale: Dalam konteksnya, ucapan itu mengungkapkan keengganan Musa, tetapi teks Ibrani tidak secara eksplisit mengatakan “orang lain.” Teks utama mempertahankan ketegangan dan ungkapan yang mengelak, sedangkan arti kontekstual yang lebih interpretatif dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Mohon, ya Tuhanku” menjaga nada hormat, sedangkan “siapa pun yang hendak Kauutus” sengaja mempertahankan ketaksaan dan keengganan halus dalam ungkapan Ibrani.
