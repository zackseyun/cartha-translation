  source_fidelity: 'Teks Indonesia dengan tepat mencerminkan unsur-unsur utama Ibrani: daya adversatif kontekstual pada וַיֹּאמֶר, permohonan sopan ganda בִּי dan נָא, sapaan personal אֲדֹנָי, serta pengulangan akar שׁלח. Frasa “dengan perantaraan siapa pun yang hendak Kauutus” mempertahankan sifat tidak langsung dan ambiguitas konstruksi בְּיַד תִּשְׁלָח tanpa memasukkan “orang lain” ke dalam teks utama.'
