reference: Exodus 4:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לְמַ֣עַן יַאֲמִ֔ינוּ כִּֽי נִרְאָ֥ה אֵלֶ֛י/ךָ יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתָ֑/ם אֱלֹהֵ֧י אַבְרָהָ֛ם אֱלֹהֵ֥י יִצְחָ֖ק וֵ/אלֹהֵ֥י יַעֲקֹֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/005.yaml
  text: so that they may believe that Yahweh[a], the God of their fathers, the God of Abraham, the God of Isaac, and the God of Jacob[b], has appeared to you.
translation:
  language: id
  text: supaya mereka percaya bahwa Yahweh[a], Allah para leluhur mereka[b], Allah Abraham, Allah Ishak, dan Allah Yakub, telah menampakkan diri kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “YHWH”; secara tradisional diterjemahkan “TUHAN.” Nama ini juga ditransliterasikan “Yehova.”'
    reason: alternative_reading
  - marker: b
    text: 'Secara lebih harfiah: “Allah bapak-bapak mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: supaya
  rationale: Menandai tujuan dari tanda-tanda yang diberikan; “supaya” alami dalam bahasa Indonesia dan mempertahankan daya purposif klausa.
- source_word: יַאֲמִינוּ
  choice: mereka percaya
  rationale: Bentuk Hifil dari אמן dalam konteks ini menunjuk pada menerima sebagai benar berita bahwa Allah telah menampakkan diri kepada Musa.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi yang harus dipercayai, bukan alasan sebab-akibat.
- source_word: נִרְאָה
  choice: telah menampakkan diri
  rationale: Bentuk Nifal dari ראה lazim berarti “tampak/menampakkan diri”; bentuk ini menyampaikan penampakan ilahi yang sudah terjadi dan tetap relevan bagi pengutusan Musa.
- source_word: אֵלֶיךָ
  choice: kepadamu
  rationale: Padanan langsung dan idiomatis untuk preposisi אֶל dengan sufiks orang kedua tunggal maskulin.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH sebagai nama pribadi, alih-alih menggantinya dengan gelar; catatan kaki menyebutkan tradisi dan alternatif utama.
- source_word: אֱלֹהֵי אֲבֹתָם
  choice: Allah para leluhur mereka
  rationale: “Para leluhur” merupakan ungkapan Indonesia modern yang alami untuk garis keturunan terdahulu. Makna harfiah unsur maskulin אבות (“bapak-bapak”) dipertahankan dalam catatan kaki.
- source_word: אֱלֹהֵי אַבְרָהָם אֱלֹהֵי יִצְחָק וֵאלֹהֵי יַעֲקֹב
  choice: Allah Abraham, Allah Ishak, dan Allah Yakub
  rationale: Pengulangan “Allah” di depan setiap nama dipertahankan untuk mencerminkan penekanan dan irama khidmat teks Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian sebagai nama pribadi, sementara bentuk tradisional dan alternatif dicatat tanpa mengaburkan bentuk sumber.
- issue: Istilah leluhur אֲבֹתָם yang berbentuk maskulin
  choice: para leluhur mereka
  alternative: bapak-bapak mereka
  rationale: Dalam bahasa Indonesia, “para leluhur mereka” adalah ungkapan alami bagi garis leluhur yang kemudian diperinci sebagai Abraham, Ishak, dan Yakub. Catatan kaki mempertahankan informasi bahwa bahasa Ibraninya secara lebih harfiah berbunyi “bapak-bapak mereka,” sehingga ciri teks sumber tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. Susunan pengulangan “Allah Abraham, Allah Ishak, dan Allah Yakub” dipertahankan untuk mengikuti irama sumber. Ayat diawali huruf kecil karena klausa tujuan ini melanjutkan perkataan dari ayat sebelumnya.
