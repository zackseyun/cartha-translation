  text: וַ/יֹּ֨אמֶר מֹשֶׁ֣ה אֶל יְהוָה֮ בִּ֣י אֲדֹנָ/י֒ לֹא֩ אִ֨ישׁ דְּבָרִ֜ים אָנֹ֗כִי גַּ֤ם מִ/תְּמוֹל֙ גַּ֣ם מִ/שִּׁלְשֹׁ֔ם גַּ֛ם מֵ/אָ֥ז דַּבֶּרְ/ךָ אֶל עַבְדֶּ֑/ךָ כִּ֧י כְבַד פֶּ֛ה וּ/כְבַ֥ד לָשׁ֖וֹן אָנֹֽכִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/010.yaml
  text: Then Moses said to Yahweh[a], “Please, Lord, I am not a man of words, neither yesterday nor the day before, nor since you have spoken to your servant[b]; for I am heavy of mouth and heavy of tongue.”
translation:
  language: id
  text: Lalu Musa berkata kepada Yahweh, “Mohon, Tuhan, aku bukan orang yang pandai berbicara,[a] tidak kemarin, tidak pula sehari sebelumnya, dan juga tidak sejak Engkau berbicara kepada hamba-Mu ini. Sebab mulutku berat dan lidahku berat.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “aku bukan orang perkataan.” Maksudnya, Musa mengaku tidak cakap atau tidak fasih berbicara.'
    reason: lexical_alternative
  - marker: b
    text: “Mulutku berat dan lidahku berat” adalah metafora bagi kesulitan berbicara. Ungkapan ini tidak menjelaskan apakah yang dimaksud ialah kurang fasih atau suatu gangguan bicara.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan membedakannya dari gelar אֲדֹנָי yang muncul sesudahnya.
- source_word: בִּי אֲדֹנָי
  choice: Ah, Tuan
  rationale: בִּי merupakan seruan permohonan yang sopan; “Ah” alami dalam keluhan Musa, sedangkan “Tuan” mempertahankan sapaan penghormatan dan membedakannya dari nama Yahweh.
- source_word: לֹא אִישׁ דְּבָרִים אָנֹכִי
  choice: aku bukan orang yang pandai berbicara
  rationale: Ungkapan harfiah “bukan orang perkataan” mengacu pada kecakapan berbicara. Rumusan ini alami dalam bahasa Indonesia, sementara bentuk Ibraninya dicatat dalam catatan kaki.
- source_word: גַּם מִתְּמוֹל גַּם מִשִּׁלְשֹׁם גַּם מֵאָז דַּבֶּרְךָ אֶל עַבְדֶּךָ
  choice: baik dahulu maupun sejak Engkau berbicara kepada hamba-Mu ini
  rationale: Pasangan “kemarin dan tiga hari lalu” merupakan ungkapan waktu bagi masa sebelumnya; “dahulu” menghindari kesan kronologi dua hari secara kaku, dan “sejak” mempertahankan titik waktu ketika Allah mulai berbicara.
- source_word: עַבְדֶּךָ
  choice: hamba-Mu ini
  rationale: Dalam tuturan langsung, ini adalah sebutan diri yang merendah di hadapan Allah; tambahan “ini” membuat rujukan kepada diri sendiri wajar dalam bahasa Indonesia.
- source_word: כִּי כְבַד פֶּה וּכְבַד לָשׁוֹן אָנֹכִי
  choice: Sebab, mulutku berat dan lidahku berat
  rationale: Metafora dan paralelisme Ibrani dipertahankan agar teks tidak menentukan apakah masalah Musa adalah kefasihan, rasa percaya diri, atau gangguan bicara.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama diri ilahi, sehingga transliterasi mempertahankan pembedaan antara nama Yahweh dan gelar אֲדֹנָי.
- issue: Hakikat kesulitan bicara Musa
  choice: Mempertahankan metafora “mulutku berat dan lidahku berat”
  alternative: “aku lambat berbicara” atau menyebut gangguan bicara tertentu
  rationale: Bahasa Ibrani tidak memastikan apakah Musa tidak fasih, merasa tidak mampu, atau mengalami hambatan fisik; metafora mempertahankan ambiguitas itu.
- issue: Jangkauan ungkapan waktu Musa
  choice: “baik dahulu maupun sejak Engkau berbicara”
  alternative: “baik kemarin maupun tiga hari yang lalu, bahkan sejak Engkau berbicara”
  rationale: Ungkapan idiomatis itu menegaskan bahwa Musa tidak cakap berbicara sebelumnya dan keadaan tersebut tidak berubah sejak panggilan ilahi, tanpa memaksakan hitungan hari literal.
translation_notes:
  register: Bahasa Indonesia baku-modern dengan nada langsung dan bermartabat. Kata ganti ilahi memakai huruf kapital. Metafora penutup dipertahankan, sedangkan idiom “orang perkataan” diterjemahkan secara alami dan bentuk literalnya diberikan dalam catatan kaki.
