  text: He will speak to the people for you[a], and he will be as a mouth for you[b], and you will be as God to him.
translation:
  language: id
  text: Ia akan berbicara kepada bangsa itu untukmu. Ia akan menjadi mulut bagimu, dan engkau akan menjadi seperti Allah baginya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “engkau akan menjadi Allah baginya.” Ungkapan ini menggambarkan peran Musa sebagai wakil Allah bagi Harun: Musa menerima firman Allah dan menyampaikannya kepada Harun.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְדִבֶּר
  choice: akan berbicara
  rationale: Bentuk piel dari דבר di sini berarti ‘berbicara’; konteks janji Allah mengenai peran Harun memberi nuansa waktu mendatang.
- source_word: לְךָ
  choice: untukmu
  rationale: 'Preposisi ל dipahami secara benefaktif atau representatif: Harun akan berbicara bagi Musa di hadapan bangsa itu.'
- source_word: אֶל הָעָם
  choice: kepada bangsa itu
  rationale: עָם menunjuk kepada bangsa Israel dalam konteks ini; ‘bangsa itu’ wajar dan mempertahankan rujukan kolektifnya.
- source_word: לְפֶה
  choice: menjadi mulut bagimu
  rationale: Terjemahan ini mempertahankan metafora konkret ‘mulut’ yang menggambarkan Harun sebagai juru bicara Musa, alih-alih menggantinya dengan penjelasan interpretatif.
- source_word: לֵאלֹהִים
  choice: menjadi seperti Allah
  rationale: Ungkapan ini menyatakan peran dan kewenangan representatif Musa terhadap Harun. ‘Seperti Allah’ mempertahankan bobot metaforanya tanpa menyatakan bahwa Musa secara hakiki adalah Allah.
theological_decisions:
- issue: Apakah לֵאלֹהִים menyatakan bahwa Musa secara harfiah adalah Allah atau menggambarkan fungsi representatifnya
  choice: menjadi seperti Allah baginya
  alternative: menjadi Allah baginya
  rationale: Konteks ayat 15–16 menggambarkan Musa menerima firman Allah dan menyampaikannya kepada Harun. Kata depan ל dapat menandai kapasitas atau peran, tetapi bentuk Ibraninya tidak memakai kata pembanding tersendiri; karena itu alternatif yang lebih harfiah dicatat tanpa menjadikan Musa ilahi secara ontologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora ‘mulut’ dipertahankan karena penting bagi kesejajaran antarklausa. ‘Untukmu’ mempertahankan kemungkinan nuansa benefaktif sekaligus representatif.
