base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/011.yaml
  text: And the LORD said to him, “Who has put a mouth on man? Or who makes one mute, or deaf, or sighted, or blind? Is it not I, the LORD?”
translation:
  language: id
  text: Lalu TUHAN berfirman kepadanya, “Siapakah yang memberi manusia mulut? Atau siapakah yang membuat orang menjadi bisu, orang menjadi tuli, orang dapat melihat, atau orang menjadi buta? Bukankah Aku, TUHAN?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂם פֶּה לָאָדָם
  choice: memberi manusia mulut
  rationale: Ungkapan ini mempertahankan gambaran konkret Ibrani, tetapi memakai susunan yang alami dalam bahasa Indonesia.
- source_word: יָשׂוּם
  choice: membuat
  rationale: Bentuk imperfek dalam pertanyaan umum menyatakan tindakan atau penetapan yang berlaku secara umum; “membuat” sesuai dengan konteks.
- source_word: אִלֵּם ... חֵרֵשׁ ... פִקֵּחַ ... עִוֵּר
  choice: bisu ... tuli ... dapat melihat ... buta
  rationale: Rangkaian kondisi manusia diterjemahkan secara langsung. פִקֵּחַ dalam pertentangannya dengan “buta” berarti orang yang dapat melihat.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia yang mapan untuk Tetragramaton, dengan huruf kapital sebagai penanda nama ilahi.
theological_decisions:
- issue: Pernyataan bahwa TUHAN membuat orang bisu, tuli, dapat melihat, atau buta
  choice: Dipertahankan sebagai pernyataan langsung dalam pertanyaan retoris
  alternative: Diperhalus menjadi bahasa izin atau pemeliharaan tidak langsung
  rationale: Teks Ibrani secara eksplisit memakai verba “membuat/menetapkan” dan menutupnya dengan “Bukankah Aku, TUHAN?”; terjemahan tidak boleh mengurangi ketegangan teologis tersebut.
- issue: Makna פִקֵּחַ
  choice: dapat melihat
  alternative: awas atau bermata terang
  rationale: Dalam pasangan dengan “buta,” acuannya adalah kemampuan melihat; pilihan ini jelas dan alami tanpa menambahkan tafsiran.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur pertanyaan retoris serta urutan empat kondisi dalam teks Ibrani dipertahankan. Tidak diperlukan catatan kaki.
