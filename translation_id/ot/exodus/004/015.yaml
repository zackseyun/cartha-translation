base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/015.yaml
  text: You shall speak to him and put the words in his mouth[a], and I will be with your mouth and with his mouth[b], and I will instruct you what you shall do.
translation:
  language: id
  text: Berbicaralah kepadanya dan taruhlah kata-kata itu ke dalam mulutnya. Aku akan menyertai mulutmu dan mulutnya, dan Aku akan mengajar kalian apa yang akan kalian lakukan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “kalian” pada bagian akhir ayat berbentuk jamak dalam bahasa Ibrani dan merujuk kepada Musa dan Harun bersama-sama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִבַּרְתָּ אֵלָיו
  choice: Engkau harus berbicara kepadanya
  rationale: Bentuk perfek dengan waw dalam konteks petunjuk ini berfungsi sebagai perintah. Kata ganti tunggal dipertahankan dengan 'engkau' karena Allah sedang berbicara kepada Musa.
- source_word: וְשַׂמְתָּ אֶת־הַדְּבָרִים בְּפִיו
  choice: dan menaruh perkataan-perkataan itu dalam mulutnya
  rationale: Terjemahan ini mempertahankan verba konkret 'menaruh' dan ungkapan Ibrani 'dalam mulutnya', yang berarti membekali Harun dengan perkataan yang harus disampaikannya.
- source_word: הַדְּבָרִים
  choice: perkataan-perkataan itu
  rationale: Bentuk jamak tentu diterjemahkan secara transparan; 'itu' menandai ketentuan nomina Ibrani dan mengacu pada perkataan yang diberikan Allah.
- source_word: וְאָנֹכִי אֶהְיֶה עִם־פִּיךָ וְעִם־פִּיהוּ
  choice: Aku akan menyertai mulutmu dan mulutnya
  rationale: '''Menyertai'' mengungkapkan אֶהְיֶה עִם secara alami dalam bahasa Indonesia, sementara citra konkret ''mulutmu dan mulutnya'' tetap dipertahankan sebagai gambaran kehadiran dan pertolongan Allah dalam berbicara.'
- source_word: וְהוֹרֵיתִי אֶתְכֶם
  choice: dan Aku akan mengajarkan kepada kalian
  rationale: Bentuk Hifil dari ירה berarti 'mengajar/memberi petunjuk'. 'Kalian' menyatakan dengan jelas bahwa objeknya jamak, yaitu Musa dan Harun.
- source_word: אֵת אֲשֶׁר תַּעֲשׂוּן
  choice: apa yang harus kalian lakukan
  rationale: Konstruksi relatif berarti 'apa yang'. Verba orang kedua jamak kembali merujuk kepada Musa dan Harun; 'harus' sesuai dengan konteks instruksi ilahi.
theological_decisions:
- issue: Ungkapan antropomorfis tentang pertolongan Allah dalam berbicara
  choice: Mempertahankan citra konkret 'Aku akan menyertai mulutmu dan mulutnya'.
  alternative: Aku akan menolong engkau dan dia berbicara.
  rationale: Bahasa sumber menyebut mulut Musa dan Harun secara langsung. Mempertahankan citra ini menjaga tekstur teks dan menyatakan kehadiran serta pemberdayaan ilahi tanpa mereduksinya menjadi parafrasa.
- issue: Peralihan dari bentuk tunggal ke bentuk jamak
  choice: Menggunakan 'engkau' untuk Musa pada awal ayat dan 'kalian' untuk Musa serta Harun pada akhir ayat.
  alternative: Menggunakan 'kamu' di seluruh ayat sehingga perbedaan jumlah hanya tersirat oleh konteks.
  rationale: Bahasa Ibrani secara jelas beralih ke objek dan verba jamak pada bagian akhir. Bahasa Indonesia dapat dan sebaiknya memperlihatkan peralihan tersebut secara alami.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Engkau' dipakai bagi sapaan tunggal kepada Musa, sedangkan 'kalian' menandai bentuk jamak secara jelas. Ungkapan konkret 'menaruh ... dalam mulutnya' dan 'menyertai mulutmu dan mulutnya' sengaja dipertahankan karena dapat dipahami dan mencerminkan citra bahasa Ibrani.
