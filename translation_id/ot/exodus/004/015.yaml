  terminology: “Menyertai mulutmu dan mulutnya” dengan tepat mempertahankan citra antropomorfis Ibrani tanpa menafsirkannya menjadi sekadar bantuan berbicara. Nama Musa dan Harun dalam catatan kaki tepat. “Kata-kata” adalah padanan yang wajar dan transparan bagi הַדְּבָרִים.
