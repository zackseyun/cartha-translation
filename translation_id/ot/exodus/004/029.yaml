  text: Then Moses and Aaron went and gathered all the elders of the sons of Israel[a].
translation:
  language: id
  text: Kemudian Musa dan Harun pergi dan mengumpulkan semua tua-tua bani Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Israel”; secara harfiah, “anak-anak Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: pergi
  rationale: Bentuk wayyiqtol dari הלך melanjutkan alur cerita dengan arti sederhana “pergi”. Walaupun verba Ibrani berbentuk tunggal sebelum dua subjek yang digabungkan, bahasa Indonesia secara wajar memakai predikat “pergi” untuk Musa dan Harun.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: אַהֲרֹן
  choice: Harun
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: וַיַּאַסְפוּ
  choice: mengumpulkan
  rationale: אסף dalam konteks ini berarti menghimpun orang-orang agar berkumpul; “mengumpulkan” alami dan tetap dekat dengan makna sumber.
- source_word: אֵת
  choice: '[tidak diterjemahkan secara terpisah]'
  rationale: Penanda objek langsung ini tidak memiliki padanan tersendiri dalam bahasa Indonesia.
- source_word: כָּל
  choice: semua
  rationale: כָּל menyatakan keseluruhan, yang secara ringkas dan alami diterjemahkan “semua”.
- source_word: זִקְנֵי
  choice: tua-tua
  rationale: Dalam konteks ini זקנים menunjuk para pemimpin masyarakat yang diakui. “Tua-tua” merupakan istilah Alkitabiah Indonesia yang mapan dan mempertahankan kaitan leksikal dengan usia serta fungsi sosial mereka.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: “Bani Israel” mempertahankan ungkapan kekerabatan dalam sumber—keturunan Israel—tanpa membatasinya hanya kepada laki-laki, dan tetap alami serta dikenal dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: orang Israel; anak-anak Israel
  rationale: Ungkapan Ibrani membawa identitas umat berdasarkan keturunan dari Israel/Yakub. “Bani Israel” mempertahankan nuansa leluhur dan perjanjian itu, sedangkan “orang Israel” mengubahnya menjadi sebutan etnis semata dan “anak-anak Israel” dapat terdengar seolah-olah menunjuk anak kecil dalam bahasa Indonesia modern.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bernada naratif. “Tua-tua” dan “bani Israel” dipilih sebagai istilah yang bermartabat serta dikenal luas dalam ragam Alkitabiah Indonesia, sementara catatan kaki menjelaskan alternatif dan bentuk harfiahnya.
