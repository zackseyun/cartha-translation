  text: וַֽ/יַּאֲמֵ֖ן הָ/עָ֑ם וַֽ/יִּשְׁמְע֡וּ כִּֽי פָקַ֨ד יְהוָ֜ה אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/כִ֤י רָאָה֙ אֶת עָנְיָ֔/ם וַֽ/יִּקְּד֖וּ וַ/יִּֽשְׁתַּחֲוּֽוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/031.yaml
  text: And the people believed[a]; and when they heard that Yahweh had visited the sons of Israel and that he had seen their affliction[c][b], they bowed down and worshiped.
translation:
  language: id
  text: Lalu bangsa itu percaya. Ketika mereka mendengar bahwa Yahweh telah memperhatikan keturunan Israel[a] dan telah melihat penderitaan mereka[b], mereka pun menundukkan diri dan menyembah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Israel”; dapat juga diterjemahkan “anak-anak Israel” atau “orang Israel.”
    reason: lexical_alternative
  - marker: b
    text: Atau “kesengsaraan mereka” atau “penindasan yang mereka alami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמֵן
  choice: percaya
  rationale: Bentuk Hifil dari אמן menyatakan bahwa bangsa itu memercayai berita dan tanda-tanda yang disampaikan; objek tidak ditambahkan karena tidak dinyatakan dalam bahasa Ibrani.
- source_word: הָעָם
  choice: bangsa itu
  rationale: Nomina kolektif ini menunjuk kepada umat Israel yang berkumpul; 'bangsa itu' alami dalam konteks dan mempertahankan sifat kolektifnya.
- source_word: וַיִּשְׁמְעוּ כִּי
  choice: Ketika mereka mendengar bahwa
  rationale: Ungkapan ini menyampaikan isi yang didengar sekaligus hubungan temporal-kausal dengan respons yang mengikutinya.
- source_word: פָקַד יְהוָה
  choice: Yahweh telah memperhatikan
  rationale: פקד di sini berarti memberi perhatian atau mengindahkan dengan implikasi tindakan ilahi. 'Memperhatikan' lebih alami daripada 'mengunjungi' dalam bahasa Indonesia modern, tanpa menghilangkan gagasan kepedulian yang aktif.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Secara harfiah 'anak-anak lelaki Israel', tetapi sebagai ungkapan kekerabatan kolektif istilah ini mencakup umat Israel; 'keturunan Israel' mempertahankan hubungan genealogis secara alami.
- source_word: רָאָה אֶת עָנְיָם
  choice: telah melihat penderitaan mereka
  rationale: Terjemahan ini mempertahankan verba konkret 'melihat', yang dalam konteks menyiratkan perhatian penuh belas kasih, dan memakai 'penderitaan' untuk עֳנִי sebagai padanan Indonesia yang jelas dan bermartabat.
- source_word: וַיִּקְּדוּ
  choice: berlutut
  rationale: קדד menggambarkan tubuh yang ditundukkan dalam penghormatan. Dalam pasangan dengan verba berikutnya, 'berlutut' menyatakan gerak jasmani secara alami tanpa mengulang 'menyembah'.
- source_word: וַיִּשְׁתַּחֲווּ
  choice: menyembah
  rationale: Verba ini dapat berarti bersujud atau menyembah; setelah verba yang sudah menyatakan gerak tubuh, 'menyembah' menonjolkan makna ibadahnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung; transliterasi 'Yahweh' mempertahankan nama itu dan membedakannya dari gelar umum.
- issue: Makna tindakan ilahi dalam פקד
  choice: telah memperhatikan
  alternative: telah mengunjungi
  rationale: Pilihan ini mempertahankan arti bahwa Yahweh mengindahkan keadaan umat-Nya dengan maksud bertindak, sambil menghindari kesan kunjungan fisik semata. Alternatif harfiah dicatat dalam catatan kaki.
- issue: Ungkapan kekerabatan בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak Israel
  rationale: Ungkapan tersebut bersifat genealogis dan kolektif. 'Keturunan Israel' mencakup seluruh umat tanpa mengaburkan kaitan mereka dengan Israel sebagai leluhur.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Struktur Ibrani dipertahankan sejauh tetap alami; dua tindakan penutup dibedakan sebagai gerak tubuh ('berlutut') dan tindakan ibadah ('menyembah').
