base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/030.yaml
  text: Aaron spoke all the words that Yahweh had spoken to Moses[a], and he performed the signs before the eyes of the people.
translation:
  language: id
  text: Harun menyampaikan semua perkataan yang telah Yahweh ucapkan kepada Musa, dan ia melakukan tanda-tanda itu di depan mata orang banyak itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di hadapan orang banyak itu.”
    reason: Alternatif idiomatis untuk לְעֵינֵי הָעָם; teks utama mempertahankan gambaran harfiahnya.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: menyampaikan
  rationale: Bentuk piel dari דבר berarti ‘berbicara’; dalam konstruksi dengan ‘segala perkataan’, ‘menyampaikan’ terdengar alami dalam bahasa Indonesia dan menunjukkan bahwa Harun mengucapkan pesan yang dipercayakan kepadanya tanpa menambah isi.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: segala perkataan
  rationale: Mempertahankan ungkapan konkret bahasa Ibrani, alih-alih meratakannya menjadi ‘semuanya’.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: yang telah disampaikan Yahweh kepada Musa
  rationale: ‘Telah disampaikan’ menandai bahwa firman Yahweh kepada Musa mendahului penyampaian Harun dalam alur cerita.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan mempertahankannya sebagai nama pribadi, bukan menggantinya dengan gelar.
- source_word: וַיַּעַשׂ
  choice: lalu melakukan
  rationale: עשה secara dasar berarti ‘melakukan/membuat’; bersama ‘tanda-tanda’, ‘melakukan’ cukup jelas dan tidak menambahkan penafsiran ‘mukjizat’ yang tidak dinyatakan secara eksplisit dalam kata tersebut.
- source_word: הָאֹתֹת
  choice: tanda-tanda itu
  rationale: Artikel tertentu merujuk pada tanda-tanda yang sudah diberikan dalam konteks sebelumnya; ‘tanda-tanda’ mempertahankan istilah sumber tanpa perluasan tafsir.
- source_word: לְעֵינֵי הָעָם
  choice: di depan mata bangsa itu
  rationale: Mempertahankan gambaran konkret idiom Ibrani bahwa tindakan itu dilakukan sehingga bangsa tersebut menyaksikannya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; ‘Yahweh’ mempertahankan nama perjanjian sebagai nama, bukan menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Menyampaikan segala perkataan’ dipilih agar alami sekaligus dekat dengan bentuk sumber; idiom ‘di depan mata’ dipertahankan karena jelas dalam bahasa Indonesia dan menjaga daya visual teks Ibrani.
