  text: וְ/הָיָה֙ אִם לֹ֣א יַאֲמִ֣ינוּ לָ֔/ךְ וְ/לֹ֣א יִשְׁמְע֔וּ לְ/קֹ֖ל הָ/אֹ֣ת הָ/רִאשׁ֑וֹן וְ/הֶֽאֱמִ֔ינוּ לְ/קֹ֖ל הָ/אֹ֥ת הָ/אַחֲרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/008.yaml
  text: And it will be[a], if they do not believe you and do not listen to the voice of the first sign, then they will believe the voice of the latter sign.
translation:
  language: id
  text: Jika mereka tidak memercayaimu dan tidak mendengarkan suara tanda yang pertama, mereka akan memercayai suara tanda yang kemudian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanda yang terakhir.” Kata Ibrani yang diterjemahkan “yang kemudian” juga dapat berarti “yang terakhir,” tetapi “yang kemudian” tidak menyiratkan bahwa tidak ada tanda lain sesudahnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Jika
  rationale: Rangkaian ini memperkenalkan keadaan bersyarat yang akan datang. Dalam bahasa Indonesia modern, “Jika” menyampaikan fungsi sintaksisnya dengan wajar tanpa ungkapan pembuka yang kaku.
- source_word: יַאֲמִינוּ לָךְ
  choice: memercayaimu
  rationale: Bentuk Hifil אמן dengan ל berarti memercayai atau menerima perkataan seseorang sebagai benar; “memercayaimu” alami dan sesuai konteks penerimaan terhadap perkataan Musa.
- source_word: יִשְׁמְעוּ
  choice: mendengarkan
  rationale: שׁמע di sini menunjuk pada mendengar dengan penerimaan atau mengindahkan, bukan semata-mata mendengar bunyi dan tidak harus dipersempit menjadi menaati.
- source_word: לְקוֹל
  choice: suara
  rationale: קוֹל secara harfiah berarti “suara”. Mempertahankan metafora bahwa tanda itu memiliki suara menjaga gambaran khas teks Ibrani.
- source_word: הָאֹת
  choice: tanda
  rationale: אוֹת berarti tanda, yang dalam konteks ini memang bersifat ajaib; “tanda” tidak menambahkan unsur yang tidak dinyatakan secara leksikal.
- source_word: הָרִאשׁוֹן
  choice: yang pertama
  rationale: רִאשׁוֹן secara langsung berarti “pertama” dan membentuk kontras dengan tanda yang kemudian.
- source_word: וְהֶאֱמִינוּ
  choice: mereka akan memercayai
  rationale: Bentuk ini menjadi akibat dari syarat sebelumnya. Susunan kalimat Indonesia sudah memperjelas hubungan akibat sehingga kata tambahan “maka” tidak diperlukan.
- source_word: הָאַחֲרוֹן
  choice: yang kemudian
  rationale: אַחֲרוֹן dapat berarti yang kemudian atau yang terakhir. “Yang kemudian” mempertahankan relasi urutan tanpa menyiratkan bahwa tidak mungkin ada tanda berikutnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Metafora Ibrani “suara tanda” dipertahankan meskipun agak tidak lazim, karena tanda itu digambarkan seolah-olah memberikan kesaksian. Bentuk kondisional dibuat alami dalam bahasa Indonesia tanpa menerjemahkan וְהָיָה secara kaku.
