source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל מֹשֶׁה֙ בְּ/מִדְיָ֔ן לֵ֖ךְ שֻׁ֣ב מִצְרָ֑יִם כִּי מֵ֨תוּ֙ כָּל הָ֣/אֲנָשִׁ֔ים הַֽ/מְבַקְשִׁ֖ים אֶת נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/019.yaml
  text: And Yahweh said to Moses in Midian[a], “Go, return to Egypt, because all the men who were seeking your life are dead.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa di Midian, “Pergilah, kembalilah ke Mesir,[a] sebab semua laki-laki yang mengincar nyawamu sudah mati.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kembalilah ke Mesir.” Teks Ibrani memakai dua kata kerja perintah, secara harfiah, “Pergilah, kembalilah ke Mesir.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan membedakannya dari gelar seperti 'Tuhan'.
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Bentuk naratif וַיֹּאמֶר melanjutkan rangkaian peristiwa; 'berfirman' merupakan padanan Indonesia yang wajar dan bermartabat ketika Allah menjadi subjek.
- source_word: בְּמִדְיָן
  choice: di Midian
  rationale: Preposisi בְּ menyatakan lokasi Musa ketika firman itu disampaikan.
- source_word: לֵךְ שֻׁב
  choice: Pergilah, kembalilah
  rationale: 'Mempertahankan kedua bentuk imperatif Ibrani: perintah untuk pergi dan perintah pokok untuk kembali.'
- source_word: מִצְרָיִם
  choice: ke Mesir
  rationale: Arah tujuan yang tersirat oleh konstruksi Ibrani dinyatakan secara alami dengan 'ke' dalam bahasa Indonesia.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi perintah sebelumnya dalam ragam Indonesia yang alami dan bermartabat.
- source_word: מֵתוּ
  choice: sudah mati
  rationale: Mengungkapkan tindakan yang telah selesai beserta keadaan hasilnya yang masih berlaku.
- source_word: כָּל הָאֲנָשִׁים
  choice: semua orang
  rationale: Dalam konteks ini אֲנָשִׁים menunjuk para individu yang memburu Musa; 'semua orang' alami dalam bahasa Indonesia tanpa menambahkan jenis kelamin yang tidak perlu bagi pemahaman.
- source_word: הַמְבַקְשִׁים
  choice: yang berusaha
  rationale: Partisipel menyatakan tindakan yang berlangsung atau menjadi tujuan mereka; dalam idiom lengkapnya, mereka berupaya membunuh Musa.
- source_word: אֶת נַפְשֶׁךָ
  choice: mencabut nyawamu
  rationale: נֶפֶשׁ di sini berarti nyawa atau kehidupan, dan ungkapan 'mencari nyawa' bermakna hendak membunuh; 'berusaha mencabut nyawamu' menyampaikan maksud idiom itu dengan jelas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama tersebut alih-alih menggantinya dengan gelar.
- issue: Makna idiom mencari נֶפֶשׁ Musa
  choice: berusaha mencabut nyawamu
  alternative: mencari nyawamu; hendak membunuhmu
  rationale: Pilihan utama mempertahankan unsur 'nyawa' dari teks sumber sekaligus menjelaskan bahwa maksud para pengejar ialah membunuh Musa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Dua imperatif Ibrani dipertahankan. Penanda catatan kaki ditempatkan pada akhir kalimat yang dijelaskannya.
