base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/004.yaml
  text: Then Yahweh said to Moses[a], “Reach out your hand and take hold of its tail.” So he reached out his hand and took hold of it[b], and it became a staff in his hand.
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa, “Ulurkan tanganmu dan peganglah ekornya[a].” Musa pun mengulurkan tangannya dan memegang ular itu. Lalu ular itu menjadi tongkat[b] di tangannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “peganglah pada ekornya” atau “tangkaplah ekornya.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “gada.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: שְׁלַח יָדְךָ
  choice: Ulurkan tanganmu
  rationale: Ungkapan Indonesia yang alami untuk tindakan mengulurkan tangan dan tetap dekat dengan bentuk perintah Ibrani.
- source_word: וֶאֱחֹז בִּזְנָבוֹ
  choice: dan peganglah ekornya
  rationale: Menyampaikan tindakan memegang ekor ular secara jelas dan alami; preposisi ב dapat pula dipahami sebagai memegang pada atau melalui ekornya.
- source_word: וַיַּחֲזֶק בּוֹ
  choice: memegang ular itu
  rationale: Kata kerja dalam konstruksi ini menyatakan memegang dengan kuat. Penyebutan 'ular itu' memperjelas rujukan pronomina tanpa mengubah makna.
- source_word: וַיְהִי לְמַטֶּה
  choice: menjadi tongkat
  rationale: Dalam konteks perubahan wujud, היה paling tepat diterjemahkan 'menjadi'; מַטֶּה secara alami diterjemahkan 'tongkat'.
- source_word: בְּכַפּוֹ
  choice: di tangannya
  rationale: Walaupun כַּף dapat menunjuk telapak tangan, 'di tangannya' merupakan ungkapan Indonesia yang wajar dan tepat dalam konteks ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks menggunakan nama diri ilahi. Bentuk 'Yahweh' mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Partikel 'pun' menandai tanggapan langsung Musa secara alami. Pengulangan 'ular itu' dipakai untuk menjaga rujukan tetap jelas bagi pembaca umum.
