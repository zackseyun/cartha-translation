source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֨ף יְהוָ֜ה בְּ/מֹשֶׁ֗ה וַ/יֹּ֨אמֶר֙ הֲ/לֹ֨א אַהֲרֹ֤ן אָחִ֨י/ךָ֙ הַ/לֵּוִ֔י יָדַ֕עְתִּי כִּֽי דַבֵּ֥ר יְדַבֵּ֖ר ה֑וּא וְ/גַ֤ם הִנֵּה הוּא֙ יֹצֵ֣א לִ/קְרָאתֶ֔/ךָ וְ/רָאֲ/ךָ֖ וְ/שָׂמַ֥ח בְּ/לִבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/014.yaml
  text: Then Yahweh’s anger burned against Moses[a], and he said, “Is there not Aaron your brother, the Levite? I know that he can speak well. And also, look, he is coming out to meet you; when he sees you, he will rejoice in his heart.”
translation:
  language: id
  text: Lalu murka Yahweh menyala terhadap Musa, dan Dia berfirman, “Bukankah ada Harun, saudaramu, orang Lewi itu? Aku tahu bahwa dia pandai berbicara.[a] Bahkan, lihatlah, dia sedang keluar untuk menemuimu. Ketika melihatmu, dia akan bersukacita dalam hatinya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dia berbicara dengan lancar”; secara lebih harfiah, “berbicara, dia akan berbicara.”
    reason: Mencatat kemungkinan nuansa konstruksi intensif דַבֵּר יְדַבֵּר serta bentuknya yang lebih harfiah tanpa memaksakan satu penafsiran ke dalam teks utama.
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: murka ... menyala
  rationale: Mempertahankan metafora Ibrani tentang amarah yang menyala, sekaligus tetap wajar dan bermartabat dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang muncul langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: הֲלֹא
  choice: Bukankah ada
  rationale: Menyampaikan pertanyaan retoris yang mengharapkan jawaban positif secara alami dalam bahasa Indonesia.
- source_word: הַלֵּוִי
  choice: orang Lewi itu
  rationale: Menunjukkan afiliasi kesukuan Harun tanpa menyiratkan bahwa yang dimaksud haruslah jabatan kultis.
- source_word: יָדַעְתִּי כִּי דַבֵּר יְדַבֵּר הוּא
  choice: Aku tahu bahwa dia pandai berbicara
  rationale: Konstruksi infinitif absolut dengan verba finit menegaskan kemampuan atau kelancaran berbicara dalam konteks keberatan Musa. Terjemahan ini menyampaikan maksud tersebut secara alami, sementara bentuk dan kemungkinan nuansa lain dicatat dalam catatan kaki.
- source_word: וְגַם הִנֵּה
  choice: Bahkan, lihatlah
  rationale: Mempertahankan daya tambah dan penunjuk yang menarik perhatian, dengan ungkapan Indonesia modern.
- source_word: יֹצֵא לִקְרָאתֶךָ
  choice: dia sedang keluar untuk menemuimu
  rationale: Bentuk partisip menyatakan tindakan yang sedang berlangsung atau segera terjadi; pilihan ini juga mempertahankan gagasan ‘keluar’ dalam sumber.
- source_word: וְרָאֲךָ
  choice: Ketika melihatmu
  rationale: Hubungan temporal dengan klausa berikutnya paling alami dinyatakan dengan ‘ketika’, tanpa mengubah urutan peristiwanya.
- source_word: וְשָׂמַח בְּלִבּוֹ
  choice: dia akan bersukacita dalam hatinya
  rationale: Mempertahankan baik kegembiraan maupun penekanan eksplisit pada sikap batin Harun.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks sumber memakai Tetragramaton sebagai nama pribadi. ‘Yahweh’ mempertahankan nama itu melalui transliterasi dan tidak menggantinya dengan gelar; bentuk alternatif dikenal dalam tradisi Indonesia tetapi tidak dipilih di sini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ‘Dia’ dipakai untuk Yahweh dan ‘dia’ untuk Harun demi kejelasan rujukan. Penanda catatan kaki ditempatkan tepat sesudah frasa yang dijelaskannya.
