  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶֽל אַהֲרֹ֔ן לֵ֛ךְ לִ/קְרַ֥את מֹשֶׁ֖ה הַ/מִּדְבָּ֑רָ/ה וַ/יֵּ֗לֶךְ וַֽ/יִּפְגְּשֵׁ֛/הוּ בְּ/הַ֥ר הָ/אֱלֹהִ֖ים וַ/יִּשַּׁק לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/027.yaml
  text: And Yahweh said to Aaron[a], “Go into the wilderness to meet Moses.” So he went and met him at the mountain of God and kissed him.
translation:
  language: id
  text: Yahweh berfirman kepada Harun, “Pergilah ke padang gurun[a] untuk menemui Musa.” Maka Harun pergi dan bertemu dengan Musa di gunung Allah, lalu menciumnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Pergilah menemui Musa di padang gurun.” Susunan bahasa Ibrani dapat dipahami sebagai penekanan pada gerak menuju padang gurun atau sebagai penunjuk tempat pertemuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi dalam bentuk transliterasi yang lazim, bukan diganti dengan gelar.
- source_word: לֵךְ
  choice: Pergilah
  rationale: Bentuk imperatif dari הלך diterjemahkan secara langsung dan wajar dalam bahasa Indonesia.
- source_word: לִקְרַאת מֹשֶׁה
  choice: untuk menemui Musa
  rationale: לִקְרַאת menyatakan gerak dengan tujuan bertemu; susunan ini alami dalam bahasa Indonesia dan mempertahankan maksud perintah.
- source_word: הַמִּדְבָּרָה
  choice: ke padang gurun
  rationale: Akhiran arah -ָה menunjukkan gerak menuju padang gurun. Pilihan ini mempertahankan nuansa arah yang tampak dalam teks Ibrani.
- source_word: וַיִּפְגְּשֵׁהוּ
  choice: bertemu dengan Musa
  rationale: פגשׁ berarti bertemu atau berjumpa. Nama Musa diulang agar rujukan pronomina jelas dan narasi tetap alami dalam bahasa Indonesia.
- source_word: בְּהַר הָאֱלֹהִים
  choice: di gunung Allah
  rationale: Terjemahan formal ini mempertahankan konstruksi Ibrani tanpa menentukan lebih jauh apakah pertemuan berlangsung tepat di puncak atau di kawasan gunung.
- source_word: וַיִּשַּׁק לוֹ
  choice: lalu menciumnya
  rationale: נשׁק berarti mencium. Terjemahan langsung dipertahankan tanpa menambahkan penjelasan bahwa tindakan itu merupakan salam.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa atau TUHAN
  rationale: Yahweh mempertahankan nama perjanjian sebagai nama pribadi dan tidak menggantinya dengan gelar.
- issue: Ungkapan הַר הָאֱלֹהִים
  choice: gunung Allah
  alternative: gunung milik Allah
  rationale: Bentuk konstruksi dibiarkan ringkas agar hubungan genitifnya tidak dijelaskan secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan nama Musa menghindari ketidakjelasan rujukan, sedangkan bentuk “menciumnya” mempertahankan tindakan dalam teks tanpa menambahkan tafsiran mengenai jenis ciuman tersebut.
