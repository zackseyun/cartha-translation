    reason: Menjelaskan cakupan istilah sumber dan mencegah penyamaan yang tidak tepat dengan diagnosis medis modern.
  revision_rationale: Revisi menghilangkan penambahan nama diri, mengganti istilah pakaian yang terlalu spesifik dengan padanan yang lebih dekat dengan חֵיק, dan menyesuaikan bentuk perintah dengan register Indonesia baku. Perbandingan “seperti salju” dipertahankan tanpa menambahkan “putih,” sebagaimana teks Ibrani.
