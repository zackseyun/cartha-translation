  text: וַ/יֹּאמֶר֩ יְהוָ֨ה ל֜/וֹ ע֗וֹד הָֽבֵא נָ֤א יָֽדְ/ךָ֙ בְּ/חֵיקֶ֔/ךָ וַ/יָּבֵ֥א יָד֖/וֹ בְּ/חֵיק֑/וֹ וַ/יּ֣וֹצִאָ֔/הּ וְ/הִנֵּ֥ה יָד֖/וֹ מְצֹרַ֥עַת כַּ/שָּֽׁלֶג־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/006.yaml
  text: Then Yahweh said to him again[a], “Please put your hand into your bosom.” So he put his hand into his bosom, and when he brought it out, behold, his hand was leprous, like snow.
translation:
  language: id
  text: Kemudian Yahweh berkata lagi kepadanya, “Masukkanlah tanganmu ke dalam lipatan pakaianmu.” Ia pun memasukkan tangannya ke dalam lipatan pakaiannya. Ketika ia mengeluarkannya, ternyata tangannya terkena kusta[a], seperti salju.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani yang diterjemahkan “kusta” berkaitan dengan צָרַעַת (tsaraat), suatu keadaan yang dalam Perjanjian Lama juga dapat dikenakan pada pakaian atau rumah. Istilah ini tidak selalu sama dengan kusta modern (penyakit Hansen).
    reason: Menjelaskan cakupan istilah sumber dan mencegah penyamaan yang tidak tepat dengan diagnosis medis modern.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani dan mempertahankannya sebagai nama diri.
- source_word: עוֹד
  choice: lagi
  rationale: Dalam rangkaian tanda ini, kata tersebut menyatakan tindakan atau perintah tambahan.
- source_word: הָבֵא נָא
  choice: Coba masukkan
  rationale: Kata kerja harfiahnya berarti ‘bawalah’, tetapi konteks menuntut tindakan memasukkan tangan; ‘coba’ menyampaikan nuansa נָא yang melunakkan perintah secara wajar dalam bahasa Indonesia.
- source_word: חֵיק
  choice: lipatan jubah
  rationale: Yang dimaksud ialah bagian depan atau lipatan pakaian di dada, tempat sesuatu dapat diselipkan; pilihan ini lebih jelas bagi pembaca modern daripada ‘dada’ atau ‘pangkuan’.
- source_word: וְהִנֵּה
  choice: tampaklah
  rationale: Menyampaikan penyingkapan hasil tanda secara dramatis tanpa memakai seruan yang terasa kaku dalam bahasa Indonesia modern.
- source_word: מְצֹרַעַת
  choice: terkena penyakit kusta
  rationale: Memakai istilah Alkitab yang dikenal luas, sambil memberi catatan bahwa צָרַעַת tidak dapat disamakan begitu saja dengan penyakit Hansen modern.
- source_word: כַּשָּׁלֶג
  choice: seperti salju
  rationale: Mempertahankan perbandingan ringkas dalam bahasa Ibrani tanpa menambahkan kata ‘putih’ ke teks utama.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri; ‘Yahweh’ mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Nama ‘Musa’ dieksplisitkan pada kalimat kedua agar rujukan pronomina tetap jelas dan alami. ‘Lipatan jubah’ dipakai sebagai padanan kontekstual חֵיק; struktur ‘tampaklah’ mempertahankan daya dramatik וְהִנֵּה.
