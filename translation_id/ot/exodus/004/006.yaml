revisions:
- from: Kemudian Yahweh berkata lagi kepadanya, “Coba masukkan tanganmu ke dalam lipatan jubahmu.” Musa pun memasukkan tangannya ke dalam lipatan jubahnya. Ketika ia mengeluarkannya, tampaklah tangannya terkena penyakit kusta[a], seperti salju.
  to: Kemudian Yahweh berkata lagi kepadanya, “Masukkanlah tanganmu ke dalam lipatan pakaianmu.” Ia pun memasukkan tangannya ke dalam lipatan pakaiannya. Ketika ia mengeluarkannya, ternyata tangannya terkena kusta[a], seperti salju.
  rationale: Revisi menghilangkan penambahan nama diri, mengganti istilah pakaian yang terlalu spesifik dengan padanan yang lebih dekat dengan חֵיק, dan menyesuaikan bentuk perintah dengan register Indonesia baku. Perbandingan “seperti salju” dipertahankan tanpa menambahkan “putih,” sebagaimana teks Ibrani.
