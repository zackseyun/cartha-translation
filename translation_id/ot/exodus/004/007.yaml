review_pass:
  verdict: revise
  source_fidelity: 'Draf dengan tepat mempertahankan urutan tindakan, subjek pembicara yang jelas dari konteks, dan penanda perhatian וְהִנֵּה. Namun, “telah pulih seperti bagian tubuhnya yang lain” menafsirkan שָׁבָה כִּבְשָׂרוֹ lebih jauh daripada teks: “pulih” dan khususnya “bagian tubuhnya yang lain” menjadikan hasil pemulihan tersirat itu eksplisit serta mengganti “daging” dengan “bagian tubuh.” Klausa “dari dadanya” pada tindakan mengeluarkan juga sebaiknya dipertahankan, karena muncul eksplisit dalam teks Ibrani.'
  naturalness: “Lipatan pakaian di dada” adalah ungkapan modern yang jelas untuk חֵיק dalam konteks ini. Pengulangan ringkas “dari sana” pada klausa berikutnya tetap alami dalam bahasa Indonesia dan mempertahankan arah tindakan tanpa repetisi yang berat. “Kembali seperti dagingnya” cukup formal namun dapat dipahami dalam register Alkitab; catatan kaki menjelaskan idiom tersebut.
  terminology: TUHAN tepat berdasarkan konteks langsung. “Masukkan kembali,” “mengeluarkannya,” dan “lihatlah” selaras dengan verba Ibrani serta register naratif yang bermartabat. Istilah “dagingnya” dipertahankan dalam teks untuk mencerminkan בְשָׂרוֹ; penjelasan tentang keadaan normal ditempatkan di catatan kaki, bukan dimasukkan sebagai perluasan teks.
  issues:
  - severity: medium
    issue: Pemulihan dan perbandingan diperluas dalam teks utama.
    rationale: “Telah pulih seperti bagian tubuhnya yang lain” mengganti gambaran Ibrani “telah kembali seperti dagingnya” dengan penjelasan interpretatif. Konteks memang mendukung pemulihan normal, tetapi teks utama sebaiknya mempertahankan perbandingan yang lebih langsung dan membatasi penjelasan pada catatan kaki.
  - severity: low
    issue: Asal tindakan mengeluarkan tidak lagi dinyatakan secara eksplisit.
    rationale: Ibrani menyebut bahwa tangan itu dikeluarkan “dari dadanya/lipatan pakaiannya.” Menambahkan “dari sana” memulihkan unsur ini dengan bahasa Indonesia yang tetap lancar.
  revised_text: Lalu TUHAN berkata, “Masukkan kembali tanganmu ke dalam lipatan pakaian di dadamu.”[a] Musa pun memasukkan kembali tangannya ke dalam lipatan pakaiannya. Ketika ia mengeluarkannya dari sana, lihatlah, tangannya telah kembali seperti dagingnya.[b]
