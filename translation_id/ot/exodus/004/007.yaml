  to: Lalu TUHAN berkata, “Masukkan kembali tanganmu ke dalam lipatan pakaian di dadamu.”[a] Musa pun memasukkan kembali tangannya ke dalam lipatan pakaiannya. Ketika ia mengeluarkannya dari sana, lihatlah, tangannya telah kembali seperti dagingnya.[b]
  rationale: Revisi mempertahankan padanan langsung bagi שָׁבָה (“telah kembali”) dan כִּבְשָׂרוֹ (“seperti dagingnya”), sambil memindahkan penjelasan pemulihan normal ke catatan kaki. Unsur “dari dadanya” yang eksplisit dalam sumber juga dipulihkan dengan “dari sana.”
