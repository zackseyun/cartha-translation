base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/007.yaml
  text: And he said[a], “Put your hand back into your bosom.” So he put his hand back into his bosom, and when he brought it out from his bosom, behold[b], it had returned like his flesh.
translation:
  language: id
  text: Lalu TUHAN berkata, “Masukkan kembali tanganmu ke dalam lipatan pakaian di dadamu.”[a] Musa pun memasukkan kembali tangannya ke dalam lipatan pakaiannya. Ketika ia mengeluarkannya dari sana, lihatlah, tangannya telah kembali seperti dagingnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke dadamu”; yang dimaksud dapat berupa lipatan pakaian pada bagian dada.
    reason: cultural_note
  - marker: b
    text: Ungkapan ini berarti bahwa tangannya kembali normal, seperti dagingnya yang tidak terkena.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשֵׁב
  choice: Masukkan kembali
  rationale: Bentuk Hifil imperatif dari שוב menyatakan tindakan membuat tangan kembali ke tempat semula. 'Masukkan kembali' wajar dalam bahasa Indonesia dan sesuai dengan gerakan tangan ke dalam lipatan pakaian.
- source_word: חֵיק
  choice: lipatan pakaian di dada
  rationale: Dalam konteks ini חֵיק menunjuk bagian dada atau lipatan pakaian pada dada tempat tangan dapat dimasukkan. Ungkapan ini lebih jelas bagi pembaca Indonesia modern daripada padanan harfiah 'dada' atau istilah arkais.
- source_word: וַיָּשֶׁב
  choice: memasukkan kembali
  rationale: Bentuk naratif dari שוב mengulangi tindakan yang diperintahkan; pilihan ini menjaga kesinambungan dengan imperatif sebelumnya.
- source_word: וַיּוֹצִאָהּ
  choice: mengeluarkannya
  rationale: Bentuk Hifil dari יצא berarti membawa atau mengeluarkan sesuatu. 'Mengeluarkannya' merupakan padanan Indonesia yang ringkas dan alami.
- source_word: וְהִנֵּה
  choice: lihatlah
  rationale: Partikel ini mengarahkan perhatian kepada hasil yang mengejutkan. 'Lihatlah' mempertahankan daya naratif dan keluhuran tanpa memakai bentuk arkais.
- source_word: שָׁבָה
  choice: telah pulih
  rationale: Secara harfiah verba ini berarti 'telah kembali'. Dalam konteks perubahan kondisi tangan, 'telah pulih' menyampaikan hasilnya secara alami, sedangkan catatan kaki menjaga hubungan dengan gambaran perbandingan Ibrani.
- source_word: כִּבְשָׂרוֹ
  choice: seperti bagian tubuhnya yang lain
  rationale: Prefiks כ menyatakan perbandingan, dan בשרו berarti daging atau tubuhnya. Penambahan 'yang lain' mengungkapkan implikasi kontekstual bahwa tangan itu kembali sama dengan tubuh Musa yang normal.
theological_decisions:
- issue: Subjek eksplisit pada וַיֹּאמֶר
  choice: TUHAN
  alternative: Ia
  rationale: Ayat sebelumnya secara jelas menampilkan TUHAN sebagai pembicara. Menyebut 'TUHAN' menghindari rujukan pronominal yang kurang jelas dalam bahasa Indonesia tanpa mengubah identitas pembicara.
- issue: Makna pemulihan tangan
  choice: telah pulih seperti bagian tubuhnya yang lain
  alternative: telah kembali seperti dagingnya
  rationale: Pilihan utama menyatakan pemulihan kondisi normal yang tersirat dalam konteks, tetapi tidak menambahkan penjelasan mengenai sifat penyakit atau mekanisme mukjizat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif dibuat alami dengan menghindari pengulangan panjang 'lipatan pakaian di dadanya' pada klausa kedua dan ketiga. 'TUHAN' mengikuti identitas pembicara dalam konteks langsung. Semua penanda catatan kaki dicantumkan dalam teks utama.
