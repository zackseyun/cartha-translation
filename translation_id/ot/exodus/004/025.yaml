base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/025.yaml
  text: Then Zipporah took a flint and cut off her son's foreskin and touched his feet with it[a], and she said, “Surely you are a bridegroom of blood to me.”
translation:
  language: id
  text: Lalu Zipora mengambil batu api, memotong kulit khatan anaknya, dan menyentuhkannya ke kakinya[a]. Katanya, “Sungguh, engkau adalah mempelai laki-laki berdarah bagiku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kakinya”. Dalam bahasa Ibrani, “kaki” mungkin merupakan ungkapan halus untuk alat kelamin, dan kata ganti “-nya” dapat merujuk kepada Musa atau kepada anak Zipora.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹר
  choice: batu api
  rationale: Kata benda ini menunjuk pada batu api yang digunakan sebagai alat pemotong; pilihan ini ringkas, alami, dan sesuai dengan konteks penyunatan.
- source_word: עָרְלַת בְּנָהּ
  choice: kulit khatan anaknya
  rationale: Menerjemahkan frasa konstruksi itu secara langsung dan anatomis dengan istilah Indonesia yang lazim dalam konteks penyunatan.
- source_word: וַתַּגַּע
  choice: menyentuhkannya
  rationale: Bentuk ini menyatakan bahwa kulit khatan yang baru dipotong disentuhkan, sambil tetap tidak menentukan secara lebih jauh cara atau sifat kontaknya.
- source_word: לְרַגְלָיו
  choice: pada kakinya
  rationale: Mempertahankan arti leksikal biasa dari רֶגֶל dan membiarkan rujukan pronomina tetap ambigu sebagaimana teks Ibrani.
- source_word: כִּי
  choice: Sungguh
  rationale: Dalam konteks ini כִּי memberi penegasan pada seruan Zipora; 'Sungguh' menyampaikan daya seru itu secara wajar dalam bahasa Indonesia.
- source_word: חֲתַן דָּמִים
  choice: pengantin berdarah
  rationale: Ungkapan Ibrani ini tidak biasa dan sulit. Terjemahan ini mempertahankan citra darah dan hubungan perkawinan tanpa menjelaskan maknanya secara spekulatif.
- source_word: לִי
  choice: bagiku
  rationale: Menyatakan relasi pribadi yang ditandai oleh preposisi לְ dan terdengar alami bersama ungkapan nominal tersebut.
theological_decisions:
- issue: Apakah 'kakinya' harus ditafsirkan sebagai ungkapan halus untuk alat kelamin, dan apakah pronominanya merujuk kepada Musa atau anak Zipora
  choice: Mempertahankan 'kakinya' tanpa menyebut Musa atau anaknya dalam teks utama
  alternative: alat kelaminnya; kaki atau alat kelamin Musa; kaki atau alat kelamin anak Zipora
  rationale: Teks Ibrani memang ambigu. Terjemahan utama mempertahankan arti harfiah serta ketidakjelasan rujukannya, sedangkan kemungkinan eufemisme dan kedua calon rujukan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Ungkapan sulit חֲתַן דָּמִים sengaja dipertahankan secara padat sebagai 'pengantin berdarah' agar ambiguitas dan ketegangan teks tidak dihapus.
