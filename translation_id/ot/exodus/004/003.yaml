base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/003.yaml
  text: And he said[a], “Throw it on the ground.” So he threw it on the ground, and it became a snake[b], and Moses fled from it.
translation:
  language: id
  text: Lalu Dia berkata, “Lemparkanlah tongkat itu ke tanah.” Musa pun melemparkannya ke tanah, dan tongkat itu berubah menjadi ular. Musa melarikan diri dari ular itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu Dia berkata
  rationale: Wayyiqtol melanjutkan alur narasi. Kata ganti merujuk kepada TUHAN dalam konteks sebelumnya; huruf kapital membantu menjaga rujukan itu tanpa menambahkan nama yang tidak terdapat dalam ayat ini.
- source_word: הַשְׁלִיכֵהוּ
  choice: Lemparkanlah tongkat itu
  rationale: Bentuk imperatif dengan sufiks maskulin tunggal merujuk kepada tongkat pada ayat sebelumnya. Mengulangi 'tongkat' lebih jelas dan alami dalam bahasa Indonesia daripada 'lemparkanlah itu'.
- source_word: אַרְצָה
  choice: ke tanah
  rationale: Akhiran arah pada kata 'tanah' menyatakan gerak menuju tanah; 'ke tanah' merupakan padanan Indonesia yang alami.
- source_word: וַיַּשְׁלִיכֵהוּ
  choice: Musa pun melemparkannya
  rationale: Subjek tersirat dikenali dari konteks sebagai Musa. Partikel 'pun' menyampaikan tindakan sebagai tanggapan langsung terhadap perintah.
- source_word: וַיְהִי לְנָחָשׁ
  choice: tongkat itu berubah menjadi ular
  rationale: נָחָשׁ secara umum berarti ular. Subjek 'tongkat itu' dibuat eksplisit agar rujukannya jelas dalam bahasa Indonesia.
- source_word: וַיָּנָס
  choice: Musa melarikan diri
  rationale: Kata kerja נוּס menyatakan tindakan melarikan diri, lebih kuat daripada sekadar menjauh atau berlari.
- source_word: מִפָּנָיו
  choice: dari ular itu
  rationale: Secara harfiah berarti 'dari hadapannya'; sufiksnya paling wajar merujuk kepada ular. Bahasa Indonesia alami menyatakan idiom ini sebagai 'dari ular itu'.
theological_decisions:
- issue: Identitas pembicara yang tersirat
  choice: Dia, dengan huruf kapital
  alternative: Ia / TUHAN
  rationale: Teks Ibrani hanya memakai subjek verbal maskulin tunggal, sedangkan konteks mengidentifikasinya sebagai Allah/TUHAN. 'Dia' mempertahankan bentuk pronominal ayat tanpa memasukkan nama ilahi secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Pengulangan 'tongkat itu' dan 'ular itu' dipakai untuk memperjelas rujukan pronomina Ibrani tanpa mengubah isi. Tidak diperlukan catatan kaki karena alternatif 'ular/ular besar atau serpent' tidak menimbulkan perbedaan makna penting dalam bahasa Indonesia.
