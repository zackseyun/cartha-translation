base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/020.yaml
  text: Then Moses took his wife and his sons[a], set them on the donkey, and returned to the land of Egypt[b]. And Moses took the staff of God in his hand.
translation:
  language: id
  text: Kemudian Musa membawa istrinya dan anak-anak lelakinya, lalu menempatkan mereka di atas keledai itu[a] dan kembali ke tanah Mesir. Musa membawa tongkat Allah[b] di tangannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyuruh mereka menunggang keledai itu.”
    reason: lexical_alternative
  - marker: b
    text: Atau “gada Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Kemudian Musa membawa
  rationale: Bentuk wayyiqtol melanjutkan alur cerita. Dalam konteks perjalanan, “membawa” menyampaikan tindakan mengambil serta mengikutsertakan keluarganya secara alami dalam bahasa Indonesia.
- source_word: אִשְׁתּוֹ
  choice: istrinya
  rationale: Padanan langsung dan alami untuk kata “istri” dengan akhiran posesif orang ketiga tunggal; nama Zipora tidak ditambahkan karena tidak muncul dalam ayat ini.
- source_word: בָּנָיו
  choice: anak-anak lelakinya
  rationale: Bentuk Ibrani adalah jamak maskulin yang secara khusus berarti “anak-anak lelaki/putra-putranya,” bukan istilah umum “anak-anak.” Bentuk jamak dipertahankan meskipun sebelumnya hanya satu anak yang telah disebutkan.
- source_word: וַיַּרְכִּבֵם
  choice: menaikkan mereka ke atas
  rationale: Bentuk Hifil dari רכב berarti menyebabkan seseorang naik atau menunggang. “Menaikkan mereka ke atas” mempertahankan makna kausatif dan terdengar wajar.
- source_word: הַחֲמֹר
  choice: keledai
  rationale: Kata benda ini berbentuk tunggal dan definit dalam bahasa Ibrani. Bahasa Indonesia lazim tidak memerlukan kata sandang khusus dalam konteks ini.
- source_word: וַיָּשָׁב
  choice: lalu kembali
  rationale: שוב di sini menyatakan gerak kembali. “Lalu” meneruskan urutan narasi tanpa membebani kalimat.
- source_word: אַרְצָה מִצְרָיִם
  choice: ke tanah Mesir
  rationale: Akhiran penunjuk arah pada אֶרֶץ menyatakan tujuan, dan unsur “tanah/negeri” dipertahankan agar ungkapan Ibraninya terwakili.
- source_word: מַטֵּה הָאֱלֹהִים
  choice: tongkat Allah
  rationale: מַטֶּה berarti tongkat atau gada. “Tongkat” merupakan istilah Indonesia modern yang paling sesuai untuk benda yang dibawa Musa sebagai sarana tanda-tanda Allah; hubungan genitif dengan Allah dipertahankan.
- source_word: בְּיָדוֹ
  choice: di tangannya
  rationale: Padanan konkret dan langsung bagi frasa berpreposisi tersebut, yang menggambarkan Musa memegang atau membawa tongkat itu.
theological_decisions:
- issue: Arti הָאֱלֹהִים dalam frasa מַטֵּה הָאֱלֹהִים
  choice: Allah
  alternative: tongkat ilahi
  rationale: Dalam konteks panggilan Musa dan tanda-tanda yang diberikan kepadanya, אֱלֹהִים menunjuk secara khusus kepada Allah. Karena itu, “tongkat Allah” lebih langsung dan tidak mengaburkan hubungan tongkat tersebut dengan Dia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti gerak narasi Ibrani sambil tetap alami. Bentuk jamak “anak-anak lelakinya” dipertahankan tanpa mencoba menyelaraskannya secara tersirat dengan penyebutan satu anak dalam konteks sebelumnya.
