  text: And Yahweh said to him[a], “What is that in your hand?” And he said, “A staff.”
translation:
  language: id
  text: Lalu Yahweh berkata kepadanya, “Apa yang ada di tanganmu itu?” Ia berkata, “Tongkat[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “batang.” Kata Ibrani מַטֶּה dapat berarti tongkat, batang, atau tongkat panjang, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai “Yahweh”, bukan diganti dengan gelar, agar nama pribadi dalam teks Ibrani tetap terlihat.
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: berkata ... menjawab
  rationale: Kedua bentuk berasal dari אמר, tetapi dalam bahasa Indonesia modern, kemunculan kedua paling alami diterjemahkan “menjawab” karena merupakan tanggapan langsung terhadap pertanyaan. Makna dan alur dialog tetap dipertahankan.
- source_word: אֵלָיו
  choice: kepadanya
  rationale: Preposisi אֶל dengan akhiran pronominal secara langsung berarti “kepadanya”.
- source_word: מַה־זֶּה / מִזֶּה
  choice: Apa yang ... itu?
  rationale: Ungkapan interogatif dan demonstratif ini meminta identifikasi benda yang sedang dipegang Musa. Susunan “Apa yang ada di tanganmu itu?” menyampaikan daya tunjuknya secara wajar dalam bahasa Indonesia.
- source_word: בְּיָדֶךָ
  choice: di tanganmu
  rationale: Ungkapan ini merujuk secara konkret kepada benda yang sedang berada atau dipegang di tangan Musa.
- source_word: מַטֶּה
  choice: tongkat
  rationale: Dalam konteks ini מַטֶּה menunjuk pada tongkat yang dibawa Musa. “Tongkat” merupakan padanan Indonesia modern yang paling alami, sementara kata Ibrani tersebut juga dapat menunjuk pada batang kayu atau gada menurut konteks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Transliterasi “Yahweh” mempertahankan nama ilahi dalam teks sumber dan menghindari penggantian dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Lalu” mengalirkan narasi tanpa membuat struktur Ibrani terasa kaku. Penanda catatan kaki ditempatkan langsung sesudah kata “Tongkat”, yaitu kata yang diterangkannya.
