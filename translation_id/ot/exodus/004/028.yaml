  text: וַ/יַּגֵּ֤ד מֹשֶׁה֙ לְ/אַֽהֲרֹ֔ן אֵ֛ת כָּל דִּבְרֵ֥י יְהוָ֖ה אֲשֶׁ֣ר שְׁלָח֑/וֹ וְ/אֵ֥ת כָּל הָ/אֹתֹ֖ת אֲשֶׁ֥ר צִוָּֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/028.yaml
  text: Moses told Aaron all the words of Yahweh who had sent him[a], and all the signs that he had commanded him.
translation:
  language: id
  text: Musa memberitahukan kepada Harun segala firman Yahweh yang telah mengutusnya[a] dan segala tanda yang diperintahkan-Nya kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “segala firman Yahweh yang dengannya Ia telah mengutus Musa.” Klausa relatif dalam bahasa Ibrani dapat dikaitkan erat dengan “firman”, meskipun maksudnya tetap bahwa Yahweh mengutus Musa.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: memberitahukan
  rationale: Bentuk Hifil dari נגד berarti membuat sesuatu diketahui atau menyampaikan. “Memberitahukan” alami dalam narasi Indonesia dan cocok untuk tindakan Musa menyampaikan amanat kepada Harun.
- source_word: כָּל דִּבְרֵי יְהוָה
  choice: segala firman Yahweh
  rationale: דָּבָר dapat berarti perkataan, perkara, atau pesan. “Segala firman” mempertahankan bentuk jamak dan menandai bahwa yang disampaikan berasal dari Yahweh, tanpa mereduksinya menjadi satu pesan saja.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan dengan transliterasi “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: אֲשֶׁר שְׁלָחוֹ
  choice: yang telah mengutusnya
  rationale: 'Klausa relatif ini secara wajar dapat dikaitkan dengan Yahweh: Yahweh telah mengutus Musa. Bentuk “telah mengutusnya” menyampaikan tindakan yang mendahului laporan Musa kepada Harun.'
- source_word: הָאֹתֹת
  choice: tanda
  rationale: אוֹת berarti tanda dan dalam konteks Keluaran dapat merujuk pada tindakan ajaib. “Tanda” cukup langsung serta tidak menambahkan kata “mukjizat” yang tidak dinyatakan secara leksikal di sini.
- source_word: אֲשֶׁר צִוָּהוּ
  choice: yang diperintahkan-Nya kepadanya
  rationale: Terjemahan ini mempertahankan sintaksis ringkas teks Ibrani dan tidak menambahkan verba “melakukan”. Huruf kapital pada “-Nya” memperjelas bahwa pemberi perintah ialah Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks menggunakan Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama itu dan menghindari penggantiannya dengan sebuah gelar.
- issue: Acuan klausa אֲשֶׁר שְׁלָחוֹ
  choice: 'Dikaitkan dengan Yahweh: “yang telah mengutusnya”'
  alternative: 'Dikaitkan dengan firman: “yang dengannya Ia telah mengutus Musa”'
  rationale: Kedua hubungan sintaksis dimungkinkan. Teks utama memakai pembacaan yang paling alami dalam bahasa Indonesia, sedangkan kemungkinan kaitan erat dengan “firman” dipertahankan dalam catatan kaki agar ambiguitas Ibrani tidak hilang.
- issue: Makna perintah mengenai tanda-tanda
  choice: “yang diperintahkan-Nya kepadanya”
  alternative: “yang diperintahkan-Nya untuk dilakukannya”
  rationale: Teks Ibrani tidak menyebut tindakan pelaksanaan secara eksplisit. Rumusan utama mempertahankan ketegangan sintaksis itu tanpa menambahkan objek tindakan, meskipun konteks menunjukkan bahwa Musa diperintahkan melakukan tanda-tanda tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Memberitahukan” dipilih sebagai verba naratif yang jelas; “segala firman” dan “segala tanda” mempertahankan pengulangan כָּל serta kesejajaran struktur Ibrani. Pronomina “-nya” pada “mengutusnya” merujuk kepada Musa, sedangkan “-Nya” pada “diperintahkan-Nya” merujuk kepada Yahweh.
