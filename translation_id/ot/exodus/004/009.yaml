source:
  edition: WLC
  text: וְ/הָיָ֡ה אִם לֹ֣א יַאֲמִ֡ינוּ גַּם֩ לִ/שְׁנֵ֨י הָ/אֹת֜וֹת הָ/אֵ֗לֶּה וְ/לֹ֤א יִשְׁמְעוּ/ן֙ לְ/קֹלֶ֔/ךָ וְ/לָקַחְתָּ֙ מִ/מֵּימֵ֣י הַ/יְאֹ֔ר וְ/שָׁפַכְתָּ֖ הַ/יַּבָּשָׁ֑ה וְ/הָי֤וּ הַ/מַּ֨יִם֙ אֲשֶׁ֣ר תִּקַּ֣ח מִן הַ/יְאֹ֔ר וְ/הָי֥וּ לְ/דָ֖ם בַּ/יַּבָּֽשֶׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/009.yaml
  text: And if they do not believe even these two signs and do not listen to your voice[a], then you shall take some of the water of the Nile and pour it on the dry ground[b], and the water that you take from the Nile will become blood on the dry ground.
translation:
  language: id
  text: Jika mereka tidak percaya kepada kedua tanda ini sekalipun dan tidak mendengarkan perkataanmu[a], ambillah sedikit air dari Sungai Nil dan tuangkanlah ke tanah yang kering. Air yang kamu ambil dari Sungai Nil itu akan menjadi darah[b] di tanah yang kering.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak mendengarkan suaramu”; ungkapan Ibrani ini juga dapat berarti “tidak mengindahkan perkataanmu.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “akan berubah menjadi darah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Jika
  rationale: Gabungan ini memperkenalkan keadaan bersyarat. Dalam bahasa Indonesia modern, “Jika” menyampaikan fungsinya secara alami tanpa mempertahankan ungkapan harfiah yang kaku.
- source_word: יַאֲמִינוּ גַּם לִשְׁנֵי הָאֹתוֹת הָאֵלֶּה
  choice: tidak percaya bahkan kepada kedua tanda ini
  rationale: “Percaya” sesuai dengan makna bentuk Hifil אמן dalam konteks penerimaan daya bukti tanda-tanda itu. “Bahkan” mempertahankan unsur peningkatan yang dibawa oleh גַּם.
- source_word: יִשְׁמְעוּן לְקֹלֶךָ
  choice: tidak mendengarkan perkataanmu
  rationale: Idiom שׁמע לְקוֹל berarti mendengarkan atau mengindahkan seseorang. “Perkataanmu” terdengar lebih alami daripada “suaramu” dalam bahasa Indonesia, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: מִמֵּימֵי הַיְאֹר
  choice: sedikit air dari Sungai Nil
  rationale: מִן memiliki makna partitif, yaitu mengambil sebagian air. Dalam konteks Kitab Keluaran, הַיְאֹר merujuk pada Sungai Nil.
- source_word: וְשָׁפַכְתָּ
  choice: tuangkanlah
  rationale: Kata kerja שפך di sini menyatakan tindakan menuangkan air. Bentuk perintah bahasa Indonesia sesuai dengan fungsi bentuk Ibrani dalam rangkaian petunjuk ini.
- source_word: הַיַּבָּשָׁה / בַּיַּבָּשֶׁת
  choice: tanah yang kering
  rationale: Istilah ini menunjuk pada daratan atau tanah kering sebagai lawan dari air. Pengulangan ungkapan dipertahankan sesuai teks sumber.
- source_word: וְהָיוּ ... לְדָם
  choice: akan menjadi darah
  rationale: Susunan היה + ל menyatakan hasil atau perubahan keadaan. “Akan menjadi darah” menyampaikan pernyataan itu secara langsung dan tidak melemahkannya.
- source_word: דָם
  choice: darah
  rationale: Kata ini secara lugas berarti “darah”; konteks tidak memberi alasan untuk menjadikannya sekadar warna atau kemiripan.
theological_decisions:
- issue: Hakikat tanda berupa air Sungai Nil yang menjadi darah
  choice: akan menjadi darah
  alternative: akan tampak seperti darah / akan menjadi merah seperti darah
  rationale: Bahasa Ibrani secara langsung menyatakan bahwa air itu menjadi darah, tanpa pembatas seperti “tampak” atau “merah seperti.” Terjemahan mempertahankan klaim mukjizat dalam teks dan tidak memasukkan penjelasan naturalistis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Bentuk “kauambil” dipakai karena Allah sedang berbicara langsung kepada Musa; “ambillah” dan “tuangkanlah” mempertahankan daya perintah tanpa terdengar kuno. Pengulangan “di tanah yang kering” dipertahankan karena terdapat dua kali dalam teks Ibrani.
