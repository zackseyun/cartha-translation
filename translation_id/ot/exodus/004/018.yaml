base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/018.yaml
  text: Then Moses went and returned to Jethro his father-in-law and said to him[a], “Please let me go and return to my brothers who are in Egypt, so that I may see whether they are still alive.” And Jethro said to Moses[b], “Go in peace.”
translation:
  language: id
  text: Kemudian Musa pergi dan kembali kepada Yeter, ayah mertuanya, lalu berkata kepadanya, “Izinkanlah aku pergi dan kembali kepada saudara-saudaraku yang ada di Mesir untuk melihat apakah mereka masih hidup.” Yitro berkata kepada Musa, “Pergilah dengan damai.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: Kemudian Musa pergi
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “Kemudian” menyatakan urutan secara alami dalam bahasa Indonesia.
- source_word: וַיָּשָׁב
  choice: kembali
  rationale: Kata שׁוב pada konteks ini menyatakan Musa kembali kepada kepala rumah tangganya di Midian.
- source_word: יֶתֶר / יִתְרוֹ
  choice: Yeter / Yitro
  rationale: Teks Ibrani memakai dua bentuk nama dalam ayat yang sama. Karena keduanya jelas merujuk kepada orang yang sama, kedua bentuk dipertahankan untuk mencerminkan bukti sumber tanpa menyelaraskannya secara diam-diam.
- source_word: חֹתְנוֹ
  choice: mertuanya
  rationale: Dalam konteks, yang dimaksud ialah ayah dari istri Musa; “mertua” merupakan ungkapan Indonesia yang alami.
- source_word: אֵלֲכָה נָּא
  choice: Izinkanlah aku pergi
  rationale: Kohortatif dengan נָא mengungkapkan permohonan yang sopan kepada mertuanya.
- source_word: וְאָשׁוּבָה
  choice: dan kembali
  rationale: Kohortatif ini melanjutkan permohonan Musa dan mempertahankan kaitan leksikal dengan שׁוב sebelumnya.
- source_word: אַחַי
  choice: saudara-saudaraku
  rationale: Secara harfiah berarti “saudara-saudaraku”; dalam konteks cakupannya dapat lebih luas, tetapi bentuk sumber dipertahankan.
- source_word: וְאֶרְאֶה
  choice: untuk melihat
  rationale: Infleksi kohortatif dalam rangkaian ini menyampaikan tujuan kepulangan Musa; “untuk melihat” alami dan jelas dalam bahasa Indonesia.
- source_word: הַעוֹדָם חַיִּים
  choice: apakah mereka masih hidup
  rationale: Terjemahan ini mempertahankan unsur ketidakpastian serta makna עוֹד, “masih”.
- source_word: לֵךְ לְשָׁלוֹם
  choice: Pergilah dengan damai
  rationale: Ungkapan ini merupakan berkat atau pelepasan untuk perjalanan yang tenteram; “dengan damai” mempertahankan gambaran idiom Ibrani secara wajar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang sederhana dan bermartabat. Dua bentuk nama dalam teks sumber dipertahankan dalam teks utama karena perbedaannya nyata dan referennya tidak meragukan. Tidak ada penanda catatan kaki karena semua informasi tekstual yang diperlukan tercermin langsung dalam terjemahan.
