source:
  edition: WLC
  text: וַ/יַּ֤עַן מֹשֶׁה֙ וַ/יֹּ֔אמֶר וְ/הֵן֙ לֹֽא יַאֲמִ֣ינוּ לִ֔/י וְ/לֹ֥א יִשְׁמְע֖וּ בְּ/קֹלִ֑/י כִּ֣י יֹֽאמְר֔וּ לֹֽא נִרְאָ֥ה אֵלֶ֖י/ךָ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/001.yaml
  text: Then Moses answered and said[a], “But behold, they will not believe me, and they will not listen to my voice, for they will say[b], ‘Yahweh has not appeared to you.’”
translation:
  language: id
  text: Lalu Musa menjawab, “Namun, mereka tidak akan percaya kepadaku dan tidak akan mendengarkan perkataanku[a], sebab mereka akan berkata, ‘Yahweh tidak menampakkan diri kepadamu.’”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “mendengarkan suaraku”; ungkapan ini juga dapat berarti “mendengarkan aku” atau “mengindahkan perkataanku”.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Yahweh tidak tampak kepadamu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן מֹשֶׁה וַיֹּאמֶר
  choice: Lalu Musa menjawab
  rationale: Gabungan dua verba tutur Ibrani secara harfiah berbunyi ‘Musa menjawab dan berkata’. Dalam narasi Indonesia modern, ‘Musa menjawab’ menyampaikan fungsi dialogisnya secara wajar tanpa pengulangan yang kaku.
- source_word: וְהֵן
  choice: Tetapi bagaimana jika
  rationale: Partikel ini memperkenalkan keberatan atau kemungkinan yang diajukan Musa. Dalam konteks ini, ‘Tetapi bagaimana jika’ lebih alami daripada ‘lihatlah’ dan tetap mempertahankan nada kekhawatiran, tanpa memastikan bahwa penolakan itu pasti terjadi.
- source_word: לֹא יַאֲמִינוּ לִי
  choice: mereka tidak percaya kepadaku
  rationale: Bentuk Hifil dari אמן dengan objek personal berarti memercayai atau menerima perkataan seseorang; terjemahan ini alami dan tepat dalam bahasa Indonesia.
- source_word: וְלֹא יִשְׁמְעוּ בְּקֹלִי
  choice: dan tidak mau mendengarkan perkataanku
  rationale: Ungkapan שמע בקול dapat berarti mendengarkan, mengindahkan, atau menaati. ‘Tidak mau mendengarkan perkataanku’ mempertahankan unsur mendengar sekaligus menyiratkan penolakan, tanpa mempersempitnya menjadi ketaatan saja.
- source_word: כִּי יֹאמְרוּ
  choice: Mereka akan berkata
  rationale: כִּי dapat memperkenalkan alasan atau isi penjelas bagi keberatan Musa. Pemisahan menjadi kalimat langsung kedua menghasilkan bahasa Indonesia yang lancar dan mempertahankan hubungan logisnya.
- source_word: לֹא נִרְאָה אֵלֶיךָ
  choice: tidak menampakkan diri kepadamu
  rationale: Nifal dari ראה di sini berarti ‘tampak/menampakkan diri’. Bentuk Indonesia ini wajar untuk penampakan ilahi dan tidak mengubah pelakunya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton dipertahankan sebagai nama diri ‘Yahweh’, bukan diganti dengan gelar.
theological_decisions:
- issue: Kepastian atau kemungkinan penolakan Israel
  choice: bagaimana jika mereka tidak percaya
  alternative: mereka tidak akan percaya
  rationale: Bentuk verba Ibrani dapat diterjemahkan sebagai tindakan mendatang, tetapi dalam konteks jawaban Musa kepada Allah, וְהֵן memperkenalkan keberatan yang bersifat hipotetis. Pilihan ini menjaga ketegangan naratif tanpa menyatakan bahwa Musa mengetahui penolakan itu sebagai kepastian.
- issue: Makna שׁמע בקול
  choice: mendengarkan perkataanku
  alternative: menaati aku
  rationale: Ungkapan tersebut dapat mencakup mengindahkan atau menaati, tetapi konteks langsung berkenaan dengan penerimaan terhadap kesaksian Musa. ‘Menaati’ akan mempersempit maknanya secara teologis dan pragmatis.
- issue: Penyebutan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama diri ilahi secara langsung. Transliterasi mempertahankan perbedaan antara nama tersebut dan gelar ‘Tuhan’.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan ‘menjawab dan berkata’ dipadatkan secara idiomatis, sementara keberatan Musa disampaikan sebagai kemungkinan alami dalam dialog. Semua penanda catatan kaki ditempatkan pada bagian teks yang dijelaskan.
