  text: וְ/אָמַרְתָּ֖ אֶל פַּרְעֹ֑ה כֹּ֚ה אָמַ֣ר יְהוָ֔ה בְּנִ֥/י בְכֹרִ֖/י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/004/022.yaml
  text: 'Then you shall say to Pharaoh[a], ‘Thus says Yahweh: Israel is my firstborn son.’'
translation:
  language: id
  text: 'Kemudian katakanlah kepada Firaun, “Beginilah firman Yahweh: Israel adalah anak-Ku, anak sulung-Ku.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Israel adalah anak sulung-Ku.”'
    reason: 'Alternatif ini menyatukan “anak-Ku” dan “anak sulung-Ku” menjadi satu frasa yang alami dalam bahasa Indonesia, sedangkan teks utama lebih dekat mengikuti urutan Ibrani: “anak-Ku, anak sulung-Ku.”'
lexical_decisions:
- source_word: וְ/אָמַרְתָּ
  choice: Kemudian katakanlah
  rationale: Bentuk Qal perfektum orang kedua maskulin tunggal dengan waw berfungsi sebagai perintah dalam rangkaian tindakan. “Kemudian” menyatakan urutan, sedangkan “katakanlah” mempertahankan daya direktifnya.
- source_word: אֶל פַּרְעֹה
  choice: kepada Firaun
  rationale: אֶל menandai pihak yang dituju; פַּרְעֹה diterjemahkan menurut bentuk baku bahasa Indonesia, “Firaun”.
- source_word: כֹּה אָמַר
  choice: Beginilah firman
  rationale: Ungkapan formulaik pembawa pesan ini diterjemahkan dengan rumusan Indonesia yang alami, khidmat, dan lazim untuk memperkenalkan perkataan ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: בְּנִי
  choice: anak-Ku
  rationale: Nomina dengan sufiks orang pertama tunggal berarti “anak-Ku”; dalam konteks metafora hubungan ayah-anak ini, gender maskulin juga tercermin melalui keterangan “anak sulung-Ku”.
- source_word: בְכֹרִי
  choice: anak sulung-Ku
  rationale: Kata ini menunjukkan status anak sulung dan mempertahankan cakupan makna kekeluargaan, hukum, kehormatan, serta perjanjian tanpa menentukan salah satunya secara berlebihan.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama diri dipertahankan dalam bentuk baku Indonesia dan berfungsi sebagai subjek klausa nominal.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama perjanjian secara langsung. Transliterasi “Yahweh” mempertahankan nama itu alih-alih menggantinya dengan gelar.
- issue: Metafora hubungan Israel sebagai anak
  choice: Israel adalah anak-Ku, anak sulung-Ku
  alternative: Israel adalah anak sulung-Ku
  rationale: Susunan pilihan utama mengikuti urutan dan aposisi Ibrani secara lebih dekat serta mempertahankan penekanan ganda pada hubungan sebagai anak dan status sebagai anak sulung. Alternatif yang lebih ringkas juga mungkin secara sintaksis dan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Formula “Beginilah firman Yahweh” mempertahankan corak resmi pewartaan ilahi; kapital pada sufiks “-Ku” mengikuti konvensi ejaan religius Indonesia.
