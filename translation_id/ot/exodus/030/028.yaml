  text: juga mezbah kurban bakaran beserta segala perlengkapannya, dan bejana beserta alasnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: mazbah kurban bakaran
  rationale: מִזְבַּח berarti tempat persembahan kurban, dan הָעֹלָה menunjuk pada kurban yang dibakar seluruhnya. Ungkapan ini mempertahankan istilah ritual yang khas dan tetap wajar dalam bahasa Indonesia Alkitabiah modern.
- source_word: כָּל כֵּלָיו
  choice: segala perlengkapannya
  rationale: כְּלִי dapat berarti perkakas, wadah, atau perlengkapan. Dalam konteks mazbah, 'perlengkapan' cukup luas untuk mencakup berbagai benda terkait, sedangkan akhiran pronominalnya dirujukkan kepada mazbah.
- source_word: הַכִּיֹּר
  choice: bejana pembasuhan
  rationale: כִּיּוֹר adalah wadah air yang dipakai untuk pembasuhan dalam pelayanan di tempat kudus. 'Bejana pembasuhan' lebih jelas dan fungsional daripada sekadar 'bejana' atau istilah lama yang kurang umum.
- source_word: כַּנּוֹ
  choice: penyangganya
  rationale: כֵּן di sini menunjuk pada struktur penopang atau dudukan bejana. 'Penyangga' mengungkapkan fungsinya secara alami; 'alas' tetap merupakan kemungkinan leksikal.
- source_word: וְאֶת
  choice: juga ... dan
  rationale: וְ mengoordinasikan unsur-unsur dalam daftar, sedangkan אֶת adalah penanda objek langsung yang tidak perlu diterjemahkan tersendiri. Karena ayat ini melanjutkan daftar dari ayat sebelumnya, 'juga' menjaga kesinambungan sintaksis.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. 'Mazbah' dipertahankan sebagai istilah kultis yang sudah mapan; istilah lain dibuat transparan bagi pembaca modern. Tidak ada catatan kaki karena alternatif 'alas' tidak mengubah makna secara berarti dan teks Indonesia dapat menyampaikan rujukan secara jelas.
