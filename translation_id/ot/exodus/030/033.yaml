  text: Whoever compounds any like it[a], or puts any of it on a stranger[b], shall be cut off from his people.
translation:
  language: id
  text: Siapa pun yang meracik minyak yang serupa dengan itu, atau mengoleskan sebagian darinya pada orang yang tidak berwenang[a], akan diputuskan dari bangsanya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang asing”, “orang luar”, atau “orang awam”. Dalam konteks ini, kata Ibrani zar biasanya berarti orang yang tidak diizinkan menerima atau menggunakan sesuatu yang kudus.'
    reason: lexical_alternative
  - marker: b
    text: “Akan diputuskan dari bangsanya” merupakan rumusan hukum perjanjian. Ayat ini tidak menyebutkan secara khusus bagaimana hukuman itu dilaksanakan.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  choice: Siapa pun yang
  rationale: Ungkapan ini berfungsi secara umum dalam ketentuan hukum dan menunjuk kepada siapa saja yang melakukan tindakan tersebut.
- source_word: יִרְקַח
  choice: meracik
  rationale: Kata kerja רקח menunjuk pada pencampuran atau peracikan bahan wewangian; 'meracik' alami dalam bahasa Indonesia dan sesuai dengan konteks minyak urapan.
- source_word: כָּמֹהוּ
  choice: minyak yang serupa dengan itu
  rationale: Ungkapan ini merujuk kembali kepada minyak urapan kudus dalam konteks sebelumnya. Penyebutan 'minyak' memperjelas acuan tanpa menentukan bahwa keserupaannya harus mutlak dalam setiap segi.
- source_word: וַאֲשֶׁר יִתֵּן מִמֶּנּוּ
  choice: atau mengoleskan sebagian darinya
  rationale: נתן על dalam konteks minyak berarti menaruh atau mengaplikasikannya pada seseorang; 'mengoleskan' menyampaikan tindakan itu dengan wajar.
- source_word: עַל זָר
  choice: pada orang yang tidak berwenang
  rationale: Dalam konteks ibadah imamat, זָר terutama menunjuk kepada orang di luar lingkup yang diizinkan menerima minyak kudus, bukan semata-mata orang asing secara etnis.
- source_word: וְנִכְרַת מֵעַמָּיו
  choice: harus disingkirkan dari tengah-tengah bangsanya
  rationale: Terjemahan ini mempertahankan rumusan hukum perjanjian tentang pemutusan dari umat tanpa menetapkan cara pelaksanaan hukuman yang tidak dijelaskan dalam ayat.
theological_decisions:
- issue: Makna זָר dalam hukum kekudusan imamat
  choice: orang yang tidak berwenang
  alternative: orang asing; orang luar; orang awam
  rationale: Konteks membatasi pemakaian minyak urapan kudus kepada pihak yang ditetapkan. Pilihan ini menghindari kesan bahwa larangan tersebut terutama didasarkan pada etnis, sambil mengakui alternatif harfiahnya dalam catatan kaki.
- issue: Makna hukuman וְנִכְרַת מֵעַמָּיו
  choice: harus disingkirkan dari tengah-tengah bangsanya
  alternative: harus dilenyapkan dari bangsanya; harus dikucilkan dari bangsanya; harus dihukum mati
  rationale: Ungkapan Ibrani merupakan formula hukum perjanjian, tetapi ayat ini tidak menjelaskan apakah pelaksanaannya berupa kematian, tindakan ilahi, atau pengucilan. Terjemahan tidak menyelesaikan ketegangan itu secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat mempertahankan kesejajaran dua pelanggaran dan rumusan hukum pada akhir ayat. Istilah teknis dijelaskan melalui catatan kaki tanpa membebani teks utama.
