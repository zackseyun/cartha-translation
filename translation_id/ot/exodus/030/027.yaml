  language: id
  text: dan meja beserta segala perlengkapannya, kaki pelita beserta perlengkapannya, dan mazbah dupa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: meja
  rationale: Kata ini berarti “meja”; konteks Kemah Suci sudah menjelaskan bahwa yang dimaksud ialah meja kudus, sehingga sebutan yang lebih panjang tidak perlu ditambahkan.
- source_word: כָּל כֵּלָיו
  choice: segala perlengkapannya
  rationale: כְּלִי mencakup berbagai perkakas, wadah, atau peralatan. “Perlengkapan” alami dalam bahasa Indonesia dan cukup luas untuk mencakup semua benda yang terkait dengan meja.
- source_word: הַמְּנֹרָה
  choice: kaki pelita
  rationale: Istilah ini diterjemahkan menurut bentuk dan fungsinya, bukan ditransliterasikan. “Kaki pelita” merupakan ungkapan Indonesia yang jelas dan sesuai dengan perlengkapan Kemah Suci.
- source_word: כֵּלֶיהָ
  choice: perlengkapannya
  rationale: Kata dasarnya memiliki cakupan yang sama dengan כְּלִי sebelumnya, sedangkan akhiran feminin merujuk kepada kaki pelita. Tidak ditambahkan “segala” karena כֹּל tidak terdapat pada frasa ini.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: mazbah dupa
  rationale: Frasa konstruksi ini menunjuk kepada mazbah yang digunakan untuk dupa. “Mazbah dupa” ringkas, jelas, dan mempertahankan hubungan kedua nomina tanpa menambahkan tindakan yang tidak dinyatakan secara eksplisit.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan khidmat. Struktur daftar serta perbedaan antara “segala perlengkapannya” pada meja dan “perlengkapannya” pada kaki pelita dipertahankan. Tidak digunakan catatan kaki karena alternatif “mazbah pembakaran dupa” tidak mencerminkan ambiguitas substantif dalam teks sumber.
