  text: זֶ֣ה יִתְּנ֗וּ כָּל הָ/עֹבֵר֙ עַל הַ/פְּקֻדִ֔ים מַחֲצִ֥ית הַ/שֶּׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ עֶשְׂרִ֤ים גֵּרָה֙ הַ/שֶּׁ֔קֶל מַחֲצִ֣ית הַ/שֶּׁ֔קֶל תְּרוּמָ֖ה לַֽ/יהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/013.yaml
  text: 'This is what everyone who passes over to those who are numbered shall give: half a shekel according to the sanctuary shekel (the shekel is twenty gerahs)[a], half a shekel as an offering to Yahweh.'
translation:
  language: id
  text: 'Inilah yang harus diberikan oleh setiap orang yang terdaftar dalam sensus[a]: setengah syikal menurut syikal tempat kudus (satu syikal sama dengan dua puluh gera), setengah syikal sebagai persembahan kepada Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “setiap orang yang melewati/menyeberang kepada orang-orang yang didata”; ungkapan Ibrani ini adalah idiom sensus bagi orang yang masuk dalam hitungan resmi.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה יִתְּנוּ
  choice: Inilah yang harus diberikan
  rationale: Rumus penunjuk זֶה dan daya preskriptif bentuk imperfek diterjemahkan secara alami sebagai ketentuan hukum dalam bahasa Indonesia modern.
- source_word: כָּל הָעֹבֵר עַל הַפְּקֻדִים
  choice: setiap orang yang masuk dalam bilangan mereka yang terdaftar
  rationale: Ungkapan harfiah tentang ‘melewati/masuk di antara mereka yang didata’ merupakan idiom sensus. Pilihan ini mempertahankan citra masuk ke dalam hitungan tanpa mengaburkan konteks pendaftaran.
- source_word: מַחֲצִית הַשֶּׁקֶל
  choice: setengah syikal
  rationale: Padanan langsung dan lazim untuk jumlah berat atau uang tersebut.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: menurut syikal tempat kudus
  rationale: Preposisi בְּ menyatakan tolok ukur; frasa ini menunjukkan bahwa jumlah tersebut dihitung berdasarkan standar syikal resmi tempat kudus.
- source_word: עֶשְׂרִים גֵּרָה הַשֶּׁקֶל
  choice: satu syikal sama dengan dua puluh gera
  rationale: Menyampaikan keterangan definisional tentang satuan itu dengan jelas dan alami.
- source_word: תְּרוּמָה לַיהוָה
  choice: sebagai persembahan kepada Yahweh
  rationale: תְּרוּמָה adalah pemberian yang dikhususkan bagi Allah; ‘persembahan’ mempertahankan nuansa ibadah sekaligus mudah dipahami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani secara langsung memakai Tetragramaton; transliterasi ‘Yahweh’ mempertahankan nama perjanjian tersebut tanpa menggantinya dengan gelar.
- issue: Makna תְּרוּמָה dalam konteks pungutan sensus
  choice: persembahan
  alternative: sumbangan
  rationale: ‘Persembahan’ menjaga dimensi bahwa pemberian itu dikhususkan bagi Yahweh, sedangkan ‘sumbangan’ dapat terdengar semata-mata administratif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah ukuran kuno ‘syikal’ dan ‘gera’ dipertahankan, sedangkan hubungan nilainya dijelaskan langsung dalam teks. Penanda catatan kaki ditempatkan pada ungkapan sensus yang diterangkannya.
