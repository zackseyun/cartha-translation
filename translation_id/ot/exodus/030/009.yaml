  yaml_path: translation/ot/exodus/030/009.yaml
  text: You shall not offer unauthorized incense on it[a], or a burnt offering, or a grain offering; and you shall not pour out a drink offering on it.
translation:
  language: id
  text: Janganlah kamu mempersembahkan di atasnya dupa yang tidak diizinkan[a], kurban bakaran, atau persembahan sajian; dan janganlah kamu mencurahkan persembahan curahan di atasnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dupa asing”, “dupa yang tidak sah”, atau “dupa yang tidak diperintahkan”. Kata Ibrani ini dalam konteks peribadatan dapat berarti sesuatu yang berada di luar ketetapan atau izin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲלוּ
  choice: mempersembahkan
  rationale: Bentuk Hifil dari עלה secara harfiah berarti membuat naik, tetapi dalam konteks mezbah secara idiomatis berarti mempersembahkan.
- source_word: עָלָיו
  choice: di atasnya
  rationale: Merujuk kepada mezbah pembakaran dupa dalam konteks sebelumnya dan mempertahankan hubungan ruang dalam teks Ibrani.
- source_word: קְטֹרֶת זָרָה
  choice: dupa yang tidak diperintahkan
  rationale: Dalam konteks peribadatan, זָרָה menunjuk kepada sesuatu yang berada di luar ketetapan atau izin. Ungkapan ini jelas bagi pembaca modern tanpa menyempitkannya menjadi sesuatu yang sekadar asing secara etnis.
- source_word: עֹלָה
  choice: kurban bakaran
  rationale: Istilah baku dan jelas bagi persembahan yang dibakar di atas mezbah.
- source_word: מִנְחָה
  choice: persembahan sajian
  rationale: Dalam konteks hukum kurban, istilah ini menunjuk kepada persembahan bahan pangan, biasanya dari hasil biji-bijian. 'Persembahan sajian' tetap alami dan tidak mengharuskan bahwa setiap bentuknya berupa biji-bijian utuh.
- source_word: נֵסֶךְ
  choice: persembahan curahan
  rationale: Menunjuk kepada persembahan cair yang dicurahkan; pilihan ini mempertahankan hubungan dengan tindakan mencurahkan yang disebut oleh verba berikutnya.
- source_word: תִסְּכוּ
  choice: mencurahkan
  rationale: Dalam konteks ritual, נסך berarti menuangkan atau mencurahkan cairan sebagai persembahan.
theological_decisions:
- issue: Makna kultis זָרָה yang menerangkan dupa
  choice: dupa yang tidak diperintahkan
  alternative: dupa asing; dupa yang tidak sah
  rationale: Pilihan ini mempertahankan fokus hukum peribadatan pada dupa yang tidak ditetapkan untuk mezbah tersebut, tanpa memberi kesan bahwa masalahnya semata-mata adalah asal asing.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Bentuk tunggal pada sufiks עָלָיו dipertahankan dengan 'di atasnya', yang dalam konteks merujuk kepada mezbah dupa. Rangkaian ו pada daftar larangan diterjemahkan secara idiomatis dengan koma dan 'ataupun'.
