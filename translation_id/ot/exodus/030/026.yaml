source:
  edition: WLC
  text: וּ/מָשַׁחְתָּ֥ ב֖/וֹ אֶת אֹ֣הֶל מוֹעֵ֑ד וְ/אֵ֖ת אֲר֥וֹן הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/026.yaml
  text: With it you shall anoint the tent of meeting and the ark of the testimony[a].
translation:
  language: id
  text: Dengan minyak itu, engkau harus mengurapi Kemah Pertemuan dan tabut Kesaksian[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, menurut sebutan yang lebih tradisional, “tabut perjanjian”; teks Ibrani di sini berbunyi “Kesaksian”.
    reason: alternative_reading
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: engkau harus mengurapi
  rationale: Bentuk Qal perfektum orang kedua tunggal maskulin dengan kata sambung berada dalam rangkaian petunjuk dan berfungsi sebagai perintah. “Mengurapi” merupakan padanan baku dan tepat bagi משׁח dalam konteks ibadah.
- source_word: בּוֹ
  choice: dengan minyak itu
  rationale: Preposisi ב dengan sufiks orang ketiga tunggal maskulin menunjuk kembali kepada minyak urapan dalam konteks sebelumnya. Penyebutan “minyak” membuat rujukannya jelas dan mempertahankan makna instrumental.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Padanan yang mapan, ringkas, dan setia pada frasa konstruksi Ibrani untuk kemah tempat pertemuan dengan Allah.
- source_word: אֲרוֹן
  choice: tabut
  rationale: Dalam konteks Kemah Suci, “tabut” adalah istilah Indonesia yang lazim dan tepat bagi peti kudus tersebut.
- source_word: הָעֵדֻת
  choice: Kesaksian
  rationale: Padanan langsung ini mempertahankan pilihan leksikal teks Ibrani dan tidak menggantinya dengan “perjanjian”, meskipun istilah terakhir lebih dikenal dalam sebutan tradisional.
theological_decisions:
- issue: Penerjemahan אֲרוֹן הָעֵדֻת
  choice: tabut Kesaksian
  alternative: tabut perjanjian; tabut kesaksian
  rationale: Teks Ibrani secara eksplisit memakai עֵדֻת, “Kesaksian”, bukan kata “perjanjian”. Terjemahan utama mempertahankan istilah sumber, sedangkan sebutan tradisional dicatat dalam catatan kaki tanpa menghapus perbedaan leksikal tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “engkau” mempertahankan bentuk orang kedua tunggal; “harus” menyampaikan daya perintah dalam rangkaian petunjuk. Huruf kapital pada “Kemah Pertemuan” dan “Kesaksian” menandai sebutan khusus dalam konteks ibadah.
