base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/004.yaml
  text: And you shall make two gold rings for it under its molding[a]; on its two side panels you shall make them, on its two sides[c][b], and they shall be holders for poles with which to carry it.
translation:
  language: id
  text: Buatlah dua cincin emas untuknya, di bawah tepian hiasnya[a]. Buatlah cincin-cincin itu pada kedua bidang sampingnya, pada kedua sisinya[b]. Cincin-cincin itu harus menjadi tempat bagi batang-batang pengusung[c], untuk mengusungnya dengan batang-batang itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “di bawah bingkainya” atau “di bawah lisnya”. Kata Ibrani זֵר menunjuk pada tepian hias yang mengelilingi mezbah.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “pada kedua bagian sampingnya ... pada kedua sisinya”; uraian yang agak berulang ini menegaskan bahwa cincin-cincin itu ditempatkan pada kedua sisi.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “menjadi rumah-rumah bagi batang-batang pengusung”, yaitu menjadi tempat atau wadah bagi batang-batang tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת זָהָב
  choice: gelang emas
  rationale: טַבַּעַת menunjuk pada gelang atau cincin pengait; “gelang emas” alami dalam bahasa Indonesia dan mempertahankan bahan pembuatnya.
- source_word: מִתַּחַת לְזֵרוֹ
  choice: di bawah bingkainya
  rationale: זֵר adalah tepian hias yang mengelilingi mezbah. “Bingkai” sesuai dengan benda buatan dan cukup jelas bagi pembaca modern.
- source_word: צַלְעֹתָיו
  choice: kedua bidang sampingnya
  rationale: צֵלָע dapat berarti rusuk, sisi, atau bagian struktur di samping. “Bidang samping” menyampaikan unsur struktural tanpa memakai “rusuk” yang berpotensi membingungkan.
- source_word: עַל שְׁנֵי צִדָּיו
  choice: pada kedua sisinya
  rationale: Frasa ini mengulangi penempatan pada dua sisi. Terjemahan mempertahankan pengulangan penegas dalam bahasa Ibrani.
- source_word: וְהָיָה לְבָתִּים לְבַדִּים
  choice: gelang-gelang itu harus menjadi tempat bagi kayu-kayu pengusung
  rationale: בָּתִּים secara harfiah berarti “rumah-rumah”, tetapi di sini merupakan wadah atau tempat untuk memasukkan kayu pengusung. Ungkapan fungsional ini jelas dan wajar.
- source_word: בַדִּים
  choice: kayu-kayu pengusung
  rationale: Dalam konteks perlengkapan Kemah Suci, בַּד menunjuk pada batang atau kayu yang dipakai untuk mengusung. Pilihan ini menjelaskan fungsi sekaligus tetap ringkas.
- source_word: לָשֵׂאת אֹתוֹ בָּהֵמָּה
  choice: untuk mengangkutnya dengan kayu-kayu itu
  rationale: Terjemahan ini mempertahankan tujuan tindakan dan arti instrumental בָּהֵמָּה, yakni bahwa benda tersebut diangkut dengan kayu-kayu pengusung itu.
- source_word: תַּעֲשֶׂה ... תַּעֲשֶׂה
  choice: Buatlah ... Buatlah
  rationale: Bentuk perintah menyampaikan nada instruksi, dan pengulangannya dipertahankan sesuai susunan bahasa Ibrani.
