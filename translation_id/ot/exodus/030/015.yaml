  text: הֶֽ/עָשִׁ֣יר לֹֽא יַרְבֶּ֗ה וְ/הַ/דַּל֙ לֹ֣א יַמְעִ֔יט מִֽ/מַּחֲצִ֖ית הַ/שָּׁ֑קֶל לָ/תֵת֙ אֶת תְּרוּמַ֣ת יְהוָ֔ה לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/015.yaml
  text: The rich shall not give more[a], and the poor shall not give less, than the half-shekel, when giving the contribution to Yahweh to make atonement for your lives.
translation:
  language: id
  text: Orang kaya tidak boleh memberi lebih dari setengah syikal, dan orang miskin tidak boleh memberi kurang dari jumlah itu, ketika memberikan persembahan kepada Yahweh untuk mengadakan pendamaian bagi nyawa kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bagi jiwa kalian,” “bagi diri kalian,” atau “bagi hidup kalian.” Kata Ibrani nefesh dapat berarti jiwa, diri, orang, nyawa, atau hidup. Dalam konteks pembayaran sensus ini, yang dimaksud kemungkinan besar ialah nyawa atau diri orang-orang yang dihitung.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָשִׁיר
  choice: orang kaya
  rationale: Adjektiva berartikel ini berfungsi sebagai nomina dan mewakili golongan orang kaya; bentuk ini alami dalam bahasa Indonesia.
- source_word: יַרְבֶּה
  choice: tidak boleh memberi lebih
  rationale: Dalam konteks pungutan dengan jumlah tetap, verba ini berarti tidak menambah jumlah pemberian.
- source_word: הַדַּל
  choice: orang miskin
  rationale: Istilah ini menunjuk orang yang berkekurangan secara ekonomi dan membentuk kontras langsung dengan orang kaya.
- source_word: יַמְעִיט
  choice: tidak boleh memberi kurang
  rationale: Ungkapan ini mempertahankan kesejajaran hukum dengan 'tidak boleh memberi lebih' dan menyatakan larangan mengurangi jumlah yang ditetapkan.
- source_word: מִמַּחֲצִית הַשָּׁקֶל
  choice: dari setengah syikal
  rationale: Dengan konstruksi komparatif sesudah larangan memberi lebih atau kurang, frasa ini menyatakan jumlah baku yang menjadi patokan.
- source_word: תְּרוּמַת יְהוָה
  choice: persembahan kepada Yahweh
  rationale: תְּרוּמָה ialah pemberian yang dikhususkan bagi keperluan kudus; 'persembahan' merupakan istilah Indonesia yang jelas, sementara 'kepada' menunjukkan arah pemberian.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: לְכַפֵּר
  choice: untuk mengadakan pendamaian
  rationale: Terjemahan ini mempertahankan bobot kultis כפר tanpa menetapkan satu teori khusus tentang cara pendamaian berlangsung.
- source_word: עַל נַפְשֹׁתֵיכֶם
  choice: bagi nyawa kalian
  rationale: Dalam konteks uang sensus atau tebusan, נֶפֶשׁ menunjuk kehidupan atau diri orang-orang yang dihitung, bukan secara khusus unsur nonjasmani.
- source_word: לָתֵת
  choice: ketika memberikan
  rationale: Infinitif ini paling alami dipahami sebagai keadaan yang menyertai penyerahan jumlah yang telah ditentukan.
theological_decisions:
- issue: Penerjemahan nama YHWH
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memuat nama diri ilahi; transliterasi 'Yahweh' menjaganya sebagai nama dan menghindari penggantian diam-diam dengan sebuah gelar.
- issue: Makna נֶפֶשׁ dalam konteks pendamaian
  choice: nyawa kalian
  alternative: jiwa kalian; diri kalian; hidup kalian
  rationale: Konteks pembayaran sensus menunjuk nyawa atau kehidupan orang yang dihitung. Catatan kaki mempertahankan keluasan makna istilah Ibrani dan mencegah pembacaan antropologis yang terlalu sempit.
- issue: Penerjemahan כפר
  choice: mengadakan pendamaian
  alternative: mengadakan penebusan; mendamaikan
  rationale: Istilah kultis ini dibiarkan cukup luas dan tidak dipersempit menjadi teori tertentu tentang pendamaian atau penebusan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-kultis yang bermartabat. Kesejajaran 'tidak boleh memberi lebih ... tidak boleh memberi kurang' dipertahankan. Pronomina jamak 'kalian' dipakai untuk membedakan bentuk jamak Ibrani secara jelas.
