  yaml_path: translation/ot/exodus/030/032.yaml
  text: It shall not be poured on human flesh[a], and in its composition you shall not make any like it. It is holy; it shall be holy to you.
translation:
  language: id
  text: Minyak itu tidak boleh dituangkan pada tubuh manusia,[a] dan janganlah kamu membuat minyak lain menurut komposisinya. Minyak itu kudus; minyak itu harus kamu anggap kudus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “pada daging manusia.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִיסָךְ
  choice: dituangkan
  rationale: Bentuk pasif verba נסך menyatakan tindakan menuangkan atau mengenakan minyak. 'Dituangkan' mempertahankan tindakan konkret tanpa menggantinya dengan hasil ritual 'diurapi'.
- source_word: עַל בְּשַׂר אָדָם
  choice: pada tubuh manusia
  rationale: Secara harfiah berarti 'pada daging manusia'; אָדָם bersifat generik. Dalam bahasa Indonesia modern, 'tubuh manusia' menyampaikan larangan pemakaian pada manusia dengan wajar, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וּבְמַתְכֻּנְתּוֹ
  choice: dengan komposisi yang sama
  rationale: מַתְכֹּנֶת menunjuk pada susunan atau takaran campuran. Frasa ini secara alami menyatakan larangan membuat campuran lain menurut komposisi minyak tersebut.
- source_word: לֹא תַעֲשׂוּ כָּמֹהוּ
  choice: janganlah kamu membuat minyak lain ... yang sama
  rationale: Konstruksi komparatif כָּמֹהוּ melarang pembuatan benda lain yang serupa atau sama dengan minyak kudus itu; penyebutan 'minyak lain' memperjelas acuan tersirat tanpa mengubah larangannya.
- source_word: קֹדֶשׁ הוּא
  choice: Minyak itu kudus
  rationale: קֹדֶשׁ menyatakan kekudusan atau status yang dikhususkan. 'Kudus' mempertahankan istilah teologis utama, dan 'minyak itu' memperjelas subjek dalam bahasa Indonesia.
- source_word: קֹדֶשׁ יִהְיֶה לָכֶם
  choice: haruslah itu kudus bagimu
  rationale: Ungkapan ini mempertahankan relasi yang dinyatakan oleh לָכֶם serta daya normatif bentuk imperfek dalam konteks perintah.
theological_decisions:
- issue: Cakupan אָדָם dalam frasa בְּשַׂר אָדָם
  choice: manusia
  alternative: laki-laki / Adam
  rationale: Di sini אָדָם menunjuk secara generik kepada manusia, bukan khusus kepada laki-laki dan bukan nama diri Adam. Terjemahan 'manusia' mempertahankan cakupan tersebut tanpa memasukkan pembatasan gender yang tidak ada dalam konteks.
- issue: Pengulangan קֹדֶשׁ
  choice: kudus ... kudus
  alternative: suci ... dikhususkan
  rationale: Pengulangan istilah yang sama dipertahankan untuk mencerminkan penegasan teks bahwa minyak itu memiliki status kudus dan harus diperlakukan demikian oleh umat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'janganlah' dan 'haruslah' mempertahankan nada normatif, sedangkan 'tubuh manusia' dipilih agar larangan mudah dipahami tanpa menghilangkan bentuk harfiah yang dicatat dalam catatan kaki.
