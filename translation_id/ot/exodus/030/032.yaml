  terminology: Istilah 'kudus' tepat untuk קֹדֶשׁ dan pengulangannya sebaiknya dipertahankan. 'Komposisi' tepat untuk מַתְכֻּנֶת, sedangkan 'menurut komposisinya' merepresentasikan sufiks posesif Ibrani dengan lebih langsung.
