  text: And you shall make an altar for burning incense[a]; you shall make it of acacia wood.
translation:
  language: id
  text: “Buatlah sebuah mezbah untuk membakar dupa[a]; buatlah mezbah itu dari kayu akasia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih ringkas, “sebuah mezbah dupa”. Secara lebih harfiah, bahasa Ibrani berbunyi “sebuah mezbah untuk membakar dupa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Buatlah
  rationale: Bentuk Qal perfektif orang kedua tunggal maskulin dengan waw dalam rangkaian petunjuk berfungsi sebagai perintah. Imperatif Indonesia menyampaikan daya direktifnya secara alami; kesinambungan dengan konteks tidak perlu ditandai dengan kata sambung yang kaku.
- source_word: מִזְבֵּחַ
  choice: sebuah mazbah
  rationale: “Mazbah” adalah istilah Indonesia yang baku dan bermartabat untuk tempat persembahan ritual, serta membedakannya dari meja biasa. “Sebuah” wajar karena benda ini baru diperkenalkan.
- source_word: מִקְטַר קְטֹרֶת
  choice: untuk membakar dupa
  rationale: Ungkapan konstruksi ini menyatakan fungsi mazbah, yakni pembakaran dupa. Pilihan ini mempertahankan struktur dan makna fungsional Ibrani dengan lebih jelas daripada bentuk padat “mazbah dupa”.
- source_word: עֲצֵי שִׁטִּים
  choice: kayu akasia
  rationale: Ungkapan Ibrani secara idiomatis menunjuk pada kayu dari pohon akasia; “kayu akasia” merupakan padanan Indonesia yang alami dan tepat.
- source_word: תַּעֲשֶׂה אֹתוֹ
  choice: buatlah itu
  rationale: Pengulangan verba dalam teks Ibrani dipertahankan untuk mencerminkan penegasan kembali pada benda yang harus dibuat sebelum bahannya disebutkan. “Itu” secara jelas merujuk kepada mazbah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk imperatif “Buatlah” cocok untuk rangkaian petunjuk ilahi. Istilah “mazbah” dipertahankan sebagai kosakata Alkitabiah Indonesia yang tepat, sedangkan “dupa” mudah dipahami pembaca umum.
