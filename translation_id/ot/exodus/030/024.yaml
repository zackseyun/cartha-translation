  yaml_path: translation/ot/exodus/030/024.yaml
  text: and cassia[a], five hundred shekels by the sanctuary shekel, and a hin of olive oil.
translation:
  language: id
  text: dan kayu manis cina, lima ratus syikal menurut syikal tempat kudus, serta satu hin[a] minyak zaitun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hin adalah satuan cair kuno; banyak ahli memperkirakannya sekitar 3,5–4 liter.
    reason: cultural_note
lexical_decisions:
- source_word: קִדָּה
  choice: kayu manis cina
  rationale: Istilah ini menunjuk pada kasia, yaitu kulit kayu aromatik yang berkerabat dengan kayu manis. 'Kayu manis cina' merupakan padanan bahasa Indonesia yang lebih mudah dipahami daripada transliterasi 'kasia'.
- source_word: חֲמֵשׁ מֵאוֹת
  choice: lima ratus
  rationale: Bilangan kardinal ini menyatakan berat bahan tersebut.
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: menurut syikal tempat kudus
  rationale: Frasa ini menunjukkan bahwa berat dihitung berdasarkan standar syikal yang berlaku untuk tempat kudus.
- source_word: שֶׁמֶן זַיִת
  choice: minyak zaitun
  rationale: Bentuk konstruksi Ibrani ini secara wajar diterjemahkan sebagai 'minyak zaitun' dalam bahasa Indonesia.
- source_word: הִין
  choice: satu hin
  rationale: Nama satuan cair kuno dipertahankan agar ukuran khusus dalam teks sumber tidak diganti dengan perkiraan modern.
- source_word: וְ
  choice: dan / serta
  rationale: Konjungsi menghubungkan unsur-unsur ini dengan daftar bahan sebelumnya; variasi 'dan' dan 'serta' menghasilkan susunan Indonesia yang alami tanpa menghilangkan hubungan koordinatif.
