translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Ayat dipertahankan sebagai lanjutan daftar dari ayat sebelumnya. Istilah ukuran kuno 'syikal' dan 'hin' dipertahankan, sedangkan קִדָּה diterjemahkan dengan nama bahan yang lebih mudah dikenali.
