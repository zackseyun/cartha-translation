source:
  edition: WLC
  text: כֹּ֗ל הָ/עֹבֵר֙ עַל הַ/פְּקֻדִ֔ים מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָ/מָ֑עְלָ/ה יִתֵּ֖ן תְּרוּמַ֥ת יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/014.yaml
  text: Everyone who passes over to those who are counted[a], from twenty years old and upward, shall give Yahweh’s contribution.
translation:
  language: id
  text: Setiap orang yang masuk ke dalam kelompok orang-orang yang dihitung[a], yang berumur dua puluh tahun ke atas, harus memberikan persembahan bagi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “lewat di antara orang-orang yang didata.” Ungkapan Ibrani secara harfiah berbicara tentang seseorang yang “lewat” dalam hubungannya dengan orang-orang yang dihitung, kemungkinan merujuk pada tata cara sensus.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל הָעֹבֵר
  choice: Setiap orang yang masuk
  rationale: כֹּל memberi makna distributif ‘setiap orang’, sedangkan partisip הָעֹבֵר secara harfiah menggambarkan orang yang lewat atau berpindah. Dalam konteks sensus, ‘masuk’ mempertahankan unsur gerak sambil terdengar alami dalam bahasa Indonesia.
- source_word: עַל הַפְּקֻדִים
  choice: ke dalam bilangan orang-orang yang dihitung
  rationale: Ungkapan ini menunjuk kepada kelompok yang didata dalam sensus. Pilihan ini mempertahankan idiom prosedural Ibrani dan menghindari penyederhanaan penuh menjadi hanya ‘didaftar’.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: mulai dari yang berumur dua puluh tahun ke atas
  rationale: Ini merupakan rumus batas umur; terjemahan tersebut akurat dan wajar dalam bahasa Indonesia modern.
- source_word: יִתֵּן
  choice: harus memberikan
  rationale: Bentuk imperfek di sini mempunyai daya perintah dalam ketentuan hukum. ‘Harus’ menyampaikan kewajiban dengan jelas tanpa gaya yang usang.
- source_word: תְּרוּמַת
  choice: persembahan
  rationale: תְּרוּמָה adalah sesuatu yang disisihkan dan diberikan kepada Yahweh. ‘Persembahan’ mempertahankan dimensi religiusnya; konteks ayat-ayat sekitar menjelaskan bahwa bentuk konkretnya ialah pembayaran sensus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama diri ilahi secara langsung; ‘Yahweh’ mempertahankan fungsi nama itu.
- issue: Seberapa eksplisit idiom sensus diterjemahkan
  choice: masuk ke dalam bilangan orang-orang yang dihitung
  alternative: terhitung atau terdaftar
  rationale: Pilihan utama mempertahankan gambaran orang yang ‘lewat/masuk’ dalam kaitannya dengan kelompok yang dihitung, tanpa menutup kemungkinan bahwa ungkapan itu menggambarkan prosedur sensus.
- issue: Nuansa תְּרוּמָה dalam konteks uang pendamaian
  choice: persembahan
  alternative: sumbangan
  rationale: ‘Persembahan’ menjaga makna sesuatu yang dikhususkan bagi Yahweh, sedangkan ‘sumbangan’ dapat terdengar sukarela meskipun ketentuan ini wajib.
translation_notes:
  register: Bahasa hukum-keagamaan yang modern dan bermartabat. ‘Harus memberikan’ menyatakan kewajiban dengan jelas; idiom sensus tetap dipertahankan dalam bentuk yang dapat dipahami pembaca umum.
