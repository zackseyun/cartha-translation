  variant: modern standard Indonesian
source:
  edition: WLC
  text: בְּ/בֹאָ֞/ם אֶל אֹ֧הֶל מוֹעֵ֛ד יִרְחֲצוּ מַ֖יִם וְ/לֹ֣א יָמֻ֑תוּ א֣וֹ בְ/גִשְׁתָּ֤/ם אֶל הַ/מִּזְבֵּ֨חַ֙ לְ/שָׁרֵ֔ת לְ/הַקְטִ֥יר אִשֶּׁ֖ה לַֽ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/020.yaml
  text: When they enter the tent of meeting[a], they shall wash with water, so that they may not die; or when they come near the altar to minister, to burn a food offering to Yahweh[b],
translation:
  language: id
  text: Apabila mereka masuk ke Kemah Pertemuan, hendaklah mereka membasuh diri dengan air supaya mereka tidak mati[a]; atau apabila mereka mendekati mazbah untuk melayani, untuk membakar persembahan dengan api bagi Yahweh[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “agar jangan mereka mati” atau “dan mereka tidak akan mati.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “persembahan api.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבֹאָם
  choice: Apabila mereka masuk
  rationale: Preposisi ב dengan infinitif konstruk dan sufiks pronominal menyatakan waktu. “Apabila mereka masuk” alami dalam bahasa Indonesia dan mempertahankan gerakan memasuki kemah.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Istilah baku dan jelas untuk bangunan tempat pertemuan kudus; huruf kapital menandai nama khusus tempat ibadah itu.
- source_word: יִרְחֲצוּ מַיִם
  choice: mereka harus membasuh diri dengan air
  rationale: רחץ dengan מַיִם menyatakan pembasuhan ritual. “Harus” menyampaikan daya perintah bentuk imperfek dalam konteks hukum, sedangkan “diri” mengungkapkan objek refleksif yang tersirat tanpa menambahkan anggota tubuh dari ayat sebelumnya.
- source_word: וְלֹא יָמֻתוּ
  choice: supaya mereka tidak mati
  rationale: Walaupun secara bentuk merupakan klausa koordinatif, dalam konteks klausa ini menyatakan akibat atau tujuan pembasuhan. Catatan kaki mempertahankan kemungkinan terjemahan yang lebih harfiah.
- source_word: אוֹ
  choice: demikian juga apabila
  rationale: אוֹ memperkenalkan keadaan kedua yang mewajibkan pembasuhan. Dalam bahasa Indonesia, “demikian juga apabila” lebih alami daripada “atau apabila” karena kedua keadaan itu bukan pilihan yang saling meniadakan.
- source_word: בְגִשְׁתָּם אֶל־הַמִּזְבֵּחַ
  choice: apabila mereka mendekati mazbah
  rationale: נגשׁ berarti datang atau mendekat, termasuk dalam konteks pelayanan ritual. “Mazbah” mempertahankan istilah khusus bagi tempat mempersembahkan kurban.
- source_word: לְשָׁרֵת
  choice: untuk melayani
  rationale: Dalam konteks keimaman, “melayani” menyampaikan pelayanan resmi di tempat kudus secara alami dan tidak menambahkan rincian yang tidak dinyatakan.
- source_word: לְהַקְטִיר
  choice: untuk membakar
  rationale: Bentuk Hifil קטר menunjuk pada tindakan membuat persembahan naik sebagai asap di atas mazbah. “Membakar” ringkas dan alami; nuansa ritual diberikan oleh konteks persembahan.
- source_word: אִשֶּׁה
  choice: persembahan
  rationale: Istilah kultis ini berkaitan dengan persembahan yang dibakar atau dipersembahkan dengan api. Teks utama memakai ungkapan alami bersama verba “membakar”, sedangkan catatan kaki menyatakan alternatif yang lebih eksplisit.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menandai penerima persembahan, dan nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama pribadi dalam bentuk yang luas diterima secara ilmiah tanpa menggantinya dengan gelar.
- issue: Hubungan klausa וְלֹא יָמֻתוּ dengan perintah membasuh
  choice: supaya mereka tidak mati
  alternative: dan mereka tidak akan mati; atau agar jangan mereka mati
  rationale: Terjemahan utama menyampaikan fungsi tujuan atau akibat yang kuat dalam konteks hukum ritual, sementara catatan kaki mempertahankan koordinasi formal dan nuansa peringatan yang mungkin.
- issue: Makna kultis אִשֶּׁה
  choice: persembahan, dalam konstruksi “membakar persembahan”
  alternative: persembahan dengan api; persembahan yang dibakar
  rationale: Makna tepat istilah ini diperdebatkan. Susunan utama menghindari tafsiran “santapan” yang terlalu menentukan, sedangkan catatan kaki mempertahankan hubungan eksplisit dengan api.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kemah Pertemuan” dan “mazbah” dipakai sebagai istilah kultis yang ringkas. Tanda koma pada akhir ayat dipertahankan karena kalimat Ibrani berlanjut ke ayat berikutnya.
