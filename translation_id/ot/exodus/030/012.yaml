  terminology: “Yahweh” tepat untuk יהוה sesuai jejak audit. “Tebusan” tepat untuk כֹּפֶר dan tidak terlalu spesifik. “Wabah” merupakan padanan yang wajar bagi נֶגֶף dalam konteks ini. Catatan kaki dipertahankan, tetapi jangkar dipindahkan agar masing-masing langsung mengikuti istilah yang dijelaskannya.
  issues:
