id: EXO.30.12
reference: Exodus 30:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֣י תִשָּׂ֞א אֶת רֹ֥אשׁ בְּנֵֽי יִשְׂרָאֵ֘ל לִ/פְקֻדֵי/הֶם֒ וְ/נָ֨תְנ֜וּ אִ֣ישׁ כֹּ֧פֶר נַפְשׁ֛/וֹ לַ/יהוָ֖ה בִּ/פְקֹ֣ד אֹתָ֑/ם וְ/לֹא יִהְיֶ֥ה בָ/הֶ֛ם נֶ֖גֶף בִּ/פְקֹ֥ד אֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/012.yaml
  text: When you take a census of the sons of Israel according to those numbered among them[a], then each man shall give to Yahweh a ransom for his life when you number them[c][b], so that there will be no plague among them when you number them.
translation:
  language: id
  text: Apabila engkau mengadakan sensus[a] terhadap orang Israel untuk mendaftarkan mereka, setiap laki-laki harus memberikan kepada Yahweh tebusan bagi nyawanya[b] ketika engkau menghitung mereka, supaya tidak ada wabah di antara mereka ketika engkau menghitung mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mengangkat kepala orang Israel,” sebuah ungkapan untuk mengadakan sensus.
    reason: lexical_alternative
  - marker: b
    text: Atau “tebusan bagi dirinya.” Kata Ibrani nefesh di sini dapat berarti “nyawa” atau “diri,” bukan hanya “jiwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Apabila
  rationale: Partikel ini memperkenalkan keadaan temporal-kondisional dalam ketetapan hukum; “apabila” mempertahankan kedua nuansa itu secara alami.
- source_word: תִשָּׂא אֶת רֹאשׁ
  choice: mengadakan sensus atas
  rationale: Ungkapan harfiahnya berarti “mengangkat kepala,” tetapi dalam konteks administratif ini menunjuk pada penghitungan penduduk.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Dalam bahasa Indonesia modern, “orang Israel” secara alami menyatakan kelompok keturunan Israel tanpa menyiratkan negara modern.
- source_word: לִפְקֻדֵיהֶם
  choice: menurut jumlah mereka
  rationale: Frasa ini berkaitan dengan pencatatan atau penghitungan dalam sensus; terjemahan ini mempertahankan nuansa administratif tanpa pengulangan yang janggal.
- source_word: וְנָתְנוּ אִישׁ
  choice: setiap laki-laki harus memberikan
  rationale: אִישׁ bersifat distributif dan menunjuk pada tiap laki-laki yang termasuk dalam kelompok yang dihitung.
- source_word: כֹּפֶר
  choice: uang tebusan
  rationale: Istilah ini menunjuk pada pembayaran pengganti yang membebaskan atau menangkal hukuman; “uang tebusan” jelas dalam konteks pungutan sensus.
- source_word: נַפְשׁוֹ
  choice: bagi nyawanya
  rationale: נֶפֶשׁ di sini berarti kehidupan atau diri orang tersebut, bukan secara khusus jiwa yang tidak berwujud.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל sesuai dengan tindakan memberikan, dan nama perjanjian יהוה ditransliterasikan sebagai “Yahweh.”
- source_word: בִּפְקֹד אֹתָם
  choice: ketika engkau menghitung mereka
  rationale: Infinitif dengan בְּ menyatakan waktu atau keadaan saat pembayaran itu harus diberikan.
- source_word: נֶגֶף
  choice: wabah
  rationale: Dalam konteks hukuman ilahi, kata ini dapat menunjuk pada pukulan mematikan atau wabah; “wabah” sesuai dengan ancaman komunal dalam ayat ini.
- source_word: וְלֹא יִהְיֶה בָהֶם נֶגֶף
  choice: supaya tidak ada wabah di antara mereka
  rationale: Klausa ini menyatakan hasil atau tujuan pembayaran tebusan; “supaya” mengungkapkan hubungan tersebut secara wajar.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks menyebut nama perjanjian secara langsung; bentuk “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Makna נַפְשׁוֹ dalam rumusan tebusan
  choice: bagi nyawanya
  alternative: bagi dirinya; bagi jiwanya
  rationale: Konteks sensus dan ancaman wabah mendukung arti kehidupan atau diri; “jiwa” dapat memasukkan konsep antropologis yang tidak dinyatakan ayat ini.
- issue: Cakupan gender בְּנֵי יִשְׂרָאֵל dan אִישׁ
  choice: orang Israel ... setiap laki-laki
  alternative: anak-anak Israel ... setiap orang
  rationale: Sebutan kelompok diterjemahkan secara idiomatis sebagai “orang Israel,” sedangkan אִישׁ dipertahankan sebagai “laki-laki” karena pungutan itu dibebankan secara distributif kepada pihak yang dihitung.
- issue: Hubungan antara tebusan dan wabah
  choice: supaya tidak ada wabah
  alternative: dan tidak akan ada wabah
  rationale: Terjemahan ini mempertahankan hubungan tujuan atau hasil yang tersirat tanpa merumuskan teori pendamaian yang melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Engkau” dipakai untuk sapaan tunggal kepada Musa; “mengadakan sensus” menyampaikan idiom Ibrani secara jelas, sedangkan catatan kaki mempertahankan bentuk harfiahnya. Pengulangan “ketika engkau menghitung mereka” dipertahankan karena terdapat dua kali dalam sumber.
