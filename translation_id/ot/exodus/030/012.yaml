    rationale: Frasa sumber berhubungan dengan pencatatan/pendaftaran dalam sensus, bukan semata-mata jumlah numerik; “untuk mendaftarkan mereka” lebih idiomatis dan setia.
  - severity: low
    issue: Jangkar catatan kaki tidak langsung mengikuti unsur yang dijelaskan.
    rationale: Catatan a menjelaskan idiom “mengangkat kepala”/sensus dan catatan b menjelaskan “tebusan bagi nyawanya”; pemindahan jangkar meningkatkan keterlacakan tanpa mengubah makna.
