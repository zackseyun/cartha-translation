    issue: “Uang tebusan” terlalu spesifik untuk כֹּפֶר.
    rationale: Kata Ibrani menyatakan tebusan/ransom dan ayat ini tidak secara eksplisit menyebut uang atau satuan pembayaran. “Tebusan” mempertahankan keluasan sumber.
