revisions:
- from: Apabila engkau mengadakan sensus atas orang Israel menurut jumlah mereka,[a] setiap laki-laki harus memberikan kepada Yahweh uang tebusan bagi nyawanya ketika engkau menghitung mereka,[b] supaya tidak ada wabah di antara mereka ketika engkau menghitung mereka.
  to: Apabila engkau mengadakan sensus[a] terhadap orang Israel untuk mendaftarkan mereka, setiap laki-laki harus memberikan kepada Yahweh tebusan bagi nyawanya[b] ketika engkau menghitung mereka, supaya tidak ada wabah di antara mereka ketika engkau menghitung mereka.
  rationale: Revisi menghilangkan spesifikasi “uang” yang tidak ada dalam ayat, memperjelas nuansa pendaftaran dalam frasa sensus, dan menempatkan kedua jangkar catatan kaki pada istilah yang masing-masing dijelaskan. Nama Yahweh, register baku, bentuk “setiap laki-laki,” serta pengulangan penghitungan dipertahankan.
