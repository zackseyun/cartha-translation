base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/035.yaml
  text: And you shall make it into incense[a], a perfume blended by the work of a perfumer, salted, pure[c][b], holy.
translation:
  language: id
  text: Buatlah itu menjadi dupa[a], suatu campuran harum, hasil karya seorang peramu wewangian, yang diberi garam[b], murni, dan kudus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “racikan aromatik.” Ungkapan Ibrani menekankan suatu campuran harum yang diramu dengan saksama.
    reason: lexical_alternative
  - marker: b
    text: Atau “dicampur dengan garam” atau “dibumbui dengan garam.”
    reason: lexical_alternative
  - marker: c
    text: Atau “suci.” Teks Ibrani di ayat ini hanya mengatakan “kudus,” bukan “mahakudus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ אֹתָהּ
  choice: Buatlah semuanya itu menjadi
  rationale: Bentuk perfektum dengan waw dalam konteks petunjuk berfungsi sebagai perintah. Pronomina feminin tunggal merujuk pada campuran bahan dalam ayat sebelumnya; 'semuanya itu' memperjelas rujukan secara alami dalam bahasa Indonesia tanpa menambah unsur baru.
- source_word: קְטֹרֶת
  choice: dupa
  rationale: '''Dupa'' adalah istilah Indonesia yang lazim dan tepat untuk campuran aromatik yang dibakar dalam konteks ibadah.'
- source_word: רֹקַח מַעֲשֵׂה רוֹקֵחַ
  choice: suatu campuran harum hasil karya peramu wewangian
  rationale: Terjemahan ini mempertahankan gagasan racikan aromatik serta keterampilan profesional peramunya, sekaligus menghindari kesan bahwa hasilnya adalah parfum cair modern.
- source_word: מְמֻלָּח
  choice: digarami
  rationale: Partisip pasif dari akar yang berkaitan dengan garam paling langsung berarti 'digarami'. Karena makna atau fungsi tepatnya dapat dipahami sebagai dicampur atau dibumbui dengan garam, alternatif dicatat dalam catatan kaki.
- source_word: טָהוֹר
  choice: murni
  rationale: Dalam konteks bahan dan ibadah, 'murni' menyampaikan kemurnian material sekaligus kelayakan ritual dengan lebih tepat daripada 'bersih'.
- source_word: קֹדֶשׁ
  choice: kudus
  rationale: Ibrani hanya menyatakan 'kudus', yakni dikhususkan bagi Allah, tanpa konstruksi superlatif 'mahakudus' pada ayat ini.
theological_decisions:
- issue: Status kultis dupa
  choice: kudus
  alternative: suci; mahakudus
  rationale: Teks Ibrani memakai קֹדֶשׁ tanpa bentuk yang berarti 'mahakudus'. Karena itu, 'kudus' mempertahankan pernyataan ayat tanpa memperkuat kategorinya berdasarkan konteks atau tradisi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada instruksional yang khidmat. 'Peramu wewangian' dipilih agar mudah dipahami dan tetap mencerminkan keahlian khusus; susunan sifat dibuat alami dalam bahasa Indonesia tanpa menghilangkan urutan gagasan utama teks Ibrani.
