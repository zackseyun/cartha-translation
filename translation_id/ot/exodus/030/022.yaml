  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/022.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: id
  text: Kemudian Yahweh berfirman kepada Musa[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN”.'
    reason: Menjelaskan bentuk Ibrani di balik “Yahweh” dan padanan tradisional yang umum dikenal.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Bentuk naratif ini memperkenalkan tindakan tutur ilahi yang baru. Dalam bahasa Indonesia Alkitabiah yang tetap wajar, “berfirman” secara tepat menandai bahwa subjeknya adalah Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama pribadi, bukan diganti dengan gelar “TUHAN”.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak yang menjadi tujuan perkataan; “kepada” merupakan padanan Indonesia yang alami.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara tersendiri
  rationale: Infinitif ini memperkenalkan isi ujaran yang menyusul. Dalam bahasa Indonesia, fungsinya sudah tersampaikan secara alami oleh “berfirman kepada Musa” dan tanda baca; menerjemahkannya sebagai “demikian” atau “kata-Nya” akan menambah unsur yang tidak diperlukan.
- source_word: וַ
  choice: Kemudian
  rationale: Waw konsekutif memajukan rangkaian narasi; “Kemudian” menyampaikan urutan tersebut secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama pribadi itu, sedangkan “TUHAN” menggantinya dengan gelar dan “Yehovah” mencerminkan bentuk pelafalan sekunder.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Berfirman” mempertahankan corak formula tutur ilahi tanpa menghasilkan susunan kaku. Koma di akhir ayat menandakan bahwa isi firman berlanjut pada ayat berikutnya.
