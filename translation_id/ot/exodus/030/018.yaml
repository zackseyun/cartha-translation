base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/018.yaml
  text: You shall make a bronze basin[a], with its stand of bronze, for washing; and you shall place it between the tent of meeting and the altar[c][b], and you shall put water there.
translation:
  language: id
  text: Haruslah engkau membuat sebuah bejana[a] dari perunggu[b], dengan alasnya[c] dari perunggu, untuk pembasuhan. Haruslah engkau menempatkannya di antara Kemah Pertemuan dan mazbah, lalu mengisinya dengan air.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bak pembasuhan”; istilah Ibrani menunjuk pada wadah besar berisi air yang dipakai untuk pembasuhan di Kemah Suci.
    reason: lexical_alternative
  - marker: b
    text: “Perunggu” juga dapat diterjemahkan “tembaga”; istilah Ibraninya dapat menunjuk pada tembaga atau paduan tembaga, bergantung pada konteks.
    reason: lexical_alternative
  - marker: c
    text: Atau “dudukan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּיּוֹר
  choice: bejana pembasuhan
  rationale: Menunjuk pada wadah besar penampung air untuk pembasuhan di tempat kudus. Pilihan ini jelas dalam bahasa Indonesia modern dan lebih tepat daripada sekadar 'baskom', yang dapat memberi kesan wadah rumah tangga kecil.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Dalam konteks perlengkapan Kemah Suci, 'perunggu' merupakan padanan yang lazim dan masuk akal; istilah Ibrani ini juga dapat menunjuk pada tembaga atau paduan tembaga, sehingga alternatif itu dicatat dalam catatan kaki.
- source_word: כַּן
  choice: alas
  rationale: Menunjuk pada struktur penyangga bejana. 'Alas' alami dan mudah dipahami dalam bahasa Indonesia; 'dudukan' juga mungkin.
- source_word: לְרָחְצָה
  choice: untuk membasuh
  rationale: Bentuk infinitif menyatakan tujuan. Terjemahan ini mempertahankan keringkasan teks Ibrani tanpa menambahkan objek yang tidak disebutkan dalam ayat ini.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Padanan baku dan wajar bagi nama tempat pertemuan kudus tersebut.
- source_word: מִזְבֵּחַ
  choice: mazbah
  rationale: Istilah yang tepat dan mapan untuk tempat mempersembahkan kurban dalam konteks ibadah Israel.
- source_word: שָׁמָּה
  choice: di situ
  rationale: Secara langsung mempertahankan adverbia tempat dalam bahasa Ibrani. 'Ke dalamnya' akan memperjelas rujukan, tetapi lebih interpretatif daripada bentuk sumber.
- source_word: מַיִם
  choice: air
  rationale: Padanan langsung bagi nomina Ibrani yang berfungsi sebagai kata benda massa.
- source_word: וְעָשִׂיתָ ... וְנָתַתָּ ... וְנָתַתָּ
  choice: Haruslah engkau membuat ... Tempatkanlah ... taruhlah
  rationale: Rangkaian bentuk orang kedua tunggal maskulin ini berfungsi sebagai perintah dalam konteks petunjuk pembuatan Kemah Suci. Rumusan ini mempertahankan daya direktifnya sekaligus terdengar alami dan bermartabat dalam bahasa Indonesia.
