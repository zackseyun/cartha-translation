translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Bentuk orang kedua tunggal 'engkau' dipakai untuk mencerminkan perintah yang ditujukan kepada Musa. Istilah kultis 'Kemah Pertemuan' dan 'mazbah' dipertahankan karena mapan, sedangkan 'bejana pembasuhan' menghindari kesan terlalu kecil atau domestik dari kata 'baskom'.
