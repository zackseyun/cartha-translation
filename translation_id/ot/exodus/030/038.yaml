base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/038.yaml
  text: Whoever makes any like it to smell it shall be cut off from his people[a][b].
translation:
  language: id
  text: Siapa pun yang membuat dupa seperti itu untuk mencium aromanya akan dilenyapkan dari tengah bangsanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “dilenyapkan dari tengah bangsanya” adalah rumusan hukum yang dapat menunjuk pada kematian, pengucilan, atau penyingkiran oleh Allah, bergantung pada konteks.
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ אֲשֶׁר
  choice: Siapa pun yang
  rationale: Dalam rumusan hukum ini, אִישׁ berfungsi secara generik. Ungkapan ini alami dalam bahasa Indonesia dan mencakup setiap orang yang memenuhi kondisi tersebut.
- source_word: יַעֲשֶׂה
  choice: membuat
  rationale: Makna dasar עשה adalah melakukan atau membuat; konteksnya adalah pembuatan campuran dupa.
- source_word: כָמֹהָ
  choice: dupa seperti itu
  rationale: Bentuk feminin ini merujuk kembali kepada campuran dupa kudus dalam ayat-ayat sebelumnya. Penyebutan 'dupa' memperjelas rujukannya tanpa menuntut bahwa campurannya harus identik sepenuhnya.
- source_word: לְהָרִיחַ בָּהּ
  choice: untuk mencium aromanya
  rationale: Infinitif ini menyatakan tujuan, yakni membuat dupa tersebut untuk dicium sendiri. 'Mencium aromanya' lebih alami daripada bentuk harfiah 'mencium padanya' dan tidak menambahkan gagasan kesenangan secara eksplisit.
- source_word: וְנִכְרַת
  choice: akan dilenyapkan
  rationale: Nifal כרת dalam rumusan hukum menyatakan penyingkiran berat. 'Dilenyapkan' mempertahankan bobot ungkapan tanpa menentukan apakah caranya berupa kematian, pengucilan, atau tindakan ilahi.
- source_word: מֵעַמָּיו
  choice: dari tengah bangsanya
  rationale: עם dengan sufiks menunjuk kepada komunitas atau bangsa orang itu. 'Dari tengah bangsanya' merupakan rumusan Indonesia yang wajar dan mempertahankan dimensi komunalnya.
theological_decisions:
- issue: Makna hukuman וְנִכְרַת מֵעַמָּיו
  choice: akan dilenyapkan dari tengah bangsanya
  alternative: akan dihukum mati; akan dikucilkan dari komunitasnya; akan disingkirkan oleh penghakiman ilahi
  rationale: Rumusan hukum Ibrani ini tidak selalu menjelaskan mekanisme hukumannya. Terjemahan utama mempertahankan ketegangan antara kemungkinan kematian, pengucilan, dan penyingkiran oleh Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang tegas dan bermartabat. 'Dupa seperti itu' memperjelas anteseden feminin, sedangkan 'mencium aromanya' menyampaikan tujuan pemakaian pribadi secara alami. Penanda catatan kaki [a] dicantumkan dalam teks utama.
