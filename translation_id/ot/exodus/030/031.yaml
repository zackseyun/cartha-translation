  text: And you shall speak to the sons of Israel, saying, ‘This shall be a holy anointing oil to me throughout your generations.’
translation:
  language: id
  text: 'Berbicaralah kepada orang Israel: ‘Ini akan menjadi minyak urapan kudus bagi-Ku turun-temurun.’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan harfiah ‘anak-anak Israel’ secara idiomatis menunjuk kepada umat Israel; ‘orang Israel’ alami dan jelas dalam bahasa Indonesia modern.
- source_word: שֶׁמֶן מִשְׁחַת קֹדֶשׁ
  choice: minyak urapan kudus
  rationale: Mempertahankan unsur leksikal ‘minyak’, ‘urapan’, dan ‘kudus’ serta istilah yang lazim dan mudah dipahami dalam konteks ritual.
- source_word: יִהְיֶה זֶה לִי
  choice: Ini harus menjadi ... bagi-Ku
  rationale: Bentuk imperfek dalam konteks perintah menyatakan ketetapan; ‘harus menjadi’ mengungkapkan daya normatifnya, sedangkan ‘bagi-Ku’ mempertahankan לִי tanpa menjelaskan lebih jauh relasinya.
- source_word: לְדֹרֹתֵיכֶם
  choice: turun-temurun
  rationale: Padanan idiomatis bagi ‘untuk generasi-generasi kalian’, yang menyatakan keberlakuan berkelanjutan lintas generasi.
theological_decisions:
- issue: Relasi minyak urapan kudus dengan Allah dalam frasa לִי
  choice: bagi-Ku
  alternative: milik-Ku
  rationale: ‘Bagi-Ku’ mempertahankan keluwesan relasi datif Ibrani dan tidak mempersempit maknanya hanya menjadi kepemilikan.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan khidmat. Formula pengantar לֵאמֹר diserap secara alami ke dalam kutipan langsung dan tidak diterjemahkan secara kaku sebagai ‘dengan mengatakan’.
