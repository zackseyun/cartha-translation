base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/006.yaml
  text: And you shall place it before the veil that is before the ark of the testimony[a], before the mercy seat that is over the testimony[b], where I will meet with you.
translation:
  language: id
  text: Tempatkanlah mezbah itu di depan tabir yang ada di depan tabut kesaksian, di depan tutup pendamaian yang ada di atas kesaksian, tempat Aku akan bertemu denganmu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַתָּה אֹתוֹ
  choice: Tempatkanlah mezbah itu
  rationale: נתן dalam petunjuk penataan ini berarti menaruh atau menempatkan. Pronomina objek dijelaskan sebagai “mezbah itu” berdasarkan acuan langsung pada mezbah pembakaran dupa dalam ayat sebelumnya, agar alami dalam bahasa Indonesia tanpa mengubah referen.
- source_word: לִפְנֵי
  choice: di depan
  rationale: Ungkapan ini dipakai dua kali dan menyatakan posisi ruang; “di depan” jelas, alami, dan mempertahankan pengulangan Ibrani.
- source_word: הַפָּרֹכֶת
  choice: tabir
  rationale: פרכת menunjuk pada tirai pemisah bagian dalam Kemah Suci. “Tabir” merupakan istilah ibadah yang ringkas, bermartabat, dan dikenal dalam bahasa Indonesia.
- source_word: אֲרֹן הָעֵדֻת
  choice: tabut kesaksian
  rationale: Teks Ibrani secara eksplisit memakai עֵדוּת, “kesaksian,” bukan בְּרִית, “perjanjian”; pilihan ini mempertahankan perbedaan leksikal tersebut.
- source_word: הַכַּפֹּרֶת
  choice: tutup pendamaian
  rationale: כפרת adalah tutup emas di atas tabut dan berkaitan dengan pendamaian. “Tutup pendamaian” menyatakan benda konkret beserta fungsi kultisnya tanpa memasukkan penafsiran denominasi tertentu.
- source_word: הָעֵדֻת
  choice: kesaksian
  rationale: Diterjemahkan konsisten dengan frasa “tabut kesaksian” dan tidak diharmoniskan menjadi “perjanjian.”
- source_word: אֲשֶׁר אִוָּעֵד לְךָ שָׁמָּה
  choice: tempat Aku akan bertemu denganmu
  rationale: Bentuk Nifal יעד dalam konteks ini menyatakan pertemuan yang ditetapkan. “Tempat ... bertemu denganmu” secara alami mencakup unsur שָׁמָּה, “di sana.”
theological_decisions:
- issue: Makna istilah kultis הַכַּפֹּרֶת
  choice: tutup pendamaian
  alternative: takhta belas kasihan
  rationale: Pilihan utama mempertahankan bahwa yang dimaksud adalah tutup tabut sekaligus mencerminkan hubungan istilah tersebut dengan pendamaian. Alternatif tradisional dicatat tanpa menjadikannya penjelasan doktrinal di dalam teks.
- issue: Penerjemahan עֵדוּת dalam rumusan tabut
  choice: kesaksian
  alternative: perjanjian
  rationale: Bahasa Ibrani ayat ini memakai kata “kesaksian” dua kali. Menerjemahkannya sebagai “perjanjian” akan mengimpor istilah lain yang tidak terdapat dalam ayat ini.
- issue: Referen אֹתוֹ
  choice: mezbah itu
  alternative: itu
  rationale: Pronomina maskulin tunggal mengacu pada mezbah dupa dalam konteks sebelumnya. Penyebutan referen membuat bahasa Indonesia lebih jelas tanpa menyelesaikan ketegangan teologis apa pun.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada instruksional yang khidmat. Bentuk imperatif “Tempatkanlah” dipilih sebagai padanan alami bagi perintah Ibrani. Pengulangan “di depan” dipertahankan untuk mencerminkan susunan ruang dalam teks sumber.
