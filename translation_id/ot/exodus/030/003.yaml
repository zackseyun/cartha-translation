  yaml_path: translation/ot/exodus/030/003.yaml
  text: You shall overlay it with pure gold—its top[a], its walls all around, and its horns—and you shall make for it a gold molding all around.
translation:
  language: id
  text: Haruslah engkau melapisinya dengan emas murni—bagian atasnya, dinding-dindingnya di sekelilingnya, dan tanduk-tanduknya—dan haruslah engkau membuat baginya bingkai emas[a] di sekelilingnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mahkota emas di sekelilingnya.” Kata Ibrani zer dapat berarti tepian, lis, atau bingkai yang menyerupai mahkota.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ
  choice: haruslah engkau melapisinya
  rationale: Kata kerja צפה dalam konstruksi ini menunjuk pada pelapisan suatu benda dengan bahan tertentu; “melapisi” alami dan tepat dalam bahasa Indonesia.
- source_word: זָהָב טָהוֹר
  choice: emas murni
  rationale: Ungkapan ini menyatakan emas berkadar tinggi; “emas murni” merupakan padanan Indonesia yang baku dan jelas.
- source_word: גַּגּוֹ
  choice: bagian atasnya
  rationale: גג biasanya berarti “atap”, tetapi pada mazbah kecil ini yang dimaksud ialah permukaan atasnya; “bagian atas” lebih alami daripada “atap”.
- source_word: קִירֹתָיו
  choice: dinding-dindingnya
  rationale: Terjemahan ini mempertahankan gambaran konkret kata קיר dan tetap dapat dipahami sebagai bidang-bidang tegak pada mazbah.
- source_word: סָבִיב
  choice: di sekeliling
  rationale: Ungkapan ini menyampaikan bahwa pelapisan dan bingkai mengitari benda tersebut secara menyeluruh, serta mempertahankan pengulangan Ibrani.
- source_word: קַרְנֹתָיו
  choice: tanduk-tanduknya
  rationale: Istilah harfiah untuk tonjolan pada sudut-sudut mazbah dipertahankan karena merupakan unsur penting perlengkapan ibadah.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: dan haruslah engkau membuat ... di sekelilingnya
  rationale: Relasi ל pada altar diungkapkan secara alami melalui sufiks “-nya”, tanpa menambahkan makna yang tidak ada dalam teks.
- source_word: זֵר זָהָב
  choice: bingkai emas
  rationale: זֵר menunjuk pada tepian, lis, atau bentuk bingkai yang mengelilingi perabot kudus. “Bingkai” jelas dalam bahasa Indonesia dan tidak terlalu menonjolkan citra kerajaan seperti “mahkota”.
theological_decisions:
- issue: Istilah untuk unsur-unsur perabot ibadah
  choice: Mempertahankan “tanduk-tanduk” secara harfiah dan menerjemahkan זֵר sebagai “bingkai”.
  alternative: Menerjemahkan זֵר sebagai “mahkota”, “lis”, atau “tepian”.
  rationale: Ayat ini memberikan petunjuk pembuatan mazbah, bukan pernyataan tentang kerajaan. “Tanduk-tanduk” menjaga istilah penting dalam deskripsi mazbah, sedangkan “bingkai” menyampaikan bentuk fisik זֵר dengan jelas. Kemungkinan arti “mahkota” dicatat tanpa menjadikannya tafsiran utama.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Bentuk “haruslah engkau” mempertahankan corak perintah langsung kepada Musa; istilah fisik konkret dipertahankan tanpa memasukkan tafsiran denominasi.
