  terminology: '"Minyak urapan kudus" adalah padanan yang baik dan konsisten bagi שֶׁמֶן מִשְׁחַת קֹדֶשׁ. "Peramu" dapat dipertahankan sebagai sebutan netral bagi pengrajin yang menyiapkan campuran aromatik. Catatan kaki direvisi menjadi alternatif konstruksi yang tidak mengubah makna.'
