translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'Haruslah engkau' mempertahankan sapaan tunggal dan nada instruksional. Istilah 'peramu' dipilih untuk pengrajin ahli yang meracik bahan-bahan harum.
