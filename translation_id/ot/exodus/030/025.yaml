  text: And you shall make it a holy anointing oil[a], a perfume blended by the work of a perfumer; it shall be a holy anointing oil.
translation:
  language: id
  text: Haruslah engkau mengolahnya menjadi minyak urapan kudus[a], suatu racikan harum, hasil pekerjaan seorang peramu; itulah minyak urapan kudus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “minyak untuk pengurapan kudus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ אֹתוֹ
  choice: Haruslah engkau mengolahnya menjadi
  rationale: Bentuk perfektum dengan waw dalam konteks petunjuk menyampaikan perintah. Kata 'mengolah' cocok dengan pembuatan campuran dari bahan-bahan pada ayat sebelumnya, sedangkan '-nya' mempertahankan rujukan pronominal.
- source_word: שֶׁמֶן מִשְׁחַת קֹדֶשׁ
  choice: minyak urapan kudus
  rationale: Menerjemahkan rangkaian konstruksi secara ringkas dan alami, dengan mempertahankan fungsi minyak untuk pengurapan serta sifat kudusnya. Ungkapan yang sama dipakai kembali pada akhir ayat.
- source_word: רֹקַח מִרְקַחַת
  choice: campuran harum racikan
  rationale: Dua kata serumpun menekankan sediaan aromatik yang dicampur atau diracik. Ungkapan ini mempertahankan unsur campuran, keharuman, dan pengerjaan, tanpa memakai istilah yang kuno.
- source_word: מַעֲשֵׂה רֹקֵחַ
  choice: racikan seorang peramu
  rationale: Secara harfiah menunjuk pada hasil kerja seorang ahli pencampur bahan harum. 'Peramu' menyampaikan peran pengrajin terampil tanpa membatasi maknanya pada pembuat parfum modern.
- source_word: יִהְיֶה
  choice: itu harus menjadi
  rationale: Imperfek menyatakan keadaan hasil yang ditetapkan dalam konteks instruksi. 'Harus menjadi' mempertahankan daya normatifnya dalam bahasa Indonesia alami.
