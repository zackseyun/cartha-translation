base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/034.yaml
  text: 'Then Yahweh said to Moses[a], “Take for yourself spices: stacte and onycha and galbanum, spices, and pure frankincense; they shall be in equal parts.”'
translation:
  language: id
  text: 'Lalu Yahweh berfirman kepada Musa, “Ambillah untuk dirimu bahan-bahan harum: stakte dan onika[a], galbanum—bahan-bahan harum—dan kemenyan murni. Masing-masing harus sama banyaknya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Identitas tepat stakte dan onika tidak diketahui dengan pasti. Kata-kata Ibraninya tampaknya menunjuk pada bahan-bahan harum tertentu untuk dupa dan secara tradisional diterjemahkan dengan nama-nama ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama pribadi ilahi dalam bentuk transliterasi yang lazim, bukan menggantinya dengan gelar.
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Bentuk naratif ini melanjutkan rangkaian peristiwa; 'lalu' alami dalam bahasa Indonesia, sedangkan 'berfirman' sesuai untuk tuturan ilahi dalam ragam Alkitab yang bermartabat.
- source_word: קַח לְךָ
  choice: Ambillah bagimu
  rationale: Menerjemahkan imperatif sekaligus nuansa personal/refleksif dari לְךָ tanpa menghilangkannya.
- source_word: סַמִּים
  choice: bahan-bahan harum
  rationale: Istilah umum bagi berbagai bahan aromatik untuk dupa; pilihan ini lebih jelas daripada 'rempah-rempah' karena bahan-bahan yang disebut mencakup damar dan kemungkinan bahan nonnabati.
- source_word: נָטָף
  choice: stakte
  rationale: Identitas bahannya tidak pasti. Transliterasi istilah tradisional mempertahankan kekhususan unsur dupa tanpa memberi identifikasi botanis yang terlalu pasti.
- source_word: שְׁחֵלֶת
  choice: onika
  rationale: Identitas zat ini tidak pasti. Bentuk tradisional 'onika' dipertahankan, dan ketidakpastiannya dijelaskan dalam catatan kaki.
- source_word: חֶלְבְּנָה
  choice: galbanum
  rationale: Umumnya dipahami sebagai galbanum, sejenis damar aromatik; nama serapan ini tepat dan ringkas.
- source_word: לְבֹנָה זַכָּה
  choice: kemenyan murni
  rationale: לְבֹנָה menunjuk pada frankincense/kemenyan, sedangkan זַכָּה menyatakan kemurniannya.
- source_word: בַּד בְּבַד יִהְיֶה
  choice: Masing-masing harus sama banyaknya
  rationale: Mengungkapkan idiom kesetaraan takaran secara alami dalam bahasa Indonesia sambil mempertahankan ketentuan bahwa semua bahan digunakan dalam bagian yang sama.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'bahan-bahan harum' dipertahankan karena muncul dua kali dalam teks Ibrani, meskipun terasa tidak biasa dalam bahasa Indonesia. Tanda catatan kaki ditempatkan langsung sesudah kedua istilah yang dijelaskannya.
