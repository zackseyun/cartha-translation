  yaml_path: translation/ot/exodus/030/002.yaml
  text: Its length shall be a cubit[a], and its width a cubit; it shall be square, and its height shall be two cubits[b]. Its horns shall be of one piece with it.
translation:
  language: id
  text: Panjangnya harus satu hasta dan lebarnya satu hasta. Bentuknya harus persegi, dan tingginya harus dua hasta. Tanduk-tanduknya harus menjadi satu kesatuan dengan mazbah itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “darinya”; maksudnya, tanduk-tanduk itu dibuat sebagai satu bagian dengan mazbah, bukan dipasang secara terpisah.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַמָּה / אַמָּתַיִם
  choice: satu hasta / dua hasta
  rationale: Mempertahankan satuan panjang kuno yang lazim dalam terjemahan Alkitab Indonesia tanpa konversi modern yang dapat memberi kesan ketepatan semu.
- source_word: אָרְכּוֹ
  choice: panjangnya
  rationale: Nomina dengan sufiks orang ketiga maskulin tunggal yang mengacu kepada mazbah dalam konteks.
- source_word: רָחְבּוֹ
  choice: lebarnya
  rationale: Padanan Indonesia modern dan alami untuk ukuran dari sisi ke sisi.
- source_word: רָבוּעַ
  choice: persegi
  rationale: Menyatakan bentuk bersegi empat dengan panjang dan lebar yang sama; lebih alami daripada ungkapan harfiah yang kaku.
- source_word: יִהְיֶה
  choice: harus
  rationale: Bentuk imperfek dalam petunjuk pembuatan ini menyatakan ketentuan atau spesifikasi, sehingga 'harus' menyampaikan daya preskriptifnya secara wajar dalam bahasa Indonesia.
- source_word: קֹמָתוֹ
  choice: tingginya
  rationale: Dalam konteks bangunan atau benda, 'tinggi' merupakan padanan yang tepat dan alami.
- source_word: מִמֶּנּוּ
  choice: menyatu dengannya
  rationale: Secara harfiah berarti 'darinya', tetapi dalam konteks pengerjaan benda menunjukkan bahwa tanduk-tanduk itu merupakan bagian integral dari mazbah, bukan bagian terpisah yang ditempelkan.
- source_word: קַרְנֹתָיו
  choice: tanduk-tanduknya
  rationale: Mempertahankan istilah kultis bagi tonjolan berbentuk tanduk pada sudut-sudut mazbah serta kaitan antarteksnya.
