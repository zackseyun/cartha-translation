base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/036.yaml
  text: And you shall grind some of it very fine[a], and put some of it before the testimony in the tent of meeting, where I will meet with you. It shall be most holy for you.
translation:
  language: id
  text: Gilinglah sebagian dari dupa itu hingga menjadi sangat halus, lalu taruhlah sebagian darinya di hadapan Kesaksian, di dalam Kemah Pertemuan, tempat Aku akan bertemu dengan engkau. Dupa itu harus menjadi mahakudus[a] bagimu sekalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Yang Mahakudus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁחַקְתָּ
  choice: Gilinglah
  rationale: Dalam konteks pembuatan dupa, verba ini menunjuk pada tindakan melumatkan campuran menjadi bubuk; “gilinglah” alami dan tepat dalam bahasa Indonesia.
- source_word: מִמֶּנָּה
  choice: sebagian darinya
  rationale: 'Bentuk preposisional ini bersifat partitif: hanya sebagian dari campuran dupa yang digiling dan ditaruh.'
- source_word: הָדֵק
  choice: sampai sangat halus
  rationale: Bentuk ini menekankan hasil penggilingan yang benar-benar halus; ungkapan ini menyampaikan intensitas tersebut secara alami.
- source_word: וְנָתַתָּה
  choice: lalu taruhlah
  rationale: נתן memiliki arti luas, tetapi dalam konteks penempatan ritual “taruhlah” merupakan padanan yang jelas dan wajar.
- source_word: לִפְנֵי הָעֵדֻת
  choice: di hadapan Kesaksian
  rationale: Terjemahan ini mempertahankan istilah kultis yang disebut teks Ibrani tanpa mempersempit rujukannya menjadi tabut atau loh-loh perjanjian.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: dalam Kemah Pertemuan
  rationale: Ini mempertahankan sebutan resmi bagi tempat pertemuan ilahi dengan Israel dalam bentuk yang sudah wajar dalam bahasa Indonesia.
- source_word: אֲשֶׁר אִוָּעֵד לְךָ שָׁמָּה
  choice: tempat Aku akan bertemu dengan engkau
  rationale: Bentuk Nifal dari יעד menyatakan pertemuan yang ditetapkan. “Bertemu dengan engkau” jelas, alami, dan mempertahankan bentuk orang kedua tunggal.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: mahakudus
  rationale: Konstruksi Ibrani ini menyatakan tingkat kekudusan tertinggi. “Mahakudus” ringkas dan jelas, sedangkan bentuk harfiahnya dicantumkan dalam catatan kaki.
- source_word: תִּהְיֶה לָכֶם
  choice: Itu harus menjadi ... bagi kalian
  rationale: Ungkapan ini menyatakan status dupa terhadap kelompok penerima perintah. “Kalian” mempertahankan bentuk jamak Ibrani tanpa menyiratkan kepemilikan secara berlebihan.
theological_decisions:
- issue: Rujukan “Kesaksian”
  choice: Mempertahankan istilah kultis “Kesaksian”.
  alternative: “tabut Kesaksian” atau “loh-loh perjanjian”
  rationale: Teks Ibrani menyebut Kesaksian, bukan secara eksplisit tabut ataupun loh-loh. Terjemahan tidak mempersempit rujukan yang dibiarkan implisit oleh sumber.
- issue: Penerjemahan bentuk superlatif kekudusan
  choice: “mahakudus” dalam teks utama
  alternative: “kudus dari yang kudus-kudus”
  rationale: “Mahakudus” menyampaikan daya superlatif secara alami dalam bahasa Indonesia modern, sementara bentuk yang lebih harfiah dipertahankan dalam catatan kaki.
- issue: Peralihan jumlah orang kedua
  choice: “engkau” untuk bentuk tunggal לְךָ dan “kalian” untuk bentuk jamak לָכֶם
  alternative: Menggunakan “kamu” pada keduanya sehingga perbedaan jumlah tidak tampak
  rationale: Teks Ibrani beralih dari orang kedua tunggal dalam pernyataan tentang pertemuan dengan Allah kepada orang kedua jamak dalam penetapan status dupa. Perbedaan itu dipertahankan tanpa menafsirkannya lebih jauh.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Bentuk perintah dibuat alami; istilah ritual “Kesaksian” dan “Kemah Pertemuan” dipertahankan. Kapitalisasi “Aku”, “Kesaksian”, dan “Kemah Pertemuan” menandai rujukan ilahi serta sebutan kultis khusus.
