    rationale: “Kudus dari yang kudus-kudus” mengaburkan konstruksi superlatif Ibrani dan tidak berfungsi baik dalam bahasa Indonesia modern. Alternatif tradisional “Yang Mahakudus” menyampaikan bentuk ungkapan yang dikenal tanpa mengubah teks utama.
  - severity: low
    issue: Register pronomina kurang konsisten.
    rationale: “Engkau” bersifat khidmat, sedangkan “kalian” lebih percakapan. “Bagimu sekalian” tetap membedakan tunggal dan jamak serta lebih serasi dengan register ayat.
