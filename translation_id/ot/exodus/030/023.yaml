  text: וְ/אַתָּ֣ה קַח לְ/ךָ֮ בְּשָׂמִ֣ים רֹאשׁ֒ מָר דְּרוֹר֙ חֲמֵ֣שׁ מֵא֔וֹת וְ/קִנְּמָן בֶּ֥שֶׂם מַחֲצִית֖/וֹ חֲמִשִּׁ֣ים וּ/מָאתָ֑יִם וּ/קְנֵה בֹ֖שֶׂם חֲמִשִּׁ֥ים וּ/מָאתָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/023.yaml
  text: 'And you[a], take for yourself the finest spices: five hundred shekels of flowing myrrh, and half as much—two hundred fifty—of fragrant cinnamon, and two hundred fifty of fragrant cane[b],'
translation:
  language: id
  text: 'Ambillah bagi dirimu rempah-rempah terbaik: lima ratus syikal mur yang mengalir bebas[a], setengah dari jumlah itu—dua ratus lima puluh syikal—kayu manis yang harum, dan dua ratus lima puluh syikal buluh wangi[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mur murni”. Ungkapan Ibrani ini kemungkinan menunjuk pada mur yang mengalir bebas dalam keadaan alaminya.
    reason: lexical_alternative
  - marker: b
    text: Secara tradisional, “kayu manis yang manis” dan “kalamus yang manis”. Kata-kata Ibraninya secara lebih umum menunjuk pada kayu manis dan buluh yang aromatik atau harum.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשָׂמִים רֹאשׁ
  choice: rempah-rempah terbaik
  rationale: בְּשָׂמִים menunjuk pada bahan-bahan aromatik, sedangkan רֹאשׁ secara idiomatis berarti yang utama atau terbaik. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan penekanan pada mutu.
- source_word: מָר דְּרוֹר
  choice: mur yang mengalir
  rationale: מָר berarti mur, dan דְּרוֹר kemungkinan menggambarkan mur yang mengalir bebas dalam keadaan alaminya. Terjemahan ini mempertahankan gambaran Ibrani tanpa langsung menafsirkannya sebagai 'murni'.
- source_word: חֲמֵשׁ מֵאוֹת
  choice: lima ratus syikal
  rationale: Teks hanya menyebut angkanya, tetapi satuan syikal tersirat dari konteks daftar dan dinyatakan dalam ayat berikutnya. Menyebutkannya menghindari ketidakjelasan mengenai jenis takaran.
- source_word: קִנְּמָן בֶּשֶׂם
  choice: kayu manis yang harum
  rationale: קִנְּמָן berarti kayu manis dan בֶּשֶׂם menandai sifat aromatiknya. 'Harum' menekankan aroma, bukan rasa manis.
- source_word: מַחֲצִיתוֹ
  choice: setengah dari jumlah itu
  rationale: Akhiran pronominalnya merujuk pada jumlah lima ratus sebelumnya. Ungkapan ini menyampaikan hubungan tersebut secara jelas dan wajar dalam bahasa Indonesia.
- source_word: חֲמִשִּׁים וּמָאתָיִם
  choice: dua ratus lima puluh syikal
  rationale: Angka ini menjelaskan secara aposisional nilai setengah dari lima ratus. Satuan yang tersirat diulangi demi kejelasan.
- source_word: קְנֵה בֹשֶׂם
  choice: buluh wangi
  rationale: קָנֶה berarti batang buluh atau gelagah, sementara בֹשֶׂם menunjukkan sifat aromatik. 'Buluh wangi' transparan dan tidak menentukan identifikasi botani yang lebih sempit seperti kalamus.
