translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan bentuk perintah yang jelas. Pengulangan 'syikal' ditambahkan berdasarkan konteks agar semua angka terbaca sebagai ukuran berat. Penanda catatan kaki ditempatkan langsung pada istilah yang dijelaskannya.
