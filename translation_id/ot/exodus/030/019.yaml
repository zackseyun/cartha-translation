translation:
  language: id
  text: Harun dan putra-putranya harus membasuh tangan dan kaki mereka dengan air dari bejana itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “darinya,” merujuk pada bejana pembasuhan yang disebutkan dalam konteks sebelumnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: harus membasuh
  rationale: Bentuk Qal perfect dengan waw dalam konteks petunjuk ritual menyatakan kewajiban. Pilihan ini mempertahankan nada instruksional yang wajar dalam bahasa Indonesia modern.
- source_word: אַהֲרֹן
  choice: Harun
  rationale: Bentuk nama yang baku dan lazim dalam Alkitab bahasa Indonesia.
- source_word: וּבָנָיו
  choice: dan anak-anaknya
  rationale: Dalam konteks ini, ungkapan tersebut menunjuk kepada putra-putra Harun yang menjalankan tugas keimaman. Bahasa Indonesia lazim memakai 'anak-anaknya'; konteks membatasi acuannya.
- source_word: מִמֶּנּוּ
  choice: dengan air dari bejana itu
  rationale: Secara harfiah berarti 'darinya', dengan acuan pada bejana pembasuhan dalam konteks sebelumnya. Karena orang tidak membasuh anggota tubuh 'dari bejana', penambahan 'dengan air' menyampaikan relasi instrumennya secara alami, sedangkan 'bejana itu' memperjelas anteseden tanpa mengubah maksud.
- source_word: אֶת יְדֵיהֶם
  choice: tangan ... mereka
  rationale: Menyatakan anggota tubuh yang menjadi objek langsung tindakan membasuh.
- source_word: וְאֶת רַגְלֵיהֶם
  choice: dan kaki mereka
  rationale: Mengoordinasikan anggota tubuh kedua yang harus dibasuh; 'kaki' adalah padanan langsung dan alami.
theological_decisions:
- issue: Acuan gender pada keturunan imam
  choice: anak-anaknya
  alternative: putra-putranya
  rationale: Konteks keimaman menunjukkan bahwa yang dimaksud adalah anak-anak laki-laki Harun. Namun, 'anak-anaknya' merupakan ungkapan alami dalam bahasa Indonesia dan konteks sudah menjaga acuan historisnya; pilihan ini tidak memperluas jabatan keimaman melampaui teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Membasuh' dipilih karena sesuai dengan tindakan ritual dan tetap mudah dipahami; struktur kalimat dibuat alami tanpa menghilangkan acuan kontekstual dari bentuk Ibrani.
