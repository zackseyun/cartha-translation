  text: וּ/בְ/הַעֲלֹ֨ת אַהֲרֹ֧ן אֶת הַ/נֵּרֹ֛ת בֵּ֥ין הָ/עֲרְבַּ֖יִם יַקְטִירֶ֑/נָּה קְטֹ֧רֶת תָּמִ֛יד לִ/פְנֵ֥י יְהוָ֖ה לְ/דֹרֹתֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/008.yaml
  text: And when Aaron sets up the lamps at twilight[a], he shall burn it, a regular incense[b], before Yahweh throughout your generations.
translation:
  language: id
  text: Ketika Harun membuat pelita-pelita itu menyala pada waktu senja[a], ia harus membakar dupa itu sebagai persembahan yang tetap[b] di hadapan Yahweh, turun-temurun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di antara kedua petang,” suatu ungkapan Ibrani untuk kurun senja atau petang.'
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “yang terus-menerus.” Istilah Ibrani ini dapat menekankan keteraturan yang berlanjut atau kelanggengan persembahan yang ditetapkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַעֲלֹת
  choice: Ketika ... membuat ... menyala
  rationale: Preposisi בְּ dengan infinitif menyatakan waktu, sedangkan bentuk Hifil dari עלה secara harfiah menggambarkan tindakan membuat nyala pelita naik. Ungkapan ini mempertahankan nuansa menyalakan sekaligus menyiapkan pelita agar menyala.
- source_word: הַנֵּרֹת
  choice: pelita-pelita itu
  rationale: נֵרוֹת adalah istilah lazim bagi pelita dalam konteks perlengkapan Kemah Suci; bentuk jamaknya dipertahankan.
- source_word: בֵּין הָעַרְבַּיִם
  choice: pada waktu senja
  rationale: Idiom Ibrani yang secara harfiah berarti 'di antara kedua petang' menunjuk pada kurun senja atau petang. Terjemahan ini jelas dalam bahasa Indonesia modern, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: יַקְטִירֶנָּה
  choice: ia harus membakar dupa itu
  rationale: Bentuk Hifil dari קטר dalam konteks ibadah berarti membakar bahan harum sebagai persembahan sehingga asapnya naik. Akhiran feminin tunggal dirujukkan kepada קְטֹרֶת, yakni dupa.
- source_word: קְטֹרֶת
  choice: persembahan dupa
  rationale: Kata ini berarti dupa; dalam hubungan dengan verba קטר, fungsi persembahannya tersirat dan dinyatakan secara alami dalam bahasa Indonesia.
- source_word: תָּמִיד
  choice: yang tetap
  rationale: תמיד dapat menekankan keteraturan yang terus berlangsung atau sifat berkelanjutan. 'Tetap' mempertahankan keluasan makna itu tanpa menyiratkan bahwa dupa dibakar tanpa henti setiap saat.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי menyatakan keberadaan atau pelayanan di hadapan Allah dalam ruang ibadah, dan nama ilahi יְהוָה ditransliterasikan sebagai 'Yahweh'.
- source_word: לְדֹרֹתֵיכֶם
  choice: turun-temurun
  rationale: Idiom ini menyatakan keberlakuan yang berlanjut sepanjang generasi-generasi umat; 'turun-temurun' adalah padanan Indonesia yang alami dan ringkas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung. Transliterasi 'Yahweh' mempertahankan nama pribadi itu dan tidak menggantinya dengan sebuah gelar.
- issue: Sifat berkelanjutan dari dupa (תָּמִיד)
  choice: persembahan dupa yang tetap
  alternative: dupa yang terus-menerus; dupa abadi
  rationale: Dalam konteks ini dupa dibakar pada waktu-waktu yang ditetapkan, bukan tanpa jeda setiap saat. 'Tetap' memungkinkan makna keteraturan berkelanjutan tanpa meniadakan kemungkinan penekanan pada kelanggengan ketetapan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. 'Membuat ... menyala' dipilih untuk mencerminkan gambaran verba Ibrani tanpa membatasi tindakan hanya pada penyalaan awal; 'turun-temurun' menjaga kealamian idiom Indonesia.
