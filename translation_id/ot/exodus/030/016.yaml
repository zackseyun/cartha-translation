source:
  edition: WLC
  text: וְ/לָקַחְתָּ֞ אֶת כֶּ֣סֶף הַ/כִּפֻּרִ֗ים מֵ/אֵת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/נָתַתָּ֣ אֹת֔/וֹ עַל עֲבֹדַ֖ת אֹ֣הֶל מוֹעֵ֑ד וְ/הָיָה֩ לִ/בְנֵ֨י יִשְׂרָאֵ֤ל לְ/זִכָּרוֹן֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/כַפֵּ֖ר עַל נַפְשֹׁתֵי/כֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/016.yaml
  text: You shall take the atonement money from the sons of Israel and give it for the service of the tent of meeting[a], and it shall be for the sons of Israel as a memorial before Yahweh[b], to make atonement for your lives.
translation:
  language: id
  text: Ambillah uang pendamaian[a] itu dari orang Israel[b] dan gunakanlah itu untuk pelayanan Kemah Pertemuan. Uang itu akan menjadi peringatan bagi orang Israel di hadapan Yahweh, untuk mengadakan pendamaian atas hidup kalian.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “uang tebusan”; kata Ibrani untuk “uang” juga dapat berarti “perak.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak-anak laki-laki Israel”; yang dimaksud ialah orang-orang Israel sebagai suatu umat.
    reason: source_form
  - marker: c
    text: Atau “nyawa kalian” atau “diri kalian”; kata Ibrani yang digunakan sering diterjemahkan “jiwa,” tetapi di sini menunjuk pada kehidupan atau pribadi secara utuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּסֶף הַכִּפֻּרִים
  choice: uang pendamaian
  rationale: כֶּסֶף dapat berarti “perak” atau “uang,” sedangkan הַכִּפֻּרִים berasal dari akar כפר dan menunjuk pada pendamaian. Dalam konteks pembayaran sensus pada ayat-ayat sebelumnya, “uang pendamaian” jelas, alami, dan tetap mempertahankan makna ritualnya.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: dari orang Israel
  rationale: Secara harfiah frasa ini berbunyi “dari anak-anak laki-laki Israel,” tetapi dalam konteks ini merupakan sebutan kolektif bagi umat Israel. “Orang Israel” menyampaikan rujukan itu secara wajar dalam bahasa Indonesia tanpa menyiratkan bahwa yang dimaksud hanyalah anak-anak.
- source_word: עַל עֲבֹדַת אֹהֶל מוֹעֵד
  choice: untuk keperluan pelayanan di Kemah Pertemuan
  rationale: עַל menyatakan peruntukan, עֲבֹדָה berarti pekerjaan atau pelayanan, dan אֹהֶל מוֹעֵד adalah sebutan baku bagi Kemah Pertemuan. Rumusan ini menunjukkan bahwa uang tersebut dialokasikan bagi pelayanan kemah suci.
- source_word: וְהָיָה ... לְזִכָּרוֹן
  choice: Uang itu akan menjadi tanda pengingat
  rationale: זִכָּרוֹן berarti pengingat atau tanda peringatan. “Tanda pengingat” alami bagi pembaca modern dan mempertahankan fungsi uang itu sebagai pengingat di hadapan Allah.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי secara harfiah berarti “di hadapan” dan dalam konteks ibadah menunjuk pada kehadiran Allah. Nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh.”
- source_word: לְכַפֵּר
  choice: untuk mengadakan pendamaian
  rationale: Bentuk piel infinitif dari כפר dalam konteks keimaman menyatakan tindakan mengadakan pendamaian. Pilihan ini mempertahankan istilah teologis sumber tanpa memakai istilah teknis yang kurang mudah dipahami.
- source_word: עַל נַפְשֹׁתֵיכֶם
  choice: bagi nyawa kalian
  rationale: נֶפֶשׁ di sini menunjuk pada hidup atau diri orang Israel, bukan “jiwa” sebagai unsur yang terpisah dari tubuh. “Nyawa kalian” cocok dengan konteks uang tebusan yang melindungi kehidupan mereka.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung. “Yahweh” mempertahankan nama diri tersebut dan tidak menggantinya dengan gelar.
- issue: Makna pendamaian dalam כֶּסֶף הַכִּפֻּרִים dan לְכַפֵּר
  choice: uang pendamaian; mengadakan pendamaian
  alternative: uang tebusan; menebus
  rationale: Akar כפר memiliki nuansa pendamaian, penghapusan kesalahan, dan dalam konteks ini juga pembayaran tebusan. Teks utama mempertahankan istilah ritual “pendamaian,” sedangkan catatan kaki mengakui kemungkinan “uang tebusan” tanpa menyamakan seluruh konsep pendamaian dengan transaksi semata.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel; putra-putra Israel
  rationale: Bentuk Ibrani secara gramatikal maskulin, tetapi berfungsi sebagai nama kolektif umat perjanjian dalam konteks pengumpulan pembayaran. “Orang Israel” menghindari kesan bahwa hanya anak-anak atau keturunan laki-laki yang dimaksud, sementara bentuk harfiahnya dicatat.
- issue: Makna antropologis נַפְשֹׁתֵיכֶם
  choice: nyawa kalian
  alternative: jiwa kalian; diri kalian; hidup kalian
  rationale: Dalam konteks ancaman tulah dan pembayaran tebusan, נֶפֶשׁ menunjuk pada hidup atau pribadi secara utuh. “Nyawa” tidak memasukkan dualisme tubuh-jiwa yang tidak dinyatakan oleh ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk imperatif “Ambillah” dan “serahkanlah” mempertahankan nada perintah langsung. “Kemah Pertemuan” dipakai sebagai istilah yang mudah dikenali, sedangkan “Yahweh” mempertahankan nama ilahi. Pronomina “kalian” dipilih karena bentuk Ibrani orang kedua jamak dan lebih transparan daripada “kamu” yang dapat dibaca tunggal.
