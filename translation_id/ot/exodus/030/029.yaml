  text: You shall consecrate them[a], and they shall be most holy. Whatever touches them shall become holy.
translation:
  language: id
  text: Engkau harus menguduskan semuanya itu, dan semuanya akan menjadi mahakudus. Siapa pun atau apa pun yang menyentuh benda-benda itu akan menjadi kudus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akan kudus” atau “akan dikuduskan.” Kata Ibrani ini dapat menyatakan bahwa sesuatu menjadi kudus karena bersentuhan dengan benda-benda tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתָּ
  choice: Engkau harus menguduskan
  rationale: Bentuk Piel dari קדשׁ menyatakan tindakan menjadikan atau menetapkan sesuatu sebagai kudus. “Menguduskan” merupakan istilah Indonesia yang wajar dan tepat dalam konteks perlengkapan ibadah.
- source_word: אֹתָם
  choice: semuanya itu
  rationale: Pronomina objek jamak ini menunjuk kembali kepada Kemah Suci dan berbagai perlengkapannya dalam konteks sebelumnya. “Semuanya itu” mempertahankan cakupan jamaknya secara alami.
- source_word: וְהָיוּ
  choice: dan semuanya akan menjadi
  rationale: Klausa ini menyatakan keadaan yang dihasilkan sesudah tindakan pengudusan. Kata “semuanya” memperjelas subjek jamak yang dalam bahasa Ibrani dinyatakan oleh bentuk verba.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: mahakudus
  rationale: Konstruksi superlatif Ibrani ini menyatakan tingkat kekudusan tertinggi. “Mahakudus” ringkas, lazim dalam bahasa Indonesia Alkitabiah, dan tidak memberi kesan ruang tertentu seperti ungkapan “tempat mahakudus”.
- source_word: כָּל הַנֹּגֵעַ
  choice: Apa pun yang menyentuh
  rationale: Gabungan כָּל dengan partisip הַנֹּגֵעַ bersifat umum dan dapat mencakup orang maupun benda. “Apa pun” mempertahankan keluasan itu tanpa membatasinya hanya kepada manusia.
- source_word: בָּהֶם
  choice: benda-benda itu
  rationale: Pronomina berpreposisi ini menunjuk kepada berbagai benda yang baru saja dikuduskan. Penyebutan ulang “benda-benda itu” menghindari ketidakjelasan pronomina Indonesia “-nya” dan mempertahankan acuan jamaknya.
- source_word: יִקְדָּשׁ
  choice: akan menjadi kudus
  rationale: 'Bentuk Qal imperfek dari קדשׁ di sini dapat dipahami secara inkoatif atau resultatif: pihak atau benda yang menyentuh memasuki keadaan kudus. “Menjadi kudus” menyatakan perubahan keadaan tanpa menjelaskan lebih jauh sifat atau akibat kekudusan tersebut.'
theological_decisions:
- issue: Makna kekudusan yang timbul melalui sentuhan
  choice: Ayat menyatakan bahwa apa pun yang menyentuh benda-benda yang telah dikuduskan akan menjadi kudus, tanpa menentukan apakah keadaan itu bersifat menguntungkan, berbahaya, atau mendatangkan pembatasan ritual.
  alternative: Sentuhan itu menguduskan secara positif; atau sentuhan itu membawa pihak yang menyentuh ke dalam lingkup kekudusan beserta bahaya dan kewajibannya.
  rationale: Teks Ibrani hanya menyatakan יִקְדָּשׁ, “akan menjadi kudus.” Terjemahan tidak menyelesaikan ketegangan teologis ini dengan memasukkan penjelasan dari sistem ritual yang lebih luas.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. “Mahakudus” dipertahankan sebagai istilah kultis yang mapan, sedangkan susunan kalimat lainnya dibuat langsung dan alami.
