lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan alur dengan langkah naratif baru. Dalam rumus ujaran ilahi, bahasa Indonesia secara alami dan bermartabat memakai 'berfirman'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sambil memberi catatan tentang kebiasaan penerjemahan.
- source_word: אֶל־מֹשֶׁה
  choice: kepada Musa
  rationale: Preposisi אֶל menandai pihak yang dituju oleh firman; 'kepada Musa' merupakan padanan Indonesia yang alami.
- source_word: לֵאמֹר
  choice: '[tidak diterjemahkan secara terpisah]'
  rationale: Infinitif ini memperkenalkan isi ujaran yang menyusul. Dalam bahasa Indonesia, fungsi tersebut sudah tersampaikan secara wajar oleh 'berfirman kepada Musa' dan tanda koma; menerjemahkannya sebagai 'demikian' atau 'kata-Nya' akan menambah unsur yang tidak diperlukan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memuat nama pribadi YHWH. Transliterasi 'Yahweh' mempertahankan nama itu, sedangkan catatan kaki mengakui tradisi penerjemahan dengan 'TUHAN'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Berfirman' dipilih sebagai verba ujaran yang lazim bagi Allah. Struktur dibuat alami dalam bahasa Indonesia tanpa memaksakan padanan tersendiri untuk לֵאמֹר.
