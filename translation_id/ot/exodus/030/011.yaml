  yaml_path: translation/ot/exodus/030/011.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: id
  text: 'Lalu Yahweh berfirman kepada Musa[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “YHWH.” Nama ilahi ini secara tradisional diterjemahkan “TUHAN”; di sini ditransliterasikan “Yahweh.”'
