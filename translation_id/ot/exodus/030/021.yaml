base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/021.yaml
  text: They shall wash their hands and their feet[a], so that they may not die. This shall be a permanent statute for them[b], for him and for his offspring throughout their generations.
translation:
  language: id
  text: Mereka harus membasuh tangan dan kaki mereka supaya mereka tidak mati. Ini akan menjadi ketetapan yang berlaku untuk selama-lamanya[a] bagi mereka, baginya[b], dan bagi keturunannya, turun-temurun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “ketetapan kekal” atau “ketetapan abadi.” Ungkapan Ibrani חָק עוֹלָם merupakan rumusan hukum yang menyatakan ketetapan yang berlaku secara berkelanjutan.
    reason: lexical_alternative
  - marker: b
    text: “Baginya” mengacu kepada Harun dalam konteks terdekat.
    reason: cross_reference
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: mereka harus membasuh
  rationale: Bentuk verba dalam konteks hukum ritual memiliki daya perintah. “Harus membasuh” menyampaikan kewajiban itu secara wajar dalam bahasa Indonesia modern.
- source_word: יְדֵיהֶם וְרַגְלֵיהֶם
  choice: tangan dan kaki mereka
  rationale: Terjemahan langsung yang mempertahankan kedua bagian tubuh yang ditentukan dalam ritual.
- source_word: וְלֹא יָמֻתוּ
  choice: supaya mereka tidak mati
  rationale: Menyatakan tujuan atau akibat yang terkait dengan ketaatan, tanpa mengubahnya menjadi sekadar ramalan.
- source_word: חָק עוֹלָם
  choice: ketetapan tetap
  rationale: חָק menunjuk pada ketentuan yang mengikat, sedangkan עוֹלָם dalam rumusan hukum menyatakan keberlakuan yang terus berlangsung. Pilihan ini mempertahankan daya hukumnya tanpa memaksakan penafsiran metafisis tentang durasi.
- source_word: לָהֶם ... לוֹ
  choice: bagi mereka, bagi dia
  rationale: Mempertahankan peralihan pronomina jamak ke tunggal dalam teks Ibrani dan tidak menyamarkan ketegangan bentuk tersebut.
- source_word: וּלְזַרְעוֹ
  choice: dan keturunannya
  rationale: זֶרַע di sini menunjuk secara kolektif pada garis keturunan; “keturunan” alami dan tepat dalam bahasa Indonesia.
- source_word: לְדֹרֹתָם
  choice: turun-temurun
  rationale: Ungkapan Indonesia yang alami untuk keberlanjutan dalam generasi-generasi mereka.
theological_decisions:
- issue: Durasi ketetapan yang dinyatakan oleh חָק עוֹלָם
  choice: ketetapan tetap
  alternative: ketetapan kekal; ketetapan untuk selama-lamanya
  rationale: Rumusan Ibrani menegaskan keberlakuan yang berkelanjutan dalam tatanan perjanjian dan ibadah. “Tetap” mempertahankan kekuatan rumusan itu tanpa menentukan secara berlebihan bagaimana durasinya harus dipahami di luar cakupan konteks.
- issue: Acuan pronomina tunggal לוֹ
  choice: bagi dia, dengan catatan bahwa acuannya adalah Harun
  alternative: bagi Harun
  rationale: Teks utama mempertahankan pronomina sumber, sedangkan catatan menjelaskan acuan terdekatnya tanpa memasukkan nama ke dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Daya perintah hukum dinyatakan dengan “harus,” sedangkan peralihan dari “mereka” ke “dia” dipertahankan agar bentuk dan ketegangan pronominal teks Ibrani tidak dihapus.
