  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/017.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN.”'
    reason: Menjelaskan bentuk Ibrani dan padanan tradisional dari nama ilahi yang diterjemahkan “Yahweh” dalam teks.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan alur dengan wajar. Dalam bahasa Indonesia Alkitabiah modern, “berfirman” merupakan padanan yang alami dan bermartabat ketika Allah menjadi subjek ujaran.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama diri, bukan diganti dengan gelar “TUHAN”.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai orang yang menjadi tujuan ujaran; “kepada” adalah padanan Indonesia yang alami.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara terpisah
  rationale: Dalam rumus ujaran Ibrani, infinitif ini memperkenalkan kutipan langsung. Karena isi firman baru muncul pada ayat berikutnya, menerjemahkannya secara harfiah sebagai “demikian” atau “dengan berkata” akan terasa kaku; fungsi itu sudah tersampaikan oleh tanda koma dan kelanjutan kutipan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar, sementara catatan kaki memberi tahu pembaca tentang tradisi penerjemahannya.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Lalu” mengalirkan narasi secara alami; “berfirman” mempertahankan register ujaran ilahi yang umum dipahami. Koma dibiarkan pada akhir ayat karena perkataan yang diperkenalkan berlanjut pada ayat berikutnya.
