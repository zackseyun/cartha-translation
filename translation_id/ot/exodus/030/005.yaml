  text: Buatlah tongkat-tongkat pengusung itu dari kayu akasia dan lapisilah tongkat-tongkat itu dengan emas.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Buatlah
  rationale: Bentuk Qal perfektum dengan waw dalam rangkaian petunjuk berfungsi sebagai perintah; bentuk imperatif Indonesia menyampaikan daya preskriptifnya secara alami.
- source_word: הַבַּדִּים
  choice: kayu-kayu pengusung itu
  rationale: Dalam konteks perlengkapan Kemah Suci, בַּד menunjuk pada batang kayu untuk mengusung benda kudus. Pilihan ini lebih jelas daripada sekadar 'batang-batang' dan lebih alami daripada istilah yang kuno.
- source_word: עֲצֵי שִׁטִּים
  choice: dari kayu akasia
  rationale: Frasa konstruksi ini menunjuk pada bahan pembuatannya; 'kayu akasia' adalah padanan Indonesia modern yang jelas.
- source_word: וְצִפִּיתָ
  choice: dan lapisilah
  rationale: Dalam konteks pengerjaan benda, צפה berarti melapisi atau menyalut permukaan dengan suatu bahan; 'lapisilah' alami dan tepat dalam bahasa Indonesia.
- source_word: אֹתָם
  choice: '-lah (objek jamak tersirat: kayu-kayu pengusung itu)'
  rationale: Akhiran objek Ibrani merujuk kembali kepada kayu-kayu pengusung. Dalam bahasa Indonesia, objeknya dapat dipahami dari klausa sebelumnya tanpa pengulangan atau pronomina jamak yang kaku.
- source_word: זָהָב
  choice: dengan emas
  rationale: Kata ini menyatakan bahan pelapis; preposisi 'dengan' diperlukan agar idiomatis dalam bahasa Indonesia.
