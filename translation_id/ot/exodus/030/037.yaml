base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/037.yaml
  text: And the incense that you make according to its composition[a], you shall not make for yourselves[b]; it shall be holy to you for Yahweh.
translation:
  language: id
  text: Dupa yang kaubuat sesuai dengan komposisinya[a] janganlah kalian membuatnya untuk diri kalian sendiri[b]. Kamu harus menganggapnya kudus bagi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sesuai dengan formulanya” atau “sesuai dengan takarannya.”
    reason: lexical_alternative
  - marker: b
    text: Artinya, campuran dupa kudus ini tidak boleh dibuat ulang untuk penggunaan pribadi.
    reason: cultural_note
lexical_decisions:
- source_word: הַקְּטֹרֶת
  choice: dupa
  rationale: Menunjuk pada campuran dupa kudus yang dijelaskan dalam konteks langsung; 'dupa' merupakan padanan Indonesia yang lugas tanpa menambahkan unsur yang tidak tersurat.
- source_word: אֲשֶׁר תַּעֲשֶׂה
  choice: yang kaubuat
  rationale: Mempertahankan klausa relatif dan bentuk orang kedua tunggal dari teks Ibrani secara alami dalam bahasa Indonesia.
- source_word: בְּמַתְכֻּנְתָּהּ
  choice: menurut komposisinya
  rationale: מַתְכֹּנֶת di sini menunjuk pada susunan, takaran, atau formula campuran yang telah ditetapkan. 'Komposisi' mempertahankan cakupan itu tanpa terlalu mempersempit maknanya.
- source_word: לֹא תַעֲשׂוּ לָכֶם
  choice: janganlah kamu buat bagi dirimu sendiri
  rationale: Peralihan ke bentuk jamak dalam larangan dipertahankan melalui 'kamu', sedangkan frasa refleksif/datif diterjemahkan 'bagi dirimu sendiri'; catatan kaki menjelaskan implikasi penggunaan pribadi.
- source_word: קֹדֶשׁ תִּהְיֶה לְךָ
  choice: harus kaut anggap kudus
  rationale: Ungkapan ini menyatakan status dupa itu dalam pandangan umat. Terjemahan ini menghasilkan bahasa Indonesia yang alami sambil mempertahankan tuntutan untuk memperlakukannya sebagai kudus.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi menandai pengkhususan atau peruntukan bagi Yahweh, dan nama perjanjian יהוה ditransliterasikan 'Yahweh'.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian itu dan mengikuti keputusan proyek tanpa menggantinya dengan gelar.
- issue: Relasi antara kekudusan dupa dan Yahweh
  choice: dianggap kudus bagi Yahweh
  alternative: menjadi milik Yahweh sebagai sesuatu yang kudus
  rationale: Susunan קֹדֶשׁ תִּהְיֶה לְךָ לַיהוָה mengandung nuansa status kudus dalam pandangan penerima sekaligus pengkhususan bagi Yahweh. Terjemahan tidak mempersempitnya menjadi kepemilikan saja.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Bentuk 'kaubuat' mempertahankan sapaan tunggal pada klausa pertama, sedangkan 'kamu' dapat mencakup kelompok pada larangan, sesuai perubahan jumlah dalam teks Ibrani. Istilah 'komposisi' dibantu catatan kaki agar nuansa formula dan takaran tetap terlihat.
