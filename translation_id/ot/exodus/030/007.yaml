base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/007.yaml
  text: Aaron shall burn fragrant incense on it morning by morning[a]; when he tends the lamps[b], he shall burn it.
translation:
  language: id
  text: Harun harus membakar dupa harum di atasnya setiap pagi[a]. Ketika ia merawat pelita-pelita itu[b], ia harus membakar dupa tersebut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pagi demi pagi.” Pengulangan dalam bahasa Ibrani menekankan pelaksanaan yang teratur setiap hari.
    reason: lexical_alternative
  - marker: b
    text: Atau “membereskan pelita-pelita itu.” Kata kerja Ibrani ini dapat secara lebih khusus menunjuk pada tindakan menata dan mempersiapkan pelita, termasuk merapikan sumbunya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: harus membakar
  rationale: Bentuk Hifil dari קטר dalam konteks ibadah menunjuk pada tindakan membakar bahan di mazbah sehingga asapnya naik. Pilihan ini alami dalam bahasa Indonesia dan tetap mempertahankan tindakan ritualnya.
- source_word: עָלָיו
  choice: di atasnya
  rationale: Merujuk kembali kepada mazbah pembakaran dupa dalam konteks sebelumnya dan mempertahankan makna lokatif.
- source_word: קְטֹרֶת סַמִּים
  choice: dupa harum
  rationale: קְטֹרֶת berarti dupa, sedangkan סַמִּים menunjuk pada bahan-bahan aromatik. 'Dupa harum' menyampaikan gabungan maknanya secara alami tanpa mempersempit jenis ramuannya.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: setiap pagi
  rationale: Pengulangan kata Ibrani menyatakan kebiasaan distributif yang berlangsung secara teratur; 'setiap pagi' merupakan ungkapan Indonesia yang jelas dan alami.
- source_word: בְּהֵיטִיבוֹ
  choice: ketika ia merawat
  rationale: Dalam konteks ini bentuk Hifil dari יטב berarti membereskan atau mempersiapkan pelita, yang mungkin mencakup pemangkasan sumbu. 'Merawat' mempertahankan cakupan tindakan tanpa membatasinya pada satu langkah saja.
- source_word: הַנֵּרֹת
  choice: pelita-pelita itu
  rationale: Bentuk jamak tertentu ini merujuk kepada pelita-pelita tempat kudus yang telah disebut dalam konteks. Pengulangan kata menandai bentuk jamak dengan jelas dalam bahasa Indonesia.
- source_word: יַקְטִירֶנָּה
  choice: ia harus membakar dupa tersebut
  rationale: Akhiran feminin tunggal merujuk kembali kepada קְטֹרֶת. Mengulangi 'dupa tersebut' lebih jelas dan alami dalam bahasa Indonesia daripada memakai pronomina benda yang berpotensi kabur.
