  source_fidelity: 'Terjemahan dengan setia menyampaikan unsur-unsur pokok teks Ibrani: Harun sebagai pelaku, pembakaran dupa aromatik di atas mazbah, pengulangan distributif “setiap pagi,” serta tindakan itu ketika ia menangani pelita-pelita. “Harus membakar” secara memadai menyatakan bentuk imperfek dalam ketetapan ritual, dan pengulangan “dupa tersebut” dengan tepat menjelaskan rujukan akhiran feminin tunggal pada קְטֹרֶת.'
