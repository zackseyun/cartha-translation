  text: וְ/כִפֶּ֤ר אַהֲרֹן֙ עַל קַרְנֹתָ֔י/ו אַחַ֖ת בַּ/שָּׁנָ֑ה מִ/דַּ֞ם חַטַּ֣את הַ/כִּפֻּרִ֗ים אַחַ֤ת בַּ/שָּׁנָה֙ יְכַפֵּ֤ר עָלָי/ו֙ לְ/דֹרֹ֣תֵי/כֶ֔ם קֹֽדֶשׁ קָֽדָשִׁ֥ים ה֖וּא לַ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/030/010.yaml
  text: Aaron shall make atonement on its horns once a year[a]. With the blood of the sin offering of atonement he shall make atonement for it once a year throughout your generations. It is most holy to Yahweh.
translation:
  language: id
  text: Harun harus mengadakan pendamaian pada tanduk-tanduk mezbah itu sekali setahun. Dengan darah kurban penghapus dosa untuk pendamaian[a], ia harus mengadakan pendamaian bagi mezbah itu sekali setahun, turun-temurun. Mezbah itu mahakudus bagi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan darah kurban penghapus dosa pendamaian.” Secara harfiah, “dari darah kurban penghapus dosa dari pendamaian-pendamaian”; kata Ibrani untuk “pendamaian” berbentuk jamak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר / יְכַפֵּר
  choice: harus mengadakan pendamaian
  rationale: Dalam konteks ritual keimaman, כפר menunjuk pada pelaksanaan ritus pendamaian. Ungkapan ini mempertahankan istilah teologis yang lazim tanpa membatasinya hanya pada makna menutupi atau membersihkan.
- source_word: קַרְנֹתָיו
  choice: tanduk-tanduk mezbah itu
  rationale: Akhiran pronominal mengacu pada mezbah dupa dalam konteks sebelumnya. Penyebutan kembali 'mezbah itu' lebih alami dan jelas dalam bahasa Indonesia.
- source_word: אַחַת בַּשָּׁנָה
  choice: sekali setahun
  rationale: Padanan Indonesia yang alami dan tepat untuk frekuensi ritual tersebut.
- source_word: מִדַּם
  choice: dengan darah
  rationale: Walaupun מִן secara harfiah dapat berarti 'dari', dalam konteks kurban frasa ini menyatakan sarana yang dipakai untuk ritus.
- source_word: חַטַּאת
  choice: kurban penghapus dosa
  rationale: Dalam konteks kultis, חטאת menunjuk pada jenis kurban, bukan pada dosa sebagai gagasan abstrak. Istilah ini jelas dan telah dikenal luas dalam bahasa Indonesia.
- source_word: הַכִּפֻּרִים
  choice: untuk pendamaian
  rationale: Bentuk jamak abstrak Ibrani diungkapkan secara alami dalam bahasa Indonesia sebagai tujuan atau fungsi kurban, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: לְדֹרֹתֵיכֶם
  choice: turun-temurun
  rationale: Ungkapan Indonesia yang ringkas dan alami untuk keberlakuan sepanjang generasi-generasi umat.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: mahakudus
  rationale: Konstruksi superlatif Ibrani menyatakan tingkat kekudusan tertinggi. 'Mahakudus' menghindari kesan bahwa frasa ini menunjuk pada ruang Mahakudus.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi menandai hubungan atau pengkhususan kepada Yahweh; 'bagi' alami dalam konteks ini, dan nama perjanjian dipertahankan sebagai nama diri.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memuat nama perjanjian יהוה, dan lapisan konsultasi POB yang diberikan juga menampilkan 'Yahweh'. Transliterasi ini mempertahankan bahwa bentuk tersebut adalah nama diri tanpa memasukkan kekhasan denominasi.
- issue: Cakupan tindakan pendamaian
  choice: pendamaian diadakan pada tanduk-tanduk dan bagi mezbah
  alternative: mezbah dibersihkan atau ditahirkan
  rationale: Frasa כפר על dapat melibatkan pemurnian ritual, tetapi teks tidak menggantikan istilah pendamaian dengan verba 'membersihkan'. Terjemahan mempertahankan ketegangan semantis ritual tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur ayat dipertahankan dengan pengulangan 'sekali setahun' sebagaimana dalam teks Ibrani. Rujukan pronominal diperjelas menjadi 'mezbah itu' agar alami dalam bahasa Indonesia tanpa mengubah acuannya.
