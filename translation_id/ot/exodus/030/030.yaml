translation:
  language: id
  text: Engkau harus mengurapi Harun dan putra-putranya serta menguduskan mereka untuk menjalankan tugas sebagai imam bagi-Ku.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּמְשָׁח
  choice: harus mengurapi
  rationale: Kata משׁח menunjuk pada pengolesan minyak dalam ritus penetapan. 'Mengurapi' mempertahankan makna ritual dan teologisnya; bentuk yiqtol dalam rangkaian perintah ini diterjemahkan secara wajar dengan 'harus'.
- source_word: וְקִדַּשְׁתָּ
  choice: lalu menguduskan
  rationale: Bentuk Piel dari קדשׁ berarti menetapkan atau memisahkan sebagai kudus. 'Menguduskan' alami dalam bahasa Indonesia Alkitabiah dan mempertahankan daya kultis istilah sumber.
- source_word: לְכַהֵן
  choice: melayani ... sebagai imam
  rationale: Bentuk verbal כהן berarti menjalankan fungsi keimaman. Ungkapan ini menyampaikan peran aktif tersebut dengan jelas dalam bahasa Indonesia modern.
- source_word: לִי
  choice: melayani-Ku
  rationale: Preposisi ל dengan sufiks orang pertama menyatakan bahwa pelayanan itu ditujukan kepada TUHAN. Peleburan ke dalam 'melayani-Ku' alami dan tetap dekat dengan struktur maknanya.
- source_word: בָּנָיו
  choice: anak-anak lelakinya
  rationale: Teks Ibrani secara khusus menyebut anak-anak laki-laki Harun dalam konteks garis keimaman, sehingga unsur gender dipertahankan.
- source_word: וְאֶת ... וְאֶת
  choice: Harun dan anak-anak lelakinya
  rationale: Pengulangan penanda objek langsung tidak perlu ditiru dalam bahasa Indonesia; koordinasi dengan 'dan' menyampaikan kedua objek secara alami.
theological_decisions:
- issue: Latar kultis קדשׁ dan כהן
  choice: '''menguduskan'' dan ''melayani-Ku sebagai imam'''
  alternative: '''menahbiskan'' dan ''menjalankan tugas keimaman bagi-Ku'''
  rationale: Pilihan ini mempertahankan tindakan pemisahan sebagai kudus dan fungsi imamat tanpa memasukkan konsep jabatan gerejawi yang lebih kemudian.
- issue: Pengungkapan gender בָּנָיו
  choice: '''anak-anak lelakinya'''
  alternative: '''anak-anaknya'''
  rationale: Sumber bersifat maskulin secara eksplisit dan konteksnya merujuk kepada putra-putra Harun yang ditetapkan menjadi imam.
- issue: Daya perintah bentuk verbal
  choice: '''harus mengurapi ... lalu menguduskan'''
  alternative: '''akan mengurapi ... dan akan menguduskan'''
  rationale: Dalam konteks petunjuk ilahi, bentuk-bentuk verba menyatakan instruksi. 'Harus' membuat daya perintah jelas, sedangkan 'lalu' menandai kelanjutan tindakan tanpa menambahkan urutan teologis yang kaku.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah ritual 'mengurapi' serta 'menguduskan' dipertahankan karena dikenal luas dan tepat bagi konteks penetapan imam. Tidak diperlukan catatan kaki.
