  text: For Pharaoh will say of the sons of Israel[a], ‘They are confused in the land[c][b]; the wilderness has shut them in.’
translation:
  language: id
  text: Sebab Firaun akan berkata tentang bani Israel, “Mereka kebingungan di negeri itu; padang gurun telah mengurung mereka.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָמַר
  choice: Sebab ... akan berkata
  rationale: Bentuk waw + qatal dipahami beracuan masa depan karena TUHAN sedang meramalkan tanggapan Firaun; “sebab” menyampaikan fungsi penjelas dalam konteks.
- source_word: פַּרְעֹה
  choice: Firaun
  rationale: Bentuk baku dalam bahasa Indonesia untuk gelar raja Mesir.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: tentang bani Israel
  rationale: Preposisi ל dengan אמר dapat menandai pihak yang dibicarakan. “Bani Israel” mempertahankan ungkapan kekerabatan Ibrani dalam bentuk yang lazim dan wajar dalam bahasa Indonesia.
- source_word: נְבֻכִים
  choice: kebingungan
  rationale: Partisip ini menyatakan keadaan bingung, kehilangan arah, atau tidak tahu harus berbuat apa. “Kebingungan” tidak menambahkan gagasan mengembara yang tidak dinyatakan secara eksplisit.
- source_word: הֵם
  choice: mereka
  rationale: Subjek pronominal dinyatakan secara eksplisit sesuai struktur klausa predikatif Ibrani.
- source_word: בָּאָרֶץ
  choice: di negeri ini
  rationale: אֶרֶץ berarti negeri atau wilayah. Kata “ini” membuat rujukan deiktisnya wajar dalam tuturan Firaun tanpa menentukan secara sempit apakah yang dimaksud seluruh Mesir atau kawasan setempat.
- source_word: סָגַר עֲלֵיהֶם
  choice: telah mengurung mereka
  rationale: Ungkapan ini menggambarkan keadaan tertutup atau terperangkap; “mengurung” mempertahankan citra pembatasan ruang secara alami dalam bahasa Indonesia.
- source_word: הַמִּדְבָּר
  choice: padang gurun
  rationale: מִדְבָּר menunjuk kawasan liar dan tidak dibudidayakan, tidak selalu gurun pasir; “padang gurun” merupakan padanan Alkitabiah yang jelas dan umum.
