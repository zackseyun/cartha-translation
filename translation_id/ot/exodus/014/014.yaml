  text: Yahweh will fight for you[a], and you must be silent.
translation:
  language: id
  text: Yahweh akan berperang untuk kalian, sedangkan kalian harus diam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kalian akan diam,” “kalian hendaknya tetap diam,” atau secara tradisional, “kalian akan berdiam diri.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: יִלָּחֵם
  choice: akan berperang
  rationale: Bentuk Nifal imperfek dari לחם menyatakan tindakan yang akan dilakukan Yahweh; 'berperang' mempertahankan nuansa militernya secara alami.
- source_word: לָכֶם
  choice: bagi kalian
  rationale: Preposisi ל dengan sufiks orang kedua jamak menunjukkan bahwa Yahweh bertindak demi kepentingan bangsa Israel.
- source_word: וְאַתֶּם
  choice: sedangkan kalian
  rationale: Konjungsi dan pronomina mandiri menonjolkan kontras antara tindakan Yahweh dan sikap yang dituntut dari Israel.
- source_word: תַּחֲרִישׁוּן
  choice: harus berdiam diri
  rationale: Verba Hifil imperfek dari חרשׁ dapat berarti diam atau tidak bertindak. Dalam konteks seruan Musa, pembacaan bernuansa perintah wajar, tetapi bentuknya juga memungkinkan pernyataan tentang apa yang akan mereka lakukan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Daya ujar תַּחֲרִישׁוּן
  choice: harus berdiam diri
  alternative: akan berdiam diri
  rationale: Konteks nasihat Musa mendukung daya perintah, tetapi morfologi imperfek memungkinkan nuansa prediktif; alternatif itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. 'Kalian' menyatakan orang kedua jamak secara jelas; 'berdiam diri' mempertahankan kemungkinan makna diam dan tidak mengambil tindakan tanpa mempersempitnya secara berlebihan.
