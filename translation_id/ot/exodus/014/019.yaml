  text: וַ/יִּסַּ֞ע מַלְאַ֣ךְ הָ/אֱלֹהִ֗ים הַ/הֹלֵךְ֙ לִ/פְנֵי֙ מַחֲנֵ֣ה יִשְׂרָאֵ֔ל וַ/יֵּ֖לֶךְ מֵ/אַחֲרֵי/הֶ֑ם וַ/יִּסַּ֞ע עַמּ֤וּד הֶֽ/עָנָן֙ מִ/פְּנֵי/הֶ֔ם וַ/יַּֽעֲמֹ֖ד מֵ/אַחֲרֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/019.yaml
  text: Then the angel of God[a], who had been going before the camp of Israel, moved and went behind them; and the pillar of cloud moved from before them and stood behind them.
translation:
  language: id
  text: Kemudian malaikat Allah[a], yang berjalan di depan perkemahan Israel, berpindah lalu pergi ke belakang mereka. Tiang awan itu pun berpindah dari depan mereka dan berdiri di belakang mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “utusan Allah”. Kata Ibrani ini dapat berarti “malaikat” atau “utusan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסַּע
  choice: berpindah
  rationale: Dalam konteks ini, subjeknya mengubah posisi dari depan ke belakang, bukan mulai menempuh perjalanan. 'Berpindah' menyampaikan gerakan spasial itu secara alami.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: malaikat Allah
  rationale: מַלְאָךְ dapat berarti 'malaikat' atau 'utusan'. Dalam konteks pembimbing ilahi ini, 'malaikat Allah' merupakan padanan yang alami dan lazim, sementara kemungkinan 'utusan' dipertahankan dalam catatan kaki.
- source_word: הַהֹלֵךְ
  choice: yang selama itu berjalan
  rationale: Bentuk partisipel menunjukkan tindakan yang berlangsung sebelum perpindahan yang kemudian diceritakan. 'Selama itu' membuat hubungan waktunya jelas tanpa terlalu menafsirkan.
- source_word: לִפְנֵי מַחֲנֵה יִשְׂרָאֵל
  choice: di depan perkemahan Israel
  rationale: Ungkapan ini bersifat spasial. 'Di depan perkemahan Israel' jelas dan mempertahankan hubungan konstruksi Ibraninya.
- source_word: וַיֵּלֶךְ מֵאַחֲרֵיהֶם
  choice: pergi ke belakang mereka
  rationale: מֵאַחֲרֵי di sini menunjuk posisi di bagian belakang, bukan tindakan mengikuti atau mengejar.
- source_word: עַמּוּד הֶעָנָן
  choice: tiang awan
  rationale: Padanan ini ringkas, lazim, dan mempertahankan gambaran konkret penuntun ilahi yang terlihat.
- source_word: מִפְּנֵיהֶם
  choice: dari depan mereka
  rationale: Padanan ini menyatakan posisi awal secara jelas dan selaras dengan ungkapan spasial sebelumnya.
- source_word: וַיַּעֲמֹד
  choice: berdiri
  rationale: עמד pada dasarnya berarti 'berdiri' dan di sini menggambarkan tiang itu menempati posisi tetap di belakang Israel tanpa menambahkan nuansa militer yang tidak eksplisit.
theological_decisions:
- issue: Identitas dan hakikat מַלְאַךְ הָאֱלֹהִים
  choice: Diterjemahkan 'malaikat Allah' tanpa menetapkan apakah sosok ini malaikat ciptaan, penampakan Allah, atau kristofani.
  alternative: Utusan Allah; atau terjemahan eksplisit yang mengidentifikasikannya sebagai penampakan ilahi.
  rationale: Teks Ibrani menamai sosok itu, tetapi dalam ayat ini tidak menjelaskan hakikat ontologisnya. Terjemahan mempertahankan ketegangan teologis tersebut dan tidak memasukkan kesimpulan doktrinal dari luar teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. 'Perkemahan' dipilih untuk מַחֲנֶה agar merujuk pada seluruh rombongan Israel yang sedang berkemah; pengulangan 'berpindah' mempertahankan kesejajaran tindakan malaikat dan tiang awan.
