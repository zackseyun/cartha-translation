source:
  edition: WLC
  text: וַ/יָּשֻׁ֣בוּ הַ/מַּ֗יִם וַ/יְכַסּ֤וּ אֶת הָ/רֶ֨כֶב֙ וְ/אֶת הַ/פָּ֣רָשִׁ֔ים לְ/כֹל֙ חֵ֣יל פַּרְעֹ֔ה הַ/בָּאִ֥ים אַחֲרֵי/הֶ֖ם בַּ/יָּ֑ם לֹֽא נִשְׁאַ֥ר בָּ/הֶ֖ם עַד אֶחָֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/028.yaml
  text: And the waters returned and covered the chariots and the horsemen[a], all the army of Pharaoh that had gone after them into the sea; not one of them remained.
translation:
  language: id
  text: Air pun kembali dan menutupi kereta-kereta serta para penunggang kuda[a]—seluruh pasukan Firaun yang telah masuk ke laut mengejar mereka. Tidak seorang pun dari antara mereka yang tersisa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pasukan berkuda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: kembali
  rationale: Kata שׁוב di sini menggambarkan air yang kembali ke tempat atau keadaannya semula setelah terbelah.
- source_word: הַמַּיִם
  choice: air
  rationale: Bentuk Ibrani ini secara tata bahasa jamak, tetapi dalam bahasa Indonesia nomina massa 'air' paling alami dan tetap mempertahankan gambaran konkret.
- source_word: וַיְכַסּוּ
  choice: menutupi
  rationale: Ini mempertahankan arti dasar כסה, 'menutupi', tanpa menambahkan penafsiran seperti 'menenggelamkan' atau 'melanda'.
- source_word: הָרֶכֶב
  choice: kereta-kereta
  rationale: רכב dapat menunjuk secara kolektif pada kereta perang atau pasukan kereta; bentuk ulang menghasilkan ungkapan Indonesia yang jelas dan alami dalam pasangan militer ini.
- source_word: הַפָּרָשִׁים
  choice: para penunggang kuda
  rationale: Ungkapan ini langsung dan mudah dipahami untuk prajurit berkuda, sementara 'pasukan berkuda' merupakan alternatif kolektif yang lebih interpretatif.
- source_word: לְכֹל חֵיל פַּרְעֹה
  choice: seluruh pasukan Firaun
  rationale: חֵיל dalam konteks ini berarti kekuatan atau pasukan militer, dan 'seluruh' mempertahankan cakupan total לְכֹל.
- source_word: הַבָּאִים אַחֲרֵיהֶם בַּיָּם
  choice: yang telah masuk ke laut mengejar mereka
  rationale: Konteks naratif mendukung aspek telah berlangsung; susunan Indonesia ini menyatakan gerak masuk ke laut sekaligus pengejaran terhadap Israel.
- source_word: לֹא נִשְׁאַר בָּהֶם עַד אֶחָד
  choice: Tidak seorang pun dari antara mereka yang tersisa
  rationale: Ungkapan ini menyampaikan penegasan total dari idiom Ibrani tanpa memperluas cakupannya melampaui pasukan pengejar yang disebutkan.
theological_decisions:
- issue: Cakupan kebinasaan pasukan Firaun
  choice: Pernyataan bahwa tidak seorang pun tersisa berlaku bagi seluruh pasukan Firaun yang masuk ke laut untuk mengejar Israel.
  alternative: Memahaminya sebagai pernyataan mengenai setiap tentara Mesir di mana pun.
  rationale: Secara sintaksis, klausa penutup merujuk pada kelompok yang baru disebut, yaitu pasukan Firaun yang masuk ke laut mengejar Israel; terjemahan mempertahankan ketotalan itu tanpa memperluasnya kepada seluruh militer Mesir.
translation_notes:
  register: Bahasa Indonesia baku modern, wajar, dan bermartabat. Tanda pisah mempertahankan hubungan aposisional antara kereta serta penunggang kuda dan seluruh pasukan Firaun; kalimat kedua menonjolkan penegasan akhir teks Ibrani.
