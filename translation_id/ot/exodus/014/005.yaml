revisions:
- from: Ketika raja Mesir diberi tahu bahwa bangsa itu telah melarikan diri, hati Firaun dan para pegawainya berbalik terhadap bangsa itu[a]. Mereka berkata, “Apa yang telah kita lakukan ini? Kita telah membiarkan Israel pergi sehingga mereka tidak lagi melayani kita!”[b]
  to: Raja Mesir diberi tahu bahwa bangsa itu telah melarikan diri. Hati Firaun dan para pegawainya berbalik melawan bangsa itu[a], lalu mereka berkata, “Apa ini yang telah kita lakukan, sehingga kita membiarkan Israel pergi dan tidak lagi melayani kita?”[b]
  rationale: Revisi menghapus penanda waktu yang tidak terdapat dalam sumber, memakai ungkapan Indonesia yang lebih alami untuk perubahan sikap yang bermusuhan, dan memulihkan pertanyaan kausal sebagai satu kesatuan. Catatan kaki disederhanakan agar alternatif leksikalnya jelas dan selaras dengan penanda dalam teks.
