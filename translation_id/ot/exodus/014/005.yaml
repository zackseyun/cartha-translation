  text: וַ/יֻּגַּד֙ לְ/מֶ֣לֶךְ מִצְרַ֔יִם כִּ֥י בָרַ֖ח הָ/עָ֑ם וַ֠/יֵּהָפֵךְ לְבַ֨ב פַּרְעֹ֤ה וַ/עֲבָדָי/ו֙ אֶל הָ/עָ֔ם וַ/יֹּֽאמרוּ֙ מַה זֹּ֣את עָשִׂ֔ינוּ כִּֽי שִׁלַּ֥חְנוּ אֶת יִשְׂרָאֵ֖ל מֵ/עָבְדֵֽ/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/005.yaml
  text: It was reported to the king of Egypt that the people had fled[a], and the heart of Pharaoh and his servants was turned against the people, and they said, “What is this we have done[b], that we have let Israel go from serving us?”
translation:
  language: id
  text: Raja Mesir diberi tahu bahwa bangsa itu telah melarikan diri. Hati Firaun dan para pegawainya berbalik melawan bangsa itu[a], lalu mereka berkata, “Apa ini yang telah kita lakukan, sehingga kita membiarkan Israel pergi dan tidak lagi melayani kita?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pikiran Firaun dan para pegawainya berubah terhadap bangsa itu.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “karena kita telah melepaskan Israel dari pengabdian kepada kita?” Harfiah, “dari melayani kita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד לְמֶלֶךְ מִצְרַיִם
  choice: raja Mesir diberi tahu
  rationale: Bentuk pasif Hophal mempertahankan pelapor yang tidak disebutkan; susunan ini alami dalam bahasa Indonesia.
- source_word: כִּי בָרַח הָעָם
  choice: bahwa bangsa itu telah melarikan diri
  rationale: ברח berarti melarikan diri; 'telah' menandai bahwa peristiwa itu mendahului laporan. 'Bangsa itu' sesuai konteks Israel sebagai suatu umat.
- source_word: וַיֵּהָפֵךְ לְבַב פַּרְעֹה וַעֲבָדָיו
  choice: hati Firaun dan para pegawainya berbalik
  rationale: Mempertahankan metafora Ibrani tentang hati sebagai pusat pikiran dan kehendak, sekaligus memakai ungkapan Indonesia yang wajar.
- source_word: אֶל הָעָם
  choice: terhadap bangsa itu
  rationale: Kata depan ini secara leksikal bersifat terarah dan dapat berarti 'terhadap'; konteks menyiratkan perubahan yang bermusuhan tanpa harus menambahkan makna itu secara eksplisit.
- source_word: מַה זֹּאת עָשִׂינוּ
  choice: Apa yang telah kita lakukan ini?
  rationale: Mempertahankan unsur interogatif dan demonstratif dalam ungkapan penyesalan atau keterkejutan tersebut.
- source_word: שִׁלַּחְנוּ אֶת יִשְׂרָאֵל מֵעָבְדֵנוּ
  choice: Kita telah membiarkan Israel pergi sehingga mereka tidak lagi melayani kita
  rationale: שׁלח dalam konteks ini berarti membiarkan pergi atau melepaskan; מֵעָבְדֵנוּ menyatakan berhentinya pelayanan Israel kepada Mesir. Rumusan ini jelas dan alami tanpa memperkuatnya menjadi istilah 'budak' dalam teks utama.
theological_decisions:
- issue: Makna antropologis לְבַב
  choice: hati
  alternative: pikiran; sikap
  rationale: Istilah Ibrani mencakup pikiran dan kehendak. 'Hati' mempertahankan citra sumber serta ketegangan semantiknya tanpa mereduksinya menjadi kategori psikologis modern.
- issue: Arah perubahan hati dalam אֶל הָעָם
  choice: berbalik terhadap bangsa itu
  alternative: berubah terhadap bangsa itu; berbalik menentang bangsa itu
  rationale: Konteks menunjukkan permusuhan, tetapi אֶל sendiri tidak harus diterjemahkan 'menentang'. Teks utama mempertahankan arah perubahan, sedangkan catatan menjelaskan kemungkinan pengungkapan maknanya.
- issue: Status Israel dalam מֵעָבְדֵנוּ
  choice: tidak lagi melayani kita
  alternative: lepas dari pengabdian kepada kita; tidak lagi menjadi budak kita
  rationale: Konteks luas jelas menggambarkan perbudakan, tetapi klausa ini secara langsung memakai akar עבד untuk melayani. Pilihan utama dekat dengan bentuk sumber dan tidak memasukkan istilah yang lebih kuat ke dalam klausa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Firaun' mengikuti bentuk Indonesia yang lazim. 'Para pegawainya' dipilih untuk עֲבָדָיו dalam konteks istana, sehingga tidak rancu dengan orang Israel yang dipaksa melayani. Tanda seru dalam ucapan menyampaikan penyesalan dan keterkejutan yang terkandung dalam pertanyaan Ibrani.
