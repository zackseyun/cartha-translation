  text: וַ/יֹּאמְרוּ֮ אֶל מֹשֶׁה֒ הַֽ/מִ/בְּלִ֤י אֵין קְבָרִים֙ בְּ/מִצְרַ֔יִם לְקַחְתָּ֖/נוּ לָ/מ֣וּת בַּ/מִּדְבָּ֑ר מַה זֹּאת֙ עָשִׂ֣יתָ לָּ֔/נוּ לְ/הוֹצִיאָ֖/נוּ מִ/מִּצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/011.yaml
  text: And they said to Moses[a], “Was it because there were no graves in Egypt that you took us away to die in the wilderness? What is this you have done to us by bringing us out of Egypt?”
translation:
  language: id
  text: Mereka berkata kepada Musa, “Apakah karena tidak ada kuburan di Mesir maka engkau membawa kami pergi untuk mati di padang belantara? Apa yang telah kauperbuat terhadap kami dengan membawa kami keluar dari Mesir?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה
  choice: Mereka berkata kepada Musa
  rationale: Bentuk naratif וַיֹּאמְרוּ secara wajar diterjemahkan 'mereka berkata', sedangkan אֶל menandai arah ujaran kepada Musa.
- source_word: הֲמִבְּלִי אֵין קְבָרִים בְּמִצְרַיִם
  choice: Apakah karena tidak ada kuburan di Mesir
  rationale: Ungkapan ini merupakan pertanyaan retoris yang menyindir. Susunan Indonesia ini alami dan mempertahankan ironi serta unsur 'tidak ada kuburan' dalam bahasa Ibrani.
- source_word: לְקַחְתָּנוּ
  choice: engkau membawa kami pergi
  rationale: לקח berarti mengambil atau membawa; 'membawa kami pergi' mempertahankan gerak menjauh dari Mesir dan membedakannya dari הוציא pada akhir ayat.
- source_word: לָמוּת בַּמִּדְבָּר
  choice: untuk mati di padang belantara
  rationale: Infinitif לָמוּת menyatakan tujuan atau hasil, sedangkan מִדְבָּר menunjuk wilayah liar dan tidak dihuni, tidak semata-mata gurun berpasir.
- source_word: מַה־זֹּאת עָשִׂיתָ לָּנוּ
  choice: Apa yang telah kauperbuat terhadap kami
  rationale: Terjemahan ini mempertahankan bentuk interogatif seruan dan nada tuduhan, tanpa mengubahnya menjadi pertanyaan 'mengapa'.
- source_word: לְהוֹצִיאָנוּ מִמִּצְרָיִם
  choice: dengan membawa kami keluar dari Mesir
  rationale: Bentuk infinitif menjelaskan tindakan yang dipersoalkan. 'Membawa ... keluar' mempertahankan motif eksodus dan kaitannya dengan klausa sebelumnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Pronomina 'engkau' dipakai dalam ujaran langsung kepada Musa, sedangkan bentuk terikat 'kauperbuat' menjaga kelancaran. 'Padang belantara' dipilih untuk cakupan מִדְבָּר yang lebih luas daripada gurun pasir.
