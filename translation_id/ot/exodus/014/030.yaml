id: EXO.14.30
reference: Exodus 14:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יּ֨וֹשַׁע יְהוָ֜ה בַּ/יּ֥וֹם הַ/ה֛וּא אֶת יִשְׂרָאֵ֖ל מִ/יַּ֣ד מִצְרָ֑יִם וַ/יַּ֤רְא יִשְׂרָאֵל֙ אֶת מִצְרַ֔יִם מֵ֖ת עַל שְׂפַ֥ת הַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/030.yaml
  text: So Yahweh saved Israel that day from the hand of Egypt[b][a], and Israel saw the Egyptians dead on the seashore.
translation:
  language: id
  text: Demikianlah Yahweh menyelamatkan Israel pada hari itu dari tangan Mesir[a], dan Israel melihat mayat orang-orang Mesir di tepi laut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani “dari tangan Mesir” berarti dibebaskan dari kuasa Mesir.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “di bibir laut”; maksudnya di tepi atau pantai laut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: menyelamatkan
  rationale: Bentuk Hifil dari ישׁע menyatakan tindakan Yahweh membebaskan Israel dari bahaya. “Menyelamatkan” alami dalam bahasa Indonesia dan mempertahankan bobot teologis tindakan penyelamatan ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu
  rationale: Ungkapan waktu ini diterjemahkan langsung dan alami dalam bahasa Indonesia.
- source_word: מִיַּד מִצְרָיִם
  choice: dari tangan Mesir
  rationale: Metafora Ibrani “dari tangan” dipertahankan karena dapat dipahami dalam bahasa Indonesia sebagai pembebasan dari kuasa atau kendali Mesir; catatan kaki menjelaskan idiomnya.
- source_word: מִצְרַיִם / מִצְרָיִם
  choice: Mesir / orang-orang Mesir
  rationale: Pada klausa pertama nama itu menunjuk kepada Mesir sebagai kuasa nasional, sedangkan pada klausa kedua menunjuk kepada orang-orang Mesir yang tewas.
- source_word: וַיַּרְא
  choice: melihat
  rationale: Padanan langsung dan alami bagi ראה dalam narasi.
- source_word: מֵת
  choice: mayat
  rationale: Adjektiva tunggal Ibrani berfungsi secara kolektif untuk menyatakan bahwa orang-orang Mesir itu telah mati. Perubahan menjadi nomina “mayat” menghindari kesan bahwa Israel menyaksikan proses kematian mereka dan menghasilkan bahasa Indonesia yang wajar.
- source_word: עַל שְׂפַת הַיָּם
  choice: di tepi laut
  rationale: Ungkapan ini secara harfiah memakai gambaran “bibir laut” dan secara idiomatis berarti tepi atau pantai laut.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama pribadi ilahi tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan naratif dipertahankan, metafora “tangan Mesir” dibiarkan dalam teks dengan penjelasan singkat, sedangkan “mayat orang-orang Mesir” dipilih demi kejelasan bahwa yang dilihat adalah keadaan sesudah kematian.
source_grounding:
  english_pob_role: consult_only
