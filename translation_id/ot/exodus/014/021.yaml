  source_fidelity: 'Terjemahan pada dasarnya setia pada urutan dan isi Ibrani: Musa mengulurkan tangan, Yahweh menggerakkan/menyurutkan laut melalui angin timur yang kuat sepanjang malam, laut menjadi tanah kering, dan air terbelah. Namun, “ke atas laut” tidak menyatakan relasi spasial עַל־הַיָּם secara idiomatis dalam bahasa Indonesia dan dapat terbaca seolah-olah tangan Musa bergerak naik. “Di atas laut” lebih tepat.'
  naturalness: Bahasa umumnya baku dan jelas. Mengganti “ke atas laut” dengan “di atas laut” menghasilkan ungkapan yang alami. “Airnya” dapat dibuat lebih eksplisit sebagai “air laut itu” agar rujukannya tidak kabur dan agar tetap menyatakan bahwa yang terbelah ialah air.
  terminology: “Yahweh” secara konsisten mempertahankan nama ilahi יהוה. “Angin timur yang kuat,” “tanah kering,” dan “terbelah” merupakan padanan modern yang tepat bagi unsur-unsur kunci teks.
