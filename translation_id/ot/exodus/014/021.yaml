  text: וַ/יֵּ֨ט מֹשֶׁ֣ה אֶת יָד/וֹ֮ עַל הַ/יָּם֒ וַ/יּ֣וֹלֶךְ יְהוָ֣ה אֶת הַ֠/יָּם בְּ/ר֨וּחַ קָדִ֤ים עַזָּה֙ כָּל הַ/לַּ֔יְלָה וַ/יָּ֥שֶׂם אֶת הַ/יָּ֖ם לֶ/חָרָבָ֑ה וַ/יִּבָּקְע֖וּ הַ/מָּֽיִם־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/021.yaml
  text: Then Moses stretched out his hand over the sea[a], and Yahweh drove the sea back by a strong east wind all night and made the sea dry land[d][c][b], and the waters were split.
translation:
  language: id
  text: Lalu Musa mengulurkan tangannya di atas laut. Yahweh membuat laut itu surut dengan angin timur yang kuat sepanjang malam dan menjadikan laut itu tanah kering. Air laut itu pun terbelah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Air laut itu pun terbagi.”'
    reason: Kata Ibrani dapat diterjemahkan “terbelah” atau “terbagi”; “terbelah” mempertahankan gambaran yang lebih konkret.
lexical_decisions:
- source_word: וַיֵּט ... אֶת־יָדוֹ
  choice: mengulurkan tangannya
  rationale: Kata kerja נָטָה dengan objek ‘tangan’ menyatakan tindakan mengulurkan atau merentangkan tangan. ‘Mengulurkan tangannya’ alami dalam bahasa Indonesia dan mempertahankan gerak fisiknya.
- source_word: עַל־הַיָּם
  choice: ke atas laut
  rationale: Preposisi עַל dapat berarti ‘di atas’, ‘ke atas’, atau dalam konteks tertentu ‘ke arah’. ‘Ke atas laut’ sesuai dengan gerakan tangan dan tetap dekat dengan gambaran Ibrani.
- source_word: וַיּוֹלֶךְ יְהוָה אֶת־הַיָּם
  choice: Yahweh membuat laut itu surut
  rationale: Bentuk kausatif dari הָלַךְ secara harfiah menyatakan bahwa Yahweh membuat laut itu pergi atau bergerak. Dalam konteks ini, ‘membuat ... surut’ menyampaikan akibatnya dengan jelas tanpa menambahkan mekanisme lain.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama diri ‘Yahweh’, bukan diganti dengan gelar.
- source_word: בְּרוּחַ קָדִים עַזָּה
  choice: dengan angin timur yang kuat
  rationale: רוּחַ di sini berarti ‘angin’ karena diterangkan sebagai berasal dari timur dan menjadi sarana yang menggerakkan laut. עַזָּה diterjemahkan ‘kuat’ secara lugas.
- source_word: כָּל־הַלַּיְלָה
  choice: sepanjang malam
  rationale: Ungkapan ini menyatakan durasi penuh dan diterjemahkan secara alami dalam bahasa Indonesia.
- source_word: וַיָּשֶׂם אֶת־הַיָּם לֶחָרָבָה
  choice: menjadikan laut itu tanah kering
  rationale: Terjemahan ini mempertahankan ‘laut’ sebagai objek dan חָרָבָה sebagai ‘tanah kering’, sekaligus menghasilkan susunan Indonesia yang ringkas.
- source_word: וַיִּבָּקְעוּ הַמָּיִם
  choice: Airnya pun terbelah
  rationale: Bentuk Nifal dari בָּקַע menggambarkan air yang dibelah atau terbelah. ‘Terbelah’ mempertahankan gambaran konkret dan bentuk nonaktifnya; ‘pun’ menandai hasil dalam rangkaian narasi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai nama ilahi YHWH secara langsung. Bentuk ‘Yahweh’ mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Hubungan tindakan ilahi dengan angin timur
  choice: Yahweh membuat laut surut dengan angin timur yang kuat
  alternative: Yahweh membuat laut pergi oleh angin timur yang kuat
  rationale: Terjemahan mempertahankan Yahweh sebagai pelaku dan angin sebagai sarana, tanpa mengurangi tindakan ilahi menjadi proses alamiah semata atau meniadakan sarana yang disebut teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kalimat panjang Ibrani dibagi menjadi tiga kalimat agar mudah dipahami tanpa mengubah urutan tindakan. Semua unsur utama—tindakan Musa, tindakan Yahweh, angin timur sepanjang malam, tanah kering, dan air yang terbelah—dipertahankan.
