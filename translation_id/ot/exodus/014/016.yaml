  text: וְ/אַתָּ֞ה הָרֵ֣ם אֶֽת מַטְּ/ךָ֗ וּ/נְטֵ֧ה אֶת יָדְ/ךָ֛ עַל הַ/יָּ֖ם וּ/בְקָעֵ֑/הוּ וְ/יָבֹ֧אוּ בְנֵֽי יִשְׂרָאֵ֛ל בְּ/ת֥וֹךְ הַ/יָּ֖ם בַּ/יַּבָּשָֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/016.yaml
  text: But as for you[a], lift up your staff and stretch out your hand over the sea and split it, so that the sons of Israel may go through the midst of the sea on dry ground.
translation:
  language: id
  text: Tetapi engkau, angkatlah tongkatmu dan ulurkan tanganmu di atas laut, lalu belahlah laut itu, supaya bani Israel[a] dapat berjalan melalui tengah-tengah laut di atas tanah kering.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Israel”; ungkapan ini menunjuk kepada umat Israel.
    reason: Menjelaskan bentuk maskulin-genealogis bahasa Ibrani dan cakupan kolektifnya.
lexical_decisions:
- source_word: וְאַתָּה
  choice: Tetapi engkau
  rationale: Konjungsi yang disertai pronomina mandiri menonjolkan Musa secara kontras dengan perintah sebelumnya kepada umat; bentuk ini mempertahankan penekanan itu secara alami.
- source_word: הָרֵם אֶת מַטְּךָ
  choice: angkatlah tongkatmu
  rationale: Imperatif kausatif הָרֵם menyatakan tindakan mengangkat, sedangkan מַטֶּה dalam kisah Musa paling wajar diterjemahkan 'tongkat'.
- source_word: וּנְטֵה אֶת יָדְךָ עַל הַיָּם
  choice: dan ulurkan tanganmu ke atas laut
  rationale: '''Ulurkan tanganmu'' merupakan padanan Indonesia yang alami untuk נטה dengan objek ''tangan''; ''ke atas laut'' mempertahankan hubungan arah/posisi yang dapat dinyatakan oleh עַל.'
- source_word: וּבְקָעֵהוּ
  choice: lalu belahlah laut itu
  rationale: בקע berarti membelah atau merekah. Objek pronominal dijelaskan sebagai 'laut itu' agar rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: וְיָבֹאוּ
  choice: supaya ... dapat berjalan
  rationale: Dalam rangkaian perintah ini, bentuk tersebut menyatakan hasil atau tujuan yang diharapkan dari tindakan Musa. 'Berjalan' sesuai dengan gerak umat melintasi dasar laut dalam konteks.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: '''Bani Israel'' adalah ungkapan Indonesia yang mapan, ringkas, dan mempertahankan bentuk genealogis harfiah ''anak-anak lelaki/keturunan Israel'' tanpa memberi kesan bahwa rombongan itu hanya terdiri atas laki-laki.'
- source_word: בְּתוֹךְ הַיָּם
  choice: melalui tengah-tengah laut
  rationale: Terjemahan ini mempertahankan gambaran spasial 'di bagian tengah laut' sekaligus menyampaikan gerak melintasinya secara alami.
- source_word: בַּיַּבָּשָׁה
  choice: di tanah yang kering
  rationale: Frasa ini menampilkan kontras konkret antara laut dan permukaan kering yang dilalui umat.
theological_decisions:
- issue: Cakupan בְנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: anak-anak lelaki Israel; orang Israel
  rationale: Bentuk Ibrani secara harfiah adalah 'anak-anak lelaki Israel', tetapi dalam konteks ini menunjuk kepada umat Israel secara keseluruhan. 'Bani Israel' menjaga bentuk asal yang genealogis tanpa secara keliru membatasi referennya pada kaum laki-laki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Imperatif berakhiran -lah menjaga ketegasan perintah. Pengulangan 'laut itu' dipakai untuk memperjelas objek pronominal Ibrani, sedangkan 'melalui tengah-tengah laut' menjaga citra sumber dengan susunan yang tetap alami.
