source:
  edition: WLC
  text: וּ/פַרְעֹ֖ה הִקְרִ֑יב וַ/יִּשְׂאוּ֩ בְנֵֽי יִשְׂרָאֵ֨ל אֶת עֵינֵי/הֶ֜ם וְ/הִנֵּ֥ה מִצְרַ֣יִם נֹסֵ֣עַ אַחֲרֵי/הֶ֗ם וַ/יִּֽירְאוּ֙ מְאֹ֔ד וַ/יִּצְעֲק֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶל יְהוָֽה־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/010.yaml
  text: As Pharaoh drew near[a], the sons of Israel lifted up their eyes, and behold, the Egyptians were marching after them; and they were very afraid[b], and the sons of Israel cried out to Yahweh.
translation:
  language: id
  text: Ketika Firaun mendekat, orang Israel mengangkat mata mereka, dan tampaklah orang-orang Mesir sedang bergerak menyusul mereka. Mereka sangat ketakutan, lalu orang Israel berseru kepada Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִקְרִיב
  choice: mendekat
  rationale: Bentuk Hifil di sini berfungsi dengan makna intransitif, dengan Firaun sebagai subjek; 'mendekat' alami dan mempertahankan ketegangan narasi.
- source_word: וַיִּשְׂאוּ ... אֶת עֵינֵיהֶם
  choice: melayangkan pandangan
  rationale: Ungkapan ini menyampaikan idiom Ibrani 'mengangkat mata' sebagai tindakan memandang ke arah tertentu dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: וְהִנֵּה
  choice: tampaklah
  rationale: Partikel ini menandai apa yang tiba-tiba terlihat dan memberi kesan dramatis tanpa memakai bentuk arkais yang kurang alami.
- source_word: מִצְרַיִם
  choice: orang Mesir
  rationale: Nama kolektif 'Mesir' di sini merujuk pada pasukan atau orang Mesir yang sedang bergerak; bentuk ini menghindari kesan bahwa negerinya sendiri yang bergerak.
- source_word: נֹסֵעַ אַחֲרֵיהֶם
  choice: bergerak menyusul mereka
  rationale: נסע pada dasarnya menyatakan bergerak atau berangkat. Dalam konteks pengejaran militer, 'bergerak menyusul' mempertahankan makna gerak tanpa mempersempitnya menjadi kata khusus 'mengejar'.
- source_word: וַיִּירְאוּ מְאֹד
  choice: sangat ketakutan
  rationale: Pilihan ini menyampaikan kuatnya rasa takut secara alami dalam bahasa Indonesia modern.
- source_word: וַיִּצְעֲקוּ
  choice: berseru
  rationale: Kata ini menyatakan seruan mendesak dalam kesesakan dan sesuai dengan seruan yang diarahkan kepada Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Frasa harfiah 'anak-anak lelaki Israel' merupakan sebutan kolektif bagi bangsa Israel. 'Orang Israel' jelas, alami, dan mencakup kelompok yang dimaksud tanpa menambahkan pembatasan jenis kelamin yang tidak dituntut konteks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama ilahi; 'Yahweh' mempertahankan fungsi nama tersebut dan tidak menggantinya dengan gelar.
- issue: Cakupan kolektif בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak lelaki Israel
  rationale: Dalam konteks ini frasa maskulin tersebut adalah sebutan nasional yang mencakup umat Israel secara kolektif. Terjemahan harfiah dapat menyesatkan pembaca Indonesia seolah-olah hanya laki-laki yang dimaksud.
- issue: Rujukan kolektif מִצְרַיִם
  choice: orang Mesir
  alternative: Mesir
  rationale: Bentuk Ibrani secara harfiah adalah nama 'Mesir', tetapi secara metonimis menunjuk pada kekuatan Mesir yang menyusul Israel. Terjemahan kolektif membuat rujukannya jelas tanpa menentukan secara sempit apakah seluruh pasukan atau detasemen tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Alur tindakan Ibrani dipertahankan, sementara idiom yang akan terasa kaku dialihkan secara alami. Tidak diperlukan catatan kaki karena alternatif penting dapat dipertanggungjawabkan langsung dalam terjemahan tanpa menghilangkan ambiguitas substantif.
