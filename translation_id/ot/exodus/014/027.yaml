base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/027.yaml
  text: So Moses stretched out his hand over the sea[a], and toward morning the sea returned to its usual place, while the Egyptians were fleeing toward it[b]. And Yahweh threw the Egyptians into the midst of the sea.
translation:
  language: id
  text: Lalu Musa mengulurkan tangannya ke atas laut. Menjelang pagi, laut itu kembali seperti sediakala[a]. Ketika orang-orang Mesir sedang melarikan diri ke arahnya, Yahweh menghempaskan[b] mereka ke tengah-tengah laut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kembali kepada kekuatannya yang tetap,” “kembali dengan kekuatan penuh,” atau “kembali ke keadaan semula.” Ungkapan Ibrani menunjukkan bahwa laut kembali kepada kondisi normalnya yang mantap.
    reason: lexical_alternative
  - marker: b
    text: Kata kerja Ibrani ini secara harfiah berarti “mengguncang keluar” atau “mengibaskan,” sebuah gambaran hidup tentang Yahweh yang menghempaskan orang Mesir ke dalam laut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט ... אֶת־יָדוֹ עַל־הַיָּם
  choice: mengulurkan tangannya ke atas laut
  rationale: נטה dengan objek 'tangan' menyatakan tindakan mengulurkan atau merentangkan tangan; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan tindakan fisiknya.
- source_word: וַיָּשָׁב הַיָּם
  choice: laut itu kembali
  rationale: שׁוב menunjukkan kembalinya laut kepada kondisi sebelumnya setelah air terbelah.
- source_word: לִפְנוֹת בֹּקֶר
  choice: menjelang pagi
  rationale: Ungkapan Ibrani ini menunjuk pada beralihnya waktu menuju pagi; 'menjelang pagi' ringkas dan wajar dalam bahasa Indonesia.
- source_word: לְאֵיתָנוֹ
  choice: seperti sediakala
  rationale: אֵיתָן dapat menunjuk pada kekuatan, kemantapan, atau kondisi tetap laut. 'Seperti sediakala' menyampaikan pemulihan keadaan normal tanpa menentukan secara sempit apakah yang ditekankan ialah tempat, arus, atau kekuatannya.
- source_word: נָסִים לִקְרָאתוֹ
  choice: sedang melarikan diri ke arahnya
  rationale: Partisip נָסִים menyatakan tindakan yang sedang berlangsung, sedangkan לִקְרָאתוֹ secara harfiah berarti bergerak menuju atau menyongsongnya. Terjemahan ini mempertahankan arah yang tampak paradoksal dalam teks.
- source_word: וַיְנַעֵר
  choice: menghempaskan
  rationale: נער secara harfiah menggambarkan tindakan mengguncang atau mengibaskan keluar. Dalam konteks ini, 'menghempaskan' mempertahankan daya dan gerak gambaran tersebut dengan bahasa Indonesia yang alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בְּתוֹךְ הַיָּם
  choice: ke tengah-tengah laut
  rationale: תּוֹךְ menunjuk bagian tengah atau bagian dalam; dengan verba yang menyiratkan gerak kuat, 'ke tengah-tengah laut' menyampaikan lokasi sekaligus arah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi secara langsung. Bentuk 'Yahweh' mempertahankan nama itu dan membedakannya dari gelar.
- issue: Arah pelarian orang Mesir
  choice: melarikan diri ke arahnya
  alternative: melarikan diri darinya
  rationale: לִקְרָאתוֹ secara leksikal berarti 'ke arah/untuk menyongsongnya'. Walaupun konteks dapat mendorong pembaca untuk membayangkan pelarian dari laut, terjemahan tidak membalik arah yang dinyatakan teks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Seperti sediakala' dipilih karena alami bagi pembaca umum sekaligus tidak menutup keluasan makna אֵיתָן. Penanda catatan kaki ditempatkan langsung pada frasa yang diterangkannya.
