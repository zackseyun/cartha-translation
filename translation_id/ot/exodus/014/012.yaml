base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/012.yaml
  text: Is this not the word that we spoke to you in Egypt, saying, ‘Leave us alone so that we may serve the Egyptians’? For it would have been better for us to serve the Egyptians than to die in the wilderness.
translation:
  language: id
  text: 'Bukankah inilah yang kami katakan kepadamu di Mesir: ‘Biarkan kami, supaya kami dapat melayani orang Mesir’? Sebab lebih baik bagi kami melayani orang Mesir daripada mati di padang belantara.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַדָּבָר
  choice: ini
  rationale: Dalam ungkapan ‘Bukankah ini yang ...’, bahasa Indonesia secara alami menyampaikan makna ‘hal/perkataan ini’ tanpa perlu menerjemahkan nomina itu secara kaku.
- source_word: חֲדַל מִמֶּנּוּ
  choice: Biarkan kami
  rationale: Idiom Ibrani ini berarti berhenti mencampuri atau membiarkan seseorang; ‘Biarkan kami’ alami dan mempertahankan nada penolakan.
- source_word: וְנַעַבְדָה אֶת־מִצְרָיִם
  choice: supaya kami dapat bekerja bagi orang Mesir
  rationale: Bentuk kohortatif dalam konteks ini menyatakan tujuan yang diinginkan. ‘Bekerja bagi’ mempertahankan arti pelayanan atau kerja paksa tanpa menambahkan istilah teologis yang tidak dituntut konteks.
- source_word: טוֹב לָנוּ עֲבֹד ... מִמֻּתֵנוּ
  choice: lebih baik bagi kami bekerja ... daripada mati
  rationale: Konstruksi perbandingan Ibrani diterjemahkan langsung dan wajar dalam bahasa Indonesia.
- source_word: בַּמִּדְבָּר
  choice: di padang belantara
  rationale: Menggambarkan kawasan liar dan tandus, bukan semata-mata gurun pasir.
theological_decisions:
- issue: Nuansa waktu pada pernyataan ‘lebih baik’
  choice: lebih baik bagi kami
  alternative: seharusnya lebih baik bagi kami / akan lebih baik bagi kami
  rationale: Teks Ibrani memakai klausa nominal tanpa penandaan waktu eksplisit. Terjemahan ini mempertahankan ketegasan perbandingan dan tidak memaksakan nuansa kontrafaktual yang hanya tersirat oleh konteks.
- issue: Makna עבד dalam kaitannya dengan Mesir
  choice: bekerja bagi orang Mesir
  alternative: melayani orang Mesir / menjadi budak orang Mesir
  rationale: Kata itu dapat berarti bekerja atau melayani, termasuk sebagai budak. ‘Bekerja bagi’ menjaga keluasan makna dan tidak mempersempitnya menjadi status legal tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur retoris pertanyaan dipertahankan, sedangkan susunan kalimat disesuaikan agar alami bagi pembaca umum.
