base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/022.yaml
  text: And the sons of Israel went into the midst of the sea on the dry ground[a], and the waters were a wall to them on their right and on their left.
translation:
  language: id
  text: Orang Israel[a] masuk ke tengah laut di tanah yang kering, dan air itu merupakan tembok bagi mereka di sebelah kanan dan kiri mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “putra-putra Israel”; maksudnya, orang Israel.'
    reason: Menjelaskan bentuk maskulin kolektif dalam bahasa Ibrani sambil mempertahankan ungkapan Indonesia yang alami dalam teks utama.
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: masuk
  rationale: Dalam konteks ini, בוא menyatakan gerakan memasuki suatu tempat. “Masuk” alami dalam narasi Indonesia dan mempertahankan arah gerak ke tengah laut.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Orang Israel
  rationale: Ungkapan ini secara harfiah berarti “anak-anak lelaki Israel,” tetapi secara kolektif menunjuk kepada bangsa Israel. “Orang Israel” merupakan padanan Indonesia modern yang jelas dan wajar; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: בְּתוֹךְ הַיָּם
  choice: ke tengah laut
  rationale: בְּתוֹךְ berarti “di tengah/di bagian dalam.” Karena verba menyatakan gerakan masuk, “ke tengah laut” menyampaikan makna arah dan lokasi dengan alami.
- source_word: בַּיַּבָּשָׁה
  choice: di atas tanah yang kering
  rationale: Nomina ini menunjuk pada tanah kering yang berlawanan dengan air. Frasa ini menampilkan dasar laut yang kering sebagai tempat mereka berjalan.
- source_word: וְהַמַּיִם
  choice: dan air itu
  rationale: Bahasa Ibrani memakai bentuk gramatikal jamak, tetapi “air” sebagai nomina massa adalah bentuk alami dalam bahasa Indonesia. Demonstratif “itu” mewakili kejelasan nomina Ibrani.
- source_word: חֹמָה
  choice: menjadi tembok
  rationale: חֹמָה berarti “tembok,” tanpa penanda perbandingan seperti “bagaikan.” Kata “menjadi” membentuk predikasi nominal yang alami dalam bahasa Indonesia tanpa melemahkan gambaran konkret teks.
- source_word: מִימִינָם וּמִשְּׂמֹאלָם
  choice: di sebelah kanan dan di sebelah kiri mereka
  rationale: Padanan ini mempertahankan kesejajaran spasial kedua frasa Ibrani dan menyatakan bahwa air berada pada kedua sisi orang Israel.
theological_decisions:
- issue: Sifat gambaran air sebagai tembok
  choice: tembok
  alternative: seperti/bagaikan tembok
  rationale: Teks Ibrani memakai predikat nominal langsung dan tidak memiliki penanda perbandingan. Karena itu, terjemahan mempertahankan pernyataan tegas tersebut tanpa mengubahnya menjadi simile.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan klausa mengikuti alur narasi Ibrani, sedangkan bentuk-bentuk yang kurang alami dalam bahasa Indonesia disesuaikan tanpa mengurangi gambaran konkret atau ketegasan teks.
