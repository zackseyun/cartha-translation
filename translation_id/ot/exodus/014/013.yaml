base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/013.yaml
  text: And Moses said to the people, “Do not fear. Stand firm, and see the salvation of the LORD, which he will accomplish for you today; for the Egyptians whom you see today, you will never see again forever.”
translation:
  language: id
  text: Musa berkata kepada bangsa itu, “Jangan takut. Berdirilah teguh dan lihatlah keselamatan dari TUHAN, yang akan Dia kerjakan bagimu hari ini. Sebab, orang-orang Mesir yang kamu lihat hari ini tidak akan pernah kamu lihat lagi untuk selama-lamanya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תִּירָאוּ
  choice: Jangan takut
  rationale: Menyampaikan larangan Ibrani secara langsung dan alami dalam bahasa Indonesia.
- source_word: הִתְיַצְבוּ
  choice: Berdirilah teguh
  rationale: Bentuk hitpael imperatif ini menyuruh bangsa itu mengambil posisi dan tetap teguh; pilihan ini mempertahankan unsur sikap fisik sekaligus keteguhan.
- source_word: יְשׁוּעַת יְהוָה
  choice: keselamatan dari TUHAN
  rationale: Konstruksi ini menunjuk pada tindakan pembebasan yang berasal dari TUHAN; 'keselamatan' mempertahankan istilah teologis sekaligus makna penyelamatan konkret dalam konteks.
- source_word: יַעֲשֶׂה לָכֶם
  choice: akan Dia kerjakan bagimu
  rationale: Menjaga verba umum 'melakukan/mengerjakan' dan menyatakan tindakan ilahi demi kepentingan bangsa itu.
- source_word: מִצְרַיִם
  choice: orang-orang Mesir
  rationale: Dalam konteks ini nama kolektif Mesir merujuk kepada pasukan/orang Mesir yang sedang dilihat bangsa Israel.
- source_word: לֹא תֹסִיפוּ לִרְאֹתָם עוֹד עַד עוֹלָם
  choice: tidak akan pernah kamu lihat lagi untuk selama-lamanya
  rationale: Mempertahankan penegasan ganda dan ungkapan durasi Ibrani, tanpa menghapus 'untuk selama-lamanya' dari teks.
theological_decisions:
- issue: Nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH / Yahweh
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia yang mapan dengan huruf kapital untuk menandai Tetragramaton, tanpa memasukkan rekonstruksi pelafalan ke dalam teks utama.
- issue: Makna יְשׁוּעָה dalam konteks penyeberangan laut
  choice: keselamatan
  alternative: pembebasan / pertolongan
  rationale: '''Keselamatan'' menjaga keluasan istilah sumber dan muatan teologisnya, sementara konteks menjelaskan bahwa keselamatan itu berupa pembebasan nyata dari orang Mesir.'
- issue: Subjek tindakan penyelamatan
  choice: yang akan Dia kerjakan bagimu
  alternative: yang akan dikerjakan TUHAN bagimu
  rationale: Pronomina mempertahankan struktur sumber, dengan anteseden TUHAN yang jelas, dan tidak menambahkan penafsiran.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk jamak Ibrani dialihkan dengan 'kamu' sebagai sapaan kolektif yang alami. Tanda baca dibagi menjadi tiga kalimat agar mudah dibaca tanpa mengubah alur argumentasi ayat.
