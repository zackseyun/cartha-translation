  to: Dan Aku—sesungguhnya, Aku sedang mengeraskan hati orang Mesir sehingga mereka akan masuk ke laut mengikuti orang Israel. Aku akan memperoleh kemuliaan atas Firaun, seluruh pasukannya, kereta-keretanya, dan pasukan berkudanya.
  rationale: Revisi memperbaiki hubungan gerak “masuk mengikuti” agar tidak menambahkan gagasan bahwa orang Mesir berhasil menyusul Israel, dan memakai “memperoleh kemuliaan” untuk mempertahankan fokus teks pada kemuliaan yang Allah peroleh atas Firaun dan tentaranya. Tidak diperlukan catatan kaki, karena bentuk kolektif “hati orang Mesir” dapat diterjemahkan langsung dan konteks menjelaskan acuan “orang Israel.”
