base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/017.yaml
  text: And I—behold[a], I am hardening the hearts of the Egyptians so that they will go in after them, and I will get glory over Pharaoh and over all his army[b], over his chariots and over his horsemen.
translation:
  language: id
  text: Dan Aku—sesungguhnya, Aku sedang mengeraskan hati orang Mesir sehingga mereka akan masuk ke laut mengikuti orang Israel. Aku akan memperoleh kemuliaan atas Firaun, seluruh pasukannya, kereta-keretanya, dan pasukan berkudanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: sesungguhnya, Aku
  rationale: Partikel dengan akhiran orang pertama tunggal memberi penegasan kuat pada tindakan Allah; “sesungguhnya, Aku” menyampaikannya secara wajar dan bermartabat dalam bahasa Indonesia.
- source_word: מְחַזֵּק אֶת לֵב מִצְרַיִם
  choice: akan mengeraskan hati orang Mesir
  rationale: Bentuk Piel partisipial menyatakan tindakan ilahi yang segera berlangsung. “Mengeraskan hati” mempertahankan ungkapan naratif Keluaran dan bentuk kolektif tunggal לֵב secara alami.
- source_word: וְיָבֹאוּ אַחֲרֵיהֶם
  choice: sehingga mereka masuk menyusul orang Israel
  rationale: Dalam konteks penyeberangan laut, בוא menunjuk pada masuknya orang Mesir ke laut. “Sehingga” menyatakan hubungan hasil/tujuan, sedangkan acuan pronomina diperjelas sebagai orang Israel agar tidak rancu.
- source_word: וְאִכָּבְדָה
  choice: Aku akan menyatakan kemuliaan-Ku
  rationale: Bentuk Niphal dari כבד di sini menyatakan bahwa kemuliaan atau kehormatan YHWH akan tampak melalui penghukuman. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan daya peristiwanya.
- source_word: בְּפַרְעֹה
  choice: atas Firaun
  rationale: Preposisi ב dalam konstruksi ini menggambarkan Firaun sebagai pihak yang atasnya kemuliaan Allah dinyatakan melalui kemenangan dan penghakiman.
- source_word: חֵילוֹ
  choice: seluruh pasukannya
  rationale: חיל dalam konteks militer berarti angkatan atau pasukan; “pasukan” merupakan padanan modern yang jelas.
- source_word: רִכְבּוֹ
  choice: kereta-keretanya
  rationale: Nomina tunggal kolektif ini menunjuk pada keseluruhan kereta perang Firaun; bentuk jamak Indonesia menyampaikan maknanya secara alami.
- source_word: פָרָשָׁיו
  choice: pasukan berkudanya
  rationale: Istilah ini menunjuk pada para penunggang atau tentara berkuda. “Pasukan berkuda” jelas dan sesuai dengan konteks militer.
theological_decisions:
- issue: Tindakan Allah dalam pengerasan hati orang Mesir
  choice: Secara eksplisit menerjemahkan tindakan langsung Allah sebagai “Aku akan mengeraskan hati”.
  alternative: Aku akan membiarkan hati mereka menjadi keras.
  rationale: Teks Ibrani secara langsung menempatkan Allah sebagai pelaku. Ketegangan antara kedaulatan ilahi dan tanggung jawab manusia dipertahankan, bukan dilunakkan menjadi izin pasif.
- issue: Makna כבד dalam konteks penghakiman
  choice: Aku akan menyatakan kemuliaan-Ku atas Firaun.
  alternative: Aku akan dimuliakan melalui Firaun.
  rationale: Keduanya mungkin secara leksikal. Pilihan utama menyampaikan bahwa kemuliaan Allah menjadi nyata melalui kemenangan dan penghakiman atas Firaun, tanpa menjadikan Firaun pelaku yang memuliakan Allah secara sukarela.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Pronomina ilahi memakai huruf kapital sesuai kebiasaan umum penerbitan Alkitab Indonesia. Bentuk kolektif “hati orang Mesir” dipertahankan secara alami; rujukan “mereka” diperjelas dengan “orang Israel” untuk mencegah ambiguitas yang tidak terdapat dalam konteks Ibrani.
