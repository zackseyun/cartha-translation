  text: דַּבֵּר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ וְ/יָשֻׁ֗בוּ וְ/יַחֲנוּ֙ לִ/פְנֵי֙ פִּ֣י הַחִירֹ֔ת בֵּ֥ין מִגְדֹּ֖ל וּ/בֵ֣ין הַ/יָּ֑ם לִ/פְנֵי֙ בַּ֣עַל צְפֹ֔ן נִכְח֥/וֹ תַחֲנ֖וּ עַל הַ/יָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/002.yaml
  text: Speak to the sons of Israel[a], that they turn back and camp before Pi-hahiroth, between Migdol and the sea. Before Baal-zephon, opposite it[c][b], you shall camp by the sea.
translation:
  language: id
  text: Katakanlah kepada orang Israel[a], “Berbaliklah dan berkemahlah di depan Pi-Hahirot, di antara Migdol dan laut. Di depan Baal-Zefon, tepat berhadapan dengannya[c], berkemahlah di tepi laut.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anak-anak Israel.” Ungkapan Ibrani ini merupakan sebutan kolektif bagi orang Israel.
    reason: lexical_alternative
  - marker: b
    text: Pi-Hahirot, Migdol, dan Baal-Zefon adalah nama tempat sehingga ditransliterasikan, bukan diterjemahkan.
    reason: cultural_note
  - marker: c
    text: Atau “menghadapnya.” Akhiran “-nya” kemungkinan besar merujuk kepada Baal-Zefon.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל
  choice: Katakanlah kepada orang Israel
  rationale: Imperatif Piel דַּבֵּר menyampaikan perintah langsung kepada Musa. Ungkapan בְּנֵי יִשְׂרָאֵל secara harfiah berarti 'anak-anak lelaki Israel', tetapi 'orang Israel' merupakan padanan Indonesia modern yang alami dan mencakup umat Israel secara kolektif; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וְיָשֻׁבוּ וְיַחֲנוּ
  choice: supaya mereka berbalik dan berkemah
  rationale: Kedua bentuk sesudah imperatif menyatakan tindakan yang harus dilakukan Israel. 'Berbalik' mempertahankan gagasan perubahan arah, sedangkan 'berkemah' adalah padanan alami bagi חנה.
- source_word: לִפְנֵי פִּי הַחִירֹת
  choice: di depan Pi-Hahirot
  rationale: לִפְנֵי bersifat lokatif, dan Pi-Hahirot dipertahankan sebagai nama tempat, bukan diterjemahkan berdasarkan kemungkinan etimologinya.
- source_word: בֵּין מִגְדֹּל וּבֵין הַיָּם
  choice: di antara Migdol dan laut
  rationale: Konstruksi בֵּין...וּבֵין menandai dua batas lokasi. הַיָּם di sini diterjemahkan secara biasa sebagai 'laut' tanpa menetapkan identifikasi geografis yang tidak dinyatakan ayat.
- source_word: לִפְנֵי בַּעַל צְפֹן
  choice: di depan Baal-Zefon
  rationale: Frasa lokatif diterjemahkan konsisten dengan לִפְנֵי sebelumnya, sementara Baal-Zefon ditransliterasikan sebagai nama tempat.
- source_word: נִכְחוֹ
  choice: berhadapan dengannya
  rationale: Kata ini menunjukkan posisi tepat di seberang atau menghadap suatu acuan. Akhiran pronominal maskulin tunggal dibiarkan cukup terbuka melalui '-nya', dengan rujukan yang paling mungkin dijelaskan dalam catatan kaki.
- source_word: תַחֲנוּ עַל־הַיָּם
  choice: kamu harus berkemah di tepi laut
  rationale: Imperfek orang kedua jamak berfungsi sebagai instruksi langsung. 'Harus' menyampaikan daya perintah, dan עַל dalam konteks lokasi di pantai paling alami diterjemahkan 'di tepi'.
