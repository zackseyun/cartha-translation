translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk ''orang Israel'' dipilih agar alami dan tidak menimbulkan kesan bahwa hanya anak-anak atau laki-laki yang dimaksud. Ejaan nama Ibrani disesuaikan dengan kebiasaan fonologis Indonesia: Pi-Hahirot dan Baal-Zefon.'
