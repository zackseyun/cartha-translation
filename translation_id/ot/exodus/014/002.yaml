revisions:
- from: Katakanlah kepada orang Israel[a] supaya mereka berbalik dan berkemah di depan Pi-Hahirot, di antara Migdol dan laut. Di depan Baal-Zefon, berhadapan dengannya[c], kamu harus berkemah di tepi laut.[b]
  to: Katakanlah kepada orang Israel[a], “Berbaliklah dan berkemahlah di depan Pi-Hahirot, di antara Migdol dan laut. Di depan Baal-Zefon, tepat berhadapan dengannya[c], berkemahlah di tepi laut.”[b]
  rationale: Ujaran langsung menjadikan kedua bentuk perintah jamak kepada Israel jelas dan alami dalam bahasa Indonesia, tanpa mengubah makna. “Tepat” mencerminkan nuansa posisi dalam נִכְחוֹ. Catatan a disesuaikan agar menjelaskan idiom kolektif Ibrani tanpa memberi kesan pembatasan gender atau usia.
