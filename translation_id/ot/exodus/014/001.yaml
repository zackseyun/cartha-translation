  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: id
  text: 'Kemudian Yahweh berfirman kepada Musa:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kemudian ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan rangkaian cerita; “kemudian” menyatakan urutan naratif, sedangkan “berfirman” merupakan padanan Indonesia yang wajar dan bermartabat untuk tindakan Allah berbicara.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama diri “Yahweh”, sesuai bukti teks Ibrani dan tanpa menggantinya dengan gelar.
- source_word: אֶל מֹשֶׁה
  choice: kepada Musa
  rationale: Preposisi אֶל menandai pihak yang dituju dalam ujaran; “kepada Musa” adalah ungkapan Indonesia yang alami.
- source_word: לֵאמֹר
  choice: demikian
  rationale: Infinitif לֵאמֹר merupakan formula pengantar bagi isi firman berikutnya. “Demikian” mempertahankan fungsi pengantar itu secara ringkas dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama tersebut, sementara “TUHAN” mengubahnya menjadi gelar dan “Yehova” mencerminkan bentuk pelafalan yang muncul belakangan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan dibuat alami, tetapi formula pembuka bagi firman pada ayat berikutnya tetap dipertahankan.
