  source_fidelity: Draf dengan tepat mengenali TUHAN sebagai subjek tersirat dan seruan kolektif pasukan Mesir. Namun, klausa kedua mengubah subjek kata kerja Ibrani dari subjek tunggal yang sama menjadi “mereka” dan menambahkan hubungan hasil melalui “sehingga”. Teks Ibrani mempertahankan bentuk tunggal pada verba dan objeknya; terjemahan perlu mempertahankan tindakan ilahi yang tersirat sambil mencatat kesulitan rujukannya.
  naturalness: Bahasa draf umumnya modern dan jelas. “Mereka mengendarainya” kurang alami karena antecedent “roda-roda” secara gramatikal lebih dekat, padahal yang dimaksud ialah kereta. Susunan revisi lebih jelas tanpa memperluas makna.
  terminology: “TUHAN”, “kereta”, “orang Mesir”, dan “berperang bagi mereka melawan Mesir” sesuai register Alkitab Indonesia modern serta mempertahankan istilah dan gambaran sumber.
