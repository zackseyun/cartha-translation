base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/025.yaml
  text: And he removed the wheels from his chariots, and drove them with difficulty. And Egypt said, “Let me flee from before Israel, for the LORD is fighting for them against Egypt.”
translation:
  language: id
  text: Ia menanggalkan roda dari kereta-kereta mereka[a], lalu mengemudikannya dengan susah payah. Lalu orang Mesir berkata, “Mari kita melarikan diri dari hadapan Israel, sebab TUHAN berperang bagi mereka melawan Mesir.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, teks Ibrani memakai bentuk tunggal: “roda kereta-keretanya” dan “mengemudikannya.” Bentuk-bentuk tunggal ini dapat dipakai secara kolektif; dalam konteksnya bentuk jamak “kereta-kereta mereka” menyatakan kereta pasukan Mesir.'
    reason: Menjelaskan bentuk tunggal dan kemungkinan nilai kolektifnya tanpa menentukan secara berlebihan rujukan pronominal yang diperselisihkan.
lexical_decisions:
- source_word: וַיָּסַר
  choice: Ia melepaskan
  rationale: Bentuk tunggal dapat dipahami dengan TUHAN sebagai subjek tersirat dari ayat sebelumnya; kata kerja ini berarti menyingkirkan atau melepaskan.
- source_word: אֹפַן מַרְכְּבֹתָיו
  choice: roda-roda kereta mereka
  rationale: אֹפַן berbentuk tunggal kolektif, sehingga wajar diterjemahkan jamak. Akhiran -יו secara bentuk dapat berarti 'miliknya' atau 'milik mereka'; konteks menunjuk pada kereta pasukan Mesir, sehingga 'mereka' paling alami, dengan ambiguitas dicatat.
- source_word: וַיְנַהֲגֵהוּ בִּכְבֵדֻת
  choice: sehingga mereka mengendarainya dengan susah payah
  rationale: Ungkapan בִּכְבֵדֻת menyatakan keadaan berat atau sulit. Akhiran objek tunggal pada kata kerja dapat merujuk secara kolektif kepada kereta atau pasukan berkendara.
- source_word: מִצְרַיִם
  choice: orang Mesir
  rationale: Nama kolektif 'Mesir' di sini berbicara sebagai pasukan/bangsa; bahasa Indonesia alami memakai 'orang Mesir'.
- source_word: אָנ֨וּסָה
  choice: Mari kita melarikan diri
  rationale: Bentuk kohortatif tunggal secara morfologis berarti 'biarlah aku melarikan diri', tetapi subjek kolektif מִצְרַיִם dan konteks pasukan mendukung idiom bahasa Indonesia jamak inklusif.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia untuk Tetragramaton dengan huruf kapital.
theological_decisions:
- issue: Subjek tunggal pada וַיָּסַר
  choice: TUHAN dipahami sebagai subjek tersirat dan diterjemahkan 'Ia'
  alternative: Subjek dapat dipahami sebagai tindakan ilahi tanpa menyatakan pronomina secara tegas
  rationale: Ayat sebelumnya secara eksplisit menyebut TUHAN sebagai pelaku yang mengacaukan pasukan Mesir.
- issue: Perkataan kolektif Mesir memakai kohortatif tunggal
  choice: Diterjemahkan secara kolektif, 'Mari kita melarikan diri'
  alternative: '''Biarlah aku melarikan diri'' atau ''Aku akan melarikan diri'''
  rationale: Teks mempertahankan personifikasi tunggal 'Mesir', tetapi maksud pragmatisnya adalah seruan pasukan Mesir untuk mundur; catatan kaki menjaga bentuk sumber.
- issue: TUHAN berperang bagi Israel
  choice: 'Dipertahankan secara langsung: ''TUHAN berperang bagi mereka melawan Mesir'''
  alternative: '''TUHAN memerangi Mesir untuk menolong mereka'''
  rationale: Susunan langsung mempertahankan gambaran teologis dan kesejajaran preposisional teks Ibrani tanpa memperluas makna.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Kereta' dipahami sebagai kereta perang dari konteks. Personifikasi 'Mesir' dinaturalkan menjadi 'orang Mesir', sementara bentuk tunggal sumber pada seruan melarikan diri dijelaskan dalam keputusan penerjemahan.
