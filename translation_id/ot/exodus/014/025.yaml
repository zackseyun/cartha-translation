    rationale: Verba Ibrani tetap berbentuk tunggal dan paling langsung meneruskan subjek tersirat dari klausa pertama. Bentuk objek tunggalnya juga sulit; terjemahan tidak seharusnya menetapkan pasukan Mesir sebagai subjek tanpa penandaan.
  - severity: low
