base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/023.yaml
  text: The Egyptians pursued and went in after them into the midst of the sea—all Pharaoh’s horses[a], his chariots[b], and his horsemen.
translation:
  language: id
  text: Orang Mesir mengejar mereka dan masuk ke tengah laut mengikuti mereka—yaitu semua kuda Firaun[a], kereta-keretanya, dan para penunggang kudanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, kata “kuda” berbentuk tunggal kolektif; maksudnya ialah semua kuda milik Firaun.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ
  choice: mengejar
  rationale: Kata רדף lazim berarti mengejar; pilihan ini jelas dan sesuai dengan konteks pengejaran militer.
- source_word: מִצְרַיִם
  choice: Orang Mesir
  rationale: Walaupun bentuk ini dapat menunjuk kepada negeri Mesir atau bangsanya, verba jamak dan konteks narasi menunjukkan orang atau pasukan Mesir.
- source_word: וַיָּבֹאוּ אַחֲרֵיהֶם
  choice: masuk menyusul mereka
  rationale: בוא menyatakan gerak masuk, sedangkan אַחֲרֵיהֶם menunjukkan bahwa mereka mengikuti orang Israel dalam pengejaran. Ungkapan ini mempertahankan kedua unsur tersebut secara alami.
- source_word: כֹּל סוּס פַּרְעֹה
  choice: semua kuda Firaun
  rationale: סוּס berbentuk tunggal kolektif setelah כֹּל; bahasa Indonesia secara alami memakai bentuk 'semua kuda'.
- source_word: רִכְבּוֹ
  choice: kereta-keretanya
  rationale: רכב di sini menunjuk kepada kereta perang atau pasukan kereta. Bentuk ulang menyampaikan makna kolektif konkret dalam daftar perlengkapan militer.
- source_word: וּפָרָשָׁיו
  choice: dan para penunggang kudanya
  rationale: פָרָשׁ menunjuk kepada penunggang kuda atau pasukan berkuda. Pilihan ini mempertahankan gambaran konkret dan mudah dipahami.
- source_word: אֶל תּוֹךְ הַיָּם
  choice: ke tengah laut
  rationale: תּוֹךְ menekankan bagian dalam atau tengah; frasa ini menyatakan bahwa mereka bergerak memasuki bagian dalam laut, bukan sekadar sampai di laut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Istilah 'Firaun' mengikuti bentuk baku. Susunan setelah tanda pisah mempertahankan penjelasan rinci mengenai seluruh pasukan yang masuk ke laut.
