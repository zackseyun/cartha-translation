id: EXO.14.26
reference: Exodus 14:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה נְטֵ֥ה אֶת יָדְ/ךָ֖ עַל הַ/יָּ֑ם וְ/יָשֻׁ֤בוּ הַ/מַּ֨יִם֙ עַל מִצְרַ֔יִם עַל רִכְבּ֖/וֹ וְ/עַל פָּרָשָֽׁי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/026.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand over the sea, so that the waters may return over the Egyptians, over their chariots, and over their horsemen.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa, “Ulurkanlah tanganmu ke atas laut supaya air kembali[a] meliputi orang Mesir, kereta-kereta mereka, dan pasukan berkuda mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan air akan kembali meliputi orang Mesir.” Verba Ibrani dapat diterjemahkan lebih harfiah sebagai bentuk futur sederhana, tetapi di sini kemungkinan menyatakan hasil yang dimaksudkan dari tindakan Musa.
    reason: Alternatif leksikal dan sintaksis untuk וְיָשֻׁבוּ.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan urutan kisah. “Lalu” menyatakan perkembangan narasi secara wajar, sedangkan “berfirman” merupakan padanan Indonesia yang lazim dan bermartabat ketika Allah menjadi subjek.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar “TUHAN”.
- source_word: נְטֵה אֶת־יָדְךָ
  choice: Ulurkanlah tanganmu
  rationale: Imperatif נְטֵה menyuruh Musa merentangkan atau mengulurkan tangannya. “Ulurkanlah” alami dalam bahasa Indonesia dan mempertahankan tindakan fisiknya.
- source_word: עַל־הַיָּם
  choice: ke atas laut
  rationale: Dalam konteks gerakan tangan, עַל menunjukkan arah atau posisi di atas laut. “Ke atas laut” terdengar alami sesudah “ulurkanlah” tanpa menghilangkan gambaran spasialnya.
- source_word: וְיָשֻׁבוּ
  choice: supaya ... kembali
  rationale: Bentuk verba sesudah perintah dapat menyatakan hasil yang dimaksudkan. “Supaya ... kembali” menyampaikan hubungan hasil tersebut, sementara kemungkinan futur sederhana dicatat dalam catatan kaki.
- source_word: הַמַּיִם
  choice: air
  rationale: Walaupun bentuk Ibraninya jamak, bahasa Indonesia secara alami memakai nomina massa tunggal “air” dalam konteks ini.
- source_word: עַל מִצְרַיִם
  choice: meliputi orang Mesir
  rationale: עַל menggambarkan air kembali ke atas orang Mesir. “Meliputi” mempertahankan gambaran air yang datang menutupi mereka tanpa menambahkan nuansa serangan yang tidak dinyatakan secara eksplisit.
- source_word: עַל רִכְבּוֹ
  choice: kereta-kereta mereka
  rationale: רֶכֶב di sini menunjuk pada kereta perang secara kolektif. Sufiks tunggal merujuk secara kolektif kepada Mesir/orang Mesir, sehingga kepemilikan jamak “mereka” paling wajar dalam bahasa Indonesia.
- source_word: וְעַל פָּרָשָׁיו
  choice: dan pasukan berkuda mereka
  rationale: פָּרָשָׁיו menunjuk kepada para penunggang kuda atau pasukan berkuda. Padanan ini jelas dalam konteks militer dan mempertahankan rujukan kolektif sufiksnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri Allah. “Yahweh” mempertahankan nama perjanjian itu secara langsung dan tidak menggantinya dengan sebuah gelar.
- issue: Hubungan antara perintah Musa dan kembalinya air
  choice: supaya air kembali
  alternative: dan air akan kembali
  rationale: Verba prefiks yang mengikuti imperatif dapat dipahami sebagai hasil yang dimaksudkan dari tindakan Musa. Terjemahan utama menyatakan nuansa resultatif ini, tetapi bentuk Ibraninya juga memungkinkan pembacaan sebagai futur sederhana; karena itu alternatif tersebut dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang bermartabat dan mudah dipahami. Bentuk “air” dipilih daripada “air-air,” dan sufiks kolektif tunggal Ibrani diungkapkan sebagai “mereka” agar alami dalam bahasa Indonesia.
