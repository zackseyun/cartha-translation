  text: וְ/חִזַּקְתִּ֣י אֶת לֵב פַּרְעֹה֮ וְ/רָדַ֣ף אַחֲרֵי/הֶם֒ וְ/אִכָּבְדָ֤ה בְּ/פַרְעֹה֙ וּ/בְ/כָל חֵיל֔/וֹ וְ/יָדְע֥וּ מִצְרַ֖יִם כִּֽי אֲנִ֣י יְהוָ֑ה וַ/יַּֽעֲשׂוּ כֵֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/004.yaml
  text: And I will harden Pharaoh’s heart[a], and he will pursue them; and I will get glory over Pharaoh and over all his army[b], and the Egyptians will know that I am Yahweh.” And they did so.
translation:
  language: id
  text: “Aku akan mengeraskan hati Firaun[a], dan ia akan mengejar mereka. Aku akan memperoleh kemuliaan atas Firaun dan seluruh pasukannya[b], dan orang Mesir akan mengetahui bahwa Akulah Yahweh.” Mereka melakukan demikian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “meneguhkan hati Firaun.” Verba Ibrani ini dapat berarti “membuat kuat atau teguh”; dalam kisah Keluaran, keteguhan itu tampak sebagai kedegilan, sehingga diterjemahkan “mengeraskan”.
    reason: lexical_alternative
  - marker: b
    text: Atau, “Aku akan dimuliakan melalui Firaun dan seluruh pasukannya.” Ungkapan Ibrani menyatakan bahwa Yahweh memperoleh kehormatan atau kemuliaan dalam kaitannya dengan Firaun melalui peristiwa yang akan terjadi.
    reason: alternative_reading
lexical_decisions:
- source_word: וְחִזַּקְתִּי
  choice: Aku akan mengeraskan
  rationale: Bentuk Hifil orang pertama menyatakan tindakan langsung Yahweh. Secara dasar verba חזק berarti membuat kuat atau teguh, tetapi dalam konteks penolakan Firaun, ungkapan Indonesia “mengeraskan hati” paling wajar menyampaikan keteguhan yang menjadi kedegilan.
- source_word: לֵב פַּרְעֹה
  choice: hati Firaun
  rationale: לֵב menunjuk pusat kehendak dan pikiran batin. “Hati” mempertahankan idiom Ibrani yang juga lazim dan dapat dipahami dalam bahasa Indonesia.
- source_word: וְרָדַף אַחֲרֵיהֶם
  choice: sehingga ia mengejar mereka
  rationale: רדף אחרי berarti mengejar. Konjungsi ו di sini secara wajar menyatakan akibat dari tindakan sebelumnya; “sehingga” membuat hubungan itu jelas tanpa menambahkan unsur yang tidak tersirat.
- source_word: וְאִכָּבְדָה בְּפַרְעֹה
  choice: Aku akan memperoleh kemuliaan atas Firaun
  rationale: Bentuk Niphal dari כבד dengan preposisi בְּ menyatakan bahwa Yahweh akan mendapat kehormatan atau kemuliaan dalam kaitannya dengan Firaun. “Atas Firaun” mempertahankan nuansa kemenangan atau penghakiman dalam konteks ini, sementara alternatif instrumental tetap dicatat.
- source_word: וּבְכָל חֵילוֹ
  choice: dan seluruh pasukannya
  rationale: חַיִל di sini menunjuk kekuatan militer Firaun; “pasukan” merupakan padanan Indonesia modern yang jelas.
- source_word: וְיָדְעוּ מִצְרַיִם
  choice: dan orang Mesir akan mengetahui
  rationale: Nama kolektif מִצְרַיִם disertai verba jamak, sehingga secara alami merujuk kepada orang-orang Mesir.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga identitas nama pribadi dalam teks dipertahankan.
- source_word: וַיַּעֲשׂוּ כֵן
  choice: Mereka pun melakukannya
  rationale: Penutup naratif ini menyatakan bahwa mereka melakukan apa yang diperintahkan. “Pun” secara alami menandai kelanjutan dan pelaksanaan dalam bahasa Indonesia.
theological_decisions:
- issue: Tindakan ilahi dalam pengerasan hati Firaun
  choice: Aku akan mengeraskan hati Firaun
  alternative: Aku akan meneguhkan hati Firaun; Aku akan membiarkan hati Firaun menjadi keras
  rationale: Bentuk Hifil orang pertama secara eksplisit menampilkan Yahweh sebagai pelaku. Terjemahan tidak mengubah kausasi langsung itu menjadi sekadar izin, tetapi catatan kaki mempertahankan rentang leksikal verba tersebut.
- issue: Makna כבד dalam konteks penghakiman
  choice: Aku akan memperoleh kemuliaan atas Firaun
  alternative: Aku akan dimuliakan melalui Firaun
  rationale: Konteks menggambarkan kehormatan Yahweh yang dinyatakan dalam kemenangan atas Firaun dan pasukannya. Pilihan utama mempertahankan daya adversatif konteks, sedangkan catatan kaki mencatat pembacaan instrumental yang juga mungkin secara gramatikal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Struktur kalimat dibuat alami bagi pembaca umum, sambil mempertahankan kausasi ilahi, idiom “hati”, nama Yahweh, dan ambiguitas mengenai cara kemuliaan diperoleh.
