  text: וַ/יָּבֹ֞א בֵּ֣ין מַחֲנֵ֣ה מִצְרַ֗יִם וּ/בֵין֙ מַחֲנֵ֣ה יִשְׂרָאֵ֔ל וַ/יְהִ֤י הֶֽ/עָנָן֙ וְ/הַ/חֹ֔שֶׁךְ וַ/יָּ֖אֶר אֶת הַ/לָּ֑יְלָה וְ/לֹא קָרַ֥ב זֶ֛ה אֶל זֶ֖ה כָּל הַ/לָּֽיְלָה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/020.yaml
  text: And it came between the camp of Egypt and the camp of Israel[a], and there was the cloud and the darkness, yet it lit up the night; and the one did not come near the other all night.
translation:
  language: id
  text: Lalu ia datang di antara perkemahan Mesir dan perkemahan Israel.[a] Awan dan kegelapan pun ada di situ, namun ia menerangi malam itu. Sepanjang malam, perkemahan yang satu tidak mendekati perkemahan yang lain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ada awan dan kegelapan, tetapi ia memberi terang pada malam hari.” Teks Ibrani di bagian ini ringkas, dan versi-versi kuno serta berbagai terjemahan berbeda dalam memahami hubungan antara kegelapan, terang, dan kedua perkemahan.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: ia datang
  rationale: Bentuk verba Ibrani maskulin tunggal merujuk kembali secara ambigu kepada malaikat Allah atau tiang awan dalam ayat sebelumnya. Kata ganti “ia” mempertahankan ketidakjelasan rujukan itu tanpa menyisipkan nomina penjelas.
- source_word: בֵּין ... וּבֵין
  choice: ke antara ... dan ...
  rationale: Mengungkapkan gerak menuju posisi di tengah kedua perkemahan secara alami dalam bahasa Indonesia.
- source_word: מַחֲנֵה מִצְרַיִם ... מַחֲנֵה יִשְׂרָאֵל
  choice: perkemahan Mesir ... perkemahan Israel
  rationale: “Perkemahan” mencakup kelompok orang beserta tempat mereka berkemah dan tetap dekat dengan bentuk konstruksi Ibrani.
- source_word: וַיְהִי הֶעָנָן וְהַחֹשֶׁךְ
  choice: Awan dan kegelapan pun ada di situ
  rationale: Mempertahankan pasangan nomina dalam teks Ibrani sambil membuat klausa eksistensialnya wajar dalam bahasa Indonesia.
- source_word: וַיָּאֶר אֶת־הַלָּיְלָה
  choice: namun ia menerangi malam itu
  rationale: Verba אור dalam bentuk ini berarti memberi terang atau menerangi. “Namun” menyampaikan pertentangan tersirat antara kegelapan dan penerangan tanpa menentukan secara tegas bagaimana keduanya terbagi antara kedua pihak.
- source_word: וְלֹא קָרַב זֶה אֶל־זֶה
  choice: perkemahan yang satu tidak mendekati perkemahan yang lain
  rationale: Mengungkapkan idiom timbal balik זֶה אֶל־זֶה secara jelas; pengulangan “perkemahan” memperjelas bahwa kedua kubu itulah yang tidak saling mendekat.
- source_word: כָּל־הַלָּיְלָה
  choice: Sepanjang malam
  rationale: Padanan Indonesia yang langsung dan idiomatis untuk keseluruhan durasi malam.
theological_decisions:
- issue: Rujukan verba maskulin tunggal וַיָּבֹא dan וַיָּאֶר
  choice: Menggunakan “ia” tanpa menyebut rujukannya secara eksplisit
  alternative: Menyebut “malaikat Allah”, “tiang awan”, atau “awan” secara eksplisit
  rationale: Konteks terdekat menyebut malaikat Allah dan tiang awan, sedangkan teks ayat ini tidak menegaskan rujukan verba tunggal tersebut. Pilihan ini mempertahankan ambiguitas sumber tanpa menetapkan tafsiran teologis tertentu.
- issue: Hubungan antara awan, kegelapan, dan terang
  choice: “Awan dan kegelapan pun ada di situ, namun ia menerangi malam itu” dengan catatan kaki
  alternative: Memahami awan sebagai mendatangkan kegelapan kepada satu perkemahan dan terang kepada perkemahan lain
  rationale: Teks Ibrani ringkas dan hubungan sintaksisnya tidak sepenuhnya jelas. Teks utama mengikuti urutan unsur Ibrani, sedangkan catatan mengakui kemungkinan pemahaman alternatif tanpa memasukkannya sebagai kepastian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. “Perkemahan” dipilih alih-alih “pasukan” agar bentuk sumber tetap terjaga, sementara susunan kalimat dibuat alami bagi pembaca umum.
