  text: וַֽ/יְהִי֙ בְּ/אַשְׁמֹ֣רֶת הַ/בֹּ֔קֶר וַ/יַּשְׁקֵ֤ף יְהוָה֙ אֶל מַחֲנֵ֣ה מִצְרַ֔יִם בְּ/עַמּ֥וּד אֵ֖שׁ וְ/עָנָ֑ן וַ/יָּ֕הָם אֵ֖ת מַחֲנֵ֥ה מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/024.yaml
  text: And in the morning watch[a], Yahweh looked down on the camp of the Egyptians through the pillar of fire and cloud[b], and threw the camp of the Egyptians into confusion.
translation:
  language: id
  text: Pada giliran jaga pagi, Yahweh memandang ke bawah ke arah perkemahan orang Mesir melalui tiang api dan awan[a], lalu mengacaukan perkemahan orang Mesir.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dari dalam tiang api dan awan.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “membuat perkemahan orang Mesir panik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאַשְׁמֹרֶת הַבֹּקֶר
  choice: pada waktu giliran jaga pagi
  rationale: Ungkapan ini menunjuk pada giliran jaga terakhir pada malam hari, menjelang pagi. Pilihan ini mempertahankan kekhususan waktunya tanpa menambahkan penjelasan ke dalam teks.
- source_word: וַיַּשְׁקֵף
  choice: memandang ke bawah ke arah
  rationale: Dalam bentuk ini, שׁקף menggambarkan tindakan memandang dari suatu posisi di atas atau dari tempat tinggi; frasa Indonesia ini mempertahankan arah pandangan tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: מַחֲנֵה מִצְרַיִם
  choice: perkemahan orang Mesir
  rationale: Frasa konstruksi ini merujuk pada perkemahan pasukan orang Mesir dan diterjemahkan secara alami dalam bahasa Indonesia.
- source_word: בְּעַמּוּד אֵשׁ וְעָנָן
  choice: melalui tiang api dan awan
  rationale: Preposisi ב dapat dipahami secara instrumental atau lokatif-instrumental. 'Melalui' mempertahankan gagasan bahwa pandangan atau tindakan Yahweh berlangsung dengan perantaraan tiang itu, sementara kemungkinan lokatif dicatat dalam catatan kaki.
- source_word: וַיָּהָם
  choice: membuat ... kacau
  rationale: Bentuk kausatif ini menyatakan bahwa Yahweh menimbulkan kegaduhan, kekacauan, atau kepanikan. Pilihan ini mempertahankan daya kausatif tanpa menyatakan bahwa pasukan itu sudah sepenuhnya dipukul mundur.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama diri ilahi YHWH. Bentuk 'Yahweh' mempertahankan nama perjanjian itu dan tidak menggantinya dengan sebuah gelar.
- issue: Nuansa tindakan Yahweh terhadap perkemahan Mesir
  choice: membuat ... kacau
  alternative: membuat ... panik
  rationale: הום mencakup kekacauan maupun kepanikan. Teks utama memakai istilah yang lebih luas, sedangkan nuansa kepanikan dipertahankan dalam catatan kaki agar ketegangan leksikal tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan rincian waktu, arah pandangan ilahi, nama Yahweh, serta ambiguitas preposisi dan nuansa verba penutup.
