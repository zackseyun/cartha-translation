  text: וַ/יְחַזֵּ֣ק יְהֹוָ֗ה אֶת לֵ֤ב פַּרְעֹה֙ מֶ֣לֶךְ מִצְרַ֔יִם וַ/יִּרְדֹּ֕ף אַחֲרֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/בְנֵ֣י יִשְׂרָאֵ֔ל יֹצְאִ֖ים בְּ/יָ֥ד רָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/008.yaml
  text: And Yahweh hardened the heart of Pharaoh king of Egypt[a], and he pursued the sons of Israel[b], while the sons of Israel were going out with a high hand.
translation:
  language: id
  text: Lalu TUHAN mengeraskan[a] hati Firaun, raja Mesir, dan Firaun mengejar orang Israel, sedangkan orang Israel sedang keluar dengan tangan terangkat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “meneguhkan.” Verba Ibrani ini pada dasarnya berarti “membuat kuat atau teguh,” tetapi dalam kisah Keluaran ungkapan tentang hati Firaun lazimnya bermakna “mengeraskan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dengan tangan yang tinggi”; maksudnya, dengan berani atau terang-terangan.'
    reason: idiom_explanation
lexical_decisions:
- source_word: יְהֹוָה
  choice: TUHAN
  rationale: Bentuk huruf kapital kecil secara konvensional diwakili di sini dengan 'TUHAN', padanan baku dan mudah dikenali dalam Alkitab bahasa Indonesia untuk nama ilahi YHWH.
- source_word: וַיְחַזֵּק
  choice: mengeraskan
  rationale: Secara dasar verba חזק berarti membuat kuat atau teguh, tetapi dalam rangkaian kisah tentang hati Firaun ungkapan ini menyatakan peneguhan hati yang menjadi keras. Alternatif leksikal dipertahankan dalam catatan kaki.
- source_word: לֵב
  choice: hati
  rationale: '''Hati'' mempertahankan gambaran Ibrani tentang pusat kemauan, sikap, dan keputusan serta tetap jelas bagi pembaca Indonesia.'
- source_word: פַּרְעֹה מֶלֶךְ מִצְרַיִם
  choice: Firaun, raja Mesir
  rationale: Padanan langsung dan alami untuk rangkaian gelar Ibrani.
- source_word: וַיִּרְדֹּף אַחֲרֵי
  choice: Firaun mengejar
  rationale: '''Mengejar'' menyampaikan tindakan aktif dan bernuansa permusuhan. Nama Firaun diulang agar rujukan pelaku jelas dalam bahasa Indonesia.'
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: '''Orang Israel'' merupakan sebutan kolektif yang alami dalam bahasa Indonesia dan mencakup umat yang keluar dari Mesir tanpa kekakuan ungkapan harfiah ''anak-anak lelaki Israel''.'
- source_word: יֹצְאִים
  choice: sedang keluar
  rationale: Bentuk partisip Ibrani menunjukkan tindakan yang tengah berlangsung ketika pengejaran terjadi.
- source_word: בְּיָד רָמָה
  choice: dengan tangan terangkat
  rationale: Terjemahan ini mempertahankan gambaran konkret idiom Ibrani, sementara makna keberanian atau sikap terbuka dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Tindakan ilahi dalam pengerasan hati Firaun
  choice: TUHAN mengeraskan hati Firaun
  alternative: TUHAN meneguhkan hati Firaun
  rationale: Teks Ibrani secara langsung menyatakan TUHAN sebagai pelaku. Terjemahan utama mempertahankan ketegangan teologis itu dan tidak melunakkannya, sementara rentang arti verba dicatat sebagai alternatif leksikal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mempertahankan urutan tindakan serta keadaan yang berlangsung bersamaan. Pengulangan 'orang Israel' dari teks sumber dipertahankan, sedangkan 'Firaun' diulang untuk menghindari rujukan pronomina yang kabur.
