  terminology: '"Kereta pilihan" dan "para perwira" adalah padanan yang sesuai. "Para perwira" tidak memaksakan identifikasi teknis bagi שָׁלִשִׁים; catatan kaki secara tepat menjelaskan kemungkinan perwira kereta atau ajudan militer elite.'
