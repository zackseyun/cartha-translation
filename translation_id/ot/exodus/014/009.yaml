translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Nama tempat ditransliterasikan sebagai Pi-Hahirot dan Baal-Zefon. Tanda pisah mempertahankan sisipan yang merinci seluruh kekuatan militer Firaun.
