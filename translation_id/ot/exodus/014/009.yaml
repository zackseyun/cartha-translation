  text: וַ/יִּרְדְּפ֨וּ מִצְרַ֜יִם אַחֲרֵי/הֶ֗ם וַ/יַּשִּׂ֤יגוּ אוֹתָ/ם֙ חֹנִ֣ים עַל הַ/יָּ֔ם כָּל סוּס֙ רֶ֣כֶב פַּרְעֹ֔ה וּ/פָרָשָׁ֖י/ו וְ/חֵיל֑/וֹ עַל פִּי֙ הַֽחִירֹ֔ת לִ/פְנֵ֖י בַּ֥עַל צְפֹֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/009.yaml
  text: The Egyptians pursued them and overtook them as they were camped by the sea—all Pharaoh’s horses and chariots[a], his horsemen, and his army—by Pi-hahiroth, before Baal-zephon.
translation:
  language: id
  text: Orang Mesir mengejar mereka dan menyusul mereka yang sedang berkemah di tepi laut—semua kuda dan kereta perang Firaun, para penunggang kudanya, serta pasukannya—di dekat Pi-Hahirot, di depan Baal-Zefon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berhadapan dengan Baal-Zefon.” Ungkapan Ibrani ini dapat menunjukkan posisi yang menghadap suatu tempat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדְּפוּ
  choice: mengejar
  rationale: Kata רדף lazim berarti mengejar; pilihan ini alami dalam konteks pengejaran militer.
- source_word: מִצְרַיִם
  choice: Orang Mesir
  rationale: Bentuk ini dapat menunjuk negeri atau rakyat Mesir, tetapi verba jamak dan konteks menuntut pengertian orang atau pasukan Mesir.
- source_word: וַיַּשִּׂיגוּ
  choice: menyusul
  rationale: Dalam konteks ini נשׂג berarti berhasil mencapai pihak yang dikejar; 'menyusul' menyampaikan makna itu secara ringkas dan alami.
- source_word: חֹנִים
  choice: ketika mereka sedang berkemah
  rationale: Partisip ini menggambarkan keadaan orang Israel saat pasukan Mesir menyusul mereka.
- source_word: עַל הַיָּם
  choice: di tepi laut
  rationale: Preposisi עַל di sini bersifat lokatif; 'di tepi laut' merupakan ungkapan Indonesia yang alami dan tidak menjadikan 'laut' sebagai nama diri.
- source_word: כָּל סוּס רֶכֶב פַּרְעֹה
  choice: semua kuda dan kereta perang Firaun
  rationale: Ungkapan Ibrani ini padat dan bersifat kolektif. Terjemahan ini menyampaikan keseluruhan perlengkapan kereta perang Firaun dengan bahasa Indonesia yang jelas.
- source_word: וּפָרָשָׁיו
  choice: para penunggang kudanya
  rationale: פָּרָשִׁים menunjuk pasukan berkuda atau para penunggang kuda; pilihan ini dekat dengan bentuk leksikal dan mudah dipahami.
- source_word: וְחֵילוֹ
  choice: serta pasukannya
  rationale: חַיִל dalam konteks ini menunjuk kekuatan militer; 'pasukan' merupakan padanan yang alami.
- source_word: עַל פִּי הַחִירֹת
  choice: di dekat Pi-Hahirot
  rationale: Ungkapan berpreposisi ini menunjukkan lokasi di sekitar tempat bernama Pi-Hahirot.
- source_word: לִפְנֵי בַּעַל צְפֹן
  choice: di depan Baal-Zefon
  rationale: לִפְנֵי dalam konteks ruang dapat berarti di depan, di hadapan, atau berhadapan dengan; 'di depan' mempertahankan relasi ruang tanpa menentukan jarak secara berlebihan.
