  text: וּ/בְנֵ֧י יִשְׂרָאֵ֛ל הָלְכ֥וּ בַ/יַּבָּשָׁ֖ה בְּ/ת֣וֹךְ הַ/יָּ֑ם וְ/הַ/מַּ֤יִם לָ/הֶם֙ חֹמָ֔ה מִֽ/ימִינָ֖/ם וּ/מִ/שְּׂמֹאלָֽ/ם
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/029.yaml
  text: But the sons of Israel walked on dry ground through the midst of the sea[b][a], and the waters were a wall to them on their right and on their left.
translation:
  language: id
  text: Namun, orang Israel berjalan di tanah kering di tengah-tengah laut, dan air itu merupakan tembok bagi mereka di sebelah kanan dan kiri mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “air itu adalah tembok bagi mereka”; sebagian orang memahaminya sebagai “seperti tembok.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Namun, orang Israel
  rationale: Ungkapan harfiah Ibrani berarti 'anak-anak lelaki Israel', tetapi dalam konteks ini merupakan sebutan kolektif bagi bangsa Israel. 'Orang Israel' menyampaikan rujukannya secara wajar dalam bahasa Indonesia; 'Namun' menandai kontras dengan kebinasaan orang Mesir dalam konteks sebelumnya.
- source_word: הָלְכוּ
  choice: berjalan
  rationale: Kata הלך berarti pergi atau berjalan; 'berjalan' mempertahankan gambaran mereka menempuh dasar laut.
- source_word: בַיַּבָּשָׁה
  choice: di tanah kering
  rationale: יבשה menunjuk pada tanah atau daratan yang kering. Pilihan ini alami dan menonjolkan keadaan dasar laut.
- source_word: בְּתוֹךְ הַיָּם
  choice: di tengah-tengah laut
  rationale: בתוך menyatakan posisi di bagian tengah atau di dalam; bentuk ini mempertahankan gambaran ruang dalam teks Ibrani.
- source_word: וְהַמַּיִם
  choice: dan air itu
  rationale: מים berbentuk jamak dalam bahasa Ibrani, tetapi bahasa Indonesia secara alami memakai nomina massa tunggal 'air'; artikel Ibrani disampaikan dengan 'itu'.
- source_word: לָהֶם חֹמָה
  choice: menjadi tembok bagi mereka
  rationale: Teks menyatakan secara langsung bahwa air itu adalah/menjadi tembok bagi mereka tanpa penanda perbandingan eksplisit.
- source_word: מִימִינָם וּמִשְּׂמֹאלָם
  choice: di sebelah kanan dan kiri mereka
  rationale: Ungkapan ini menyatakan posisi pada kedua sisi mereka dan diterjemahkan dengan susunan Indonesia yang seimbang serta alami.
theological_decisions:
- issue: Penerjemahan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak lelaki Israel; keturunan Israel
  rationale: Meskipun bentuk Ibraninya bersifat filial dan gramatikal maskulin, dalam konteks narasi ungkapan itu merupakan nama kolektif bangsa. 'Orang Israel' tidak membatasi kelompok tersebut hanya pada laki-laki dan merupakan padanan Indonesia yang jelas.
- issue: Apakah חֹמָה diterjemahkan secara langsung atau sebagai perbandingan
  choice: tembok
  alternative: seperti tembok
  rationale: Bahasa Ibrani tidak memakai partikel perbandingan. Terjemahan utama mempertahankan pernyataan langsung, sementara kemungkinan pemahaman sebagai kiasan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. 'Orang Israel' dipilih daripada terjemahan mekanis 'anak-anak lelaki Israel'; struktur ruang dan pernyataan kuat tentang air sebagai tembok tetap dipertahankan.
