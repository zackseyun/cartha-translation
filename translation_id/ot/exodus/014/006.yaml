  text: So he harnessed his chariot and took his people with him[a][b].
translation:
  language: id
  text: Lalu Firaun menyiapkan keretanya[a] dan membawa rakyatnya bersamanya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memasangkan hewan penarik pada keretanya”; kata kerja Ibrani ini secara harfiah berarti “mengikat” atau “menambatkan”, dan di sini menunjuk pada penyiapan kereta untuk berangkat.
    reason: lexical_alternative
  - marker: b
    text: “Rakyatnya” kemungkinan merujuk pada pasukan yang menyertai Firaun; teks Ibrani mengatakan “rakyatnya”, bukan secara eksplisit “tentaranya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאְסֹר
  choice: memasang
  rationale: Kata kerja אסר secara harfiah berarti ‘mengikat’; dalam konteks kereta, kata ini menunjuk pada tindakan memasang atau menambatkan hewan penarik pada kereta. ‘Memasang keretanya’ alami dalam bahasa Indonesia dan tetap mencerminkan tindakan konkret tersebut.
- source_word: רִכְבּוֹ
  choice: keretanya
  rationale: Bentuk tunggal dengan akhiran milik paling wajar menunjuk pada kereta Firaun sendiri, bukan seluruh pasukan kereta.
- source_word: עַמּוֹ
  choice: rakyatnya
  rationale: Kata עַם biasanya berarti ‘rakyat’ atau ‘bangsa’. Dalam konteks ini kemungkinan yang dimaksud ialah orang-orang, khususnya pasukan, yang menyertai Firaun, tetapi teks Ibrani tidak secara eksplisit mengatakan ‘tentaranya’.
- source_word: לָקַח עִמּוֹ
  choice: membawa ... bersamanya
  rationale: Ungkapan ini secara langsung berarti membawa atau mengajak seseorang ikut bersama. Pilihan ini idiomatis dalam bahasa Indonesia.
