translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama ‘Firaun’ disebut untuk memperjelas subjek pronominal yang tersirat dalam verba Ibrani dan telah ditetapkan oleh konteks dekat.
