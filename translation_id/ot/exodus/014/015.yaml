  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה מַה תִּצְעַ֖ק אֵלָ֑/י דַּבֵּ֥ר אֶל בְּנֵי יִשְׂרָאֵ֖ל וְ/יִסָּֽעוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/015.yaml
  text: Then Yahweh said to Moses[b][a], “Why are you crying out to me? Tell the sons of Israel to set out.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa, “Mengapa engkau berseru kepada-Ku? Katakanlah kepada orang Israel[a] agar mereka berangkat[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “putra-putra Israel”; maksudnya, orang-orang Israel atau keturunan Israel.
    reason: lexical_alternative
  - marker: b
    text: Atau “maju”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Bentuk naratif ini melanjutkan urutan peristiwa. “Lalu” alami dalam narasi Indonesia, sedangkan “berfirman” sesuai untuk perkataan Allah dalam ragam Alkitab yang tetap mudah dipahami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar “TUHAN”.
- source_word: מַה תִּצְעַק אֵלָי
  choice: Mengapa engkau berseru kepada-Ku?
  rationale: Dalam susunan ini, מַה menyatakan pertanyaan bernuansa teguran, dan צעק berarti berseru dalam keadaan terdesak atau memohon pertolongan.
- source_word: דַּבֵּר אֶל
  choice: Katakanlah kepada
  rationale: Ungkapan ini menyampaikan perintah agar Musa berbicara kepada umat tanpa memperkeras maknanya menjadi “perintahkanlah”.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan Ibrani ini merupakan sebutan kolektif bagi bangsa Israel. “Orang Israel” adalah padanan modern yang alami; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וְיִסָּעוּ
  choice: agar mereka berangkat
  rationale: נסע dalam konteks perjalanan berarti mulai bergerak atau berangkat. Bentuk “agar mereka berangkat” menyampaikan daya perintah tak langsung setelah “Katakanlah” secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Pemakaian “Yahweh” mempertahankan nama perjanjian sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: keturunan Israel; anak-anak lelaki Israel
  rationale: Dalam konteks ini ungkapan tersebut menunjuk kepada umat Israel secara kolektif, bukan hanya laki-laki. Terjemahan utama menyampaikan rujukan itu, sementara bentuk yang lebih harfiah dipertahankan dalam catatan.
- issue: Arah gerak dalam וְיִסָּעוּ
  choice: berangkat
  alternative: maju
  rationale: Kata kerja itu pada dasarnya menyatakan mulai menempuh perjalanan. Konteks memungkinkan pengertian bergerak maju, tetapi teks tidak memakai kata khusus yang semata-mata berarti “maju”.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Engkau” mempertahankan sapaan tunggal kepada Musa, sedangkan struktur kalimat dibuat alami bagi pembaca masa kini.
