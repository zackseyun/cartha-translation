base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/018.yaml
  text: And the Egyptians will know that I am Yahweh[a], when I gain glory through Pharaoh, through his chariots[b], and through his horsemen.
translation:
  language: id
  text: orang Mesir akan mengetahui bahwa Akulah Yahweh[a] ketika Aku dimuliakan[b] melalui Firaun, kereta-keretanya, dan pasukan berkudanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Ibrani YHWH secara tradisional diterjemahkan “TUHAN”.
    reason: alternative_reading
  - marker: b
    text: Atau, “memperoleh kemuliaan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: akan mengetahui
  rationale: 'Bentuk perfektum dengan waw dalam rangkaian naratif menyatakan hasil yang akan terjadi: orang Mesir akan mengakui siapa Yahweh melalui peristiwa yang segera berlangsung.'
- source_word: מִצְרַיִם
  choice: Orang Mesir
  rationale: Dalam konteks ini nama tersebut menunjuk kepada bangsa atau rakyat Mesir, bukan semata-mata wilayahnya.
- source_word: כִּי אֲנִי יְהוָה
  choice: bahwa Akulah Yahweh
  rationale: Ungkapan ini mempertahankan rumusan pengenalan ilahi dan memberi penekanan alami pada identitas Sang Pembicara dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai nama diri, bukan diganti dengan gelar; catatan kaki mencantumkan kebiasaan penerjemahan tradisional.
- source_word: בְּהִכָּבְדִי
  choice: ketika Aku dimuliakan
  rationale: Infinitif konstruk Nifal dari כבד dengan prefiks בְּ menyatakan waktu dan secara formal berarti bahwa Yahweh dimuliakan atau memperoleh kemuliaan melalui penghakiman yang dilakukan-Nya.
- source_word: בְּפַרְעֹה
  choice: melalui Firaun
  rationale: Preposisi בְּ dapat menyatakan sarana atau lingkup tempat kemuliaan Yahweh dinyatakan; 'melalui' alami dalam bahasa Indonesia dan mempertahankan hubungan itu tanpa menambahkan pelaku.
- source_word: בְּרִכְבּוֹ
  choice: kereta-keretanya
  rationale: רֶכֶב di sini bersifat kolektif dan menunjuk kepada pasukan kereta perang milik Firaun; bentuk jamak kontekstual mudah dipahami.
- source_word: וּבְפָרָשָׁיו
  choice: dan pasukan berkudanya
  rationale: פָּרָשׁ dapat menunjuk penunggang kuda atau pasukan berkuda. Pilihan ini alami dan mempertahankan arti militer kolektif dalam konteks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi YHWH. Transliterasi 'Yahweh' mempertahankan nama tersebut, sedangkan bentuk tradisional Indonesia dicatat sebagai alternatif.
- issue: Cara kemuliaan Yahweh dinyatakan dalam penghakiman atas Mesir
  choice: ketika Aku dimuliakan melalui Firaun
  alternative: ketika Aku memperoleh kemuliaan melalui Firaun
  rationale: Bentuk Nifal memungkinkan nuansa 'dimuliakan' atau 'memperoleh kemuliaan'. Terjemahan utama mempertahankan bentuk pasif sumber tanpa menentukan secara eksplisit siapa yang memuliakan Yahweh.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat tetap dekat dengan urutan Ibrani, tetapi istilah kolektif militer dibuat jelas bagi pembaca umum. Setiap catatan kaki memiliki penanda yang sesuai dalam teks utama.
