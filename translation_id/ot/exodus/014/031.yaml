source:
  edition: WLC
  text: וַ/יַּ֨רְא יִשְׂרָאֵ֜ל אֶת הַ/יָּ֣ד הַ/גְּדֹלָ֗ה אֲשֶׁ֨ר עָשָׂ֤ה יְהוָה֙ בְּ/מִצְרַ֔יִם וַ/יִּֽירְא֥וּ הָ/עָ֖ם אֶת יְהוָ֑ה וַ/יַּֽאֲמִ֨ינוּ֙ בַּֽ/יהוָ֔ה וּ/בְ/מֹשֶׁ֖ה עַבְדּֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/014/031.yaml
  text: Israel saw the great hand that Yahweh had done against Egypt[a], and the people feared Yahweh[b], and they believed in Yahweh and in Moses his servant.
translation:
  language: id
  text: Israel melihat tindakan besar[a] yang telah Yahweh lakukan terhadap Mesir[b]. Bangsa itu pun takut kepada Yahweh dan percaya kepada Yahweh serta kepada Musa, hamba-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tangan yang besar.” Dalam bahasa Ibrani, “tangan” dapat menjadi gambaran kuasa atau tindakan yang kuat.
    reason: lexical_alternative
  - marker: b
    text: Atau “di Mesir” atau “atas Mesir.” Preposisi Ibrani dapat menunjuk tempat maupun sasaran tindakan; konteks ini mendukung “terhadap Mesir.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא יִשְׂרָאֵל
  choice: Israel melihat
  rationale: Mempertahankan Israel sebagai nomina kolektif tunggal dan menerjemahkan ראה sebagai persepsi langsung atas peristiwa yang baru terjadi.
- source_word: הַיָּד הַגְּדֹלָה
  choice: kuasa tangan Yahweh yang besar
  rationale: Ungkapan ini mempertahankan citra ‘tangan’ yang berulang dalam Keluaran, sekaligus membuat fungsi metaforisnya sebagai kuasa dapat dipahami secara alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר עָשָׂה יְהוָה בְּמִצְרַיִם
  choice: yang telah dikerahkan-Nya terhadap Mesir
  rationale: ‘Dikerahkan’ membuat hubungan tindakan dengan citra tangan menjadi wajar dalam bahasa Indonesia. ‘Terhadap’ sesuai dengan konteks penghukuman, sementara kemungkinan arti preposisi בְ yang lebih harfiah dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai Yahweh, bukan diganti dengan sebuah gelar.
- source_word: וַיִּירְאוּ הָעָם אֶת יְהוָה
  choice: Bangsa itu pun takut kepada Yahweh
  rationale: ‘Takut’ mempertahankan keluasan makna ירא, yang dalam konteks ini dapat mencakup rasa gentar, takjub, dan hormat tanpa mempersempitnya.
- source_word: וַיַּאֲמִינוּ בַּיהוָה
  choice: percaya kepada Yahweh
  rationale: Bentuk אמן dengan preposisi בְ menyatakan percaya atau menaruh kepercayaan kepada; ‘percaya kepada’ merupakan ungkapan Indonesia yang alami.
- source_word: וּבְמֹשֶׁה עַבְדּוֹ
  choice: serta kepada Musa, hamba-Nya
  rationale: Struktur paralel dengan ‘kepada Yahweh’ dipertahankan, sedangkan ‘hamba-Nya’ memperjelas kedudukan Musa sebagai hamba Yahweh.
theological_decisions:
- issue: Sifat tanggapan Israel terhadap Musa
  choice: Israel percaya kepada Yahweh dan juga kepada Musa dalam kedudukannya sebagai hamba Yahweh.
  alternative: Israel hanya mempercayai Musa secara pribadi, atau ‘percaya kepada’ Yahweh dan Musa dipahami sebagai penyamaan kedudukan keduanya.
  rationale: Teks memakai konstruksi אמן + בְ secara paralel bagi Yahweh dan Musa, tetapi sebutan ‘hamba-Nya’ tetap menempatkan Musa di bawah Yahweh sebagai wakil yang diberi wewenang.
- issue: Makna takut kepada Yahweh
  choice: Mempertahankan kata ‘takut’ tanpa menjelaskannya hanya sebagai rasa gentar atau hanya sebagai rasa hormat.
  alternative: ‘Takjub kepada Yahweh’ atau ‘menghormati Yahweh.’
  rationale: Kata ירא dapat mencakup kegentaran, ketakjuban, dan penghormatan; terjemahan tidak boleh meniadakan ketegangan makna itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Partikel ‘pun’ menjaga alur naratif akibat-respons. Citra tangan dipertahankan, tetapi unsur ‘kuasa’ ditambahkan agar metafora dapat dipahami secara alami. Kapitalisasi ‘-Nya’ mengikuti kebiasaan bahasa Indonesia ketika acuannya adalah Yahweh.
