  yaml_path: translation/ot/exodus/021/016.yaml
  text: Whoever kidnaps a man and sells him[a], or he is found in his hand[b], shall surely be put to death.
translation:
  language: id
  text: Siapa pun yang menculik seorang laki-laki dan menjualnya[a], atau jika laki-laki itu didapati dalam kekuasaannya[b], penculik itu harus dihukum mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mencuri seorang laki-laki.” Dalam konteks ini, ungkapan tersebut berarti menculik atau mencuri manusia.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “didapati di tangannya,” sebuah ungkapan Ibrani yang berarti berada dalam kekuasaan atau kendalinya. Kata penghubungnya juga dapat diterjemahkan “dan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹנֵב
  choice: menculik
  rationale: Secara harfiah berarti 'mencuri', tetapi dengan seorang manusia sebagai objek serta konteks penjualan atau penguasaan atas korban, kata ini menunjuk pada penculikan atau pencurian manusia.
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Nomina Ibrani ini berbentuk tunggal maskulin. Pilihan ini mempertahankan bentuk gender dalam teks sumber tanpa menentukan apakah hukum tersebut memiliki penerapan representatif yang lebih luas.
- source_word: וּמְכָרוֹ
  choice: lalu menjualnya
  rationale: Verba מכר dengan sufiks maskulin tunggal merujuk pada tindakan menjual laki-laki yang diculik. 'Lalu' mengungkapkan rangkaian tindakan secara alami dalam bahasa Indonesia.
- source_word: וְנִמְצָא בְיָדוֹ
  choice: atau jika laki-laki itu didapati dalam kekuasaannya
  rationale: נמצא berarti 'didapati', sedangkan בידו secara harfiah 'di tangannya' merupakan idiom bagi kepemilikan, penguasaan, atau kendali. 'Atau' menyatakan alternatif antara korban telah dijual dan korban masih dikuasai penculik.
- source_word: מֹות יוּמָת
  choice: harus dihukum mati
  rationale: Gabungan infinitif absolut dan verba finit memberi penegasan kuat pada hukuman. Dalam rumusan hukum Indonesia, 'harus dihukum mati' menyampaikan vonis yudisial dengan tegas dan alami.
theological_decisions:
- issue: Cakupan tindak pidana dalam hukum ini
  choice: Hukum ini melarang penculikan atau pencurian manusia, baik korban telah dijual maupun masih berada dalam kekuasaan penculik.
  alternative: 'Konjungsi pada klausa kedua dapat dipahami secara aditif: ''dan laki-laki itu didapati dalam kekuasaannya'', bukan sebagai alternatif.'
  rationale: 'Susunan kasus hukum ini paling wajar dipahami mencakup dua keadaan setelah penculikan: korban sudah dijual atau masih dikuasai penculik. Namun, kemungkinan pembacaan konjungsi secara aditif dipertahankan dalam catatan kaki.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum. Struktur kalimat dibuat jelas dengan menyebut kembali 'laki-laki itu' dan 'penculik itu' untuk menghindari kerancuan rujukan pronomina, sambil tetap mempertahankan ambiguitas konjungsi Ibrani melalui catatan kaki.
