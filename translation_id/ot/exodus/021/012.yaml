  text: Siapa pun yang memukul seorang laki-laki hingga orang itu mati harus dihukum mati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Orang yang memukul seorang laki-laki dan laki-laki itu mati, orang yang memukul itu pasti dihukum mati.”
