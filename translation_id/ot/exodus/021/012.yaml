lexical_decisions:
- source_word: מַכֵּה
  choice: memukul
  rationale: 'Partisipel dari נכה membuka rumusan hukum kasuistis: orang yang memukul. “Memukul” alami dalam bahasa Indonesia dan tidak memasukkan akibat kematian ke dalam verba itu sendiri.'
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: אִישׁ pada umumnya menunjuk kepada seorang laki-laki. Pilihan ini mempertahankan penandaan gender pada korban, sedangkan “siapa pun” menyampaikan cakupan umum bagi pelaku.
- source_word: וָמֵת
  choice: hingga orang itu mati
  rationale: Konjungsi dengan bentuk qatal dari מות menyatakan akibat pukulan. “Hingga orang itu mati” menyampaikan hubungan akibat secara alami tanpa mengubah substansi hukum.
- source_word: מוֹת יוּמָת
  choice: harus dihukum mati
  rationale: Infinitif absolut yang diikuti bentuk pasif yiqtol menegaskan kepastian hukuman mati. “Harus dihukum mati” mempertahankan daya wajib dan bentuk pasif hukum dalam bahasa Indonesia modern.
