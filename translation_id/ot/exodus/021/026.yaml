  text: וְ/כִֽי יַכֶּ֨ה אִ֜ישׁ אֶת עֵ֥ין עַבְדּ֛/וֹ אֽוֹ אֶת עֵ֥ין אֲמָת֖/וֹ וְ/שִֽׁחֲתָ֑/הּ לַֽ/חָפְשִׁ֥י יְשַׁלְּחֶ֖/נּוּ תַּ֥חַת עֵינֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/026.yaml
  text: And if a man strikes the eye of his male servant or the eye of his female servant and destroys it[c][b][a], he shall let him go free in compensation for his eye.
translation:
  language: id
  text: Apabila seorang laki-laki memukul mata budak laki-lakinya atau mata budak perempuannya[a] dan merusak mata itu[b], ia harus membebaskan budak itu sebagai pengganti matanya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “budak laki-lakinya ... budak perempuannya.” Dalam konteks hukum ini, istilah-istilah tersebut menunjuk pada orang yang berada dalam status perbudakan.'
    reason: cultural_note
  - marker: b
    text: Atau, “dan membutakannya.” Kata kerja Ibrani dapat berarti merusak atau menghancurkan mata, sehingga menyiratkan cedera permanen.
    reason: lexical_alternative
  - marker: c
    text: Secara lebih harfiah, “untuk matanya.” Maksudnya, pembebasan diberikan sebagai pengganti atau kompensasi atas cedera mata itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Apabila
  rationale: Menandai awal ketentuan hukum kasuistis secara alami dalam bahasa Indonesia; daya penghubung waw tidak perlu dinyatakan dengan “dan” pada awal ayat.
- source_word: יַכֶּה
  choice: memukul
  rationale: Secara langsung mencerminkan makna נכה, yaitu memukul atau menghantam, tanpa menyiratkan tindakan berulang.
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Mempertahankan bentuk maskulin tunggal dari teks Ibrani dalam rumusan hukum ini.
- source_word: עַבְדּוֹ ... אֲמָתוֹ
  choice: budak laki-lakinya ... budak perempuannya
  rationale: Konteks kepemilikan dan pembebasan menunjukkan status perbudakan, sedangkan pembedaan jenis kelamin dalam teks sumber dipertahankan.
- source_word: וְשִׁחֲתָהּ
  choice: dan merusakkannya
  rationale: שחת menunjuk pada perusakan mata yang serius atau permanen; pilihan ini tidak mempersempit makna hanya pada kebutaan total.
- source_word: לַחָפְשִׁי יְשַׁלְּחֶנּוּ
  choice: ia harus membebaskan budak itu
  rationale: Mengungkapkan kewajiban hukum untuk melepaskan orang tersebut ke dalam status merdeka dengan bahasa Indonesia yang wajar.
- source_word: תַּחַת עֵינוֹ
  choice: sebagai ganti atas matanya
  rationale: תחת dalam konteks hukum menyatakan penggantian atau kompensasi; ungkapan ini mempertahankan gambaran konkret teks sumber.
theological_decisions:
- issue: Istilah bagi orang dalam status perbudakan dalam hukum Israel
  choice: budak laki-laki / budak perempuan
  alternative: hamba laki-laki / hamba perempuan
  rationale: Kerangka kepemilikan, cedera oleh tuan, dan pembebasan menjadikan status perbudakan penting bagi makna hukum; “budak” tidak melunakkan realitas sosial tersebut.
- issue: Subjek hukum yang berjenis kelamin maskulin
  choice: seorang laki-laki
  alternative: seseorang
  rationale: אִישׁ berbentuk maskulin dan konteks tidak mengharuskan penetralan gender.
- issue: Acuan pronomina pada budak laki-laki atau perempuan
  choice: budak itu
  alternative: dia
  rationale: Bahasa Indonesia memungkinkan acuan yang mencakup kedua kemungkinan tanpa memaksakan gender; ini juga menghindari ketidakjelasan tentang siapa yang harus dibebaskan.
translation_notes:
  register: Bahasa hukum yang lugas, modern, dan bermartabat. Susunan paralel “mata budak laki-lakinya atau mata budak perempuannya” dipertahankan agar dekat dengan struktur Ibrani, sementara “membebaskan budak itu” dipilih demi kejelasan acuan dalam bahasa Indonesia.
