  text: If it gores a son or a daughter[b][a], it shall be done to him according to this judgment.
translation:
  language: id
  text: Jika lembu itu menanduk seorang anak laki-laki atau anak perempuan, terhadap pemiliknya harus diberlakukan ketentuan yang sama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maksudnya, ketentuan hukum yang disebutkan dalam ayat sebelumnya juga berlaku apabila lembu itu menanduk seorang anak laki-laki atau anak perempuan. Frasa ini juga dapat diterjemahkan “sesuai dengan putusan ini” atau “sesuai dengan peraturan ini.”
    reason: cross_reference_and_lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: Jika
  rationale: Dalam rangkaian hukum kasuistik ini, אוֹ memperkenalkan kasus alternatif; bahasa Indonesia paling alami mengungkapkannya dengan “Jika”.
- source_word: בֵן ... בַת
  choice: seorang anak laki-laki atau anak perempuan
  rationale: Mempertahankan pasangan gender dalam bahasa Ibrani, sambil memakai ungkapan Indonesia yang wajar dan tidak mengandaikan bahwa anak itu adalah anak pemilik lembu.
- source_word: יִגָּח
  choice: lembu itu menanduk
  rationale: Kata kerja נגח berarti menanduk; subjek tersiratnya adalah lembu dari konteks ayat sebelumnya, sehingga dinyatakan agar jelas dalam bahasa Indonesia.
- source_word: כַּמִּשְׁפָּט הַזֶּה
  choice: ketentuan yang sama
  rationale: מִשְׁפָּט dalam konteks hukum menunjuk pada putusan, aturan, atau ketentuan hukum yang baru disebut. “Yang sama” menyampaikan rujukan deiktis הַזֶּה secara alami dalam bahasa Indonesia.
- source_word: יֵעָשֶׂה לּוֹ
  choice: terhadap pemiliknya harus diberlakukan
  rationale: Bentuk pasif יֵעָשֶׂה dipertahankan melalui “harus diberlakukan”; לּוֹ merujuk secara kontekstual kepada pemilik lembu. Penyebutan “pemiliknya” menghindari pronomina Indonesia yang kabur.
theological_decisions:
- issue: Cakupan hukuman bagi korban anak laki-laki atau anak perempuan
  choice: Mengacu kembali kepada ketentuan hukum pada ayat sebelumnya tanpa mengulang atau mempersempitnya
  alternative: Menyatakan secara eksplisit bahwa pemilik lembu harus dihukum mati
  rationale: Frasa Ibrani hanya mengatakan bahwa ketentuan yang sama diberlakukan kepadanya. Terjemahan menjaga rujukan antarayat dan tidak menambahkan rumusan yang tidak diulang dalam ayat ini.
translation_notes:
  register: Bahasa hukum yang lugas, modern, dan bermartabat. “Lembu” dipakai untuk menjaga kesinambungan dengan konteks hukum tentang hewan tersebut; susunan kalimat dibuat alami dalam bahasa Indonesia sambil mempertahankan bentuk pasif dan hubungan dengan ayat sebelumnya.
