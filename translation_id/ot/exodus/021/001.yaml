  naturalness: “Inilah ketetapan-ketetapan hukum yang harus kautetapkan di hadapan mereka” dapat dipahami, tetapi terdengar repetitif dan kurang alami. “Kausampaikan kepada mereka” merupakan bahasa Indonesia baku yang jelas untuk tindakan penyajian hukum kepada umat.
  terminology: “Ketetapan-ketetapan hukum” merupakan padanan yang dapat dipertahankan untuk הַמִּשְׁפָּטִים, dengan nuansa ketentuan/putusan hukum. Catatan kaki perlu diselaraskan agar alternatif dan penjelasannya tidak mencampurkan “ketetapan” dengan “perkara” secara kurang tepat.
