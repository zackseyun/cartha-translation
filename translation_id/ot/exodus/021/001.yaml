  text: Inilah ketetapan-ketetapan hukum yang harus kausampaikan kepada mereka:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keputusan-keputusan hukum”, “peraturan-peraturan”, atau “hukum-hukum”. Istilah Ibrani ini mengacu pada putusan, ketentuan, atau aturan hukum.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: Inilah
  rationale: Bentuk ini secara alami memperkenalkan bagian hukum yang menyusul sekaligus mempertahankan kaitannya dengan konteks sebelumnya, tanpa menambahkan penanda waktu seperti “sekarang”.
- source_word: הַ/מִּשְׁפָּטִים
  choice: ketetapan-ketetapan hukum
  rationale: מִשְׁפָּטִים dalam konteks ini menunjuk pada putusan, ketetapan, atau kaidah hukum. Ungkapan ini mempertahankan nuansa yuridisnya dan lebih jelas bagi pembaca Indonesia modern daripada “penghakiman-penghakiman”.
- source_word: אֲשֶׁר
  choice: yang
  rationale: Padanan alami bagi kata penghubung relatif Ibrani.
- source_word: תָּשִׂים
  choice: harus kautetapkan
  rationale: Kata שׂוּם berarti menaruh atau menempatkan; dalam konteks penyampaian hukum, “menetapkan” menyampaikan tindakan menghadapkan ketentuan itu kepada umat, sedangkan “harus” mengungkapkan daya instruktif bentuk verba tersebut.
- source_word: לִ/פְנֵי/הֶם
  choice: di hadapan mereka
  rationale: Ungkapan לִפְנֵי secara harfiah dan idiomatis berarti “di hadapan”; di sini maksudnya hukum-hukum itu disampaikan kepada umat.
theological_decisions:
- issue: Makna מִשְׁפָּטִים dalam konteks hukum perjanjian
  choice: ketetapan-ketetapan hukum
  alternative: keputusan-keputusan hukum; peraturan-peraturan; hukum-hukum
  rationale: Pilihan ini menjaga nuansa hukum-yudisial istilah Ibrani tanpa membatasinya hanya pada vonis pengadilan atau meratakannya menjadi hukum secara umum. Persoalannya terutama bersifat leksikal dan genre, bukan penetapan ajaran tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “kautetapkan” menjaga sapaan orang kedua tunggal kepada Musa. Tanda titik dua dipertahankan karena ayat ini menjadi pengantar bagi rangkaian hukum berikutnya.
