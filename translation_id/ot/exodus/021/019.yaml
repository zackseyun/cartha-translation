base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/019.yaml
  text: If he gets up and walks about outside on his staff[a], then the one who struck him shall be cleared[c][b]; he must only pay for his lost time and have him thoroughly healed.
translation:
  language: id
  text: Jika ia dapat bangun dan berjalan-jalan di luar dengan bertumpu pada tongkatnya[a], orang yang memukulnya tidak akan dihukum; tetapi ia harus membayar ganti rugi atas kerugian karena orang itu tidak dapat bekerja[b] dan menanggung biaya pengobatannya sampai ia sembuh[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di atas tongkatnya”; maksudnya, ia sudah dapat berjalan dengan bantuan tongkat sebagai penopang.
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah ganti rugi untuk masa ketika orang yang terluka tidak mampu menjalankan pekerjaannya seperti biasa.
    reason: cultural_note
  - marker: c
    text: Bahasa Ibrani memakai bentuk penegasan yang secara harfiah berarti “mengobati, ia harus mengobati.” Dalam konteks ini, orang yang memukul wajib menanggung pengobatan korban hingga pulih.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יָקוּם
  choice: Jika ia dapat bangun
  rationale: Ungkapan ini menyatakan bahwa orang yang terluka telah pulih secukupnya sehingga mampu bangun; kata 'dapat' membuat implikasi kemampuan itu alami dalam bahasa Indonesia.
- source_word: וְהִתְהַלֵּךְ בַּחוּץ
  choice: dan berjalan-jalan di luar
  rationale: Bentuk Hitpael menggambarkan pergerakan atau berjalan ke sana kemari, sedangkan בַּחוּץ menunjukkan bahwa ia sudah dapat bergerak di luar.
- source_word: עַל מִשְׁעַנְתּוֹ
  choice: dengan bertumpu pada tongkatnya
  rationale: Secara harfiah 'di atas tongkatnya'; terjemahan ini mengungkapkan fungsi tongkat sebagai penopang tanpa menentukan apakah benda itu tongkat biasa atau alat bantu medis modern.
- source_word: וְנִקָּה הַמַּכֶּה
  choice: orang yang memukulnya bebas dari hukuman
  rationale: Dalam konteks hukum, Niphal נקה berarti bebas dari hukuman atau tanggung jawab pidana yang lebih berat, bukan bebas dari semua kewajiban, sebab ayat selanjutnya tetap mewajibkan pembayaran.
- source_word: רַק שִׁבְתּוֹ יִתֵּן
  choice: hanya saja, ia harus membayar ganti rugi atas waktu kerja yang hilang
  rationale: שִׁבְתּוֹ menunjuk masa tidak mampu beraktivitas akibat luka. Dalam hukum cedera, maksud praktisnya ialah kerugian karena tidak dapat bekerja; 'ganti rugi' menyampaikan fungsi נתן dalam konteks pembayaran wajib.
- source_word: וְרַפֹּא יְרַפֵּא
  choice: dan menanggung biaya pengobatannya sampai ia sembuh
  rationale: Infinitif absolut bersama verba finit menegaskan kewajiban untuk memastikan pemulihan. Dalam konteks hukum, pelaku bukan harus mengobati sendiri, melainkan bertanggung jawab atas pengobatan korban; rumusan ini menyampaikan kewajiban tersebut tanpa mengklaim bahwa kesembuhan dapat dijamin secara mutlak.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum tanpa menjadi kaku. 'Tongkat' dipertahankan sebagai istilah umum; 'bebas dari hukuman' dibatasi oleh klausa pembayaran berikutnya. Penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
