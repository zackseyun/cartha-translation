  text: א֣וֹ נוֹדַ֗ע כִּ֠י שׁ֣וֹר נַגָּ֥ח הוּא֙ מִ/תְּמ֣וֹל שִׁלְשֹׁ֔ם וְ/לֹ֥א יִשְׁמְרֶ֖/נּוּ בְּעָלָ֑י/ו שַׁלֵּ֨ם יְשַׁלֵּ֥ם שׁוֹר֙ תַּ֣חַת הַ/שּׁ֔וֹר וְ/הַ/מֵּ֖ת יִֽהְיֶה לּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/036.yaml
  text: Or if it was known that the ox was accustomed to gore from yesterday and the day before[a], and its owner did not keep it in, he must surely pay ox for ox[c][b], and the dead animal will be his.
translation:
  language: id
  text: Atau, jika telah diketahui bahwa sapi itu sebelumnya biasa menanduk[a], tetapi pemiliknya tidak menahannya, ia harus membayar ganti rugi dengan memberikan seekor sapi sebagai pengganti sapi itu, dan bangkainya akan menjadi milik pemilik sapi yang menanduk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari kemarin dan hari sebelumnya,” suatu ungkapan Ibrani yang berarti bahwa sapi itu sudah menunjukkan kebiasaan tersebut sebelumnya.
    reason: cultural_note
lexical_decisions:
- source_word: א֣וֹ
  choice: Atau
  rationale: Mempertahankan daya disjungtif yang memperkenalkan kasus hukum alternatif dari ayat sebelumnya.
- source_word: נוֹדַע כִּי
  choice: jika sudah diketahui bahwa
  rationale: Bentuk pasif נוֹדַע dipertahankan melalui 'sudah diketahui', sedangkan כִּי memperkenalkan isi yang diketahui; 'jika' menyatakan hubungan bersyarat seluruh kasus hukum secara alami dalam bahasa Indonesia.
- source_word: שׁוֹר
  choice: sapi
  rationale: Dalam bahasa Indonesia modern, 'sapi' merupakan padanan umum dan wajar untuk שׁוֹר dalam konteks hukum ini tanpa memaksakan jenis kelamin atau status kebiri yang tidak dinyatakan secara pasti.
- source_word: נַגָּח
  choice: biasa menanduk
  rationale: Menyampaikan sifat atau kebiasaan berbahaya yang sudah berulang, bukan sekadar satu tindakan menanduk.
- source_word: מִתְּמוֹל שִׁלְשֹׁם
  choice: sejak kemarin dan hari sebelumnya
  rationale: Mempertahankan gambaran idiom Ibrani secara cukup harfiah sambil menjelaskan bahwa perilaku itu telah tampak sebelumnya.
- source_word: וְלֹא יִשְׁמְרֶנּוּ
  choice: tetapi pemiliknya tidak menjaganya
  rationale: שמר berarti menjaga atau mengawasi agar hewan yang diketahui berbahaya tidak mencelakakan; 'tetapi' menyatakan kontras implisit secara alami.
- source_word: שַׁלֵּם יְשַׁלֵּם
  choice: ia harus membayar ganti rugi
  rationale: Konstruksi infinitif absolut dan imperfek menyatakan kewajiban pembayaran yang tegas; 'harus' membawa daya hukum tersebut.
- source_word: שׁוֹר תַּחַת הַשּׁוֹר
  choice: dengan memberikan seekor sapi sebagai pengganti sapi itu
  rationale: Mengungkapkan hubungan penggantian yang dinyatakan oleh תַּחַת dengan jelas dan alami dalam bahasa Indonesia.
- source_word: וְהַמֵּת יִהְיֶה לּוֹ
  choice: dan bangkai sapi yang mati itu akan menjadi miliknya
  rationale: הַמֵּת menunjuk pada hewan yang mati; 'bangkai sapi yang mati itu' memperjelas rujukan, sementara pronomina 'miliknya' sengaja dibiarkan mengikuti ambiguitas rujukan Ibrani.
theological_decisions:
- issue: Rujukan pronomina לּוֹ dalam ketentuan tentang bangkai
  choice: miliknya
  alternative: milik pemilik sapi yang menanduk / milik pemilik sapi yang mati
  rationale: Teks Ibrani memakai pronomina tunggal tanpa menyebut ulang pemilik yang dimaksud. Terjemahan utama tidak menyelesaikan ambiguitas itu secara diam-diam; catatan kaki menyebutkan dua kemungkinan rujukannya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat dengan nuansa ketentuan hukum. Istilah 'sapi' dipilih daripada 'lembu' agar mudah dipahami pembaca umum; idiom waktu Ibrani dipertahankan dalam teks dan dijelaskan melalui catatan kaki.
