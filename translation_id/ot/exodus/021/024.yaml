  text: eye for eye[a], tooth for tooth, hand for hand, foot for foot.
translation:
  language: id
  text: mata ganti mata[a], gigi ganti gigi, tangan ganti tangan, kaki ganti kaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mata sebagai ganti mata, gigi sebagai ganti gigi, tangan sebagai ganti tangan, kaki sebagai ganti kaki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עַיִן
  choice: mata
  rationale: Nomina ini menunjuk pada mata secara fisik. Bentuk tanpa artikel mempertahankan rumusan hukum Ibrani yang ringkas dan sejajar.
- source_word: תַּחַת
  choice: ganti
  rationale: Dalam konteks hukum ini, kata tersebut menyatakan penggantian atau balasan yang sepadan, bukan makna spasial 'di bawah'. 'Ganti' menghasilkan rumusan Indonesia yang ringkas tanpa menjelaskan lebih jauh daripada teks sumber.
- source_word: שֵׁן
  choice: gigi
  rationale: Kata ini berarti 'gigi' dan mempertahankan kesejajaran formula hukum.
- source_word: יָד
  choice: tangan
  rationale: Makna lazimnya ialah anggota tubuh fisik, 'tangan'; pilihan ini mempertahankan korespondensi leksikal dan irama ayat.
- source_word: רֶגֶל
  choice: kaki
  rationale: Kata ini dapat menunjuk pada kaki atau bagian bawah tungkai. 'Kaki' merupakan padanan Indonesia yang alami dan tepat dalam rangkaian anggota tubuh ini.
theological_decisions:
- issue: Sifat rumusan hukum
  choice: 'Rumusan singkat tentang balasan atau penggantian yang sepadan: ''mata ganti mata ... kaki ganti kaki''.'
  alternative: Parafrasa interpretatif seperti 'hukuman harus setimpal dengan cedera'.
  rationale: Teks Ibrani hanya memasangkan nama-nama anggota tubuh dengan תַּחַת. Mempertahankan formula padat ini menghindari penambahan penafsiran mengenai bentuk pelaksanaan hukumnya.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Formula tanpa artikel mempertahankan paralelisme dan kepadatan gaya hukum sumber.
