base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/032.yaml
  text: If the ox gores a male servant or a female servant[a], he shall give thirty shekels of silver to his master, and the ox shall be stoned.
translation:
  language: id
  text: Jika sapi itu menanduk seorang budak laki-laki atau budak perempuan, pemilik sapi itu harus memberikan tiga puluh syikal perak kepada tuan budak itu, dan sapi itu harus dirajam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֶבֶד
  choice: budak laki-laki
  rationale: Dalam konteks hukum ini, istilah tersebut menunjukkan status perbudakan dan berbentuk maskulin; padanan ini mempertahankan keduanya.
- source_word: אָמָה
  choice: budak perempuan
  rationale: Istilah ini dipasangkan dengan עֶבֶד dan secara khusus menunjuk kepada budak berjenis kelamin perempuan.
- source_word: יִגַּח
  choice: menanduk
  rationale: Dalam hukum mengenai sapi, verba נגח secara khusus berarti menyerang dengan tanduk.
- source_word: כֶּסֶף שְׁלֹשִׁים שְׁקָלִים
  choice: tiga puluh syikal perak
  rationale: Frasa ini menyatakan jumlah ganti rugi berupa perak yang ditimbang menurut satuan syikal.
- source_word: יִתֵּן
  choice: harus memberikan
  rationale: Bentuk imperfek dalam hukum kasuistik ini menyatakan kewajiban hukum; 'harus' terdengar alami dan tegas dalam bahasa Indonesia modern.
- source_word: לַאדֹנָיו
  choice: kepada tuan budak itu
  rationale: Pronomina akhiran paling wajar merujuk kepada budak yang baru disebut. Penyebutan eksplisit menghindari ambiguitas pronomina bahasa Indonesia antara pemilik sapi dan tuan budak.
- source_word: יִסָּקֵל
  choice: harus dirajam
  rationale: Bentuk Nifal dari סקל menyatakan hukuman mati dengan pelemparan batu; bentuk ringkas ini mengikuti teks Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa hukum yang lugas, bermartabat, dan mudah dipahami. 'Budak' dipilih daripada 'hamba' agar realitas status sosial-hukum dalam teks tidak diperhalus. Subjek tersirat pada יִתֵּן diperjelas sebagai 'pemilik sapi itu' berdasarkan konteks hukum sebelumnya, sedangkan referen לַאדֹנָיו diperjelas sebagai 'tuan budak itu' untuk mencegah salah rujuk.
