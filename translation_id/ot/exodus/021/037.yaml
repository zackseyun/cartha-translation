base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/037.yaml
  text: If a man steals an ox or a sheep and slaughters it or sells it[b][a], he shall repay five cattle for the ox and four sheep for the sheep.
translation:
  language: id
  text: Jika seorang laki-laki mencuri seekor sapi atau seekor ternak kecil[a], lalu menyembelihnya atau menjualnya, ia harus membayar ganti rugi lima ekor sapi sebagai ganti sapi itu dan empat ekor ternak kecil sebagai ganti ternak kecil itu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini dapat menunjuk seekor domba atau kambing.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, ternak kecil; istilah Ibrani ini mencakup domba dan kambing.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Jika
  rationale: Memperkenalkan syarat dalam rumusan hukum kasuistik; 'jika' alami dan tepat dalam bahasa hukum Indonesia.
- source_word: יִגְנֹב
  choice: mencuri
  rationale: Padanan langsung dan lazim untuk גנב dalam konteks hukum.
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Mempertahankan bentuk maskulin tunggal yang eksplisit dalam teks Ibrani, dengan fungsi representatif dalam rumusan hukum.
- source_word: שׁוֹר
  choice: seekor sapi
  rationale: שׁוֹר menunjuk satu ekor hewan sapi; 'sapi' merupakan istilah modern yang wajar tanpa mempersempitnya secara tidak perlu menjadi sapi jantan atau sapi kebiri.
- source_word: שֶׂה
  choice: seekor kambing domba
  rationale: שֶׂה dapat menunjuk satu ekor ternak kecil, baik domba maupun kambing; 'kambing domba' mempertahankan keluasan makna tersebut.
- source_word: וּטְבָחוֹ
  choice: lalu menyembelihnya
  rationale: טבח secara khusus berarti menyembelih atau menjagal, bukan sekadar membunuh; 'lalu' menyampaikan kelanjutan tindakan dalam syarat hukum.
- source_word: מְכָרוֹ
  choice: atau menjualnya
  rationale: Padanan langsung untuk מכר dengan sufiks objek tunggal.
- source_word: חֲמִשָּׁה בָקָר
  choice: lima ekor sapi
  rationale: בקר adalah sebutan kolektif bagi ternak sapi; penggolong 'ekor' membuat jumlahnya alami dan jelas dalam bahasa Indonesia.
- source_word: יְשַׁלֵּם
  choice: ia harus mengganti
  rationale: Dalam konteks hukum, שלם menyatakan pembayaran ganti rugi atau restitusi; 'harus mengganti' menyampaikan kewajiban dan sifat restitutifnya dengan jelas.
- source_word: תַּחַת
  choice: dengan
  rationale: Dalam konstruksi ini תַּחַת menyatakan penggantian atau imbalan sebagai ganti hewan yang dicuri; struktur 'mengganti X dengan Y' alami dalam bahasa Indonesia.
- source_word: וְאַרְבַּע צֹאן
  choice: empat ekor kambing domba
  rationale: צֹאן adalah istilah kolektif untuk ternak kecil, khususnya domba dan kambing; terjemahan ini mempertahankan cakupan leksikal aslinya.
