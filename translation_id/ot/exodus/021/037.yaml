revisions:
- from: Jika seorang laki-laki mencuri seekor sapi atau seekor kambing domba[a], lalu menyembelih atau menjualnya, ia harus mengganti sapi itu dengan lima ekor sapi dan kambing domba itu dengan empat ekor kambing domba[b].
  to: Jika seorang laki-laki mencuri seekor sapi atau seekor ternak kecil[a], lalu menyembelihnya atau menjualnya, ia harus membayar ganti rugi lima ekor sapi sebagai ganti sapi itu dan empat ekor ternak kecil sebagai ganti ternak kecil itu[b].
  rationale: Revisi mengganti “kambing domba” dengan “ternak kecil” untuk menghindari istilah yang tidak alami sambil mempertahankan ambiguitas leksikal Ibrani. Rumusan restitusi juga diperjelas dengan “membayar ganti rugi ... sebagai ganti ...”, tanpa mengubah jumlah atau kategori hewan.
