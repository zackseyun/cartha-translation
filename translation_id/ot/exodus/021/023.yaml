  yaml_path: translation/ot/exodus/021/023.yaml
  text: But if there is harm[a], then you shall give life for life.
translation:
  language: id
  text: Namun, jika terjadi bahaya[a], engkau harus memberikan nyawa ganti nyawa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “cedera berat” atau “kematian”; istilah Ibrani ini dapat berarti bahaya berat atau bencana, dan para penafsir berbeda pendapat apakah konteksnya menunjuk pada cedera secara umum atau khususnya kematian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Menandai syarat yang berlawanan dengan keadaan pada ayat sebelumnya; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya adversatif konteks.
- source_word: אָסוֹן
  choice: celaka
  rationale: Kata benda ini dapat menunjuk pada kemalangan, cedera berat, atau akibat fatal. 'Celaka' mempertahankan keluasan maknanya tanpa menentukan jenis, sasaran, atau tingkat akibat secara berlebihan.
- source_word: יִהְיֶה
  choice: terjadi
  rationale: 'Menyampaikan klausa keberadaan atau kejadian secara idiomatis: celaka itu ada atau terjadi.'
- source_word: וְנָתַתָּה
  choice: engkau harus memberikan
  rationale: Mempertahankan arti dasar נתן, 'memberikan', serta daya kewajiban dalam rumusan hukum; 'membayar' dapat terlalu mengarah pada ganti rugi berupa uang.
- source_word: נֶפֶשׁ
  choice: nyawa
  rationale: Dalam rumusan hukum ini, נֶפֶשׁ berarti hidup atau nyawa, bukan 'jiwa' sebagai unsur abstrak manusia.
- source_word: תַּחַת
  choice: ganti
  rationale: Menandai penggantian atau kesepadanan dalam rumusan hukum pembalasan; 'ganti' ringkas dan wajar dalam frasa Indonesia 'nyawa ganti nyawa'.
- source_word: נָפֶשׁ
  choice: nyawa
  rationale: Pengulangan dipertahankan untuk mencerminkan simetri leksikal dan hukum dalam teks Ibrani.
theological_decisions:
- issue: Cakupan celaka yang dinyatakan oleh אָסוֹן dalam hukum ini
  choice: Diterjemahkan secara luas sebagai 'celaka' tanpa menentukan apakah yang dimaksud ialah cedera berat atau kematian, dan tanpa menetapkan siapa yang terkena.
  alternative: Diterjemahkan sebagai 'cedera berat' atau 'kematian'.
  rationale: Ayat ini sendiri tidak mempersempit sasaran maupun tingkat akibat dari אָסוֹן. Pilihan yang luas mempertahankan ambiguitas dan ketegangan penafsiran dalam konteks hukum tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada hukum. 'Nyawa ganti nyawa' mempertahankan kesejajaran rumusan Ibrani, sedangkan 'celaka' dipilih untuk menjaga ambiguitas leksikal asli.
