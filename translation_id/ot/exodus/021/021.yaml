  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַ֥ךְ אִם י֛וֹם א֥וֹ יוֹמַ֖יִם יַעֲמֹ֑ד לֹ֣א יֻקַּ֔ם כִּ֥י כַסְפּ֖/וֹ הֽוּא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/021.yaml
  text: However[a], if he survives for a day or two, he shall not be avenged[b], for he is his money.
translation:
  language: id
  text: Namun, jika budak itu bertahan hidup selama satu atau dua hari, tidak boleh ada pembalasan[a], sebab ia adalah uang milik tuannya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pembalasan hukum tidak akan dituntut.” Kata Ibrani di sini secara khusus berbicara tentang pembalasan atau retribusi hukum, bukan sekadar hukuman secara umum.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “sebab ia adalah uangnya.” Ungkapan ini menyatakan nilai ekonomi budak itu bagi tuannya.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Namun
  rationale: Menandai pengecualian atau pembatasan terhadap ketentuan pada ayat sebelumnya dengan penghubung adversatif yang wajar dalam bahasa Indonesia.
- source_word: יוֹם א֥וֹ יוֹמַיִם
  choice: selama satu atau dua hari
  rationale: Mengungkapkan rentang waktu singkat yang dimaksud oleh ungkapan Ibrani secara jelas dan alami.
- source_word: יַעֲמֹד
  choice: bertahan hidup
  rationale: Secara harfiah berarti 'berdiri' atau 'tetap berdiri', tetapi dalam perkara hukum ini menunjuk pada tetap hidup sesudah dipukul, bukan pada pulih sepenuhnya.
- source_word: לֹא יֻקַּם
  choice: tidak boleh ada pembalasan
  rationale: Bentuk pasif dari נקם berbicara tentang pembalasan atau retribusi hukum. Rumusan impersonal ini alami dalam bahasa hukum Indonesia dan tidak memaksakan referen pronominal yang tidak dinyatakan secara eksplisit dalam klausa.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi ketentuan hukum tersebut.
- source_word: כַסְפּוֹ הוּא
  choice: ia adalah uang milik tuannya
  rationale: Mempertahankan metafora ekonomi yang keras dalam bahasa Ibrani, yakni bahwa budak tersebut mewakili nilai uang bagi tuannya, tanpa melunakkannya menjadi sekadar 'milik' atau 'kerugian'.
theological_decisions:
- issue: Alasan ekonomi dalam hukum tentang perbudakan
  choice: Mempertahankan ungkapan keras 'ia adalah uang milik tuannya'.
  alternative: sebab ia adalah milik tuannya; sebab tuannya sendiri menanggung kerugian
  rationale: Teks Ibrani secara terang memakai kata 'uang/perak'. Terjemahan tidak boleh menghaluskan ketegangan etis teks atau mengganti alasan yang diberikan teks dengan penjelasan yang lebih lunak.
- issue: Bentuk retribusi hukum
  choice: tidak boleh ada pembalasan
  alternative: ia tidak boleh dihukum; ia tidak akan dihukum mati
  rationale: נקם lebih khusus menunjuk pada pembalasan atau retribusi daripada hukuman secara umum, sedangkan 'dihukum mati' mempersempit makna melampaui yang dinyatakan teks.
- issue: Referen pelaku yang dipukul
  choice: Menyebut 'budak itu' pada awal klausa lalu memakai 'ia'.
  alternative: Memakai pronomina saja tanpa menyebut ulang referennya
  rationale: Bahasa Indonesia memerlukan referen yang jelas karena ayat ini bergantung pada perkara yang dimulai dalam ayat sebelumnya. Penyebutan ini menjelaskan kesinambungan tanpa mengubah kasus gramatikal maskulin tunggal dalam sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas dengan corak hukum yang tetap dapat dipahami pembaca umum. Kata 'budak' dipakai untuk memperjelas referen dari konteks ayat sebelumnya; alasan ekonomi yang keras sengaja dipertahankan. Penanda catatan kaki ditempatkan tepat sesudah frasa yang dijelaskannya.
