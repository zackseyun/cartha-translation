  yaml_path: translation/ot/exodus/021/009.yaml
  text: But if he designates her for his son[a], he shall deal with her according to the rights of daughters.
translation:
  language: id
  text: Namun, jika tuannya menetapkan perempuan itu bagi anak laki-lakinya, ia harus memperlakukannya sesuai dengan hak-hak para anak perempuan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sesuai dengan ketentuan yang berlaku bagi anak-anak perempuan.” Frasa Ibrani ini dapat menunjuk pada hak menurut hukum atau tata cara yang telah ditetapkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Memperkenalkan kasus bersyarat yang berlawanan dengan kemungkinan pada ayat sebelumnya; bentuk ini alami dalam bahasa hukum Indonesia.
- source_word: לִבְנוֹ
  choice: bagi anak laki-lakinya
  rationale: Preposisi ל menunjukkan bahwa perempuan itu ditetapkan untuk suatu hubungan perkawinan dengan anak laki-laki sang tuan; 'bagi' mempertahankan nuansa penetapan tanpa terdengar seolah-olah ia sekadar diserahkan kepadanya.
- source_word: יִיעָדֶנָּה
  choice: menetapkan perempuan itu
  rationale: Kata kerja יעד di sini menunjuk pada penetapan untuk hubungan perkawinan. 'Menetapkan' mempertahankan corak hukum tanpa mempersempit maknanya menjadi tindakan pertunangan tertentu.
- source_word: כְּמִשְׁפַּט הַבָּנוֹת
  choice: sesuai dengan hak anak perempuan
  rationale: מִשְׁפָּט dalam konteks hukum dapat berarti ketentuan atau hak yang semestinya diterima. Bentuk kolektif Indonesia tanpa pengulangan kata secara alami menyampaikan kelas 'anak-anak perempuan'.
- source_word: יַעֲשֶׂה לָּהּ
  choice: ia harus memperlakukannya
  rationale: Ungkapan עשה + ל menyatakan tindakan terhadap seseorang. 'Harus memperlakukannya' jelas, wajar, dan mencerminkan kewajiban hukum.
theological_decisions:
- issue: Sifat kewajiban terhadap perempuan yang ditetapkan bagi anak laki-laki sang tuan
  choice: Ia wajib diperlakukan menurut hak yang berlaku bagi anak perempuan.
  alternative: Frasa itu dapat menunjuk pada tata cara atau kebiasaan yang berlaku bagi anak perempuan, khususnya dalam pengaturan perkawinan.
  rationale: Makna yuridis מִשְׁפָּט kuat dalam konteks kumpulan hukum ini, tetapi cakupannya tidak dijabarkan dalam ayat. Terjemahan utama mempertahankan penekanan pada hak, sementara catatan menjaga kemungkinan nuansa tata cara yang telah ditetapkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Tuannya' ditambahkan sebagai subjek tersirat dari konteks langsung agar rujukan 'ia' tidak rancu dalam bahasa Indonesia; kata tersebut tidak menambah pelaku baru. Susunan tetap ringkas dan bercorak hukum.
