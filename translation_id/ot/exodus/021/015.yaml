translation:
  language: id
  text: Siapa pun yang memukul ayahnya atau ibunya pasti akan dihukum mati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani memakai kata “dan” pada frasa “ayahnya dan ibunya”; di sini diterjemahkan “atau” karena hukum ini berlaku bila seseorang memukul salah satu dari kedua orang tuanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכֵּה
  choice: memukul
  rationale: Bentuk partisip dari נכה menunjuk pada orang yang melakukan tindakan memukul. 'Memukul' jelas dan alami dalam bahasa Indonesia serta tidak melebihkan tingkat kekerasan seperti 'menghajar'.
- source_word: אָבִיו
  choice: ayahnya
  rationale: Teks Ibrani secara khusus menyebut ayah dalam bentuk tunggal dengan sufiks kepunyaan orang ketiga.
- source_word: אִמּוֹ
  choice: ibunya
  rationale: Teks Ibrani secara khusus menyebut ibu dalam bentuk tunggal dengan sufiks kepunyaan orang ketiga.
- source_word: מוֹת יוּמָת
  choice: harus dihukum mati
  rationale: Gabungan infinitif absolut dan verba finit ini merupakan rumusan hukum yang menegaskan hukuman mati. Bentuk pasif 'dihukum mati' mempertahankan nuansa pelaksanaan hukuman secara yudisial.
- source_word: וּ / וְ
  choice: atau
  rationale: Walaupun konjungsi Ibraninya secara harfiah berarti 'dan', dalam rumusan hukum ini yang dimaksud ialah memukul salah satu dari kedua orang tua; 'atau' mencegah kesan keliru bahwa keduanya harus dipukul sekaligus.
theological_decisions:
- issue: Rumusan hukuman hukum
  choice: harus dihukum mati
  alternative: pasti akan dihukum mati; harus mati
  rationale: Pilihan ini menyampaikan kewajiban hukuman yudisial dan mempertahankan bentuk pasif teks, bukan sekadar menyatakan bahwa pelaku akan mati.
- issue: Hubungan antara ayah dan ibu
  choice: ayahnya atau ibunya
  alternative: ayahnya dan ibunya
  rationale: Konteks hukum mencakup tindakan terhadap salah satu orang tua. Terjemahan 'atau' mempertahankan cakupan hukum tanpa menyiratkan bahwa pelaku baru terkena hukuman jika memukul keduanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada hukum. 'Siapa pun' dipakai sebagai pembuka umum yang alami; 'ayah' dan 'ibu' mempertahankan penyebutan spesifik dalam teks sumber.
