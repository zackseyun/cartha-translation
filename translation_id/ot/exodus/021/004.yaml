base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/004.yaml
  text: If his master gives him a wife and she bears him sons or daughters[a], the wife and her children shall belong to her master[b], and he shall go out by himself.
translation:
  language: id
  text: Jika tuannya memberikan seorang istri kepadanya, dan istri itu melahirkan anak laki-laki atau anak perempuan baginya, istri itu dan anak-anaknya akan menjadi milik tuannya; ia akan keluar seorang diri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maksudnya, ia pergi tanpa istri dan anak-anak yang diberikan kepadanya selama masa pengabdiannya.
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Mempertahankan bentuk syarat yang lazim dalam rumusan hukum kasuistis.
- source_word: אֲדֹנָיו
  choice: tuannya
  rationale: Dalam konteks hukum perbudakan, 'tuan' menyatakan hubungan kewenangan tanpa nuansa gelar ilahi yang dapat timbul dari pilihan lain.
- source_word: יִתֶּן לוֹ אִשָּׁה
  choice: memberikan seorang istri kepadanya
  rationale: אִשָּׁה dapat berarti 'perempuan' atau 'istri'; konteks hubungan yang menghasilkan anak mendukung arti 'istri'.
- source_word: וְיָלְדָה לוֹ
  choice: istri itu melahirkan baginya
  rationale: Mencerminkan verba 'melahirkan' serta objek tak langsung לוֹ tanpa menambahkan gagasan yang tidak dinyatakan.
- source_word: בָנִים אוֹ בָנוֹת
  choice: anak-anak lelaki atau perempuan
  rationale: Mempertahankan penyebutan eksplisit kedua jenis kelamin dalam teks Ibrani.
- source_word: הָאִשָּׁה וִילָדֶיהָ
  choice: istri itu beserta anak-anaknya
  rationale: Konsisten dengan pemaknaan אִשָּׁה sebelumnya dan menyatakan bahwa ibu serta anak-anak termasuk bersama-sama.
- source_word: תִּהְיֶה לַאדֹנֶיהָ
  choice: akan menjadi milik tuan perempuan itu
  rationale: Konstruksi dengan לְ menyatakan status kepemilikan hukum; frasa 'tuan perempuan itu' juga mempertahankan rujukan pronomina feminin Ibrani secara jelas.
- source_word: וְהוּא יֵצֵא בְגַפּוֹ
  choice: sedangkan laki-laki itu harus keluar sendirian
  rationale: יצא diterjemahkan secara langsung sebagai 'keluar', sementara idiom בְגַפּוֹ berarti tanpa pendamping. 'Sedangkan' memperjelas kontras yang dinyatakan oleh waw tanpa mengubah isinya.
theological_decisions:
- issue: Istilah perbudakan dan kepemilikan dalam ketentuan hukum
  choice: Memakai 'tuan' dan secara terbuka menyatakan 'menjadi milik'.
  alternative: Melunakkan hubungan itu dengan istilah seperti 'majikan', 'pekerja', atau 'tetap bersama'.
  rationale: Ayat ini mengatur status hukum dalam lembaga perbudakan. Terjemahan perlu mencerminkan kenyataan hukum dalam teks tanpa melunakkannya atau menambahkan penilaian teologis dan moral yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur hukum bersyarat dipertahankan, dengan rujukan pronomina diperjelas agar tidak rancu. Istilah 'keluar' mempertahankan citra bahasa sumber, sedangkan catatan kaki menjelaskan akibat praktisnya.
