  text: If a ransom is imposed on him[a], then he shall give the redemption price for his life according to all that is imposed on him.
translation:
  language: id
  text: Jika uang tebusan dibebankan kepadanya[a], ia harus membayar harga penebusan nyawanya sesuai dengan segala yang ditetapkan atasnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, “Jika pembayaran tebusan ditetapkan atasnya ... ia harus membayar tebusan untuk nyawanya.” Bahasa Ibrani memakai dua istilah yang berkaitan tetapi berbeda: כֹּפֶר (uang tebusan) dan פִּדְיֹן (harga penebusan).'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Menandai syarat dalam kelanjutan hukum sebelumnya; bentuk kondisional ini paling langsung dan alami.
- source_word: כֹּפֶר
  choice: uang tebusan
  rationale: Menunjuk pada pembayaran untuk membebaskan seseorang dari hukuman; pilihan ini mempertahankan corak hukum tanpa memasukkan makna ritual.
- source_word: יוּשַׁת עָלָיו
  choice: dibebankan kepadanya
  rationale: Bentuk pasif שׁית dengan עַל menyatakan kewajiban hukum yang ditetapkan atas seseorang.
- source_word: וְנָתַן
  choice: ia harus membayar
  rationale: Dalam rumusan hukum, bentuk ini menyatakan konsekuensi yang wajib dilaksanakan; 'membayar' lebih alami untuk sejumlah uang daripada terjemahan harfiah 'memberikan'.
- source_word: פִּדְיֹן נַפְשׁוֹ
  choice: harga penebus bagi nyawanya
  rationale: Mempertahankan perbedaan leksikal antara פִּדְיֹן dan כֹּפֶר, sekaligus menyatakan bahwa pembayaran itu membebaskan nyawanya dari hukuman.
- source_word: נַפְשׁוֹ
  choice: nyawanya
  rationale: Dalam konteks peradilan dengan ancaman hukuman mati, נֶפֶשׁ menunjuk pada nyawa, bukan pada jiwa sebagai unsur nonjasmani.
- source_word: כְּכֹל אֲשֶׁר יוּשַׁת עָלָיו
  choice: sesuai dengan seluruh jumlah yang dibebankan kepadanya
  rationale: Menyampaikan tuntutan untuk membayar sepenuhnya menurut besaran yang ditetapkan; 'jumlah' tersirat jelas dari konteks pembayaran.
theological_decisions:
- issue: Sifat pembayaran dalam perkara dengan ancaman hukuman mati
  choice: Menggunakan 'uang tebusan' dan 'harga penebus' sebagai istilah hukum yang berbeda tetapi berkaitan.
  alternative: Menyederhanakan keduanya menjadi 'denda', atau memakai istilah pendamaian ritual yang lebih kuat.
  rationale: Bahasa Ibrani menggambarkan pembayaran yang melepaskan nyawa orang itu dari hukuman yang semestinya berlaku. Terjemahan mempertahankan nuansa hukum-penebusan tanpa menyiratkan bahwa ia tidak bersalah atau bahwa pembayaran tersebut merupakan kurban pendamaian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum secara wajar. 'Nyawa' dipilih daripada 'jiwa' agar makna konkret dalam konteks hukuman mati jelas; perbedaan dua istilah Ibrani untuk pembayaran tebusan dipertahankan dalam teks dan dijelaskan dalam catatan kaki.
