  yaml_path: translation/ot/exodus/021/018.yaml
  text: If men quarrel and one strikes his neighbor with a stone or with his fist[a], and he does not die but is confined to bed,
translation:
  language: id
  text: Jika dua orang laki-laki bertengkar dan salah seorang memukul yang lain dengan batu atau dengan kepalan tangan, dan yang dipukul itu tidak mati tetapi terbaring di tempat tidur,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jatuh ke tempat tidur,” yaitu terbaring karena cedera.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Jika
  rationale: Memperkenalkan suatu kasus hukum; 'jika' wajar dalam rumusan hukum kasuistis dan mempertahankan sifat bersyaratnya.
- source_word: יְרִיבֻן אֲנָשִׁים
  choice: beberapa laki-laki bertengkar
  rationale: ריב menyatakan pertengkaran atau perselisihan yang dapat meningkat menjadi kekerasan; אֲנָשִׁים dalam kasus ini menunjuk kepada pihak-pihak laki-laki.
- source_word: וְהִכָּה אִישׁ אֶת רֵעֵהוּ
  choice: lalu yang seorang memukul sesamanya
  rationale: Ungkapan ini membedakan salah seorang dari para pihak dan רֵעֵהוּ secara alami berarti orang lain yang berhadapan dengannya; 'sesamanya' tetap dekat dengan relasi interpersonal tanpa mengharuskan arti sahabat.
- source_word: בְּאֶבֶן אוֹ בְאֶגְרֹף
  choice: dengan batu atau dengan tinjunya
  rationale: Prefiks בְּ bersifat instrumental. אֶגְרֹף lazim dipahami sebagai 'tinju'; akhiran posesif ditambahkan secara idiomatis dalam bahasa Indonesia.
- source_word: וְלֹא יָמוּת
  choice: dan orang itu tidak mati
  rationale: Subjek korban dibuat eksplisit agar rujukannya jelas dalam bahasa Indonesia, sambil mempertahankan koordinasi Ibrani.
- source_word: וְנָפַל לְמִשְׁכָּב
  choice: tetapi harus terbaring di tempat tidur
  rationale: Secara harfiah berarti 'jatuh ke tempat tidur' dan dalam konteks cedera berarti terpaksa berbaring atau terbaring sakit. 'Harus terbaring' menyampaikan akibat cedera secara alami tanpa menyatakan kelumpuhan permanen.
