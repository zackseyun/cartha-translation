lexical_decisions:
- source_word: בְּגַפּוֹ
  choice: seorang diri
  rationale: Ungkapan Ibrani ini berarti tanpa pendamping atau tanggungan. 'Seorang diri' alami dalam bahasa Indonesia dan mempertahankan pengulangan hukum dalam ayat ini.
- source_word: יָבֹא
  choice: masuk
  rationale: Dalam konteks ini, kata tersebut menunjuk pada masuknya seseorang ke dalam masa pengabdian dan berpasangan langsung dengan 'keluar'.
- source_word: יֵצֵא
  choice: harus keluar
  rationale: Dalam hukum pembebasan ini, kata tersebut berarti keluar dari pengabdian. 'Harus' menyampaikan daya normatif bentuk hukum Ibrani.
- source_word: בַּעַל אִשָּׁה
  choice: sudah beristri
  rationale: Ungkapan harfiahnya 'suami dari seorang istri', tetapi secara idiomatis berarti seorang laki-laki yang telah menikah. 'Sudah beristri' juga menunjukkan bahwa status itu telah ada ketika ia masuk.
- source_word: וְיָצְאָה אִשְׁתּוֹ עִמּוֹ
  choice: istrinya harus keluar bersama dia
  rationale: Kata kerja feminin tunggal bersesuaian dengan 'istrinya'. Terjemahan ini mempertahankan pasangan kata 'masuk–keluar' dan menyatakan bahwa istrinya keluar bersamanya.
