translation:
  language: id
  text: Luka bakar ganti luka bakar, luka ganti luka, lebam[a] ganti lebam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bekas pukulan ganti bekas pukulan”; kata Ibraninya dapat menunjuk pada bilur atau tanda yang ditinggalkan oleh pukulan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּוִיָּה
  choice: luka bakar
  rationale: Nomina ini menunjuk pada luka atau bekas akibat terbakar. “Luka bakar” jelas, alami, dan tidak mempersempit maknanya menjadi cap bakar.
- source_word: תַּחַת
  choice: ganti
  rationale: Dalam rumusan hukum ini, תַּחַת menyatakan kesepadanan atau penggantian. “Ganti” mempertahankan bentuk ringkas dan irama berulang teks Ibrani.
- source_word: פֶּצַע
  choice: luka
  rationale: Kata ini secara konkret menunjuk pada luka tubuh; “luka” merupakan padanan modern yang luas tanpa membatasinya pada sayatan.
- source_word: חַבּוּרָה
  choice: lebam
  rationale: Kata ini menunjuk pada lebam, bilur, atau bekas yang ditinggalkan oleh pukulan. “Lebam” paling mudah dipahami dalam bahasa Indonesia modern, sedangkan alternatifnya dicatat dalam catatan kaki.
