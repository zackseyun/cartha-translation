  text: The owner of the pit shall make restitution[a]; he shall pay money to its owner[b], and the dead animal shall be his.
translation:
  language: id
  text: Pemilik lubang itu harus memberikan ganti rugi; ia harus membayar sejumlah uang kepada pemilik hewan itu, dan hewan yang mati itu menjadi milik pemilik lubang itu.[a]
  philosophy: optimal-equivalence
