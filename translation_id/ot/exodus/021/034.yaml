translation_notes:
  register: Bahasa hukum yang lugas dan bermartabat digunakan dengan bentuk kewajiban 'harus'. 'Ganti rugi' menyampaikan daya yuridis יְשַׁלֵּם, sedangkan frasa berikutnya menjelaskan bahwa ganti rugi itu dibayarkan dalam bentuk uang. Penanda catatan kaki ditempatkan sesudah klausa yang memiliki alternatif terjemahan.
