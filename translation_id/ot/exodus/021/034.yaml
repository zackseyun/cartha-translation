  source_fidelity: Terjemahan dengan tepat menyampaikan kewajiban pemilik lubang untuk memberi ganti rugi berupa uang kepada pemilik hewan serta penetapan hewan mati itu bagi pemilik lubang. Namun, pronomina -nya dalam “menjadi miliknya” dapat secara alami dibaca sebagai merujuk kepada “pemilik hewan itu” yang disebut tepat sebelumnya, padahal לוֹ dalam teks Ibrani merujuk kepada pemilik lubang.
  naturalness: Bahasanya modern, jelas, dan sesuai register hukum. Pengulangan “ganti rugi” dan “membayar sejumlah uang” mencerminkan susunan serta penegasan hukum dalam teks sumber. Menyebut kembali “pemilik lubang itu” pada klausa terakhir menghilangkan ambiguitas rujukan secara alami.
  terminology: “Pemilik lubang,” “ganti rugi,” dan “sejumlah uang” merupakan padanan yang baik untuk בעל הבור, ישלם, dan כסף. “Hewan yang mati” adalah padanan netral yang tepat bagi המת dalam konteks ternak.
