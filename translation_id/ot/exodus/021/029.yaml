  text: וְ/אִ֡ם שׁוֹר֩ נַגָּ֨ח ה֜וּא מִ/תְּמֹ֣ל שִׁלְשֹׁ֗ם וְ/הוּעַ֤ד בִּ/בְעָלָי/ו֙ וְ/לֹ֣א יִשְׁמְרֶ֔/נּוּ וְ/הֵמִ֥ית אִ֖ישׁ א֣וֹ אִשָּׁ֑ה הַ/שּׁוֹר֙ יִסָּקֵ֔ל וְ/גַם בְּעָלָ֖י/ו יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/029.yaml
  text: But if the ox was accustomed to gore from yesterday and the day before[a], and its owner had been warned but did not keep it in, and it kills a man or a woman, the ox shall be stoned[b], and its owner also shall be put to death.
translation:
  language: id
  text: Namun, jika lembu itu sudah biasa menanduk sejak sebelumnya[a], dan pemiliknya telah diperingatkan tetapi tidak mengendalikannya, lalu lembu itu menewaskan seorang laki-laki atau perempuan, lembu itu harus dirajam, dan pemiliknya juga harus dihukum mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sejak kemarin dan hari sebelumnya,” sebuah ungkapan Ibrani yang menunjukkan perilaku yang telah berlangsung dan diketahui sebelumnya.
    reason: cultural_note
lexical_decisions:
- source_word: שׁוֹר
  choice: lembu
  rationale: Istilah ini menunjuk seekor sapi secara umum dalam rumusan hukum kasus; “lembu” alami dan tidak secara tidak perlu menekankan jenis kelamin hewan.
- source_word: נַגָּח
  choice: sudah biasa menanduk
  rationale: Partisip ini menyatakan kebiasaan atau pola berulang, bukan satu kejadian penandukan saja.
- source_word: מִתְּמֹל שִׁלְשֹׁם
  choice: sejak sebelumnya
  rationale: Ungkapan harfiah “sejak kemarin dan hari sebelumnya” merupakan idiom tentang perilaku yang telah terbukti sebelumnya; bentuk idiomatis ini menyampaikan maksud hukumnya, sementara bentuk harfiah dicatat dalam catatan kaki.
- source_word: וְהוּעַד בִּבְעָלָיו
  choice: pemiliknya telah diperingatkan
  rationale: Bentuk pasif ini dalam konteks hukum menunjukkan bahwa pemberitahuan atau peringatan telah diberikan kepada pemilik.
- source_word: וְלֹא יִשְׁמְרֶנּוּ
  choice: tidak menjaganya dengan ketat
  rationale: Kata kerjanya berarti menjaga atau mengawasi; dalam konteks ini maksudnya ialah gagal mengendalikan atau mengurung hewan berbahaya tersebut.
- source_word: וְהֵמִית
  choice: menewaskan
  rationale: Bentuk kausatif menyatakan bahwa lembu itu menyebabkan kematian; “menewaskan” ringkas dan tepat dalam bahasa Indonesia.
- source_word: אִישׁ אֹו אִשָּׁה
  choice: seorang laki-laki atau perempuan
  rationale: Terjemahan mempertahankan penyebutan eksplisit kedua jenis kelamin dalam teks sumber.
- source_word: יִסָּקֵל
  choice: harus dirajam
  rationale: Bentuk pasif ini menetapkan hukuman rajam dalam rumusan hukum.
- source_word: וְגַם בְּעָלָיו יוּמָת
  choice: pemiliknya juga harus dihukum mati
  rationale: Bentuk Hofal dari מות merupakan formula hukum bagi pelaksanaan hukuman mati, bukan sekadar pernyataan bahwa pemilik akan mati.
theological_decisions:
- issue: Daya hukum hukuman bagi pemilik
  choice: pemiliknya juga harus dihukum mati
  alternative: pemiliknya juga akan mati
  rationale: יוּמָת menunjukkan hukuman mati yang dijatuhkan, sehingga terjemahan perlu mempertahankan nuansa yudisial tanpa menentukan cara pelaksanaannya.
- issue: Penyebutan jenis kelamin korban
  choice: seorang laki-laki atau perempuan
  alternative: seseorang
  rationale: Teks Ibrani secara eksplisit menyebut laki-laki dan perempuan; mempertahankannya menghindari penghilangan rincian sumber.
translation_notes:
  register: Bahasa hukum yang modern, lugas, dan bermartabat. “Menjaganya dengan ketat” mempertahankan unsur menjaga dalam kata Ibrani sekaligus memperjelas kewajiban mengendalikan hewan berbahaya. Penanda catatan kaki [a] ditempatkan langsung setelah ungkapan yang dijelaskannya.
