base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/013.yaml
  text: But if he did not lie in wait[a], and God caused it to come into his hand, then I will appoint for you a place to which he may flee.
translation:
  language: id
  text: Namun, jika ia tidak mengadang[a], dan Allah membuatnya terjadi melalui tangannya, Aku akan menetapkan bagimu suatu tempat ke mana ia dapat melarikan diri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, "tidak berbaring menunggu untuk menyerang." Dalam konteks hukum ini, Ibrani menunjuk pada tindakan mengadang atau niat yang direncanakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: Namun, jika
  rationale: Menyatakan kasus bersyarat yang berlawanan dengan pembunuhan sengaja pada ayat sebelumnya; bentuk ini alami dalam bahasa Indonesia.
- source_word: לֹא צָדָה
  choice: tidak mengintainya
  rationale: Dalam konteks hukum, verba ini menunjuk pada tindakan mengadang atau mengintai sebagai unsur kesengajaan, bukan berburu secara harfiah.
- source_word: וְהָאֱלֹהִים
  choice: melainkan Allah
  rationale: אֱלֹהִים paling wajar dipahami sebagai Allah karena klausa ini menggambarkan kejadian di bawah pemeliharaan ilahi, bukan tindakan para hakim.
- source_word: אִנָּה לְיָדוֹ
  choice: membuat hal itu terjadi melalui tangannya
  rationale: Ungkapan ini mempertahankan sebab ilahi sekaligus perantaraan manusia, tanpa mengubah kematian yang tidak direncanakan menjadi pembunuhan sengaja.
- source_word: וְשַׂמְתִּי לְךָ מָקוֹם
  choice: Aku akan menetapkan bagimu suatu tempat
  rationale: Kata 'menetapkan' sesuai dengan tindakan resmi menyediakan tempat perlindungan.
- source_word: אֲשֶׁר יָנוּס שָׁמָּה
  choice: yang dapat menjadi tujuan pelariannya
  rationale: Mengungkapkan gerak menuju tempat perlindungan secara alami dan menjaga sifat izin atau kesempatan yang diberikan oleh ketentuan hukum ini.
theological_decisions:
- issue: Peran Allah dalam kematian yang tidak disengaja
  choice: Allah membuat hal itu terjadi melalui tangannya
  alternative: Allah menyerahkannya ke dalam tangannya; para hakim menyerahkannya ke dalam tangannya
  rationale: Terjemahan ini mempertahankan ketegangan teks bahwa peristiwa tersebut tidak direncanakan oleh pelaku, tetapi tetap ditempatkan di bawah kedaulatan atau pemeliharaan Allah. Teks tidak dijelaskan lebih jauh untuk menetapkan kesalahan moral pada Allah.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Pronomina ilahi 'Aku' ditulis dengan huruf kapital. Susunan kalimat mempertahankan kontras hukum antara pembunuhan berencana dan kematian yang tidak direncanakan.
