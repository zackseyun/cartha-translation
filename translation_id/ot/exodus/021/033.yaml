base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/033.yaml
  text: And if a man opens a pit[a], or if a man digs a pit and does not cover it, and an ox or a donkey falls into it[b],
translation:
  language: id
  text: Jika seseorang[b] membuka sebuah lubang[a], atau jika seseorang menggali sebuah lubang dan tidak menutupinya, lalu seekor lembu atau keledai jatuh ke dalamnya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membuka sebuah lubang yang sudah ada”; kata Ibrani ini secara harfiah berarti “membuka” dan dalam konteks ini dapat menunjuk pada tindakan membuka atau menyingkapkan lubang yang telah ada, bukan menggali lubang baru.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “seseorang” berbentuk maskulin tunggal, tetapi dipakai secara generik dalam rumusan hukum kasuistik.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִי
  choice: Jika
  rationale: Memperkenalkan syarat dalam rumusan hukum kasuistik. Dalam bahasa Indonesia, “Jika” sudah alami pada awal kasus hukum; hubungan dengan hukum sebelumnya dipertahankan oleh konteks.
- source_word: יִפְתַּח
  choice: membuka
  rationale: Menerjemahkan arti dasar verba secara langsung dan mempertahankan pembedaan dengan tindakan menggali pada klausa berikutnya; ini dapat menunjuk pada membuka lubang yang sudah ada.
- source_word: אִישׁ
  choice: seseorang
  rationale: Walaupun bentuk Ibraninya maskulin tunggal, dalam rumusan hukum kasuistik kata ini berfungsi secara generik. “Seseorang” merupakan padanan Indonesia yang alami tanpa mempersempit penerapannya kepada laki-laki.
- source_word: בּוֹר
  choice: sebuah lubang
  rationale: Istilah umum yang sesuai bagi galian terbuka yang membahayakan ternak. “Sumur” atau “perigi” akan terlalu membatasi fungsi lubang tersebut.
- source_word: א֠וֹ כִּי
  choice: atau jika
  rationale: Menandai skenario hukum alternatif yang sejajar dengan klausa pertama.
- source_word: יִכְרֶה
  choice: menggali
  rationale: Padanan lugas dan alami untuk membuat lubang dengan menggali, serta membedakannya dari sekadar membuka lubang yang telah ada.
- source_word: וְ/לֹא יְכַסֶּנּוּ
  choice: dan tidak menutupinya
  rationale: Mengacu pada penutupan fisik lubang sebagai tindakan pencegahan.
- source_word: וְ/נָפַל
  choice: lalu ... jatuh
  rationale: Dalam rangkaian kasuistik, bentuk ini melanjutkan keadaan bersyarat. “Lalu” menyatakan akibat berikutnya secara alami dalam bahasa Indonesia.
- source_word: שָׁמָּה
  choice: ke dalamnya
  rationale: Mengungkapkan arah gerak secara idiomatis; terjemahan harfiah “ke sana” kurang jelas dalam konteks ini.
- source_word: שּׁוֹר
  choice: seekor lembu
  rationale: Padanan umum dan bermartabat bagi ternak sapi dalam konteks hukum, tanpa secara tidak perlu menentukan jenis kelamin atau status kebiri.
- source_word: א֥וֹ חֲמוֹר
  choice: atau keledai
  rationale: Padanan modern yang jelas bagi hewan beban domestik tersebut.
