  register: Bahasa hukum yang lugas dan bermartabat. Istilah "perempuan tersebut" menjaga kejelasan rujukan, sedangkan "harus dibebaskan" mengungkapkan akibat hukum dari keluarnya perempuan itu tanpa menjadikannya tafsiran teologis tambahan.
