  text: And if he does not do these three things for her[a], then she shall go out free, without payment of money.
translation:
  language: id
  text: Jika ia tidak memenuhi ketiga kewajiban itu terhadap perempuan tersebut[a], perempuan itu harus dibebaskan dengan cuma-cuma, tanpa pembayaran uang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak melakukan ketiga hal ini baginya,” yaitu kewajiban mengenai makanan, pakaian, dan hak perkawinan yang disebutkan dalam ayat sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Jika
  rationale: Memperkenalkan syarat yang melanjutkan ketentuan hukum sebelumnya; dalam bahasa Indonesia, "Jika" sudah alami tanpa harus menerjemahkan waw secara terpisah.
- source_word: שְׁלָשׁ אֵלֶּה
  choice: ketiga kewajiban itu
  rationale: Menunjuk kembali pada tiga hal dalam ayat sebelumnya. "Kewajiban" memperjelas fungsi ketiganya dalam konteks hukum tanpa merinci ulang isinya.
- source_word: לֹא יַעֲשֶׂה לָהּ
  choice: tidak memenuhi ... terhadap perempuan tersebut
  rationale: Secara harfiah berarti "tidak melakukan ... baginya"; dalam konteks kewajiban hukum, "memenuhi" merupakan padanan Indonesia yang alami dan tetap mempertahankan rujukan kepada ketiga hal tadi.
- source_word: וְיָצְאָה חִנָּם
  choice: perempuan itu harus dibebaskan
  rationale: יצא dalam hukum perbudakan menunjuk pada keluarnya seseorang dari status terikat, sedangkan חִנָּם menegaskan pembebasan tanpa biaya. Bentuk pasif ini alami dalam bahasa Indonesia dan menyampaikan akibat hukum dengan jelas.
- source_word: אֵין כָּסֶף
  choice: tanpa membayar apa pun
  rationale: Menegaskan bahwa tidak ada uang yang harus dibayarkan untuk pembebasannya; ungkapan ini lebih alami daripada "tanpa uang" dan tidak membatasi alat pembayaran secara tidak perlu.
