  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֤י תִקְנֶה֙ עֶ֣בֶד עִבְרִ֔י שֵׁ֥שׁ שָׁנִ֖ים יַעֲבֹ֑ד וּ/בַ֨/שְּׁבִעִ֔ת יֵצֵ֥א לַֽ/חָפְשִׁ֖י חִנָּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/002.yaml
  text: If you buy a Hebrew servant[a], he shall serve six years, but in the seventh he shall go out free[b], without payment.
translation:
  language: id
  text: Jika[a] engkau membeli seorang budak Ibrani[b], ia harus bekerja selama enam tahun. Namun, pada tahun ketujuh ia harus keluar sebagai orang merdeka, tanpa membayar apa pun.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Apabila”. Partikel Ibrani ini memperkenalkan suatu kasus dalam rumusan hukum dan dapat dipahami sebagai “jika” atau “apabila”.
    reason: lexical_alternative
  - marker: b
    text: Atau “hamba Ibrani”. Kata Ibrani yang dipakai menunjuk kepada orang yang berada di bawah kuasa seorang tuan dan di sini diperoleh melalui pembelian.
    reason: lexical_alternative
  - marker: c
    text: Secara lebih harfiah, “keluar menuju kebebasan dengan cuma-cuma”. Maksudnya, ia tidak perlu membayar untuk memperoleh kebebasannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Jika
  rationale: Partikel ini memperkenalkan ketentuan hukum kasuistik. “Jika” wajar dalam bahasa hukum Indonesia, sedangkan “apabila” juga mungkin.
- source_word: תִקְנֶה
  choice: engkau membeli
  rationale: Bentuk Qal dari קנה berarti membeli atau memperoleh; konteks transaksi mendukung “membeli”.
- source_word: עֶבֶד
  choice: budak
  rationale: Orang tersebut dibeli dan berada dalam ikatan kerja, sehingga “budak” menyatakan status hukumnya dengan lebih terbuka daripada “hamba” atau “pelayan”.
- source_word: עִבְרִי
  choice: Ibrani
  rationale: Menerjemahkan sebutan etnis dalam teks secara langsung tanpa menggantinya dengan istilah yang lebih luas, “Israel”.
- source_word: שֵׁשׁ שָׁנִים יַעֲבֹד
  choice: ia harus bekerja selama enam tahun
  rationale: עבד dapat berarti bekerja atau melayani. “Bekerja” jelas dan alami dalam ketentuan mengenai masa kerja.
- source_word: וּבַשְּׁבִעִת
  choice: Namun, pada tahun ketujuh
  rationale: Kata sambung secara harfiah dapat diterjemahkan “dan”, tetapi di sini menandai kontras antara enam tahun bekerja dan pembebasan pada tahun ketujuh. Kata “tahun” ditambahkan secara wajar dari konteks.
- source_word: יֵצֵא לַחָפְשִׁי
  choice: ia harus keluar sebagai orang merdeka
  rationale: Mempertahankan gambaran harfiah “keluar” sekaligus menyatakan perubahan status menuju kemerdekaan.
- source_word: חִנָּם
  choice: tanpa membayar apa pun
  rationale: Dalam konteks pembebasan, kata ini menunjukkan bahwa ia tidak diwajibkan memberikan pembayaran untuk memperoleh kebebasannya.
theological_decisions:
- issue: Penerjemahan עֶבֶד dalam hukum mengenai perbudakan
  choice: budak
  alternative: hamba; pelayan; pekerja terikat
  rationale: Ayat ini berbicara tentang seseorang yang dibeli dan wajib bekerja selama jangka waktu tertentu. “Budak” tidak memperhalus status keterikatannya, sementara batas enam tahun yang dinyatakan teks tetap dipertahankan.
- issue: Cara menyatakan pembebasan pada tahun ketujuh
  choice: keluar sebagai orang merdeka
  alternative: dibebaskan; keluar menuju kebebasan
  rationale: Pilihan ini mempertahankan bentuk aktif dan metafora keluar dalam bahasa Ibrani tanpa menentukan mekanisme pembebasan yang tidak disebutkan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya hukum yang lugas dan bermartabat. Sapaan tunggal “engkau” dipakai karena verba Ibrani berbentuk orang kedua maskulin tunggal. Istilah “budak” dipertahankan untuk menyatakan realitas status terikat secara transparan.
