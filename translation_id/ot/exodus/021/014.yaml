  yaml_path: translation/ot/exodus/021/014.yaml
  text: But if a man schemes against his neighbor to kill him by treachery[c][b][a], you shall take him even from my altar to die.
translation:
  language: id
  text: Namun, jika seseorang bertindak dengan sengaja terhadap sesamanya untuk membunuhnya dengan tipu daya[a], engkau harus mengambil orang itu dari mezbah-Ku untuk dihukum mati.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bertindak dengan lancang terhadap sesamanya” atau “bertindak secara terencana terhadap sesamanya.” Kata Ibrani ini menyatakan tindakan yang disengaja dan berkemauan tetap; dalam konteks ini, tindakan itu bertujuan membunuh.
    reason: lexical_alternative
  - marker: b
    text: Penyebutan mezbah mengisyaratkan bahwa orang itu mungkin mencari perlindungan di sana; orang yang membunuh dengan sengaja tidak memperoleh perlindungan tersebut.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִי
  choice: Namun, jika
  rationale: Kata penghubung ini memperkenalkan kasus bersyarat yang berlawanan dengan pembunuhan tidak sengaja pada ayat sebelumnya.
- source_word: יָזִד
  choice: dengan sengaja melawan
  rationale: Bentuk Hifil dari זיד menyatakan tindakan yang disengaja, lancang, dan berkemauan tetap. Pilihan ini menjaga unsur kesengajaan tanpa mempersempit maknanya hanya menjadi perencanaan rahasia.
- source_word: אִישׁ
  choice: seseorang
  rationale: Dalam rumusan hukum, nomina maskulin tunggal ini berfungsi secara umum; 'seseorang' terdengar alami dalam bahasa Indonesia modern.
- source_word: עַל רֵעֵ/הוּ
  choice: melawan sesamanya
  rationale: Frasa ini menunjukkan tindakan bermusuhan yang diarahkan kepada orang lain dalam komunitas.
- source_word: לְ/הָרְג/וֹ
  choice: untuk membunuhnya
  rationale: Infinitif הרג berarti menyebabkan kematian. Dalam konteks kesengajaan dan tipu daya, 'membunuh' menyampaikan tindakan itu secara langsung tanpa menambahkan istilah teknis yang tidak terdapat pada kata tersebut sendiri.
- source_word: בְ/עָרְמָה
  choice: dengan tipu daya
  rationale: Nomina ini menunjuk pada kelicikan atau muslihat; 'dengan tipu daya' mempertahankan unsur penipuan dalam tindakan pembunuhan.
- source_word: מֵ/עִם מִזְבְּחִ/י
  choice: dari mezbah-Ku
  rationale: Secara harfiah menunjuk pada pengambilan orang itu dari sisi atau dekat mezbah milik YHWH. Tidak ditambahkan 'bahkan' karena penekanan tersebut tersirat oleh konteks, bukan dinyatakan dengan partikel tersendiri.
- source_word: תִּקָּחֶ/נּוּ
  choice: engkau harus mengambil orang itu
  rationale: Bentuk orang kedua tunggal dalam ketentuan hukum menyampaikan kewajiban; objek diulang sebagai 'orang itu' agar rujukannya jelas dan alami.
- source_word: לָ/מוּת
  choice: untuk dihukum mati
  rationale: Infinitif ini menyatakan tujuan pengambilan orang tersebut, yaitu kematiannya sebagai akibat hukum. Ungkapan Indonesia ini memperjelas konteks eksekusi hukum, bukan kematian kebetulan.
theological_decisions:
- issue: Apakah mezbah memberi perlindungan kepada pembunuh yang bertindak dengan sengaja
  choice: Orang yang membunuh dengan sengaja dan tipu daya harus diambil dari mezbah untuk dihukum mati.
  alternative: Frasa itu hanya menyebut tempat orang tersebut diambil tanpa menyoroti hak perlindungan di mezbah.
  rationale: Konteks hukum dan penyebutan khusus mezbah mengisyaratkan bahwa tempat kudus tidak melindungi pelaku pembunuhan yang disengaja. Teks utama mempertahankan implikasi ini tanpa menguraikannya secara berlebihan.
- issue: Cakupan makna יָזִד
  choice: dengan sengaja melawan
  alternative: merancang kejahatan terhadap; bertindak lancang terhadap
  rationale: Kata itu mencakup tindakan yang disengaja atau lancang, sementara konteks pembunuhan dengan tipu daya memberi nuansa perencanaan. Terjemahan utama mempertahankan cakupan yang lebih luas, dan catatan menyajikan alternatifnya.
translation_notes:
  register: Bahasa hukum yang lugas, modern, dan bermartabat. 'Engkau' mempertahankan sapaan orang kedua tunggal, sedangkan 'seseorang' menyampaikan fungsi umum אִישׁ secara alami. Kapital pada '-Ku' mengikuti konvensi ejaan Indonesia untuk pronomina yang merujuk kepada Allah.
