  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/כִֽי יַכֶּה֩ אִ֨ישׁ אֶת עַבְדּ֜/וֹ א֤וֹ אֶת אֲמָת/וֹ֙ בַּ/שֵּׁ֔בֶט וּ/מֵ֖ת תַּ֣חַת יָד֑/וֹ נָקֹ֖ם יִנָּקֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/020.yaml
  text: And if a man strikes his male servant or his female servant with a rod[a], and the servant dies under his hand, he must surely be avenged.
translation:
  language: id
  text: Jika seseorang memukul budak laki-lakinya atau budak perempuannya dengan tongkat, lalu budak itu mati di bawah tangannya, kematian budak itu harus dibalaskan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang itu harus dihukum.” Secara lebih harfiah, bahasa Ibraninya berbunyi, “harus benar-benar dibalaskan,” suatu rumusan hukum yang menegaskan kepastian tindakan pembalasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִֽי
  choice: Jika
  rationale: Dalam rangkaian hukum kasuistik, וְכִי memperkenalkan syarat baru. Bahasa Indonesia alami tidak memerlukan padanan tersendiri untuk waw penghubung.
- source_word: יַכֶּה
  choice: memukul
  rationale: נכה adalah verba umum untuk tindakan memukul; alatnya kemudian dinyatakan dengan frasa 'dengan tongkat'.
- source_word: אִישׁ
  choice: seseorang
  rationale: Dalam rumusan hukum, אִישׁ menunjuk pelaku perseorangan. 'Seseorang' merupakan ungkapan hukum Indonesia yang alami tanpa mengubah peran gramatikal pelaku.
- source_word: עַבְדּוֹ ... אֲמָתוֹ
  choice: budak laki-lakinya atau budak perempuannya
  rationale: Konteks hukum menunjukkan status perbudakan, bukan sekadar pelayanan; perbedaan laki-laki dan perempuan yang dinyatakan oleh dua istilah Ibrani dipertahankan.
- source_word: בַּשֵּׁבֶט
  choice: dengan tongkat
  rationale: שֵׁבֶט di sini adalah alat untuk memukul; 'tongkat' jelas dan wajar dalam bahasa Indonesia.
- source_word: וּמֵת
  choice: lalu budak itu mati
  rationale: Penghubung ini menyatakan kelanjutan atau akibat. Nomina 'budak itu' menghindari ketidakjelasan pronomina Indonesia.
- source_word: תַּחַת יָדוֹ
  choice: di bawah tangannya
  rationale: Padanan harfiah mempertahankan idiom Ibrani tentang kematian yang terjadi langsung di bawah pukulan atau kuasa pelaku, tanpa mempersempit artinya.
- source_word: נָקֹם יִנָּקֵם
  choice: kematian budak itu harus dibalaskan
  rationale: Infinitif absolut bersama verba finit menegaskan keharusan tindakan pembalasan. Penambahan 'kematian budak itu' memperjelas pihak yang dibalaskan tanpa menetapkan bentuk hukuman tertentu.
theological_decisions:
- issue: Sifat akibat hukum dalam נָקֹם יִנָּקֵם
  choice: kematian budak itu harus dibalaskan
  alternative: orang itu harus dihukum
  rationale: Teks menuntut pembalasan secara tegas tetapi tidak menyebutkan bentuk hukuman dalam ayat ini. Terjemahan utama mempertahankan istilah pembalasan dan ketidakpastian mengenai mekanisme yudisialnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Istilah 'budak' dipakai karena konteksnya adalah status terikat, sedangkan struktur pasif pada klausa terakhir mempertahankan ketegangan dan ketidakjelasan teks mengenai pelaksana serta bentuk hukumannya.
