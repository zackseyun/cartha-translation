  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/כִֽי יִמְכֹּ֥ר אִ֛ישׁ אֶת בִּתּ֖/וֹ לְ/אָמָ֑ה לֹ֥א תֵצֵ֖א כְּ/צֵ֥את הָ/עֲבָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/007.yaml
  text: And if a man sells his daughter as a female servant[b][a], she shall not go out as the male servants go out.
translation:
  language: id
  text: Jika seorang laki-laki menjual anak perempuannya sebagai budak perempuan[a], anak itu tidak boleh keluar dari perbudakan dengan cara yang sama seperti budak laki-laki[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hamba perempuan”. Kata Ibrani אָמָה menunjuk kepada seorang perempuan dalam pengabdian terikat; “budak perempuan” dipakai di sini untuk memperjelas status hukumnya.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, ia tidak keluar dari perbudakan menurut ketentuan yang sama dengan budak laki-laki.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/כִי
  choice: Jika
  rationale: Memperkenalkan kasus bersyarat dalam rangkaian hukum. Dalam bahasa Indonesia, “jika” secara alami menyampaikan fungsi kondisional; daya sambung ו tersirat dari kesinambungan konteks.
- source_word: יִמְכֹּר
  choice: menjual
  rationale: Secara langsung menyatakan tindakan menjual dalam rumusan kasus hukum umum tanpa menambahkan modalitas.
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Mempertahankan bentuk maskulin tunggal, yang dalam konteks ini menunjuk kepada ayah atau kepala rumah tangga laki-laki.
- source_word: בִּתּוֹ
  choice: anak perempuannya
  rationale: Padanan langsung bagi istilah kekerabatan dengan sufiks orang ketiga maskulin tunggal.
- source_word: לְאָמָה
  choice: sebagai budak perempuan
  rationale: אָמָה menunjuk kepada perempuan dalam status pengabdian terikat. “Budak perempuan” menyatakan kenyataan sosial-hukumnya tanpa memperhalusnya menjadi sekadar pembantu.
- source_word: לֹא תֵצֵא
  choice: tidak boleh keluar dari perbudakan
  rationale: Kata kerja harfiahnya berarti “keluar”, tetapi dalam konteks hukum menunjuk pada keluar atau dilepaskan dari status pengabdian. Pelengkap “dari perbudakan” membuat idiom itu jelas dalam bahasa Indonesia.
- source_word: כְּצֵאת
  choice: dengan cara yang sama seperti ...
  rationale: Menyampaikan perbandingan mengenai cara atau ketentuan keluarnya seseorang, bukan sekadar tindakan pergi secara fisik.
- source_word: הָעֲבָדִים
  choice: budak laki-laki
  rationale: Bentuk jamak maskulin ini dikontraskan dengan אָמָה dan merujuk pada para budak laki-laki dalam hukum sebelumnya; padanan ini mempertahankan perbedaan gender yang penting bagi ketentuan hukum tersebut.
theological_decisions:
- issue: Istilah perbudakan dalam hukum perjanjian
  choice: Menggunakan “budak perempuan” dan “budak laki-laki”.
  alternative: “hamba perempuan”, “pelayan perempuan”, atau “para hamba”
  rationale: Ayat ini mengatur penjualan dan pelepasan dari pengabdian terikat. Istilah “budak” membuat status sosial-hukum itu jelas dan tidak memperhalus realitas yang dinyatakan teks.
- issue: Makna ketentuan bahwa ia tidak keluar seperti budak laki-laki
  choice: Mempertahankan perbandingan tanpa menyimpulkan bahwa perempuan itu sama sekali tidak dapat dibebaskan.
  alternative: “ia tidak boleh dibebaskan”
  rationale: Bahasa Ibrani menyangkal bahwa cara keluarnya sama dengan cara para budak laki-laki keluar; ayat-ayat berikut menjelaskan ketentuan khususnya. Terjemahan tidak boleh memperluasnya menjadi larangan mutlak atas pembebasan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Rumusan hukum dibuat jelas bagi pembaca umum, sambil mempertahankan perbedaan antara budak perempuan dan budak laki-laki serta tidak menghapus ketegangan sosial dalam teks.
