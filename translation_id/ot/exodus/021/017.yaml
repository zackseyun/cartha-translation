  text: Whoever curses his father or his mother shall surely be put to death[a].
translation:
  language: id
  text: Siapa pun yang mengutuk ayahnya atau ibunya harus dihukum mati[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani memakai “dan ibunya”; dalam rumusan hukum ini maksudnya bersifat distributif, yaitu mengutuk salah satu dari kedua orang tua.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְקַלֵּל
  choice: Siapa pun yang mengutuk
  rationale: Partisipel מְקַלֵּל berfungsi sebagai nomina dalam rumusan hukum kasus dan menunjuk secara umum kepada setiap pelaku. “Mengutuk” mempertahankan makna tindakan mengucapkan kutuk terhadap seseorang.
- source_word: אָבִיו
  choice: ayahnya
  rationale: Menerjemahkan nomina dengan sufiks orang ketiga maskulin tunggal secara langsung; bentuk “-nya” juga wajar untuk pelaku generik dalam bahasa Indonesia.
- source_word: וְאִמּוֹ
  choice: atau ibunya
  rationale: 'Walaupun waw secara harfiah berarti “dan”, dalam rumusan hukum ini pasangan tersebut bersifat distributif: pelanggaran berlaku bila seseorang mengutuk salah satu dari kedua orang tuanya. “Atau” menyampaikan cakupan itu secara alami dalam bahasa Indonesia.'
- source_word: מוֹת יוּמָת
  choice: harus dihukum mati
  rationale: Gabungan infinitif absolut dan verba pasif menyatakan hukuman mati yang tegas dan dikenakan secara yudisial. “Harus dihukum mati” mempertahankan kepastian serta sifat hukumannya tanpa memberi kesan bahwa orang itu sekadar akan mati.
theological_decisions:
- issue: Daya berlaku hukum bagi pasangan orang tua
  choice: Menggunakan “ayahnya atau ibunya” untuk menyatakan bahwa mengutuk salah satu orang tua termasuk dalam pelanggaran ini.
  alternative: Mempertahankan bentuk yang lebih harfiah, “ayahnya dan ibunya”.
  rationale: Konjungsi Ibrani adalah waw, tetapi dalam konteks hukum kasuistik ini kedua pihak dipahami secara distributif. Pilihan “atau” tidak membatasi hukum hanya pada tindakan mengutuk keduanya sekaligus.
- issue: Rumusan hukuman mati
  choice: Menggunakan “harus dihukum mati” sebagai vonis yang dikenakan kepada pelaku.
  alternative: “Pastilah ia mati” atau “ia pasti akan mati”.
  rationale: Bentuk pasif יוּמָת dengan infinitif absolut menunjuk pada hukuman mati yang dijatuhkan, bukan sekadar kepastian bahwa pelaku akan mati.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bernada hukum. “Siapa pun” menyampaikan sifat umum ketentuan, sedangkan “harus dihukum mati” terdengar alami sekaligus mempertahankan ketegasan formula Ibrani.
