base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/008.yaml
  text: If she is displeasing in the eyes of her master[a], who has not designated her for himself, then he shall let her be redeemed. He has no right to sell her to a foreign people[b], since he has dealt deceitfully with her.
translation:
  language: id
  text: Jika perempuan itu tidak berkenan di mata tuannya, yang tidak menetapkannya bagi dirinya sendiri[a], tuannya harus mengizinkan perempuan itu ditebus. Ia tidak berhak menjual perempuan itu kepada bangsa asing, karena ia telah bertindak tidak setia terhadapnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang telah menetapkan atau mempertunangkannya bagi dirinya sendiri.” Klausa Ibrani ini sulit, baik secara tekstual maupun dalam penafsiran.
    reason: textual_variant
  - marker: b
    text: Atau, “karena ia telah berkhianat terhadapnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָה בְּעֵינֵי
  choice: tidak menyenangkan di mata
  rationale: Ungkapan Ibrani ini menyatakan bahwa seseorang tidak berkenan atau tidak dapat diterima oleh orang lain, bukan bahwa ia jahat secara mutlak. Bentuk 'di mata' mempertahankan citra ungkapan sumber dan tetap wajar dalam bahasa Indonesia.
- source_word: אֲדֹנֶיהָ
  choice: tuannya
  rationale: Dalam konteks hukum ini, istilah tersebut menunjuk kepada laki-laki yang membeli dan memiliki kewenangan sosial-hukum atas perempuan itu. 'Tuan' lebih tepat daripada gelar ilahi 'Tuhan' dan lebih alami daripada 'pemilik'.
- source_word: יְעָדָהּ
  choice: menetapkannya bagi dirinya sendiri
  rationale: Kata kerja ini berarti menunjuk atau menetapkan, dan dalam konteks ini mengarah pada penetapan untuk hubungan perkawinan. Pilihan ini mempertahankan keluasan leksikal tanpa membuat makna 'memperistri' menjadi eksplisit dalam teks utama.
- source_word: וְהֶפְדָּהּ
  choice: harus mengizinkan perempuan itu ditebus
  rationale: Bentuk Hifil di sini dipahami sebagai mengizinkan atau menyebabkan penebusan. Ungkapan ini menjelaskan hasil hukum tanpa menyiratkan bahwa sang tuan sendiri harus membayar harga tebusan.
- source_word: לְעַם נָכְרִי
  choice: kepada bangsa asing
  rationale: Frasa sumber bersifat kolektif. 'Bangsa asing' mempertahankan pembedaan sosial-perjanjian yang terdapat dalam bahasa Ibrani.
- source_word: לֹא יִמְשֹׁל לְמָכְרָהּ
  choice: tidak berhak menjual perempuan itu
  rationale: Konstruksi dengan משל menyatakan kuasa atau wewenang hukum. 'Tidak berhak' menyampaikan daya yuridisnya secara alami dalam bahasa Indonesia modern.
- source_word: בְּבִגְדוֹ בָהּ
  choice: karena ia telah berlaku tidak setia terhadapnya
  rationale: בגד menyatakan tindakan khianat, curang, atau tidak setia terhadap suatu kewajiban. 'Berlaku tidak setia' menjaga bobot moral dan relasionalnya tanpa membatasi makna pada penipuan verbal.
theological_decisions:
- issue: Penafsiran יְעָדָהּ dan kesulitan tekstual antara bentuk tertulis dan tradisi baca dalam klausa ini
  choice: yang tidak menetapkannya bagi dirinya sendiri
  alternative: yang telah menetapkan atau mempertunangkannya bagi dirinya sendiri
  rationale: 'Tradisi Masoret menyimpan kesulitan tekstual dan penafsiran: klausa dapat dipahami secara negatif atau afirmatif, sedangkan kata kerjanya dapat diterjemahkan secara umum sebagai ''menetapkan'' atau secara khusus sebagai ''mempertunangkan''. Teks utama mengikuti pembacaan negatif yang tampak dalam data sumber yang diberikan, sementara alternatif yang berorientasi pada perkawinan dipertahankan dalam catatan kaki.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan 'perempuan itu' dipakai untuk menjaga kejelasan rujukan dalam kalimat hukum; 'ditebus' mempertahankan istilah hukum-ekonomis teks sumber. Semua penanda catatan kaki dicantumkan dalam teks utama.
