revisions:
- from: Apabila beberapa laki-laki berkelahi lalu memukul seorang perempuan hamil sehingga anak-anaknya keluar[a], tetapi tidak terjadi malapetaka[b], pelakunya harus membayar denda sebesar yang dibebankan kepadanya oleh suami perempuan itu, dan ia harus membayarnya sesuai dengan keputusan para hakim[c].
  to: Apabila laki-laki berkelahi dan memukul seorang perempuan hamil sehingga anak-anaknya keluar[a], tetapi tidak terjadi celaka[b], pelakunya harus membayar denda sebesar yang dibebankan kepadanya oleh suami perempuan itu, dan ia harus membayarnya sesuai dengan keputusan para hakim[c].
  rationale: Revisi menghapus kuantifikasi tambahan pada subjek jamak, mengganti “malapetaka” dengan “celaka” untuk kesepadanan dan kelancaran yang lebih baik, serta menata ulang catatan kaki agar tetap mempertahankan ambiguitas sumber tanpa mengutamakan fatalitas. Struktur hukum—jumlah yang dibebankan suami dan pembayaran menurut para hakim—dipertahankan.
