  text: וְ/כִֽי יִנָּצ֣וּ אֲנָשִׁ֗ים וְ/נָ֨גְפ֜וּ אִשָּׁ֤ה הָרָה֙ וְ/יָצְא֣וּ יְלָדֶ֔י/הָ וְ/לֹ֥א יִהְיֶ֖ה אָס֑וֹן עָנ֣וֹשׁ יֵעָנֵ֗שׁ כַּֽ/אֲשֶׁ֨ר יָשִׁ֤ית עָלָי/ו֙ בַּ֣עַל הָֽ/אִשָּׁ֔ה וְ/נָתַ֖ן בִּ/פְלִלִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/022.yaml
  text: When men struggle together and strike a pregnant woman so that her children come out[a], but there is no harm, he shall surely be fined as the woman's husband imposes on him[c][b], and he shall pay according to the judges.
translation:
  language: id
  text: Apabila laki-laki berkelahi dan memukul seorang perempuan hamil sehingga anak-anaknya keluar[a], tetapi tidak terjadi celaka[b], pelakunya harus membayar denda sebesar yang dibebankan kepadanya oleh suami perempuan itu, dan ia harus membayarnya sesuai dengan keputusan para hakim[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anaknya keluar.” Ungkapan ini dapat menunjuk pada kelahiran prematur; sebagian orang memahaminya sebagai keguguran.
    reason: lexical_alternative
  - marker: b
    text: Atau “bahaya” atau “cedera serius.” Ayat ini sendiri tidak menyebut dengan tegas apakah celaka itu berkenaan dengan ibu, anak, atau salah satu dari mereka.
    reason: alternative_reading
  - marker: c
    text: Atau “di hadapan pengadilan” atau “melalui putusan pengadilan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Apabila
  rationale: Memperkenalkan perkara hukum bersyarat; bentuk ini wajar dan cukup formal dalam bahasa Indonesia.
- source_word: יִנָּצוּ אֲנָשִׁים
  choice: beberapa laki-laki berkelahi
  rationale: Menjaga acuan maskulin eksplisit אֲנָשִׁים dan menyampaikan pertikaian fisik yang dinyatakan oleh נצה.
- source_word: וְנָגְפוּ
  choice: lalu memukul
  rationale: Mengungkapkan tindakan berupa hantaman tanpa lebih dahulu menetapkan tingkat cedera yang ditimbulkannya.
- source_word: אִשָּׁה הָרָה
  choice: seorang perempuan hamil
  rationale: Padanan modern dan langsung bagi frasa Ibrani tersebut.
- source_word: וְיָצְאוּ יְלָדֶיהָ
  choice: sehingga anak-anaknya keluar
  rationale: Mengikuti ungkapan Ibrani secara dekat dan tidak memutuskan apakah yang dimaksud ialah kelahiran prematur, keguguran, atau keluarnya janin secara umum.
- source_word: אָסוֹן
  choice: malapetaka
  rationale: Kata yang cukup luas untuk akibat buruk yang serius dan tidak membatasi maknanya pada cedera atau kematian saja; ayat ini sendiri juga tidak menyebut dengan tegas siapa yang mengalaminya.
- source_word: עָנוֹשׁ יֵעָנֵשׁ
  choice: harus membayar denda
  rationale: Konstruksi intensif menegaskan hukuman, sedangkan konteks berikutnya menunjukkan bahwa hukumannya berupa pembayaran.
- source_word: כַּאֲשֶׁר יָשִׁית עָלָיו בַּעַל הָאִשָּׁה
  choice: sebesar yang dibebankan kepadanya oleh suami perempuan itu
  rationale: Menjaga tindakan suami dalam menetapkan atau menuntut jumlah denda tanpa mengabaikan unsur pengadilan pada klausa berikutnya.
- source_word: וְנָתַן בִּפְלִלִים
  choice: ia harus membayarnya sesuai dengan keputusan para hakim
  rationale: Menyampaikan pembayaran dalam kerangka penetapan hukum; frasa Ibrani dapat menunjuk kepada para hakim atau proses pengadilan.
theological_decisions:
- issue: Makna keluarnya anak-anak dan cakupan malapetaka
  choice: Mempertahankan ungkapan 'anak-anaknya keluar' dan tidak menentukan apakah malapetaka itu menimpa ibu, anak, atau salah satu dari mereka.
  alternative: Menerjemahkannya secara khusus sebagai keguguran atau kelahiran prematur, dan membatasi malapetaka hanya kepada ibu atau hanya kepada anak.
  rationale: Teks Ibrani tidak menyelesaikan pertanyaan-pertanyaan tersebut secara eksplisit. Terjemahan utama mempertahankan ambiguitas etis dan teologisnya, sedangkan kemungkinan penafsiran dicatat dalam catatan kaki.
- issue: Hubungan tuntutan suami dengan putusan hukum
  choice: Denda dibebankan oleh suami dan dibayar sesuai dengan keputusan para hakim.
  alternative: Seluruh jumlah ditentukan semata-mata oleh suami, atau frasa terakhir hanya berarti pembayaran dilakukan di hadapan pengadilan.
  rationale: Susunan Ibrani menyebut baik tindakan suami maupun פְּלִלִים; terjemahan mempertahankan kedua unsur tersebut tanpa meniadakan kemungkinan nuansa yudisial lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum yang khidmat. 'Apabila' dan 'dibebankan' mempertahankan corak peraturan tanpa menjadi arkais. Ungkapan yang disengaja tetap harfiah, 'anak-anaknya keluar', diberi catatan agar ambiguitas sumber tidak dihapus.
