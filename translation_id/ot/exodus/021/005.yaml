  yaml_path: translation/ot/exodus/021/005.yaml
  text: But if the servant plainly says[a], ‘I love my master, my wife, and my children[b]; I will not go out free,’
translation:
  language: id
  text: Namun, jika budak itu berkata dengan tegas[a], ‘Aku mengasihi tuanku, istriku, dan anak-anak lelakiku[b]. Aku tidak akan keluar sebagai orang merdeka,’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “benar-benar berkata” atau “secara tegas berkata”; bahasa Ibrani memakai infinitif absolut bersama kata kerja finit untuk memberi penegasan.
    reason: lexical_alternative
  - marker: b
    text: Atau “putra-putraku”; harfiahnya “anak-anak lelakiku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Menyatakan syarat yang berlawanan dengan ketentuan pembebasan sebelumnya; bentuk ini alami dalam bahasa Indonesia dan mempertahankan daya kontras konteks.
- source_word: אָמֹר יֹאמַר
  choice: dengan tegas berkata
  rationale: Gabungan infinitif absolut dan verba finit memberi penegasan pada pernyataan; ‘dengan tegas berkata’ menyampaikan deklarasi yang jelas dan sungguh-sungguh.
- source_word: הָעֶבֶד
  choice: budak itu
  rationale: Konteks hukum membahas orang dalam ikatan kerja yang seharusnya dapat dibebaskan, sehingga ‘budak’ mempertahankan pentingnya status terikat tersebut.
- source_word: אָהַבְתִּי
  choice: Aku mengasihi
  rationale: Bentuk perfektif di sini mengungkapkan kasih yang telah menetap dan masih berlaku; bentuk kini paling alami dalam ujaran langsung Indonesia.
- source_word: אֲדֹנִי
  choice: tuanku
  rationale: Mencerminkan hubungan kewenangan dalam rumah tangga sekaligus cocok dengan bentuk ujaran orang pertama.
- source_word: אִשְׁתִּי
  choice: istriku
  rationale: Padanan posesif langsung dan alami.
- source_word: בָּנָי
  choice: anak-anakku
  rationale: Walaupun bentuk Ibraninya secara morfologis maskulin jamak, istilah ini dapat menunjuk kepada keturunan atau anak-anak secara umum dalam konteks keluarga.
- source_word: לֹא אֵצֵא
  choice: Aku tidak mau keluar
  rationale: Dalam konteks keputusan yang dinyatakan secara sukarela, negasi bentuk imperfektif menyatakan penolakan atau ketidakmauan untuk pergi; ‘keluar’ mempertahankan idiom hukum Ibrani tentang pembebasan.
- source_word: חָפְשִׁי
  choice: sebagai orang merdeka
  rationale: Mengungkapkan keadaan orang itu ketika keluar dan terdengar lebih jelas serta alami daripada sekadar ‘bebas’ setelah verba ‘keluar’.
theological_decisions:
- issue: Terjemahan עבד dalam hukum perbudakan Israel
  choice: budak
  alternative: hamba; pelayan; hamba sahaya
  rationale: Pokok ayat ialah status terikat dan kesempatan untuk dibebaskan. ‘Budak’ menyatakan realitas hukum itu secara langsung tanpa memperhalusnya, sedangkan ayat ini tidak menentukan seluruh sifat lembaganya.
- issue: Cakupan בָּנַי
  choice: anak-anakku
  alternative: anak-anak lelakiku
  rationale: Bentuk maskulin jamak dapat berarti ‘anak-anak lelaki’, tetapi dalam penyebutan keluarga dapat pula bersifat generik. Teks utama memakai bentuk alami yang tidak mempersempit cakupan, sedangkan alternatif harfiah dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-naratif yang jelas dan bermartabat. Ujaran langsung dibuat alami tanpa menghilangkan penegasan Ibrani atau realitas status perbudakan.
