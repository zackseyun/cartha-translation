  yaml_path: translation/ot/exodus/021/027.yaml
  text: And if he knocks out the tooth of his male servant or the tooth of his female servant[a], he shall let him go free in compensation for his tooth.
translation:
  language: id
  text: Jika seseorang menyebabkan gigi budak laki-lakinya atau budak perempuannya tanggal, ia harus membebaskan budak itu sebagai ganti gigi itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, kata kerja “membebaskan” memakai akhiran objek maskulin tunggal, “dia”; ketentuan ini berlaku bagi budak laki-laki maupun budak perempuan yang disebut sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Jika
  rationale: Memperkenalkan kasus bersyarat yang melanjutkan rangkaian hukum; dalam bahasa Indonesia, “Jika” sudah alami tanpa perlu mempertahankan וְ secara kaku.
- source_word: שֵׁן
  choice: gigi
  rationale: Istilah anatomi langsung; bentuk tunggal dipertahankan.
- source_word: עַבְדּוֹ
  choice: budak laki-lakinya
  rationale: Dalam perundang-undangan ini עבד menunjuk pada orang dalam status perbudakan; “budak” lebih tepat daripada “pelayan,” dan “laki-laki” mempertahankan pasangan gender dalam bahasa Ibrani.
- source_word: אֲמָתוֹ
  choice: budak perempuannya
  rationale: Padanan feminin dari עבד; terjemahan ini mempertahankan status hukum dan pembedaan gender sumber.
- source_word: יַפִּיל
  choice: merontokkan
  rationale: Bentuk kausatif dari נפל berarti menyebabkan gigi tanggal; “merontokkan gigi” merupakan ungkapan Indonesia yang ringkas dan sesuai konteks cedera.
- source_word: לַחָפְשִׁי יְשַׁלְּחֶנּוּ
  choice: ia harus membebaskan budak itu
  rationale: Gabungan ini menyatakan pelepasan menuju keadaan bebas. “Harus” menyampaikan daya wajib hukum, sedangkan “budak itu” menghindari ketidakjelasan pronomina gender dalam bahasa Indonesia.
- source_word: תַּחַת שִׁנּוֹ
  choice: sebagai ganti giginya
  rationale: תחת menyatakan penggantian atau kompensasi atas cedera; ungkapan ini dekat dengan bentuk sumber dan tetap alami.
theological_decisions:
- issue: Istilah bagi status perbudakan dalam hukum Kitab Perjanjian
  choice: budak laki-laki / budak perempuan
  alternative: hamba laki-laki / hamba perempuan; pelayan laki-laki / pelayan perempuan
  rationale: Ayat ini mengatur pelepasan seseorang yang secara hukum berada dalam perbudakan. “Budak” menyatakan realitas sosial-hukum itu dengan jelas tanpa memperhalusnya menjadi hubungan kerja biasa.
- issue: Acuan objek maskulin tunggal pada perintah pembebasan
  choice: budak itu, dengan catatan bahwa hukum berlaku bagi laki-laki maupun perempuan
  alternative: dia; mereka
  rationale: Sufiks objek Ibrani berbentuk maskulin tunggal, tetapi kondisi hukum menyebut budak laki-laki maupun perempuan. Terjemahan utama memakai nomina netral gender dalam bahasa Indonesia, sedangkan catatan mempertahankan informasi bentuk gramatikal sumber.
translation_notes:
  register: Bahasa hukum yang lugas, modern, dan bermartabat. “Budak” dipilih untuk menyatakan status hukum secara jujur; “merontokkan gigi” alami dalam bahasa Indonesia; penanda catatan kaki ditempatkan sesudah kalimat yang dijelaskannya.
