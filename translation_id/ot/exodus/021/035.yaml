  to: Jika sapi milik seseorang menanduk sapi milik sesamanya, lalu sapi milik sesamanya itu mati[a], mereka harus menjual sapi yang masih hidup itu dan membagi uang hasil penjualannya[b]. Mereka juga harus membagi sapi yang mati itu[c].
