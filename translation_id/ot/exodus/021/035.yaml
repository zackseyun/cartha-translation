translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan susunan hukum yang mudah dipahami. Istilah 'sapi' dipilih sebagai padanan umum שׁוֹר; bentuk 'sesamanya' menjaga nuansa sosial-hukum. Semua penjelasan yang melampaui bentuk ringkas teks sumber ditempatkan dalam catatan kaki.
