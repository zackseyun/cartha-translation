base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/035.yaml
  text: And if one man's ox strikes his neighbor's ox and it dies[a], then they shall sell the live ox and divide its price[c][b], and they shall also divide the dead one.
translation:
  language: id
  text: Jika sapi milik seseorang menanduk sapi milik sesamanya, lalu sapi milik sesamanya itu mati[a], mereka harus menjual sapi yang masih hidup itu dan membagi uang hasil penjualannya[b]. Mereka juga harus membagi sapi yang mati itu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dan sapi itu mati.” Verba yang diterjemahkan “menanduk” juga dapat berarti “menghantam.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “membagi uangnya,” yakni uang hasil penjualan sapi yang masih hidup.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “yang mati itu,” yaitu sapi yang mati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Jika
  rationale: Membuka ketentuan hukum kasuistis. Dalam bahasa Indonesia, 'Jika' secara alami menyampaikan daya kondisional; penghubung וְ tidak perlu diterjemahkan tersendiri pada awal ayat.
- source_word: יִגֹּף
  choice: menanduk
  rationale: Dalam konteks sapi yang menyerang sapi lain, 'menanduk' menyampaikan pukulan kuat oleh hewan bertanduk secara alami, meskipun verba Ibrani juga dapat bermakna lebih umum, 'menghantam'.
- source_word: שׁוֹר אִישׁ
  choice: sapi milik seseorang
  rationale: Mengungkapkan kepemilikan dengan jelas dan alami tanpa menjadikan jenis kelamin pemilik sebagai unsur yang lebih tegas daripada yang diperlukan dalam bahasa Indonesia.
- source_word: שׁוֹר רֵעֵהוּ
  choice: sapi milik sesamanya
  rationale: רֵעַ menunjuk kepada sesama, rekan, atau orang lain dalam hubungan sosial. 'Sesamanya' sesuai dengan register hukum dan mempertahankan dimensi antarpribadi.
- source_word: וָמֵת
  choice: hingga mati
  rationale: Menyatakan hasil serangan dengan ringkas dan alami. Secara harfiah konstruksinya dapat dibaca 'dan sapi itu mati'.
- source_word: וּמָכְרוּ
  choice: mereka harus menjual
  rationale: Melanjutkan konsekuensi hukum. 'Harus' menyampaikan kewajiban prosedural yang tersirat dalam rumusan hukum Ibrani tanpa mengubahnya menjadi perintah langsung.
- source_word: הַשּׁוֹר הַחַי
  choice: sapi yang masih hidup itu
  rationale: Ungkapan alami untuk sapi yang selamat, sekaligus mempertahankan penentuan pada nomina Ibrani.
- source_word: וְחָצוּ אֶת כַּסְפּוֹ
  choice: membagi uang hasil penjualannya
  rationale: כֶּסֶף secara harfiah berarti 'perak/uang'; dalam konteks setelah penjualan, yang dimaksud ialah uang hasil penjualan sapi hidup.
- source_word: וְגַם אֶת הַמֵּת יֶחֱצוּן
  choice: Mereka juga harus membagi sapi yang mati itu
  rationale: Menjelaskan acuan adjektiva substantival 'yang mati' sebagai sapi, tanpa mempersempitnya menjadi hanya 'bangkai' atau nilai bangkai.
