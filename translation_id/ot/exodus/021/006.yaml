  naturalness: Bahasa baku dan jelas. Struktur yang direvisi tetap lugas dalam register hukum serta memperjelas peralihan subjek dari tuan kepada hamba.
  terminology: “Allah,” “tuan,” “tiang pintu,” dan “penusuk” dapat diterima. “Seumur hidup” secara wajar menyampaikan daya laku לְעֹלָם dalam ketentuan hukum ini. Catatan kaki dengan tepat mempertahankan alternatif “para hakim.”
