base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/006.yaml
  text: then his master shall bring him to God[a], and shall bring him to the door or to the doorpost, and his master shall pierce his ear with an awl; and he shall serve him forever.
translation:
  language: id
  text: maka tuannya harus membawanya menghadap Allah[a] dan membawanya ke pintu atau ke tiang pintu. Tuannya harus melubangi telinganya dengan sebuah penusuk, dan hamba itu akan melayani tuannya seumur hidup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “para hakim.” Dalam beberapa konteks hukum, kata Ibrani אֱלֹהִים dapat merujuk kepada para hakim manusia atau lembaga peradilan.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִגִּישׁוֹ
  choice: harus membawanya menghadap
  rationale: Bentuk Hifil dari נגשׁ menyatakan membawa seseorang ke hadapan suatu otoritas atau ke tempat yang ditentukan. Ungkapan 'membawanya menghadap' mempertahankan nuansa prosedural dan yudisial.
- source_word: אֲדֹנָיו
  choice: tuannya
  rationale: Dalam konteks hukum perhambaan Ibrani, 'tuan' menyampaikan hubungan sosial-hukum yang dimaksud tanpa memberi kesan bahwa kata ini menunjuk kepada Tuhan.
- source_word: הָאֱלֹהִים
  choice: Allah
  rationale: Makna paling langsung dari bentuk ini ialah 'Allah'. Namun, dalam konteks hukum, kata tersebut mungkin menunjuk kepada para hakim atau lembaga peradilan; kemungkinan itu dipertahankan dalam catatan kaki.
- source_word: הַדֶּלֶת
  choice: pintu
  rationale: Padanan konkret dan lazim bagi pintu rumah; tidak perlu diperluas menjadi 'daun pintu'.
- source_word: הַמְּזוּזָה
  choice: tiang pintu
  rationale: Padanan arsitektural yang tepat dan lazim bagi מְזוּזָה.
- source_word: רָצַע
  choice: melubangi
  rationale: Kata kerja ini menunjuk pada tindakan menembus atau membuat lubang dengan alat tajam. 'Melubangi' alami dalam bahasa Indonesia ketika alatnya disebutkan.
- source_word: אָזְנוֹ
  choice: telinganya
  rationale: Rujukan anggota tubuh diterjemahkan secara langsung.
- source_word: בַּמַּרְצֵעַ
  choice: dengan sebuah penusuk
  rationale: מַרְצֵעַ adalah alat runcing untuk membuat lubang. 'Penusuk' lebih mudah dipahami pembaca umum daripada istilah teknis 'busa' atau pinjaman asing.
- source_word: וַעֲבָדוֹ
  choice: Ia pun akan melayani tuannya
  rationale: Kata עבד menyatakan melayani atau bekerja. Penyebutan kembali 'tuannya' menghindari ambiguitas pronomina dalam bahasa Indonesia.
- source_word: לְעֹלָם
  choice: seumur hidup
  rationale: Dalam ketentuan hukum ini, frasa tersebut menunjuk pada masa pengabdian permanen sepanjang hidup manusia, bukan keberlangsungan metafisis tanpa akhir. 'Seumur hidup' menyampaikan daya hukumnya secara jelas.
theological_decisions:
- issue: Makna הָאֱלֹהִים dalam konteks hukum
  choice: Allah
  alternative: para hakim
  rationale: Secara leksikal, הָאֱלֹהִים paling langsung berarti 'Allah' dan dapat menggambarkan penghadapan kepada Allah dalam suatu ritus hukum perjanjian. Karena penafsiran sebagai para hakim atau lembaga peradilan juga masuk akal dalam konteks hukum, alternatif itu dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang lugas dan bermartabat. Struktur Ibrani yang berulang dibuat alami tanpa menghapus urutan tindakan. 'Harus' menandai daya preskriptif bentuk hukum, sedangkan 'seumur hidup' menjelaskan cakupan kontekstual לְעֹלָם.
