  text: If he takes another wife for himself[a], he shall not diminish her food, her clothing, or her marital rights.
translation:
  language: id
  text: Jika ia mengambil perempuan lain sebagai istri, ia tidak boleh mengurangi makanan, pakaian, atau hak perempuan itu atas hubungan suami istri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hak-haknya dalam hubungan suami istri.” Istilah Ibrani ini menunjuk pada kewajiban suami untuk memenuhi kebutuhan keintiman dalam perkawinan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Mempertahankan bentuk bersyarat yang lazim dalam rumusan hukum kasuistik.
- source_word: אַחֶרֶת יִקַּח לוֹ
  choice: ia mengambil perempuan lain sebagai istri
  rationale: Dalam konteks perkawinan, לקח dengan objek perempuan berarti mengambilnya sebagai istri. Unsur לוֹ tercakup secara alami dalam tindakan mengambil bagi dirinya sendiri tanpa perlu diterjemahkan secara kaku.
- source_word: שְׁאֵרָהּ
  choice: makanan
  rationale: Walaupun שְׁאֵר berkaitan secara harfiah dengan daging, dalam rangkaian kewajiban rumah tangga ini maknanya paling tepat adalah persediaan makanan.
- source_word: כְּסוּתָהּ
  choice: pakaian
  rationale: כְּסוּת berarti penutup atau pakaian; 'pakaian' merupakan padanan Indonesia yang paling wajar dalam konteks hukum ini.
- source_word: וְעֹנָתָהּ
  choice: hak perempuan itu atas hubungan suami istri
  rationale: Istilah Ibrani yang jarang ini menunjuk pada kewajiban keintiman dalam perkawinan. Rumusan ini menyatakan bahwa hak tersebut adalah milik perempuan itu, sambil menghindari bahasa yang terlalu teknis atau kasar.
- source_word: לֹא יִגְרָע
  choice: ia tidak boleh mengurangi
  rationale: Kata kerja ini berarti mengurangi atau membuat berkurang. 'Tidak boleh' menyampaikan daya larangan hukum secara alami dalam bahasa Indonesia modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan tiga kewajiban dipertahankan, sedangkan bentuk hukum Ibrani disampaikan dengan rumusan larangan yang alami. Penanda catatan kaki ditempatkan pada frasa yang diterangkannya.
