base_translation:
  language: en
  yaml_path: translation/ot/exodus/021/028.yaml
  text: And if an ox gores a man or a woman and he dies[a], the ox shall surely be stoned, and its flesh shall not be eaten; but the owner of the ox is clear.
translation:
  language: id
  text: Jika seekor sapi menanduk seorang laki-laki atau perempuan hingga orang itu mati, sapi itu harus dilempari batu sampai mati, dan dagingnya tidak boleh dimakan. Namun, pemilik sapi itu bebas[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak bersalah,” “tidak bertanggung jawab,” atau “tidak dikenai hukuman.” Kata Ibrani נָקִי menyatakan bahwa pemilik itu bebas dari kesalahan atau hukuman dalam kasus ini, tanpa merinci lebih jauh jenis tanggung jawabnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Jika
  rationale: Ungkapan ini membuka ketentuan hukum bersyarat. Dalam bahasa Indonesia, “Jika” sudah menyampaikan fungsi tersebut secara alami tanpa memerlukan padanan tersendiri bagi waw penghubung.
- source_word: יִגַּח
  choice: menanduk
  rationale: Kata kerja ini secara khusus menunjuk pada serangan dengan tanduk; “menanduk” merupakan padanan Indonesia yang tepat dan wajar.
- source_word: שׁוֹר
  choice: seekor sapi
  rationale: Dalam konteks hukum ini, שׁוֹר menunjuk pada seekor hewan jenis sapi. “Sapi” mudah dipahami dan tidak mempersempit makna menjadi hanya pejantan seperti “sapi jantan”.
- source_word: אֶת אִישׁ אוֹ אֶת אִשָּׁה
  choice: seorang laki-laki atau perempuan
  rationale: Terjemahan mempertahankan penyebutan kedua jenis kelamin secara eksplisit sebagaimana dalam teks Ibrani.
- source_word: וָמֵת
  choice: hingga orang itu mati
  rationale: Subjek kematian adalah manusia yang ditanduk, baik laki-laki maupun perempuan. “Orang itu” menghindari pronomina bergender yang tidak alami dalam bahasa Indonesia, sedangkan “hingga” menyatakan akibat secara jelas.
- source_word: סָקוֹל יִסָּקֵל
  choice: harus dilempari batu sampai mati
  rationale: Konstruksi infinitif absolut dengan verba finit menegaskan kewajiban hukuman. Rumusan ini menyampaikan perintah tegas dan akibat eksekusinya dalam bahasa Indonesia yang alami.
- source_word: וְלֹא יֵאָכֵל אֶת בְּשָׂרוֹ
  choice: dan dagingnya tidak boleh dimakan
  rationale: Bentuk pasif dan larangan dalam bahasa Ibrani dipertahankan secara alami; בָּשָׂר dalam konteks hewan paling wajar diterjemahkan “daging”.
- source_word: וּבַעַל הַשּׁוֹר
  choice: Namun, pemilik sapi itu
  rationale: בַּעַל di sini berarti pemilik secara hukum. “Namun” memperjelas kontras antara hukuman atas hewan dan status pemiliknya.
- source_word: נָקִי
  choice: bebas
  rationale: Dalam konteks hukum, kata ini menyatakan bahwa pemilik bebas atau tidak terkena tanggung jawab hukuman dalam perkara tersebut. Padanan singkat “bebas” mempertahankan keluasan istilah Ibrani, dengan penjelasan dalam catatan kaki.
theological_decisions:
- issue: Status hukum pemilik sapi dalam klausa terakhir
  choice: Pemilik disebut “bebas,” tanpa mempersempit jenis kebebasan hukumnya.
  alternative: “Tidak bersalah,” “tidak bertanggung jawab,” atau “tidak dikenai hukuman.”
  rationale: נָקִי dapat menyatakan bebas dari kesalahan, tuntutan, atau hukuman. Ayat ini membedakan hukuman atas hewan dari status pemilik dalam kasus dasar, sebelum ayat-ayat berikutnya membahas kelalaian. Terjemahan tidak menentukan lebih jauh apakah kebebasan itu terutama bersifat moral, perdata, atau pidana.
translation_notes:
  register: Bahasa hukum dibuat tegas tetapi tetap alami bagi pembaca Indonesia modern. “Seekor sapi” dipilih daripada istilah yang lebih arkais seperti “lembu,” dan pengulangan “orang itu” menjaga kejelasan tanpa memperkenalkan gender yang tidak dinyatakan oleh bentuk Indonesia.
