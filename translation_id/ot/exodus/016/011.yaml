lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan narasi dengan peristiwa baru. Dalam bahasa Indonesia Alkitabiah yang tetap wajar, “berfirman” tepat untuk tindakan Allah berbicara.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama diri, bukan diganti dengan gelar “TUHAN”.
- source_word: אֶל מֹשֶׁה
  choice: kepada Musa
  rationale: Preposisi אֶל menandai orang yang dituju dalam ujaran; “kepada Musa” merupakan padanan Indonesia yang alami.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara terpisah
  rationale: Formula Ibrani pembuka kutipan ini secara alami terwakili dalam bahasa Indonesia oleh verba “berfirman” dan tanda baca yang mengantar isi firman pada ayat berikutnya; menerjemahkannya sebagai “demikian” akan menambahkan unsur yang tidak eksplisit.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan fungsi itu sekaligus menghindari penggantian nama dengan gelar.
- issue: Pemakaian verba khusus bagi perkataan Allah
  choice: berfirman
  alternative: berbicara
  rationale: “Berfirman” adalah bahasa Indonesia yang dignified dan lazim untuk perkataan Allah, tanpa mengubah isi atau menyelesaikan ketegangan teologis apa pun.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Koma dipertahankan karena kalimat berlanjut ke isi firman pada ayat berikutnya.
