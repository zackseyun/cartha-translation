base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/010.yaml
  text: And it happened[a], as Aaron spoke to the whole congregation of the sons of Israel, that they turned toward the wilderness, and behold[b], the glory of Yahweh appeared in the cloud.
translation:
  language: id
  text: Ketika Harun sedang berbicara kepada seluruh umat Israel[a], mereka berpaling ke arah padang gurun. Lihatlah, kemuliaan Yahweh tampak di dalam awan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seluruh jemaat anak-anak Israel”; ungkapan ini merupakan sebutan kolektif bagi umat Israel. Dapat juga diterjemahkan, “seluruh jemaah orang Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּדַבֵּר
  choice: Ketika ... sedang berbicara
  rationale: Gabungan וַיְהִי dengan כ + infinitif membingkai peristiwa yang terjadi sementara Harun berbicara. Susunan temporal ini alami dalam bahasa Indonesia tanpa mempertahankan formula naratif secara kaku.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: seluruh umat Israel
  rationale: עֵדָה menunjuk kepada komunitas Israel secara keseluruhan. 'Umat Israel' alami dan mudah dipahami, sedangkan bentuk harfiah בְּנֵי יִשְׂרָאֵל dicatat dalam catatan kaki.
- source_word: וַיִּפְנוּ אֶל הַמִּדְבָּר
  choice: mereka berpaling ke arah padang gurun
  rationale: פנה dengan אֶל menyatakan gerakan mengarahkan diri kepada sesuatu; 'berpaling ke arah' mempertahankan gerak dan arah tanpa menambahkan gagasan bahwa mereka berjalan ke sana.
- source_word: וְהִנֵּה
  choice: Lihatlah
  rationale: Partikel ini mengarahkan perhatian secara mendadak dan kuat kepada penampakan berikutnya. 'Lihatlah' mempertahankan daya retorisnya dalam ragam Indonesia yang bermartabat.
- source_word: כְּבוֹד יְהוָה
  choice: kemuliaan Yahweh
  rationale: כָּבוֹד di sini menunjuk kepada kemuliaan ilahi yang menyatakan diri, dan nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh'.
- source_word: נִרְאָה
  choice: tampak
  rationale: Bentuk nifal ראה di sini menyatakan bahwa kemuliaan itu menjadi terlihat atau menampakkan diri; 'tampak' ringkas dan alami.
- source_word: בֶּעָנָן
  choice: di dalam awan
  rationale: Artikel pada עָנָן menunjukkan awan tertentu dalam konteks kisah tersebut. 'Di dalam awan' mempertahankan baik lokasinya maupun ketentuannya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama ilahi secara langsung. 'Yahweh' mempertahankan nama pribadi itu, bukan menggantinya dengan gelar.
- issue: Penerjemahan בְּנֵי יִשְׂרָאֵל
  choice: umat Israel dalam teks utama, dengan bentuk harfiah dalam catatan kaki
  alternative: anak-anak lelaki Israel; orang Israel
  rationale: Dalam ungkapan idiomatis ini, בְּנֵי יִשְׂרָאֵל menyebut bangsa Israel sebagai komunitas, bukan hanya laki-laki. Terjemahan utama menyampaikan rujukan kolektif secara alami, sedangkan bentuk sumber yang bersifat filial tetap transparan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami dengan anak kalimat temporal; 'Lihatlah' dipertahankan untuk menandai peralihan perhatian yang kuat dalam teks Ibrani.
