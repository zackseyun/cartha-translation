  text: An omer is a tenth of an ephah[a].
translation:
  language: id
  text: Satu omer adalah sepersepuluh efa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Omer dan efa adalah satuan takaran bahan kering Ibrani kuno; ayat ini menetapkan bahwa satu omer sama dengan sepersepuluh efa.
    reason: cultural_note
lexical_decisions:
- source_word: הָעֹמֶר
  choice: satu omer
  rationale: עֹמֶר adalah satuan takaran bahan kering. Istilahnya dipertahankan melalui transliterasi; dalam kalimat definisi bahasa Indonesia, “satu omer” menyatakan satu unit secara alami.
- source_word: עֲשִׂרִית
  choice: sepersepuluh
  rationale: Kata ini menyatakan pecahan satu per sepuluh; “sepersepuluh” ringkas, tepat, dan alami dalam bahasa Indonesia.
- source_word: הָאֵיפָה
  choice: efa
  rationale: אֵיפָה adalah satuan takaran bahan kering kuno lainnya dan ditransliterasikan sebagai “efa”, tanpa menggantinya dengan perkiraan satuan modern.
- source_word: הוּא
  choice: adalah
  rationale: Pronomina ini berfungsi sebagai unsur kopula dalam klausa nominal; “adalah” menghasilkan definisi yang jelas dan wajar.
- source_word: וְ
  choice: tidak diterjemahkan secara eksplisit
  rationale: Konjungsi ini membuka keterangan penjelas. Dalam bahasa Indonesia, hubungan tersebut sudah jelas dari konteks, sehingga penambahan “dan” akan terasa kaku.
