  text: Lalu Musa berkata kepada mereka, “Jangan seorang pun menyisakan apa pun darinya sampai pagi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “lalu” wajar dalam narasi bahasa Indonesia dan menunjukkan urutan tanpa menambahkan hubungan sebab-akibat.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk baku nama tokoh ini dalam bahasa Indonesia.
- source_word: אֲלֵהֶם
  choice: kepada mereka
  rationale: Menerjemahkan langsung preposisi אֶל dengan sufiks orang ketiga jamak maskulin tanpa mengganti acuannya secara interpretatif.
- source_word: אִישׁ אַל
  choice: Jangan seorang pun
  rationale: אִישׁ berfungsi distributif dalam larangan ini, sehingga cakupannya ialah setiap individu. Ungkapan “jangan seorang pun” alami dan tepat dalam bahasa Indonesia.
- source_word: יוֹתֵר
  choice: menyisakan
  rationale: Dalam konteks manna, verba יתר berarti membiarkan atau menyimpan sesuatu tetap tersisa. “Menyisakan” mengungkapkan makna itu secara ringkas dan alami.
- source_word: מִמֶּנּוּ
  choice: sebagian darinya
  rationale: מן dengan sufiks tunggal merujuk kembali kepada manna; “sebagian darinya” menyatakan bahwa tidak boleh ada jumlah apa pun yang ditinggalkan.
- source_word: עַד בֹּקֶר
  choice: sampai pagi
  rationale: Padanan temporal langsung dan idiomatis bagi frasa Ibrani tersebut.
