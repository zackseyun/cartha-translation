  source_fidelity: 'Secara umum setia pada Ibrani: wayyiqtol, Musa, penerima jamak, larangan distributif, tindakan menyisakan, dan batas waktu sampai pagi semuanya terwakili. Namun, “sebagian darinya” kurang tepat untuk מִמֶּנּוּ dalam konstruksi larangan ini, karena dapat terdengar seolah-olah hanya sebagian tertentu yang dilarang disisakan. Teks Ibrani melarang menyisakan apa pun darinya.'
