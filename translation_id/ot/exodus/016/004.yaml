  source_fidelity: 'Makna pokok sudah terjaga: YHWH menyediakan roti dari langit, umat harus keluar mengumpulkan jatah harian, dan tindakan itu menjadi ujian ketaatan pada petunjuk-Nya. Namun, “pada hari itu juga” dapat berarti ‘segera pada hari yang sama’, bukan distribusi berulang ‘setiap hari pada harinya’; dan “harus keluar” terdengar lebih sebagai kewajiban tegas daripada bentuk instruktif/naratif Ibrani.'
