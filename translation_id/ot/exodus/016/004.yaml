  - severity: low
    issue: “harus keluar”
    rationale: Bentuk weqatal dalam konteks ini menyatakan pengaturan/perintah yang akan dilakukan umat. “Hendaklah ... keluar” lebih sesuai dengan nuansa instruktif tanpa memberi tekanan deontik tambahan.
