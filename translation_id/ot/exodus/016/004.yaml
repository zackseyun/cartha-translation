base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/004.yaml
  text: Then Yahweh said to Moses[a], “Behold, I am raining bread from heaven for you, and the people shall go out and gather a day's portion each day, so that I may test them[c][b], whether they will walk in my law or not.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa, “Sesungguhnya, Aku akan menurunkan roti dari langit kepada kalian seperti hujan[a]. Hendaklah bangsa itu keluar dan memungut setiap hari jatah untuk hari itu[b], supaya Aku dapat menguji mereka, apakah mereka akan hidup menurut petunjuk-Ku[c] atau tidak.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Aku sedang menghujankan roti dari langit kepada kalian.” Bentuk partisip Ibrani juga dapat menyatakan tindakan yang segera akan dilakukan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “perkara satu hari pada harinya,” yaitu jatah yang diperlukan untuk setiap hari dan dipungut pada hari itu.
    reason: lexical_alternative
  - marker: c
    text: Atau “hukum-Ku” atau “Taurat-Ku.” Kata Ibrani torah dapat berarti petunjuk, pengajaran, atau hukum.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama perjanjian ilahi yang terdapat dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: הִנְנִי מַמְטִיר
  choice: Sesungguhnya, Aku akan menurunkan ... seperti hujan
  rationale: הִנְנִי memperkenalkan pengumuman ilahi dengan penegasan, sedangkan partisip Hifil מַמְטִיר menyatakan tindakan yang segera dilakukan. Ungkapan ini mempertahankan gambaran hujan dengan bahasa Indonesia yang alami.
- source_word: לֶחֶם מִן הַשָּׁמַיִם
  choice: roti dari langit
  rationale: Mempertahankan kata konkret לֶחֶם, 'roti', dan asalnya dari langit tanpa memperluasnya menjadi 'makanan'.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: jatah sehari pada hari itu juga
  rationale: Mengungkapkan idiom Ibrani tentang jumlah yang diperlukan untuk satu hari dan dipungut pada hari yang bersangkutan.
- source_word: לְמַעַן אֲנַסֶּנּוּ
  choice: supaya Aku menguji mereka
  rationale: Akhiran tunggal merujuk kepada הָעָם, suatu nomina kolektif; bahasa Indonesia secara alami memakai 'mereka' untuk anggota bangsa itu.
- source_word: הֲיֵלֵךְ
  choice: apakah mereka akan berjalan
  rationale: Mempertahankan metafora Ibrani mengenai cara hidup atau perilaku, alih-alih langsung menafsirkannya sebagai 'menaati'.
- source_word: בְּתוֹרָתִי
  choice: menurut petunjuk-Ku
  rationale: תּוֹרָה pada konteks sebelum Sinai secara langsung menunjuk pada petunjuk atau pengajaran ilahi. 'Menurut' membuat idiom berjalan dalam petunjuk dapat dipahami secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna תּוֹרָה sebelum pemberian Taurat di Sinai
  choice: petunjuk-Ku
  alternative: hukum-Ku atau Taurat-Ku
  rationale: '''Petunjuk-Ku'' mempertahankan cakupan dasar תּוֹרָה sebagai pengajaran atau arahan ilahi dalam konteks perintah mengenai manna, tanpa meniadakan bobot normatifnya. Alternatif ''hukum-Ku'' dicatat karena istilah tersebut juga dapat mengantisipasi tema Taurat yang lebih luas.'
- issue: Pelaku yang diuji dalam bentuk gramatikal tunggal
  choice: mereka
  alternative: dia
  rationale: Bentuk tunggal Ibrani mengikuti nomina kolektif 'bangsa itu'. Terjemahan 'mereka' menyampaikan bahwa umat sebagai suatu kelompok diuji, tanpa mengubah referennya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Sapaan jamak diterjemahkan 'kalian' agar bentuk jamak לָכֶם terlihat jelas. Metafora 'berjalan' dipertahankan, sedangkan konstruksi hujan diungkapkan secara alami sebagai 'menurunkan ... seperti hujan'.
