  text: וַ/יֹּאמְר֨וּ אֲלֵ/הֶ֜ם בְּנֵ֣י יִשְׂרָאֵ֗ל מִֽי יִתֵּ֨ן מוּתֵ֤/נוּ בְ/יַד יְהוָה֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/שִׁבְתֵּ֨/נוּ֙ עַל סִ֣יר הַ/בָּשָׂ֔ר בְּ/אָכְלֵ֥/נוּ לֶ֖חֶם לָ/שֹׂ֑בַע כִּֽי הוֹצֵאתֶ֤ם אֹתָ֨/נוּ֙ אֶל הַ/מִּדְבָּ֣ר הַ/זֶּ֔ה לְ/הָמִ֛ית אֶת כָּל הַ/קָּהָ֥ל הַ/זֶּ֖ה בָּ/רָעָֽב־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/003.yaml
  text: And the sons of Israel said to them[a], “If only we had died by the hand of Yahweh in the land of Egypt, when we sat by the pots of meat, when we ate bread to the full[c][b]. For you have brought us out into this wilderness to kill this whole assembly with hunger.”
translation:
  language: id
  text: Lalu orang-orang Israel berkata kepada mereka, “Seandainya kami mati di tangan Yahweh di tanah Mesir, ketika kami duduk di dekat periuk daging dan makan roti sampai kenyang! Sebab kalian telah membawa kami keluar ke padang belantara ini untuk membunuh seluruh umat ini dengan kelaparan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang-orang Israel
  rationale: Ungkapan ini secara harfiah berarti 'anak-anak lelaki Israel', tetapi dalam konteks menunjuk kepada bangsa Israel secara kolektif. 'Orang-orang Israel' alami dalam bahasa Indonesia dan tidak membatasi kelompok itu hanya pada laki-laki.
- source_word: מִי יִתֵּן מוּתֵנוּ
  choice: Seandainya kami mati
  rationale: מִי יִתֵּן merupakan idiom pengharapan atau penyesalan, bukan pertanyaan harfiah. Bentuk ini menyampaikan harapan kontrafaktual dengan wajar dalam bahasa Indonesia.
- source_word: בְיַד יְהוָה
  choice: oleh tangan Yahweh
  rationale: Mempertahankan citra konkret idiom Ibrani dan mengungkapkan bahwa kematian yang dibayangkan terjadi melalui tindakan atau kuasa Yahweh.
- source_word: בְּשִׁבְתֵּנוּ עַל סִיר הַבָּשָׂר
  choice: ketika kami duduk di dekat periuk-periuk berisi daging
  rationale: Menyampaikan konstruksi temporal dan gambaran periuk masak yang berisi daging dengan bahasa Indonesia yang jelas.
- source_word: בְּאָכְלֵנוּ לֶחֶם לָשֹׂבַע
  choice: dan makan roti sampai kenyang
  rationale: Mencerminkan kesejajaran temporal serta arti לָשֹׂבַע, yaitu makan hingga puas atau kenyang.
- source_word: הַמִּדְבָּר הַזֶּה
  choice: padang belantara ini
  rationale: מִדְבָּר menunjuk wilayah liar dan tidak berpenghuni, yang tidak selalu berupa gurun pasir; 'padang belantara' mempertahankan cakupan itu.
- source_word: כָּל הַקָּהָל הַזֶּה
  choice: seluruh umat ini
  rationale: קָהָל adalah kumpulan atau perhimpunan masyarakat. Dalam konteks Israel, 'umat' terdengar alami dan mempertahankan sifat kolektifnya tanpa memasukkan istilah gerejawi khusus.
- source_word: בָּרָעָב
  choice: dengan kelaparan
  rationale: Mengungkapkan kelaparan sebagai sarana atau keadaan yang menyebabkan kematian, sesuai fungsi preposisi בְּ.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama pribadi ilahi YHWH. 'Yahweh' mempertahankan nama tersebut, sedangkan 'TUHAN' adalah penggantian tradisional dengan gelar.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: orang-orang Israel
  alternative: anak-anak lelaki Israel
  rationale: Di sini ungkapan maskulin jamak berfungsi sebagai sebutan kolektif bagi bangsa Israel. Terjemahan idiomatis menghindari kesan keliru bahwa hanya laki-laki yang mengeluh.
- issue: Nuansa בְיַד יְהוָה
  choice: oleh tangan Yahweh
  alternative: oleh Yahweh
  rationale: Ungkapan sumber mempertahankan ketegangan bahwa mereka lebih memilih mati melalui tindakan Yahweh di Mesir daripada mati kelaparan di padang belantara; citra 'tangan' tidak dihapus.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk 'kalian' dipakai karena sasaran jamak הוֹצֵאתֶם adalah Musa dan Harun. Seruan pada kalimat pertama dipertahankan untuk menyampaikan keluhan emosional bangsa itu.
