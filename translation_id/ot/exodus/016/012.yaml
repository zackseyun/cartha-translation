id: EXO.16.12
reference: Exodus 16:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שָׁמַ֗עְתִּי אֶת תְּלוּנֹּת֮ בְּנֵ֣י יִשְׂרָאֵל֒ דַּבֵּ֨ר אֲלֵ/הֶ֜ם לֵ/אמֹ֗ר בֵּ֤ין הָֽ/עַרְבַּ֨יִם֙ תֹּאכְל֣וּ בָשָׂ֔ר וּ/בַ/בֹּ֖קֶר תִּשְׂבְּעוּ לָ֑חֶם וִֽ/ידַעְתֶּ֕ם כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/012.yaml
  text: I have heard the grumblings of the sons of Israel[a]. Speak to them, saying, ‘Between the evenings you shall eat meat, and in the morning you shall be filled with bread[b], and you shall know that I am Yahweh your God.’
translation:
  language: id
  text: Aku telah mendengar gerutuan orang Israel. Katakanlah kepada mereka, ‘Pada waktu senja[a] kamu akan makan daging, dan pada pagi hari kamu akan makan roti sampai kenyang. Dengan demikian kamu akan tahu bahwa Akulah Yahweh, Allahmu.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di antara kedua petang”; sebuah ungkapan Ibrani yang menunjuk pada waktu senja.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי
  choice: Aku telah mendengar
  rationale: Bentuk perfektif menyatakan tindakan yang sudah terjadi dan tetap relevan bagi tanggapan Yahweh sekarang.
- source_word: תְּלוּנֹּת
  choice: gerutuan
  rationale: Menunjukkan keluhan berulang yang bernada tidak puas, bukan sekadar pengaduan netral.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Dalam konteks kolektif ini, ungkapan tersebut menunjuk umat Israel secara keseluruhan; terjemahan ini alami dalam bahasa Indonesia dan tidak mempersempit rujukannya hanya kepada laki-laki.
- source_word: דַּבֵּר אֲלֵהֶם לֵאמֹר
  choice: Katakanlah kepada mereka
  rationale: Menyampaikan fungsi formula pengantar perkataan Ibrani secara alami tanpa meniru bentuknya secara kaku.
- source_word: בֵּין הָעַרְבַּיִם
  choice: pada waktu senja
  rationale: Mengungkapkan makna temporal idiom Ibrani dengan bahasa Indonesia yang jelas; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: תֹּאכְלוּ בָשָׂר
  choice: kamu akan makan daging
  rationale: Dalam konteks makanan, בָשָׂר secara alami berarti daging, sedangkan bentuk verba menyatakan apa yang akan terjadi.
- source_word: תִּשְׂבְּעוּ לָחֶם
  choice: kamu akan makan roti sampai kenyang
  rationale: Menangkap makna menjadi puas atau kenyang oleh roti dengan ungkapan Indonesia yang konkret dan alami.
- source_word: וִידַעְתֶּם
  choice: Dengan demikian kamu akan tahu
  rationale: 'Konteks memberi hubungan hasil: pemberian makanan membuat umat mengenali identitas Yahweh.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi dalam teks sumber sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Bentuk ini merujuk kepada Allah Israel dan memiliki sufiks orang kedua jamak; bahasa Indonesia tidak membedakan tunggal-jamak pada akhiran -mu.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama ilahi; transliterasi mempertahankan pembedaan antara nama dan gelar.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak lelaki Israel
  rationale: Walaupun bentuk leksikalnya secara harfiah adalah ‘anak-anak lelaki Israel’, dalam konteks ini ungkapan tersebut merupakan sebutan kolektif bagi umat yang bersungut-sungut. Terjemahan alami mempertahankan cakupan itu tanpa menambahkan pembatasan gender yang tidak dimaksudkan oleh konteks.
- issue: Hubungan וִידַעְתֶּם dengan tanda pemberian makanan
  choice: Dengan demikian kamu akan tahu
  alternative: dan kamu akan tahu
  rationale: Waw konsekutif dapat dibaca sebagai kelanjutan sekaligus hasil. Pilihan ini menyatakan daya hasil dalam konteks tanpa mengubah isi pengenalan yang dijanjikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan ilahi memakai ‘Aku’, sedangkan umat secara kolektif disapa dengan ‘kamu’, sesuai kelaziman bahasa Indonesia. Formula ujaran dibuat alami, sementara idiom Ibrani yang tidak transparan dijelaskan melalui catatan kaki.
