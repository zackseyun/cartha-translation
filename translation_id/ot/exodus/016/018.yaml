  text: וַ/יָּמֹ֣דּוּ בָ/עֹ֔מֶר וְ/לֹ֤א הֶעְדִּיף֙ הַ/מַּרְבֶּ֔ה וְ/הַ/מַּמְעִ֖יט לֹ֣א הֶחְסִ֑יר אִ֥ישׁ לְ/פִֽי אָכְל֖/וֹ לָקָֽטוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/018.yaml
  text: When they measured it by the omer[a], the one who gathered much had nothing left over, and the one who gathered little had no lack; each one gathered according to what he could eat.
translation:
  language: id
  text: Ketika mereka menakarnya dengan takaran omer, orang yang mengumpulkan banyak tidak berkelebihan, dan orang yang mengumpulkan sedikit tidak berkekurangan.[a] Masing-masing mengumpulkan sebanyak yang dapat dimakannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang yang memperoleh banyak tidak memiliki kelebihan, dan orang yang memperoleh sedikit tidak kekurangan apa pun.”
    reason: Alternatif ini mempertahankan partisipel Ibrani secara lebih umum sebagai jumlah yang dimiliki atau diperoleh, tanpa secara eksplisit memasok tindakan 'mengumpulkan'.
lexical_decisions:
- source_word: וַיָּמֹדּוּ
  choice: Ketika mereka menakarnya
  rationale: Bentuk wayyiqtol melanjutkan narasi, tetapi klausa ini secara alami menjadi latar waktu bagi hasil pengukuran yang menyusul. Akhiran -nya merujuk pada manna dalam konteks.
- source_word: בָעֹמֶר
  choice: dengan takaran omer
  rationale: עֹמֶר adalah satuan takaran bahan kering. Ungkapan ini mempertahankan satuan kuno tanpa konversi dan menjelaskan bahwa omer dipakai sebagai ukuran.
- source_word: הֶעְדִּיף ... הֶחְסִיר
  choice: tidak berkelebihan ... tidak berkekurangan
  rationale: Pasangan ini mempertahankan kontras ringkas dan seimbang antara kelebihan dan kekurangan dalam bahasa Indonesia yang wajar.
- source_word: הַמַּרְבֶּה ... הַמַּמְעִיט
  choice: orang yang mengumpulkan banyak ... orang yang mengumpulkan sedikit
  rationale: Secara bentuk, kedua partisipel menunjuk pada orang yang memperbanyak dan mengurangi; dalam konteks pengumpulan manna, kata 'mengumpulkan' membuat tindakan tersirat menjadi jelas tanpa mengubah maksud.
- source_word: אִישׁ
  choice: masing-masing
  rationale: Kata ini berfungsi distributif, menunjuk kepada setiap orang dalam kelompok, bukan hanya laki-laki dewasa.
- source_word: לְפִי אָכְלוֹ
  choice: sebanyak yang dapat dimakannya
  rationale: Ungkapan harfiah 'menurut mulut makannya' menyatakan jumlah yang sesuai dengan kemampuan atau kebutuhan makan seseorang.
- source_word: לָקָטוּ
  choice: mengumpulkan
  rationale: Ini adalah verba biasa untuk tindakan mengumpulkan manna dalam perikop ini.
theological_decisions:
- issue: Bentuk tunggal maskulin distributif dalam אִישׁ ... אָכְלוֹ
  choice: masing-masing ... yang dapat dimakannya
  alternative: setiap laki-laki ... menurut makannya
  rationale: Bahasa Ibrani memakai bentuk tunggal maskulin secara distributif. 'Masing-masing' mencakup setiap individu dalam konteks, sedangkan '-nya' mempertahankan struktur tunggal tanpa membatasi rujukan hanya kepada laki-laki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Istilah kuno 'omer' dipertahankan, disertai kata 'takaran' agar fungsinya langsung dipahami.
