revisions:
- from: Lalu Musa berkata kepada Harun, “Ambillah sebuah tempayan[a], masukkanlah manna sebanyak satu omer ke dalamnya, dan taruhlah itu di hadapan Yahweh untuk disimpan turun-temurun.”
  to: Lalu Musa berkata kepada Harun, “Ambillah sebuah tempayan[a], masukkanlah satu omer penuh manna ke dalamnya, dan taruhlah manna itu di hadapan Yahweh untuk disimpan turun-temurun.”
  rationale: Revisi menambahkan unsur “penuh” untuk menerjemahkan מְלֹא, dan mengganti kata ganti Indonesia yang tidak jelas dengan “manna itu,” sesuai gender maskulin objek אֹתוֹ dan anteceden yang paling langsung. Pilihan “tempayan” serta nama ilahi “Yahweh” dipertahankan. Catatan kaki diperjelas dengan alternatif leksikal yang lebih bermakna.
