source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶֽל אַהֲרֹ֗ן קַ֚ח צִנְצֶ֣נֶת אַחַ֔ת וְ/תֶן שָׁ֥מָּ/ה מְלֹֽא הָ/עֹ֖מֶר מָ֑ן וְ/הַנַּ֤ח אֹת/וֹ֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/מִשְׁמֶ֖רֶת לְ/דֹרֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/033.yaml
  text: And Moses said to Aaron[a], “Take one jar, and put an omerful of manna in it, and place it before Yahweh, to be kept throughout your generations.”
translation:
  language: id
  text: Lalu Musa berkata kepada Harun, “Ambillah sebuah tempayan[a], masukkanlah satu omer penuh manna ke dalamnya, dan taruhlah manna itu di hadapan Yahweh untuk disimpan turun-temurun.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bejana.” Jenis tepat wadah yang disebut oleh צִנְצֶנֶת tidak diketahui dengan pasti.
    reason: alternatif_leksikal
lexical_decisions:
- source_word: צִנְצֶנֶת
  choice: tempayan
  rationale: Kata ini menunjuk pada wadah. “Tempayan” merupakan sebutan Indonesia yang alami untuk wadah penyimpanan dan tidak menyiratkan alat memasak.
- source_word: מְלֹא הָעֹמֶר
  choice: sebanyak satu omer
  rationale: Ungkapan ini menyatakan isi penuh menurut takaran omer. Rumusan ini mempertahankan nama satuan kuno sekaligus menyampaikan jumlahnya secara wajar dalam bahasa Indonesia.
- source_word: מָן
  choice: manna
  rationale: “Manna” adalah bentuk baku dan dikenal luas dalam bahasa Indonesia untuk bahan makanan yang disebut dalam konteks ini.
- source_word: וְתֶן שָׁמָּה
  choice: masukkanlah ... ke dalamnya
  rationale: Secara harfiah berarti “taruhlah di sana”; dalam konteksnya, “di sana” merujuk pada wadah yang baru disebut. Ungkapan eksplisit ini lebih alami dan jelas dalam bahasa Indonesia.
- source_word: וְהַנַּח אֹתוֹ
  choice: taruhlah itu
  rationale: Kata kerja ini berarti menaruh atau meletakkan. Kata ganti “itu” dibiarkan memiliki rujukan kontekstual sebagaimana teks Ibrani, kemungkinan pada wadah berisi manna.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Ungkapan ini secara langsung menyatakan posisi atau kehadiran di hadapan Yahweh dan sesuai dengan suasana ritual ayat ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks sumber dipertahankan dan tidak diganti dengan gelar.
- source_word: לְמִשְׁמֶרֶת
  choice: untuk disimpan
  rationale: Nomina ini menyampaikan gagasan penjagaan atau pemeliharaan; dalam konteks ini manna dimaksudkan untuk disimpan sebagai benda yang dilestarikan.
- source_word: לְדֹרֹתֵיכֶם
  choice: turun-temurun
  rationale: Ungkapan idiomatis Indonesia ini menyampaikan keberlangsungan melalui generasi-generasi Israel.
- source_word: קַח ... אַחַת
  choice: Ambillah sebuah tempayan
  rationale: Numeralia feminin “satu” menyesuaikan dengan nomina wadah dan dalam bahasa Indonesia paling alami dinyatakan dengan “sebuah”, tetap menunjukkan satu wadah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama tersebut melalui transliterasi tanpa menggantinya dengan gelar.
- issue: Rujukan kata ganti pada וְהַנַּח אֹתוֹ
  choice: taruhlah itu
  alternative: taruhlah tempayan itu
  rationale: Bentuk Ibrani hanya memakai kata ganti objek maskulin dan tidak mengulang nomina. Terjemahan “itu” menjaga keluasan rujukannya daripada secara diam-diam menetapkan bahwa objeknya semata-mata tempayan atau manna.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk perintah memakai akhiran -lah agar wajar dalam tuturan langsung. Nama satuan kuno “omer” dipertahankan, dan susunan kalimat dibuat alami tanpa menghilangkan ambiguitas kata ganti dalam teks sumber.
