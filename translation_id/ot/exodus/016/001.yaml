  text: וַ/יִּסְעוּ֙ מֵֽ/אֵילִ֔ם וַ/יָּבֹ֜אוּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ אֶל מִדְבַּר סִ֔ין אֲשֶׁ֥ר בֵּין אֵילִ֖ם וּ/בֵ֣ין סִינָ֑י בַּ/חֲמִשָּׁ֨ה עָשָׂ֥ר יוֹם֙ לַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֔י לְ/צֵאתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/001.yaml
  text: They set out from Elim[a], and the whole congregation of the sons of Israel came to the wilderness of Sin, which is between Elim and Sinai[b], on the fifteenth day of the second month after they had gone out from the land of Egypt.
translation:
  language: id
  text: Mereka berangkat dari Elim, lalu seluruh umat Israel[a] tiba di Padang Gurun Sin[b], yang terletak di antara Elim dan Sinai, pada hari kelima belas bulan kedua setelah mereka keluar dari tanah Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Israel.” Ini adalah sebutan kebangsaan yang dapat mencakup seluruh umat Israel, bukan hanya laki-laki.
    reason: lexical_alternative
  - marker: b
    text: “Sin” di sini adalah nama tempat, yaitu Padang Gurun Sin, bukan kata yang berarti dosa.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam kisah perjalanan di padang gurun, verba נסע menunjuk pada tindakan membongkar perkemahan lalu meneruskan perjalanan. “Berangkat” menyampaikan gerak perjalanan itu secara wajar dalam bahasa Indonesia.
- source_word: מֵאֵילִם
  choice: dari Elim
  rationale: אֵילִם adalah nama tempat dan ditransliterasikan sebagai “Elim”.
- source_word: וַיָּבֹאוּ
  choice: tiba
  rationale: Verba בוא adalah verba gerak yang umum. Dalam rangkaian perjalanan ini, “tiba” secara alami menunjukkan sampainya mereka di tujuan tanpa menambahkan gagasan yang tidak ada dalam teks.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: seluruh umat keturunan Israel
  rationale: עֵדָה menunjuk pada komunitas atau umat yang berhimpun, sedangkan בְּנֵי יִשְׂרָאֵל secara harfiah berarti “anak-anak Israel” tetapi berfungsi sebagai sebutan kebangsaan bagi seluruh umat Israel. “Keturunan Israel” mempertahankan unsur kekerabatan tanpa memberi kesan bahwa yang dimaksud hanya laki-laki.
- source_word: אֶל מִדְבַּר סִין
  choice: di Padang Gurun Sin
  rationale: מִדְבָּר menunjuk pada kawasan tandus atau belantara; “padang gurun” merupakan padanan Indonesia yang mapan. סִין adalah nama tempat, bukan istilah moral, dan ditransliterasikan “Sin”.
- source_word: אֲשֶׁר בֵּין אֵילִם וּבֵין סִינָי
  choice: yang terletak di antara Elim dan Sinai
  rationale: Klausa relatif ini menjelaskan letak Padang Gurun Sin. Kata “terletak” membuat hubungan geografisnya jelas dan alami dalam bahasa Indonesia.
- source_word: בַּחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשֵּׁנִי
  choice: pada hari kelima belas bulan kedua
  rationale: Ini adalah bentuk tanggal Ibrani. Susunan tersebut merupakan padanan Indonesia yang alami dan tetap dekat dengan bentuk sumber.
- source_word: לְצֵאתָם מֵאֶרֶץ מִצְרָיִם
  choice: setelah mereka keluar dari tanah Mesir
  rationale: Infinitif dengan prefiks לְ menetapkan peristiwa keluarnya mereka sebagai patokan waktu. “Setelah” menyatakan hubungan waktu itu dengan jelas, sedangkan “tanah Mesir” mempertahankan unsur אֶרֶץ.
