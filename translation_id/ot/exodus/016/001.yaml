translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur narasi dibuat lancar dengan “lalu,” sementara nama tempat, urutan perjalanan, dan penanggalan dipertahankan. Kapitalisasi “Padang Gurun Sin” menandai satu nama geografis.
