base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/022.yaml
  text: And it happened on the sixth day that they gathered twice as much bread[a], two omers for each person, and all the leaders of the congregation came and told Moses.
translation:
  language: id
  text: Pada hari keenam, mereka mengumpulkan roti dalam jumlah dua kali lipat, yaitu dua omer[a] untuk setiap orang. Lalu semua pemimpin umat itu datang dan memberi tahu Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Omer adalah satuan takaran kering yang digunakan di Israel kuno.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי
  choice: Pada hari keenam
  rationale: Dalam narasi Ibrani, וַיְהִי membuka peristiwa berikutnya. Bahasa Indonesia alami tidak perlu menerjemahkannya secara terpisah sebagai 'terjadilah'; fungsi naratifnya tersampaikan melalui pembukaan temporal.
- source_word: בַּיּוֹם הַשִּׁשִּׁי
  choice: pada hari keenam
  rationale: Padanan temporal yang langsung, baku, dan alami dalam bahasa Indonesia.
- source_word: לָקְטוּ
  choice: mereka mengumpulkan
  rationale: Kata לקט dalam konteks manna menunjuk pada tindakan memungut atau menghimpun persediaan; 'mengumpulkan' jelas dan cukup dekat dengan sumber.
- source_word: לֶחֶם מִשְׁנֶה
  choice: roti dua kali lebih banyak
  rationale: Mempertahankan לֶחֶם sebagai 'roti' dan menyampaikan מִשְׁנֶה sebagai jumlah ganda secara alami, yang kemudian dijelaskan oleh ukuran dua omer.
- source_word: שְׁנֵי הָעֹמֶר
  choice: dua omer
  rationale: Omer adalah satuan takaran kering kuno; transliterasi mempertahankan istilah budaya sumber tanpa memberi konversi modern yang semu.
- source_word: לָאֶחָד
  choice: untuk setiap orang
  rationale: Ungkapan harfiah 'untuk satu' berfungsi distributif dalam konteks ini; 'untuk setiap orang' menyatakan maksudnya dengan jelas.
- source_word: כָּל נְשִׂיאֵי הָעֵדָה
  choice: semua pemimpin umat itu
  rationale: נְשִׂיאֵי menunjuk para pemimpin yang diakui, sedangkan עֵדָה adalah komunitas Israel. 'Umat' alami dalam konteks ini dan tidak menyiratkan bangunan atau organisasi gerejawi.
- source_word: וַיָּבֹאוּ ... וַיַּגִּידוּ לְמֹשֶׁה
  choice: datang dan memberitahukannya kepada Musa
  rationale: Mempertahankan urutan kedua tindakan. Akhiran '-nya' secara alami merujuk pada keadaan yang baru dilaporkan, yaitu pengumpulan jumlah ganda.
