translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dibagi pada peralihan tindakan agar mudah dibaca tanpa mengubah urutan narasi Ibrani. Istilah 'roti' dipertahankan meskipun yang dimaksud dalam konteks adalah manna.
