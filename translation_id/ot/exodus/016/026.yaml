  text: שֵׁ֥שֶׁת יָמִ֖ים תִּלְקְטֻ֑/הוּ וּ/בַ/יּ֧וֹם הַ/שְּׁבִיעִ֛י שַׁבָּ֖ת לֹ֥א יִֽהְיֶה בּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/026.yaml
  text: For six days you shall gather it[a], but on the seventh day, a Sabbath[c][b], there will be none.
translation:
  language: id
  text: Selama enam hari kamu harus mengumpulkannya, tetapi pada hari ketujuh, yaitu hari Sabat[a], tidak akan ada manna[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “hari ketujuh, Sabat.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tidak akan ada padanya,” yaitu pada hari itu; yang dimaksud dalam konteks ialah manna.
    reason: clarification
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Selama enam hari
  rationale: Frasa konstruksi ini secara idiomatis menyatakan rentang waktu enam hari; 'selama' membuat fungsi temporalnya jelas dan alami dalam bahasa Indonesia.
- source_word: תִּלְקְטֻהוּ
  choice: kamu harus mengumpulkannya
  rationale: Bentuk verba berpersona kedua jamak dengan sufiks objek maskulin tunggal berarti 'kamu sekalian mengumpulkannya'. Pronomina 'kamu' dapat berfungsi jamak dalam bahasa Indonesia, sedangkan 'harus' menyampaikan daya instruktif dalam konteks.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: tetapi pada hari ketujuh
  rationale: 'Waw pada konteks ini menghubungkan dua keadaan yang berlawanan: pengumpulan berlangsung enam hari, tetapi tidak pada hari ketujuh. ''Tetapi'' menyampaikan pertentangan itu secara alami.'
- source_word: שַׁבָּת
  choice: hari Sabat
  rationale: Nomina ini ditempatkan secara aposisional sesudah 'hari ketujuh'. 'Hari Sabat' mempertahankan istilah khusus Ibrani dan lebih wajar daripada 'suatu Sabat' dalam bahasa Indonesia.
- source_word: לֹא יִהְיֶה בּוֹ
  choice: tidak akan ada manna
  rationale: Secara harfiah, klausa ini berbunyi 'tidak akan ada padanya/di dalamnya', dengan subjek yang dilesapkan dan pronomina yang merujuk kepada hari itu. Konteks langsung menunjukkan bahwa yang tidak ada ialah manna; menyebutkannya menghindari ungkapan Indonesia yang kabur tanpa mengubah maksud.
theological_decisions:
- issue: Pemaknaan שַׁבָּת sebelum pemberian hukum di Sinai
  choice: hari Sabat
  alternative: hari perhentian
  rationale: Mempertahankan 'Sabat' menjaga istilah teks dan tidak mereduksinya menjadi sekadar istirahat biasa. Bentuk aposisi 'yaitu hari Sabat' mengidentifikasi hari ketujuh tanpa memasukkan rincian teologis atau liturgis yang tidak dinyatakan ayat ini.
- issue: Referen tersirat dalam לֹא יִהְיֶה בּוֹ
  choice: menyatakan 'manna' dalam teks dan memberi catatan tentang bentuk harfiahnya
  alternative: tidak akan ada padanya
  rationale: Bahasa Ibrani membiarkan subjek tersirat dari konteks, sedangkan 'tidak akan ada padanya' terasa tidak lengkap dan tidak alami dalam bahasa Indonesia. Penyebutan manna menjelaskan elipsis kontekstual, sementara catatan kaki mempertahankan transparansi terhadap bentuk sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Susunan kalimat mempertahankan kontras antara enam hari dan hari ketujuh serta aposisi yang mengidentifikasi hari ketujuh sebagai Sabat.
