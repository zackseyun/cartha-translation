  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה זֶ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֔ה מְלֹ֤א הָ/עֹ֨מֶר֙ מִמֶּ֔/נּוּ לְ/מִשְׁמֶ֖רֶת לְ/דֹרֹתֵי/כֶ֑ם לְמַ֣עַן יִרְא֣וּ אֶת הַ/לֶּ֗חֶם אֲשֶׁ֨ר הֶאֱכַ֤לְתִּי אֶתְ/כֶם֙ בַּ/מִּדְבָּ֔ר בְּ/הוֹצִיאִ֥/י אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/032.yaml
  text: 'And Moses said[a], “This is the thing that Yahweh has commanded: Let a full omer of it be kept throughout your generations, so that they may see the bread with which I fed you in the wilderness, when I brought you out from the land of Egypt.”'
translation:
  language: id
  text: 'Lalu Musa berkata, “Inilah yang diperintahkan Yahweh: Satu omer[a] penuh dari manna itu harus disimpan turun-temurun, supaya mereka dapat melihat roti yang dengannya Aku memberi kamu makan di padang belantara ketika Aku membawa kamu keluar dari tanah Mesir.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Omer adalah satuan takaran kering kuno; yang dimaksud di sini ialah satu takaran omer penuh.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  choice: Lalu Musa berkata
  rationale: Wayyiqtol melanjutkan alur narasi; “lalu” alami dalam bahasa Indonesia tanpa harus meniru waw secara kaku.
- source_word: זֶה הַדָּבָר אֲשֶׁר צִוָּה יְהוָה
  choice: Inilah yang diperintahkan Yahweh
  rationale: דָּבָר di sini menunjuk isi perintah, sehingga “yang diperintahkan” lebih alami daripada “hal/firman ini”; nama perjanjian יְהוָה ditransliterasikan Yahweh.
- source_word: מְלֹא הָעֹמֶר מִמֶּנּוּ
  choice: Ambillah satu omer penuh dari manna itu
  rationale: Frasa nominal eliptis dipahami sebagai isi perintah untuk menyediakan satu takaran penuh. Referen pronomina diperjelas sebagai manna dari konteks dekat.
- source_word: לְמִשְׁמֶרֶת לְדֹרֹתֵיכֶם
  choice: untuk disimpan turun-temurun
  rationale: Mengungkapkan tujuan penyimpanan dan keberlanjutannya sepanjang generasi dengan idiom Indonesia yang ringkas.
- source_word: לְמַעַן יִרְאוּ
  choice: supaya mereka dapat melihat
  rationale: Mempertahankan klausa tujuan dan subjek tersirat, yakni generasi-generasi mendatang.
- source_word: הַלֶּחֶם
  choice: makanan
  rationale: לֶחֶם dapat berarti roti atau makanan; untuk manna yang hendak dilihat dalam wadah, “makanan” terdengar alami sambil mempertahankan kategori umum dalam teks.
- source_word: אֲשֶׁר הֶאֱכַלְתִּי אֶתְכֶם
  choice: yang Kuberikan kepadamu
  rationale: Hifil אכל berarti menyebabkan makan atau memberi makan. Pilihan ini alami dan menyatakan penyediaan ilahi tanpa menambahkan objek baru.
- source_word: בַּמִּדְבָּר
  choice: di padang belantara
  rationale: Mencakup kawasan liar dan tandus yang dimaksud מִדְבָּר, tanpa membatasinya pada gurun pasir.
- source_word: בְּהוֹצִיאִי אֶתְכֶם מֵאֶרֶץ מִצְרָיִם
  choice: ketika Aku membawa kamu keluar dari tanah Mesir
  rationale: Infinitif dengan בְּ menyatakan keadaan temporal; “tanah Mesir” mempertahankan אֶרֶץ secara wajar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung; “Yahweh” mempertahankan nama perjanjian dan mengikuti lapisan konsultasi yang telah diaudit.
- issue: Identitas pembicara dalam kutipan perintah
  choice: Huruf kapital pada “Kuberikan” dan “Aku”
  alternative: Huruf kecil tanpa penandaan khusus
  rationale: Orang pertama dalam perintah merujuk kepada Yahweh, bukan Musa. Kapitalisasi membantu pembaca Indonesia mengenali referennya tanpa mengubah isi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Istilah kuno “omer” dipertahankan dan diterangkan dalam catatan kaki. Penanda catatan [a] ditempatkan setelah kutipan yang memuat istilah tersebut.
