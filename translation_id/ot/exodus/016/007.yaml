source:
  edition: WLC
  text: וּ/בֹ֗קֶר וּ/רְאִיתֶם֙ אֶת כְּב֣וֹד יְהוָ֔ה בְּ/שָׁמְע֥/וֹ אֶת תְּלֻנֹּתֵי/כֶ֖ם עַל יְהוָ֑ה וְ/נַ֣חְנוּ מָ֔ה כִּ֥י תלונו עָלֵֽי/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/007.yaml
  text: And in the morning you will see the glory of Yahweh[a], because he has heard your grumblings against Yahweh. And what are we, that you grumble against us?
translation:
  language: id
  text: Pada pagi hari kalian akan melihat kemuliaan Yahweh, karena Ia telah mendengar gerutuan kalian terhadap Yahweh.[a] Dan apakah kami ini, sehingga kalian menggerutu terhadap kami?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ketika Ia mendengar gerutuan kalian terhadap Yahweh.” Konstruksi Ibraninya dapat dipahami secara temporal maupun kausal.
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בֹקֶר
  choice: Pada pagi hari
  rationale: Gabungan waw dengan nomina berfungsi adverbial sebagai penanda waktu. Dalam bahasa Indonesia, urutan peristiwa tetap jelas tanpa harus menerjemahkan waw secara mekanis sebagai “dan”.
- source_word: וּ/רְאִיתֶם
  choice: kamu akan melihat
  rationale: Bentuk Qal dalam rangkaian konteks ini menyatakan peristiwa yang akan terjadi; bentuk masa depan ini wajar dan jelas dalam bahasa Indonesia.
- source_word: כְּבוֹד יְהוָה
  choice: kemuliaan Yahweh
  rationale: כָּבוֹד di sini menunjuk pada kemegahan atau kehadiran Yahweh yang dinyatakan. “Kemuliaan Yahweh” mempertahankan resonansi teologis dan bentuk hubungan antarnomina.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” agar nama diri dalam teks Ibrani tetap tampak, bukan diganti dengan gelar.
- source_word: בְּ/שָׁמְע/וֹ
  choice: karena Ia telah mendengar
  rationale: Preposisi ב dengan infinitif konstruk dapat bernuansa kausal ataupun temporal. Dalam konteks ini, nuansa kausal paling alami menjelaskan mengapa kemuliaan Yahweh akan terlihat; kemungkinan temporal dicatat dalam catatan kaki.
- source_word: תְּלֻנֹּתֵיכֶם
  choice: gerutuanmu
  rationale: Nomina ini menyatakan keluhan bernada tidak puas dan menentang. “Gerutuan” lebih tajam daripada “keluhan” dan lebih alami daripada istilah yang arkais.
- source_word: עַל יְהוָה
  choice: terhadap Yahweh
  rationale: Dengan kosakata menggerutu, עַל menunjukkan sasaran keluhan atau sikap menentang. “Terhadap” menyampaikan arah tersebut secara alami.
- source_word: וְנַחְנוּ מָה
  choice: Memangnya siapakah kami ini
  rationale: Ungkapan retoris ini menekankan ketidakpentingan Musa dan Harun sebagai sasaran gerutuan. “Memangnya” menghadirkan daya retorisnya secara wajar, sedangkan “siapakah” lebih idiomatis daripada terjemahan harfiah “apakah” ketika merujuk kepada orang.
- source_word: כִּי
  choice: sehingga
  rationale: כִּי menghubungkan pertanyaan retoris dengan tindakan bangsa itu. “Sehingga” secara idiomatis menyampaikan arti “bahwa sampai kamu...” tanpa memaksakan hubungan sebab yang berbeda.
- source_word: תלונו
  choice: kamu menggerutu
  rationale: Pilihan ini mempertahankan hubungan leksikal dengan “gerutuanmu” dan nada negatif dari verba Ibrani.
- source_word: עָלֵינוּ
  choice: terhadap kami
  rationale: Preposisi menunjukkan Musa dan Harun sebagai sasaran gerutuan; “terhadap kami” sejajar dengan “terhadap Yahweh”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama diri ilahi secara langsung. “Yahweh” mempertahankan fungsi nama itu dan tidak menggantinya dengan gelar.
- issue: Nuansa kausal atau temporal dari בְּשָׁמְעוֹ
  choice: karena Ia telah mendengar
  alternative: ketika Ia mendengar
  rationale: Konteks mendukung hubungan kausal antara gerutuan Israel dan penampakan kemuliaan Yahweh, tetapi konstruksi Ibraninya juga memungkinkan pembacaan temporal; alternatif itu dipertahankan dalam catatan kaki.
- issue: Sasaran gerutuan bangsa itu
  choice: terhadap Yahweh ... terhadap kami
  alternative: tentang Yahweh ... tentang kami
  rationale: עַל bersama istilah gerutuan di sini lebih kuat daripada sekadar penanda topik dan menunjukkan gerutuan yang diarahkan kepada pihak tertentu. Kesejajaran kedua frasa dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pronomina tunggal “kamu” mengikuti sapaan kolektif tunggal dalam bahasa Indonesia, sementara bentuk sumber merujuk kepada umat secara jamak. Huruf kapital pada “Ia” dipakai sebagai konvensi penerbitan untuk rujukan kepada Allah. Catatan kaki ditempatkan sesudah klausa yang dipersoalkan agar cakupannya jelas.
