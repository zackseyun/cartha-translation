  yaml_path: translation/ot/exodus/016/005.yaml
  text: And on the sixth day[a], when they prepare what they bring in, it will be twice as much as what they gather day by day.
translation:
  language: id
  text: Pada hari keenam, ketika mereka menyiapkan apa yang mereka bawa, jumlahnya akan menjadi dua kali lipat daripada yang mereka kumpulkan hari demi hari.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jumlahnya akan menjadi porsi ganda dibandingkan dengan yang mereka kumpulkan setiap hari.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Pada ... jumlahnya akan
  rationale: Bentuk ini memperkenalkan keadaan atau hasil yang akan terjadi; susunan Indonesia memakai penanda waktu dan bentuk futur yang alami.
- source_word: בַּיּוֹם הַשִּׁשִּׁי
  choice: pada hari keenam
  rationale: Menerjemahkan frasa waktu secara langsung tanpa menambahkan 'dalam minggu', yang tidak dinyatakan eksplisit.
- source_word: וְהֵכִינוּ
  choice: ketika mereka menyiapkan
  rationale: Dalam konteks instruksi ini, tindakan tersebut paling alami dipahami sebagai keadaan temporal yang berlangsung pada hari keenam.
- source_word: אֵת אֲשֶׁר יָבִיאוּ
  choice: apa yang mereka bawa pulang
  rationale: Frasa ini menunjuk pada bahan yang dikumpulkan lalu dibawa ke tempat tinggal; 'pulang' menyampaikan arah membawa masuk secara alami dalam konteks.
- source_word: וְהָיָה מִשְׁנֶה
  choice: jumlahnya akan dua kali lipat
  rationale: מִשְׁנֶה menyatakan jumlah ganda; ungkapan ini alami dan tepat dalam bahasa Indonesia.
- source_word: עַל אֲשֶׁר
  choice: dari yang
  rationale: Preposisi bersama klausa relatif menyatakan perbandingan ukuran; hubungan perbandingan sudah diperjelas oleh 'dua kali lipat'.
- source_word: יִלְקְטוּ
  choice: mereka kumpulkan
  rationale: לקט dalam konteks manna berarti memungut atau mengumpulkan; 'mengumpulkan' paling sesuai dengan konteks dan register.
- source_word: יוֹם יוֹם
  choice: hari demi hari
  rationale: Pengulangan Ibrani bersifat distributif dan berulang; ungkapan ini mempertahankan ritme serta makna tersebut.
