translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dijaga dekat dengan urutan Ibrani sejauh tetap alami; penambahan 'minggu' dihindari karena tidak eksplisit dalam teks sumber.
