base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/014.yaml
  text: When the layer of dew had gone up[a], behold, on the surface of the wilderness was a fine, flaky thing, fine as frost on the ground.
translation:
  language: id
  text: Ketika lapisan embun itu terangkat, tampaklah di permukaan padang belantara sesuatu yang halus dan berserpih-serpih[a], halus seperti embun beku di atas tanah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sesuatu yang halus, seperti serpihan”; arti tepat istilah Ibrani yang langka ini tidak pasti dan mungkin menggambarkan tekstur atau penampilannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַל
  choice: terangkat
  rationale: Secara harfiah verba עלה berarti 'naik'. Dalam konteks embun yang menghilang, 'terangkat' mempertahankan gambaran Ibrani tanpa memperjelasnya secara berlebihan sebagai 'menguap'.
- source_word: שִׁכְבַת הַטָּל
  choice: lapisan embun
  rationale: שִׁכְבָה menunjuk pada lapisan atau massa yang terbentang; 'lapisan embun' alami dan tepat dalam bahasa Indonesia.
- source_word: וְהִנֵּה
  choice: tampaklah
  rationale: Partikel הִנֵּה menarik perhatian kepada penampakan yang mendadak. 'Tampaklah' menjaga daya hidup narasi dalam register Indonesia yang bermartabat.
- source_word: עַל פְּנֵי הַמִּדְבָּר
  choice: di permukaan padang belantara
  rationale: פְּנֵי secara idiomatis berarti 'permukaan', sedangkan 'padang belantara' menyampaikan מִדְבָּר tanpa membatasinya pada gurun pasir.
- source_word: דַּק
  choice: halus
  rationale: דַּק dapat berarti halus atau tipis. 'Halus' cocok bagi kedua kemunculannya dan mempertahankan pengulangan sumber.
- source_word: מְחֻסְפָּס
  choice: bersisik
  rationale: Istilah langka ini tidak pasti dan agaknya menggambarkan tekstur atau rupa seperti sisik/serpihan. 'Bersisik' mempertahankan gambaran konkret, sementara ketidakpastiannya dijelaskan dalam catatan kaki.
- source_word: דַּק כַּכְּפֹר
  choice: halus seperti bunga es
  rationale: כְּפֹר berarti embun beku atau bunga es. 'Bunga es' merupakan ungkapan Indonesia yang mudah dipahami dan mempertahankan perbandingan visual.
- source_word: עַל הָאָרֶץ
  choice: di atas tanah
  rationale: Dalam konteks fisik langsung ini, אֶרֶץ paling alami diterjemahkan sebagai 'tanah'.
