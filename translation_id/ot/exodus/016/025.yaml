  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אִכְלֻ֣/הוּ הַ/יּ֔וֹם כִּֽי שַׁבָּ֥ת הַ/יּ֖וֹם לַ/יהוָ֑ה הַ/יּ֕וֹם לֹ֥א תִמְצָאֻ֖/הוּ בַּ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/025.yaml
  text: And Moses said, “Eat it today, because today is a Sabbath to the LORD; today you will not find it in the field.”
translation:
  language: id
  text: Lalu Musa berkata, “Makanlah itu hari ini, sebab hari ini adalah hari Sabat bagi TUHAN. Hari ini kamu tidak akan menemukannya di padang.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִכְלֻהוּ
  choice: Makanlah itu
  rationale: Bentuk imperatif jamak dengan pronomina objek tunggal; bahasa Indonesia tidak perlu menandai jamak pada verba, dan ‘itu’ mempertahankan objek yang merujuk kepada manna.
- source_word: כִּי
  choice: sebab
  rationale: Menyatakan alasan bagi perintah untuk memakannya pada hari itu.
- source_word: שַׁבָּת
  choice: hari Sabat
  rationale: Istilah baku dan mudah dipahami untuk hari perhentian yang dimaksud dalam konteks.
- source_word: לַיהוָה
  choice: bagi TUHAN
  rationale: Preposisi לְ dipertahankan secara alami sebagai ‘bagi’; nama ilahi יהוה mengikuti konvensi penerjemahan Indonesia dengan huruf kapital kecil secara semantis, ditampilkan sebagai TUHAN.
- source_word: בַּשָּׂדֶה
  choice: di padang
  rationale: Merujuk pada tempat terbuka di luar perkemahan tempat manna biasanya ditemukan; ‘padang’ mempertahankan gambaran sumber.
theological_decisions:
- issue: Hubungan hari Sabat dengan TUHAN
  choice: hari Sabat bagi TUHAN
  alternative: hari Sabat milik TUHAN
  rationale: ‘Bagi TUHAN’ mempertahankan keluwesan relasi yang dinyatakan oleh לְ tanpa mempersempitnya hanya menjadi kepemilikan.
- issue: Penerjemahan nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH/Yahweh
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia yang luas dikenal, tanpa menambahkan catatan karena ayat ini tidak menuntut pembahasan tekstual khusus.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan ‘hari ini’ dipertahankan tiga kali karena menonjol dalam teks Ibrani dan menegaskan kekhususan hari Sabat.
