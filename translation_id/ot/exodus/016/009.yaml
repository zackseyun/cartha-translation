id: EXO.16.9
reference: Exodus 16:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶֽל אַהֲרֹ֔ן אֱמֹ֗ר אֶֽל כָּל עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל קִרְב֖וּ לִ/פְנֵ֣י יְהוָ֑ה כִּ֣י שָׁמַ֔ע אֵ֖ת תְּלֻנֹּתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/009.yaml
  text: Then Moses said to Aaron[a], “Say to all the congregation of the sons of Israel, ‘Come near before Yahweh[b], for he has heard your grumblings.’”
translation:
  language: id
  text: Lalu Musa berkata kepada Harun, “Katakanlah kepada seluruh umat Israel[a], ‘Datanglah mendekat ke hadapan Yahweh[b], sebab Dia telah mendengar sungut-sungut kalian.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seluruh jemaat bani Israel,” yaitu seluruh umat Israel.
    reason: lexical_alternative
  - marker: b
    text: Nama Ibrani יהוה (YHWH); dalam banyak terjemahan ditulis “TUHAN.”
    reason: textual_clarification
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menyampaikan perkembangan peristiwa secara alami dalam bahasa Indonesia.
- source_word: אֱמֹר
  choice: Katakanlah
  rationale: Bentuk imperatif kepada Harun yang memperkenalkan perkataan langsung; “katakanlah” jelas, wajar, dan mempertahankan nada perintah.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: seluruh umat Israel
  rationale: עֵדָה menunjuk kepada komunitas atau himpunan umat secara keseluruhan. “Seluruh umat Israel” alami dalam bahasa Indonesia modern, sedangkan bentuk Ibrani yang lebih harfiah dicatat dalam catatan kaki.
- source_word: קִרְבוּ
  choice: Datanglah mendekat
  rationale: Imperatif קרב menyuruh umat bergerak mendekat. Pilihan ini mempertahankan unsur gerak dan kedekatan tanpa memakai ungkapan yang terlalu arkais.
- source_word: לִפְנֵי יְהוָה
  choice: ke hadapan Yahweh
  rationale: לִפְנֵי berarti “di hadapan/ke hadapan” atau “ke dalam hadirat.” Dengan verba gerak, “ke hadapan” menyampaikan arah pendekatan secara tepat.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi perintah untuk mendekat; “sebab” ringkas dan sesuai dengan ragam bahasa yang bermartabat.
- source_word: שָׁמַע
  choice: telah mendengar
  rationale: Qatal menyatakan tindakan yang sudah terjadi dan relevan bagi perintah saat ini; “telah mendengar” menyampaikan aspek tersebut dengan baik.
- source_word: תְּלֻנֹּתֵיכֶם
  choice: sungut-sungut kalian
  rationale: Nomina ini mengacu pada keluhan umat yang bernada menggerutu atau memberontak. “Sungut-sungut” mempertahankan nuansa itu lebih baik daripada “keluhan” yang lebih netral.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama perjanjian יהוה. “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar, sementara catatan kaki menjelaskan kebiasaan terjemahan lain.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan jamak “kalian” dipakai agar sufiks orang kedua jamak pada תְּלֻנֹּתֵיכֶם tersampaikan dengan jelas. Struktur perkataan berlapis dipertahankan sesuai teks Ibrani.
