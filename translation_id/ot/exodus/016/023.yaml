  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם ה֚וּא אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֔ה שַׁבָּת֧וֹן שַׁבַּת קֹ֛דֶשׁ לַֽ/יהוָ֖ה מָחָ֑ר אֵ֣ת אֲשֶׁר תֹּאפ֞וּ אֵפ֗וּ וְ/אֵ֤ת אֲשֶֽׁר תְּבַשְּׁלוּ֙ בַּשֵּׁ֔לוּ וְ/אֵת֙ כָּל הָ֣/עֹדֵ֔ף הַנִּ֧יחוּ לָ/כֶ֛ם לְ/מִשְׁמֶ֖רֶת עַד הַ/בֹּֽקֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/023.yaml
  text: 'And he said to them[a], “This is what Yahweh has spoken: Tomorrow is a solemn rest, a holy Sabbath to Yahweh. What you will bake, bake; and what you will boil, boil; and all that is left over[b], set aside for yourselves to be kept until the morning.”'
translation:
  language: id
  text: 'Ia berkata kepada mereka, “Inilah yang telah difirmankan Yahweh: Besok adalah hari perhentian penuh, Sabat kudus bagi Yahweh.[a] Apa yang hendak kamu panggang, pangganglah; dan apa yang hendak kamu rebus, rebuslah.[b] Semua yang tersisa, sisihkanlah untuk kamu simpan sampai pagi.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “perhentian Sabat yang kudus bagi Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani mengulang kata kerja untuk memberi penekanan: “apa yang hendak kamu panggang, pangganglah; dan apa yang hendak kamu rebus, rebuslah.”'
    reason: source_form
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Ia berkata kepada mereka
  rationale: Mempertahankan bentuk naratif langsung dan fungsi pengantar bagi perkataan Musa.
- source_word: הוּא אֲשֶׁר דִּבֶּר יְהוָה
  choice: Inilah yang telah difirmankan Yahweh
  rationale: “Inilah” menunjuk kembali kepada perkara yang sedang dibicarakan, sedangkan “telah difirmankan” menyatakan ucapan ilahi yang sudah disampaikan dan tetap berlaku.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi yang muncul secara langsung dalam teks Ibrani.
- source_word: שַׁבָּתוֹן
  choice: hari perhentian penuh
  rationale: Menyampaikan penghentian kegiatan yang khusus dan menyeluruh, bukan sekadar istirahat biasa.
- source_word: שַׁבַּת קֹדֶשׁ לַיהוָה
  choice: Sabat kudus bagi Yahweh
  rationale: Mempertahankan kekudusan hari itu serta orientasinya kepada Yahweh tanpa menambahkan penafsiran denominasi.
- source_word: אֵת אֲשֶׁר תֹּאפוּ אֵפוּ
  choice: Apa yang hendak kamu panggang, pangganglah
  rationale: Mengikuti pengulangan verba Ibrani yang memberi penekanan, sekaligus memakai susunan Indonesia yang wajar.
- source_word: וְאֵת אֲשֶׁר תְּבַשְּׁלוּ בַּשֵּׁלוּ
  choice: dan apa yang hendak kamu rebus, rebuslah
  rationale: “Rebus” mempertahankan arti konkret בּשׁל dalam konteks penyiapan makanan dan meniru kesejajaran retoris teks.
- source_word: כָּל הָעֹדֵף
  choice: semua yang tersisa
  rationale: Menyatakan seluruh kelebihan yang masih ada sesudah makanan disiapkan.
- source_word: הַנִּיחוּ לָכֶם לְמִשְׁמֶרֶת
  choice: sisihkanlah untuk kamu simpan
  rationale: Mengungkapkan tindakan menyisihkan dengan sengaja dan tujuan penyimpanannya, sambil mempertahankan unsur “untuk kalian”.
- source_word: עַד הַבֹּקֶר
  choice: sampai pagi
  rationale: Padanan Indonesia yang alami bagi batas waktu penyimpanan tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Hubungan antara שַׁבָּתוֹן dan שַׁבַּת קֹדֶשׁ
  choice: hari perhentian penuh, Sabat kudus bagi Yahweh
  alternative: perhentian Sabat yang kudus bagi Yahweh
  rationale: Teks utama membaca frasa kedua sebagai penjelasan aposisional, sedangkan catatan kaki mempertahankan kemungkinan bahwa unsur “kudus bagi Yahweh” menerangkan keseluruhan ungkapan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat tetapi mudah dipahami. Pengulangan verba dipertahankan karena merupakan unsur penekanan yang nyata dalam teks Ibrani; bentuk “kamu” dipakai sebagai sapaan jamak yang dipahami dari konteks.
