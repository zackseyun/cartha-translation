base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/031.yaml
  text: The house of Israel called its name manna[a], and it was like white coriander seed[c][b], and its taste was like wafers with honey.
translation:
  language: id
  text: Kaum Israel menamainya manna[a]. Manna itu seperti biji ketumbar putih[b], dan rasanya seperti kue tipis yang dibuat dengan madu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: man; secara tradisional disebut “manna”.'
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “seperti biji ketumbar, berwarna putih.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “seperti kue tipis dengan madu.” Kata Ibrani untuk “kue tipis” menunjuk pada sejenis penganan pipih; bentuk tepatnya tidak diketahui.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ בֵית יִשְׂרָאֵל
  choice: Keturunan Israel menamai
  rationale: Ungkapan harfiah 'kaum/rumah Israel' menunjuk kepada umat Israel secara kolektif. 'Keturunan Israel' alami dalam bahasa Indonesia dan mempertahankan gagasan korporat, sedangkan קרא dalam konteks ini berarti memberi nama.
- source_word: אֶת־שְׁמוֹ מָן
  choice: makanan itu manna
  rationale: Bahasa Ibrani secara harfiah menyatakan 'menamai namanya man'. Objek 'makanan itu' diperjelas dari konteks agar kalimat Indonesia alami, dan bentuk tradisional 'manna' dipakai untuk מָן.
- source_word: כְּזֶרַע גַּד לָבָן
  choice: seperti biji ketumbar putih
  rationale: גַּד lazim diidentifikasi sebagai ketumbar, זֶרַע berarti biji, dan לָבָן menyatakan warna putih. Susunan ini alami, meski secara gramatikal frasa Ibrani dapat pula dipahami 'seperti biji ketumbar, berwarna putih'.
- source_word: וְטַעְמוֹ
  choice: dan rasanya
  rationale: טַעַם dalam deskripsi makanan berarti rasa; akhiran pronominal merujuk kepada manna.
- source_word: כְּצַפִּיחִת בִּדְבָשׁ
  choice: seperti kue tipis dengan madu
  rationale: צַפִּיחִת menunjuk pada sejenis penganan atau kue tipis, tetapi bentuk tepatnya tidak pasti. בִּדְבָשׁ paling alami dipahami sebagai dibuat atau disantap dengan madu.
