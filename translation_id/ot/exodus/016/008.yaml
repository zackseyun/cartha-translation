  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה בְּ/תֵ֣ת יְהוָה֩ לָ/כֶ֨ם בָּ/עֶ֜רֶב בָּשָׂ֣ר לֶ/אֱכֹ֗ל וְ/לֶ֤חֶם בַּ/בֹּ֨קֶר֙ לִ/שְׂבֹּ֔עַ בִּ/שְׁמֹ֤עַ יְהוָה֙ אֶת תְּלֻנֹּ֣תֵי/כֶ֔ם אֲשֶׁר אַתֶּ֥ם מַלִּינִ֖ם עָלָ֑י/ו וְ/נַ֣חְנוּ מָ֔ה לֹא עָלֵ֥י/נוּ תְלֻנֹּתֵי/כֶ֖ם כִּ֥י עַל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/008.yaml
  text: And Moses said[a], “When Yahweh gives you meat to eat in the evening and bread in the morning to the full, because Yahweh hears your grumblings that you are grumbling against him—what are we? Your grumblings are not against us, but against Yahweh.”
translation:
  language: id
  text: Musa berkata, “Ketika Yahweh memberi kalian daging untuk dimakan pada petang hari dan roti pada pagi hari sampai kenyang, karena Yahweh mendengar keluhan kalian yang kalian keluhkan terhadap-Nya—apalah kami ini? Keluhan kalian bukan ditujukan kepada kami, melainkan kepada Yahweh.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּתֵת
  choice: Ketika ... memberi
  rationale: Preposisi ב dengan infinitif konstruk נתן menyatakan keadaan temporal; bentuk ini alami dalam bahasa Indonesia dan sesuai dengan perkataan yang bersifat prediktif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: בָּשָׂר לֶאֱכֹל
  choice: daging untuk dimakan
  rationale: Dalam konteks makanan, בָּשָׂר berarti daging; infinitif לֶאֱכֹל menyatakan tujuan.
- source_word: לֶחֶם ... לִשְׂבֹּעַ
  choice: roti sampai kenyang
  rationale: Mempertahankan gambaran konkret 'roti' dan menyampaikan makna satiatif שבע secara alami.
- source_word: בִּשְׁמֹעַ
  choice: sebab ... mendengar
  rationale: Infinitif berpreposisi ini paling wajar dipahami secara kausal dalam hubungan antarklausa.
- source_word: תְּלֻנֹּתֵיכֶם / מַלִּינִם
  choice: gerutuan kalian ... kalian tujukan
  rationale: '''Gerutuan'' menyampaikan keluhan penuh ketidakpuasan. Verba kognat diterjemahkan secara alami sebagai ''kalian tujukan'' untuk menjaga arah permusuhan tanpa menghasilkan pengulangan yang kaku; pengulangan Ibrani dijelaskan dalam catatan kaki.'
- source_word: וְנַחְנוּ מָה
  choice: apalah kami ini?
  rationale: Menjaga kata tanya 'apa' dan menekankan kecilnya arti Musa dan Harun sebagai sasaran gerutuan.
- source_word: לֹא עָלֵינוּ ... כִּי עַל יְהוָה
  choice: bukan ditujukan kepada kami, melainkan kepada Yahweh
  rationale: Menjelaskan predikat yang tersirat dan mempertahankan kontras kuat antara manusia dan Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama diri ilahi; 'Yahweh' mempertahankannya alih-alih menggantinya dengan gelar.
- issue: Sasaran gerutuan Israel
  choice: Gerutuan terhadap Musa dan Harun pada hakikatnya ditujukan kepada Yahweh
  alternative: Gerutuan hanya mengenai tindakan Musa dan Harun
  rationale: Kontras eksplisit עָלֵינוּ / עַל יְהוָה menyatakan bahwa Yahweh, bukan para perantara manusia, adalah sasaran utama gerutuan itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Pronomina jamak 'kalian' dipakai agar bentuk orang kedua jamak dalam bahasa Ibrani tetap jelas. 'Petang hari' dan 'pagi hari' mempertahankan kesejajaran waktu; 'apalah kami ini?' menjaga tekanan retoris tanpa terdengar terlalu kaku.
