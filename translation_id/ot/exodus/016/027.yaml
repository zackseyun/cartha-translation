base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/027.yaml
  text: And it happened on the seventh day that some of the people went out to gather[a], but they found none.
translation:
  language: id
  text: Pada hari ketujuh, sebagian dari bangsa itu keluar untuk mengumpulkan, tetapi mereka tidak menemukan apa-apa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: Pada hari ketujuh
  rationale: Bentuk naratif וַיְהִי melanjutkan urutan peristiwa. Dalam bahasa Indonesia modern, alur itu dapat disampaikan secara alami tanpa menerjemahkannya dengan frasa kaku seperti 'dan terjadilah'.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: pada hari ketujuh
  rationale: Menerjemahkan frasa waktu secara langsung tanpa menambahkan 'dalam minggu itu', yang tidak dinyatakan dalam teks Ibrani.
- source_word: יָצְאוּ
  choice: pergi
  rationale: Dalam konteks ini, יָצְאוּ menggambarkan gerak keluar dari perkemahan. 'Pergi' terdengar alami dalam konstruksi Indonesia 'pergi untuk mengumpulkan'.
- source_word: מִן הָעָם
  choice: sebagian dari bangsa itu
  rationale: 'מן digunakan secara partitif: hanya sebagian dari bangsa itu yang bertindak, bukan seluruh umat.'
- source_word: לִלְקֹט
  choice: untuk mengumpulkan
  rationale: לקט berarti mengumpulkan atau memungut. Objeknya, yaitu manna, sudah jelas dari konteks sehingga tidak perlu ditambahkan.
- source_word: וְלֹא מָצָאוּ
  choice: tetapi mereka tidak menemukan apa-apa
  rationale: Secara harfiah berarti 'dan mereka tidak menemukan'. 'Tetapi' menyatakan kontras kontekstual antara tujuan dan hasil, sedangkan 'apa-apa' melengkapi ungkapan Indonesia secara alami tanpa menentukan objek secara eksplisit.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Makna partitif מִן הָעָם dimasukkan langsung ke dalam teks sehingga tidak memerlukan catatan kaki.
