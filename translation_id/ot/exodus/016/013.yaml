base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/013.yaml
  text: And in the evening the quail came up and covered the camp[a], and in the morning a layer of dew was around the camp.
translation:
  language: id
  text: Pada waktu petang, burung-burung puyuh datang dan menutupi perkemahan. Pada waktu pagi, ada selapis embun di sekeliling perkemahan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בָעֶרֶב
  choice: Pada waktu petang
  rationale: Ungkapan ini melanjutkan urutan cerita dan menetapkan waktunya. Terjemahan ini alami dalam bahasa Indonesia tanpa mempertahankan ungkapan kaku 'terjadilah'.
- source_word: וַתַּעַל הַשְּׂלָו
  choice: burung-burung puyuh datang
  rationale: עלה secara harfiah menyatakan gerak naik atau datang. Dalam konteks kawanan burung yang mendatangi perkemahan, 'datang' menyampaikan geraknya secara alami; bentuk jamak memperjelas makna kolektif השׂלו.
- source_word: וַתְּכַס אֶת־הַמַּחֲנֶה
  choice: dan menutupi perkemahan
  rationale: כסה berarti 'menutupi', sedangkan מַחֲנֶה di sini adalah kawasan tempat umat berkemah, sehingga 'perkemahan' tepat dan jelas.
- source_word: וּבַבֹּקֶר
  choice: Pada waktu pagi
  rationale: Frasa ini menandai waktu peristiwa berikutnya dan mempertahankan kesejajaran dengan 'Pada waktu petang'.
- source_word: הָיְתָה שִׁכְבַת הַטַּל
  choice: ada selapis embun
  rationale: שִׁכְבַת menunjuk pada suatu lapisan atau hamparan. Konstruksi dengan היה secara alami dinyatakan secara eksistensial dalam bahasa Indonesia sebagai 'ada selapis embun'.
- source_word: סָבִיב לַמַּחֲנֶה
  choice: di sekeliling perkemahan
  rationale: סָבִיב לַ menyatakan lokasi yang mengitari perkemahan; 'di sekeliling' tepat dan alami.
