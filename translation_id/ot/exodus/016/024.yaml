  yaml_path: translation/ot/exodus/016/024.yaml
  text: So they left it until morning[a], just as Moses had commanded, and it did not stink, nor were there any worms in it.
translation:
  language: id
  text: Mereka menyimpannya sampai pagi, seperti yang Musa perintahkan; manna itu tidak berbau busuk dan tidak ada ulat[a] di dalamnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “belatung.” Kata Ibrani ini dapat menunjuk secara umum pada makhluk seperti cacing yang muncul dalam bahan yang membusuk.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנִּיחוּ אֹתוֹ
  choice: mereka pun menyimpannya
  rationale: Dalam konteks ini, bentuk kausatif dari נוח menunjuk pada tindakan menaruh atau membiarkan manna untuk disimpan semalaman. “Menyimpannya” alami dalam bahasa Indonesia dan tetap mempertahankan pronomina tunggal yang merujuk pada manna.
- source_word: עַד הַבֹּקֶר
  choice: sampai pagi
  rationale: Ungkapan waktu ini paling wajar diterjemahkan “sampai pagi” dalam bahasa Indonesia modern.
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: seperti yang diperintahkan Musa
  rationale: Terjemahan ini mempertahankan gagasan bahwa tindakan mereka sesuai dengan perintah Musa sebelumnya tanpa membuat susunan kalimat terasa kaku.
- source_word: וְלֹא הִבְאִישׁ
  choice: Manna itu tidak berbau busuk
  rationale: Verba הִבְאִישׁ berarti menjadi atau berbau busuk. Subjek “manna” dinyatakan kembali demi kejelasan dan kealamian bahasa Indonesia.
- source_word: וְרִמָּה לֹא הָיְתָה בּוֹ
  choice: dan tidak ada belatung di dalamnya
  rationale: 'Susunan ini mempertahankan makna eksistensial Ibrani: tidak terdapat רִמָּה dalam manna itu. “Belatung” cocok dengan konteks makanan yang membusuk, sementara kemungkinan arti yang lebih umum dicatat dalam catatan kaki.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Partikel “pun” mengalirkan narasi dari perintah sebelumnya. Ayat dibagi menjadi dua kalimat agar mudah dibaca, tanpa mengubah hubungan maknanya.
