  source_fidelity: 'Makna pokok sudah tepat: manna disimpan sampai pagi sesuai perintah Musa, lalu tidak berbau busuk dan tidak terdapat רִמָּה di dalamnya. Namun, “belatung” mempersempit רִמָּה kepada larva lalat, sedangkan nomina Ibrani itu lebih umum dan dapat mencakup ulat/cacing yang terkait pembusukan.'
