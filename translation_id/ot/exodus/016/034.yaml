  text: כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶל מֹשֶׁ֑ה וַ/יַּנִּיחֵ֧/הוּ אַהֲרֹ֛ן לִ/פְנֵ֥י הָ/עֵדֻ֖ת לְ/מִשְׁמָֽרֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/034.yaml
  text: As Yahweh commanded Moses[a], so Aaron placed it before the testimony for safekeeping.
translation:
  language: id
  text: Seperti yang diperintahkan Yahweh kepada Musa, Harun menaruhnya di hadapan kesaksian[a] untuk disimpan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kesaksian perjanjian.” Istilah Ibrani “kesaksian” merupakan istilah teknis dalam konteks Kemah Suci dan dapat merujuk secara lebih khusus kepada loh-loh perjanjian atau kepada benda yang berkaitan dengannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: Seperti yang
  rationale: Menunjukkan bahwa tindakan Harun sesuai dengan perintah sebelumnya, dengan ungkapan Indonesia yang alami.
- source_word: צִוָּה
  choice: diperintahkan
  rationale: Mempertahankan daya otoritatif verba צוה dalam konteks perintah ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Menerjemahkan nama perjanjian ilahi secara langsung, bukan menggantinya dengan gelar.
- source_word: אֶל מֹשֶׁה
  choice: kepada Musa
  rationale: Mempertahankan relasi gramatikal yang ditandai אֶל dan terdengar wajar dalam bahasa Indonesia.
- source_word: וַיַּנִּיחֵהוּ
  choice: Harun menaruhnya
  rationale: Menunjukkan tindakan menempatkan benda yang disebut sebelumnya; enklitik objek maskulin tunggal diterjemahkan dengan '-nya'.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Sesuai dengan ungkapan teknis ruang kudus dan lebih bermartabat daripada sekadar 'di depan', tanpa memastikan rincian lokasi.
- source_word: הָעֵדֻת
  choice: kesaksian
  rationale: Mempertahankan istilah teknis Pentateukh tanpa mempersempit rujukannya secara tidak pasti kepada loh-loh atau benda tertentu.
- source_word: לְמִשְׁמָרֶת
  choice: untuk disimpan
  rationale: Mengungkapkan tujuan penyimpanan atau penjagaan secara alami tanpa menambahkan gagasan peringatan yang tidak eksplisit.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian tersebut.
- issue: Rujukan teknis הָעֵדֻת
  choice: kesaksian
  alternative: kesaksian perjanjian atau loh-loh perjanjian
  rationale: Rujukannya dapat berkaitan secara khusus dengan loh-loh perjanjian atau perangkat kudus yang terkait dengannya, tetapi ayat ini sendiri hanya menyebut 'kesaksian'; terjemahan utama mempertahankan ambiguitas itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti hubungan antarklausa Ibrani, tetapi tetap alami. Istilah teknis 'kesaksian' dipertahankan dan dijelaskan melalui catatan kaki.
