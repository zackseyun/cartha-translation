  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה עַד אָ֨נָה֙ מֵֽאַנְתֶּ֔ם לִ/שְׁמֹ֥ר מִצְוֺתַ֖/י וְ/תוֹרֹתָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/028.yaml
  text: Then Yahweh said to Moses[a], “How long will you refuse to keep my commandments and my laws?”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa, “Sampai kapan kalian menolak menaati perintah-perintah-Ku dan hukum-hukum-Ku[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “petunjuk-petunjuk-Ku.” Kata Ibrani torot (bentuk jamak dari torah) dapat merujuk pada petunjuk yang berwibawa maupun hukum.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Waw-konsekutif melanjutkan urutan narasi. 'Lalu' menyatakan urutan secara alami, sedangkan 'berfirman' merupakan padanan Indonesia yang lazim dan bermartabat ketika Allah menjadi subjek.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: עַד אָנָה
  choice: Berapa lama lagi
  rationale: Ungkapan ini menanyakan sampai kapan pembangkangan yang sedang berlangsung akan berlanjut; 'lagi' membuat daya tegurannya alami dalam bahasa Indonesia.
- source_word: מֵאַנְתֶּם
  choice: kalian menolak
  rationale: Bentuk orang kedua jamak menunjukkan bahwa teguran melalui Musa ditujukan kepada komunitas. 'Menolak' mempertahankan makna ketidakbersediaan yang disengaja.
- source_word: לִשְׁמֹר
  choice: menaati
  rationale: Dalam hubungan dengan perintah dan hukum, שׁמר berarti memelihara atau menjalankannya. 'Menaati' paling jelas dan alami dalam bahasa Indonesia modern.
- source_word: מִצְוֺתַי
  choice: perintah-perintah-Ku
  rationale: Bentuk jamak dan akhiran orang pertama dipertahankan, dengan nuansa normatif dari perintah ilahi.
- source_word: וְתוֹרֹתָי
  choice: dan hukum-hukum-Ku
  rationale: Dalam kesejajaran dengan 'perintah-perintah-Ku', pilihan ini menyampaikan daya normatif תּוֹרָה, sementara cakupan makna 'petunjuk' dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani menggunakan Tetragramaton sebagai nama pribadi; transliterasi 'Yahweh' mempertahankan hal itu tanpa menggantinya dengan gelar.
- issue: Cakupan makna bentuk jamak תוֹרֹתָי
  choice: hukum-hukum-Ku
  alternative: petunjuk-petunjuk-Ku atau ajaran-ajaran-Ku
  rationale: Konteks teguran dan kesejajarannya dengan 'perintah-perintah-Ku' mendukung daya hukum, tetapi makna lebih luas sebagai petunjuk berwibawa tetap dipertahankan dalam catatan kaki.
- issue: Cakupan penerima teguran dalam מֵאַנְתֶּם
  choice: kalian
  alternative: kamu
  rationale: Kata kerja Ibrani berbentuk orang kedua maskulin jamak. Bahasa Indonesia perlu menyatakan kejamakan ini agar teguran tidak terbaca hanya ditujukan kepada Musa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'kalian' dipakai untuk menampilkan orang kedua jamak secara jelas. Kapitalisasi pada akhiran '-Ku' mengikuti konvensi penghormatan kepada Allah.
