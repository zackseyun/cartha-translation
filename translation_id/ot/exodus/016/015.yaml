base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/015.yaml
  text: When the sons of Israel saw it[a], they said to one another, “What is it?” For they did not know what it was. And Moses said to them[b], “It is the bread that Yahweh has given you to eat.”
translation:
  language: id
  text: Ketika orang Israel melihatnya, mereka berkata satu sama lain,[a] “Apakah ini?”[b] Sebab mereka tidak tahu apa itu. Lalu Musa berkata kepada mereka, “Inilah roti yang Yahweh berikan kepada kalian untuk dimakan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seorang kepada saudaranya,” yaitu ungkapan Ibrani yang berarti “satu sama lain.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani yang diterjemahkan “Apakah ini?” secara tradisional dihubungkan dengan nama “manna.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan ini secara harfiah berarti ‘anak-anak lelaki Israel’, tetapi dalam konteks naratif menunjuk kepada orang-orang Israel secara kolektif. ‘Orang Israel’ alami dan jelas dalam bahasa Indonesia modern.
- source_word: אִישׁ אֶל אָחִיו
  choice: satu sama lain
  rationale: Secara harfiah ‘seorang kepada saudaranya’; ini adalah ungkapan timbal balik yang paling alami diterjemahkan ‘satu sama lain’.
- source_word: מָן הוּא
  choice: Apakah ini?
  rationale: Dalam konteks, מָן berfungsi sebagai kata tanya, sebagaimana ditegaskan oleh klausa berikutnya bahwa mereka tidak tahu benda itu apa. Terjemahan ini juga tidak terlalu dini memperlakukan ungkapan tersebut sebagai nama diri ‘manna’.
- source_word: לֹא יָדְעוּ מַה הוּא
  choice: mereka tidak tahu benda itu apa
  rationale: Terjemahan ini mempertahankan penjelasan narator dan terdengar wajar dalam bahasa Indonesia; ‘benda itu’ memperjelas bahwa yang dimaksud ialah sesuatu yang baru mereka lihat.
- source_word: הוּא הַלֶּחֶם
  choice: Inilah roti
  rationale: Konstruksi pronomina dan nomina mengidentifikasi benda yang sedang dibicarakan. ‘Inilah roti’ merupakan padanan demonstratif yang alami dalam konteks penunjukan tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi ‘Yahweh’, bukan diganti dengan gelar.
- source_word: לְאָכְלָה
  choice: untuk dimakan
  rationale: Bentuk ini menyatakan tujuan pemberian roti dan diterjemahkan secara ringkas serta alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; ‘Yahweh’ mempertahankan nama perjanjian itu sebagai nama pribadi.
- issue: Apakah מָן diperlakukan sebagai nama diri ‘manna’ dalam teks utama
  choice: Diterjemahkan sebagai pertanyaan, ‘Apakah ini?’
  alternative: Manna atau Inikah manna?
  rationale: Klausa berikutnya menjelaskan bahwa orang Israel belum mengetahui benda itu. Karena itu, bentuk tanya mempertahankan alur narasi dan permainan kata yang kemudian terkait dengan nama ‘manna’.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Sapaan jamak ‘kalian’ dipakai untuk memperjelas bahwa Musa berbicara kepada banyak orang. Penanda catatan kaki ditempatkan tepat setelah ungkapan yang diterangkan.
