  text: And the whole congregation of the sons of Israel grumbled against Moses and against Aaron in the wilderness[a].
translation:
  language: id
  text: Lalu seluruh umat Israel bersungut-sungut terhadap Musa dan Harun di padang belantara.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Israel”; dapat juga diterjemahkan “orang Israel” atau, secara tradisional, “bani Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלּוֹנוּ
  choice: bersungut-sungut
  rationale: Dalam konteks ini, verba לון/לין menyatakan keluhan bersama yang bernada menentang para pemimpin. “Bersungut-sungut” alami dalam bahasa Indonesia Alkitabiah-modern dan mempertahankan nuansa negatif tersebut.
- source_word: כָּל עֲדַת
  choice: seluruh umat
  rationale: כָּל menegaskan keseluruhan, sedangkan עֵדָה menunjuk komunitas Israel secara kolektif. “Seluruh umat” jelas dan wajar bagi pembaca Indonesia.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Ungkapan ini secara harfiah berarti “anak-anak lelaki Israel,” tetapi dalam konteks menunjuk bangsa yang berasal dari Israel secara kolektif. “Keturunan Israel” mempertahankan hubungan genealogis tanpa menimbulkan kesan bahwa hanya laki-laki yang dimaksud.
- source_word: עַל ... וְעַל
  choice: terhadap ... dan
  rationale: Preposisi עַל di sini menandai orang yang menjadi sasaran keluhan atau perlawanan. “Terhadap” menyampaikan daya adversatifnya secara alami.
- source_word: בַּמִּדְבָּר
  choice: di padang belantara
  rationale: מִדְבָּר adalah kawasan liar dan jarang dihuni, tidak selalu gurun pasir. “Padang belantara” lebih tepat daripada “gurun” dan tetap mudah dipahami.
theological_decisions:
- issue: Penyebutan kolektif בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak lelaki Israel; orang Israel; bani Israel
  rationale: Bentuk Ibrani secara gramatikal maskulin, tetapi sebagai ungkapan etnis-genealogis di sini mencakup seluruh komunitas. “Keturunan Israel” menjaga unsur asal-usul kolektif tanpa mempersempit rujukannya hanya kepada laki-laki; alternatif yang lebih harfiah dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Umat” dipakai untuk komunitas kolektif, “bersungut-sungut” untuk keluhan bernada menentang, dan “padang belantara” untuk wilayah liar yang tidak selalu berupa gurun pasir.
