  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בְנֵ֣י יִשְׂרָאֵ֗ל אָֽכְל֤וּ אֶת הַ/מָּן֙ אַרְבָּעִ֣ים שָׁנָ֔ה עַד בֹּאָ֖/ם אֶל אֶ֣רֶץ נוֹשָׁ֑בֶת אֶת הַ/מָּן֙ אָֽכְל֔וּ עַד בֹּאָ֕/ם אֶל קְצֵ֖ה אֶ֥רֶץ כְּנָֽעַן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/035.yaml
  text: And the sons of Israel ate the manna forty years[a], until they came to an inhabited land[c][b]; they ate the manna until they came to the border of the land of Canaan.
translation:
  language: id
  text: Orang Israel[a] makan manna itu selama empat puluh tahun, sampai mereka tiba di negeri yang berpenghuni[b]. Mereka makan manna itu sampai mereka tiba di perbatasan[c] negeri Kanaan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Israel”; ungkapan Ibrani ini merupakan sebutan umum bagi umat Israel.
    reason: lexical_alternative
  - marker: b
    text: Atau “negeri yang sudah dihuni” atau “negeri tempat orang menetap.” Ungkapan ini mengontraskan negeri yang layak dihuni dengan padang gurun.
    reason: lexical_alternative
  - marker: c
    text: Atau “tepi” atau “ujung negeri Kanaan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Orang Israel
  rationale: Secara harfiah berarti “anak-anak lelaki Israel,” tetapi merupakan sebutan baku bagi umat Israel secara keseluruhan. “Orang Israel” menyampaikan makna korporat itu dengan wajar dalam bahasa Indonesia modern.
- source_word: אָכְלוּ
  choice: makan
  rationale: Bentuk perfek Qal orang ketiga jamak merangkum tindakan lampau; “makan” merupakan padanan langsung dan alami.
- source_word: הַמָּן
  choice: manna itu
  rationale: Kata benda ini memakai kata sandang tertentu. “Manna” adalah istilah yang sudah dikenal, sedangkan “itu” menandai bahwa yang dimaksud ialah manna yang telah disebutkan dalam konteks.
- source_word: אַרְבָּעִים שָׁנָה
  choice: selama empat puluh tahun
  rationale: Penambahan “selama” mengungkapkan fungsi keterangan durasi secara alami tanpa menambah makna.
- source_word: עַד בֹּאָם
  choice: sampai mereka tiba
  rationale: Gabungan עַד dengan infinitif konstruk dan sufiks menyatakan batas waktu. “Tiba” mempertahankan arti umum verba ‘datang’ dan tidak mempersempitnya menjadi ‘masuk’.
- source_word: אֶל אֶרֶץ נוֹשָׁבֶת
  choice: di negeri yang berpenghuni
  rationale: Partisipel Nifal נוֹשָׁבֶת menunjuk pada negeri yang dihuni atau didiami, sebagai kontras dengan padang gurun. Preposisi “di” mengikuti penggunaan alami verba “tiba” dalam bahasa Indonesia.
- source_word: עַד בֹּאָם אֶל קְצֵה אֶרֶץ כְּנָעַן
  choice: sampai mereka tiba di perbatasan negeri Kanaan
  rationale: קְצֵה dapat berarti ujung, tepi, atau batas. Dalam konteks geografis, “perbatasan” menyampaikan batas wilayah Kanaan secara alami sambil mempertahankan cakupan makna sumber.
