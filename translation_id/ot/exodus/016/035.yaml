translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “makan manna itu” dipertahankan karena mencerminkan struktur retoris teks Ibrani. “Orang Israel” dipilih daripada bentuk harfiah yang kurang alami, dengan bentuk sumber dijelaskan dalam catatan kaki.
