  source_fidelity: 'Terjemahan dengan setia menyampaikan kedua klausa ringkasan dalam teks Ibrani: בני ישראל sebagai “Orang Israel,” אכלו sebagai tindakan lampau “makan,” durasi empat puluh tahun, serta dua batas waktu—tiba di negeri berpenghuni dan di batas negeri Kanaan. Pengulangan “makan manna itu” juga mempertahankan penegasan repetitif teks sumber.'
