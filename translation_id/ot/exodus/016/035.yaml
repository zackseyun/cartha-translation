  terminology: “Orang Israel” adalah padanan modern yang tepat untuk sebutan korporat בני ישראל; catatan kaki secara memadai memberi bentuk harfiahnya tanpa memaksakan bentuk yang kurang alami ke dalam teks utama. “Manna,” “negeri,” dan “Kanaan” konsisten serta tepat. Catatan untuk “perbatasan” dengan alternatif “tepi” dan “ujung” menjaga keluasan makna קצה.
