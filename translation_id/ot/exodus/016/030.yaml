source:
  edition: WLC
  text: וַ/יִּשְׁבְּת֥וּ הָ/עָ֖ם בַּ/יּ֥וֹם הַ/שְּׁבִעִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/030.yaml
  text: So the people rested on the seventh day[a].
translation:
  language: id
  text: Jadi, bangsa itu beristirahat pada hari ketujuh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berhenti”; kata kerja ini berkaitan dengan perhentian Sabat, sehingga terjemahan “memelihara hari Sabat” merupakan perluasan interpretatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבְּתוּ
  choice: beristirahat
  rationale: Bentuk qal wayyiqtol dari שׁבת pada dasarnya berarti berhenti atau beristirahat. Dalam konteks hari ketujuh, “beristirahat” alami dalam bahasa Indonesia dan tidak memperluas makna menjadi “memelihara hari Sabat”.
- source_word: הָעָם
  choice: bangsa itu
  rationale: עָם menunjuk secara kolektif kepada umat Israel. “Bangsa itu” mempertahankan rujukan kolektif yang pasti dalam narasi ini.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: pada hari ketujuh
  rationale: Preposisi בְּ dengan יוֹם untuk penunjukan hari tertentu paling alami diterjemahkan “pada”, sedangkan bentuk ordinal הַשְּׁבִיעִי berarti “ketujuh”.
- source_word: וַ
  choice: Jadi
  rationale: Waw pada verba meneruskan alur narasi dan di sini menyampaikan hasil dari perintah sebelumnya; “Jadi” mengungkapkan hubungan itu secara wajar.
theological_decisions:
- issue: Apakah rujukan kepada Sabat perlu dibuat eksplisit dalam verba
  choice: beristirahat
  alternative: berhenti; memelihara hari Sabat
  rationale: Teks Ibrani menyatakan bahwa bangsa itu berhenti atau beristirahat. Makna Sabat sudah tersirat oleh konteks dan frasa “hari ketujuh”; menerjemahkannya sebagai “memelihara hari Sabat” akan menjadi perluasan interpretatif.
translation_notes:
  register: Bahasa Indonesia modern yang sederhana dan bermartabat. Susunan kalimat ringkas mengikuti alur hasil dalam narasi, sambil mempertahankan alternatif leksikal dalam catatan kaki.
