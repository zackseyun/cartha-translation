  terminology: “Musa,” “mendengarkan,” “berbau busuk,” dan “marah kepada mereka” sesuai dengan penggunaan modern dan tidak memasukkan penafsiran teologis. “Manna” dipakai hanya untuk menjernihkan referen yang sudah ditentukan oleh konteks langsung.
