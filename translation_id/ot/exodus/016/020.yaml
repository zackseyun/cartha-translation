  text: But they did not listen to Moses[a], and some men left some of it until morning, and it bred worms and stank[b]; and Moses was angry with them.
translation:
  language: id
  text: Namun, mereka tidak mendengarkan Musa[a]. Beberapa orang menyisakan sebagian manna itu sampai pagi, lalu makanan itu dipenuhi ulat dan berbau busuk[b]. Musa pun marah kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak mengindahkan Musa.” Ungkapan Ibrani dapat menyiratkan penolakan untuk mendengar yang terwujud dalam ketidaktaatan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ulat-ulat timbul.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ אֶל מֹשֶׁה
  choice: mendengarkan Musa
  rationale: שׁמע dengan אֶל berarti mendengarkan atau mengindahkan seseorang. Pilihan ini mempertahankan ungkapan langsung Ibrani sekaligus membiarkan konteks menunjukkan unsur ketidaktaatan.
- source_word: וַיּוֹתִרוּ אֲנָשִׁים מִמֶּנּוּ
  choice: Beberapa orang menyisakan sebagian darinya
  rationale: Bentuk Hifil dari יתר berarti membiarkan atau menyisakan sesuatu. אֲנָשִׁים secara harfiah berarti laki-laki, tetapi dalam konstruksi tak tentu ini secara alami menunjuk kepada sejumlah orang; 'beberapa orang' merupakan bahasa Indonesia yang wajar tanpa menambahkan identitas yang tidak dituntut konteks.
- source_word: עַד בֹּקֶר
  choice: sampai pagi
  rationale: Padanan temporal yang langsung, alami, dan tepat.
- source_word: וַיָּרֻם תּוֹלָעִים
  choice: makanan itu dipenuhi ulat
  rationale: Secara harfiah, ulat-ulat 'timbul' atau 'muncul' padanya. Dalam konteks makanan yang membusuk, 'dipenuhi ulat' menyampaikan hasilnya secara alami; catatan kaki mempertahankan bentuk ungkapan sumber.
- source_word: וַיִּבְאַשׁ
  choice: berbau busuk
  rationale: Kata kerja ini berarti menjadi busuk atau mengeluarkan bau busuk. Ungkapan ini lugas dan wajar dalam narasi Indonesia.
- source_word: וַיִּקְצֹף עֲלֵהֶם מֹשֶׁה
  choice: Musa pun marah kepada mereka
  rationale: קצף menyatakan kemarahan, sedangkan עַל dengan kata kerja ini secara idiomatis diterjemahkan 'kepada'. Partikel 'pun' mengalirkan akibat naratif tanpa melebihkan intensitas kemarahan.
