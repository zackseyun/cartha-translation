  variant: modern standard Indonesian
source:
  edition: WLC
  text: רְא֗וּ כִּֽי יְהוָה֮ נָתַ֣ן לָ/כֶ֣ם הַ/שַּׁבָּת֒ עַל כֵּ֠ן ה֣וּא נֹתֵ֥ן לָ/כֶ֛ם בַּ/יּ֥וֹם הַ/שִּׁשִּׁ֖י לֶ֣חֶם יוֹמָ֑יִם שְׁב֣וּ אִ֣ישׁ תַּחְתָּ֗י/ו אַל יֵ֥צֵא אִ֛ישׁ מִ/מְּקֹמ֖/וֹ בַּ/יּ֥וֹם הַ/שְּׁבִיעִֽי־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/029.yaml
  text: See[a], for Yahweh has given you the Sabbath; therefore on the sixth day he gives you bread for two days. Let each man stay in his place; let no man go out from his place on the seventh day.
translation:
  language: id
  text: Perhatikanlah, sebab Yahweh telah memberikan hari Sabat kepada kalian. Itulah sebabnya pada hari keenam Ia memberikan kepada kalian roti untuk dua hari. Hendaklah setiap orang tetap berada di tempatnya; jangan seorang pun keluar dari tempatnya pada hari ketujuh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רְאוּ
  choice: Perhatikanlah
  rationale: Imperatif jamak ini mengajak seluruh umat mengenali kenyataan yang dijelaskan sesudahnya. 'Perhatikanlah' mempertahankan daya seruan langsung tanpa membatasi maknanya pada melihat secara fisik.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani dan tidak menggantinya dengan gelar.
- source_word: נָתַן לָכֶם הַשַּׁבָּת
  choice: telah memberikan hari Sabat kepada kalian
  rationale: Bentuk perfektif menyatakan pemberian yang sudah dilakukan; susunan ini alami dalam bahasa Indonesia dan mempertahankan Sabat sebagai karunia bagi umat.
- source_word: עַל כֵּן
  choice: Itulah sebabnya
  rationale: Menandai akibat dari pemberian hari Sabat dan mengungkapkan hubungan logis secara wajar dalam bahasa Indonesia.
- source_word: נֹתֵן
  choice: Ia memberikan
  rationale: Partisip menyatakan tindakan kini atau pola penyediaan yang berlaku. Huruf kapital pada 'Ia' memperjelas bahwa subjeknya adalah Yahweh.
- source_word: לֶחֶם יוֹמָיִם
  choice: roti untuk dua hari
  rationale: Mempertahankan kata konkret 'roti' dan menyampaikan ungkapan harfiah 'roti dua hari' dengan bahasa Indonesia yang alami.
- source_word: שְׁבוּ אִישׁ תַּחְתָּיו
  choice: Hendaklah setiap orang tetap berada di tempatnya
  rationale: ישב di sini berarti tetap tinggal, sedangkan תַּחְתָּיו bersifat idiomatis, yaitu di tempat masing-masing.
- source_word: אַל יֵצֵא אִישׁ מִמְּקֹמוֹ
  choice: jangan seorang pun keluar dari tempatnya
  rationale: Menyampaikan larangan jussif dengan tegas dan mempertahankan pengulangan gagasan 'tempat' dari bahasa sumber.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: pada hari ketujuh
  rationale: Menerjemahkan urutan hari secara langsung tanpa menambahkan keterangan yang tidak terdapat dalam teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian secara langsung; transliterasi mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Cakupan distributif אִישׁ
  choice: setiap orang / seorang pun
  alternative: setiap laki-laki / tidak seorang laki-laki pun
  rationale: Walaupun bentuk Ibraninya maskulin tunggal, dalam kedua klausa ini אִישׁ dipakai secara distributif bagi setiap anggota komunitas. Ungkapan Indonesia ini mempertahankan cakupan tersebut tanpa secara keliru membatasi perintah hanya kepada laki-laki.
- issue: Sabat sebagai pemberian
  choice: telah memberikan hari Sabat kepada kalian
  alternative: telah menetapkan hari Sabat bagi kalian
  rationale: Kata kerja נתן secara langsung berarti 'memberikan'. Terjemahan ini mempertahankan gagasan Sabat sebagai pemberian tanpa menutup kemungkinan bahwa pemberian itu sekaligus merupakan penetapan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kalian' dipakai untuk menandai objek jamak Ibrani secara jelas; 'hari Sabat' merupakan bentuk yang lazim. Tanda titik memisahkan alasan dan konsekuensinya agar kalimat mudah dipahami, sedangkan titik koma mempertahankan kesejajaran dua perintah penutup.
