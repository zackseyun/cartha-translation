  text: And the sons of Israel did so[a], and they gathered, some more and some less.
translation:
  language: id
  text: Orang Israel pun berbuat demikian. Mereka mengumpulkan manna—sebagian mengumpulkan banyak, sebagian mengumpulkan sedikit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “yang mengumpulkan banyak dan yang mengumpulkan sedikit.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: pun berbuat demikian
  rationale: Ungkapan ini merujuk pada pelaksanaan perintah sebelumnya. “Berbuat demikian” alami dalam bahasa Indonesia dan mempertahankan hubungan anaforisnya.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Orang Israel
  rationale: Secara harfiah berarti “anak-anak lelaki Israel,” tetapi dalam konteks ini menunjuk kepada umat Israel secara kolektif. “Orang Israel” jelas, wajar, dan tidak memberi kesan bahwa hanya laki-laki yang dimaksud.
- source_word: וַיִּלְקְטוּ
  choice: Mereka mengumpulkannya
  rationale: Kata לקט berarti mengumpulkan, khususnya bahan makanan. Akhiran “-nya” secara alami merujuk kepada manna yang disebut dalam konteks sebelumnya.
- source_word: הַמַּרְבֶּה וְהַמַּמְעִיט
  choice: sebagian banyak, sebagian sedikit
  rationale: Kedua bentuk partisip nominal ini mengontraskan orang yang mengumpulkan banyak dengan orang yang mengumpulkan sedikit. Rumusan ini ringkas dan alami, tanpa menghilangkan kontras distributifnya.
