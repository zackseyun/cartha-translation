source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ וְ/אַהֲרֹ֔ן אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל עֶ֕רֶב וִֽ/ידַעְתֶּ֕ם כִּ֧י יְהוָ֛ה הוֹצִ֥יא אֶתְ/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/006.yaml
  text: Then Moses and Aaron said to all the sons of Israel[a], “At evening you will know that Yahweh brought you out from the land of Egypt.”
translation:
  language: id
  text: Lalu Musa dan Harun berkata kepada seluruh orang Israel[a], “Pada waktu petang kamu akan tahu bahwa Yahweh yang telah membawa kamu keluar dari tanah Mesir.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seluruh putra-putra Israel”; maksudnya, seluruh umat Israel. Dapat juga diterjemahkan “seluruh keturunan Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “Lalu” menyampaikan urutan kejadian secara alami dalam bahasa Indonesia modern.
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Musa dan Harun
  rationale: Menggunakan bentuk nama yang sudah baku dan dikenal luas dalam bahasa Indonesia.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: kepada seluruh orang Israel
  rationale: Ungkapan Ibrani secara harfiah berarti “anak-anak lelaki Israel,” tetapi secara kolektif menunjuk kepada umat Israel; “seluruh orang Israel” alami, jelas, dan tidak memberi kesan bahwa yang disapa hanya laki-laki.
- source_word: עֶרֶב
  choice: Pada waktu petang
  rationale: Nomina ini berfungsi sebagai keterangan waktu. Pilihan ini mempertahankan makna temporal tanpa menambahkan penunjuk “ini” yang tidak dinyatakan secara eksplisit.
- source_word: וִידַעְתֶּם
  choice: kamu akan tahu
  rationale: Bentuk ini paling wajar dipahami sebagai pengetahuan yang akan mereka peroleh; “akan tahu” lugas dan modern.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi dari apa yang akan diketahui.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: הוֹצִיא אֶתְכֶם
  choice: telah membawa kamu keluar
  rationale: Bentuk Hifil dari יצא berarti “membawa keluar.” Kata “telah” menandai tindakan eksodus yang sudah terjadi dan kini akan dikenali sebagai karya Yahweh.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: dari tanah Mesir
  rationale: “Tanah Mesir” mempertahankan unsur אֶרֶץ secara eksplisit dan tetap alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar.
- issue: Penekanan pada pelaku eksodus dalam כִּי יְהוָה הוֹצִיא
  choice: bahwa Yahweh-lah yang telah membawa
  alternative: bahwa Yahweh telah membawa
  rationale: 'Partikel penegas Indonesia “-lah” secara alami menampilkan kontras tersirat dalam konteks: umat akan mengetahui bahwa Yahweh, bukan Musa dan Harun, adalah pelaku pembebasan. Namun penegasan ini bersifat kontekstual dan bentuk tanpa “-lah” juga mungkin.'
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Petang” dipilih sebagai padanan baku untuk עֶרֶב; “orang Israel” mengungkapkan rujukan kolektif בְּנֵי יִשְׂרָאֵל tanpa membatasi sapaan pada laki-laki. Penanda catatan kaki [a] dicantumkan langsung setelah frasa terkait.
