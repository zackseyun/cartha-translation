    text: Secara harfiah, “satu omer untuk setiap kepala.”
    reason: Menunjukkan ungkapan Ibrani konkret לַגֻּלְגֹּלֶת yang dalam teks utama diterjemahkan menurut makna penghitungannya.
  revision_rationale: Revisi menghapus penambahan kecil ‘sebagian’, memperjelas objek manna yang tersirat pada perintah terakhir melalui ‘mengambilnya’, dan memperlancar ungkapan jumlah kolektif tanpa mengubah makna atau tingkat kepastian teks sumber.
