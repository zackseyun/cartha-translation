source:
  edition: WLC
  text: זֶ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר צִוָּ֣ה יְהוָ֔ה לִקְט֣וּ מִמֶּ֔/נּוּ אִ֖ישׁ לְ/פִ֣י אָכְל֑/וֹ עֹ֣מֶר לַ/גֻּלְגֹּ֗לֶת מִסְפַּר֙ נַפְשֹׁ֣תֵי/כֶ֔ם אִ֛ישׁ לַ/אֲשֶׁ֥ר בְּ/אָהֳל֖/וֹ תִּקָּֽחוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/016/016.yaml
  text: 'This is the word that Yahweh has commanded: ‘Gather from it[a], each man according to his eating; an omer per person, according to the number of your persons. Each man shall take for those who are in his tent.’'
translation:
  language: id
  text: 'Inilah yang diperintahkan Yahweh: “Kumpulkanlah darinya, masing-masing menurut keperluan makannya: satu omer untuk setiap orang[a], sesuai dengan jumlah orang di antara kalian. Setiap orang harus mengambilnya untuk orang-orang yang ada di dalam kemahnya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “satu omer untuk setiap kepala.”
    reason: Menunjukkan ungkapan Ibrani konkret לַגֻּלְגֹּלֶת yang dalam teks utama diterjemahkan menurut makna penghitungannya.
lexical_decisions:
- source_word: הַדָּבָר
  choice: yang
  rationale: Dalam rumusan זֶה הַדָּבָר אֲשֶׁר צִוָּה, bahasa Indonesia alami dapat menyatakannya sebagai ‘Inilah yang diperintahkan’; ini menyampaikan isi ketetapan tanpa ungkapan kaku ‘perkataan yang’.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai ‘Yahweh’, bukan diganti dengan gelar.
- source_word: לִקְטוּ מִמֶּנּוּ
  choice: Kumpulkanlah sebagian darinya
  rationale: לקט berarti mengumpulkan bahan makanan, sedangkan מן menyatakan bahwa orang mengambil sejumlah dari manna yang tersedia.
- source_word: אִישׁ לְפִי אָכְלוֹ
  choice: masing-masing menurut keperluan makannya
  rationale: איש dipakai secara distributif. Idiom לְפִי אָכְלוֹ menunjuk pada jumlah yang diperlukan untuk dimakan; ‘keperluan makannya’ alami dan tidak menetapkan jumlah yang tidak disebutkan.
- source_word: עֹמֶר
  choice: satu omer
  rationale: Omer adalah satuan takaran kering tertentu; transliterasi mempertahankan istilah sumber tanpa menyamakannya secara tidak pasti dengan satuan modern.
- source_word: לַגֻּלְגֹּלֶת
  choice: untuk setiap orang
  rationale: Secara harfiah berarti ‘untuk setiap kepala’; dalam konteks penghitungan, ‘untuk setiap orang’ menyampaikan maksudnya secara alami.
- source_word: מִסְפַּר נַפְשֹׁתֵיכֶם
  choice: sesuai dengan jumlah orang yang ada padamu
  rationale: נפש di sini berarti individu atau orang, bukan ‘jiwa’ dalam pengertian unsur nonjasmani. Akhiran orang kedua jamak dipertahankan dalam ungkapan kolektif ‘padamu’.
- source_word: לַאֲשֶׁר בְּאָהֳלוֹ
  choice: untuk mereka yang ada di dalam kemahnya
  rationale: Terjemahan ini mempertahankan gambaran konkret tentang orang-orang di dalam kemah tanpa mempersempitnya menjadi keluarga saja.
- source_word: תִּקָּחוּ
  choice: harus mengambil
  rationale: Bentuk orang kedua jamak memiliki daya perintah; bersama subjek distributif ‘masing-masing’, ‘harus mengambil’ terdengar wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama diri perjanjian יהוה. ‘Yahweh’ mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk ‘masing-masing’ mempertahankan daya distributif איש tanpa menambahkan pembedaan gender yang tidak diperlukan dalam bahasa Indonesia; gambaran konkret ‘kemah’ tetap dipertahankan.
