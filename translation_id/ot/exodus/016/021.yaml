  text: And they gathered it morning by morning[a], each according to what he could eat; but when the sun grew hot, it melted.
translation:
  language: id
  text: Mereka mengumpulkannya pagi demi pagi, masing-masing menurut apa yang dapat dimakannya; tetapi ketika matahari menjadi panas, itu mencair.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלְקְטוּ
  choice: mereka mengumpulkannya
  rationale: לקט lazim berarti mengumpulkan, khususnya bahan makanan; bentuk dengan enklitik -nya juga mempertahankan pronomina objek אֹתוֹ yang merujuk pada manna dalam konteks sebelumnya.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: pagi demi pagi
  rationale: Pengulangan nomina menyatakan tindakan distributif dan berulang; ungkapan ini mempertahankan pengulangan Ibrani secara wajar dalam bahasa Indonesia.
- source_word: אִישׁ כְּפִי אָכְלוֹ
  choice: masing-masing sesuai dengan yang dapat dimakannya
  rationale: אִישׁ dipakai secara distributif, sedangkan כְּפִי אָכְלוֹ secara harfiah berhubungan dengan takaran menurut makannya. Terjemahan ini menyampaikan kapasitas makan tiap orang tanpa ungkapan Indonesia yang kaku.
- source_word: וְחַם הַשֶּׁמֶשׁ
  choice: tetapi ketika matahari mulai terik
  rationale: חמם di sini menyatakan matahari menjadi panas. 'Mulai terik' alami dalam bahasa Indonesia dan menyampaikan perkembangan keadaan serta fungsi temporal klausa.
- source_word: וְנָמָס
  choice: benda itu mencair
  rationale: מסס berarti mencair atau meleleh. 'Mencair' sesuai bagi zat manna; 'benda itu' memperjelas subjek tersirat tanpa mengganti rujukannya dengan nama 'manna' yang tidak muncul dalam ayat ini.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. Susunan 'pagi demi pagi' mempertahankan corak repetitif teks Ibrani, sementara 'masing-masing' menerjemahkan penggunaan distributif אִישׁ secara alami tanpa membatasi rujukan hanya kepada laki-laki.
