base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/009.yaml
  text: And Yahweh said to Moses[a], “I have seen this people, and behold, it is a stiff-necked people.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa, “Aku telah melihat bangsa ini. Sesungguhnya, bangsa ini adalah bangsa yang tegar tengkuk.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “keras tengkuk”; sebuah kiasan untuk sikap keras kepala atau tidak mau tunduk.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Wayyiqtol melanjutkan urutan narasi. 'Lalu' alami dalam bahasa Indonesia, sedangkan 'berfirman' merupakan padanan bermartabat dan lazim ketika Allah menjadi subjek.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang dinyatakan langsung oleh Tetragramaton, bukan menggantinya dengan gelar.
- source_word: אֶל־מֹשֶׁה
  choice: kepada Musa
  rationale: Padanan langsung dan alami untuk penanda pihak yang diajak bicara.
- source_word: רָאִיתִי
  choice: Aku telah memperhatikan
  rationale: Dalam konteks ini verba 'melihat' menyatakan bahwa Yahweh telah mengamati dan menilai keadaan bangsa itu. 'Telah memperhatikan' mempertahankan aspek selesai dengan relevansi kini tanpa menyiratkan penglihatan sepintas.
- source_word: הָעָם הַזֶּה
  choice: bangsa ini
  rationale: עַם adalah kelompok manusia sebagai satu kesatuan; 'bangsa ini' alami dalam bahasa Indonesia dan mempertahankan daya demonstratif serta nada berjarak.
- source_word: וְהִנֵּה
  choice: Sesungguhnya
  rationale: Menandai dan menegaskan kesimpulan yang harus diperhatikan. 'Sesungguhnya' mempertahankan bobot retoris dalam ragam Indonesia yang bermartabat.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: bangsa yang tegar tengkuk
  rationale: Mempertahankan metafora Ibrani secara wajar. Ungkapan ini menggambarkan sikap keras kepala dan tidak mau tunduk.
- source_word: הוּא
  choice: mereka adalah
  rationale: Pronomina tunggal Ibrani mengacu pada nomina kolektif עַם. Bahasa Indonesia secara alami dapat merujuk anggota kolektif itu dengan 'mereka' tanpa mengubah acuannya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian secara langsung; bentuk 'Yahweh' mempertahankan nama itu dan tidak mengubahnya menjadi gelar.
- issue: Makna metafora קְשֵׁה עֹרֶף
  choice: tegar tengkuk
  alternative: keras kepala
  rationale: Metafora sumber dipertahankan agar citra penolakan untuk tunduk tidak diratakan menjadi penjelasan abstrak; maknanya dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami sambil mempertahankan nama Yahweh, penegasan וְהִנֵּה, dan metafora Ibrani. Penanda catatan kaki ditempatkan tepat setelah ungkapan yang dijelaskan.
