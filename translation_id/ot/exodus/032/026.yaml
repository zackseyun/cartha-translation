base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/026.yaml
  text: Then Moses stood at the gate of the camp and said[a], “Whoever is for Yahweh[b], come to me.” And all the sons of Levi gathered to him.
translation:
  language: id
  text: Lalu Musa berdiri di pintu gerbang perkemahan dan berkata, “Siapa yang berpihak kepada Yahweh, datanglah kepadaku![a]” Maka seluruh putra Lewi[b] berkumpul menghadap Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani berbunyi secara eliptis, “Siapa bagi Yahweh? Kepadaku!” Kata “datanglah” menyatakan ajakan yang tersirat.
    reason: lexical_alternative
  - marker: b
    text: Atau, “seluruh orang Lewi.” Secara harfiah, “seluruh putra Lewi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: berdiri
  rationale: Kata kerja עמד dalam rangkaian narasi ini secara langsung menyatakan bahwa Musa mengambil posisi berdiri; “berdiri” alami dan tidak menambahkan nuansa resmi atau militer.
- source_word: בְּשַׁעַר הַמַּחֲנֶה
  choice: di pintu gerbang perkemahan
  rationale: שַׁעַר menunjuk pada pintu gerbang, dan frasa ini menempatkan Musa di lokasi tersebut. “Pintu gerbang” mempertahankan gambaran konkret sumber.
- source_word: מִי לַיהוָה
  choice: Siapa yang berpihak kepada Yahweh
  rationale: Secara harfiah, frasa ini berarti “Siapa bagi/untuk Yahweh?” Dalam konteks panggilan untuk menyatakan kesetiaan, “berpihak kepada” mengungkapkan makna loyalitas tanpa mengubahnya menjadi klaim kepemilikan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap tampak dan tidak diganti dengan sebuah gelar.
- source_word: אֵלָי
  choice: datanglah kepadaku
  rationale: Teks Ibrani hanya berbunyi “kepadaku,” tetapi dalam konteksnya merupakan seruan eliptis. Kata kerja “datanglah” menyatakan tindakan yang tersirat secara minimal dan alami dalam bahasa Indonesia.
- source_word: וַיֵּאָסְפוּ אֵלָיו
  choice: berkumpul kepadanya
  rationale: Bentuk Nifal dari אסף menyatakan tindakan berkumpul, sedangkan אֵלָיו menunjukkan gerak menuju Musa. Pilihan ini tidak menambahkan warna militer seperti “merapat” atau “berhimpun di sekelilingnya.”
- source_word: כָּל בְּנֵי לֵוִי
  choice: seluruh bani Lewi
  rationale: “Bani Lewi” merupakan ungkapan Indonesia yang ringkas dan bermartabat untuk kelompok keturunan Lewi, sambil tetap mencerminkan konstruksi sumber “anak-anak lelaki Lewi.” Catatan kaki menjelaskan bentuk harfiahnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Sumber memakai Tetragramaton sebagai nama pribadi. “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar, sementara “Yehuwa” mencerminkan bentuk pelafalan tradisional yang lebih jauh dari rekonstruksi yang lazim.
- issue: Makna kesetiaan dalam מִי לַיהוָה
  choice: Siapa yang berpihak kepada Yahweh
  alternative: Siapa yang menjadi milik Yahweh
  rationale: Preposisi ל dapat menyatakan hubungan atau keberpihakan. Konteks konfrontasi setelah penyembahan anak lembu mendukung seruan untuk menyatakan kesetiaan, tetapi terjemahan tidak memperluasnya menjadi rumusan doktrinal tentang kepemilikan.
- issue: Sebutan kelompok בְּנֵי לֵוִי
  choice: seluruh bani Lewi
  alternative: semua orang Lewi atau semua anak lelaki Lewi
  rationale: Pilihan ini mempertahankan identitas keturunan/suku dalam idiom Indonesia. Catatan bentuk harfiah menjaga unsur maskulin dan hubungan genealogis yang terdapat dalam bahasa Ibrani.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. “Pintu gerbang perkemahan” mempertahankan gambaran konkret, sedangkan “bani Lewi” menjaga corak genealogis tanpa terdengar seolah-olah hanya merujuk kepada putra-putra langsung Lewi. Tanda seru dipakai untuk mencerminkan kuatnya seruan eliptis Musa.
