lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: mendengar
  rationale: Bentuk Qal wayyiqtol dari שׁמע menyatakan persepsi melalui pendengaran dalam rangkaian narasi.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: קוֹל
  choice: suara
  rationale: קוֹל dapat berarti suara, bunyi, atau kegaduhan. 'Suara' cukup luas untuk menggambarkan bunyi kerumunan pada kemunculan pertama dan bunyi peperangan pada kemunculan kedua.
- source_word: הָעָם
  choice: bangsa itu
  rationale: עָם menunjuk kepada umat Israel secara kolektif; 'bangsa itu' mempertahankan bentuk kolektif dan penandaan definit sumber.
- source_word: בְּרֵעֹה
  choice: bersorak-sorai
  rationale: Ungkapan ini menggambarkan seruan keras atau riuh. Bentuk tunggal pronominalnya selaras dengan עָם sebagai kata benda kolektif; bahasa Indonesia secara alami dapat memakai verba tanpa menandai jumlah.
- source_word: וַיֹּאמֶר אֶל־מֹשֶׁה
  choice: berkatalah ia kepada Musa
  rationale: Rumusan naratif yang wajar dan bermartabat, dengan rujukan pronominal kepada Yosua tetap jelas.
- source_word: קוֹל מִלְחָמָה
  choice: suara peperangan
  rationale: Mempertahankan susunan frasa Ibrani secara dekat. 'Peperangan' menyampaikan מִלְחָמָה tanpa menentukan apakah yang terdengar adalah satu pertempuran tertentu atau perang dalam arti lebih luas.
- source_word: בַּמַּחֲנֶה
  choice: di perkemahan
  rationale: מַחֲנֶה di sini menunjuk kepada tempat bangsa Israel berkemah; 'di perkemahan' merupakan padanan langsung dan alami.
