  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. Struktur kalimat dibagi pada titik memuncaknya amarah Musa agar mudah dibaca tanpa menghilangkan urutan tindakan dalam teks Ibrani.
