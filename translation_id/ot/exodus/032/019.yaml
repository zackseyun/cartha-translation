base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/019.yaml
  text: And as soon as he came near the camp and saw the calf and the dancing[a], Moses' anger burned, and he threw the tablets from his hands and shattered them at the foot of the mountain.
translation:
  language: id
  text: Ketika Musa mendekati perkemahan dan melihat anak sapi itu serta tari-tarian[a], amarahnya berkobar. Ia melemparkan loh-loh itu dari tangannya dan memecahkannya di kaki gunung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tarian-tarian.”'
    reason: Bentuk jamak kata Ibrani dapat diterjemahkan secara lebih harfiah sebagai “tarian-tarian”; “tari-tarian” dipilih karena lebih alami dalam kalimat Indonesia.
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר קָרַב אֶל הַמַּחֲנֶה
  choice: Ketika Musa sudah dekat dengan perkemahan
  rationale: Rumus naratif וַיְהִי כַּאֲשֶׁר disampaikan secara alami dengan 'ketika'; 'sudah dekat' mempertahankan makna spasial קָרַב. Nama 'Musa' digunakan sebagai subjek eksplisit agar kalimat Indonesia jelas dan mengalir.
- source_word: וַיַּרְא אֶת הָעֵגֶל
  choice: dan melihat anak sapi itu
  rationale: רָאָה berarti 'melihat', sedangkan artikel tertentu pada הָעֵגֶל menunjuk kepada patung anak sapi yang telah disebutkan dalam konteks.
- source_word: וּמְחֹלֹת
  choice: serta tari-tarian
  rationale: Bentuk jamak מְחֹלֹת secara langsung menunjuk pada tarian-tarian. 'Tari-tarian' alami dalam bahasa Indonesia dan tidak memasukkan penafsiran tambahan seperti 'pesta pora'.
- source_word: וַיִּחַר אַף מֹשֶׁה
  choice: berkobarlah amarahnya
  rationale: Ungkapan ini mempertahankan gambaran idiom Ibrani tentang amarah yang menyala, sekaligus terdengar wajar dan bermartabat dalam bahasa Indonesia.
- source_word: וַיַּשְׁלֵךְ מִיָּדוֹ אֶת הַלֻּחֹת
  choice: Ia melemparkan kedua loh itu dari tangannya
  rationale: שָׁלַךְ berarti melemparkan. 'Kedua loh' mengungkapkan jumlah yang sudah jelas dari bentuk jamak dan konteks terdekat, sedangkan bentuk tunggal Ibrani 'tangannya' dipertahankan.
- source_word: וַיְשַׁבֵּר אֹתָם
  choice: dan menghancurkannya
  rationale: שָׁבַר menyatakan tindakan memecahkan atau menghancurkan; 'menghancurkan' menyampaikan kuatnya tindakan tanpa menjadi bahasa percakapan.
- source_word: תַּחַת הָהָר
  choice: di kaki gunung
  rationale: Dalam konteks topografis, ungkapan ini secara idiomatis berarti bagian bawah atau kaki gunung, bukan secara harfiah berada tepat di bawah gunung.
