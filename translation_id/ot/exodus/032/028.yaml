    issue: “orang” tidak menerjemahkan unsur gender dalam אִישׁ.
    rationale: Frasa כשלשת אלפי איש berarti kira-kira tiga ribu laki-laki; sumber secara eksplisit memakai איש, bukan istilah netral untuk orang.
  - severity: low
    issue: “bangsa itu” kurang tepat untuk העם dalam konteks ini.
    rationale: העם menunjuk kelompok umat/rakyat Israel yang menjadi bagian dari narasi, bukan terutama sebuah bangsa dalam pengertian kenegaraan.
  - severity: low
