base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/028.yaml
  text: And the sons of Levi did according to the word of Moses[a], and about three thousand men from among the people fell that day.
translation:
  language: id
  text: Keturunan Lewi bertindak sesuai dengan perkataan Musa. Pada hari itu, kira-kira tiga ribu laki-laki dari antara umat itu tewas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “jatuh,” ungkapan yang lazim untuk mati atau terbunuh; dapat juga diterjemahkan “dibunuh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: melakukan
  rationale: Kata kerja עשה bersifat luas; dalam konstruksi ini, “melakukan” menyampaikan tindakan menaati perintah secara alami.
- source_word: בְנֵי לֵוִי
  choice: keturunan Lewi
  rationale: Secara harfiah berarti “anak-anak lelaki Lewi,” tetapi di sini menunjuk kepada kelompok keturunannya; “keturunan Lewi” mempertahankan ungkapan kekerabatan tanpa terdengar janggal.
- source_word: כִּדְבַר מֹשֶׁה
  choice: seperti yang diperintahkan Musa
  rationale: דבר secara harfiah adalah “perkataan,” tetapi dalam konteks ayat sebelumnya jelas berfungsi sebagai perintah; bentuk ini alami dan tidak mengubah rujukannya.
- source_word: וַיִּפֹּל
  choice: tewas
  rationale: Secara harfiah “jatuh,” sebuah idiom yang dalam konteks pembunuhan berarti mati atau terbunuh. “Tewas” mempertahankan bobot naratif dan tetap cukup dekat dengan idiom tersebut.
- source_word: מִן הָעָם
  choice: dari antara bangsa itu
  rationale: 'Menyampaikan fungsi partitif מן: mereka yang tewas merupakan sebagian dari העם, yakni bangsa yang sedang dibicarakan.'
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu
  rationale: Padanan temporal yang langsung dan alami dalam bahasa Indonesia modern.
- source_word: כִּשְׁלֹשֶׁת אַלְפֵי אִישׁ
  choice: kira-kira tiga ribu orang
  rationale: Awalan כ־ menyatakan perkiraan. אִישׁ dalam pernyataan jumlah ini dapat diterjemahkan secara alami sebagai “orang”; konteks memperlihatkan bahwa korban adalah orang-orang yang diserang oleh keturunan Lewi.
theological_decisions:
- issue: Pernyataan korban dalam konteks penghukuman
  choice: kira-kira tiga ribu orang dari antara bangsa itu tewas
  alternative: kira-kira tiga ribu orang dari antara bangsa itu jatuh; kira-kira tiga ribu orang dari bangsa itu dibunuh
  rationale: Ibrani memakai “jatuh” sebagai idiom kematian, bukan kata kerja eksplisit “membunuh.” “Tewas” menyampaikan makna idiom dalam bahasa Indonesia tanpa memperkenalkan rincian teologis tambahan, sementara catatan kaki mempertahankan bentuk harfiahnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Keturunan Lewi” dipilih daripada “anak-anak Lewi” agar hubungan genealogis jelas; kalimat dipecah menjadi dua demi kelancaran tanpa mengubah urutan peristiwa.
