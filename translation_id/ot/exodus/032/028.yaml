  source_fidelity: Draf dengan tepat menyampaikan tindakan בני לוי, unsur perkiraan pada כשלשת, dan idiom ויפל melalui “tewas” yang dijelaskan dalam catatan kaki. Namun, אִישׁ secara khusus menunjuk laki-laki, sehingga “orang” terlalu menetralkan rincian sumber. Selain itu, העם lebih tepat diterjemahkan “umat” atau “rakyat” dalam konteks ini daripada “bangsa,” yang dapat menyiratkan entitas politik modern.
  naturalness: Kalimat draf dapat dipahami, tetapi “melakukan seperti yang diperintahkan Musa” kurang luwes karena objek tindakan tidak disebutkan. “Bertindak sesuai dengan perkataan Musa” alami, tetap dekat dengan konstruksi Ibrani, dan tidak memaksakan “perintah” ke dalam teks ayat ini.
  terminology: “Keturunan Lewi” adalah padanan yang wajar bagi בני לוי dalam bahasa Indonesia modern. “Umat itu” sesuai untuk העם dalam konteks komunitas Israel. “Laki-laki” mempertahankan ketepatan gender אִישׁ.
