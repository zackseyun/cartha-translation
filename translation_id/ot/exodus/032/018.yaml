translation:
  language: id
  text: Lalu Musa berkata, “Itu bukan suara sorak kemenangan, dan bukan suara sorak kekalahan; yang kudengar ialah suara nyanyian.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu berkatalah Musa
  rationale: Wayyiqtol meneruskan alur narasi. Subjek tersirat diperjelas sebagai Musa dari konteks dekat agar rujukannya alami dan jelas dalam bahasa Indonesia.
- source_word: קוֹל
  choice: bunyi
  rationale: ‘Bunyi’ dapat dipakai secara alami pada ketiga kemunculan dan tidak membatasi maknanya pada suara ujaran.
- source_word: עֲנוֹת / עַנּוֹת
  choice: sorak / ratapan / nyanyian
  rationale: Bentuk-bentuk dari ענה di sini menunjuk pada keluaran suara. Pasangannya dengan ‘kemenangan’ dan ‘kekalahan’ mengarahkan dua klausa pertama pada sorak dan ratapan pertempuran, sedangkan konteks pesta anak lembu mendukung ‘nyanyian’ dalam klausa terakhir.
- source_word: גְּבוּרָה
  choice: kemenangan
  rationale: Walau secara leksikal dapat berarti kekuatan atau keperkasaan, pertentangannya dengan חֲלוּשָׁה dalam konteks suara yang disangka berasal dari pertempuran paling alami menyatakan kemenangan.
- source_word: חֲלוּשָׁה
  choice: kekalahan
  rationale: Kata ini berkaitan dengan kelemahan, tetapi dalam kontras militer dengan גְּבוּרָה menunjuk pada keadaan pihak yang dikalahkan.
- source_word: אֵין
  choice: bukan
  rationale: Konstruksi negasi berulang ini paling alami diterjemahkan ‘bukan bunyi ...’ dalam bahasa Indonesia.
- source_word: אָנֹכִי שֹׁמֵעַ
  choice: yang kudengar ialah
  rationale: Mengungkapkan persepsi langsung masa kini dengan susunan Indonesia yang alami sekaligus memberi penekanan kontras pada jenis bunyi yang didengar.
