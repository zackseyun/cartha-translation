translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Paralelisme tiga klausa dipertahankan, dengan perbedaan jenis suara dibuat alami dalam bahasa sasaran. Tidak ditambahkan catatan kaki karena alternatif leksikal tidak diperlukan untuk memahami ayat, dan teks utama sudah mencerminkan pergeseran kontekstual yang mungkin pada bentuk-bentuk dari ענה.
