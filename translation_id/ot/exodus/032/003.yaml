translation:
  language: id
  text: Maka seluruh rakyat menanggalkan[a] anting-anting emas[b] yang ada di telinga mereka, lalu membawanya kepada Harun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menanggalkan dengan paksa” atau “melepaskan secara paksa.” Kata kerja Ibrani ini dapat menekankan pelepasan yang kuat atau tegas.
    reason: lexical_alternative
  - marker: b
    text: Atau, “cincin emas.” Istilah Ibrani ini dapat merujuk pada cincin atau perhiasan; dalam konteks ini, frasa berikutnya menunjukkan bahwa perhiasan itu dikenakan di telinga.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּרְקוּ
  choice: menanggalkan
  rationale: Bentuk hitpael dari פרק menyatakan bahwa mereka melepaskan perhiasan dari diri sendiri. “Menanggalkan” alami dalam bahasa Indonesia dan tetap dapat mengisyaratkan tindakan pelepasan yang tegas.
- source_word: כָּל הָעָם
  choice: seluruh rakyat
  rationale: Ungkapan ini menunjuk kepada komunitas yang berkumpul secara kolektif; “seluruh rakyat” merupakan padanan Indonesia yang langsung dan wajar.
- source_word: נִזְמֵי הַזָּהָב
  choice: anting-anting emas
  rationale: נֶזֶם dapat berarti cincin perhiasan pada hidung atau telinga, tetapi frasa berikutnya secara eksplisit menempatkannya di telinga. Karena itu, “anting-anting emas” paling alami dan tepat dalam konteks ini.
- source_word: אֲשֶׁר בְּאָזְנֵיהֶם
  choice: yang ada di telinga mereka
  rationale: Klausa relatif ini menyatakan letak perhiasan tersebut dan diterjemahkan secara dekat sekaligus alami.
- source_word: וַיָּבִיאוּ אֶל אַהֲרֹן
  choice: lalu membawanya kepada Harun
  rationale: Verba berarti membawa. Pronomina “-nya” merujuk secara kolektif kepada anting-anting yang baru disebutkan.
