  text: And Aaron said[a], “Do not let my lord’s anger burn hot. You know the people, that they are set on evil.”
translation:
  language: id
  text: Lalu Harun berkata, “Janganlah murka tuanku menyala-nyala. Tuanku sendiri tahu bahwa bangsa itu cenderung kepada kejahatan.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “berkeras dalam kejahatan” atau “condong kepada kejahatan.” Ungkapan Ibrani ini bersifat idiomatis dan menggambarkan bangsa itu sebagai bangsa yang bercirikan kejahatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk naratif Ibrani memperkenalkan jawaban Harun. “Lalu” menjaga alur cerita secara alami dalam bahasa Indonesia tanpa menambahkan hubungan sebab-akibat.
- source_word: אַהֲרֹן
  choice: Harun
  rationale: Menggunakan bentuk nama yang sudah baku dan dikenal luas dalam bahasa Indonesia.
- source_word: אַל יִחַר אַף
  choice: Janganlah murka ... menyala-nyala
  rationale: Mempertahankan metafora Ibrani tentang kemarahan yang menyala, sekaligus tetap wajar dan bermartabat dalam bahasa Indonesia.
- source_word: אֲדֹנִי
  choice: Tuanku
  rationale: Sapaan hormat ini ditujukan kepada Musa, bukan gelar ilahi. “Tuanku” menyampaikan penghormatan dan hubungan hierarkis tanpa menimbulkan kesan bahwa Musa dipanggil sebagai Tuhan.
- source_word: אַתָּה יָדַעְתָּ
  choice: Tuanku sendiri tahu
  rationale: Kata ganti yang dinyatakan secara eksplisit dalam bahasa Ibrani memberi penekanan. “Sendiri” menyampaikan penekanan itu, sedangkan pengulangan “Tuanku” menjaga sapaan tetap alami dalam konteks ini.
- source_word: הָעָם
  choice: bangsa ini
  rationale: Konteks menunjuk kepada umat Israel yang hadir. “Bangsa ini” lebih alami daripada “bangsa itu” ketika Harun dan Musa sedang membicarakan kelompok yang berada di sekitar mereka.
- source_word: כִּי
  choice: bahwa
  rationale: Memperkenalkan isi yang diketahui Musa tentang bangsa itu.
- source_word: בְרָע הוּא
  choice: mereka cenderung kepada kejahatan
  rationale: Ungkapan Ibrani secara harfiah kurang lebih berarti “ia berada dalam kejahatan,” dengan kata ganti tunggal yang merujuk secara kolektif kepada bangsa itu. Terjemahan ini menyampaikan kecenderungan moral yang menjadi ciri mereka tanpa mempertahankan konstruksi harfiah yang janggal.
theological_decisions:
- issue: Makna אֲדֹנִי sebagai sapaan kepada manusia
  choice: Tuanku
  alternative: Tuan; junjunganku
  rationale: Yang disapa ialah Musa. Karena itu, bentuk ini harus dibedakan dari gelar ilahi, tetapi tetap menyatakan sikap hormat Harun.
- issue: Kekuatan ungkapan בְרָע הוּא
  choice: cenderung kepada kejahatan
  alternative: berkeras dalam kejahatan; dikuasai kejahatan
  rationale: Bahasa sumber menggambarkan bangsa itu sebagai bercirikan kejahatan, tetapi tidak menentukan secara persis apakah tekanannya pada kecenderungan, keteguhan niat, atau keadaan mereka. Teks utama memakai ungkapan yang alami dan tidak terlalu menentukan; alternatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa modern, wajar, dan bermartabat. “Murka ... menyala-nyala” mempertahankan gambaran bahasa sumber; “Tuanku” menandai sapaan hormat kepada Musa dan sengaja tidak memakai bentuk gelar ilahi.
