  text: וַ/יָּ֧שָׁב מֹשֶׁ֛ה אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר אָ֣נָּ֗א חָטָ֞א הָ/עָ֤ם הַ/זֶּה֙ חֲטָאָ֣ה גְדֹלָ֔ה וַ/יַּֽעֲשׂ֥וּ לָ/הֶ֖ם אֱלֹהֵ֥י זָהָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/031.yaml
  text: Then Moses returned to Yahweh and said[a], “Please, this people has sinned a great sin, and they have made gods of gold for themselves.”
translation:
  language: id
  text: Lalu Musa kembali kepada Yahweh dan berkata, “Ah, bangsa ini telah berdosa besar. Mereka telah membuat ilah-ilah emas bagi diri mereka sendiri.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebuah ilah emas.” Teks Ibrani berbunyi “ilah-ilah emas” dalam bentuk jamak, meskipun sebagian orang memahaminya sebagai satu ilah karena konteks yang lebih luas mengacu pada anak lembu emas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: kembali
  rationale: Bentuk ini menyatakan bahwa Musa kembali menghadap Yahweh setelah berurusan dengan umat; “kembali” alami dan ringkas dalam bahasa Indonesia.
- source_word: אֶל יְהוָה
  choice: kepada Yahweh
  rationale: Preposisi אֶל menunjukkan arah atau tujuan, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh” sesuai bukti teks sumber.
- source_word: אָנָּא
  choice: Ya
  rationale: Partikel ini mengungkapkan permohonan yang sungguh-sungguh. “Ya” mempertahankan nada seruan dan permohonan Musa tanpa terdengar kaku.
- source_word: חָטָא ... חֲטָאָה גְדֹלָה
  choice: telah melakukan dosa besar
  rationale: Konstruksi serumpun ini menegaskan beratnya dosa. Ungkapan Indonesia ini menyampaikan tindakan yang sudah terjadi dan tetap relevan dalam permohonan Musa.
- source_word: הָעָם הַזֶּה
  choice: umat ini
  rationale: עָם merupakan nomina kolektif tunggal. “Umat ini” mempertahankan bentuk kolektif dan cocok dengan konteks umat Israel.
- source_word: וַיַּעֲשׂוּ לָהֶם
  choice: mereka telah membuat bagi diri mereka sendiri
  rationale: Frasa לָהֶם memuat nuansa bahwa benda itu dibuat untuk mereka sendiri; bentuk ini mempertahankan nuansa refleksif tersebut.
- source_word: אֱלֹהֵי זָהָב
  choice: ilah-ilah dari emas
  rationale: Bentuk Ibrani secara gramatikal plural dan berstatus konstruktus. Terjemahan utama mempertahankan pluralitas itu, sementara konteks anak lembu emas yang tunggal dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks secara langsung memakai Tetragramaton. “Yahweh” mempertahankan nama perjanjian itu, bukan menggantinya dengan gelar.
- issue: Bilangan pada אֱלֹהֵי זָהָב
  choice: ilah-ilah dari emas
  alternative: sebuah ilah dari emas
  rationale: Bentuk sumber adalah plural, sehingga plural dipertahankan dalam teks utama. Namun, konteks yang lebih luas berpusat pada satu anak lembu emas, sehingga kemungkinan pemahaman singular tetap dicatat tanpa menghapus ketegangan teks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Umat” mempertahankan pengertian kolektif; “ilah-ilah” dipakai untuk אֱלֹהִים dalam rujukan kepada berhala, sedangkan “Yahweh” mempertahankan nama ilahi. Penanda catatan kaki ditempatkan langsung setelah frasa yang dijelaskan.
