source:
  edition: WLC
  text: וַ/יַּ֣רְא הָ/עָ֔ם כִּֽי בֹשֵׁ֥שׁ מֹשֶׁ֖ה לָ/רֶ֣דֶת מִן הָ/הָ֑ר וַ/יִּקָּהֵ֨ל הָ/עָ֜ם עַֽל אַהֲרֹ֗ן וַ/יֹּאמְר֤וּ אֵלָי/ו֙ ק֣וּם עֲשֵׂה לָ֣/נוּ אֱלֹהִ֗ים אֲשֶׁ֤ר יֵֽלְכוּ֙ לְ/פָנֵ֔י/נוּ כִּי זֶ֣ה מֹשֶׁ֣ה הָ/אִ֗ישׁ אֲשֶׁ֤ר הֶֽעֱלָ֨/נוּ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לֹ֥א יָדַ֖עְנוּ מֶה הָ֥יָה לֽ/וֹ־־־׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/001.yaml
  text: When the people saw that Moses was taking a long time to come down from the mountain[a], the people gathered around Aaron and said to him, “Get up, make gods for us that will go before us, because this Moses, the man who brought us up from the land of Egypt—we do not know what has happened to him.”
translation:
  language: id
  text: Ketika bangsa itu melihat bahwa Musa terlalu lama tidak turun dari gunung, mereka berkerumun mengelilingi Harun dan berkata kepadanya, “Bangunlah, buatlah bagi kami ilah-ilah[a] yang akan berjalan di depan kami, sebab Musa ini, orang yang telah membawa kami keluar dari tanah Mesir itu—kami tidak tahu apa yang telah terjadi padanya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seorang ilah yang akan berjalan di depan kami.” Sebagian orang memahami אֱלֹהִים di sini dalam arti tunggal karena kisah selanjutnya berpusat pada satu patung anak sapi. Namun, bentuk kata Ibraninya dan kata kerja yang mengikutinya sama-sama berbentuk jamak.
    reason: alternative_reading
lexical_decisions:
- source_word: בֹשֵׁשׁ
  choice: terlalu lama
  rationale: Kata kerja ini menyatakan kelambatan atau penundaan. Dalam konteks persepsi bangsa itu, “terlalu lama” terdengar alami dan menyampaikan ketidaksabaran mereka.
- source_word: לָרֶדֶת
  choice: turun
  rationale: Kata ini secara langsung menyatakan gerak turun dari gunung; bentuk Indonesia tidak perlu membedakan “come down” dan “go down”.
- source_word: הָהָר
  choice: gunung
  rationale: Dalam konteks ini yang dimaksud adalah gunung tempat Musa berada; bentuk definit bahasa Ibrani tersampaikan melalui konteks.
- source_word: וַיִּקָּהֵל ... עַל אַהֲרֹן
  choice: berkerumun mengelilingi Harun
  rationale: Ungkapan ini menggambarkan bangsa itu berkumpul rapat di sekitar Harun dan memberi kesan tekanan tanpa secara berlebihan menerjemahkannya sebagai tindakan menyerang.
- source_word: קוּם
  choice: Bangunlah
  rationale: Imperatif ini tegas dan mendesak. “Bangunlah” mempertahankan bentuk perintah secara alami dan bermartabat.
- source_word: עֲשֵׂה לָנוּ
  choice: buatlah bagi kami
  rationale: Terjemahan ini mempertahankan unsur penerima manfaat dalam pronomina datif לָנוּ.
- source_word: אֱלֹהִים
  choice: ilah-ilah
  rationale: Nomina ini berbentuk jamak dan diikuti kata kerja jamak יֵלְכוּ. “Ilah-ilah” mempertahankan petunjuk gramatikal itu tanpa memakai “Allah” untuk berhala yang diminta bangsa tersebut.
- source_word: אֲשֶׁר יֵלְכוּ לְפָנֵינוּ
  choice: yang akan berjalan di depan kami
  rationale: Klausa relatif dan fungsi sebagai pemimpin atau penuntun dipertahankan, begitu pula kesesuaian jamaknya melalui rujukan kepada “ilah-ilah”.
- source_word: הָאִישׁ
  choice: orang ... itu
  rationale: 'Dalam aposisi dengan “Musa ini,” bentuk ini mempertahankan penyebutan yang bernada menjauhkan: “Musa ini, orang ... itu.”'
- source_word: הֶעֱלָנוּ
  choice: membawa kami keluar
  rationale: Secara harfiah verba ini berarti “membawa naik,” tetapi dalam bahasa Indonesia, “membawa keluar dari tanah Mesir” lebih alami dan tetap menyampaikan peristiwa eksodus secara tepat.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: dari tanah Mesir
  rationale: “Tanah Mesir” mempertahankan unsur אֶרֶץ dan merupakan ungkapan Indonesia yang wajar dalam register Alkitab yang modern.
- source_word: מֶה הָיָה לוֹ
  choice: apa yang telah terjadi padanya
  rationale: Ini adalah padanan idiomatis modern bagi pertanyaan tentang nasib Musa dan mempertahankan hubungan dengan keadaan sekarang.
theological_decisions:
- issue: Apakah אֱלֹהִים dalam ayat ini diterjemahkan sebagai tunggal atau jamak
  choice: 'Jamak: “ilah-ilah”'
  alternative: 'Tunggal: “seorang ilah” atau “suatu ilah”'
  rationale: Bentuk אֱלֹהִים secara morfologis jamak dan verba יֵלְכוּ juga jamak. Namun, karena kisah selanjutnya berpusat pada satu patung anak sapi, kemungkinan pemahaman tunggal dicantumkan dalam catatan kaki tanpa menggantikan petunjuk gramatikal teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Susunan kalimat mempertahankan desakan bangsa itu dan nada meremehkan dalam “Musa ini,” sambil menghindari ungkapan arkais. Penanda catatan kaki [a] ditempatkan tepat setelah klausa yang memiliki alternatif tunggal.
