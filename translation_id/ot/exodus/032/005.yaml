base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/005.yaml
  text: When Aaron saw it[a], he built an altar before it. Then Aaron proclaimed and said, “Tomorrow will be a feast to Yahweh.”
translation:
  language: id
  text: Ketika Harun melihatnya, ia membangun sebuah mezbah di hadapannya.[a] Lalu Harun mengumumkan, “Besok akan ada perayaan bagi Yahweh.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Akhiran “-nya” dalam “di hadapannya” dapat secara tata bahasa merujuk kepada Harun, tetapi konteks lebih mungkin menunjuk kepada anak lembu itu.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּרְא
  choice: Ketika Harun melihatnya
  rationale: Verba berarti 'melihat'; objek pronominal disuplai secara wajar dari konteks, yakni anak lembu pada ayat sebelumnya. 'Ketika' menyampaikan hubungan temporal rangkaian narasi dengan alami.
- source_word: וַיִּבֶן מִזְבֵּחַ
  choice: ia membangun sebuah mezbah
  rationale: '''Membangun sebuah mezbah'' merupakan padanan langsung, alami, dan mempertahankan makna peribadatan.'
- source_word: לְפָנָיו
  choice: di hadapannya
  rationale: Bentuk Ibrani memuat sufiks maskulin tunggal. Ungkapan Indonesia ini mempertahankan ketaksaan gramatikal mengenai acuannya, walaupun konteks lebih mungkin menunjuk kepada anak lembu.
- source_word: וַיִּקְרָא ... וַיֹּאמַר
  choice: Lalu Harun mengumumkan
  rationale: Konstruksi harfiah 'berseru dan berkata' di sini berfungsi sebagai pengumuman publik; 'mengumumkan' menyampaikan fungsi itu tanpa pengulangan yang kaku.
- source_word: חַג
  choice: perayaan
  rationale: חַג menunjuk pada perayaan atau hari raya keagamaan. 'Perayaan' jelas dan alami bagi pembaca Indonesia serta tidak mempersempitnya menjadi jamuan makan.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menandai peruntukan atau dedikasi; 'bagi' alami dalam konteks perayaan yang dinyatakan untuk Yahweh.
- source_word: מָחָר
  choice: Besok akan ada
  rationale: Klausa nominal Ibrani memerlukan kopula atau konstruksi eksistensial dalam bahasa Indonesia; 'akan ada' menghasilkan pengumuman yang jelas dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama perjanjian יהוה secara langsung; 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Acuan sufiks dalam לְפָנָיו
  choice: di hadapannya, dengan acuan utama anak lembu tetapi tetap ambigu dalam teks
  alternative: di depan anak lembu itu; di hadapan Harun
  rationale: Konteks paling mungkin menunjuk kepada anak lembu yang baru dibuat, tetapi tata bahasa juga memungkinkan acuan kepada Harun. Terjemahan utama mempertahankan ketaksaan asli, dan catatan menjelaskannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif dibuat alami tanpa menghilangkan ketaksaan asli; istilah 'mezbah', 'perayaan', dan nama 'Yahweh' mempertahankan nuansa peribadatan.
