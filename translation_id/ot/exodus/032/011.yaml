  text: וַ/יְחַ֣ל מֹשֶׁ֔ה אֶת פְּנֵ֖י יְהוָ֣ה אֱלֹהָ֑י/ו וַ/יֹּ֗אמֶר לָ/מָ֤ה יְהוָה֙ יֶחֱרֶ֤ה אַפְּ/ךָ֙ בְּ/עַמֶּ֔/ךָ אֲשֶׁ֤ר הוֹצֵ֨אתָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/כֹ֥חַ גָּד֖וֹל וּ/בְ/יָ֥ד חֲזָקָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/011.yaml
  text: But Moses pleaded with Yahweh his God and said[a], “Why, Yahweh, should your anger burn against your people[b], whom you brought out of the land of Egypt with great power and with a strong hand?”
translation:
  language: id
  text: Tetapi Musa memohon dengan sungguh-sungguh kepada Yahweh, Allahnya[a], lalu berkata, “Mengapa murka-Mu harus menyala terhadap umat-Mu, yang telah Engkau bawa keluar dari tanah Mesir dengan kuasa yang besar dan tangan yang kuat?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini secara harfiah menyebut “wajah Yahweh, Allahnya” dan berarti memohon perkenanan atau memohon dengan sungguh-sungguh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַל ... אֶת־פְּנֵי
  choice: memohon belas kasihan
  rationale: Gabungan ini secara harfiah menyebut ‘wajah’, tetapi merupakan idiom untuk sungguh-sungguh memohon perkenanan atau belas kasihan seseorang. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan kesungguhan permohonan Musa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהָיו
  choice: Allahnya
  rationale: Bentuk posesif tunggal merujuk kepada Allah Musa dan mengungkapkan hubungan itu secara ringkas serta alami.
- source_word: יֶחֱרֶה אַפְּךָ
  choice: murka-Mu harus menyala
  rationale: Ungkapan ini mempertahankan citra panas dalam idiom Ibrani tentang amarah, tanpa menerjemahkan unsur ‘hidung’ secara kaku.
- source_word: בְּעַמֶּךָ
  choice: terhadap umat-Mu
  rationale: Dalam konstruksi dengan murka, preposisi ini menyatakan sasaran kemarahan. ‘Umat-Mu’ mempertahankan seruan Musa kepada hubungan perjanjian Yahweh dengan Israel.
- source_word: אֲשֶׁר הוֹצֵאתָ מֵאֶרֶץ מִצְרַיִם
  choice: yang telah Engkau bawa keluar dari tanah Mesir
  rationale: Menerjemahkan tindakan pembebasan secara langsung dan mempertahankan frasa geografis lengkap dari bahasa sumber.
- source_word: בְּכֹחַ גָּדוֹל
  choice: dengan kuasa yang besar
  rationale: Menunjukkan sarana pembebasan dan mempertahankan penekanan pada kuasa ilahi.
- source_word: וּבְיָד חֲזָקָה
  choice: dan tangan yang kuat
  rationale: Terjemahan transparan dari ungkapan eksodus yang mempertahankan metafora antropomorfis bahasa Ibrani.
theological_decisions:
- issue: Bahasa antropomorfis mengenai murka ilahi
  choice: murka-Mu harus menyala
  alternative: Mengapa Engkau harus murka
  rationale: Citra nyala dipertahankan agar daya retoris dan ketegangan teologis teks tidak diratakan, sementara unsur tubuh dalam idiom Ibrani tidak diterjemahkan secara mentah.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Mempertahankan nama pribadi dalam teks sumber dan membedakannya dari sebuah gelar.
- issue: Makna permohonan Musa di hadapan Allah
  choice: memohon belas kasihan Yahweh
  alternative: melunakkan hati Yahweh
  rationale: Pilihan ini menyampaikan permohonan sungguh-sungguh tanpa menambahkan gagasan bahwa Musa memanipulasi atau mengubah Allah; perkembangan narasi selanjutnya juga tidak disisipkan ke dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Pronomina yang merujuk kepada Allah ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab Indonesia. Metafora ‘murka menyala’ dan ‘tangan yang kuat’ dipertahankan, sedangkan idiom ‘mencari wajah’ dijelaskan melalui catatan kaki.
