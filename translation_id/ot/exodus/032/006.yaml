    text: Atau “bermain” atau “merayakan.” Kata Ibrani yang dipakai dapat berarti bermain, merayakan, atau berpesta; dalam konteks ini tampaknya menunjuk pada pesta yang tak terkendali, bukan hiburan yang lugu.
    reason: lexical_alternative
