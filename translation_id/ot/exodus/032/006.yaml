  text: וַ/יַּשְׁכִּ֨ימוּ֙ מִֽ/מָּחֳרָ֔ת וַ/יַּעֲל֣וּ עֹלֹ֔ת וַ/יַּגִּ֖שׁוּ שְׁלָמִ֑ים וַ/יֵּ֤שֶׁב הָ/עָם֙ לֶֽ/אֱכֹ֣ל וְ/שָׁת֔וֹ וַ/יָּקֻ֖מוּ לְ/צַחֵֽק׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/006.yaml
  text: And they rose early the next day and offered burnt offerings and brought peace offerings. Then the people sat down to eat and drink[a], and rose up to revel.
translation:
  language: id
  text: Keesokan harinya mereka bangun pagi-pagi, lalu mempersembahkan kurban bakaran dan membawa kurban keselamatan. Kemudian orang-orang itu duduk untuk makan dan minum, lalu bangkit untuk berpesta pora[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bermain” atau “merayakan.” Kata Ibrani yang dipakai dapat berarti bermain, merayakan, atau berpesta; dalam konteks ini tampaknya menunjuk pada pesta yang tak terkendali, bukan hiburan yang lugu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ מִמָּחֳרָת
  choice: Keesokan harinya mereka bangun pagi-pagi
  rationale: Bentuk Hifil dari שׁכם menekankan tindakan bangun atau memulai pada pagi-pagi sekali, sedangkan מִמָּחֳרָת menunjuk pada hari berikutnya. Susunan ini alami dalam bahasa Indonesia dan mempertahankan kedua unsur waktu.
- source_word: וַיַּעֲלוּ עֹלֹת
  choice: mempersembahkan kurban bakaran
  rationale: Dalam konteks ibadah, עלה bersama עֹלָה berarti mempersembahkan kurban yang dibakar seluruhnya. 'Kurban bakaran' merupakan istilah yang jelas dan mapan.
- source_word: וַיַּגִּשׁוּ שְׁלָמִים
  choice: membawa kurban persekutuan
  rationale: נגשׁ berarti membawa atau menyajikan, sedangkan שְׁלָמִים menunjuk jenis kurban yang berkaitan dengan kesejahteraan, damai, dan perjamuan bersama. 'Kurban persekutuan' menyampaikan dimensi perjamuan komunal tanpa mengubahnya menjadi pernyataan doktrinal.
- source_word: וַיֵּשֶׁב הָעָם לֶאֱכֹל וְשָׁתוֹ
  choice: bangsa itu duduk untuk makan dan minum
  rationale: Terjemahan langsung dan alami dari rangkaian tindakan dalam narasi; הָעָם dalam konteks ini menunjuk kepada bangsa Israel sebagai kelompok.
- source_word: וַיָּקֻמוּ לְצַחֵק
  choice: bangkit untuk bersenang-senang
  rationale: צחק dapat berarti bermain, bergembira, atau bersenang-senang dengan nuansa pesta yang tidak tertib. Pilihan ini mempertahankan keluasan makna tanpa secara tidak berdasar menetapkan adanya perilaku seksual.
theological_decisions:
- issue: Nuansa לְצַחֵק dalam peristiwa anak lembu emas
  choice: bersenang-senang
  alternative: bermain; berpesta pora
  rationale: Konteks penyembahan berhala dan penghukuman memberi tindakan ini nuansa negatif, tetapi verba itu sendiri tidak mewajibkan rincian tentang perilaku seksual. Teks utama memakai ungkapan yang cukup luas, sedangkan catatan kaki menjaga alternatif leksikal dan menjelaskan konteksnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Pagi-pagi' dipakai untuk mempertahankan penekanan waktu; 'kurban bakaran' dan 'kurban persekutuan' menjaga kategori ritual secara jelas. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang dijelaskan.
