revisions:
- from: Keesokan harinya mereka bangun pagi-pagi, lalu mempersembahkan kurban bakaran dan membawa kurban persekutuan. Kemudian bangsa itu duduk untuk makan dan minum, lalu bangkit untuk bersenang-senang[a].
  to: Keesokan harinya mereka bangun pagi-pagi, lalu mempersembahkan kurban bakaran dan membawa kurban keselamatan. Kemudian orang-orang itu duduk untuk makan dan minum, lalu bangkit untuk berpesta pora[a].
  rationale: Revisi mengganti istilah kurban agar lebih dekat pada kategori ritual Ibrani, serta menguatkan secara terukur nuansa kontekstual לְצַחֵק. Catatan kaki mempertahankan alternatif leksikal dan ketidakpastian yang sah tanpa menambahkan rincian perilaku yang tidak dinyatakan teks.
