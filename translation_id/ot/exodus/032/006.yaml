review_pass:
  verdict: revise
  source_fidelity: Terjemahan secara umum mengikuti urutan dan isi teks Ibrani dengan baik. Namun, “kurban persekutuan” tidak secara langsung mencerminkan שְׁלָמִים, yang merupakan kategori kurban terkait damai/kesejahteraan; istilah mapan “kurban keselamatan” lebih dekat pada kategori sumber. Untuk לְצַחֵק, “bersenang-senang” terlalu netral dibanding konteks naratif dan nuansa pesta liar yang mungkin dimaksud, sedangkan “berpesta pora” menyampaikan nuansa tersebut tanpa memaksakan rincian seksual.
  naturalness: “Keesokan harinya mereka bangun pagi-pagi” dan rangkaian tindakan berikutnya alami dalam bahasa Indonesia modern. “Bangsa itu” dapat dipahami, tetapi “orang-orang itu” lebih langsung untuk הָעָם dalam adegan ini dan menghindari kesan kategori politik modern. “Berpesta pora” adalah ungkapan baku dan alami untuk perayaan yang berlebihan.
  terminology: “Kurban bakaran” tepat untuk עֹלוֹת. “Kurban keselamatan” merupakan istilah kategori ritual yang lebih sesuai untuk שְׁלָמִים daripada “kurban persekutuan.” Catatan kaki perlu menyebut alternatif “bermain” dan kemungkinan makna perayaan, sambil tidak menyatakan secara pasti perilaku yang tidak dieksplisitkan ayat.
  issues:
  - severity: medium
    issue: “Kurban persekutuan” untuk שְׁלָמִים
    rationale: Istilah ini terutama mencerminkan padanan Inggris “fellowship offerings” dan dapat mempersempit atau menggeser kategori ritual sumber. “Kurban keselamatan” adalah padanan Alkitab Indonesia yang mapan dan mempertahankan kaitan istilah itu dengan damai/kesejahteraan.
  - severity: medium
    issue: “Bersenang-senang” untuk לְצַחֵק terlalu netral
    rationale: Verba ini memiliki rentang makna, tetapi dalam konteks anak lembu emas, jamuan kurban, dan respons naratif berikutnya, terjemahan utama patut memberi ruang bagi nuansa pesta yang tidak tertib. “Berpesta pora” melakukan itu tanpa menambahkan tuduhan perilaku seksual.
  - severity: low
    issue: Catatan kaki memakai “kemeriahan yang tidak tertib”
    rationale: Frasa ini kurang idiomatis. “Pesta yang tak terkendali” lebih alami, sambil tetap menyatakannya sebagai pembacaan berdasarkan konteks, bukan arti tunggal yang pasti.
  revised_text: Keesokan harinya mereka bangun pagi-pagi, lalu mempersembahkan kurban bakaran dan membawa kurban keselamatan. Kemudian orang-orang itu duduk untuk makan dan minum, lalu bangkit untuk berpesta pora[a].
  revised_footnotes:
