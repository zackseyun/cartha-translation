base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/007.yaml
  text: Then Yahweh said to Moses[a], “Go down, because your people, whom you brought up from the land of Egypt, have corrupted themselves.”
translation:
  language: id
  text: Kemudian Yahweh berfirman kepada Musa, “Turunlah, sebab bangsamu, yang kaubawa keluar dari tanah Mesir, telah merusak diri mereka sendiri.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah berlaku bejat.” Kata kerja Ibrani ini dapat menekankan perilaku bejat, bukan kerusakan yang mereka lakukan terhadap diri mereka sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kemudian ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “kemudian” alami dalam narasi Indonesia, sedangkan “berfirman” merupakan ungkapan baku dan bermartabat untuk perkataan Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: לֶךְ רֵד
  choice: Turunlah
  rationale: Dua imperatif Ibrani secara harfiah berarti “pergilah, turunlah,” tetapi לֶךְ di sini mendampingi perintah gerak utama dan dalam bahasa Indonesia paling alami diungkapkan dengan satu perintah tegas, “Turunlah.”
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi perintah sebelumnya; “sebab” jelas dan sesuai dengan ragam naratif yang bermartabat.
- source_word: שִׁחֵת
  choice: telah merusak diri
  rationale: Bentuk piel menyatakan tindakan merusak atau bertindak bejat; dalam konteks ini, frasa tersebut menyampaikan bahwa bangsa itu sendiri menjadi pelaku kerusakan moral tanpa menentukan secara berlebihan apakah tekanannya pada tindakan atau akibat.
- source_word: עַמְּךָ
  choice: bangsamu
  rationale: Kata עַם menunjuk pada umat atau bangsa sebagai kelompok. “Bangsamu” alami dalam bahasa Indonesia dan mempertahankan tekanan retoris pada bentuk milik orang kedua.
- source_word: אֲשֶׁר הֶעֱלֵיתָ
  choice: yang kaubawa keluar
  rationale: Dalam konteks keluaran dari Mesir, העלה secara harfiah “membawa naik”; “membawa keluar” menyampaikan gerakan eksodus secara alami dalam bahasa Indonesia.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: dari tanah Mesir
  rationale: Pilihan ini mempertahankan unsur אֶרֶץ dan tetap alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri; “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Daya makna שִׁחֵת
  choice: telah merusak diri
  alternative: telah berlaku bejat; telah menjadi rusak
  rationale: Pilihan utama mempertahankan gagasan bahwa bangsa itu bertanggung jawab atas kerusakan moralnya. Catatan kaki menjaga kemungkinan bahwa tekanan verba terletak pada perilaku bejat, bukan semata-mata keadaan rusak yang dihasilkan.
- issue: Sebutan “bangsamu” kepada Musa
  choice: bangsamu
  alternative: umatmu
  rationale: Bentuk orang kedua dalam teks dipertahankan karena memiliki tekanan retoris dalam konteks pelanggaran Israel, tanpa menjelaskan implikasi teologisnya lebih jauh.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dibuat alami bagi pembaca umum sambil mempertahankan nama ilahi, tekanan retoris “bangsamu,” serta ambiguitas leksikal pada שִׁחֵת.
