  text: וַ/יִּקַּ֞ח אֶת הָ/עֵ֨גֶל אֲשֶׁ֤ר עָשׂוּ֙ וַ/יִּשְׂרֹ֣ף בָּ/אֵ֔שׁ וַ/יִּטְחַ֖ן עַ֣ד אֲשֶׁר דָּ֑ק וַ/יִּ֨זֶר֙ עַל פְּנֵ֣י הַ/מַּ֔יִם וַ/יַּ֖שְׁקְ אֶת בְּנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/020.yaml
  text: He took the calf that they had made[a], burned it with fire, ground it until it was fine, scattered it on the surface of the water, and made the sons of Israel drink it.
translation:
  language: id
  text: Ia mengambil anak lembu yang telah mereka buat itu, membakarnya dengan api, menggilingnya sampai halus, menaburkannya di atas permukaan air, lalu menyuruh umat Israel meminumnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֵגֶל
  choice: anak lembu
  rationale: עֵגֶל menunjuk pada anak sapi atau lembu muda; “anak lembu” merupakan padanan yang alami dan sesuai dengan sebutan patung dalam konteks ini.
- source_word: אֲשֶׁר עָשׂוּ
  choice: yang telah mereka buat itu
  rationale: Klausa relatif ini mengidentifikasi anak lembu tersebut sebagai benda yang sebelumnya dibuat oleh mereka; “telah” memperjelas urutan tindakan dalam narasi.
- source_word: וַיִּשְׂרֹף בָּאֵשׁ
  choice: membakarnya dengan api
  rationale: Padanan ini mengikuti ungkapan Ibrani secara dekat dan tetap wajar dalam bahasa Indonesia.
- source_word: וַיִּטְחַן עַד אֲשֶׁר דָּק
  choice: menggilingnya sampai halus
  rationale: טחן berarti menggiling, sedangkan דק menyatakan keadaan yang halus atau sangat kecil; terjemahan ini tidak menambahkan secara eksplisit kata “serbuk” yang tidak terdapat dalam teks.
- source_word: וַיִּזֶר
  choice: menaburkannya
  rationale: Dalam konteks sisa benda yang telah digiling halus, “menaburkan” menyampaikan tindakan menyebarkannya di atas air secara alami.
- source_word: עַל פְּנֵי הַמַּיִם
  choice: ke permukaan air
  rationale: פְּנֵי secara harfiah menggambarkan muka atau permukaan; arah “ke” sesuai secara idiomatis dengan verba “menaburkan” dalam bahasa Indonesia.
- source_word: וַיַּשְׁקְ אֶת בְּנֵי יִשְׂרָאֵל
  choice: lalu menyuruh umat Israel meminumnya
  rationale: Bentuk kausatif שׁקה berarti membuat atau menyuruh minum. “Umat Israel” secara alami menyatakan בְּנֵי יִשְׂרָאֵל sebagai sebutan kolektif bagi bangsa itu, sedangkan objek “-nya” merujuk pada air yang telah ditaburi bahan gilingan.
theological_decisions:
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  alternative: anak-anak Israel
  rationale: Ungkapan Ibrani ini merupakan sebutan kolektif baku bagi bangsa Israel, bukan hanya keturunan yang masih anak-anak atau hanya laki-laki. “Umat Israel” mempertahankan cakupan komunalnya dalam bahasa Indonesia tanpa memasukkan kekhususan denominasi.
- issue: Daya kausatif וַיַּשְׁקְ
  choice: menyuruh ... meminumnya
  alternative: memberi ... minum
  rationale: Terjemahan “menyuruh” mempertahankan unsur kausatif dan kemungkinan adanya paksaan dalam konteks, tanpa menjelaskan motif atau makna teologis tindakan itu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Rangkaian verba dipertahankan untuk mengikuti gerak cepat narasi Ibrani. Kata ganti “Ia” merujuk kepada Musa dari konteks sebelumnya; “meminumnya” dipakai secara alami untuk air yang telah ditaburi hasil gilingan.
