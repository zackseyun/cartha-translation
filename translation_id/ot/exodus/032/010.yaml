  yaml_path: translation/ot/exodus/032/010.yaml
  text: Now leave me alone[a], so that my anger may burn against them and I may consume them[b]; and I will make you into a great nation.
translation:
  language: id
  text: Sekarang, biarkanlah Aku sendiri[a], supaya murka-Ku menyala terhadap mereka dan Aku membinasakan mereka[b]; dan Aku akan menjadikan engkau bangsa yang besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “biarkanlah Aku”.
    reason: lexical_alternative
  - marker: b
    text: Atau “Aku memusnahkan mereka”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Penanda wacana ini mengalihkan perkataan kepada perintah yang segera; “Sekarang” alami dan langsung dalam bahasa Indonesia.
- source_word: הַנִּיחָה לִּי
  choice: biarkanlah Aku sendiri
  rationale: Bentuk imperatif dalam ungkapan ini meminta agar Musa tidak menahan atau menghalangi tindakan TUHAN. Pilihan ini mempertahankan daya perintah tanpa menjelaskan maksud retorisnya.
- source_word: וְיִחַר אַפִּי
  choice: supaya murka-Ku menyala
  rationale: Ungkapan Ibrani menggambarkan kemarahan sebagai sesuatu yang menjadi panas atau menyala. “Murka-Ku menyala” mempertahankan metafora dan cocok dengan tingkat tutur ilahi yang bermartabat; waw sesudah imperatif dipahami menyatakan tujuan atau hasil.
- source_word: בָהֶם
  choice: terhadap mereka
  rationale: Preposisi menandai arah atau sasaran murka dan secara alami diterjemahkan “terhadap mereka”.
- source_word: וַאֲכַלֵּם
  choice: Aku menghabisi mereka
  rationale: Bentuk Piel dari כלה berarti menyelesaikan sampai tuntas, menghabisi, atau memusnahkan. “Menghabisi” mempertahankan nuansa tindakan yang menuntaskan tanpa memakai ungkapan Indonesia “menghanguskan” yang dapat mencampurkan metafora api dari klausa sebelumnya.
- source_word: וְאֶעֱשֶׂה אוֹתְךָ
  choice: Lalu, Aku akan menjadikan engkau
  rationale: Konstruksi עשה dengan objek dan ל menyatakan menjadikan seseorang sebagai sesuatu. “Engkau” menjaga gaya yang bermartabat, sedangkan “Lalu” menyampaikan kelanjutan akibat tanpa menjadikannya bagian dari klausa tujuan sebelumnya.
- source_word: לְגוֹי גָּדוֹל
  choice: suatu bangsa yang besar
  rationale: גוי secara langsung menunjuk bangsa atau kelompok masyarakat. Terjemahan ini mempertahankan gema janji leluhur tanpa menambahkan penjelasan teologis.
theological_decisions:
- issue: Bahasa antropopatik tentang murka Allah
  choice: Mempertahankan metafora “murka-Ku menyala”.
  alternative: Mengabstrakkannya menjadi “Aku akan marah kepada mereka”.
  rationale: Teks Ibrani memakai gambaran yang hidup tentang murka yang menjadi panas. Metafora ini perlu dipertahankan agar daya naratif serta ketegangan antara kekudusan dan penghukuman ilahi tidak diperlemah.
- issue: Daya imperatif dalam הַנִּיחָה לִּי dan kaitannya dengan syafaat Musa
  choice: 'Menerjemahkannya sebagai perintah nyata: “biarkanlah Aku sendiri”.'
  alternative: Menafsirkannya dalam teks utama sebagai undangan tersirat agar Musa menjadi perantara.
  rationale: Ayat ini sendiri menyampaikan perintah langsung. Apakah perintah itu secara retoris mengundang syafaat merupakan perkara penafsiran dan tidak dimasukkan ke dalam terjemahan.
- issue: Hubungan sintaksis וְיִחַר dengan imperatif sebelumnya
  choice: Memakai “supaya” untuk menyatakan tujuan atau hasil.
  alternative: Memakai urutan sederhana, “dan murka-Ku akan menyala”.
  rationale: Dalam konteks ini, waw sesudah imperatif wajar dipahami sebagai tujuan atau hasil. Pilihan “supaya” menyampaikan hubungan itu sambil tetap membiarkan nuansa tujuan dan hasil berdekatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Kapitalisasi pronomina ilahi mengikuti konvensi penerbitan Alkitab bahasa Indonesia. “Engkau” dipilih untuk sapaan tunggal kepada Musa; tanda koma setelah “Lalu” membantu ritme tanpa mengubah hubungan makna.
