source:
  edition: WLC
  text: סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר צִוִּיתִ֔/ם עָשׂ֣וּ לָ/הֶ֔ם עֵ֖גֶל מַסֵּכָ֑ה וַ/יִּשְׁתַּֽחֲווּ ל/וֹ֙ וַ/יִּזְבְּחוּ ל֔/וֹ וַ/יֹּ֣אמְר֔וּ אֵ֤לֶּה אֱלֹהֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הֶֽעֱל֖וּ/ךָ מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/008.yaml
  text: They have quickly turned aside from the way that I commanded them. They have made for themselves a cast image of a calf[a], and have bowed down to it and sacrificed to it, and said, ‘These are your gods, Israel, who brought you up from the land of Egypt.’
translation:
  language: id
  text: Mereka segera menyimpang dari jalan yang telah Kuperintahkan kepada mereka. Mereka membuat bagi diri mereka sendiri patung anak lembu dari logam tuangan, lalu bersujud kepadanya dan mempersembahkan kurban kepadanya. Mereka berkata, “Inilah allah-allahmu[a], hai Israel, yang telah membawa engkau keluar dari negeri Mesir.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Inilah allahmu, hai Israel.” Secara harfiah, teks Ibrani berbunyi “Inilah allah-allahmu,” meskipun acuannya dalam konteks adalah satu patung anak lembu.
    reason: alternative_reading
lexical_decisions:
- source_word: סָרוּ מַהֵר
  choice: segera menyimpang
  rationale: Ungkapan ini mempertahankan gambaran menyimpang dari suatu jalan sekaligus menyampaikan cepatnya kemurtadan mereka dalam bahasa Indonesia yang wajar.
- source_word: מִן הַדֶּרֶךְ אֲשֶׁר צִוִּיתִם
  choice: dari jalan yang telah Kuperintahkan kepada mereka
  rationale: “Jalan” mempertahankan metafora Ibrani tentang pola hidup dalam ketaatan; bentuk persona pertama pada verba dipertahankan melalui “Kuperintahkan”.
- source_word: עָשׂוּ לָהֶם
  choice: membuat bagi diri mereka sendiri
  rationale: 'Frasa ini mempertahankan nuansa refleksif לָהֶם: berhala itu mereka adakan untuk kepentingan mereka sendiri.'
- source_word: עֵגֶל מַסֵּכָה
  choice: patung anak lembu dari logam tuangan
  rationale: מַסֵּכָה menunjuk pada benda yang dibentuk dengan menuang logam; “patung anak lembu” menjelaskan bahwa yang dimaksud ialah citra berbentuk anak lembu, bukan anak lembu hidup.
- source_word: וַיִּשְׁתַּחֲווּ לוֹ
  choice: bersujud kepadanya
  rationale: Pilihan ini mempertahankan tindakan jasmani berupa sujud, tanpa langsung menggeneralisasikannya menjadi “menyembah”.
- source_word: וַיִּזְבְּחוּ לוֹ
  choice: mempersembahkan kurban kepadanya
  rationale: Terjemahan ini menyatakan tindakan kultis berkurban secara jelas dan alami dalam bahasa Indonesia.
- source_word: אֵלֶּה אֱלֹהֶיךָ
  choice: Inilah allah-allahmu
  rationale: Bentuk Ibrani secara gramatikal jamak, baik pada kata penunjuk maupun nomina. Bentuk jamak dipertahankan dalam teks utama meskipun acuannya dalam konteks adalah satu patung anak lembu.
- source_word: הֶעֱלוּךָ מֵאֶרֶץ מִצְרָיִם
  choice: telah membawa engkau keluar dari negeri Mesir
  rationale: Dalam konteks eksodus, “membawa keluar” menyampaikan gerak pembebasan yang dimaksud secara alami dalam bahasa Indonesia; “negeri Mesir” merupakan padanan idiomatis bagi אֶרֶץ מִצְרַיִם.
theological_decisions:
- issue: Jumlah gramatikal pada אֵלֶּה אֱלֹהֶיךָ dalam seruan kepada berhala
  choice: 'Mempertahankan bentuk jamak: “Inilah allah-allahmu, hai Israel”'
  alternative: “Inilah allahmu, hai Israel”
  rationale: Teks Ibrani secara eksplisit memakai bentuk jamak, sementara konteks menyebut satu patung anak lembu. Ketegangan ini dipertahankan dalam teks utama dan kemungkinan pembacaan tunggal dicatat dalam catatan kaki.
- issue: Makna tindakan וַיִּשְׁתַּחֲווּ
  choice: “bersujud kepadanya”
  alternative: “menyembahnya”
  rationale: Terjemahan yang lebih konkret mempertahankan urutan tindakan dalam teks—bersujud, mempersembahkan kurban, lalu mengucapkan seruan—tanpa melebur semuanya menjadi satu istilah teologis umum.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. “Hai Israel” mempertahankan sapaan langsung tanpa menjadi terlalu arkais; “kurban” mengikuti ejaan baku modern. Huruf kecil pada “allah-allahmu” menandai sebutan bagi ilah palsu dalam konteks ini, tanpa mengubah bentuk gramatikal Ibrani.
