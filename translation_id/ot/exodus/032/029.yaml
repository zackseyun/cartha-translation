  terminology: “TUHAN,” “tahbiskan,” dan “berkat” sesuai untuk konteks. Catatan kaki dipertahankan, dengan penyesuaian kecil agar menjelaskan idiom tanpa terlalu membatasi maknanya pada pelayanan tertentu.
