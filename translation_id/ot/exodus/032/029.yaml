base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/029.yaml
  text: And Moses said, “Today ordain yourselves to the LORD, for each man has been against his son and against his brother, so that he may bestow a blessing on you today.”
translation:
  language: id
  text: Musa berkata, “Hari ini tahbiskanlah diri kalian bagi TUHAN[a], sebab masing-masing telah bertindak melawan anaknya dan saudaranya, agar hari ini berkat diberikan kepada kalian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “penuhilah tangan kalian bagi TUHAN,” sebuah ungkapan Ibrani untuk penahbisan atau pengkhususan bagi TUHAN.'
    reason: Menjelaskan idiom Ibrani dan bentuk jamaknya, tanpa membatasi ungkapan itu secara khusus pada pelantikan bagi pelayanan.
lexical_decisions:
- source_word: מִלְאוּ יֶדְכֶם
  choice: tahbiskanlah dirimu
  rationale: Secara harfiah berarti ‘penuhilah tanganmu’, tetapi merupakan ungkapan Ibrani untuk pelantikan atau penahbisan bagi pelayanan. Bentuk refleksif Indonesia menyampaikan seruan agar mereka menyerahkan diri untuk ditahbiskan.
- source_word: לַיהוָה
  choice: bagi TUHAN
  rationale: Preposisi ל menyatakan pengabdian atau peruntukan kepada YHWH; ‘bagi’ sesuai dengan konteks penahbisan.
- source_word: כִּי אִישׁ בִּבְנוֹ וּבְאָחִיו
  choice: sebab masing-masing telah bertindak melawan anaknya dan saudaranya
  rationale: Klausa Ibrani tidak memiliki verba tersurat. ‘Telah bertindak melawan’ melengkapi bahasa Indonesia secara wajar sambil mempertahankan kerasnya kesetiaan kepada TUHAN di atas hubungan keluarga.
- source_word: בְּרָכָה
  choice: berkat
  rationale: Padanan Indonesia yang langsung dan lazim untuk berkat ilahi.
theological_decisions:
- issue: Subjek tersirat dalam וְלָתֵת (‘dan untuk memberi’)
  choice: Dia mengaruniakan
  alternative: dikaruniakan / TUHAN mengaruniakan
  rationale: Teks Ibrani tidak menyebut ulang subjek. ‘Dia’ menjaga rujukan alami kepada TUHAN tanpa menambahkan nama ilahi ke dalam klausa, meskipun ambiguitas gramatikal tetap diakui.
- issue: Makna tindakan terhadap anak dan saudara
  choice: bertindak melawan
  alternative: dengan mengorbankan / bahkan terhadap
  rationale: Preposisi ב dapat dipahami secara lebih luas, tetapi konteks langsung mendukung tindakan yang berlawanan dengan anggota keluarga. Rumusan ini tidak memperinci tindakan melebihi teks ayat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. ‘Tahbiskanlah’ dipertahankan sebagai istilah yang cukup dikenal dalam konteks keagamaan, dengan arti harfiahnya dijelaskan dalam catatan kaki. Kapitalisasi ‘Dia’ menandai rujukan kepada TUHAN tanpa menghapus sepenuhnya sifat tersirat subjek dalam bahasa sumber.
