  verdict: revise
  source_fidelity: 'Terjemahan pada dasarnya mengikuti Ibrani dengan baik: urutan laporan Harun, emas sebagai objek tersirat, tindakan melempar ke dalam api, dan kemunculan anak lembu dipertahankan tanpa komentar tambahan. Namun, objek tersirat dari הִתְפָּרָקוּ lebih jelas dan lebih alami bila dinyatakan sebagai perhiasan emas yang harus dilepaskan; hal ini juga cocok dengan konteks langsung (Kel. 32:2–3) tanpa mengubah makna.'
  naturalness: Frasa “tanggalkanlah itu” dapat dipahami, tetapi terdengar kurang idiomatis dalam bahasa Indonesia baku karena “itu” tidak menyebut benda yang ditanggalkan. “Tanggalkanlah perhiasan emas itu” lebih jelas, alami, dan tetap ringkas. “Keluarlah anak lembu ini” efektif mempertahankan susunan retoris yang ganjil dari ucapan Harun.
  terminology: “Anak lembu” merupakan padanan yang tepat untuk הָעֵגֶל. “Perhiasan emas” secara kontekstual tepat bagi benda yang ditanggalkan, tanpa menambahkan klaim mengenai bentuk atau proses pembuatan patung. Catatan kaki perlu menyesuaikan bentuk perintah jamak dalam Ibrani dan menyebut objek yang secara idiomatis tersirat.
  issues:
