base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/024.yaml
  text: And I said to them[a], ‘Whoever has gold, take it off.’ So they gave it to me, and I threw it into the fire, and this calf came out.
translation:
  language: id
  text: Lalu aku berkata kepada mereka[a], ‘Siapa pun yang mempunyai emas, tanggalkanlah perhiasan emas itu.’ Mereka memberikannya kepadaku, lalu aku melemparkannya ke dalam api, dan keluarlah anak lembu ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Siapa yang mempunyai emas? Tanggalkanlah perhiasan emas itu.” Secara harfiah, teks Ibrani berbunyi, “Pada siapa ada emas? Lepaskanlah itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Lalu aku berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi dan memperkenalkan laporan perkataan Harun; ‘lalu’ wajar dalam bahasa Indonesia tanpa menambahkan hubungan sebab-akibat.
- source_word: לְמִי זָהָב
  choice: Siapa pun yang mempunyai emas
  rationale: Ungkapan harfiah ‘kepada siapa ada emas’ menyatakan kepemilikan; bentuk tak tentu ‘siapa pun’ cocok dengan perintah berikutnya.
- source_word: הִתְפָּרָקוּ
  choice: tanggalkanlah itu
  rationale: Bentuk hitpael dari פרק dalam konteks ini berarti melepaskan perhiasan dari diri sendiri. ‘Itu’ merujuk kepada emas yang dikenakan dan tidak menentukan jenis perhiasannya.
- source_word: וַיִּתְּנוּ לִי
  choice: Mereka memberikannya kepadaku
  rationale: Akhiran objek tidak dinyatakan pada verba Ibrani, tetapi objek emas tersirat dari klausa sebelumnya; ‘-nya’ mengungkapkannya secara alami dalam bahasa Indonesia.
- source_word: וָאַשְׁלִכֵהוּ בָאֵשׁ
  choice: lalu aku melemparkannya ke dalam api
  rationale: שלך berarti melemparkan; akhiran tunggal merujuk secara kolektif kepada emas. ‘Ke dalam’ menyatakan gerak menuju api secara idiomatis.
- source_word: וַיֵּצֵא הָעֵגֶל הַזֶּה
  choice: dan keluarlah anak lembu ini
  rationale: Susunan dengan ‘keluarlah’ mempertahankan penonjolan tindakan keluar dan nada ganjil dalam pembelaan Harun, tanpa menambahkan penafsiran.
theological_decisions:
- issue: Keterangan Harun yang mengelak tentang asal-usul berhala
  choice: 'Menyajikan ucapannya secara langsung: ‘dan keluarlah anak lembu ini.’'
  alternative: Menambahkan kata seperti ‘dengan sendirinya’, ‘katanya’, atau penanda bahwa pernyataan itu menipu.
  rationale: Teks hanya melaporkan perkataan Harun. Ironi dan sifat mengelaknya dibiarkan tampak dari konteks, tanpa komentar teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Tanggalkanlah’ cukup jelas untuk perhiasan yang dikenakan, sedangkan susunan ‘keluarlah anak lembu ini’ mempertahankan daya retoris dan kejanggalan pembelaan Harun.
