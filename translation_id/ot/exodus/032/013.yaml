  variant: modern standard Indonesian
source:
  edition: WLC
  text: זְכֹ֡ר לְ/אַבְרָהָם֩ לְ/יִצְחָ֨ק וּ/לְ/יִשְׂרָאֵ֜ל עֲבָדֶ֗י/ךָ אֲשֶׁ֨ר נִשְׁבַּ֣עְתָּ לָ/הֶם֮ בָּ/ךְ֒ וַ/תְּדַבֵּ֣ר אֲלֵ/הֶ֔ם אַרְבֶּה֙ אֶֽת זַרְעֲ/כֶ֔ם כְּ/כוֹכְבֵ֖י הַ/שָּׁמָ֑יִם וְ/כָל הָ/אָ֨רֶץ הַ/זֹּ֜את אֲשֶׁ֣ר אָמַ֗רְתִּי אֶתֵּן֙ לְ/זַרְעֲ/כֶ֔ם וְ/נָחֲל֖וּ לְ/עֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/013.yaml
  text: Remember Abraham[a], Isaac, and Israel, your servants, to whom you swore by yourself and said to them, ‘I will multiply your offspring like the stars of the heavens, and all this land that I have spoken of I will give to your offspring, and they shall inherit it forever.’
translation:
  language: id
  text: Ingatlah Abraham, Ishak, dan Israel[a], hamba-hamba-Mu, yang kepada mereka Engkau telah bersumpah demi diri-Mu sendiri dan berkata, ‘Aku akan memperbanyak keturunanmu seperti bintang-bintang di langit, dan seluruh negeri ini, sebagaimana telah Kukatakan, akan Kuberikan kepada keturunanmu, dan mereka akan mewarisinya untuk selama-lamanya.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yakub”—leluhur yang kemudian diberi nama Israel. Teks Ibrani di sini berbunyi “Israel.”
    reason: Menjelaskan identitas sang leluhur sekaligus mempertahankan nama yang benar-benar terdapat dalam teks Ibrani.
lexical_decisions:
- source_word: זְכֹר
  choice: Ingatlah
  rationale: Bentuk imperatif maskulin tunggal ini ditujukan kepada Allah dalam permohonan Musa. “Ingatlah” alami dalam bahasa Indonesia dan tetap mempertahankan seruan perjanjian tanpa menambahkan tafsiran.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיִשְׂרָאֵל
  choice: Abraham, Ishak, dan Israel
  rationale: Nama-nama ditransliterasikan dalam bentuk Indonesia yang lazim. Teks Ibrani secara eksplisit memakai “Israel,” bukan “Yakub,” sehingga nama perjanjian sang leluhur dipertahankan.
- source_word: עֲבָדֶיךָ
  choice: hamba-hamba-Mu
  rationale: Dalam konteks ini עבד menyatakan kedudukan para leluhur sebagai hamba Allah, bukan terutama kondisi sosial sebagai budak.
- source_word: אֲשֶׁר נִשְׁבַּעְתָּ לָהֶם בָּךְ
  choice: yang kepada mereka Engkau telah bersumpah demi diri-Mu sendiri
  rationale: Ungkapan בָּךְ menunjukkan bahwa Allah bersumpah dengan diri-Nya sendiri sebagai jaminan sumpah. Susunan ini mempertahankan baik penerima maupun dasar sumpah.
- source_word: וַתְּדַבֵּר אֲלֵהֶם
  choice: dan berkata
  rationale: דבר berarti berbicara; sebelum kutipan langsung, “berkata” merupakan padanan Indonesia yang alami tanpa mempersempit maknanya.
- source_word: אַרְבֶּה אֶת זַרְעֲכֶם
  choice: Aku akan memperbanyak keturunanmu
  rationale: Bentuk Hifil dari רבה berarti membuat banyak atau memperbanyak. זרע bersifat kolektif, sehingga “keturunan” mempertahankan cakupan kolektifnya.
- source_word: כְּכוֹכְבֵי הַשָּׁמָיִם
  choice: seperti bintang-bintang di langit
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan menyampaikan perbandingan Ibrani secara langsung.
- source_word: וְכָל הָאָרֶץ הַזֹּאת
  choice: Seluruh negeri ini
  rationale: הָאָרֶץ menunjuk kepada negeri yang dijanjikan, sedangkan הַזֹּאת mempertahankan unsur penunjuk “ini.”
- source_word: אֲשֶׁר אָמַרְתִּי
  choice: yang telah Kusebutkan
  rationale: Secara harfiah berarti “yang telah Aku katakan.” “Yang telah Kusebutkan” merupakan ungkapan Indonesia yang wajar untuk tanah yang sebelumnya dibicarakan, tanpa meleburkannya dengan klausa pemberian berikutnya.
- source_word: אֶתֵּן לְזַרְעֲכֶם
  choice: akan Kuberikan kepada keturunanmu
  rationale: Bentuk imperfek menyatakan isi janji yang akan dilakukan. “Keturunan” dipakai secara konsisten untuk זרע.
- source_word: וְנָחֲלוּ לְעֹלָם
  choice: dan mereka akan mewarisinya untuk selama-lamanya
  rationale: נחל berarti menerima atau memiliki sebagai warisan. Pronomina “-nya” dijelaskan oleh konteks negeri, sedangkan לְעֹלָם diterjemahkan dengan ungkapan duratif yang wajar.
theological_decisions:
- issue: Nama “Israel” atau “Yakub” bagi sang leluhur
  choice: Israel dipertahankan dalam teks utama
  alternative: Yakub
  rationale: Teks Ibrani memakai יִשְׂרָאֵל secara eksplisit. Menggantinya dengan “Yakub” akan menafsirkan identitas tokoh dan menghilangkan gema nama perjanjiannya.
- issue: Rumus sumpah בָּךְ
  choice: demi diri-Mu sendiri
  alternative: dengan diri-Mu sendiri
  rationale: “Demi diri-Mu sendiri” menyampaikan bahwa Allah sendiri menjadi jaminan sumpah, tanpa menambahkan penjelasan doktrinal di luar teks.
- issue: Hubungan אֲשֶׁר אָמַרְתִּי dengan אֶתֵּן
  choice: Mempertahankan klausa “yang telah Kusebutkan” dan “akan Kuberikan” secara berurutan
  alternative: yang telah Kujanjikan akan Kuberikan
  rationale: Pilihan utama tidak memasukkan gagasan “menjanjikan” ke dalam אמר dan tidak melebur dua unsur Ibrani menjadi satu parafrasa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina yang merujuk kepada Allah menggunakan huruf kapital sesuai kebiasaan luas dalam penerbitan Alkitab Indonesia. Bentuk jamak “hamba-hamba” dibuat eksplisit, sedangkan “keturunan” dibiarkan kolektif seperti זרע. Penanda catatan kaki ditempatkan sesudah “Israel,” kata yang dijelaskan oleh catatan.
