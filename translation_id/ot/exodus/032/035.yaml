  naturalness: “Yahweh memukul bangsa itu” berterima dalam register Alkitab bahasa Indonesia yang baku dan modern. “Karena apa yang mereka lakukan dengan anak lembu itu” lebih langsung dan alami daripada “karena perbuatan mereka sehubungan dengan anak lembu,” sambil tidak memaksakan penyelesaian atas pengulangan tekstual antara tindakan orang banyak dan tindakan Harun.
  terminology: “Yahweh,” “bangsa itu,” “anak lembu,” dan “Harun” sudah tepat. “Anak lembu” mempertahankan arti עֵגֶל tanpa menambahkan “emas.” Catatan kaki sebaiknya menempatkan kemungkinan “tulah” sebagai alternatif leksikal, bukan sebagai makna yang diwajibkan dalam teks utama.
