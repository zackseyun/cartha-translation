  text: Then Yahweh struck the people with a plague because of what they did with the calf that Aaron made[a].
translation:
  language: id
  text: Kemudian Yahweh memukul bangsa itu karena apa yang mereka lakukan dengan anak lembu yang dibuat Harun[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kemudian Yahweh menimpakan tulah kepada bangsa itu karena apa yang mereka lakukan dengan anak lembu yang dibuat Harun.” Kata kerja Ibrani dapat berarti “memukul” secara umum dan, dalam konteks tertentu, dapat menunjuk pada serangan atau tulah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: menimpakan tulah kepada
  rationale: Kata kerja נָגַף menyatakan tindakan memukul atau menimpakan bencana sebagai penghukuman dan sering dipakai untuk tulah. Ungkapan ini alami dalam bahasa Indonesia serta tidak menyatakan bahwa semua orang tewas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: הָעָם
  choice: bangsa itu
  rationale: עַם menunjuk secara kolektif kepada bangsa Israel; “bangsa itu” jelas dan wajar dalam konteks ini.
- source_word: עַל אֲשֶׁר עָשׂוּ אֶת הָעֵגֶל
  choice: karena perbuatan mereka sehubungan dengan anak lembu
  rationale: Susunan Ibrani secara harfiah dapat terdengar seperti “karena mereka membuat anak lembu,” tetapi anak kalimat berikutnya menyebut Harun sebagai pembuatnya. Pilihan ini mempertahankan kesalahan kolektif bangsa itu tanpa menciptakan pengulangan yang janggal atau menghapus ketegangan sumber.
- source_word: הָעֵגֶל
  choice: anak lembu
  rationale: Kata ini berarti “anak lembu.” Keterangan “emas” tidak dimasukkan karena tidak terdapat dalam ayat ini.
- source_word: אֲשֶׁר עָשָׂה אַהֲרֹן
  choice: yang dibuat Harun
  rationale: Anak kalimat relatif ini secara langsung mengidentifikasi anak lembu tersebut sebagai buatan Harun.
theological_decisions:
- issue: Sifat penghukuman ilahi dalam וַיִּגֹּף
  choice: menimpakan tulah kepada bangsa itu
  alternative: memukul bangsa itu
  rationale: נָגַף dapat berarti memukul atau menulahi. Teks tidak menyebut sarana penghukuman secara terpisah, tetapi nuansa tulah berada dalam cakupan makna kata kerja itu. Catatan kaki mempertahankan terjemahan yang lebih umum.
- issue: Tanggung jawab bangsa itu dan peran Harun
  choice: perbuatan mereka sehubungan dengan anak lembu yang dibuat Harun
  alternative: mereka membuat anak lembu yang dibuat Harun
  rationale: Bentuk jamak עָשׂוּ menyatakan kesalahan bangsa itu, sedangkan bentuk tunggal עָשָׂה menyatakan bahwa Harun membuat anak lembu tersebut. Terjemahan utama tidak memaksakan harmonisasi tentang pembagian tanggung jawab mereka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Menimpakan tulah” mempertahankan nuansa penghukuman ilahi dengan ungkapan yang mudah dipahami, sedangkan “sehubungan dengan” menghindari pengulangan harfiah yang membingungkan tanpa meniadakan tanggung jawab kolektif bangsa itu.
