base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/033.yaml
  text: And Yahweh said to Moses[a], “Whoever has sinned against me[b], I will blot him out of my book.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa, “Siapa pun yang telah berdosa terhadap-Ku akan Kuhapus dari kitab-Ku.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “kitab-Ku” dapat merujuk pada catatan Allah mengenai orang-orang yang berada dalam pemeliharaan-Nya; sebagian orang memahaminya secara lebih khusus sebagai “kitab kehidupan”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Bentuk naratif ini melanjutkan rangkaian peristiwa. “Lalu” mengalir alami dalam bahasa Indonesia, sedangkan “berfirman” merupakan ungkapan Indonesia yang wajar dan bermartabat untuk perkataan Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar seperti “TUHAN”.
- source_word: אֶל מֹשֶׁה
  choice: kepada Musa
  rationale: Preposisi אֶל menyatakan arah perkataan, dan “Musa” adalah bentuk nama yang baku dalam bahasa Indonesia.
- source_word: מִי אֲשֶׁר
  choice: Siapa pun yang
  rationale: Konstruksi ini memperkenalkan klausa relatif tak tentu dan bersifat umum; “siapa pun yang” menyampaikan daya tersebut secara alami.
- source_word: חָטָא לִי
  choice: telah berdosa terhadap-Ku
  rationale: Bentuk perfektif menunjukkan pelanggaran yang telah dilakukan dalam konteks ini, dan לִי menandai bahwa dosa itu ditujukan terhadap Yahweh.
- source_word: אֶמְחֶנּוּ
  choice: orang itulah yang akan Kuhapus
  rationale: Kata kerja מחה menggambarkan tindakan menghapus, cocok dengan metafora catatan tertulis. “Orang itulah” mempertahankan acuan tunggal sufiks maskulin serta penegasan bahwa orang yang berdosa sendiri akan dihapus.
- source_word: מִסִּפְרִי
  choice: dari kitab-Ku
  rationale: Preposisi מן secara alami diterjemahkan “dari” bersama kata kerja “menghapus”. סֵפֶר dipertahankan sebagai “kitab”, yakni catatan ilahi yang referen tepatnya tidak dijelaskan oleh teks.
theological_decisions:
- issue: Hakikat “kitab-Ku”
  choice: Mempertahankan metafora “kitab-Ku” tanpa menentukan isinya secara lebih khusus.
  alternative: “kitab kehidupan”, “daftar orang hidup”, atau “daftar umat perjanjian”
  rationale: Teks Ibrani hanya menyebut “kitab-Ku”. Terjemahan tidak menentukan apakah kitab itu merupakan daftar orang hidup, orang yang berada dalam pemeliharaan Allah, anggota umat perjanjian, atau kategori keselamatan kekal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “Kuhapus” dan “kitab-Ku” mengikuti kaidah penulisan pronomina yang merujuk kepada Allah. Susunan kalimat mempertahankan penekanan pada pelaku dosa tanpa memperjelas secara berlebihan arti metafora kitab.
