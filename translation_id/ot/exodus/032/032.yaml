  yaml_path: translation/ot/exodus/032/032.yaml
  text: But now[a], if you will forgive their sin—but if not[b], please blot me out of your book that you have written.
translation:
  language: id
  text: Namun sekarang, jika Engkau mengampuni dosa mereka[a]—tetapi jika tidak, hapuslah aku, kiranya, dari kitab-Mu[b] yang telah Kautulis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini secara harfiah memakai kata “mengangkat/menanggung” bersama “dosa”; dapat juga dipahami sebagai “menyingkirkan dosa mereka.”
    reason: lexical_alternative
  - marker: b
    text: “Kitab-Mu” mungkin menunjuk pada daftar ilahi tentang orang-orang yang hidup atau, dalam pengertian yang lebih luas, kitab kehidupan; teks Ibrani tidak menjelaskannya lebih lanjut.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Namun sekarang
  rationale: Menandai peralihan menuju permohonan Musa dan menyampaikan daya pertentangan konteks secara wajar dalam bahasa Indonesia.
- source_word: תִּשָּׂא חַטָּאתָם
  choice: Engkau mau mengampuni dosa mereka
  rationale: Secara harfiah verba נשׂא berarti mengangkat atau menanggung; dengan 'dosa' sebagai objek, ungkapan ini bermakna mengampuni atau menyingkirkan dosa. 'Mengampuni' paling jelas dan alami.
- source_word: וְאִם אַיִן
  choice: tetapi jika tidak
  rationale: Klausa syarat negatif ini eliptis; terjemahan mempertahankan ketidaklengkapan dramatisnya sekaligus menyatakan kontras.
- source_word: מְחֵנִי נָא
  choice: hapuslah kiranya aku
  rationale: מחה sesuai dengan gambaran menghapus sesuatu dari catatan, sedangkan נָא memberi nada permohonan yang disampaikan secara bermartabat oleh 'kiranya'.
- source_word: מִסִּפְרְךָ
  choice: dari kitab-Mu
  rationale: סֵפֶר dapat berarti kitab, gulungan, atau catatan tertulis. 'Kitab-Mu' alami dalam register Alkitab dan tidak menentukan lebih jauh jenis daftar ilahi tersebut.
- source_word: אֲשֶׁר כָּתָבְתָּ
  choice: yang telah Kautulis
  rationale: Menunjukkan bahwa Allah sendiri telah menulis kitab itu; bentuk 'telah' menyampaikan tindakan selesai yang tetap relevan.
theological_decisions:
- issue: Makna 'kitab-Mu'
  choice: kitab-Mu
  alternative: gulungan-Mu; catatan-Mu; kitab kehidupan
  rationale: Bahasa Ibrani tidak menjelaskan rujukan kitab itu. Terjemahan ini mempertahankan ambiguitas apakah yang dimaksud adalah daftar orang hidup, kitab kehidupan, atau catatan ilahi lainnya.
- issue: Klausa pertama yang terputus
  choice: mempertahankan jeda dengan tanda pisah
  alternative: melengkapinya menjadi 'ampunilah dosa mereka'
  rationale: Teks Ibrani menyajikan protasis bersyarat tanpa apodosis yang dinyatakan. Tanda pisah menjaga ketegangan dan emosi permohonan Musa tanpa menambahkan kesimpulan yang tidak tertulis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan kepada Allah memakai kapitalisasi pronomina. 'Kiranya' dipertahankan karena menyampaikan permohonan yang sungguh-sungguh tanpa terdengar terlalu arkais. Tanda pisah mencerminkan klausa pertama yang sengaja tidak diselesaikan dalam bahasa sumber.
