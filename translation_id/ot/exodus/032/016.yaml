  text: וְ/הַ֨/לֻּחֹ֔ת מַעֲשֵׂ֥ה אֱלֹהִ֖ים הֵ֑מָּה וְ/הַ/מִּכְתָּ֗ב מִכְתַּ֤ב אֱלֹהִים֙ ה֔וּא חָר֖וּת עַל הַ/לֻּחֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/016.yaml
  text: The tablets were the work of God[a], and the writing was the writing of God, engraved on the tablets.
translation:
  language: id
  text: Loh-loh itu adalah karya Allah[a], dan tulisan yang terukir pada loh-loh itu adalah tulisan Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “buatan Allah.” Frasa Ibrani berbentuk kata benda dan menekankan bahwa loh-loh itu merupakan karya Allah sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַלֻּחֹת
  choice: loh-loh itu
  rationale: Kata לֻחֹת menunjuk pada loh-loh perjanjian yang sudah dikenal dari konteks. Unsur 'batu' tidak disebutkan secara eksplisit dalam ayat ini.
- source_word: מַעֲשֵׂה אֱלֹהִים
  choice: karya Allah
  rationale: Frasa nominal ini berarti karya atau buatan Allah. 'Karya Allah' mempertahankan bentuk nominal dan atribusi langsung kepada Allah dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: הֵמָּה
  choice: adalah
  rationale: Kata ganti mandiri Ibrani memberi penegasan pada identitas loh-loh itu. Dalam bahasa Indonesia, penegasan tersebut cukup disampaikan melalui susunan 'Loh-loh itu adalah karya Allah' tanpa menambahkan kata ganti kedua.
- source_word: הַמִּכְתָּב ... מִכְתַּב אֱלֹהִים
  choice: tulisan ... tulisan Allah
  rationale: Pengulangan kata benda 'tulisan' dipertahankan karena menegaskan bahwa tulisan pada loh-loh itu berasal dari Allah.
- source_word: חָרוּת
  choice: terukir
  rationale: Kata ini menyatakan tulisan yang dipahat atau digoreskan pada permukaan keras. 'Terukir' tepat untuk tulisan pada loh batu dan alami dalam bahasa Indonesia.
- source_word: עַל הַלֻּחֹת
  choice: pada loh-loh itu
  rationale: Kata depan עַל bersifat lokatif di sini; 'pada' merupakan ungkapan Indonesia yang alami untuk tulisan yang terukir di permukaan loh.
- source_word: וְ
  choice: dan
  rationale: Konjungsi awal dan konjungsi antarklausa mempertahankan kesinambungan narasi. Tidak ditambahkan penanda waktu seperti 'kemudian' karena tidak ada kata waktu eksplisit dalam sumber.
theological_decisions:
- issue: Asal loh-loh dan tulisan
  choice: Baik loh-loh maupun tulisan pada loh-loh itu dinyatakan sebagai karya atau tulisan Allah sendiri.
  alternative: Ayat ini dapat diungkapkan secara verbal sebagai 'loh-loh itu dibuat oleh Allah dan tulisannya ditulis oleh Allah.'
  rationale: Teks Ibrani memakai frasa nominal, yakni 'karya Allah' dan 'tulisan Allah'. Mempertahankan bentuk nominal menjaga penegasan teks tanpa menentukan lebih jauh cara atau perantaraan tindakan Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan klausa kedua sedikit ditata ulang agar hubungan antara tulisan, pengukiran, dan loh-loh jelas serta alami, sambil tetap mempertahankan pengulangan 'tulisan' dari bahasa Ibrani.
