source:
  edition: WLC
  text: וְ/עַתָּ֞ה לֵ֣ךְ נְחֵ֣ה אֶת הָ/עָ֗ם אֶ֤ל אֲשֶׁר דִּבַּ֨רְתִּי֙ לָ֔/ךְ הִנֵּ֥ה מַלְאָכִ֖/י יֵלֵ֣ךְ לְ/פָנֶ֑י/ךָ וּ/בְ/י֣וֹם פָּקְדִ֔/י וּ/פָקַדְתִּ֥י עֲלֵי/הֶ֖ם חַטָּאתָֽ/ם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/034.yaml
  text: But now go, lead the people to where I have spoken to you. Look, my angel will go before you; but on the day when I call them to account, I will call them to account for their sin.
translation:
  language: id
  text: Tetapi sekarang, pergilah, tuntunlah bangsa itu ke tempat yang telah Kufirmankan kepadamu. Lihatlah, malaikat-Ku akan berjalan di depanmu. Namun, pada hari Aku meminta pertanggungjawaban, Aku akan meminta pertanggungjawaban mereka atas dosa mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ungkapan Ibrani mengulang kata dari akar yang sama: secara harfiah, “pada hari kunjungan-Ku, Aku akan mengunjungi mereka atas dosa mereka.” Dalam konteks ini, pengulangan tersebut menyatakan bahwa Allah akan meminta pertanggungjawaban mereka atas dosa mereka; penghukuman tersirat, tetapi tidak dinyatakan secara khusus.'
    reason: Menjelaskan pengulangan akar פקד dan rentang maknanya, yang tidak dapat direproduksi sepenuhnya secara alami dalam bahasa Indonesia, tanpa menyempitkan kata itu menjadi pelaksanaan hukuman saja.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Tetapi sekarang
  rationale: Konteks menuntut peralihan kontras setelah permohonan Musa; 'sekarang' mempertahankan unsur waktunya.
- source_word: נְחֵה
  choice: tuntunlah
  rationale: Imperatif ini berarti memimpin atau menuntun; 'tuntunlah' alami untuk pengarahan bangsa dalam perjalanan.
- source_word: מַלְאָכִי
  choice: malaikat-Ku
  rationale: מַלְאָךְ dapat berarti utusan atau malaikat; dalam konteks utusan ilahi yang berjalan di depan Israel, 'malaikat-Ku' mempertahankan padanan tradisional tanpa menentukan identitasnya lebih jauh.
- source_word: פָקְדִי / וּפָקַדְתִּי
  choice: Aku mengadakan perhitungan / Aku akan memperhitungkan
  rationale: Pengulangan akar פקד dipertahankan sebisa mungkin. Dalam konteks ini maknanya adalah mendatangi untuk meminta pertanggungjawaban, bukan sekadar 'mengunjungi'.
- source_word: עֲלֵיהֶם חַטָּאתָם
  choice: memperhitungkan dosa mereka kepada mereka
  rationale: Mempertahankan gagasan bahwa dosa itu dikenakan atau diperhitungkan atas mereka, walaupun ungkapannya diberi bentuk Indonesia yang dapat dipahami.
theological_decisions:
- issue: Identitas מַלְאָכִי
  choice: malaikat-Ku
  alternative: utusan-Ku
  rationale: Teks tidak menjelaskan identitas sosok tersebut. Terjemahan tidak mengidentifikasikannya dengan tokoh ilahi tertentu ataupun malaikat ciptaan tertentu.
- issue: Nuansa penghukuman dalam akar פקד
  choice: mengadakan perhitungan / memperhitungkan dosa
  alternative: menghukum
  rationale: Pilihan ini mempertahankan nuansa meminta pertanggungjawaban dan tidak menyempitkan kata kerja langsung menjadi pelaksanaan hukuman, meski konsekuensi hukuman tersirat kuat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pada pronomina yang merujuk kepada Allah mengikuti kebiasaan penerbitan Alkitab Indonesia. Kalimat dibuat langsung dan mudah dibaca sambil mempertahankan pengulangan serta ketegangan makna teks Ibrani.
