  to: Tetapi sekarang, pergilah, tuntunlah bangsa itu ke tempat yang telah Kufirmankan kepadamu. Lihatlah, malaikat-Ku akan berjalan di depanmu. Namun, pada hari Aku meminta pertanggungjawaban, Aku akan meminta pertanggungjawaban mereka atas dosa mereka.[a]
  rationale: Revisi terbatas pada klausa terakhir dan catatan kaki. “Meminta pertanggungjawaban” secara alami mewakili nuansa פקד dalam konteks ini dan mempertahankan pengulangannya, sedangkan “mereka atas dosa mereka” mengungkapkan bahwa pertanggungjawaban itu dikenakan pada pelaku tanpa konstruksi Indonesia yang janggal.
