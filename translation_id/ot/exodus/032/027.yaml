- from: 'Lalu ia berkata kepada mereka, “Beginilah firman Yahweh, Allah Israel: ‘Hendaklah setiap orang menyandang pedangnya pada pinggangnya. Berjalanlah bolak-balik dari satu gerbang ke gerbang lain di seluruh perkemahan, dan hendaklah setiap orang membunuh saudaranya, kawannya, dan kerabat dekatnya[a].’”'
  to: 'Lalu ia berkata kepada mereka, “Beginilah firman Yahweh, Allah Israel: Hendaklah setiap orang mengikatkan pedangnya pada pahanya. Berjalanlah bolak-balik dari satu gerbang ke gerbang lain di seluruh perkemahan, dan hendaklah setiap orang membunuh saudaranya, dan setiap orang membunuh kawannya, dan setiap orang membunuh orang dekatnya[a].”'
  rationale: 'Revisi mempertahankan formula ilahi, nama Yahweh, dan nada perintah yang keras, sambil memperbaiki tiga hal: lokasi pedang dibuat lebih dekat dengan kata Ibrani untuk “paha”; pengulangan distributif “setiap orang” dipulihkan; dan קְרֹבוֹ tidak lagi dipersempit menjadi kerabat dalam teks utama. Catatan kaki tetap ditambatkan tepat pada frasa yang dijelaskan.'
