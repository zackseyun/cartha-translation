id: EXO.32.27
reference: Exodus 32:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לָ/הֶ֗ם כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שִׂ֥ימוּ אִישׁ חַרְבּ֖/וֹ עַל יְרֵכ֑/וֹ עִבְר֨וּ וָ/שׁ֜וּבוּ מִ/שַּׁ֤עַר לָ/שַׁ֨עַר֙ בַּֽ/מַּחֲנֶ֔ה וְ/הִרְג֧וּ אִֽישׁ אֶת אָחִ֛י/ו וְ/אִ֥ישׁ אֶת רֵעֵ֖/הוּ וְ/אִ֥ישׁ אֶת קְרֹבֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/027.yaml
  text: 'And he said to them[a], “Thus says Yahweh, the God of Israel: Each man, put his sword on his thigh. Pass through and return from gate to gate throughout the camp, and each man kill his brother, and each man his companion, and each man his neighbor.”'
translation:
  language: id
  text: 'Lalu ia berkata kepada mereka, “Beginilah firman Yahweh, Allah Israel: Hendaklah setiap orang mengikatkan pedangnya pada pahanya. Berjalanlah bolak-balik dari satu gerbang ke gerbang lain di seluruh perkemahan, dan hendaklah setiap orang membunuh saudaranya, dan setiap orang membunuh kawannya, dan setiap orang membunuh orang dekatnya[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang yang dekat dengannya”; dapat juga berarti “kerabat dekatnya” atau “orang dekatnya.”
    reason: Frasa Ibrani קְרֹבוֹ dapat menunjuk kepada orang yang dekat, termasuk kerabat dekat, sehingga teks utama mempertahankan cakupan maknanya.
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: Lalu ia berkata kepada mereka
  rationale: Wayyiqtol melanjutkan alur narasi; “Lalu” wajar dalam bahasa Indonesia dan tidak menambahkan hubungan sebab-akibat.
- source_word: כֹּה אָמַר
  choice: Beginilah firman
  rationale: Mempertahankan rumusan pembawa pesan ilahi yang berwibawa, sekaligus menggunakan ungkapan Indonesia yang alami dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Padanan ringkas dan lazim bagi frasa konstruksi yang mengidentifikasi Yahweh sebagai Allah Israel.
- source_word: שִׂימוּ אִישׁ חַרְבּוֹ עַל יְרֵכוֹ
  choice: Hendaklah setiap orang menyandang pedangnya pada pinggangnya
  rationale: Ungkapan ini berarti mempersenjatai diri dengan memasang pedang di sisi tubuh; “menyandang” menyampaikan tindakan itu secara alami tanpa menghilangkan gambaran sumber.
- source_word: עִבְרוּ וָשׁוּבוּ
  choice: Berjalanlah bolak-balik
  rationale: Dua imperatif ini menyatakan gerakan pergi dan kembali; padanan ini menangkap gerak berulang secara jelas dalam bahasa Indonesia.
- source_word: מִשַּׁעַר לָשַׁעַר בַּמַּחֲנֶה
  choice: dari satu gerbang ke gerbang lain di seluruh perkemahan
  rationale: Menyampaikan gerakan melintasi kawasan perkemahan dari gerbang ke gerbang.
- source_word: וְהִרְגוּ
  choice: membunuh
  rationale: Padanan langsung dan modern untuk tindakan menyebabkan kematian, tanpa memperhalus kekerasan perintah tersebut.
- source_word: אִישׁ אֶת אָחִיו וְאִישׁ אֶת רֵעֵהוּ וְאִישׁ אֶת קְרֹבוֹ
  choice: setiap orang membunuh saudaranya, kawannya, dan kerabat dekatnya
  rationale: “Setiap orang” mempertahankan daya distributif אִישׁ. Tiga objek tetap dibedakan; קְרֹבוֹ dipahami sebagai orang yang dekat, kemungkinan seorang kerabat dekat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama perjanjian secara langsung; transliterasi mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Daya distributif אִישׁ dalam perintah
  choice: setiap orang
  alternative: setiap laki-laki
  rationale: Dalam bahasa Indonesia, “setiap orang” secara alami menyatakan tanggung jawab masing-masing anggota kelompok yang sedang disapa. Konteks menunjukkan mereka laki-laki, tetapi kata אִישׁ di sini terutama berfungsi distributif.
- issue: Hubungan antarmanusia dalam triad אָחִיו / רֵעֵהוּ / קְרֹבוֹ
  choice: saudaranya, kawannya, dan kerabat dekatnya
  alternative: saudaranya, sesamanya, dan orang yang dekat dengannya
  rationale: Pilihan ini mempertahankan kerasnya perintah yang menembus hubungan keluarga dan sosial, sembari menandai ketidakpastian cakupan קְרֹבוֹ melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “Beginilah firman” mempertahankan corak formula ilahi, sedangkan “berjalanlah bolak-balik” dan “menyandang pedang” menjaga kejelasan bagi pembaca umum. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang dijelaskan.
