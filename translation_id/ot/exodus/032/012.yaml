  text: לָ/מָּה֩ יֹאמְר֨וּ מִצְרַ֜יִם לֵ/אמֹ֗ר בְּ/רָעָ֤ה הֽוֹצִיאָ/ם֙ לַ/הֲרֹ֤ג אֹתָ/ם֙ בֶּֽ/הָרִ֔ים וּ֨/לְ/כַלֹּתָ֔/ם מֵ/עַ֖ל פְּנֵ֣י הָֽ/אֲדָמָ֑ה שׁ֚וּב מֵ/חֲר֣וֹן אַפֶּ֔/ךָ וְ/הִנָּחֵ֥ם עַל הָ/רָעָ֖ה לְ/עַמֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/012.yaml
  text: Why should the Egyptians say[a], ‘He brought them out with evil intent, to kill them in the mountains and to wipe them off the face of the earth’? Turn from your burning anger[c][b], and relent concerning the harm intended for your people.
translation:
  language: id
  text: Mengapa orang Mesir harus berkata, “Ia membawa mereka keluar dengan niat jahat[a], untuk membunuh mereka di pegunungan dan memusnahkan mereka dari muka bumi[b]”? Berpalinglah dari murka-Mu yang menyala-nyala, dan urungkanlah malapetaka yang hendak Kau timpakan kepada umat-Mu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “untuk mencelakakan mereka” atau “dengan maksud buruk.” Frasa Ibrani ini menyatakan motif yang akan dituduhkan orang Mesir kepada Allah.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “menghabisi mereka.” Kata kerja Ibrani tersebut menyatakan pemusnahan secara menyeluruh.
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan “dan berubahlah mengenai bencana bagi umat-Mu.” Bahasa Ibrani memakai ungkapan yang menggambarkan Allah dalam bahasa pengalaman dan hubungan manusia di dalam permohonan Musa.
    reason: alternative_reading
lexical_decisions:
- source_word: לָמָּה יֹאמְרוּ מִצְרַיִם
  choice: Mengapa orang Mesir harus berkata
  rationale: Ungkapan ini merupakan pertanyaan retoris dalam permohonan Musa; “harus berkata” mempertahankan nuansa konteks tanpa menjadikannya prediksi biasa.
- source_word: בְּרָעָה
  choice: dengan niat jahat
  rationale: Frasa ini menyatakan maksud jahat yang akan dituduhkan orang Mesir kepada Allah, bukan sekadar akibat buruk.
- source_word: הוֹצִיאָם
  choice: Ia membawa mereka keluar
  rationale: Bentuk kausatif dari יצא dalam konteks keluaran berarti membawa umat itu keluar.
- source_word: בֶּהָרִים
  choice: di pegunungan
  rationale: Padanan langsung dan alami untuk bentuk jamak הָרִים dalam konteks kawasan padang gurun bergunung.
- source_word: וּלְכַלֹּתָם מֵעַל פְּנֵי הָאֲדָמָה
  choice: dan memusnahkan mereka dari muka bumi
  rationale: כלה dalam bentuk Piel menyatakan penghancuran sampai tuntas; “memusnahkan” berpadu alami dengan idiom “dari muka bumi”.
- source_word: שׁוּב מֵחֲרוֹן אַפֶּךָ
  choice: Berpalinglah dari murka-Mu yang menyala-nyala
  rationale: Mempertahankan imperatif serta metafora panas yang terkandung dalam חֲרוֹן אַף dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: וְהִנָּחֵם עַל הָרָעָה לְעַמֶּךָ
  choice: dan urungkanlah malapetaka yang hendak Kau timpakan kepada umat-Mu
  rationale: “Urungkanlah” menyampaikan permohonan agar tindakan yang diancamkan tidak dilaksanakan, sedangkan “malapetaka” menyatakan bencana penghukuman tanpa menyifatkan kejahatan moral kepada Allah.
theological_decisions:
- issue: Bahasa antropopatik dalam וְהִנָּחֵם
  choice: urungkanlah
  alternative: menyesallah; ubahlah niat-Mu; batalkanlah
  rationale: “Urungkanlah” mempertahankan daya nyata permohonan Musa agar Allah tidak melaksanakan hukuman yang diancamkan, tanpa menyiratkan bahwa Allah telah melakukan kesalahan moral. Ketegangan naratif tetap dipertahankan.
- issue: Makna הָרָעָה bagi tindakan penghukuman yang diancamkan Allah
  choice: malapetaka
  alternative: bencana; celaka; kejahatan
  rationale: Dalam konteks ini kata tersebut menunjuk pada akibat buruk atau bencana penghukuman bagi umat, bukan kejahatan moral pada diri Allah.
- issue: Arah relasional לְעַמֶּךָ
  choice: yang hendak Kau timpakan kepada umat-Mu
  alternative: terhadap umat-Mu; bagi umat-Mu
  rationale: Ungkapan ini memperjelas secara alami bahwa malapetaka tersebut merupakan tindakan yang diancamkan terhadap umat, sambil tidak menyatakan bahwa tindakan itu sudah terjadi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan khidmat. Bentuk sapaan ilahi memakai huruf kapital sesuai kebiasaan penulisan Indonesia. Tanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
