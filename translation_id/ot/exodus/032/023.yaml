  text: וַ/יֹּ֣אמְרוּ לִ֔/י עֲשֵׂה לָ֣/נוּ אֱלֹהִ֔ים אֲשֶׁ֥ר יֵלְכ֖וּ לְ/פָנֵ֑י/נוּ כִּי זֶ֣ה מֹשֶׁ֣ה הָ/אִ֗ישׁ אֲשֶׁ֤ר הֶֽעֱלָ֨/נוּ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לֹ֥א יָדַ֖עְנוּ מֶה הָ֥יָה לֽ/וֹ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/023.yaml
  text: And they said to me[a], ‘Make gods for us, which will go before us, because this Moses, the man who brought us up from the land of Egypt—we do not know what has happened to him.’
translation:
  language: id
  text: Lalu mereka berkata kepadaku, ‘Buatlah bagi kami ilah-ilah[a] yang akan berjalan di depan kami, sebab Musa ini—orang yang membawa kami keluar dari tanah Mesir—kami tidak tahu apa yang terjadi dengannya.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Buatlah bagi kami seorang ilah yang akan berjalan di depan kami.” Walaupun ayat ini memakai nomina berbentuk jamak dan verba jamak (“ilah-ilah ... akan berjalan”), sebagian orang memahaminya sebagai tunggal berdasarkan konteks patung anak lembu di sekitarnya.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ לִי
  choice: Lalu mereka berkata kepadaku
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menyampaikan fungsi itu secara alami dalam bahasa Indonesia.
- source_word: עֲשֵׂה לָנוּ
  choice: Buatlah bagi kami
  rationale: Mempertahankan bentuk perintah serta nuansa datif לָנוּ, yaitu sesuatu yang dibuat untuk mereka.
- source_word: אֱלֹהִים
  choice: ilah-ilah
  rationale: Walaupun אֱלֹהִים dapat bermakna tunggal atau jamak, verba jamak יֵלְכוּ dalam klausa berikutnya sangat mendukung makna jamak di ayat ini. “Ilah-ilah” juga membedakannya dari sebutan bagi Allah.
- source_word: אֲשֶׁר יֵלְכוּ לְפָנֵינוּ
  choice: yang akan berjalan di depan kami
  rationale: Mempertahankan verba jamak Ibrani secara semantis dan ungkapan berjalan di depan sebagai gambaran memimpin atau mendahului umat.
- source_word: כִּי
  choice: sebab
  rationale: Menandai alasan bagi permintaan tersebut dengan gaya naratif yang wajar dan bermartabat.
- source_word: זֶה מֹשֶׁה הָאִישׁ
  choice: Musa ini, orang ... itu
  rationale: “Musa ini” mempertahankan nada menunjuk yang agak menjauhkan. Penyebutan הָאִישׁ dipertahankan melalui aposisi “orang ... itu” tanpa menghasilkan susunan Indonesia yang terlalu kaku.
- source_word: אֲשֶׁר הֶעֱלָנוּ מֵאֶרֶץ מִצְרַיִם
  choice: yang telah membawa kami keluar dari tanah Mesir
  rationale: Hifil עלה berarti menyebabkan naik atau membawa naik; dalam bahasa Indonesia, “membawa ... keluar” menyampaikan maksud eksodus secara alami, sedangkan “tanah Mesir” mempertahankan אֶרֶץ.
- source_word: לֹא יָדַעְנוּ
  choice: kami tidak tahu
  rationale: Perfect Ibrani menyatakan keadaan hasil yang masih berlaku; bentuk kini bahasa Indonesia paling alami dalam kutipan langsung.
- source_word: מֶה הָיָה לוֹ
  choice: apa yang telah terjadi padanya
  rationale: Menyampaikan idiom yang menanyakan nasib atau keadaan seseorang tanpa menambahkan penafsiran.
theological_decisions:
- issue: Apakah אֱלֹהִים dalam laporan Harun diterjemahkan tunggal atau jamak
  choice: 'Jamak: “ilah-ilah”'
  alternative: 'Tunggal: “seorang ilah” atau “ilah”'
  rationale: Verba יֵלְכוּ berbentuk jamak, sehingga bacaan jamak paling langsung mencerminkan tata bahasa ayat ini. Catatan kaki mengakui kemungkinan pemaknaan tunggal berdasarkan konteks patung anak lembu, tanpa menyelaraskan ketegangan dalam teks secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif yang wajar dan bermartabat. Bentuk “ilah-ilah” dipilih untuk mempertahankan penandaan jamak Ibrani dan membedakannya secara ortografis dari “Allah”. Tanda pisah mempertahankan jeda serta penekanan pada ketidakpastian mengenai Musa.
