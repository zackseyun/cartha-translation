  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֤רְא מֹשֶׁה֙ אֶת הָ/עָ֔ם כִּ֥י פָרֻ֖עַ ה֑וּא כִּֽי פְרָעֹ֣/ה אַהֲרֹ֔ן לְ/שִׁמְצָ֖ה בְּ/קָמֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/025.yaml
  text: When Moses saw that the people were out of control—for Aaron had let them get out of control[b][a], for a derision among those who rose against them—
translation:
  language: id
  text: Ketika Musa melihat bahwa bangsa itu sudah tidak terkendali—sebab Harun telah membiarkan mereka lepas kendali[a], sehingga mereka menjadi bahan ejekan di antara orang-orang yang bangkit melawan mereka[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, kata Ibrani yang seakar dipakai untuk keadaan bangsa itu dan tindakan Harun; dapat juga diterjemahkan “tanpa kekangan” dan “membiarkan mereka tanpa kekangan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “menjadi cemoohan di antara lawan-lawan mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא מֹשֶׁה
  choice: Ketika Musa melihat
  rationale: Bentuk naratif dengan waw memajukan kisah dan, dalam konteks ini, secara alami mengantar tindakan Musa berikutnya dengan hubungan waktu.
- source_word: הָעָם
  choice: bangsa itu
  rationale: עָם menunjuk kepada umat Israel yang berkumpul di perkemahan; 'bangsa itu' alami dalam bahasa Indonesia dan mempertahankan rujukan yang sudah dikenal dari konteks.
- source_word: כִּי פָרֻעַ הוּא
  choice: bahwa bangsa itu sudah tidak terkendali
  rationale: Bentuk dari akar פרע menggambarkan keadaan tanpa kekangan atau kacau. 'Sudah tidak terkendali' menyampaikan keadaan sosial tersebut tanpa mempersempitnya menjadi ketelanjangan atau kebejatan tertentu.
- source_word: כִּי פְרָעֹה אַהֲרֹן
  choice: sebab Harun telah membiarkan mereka lepas kendali
  rationale: Klausa ini menjelaskan sebab keadaan bangsa itu dan menempatkan Harun sebagai pelaku. Ungkapan 'lepas kendali' mempertahankan kaitan dengan akar yang sama tanpa menghasilkan pengulangan Indonesia yang kaku.
- source_word: לְשִׁמְצָה
  choice: sehingga mereka menjadi bahan ejekan
  rationale: שִׁמְצָה menyatakan kehinaan, cemoohan, atau keadaan menjadi sasaran ejekan. Rumusan ini alami dan mempertahankan nuansa akibat atau tujuan yang dapat dibawa oleh לְ.
- source_word: בְּקָמֵיהֶם
  choice: di antara orang-orang yang bangkit melawan mereka
  rationale: Partisip dari קום secara harfiah menunjuk kepada mereka yang bangkit menentang Israel; terjemahan ini mempertahankan gambaran verbal dan tidak sekadar menggantinya dengan 'musuh'.
theological_decisions:
- issue: Nuansa moral dan sosial akar פרע
  choice: Diterjemahkan sebagai 'tidak terkendali' dan 'lepas kendali'.
  alternative: '''tanpa kekangan'', ''dibiarkan liar'', atau ''telanjang/tersingkap'''
  rationale: Dalam konteks ini akar tersebut terutama menunjukkan hilangnya kekangan dan ketertiban di bawah tanggung jawab Harun. 'Telanjang' terlalu spesifik dan dapat memasukkan penafsiran yang tidak dituntut oleh ayat.
- issue: Hubungan לְשִׁמְצָה dengan keadaan bangsa itu
  choice: 'Dinyatakan sebagai akibat: ''sehingga mereka menjadi bahan ejekan''.'
  alternative: '''untuk menjadi bahan ejekan'' atau ''menjadi cemoohan'''
  rationale: Preposisi לְ dapat menyatakan hasil atau tujuan. Rumusan akibat paling alami dalam bahasa Indonesia sambil tetap membiarkan terbuka apakah ejekan itu merupakan hasil yang disengaja atau konsekuensi dari tindakan Harun.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda pisah mempertahankan klausa penjelas yang belum selesai dan menghubungkan ayat ini dengan tindakan Musa pada ayat berikutnya.
