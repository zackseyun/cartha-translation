translation:
  language: id
  text: Musa berkata kepada Harun, “Apa yang telah dilakukan bangsa ini kepadamu sehingga engkau mendatangkan dosa besar atas bangsa ini?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Bentuk naratif wayyiqtol menyatakan tindakan lampau berurutan; dalam bahasa Indonesia, konjungsi awal tidak perlu dinyatakan agar narasi tetap alami.
- source_word: מֶה עָשָׂה לְךָ הָעָם הַזֶּה
  choice: Apa yang telah dilakukan bangsa ini kepadamu
  rationale: מֶה memperkenalkan pertanyaan, sedangkan עָשָׂה + לְ berarti ‘melakukan kepada’. ‘Bangsa ini’ mempertahankan penunjuk הַזֶּה dan nada berjarak dalam teguran Musa.
- source_word: כִּי
  choice: sehingga
  rationale: Dalam konteks pertanyaan ini, כִּי menghubungkan tindakan yang ditanyakan dengan akibat pada tindakan Harun. ‘Sehingga’ mengungkapkan hubungan tersebut secara alami tanpa memastikan apakah nuansanya semata-mata kausal atau resultatif.
- source_word: הֵבֵאתָ
  choice: engkau mendatangkan
  rationale: Bentuk Hifil dari בוא berarti ‘membawa’ atau ‘menyebabkan datang’. ‘Mendatangkan’ mempertahankan daya kausatif serta tuduhan langsung kepada Harun.
- source_word: עָלָיו
  choice: atas mereka
  rationale: Pronomina Ibrani berbentuk tunggal karena merujuk kepada הָעָם, nomina kolektif tunggal. Bahasa Indonesia secara wajar memakai ‘mereka’ untuk para anggota bangsa itu.
- source_word: חֲטָאָה גְדֹלָה
  choice: dosa besar
  rationale: Ungkapan ini secara langsung berarti ‘dosa besar’; terjemahan tidak menambahkan penegasan seperti ‘dosa yang sedemikian besar’ yang tidak dinyatakan secara eksplisit dalam teks sumber.
theological_decisions:
- issue: Tingkat tanggung jawab Harun
  choice: engkau mendatangkan dosa besar atas mereka
  alternative: engkau telah menjerumuskan mereka ke dalam dosa besar
  rationale: Teks secara langsung membebankan tanggung jawab kepada Harun dengan konstruksi ‘mendatangkan dosa ... atas’ bangsa itu. Pilihan ini mempertahankan tuduhan moral tersebut tanpa memperluasnya menjadi gambaran khusus tentang ‘menjerumuskan’.
- issue: Acuan pronomina עָלָיו
  choice: mereka
  alternative: bangsa itu
  rationale: Pronomina tunggal merujuk secara kolektif kepada ‘bangsa ini’. ‘Mereka’ menyampaikan makna kolektifnya secara alami tanpa mengubah pihak yang menanggung dosa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Engkau’ dipakai dalam ujaran langsung untuk menjaga nada serius tanpa terdengar kuno; susunan pertanyaan mempertahankan ketegangan teguran Musa.
