  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ אַהֲרֹ֔ן פָּֽרְקוּ֙ נִזְמֵ֣י הַ/זָּהָ֔ב אֲשֶׁר֙ בְּ/אָזְנֵ֣י נְשֵׁי/כֶ֔ם בְּנֵי/כֶ֖ם וּ/בְנֹתֵי/כֶ֑ם וְ/הָבִ֖יאוּ אֵלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/002.yaml
  text: And Aaron said to them[a], “Take off the rings of gold that are in the ears of your wives, your sons, and your daughters, and bring them to me.”
translation:
  language: id
  text: Lalu Harun berkata kepada mereka, “Lepaskanlah anting-anting emas yang ada di telinga istri, anak laki-laki, dan anak perempuan kalian, lalu bawalah semuanya kepadaku.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Copotlah anting-anting emas itu ….” Kata kerja Ibrani yang dipakai dapat menyiratkan tindakan melepaskan atau mencopot perhiasan dengan paksa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “lalu” menyatakannya secara alami dalam bahasa Indonesia tanpa menambahkan hubungan sebab-akibat.
- source_word: אֲלֵהֶם
  choice: kepada mereka
  rationale: Mempertahankan pronomina jamak yang dinyatakan secara eksplisit dalam bahasa Ibrani.
- source_word: אַהֲרֹן
  choice: Harun
  rationale: Mengikuti bentuk nama yang lazim dan baku dalam tradisi Alkitab bahasa Indonesia.
- source_word: פָּרְקוּ
  choice: Lepaskanlah
  rationale: Dalam konteks perhiasan yang dikenakan di telinga, verba ini secara alami berarti melepaskan, meskipun dapat pula menyiratkan tindakan mencopot atau menanggalkan dengan paksa; kemungkinan itu dipertahankan dalam catatan kaki.
- source_word: נִזְמֵי הַזָּהָב
  choice: anting-anting emas
  rationale: נֶזֶם dapat menunjuk cincin hidung atau anting-anting, tetapi keterangan bahwa benda itu berada di telinga menentukan makna “anting-anting”; bentuk ini paling alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר בְּאָזְנֵי
  choice: yang ada di telinga
  rationale: Menerjemahkan klausa relatif dan lokasi secara langsung serta wajar.
- source_word: נְשֵׁיכֶם
  choice: istri ... kalian
  rationale: Dalam konteks rumah tangga ini, נָשִׁים paling mungkin berarti “istri-istri”; konstruksi distributif Indonesia menghindari bentuk yang kaku.
- source_word: בְּנֵיכֶם
  choice: anak laki-laki ... kalian
  rationale: Mempertahankan rujukan khusus kepada anak laki-laki, bukan menggeneralisasikannya menjadi “anak-anak”.
- source_word: וּבְנֹתֵיכֶם
  choice: dan anak perempuan kalian
  rationale: Mempertahankan penyebutan anak perempuan secara eksplisit dan sejajar dengan anak laki-laki.
- source_word: וְהָבִיאוּ אֵלָי
  choice: lalu bawalah semuanya kepadaku
  rationale: Menyampaikan perintah kedua dengan jelas; “semuanya” merujuk pada seluruh anting-anting dan membuat objek tersirat terasa alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “kalian” dipakai untuk pronomina orang kedua jamak agar jelas bahwa perintah ditujukan kepada banyak orang. Catatan kaki ditempatkan setelah kalimat, dan penandanya muncul dalam teks utama.
