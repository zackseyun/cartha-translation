  source_fidelity: 'Terjemahan secara akurat mencerminkan teks Ibrani: Harun berbicara kepada mereka, memerintahkan pelepasan perhiasan emas yang berada di telinga istri-istri, anak-anak laki-laki, dan anak-anak perempuan mereka, lalu membawanya kepadanya. “Anting-anting” tepat karena lokasi pada telinga memperjelas makna נזמים. Objek tersirat pada perintah kedua dinyatakan wajar melalui “semuanya.”'
