base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/015.yaml
  text: Then Moses turned and went down from the mountain[a], with the two tablets of the testimony in his hand, tablets written on both their sides; on this side and on that they were written.
translation:
  language: id
  text: Lalu Musa berbalik dan turun dari gunung itu dengan kedua loh kesaksian di tangannya. Loh-loh itu ditulisi pada kedua sisinya[a]; pada sisi yang satu dan pada sisi yang lain, loh-loh itu ditulisi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pada satu sisi dan pada sisi yang lain.”'
    reason: Alternatif untuk ungkapan distributif Ibrani yang menegaskan bahwa tulisan terdapat pada kedua sisi loh.
lexical_decisions:
- source_word: וַיִּפֶן
  choice: berbalik
  rationale: Kata kerja פנה menandai perubahan arah Musa sebelum ia turun. “Berbalik” dekat dengan bentuk Ibrani dan alami dalam narasi Indonesia.
- source_word: וַיֵּרֶד
  choice: turun
  rationale: ירד berarti pergi atau bergerak turun. “Turun” ringkas, alami, dan tidak menambahkan sudut pandang yang tidak dinyatakan teks.
- source_word: הָהָר
  choice: gunung itu
  rationale: Dalam konteks Sinai, הַר tepat diterjemahkan “gunung”; unsur definitnya disampaikan dengan “itu” secara alami dalam bahasa Indonesia.
- source_word: שְׁנֵי לֻחֹת
  choice: kedua loh
  rationale: לֻחֹת menunjuk pada lempengan atau loh. Kata “batu” tidak ditambahkan karena tidak disebutkan secara eksplisit dalam ayat ini.
- source_word: הָעֵדֻת
  choice: kesaksian
  rationale: “Kesaksian” mempertahankan istilah perjanjian yang mapan dan gema teologis עֵדוּת tanpa mempersempitnya menjadi sekadar dokumen perjanjian.
- source_word: בְּיָדוֹ
  choice: di tangannya
  rationale: Bentuk Ibraninya tunggal, secara harfiah “di tangannya”; bentuk tunggal dipertahankan tanpa mengubahnya menjadi “di kedua tangannya”.
- source_word: לֻחֹת כְּתֻבִים
  choice: Loh-loh itu bertuliskan
  rationale: Partisipel pasif כְּתֻבִים menyatakan bahwa loh-loh tersebut telah diberi tulisan. “Bertuliskan” lebih alami daripada konstruksi pasif kaku, namun tidak menambahkan gagasan mengukir.
- source_word: מִשְּׁנֵי עֶבְרֵיהֶם
  choice: pada kedua sisinya
  rationale: Frasa ini menunjukkan adanya tulisan pada kedua permukaan loh. “Pada kedua sisinya” menyampaikan maknanya secara idiomatis sambil mempertahankan rujukan kepada loh-loh.
- source_word: מִזֶּה וּמִזֶּה
  choice: pada sisi yang satu dan pada sisi yang lain
  rationale: Ungkapan distributif ini menegaskan masing-masing sisi. Terjemahan mempertahankan kesejajaran dan pengulangan teks Ibrani.
- source_word: הֵם כְּתֻבִים
  choice: loh-loh itu bertuliskan
  rationale: Klausa ini mengulangi fakta bahwa kedua sisi berisi tulisan. Pengulangan tersebut dipertahankan, bukan dihaluskan atau dihilangkan.
theological_decisions:
- issue: Makna עֵדֻת dalam sebutan bagi kedua loh
  choice: kesaksian
  alternative: perjanjian; bukti kesaksian
  rationale: “Kesaksian” mempertahankan istilah khusus teks Ibrani beserta hubungan perjanjiannya tanpa menggantikannya dengan suatu penafsiran yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah tradisional “loh kesaksian” dipertahankan karena jelas dalam konteks Alkitab, sedangkan susunan kalimat dibuat alami. Pengulangan pada akhir ayat sengaja dipertahankan untuk mencerminkan penekanan teks Ibrani.
