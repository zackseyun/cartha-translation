  to: Lalu Musa berbalik dan turun dari gunung itu dengan kedua loh kesaksian di tangannya. Loh-loh itu ditulisi pada kedua sisinya[a]; pada sisi yang satu dan pada sisi yang lain, loh-loh itu ditulisi.
