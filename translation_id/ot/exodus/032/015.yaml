  verdict: revise
  source_fidelity: 'Makna pokoknya setia pada Ibrani: Musa berbalik, turun dari gunung itu, membawa kedua loh kesaksian, dan tulisan ada pada kedua sisi loh. Namun, "bertuliskan pada kedua sisinya" kurang tepat dan kurang alami untuk menyatakan bahwa permukaan loh itu ditulisi; bentuk pasif "ditulisi" menyampaikan partisipel pasif כְּתֻבִים dengan lebih jelas. Pengulangan final tetap dipertahankan sebagaimana dalam teks sumber.'
  naturalness: '"Loh-loh itu bertuliskan pada kedua sisinya" terdengar janggal dalam bahasa Indonesia modern, karena "bertuliskan" lazimnya langsung diikuti isi tulisan, bukan lokasi permukaan tulisan. "Loh-loh itu ditulisi pada kedua sisinya" baku, jelas, dan alami. Koma setelah frasa pembuka pada klausa terakhir membantu keterbacaan tanpa mengubah penekanan.'
  terminology: '"Musa", "gunung itu", "loh kesaksian", dan "di tangannya" sudah tepat. "Kesaksian" mempertahankan עֵדוּת tanpa menyempitkannya menjadi "perjanjian". Catatan kaki lama terlalu menonjolkan bentuk preposisi "dari" yang tidak mencerminkan fungsi idiomatis frasa dalam konteks; catatan pengganti menyajikan alternatif distributif yang relevan.'
