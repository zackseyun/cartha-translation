  naturalness: Kalimatnya umumnya baku dan mengalir. Namun, “alat pengukir” lazimnya berarti orang yang mengukir, bukan alat. “Alat ukir” adalah istilah Indonesia yang tepat dan alami untuk instrumen yang dimaksud.
  terminology: “Ilah-ilahmu” dengan huruf kecil tepat untuk mempertahankan bentuk jamak אֱלֹהֶיךָ tanpa mengidentifikasikannya dengan sebutan khusus bagi Allah Israel. “Patung anak sapi tuangan” dapat dipertahankan sebagai padanan yang jelas bagi gambar anak sapi hasil penuangan.
  issues:
