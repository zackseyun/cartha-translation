  text: וַ/יִּקַּ֣ח מִ/יָּדָ֗/ם וַ/יָּ֤צַר אֹת/וֹ֙ בַּ/חֶ֔רֶט וַֽ/יַּעֲשֵׂ֖/הוּ עֵ֣גֶל מַסֵּכָ֑ה וַ/יֹּ֣אמְר֔וּ אֵ֤לֶּה אֱלֹהֶ֨י/ךָ֙ יִשְׂרָאֵ֔ל אֲשֶׁ֥ר הֶעֱל֖וּ/ךָ מֵ/אֶ֥רֶץ מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/004.yaml
  text: And he took it from their hands and fashioned it with a graving tool[a], and he made it into a cast calf. Then they said, “These are your gods, Israel[d][c][b], who brought you up from the land of Egypt.”
translation:
  language: id
  text: Ia mengambilnya dari tangan mereka, membentuknya dengan alat ukir[a], lalu membuatnya menjadi patung anak sapi tuangan. Kemudian mereka berkata[b], “Ini ilah-ilahmu, hai Israel[c], yang telah membawa engkau keluar dari tanah Mesir.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan alat pahat”, “dengan stilus”, atau “dengan alat penggores”; arti tepat istilah Ibraninya diperdebatkan.
    reason: lexical_alternative
  - marker: b
    text: Beberapa tradisi teks membaca “ia berkata”, bukan “mereka berkata”.
    reason: textual_variant
  - marker: c
    text: Secara harfiah, “Ini ilah-ilahmu.” Terjemahan tradisional sering memakai bentuk tunggal, “Inilah Allahmu” atau “Inilah ilahmu”, kemungkinan karena yang disebut hanya satu patung anak sapi.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקַּח מִיָּדָם
  choice: Ia mengambilnya dari tangan mereka
  rationale: Kata kerja לקח berarti ‘mengambil’ atau ‘menerima’. Akhiran jamak pada מִיָּדָם dipertahankan sebagai ‘tangan mereka’, sedangkan objek ‘-nya’ merujuk pada emas dalam konteks ayat sebelumnya.
- source_word: וַיָּצַר אֹתוֹ בַּחֶרֶט
  choice: membentuknya dengan alat pengukir
  rationale: יצר menyatakan tindakan membentuk secara sengaja, dan חֶרֶט menunjuk pada alat untuk mengukir atau membentuk, walaupun jenis alat yang tepat masih diperdebatkan.
- source_word: וַיַּעֲשֵׂהוּ עֵגֶל מַסֵּכָה
  choice: lalu membuatnya menjadi patung anak sapi tuangan
  rationale: עֵגֶל adalah ‘anak sapi’, sedangkan מַסֵּכָה menunjuk pada benda atau patung logam hasil penuangan. Kata ‘patung’ memperjelas bahwa yang dimaksud ialah sebuah benda berbentuk anak sapi, bukan anak sapi hidup.
- source_word: וַיֹּאמְרוּ
  choice: mereka berkata
  rationale: Teks Masoret memakai bentuk jamak, sehingga pelakunya diterjemahkan ‘mereka’; varian bentuk tunggal dicatat dalam catatan kaki.
- source_word: אֵלֶּה אֱלֹהֶיךָ
  choice: Ini ilah-ilahmu
  rationale: Bentuk sumber memakai penunjuk dan nomina yang secara morfologis jamak. Bahasa Indonesia memakai ‘ini’ baik untuk acuan tunggal maupun jamak, sementara ‘ilah-ilahmu’ mempertahankan bentuk jamaknya dan tidak menyelaraskannya dengan satu patung anak sapi.
- source_word: אֲשֶׁר הֶעֱלוּךָ מֵאֶרֶץ מִצְרָיִם
  choice: yang telah membawa engkau keluar dari tanah Mesir
  rationale: Hifil עלה secara harfiah mengandung gagasan ‘membawa naik’, tetapi dalam rumusan eksodus bahasa Indonesia yang wajar ialah ‘membawa keluar’. Frasa lengkap ‘dari tanah Mesir’ mempertahankan bentuk sumber.
theological_decisions:
- issue: Bentuk jamak atau tunggal dalam seruan tentang patung
  choice: Ini ilah-ilahmu, hai Israel
  alternative: Inilah Allahmu, hai Israel / Inilah ilahmu, hai Israel
  rationale: אֵלֶּה dan אֱלֹהֶיךָ berbentuk jamak dalam Teks Masoret. Terjemahan utama mempertahankan ketegangan antara bentuk jamak tersebut dan satu patung anak sapi, tanpa menyelaraskannya secara teologis atau tradisional.
- issue: Peran Harun dalam pembuatan patung
  choice: Harun tetap menjadi pelaku langsung dari tindakan mengambil, membentuk, dan membuat
  alternative: Menyiratkan bahwa Harun hanya menerima emas atau mengawasi pengerjaannya
  rationale: Rangkaian kata kerja tunggal dalam bahasa Ibrani secara langsung menghubungkan semua tindakan itu dengan subjek yang sama. Terjemahan tidak mengurangi tanggung jawabnya berdasarkan penafsiran terhadap ayat-ayat berikutnya.
- issue: Sebutan אֱלֹהֶיךָ dalam konteks penyembahan berhala
  choice: ilah-ilahmu
  alternative: allah-allahmu atau Allahmu
  rationale: ‘Ilah’ dengan huruf kecil membedakan sebutan bagi objek sembahan dalam ucapan ini dari nama atau sebutan khusus bagi Allah Israel, sambil mempertahankan bentuk jamak sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. ‘Engkau’ dipakai dalam seruan langsung untuk menjaga register Kitab Suci tanpa memakai bentuk yang arkais. Susunan tindakan mengikuti urutan teks Ibrani, sedangkan ‘lalu’ membuat hubungan antarklausa alami dalam bahasa Indonesia.
