  text: וַ/יְהִי֙ מִֽ/מָּחֳרָ֔ת וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל הָ/עָ֔ם אַתֶּ֥ם חֲטָאתֶ֖ם חֲטָאָ֣ה גְדֹלָ֑ה וְ/עַתָּה֙ אֶֽעֱלֶ֣ה אֶל יְהוָ֔ה אוּלַ֥י אֲכַפְּרָ֖ה בְּעַ֥ד חַטַּאתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/032/030.yaml
  text: And it happened on the next day that Moses said to the people[a], “You have sinned a great sin. And now I will go up to Yahweh; perhaps I can make atonement for your sin.”
translation:
  language: id
  text: Keesokan harinya, Musa berkata kepada bangsa itu, “Kalian telah melakukan dosa besar.[a] Dan sekarang aku akan naik menghadap Yahweh. Mungkin aku dapat mengadakan pendamaian atas dosa kalian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Kalian telah berdosa dengan dosa yang besar.” Bahasa Ibrani memakai kata kerja dan kata benda yang seakar untuk menegaskan betapa seriusnya dosa itu.
    reason: Menjelaskan ungkapan seakar dalam teks sumber yang tidak dapat dipertahankan sepenuhnya secara alami dalam bahasa Indonesia.
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: Keesokan harinya
  rationale: Ungkapan naratif ini menandai peristiwa pada hari sesudah kejadian sebelumnya. Bentuk ringkas ini alami dalam bahasa Indonesia modern tanpa kehilangan urutan waktunya.
- source_word: וַיֹּאמֶר מֹשֶׁה אֶל הָעָם
  choice: Musa berkata kepada bangsa itu
  rationale: אמר dengan אֶל merupakan bentuk lazim untuk perkataan yang ditujukan kepada seseorang; 'berkata kepada' adalah padanan langsung dan wajar.
- source_word: אַתֶּם חֲטָאתֶם חֲטָאָה גְדֹלָה
  choice: Kalian telah melakukan dosa besar
  rationale: Pronomina jamak eksplisit אַתֶּם dipertahankan dengan 'kalian'. Ungkapan sumber memakai verba dan nomina sekerabat untuk menegaskan beratnya dosa; bahasa Indonesia yang alami menyampaikan hal itu dengan 'melakukan dosa besar', sementara bentuk Ibraninya dijelaskan dalam catatan kaki.
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Menandai peralihan dari tuduhan kepada tindakan yang hendak dilakukan Musa. Hubungan wacananya tetap jelas tanpa harus menerjemahkan waw secara mekanis.
- source_word: אֶעֱלֶה אֶל יְהוָה
  choice: aku akan naik menghadap Yahweh
  rationale: עלה berarti naik, sesuai gerak Musa menuju hadirat Allah di gunung. 'Menghadap' secara alami mengungkapkan arah kepada Yahweh tanpa menghapus gagasan naik.
- source_word: אוּלַי
  choice: Mungkin
  rationale: Mempertahankan ketidakpastian atau harapan Musa mengenai hasil perantaraannya.
- source_word: אֲכַפְּרָה בְּעַד חַטַּאתְכֶם
  choice: aku dapat mengadakan pendamaian bagi dosa kalian
  rationale: Piel כפר dalam konteks ini menyatakan tindakan mengadakan pendamaian. 'Dapat' bersama 'mungkin' menyampaikan kemungkinan yang diharapkan, bukan jaminan keberhasilan; בְּעַד diterjemahkan 'bagi' untuk menunjukkan tindakan demi kepentingan mereka.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama perjanjian YHWH secara langsung. 'Yahweh' mempertahankan nama pribadi itu alih-alih menggantinya dengan gelar.
- issue: Kekuatan pernyataan Musa mengenai pendamaian
  choice: Mungkin aku dapat mengadakan pendamaian bagi dosa kalian
  alternative: Mungkin aku akan memperoleh pendamaian bagi dosa kalian
  rationale: Bentuk Ibrani menyatakan tindakan yang Musa harap dapat ia lakukan, tetapi אוּלַי mempertahankan ketidakpastian hasilnya. Terjemahan tidak menjadikannya jaminan maupun mengalihkan pelaku tindakan secara pasti.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kalian' dipakai untuk memperjelas orang kedua jamak dalam tuturan langsung; 'bangsa itu' merujuk kepada umat Israel sebagai satu kelompok. Istilah 'pendamaian' mempertahankan bobot kultis-teologis כפר tanpa menambahkan penjelasan doktrinal.
