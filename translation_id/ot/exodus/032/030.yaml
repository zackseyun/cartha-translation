  naturalness: Bahasanya baku dan jelas. “Keesokan harinya,” serta “aku akan naik menghadap Yahweh” alami dalam register naratif-khidmat. “Mengadakan pendamaian atas dosa kalian” merupakan kolokasi yang lebih idiomatis dan tepat daripada “bagi dosa kalian.”
  terminology: “Yahweh” tepat untuk יְהוָה. “Pendamaian” merupakan padanan yang layak untuk כפר dalam konteks ini dan tidak meniadakan ketidakpastian yang ditandai oleh אוּלַי. Catatan kaki dengan tepat menjelaskan penegasan melalui ungkapan seakar.
