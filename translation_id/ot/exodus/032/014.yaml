  yaml_path: translation/ot/exodus/032/014.yaml
  text: And Yahweh relented concerning the harm that he had spoken of doing to his people[a][b].
translation:
  language: id
  text: Lalu Yahweh mengurungkan niat-Nya untuk mendatangkan malapetaka yang telah Ia firmankan atas umat-Nya.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berubah pikiran” atau “menyesal” mengenai malapetaka yang telah Ia firmankan akan didatangkan atas umat-Nya.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “kejahatan/malapetaka”; dalam konteks ini kata itu menunjuk pada bencana atau celaka yang diancamkan, bukan kejahatan moral dalam diri Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּחֶם
  choice: mengurungkan niat-Nya
  rationale: Bentuk Niphal dari נחם di sini menyatakan bahwa Yahweh tidak melaksanakan tindakan penghukuman yang sebelumnya telah Ia nyatakan. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan gambaran naratif tentang perubahan tindakan tanpa menjelaskan ketegangan teologisnya secara berlebihan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai Yahweh, bukan diganti dengan gelar TUHAN.
- source_word: עַל הָרָעָה
  choice: untuk mendatangkan malapetaka
  rationale: Dalam konteks penghukuman ini, רָעָה menunjuk pada bencana atau malapetaka yang diancamkan, bukan kejahatan moral dalam diri Allah. Susunan Indonesia ini menyampaikan hubungan נחם על secara alami.
- source_word: אֲשֶׁר דִּבֶּר
  choice: yang telah Ia firmankan
  rationale: Klausa ini merujuk pada tindakan yang sebelumnya dinyatakan Yahweh. 'Firmankan' sesuai dengan ragam Alkitab Indonesia yang bermartabat dan tetap mudah dipahami.
- source_word: לַעֲשׂוֹת
  choice: mendatangkan
  rationale: Secara harfiah berarti 'melakukan', tetapi bersama objek berupa malapetaka, 'mendatangkan' merupakan padanan Indonesia yang lebih alami tanpa mengubah maksud.
- source_word: לְעַמּוֹ
  choice: atas umat-Nya
  rationale: Preposisi menandai pihak yang akan terkena tindakan tersebut. 'Atas umat-Nya' alami dalam konteks ancaman malapetaka.
theological_decisions:
- issue: Penggambaran antropopatik tentang Allah melalui נחם
  choice: mengurungkan niat-Nya
  alternative: berubah pikiran; menyesal
  rationale: Ayat ini menggambarkan peralihan nyata dari tindakan yang telah diumumkan sebagai tanggapan terhadap perantaraan Musa. Terjemahan mempertahankan ketegangan naratif itu tanpa memasukkan penjelasan doktrinal tentang apakah hakikat atau pengetahuan Allah berubah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang wajar dan bermartabat. 'Umat-Nya' mempertahankan nuansa relasi perjanjian, sedangkan 'mengurungkan niat-Nya' menjaga ketegangan ungkapan Ibrani tanpa membuatnya terdengar seolah-olah Yahweh mengakui kesalahan moral.
