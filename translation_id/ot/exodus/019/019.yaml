  text: And the sound of the trumpet kept growing stronger and stronger[a]; Moses would speak[b], and God would answer him with a voice.
translation:
  language: id
  text: Bunyi sangkakala itu makin lama makin kuat[a]. Musa berbicara, dan Allah menjawabnya dengan suara[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semakin lama semakin keras.” Secara harfiah, bahasa Ibrani memakai ungkapan “terus meningkat dan menjadi sangat kuat.”
    reason: lexical_alternative
  - marker: b
    text: Atau dapat dipahami bahwa Allah menjawabnya melalui guruh atau dengan suara yang terdengar. Bahasa Ibrani berbunyi “dengan suara.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: '[dibawakan melalui perkembangan kalimat]'
  rationale: Bentuk naratif ini memperkenalkan perkembangan adegan. Dalam bahasa Indonesia, terjemahan harfiah “dan terjadilah” akan terasa kaku, sehingga fungsinya dinyatakan secara alami melalui frasa progresif “makin lama makin”.
- source_word: קוֹל הַשּׁוֹפָר
  choice: bunyi sangkakala
  rationale: קוֹל dapat berarti “bunyi” atau “suara”; dengan שׁוֹפָר sebagai pelengkap, “bunyi” paling wajar. “Sangkakala” merupakan istilah Indonesia yang lazim untuk tanduk yang digunakan sebagai alat tiup.
- source_word: הוֹלֵךְ וְחָזֵק מְאֹד
  choice: makin lama makin kuat
  rationale: Gabungan partisip הוֹלֵךְ dan חָזֵק menyatakan peningkatan yang terus berlangsung. “Makin lama makin kuat” mempertahankan gambaran Ibrani tentang bertambahnya kekuatan tanpa membatasinya hanya pada volume.
- source_word: מֹשֶׁה יְדַבֵּר
  choice: Musa berbicara
  rationale: Bentuk imperfek dapat menggambarkan tindakan yang sedang berlangsung atau berulang dalam adegan itu. Bahasa Indonesia tidak perlu menandai aspek tersebut secara eksplisit, sehingga “berbicara” mempertahankan keluwesannya tanpa memaksakan satu penafsiran.
- source_word: וְהָאֱלֹהִים
  choice: dan Allah
  rationale: Bentuk ini merujuk secara definit kepada Allah. Dalam bahasa Indonesia, nama “Allah” tidak memerlukan kata sandang.
- source_word: יַעֲנֶנּוּ
  choice: menjawabnya
  rationale: Kata kerja ענה dengan akhiran pronominal berarti “menjawab dia”. Bentuk Indonesia ini tetap memungkinkan tindakan dipahami sebagai berlangsung atau berulang sesuai konteks.
- source_word: בְּקוֹל
  choice: dengan suara
  rationale: Frasa ini secara langsung berarti “dengan/dalam suara”. Terjemahan “dengan suara” mempertahankan keluasan maknanya dan tidak langsung menafsirkannya sebagai guruh.
theological_decisions:
- issue: Sifat jawaban Allah di Sinai
  choice: Allah menjawab Musa “dengan suara”
  alternative: Allah menjawabnya dengan guruh; Allah menjawabnya sehingga terdengar
  rationale: בְּקוֹל cukup luas untuk menunjuk pada suara atau bunyi yang dapat dipahami secara fenomenologis sebagai guruh, tetapi ayat ini sendiri tidak menyebut guruh. Teks utama mempertahankan ungkapan “dengan suara”, sedangkan kemungkinan lain dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. “Sangkakala” dipertahankan karena dikenal luas dalam konteks Alkitab dan tetap mudah dipahami. Struktur kalimat tidak menambahkan hubungan “setiap kali” agar aspek tindakan Musa dan jawaban Allah tetap terbuka sebagaimana dalam bahasa Ibrani.
