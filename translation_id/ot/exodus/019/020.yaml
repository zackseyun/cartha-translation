base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/020.yaml
  text: And Yahweh came down on Mount Sinai[a], to the top of the mountain. Then Yahweh called Moses to the top of the mountain[b], and Moses went up.
translation:
  language: id
  text: Lalu Yahweh turun di atas Gunung Sinai, ke puncak gunung itu. Kemudian Yahweh memanggil Musa ke puncak gunung itu, dan Musa pun naik.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: turun
  rationale: Kata kerja ירד berarti bergerak turun. Bentuk sederhana “turun” alami dalam narasi Indonesia dan mempertahankan arah gerak tanpa menambahkan sudut pandang yang tidak dinyatakan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh,” sehingga nama pribadi dalam teks Ibrani dipertahankan dan tidak diganti dengan gelar.
- source_word: עַל הַר סִינַי
  choice: ke atas Gunung Sinai
  rationale: Preposisi עַל di sini menyatakan tempat tujuan turunnya Yahweh, yakni pada/di atas Gunung Sinai. “Ke atas” mempertahankan hubungan spasial dan selaras dengan frasa berikutnya, “ke puncak gunung itu.”
- source_word: אֶל רֹאשׁ הָהָר
  choice: ke puncak gunung itu
  rationale: רֹאשׁ secara harfiah berarti “kepala,” tetapi dalam konteks gunung secara idiomatis berarti bagian teratas atau puncak. “Puncak” ringkas, jelas, dan wajar dalam bahasa Indonesia.
- source_word: וַיִּקְרָא
  choice: memanggil
  rationale: Dalam konteks ini קרא berarti memanggil seseorang. “Memanggil” lebih langsung daripada “menyuruh datang,” yang akan menambahkan unsur penafsiran.
- source_word: לְמֹשֶׁה
  choice: Musa
  rationale: Nama pribadi מֹשֶׁה diterjemahkan menurut bentuk baku bahasa Indonesia, “Musa.”
- source_word: וַיַּעַל
  choice: naik
  rationale: Kata kerja עלה berarti bergerak naik. “Naik” alami dalam narasi Indonesia dan membentuk kontras yang jelas dengan “turun” pada awal ayat.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama יהוה secara langsung. “Yahweh” mempertahankan nama ilahi itu, sedangkan “TUHAN” menggantinya dengan gelar dan “Yehova” mencerminkan bentuk pelafalan tradisional yang berbeda.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Partikel “pun” menandai respons Musa secara alami tanpa menambah isi semantis yang berarti. Pengulangan “puncak gunung itu” dipertahankan karena terdapat dua kali dalam teks Ibrani dan membantu menjaga struktur naratif ayat.
