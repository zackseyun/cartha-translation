  text: וַ/יִּסְע֣וּ מֵ/רְפִידִ֗ים וַ/יָּבֹ֨אוּ֙ מִדְבַּ֣ר סִינַ֔י וַֽ/יַּחֲנ֖וּ בַּ/מִּדְבָּ֑ר וַ/יִּֽחַן שָׁ֥ם יִשְׂרָאֵ֖ל נֶ֥גֶד הָ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/002.yaml
  text: They set out from Rephidim and came to the wilderness of Sinai[a], and they camped in the wilderness. There Israel camped before the mountain.
translation:
  language: id
  text: Mereka berangkat dari Refidim lalu tiba di padang gurun Sinai dan berkemah di padang gurun itu. Di sana Israel berkemah di depan gunung itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: berhadapan dengan gunung itu.'
    reason: Preposisi Ibrani נֶגֶד dapat menyatakan posisi di depan atau berhadapan dengan sesuatu.
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: Mereka berangkat
  rationale: Dalam kisah perjalanan, נסע berarti membongkar perkemahan lalu bergerak melanjutkan perjalanan. “Berangkat” menyampaikan gerak narasi ini secara alami dalam bahasa Indonesia modern.
- source_word: מֵרְפִידִים
  choice: dari Refidim
  rationale: Nama tempat ditransliterasikan sebagai “Refidim”, sedangkan prefiks מ־ diterjemahkan “dari”.
- source_word: וַיָּבֹאוּ
  choice: lalu tiba
  rationale: בוא dapat berarti datang, masuk, atau tiba. Dalam rangkaian perjalanan menuju suatu tempat, “tiba” paling alami; “lalu” menyampaikan kelanjutan narasi.
- source_word: מִדְבַּר סִינַי
  choice: padang gurun Sinai
  rationale: מִדְבָּר menunjuk wilayah liar atau tandus yang tidak dihuni secara menetap. “Padang gurun” merupakan padanan Indonesia yang lazim dan mudah dipahami, tanpa mengharuskan gambaran gurun pasir.
- source_word: וַיַּחֲנוּ
  choice: dan berkemah
  rationale: חנה berarti mendirikan atau menempati perkemahan. “Berkemah” adalah ungkapan modern yang lugas.
- source_word: בַּמִּדְבָּר
  choice: di padang gurun itu
  rationale: Pengulangan מִדְבָּר dipertahankan. Unsur definit pada bentuk Ibrani disampaikan secara alami dengan “itu”, karena merujuk kembali kepada padang gurun Sinai.
- source_word: וַיִּחַן שָׁם
  choice: Di sana Israel berkemah
  rationale: Penempatan “Di sana” di awal kalimat mempertahankan penekanan lokasi. Bentuk verba Ibrani tunggal sesuai dengan Israel sebagai satu umat secara kolektif; bahasa Indonesia dapat menyatakannya secara alami tanpa penandaan jumlah pada verba.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Dalam konteks ini nama tersebut menunjuk bangsa Israel secara kolektif, bukan Yakub sebagai individu.
- source_word: נֶגֶד הָהָר
  choice: di depan gunung itu
  rationale: נֶגֶד menyatakan posisi di hadapan, di depan, atau berhadapan dengan sesuatu. “Di depan gunung itu” mempertahankan hubungan ruang tersebut tanpa menetapkan orientasi yang terlalu khusus.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Pengulangan “padang gurun” dipertahankan karena terdapat dalam teks Ibrani, sementara penghubung “lalu” membuat urutan perjalanan alami bagi pembaca Indonesia.
