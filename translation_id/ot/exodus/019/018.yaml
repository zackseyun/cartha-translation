  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הַ֤ר סִינַי֙ עָשַׁ֣ן כֻּלּ֔/וֹ מִ֠/פְּנֵי אֲשֶׁ֨ר יָרַ֥ד עָלָ֛י/ו יְהוָ֖ה בָּ/אֵ֑שׁ וַ/יַּ֤עַל עֲשָׁנ/וֹ֙ כְּ/עֶ֣שֶׁן הַ/כִּבְשָׁ֔ן וַ/יֶּחֱרַ֥ד כָּל הָ/הָ֖ר מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/018.yaml
  text: Mount Sinai was all in smoke because Yahweh had descended on it in fire[a], and its smoke went up like the smoke of a furnace, and the whole mountain trembled greatly.
translation:
  language: id
  text: Seluruh Gunung Sinai diselimuti asap karena Yahweh telah turun ke atas Gunung itu dalam api, dan asapnya membubung seperti asap dari tanur[a]. Seluruh gunung itu pun bergetar hebat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “seperti asap dari tungku.”'
    reason: כִּבְשָׁן menunjuk tanur atau tungku, yakni struktur untuk pembakaran.
lexical_decisions:
- source_word: וְהַר סִינַי עָשַׁן כֻּלּוֹ
  choice: Seluruh Gunung Sinai diselimuti asap
  rationale: Ungkapan ini menyatakan bahwa segenap gunung berada dalam keadaan penuh atau tertutup asap. 'Diselimuti asap' alami dalam bahasa Indonesia dan mempertahankan gambaran statifnya.
- source_word: מִפְּנֵי אֲשֶׁר
  choice: karena
  rationale: Idiom ini memperkenalkan sebab dari keadaan gunung tersebut.
- source_word: יָרַד עָלָיו יְהוָה בָּאֵשׁ
  choice: Yahweh telah turun ke atasnya dalam api
  rationale: '''Telah turun'' menunjukkan tindakan yang mendasari keadaan berasap; ''dalam api'' mempertahankan cara atau lingkup penampakan tanpa menafsirkan api sebagai hakikat Yahweh.'
- source_word: וַיַּעַל עֲשָׁנוֹ
  choice: dan asapnya membubung
  rationale: Akhiran pronominal paling wajar merujuk kepada gunung; 'membubung' menyampaikan gerak asap ke atas secara alami.
- source_word: כְּעֶשֶׁן הַכִּבְשָׁן
  choice: seperti asap dari tempat pembakaran
  rationale: כִּבְשָׁן dapat menunjuk tungku besar atau tempat pembakaran seperti tanur; pilihan umum ini menjaga gambaran tanpa membatasi jenis fasilitasnya.
- source_word: וַיֶּחֱרַד כָּל הָהָר מְאֹד
  choice: Seluruh gunung itu pun bergetar hebat
  rationale: חרד di sini menggambarkan guncangan fisik yang kuat. 'Bergetar hebat' mempertahankan intensitas מְאֹד tanpa menambahkan penyebab emosional.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama ilahi secara langsung. 'Yahweh' mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan gelar.
- issue: Hubungan Yahweh dengan api
  choice: turun ... dalam api
  alternative: turun ... sebagai api; turun ... dengan api
  rationale: Preposisi בְּ memungkinkan nuansa lingkup atau cara. 'Dalam api' menjaga rumusan sumber dan tidak menyamakan Yahweh secara ontologis dengan api.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dibagi dua agar mudah dipahami tanpa menghilangkan rangkaian peristiwa Ibrani. Penanda [a] ditempatkan tepat sesudah frasa yang memiliki alternatif leksikal.
