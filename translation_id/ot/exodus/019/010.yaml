  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל מֹשֶׁה֙ לֵ֣ךְ אֶל הָ/עָ֔ם וְ/קִדַּשְׁתָּ֥/ם הַ/יּ֖וֹם וּ/מָחָ֑ר וְ/כִבְּס֖וּ שִׂמְלֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/010.yaml
  text: Then Yahweh said to Moses[a], “Go to the people and consecrate them today and tomorrow, and let them wash their garments.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa, “Pergilah kepada umat itu dan kuduskanlah mereka[a] pada hari ini dan besok, dan hendaklah mereka mencuci pakaian mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “khususkanlah mereka sebagai orang kudus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi Tetragramaton sebagai nama pribadi, bukan menggantinya dengan gelar.
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Waw konsekutif melanjutkan urutan narasi; “berfirman” merupakan ungkapan Indonesia yang wajar dan bermartabat untuk perkataan Allah.
- source_word: לֵךְ אֶל הָעָם
  choice: Pergilah kepada umat itu
  rationale: Imperatif לֵךְ diterjemahkan langsung; dalam konteks Sinai, הָעָם menunjuk kepada komunitas Israel, sehingga “umat” lebih sesuai daripada “bangsa” dan “itu” merepresentasikan artikelnya.
- source_word: וְקִדַּשְׁתָּם
  choice: kuduskanlah mereka
  rationale: Bentuk piel dari קדשׁ menyatakan tindakan mempersiapkan atau mengkhususkan umat sebagai kudus untuk berjumpa dengan Allah. Pilihan ini mempertahankan bahasa kekudusan sumber, sementara nuansa ritual dijelaskan dalam catatan kaki.
- source_word: הַיּוֹם וּמָחָר
  choice: hari ini dan besok
  rationale: Padanan alami dan tepat bagi jangka persiapan dua hari yang disebutkan.
- source_word: וְכִבְּסוּ
  choice: lalu suruhlah mereka mencuci
  rationale: Bentuk jamak ini mengacu kepada umat, tetapi berada dalam rangkaian perintah yang ditujukan kepada Musa. Ungkapan kausatif-permisif ini menyampaikan bahwa Musa harus memastikan mereka mencuci pakaian.
- source_word: שִׂמְלֹתָם
  choice: pakaian mereka
  rationale: שִׂמְלָה merujuk pada pakaian atau kain luar; “pakaian” jelas, alami, dan tidak membatasi maknanya pada jenis pakaian tertentu.
theological_decisions:
- issue: Bahasa persiapan ritual קדשׁ
  choice: kuduskanlah mereka
  alternative: persiapkanlah mereka sebagai umat yang kudus; tahirkanlah mereka
  rationale: Ayat ini berbicara tentang persiapan umat untuk perjumpaan ilahi di Sinai. “Kuduskanlah” mempertahankan akar konsep kekudusan tanpa membatasinya pada perubahan moral batin atau sekadar pentahiran ritual.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian secara langsung; “Yahweh” mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan gelar.
- issue: Hubungan וְכִבְּסוּ dengan perintah kepada Musa
  choice: suruhlah mereka mencuci
  alternative: biarlah mereka mencuci; dan mereka harus mencuci
  rationale: Pilihan ini memperjelas bahwa umatlah yang mencuci pakaian mereka dalam pelaksanaan instruksi yang diberikan kepada Musa, tanpa menyatakan bahwa Musa sendiri melakukannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Umat” cocok dengan konteks komunitas perjanjian, sedangkan “pakaian” lebih alami bagi pembaca umum daripada “jubah” atau “pakaian luar.” Penanda catatan kaki ditempatkan langsung setelah frasa yang dijelaskannya.
