  text: וַ/יֹּ֨אמֶר֙ אֶל הָ/עָ֔ם הֱי֥וּ נְכֹנִ֖ים לִ/שְׁלֹ֣שֶׁת יָמִ֑ים אַֽל תִּגְּשׁ֖וּ אֶל אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/015.yaml
  text: And he said to the people[a], “Be ready for three days; do not go near a woman.”
translation:
  language: id
  text: Lalu ia berkata kepada bangsa itu, “Bersiaplah selama tiga hari. Janganlah mendekati perempuan[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “janganlah mendekati perempuan”; dalam konteks ini, ungkapan tersebut merupakan eufemisme untuk tidak melakukan hubungan seksual selama masa persiapan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ia berkata
  rationale: Bentuk wayyiqtol dari אמר melanjutkan alur narasi dan memperkenalkan perkataan Musa; “lalu” menyampaikan urutan naratif secara alami.
- source_word: אֶל הָעָם
  choice: kepada bangsa itu
  rationale: עָם menunjuk kepada umat Israel yang sedang berkumpul sebagai satu kesatuan; “bangsa itu” wajar dalam konteks ini dan mempertahankan penunjukan definit.
- source_word: הֱיוּ נְכֹנִים
  choice: Bersiaplah
  rationale: Gabungan imperatif היה dengan נָכוֹן merupakan seruan agar mereka siap; “bersiaplah” ringkas, alami, dan sesuai dengan konteks persiapan menjelang penampakan ilahi.
- source_word: לִשְׁלֹשֶׁת יָמִים
  choice: selama tiga hari
  rationale: Frasa ini secara paling langsung menyatakan rentang persiapan tiga hari. Terjemahan ini mempertahankan konstruksi Ibrani tanpa mengubahnya menjadi “untuk hari ketiga,” meskipun konteks ayat 11 berkaitan dengan hari ketiga.
- source_word: אַל תִּגְּשׁוּ
  choice: Janganlah mendekati
  rationale: אַל dengan bentuk verba berikutnya menyatakan larangan, sedangkan נגשׁ berarti mendekat. Bentuk “janganlah mendekati” bermartabat dan tetap mudah dipahami.
- source_word: אֶל אִשָּׁה
  choice: perempuan
  rationale: Secara harfiah frasa ini berarti “kepada perempuan.” Dalam konteksnya ungkapan tersebut merupakan eufemisme bagi hubungan seksual, tetapi teks utama mempertahankan ungkapan sumber dan catatan kaki menjelaskan maksud idiomatisnya.
theological_decisions:
- issue: Apakah larangan mengenai hubungan seksual selama masa persiapan perlu dinyatakan secara eksplisit dalam teks utama
  choice: 'Mempertahankan eufemisme Ibrani: “Janganlah mendekati perempuan”'
  alternative: “Janganlah berhubungan seksual dengan perempuan” atau “Janganlah menghampiri istri kalian”
  rationale: Teks Ibrani memakai ungkapan eufemistis, bukan verba seksual yang eksplisit. Mempertahankannya menjaga bentuk dan ketegangan bahasa sumber, sementara catatan kaki memberi kejelasan tanpa memasukkan penafsiran langsung ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat namun mudah dipahami. Bentuk “janganlah” dipilih untuk larangan langsung, dan eufemisme sumber dipertahankan dalam teks utama dengan penjelasan pada catatan kaki.
