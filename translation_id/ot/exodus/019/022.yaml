    reason: lexical_alternative
  - marker: b
    text: Atau “Yahweh menerobos terhadap mereka.” Ungkapan Ibrani ini menggambarkan tindakan Yahweh yang mendadak dalam penghakiman.
    reason: lexical_alternative
  revision_rationale: Revisi terbatas pada padanan יִפְרֹץ בָּהֶם dan catatan kaki. “Menyerang mereka” lebih wajar dalam bahasa Indonesia modern dan sesuai dengan konteks peringatan penghakiman, sedangkan catatan b mempertahankan citra harfiah ‘menerobos’ serta sifat mendadak tanpa melebihkan teks. Catatan a diperbaiki agar menyediakan alternatif yang sungguh berbeda.
