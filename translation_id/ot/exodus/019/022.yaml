revisions:
- from: Bahkan para imam yang mendekat kepada Yahweh[a] harus menguduskan diri, jangan sampai Yahweh menerjang mereka[b].
  to: Bahkan para imam yang mendekat kepada Yahweh[a] harus menguduskan diri, jangan sampai Yahweh menyerang mereka[b].
  rationale: Revisi terbatas pada padanan יִפְרֹץ בָּהֶם dan catatan kaki. “Menyerang mereka” lebih wajar dalam bahasa Indonesia modern dan sesuai dengan konteks peringatan penghakiman, sedangkan catatan b mempertahankan citra harfiah ‘menerobos’ serta sifat mendadak tanpa melebihkan teks. Catatan a diperbaiki agar menyediakan alternatif yang sungguh berbeda.
