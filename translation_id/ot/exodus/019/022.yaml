review_pass:
  verdict: revise
  source_fidelity: Teks pokok sudah menangkap penekanan tambahan (וְגַם), para imam yang menghampiri Yahweh, tuntutan refleksif untuk menguduskan diri, dan peringatan mengenai tindakan Yahweh yang mendadak terhadap mereka. Namun, “menerjang mereka” cenderung menggambarkan serangan fisik langsung dan kurang tepat bagi פָּרַץ בְּ, yang dalam konteks ini menyatakan Yahweh ‘menerobos/menyerang’ mereka dalam penghakiman.
  naturalness: Kalimatnya alami dan baku. “Menyerang mereka” lebih lazim dan jelas daripada “menerjang mereka,” sambil tetap mempertahankan daya peringatan tanpa menentukan bentuk penghukuman.
  terminology: “Yahweh,” “para imam,” dan “menguduskan diri” tepat untuk register serta istilah kultis ayat ini. Catatan a tidak seharusnya menyajikan “yang menghampiri Yahweh” sebagai alternatif karena itu pada dasarnya sama dengan teks utama; alternatif yang nyata ialah “yang datang mendekat kepada Yahweh.” Catatan b perlu menyebut kemungkinan ‘menerobos/menyerang’ dan tidak menambahkan kata “dahsyat,” yang tidak tersurat.
  issues:
  - severity: medium
    issue: Pilihan “menerjang mereka” untuk יִפְרֹץ בָּהֶם.
    rationale: Verba פָּרַץ menyiratkan tindakan menerobos atau meledak keluar; dalam konteks Sinai, ini merupakan tindakan penghukuman yang merugikan mereka. “Menyerang mereka” menyampaikan akibat itu secara lebih idiomatis tanpa membatasi gambaran pada serangan fisik.
  - severity: low
    issue: Catatan a bukan alternatif leksikal yang substantif.
    rationale: “Yang menghampiri Yahweh” hampir identik dengan “yang mendekat kepada Yahweh.” Catatan sebaiknya memberi alternatif yang benar-benar berbeda secara ungkapan, seperti “yang datang mendekat kepada Yahweh.”
  - severity: low
    issue: Catatan b menambahkan intensitas “dahsyat.”
    rationale: Teks memang memberi gambaran tindakan mendadak, tetapi tidak secara eksplisit menyatakan tingkat kedahsyatannya. Catatan perlu mempertahankan gambaran tanpa penambahan.
  revised_text: Bahkan para imam yang mendekat kepada Yahweh[a] harus menguduskan diri, jangan sampai Yahweh menyerang mereka[b].
