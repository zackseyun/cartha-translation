id: EXO.19.22
reference: Exodus 19:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/גַ֧ם הַ/כֹּהֲנִ֛ים הַ/נִּגָּשִׁ֥ים אֶל יְהוָ֖ה יִתְקַדָּ֑שׁוּ פֶּן יִפְרֹ֥ץ בָּ/הֶ֖ם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/022.yaml
  text: And even the priests who come near to Yahweh must consecrate themselves[b][a], lest Yahweh break out against them.
translation:
  language: id
  text: Bahkan para imam yang mendekat kepada Yahweh[a] harus menguduskan diri, jangan sampai Yahweh menyerang mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang datang mendekat kepada Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Atau “Yahweh menerobos terhadap mereka.” Ungkapan Ibrani ini menggambarkan tindakan Yahweh yang mendadak dalam penghakiman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Bahkan
  rationale: Menyampaikan hubungan tambahan sekaligus penekanan bahwa para imam pun termasuk dalam peringatan ini.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Padanan baku dalam konteks ibadah; bentuk jamak dan kelompok yang dimaksud tersampaikan secara alami dalam bahasa Indonesia.
- source_word: הַנִּגָּשִׁים אֶל יְהוָה
  choice: yang mendekat kepada Yahweh
  rationale: Partisipel נגשׁ menunjuk pada tindakan menghampiri atau memperoleh akses, khususnya dalam pelayanan ibadah; pilihan ini mempertahankan nuansa mendekati hadirat Allah.
- source_word: יִתְקַדָּשׁוּ
  choice: harus menguduskan diri
  rationale: Bentuk refleksif Hitpael menunjukkan bahwa para imam harus mempersiapkan atau memisahkan diri sebagai kudus; 'menguduskan diri' alami dan tepat dalam konteks ritual.
- source_word: פֶּן
  choice: jangan sampai
  rationale: Mengungkapkan peringatan mengenai akibat yang harus dihindari secara jelas dan wajar dalam bahasa Indonesia modern.
- source_word: יִפְרֹץ בָּהֶם
  choice: menerjang mereka
  rationale: Mempertahankan gambaran tindakan mendadak dan dahsyat terhadap mereka tanpa menentukan bentuk hukuman yang tidak disebutkan teks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi dan mempertahankan penyebutannya yang diulang secara eksplisit dalam ayat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani menyebut Tetragramaton secara langsung; 'Yahweh' mempertahankan nama ilahi, termasuk pengulangannya pada akhir ayat.
- issue: Sifat peringatan dalam יִפְרֹץ בָּהֶם יְהוָה
  choice: peringatan bahwa Yahweh dapat menerjang mereka dalam penghakiman yang mendadak
  alternative: Yahweh menerobos menuju mereka
  rationale: Konteks batas-batas di Sinai dan konstruksi dengan בָּהֶם mendukung tindakan yang merugikan atau melawan mereka, tetapi terjemahan tidak menambahkan cara penghukuman tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mempertahankan penekanan pada para imam serta pengulangan nama Yahweh. Ungkapan 'jangan sampai' dipilih sebagai peringatan yang alami, sedangkan 'menerjang' menjaga daya gambar verba Ibrani tanpa mempersempit bentuk penghakiman.
