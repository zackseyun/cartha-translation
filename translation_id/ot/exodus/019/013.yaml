base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/013.yaml
  text: No hand shall touch him[a], for he must surely be stoned or surely shot; whether beast or man, he shall not live. When the ram’s horn sounds a long blast[c][b], they may go up on the mountain.
translation:
  language: id
  text: Tidak satu tangan pun boleh menyentuhnya, sebab ia harus dirajam dengan batu atau dipanah[a]. Baik binatang maupun manusia, tidak boleh dibiarkan hidup. Ketika tanduk domba jantan dibunyikan panjang[b], mereka boleh naik ke gunung itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ditikam hingga tembus.” Kata kerja Ibrani dapat berarti “ditembak,” kemungkinan besar dengan anak panah dalam konteks ini.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “ketika yobel ditarik panjang”; ini kemungkinan menunjuk pada bunyi panjang tanduk domba jantan.'
    reason: cultural_note
lexical_decisions:
- source_word: תִגַּע בּוֹ יָד
  choice: Jangan ada tangan yang menyentuh dia
  rationale: Mempertahankan gaya hukum impersonal dan sufiks maskulin tunggal yang paling wajar menunjuk kepada pelanggar, yaitu orang atau binatang yang melintasi batas.
- source_word: סָקוֹל יִסָּקֵל
  choice: harus dilempari batu sampai mati
  rationale: Gabungan infinitif absolut dan verba finit menegaskan kepastian serta keharusan hukuman; 'sampai mati' memperjelas hasil tindakan dalam bahasa Indonesia alami.
- source_word: יָרֹה יִיָּרֶה
  choice: dipanah
  rationale: Dalam konteks penghukuman dari jarak jauh, verba ירה paling mungkin berarti ditembak dengan anak panah; bentuk pasif menjaga kesejajaran dengan hukuman sebelumnya.
- source_word: אִם בְּהֵמָה אִם אִישׁ
  choice: Baik binatang maupun manusia
  rationale: Konstruksi ini mencakup kedua kategori tanpa pengecualian dan terdengar alami dalam bahasa Indonesia modern.
- source_word: לֹא יִחְיֶה
  choice: ia tidak boleh tetap hidup
  rationale: Menyampaikan daya hukum dari pernyataan Ibrani dan mempertahankan bentuk tunggal yang merujuk secara generik kepada binatang atau manusia tadi.
- source_word: בִּמְשֹׁךְ הַיֹּבֵל
  choice: Ketika sangkakala tanduk domba jantan dibunyikan panjang
  rationale: יוֹבֵל di sini menunjuk kepada tanduk domba jantan atau bunyinya, sedangkan משׁך menyatakan bunyi yang dipanjangkan.
- source_word: הֵמָּה יַעֲלוּ בָהָר
  choice: barulah mereka boleh naik ke gunung itu
  rationale: Konteks menunjukkan bahwa larangan sebelumnya berakhir setelah tanda bunyi panjang; 'boleh' menyatakan izin yang tersirat, dan 'barulah' menandai urutan waktunya.
theological_decisions:
- issue: Rujukan sufiks maskulin tunggal pada בּוֹ
  choice: Dipahami sebagai pelanggar yang menyentuh atau melewati batas gunung.
  alternative: Dipahami secara lebih umum sebagai apa pun yang menjadi terlarang karena bersentuhan dengan gunung.
  rationale: Konteks langsung membicarakan manusia atau binatang yang melanggar batas dan harus dihukum tanpa disentuh langsung; rujukan personal paling sesuai dengan alur hukum ayat.
- issue: Sifat tindakan הֵמָּה יַעֲלוּ
  choice: Dipahami sebagai izin untuk naik setelah bunyi panjang.
  alternative: 'Dipahami sebagai pernyataan masa depan atau perintah: ''mereka akan/harus naik.'''
  rationale: Dalam konteks pembatasan akses, waktu bunyi panjang paling wajar menandai pencabutan larangan, tetapi bentuk Ibrani sendiri adalah imperfek sehingga nuansa alternatif tetap mungkin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Diksi hukum dibuat tegas namun tetap mudah dipahami. Istilah 'sangkakala tanduk domba jantan' mempertahankan unsur budaya sumber sambil menjelaskan bendanya; ambiguitas penting dicatat dalam catatan kaki.
