base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/012.yaml
  text: And you shall set bounds for the people all around[a], saying, ‘Be careful not to go up on the mountain or touch its edge. Whoever touches the mountain shall surely be put to death.’
translation:
  language: id
  text: Tetapkanlah batas di sekeliling bangsa itu dan katakan, “Berhati-hatilah agar kalian tidak naik ke gunung itu atau menyentuh tepinya. Siapa pun yang menyentuh gunung itu pasti dihukum mati.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pasti mati.” Ungkapan Ibrani ini menegaskan kepastian kematian. Terjemahan “pasti dihukum mati” mempertahankan bentuk pasif dan sesuai dengan ayat berikutnya, yang menyebut pelaksanaan hukuman oleh pihak lain.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִגְבַּלְתָּ
  choice: Buatlah batas
  rationale: Bentuk Hifil dari גבל menyatakan tindakan menetapkan atau menandai batas; frasa ini alami dalam bahasa Indonesia dan mempertahankan gambaran kawasan terlarang.
- source_word: אֶת־הָעָם סָבִיב
  choice: di sekeliling bangsa itu
  rationale: סָבִיב menunjukkan batas yang mengelilingi komunitas Israel; 'bangsa itu' merujuk pada Israel sebagai kelompok yang sedang berkumpul.
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: Berhati-hatilah
  rationale: Ungkapan idiomatis ini merupakan peringatan tegas agar mereka menjaga diri; 'berhati-hatilah' wajar dan jelas dalam bahasa Indonesia modern.
- source_word: עֲלוֹת בָּהָר
  choice: naik ke gunung itu
  rationale: עלה dengan בְּ menunjuk pada naik memasuki atau menuju kawasan gunung; 'naik ke gunung itu' alami dan tidak terlalu teknis.
- source_word: וּנְגֹעַ בְּקָצֵהוּ
  choice: atau menyentuh kakinya
  rationale: קָצֶה berarti ujung atau bagian terluar. Dalam konteks gunung, 'kakinya' secara alami menunjuk bagian paling bawah/tepi gunung yang tidak boleh disentuh, sambil mempertahankan maksud spasialnya.
- source_word: כָּל־הַנֹּגֵעַ בָּהָר
  choice: Siapa pun yang menyentuh gunung itu
  rationale: Konstruksi ini bersifat umum dan distributif; 'siapa pun' menyampaikan cakupan universal secara alami.
- source_word: מוֹת יוּמָת
  choice: pasti dihukum mati
  rationale: Infinitif absolut מוֹת menegaskan bentuk pasif יוּמָת. 'Pasti' menyampaikan penegasan, sedangkan 'dihukum mati' mempertahankan bentuk pasif dan selaras dengan pelaksanaan hukuman oleh pihak lain dalam ayat berikutnya.
theological_decisions:
- issue: Apakah מוֹת יוּמָת berarti kematian yang pasti atau eksekusi oleh pihak lain
  choice: pasti dihukum mati
  alternative: pasti mati
  rationale: Bentuk verbalnya pasif dan ayat berikut menjelaskan pelaksanaan hukuman oleh orang lain. Namun, alternatif yang lebih umum tetap dicatat karena formula Ibrani ini dapat secara idiomatis menekankan kepastian kematian.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan jamak 'kalian' memperjelas bahwa peringatan ditujukan kepada seluruh bangsa. Istilah 'dihukum mati' dipilih alih-alih 'dibunuh' untuk menyampaikan sanksi resmi dalam konteks ini.
