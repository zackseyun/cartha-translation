base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/016.yaml
  text: And it happened on the third day[a], when morning came, that there were thunders and lightnings, and a heavy cloud on the mountain, and the sound of a trumpet, very loud[c][b]; and all the people who were in the camp trembled.
translation:
  language: id
  text: Pada hari ketiga, ketika pagi tiba, terdengarlah bunyi guruh[a] dan tampak kilat; ada awan tebal di atas gunung itu, dan bunyi sangkakala[b] terdengar sangat nyaring[c]. Semua orang yang berada di perkemahan gemetar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bunyi-bunyi” atau “suara-suara.” Kata Ibrani ini dapat berarti bunyi atau suara, tetapi karena disebut bersama kilat, dalam konteks ini kemungkinan besar yang dimaksud adalah bunyi guruh.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “bunyi tanduk.” Sangkakala di sini menerjemahkan syofar, yaitu terompet tanduk, yang secara tradisional dibuat dari tanduk hewan.'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “sangat kuat”; dalam konteks ini ungkapan tersebut menerangkan kuatnya bunyi sangkakala.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַיּוֹם הַשְּׁלִישִׁי
  choice: Pada hari ketiga
  rationale: Wayyiqtol וַיְהִי membuka peristiwa baru, tetapi dalam bahasa Indonesia fungsi naratifnya lebih alami disampaikan langsung melalui keterangan waktu daripada dengan ungkapan kaku seperti 'terjadilah'.
- source_word: בִּהְיֹת הַבֹּקֶר
  choice: ketika pagi tiba
  rationale: Konstruksi infinitif ini bersifat temporal; pilihan tersebut alami dalam bahasa Indonesia dan mempertahankan gambaran datangnya pagi.
- source_word: קֹלֹת
  choice: bunyi guruh
  rationale: Bentuk jamak קוֹל dapat berarti bunyi atau suara. Dalam pasangan dengan kilat pada konteks teofani Sinai, bunyi guruh merupakan makna kontekstual yang paling mungkin; keluasan maknanya dicatat dalam catatan kaki.
- source_word: בְרָקִים
  choice: kilat
  rationale: Kata ini menunjuk pada kilatan-kilatan petir. Nomina kolektif 'kilat' terdengar alami dalam bahasa Indonesia tanpa menghilangkan kemajemukan fenomenanya.
- source_word: עָנָן כָּבֵד
  choice: awan tebal
  rationale: כָּבֵד secara harfiah berarti berat, tetapi ketika menerangkan awan, 'tebal' menyampaikan kepadatan yang dimaksud secara alami.
- source_word: עַל הָהָר
  choice: meliputi gunung itu
  rationale: Preposisi עַל dapat berarti di atas, pada, atau meliputi. Dalam konteks awan, 'meliputi' menghasilkan gambaran yang jelas tanpa menentukan secara sempit apakah awan tepat berada pada atau di atas gunung.
- source_word: קֹל שֹׁפָר
  choice: bunyi sangkakala
  rationale: Frasa ini menekankan bunyi שׁוֹפָר. 'Sangkakala' merupakan padanan Indonesia yang bermartabat dan dikenal, sedangkan sifat alat sebagai terompet tanduk dijelaskan dalam catatan kaki.
- source_word: חָזָק מְאֹד
  choice: terdengar sangat nyaring
  rationale: Secara harfiah berarti 'sangat kuat'; ketika menerangkan bunyi, 'sangat nyaring' menyampaikan intensitas akustiknya secara wajar.
- source_word: וַיֶּחֱרַד
  choice: pun gemetar
  rationale: Verba ini menggambarkan kegentaran fisik yang berkaitan dengan rasa takut atau guncangan. 'Gemetar' mempertahankan kedua kemungkinan itu tanpa menambahkan penafsiran.
- source_word: כָּל הָעָם אֲשֶׁר בַּמַּחֲנֶה
  choice: Seluruh bangsa yang berada di perkemahan
  rationale: Mempertahankan cakupan כָּל dan klausa relatif eksplisit dalam bahasa Indonesia yang alami. 'Bangsa' sesuai untuk עָם sebagai komunitas Israel dalam konteks ini.
theological_decisions:
- issue: Gambaran teofani di Sinai
  choice: Fenomena indrawi diterjemahkan secara deskriptif, dengan קֹלֹת dipahami sebagai bunyi guruh.
  alternative: Menerjemahkan קֹלֹת sebagai 'suara-suara' yang dapat menyiratkan suara makhluk surgawi.
  rationale: Kedekatan קֹלֹת dengan kilat sangat mendukung makna guruh dalam konteks ini. Namun, karena kata Ibrani itu juga dapat berarti suara-suara atau bunyi-bunyi, ambiguitas leksikalnya dipertahankan melalui catatan kaki tanpa memasukkan tafsiran teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan narasi yang mudah dipahami. Struktur Ibrani yang berulang tidak ditiru secara mekanis; urutan fenomena dan ketegangan teofanis tetap dipertahankan. Semua penanda catatan kaki ditempatkan tepat setelah unsur yang diterangkan.
