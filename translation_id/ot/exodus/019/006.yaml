revisions:
- from: Kamu akan menjadi bagi-Ku kerajaan para imam[a] dan bangsa yang kudus. Inilah perkataan yang harus kamu sampaikan kepada bani Israel[b].
  to: Kalian akan menjadi bagi-Ku kerajaan para imam[a] dan bangsa yang kudus. Inilah kata-kata yang harus engkau sampaikan kepada anak-anak Israel[b].
  rationale: 'Revisi terutama menampakkan kontras gramatikal yang penting dalam teks Ibrani: Allah berbicara tentang Israel dengan “kalian,” lalu memerintahkan Musa secara tunggal dengan “engkau.” “Kata-kata” mempertahankan bentuk jamak sumber. “Anak-anak Israel” menggantikan istilah yang lebih tradisional “bani Israel” demi kelaziman bahasa Indonesia modern, tanpa menghilangkan unsur keturunan atau cakupan kolektif, yang dijelaskan dalam catatan kaki.'
