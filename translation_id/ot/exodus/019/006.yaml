  text: וְ/אַתֶּ֧ם תִּהְיוּ לִ֛/י מַמְלֶ֥כֶת כֹּהֲנִ֖ים וְ/ג֣וֹי קָד֑וֹשׁ אֵ֚לֶּה הַ/דְּבָרִ֔ים אֲשֶׁ֥ר תְּדַבֵּ֖ר אֶל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/006.yaml
  text: And you shall be to me a kingdom of priests and a holy nation[b][a]. These are the words that you shall speak to the sons of Israel.
translation:
  language: id
  text: Kalian akan menjadi bagi-Ku kerajaan para imam[a] dan bangsa yang kudus. Inilah kata-kata yang harus engkau sampaikan kepada anak-anak Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kerajaan imamat” atau “kerajaan yang bersifat keimaman.” Frasa Ibraninya dapat dipahami sebagai kerajaan yang terdiri atas para imam atau kerajaan yang bercirikan keimaman. Bandingkan 1 Petrus 2:9, yang memakai ungkapan terkait, “imamat yang rajani.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak-anak Israel”; ungkapan Ibrani ini mengacu kepada umat Israel secara keseluruhan, bukan hanya orang Israel laki-laki.
    reason: cultural_note
lexical_decisions:
- source_word: תִּהְיוּ
  choice: kamu akan menjadi
  rationale: Bentuk imperfek Qal menyatakan keadaan atau hasil yang akan terwujud dalam pernyataan perjanjian; bentuk ini mempertahankan nuansa futur tanpa menjadikannya semata-mata perintah.
- source_word: לִי
  choice: bagi-Ku
  rationale: Preposisi ל dengan sufiks orang pertama menyatakan hubungan, peruntukan, atau kepunyaan; 'bagi-Ku' alami dalam bahasa Indonesia dan mempertahankan orientasi perjanjian.
- source_word: מַמְלֶכֶת כֹּהֲנִים
  choice: kerajaan para imam
  rationale: Frasa konstruksi ini paling langsung menunjuk kepada kerajaan yang terdiri atas atau bercirikan imam-imam. Terjemahan mempertahankan nomina 'kerajaan' dan tidak memasukkan ungkapan Perjanjian Baru ke dalam teks utama.
- source_word: גּוֹי קָדוֹשׁ
  choice: bangsa yang kudus
  rationale: Padanan baku dan jelas bagi frasa nomina-adjektiva ini, dengan tetap mempertahankan bobot perjanjian dan teologis קָדוֹשׁ.
- source_word: אֵלֶּה הַדְּבָרִים
  choice: Inilah perkataan
  rationale: Dalam konteks pesan yang harus diucapkan, דְּבָרִים berarti perkataan atau kata-kata; bentuk singular kolektif 'perkataan' terdengar alami dan bermartabat dalam bahasa Indonesia.
- source_word: תְּדַבֵּר
  choice: harus kamu sampaikan
  rationale: Imperfek Piel orang kedua maskulin tunggal ditujukan kepada Musa dan berfungsi sebagai arahan. 'Sampaikan' secara idiomatis menyatakan pengucapan pesan yang telah diberikan, sedangkan 'harus' membawa daya direktifnya.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: '''Bani Israel'' adalah ungkapan Indonesia yang mapan dan mempertahankan unsur keturunan dalam frasa Ibrani, sementara catatan kaki menjelaskan bahwa acuannya adalah umat Israel secara keseluruhan.'
theological_decisions:
- issue: Identitas bersama Israel dalam panggilan perjanjian
  choice: kerajaan para imam
  alternative: kerajaan imamat; kerajaan yang bersifat keimaman
  rationale: Pilihan utama mempertahankan struktur nominal Ibrani dan ambiguitas apakah kerajaan itu tersusun dari para imam atau ditandai oleh watak keimaman, tanpa menggantikannya dengan formulasi penerimaan yang lebih kemudian.
- issue: Sebutan perjanjian yang berbentuk keturunan maskulin
  choice: bani Israel
  alternative: orang Israel; umat Israel; keturunan Israel
  rationale: Pilihan ini mempertahankan citra keturunan dari בְּנֵי sekaligus tetap dikenal dalam bahasa Indonesia. Catatan kaki menerangkan bahwa secara idiomatis frasa itu mencakup umat Israel seluruhnya, bukan hanya laki-laki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pronomina tunggal 'kamu' mengikuti sapaan kepada Musa, sedangkan kapitalisasi pada '-Ku' menandai rujukan kepada Allah sesuai kebiasaan ejaan Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan tepat setelah frasa yang diterangkannya.
