base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/007.yaml
  text: So Moses came and called for the elders of the people[b][a], and set before them all these words that Yahweh had commanded him.
translation:
  language: id
  text: Lalu Musa datang, memanggil para tua-tua umat itu, dan menyampaikan kepada mereka semua perkataan ini yang Yahweh perintahkan kepadanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: datang
  rationale: Kata בוא dapat berarti 'datang' atau 'pergi' menurut sudut pandang; 'datang' sesuai dengan gerak Musa kembali kepada umat setelah menghadap Allah.
- source_word: וַיִּקְרָא לְזִקְנֵי הָעָם
  choice: memanggil para tua-tua umat itu
  rationale: קרא dengan ל dapat berarti memanggil atau memanggil datang. 'Memanggil' alami dalam bahasa Indonesia dan tidak memberi tekanan sekuat 'memerintahkan menghadap'.
- source_word: זִקְנֵי הָעָם
  choice: para tua-tua umat itu
  rationale: זקנים menunjuk para sesepuh yang diakui sebagai wakil umat. 'Tua-tua' mempertahankan istilah sosial-politiknya tanpa menggeneralisasikannya menjadi sekadar pemimpin.
- source_word: וַיָּשֶׂם לִפְנֵיהֶם
  choice: menyampaikan kepada mereka
  rationale: Secara harfiah berarti 'menaruh di hadapan mereka'; dalam konteks perkataan yang disampaikan, 'menyampaikan kepada mereka' merupakan ungkapan Indonesia yang alami dan mempertahankan fungsi idiom tersebut.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: semua perkataan
  rationale: דברים dapat berarti perkataan, perkara, atau hal-hal. Konteksnya adalah Musa meneruskan firman ilahi dari ayat-ayat sebelumnya, sehingga 'perkataan' paling tepat.
- source_word: אֲשֶׁר צִוָּהוּ יְהוָה
  choice: yang diperintahkan Yahweh kepadanya
  rationale: Klausa ini menyatakan sumber dan kewibawaan pesan itu; bentuk pasif menghasilkan susunan Indonesia yang jelas dan alami tanpa mengubah hubungan makna.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama pribadi ilahi dan sejalan dengan kebijakan proyek.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Para tua-tua' dipertahankan sebagai istilah tradisional yang masih mudah dipahami untuk wakil senior umat. Dua klausa utama dipisahkan menjadi dua kalimat agar alurnya jelas tanpa menghilangkan hubungan naratif.
