  yaml_path: translation/ot/exodus/019/011.yaml
  text: and let them be ready for the third day[a], because on the third day Yahweh will come down in the sight of all the people on Mount Sinai.
translation:
  language: id
  text: Hendaklah mereka siap untuk hari ketiga, sebab pada hari ketiga Yahweh akan turun di atas Gunung Sinai di depan mata seluruh umat itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “disaksikan oleh seluruh umat itu.”'
    reason: Alternatif idiomatis bagi לְעֵינֵי; teks Ibrani secara harfiah memakai ungkapan yang berkaitan dengan “mata”.
lexical_decisions:
- source_word: וְהָיוּ
  choice: Hendaklah mereka
  rationale: Bentuk perfektif ini berfungsi sebagai instruksi dalam rangkaian perintah. “Hendaklah mereka” menyampaikan daya perintah secara wajar dalam bahasa Indonesia.
- source_word: נְכֹנִים
  choice: siap
  rationale: Kata ini menunjuk pada keadaan telah dipersiapkan untuk suatu peristiwa; “siap” jelas dan alami dalam konteks persiapan ritual.
- source_word: לַיּוֹם הַשְּׁלִישִׁי
  choice: untuk hari ketiga
  rationale: Preposisi ל menandai hari yang menjadi sasaran persiapan. “Untuk hari ketiga” mempertahankan nuansa itu tanpa mengubahnya menjadi sekadar tenggat waktu.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan bagi instruksi sebelumnya. “Sebab” alami dan tetap bermartabat.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: pada hari ketiga
  rationale: Ini merupakan ungkapan waktu yang langsung dan lazim dalam bahasa Indonesia.
- source_word: יֵרֵד
  choice: akan turun
  rationale: ירד menggambarkan gerak turun. “Akan turun” mempertahankan gambaran teofani tanpa bahasa yang terlalu teknis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks sumber ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: לְעֵינֵי
  choice: di depan mata
  rationale: Ungkapan ini secara harfiah berkaitan dengan mata dan berarti bahwa peristiwa tersebut berlangsung secara tampak di hadapan mereka. “Di depan mata” mempertahankan citra Ibraninya sekaligus dapat dipahami dengan mudah.
- source_word: כָל הָעָם
  choice: seluruh umat itu
  rationale: Frasa ini menunjuk pada keseluruhan umat yang sedang berkumpul. “Seluruh umat itu” sesuai dengan konteks Israel dan terdengar alami dalam ragam naratif yang bermartabat.
- source_word: עַל הַר סִינָי
  choice: ke atas Gunung Sinai
  rationale: Dengan verba gerak “turun”, עַל menunjuk pada gunung sebagai tempat tujuan turunnya Yahweh. “Ke atas Gunung Sinai” mempertahankan arah gerak dan hubungan spasial tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian ilahi secara langsung. Bentuk “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Keterlihatan turunnya Yahweh
  choice: di depan mata seluruh umat itu
  alternative: disaksikan oleh seluruh umat itu
  rationale: Pilihan utama mempertahankan citra konkret לְעֵינֵי tanpa menjelaskan bagaimana manifestasi ilahi itu terlihat. Alternatif yang lebih idiomatis dicatat tanpa menyelesaikan lebih jauh sifat teofani tersebut.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur sebab-akibat dipertahankan, sementara susunan bagian akhir disesuaikan secukupnya agar alami. Penanda catatan kaki [a] ditempatkan tepat sesudah frasa yang dijelaskannya.
