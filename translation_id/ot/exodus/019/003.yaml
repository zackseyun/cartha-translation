  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מֹשֶׁ֥ה עָלָ֖ה אֶל הָ/אֱלֹהִ֑ים וַ/יִּקְרָ֨א אֵלָ֤י/ו יְהוָה֙ מִן הָ/הָ֣ר לֵ/אמֹ֔ר כֹּ֤ה תֹאמַר֙ לְ/בֵ֣ית יַעֲקֹ֔ב וְ/תַגֵּ֖יד לִ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/003.yaml
  text: And Moses went up to God[a], and Yahweh called to him from the mountain, saying, “Thus you shall say to the house of Jacob, and tell the sons of Israel:”
translation:
  language: id
  text: Musa naik menghadap Allah, lalu Yahweh berseru kepada Musa dari gunung itu, “Beginilah yang harus kaukatakan kepada kaum Yakub dan kausampaikan kepada keturunan Israel[a]:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “putra-putra Israel”; ungkapan Ibrani ini dipakai secara kolektif untuk keturunan atau umat Israel.
    reason: Menjelaskan bentuk maskulin kolektif bahasa Ibrani dan cakupannya dalam konteks.
lexical_decisions:
- source_word: עָלָה אֶל הָאֱלֹהִים
  choice: naik menghadap Allah
  rationale: עָלָה mempertahankan gerak naik menuju gunung, sedangkan ‘menghadap Allah’ mengungkapkan tujuan perjumpaan secara alami dalam bahasa Indonesia tanpa menambahkan lokasi yang tidak disebutkan.
- source_word: וַיִּקְרָא אֵלָיו
  choice: memanggilnya
  rationale: Dalam konteks ini קרא dengan אֶל berarti berseru atau memanggil kepada seseorang. ‘Memanggilnya’ adalah ungkapan Indonesia yang wajar dan tetap menunjukkan bahwa panggilan itu ditujukan kepada Musa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks Ibrani tetap tampak.
- source_word: מִן הָהָר
  choice: dari gunung itu
  rationale: הָהָר menunjuk kepada gunung yang sudah hadir dalam konteks, sehingga artikel tertentu dinyatakan secara alami dengan ‘itu’.
- source_word: לֵאמֹר
  choice: firman-Nya
  rationale: Infinitif ini memperkenalkan ucapan langsung. Dalam narasi ketika Allah berbicara, ‘firman-Nya’ merupakan padanan Indonesia yang ringkas, wajar, dan bermartabat.
- source_word: כֹּה תֹאמַר
  choice: Beginilah yang harus kaukatakan
  rationale: Bentuk ini mempertahankan formula resmi pengantar pesan ilahi sekaligus memakai susunan bahasa Indonesia modern.
- source_word: לְבֵית יַעֲקֹב
  choice: kepada kaum Yakub
  rationale: בֵּית secara harfiah berarti ‘rumah’, tetapi di sini merupakan sebutan kolektif bagi keluarga atau keturunan Yakub. ‘Kaum Yakub’ menjaga makna kolektif dan paralelismenya secara alami.
- source_word: וְתַגֵּיד
  choice: dan kausampaikan
  rationale: Bentuk Hifil dari נגד berarti memberitahukan atau menyatakan. ‘Kausampaikan’ cocok untuk penyampaian pesan resmi dan membedakannya secara halus dari ‘katakan’.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: kepada keturunan Israel
  rationale: בְּנֵי secara harfiah ‘anak-anak lelaki/putra-putra’, tetapi dalam gabungan ini berfungsi sebagai sebutan kolektif bagi bangsa keturunan Israel. ‘Keturunan Israel’ alami dalam bahasa Indonesia dan tidak keliru membatasi kelompok itu hanya pada laki-laki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai nama diri ilahi, bukan gelar. Bentuk ‘Yahweh’ mempertahankan pembedaan tersebut dan merupakan transliterasi akademis yang lazim.
- issue: Cakupan ungkapan maskulin kolektif לִבְנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: putra-putra Israel atau anak-anak Israel
  rationale: Dalam konteks ini ungkapan tersebut menunjuk kepada umat Israel secara kolektif, bukan hanya laki-laki. Terjemahan utama menyatakan cakupannya, sementara bentuk harfiahnya dicatat agar ciri bahasa sumber tidak tersembunyi.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk terikat ‘kaukatakan’ dan ‘kausampaikan’ menjaga kelancaran amanat langsung. Paralelisme antara ‘kaum Yakub’ dan ‘keturunan Israel’ dipertahankan tanpa membuat ungkapan Indonesia terasa kaku.
