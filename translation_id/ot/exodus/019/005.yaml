  text: וְ/עַתָּ֗ה אִם שָׁמ֤וֹעַ תִּשְׁמְעוּ֙ בְּ/קֹלִ֔/י וּ/שְׁמַרְתֶּ֖ם אֶת בְּרִיתִ֑/י וִ/הְיִ֨יתֶם לִ֤/י סְגֻלָּה֙ מִ/כָּל הָ֣/עַמִּ֔ים כִּי לִ֖/י כָּל הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/005.yaml
  text: And now[a], if you will indeed listen to my voice and keep my covenant, then you will be my treasured possession out of all the peoples[c][b], for all the earth is mine.
translation:
  language: id
  text: Dan sekarang, jika kamu sungguh-sungguh mendengarkan suara-Ku[a] dan memelihara perjanjian-Ku, kamu akan menjadi milik kesayangan-Ku dari antara segala bangsa[b], sebab seluruh bumi adalah milik-Ku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jika mendengar kamu akan mendengar,” suatu bentuk Ibrani yang menegaskan tindakan mendengar. Dalam konteks ini, mendengarkan juga mencakup menaati.
    reason: lexical_alternative
  - marker: b
    text: Atau “milik khusus-Ku.” Maksudnya, dipilih dari antara segala bangsa; klausa berikutnya menegaskan bahwa seluruh bumi tetap milik Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Menyampaikan peralihan temporal dan konsekuensi perjanjian secara alami dalam bahasa Indonesia; hubungan dengan konteks tetap jelas tanpa harus menerjemahkan waw secara mekanis.
- source_word: שָׁמוֹעַ תִּשְׁמְעוּ
  choice: sungguh-sungguh mendengarkan
  rationale: Konstruksi infinitif absolut dengan bentuk verbal menegaskan tindakan mendengar. Pilihan ini mempertahankan citra pendengaran sekaligus menyampaikan intensitasnya.
- source_word: בְּקֹלִי
  choice: suara-Ku
  rationale: Dalam gabungan dengan 'mendengarkan', bentuk ini alami dalam bahasa Indonesia dan mempertahankan ungkapan konkret Ibrani, yang dalam konteks mencakup ketaatan.
- source_word: וּשְׁמַרְתֶּם אֶת בְּרִיתִי
  choice: dan memegang perjanjian-Ku
  rationale: Kata 'memegang' menyatakan kesetiaan dalam menaati dan memelihara perjanjian, bukan sekadar menjaganya secara fisik.
- source_word: וִהְיִיתֶם לִי
  choice: kamu akan menjadi ... -Ku
  rationale: Menyatakan hasil dari syarat sebelumnya secara wajar dan mempertahankan relasi kepunyaan yang ditandai oleh לִי.
- source_word: סְגֻלָּה
  choice: milik kesayangan
  rationale: Mengungkapkan baik unsur kepunyaan khusus maupun nilai tinggi yang terkandung dalam istilah Ibrani, dengan bahasa yang mudah dipahami.
- source_word: מִכָּל הָעַמִּים
  choice: dari antara segala bangsa
  rationale: Menafsirkan מן sebagai pemilihan dari antara bangsa-bangsa, bukan keunggulan mutlak di atas mereka; hal ini selaras dengan klausa berikutnya.
- source_word: כִּי לִי כָּל הָאָרֶץ
  choice: sebab seluruh bumi adalah milik-Ku
  rationale: כִּי memberi dasar bagi pernyataan sebelumnya, sedangkan הָאָרֶץ bersifat universal karena konteks menyebut segala bangsa.
theological_decisions:
- issue: Apakah שׁמע diterjemahkan sebagai 'mendengarkan' atau 'menaati'
  choice: mendengarkan suara-Ku
  alternative: menaati Aku
  rationale: Ungkapan Ibrani mencakup pendengaran yang taat, tetapi teks secara konkret menonjolkan tindakan mendengar. Dimensi ketaatan juga tampak dalam frasa berikutnya, 'memegang perjanjian-Ku'.
- issue: Cara menyatakan status Israel sebagai סְגֻלָּה tanpa melebih-lebihkan eksklusivitas
  choice: milik kesayangan-Ku dari antara segala bangsa
  alternative: milik khusus-Ku melebihi segala bangsa
  rationale: Terjemahan ini mempertahankan pemilihan dan nilai khusus Israel sekaligus tidak meniadakan penegasan bahwa seluruh bumi tetap milik Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan ilahi ditandai dengan kapital pada pronomina posesif. Struktur syarat-hasil dibuat alami tanpa menghilangkan tekanan dan ketegangan antara pemilihan Israel dan kepemilikan Allah atas seluruh bumi.
