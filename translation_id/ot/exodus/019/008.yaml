  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּעֲנ֨וּ כָל הָ/עָ֤ם יַחְדָּו֙ וַ/יֹּ֣אמְר֔וּ כֹּ֛ל אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה נַעֲשֶׂ֑ה וַ/יָּ֧שֶׁב מֹשֶׁ֛ה אֶת דִּבְרֵ֥י הָ/עָ֖ם אֶל יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/008.yaml
  text: And all the people answered together and said[a], “All that Yahweh has spoken we will do.” Then Moses brought back the words of the people to Yahweh.
translation:
  language: id
  text: Seluruh umat itu menjawab bersama-sama, “Segala sesuatu yang telah Yahweh firmankan akan kami lakukan.” Lalu Musa menyampaikan kembali[a] perkataan umat itu kepada Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melaporkan”.
    reason: Bentuk Hifil וַיָּשֶׁב dapat dipahami secara idiomatis sebagai menyampaikan atau melaporkan kembali perkataan umat.
lexical_decisions:
- source_word: וַיַּעֲנוּ ... וַיֹּאמְרוּ
  choice: menjawab
  rationale: Dalam konteks dialog ini, ענה berarti menjawab atau menanggapi dengan perkataan. Kutipan langsung sudah menyatakan tindakan berkata dari וַיֹּאמְרוּ, sehingga satu verba Indonesia menghasilkan kalimat yang alami tanpa kehilangan isi sumber.
- source_word: כָל הָעָם
  choice: seluruh umat itu
  rationale: Ungkapan ini mempertahankan cakupan kolektif כָל dan merujuk secara alami kepada umat Israel yang telah disebut dalam konteks.
- source_word: יַחְדָּו
  choice: bersama-sama
  rationale: Pilihan ini mempertahankan penekanan pada tanggapan kolektif yang terpadu tanpa mempertegasnya menjadi keseragaman mutlak.
- source_word: כֹּל אֲשֶׁר דִּבֶּר
  choice: segala sesuatu yang telah ... firmankan
  rationale: Terjemahan ini menyampaikan cakupan menyeluruh כֹּל אֲשֶׁר dan aspek tindakan berbicara yang telah terjadi, dengan susunan yang jelas dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama diri ilahi dipertahankan sebagai Yahweh, bukan diganti dengan gelar, sesuai bentuk Tetragramaton dalam teks Ibrani.
- source_word: נַעֲשֶׂה
  choice: akan kami lakukan
  rationale: Verba עשה secara langsung berarti melakukan. Pilihan ini mempertahankan janji tindakan tanpa menggantinya dengan kata 'menaati', yang lebih interpretatif.
- source_word: וַיָּשֶׁב
  choice: menyampaikan kembali
  rationale: Bentuk Hifil dari שוב di sini menyatakan bahwa Musa membawa atau menyampaikan kembali jawaban umat kepada Yahweh. Ungkapan ini mempertahankan unsur 'kembali' sekaligus tetap alami dalam bahasa Indonesia.
- source_word: דִּבְרֵי הָעָם
  choice: perkataan umat itu
  rationale: Pilihan ini mempertahankan nomina konkret דִּבְרֵי, bukan mengabstraksikannya menjadi 'tanggapan'.
- source_word: אֶל יְהוָה
  choice: kepada Yahweh
  rationale: Preposisi אֶל menunjukkan arah penyampaian perkataan tersebut dan secara alami diterjemahkan 'kepada'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian ilahi secara langsung. Bentuk 'Yahweh' mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Apakah נַעֲשֶׂה diterjemahkan dengan bahasa ketaatan
  choice: akan kami lakukan
  alternative: akan kami taati
  rationale: Konteksnya memang menyiratkan ketaatan, tetapi verba Ibrani secara eksplisit berarti 'melakukan'. Terjemahan terpilih menghindari penambahan interpretatif.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mempertahankan tanggapan kolektif umat, janji mereka, dan tindakan Musa menyampaikan jawaban itu kembali. Pengulangan nama Yahweh dipertahankan sebagaimana dalam teks sumber.
