source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֤י/ו יְהוָה֙ לֶךְ רֵ֔ד וְ/עָלִ֥יתָ אַתָּ֖ה וְ/אַהֲרֹ֣ן עִמָּ֑/ךְ וְ/הַ/כֹּהֲנִ֣ים וְ/הָ/עָ֗ם אַל יֶֽהֶרְס֛וּ לַ/עֲלֹ֥ת אֶל יְהוָ֖ה פֶּן יִפְרָץ בָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/024.yaml
  text: And Yahweh said to him[a], “Go down, and come up—you and Aaron with you. But the priests and the people must not break through to come up to Yahweh, lest he break out against them.”
translation:
  language: id
  text: Lalu Yahweh berkata kepadanya, “Turunlah, lalu naiklah, engkau bersama Harun. Tetapi para imam dan umat itu tidak boleh menerobos untuk naik menghadap Yahweh, agar Ia tidak menerobos ke tengah-tengah mereka.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak boleh memaksa menerobos ... agar Ia tidak melanda mereka.” Bahasa Ibrani memakai citra yang berkaitan untuk penerobosan umat dan tindakan penghukuman Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו יְהוָה
  choice: Lalu Yahweh berkata kepadanya
  rationale: Menerjemahkan urutan naratif secara alami, mempertahankan objek pronominal ‘kepadanya’, dan mentransliterasikan nama ilahi יְהוָה sebagai ‘Yahweh’.
- source_word: לֶךְ רֵד
  choice: Turunlah
  rationale: Pasangan imperatif ini berfungsi idiomatis sebagai perintah untuk pergi turun; dalam bahasa Indonesia, ‘Turunlah’ menyampaikan tindakan itu dengan wajar tanpa pengulangan yang kaku.
- source_word: וְעָלִיתָ
  choice: Setelah itu, naiklah kembali
  rationale: Bentuk perfektif dalam rangkaian perintah memiliki daya instruktif dan menunjuk pada kenaikan sesudah Musa turun; ‘kembali’ memperjelas urutan gerak yang tersirat oleh konteks tanpa mengubah pelakunya.
- source_word: אַתָּה וְאַהֲרֹן עִמָּךְ
  choice: engkau bersama Harun
  rationale: ‘Engkau’ mempertahankan penekanan pronomina eksplisit, sedangkan ‘bersama Harun’ menyampaikan עִמָּךְ secara alami.
- source_word: וְהַכֹּהֲנִים וְהָעָם
  choice: Tetapi para imam dan umat itu
  rationale: Waw di sini wajar dipahami secara kontras terhadap izin bagi Musa dan Harun. ‘Para imam’ adalah padanan baku, dan ‘umat itu’ merujuk kepada komunitas Israel dalam konteks.
- source_word: אַל יֶהֶרְסוּ
  choice: tidak boleh menerobos
  rationale: הרשׂ/הרס dalam konteks ini menggambarkan penerobosan batas yang telah ditetapkan; ‘menerobos’ konkret dan alami dalam bahasa Indonesia.
- source_word: לַעֲלֹת אֶל יְהוָה
  choice: untuk naik menghadap Yahweh
  rationale: ‘Naik’ mempertahankan citra vertikal, sedangkan ‘menghadap’ menyampaikan gerak mendekati hadirat ilahi tanpa menyiratkan bahwa manusia dapat mencapai atau menyamai Allah.
- source_word: פֶּן יִפְרָץ בָּם
  choice: supaya Ia tidak menerjang mereka
  rationale: פרץ melukiskan tindakan mendadak dan keras terhadap mereka. ‘Menerjang’ mempertahankan citra ledakan tindakan ilahi dan beresonansi dengan ‘menerobos’, meskipun kedua verba Ibrani tidak identik.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Mempertahankan nama pribadi dalam teks sumber alih-alih menggantinya dengan gelar, tanpa menjadikan rekonstruksi pelafalan sebagai pokok tafsir.
- issue: Pelaku tersirat dalam יִפְרָץ
  choice: Ia, yakni Yahweh
  alternative: hukuman ilahi dinyatakan tanpa subjek eksplisit
  rationale: Kata kerja Ibrani berbentuk orang ketiga tunggal maskulin dan secara alami kembali kepada Yahweh sebagai pelaku; huruf kapital membantu rujukan dalam bahasa Indonesia tanpa menambahkan gelar.
- issue: Makna pendekatan kepada Yahweh
  choice: naik menghadap Yahweh
  alternative: naik kepada Yahweh
  rationale: Ungkapan ini dipertahankan sebagai pendekatan ke hadirat Yahweh di gunung, bukan ditafsirkan secara metafisik atau dilemahkan menjadi sekadar naik ke lokasi biasa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Imperatif dibuat ringkas dan alami. Istilah ‘umat’ dipilih karena konteksnya adalah Israel sebagai komunitas, sementara citra batas dan penghukuman dipertahankan melalui ‘menerobos’ dan ‘menerjang’.
