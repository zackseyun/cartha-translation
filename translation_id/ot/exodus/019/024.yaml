review_pass:
  verdict: revise
  source_fidelity: Draf ini pada umumnya mengikuti struktur dan isi Ibrani dengan baik, termasuk nama Yahweh, perintah turun lalu naik, dan larangan bagi para imam serta umat. Namun, “Setelah itu” dan terutama “kembali” menjadikan urutan/kepulangan yang tidak dinyatakan secara eksplisit dalam ayat. Selain itu, “menerjang mereka” hanya sebagian menyampaikan פָּרַץ dan mengaburkan gema citra ‘menerobos’ yang sengaja dipertahankan antara pelanggaran umat dan tindakan Yahweh.
  naturalness: Bahasanya baku dan mengalir. “Turunlah, lalu naiklah” lebih langsung dan setia daripada “Setelah itu, naiklah kembali.” “Ia tidak menerobos ke tengah-tengah mereka” agak lebih konkret daripada ungkapan biasa, tetapi dapat diterima dalam register naratif-khidmat dan mempertahankan citra Ibrani yang penting; catatan kaki membantu pembaca.
  terminology: “Yahweh,” “Harun,” “para imam,” dan “umat” sesuai. “Naik menghadap Yahweh” secara wajar mengungkapkan לַעֲלֹת אֶל־יְהוָה tanpa menambahkan penafsiran teologis.
  issues:
  - severity: medium
    issue: Tambahan “Setelah itu” dan “kembali”
    rationale: Urutan turun lalu naik memang tersirat oleh rangkaian perintah, tetapi teks Ibrani tidak menyatakan ‘setelah itu’ atau ‘kembali’. “Lalu naiklah” mempertahankan urutan tanpa memperluasnya.
  - severity: medium
    issue: “menerjang mereka” tidak cukup mempertahankan citra פָּרַץ
    rationale: פָּרַץ menggambarkan menerobos/breaking out dan secara sengaja beresonansi dengan יֶהֶרְסוּ, ‘menerobos’. Revisi mempertahankan hubungan citra itu, sementara catatan kaki menjelaskan kemungkinan nuansa ‘melanda’ atau ‘menghantam’ sebagai penghukuman.
  revised_text: Lalu Yahweh berkata kepadanya, “Turunlah, lalu naiklah, engkau bersama Harun. Tetapi para imam dan umat itu tidak boleh menerobos untuk naik menghadap Yahweh, agar Ia tidak menerobos ke tengah-tengah mereka.”[a]
  revised_footnotes:
