  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה רֵ֖ד הָעֵ֣ד בָּ/עָ֑ם פֶּן יֶהֶרְס֤וּ אֶל יְהוָה֙ לִ/רְא֔וֹת וְ/נָפַ֥ל מִמֶּ֖/נּוּ רָֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/021.yaml
  text: And Yahweh said to Moses[a], “Go down; warn the people, lest they break through to Yahweh to look[b], and many of them fall.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa, “Turunlah! Peringatkan bangsa itu, jangan sampai mereka menerobos untuk mendekati Yahweh untuk melihat[a], lalu banyak dari antara mereka jatuh[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memandang.” Kata kerja Ibrani ini dapat berarti “melihat” atau “memandang”; dalam konteks ini, kata itu merujuk pada upaya untuk melihat Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “lalu banyak dari antara mereka jatuh.” Dalam konteks ini, “jatuh” mungkin menyiratkan kematian, tetapi teks Ibrani tidak menyatakannya dengan lebih tegas.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: רֵד
  choice: Turunlah
  rationale: Bentuk imperatif dari ירד; pilihan ini alami dalam bahasa Indonesia dan mempertahankan arah geraknya.
- source_word: הָעֵד
  choice: Peringatkan
  rationale: Bentuk Hifil dari עוד dalam konteks ini berarti memberikan peringatan tegas kepada umat.
- source_word: בָּעָם
  choice: bangsa itu
  rationale: עם menunjuk kepada umat Israel secara kolektif; “bangsa itu” wajar dalam konteks ini.
- source_word: פֶּן
  choice: jangan sampai
  rationale: Mengungkapkan tujuan atau akibat negatif dalam sebuah peringatan secara alami dalam bahasa Indonesia.
- source_word: יֶהֶרְסוּ
  choice: menerobos
  rationale: Dalam konteks batas yang dipasang di sekeliling gunung, kata ini menyatakan tindakan menembus atau melanggar batas terlarang.
- source_word: אֶל יְהוָה
  choice: ke arah Yahweh
  rationale: Preposisi אֶל menyatakan gerakan menuju hadirat ilahi; “ke arah” mempertahankan nuansa arah tanpa menyiratkan bahwa mereka dapat mencapai Yahweh.
- source_word: לִרְאוֹת
  choice: untuk melihat
  rationale: Infinitif ini menyatakan tujuan dan dapat berarti melihat atau memandang; “melihat” mempertahankan ungkapan sumber tanpa menambahkan gagasan penglihatan mistis.
- source_word: וְנָפַל
  choice: lalu ... jatuh
  rationale: נפל secara harfiah berarti “jatuh.” Dalam konteks penghukuman, kata ini mungkin menyiratkan kematian, tetapi teks Ibrani tidak menyatakannya secara lebih eksplisit.
- source_word: מִמֶּנּוּ רָב
  choice: banyak dari antara mereka
  rationale: Ungkapan ini menunjuk kepada sejumlah besar orang dari kelompok tersebut; terjemahan ini jelas sekaligus dekat dengan bentuk Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Akibat pelanggaran batas dalam kata נפל
  choice: jatuh
  alternative: tewas atau binasa
  rationale: Konteks memungkinkan makna kematian sebagai hukuman, tetapi kata Ibraninya sendiri tetap lebih umum. Terjemahan “jatuh” menjaga ketegangan dan ketidaktersuratan itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan langsung. Bentuk imperatif “Turunlah” serta peringatan “jangan sampai” mudah dipahami pembaca umum. Susunan klausa mempertahankan hubungan antara penerobosan, tujuan melihat, dan akibat jatuh tanpa memperjelas akibat itu melampaui teks sumber.
