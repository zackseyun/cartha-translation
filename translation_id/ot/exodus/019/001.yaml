base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/001.yaml
  text: In the third month after the sons of Israel had gone out from the land of Egypt[b][a], on this very day they came to the wilderness of Sinai.
translation:
  language: id
  text: Pada bulan ketiga setelah bani Israel[a] keluar dari tanah Mesir, tepat pada hari ini[b], mereka tiba di padang belantara Sinai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Israel”; dapat juga diterjemahkan “orang Israel” atau “anak-anak Israel.”
    reason: lexical_alternative
  - marker: b
    text: 'Atau “pada hari ini.” Ungkapan Ibrani ini mungkin menekankan hari kedatangan yang persis: “tepat pada hari ini.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשְּׁלִישִׁי
  choice: Pada bulan ketiga
  rationale: חֹדֶשׁ dalam rumusan penanggalan lazim berarti “bulan”; bentuk ini alami dan mempertahankan keterangan waktu sumber.
- source_word: לְצֵאת
  choice: sesudah ... keluar
  rationale: Infinitif konstruk dengan לְ menetapkan keluarnya Israel sebagai titik acuan waktu; “sesudah ... keluar” menyampaikan hubungan temporal itu secara wajar.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: Ungkapan ini mempertahankan unsur keturunan dalam sebutan harfiah “anak-anak lelaki Israel”, sekaligus merupakan sebutan kolektif yang wajar dalam bahasa Indonesia bagi umat Israel.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: dari tanah Mesir
  rationale: אֶרֶץ disebut secara eksplisit; “tanah Mesir” mempertahankan unsur tersebut tanpa terasa janggal.
- source_word: בַּיּוֹם הַזֶּה
  choice: tepat pada hari ini
  rationale: Demonstratif “ini” eksplisit, sedangkan “tepat” menyampaikan kemungkinan penekanan pada hari kedatangan yang persis.
- source_word: בָּאוּ
  choice: mereka tiba
  rationale: Dalam konteks tujuan perjalanan, “tiba” merupakan padanan Indonesia yang alami bagi בוא, meskipun bentuk dasarnya juga dapat diterjemahkan “datang”.
- source_word: מִדְבַּר סִינָי
  choice: padang belantara Sinai
  rationale: מִדְבָּר menunjuk wilayah liar atau tandus; “padang belantara” cukup luas untuk tidak membatasi maknanya hanya pada gurun pasir dan mempertahankan hubungan dengan Sinai.
theological_decisions:
- issue: Penyebutan umat perjanjian בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: orang Israel; anak-anak Israel
  rationale: “Bani Israel” mempertahankan gagasan keturunan dari bentuk Ibrani sekaligus berfungsi secara alami sebagai nama kolektif yang mencakup seluruh umat, tanpa menyiratkan bahwa hanya laki-laki yang dimaksud.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Bani Israel” dipakai sebagai sebutan kolektif yang sudah dikenal, sedangkan “padang belantara” mempertahankan keluasan makna מִדְבָּר. Urutan penanda catatan kaki dibuat alfabetis dan setiap penanda hadir dalam teks utama.
