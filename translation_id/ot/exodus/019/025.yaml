lexical_decisions:
- source_word: וַיֵּרֶד
  choice: Lalu ... turun
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “lalu” menyatakan urutan kejadian secara alami.
- source_word: אֶל־הָעָם
  choice: menemui bangsa itu
  rationale: Preposisi אֶל menyatakan gerak menuju bangsa tersebut; “menemui” terdengar alami dalam konteks Musa turun menuju mereka.
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: dan berbicara kepada mereka
  rationale: Secara harfiah berarti “dan berkata kepada mereka,” tetapi tanpa kutipan isi, “berbicara kepada mereka” menyampaikan tindakan tutur dengan wajar dan sesuai konteks.
