  yaml_path: translation/ot/exodus/019/014.yaml
  text: So Moses went down from the mountain to the people[a], and he consecrated the people, and they washed their garments.
translation:
  language: id
  text: Lalu Musa turun dari gunung itu kepada bangsa itu. Ia menguduskan bangsa itu[a], dan mereka mencuci pakaian mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyucikan bangsa itu” atau “mengkhususkan bangsa itu sebagai kudus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: turun
  rationale: Kata kerja ירד menyatakan gerak ke bawah; “turun” alami dan tepat dalam urutan narasi.
- source_word: מִן הָהָר
  choice: dari gunung
  rationale: Dalam konteks ini הַר merujuk pada Gunung Sinai; “gunung” merupakan padanan langsung dan jelas.
- source_word: אֶל הָעָם
  choice: menemui bangsa itu
  rationale: Ungkapan ini menyatakan gerak Musa menuju kelompok Israel. “Menemui” menghasilkan bahasa Indonesia yang alami tanpa mengubah rujukan עָם.
- source_word: וַיְקַדֵּשׁ
  choice: menguduskan
  rationale: Bentuk piel קדשׁ di sini menunjuk pada penyiapan dan pengkhususan ritual untuk perjumpaan dengan Allah. “Menguduskan” mempertahankan bahasa kekudusan dari teks sumber tanpa menentukan secara berlebihan cara pelaksanaannya.
- source_word: הָעָם
  choice: bangsa itu
  rationale: עָם menunjuk pada umat Israel secara kolektif. Pengulangan nomina dipertahankan sebagaimana dalam bahasa Ibrani.
- source_word: וַיְכַבְּסוּ
  choice: mereka mencuci
  rationale: כבס secara khusus digunakan untuk mencuci pakaian; “mencuci” merupakan padanan Indonesia yang alami.
- source_word: שִׂמְלֹתָם
  choice: pakaian mereka
  rationale: שִׂמְלָה berarti pakaian atau kain yang dikenakan; “pakaian” jelas, bermartabat, dan wajar dalam bahasa Indonesia modern.
theological_decisions:
- issue: Bahasa kekudusan ritual menjelang penampakan Allah di Sinai
  choice: menguduskan bangsa itu
  alternative: menyucikan bangsa itu; mengkhususkan bangsa itu sebagai kudus
  rationale: Ayat ini berbicara tentang penyiapan ritual untuk perjumpaan dengan Allah, tetapi tidak menjelaskan bahwa tindakan tersebut semata-mata bersifat lahiriah ataupun merupakan perubahan moral batin. “Menguduskan” mempertahankan cakupan dan ketegangan istilah Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Istilah “menguduskan” dipakai untuk mempertahankan hubungan leksikal dengan konsep kekudusan, sedangkan alternatif yang lebih eksplanatoris dicantumkan dalam catatan kaki.
