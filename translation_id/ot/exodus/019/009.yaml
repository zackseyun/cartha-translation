base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/009.yaml
  text: And Yahweh said to Moses[a], “Behold, I am coming to you in a thick cloud, so that the people may hear when I speak with you, and may also believe in you forever.” Then Moses told Yahweh the words of the people.
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa, “Sesungguhnya, Aku akan datang kepadamu dalam awan yang tebal, supaya bangsa itu mendengar ketika Aku berbicara denganmu dan supaya mereka juga percaya kepadamu untuk selama-lamanya.” Kemudian Musa menyampaikan perkataan bangsa itu kepada Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: הִנֵּה
  choice: Sesungguhnya
  rationale: Menandai dan menegaskan pengumuman ilahi dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: אָנֹכִי בָּא
  choice: Aku akan datang
  rationale: Partisip Ibrani menyatakan tindakan yang segera terjadi; bentuk ini paling alami dalam konteks janji tentang penampakan yang akan datang.
- source_word: בְּעַב הֶעָנָן
  choice: dalam awan yang tebal
  rationale: Mempertahankan gambaran awan pekat atau padat dalam ungkapan Indonesia yang mudah dipahami.
- source_word: בַּעֲבוּר
  choice: supaya
  rationale: Memperlihatkan hubungan tujuan yang diperkenalkan oleh ungkapan Ibrani tersebut.
- source_word: בְּדַבְּרִי עִמָּךְ
  choice: ketika Aku berbicara denganmu
  rationale: Menyampaikan nilai temporal infinitif serta arti relasional dari עִם secara alami.
- source_word: וְגַם בְּךָ יַאֲמִינוּ
  choice: dan supaya mereka juga percaya kepadamu
  rationale: Konstruksi אמן dengan ב menyatakan kepercayaan kepada Musa sebagai utusan yang disahkan Allah; 'percaya kepadamu' mempertahankan objek personal tanpa menyiratkan penyembahan.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Menyampaikan durasi berkelanjutan dengan ungkapan Indonesia yang lazim dan bermartabat.
- source_word: וַיַּגֵּד
  choice: Kemudian Musa menyampaikan
  rationale: Menandai kelanjutan narasi sekaligus menggambarkan tindakan Musa melaporkan ucapan bangsa itu.
- source_word: דִּבְרֵי הָעָם
  choice: perkataan bangsa itu
  rationale: Mempertahankan unsur leksikal 'perkataan' dan rujukan kolektif kepada Israel.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi; transliterasi Yahweh mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Makna בְּךָ יַאֲמִינוּ mengenai Musa
  choice: percaya kepadamu
  alternative: memercayaimu; menaruh kepercayaan kepadamu
  rationale: Konteksnya adalah pengesahan Musa sebagai juru bicara Allah. Pilihan ini mempertahankan cakupan kepercayaan personal dalam bahasa Ibrani tanpa menambahkan gagasan bahwa Musa menjadi objek iman ilahi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina bagi Allah ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab Indonesia. Struktur tujuan ganda dipertahankan agar hubungan antara pewahyuan, pendengaran bangsa itu, dan pengesahan Musa tetap jelas.
