  text: You yourselves have seen what I did to Egypt[c][b][a], and how I carried you on eagles’ wings and brought you to myself.
translation:
  language: id
  text: Kalian sendiri telah melihat apa yang Kulakukan terhadap Mesir dan bagaimana Aku membawa kalian di atas sayap burung-burung rajawali[a][b], lalu membawa kalian kepada-Ku[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di atas sayap-sayap rajawali.” Ungkapan Ibrani ini merupakan metafora yang hidup tentang pembebasan yang kuat dan penuh perlindungan.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “rajawali” dapat digunakan secara lebih luas untuk burung pemangsa berukuran besar.
    reason: lexical_alternative
  - marker: c
    text: Atau, “membawa kalian kepada diri-Ku.”
    reason: alternative_reading
lexical_decisions:
- source_word: אַתֶּם
  choice: kamu sendiri
  rationale: Pronomina mandiri ini memberi penekanan pada pihak yang diajak bicara; “kamu sendiri” mengungkapkan penekanan itu secara alami dalam bahasa Indonesia.
- source_word: רְאִיתֶם
  choice: telah melihat
  rationale: Bentuk qatal menunjuk pada pengalaman yang sudah terjadi dan tetap relevan bagi para pendengar; “telah melihat” sesuai dengan konteks wacana ini.
- source_word: אֲשֶׁר עָשִׂיתִי לְמִצְרָיִם
  choice: apa yang Kulakukan terhadap Mesir
  rationale: Preposisi ל menandai Mesir sebagai pihak yang dikenai tindakan Allah. “Terhadap Mesir” mempertahankan cakupan kolektif atau nasional tanpa menyiratkan tindakan yang menguntungkan Mesir.
- source_word: וָאֶשָּׂא אֶתְכֶם
  choice: Aku menggendong kamu
  rationale: נשא berarti membawa atau menanggung. Dalam metafora perlindungan melalui sayap, “menggendong” secara alami menyampaikan tindakan membawa dengan penuh perlindungan.
- source_word: עַל כַּנְפֵי נְשָׁרִים
  choice: di atas sayap burung rajawali
  rationale: Ungkapan ini menggambarkan pembebasan yang kuat, cepat, dan melindungi. “Burung rajawali” merupakan padanan tradisional yang sesuai konteks, sementara catatan kaki mempertahankan keluasan makna istilah Ibraninya.
- source_word: וָאָבִא אֶתְכֶם אֵלָי
  choice: lalu membawa kamu kepada-Ku
  rationale: אֵלָי secara langsung berarti “kepada-Ku”. Ungkapan Indonesia ini alami dan tetap memungkinkan nuansa relasional-perjanjian muncul dari konteks tanpa memperjelasnya secara berlebihan.
theological_decisions:
- issue: Daya relasional dari pembebasan Allah
  choice: membawa kamu kepada-Ku
  alternative: membawa kamu menjadi milik-Ku
  rationale: Teks menyatakan gerak menuju Allah dan dalam konteks mengandung daya relasional-perjanjian. “Kepada-Ku” mempertahankan makna langsung אֵלָי dan tidak mengubahnya menjadi pernyataan kepemilikan yang lebih eksplisit daripada teks sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada agung tetapi mudah dipahami. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan luas penerbitan Alkitab bahasa Indonesia. Susunan penanda catatan kaki ditempatkan tepat sesudah unsur yang diterangkannya.
