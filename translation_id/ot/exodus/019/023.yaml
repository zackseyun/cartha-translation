  source_fidelity: 'Terjemahan dengan setia mencerminkan struktur dan makna Ibrani: Musa menyatakan ketidakmampuan umat untuk naik ke Gunung Sinai, memberikan alasan berupa peringatan Yahweh sebelumnya, lalu mengutip perintah untuk menetapkan batas dan menguduskan gunung. Penekanan eksplisit אַתָּה tersampaikan melalui “Engkau sendiri.”'
