id: EXO.19.23
reference: Exodus 19:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל יְהוָ֔ה לֹא יוּכַ֣ל הָ/עָ֔ם לַ/עֲלֹ֖ת אֶל הַ֣ר סִינָ֑י כִּֽי אַתָּ֞ה הַעֵדֹ֤תָה בָּ֨/נוּ֙ לֵ/אמֹ֔ר הַגְבֵּ֥ל אֶת הָ/הָ֖ר וְ/קִדַּשְׁתּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/019/023.yaml
  text: And Moses said to Yahweh[a], “The people cannot go up to Mount Sinai, because you yourself warned us, saying[b], ‘Set bounds around the mountain and consecrate it.’”
translation:
  language: id
  text: Lalu Musa berkata kepada Yahweh, “Bangsa itu tidak dapat naik ke Gunung Sinai, karena Engkau sendiri telah memperingatkan kami[a] dengan berkata, ‘Tetapkan batas di sekeliling gunung itu[b] dan kuduskanlah gunung itu.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “telah memberi kami amanat dengan sungguh-sungguh” atau “telah bersaksi kepada kami.” Kata kerja Ibraninya dapat menyatakan peringatan resmi atau kesaksian yang sungguh-sungguh.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “Batasilah gunung itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה dan mempertahankannya sebagai nama pribadi, bukan menggantinya dengan gelar.
- source_word: לֹא יוּכַל הָעָם
  choice: Bangsa itu tidak dapat
  rationale: Bentuk imperfek יכל menyatakan ketidakmampuan dalam keadaan yang berlaku. הָעָם menunjuk kepada umat Israel sebagai satu kelompok; 'bangsa itu' wajar dalam konteks ini.
- source_word: לַעֲלֹת אֶל הַר סִינָי
  choice: naik ke Gunung Sinai
  rationale: '''Naik'' mempertahankan arah vertikal verba עלה dan merupakan ungkapan Indonesia yang alami.'
- source_word: כִּי אַתָּה
  choice: karena Engkau sendiri
  rationale: כִּי memperkenalkan alasan, sedangkan pronomina eksplisit אַתָּה memberi penekanan yang disampaikan dengan 'Engkau sendiri'.
- source_word: הַעֵדֹתָה בָּנוּ
  choice: telah memperingatkan kami
  rationale: Bentuk Hifil dari עוד di sini paling wajar dipahami sebagai memberi peringatan atau amanat yang sungguh-sungguh. Aspek lampau sesuai dengan perintah yang sebelumnya telah diberikan.
- source_word: לֵאמֹר
  choice: dengan berkata
  rationale: Memperkenalkan kutipan langsung dan menghubungkannya secara alami dengan tindakan memperingatkan.
- source_word: הַגְבֵּל אֶת הָהָר
  choice: Tetapkan batas di sekeliling gunung itu
  rationale: Bentuk Hifil imperatif dari גבל berarti menetapkan batas. Frasa 'di sekeliling' menjelaskan fungsi pembatas tanpa mengubah maksudnya.
- source_word: וְקִדַּשְׁתּוֹ
  choice: dan kuduskanlah gunung itu
  rationale: Piel קדשׁ menyatakan tindakan mengkhususkan sebagai kudus. Penyebutan ulang 'gunung itu' memperjelas rujukan sufiks maskulin tunggal tanpa terdengar janggal dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. 'Yahweh' mempertahankan nama itu secara langsung dan tidak menggantinya dengan sebuah gelar.
- issue: Nuansa הַעֵדֹתָה בָּנוּ
  choice: telah memperingatkan kami
  alternative: telah memberi kami amanat dengan sungguh-sungguh; telah bersaksi kepada kami
  rationale: Dalam konteks larangan mendekati gunung, makna peringatan paling sesuai, tetapi catatan kaki mempertahankan kemungkinan nuansa kesaksian atau amanat resmi.
- issue: Makna pengudusan gunung
  choice: kuduskanlah gunung itu
  alternative: khususkanlah gunung itu sebagai tempat kudus
  rationale: Terjemahan ini mempertahankan bahasa teologis קדשׁ tanpa menjelaskan lebih jauh cara atau akibat pengudusan yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan kepada Allah memakai huruf kapital. Susunan kalimat mempertahankan alasan yang diberikan Musa dan penekanan pada 'Engkau sendiri', sambil memakai ungkapan yang mudah dipahami pembaca umum.
