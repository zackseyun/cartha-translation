  yaml_path: translation/ot/exodus/019/017.yaml
  text: Then Moses brought the people out of the camp to meet God[a], and they took their stand at the foot of the mountain.
translation:
  language: id
  text: Lalu Musa membawa bangsa itu keluar dari perkemahan untuk menemui Allah, dan mereka mengambil tempat di kaki gunung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di dasar gunung.” Ungkapan Ibrani ini menunjuk pada bagian bawah gunung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצֵא
  choice: membawa ... keluar
  rationale: 'Bentuk Hifil dari יצא bersifat kausatif: Musa menyebabkan bangsa itu keluar. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan gagasan memimpin yang tidak dinyatakan secara khusus.'
- source_word: לִקְרַאת
  choice: untuk menemui
  rationale: Konstruksi ini menyatakan gerak menuju suatu pertemuan atau perjumpaan. 'Untuk menemui' mempertahankan tujuan gerak itu secara alami.
- source_word: הָאֱלֹהִים
  choice: Allah
  rationale: Dalam konteks teofani Sinai, bentuk ini menunjuk kepada Allah. 'Allah' merupakan padanan baku dan alami dalam bahasa Indonesia.
- source_word: מִן הַמַּחֲנֶה
  choice: keluar dari perkemahan
  rationale: Frasa ini menunjukkan tempat asal keberangkatan. Bersama verba kausatif sebelumnya, 'keluar dari perkemahan' menyampaikan gerak meninggalkan perkemahan dengan jelas.
- source_word: וַיִּתְיַצְּבוּ
  choice: mereka berdiri mengambil tempat
  rationale: Bentuk Hitpael dari יצב menyiratkan tindakan menempatkan diri atau mengambil posisi, bukan sekadar berada dalam posisi berdiri.
- source_word: בְּתַחְתִּית
  choice: di kaki
  rationale: Dalam kaitannya dengan gunung, kata ini menunjuk bagian bawah atau dasarnya. 'Di kaki gunung' adalah ungkapan Indonesia yang alami dan tidak menyiratkan bahwa mereka berada tepat di bawah gunung secara fisik.
- source_word: הָהָר
  choice: gunung
  rationale: Dalam konteks Sinai, הַר paling tepat diterjemahkan 'gunung'; gunung tertentu yang dimaksud sudah jelas dari konteks.
theological_decisions:
- issue: Penerjemahan הָאֱלֹהִים dalam teofani Sinai
  choice: Allah
  alternative: Allah itu
  rationale: '''Allah'' secara alami menunjuk kepada Allah yang menjumpai Israel di Sinai. Padanan ini mempertahankan rujukan teks tanpa menambahkan penafsiran doktrinal.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mempertahankan rangkaian tindakan dalam teks Ibrani, sedangkan 'berdiri mengambil tempat' dipilih untuk menyampaikan nuansa tindakan sengaja pada verba Hitpael.
