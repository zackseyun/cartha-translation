  yaml_path: translation/ot/exodus/010/011.yaml
  text: No! Let the men go now and serve Yahweh[b][a], for that is what you are seeking.” Then he drove them out from Pharaoh’s presence.
translation:
  language: id
  text: “Tidak!”[a] Biarlah para lelaki[b] pergi sekarang dan beribadah kepada Yahweh, sebab itulah yang kalian minta.” Lalu Firaun mengusir mereka dari hadapannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Tidak begitu!”'
    reason: lexical_alternative
  - marker: b
    text: Ibrani “para lelaki”; yaitu laki-laki, bukan seluruh bangsa.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן
  choice: Tidak!
  rationale: Ungkapan ini merupakan penolakan tegas terhadap usul sebelumnya. “Tidak!” menyampaikan ketegasan dan kealamian dalam bahasa Indonesia; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: לְכוּ נָא
  choice: Biarlah ... pergi sekarang
  rationale: Imperatif dengan נָא di sini paling wajar menyatakan desakan atau urgensi, bukan kesopanan. Bentuk “biarlah” sesuai dengan konteks Firaun yang memberi izin terbatas.
- source_word: הַגְּבָרִים
  choice: para lelaki itu
  rationale: Kata Ibrani ini secara khusus menunjuk kepada kaum laki-laki, sehingga pembatasan yang dibuat Firaun tidak dinetralkan menjadi seluruh umat.
- source_word: וְעִבְדוּ אֶת יְהוָה
  choice: dan beribadah kepada Yahweh
  rationale: Dalam konteks tuntutan untuk mengadakan perayaan keagamaan, עבד kepada Allah secara alami berarti beribadah. Pilihan ini tetap mempertahankan gagasan pelayanan religius tanpa terdengar janggal dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai “Yahweh”, sesuai dengan bentuk nama yang muncul langsung dalam teks Ibrani.
- source_word: כִּי אֹתָהּ אַתֶּם מְבַקְשִׁים
  choice: sebab itulah yang kalian minta
  rationale: Pronomina feminin tunggal kemungkinan menunjuk kepada hal atau permintaan yang tersirat. Terjemahan ini alami dan tidak menentukan anteseden lebih jauh daripada teks sumber.
- source_word: וַיְגָרֶשׁ אֹתָם
  choice: Lalu mereka diusir
  rationale: Bentuk Ibrani memakai verba maskulin tunggal tanpa subjek yang dinyatakan. Bentuk pasif Indonesia mempertahankan ketidakjelasan tentang apakah Firaun sendiri atau petugasnya yang mengusir mereka, sambil tetap menyampaikan tindakan paksa.
- source_word: מֵאֵת פְּנֵי פַרְעֹה
  choice: dari hadapan Firaun
  rationale: Ungkapan ini mempertahankan citra ruang sidang kerajaan sekaligus tetap jelas dan wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memuat Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Pembatasan berdasarkan jenis kelamin dalam tawaran Firaun
  choice: para lelaki itu
  alternative: orang-orang itu; umat itu
  rationale: 'Bahasa Ibrani secara khusus menyebut laki-laki. Mempertahankan rincian ini penting bagi ketegangan naratif: Firaun hanya memberi konsesi sebagian, bukan mengizinkan seluruh umat pergi.'
- issue: Pelaku pengusiran
  choice: mereka diusir
  alternative: ia mengusir mereka; Firaun mengusir mereka
  rationale: Verba Ibrani berbentuk tunggal, tetapi subjeknya tidak disebutkan secara eksplisit. Konteks memungkinkan Firaun sebagai pelaku gramatikal atau pengusiran atas perintahnya; bentuk pasif tidak menghapus ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tuturan Firaun dibuat tegas dan mendesak. “Kalian” dipakai karena ia berbicara kepada lebih dari satu orang. Draf utama perlu menampilkan penanda catatan kaki pada unsur terkait.
