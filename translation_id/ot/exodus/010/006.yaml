  to: Belalang-belalang itu akan memenuhi rumah-rumahmu, rumah-rumah semua pegawaimu, dan semua rumah di Mesir—suatu hal[a] yang belum pernah dilihat oleh leluhurmu dan leluhur para leluhurmu sejak mereka ada di bumi[b] sampai hari ini.” Lalu ia berpaling dan pergi meninggalkan Firaun.
