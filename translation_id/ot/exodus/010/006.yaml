base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/006.yaml
  text: And they will fill your houses[a], the houses of all your servants[b], and the houses of all Egypt—something your fathers and your fathers’ fathers have not seen from the day they were on the land until this day.” Then he turned and went out from Pharaoh.
translation:
  language: id
  text: Belalang-belalang itu akan memenuhi rumah-rumahmu, rumah-rumah semua pegawaimu, dan semua rumah di Mesir—suatu hal[a] yang belum pernah dilihat oleh leluhurmu dan leluhur para leluhurmu sejak mereka ada di bumi[b] sampai hari ini.” Lalu ia berpaling dan pergi meninggalkan Firaun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “yang belum pernah dilihat oleh leluhurmu dan leluhur para leluhurmu.” Klausa ini merujuk pada tulah belalang yang baru saja digambarkan.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani ini dapat diterjemahkan “bumi,” “tanah,” atau “negeri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָלְאוּ
  choice: Belalang-belalang itu akan memenuhi
  rationale: Bentuk verba melanjutkan pengumuman tentang masa depan; subjek tersiratnya adalah belalang-belalang dari konteks ayat sebelumnya. Subjek dibuat eksplisit agar jelas dan alami dalam bahasa Indonesia.
- source_word: בָתֶּיךָ ... וּבָתֵּי כָל עֲבָדֶיךָ ... וּבָתֵּי כָל מִצְרַיִם
  choice: rumah-rumahmu, rumah-rumah semua pegawaimu, dan rumah-rumah di seluruh Mesir
  rationale: Bentuk jamak dan peningkatan cakupan dalam teks Ibrani dipertahankan. Ungkapan terakhir dibuat idiomatis dalam bahasa Indonesia tanpa mengubah cakupannya.
- source_word: עֲבָדֶיךָ
  choice: pegawaimu
  rationale: Dalam konteks istana, istilah ini menunjuk kepada para pelayan atau pejabat Firaun. “Pegawai” mempertahankan hubungan pelayanan tanpa menyiratkan secara khusus bahwa mereka budak.
- source_word: אֲשֶׁר לֹא רָאוּ
  choice: suatu hal yang belum pernah dilihat
  rationale: Klausa relatif menerangkan sifat tulah yang belum pernah disaksikan. “Suatu hal” memasok anteseden secara alami tanpa menentukan lebih jauh daripada teks.
- source_word: אֲבֹתֶיךָ וַאֲבֹת אֲבֹתֶיךָ
  choice: nenek moyangmu maupun nenek moyang mereka
  rationale: Ungkapan ini mencakup generasi-generasi terdahulu secara luas; terjemahan ini menghindari pembatasan sempit seperti “kakek-kakekmu”.
- source_word: מִיּוֹם הֱיוֹתָם עַל הָאֲדָמָה
  choice: sejak mereka ada di bumi
  rationale: Terjemahan ini menyampaikan awal dan rentang keberadaan generasi terdahulu di atas bumi secara alami. Kemungkinan “tanah” atau “negeri” dicatat dalam catatan kaki.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Padanan idiomatis yang dekat dengan ungkapan waktu Ibrani dan sesuai dengan nada peringatan yang khidmat.
- source_word: וַיִּפֶן וַיֵּצֵא מֵעִם פַּרְעֹה
  choice: Lalu ia berpaling dan pergi meninggalkan Firaun
  rationale: Urutan kedua verba dipertahankan, sedangkan מֵעִם diterjemahkan secara idiomatis sebagai tindakan meninggalkan Firaun.
