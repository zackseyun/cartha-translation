  yaml_path: translation/ot/exodus/010/016.yaml
  text: Then Pharaoh hurried to call for Moses and Aaron, and he said, “I have sinned against Yahweh your God and against you.”
translation:
  language: id
  text: Lalu Firaun bergegas memanggil Musa dan Harun, lalu berkata, “Aku telah berdosa terhadap Yahweh, Allah kalian, dan terhadap kalian.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: segera
  rationale: Bentuk dari מהר menyatakan tindakan yang dilakukan dengan cepat atau tergesa; “segera” alami dalam narasi Indonesia dan mempertahankan kesan mendesak.
- source_word: לִקְרֹא
  choice: memanggil
  rationale: Dalam konteks ini, Firaun meminta Musa dan Harun datang menghadap; “memanggil” menyampaikan fungsi idiomatis konstruksi tersebut tanpa berlebihan.
- source_word: פַּרְעֹה
  choice: Firaun
  rationale: Bentuk baku bahasa Indonesia untuk gelar raja Mesir.
- source_word: לְמֹשֶׁה וּלְאַהֲרֹן
  choice: Musa dan Harun
  rationale: Preposisi Ibrani tercakup secara alami dalam verba Indonesia “memanggil”; nama-nama mengikuti bentuk baku Indonesia.
- source_word: וַיֹּאמֶר
  choice: dan berkata
  rationale: Padanan naratif yang wajar untuk wayyiqtol yang memperkenalkan perkataan langsung; subjek Firaun tetap jelas.
- source_word: חָטָאתִי
  choice: Aku telah berdosa
  rationale: Mempertahankan makna moral-teologis חטא dan menyajikan pengakuan atas tindakan yang sudah dilakukan serta masih relevan pada saat berbicara.
- source_word: לַיהוָה
  choice: terhadap Yahweh
  rationale: Sesudah verba “berdosa”, ל menandai pihak yang dikenai pelanggaran; “terhadap” merupakan padanan Indonesia yang tepat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang muncul langsung dalam teks Ibrani.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Bentuk konstruk dengan sufiks orang kedua jamak menunjuk kepada Allah Musa dan Harun. Bahasa Indonesia lazim memakai bentuk tunggal “-mu” ketika menyapa suatu kelompok sebagai satu pihak; cakupan jamaknya juga diperjelas oleh “kalian” pada akhir kalimat.
- source_word: וְלָכֶם
  choice: dan terhadap kalian
  rationale: Preposisi meneruskan hubungan dengan “berdosa”, sedangkan “kalian” secara tegas mempertahankan bentuk jamak yang merujuk kepada Musa dan Harun.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Rumusan pengakuan Firaun
  choice: Aku telah berdosa terhadap Yahweh, Allahmu, dan terhadap kalian
  alternative: Aku telah berdosa kepada Yahweh, Allahmu, dan kepada kalian
  rationale: “Terhadap” dengan jelas menandai pihak yang dilanggar dan mempertahankan paralelisme kedua frasa berpreposisi. “Allahmu” tetap orang kedua, sehingga Firaun tidak digambarkan mengakui Yahweh sebagai Allahnya sendiri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Urutan klausa mengikuti gerak narasi Ibrani, sementara konstruksi infinitif diterjemahkan secara idiomatis. “Kalian” dipakai untuk menandai secara jelas bahwa וְלָכֶם berbentuk jamak dan menunjuk kepada Musa serta Harun.
