  yaml_path: translation/ot/exodus/010/022.yaml
  text: So Moses stretched out his hand toward the sky[b][a], and there was thick darkness over all the land of Egypt for three days.
translation:
  language: id
  text: Lalu Musa mengulurkan tangannya ke arah langit[a], dan kegelapan pekat[b] meliputi seluruh tanah Mesir selama tiga hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke arah surga.” Kata Ibrani שָּׁמַיִם dapat berarti “langit” atau “surga,” bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: Atau “kegelapan yang sangat dalam.” Ungkapan Ibrani menggabungkan kata “kegelapan” dengan istilah kedua untuk kesuraman atau kegelapan hebat sebagai penegasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּט
  choice: mengulurkan
  rationale: Dalam konteks gerakan tangan, נטה berarti mengulurkan atau membentangkan. 'Mengulurkan' alami dalam bahasa Indonesia dan mempertahankan tindakan fisiknya.
- source_word: יָדוֹ
  choice: tangannya
  rationale: יָד secara biasa berarti 'tangan'; konteks tidak menuntut arti yang lebih luas seperti 'lengan'.
- source_word: עַל הַשָּׁמַיִם
  choice: ke arah langit
  rationale: Dengan tindakan mengulurkan tangan, עַל dapat menunjukkan arah, sedangkan שָּׁמַיִם dalam konteks tulah ini secara alami menunjuk pada langit. Kemungkinan 'surga' tetap dicatat dalam catatan kaki.
- source_word: וַיְהִי
  choice: dan ... meliputi
  rationale: Bentuk וַיְהִי memperkenalkan keadaan yang terjadi sebagai akibat tindakan Musa. Susunan verbal 'kegelapan ... meliputi' menghasilkan bahasa Indonesia yang alami tanpa mengubah hubungan naratif.
- source_word: חֹשֶׁךְ אֲפֵלָה
  choice: kegelapan pekat
  rationale: Gabungan dua istilah kegelapan ini bersifat intensif. 'Kegelapan pekat' menyampaikan beratnya kegelapan secara ringkas dan alami.
- source_word: בְּכָל אֶרֶץ מִצְרַיִם
  choice: meliputi seluruh tanah Mesir
  rationale: Ungkapan ini mempertahankan cakupan menyeluruh dari בְּכָל dan bentuk tradisional-geografis אֶרֶץ מִצְרַיִם, sekaligus idiomatis dengan gambaran kegelapan yang meliputi wilayah tersebut.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: selama tiga hari
  rationale: '''Selama'' menyatakan durasi yang tersirat dalam frasa Ibrani dan alami dalam bahasa Indonesia.'
