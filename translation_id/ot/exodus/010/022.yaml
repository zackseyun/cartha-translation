translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Lalu' menjaga kesinambungan cerita; 'tanah Mesir' mempertahankan ungkapan geografis sumber. Penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
