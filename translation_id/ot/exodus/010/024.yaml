base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/024.yaml
  text: Then Pharaoh called to Moses and said[a], “Go, serve Yahweh. Only let your flocks and your herds remain behind[b]; even your little ones may go with you.”
translation:
  language: id
  text: Lalu Firaun memanggil Musa dan berkata, “Pergilah, layanilah Yahweh. Hanya kawanan kambing dan domba serta kawanan sapi kalian harus ditinggalkan[a]. Anak-anak kalian juga boleh pergi bersama kalian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “harus tetap tinggal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא פַרְעֹה אֶל מֹשֶׁה
  choice: Firaun memanggil Musa
  rationale: Dalam konteks narasi ini, קרא אל menyatakan tindakan memanggil seseorang. Bentuk Indonesia ini alami dan tidak menambahkan nuansa panggilan resmi yang tidak harus ada.
- source_word: לְכוּ עִבְדוּ אֶת יְהוָה
  choice: Pergilah, beribadahlah kepada Yahweh
  rationale: עבד ketika berobjek Allah dapat berarti melayani atau beribadah. Dalam konteks permintaan Israel untuk pergi mengadakan ibadah, 'beribadahlah kepada' paling alami dalam bahasa Indonesia, sedangkan nama ilahi tetap ditransliterasikan sebagai Yahweh.
- source_word: רַק
  choice: Hanya
  rationale: Kata ini memperkenalkan pembatasan yang masih dikenakan Firaun pada izin yang diberikannya.
- source_word: צֹאנְכֶם וּבְקַרְכֶם
  choice: kawanan kambing domba dan kawanan sapi kalian
  rationale: צֹאן adalah ternak kecil kolektif, terutama kambing dan domba, sedangkan בקר adalah ternak besar, terutama sapi. Ungkapan eksplisit ini jelas bagi pembaca modern.
- source_word: יֻצָּג
  choice: harus ditinggalkan
  rationale: Bentuk Hofal dari יצג di sini menyatakan bahwa ternak harus dibiarkan tetap di tempat. 'Harus ditinggalkan' menangkap daya pasif dan fungsi tuntutan dalam ucapan Firaun.
- source_word: גַּם טַפְּכֶם
  choice: Anak-anak kalian pun
  rationale: גם menambahkan kelonggaran secara emfatis, dan טף dalam konteks ini menunjuk kepada anak-anak atau anggota keluarga yang masih kecil. Partikel 'pun' menyampaikan arti tambahan tersebut secara alami.
- source_word: יֵלֵךְ עִמָּכֶם
  choice: boleh pergi bersama kalian
  rationale: Secara bentuk berarti 'akan pergi bersama kalian', tetapi dalam konteks izin Firaun, modal 'boleh' menyampaikan fungsi pragmatis kalimat secara wajar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi Allah. 'Yahweh' mempertahankan nama itu melalui transliterasi tanpa menggantinya dengan gelar.
- issue: Makna עבד dalam perintah Firaun
  choice: beribadahlah kepada
  alternative: layanilah
  rationale: Kata עבד mempertahankan hubungan konseptual dengan pelayanan, tetapi ketika ditujukan kepada Allah dalam konteks perjalanan untuk mengadakan perayaan/ibadah, 'beribadah kepada' merupakan ungkapan Indonesia yang paling alami. Pilihan ini tidak menentukan bentuk ritual tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan jamak diterjemahkan dengan 'kalian' agar jumlah jamak dalam bentuk-bentuk Ibrani tetap jelas. Istilah ternak dibuat eksplisit demi kejelasan pembaca umum.
