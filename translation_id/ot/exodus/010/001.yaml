  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה בֹּ֖א אֶל פַּרְעֹ֑ה כִּֽי אֲנִ֞י הִכְבַּ֤דְתִּי אֶת לִבּ/וֹ֙ וְ/אֶת לֵ֣ב עֲבָדָ֔י/ו לְמַ֗עַן שִׁתִ֛/י אֹתֹתַ֥/י אֵ֖לֶּה בְּ/קִרְבּֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/001.yaml
  text: Then Yahweh said to Moses[a], "Go in to Pharaoh, because I have hardened his heart and the heart of his servants[b], so that I may set these signs of mine among them."
translation:
  language: id
  text: Kemudian Yahweh berfirman kepada Musa, “Pergilah menghadap Firaun, sebab Aku telah mengeraskan hatinya dan hati para pegawainya, supaya Aku dapat menempatkan tanda-tanda-Ku ini di tengah-tengah mereka.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di tengah-tengahnya.” Bentuk tunggal ini dapat mengacu khusus kepada Firaun atau, menurut konteks, kepada Firaun beserta para pegawai atau lingkungan istananya.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama pribadi ilahi yang diwakili Tetragramaton, bukan menggantinya dengan gelar.
- source_word: וַיֹּאמֶר
  choice: Kemudian ... berfirman
  rationale: Bentuk naratif ini melanjutkan urutan peristiwa; 'berfirman' merupakan padanan Indonesia yang wajar dan bermartabat ketika Allah menjadi subjek.
- source_word: בֹּא אֶל־פַּרְעֹה
  choice: Datanglah menghadap Firaun
  rationale: בוא dapat bermakna datang atau masuk; dalam konteks audiensi kerajaan, ungkapan ini secara alami menyatakan perintah untuk datang menghadap Firaun.
- source_word: כִּי
  choice: sebab
  rationale: Di sini כִּי memperkenalkan alasan bagi perintah sebelumnya.
- source_word: הִכְבַּדְתִּי
  choice: telah mengeraskan
  rationale: Secara harfiah bentuk ini berarti 'membuat berat', tetapi bersama 'hati' membentuk idiom tentang menjadikan seseorang keras atau tidak tanggap. Padanan ini mempertahankan atribusi langsung tindakan tersebut kepada Yahweh.
- source_word: לִבּוֹ ... לֵב עֲבָדָיו
  choice: hatinya dan hati para pegawainya
  rationale: '''Hati'' mempertahankan gambaran Ibrani tentang pusat kehendak dan pikiran; dalam lingkungan istana, עֲבָדָיו secara kontekstual menunjuk para pegawai atau pejabat Firaun.'
- source_word: לְמַעַן
  choice: supaya
  rationale: Menandai tujuan dengan ungkapan Indonesia yang alami.
- source_word: שִׁתִי
  choice: Aku menempatkan
  rationale: Mewakili arti dasar 'menaruh/menempatkan' tanpa menambahkan penafsiran tentang cara tanda-tanda itu dilakukan.
- source_word: אֹתֹתַי אֵלֶּה
  choice: tanda-tanda-Ku ini
  rationale: Mempertahankan baik akhiran kepunyaan orang pertama maupun kata penunjuk.
- source_word: בְּקִרְבּוֹ
  choice: di tengah-tengah mereka
  rationale: Terjemahan utama mengikuti cakupan kontekstual Firaun beserta kalangan istananya, sementara bentuk tunggal harfiahnya dan ambiguitas acuannya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Pengerasan hati Firaun oleh Allah
  choice: Aku telah mengeraskan hatinya
  alternative: Aku telah membuat hatinya berat
  rationale: Teks secara langsung mengatribusikan tindakan itu kepada Yahweh. Terjemahan tidak melunakkan pernyataan tersebut ataupun menyelesaikan ketegangan antara kedaulatan ilahi dan tanggung jawab manusia.
- issue: Acuan pronomina dalam בְּקִרְבּוֹ
  choice: di tengah-tengah mereka
  alternative: di tengah-tengahnya
  rationale: Bentuk Ibrani secara gramatikal tunggal dan dapat mengacu khusus kepada Firaun, tetapi konteks langsung menyebut Firaun dan para pegawainya. Ambiguitas ini dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. 'Datanglah menghadap' sesuai dengan konteks audiensi kerajaan; 'pegawai' dipilih daripada 'hamba' agar fungsi kalangan istana lebih jelas tanpa membatasi mereka hanya pada pejabat tinggi. Catatan kaki ditempatkan pada bagian yang memiliki ambiguitas pronominal nyata.
