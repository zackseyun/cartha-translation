id: EXO.10.26
reference: Exodus 10:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/גַם מִקְנֵ֜/נוּ יֵלֵ֣ךְ עִמָּ֗/נוּ לֹ֤א תִשָּׁאֵר֙ פַּרְסָ֔ה כִּ֚י מִמֶּ֣/נּוּ נִקַּ֔ח לַ/עֲבֹ֖ד אֶת יְהוָ֣ה אֱלֹהֵ֑י/נוּ וַ/אֲנַ֣חְנוּ לֹֽא נֵדַ֗ע מַֽה נַּעֲבֹד֙ אֶת יְהוָ֔ה עַד בֹּאֵ֖/נוּ שָֽׁמָּ/ה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/026.yaml
  text: And even our livestock will go with us; not a hoof will be left behind[a], for from them we must take to serve Yahweh our God, and we do not know with what we must serve Yahweh until we arrive there.
translation:
  language: id
  text: Bahkan ternak kami juga akan pergi bersama kami; tidak satu kuku pun akan tertinggal[a], sebab dari ternak itu kami akan mengambil untuk beribadah kepada Yahweh, Allah kami. Kami belum tahu dengan apa kami harus beribadah kepada Yahweh[b] sampai kami tiba di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak satu kuku pun.” Ungkapan ini menegaskan bahwa tidak ada satu pun dari ternak mereka yang akan ditinggalkan.
    reason: Mempertahankan dan menjelaskan citra penegasan dari פַּרְסָה.
  - marker: b
    text: Kata Ibrani yang diterjemahkan “beribadah” juga dapat berarti “melayani.” Dalam konteks ini, kedua makna berhubungan dengan pelayanan kepada Allah dalam ibadah.
    reason: Mendokumentasikan rentang makna עבד dan mempertahankan keterkaitan kedua kemunculannya.
lexical_decisions:
- source_word: מִקְנֵנוּ
  choice: ternak kami
  rationale: מִקְנֶה merupakan sebutan kolektif bagi hewan peliharaan sebagai milik; 'ternak' luas, alami, dan tidak membatasinya pada sapi.
- source_word: יֵלֵךְ עִמָּנוּ
  choice: akan pergi bersama kami
  rationale: Menyampaikan gerak dan penyertaan secara langsung dalam bahasa Indonesia modern.
- source_word: לֹא תִשָּׁאֵר פַּרְסָה
  choice: tidak seekor pun akan ditinggalkan
  rationale: Secara harfiah פַּרְסָה berarti 'kuku (belah)', tetapi ungkapan negatif ini menegaskan bahwa tidak satu pun hewan akan tertinggal. Terjemahan ini menyampaikan maksud idiom secara alami; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: כִּי מִמֶּנּוּ נִקַּח
  choice: sebab dari ternak itulah kami akan mengambil
  rationale: Ibrani secara langsung menyatakan 'darinya kami akan mengambil' tanpa objek yang disebutkan; terjemahan mempertahankan objek tersirat tersebut dan tidak menambahkan 'yang kami perlukan'.
- source_word: לַעֲבֹד אֶת יְהוָה אֱלֹהֵינוּ
  choice: untuk beribadah kepada Yahweh, Allah kami
  rationale: Dalam konteks pemilihan hewan untuk persembahan, עבד menunjuk pelayanan kepada Allah dalam ibadah. 'Beribadah' alami dalam bahasa Indonesia, sementara kemungkinan makna 'melayani' dipertahankan dalam catatan kaki.
- source_word: וַאֲנַחְנוּ לֹא נֵדַע
  choice: Kami belum tahu
  rationale: Bentuk Ibrani menyatakan ketidaktahuan yang berlangsung sampai tiba di tujuan; 'belum tahu' mengungkapkan hubungan temporal itu secara alami.
- source_word: מַה נַּעֲבֹד אֶת יְהוָה
  choice: dengan apa kami harus beribadah kepada Yahweh
  rationale: מַה dipahami secara instrumental berdasarkan konteks ternak yang akan dipilih; 'dengan apa' mempertahankan ketegangan konkret ini, sedangkan 'harus' menyampaikan keharusan kontekstual.
- source_word: עַד בֹּאֵנוּ שָׁמָּה
  choice: sampai kami tiba di sana
  rationale: בוא dengan שָׁמָּה menunjuk pada tibanya mereka di tempat tujuan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan agar nama pribadi dalam teks sumber tetap tampak dan tidak diganti dengan gelar.
theological_decisions:
- issue: Makna עבד dalam konteks persembahan dan ibadah
  choice: beribadah kepada Yahweh
  alternative: melayani Yahweh
  rationale: Konteks langsungnya ialah penggunaan ternak dalam ibadah, sehingga 'beribadah' paling jelas bagi pembaca Indonesia. Namun, karena עבד juga dapat berarti 'melayani', alternatif itu dicatat dan kedua kemunculan diterjemahkan secara konsisten.
- issue: Makna instrumental מַה
  choice: dengan apa kami harus beribadah
  alternative: bagaimana kami harus beribadah
  rationale: Penyebutan ternak dan pengambilan sebagian darinya mendukung arti instrumental, tetapi ungkapan tersebut tidak menetapkan terlebih dahulu hewan atau persembahan tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern, bermartabat, dan mudah dipahami. Struktur kalimat mengikuti alur argumentasi Ibrani, dengan pemisahan kalimat agar jelas. Marker [a] dicantumkan pada teks utama; catatan leksikal mengenai 'beribadah' tidak diberi marker [b] karena marker tersebut belum tercantum dalam teks utama.
