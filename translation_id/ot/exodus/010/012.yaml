base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/012.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand over the land of Egypt for the locusts, so that they may come up over the land of Egypt and eat every plant of the land[b], everything that the hail has left.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa, “Ulurkanlah tanganmu ke atas tanah Mesir berkenaan dengan belalang[a][b], supaya belalang itu naik ke atas tanah Mesir dan memakan segala tumbuhan di tanah itu, yakni semua yang ditinggalkan hujan es.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, frasa Ibrani dapat dipahami “untuk/sehubungan dengan belalang.” Fungsi preposisinya sulit dipastikan; terjemahan seperti “terhadap belalang” atau “di atas belalang” juga mungkin secara bentuk.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani untuk “belalang” berbentuk tunggal dan diikuti kata kerja tunggal, tetapi dipakai secara kolektif untuk seluruh kawanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: נְטֵה יָדְךָ
  choice: Ulurkanlah tanganmu
  rationale: Menyampaikan bentuk imperatif dan makna langsung נטה secara wajar dalam bahasa Indonesia modern.
- source_word: עַל אֶרֶץ מִצְרַיִם
  choice: ke atas tanah Mesir
  rationale: Mempertahankan gambaran gerakan tangan yang diarahkan meliputi wilayah Mesir serta pengulangan אֶרֶץ dalam ayat.
- source_word: בָּאַרְבֶּה
  choice: untuk mendatangkan belalang
  rationale: Preposisi ב di sini sulit ditentukan. Pilihan ini menyatakan fungsi gerakan Musa secara alami dalam konteks, sementara ketidakpastian bentuk Ibraninya dicatat dalam catatan kaki.
- source_word: אַרְבֶּה
  choice: belalang / kawanan itu
  rationale: Kata Ibrani berbentuk tunggal tetapi dipakai secara kolektif bagi kawanan belalang. Bahasa Indonesia dapat memakai 'belalang' secara kolektif, lalu 'kawanan itu' memperjelas acuannya.
- source_word: וְיַעַל עַל אֶרֶץ מִצְרַיִם
  choice: supaya kawanan itu naik ke seluruh tanah Mesir
  rationale: Menjaga makna dasar עלה, 'naik', sambil memakai 'ke seluruh' untuk menyampaikan gerakan kawanan yang meliputi wilayah tersebut.
- source_word: כָּל עֵשֶׂב הָאָרֶץ
  choice: segala tumbuhan di negeri itu
  rationale: עֵשֶׂב mencakup tumbuh-tumbuhan secara luas, bukan hanya rumput; 'negeri itu' menghindari pengulangan yang kaku tanpa menghilangkan acuan kepada Mesir.
- source_word: אֵת כָּל אֲשֶׁר הִשְׁאִיר הַבָּרָד
  choice: yaitu semua yang ditinggalkan oleh hujan es
  rationale: Menyampaikan apposisi penjelas dalam bahasa Indonesia dan mempertahankan hubungan dengan sisa tanaman sesudah tulah hujan es.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Mempertahankan nama diri ilahi yang terdapat dalam teks sumber tanpa menggantinya dengan gelar atau memasukkan penafsiran denominasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sedangkan ketidakpastian preposisi Ibrani dan pemakaian nomina kolektif dipertahankan melalui catatan kaki.
