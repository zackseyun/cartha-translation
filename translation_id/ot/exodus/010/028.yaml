language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּֽאמֶר ל֥/וֹ פַרְעֹ֖ה לֵ֣ךְ מֵ/עָלָ֑/י הִשָּׁ֣מֶר לְ/ךָ֗ אֶל תֹּ֨סֶף֙ רְא֣וֹת פָּנַ֔/י כִּ֗י בְּ/י֛וֹם רְאֹתְ/ךָ֥ פָנַ֖/י תָּמֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/028.yaml
  text: Then Pharaoh said to him[a], “Go away from me. Watch yourself; do not see my face again, for on the day you see my face[b], you will die.”
translation:
  language: id
  text: Lalu Firaun berkata kepadanya, “Pergilah dari hadapanku! Awas! Jangan melihat wajahku lagi[a], sebab pada hari engkau melihat wajahku[b], engkau akan mati.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jangan menambah untuk melihat wajahku”; ungkapan Ibrani ini berarti “jangan melihat wajahku lagi” atau “jangan pernah melihat wajahku lagi.”
    reason: lexical_alternative
  - marker: b
    text: “Wajahku” juga dapat dipahami sebagai “kehadiranku” atau “hadapanku”, tetapi teks Ibrani mengulang kata “wajah”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ פַרְעֹה
  choice: Lalu Firaun berkata kepadanya
  rationale: Bentuk naratif dengan waw memajukan urutan peristiwa; “lalu” menghasilkan alur bahasa Indonesia yang alami, sedangkan “kepadanya” mempertahankan pronomina Ibrani.
- source_word: לֵךְ מֵעָלַי
  choice: Pergilah dari hadapanku
  rationale: Menyampaikan perintah pengusiran secara tegas dan alami. “Dari hadapanku” sesuai dengan konteks larangan untuk kembali melihat wajah Firaun.
- source_word: הִשָּׁמֶר לְךָ
  choice: Awas!
  rationale: Imperatif Niphal dengan datif refleksif menyatakan peringatan langsung yang bernada ancaman. “Awas!” singkat, lazim, dan mempertahankan ketegasannya.
- source_word: אַל תֹּסֶף רְאוֹת פָּנַי
  choice: Jangan melihat wajahku lagi
  rationale: Konstruksi יסף dengan infinitif merupakan idiom yang berarti tidak melakukan sesuatu lagi. Terjemahan ini alami dalam bahasa Indonesia, sementara bentuk harfiahnya dijelaskan dalam catatan kaki.
- source_word: פָּנַי
  choice: wajahku
  rationale: “Wajah” mempertahankan citra dan pengulangan kata Ibrani; kemungkinan makna metonimis “kehadiranku” dicatat tanpa menghapus ambiguitas.
- source_word: בְּיוֹם רְאֹתְךָ פָנַי
  choice: pada hari engkau melihat wajahku
  rationale: Mempertahankan ungkapan temporal harfiah “pada hari” dan mengubah infinitif bersufiks menjadi klausa Indonesia yang wajar.
- source_word: תָּמוּת
  choice: engkau akan mati
  rationale: Menyampaikan ancaman kematian dengan bahasa Indonesia modern dan tegas tanpa nuansa arkais.
theological_decisions:
- issue: Apakah פָּנַי harus diterjemahkan sebagai wajah atau kehadiran
  choice: wajahku
  alternative: kehadiranku / hadapanku
  rationale: Teks mengulang kata “wajah” untuk menegaskan ancaman Firaun. Mempertahankan pengulangan itu menghindari penyelesaian diam-diam atas kemungkinan makna metonimisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat langsung dibuat tegas sesuai nada ancaman Firaun; “engkau” dipakai untuk menjaga register naratif kitab suci tanpa bentuk yang terlalu arkais.
