  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּאמְרוּ֩ עַבְדֵ֨י פַרְעֹ֜ה אֵלָ֗י/ו עַד מָתַי֙ יִהְיֶ֨ה זֶ֥ה לָ֨/נוּ֙ לְ/מוֹקֵ֔שׁ שַׁלַּח֙ אֶת הָ֣/אֲנָשִׁ֔ים וְ/יַֽעַבְד֖וּ אֶת יְהוָ֣ה אֱלֹהֵי/הֶ֑ם הֲ/טֶ֣רֶם תֵּדַ֔ע כִּ֥י אָבְדָ֖ה מִצְרָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/007.yaml
  text: Then Pharaoh’s servants said to him[a], “How long will this man be a snare to us? Send the men away so that they may serve Yahweh their God[e][d][c][b]. Do you not yet know that Egypt is ruined?”
translation:
  language: id
  text: Kemudian para pegawai Firaun berkata kepadanya, “Sampai kapan orang ini[a] akan menjadi jerat[b] bagi kita? Suruhlah para laki-laki itu[c] pergi supaya mereka melayani[d] Yahweh[e], Allah mereka. Belum tahukah engkau bahwa Mesir telah hancur?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “yang ini”; kata tunjuk Ibrani tersebut merujuk kepada Musa.
    reason: lexical_alternative
  - marker: b
    text: Atau “perangkap”.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “para laki-laki itu”; sebagian terjemahan memperluasnya menjadi “orang-orang” atau “umat”, tetapi kata Ibraninya secara khusus berbentuk maskulin jamak.
    reason: lexical_alternative
  - marker: d
    text: Atau “beribadah” atau “mengabdi kepada”; kata Ibrani ini dapat mencakup pelayanan sekaligus penyembahan kepada Allah.
    reason: lexical_alternative
  - marker: e
    text: Nama ilahi dalam bahasa Ibrani adalah YHWH; secara tradisional juga diterjemahkan sebagai “TUHAN”.
    reason: alternative_reading
lexical_decisions:
- source_word: עַבְדֵי
  choice: para pegawai
  rationale: Dalam konteks istana, kata ini menunjuk kepada para pelayan atau pegawai Firaun, kemungkinan orang-orang istana yang berkedudukan. “Para pegawai” lebih alami dalam bahasa Indonesia modern dan tidak memberi kesan bahwa mereka semata-mata budak.
- source_word: עַד מָתַי
  choice: Sampai kapan
  rationale: Ungkapan tanya waktu ini diterjemahkan secara idiomatis dan tetap mempertahankan nada desakan dalam bahasa Ibrani.
- source_word: זֶה
  choice: orang ini
  rationale: Kata tunjuk maskulin tunggal ini merujuk kepada Musa dalam konteks. Penambahan “orang” membuat acuannya jelas dan alami tanpa menyebut nama Musa secara eksplisit.
- source_word: לְמוֹקֵשׁ
  choice: menjadi jerat
  rationale: מוֹקֵשׁ berarti jerat atau perangkap. “Jerat” mempertahankan metafora sumber dan sesuai dengan ragam bahasa Alkitab yang tetap mudah dipahami.
- source_word: שַׁלַּח
  choice: Suruhlah ... pergi
  rationale: Bentuk imperatif ini meminta Firaun melepas atau menyuruh pergi kelompok tersebut. Ungkapan ini mengikuti susunan kalimat sumber dan terdengar alami dalam bahasa Indonesia.
- source_word: הָאֲנָשִׁים
  choice: para laki-laki itu
  rationale: Nomina ini secara khusus berbentuk dan bermakna maskulin jamak. Terjemahan ini mempertahankan unsur gender serta artikel tertentu dalam teks sumber.
- source_word: וְיַעַבְדוּ
  choice: supaya mereka beribadah
  rationale: Dalam hubungan dengan Allah, עבד dapat mencakup melayani, mengabdi, dan beribadah. “Beribadah” paling alami dalam konteks tujuan kepergian Israel, sementara cakupan makna lainnya dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dialihaksarakan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: הֲטֶרֶם תֵּדַע
  choice: Belum tahukah engkau
  rationale: 'Gabungan partikel tanya dan טֶרֶם menyampaikan teguran retoris: Firaun seharusnya sudah menyadari keadaan Mesir.'
- source_word: אָבְדָה
  choice: telah hancur
  rationale: Bentuk perfektif menggambarkan Mesir sebagai negeri yang sudah mengalami kehancuran akibat tulah-tulah, tanpa harus menyiratkan kemusnahan total.
- source_word: מִצְרָיִם
  choice: Mesir
  rationale: Padanan baku nama tempat; di sini menunjuk kepada negeri atau bangsa Mesir secara keseluruhan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu sebagai nama, bukan menggantinya dengan gelar.
- issue: Cakupan makna עבד ketika objeknya adalah Allah
  choice: beribadah
  alternative: melayani atau mengabdi kepada
  rationale: Kata Ibrani dapat memadukan pelayanan dan penyembahan. Dalam konteks permintaan agar Israel pergi untuk menjalankan kewajiban religius kepada Allah mereka, “beribadah” alami, tetapi alternatif leksikalnya tetap dicatat agar keluasan makna tidak hilang.
- issue: Gender pada הָאֲנָשִׁים
  choice: para laki-laki itu
  alternative: orang-orang itu atau umat itu
  rationale: Teks sumber memakai nomina yang khusus merujuk kepada laki-laki, sehingga terjemahan tidak menetralkannya menjadi “orang-orang” atau memperluasnya menjadi seluruh umat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan “engkau” mempertahankan bentuk tunggal kepada Firaun dan sesuai dengan dialog naratif. Metafora “jerat” serta teguran retoris pada akhir ayat dipertahankan.
