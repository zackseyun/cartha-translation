  text: For if you refuse to let my people go[a], behold[b], tomorrow I will bring locusts into your territory.
translation:
  language: id
  text: Sebab jika engkau menolak membiarkan umat-Ku pergi, lihatlah, besok Aku akan mendatangkan belalang[a] ke wilayahmu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “belalang” berbentuk tunggal, tetapi digunakan dengan makna kolektif.
    reason: lexical_alternative
  - marker: b
    text: Atau “ke dalam negerimu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Sebab, jika
  rationale: Gabungan ini memperkenalkan peringatan bersyarat yang berhubungan dengan ucapan sebelumnya; 'Sebab, jika' mempertahankan nuansa penjelas sekaligus syarat.
- source_word: מָאֵן
  choice: menolak
  rationale: Kata kerja ini menyatakan penolakan yang disengaja, bukan sekadar ketidakmampuan atau keraguan.
- source_word: לְשַׁלֵּחַ
  choice: membiarkan ... pergi
  rationale: Dalam konteks Keluaran, ungkapan ini secara alami menyatakan pemberian izin atau pembebasan agar umat itu pergi.
- source_word: עַמִּי
  choice: umat-Ku
  rationale: '''Umat-Ku'' merupakan ungkapan baku dan wajar dalam konteks relasi perjanjian, serta mempertahankan penekanan posesif.'
- source_word: הִנְנִי
  choice: ketahuilah
  rationale: Partikel ini menarik perhatian secara tegas dan khidmat kepada tindakan yang segera terjadi; 'ketahuilah' lebih alami dalam bahasa Indonesia modern daripada 'lihatlah' untuk ancaman ini.
- source_word: מֵבִיא
  choice: Aku akan mendatangkan
  rationale: Bentuk partisipial bersama הִנְנִי menyatakan tindakan yang akan segera terjadi. Bentuk futur ini jelas dan alami, sementara kedekatan waktunya ditegaskan oleh 'ketahuilah' dan 'besok'.
- source_word: מָחָר
  choice: besok
  rationale: Padanan langsung bagi keterangan waktu dalam teks Ibrani.
- source_word: אַרְבֶּה
  choice: belalang
  rationale: Walaupun berbentuk tunggal secara morfologis, kata ini digunakan secara kolektif. Dalam bahasa Indonesia, 'belalang' juga dapat berfungsi sebagai nomina kolektif dalam konteks tulah.
- source_word: בִּגְבֻלֶךָ
  choice: ke wilayahmu
  rationale: גְּבוּל dapat menunjuk batas maupun daerah yang dibatasi. 'Ke wilayahmu' sesuai dengan gerak yang tersirat dalam 'mendatangkan' tanpa mempersempit maknanya hanya pada garis perbatasan.
