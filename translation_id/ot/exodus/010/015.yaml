  text: וַ/יְכַ֞ס אֶת עֵ֣ין כָּל הָ/אָרֶץ֮ וַ/תֶּחְשַׁ֣ךְ הָ/אָרֶץ֒ וַ/יֹּ֜אכַל אֶת כָּל עֵ֣שֶׂב הָ/אָ֗רֶץ וְ/אֵת֙ כָּל פְּרִ֣י הָ/עֵ֔ץ אֲשֶׁ֥ר הוֹתִ֖יר הַ/בָּרָ֑ד וְ/לֹא נוֹתַ֨ר כָּל יֶ֧רֶק בָּ/עֵ֛ץ וּ/בְ/עֵ֥שֶׂב הַ/שָּׂדֶ֖ה בְּ/כָל אֶ֥רֶץ מִצְרָֽיִם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/015.yaml
  text: And it covered the face of the whole land[a], so that the land was darkened; and it ate every plant of the land and all the fruit of the trees that the hail had left. No green thing remained on the trees or on the plants of the field in all the land of Egypt.
translation:
  language: id
  text: Belalang-belalang itu menutupi seluruh permukaan negeri[a], sehingga negeri itu menjadi gelap. Mereka memakan segala tumbuhan di negeri itu dan segala buah dari pohon-pohon yang ditinggalkan oleh hujan es. Tidak ada lagi sesuatu pun yang hijau tersisa, baik pada pohon maupun pada tumbuhan di ladang, di seluruh negeri Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mata seluruh negeri,” suatu ungkapan bagi permukaan negeri yang terlihat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְכַס
  choice: Belalang-belalang itu menutupi
  rationale: Verba Ibrani berbentuk tunggal karena subjek kolektifnya adalah kawanan belalang dari konteks sebelumnya. Bahasa Indonesia lebih alami memakai bentuk jamak referensial “belalang-belalang itu” tanpa mengubah makna kolektif.
- source_word: עֵין כָּל הָאָרֶץ
  choice: seluruh permukaan negeri
  rationale: Secara harfiah berarti “mata seluruh negeri,” suatu ungkapan bagi permukaan negeri yang terlihat. “Permukaan negeri” menyampaikan idiom itu dengan jelas; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וַתֶּחְשַׁךְ הָאָרֶץ
  choice: sehingga negeri itu menjadi gelap
  rationale: Verba menyatakan keadaan menjadi gelap. “Sehingga” secara alami menunjukkan akibat dari tertutupnya permukaan negeri.
- source_word: וַיֹּאכַל
  choice: Mereka memakan
  rationale: Bentuk tunggal Ibrani melanjutkan subjek kolektif kawanan belalang. Pronomina jamak Indonesia merujuk secara alami kepada belalang-belalang tersebut, sementara “memakan” mempertahankan arti dasar tanpa penguatan tafsir.
- source_word: כָּל עֵשֶׂב הָאָרֶץ
  choice: segala tumbuhan di negeri itu
  rationale: עֵשֶׂב mencakup tumbuh-tumbuhan secara lebih luas daripada hanya rumput. “Segala tumbuhan” jelas dan sesuai dengan konteks pertanian.
- source_word: כָּל פְּרִי הָעֵץ
  choice: segala buah pada pohon
  rationale: Nomina tunggal עֵץ dapat berfungsi secara kolektif. Bentuk “pada pohon” tetap wajar dalam bahasa Indonesia dan mencakup pepohonan secara umum.
- source_word: אֲשֶׁר הוֹתִיר הַבָּרָד
  choice: yang masih disisakan oleh hujan es
  rationale: Frasa ini menunjuk kepada buah yang luput dari tulah hujan es sebelumnya. Bentuk pasif mempertahankan hubungan gramatikal dan makna sisa.
- source_word: וְלֹא נוֹתַר כָּל יֶרֶק
  choice: Tidak ada lagi sesuatu pun yang hijau
  rationale: Ungkapan ini mempertahankan negasi menyeluruh dan cakupan luas יֶרֶק, yakni apa pun yang hijau, bukan hanya satu jenis tanaman.
- source_word: בָּעֵץ וּבְעֵשֶׂב הַשָּׂדֶה
  choice: pada pohon ataupun di antara tumbuhan di ladang
  rationale: Terjemahan membedakan secara alami sesuatu yang melekat pada pohon dari kehijauan yang terdapat di antara tumbuhan ladang, sambil mempertahankan pasangan kedua ranah vegetasi.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: di seluruh negeri Mesir
  rationale: Ini merupakan ungkapan wilayah yang baku dan menyampaikan cakupan total secara ringkas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. “Negeri” dipakai untuk אֶרֶץ dalam konteks wilayah Mesir; rujukan eksplisit kepada belalang diambil dari konteks dekat agar subjek kolektifnya jelas dalam bahasa Indonesia. Catatan kaki mempertahankan metafora Ibrani yang tidak alami bila diterjemahkan mentah-mentah.
