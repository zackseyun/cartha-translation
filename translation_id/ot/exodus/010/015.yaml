revisions:
- from: Belalang-belalang itu menutupi seluruh permukaan negeri[a] sehingga negeri itu menjadi gelap. Mereka memakan segala tumbuhan di negeri itu dan segala buah pada pohon yang masih disisakan oleh hujan es. Tidak ada lagi sesuatu pun yang hijau pada pohon ataupun di antara tumbuhan di ladang di seluruh negeri Mesir.
  to: Belalang-belalang itu menutupi seluruh permukaan negeri[a], sehingga negeri itu menjadi gelap. Mereka memakan segala tumbuhan di negeri itu dan segala buah dari pohon-pohon yang ditinggalkan oleh hujan es. Tidak ada lagi sesuatu pun yang hijau tersisa, baik pada pohon maupun pada tumbuhan di ladang, di seluruh negeri Mesir.
  rationale: Revisi membetulkan hubungan preposisional pada frasa terakhir agar vegetasi ladang, bukan ruang di antaranya, menjadi rujukan. Aspek klausa tentang hujan es dibuat lebih sesuai dengan bentuk lampau Ibrani, dan 'buah dari pohon-pohon' dibuat lebih idiomatis sambil mempertahankan makna kolektif.
