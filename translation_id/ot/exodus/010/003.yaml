  text: וַ/יָּבֹ֨א מֹשֶׁ֣ה וְ/אַהֲרֹן֮ אֶל פַּרְעֹה֒ וַ/יֹּאמְר֣וּ אֵלָ֗י/ו כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י הָֽ/עִבְרִ֔ים עַד מָתַ֣י מֵאַ֔נְתָּ לֵ/עָנֹ֖ת מִ/פָּנָ֑/י שַׁלַּ֥ח עַמִּ֖/י וְ/יַֽעַבְדֻֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/003.yaml
  text: 'So Moses and Aaron went in to Pharaoh and said to him[a], “Thus says Yahweh, the God of the Hebrews: How long will you refuse to humble yourself before me? Let my people go[b], so that they may serve me.”'
translation:
  language: id
  text: 'Lalu Musa dan Harun menghadap Firaun dan berkata kepadanya, “Beginilah firman Yahweh, Allah orang Ibrani: Sampai kapan engkau menolak merendahkan dirimu di hadapan-Ku?[a] Biarkanlah umat-Ku pergi agar mereka melayani Aku.[b]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tunduk kepada-Ku.” Kata kerja Ibrani ini dapat berarti direndahkan atau merendahkan diri di hadapan Allah.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “beribadah kepada-Ku.” Kata kerja Ibrani ini juga mencakup pelayanan kultis atau ibadah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: menghadap
  rationale: Dalam konstruksi dengan אֶל־פַּרְעֹה, verba בוא menyatakan datang atau masuk ke hadapan Firaun. ‘Menghadap’ alami dalam konteks istana dan tidak menambahkan gagasan audiensi resmi secara berlebihan.
- source_word: כֹּה אָמַר
  choice: Beginilah firman
  rationale: Ungkapan ini mempertahankan formula utusan ilahi dengan ragam bahasa Indonesia yang wajar dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan secara langsung, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: Allah orang Ibrani
  rationale: Frasa konstruksi ini mengidentifikasi Yahweh sebagai Allah kelompok etnis yang dikenal sebagai orang Ibrani.
- source_word: עַד מָתַי מֵאַנְתָּ
  choice: Sampai kapan engkau menolak
  rationale: Bentuk perfektum menyatakan sikap penolakan yang telah berlangsung; ungkapan Indonesia ini mempertahankan tantangan temporal tersebut.
- source_word: לֵעָנֹת מִפָּנָי
  choice: merendahkan dirimu di hadapan-Ku
  rationale: Nifal ענה dalam konteks ini dapat menyatakan merendahkan diri atau tunduk. Pilihan utama mempertahankan citra kerendahan di hadapan Allah.
- source_word: שַׁלַּח עַמִּי
  choice: Biarkan umat-Ku pergi
  rationale: Ini merupakan padanan alami bagi tuntutan pelepasan yang berulang dalam kisah Keluaran.
- source_word: וְיַעַבְדֻנִי
  choice: agar mereka beribadah kepada-Ku
  rationale: Dalam konteks tuntutan untuk pergi dan mengadakan pelayanan kultis bagi Yahweh, ‘beribadah’ menyampaikan maksud עבד secara alami dalam bahasa Indonesia; catatan kaki mempertahankan arti yang lebih luas, ‘melayani’.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama diri ilahi. ‘Yahweh’ mempertahankan fungsi nama itu dan tidak menggantinya dengan gelar.
- issue: Makna לֵעָנֹת di hadapan Allah
  choice: merendahkan dirimu
  alternative: tunduk kepada-Ku atau membiarkan dirimu direndahkan
  rationale: Bentuk Ibrani memungkinkan nuansa direndahkan maupun merendahkan diri. Konteks teguran kepada Firaun mendukung makna refleksif, tetapi alternatif ‘tunduk’ tetap dicatat agar rentang maknanya tidak dihapus.
- issue: Makna וְיַעַבְדֻנִי dalam formula tuntutan Keluaran
  choice: beribadah kepada-Ku
  alternative: melayani Aku
  rationale: Konteks menunjukkan pelayanan kepada Yahweh yang bersifat kultis. ‘Beribadah’ alami bagi pembaca Indonesia, sedangkan catatan kaki menjaga arti umum verba עבד, yaitu melayani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. ‘Engkau’ dan enklitik ‘-Ku’ dipakai dalam ujaran ilahi. ‘Menghadap Firaun’ dipilih sebagai ungkapan alami untuk memasuki hadapan raja. Semua penanda catatan kaki muncul dalam teks utama.
