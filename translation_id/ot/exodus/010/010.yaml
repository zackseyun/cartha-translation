base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/010.yaml
  text: And he said to them[a], “May Yahweh indeed be with you, if I ever send you and your little ones out! See[b], for evil is before your faces.”
translation:
  language: id
  text: Firaun berkata kepada mereka[a], “Kiranya Yahweh menyertai kalian kalau aku sampai membiarkan kalian pergi bersama anak-anak kecil kalian! Lihatlah[b], kejahatan ada di hadapan kalian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yahweh menyertai kalian ketika aku membiarkan kalian pergi bersama anak-anak kecil kalian,” kemungkinan diucapkan dengan nada sarkastis.
    reason: alternative_reading
  - marker: b
    text: Ungkapan Ibrani ini ambigu; dapat berarti “malapetaka menghadang kalian” atau “kalian mempunyai niat jahat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Lalu Firaun berkata kepada mereka
  rationale: Subjek pronominal diperjelas sebagai Firaun berdasarkan konteks langsung agar wajar dalam bahasa Indonesia tanpa mengubah rujukannya.
- source_word: יְהִי כֵן יְהוָה עִמָּכֶם
  choice: Kiranya Yahweh menyertai kalian
  rationale: Bentuk yusif diterjemahkan sebagai harapan dengan “kiranya”; nada sarkastis Firaun dibiarkan muncul dari konteks.
- source_word: כַּאֲשֶׁר אֲשַׁלַּח אֶתְכֶם
  choice: kalau sampai aku membiarkan kalian pergi
  rationale: Dalam ucapan bermusuhan ini, כַּאֲשֶׁר bernuansa sindiran atau syarat. “Kalau sampai” menyampaikan ketidakmauan Firaun tanpa menjadikannya pernyataan netral tentang masa depan.
- source_word: טַפְּכֶם
  choice: anak-anak kecil kalian
  rationale: טַף terutama menunjuk kepada anak-anak yang masih kecil, bukan seluruh rumah tangga atau semua tanggungan.
- source_word: רְאוּ
  choice: Lihatlah
  rationale: Mempertahankan arti dasar imperatif ראה sekaligus memungkinkan pembaca menangkap fungsinya sebagai peringatan dalam konteks.
- source_word: כִּי רָעָה נֶגֶד פְּנֵיכֶם
  choice: kejahatan ada di hadapan kalian
  rationale: Terjemahan ini dekat dengan susunan Ibrani dan mempertahankan ambiguitas antara malapetaka yang menghadang dan niat jahat yang dituduhkan kepada mereka.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Nama pribadi ilahi ditransliterasikan sebagai Yahweh, konsisten dengan bentuk Ibrani dan kebijakan proyek.
- issue: Nada ucapan Firaun
  choice: Dipertahankan sebagai harapan bersyarat yang terdengar sarkastis
  alternative: “Yahweh menyertai kalian ketika aku membiarkan kalian pergi”
  rationale: Konteks menunjukkan bahwa Firaun bukan sungguh-sungguh memberkati atau menjanjikan pembebasan; terjemahan utama mempertahankan ironi tanpa menambahkan penjelasan ke dalam teks.
- issue: Ambiguitas רָעָה נֶגֶד פְּנֵיכֶם
  choice: kejahatan ada di hadapan kalian
  alternative: malapetaka menghadang kalian; kalian mempunyai niat jahat
  rationale: Bahasa Ibrani memungkinkan ancaman tentang bahaya maupun tuduhan tentang maksud jahat. Teks utama tidak menetapkan salah satu tafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai karena Firaun berbicara kepada Musa dan Harun. Ungkapan “kalau sampai” alami dalam bahasa Indonesia dan menyampaikan nada meremehkan atau sarkastis tanpa bahasa yang terlalu sehari-hari.
