    issue: Penambahan “hewan-hewan untuk”
    rationale: זְבָחִים berarti kurban/persembahan sembelihan, bukan secara eksplisit “hewan-hewan untuk” kurban. Walaupun konteks dapat melibatkan ternak, penambahan itu menyempitkan dan memperluas bentuk teks sumber secara bersamaan.
  - severity: medium
    issue: “supaya kami dapat mempersembahkannya” menggantikan koordinasi sumber
    rationale: וְעָשִׂינוּ secara langsung berbunyi “dan kami akan melakukan/mempersembahkan”. Klausa tujuan dengan “supaya” dan modal “dapat” menambahkan hubungan serta nuansa yang tidak perlu dinyatakan dalam bahasa Ibrani.
  revised_text: Namun Musa berkata, “Engkau juga harus memberikan kepada kami kurban sembelihan dan kurban bakaran, dan kami akan mempersembahkannya kepada Yahweh, Allah kami.”
