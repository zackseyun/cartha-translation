  yaml_path: translation/ot/exodus/010/025.yaml
  text: But Moses said[a], “You also must give into our hands sacrifices and burnt offerings, and we will offer them to Yahweh our God.”
translation:
  language: id
  text: Namun Musa berkata, “Engkau juga harus memberikan kepada kami kurban sembelihan dan kurban bakaran, dan kami akan mempersembahkannya kepada Yahweh, Allah kami.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Namun Musa berkata
  rationale: Waw konsekutif melanjutkan narasi, sedangkan konteks menunjukkan tanggapan yang berlawanan dengan pembatasan Firaun pada ayat sebelumnya; 'Namun' menyampaikan hubungan itu secara alami.
- source_word: גַּם אַתָּה
  choice: Engkau juga
  rationale: גַּם bersifat aditif dan pronomina mandiri אַתָּה memberi penekanan pada Firaun sebagai pihak yang juga harus menyediakan hewan kurban.
- source_word: תִּתֵּן בְּיָדֵנוּ
  choice: harus menyerahkan kepada kami
  rationale: נתן berarti memberi atau menempatkan, dan ungkapan בְּיָדֵנוּ secara harfiah berarti 'ke dalam tangan kami'. Dalam bahasa Indonesia modern, 'menyerahkan kepada kami' mempertahankan gagasan pemindahan ke dalam penguasaan mereka tanpa ungkapan yang kaku.
- source_word: זְבָחִים
  choice: hewan-hewan untuk kurban sembelihan
  rationale: זֶבַח menunjuk pada kurban yang disembelih. Penambahan 'hewan-hewan untuk' sesuai konteks, sebab Firaun diminta menyediakan ternak yang dapat dipersembahkan, dan membedakannya dari עֹלוֹת.
- source_word: וְעֹלֹת
  choice: dan kurban bakaran
  rationale: עֹלָה adalah persembahan yang dibakar seluruhnya; 'kurban bakaran' merupakan padanan Indonesia yang ringkas dan lazim.
- source_word: וְעָשִׂינוּ
  choice: supaya kami dapat mempersembahkannya
  rationale: Secara harfiah verba ini berarti 'dan kami akan membuat/melakukannya', tetapi dalam konteks kurban berarti melaksanakan atau mempersembahkan kurban. Bentuk ini mengungkapkan tujuan praktis dari penyerahan hewan tersebut.
- source_word: לַיהוָה אֱלֹהֵינוּ
  choice: kepada Yahweh, Allah kami
  rationale: Preposisi ל menandai penerima persembahan, sedangkan nama ilahi יהוה dipertahankan sebagai 'Yahweh' dan אֱלֹהֵינוּ diterjemahkan langsung sebagai 'Allah kami'.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani menyebut nama perjanjian יהוה secara langsung. Bentuk 'Yahweh' mempertahankan nama tersebut dan membedakannya dari gelar אֲדֹנָי, tanpa menambahkan penafsiran denominasi.
- issue: Hubungan antara pemberian Firaun dan persembahan Israel
  choice: supaya kami dapat mempersembahkannya
  alternative: dan kami akan mempersembahkannya
  rationale: Waw sebelum וְעָשִׂינוּ dapat dipahami sebagai kelanjutan hasil atau tujuan dalam konteks ini. Terjemahan yang dipilih membuat hubungan pragmatisnya jelas, tetapi tidak menyatakan bahwa Firaun sendiri mempersembahkan kurban.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Engkau' dipakai dalam dialog langsung untuk mempertahankan penekanan pronomina tunggal tanpa menjadi kasar. Istilah ritual 'kurban sembelihan' dan 'kurban bakaran' dibedakan dengan jelas.
