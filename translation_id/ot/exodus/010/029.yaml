base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/029.yaml
  text: And Moses said[a], “As you have spoken[b], I will not again see your face.”
translation:
  language: id
  text: Lalu Musa berkata, “Seperti yang telah engkau katakan,[a] aku tidak akan melihat wajahmu lagi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Demikianlah seperti yang engkau katakan,” atau, “Baiklah, seperti katamu.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk naratif wayyiqtol melanjutkan alur dan memperkenalkan jawaban Musa; “lalu” wajar dalam narasi Indonesia tanpa memberi penafsiran berlebihan.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk baku nama מֹשֶׁה dalam bahasa Indonesia.
- source_word: כֵּן דִּבַּרְתָּ
  choice: Seperti yang telah engkau katakan
  rationale: Ungkapan ini menyatakan persetujuan terhadap perkataan Firaun; terjemahan tersebut mempertahankan nuansa “demikian/seperti yang kaukatakan” dan bentuk tutur yang khidmat.
- source_word: לֹא אֹסִף עוֹד
  choice: aku tidak akan ... lagi
  rationale: Konstruksi negatif dengan bentuk Hifil יסף dan עוֹד berarti tindakan itu tidak akan diulangi; ungkapan Indonesia ini alami dan tidak menambahkan penekanan yang tidak perlu.
- source_word: רְאוֹת פָּנֶיךָ
  choice: melihat wajahmu
  rationale: Mempertahankan ungkapan konkret Ibrani secara langsung; dalam konteks ini maksudnya berjumpa atau menghadap Firaun lagi.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Pronomina “engkau” dipakai untuk mempertahankan sapaan orang kedua tunggal dan nada dialog langsung. Tanda kaki ditempatkan setelah klausa yang memiliki kemungkinan terjemahan alternatif.
