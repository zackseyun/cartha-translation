base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/013.yaml
  text: So Moses stretched out his staff over the land of Egypt[a], and Yahweh drove an east wind over the land all that day and all the night. When morning came, the east wind had brought the locusts.
translation:
  language: id
  text: Lalu Musa mengulurkan tongkatnya di atas tanah Mesir, dan Yahweh menggerakkan angin timur melintasi negeri itu sepanjang hari itu dan sepanjang malam. Ketika pagi tiba, angin timur telah membawa belalang-belalang itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּט
  choice: mengulurkan
  rationale: Kata kerja נטה berarti mengulurkan atau membentangkan; bersama tongkat, 'mengulurkan' alami dalam bahasa Indonesia dan sesuai dengan pola kisah tulah.
- source_word: מַטֵּהוּ
  choice: tongkatnya
  rationale: מַטֶּה dapat berarti tongkat atau gada; 'tongkat' paling jelas dan lazim untuk alat yang digunakan Musa.
- source_word: עַל אֶרֶץ מִצְרַיִם
  choice: ke atas tanah Mesir
  rationale: עַל menggambarkan arah atau posisi gerakan tongkat terhadap wilayah Mesir; 'ke atas' mempertahankan gerak verba dan terdengar alami.
- source_word: נִהַג
  choice: menggerakkan
  rationale: נהג berarti menggiring, memimpin, atau menggerakkan. Dengan angin sebagai objek, 'menggerakkan' menyatakan tindakan aktif Yahweh tanpa menyiratkan bahwa Ia sendiri bertiup.
- source_word: רוּחַ קָדִים
  choice: angin timur
  rationale: Ungkapan ini menunjuk pada angin yang datang dari timur; 'angin timur' merupakan padanan Indonesia yang ringkas dan alami.
- source_word: בָּאָרֶץ
  choice: melintasi negeri itu
  rationale: Dalam konteks gerakan angin, 'melintasi' menyampaikan pergerakan di seluruh wilayah; 'negeri itu' merujuk kembali kepada Mesir tanpa pengulangan yang kaku.
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלָּיְלָה
  choice: sepanjang hari itu dan sepanjang malam
  rationale: Pengulangan כָּל dipertahankan dengan 'sepanjang', sedangkan bentuk Indonesia ini menyatakan durasi penuh secara alami.
- source_word: הַבֹּקֶר הָיָה
  choice: Ketika pagi tiba
  rationale: Secara harfiah ungkapan ini menyatakan bahwa pagi telah datang; terjemahan ini mempertahankan peralihan waktunya secara wajar.
- source_word: נָשָׂא אֶת הָאַרְבֶּה
  choice: telah membawa belalang-belalang itu
  rationale: נשא menyatakan bahwa angin membawa kawanan belalang. 'Telah membawa' memperjelas bahwa pembawaan itu berlangsung sebelum atau hingga pagi tiba.
- source_word: הָאַרְבֶּה
  choice: belalang-belalang itu
  rationale: Bentuk tunggal Ibrani dipakai secara kolektif; bentuk ulang Indonesia mengungkapkan banyaknya serangga, sementara 'itu' mencerminkan ke definitan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יְהוָה; 'Yahweh' mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Struktur temporal serta tindakan aktif Yahweh dipertahankan tanpa memperberat kalimat.
