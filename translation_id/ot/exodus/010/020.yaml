  yaml_path: translation/ot/exodus/010/020.yaml
  text: But Yahweh hardened Pharaoh’s heart[b][a], and he did not let the sons of Israel go.
translation:
  language: id
  text: Namun, Yahweh mengeraskan hati Firaun[a], dan ia tidak membiarkan orang Israel pergi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “meneguhkan hati Firaun” atau “membuat hati Firaun kuat”; kata kerja Ibrani ini pada dasarnya berarti “membuat kuat” atau “membuat teguh.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak-anak Israel”; dapat juga diterjemahkan “keturunan Israel.” Ungkapan Ibrani ini menunjuk kepada umat Israel secara keseluruhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: mengeraskan
  rationale: Bentuk kausatif dari חזק secara harfiah berkaitan dengan membuat kuat atau teguh. Dalam rumusan berulang tentang Firaun, “mengeraskan” menyampaikan bahwa keteguhan perlawanannya menjadi kukuh, tanpa mengaburkan bahwa Yahweh adalah pelaku tindakan itu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap terlihat.
- source_word: לֵב
  choice: hati
  rationale: “Hati” merupakan padanan alami bagi לֵב dan dalam idiom Ibrani mencakup kehendak, tekad, serta batin seseorang.
- source_word: פַּרְעֹה
  choice: Firaun
  rationale: Bentuk baku bahasa Indonesia untuk gelar penguasa Mesir.
- source_word: וְלֹא שִׁלַּח
  choice: sehingga ia tidak membiarkan ... pergi
  rationale: Dalam konteks pembebasan Israel, שׁלח paling alami berarti membiarkan atau melepaskan mereka pergi. Hubungan “sehingga” menyatakan hasil naratif dari pengerasan hati, sementara subjek “ia” secara wajar menunjuk kepada Firaun.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Ungkapan ini mempertahankan gagasan hubungan asal-usul dalam בני ישראל sekaligus mencakup seluruh umat, bukan hanya laki-laki, dan terdengar alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Tindakan ilahi dalam pengerasan hati Firaun
  choice: Yahweh mengeraskan hati Firaun
  alternative: Yahweh meneguhkan hati Firaun
  rationale: Teks secara eksplisit menjadikan Yahweh pelaku. Terjemahan tidak melunakkan tindakan ilahi maupun menambahkan penjelasan tentang tanggung jawab manusia atau predestinasi yang tidak dinyatakan dalam ayat ini.
- issue: Hubungan tindakan Yahweh dengan penolakan Firaun
  choice: sehingga ia tidak membiarkan keturunan Israel pergi
  alternative: dan ia tidak membiarkan keturunan Israel pergi
  rationale: Konjungsi Ibrani ו dapat menyampaikan kelanjutan atau akibat dalam konteks. “Sehingga” menghasilkan bahasa Indonesia yang alami dan mengungkapkan alur akibat yang tersirat, sedangkan terjemahan yang lebih formal dengan “dan” dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dibuat alami bagi pembaca umum sambil mempertahankan nama Yahweh, metafora “hati”, tindakan ilahi yang eksplisit, dan ketegangan teologis teks.
