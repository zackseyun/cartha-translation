base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/005.yaml
  text: And it will cover the surface of the land[a], so that one will not be able to see the land; and it will eat what remains of the survivors left to you from the hail[b], and it will eat every tree growing for you out of the field.
translation:
  language: id
  text: Belalang-belalang itu akan menutupi permukaan tanah[a] sehingga orang tidak akan dapat melihat tanah. Mereka akan memakan sisa tanaman yang lolos dari hujan es dan masih tersisa bagi kalian[b]. Mereka juga akan memakan setiap pohon yang tumbuh bagi kalian di ladang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mata tanah”, sebuah ungkapan Ibrani untuk permukaan tanah yang tampak.
    reason: lexical_alternative
  - marker: b
    text: Atau, “sisa dari apa yang lolos, yang masih tersisa bagi kalian setelah hujan es.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְכִסָּה
  choice: akan menutupi
  rationale: Bentuk perfek berwaw dalam konteks nubuat berurutan menyatakan tindakan yang akan datang. Kata kerja כסה berarti menutupi atau menyembunyikan.
- source_word: עֵין הָאָרֶץ
  choice: permukaan tanah
  rationale: Secara harfiah berarti 'mata tanah', sebuah idiom Ibrani yang menunjuk pada permukaan tanah yang tampak.
- source_word: וְלֹא יוּכַל לִרְאֹת אֶת הָאָרֶץ
  choice: sehingga orang tidak akan dapat melihat tanah
  rationale: Subjek tunggal tak tentu dalam bahasa Ibrani dipertahankan secara alami dengan 'orang', tanpa mengubah 'tanah' menjadi subjek gramatikal.
- source_word: וְאָכַל
  choice: mereka akan memakan
  rationale: אכל adalah kata biasa untuk 'makan'. Bentuk Ibrani tunggal mengacu secara kolektif kepada kawanan belalang; bahasa Indonesia lebih alami memakai pronomina jamak setelah 'belalang-belalang'.
- source_word: יֶתֶר הַפְּלֵטָה הַנִּשְׁאֶרֶת
  choice: sisa tanaman yang lolos ... dan masih tertinggal
  rationale: Ungkapan ini menunjuk pada sisa hasil tanaman yang luput dari kehancuran akibat hujan es. Penambahan 'tanaman' memperjelas referen tak bernyawa dari konteks tanpa memakai 'orang-orang yang selamat'.
- source_word: הַנִּשְׁאֶרֶת לָכֶם מִן הַבָּרָד
  choice: yang lolos dari hujan es dan masih tertinggal bagi kalian
  rationale: Terjemahan ini mempertahankan gagasan bahwa sebagian tanaman masih tersisa bagi orang Mesir setelah bencana hujan es.
- source_word: כָּל הָעֵץ
  choice: setiap pohon
  rationale: כל dengan nomina tunggal kolektif wajar diterjemahkan secara distributif sebagai 'setiap pohon'.
- source_word: הַצֹּמֵחַ לָכֶם מִן הַשָּׂדֶה
  choice: yang tumbuh bagi kalian di ladang
  rationale: צמח berarti tumbuh atau bertunas. Frasa לָכֶם dipertahankan sebagai 'bagi kalian', sedangkan מן dalam konteks pertumbuhan tanaman dinyatakan secara alami sebagai lokasi 'di ladang'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Belalang-belalang itu' dinyatakan eksplisit dari konteks ayat sebelumnya agar rujukan subjek kolektif jelas; pronomina jamak dipakai secara alami dalam bahasa Indonesia. 'Kalian' mempertahankan bentuk orang kedua jamak.
