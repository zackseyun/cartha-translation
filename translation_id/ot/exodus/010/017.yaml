    rationale: Frasa 'menyingkirkan dariku hanya maut ini' terasa kaku. 'Menjauhkan maut ini saja dariku' lebih alami dan tetap menyatakan bahwa yang dimohonkan untuk disingkirkan ialah 'maut ini' saja.
