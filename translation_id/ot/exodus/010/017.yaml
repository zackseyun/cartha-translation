  text: וְ/עַתָּ֗ה שָׂ֣א נָ֤א חַטָּאתִ/י֙ אַ֣ךְ הַ/פַּ֔עַם וְ/הַעְתִּ֖ירוּ לַ/יהוָ֣ה אֱלֹהֵי/כֶ֑ם וְ/יָסֵר֙ מֵֽ/עָלַ֔/י רַ֖ק אֶת הַ/מָּ֥וֶת הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/017.yaml
  text: So now[a], please forgive my sin just this once, and plead with Yahweh your God[b], that he may remove from me this death only.
translation:
  language: id
  text: Maka sekarang, ampunilah kiranya dosaku, hanya kali ini saja, dan mohonlah dengan sungguh-sungguh kepada Yahweh, Allah kalian, agar Dia menjauhkan maut ini[a] saja dariku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “maut ini.” Yang dimaksud kemungkinan besar ialah bencana belalang yang sedang berlangsung beserta akibatnya yang mematikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Jadi sekarang
  rationale: Menyampaikan penghubung wacana sekaligus keterangan waktu yang membuka permohonan mendesak Firaun.
- source_word: שָׂא נָא חַטָּאתִי
  choice: ampunilah kiranya dosaku
  rationale: Dengan 'dosa' sebagai objek, נָשָׂא merupakan idiom mengangkat atau menanggung dosa, yakni mengampuni; 'kiranya' mempertahankan nada permohonan נָא.
- source_word: אַךְ הַפַּעַם
  choice: hanya kali ini saja
  rationale: Mempertahankan pembatasan kuat pada permintaan Firaun untuk kesempatan ini saja.
- source_word: וְהַעְתִּירוּ
  choice: dan mohonlah dengan sungguh-sungguh
  rationale: Bentuk ini menyatakan permohonan doa yang mendesak; terjemahan ini alami dan tidak mengharuskan istilah teknis 'berdoa syafaat'.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: kepada Yahweh, Allahmu
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh'; sufiks orang kedua jamak pada אֱלֹהֵיכֶם dipertahankan secara semantis sebagai sapaan kolektif kepada Musa dan Harun, yang dalam bahasa Indonesia berbentuk 'Allahmu' tanpa membedakan jumlah.
- source_word: וְיָסֵר מֵעָלַי
  choice: supaya Dia menyingkirkan dariku
  rationale: Klausa ini wajar dipahami sebagai tujuan atau hasil yang diharapkan dari permohonan kepada Yahweh.
- source_word: רַק אֶת־הַמָּוֶת הַזֶּה
  choice: hanya maut ini
  rationale: Mempertahankan ungkapan Ibrani yang tajam dan tidak menafsirkannya secara lebih sempit sebagai wabah belalang atau akibatnya.
theological_decisions:
- issue: Penerjemahan nama יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה secara langsung; 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Rujukan ungkapan 'maut ini'
  choice: Dibiarkan sebagai 'maut ini'
  alternative: wabah maut ini
  rationale: Konteks mengarah pada bencana belalang dan dampak mematikannya, tetapi teks tidak secara eksplisit mengatakan 'wabah'; ambiguitas dan daya ungkap aslinya dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kiranya' dipakai secara terbatas untuk menyampaikan partikel permohonan, sedangkan 'mohonlah dengan sungguh-sungguh' menjaga urgensi tanpa terdengar arkais. Penanda catatan kaki [a] ditempatkan langsung setelah ungkapan yang dijelaskan.
