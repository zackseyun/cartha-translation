  verdict: revise
  source_fidelity: Draf dengan tepat menerjemahkan permohonan Firaun, pengampunan atas dosa tunggalnya, pembatasan 'kali ini saja', doa permohonan kepada Yahweh, dan ungkapan sengaja literal 'maut ini'. Namun, אֱלֹהֵיכֶם berakhiran orang kedua jamak dan perlu diterjemahkan sebagai 'Allah kalian', bukan 'Allahmu'.
  naturalness: Susunan 'supaya Dia menyingkirkan dariku hanya maut ini' kurang alami dalam bahasa Indonesia. Menempatkan objek sebelum keterangan asal, 'menjauhkan maut ini saja dariku', lebih lancar sambil mempertahankan pembatas רַק.
  terminology: '''Yahweh'' sesuai dengan nama ilahi יהוה. ''Maut ini'' mempertahankan istilah Ibrani tanpa mempersempitnya menjadi ''wabah''. ''Allah kalian'' secara jelas mempertahankan jarak Firaun sekaligus sapaan jamak kepada Musa dan Harun.'
