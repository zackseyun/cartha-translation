base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/009.yaml
  text: Moses said, “We will go with our young and our old; we will go with our sons and our daughters, with our flocks and our herds, because we must hold a feast to the LORD.”
translation:
  language: id
  text: Musa berkata, “Kami akan pergi bersama orang-orang muda dan orang-orang tua kami; kami akan pergi bersama anak-anak lelaki dan perempuan kami, juga bersama kawanan domba, kambing, dan sapi kami, sebab kami harus mengadakan perayaan bagi TUHAN.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בִּנְעָרֵינוּ וּבִזְקֵנֵינוּ
  choice: bersama orang-orang muda dan orang-orang tua kami
  rationale: Mempertahankan pasangan merismatik muda–tua yang menunjukkan seluruh kelompok umur dengan bahasa Indonesia yang alami.
- source_word: בְּבָנֵינוּ וּבִבְנוֹתֵנוּ
  choice: bersama anak-anak lelaki dan perempuan kami
  rationale: Menyampaikan pembedaan eksplisit antara anak lelaki dan anak perempuan dalam teks Ibrani.
- source_word: בְּצֹאנֵנוּ וּבִבְקָרֵנוּ
  choice: bersama kawanan domba, kambing, dan sapi kami
  rationale: צֹאן mencakup ternak kecil, terutama domba dan kambing, sedangkan בָּקָר menunjuk ternak besar atau sapi; perincian ini menghindari penyempitan makna.
- source_word: כִּי חַג יְהוָה לָנוּ
  choice: sebab kami harus mengadakan perayaan bagi TUHAN
  rationale: Dalam konteks tuntutan Musa, konstruksi nominal ini secara wajar menyatakan alasan dan kewajiban untuk merayakan hari raya bagi YHWH; 'TUHAN' mengikuti konvensi terjemahan Indonesia untuk nama ilahi.
theological_decisions:
- issue: Makna חַג יְהוָה לָנוּ
  choice: kami harus mengadakan perayaan bagi TUHAN
  alternative: ada perayaan TUHAN bagi kami
  rationale: Pilihan utama lebih alami dalam bahasa Indonesia dan sesuai dengan konteks perjalanan untuk beribadah, tanpa menentukan lebih jauh bentuk atau tata perayaannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “kami akan pergi” dipertahankan untuk mencerminkan penegasan retoris teks Ibrani. Istilah “perayaan” dipilih karena lebih mudah dipahami pembaca umum daripada “hari raya”, sambil tetap menyampaikan חַג sebagai perayaan keagamaan.
