base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/019.yaml
  text: And Yahweh turned a very strong west wind[a], and it carried away the locusts and drove them into the Sea of Reeds[b]. Not one locust remained in all the territory of Egypt.
translation:
  language: id
  text: Lalu Yahweh mengubah arah angin menjadi angin barat[a] yang sangat kuat. Angin itu membawa pergi belalang-belalang itu dan menghalaukannya ke Laut Teberau[b]. Tidak seekor belalang pun tersisa di seluruh wilayah Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “angin laut”, yaitu angin yang datang dari arah laut; dalam konteks geografis Mesir, ini berarti angin barat.'
    reason: cultural_note
  - marker: b
    text: 'Ibrani: Yam Suf, “Laut Teberau”; secara tradisional disebut “Laut Merah”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּהֲפֹךְ יְהוָה רוּחַ יָם חָזָק מְאֹד
  choice: Lalu Yahweh mengubah arah angin menjadi angin barat yang sangat kuat
  rationale: הפך menyatakan perubahan atau pembalikan; dalam konteks ini, ungkapan tersebut paling alami dipahami sebagai perubahan arah angin. רוּחַ יָם secara harfiah adalah 'angin laut', yakni angin yang datang dari arah laut; dalam letak geografis Mesir, ini menunjuk pada angin barat. 'Sangat kuat' mencerminkan חָזָק מְאֹד secara langsung.
- source_word: וַיִּשָּׂא אֶת־הָאַרְבֶּה
  choice: Angin itu mengangkat belalang-belalang tersebut
  rationale: נשא berarti mengangkat atau membawa. 'Mengangkat' mempertahankan gambaran bahwa angin menerbangkan kawanan belalang, sedangkan bentuk ulang menyampaikan pengertian kolektif הָאַרְבֶּה dalam bahasa Indonesia.
- source_word: וַיִּתְקָעֵהוּ יָמָּה סּוּף
  choice: dan menghanyutkannya ke Laut Teberau
  rationale: תקע di sini menggambarkan angin yang memaksa atau melemparkan kawanan itu ke laut. 'Menghanyutkannya' alami untuk gerakan oleh angin menuju laut. Sufiks tunggal Ibrani memandang kawanan belalang secara kolektif, sehingga '-nya' dipertahankan. יָם־סוּף diterjemahkan 'Laut Teberau', padanan Indonesia yang mencerminkan nama Ibrani secara lebih dekat daripada sebutan tradisional 'Laut Merah'.
- source_word: לֹא נִשְׁאַר אַרְבֶּה אֶחָד
  choice: Tidak seekor belalang pun tersisa
  rationale: Rumusan ini mempertahankan penegasan אֶחָד ('satu pun') dan memakai penggolong alami bagi hewan dalam bahasa Indonesia.
- source_word: בְּכֹל גְּבוּל מִצְרָיִם
  choice: di seluruh wilayah Mesir
  rationale: גְּבוּל di sini menunjuk pada seluruh kawasan di dalam batas-batas Mesir; 'wilayah' tepat dan alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama diri ilahi, bukan gelar. 'Yahweh' mempertahankan fungsi nama itu tanpa menggantinya dengan gelar atau memilih bentuk tradisional lain.
- issue: Penerjemahan nama tempat יָם־סוּף
  choice: Laut Teberau
  alternative: Laut Merah
  rationale: Pilihan utama mengikuti unsur סוּף, yang berkaitan dengan teberau atau tumbuhan gelagah air. Sebutan tradisional 'Laut Merah' dicatat agar pembaca dapat mengenali nama yang lazim.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat pertama dipecah agar rujukan subjek angin jelas dan alurnya mudah dibaca. Semua penanda catatan kaki ditempatkan langsung setelah istilah yang dijelaskan.
