  text: וַ/יְחַזֵּ֥ק יְהוָ֖ה אֶת לֵ֣ב פַּרְעֹ֑ה וְ/לֹ֥א אָבָ֖ה לְ/שַׁלְּחָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/027.yaml
  text: But Yahweh hardened Pharaoh’s heart[b][a], and he was not willing to let them go.
translation:
  language: id
  text: Namun, Yahweh mengeraskan hati Firaun[a], dan Firaun tidak bersedia membiarkan mereka pergi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membuat hati Firaun teguh/kuat.” Kata kerja Ibrani ini dapat berarti “menguatkan” atau “membuat teguh,” tetapi bersama kata “hati” dalam konteks ini mengandung makna “mengeraskan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “Firaun menolak membiarkan mereka pergi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַזֵּק
  choice: mengeraskan
  rationale: Kata חזק pada dasarnya dapat berarti membuat kuat atau teguh, tetapi dalam rumusan berulang tentang hati Firaun, kata ini secara idiomatis menyatakan pengerasan atau peneguhan tekad. “Mengeraskan” paling jelas dan wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks sumber dipertahankan dan tidak diganti dengan gelar.
- source_word: לֵב
  choice: hati
  rationale: “Hati” mempertahankan idiom Ibrani dan dalam konteks ini mencakup kehendak serta sikap batin.
- source_word: פַּרְעֹה
  choice: Firaun
  rationale: “Firaun” adalah bentuk baku dalam bahasa Indonesia untuk gelar kerajaan Mesir ini.
- source_word: לֹא אָבָה
  choice: tidak bersedia
  rationale: Ungkapan ini secara langsung menyatakan ketiadaan kemauan atau persetujuan. “Tidak bersedia” mempertahankan unsur kehendak tanpa memperkuatnya menjadi parafrasa.
- source_word: לְשַׁלְּחָם
  choice: membiarkan mereka pergi
  rationale: Dalam konteks keluaran Israel dari Mesir, שׁלח berarti mengizinkan atau melepaskan mereka untuk pergi. Pilihan ini alami dan mempertahankan ungkapan berulang dalam kisah tersebut.
theological_decisions:
- issue: Pengerasan oleh Allah dan kehendak manusia
  choice: 'Kedua klausa diterjemahkan secara langsung: Yahweh mengeraskan hati Firaun, dan Firaun tidak bersedia membiarkan mereka pergi.'
  alternative: Yahweh meneguhkan hati Firaun sehingga ia menolak membiarkan mereka pergi.
  rationale: Teks Ibrani secara eksplisit menyatakan tindakan Yahweh, lalu ketidaksediaan Firaun. Terjemahan mempertahankan ketegangan antara tindakan ilahi dan kehendak Firaun tanpa mengubah hubungan kedua klausa menjadi sebab-akibat yang eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Subjek “Firaun” diulangi pada klausa kedua untuk menghindari ambiguitas pronomina dalam bahasa Indonesia. Konjungsi וְ diterjemahkan “dan” agar hubungan antarklausa tetap koordinatif dan tidak ditafsirkan sebagai akibat eksplisit.
