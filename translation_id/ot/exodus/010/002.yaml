id: EXO.10.2
reference: Exodus 10:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/לְמַ֡עַן תְּסַפֵּר֩ בְּ/אָזְנֵ֨י בִנְ/ךָ֜ וּ/בֶן בִּנְ/ךָ֗ אֵ֣ת אֲשֶׁ֤ר הִתְעַלַּ֨לְתִּי֙ בְּ/מִצְרַ֔יִם וְ/אֶת אֹתֹתַ֖/י אֲשֶׁר שַׂ֣מְתִּי בָ֑/ם וִֽ/ידַעְתֶּ֖ם כִּי אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/002.yaml
  text: so that you may tell in the hearing of your son and of your grandson how I dealt harshly with Egypt[a], and my signs that I placed among them[b], and so that you may know that I am Yahweh.
translation:
  language: id
  text: supaya engkau menceritakan kepada anakmu dan cucumu bagaimana Aku memperlakukan Mesir dengan keras[a], serta tanda-tanda-Ku yang Kutempatkan di tengah mereka, dan supaya kalian mengetahui bahwa Akulah Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bagaimana Aku mempermainkan orang Mesir.” Verba Ibrani ini dapat menekankan bahwa Mesir dipermalukan, selain diperlakukan dengan keras.
    reason: lexical_alternative
  - marker: b
    text: Atau, “dan kalian akan mengetahui bahwa Akulah Yahweh.”
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְמַעַן
  choice: supaya
  rationale: Menandai tujuan atau hasil dari tindakan yang disebut sebelumnya; “supaya” alami dalam bahasa Indonesia dan mempertahankan daya purposifnya.
- source_word: תְּסַפֵּר
  choice: engkau menceritakan
  rationale: Bentuk piel dari ספר di sini berarti menuturkan kembali peristiwa kepada generasi berikutnya.
- source_word: בְּאָזְנֵי
  choice: kepada
  rationale: Ungkapan harfiahnya “di telinga”; “kepada” menyampaikan idiom Ibrani itu secara alami tanpa menyiratkan bisikan atau tindakan fisik pada telinga.
- source_word: בִנְךָ וּבֶן בִּנְךָ
  choice: anakmu dan cucumu
  rationale: “Cucumu” merupakan padanan Indonesia yang alami bagi ungkapan harfiah “anakmu dan anak dari anakmu” serta mempertahankan penekanan antargenerasi.
- source_word: הִתְעַלַּלְתִּי
  choice: Aku memperlakukan ... dengan keras
  rationale: Dalam konteks tulah, verba ini mengungkapkan tindakan berat yang juga mempermalukan Mesir. Pilihan ini menonjolkan kerasnya penghukuman tanpa membatasi makna pada ejekan belaka; nuansa mempermainkan atau mempermalukan dipertahankan dalam catatan kaki.
- source_word: בְּמִצְרַיִם
  choice: Mesir
  rationale: Nama negeri dapat berfungsi secara metonimis bagi bangsa atau orang Mesir; susunan “memperlakukan Mesir dengan keras” sesuai dengan preposisi dan idiom Indonesia.
- source_word: אֹתֹתַי
  choice: tanda-tanda-Ku
  rationale: Padanan langsung untuk אותות; tidak menambahkan kata “mukjizat” dan tidak menggesernya menjadi “keajaiban”.
- source_word: שַׂמְתִּי בָם
  choice: yang Kutempatkan di tengah mereka
  rationale: Mempertahankan arti konkret שׂים, “menaruh/menempatkan,” dan memahami sufiks jamak sebagai orang Mesir.
- source_word: וִידַעְתֶּם
  choice: dan supaya kalian mengetahui
  rationale: Meneruskan tujuan yang dibuka oleh לְמַעַן serta mempertahankan bentuk orang kedua jamak melalui “kalian,” berbeda dari “engkau” yang tunggal pada bagian sebelumnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar “TUHAN”.
theological_decisions:
- issue: Nuansa tindakan ilahi הִתְעַלַּלְתִּי terhadap Mesir
  choice: bagaimana Aku memperlakukan Mesir dengan keras
  alternative: bagaimana Aku mempermainkan atau mempermalukan orang Mesir
  rationale: Konteks tulah mencakup penghukuman berat sekaligus penghinaan terhadap Mesir. Teks utama menyampaikan kerasnya tindakan itu, sedangkan catatan kaki menjaga nuansa penghinaan yang sungguh mungkin dalam verba Ibrani.
- issue: Hubungan gramatikal וִידַעְתֶּם dengan לְמַעַן
  choice: dan supaya kalian mengetahui
  alternative: dan kalian akan mengetahui
  rationale: Klausa tersebut dapat dipahami sebagai tujuan lanjutan atau sebagai akibat yang akan terjadi. Bacaan tujuan paling selaras dengan pembukaan ayat, tetapi bacaan akibat tetap dipertahankan dalam catatan kaki.
- issue: Peralihan dari orang kedua tunggal ke jamak
  choice: engkau ... kalian
  alternative: kamu ... kamu
  rationale: Bahasa Ibrani beralih dari bentuk tunggal dalam perintah menceritakan kepada bentuk jamak dalam klausa mengetahui. Terjemahan mempertahankan peralihan yang berpotensi bermakna ini tanpa menjelaskannya secara doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Engkau” dipakai untuk bentuk tunggal dan “kalian” untuk bentuk jamak agar peralihan jumlah dalam teks Ibrani tetap tampak. Kapitalisasi pada kata ganti ilahi mengikuti kelaziman penerbitan Alkitab Indonesia; nama pribadi ilahi ditulis “Yahweh”.
