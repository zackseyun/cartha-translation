  yaml_path: translation/ot/exodus/010/023.yaml
  text: They did not see one another[a], and no one rose from his place for three days[b]; but all the sons of Israel had light in their dwellings.
translation:
  language: id
  text: Mereka tidak melihat satu sama lain[a], dan selama tiga hari tidak seorang pun beranjak dari tempatnya. Namun, seluruh keturunan Israel memiliki terang di tempat tinggal mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “seseorang tidak melihat saudaranya.” Ungkapan Ibrani ini bermakna timbal balik: “mereka tidak melihat satu sama lain.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאוּ ... אֶת־אָחִיו
  choice: melihat satu sama lain
  rationale: Ungkapan אִישׁ אֶת־אָחִיו secara harfiah berbunyi 'seseorang melihat saudaranya', tetapi berfungsi timbal balik. 'Satu sama lain' menyampaikan maksudnya secara alami tanpa menafsirkan kata kerja sebagai 'dapat melihat'.
- source_word: אִישׁ
  choice: tidak seorang pun
  rationale: Kata ini dipakai secara distributif dan generik; 'tidak seorang pun' menyampaikan cakupannya tanpa membatasinya pada laki-laki.
- source_word: קָמוּ ... מִתַּחְתָּיו
  choice: beranjak dari tempatnya
  rationale: קום berarti 'bangkit/berdiri', sedangkan מִתַּחְתָּיו secara harfiah 'dari bawahnya'. Dalam gabungan ini, frasa tersebut menunjuk pada meninggalkan posisi atau tempat seseorang; 'beranjak dari tempatnya' jelas dan wajar dalam bahasa Indonesia.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: selama tiga hari
  rationale: Preposisi 'selama' menyatakan durasi secara alami dalam bahasa Indonesia.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Sebutan ini secara harfiah berarti 'anak-anak lelaki Israel', tetapi berfungsi sebagai nama kolektif bagi bangsa keturunan Israel. 'Keturunan Israel' mempertahankan nuansa kekeluargaan dan mencakup seluruh umat.
- source_word: הָיָה אוֹר
  choice: memiliki terang
  rationale: Konstruksi ini menyatakan bahwa terang tersedia bagi keturunan Israel, sebagai kontras dengan kegelapan yang dialami orang Mesir.
- source_word: בְּמֹשְׁבֹתָם
  choice: di tempat tinggal mereka
  rationale: מוֹשָׁב dapat berarti tempat tinggal atau permukiman. Dalam konteks ini, 'tempat tinggal mereka' mempertahankan cakupan umum sumber tanpa membatasinya pada rumah atau wilayah tertentu.
