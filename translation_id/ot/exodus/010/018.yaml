  text: So he went out from Pharaoh and pleaded with Yahweh[a].
translation:
  language: id
  text: Lalu Musa keluar dari hadapan Firaun dan memohon dengan sungguh-sungguh kepada Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berdoa dengan sungguh-sungguh kepada Yahweh” atau “memohon kepada Yahweh.” Kata kerja Ibrani ini menyatakan permohonan yang sungguh-sungguh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: meninggalkan
  rationale: Bentuk Qal wayyiqtol dari יצא menyatakan tindakan keluar atau pergi dalam urutan narasi. Dalam konteks מֵעִם פַּרְעֹה, “meninggalkan” secara alami menyampaikan bahwa Musa pergi dari hadapan Firaun.
- source_word: מֵעִם
  choice: dari
  rationale: Gabungan preposisi ini menyatakan pemisahan dari kebersamaan atau kehadiran seseorang; maknanya tercakup secara idiomatis dalam frasa “meninggalkan Firaun”.
- source_word: פַּרְעֹה
  choice: Firaun
  rationale: Bentuk baku dalam bahasa Indonesia untuk gelar penguasa Mesir.
- source_word: וַיֶּעְתַּר
  choice: memohon dengan sungguh-sungguh
  rationale: Kata kerja עתר dalam konteks ini menunjuk pada permohonan atau doa yang mendesak kepada Allah. Ungkapan ini mempertahankan unsur kesungguhan tanpa menentukan isi permohonan yang tidak disebutkan dalam ayat.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi אֶל menandai arah permohonan kepada Yahweh dan diterjemahkan secara langsung serta alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Nuansa tindakan וַיֶּעְתַּר
  choice: memohon dengan sungguh-sungguh
  alternative: berdoa dengan sungguh-sungguh atau memohon kepada
  rationale: Pilihan ini menjaga nuansa permohonan yang mendesak dan terarah kepada Allah, sekaligus tidak menambahkan isi atau hasil doa yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama “Musa” dibuat eksplisit karena subjek tersirat dalam verba Ibrani dan jelas dari konteks, sehingga narasi tetap mudah dipahami. Penanda catatan kaki [a] ditempatkan sesudah nama ilahi.
