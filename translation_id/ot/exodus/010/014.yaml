base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/014.yaml
  text: And the locusts came up over all the land of Egypt and settled in every territory of Egypt[a]—an extremely severe swarm. never before had there been locusts like it, nor will there be again after it.
translation:
  language: id
  text: Belalang-belalang itu datang melanda seluruh tanah Mesir dan hinggap di seluruh wilayah Mesir; serbuannya sangat dahsyat[a]. Sebelumnya tidak pernah ada belalang seperti itu, dan sesudahnya pun tidak akan ada lagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “sangat berat.” Ungkapan ini menggambarkan serbuan belalang yang luar biasa padat atau parah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: naik meliputi
  rationale: Kata kerja עלה mempertahankan gambaran gerak 'naik', sedangkan 'meliputi' secara alami menyatakan penyebaran belalang ke atas seluruh negeri dalam konteks ini.
- source_word: הָאַרְבֶּה
  choice: belalang-belalang itu
  rationale: Bentuk tunggal Ibrani dipakai secara kolektif; bentuk ulang bahasa Indonesia menyampaikan kumpulan belalang secara alami.
- source_word: עַל כָּל אֶרֶץ מִצְרַיִם
  choice: meliputi seluruh tanah Mesir
  rationale: Menyampaikan cakupan atas seluruh negeri Mesir; 'tanah Mesir' menjaga padanan konkret אֶרֶץ dalam konteks geografis.
- source_word: וַיָּנַח
  choice: hinggap
  rationale: Dalam konteks belalang, 'hinggap' merupakan ungkapan Indonesia yang alami untuk tindakan turun dan berdiam pada suatu tempat.
- source_word: בְּכֹל גְּבוּל מִצְרָיִם
  choice: di seluruh wilayah Mesir
  rationale: גְּבוּל di sini menunjuk seluruh daerah dalam batas Mesir, bukan hanya garis perbatasannya.
- source_word: כָּבֵד מְאֹד
  choice: jumlahnya luar biasa banyak
  rationale: Secara harfiah berarti 'sangat berat'. Dalam konteks serbuan belalang, ungkapan itu menyatakan besarnya atau padatnya serbuan; terjemahan ini alami tanpa menambahkan kata benda 'kawanan' yang tidak tersurat.
- source_word: לֹא הָיָה כֵן אַרְבֶּה כָּמֹהוּ
  choice: Sebelumnya tidak pernah ada belalang sebanyak itu
  rationale: Mengungkapkan perbandingan superlatif kolektif secara idiomatis dalam bahasa Indonesia.
- source_word: וְאַחֲרָיו לֹא יִהְיֶה כֵּן
  choice: dan sesudahnya pun tidak akan pernah ada lagi yang demikian
  rationale: Mempertahankan perbandingan yang berorientasi ke masa depan dan kesejajaran antara sebelum dan sesudah.
