review_pass:
  verdict: revise
  source_fidelity: Draf pada umumnya menyampaikan cakupan serbuan, tindakan hinggap, serta perbandingan bahwa peristiwa ini tidak ada bandingannya sebelum maupun sesudahnya. Namun, “naik meliputi” menggabungkan dua unsur Ibrani menjadi konstruksi Indonesia yang kurang tepat, dan “sebanyak itu” mempersempit perbandingan Ibrani menjadi jumlah saja. Istilah כָּבֵד מְאֹד lebih baik diterjemahkan sebagai beratnya/hebarnya serbuan tanpa membatasi maknanya hanya pada jumlah.
  naturalness: “Belalang-belalang itu naik meliputi” tidak alami dalam bahasa Indonesia modern. “Datang melanda” mengungkapkan kedatangan dan cakupan serbuan secara idiomatis, sedangkan “hinggap” tetap tepat bagi belalang. Kalimat perbandingan direvisi agar ringkas dan alami.
  terminology: “Belalang-belalang” tepat untuk nomina kolektif Ibrani dalam konteks ini. “Seluruh tanah Mesir” dan “seluruh wilayah Mesir” mempertahankan cakupan אֶרֶץ dan גְּבוּל. “Serbuannya sangat dahsyat” menyampaikan idiom “sangat berat” dalam konteks wabah tanpa menambahkan nomina teknis seperti “kawanan” atau membatasi makna pada jumlah.
  issues:
  - severity: medium
    issue: “Naik meliputi” bukan padanan sintaktis yang alami bagi rangkaian “datang/naik ... atas seluruh tanah” dalam bahasa Indonesia.
    rationale: Frasa tersebut membuat “meliputi” seolah-olah melengkapi “naik,” padahal Ibrani menyatakan belalang datang/naik atas tanah Mesir, lalu hinggap di seluruh wilayahnya.
  - severity: medium
    issue: “Sebelumnya tidak pernah ada belalang sebanyak itu” membatasi klaim perbandingan pada kuantitas.
    rationale: Klausa Ibrani menyatakan tidak pernah ada belalang “seperti itu”; dalam konteksnya hal ini dapat mencakup kedahsyatan atau kepadatan serbuan, bukan hanya angka jumlah.
  - severity: low
    issue: “Jumlahnya luar biasa banyak” hanya menangkap salah satu kemungkinan nuansa כָּבֵד מְאֹד.
    rationale: Idiom “sangat berat” dapat menunjuk pada bobot, kepadatan, atau kedahsyatan serbuan. Terjemahan yang menyebut kedahsyatan serbuan, disertai catatan kaki, menjaga cakupan makna dengan lebih baik.
  revised_text: Belalang-belalang itu datang melanda seluruh tanah Mesir dan hinggap di seluruh wilayah Mesir; serbuannya sangat dahsyat[a]. Sebelumnya tidak pernah ada belalang seperti itu, dan sesudahnya pun tidak akan ada lagi.
