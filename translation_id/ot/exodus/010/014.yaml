revisions:
- from: Belalang-belalang itu naik meliputi seluruh tanah Mesir dan hinggap di seluruh wilayah Mesir. Jumlahnya luar biasa banyak[a]. Sebelumnya tidak pernah ada belalang sebanyak itu, dan sesudahnya pun tidak akan pernah ada lagi yang demikian.
  to: Belalang-belalang itu datang melanda seluruh tanah Mesir dan hinggap di seluruh wilayah Mesir; serbuannya sangat dahsyat[a]. Sebelumnya tidak pernah ada belalang seperti itu, dan sesudahnya pun tidak akan ada lagi.
  rationale: Revisi ini mengganti konstruksi yang tidak alami dengan ungkapan naratif Indonesia yang wajar, mempertahankan cakupan nasional serbuan dan tindakan hinggap, serta menghindari pembatasan perbandingan Ibrani hanya pada jumlah belalang. Catatan kaki tetap menjelaskan idiom Ibrani yang secara harfiah berarti “sangat berat.”
