base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/008.yaml
  text: So Moses and Aaron were brought back to Pharaoh[a], and he said to them, “Go, serve Yahweh your God. Who are the ones going?”
translation:
  language: id
  text: Lalu Musa dan Harun dibawa kembali menghadap Firaun, dan Firaun berkata kepada mereka, “Pergilah, beribadahlah kepada Yahweh, Allah kalian. Siapa sajakah yang akan pergi?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Siapa dan siapa yang akan pergi?”—ungkapan yang meminta perincian mengenai orang-orang yang akan pergi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוּשַׁב
  choice: dibawa kembali
  rationale: 'Bentuk Hofal dari שׁוב menyatakan makna kausatif-pasif: Musa dan Harun dibuat kembali kepada Firaun. “Dibawa kembali” alami dalam bahasa Indonesia dan mempertahankan bentuk pasif.'
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: Musa dan Harun
  rationale: Penanda objek langsung אֶת tidak perlu dinyatakan tersendiri dalam bahasa Indonesia; kedua nama memakai bentuk baku Indonesia.
- source_word: אֶל פַּרְעֹה
  choice: menghadap Firaun
  rationale: אֶל menandai gerak menuju Firaun. Dalam konteks audiensi kerajaan, “menghadap Firaun” lebih alami daripada “kepada Firaun” tanpa mengubah arah geraknya.
- source_word: לְכוּ
  choice: Pergilah
  rationale: Imperatif jamak dari הלך diterjemahkan langsung sebagai perintah kepada Musa dan Harun.
- source_word: עִבְדוּ
  choice: beribadahlah kepada
  rationale: עבד berarti melayani, dan dalam konteks pelayanan kepada Allah mencakup ibadah. “Beribadahlah kepada” merupakan ungkapan Indonesia yang alami di sini, sementara cakupan ‘melayani’ tidak dimasukkan sebagai pembatas teologis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Bentuk dengan akhiran orang kedua maskulin jamak berarti “Allah kalian”. Dalam bahasa Indonesia baku, “-mu” dapat merujuk kepada lawan bicara tunggal maupun jamak dan menghasilkan kalimat yang ringkas.
- source_word: מִי וָמִי
  choice: Siapa saja
  rationale: Ungkapan harfiah “siapa dan siapa” meminta identifikasi orang-orang yang akan pergi. “Siapa saja” menyampaikan pertanyaan itu secara alami, sedangkan bentuk Ibraninya dijelaskan dalam catatan kaki.
- source_word: הַהֹלְכִים
  choice: yang akan pergi
  rationale: Partisipel berartikel berfungsi substantival, yakni orang-orang yang pergi. Bentuk futur “akan pergi” sesuai dengan rencana keberangkatan yang sedang dibicarakan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama ilahi itu dan tidak menggantinya dengan gelar.
- issue: Cakupan makna עבד dalam pelayanan kepada Allah
  choice: beribadah kepada
  alternative: melayani
  rationale: Dalam konteks permintaan Israel untuk pergi mengadakan perayaan dan mempersembahkan kurban, “beribadah” menyampaikan tindakan religius yang dimaksud secara wajar. Namun, kata sumber juga memiliki cakupan “melayani”; terjemahan tidak dimaksudkan untuk menyangkal nuansa tersebut.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. “Menghadap Firaun” dipilih sebagai ungkapan audiensi yang alami. Pengulangan subjek “Firaun” menghindari ketidakjelasan rujukan kata ganti setelah Musa dan Harun disebut. Penanda catatan kaki ditempatkan tepat sesudah pertanyaan yang dijelaskannya.
