base_translation:
  language: en
  yaml_path: translation/ot/exodus/010/021.yaml
  text: Then Yahweh said to Moses[a], “Stretch out your hand toward the sky, so that there may be darkness over the land of Egypt, and the darkness may be felt.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa, “Ulurkanlah tanganmu ke arah langit, supaya kegelapan meliputi tanah Mesir, dan kegelapan itu dapat diraba.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani dapat juga dipahami, “dan orang dapat meraba kegelapan.” Klausa ini memakai kata kerja yang langka dan menggambarkan kegelapan sebagai sesuatu yang seolah-olah dapat disentuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi sebagaimana tertulis dalam teks Ibrani, tanpa menggantinya dengan gelar.
- source_word: נְטֵה יָדְךָ
  choice: Ulurkanlah tanganmu
  rationale: Bentuk perintah dari נטה dalam konteks tindakan tanda berarti mengulurkan atau merentangkan tangan; pilihan ini alami dalam bahasa Indonesia.
- source_word: עַל הַשָּׁמַיִם
  choice: ke arah langit
  rationale: Dalam konteks gerakan tangan, עַל menunjukkan arah; 'ke arah langit' menyampaikan maksudnya secara wajar.
- source_word: וִיהִי חֹשֶׁךְ עַל אֶרֶץ מִצְרָיִם
  choice: supaya kegelapan meliputi tanah Mesir
  rationale: Konstruksi volitif menyatakan hasil yang dikehendaki. 'Meliputi' mengungkapkan kegelapan yang berada atas seluruh wilayah, sementara 'tanah Mesir' mempertahankan אֶרֶץ.
- source_word: וְיָמֵשׁ חֹשֶׁךְ
  choice: dan kegelapan itu dapat diraba
  rationale: Kata kerja yang langka ini umumnya dipahami dari משׁש, 'meraba/menyentuh'. Ungkapan ini mempertahankan gambaran kegelapan yang seolah-olah berwujud dan dapat disentuh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri perjanjian, bukan gelar; 'Yahweh' mempertahankan pembedaan itu.
- issue: Subjek dalam klausa terakhir yang sulit
  choice: kegelapan itu dapat diraba
  alternative: orang dapat meraba kegelapan
  rationale: Bentuk Ibrani memungkinkan penekanan pada kegelapan ataupun pada orang yang merabanya. Terjemahan utama mempertahankan gambaran kegelapan yang nyata tanpa menentukan pelaku tertentu, sedangkan kemungkinan konstruksi aktif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Partikel imperatif -lah dipakai untuk perintah langsung, sedangkan susunan kalimat dibuat alami tanpa menghilangkan hubungan antarklausa dalam teks Ibrani.
