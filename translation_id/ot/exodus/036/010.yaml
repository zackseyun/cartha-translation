  text: He joined five of the curtains to one another[a], and the other five curtains he joined to one another.
translation:
  language: id
  text: Ia menyambungkan lima lembar kain itu satu dengan yang lain, dan lima lembar kain lainnya[a] ia sambungkan satu dengan yang lain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dan lima lembar kain”; kata “lainnya” ditambahkan untuk memperjelas bahwa yang dimaksud adalah kelompok kedua yang terdiri atas lima lembar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַבֵּר / חִבַּר
  choice: menyambungkan / sambungkan
  rationale: Kata kerja חבר berarti menghubungkan atau menyatukan. “Menyambungkan” alami dalam konteks pembuatan Kemah Suci dan tidak menentukan secara berlebihan cara penyambungannya.
- source_word: יְרִיעֹת
  choice: lembar kain
  rationale: Dalam konteks Kemah Suci, kata ini menunjuk pada bentangan atau panel kain besar. “Lembar kain” jelas bagi pembaca modern dan sesuai dengan benda yang sedang dirangkai.
- source_word: חֲמֵשׁ
  choice: lima
  rationale: Padanan langsung untuk bilangan pokok Ibrani.
- source_word: אַחַת אֶל אֶחָת
  choice: satu dengan yang lain
  rationale: Ungkapan ini menyatakan bahwa lembar-lembar dalam setiap kelompok disambungkan satu sama lain; pilihan ini alami dan tetap dekat dengan bentuk Ibrani.
- source_word: וְחָמֵשׁ יְרִיעֹת
  choice: dan lima lembar kain lainnya
  rationale: Teks Ibrani secara harfiah mengulang “dan lima lembar kain”. Kata “lainnya” memperjelas bahwa yang dimaksud ialah kelompok kedua, sebagaimana ditunjukkan oleh susunan paralelnya, tanpa mengubah jumlah atau tindakan.
