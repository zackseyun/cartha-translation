lexical_decisions:
- source_word: עַמּוּדָיו
  choice: kelima tiangnya
  rationale: עַמּוּד menunjuk pada tiang penyangga. Akhiran pronominal tunggal diterjemahkan dengan bentuk posesif -nya, yang merujuk pada tirai pintu masuk dalam konteks sebelumnya.
- source_word: וָוֵיהֶם
  choice: kait-kaitnya
  rationale: Dalam uraian Kemah Suci, וָו menunjuk pada kait yang terpasang pada tiang untuk menggantungkan kain.
- source_word: וְצִפָּה
  choice: Ia melapisi
  rationale: Bentuk piel dari צפה dalam konteks pengerjaan logam berarti melapisi suatu benda dengan logam.
- source_word: רָאשֵׁיהֶם
  choice: bagian atas tiang-tiang itu
  rationale: Secara harfiah berarti 'kepala-kepala mereka'; dalam konteks arsitektural, yang dimaksud ialah bagian atas tiang, tanpa harus menetapkannya sebagai kepala tiang dalam arti teknis.
- source_word: חֲשֻׁקֵיהֶם
  choice: gelang-gelangnya
  rationale: Istilah ini menunjuk pada unsur yang mengelilingi atau mengikat tiang. 'Gelang-gelang' mempertahankan gambaran bentuknya tanpa memastikan fungsi teknis yang tidak sepenuhnya jelas.
- source_word: זָהָב
  choice: dengan emas
  rationale: Emas adalah bahan pelapis; preposisi 'dengan' ditambahkan agar alami dalam bahasa Indonesia.
- source_word: אַדְנֵיהֶם
  choice: alasnya
  rationale: אֶדֶן dalam konstruksi Kemah Suci ialah bagian dasar tempat tiang berdiri; 'alas' mudah dipahami, sedangkan kemungkinan bentuk soket dicatat dalam catatan kaki.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Dalam konteks perlengkapan Kemah Suci, נְחֹשֶׁת secara konvensional dan kontekstual diterjemahkan 'perunggu'.
