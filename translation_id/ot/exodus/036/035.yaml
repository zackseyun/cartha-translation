base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/035.yaml
  text: And he made the curtain of blue[a], purple, and scarlet yarn, and fine twisted linen; he made it with cherubim[c][b], the work of a skillful designer.
translation:
  language: id
  text: Ia membuat tirai pemisah[a] dari benang biru, ungu, dan merah kirmizi[b], serta linen halus yang dipintal. Ia membuat kerub-kerub pada tirai itu dengan pengerjaan artistik berpola.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tabir.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, ungkapan Ibrani ini menunjuk pada bahan atau benang berwarna merah skarlet; “merah tua” merupakan kemungkinan terjemahan lain.
    reason: lexical_alternative
  - marker: c
    text: Atau “dengan pengerjaan seorang perajin yang terampil” atau “dengan tenunan berpola.” Frasa Ibrani ini menunjuk pada pengerjaan artistik yang dirancang dengan pola.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפָּרֹכֶת
  choice: tirai pemisah
  rationale: Istilah ini menunjuk pada tirai bagian dalam Kemah Suci yang memisahkan ruang-ruang kudus. “Tirai pemisah” jelas dalam bahasa Indonesia modern dan mempertahankan fungsi bendanya.
- source_word: תְּכֵלֶת
  choice: benang biru
  rationale: Istilah ini menunjuk pada bahan tekstil berwarna biru. “Benang” dinyatakan pada awal rangkaian warna agar konteks bahannya jelas tanpa pengulangan yang kaku.
- source_word: אַרְגָּמָן
  choice: ungu
  rationale: Padanan lazim untuk bahan tekstil berwarna ungu yang bernilai tinggi; pengertian “benang” dibawa oleh rangkaian warna tersebut.
- source_word: תוֹלַעַת שָׁנִי
  choice: merah tua
  rationale: Ungkapan Ibrani ini menunjuk pada bahan atau benang yang dicelup dengan warna merah menyala/tua. Pilihan ini alami dalam bahasa Indonesia, sedangkan alternatif warna dipertahankan dalam catatan kaki.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: linen halus yang dipintal
  rationale: Terjemahan ini mempertahankan baik jenis bahannya, yakni linen halus, maupun sifat pengerjaannya sebagai bahan yang dipintal.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: karya seorang perancang yang terampil
  rationale: Frasa ini menggambarkan pengerjaan artistik dan berpola yang dirancang dengan keahlian, bukan sekadar pekerjaan tangan biasa.
- source_word: כְּרֻבִים
  choice: kerub-kerub
  rationale: “Kerub” adalah bentuk serapan yang sesuai dengan ragam Alkitab Indonesia; pengulangan menyatakan bentuk jamak Ibrani.
- source_word: עָשָׂה אֹתָהּ כְּרֻבִים
  choice: Pada tirai itu dibuatnya gambar kerub-kerub
  rationale: Susunan ini menyampaikan bahwa sosok-sosok kerub menjadi bagian dari rancangan tirai. Kata “gambar” memperjelas bahwa yang dimaksud ialah representasi artistik, bukan kerub hidup, tanpa menentukan secara sempit teknik pembuatannya.
