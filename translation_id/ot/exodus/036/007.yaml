  text: And the material was sufficient for all the work to do it[a], and there was more than enough.
translation:
  language: id
  text: Bahan-bahan itu cukup untuk semua pekerjaan yang harus dilakukan, dan masih ada yang tersisa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan jumlahnya lebih dari cukup.” Ungkapan Ibrani dapat menekankan adanya kelebihan yang tersisa setelah semua kebutuhan pekerjaan terpenuhi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמְּלָאכָה
  choice: Bahan-bahan itu
  rationale: Walaupun מְלָאכָה biasanya berarti “pekerjaan”, dalam konteks persembahan untuk pembangunan Kemah Suci kata ini menunjuk pada bahan-bahan yang telah dikumpulkan. Bentuk jamak dalam bahasa Indonesia menyampaikan referen kolektif itu secara alami.
- source_word: הָיְתָה דַיָּם
  choice: cukup
  rationale: דַּי menyatakan kecukupan. Terjemahan “cukup” ringkas, alami, dan mempertahankan arti dasar klausa Ibrani.
- source_word: לְכָל הַמְּלָאכָה
  choice: untuk melaksanakan seluruh pekerjaan
  rationale: Pada kemunculan kedua, מְלָאכָה jelas berarti pekerjaan atau tugas pembangunan. “Seluruh pekerjaan” mempertahankan cakupan כָּל, sedangkan “melaksanakan” secara alami menghubungkannya dengan infinitif berikutnya.
- source_word: לַעֲשׂוֹת אֹתָהּ
  choice: melaksanakan
  rationale: Infinitif עשה dengan akhiran objek menunjuk pada pelaksanaan pekerjaan yang baru disebut. Bahasa Indonesia tidak perlu mengulang objek dengan “melakukannya” karena “melaksanakan seluruh pekerjaan” sudah menyatakannya dengan jelas.
- source_word: וְהוֹתֵר
  choice: bahkan masih ada sisanya
  rationale: Bentuk Hifil dari יתר menyatakan adanya kelebihan atau sisa sesudah kebutuhan terpenuhi. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran tentang bahan yang tersisa.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan ringkas dan mudah dipahami. “Bahan-bahan” dipakai secara kontekstual pada kemunculan pertama מְלָאכָה, sedangkan kemunculan kedua diterjemahkan “pekerjaan” agar perbedaan referennya jelas.
