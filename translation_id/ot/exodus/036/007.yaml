  naturalness: “Masih ada yang tersisa” lebih idiomatis dan langsung daripada “bahkan masih ada sisanya.” “Semua pekerjaan yang harus dilakukan” jelas dalam bahasa Indonesia baku tanpa menjadi terlalu bebas.
