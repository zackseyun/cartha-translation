  text: He made fifty loops on the edge of the outer curtain in the first set[a], and he made fifty loops on the edge of the curtain of the second set.
translation:
  language: id
  text: Ia membuat lima puluh gelung pada tepi kain tenda paling luar dari rangkaian pertama[a], dan ia membuat lima puluh gelung pada tepi kain tenda dari rangkaian kedua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pada sambungan”; istilah Ibrani ini dapat menunjuk pada sambungan atau pada kelompok kain yang disambungkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלָאֹת
  choice: sosok
  rationale: Kata ini menunjuk pada sosok-sosok dari kain yang digunakan untuk menghubungkan kain-kain tenda; 'sosok' merupakan padanan Indonesia yang ringkas dan lazim dalam konteks ini.
- source_word: שְׂפַת
  choice: tepi
  rationale: Dalam konteks kain Kemah Suci, kata ini menunjuk pada tepi atau pinggir kain; 'tepi' paling alami dalam bahasa Indonesia modern.
- source_word: יְרִיעָה
  choice: kain tenda
  rationale: Kata ini menunjuk pada lembaran kain besar yang membentuk penutup Kemah Suci. 'Kain tenda' lebih jelas daripada sekadar 'tirai' dalam konteks konstruksi ini.
- source_word: הַקִּיצֹנָה
  choice: yang paling luar
  rationale: Adjektiva ini menandai kain pada posisi ujung atau terluar dalam suatu rangkaian.
- source_word: בַּמַּחְבָּרֶת
  choice: dalam rangkaian pertama
  rationale: Nomina ini merujuk pada rangkaian atau kelompok kain yang disambungkan. Kata 'pertama' tersirat secara kontras dari penyebutan rangkaian kedua pada klausa berikutnya dan diberi catatan kaki agar sifat penafsirannya transparan.
- source_word: הַחֹבֶרֶת הַשֵּׁנִית
  choice: dalam rangkaian kedua
  rationale: Ungkapan ini mengidentifikasi kain yang termasuk pada pasangan rangkaian kedua; terjemahan ini mempertahankan kontras struktural kedua kelompok kain secara alami.
- source_word: וַיַּעַשׂ ... עָשָׂה
  choice: Ia membuat ... ia membuat
  rationale: Pengulangan verba Ibrani dipertahankan agar kesejajaran kedua klausa tetap tampak.
