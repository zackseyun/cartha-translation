  text: He made fifty loops on the one curtain[a], and he made fifty loops on the edge of the curtain that was in the second set[b]; the loops corresponded to one another.
translation:
  language: id
  text: Ia membuat lima puluh gelung pada kain tenda yang satu, dan ia membuat lima puluh gelung pada tepi kain tenda yang termasuk dalam rangkaian kedua; gelung-gelung itu saling berhadapan, yang satu dengan yang lain.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֻלָאֹת
  choice: lubang tali
  rationale: Kata ini menunjuk pada gelung atau lubang dari bahan kain yang dipakai untuk menyambungkan kain-kain tenda. “Lubang tali” merupakan istilah Indonesia yang jelas dan membedakannya dari pengait logam yang disebut pada ayat berikutnya.
- source_word: יְרִיעָה
  choice: kain tenda
  rationale: Dalam konteks Kemah Suci, kata ini menunjuk pada lembaran kain besar pembentuk penutup kemah. “Kain tenda” lebih konkret dan alami daripada sekadar “kain” atau “tirai”.
- source_word: בִּקְצֵה
  choice: pada tepi
  rationale: קָצֶה berarti tepi atau ujung; di sini lubang-lubang tali ditempatkan pada batas kain agar kedua rangkaian dapat disambungkan.
- source_word: מַחְבֶּרֶת
  choice: rangkaian
  rationale: Kata ini menunjuk pada satu unit yang terbentuk dari beberapa kain yang disambungkan. “Rangkaian” menyampaikan kesatuan yang tersusun itu secara wajar dalam bahasa Indonesia.
- source_word: הַשֵּׁנִית
  choice: kedua
  rationale: Bentuk ordinal Ibrani dipertahankan secara langsung untuk menunjuk pada rangkaian kedua.
- source_word: מַקְבִּילֹת
  choice: saling berhadapan
  rationale: Partisip ini menggambarkan lubang-lubang tali yang sejajar atau berpadanan pada sisi berlawanan. “Saling berhadapan” mempertahankan gambaran spasial yang diperlukan untuk penyambungan.
- source_word: אַחַת אֶל אֶחָת
  choice: yang satu dengan yang lain
  rationale: Ungkapan ini menegaskan korespondensi satu demi satu antara lubang-lubang tali pada kedua sisi.
- source_word: עָשָׂה
  choice: membuat
  rationale: Padanan langsung dan alami bagi kata kerja umum עשה dalam uraian pekerjaan pembuatan Kemah Suci.
