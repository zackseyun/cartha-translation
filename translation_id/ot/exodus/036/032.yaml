  text: and five bars for the boards of the second side of the tabernacle[b][a], and five bars for the boards of the tabernacle at the far rear on the west.
translation:
  language: id
  text: dan lima batang palang[a] untuk papan-papan pada sisi kedua Kemah Suci, serta lima batang palang untuk papan-papan Kemah Suci pada bagian paling belakang, di sebelah barat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “batang-batang pengikat.”
    reason: lexical_alternative
  - marker: b
    text: Atau “untuk bagian belakang Kemah Suci, ke arah barat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְרִיחִם
  choice: batang palang
  rationale: Dalam konteks pembangunan Kemah Suci, kata ini menunjuk pada batang mendatar yang mengikat papan-papan menjadi satu. “Batang palang” alami dalam bahasa Indonesia dan memperjelas bahwa yang dimaksud ialah unsur bangunan memanjang.
- source_word: קַרְשֵׁי
  choice: papan-papan
  rationale: Kata ini menunjuk pada bagian-bagian kayu struktural Kemah Suci. “Papan-papan” mempertahankan gambaran konkret tanpa memastikan teori rekonstruksi tertentu seperti “rangka-rangka”.
- source_word: צֶלַע
  choice: sisi
  rationale: Makna dasarnya di sini ialah sisi atau bagian samping bangunan; “sisi” ringkas dan tidak menambahkan rincian arsitektural.
- source_word: הַשֵּׁנִית
  choice: kedua
  rationale: Terjemahan harfiah “kedua” mempertahankan urutan terhadap sisi yang disebut sebelumnya; “yang lain” lebih idiomatis tetapi kurang formal.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: Dalam konteks Keluaran, istilah ini merupakan sebutan tetap bagi tempat kudus portabel. “Kemah Suci” merupakan ungkapan Indonesia yang jelas dan lazim, sementara arti leksikal dasarnya berkaitan dengan tempat kediaman.
- source_word: לַיַּרְכָתַיִם
  choice: pada bagian paling belakang
  rationale: Bentuk ini menunjuk pada bagian ujung atau bagian terdalam/belakang. “Bagian paling belakang” mempertahankan unsur kejauhan atau keekstreman ruang yang dapat hilang jika hanya diterjemahkan “sisi belakang”.
- source_word: יָמָּה
  choice: di sebelah barat
  rationale: Kata arah ini secara idiomatis berarti ke arah barat atau di sisi barat, meskipun secara etimologis berkaitan dengan laut. Dalam uraian letak bangunan, “di sebelah barat” paling alami.
- source_word: וַחֲמִשָּׁה ... וַחֲמִשָּׁה
  choice: dan lima ... serta lima
  rationale: Koordinasi inventaris Ibrani dipertahankan. “Serta” pada pengulangan kedua membuat kalimat Indonesia lebih mengalir tanpa menghilangkan kesejajaran kedua kelompok.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk ayat dipertahankan sebagai kelanjutan daftar dari konteks sebelumnya, sehingga dimulai dengan huruf kecil. Istilah arsitektural dibuat konkret tanpa memaksakan rekonstruksi bentuk Kemah Suci yang diperdebatkan.
