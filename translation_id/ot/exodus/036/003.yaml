  text: וַ/יִּקְח֞וּ מִ/לִּ/פְנֵ֣י מֹשֶׁ֗ה אֵ֤ת כָּל הַ/תְּרוּמָה֙ אֲשֶׁ֨ר הֵבִ֜יאוּ בְּנֵ֣י יִשְׂרָאֵ֗ל לִ/מְלֶ֛אכֶת עֲבֹדַ֥ת הַ/קֹּ֖דֶשׁ לַ/עֲשֹׂ֣ת אֹתָ֑/הּ וְ֠/הֵם הֵבִ֨יאוּ אֵלָ֥י/ו ע֛וֹד נְדָבָ֖ה בַּ/בֹּ֥קֶר בַּ/בֹּֽקֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/003.yaml
  text: And they took from before Moses all the contribution that the sons of Israel had brought for the work of the service of the sanctuary[a], to do it[c][b]. But they still kept bringing to him freewill offerings morning after morning.
translation:
  language: id
  text: Mereka mengambil dari hadapan Musa semua persembahan yang telah dibawa umat Israel untuk pekerjaan pelayanan di tempat kudus itu, supaya pekerjaan itu dilaksanakan. Namun, umat itu masih terus membawa kepadanya persembahan sukarela pagi demi pagi.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Mereka mengambil
  rationale: Mempertahankan arti dasar לקח, yaitu 'mengambil'; dalam konteks ini para pekerja mengambil bahan-bahan yang berada dalam pengawasan Musa.
- source_word: מִלִּפְנֵי מֹשֶׁה
  choice: dari hadapan Musa
  rationale: Mencerminkan ungkapan Ibrani secara cukup dekat dan menunjukkan bahwa bahan-bahan itu diambil dari tempat atau pengawasan langsung Musa.
- source_word: הַתְּרוּמָה
  choice: persembahan
  rationale: Menunjuk pada pemberian yang dikhususkan bagi pekerjaan suci. 'Persembahan' alami dalam konteks Alkitab Indonesia dan tidak membatasinya pada korban.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  rationale: Ungkapan kolektif ini mencakup seluruh komunitas Israel; 'umat Israel' lebih alami dan inklusif dalam bahasa Indonesia modern daripada terjemahan harfiah 'anak-anak lelaki Israel'.
- source_word: לִמְלֶאכֶת עֲבֹדַת הַקֹּדֶשׁ
  choice: untuk pekerjaan pelayanan di tempat kudus itu
  rationale: Mempertahankan unsur 'pekerjaan' dan 'pelayanan', serta memahami הַקֹּדֶשׁ sebagai tempat kudus dalam konteks pembangunan Kemah Suci.
- source_word: לַעֲשֹׂת אֹתָהּ
  choice: supaya pekerjaan itu dilaksanakan
  rationale: Kata kerja עשה dapat berarti melakukan atau membuat. Bentuk ini menyampaikan tujuan secara alami tanpa menentukan secara berlebihan apakah sufiks feminin merujuk pada pekerjaan atau pelayanan.
- source_word: וְהֵם הֵבִיאוּ
  choice: Namun, umat itu masih terus membawa
  rationale: Kata ganti mandiri הֵם memberi penekanan, sedangkan konteks menunjukkan tindakan berkelanjutan. 'Namun' dan 'masih terus' menyampaikan kontras serta persistensi itu, meskipun וְ sendiri adalah penghubung umum.
- source_word: אֵלָיו
  choice: kepadanya
  rationale: Mempertahankan bentuk pronominal teks Ibrani; rujukannya secara alami adalah Musa.
- source_word: נְדָבָה
  choice: persembahan sukarela
  rationale: Menyatakan pemberian yang lahir dari kerelaan, sesuai makna נְדָבָה.
- source_word: בַּבֹּקֶר בַּבֹּקֶר
  choice: pagi demi pagi
  rationale: Pengulangan dalam bahasa Ibrani menyatakan tindakan yang berulang secara teratur; idiom Indonesia ini mempertahankan nuansa tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur Ibrani dipertahankan bila tetap jelas, tetapi ungkapan yang dapat menyesatkan pembaca modern, seperti terjemahan harfiah 'anak-anak lelaki Israel', diungkapkan secara idiomatis sebagai 'umat Israel'. Pengulangan 'pekerjaan' dipakai untuk memperjelas rujukan sufiks feminin dalam לַעֲשֹׂת אֹתָהּ.
