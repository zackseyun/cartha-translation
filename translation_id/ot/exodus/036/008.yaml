revisions:
- from: 'Semua orang yang terampil[a] di antara mereka yang mengerjakan pekerjaan itu membuat Kemah Suci dari sepuluh lembar kain: linen halus yang dipintal, serta benang biru, ungu, dan merah kirmizi. Ia membuat lembar-lembar itu[b] dengan kerub-kerub, sebagai karya seorang perancang yang terampil.'
  to: Semua orang yang terampil[a] di antara mereka yang mengerjakan pekerjaan itu membuat Kemah Suci itu, yaitu sepuluh helai kain dari linen halus yang dipintal, serta benang biru, ungu, dan merah kirmizi. Ia membuat helai-helai kain itu dengan gambar kerub-kerub, pekerjaan seorang perancang ahli.[b]
