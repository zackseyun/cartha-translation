base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/008.yaml
  text: And every skillful man among those doing the work made the tabernacle with ten curtains of finely twisted linen[a], and blue, and purple, and scarlet yarn; he made them with cherubim[b], the work of a skillful designer.
translation:
  language: id
  text: Semua orang yang terampil[a] di antara mereka yang mengerjakan pekerjaan itu membuat Kemah Suci itu, yaitu sepuluh helai kain dari linen halus yang dipintal, serta benang biru, ungu, dan merah kirmizi. Ia membuat helai-helai kain itu dengan gambar kerub-kerub, pekerjaan seorang perancang ahli.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bijaksana hati”; suatu ungkapan Ibrani untuk orang yang memiliki keterampilan sebagai perajin.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani memakai kata kerja tunggal, “ia membuat”, pada bagian ini, meskipun ayat ini dimulai dengan kata kerja dan subjek jamak. Sebagian terjemahan menyelaraskannya menjadi “mereka membuat”.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲכַם לֵב
  choice: orang yang terampil
  rationale: Secara harfiah berarti “bijaksana hati”, sebuah idiom Ibrani yang dalam konteks ini menunjuk pada kecakapan sebagai perajin. “Orang yang terampil” menyampaikan maknanya secara alami tanpa membuat idiom itu terdengar kabur.
- source_word: בְּעֹשֵׂי הַמְּלָאכָה
  choice: di antara mereka yang mengerjakan pekerjaan itu
  rationale: Preposisi dan bentuk partisip menunjukkan bahwa orang-orang terampil tersebut termasuk dalam kelompok yang sedang melaksanakan pekerjaan pembangunan.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: Istilah baku dan mudah dipahami dalam bahasa Indonesia untuk bangunan kudus yang menjadi tempat kediaman Allah di tengah Israel.
- source_word: יְרִיעֹת
  choice: lembar kain
  rationale: Dalam konteks pembuatan Kemah Suci, kata ini menunjuk pada bentangan atau panel kain besar. “Lembar kain” lebih tepat daripada “tirai” karena lembar-lembar itu membentuk penutup struktur.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: linen halus yang dipintal
  rationale: Ungkapan ini menyatakan bahan linen berkualitas tinggi dengan benang yang dipintal atau dipilin; terjemahan ini mempertahankan rincian tekstilnya.
- source_word: תְכֵלֶת ... אַרְגָּמָן ... תוֹלַעַת שָׁנִי
  choice: benang biru, ungu, dan merah kirmizi
  rationale: Ketiga istilah menunjuk pada bahan tekstil berwarna. Kata “benang” dinyatakan sekali untuk keseluruhan rangkaian agar jelas dan alami dalam bahasa Indonesia.
- source_word: כְּרֻבִים
  choice: kerub-kerub
  rationale: “Kerub” merupakan bentuk tunggal yang lazim dalam bahasa Indonesia; pengulangan menyatakan bentuk jamak Ibrani כְּרֻבִים.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: karya seorang perancang yang terampil
  rationale: Ungkapan ini menunjuk pada pengerjaan artistik yang dirancang dengan keahlian, kemungkinan melalui teknik tenun. Terjemahan ini mempertahankan unsur rancangan tanpa mempersempitnya secara pasti menjadi sulaman.
- source_word: עָשָׂה אֹתָם
  choice: Ia membuat lembar-lembar itu
  rationale: Teks Ibrani beralih dari kata kerja jamak pada awal ayat ke kata kerja tunggal di bagian akhir. Bentuk tunggal dipertahankan dan objek pronominal dijelaskan sebagai lembar-lembar kain.
theological_decisions:
- issue: Penyebutan pelaku dalam ungkapan חֲכַם לֵב
  choice: orang yang terampil
  alternative: laki-laki yang terampil; perajin yang terampil
  rationale: Bentuk Ibrani adalah maskulin tunggal yang berfungsi secara distributif setelah kata “semua”. Dalam bahasa Indonesia, “orang” secara alami dapat mewakili setiap anggota kelompok tanpa menyatakan jenis kelamin yang tidak sedang ditekankan oleh konteks.
- issue: Peralihan dari kata kerja jamak ke kata kerja tunggal pada akhir ayat
  choice: 'Mempertahankan bentuk tunggal: “Ia membuat”'
  alternative: Menyelaraskannya menjadi “Mereka membuat”
  rationale: Peralihan bilangan terdapat dalam teks Masoret. Mempertahankannya menjaga bentuk teks dan kemungkinan nuansa distributif atau kolektif tanpa diam-diam menyelesaikan ketegangan sintaksis tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dibuat jelas bagi pembaca umum, sementara peralihan jamak-ke-tunggal dalam teks sumber tetap dipertahankan dan diterangkan melalui catatan kaki.
