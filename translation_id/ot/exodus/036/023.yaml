translation:
  language: id
  text: 'Ia membuat rangka-rangka untuk Kemah Suci: dua puluh rangka pada sisi selatan[a], ke arah selatan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "dua puluh papan untuk sisi selatan." Teks Ibrani memakai ungkapan selatan secara ganda (secara harfiah, "selatan, ke arah selatan") sebagai penegasan atau perincian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia membuat
  rationale: Bentuk wayyiqtol Qal dari עשה melanjutkan rangkaian tindakan lampau; subjek tunggal dipertahankan dari konteks.
- source_word: הַקְּרָשִׁים
  choice: rangka-rangka
  rationale: Dalam pembangunan Kemah Suci, קֶרֶשׁ menunjuk pada unsur struktural tegak. 'Rangka' menyampaikan fungsinya secara wajar dalam bahasa Indonesia modern; alternatif harfiahnya ialah 'papan-papan'.
- source_word: לַמִּשְׁכָּן
  choice: untuk Kemah Suci
  rationale: מִשְׁכָּן adalah sebutan baku bagi bangunan tempat kudus dalam konteks Keluaran; 'Kemah Suci' jelas dan lazim bagi pembaca Indonesia.
- source_word: עֶשְׂרִים קְרָשִׁים
  choice: dua puluh rangka
  rationale: Bilangan dan nomina diterjemahkan langsung, sekaligus mempertahankan pengulangan istilah dalam gaya inventaris teks Ibrani.
- source_word: לִפְאַת
  choice: untuk sisi
  rationale: פֵּאָה di sini menunjuk pada sisi atau bagian tepi bangunan; 'sisi' paling sesuai dengan konteks arsitektural.
- source_word: נֶגֶב
  choice: selatan
  rationale: Di sini נֶגֶב berfungsi sebagai penunjuk arah, bukan nama wilayah Negeb.
- source_word: תֵּימָנָה
  choice: menghadap ke selatan
  rationale: Ungkapan ini mempertahankan penandaan arah kedua setelah נֶגֶב dengan susunan Indonesia yang alami, tanpa menghilangkan pengulangan selatan dalam teks sumber.
theological_decisions: []
translation_notes:
