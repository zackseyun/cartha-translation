  text: And he joined five curtains by themselves[a], and six curtains by themselves.
translation:
  language: id
  text: Lalu ia menyambungkan lima helai kain itu secara tersendiri[a], dan enam helai kain itu secara tersendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “secara terpisah”; maksudnya, lima helai kain disambungkan sebagai satu kelompok dan enam helai kain sebagai kelompok yang terpisah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחַבֵּר
  choice: menyambungkan
  rationale: Kata kerja חָבַר berarti menghubungkan atau menyatukan. Dalam konteks pembuatan Kemah Suci, 'menyambungkan' alami dan tidak memperinci cara penyambungannya melampaui teks.
- source_word: הַיְרִיעֹת
  choice: helai kain
  rationale: יְרִיעָה menunjuk pada lembaran kain besar dalam konstruksi Kemah Suci. 'Helai kain' lebih jelas dalam bahasa Indonesia modern daripada 'tirai', yang dapat menyiratkan kain yang sudah tergantung.
- source_word: לְבָד
  choice: menjadi satu kelompok
  rationale: Dalam dua kemunculannya, לְבָד menunjukkan bahwa lima helai disatukan sebagai satu bagian tersendiri dan enam helai sebagai bagian tersendiri. Ungkapan ini menyampaikan susunan konstruksinya secara alami.
- source_word: חֲמֵשׁ
  choice: lima
  rationale: Padanan langsung bagi bilangan pokok lima.
- source_word: שֵׁשׁ
  choice: enam
  rationale: Padanan langsung bagi bilangan pokok enam.
- source_word: אֶת ... וְאֶת
  choice: dua objek langsung yang dikoordinasikan
  rationale: 'Penanda objek yang diulang membagi tindakan itu menjadi dua objek: lima helai kain dan enam helai kain. Bahasa Indonesia menyatakannya lewat susunan dua klausa terkoordinasi tanpa menerjemahkan partikel אֶת.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Kata 'ia' mempertahankan subjek maskulin tunggal dari konteks tanpa menyebut nama yang tidak terdapat dalam ayat ini. 'Lainnya' memperjelas bahwa enam helai itu merupakan sisa dari sebelas helai yang disebut dalam konteks.
