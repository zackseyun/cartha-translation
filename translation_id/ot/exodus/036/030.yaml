translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan kalimat menampilkan jumlah keseluruhan terlebih dahulu, lalu pembagiannya pada tiap rangka. Penanda catatan kaki [a] dan [b] ditempatkan langsung sesudah istilah yang dijelaskan.
