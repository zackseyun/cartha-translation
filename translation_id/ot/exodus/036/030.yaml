translation:
  language: id
  text: Ada delapan rangka[a] beserta enam belas alasnya[b] dari perak; dua alas di bawah setiap rangka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “papan”; istilah Ibrani ini menunjuk pada bagian struktural tegak Kemah Suci.
    reason: lexical_alternative
  - marker: b
    text: Atau “soket.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: Ada
  rationale: Dalam konteks daftar konstruksi, bentuk וְהָיוּ menyatakan keberadaan atau jumlah. “Ada” merupakan ungkapan bahasa Indonesia yang alami; waw penghubung tidak perlu diterjemahkan secara mekanis.
- source_word: קְרָשִׁים / הַקֶּרֶשׁ
  choice: rangka
  rationale: Dalam konteks Kemah Suci, קֶרֶשׁ menunjuk pada bagian struktural tegak. “Rangka” menyampaikan fungsi konstruksinya dengan jelas, sementara alternatif “papan” tetap dicatat dalam catatan kaki.
- source_word: אַדְנֵיהֶם / אֲדָנִים
  choice: alas
  rationale: אֶדֶן di sini adalah penyangga logam di bagian bawah setiap rangka. “Alas” mudah dipahami dalam bahasa Indonesia modern; “soket” merupakan alternatif yang lebih teknis.
- source_word: כֶּסֶף
  choice: dari perak
  rationale: Menunjukkan bahan pembuat alas. Frasa “dari perak” alami dan jelas dalam bahasa Indonesia.
- source_word: שִׁשָּׁה עָשָׂר
  choice: enam belas
  rationale: Padanan langsung bagi bilangan kardinal Ibrani.
- source_word: שְׁנֵי אֲדָנִים שְׁנֵי אֲדָנִים תַּחַת הַקֶּרֶשׁ הָאֶחָד
  choice: dua alas di bawah setiap rangka
  rationale: 'Pengulangan “dua alas, dua alas” bersama bentuk tunggal “rangka yang satu” berfungsi distributif: masing-masing dari delapan rangka memiliki dua alas. Terjemahan ini menyatakan makna distributif tersebut secara alami tanpa memberi kesan bahwa hanya satu atau dua rangka yang dimaksud.'
