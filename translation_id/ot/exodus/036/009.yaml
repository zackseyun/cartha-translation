  text: The length of each curtain was twenty-eight cubits[a], and the width of each curtain was four cubits[b]; all the curtains had one measurement.
translation:
  language: id
  text: Panjang setiap tirai adalah dua puluh delapan hasta, dan lebarnya empat hasta; semua tirai itu berukuran sama.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֹרֶךְ
  choice: panjang
  rationale: Padanan baku dan alami untuk ukuran memanjang suatu benda.
- source_word: יְרִיעָה
  choice: tirai
  rationale: Dalam konteks Kemah Suci, kata ini menunjuk pada lembaran kain yang membentuk penutup; “tirai” merupakan padanan yang jelas dan lazim.
- source_word: הָאַחַת / הָאֶחָת
  choice: setiap
  rationale: 'Secara harfiah berarti “yang satu”, tetapi dalam rumusan ukuran ini berfungsi secara distributif: ukuran tersebut berlaku bagi tiap-tiap tirai.'
- source_word: שְׁמֹנֶה וְעֶשְׂרִים
  choice: dua puluh delapan
  rationale: Bentuk bilangan yang wajar dalam bahasa Indonesia modern.
- source_word: אַמָּה
  choice: hasta
  rationale: Mempertahankan satuan panjang kuno dalam bentuk yang telah dikenal dalam bahasa Indonesia, tanpa memberikan konversi modern yang belum tentu tepat.
- source_word: רֹחַב
  choice: lebar
  rationale: Padanan baku untuk dimensi yang berpasangan dengan panjang.
- source_word: אַרְבַּע
  choice: empat
  rationale: Padanan langsung bagi bilangan Ibrani.
- source_word: מִדָּה אַחַת
  choice: berukuran sama
  rationale: Secara harfiah “satu ukuran”; ungkapan ini menyampaikan secara alami bahwa semua tirai memiliki ukuran yang seragam.
- source_word: לְכָל הַיְרִיעֹת
  choice: semua tirai itu
  rationale: Menyatakan bahwa keseragaman ukuran berlaku bagi seluruh tirai yang dimaksud.
