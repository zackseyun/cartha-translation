translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Penghilangan pengulangan “setiap tirai” pada klausa kedua melalui bentuk “lebarnya” menjaga kelancaran tanpa mengurangi makna sumber. Tidak ada catatan kaki karena tidak terdapat ambiguitas tekstual atau leksikal yang perlu dijelaskan kepada pembaca pada ayat ini.
