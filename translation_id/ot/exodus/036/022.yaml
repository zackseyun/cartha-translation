  text: Two tenons for each board[a], joined one to another[b]; thus he made all the boards of the tabernacle.
translation:
  language: id
  text: Dua pasak untuk setiap papan[a], dipasangkan satu dengan yang lain[b]; demikianlah ia membuat semua papan Kemah Suci.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tangan”; kata Ibrani yang biasanya berarti tangan dipakai secara kiasan untuk bagian sambungan yang menonjol pada setiap papan.
    reason: lexical_alternative
  - marker: b
    text: Atau “dipasangkan satu berhadapan dengan yang lain,” yang menekankan posisi kedua pasak yang saling berpadanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי יָדֹת
  choice: dua pasak
  rationale: Secara harfiah berarti 'dua tangan', tetapi dalam konteks pertukangan Kemah Suci menunjuk pada bagian menonjol pada papan yang masuk ke alasnya. 'Pasak' alami dan mudah dipahami dalam bahasa Indonesia.
- source_word: קֶּרֶשׁ
  choice: papan
  rationale: Menunjuk pada unit kayu struktural Kemah Suci; 'papan' merupakan padanan Indonesia yang jelas tanpa menentukan bentuknya secara berlebihan.
- source_word: מְשֻׁלָּבֹת אַחַת אֶל אֶחָת
  choice: terpasang sejajar satu dengan yang lain
  rationale: Menggambarkan hubungan yang berpadanan antara kedua pasak. 'Terpasang sejajar' menyampaikan kesesuaian susunannya tanpa menyatakan bahwa kedua pasak itu saling disambungkan.
- source_word: כֵּן עָשָׂה
  choice: demikianlah ia membuat
  rationale: Mempertahankan penunjuk cara כֵּן dan verba sederhana עָשָׂה secara langsung serta wajar.
- source_word: מִּשְׁכָּן
  choice: Kemah Suci
  rationale: Istilah Indonesia yang lazim dan mudah dikenali untuk bangunan kudus portabel dalam kitab Keluaran.
