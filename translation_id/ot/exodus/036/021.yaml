base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/021.yaml
  text: The length of each frame was ten cubits[a], and the width of each frame was a cubit and a half.
translation:
  language: id
  text: Panjang setiap rangka adalah sepuluh hasta[a], dan lebar setiap rangka adalah satu setengah hasta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “papan” untuk “rangka” (Ibrani קֶרֶשׁ); istilah ini menunjuk pada bagian-bagian struktural Kemah Suci.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶשֶׂר אַמֹּת
  choice: sepuluh hasta
  rationale: Mempertahankan satuan panjang kuno secara transparan tanpa mengubahnya ke ukuran modern.
- source_word: אֹרֶךְ
  choice: panjang
  rationale: Kata benda ini menyatakan dimensi panjang dan wajar diterjemahkan sebagai 'panjang' dalam bahasa Indonesia.
- source_word: הַקָּרֶשׁ
  choice: rangka
  rationale: Dalam konteks Kemah Suci, קֶרֶשׁ menunjuk pada bagian struktural yang tegak. 'Rangka' menyampaikan fungsi struktural tanpa memastikan bahwa bentuknya hanya papan datar; 'papan' tetap merupakan kemungkinan.
- source_word: וְאַמָּה וַחֲצִי הָאַמָּה
  choice: satu setengah hasta
  rationale: Ungkapan Ibrani secara harfiah berarti 'satu hasta dan setengah hasta'; 'satu setengah hasta' adalah bentuk Indonesia yang alami dan tepat.
- source_word: רֹחַב
  choice: lebar
  rationale: Padanan Indonesia modern yang paling jelas bagi dimensi lebar.
- source_word: הַקֶּרֶשׁ הָאֶחָד
  choice: setiap rangka
  rationale: Secara harfiah 'rangka yang satu', tetapi dalam konteks ukuran ungkapan ini bersifat distributif dan berarti ukuran masing-masing rangka.
theological_decisions: []
