translation:
  language: id
  text: Panjang setiap lembar kain itu tiga puluh hasta, dan lebar setiap lembar kain itu empat hasta. Kesebelas lembar kain itu berukuran sama.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְרִיעָה
  choice: lembar kain
  rationale: Dalam konteks pembuatan Kemah Suci, kata ini menunjuk pada lembaran kain penutup; pilihan ini alami dalam bahasa Indonesia dan membedakannya dari tirai gantung.
- source_word: אַמָּה
  choice: hasta
  rationale: Mempertahankan satuan panjang kuno yang lazim dalam terjemahan Alkitab Indonesia tanpa menetapkan konversi yang tidak dinyatakan teks.
- source_word: מִדָּה אַחַת
  choice: berukuran sama
  rationale: Ungkapan harfiah 'satu ukuran' menyatakan bahwa kesebelas lembar memiliki ukuran yang seragam; bentuk ini alami dan tepat dalam bahasa Indonesia.
