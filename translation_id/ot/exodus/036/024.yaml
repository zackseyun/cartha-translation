base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/024.yaml
  text: And he made forty silver bases under the twenty frames, two bases under the one frame for its two tenons, and two bases under the other frame for its two tenons.
translation:
  language: id
  text: 'Ia membuat empat puluh alas dari perak untuk kedua puluh papan itu: dua alas di bawah papan yang satu bagi kedua pasaknya, dan dua alas di bawah papan yang lain bagi kedua pasaknya.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַדְנֵי
  choice: alas
  rationale: Menunjuk pada dudukan penopang dari perak di bawah papan; “alas” alami dan mudah dipahami dalam bahasa Indonesia.
- source_word: הַקְּרָשִׁים
  choice: papan
  rationale: Istilah ini menunjuk pada unsur kayu tegak dalam Kemah Suci; “papan” mempertahankan bentuk konkret tanpa terlalu menentukan konstruksinya.
- source_word: יְדֹתָיו
  choice: pasaknya
  rationale: Secara harfiah berarti “tangan-tangannya”, tetapi dalam konteks pertukangan menunjuk pada tonjolan atau pasak papan yang masuk ke alas.
- source_word: הָאֶחָד ... הָאֶחָד
  choice: yang satu ... yang lain
  rationale: Pengulangan Ibrani membedakan dua papan dalam pola distribusi; ungkapan Indonesia ini menyampaikan hubungan tersebut dengan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bermartabat. Struktur angka serta hubungan antara setiap papan, dua pasak, dan dua alas dipertahankan.
