translation:
  language: id
  text: Ia melapisi rangka-rangka itu dengan emas[a], membuat cincin-cincin emasnya sebagai tempat[b] bagi palang-palang, dan melapisi palang-palang itu dengan emas.
  philosophy: optimal-equivalence
