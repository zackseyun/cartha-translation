lexical_decisions:
- source_word: הַקְּרָשִׁים
  choice: rangka-rangka
  rationale: Dalam konteks Kemah Suci, istilah ini menunjuk pada unsur-unsur kayu tegak yang membentuk strukturnya. “Rangka-rangka” menyampaikan fungsi bangunannya dalam bahasa Indonesia modern, sedangkan alternatif “papan-papan” dicatat dalam catatan kaki.
- source_word: צִפָּה / וַיְצַף
  choice: melapisi
  rationale: Kata kerja ini menyatakan tindakan menutupi suatu benda dengan lapisan bahan tertentu; “melapisi ... dengan emas” tepat dan alami untuk kedua kemunculannya.
- source_word: זָהָב
  choice: emas
  rationale: Istilah bahan yang langsung. Ketiga kemunculannya dipertahankan untuk menjaga pengulangan dan penekanan dalam teks Ibrani.
- source_word: טַבְּעֹתָם
  choice: gelang-gelangnya
  rationale: טַבַּעַת berarti gelang atau cincin; di sini yang dimaksud ialah gelang logam yang terkait dengan rangka-rangka. Bentuk dengan sufiks jamak diterjemahkan secara alami sebagai “gelang-gelangnya”.
- source_word: עָשָׂה
  choice: membuat
  rationale: Padanan yang paling langsung dan alami bagi kata kerja umum yang berarti membuat atau mengerjakan.
- source_word: בָּתִּים
  choice: tempat
  rationale: Secara harfiah berarti “rumah-rumah”, tetapi di sini dipakai secara fungsional untuk wadah atau penahan tempat kayu-kayu lintang dipasang. “Tempat” menjaga kejelasan tanpa menentukan bentuk teknisnya secara berlebihan.
- source_word: לַבְּרִיחִם
  choice: bagi kayu-kayu lintang
  rationale: בְּרִיחִים menunjuk pada batang-batang melintang yang menyatukan unsur-unsur tegak Kemah Suci. “Kayu-kayu lintang” konkret dan lazim dalam konteks bangunan.
