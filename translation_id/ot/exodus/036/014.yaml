  text: Ia membuat tirai dari bulu kambing untuk menjadi kemah di atas Kemah Suci; sebelas tirai dibuatnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tirai dari kambing”; dalam konteks tekstil Kemah Suci, bahan itu kemungkinan besar adalah bulu kambing.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ / עָשָׂה
  choice: Ia membuat
  rationale: Kata kerja עשה berarti “membuat/mengerjakan.” Pengulangan dalam bahasa Ibrani disampaikan secara alami dalam bahasa Indonesia melalui satu konstruksi yang tetap mencakup tindakan dan jumlah hasilnya.
- source_word: יְרִיעֹת
  choice: lembar kain
  rationale: Dalam konteks Kemah Suci, istilah ini menunjuk pada bidang-bidang besar kain atau tirai. “Lembar kain” jelas, alami, dan cocok dengan bahan yang kemudian dirangkai menjadi penutup.
- source_word: עִזִּים
  choice: dari bulu kambing
  rationale: Secara harfiah kata ini berarti “kambing,” tetapi dalam konteks tekstil Kemah Suci bahan yang dimaksud kemungkinan besar ialah bulu kambing yang ditenun; kemungkinan bahwa bahannya dibiarkan tersirat dicatat dalam catatan kaki.
- source_word: לְאֹהֶל
  choice: untuk menjadi kemah penutup
  rationale: Prefiks ל menyatakan fungsi atau hasil. Ungkapan ini membedakan lapisan kemah penutup dari Kemah Suci yang berada di bawahnya.
- source_word: עַל
  choice: di atas
  rationale: Preposisi ini menyatakan posisi lapisan penutup terhadap Kemah Suci.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: מִשְׁכָּן adalah istilah teknis bagi tempat kudus portabel dalam kitab Keluaran. “Kemah Suci” merupakan padanan Indonesia yang jelas dan lazim.
- source_word: עַשְׁתֵּי עֶשְׂרֵה
  choice: sebelas
  rationale: Bilangan ini secara langsung berarti “sebelas.”
- source_word: אֹתָם
  choice: tercakup dalam objek “sebelas lembar kain”
  rationale: Pronomina objek merujuk kembali kepada lembar-lembar kain; dalam susunan Indonesia, maknanya sudah terwakili tanpa menambahkan “semuanya” secara tidak perlu.
