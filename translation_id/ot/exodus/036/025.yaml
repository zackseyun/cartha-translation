translation:
  language: id
  text: Untuk sisi kedua Kemah Suci, pada sisi utara, ia membuat dua puluh papan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rangka.” Istilah Ibraninya dapat menunjuk pada papan struktural atau rangka; bentuk persis bagian-bagian Kemah Suci ini masih diperdebatkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְצֶלַע
  choice: Untuk sisi
  rationale: צֶלַע dalam konteks pembangunan Kemah Suci menunjuk pada sisi bangunan, bukan tulang rusuk; gabungan waw dan preposisi lamed wajar diterjemahkan sebagai “Untuk sisi” dalam laporan konstruksi ini.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: מִשְׁכָּן secara harfiah berkaitan dengan tempat kediaman, tetapi dalam konteks ini merupakan sebutan bagi tempat ibadah portabel Israel; “Kemah Suci” adalah istilah Indonesia yang jelas dan lazim.
- source_word: הַשֵּׁנִית
  choice: kedua
  rationale: Kata sifat ini menandai sisi kedua dalam urutan pembangunan dan dipertahankan secara langsung.
- source_word: לִפְאַת צָפוֹן
  choice: yaitu sisi utara
  rationale: Ungkapan ini menentukan arah atau bagian utara. “Yaitu sisi utara” menghubungkan keterangan tersebut secara alami dengan “sisi kedua” tanpa mengubah acuannya.
- source_word: עָשָׂה
  choice: ia membuat
  rationale: עָשָׂה adalah verba umum untuk membuat atau mengerjakan; “membuat” tepat dan alami dalam laporan konstruksi.
- source_word: עֶשְׂרִים
  choice: dua puluh
  rationale: Padanan langsung bagi bilangan kardinal tersebut.
- source_word: קְרָשִׁים
  choice: papan
  rationale: Istilah ini menunjuk pada unsur kayu struktural Kemah Suci. “Papan” merupakan padanan yang mudah dipahami, sedangkan kemungkinan bentuk berupa rangka dipertahankan dalam catatan kaki.
