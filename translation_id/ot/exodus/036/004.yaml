    text: 'Secara harfiah: “orang demi orang dari pekerjaannya yang sedang mereka kerjakan”; ini adalah ungkapan distributif, yaitu masing-masing datang dari pekerjaan yang sedang dikerjakannya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Lalu datanglah
  rationale: Bentuk wayyiqtol melanjutkan urutan peristiwa dalam narasi; “lalu datanglah” alami dalam bahasa Indonesia dan mempertahankan gerak mendekat yang dinyatakan בוא.
- source_word: כָּל הַחֲכָמִים
  choice: semua orang terampil
  rationale: Dalam konteks pembangunan Kemah Suci, חֲכָמִים menunjuk kepada orang-orang yang memiliki keahlian, bukan semata-mata kebijaksanaan intelektual. Pilihan ini juga tidak menambahkan jenis profesi tertentu.
- source_word: הָעֹשִׂים אֵת כָּל מְלֶאכֶת הַקֹּדֶשׁ
  choice: yang mengerjakan seluruh pekerjaan bagi tempat kudus itu
  rationale: Partisipel הָעֹשִׂים menunjukkan kegiatan yang sedang berlangsung. מְלֶאכֶת menyatakan pekerjaan atau pengerjaan, sedangkan הַקֹּדֶשׁ dalam konteks ini menunjuk kepada tempat kudus. “Bagi” menyampaikan bahwa pekerjaan tersebut diperuntukkan bagi tempat kudus, tanpa menyebut pekerjaannya sendiri kudus.
- source_word: אִישׁ אִישׁ
  choice: masing-masing
  rationale: Pengulangan אִישׁ bersifat distributif, yaitu setiap orang secara individual. “Masing-masing” menyampaikan fungsi ini secara alami.
- source_word: מִמְּלַאכְתּוֹ
  choice: meninggalkan pekerjaan
  rationale: Preposisi מִן menyatakan gerak dari atau menjauh dari pekerjaan masing-masing. Dalam konteks kedatangan para pekerja kepada Musa, “meninggalkan pekerjaan” membuat arah gerak itu jelas tanpa menyiratkan bahwa tugas tersebut ditelantarkan secara permanen.
- source_word: אֲשֶׁר הֵמָּה עֹשִׂים
  choice: yang sedang mereka kerjakan
  rationale: Teks Ibrani memakai pronomina jamak הֵמָּה dan partisipel jamak עֹשִׂים. Terjemahan mempertahankan bentuk jamak tersebut, sementara “masing-masing” tetap menyampaikan makna distributif konstruksi keseluruhan.
