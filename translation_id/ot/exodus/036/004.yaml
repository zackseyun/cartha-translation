translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Orang terampil” mudah dipahami serta tidak menyempitkan kelompok itu menjadi profesi tertentu. Struktur kalimat mempertahankan urutan narasi dan ketegangan gramatikal antara ungkapan distributif tunggal dan kata kerja jamak; rincian harfiahnya dijelaskan dalam catatan kaki.
