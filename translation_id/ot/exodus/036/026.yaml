translation:
  language: id
  text: 'dan empat puluh alasnya dari perak: dua alas di bawah papan yang satu[a] dan dua alas di bawah papan yang satu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dua alas di bawah rangka yang satu dan dua alas di bawah rangka yang satu.” Teks Ibrani mengulang “yang satu” dalam kedua klausa; terjemahan lain kadang memakai “yang lain” pada klausa kedua agar lebih alami.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַרְבָּעִים
  choice: dan keempat puluh
  rationale: Konjungsi melanjutkan daftar konstruksi, sedangkan bentuk bilangan dengan artikel pronominal pada frasa berikutnya secara alami diterjemahkan sebagai 'keempat puluh alasnya'.
- source_word: אַדְנֵי/הֶם
  choice: alasnya
  rationale: Dalam konteks Kemah Suci, אֲדָנִים menunjuk pada penyangga atau dudukan di bawah rangka. 'Alas' jelas dan sesuai dengan konteks bangunan.
- source_word: כָּסֶף
  choice: dari perak
  rationale: Nomina ini menyatakan bahan pembuat alas; konstruksi 'dari perak' alami dalam bahasa Indonesia dan tidak menyiratkan sekadar warna.
- source_word: שְׁנֵי אֲדָנִים
  choice: dua alas
  rationale: Frasa bilangan dan nomina diterjemahkan langsung serta konsisten dengan pilihan sebelumnya.
- source_word: תַּחַת
  choice: di bawah
  rationale: Preposisi ini menunjukkan letak alas terhadap rangka.
- source_word: הַ/קֶּרֶשׁ
  choice: rangka
  rationale: Dalam konteks konstruksi Kemah Suci, קֶרֶשׁ merupakan unsur tegak struktural. 'Rangka' menyampaikan fungsinya dengan bahasa Indonesia modern; 'papan' tetap merupakan kemungkinan leksikal.
- source_word: הָ/אֶחָד
  choice: satu
  rationale: Ibrani secara harfiah mengulang 'yang satu' dalam kedua klausa. Terjemahan mempertahankan pengulangan tersebut tanpa mengubah kemunculan kedua menjadi 'rangka lainnya'.
