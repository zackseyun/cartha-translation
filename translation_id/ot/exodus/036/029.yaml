base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/029.yaml
  text: They were paired at the bottom[a], and together they were complete up to its top, to the one ring. Thus he did for both of them[c][b], for the two corners.
translation:
  language: id
  text: Keduanya dipasangkan dari bawah,[a] dan bersama-sama dipadukan hingga ke puncaknya, pada cincin yang satu itu.[b] Demikianlah ia membuat keduanya untuk kedua sudut itu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dibuat saling berpadanan dari bawah.” Kata Ibrani menekankan bahwa kedua bagian itu bersesuaian secara struktural sebagai sepasang.
    reason: lexical_alternative
  - marker: b
    text: Atau “bersama-sama utuh hingga ke puncaknya.” Kata Ibrani dapat menekankan bahwa kedua bagian itu lengkap atau terpadu sampai ke bagian atas, pada cincin yang satu itu.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “untuk kedua sudut.” Ungkapan ini mungkin merujuk pada kedua bagian rangka di sudut.
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹאֲמִם
  choice: dipasangkan
  rationale: Bentuk ini menyatakan bahwa kedua unsur dibuat saling berpadanan sebagai sepasang; 'dipasangkan' alami dalam bahasa Indonesia dan tetap mempertahankan sifat strukturalnya.
- source_word: מִלְּמַטָּה
  choice: pada bagian bawah
  rationale: Menunjukkan lokasi tempat kedua unsur itu berpasangan; ungkapan ini jelas dan wajar dalam uraian konstruksi.
- source_word: יַחְדָּו
  choice: menyatu
  rationale: Secara dasar berarti 'bersama-sama'; dalam konteks konstruksi, 'menyatu' menyampaikan bahwa kedua unsur tersebut bertemu atau tergabung, tanpa mengulang kata 'bersama' secara kaku.
- source_word: תַמִּים
  choice: dengan utuh
  rationale: Menjaga gagasan keutuhan atau kelengkapan konstruksi sampai ke bagian atas, sekaligus membedakannya dari gagasan berpasangan pada תוֹאֲמִם.
- source_word: אֶל רֹאשׁוֹ
  choice: sampai ke puncaknya
  rationale: Mempertahankan arah dan batas perkembangan konstruksi dari bawah menuju ujung atas. Pronomina tunggal pada teks sumber dipertahankan dengan '-nya' tanpa menentukan rujukannya secara berlebihan.
- source_word: הַטַּבַּעַת הָאֶחָת
  choice: satu gelang
  rationale: Mempertahankan bilangan 'satu' dan istilah benda konstruksi טַבַּעַת tanpa menafsirkannya sebagai gelang 'pertama'.
- source_word: כֵּן עָשָׂה
  choice: Demikianlah dibuatnya
  rationale: Mencerminkan rangkuman cara pengerjaan dan bentuk verba tunggal Ibrani dalam ragam naratif yang bermartabat.
- source_word: לִשְׁנֵיהֶם
  choice: kedua-duanya
  rationale: Secara langsung merujuk pada dua unsur yang diperlakukan dengan cara yang sama.
- source_word: לִשְׁנֵי הַמִּקְצֹעֹת
  choice: pada kedua sudut itu
  rationale: מִקְצֹעֹת menunjuk pada kedua sudut atau kawasan sudut; 'pada' menghasilkan hubungan lokasi yang alami dalam bahasa Indonesia, sementara catatan kaki mempertahankan kemungkinan acuan kepada bagian sudut.
