revisions:
- from: Keduanya dipasangkan pada bagian bawah,[a] dan menyatu dengan utuh sampai ke puncaknya, pada satu gelang. Demikianlah dibuatnya kedua-duanya,[b] pada kedua sudut itu.[c]
  to: Keduanya dipasangkan dari bawah,[a] dan bersama-sama dipadukan hingga ke puncaknya, pada cincin yang satu itu.[b] Demikianlah ia membuat keduanya untuk kedua sudut itu.[c]
  rationale: 'Revisi memperbaiki kejelasan dan kelaziman bahasa Indonesia sambil mempertahankan urutan pokok Ibrani: kesepadanan dari bawah, keadaan bersama/terpadu sampai bagian atas pada satu cincin, lalu penerapannya pada kedua sudut. Istilah “dipadukan” menyatakan hasil konstruksional תַמִּים tanpa memaksakan penafsiran teknis yang lebih spesifik. Penanda catatan kaki juga disejajarkan kembali dengan unsur yang benar.'
