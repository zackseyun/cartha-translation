  text: And he made the boards for the tabernacle of acacia wood[a], standing upright.
translation:
  language: id
  text: Ia membuat papan-papan untuk Kemah Suci dari kayu akasia[a], yang berdiri tegak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia membuat papan-papan dari kayu akasia untuk Kemah Suci, dalam posisi tegak.”'
    reason: Susunan frasa Ibrani padat dan memungkinkan pengelompokan keterangan bahan serta posisi dengan sedikit perbedaan, tanpa mengubah pokok maknanya.
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia membuat
  rationale: Bentuk wayyiqtol dari עשה melanjutkan urutan narasi dengan tindakan lampau sederhana. Bahasa Indonesia tidak perlu selalu menyatakan וַ dengan kata penghubung tersendiri.
- source_word: הַקְּרָשִׁים
  choice: papan-papan
  rationale: Dalam konteks pembangunan Kemah Suci, קֶרֶשׁ menunjuk pada papan atau panel struktural. 'Papan-papan' jelas, konkret, dan sesuai dengan bentuk jamak.
- source_word: לַמִּשְׁכָּן
  choice: untuk Kemah Suci
  rationale: מִשְׁכָּן adalah tempat kediaman kudus yang dibangun dalam bagian ini. 'Kemah Suci' merupakan istilah Indonesia yang alami dan mudah dipahami dalam konteks Keluaran.
- source_word: עֲצֵי שִׁטִּים
  choice: dari kayu akasia
  rationale: Frasa konstruksi ini secara idiomatis menunjuk pada bahan berupa kayu akasia; 'kayu akasia' lebih transparan bagi pembaca modern daripada transliterasi nama Ibraninya.
- source_word: עֹמְדִים
  choice: yang berdiri tegak
  rationale: Partisipel jamak ini menerangkan orientasi papan-papan sebagai unsur bangunan. 'Berdiri tegak' mempertahankan gambaran sumber tanpa mengubahnya menjadi perintah atau tindakan terpisah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Istilah teknis dibuat konkret, sementara susunan kalimat tetap menjaga hubungan antara papan-papan, bahan kayu akasia, dan posisinya yang tegak.
