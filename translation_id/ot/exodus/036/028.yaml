translation:
  language: id
  text: Ia membuat dua papan untuk sudut-sudut Kemah Suci di bagian belakang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “untuk bagian-bagian sudut Kemah Suci, pada kedua sisi belakangnya.” Istilah-istilah Ibrani menggambarkan ujung atau sudut belakang bangunan dan dapat menekankan letak sudut ataupun papan-papan sudut yang disambungkan secara khusus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁנֵי
  choice: dua
  rationale: Bentuk konstruk dari bilangan 'dua' dipertahankan secara eksplisit; waw penghubung tidak perlu diterjemahkan tersendiri karena bahasa Indonesia alami dapat melanjutkan urutan tanpa 'dan' pada awal kalimat.
- source_word: קְרָשִׁים
  choice: papan
  rationale: Dalam konteks pembangunan Kemah Suci, kata ini menunjuk pada papan kayu struktural; 'papan' adalah padanan Indonesia yang jelas dan lazim.
- source_word: עָשָׂה
  choice: Ia membuat
  rationale: Kata kerja umum עשה berarti 'membuat'; subjek tunggal maskulin diterjemahkan dengan 'Ia' sesuai alur narasi.
- source_word: לִ/מְקֻצְעֹת
  choice: untuk sudut-sudut
  rationale: Istilah ini dapat menunjuk pada sudut atau bagian penyambung sudut. Terjemahan utama memakai lokasi sudut yang paling langsung, sementara kemungkinan arsitektural dicatat dalam catatan kaki.
- source_word: הַ/מִּשְׁכָּן
  choice: Kemah Suci
  rationale: Dalam konteks kitab Keluaran, istilah ini merujuk pada tempat kediaman kudus portabel. 'Kemah Suci' merupakan istilah Indonesia yang alami, dikenal luas, dan sesuai dengan referennya.
- source_word: בַּ/יַּרְכָתָיִם
  choice: di bagian belakang
  rationale: Bentuk dual ini menunjuk pada dua sisi atau ujung paling belakang. 'Di bagian belakang' menghindari pengulangan kata 'sudut', sedangkan nuansa dua sisi belakang dipertahankan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. 'Kemah Suci' dipakai sebagai istilah yang mudah dipahami bagi המשכן. Catatan kaki mempertahankan ketidakpastian arsitektural dalam לִמְקֻצְעֹת dan nuansa dual בַּיַּרְכָתָיִם.
