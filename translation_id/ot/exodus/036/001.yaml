base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/001.yaml
  text: And Bezalel and Oholiab[a], and every skillful man in whom Yahweh has put wisdom and understanding to know how to do all the work for the service of the sanctuary[c][b], shall do according to all that Yahweh has commanded.
translation:
  language: id
  text: Bezalel, Oholiab, dan setiap orang yang terampil[a]—yang telah Yahweh beri hikmat dan pengertian[b] sehingga tahu cara mengerjakan segala pekerjaan untuk pelayanan tempat kudus[c]—harus mengerjakan segala pekerjaan itu sesuai dengan segala yang diperintahkan Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “setiap orang yang bijaksana hatinya”; dalam konteks ini ungkapan tersebut menunjuk kepada pekerja yang terampil.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “yang ke dalam diri mereka telah Yahweh taruh hikmat dan pengertian.” Kata ganti Ibraninya berbentuk jamak dan secara kolektif merujuk kepada Bezalel, Oholiab, dan setiap orang yang terampil.'
    reason: source_ambiguity
  - marker: c
    text: 'Atau: “segala pekerjaan pelayanan tempat kudus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה
  choice: harus melaksanakannya
  rationale: Bentuk perfektum berkonjungsi dalam rangkaian petunjuk ini menyatakan tindakan yang diwajibkan atau diharapkan. “Harus melaksanakannya” menyampaikan daya direktifnya dan secara alami merujuk kembali kepada seluruh pekerjaan yang baru disebutkan.
- source_word: בְצַלְאֵל וְאָהֳלִיאָב
  choice: Bezalel, Oholiab
  rationale: Nama-nama pribadi ditransliterasikan secara dekat dari bentuk Ibrani.
- source_word: וְכֹל אִישׁ חֲכַם לֵב
  choice: dan setiap orang yang terampil
  rationale: Secara harfiah ungkapan ini berarti “setiap orang yang bijaksana hatinya,” tetapi dalam konteks pembuatan Kemah Suci ungkapan itu menunjuk kepada kecakapan yang dianugerahkan Allah. “Orang yang terampil” jelas dan wajar dalam bahasa Indonesia, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: אֲשֶׁר נָתַן יְהוָה חָכְמָה וּתְבוּנָה בָהֵמָּה
  choice: yang telah Yahweh beri hikmat dan pengertian
  rationale: נתן menyatakan pemberian atau penempatan kemampuan itu oleh Yahweh. Susunan Indonesia ini alami; bentuk jamak בָהֵמָּה yang merujuk secara kolektif kepada semua pekerja dijelaskan dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditampilkan sebagai nama diri, bukan diganti dengan gelar.
- source_word: לָדַעַת לַעֲשֹׂת
  choice: sehingga tahu cara mengerjakan
  rationale: Kedua infinitif menyatakan pengetahuan praktis atau kemampuan untuk mengerjakan tugas. “Tahu cara” menyampaikan fungsi ini secara alami.
- source_word: כָּל מְלֶאכֶת עֲבֹדַת הַקֹּדֶשׁ
  choice: segala pekerjaan untuk pelayanan tempat kudus
  rationale: מְלָאכָה adalah pekerjaan atau keahlian kerja, עֲבֹדָה adalah pelayanan atau tugas, dan הַקֹּדֶשׁ dalam konteks ini menunjuk kepada tempat kudus. Kata “untuk” menyatakan hubungan fungsional tanpa menghapus konstruksi Ibraninya.
- source_word: לְכֹל אֲשֶׁר צִוָּה יְהוָה
  choice: sesuai dengan segala yang diperintahkan Yahweh
  rationale: 'Prefiks לְ dipahami sebagai kesesuaian: pekerjaan itu dilaksanakan menurut seluruh perintah Yahweh.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan fungsi nama tersebut dan tidak menggantinya dengan gelar.
- issue: Cakupan gender ungkapan אִישׁ חֲכַם לֵב
  choice: setiap orang yang terampil
  alternative: setiap laki-laki yang bijaksana hatinya
  rationale: אִישׁ berbentuk maskulin tunggal, tetapi dalam konstruksi generik ini pusat maknanya ialah setiap individu yang memiliki kecakapan untuk pekerjaan tersebut. “Orang” mempertahankan rujukan individual tanpa memaksakan pembatasan gender yang tidak dinyatakan oleh konteks tugas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Tanda pisah mengapit klausa penjelas yang panjang agar subjek dan predikat utama tetap jelas. Istilah “tempat kudus” dipilih karena הַקֹּדֶשׁ di sini merujuk kepada ruang atau kawasan suci, bukan konsep kekudusan yang abstrak.
