translation:
  language: id
  text: Ia membuat lima puluh pengait perunggu untuk menghubungkan Kemah itu[a] menjadi satu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kemah Suci”; kata “Kemah” di sini mengacu pada bangunan Kemah Suci.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia membuat
  rationale: Bentuk wayyiqtol dari עשה melanjutkan narasi dengan tindakan lampau. Bahasa Indonesia tidak perlu mempertahankan kata penghubung waw secara eksplisit.
- source_word: קַרְסֵי
  choice: pengait
  rationale: Kata ini menunjuk pada alat penyambung bagian-bagian kain Kemah Suci. 'Pengait' merupakan istilah Indonesia modern yang konkret dan mudah dipahami.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Dalam konteks bahan Kemah Suci, נְחֹשֶׁת lazim dipahami sebagai perunggu, yakni logam yang dikerjakan untuk perlengkapan tersebut.
- source_word: חֲמִשִּׁים
  choice: lima puluh
  rationale: Bilangan kardinal yang secara langsung menerangkan jumlah pengait.
- source_word: לְחַבֵּר
  choice: untuk menyatukan
  rationale: Infinitif ini menyatakan tujuan. 'Menyatukan' secara alami menggambarkan fungsi pengait yang menghubungkan bagian-bagian Kemah menjadi satu.
- source_word: אֶת הָאֹהֶל
  choice: Kemah itu
  rationale: אֹהֶל secara harfiah berarti 'kemah'. Huruf kapital membantu menunjukkan bahwa dalam konteks ini istilah tersebut mengacu pada bangunan Kemah Suci tanpa mengganti kata sumber dengan istilah yang lebih interpretatif.
- source_word: לִהְיוֹת אֶחָד
  choice: sehingga menjadi satu kesatuan
  rationale: Ungkapan ini menyatakan hasil atau tujuan penyambungan. 'Satu kesatuan' memperjelas bahwa bagian-bagian bangunan membentuk satu unit, bukan sekadar menyatakan angka satu.
