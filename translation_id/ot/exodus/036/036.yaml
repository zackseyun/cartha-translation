  text: He made for it four pillars of acacia wood and overlaid them with gold[a]; their hooks were of gold[b]; and he cast for them four silver bases.
translation:
  language: id
  text: Ia membuat untuk tirai itu empat tiang dari kayu akasia dan melapisinya dengan emas. Kait-kait pada tiang-tiang itu dari emas, dan ia mencetak empat alas perak untuk tiang-tiang itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַמּוּדֵי שִׁטִּים
  choice: tiang dari kayu akasia
  rationale: עַמּוּדִים menunjuk pada penyangga tegak, sedangkan שִׁטִּים adalah kayu akasia. Ungkapan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: וַיְצַפֵּם
  choice: melapisinya dengan emas
  rationale: Dalam konteks pembuatan Kemah Suci, verba צפה menyatakan pelapisan benda dengan logam; 'melapisi' tepat dan alami.
- source_word: וָוֵיהֶם
  choice: kait-kait tiang itu
  rationale: וָוִים di sini paling mungkin menunjuk pada kait atau pengait yang terpasang pada tiang. Penyebutan 'tiang itu' memperjelas acuan pronomina jamak dalam bahasa Indonesia.
- source_word: וַיִּצֹק
  choice: ia menuang
  rationale: יצק dalam konteks benda logam berarti membentuknya dengan menuangkan logam cair ke dalam cetakan. 'Menuang' mempertahankan gambaran tindakan sumber dan lazim dalam konteks pengerjaan logam.
- source_word: אַדְנֵי כָסֶף
  choice: alas dari perak
  rationale: אֲדָנִים adalah bagian landasan tempat tiang dipasang. 'Alas' mudah dipahami dan tidak menyiratkan bentuk teknis yang tidak dinyatakan secara pasti; כָסֶף berarti perak.
- source_word: לָהּ
  choice: untuk tirai itu
  rationale: Pronomina feminin tunggal mengacu pada tirai (הַפָּרֹכֶת) dalam ayat sebelumnya. Karena bahasa Indonesia tidak menandai gender gramatikal, acuan tersebut dinyatakan agar jelas tanpa mengubah referennya.
