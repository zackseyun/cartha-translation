translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mengikuti urutan tindakan dalam teks Ibrani sambil memperjelas acuan pronomina yang tidak dapat ditandai melalui gender dalam bahasa Indonesia. Tidak diperlukan catatan kaki karena alternatif leksikal tidak memengaruhi makna ayat secara berarti.
