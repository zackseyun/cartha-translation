base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/011.yaml
  text: He made loops of blue yarn on the edge of the first curtain at the end of the first set joined together[a]; likewise he made them on the edge of the outermost curtain in the second set joined together.
translation:
  language: id
  text: Ia membuat gelung-gelung dari benang biru pada tepi kain pertama, pada ujung kelompok kain pertama yang disatukan[a]; demikian pula ia membuatnya pada tepi kain yang paling luar dalam kelompok kain kedua yang disatukan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pada sambungan” atau “di tempat penyambungan.” Istilah Ibrani ini dapat menunjuk pada sambungan atau pada susunan kain yang disatukan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֻלְאֹת
  choice: sosok-sosok
  rationale: Kata ini menunjuk pada gelung dari bahan tekstil yang dipakai untuk menghubungkan kain-kain. 'Sosok' adalah istilah Indonesia yang tepat untuk gelung pengikat semacam itu.
- source_word: תְּכֵלֶת
  choice: benang biru
  rationale: Dalam konteks pembuatan Kemah Suci, kata ini menunjuk pada bahan tekstil yang diwarnai biru, bukan sekadar warna abstrak; 'benang biru' menyatakan bahan pembuat sosok dengan jelas.
- source_word: שְׂפַת
  choice: tepi
  rationale: Secara harfiah dapat berarti 'bibir', tetapi di sini menunjuk pada tepi kain.
- source_word: הַיְרִיעָה
  choice: kain
  rationale: Dalam konteks ini kata tersebut menunjuk pada lembaran kain pembentuk penutup Kemah Suci. 'Kain' alami dan mudah dipahami dalam bahasa Indonesia.
- source_word: הָאֶחָת
  choice: pertama
  rationale: Secara harfiah 'yang satu', tetapi dalam konstruksi berpasangan dan dalam kontras dengan 'kedua', kata ini berfungsi sebagai bilangan tingkat.
- source_word: מִקָּצָה
  choice: di ujung
  rationale: Frasa ini menunjukkan letak sosok-sosok pada bagian ujung kain tempat penyambungan dilakukan.
- source_word: בַּמַּחְבָּרֶת
  choice: dalam rangkaian ... yang disambungkan
  rationale: Kata ini dapat menunjuk pada penyambungan atau susunan kain yang telah dihubungkan. Terjemahan ini menyampaikan fungsi dan susunannya secara alami, sementara catatan kaki mempertahankan alternatif yang lebih harfiah.
- source_word: כֵּן עָשָׂה
  choice: Demikian juga ia membuatnya
  rationale: Ungkapan ini menyatakan tindakan sejajar pada tepi kain yang lain dan mempertahankan paralelisme ayat.
- source_word: הַקִּיצוֹנָה
  choice: terluar
  rationale: Kata sifat ini menunjuk pada kain yang berada pada bagian paling ujung dari rangkaian.
- source_word: הַשֵּׁנִית
  choice: kedua
  rationale: Bilangan tingkat ini secara eksplisit membedakan rangkaian kedua dari rangkaian pertama.
