  naturalness: Teks revisi memakai “gelung-gelung” dan “kelompok kain ... yang disatukan,” yang lebih jelas dan alami daripada “sosok-sosok” dan “rangkaian ... yang disambungkan.” Paralelisme tindakan kedua tetap terjaga.
