base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/037.yaml
  text: And he made a screen for the entrance of the tent[a], of blue and purple and scarlet yarn, and fine twisted linen, the work of an embroiderer.
translation:
  language: id
  text: Ia membuat tirai[a] untuk pintu masuk kemah dari benang biru, ungu, dan merah kirmizi, serta lenan halus yang dipintal—karya seorang penyulam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tabir”. Istilah Ibrani ini menunjuk pada kain penutup yang digantung pada pintu masuk, berbeda dari tirai bagian dalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia membuat
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi. 'Ia membuat' alami dalam bahasa Indonesia dan tidak menambahkan penekanan yang tidak ada pada teks sumber.
- source_word: מָסָךְ
  choice: tirai
  rationale: Kata ini menunjuk pada kain penutup di jalan masuk. 'Tirai' merupakan padanan Indonesia yang alami; catatan kaki membedakannya dari פָּרֹכֶת, tirai bagian dalam.
- source_word: לְפֶתַח הָאֹהֶל
  choice: untuk pintu masuk Kemah
  rationale: פֶּתַח berarti bukaan atau jalan masuk, sedangkan אֹהֶל secara harfiah berarti kemah. Huruf kapital menandai Kemah khusus yang sedang dibangun tanpa memperluas istilah Ibrani menjadi 'Kemah Suci'.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: benang biru, ungu, dan merah tua
  rationale: Ketiga istilah menyatakan bahan tekstil berdasarkan warnanya. 'Benang' disebut sekali untuk seluruh rangkaian agar jelas dan alami; 'merah tua' mempertahankan cakupan warna scarlet/crimson tanpa kepastian berlebihan tentang rona tepatnya.
- source_word: וְשֵׁשׁ מָשְׁזָר
  choice: serta lenan halus yang dipintal
  rationale: שֵׁשׁ menunjuk pada lenan halus dan מָשְׁזָר pada bahan yang dipintal atau dipilin. Rumusan ini mempertahankan mutu bahan dan cara pembuatannya.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: karya seorang penyulam
  rationale: Frasa konstruksi ini menyatakan hasil kerja perajin tekstil yang membuat ragam hias berwarna. 'Penyulam' adalah padanan ringkas dan mudah dipahami.
