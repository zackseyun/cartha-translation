    rationale: Catatan audit bahasa Inggris berfungsi untuk membedakan מָסָךְ, penutup pada pintu masuk, dari פָּרֹכֶת, tirai bagian dalam. Catatan Indonesia perlu mengikuti jangkar dan fungsi leksikal tersebut; penjelasan "Kemah Pertemuan" juga menambahkan perluasan yang tidak dinyatakan oleh kata אָהֶל itu sendiri.
  - severity: low
