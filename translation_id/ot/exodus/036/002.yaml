revisions:
- from: Lalu Musa memanggil Bezalel dan Oholiab serta setiap orang yang berhati bijaksana[a], yang hatinya telah diberi hikmat oleh Yahweh—setiap orang yang terdorong hatinya[b] untuk datang mengerjakan pekerjaan itu.
  to: Lalu Musa memanggil Bezalel, Oholiab, dan setiap orang yang berhati bijaksana[a], yang di dalam hatinya Yahweh telah menaruh hikmat—setiap orang yang hatinya mendorongnya[b] untuk datang mengerjakan pekerjaan itu.
  rationale: Revisi memulihkan secara lebih tepat gagasan bahwa Yahweh menaruh hikmat di dalam hati orang-orang itu dan bahwa hati mereka sendiri mendorong mereka. Susunan tetap modern, baku, dan tidak menambahkan penafsiran mengenai sumber dorongan tersebut.
