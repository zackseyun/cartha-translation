review_pass:
  verdict: revise
  source_fidelity: 'Draf ini secara umum mengikuti teks Ibrani dengan baik, termasuk penyebutan Bezalel dan Oholiab, pengulangan cakupan “setiap orang,” hikmat yang Yahweh berikan, serta dorongan batin untuk mendekati pekerjaan itu. Namun, “yang hatinya telah diberi hikmat oleh Yahweh” menggeser konstruksi sumber: Ibrani menyatakan bahwa Yahweh memberikan/menaruh hikmat di dalam hati orang itu, bukan bahwa hati itu sendiri diberi hikmat. Selain itu, “yang terdorong hatinya” kurang jelas secara sintaksis dan tidak sebaiknya menggantikan hati sebagai pelaku yang mendorong orang tersebut.'
  naturalness: Bahasa draf umumnya baku dan mudah dipahami. Revisi “yang di dalam hatinya Yahweh telah menaruh hikmat” lebih idiomatis sekaligus dekat dengan susunan sumber. “Yang hatinya mendorongnya” menyatakan relasi subjek-objek dalam idiom Ibrani secara lebih jelas daripada “yang terdorong hatinya.”
  terminology: “Yahweh,” “hikmat,” dan nama-nama pribadi sudah tepat dan konsisten. “Berhati bijaksana” dapat dipertahankan dengan catatan kaki yang menjelaskan bahwa ungkapan itu mencakup kecakapan. Catatan untuk dorongan hati perlu disesuaikan dengan terjemahan utama yang direvisi.
  issues:
  - severity: medium
    issue: Klausa tentang pemberian hikmat berbunyi “yang hatinya telah diberi hikmat oleh Yahweh.”
    rationale: Teks Ibrani mengatakan bahwa Yahweh telah memberikan hikmat di dalam hati orang itu. Formulasi draf menjadikan “hati” sebagai penerima langsung hikmat dan kurang mencerminkan preposisi בְּ (“di dalam”).
  - severity: medium
    issue: Frasa “setiap orang yang terdorong hatinya” tidak jelas secara sintaksis.
    rationale: Dalam Ibrani, “hatinya” merupakan subjek yang mengangkat/mendorong orang itu. “Yang hatinya mendorongnya” mempertahankan hubungan tersebut tanpa menambahkan pelaku ilahi.
  revised_text: Lalu Musa memanggil Bezalel, Oholiab, dan setiap orang yang berhati bijaksana[a], yang di dalam hatinya Yahweh telah menaruh hikmat—setiap orang yang hatinya mendorongnya[b] untuk datang mengerjakan pekerjaan itu.
  revised_footnotes:
  - marker: a
    text: Secara harfiah, “bijaksana hati”; ungkapan Ibrani ini menunjuk pada orang yang dikaruniai hikmat atau kecakapan.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “yang hatinya menggerakkannya” atau “yang hatinya mengangkatnya”; ungkapan Ibrani ini menyatakan kerelaan atau dorongan batin.
    reason: lexical_alternative
  revision_rationale: Revisi memulihkan secara lebih tepat gagasan bahwa Yahweh menaruh hikmat di dalam hati orang-orang itu dan bahwa hati mereka sendiri mendorong mereka. Susunan tetap modern, baku, dan tidak menambahkan penafsiran mengenai sumber dorongan tersebut.
