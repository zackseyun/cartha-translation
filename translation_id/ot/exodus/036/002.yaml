  text: וַ/יִּקְרָ֣א מֹשֶׁ֗ה אֶל בְּצַלְאֵ֘ל וְ/אֶל אָֽהֳלִיאָב֒ וְ/אֶל֙ כָּל אִ֣ישׁ חֲכַם לֵ֔ב אֲשֶׁ֨ר נָתַ֧ן יְהוָ֛ה חָכְמָ֖ה בְּ/לִבּ֑/וֹ כֹּ֚ל אֲשֶׁ֣ר נְשָׂא֣/וֹ לִבּ֔/וֹ לְ/קָרְבָ֥ה אֶל הַ/מְּלָאכָ֖ה לַ/עֲשֹׂ֥ת אֹתָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/002.yaml
  text: Then Moses called Bezalel and Oholiab and every wise-hearted man in whose heart Yahweh had put wisdom[b][a], everyone whose heart stirred him to come to the work to do it.
translation:
  language: id
  text: Lalu Musa memanggil Bezalel, Oholiab, dan setiap orang yang berhati bijaksana[a], yang di dalam hatinya Yahweh telah menaruh hikmat—setiap orang yang hatinya mendorongnya[b] untuk datang mengerjakan pekerjaan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bijaksana hati”; ungkapan Ibrani ini menunjuk pada orang yang dikaruniai hikmat atau kecakapan.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “yang hatinya menggerakkannya” atau “yang hatinya mengangkatnya”; ungkapan Ibrani ini menyatakan kerelaan atau dorongan batin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל
  choice: memanggil
  rationale: Dalam konteks ini, קרא dengan אֶל berarti memanggil orang-orang untuk menjalankan suatu tugas; 'memanggil' alami dan tidak mempersempit maknanya menjadi perintah resmi semata.
- source_word: בְּצַלְאֵל ... אָהֳלִיאָב
  choice: Bezalel dan Oholiab
  rationale: Nama-nama pribadi ditransliterasikan dalam bentuk yang lazim dan dekat dengan bentuk Ibrani.
- source_word: כָּל אִישׁ חֲכַם לֵב
  choice: setiap orang yang berhati bijaksana
  rationale: Terjemahan ini mempertahankan gambaran Ibrani tentang hati sebagai pusat hikmat dan kecakapan; dalam konteks pembangunan Kemah Suci, ungkapan itu juga mencakup keterampilan.
- source_word: אֲשֶׁר נָתַן יְהוָה חָכְמָה בְּלִבּוֹ
  choice: yang hatinya telah diberi hikmat oleh Yahweh
  rationale: Bentuk pasif yang alami dalam bahasa Indonesia tetap menyatakan bahwa Yahweh adalah pemberi hikmat dan mempertahankan bahasa 'hati' dari teks sumber.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: כֹּל אֲשֶׁר נְשָׂאוֹ לִבּוֹ
  choice: setiap orang yang terdorong hatinya
  rationale: Ungkapan ini menyampaikan dorongan atau kerelaan batin tanpa menentukan sumber dorongan itu secara lebih jauh.
- source_word: לְקָרְבָה אֶל הַמְּלָאכָה לַעֲשֹׂת אֹתָהּ
  choice: untuk datang mengerjakan pekerjaan itu
  rationale: Ungkapan ini menyampaikan gerak mendekat untuk terlibat dalam pekerjaan, sekaligus menghasilkan susunan Indonesia yang wajar dan mempertahankan unsur 'datang' serta 'mengerjakan'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung; 'Yahweh' mempertahankannya sebagai nama pribadi.
- issue: Sumber dorongan batin dalam כֹּל אֲשֶׁר נְשָׂאוֹ לִבּוֹ
  choice: terdorong hatinya
  alternative: yang hatinya digerakkan oleh Allah
  rationale: Teks menyebut hati orang itu sebagai yang mendorong atau mengangkatnya, tetapi tidak secara eksplisit menyatakan dalam klausa ini bahwa Allah adalah pelaku langsung; ambiguitas tersebut dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur disederhanakan agar mudah dipahami, tetapi pengulangan 'setiap orang' dan gambaran tentang hati tetap dipertahankan. Tanda pisah memperjelas bahwa bagian kedua merinci kelompok yang dipanggil.
