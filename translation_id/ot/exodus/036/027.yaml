  yaml_path: translation/ot/exodus/036/027.yaml
  text: And for the rear of the tabernacle[a], westward, he made six frames.
translation:
  language: id
  text: Untuk bagian belakang Kemah Suci[a], di sebelah barat, dibuatnya enam rangka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “papan.” Istilah Ibrani dapat menunjuk pada papan atau rangka struktural; “rangka” dipilih karena mungkin lebih sesuai dengan konstruksi Kemah Suci.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְיַרְכְּתֵי
  choice: Untuk bagian belakang
  rationale: Bentuk ini menunjuk pada bagian paling belakang atau ujung belakang bangunan. Ungkapan Indonesia ini alami dan tidak mengesankan dua sisi yang berbeda.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: Istilah baku dan mudah dipahami dalam bahasa Indonesia untuk bangunan kudus yang disebut מִשְׁכָּן dalam konteks Keluaran.
- source_word: יָמָּה
  choice: di sebelah barat
  rationale: Secara harfiah berarti 'ke arah laut' dan secara idiomatis menunjukkan arah barat; 'di sebelah barat' paling alami untuk letak bagian bangunan.
- source_word: עָשָׂה
  choice: dibuatnya
  rationale: Menerjemahkan verba umum 'membuat' sambil mempertahankan pelaku tunggal yang tersirat dalam bentuk Ibrani.
- source_word: שִׁשָּׁה
  choice: enam
  rationale: Padanan langsung untuk bilangan kardinal enam.
- source_word: קְרָשִׁים
  choice: rangka
  rationale: Istilah ini menunjuk pada unsur struktural tegak Kemah Suci. 'Rangka' mencerminkan fungsi konstruksinya, sedangkan 'papan' dapat memberi kesan lembaran kayu datar semata.
