  text: He made the middle bar to pass through the midst of the boards from end to end[a][b].
translation:
  language: id
  text: Ia membuat palang tengah itu membentang melalui bagian tengah papan-papan tersebut, dari ujung ke ujung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia membuat palang pusat itu melintas melalui bagian dalam rangka-rangka tersebut, dari satu ujung ke ujung lainnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia membuat
  rationale: Bentuk wayyiqtol Qal dari עשה melanjutkan narasi dengan tindakan lampau. Dalam bahasa Indonesia, hubungan naratif tidak perlu selalu dinyatakan dengan kata 'dan'.
- source_word: הַבְּרִיחַ הַתִּיכֹן
  choice: palang tengah
  rationale: בְּרִיחַ menunjuk pada palang yang mengikat unsur-unsur bangunan, sedangkan הַתִּיכֹן berarti yang berada di tengah atau pusat.
- source_word: לִבְרֹחַ
  choice: membentang
  rationale: Dalam konteks konstruksi, infinitif ברח menggambarkan palang yang melintas atau memanjang melalui papan-papan, bukan tindakan melarikan diri.
- source_word: בְּתוֹךְ הַקְּרָשִׁים
  choice: melalui bagian tengah papan-papan tersebut
  rationale: בְּתוֹךְ menyatakan posisi atau lintasan di bagian dalam/tengah, dan קְרָשִׁים adalah unsur struktur yang dapat diterjemahkan sebagai papan-papan atau rangka-rangka.
- source_word: מִן הַקָּצֶה אֶל הַקָּצֶה
  choice: dari ujung ke ujung
  rationale: Ungkapan ini menyatakan bentangan penuh dari satu ujung sampai ujung lainnya.
