base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/013.yaml
  text: And he made fifty gold clasps[a], and joined the curtains to one another with the clasps, so that the tabernacle became one.
translation:
  language: id
  text: Ia membuat lima puluh pengait emas dan menyambungkan tirai-tirai itu satu dengan yang lain dengan pengait-pengait tersebut, sehingga Kemah Suci itu menjadi satu kesatuan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan Kemah Suci itu menjadi satu.” Secara lebih harfiah, bahasa Ibraninya dapat diterjemahkan “dan Kemah Suci itu adalah satu”; terjemahan dalam teks menonjolkan hasil tindakan penyambungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia membuat
  rationale: Kata kerja עשה lazim berarti “membuat”; bentuk naratif Ibrani diterjemahkan secara wajar tanpa harus selalu mengawali kalimat dengan “dan”.
- source_word: חֲמִשִּׁים קַרְסֵי זָהָב
  choice: lima puluh pengait emas
  rationale: קֶרֶס menunjuk pada alat penyambung tirai. “Pengait” alami dalam bahasa Indonesia dan tidak terlalu memastikan bentuk bendanya.
- source_word: וַיְחַבֵּר אֶת הַיְרִעֹת
  choice: dan menyambungkan tirai-tirai itu
  rationale: חבר menyatakan tindakan menghubungkan atau menyatukan, sedangkan יְרִיעוֹת adalah lembar-lembar kain penutup; “tirai-tirai” merupakan istilah yang jelas dan lazim.
- source_word: אַחַת אֶל אַחַת
  choice: satu dengan yang lain
  rationale: Ungkapan feminin tunggal yang berulang ini menyatakan hubungan timbal balik antara tirai-tirai.
- source_word: בַּקְּרָסִים
  choice: dengan pengait-pengait tersebut
  rationale: Preposisi בְּ bersifat instrumental, yakni pengait-pengait itu menjadi sarana penyambungan. Kata “tersebut” menandai bahwa benda yang sama baru saja disebut.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: Dalam konteks kitab Keluaran, מִשְׁכָּן adalah bangunan suci tempat kediaman Allah. “Kemah Suci” merupakan padanan Indonesia yang jelas dan konvensional, tanpa menyamakannya dengan אֹהֶל מוֹעֵד secara leksikal.
- source_word: וַיְהִי הַמִּשְׁכָּן אֶחָד
  choice: sehingga Kemah Suci itu menjadi satu kesatuan
  rationale: Klausa ini menyatakan hasil penyambungan. “Menjadi satu kesatuan” menyampaikan kesatuan struktur secara alami, sementara kemungkinan bentuk yang lebih harfiah dipertahankan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat mempertahankan urutan tindakan dalam teks Ibrani, tetapi memakai hubungan hasil “sehingga” agar alurnya alami dan jelas.
