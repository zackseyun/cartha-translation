base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/006.yaml
  text: So Moses commanded[a], and they sent a proclamation through the camp, saying[b], “Let neither man nor woman do any more work for the contribution of the sanctuary.” So the people were restrained from bringing more.
translation:
  language: id
  text: 'Lalu Musa memberi perintah, dan mereka mengedarkan pengumuman di seluruh perkemahan[a]: “Jangan ada laki-laki atau perempuan yang melakukan pekerjaan lagi untuk persembahan bagi tempat kudus[b].” Maka rakyat dicegah membawa lebih banyak lagi.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mereka membuat suara beredar di dalam perkemahan”; maksudnya, mereka menyebarkan sebuah pengumuman.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “persembahan kudus” atau “sumbangan bagi tempat kudus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: memberi perintah
  rationale: Kata צוה menyatakan perintah yang berwenang; frasa ini alami dalam bahasa Indonesia dan mempertahankan daya imperatif tindakan Musa.
- source_word: וַיַּעֲבִירוּ קוֹל
  choice: mereka mengedarkan pengumuman
  rationale: Ungkapan harfiah ini berarti ‘membuat suara/pesan lewat’ dan dalam konteks menunjuk pada penyebaran pengumuman kepada seluruh perkemahan. ‘Mengedarkan’ mempertahankan unsur kausatif serta pergerakan pesan.
- source_word: בַּמַּחֲנֶה
  choice: di seluruh perkemahan
  rationale: Preposisinya secara harfiah berarti ‘di dalam perkemahan’, sedangkan ‘di seluruh’ menyampaikan bahwa pengumuman itu diedarkan di antara seluruh penghuni perkemahan.
- source_word: אִישׁ וְאִשָּׁה
  choice: laki-laki maupun perempuan
  rationale: Pasangan kata ini secara eksplisit mencakup kedua jenis kelamin dan sesuai dengan konstruksi larangan אַל.
- source_word: אַל יַעֲשׂוּ עוֹד מְלָאכָה
  choice: janganlah ... melakukan pekerjaan lagi
  rationale: מלאכה menunjuk pada pekerjaan atau hasil keterampilan; terjemahan ini cukup luas untuk mencakup pengerjaan bahan maupun barang yang hendak dipersembahkan.
- source_word: לִתְרוּמַת הַקֹּדֶשׁ
  choice: untuk persembahan bagi tempat kudus
  rationale: תרומה adalah sumbangan atau persembahan yang dikhususkan, sementara הקֹדשׁ dalam konteks ini dapat menunjuk pada tempat kudus. Bentuk ‘bagi’ menyampaikan tujuan persembahan dengan alami tanpa menutup alternatif sintaksis.
- source_word: וַיִּכָּלֵא
  choice: dicegah
  rationale: Bentuk Nifal dari כלא menyatakan bahwa rakyat ditahan atau dicegah. Bentuk pasif dipertahankan tanpa menyiratkan bahwa mereka enggan memberi.
- source_word: מֵהָבִיא
  choice: membawa lebih banyak lagi
  rationale: Preposisi מן dengan infinitif menandai pencegahan dari suatu tindakan; ‘lebih banyak lagi’ memperjelas dari konteks bahwa yang dihentikan ialah tambahan persembahan.
theological_decisions:
- issue: Makna konstruksi לִתְרוּמַת הַקֹּדֶשׁ
  choice: persembahan bagi tempat kudus
  alternative: persembahan kudus
  rationale: Konteks pembangunan Kemah Suci mendukung makna tujuan, tetapi konstruksi Ibrani tetap dapat dipahami sebagai ‘persembahan kudus’; alternatif itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Mengedarkan pengumuman’ dipilih untuk menjaga unsur kausatif idiom Ibrani, sedangkan larangan disusun secara alami dengan ‘janganlah ... maupun ...’. Istilah ‘rakyat’ mempertahankan sifat kolektif העם.
