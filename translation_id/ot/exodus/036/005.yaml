  text: וַ/יֹּאמְרוּ֙ אֶל מֹשֶׁ֣ה לֵּ/אמֹ֔ר מַרְבִּ֥ים הָ/עָ֖ם לְ/הָבִ֑יא מִ/דֵּ֤י הָֽ/עֲבֹדָה֙ לַ/מְּלָאכָ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לַ/עֲשֹׂ֥ת אֹתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/005.yaml
  text: And they said to Moses[a], “The people are bringing much more than enough for the work of the task that Yahweh commanded to be done.”
translation:
  language: id
  text: Mereka berkata kepada Musa, “Orang-orang itu membawa jauh lebih banyak daripada yang diperlukan[a] untuk pekerjaan yang Yahweh perintahkan untuk dilakukan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Orang-orang itu membawa terlalu banyak untuk pekerjaan itu.” Ungkapan Ibrani menekankan bahwa persembahan yang dibawa melebihi jumlah yang diperlukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֶל־מֹשֶׁה לֵּאמֹר
  choice: Mereka berkata kepada Musa
  rationale: Rangkaian naratif ini memperkenalkan ucapan langsung. Kata לֵאמֹר tidak diterjemahkan secara tersendiri karena bentuk “berkata ... katanya” tidak diperlukan dalam bahasa Indonesia alami.
- source_word: מַרְבִּים הָעָם לְהָבִיא מִדֵּי
  choice: Bangsa itu membawa jauh lebih banyak daripada yang diperlukan
  rationale: מַרְבִּים bersama לְהָבִיא menggambarkan tindakan membawa yang terus berlangsung dan melampaui batas kecukupan; מִדֵּי menegaskan bahwa sumbangan itu melebihi kebutuhan.
- source_word: הָעָם
  choice: Bangsa itu
  rationale: Sebutan kolektif ini menunjuk kepada umat Israel. “Bangsa itu” mempertahankan sifat kolektif dan cocok dengan konteks naratif.
- source_word: הָעֲבֹדָה לַמְּלָאכָה
  choice: untuk melaksanakan pekerjaan
  rationale: Dua istilah Ibrani yang berdekatan menunjuk pada pelaksanaan kerja dan pekerjaan konkret yang harus diselesaikan. Ungkapan Indonesia ini menyampaikan keduanya tanpa menghasilkan susunan yang kaku atau berulang.
- source_word: אֲשֶׁר צִוָּה יְהוָה לַעֲשֹׂת אֹתָהּ
  choice: yang Yahweh perintahkan
  rationale: Klausa relatif ini menerangkan pekerjaan tersebut sebagai pekerjaan yang diperintahkan Yahweh untuk dilakukan. Dalam bahasa Indonesia, gagasan “untuk dilakukan” sudah tercakup secara alami oleh “melaksanakan pekerjaan yang ... perintahkan”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung; “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Pelaku tersirat dalam לַעֲשֹׂת אֹתָהּ
  choice: Tidak ditentukan secara eksplisit
  alternative: agar mereka melakukannya
  rationale: Bahasa Ibrani tidak menyebut pelaku baru secara tegas. Terjemahan menghindari penambahan “mereka” agar ambiguitas sumber tidak diselesaikan secara tidak perlu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Jauh lebih banyak daripada yang diperlukan” menyampaikan penekanan pada kelimpahan tanpa terdengar teknis; susunan kalimat langsung dan mudah dipahami pembaca umum.
