  text: וַ/יַּ֥עַשׂ בְּרִיחֵ֖י עֲצֵ֣י שִׁטִּ֑ים חֲמִשָּׁ֕ה לְ/קַרְשֵׁ֥י צֶֽלַע הַ/מִּשְׁכָּ֖ן הָ/אֶחָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/036/031.yaml
  text: He made five bars of acacia wood for the frames of one side of the tabernacle[a].
translation:
  language: id
  text: Ia membuat lima batang penghubung dari kayu akasia untuk papan-papan pada salah satu sisi Kemah Suci.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rangka-rangka” sebagai ganti “papan-papan” untuk bagian-bagian struktural tegak Kemah Suci.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: Ia membuat
  rationale: Bentuk wayyiqtol dari עשה melanjutkan urutan tindakan dalam narasi; bahasa Indonesia tidak harus menyatakan waw dengan kata penghubung tersendiri.
- source_word: בְּרִיחֵי
  choice: batang penghubung
  rationale: Dalam konteks Kemah Suci, kata ini menunjuk pada batang horizontal yang menyatukan bagian-bagian tegak; pilihan ini lebih jelas daripada sekadar 'batang' dan tidak menyiratkan gerendel.
- source_word: עֲצֵי שִׁטִּים
  choice: dari kayu akasia
  rationale: Rangkaian konstruksi ini menyatakan bahan yang berasal dari pohon akasia.
- source_word: חֲמִשָּׁה
  choice: lima
  rationale: Bilangan pokok yang menerangkan jumlah batang penghubung.
- source_word: לְקַרְשֵׁי
  choice: untuk papan-papan
  rationale: קֶרֶשׁ menunjuk pada bagian struktural tegak Kemah Suci. 'Papan-papan' merupakan padanan Indonesia yang alami, konkret, dan sesuai dengan fungsi konstruksinya; 'rangka-rangka' tetap mungkin.
- source_word: צֶלַע
  choice: sisi
  rationale: Dalam konteks arsitektur, צֶלַע berarti sisi bangunan, bukan rusuk secara harfiah.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: Istilah Indonesia yang mapan dan mudah dipahami bagi bangunan kudus portabel yang disebut מִשְׁכָּן dalam konteks Keluaran.
- source_word: הָאֶחָת
  choice: salah satu
  rationale: Bentuk feminin tunggal ini bersesuaian dengan 'sisi' dan membedakan satu sisi dari sisi lainnya tanpa menjadikannya bilangan urutan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Istilah konstruksi dibuat cukup konkret bagi pembaca umum, sementara alternatif leksikal קֶרֶשׁ dipertahankan dalam catatan kaki.
