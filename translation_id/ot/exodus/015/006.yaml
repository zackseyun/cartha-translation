id: EXO.15.6
reference: Exodus 15:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְמִֽינְ/ךָ֣ יְהוָ֔ה נֶאְדָּרִ֖י בַּ/כֹּ֑חַ יְמִֽינְ/ךָ֥ יְהוָ֖ה תִּרְעַ֥ץ אוֹיֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/006.yaml
  text: Your right hand[a], O Yahweh, is majestic in power; your right hand, O Yahweh[c][b], shatters the enemy.
translation:
  language: id
  text: 'Tangan kanan-Mu, ya Yahweh, mulia dalam kuasa;

    tangan kanan-Mu, ya Yahweh, meremukkan musuh.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְמִינְךָ
  choice: tangan kanan-Mu
  rationale: Mempertahankan gambaran konkret tangan kanan sebagai lambang kuasa dan tindakan kemenangan dalam puisi ini.
- source_word: יְהוָה
  choice: ya Yahweh
  rationale: Menerjemahkan nama ilahi sebagai nama diri; partikel vokatif 'ya' menyampaikan sapaan langsung dalam bahasa Indonesia yang wajar dan khidmat.
- source_word: נֶאְדָּרִי
  choice: mulia
  rationale: Bentuk dari אדר menyatakan kemegahan atau keagungan. 'Mulia' menghasilkan ungkapan puitis yang alami bersama 'dalam kuasa' tanpa mengurangi nada luhurnya.
- source_word: בַּכֹּחַ
  choice: dalam kuasa
  rationale: Mengikuti konstruksi preposisional ב dengan כֹּחַ dan mempertahankan hubungan eratnya dengan predikat 'mulia'.
- source_word: תִּרְעַץ
  choice: meremukkan
  rationale: Kata kerja רָעַץ menggambarkan penghancuran keras dan tuntas; 'meremukkan' mempertahankan daya martialnya dan cocok dengan objek tunggal kolektif.
- source_word: אוֹיֵב
  choice: musuh
  rationale: Mempertahankan bentuk tunggal Ibrani, yang dalam konteks dapat menunjuk secara kolektif kepada kekuatan lawan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: ya Yahweh
  alternative: ya TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi dalam sapaan langsung. 'Yahweh' mempertahankan nama itu, sedangkan 'ya' menandai vokatif secara alami.
- issue: Gambaran antropomorfis tangan kanan Allah
  choice: tangan kanan-Mu
  alternative: kuasa-Mu
  rationale: Gambaran konkret dalam teks dipertahankan agar metafora kuasa dan kemenangan tidak diuraikan menjadi tafsiran abstrak.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan khidmat. Paralelisme kedua baris dipertahankan, termasuk pengulangan 'tangan kanan-Mu, ya Yahweh'. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
