base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/023.yaml
  text: Then they came to Marah[a], but they could not drink the water from Marah because it was bitter. Therefore it was named Marah.
translation:
  language: id
  text: Lalu mereka tiba di Mara[a], tetapi mereka tidak dapat minum air dari Mara karena air itu pahit. Itulah sebabnya tempat itu dinamai Mara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Mara berbunyi mirip dengan kata Ibrani yang berarti “pahit”.
    reason: Menjelaskan permainan kata Ibrani antara nama tempat מָרָה dan kata מָרִים, “pahit”.
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Lalu mereka tiba
  rationale: Bentuk wayyiqtol dari בוא melanjutkan urutan cerita; “lalu” menyatakan urutan itu secara alami dalam bahasa Indonesia.
- source_word: מָרָתָה
  choice: di Mara
  rationale: Nama tempat dengan he direktif menyatakan gerak menuju Mara. Bersama verba “tiba”, preposisi “di” merupakan ungkapan Indonesia yang alami.
- source_word: וְלֹא יָכְלוּ
  choice: tetapi mereka tidak dapat
  rationale: Konjungsi ini menandai kontras antara tibanya mereka dan ketidakmampuan mereka untuk minum.
- source_word: לִשְׁתֹּת מַיִם
  choice: minum air
  rationale: Ungkapan ini menerjemahkan infinitif לשתות dan nomina kolektif מים secara langsung dan alami.
- source_word: מִמָּרָה
  choice: dari Mara
  rationale: Preposisi מן paling wajar menunjukkan sumber air tersebut.
- source_word: כִּי מָרִים הֵם
  choice: karena air itu pahit
  rationale: כִּי menyatakan sebab. Predikat jamak dalam bahasa Ibrani berkaitan dengan bentuk gramatikal מים, sedangkan bahasa Indonesia secara alami memakai “air itu” sebagai nomina massa tunggal.
- source_word: עַל כֵּן
  choice: Itulah sebabnya
  rationale: Ungkapan inferensial ini secara alami mengantar penjelasan mengenai pemberian nama.
- source_word: קָרָא שְׁמָהּ מָרָה
  choice: tempat itu dinamai Mara
  rationale: Verba maskulin tunggal tidak memiliki subjek eksplisit dan dapat dipahami sebagai konstruksi penamaan impersonal. Bentuk pasif Indonesia mempertahankan ketidakjelasan pelaku tanpa terdengar janggal; “tempat itu” memperjelas acuan sufiks feminin pada שמה.
- source_word: מָרָה / מָרִים
  choice: Mara / pahit
  rationale: Nama tempat ditransliterasikan, sedangkan kata sifatnya diterjemahkan. Permainan kata diterangkan dalam catatan kaki.
