base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/007.yaml
  text: And in the greatness of your majesty you overthrow those who rise up against you[a]; you send out your burning anger[b]; it consumes them like stubble.
translation:
  language: id
  text: Dalam kelimpahan keagungan-Mu, Engkau menumbangkan orang-orang yang bangkit melawan-Mu; Engkau mengirimkan murka-Mu yang menyala-nyala[a], dan murka itu menghanguskan mereka seperti jerami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “panas murka-Mu”; dapat juga diterjemahkan “amarah-Mu yang membara.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרֹב גְּאוֹנְךָ
  choice: Dalam kebesaran keagungan-Mu
  rationale: בְּ dapat menyatakan lingkup atau sarana, sedangkan רֹב menyatakan kebesaran atau kelimpahan. Ungkapan ini mempertahankan dua unsur Ibrani itu secara wajar dalam bahasa Indonesia dan menyampaikan kemegahan serta keunggulan ilahi.
- source_word: תַּהֲרֹס
  choice: Engkau merobohkan
  rationale: הרס berarti merobohkan, meruntuhkan, atau menghancurkan. 'Merobohkan' mempertahankan gambaran dasar verba tersebut dan tetap alami dengan objek berupa para penentang.
- source_word: קָמֶיךָ
  choice: orang-orang yang bangkit melawan-Mu
  rationale: Bentuk partisipial dari קום secara harfiah menunjuk kepada mereka yang bangkit menentang. Terjemahan ini mempertahankan daya verbalnya, bukan sekadar menggantinya dengan 'musuh'.
- source_word: תְּשַׁלַּח
  choice: Engkau melepaskan
  rationale: שׁלח pada dasarnya berarti mengirim atau melepas. Dalam konteks murka ilahi, 'melepaskan' terdengar alami dan kuat tanpa menambahkan gambaran yang tidak ada dalam teks.
- source_word: חֲרֹנְךָ
  choice: murka-Mu yang menyala-nyala
  rationale: חָרוֹן menunjuk pada amarah yang membara. Pilihan ini mempertahankan citra panas sekaligus memakai istilah 'murka' yang sesuai dengan ragam puitis dan khidmat.
- source_word: יֹאכְלֵמוֹ
  choice: murka itu menghanguskan mereka
  rationale: Verba tunggal merujuk kembali kepada murka sebagai subjek tunggal. 'Menghanguskan' menyampaikan tindakan memakan habis dalam citra api dan membuat rujukan subjek jelas dalam bahasa Indonesia.
- source_word: כַּקַּשׁ
  choice: seperti jerami kering
  rationale: קַשׁ dapat berarti jerami atau sisa batang tanaman yang kering. 'Jerami kering' secara alami menghadirkan sesuatu yang cepat dilalap api bagi pembaca Indonesia.
theological_decisions:
- issue: Bahasa penghakiman ilahi dan citra kehancuran
  choice: Engkau melepaskan murka-Mu yang menyala-nyala, dan murka itu menghanguskan mereka seperti jerami kering
  alternative: Engkau mengirimkan amarah-Mu; amarah itu memakan mereka seperti tunggul jerami
  rationale: Teks Ibrani secara langsung menggambarkan penghakiman Allah dengan citra murka yang membara dan sesuatu yang habis terbakar. Terjemahan mempertahankan kekuatan gambaran itu tanpa melunakkan atau menambahkan penjelasan doktrinal.
- issue: Sapaan langsung kepada Allah dalam orang kedua
  choice: keagungan-Mu ... melawan-Mu ... murka-Mu
  alternative: keagungan-Nya ... melawan-Nya ... murka-Nya
  rationale: Nyanyian ini menyapa Allah secara langsung. Bentuk orang kedua dipertahankan agar sifat pujian dan pengakuan dalam syair tetap nyata.
- issue: Rujukan subjek pada יֹאכְלֵמוֹ
  choice: murka itu menghanguskan mereka
  alternative: itu menghanguskan mereka
  rationale: Verba tunggal paling wajar dipahami dengan חֲרֹנְךָ, 'murka-Mu', sebagai anteseden. Pengulangan 'murka itu' menjernihkan rujukan dalam bahasa Indonesia tanpa mengubah relasi gramatikal teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis dan khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Tanda [a] ditempatkan tepat setelah frasa yang dijelaskan.
