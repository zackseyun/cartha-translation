    rationale: Kata “kebesaran” dan “keagungan” bertumpang tindih sebagai nomina berurutan. “Dalam kelimpahan keagungan-Mu” menyatakan רֹב (“kelimpahan/besarnya”) dan גָּאוֹן (“keagungan”) tanpa pengulangan yang janggal.
