translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Orang Israel’ dipakai untuk kelompok kolektif, ‘Syur’ mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia, dan ‘padang belantara’ menghindari kesan bahwa wilayah itu pasti berupa gurun pasir.
