  text: וַ/יַּסַּ֨ע מֹשֶׁ֤ה אֶת יִשְׂרָאֵל֙ מִ/יַּם ס֔וּף וַ/יֵּצְא֖וּ אֶל מִדְבַּר שׁ֑וּר וַ/יֵּלְכ֧וּ שְׁלֹֽשֶׁת יָמִ֛ים בַּ/מִּדְבָּ֖ר וְ/לֹא מָ֥צְאוּ מָֽיִם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/022.yaml
  text: Then Moses led Israel on from the Sea of Reeds[a], and they went out into the wilderness of Shur. They went three days in the wilderness and found no water.
translation:
  language: id
  text: Kemudian Musa memimpin orang Israel berangkat dari Laut Gelagah[a], lalu mereka pergi ke padang belantara Syur. Mereka berjalan tiga hari di padang belantara dan tidak menemukan air.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara tradisional diterjemahkan “Laut Merah”; dalam bahasa Ibrani, “Laut Gelagah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּסַּע
  choice: membawa ... berangkat
  rationale: 'Bentuk Hifil dari נסע bersifat kausatif: Musa membuat Israel melanjutkan perjalanan dari tempat sebelumnya. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan peran Musa tanpa menjadi terlalu harfiah.'
- source_word: מִיַּם סוּף
  choice: dari Laut Gelagah
  rationale: Ungkapan Ibrani secara harfiah menunjuk pada ‘Laut Gelagah’. Terjemahan ini mengutamakan bukti bahasa sumber, sedangkan sebutan tradisional dicantumkan dalam catatan kaki.
- source_word: מִדְבַּר שׁוּר
  choice: Padang Belantara Syur
  rationale: מִדְבָּר menunjuk pada kawasan liar dan gersang, tetapi tidak selalu berupa gurun pasir. ‘Padang Belantara’ mempertahankan cakupan makna tersebut dan berfungsi alami sebagai bagian nama geografis.
- source_word: וַיֵּצְאוּ
  choice: mereka pergi
  rationale: יצא berarti keluar atau pergi. Dalam konteks gerak dari kawasan laut menuju Syur, ‘pergi’ terasa alami dan tidak menyiratkan rincian arah yang tidak dinyatakan.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: tiga hari
  rationale: Frasa ini merupakan akusatif durasi. ‘Tiga hari’ menyampaikan lamanya perjalanan secara langsung tanpa menambahkan gagasan ‘perjalanan tiga hari’ sebagai satuan jarak.
- source_word: בַּמִּדְבָּר
  choice: di padang belantara
  rationale: Preposisi ב paling langsung diterjemahkan ‘di’. Pilihan ini dekat dengan bentuk Ibrani dan tetap wajar dalam bahasa Indonesia.
- source_word: וְלֹא מָצְאוּ מָיִם
  choice: dan tidak menemukan air
  rationale: Terjemahan langsung dan alami yang mempertahankan negasi pada tindakan menemukan, tanpa menambah penjelasan tentang persediaan air.
