  text: תִּפֹּ֨ל עֲלֵי/הֶ֤ם אֵימָ֨תָ/ה֙ וָ/פַ֔חַד בִּ/גְדֹ֥ל זְרוֹעֲ/ךָ֖ יִדְּמ֣וּ כָּ/אָ֑בֶן עַד יַעֲבֹ֤ר עַמְּ/ךָ֙ יְהוָ֔ה עַֽד יַעֲבֹ֖ר עַם ז֥וּ קָנִֽיתָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/016.yaml
  text: Terror and dread will fall on them[a]; by the greatness of your arm they will be still as a stone, until your people pass by, O Yahweh[c][b], until this people whom you acquired pass by.
translation:
  language: id
  text: Kengerian dan ketakutan akan menimpa mereka; oleh kebesaran lengan-Mu mereka akan diam seperti batu[a], sampai umat-Mu lewat[b], ya Yahweh, sampai umat ini yang telah Kauperoleh lewat[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mereka tidak akan bersuara” atau “mereka tidak akan bergerak.”'
    reason: lexical_alternative
  - marker: b
    text: “Lewat” juga dapat diterjemahkan “menyeberang.”
    reason: lexical_alternative
  - marker: c
    text: “Telah Kauperoleh” juga dapat diterjemahkan “telah Kaubeli” atau, dalam pengertian perjanjian yang lebih luas, “telah Kaujadikan milik-Mu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפֹּל עֲלֵיהֶם אֵימָתָה וָפַחַד
  choice: Kengerian dan ketakutan akan menimpa mereka
  rationale: Bentuk imperfek נפל menyatakan hal yang akan terjadi, sedangkan dua nomina yang berdekatan dipertahankan sebagai pasangan puitis yang saling menguatkan.
- source_word: בִּגְדֹל זְרוֹעֲךָ
  choice: oleh kebesaran lengan-Mu
  rationale: Mempertahankan metafora lengan sebagai kuasa ilahi dan membiarkan preposisi ב menyatakan sarana atau dasar.
- source_word: יִדְּמוּ כָּאָבֶן
  choice: mereka akan diam seperti batu
  rationale: דמם dapat berarti diam, tidak bersuara, atau tidak bergerak. 'Diam' mempertahankan keluasan makna, sementara perbandingan dengan batu menunjukkan ketidakberdayaan atau keadaan tidak bergerak.
- source_word: עַד יַעֲבֹר
  choice: sampai ... lewat
  rationale: עבר di sini dapat menunjuk pada tindakan lewat atau menyeberang. 'Lewat' terasa alami dan tidak membatasi gambaran pada penyeberangan perairan.
- source_word: יְהוָה
  choice: ya Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai Yahweh; partikel seruan 'ya' menandai sapaan langsung secara alami dalam bahasa Indonesia.
- source_word: עַם זוּ קָנִיתָ
  choice: umat yang telah Kauperoleh ini
  rationale: זוּ dipertahankan sebagai penunjuk 'ini', dan קנה diterjemahkan secara luas sebagai 'memperoleh' tanpa mempersempitnya menjadi membeli, menebus, atau menciptakan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian secara langsung; transliterasi mempertahankannya sebagai nama pribadi, bukan menggantinya dengan gelar.
- issue: Makna קָנִיתָ dalam hubungan Yahweh dengan Israel
  choice: telah Kauperoleh
  alternative: telah Kaubeli; telah Kaujadikan milik-Mu
  rationale: '''Memperoleh'' mempertahankan rentang makna verba קנה dan nuansa kepemilikan perjanjian tanpa memasukkan mekanisme teologis yang lebih khusus daripada yang dinyatakan teks.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang bermartabat. Paralelisme, pengulangan 'sampai', metafora lengan, dan perbandingan dengan batu dipertahankan. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
