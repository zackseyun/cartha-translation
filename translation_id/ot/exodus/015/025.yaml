source:
  edition: WLC
  text: וַ/יִּצְעַ֣ק אֶל יְהוָ֗ה וַ/יּוֹרֵ֤/הוּ יְהוָה֙ עֵ֔ץ וַ/יַּשְׁלֵךְ֙ אֶל הַ/מַּ֔יִם וַֽ/יִּמְתְּק֖וּ הַ/מָּ֑יִם שָׁ֣ם שָׂ֥ם ל֛/וֹ חֹ֥ק וּ/מִשְׁפָּ֖ט וְ/שָׁ֥ם נִסָּֽ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/025.yaml
  text: So he cried out to the LORD, and the LORD showed him a tree. He threw it into the water, and the water became sweet. There he made for them a statute and a judgment, and there he tested them.
translation:
  language: id
  text: Lalu Musa berseru kepada TUHAN, dan TUHAN menunjukkan kepadanya sebatang kayu. Musa melemparkannya ke dalam air, lalu air itu menjadi tawar. Di sana TUHAN menetapkan bagi mereka suatu ketetapan dan peraturan, dan di sana Ia menguji mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: berseru
  rationale: Mengungkapkan seruan mendesak kepada Allah secara alami dan tetap dekat dengan makna verba Ibrani.
- source_word: עֵץ
  choice: sebatang kayu
  rationale: Kata Ibrani dapat berarti pohon atau kayu; dalam konteks tindakan melemparkannya ke air, 'sebatang kayu' alami tanpa menentukan jenis atau ukuran secara berlebihan.
- source_word: וַיִּמְתְּקוּ הַמָּיִם
  choice: air itu menjadi tawar
  rationale: '''Tawar'' merupakan ungkapan Indonesia yang wajar untuk air yang tidak lagi pahit, tanpa mengesankan air bergula.'
- source_word: חֹק וּמִשְׁפָּט
  choice: suatu ketetapan dan peraturan
  rationale: Mempertahankan dua istilah hukum yang berbeda; 'peraturan' lebih alami daripada 'penghakiman' dalam konteks ketentuan yang diberikan.
- source_word: נִסָּהוּ
  choice: menguji mereka
  rationale: Menyampaikan makna pengujian atau pembuktian kesetiaan, bukan pencobaan untuk berbuat jahat.
theological_decisions:
- issue: Subjek verba tunggal pada שָׂם dan נִסָּהוּ
  choice: TUHAN ... Ia
  alternative: Musa ... ia
  rationale: Subjek yang paling wajar dari konteks adalah TUHAN, yang menetapkan ketentuan dan menguji Israel; penyebutan eksplisit memperjelas bahasa Indonesia tanpa mengubah hubungan antarklausa.
- issue: Rujukan pronomina objek tunggal לוֹ dan הוּ
  choice: bagi mereka ... menguji mereka
  alternative: baginya ... mengujinya
  rationale: Bentuk Ibrani secara gramatikal tunggal dan dapat merujuk secara kolektif kepada bangsa Israel. Bahasa Indonesia lazim memakai bentuk jamak untuk komunitas tersebut, selaras dengan konteks umat yang sedang diuji.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama perjanjian יהוה ditampilkan sebagai TUHAN sesuai konvensi Alkitab Indonesia. Nama Musa dimunculkan untuk memperjelas subjek pronominal pembuka dalam ayat mandiri.
