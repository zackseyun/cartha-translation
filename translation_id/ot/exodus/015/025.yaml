  source_fidelity: 'Terjemahan secara setia menyampaikan urutan dan makna teks Ibrani: Musa berseru kepada TUHAN, TUHAN memperlihatkan עֵץ, benda itu dilemparkan ke air, air menjadi tidak pahit, lalu ketetapan dan משפט ditetapkan serta umat diuji. “Sebatang kayu” adalah pilihan yang sah untuk עֵץ dalam konteks ini dan tidak mengharuskan penentuan spesies atau bentuk benda itu.'
  naturalness: Bahasa Indonesia baku, lancar, dan bernada pantas untuk narasi Alkitab. Penyebutan “Musa” dan “TUHAN” membuat rujukan pronominal jelas ketika ayat dibaca tersendiri. “Air itu menjadi tawar” merupakan ungkapan alami untuk air yang sebelumnya pahit.
  terminology: “TUHAN” konsisten dengan konvensi Indonesia untuk יהוה. “Ketetapan dan peraturan” mempertahankan pasangan חֹק וּמִשְׁפָּט dengan ungkapan hukum yang wajar dalam bahasa Indonesia. Pemakaian jamak “mereka” untuk Israel sebagai komunitas dapat diterima secara idiomatis, walaupun sufiks Ibrani berbentuk tunggal kolektif.
