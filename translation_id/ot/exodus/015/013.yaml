  yaml_path: translation/ot/exodus/015/013.yaml
  text: In your steadfast love you have led the people whom you redeemed[b][a]; in your strength you have guided them to your holy dwelling.
translation:
  language: id
  text: Dalam kasih setia-Mu Engkau telah menuntun umat yang telah Kautebus[a]; dengan kekuatan-Mu Engkau telah membimbing mereka ke kediaman-Mu yang kudus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “umat ini yang telah Kautebus.”'
    reason: lexical_alternative
  - marker: b
    text: “Kediaman-Mu yang kudus” dapat menunjuk secara luas pada tempat kehadiran Allah yang kudus; frasa ini dipahami dengan beragam cara sebagai Sinai, tanah perjanjian, atau Sion/Bait Allah.
    reason: alternative_reading
lexical_decisions:
- source_word: נָחִיתָ
  choice: Engkau telah menuntun
  rationale: Bentuk Hifil dari נחה berarti menuntun atau memimpin. 'Menuntun' alami dalam bahasa Indonesia dan sesuai dengan gambaran Allah membawa umat-Nya keluar dari Mesir.
- source_word: בְחַסְדְּךָ
  choice: Dalam kasih setia-Mu
  rationale: חֶסֶד mencakup kasih, kemurahan, kesetiaan, dan loyalitas dalam relasi perjanjian. 'Kasih setia' merupakan padanan Indonesia yang ringkas dan mempertahankan kedua unsur kasih dan keteguhan.
- source_word: עַם זוּ
  choice: umat
  rationale: Secara harfiah frasa ini dapat berarti 'umat ini'. Dalam konteks ibadah dan relasi perjanjian dengan Allah, 'umat' lebih wajar daripada 'bangsa' serta tetap merujuk pada kelompok yang ditentukan oleh klausa berikutnya; unsur demonstratif dicatat dalam catatan kaki.
- source_word: גָּאָלְתָּ
  choice: yang telah Kautebus
  rationale: גאל menyatakan tindakan menebus atau membebaskan dengan hak dan tanggung jawab seorang penebus. 'Tebus' mempertahankan bobot istilah itu tanpa mempersempitnya menjadi pembayaran uang tebusan.
- source_word: נֵהַלְתָּ
  choice: Engkau telah membimbing
  rationale: נהל menyatakan memimpin dengan perhatian atau membimbing, kadang dengan nuansa penggembalaan. 'Membimbing' membedakannya dari נחה yang diterjemahkan 'menuntun'.
- source_word: בְעָזְּךָ
  choice: dengan kekuatan-Mu
  rationale: עֹז berarti kekuatan atau keperkasaan. Preposisi ב dipahami secara instrumental; 'dengan kekuatan-Mu' merupakan ungkapan Indonesia yang alami dan mempertahankan kesejajaran dengan tindakan ilahi pada larik pertama.
- source_word: אֶל
  choice: menuju
  rationale: אֶל menandai gerak ke arah suatu tujuan. 'Menuju' mempertahankan arah gerak tanpa secara berlebihan memastikan bahwa tindakan memasuki tempat itu sudah selesai dalam cakrawala naratif.
- source_word: נְוֵה קָדְשֶׁךָ
  choice: kediaman-Mu yang kudus
  rationale: נָוֶה dapat berarti tempat tinggal, kediaman, atau padang/hunian. Dalam konteks tujuan ilahi, 'kediaman-Mu yang kudus' jelas, bermartabat, dan tidak memaksakan identifikasi lokasi tertentu.
theological_decisions:
- issue: Rujukan 'kediaman-Mu yang kudus'
  choice: Dibiarkan sebagai sebutan luas bagi tempat kehadiran Allah yang kudus.
  alternative: Menentukannya secara khusus sebagai Sinai, tanah perjanjian, atau Sion/Bait Allah.
  rationale: Frasa Ibrani tidak mengidentifikasi lokasinya secara tegas. Nyanyian ini dapat memandang karya penyelamatan Allah secara puitis hingga tujuan akhirnya, sehingga terjemahan utama tidak menyelesaikan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis yang wajar dan bermartabat. Pronomina ilahi memakai huruf kapital sesuai kelaziman penerbitan Alkitab Indonesia. Kesejajaran dua larik dipertahankan melalui 'menuntun' dan 'membimbing', sedangkan ambiguitas tujuan kudus dijaga melalui teks utama dan catatan kaki.
