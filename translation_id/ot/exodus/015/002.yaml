  variant: modern standard Indonesian
source:
  edition: WLC
  text: עָזִּ֤/י וְ/זִמְרָת֙ יָ֔הּ וַֽ/יְהִי לִ֖/י לִֽ/ישׁוּעָ֑ה זֶ֤ה אֵלִ/י֙ וְ/אַנְוֵ֔/הוּ אֱלֹהֵ֥י אָבִ֖/י וַ/אֲרֹמְמֶֽ/נְהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/002.yaml
  text: Yah is my strength and song[a], and he has become my salvation. This is my God, and I will praise him; my father's God, and I will exalt him.
translation:
  language: id
  text: Yah adalah kekuatanku dan nyanyianku; Ia telah menjadi keselamatanku. Inilah Allahku, dan aku akan memuji-Nya[a]; Allah ayahku, dan aku akan meninggikan-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “aku akan menyediakan tempat kediaman bagi-Nya.” Kata kerja Ibrani di sini sulit ditafsirkan dan mungkin mengandung arti menyediakan tempat tinggal atau menghiasi/memuliakan.
    reason: alternative_reading
lexical_decisions:
- source_word: עָזִּי
  choice: kekuatanku
  rationale: Nomina עֹז menyatakan kekuatan atau keperkasaan. “Kekuatanku” paling alami dalam bahasa Indonesia dan mempertahankan ungkapan puitisnya.
- source_word: וְזִמְרָת יָהּ
  choice: dan nyanyianku; Yah
  rationale: זִמְרָה dapat berarti nyanyian atau pujian musikal. Dalam konteks nyanyian kemenangan ini, “nyanyianku” mempertahankan citra puitis. יָהּ dipahami sebagai bentuk singkat nama ilahi dan diterjemahkan “Yah”.
- source_word: יָהּ
  choice: Yah
  rationale: Teks memakai bentuk singkat nama ilahi יָהּ, bukan tetragramaton יהוה. Karena itu, bentuk khas ini dipertahankan sebagai “Yah” dan tidak diseragamkan menjadi “TUHAN”.
- source_word: וַיְהִי לִי לִישׁוּעָה
  choice: Ia telah menjadi keselamatanku
  rationale: Ungkapan היה + ל menyatakan bahwa seseorang menjadi atau berfungsi sebagai sesuatu bagi orang lain. Bentuk “telah menjadi” mempertahankan nuansa hasil yang kini dinyatakan dalam nyanyian.
- source_word: זֶה אֵלִי
  choice: Inilah Allahku
  rationale: “Inilah” menyampaikan daya tunjuk dan penegasan זֶה secara alami dalam bahasa Indonesia.
- source_word: וְאַנְוֵהוּ
  choice: dan aku akan memuji-Nya
  rationale: Kata kerja ini sulit ditafsirkan. Arti “memuji/memuliakan” sesuai dengan konteks ibadah dan paralel dengan “meninggikan-Nya”; kemungkinan arti menyediakan tempat kediaman tetap dicatat dalam catatan kaki.
- source_word: אֱלֹהֵי אָבִי
  choice: Allah ayahku
  rationale: Frasa konstruksi tunggal ini berarti Allah milik atau yang dikenal oleh ayah si penutur. “Allah ayahku” ringkas dan mempertahankan rujukan kekeluargaan tanpa mengubah bentuk tunggal menjadi “leluhur”.
- source_word: וַאֲרֹמְמֶנְהוּ
  choice: dan aku akan meninggikan-Nya
  rationale: רומם berarti meninggikan atau memuliakan. “Meninggikan-Nya” mempertahankan metafora sumber dan ragam bahasa ibadah yang luhur.
theological_decisions:
- issue: Penerjemahan nama ilahi יָהּ
  choice: Yah
  alternative: TUHAN
  rationale: Teks sumber memakai bentuk singkat יָהּ, bukan יהוה. Mempertahankan “Yah” menghormati perbedaan bentuk dalam bahasa Ibrani dan daya puitisnya.
- issue: Penafsiran וְאַנְוֵהוּ
  choice: aku akan memuji-Nya
  alternative: aku akan menyediakan tempat kediaman bagi-Nya
  rationale: Makna kata kerja ini diperdebatkan. Bacaan “memuji” paling sesuai dengan paralelisme langsung bersama “meninggikan”, sedangkan kemungkinan makna tempat kediaman disajikan dalam catatan kaki agar ketidakpastian sumber tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Nama singkat ilahi “Yah” dipertahankan. Pronomina yang merujuk kepada Allah ditulis dengan huruf kapital sesuai kelaziman ragam Kitab Suci Indonesia. Penanda catatan kaki ditempatkan sesudah frasa yang benar-benar dipersoalkan, yaitu “memuji-Nya”.
