  text: אָ֤ז נִבְהֲלוּ֙ אַלּוּפֵ֣י אֱד֔וֹם אֵילֵ֣י מוֹאָ֔ב יֹֽאחֲזֵ֖/מוֹ רָ֑עַד נָמֹ֕גוּ כֹּ֖ל יֹשְׁבֵ֥י כְנָֽעַן׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/015.yaml
  text: Then the chiefs of Edom were terrified[a]; trembling seized the leaders of Moab; all the inhabitants of Canaan melted away.
translation:
  language: id
  text: Pada waktu itu para pemimpin Edom diliputi ketakutan; para pemuka Moab dicekam kegentaran; seluruh penduduk Kanaan kehilangan keberanian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mencair.” Maksudnya, mereka kehilangan keberanian karena ketakutan.
    reason: metaphorical_clarification
lexical_decisions:
- source_word: אָז
  choice: Pada waktu itu
  rationale: Menandai akibat dari tindakan penyelamatan yang dinyanyikan sebelumnya dan terdengar wajar dalam puisi naratif Indonesia.
- source_word: נִבְהֲלוּ
  choice: diliputi ketakutan
  rationale: Bentuk Nifal dari בהל menyatakan keadaan sangat gentar atau panik; ungkapan ini mempertahankan intensitasnya secara alami.
- source_word: אַלּוּפֵי אֱדוֹם
  choice: para pemimpin Edom
  rationale: אַלּוּף dapat menunjuk kepala kaum atau pemimpin; pilihan ini menjaga makna kepemimpinan tanpa menyiratkan jabatan kerajaan tertentu.
- source_word: אֵילֵי מוֹאָב
  choice: para pemuka Moab
  rationale: Secara harfiah berkaitan dengan sosok yang kuat, tetapi dalam kesejajaran ini menunjuk orang-orang terkemuka atau berkuasa di Moab.
- source_word: יֹאחֲזֵמוֹ רָעַד
  choice: dicekam kegentaran
  rationale: Mempertahankan gambaran hidup bahwa kegentaran mencengkeram mereka, sekaligus memakai idiom Indonesia yang alami.
- source_word: נָמֹגוּ
  choice: kehilangan keberanian
  rationale: Dalam konteks ketakutan, מוג menggambarkan hati yang seolah-olah mencair atau lenyapnya keberanian; terjemahan ini menyampaikan makna metaforisnya dengan jelas.
- source_word: כֹּל יֹשְׁבֵי כְנָעַן
  choice: seluruh penduduk Kanaan
  rationale: Padanan kolektif yang langsung dan alami bagi semua orang yang mendiami Kanaan.
