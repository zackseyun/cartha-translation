  text: The peoples heard; they trembled[a]. Anguish seized the inhabitants of Philistia.
translation:
  language: id
  text: Bangsa-bangsa telah mendengar; mereka gemetar.[a] Kegentaran mencengkeram penduduk Filistia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Bangsa-bangsa mendengar; mereka akan gemetar.” Puisi Ibrani memungkinkan nuansa tindakan lampau sekaligus gambaran hidup tentang reaksi yang sedang atau akan terjadi.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמְעוּ
  choice: telah mendengar
  rationale: Bentuk Qal perfek orang ketiga jamak dari שׁמע. Dalam konteks nyanyian puitis, “telah mendengar” secara alami menyatakan kabar yang sudah sampai dan menimbulkan reaksi.
- source_word: עַמִּים
  choice: bangsa-bangsa
  rationale: Bentuk jamak עַם menunjuk pada kelompok-kelompok bangsa di sekitar Israel. “Bangsa-bangsa” mempertahankan makna kolektif jamaknya dalam bahasa Indonesia yang wajar.
- source_word: יִרְגָּזוּ/ן
  choice: mereka gemetar
  rationale: Kata רָגַז dapat berarti gemetar, bergetar, atau menjadi gelisah. “Gemetar” menyampaikan reaksi ketakutan secara jelas tanpa mempersempitnya menjadi emosi batin semata.
- source_word: חִיל
  choice: kegentaran
  rationale: Nomina ini dapat menunjuk pada gemetar, derita, atau rasa sakit yang mencekam. “Kegentaran” mempertahankan unsur jasmani dan emosional tanpa memasukkan gambaran sakit bersalin yang tidak dinyatakan secara eksplisit.
- source_word: אָחַז
  choice: mencengkeram
  rationale: Qal perfek dari אחז berarti memegang atau mencengkeram. “Mencengkeram” alami dengan subjek abstrak dan mempertahankan daya ungkap tindakan yang kuat.
- source_word: יֹשְׁבֵי
  choice: penduduk
  rationale: Partisipel substantival dari ישׁב menunjuk kepada orang-orang yang mendiami suatu wilayah. “Penduduk” ringkas dan alami dalam bahasa Indonesia modern.
- source_word: פְּלָשֶׁת
  choice: Filistia
  rationale: Nama wilayah tempat orang Filistin tinggal. “Filistia” mempertahankan rujukan geografis, bukan mengubahnya menjadi nama kelompok etnis.
