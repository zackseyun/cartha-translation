id: EXO.15.11
reference: Exodus 15:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִֽי כָמֹ֤/כָה בָּֽ/אֵלִם֙ יְהוָ֔ה מִ֥י כָּמֹ֖/כָה נֶאְדָּ֣ר בַּ/קֹּ֑דֶשׁ נוֹרָ֥א תְהִלֹּ֖ת עֹ֥שֵׂה פֶֽלֶא־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/011.yaml
  text: Who is like you among the gods, O LORD? Who is like you, majestic in holiness, feared in praises, doing wonders?
translation:
  language: id
  text: Siapakah yang seperti Engkau di antara para ilah, ya TUHAN? Siapakah yang seperti Engkau, mulia dalam kekudusan, dahsyat dalam puji-pujian, yang melakukan keajaiban?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּאֵלִם
  choice: di antara para ilah
  rationale: Bentuk jamak אֵלִם secara langsung berarti 'ilah-ilah'; terjemahan ini mempertahankan bahasa puitis dan tidak menghapus ketegangan teologis dalam teks.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi terjemahan Alkitab Indonesia yang lazim untuk Tetragramaton, dengan huruf kapital sebagai penanda nama ilahi.
- source_word: נֶאְדָּר בַּקֹּדֶשׁ
  choice: mulia dalam kekudusan
  rationale: נֶאְדָּר menyatakan kemuliaan atau keagungan, sedangkan בַּקֹּדֶשׁ paling wajar dipahami sebagai 'dalam kekudusan' dalam konstruksi puitis ini.
- source_word: נוֹרָא תְהִלֹּת
  choice: dahsyat dalam puji-pujian
  rationale: נוֹרָא dapat berarti menakutkan, menggentarkan, atau membangkitkan rasa takjub. 'Dahsyat' mempertahankan nuansa kedahsyatan ilahi dan cocok dengan ungkapan puitis 'dalam puji-pujian'.
- source_word: עֹשֵׂה פֶלֶא
  choice: yang melakukan keajaiban
  rationale: Partisipel עֹשֵׂה menggambarkan TUHAN sebagai pelaku, sementara פֶלֶא berbentuk tunggal kolektif dan secara idiomatis dapat diterjemahkan 'keajaiban'.
theological_decisions:
- issue: Rujukan kepada אֵלִם
  choice: para ilah
  alternative: yang perkasa
  rationale: Makna leksikal paling langsung dan konteks nyanyian perbandingan mendukung 'para ilah'. Terjemahan ini tidak dengan sendirinya menyatakan bahwa ilah-ilah tersebut setara atau sungguh ada; pertanyaan retoris justru menegaskan bahwa tidak ada yang seperti TUHAN.
- issue: Hubungan נוֹרָא dengan תְהִלֹּת
  choice: dahsyat dalam puji-pujian
  alternative: ditakuti dalam puji-pujian
  rationale: Konstruksi Ibrani sangat padat dan dapat dipahami dengan beberapa nuansa. 'Dahsyat' lebih alami dalam bahasa Indonesia sambil mempertahankan unsur rasa gentar, tanpa memaksakan tafsiran bahwa pujian itu sendiri merupakan pelaku yang merasa takut.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan khidmat, dengan dua pertanyaan retoris yang sejajar. Kapitalisasi 'Engkau' dan 'TUHAN' mengikuti gaya hormat yang lazim dalam teks Alkitab Indonesia.
