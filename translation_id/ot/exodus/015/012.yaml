  text: נָטִ֨יתָ֙ יְמִ֣ינְ/ךָ֔ תִּבְלָעֵ֖/מוֹ אָֽרֶץ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/012.yaml
  text: You stretched out your right hand[a]; the earth swallowed them.
translation:
  language: id
  text: Engkau mengulurkan tangan kanan-Mu; bumi menelan mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanah menelan mereka” atau “negeri menelan mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נָטִיתָ
  choice: Engkau mengulurkan
  rationale: Bentuk Qal perfekt orang kedua tunggal maskulin dari נטה menyapa Allah secara langsung. “Mengulurkan” alami dalam bahasa Indonesia dan mempertahankan tindakan konkret.
- source_word: יְמִינְךָ
  choice: tangan kanan-Mu
  rationale: Secara harfiah berarti “tangan kanan-Mu”. Ungkapan konkret dipertahankan, bukan ditafsirkan menjadi “kuasa-Mu”.
- source_word: תִּבְלָעֵמוֹ
  choice: menelan mereka
  rationale: Berasal dari בלע, “menelan/menyerap”. Metafora “menelan” mempertahankan gambaran puitis yang kuat; subjek feminin tunggalnya adalah אָרֶץ.
- source_word: אָרֶץ
  choice: bumi
  rationale: Kata אֶרֶץ dapat berarti bumi, tanah, atau negeri. Dalam gambaran puitis ini, “bumi” menyampaikan cakupan dramatis tanpa menghapus kemungkinan nuansa “tanah”.
theological_decisions:
- issue: Bahasa antropomorfis untuk tindakan ilahi
  choice: Mempertahankan ungkapan konkret “tangan kanan-Mu”.
  alternative: “kuasa-Mu” atau “tangan-Mu yang perkasa”
  rationale: Bahasa Ibrani memakai citra antropomorfis dalam pujian puitis. Mempertahankan citra itu menjaga daya sastra dan teologis teks tanpa menafsirkannya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Kapital pada “-Mu” mengikuti konvensi umum penulisan pronomina yang merujuk kepada Allah.
