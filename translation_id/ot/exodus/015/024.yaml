  text: וַ/יִּלֹּ֧נוּ הָ/עָ֛ם עַל מֹשֶׁ֥ה לֵּ/אמֹ֖ר מַה נִּשְׁתֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/024.yaml
  text: And the people grumbled against Moses[a], saying, “What shall we drink?”
translation:
  language: id
  text: Bangsa itu pun bersungut-sungut terhadap Musa[a], katanya, “Apa yang akan kami minum?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menggerutu” atau “mengeluh.” Kata kerja Ibrani ini menunjuk pada keluhan bersama, khususnya dalam kisah-kisah perjalanan di padang gurun.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: pun bersungut-sungut
  rationale: Bentuk verba ini menyatakan keluhan bersama yang bernada negatif dalam kisah perjalanan di padang gurun. “Bersungut-sungut” mempertahankan nuansa keluhan yang terusik dan tidak sekadar menyampaikan kebutuhan; “pun” menghubungkan tindakan ini secara alami dengan konteks sebelumnya.
- source_word: הָעָם
  choice: bangsa itu
  rationale: עם dengan kata sandang menunjuk kepada kelompok umat yang sudah dikenal dari konteks. “Bangsa itu” mempertahankan bentuk definit tanpa menambahkan “Israel,” yang tidak tertulis dalam ayat ini.
- source_word: עַל
  choice: terhadap
  rationale: Sesudah verba keluhan, עַל menandai orang yang menjadi sasaran keluhan. “Terhadap Musa” mempertahankan daya adversatifnya lebih jelas daripada sekadar “kepada Musa.”
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Mengikuti bentuk nama yang baku dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Infinitif ini memperkenalkan ujaran langsung. “Katanya” mengalir alami dalam bahasa Indonesia sambil tetap menunjukkan hubungan antara sungut-sungut dan perkataan berikutnya.
- source_word: מַה
  choice: Apa
  rationale: Kata tanya sederhana yang membuka pertanyaan langsung.
- source_word: נִּשְׁתֶּה
  choice: yang akan kami minum
  rationale: Bentuk imperfek orang pertama jamak dari שׁתה menyatakan pertanyaan mendesak mengenai apa yang dapat atau akan mereka minum. Konstruksi ini alami dalam bahasa Indonesia dan tidak menentukan modalitas secara berlebihan.
theological_decisions: []
