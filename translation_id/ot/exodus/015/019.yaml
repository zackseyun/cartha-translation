  text: כִּ֣י בָא֩ ס֨וּס פַּרְעֹ֜ה בְּ/רִכְבּ֤/וֹ וּ/בְ/פָרָשָׁי/ו֙ בַּ/יָּ֔ם וַ/יָּ֧שֶׁב יְהוָ֛ה עֲלֵ/הֶ֖ם אֶת מֵ֣י הַ/יָּ֑ם וּ/בְנֵ֧י יִשְׂרָאֵ֛ל הָלְכ֥וּ בַ/יַּבָּשָׁ֖ה בְּ/ת֥וֹךְ הַ/יָּֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/019.yaml
  text: For Pharaoh’s horses went into the sea with his chariots and with his horsemen[a], and Yahweh brought back the waters of the sea over them[b]; but the sons of Israel walked on dry ground through the midst of the sea.
translation:
  language: id
  text: Sebab kuda-kuda Firaun[a] masuk ke laut bersama kereta-kereta dan para penunggang kudanya, lalu Yahweh mengembalikan air laut ke atas mereka. Namun[b], orang Israel berjalan di tanah kering di tengah laut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, bahasa Ibrani memakai bentuk tunggal: “kuda Firaun ... bersama keretanya”; bentuk tunggal itu dapat berfungsi kolektif untuk pasukan berkuda dan pasukan kereta Firaun.'
    reason: lexical_alternative
  - marker: b
    text: Atau, “Dan orang Israel”; kata penghubung Ibraninya secara harfiah berarti “dan”. “Namun” memperjelas kontras dengan nasib pasukan Firaun.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai bahwa ayat ini memberikan dasar penjelasan bagi seruan nyanyian sebelumnya.
- source_word: בָא
  choice: masuk
  rationale: Dengan frasa 'ke laut', verba ini menyatakan gerak memasuki laut; 'masuk' alami dan tepat dalam bahasa Indonesia.
- source_word: סוּס פַּרְעֹה
  choice: kuda-kuda Firaun
  rationale: Walaupun bentuk Ibraninya tunggal, סוּס dapat berfungsi kolektif untuk pasukan berkuda Firaun; bentuk jamak paling jelas dan alami dalam konteks ini.
- source_word: בְּרִכְבּוֹ
  choice: bersama kereta-kereta
  rationale: רכב berbentuk tunggal tetapi dapat menunjuk secara kolektif pada pasukan kereta; bentuk jamak menyampaikan pengertian militer dalam konteks.
- source_word: וּבְפָרָשָׁיו
  choice: dan para penunggang kudanya
  rationale: Menunjuk kepada orang-orang yang menunggang kuda; ungkapan ini langsung dan mudah dipahami tanpa memakai istilah teknis 'kavaleri'.
- source_word: וַיָּשֶׁב יְהוָה
  choice: lalu Yahweh mengembalikan
  rationale: Bentuk hiphil dari שוב bersifat kausatif; 'mengembalikan' mempertahankan tindakan aktif Yahweh dan urutan peristiwa.
- source_word: עֲלֵהֶם אֶת מֵי הַיָּם
  choice: air laut menutupi mereka
  rationale: Susunan Indonesia ini menyampaikan bahwa Yahweh membuat air laut kembali hingga meliputi mereka, dengan gambaran fisik yang jelas.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Namun, orang Israel
  rationale: ו secara harfiah berarti 'dan', tetapi konteks menyatakan kontras kuat. 'Orang Israel' adalah padanan Indonesia yang alami dan inklusif bagi בני ישראל.
- source_word: הָלְכוּ בַיַּבָּשָׁה
  choice: berjalan di tanah kering
  rationale: Mempertahankan verba biasa 'berjalan' dan gambaran dasar laut yang menjadi kering.
- source_word: בְּתוֹךְ הַיָּם
  choice: di tengah laut
  rationale: Padanan langsung, alami, dan mempertahankan gambaran spasial teks sumber.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה secara langsung; transliterasi 'Yahweh' mempertahankan nama tersebut dan membedakannya dari gelar umum.
- issue: Hubungan klausa terakhir dengan kehancuran pasukan Firaun
  choice: Namun
  alternative: dan
  rationale: Bahasa Ibrani hanya memakai konjungsi ו, yang dapat dibiarkan sebagai 'dan'; 'Namun' menyatakan kontras yang jelas dalam konteks tanpa mengubah substansi, sementara alternatif harfiah dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. 'Kereta' dipahami sebagai kereta perang dari konteks; 'kereta perang' tidak ditambahkan agar tetap dekat dengan bentuk sumber. Semua penanda catatan kaki dicantumkan dalam teks utama.
