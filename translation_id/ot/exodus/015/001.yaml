id: EXO.15.1
reference: Exodus 15:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אָ֣ז יָשִֽׁיר מֹשֶׁה֩ וּ/בְנֵ֨י יִשְׂרָאֵ֜ל אֶת הַ/שִּׁירָ֤ה הַ/זֹּאת֙ לַֽ/יהוָ֔ה וַ/יֹּאמְר֖וּ לֵ/אמֹ֑ר אָשִׁ֤ירָה לַֽ/יהוָה֙ כִּֽי גָאֹ֣ה גָּאָ֔ה ס֥וּס וְ/רֹכְב֖/וֹ רָמָ֥ה בַ/יָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/001.yaml
  text: 'Then Moses and the sons of Israel sang this song to Yahweh[a], and they said: “I will sing to Yahweh, for he has triumphed gloriously[b]; horse and its rider he has thrown into the sea.”'
translation:
  language: id
  text: 'Kemudian Musa dan orang Israel menyanyikan nyanyian ini bagi Yahweh[a], lalu mereka berkata: “Aku akan bernyanyi bagi Yahweh, sebab Ia telah menang dengan gemilang[b]; kuda dan penunggangnya telah dilemparkan-Nya ke dalam laut.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH, yang secara tradisional diterjemahkan “TUHAN”.'
    reason: alternative_reading
  - marker: b
    text: Atau “Ia sangat meninggikan diri”; bahasa Ibrani menguatkan verba dengan bentuk yang diulang.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: Kemudian
  rationale: Penanda waktu yang menghubungkan nyanyian ini dengan peristiwa penyeberangan laut sebelumnya.
- source_word: יָשִׁיר
  choice: menyanyikan
  rationale: Walaupun bentuknya imperfek, sesudah אָז dalam narasi bentuk ini memiliki daya lampau; konstruksi Indonesia dengan 'Kemudian ... menyanyikan' menyampaikan urutan peristiwa secara alami.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: Ungkapan baku dan ringkas dalam bahasa Indonesia untuk keturunan atau umat Israel, tanpa memberi kesan bahwa yang dimaksud hanya anak-anak kecil.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: nyanyian ini
  rationale: Padanan langsung yang tidak menambahkan jenis atau tujuan nyanyian.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Mempertahankan nama perjanjian YHWH dalam bentuk 'Yahweh'; 'bagi' alami untuk nyanyian yang dipersembahkan atau ditujukan kepada-Nya.
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: Kata mereka
  rationale: Rumus pengantar ujaran Ibrani disampaikan secara alami dalam bahasa Indonesia tanpa pengulangan kaku 'berkata, demikian'.
- source_word: אָשִׁירָה
  choice: Aku hendak bernyanyi
  rationale: Menyampaikan nuansa kohortatif berupa tekad atau kehendak serta mempertahankan peralihan dari subjek jamak ke suara puitis tunggal.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi tindakan bernyanyi dengan jelas dan wajar.
- source_word: גָאֹה גָּאָה
  choice: Ia sungguh berjaya
  rationale: Pengulangan bentuk verbal Ibrani memberi intensifikasi. 'Sungguh berjaya' sesuai dengan konteks kemenangan, sementara alternatif makna pengagungan dicatat dalam catatan kaki.
- source_word: סוּס וְרֹכְבוֹ
  choice: kuda dan penunggangnya
  rationale: Mempertahankan bentuk tunggal kolektif dan sufiks posesif dalam ungkapan puitis Ibrani.
- source_word: רָמָה
  choice: telah dilemparkan-Nya
  rationale: Menyampaikan tindakan kuat melempar sambil mempertahankan penekanan puitis pada objek yang ditempatkan lebih dahulu.
- source_word: בַיָּם
  choice: ke dalam laut
  rationale: Dalam konteks verba melempar, preposisi Ibrani secara alami menyatakan gerak masuk ke laut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama diri ilahi, sedangkan tradisi menerjemahkannya sebagai 'TUHAN' dijelaskan dalam catatan kaki.
- issue: Makna גָאֹה גָּאָה
  choice: Ia sungguh berjaya
  alternative: Ia sangat ditinggikan
  rationale: Konteks langsung menonjolkan kemenangan Yahweh atas kuda dan penunggang, tetapi akar kata dan konstruksi intensif juga memungkinkan nuansa sangat tinggi atau sangat mulia; ketegangan leksikal ini tidak dihapus dan dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Bani Israel' dipilih sebagai ungkapan kolektif yang lazim; susunan 'telah dilemparkan-Nya' mempertahankan daya puitis tanpa menjadi usang. Semua penanda catatan kaki muncul dalam teks utama.
