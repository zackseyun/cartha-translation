  text: וּ/בְ/ר֤וּחַ אַפֶּ֨י/ךָ֙ נֶ֣עֶרְמוּ מַ֔יִם נִצְּב֥וּ כְמוֹ נֵ֖ד נֹזְלִ֑ים קָֽפְא֥וּ תְהֹמֹ֖ת בְּ/לֶב יָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/008.yaml
  text: At the blast of your nostrils the waters piled up[a]; the flowing waters stood like a heap[d][c][b]; the depths congealed in the heart of the sea.
translation:
  language: id
  text: Oleh embusan dari lubang hidung-Mu, air bertumpuk; air yang mengalir berdiri seperti timbunan; samudra raya mengental di jantung laut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di jantung laut,” yaitu di tengah laut. Kata yang diterjemahkan “mengental” juga dapat berarti “membeku” atau “menggumpal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרוּחַ אַפֶּיךָ
  choice: Oleh embusan dari lubang hidung-Mu
  rationale: רוּחַ dapat berarti angin, napas, atau embusan; bersama אַפֶּיךָ, frasa ini menggambarkan secara antropomorfis embusan kuat dari lubang hidung Allah. Bentuk konkret dipertahankan karena merupakan citra puisi Ibrani.
- source_word: נֶעֶרְמוּ מַיִם
  choice: air bertumpuk
  rationale: Verba ini menyatakan air yang menumpuk atau teronggok. 'Bertumpuk' ringkas, alami, dan mempertahankan citra massa air yang dihimpun.
- source_word: נִצְּבוּ כְמוֹ נֵד נֹזְלִים
  choice: air yang mengalir berdiri seperti timbunan
  rationale: נֹזְלִים mempertahankan sifat air yang mengalir, נִצְּבוּ berarti berdiri, dan נֵד paling langsung menunjuk pada timbunan atau onggokan, bukan secara leksikal pada tembok.
- source_word: קָפְאוּ תְהֹמֹת
  choice: samudra raya mengental
  rationale: קָפְאוּ dapat menggambarkan pembekuan, pengentalan, atau penggumpalan. 'Mengental' menjaga gambaran puitis tanpa mempersempitnya menjadi pembekuan dalam arti ilmiah modern. Bentuk jamak תְהֹמֹת dipahami secara kolektif sebagai air kedalaman yang luas.
- source_word: בְּלֶב יָם
  choice: di jantung laut
  rationale: Terjemahan harfiah citra Ibrani ialah 'di jantung laut', yang secara idiomatis berarti di tengah laut. Citra puitisnya tetap dapat dipahami dalam bahasa Indonesia.
theological_decisions:
- issue: Penggambaran Allah secara antropomorfis dalam Nyanyian di Laut
  choice: Mempertahankan ungkapan konkret 'embusan dari lubang hidung-Mu'.
  alternative: Mengabstrakkannya menjadi 'oleh murka-Mu' atau ungkapan sejenis.
  rationale: Teks Ibrani memakai gambaran jasmani untuk melukiskan tindakan Allah yang dahsyat. Mempertahankannya menjaga puisi sumber dan tidak menambahkan penafsiran teologis yang tidak dituntut teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam puitis dan bermartabat. Citra konkret bahasa Ibrani dipertahankan; susunan klausa dibuat alami bagi pembaca umum. Penanda catatan kaki [a] ditempatkan langsung dalam teks.
