  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תַּ֥עַן לָ/הֶ֖ם מִרְיָ֑ם שִׁ֤ירוּ לַֽ/יהוָה֙ כִּֽי גָאֹ֣ה גָּאָ֔ה ס֥וּס וְ/רֹכְב֖/וֹ רָמָ֥ה בַ/יָּֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/021.yaml
  text: 'And Miriam answered them: “Sing to Yahweh[a], for he has triumphed gloriously[b]; horse and its rider he has thrown into the sea.”'
translation:
  language: id
  text: 'Miryam menjawab mereka: “Bernyanyilah bagi Yahweh, sebab Ia telah menang dengan gemilang[a]; kuda dan penunggangnya telah Ia lemparkan ke dalam laut.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani, “Ia sangat agung” atau “Ia meninggikan diri-Nya dengan sangat.” Dalam konteks nyanyian kemenangan, ungkapan ini juga dapat menyatakan kemenangan-Nya yang agung.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַן
  choice: menjawab
  rationale: Mempertahankan arti dasar ‘menjawab/menanggapi’; dalam konteks nyanyian, kata ini juga dapat menyiratkan nyanyian bersahut-sahutan.
- source_word: לָהֶם
  choice: mereka
  rationale: Mewakili sufiks pronominal jamak maskulin tanpa mempersempit rujukannya, meskipun konteks sebelumnya menyebut para perempuan.
- source_word: מִרְיָם
  choice: Miryam
  rationale: Transliterasi nama Ibrani yang dekat dengan bentuk sumber dan tetap mudah dibaca dalam bahasa Indonesia.
- source_word: שִׁירוּ
  choice: Bernyanyilah
  rationale: Imperatif jamak dari שׁיר berarti ‘bernyanyi’; unsur ‘memuji’ tidak perlu ditambahkan ke dalam verba.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai ‘Yahweh’; preposisi ל diekspresikan secara alami dengan ‘bagi’ dalam konteks bernyanyi untuk-Nya.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi perintah untuk bernyanyi dan sesuai dengan ragam puitis yang wajar.
- source_word: גָאֹה גָּאָה
  choice: Ia telah berjaya dengan gemilang
  rationale: Infinitif absolut bersama verba finit menegaskan gagasan keagungan atau kemenangan. Dalam konteks nyanyian kemenangan, ungkapan ini menyampaikan kemenangan yang nyata dan mulia tanpa meniru pengulangan Ibrani secara kaku.
- source_word: סוּס וְרֹכְבוֹ
  choice: kuda dan penunggangnya
  rationale: Mempertahankan pasangan nomina tunggal kolektif dan sufiks kepunyaan yang merujuk kepada kuda.
- source_word: רָמָה בַיָּם
  choice: telah Ia lemparkan ke dalam laut
  rationale: Verba menyatakan tindakan melemparkan; ‘ke dalam laut’ merupakan bentuk Indonesia yang alami untuk gerak beserta hasilnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. Bentuk ‘Yahweh’ mempertahankan nama perjanjian sebagai nama diri dan mengikuti keputusan istilah yang diberikan.
- issue: Makna גָאֹה גָּאָה
  choice: Ia telah berjaya dengan gemilang
  alternative: Ia sangat ditinggikan; Ia telah meninggikan diri-Nya dengan sangat
  rationale: Konstruksi intensif ini dapat menonjolkan keagungan atau peninggian diri, tetapi konteks kemenangan di laut mendukung ungkapan kemenangan gemilang. Catatan kaki mempertahankan rentang makna harfiahnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis dengan susunan yang tetap dekat pada teks Ibrani. ‘Menjawab’ dipertahankan untuk menjaga ambiguitas antara tanggapan biasa dan nyanyian responsorial; keterangan tambahan tidak diperlukan karena konteks sudah menunjukkan nyanyian.
