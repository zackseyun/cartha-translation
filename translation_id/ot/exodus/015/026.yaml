  text: וַ/יֹּאמֶר֩ אִם שָׁמ֨וֹעַ תִּשְׁמַ֜ע לְ/ק֣וֹל יְהוָ֣ה אֱלֹהֶ֗י/ךָ וְ/הַ/יָּשָׁ֤ר בְּ/עֵינָי/ו֙ תַּעֲשֶׂ֔ה וְ/הַֽאֲזַנְתָּ֙ לְ/מִצְוֺתָ֔י/ו וְ/שָׁמַרְתָּ֖ כָּל חֻקָּ֑י/ו כָּֽל הַ/מַּֽחֲלָ֞ה אֲשֶׁר שַׂ֤מְתִּי בְ/מִצְרַ֨יִם֙ לֹא אָשִׂ֣ים עָלֶ֔י/ךָ כִּ֛י אֲנִ֥י יְהוָ֖ה רֹפְאֶֽ/ךָ־׀־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/026.yaml
  text: He said[a], “If you diligently listen to the voice of Yahweh your God, and do what is right in his eyes, and give ear to his commandments, and keep all his statutes, I will put none of the diseases on you that I put on Egypt, for I am Yahweh, your healer.”
translation:
  language: id
  text: Dia berfirman, “Jika engkau dengan sungguh-sungguh mendengarkan suara Yahweh, Allahmu, melakukan apa yang benar di mata-Nya, mengindahkan perintah-perintah-Nya, dan menaati segala ketetapan-Nya, Aku tidak akan menimpakan kepadamu satu pun dari segala penyakit yang Kutimpakan kepada Mesir, sebab Akulah Yahweh, penyembuhmu.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sebab Akulah Yahweh yang menyembuhkanmu.”'
    reason: Partisip רֹפְאֶךָ dapat dipahami secara nominal (“penyembuhmu”) atau diungkapkan sebagai klausa verbal (“yang menyembuhkanmu”).
lexical_decisions:
- source_word: שָׁמוֹעַ תִּשְׁמַע
  choice: sungguh-sungguh mendengarkan
  rationale: Gabungan infinitif absolut dan verba finit menguatkan tindakan mendengar. Pilihan ini mempertahankan unsur mendengar sekaligus menyiratkan perhatian dan ketaatan tanpa menyederhanakannya menjadi hanya ‘menaati’.
- source_word: לְקוֹל
  choice: mendengarkan suara
  rationale: קוֹל secara harfiah berarti ‘suara’; ungkapan ini tetap wajar dalam bahasa Indonesia dan mempertahankan idiom Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi yang terdapat langsung dalam teks Ibrani.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Menyampaikan sapaan perjanjian dalam bentuk orang kedua tunggal.
- source_word: וְהַיָּשָׁר בְּעֵינָיו
  choice: melakukan apa yang benar di mata-Nya
  rationale: Mempertahankan idiom Ibrani ‘benar di mata-Nya’ dan makna moral יָשָׁר tanpa menafsirkannya sebagai sekadar ‘menyenangkan’.
- source_word: וְהַאֲזַנְתָּ
  choice: memperhatikan
  rationale: Bentuk Hifil dari אזן menyatakan mendengarkan dengan penuh perhatian. ‘Memperhatikan’ membedakannya secara alami dari שׁמע pada awal ayat.
- source_word: לְמִצְוֺתָיו
  choice: perintah-perintah-Nya
  rationale: מִצְוֹת menunjuk pada perintah-perintah dalam konteks perjanjian.
- source_word: וְשָׁמַרְתָּ
  choice: menaati
  rationale: Dalam konteks hukum, שׁמר berarti menjaga dengan menjalankan atau menaati. ‘Menaati’ lebih alami daripada ‘menjaga’ dalam bahasa Indonesia modern.
- source_word: כָּל חֻקָּיו
  choice: segala ketetapan-Nya
  rationale: חֻקִּים adalah ketentuan atau ketetapan yang ditetapkan; ‘ketetapan’ tepat bagi konteks hukum perjanjian.
- source_word: כָּל הַמַּחֲלָה
  choice: satu pun penyakit
  rationale: Bentuk tunggal kolektif dengan כָּל dan penyangkalan paling alami diungkapkan sebagai ‘tidak ... satu pun penyakit’.
- source_word: אֲשֶׁר שַׂמְתִּי בְמִצְרַיִם
  choice: yang Kutimpakan kepada Mesir
  rationale: שׂים secara dasar berarti menaruh atau menempatkan, tetapi dalam hubungan dengan penyakit sebagai hukuman, ‘menimpakan’ merupakan padanan Indonesia yang alami tanpa mengubah acuannya.
- source_word: לֹא אָשִׂים עָלֶיךָ
  choice: Aku tidak akan menimpakan kepadamu
  rationale: Mempertahankan pengulangan verba שׂים dan struktur janji bersyarat dalam ayat.
- source_word: רֹפְאֶךָ
  choice: penyembuhmu
  rationale: Partisip dengan sufiks orang kedua dapat dibaca secara nominal, ‘penyembuhmu’; nuansa verbalnya dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Sifat janji mengenai penyakit
  choice: Janji perjanjian yang bersyarat dalam kaitannya dengan ketaatan Israel dan hukuman atas Mesir
  alternative: Jaminan universal bahwa setiap orang beriman akan selalu disembuhkan secara fisik; pernyataan yang sepenuhnya metaforis
  rationale: Klausa ‘jika’ mengaitkan janji dengan mendengarkan dan menaati, sedangkan penyakit secara eksplisit dihubungkan dengan apa yang ditimpakan kepada Mesir. Terjemahan tidak memperluas atau mempersempit klaim itu melampaui konteks ayat.
- issue: Nilai gramatikal רֹפְאֶךָ
  choice: penyembuhmu
  alternative: yang menyembuhkanmu
  rationale: Partisip Ibrani dapat diungkapkan secara nominal atau verbal. Teks utama mempertahankan gaya sebutan ‘penyembuhmu’, sedangkan catatan kaki menyajikan kemungkinan verbal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi tetap mudah dipahami. Bentuk orang kedua tunggal ‘engkau’ mempertahankan sapaan tunggal Ibrani. Huruf kapital pada pronomina yang merujuk kepada Allah mengikuti kebiasaan editorial Indonesia; nama ilahi ditampilkan sebagai ‘Yahweh’.
