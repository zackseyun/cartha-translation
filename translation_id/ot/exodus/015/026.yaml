revisions:
- from: Dia berfirman, “Jika engkau sungguh-sungguh mendengarkan suara Yahweh, Allahmu, melakukan apa yang benar di mata-Nya, memperhatikan perintah-perintah-Nya, dan menaati segala ketetapan-Nya, Aku tidak akan menimpakan kepadamu satu pun penyakit yang Kutimpakan kepada Mesir, sebab Akulah Yahweh, penyembuhmu.[a]”
  to: Dia berfirman, “Jika engkau dengan sungguh-sungguh mendengarkan suara Yahweh, Allahmu, melakukan apa yang benar di mata-Nya, mengindahkan perintah-perintah-Nya, dan menaati segala ketetapan-Nya, Aku tidak akan menimpakan kepadamu satu pun dari segala penyakit yang Kutimpakan kepada Mesir, sebab Akulah Yahweh, penyembuhmu.[a]”
  rationale: Revisi terbatas pada pemulihan kuantifier “segala” dalam rujukan kepada penyakit-penyakit yang ditimpakan atas Mesir serta penyempurnaan idiom bagi tindakan memberi perhatian kepada perintah. Janji bersyarat, acuan historis kepada Mesir, dan ambiguitas nominal/verbal pada sebutan Yahweh sebagai penyembuh tetap dipertahankan.
