base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/009.yaml
  text: The enemy said[a], ‘I will pursue, I will overtake, I will divide the spoil; my desire will be satisfied on them. I will draw my sword[b]; my hand will dispossess them.’
translation:
  language: id
  text: Musuh berkata, “Aku akan mengejar, aku akan menyusul, aku akan membagi-bagikan jarahan. Aku akan memuaskan hasratku atas mereka.[a] Aku akan menghunus pedangku; tanganku akan menyingkirkan mereka.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jiwaku akan dipenuhi oleh mereka,” yakni, “aku akan merasa puas terhadap mereka.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “tanganku akan menghalau mereka” atau “akan membinasakan mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַר אוֹיֵב
  choice: Musuh berkata
  rationale: Bentuk lampau sederhana sesuai dengan konteks nyanyian yang mengisahkan kesombongan musuh; bentuk tunggal mewakili pihak Mesir yang mengejar.
- source_word: אֶרְדֹּף אַשִּׂיג
  choice: Aku akan mengejar, aku akan menyusul
  rationale: Kedua bentuk imperfek menyatakan tekad musuh. 'Menyusul' secara alami menyampaikan tindakan mencapai pihak yang dikejar.
- source_word: אֲחַלֵּק שָׁלָל
  choice: aku akan membagi-bagikan jarahan
  rationale: Ungkapan ini merujuk pada pembagian hasil rampasan perang; 'jarahan' jelas dan lazim dalam bahasa Indonesia modern.
- source_word: תִּמְלָאֵמוֹ נַפְשִׁי
  choice: Hasratku akan terpuaskan atas mereka
  rationale: נֶפֶשׁ di sini menunjuk pada nafsu atau hasrat batin, bukan secara teknis pada jiwa. Rumusan ini mempertahankan mereka sebagai sasaran hasrat permusuhan, sementara arti harfiahnya dicatat dalam catatan kaki.
- source_word: אָרִיק חַרְבִּי
  choice: Aku akan menghunus pedangku
  rationale: Dalam kolokasi dengan 'pedang', bentuk kausatif ריק merupakan idiom untuk mencabut atau menghunus pedang.
- source_word: תּוֹרִישֵׁמוֹ יָדִי
  choice: tanganku akan membinasakan mereka
  rationale: Dalam konteks serangan militer ini, ירשׁ bentuk Hifil dapat berarti menyingkirkan, menghalau, atau membinasakan. 'Membinasakan' paling alami sebagai puncak ancaman musuh, tetapi keragaman maknanya dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Makna נַפְשִׁי dalam kesombongan musuh
  choice: hasratku
  alternative: jiwaku / nafsuku
  rationale: Pilihan ini menghindari pemaknaan antropologis teknis dan menyampaikan keinginan rakus musuh tanpa menghilangkan ketegangan ungkapan aslinya.
- issue: Cakupan makna תּוֹרִישֵׁמוֹ
  choice: akan membinasakan mereka
  alternative: akan menghalau mereka / akan merampas milik mereka
  rationale: Konteks nyanyian mendukung ancaman pemusnahan, tetapi verba tersebut memiliki cakupan makna lebih luas yang perlu dicatat agar ambiguitas leksikal tidak ditutup.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat, dengan deretan klausa singkat untuk mempertahankan irama serta kesombongan dalam nyanyian. Istilah perang dibuat jelas bagi pembaca umum tanpa menghapus ambiguitas Ibrani.
