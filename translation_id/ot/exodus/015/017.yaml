  revised_text: Engkau akan membawa mereka masuk dan menanam mereka di gunung pusaka-Mu—tempat kediaman-Mu yang Kaubuat, Yahweh—tempat kudus yang ditegakkan oleh tangan-Mu, Tuhan.
