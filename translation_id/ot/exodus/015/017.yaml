revisions:
- from: Engkau akan membawa mereka masuk dan menanam mereka di gunung milik pusaka-Mu,[a] di tempat yang Kaubuat untuk kediaman-Mu, ya Yahweh, di tempat kudus, ya Tuhan,[b] yang ditegakkan oleh tangan-Mu.
  to: Engkau akan membawa mereka masuk dan menanam mereka di gunung pusaka-Mu—tempat kediaman-Mu yang Kaubuat, Yahweh—tempat kudus yang ditegakkan oleh tangan-Mu, Tuhan.
  rationale: 'Revisi mengganti ungkapan genitif yang kaku dengan ''gunung pusaka-Mu'' dan menata kembali aposisi puitisnya: gunung itu diterangkan sebagai tempat kediaman yang dibuat Yahweh dan sebagai tempat kudus yang ditegakkan oleh tangan Tuhan. Pilihan ini mempertahankan ambiguitas rujukan geografis serta membedakan יְהוָה dan אֲדֹנָי.'
