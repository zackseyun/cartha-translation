base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/017.yaml
  text: You will bring them in and plant them on the mountain of your inheritance— the place[a], Yahweh, that you made for your dwelling, the sanctuary, Lord[c][b], that your hands established.
translation:
  language: id
  text: Engkau akan membawa mereka masuk dan menanam mereka di gunung pusaka-Mu—tempat kediaman-Mu yang Kaubuat, Yahweh—tempat kudus yang ditegakkan oleh tangan-Mu, Tuhan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּבִאֵמוֹ
  choice: Engkau akan membawa mereka masuk
  rationale: Bentuk Hifil dari בוא dengan akhiran orang ketiga jamak menyatakan gerak kausatif menuju suatu tempat; “membawa mereka masuk” mempertahankan arah yang tersirat.
- source_word: וְתִטָּעֵמוֹ
  choice: dan menanam mereka
  rationale: נטע secara harfiah berarti “menanam” dan di sini menjadi gambaran puitis tentang menempatkan umat dengan aman; citra konkret itu dipertahankan.
- source_word: בְּהַר נַחֲלָתְךָ
  choice: di gunung milik pusaka-Mu
  rationale: Ungkapan ini menunjuk pada gunung sebagai milik atau bagian pusaka Yahweh. Rumusan ini mempertahankan hubungan genitif serta tidak menentukan apakah acuannya seluruh negeri atau gunung tempat kudus.
- source_word: מָכוֹן לְשִׁבְתְּךָ
  choice: di tempat yang Kaubuat untuk kediaman-Mu
  rationale: מָכוֹן menyatakan tempat yang tetap atau ditegakkan; dalam konstruksi ini, “tempat ... untuk kediaman-Mu” alami dalam bahasa Indonesia dan sesuai dengan paralelisme ayat.
- source_word: פָּעַלְתָּ
  choice: yang Kaubuat
  rationale: פעל adalah verba luas dengan arti mengerjakan atau membuat; “Kaubuat” cukup harfiah dan tidak menambahkan gagasan persiapan yang tidak dinyatakan secara eksplisit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, sehingga berbeda dari gelar אֲדֹנָי yang muncul kemudian.
- source_word: מִקְּדָשׁ
  choice: tempat kudus
  rationale: מִקְדָּשׁ berarti tempat yang kudus atau tempat suci. “Tempat kudus” jelas dan wajar bagi pembaca Indonesia serta tidak harus menyiratkan bangunan tertentu.
- source_word: אֲדֹנָי
  choice: Tuhan
  rationale: אֲדֹנָי berfungsi sebagai gelar ilahi; “Tuhan” mempertahankan perbedaannya dari nama Yahweh tanpa menambahkan kata “ku”.
- source_word: כּוֹנְנוּ יָדֶיךָ
  choice: yang ditegakkan oleh tangan-Mu
  rationale: Bentuk puitis כון menyampaikan tindakan mendirikan atau menjadikan kokoh. Bentuk ini mempertahankan citra antropomorfis “tangan-Mu” dan cocok dengan tempat kudus sebagai anteseden.
theological_decisions:
- issue: Pembedaan יְהוָה dan אֲדֹנָי dalam ayat yang sama
  choice: יְהוָה diterjemahkan “Yahweh” dan אֲדֹנָי diterjemahkan “Tuhan”
  alternative: Menerjemahkan keduanya dengan “TUHAN/Tuhan”
  rationale: Teks Ibrani memakai nama perjanjian dan gelar ilahi secara berbeda. Terjemahan mempertahankan perbedaan yang tampak dalam sumber tanpa menambahkan makna teologis lain.
- issue: Acuan “gunung milik pusaka-Mu” dan “tempat kudus”
  choice: Mempertahankan ungkapan puitis tanpa mengidentifikasikannya secara eksplisit sebagai Kanaan, Sion, atau Bait Allah
  alternative: Menafsirkan acuannya secara khusus sebagai seluruh Kanaan atau sebagai Gunung Sion/Bait Allah
  rationale: Ayat dapat bergerak dari pusaka yang luas menuju tempat kediaman Allah yang lebih khusus. Terjemahan menjaga ketegangan dan cakupan puitis tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada puitis serta khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan luas dalam penerbitan Alkitab Indonesia. Citra “menanam” dan “tangan-Mu” dipertahankan. Penataan frasa mengikuti paralelisme puisi Ibrani tanpa mempersempit acuan geografisnya.
