  verdict: revise
  source_fidelity: Draf mempertahankan urutan gagasan, citra 'menanam', kedua nama ilahi, dan citra tangan yang menegakkan. Namun, 'gunung milik pusaka-Mu' kurang idiomatis dan susunan berulang 'di tempat ... di tempat kudus' membuat dua nomina yang dalam Ibrani beraposisi tampak sebagai dua lokasi terpisah.
  naturalness: Bahasa umumnya baku dan puitis, tetapi 'gunung pusaka-Mu' lebih alami daripada 'gunung milik pusaka-Mu'. Menjadikan 'tempat kediaman-Mu' dan 'tempat kudus' sebagai aposisi yang dipisahkan tanda pisah juga lebih jelas dan lebih dekat dengan struktur puitis sumber.
  terminology: '''Yahweh'', ''Tuhan'', ''tempat kudus'', serta kapitalisasi pronomina ilahi sudah tepat. Tidak perlu menentukan gunung itu sebagai Kanaan, Sion, atau Bait Allah.'
