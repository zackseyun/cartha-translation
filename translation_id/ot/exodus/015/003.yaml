lexical_decisions:
- source_word: יְהוָה
  choice: TUHAN
  rationale: Dalam Alkitab bahasa Indonesia, bentuk kapital TUHAN merupakan padanan yang paling dikenal untuk nama ilahi YHWH; catatan kaki tetap memperlihatkan bahwa teks Ibrani memuat nama pribadi tersebut dan menyebut kemungkinan pelafalannya.
- source_word: אִישׁ מִלְחָמָה
  choice: pejuang
  rationale: Secara harfiah ungkapan ini berarti 'orang/laki-laki perang', tetapi dalam konteks nyanyian kemenangan merupakan idiom bagi sosok yang berperang. 'Pejuang' alami, padat, dan sesuai dengan gaya puisi Indonesia tanpa mengaburkan gambaran peperangannya.
- source_word: שְׁמוֹ
  choice: nama-Nya
  rationale: Klausa Ibrani tidak memakai verba dan secara harfiah berbunyi 'YHWH nama-Nya'. Bentuk 'TUHANlah nama-Nya' mempertahankan penegasan pada nama ilahi sambil terdengar wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה (YHWH)
  choice: TUHAN, dengan catatan kaki mengenai YHWH dan Yahweh
  alternative: Yahweh adalah pejuang; Yahweh nama-Nya.
  rationale: TUHAN mempertahankan konvensi Indonesia yang luas dikenal, sedangkan catatan kaki menjaga transparansi bahwa sumber memakai Tetragramaton dan bahwa 'Yahweh' adalah kemungkinan pelafalannya. Dengan demikian, nama ilahi tidak diam-diam diperlakukan sekadar sebagai gelar.
- issue: Apakah אִישׁ מִלְחָמָה harus diterjemahkan secara harfiah atau idiomatis
  choice: pejuang
  alternative: orang perang / laki-laki perang
  rationale: Ungkapan Ibrani memang memakai אִישׁ, tetapi keseluruhannya menunjuk kepada sosok yang piawai atau aktif berperang. Padanan harfiah terasa janggal dalam bahasa Indonesia dan dapat menyesatkan, sedangkan 'pejuang' menjaga makna tanpa menambahkan rincian teologis.
translation_notes:
  register: Bahasa Indonesia baku, padat, dan puitis. Partikel -lah mempertahankan penegasan klausa kedua. Kapitalisasi TUHAN mengikuti konvensi Alkitab Indonesia untuk YHWH; pronomina ilahi ditulis nama-Nya.
