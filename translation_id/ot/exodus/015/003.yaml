  text: Yahweh[a] adalah seorang pejuang; Yahweh—itulah nama-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani YHWH, yang lazim dialihaksarakan “Yahweh”; alternatifnya “Jehovah”.
