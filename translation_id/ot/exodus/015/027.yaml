  yaml_path: translation/ot/exodus/015/027.yaml
  text: Then they came to Elim[a], where there were twelve springs of water and seventy palm trees[c][b], and they camped there by the water.
translation:
  language: id
  text: Kemudian mereka tiba di Elim. Di sana ada dua belas mata air dan tujuh puluh pohon kurma, lalu mereka berkemah di tepi air itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dekat air itu.” Kata Ibrani untuk “air” berbentuk jamak, tetapi sering berfungsi sebagai kata kolektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Kemudian mereka tiba
  rationale: Bentuk wayyiqtol melanjutkan rangkaian narasi. 'Kemudian' menyatakan urutan peristiwa secara alami, sedangkan 'tiba' sesuai untuk kedatangan di suatu tempat.
- source_word: אֵילִמָה
  choice: di Elim
  rationale: Nama tempat ditransliterasikan sebagai 'Elim'; akhiran penunjuk arah dan verba kedatangan secara alami dinyatakan dengan 'tiba di' dalam bahasa Indonesia.
- source_word: וְשָׁם
  choice: Di sana ada
  rationale: Mempertahankan unsur lokatif שָׁם dengan susunan yang alami dan jelas dalam bahasa Indonesia.
- source_word: עֵינֹת מַיִם
  choice: mata air
  rationale: Ungkapan Indonesia 'mata air' merupakan padanan lazim untuk sumber air dan secara kebetulan dekat dengan citra leksikal עַיִן tanpa terasa harfiah secara janggal.
- source_word: וְשִׁבְעִים תְּמָרִים
  choice: dan tujuh puluh pohon kurma
  rationale: תָּמָר menunjuk pohon palma, khususnya pohon kurma. 'Pohon kurma' lebih tepat dan tetap mudah dipahami pembaca Indonesia.
- source_word: וַיַּחֲנוּ
  choice: lalu mereka berkemah
  rationale: Menyampaikan kelanjutan naratif dan arti חנה dengan ungkapan Indonesia modern.
- source_word: עַל הַמָּיִם
  choice: di tepi air itu
  rationale: עַל dalam konteks tempat menyatakan kedekatan, bukan berada di atas permukaan air. 'Di tepi' alami untuk lokasi perkemahan; 'air itu' memperlakukan bentuk jamak Ibrani מַיִם sebagai nomina kolektif sebagaimana lazim dalam bahasa Indonesia.
