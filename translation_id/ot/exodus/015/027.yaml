translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Tanda catatan kaki ditempatkan setelah klausa yang diterangkannya. Struktur dua kalimat dipilih agar lokatif 'di sana' tetap jelas dan alur ayat terdengar alami.
