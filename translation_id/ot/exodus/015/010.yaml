base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/010.yaml
  text: You blew with your wind; the sea covered them[a]. They sank like lead in mighty waters.
translation:
  language: id
  text: Engkau meniup dengan angin-Mu; laut menutupi mereka.[a] Mereka tenggelam seperti timbal dalam air yang dahsyat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan napas-Mu”. Kata Ibrani yang digunakan dapat berarti “angin”, “napas”, atau “roh”; dalam konteks penyeberangan laut ini, “angin” paling sesuai.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשַׁפְתָּ
  choice: Engkau meniup
  rationale: Kata kerja ini menyatakan tindakan meniup atau mengembuskan napas. Dalam puisi tentang tindakan Allah atas laut, “meniup” mempertahankan gambaran sumber Ibrani secara langsung dan wajar.
- source_word: בְרוּחֲךָ
  choice: dengan angin-Mu
  rationale: רוּחַ dapat berarti “angin”, “napas”, atau “roh”. Konteks penyeberangan laut dan kata kerja “meniup” mendukung “angin”, sementara kemungkinan “napas” dipertahankan dalam catatan kaki.
- source_word: כִּסָּמוֹ יָם
  choice: laut menutupi mereka
  rationale: כסה secara mendasar berarti “menutupi”. Terjemahan ini jelas, alami, dan tidak menambahkan penafsiran di luar ungkapan sumber.
- source_word: צָלֲלוּ
  choice: mereka tenggelam
  rationale: Dalam konteks ini kata tersebut menggambarkan gerakan turun ke dalam air. “Tenggelam” cocok dengan perbandingan mengenai beratnya timah.
- source_word: כָּעוֹפֶרֶת
  choice: seperti timah
  rationale: עוֹפֶרֶת menunjuk pada logam timah hitam (lead). Dalam bahasa Indonesia umum, “timah” merupakan padanan yang paling ringkas dan alami, serta mempertahankan gambaran benda berat.
- source_word: בְּמַיִם אַדִּירִים
  choice: dalam air yang dahsyat
  rationale: אַדִּירִים menyatakan kekuatan, kehebatan, atau kedahsyatan. “Air yang dahsyat” terdengar alami dalam puisi Indonesia dan mempertahankan daya ungkap frasa tersebut tanpa mengubahnya menjadi keterangan kedalaman.
theological_decisions:
- issue: Makna רוּחַ dalam konteks puisi teofanik
  choice: angin
  alternative: napas; roh
  rationale: Konteks tindakan fisik atas laut dan hubungannya dengan kata “meniup” paling kuat mendukung “angin”. “Napas” tetap mungkin secara leksikal dan mempertegas gambaran antropomorfis, sehingga dicatat sebagai alternatif; “roh” tidak dipaksakan ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan luas dalam penerbitan Alkitab bahasa Indonesia. Susunan dua klausa pertama dipertahankan dekat dengan puisi Ibrani, sedangkan “air yang dahsyat” dipilih agar kuat tetapi tetap mudah dipahami.
