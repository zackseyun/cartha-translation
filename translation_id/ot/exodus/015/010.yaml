- from: Engkau meniup dengan angin-Mu; laut menutupi mereka.[a] Mereka tenggelam seperti timah dalam air yang dahsyat.
  to: Engkau meniup dengan angin-Mu; laut menutupi mereka.[a] Mereka tenggelam seperti timbal dalam air yang dahsyat.
