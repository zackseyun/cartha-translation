  source_fidelity: 'Teks Indonesia dengan setia mencerminkan susunan dan makna Ibrani: kereta-kereta Firaun serta pasukannya dilemparkan ke laut, sedangkan para perwira pilihannya ditenggelamkan di Yam Suf. Pembedaan antara tindakan aktif ilahi pada klausa pertama dan bentuk pasif pada klausa kedua tetap terjaga. Enklitik -Nya tepat karena subjek ilahi tersirat dari konteks nyanyian dan tidak mengubah makna ayat.'
