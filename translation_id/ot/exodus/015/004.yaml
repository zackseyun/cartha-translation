  terminology: “Firaun,” “pasukan,” dan “perwira” tepat untuk istilah sumber dalam konteks militer. “Laut Teberau” mempertahankan arti leksikal ים סוף tanpa mengidentifikasikannya secara berlebihan dengan “Laut Merah”; catatan kaki secara tepat mencatat terjemahan tradisional.
