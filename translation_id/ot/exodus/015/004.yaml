  variant: modern standard Indonesian
source:
  edition: WLC
  text: מַרְכְּבֹ֥ת פַּרְעֹ֛ה וְ/חֵיל֖/וֹ יָרָ֣ה בַ/יָּ֑ם וּ/מִבְחַ֥ר שָֽׁלִשָׁ֖י/ו טֻבְּע֥וּ בְ/יַם סֽוּף־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/004.yaml
  text: Pharaoh’s chariots and his army he cast into the sea[a], and the choicest of his officers were sunk in the Sea of Reeds.
translation:
  language: id
  text: Kereta-kereta Firaun dan pasukannya dilemparkan-Nya ke dalam laut, dan para perwiranya yang terbaik ditenggelamkan di Laut Teberau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara tradisional diterjemahkan “Laut Merah.” Dalam bahasa Ibrani tertulis “Laut Teberau.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְכְּבֹת
  choice: kereta-kereta
  rationale: Bentuk jamak ini secara konkret menunjuk pada kereta-kereta perang Firaun; dalam konteks militer, kata "kereta" sudah wajar dipahami sebagai kereta perang.
- source_word: פַּרְעֹה
  choice: Firaun
  rationale: Bentuk baku dalam bahasa Indonesia untuk gelar raja Mesir.
- source_word: וְחֵילוֹ
  choice: dan pasukannya
  rationale: חַיִל di sini berarti kekuatan militer; "pasukan" alami dan jelas dalam bahasa Indonesia modern.
- source_word: יָרָה
  choice: dilemparkan-Nya
  rationale: Kata kerja ini berarti melemparkan atau melontarkan. Bentuk Indonesia ini mempertahankan daya ungkap puitis serta menjadikan pelaku ilahi yang tersirat dalam konteks tetap jelas.
- source_word: בַיָּם
  choice: ke dalam laut
  rationale: Dengan kata kerja gerak "melemparkan", frasa ini secara alami menyatakan gerak masuk ke laut.
- source_word: וּמִבְחַר
  choice: yang terbaik
  rationale: Nomina ini menunjuk pada yang terpilih atau terbaik; ungkapan ini jelas dan alami bagi pembaca modern.
- source_word: שָׁלִשָׁיו
  choice: para perwiranya
  rationale: Istilah ini menunjuk pada pejabat militer elite, sering berkaitan dengan pasukan kereta. "Perwira" menyampaikan pangkat militer tanpa mempersempitnya secara berlebihan.
- source_word: טֻבְּעוּ
  choice: ditenggelamkan
  rationale: Bentuk pasif Ibrani menyatakan bahwa mereka dibuat tenggelam atau terbenam; "ditenggelamkan" mempertahankan bentuk pasif dan citra tindakan tersebut.
- source_word: בְיַם סוּף
  choice: di Laut Teberau
  rationale: סוּף berarti gelagah atau teberau. "Laut Teberau" mempertahankan arti ungkapan Ibrani dan memakai padanan Indonesia yang ringkas serta bernuansa kitab suci.
theological_decisions:
- issue: Penerjemahan יַם סוּף
  choice: Laut Teberau
  alternative: Laut Merah
  rationale: Teks Ibrani secara harfiah menunjuk pada laut yang berkaitan dengan teberau atau gelagah. Karena sumber bahasa asli diutamakan, bentuk tersebut dipakai dalam teks utama, sementara sebutan tradisional "Laut Merah" diberikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan irama puitis yang ringkas. Enklitik -Nya menandai pelaku ilahi yang tersirat dari konteks nyanyian tanpa menambahkan nama dalam teks.
