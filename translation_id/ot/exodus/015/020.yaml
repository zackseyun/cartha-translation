base_translation:
  language: en
  yaml_path: translation/ot/exodus/015/020.yaml
  text: Then Miriam the prophetess[a], Aaron’s sister, took the tambourine in her hand, and all the women went out after her with tambourines and dancing.
translation:
  language: id
  text: Kemudian Miryam, nabiah itu, saudara perempuan Harun, mengambil rebana di tangannya, lalu semua perempuan keluar mengikutinya dengan rebana dan tarian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sambil menari.” Kata benda Ibrani dapat menunjuk pada tarian-tarian atau pada kegiatan menari.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקַּח
  choice: Kemudian ... mengambil
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “Kemudian” menyampaikan perkembangan peristiwa secara alami dalam bahasa Indonesia.
- source_word: מִרְיָם
  choice: Miryam
  rationale: Transliterasi ini dekat dengan bentuk Ibrani dan lazim dikenali dalam tradisi Alkitab bahasa Indonesia.
- source_word: הַנְּבִיאָה
  choice: nabiah itu
  rationale: Kata benda Ibrani secara khusus berbentuk feminin. “Nabiah” ringkas, alami, dan mempertahankan penandaan bahwa Miryam adalah seorang nabi perempuan.
- source_word: אֲחוֹת אַהֲרֹן
  choice: saudara perempuan Harun
  rationale: Menerjemahkan rangkaian konstruksi secara jelas dan mempertahankan penyebutan Harun secara eksplisit dalam teks Ibrani.
- source_word: הַתֹּף
  choice: rebana
  rationale: תֹף menunjuk pada alat perkusi genggam, kemungkinan gendang bingkai. “Rebana” merupakan padanan modern yang mudah dipahami.
- source_word: בְּיָדָהּ
  choice: di tangannya
  rationale: Padanan langsung dan idiomatis bagi frasa berpreposisi tersebut.
- source_word: וַתֵּצֶאןָ כָל הַנָּשִׁים אַחֲרֶיהָ
  choice: Semua perempuan mengikuti dia
  rationale: Secara harfiah berarti bahwa semua perempuan “keluar di belakangnya.” “Mengikuti dia” menyampaikan gerak keluar dalam rombongan secara alami tanpa menambahkan arah atau tujuan yang tidak disebutkan.
- source_word: בְּתֻפִּים
  choice: dengan rebana
  rationale: Bentuk jamak Ibrani diterjemahkan sebagai nomina kolektif yang alami dalam bahasa Indonesia; preposisinya menyatakan pengiring atau sarana.
- source_word: וּבִמְחֹלֹת
  choice: dan tarian
  rationale: מְחֹלֹת adalah bentuk jamak yang dapat menunjuk pada tarian-tarian atau kegiatan menari dalam perayaan. “Tarian” mempertahankan bentuk nominal dan terdengar alami.
