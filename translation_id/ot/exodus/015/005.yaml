  text: The depths covered them[a]; they went down into the depths like a stone.
translation:
  language: id
  text: Air yang dalam menutupi mereka; mereka turun ke kedalaman seperti batu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּהֹמֹת
  choice: samudra raya
  rationale: Bentuk jamak dari תְּהוֹם menunjuk pada air laut yang amat dalam. “Samudra raya” alami dalam bahasa Indonesia puitis dan membedakannya dari מְצוֹלֹת pada baris berikutnya.
- source_word: יְכַסְיֻמוּ
  choice: menutupi mereka
  rationale: Bentuk dari כסה dengan akhiran orang ketiga jamak berarti bahwa air itu menutupi mereka; terjemahan ini langsung dan wajar.
- source_word: יָרְדוּ
  choice: mereka turun
  rationale: Qal perfektum dari ירד secara harfiah berarti “turun.” Pilihan ini mempertahankan gambaran gerak dalam bahasa Ibrani tanpa mempersempitnya menjadi “tenggelam.”
- source_word: בִמְצוֹלֹת
  choice: ke laut yang dalam
  rationale: מְצוֹלָה menunjuk pada bagian laut yang dalam. Dengan verba gerak, ב diterjemahkan secara idiomatis sebagai “ke”; frasa ini juga mempertahankan perbedaan leksikal dari תְּהֹמֹת.
- source_word: כְּמוֹ
  choice: seperti
  rationale: Padanan perbandingan yang jelas dan lazim dalam bahasa Indonesia modern.
- source_word: אָבֶן
  choice: batu
  rationale: Kata benda umum yang berarti “batu”; bahasa Indonesia tidak memerlukan kata sandang tak tentu.
