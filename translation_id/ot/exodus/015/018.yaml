  text: Yahweh akan memerintah selama-lamanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH, nama ilahi yang secara tradisional diterjemahkan “TUHAN.”'
