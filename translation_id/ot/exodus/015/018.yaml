lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH sebagai “Yahweh” mempertahankan nama pribadi yang terdapat dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: יִמְלֹךְ
  choice: akan memerintah
  rationale: Bentuk imperfek kata מלך dalam konteks nyanyian kemenangan ini paling wajar dipahami sebagai pernyataan futur mengenai pemerintahan Yahweh yang terus berlangsung; “akan memerintah” alami dalam bahasa Indonesia dan mempertahankan citra kerajaan.
- source_word: לְעֹלָם וָעֶד
  choice: selama-lamanya
  rationale: Ungkapan tetap ini menegaskan durasi tanpa akhir. “Selama-lamanya” merupakan padanan Indonesia yang alami, ringkas, dan sesuai dengan gaya aklamatif ayat tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi, sedangkan “TUHAN” menggantinya dengan gelar dan “Yehova” mencerminkan bentuk pelafalan yang lebih belakangan.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan kalimat mempertahankan bentuk proklamasi puitis dari nyanyian dalam konteksnya.
