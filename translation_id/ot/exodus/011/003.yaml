id: EXO.11.3
reference: Exodus 11:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּתֵּ֧ן יְהוָ֛ה אֶת חֵ֥ן הָ/עָ֖ם בְּ/עֵינֵ֣י מִצְרָ֑יִם גַּ֣ם הָ/אִ֣ישׁ מֹשֶׁ֗ה גָּד֤וֹל מְאֹד֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם בְּ/עֵינֵ֥י עַבְדֵֽי פַרְעֹ֖ה וּ/בְ/עֵינֵ֥י הָ/עָֽם־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/003.yaml
  text: And Yahweh gave the people favor in the sight of the Egyptians[a]. Moreover, the man Moses was very great in the land of Egypt[d][c][b], in the sight of Pharaoh’s servants and in the sight of the people.
translation:
  language: id
  text: Yahweh membuat bangsa itu mendapat perkenanan di mata orang Mesir.[a] Selain itu, Musa sendiri[b] sangat terpandang di tanah Mesir, baik di mata para hamba Firaun[c] maupun di mata rakyat.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memberikan perkenanan bangsa itu di mata orang Mesir.” Maksudnya, Yahweh membuat orang Mesir memandang bangsa itu dengan baik.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “orang itu, Musa,” suatu ungkapan yang memberi penekanan pada Musa.
    reason: lexical_alternative
  - marker: c
    text: Atau “para pejabat Firaun”; kata Ibraninya secara harfiah berarti “para hamba Firaun.”
    reason: lexical_alternative
  - marker: d
    text: “Rakyat” kemungkinan menunjuk kepada penduduk Mesir secara luas, sebagai pembanding para hamba Firaun.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama pribadi, bukan menggantinya dengan gelar.
- source_word: וַיִּתֵּן ... חֵן
  choice: membuat ... mendapat perkenanan
  rationale: Ungkapan ini menyampaikan bahwa Yahweh menyebabkan bangsa itu dipandang dengan baik; bentuk ini alami dalam bahasa Indonesia dan tidak memberi nuansa teologis yang tidak diperlukan.
- source_word: הָעָם
  choice: bangsa itu
  rationale: Dalam konteks, ungkapan ini menunjuk kepada bangsa Israel, tetapi sumber hanya mengatakan 'bangsa/rakyat itu'; terjemahan tidak menambahkan nama Israel.
- source_word: בְּעֵינֵי מִצְרַיִם
  choice: di mata orang Mesir
  rationale: Mempertahankan idiom Ibrani yang juga wajar dan mudah dipahami dalam bahasa Indonesia.
- source_word: גַּם
  choice: Selain itu
  rationale: Menandai penambahan pernyataan mengenai kedudukan Musa.
- source_word: הָאִישׁ מֹשֶׁה
  choice: Musa sendiri
  rationale: Menyampaikan penekanan ungkapan Ibrani secara alami; bentuk harfiah 'orang itu, Musa' dicatat sebagai alternatif.
- source_word: גָּדוֹל מְאֹד
  choice: sangat terpandang
  rationale: Dalam konteks penilaian para pejabat dan rakyat Mesir, frasa ini menunjuk pada kebesaran atau kedudukan Musa. Pilihan ini alami, meski makna harfiahnya lebih luas.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: di tanah Mesir
  rationale: Mempertahankan bentuk lengkap frasa sumber.
- source_word: עַבְדֵי פַרְעֹה
  choice: para hamba Firaun
  rationale: Merupakan padanan langsung; dalam lingkungan istana mereka dapat dipahami sebagai pejabat Firaun.
- source_word: וּבְעֵינֵי הָעָם
  choice: maupun di mata rakyat
  rationale: Mempertahankan sebutan umum dalam sumber dan tidak memastikan identitas rakyat itu melebihi yang dinyatakan teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Mengalihaksarakan nama ilahi dan tidak menggantinya dengan gelar; pilihan ini tidak menambahkan klaim doktrinal di luar teks.
- issue: Cakupan kata הָעָם pada akhir ayat
  choice: rakyat
  alternative: rakyat Mesir
  rationale: Konteks kemungkinan menunjuk pada penduduk Mesir secara luas sebagai pembanding para hamba Firaun, tetapi sumber tidak menyebut 'Mesir' secara eksplisit, sehingga ambiguitas dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur 'baik ... maupun ...' memperjelas hubungan kedua frasa perspektif dengan kedudukan Musa. Idiom 'di mata' dipertahankan karena alami dalam bahasa Indonesia. 'Perkenanan' dipilih untuk חֵן agar membedakannya dari kasih karunia dalam konteks teologis.
