  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה לֹא יִשְׁמַ֥ע אֲלֵי/כֶ֖ם פַּרְעֹ֑ה לְמַ֛עַן רְב֥וֹת מוֹפְתַ֖/י בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/009.yaml
  text: And Yahweh said to Moses[a], “Pharaoh will not listen to you[c][b], so that my wonders may be multiplied in the land of Egypt.”
translation:
  language: id
  text: Lalu Yahweh berfirman[c] kepada Musa, “Firaun tidak akan mendengarkan kalian[a], supaya tanda-tanda ajaib-Ku[b] menjadi semakin banyak di tanah Mesir.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak akan mengindahkan kalian.” Kata Ibrani yang dipakai dapat berarti mendengar, mendengarkan, atau mengindahkan.
    reason: lexical_alternative
  - marker: b
    text: Atau “keajaiban-keajaiban-Ku” atau “tanda-tanda-Ku.” Kata Ibrani ini dapat menunjuk pada tanda, keajaiban, atau pertanda.
    reason: lexical_alternative
  - marker: c
    text: Sebagian terjemahan memakai, “Sebelumnya Yahweh telah berfirman kepada Musa,” untuk menghubungkan pernyataan ini dengan konteks narasi sebelumnya. Namun, bentuk kata kerja Ibraninya sendiri adalah bentuk lampau naratif yang standar.
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama pribadi, bukan menggantinya dengan gelar.
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Bentuk wayyiqtol lazimnya melanjutkan alur narasi dengan kala lampau sederhana. 'Berfirman' merupakan padanan Indonesia yang wajar dan bermartabat ketika Allah menjadi subjek.
- source_word: לֹא יִשְׁמַע אֲלֵיכֶם
  choice: tidak akan mendengarkan kalian
  rationale: שׁמע dengan אֶל berarti mendengarkan atau mengindahkan. 'Kalian' mempertahankan akhiran orang kedua jamak yang menunjuk kepada Musa dan Harun.
- source_word: לְמַעַן
  choice: supaya
  rationale: Mengungkapkan maksud atau hasil secara alami tanpa menghilangkan nuansa tujuan yang paling kuat dalam konteks.
- source_word: רְבוֹת
  choice: menjadi semakin banyak
  rationale: Menyampaikan gagasan bertambah atau diperbanyak dalam bahasa Indonesia yang alami, tanpa memaksakan bentuk pasif.
- source_word: מוֹפְתַי
  choice: tanda-tanda ajaib-Ku
  rationale: מוֹפֵת dapat berarti tanda, keajaiban, atau pertanda. Gabungan ini mempertahankan unsur penandaan sekaligus sifat luar biasanya.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: di tanah Mesir
  rationale: Mempertahankan unsur אֶרֶץ secara ringkas dan idiomatis.
theological_decisions:
- issue: Maksud ilahi dalam penolakan Firaun
  choice: '''supaya'' mempertahankan hubungan tujuan: penolakan Firaun berada dalam maksud agar tanda-tanda ajaib Yahweh bertambah banyak di Mesir.'
  alternative: 'Hubungan akibat yang lebih lemah: ''sehingga tanda-tanda ajaib-Ku menjadi semakin banyak.'''
  rationale: לְמַעַן paling wajar menyatakan tujuan di sini. Terjemahan tidak menjelaskan lebih jauh hubungan antara tanggung jawab Firaun dan maksud Allah, sehingga ketegangan teologis teks tetap terpelihara.
- issue: Hubungan perkataan Yahweh dengan konteks narasi sebelumnya
  choice: 'Kala lampau naratif sederhana: ''Lalu Yahweh berfirman.'''
  alternative: '''Sebelumnya Yahweh telah berfirman'' untuk menyelaraskan kronologi secara eksplisit.'
  rationale: Bentuk וַיֹּאמֶר adalah bentuk naratif standar dan tidak dengan sendirinya menuntut kala lampau sempurna. Alternatif kontekstual dicatat tanpa dimasukkan ke teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang bermartabat. 'Kalian' dipakai karena bentuk Ibrani jamak, sedangkan 'tanda-tanda ajaib' menjaga keluasan makna מוֹפֵת. Semua penanda catatan kaki ditempatkan dalam teks utama.
