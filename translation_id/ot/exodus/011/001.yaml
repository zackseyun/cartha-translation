  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה ע֣וֹד נֶ֤גַע אֶחָד֙ אָבִ֤יא עַל פַּרְעֹה֙ וְ/עַל מִצְרַ֔יִם אַֽחֲרֵי כֵ֕ן יְשַׁלַּ֥ח אֶתְ/כֶ֖ם מִ/זֶּ֑ה כְּ/שַׁ֨לְּח֔/וֹ כָּלָ֕ה גָּרֵ֛שׁ יְגָרֵ֥שׁ אֶתְ/כֶ֖ם מִ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/001.yaml
  text: Then Yahweh said to Moses[a], “One more plague I will bring upon Pharaoh and upon Egypt. After that he will send you away from here. When he sends you away[b], he will surely drive you out completely from here.”
translation:
  language: id
  text: Kemudian Yahweh berfirman kepada Musa, “Satu malapetaka lagi[a] akan Kudatangkan atas Firaun dan atas Mesir. Sesudah itu, ia akan menyuruh kalian pergi dari sini. Ketika ia menyuruh kalian pergi, ia benar-benar akan mengusir kalian[b] semua dari sini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani ini juga dapat berarti “pukulan”, “hantaman”, atau “tulah”.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani untuk “benar-benar akan mengusir” bersifat tegas; secara harfiah, “mengusir, ia akan mengusir”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: וַיֹּאמֶר
  choice: Kemudian ... berfirman
  rationale: Bentuk naratif ini melanjutkan urutan peristiwa; “kemudian” wajar dalam bahasa Indonesia, sedangkan “berfirman” merupakan padanan yang lazim dan bermartabat ketika Allah menjadi subjek.
- source_word: עוֹד נֶגַע אֶחָד
  choice: Satu malapetaka lagi
  rationale: עוֹד menyatakan tambahan, sedangkan נֶגַע menunjuk pada pukulan atau bencana yang menimpa; “malapetaka” jelas dalam konteks penghukuman atas Mesir tanpa membatasinya pada wabah penyakit.
- source_word: אָבִיא עַל פַּרְעֹה וְעַל מִצְרַיִם
  choice: akan Kudatangkan atas Firaun dan atas Mesir
  rationale: Bentuk kausatif בוא berarti “mendatangkan”; pengulangan “atas” mempertahankan kesejajaran Ibrani dan nuansa hukuman yang menimpa kedua objek.
- source_word: יְשַׁלַּח אֶתְכֶם מִזֶּה
  choice: ia akan menyuruh kalian pergi dari sini
  rationale: שׁלח dapat berarti menyuruh pergi atau melepaskan. Pilihan ini alami dan mempertahankan perbedaan kadar dengan גָּרֵשׁ, “mengusir”, pada klausa berikutnya.
- source_word: כְּשַׁלְּחוֹ
  choice: Ketika ia menyuruh kalian pergi
  rationale: Prefiks כְּ dipahami secara temporal dalam konteks ini, yakni “ketika” atau “pada saat”.
- source_word: כָּלָה גָּרֵשׁ יְגָרֵשׁ
  choice: ia benar-benar akan mengusir kalian seluruhnya
  rationale: Infinitif absolut bersama verba berhingga menegaskan tindakan mengusir, yang dinyatakan dengan “benar-benar”; כָּלָה menyampaikan cakupan menyeluruh, dinyatakan dengan “seluruhnya”.
- source_word: מִזֶּה
  choice: dari sini
  rationale: Padanan deiktis yang langsung dan alami untuk tempat tempat Musa dan bangsa Israel berada, yaitu Mesir.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama ilahi dan tidak menggantinya dengan sebuah gelar.
- issue: Kadar tindakan Firaun terhadap Israel
  choice: “menyuruh kalian pergi” lalu “benar-benar ... mengusir”
  alternative: Menggunakan “membiarkan pergi” pada kedua klausa
  rationale: Pilihan ini mempertahankan peningkatan kekuatan dari שׁלח kepada גָּרֵשׁ serta penegasan gramatikal pada klausa terakhir, tanpa menghilangkan ketegangan bahwa Firaun bukan sekadar mengizinkan, melainkan akhirnya mengusir mereka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Kalian” dipakai karena bentuk Ibraninya jamak dan menunjuk kepada Musa beserta bangsa Israel. Kapitalisasi pronomina terikat “Ku-” mengikuti kebiasaan bahasa Indonesia ketika merujuk kepada Allah.
