base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/002.yaml
  text: Speak now in the hearing of the people[a], and let each man ask from his neighbor, and each woman from her neighbor, for articles of silver and articles of gold.
translation:
  language: id
  text: 'Katakanlah sekarang kepada bangsa itu: Hendaklah setiap laki-laki meminta[a] barang-barang dari perak dan barang-barang dari emas kepada tetangganya, dan setiap perempuan meminta barang-barang dari perak dan barang-barang dari emas kepada tetangga perempuannya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “meminjam.” Kata kerja Ibrani ini berarti “meminta” atau “memohon” dan tidak dengan sendirinya menyatakan bahwa barang-barang itu akan dikembalikan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֶּר נָא
  choice: Katakanlah sekarang
  rationale: Imperatif Piel דַּבֶּר memerintahkan Musa berbicara kepada bangsa itu. Partikel נָא di sini menyatakan desakan atau kesegeraan; “sekarang” terdengar alami tanpa memberi kesan bahwa Allah sedang memohon dengan sopan.
- source_word: בְּאָזְנֵי הָעָם
  choice: kepada bangsa itu
  rationale: Ungkapan harfiah “di telinga bangsa itu” berarti menyampaikan sesuatu sehingga mereka mendengarnya. Bahasa Indonesia alami cukup menyatakannya dengan “kepada bangsa itu”; הָעָם dalam konteks ini menunjuk kepada bangsa Israel.
- source_word: וְיִשְׁאֲלוּ
  choice: Hendaklah ... meminta
  rationale: Bentuk imperfek berdaya yusif setelah perintah menyampaikan arahan lanjutan. “Hendaklah ... meminta” mempertahankan daya perintahnya, sedangkan “meminta” tidak menambahkan gagasan kewajiban mengembalikan yang tidak dinyatakan oleh verba Ibrani.
- source_word: אִישׁ ... וְאִשָּׁה
  choice: setiap laki-laki ... dan setiap perempuan
  rationale: Kedua nomina tunggal dipakai secara distributif dan berpasangan menurut gender; pengulangan “setiap” tersirat pada unsur kedua dan dipertahankan melalui susunan bahasa Indonesia.
- source_word: מֵאֵת רֵעֵהוּ ... מֵאֵת רְעוּתָהּ
  choice: kepada tetangganya ... kepada tetangga perempuannya
  rationale: רֵעַ/רְעוּת menunjuk teman, sesama, atau tetangga. “Tetangga” sesuai dengan lingkungan komunitas dalam konteks ini. Bentuk feminin רְעוּתָהּ dinyatakan secara eksplisit sebagai “tetangga perempuannya,” sementara preposisi “kepada” merupakan pasangan alami bagi verba “meminta” dalam bahasa Indonesia.
- source_word: כְּלֵי כֶסֶף וּכְלֵי זָהָב
  choice: barang-barang perak dan barang-barang emas
  rationale: כְּלִי mencakup berbagai benda, perkakas, wadah, atau perhiasan. “Barang-barang” mempertahankan keluasan makna tanpa membatasi jenis bendanya.
theological_decisions:
- issue: Makna שאל ketika orang Israel menerima barang berharga dari orang Mesir
  choice: meminta
  alternative: meminjam
  rationale: Verba Ibrani שאל berarti meminta atau memohon dan tidak dengan sendirinya menyatakan bahwa barang tersebut harus dikembalikan. Karena “meminjam” dapat menyiratkan kewajiban pengembalian yang tidak disebutkan dalam ayat ini, “meminta” digunakan dalam teks utama; terjemahan tradisional dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan daya perintah, pembagian distributif laki-laki/perempuan, serta keluasan istilah untuk benda-benda dari perak dan emas.
