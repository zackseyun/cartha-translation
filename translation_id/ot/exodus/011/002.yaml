    issue: Cakupan objek barang berharga kurang jelas dalam susunan draf.
    rationale: Dalam teks Ibrani, baik setiap laki-laki maupun setiap perempuan diperintahkan meminta benda-benda perak dan emas. Susunan draf dapat dibaca seolah-olah hanya laki-laki yang meminta barang-barang itu, sementara klausa perempuan hanya melengkapi penerima permintaan. Mengulang “meminta” dan objek pada klausa kedua menghilangkan ketaksaan ini.
