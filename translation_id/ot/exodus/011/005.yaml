source:
  edition: WLC
  text: וּ/מֵ֣ת כָּל בְּכוֹר֮ בְּ/אֶ֣רֶץ מִצְרַיִם֒ מִ/בְּכ֤וֹר פַּרְעֹה֙ הַ/יֹּשֵׁ֣ב עַל כִּסְא֔/וֹ עַ֚ד בְּכ֣וֹר הַ/שִּׁפְחָ֔ה אֲשֶׁ֖ר אַחַ֣ר הָ/רֵחָ֑יִם וְ/כֹ֖ל בְּכ֥וֹר בְּהֵמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/005.yaml
  text: And every firstborn in the land of Egypt will die[a], from the firstborn of Pharaoh, who sits on his throne, to the firstborn of the servant woman who is behind the millstones, and every firstborn of the livestock.
translation:
  language: id
  text: Setiap anak sulung di tanah Mesir akan mati, mulai dari anak sulung Firaun yang duduk di atas takhtanya sampai anak sulung budak perempuan[a] yang berada di belakang batu kilangan, juga setiap anak sulung ternak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hamba perempuan.” Kata Ibrani ini menunjuk kepada seorang perempuan dalam status perbudakan; ungkapan “di belakang batu kilangan” menggambarkan pekerjaan menggiling yang berstatus rendah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵת
  choice: akan mati
  rationale: Bentuk perfektum dalam pengumuman profetis ini menyatakan peristiwa mendatang dengan kepastian; “akan mati” alami dalam bahasa Indonesia dan sesuai konteks tulah yang segera datang.
- source_word: כָּל בְּכוֹר
  choice: setiap anak sulung
  rationale: כָּל dengan nomina tunggal berdaya distributif. “Setiap anak sulung” mempertahankan cakupan individual tanpa membatasi istilah itu secara eksplisit pada anak laki-laki.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: di tanah Mesir
  rationale: Ungkapan ini mempertahankan unsur geografis אֶרֶץ secara wajar dan bermartabat dalam bahasa Indonesia.
- source_word: מִבְּכוֹר ... עַד בְּכוֹר
  choice: mulai dari anak sulung ... sampai anak sulung
  rationale: Konstruksi “mulai dari ... sampai ...” menyampaikan rentang sosial menyeluruh yang ditandai oleh מן ... עד.
- source_word: פַּרְעֹה הַיֹּשֵׁב עַל כִּסְאוֹ
  choice: Firaun yang duduk di atas takhtanya
  rationale: Klausa relatif mempertahankan nuansa partisipial dan menampilkan kedudukan kerajaan Firaun.
- source_word: הַשִּׁפְחָה
  choice: budak perempuan
  rationale: Istilah Ibrani menunjuk perempuan berstatus perbudakan. “Budak perempuan” jelas, modern, dan tidak memperhalus kontras sosial dengan Firaun.
- source_word: אַחַר הָרֵחָיִם
  choice: di belakang batu kilangan
  rationale: Terjemahan ini mempertahankan gambaran konkret posisi seorang pekerja yang menggiling biji-bijian, alih-alih menggantinya dengan ungkapan umum.
- source_word: וְכֹל בְּכוֹר בְּהֵמָה
  choice: juga setiap anak sulung ternak
  rationale: בְּהֵמָה merujuk secara luas pada hewan piaraan; “ternak” merupakan padanan kolektif yang tepat. “Juga” menghubungkan kelompok ini secara alami dengan rentang manusia sebelumnya.
theological_decisions:
- issue: Penerjemahan istilah status sosial שִׁפְחָה
  choice: budak perempuan
  alternative: hamba perempuan; pelayan perempuan
  rationale: Ayat ini menegaskan jangkauan tulah dari rumah penguasa tertinggi hingga perempuan dalam status perbudakan yang melakukan pekerjaan kasar. Pilihan ini mempertahankan kontras sosial dan tidak mengaburkan status terikat yang dinyatakan teks.
- issue: Cakupan istilah בְּכוֹר
  choice: anak sulung
  alternative: anak laki-laki sulung
  rationale: Teks hanya memakai istilah “sulung” dan tidak menambahkan kata “laki-laki”. Karena itu, terjemahan tidak mempersempit cakupan yang secara leksikal dibiarkan tidak tersurat, termasuk ketika istilah yang sama dipakai untuk ternak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur “mulai dari ... sampai ...” dipakai untuk menyatakan rentang sosial dengan jelas. Penanda catatan kaki ditempatkan langsung setelah “budak perempuan,” yaitu istilah yang diterangkan oleh catatan.
