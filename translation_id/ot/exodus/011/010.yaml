  text: וּ/מֹשֶׁ֣ה וְ/אַהֲרֹ֗ן עָשׂ֛וּ אֶת כָּל הַ/מֹּפְתִ֥ים הָ/אֵ֖לֶּה לִ/פְנֵ֣י פַרְעֹ֑ה וַ/יְחַזֵּ֤ק יְהוָה֙ אֶת לֵ֣ב פַּרְעֹ֔ה וְ/לֹֽא שִׁלַּ֥ח אֶת בְּנֵֽי יִשְׂרָאֵ֖ל מֵ/אַרְצֽ/וֹ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/010.yaml
  text: And Moses and Aaron did all these signs before Pharaoh[a], and Yahweh hardened Pharaoh’s heart[c][b], and he did not let the sons of Israel go out from his land.
translation:
  language: id
  text: Musa dan Harun melakukan semua tanda ajaib ini di hadapan Firaun, dan Yahweh mengeraskan hati Firaun[a], dan ia tidak membiarkan orang Israel[b] keluar dari negerinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menguatkan hati Firaun” atau “membuat hati Firaun teguh.”
    reason: Menjaga citra leksikal חזק dan ketegangan penafsiran mengenai tindakan Yahweh.
  - marker: b
    text: Secara harfiah, “anak-anak lelaki Israel”; maksudnya bangsa atau umat Israel.
    reason: Menjelaskan bentuk harfiah ungkapan kolektif Ibrani tanpa membatasi cakupannya pada laki-laki.
lexical_decisions:
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: Musa dan Harun
  rationale: Menggunakan bentuk nama yang sudah baku dalam bahasa Indonesia.
- source_word: עָשׂוּ
  choice: melakukan
  rationale: Padanan langsung dan wajar bagi עשה dalam kaitannya dengan tindakan-tindakan ajaib.
- source_word: כָּל הַמֹּפְתִים הָאֵלֶּה
  choice: semua tanda ajaib ini
  rationale: מוֹפֵת menunjuk pada tindakan luar biasa yang sekaligus berfungsi sebagai tanda; 'tanda ajaib' mempertahankan kedua nuansa itu secara alami.
- source_word: לִפְנֵי פַרְעֹה
  choice: di hadapan Firaun
  rationale: Padanan idiomatis yang mempertahankan gagasan bahwa tindakan itu dilakukan dalam kehadiran Firaun.
- source_word: וַיְחַזֵּק
  choice: mengeraskan
  rationale: Dalam formula berulang tentang hati Firaun, bentuk piel חזק menyatakan peneguhan dalam sikap keras atau penolakan; 'mengeraskan' menyampaikan hasil kontekstual itu tanpa menghilangkan pelaku ilahinya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks sumber, bukan menggantinya dengan gelar.
- source_word: לֵב פַּרְעֹה
  choice: hati Firaun
  rationale: Padanan langsung dari konstruksi kepemilikan Ibrani.
- source_word: וְלֹא שִׁלַּח
  choice: sehingga ia tidak membiarkan ... keluar
  rationale: Dalam konteks keluarnya Israel dari Mesir, שלח berarti mengizinkan atau melepaskan mereka pergi. Hubungan hasil dibuat eksplisit secara wajar dalam bahasa Indonesia, dengan rujukan 'ia' tetap kepada Firaun.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan harfiah 'anak-anak lelaki Israel' berfungsi sebagai sebutan kolektif bagi umat Israel; 'orang Israel' adalah padanan Indonesia yang alami tanpa membatasi rujukannya hanya kepada laki-laki.
- source_word: מֵאַרְצוֹ
  choice: dari negerinya
  rationale: אֶרֶץ di sini adalah wilayah kekuasaan Firaun; sufiks orang ketiga dipertahankan dengan '-nya'.
theological_decisions:
- issue: Tindakan Yahweh terhadap hati Firaun
  choice: Yahweh mengeraskan hati Firaun
  alternative: Yahweh menguatkan hati Firaun / membuat hati Firaun teguh
  rationale: חזק secara leksikal dapat berarti 'menguatkan' atau 'meneguhkan', tetapi dalam rangkaian kisah ini menggambarkan Firaun yang diteguhkan dalam penolakannya. 'Mengeraskan' mempertahankan ketegangan teks mengenai tindakan ilahi dan tanggung jawab Firaun; alternatif literal dicatat dalam catatan kaki.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel / keturunan Israel
  rationale: Walaupun bentuk Ibraninya secara harfiah 'anak-anak lelaki Israel', ungkapan ini merupakan sebutan kolektif untuk bangsa Israel. Padanan alami tidak boleh memberi kesan bahwa hanya laki-laki yang dimaksud.
- issue: Hubungan antarklausa וְלֹא שִׁלַּח
  choice: sehingga ia tidak membiarkan
  alternative: dan ia tidak membiarkan
  rationale: Waw dapat menghubungkan klausa secara umum; konteks menunjukkan bahwa keteguhan hati Firaun berujung pada penolakannya melepaskan Israel. 'Sehingga' menyampaikan hubungan kontekstual tanpa mengubah pelaku klausa kedua.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Tanda ajaib' dipilih agar fungsi tanda dan sifat luar biasanya sama-sama terdengar. Nama ilahi dipertahankan sebagai 'Yahweh'. Semua penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
