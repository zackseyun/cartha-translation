  text: וְ/יָרְד֣וּ כָל עֲבָדֶי/ךָ֩ אֵ֨לֶּה אֵלַ֜/י וְ/הִשְׁתַּֽחֲוּוּ לִ֣/י לֵ/אמֹ֗ר צֵ֤א אַתָּה֙ וְ/כָל הָ/עָ֣ם אֲשֶׁר בְּ/רַגְלֶ֔י/ךָ וְ/אַחֲרֵי כֵ֖ן אֵצֵ֑א וַ/יֵּצֵ֥א מֵֽ/עִם פַּרְעֹ֖ה בָּ/חֳרִי אָֽף־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/008.yaml
  text: Then all these servants of yours will come down to me and bow down to me[a], saying, ‘Go out[b], you and all the people who are at your feet,’ and after that I will go out.” And he went out from Pharaoh in burning anger.
translation:
  language: id
  text: Lalu semua hambamu[a] ini akan turun menemuiku dan sujud di hadapanku sambil berkata, ‘Keluarlah, engkau dan seluruh rakyat yang mengikutimu[b]!’ Sesudah itu aku akan keluar.” Lalu Musa meninggalkan Firaun dengan kemarahan yang berkobar-kobar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para pejabatmu”; kata Ibrani ini dapat menunjuk kepada para pelayan atau pejabat kerajaan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “yang berada di kakimu”, sebuah ungkapan untuk orang-orang yang menyertai atau mengikuti seseorang.
    reason: idiom_explanation
lexical_decisions:
- source_word: וְיָרְדוּ
  choice: akan turun menemuiku
  rationale: Kata kerja ירד mempertahankan gambaran gerak turun. Tambahan ‘menemuiku’ menyampaikan arah אֵלַי secara alami dari sudut pandang Musa.
- source_word: עֲבָדֶיךָ
  choice: hambamu
  rationale: עבד dapat berarti hamba, pelayan, atau pejabat istana. ‘Hambamu’ mempertahankan istilah yang lebih luas, sedangkan nuansa pejabat istana dijelaskan dalam catatan kaki.
- source_word: וְהִשְׁתַּחֲוּוּ לִי
  choice: sujud di hadapanku
  rationale: Ungkapan ini menggambarkan tindakan membungkuk atau merebahkan diri sebagai penghormatan. Pilihan ini mempertahankan tindakan fisiknya tanpa secara khusus menjadikannya tindakan penyembahan.
- source_word: לֵאמֹר
  choice: sambil berkata
  rationale: Pengantar ujaran langsung yang alami dalam bahasa Indonesia dan sesuai dengan hubungan tindakan-tindakan dalam kalimat.
- source_word: צֵא אַתָּה
  choice: Keluarlah, engkau
  rationale: ‘Keluarlah’ mempertahankan kata kerja יצא dan motif keluarnya Israel, sedangkan ‘engkau’ mencerminkan pronomina אַתָּה yang bersifat menegaskan.
- source_word: וְכָל הָעָם אֲשֶׁר בְּרַגְלֶיךָ
  choice: dan seluruh rakyat yang mengikutimu
  rationale: Secara harfiah ungkapan ini berarti ‘yang berada di kakimu’, suatu idiom bagi orang-orang yang menyertai atau mengikuti seseorang. Terjemahan idiomatis dipakai dalam teks dan bentuk harfiahnya dicatat.
- source_word: וְאַחֲרֵי כֵן אֵצֵא
  choice: Sesudah itu aku akan keluar
  rationale: Mempertahankan urutan waktu dan konsistensi terjemahan kata kerja יצא.
- source_word: וַיֵּצֵא מֵעִם פַּרְעֹה
  choice: Lalu Musa meninggalkan Firaun
  rationale: Bahasa Indonesia lazim menyebut kembali Musa sebagai subjek agar pergantian dari ucapan langsung ke narasi jelas. ‘Meninggalkan Firaun’ menyampaikan מֵעִם secara alami.
- source_word: בָּחֳרִי אָף
  choice: dengan kemarahan yang berkobar-kobar
  rationale: Ungkapan Ibrani menggambarkan panas atau nyalanya amarah. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan intensitas metaforanya.
theological_decisions:
- issue: Makna tindakan sujud para hamba Firaun
  choice: sujud di hadapanku
  alternative: menyembah aku
  rationale: Konteks istana mendukung tindakan penghormatan atau permohonan yang dilakukan dengan membungkuk; teks tidak mengharuskan makna penyembahan religius.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Struktur ujaran Musa dipertahankan, sementara subjek ‘Musa’ disebut secara eksplisit dalam narasi penutup demi kejelasan.
