  source_fidelity: 'Teks dengan setia menyampaikan urutan dan unsur utama Ibrani: para hamba Firaun akan turun kepada Musa, bersujud, memerintahkan Firaun beserta orang-orang yang mengikutinya untuk keluar, lalu Musa akan keluar. Penutupnya tepat menyatakan bahwa Musa pergi dari Firaun dalam amarah yang menyala-nyala. Penyebutan eksplisit “Musa” tepat karena subjek naratif tersirat itu jelas merujuk kepadanya.'
