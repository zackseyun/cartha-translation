  text: And there will be a great cry throughout all the land of Egypt[a], such as has never happened before, nor will ever happen again.
translation:
  language: id
  text: Akan ada teriakan besar di seluruh tanah Mesir[a], yang belum pernah terjadi sebelumnya dan tidak akan pernah terjadi lagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seruan keras” atau “ratapan yang hebat.” Kata Ibrani צְעָקָה dapat menunjuk pada teriakan keras karena kesusahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: Lalu akan terdengar
  rationale: Bentuk perfektif dengan waw dalam pengumuman profetis mengacu pada masa depan. Karena subjeknya adalah jeritan, 'akan terdengar' menyampaikan peristiwa itu secara alami dalam bahasa Indonesia.
- source_word: צְעָקָה
  choice: jeritan
  rationale: Nomina ini menunjuk pada seruan keras dalam kesusahan. 'Jeritan' mempertahankan unsur suara dan penderitaan tanpa menentukan secara sempit apakah itu ratapan atau teriakan protes.
- source_word: גְדֹלָה
  choice: yang dahsyat
  rationale: Adjektiva ini menyatakan besarnya intensitas. 'Dahsyat' lebih alami daripada 'besar' untuk menerangkan jeritan dalam bahasa Indonesia, sambil tetap mempertahankan kekuatan ungkapan Ibrani.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: di seluruh tanah Mesir
  rationale: Frasa ini menyatakan cakupan yang meliputi segenap wilayah Mesir.
- source_word: אֲשֶׁר כָּמֹהוּ לֹא נִהְיָתָה
  choice: yang belum pernah terjadi sebelumnya
  rationale: Klausa perbandingan menyatakan bahwa jeritan semacam itu tidak pernah muncul pada masa lampau; 'terjadi' menangkap arti kontekstual היה secara idiomatis.
- source_word: וְכָמֹהוּ לֹא תֹסִף
  choice: dan tidak akan pernah terjadi lagi
  rationale: Dalam konstruksi negatif ini, יסף menyatakan tidak terulangnya peristiwa tersebut. 'Tidak akan pernah terjadi lagi' menyampaikan sifat mutlak perbandingan.
