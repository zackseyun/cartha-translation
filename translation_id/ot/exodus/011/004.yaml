  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה כֹּ֖ה אָמַ֣ר יְהוָ֑ה כַּ/חֲצֹ֣ת הַ/לַּ֔יְלָה אֲנִ֥י יוֹצֵ֖א בְּ/ת֥וֹךְ מִצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/004.yaml
  text: 'Then Moses said[a], “Thus says Yahweh: About midnight I will go out into the midst of Egypt.”'
translation:
  language: id
  text: 'Lalu Musa berkata, “Beginilah firman Yahweh: Sekitar tengah malam Aku akan keluar ke tengah-tengah Mesir.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Waw-konsekutif melanjutkan alur cerita; “lalu” menyampaikan urutan peristiwa secara alami dalam bahasa Indonesia modern.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk baku nama tokoh ini dalam bahasa Indonesia.
- source_word: כֹּה אָמַר
  choice: Beginilah firman
  rationale: Ungkapan ini mempertahankan rumusan utusan ilahi dengan gaya Indonesia yang wajar dan khidmat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dialihaksarakan, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: כַּחֲצֹת הַלַּיְלָה
  choice: Sekitar tengah malam
  rationale: Prefiks כ dapat menyatakan perkiraan; “sekitar” mempertahankan nuansa tersebut tanpa menyatakan waktu yang terlalu tepat.
- source_word: אֲנִי
  choice: Aku
  rationale: Pronomina orang pertama yang eksplisit dipertahankan untuk membawa penekanan dalam perkataan ilahi.
- source_word: יוֹצֵא
  choice: akan keluar
  rationale: Partisipel ini dalam konteks pengumuman tindakan yang segera terjadi memiliki daya futur atau imminen.
- source_word: בְּתוֹךְ
  choice: ke tengah-tengah
  rationale: Pilihan ini menyampaikan gerak menuju bagian dalam atau lingkungan Mesir, bukan sekadar lokasi statis.
- source_word: מִצְרָיִם
  choice: Mesir
  rationale: Nama tempat baku dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama ilahi; “Yahweh” mempertahankannya sebagai nama, bukan menggantinya dengan gelar.
- issue: Nuansa waktu dalam כַּחֲצֹת הַלַּיְלָה
  choice: Sekitar tengah malam
  alternative: Pada tengah malam
  rationale: Prefiks כ secara wajar dapat menandai perkiraan. Pilihan ini mempertahankan ketidakpastian temporal yang benar-benar terdapat dalam bentuk Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Rumusan “Beginilah firman Yahweh” mempertahankan corak deklarasi ilahi, sedangkan susunan kalimat tetap mudah dipahami pembaca umum.
