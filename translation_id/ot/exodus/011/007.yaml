  text: וּ/לְ/כֹ֣ל בְּנֵ֣י יִשְׂרָאֵ֗ל לֹ֤א יֶֽחֱרַץ כֶּ֨לֶב֙ לְשֹׁנ֔/וֹ לְ/מֵ/אִ֖ישׁ וְ/עַד בְּהֵמָ֑ה לְמַ֨עַן֙ תֵּֽדְע֔וּ/ן אֲשֶׁר֙ יַפְלֶ֣ה יְהוָ֔ה בֵּ֥ין מִצְרַ֖יִם וּ/בֵ֥ין יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/011/007.yaml
  text: But against any of the sons of Israel[a], not a dog will sharpen its tongue, from man to beast, so that you may know that Yahweh makes a distinction between Egypt and Israel.
translation:
  language: id
  text: Namun, terhadap seorang pun dari antara orang Israel, tidak seekor anjing pun akan mengasah lidahnya, baik terhadap manusia maupun ternak, supaya kamu mengetahui bahwa Yahweh membedakan antara Mesir dan Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak seekor anjing pun akan mengasah lidahnya.” Atau, “tidak seekor anjing pun akan menggonggong terhadap mereka,” suatu ungkapan yang menggambarkan ketenangan dan keamanan sepenuhnya bagi Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְכֹל בְּנֵי יִשְׂרָאֵל
  choice: Namun, terhadap siapa pun dari antara umat Israel
  rationale: Konjungsi menyatakan pertentangan dengan nasib Mesir pada ayat sebelumnya. Bentuk לְכֹל dalam cakupan penyangkalan paling alami berarti tidak terhadap seorang pun, sedangkan 'umat Israel' menyampaikan sebutan kolektif Ibrani secara wajar dalam bahasa Indonesia.
- source_word: לֹא יֶחֱרַץ כֶּלֶב לְשֹׁנוֹ
  choice: seekor anjing pun tidak akan menjulurkan lidahnya
  rationale: Ungkapan Ibrani secara harfiah menggambarkan anjing menggerakkan atau menajamkan lidahnya. 'Menjulurkan lidahnya' mempertahankan citra jasmaniah tanpa memakai frasa Indonesia yang ganjil seperti 'menajamkan lidah'; makna idiomatisnya dijelaskan dalam catatan kaki.
- source_word: לְמֵאִישׁ וְעַד בְּהֵמָה
  choice: baik terhadap manusia maupun ternak
  rationale: Frasa ini menyatakan cakupan menyeluruh dari manusia sampai hewan. Bentuk korelatif ini alami dalam bahasa Indonesia dan sesuai dengan arah preposisi dalam konteks.
- source_word: לְמַעַן תֵּדְעוּן
  choice: supaya kamu sekalian mengetahui
  rationale: לְמַעַן menandai tujuan. Bentuk verba orang kedua jamak dinyatakan dengan 'kamu sekalian' agar jumlahnya tidak hilang.
- source_word: יַפְלֶה
  choice: membedakan
  rationale: Dalam bentuk Hifil dan konteks ini, verba tersebut berarti membuat pembedaan atau memperlakukan secara berbeda, bukan terutama melakukan keajaiban.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בֵּין מִצְרַיִם וּבֵין יִשְׂרָאֵל
  choice: antara Mesir dan Israel
  rationale: Nama kedua bangsa dipertahankan sesuai bentuk teks Ibrani dan menampilkan kontras kolektifnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung; transliterasi mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Sifat pembedaan dalam יַפְלֶה
  choice: membedakan antara Mesir dan Israel
  alternative: melakukan keajaiban di antara Mesir dan Israel
  rationale: Konteks perlindungan Israel di tengah penghukuman Mesir mendukung arti kausatif 'membedakan', tetapi tidak menambahkan penjelasan teologis tentang dasar pembedaan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. 'Umat Israel' dipilih daripada 'anak-anak Israel' agar tidak disalahpahami sebagai anak kecil. Citra ungkapan tentang lidah anjing dipertahankan dalam bentuk Indonesia yang dapat dipahami, sementara arti idiomatis diberikan dalam catatan kaki.
