base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/016.yaml
  text: So the sons of Israel shall keep the Sabbath[c][b][a], to observe the Sabbath throughout their generations as an everlasting covenant.
translation:
  language: id
  text: Orang Israel[a] harus memelihara hari Sabat itu untuk menjalankan Sabat itu[b] turun-temurun sebagai perjanjian kekal.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Israel”; dapat juga diterjemahkan “keturunan Israel.” Ungkapan ini menunjuk secara kolektif kepada orang Israel.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “melakukan Sabat,” yaitu menaati atau memeliharanya.
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan “sebagai perjanjian abadi” atau “sebagai perjanjian untuk selama-lamanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: harus memelihara
  rationale: Kata שׁמר berarti menjaga, memelihara, atau menaati. Dalam konteks ketetapan perjanjian, “harus memelihara” menyampaikan daya kewajiban bentuk Ibrani secara wajar. Waw penghubung tidak diterjemahkan tersendiri karena hubungan dengan konteks sudah jelas dalam bahasa Indonesia.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah berarti “anak-anak lelaki Israel,” tetapi merupakan sebutan kolektif yang lazim bagi bangsa Israel. “Orang Israel” jelas, alami, dan tidak mempersempit acuannya hanya kepada laki-laki.
- source_word: הַשַּׁבָּת
  choice: hari Sabat
  rationale: Menunjuk pada Sabat sebagai hari dan ketetapan khusus. “Hari Sabat” merupakan padanan baku dan mudah dipahami dalam bahasa Indonesia.
- source_word: לַעֲשׂוֹת אֶת הַשַּׁבָּת
  choice: dengan menjalankan hari Sabat itu
  rationale: Ungkapan Ibrani secara harfiah adalah “melakukan Sabat.” “Menjalankan” menyampaikan makna menaati atau merayakan ketetapan Sabat, sekaligus mempertahankan pengulangan kata “Sabat” dalam teks sumber.
- source_word: לְדֹרֹתָם
  choice: turun-temurun
  rationale: Ungkapan ini menyatakan kesinambungan dalam generasi-generasi mereka. “Turun-temurun” alami dalam bahasa Indonesia dan mempertahankan gagasan keberlangsungan antargenerasi.
- source_word: בְּרִית עוֹלָם
  choice: sebagai perjanjian untuk selama-lamanya
  rationale: בְּרִית berarti “perjanjian,” sedangkan עוֹלָם menyatakan keberlangsungan yang tidak berkesudahan atau tetap. Frasa “untuk selama-lamanya” mempertahankan daya duratifnya tanpa memaksakan penjelasan teologis tambahan.
theological_decisions:
- issue: Sebutan kolektif בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak lelaki Israel; keturunan Israel
  rationale: Bentuk Ibraninya secara gramatikal maskulin dan harfiah bersifat kekeluargaan, tetapi berfungsi sebagai sebutan kolektif bagi bangsa perjanjian. Terjemahan utama memakai ungkapan Indonesia yang alami, sementara bentuk harfiahnya dicatat agar ciri sumber tetap terlihat.
- issue: Jangka waktu בְּרִית עוֹלָם
  choice: perjanjian untuk selama-lamanya
  alternative: perjanjian kekal; perjanjian abadi
  rationale: Pilihan ini mempertahankan bobot perjanjian dan durasi עוֹלָם tanpa menentukan lebih jauh bagaimana keberlakuannya harus dipahami dalam kerangka teologis tertentu.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan “hari Sabat” dipertahankan karena terdapat dalam teks Ibrani, sedangkan idiom “melakukan Sabat” dialihkan menjadi “menjalankan hari Sabat” agar alami. Bentuk “turun-temurun” dipilih daripada “sepanjang generasi-generasi mereka” demi kelancaran tanpa kehilangan makna.
