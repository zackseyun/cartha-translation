  text: mezbah kurban bakaran beserta segala perlengkapannya, dan bejana pembasuhan beserta penyangganya,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: mezbah kurban bakaran
  rationale: Dalam konteks ibadah Kemah Suci, frasa ini menunjuk pada mezbah yang digunakan untuk kurban yang dibakar seluruhnya. 'Mezbah kurban bakaran' ringkas, jelas, dan mempertahankan istilah kultis yang lazim.
- source_word: כָּל כֵּלָיו
  choice: segala perlengkapannya
  rationale: כְּלִי mencakup berbagai perkakas atau benda yang dipakai bersama mezbah; 'perlengkapan' lebih alami dan cukup luas dalam bahasa Indonesia daripada 'perkakas' atau 'bejana'.
- source_word: הַכִּיּוֹר
  choice: bejana pembasuhan
  rationale: Kata ini menunjuk pada wadah air untuk pembasuhan di pelataran Kemah Suci. Terjemahan ini menjelaskan fungsi benda tersebut tanpa memakai istilah arkais.
- source_word: כַּנּוֹ
  choice: penyangganya
  rationale: כֵּן menunjuk pada struktur yang menopang bejana. 'Penyangga' menyatakan fungsi itu secara langsung; 'alas' juga mungkin, tetapi dapat menyiratkan bagian dasar yang menyatu.
- source_word: וְאֶת
  choice: dan
  rationale: Penanda objek langsung tidak diterjemahkan tersendiri; waw penghubung secara alami diterjemahkan 'dan' dalam rangkaian daftar.
