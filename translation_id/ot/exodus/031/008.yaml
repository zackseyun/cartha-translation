translation:
  language: id
  text: juga meja beserta perlengkapannya, kaki pelita yang murni[a] beserta seluruh perlengkapannya, dan mezbah dupa[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '"Murni" dapat menunjuk pada kemurnian ritual dan, dalam konteks Kemah Suci, mungkin juga menggemakan fakta bahwa kaki pelita itu dibuat dari emas murni dalam uraian terkait.'
    reason: cultural_note
  - marker: b
    text: Atau "mezbah pembakaran dupa."
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: meja
  rationale: Kata Ibrani ini secara langsung berarti meja. Konteks Kemah Suci menjelaskan meja mana yang dimaksud tanpa perlu menambahkan sebutan yang tidak terdapat dalam ayat ini.
- source_word: כֵּלָיו
  choice: perlengkapannya
  rationale: כְּלִי mencakup berbagai perkakas, wadah, atau benda pendukung. Dalam bahasa Indonesia, 'perlengkapannya' alami dan cukup luas untuk benda-benda pelayanan yang menyertai meja.
- source_word: הַמְּנֹרָה
  choice: kaki pelita
  rationale: מְנוֹרָה menunjuk pada penyangga lampu di tempat kudus. 'Kaki pelita' menerjemahkan nomina umum tersebut dengan istilah Indonesia yang lazim, bukan mentransliterasikannya sebagai 'menorah'.
- source_word: הַטְּהֹרָה
  choice: yang murni
  rationale: טָהוֹר dapat berarti bersih atau murni. Dalam konteks perlengkapan Kemah Suci, 'murni' mempertahankan nuansa kesucian ritual dan kemungkinan gaung bahan emas murni tanpa secara tegas membatasi maknanya pada bahan.
- source_word: כָּל כֵּלֶיהָ
  choice: seluruh perlengkapannya
  rationale: כָּל menyatakan keseluruhan, sedangkan כֵּלֶיהָ menunjuk pada perkakas yang menyertai kaki pelita. 'Seluruh perlengkapannya' mempertahankan cakupan lengkap itu.
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: mezbah dupa
  rationale: Rangkaian konstruksi ini berarti mezbah untuk dupa atau mezbah dupa. Bentuk 'mezbah dupa' ringkas, alami, dan lazim dalam bahasa Indonesia Alkitabiah.
- source_word: וְאֶת
  choice: juga / dan
  rationale: אֵת adalah penanda objek langsung dan tidak perlu diterjemahkan. Konjungsi וְ dipertahankan sesuai struktur daftar dengan 'juga' pada awal kutipan ayat dan 'dan' sebelum unsur terakhir.
theological_decisions:
- issue: Makna הַטְּהֹרָה pada kaki pelita
  choice: yang murni
  alternative: yang tahir / yang terbuat dari emas murni
  rationale: '''Yang murni'' menjaga keluasan makna Ibrani antara kemurnian ritual dan kaitannya dengan emas murni. Menambahkan ''terbuat dari emas'' akan memperjelas berdasarkan konteks lain, tetapi melampaui bunyi ayat ini.'
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Struktur daftar Ibrani dipertahankan, sedangkan penanda objek langsung tidak diterjemahkan. 'Perlengkapan' dipilih daripada 'perkakas' atau 'bejana' agar cukup luas bagi berbagai benda pelayanan. Semua penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskan.
