  text: and the finely woven garments[a], and the holy garments for Aaron the priest, and the garments of his sons for serving as priests,
translation:
  language: id
  text: dan pakaian yang ditenun dengan halus[a], pakaian kudus untuk Harun, sang imam, dan pakaian putra-putranya untuk melayani sebagai imam,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pakaian untuk pelayanan,” “pakaian dinas,” atau “pakaian tenunan.” Istilah Ibrani בִּגְדֵי הַשְּׂרָד sulit dipastikan dan mungkin menekankan cara pembuatannya atau penggunaannya dalam pelayanan di Kemah Suci.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי הַשְּׂרָד
  choice: pakaian yang ditenun dengan halus
  rationale: בִּגְדֵי berarti 'pakaian', sedangkan הַשְּׂרָד merupakan istilah sulit yang mungkin menunjuk pada pengerjaan tenun khusus atau pada fungsi pelayanan. Pilihan ini menyampaikan kemungkinan nuansa pengerjaan tanpa menutup alternatif dalam catatan kaki.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: pakaian kudus
  rationale: Ungkapan ini secara harfiah berarti 'pakaian kekudusan/pakaian kudus'. 'Pakaian kudus' langsung, wajar, dan sesuai dengan konteks pengudusan bagi pelayanan imam.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: untuk Harun, sang imam
  rationale: Preposisi לְ menandai peruntukan bagi Harun, dan הַכֹּהֵן adalah gelar aposisional. Koma memperjelas bahwa 'sang imam' menerangkan Harun.
- source_word: בִּגְדֵי בָנָיו
  choice: pakaian anak-anaknya
  rationale: Frasa konstruksi dengan sufiks orang ketiga tunggal maskulin merujuk kepada anak-anak Harun. Bentuk Indonesia ini ringkas dan jelas dalam konteks.
- source_word: לְכַהֵן
  choice: untuk melayani sebagai imam
  rationale: Infinitif כהן berarti menjalankan tugas atau jabatan imam. Terjemahan ini alami dalam bahasa Indonesia dan mempertahankan fungsi keimaman tanpa menambahkan gagasan denominatif.
- source_word: וְאֵת / וְאֶת
  choice: dan
  rationale: Penanda objek אֵת tidak memiliki padanan tersendiri dalam bahasa Indonesia; konjungsi וְ diterjemahkan 'dan' untuk mempertahankan susunan daftar yang berlanjut dari ayat sebelumnya.
