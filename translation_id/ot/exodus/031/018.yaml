base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/018.yaml
  text: And when he finished speaking with him on Mount Sinai[a], he gave Moses the two tablets of the testimony, tablets of stone, written with the finger of God.
translation:
  language: id
  text: Ketika Allah selesai berbicara dengan Musa di Gunung Sinai, Ia memberikan kepada Musa kedua loh kesaksian, yaitu loh-loh batu yang ditulisi dengan jari Allah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “oleh jari Allah.” Ungkapan Ibrani ini dengan jelas menegaskan bahwa Allah sendiri yang menulisinya.
    reason: Alternatif fungsi preposisi dan penjelasan ungkapan antropomorfis.
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Ia memberikan
  rationale: Bentuk wayyiqtol dari נתן melanjutkan urutan narasi. Subjek tersirat dijelaskan sebagai Allah berdasarkan konteks dekat, lalu dinyatakan dengan pronomina “Ia” dalam klausa utama.
- source_word: כְּכַלֹּתוֹ לְדַבֵּר
  choice: setelah Allah selesai berbicara
  rationale: כ dengan infinitif konstruk dari כלה menyatakan selesainya tindakan sebagai latar waktu. “Setelah ... selesai berbicara” alami dalam bahasa Indonesia dan mempertahankan urutan waktunya.
- source_word: אִתּוֹ
  choice: dengan Musa
  rationale: Pronomina itu paling wajar merujuk kepada Musa. Penyebutan nama menghindari ketidakjelasan pronomina dalam bahasa Indonesia tanpa mengubah rujukannya.
- source_word: בְּהַר סִינַי
  choice: di Gunung Sinai
  rationale: “Di Gunung Sinai” merupakan ungkapan lokasi yang alami dalam bahasa Indonesia.
- source_word: שְׁנֵי לֻחֹת הָעֵדֻת
  choice: kedua loh Kesaksian
  rationale: לֻחֹת berarti loh, sedangkan עֵדוּת berarti kesaksian dalam konteks perjanjian. Huruf kapital menandai sebutan khusus bagi kesaksian perjanjian tanpa memparafrasekannya sebagai dokumen tertentu.
- source_word: לֻחֹת אֶבֶן
  choice: loh-loh batu
  rationale: Frasa konstruk ini menyatakan bahan loh. Bentuk ulang jamak wajar setelah frasa penjelas “yakni” dan mempertahankan aposisi Ibrani.
- source_word: כְּתֻבִים
  choice: yang ditulisi
  rationale: Partisip pasif dari כתב menyatakan bahwa tulisan dibubuhkan pada loh-loh itu. “Ditulisi” menyampaikan tindakan pasif secara alami dan lebih tepat daripada sekadar menyatakan bahwa loh itu memiliki tulisan.
- source_word: בְּאֶצְבַּע אֱלֹהִים
  choice: dengan jari Allah
  rationale: בְּ menandai alat atau sarana. Terjemahan ini mempertahankan gambaran konkret antropomorfis dan penekanan pada tindakan langsung Allah.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini אֱלֹהִים menunjuk secara tunggal kepada Allah Israel; “Allah” adalah padanan baku dalam bahasa Indonesia.
theological_decisions:
- issue: Ungkapan antropomorfis tentang penulisan ilahi
  choice: dengan jari Allah
  alternative: langsung oleh Allah; dengan kuasa Allah
  rationale: Teks Ibrani memakai gambaran jasmani yang konkret. Terjemahan mempertahankan citra dan ketegangan ungkapan itu, bukan menafsirkannya menjadi pernyataan abstrak tentang kuasa atau tindakan ilahi.
- issue: Identitas subjek tersirat
  choice: Allah
  alternative: Ia
  rationale: Subjek verba tidak disebut dengan nomina dalam ayat ini, tetapi konteks langsung mengidentifikasinya sebagai Allah. Menyebut “Allah” pada anak kalimat pembuka membuat ayat mandiri lebih jelas tanpa memasukkan identitas yang asing dari konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami sambil mempertahankan urutan narasi, aposisi mengenai loh batu, istilah perjanjian “Kesaksian”, serta gambaran “jari Allah”.
