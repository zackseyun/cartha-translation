  text: and the anointing oil[a], and the fragrant incense for the holy place. They shall make them according to all that I have commanded you.
translation:
  language: id
  text: juga minyak urapan dan dupa harum untuk tempat kudus. Mereka harus membuat semuanya sesuai dengan segala yang telah Kuperintahkan kepadamu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: minyak urapan
  rationale: Ungkapan konstruksi ini menunjuk pada minyak yang digunakan untuk mengurapi. 'Minyak urapan' alami dalam bahasa Indonesia dan tidak menambahkan kata 'suci' yang tidak tersurat dalam frasa tersebut.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: dupa harum
  rationale: Frasa ini menunjuk pada dupa yang dibuat dari bahan-bahan aromatik. 'Dupa harum' menyampaikan maknanya secara ringkas dan wajar dalam bahasa Indonesia.
- source_word: לַקֹּדֶשׁ
  choice: untuk tempat kudus
  rationale: Terjemahan ini mempertahankan unsur kekudusan dan kemungkinan acuan spasial dalam konteks Kemah Suci, tanpa mengubahnya menjadi pernyataan yang semata-mata mengenai penggunaan sakral.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִךָ
  choice: sesuai dengan segala yang telah Kuperintahkan kepadamu
  rationale: Pilihan ini mempertahankan cakupan menyeluruh dari כְּכֹל dan sapaan langsung Allah kepada Musa.
- source_word: יַעֲשׂוּ
  choice: Mereka harus membuat semuanya
  rationale: Bentuk orang ketiga jamak mengacu pada para perajin dalam konteks sebelumnya. 'Harus' sesuai dengan nada perintah, sedangkan 'semuanya' secara alami merangkum benda-benda yang telah didaftarkan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Ayat dimulai dengan 'juga' karena merupakan kelanjutan daftar dari ayat sebelumnya. Kapitalisasi pada 'Kuperintahkan' menandai pembicara ilahi sesuai kebiasaan penerbitan Alkitab Indonesia.
