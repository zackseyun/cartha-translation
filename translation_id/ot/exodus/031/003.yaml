  text: וָ/אֲמַלֵּ֥א אֹת֖/וֹ ר֣וּחַ אֱלֹהִ֑ים בְּ/חָכְמָ֛ה וּ/בִ/תְבוּנָ֥ה וּ/בְ/דַ֖עַת וּ/בְ/כָל מְלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/003.yaml
  text: And I have filled him with the Spirit of God[a], with wisdom, with understanding, with knowledge, and with every kind of craftsmanship,
translation:
  language: id
  text: Aku telah memenuhi dia dengan Roh Allah[a], dengan hikmat, pengertian, pengetahuan, dan segala macam keterampilan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roh Allah” atau “roh ilahi.” Frasa Ibraninya dapat dipahami secara lebih umum, tetapi dalam konteks ini kemungkinan besar menunjuk kepada Roh Allah sendiri yang memberi kemampuan.
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֲמַלֵּא
  choice: Aku telah memenuhi
  rationale: Bentuk verba dari מלא menyatakan tindakan Allah yang telah menganugerahkan kemampuan kepada Bezalel dengan hasil yang tetap berlaku. Dalam bahasa Indonesia, “telah memenuhi” menyampaikan aspek ini secara alami.
- source_word: אֹתוֹ
  choice: dia
  rationale: Pronomina objek ini merujuk langsung kepada Bezalel dalam ayat sebelumnya.
- source_word: רוּחַ אֱלֹהִים
  choice: Roh Allah
  rationale: Frasa konstruksi ini secara leksikal dapat dipahami sebagai Roh Allah, roh Allah, atau roh ilahi. Dalam konteks pemberdayaan langsung oleh Allah untuk pekerjaan Kemah Suci, “Roh Allah” paling sesuai, sementara kemungkinan yang lebih umum dipertahankan dalam catatan kaki.
- source_word: בְּחָכְמָה
  choice: dengan hikmat
  rationale: Preposisi ב menandai karunia atau kemampuan yang menyertai pemenuhan tersebut; “dengan hikmat” alami dan mempertahankan istilah penting חָכְמָה.
- source_word: וּבִתְבוּנָה
  choice: pengertian
  rationale: תבונה mencakup pengertian, kecakapan memahami, atau wawasan. “Pengertian” menjaga rangkaian hikmat, pengertian, dan pengetahuan secara jelas.
- source_word: וּבְדַעַת
  choice: pengetahuan
  rationale: דעת lazim berarti pengetahuan; pilihan ini ringkas dan mempertahankan pola tiga serangkai dalam teks sumber.
- source_word: וּבְכָל מְלָאכָה
  choice: segala macam keterampilan
  rationale: Dalam konteks pembuatan perlengkapan Kemah Suci, מלאכה menunjuk pada pekerjaan terampil atau keahlian. “Segala macam keterampilan” mengungkapkan כל dengan idiom Indonesia yang alami tanpa membatasinya pada satu jenis kerajinan.
theological_decisions:
- issue: Apakah רוּחַ אֱלֹהִים dipahami secara khusus sebagai Roh milik Allah atau secara lebih umum sebagai roh ilahi
  choice: Roh Allah
  alternative: roh Allah; roh ilahi
  rationale: Konteksnya menggambarkan Allah sendiri memperlengkapi Bezalel untuk pelayanan kudus, sehingga “Roh Allah” merupakan bacaan utama yang paling mungkin. Namun, konstruksi Ibraninya tidak dengan sendirinya memaksakan seluruh ketepatan doktrinal yang berkembang kemudian; karena itu, kemungkinan bacaan yang lebih umum dicatat tanpa disingkirkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Rangkaian nomina dibuat ringkas dengan satu preposisi “dengan” yang menaungi daftar berikutnya; kapitalisasi “Roh” menunjukkan bacaan utama tanpa menghapus ambiguitas sumber, yang dijelaskan dalam catatan kaki.
