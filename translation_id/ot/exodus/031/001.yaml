lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kemudian ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi. “Kemudian” menyatakan kesinambungan itu secara wajar, sedangkan “berfirman” merupakan padanan Indonesia yang alami dan bermartabat ketika Allah menjadi subjek.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks sumber tetap tampak dan tidak diganti dengan gelar.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak yang menjadi tujuan tuturan; “kepada Musa” adalah ungkapan Indonesia yang tepat.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Nama tokoh digunakan dalam bentuk baku bahasa Indonesia.
- source_word: לֵאמֹר
  choice: ditandai dengan koma menuju ucapan berikutnya
  rationale: Infinitif ini memperkenalkan isi firman. Dalam bahasa Indonesia modern, fungsi tersebut paling alami disampaikan dengan verba “berfirman” dan tanda koma, tanpa menambahkan “demikian” yang tidak wajib secara leksikal.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama YHWH secara langsung. “Yahweh” mempertahankan nama itu, sementara tradisi Indonesia lazim memakai pengganti berupa gelar “TUHAN”; alternatif tersebut dicatat agar pembaca mengenali konvensi tradisional.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Berfirman” dipilih sebagai ungkapan lazim bagi tuturan Allah. Rumus לֵאמֹר tidak diterjemahkan secara kaku karena koma secara alami mengantar langsung kepada isi ucapan pada ayat berikutnya.
