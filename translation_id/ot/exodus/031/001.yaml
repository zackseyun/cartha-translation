  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: id
  text: Kemudian Yahweh berfirman kepada Musa:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani YHWH, yang secara tradisional diterjemahkan “TUHAN”.
