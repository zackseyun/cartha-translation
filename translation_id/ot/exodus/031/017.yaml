  text: בֵּינִ֗/י וּ/בֵין֙ בְּנֵ֣י יִשְׂרָאֵ֔ל א֥וֹת הִ֖וא לְ/עֹלָ֑ם כִּי שֵׁ֣שֶׁת יָמִ֗ים עָשָׂ֤ה יְהוָה֙ אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֔רֶץ וּ/בַ/יּוֹם֙ הַ/שְּׁבִיעִ֔י שָׁבַ֖ת וַ/יִּנָּפַֽשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/017.yaml
  text: It is a sign forever between me and the sons of Israel[a], for in six days Yahweh made the heavens and the earth[c][b], and on the seventh day he ceased and was refreshed.
translation:
  language: id
  text: Itulah tanda untuk selama-lamanya antara Aku dan bani Israel[a], sebab dalam enam hari Yahweh menjadikan langit dan bumi, dan pada hari ketujuh Ia berhenti[b] dan mendapat kesegaran[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “orang Israel” atau “keturunan Israel.” Secara harfiah: “anak-anak lelaki Israel.”'
    reason: lexical_alternative
  - marker: b
    text: Atau “beristirahat”; arti dasar kata Ibraninya ialah “berhenti.”
    reason: lexical_alternative
  - marker: c
    text: Atau “mengambil napas” atau “menyegarkan diri”; bahasa Ibrani memakai gambaran antropomorfis yang hidup.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּינִי וּבֵין
  choice: antara Aku dan
  rationale: Ungkapan korelatif Ibrani ini paling wajar dinyatakan dengan satu kata depan “antara” dalam bahasa Indonesia.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: “Bani Israel” mempertahankan gambaran kekerabatan dalam teks Ibrani dan tetap dikenal dalam bahasa Indonesia; alternatif yang lebih idiomatis dicatat dalam catatan kaki.
- source_word: אוֹת
  choice: tanda
  rationale: “Tanda” merupakan padanan alami bagi penanda yang meneguhkan hubungan perjanjian.
- source_word: לְעֹלָם
  choice: untuk selama-lamanya
  rationale: Padanan ini menyampaikan keberlangsungan tanpa batas yang dinyatakan oleh לְעֹלָם.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan dasar bagi Sabat sebagai tanda.
- source_word: שֵׁשֶׁת יָמִים
  choice: dalam enam hari
  rationale: Frasa ini menyatakan kerangka waktu tindakan penciptaan dan terdengar alami dalam bahasa Indonesia.
- source_word: עָשָׂה
  choice: menjadikan
  rationale: Dalam konteks penciptaan langit dan bumi, “menjadikan” menyampaikan tindakan menghasilkan atau membentuk dengan baik.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transliterasi ini mempertahankan nama ilahi yang terdapat dalam teks sumber.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: langit dan bumi
  rationale: Ungkapan baku bahasa Indonesia ini mempertahankan merisme Ibrani bagi seluruh tatanan ciptaan.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: tetapi pada hari ketujuh
  rationale: Kata “tetapi” mengungkapkan peralihan kontras dari enam hari berkarya kepada hari ketujuh ketika karya itu dihentikan; waw Ibrani mengizinkan nuansa kontekstual ini.
- source_word: שָׁבַת
  choice: berhenti
  rationale: Makna dasar verba ini ialah berhenti atau menghentikan kegiatan; pilihan ini tidak terlebih dahulu menafsirkan tindakan itu sebagai pemulihan dari kelelahan.
- source_word: וַיִּנָּפַשׁ
  choice: menyegarkan diri
  rationale: Ungkapan ini mempertahankan bahasa antropomorfis yang hidup sekaligus terdengar wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Gambaran antropomorfis tentang Allah dalam bahasa Sabat
  choice: Ia berhenti dan menyegarkan diri
  alternative: Ia beristirahat dan mendapat kesegaran; Ia berhenti dan mengambil napas
  rationale: Teks Ibrani dengan sengaja memakai bahasa yang menyerupakan tindakan Allah dengan pengalaman manusia. Terjemahan mempertahankan ketegangan itu dan tidak mengubahnya menjadi pernyataan abstrak atau menghapusnya karena pertimbangan teologis.
- issue: Penerjemahan בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: orang Israel; keturunan Israel; anak-anak Israel
  rationale: Pilihan ini menjaga ungkapan kekerabatan kolektif dalam teks sumber tanpa memberi kesan bahwa yang dimaksud hanya anak-anak secara usia.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Nama diri dalam teks Ibrani dipertahankan melalui transliterasi yang lazim dan jelas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Bani Israel” dipilih karena ringkas serta mempertahankan nuansa kekerabatan kolektif, dengan bentuk yang lebih umum diberikan dalam catatan kaki. Kapitalisasi “Aku” dan “Ia” menandai rujukan kepada Allah sesuai kebiasaan ejaan rohani bahasa Indonesia.
