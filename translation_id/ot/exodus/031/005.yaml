lexical_decisions:
- source_word: וּבַחֲרֹשֶׁת
  choice: dalam mengukir / dalam memahat
  rationale: 'Nomina ini menunjuk pada pengerjaan terampil. Padanan dibedakan menurut bahannya: batu diukir dan kayu dipahat, sehingga kegiatan konkretnya jelas dan pengulangan Ibraninya tetap tercermin.'
- source_word: אֶבֶן
  choice: batu
  rationale: Kata Ibrani ini merupakan istilah umum untuk batu. Konteks Kemah Suci mungkin mencakup batu permata, tetapi ayat ini sendiri tidak mempersempit maknanya.
- source_word: לְמַלֹּאת
  choice: untuk dipasang
  rationale: Dalam konteks kerajinan, bentuk infinitif ini menunjuk pada pemasangan batu ke dalam tatahan atau dudukannya. Bentuk pasif ini alami dalam bahasa Indonesia dan tidak memaksakan jenis pemasangan tertentu.
- source_word: עֵץ
  choice: kayu
  rationale: Padanan umum dan alami untuk bahan yang dikerjakan.
- source_word: לַעֲשׂוֹת
  choice: untuk mengerjakan
  rationale: Kata עשה bersifat luas. Dalam gabungan dengan מְלָאכָה, 'mengerjakan' lebih alami daripada 'melakukan' serta tetap mencakup pembuatan dan pelaksanaan kerja.
- source_word: בְּכָל מְלָאכָה
  choice: segala macam pekerjaan
  rationale: Ungkapan ini menyatakan cakupan menyeluruh. Konteksnya menunjukkan pekerjaan terampil, tetapi terjemahan tidak mempersempit istilah umum dalam teks.
