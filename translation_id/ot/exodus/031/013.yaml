id: EXO.31.13
reference: Exodus 31:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אַתָּ֞ה דַּבֵּ֨ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר אַ֥ךְ אֶת שַׁבְּתֹתַ֖/י תִּשְׁמֹ֑רוּ כִּי֩ א֨וֹת הִ֜וא בֵּינִ֤/י וּ/בֵֽינֵי/כֶם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם לָ/דַ֕עַת כִּ֛י אֲנִ֥י יְהוָ֖ה מְקַדִּשְׁ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/013.yaml
  text: And you[a], speak to the sons of Israel, saying, ‘Surely you shall keep my Sabbaths, for it is a sign between me and you throughout your generations[c][b], so that you may know that I am Yahweh who sanctifies you.’
translation:
  language: id
  text: Engkau sendiri harus berbicara kepada umat Israel[b] dengan mengatakan, “Namun,[a] hari-hari Sabat-Ku harus kamu pelihara, sebab itu adalah tanda antara Aku dan kamu turun-temurun, supaya kamu mengetahui bahwa Akulah Yahweh yang menguduskan kamu.[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Sungguh” atau “Hanya saja.” Partikel Ibrani אַךְ dapat menyatakan pembatasan, kontras, atau penegasan kuat.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak-anak lelaki Israel”; ungkapan Ibrani yang lazim untuk umat Israel secara keseluruhan.
    reason: lexical_alternative
  - marker: c
    text: Atau “yang menjadikan kamu kudus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Engkau sendiri
  rationale: Pronomina yang dikedepankan memberi penekanan dan menandai peralihan dari petunjuk sebelumnya; “Engkau sendiri” mempertahankan penekanan itu secara wajar dalam bahasa Indonesia.
- source_word: דַּבֵּר ... לֵאמֹר
  choice: harus berbicara ... dengan mengatakan
  rationale: Bentuk imperatif dipertahankan sebagai perintah yang tegas, sedangkan לֵאמֹר diperlihatkan sebagai pengantar kutipan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  rationale: Ungkapan ini merupakan sebutan korporat baku bagi bangsa Israel. “Umat Israel” alami dan jelas bagi pembaca Indonesia, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: אַךְ
  choice: Namun
  rationale: Partikel ini dapat menyatakan pembatasan, kontras, atau penegasan. Dalam konteks perintah pembangunan Kemah Suci, “Namun” menonjolkan kewajiban Sabat yang tetap berlaku tanpa menutup nuansa lain, yang dicatat dalam catatan kaki.
- source_word: שַׁבְּתֹתַי
  choice: hari-hari Sabat-Ku
  rationale: Bentuk jamak Ibrani dipertahankan secara eksplisit dan alami dalam bahasa Indonesia.
- source_word: תִּשְׁמֹרוּ
  choice: harus kamu pelihara
  rationale: שׁמר dalam konteks perintah perjanjian berarti menjaga atau menaati suatu ketetapan. “Pelihara” mempertahankan nuansa penjagaan dan ketaatan.
- source_word: אוֹת
  choice: tanda
  rationale: “Tanda” merupakan padanan langsung dan wajar bagi lambang hubungan perjanjian yang dimaksud.
- source_word: בֵּינִי וּבֵינֵיכֶם
  choice: antara Aku dan kamu
  rationale: Mempertahankan struktur relasional teks sumber; “kamu” mengacu secara kolektif kepada umat Israel.
- source_word: לְדֹרֹתֵיכֶם
  choice: turun-temurun
  rationale: Ungkapan ini secara idiomatis menyatakan keberlangsungan sepanjang generasi-generasi umat Israel.
- source_word: לָדַעַת
  choice: supaya kamu mengetahui
  rationale: Infinitif berawalan לְ di sini menyatakan tujuan, yang diterjemahkan secara jelas dengan “supaya”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: מְקַדִּשְׁכֶם
  choice: yang menguduskan kamu
  rationale: Partisipel ini menyatakan Yahweh sebagai Dia yang menguduskan umat-Nya; alternatif idiomatisnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama perjanjian ilahi secara langsung. Transliterasi “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Cakupan sebutan בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  alternative: anak-anak lelaki Israel; orang Israel
  rationale: Dalam konteks ini ungkapan tersebut berfungsi sebagai sebutan korporat bagi umat perjanjian secara keseluruhan. Pilihan ini tidak membatasi perintah hanya kepada laki-laki, sementara bentuk harfiah tetap tersedia dalam catatan kaki.
- issue: Makna tindakan ilahi מְקַדִּשְׁכֶם
  choice: yang menguduskan kamu
  alternative: yang menjadikan kamu kudus
  rationale: “Menguduskan” mempertahankan istilah teologis sumber tanpa menentukan secara lebih sempit cara atau tahap pengudusan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pada kata ganti yang merujuk kepada Allah serta “Sabat-Ku” mengikuti gaya penerbitan religius Indonesia. Bentuk jamak Sabat dipertahankan sebagai “hari-hari Sabat,” dan ambiguitas אַךְ tidak diselesaikan secara diam-diam, melainkan dijelaskan dalam catatan kaki.
