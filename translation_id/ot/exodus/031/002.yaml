  text: רְאֵ֖ה קָרָ֣אתִֽי בְ/שֵׁ֑ם בְּצַלְאֵ֛ל בֶּן אוּרִ֥י בֶן ח֖וּר לְ/מַטֵּ֥ה יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/002.yaml
  text: See[a], I have called by name Bezalel son of Uri, son of Hur, of the tribe of Judah.
translation:
  language: id
  text: “Lihatlah, Aku telah memanggil Bezalel dengan menyebut namanya[a], anak Uri, anak Hur, dari suku Yehuda.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “secara khusus.” Secara harfiah, “dengan nama”; ungkapan Ibrani ini dapat menunjukkan penunjukan seseorang secara pribadi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Lihatlah
  rationale: Bentuk imperatif ini menarik perhatian pendengar. “Lihatlah” mempertahankan kelangsungan dan fungsi wacananya dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: קָרָאתִי
  choice: Aku telah memanggil
  rationale: Bentuk qal perfek orang pertama tunggal dari קרא. Pilihan “memanggil” menerjemahkan verba secara langsung tanpa memasukkan secara eksplisit gagasan “mengangkat” yang hanya tersirat dari konteks.
- source_word: בְשֵׁם
  choice: dengan namanya
  rationale: Ungkapan קרא בשם menunjuk pada pemanggilan seseorang secara khusus dan pribadi. “Dengan namanya” mempertahankan idiom Ibrani dengan bentuk yang cukup alami dalam bahasa Indonesia.
- source_word: בְּצַלְאֵל
  choice: Bezalel
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בֶּן
  choice: anak
  rationale: Dalam rumusan silsilah langsung ini, בן paling wajar berarti “anak”; pilihan ini juga mempertahankan pengulangan struktur sumber.
- source_word: אוּרִי
  choice: Uri
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim.
- source_word: חוּר
  choice: Hur
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim.
- source_word: לְמַטֵּה
  choice: dari suku
  rationale: מַטֶּה dalam konteks identitas genealogis berarti “suku”, sedangkan prefiks ל menandai afiliasi. “Dari suku” menyampaikan hubungan keanggotaan secara alami.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Nama suku ditransliterasikan dalam bentuk Indonesia yang lazim dan dekat dengan nama Ibraninya.
theological_decisions:
- issue: Nuansa ilahi dalam ungkapan “memanggil dengan nama”
  choice: memanggil dengan namanya
  alternative: menunjuk secara khusus
  rationale: Teks menyatakan tindakan pemanggilan atau penetapan pribadi oleh Allah, tetapi tidak menjelaskan seluruh muatan teologisnya. Terjemahan mempertahankan idiom tersebut dan tidak mempersempitnya menjadi pengangkatan jabatan saja.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Aku” memakai huruf kapital karena merujuk kepada Allah. Susunan identitas Bezalel dipertahankan dekat dengan struktur Ibrani, sementara “dari suku Yehuda” dibuat idiomatis dalam bahasa Indonesia.
