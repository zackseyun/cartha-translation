  text: שֵׁ֣שֶׁת יָמִים֮ יֵעָשֶׂ֣ה מְלָאכָה֒ וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֗י שַׁבַּ֧ת שַׁבָּת֛וֹן קֹ֖דֶשׁ לַ/יהוָ֑ה כָּל הָ/עֹשֶׂ֧ה מְלָאכָ֛ה בְּ/י֥וֹם הַ/שַּׁבָּ֖ת מ֥וֹת יוּמָֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/015.yaml
  text: Work may be done for six days[a], but on the seventh day there is a Sabbath of complete rest, holy to Yahweh. Whoever does work on the Sabbath day shall surely be put to death.
translation:
  language: id
  text: Enam hari lamanya pekerjaan boleh dilakukan, tetapi hari ketujuh adalah Sabat, hari perhentian penuh yang kudus bagi Yahweh[a]. Siapa pun yang melakukan pekerjaan pada hari Sabat pasti dihukum mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sabat, suatu perhentian khidmat.” Ungkapan Ibraninya menegaskan gagasan berhenti atau beristirahat sepenuhnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵעָשֶׂה מְלָאכָה
  choice: pekerjaan boleh dilakukan
  rationale: Bentuk Nifal menyatakan tindakan pasif, sedangkan konteks hukum mendukung nuansa izin tanpa mengubahnya menjadi prediksi masa depan.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: tetapi pada hari ketujuh
  rationale: Waw secara harfiah dapat berarti 'dan', tetapi di sini menandai kontras nyata antara enam hari kerja dan hari ketujuh.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: Sabat perhentian penuh
  rationale: Ungkapan ini mempertahankan istilah 'Sabat' dan menyampaikan penguatan gagasan berhenti atau beristirahat dalam שַׁבָּתוֹן.
- source_word: קֹדֶשׁ לַיהוָה
  choice: yang kudus bagi Yahweh
  rationale: קֹדֶשׁ menyatakan status kudus, dan ל menunjukkan bahwa hari itu dikhususkan bagi Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sesuai bentuk nama perjanjian dalam teks sumber.
- source_word: כָּל הָעֹשֶׂה מְלָאכָה
  choice: Siapa pun yang melakukan pekerjaan
  rationale: Konstruksi partisipial dengan כָּל membentuk kategori hukum yang berlaku umum.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: pada hari Sabat
  rationale: Kata 'hari' dipertahankan karena יוֹם disebutkan secara eksplisit dalam bahasa Ibrani.
- source_word: מוֹת יוּמָת
  choice: harus dihukum mati
  rationale: Infinitif absolut bersama bentuk Hofal menguatkan kepastian hukuman dan menunjukkan tindakan pasif, yakni orang itu dijatuhi hukuman mati, bukan sekadar akan mati.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. Bentuk 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Kekuatan istilah Sabat dalam שַׁבַּת שַׁבָּתוֹן
  choice: Sabat perhentian penuh
  alternative: Sabat, suatu perhentian khidmat; perhentian sepenuhnya
  rationale: Pilihan ini mempertahankan kata 'Sabat' sekaligus intensifikasi tentang berhenti atau beristirahat, tanpa memasukkan rumusan doktrinal yang lebih kemudian.
- issue: Daya hukum מוֹת יוּמָת
  choice: harus dihukum mati
  alternative: pasti dihukum mati; harus benar-benar dihukum mati
  rationale: Bahasa Indonesia 'harus dihukum mati' menyatakan ketentuan hukuman dengan jelas, sementara bentuk pasif sumber tetap dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang lugas dan bermartabat. 'Pekerjaan boleh dilakukan' mempertahankan bentuk pasif sumber; 'perhentian penuh' menyampaikan intensifikasi Ibrani secara wajar. Penanda catatan kaki [a] ditempatkan tepat setelah ungkapan yang dijelaskannya.
