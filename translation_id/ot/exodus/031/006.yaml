language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/אֲנִ֞י הִנֵּ֧ה נָתַ֣תִּי אִתּ֗/וֹ אֵ֣ת אָהֳלִיאָ֞ב בֶּן אֲחִֽיסָמָךְ֙ לְ/מַטֵּה דָ֔ן וּ/בְ/לֵ֥ב כָּל חֲכַם לֵ֖ב נָתַ֣תִּי חָכְמָ֑ה וְ/עָשׂ֕וּ אֵ֖ת כָּל אֲשֶׁ֥ר צִוִּיתִֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/006.yaml
  text: And behold[a], I have appointed with him Oholiab son of Ahisamach, of the tribe of Dan; and in the heart of everyone wise of heart I have put wisdom[b], that they may make all that I have commanded you.
translation:
  language: id
  text: Dan lihat, Aku sendiri telah menetapkan Aholiab anak Ahisamakh, dari suku Dan, sebagai pendampingnya. Dalam hati setiap orang yang bijaksana hatinya telah Kuberikan hikmat[a], supaya mereka membuat segala sesuatu yang telah Kuperintahkan kepadamu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam konteks ini, “hikmat” mencakup kecakapan dan keahlian dalam membuat perlengkapan Kemah Suci.
    reason: cultural_note
  - marker: b
    text: Atau, secara lebih harfiah, “dan mereka akan membuat segala sesuatu yang telah Kuperintahkan kepadamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי הִנֵּה
  choice: Dan Aku sendiri, lihatlah,
  rationale: Kata ganti mandiri וַאֲנִי diberi tekanan melalui “Aku sendiri”, sedangkan הִנֵּה dipertahankan sebagai seruan penarik perhatian “lihatlah”.
- source_word: נָתַתִּי אִתּוֹ
  choice: telah menetapkan ... untuk mendampinginya
  rationale: נתן secara harfiah berarti memberi atau menempatkan, tetapi dalam konteks penugasan ini menyatakan penetapan Aholiab bersama Bezaleel; “mendampinginya” menyampaikan אִתּוֹ secara alami.
- source_word: אָהֳלִיאָב בֶּן אֲחִיסָמָךְ
  choice: Aholiab anak Ahisamakh
  rationale: Nama-nama diri ditransliterasikan dalam bentuk yang lazim dan relasi genealogis בֶּן diterjemahkan “anak”.
- source_word: לְמַטֵּה דָן
  choice: dari suku Dan
  rationale: מַטֶּה di sini menunjukkan afiliasi kesukuan; “dari suku Dan” alami dalam bahasa Indonesia.
- source_word: וּבְלֵב כָּל חֲכַם לֵב
  choice: Ke dalam hati setiap orang yang bijaksana hatinya
  rationale: Terjemahan ini mempertahankan pengulangan לֵב dan antropologi Ibrani yang memandang hati sebagai pusat pengertian dan kecakapan, sambil tetap dapat dipahami dalam bahasa Indonesia.
- source_word: נָתַתִּי חָכְמָה
  choice: telah Kuberikan hikmat
  rationale: “Hikmat” mempertahankan hubungan leksikal חָכְמָה dan mencakup kecakapan praktis para pengrajin dalam konteks ini.
- source_word: וְעָשׂוּ
  choice: supaya mereka membuat
  rationale: Bentuk ini menyampaikan hubungan tujuan atau hasil antara pemberian hikmat oleh Allah dan pekerjaan yang dilakukan para perajin.
- source_word: אֵת כָּל אֲשֶׁר צִוִּיתִךָ
  choice: segala sesuatu yang telah Kuperintahkan kepadamu
  rationale: Menyampaikan cakupan total frasa Ibrani dan relevansi berkelanjutan dari perintah yang telah diberikan kepada Musa.
theological_decisions:
- issue: Makna idiom חֲכַם לֵב dalam konteks pekerjaan Kemah Suci
  choice: bijaksana hatinya / hikmat
  alternative: terampil / keterampilan
  rationale: Konteksnya jelas mencakup kecakapan kerajinan, tetapi mempertahankan “hati” dan “hikmat” menjaga konsep Ibrani bahwa kecakapan praktis merupakan hikmat pemberian Allah, tanpa mempersempitnya menjadi kemampuan teknis saja.
- issue: Daya וְעָשׂוּ sesudah pemberian hikmat
  choice: supaya mereka membuat
  alternative: dan mereka harus/akan membuat
  rationale: '“Supaya” mempertahankan kemungkinan hubungan tujuan atau hasil: Allah memberi hikmat agar pekerjaan yang diperintahkan dapat dilaksanakan.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “Aku/Ku” mengikuti tuturan langsung Allah. Ungkapan “bijaksana hatinya” sengaja mempertahankan idiom Ibrani, dengan catatan kaki untuk menjelaskan cakupan praktisnya.
