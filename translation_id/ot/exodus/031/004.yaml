lexical_decisions:
- source_word: לַחְשֹׁב מַחֲשָׁבֹת
  choice: untuk merancang berbagai rancangan artistik
  rationale: Gabungan kata kerja חשׁב dan nomina serumpunnya menunjuk pada perencanaan kreatif yang terampil dalam konteks pengerjaan Kemah Suci. Ungkapan ini mempertahankan penekanan sumber pada tindakan merancang sekaligus hasil rancangannya, meskipun pengulangan akar Ibraninya tidak dapat ditiru sepenuhnya secara alami.
- source_word: לַעֲשׂוֹת
  choice: serta mengerjakan
  rationale: Dalam rangkaian ini, עשה menunjuk pada pelaksanaan keterampilan dengan bahan-bahan logam. 'Mengerjakan' lebih tepat dan alami daripada 'melakukan' serta tidak membatasi makna pada pembuatan satu benda tertentu.
- source_word: בַּזָּהָב וּבַכֶּסֶף
  choice: emas, perak
  rationale: Preposisi ב menandai bahan yang dikerjakan. Dalam bahasa Indonesia, objek langsung setelah 'mengerjakan' menyampaikan hubungan bahan itu dengan alami tanpa harus mengulang 'dengan' atau 'dalam'.
- source_word: וּבַנְּחֹשֶׁת
  choice: dan perunggu[a]
  rationale: נְחֹשֶׁת dapat berarti tembaga atau perunggu. 'Perunggu' paling sesuai dengan konteks pengerjaan logam untuk Kemah Suci, sementara alternatif leksikalnya dicatat dalam catatan kaki.
