  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֙ אֶת הַ/שַּׁבָּ֔ת כִּ֛י קֹ֥דֶשׁ הִ֖וא לָ/כֶ֑ם מְחַֽלְלֶ֨י/הָ֙ מ֣וֹת יוּמָ֔ת כִּ֗י כָּל הָ/עֹשֶׂ֥ה בָ/הּ֙ מְלָאכָ֔ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/031/014.yaml
  text: You shall keep the Sabbath[a], because it is holy to you. Whoever profanes it shall surely be put to death, for whoever does work on it[b], that person shall be cut off from among his people.
translation:
  language: id
  text: Kalian harus memelihara hari Sabat, sebab hari itu kudus bagi kalian. Siapa pun yang menodainya pasti dihukum mati. Sebab, siapa pun yang melakukan pekerjaan pada hari itu, orang itu harus diputuskan dari tengah-tengah bangsanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang itu harus diputuskan dari tengah-tengah bangsanya.” Ini adalah formula hukum Ibrani yang cara penghukumannya tidak dijelaskan secara khusus di sini.
    reason: Menjelaskan idiom hukum Ibrani sambil mempertahankan ketidakpastian mengenai mekanisme hukumannya.
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Kamu harus memelihara
  rationale: Kata שׁמר dalam konteks hukum perjanjian berarti menjaga atau menaati ketetapan. 'Harus memelihara' alami dalam bahasa Indonesia dan mempertahankan daya perintah bentuk Ibrani.
- source_word: הַשַּׁבָּת
  choice: hari Sabat
  rationale: Padanan baku dan jelas untuk שַׁבָּת; penambahan 'hari' membuat acuannya alami bagi pembaca Indonesia tanpa mengubah makna.
- source_word: קֹדֶשׁ הִוא לָכֶם
  choice: hari itu kudus bagimu
  rationale: Mempertahankan sifat kudus serta nuansa לָכֶם, yakni kudus bagi umat yang disapa.
- source_word: מְחַלְלֶיהָ
  choice: siapa pun yang menodainya
  rationale: Bentuk partisipel Piel dari חלל menunjuk pada orang yang mencemarkan atau menodai kekudusan Sabat. 'Menodai' jelas dan bermartabat dalam bahasa Indonesia.
- source_word: מוֹת יוּמָת
  choice: harus dihukum mati
  rationale: Gabungan infinitif absolut dan verba Hophal menegaskan hukuman mati. 'Harus dihukum mati' menyampaikan kepastian dan sifat pasif-yuridisnya secara alami.
- source_word: כָּל הָעֹשֶׂה בָהּ מְלָאכָה
  choice: siapa pun yang melakukan pekerjaan pada hari itu
  rationale: מְלָאכָה berarti pekerjaan atau kegiatan kerja. Terjemahan ini mempertahankan cakupan umum larangan tanpa menambahkan 'apa pun' yang tidak dinyatakan eksplisit.
- source_word: וְנִכְרְתָה
  choice: harus dilenyapkan
  rationale: Dalam formula hukum-perjanjian, Niphal כרת berarti 'diputuskan' atau 'disingkirkan'. 'Dilenyapkan' mempertahankan bobot ancaman tanpa menentukan mekanisme pelaksanaannya.
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: orang itu
  rationale: Dalam prosa hukum, נֶפֶשׁ menunjuk kepada individu yang bersangkutan, bukan secara khusus unsur nonjasmani manusia.
- source_word: מִקֶּרֶב עַמֶּיהָ
  choice: dari tengah-tengah bangsanya
  rationale: Menyampaikan idiom pemisahan dari komunitas. Akhiran feminin secara gramatikal merujuk pada נֶפֶשׁ, tetapi bahasa Indonesia tidak memerlukan penandaan gender.
theological_decisions:
- issue: Makna formula hukuman וְנִכְרְתָה ... מִקֶּרֶב עַמֶּיהָ
  choice: Mempertahankan formula sebagai 'harus dilenyapkan dari tengah-tengah bangsanya' dan memberi catatan bahwa cara penghukumannya tidak dirinci.
  alternative: harus dikeluarkan dari komunitas; harus dibinasakan oleh penghakiman ilahi
  rationale: Ayat ini tidak memastikan apakah formula tersebut berarti pengucilan, kematian, atau penghakiman ilahi. Terjemahan tidak boleh menyelesaikan ketegangan yang dibiarkan oleh teks.
- issue: Arti נֶפֶשׁ dalam konteks hukum
  choice: orang
  alternative: jiwa
  rationale: Yang dimaksud ialah pelanggar sebagai seorang individu; 'jiwa' dapat memasukkan gagasan antropologis yang tidak dituntut konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'kamu' mempertahankan sapaan jamak Ibrani dalam bentuk Indonesia yang tidak menandai jumlah. Struktur hukum dibuat lugas; istilah 'dilenyapkan' dijelaskan melalui catatan kaki agar ambiguitas formula sumber tetap terjaga.
