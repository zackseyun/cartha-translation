  text: the tent of meeting[a], and the ark of the testimony, and the mercy seat that is on it[b], and all the furnishings of the tent—
translation:
  language: id
  text: Kemah Pertemuan, tabut kesaksian[a], tutup pendamaian yang ada di atasnya[b], dan segala perlengkapan kemah itu—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tabut untuk kesaksian.”
    reason: lexical_alternative
  - marker: b
    text: Secara tradisional, “takhta belas kasihan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Ungkapan baku dan wajar untuk kemah tempat TUHAN bertemu dengan Israel; tetap dekat dengan konstruksi Ibrani.
- source_word: הָאָרֹן לָעֵדֻת
  choice: tabut untuk kesaksian
  rationale: Kata depan ל dapat menyatakan hubungan atau tujuan. Terjemahan ini mempertahankan unsur 'untuk' tanpa memasukkan gagasan 'perjanjian' yang tidak dinyatakan secara eksplisit.
- source_word: הַכַּפֹּרֶת
  choice: tutup pendamaian
  rationale: Dalam konteks tempat kudus, istilah ini menunjuk pada tutup emas di atas tabut dan berkaitan dengan ritus pendamaian. Pilihan ini jelas bagi pembaca Indonesia dan tidak mengubah benda tersebut menjadi tempat duduk secara harfiah.
- source_word: אֲשֶׁר עָלָיו
  choice: yang ada di atasnya
  rationale: Menerjemahkan klausa relatif dan עַל secara langsung; akhiran pronominalnya merujuk pada tabut.
- source_word: כָּל כְּלֵי הָאֹהֶל
  choice: segala perlengkapan kemah itu
  rationale: כְּלִים merupakan istilah luas untuk berbagai barang atau peralatan kemah; 'perlengkapan' alami dan tidak terlalu sempit.
theological_decisions:
- issue: Makna dan fungsi הַכַּפֹּרֶת
  choice: tutup pendamaian
  alternative: takhta belas kasihan
  rationale: Istilah Ibrani menunjuk pada tutup tabut sekaligus membawa kaitan kultis dengan pendamaian. Teks utama mempertahankan bentuk bendanya dan kaitan tersebut, sedangkan padanan tradisional yang menonjolkan belas kasihan dicatat sebagai alternatif.
- issue: Hubungan tabut dengan עֵדֻת melalui kata depan ל
  choice: tabut untuk kesaksian
  alternative: tabut kesaksian
  rationale: Kata depan ל memungkinkan nuansa tujuan maupun hubungan. Terjemahan utama mempertahankan bentuk yang lebih eksplisit, sementara alternatif yang lebih idiomatis dicatat tanpa menentukan secara berlebihan apa yang dimaksud dengan kesaksian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Ayat dipertahankan sebagai bagian dari daftar yang berlanjut dari konteks sebelumnya, dengan tanda pisah pada akhir fragmen.
