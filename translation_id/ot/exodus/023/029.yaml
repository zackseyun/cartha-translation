base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/029.yaml
  text: I will not drive them out from before you in one year[b][a], lest the land become desolate and the wild animals of the field become too numerous against you.
translation:
  language: id
  text: Aku tidak akan menghalau mereka[a] dari hadapanmu dalam satu tahun, agar tanah itu tidak menjadi sunyi dan terlantar, dan binatang-binatang liar di padang[b] tidak bertambah banyak sehingga membahayakanmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, objek kata kerja ini berbentuk tunggal (“dia”), tetapi kemungkinan besar dipakai secara kolektif untuk penduduk atau musuh yang disebut sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “binatang-binatang di padang”. Dalam konteks ini yang dimaksud ialah binatang liar.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲגָרְשֶׁנּוּ
  choice: Aku tidak akan menghalau mereka
  rationale: Kata kerja גרש berarti menghalau atau mengusir. Sufiks objeknya berbentuk tunggal, tetapi dalam konteks ini tampaknya merujuk secara kolektif kepada penduduk atau musuh yang disebut sebelumnya; bentuk jamak ‘mereka’ paling jelas dan alami dalam bahasa Indonesia.
- source_word: מִפָּנֶיךָ
  choice: dari hadapanmu
  rationale: Ungkapan ini mempertahankan gambaran ruang dan konfrontasi dalam idiom Ibrani, sekaligus tetap wajar dalam ragam Alkitab bahasa Indonesia.
- source_word: בְּשָׁנָה אֶחָת
  choice: dalam satu tahun
  rationale: Terjemahan langsung yang dapat berarti dalam kurun satu tahun atau dalam satu tahun saja, tanpa mempersempit maknanya.
- source_word: פֶּן
  choice: supaya ... jangan
  rationale: פֶּן memperkenalkan akibat yang hendak dicegah. Bentuk ‘supaya ... jangan’ alami dalam bahasa Indonesia dan mempertahankan nuansa peringatan.
- source_word: תִּהְיֶה הָאָרֶץ שְׁמָמָה
  choice: negeri itu jangan menjadi tandus
  rationale: שְׁמָמָה menggambarkan keadaan sunyi, terbengkalai, atau tandus. ‘Menjadi tandus’ ringkas dan sesuai dengan konteks tanah yang kehilangan penduduk serta pengelolaan.
- source_word: וְרַבָּה עָלֶיךָ
  choice: bertambah banyak sehingga membahayakanmu
  rationale: רבה berarti menjadi banyak atau bertambah banyak, sedangkan עליך dalam konteks ini menyatakan dampak yang merugikan terhadap Israel. Terjemahan ini menyampaikan ancaman tersebut tanpa membuatnya lebih spesifik daripada teks.
- source_word: חַיַּת הַשָּׂדֶה
  choice: binatang liar di padang
  rationale: Frasa konstruksi ini menunjuk pada hewan liar yang hidup di wilayah terbuka. ‘Binatang liar di padang’ jelas, modern, dan tetap mempertahankan unsur הַשָּׂדֶה.
