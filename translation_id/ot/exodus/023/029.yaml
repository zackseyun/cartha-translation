revisions:
- from: Aku tidak akan menghalau mereka[a] dari hadapanmu dalam satu tahun, supaya negeri itu jangan menjadi tandus dan binatang liar di padang[b] bertambah banyak sehingga membahayakanmu.
  to: Aku tidak akan menghalau mereka[a] dari hadapanmu dalam satu tahun, agar tanah itu tidak menjadi sunyi dan terlantar, dan binatang-binatang liar di padang[b] tidak bertambah banyak sehingga membahayakanmu.
  rationale: Revisi mengganti “tandus” dengan “sunyi dan terlantar” untuk mencakup arti שְׁמָמָה secara lebih tepat, dan memperjelas bahwa kedua klausa sesudahnya merupakan akibat yang hendak dicegah oleh פֶּן. Bentuk jamak pada “binatang-binatang liar” wajar dalam bahasa Indonesia dan sesuai konteks ancaman populasi hewan liar. Penanda serta isi pokok kedua catatan kaki dipertahankan.
