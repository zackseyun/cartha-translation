review_pass:
  verdict: revise
  source_fidelity: Terjemahan pada dasarnya setia. Namun, hubungan פֶּן dengan dua akibat perlu dinyatakan sebagai peringatan/hasil yang dihindari, bukan tujuan positif. Selain itu, שְׁמָמָה lebih luas daripada sekadar tanah yang tandus; “menjadi sunyi dan terlantar” mencakup desolasi karena tanah tidak didiami/diusahakan. “Bertambah banyak sehingga membahayakanmu” menyampaikan dampak adversatif עָלֶיךָ secara wajar.
  naturalness: Bahasa draft umumnya alami dan baku. Penggantian “supaya ... jangan” dengan “agar ... tidak” membuat konstruksi sebab-pencegahan lebih lancar. “Binatang liar di padang” dapat dipahami, tetapi “binatang-binatang liar di padang” lebih mencerminkan nomina kolektif dengan lebih idiomatis dalam konteks ini.
  terminology: “Menghalau mereka dari hadapanmu” baik dan mempertahankan idiom spasial. “Negeri” dapat dipakai untuk הָאָרֶץ, tetapi “tanah itu” lebih langsung untuk kondisi menjadi terlantar dan kemunculan binatang liar. Catatan a benar mempertahankan fakta bahwa sufiks objek Ibrani berbentuk tunggal namun kemungkinan kolektif.
  issues:
  - severity: medium
    issue: “tandus” mempersempit שְׁמָמָה.
    rationale: Istilah Ibrani itu menunjuk keadaan sepi, hancur, atau terlantar, bukan terutama ketidaksuburan tanah. Konteks ayat mendukung desolasi karena penduduk belum dihalau secara sekaligus.
  - severity: low
    issue: “supaya negeri itu jangan menjadi ...” berpotensi terdengar sebagai tujuan, bukan akibat yang hendak dicegah.
    rationale: פֶּן memperkenalkan peringatan tentang hasil yang perlu dihindari. “agar ... tidak” menyampaikan fungsi ini secara alami dalam bahasa Indonesia.
  - severity: low
    issue: “sehingga membahayakanmu” sedikit lebih eksplisit daripada verba Ibrani.
    rationale: Walaupun sesuai implikasi עָלֶיךָ, “menjadi banyak di sekitarmu” atau “bertambah banyak terhadapmu” dapat menjadi terlalu harfiah/tidak alami. Mempertahankan “membahayakanmu” masih aman bila klausa sebelumnya dibaca sebagai akibat yang dihindari.
  revised_text: Aku tidak akan menghalau mereka[a] dari hadapanmu dalam satu tahun, agar tanah itu tidak menjadi sunyi dan terlantar, dan binatang-binatang liar di padang[b] tidak bertambah banyak sehingga membahayakanmu.
