  source_fidelity: 'Terjemahan secara akurat mengikuti Ibrani: כִּי sebagai alasan (“Sebab”), janji futurum malaikat Allah yang mendahului dan membawa Israel kepada kelompok-kelompok yang disebut, serta tindakan Allah untuk melenyapkan mereka sebagai satu kelompok kolektif. “Malaikat-Ku” mempertahankan makna utama מַלְאָכִי tanpa menetapkan identitas teologis lebih lanjut. “Melenyapkan mereka” menyampaikan היטb? Hifil כחד dan rujukan kolektif sufiks tunggal dengan baik.'
