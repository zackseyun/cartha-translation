  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי יֵלֵ֣ךְ מַלְאָכִ/י֮ לְ/פָנֶי/ךָ֒ וֶ/הֱבִֽיאֲ/ךָ֗ אֶל הָֽ/אֱמֹרִי֙ וְ/הַ֣/חִתִּ֔י וְ/הַ/פְּרִזִּי֙ וְ/הַֽ/כְּנַעֲנִ֔י הַ/חִוִּ֖י וְ/הַ/יְבוּסִ֑י וְ/הִכְחַדְתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/023.yaml
  text: For my angel will go before you and bring you to the Amorites[a], the Hittites, the Perizzites, the Canaanites, the Hivites, and the Jebusites[b], and I will wipe them out.
translation:
  language: id
  text: Sebab malaikat-Ku akan berjalan di depanmu dan membawa engkau kepada orang Amori[a], orang Het, orang Feris, orang Kanaan, orang Hewi, dan orang Yebus, lalu Aku akan melenyapkan mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “utusan-Ku.” Kata Ibrani מַלְאָךְ dapat menunjuk kepada utusan manusia ataupun makhluk surgawi; dalam konteks bimbingan ilahi di sini, “malaikat” paling sesuai.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, bahasa Ibrani memakai objek tunggal, “dia/itu,” yang merujuk secara kolektif kepada bangsa-bangsa yang disebutkan; bahasa Indonesia menerjemahkan maknanya sebagai “mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau dasar bagi perintah dan janji sebelumnya; “Sebab” mempertahankan fungsi penjelasannya secara wajar dalam bahasa Indonesia.
- source_word: יֵלֵךְ
  choice: akan berjalan
  rationale: Bentuk imperfek menyatakan tindakan mendatang dalam konteks janji ilahi. “Akan berjalan” dekat dengan verba sumber dan alami.
- source_word: מַלְאָכִי
  choice: malaikat-Ku
  rationale: מַלְאָךְ dapat berarti utusan manusia atau makhluk surgawi. Dalam konteks bimbingan ilahi ini, “malaikat-Ku” paling sesuai, sementara alternatif “utusan-Ku” dicatat agar ambiguitas leksikal tetap terlihat.
- source_word: לְפָנֶיךָ
  choice: di depanmu
  rationale: Ungkapan ini berarti mendahului seseorang, dengan implikasi memimpin atau membimbing. “Di depanmu” alami sekaligus dekat dengan bahasa Ibrani.
- source_word: וֶהֱבִיאֲךָ
  choice: dan membawa engkau
  rationale: Bentuk hifil dari בוא berarti menyebabkan datang atau membawa. Pilihan ini mempertahankan makna kausatif langsungnya.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menunjukkan arah atau tujuan. Dengan nama-nama bangsa sebagai sasaran perjumpaan, “kepada” merupakan padanan yang wajar.
- source_word: הָאֱמֹרִי ... וְהַיְבוּסִי
  choice: orang Amori, orang Het, orang Feris, orang Kanaan, orang Hewi, dan orang Yebus
  rationale: Bentuk Ibrani adalah sebutan etnis tunggal yang dipakai secara kolektif. Pola “orang + nama bangsa” merupakan bentuk baku dan mudah dipahami dalam bahasa Indonesia.
- source_word: וְהִכְחַדְתִּיו
  choice: lalu Aku akan melenyapkan mereka
  rationale: Bentuk hifil כחד berarti menyebabkan lenyap atau memusnahkan. Sufiks objeknya tunggal secara gramatikal, tetapi merujuk secara kolektif kepada bangsa-bangsa yang baru disebut; bahasa Indonesia secara alami memakai “mereka”.
theological_decisions:
- issue: Identitas dan hakikat מַלְאָכִי
  choice: Diterjemahkan “malaikat-Ku” tanpa menentukan identitas tokoh itu lebih jauh.
  alternative: “utusan-Ku”; suatu penampakan ilahi; Sang Anak sebelum inkarnasi
  rationale: Ayat ini sendiri hanya menyebutnya sebagai malaikat atau utusan Allah. Terjemahan tidak semestinya menetapkan tafsiran teofanik atau kristologis tertentu yang tidak dinyatakan secara eksplisit oleh teks.
- issue: Jumlah objek dalam וְהִכְחַדְתִּיו
  choice: Makna kolektif dinyatakan dengan objek jamak “mereka”.
  alternative: Terjemahan harfiah berbentuk tunggal, “dia/itu”
  rationale: Sufiks Ibrani berbentuk tunggal, tetapi rangkaian bangsa diperlakukan sebagai satu kesatuan kolektif. “Mereka” menyampaikan rujukannya dengan jelas tanpa mengubah cakupan makna.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. “Engkau” dipertahankan sebagai bentuk tunggal yang bermartabat dan jelas, sedangkan nama-nama bangsa mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
