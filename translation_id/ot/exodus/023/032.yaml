  yaml_path: translation/ot/exodus/023/032.yaml
  text: You shall make no covenant with them or with their gods[a][b].
translation:
  language: id
  text: Janganlah engkau mengadakan perjanjian dengan mereka ataupun dengan ilah-ilah mereka.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “memotong perjanjian.”
    reason: lexical_alternative
  - marker: b
    text: Atau, secara lebih harfiah, “dan dengan ilah-ilah mereka.”
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא
  choice: janganlah
  rationale: Negasi ini membentuk larangan langsung. “Janganlah” menyampaikan daya hukum perintah kepada orang kedua tunggal secara wajar dalam bahasa Indonesia.
- source_word: תִכְרֹת ... בְּרִית
  choice: engkau mengadakan perjanjian
  rationale: Secara harfiah idiom Ibrani ini berarti “memotong perjanjian,” tetapi dalam bahasa Indonesia ungkapan alaminya ialah “mengadakan perjanjian.” Kata “engkau” mempertahankan bentuk orang kedua tunggal.
- source_word: לָהֶם
  choice: dengan mereka
  rationale: Dalam konstruksi pembuatan perjanjian, preposisi ל menandai pihak yang dengannya perjanjian diadakan.
- source_word: וְלֵאלֹהֵיהֶם
  choice: ataupun dengan ilah-ilah mereka
  rationale: ו secara bentuk berarti “dan,” tetapi dalam cakupan larangan bahasa Indonesia, “ataupun” secara alami menegaskan bahwa kedua pihak sama-sama dilarang tanpa mengubah isi larangan. Bentuk jamak אֱלֹהִים dalam konteks ini diterjemahkan “ilah-ilah.”
- source_word: בְּרִית
  choice: perjanjian
  rationale: “Perjanjian” mempertahankan cakupan relasional, hukum, dan keagamaan dari istilah Ibrani, sedangkan “persetujuan” terlalu umum dan “pakta” terlalu sempit.
theological_decisions:
- issue: Idiom כרת ברית
  choice: mengadakan perjanjian
  alternative: memotong perjanjian
  rationale: Terjemahan idiomatis dipilih agar jelas bagi pembaca Indonesia modern, sedangkan bentuk harfiahnya dicatat dalam catatan kaki untuk menjaga transparansi terhadap teks sumber.
- issue: Daya ו sebelum “ilah-ilah mereka”
  choice: ataupun dengan ilah-ilah mereka
  alternative: dan dengan ilah-ilah mereka
  rationale: “Ataupun” menyatakan secara alami bahwa larangan berlaku baik terhadap mereka maupun terhadap ilah-ilah mereka. Karena ו secara formal berarti “dan,” bentuk itu tetap diberikan dalam catatan kaki.
- issue: Penerjemahan אֱלֹהִים dalam konteks bangsa-bangsa
  choice: ilah-ilah
  alternative: allah-allah
  rationale: “Ilah-ilah” merupakan istilah Indonesia yang jelas dan bermartabat untuk dewa-dewa yang disembah bangsa-bangsa serta menghindari kekaburan dengan nama/sebutan bagi Allah Israel.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “engkau” dipakai untuk mempertahankan sapaan orang kedua tunggal dalam teks Ibrani; “janganlah” menjaga corak larangan hukum tanpa terdengar usang. Semua penanda catatan kaki dicantumkan dalam teks utama.
