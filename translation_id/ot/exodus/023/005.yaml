base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/005.yaml
  text: If you see the donkey of one who hates you lying down under its load[a], and would refrain from helping him[b], you must surely help with him.
translation:
  language: id
  text: Jika engkau melihat keledai milik orang yang membencimu rebah di bawah muatannya, dan engkau enggan menolongnya,[a] engkau harus sungguh-sungguh memberi bantuan bersamanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “menolong” biasanya berarti “meninggalkan” atau “membiarkan,” tetapi dalam konteks ini berarti memberi bantuan.
    reason: lexical_alternative
  - marker: b
    text: “Bersamanya” dapat dipahami sebagai bersama pemilik keledai itu atau bersama keledai tersebut. Bahasa Ibrani memungkinkan kedua rujukan itu.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Jika
  rationale: Dalam konteks hukum kasuistik, כִּי memperkenalkan keadaan bersyarat; “jika” menyampaikan fungsi itu secara alami.
- source_word: תִרְאֶה
  choice: engkau melihat
  rationale: Mempertahankan arti langsung verba ראה tanpa mempersempitnya menjadi perjumpaan yang kebetulan.
- source_word: חֲמוֹר שֹׂנַאֲךָ
  choice: keledai milik orang yang membencimu
  rationale: שֹׂנַאֲךָ secara harfiah menunjuk kepada orang yang membenci, bukan memakai kategori yang lebih luas seperti “musuhmu”.
- source_word: רֹבֵץ תַּחַת מַשָּׂאוֹ
  choice: rebah di bawah muatannya
  rationale: “Rebah” menggambarkan hewan yang berada di tanah karena muatan, sedangkan “muatan” merupakan padanan modern yang wajar bagi מַשָּׂא.
- source_word: וְחָדַלְתָּ מֵעֲזֹב לוֹ
  choice: lalu engkau hendak menahan diri untuk menolongnya
  rationale: Konstruksi ini menggambarkan kemungkinan atau kecenderungan untuk tidak memberi bantuan. “Menahan diri” mempertahankan unsur berhenti/tidak bertindak dalam חָדַל, sedangkan “menolong” menyampaikan arti kontekstual עזב.
- source_word: עָזֹב תַּעֲזֹב
  choice: engkau harus sungguh-sungguh menolong
  rationale: Infinitif absolut yang diikuti bentuk finit menegaskan kewajiban; “harus sungguh-sungguh” menyampaikan tekanan tersebut.
- source_word: עִמּוֹ
  choice: bersama dengannya
  rationale: Padanan ini mempertahankan preposisi “bersama dengan” dan membiarkan pronomina maskulin tunggal tetap dapat merujuk kepada pemilik ataupun keledai.
theological_decisions:
- issue: Rujukan pronomina pada לוֹ dan עִמּוֹ
  choice: Memakai bentuk pronominal “-nya/dengannya” dalam teks utama dan menjelaskan ambiguitasnya dalam catatan kaki
  alternative: Menentukan rujukannya sebagai orang yang membenci engkau atau sebagai keledai
  rationale: Dalam bahasa Ibrani, kedua anteseden itu berjenis maskulin tunggal. Konteks etis mendukung rujukan kepada pemilik, tetapi fokus tindakan praktis terhadap hewan juga memungkinkan rujukan kepada keledai; terjemahan tidak seharusnya menutup ambiguitas asli.
- issue: Arti עזב dalam perintah ini
  choice: menolong
  alternative: meninggalkan, melepaskan, atau membongkar muatan
  rationale: Walaupun arti lazim verba ini adalah “meninggalkan,” konteks menuntut tindakan bantuan. Pilihan “menolong” menyampaikan fungsi perintah tanpa menetapkan secara berlebihan apakah tindakannya membongkar muatan atau menegakkan hewan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal “engkau,” sesuai gaya hukum langsung. Diksi dibuat lugas dan bermartabat. Ungkapan “bersama dengannya” sengaja mempertahankan susunan serta ambiguitas pronomina Ibrani, meskipun sedikit kurang idiomatis daripada parafrasa yang menentukan rujukannya.
