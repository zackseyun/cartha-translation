    issue: Konstruksi “menolong bersama dengannya” tidak alami dalam bahasa Indonesia baku.
    rationale: Verba “menolong” lazimnya memerlukan objek atau konstruksi “menolong bersama-sama,” sedangkan “bersama dengannya” setelah verba itu terasa sebagai terjemahan harfiah. “Memberi bantuan bersamanya” lebih dapat dipahami dan tetap mempertahankan unsur “bersama dengan dia/itu.”
  - severity: low
    issue: “Lalu” menambahkan nuansa urutan temporal.
    rationale: Waw pada konstruksi ini menghubungkan keadaan enggan menolong dengan kondisi sebelumnya, bukan terutama urutan waktu. “Dan” lebih netral.
