  verdict: revise
  source_fidelity: Teks dengan tepat mempertahankan struktur bersyarat כִּי, makna langsung “melihat,” gambaran keledai yang rebah di bawah muatannya, serta penegasan perintah עָזֹב תַּעֲזֹב. Ambiguitas rujukan pronomina pada לוֹ dan עִמּוֹ dipelihara secara bertanggung jawab melalui pronomina Indonesia dan catatan kaki. Namun, “lalu” memberi kesan urutan waktu yang tidak diperlukan, dan “menolong bersama dengannya” tidak idiomatis dalam bahasa Indonesia.
  naturalness: “Engkau enggan menolongnya” merupakan padanan yang lebih alami untuk kemungkinan menahan diri dari memberi bantuan. “Memberi bantuan bersamanya” menyampaikan unsur עִמּוֹ secara lebih wajar daripada “menolong bersama dengannya,” sambil tetap tidak menentukan apakah rujukannya pemilik atau keledai.
  terminology: “Keledai,” “muatan,” dan “membencimu” tepat untuk bahasa Indonesia baku modern dan setia pada istilah Ibrani. “Memberi bantuan” pada klausa akhir juga menghindari konstruksi yang janggal tanpa mempersempit tindakan menjadi membongkar muatan atau menegakkan hewan.
  issues:
