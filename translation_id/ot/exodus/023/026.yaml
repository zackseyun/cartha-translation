  text: There shall not be one miscarrying or barren in your land[b][a]; I will fill up the number of your days.
translation:
  language: id
  text: Tidak akan ada perempuan yang keguguran[a] atau mandul di negerimu; Aku akan menggenapkan jumlah hari-harimu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang kehilangan anak.” Kata Ibrani ini dapat berarti kehilangan anak secara lebih luas, tetapi ketika dipasangkan dengan “mandul” dalam konteks ini, kemungkinan besar yang dimaksud ialah keguguran atau kehilangan anak saat persalinan.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “Aku akan memenuhi jumlah hari-harimu,” yaitu, “Aku akan membawa jangka hidupmu sampai pada ukuran penuhnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׁכֵּלָה
  choice: perempuan yang keguguran
  rationale: Bentuk partisip feminin dari שׁכל menunjuk pada perempuan yang kehilangan kandungan atau anak. Dalam pasangan dengan עֲקָרָה dan konteks berkat kesuburan, 'yang keguguran' paling tepat menyampaikan makna kontekstual tanpa meniadakan cakupan leksikal yang lebih luas, yang dicatat dalam catatan kaki.
- source_word: עֲקָרָה
  choice: mandul
  rationale: '''Mandul'' merupakan padanan Indonesia yang ringkas dan lazim bagi perempuan yang tidak dapat mengandung atau melahirkan, sesuai dengan bentuk feminin dan konteks berkat kesuburan.'
- source_word: בְּאַרְצֶךָ
  choice: di negerimu
  rationale: אֶרֶץ di sini merujuk pada negeri yang akan didiami Israel. 'Di negerimu' alami dalam bahasa Indonesia dan mempertahankan konteks perjanjian.
- source_word: אֶת מִסְפַּר יָמֶיךָ
  choice: jumlah hari-harimu
  rationale: Padanan ini mempertahankan ungkapan Ibrani tentang keseluruhan hari atau jangka hidup yang ditetapkan, tanpa langsung menggantinya dengan penafsiran 'umur panjang'.
- source_word: אֲמַלֵּא
  choice: Aku akan menggenapkan
  rationale: Kata מלא berarti membuat penuh atau melengkapi. 'Menggenapkan' terdengar wajar dalam bahasa Indonesia dan menyatakan bahwa Allah akan membawa jumlah hari itu sampai pada ukuran penuhnya.
- source_word: לֹא תִהְיֶה
  choice: Tidak akan ada
  rationale: Konstruksi eksistensial ini secara alami dinyatakan dalam bahasa Indonesia dengan 'tidak akan ada'.
theological_decisions:
- issue: Cakupan janji kesuburan dan umur
  choice: Ayat ini diterjemahkan sebagai janji berkat perjanjian bagi Israel di negerinya, mencakup ketiadaan keguguran dan kemandulan serta tercapainya jangka hidup yang penuh.
  alternative: Menjadikannya jaminan universal tanpa syarat bahwa setiap orang percaya pada segala zaman tidak akan mengalami keguguran, kemandulan, atau kematian dini.
  rationale: Konteks langsungnya adalah janji perjanjian kepada Israel mengenai kehidupan di negeri itu. Terjemahan mempertahankan pernyataan teks tanpa memperluasnya menjadi klaim universal yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Kata 'perempuan' menyatakan bentuk feminin kedua istilah Ibrani, sedangkan 'menggenapkan jumlah hari-harimu' mempertahankan citra kepenuhan dalam ungkapan sumber tanpa menjadi terlalu kaku.
