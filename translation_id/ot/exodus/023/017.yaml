base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/017.yaml
  text: Three times in the year every male among you shall appear before the Lord Yahweh[a].
translation:
  language: id
  text: Tiga kali dalam setahun, setiap laki-laki di antaramu harus menghadap Tuhan Yahweh[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani memakai gelar dan nama ilahi secara berdampingan: “Tuhan Yahweh.”'
    reason: Menjelaskan susunan gelar הָאָדֹן dan nama ilahi יְהוָה yang dapat terasa tidak biasa dalam bahasa Indonesia.
lexical_decisions:
- source_word: שָׁלֹשׁ פְּעָמִים בַּשָּׁנָה
  choice: Tiga kali dalam setahun
  rationale: Ungkapan ini menyatakan frekuensi dalam siklus tahunan. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan makna Ibrani.
- source_word: יֵרָאֶה
  choice: harus menghadap
  rationale: Bentuk nifal dari ראה dalam konteks ini merupakan ungkapan untuk hadir di hadapan penguasa atau Allah. “Menghadap” menyampaikan fungsi ungkapan tersebut secara wajar; “harus” menyatakan daya wajib bentuk imperfek dalam ketetapan hukum ini.
- source_word: כָּל זְכוּרְךָ
  choice: setiap laki-laki di antaramu
  rationale: Terjemahan ini mempertahankan acuan khusus kepada semua anggota laki-laki di kalangan umat yang disapa, sekaligus terdengar alami dalam bahasa Indonesia modern.
- source_word: אֶל פְּנֵי
  choice: menghadap
  rationale: Secara harfiah berarti menuju atau berada “di hadapan wajah” seseorang. Dalam gabungan dengan יֵרָאֶה, bahasa Indonesia paling alami mengungkapkannya dengan verba “menghadap”.
- source_word: הָאָדֹן
  choice: Tuhan
  rationale: אָדוֹן adalah gelar yang berarti tuan atau penguasa; dalam konteks ilahi, “Tuhan” merupakan padanan Indonesia yang wajar dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga perbedaan antara הָאָדֹן sebagai gelar dan יְהוָה sebagai nama tetap tampak.
theological_decisions:
- issue: Penerjemahan gabungan gelar dan nama ilahi הָאָדֹן יְהוָה
  choice: Tuhan Yahweh
  alternative: Tuhan ALLAH; Tuhan, yaitu Yahweh
  rationale: Teks Ibrani menempatkan gelar הָאָדֹן langsung sebelum nama ilahi יְהוָה. “Tuhan Yahweh” mempertahankan kedua unsur itu tanpa mengubah nama ilahi menjadi gelar atau menambahkan hubungan penjelas yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bernada hukum-keagamaan. “Menghadap” dipilih daripada ungkapan yang lebih harfiah tetapi kaku seperti “menampakkan diri di hadapan”; “di antaramu” menjaga sapaan kepada umat tanpa memperluas cakupan gender sumber.
