  yaml_path: translation/ot/exodus/023/007.yaml
  text: Keep far from a false matter[a], and do not kill the innocent and the righteous[b], for I will not justify the wicked.
translation:
  language: id
  text: Jauhilah perkara dusta[a]. Jangan membunuh orang yang tidak bersalah dan orang benar, sebab Aku tidak akan membenarkan orang fasik[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perkataan dusta,” “tuduhan palsu,” atau “kebohongan.” Kata Ibrani yang diterjemahkan “perkara” bermakna luas dan dapat mencakup kesaksian palsu atau perkara hukum yang curang.
    reason: lexical_alternative
  - marker: b
    text: Atau “sebab Aku tidak akan membebaskan orang yang bersalah.” Kata kerja Ibraninya bersifat forensik dan dapat berarti “menyatakan benar,” “membenarkan,” atau “membebaskan dari tuduhan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִדְּבַר שֶׁקֶר
  choice: perkara dusta
  rationale: דָּבָר dapat berarti perkataan, perkara, urusan, atau kasus. Dalam konteks hukum ini, “perkara dusta” tetap cukup luas untuk mencakup kesaksian palsu, tuduhan palsu, atau perkara hukum yang curang.
- source_word: תִּרְחָק
  choice: Jauhilah
  rationale: Bentuk imperfek orang kedua tunggal berfungsi sebagai perintah. “Jauhilah” menyampaikan tuntutan untuk secara aktif menjaga jarak dengan alami dalam bahasa Indonesia.
- source_word: וְנָקִי
  choice: orang yang tidak bersalah
  rationale: נָקִי menunjuk kepada orang yang bebas dari kesalahan. Ungkapan ini jelas dan alami dalam konteks hukum.
- source_word: וְצַדִּיק
  choice: orang benar
  rationale: צַדִּיק berarti benar atau berada di pihak yang benar. “Orang benar” mempertahankan hubungan leksikal dengan akar צדק dan tetap cocok dalam konteks moral-hukum.
- source_word: אַל תַּהֲרֹג
  choice: Jangan membunuh
  rationale: הרג adalah verba umum untuk membunuh atau mematikan. “Membunuh” tidak mempersempit maknanya menjadi pembunuhan dengan motif tertentu dan sesuai dengan konteks putusan hukum.
- source_word: לֹא אַצְדִּיק
  choice: Aku tidak akan membenarkan
  rationale: 'Bentuk Hifil dari צדק di sini bersifat forensik: menyatakan benar, membenarkan, atau membebaskan dari tuduhan. “Membenarkan” mempertahankan kaitan dengan צַדִּיק, sedangkan nuansa “membebaskan” dicatat dalam catatan kaki.'
- source_word: רָשָׁע
  choice: orang fasik
  rationale: רָשָׁע dapat menunjuk kepada orang fasik atau orang bersalah dalam konteks moral-hukum. “Orang fasik” mempertahankan keluasan moral istilah Ibrani; nuansa forensiknya disertakan dalam catatan kaki.
theological_decisions:
- issue: Makna forensik pernyataan Allah
  choice: sebab Aku tidak akan membenarkan orang fasik
  alternative: sebab Aku tidak akan membebaskan orang yang bersalah
  rationale: Terjemahan utama mempertahankan hubungan kata antara צַדִּיק dan אַצְדִּיק serta ketegangan moral-forensik teks. Alternatifnya lebih eksplisit secara hukum, tetapi menghilangkan hubungan leksikal tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam bermartabat dan mudah dipahami. “Perkara dusta” menjaga keluasan konteks hukum, sedangkan pasangan “orang benar/membenarkan” mempertahankan kaitan akar kata Ibrani. Penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
