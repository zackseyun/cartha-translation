  to: Rayakanlah Hari Raya Roti Tidak Beragi. Selama tujuh hari engkau harus makan roti tidak beragi, seperti yang telah Kuperintahkan kepadamu, pada waktu yang ditetapkan dalam bulan Abib, sebab pada bulan itulah engkau keluar dari Mesir. Janganlah seorang pun menghadap Aku dengan tangan kosong.[a]
