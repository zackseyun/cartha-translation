  source_fidelity: 'Sebagian besar terjemahan setia pada teks Ibrani: perayaan Roti Tidak Beragi, tujuh hari, bulan Abib, keluarnya dari Mesir, dan larangan datang dengan tangan kosong semuanya tersampaikan. Namun, “Janganlah mereka” tidak memiliki rujukan anteseden yang jelas dalam bahasa Indonesia dan kurang tepat menangkap fungsi generik verba orang ketiga jamak Ibrani dalam konteks ini.'
  naturalness: 'Kalimat-kalimat awal baku dan alami. Klausa terakhir perlu diidiomatiskan sebagai larangan umum: “Janganlah seorang pun menghadap Aku dengan tangan kosong.” Bentuk ini jelas dan khidmat dalam bahasa Indonesia modern.'
