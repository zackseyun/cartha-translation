  text: אֶת חַ֣ג הַ/מַּצּוֹת֮ תִּשְׁמֹר֒ שִׁבְעַ֣ת יָמִים֩ תֹּאכַ֨ל מַצּ֜וֹת כַּֽ/אֲשֶׁ֣ר צִוִּיתִ֗/ךָ לְ/מוֹעֵד֙ חֹ֣דֶשׁ הָֽ/אָבִ֔יב כִּי ב֖/וֹ יָצָ֣אתָ מִ/מִּצְרָ֑יִם וְ/לֹא יֵרָא֥וּ פָנַ֖/י רֵיקָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/015.yaml
  text: You shall keep the Feast of Unleavened Bread[a]. For seven days you shall eat unleavened bread, as I commanded you, at the appointed time in the month of Abib, for in it you came out from Egypt[b]. And no one shall appear before me empty-handed.
translation:
  language: id
  text: Rayakanlah Hari Raya Roti Tidak Beragi. Selama tujuh hari engkau harus makan roti tidak beragi, seperti yang telah Kuperintahkan kepadamu, pada waktu yang ditetapkan dalam bulan Abib, sebab pada bulan itulah engkau keluar dari Mesir. Janganlah seorang pun menghadap Aku dengan tangan kosong.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani beralih dari sapaan orang kedua tunggal ke kata kerja orang ketiga jamak dalam klausa ini.
    reason: alternative_reading
lexical_decisions:
- source_word: חַג הַמַּצּוֹת
  choice: Hari Raya Roti Tidak Beragi
  rationale: חַג menunjuk pada perayaan keagamaan, dengan kemungkinan nuansa ziarah, sedangkan מַצּוֹת adalah roti tidak beragi. Ungkapan ini jelas, alami, dan tetap formal dalam bahasa Indonesia.
- source_word: תִּשְׁמֹר
  choice: Rayakanlah
  rationale: Dalam konteks perayaan keagamaan, שׁמר berarti menaati atau menjalankan ketetapan. 'Rayakanlah' menyampaikan tindakan yang dituntut secara alami; 'peliharalah' terlalu harfiah dan kurang lazim untuk hari raya.
- source_word: שִׁבְעַת יָמִים תֹּאכַל מַצּוֹת
  choice: Selama tujuh hari engkau harus makan roti tidak beragi
  rationale: Terjemahan ini mempertahankan durasi, sapaan orang kedua tunggal, dan daya wajib bentuk hukum Ibrani.
- source_word: כַּאֲשֶׁר צִוִּיתִךָ
  choice: seperti yang telah Kuperintahkan kepadamu
  rationale: Mempertahankan perbandingan dan perintah ilahi langsung; aspek lampau dibuat alami dalam bahasa Indonesia.
- source_word: לְמוֹעֵד
  choice: pada waktu yang ditetapkan
  rationale: מוֹעֵד di sini menunjuk pada waktu kalender yang telah ditentukan untuk perayaan.
- source_word: חֹדֶשׁ הָאָבִיב
  choice: bulan Abib
  rationale: Abib dipertahankan sebagai penanda kalender Ibrani, bukan diterjemahkan secara semantis sebagai 'bulir muda'.
- source_word: כִּי בוֹ יָצָאתָ מִמִּצְרָיִם
  choice: sebab pada bulan itulah engkau keluar dari Mesir
  rationale: Kata ganti בוֹ secara alami merujuk pada bulan yang baru disebut. Rujukan eksplisit 'bulan' menghindari ketidakjelasan dalam bahasa Indonesia.
- source_word: וְלֹא יֵרָאוּ פָנַי רֵיקָם
  choice: Janganlah mereka menghadap ke hadirat-Ku dengan tangan kosong
  rationale: Ungkapan 'melihat wajah-Ku' bermakna menghadap atau hadir di hadapan Allah. 'Dengan tangan kosong' menyampaikan idiom רֵיקָם tanpa mempersempitnya menjadi jenis persembahan tertentu. Kata 'mereka' mempertahankan peralihan gramatikal ke orang ketiga jamak.
theological_decisions:
- issue: Ungkapan ilahi פָנַי, secara harfiah 'wajah-Ku'
  choice: ke hadirat-Ku
  alternative: di hadapan-Ku; melihat wajah-Ku
  rationale: Dalam konteks ibadah, ungkapan itu adalah idiom untuk hadir menghadap Allah. 'Ke hadirat-Ku' alami dan menjaga gagasan kehadiran ilahi tanpa memaksakan arti fisik.
- issue: Peralihan dari orang kedua tunggal ke orang ketiga jamak dalam klausa terakhir
  choice: Janganlah mereka
  alternative: Janganlah seorang pun
  rationale: Teks Masoret memakai verba orang ketiga jamak setelah perintah orang kedua tunggal. Terjemahan utama mempertahankan ketegangan gramatikal tersebut; alternatif idiomatis dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan 'engkau' mempertahankan bentuk orang kedua tunggal; kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Penanda catatan kaki ditempatkan pada klausa yang dijelaskannya.
