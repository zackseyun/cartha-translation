  text: וְ/גֵ֖ר לֹ֣א תִלְחָ֑ץ וְ/אַתֶּ֗ם יְדַעְתֶּם֙ אֶת נֶ֣פֶשׁ הַ/גֵּ֔ר כִּֽי גֵרִ֥ים הֱיִיתֶ֖ם בְּ/אֶ֥רֶץ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/009.yaml
  text: You shall not oppress a sojourner[a], and you yourselves know the soul of the sojourner[b], because you were sojourners in the land of Egypt.
translation:
  language: id
  text: Janganlah engkau menindas pendatang[a]. Kalian sendiri memahami kehidupan seorang pendatang[b], sebab kalian pernah menjadi pendatang di tanah Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang asing”, “penduduk asing”, atau “perantau”. Kata Ibrani ger menunjuk pada orang dari luar yang tinggal di tengah suatu masyarakat, sering kali dalam kedudukan sosial yang rentan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kalian mengenal jiwa pendatang”. Ungkapan ini menyatakan pemahaman berdasarkan pengalaman tentang kehidupan atau keadaan yang dialami seorang pendatang.
    reason: lexical_alternative
lexical_decisions:
- source_word: גֵר / גֵרִים
  choice: pendatang
  rationale: Istilah ini menunjuk pada orang bukan pribumi yang menetap di tengah suatu masyarakat, bukan sekadar pelancong. “Pendatang” alami dalam bahasa Indonesia dan dapat dipakai secara konsisten pada ketiga kemunculannya.
- source_word: תִלְחָץ
  choice: menindas
  rationale: Dalam konteks hukum ini, verba tersebut menyatakan tekanan, pemerasan, atau perlakuan yang menekan pihak rentan; “menindas” mempertahankan bobot sosial-etisnya.
- source_word: וְאַתֶּם יְדַעְתֶּם
  choice: Kalian sendiri mengenal
  rationale: “Kalian sendiri” menampilkan penekanan pada pronomina eksplisit וְאַתֶּם, sedangkan “mengenal” menyatakan pengetahuan berdasarkan pengalaman.
- source_word: נֶפֶשׁ
  choice: jiwa
  rationale: “Jiwa” mempertahankan citra konkret dan keterbukaan makna נֶפֶשׁ dalam ungkapan Ibrani, sementara catatan kaki menjelaskan bahwa yang dimaksud ialah kehidupan batin atau keadaan yang dialami pendatang.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan etis bagi perintah tersebut; “sebab” jelas dan sesuai dengan ragam bahasa yang bermartabat.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: di tanah Mesir
  rationale: Pilihan ini mencerminkan unsur אֶרֶץ secara langsung dan tetap alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna גֵר dalam hukum perjanjian
  choice: pendatang
  alternative: orang asing; penduduk asing; perantau
  rationale: Ayat ini berbicara tentang orang bukan pribumi yang hidup di tengah masyarakat dan berada dalam posisi sosial yang rentan. “Pendatang” tidak membatasi maknanya pada etnisitas atau status administratif tertentu.
- issue: Ungkapan אֶת נֶפֶשׁ הַגֵּר
  choice: mengenal jiwa pendatang
  alternative: mengetahui perasaan pendatang; tahu bagaimana rasanya menjadi pendatang; mengenal kehidupan pendatang
  rationale: Terjemahan utama mempertahankan metafora dan ketegangan leksikal teks Ibrani tanpa menentukan bahwa נֶפֶשׁ hanya berarti emosi. Catatan kaki menerangkan daya idiomatisnya.
- issue: Peralihan jumlah gramatikal
  choice: engkau pada perintah, lalu kalian pada seruan pengalaman bersama
  alternative: kamu pada seluruh ayat
  rationale: Teks Ibrani beralih dari verba orang kedua tunggal תִלְחָץ kepada bentuk jamak וְאַתֶּם יְדַעְתֶּם dan הֱיִיתֶם. Pembedaan ini dipertahankan tanpa menafsirkannya lebih jauh.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Engkau” dan “kalian” sengaja dibedakan untuk mempertahankan peralihan dari bentuk tunggal ke jamak dalam teks Ibrani. Semua penanda catatan kaki dicantumkan dalam teks utama.
