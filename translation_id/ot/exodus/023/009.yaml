  naturalness: “Janganlah engkau menindas” dan “di tanah Mesir” wajar dalam ragam baku. “Kalian sendiri memahami kehidupan seorang pendatang” menyampaikan idiom tersebut dengan jelas dan tetap cukup dekat dengan נֶפֶשׁ. Catatan kaki mempertahankan bentuk harfiahnya.
