  text: לֹ֤א יֵשְׁבוּ֙ בְּ/אַרְצְ/ךָ֔ פֶּן יַחֲטִ֥יאוּ אֹתְ/ךָ֖ לִ֑/י כִּ֤י תַעֲבֹד֙ אֶת אֱלֹ֣הֵי/הֶ֔ם כִּֽי יִהְיֶ֥ה לְ/ךָ֖ לְ/מוֹקֵֽשׁ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/033.yaml
  text: They must not dwell in your land[a], lest they cause you to sin against me; for if you serve their gods[c][b], it will surely become a snare to you.
translation:
  language: id
  text: Mereka tidak boleh tinggal di negerimu, supaya mereka tidak menyebabkan engkau berdosa terhadap-Ku.[a] Sebab jika engkau beribadah kepada ilah-ilah mereka,[b] hal itu akan menjadi jerat bagimu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “supaya mereka tidak membuat engkau berdosa terhadap-Ku” atau “supaya mereka tidak menuntun engkau ke dalam dosa terhadap-Ku.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “sebab engkau akan beribadah kepada ilah-ilah mereka.” Kata penghubung Ibrani dapat dipahami sebagai penjelasan, sehingga klausa ini dapat menyatakan hasil yang diperkirakan, bukan sekadar suatu syarat.
    reason: alternative_reading
  - marker: c
    text: “Jerat” menerjemahkan kata Ibrani מוֹקֵשׁ (moqesh), yaitu perangkap yang di sini menjadi kiasan bagi sesuatu yang menjerumuskan dan membawa kehancuran atau ketidaksetiaan kepada Allah.
    reason: cultural_note
lexical_decisions:
- source_word: יֵשְׁבוּ
  choice: tinggal
  rationale: Kata kerja יָשַׁב dapat berarti duduk, tinggal, menetap, atau tetap berada. Dalam konteks keberadaan suatu bangsa di wilayah Israel, “tinggal” alami dan tidak mempersempit makna menjadi pemukiman permanen.
- source_word: בְּאַרְצְךָ
  choice: di negerimu
  rationale: אֶרֶץ dapat berarti tanah, negeri, atau wilayah. “Negerimu” menyampaikan konteks teritorial dengan wajar dalam bahasa Indonesia dan mempertahankan bentuk orang kedua tunggal kolektif.
- source_word: פֶּן
  choice: supaya ... tidak
  rationale: פֶּן memperkenalkan akibat buruk yang hendak dicegah. Susunan “supaya ... tidak” lebih alami daripada bentuk harfiah yang kaku dan tetap mempertahankan daya preventifnya.
- source_word: יַחֲטִיאוּ אֹתְךָ לִי
  choice: mereka menyebabkan engkau berdosa terhadap-Ku
  rationale: Bentuk Hifil dari חטא bersifat kausatif, yaitu menyebabkan seseorang berbuat dosa. לִי dipahami secara etis sebagai “terhadap-Ku,” karena Allah adalah pihak yang dilanggar.
- source_word: תַעֲבֹד אֶת אֱלֹהֵיהֶם
  choice: engkau beribadah kepada ilah-ilah mereka
  rationale: עבד ketika berobjek ilah menunjuk pada pelayanan atau penyembahan religius. “Beribadah kepada” terdengar alami dalam bahasa Indonesia dan menyatakan kesetiaan kultis yang dimaksud, sedangkan “melayani” dapat terdengar terlalu umum.
- source_word: אֱלֹהֵיהֶם
  choice: ilah-ilah mereka
  rationale: Bentuk ini jamak dan menunjuk pada objek-objek ibadah bangsa-bangsa tersebut. “Ilah-ilah” membedakannya dengan jelas dari sebutan bagi Allah tanpa menambahkan penilaian yang tidak dinyatakan dalam frasa itu sendiri.
- source_word: יִהְיֶה לְךָ לְמוֹקֵשׁ
  choice: hal itu akan menjadi jerat bagimu
  rationale: מוֹקֵשׁ adalah jerat atau perangkap, di sini dipakai sebagai metafora bagi sesuatu yang menjerumuskan. “Hal itu” secara alami merujuk pada ibadah kepada ilah-ilah mereka tanpa menentukan lebih jauh unsur yang tidak eksplisit dalam teks.
theological_decisions:
- issue: Sifat dosa yang diperingatkan
  choice: Peringatan dikaitkan secara langsung dengan beribadah kepada ilah-ilah bangsa-bangsa itu, yakni ketidaksetiaan kepada Allah.
  alternative: Peringatan umum mengenai kerusakan moral atau pengaruh kebudayaan asing.
  rationale: Klausa berikutnya secara eksplisit menyebut ibadah kepada ilah-ilah mereka. Terjemahan mempertahankan kaitan itu dan tidak mengubah ayat menjadi pernyataan umum tentang pemisahan etnis atau budaya.
- issue: Hubungan logis klausa תַעֲבֹד אֶת אֱלֹהֵיהֶם
  choice: 'Diterjemahkan secara kondisional: “jika engkau beribadah kepada ilah-ilah mereka.”'
  alternative: 'Dibaca sebagai penjelasan atau hasil yang diperkirakan: “sebab engkau akan beribadah kepada ilah-ilah mereka.”'
  rationale: כִּי dapat berfungsi dengan lebih dari satu nuansa dalam rangkaian ini. Bacaan kondisional menghasilkan peringatan yang alami, tetapi kemungkinan bacaan eksplanatoris dipertahankan dalam catatan kaki dan tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang khidmat namun mudah dipahami. “Engkau” dan akhiran “-mu” mempertahankan sapaan tunggal kolektif kepada Israel; “terhadap-Ku” memakai kapitalisasi pronomina ilahi menurut kebiasaan penerbitan Alkitab Indonesia. Susunan kalimat mengikuti hubungan larangan, tujuan pencegahan, alasan, dan akibat dalam teks Ibrani tanpa mempertahankan kekakuan sintaksisnya.
