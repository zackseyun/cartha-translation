  text: For six years you shall sow your land and gather its produce[a].
translation:
  language: id
  text: Selama enam tahun engkau harus menabur di tanahmu dan mengumpulkan hasilnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "hasil panennya."
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שֵׁשׁ שָׁנִים
  choice: Selama enam tahun
  rationale: Ungkapan bilangan dan waktu ini berfungsi sebagai kerangka durasi; 'selama' menyampaikan fungsi itu secara wajar dalam bahasa Indonesia tanpa mempertahankan kata penghubung awal secara kaku.
- source_word: תִּזְרַע
  choice: engkau harus menabur
  rationale: Bentuk imperfek orang kedua tunggal maskulin dalam konteks hukum ini memiliki daya preskriptif; 'harus' menyatakan kewajiban dengan jelas, sedangkan 'menabur' mempertahankan tindakan pertanian dalam teks sumber.
- source_word: אַרְצֶךָ
  choice: di tanahmu
  rationale: אֶרֶץ di sini menunjuk pada tanah milik atau lahan yang digarap, bukan bumi secara umum. Preposisi 'di' membuat ungkapan kegiatan menabur alami dalam bahasa Indonesia.
- source_word: וְאָסַפְתָּ
  choice: dan mengumpulkan
  rationale: אָסַף berarti mengumpulkan atau menghimpun. Pilihan ini tetap cukup luas untuk tindakan membawa masuk hasil tanah dan tidak mempersempitnya menjadi istilah panen tertentu.
- source_word: תְּבוּאָתָהּ
  choice: hasilnya
  rationale: תְּבוּאָה menunjuk pada hasil atau produksi pertanian. 'Hasilnya' ringkas dan alami, dengan akhiran '-nya' merujuk kembali kepada tanah.
