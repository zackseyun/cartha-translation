  text: וְ/שֹׁ֖חַד לֹ֣א תִקָּ֑ח כִּ֤י הַ/שֹּׁ֨חַד֙ יְעַוֵּ֣ר פִּקְחִ֔ים וִֽ/יסַלֵּ֖ף דִּבְרֵ֥י צַדִּיקִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/008.yaml
  text: And you shall not take a bribe[b][a], for a bribe blinds the clear-sighted and twists the words of the righteous.
translation:
  language: id
  text: Jangan menerima suap, sebab suap membutakan orang yang berpandangan jernih[a] dan memutarbalikkan perkataan orang-orang benar[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang yang dapat melihat dengan jelas” atau “orang yang berpengertian.” Bahasa Ibrani mempertahankan gambaran penglihatan sekaligus menyiratkan kemampuan menilai dengan baik.
    reason: lexical_alternative
  - marker: b
    text: “Perkataan orang-orang benar” dalam konteks hukum juga dapat dipahami sebagai “pernyataan” atau “perkara” orang-orang yang berada di pihak benar.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁחַד
  choice: suap
  rationale: Kata ini menunjuk pada pemberian yang dimaksudkan untuk memengaruhi keputusan secara tidak benar. “Suap” adalah istilah hukum dan moral yang paling jelas serta wajar dalam bahasa Indonesia modern.
- source_word: לֹא תִקָּח
  choice: jangan menerima
  rationale: Bentuk imperfek orang kedua tunggal dalam konteks hukum menyatakan larangan. “Jangan menerima” secara alami menyampaikan larangan menerima suap; “mengambil” akan terasa kurang tepat dalam konteks ini.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi larangan tersebut. “Sebab” mempertahankan hubungan penjelas yang ringkas dan sesuai dengan ragam bahasa hukum yang bermartabat.
- source_word: יְעַוֵּר
  choice: membutakan
  rationale: Bentuk Piel menyatakan tindakan menyebabkan kebutaan. “Membutakan” mempertahankan gambaran penglihatan sekaligus makna kiasan tentang rusaknya penilaian.
- source_word: פִּקְחִים
  choice: orang yang berpandangan jernih
  rationale: Kata ini secara harfiah berkaitan dengan orang yang dapat melihat atau bermata terbuka, dan dalam konteks ini menyiratkan kemampuan menilai dengan baik. Pilihan ini mempertahankan citra penglihatan tanpa menghilangkan makna kiasannya.
- source_word: וִיסַלֵּף
  choice: memutarbalikkan
  rationale: Kata kerja ini berarti membengkokkan, menyimpangkan, atau merusak. “Memutarbalikkan” jelas, hidup, dan cocok untuk perkataan atau pernyataan dalam konteks peradilan.
- source_word: דִּבְרֵי
  choice: perkataan
  rationale: Bentuk jamak konstruksi dari דָּבָר dapat berarti perkataan, pernyataan, perkara, atau hal. “Perkataan” paling transparan terhadap bentuk Ibrani, sementara catatan kaki mempertahankan kemungkinan makna hukumnya.
- source_word: צַדִּיקִים
  choice: orang-orang benar
  rationale: Kata ini dapat menunjuk pada orang yang benar secara moral ataupun pihak yang berada di pihak benar dalam perkara hukum. “Orang-orang benar” mempertahankan keluasan makna tersebut tanpa mempersempitnya.
theological_decisions:
- issue: Cakupan makna צַדִּיקִים dalam konteks hukum
  choice: orang-orang benar
  alternative: orang-orang yang berada di pihak benar
  rationale: Teks Ibrani memungkinkan nuansa moral dan yuridis. Terjemahan utama mempertahankan ketegangan itu, sedangkan catatan kaki menjelaskan kemungkinan pembacaan hukum.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Larangan dirumuskan secara alami dengan “jangan menerima,” sementara citra kebutaan dan pemutarbalikan dalam teks Ibrani dipertahankan. Semua penanda catatan kaki muncul dalam teks utama.
