  text: וְ/הַ/שְּׁבִיעִ֞ת תִּשְׁמְטֶ֣/נָּה וּ/נְטַשְׁתָּ֗/הּ וְ/אָֽכְלוּ֙ אֶבְיֹנֵ֣י עַמֶּ֔/ךָ וְ/יִתְרָ֕/ם תֹּאכַ֖ל חַיַּ֣ת הַ/שָּׂדֶ֑ה כֵּֽן תַּעֲשֶׂ֥ה לְ/כַרְמְ/ךָ֖ לְ/זֵיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/011.yaml
  text: But in the seventh year you shall let it rest and leave it alone[a], so that the poor of your people may eat; and what they leave, the wild animals of the field may eat[b]. You shall do the same with your vineyard and your olive grove.
translation:
  language: id
  text: Namun, pada tahun ketujuh haruslah kamu membiarkannya beristirahat dan tidak menggarapnya[a], supaya orang-orang miskin di antara bangsamu dapat makan; dan sisanya akan dimakan oleh binatang liar di padang[b]. Lakukanlah hal yang sama terhadap kebun anggurmu dan kebun zaitunmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melepaskannya dan meninggalkannya”; kedua kata kerja Ibrani menekankan penghentian penggarapan biasa dan pembiaran tanah tanpa digarap pada tahun ketujuh.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “binatang di padang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַשְּׁבִיעִת
  choice: Namun, pada tahun ketujuh
  rationale: Konjungsi dan bilangan tingkat ini secara kontekstual mengontraskan tahun ketujuh dengan enam tahun penggarapan dalam ayat sebelumnya.
- source_word: תִּשְׁמְטֶנָּה
  choice: haruslah kamu membiarkannya beristirahat
  rationale: Kata kerja שׁמט di sini menunjuk pada pelepasan tanah dari penggarapan biasa; akhiran feminin merujuk pada tanah dalam ayat sebelumnya.
- source_word: וּנְטַשְׁתָּהּ
  choice: dan tidak menggarapnya
  rationale: Dalam konteks hukum pertanian, נטשׁ berarti meninggalkan tanah tanpa pengelolaan normal. Ungkapan ini menyampaikan tindakan yang dimaksud tanpa memberi kesan bahwa tanah ditelantarkan secara permanen.
- source_word: אֶבְיֹנֵי עַמֶּךָ
  choice: orang-orang miskin di antara bangsamu
  rationale: אביון menunjuk kepada orang miskin atau berkekurangan; frasa ini mempertahankan hubungan mereka dengan komunitas Israel secara alami dalam bahasa Indonesia.
- source_word: וְיִתְרָם
  choice: dan sisanya
  rationale: Bentuk dari יתר dengan akhiran jamak merujuk pada apa yang tersisa setelah orang-orang miskin makan. Bahasa Ibrani memungkinkan nuansa 'sisa mereka' atau 'yang mereka tinggalkan'.
- source_word: תֹּאכַל חַיַּת הַשָּׂדֶה
  choice: akan dimakan oleh binatang liar di padang
  rationale: חית השדה adalah ungkapan kolektif bagi satwa liar. Susunan pasif Indonesia menjaga urutan informasi dan menyampaikan hasil yang diperintahkan hukum ini.
- source_word: כֵּן תַּעֲשֶׂה
  choice: Lakukanlah hal yang sama
  rationale: Ungkapan ini menerapkan ketentuan yang sama secara langsung pada kebun anggur dan zaitun.
- source_word: לְכַרְמְךָ
  choice: terhadap kebun anggurmu
  rationale: כרם berarti kebun anggur, yakni bidang pertanian berikutnya yang dikenai ketentuan tahun ketujuh.
- source_word: לְזֵיתֶךָ
  choice: kebun zaitunmu
  rationale: זית berbentuk tunggal kolektif dan dalam kesejajaran dengan kebun anggur paling wajar dipahami sebagai kebun atau tanaman zaitun secara kolektif.
