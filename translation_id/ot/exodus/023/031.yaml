id: EXO.23.31
reference: Exodus 23:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/שַׁתִּ֣י אֶת גְּבֻלְ/ךָ֗ מִ/יַּם סוּף֙ וְ/עַד יָ֣ם פְּלִשְׁתִּ֔ים וּ/מִ/מִּדְבָּ֖ר עַד הַ/נָּהָ֑ר כִּ֣י אֶתֵּ֣ן בְּ/יֶדְ/כֶ֗ם אֵ֚ת יֹשְׁבֵ֣י הָ/אָ֔רֶץ וְ/גֵרַשְׁתָּ֖/מוֹ מִ/פָּנֶֽי/ךָ־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/031.yaml
  text: And I will set your border from the Red Sea to the Sea of the Philistines[a], and from the wilderness to the River; for I will give the inhabitants of the land into your hand[b], and you will drive them out from before you.
translation:
  language: id
  text: Aku akan menetapkan batas wilayahmu dari Laut Merah[a] sampai Laut Filistin, dan dari padang gurun sampai Sungai itu[b], sebab Aku akan menyerahkan penduduk negeri itu ke dalam tanganmu, dan engkau akan mengusir mereka dari hadapanmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah dalam bahasa Ibrani: “Laut Teberau.”'
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah Sungai Efrat.
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׁתִּי
  choice: Aku akan menetapkan
  rationale: Bentuk perfektum dengan waw dalam konteks janji ilahi berdaya futur; “menetapkan” wajar untuk penentuan batas wilayah.
- source_word: גְּבֻלְךָ
  choice: batas wilayahmu
  rationale: גְּבוּל menunjuk batas teritorial; frasa ini lebih jelas dalam bahasa Indonesia daripada hanya “batasmu”.
- source_word: מִיַּם סוּף
  choice: dari Laut Merah[a]
  rationale: “Laut Merah” adalah sebutan geografis yang dikenal luas; arti harfiah nama Ibraninya dipertahankan dalam catatan kaki.
- source_word: יָם פְּלִשְׁתִּים
  choice: Laut Filistin
  rationale: Terjemahan ini mempertahankan penamaan etnis-geografis teks Ibrani tanpa langsung menggantinya dengan identifikasi modern “Laut Tengah”.
- source_word: וּמִמִּדְבָּר
  choice: dan dari padang gurun
  rationale: מִדְבָּר dapat berarti kawasan tandus atau belantara; “padang gurun” alami dan sesuai konteks geografis.
- source_word: הַנָּהָר
  choice: Sungai itu[b]
  rationale: Artikel pada kata Ibrani menandai sungai yang sudah dikenal; ungkapan tersebut lazim merujuk pada Sungai Efrat, yang dijelaskan dalam catatan kaki.
- source_word: כִּי
  choice: sebab
  rationale: Konjungsi ini memberi dasar bagi janji tentang batas wilayah.
- source_word: אֶתֵּן בְּיֶדְכֶם
  choice: Aku akan menyerahkan ... ke dalam tanganmu
  rationale: “Menyerahkan” menyampaikan makna penyerahan ke dalam kuasa, sedangkan “ke dalam tanganmu” mempertahankan citra konkret idiom Ibrani. Pergeseran dari bentuk jamak “tangan kalian” ke bentuk tunggal mengikuti peralihan orang yang memang terdapat dalam ayat Ibrani dan menghasilkan bahasa Indonesia yang koheren dengan sapaan tunggal di sekitarnya.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: penduduk negeri itu
  rationale: Partisip ini berarti orang-orang yang mendiami negeri tersebut; “penduduk” ringkas dan alami.
- source_word: וְגֵרַשְׁתָּמוֹ
  choice: dan engkau akan mengusir mereka
  rationale: גּרשׁ berarti menghalau atau mengusir; bentuk futur mempertahankan corak janji sekaligus tindakan Israel.
- source_word: מִפָּנֶיךָ
  choice: dari hadapanmu
  rationale: Ungkapan ini mempertahankan idiom Ibrani secara bermartabat dan tetap mudah dipahami.
theological_decisions:
- issue: Identifikasi geografis יַם סוּף
  choice: Laut Merah dalam teks utama, dengan “Laut Teberau” dalam catatan kaki
  alternative: Laut Teberau dalam teks utama
  rationale: Keputusan ini terutama bersifat leksikal-geografis. Sebutan tradisional yang dikenal pembaca dipakai dalam teks, sementara arti nama Ibrani dibuat transparan melalui catatan kaki.
- issue: Hubungan tindakan ilahi dan tindakan Israel
  choice: 'Mempertahankan kedua klausa: Allah menyerahkan penduduk, lalu Israel mengusir mereka'
  alternative: Melebur keduanya menjadi satu tindakan ilahi atau manusiawi
  rationale: Teks Ibrani menempatkan kedaulatan tindakan Allah dan tanggung jawab Israel berdampingan; ketegangan ini tidak disederhanakan.
- issue: Peralihan jumlah dalam sapaan
  choice: Menerjemahkan secara koheren dengan sapaan tunggal “-mu/engkau”
  alternative: Mempertahankan “tangan kalian” lalu beralih ke “engkau”
  rationale: Teks Ibrani memiliki bentuk jamak pada בְיֶדְכֶם di tengah bentuk-bentuk tunggal. Bahasa Indonesia tidak perlu menonjolkan peralihan morfologis ini bila rujukannya tetap umat Israel sebagai satu kesatuan; makna kolektif tidak diubah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Aku” mempertahankan ujaran langsung Allah; “engkau” menjaga sapaan tunggal kolektif dalam konteks perjanjian. Susunan geografis dan paralelisme ayat dipertahankan tanpa kekakuan yang tidak perlu.
