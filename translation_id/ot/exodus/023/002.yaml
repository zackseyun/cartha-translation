  yaml_path: translation/ot/exodus/023/002.yaml
  text: You shall not follow the many to do evil[a], and you shall not testify in a dispute so as to turn aside after the many, to pervert justice.
translation:
  language: id
  text: Jangan mengikuti orang banyak untuk berbuat jahat. Jangan memberi kesaksian dalam suatu perkara untuk berpihak kepada orang banyak dan membelokkan keadilan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Jangan menjawab dalam suatu perkara dengan berpihak kepada orang banyak untuk membengkokkan keputusan hukum.”'
    reason: Alternatif ini mempertahankan arti umum תַעֲנֶה sebagai “menjawab” dan menerjemahkan objek hukum yang tersirat pada kata kerja terakhir sebagai “keputusan hukum”.
lexical_decisions:
- source_word: תִהְיֶה אַחֲרֵי רַבִּים
  choice: mengikuti orang banyak
  rationale: Ungkapan היה אחרי secara idiomatis berarti mengikuti atau berpihak kepada; רַבִּים menunjuk pada orang banyak atau mayoritas. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan tekanan terhadap pengaruh kelompok.
- source_word: לְרָעֹת
  choice: untuk berbuat jahat
  rationale: 'Bentuk dengan ל menyatakan tujuan atau hasil, sedangkan רָעֹת memiliki daya etis yang kuat: kejahatan atau perbuatan jahat.'
- source_word: תַעֲנֶה
  choice: bersaksi
  rationale: Dalam konteks hukum bersama עַל רִיב, ענה menunjuk pada pemberian kesaksian atau jawaban sebagai saksi; 'bersaksi' memperjelas latar yudisial.
- source_word: עַל רִיב
  choice: dalam suatu perkara
  rationale: רִיב dapat berarti perselisihan, sengketa, atau perkara hukum. 'Dalam suatu perkara' cukup luas sekaligus wajar dalam konteks kesaksian.
- source_word: לִנְטֹת
  choice: dengan menyimpang
  rationale: נטה berarti condong, berbelok, atau menyimpang. Dalam konteks hukum, bentuk ini menggambarkan penyimpangan dari yang benar; konstruksi Indonesia ini menyatakan cara atau akibat yang dimaksud.
- source_word: אַחֲרֵי רַבִּים
  choice: mengikuti orang banyak
  rationale: Pengulangan frasa sumber dipertahankan untuk menjaga penekanan retoris pada tekanan mayoritas.
- source_word: לְהַטֹּת
  choice: sehingga membelokkan keadilan
  rationale: Bentuk Hifil dari נטה berarti menyebabkan sesuatu menyimpang atau dibelokkan. Objek 'keadilan' tersirat oleh konteks perkara dan kesaksian, lalu dinyatakan demi kejelasan dalam bahasa Indonesia.
theological_decisions:
- issue: Daya hukum-etis klausa terakhir
  choice: menyatakan objek hukum yang tersirat sebagai 'keadilan'
  alternative: membelokkan; membengkokkan keputusan hukum
  rationale: Bahasa Ibrani tidak menyebut objek secara eksplisit, tetapi konteks kesaksian dalam perkara menunjukkan bahwa yang dibelokkan ialah keadilan atau putusan. 'Keadilan' memperjelas maksud tanpa memasukkan kekhasan doktrinal.
- issue: Hubungan antara kedua infinitif נטה
  choice: membedakan 'menyimpang' dan bentuk kausatif 'membelokkan'
  alternative: menggunakan 'menyimpang' atau 'membelokkan' pada kedua tempat
  rationale: Perbedaan ini mencerminkan perubahan dari Qal לִנְטֹת ke Hifil לְהַטֹּת serta mempertahankan perkembangan dari penyimpangan saksi menuju pemutarbalikan keadilan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-etis yang lugas dan bermartabat. 'Orang banyak' dipilih daripada 'mayoritas' agar dekat dengan pengulangan Ibrani dan tetap mudah dipahami; 'perkara' menandai konteks hukum tanpa menjadi terlalu teknis.
