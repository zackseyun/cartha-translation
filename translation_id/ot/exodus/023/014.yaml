  text: Three times in the year you shall keep a feast to me[a].
translation:
  language: id
  text: Tiga kali dalam setahun engkau harus merayakan hari raya bagi-Ku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tiga kaki”. Ungkapan Ibrani ini menunjuk pada tiga kesempatan perayaan ziarah dalam setahun.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֹשׁ רְגָלִים
  choice: Tiga kali
  rationale: Ungkapan Ibrani ini secara harfiah berarti “tiga kaki”, tetapi secara idiomatis menunjuk pada tiga kesempatan perayaan ziarah. “Tiga kali” menyampaikan frekuensinya secara alami dalam bahasa Indonesia, sedangkan nuansa ziarah dijelaskan dalam catatan kaki.
- source_word: תָּחֹג
  choice: engkau harus merayakan hari raya
  rationale: Kata kerja חגג berarti merayakan atau menyelenggarakan suatu perayaan keagamaan. Bentuk “harus” sesuai dengan gaya ketentuan hukum, dan “hari raya” mempertahankan makna perayaan ibadah.
- source_word: לִי
  choice: bagi-Ku
  rationale: Preposisi ל menandai bahwa perayaan tersebut ditujukan atau dipersembahkan kepada TUHAN. “Bagi-Ku” alami dalam bahasa Indonesia dan mempertahankan sapaan orang pertama.
- source_word: בַּשָּׁנָה
  choice: dalam setahun
  rationale: Secara harfiah berarti “dalam tahun itu/dalam setahun”. Bersama “tiga kali”, ungkapan “dalam setahun” menyampaikan frekuensi tahunan secara jelas dan wajar.
