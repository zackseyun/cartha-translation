  text: מְעַ֥ט מְעַ֛ט אֲגָרְשֶׁ֖/נּוּ מִ/פָּנֶ֑י/ךָ עַ֚ד אֲשֶׁ֣ר תִּפְרֶ֔ה וְ/נָחַלְתָּ֖ אֶת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/030.yaml
  text: Little by little I will drive them out from before you[b][a], until you become fruitful and take possession of the land.
translation:
  language: id
  text: Sedikit demi sedikit Aku akan mengusir mereka dari hadapanmu,[a] sampai kamu bertambah banyak dan memiliki negeri itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Ibrani memakai objek tunggal maskulin, “dia”; bentuk tunggal itu tampaknya merujuk secara kolektif kepada penduduk atau bangsa-bangsa negeri tersebut.
    reason: lexical_alternative
  - marker: b
    text: Atau “mewarisi negeri itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַט מְעַט
  choice: Sedikit demi sedikit
  rationale: Pengulangan מְעַט menyatakan tindakan yang berlangsung secara bertahap; ungkapan Indonesia ini alami sekaligus mempertahankan bentuk pengulangan.
- source_word: אֲגָרְשֶׁנּוּ
  choice: Aku akan mengusir mereka
  rationale: Verba גרשׁ berarti 'mengusir'. Sufiks objeknya berbentuk maskulin tunggal, tetapi dalam konteks merujuk secara kolektif kepada penduduk atau bangsa-bangsa negeri itu; bentuk jamak menghasilkan bahasa Indonesia yang jelas, sementara bentuk Ibraninya dijelaskan dalam catatan kaki.
- source_word: מִפָּנֶיךָ
  choice: dari hadapanmu
  rationale: Terjemahan ini mempertahankan idiom Ibrani yang berarti menyingkirkan mereka dari depan atau keberadaan Israel.
- source_word: עַד אֲשֶׁר
  choice: sampai
  rationale: Gabungan ini menandai batas waktu atau keadaan yang hendak dicapai oleh tindakan bertahap tersebut.
- source_word: תִּפְרֶה
  choice: kamu bertambah banyak
  rationale: Dalam konteks ini פרה menunjuk pada pertambahan jumlah penduduk Israel hingga sanggup menempati negeri itu. Pilihan ini lebih langsung daripada ungkapan metaforis 'berbuah' dalam bahasa Indonesia.
- source_word: וְנָחַלְתָּ
  choice: dan menduduki
  rationale: נחל dapat berarti menerima sebagai warisan atau mengambil sebagai milik. Dalam konteks penempatan di negeri itu, 'menduduki' menyampaikan penguasaan dan penghunian secara alami tanpa menutup kemungkinan nuansa warisan, yang dicatat dalam catatan kaki.
- source_word: אֶת־הָאָרֶץ
  choice: negeri itu
  rationale: Dalam konteks, הָאָרֶץ menunjuk kepada negeri yang dijanjikan; 'negeri itu' jelas dan wajar dalam bahasa Indonesia modern.
theological_decisions:
- issue: Sufiks objek tunggal kolektif dalam janji pengusiran
  choice: Memakai 'mereka' dalam teks utama dan menjelaskan bentuk tunggal Ibrani dalam catatan kaki.
  alternative: Memakai 'dia' untuk mencerminkan bentuk gramatikal maskulin tunggal secara langsung.
  rationale: Acuannya adalah penduduk atau bangsa-bangsa negeri itu secara kolektif. Bahasa Indonesia memerlukan bentuk jamak agar rujukannya tidak disalahpahami sebagai satu laki-laki tertentu, sementara catatan kaki menjaga transparansi terhadap bentuk sumber.
- issue: Nuansa נחל antara warisan dan penguasaan
  choice: Menerjemahkan 'menduduki negeri itu'.
  alternative: Menerjemahkan 'mewarisi negeri itu' atau 'memiliki negeri itu'.
  rationale: Konteks menekankan pertambahan jumlah hingga Israel dapat menguasai dan menempati negeri tersebut. Namun, nuansa menerima sebagai warisan tetap sah dan dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Ungkapan 'Sedikit demi sedikit' mempertahankan pengulangan sumber; 'dari hadapanmu' mempertahankan citra idiom Ibrani tanpa terasa terlalu arkais.
