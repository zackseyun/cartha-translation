  to: Janganlah engkau bersujud kepada ilah-ilah mereka atau mengabdi kepada mereka, dan janganlah engkau bertindak seperti mereka bertindak. Sebaliknya, engkau harus merobohkan semuanya sampai tuntas dan menghancurkan tugu-tugu batu mereka[a] berkeping-keping.
