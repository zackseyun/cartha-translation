base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/024.yaml
  text: You shall not bow down to their gods[a], nor serve them, nor do according to their deeds; rather, you shall surely tear them down and surely shatter their pillars.
translation:
  language: id
  text: Janganlah engkau bersujud kepada ilah-ilah mereka atau mengabdi kepada mereka, dan janganlah engkau bertindak seperti mereka bertindak. Sebaliknya, engkau harus merobohkan semuanya sampai tuntas dan menghancurkan tugu-tugu batu mereka[a] berkeping-keping.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tiang-tiang pemujaan mereka” atau “batu-batu tegak mereka”. Istilah Ibrani menunjuk pada monumen batu tegak yang berkaitan dengan pemujaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: sujud
  rationale: Kata kerja ini menunjuk pada tindakan konkret membungkuk atau merebahkan diri sebagai penghormatan. “Sujud” mempertahankan tindakan lahiriah itu tanpa meleburkannya ke dalam istilah umum “menyembah”.
- source_word: לֵאלֹהֵיהֶם
  choice: kepada ilah-ilah mereka
  rationale: Preposisi ל sesudah kata kerja bersujud secara alami diterjemahkan “kepada”. “Ilah-ilah” menandai dewa-dewa bangsa-bangsa lain, bukan Allah Israel.
- source_word: תָעָבְדֵם
  choice: mengabdi kepada mereka
  rationale: עבד mencakup pelayanan dan pengabdian, termasuk pelayanan ritual. “Mengabdi” membedakannya dari tindakan sujud pada klausa sebelumnya sekaligus menyampaikan loyalitas keagamaan.
- source_word: תַעֲשֶׂה כְּמַעֲשֵׂיהֶם
  choice: berbuat menurut perbuatan mereka
  rationale: Ungkapan ini mempertahankan susunan dan keluasan makna Ibrani, yang dalam konteks mencakup peniruan praktik keagamaan bangsa-bangsa tersebut.
- source_word: כִּי
  choice: sebaliknya
  rationale: Di sini כִּי memperkenalkan tindakan yang berlawanan dengan larangan sebelumnya; “sebaliknya” menyatakan daya adversatif itu secara wajar dalam bahasa Indonesia.
- source_word: הָרֵס תְּהָרְסֵם
  choice: harus merobohkan ... sampai tuntas
  rationale: Gabungan infinitif absolut dan kata kerja finit memberi penegasan kuat. “Harus ... sampai tuntas” menyampaikan tuntutan dan intensitas penghancuran tersebut.
- source_word: וְשַׁבֵּר תְּשַׁבֵּר
  choice: menghancurkan ... berkeping-keping
  rationale: Pengulangan bentuk verbal menegaskan tindakan memecahkan. “Berkeping-keping” menyampaikan intensitas itu secara alami dan sesuai dengan benda batu.
- source_word: מַצֵּבֹתֵיהֶם
  choice: tugu-tugu batu mereka
  rationale: מַצֵּבָה adalah batu yang ditegakkan, biasanya sebagai monumen kultis. “Tugu-tugu batu” menyatakan bentuk bendanya dengan jelas; fungsi kultis dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Sifat tindakan yang dilarang terhadap ilah-ilah asing
  choice: 'Mempertahankan dua tindakan berbeda: “sujud” dan “mengabdi”.'
  alternative: Menerjemahkan keduanya dengan bahasa penyembahan, misalnya “menyembah atau beribadah kepada mereka”.
  rationale: Bahasa Ibrani memakai dua kata kerja berbeda. Pembedaan ini mempertahankan larangan terhadap penghormatan lahiriah maupun pengabdian keagamaan yang berkelanjutan.
- issue: Acuan objek pada perintah הָרֵס תְּהָרְסֵם
  choice: Menjelaskan objeknya sebagai benda-benda pemujaan yang berkaitan dengan ilah-ilah bangsa itu.
  alternative: Menerjemahkan pronomina secara harfiah sebagai “merobohkan mereka”, yang dapat dipahami seolah-olah ilah-ilah itu sendiri merupakan objek fisik.
  rationale: Akhiran objek Ibrani secara gramatikal dapat menunjuk kembali kepada “ilah-ilah mereka”, tetapi perintah berikutnya secara eksplisit menyebut tugu-tugu batu yang nyata. Terjemahan ini menyampaikan sasaran praktis perintah tanpa menghilangkan polemik keras terhadap penyembahan berhala.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “janganlah engkau” mempertahankan nada perintah perjanjian; “ilah-ilah” membedakan dewa-dewa bangsa lain dari Allah. Penegasan ganda dalam bahasa Ibrani disampaikan dengan “sampai tuntas” dan “berkeping-keping” agar kuat tetapi tetap alami.
