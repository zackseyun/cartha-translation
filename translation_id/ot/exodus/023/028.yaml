source:
  edition: WLC
  text: וְ/שָׁלַחְתִּ֥י אֶת הַ/צִּרְעָ֖ה לְ/פָנֶ֑י/ךָ וְ/גֵרְשָׁ֗ה אֶת הַ/חִוִּ֧י אֶת הַֽ/כְּנַעֲנִ֛י וְ/אֶת הַ/חִתִּ֖י מִ/לְּ/פָנֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/028.yaml
  text: And I will send the hornet ahead of you[a], and it will drive out the Hivite, the Canaanite, and the Hittite from before you.
translation:
  language: id
  text: Aku akan mengirim tabuhan itu mendahuluimu[a], dan tabuhan itu akan menghalau orang Hewi, orang Kanaan, dan orang Het dari hadapanmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin gambaran kiasan tentang kepanikan atau sarana tekanan ilahi lain yang dikirim mendahului Israel; kata Ibrani ini biasanya berarti “tabuhan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלַחְתִּי
  choice: Aku akan mengirim
  rationale: Bentuk perfektif orang pertama tunggal dengan waw dalam konteks ini menyatakan janji tentang tindakan mendatang. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan tindakan langsung Allah.
- source_word: הַצִּרְעָה
  choice: tabuhan
  rationale: Kata Ibrani ini pada arti dasarnya menunjuk kepada tabuhan atau serangga penyengat. Bentuk tunggal tertentu dipertahankan sebagai bentuk tunggal representatif; kemungkinan pemakaian kiasan dijelaskan dalam catatan kaki.
- source_word: לְפָנֶיךָ
  choice: mendahului engkau
  rationale: Ungkapan harfiahnya berarti 'di hadapanmu', tetapi di sini menunjuk kepada gerakan atau tindakan yang berlangsung lebih dahulu. 'Mendahului engkau' menyampaikan hubungan spasial dan temporal secara jelas.
- source_word: וְגֵרְשָׁה
  choice: dan tabuhan itu akan menghalau
  rationale: Kata kerja גרשׁ berarti menghalau atau mengusir. Subjek diulang agar rujukan bentuk feminin tunggal kepada 'tabuhan' jelas dan alami dalam bahasa Indonesia.
- source_word: הַחִוִּי
  choice: orang Hewi
  rationale: Bentuk nama bangsa yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: הַכְּנַעֲנִי
  choice: orang Kanaan
  rationale: Bentuk nama bangsa yang baku dan mudah dipahami dalam bahasa Indonesia.
- source_word: הַחִתִּי
  choice: orang Het
  rationale: Bentuk nama bangsa yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: מִלְּפָנֶיךָ
  choice: dari hadapanmu
  rationale: Mempertahankan ungkapan spasial Ibrani yang menyatakan penyingkiran dari hadapan atau jalur Israel, tanpa mempersempit maknanya.
theological_decisions:
- issue: Apakah הַצִּרְעָה harus dipahami secara harfiah atau kiasan
  choice: Diterjemahkan secara leksikal sebagai 'tabuhan' dalam teks utama.
  alternative: Dipahami sebagai gambaran kiasan bagi kepanikan, kengerian, wabah, atau tekanan ilahi lainnya.
  rationale: Arti leksikal yang paling langsung ialah tabuhan atau serangga penyengat. Karena konteks tidak mengharuskan penafsiran kiasan tertentu, teks utama mempertahankan arti konkret, sedangkan kemungkinan kiasan disampaikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti 'Aku' dan 'engkau' mempertahankan tuturan ilahi langsung serta bentuk orang kedua tunggal dalam bahasa Ibrani. Susunan kalimat dibuat alami tanpa menghapus pengulangan subjek yang diperlukan untuk kejelasan.
