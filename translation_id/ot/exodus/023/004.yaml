  text: כִּ֣י תִפְגַּ֞ע שׁ֧וֹר אֹֽיִבְ/ךָ֛ א֥וֹ חֲמֹר֖/וֹ תֹּעֶ֑ה הָשֵׁ֥ב תְּשִׁיבֶ֖/נּוּ לֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/004.yaml
  text: If you come upon your enemy’s ox or his donkey going astray[a], you must surely return it to him.
translation:
  language: id
  text: Jika engkau menjumpai sapi jantan milik musuhmu atau keledainya sedang tersesat[a], engkau harus mengembalikannya kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sedang berkeliaran.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Jika
  rationale: Dalam konteks hukum kasuistik, כִּי memperkenalkan syarat. “Jika” mempertahankan bentuk protasis, meskipun “ketika” juga mungkin.
- source_word: תִפְגַּע
  choice: engkau menjumpai
  rationale: Kata פגע di sini berarti berjumpa dengan atau menemukan secara kebetulan; “menjumpai” alami dan tidak menyiratkan pencarian sengaja.
- source_word: שׁוֹר
  choice: sapi jantan
  rationale: שׁוֹר menunjuk pada hewan jenis sapi, sering kali jantan dalam konteks agraris. “Sapi jantan” lebih mudah dipahami pembaca modern daripada “lembu” dan tetap cukup spesifik.
- source_word: אֹיִבְךָ
  choice: milik musuhmu
  rationale: אֹיֵב berarti “musuh”. Bentuk kepemilikan diterjemahkan secara alami tanpa melunakkan ketegangan etisnya.
- source_word: חֲמֹרוֹ
  choice: keledainya
  rationale: חֲמוֹר adalah istilah biasa untuk keledai; sufiks orang ketiga tunggal dipertahankan sebagai “-nya”.
- source_word: תֹּעֶה
  choice: sedang tersesat
  rationale: Partisipel dari תעה menggambarkan hewan yang menyimpang atau berkeliaran dari jalurnya. “Sedang tersesat” mempertahankan keadaan yang berlangsung; alternatif “sedang berkeliaran” dicatat dalam catatan kaki.
- source_word: הָשֵׁב תְּשִׁיבֶנּוּ
  choice: engkau harus mengembalikannya
  rationale: Gabungan infinitif absolut dan verba finit dari שוב memberi penegasan kuat pada kewajiban. “Harus” menyampaikan daya perintah dan penekanannya secara wajar dalam bahasa Indonesia.
- source_word: לוֹ
  choice: kepadanya
  rationale: Pronomina ini merujuk kembali kepada musuh sebagai pemilik hewan. Terjemahan langsung “kepadanya” menghindari penjelasan tambahan seperti “kepada pemiliknya”.
theological_decisions:
- issue: Kewajiban etis terhadap musuh
  choice: Mempertahankan sebutan “musuhmu” dan perintah tegas untuk mengembalikan hewannya.
  alternative: Melunakkan hubungan itu menjadi “sesamamu” atau menafsirkan אֹיֵב sebagai “orang yang membencimu”.
  rationale: Teks Ibrani secara eksplisit menyebut “musuhmu”. Terjemahan mempertahankan ketegangan moral berupa tindakan adil dan penuh belas kasih terhadap seorang lawan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “engkau” dipakai untuk mempertahankan sapaan tunggal dalam teks Ibrani. Susunan kalimat dibuat alami sambil menjaga bentuk hukum bersyarat dan penegasan perintah.
