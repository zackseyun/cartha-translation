  text: And you shall not show partiality to a poor man in his lawsuit[a].
translation:
  language: id
  text: Janganlah engkau memihak kepada orang miskin dalam perkaranya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menghormati orang miskin dalam perkaranya.” Kata kerja Ibrani secara lebih harfiah dapat berarti “menghormati”, tetapi dalam konteks peradilan ini maksudnya adalah menunjukkan keberpihakan atau perlakuan istimewa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: Tidak diterjemahkan secara tersendiri
  rationale: Dalam bahasa Ibrani, konjungsi ini menghubungkan larangan tersebut dengan hukum-hukum di sekitarnya. Dalam bahasa Indonesia, awal kalimat tanpa kata penghubung lebih alami dan tidak mengubah hubungan antarkalimat.
- source_word: דָל
  choice: orang miskin
  rationale: Kata ini menunjuk kepada seseorang yang miskin, rendah kedudukannya, atau lemah secara sosial-ekonomi. Bentuk tunggalnya tetap terwakili secara wajar oleh 'orang miskin'.
- source_word: לֹא תֶהְדַּר
  choice: janganlah engkau memihak
  rationale: Secara lebih harfiah, verba הדר dapat berarti 'menghormati', tetapi dalam konteks peradilan bentuk ini menyatakan pemberian perlakuan istimewa atau keberpihakan. 'Memihak' menyampaikan larangan hukum itu dengan jelas dan alami.
- source_word: בְּרִיבוֹ
  choice: dalam perkaranya
  rationale: רִיב dapat berarti perselisihan atau perkara hukum. Konteks hukum mendukung 'perkara', sedangkan akhiran orang ketiga tunggal diterjemahkan 'nya'.
theological_decisions:
- issue: Kepedulian kepada orang miskin tanpa keberpihakan dalam pengadilan
  choice: Ayat ini melarang keberpihakan kepada orang miskin dalam perkaranya.
  alternative: Ayat ini memerintahkan agar orang miskin dihormati secara umum.
  rationale: Keterangan 'dalam perkaranya' dan konteks hukum menunjukkan bahwa yang dibicarakan ialah keadilan yang tidak memihak, bukan penolakan terhadap belas kasih kepada orang miskin. Terjemahan mempertahankan ketegangan bahwa status miskin pun tidak boleh menjadi dasar perlakuan istimewa dalam pengadilan.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Bentuk 'janganlah engkau' mempertahankan nada perintah hukum sekaligus sapaan tunggal dalam teks Ibrani; 'perkara' terdengar alami dalam konteks hukum tanpa membatasi makna pada gugatan formal modern.
