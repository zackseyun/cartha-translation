base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/022.yaml
  text: But if you carefully obey his voice and do all that I speak[b][a], then I will be an enemy to your enemies and an adversary to your adversaries.
translation:
  language: id
  text: Namun, jika kamu sungguh-sungguh mendengarkan suaranya[a] dan melakukan semua yang Kufirmankan[b], Aku akan menjadi musuh bagi musuhmu dan menjadi lawan bagi lawanmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jika kamu menaati suaranya dengan sungguh-sungguh.” Bahasa Ibrani memakai infinitif absolut yang diikuti verba finit untuk memberi penegasan pada tindakan mendengar, yang dalam konteks ini mencakup ketaatan.
    reason: lexical_alternative
  - marker: b
    text: Ayat ini beralih dari “suaranya” kepada “Kufirmankan,” sehingga mempertahankan hubungan erat antara sang utusan dan TUHAN dalam konteks ini.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי אִם
  choice: Namun, jika
  rationale: Gabungan ini menyatakan syarat yang berlawanan dengan peringatan sebelumnya; frasa ini wajar dan jelas dalam bahasa Indonesia.
- source_word: שָׁמֹעַ תִּשְׁמַע
  choice: sungguh-sungguh mendengarkan
  rationale: Infinitif absolut yang diikuti verba finit memberi penegasan. Pilihan ini mempertahankan citra mendengar sekaligus, dalam konteks, menyiratkan ketaatan tanpa menghapus alternatif leksikalnya.
- source_word: בְּקֹלוֹ
  choice: suaranya
  rationale: Mempertahankan ungkapan personal Ibrani dan kaitannya dengan utusan yang disebut dalam konteks sebelumnya.
- source_word: וְעָשִׂיתָ כֹּל אֲשֶׁר אֲדַבֵּר
  choice: dan melakukan semua yang Kufirmankan
  rationale: Mempertahankan peralihan dari orang ketiga, 'suaranya', ke firman TUHAN dalam orang pertama. 'Kufirmankan' sesuai dengan ragam Alkitab yang bermartabat dan menunjuk pada ujaran ilahi.
- source_word: וְאָיַבְתִּי אֶת אֹיְבֶיךָ
  choice: Aku akan menjadi musuh bagi musuhmu
  rationale: Menjaga hubungan akar dan kesejajaran antara verba איב dan nomina אֹיְבֶיךָ, bukan mereduksinya menjadi sekadar 'menentang'.
- source_word: וְצַרְתִּי אֶת צֹרְרֶיךָ
  choice: dan lawan bagi lawanmu
  rationale: Mempertahankan permainan kata dari akar צרר serta variasinya terhadap klausa sebelumnya. Kata kerja bantu 'menjadi' dipahami dari klausa paralel dan tidak perlu diulang.
theological_decisions:
- issue: Peralihan acuan antara 'suaranya' dan 'Kufirmankan'
  choice: Mempertahankan peralihan dari suara sang utusan kepada perkataan TUHAN dalam orang pertama.
  alternative: Menyelaraskan kedua klausa seolah-olah keduanya hanya merujuk kepada utusan atau keduanya langsung kepada TUHAN.
  rationale: Teks Ibrani menghubungkan erat suara utusan dengan firman TUHAN, tetapi tidak menjelaskan hubungan itu. Terjemahan mempertahankan ketegangan teologis tersebut tanpa menyelesaikannya secara tafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kufirmankan' dipilih untuk ujaran ilahi; bentuk tunggal 'kamu' mengikuti sapaan maskulin tunggal dalam teks Ibrani yang mewakili Israel. Penanda catatan kaki ditempatkan tepat setelah frasa terkait.
