base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/027.yaml
  text: I will send my terror ahead of you[a], and I will throw into confusion all the people among whom you come[c][b], and I will make all your enemies turn their backs to you.
translation:
  language: id
  text: Aku akan mengirimkan kengerian-Ku mendahuluimu[a]. Aku akan mengacaukan semua bangsa yang kaudatangi[b], dan Aku akan membuat semua musuhmu berbalik dan membelakangimu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kedahsyatan-Ku” atau “ketakutan yang Kutimbulkan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “membuat panik” atau “menggemparkan.”'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “Aku akan memberikan semua musuhmu kepadamu sebagai tengkuk.” Ungkapan Ibrani ini berarti bahwa mereka akan berbalik dan melarikan diri darimu.'
    reason: idiom_explanation
lexical_decisions:
- source_word: אֵימָתִי
  choice: kengerian dari-Ku
  rationale: אֵימָה menunjuk pada kengerian, kedahsyatan, atau rasa takut yang menimbulkan kepanikan. 'Kengerian dari-Ku' mempertahankan unsur posesif tanpa memberi kesan bahwa Allah sendiri merasa takut.
- source_word: אֲשַׁלַּח לְפָנֶיךָ
  choice: Aku akan mengirimkan ... mendahuluimu
  rationale: לְפָנֶיךָ dalam konstruksi ini menyatakan bahwa sesuatu dikirim lebih dahulu di depan orang yang dituju; 'mendahuluimu' alami dan mempertahankan arah tersebut.
- source_word: וְהַמֹּתִי
  choice: Aku akan mengacaukan
  rationale: Bentuk kausatif dari המם menyatakan tindakan menimbulkan kekacauan, kepanikan, atau kegemparan, khususnya dalam konteks pertempuran. 'Mengacaukan' mempertahankan cakupan makna tanpa langsung menyatakan kekalahan total.
- source_word: כָּל הָעָם
  choice: semua bangsa
  rationale: Walaupun עָם berbentuk tunggal kolektif, konteksnya mencakup berbagai kelompok penduduk yang akan didatangi Israel. 'Semua bangsa' menyampaikan cakupan kolektif itu secara wajar dalam bahasa Indonesia.
- source_word: אֲשֶׁר תָּבֹא בָהֶם
  choice: yang kaudatangi
  rationale: Frasa ini secara harfiah menggambarkan Israel datang di tengah atau memasuki kelompok-kelompok tersebut. 'Yang kaudatangi' menjaga kenetralan preposisi dan tidak menambahkan arti 'serang'.
- source_word: וְנָתַתִּי ... אֵלֶיךָ עֹרֶף
  choice: Aku akan membuat semua musuhmu berbalik membelakangimu
  rationale: Ungkapan dengan עֹרֶף, 'tengkuk/bagian belakang leher', menggambarkan musuh yang berbalik untuk mundur. Terjemahan ini mempertahankan citra tubuh sekaligus menjelaskan tindakan yang dimaksud.
theological_decisions:
- issue: Tindakan langsung Allah dalam menimbulkan kepanikan dan kemenangan militer
  choice: 'Mempertahankan Allah sebagai pelaku langsung: ''Aku akan mengirimkan'', ''Aku akan mengacaukan'', dan ''Aku akan membuat''.'
  alternative: Memakai ungkapan tidak langsung yang melunakkan hubungan sebab-akibat ilahi.
  rationale: Teks Ibrani memakai verba orang pertama tunggal dengan Allah sebagai subjek secara eksplisit. Terjemahan tidak melunakkan ataupun memperluas pernyataan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi memakai huruf kapital. Bentuk 'kaudatangi' dipilih sebagai bentuk terikat yang alami; citra musuh yang membelakangi Israel dipertahankan dengan penjelasan dalam catatan kaki.
