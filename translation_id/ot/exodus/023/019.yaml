  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: רֵאשִׁ֗ית בִּכּוּרֵי֙ אַדְמָ֣תְ/ךָ֔ תָּבִ֕יא בֵּ֖ית יְהוָ֣ה אֱלֹהֶ֑י/ךָ לֹֽא תְבַשֵּׁ֥ל גְּדִ֖י בַּ/חֲלֵ֥ב אִמּֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/019.yaml
  text: The first of the firstfruits of your ground you shall bring into the house of Yahweh your God[b][a]. You shall not boil a young goat in its mother’s milk.
translation:
  language: id
  text: Bagian pertama dari hasil pertama tanahmu[a] harus kaubawa ke rumah Yahweh, Allahmu. Jangan merebus anak kambing[b] dalam susu induknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hasil pertama dari tanahmu.”
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “seekor gedi,” yaitu kambing yang masih muda; dalam konteks tertentu istilah ini dapat dipahami lebih umum sebagai hewan muda.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית בִּכּוּרֵי
  choice: bagian pertama dari hasil pertama
  rationale: Ungkapan konstruksi ini menunjuk pada bagian pertama atau yang paling awal dari hasil yang mula-mula. Terjemahan ini mempertahankan pengulangan makna dalam bahasa Ibrani tanpa menafsirkannya secara pasti sebagai 'yang terbaik'.
- source_word: אַדְמָתְךָ
  choice: tanahmu
  rationale: Kata אֲדָמָה terutama menunjuk pada tanah atau lahan yang menghasilkan tanaman, bukan wilayah politis secara umum.
- source_word: תָּבִיא
  choice: harus kaubawa
  rationale: Bentuk imperfek Hifil berfungsi sebagai ketetapan hukum. 'Harus kaubawa' menyampaikan daya perintah secara alami dalam bahasa Indonesia modern.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: rumah Yahweh, Allahmu
  rationale: '''Rumah'' mempertahankan cakupan בַּיִת sebagai tempat kudus tanpa membatasinya pada bangunan Bait Allah di masa kemudian; nama ilahi ditransliterasikan sebagai ''Yahweh''.'
- source_word: לֹא תְבַשֵּׁל
  choice: jangan merebus
  rationale: Kata בּשׁל di sini secara khusus cocok dengan tindakan merebus atau memasak dalam cairan; 'merebus' lebih tepat daripada kata umum 'memasak'.
- source_word: גְּדִי
  choice: anak kambing
  rationale: Makna lazimnya ialah kambing yang masih muda. Ungkapan 'anak kambing' jelas dan alami bagi pembaca Indonesia.
- source_word: בַּחֲלֵב אִמּוֹ
  choice: dalam susu induknya
  rationale: Terjemahan ini mempertahankan gambaran konkret serta hubungan kepunyaan dalam teks Ibrani dengan susunan yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. Bentuk 'Yahweh' mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Maksud larangan merebus anak kambing dalam susu induknya
  choice: Mempertahankan larangan secara harfiah tanpa memberikan alasan yang tidak dinyatakan teks
  alternative: Menjelaskannya sebagai larangan ritual Kanaan, tindakan kejam, atau dasar pemisahan makanan tertentu
  rationale: Ayat ini menyatakan larangan tetapi tidak menjelaskan latar belakang atau tujuannya. Terjemahan tidak boleh menutup ketidakpastian tersebut dengan tafsiran tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'kaubawa' dipakai untuk sapaan orang kedua tunggal yang tersirat dalam bahasa Ibrani. Struktur hukum dibuat tegas tetapi tetap alami; istilah dan ambiguitas yang penting dipertahankan melalui catatan kaki.
