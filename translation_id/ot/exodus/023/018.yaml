  text: You shall not sacrifice the blood of my sacrifice with anything leavened[b][a], and the fat of my feast shall not remain until morning.
translation:
  language: id
  text: Janganlah engkau mempersembahkan darah kurban-Ku bersama sesuatu yang beragi[a]. Lemak dari perayaan-Ku[b] tidak boleh dibiarkan sampai pagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di atas ragi”; dapat juga diterjemahkan “bersama ragi.” Dalam konteks persembahan ini, maksudnya kemungkinan bahwa kurban tidak boleh dipersembahkan dengan sesuatu yang beragi.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “hari raya-Ku.” Istilah Ibrani ini menunjuk pada perayaan keagamaan, khususnya hari raya ziarah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִזְבַּח
  choice: Janganlah kamu mempersembahkan
  rationale: Bentuk Qal imperfek orang kedua tunggal dengan לֹא menyatakan larangan. 'Mempersembahkan' terdengar alami dalam konteks kurban dan tetap mempertahankan tindakan ritual.
- source_word: עַל חָמֵץ
  choice: bersama sesuatu yang beragi
  rationale: Secara harfiah עַל berarti 'di atas', tetapi dalam konteks persembahan frasa ini kemungkinan melarang pengurbanan yang dikaitkan dengan bahan beragi. Catatan kaki mempertahankan kemungkinan ungkapan yang lebih harfiah.
- source_word: דַּם זִבְחִי
  choice: darah kurban bagi-Ku
  rationale: Bahasa Ibrani secara eksplisit menyebut darah kurban. Sufiks orang pertama dapat menyatakan kurban yang menjadi milik atau ditujukan kepada Allah; 'bagi-Ku' alami dalam bahasa Indonesia tanpa menghilangkan hubungan itu.
- source_word: יָלִין
  choice: tidak boleh dibiarkan
  rationale: Kata לין berarti bermalam atau tetap ada sepanjang malam. Bentuk pasif dalam bahasa Indonesia sesuai dengan ketentuan mengenai lemak yang tidak boleh tersisa sampai pagi.
- source_word: חֵלֶב
  choice: Lemak
  rationale: Terjemahan langsung ini mempertahankan rujukan pada lemak kurban tanpa memperluasnya menjadi 'bagian-bagian lemak'.
- source_word: חַגִּי
  choice: perayaan-Ku
  rationale: חַג menunjuk pada perayaan keagamaan atau hari raya ziarah. 'Perayaan' merupakan padanan modern yang wajar, sementara 'hari raya' dicatat sebagai alternatif.
- source_word: עַד בֹּקֶר
  choice: sampai pagi
  rationale: Padanan temporal yang langsung dan idiomatis dalam bahasa Indonesia.
theological_decisions:
- issue: Makna sufiks orang pertama pada זִבְחִי dan חַגִּי
  choice: '''kurban bagi-Ku'' dan ''perayaan-Ku'''
  alternative: '''kurban-Ku'' dan ''hari raya-Ku'''
  rationale: Sufiks ilahi dipertahankan tanpa mengganti rujukannya dengan nama ilahi. Pada זִבְחִי, 'bagi-Ku' menyampaikan secara alami bahwa kurban itu dipersembahkan kepada Allah; pada חַגִּי, bentuk kepunyaan langsung tetap jelas.
- issue: Hubungan kurban dengan ragi dalam עַל חָמֵץ
  choice: bersama sesuatu yang beragi
  alternative: di atas ragi / bersama ragi
  rationale: Preposisi tersebut secara leksikal terbuka bagi terjemahan lebih harfiah, tetapi konteks hukum kurban mendukung makna asosiasi. Ambiguitasnya dinyatakan dalam catatan kaki, bukan diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk tunggal 'kamu' mencerminkan sapaan maskulin tunggal dalam bahasa Ibrani, sedangkan 'kurban' mengikuti ejaan baku KBBI. Penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
