base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/016.yaml
  text: and the Feast of Harvest[a], the firstfruits of your labors, of what you sow in the field; and the Feast of Ingathering at the end of the year[c][b], when you gather in your labors from the field.
translation:
  language: id
  text: juga Hari Raya Panen[a], hasil pertama dari jerih payahmu, dari apa yang kautabur di ladang; dan Hari Raya Pengumpulan Hasil[c] pada akhir tahun[b], ketika engkau mengumpulkan hasil jerih payahmu dari ladang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Perayaan Panen”; demikian juga untuk kata “Hari Raya” yang kedua.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah dalam bahasa Ibrani, “pada keluarnya tahun.”
    reason: lexical_alternative
  - marker: c
    text: “Pengumpulan Hasil” menunjuk pada perayaan yang menandai dikumpulkannya hasil pertanian dari ladang.
    reason: cultural_note
lexical_decisions:
- source_word: חַג
  choice: Hari Raya
  rationale: Istilah ini menunjuk pada perayaan keagamaan yang ditetapkan, dalam konteks ini perayaan ziarah. “Hari Raya” alami dan bermartabat dalam bahasa Indonesia serta sesuai sebagai bagian dari nama perayaan.
- source_word: הַקָּצִיר
  choice: Panen
  rationale: Kata benda ini berarti panen atau penuaian. “Panen” merupakan sebutan yang paling alami dalam nama “Hari Raya Panen”.
- source_word: בִּכּוּרֵי
  choice: buah sulung
  rationale: Ungkapan ini menunjuk pada bagian pertama dari hasil pertanian dan mempertahankan nuansa agraris serta persembahannya kepada Allah.
- source_word: מַעֲשֶׂיךָ
  choice: hasil pekerjaanmu
  rationale: Secara dasar berarti pekerjaan atau perbuatanmu; dalam konteks pertanian, yang dikumpulkan ialah hasil dari pekerjaan itu. Pilihan ini mempertahankan hubungan dengan kerja manusia sekaligus jelas dalam bahasa Indonesia.
- source_word: אֲשֶׁר תִּזְרַע בַּשָּׂדֶה
  choice: yaitu apa yang kautabur di ladang
  rationale: Menerangkan sumber agraris buah sulung itu dan mempertahankan sapaan orang kedua tunggal.
- source_word: הָאָסִף
  choice: Pengumpulan Hasil
  rationale: Kata ini menunjuk pada pengumpulan hasil pertanian. Tambahan “Hasil” membuat nama perayaan jelas dan alami tanpa membatasinya lebih jauh daripada konteks.
- source_word: בְּצֵאת הַשָּׁנָה
  choice: pada akhir tahun
  rationale: Secara harfiah berarti “ketika tahun keluar”; ungkapan idiomatisnya menyatakan penghujung tahun.
- source_word: בְּאָסְפְּךָ
  choice: ketika engkau mengumpulkan
  rationale: Bentuk infinitif dengan preposisi berfungsi temporal dan paling alami diterjemahkan dengan “ketika”.
- source_word: מִן הַשָּׂדֶה
  choice: dari ladang
  rationale: Menyatakan sumber atau tempat asal hasil yang dikumpulkan secara langsung dan alami.
