  register: Bahasa Indonesia baku modern dengan sapaan orang kedua tunggal “engkau” dalam klausa penuh dan bentuk terikat “kau-” pada verba. Nama kedua perayaan ditulis dengan huruf kapital karena berfungsi sebagai sebutan khusus. Susunan kalimat mempertahankan kesejajaran dua perayaan dan citra pertanian teks Ibrani.
