base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/021.yaml
  text: Be on your guard before him[a], and listen to his voice. Do not rebel against him, for he will not pardon your transgression, because my name is within him.
translation:
  language: id
  text: Berhati-hatilah di hadapannya dan dengarkanlah suaranya. Jangan memberontak terhadapnya, sebab ia tidak akan mengampuni pelanggaranmu, karena nama-Ku ada di dalam dirinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “nama-Ku ada di dalam dia” atau “nama-Ku ada atasnya”; secara lebih interpretatif, “ia menyandang nama-Ku.” Ungkapan ini menunjukkan otoritas ilahi yang diwakilinya, tetapi ayat ini tidak menjelaskan secara tegas hakikat sang utusan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר מִפָּנָיו
  choice: Jagalah dirimu di hadapannya
  rationale: Bentuk imperatif ini memperingatkan agar orang Israel bersikap waspada dan hati-hati di hadapan sang utusan. Ungkapan ini mempertahankan unsur refleksif dan relasional dalam bahasa Ibrani tanpa terdengar kuno.
- source_word: וּשְׁמַע בְּקֹלוֹ
  choice: dan dengarkanlah suaranya
  rationale: Terjemahan ini mempertahankan gambaran harfiah tentang mendengarkan suara, sementara tuntutan untuk menaati tetap jelas dari konteks.
- source_word: אַל תַּמֵּר בּוֹ
  choice: Jangan memberontak terhadapnya
  rationale: Kata מרה menunjukkan pembangkangan atau pemberontakan terhadap otoritas; pilihan ini menyampaikan bobot peringatan perjanjian tersebut.
- source_word: לֹא יִשָּׂא לְפִשְׁעֲכֶם
  choice: ia tidak akan mengampuni pelanggaranmu
  rationale: Dalam hubungan dengan dosa atau pelanggaran, נשא dapat berarti menanggung, menyingkirkan, atau mengampuni. 'Mengampuni' menyampaikan makna idiomatisnya secara jelas; bentuk tunggal mempertahankan nomina kolektif Ibrani.
- source_word: שְׁמִי בְּקִרְבּוֹ
  choice: nama-Ku ada di dalam dirinya
  rationale: Pilihan ini mengikuti arti dasar בְּקִרְבּוֹ, yaitu 'di dalamnya/di dalam dirinya', dan mempertahankan pernyataan kuat teks tanpa menentukan secara lebih jauh hakikat sang utusan.
theological_decisions:
- issue: Hakikat sang utusan dan arti nama Allah yang ada di dalam dirinya
  choice: Mempertahankan ungkapan 'nama-Ku ada di dalam dirinya' tanpa menentukan hakikat sang utusan.
  alternative: Sang utusan menyandang nama Allah sebagai wakil yang diberi kuasa penuh, atau merupakan penampakan langsung kehadiran TUHAN.
  rationale: Ayat ini menegaskan otoritas ilahi sang utusan, tetapi tidak secara eksplisit menjelaskan hakikat ontologisnya. Terjemahan karena itu mempertahankan ketegangan teologis teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'dengarkanlah' mempertahankan seruan langsung; pronomina 'ia' tidak memakai huruf kapital agar terjemahan tidak lebih dahulu menentukan hakikat sang utusan. Penanda catatan kaki [a] ditempatkan pada klausa yang dijelaskannya.
