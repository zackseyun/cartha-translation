- from: Enam hari lamanya engkau harus melakukan pekerjaanmu, tetapi pada hari ketujuh engkau harus berhenti[a], supaya lembu dan keledaimu dapat beristirahat, dan anak hamba perempuanmu[b] serta pendatang[c] dapat menyegarkan diri.
