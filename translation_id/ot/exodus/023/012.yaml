review_pass:
  verdict: revise
  source_fidelity: 'Terjemahan secara umum mengikuti Ibrani dengan baik: perintah untuk bekerja selama enam hari, berhenti pada hari ketujuh, istirahat bagi lembu dan keledai, serta penyegaran bagi anak laki-laki hamba perempuan dan pendatang. Namun, teks utama menghilangkan penandaan maskulin pada בֶּן (‘anak laki-laki’/‘putra’) dan bentuk kepemilikan pada ‘lembu’ perlu dinyatakan secara konsisten.'
  naturalness: Ragamnya baku dan wajar. ‘Menjadi segar kembali’ lebih idiomatis untuk bentuk pasif/refleksif וְיִנָּפֵשׁ daripada ‘menyegarkan diri’, tanpa mengubah makna pemulihan.
  terminology: ‘Berhenti’ tepat untuk תִּשְׁבֹּת, dan ‘pendatang’ dapat dipertahankan dengan catatan yang menjelaskan bahwa גר adalah orang asing yang menetap. ‘Hamba perempuan’ mempertahankan istilah sosial sumber tanpa menambahkan penafsiran.
  issues:
  - severity: medium
    issue: ‘anak hamba perempuanmu’ tidak menyatakan unsur maskulin בֶּן.
    rationale: בֶּן berarti ‘anak laki-laki’ atau ‘putra’; catatan kaki draft mengakuinya, tetapi teks utama seharusnya tidak menghilangkan informasi yang ada dalam sumber.
  - severity: low
    issue: ‘lembu dan keledaimu’ hanya menandai kepemilikan secara eksplisit pada keledai.
    rationale: Kedua nomina Ibrani memakai sufiks orang kedua tunggal. Dalam bahasa Indonesia, ‘lembumu dan keledaumu’ menyatakan cakupan itu dengan lebih jelas.
  - severity: low
    issue: ‘dapat menyegarkan diri’ kurang selaras dengan nuansa bentuk nifal.
    rationale: וְיִנָּפֵשׁ menyatakan menjadi segar kembali atau memperoleh pemulihan, bukan terutama tindakan aktif menyegarkan diri.
  revised_text: Enam hari lamanya engkau harus melakukan pekerjaanmu, tetapi pada hari ketujuh engkau harus berhenti[a], supaya lembumu dan keledaumu dapat beristirahat, dan anak laki-laki hamba perempuanmu[b] serta pendatang[c] menjadi segar kembali.
