id: EXO.23.12
reference: Exodus 23:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שֵׁ֤שֶׁת יָמִים֙ תַּעֲשֶׂ֣ה מַעֲשֶׂ֔י/ךָ וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י תִּשְׁבֹּ֑ת לְמַ֣עַן יָנ֗וּחַ שֽׁוֹרְ/ךָ֙ וַ/חֲמֹרֶ֔/ךָ וְ/יִנָּפֵ֥שׁ בֶּן אֲמָתְ/ךָ֖ וְ/הַ/גֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/012.yaml
  text: For six days you shall do your work[a], but on the seventh day you shall cease, so that your ox and your donkey may rest[c][b], and the son of your female servant and the sojourner may be refreshed.
translation:
  language: id
  text: Enam hari lamanya engkau harus melakukan pekerjaanmu, tetapi pada hari ketujuh engkau harus berhenti[a], supaya lembumu dan keledaumu dapat beristirahat, dan anak laki-laki hamba perempuanmu[b] serta pendatang[c] menjadi segar kembali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “beristirahat”; makna dasar kata Ibraninya ialah berhenti atau menghentikan kegiatan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak laki-laki hamba perempuanmu.”
    reason: lexical_note
  - marker: c
    text: “Pendatang” di sini ialah orang asing yang menetap di tengah Israel dan hidup dalam tatanan sosial serta hukumnya.
    reason: cultural_note
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Enam hari lamanya
  rationale: Frasa ini menyatakan jangka waktu. Tambahan “lamanya” menghasilkan ungkapan Indonesia yang alami tanpa mengubah cakupan enam hari.
- source_word: תַּעֲשֶׂה מַעֲשֶׂיךָ
  choice: engkau harus melakukan pekerjaanmu
  rationale: Bentuk imperfek dalam ketetapan hukum berfungsi sebagai perintah, sedangkan מַעֲשֶׂיךָ menunjuk secara luas pada pekerjaan atau kegiatan seseorang.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: tetapi pada hari ketujuh
  rationale: Waw menghubungkan dua bagian dengan kontras yang jelas antara enam hari kerja dan hari ketujuh.
- source_word: תִּשְׁבֹּת
  choice: engkau harus berhenti
  rationale: Makna dasar verba שׁבת ialah berhenti atau menghentikan kegiatan. Pilihan ini mempertahankan gagasan penghentian kerja, bukan hanya keadaan santai.
- source_word: לְמַעַן יָנוּחַ
  choice: supaya ... dapat beristirahat
  rationale: לְמַעַן memperkenalkan tujuan, dan נוח menyatakan keadaan beristirahat atau memperoleh kelegaan.
- source_word: שׁוֹרְךָ וַחֲמֹרֶךָ
  choice: lembu dan keledaimu
  rationale: Kedua istilah menunjuk pada hewan kerja dalam lingkungan agraris; “lembu” dan “keledai” merupakan padanan Indonesia yang jelas dan lazim.
- source_word: וְיִנָּפֵשׁ
  choice: dapat menyegarkan diri
  rationale: Bentuk nifal dari נפשׁ menggambarkan memperoleh napas atau kesegaran kembali. Ungkapan ini menyampaikan pemulihan yang dimaksud secara alami dalam bahasa Indonesia.
- source_word: בֶּן אֲמָתְךָ
  choice: anak hamba perempuanmu
  rationale: Terjemahan ini dekat dengan susunan Ibrani dan mempertahankan hubungan sosial yang dinyatakan teks tanpa menentukan lebih jauh umur atau kedudukan anak itu.
- source_word: הַגֵּר
  choice: pendatang
  rationale: גר adalah orang dari luar Israel yang menetap di tengah masyarakat Israel. “Pendatang” ringkas dan mudah dipahami, dengan catatan yang menjelaskan kategori sosial-hukumnya.
theological_decisions:
- issue: Makna שׁבת dalam ketetapan Sabat
  choice: engkau harus berhenti
  alternative: engkau harus beristirahat
  rationale: Makna inti verba tersebut adalah berhenti dari kegiatan. Terjemahan ini mempertahankan penekanan pada penghentian kerja, sedangkan klausa berikutnya menyatakan istirahat dan penyegaran yang dihasilkannya.
- issue: Cakupan kategori sosial גר
  choice: pendatang
  alternative: orang asing yang menetap
  rationale: Istilah ini bukan sekadar orang asing yang lewat, melainkan orang luar yang tinggal di tengah Israel dan berada dalam tatanan sosial-hukumnya. Catatan kaki menjaga nuansa tersebut tanpa membebani teks utama.
- issue: Pihak yang menerima manfaat hari ketujuh
  choice: hewan kerja, anak hamba perempuan, dan pendatang semuanya disebut sebagai penerima istirahat atau penyegaran
  alternative: membatasi tujuan hukum terutama pada pemilik rumah tangga
  rationale: Struktur ayat secara eksplisit mengarahkan manfaat penghentian kerja kepada hewan dan anggota masyarakat yang bergantung atau rentan; terjemahan tidak mempersempit cakupan itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam hukum yang tetap wajar dan bermartabat. Pronomina “engkau” mempertahankan sapaan tunggal dalam teks Ibrani. Struktur tujuan dibuat jelas tanpa menghapus perbedaan antara “berhenti,” “beristirahat,” dan “menyegarkan diri.”
