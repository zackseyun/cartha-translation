  rationale: Revisi memulihkan makna maskulin בֶּן dalam teks utama, menandai kepemilikan bagi kedua hewan sebagaimana dalam Ibrani, dan memakai ungkapan Indonesia yang lebih alami untuk gagasan ‘menjadi segar kembali’. Makna dan struktur tujuan ayat tetap dipertahankan.
