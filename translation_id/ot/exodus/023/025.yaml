base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/025.yaml
  text: You shall serve Yahweh your God[a], and he will bless your bread and your water[b], and I will remove sickness from your midst.
translation:
  language: id
  text: Kalian harus melayani Yahweh, Allah kalian. Ia akan memberkati rotimu[a] dan airmu, dan Aku akan menyingkirkan penyakit[b] dari tengahmu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani untuk “roti” juga dapat mewakili makanan atau persediaan pangan secara umum.
    reason: lexical_alternative
  - marker: b
    text: Atau “sakit”.
    reason: lexical_alternative
  - marker: c
    text: Teks Ibrani mula-mula menyapa umat dalam bentuk jamak (“kalian”), lalu memakai bentuk tunggal (“-mu”) untuk roti, air, dan tengah.
    reason: textual_feature
lexical_decisions:
- source_word: וַעֲבַדְתֶּם
  choice: Kalian harus melayani
  rationale: Kata kerja עבד dalam konteks perjanjian mencakup pengabdian dan ibadah kepada Allah. “Melayani” mempertahankan cakupan yang lebih luas itu, sedangkan “harus” menyampaikan daya perintah bentuk tersebut dalam konteks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama perjanjian itu tetap tampil sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allah kalian
  rationale: Dengan Yahweh sebagai rujukannya, אֱלֹהִים bermakna tunggal, “Allah”; akhiran orang kedua jamak dinyatakan dengan “kalian”.
- source_word: וּבֵרַךְ
  choice: Ia akan memberkati
  rationale: Bentuk perfektum berwaw di sini menyatakan akibat atau janji yang akan terjadi sesudah perintah ditaati. Subjek tersirat, yaitu Yahweh, dibuat eksplisit sebagai “Ia”.
- source_word: לַחְמְךָ
  choice: rotimu
  rationale: לֶחֶם secara harfiah berarti “roti”, tetapi juga dapat mewakili makanan atau persediaan pangan secara umum. Arti konkret dipertahankan dalam teks dan cakupan yang lebih luas dicatat dalam catatan kaki.
- source_word: מֵימֶיךָ
  choice: airmu
  rationale: Walaupun bentuk Ibraninya jamak atau kolektif, מַיִם secara wajar diterjemahkan dengan nomina massal tunggal “air” dalam bahasa Indonesia.
- source_word: וַהֲסִרֹתִי
  choice: dan Aku akan menyingkirkan
  rationale: Bentuk kausatif הֵסִיר berarti membuat sesuatu pergi, membuang, atau menyingkirkan. “Menyingkirkan” menyampaikan janji perlindungan ilahi secara jelas.
- source_word: מַחֲלָה
  choice: penyakit
  rationale: מַחֲלָה menunjuk pada sakit atau penyakit. “Penyakit” merupakan padanan Indonesia yang luas, alami, dan tidak terlalu teknis.
- source_word: מִקִּרְבֶּךָ
  choice: dari tengah-tengahmu
  rationale: Ungkapan ini secara harfiah berarti “dari tengahmu” dan mempertahankan dimensi komunal, bukan membatasinya pada penyakit di dalam tubuh seseorang.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Peralihan jumlah pada sapaan orang kedua
  choice: Mempertahankan peralihan dari bentuk jamak “kalian” ke bentuk tunggal “-mu”
  alternative: Menyeragamkan seluruh sapaan menjadi bentuk jamak demi kelancaran bahasa Indonesia
  rationale: Bahasa Ibrani beralih dari kata kerja dan sebutan Allah dalam bentuk orang kedua jamak ke akhiran tunggal pada roti, air, dan tengah-tengah. Peralihan ini merupakan ciri nyata teks dan dapat mencerminkan Israel sebagai umat sekaligus satu kesatuan, sehingga tidak diseragamkan diam-diam.
- issue: Peralihan penyebutan Allah dari orang ketiga ke orang pertama
  choice: Ia akan memberkati ... Aku akan menyingkirkan
  alternative: Ia akan memberkati ... Ia akan menyingkirkan
  rationale: Teks Ibrani benar-benar beralih dari subjek orang ketiga tersirat pada “memberkati” ke orang pertama pada “Aku akan menyingkirkan”. Ketegangan gramatikal ini dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Melayani” dipilih untuk mempertahankan makna pengabdian perjanjian yang juga mencakup ibadah. Pergeseran jumlah dan persona dalam teks Ibrani sengaja dipertahankan dan dijelaskan agar tidak dianggap sebagai kekeliruan.
