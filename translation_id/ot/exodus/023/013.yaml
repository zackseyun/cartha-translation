  text: וּ/בְ/כֹ֛ל אֲשֶׁר אָמַ֥רְתִּי אֲלֵי/כֶ֖ם תִּשָּׁמֵ֑רוּ וְ/שֵׁ֨ם אֱלֹהִ֤ים אֲחֵרִים֙ לֹ֣א תַזְכִּ֔ירוּ לֹ֥א יִשָּׁמַ֖ע עַל פִּֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/013.yaml
  text: In all that I have said to you[a], be careful[b]; and the name of other gods you shall not mention—it shall not be heard on your lips.
translation:
  language: id
  text: Dalam segala hal yang telah Kufirmankan kepada kalian, berhati-hatilah. Jangan menyebut nama ilah-ilah lain[a]; jangan sampai nama itu terdengar dari mulutmu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih khusus, “Jangan menyerukan nama ilah-ilah lain.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “jangan sampai terdengar di atas mulutmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכֹל אֲשֶׁר אָמַרְתִּי אֲלֵיכֶם
  choice: Dalam segala hal yang telah Kufirmankan kepada kalian
  rationale: Mempertahankan cakupan menyeluruh dari וּבְכֹל dan menghubungkannya secara alami dengan ketetapan-ketetapan yang baru disampaikan. Bentuk jamak אֲלֵיכֶם dinyatakan dengan “kalian”.
- source_word: תִּשָּׁמֵרוּ
  choice: berhati-hatilah
  rationale: Bentuk Nifal dari שׁמר di sini menyampaikan seruan agar menjaga diri dan memperhatikan dengan sungguh-sungguh. “Berhati-hatilah” alami dalam bahasa Indonesia modern tanpa mempersempitnya menjadi sekadar menaati.
- source_word: וְשֵׁם אֱלֹהִים אֲחֵרִים
  choice: nama ilah-ilah lain
  rationale: Mempertahankan bentuk tunggal “nama” yang berhubungan dengan bentuk jamak “ilah-ilah lain”, tanpa menambahkan penilaian tentang keberadaan atau hakikat ilah-ilah tersebut.
- source_word: לֹא תַזְכִּירוּ
  choice: Jangan menyebut
  rationale: Hifil זכר dapat berarti menyebut, mengingatkan, atau menyerukan. “Menyebut” mempertahankan keluasan makna dasarnya; kemungkinan arti yang lebih khusus, yaitu menyerukan dalam konteks pemujaan atau permohonan, dicatat dalam catatan kaki.
- source_word: לֹא יִשָּׁמַע עַל פִּיךָ
  choice: jangan sampai nama itu terdengar dari mulutmu
  rationale: Mempertahankan verba pasif “terdengar” dan citra ucapan dari mulut, sambil memakai susunan yang wajar dalam bahasa Indonesia. Akhiran tunggal -ךָ diterjemahkan dengan “-mu”, sehingga peralihan dari sapaan jamak sebelumnya ke sapaan tunggal tetap terlihat.
theological_decisions:
- issue: Cakupan larangan mengenai nama ilah-ilah lain
  choice: Menerjemahkannya sebagai larangan menyebut nama ilah-ilah lain.
  alternative: Menerjemahkannya secara lebih khusus sebagai larangan menyerukan atau memohon dengan nama ilah-ilah lain.
  rationale: Teks Ibrani secara langsung melarang penyebutan dan terdengarnya nama-nama itu dari mulut umat. Ayat ini sendiri tidak memastikan apakah yang dilarang adalah setiap penyebutan, pemanggilan dalam ibadah, atau pengakuan perjanjian; karena itu terjemahan utama tidak mempersempit cakupannya.
- issue: Peralihan dari sapaan jamak ke sapaan tunggal
  choice: Mempertahankan “kalian” lalu “mulutmu”.
  alternative: Menyeragamkan seluruh sapaan menjadi jamak demi kelancaran bahasa Indonesia.
  rationale: Teks Ibrani memakai bentuk jamak dalam אֲלֵיכֶם dan תַזְכִּירוּ, tetapi bentuk tunggal dalam פִּיךָ. Peralihan ini dapat menyapa umat sebagai kelompok lalu setiap anggota secara individual, tetapi terjemahan tidak menafsirkan lebih jauh.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kufirmankan” sesuai dengan konteks perkataan ilahi, sedangkan “ilah-ilah lain” menjaga nuansa religius tanpa memasukkan penilaian ontologis. Tanda baca membagi dua tuntutan ayat dengan jelas, dan semua penanda catatan kaki terdapat dalam teks utama.
