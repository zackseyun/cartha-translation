id: EXO.23.20
reference: Exodus 23:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הִנֵּ֨ה אָנֹכִ֜י שֹׁלֵ֤חַ מַלְאָךְ֙ לְ/פָנֶ֔י/ךָ לִ/שְׁמָרְ/ךָ֖ בַּ/דָּ֑רֶךְ וְ/לַ/הֲבִ֣יאֲ/ךָ֔ אֶל הַ/מָּק֖וֹם אֲשֶׁ֥ר הֲכִנֹֽתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/023/020.yaml
  text: Behold[a], I am sending an angel before you to guard you on the way and to bring you to the place that I have prepared.
translation:
  language: id
  text: Sesungguhnya, Aku mengutus seorang malaikat[a] mendahuluimu untuk menjagamu dalam perjalanan dan membawamu ke tempat yang telah Kusiapkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “seorang utusan.” Kata Ibrani מַלְאָךְ dapat berarti utusan manusia atau utusan surgawi; dalam konteks ini, “malaikat” paling sesuai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Sesungguhnya
  rationale: Menandai perhatian dan kekhidmatan dalam perkataan ilahi dengan ungkapan Indonesia yang alami dan bermartabat.
- source_word: אָנֹכִי
  choice: Aku
  rationale: Mempertahankan subjek eksplisit dan nuansa penegasan tanpa menambahkan 'Aku sendiri', yang dapat berlebihan.
- source_word: שֹׁלֵחַ
  choice: mengutus
  rationale: Partisip Ibrani menyatakan tindakan yang sedang atau segera dilakukan; bentuk kini bahasa Indonesia cukup alami dalam ujaran langsung ini.
- source_word: מַלְאָךְ
  choice: seorang malaikat
  rationale: Konteks perlindungan dan penuntunan ilahi paling mendukung utusan surgawi, sementara arti leksikal alternatif dipertahankan dalam catatan kaki.
- source_word: לְפָנֶיךָ
  choice: mendahuluimu
  rationale: Mengungkapkan secara alami bahwa malaikat itu pergi di depan Israel, tanpa menyiratkan sekadar posisi statis.
- source_word: לִשְׁמָרְךָ
  choice: untuk menjagamu
  rationale: Menyampaikan fungsi perlindungan dari שׁמר dengan jelas.
- source_word: בַּדָּרֶךְ
  choice: dalam perjalanan
  rationale: Merujuk pada perjalanan atau rute yang ditempuh, bukan hanya jalan secara fisik.
- source_word: וְלַהֲבִיאֲךָ
  choice: dan membawamu
  rationale: Mencerminkan bentuk kausatif בוא secara langsung dan alami.
- source_word: הַמָּקוֹם
  choice: ke tempat
  rationale: Padanan langsung dan wajar bagi tujuan yang telah ditentukan.
- source_word: אֲשֶׁר הֲכִנֹתִי
  choice: yang telah Kusiapkan
  rationale: Menunjukkan tempat tujuan yang sudah dipersiapkan atau dibuat siap oleh Allah.
theological_decisions:
- issue: Identitas מַלְאָךְ dalam konteks ini
  choice: Diterjemahkan sebagai 'seorang malaikat' tanpa menentukan apakah ia makhluk malaikat ciptaan atau manifestasi khusus TUHAN.
  alternative: Seorang utusan manusia; atau Malaikat TUHAN sebagai utusan ilahi yang unik.
  rationale: Ayat ini hanya menyebut sosok tersebut sebagai מַלְאָךְ. Konteks selanjutnya menimbulkan pertanyaan tentang statusnya, sehingga terjemahan tidak menyelesaikan ketegangan teologis itu secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku modern, khidmat tetapi mudah dipahami. Kapitalisasi 'Aku' dan bentuk terikat 'Kusiapkan' mengikuti kebiasaan penghormatan dalam tuturan langsung Allah. Penanda catatan kaki [a] ditempatkan tepat setelah istilah yang dijelaskan.
