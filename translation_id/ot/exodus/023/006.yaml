  text: You shall not pervert the justice due to your poor person in his dispute[a].
translation:
  language: id
  text: Janganlah engkau menyimpangkan keadilan yang menjadi hak orang miskin di antaramu dalam perkaranya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Janganlah engkau menolak keadilan bagi orang miskin di antaramu dalam perkaranya.”'
    reason: Alternatif ini mencerminkan pemahaman kontekstual bahwa tindakan menyimpangkan keadilan dapat berupa penolakan atas keadilan yang semestinya diterima; “perkara” mempertahankan cakupan hukum yang umum dari רִיב.
lexical_decisions:
- source_word: לֹא
  choice: janganlah
  rationale: Negasi ini memperkenalkan larangan; bentuk “janganlah” wajar dan bermartabat dalam ketentuan hukum bahasa Indonesia.
- source_word: תַטֶּה
  choice: memutarbalikkan
  rationale: Bentuk Hifil dari נטה secara harfiah berarti membelokkan; dalam konteks pengadilan, “memutarbalikkan” menyatakan tindakan menyimpangkan keadilan.
- source_word: מִשְׁפַּט
  choice: keadilan yang menjadi hak
  rationale: Dalam konteks hukum, istilah ini menunjuk pada keadilan atau putusan adil yang merupakan hak pihak bersangkutan, bukan sekadar gagasan abstrak tentang keadilan.
- source_word: אֶבְיֹנְךָ
  choice: orang miskin di antaramu
  rationale: אֶבְיוֹן berarti orang miskin atau berkekurangan. Sufiks orang kedua tunggal dipertahankan secara idiomatis sebagai “di antaramu”, yang menunjukkan orang miskin dalam lingkungan pihak yang disapa tanpa memaksakan gender yang tidak perlu dalam bahasa Indonesia.
- source_word: בְּרִיבוֹ
  choice: dalam perkaranya
  rationale: רִיב dapat berarti perselisihan, perkara, atau gugatan hukum. “Perkara” mempertahankan fokus yuridis dan sufiks orang ketiga tunggal diterjemahkan dengan “-nya”.
theological_decisions:
- issue: Apakah larangan ini secara khusus menentang ketidakadilan terhadap orang miskin atau merupakan pernyataan sosial yang umum
  choice: Larangan ini melarang penyimpangan keadilan yang menjadi hak orang miskin dalam suatu perkara hukum.
  alternative: Jangan menolak keadilan bagi orang miskin secara umum.
  rationale: Susunan Ibrani menempatkan מִשְׁפַּט sebagai objek yang dibelokkan dan בְּרִיבוֹ sebagai konteks perkara. Terjemahan mempertahankan fokus pengadilan tanpa mengubahnya menjadi slogan sosial umum.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk tunggal “engkau” mempertahankan sapaan orang kedua tunggal dalam teks Ibrani; “orang miskin” alami dan tidak menambahkan penandaan gender yang tidak diperlukan dalam bahasa sasaran.
