  text: You shall not spread a false report[b][a]. Do not join hands with a wicked man to be a malicious witness.
translation:
  language: id
  text: Jangan menyebarkan kabar bohong.[a] Jangan bekerja sama dengan orang fasik untuk menjadi saksi yang zalim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “membawa kabar palsu”; maksudnya dapat mencakup menyampaikan atau mengedarkan kabar itu.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menaruh tanganmu bersama orang fasik untuk menjadi saksi kekerasan.” Ungkapan terakhir juga dapat dipahami sebagai “saksi yang zalim” atau “saksi yang berniat jahat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא
  choice: menyebarkan
  rationale: Secara harfiah berarti 'mengangkat/membawa', tetapi bersama שֵׁמַע menunjuk pada membawa atau mengedarkan kabar; 'menyebarkan' menyampaikan idiom itu dengan wajar.
- source_word: שֵׁמַע שָׁוְא
  choice: kabar bohong
  rationale: שֵׁמַע adalah sesuatu yang didengar, yakni kabar atau desas-desus, sedangkan שָׁוְא dapat berarti kepalsuan atau kesia-siaan; dalam konteks hukum, 'kabar bohong' jelas dan alami.
- source_word: תָּשֶׁת יָדְךָ עִם
  choice: bekerja sama dengan
  rationale: Idiom harfiahnya 'menaruh tanganmu bersama'; maksudnya bersekutu atau membantu seseorang. 'Bekerja sama dengan' jelas dalam bahasa Indonesia modern, sementara citra harfiahnya dicatat dalam catatan kaki.
- source_word: רָשָׁע
  choice: orang fasik
  rationale: רָשָׁע berarti orang jahat/fasik atau pihak yang bersalah. 'Orang fasik' mempertahankan bobot moral dan hukum tanpa menambahkan rincian yang tidak ada.
- source_word: לִהְיוֹת עֵד חָמָס
  choice: untuk menjadi saksi yang mencelakakan
  rationale: חָמָס mencakup kekerasan, kezaliman, atau tindakan salah. Dalam konteks kesaksian hukum, ungkapan ini menggambarkan saksi yang dengan zalim mendatangkan kerugian; pilihan ini menjaga daya ungkapnya tanpa menghasilkan frasa Indonesia yang janggal seperti 'saksi kekerasan'.
- source_word: לֹא / אַל
  choice: Jangan ... Jangan
  rationale: Kedua bentuk menyatakan larangan. Pengulangan 'Jangan' alami dan tegas dalam ketentuan hukum bahasa Indonesia.
theological_decisions:
- issue: Cakupan bentuk maskulin tunggal dalam ketentuan hukum
  choice: Memakai sapaan tersirat bahasa Indonesia dan 'orang fasik'
  alternative: Memakai 'laki-laki fasik' atau bentuk yang secara eksplisit maskulin
  rationale: Bahasa Ibrani memakai bentuk maskulin tunggal, tetapi dalam hukum bentuk itu berfungsi sebagai alamat individual yang representatif. Bahasa Indonesia tidak menandai gender pada kata 'orang' atau verba imperatif; menambahkan 'laki-laki' akan mempersempit makna secara tidak perlu.
- issue: Makna עֵד חָמָס
  choice: saksi yang mencelakakan
  alternative: saksi kekerasan; saksi jahat; saksi palsu
  rationale: Frasa Ibrani mempertahankan ketegangan antara kekerasan, kezaliman, dan kerugian hukum. 'Yang mencelakakan' mengungkap akibat kesaksian yang zalim, sedangkan catatan kaki mempertahankan alternatif leksikal; 'saksi palsu' terlalu cepat menyamakan חָמָס dengan kepalsuan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang tegas dan bermartabat. Imperatif 'Jangan' menjaga kelugasan; istilah 'fasik' mempertahankan bobot moral teks, sedangkan catatan kaki menjelaskan idiom dan ambiguitas sumber.
