  text: mezbah untuk kurban bakaran, kisi-kisi perunggu milik mezbah itu, batang-batang pengusungnya serta segala perlengkapannya, bejana pembasuhan dan alasnya—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: mezbah untuk kurban bakaran
  rationale: Frasa konstruksi ini menunjuk pada mezbah yang digunakan untuk kurban yang dibakar seluruhnya. 'Mezbah untuk kurban bakaran' alami dalam bahasa Indonesia dan mempertahankan fungsi kultisnya.
- source_word: מִכְבַּר הַנְּחֹשֶׁת
  choice: kisi-kisi perunggu
  rationale: מִכְבָּר menunjuk pada jalinan atau kisi logam pada mezbah. 'Kisi-kisi perunggu' jelas, konkret, dan tidak menentukan letaknya lebih jauh daripada teks Ibrani.
- source_word: אֲשֶׁר לוֹ
  choice: yang menjadi bagiannya
  rationale: Ungkapan relatif ini menyatakan kepunyaan atau keterkaitan. Pilihan ini tidak menambahkan posisi fisik yang tidak dinyatakan secara eksplisit oleh teks.
- source_word: בַּדָּיו
  choice: kayu-kayu pengusungnya
  rationale: בַּדִּים adalah batang-batang untuk mengusung perlengkapan Kemah Suci. Penambahan fungsi 'pengusung' membuat maknanya jelas bagi pembaca modern.
- source_word: כָּל כֵּלָיו
  choice: segala perlengkapannya
  rationale: כֵּלִים merupakan istilah luas bagi perkakas atau peralatan mezbah. 'Perlengkapan' lebih alami dan cukup luas dalam bahasa Indonesia.
- source_word: הַכִּיֹּר
  choice: bejana pembasuhan
  rationale: Istilah ini menunjuk pada wadah air untuk pembasuhan di pelataran. 'Bejana pembasuhan' menyampaikan bentuk umum dan fungsinya secara jelas tanpa memakai istilah arkais.
- source_word: כַּנּוֹ
  choice: alasnya
  rationale: כֵּן menunjuk pada penyangga atau dasar bejana. 'Alas' ringkas dan alami; 'dudukan' juga mungkin.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ayat ini merupakan lanjutan daftar dari konteks sebelumnya, sehingga dipertahankan sebagai frasa nominal dan diakhiri tanda pisah. Istilah 'kurban bakaran' dipakai untuk עֹלָה, sedangkan 'bejana pembasuhan' menghindari kata tradisional yang kurang dipahami pembaca umum.
