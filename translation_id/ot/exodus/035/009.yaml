translation:
  language: id
  text: batu-batu krisopras[a] dan batu-batu permata untuk ditatahkan pada efod dan tutup dada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani שֹׁהַם (syoham) secara tradisional diterjemahkan “krisopras” atau “batu oniks”, tetapi jenis batu permata yang tepat tidak diketahui dengan pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבְנֵי שֹׁהַם
  choice: batu-batu krisopras
  rationale: שֹׁהַם adalah nama batu berharga yang identifikasi mineralnya tidak pasti. Dalam tradisi Alkitab bahasa Indonesia istilah ini lazim diterjemahkan 'krisopras'; pilihan tradisional itu dipertahankan, sementara ketidakpastiannya dijelaskan dalam catatan kaki.
- source_word: אַבְנֵי מִלֻּאִים
  choice: batu-batu permata untuk ditatahkan
  rationale: מִלֻּאִים menunjuk pada batu-batu isian atau tatahan yang dipasang pada perlengkapan imam. Ungkapan ini menyampaikan fungsi batu secara alami dalam bahasa Indonesia; kata 'permata' tersirat oleh konteks dan jenis bendanya.
- source_word: לָאֵפֹד
  choice: pada efod
  rationale: אֵפוֹד merupakan istilah teknis bagi pakaian imam dan dipertahankan sebagai transliterasi 'efod'. Preposisi 'pada' sesuai dengan batu yang akan dipasang atau ditatahkan pada pakaian tersebut.
- source_word: וְלַחֹשֶׁן
  choice: dan tutup dada
  rationale: חֹשֶׁן menunjuk pada perlengkapan upacara yang dikenakan di dada imam, bukan zirah militer. 'Tutup dada' merupakan istilah yang jelas dan sudah dikenal dalam bahasa Alkitab Indonesia.
