base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/001.yaml
  text: Then Moses assembled all the congregation of the sons of Israel and said to them[b][a], “These are the things that Yahweh has commanded to be done.”
translation:
  language: id
  text: Lalu Musa mengumpulkan seluruh umat Israel[a] dan berkata kepada mereka, “Inilah hal-hal[b] yang Yahweh perintahkan untuk dilakukan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “bani Israel”; sebutan kovenantal bagi seluruh umat Israel, bukan hanya laki-laki.'
    reason: lexical_alternative
  - marker: b
    text: Atau “kata-kata” atau “perkara-perkara.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: mengumpulkan
  rationale: Bentuk Hifil dari קהל menyatakan bahwa Musa membuat umat berhimpun sebagai satu kumpulan; “mengumpulkan” alami dalam bahasa Indonesia dan mempertahankan daya kausatifnya.
- source_word: כָּל עֲדַת
  choice: seluruh umat
  rationale: עֵדָה menunjuk pada komunitas Israel secara kolektif. “Seluruh umat” jelas, bermartabat, dan lebih alami daripada “seluruh jemaat” dalam konteks bangsa Israel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: Ungkapan baku “bani Israel” mempertahankan bentuk genealogis-perjanjian dari frasa Ibrani tanpa memberi kesan bahwa yang dimaksud hanya laki-laki.
- source_word: אֵלֶּה הַדְּבָרִים
  choice: Inilah hal-hal
  rationale: דְּבָרִים dapat berarti perkataan, perkara, atau hal-hal. Karena konteksnya adalah ketentuan yang harus dilaksanakan, “hal-hal” mempertahankan keluasan makna dan cocok dengan tindakan yang diperintahkan.
- source_word: צִוָּה יְהוָה
  choice: Yahweh perintahkan
  rationale: Perfect Ibrani merujuk pada perintah yang telah diberikan dan tetap berlaku. Dalam bahasa Indonesia, bentuk tanpa penanda kala tetap alami dan tidak memaksakan nuansa waktu yang tidak dinyatakan secara morfologis.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, untuk mempertahankan nama perjanjian dalam teks sumber.
- source_word: לַעֲשֹׂת אֹתָם
  choice: untuk dilakukan
  rationale: Infinitif dengan pronomina objek mengacu pada hal-hal yang harus dilaksanakan. Bentuk pasif “untuk dilakukan” alami setelah “perintahkan” dan tidak menentukan pelaku secara lebih sempit daripada teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama diri ilahi secara langsung. “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: orang Israel atau anak-anak Israel
  rationale: “Bani Israel” mempertahankan sebutan genealogis dan perjanjian, sementara konteks “seluruh umat” memperjelas bahwa acuannya adalah komunitas secara keseluruhan, bukan hanya laki-laki.
- issue: Daya makna הַדְּבָרִים
  choice: hal-hal
  alternative: perkataan-perkataan atau perkara-perkara
  rationale: Kata דְּבָרִים memiliki rentang makna tersebut. “Hal-hal” paling sesuai dengan perintah yang harus dilaksanakan, sedangkan catatan kaki menjaga alternatif leksikal yang asli.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Umat bani Israel” menjaga sifat kolektif עֵדָה sekaligus sebutan perjanjian בְּנֵי יִשְׂרָאֵל. Penanda catatan kaki ditempatkan setelah klausa yang diterangkannya.
