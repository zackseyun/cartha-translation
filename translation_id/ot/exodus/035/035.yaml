  text: מִלֵּ֨א אֹתָ֜/ם חָכְמַת לֵ֗ב לַ/עֲשׂוֹת֮ כָּל מְלֶ֣אכֶת חָרָ֣שׁ וְ/חֹשֵׁב֒ וְ/רֹקֵ֞ם בַּ/תְּכֵ֣לֶת וּ/בָֽ/אַרְגָּמָ֗ן בְּ/תוֹלַ֧עַת הַ/שָּׁנִ֛י וּ/בַ/שֵּׁ֖שׁ וְ/אֹרֵ֑ג עֹשֵׂי֙ כָּל מְלָאכָ֔ה וְ/חֹשְׁבֵ֖י מַחֲשָׁבֹֽת־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/035.yaml
  text: He has filled them with wisdom of heart to do every kind of work of an engraver[a], a designer, and an embroiderer in blue, in purple, in scarlet yarn, and in fine linen[c][b], and of a weaver—makers of every kind of work and designers of designs.
translation:
  language: id
  text: Ia telah memenuhi mereka dengan hikmat hati[b] untuk mengerjakan segala jenis pekerjaan—pekerjaan pengukir[a], perancang, penyulam dengan benang biru, ungu, merah kirmizi, dan linen halus, serta penenun—orang-orang yang mengerjakan segala jenis pekerjaan dan merancang berbagai rancangan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau secara lebih umum, “perajin”. Kata Ibrani ini dapat menunjuk pada perajin terampil secara umum, tetapi di sini mungkin merujuk pada jenis khusus pekerjaan dalam pembuatan Kemah Suci.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “hikmat hati”, ungkapan Ibrani untuk kecakapan, pengertian, dan keterampilan yang berakar dalam batin.
    reason: cultural_note
  - marker: c
    text: 'Ungkapan Ibrani memakai kata-kata yang seakar: secara harfiah, “memikirkan berbagai pemikiran”. Dalam konteks kerajinan, maksudnya ialah merancang pola atau karya artistik.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלֵּא
  choice: telah memenuhi
  rationale: Bentuk piel dari מלא berarti 'memenuhi'. Bentuk 'telah memenuhi' menyatakan tindakan Allah yang sudah dilakukan dalam konteks ini.
- source_word: חָכְמַת לֵב
  choice: hikmat hati
  rationale: Terjemahan harfiah ini mempertahankan ungkapan Ibrani tentang kecakapan dan pengertian yang berakar dalam batin; maknanya dijelaskan dalam catatan kaki.
- source_word: לַעֲשׂוֹת כָּל מְלֶאכֶת
  choice: untuk mengerjakan segala jenis pekerjaan
  rationale: Ungkapan ini menyatakan kemampuan untuk melaksanakan seluruh ragam pekerjaan terampil yang kemudian diperinci.
- source_word: חָרָשׁ
  choice: pengukir
  rationale: Dalam konteks pembuatan Kemah Suci, istilah ini menunjuk pada perajin terampil dan kemungkinan besar pada jenis pekerjaan khusus seperti mengukir; keluasan maknanya dicatat.
- source_word: חֹשֵׁב
  choice: perancang
  rationale: Dalam konteks kerajinan, bentuk partisip ini menunjuk pada orang yang merancang pola atau karya artistik.
- source_word: רֹקֵם
  choice: penyulam
  rationale: Istilah ini secara khusus menunjuk pada pekerja sulam dalam konteks tekstil.
- source_word: תְּכֵלֶת וְאַרְגָּמָן בְּתוֹלַעַת הַשָּׁנִי
  choice: benang biru, ungu, dan merah kirmizi
  rationale: Nama-nama warna dipahami sebagai bahan atau benang berwarna dalam konteks penyulaman; 'benang' dibuat eksplisit sekali agar daftar alami dalam bahasa Indonesia.
- source_word: שֵׁשׁ
  choice: linen halus
  rationale: Dalam konteks Kemah Suci, שש merujuk pada linen bermutu halus.
- source_word: אֹרֵג
  choice: penenun
  rationale: Padanan langsung dan alami untuk partisip yang berarti orang yang menenun.
- source_word: עֹשֵׂי כָּל מְלָאכָה
  choice: orang-orang yang mengerjakan segala jenis pekerjaan
  rationale: Menerjemahkan partisip jamak secara alami sambil mempertahankan cakupan luas כל מלאכה.
- source_word: חֹשְׁבֵי מַחֲשָׁבֹת
  choice: merancang berbagai rancangan
  rationale: Mempertahankan gema etimologis antara verba dan nomina Ibrani sejauh masih wajar dalam bahasa Indonesia; 'berbagai' menyampaikan bentuk jamak.
