base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/025.yaml
  text: 'And every woman wise of heart spun with her hands[a], and they brought what they had spun: the blue, the purple, the scarlet yarn[b], and the fine linen.'
translation:
  language: id
  text: 'Setiap perempuan yang terampil memintal dengan tangannya[a]. Mereka membawa hasil pintalan mereka: benang biru, ungu, dan merah kirmizi, serta lenan halus.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bijaksana hatinya”; ungkapan Ibrani ini menunjuk pada kecakapan praktis yang berakar dalam kebijaksanaan batin.
    reason: lexical_alternative
  - marker: b
    text: Atau, “benang biru, ungu, merah kirmizi, dan lenan halus”; dalam bahasa Ibrani, daftar bahan ini mengikuti frasa “hasil pintalan mereka.”
    reason: alternative_reading
lexical_decisions:
- source_word: חַכְמַת לֵב
  choice: yang terampil hatinya
  rationale: Ungkapan ini mempertahankan unsur 'hati' dalam idiom Ibrani sambil menyampaikan kecakapan praktis secara wajar dalam bahasa Indonesia; maknanya lebih dari sekadar kemampuan teknis.
- source_word: בְּיָדֶיהָ
  choice: dengan tangannya
  rationale: Mencerminkan bet instrumental dan bentuk distributif tunggal yang mengikuti 'setiap perempuan', serta menekankan pengerjaan manual.
- source_word: טָוּוּ
  choice: memintal
  rationale: Kata kerja ini menunjuk pada tindakan memintal serat menjadi benang.
- source_word: וַיָּבִיאוּ
  choice: Mereka membawa
  rationale: Bentuk jamak Ibrani menunjukkan peralihan dari subjek distributif tunggal ('setiap perempuan') kepada para perempuan itu secara kolektif.
- source_word: מַטְוֶה
  choice: hasil pintalan mereka
  rationale: Nomina ini berarti bahan atau benang yang telah dipintal; frasa ini jelas dan alami dalam bahasa Indonesia.
- source_word: תְּכֵלֶת
  choice: benang biru
  rationale: Dalam konteks Kemah Suci, istilah ini menunjuk pada bahan tekstil berwarna biru; 'benang' memperjelas kaitannya dengan kegiatan memintal.
- source_word: אַרְגָּמָן
  choice: ungu
  rationale: Padanan lazim untuk bahan tekstil berwarna ungu; kata 'benang' yang muncul sebelum rangkaian warna berlaku bagi unsur ini juga.
- source_word: תּוֹלַעַת הַשָּׁנִי
  choice: merah tua
  rationale: Ungkapan ini menunjuk pada bahan yang diwarnai merah menyala atau kirmizi; 'merah tua' merupakan padanan Indonesia yang mudah dipahami tanpa membawa asal bahan pewarnanya ke dalam teks utama.
- source_word: שֵׁשׁ
  choice: lenan halus
  rationale: Dalam bagian-bagian tentang Kemah Suci, istilah ini lazim menunjuk pada lenan berkualitas halus.
