base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/023.yaml
  text: And every man with whom blue yarn[a], purple yarn, scarlet yarn, fine linen, goats’ hair, ram skins dyed red, and tahash skins were found brought them.
translation:
  language: id
  text: Setiap laki-laki yang memiliki benang biru, benang ungu, benang merah kirmizi, linen halus, bulu kambing, kulit domba jantan yang diwarnai merah, dan kulit tahas[a] membawanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: kulit tahas. Hewan atau bahan yang disebut tahas tidak diketahui dengan pasti; usulan terjemahan antara lain “kulit bermutu tinggi”, “kulit lumba-lumba”, atau “kulit duyung”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל אִישׁ
  choice: Setiap orang
  rationale: אִישׁ berbentuk maskulin tunggal dan dipakai secara distributif dengan כָל. Dalam bahasa Indonesia, “setiap orang” merupakan padanan alami yang tidak mengubah jumlah atau fungsi distributif ungkapan itu.
- source_word: אֲשֶׁר נִמְצָא אִתּוֹ
  choice: yang memiliki
  rationale: Secara harfiah berarti ‘yang didapati ada padanya’. “Yang memiliki” menyampaikan maksud kepemilikan dengan wajar dalam bahasa Indonesia tanpa menghasilkan susunan pasif yang kaku.
- source_word: תְּכֵלֶת
  choice: benang biru
  rationale: Dalam konteks Kemah Suci, istilah ini menunjuk pada bahan tekstil berwarna biru; “benang biru” membuat jenis bahannya jelas dan selaras dengan unsur tekstil berikutnya.
- source_word: אַרְגָּמָן
  choice: benang ungu
  rationale: Istilah ini menunjuk pada bahan tekstil berwarna ungu. “Benang ungu” konkret, alami, dan konsisten dengan daftar bahan.
- source_word: תוֹלַעַת שָׁנִי
  choice: benang merah tua
  rationale: Ungkapan ini menunjuk pada bahan tekstil berwarna scarlet/crimson. “Merah tua” mudah dipahami dan membedakannya dari warna merah biasa tanpa menentukan corak secara berlebihan.
- source_word: שֵׁשׁ
  choice: linen halus
  rationale: Dalam teks-teks tentang Kemah Suci, שֵׁשׁ lazim menunjuk pada linen bermutu tinggi; “linen halus” mempertahankan nuansa kualitas tersebut.
- source_word: עִזִּים
  choice: bulu kambing
  rationale: Walaupun bentuk Ibraninya secara harfiah berarti ‘kambing’, dalam daftar bahan ini yang dimaksud ialah bulu kambing untuk membuat kain penutup, bukan kambing hidup.
- source_word: עֹרֹת אֵילִם מְאָדָּמִים
  choice: kulit domba jantan yang diwarnai merah
  rationale: Padanan ini mempertahankan jenis kulit serta keterangan bahwa kulit itu telah diberi warna merah.
- source_word: עֹרֹת תְּחָשִׁים
  choice: kulit tahas
  rationale: Identitas תְּחָשׁ tidak pasti. Transliterasi “tahas” menghindari pemilihan spekulatif atas jenis hewan atau kulit tertentu; catatan kaki menjelaskan ketidakpastian itu.
- source_word: הֵבִיאוּ
  choice: membawanya
  rationale: Kata kerja jamak merangkum tindakan orang-orang yang mempunyai bahan-bahan tersebut. Enklitik “-nya” secara alami merujuk pada bahan yang masing-masing mereka miliki.
