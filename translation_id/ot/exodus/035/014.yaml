  text: and the lampstand for the light[a], and its utensils, and its lamps, and the oil for the light,
translation:
  language: id
  text: dan kaki pelita untuk penerangan[a], dan perlengkapannya, dan pelita-pelitanya, dan minyak untuk penerangan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “kaki pelita penerangan” dan “minyak penerangan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנֹרַת הַמָּאוֹר
  choice: kaki pelita untuk penerangan
  rationale: מְנוֹרָה menunjuk pada kaki pelita di Kemah Suci, sedangkan הַמָּאוֹר berarti ‘penerangan/cahaya’. Ungkapan ‘untuk penerangan’ menyampaikan fungsi hubungan konstruktus itu secara alami dalam bahasa Indonesia tanpa menghilangkan unsur penerangan.
- source_word: כֵּלֶיהָ
  choice: perlengkapannya
  rationale: כְּלִי merupakan istilah luas bagi perkakas, wadah, atau alat. ‘Perlengkapannya’ cukup luas, alami, dan tidak merinci benda-benda yang tidak disebutkan oleh teks.
- source_word: נֵרֹתֶיהָ
  choice: pelita-pelitanya
  rationale: נֵרֹת adalah bentuk jamak dari נֵר dan di sini menunjuk pada masing-masing pelita yang menjadi bagian dari kaki pelita. Bentuk ulang menyatakan jamak dengan jelas dalam bahasa Indonesia.
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: minyak untuk penerangan
  rationale: Terjemahan ini mempertahankan pengulangan מָאוֹר dari frasa sebelumnya dan menyatakan secara alami bahwa minyak tersebut digunakan untuk menghasilkan penerangan.
- source_word: וְאֶת ... וְאֶת ... וְאֶת ... וְאֵת
  choice: dan ... dan ... dan ... dan
  rationale: Pengulangan ‘dan’ mempertahankan susunan daftar serta irama inventaris dalam teks Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Kaki pelita’ mengikuti istilah yang lazim dan mudah dipahami untuk מְנוֹרָה; pengulangan ‘dan’ sengaja dipertahankan agar gaya daftar dalam teks sumber tetap terasa.
