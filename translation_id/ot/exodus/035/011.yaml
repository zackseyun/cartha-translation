lexical_decisions:
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: Dalam konteks tempat ibadah Israel, istilah ini menunjuk pada tempat kediaman kudus TUHAN di tengah umat-Nya. “Kemah Suci” merupakan ungkapan Indonesia yang alami dan mapan, sedangkan makna dasarnya, “tempat kediaman,” tetap tersirat dalam konteks.
- source_word: אָהֳלוֹ
  choice: kemahnya
  rationale: אָהֶל berarti “kemah.” Akhiran orang ketiga tunggal merujuk pada Kemah Suci sebagai keseluruhan bangunan, sementara kata ini menunjuk pada unsur kemahnya.
- source_word: מִכְסֵהוּ
  choice: tudungnya
  rationale: מִכְסֶה adalah lapisan penutup pelindung. “Tudung” membedakannya secara alami dari kain kemah tanpa menentukan bahan yang tidak disebutkan dalam ayat ini.
- source_word: קְרָסָיו
  choice: pengait-pengaitnya
  rationale: קֶרֶס menunjuk pada benda penghubung yang menyatukan kain atau penutup. “Pengait” menyampaikan fungsinya dengan jelas tanpa istilah teknis yang berlebihan.
- source_word: קְרָשָׁיו
  choice: papan-papannya
  rationale: קֶרֶשׁ lazim dipahami sebagai papan atau papan tebal dalam konstruksi Kemah Suci, meskipun bentuk rangka juga mungkin.
- source_word: בְּרִיחָיו
  choice: kayu-kayu lintangnya
  rationale: בְּרִיחַ menunjuk pada batang melintang yang menyatukan papan-papan. “Kayu lintang” alami dalam bahasa Indonesia dan menjelaskan fungsi strukturalnya.
- source_word: עַמֻּדָיו
  choice: tiang-tiangnya
  rationale: עַמּוּד berarti penyangga yang berdiri. “Tiang” adalah istilah arsitektural Indonesia yang jelas dan sesuai konteks.
- source_word: אֲדָנָיו
  choice: alas-alasnya
  rationale: אֶדֶן adalah alas atau soket tempat unsur bangunan ditancapkan. “Alas” mudah dipahami dan mempertahankan cakupan istilah Ibraninya.
