lexical_decisions:
- source_word: וְהַנְּשִׂאִם
  choice: Para pemimpin
  rationale: נְשִׂיאִים menunjuk kepada para pemimpin atau kepala umat. “Para pemimpin” jelas dalam bahasa Indonesia modern dan tidak menyiratkan bahwa mereka adalah bangsawan kerajaan.
- source_word: הֵבִיאוּ
  choice: membawa
  rationale: Bentuk Hifil dari בוא di sini berarti membawa atau menyerahkan sesuatu sebagai sumbangan. “Membawa” alami dan sesuai dengan konteks daftar persembahan.
- source_word: אַבְנֵי הַשֹּׁהַם
  choice: batu-batu oniks[a]
  rationale: שֹׁהַם secara tradisional diterjemahkan sebagai oniks, tetapi jenis mineralnya tidak dapat dipastikan. Terjemahan tradisional dipertahankan dan ketidakpastiannya dijelaskan dalam catatan kaki.
- source_word: אַבְנֵי הַמִּלֻּאִים
  choice: batu-batu permata untuk tatahan
  rationale: Dalam konteks perhiasan perlengkapan imam, מִלֻּאִים merujuk pada batu-batu yang dipasang atau ditatahkan. Frasa ini menyampaikan fungsi batu-batu tersebut secara alami tanpa mengikuti ungkapan harfiah yang kabur, “batu-batu pengisian”.
- source_word: לָאֵפֹד
  choice: pada efod
  rationale: אֵפֹד adalah pakaian imam khas yang tidak memiliki padanan tepat dalam bahasa Indonesia; transliterasi “efod” merupakan istilah yang paling jelas dan mapan. Kata depan “pada” menyatakan tempat batu-batu itu dipasang.
- source_word: וְלַחֹשֶׁן
  choice: dan tutup dada[b]
  rationale: חֹשֶׁן menunjuk kepada perlengkapan imam yang dikenakan pada dada dan terikat pada efod. “Tutup dada” menghindari kesan baju zirah yang dapat muncul dari istilah “pelindung dada”.
