lexical_decisions:
- source_word: שֶׁמֶן
  choice: minyak
  rationale: Kata ini berarti minyak, yang dalam konteks ini lazimnya minyak zaitun. Terjemahan “minyak” tidak menambahkan kekhususan yang tidak dinyatakan secara eksplisit.
- source_word: לַמָּאוֹר
  choice: untuk penerangan
  rationale: מָאוֹר berkaitan dengan terang atau sarana penerang. Dalam daftar perlengkapan Kemah Suci, frasa ini menunjuk pada minyak yang digunakan untuk menghasilkan terang; “untuk penerangan” alami dan tepat dalam bahasa Indonesia.
- source_word: בְשָׂמִים
  choice: rempah-rempah
  rationale: Bentuk jamak ini menunjuk pada bahan-bahan beraroma yang dipakai dalam pembuatan benda-benda kudus. “Rempah-rempah” merupakan padanan umum dan mudah dipahami.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: minyak urapan
  rationale: Frasa konstruksi ini merupakan istilah baku bagi minyak khusus yang digunakan untuk mengurapi; “minyak urapan” jelas, ringkas, dan lazim dalam bahasa Indonesia.
- source_word: קְטֹרֶת
  choice: dupa
  rationale: Dalam konteks Kemah Suci, kata ini menunjuk pada bahan harum yang dibakar sebagai dupa, bukan sekadar sesuatu yang dibakar secara umum.
- source_word: הַסַּמִּים
  choice: harum
  rationale: Dalam frasa קְטֹרֶת הַסַּמִּים, bentuk ini secara harfiah menunjuk pada dupa dari bahan-bahan aromatik. “Dupa harum” menyampaikan maknanya secara alami, sementara bentuk yang lebih harfiah dicatat dalam catatan kaki.
