lexical_decisions:
- source_word: הַשֻּׁלְחָן
  choice: meja itu
  rationale: Nomina ini menunjuk pada meja kudus tanpa menyebut fungsinya secara eksplisit; fungsi meja dijelaskan oleh frasa tentang roti pada akhir ayat.
- source_word: בַּדָּיו
  choice: kayu-kayu pengusungnya
  rationale: Dalam konteks Kemah Suci, בַּד menunjuk pada batang atau kayu yang digunakan untuk mengusung perabot kudus. Pilihan ini alami dan menjelaskan fungsinya tanpa menjadi panjang.
- source_word: כָּל כֵּלָיו
  choice: segala perkakasnya
  rationale: כְּלִי merupakan istilah luas bagi berbagai benda atau alat. 'Perkakas' cukup umum untuk mencakup seluruh perlengkapan meja tanpa membatasinya hanya pada wadah.
- source_word: לֶחֶם הַפָּנִים
  choice: roti sajian
  rationale: '''Roti sajian'' adalah istilah Indonesia yang ringkas dan dapat dipahami untuk roti yang terus disajikan di hadapan Allah. Makna harfiah unsur הַפָּנִים, yaitu ''hadirat/wajah'', tetap dicatat dalam catatan kaki.'
theological_decisions:
- issue: Makna frasa kultis לֶחֶם הַפָּנִים
  choice: roti sajian
  alternative: roti Hadirat
  rationale: Teks Ibrani secara harfiah menyatakan 'roti wajah/hadirat' tanpa menyebut nama ilahi. Teks utama memakai ungkapan Indonesia yang lazim, sedangkan catatan kaki mempertahankan bentuk yang lebih harfiah dan tidak menambahkan 'TUHAN' secara interpretatif.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Pengulangan וְאֶת disampaikan sebagai deretan unsur dengan koma dan 'dan', sesuai gaya daftar dalam bahasa Indonesia. Tanda koma akhir dipertahankan karena ayat ini merupakan bagian dari daftar yang berlanjut.
