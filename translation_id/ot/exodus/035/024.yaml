source:
  edition: WLC
  text: כָּל מֵרִ֗ים תְּר֤וּמַת כֶּ֨סֶף֙ וּ/נְחֹ֔שֶׁת הֵבִ֕יאוּ אֵ֖ת תְּרוּמַ֣ת יְהוָ֑ה וְ/כֹ֡ל אֲשֶׁר֩ נִמְצָ֨א אִתּ֜/וֹ עֲצֵ֥י שִׁטִּ֛ים לְ/כָל מְלֶ֥אכֶת הָ/עֲבֹדָ֖ה הֵבִֽיאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/024.yaml
  text: Everyone who offered a contribution of silver or bronze brought Yahweh’s contribution[b][a], and everyone with whom acacia wood was found for any work of the service brought it.
translation:
  language: id
  text: Setiap orang yang mempersembahkan sumbangan berupa perak atau perunggu[a] membawa persembahan untuk Yahweh. Setiap orang yang mempunyai kayu akasia[b] untuk segala pekerjaan pelayanan juga membawanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, «perak dan perunggu». Kata penghubung Ibrani dapat dipahami secara distributif: setiap orang membawa salah satu bahan yang dimilikinya.'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, «yang ditemukan padanya kayu akasia», yaitu yang memiliki kayu akasia atau mempunyai persediaannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל מֵרִים
  choice: Setiap orang yang mempersembahkan
  rationale: Partisipel dari רוּם bersama תְּרוּמָה secara idiomatis menunjuk pada tindakan menyerahkan atau mempersembahkan sumbangan. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan tindakan aktif pemberi.
- source_word: תְּרוּמַת כֶּסֶף וּנְחֹשֶׁת
  choice: sumbangan berupa perak atau perunggu
  rationale: תְּרוּמָה adalah sumbangan atau persembahan yang dikhususkan. נְחֹשֶׁת dapat berarti tembaga atau perunggu; dalam daftar bahan Kemah Suci, 'perunggu' merupakan padanan kontekstual yang lazim. Kata 'atau' menyampaikan maksud distributif bahwa orang membawa logam yang dimilikinya, sementara bentuk harfiahnya dijelaskan dalam catatan kaki.
- source_word: הֵבִיאוּ אֵת תְּרוּמַת יְהוָה
  choice: membawa persembahan bagi Yahweh itu
  rationale: Frasa konstruksi תְּרוּמַת יְהוָה dapat menyatakan persembahan milik Yahweh atau yang diperuntukkan bagi-Nya. 'Bagi Yahweh' terdengar alami dalam bahasa Indonesia tanpa mengubah persembahan menjadi sesuatu yang Yahweh sendiri berikan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi dalam teks Ibrani dipertahankan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: וְכֹל אֲשֶׁר נִמְצָא אִתּוֹ
  choice: Setiap orang yang mempunyai ... juga
  rationale: Secara harfiah ungkapan ini berarti 'setiap orang yang padanya ditemukan', suatu idiom kepemilikan atau ketersediaan. 'Yang mempunyai' menyampaikan maknanya secara wajar; 'juga' menghubungkan klausa kedua dengan klausa pertama.
- source_word: עֲצֵי שִׁטִּים
  choice: kayu akasia
  rationale: Padanan modern yang umum dan mudah dipahami untuk bahan bangunan yang dimaksud, tanpa memakai transliterasi asing.
- source_word: לְכָל מְלֶאכֶת הָעֲבֹדָה
  choice: untuk setiap pekerjaan dalam pelayanan itu
  rationale: Terjemahan ini mempertahankan kedua unsur, מְלָאכָה ('pekerjaan') dan עֲבֹדָה ('pelayanan/pekerjaan'), tanpa menambahkan 'Kemah Suci' yang hanya tersirat oleh konteks.
- source_word: הֵבִיאוּ
  choice: membawanya
  rationale: Akhiran '-nya' merujuk secara alami kepada kayu akasia sebagai nomina massa dan melengkapi klausa dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. Bentuk 'Yahweh' mempertahankan nama perjanjian itu dan mengikuti kebijakan proyek tanpa menggantinya dengan gelar.
- issue: Relasi dalam frasa תְּרוּמַת יְהוָה
  choice: persembahan bagi Yahweh
  alternative: persembahan milik Yahweh
  rationale: Konstruksi Ibrani dapat menyatakan kepunyaan atau peruntukan. Dalam konteks orang membawa bahan-bahan kudus, 'bagi Yahweh' menyampaikan peruntukannya secara alami tanpa menutup sepenuhnya nuansa bahwa persembahan itu menjadi milik-Nya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ayat dibagi menjadi dua kalimat agar mudah dibaca, tanpa menghilangkan kesejajaran dua kelompok pemberi. Istilah 'pelayanan itu' mempertahankan rujukan kontekstual tanpa menambahkan keterangan yang tidak tertulis dalam ayat.
