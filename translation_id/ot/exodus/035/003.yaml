translation:
  language: id
  text: Janganlah kalian menyalakan api di semua tempat tinggal kalian pada hari Sabat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְבַעֲרוּ
  choice: menyalakan
  rationale: Bentuk Piel dari בער di sini berarti membuat api mulai menyala. Ungkapan "menyalakan api" alami dalam bahasa Indonesia dan lebih tepat daripada "membakar api".
- source_word: אֵשׁ
  choice: api
  rationale: Nomina tunggal ini merujuk pada api yang dinyalakan. Bahasa Indonesia tidak memakai kata sandang tak tentu, sehingga cukup diterjemahkan "api".
- source_word: בְּכֹל
  choice: mana pun
  rationale: 'Dengan "tempat tinggalmu", frasa ini menyampaikan daya distributif כֹּל: larangan berlaku di setiap tempat tinggal.'
- source_word: מֹשְׁבֹתֵיכֶם
  choice: tempat tinggalmu
  rationale: מוֹשָׁב dapat berarti tempat kediaman atau wilayah tempat orang menetap. "Tempat tinggal" mempertahankan cakupan yang lebih luas daripada "rumah" dan lebih sesuai daripada "permukiman" dalam konteks larangan ini.
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: pada hari Sabat
  rationale: Terjemahan ini menyatakan fungsi temporal preposisi dan mempertahankan kata "hari" yang terdapat dalam teks Ibrani.
theological_decisions:
- issue: Cakupan larangan Sabat mengenai api
  choice: Menerjemahkan perintah sebagai larangan langsung untuk menyalakan api, tanpa memperluasnya menjadi larangan atas segala penggunaan api atau semua pekerjaan yang melibatkan panas.
  alternative: Menerjemahkannya secara lebih luas sebagai larangan membakar, memelihara, atau menggunakan api.
  rationale: Teks Ibrani secara khusus melarang tindakan menyalakan api di tempat-tempat tinggal orang Israel pada hari Sabat. Terjemahan tidak seharusnya memasukkan perluasan penafsiran yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. Bentuk tunggal kolektif "kamu" mengikuti sapaan jamak Ibrani kepada umat, sedangkan "tempat tinggalmu mana pun" menyampaikan cakupan distributif tanpa ungkapan yang kaku.
