lexical_decisions:
- source_word: קַלְעֵי
  choice: tirai-tirai
  rationale: Kata ini menunjuk pada lembaran-lembaran kain yang membentuk pembatas pelataran. 'Tirai-tirai' alami dalam bahasa Indonesia dan sesuai dengan bentuk jamak sumber.
- source_word: הֶחָצֵר
  choice: pelataran
  rationale: Dalam konteks Kemah Suci, kata ini menunjuk pada ruang luar yang dikelilingi pembatas. 'Pelataran' merupakan istilah Indonesia yang jelas dan bermartabat.
- source_word: עַמֻּדָיו
  choice: tiang-tiangnya
  rationale: Kata ini menunjuk pada penyangga tegak bagi tirai pelataran; 'tiang' lebih alami daripada 'pilar' untuk konstruksi tersebut.
- source_word: אֲדָנֶיהָ
  choice: alas-alasnya
  rationale: Kata ini menunjuk pada bagian dasar atau dudukan penyangga tiang. 'Alas' mudah dipahami tanpa menghilangkan fungsi bendanya.
- source_word: מָסַךְ
  choice: tirai
  rationale: Dalam konteks Kemah Suci, kata ini adalah kain penutup pada jalan masuk. Bahasa Indonesia dapat memakai 'tirai' di sini, sementara fungsi khususnya dijelaskan oleh frasa 'pintu gerbang'.
- source_word: שַׁעַר
  choice: pintu gerbang
  rationale: Kata ini menunjuk pada bukaan masuk pelataran. 'Pintu gerbang' merupakan padanan langsung dan alami dalam bahasa Indonesia.
