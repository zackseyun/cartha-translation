  text: וְ/כָל חֲכַם לֵ֖ב בָּ/כֶ֑ם יָבֹ֣אוּ וְ/יַעֲשׂ֔וּ אֵ֛ת כָּל אֲשֶׁ֥ר צִוָּ֖ה יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/010.yaml
  text: And every skillful person among you shall come and make all that Yahweh has commanded:[a][b]
translation:
  language: id
  text: Dan setiap orang yang terampil di antara kamu harus datang dan membuat segala sesuatu yang telah diperintahkan Yahweh:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “bijaksana hati”, sebuah ungkapan bagi orang yang terampil atau cakap, khususnya dalam pekerjaan kerajinan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “semua orang yang terampil di antara kamu”. Bentuk Ibraninya secara gramatikal maskulin tunggal, tetapi digunakan dengan makna distributif.
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כָל
  choice: Dan setiap
  rationale: וְ menghubungkan ayat ini dengan perintah sebelumnya, sedangkan כָל diikuti nomina tunggal memiliki daya distributif; karena itu, “setiap” lebih tepat daripada “semua” dalam teks utama.
- source_word: חֲכַם לֵב
  choice: orang yang terampil
  rationale: Ungkapan Ibrani ini secara harfiah berarti “bijaksana hati”, tetapi dalam konteks pembuatan Kemah Suci menunjuk pada kecakapan praktis atau keterampilan sebagai perajin.
- source_word: בָּ/כֶם
  choice: di antara kamu
  rationale: Preposisi ב dengan sufiks orang kedua jamak menunjukkan orang-orang yang berada dalam lingkungan umat itu.
- source_word: יָבֹאוּ
  choice: harus datang
  rationale: Bentuk imperfek orang ketiga jamak berfungsi sebagai arahan dalam seruan ini; “harus datang” menyampaikan daya perintahnya secara wajar dalam bahasa Indonesia.
- source_word: וְ/יַעֲשׂוּ
  choice: dan membuat
  rationale: Dalam konteks pembangunan Kemah Suci dan perlengkapannya, עָשָׂה mengacu pada tindakan membuat atau mengerjakan benda-benda tersebut.
- source_word: אֵת כָּל אֲשֶׁר
  choice: segala sesuatu yang
  rationale: Rangkaian ini menyatakan keseluruhan hal yang menjadi objek perintah dan diterjemahkan secara alami sebagai “segala sesuatu yang”.
- source_word: צִוָּה יְהוָה
  choice: yang telah diperintahkan Yahweh
  rationale: Bentuk perfektif menunjukkan bahwa perintah itu sudah diberikan sebelum tindakan yang kini dituntut. Nama ilahi יְהוָה dialihaksarakan sebagai “Yahweh”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks secara langsung memakai Tetragramaton, yaitu nama perjanjian ilahi; “Yahweh” mempertahankan nama itu alih-alih menggantinya dengan gelar.
- issue: Ungkapan bergender חֲכַם לֵב
  choice: setiap orang yang terampil
  alternative: setiap laki-laki yang terampil
  rationale: Bentuk Ibraninya secara gramatikal maskulin tunggal, tetapi memiliki daya distributif dan menunjuk pada siapa pun di tengah umat yang memiliki kecakapan tersebut. Bahasa Indonesia tidak menandai gender gramatikal pada “orang”; menerjemahkannya sebagai “laki-laki” akan menambahkan pembatasan jenis kelamin yang tidak harus dinyatakan oleh konstruksi ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang wajar dan bermartabat. “Orang yang terampil” mudah dipahami dan menyampaikan makna idiom Ibrani tanpa menjadikannya semata-mata kebijaksanaan intelektual. Tanda titik dua dipertahankan karena ayat-ayat berikutnya merinci segala sesuatu yang harus dibuat.
