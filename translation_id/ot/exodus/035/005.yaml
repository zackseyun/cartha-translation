  text: קְח֨וּ מֵֽ/אִתְּ/כֶ֤ם תְּרוּמָה֙ לַֽ/יהוָ֔ה כֹּ֚ל נְדִ֣יב לִבּ֔/וֹ יְבִיאֶ֕/הָ אֵ֖ת תְּרוּמַ֣ת יְהוָ֑ה זָהָ֥ב וָ/כֶ֖סֶף וּ/נְחֹֽשֶׁת׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/005.yaml
  text: 'Take from among you an offering for Yahweh[a]. Everyone whose heart is willing shall bring it—Yahweh’s offering: gold, silver[b], and bronze.'
translation:
  language: id
  text: Ambillah dari antara kamu suatu persembahan bagi Yahweh. Setiap orang yang hatinya rela[a] hendaklah membawanya—yakni persembahan bagi Yahweh:[b] emas, perak, dan perunggu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “setiap orang yang hatinya rela”; ungkapan ini menunjuk pada kerelaan batin.
    reason: lexical_alternative
  - marker: b
    text: Atau, “persembahan milik Yahweh.”
    reason: alternative_reading
lexical_decisions:
- source_word: קְחוּ
  choice: Ambillah
  rationale: Bentuk perintah jamak dari לקח diterjemahkan secara langsung. Akhiran -lah menyampaikan perintah dengan wajar dan bermartabat dalam bahasa Indonesia.
- source_word: מֵאִתְּכֶם
  choice: dari antara kamu
  rationale: Ungkapan ini menunjukkan sumber yang berasal dari tengah komunitas, bukan sekadar kepemilikan perseorangan.
- source_word: תְּרוּמָה
  choice: persembahan
  rationale: Dalam konteks bahan-bahan Kemah Suci, kata ini menunjuk pada sumbangan yang dikhususkan bagi tujuan suci. 'Persembahan' alami dalam bahasa Indonesia dan tidak menyiratkan ritual pengunjukan tertentu.
- source_word: לַיהוָה / יְהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menyatakan peruntukan atau penyerahan kepada Yahweh; nama perjanjian יהוה dipertahankan sebagai 'Yahweh'.
- source_word: כֹּל נְדִיב לִבּוֹ
  choice: Setiap orang yang hatinya rela
  rationale: Pilihan ini mempertahankan gambaran 'hati' sekaligus menyampaikan kerelaan batin secara alami dan tanpa membatasi ungkapan itu hanya kepada laki-laki.
- source_word: יְבִיאֶהָ
  choice: hendaklah membawanya
  rationale: Bentuk ini menyatakan tindakan yang diharapkan, sementara 'hendaklah' tidak menghapus sifat sukarela yang ditegaskan oleh frasa sebelumnya. Akhiran -nya merujuk kepada persembahan.
- source_word: אֵת תְּרוּמַת יְהוָה
  choice: sebagai persembahan bagi Yahweh
  rationale: Frasa ini menjelaskan kembali persembahan tersebut. 'Bagi Yahweh' mempertahankan kemungkinan makna peruntukan, sedangkan catatan kaki mencatat kemungkinan konstruksi kepunyaan.
- source_word: זָהָב וָכֶסֶף וּנְחֹשֶׁת
  choice: emas, perak, dan perunggu
  rationale: Daftar logam diterjemahkan dengan istilah Indonesia yang lazim. Dalam konteks perlengkapan Kemah Suci, נְחֹשֶׁת secara konvensional dan masuk akal menunjuk pada perunggu, meskipun tembaga juga mungkin secara leksikal.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian tersebut dan membedakannya dari gelar umum 'Tuhan'.
- issue: Hubungan persembahan dengan Yahweh dalam תְּרוּמַת יְהוָה
  choice: persembahan bagi Yahweh
  alternative: persembahan milik Yahweh
  rationale: Konteks menekankan bahan yang diserahkan untuk karya suci, sehingga makna peruntukan paling alami dalam teks utama. Namun, bentuk konstruksi Ibrani juga dapat dipahami sebagai kepunyaan; kemungkinan itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur ayat mempertahankan pengulangan 'persembahan bagi Yahweh' dan gambaran hati dalam sumber Ibrani. Tanda titik dua memperkenalkan daftar bahan tanpa menambahkan unsur yang tidak terdapat dalam teks.
