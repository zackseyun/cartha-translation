translation:
  language: id
  text: Semua perempuan yang hatinya mendorong mereka untuk memintal bulu kambing dengan terampil[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kambing-kambing”; dalam konteks ini, bahasa Ibrani memakai ungkapan eliptis yang menunjuk pada bulu kambing untuk dipintal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנָּשִׁים
  choice: Semua perempuan
  rationale: כָּל dengan nomina jamak menyatakan keseluruhan kelompok; bentuk ini alami dalam bahasa Indonesia. Konjungsi וְ tidak perlu diterjemahkan secara tersendiri dalam ayat tunggal ini.
- source_word: אֲשֶׁר נָשָׂא לִבָּן אֹתָנָה
  choice: yang hatinya menggerakkan mereka
  rationale: Ungkapan Ibrani secara harfiah menggambarkan hati yang 'mengangkat' mereka, yaitu dorongan batin atau kerelaan. 'Menggerakkan' mempertahankan gambaran hati sebagai pendorong tanpa terdengar janggal.
- source_word: בְּחָכְמָה
  choice: untuk bekerja dengan terampil
  rationale: Dalam konteks pembuatan perlengkapan Kemah Suci, חָכְמָה menunjuk pada kecakapan praktis. Penambahan 'bekerja' memperjelas hubungan frasa ini dengan dorongan hati dan tindakan memintal dalam bahasa Indonesia.
- source_word: טָווּ
  choice: memintal
  rationale: Verba ini menunjuk pada pekerjaan memintal serat menjadi benang; 'memintal' merupakan padanan Indonesia yang langsung dan tepat.
- source_word: אֶת הָעִזִּים
  choice: bulu kambing
  rationale: Secara harfiah teks berbunyi 'kambing-kambing itu', tetapi konteks tekstil menunjukkan elipsis bagi bulu kambing yang dipintal. Padanan ini mencegah kesan keliru bahwa hewan hiduplah yang dipintal.
