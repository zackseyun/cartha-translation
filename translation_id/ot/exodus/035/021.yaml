id: EXO.35.21
reference: Exodus 35:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּבֹ֕אוּ כָּל אִ֖ישׁ אֲשֶׁר נְשָׂא֣/וֹ לִבּ֑/וֹ וְ/כֹ֡ל אֲשֶׁר֩ נָדְבָ֨ה רוּח֜/וֹ אֹת֗/וֹ הֵ֠בִיאוּ אֶת תְּרוּמַ֨ת יְהוָ֜ה לִ/מְלֶ֨אכֶת אֹ֤הֶל מוֹעֵד֙ וּ/לְ/כָל עֲבֹ֣דָת֔/וֹ וּ/לְ/בִגְדֵ֖י הַ/קֹּֽדֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/021.yaml
  text: And everyone came whose heart stirred him[a], and everyone whose spirit moved him willingly brought Yahweh’s contribution for the work of the tent of meeting, for all its service[b], and for the holy garments.
translation:
  language: id
  text: Lalu datanglah setiap orang yang hatinya tergerak[a], dan setiap orang yang rohnya membuatnya rela. Mereka membawa persembahan bagi Yahweh[b] untuk pekerjaan Kemah Pertemuan, untuk seluruh pelayanannya, dan untuk pakaian kudus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang hatinya mengangkat dia.” Ungkapan Ibrani ini menggambarkan dorongan batin untuk bertindak.
    reason: lexical_alternative
  - marker: b
    text: Atau “persembahan Yahweh.” Frasa Ibrani ini dapat berarti persembahan yang dikhususkan bagi Yahweh atau persembahan milik Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Lalu datanglah
  rationale: Bentuk naratif dari בוא berarti datang. Partikel penghubung diterjemahkan “lalu” agar urutan tindakan terdengar alami dalam bahasa Indonesia.
- source_word: כָּל אִישׁ
  choice: setiap orang
  rationale: Secara harfiah “setiap laki-laki/orang,” tetapi di sini bersifat distributif dan generik; “setiap orang” alami dan tidak mempersempit kelompok pemberi.
- source_word: אֲשֶׁר נְשָׂאוֹ לִבּוֹ
  choice: yang hatinya tergerak
  rationale: Ungkapan Ibrani secara harfiah menyatakan bahwa hatinya “mengangkat” dia. “Hatinya tergerak” menyampaikan dorongan batin secara wajar tanpa menetapkan sumber dorongan itu secara lebih khusus.
- source_word: וְכֹל אֲשֶׁר נָדְבָה רוּחוֹ אֹתוֹ
  choice: dan setiap orang yang rohnya mendorongnya untuk memberi dengan sukarela
  rationale: נדב menonjolkan kesediaan sukarela, sedangkan רוּחוֹ ... אֹתוֹ menggambarkan dorongan batin. Rumusan ini mempertahankan kedua unsur tersebut.
- source_word: הֵבִיאוּ
  choice: Mereka membawa
  rationale: Kata kerja ini berarti “membawa.” Pengulangan subjek kolektif sebagai “mereka” memperjelas sintaksis panjang dalam bahasa Indonesia.
- source_word: תְּרוּמַת יְהוָה
  choice: persembahan bagi Yahweh
  rationale: תְּרוּמָה adalah sumbangan atau persembahan yang dikhususkan. Genitif dengan nama ilahi dapat menyatakan milik atau tujuan; “bagi Yahweh” paling jelas dalam konteks pemberian tanpa meniadakan kemungkinan nuansa milik-Nya.
- source_word: לִמְלֶאכֶת אֹהֶל מוֹעֵד
  choice: untuk pekerjaan Kemah Pertemuan
  rationale: מְלָאכָה menunjuk pada pekerjaan atau tugas pembuatan, sedangkan אֹהֶל מוֹעֵד diterjemahkan dengan sebutan baku “Kemah Pertemuan.”
- source_word: וּלְכָל עֲבֹדָתוֹ
  choice: untuk seluruh pelayanannya
  rationale: עֲבֹדָה dalam konteks kemah suci mencakup pelayanan, tugas, dan pengerjaannya. Akhiran pronominal dipertahankan sebagai “-nya,” merujuk pada Kemah Pertemuan.
- source_word: וּלְבִגְדֵי הַקֹּדֶשׁ
  choice: dan untuk pakaian-pakaian kudus
  rationale: Frasa ini menunjuk pada pakaian imam yang dikhususkan. Bentuk ulang menyatakan jamak dengan jelas, dan “kudus” mempertahankan istilah kekudusan sumber.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama pribadi ilahi. “Yahweh” mempertahankan nama itu secara langsung.
- issue: Arah relasi dalam תְּרוּמַת יְהוָה
  choice: persembahan bagi Yahweh
  alternative: persembahan milik Yahweh
  rationale: Konstruksi genitif dapat dipahami sebagai persembahan yang menjadi milik Yahweh atau yang ditujukan kepada-Nya. Konteks pengumpulan bahan mendukung “bagi Yahweh,” sementara catatan kaki menjaga ambiguitas gramatikalnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dipecah menjadi dua agar mudah dipahami tanpa mengubah hubungan antarklausa. Namun, penanda [b] wajib muncul dalam teks utama; karena catatan [b] menjelaskan “persembahan bagi Yahweh,” teks publikasi seharusnya dibaca “persembahan bagi Yahweh[b]”.
