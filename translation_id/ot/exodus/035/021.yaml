    rationale: Ibrani menyatakan bahwa rohnya menjadikannya rela/bersedia, lalu verba berikutnya menyatakan bahwa mereka membawa persembahan. “Rohnya membuatnya rela” mempertahankan pembagian itu dengan lebih dekat.
