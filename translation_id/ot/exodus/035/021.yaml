revisions:
- from: Lalu datanglah setiap orang yang hatinya tergerak[a], dan setiap orang yang rohnya mendorongnya untuk memberi dengan sukarela. Mereka membawa persembahan bagi Yahweh untuk pekerjaan Kemah Pertemuan, untuk seluruh pelayanannya, dan untuk pakaian-pakaian kudus.
  to: Lalu datanglah setiap orang yang hatinya tergerak[a], dan setiap orang yang rohnya membuatnya rela. Mereka membawa persembahan bagi Yahweh[b] untuk pekerjaan Kemah Pertemuan, untuk seluruh pelayanannya, dan untuk pakaian kudus.
  rationale: 'Revisi menambahkan jangkar [b] dan catatan kaki Indonesia yang menjelaskan ambiguitas genitif pada “persembahan bagi Yahweh.” Anak kalimat tentang roh juga dipadatkan menjadi bentuk yang lebih dekat dengan sumber: roh itu menjadikan orang tersebut rela, sedangkan tindakan membawa tetap dinyatakan dalam kalimat berikutnya. Istilah kolektif “pakaian kudus” digunakan demi kelancaran bahasa Indonesia tanpa mengubah rujukannya.'
