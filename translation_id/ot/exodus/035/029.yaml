  text: כָּל אִ֣ישׁ וְ/אִשָּׁ֗ה אֲשֶׁ֨ר נָדַ֣ב לִבָּ/ם֮ אֹתָ/ם֒ לְ/הָבִיא֙ לְ/כָל הַ/מְּלָאכָ֔ה אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה לַ/עֲשׂ֖וֹת בְּ/יַד מֹשֶׁ֑ה הֵבִ֧יאוּ בְנֵי יִשְׂרָאֵ֛ל נְדָבָ֖ה לַ/יהוָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/029.yaml
  text: Every man and woman whose heart moved them to bring something for all the work that Yahweh had commanded to be done through Moses—the children of Israel brought a freewill offering to Yahweh[a][b][c].
translation:
  language: id
  text: Setiap laki-laki dan perempuan yang hatinya tergerak untuk membawa sesuatu bagi seluruh pekerjaan yang Yahweh perintahkan untuk dilakukan melalui Musa, dari antara orang Israel, membawa persembahan sukarela kepada Yahweh.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “yang hatinya menggerakkan mereka” atau “yang hatinya menjadikan mereka rela.” Ungkapan Ibrani ini menyatakan kerelaan atau dorongan batin.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “dengan tangan Musa,” sebuah ungkapan yang berarti “melalui Musa” atau “dengan Musa sebagai perantara.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah “anak-anak Israel”; maksudnya, orang Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ וְאִשָּׁה
  choice: Setiap laki-laki dan perempuan
  rationale: Mempertahankan penyebutan eksplisit laki-laki dan perempuan serta daya distributif כָּל dalam bahasa Indonesia yang wajar.
- source_word: נָדַב לִבָּם אֹתָם
  choice: yang hatinya terdorong
  rationale: Ungkapan Ibrani ini menunjuk pada kerelaan atau dorongan batin; pilihan ini alami tanpa menghilangkan unsur kehendak sukarela.
- source_word: לְהָבִיא
  choice: untuk membawa sesuatu
  rationale: Kata kerja berarti 'membawa'; 'sesuatu' melengkapi objek yang tersirat dari konteks, yaitu sumbangan bagi pekerjaan itu.
- source_word: לְכָל הַמְּלָאכָה
  choice: bagi seluruh pekerjaan
  rationale: מְלָאכָה mencakup seluruh pekerjaan pembuatan Kemah Suci dan perlengkapannya.
- source_word: אֲשֶׁר צִוָּה יְהוָה לַעֲשׂוֹת בְּיַד מֹשֶׁה
  choice: yang diperintahkan Yahweh untuk dilakukan melalui Musa
  rationale: בְּיַד מֹשֶׁה secara harfiah 'dengan/perantaraan tangan Musa' merupakan idiom perantaraan atau keagenan; 'melalui Musa' menyampaikan maknanya secara jelas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: הֵבִיאוּ בְנֵי יִשְׂרָאֵל
  choice: orang Israel membawa
  rationale: בְנֵי יִשְׂרָאֵל adalah sebutan etnis baku; 'orang Israel' lebih alami dalam bahasa Indonesia modern daripada terjemahan harfiah 'anak-anak Israel'.
- source_word: נְדָבָה
  choice: persembahan sukarela
  rationale: Menunjukkan persembahan yang diberikan dengan sukarela, bukan karena paksaan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Ayat ini memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama pribadi ilahi dan tidak menggantinya dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Struktur kalimat mempertahankan rangkaian panjang serta penegasan sukarela dalam teks Ibrani; tanda pisah membantu menandai dimulainya klausa utama.
