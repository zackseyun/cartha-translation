  source_fidelity: 'Teks Indonesia dengan tepat mencerminkan tiga unsur daftar Ibrani: יתדות המשכן, יתדות החצר, dan מיתריהם. “Patok-patok” memadai untuk יתדות; “Kemah Suci” dan “pelataran” sesuai konteks; “tali-talinya” secara wajar menyatakan מיתריהם (“tali-tali mereka”). Tanda pisah akhir tepat mempertahankan sifat daftar yang berlanjut.'
