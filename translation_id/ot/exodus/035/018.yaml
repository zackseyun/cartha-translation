  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִתְדֹת
  choice: patok-patok
  rationale: Menunjuk pada pasak atau patok yang digunakan untuk menambatkan Kemah Suci dan tirai pelataran. “Patok-patok” alami dalam bahasa Indonesia dan sesuai dengan bentuk jamak sumber.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: Dalam konteks Keluaran, מִשְׁכָּן adalah tempat kediaman kudus yang dapat dipindahkan. “Kemah Suci” merupakan istilah Indonesia yang jelas, lazim, dan langsung menunjukkan bangunan ibadah tersebut.
- source_word: הֶחָצֵר
  choice: pelataran
  rationale: Menunjuk pada area luar berpagar yang mengelilingi Kemah Suci. “Pelataran” ringkas dan sesuai dengan konteks bangunan ibadah.
- source_word: מֵיתְרֵיהֶם
  choice: tali-talinya
  rationale: Menunjuk pada tali-tali penambat yang berkaitan dengan Kemah Suci dan pelataran. Akhiran -nya mempertahankan rujukan jamak yang secara gramatikal dapat mencakup keduanya.
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: patok-patok ... patok-patok ... dan tali-talinya
  rationale: Penanda objek tidak diterjemahkan secara tersendiri, sedangkan susunan daftar berkoordinasi dipertahankan secara alami dalam bahasa Indonesia.
