lexical_decisions:
- source_word: הַבֹּשֶׂם
  choice: rempah-rempah
  rationale: Kata ini menunjuk pada bahan aromatik atau rempah. Dalam daftar bahan Kemah Suci, “rempah-rempah” jelas, alami, dan tidak mempersempit maknanya menjadi jenis damar tertentu.
- source_word: הַשָּׁמֶן לְמָאוֹר
  choice: minyak untuk penerangan
  rationale: שֶׁמֶן berarti minyak tanpa menyebutkan secara eksplisit bahwa itu minyak zaitun, sedangkan לְמָאוֹר menyatakan kegunaannya untuk menghasilkan terang. “Untuk penerangan” alami dalam bahasa Indonesia dan tidak menambahkan lampu tertentu.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: minyak urapan
  rationale: Ungkapan baku dan ringkas dalam bahasa Indonesia untuk minyak yang dipakai dalam pengurapan sakral.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: dupa wangi
  rationale: קְטֹרֶת berarti dupa dan סַמִּים menunjuk pada bahan-bahan aromatik. “Dupa wangi” menyampaikan konstruksi itu secara alami, sementara alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: וְ/אֶת ... וְ/אֶת ... וּ/לְ ... וְ/לִ
  choice: juga ... dan ... untuk ... dan untuk
  rationale: Ayat ini melanjutkan daftar persembahan dari ayat sebelumnya. “Juga” menandai kesinambungan tersebut, sedangkan pengulangan penghubung dan kata “untuk” mempertahankan susunan daftar Ibrani secara wajar.
