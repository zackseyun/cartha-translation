  text: dan untuk merancang rancangan-rancangan[a], serta mengerjakan emas, perak, dan perunggu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “untuk merancang rancangan-rancangan.” Bahasa Ibrani memakai kata kerja dan kata benda dari akar yang sama untuk menekankan kecakapan dalam menciptakan rancangan artistik.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani ini juga dapat diterjemahkan “tembaga.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לַ/חְשֹׁב מַחַשָׁבֹת
  choice: dan untuk menyusun berbagai rancangan
  rationale: Kata kerja dan kata benda Ibrani berasal dari akar yang sama dan menunjuk pada perencanaan artistik yang terampil. Ungkapan ini mempertahankan makna tersebut dalam bahasa Indonesia yang alami; unsur pengulangan dalam bahasa sumber dijelaskan dalam catatan kaki.
- source_word: לַ/עֲשֹׂת
  choice: serta mengerjakan
  rationale: Dalam konteks keterampilan mengolah logam, עשה menunjuk pada pelaksanaan atau pengerjaan, bukan sekadar tindakan umum 'membuat'. 'Mengerjakan' sesuai dengan deretan bahan yang mengikutinya.
- source_word: בַּ/זָּהָב
  choice: emas
  rationale: Preposisi ב menandai bahan atau ranah pengerjaan. Dalam bahasa Indonesia, konstruksi 'mengerjakan emas' sudah secara idiomatis menyatakan bahan sehingga preposisi tidak perlu diterjemahkan tersendiri.
- source_word: וּ/בַ/כֶּסֶף
  choice: perak
  rationale: Terjemahan baku untuk כֶּסֶף sebagai bahan logam dalam daftar bahan.
- source_word: וּ/בַ/נְּחֹשֶׁת
  choice: perunggu
  rationale: Dalam konteks perlengkapan Kemah Suci, 'perunggu' merupakan padanan konvensional dan masuk akal, meskipun 'tembaga' juga mungkin secara leksikal.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Menyusun berbagai rancangan' dipilih agar alami bagi pembaca umum, sedangkan 'mengerjakan emas, perak, dan perunggu' mempertahankan konteks keahlian mengolah bahan tanpa menambahkan objek yang tidak tersurat.
