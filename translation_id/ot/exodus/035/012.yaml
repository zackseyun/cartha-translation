lexical_decisions:
- source_word: הָאָרֹן
  choice: tabut itu
  rationale: Dalam konteks Kemah Suci, אָרוֹן menunjuk pada peti suci yang dikenal sebagai tabut. Kata penentu pada bahasa Ibrani diwakili secara alami dengan “itu” dalam penggalan daftar ini.
- source_word: בַּדָּיו
  choice: kayu-kayu pengusungnya
  rationale: בַּדִּים adalah batang-batang untuk mengusung perlengkapan suci. Ungkapan ini jelas dan lazim dalam bahasa Indonesia serta menyatakan fungsinya.
- source_word: הַכַּפֹּרֶת
  choice: tutup pendamaian
  rationale: Istilah ini menamai tutup emas pada tabut dan memiliki kaitan kultis dengan pendamaian. “Tutup pendamaian” mempertahankan baik bentuk bendanya maupun bobot teologis istilah tersebut.
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: tirai penyekat
  rationale: פָּרֹכֶת adalah tirai bagian dalam, sedangkan מָסָךְ menonjolkan fungsi menudungi atau menyekat. “Tirai penyekat” menyampaikan gabungan kedua unsur secara alami tanpa menambahkan tujuan yang tidak dinyatakan.
- source_word: אֶת / וְאֶת
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel-partikel ini menandai objek langsung tertentu; hubungan koordinasinya dinyatakan melalui koma dan kata “dan” dalam bahasa Indonesia.
theological_decisions:
- issue: Makna הַכַּפֹּרֶת dalam konteks Kemah Suci
  choice: tutup pendamaian
  alternative: tutup tabut
  rationale: Istilah Ibrani ini secara konkret menunjuk pada tutup tabut, tetapi juga berkaitan erat dengan tindakan pendamaian. Terjemahan utama mempertahankan kaitan kultis itu, sedangkan catatan kaki menjaga kemungkinan terjemahan yang lebih konkret.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan khidmat. Bentuk jamak ulang pada “kayu-kayu pengusung” dipakai agar jumlah batang tetap tersampaikan. Teks dipertahankan sebagai penggalan daftar sesuai ayat sumber.
