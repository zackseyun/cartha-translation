  text: אֶת בִּגְדֵ֥י הַ/שְּׂרָ֖ד לְ/שָׁרֵ֣ת בַּ/קֹּ֑דֶשׁ אֶת בִּגְדֵ֤י הַ/קֹּ֨דֶשׁ֙ לְ/אַהֲרֹ֣ן הַ/כֹּהֵ֔ן וְ/אֶת בִּגְדֵ֥י בָנָ֖י/ו לְ/כַהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/019.yaml
  text: the finely woven garments for ministering in the sanctuary[a], the holy garments for Aaron the priest[b], and the garments of his sons for serving as priests.
translation:
  language: id
  text: pakaian yang ditenun dengan halus[a] untuk pelayanan di tempat kudus[b], pakaian kudus untuk Imam Harun, dan pakaian putra-putranya untuk menjalankan tugas sebagai imam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pakaian pelayanan”; istilah Ibraninya dapat menunjuk pada pakaian khusus untuk pelayanan.
    reason: lexical_alternative
  - marker: b
    text: Atau “di kawasan kudus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּגְדֵי
  choice: pakaian
  rationale: Kata ini secara umum berarti pakaian; pilihan ini alami dalam bahasa Indonesia dan sesuai untuk busana imam tanpa memasukkan istilah gerejawi yang lebih kemudian.
- source_word: הַשְּׂרָד
  choice: yang ditenun dengan halus
  rationale: Dalam konteks perlengkapan Kemah Suci, istilah ini kemungkinan menunjuk pada hasil tenunan khusus. Terjemahan ini menyampaikan mutu pengerjaannya sambil mencatat kemungkinan makna lain dalam catatan kaki.
- source_word: לְשָׁרֵת
  choice: untuk melayani
  rationale: Bentuk ini menyatakan tujuan dan mempertahankan nuansa pelayanan dalam lingkungan ibadah.
- source_word: בַּקֹּדֶשׁ
  choice: di tempat kudus
  rationale: Dalam konteks ini, קֹדֶשׁ menunjuk pada ruang atau kawasan yang dikuduskan, bukan pada kekudusan sebagai gagasan abstrak.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: pakaian kudus
  rationale: Terjemahan langsung ini mempertahankan hubungan konstruksi Ibrani dan menunjukkan pakaian yang dikhususkan bagi pelayanan suci.
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: untuk Imam Harun
  rationale: Dalam bahasa Indonesia, gelar jabatan lazim ditempatkan sebelum nama; bentuk ini jelas dan wajar.
- source_word: בִּגְדֵי בָנָיו
  choice: pakaian anak-anaknya
  rationale: Pilihan ini mempertahankan struktur frasa sumber dan merujuk kepada anak-anak lelaki Harun dari konteks.
- source_word: לְכַהֵן
  choice: untuk menjalankan tugas sebagai imam
  rationale: Infinitif piel dari כהן berarti berfungsi atau bertugas sebagai imam; ungkapan ini mempertahankan daya verbalnya dan jelas bagi pembaca modern.
theological_decisions:
- issue: Hubungan antara בִּגְדֵי הַשְּׂרָד dan בִּגְדֵי הַקֹּדֶשׁ
  choice: 'Memperlakukan keduanya sebagai unsur yang dibedakan dalam daftar: pakaian tenunan khusus untuk pelayanan, lalu pakaian kudus bagi Harun dan anak-anaknya.'
  alternative: Menganggap frasa pertama sebagai keterangan lain bagi pakaian imam yang disebut sesudahnya.
  rationale: Pengulangan penanda objek אֶת mendukung pembacaan sebagai unsur-unsur daftar yang dibedakan, meskipun fungsi sakralnya dapat bertumpang tindih. Terjemahan tidak menyatukan keduanya tanpa keharusan tekstual.
- issue: Rujukan בַּקֹּדֶשׁ
  choice: Memahaminya secara lokatif sebagai “di tempat kudus.”
  alternative: Menerjemahkannya “di kawasan kudus” atau, secara kurang mungkin dalam konteks ini, “dalam kekudusan.”
  rationale: Konteks Kemah Suci mendukung rujukan kepada lokasi sakral, tetapi cakupan tepat istilahnya tidak dipersempit lebih jauh dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. “Imam Harun” mengikuti susunan gelar yang alami dalam bahasa Indonesia. Teks mempertahankan urutan daftar Ibrani dan tidak mempersempit “tempat kudus” menjadi bagian tertentu dari Kemah Suci.
