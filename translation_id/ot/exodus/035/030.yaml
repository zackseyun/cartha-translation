id: EXO.35.30
reference: Exodus 35:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל רְא֛וּ קָרָ֥א יְהוָ֖ה בְּ/שֵׁ֑ם בְּצַלְאֵ֛ל בֶּן אוּרִ֥י בֶן ח֖וּר לְ/מַטֵּ֥ה יְהוּדָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/030.yaml
  text: Then Moses said to the sons of Israel[a], “See, Yahweh has called by name Bezalel son of Uri, son of Hur, of the tribe of Judah.”
translation:
  language: id
  text: Lalu Musa berkata kepada orang Israel[a], “Lihatlah, Yahweh telah memanggil dengan nama Bezaleel, anak Uri, anak Hur, dari suku Yehuda.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Israel”; dapat juga diterjemahkan “anak-anak Israel.” Dalam konteks ini ungkapan itu menunjuk kepada orang Israel sebagai suatu bangsa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Waw konsekutif melanjutkan alur narasi; “Lalu” wajar dalam bahasa Indonesia modern dan mempertahankan urutan peristiwa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan Ibrani harfiahnya “anak-anak lelaki Israel,” tetapi di sini berfungsi sebagai sebutan kolektif bagi bangsa Israel. “Orang Israel” alami, ringkas, dan tidak mempersempit acuannya hanya kepada laki-laki.
- source_word: רְאוּ
  choice: Lihatlah
  rationale: Bentuk imperatif jamak ini meminta para pendengar memperhatikan pernyataan berikutnya; “Lihatlah” mempertahankan daya serunya tanpa terdengar kuno.
- source_word: קָרָא ... בְּשֵׁם
  choice: telah memanggil ... dengan namanya
  rationale: Terjemahan ini mempertahankan idiom Ibrani yang menyatakan pemanggilan atau penetapan pribadi secara khusus, bukan sekadar pemberian nama.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh,” bukan diganti dengan sebuah gelar.
- source_word: בְּצַלְאֵל
  choice: Bezaleel
  rationale: Bentuk nama ini mengikuti ejaan Indonesia yang lazim dan tetap dekat dengan nama Ibraninya.
- source_word: בֶּן אוּרִי בֶן חוּר
  choice: anak Uri, anak Hur
  rationale: Pengulangan “anak” mempertahankan susunan silsilah Ibrani secara jelas dan alami.
- source_word: לְמַטֵּה יְהוּדָה
  choice: dari suku Yehuda
  rationale: Frasa ini menyatakan afiliasi kesukuan Bezaleel; “dari suku Yehuda” merupakan ungkapan Indonesia yang alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi secara langsung; transliterasi mempertahankan fungsinya sebagai nama perjanjian dan tidak menggantinya dengan gelar.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak lelaki Israel / anak-anak Israel
  rationale: Walaupun bentuknya maskulin dan secara harfiah berarti “anak-anak lelaki Israel,” dalam konteks ini ungkapan tersebut merupakan sebutan etnis kolektif. Catatan kaki mempertahankan informasi bentuk sumber tanpa membuat teks utama memberi kesan bahwa hanya laki-laki yang disapa.
- issue: Makna קָרָא ... בְּשֵׁם
  choice: memanggil ... dengan namanya
  alternative: menetapkan secara khusus / memanggil namanya
  rationale: Idiom ini dapat mencakup pemilihan atau penetapan pribadi. Terjemahan utama mempertahankan ungkapan sumber dan membiarkan nuansa panggilan serta pemilihan tetap hadir.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan akhir “dengan namanya” dipertahankan agar hubungan idiomatis קרא בשם jelas, sekaligus tetap mudah dipahami.
