base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/002.yaml
  text: Work may be done for six days[a], but on the seventh day there shall be for you a holy Sabbath, a complete rest to Yahweh[b]. Whoever does work on it shall surely be put to death.
translation:
  language: id
  text: Enam hari lamanya pekerjaan boleh dilakukan, tetapi hari ketujuh harus menjadi hari kudus bagimu, yaitu Sabat, hari perhentian penuh[a] bagi Yahweh.[b] Siapa pun yang melakukan pekerjaan pada hari itu harus dihukum mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Sabat perhentian penuh.” Ungkapan Ibrani “Sabat, sabat-perhentian” menegaskan penghentian kerja secara menyeluruh.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bagi Yahweh”; dapat juga dipahami “untuk Yahweh” atau “milik Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵּעָשֶׂה מְלָאכָה
  choice: pekerjaan boleh dilakukan
  rationale: Bentuk Nifal mempertahankan ungkapan pasif tanpa menentukan pelaku tertentu. Kata “boleh” menyampaikan daya permisif yang wajar dalam konteks hukum, tanpa mengubahnya menjadi perintah langsung untuk bekerja.
- source_word: קֹדֶשׁ
  choice: hari yang kudus
  rationale: Nomina predikatif קֹדֶשׁ menyatakan bahwa hari ketujuh dikhususkan atau dikuduskan. Penambahan “hari” membuat acuannya jelas dan alami dalam bahasa Indonesia.
- source_word: שַׁבַּת שַׁבָּתוֹן
  choice: Sabat, hari perhentian penuh
  rationale: Rangkaian kata yang berakar sama ini menegaskan penghentian kerja secara menyeluruh. Terjemahan ini mempertahankan istilah “Sabat” sekaligus menjelaskan intensifikasinya.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל dapat menandai peruntukan, pengabdian, atau orientasi. “Bagi Yahweh” alami dalam bahasa Indonesia dan tetap membiarkan nuansa bahwa Sabat itu diperuntukkan atau dikhususkan bagi-Nya.
- source_word: כָּל הָעֹשֶׂה בּוֹ מְלָאכָה
  choice: Siapa pun yang melakukan pekerjaan pada hari itu
  rationale: Ungkapan ini menyatakan kasus hukum yang berlaku umum. “Pada hari itu” memperjelas bahwa pronomina Ibrani mengacu pada hari Sabat.
- source_word: יוּמָת
  choice: harus dihukum mati
  rationale: Bentuk Hofal menyatakan hukuman mati secara pasif dan tegas. “Harus dihukum mati” menyampaikan ketetapan hukum tersebut tanpa menambahkan kata penguat yang tidak terdapat sebagai unsur tersendiri dalam teks Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama perjanjian יהוה. Bentuk “Yahweh” mempertahankannya sebagai nama diri, bukan menggantinya dengan gelar.
- issue: Hubungan Sabat dengan Yahweh dalam לַיהוָה
  choice: bagi Yahweh
  alternative: untuk Yahweh; milik Yahweh
  rationale: Preposisi ל memungkinkan nuansa peruntukan, pengabdian, atau kepemilikan. Teks utama memakai ungkapan Indonesia yang luas, sedangkan catatan kaki mempertahankan alternatif yang sungguh mungkin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan hukum dibuat jelas bagi pembaca umum, sementara bentuk pasif, intensifikasi pada istilah Sabat, ketegasan sanksi, serta keluwesan makna preposisi ל dipertahankan.
