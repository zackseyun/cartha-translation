  text: וַ/יָּבֹ֥אוּ הָ/אֲנָשִׁ֖ים עַל הַ/נָּשִׁ֑ים כֹּ֣ל נְדִ֣יב לֵ֗ב הֵ֠בִיאוּ חָ֣ח וָ/נֶ֜זֶם וְ/טַבַּ֤עַת וְ/כוּמָז֙ כָּל כְּלִ֣י זָהָ֔ב וְ/כָל אִ֕ישׁ אֲשֶׁ֥ר הֵנִ֛יף תְּנוּפַ֥ת זָהָ֖ב לַ/יהוָֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/022.yaml
  text: So the men came with the women[a]. Everyone whose heart was willing brought brooches, earrings, rings, and ornaments—all kinds of gold jewelry[b]. And every man who presented a wave offering of gold to Yahweh did so.
translation:
  language: id
  text: Lalu para laki-laki datang bersama para perempuan.[a] Setiap orang yang dengan rela hati membawa pengait, anting-anting, cincin, dan perhiasan—segala macam benda emas.[b] Setiap laki-laki yang mempersembahkan emas sebagai persembahan unjukan kepada Yahweh pun demikian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, frasa Ibrani ini berbunyi “para laki-laki atas para perempuan.” Penggunaan kata depan ini sukar dipastikan; dalam konteks ini kemungkinan maksudnya ialah para laki-laki datang bersama para perempuan atau datang selain mereka.
    reason: alternative_reading
  - marker: b
    text: Arti tepat beberapa istilah perhiasan ini tidak pasti. “Pengait” dapat berarti bros, jepitan, atau cincin; “anting-anting” juga dapat berarti cincin hidung; dan “perhiasan” mungkin menunjuk pada liontin, gelang lengan, atau jenis perhiasan tertentu lainnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Lalu datanglah
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “lalu” menyatakan urutan secara alami dalam bahasa Indonesia.
- source_word: הָאֲנָשִׁים עַל הַנָּשִׁים
  choice: para laki-laki bersama para perempuan
  rationale: Kata depan עַל dalam ungkapan yang sulit ini paling mungkin menunjukkan bahwa laki-laki datang bersama, atau di samping, para perempuan; catatan kaki mempertahankan ambiguitasnya.
- source_word: כֹּל נְדִיב לֵב
  choice: Setiap orang yang rela hati
  rationale: Ungkapan ini menunjuk pada kesediaan atau kemurahan batin. “Rela hati” mempertahankan gambaran Ibrani tentang hati dengan bahasa Indonesia yang wajar.
- source_word: חָח
  choice: pengait
  rationale: Benda perhiasan ini tidak dapat diidentifikasi dengan pasti; “pengait” dekat dengan arti leksikal dasarnya tanpa memastikan bentuk khusus seperti bros.
- source_word: נֶזֶם
  choice: anting-anting
  rationale: Kata ini dapat menunjuk pada cincin telinga atau cincin hidung. “Anting-anting” merupakan padanan kontekstual yang alami, sedangkan kemungkinan lain dicatat dalam catatan kaki.
- source_word: טַבַּעַת
  choice: cincin
  rationale: Padanan umum “cincin” menghindari perincian yang tidak pasti seperti “cincin meterai”.
- source_word: כוּמָז
  choice: perhiasan
  rationale: Istilah langka ini tidak pasti artinya; padanan umum mencegah ketepatan semu, sementara usulan yang lebih khusus dicatat dalam catatan kaki.
- source_word: כָּל כְּלִי זָהָב
  choice: segala macam benda dari emas
  rationale: כְּלִי berarti benda, barang, perkakas, atau wadah. Terjemahan ini tetap luas seperti sumber dan tidak membatasi semuanya sebagai perhiasan.
- source_word: וְכָל אִישׁ
  choice: Setiap laki-laki
  rationale: אִישׁ secara eksplisit berbentuk maskulin tunggal; terjemahan mempertahankan rujukan gender sumber.
- source_word: הֵנִיף תְּנוּפַת זָהָב
  choice: mempersembahkan emas sebagai persembahan unjukan
  rationale: הֵנִיף secara harfiah berkaitan dengan mengangkat atau mengunjukkan dalam tindakan ritual, dan תְּנוּפָה adalah istilah persembahan khusus. Susunan ini mempertahankan kekhususan ritual tanpa memberi kesan sekadar melambaikan emas.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Bahasa bergender dalam וְכָל אִישׁ
  choice: Setiap laki-laki
  alternative: setiap orang
  rationale: Sumber memakai אִישׁ, “laki-laki,” sehingga bentuk maskulin dipertahankan tanpa meniadakan partisipasi perempuan yang disebut sebelumnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan kalimat dibuat jelas bagi pembaca umum, sementara ungkapan “rela hati” dan istilah ritual “persembahan unjukan” mempertahankan warna bahasa sumber. Semua ketidakpastian leksikal penting dinyatakan dalam catatan kaki.
