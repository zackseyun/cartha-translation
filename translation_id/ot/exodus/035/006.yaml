translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Kata “benang” berlaku eliptis bagi ketiga warna. Tanda koma akhir dipertahankan karena ayat ini merupakan bagian dari daftar yang berlanjut.
