  text: and blue[a], and purple, and scarlet yarn, and fine linen, and goats’ hair,
translation:
  language: id
  text: benang biru, ungu, dan merah menyala, lenan halus, serta bulu kambing,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְכֵלֶת
  choice: benang biru
  rationale: Istilah ini menunjuk pada bahan tekstil berwarna biru atau biru keunguan. Dalam daftar bahan Kemah Suci, “benang biru” menyatakan warna sekaligus bahan secara alami.
- source_word: אַרְגָּמָן
  choice: benang ungu
  rationale: Istilah ini menunjuk pada bahan tekstil yang dicelup ungu. Kata “benang” dipahami bersama dari unsur pertama dalam rangkaian warna.
- source_word: תוֹלַעַת שָׁנִי
  choice: benang merah menyala
  rationale: Ungkapan ini menunjuk pada bahan berwarna merah terang yang pewarnanya berasal dari serangga. Pilihan ini mempertahankan warna khasnya tanpa menerjemahkan unsur etimologis “ulat” secara menyesatkan.
- source_word: שֵׁשׁ
  choice: lenan halus
  rationale: Dalam konteks Kemah Suci, istilah ini lazim menunjuk pada lenan bermutu halus, bukan sekadar kain lenan secara umum.
- source_word: עִזִּים
  choice: bulu kambing
  rationale: Secara harfiah berarti “kambing-kambing”, tetapi dalam daftar bahan ini yang dimaksud ialah bulu kambing untuk ditenun menjadi penutup Kemah Suci.
- source_word: וְ
  choice: dan/serta
  rationale: Konjungsi Ibrani menghubungkan setiap unsur daftar. Bahasa Indonesia memakai “dan” serta “serta” agar rangkaian tetap jelas dan alami.
