  text: וַ/יְמַלֵּ֥א אֹת֖/וֹ ר֣וּחַ אֱלֹהִ֑ים בְּ/חָכְמָ֛ה בִּ/תְבוּנָ֥ה וּ/בְ/דַ֖עַת וּ/בְ/כָל מְלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/031.yaml
  text: and he filled him with the Spirit of God[a], with wisdom, with understanding, and with knowledge[b], and with every kind of craftsmanship.
translation:
  language: id
  text: dan Ia memenuhi dia dengan Roh Allah[a], dengan hikmat, pengertian, dan pengetahuan, serta dalam segala macam pekerjaan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roh Allah” atau “roh ilahi”. Frasa Ibrani ini dapat dipahami secara lebih umum, tetapi dalam konteks ini kemungkinan besar menunjuk kepada Roh Allah yang memberi kemampuan.
    reason: alternative_reading
  - marker: b
    text: Atau “dalam setiap kerajinan” atau “dengan segala pekerjaan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלֵּא
  choice: dan Ia memenuhi
  rationale: Bentuk naratif Piel menyatakan tindakan lampau; subjeknya diteruskan dari konteks sebelumnya, yaitu TUHAN. Kapitalisasi “Ia” mengikuti kelaziman bahasa Indonesia untuk pronomina yang merujuk kepada Allah.
- source_word: אֹתוֹ
  choice: dia
  rationale: Pronomina objek ini merujuk kepada Bezalel dalam ayat sebelumnya.
- source_word: רוּחַ אֱלֹהִים
  choice: Roh Allah
  rationale: Dalam konteks pemberdayaan Bezalel untuk pekerjaan Kemah Suci, frasa ini paling wajar menunjuk kepada Roh Allah, sambil tetap mencatat kemungkinan pemahaman yang lebih umum.
- source_word: בְּחָכְמָה
  choice: dengan hikmat
  rationale: Preposisi ב menyatakan perlengkapan atau pemberian; חָכְמָה mencakup hikmat yang tampak dalam kecakapan bekerja.
- source_word: בִּתְבוּנָה
  choice: pengertian
  rationale: תְּבוּנָה berarti pengertian, pemahaman, atau daya memahami; “pengertian” mempertahankan rangkaian dengan hikmat dan pengetahuan.
- source_word: וּבְדַעַת
  choice: dan pengetahuan
  rationale: דַּעַת pada dasarnya berarti pengetahuan. Pilihan ini tidak mempersempit maknanya menjadi keterampilan teknis saja.
- source_word: וּבְכָל מְלָאכָה
  choice: serta dengan segala macam keahlian
  rationale: Dalam konteks pembuatan Kemah Suci, מְלָאכָה menunjuk pada pekerjaan atau keterampilan kerajinan. “Segala macam keahlian” alami dalam bahasa Indonesia dan menyampaikan כָּל dengan nomina tunggal kolektif.
theological_decisions:
- issue: Apakah רוּחַ אֱלֹהִים menunjuk secara khusus kepada Roh Allah atau secara lebih umum kepada roh/kemampuan ilahi
  choice: Roh Allah
  alternative: roh Allah; roh ilahi
  rationale: Konteks langsung menampilkan Allah sebagai pemberi kemampuan bagi pelayanan suci, sehingga “Roh Allah” merupakan pembacaan yang paling mungkin. Catatan kaki mempertahankan ambiguitas gramatikal dan leksikal frasa Ibrani.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Struktur daftar Ibrani dipertahankan tanpa membuat kalimat terasa kaku; “keahlian” dipilih sesuai konteks karya kerajinan Kemah Suci.
