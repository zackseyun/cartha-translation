  yaml_path: translation/ot/exodus/035/034.yaml
  text: And he has put in his heart the ability to teach[a], both he and Oholiab son of Ahisamach, of the tribe of Dan.
translation:
  language: id
  text: Ia telah menaruh dalam hati Bezaleel dan Aholiab anak Ahisamakh, dari suku Dan, kemampuan untuk mengajar[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memberi petunjuk.” Kata Ibrani ini dapat mencakup pengajaran secara luas, termasuk membimbing orang lain dalam pekerjaan terampil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהוֹרֹת
  choice: kemampuan untuk mengajar
  rationale: Infinitif Hifil dari ירה berarti “mengajar” atau “memberi petunjuk.” Penambahan “kemampuan” menyatakan secara alami bahwa Allah mengaruniakan kecakapan untuk membimbing orang lain dalam pekerjaan terampil.
- source_word: נָתַן בְּלִבּוֹ
  choice: menaruh dalam hati mereka
  rationale: Ungkapan Ibrani ini menunjuk pada pemberian batiniah berupa kecakapan atau dorongan. “Dalam hati” mempertahankan gambaran antropologis Ibrani, sedangkan bentuk jamak diperjelas oleh kelanjutan yang menyebut kedua orang itu.
- source_word: הוּא וְאָהֳלִיאָב
  choice: baik dalam hati Bezaleel maupun dalam hati Aholiab
  rationale: Kata ganti הוּא merujuk kepada Bezaleel dari konteks sebelumnya. Nama tersebut diulangi agar rujukannya jelas dalam bahasa Indonesia, sambil mempertahankan bahwa karunia itu diberikan kepada keduanya.
- source_word: בֶּן אֲחִיסָמָךְ
  choice: anak Ahisamakh
  rationale: Terjemahan langsung bagi penanda hubungan keturunan; bentuk tanpa “dari” alami dalam silsilah atau identifikasi bahasa Indonesia.
- source_word: לְמַטֵּה דָן
  choice: dari suku Dan
  rationale: Preposisi לְ di sini menandai keanggotaan atau afiliasi suku; “dari suku Dan” merupakan ungkapan Indonesia yang alami dan tepat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama-nama mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia. Pengulangan “dalam hati” memperjelas bahwa objek tunggal gramatikal pada ungkapan Ibrani berlaku bagi Bezaleel dan Aholiab tanpa menghasilkan konstruksi Indonesia yang janggal.
