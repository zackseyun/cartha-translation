translation:
  language: id
  text: dalam memotong batu untuk dipasang, dan dalam mengukir kayu, untuk melakukan segala macam pekerjaan yang dirancang dengan terampil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “segala macam pekerjaan yang terencana” atau “segala macam karya seni.” Istilah Ibrani ini mengandung gagasan tentang pekerjaan yang dilakukan dengan perencanaan, rancangan, atau keterampilan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֲרֹשֶׁת
  choice: dalam mengasah / dalam mengukir
  rationale: 'Nomina חֲרֹשֶׁת menunjuk pada pengerjaan bahan secara terampil. Padanan disesuaikan dengan bahannya: batu diasah, sedangkan kayu diukir.'
- source_word: אֶבֶן
  choice: batu
  rationale: Bentuk tunggal Ibrani berfungsi sebagai nama bahan secara umum; bahasa Indonesia secara alami memakai 'batu' tanpa penanda jamak.
- source_word: לְמַלֹּאת
  choice: untuk ditatahkan
  rationale: Dalam konteks perlengkapan Kemah Suci, bentuk ini menunjuk pada pemasangan batu ke dalam tatahan atau dudukannya, bukan sekadar 'mengisi'.
- source_word: עֵץ
  choice: kayu
  rationale: Kata ini menunjuk pada kayu sebagai bahan kerajinan, bukan pohon yang hidup.
- source_word: לַעֲשׂוֹת
  choice: untuk membuat
  rationale: Dengan objek berupa karya kerajinan, 'membuat' lebih alami dalam bahasa Indonesia daripada 'melakukan'.
- source_word: בְּכָל מְלֶאכֶת
  choice: segala macam karya
  rationale: Ungkapan ini mencakup seluruh ragam pekerjaan pertukangan; 'segala macam karya' menyampaikan cakupan distributifnya secara alami.
- source_word: מַחֲשָׁבֶת
  choice: yang dirancang dengan terampil
  rationale: Kata ini mengandung gagasan tentang karya yang dipikirkan, dirancang, dan dikerjakan dengan kecakapan; terjemahan ini mempertahankan unsur perencanaan sekaligus keterampilan.
