  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה אֶל כָּל עֲדַ֥ת בְּנֵֽי יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/004.yaml
  text: Then Moses said to all the congregation of the sons of Israel[a], “This is the thing that Yahweh has commanded[c][b], saying,”
translation:
  language: id
  text: Lalu Musa berkata kepada seluruh umat bani Israel[a], “Inilah yang diperintahkan Yahweh[b]:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seluruh jemaat orang Israel” atau “seluruh perhimpunan bani Israel.”
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “Inilah perkataan [atau hal] yang diperintahkan Yahweh untuk disampaikan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “Lalu” menyampaikan urutan peristiwa secara alami dalam bahasa Indonesia.
- source_word: עֲדַת
  choice: umat
  rationale: Kata ini menunjuk kepada komunitas Israel secara kolektif, khususnya sebagai kelompok yang dihimpunkan. “Umat” alami dan bermartabat dalam konteks ini; “jemaat” atau “perhimpunan” juga mungkin.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: Ungkapan ini secara harfiah berarti keturunan atau anak-anak lelaki Israel. “Bani Israel” mempertahankan bentuk kolektif tradisional dan kedekatan dengan ungkapan Ibrani tanpa menimbulkan kesan bahwa yang dimaksud hanya putra-putra langsung Yakub.
- source_word: זֶה הַדָּבָר
  choice: Inilah yang
  rationale: דָּבָר dapat berarti “perkataan”, “hal”, atau “perkara”. Dalam rumus pengantar perintah ini, “Inilah yang” merupakan padanan Indonesia yang alami serta tidak mempersempit maknanya secara tidak perlu.
- source_word: צִוָּה
  choice: diperintahkan
  rationale: Bentuk perfektif menyatakan tindakan memerintah yang telah dilakukan dan kini disampaikan kepada umat. Bentuk pasif Indonesia menghasilkan susunan yang alami dalam frasa ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: לֵאמֹר
  choice: berkata / tanda titik dua
  rationale: לֵאמֹר pertama terwakili secara idiomatis oleh konstruksi “berkata ...”, sedangkan kemunculan terakhir memperkenalkan isi perintah berikutnya dan secara alami dinyatakan dengan tanda titik dua.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks sumber memakai nama perjanjian YHWH secara langsung; “Yahweh” mempertahankannya sebagai nama diri.
- issue: Ungkapan kolektif maskulin בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: orang Israel; anak-anak Israel; putra-putra Israel
  rationale: “Bani Israel” mempertahankan hubungan genealogis dan bentuk tradisional ungkapan sumber. “Putra-putra Israel” terlalu mudah dipahami sebagai putra-putra langsung Yakub atau sebagai pembatasan kepada laki-laki saja, sedangkan konteks menyapa seluruh komunitas.
- issue: Cakupan makna זֶה הַדָּבָר
  choice: Inilah yang
  alternative: Inilah firman; Inilah hal
  rationale: דָּבָר memiliki rentang makna “perkataan/hal/perkara”. Padanan idiomatis ini mempertahankan keterbukaan makna sambil memperkenalkan perintah dalam ayat berikutnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami untuk pembacaan publik. Tanda titik dua mewakili fungsi לֵאמֹר terakhir sebagai pengantar langsung kepada isi perintah pada ayat berikutnya.
