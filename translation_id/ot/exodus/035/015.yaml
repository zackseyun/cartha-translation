base_translation:
  language: en
  yaml_path: translation/ot/exodus/035/015.yaml
  text: the altar of incense and its poles[a], and the anointing oil, and the fragrant incense, and the screen for the entrance to the tabernacle[c][b];
translation:
  language: id
  text: mezbah pembakaran dupa[a] beserta batang-batang pengusungnya, minyak urapan, dupa dari rempah-rempah harum[b], dan tirai untuk pintu masuk Kemah Suci[c];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “mezbah dupa.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “dupa rempah-rempah” atau “dupa berempah.”
    reason: lexical_alternative
  - marker: c
    text: Atau “tirai pada pintu masuk Kemah Suci.”
    reason: syntactic_alternative
lexical_decisions:
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: mezbah pembakaran dupa
  rationale: Frasa konstruksi ini menunjuk pada mezbah yang digunakan untuk membakar dupa. Pilihan ini jelas bagi pembaca modern dan mempertahankan fungsi khusus benda tersebut.
- source_word: בַּדָּיו
  choice: batang-batang pengusungnya
  rationale: Dalam konteks perabot Kemah Suci, kata ini menunjuk pada batang yang dipakai untuk mengusung benda suci; bentuk jamak Ibrani dipertahankan.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: minyak urapan
  rationale: Ungkapan baku dan alami dalam bahasa Indonesia untuk minyak yang digunakan dalam tindakan ritual pengurapan.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: dupa dari rempah-rempah harum
  rationale: הַסַּמִּים menunjuk pada bahan-bahan aromatik atau rempah wangi. Terjemahan ini mempertahankan hubungan konstruksi tanpa sekadar mengubahnya menjadi sifat umum 'harum'.
- source_word: מָסַךְ הַפֶּתַח
  choice: tirai untuk pintu masuk
  rationale: מָסָךְ di sini adalah kain gantung atau penyekat pada jalan masuk. 'Tirai' merupakan istilah Indonesia yang alami, sedangkan 'untuk' menyampaikan fungsi yang ditandai oleh לְ pada frasa berikutnya.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: Istilah ini secara konsisten dan mudah dipahami menunjuk pada bangunan kudus portabel dalam kitab Keluaran, bukan sekadar tempat tinggal biasa.
