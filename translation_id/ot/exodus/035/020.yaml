  text: Kemudian seluruh umat Israel keluar dari hadapan Musa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: Kemudian ... pergi
  rationale: Bentuk wayyiqtol dari יצא melanjutkan urutan cerita. “Kemudian” menyatakan urutan naratif, sedangkan “pergi” secara alami menyampaikan tindakan meninggalkan tempat itu.
- source_word: כָּל עֲדַת
  choice: seluruh umat
  rationale: כָּל menegaskan keseluruhan kelompok, dan עֵדָה menunjuk pada komunitas Israel sebagai satu kesatuan. “Seluruh umat” alami dan bermartabat dalam bahasa Indonesia modern.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Ungkapan Ibrani secara harfiah berarti “anak-anak lelaki Israel,” tetapi dalam konteks ini menunjuk pada komunitas yang berasal dari Israel/Yakub secara keseluruhan. “Keturunan Israel” mempertahankan hubungan genealogis tanpa memberi kesan bahwa hanya laki-laki yang dimaksud.
- source_word: מִלִּפְנֵי
  choice: dari hadapan
  rationale: Ungkapan ini secara harfiah bersifat spasial, “dari hadapan,” yakni meninggalkan tempat di depan atau hadirat seseorang. Bentuk tersebut tetap jelas dan wajar dalam ragam Alkitabiah Indonesia.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
