  source_fidelity: 'Terjemahan pada dasarnya setia pada teks Ibrani: imperatif menulis, tujuan sebagai זִכָּרוֹן, kitab tertentu, penegasan מָחֹה אֶמְחֶה, serta cakupan idiomatis ''dari kolong langit'' tersampaikan. Namun, ''sampaikanlah kepada Yosua'' tidak secara cukup jelas mempertahankan unsur membuat Yosua mendengar dalam idiom וְשִׂים בְּאָזְנֵי יְהוֹשֻׁעַ.'
