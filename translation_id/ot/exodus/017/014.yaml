source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה כְּתֹ֨ב זֹ֤את זִכָּרוֹן֙ בַּ/סֵּ֔פֶר וְ/שִׂ֖ים בְּ/אָזְנֵ֣י יְהוֹשֻׁ֑עַ כִּֽי מָחֹ֤ה אֶמְחֶה֙ אֶת זֵ֣כֶר עֲמָלֵ֔ק מִ/תַּ֖חַת הַ/שָּׁמָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/014.yaml
  text: Then Yahweh said to Moses[a], “Write this as a memorial in the book, and put it in Joshua’s hearing[c][b], for I will surely blot out the remembrance of Amalek from under heaven.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa, “Tuliskanlah hal ini sebagai peringatan dalam kitab[a], dan perdengarkanlah kepada Yosua[b], sebab Aku pasti akan menghapuskan[c] ingatan tentang Amalek dari kolong langit.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “dalam sebuah kitab” atau “dalam gulungan.” Bahasa Ibrani memakai kata sandang tertentu: “dalam kitab.”'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “taruhlah di telinga Yosua,” yaitu buatlah Yosua mendengarnya atau bacakanlah kepadanya.
    reason: lexical_alternative
  - marker: c
    text: Bentuk bahasa Ibrani memberi penekanan kuat pada kepastian tindakan ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar, sesuai bentuk nama pribadi dalam teks Ibrani.
- source_word: כְּתֹב זֹאת זִכָּרוֹן
  choice: Tuliskanlah hal ini sebagai peringatan
  rationale: Bentuk imperatif diterjemahkan langsung, sedangkan זִכָּרוֹן menyatakan tujuan tulisan itu sebagai pengingat atau peringatan.
- source_word: בַּסֵּפֶר
  choice: dalam kitab
  rationale: Mempertahankan artikel tertentu pada bahasa Ibrani secara wajar dalam bahasa Indonesia; 'gulungan' mungkin secara material, tetapi lebih interpretatif.
- source_word: וְשִׂים בְּאָזְנֵי יְהוֹשֻׁעַ
  choice: dan sampaikanlah kepada Yosua
  rationale: Ungkapan harfiah 'taruhlah di telinga Yosua' adalah idiom kausatif untuk membuat Yosua mendengar; 'sampaikanlah' alami dan tidak menambahkan cara penyampaian yang tidak dinyatakan.
- source_word: מָחֹה אֶמְחֶה
  choice: Aku pasti akan menghapuskan
  rationale: Infinitif absolut yang diikuti verba finit memberi penegasan; 'pasti' menyampaikan kepastian dan tekanan bentuk Ibrani.
- source_word: זֵכֶר עֲמָלֵק
  choice: ingatan tentang Amalek
  rationale: זֵכֶר berarti ingatan atau kenangan. Pilihan ini mempertahankan kontras dengan hal yang ditulis sebagai peringatan tanpa menafsirkannya semata-mata sebagai nama.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: dari kolong langit
  rationale: Ungkapan Indonesia yang wajar dan bermartabat untuk idiom Ibrani 'dari bawah langit', dengan cakupan penghapusan yang menyeluruh.
theological_decisions:
- issue: Penerjemahan nama ilahi
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memuat Tetragramaton sebagai nama ilahi; transliterasi 'Yahweh' mempertahankan nama pribadi itu tanpa menggantinya dengan gelar.
- issue: Objek penghapusan ilahi
  choice: ingatan tentang Amalek
  alternative: nama Amalek atau bangsa Amalek
  rationale: Terjemahan mengikuti זֵכֶר secara leksikal dan tidak mempersempit atau memperluas pernyataan menjadi nama saja ataupun secara eksplisit seluruh bangsanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. 'Berfirman' dipakai secara idiomatis untuk tuturan Allah; 'kitab' dan 'kolong langit' mempertahankan corak Alkitabiah tanpa menjadi sukar dipahami. Penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
