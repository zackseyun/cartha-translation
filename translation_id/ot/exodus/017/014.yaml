  to: Lalu Yahweh berfirman kepada Musa, “Tuliskanlah hal ini sebagai peringatan dalam kitab[a], dan perdengarkanlah kepada Yosua[b], sebab Aku pasti akan menghapuskan[c] ingatan tentang Amalek dari kolong langit.”
