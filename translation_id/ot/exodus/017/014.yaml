  terminology: Nama ilahi 'Yahweh', 'Musa', dan 'Yosua' konsisten dan tepat. 'Peringatan' dan 'ingatan' secara memadai mempertahankan perbedaan antara זִכָּרוֹן dan זֵכֶר. Catatan kaki a perlu diperbaiki karena artikel tertentu Ibrani tidak sama dengan demonstratif eksplisit Indonesia 'itu'.
