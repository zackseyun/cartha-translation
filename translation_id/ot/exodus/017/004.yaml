  yaml_path: translation/ot/exodus/017/004.yaml
  text: So Moses cried out to Yahweh[a], saying, “What shall I do with this people? A little more, and they will stone me!”
translation:
  language: id
  text: Musa lalu berseru kepada Yahweh, “Apa yang harus kulakukan terhadap bangsa ini? Tinggal sedikit lagi[a], mereka akan melempari aku dengan batu!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Masih sedikit, lalu mereka akan melempari aku dengan batu,” yang menyatakan bahwa ancaman itu sudah dekat.'
    reason: Ungkapan Ibrani עוֹד מְעַט menyatakan imminensi; catatan ini menjelaskan susunan harfiah tanpa mengubah arti teks utama.
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: berseru
  rationale: Kata צעק menyatakan seruan kuat karena kesesakan atau untuk meminta pertolongan; “berseru” mempertahankan urgensi permohonan Musa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap terlihat.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Bentuk ini memperkenalkan perkataan langsung. “Katanya” wajar dalam narasi Indonesia dan tidak membebani kalimat.
- source_word: מָה אֶעֱשֶׂה לָעָם הַזֶּה
  choice: Apa yang harus kulakukan terhadap bangsa ini?
  rationale: Pertanyaan ini mengungkapkan kebingungan mendesak Musa mengenai cara menghadapi bangsa itu. “Terhadap” cukup luas untuk mempertahankan hubungan yang dinyatakan oleh preposisi ל tanpa menentukan tindakan tertentu.
- source_word: עֹוד מְעַט
  choice: Tinggal sedikit lagi
  rationale: Ungkapan yang secara harfiah berarti “masih sedikit” menunjukkan bahwa ancaman itu sudah sangat dekat. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan kesan mendesak.
- source_word: וּסְקָלֻנִי
  choice: mereka akan merajam aku
  rationale: Kata סקל berarti menyerang atau membunuh dengan batu. Bentuk ini, setelah עֹוד מְעַט, menyatakan akibat yang segera akan terjadi; “akan merajam aku” menyampaikan daya futur yang dekat itu.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian sebagai nama, bukan menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. “Berseru” menjaga nada kesesakan, sedangkan “merajam” merupakan istilah umum dan tepat untuk tindakan melempari seseorang dengan batu. Penanda catatan kaki ditempatkan pada ungkapan yang dijelaskannya.
