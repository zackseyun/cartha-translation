  text: Yosua mengalahkan Amalek dan rakyatnya dengan pedang[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Alternatif yang lebih formal: “dengan mata pedang.” Secara harfiah, teks Ibrani berbunyi “menurut mulut pedang,” sebuah ungkapan untuk kekalahan dalam pertempuran bersenjata.'
