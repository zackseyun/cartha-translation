lexical_decisions:
- source_word: וַיַּחֲלֹשׁ
  choice: menundukkan
  rationale: Dalam konteks pertempuran, verba חלש menyatakan bahwa Yosua mengatasi atau melemahkan lawan hingga tidak berdaya. “Menundukkan” menyampaikan kemenangan militer tanpa menyiratkan pemusnahan total.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam Alkitab bahasa Indonesia.
- source_word: עֲמָלֵק
  choice: Amalek
  rationale: Nama diri dipertahankan; dalam konteks ini nama tersebut juga mewakili pihak atau pasukan Amalek.
- source_word: עַמּוֹ
  choice: rakyatnya
  rationale: Menerjemahkan עַם secara langsung sebagai kelompok orang yang berada di bawah Amalek. Dalam konteks pertempuran, yang dimaksud kemungkinan besar ialah para pejuangnya, tetapi teks Ibrani tidak memakai istilah khusus untuk tentara.
- source_word: לְפִי חָרֶב
  choice: dengan pedang
  rationale: Ungkapan Ibrani harfiah “menurut mulut pedang” merupakan idiom untuk kekalahan atau kematian melalui pertempuran bersenjata. “Dengan pedang” menyampaikan maknanya secara wajar dalam bahasa Indonesia modern.
