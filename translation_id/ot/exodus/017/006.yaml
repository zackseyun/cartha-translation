  text: הִנְ/נִ֣י עֹמֵד֩ לְ/פָנֶ֨י/ךָ שָּׁ֥ם עַֽל הַ/צּוּר֮ בְּ/חֹרֵב֒ וְ/הִכִּ֣יתָ בַ/צּ֗וּר וְ/יָצְא֥וּ מִמֶּ֛/נּוּ מַ֖יִם וְ/שָׁתָ֣ה הָ/עָ֑ם וַ/יַּ֤עַשׂ כֵּן֙ מֹשֶׁ֔ה לְ/עֵינֵ֖י זִקְנֵ֥י יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/006.yaml
  text: Behold[a], I will stand before you there on the rock at Horeb, and you shall strike the rock, and water will come out from it, and the people will drink. And Moses did so in the sight of the elders of Israel.
translation:
  language: id
  text: Sesungguhnya, Aku akan berdiri di hadapanmu di sana, di atas batu cadas di Horeb[a]. Pukullah batu cadas itu, maka air akan keluar darinya dan umat itu akan minum. Musa pun melakukannya di depan mata para tua-tua Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sesungguhnya, Aku sedang berdiri di hadapanmu di sana, di atas batu cadas di Horeb.” Partisipel Ibrani dapat diterjemahkan sebagai tindakan yang sedang berlangsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: Sesungguhnya, Aku
  rationale: Ungkapan presentatif ilahi ini mengarahkan perhatian secara khidmat. Dalam bahasa Indonesia, “Sesungguhnya, Aku” mempertahankan bobot pernyataannya secara alami; nuansa harfiah “Lihatlah, Aku” kurang idiomatis dalam konteks ini.
- source_word: עֹמֵד
  choice: akan berdiri
  rationale: Partisipel Ibrani secara bentuk dapat berarti “sedang berdiri”, tetapi dalam rangkaian petunjuk ini wajar dipahami sebagai tindakan ilahi yang segera akan terjadi. Alternatif presentis dipertahankan dalam catatan kaki.
- source_word: לְפָנֶיךָ
  choice: di hadapanmu
  rationale: Padanan baku dan bermartabat yang menyatakan posisi Allah di depan Musa tanpa menambahkan penafsiran lain.
- source_word: הַצּוּר
  choice: gunung batu
  rationale: צוּר menunjuk pada batu besar atau massa batu, bukan sekadar sebuah batu kecil. “Gunung batu” membedakannya dari אֶבֶן dan cocok dengan gambaran lokasi di Horeb.
- source_word: בְּחֹרֵב
  choice: di Horeb
  rationale: Preposisi בְּ dengan nama tempat secara alami diterjemahkan “di” dalam bahasa Indonesia.
- source_word: וְהִכִּיתָ
  choice: Pukullah
  rationale: Bentuk ini berfungsi sebagai perintah dalam konteks petunjuk. “Pukullah” lugas dan mempertahankan daya tindakan verba נכה.
- source_word: וְיָצְאוּ מִמֶּנּוּ מַיִם
  choice: maka air akan keluar darinya
  rationale: Terjemahan ini mempertahankan verba umum “keluar” tanpa menambahkan gambaran “mengalir” yang tidak dinyatakan secara eksplisit.
- source_word: וְשָׁתָה הָעָם
  choice: dan umat itu akan minum
  rationale: Klausa hasil sederhana mempertahankan urutan tindakan dalam teks. “Umat” sesuai bagi komunitas Israel dalam konteks ini, sementara “itu” mencerminkan artikel tertentu.
- source_word: וַיַּעַשׂ כֵּן
  choice: Musa pun melakukannya
  rationale: “Pun” secara alami menandai pelaksanaan petunjuk yang baru diberikan, sedangkan “melakukannya” merupakan padanan idiomatis untuk formula “berbuat demikian”.
- source_word: לְעֵינֵי
  choice: di depan mata
  rationale: Padanan ini mempertahankan citra “mata” dan menekankan bahwa tindakan Musa disaksikan secara terbuka oleh para tua-tua.
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: para tua-tua Israel
  rationale: Istilah ini menunjuk pada para pemimpin senior Israel. “Tua-tua” merupakan istilah Indonesia yang lazim dalam register Alkitab dan tidak memasukkan struktur jabatan yang lebih spesifik daripada teks.
theological_decisions:
- issue: Aspek partisipel dalam penyataan tindakan ilahi
  choice: Aku akan berdiri
  alternative: Aku sedang berdiri
  rationale: Konteks petunjuk mendukung makna tindakan yang segera akan berlangsung, tetapi bentuk partisipelnya tetap memungkinkan pembacaan kini. Ambiguitas itu dinyatakan dalam catatan kaki, bukan dihapus.
- issue: Hubungan frasa tempat dengan tindakan Allah
  choice: Allah berdiri di hadapan Musa, di atas gunung batu di Horeb
  alternative: Allah berdiri di hadapan Musa di sana, dekat gunung batu di Horeb
  rationale: Susunan Ibrani paling alami mengaitkan “di atas gunung batu di Horeb” dengan עֹמֵד, yaitu posisi Allah ketika berdiri. Terjemahan mempertahankan gambaran yang mencolok ini tanpa menjelaskannya secara spekulatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan ilahi memakai “Aku” dan akhiran “-mu”. Struktur kalimat dibuat alami bagi pembaca umum sambil mempertahankan pengulangan “gunung batu”, urutan tindakan, citra posisi Allah di atas batu, serta kesaksian publik para tua-tua.
