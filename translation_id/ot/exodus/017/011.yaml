  yaml_path: translation/ot/exodus/017/011.yaml
  text: And whenever Moses raised his hand[a], Israel prevailed; and whenever he let down his hand[b], Amalek prevailed.
translation:
  language: id
  text: Setiap kali Musa mengangkat tangannya[a], Israel lebih unggul; dan setiap kali ia menurunkan tangannya[b], Amalek lebih unggul.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ketika Musa mengangkat tangannya ... ketika ia menurunkan tangannya.” Susunan bahasa Ibrani dapat diterjemahkan lebih harfiah dengan “ketika”, tetapi konteksnya menunjukkan tindakan yang berulang selama pertempuran; karena itu digunakan “setiap kali”.
    reason: lexical_alternative
  - marker: b
    text: Kata yang diterjemahkan “menurunkan” juga dapat berarti “mengistirahatkan” atau “meletakkan”. Kontrasnya dengan “mengangkat tangannya” mendukung arti “menurunkan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כַאֲשֶׁר
  choice: Setiap kali
  rationale: Gabungan ini dalam konteks pertempuran menyatakan keadaan yang berulang, bukan satu kejadian saja. 'Setiap kali' menyampaikan daya iteratifnya secara alami dalam bahasa Indonesia.
- source_word: יָרִים
  choice: mengangkat
  rationale: Bentuk Hifil dari רום berarti membuat naik atau mengangkat; pilihan ini alami dan tidak menambahkan gagasan bahwa tangan terus ditahan di atas.
- source_word: יָדוֹ
  choice: tangannya
  rationale: Teks Ibrani secara khusus menyebut 'tangan', bukan 'lengan'.
- source_word: וְגָבַר
  choice: lebih unggul
  rationale: Dalam konteks pertempuran, גבר menunjukkan bahwa satu pihak menjadi lebih kuat atau menguasai keadaan. 'Lebih unggul' mempertahankan sifat komparatif dan tidak menyiratkan kemenangan akhir.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Bentuk baku nama bangsa tersebut dalam bahasa Indonesia.
- source_word: וְכַאֲשֶׁר
  choice: dan setiap kali
  rationale: Ungkapan ini kembali menandai kejadian berulang, sedangkan 'dan' mempertahankan koordinasi serta kontras antarklausa.
- source_word: יָנִיחַ
  choice: menurunkan
  rationale: Bentuk Hifil dari נוח dapat berarti membuat beristirahat atau membiarkan turun. Kontras langsung dengan 'mengangkat' mendukung arti kontekstual 'menurunkan'.
- source_word: עֲמָלֵק
  choice: Amalek
  rationale: Bentuk baku nama bangsa tersebut dalam bahasa Indonesia.
