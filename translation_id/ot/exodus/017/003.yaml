base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/003.yaml
  text: And there the people thirsted for water, and the people grumbled against Moses and said, “Why is this—that you brought us up from Egypt to kill me and my children and my livestock with thirst?”
translation:
  language: id
  text: Di sana bangsa itu haus akan air. Mereka bersungut-sungut kepada Musa dan berkata, “Untuk apa engkau membawa kami keluar dari Mesir? Apakah untuk membuat aku, anak-anakku, dan ternakku mati kehausan?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְמָא ... הָעָם לַמַּיִם
  choice: bangsa itu kehausan karena tidak ada air
  rationale: Ungkapan Ibrani secara harfiah menyatakan bahwa bangsa itu haus akan air; bentuk Indonesia ini menyampaikan keadaan dan penyebabnya secara alami tanpa mengubah maksud.
- source_word: וַיָּלֶן
  choice: bersungut-sungut
  rationale: Kata kerja ini menyatakan keluhan atau gerutuan menentang seseorang; 'bersungut-sungut kepada' sesuai dengan konteks pemberontakan verbal terhadap Musa.
- source_word: לָמָּה זֶּה הֶעֱלִיתָנוּ
  choice: Untuk apa engkau membawa kami keluar
  rationale: לָמָּה זֶּה dapat bernuansa pertanyaan tentang maksud tindakan, bukan sekadar permintaan sebab. 'Untuk apa' mempertahankan tuduhan retoris itu, sedangkan הֶעֱלִיתָנוּ diterjemahkan alami sebagai 'membawa kami keluar' dari Mesir.
- source_word: לְהָמִית אֹתִי
  choice: Apakah untuk membunuh aku
  rationale: Infinitif tujuan mengikuti pertanyaan retoris. Kata ganti tunggal 'aku' dipertahankan meskipun pembicara sebelumnya kolektif, sehingga peralihan bilangan dalam teks sumber tidak diratakan.
- source_word: מִקְנַי
  choice: ternakku
  rationale: Istilah ini menunjuk hewan peliharaan milik yang menjadi kekayaan atau kawanan; 'ternak' merupakan padanan Indonesia yang ringkas dan wajar.
- source_word: בַּצָּמָא
  choice: dengan kehausan
  rationale: Padanan ini mempertahankan gambaran kematian akibat dahaga yang dinyatakan secara instrumental dalam bahasa Ibrani.
theological_decisions:
- issue: Peralihan dari bentuk jamak 'kami' ke bentuk tunggal 'aku/anakku/ternakku'
  choice: Dipertahankan apa adanya
  alternative: Menyeragamkannya menjadi 'kami, anak-anak kami, dan ternak kami'
  rationale: Teks Masoret memiliki peralihan bilangan yang nyata, kemungkinan suara kolektif yang diucapkan sebagai individu representatif. Menyeragamkan bentuknya akan menghilangkan ketegangan tekstual yang asli.
- issue: Nuansa pertanyaan לָמָּה זֶּה
  choice: 'Diterjemahkan sebagai pertanyaan tujuan: ''Untuk apa ...? Apakah untuk ...?'''
  alternative: '''Mengapa engkau membawa kami keluar ... untuk membunuh ...?'''
  rationale: Susunan ini mempertahankan daya tuduhan retoris dan hubungan antara tindakan membawa keluar dengan tujuan yang dituduhkan, tanpa menyatakan bahwa Musa benar-benar bermaksud membunuh mereka.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Pengulangan subjek Ibrani diringankan dengan pronomina agar alami, sedangkan peralihan penting dari 'kami' ke 'aku' tetap dipertahankan.
