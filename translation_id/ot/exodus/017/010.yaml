  yaml_path: translation/ot/exodus/017/010.yaml
  text: So Joshua did as Moses had told him[a], to fight against Amalek; and Moses, Aaron, and Hur went up to the top of the hill.
translation:
  language: id
  text: Yosua melakukan seperti yang dikatakan Musa kepadanya, untuk berperang melawan Amalek[a]. Musa, Harun, dan Hur naik ke puncak bukit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “Amalek”; nama ini di sini dapat merujuk kepada bangsa keturunan Amalek, yaitu orang Amalek.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: pun melakukan
  rationale: Kata kerja עשה menyatakan bahwa Yosua melaksanakan arahan Musa; partikel 'pun' secara wajar melanjutkan alur narasi.
- source_word: כַּאֲשֶׁר אָמַר לוֹ מֹשֶׁה
  choice: seperti yang diperintahkan Musa kepadanya
  rationale: Secara harfiah berarti 'seperti yang Musa katakan kepadanya', tetapi konteks ayat sebelumnya menunjukkan bahwa perkataan itu berupa perintah; pilihan ini menyampaikan fungsi ujarannya secara alami.
- source_word: לְהִלָּחֵם בַּעֲמָלֵק
  choice: ia berperang melawan Amalek
  rationale: Infinitif Niphal לחם berarti berperang atau bertempur. Preposisi ב dalam konstruksi ini menandai pihak lawan. Subjek 'ia' diperjelas dalam bahasa Indonesia agar hubungan sintaksis alami.
- source_word: עָלוּ
  choice: naik
  rationale: עלה menyatakan gerakan menuju tempat yang lebih tinggi; 'naik' ringkas dan alami.
- source_word: רֹאשׁ הַגִּבְעָה
  choice: puncak bukit
  rationale: Ungkapan harfiah 'kepala bukit' merupakan idiom untuk bagian tertinggi bukit; 'puncak bukit' adalah padanan Indonesia yang alami.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam Alkitab bahasa Indonesia.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Mengikuti bentuk nama yang baku dalam bahasa Indonesia.
- source_word: אַהֲרֹן
  choice: Harun
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam Alkitab bahasa Indonesia.
- source_word: חוּר
  choice: Hur
  rationale: Transliterasi nama Ibrani yang lazim dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibagi secara ringan agar jelas bahwa Yosua melaksanakan perintah dengan berperang, sedangkan Musa, Harun, dan Hur naik ke bukit. 'Sementara itu' menyatakan tindakan paralel tanpa menambahkan hubungan teologis.
