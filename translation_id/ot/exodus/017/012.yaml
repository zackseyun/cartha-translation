base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/012.yaml
  text: But Moses’ hands were heavy[a], so they took a stone and put it under him, and he sat on it. And Aaron and Hur supported his hands, one on this side and one on that side, so his hands remained steady until the sun set.
translation:
  language: id
  text: Namun, tangan Musa menjadi berat. Karena itu, mereka mengambil sebuah batu dan menaruhnya di bawah Musa, lalu ia duduk di atasnya. Harun dan Hur menopang kedua tangannya, yang seorang di sisi ini dan yang seorang lagi di sisi itu. Dengan demikian, tangannya tetap teguh[a] sampai matahari terbenam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tetap stabil” atau “tetap kokoh”. Kata benda Ibrani yang digunakan juga dapat berarti “kesetiaan”, tetapi di sini menggambarkan keteguhan tangan Musa secara fisik.
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידֵי מֹשֶׁה כְּבֵדִים
  choice: tangan Musa menjadi berat
  rationale: Mempertahankan ungkapan konkret bahasa Ibrani; dalam konteks, 'berat' menyiratkan kelelahan. 'Menjadi' menyampaikan perkembangan keadaan secara wajar dalam narasi Indonesia.
- source_word: וַיִּקְחוּ
  choice: mereka mengambil
  rationale: Bentuk verba orang ketiga jamak memiliki subjek yang tidak disebutkan secara eksplisit; terjemahan tidak mengidentifikasinya lebih jauh.
- source_word: אֶבֶן
  choice: sebuah batu
  rationale: Padanan umum dan tepat bagi אֶבֶן, yang di sini dipakai sebagai tempat duduk.
- source_word: תַחְתָּיו
  choice: di bawah Musa
  rationale: Nama Musa diulang agar rujukan pronominal jelas dan alami dalam bahasa Indonesia.
- source_word: וַיֵּשֶׁב עָלֶיהָ
  choice: lalu ia duduk di atasnya
  rationale: Menyampaikan urutan naratif dan rujukan kepada batu secara alami.
- source_word: תָּמְכוּ בְיָדָיו
  choice: menopang kedua tangannya
  rationale: תָּמְכוּ menyatakan tindakan menyangga atau menopang; 'kedua' diperjelas oleh susunan satu orang pada masing-masing sisi.
- source_word: מִזֶּה אֶחָד וּמִזֶּה אֶחָד
  choice: yang seorang di sisi ini dan yang seorang lagi di sisi itu
  rationale: 'Mempertahankan pembagian distributif: satu orang pada setiap sisi.'
- source_word: וַיְהִי יָדָיו אֱמוּנָה
  choice: tangannya tetap teguh
  rationale: Dalam konteks bantuan fisik, אֱמוּנָה menunjuk pada keteguhan atau kestabilan tangan. 'Tetap' menyampaikan keadaan yang berlangsung.
- source_word: עַד בֹּא הַשָּׁמֶשׁ
  choice: sampai matahari terbenam
  rationale: Padanan Indonesia yang alami bagi ungkapan 'sampai masuk/terbenamnya matahari'.
theological_decisions:
- issue: Makna אֱמוּנָה ketika dikenakan pada tangan Musa
  choice: keteguhan fisik, diterjemahkan 'tetap teguh'
  alternative: tetap stabil; tetap kokoh; tetap setia
  rationale: Konteks langsung membahas tangan yang menjadi berat dan ditopang secara fisik. Namun, 'teguh' tetap mempertahankan sebagian keluasan semantis אֱמוּנָה tanpa mengubahnya menjadi abstraksi moral atau teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang bermartabat dan mudah dipahami. Ungkapan konkret Ibrani 'tangan ... berat' dipertahankan, sedangkan susunan klausa disesuaikan secukupnya demi kejelasan dan kelancaran.
