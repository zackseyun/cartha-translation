  text: וַ/יֹּ֨אמֶר מֹשֶׁ֤ה אֶל יְהוֹשֻׁ֨עַ֙ בְּחַר לָ֣/נוּ אֲנָשִׁ֔ים וְ/צֵ֖א הִלָּחֵ֣ם בַּ/עֲמָלֵ֑ק מָחָ֗ר אָנֹכִ֤י נִצָּב֙ עַל רֹ֣אשׁ הַ/גִּבְעָ֔ה וּ/מַטֵּ֥ה הָ/אֱלֹהִ֖ים בְּ/יָדִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/009.yaml
  text: And Moses said to Joshua[a], “Choose men for us and go out; fight against Amalek. Tomorrow I will stand on the top of the hill[b], with the staff of God in my hand.”
translation:
  language: id
  text: Lalu Musa berkata kepada Yosua, “Pilihlah beberapa orang untuk kita, lalu keluarlah dan berperanglah melawan Amalek.[a] Besok aku akan berdiri di puncak bukit[b] dengan tongkat Allah di tanganku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bertempurlah melawan Amalek.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di kepala bukit,” suatu ungkapan untuk “di puncak bukit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. “Lalu” menyatakannya secara wajar dalam bahasa Indonesia tanpa memberi penekanan sebab-akibat yang tidak ada dalam teks.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: בְּחַר לָנוּ אֲנָשִׁים
  choice: Pilihlah orang-orang bagi kita
  rationale: Mempertahankan arti dasar בחר, “memilih,” bentuk jamak אֲנָשִׁים, “orang-orang/laki-laki,” dan לָנוּ, “bagi kita.” Konteks menunjukkan bahwa mereka akan bertempur, tetapi teks tidak memakai kata khusus yang berarti “prajurit.”
- source_word: וְצֵא
  choice: lalu keluarlah
  rationale: יצא secara dasar berarti “keluar.” Dalam konteks ini, keluarnya Yosua adalah untuk menghadapi musuh; “lalu” menghubungkan dua perintah secara alami.
- source_word: הִלָּחֵם בַּעֲמָלֵק
  choice: berperanglah melawan Amalek
  rationale: Bentuk imperatif dari לחם dalam konteks militer berarti bertempur atau berperang. “Melawan” menyampaikan hubungan permusuhan yang ditandai oleh preposisi בְּ.
- source_word: מָחָר
  choice: Besok
  rationale: Adverbia waktu yang ditempatkan di depan klausa dipertahankan di awal kalimat berikutnya.
- source_word: אָנֹכִי נִצָּב
  choice: aku akan berdiri
  rationale: Walaupun נִצָּב berbentuk partisipel, keterangan waktu “besok” memberinya acuan masa depan. “Akan berdiri” alami dan tetap dekat dengan bentuk sumber.
- source_word: עַל רֹאשׁ הַגִּבְעָה
  choice: di puncak bukit
  rationale: Secara harfiah berarti “di kepala bukit,” tetapi רֹאשׁ merupakan ungkapan idiomatis untuk bagian paling atas atau puncak.
- source_word: וּמַטֵּה הָאֱלֹהִים
  choice: dengan tongkat Allah
  rationale: Frasa tanpa verba ini paling alami dipahami sebagai keterangan yang menyertai tindakan Musa berdiri. “Tongkat Allah” mempertahankan hubungan konstruksi Ibrani dan gema pemakaiannya dalam Keluaran.
- source_word: בְּיָדִי
  choice: di tanganku
  rationale: Terjemahan langsung dan alami dari frasa preposisional tersebut.
theological_decisions:
- issue: Makna הָאֱלֹהִים dalam frasa מַטֵּה הָאֱלֹהִים
  choice: tongkat Allah
  alternative: tongkat milik Allah
  rationale: “Tongkat Allah” mempertahankan konstruksi sumber tanpa menambahkan penjelasan tentang kepemilikan atau fungsi yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Bentuk perintah “pilihlah,” “keluarlah,” dan “berperanglah” mempertahankan daya ujar sumber. Kata “aku” dipakai dalam tuturan langsung Musa karena alami dalam bahasa Indonesia masa kini, sedangkan susunan kalimat tetap cukup formal untuk pembacaan Kitab Suci.
