language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקְרָא֙ שֵׁ֣ם הַ/מָּק֔וֹם מַסָּ֖ה וּ/מְרִיבָ֑ה עַל רִ֣יב בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/עַ֨ל נַסֹּתָ֤/ם אֶת יְהוָה֙ לֵ/אמֹ֔ר הֲ/יֵ֧שׁ יְהוָ֛ה בְּ/קִרְבֵּ֖/נוּ אִם אָֽיִן־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/007.yaml
  text: And he called the name of the place Massah and Meribah[a], because of the quarreling of the sons of Israel and because they tested Yahweh, saying[c][b], “Is Yahweh among us or not?”
translation:
  language: id
  text: Ia menamai tempat itu Masa dan Meriba[a], karena pertengkaran orang Israel dan karena mereka menguji Yahweh dengan berkata, “Apakah Yahweh ada di tengah-tengah kita atau tidak?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Masa berkaitan dengan kata Ibrani yang berarti “pengujian”, sedangkan Meriba berkaitan dengan kata yang berarti “pertengkaran” atau “perselisihan”.
    reason: Menjelaskan permainan kata Ibrani yang mendasari kedua nama tempat dan alasan penamaannya.
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם
  choice: Ia menamai tempat itu
  rationale: Ungkapan Ibrani harfiah 'ia menyebut nama tempat itu' merupakan rumusan penamaan; 'menamai tempat itu' menyampaikan fungsi konstruksi tersebut secara alami dalam bahasa Indonesia.
- source_word: מַסָּה וּמְרִיבָה
  choice: Masa dan Meriba
  rationale: Keduanya dipertahankan sebagai nama tempat dalam bentuk transliterasi Indonesia; permainan katanya dijelaskan dalam catatan kaki.
- source_word: עַל רִיב בְּנֵי יִשְׂרָאֵל
  choice: karena pertengkaran orang Israel
  rationale: עַל menyatakan alasan, sedangkan רִיב berarti pertengkaran atau perselisihan. בְּנֵי יִשְׂרָאֵל adalah sebutan kolektif idiomatis bagi bangsa Israel, sehingga 'orang Israel' paling alami dan tepat dalam bahasa Indonesia.
- source_word: וְעַל נַסֹּתָם אֶת יְהוָה
  choice: dan karena mereka menguji Yahweh
  rationale: Bentuk piel נסה menyatakan tindakan menguji atau mencobai; 'menguji' mempertahankan kaitannya dengan nama Masa tanpa menambahkan penilaian yang tidak tersurat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: לֵאמֹר
  choice: dengan berkata
  rationale: Dalam konteks ini, bentuk tersebut memperkenalkan perkataan yang menjadi cara mereka menguji Yahweh.
- source_word: הֲיֵשׁ יְהוָה בְּקִרְבֵּנוּ אִם אָיִן
  choice: Apakah Yahweh ada di tengah-tengah kita atau tidak?
  rationale: בְּקִרְבֵּנוּ menunjuk kehadiran di tengah komunitas, dan אִם אָיִן melengkapi pertanyaan polar dengan arti 'atau tidak'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian YHWH secara langsung; transliterasi mempertahankan statusnya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Sebutan kolektif בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel
  rationale: Walaupun bentuk Ibraninya secara harfiah 'anak-anak lelaki Israel', dalam ayat ini ungkapan itu berfungsi sebagai sebutan kolektif bagi umat Israel. 'Orang Israel' akurat dan alami serta tidak menyiratkan bahwa hanya laki-laki yang dimaksud.
- issue: Makna kehadiran Yahweh בְּקִרְבֵּנוּ
  choice: ada di tengah-tengah kita
  alternative: menyertai kita
  rationale: Terjemahan ini mempertahankan bahasa spasial-relasional dari teks dan tidak mempersempitnya menjadi satu bentuk penyertaan tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Struktur Ibrani dihaluskan seperlunya agar alami, sedangkan nama ilahi, nama tempat, permainan kata, dan ketegangan pertanyaan terakhir tetap dipertahankan.
