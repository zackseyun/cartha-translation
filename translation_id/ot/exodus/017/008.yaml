  text: וַ/יָּבֹ֖א עֲמָלֵ֑ק וַ/יִּלָּ֥חֶם עִם יִשְׂרָאֵ֖ל בִּ/רְפִידִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/008.yaml
  text: Then Amalek came and fought with Israel at Rephidim[a].
translation:
  language: id
  text: Kemudian orang Amalek datang dan berperang melawan Israel[a] di Refidim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dengan Israel”; dalam konteks peperangan, maksudnya “melawan Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Kemudian ... datang
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita. “Kemudian” menyampaikan perkembangan narasi secara wajar dalam bahasa Indonesia, sedangkan “datang” mempertahankan arti dasar בוא.
- source_word: עֲמָלֵק
  choice: orang Amalek
  rationale: Nama leluhur dipakai secara kolektif untuk kelompok keturunannya. “Orang Amalek” membuat acuan kolektif itu jelas tanpa mengubah nama diri sumber.
- source_word: וַיִּלָּחֶם
  choice: berperang
  rationale: Bentuk Nifal dari לחם dalam konteks ini berarti bertempur atau berperang. “Berperang” merupakan ungkapan Indonesia yang alami dan sesuai dengan gaya narasi.
- source_word: עִם
  choice: melawan
  rationale: Walaupun arti dasar preposisi ini adalah “dengan,” dalam konteks peperangan relasinya bersifat bermusuhan. “Melawan” menghindari kesan bahwa Israel menjadi sekutu Amalek; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Bentuk baku nama bangsa dan umat perjanjian dalam bahasa Indonesia.
- source_word: בִּרְפִידִם
  choice: di Refidim
  rationale: Preposisi בְּ menandai tempat. “Di” adalah padanan lokasi yang alami, dan “Refidim” mengikuti bentuk nama yang lazim dalam bahasa Indonesia.
