  text: וַ/יָּ֤רֶב הָ/עָם֙ עִם מֹשֶׁ֔ה וַ/יֹּ֣אמְר֔וּ תְּנוּ לָ֥/נוּ מַ֖יִם וְ/נִשְׁתֶּ֑ה וַ/יֹּ֤אמֶר לָ/הֶם֙ מֹשֶׁ֔ה מַה תְּרִיבוּ/ן֙ עִמָּדִ֔/י מַה תְּנַסּ֖וּ/ן אֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/002.yaml
  text: So the people quarreled with Moses and said[a], “Give us water so that we may drink.” And Moses said to them[b], “Why do you quarrel with me? Why do you test Yahweh?”
translation:
  language: id
  text: Bangsa itu pun bertengkar dengan Musa dan berkata, “Berilah kami air agar kami minum.” Musa berkata kepada mereka, “Mengapa kalian bertengkar dengan aku? Mengapa kalian menguji Yahweh[a][b]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN.”'
    reason: Menjelaskan bentuk nama ilahi dalam bahasa Ibrani dan tradisi penerjemahannya.
  - marker: b
    text: 'Atau: “Mengapa kalian mencobai Yahweh?”'
    reason: Mencatat alternatif leksikal yang lazim untuk kata Ibrani yang dapat berarti “menguji” atau “mencobai.”
lexical_decisions:
- source_word: וַיָּרֶב
  choice: pun bertengkar
  rationale: Kata kerja ריב menyatakan perselisihan atau pertengkaran yang bersifat menentang. “Bertengkar” alami dalam bahasa Indonesia modern dan mempertahankan daya adversatifnya.
- source_word: הָעָם
  choice: bangsa itu
  rationale: Nomina berartikel ini secara harfiah menunjuk kepada “bangsa itu”; terjemahan tidak menambahkan “Israel,” yang tidak disebut secara eksplisit dalam ayat ini.
- source_word: עִם מֹשֶׁה
  choice: dengan Musa
  rationale: Preposisi עִם secara formal berarti “dengan,” dan ungkapan “bertengkar dengan” sudah menyampaikan pertentangan secara wajar.
- source_word: תְּנוּ לָנוּ מַיִם
  choice: Berilah kami air
  rationale: Imperatif נתן dengan objek tak langsung diterjemahkan secara langsung dan idiomatis tanpa memperluasnya menjadi “sediakanlah.”
- source_word: וְנִשְׁתֶּה
  choice: supaya kami dapat minum
  rationale: Bentuk kohortatif sesudah imperatif menyatakan tujuan atau hasil yang diinginkan.
- source_word: מַה תְּרִיבוּן עִמָּדִי
  choice: Mengapa kalian bertengkar dengan aku?
  rationale: מַה berfungsi sebagai pertanyaan teguran “mengapa.” Pengulangan “bertengkar” mempertahankan kaitan leksikal dengan ריב pada awal ayat; “kalian” juga memperjelas bahwa bentuk Ibraninya jamak.
- source_word: מַה תְּנַסּוּן
  choice: Mengapa kalian menguji
  rationale: נסה dalam piel berarti “menguji” atau “menempatkan dalam ujian.” Pilihan ini ringkas dan mempertahankan bobot teologis tindakan bangsa itu.
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar, sehingga bentuk nama dalam teks sumber tetap nyata.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian dan catatan kaki memberi tahu pembaca tentang bentuk Ibraninya serta tradisi penerjemahannya.
- issue: Daya makna נסה ketika objeknya adalah Allah
  choice: menguji Yahweh
  alternative: mencobai Yahweh; menempatkan Yahweh dalam ujian
  rationale: Terjemahan “menguji” mempertahankan ketegangan bahwa pertengkaran dengan Musa sekaligus merupakan tindakan menantang Allah, tanpa memperlunak atau menambahkan tafsiran tentang motif mereka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk mempertahankan jumlah jamak yang eksplisit dalam bentuk verba Ibrani. Pengulangan “bertengkar” disengaja untuk mencerminkan pengulangan akar ריב.
