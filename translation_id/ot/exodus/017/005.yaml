base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/005.yaml
  text: Then Yahweh said to Moses[a], “Pass on before the people, and take with you some of the elders of Israel. Take in your hand your staff with which you struck the Nile[b], and go.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa, “Majulah mendahului bangsa itu dan bawalah beberapa tua-tua Israel bersamamu.[a] Bawalah tongkatmu, yang dengannya engkau telah memukul Sungai Nil,[b] di tanganmu, lalu pergilah.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dari antara tua-tua Israel”; frasa ini tampaknya berarti Musa harus membawa beberapa tua-tua yang dipilih.'
    reason: lexical_alternative
  - marker: b
    text: Atau “sungai itu”; dalam kitab Keluaran, istilah ini biasanya secara khusus menunjuk pada Sungai Nil.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi dalam bentuk transliterasi yang lazim dan tidak menggantinya dengan gelar.
- source_word: עֲבֹר לִפְנֵי הָעָם
  choice: Berjalanlah di depan bangsa itu
  rationale: Menyampaikan perintah agar Musa bergerak di hadapan umat; ungkapan ini alami dalam bahasa Indonesia tanpa menentukan secara berlebihan apakah ia harus menyeberang atau sekadar mendahului.
- source_word: וְקַח אִתְּךָ מִזִּקְנֵי יִשְׂרָאֵל
  choice: bawalah bersamamu beberapa orang dari antara para tua-tua Israel
  rationale: Preposisi מִן menyatakan pemilihan dari suatu kelompok, sehingga yang dibawa bukan seluruh tua-tua Israel.
- source_word: מַטְּךָ
  choice: tongkat
  rationale: Padanan Indonesia yang alami bagi מַטֶּה dalam konteks tongkat Musa.
- source_word: אֲשֶׁר הִכִּיתָ בּוֹ אֶת הַיְאֹר
  choice: yang kaupakai untuk memukul Sungai Nil
  rationale: בּוֹ bersifat instrumental, sedangkan הַיְאֹר dalam konteks Keluaran menunjuk pada Sungai Nil.
- source_word: קַח בְּיָדְךָ
  choice: Ambillah ke dalam tanganmu
  rationale: Mempertahankan pengulangan verba קח dan gambaran konkret bahwa Musa harus memegang tongkat itu.
- source_word: וְהָלָכְתָּ
  choice: lalu pergilah
  rationale: Bentuk ini meneruskan rangkaian perintah dan secara idiomatis berfungsi sebagai perintah untuk pergi.
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Waw konsekutif memajukan alur cerita; “berfirman” merupakan pilihan register yang wajar ketika subjeknya Allah.
theological_decisions:
- issue: Penerjemahan nama ilahi YHWH
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Mempertahankan nama pribadi yang terdapat dalam teks Ibrani tanpa menggantinya dengan gelar atau memilih bentuk alternatif yang kurang dekat dengan rekonstruksi pelafalan yang umum.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan perintah dibuat alami sambil mempertahankan pengulangan kata “ambil” dalam teks Ibrani dan nuansa partitif pada pemilihan para tua-tua.
