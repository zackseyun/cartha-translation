base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/016.yaml
  text: And he said[a], “A hand is upon the throne of Yah; Yahweh will have war with Amalek from generation to generation.”
translation:
  language: id
  text: Lalu ia berkata[a], “Sebuah tangan ada di atas takhta Yah; Yahweh akan berperang melawan Amalek turun-temurun.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibraninya sulit dan eliptis; secara harfiah, “Sebuah tangan di atas takhta Yah.” Ungkapan ini juga dapat dipahami sebagai “sebuah tangan melawan takhta Yah,” atau, meski kemungkinannya lebih kecil, כֵּס dapat dipahami sebagai “panji.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ia berkata
  rationale: Bentuk wayyiqtol melanjutkan narasi dengan subjek orang ketiga tunggal maskulin; nama subjek tidak dinyatakan kembali dalam bahasa Ibrani.
- source_word: כִּי
  choice: tidak diterjemahkan secara tersendiri
  rationale: Partikel ini memperkenalkan isi perkataan, tetapi klausa sesudahnya eliptis dan sulit. Tanda kutip langsung menyampaikan fungsinya tanpa memaksakan arti sebab atau penegasan.
- source_word: יָד
  choice: sebuah tangan
  rationale: Nomina ini tidak memakai artikel. Bentuk tak tentu mempertahankan kejanggalan dan tidak menentukan tangan siapa yang dimaksud.
- source_word: עַל
  choice: di atas
  rationale: Ini mempertahankan arti leksikal yang paling langsung, yaitu 'di atas/pada', tanpa menutup kemungkinan tafsiran 'melawan' yang dicatat dalam catatan kaki.
- source_word: כֵּס
  choice: takhta
  rationale: Bentuk yang tidak biasa ini kemungkinan merupakan bentuk singkat atau ejaan defektif yang berkaitan dengan כִּסֵּא, 'takhta'. Arti 'panji' kurang kuat secara leksikal.
- source_word: יָהּ
  choice: Yah
  rationale: Nama ilahi bentuk pendek dipertahankan secara berbeda dari יהוה yang muncul kemudian.
- source_word: מִלְחָמָה לַיהוָה
  choice: Yahweh akan berperang
  rationale: Klausa nominal menyatakan perang yang menjadi bagian atau urusan Yahweh. Bentuk verbal ini alami dalam bahasa Indonesia dan mempertahankan nuansa berkelanjutan atau futuris dalam konteks.
- source_word: בַּעֲמָלֵק
  choice: melawan Amalek
  rationale: Preposisi ב dalam konteks peperangan menunjukkan keterlibatan yang bermusuhan; 'melawan' adalah ungkapan Indonesia yang jelas dan alami.
- source_word: מִדֹּר דֹּר
  choice: turun-temurun
  rationale: Ungkapan Indonesia ini menyampaikan keberlangsungan dari satu generasi ke generasi berikutnya secara alami dan ringkas.
theological_decisions:
- issue: Penerjemahan nama ilahi יָהּ dan יהוה dalam ayat yang sama
  choice: יָהּ diterjemahkan 'Yah' dan יהוה diterjemahkan 'Yahweh'
  alternative: Keduanya diterjemahkan 'TUHAN'
  rationale: Teks memakai dua bentuk nama ilahi yang berbeda. Mempertahankan 'Yah' dan 'Yahweh' mencerminkan perbedaan bentuk dalam sumber Ibrani.
- issue: Klausa eliptis כִּי יָד עַל כֵּס יָהּ
  choice: “Sebuah tangan ada di atas takhta Yah” dengan alternatif dalam catatan kaki
  alternative: “Sebuah tangan melawan takhta Yah” atau “Sebuah tangan ada di atas panji Yah”
  rationale: Bahasa Ibraninya sangat padat dan sulit. Terjemahan utama mempertahankan nilai leksikal paling langsung tanpa mengubahnya menjadi pernyataan eksplisit tentang sumpah atau serangan, sedangkan kemungkinan lain disimpan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Klausa pertama sengaja tetap padat dan agak janggal untuk mempertahankan ambiguitas asli; klausa kedua dibuat alami tanpa menghilangkan kesinambungan perang antargenerasi.
