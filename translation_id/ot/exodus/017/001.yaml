  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ֠/יִּסְעוּ כָּל עֲדַ֨ת בְּנֵֽי יִשְׂרָאֵ֧ל מִ/מִּדְבַּר סִ֛ין לְ/מַסְעֵי/הֶ֖ם עַל פִּ֣י יְהוָ֑ה וַֽ/יַּחֲנוּ֙ בִּ/רְפִידִ֔ים וְ/אֵ֥ין מַ֖יִם לִ/שְׁתֹּ֥ת הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/017/001.yaml
  text: Then the whole congregation of the sons of Israel set out from the wilderness of Sin by stages[a], according to the command of Yahweh, and camped at Rephidim[b]; but there was no water for the people to drink.
translation:
  language: id
  text: Kemudian seluruh umat Israel berangkat dari Padang Gurun Sin, menempuh tahap-tahap perjalanan mereka[a] sesuai dengan perintah Yahweh.[b] Mereka berkemah di Rafidim, tetapi di sana tidak ada air untuk diminum bangsa itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menurut tahap-tahap perjalanan mereka”; maksudnya, mereka berpindah melalui serangkaian tahap atau persinggahan.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani secara harfiah berbunyi “menurut mulut Yahweh,” sebuah ungkapan yang berarti menurut perintah atau pengarahan-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: berangkat
  rationale: Dalam konteks perjalanan, נסע berarti membongkar perkemahan lalu bergerak menuju tempat berikutnya. “Berangkat” alami dalam bahasa Indonesia modern dan mempertahankan gerak narasi.
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: seluruh umat Israel
  rationale: עֵדָה menunjuk kepada komunitas yang berhimpun, sedangkan בְּנֵי יִשְׂרָאֵל merupakan sebutan kolektif bagi bangsa Israel. “Seluruh umat Israel” jelas, wajar, dan mencakup komunitas itu secara utuh.
- source_word: מִמִּדְבַּר סִין
  choice: dari Padang Gurun Sin
  rationale: מִדְבָּר adalah kawasan tandus atau belantara; “Padang Gurun” merupakan padanan Indonesia yang lazim dalam narasi perjalanan. Sin dipertahankan sebagai nama tempat, bukan kata bahasa Inggris “sin”.
- source_word: לְמַסְעֵיהֶם
  choice: menempuh tahap-tahap perjalanan mereka
  rationale: Bentuk jamak מַסָּע mengacu pada tahap-tahap atau persinggahan dalam rangkaian perjalanan. Ungkapan ini mempertahankan unsur “mereka” yang ada dalam teks Ibrani sekaligus tetap alami.
- source_word: עַל פִּי יְהוָה
  choice: sesuai dengan perintah Yahweh
  rationale: Secara harfiah ungkapan ini berarti “menurut mulut Yahweh,” tetapi merupakan idiom untuk bertindak sesuai dengan perintah atau pengarahan-Nya.
- source_word: וַיַּחֲנוּ בִּרְפִידִים
  choice: Mereka berkemah di Rafidim
  rationale: חנה berarti mendirikan atau menempati perkemahan. “Berkemah” adalah padanan modern yang langsung; Rafidim mengikuti bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: וְאֵין מַיִם לִשְׁתֹּת הָעָם
  choice: tetapi di sana tidak ada air untuk diminum bangsa itu
  rationale: ו dipahami bernuansa pertentangan karena memperkenalkan masalah setelah mereka tiba. “Di sana” menjelaskan lokasi secara alami tanpa mengubah makna, dan “bangsa itu” mempertahankan rujukan kolektif הָעָם.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama diri perjanjian יְהוָה. “Yahweh” mempertahankan nama ilahi sebagai nama, bukan menggantinya dengan gelar, tanpa memasukkan penafsiran denominasi tertentu.
- issue: Sifat pengarahan ilahi dalam עַל פִּי יְהוָה
  choice: sesuai dengan perintah Yahweh
  alternative: menurut firman Yahweh atau secara harfiah “menurut mulut Yahweh”
  rationale: Konteks menampilkan perjalanan Israel sebagai tindakan yang mengikuti pengarahan berotoritas dari Yahweh. “Perintah” menyampaikan idiom tersebut tanpa menentukan mekanisme khusus bagaimana pengarahan itu diberikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat tetapi mudah dipahami. Nama ilahi dipertahankan sebagai “Yahweh”; nama tempat רְפִידִים ditulis “Rafidim” sesuai kelaziman Indonesia. Struktur kalimat dipecah setelah keterangan tentang perintah Yahweh agar alur perjalanan dan munculnya krisis air terbaca jelas.
