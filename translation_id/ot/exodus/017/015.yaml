  yaml_path: translation/ot/exodus/017/015.yaml
  text: And Moses built an altar and called its name[a], “Yahweh Is My Banner.”
translation:
  language: id
  text: Lalu Musa membangun sebuah mazbah dan menamainya, “Yahweh adalah Panjiku.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “YHWH panjiku,” atau “Yahweh panjiku.” Nama ini menggambarkan Yahweh sebagai panji atau tanda tempat Israel berhimpun.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבֶן
  choice: membangun
  rationale: Kata kerja בנה dalam bentuk naratif ini menyatakan tindakan konkret membangun; “membangun” adalah padanan Indonesia yang langsung dan alami.
- source_word: מִזְבֵּחַ
  choice: mazbah
  rationale: מִזְבֵּחַ adalah istilah baku bagi tempat persembahan kurban. “Mazbah” mempertahankan istilah religius yang mapan dalam bahasa Indonesia.
- source_word: וַיִּקְרָא שְׁמוֹ
  choice: menamainya
  rationale: Ungkapan Ibrani secara harfiah berarti “menyebut namanya”. “Menamainya” menyampaikan rumus pemberian nama itu secara alami dan jelas dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Teks memakai nama ilahi יהוה secara langsung; “Yahweh” mempertahankannya sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: נִסִּי
  choice: Panji-panjiku
  rationale: נֵס menunjuk pada panji, tanda, atau tiang panji yang menjadi pusat berhimpun. Bentuk נִסִּי berarti “panji-panjiku”; kopula “adalah” ditambahkan agar frasa nominal tersebut alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה dalam nama peringatan bagi mazbah
  choice: Yahweh
  alternative: TUHAN
  rationale: Ayat ini secara eksplisit memakai Tetragramaton sebagai bagian dari nama mazbah. Memakai “Yahweh” menjaga fungsi nama diri dalam teks sumber.
- issue: Makna metaforis נִסִּי
  choice: Panji-panjiku
  alternative: panjiku / tanda kebesaranku
  rationale: “Panji-panji” mempertahankan gambaran konkret tentang tanda tempat umat berhimpun dan tidak membatasi metafora itu hanya pada kebesaran atau kemenangan.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan khidmat. “Lalu” meneruskan alur naratif; “menamainya” menghindari ungkapan harfiah yang kaku. Istilah “mazbah” dipertahankan sebagai kosakata Alkitab yang mapan, sedangkan “Panji-panjiku” mempertahankan bentuk leksikal dan nuansa metaforis teks Ibrani.
