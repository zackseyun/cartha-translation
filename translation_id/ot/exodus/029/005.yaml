base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/005.yaml
  text: Then you shall take the garments and clothe Aaron with the tunic[a], the robe of the ephod, the ephod, and the breastpiece[b], and you shall skillfully fasten it on him with the woven band of the ephod.
translation:
  language: id
  text: Kemudian, ambillah pakaian itu dan pakaikanlah kepada Harun baju panjang, jubah efod, efod, dan penutup dada[a]. Pasangkanlah efod itu padanya dengan sabuk tenunan efod itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara tradisional juga diterjemahkan “tutup dada” atau “perhiasan dada”. Kata Ibrani ini menunjuk perlengkapan imam yang dikenakan pada dada, bukan baju zirah.
    reason: lexical_alternative
  - marker: b
    text: Kata kerja Ibrani yang dipakai di sini jarang ditemukan dan dapat berarti memasang atau mengikatkan efod pada Harun.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: וְלָקַחְתָּ אֶת־הַבְּגָדִים
  choice: Kemudian ambillah pakaian-pakaian itu
  rationale: Waw dalam rangkaian petunjuk diterjemahkan sebagai urutan prosedural dengan 'Kemudian'. Bentuk jamak ulang 'pakaian-pakaian' memperjelas bahwa yang dimaksud ialah seperangkat pakaian yang segera dirinci.
- source_word: וְהִלְבַּשְׁתָּ אֶת־אַהֲרֹן
  choice: dan kenakanlah kepada Harun
  rationale: Bentuk Hifil dari לבש menyatakan tindakan mengenakan pakaian kepada seseorang; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan makna kausatif.
- source_word: הַכֻּתֹּנֶת
  choice: baju panjang
  rationale: כֻּתֹּנֶת menunjuk pakaian dasar yang dikenakan pada tubuh. 'Baju panjang' lebih mudah dipahami pembaca umum daripada transliterasi teknis, tanpa menyamakannya dengan pakaian gerejawi kemudian.
- source_word: מְעִיל הָאֵפֹד
  choice: jubah efod
  rationale: Frasa konstruksi ini menunjuk jubah yang berkaitan dengan efod. Bentuk ringkas 'jubah efod' alami dan tetap dekat dengan struktur Ibrani.
- source_word: הָאֵפֹד
  choice: efod
  rationale: אֵפֹד adalah istilah teknis bagi pakaian atau perlengkapan imam tertentu yang tidak memiliki padanan Indonesia yang tepat, sehingga ditransliterasikan.
- source_word: הַחֹשֶׁן
  choice: penutup dada
  rationale: חֹשֶׁן ialah perlengkapan berhias yang dipasang pada dada. 'Penutup dada' netral dan tidak menimbulkan kesan baju zirah seperti 'pelindung dada'.
- source_word: וְאָפַדְתָּ לוֹ
  choice: Pasangkanlah efod itu pada tubuhnya
  rationale: Kata kerja אפד langka dan berkaitan dengan memasang atau mengikat efod pada seseorang. 'Pasangkanlah' menyampaikan tindakan tersebut tanpa memberi kepastian semu mengenai nuansa tepat kata langka ini; objek implisit dijelaskan sebagai efod.
- source_word: בְּחֵשֶׁב הָאֵפֹד
  choice: dengan sabuk tenunan efod tersebut
  rationale: חֵשֶׁב dalam konteks ini menunjuk pita atau sabuk hasil tenunan yang menjadi bagian efod. 'Sabuk tenunan' konkret, ringkas, dan sesuai dengan fungsi pengikatnya.
