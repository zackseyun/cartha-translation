  yaml_path: translation/ot/exodus/029/032.yaml
  text: Aaron and his sons shall eat the flesh of the ram and the bread that is in the basket at the entrance of the tent of meeting[a].
translation:
  language: id
  text: Di pintu masuk Kemah Pertemuan, Harun dan anak-anak laki-lakinya harus memakan daging domba jantan itu dan roti yang ada di dalam bakul itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָכַל
  choice: harus memakan
  rationale: Bentuk perfektum Qal dengan waw dalam konteks petunjuk ritual menyatakan ketentuan yang wajib dilakukan, bukan tindakan lampau. 'Harus memakan' menyampaikan daya preskriptifnya secara alami dalam bahasa Indonesia.
- source_word: אַהֲרֹן
  choice: Harun
  rationale: Bentuk nama yang baku dan dikenal luas dalam Alkitab bahasa Indonesia.
- source_word: וּבָנָיו
  choice: dan anak-anak lelakinya
  rationale: Dalam konteks penahbisan imam, בנים menunjuk secara khusus kepada putra-putra Harun yang turut ditahbiskan; pilihan ini mempertahankan kekhususan gender sumber.
- source_word: בְּשַׂר הָאַיִל
  choice: daging domba jantan itu
  rationale: Dalam konteks konsumsi korban, בשר secara wajar berarti daging yang dimakan; אַיִל secara khusus berarti domba jantan. Demonstratif 'itu' menandai hewan tertentu yang telah disebut dalam konteks.
- source_word: הַלֶּחֶם
  choice: roti
  rationale: לֶחֶם di sini menunjuk secara kolektif kepada roti dalam bakul yang disebut pada konteks sebelumnya.
- source_word: אֲשֶׁר בַּסָּל
  choice: yang ada di dalam bakul
  rationale: Klausa relatif ini mengidentifikasi roti berdasarkan letaknya. 'Bakul' sesuai untuk wadah anyaman ritual dan lazim dalam ragam Alkitab Indonesia.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: di pintu masuk Kemah Pertemuan
  rationale: פֶּתַח menunjuk pintu masuk atau bukaan; אֹהֶל מוֹעֵד diterjemahkan dengan istilah baku yang mempertahankan fungsi tempat perjumpaan.
theological_decisions:
- issue: Bahasa laki-laki dalam konteks keimaman
  choice: anak-anak lelakinya
  alternative: anak-anaknya
  rationale: Ayat ini merujuk kepada putra-putra Harun yang menjalani ritus penahbisan imam, bukan kepada semua anaknya secara umum.
- issue: Daya verbal petunjuk ritual
  choice: harus memakan
  alternative: akan memakan
  rationale: Konteks hukum-ritual memberi bentuk verba ini daya preskriptif. 'Harus' menyampaikan kewajiban tanpa mengubahnya menjadi narasi masa depan semata.
- issue: Makna בשר dalam konteks korban
  choice: daging
  alternative: tubuh/daging jasmani
  rationale: Walaupun makna dasarnya adalah 'daging', dalam tindakan makan korban kata ini secara konkret menunjuk bagian hewan yang dapat dimakan; 'daging' alami dan tidak menghapus nuansa ritual.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat langsung dan mudah dipahami, dengan istilah kultis baku 'Kemah Pertemuan'. Tidak diperlukan catatan kaki karena alternatif leksikal בשר tercakup secara alami oleh kata 'daging' dalam bahasa Indonesia.
