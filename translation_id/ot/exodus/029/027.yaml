id: EXO.29.27
reference: Exodus 29:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/קִדַּשְׁתָּ֞ אֵ֣ת חֲזֵ֣ה הַ/תְּנוּפָ֗ה וְ/אֵת֙ שׁ֣וֹק הַ/תְּרוּמָ֔ה אֲשֶׁ֥ר הוּנַ֖ף וַ/אֲשֶׁ֣ר הוּרָ֑ם מֵ/אֵיל֙ הַ/מִּלֻּאִ֔ים מֵ/אֲשֶׁ֥ר לְ/אַהֲרֹ֖ן וּ/מֵ/אֲשֶׁ֥ר לְ/בָנָֽי/ו׀׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/027.yaml
  text: And you shall consecrate the breast of the wave offering and the thigh of the contribution[a], which was waved and which was raised, from the ram of ordination[b], from what was Aaron's and from what was his sons'.
translation:
  language: id
  text: Haruslah engkau menguduskan dada persembahan unjukan dan paha persembahan khusus[a], yang telah diunjukkan dan yang telah diangkat dari domba jantan pentahbisan[b], yaitu dari bagian yang diperuntukkan bagi Harun dan dari bagian yang diperuntukkan bagi anak-anaknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “paha persembahan yang diangkat”; secara tradisional disebut “persembahan unjukan khusus.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “domba jantan pengisian tangan,” yaitu domba jantan yang digunakan dalam penahbisan imam.'
    reason: cultural_note
lexical_decisions:
- source_word: קִדַּשְׁתָּ
  choice: menguduskan
  rationale: Bentuk Piel dari קדשׁ berarti menetapkan atau memisahkan sebagai kudus. 'Menguduskan' mempertahankan daya kultisnya dan wajar dalam bahasa Alkitab Indonesia.
- source_word: חֲזֵה הַתְּנוּפָה
  choice: dada persembahan unjukan
  rationale: חֲזֵה menunjuk bagian dada hewan, sedangkan תְּנוּפָה berkaitan langsung dengan tindakan ritual mengunjukkan atau mengayunkannya di hadapan TUHAN.
- source_word: שׁוֹק הַתְּרוּמָה
  choice: paha persembahan khusus
  rationale: שׁוֹק adalah bagian paha atau tungkai atas. תְּרוּמָה ialah bagian yang diangkat dan dikhususkan sebagai persembahan; 'persembahan khusus' alami dalam bahasa Indonesia sambil catatan kaki mempertahankan alternatif konkret.
- source_word: הוּנַף
  choice: telah diunjukkan
  rationale: Bentuk Hophal dari נוף menyatakan tindakan ritual yang dikenakan pada bagian persembahan dan mempertahankan kaitannya dengan 'persembahan unjukan'.
- source_word: הוּרָם
  choice: telah diangkat
  rationale: Bentuk Hophal dari רום secara konkret berarti dibuat terangkat atau diangkat, serta mencerminkan latar istilah תְּרוּמָה.
- source_word: אֵיל הַמִּלֻּאִים
  choice: domba jantan pentahbisan
  rationale: Secara harfiah 'domba jantan pengisian-pengisian', suatu idiom bagi domba yang dipakai dalam upacara penahbisan imam.
- source_word: מֵאֲשֶׁר לְאַהֲרֹן וּמֵאֲשֶׁר לְבָנָיו
  choice: dari bagian yang diperuntukkan bagi Harun dan dari bagian yang diperuntukkan bagi anak-anaknya
  rationale: Ungkapan ini membedakan bagian yang terkait dengan Harun dari bagian untuk anak-anaknya tanpa memaksakan pengertian kepemilikan mutlak.
theological_decisions:
- issue: Penerjemahan istilah teknis persembahan dalam peraturan ibadah
  choice: 'Mempertahankan bahasa ritual konkret: ''persembahan unjukan'', ''diunjukkan'', dan ''diangkat''.'
  alternative: Meratakan semuanya menjadi 'persembahan' atau 'bagian khusus' tanpa menyebut tindakan ritual.
  rationale: Bahasa Ibrani sengaja mengaitkan nama persembahan dengan tindakan ritualnya. Mempertahankan kaitan itu membuat prosedur ibadah tetap tampak dan tidak memasukkan penafsiran teologis belakangan.
- issue: Makna frasa pembagian kepada Harun dan anak-anaknya
  choice: Menerjemahkan sebagai bagian yang 'diperuntukkan bagi' masing-masing.
  alternative: Menerjemahkan sebagai sesuatu yang 'dimiliki' Harun dan anak-anaknya.
  rationale: Preposisi לְ dapat menandai peruntukan atau hubungan kepemilikan. 'Diperuntukkan bagi' mempertahankan konteks pembagian kurban tanpa menegaskan lebih daripada yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'Haruslah engkau' mempertahankan gaya perintah hukum ritual; istilah teknis dijaga tetap konkret, dengan penjelasan bagi idiom Ibrani dalam catatan kaki.
