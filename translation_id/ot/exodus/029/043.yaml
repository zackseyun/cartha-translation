  text: וְ/נֹעַדְתִּ֥י שָׁ֖מָּ/ה לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/נִקְדַּ֖שׁ בִּ/כְבֹדִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/043.yaml
  text: There I will meet with the sons of Israel[b][a], and it will be sanctified by my glory.
translation:
  language: id
  text: Di sanalah Aku akan bertemu dengan anak-anak Israel[a], dan tempat itu akan dikuduskan oleh kemuliaan-Ku.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “putra-putra Israel”; ungkapan Ibrani yang lazim untuk umat Israel.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani tidak menyebutkan secara eksplisit apa yang akan dikuduskan. Rujukannya dapat dipahami secara umum sebagai kawasan kudus yang sedang dibicarakan, atau lebih khusus sebagai Kemah Pertemuan atau mazbah.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנֹעַדְתִּי
  choice: Aku akan bertemu dengan
  rationale: Bentuk Nifal dari יעד dalam konteks Kemah Pertemuan menunjuk pada perjumpaan yang ditetapkan. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan gagasan seperti penampakan diri.
- source_word: שָׁמָּה
  choice: Di sanalah
  rationale: Keterangan tempat ini menunjuk kembali kepada lokasi kudus yang baru dibicarakan; partikel -lah memberi penekanan yang wajar pada tempat tersebut.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: dengan keturunan Israel
  rationale: Preposisi ל bersama יעד mendukung arti 'bertemu dengan'. 'Keturunan Israel' mempertahankan hubungan dengan nama leluhur Israel sekaligus berfungsi sebagai sebutan kolektif yang alami bagi bangsa itu.
- source_word: וְנִקְדַּשׁ
  choice: tempat itu akan dikuduskan
  rationale: Bentuk Nifal קדש menyatakan bahwa sesuatu dijadikan atau dinyatakan kudus. Karena verba Ibrani maskulin tunggal ini tidak menyebutkan subjeknya, 'tempat itu' mempertahankan rujukan umum kepada kawasan kudus tanpa menentukan Kemah atau mazbah.
- source_word: בִּכְבֹדִי
  choice: oleh kemuliaan-Ku
  rationale: Preposisi ב dapat menyatakan sarana atau pelaku perantaraan; kemuliaan Allah adalah yang menguduskan tempat tersebut.
theological_decisions:
- issue: Subjek tersirat pada וְנִקְדַּשׁ
  choice: '''tempat itu'' sebagai rujukan umum kepada lokasi kudus yang sedang dibicarakan'
  alternative: Kemah Pertemuan secara khusus; mazbah secara khusus; atau Harun
  rationale: Teks Ibrani memakai verba orang ketiga maskulin tunggal tanpa subjek eksplisit. Bahasa Indonesia memerlukan rujukan yang lebih jelas; 'tempat itu' tidak memutuskan apakah yang dimaksud khususnya Kemah atau mazbah dan menghindari rujukan yang kurang mungkin kepada Harun.
- issue: Makna kolektif בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak Israel; orang Israel; bangsa Israel
  rationale: Ungkapan ini merupakan sebutan perjanjian yang baku bagi seluruh umat Israel. 'Keturunan Israel' menjaga unsur asal-usul genealogis tanpa memberi kesan bahwa yang dimaksud hanya anak laki-laki atau anak-anak dalam arti usia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pada Aku dan -Ku mengikuti gaya penghormatan kepada Allah. Susunan kalimat mempertahankan dua klausa Ibrani serta kepasifan tindakan pengudusan, sementara catatan kaki menjaga ambiguitas subjek yang asli.
