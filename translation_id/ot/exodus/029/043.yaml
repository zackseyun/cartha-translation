  naturalness: “Di sanalah Aku akan bertemu dengan anak-anak Israel” dan “tempat itu akan dikuduskan oleh kemuliaan-Ku” adalah bahasa Indonesia baku, jelas, dan sesuai register khidmat. “Anak-anak Israel” di sini merupakan idiom alkitabiah yang lazim; catatan kaki membantu pembaca yang mungkin memahaminya secara harfiah sebagai kelompok usia.
  terminology: “Dikuduskan” secara baik menyampaikan bentuk pasif Nifal dari קדש. “Kemuliaan-Ku” tepat untuk כבודי dan mempertahankan bahasa teologis teks tanpa penafsiran tambahan. “Anak-anak Israel” lebih dekat kepada בני ישראל daripada “keturunan Israel.”
