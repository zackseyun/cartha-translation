  terminology: '"Domba jantan", "kaki-kakinya", dan "kepalanya" tepat. "Letakkan" adalah pilihan yang lugas untuk וְנָתַתָּ. Pengulangan "di atas" mencerminkan עַל yang diulang dalam teks sumber.'
