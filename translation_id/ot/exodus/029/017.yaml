translation:
  language: id
  text: Lalu potonglah domba jantan itu menjadi bagian-bagiannya, cucilah bagian dalam dan kaki-kakinya, kemudian letakkan semuanya di atas potongan-potongannya dan di atas kepalanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאַיִל
  choice: domba jantan itu
  rationale: Dalam konteks kurban, אַיִל menunjuk pada domba jantan dewasa; ungkapan ini jelas dan lazim dalam bahasa Indonesia.
- source_word: תְּנַתֵּחַ לִנְתָחָיו
  choice: potonglah ... menjadi bagian-bagiannya
  rationale: Bentuk piel נתח menyatakan tindakan memotong atau membagi hewan menjadi potongan-potongan untuk kurban.
- source_word: קִרְבּוֹ
  choice: isi perut
  rationale: Dalam petunjuk kurban, קֶרֶב menunjuk pada bagian atau organ dalam hewan; 'isi perut' alami dan mudah dipahami tanpa menentukan organ tertentu.
- source_word: כְרָעָיו
  choice: kaki-kakinya
  rationale: כְּרָעַיִם menunjuk pada kaki hewan, kemungkinan terutama bagian bawahnya; terjemahan umum ini tidak memberi ketepatan semu.
- source_word: וְנָתַתָּ עַל
  choice: taruhlah semuanya di atas
  rationale: עַל secara langsung berarti 'di atas'; objek tersirat dari verba dijelaskan sebagai 'semuanya', yakni isi perut dan kaki-kaki yang baru disebut.
- source_word: נְתָחָיו וְעַל רֹאשׁוֹ
  choice: potongan-potongan tubuh dan kepalanya
  rationale: Frasa ini mempertahankan dua sasaran dengan עַל yang berulang, sambil memperjelas bahwa potongan-potongan tersebut adalah bagian tubuh domba.
