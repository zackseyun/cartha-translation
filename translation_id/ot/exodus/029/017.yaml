  - severity: low
    issue: '"Isi perut" berpotensi dipahami secara lebih sempit sebagai isi lambung.'
    rationale: קִרְבּוֹ dalam konteks ini menunjuk pada bagian-bagian dalam; "bagian dalamnya" mempertahankan cakupan leksikal tanpa memaksakan perincian anatomi.
