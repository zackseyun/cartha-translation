  rationale: 'Revisi terbatas pada kelancaran dan ketepatan daya direktif: ''kepada'' menggantikan ''terhadap'', dan ''harus'' dihilangkan agar tidak menambah modalitas eksplisit. Padanan ''menahbiskan'' serta catatan kaki literal tetap mempertahankan makna idiom keimaman tanpa memaksakan pengertian denominasi tertentu.'
