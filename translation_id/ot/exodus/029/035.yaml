  - severity: low
    issue: Preposisi 'terhadap' kurang langsung dalam konteks ini
    rationale: Untuk tindakan yang diperintahkan dilakukan kepada penerima ritual, 'kepada Harun dan anak-anaknya' lebih alami dan lebih dekat dengan nilai datif ל.
