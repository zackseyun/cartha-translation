base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/035.yaml
  text: And you shall do thus for Aaron and for his sons[a], according to all that I have commanded you. Seven days you shall ordain them.
translation:
  language: id
  text: Lakukanlah demikian kepada Harun dan anak-anaknya, sesuai dengan segala yang telah Kuperintahkan kepadamu. Selama tujuh hari engkau menahbiskan mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memenuhi tangan mereka,” sebuah ungkapan Ibrani untuk menahbiskan atau melantik seseorang bagi pelayanan sebagai imam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Lakukanlah
  rationale: Bentuk perfektum dengan waw dalam rangkaian petunjuk ritual berfungsi sebagai perintah. Bentuk imperatif Indonesia menyampaikan daya direktifnya secara wajar.
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: terhadap Harun dan anak-anaknya
  rationale: Preposisi ל menandai orang-orang yang menjadi sasaran tindakan ritual. 'Terhadap' lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'kepada' atau nuansa benefaktif 'bagi'.
- source_word: כָּכָה
  choice: demikian
  rationale: Kata penunjuk ini merujuk kembali kepada tata cara ritual yang telah diperintahkan dan dipertahankan secara ringkas.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתִי אֹתָכָה
  choice: sesuai dengan segala yang telah Kuperintahkan kepadamu
  rationale: Terjemahan ini mempertahankan gagasan kesesuaian dengan seluruh petunjuk sebelumnya; 'Ku-' menandai pembicara ilahi dalam kutipan langsung.
- source_word: שִׁבְעַת יָמִים
  choice: Selama tujuh hari
  rationale: Frasa ini merupakan akusatif durasi. 'Selama' menjelaskan rentang waktu secara alami tanpa mengubah maknanya.
- source_word: תְּמַלֵּא יָדָם
  choice: engkau harus menahbiskan mereka
  rationale: Ungkapan harfiah 'memenuhi tangan mereka' adalah idiom keimaman bagi pelantikan atau pengkhususan ke dalam pelayanan imam. 'Menahbiskan' menyampaikan fungsi ritual-resminya dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan idiom keimaman מלא יד
  choice: menahbiskan mereka
  alternative: memenuhi tangan mereka; melantik mereka; mengkhususkan mereka
  rationale: '''Menahbiskan'' mengungkapkan penetapan resmi Harun dan anak-anaknya ke dalam pelayanan imam tanpa menentukan tata gerejawi dari masa yang lebih kemudian. Bentuk harfiahnya dicatat dalam catatan kaki agar citra dan idiom Ibraninya tetap dapat diaudit.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Imperatif 'Lakukanlah' serta pronomina 'engkau' cocok untuk petunjuk ilahi yang ditujukan kepada satu orang, yaitu Musa. Penanda catatan kaki ditempatkan sesudah frasa yang menerjemahkan idiom Ibrani.
