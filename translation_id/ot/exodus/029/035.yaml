  naturalness: Bahasa draft baku dan jelas. 'Lakukanlah demikian kepada Harun dan anak-anaknya' lebih idiomatis untuk instruksi ritual daripada 'terhadap Harun dan anak-anaknya'. Menghilangkan 'harus' juga membuat paralelisme dua perintah lebih wajar dan ringkas.
  terminology: '''Menahbiskan'' adalah padanan yang tepat dan cukup netral bagi idiom מלא יד dalam konteks pengangkatan Harun dan anak-anaknya untuk tugas imam. Catatan kaki harfiah dipertahankan dan sedikit diperjelas agar ''pelayanan imam'' tidak terdengar sebagai istilah modern yang terlalu longgar.'
