  yaml_path: translation/ot/exodus/029/039.yaml
  text: You shall offer the one lamb in the morning[a], and the second lamb you shall offer between the evenings.
translation:
  language: id
  text: Seekor anak domba harus kaupersembahkan pada pagi hari, dan anak domba yang kedua harus kaupersembahkan pada waktu antara dua petang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “antara dua petang”. Ungkapan Ibrani tradisional ini sering dipahami sebagai waktu senja, tetapi batas waktu tepatnya diperdebatkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֶּבֶשׂ
  choice: anak domba
  rationale: Dalam konteks kurban, kata ini menunjuk pada domba muda yang dipersembahkan; “anak domba” merupakan padanan Indonesia yang alami dan cukup spesifik.
- source_word: הָאֶחָד
  choice: yang satu
  rationale: Mempertahankan arti harfiah “yang satu” dan tetap membentuk pasangan yang jelas dengan “yang kedua”.
- source_word: תַּעֲשֶׂה
  choice: harus kaupersembahkan
  rationale: Walaupun secara dasar berarti “melakukan/membuat”, dalam petunjuk kurban kata ini secara idiomatis berarti melaksanakan persembahan. Bentuk “harus kaupersembahkan” menyampaikan kewajiban dan tindakan ritual dengan jelas.
- source_word: בַבֹּקֶר
  choice: pada pagi hari
  rationale: Padanan temporal yang alami dalam bahasa Indonesia modern.
- source_word: הַשֵּׁנִי
  choice: yang kedua
  rationale: Menyampaikan bilangan urutan secara langsung dan mempertahankan susunan kedua persembahan harian.
- source_word: בֵּין הָעַרְבָּיִם
  choice: di antara kedua petang
  rationale: Ungkapan Ibrani secara harfiah berarti “di antara kedua petang”. Karena batas waktu yang dimaksud diperdebatkan, teks utama mempertahankan bentuk ungkapan itu dan catatan kaki memberi penjelasan idiomatis.
