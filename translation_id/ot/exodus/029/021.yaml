base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/021.yaml
  text: Then you shall take some of the blood that is on the altar and some of the anointing oil[a], and sprinkle it on Aaron and on his garments and on his sons and on the garments of his sons with him; and he and his garments shall be holy, and his sons and the garments of his sons with him.
translation:
  language: id
  text: Kemudian engkau harus mengambil sebagian dari darah yang ada di atas mazbah dan sebagian dari minyak pengurapan, lalu memercikkannya pada Harun, pada pakaiannya, pada putra-putranya, dan pada pakaian putra-putranya bersamanya. Maka ia dan pakaiannya, serta putra-putranya dan pakaian putra-putranya bersamanya, akan menjadi kudus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “akan dikuduskan.” Secara harfiah, bahasa Ibrani berbunyi “akan menjadi kudus,” yang menyatakan status kudus sebagai hasil tindakan ritual tersebut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Kemudian engkau harus mengambil
  rationale: Bentuk perfek dengan waw dalam rangkaian petunjuk ritual menyatakan tindakan berikut yang wajib dilakukan. 'Harus mengambil' menyampaikan daya instruksionalnya secara wajar dalam bahasa Indonesia.
- source_word: מִן הַדָּם אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: sebagian dari darah yang ada di atas mazbah
  rationale: מִן menunjukkan bahwa yang diambil adalah sebagian dari darah tersebut; klausa relatif אֲשֶׁר עַל dipertahankan secara eksplisit.
- source_word: וּמִשֶּׁמֶן הַמִּשְׁחָה
  choice: dan sebagian dari minyak pengurapan
  rationale: מִן yang juga melekat pada unsur kedua menyatakan pengambilan sebagian minyak. 'Minyak pengurapan' adalah padanan alami bagi konstruksi שֶׁמֶן הַמִּשְׁחָה.
- source_word: וְהִזֵּיתָ
  choice: lalu memercikkannya
  rationale: Hifil נזה dalam konteks ritual berarti memercikkan cairan. Akhiran '-nya' merujuk secara kolektif pada darah dan minyak yang baru disebutkan.
- source_word: בְּגָדָיו / בִּגְדֵי בָנָיו
  choice: pakaiannya / pakaian anak-anaknya
  rationale: בגד adalah istilah umum untuk pakaian. 'Pakaian' alami dan jelas serta tidak memasukkan terminologi gerejawi yang lebih kemudian.
- source_word: בָּנָיו
  choice: anak-anaknya
  rationale: Dalam konteks ini kata tersebut menunjuk kepada putra-putra Harun yang ditahbiskan sebagai imam. Bahasa Indonesia lazim memakai 'anak-anaknya'; konteks menentukan bahwa mereka laki-laki.
- source_word: אִתּוֹ
  choice: yang bersama-sama dengannya
  rationale: Frasa ini mempertahankan hubungan anak-anak Harun dan pakaian mereka dengan Harun dalam upacara tersebut.
- source_word: וְקָדַשׁ
  choice: akan menjadi kudus
  rationale: Bentuk ini menyatakan keadaan yang dihasilkan oleh pemercikan ritual. 'Menjadi kudus' mempertahankan akar makna קדשׁ sekaligus memperjelas perubahan status yang dimaksud.
- source_word: הוּא
  choice: ia
  rationale: Pronomina ini kembali menunjuk kepada Harun dan mempertahankan susunan teks Ibrani tanpa menimbulkan ketidakjelasan.
theological_decisions:
- issue: Hasil pengudusan melalui tindakan ritual
  choice: akan menjadi kudus
  alternative: akan ditahbiskan
  rationale: Teks menyatakan hasil tindakan itu dengan akar קדשׁ, yaitu status kudus. 'Menjadi kudus' mempertahankan kategori teologis teks sendiri, sedangkan 'ditahbiskan' lebih teknis dan dapat mempersempit maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Mazbah' dipakai sebagai istilah ringkas yang lazim dalam konteks ritual Perjanjian Lama. Pengulangan unsur-unsur dipertahankan agar cakupan pengudusan atas Harun, anak-anaknya, dan pakaian mereka tetap jelas.
