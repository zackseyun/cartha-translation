  terminology: “Mazbah,” “minyak pengurapan,” “memercikkan,” dan “kudus” sesuai register Alkitab Indonesia dan cukup dekat dengan Ibrani. “Putra-putranya” diperlukan demi ketepatan gender maskulin plural dalam konteks imam.
