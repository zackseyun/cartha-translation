revisions:
- from: Kemudian engkau harus mengambil sebagian dari darah yang ada di atas mazbah dan sebagian dari minyak pengurapan, lalu memercikkannya kepada Harun, pakaiannya, anak-anaknya, dan pakaian anak-anaknya yang bersama-sama dengannya. Maka ia dan pakaiannya, serta anak-anaknya dan pakaian mereka yang bersama-sama dengannya, akan menjadi kudus.[a]
  to: Kemudian engkau harus mengambil sebagian dari darah yang ada di atas mazbah dan sebagian dari minyak pengurapan, lalu memercikkannya pada Harun, pada pakaiannya, pada putra-putranya, dan pada pakaian putra-putranya bersamanya. Maka ia dan pakaiannya, serta putra-putranya dan pakaian putra-putranya bersamanya, akan menjadi kudus.[a]
  rationale: Revisi terbatas pada ketepatan leksikal dan kelancaran bahasa Indonesia. “Putra-putranya” mencerminkan maskulin plural בָּנָיו; “bersamanya” menerjemahkan אִתּוֹ secara langsung pada kedua kemunculannya. Istilah ritual dan nuansa hasil “akan menjadi kudus” dipertahankan, termasuk catatan kaki yang menyajikan alternatif tanpa menggantikan kategori kekudusan dalam teks.
