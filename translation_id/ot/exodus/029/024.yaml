  source_fidelity: Draf dengan tepat mencerminkan urutan perintah, penempatan seluruh bagian kurban pada telapak tangan Harun dan keturunannya, serta tindakan ritual di hadapan Yahweh. Namun, בָּנָיו secara spesifik berarti "putra-putranya," bukan istilah umum "anak-anaknya." Selain itu, "persembahkanlah" sendiri tidak secara jelas menyatakan tindakan נוף (mengunjukkan/mengayunkan secara ritual) yang ditegaskan lagi oleh תְּנוּפָה.
  naturalness: '"Letakkanlah" dan "putra-putranya" adalah bahasa Indonesia modern yang jelas dan sesuai register ritual. "Unjukkanlah ... sebagai persembahan unjukan" mempertahankan istilah ritual yang lazim tanpa mengurangi tindakan yang disebutkan oleh verba Ibrani.'
  terminology: '"Telapak tangan" secara baik mempertahankan kekhususan כַּף. "Persembahan unjukan" cocok untuk תְּנוּפָה, dan "Yahweh" konsisten dengan keputusan terminologis proyek. Catatan kaki ditambahkan pada "telapak tangan" untuk mendokumentasikan kekhususan leksikal Ibrani.'
  issues:
