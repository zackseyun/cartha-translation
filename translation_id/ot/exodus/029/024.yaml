language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/שַׂמְתָּ֣ הַ/כֹּ֔ל עַ֚ל כַּפֵּ֣י אַהֲרֹ֔ן וְ/עַ֖ל כַּפֵּ֣י בָנָ֑י/ו וְ/הֵנַפְתָּ֥ אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/024.yaml
  text: You shall put all of it on the palms of Aaron and on the palms of his sons[a], and you shall wave them as a wave offering before Yahweh.
translation:
  language: id
  text: Letakkanlah semuanya itu di atas telapak tangan[a] Harun dan di atas telapak tangan putra-putranya, lalu unjukkanlah semuanya itu sebagai persembahan unjukan di hadapan Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, "di atas telapak tangan Harun dan di atas telapak tangan putra-putranya." Kata Ibrani ini dapat berarti "tangan," tetapi secara khusus menunjuk pada telapak tangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Taruhlah
  rationale: Bentuk perfektum Qal berkonjungsi dalam rangkaian petunjuk berfungsi sebagai perintah. 'Taruhlah' alami dan tepat untuk tindakan menempatkan bagian-bagian kurban.
- source_word: הַכֹּל
  choice: semuanya itu
  rationale: Merujuk kembali kepada seluruh bagian yang disebut dalam konteks sebelumnya; 'itu' memperjelas rujukan tersebut.
- source_word: עַל כַּפֵּי
  choice: di atas telapak tangan
  rationale: כַּף menunjuk secara khusus pada telapak tangan; pilihan ini mempertahankan gambaran konkret tindakan ritual.
- source_word: אַהֲרֹן
  choice: Harun
  rationale: Bentuk nama yang baku dalam Alkitab bahasa Indonesia.
- source_word: בָנָיו
  choice: anak-anaknya
  rationale: Dalam konteks ini yang dimaksud adalah putra-putra Harun yang ditahbiskan. Bahasa Indonesia lazim memakai 'anak-anaknya' tanpa kehilangan acuan kontekstual kepada laki-laki.
- source_word: וְהֵנַפְתָּ
  choice: lalu persembahkanlah
  rationale: Bentuk Hifil dari נוף dalam konteks kurban menyatakan tindakan ritual mengunjukkan atau mempersembahkan dengan gerakan tertentu. Kata kerja ini dibaca bersama תְּנוּפָה.
- source_word: אֹתָם
  choice: semuanya
  rationale: Pronomina objek jamak maskulin mengacu kepada berbagai bagian kurban. 'Semuanya' menjaga jumlah jamak dan menghasilkan kalimat Indonesia yang alami.
- source_word: תְּנוּפָה
  choice: sebagai persembahan unjukan
  rationale: '''Persembahan unjukan'' merupakan istilah kultis Indonesia yang mempertahankan gagasan tindakan ritual נוף tanpa menyiratkan bahwa tindakan itu sekadar melambaikan benda.'
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: '''Di hadapan'' merupakan padanan alami bagi לִפְנֵי dalam konteks ritual, sedangkan nama ilahi ditransliterasikan sebagai ''Yahweh''.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Makna ritual נוף / תְּנוּפָה
  choice: persembahkanlah semuanya sebagai persembahan unjukan
  alternative: unjukkanlah semuanya sebagai persembahan unjukan; ayunkanlah semuanya sebagai persembahan ayunan
  rationale: Ungkapan ini mempertahankan kategori persembahan ritual dan tidak menentukan secara berlebihan bentuk geraknya, yang tidak dijelaskan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Bentuk imperatif dipakai untuk mencerminkan fungsi perintah dalam rangkaian petunjuk. Istilah ritual 'persembahan unjukan' dipertahankan karena cukup dikenal dan lebih tepat daripada ungkapan harfiah yang dapat terdengar seperti gerakan biasa.
