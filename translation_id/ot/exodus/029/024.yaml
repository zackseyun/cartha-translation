  to: Letakkanlah semuanya itu di atas telapak tangan[a] Harun dan di atas telapak tangan putra-putranya, lalu unjukkanlah semuanya itu sebagai persembahan unjukan di hadapan Yahweh.
  rationale: Revisi mengganti istilah umum "anak-anaknya" dengan "putra-putranya" untuk mencerminkan jenis kelamin yang dinyatakan teks Ibrani. Verba "unjukkanlah" menggantikan "persembahkanlah" supaya tindakan נוף tetap diterjemahkan, sementara "persembahan unjukan" mempertahankan תְּנוּפָה. Catatan kaki menandai dan menjelaskan pilihan "telapak tangan."
