    rationale: Dalam konteks penahbisan imam dan secara leksikal, בָּנָיו berarti "putra-putranya". Istilah "anak-anak" dapat mencakup anak perempuan dan karena itu kurang tepat.
  - severity: medium
    issue: '"lalu persembahkanlah" tidak secara eksplisit menerjemahkan tindakan ritual וְהֵנַפְתָּ.'
    rationale: Verba Hifil נוף menyebut tindakan pengunjukan/pengayunan ritual, bukan sekadar mempersembahkan. Padanan eksplisit diperlukan agar tindakan dan kategori persembahan (תְּנוּפָה) keduanya tetap terlihat.
