  text: You shall slaughter the bull before Yahweh at the entrance of the tent of meeting[a].
translation:
  language: id
  text: Lalu sembelihlah lembu jantan itu di hadapan Yahweh, di pintu masuk Kemah Pertemuan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, nama ini ditulis יהוה (YHWH); secara tradisional diterjemahkan “TUHAN”. Nama ini juga dialihaksarakan “Yahweh” atau “Yehuwa”.
    reason: Menjelaskan ejaan nama ilahi dalam teks sumber, transliterasinya, dan tradisi penerjemahannya secara netral.
lexical_decisions:
- source_word: וְשָׁחַטְתָּ
  choice: Lalu sembelihlah
  rationale: Bentuk Qal perfektum dengan waw dalam rangkaian petunjuk menyatakan tindakan berikut yang diperintahkan. “Sembelihlah” tepat untuk konteks kurban, sedangkan “lalu” mempertahankan hubungan berurutan dengan ayat sebelumnya.
- source_word: הַפָּר
  choice: lembu jantan itu
  rationale: פַּר menunjuk pada lembu jantan, khususnya dalam konteks persembahan. Kata penentu Ibrani diwujudkan secara alami dengan “itu”, merujuk pada lembu yang telah disebutkan.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי secara harfiah berarti “di hadapan/di depan” dan di sini menyatakan tindakan yang dilakukan dalam hadirat ilahi. Nama diri יהוה dipertahankan sebagai “Yahweh”.
- source_word: פֶּתַח
  choice: di pintu masuk
  rationale: פֶּתַח berarti bukaan atau jalan masuk. “Di pintu masuk” alami dalam bahasa Indonesia dan tepat untuk lokasi ritual yang dimaksud.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Ungkapan ini merupakan nama tempat kudus tempat Yahweh bertemu dengan umat-Nya atau wakil mereka. “Kemah Pertemuan” jelas, ringkas, dan sudah dikenal dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri ilahi. “Yahweh” mempertahankan nama tersebut alih-alih menggantinya dengan gelar, sementara catatan kaki memberi tahu pembaca tentang bentuk Ibrani dan tradisi penerjemahannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk imperatif “sembelihlah” menyampaikan petunjuk ritual secara langsung; “lalu” menjaga kesinambungan urutan tindakan. Kapitalisasi “Kemah Pertemuan” menandai sebutan khusus bagi tempat kudus.
