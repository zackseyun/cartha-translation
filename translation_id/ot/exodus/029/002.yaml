  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לֶ֣חֶם מַצּ֗וֹת וְ/חַלֹּ֤ת מַצֹּת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֣ים בַּ/שָּׁ֑מֶן סֹ֥לֶת חִטִּ֖ים תַּעֲשֶׂ֥ה אֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/002.yaml
  text: and unleavened bread[a], and unleavened cakes mixed with oil, and unleavened wafers spread with oil[b]; you shall make them of fine wheat flour.
translation:
  language: id
  text: juga roti tidak beragi, roti bundar tidak beragi[a] yang dicampur dengan minyak, dan roti tipis tidak beragi yang diolesi minyak[b]. Semuanya harus kaubuat dari tepung gandum halus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roti tidak beragi”; kata Ibrani ini dapat menunjuk pada sebentuk roti, kemungkinan roti bundar.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “diurapi dengan minyak”; dalam konteks ini, kata kerja yang lazim berarti “mengurapi” menjelaskan cara minyak dibubuhkan pada roti tipis itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם מַצּוֹת
  choice: roti tidak beragi
  rationale: Ungkapan ini menunjuk pada roti yang dibuat tanpa ragi; padanan ini alami dalam bahasa Indonesia dan mempertahankan kekhususan ritualnya.
- source_word: חַלֹּת מַצֹּת
  choice: roti bundar tidak beragi
  rationale: חַלָּה dapat menunjuk pada roti atau kue roti, kemungkinan berbentuk bundar. 'Roti bundar' membedakannya dari istilah umum לֶחֶם dan dari roti tipis yang disebut sesudahnya tanpa memberi kesan kue manis modern.
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: yang dicampur dengan minyak
  rationale: Partisipel pasif dari בלל menyatakan bahan yang dibaur atau dicampur; ungkapan ini jelas dan wajar dalam petunjuk pengolahan makanan.
- source_word: רְקִיקֵי מַצּוֹת
  choice: roti tipis tidak beragi
  rationale: רָקִיק adalah roti atau penganan tipis. 'Roti tipis' mempertahankan perbedaannya dari חַלּוֹת dan lebih mudah dipahami daripada istilah teknis yang tidak umum.
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: yang diolesi minyak
  rationale: משׁח biasanya berarti 'mengurapi', tetapi dalam konteks pengolahan roti tipis tindakan konkretnya ialah mengoleskan minyak. Pilihan ini alami sambil mencatat arti harfiahnya dalam catatan kaki.
- source_word: סֹלֶת חִטִּים
  choice: tepung gandum halus
  rationale: סֹלֶת berarti tepung halus dan חִטִּים menentukan jenis biji-bijiannya sebagai gandum.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: Semuanya harus kaubuat
  rationale: Bentuk imperfek dalam petunjuk ritual ini bersifat preskriptif. Pronomina jamak merujuk kepada seluruh jenis roti yang baru disebutkan.
theological_decisions: []
