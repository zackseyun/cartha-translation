  register: Bahasa Indonesia baku modern dengan gaya petunjuk ritual yang lugas dan bermartabat. 'Roti bundar' dipilih alih-alih 'kue' agar tidak menimbulkan bayangan penganan manis modern; 'kaubuat' mempertahankan sapaan orang kedua tunggal dari bahasa Ibrani.
