base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/020.yaml
  text: Then you shall slaughter the ram[a], and take some of its blood and put it on the lobe of Aaron’s right ear, and on the lobe of the right ear of his sons, and on the thumb of their right hand, and on the big toe of their right foot[b]; and you shall throw the blood against the altar all around.
translation:
  language: id
  text: Lalu sembelihlah domba jantan itu, ambillah sebagian darahnya dan bubuhkanlah pada cuping telinga kanan Harun, pada cuping telinga kanan anak-anaknya, pada ibu jari tangan kanan mereka, dan pada ibu jari kaki kanan mereka. Kemudian percikkanlah darah itu pada mezbah, pada sekelilingnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “cipratkanlah darah itu pada mezbah, pada sekelilingnya.” Kata Ibrani ini menunjuk pada penerapan darah secara kuat dalam ritual, bukan percikan ringan.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁחַט
  choice: menyembelih
  rationale: Dalam konteks kurban, kata ini secara tepat menyatakan pembunuhan hewan dengan penyembelihan, bukan sekadar membunuh.
- source_word: אַיִל
  choice: domba jantan
  rationale: Padanan Indonesia yang jelas dan lazim untuk hewan kurban jantan yang dimaksud.
- source_word: מִדָּמוֹ
  choice: sebagian darahnya
  rationale: Preposisi מִן di sini menunjukkan bahwa sebagian dari darah hewan itu diambil untuk dibubuhkan.
- source_word: תְּנוּךְ אֹזֶן
  choice: cuping telinga
  rationale: Dalam konteks ritual keimaman, istilah ini kemungkinan besar menunjuk pada cuping telinga, meskipun dapat dipahami lebih umum sebagai bagian ujung telinga.
- source_word: הַיְמָנִית
  choice: kanan
  rationale: Kata sifat ini menentukan anggota tubuh sebelah kanan dan secara alami diletakkan sesudah nomina dalam bahasa Indonesia.
- source_word: בֹּהֶן יָד
  choice: ibu jari tangan
  rationale: בֹּהֶן pada tangan secara khusus berarti ibu jari.
- source_word: בֹּהֶן רֶגֶל
  choice: ibu jari kaki
  rationale: בֹּהֶן pada kaki menunjuk pada jari kaki terbesar; 'ibu jari kaki' merupakan padanan Indonesia yang jelas.
- source_word: זָרַק
  choice: menyiramkan ... ke
  rationale: Dalam tata cara kurban, verba ini menyatakan penerapan darah secara kuat pada mezbah, bukan pemercikan ringan; 'menyiramkan ... ke' terdengar alami dalam bahasa Indonesia sambil mempertahankan daya tindakannya.
- source_word: סָבִיב
  choice: ke sekeliling
  rationale: Ungkapan ini menunjukkan bahwa darah diterapkan mengitari sisi-sisi mezbah.
- source_word: וְ
  choice: Lalu / dan / Kemudian
  rationale: Rangkaian waw memajukan urutan tindakan ritual; variasi penghubung ini menghasilkan bahasa Indonesia yang alami tanpa mengaburkan urutannya.
