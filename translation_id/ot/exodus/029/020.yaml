translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'engkau harus' mempertahankan perintah langsung kepada Musa; repetisi anggota tubuh dipadatkan secara wajar tanpa menghilangkan rujukan kepada Harun dan anak-anaknya. Penanda catatan kaki [a] dicantumkan pada klausa yang dijelaskannya.
