review_pass:
  verdict: revise
  source_fidelity: Perlu revisi kecil. Teks Ibrani memerintahkan darah itu "dilemparkan/dicipratkan pada mezbah sekelilingnya" (עַל ... סָבִיב), bukan terutama "disiramkan ... ke sekeliling mezbah," yang dalam bahasa Indonesia dapat berarti darah dicurahkan ke tanah di sekitar mezbah. Rincian penerapan pada telinga, ibu jari tangan, dan ibu jari kaki telah dipertahankan dengan baik.
  naturalness: Bahasa umumnya baku dan jelas. "Membubuhkan" cocok dalam register ritual. "Engkau harus" dapat dipahami, tetapi bentuk perintah "sembelihlah/ambillah/bubuhkanlah" lebih langsung dan alami untuk instruksi ritual Alkitabiah dalam bahasa Indonesia modern.
  terminology: '"Domba jantan," "cuping telinga," "ibu jari tangan," "ibu jari kaki," dan "mezbah" tepat. Untuk זָרַק, "percikkanlah ... pada mezbah, pada sekelilingnya" menyampaikan aplikasi ritual yang kuat tanpa mengesankan penyiraman biasa atau mengubah lokasi aplikasi.'
  issues:
  - severity: medium
    issue: Lokasi tindakan זָרַק kurang tepat dalam "menyiramkan darah itu ke sekeliling mezbah."
    rationale: Frasa עַל־הַמִּזְבֵּחַ סָבִיב menyatakan darah diaplikasikan pada mezbah, mengelilingi sisi-sisinya. Terjemahan "ke sekeliling mezbah" berpotensi mengalihkan sasaran ke area di luar mezbah.
  - severity: low
    issue: Catatan kaki alternatif tidak mempertahankan secara jelas sasaran "pada mezbah" dalam teks utama.
    rationale: Catatan dapat dibuat lebih ringkas dan tepat dengan menyatakan alternatif "mencipratkan darah itu pada mezbah, pada sekelilingnya," serta menjelaskan daya verba Ibrani.
