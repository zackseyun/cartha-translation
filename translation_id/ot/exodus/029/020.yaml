revisions:
- from: Lalu engkau harus menyembelih domba jantan itu, mengambil sebagian darahnya, dan membubuhkannya pada cuping telinga kanan Harun serta pada cuping telinga kanan anak-anaknya, pada ibu jari tangan kanan mereka, dan pada ibu jari kaki kanan mereka. Kemudian engkau harus menyiramkan darah itu ke sekeliling mezbah.[a]
  to: Lalu sembelihlah domba jantan itu, ambillah sebagian darahnya dan bubuhkanlah pada cuping telinga kanan Harun, pada cuping telinga kanan anak-anaknya, pada ibu jari tangan kanan mereka, dan pada ibu jari kaki kanan mereka. Kemudian percikkanlah darah itu pada mezbah, pada sekelilingnya.[a]
  rationale: Revisi membetulkan sasaran spasial tindakan terakhir agar darah diterapkan pada mezbah di sekeliling sisi-sisinya, sesuai teks Ibrani. Bentuk imperatif langsung juga lebih selaras dengan rangkaian perintah sumber dan tetap alami dalam bahasa Indonesia baku. Tidak ada perubahan makna pada unsur ritual lainnya.
