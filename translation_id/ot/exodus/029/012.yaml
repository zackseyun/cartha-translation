base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/012.yaml
  text: And you shall take some of the blood of the bull and put it on the horns of the altar with your finger[c][b][a], and you shall pour out all the blood at the base of the altar.
translation:
  language: id
  text: Lalu ambillah sebagian dari darah lembu jantan itu dan bubuhkanlah pada tanduk-tanduk mezbah dengan jarimu,[a] kemudian curahkanlah seluruh darah itu ke dasar mezbah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tanduk-tanduk ialah tonjolan berbentuk tanduk pada sudut-sudut mezbah.
    reason: cultural_note
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Lalu ambillah
  rationale: Bentuk perfektum Qal dengan waw dalam rangkaian petunjuk berfungsi sebagai perintah berurutan. 'Lalu ambillah' menyampaikan urutan tindakan secara alami dalam bahasa Indonesia.
- source_word: מִדַּם הַפָּר
  choice: sebagian dari darah lembu jantan itu
  rationale: 'Preposisi מִן bersifat partitif dalam konteks ini: hanya sebagian darah diambil untuk dibubuhkan pada mezbah. הַפָּר menunjuk kepada lembu jantan yang sudah disebut.'
- source_word: וְנָתַתָּה
  choice: dan bubuhkanlah
  rationale: נתן secara luas berarti 'memberi/menaruh', tetapi dalam konteks darah yang dikenakan pada bagian mezbah, 'bubuhkanlah' alami dan tetap menggambarkan tindakan konkret tanpa menjadikannya istilah teknis.
- source_word: עַל קַרְנֹת הַמִּזְבֵּחַ
  choice: pada tanduk-tanduk mezbah
  rationale: Istilah konkret 'tanduk-tanduk' dipertahankan untuk tonjolan berbentuk tanduk pada sudut-sudut mezbah.
- source_word: בְּאֶצְבָּעֶךָ
  choice: dengan jarimu
  rationale: Preposisi בְּ menyatakan alat atau sarana; terjemahan ini jelas dan alami.
- source_word: וְאֶת כָּל הַדָּם תִּשְׁפֹּךְ
  choice: kemudian curahkanlah seluruh darah yang tersisa
  rationale: שׁפך berarti 'mencurahkan'. Karena sebagian darah baru saja diambil dan dibubuhkan, 'yang tersisa' menyatakan rujukan kontekstual dari 'seluruh darah' tanpa menimbulkan kesan bahwa darah yang telah dibubuhkan juga dicurahkan.
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: pada dasar mezbah
  rationale: יְסוֹד menunjuk kepada dasar atau fondasi. אֶל dapat berarti arah menuju atau sampai pada; 'pada' alami untuk tindakan mencurahkan darah ke bagian dasar mezbah, sementara alternatif yang lebih harfiah dicatat.
theological_decisions:
- issue: Kekhususan istilah ritual pada mezbah
  choice: Mempertahankan istilah konkret 'tanduk-tanduk' dan 'dasar'
  alternative: sudut-sudut mezbah; kaki mezbah
  rationale: Ayat ini menjelaskan tindakan ritus secara tepat. Istilah fisik tersebut mempertahankan tekstur sistem kurban tanpa memasukkan penafsiran doktrinal kemudian.
- issue: Cakupan frasa 'seluruh darah' setelah sebagian darah digunakan
  choice: seluruh darah yang tersisa
  alternative: seluruh darah
  rationale: Secara pragmatis, כָּל הַדָּם merujuk kepada darah yang masih ada setelah sebagian diambil. Penjelasan eksplisit dalam teks sasaran mencegah kontradiksi tindakan, tanpa mengubah urutan atau makna ritus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada perintah ritual yang lugas dan bermartabat. 'Mezbah' dipertahankan sebagai istilah Alkitab yang mapan; bentuk pronomina tunggal '-mu' mengikuti sapaan Ibrani kepada Musa.
