  naturalness: Terjemahan yang direvisi tetap memakai bahasa Indonesia baku, lugas, dan sesuai register instruksi ritual. "Curahkanlah seluruh darah itu ke dasar mezbah" lebih alami sekaligus mencerminkan arah tindakan.
  terminology: '"Lembu jantan," "tanduk-tanduk mezbah," dan "dasar mezbah" mempertahankan istilah ritual yang konkret. Catatan tentang tanduk mezbah berguna dan tepat.'
