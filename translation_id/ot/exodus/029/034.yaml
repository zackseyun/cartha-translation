  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְֽ/אִם יִוָּתֵ֞ר מִ/בְּשַׂ֧ר הַ/מִּלֻּאִ֛ים וּ/מִן הַ/לֶּ֖חֶם עַד הַ/בֹּ֑קֶר וְ/שָׂרַפְתָּ֤ אֶת הַ/נּוֹתָר֙ בָּ/אֵ֔שׁ לֹ֥א יֵאָכֵ֖ל כִּי קֹ֥דֶשׁ הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/034.yaml
  text: And if any of the flesh of the ordination offering or any of the bread is left until the morning[a], then you shall burn what is left with fire. It shall not be eaten, because it is holy.
translation:
  language: id
  text: Jika sebagian dari daging persembahan pentahbisan[a] atau dari roti itu masih tersisa sampai pagi, bakarlah apa yang tersisa itu dalam api. Itu tidak boleh dimakan karena kudus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “persembahan pelantikan”. Istilah Ibraninya menunjuk pada ritus penetapan imam dalam jabatannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִוָּתֵר
  choice: masih tersisa
  rationale: Bentuk nifal dari יתר menyatakan sesuatu yang tetap ada atau tertinggal; “masih tersisa” alami dalam bahasa Indonesia dan mempertahankan nuansa pasif-resultatifnya.
- source_word: בְּשַׂר
  choice: daging
  rationale: Dalam konteks kurban, “daging” merupakan padanan Indonesia yang konkret dan alami bagi בָּשָׂר.
- source_word: הַמִּלֻּאִים
  choice: persembahan pentahbisan
  rationale: Dalam konteks imamat, istilah ini menunjuk pada ritus pelantikan atau pentahbisan imam. Kata “persembahan” disertakan berdasarkan konteks, karena yang dimaksud ialah daging dari kurban dalam ritus tersebut.
- source_word: לֶּחֶם
  choice: roti
  rationale: Padanan langsung dan lazim.
- source_word: עַד הַבֹּקֶר
  choice: sampai pagi
  rationale: Mempertahankan batas waktu yang dinyatakan oleh עַד.
- source_word: וְשָׂרַפְתָּ
  choice: bakarlah
  rationale: Dalam rangkaian syarat dan akibat, bentuk ini menyampaikan perintah yang harus dilakukan jika ada sisa; bentuk “bakarlah” ringkas, jelas, dan sesuai dengan ragam hukum.
- source_word: הַנּוֹתָר
  choice: apa yang tersisa itu
  rationale: Partisip yang disubstantifkan merujuk secara menyeluruh kepada sisa daging atau roti yang disebut sebelumnya.
- source_word: בָּאֵשׁ
  choice: dalam api
  rationale: Padanan ini mempertahankan penyebutan api secara eksplisit dan menghasilkan ungkapan Indonesia yang alami.
- source_word: לֹא יֵאָכֵל
  choice: tidak boleh dimakan
  rationale: Bentuk pasif imperfek berfungsi sebagai larangan; “tidak boleh dimakan” mempertahankan bentuk pasif sekaligus menyatakan daya larang dengan jelas.
- source_word: קֹדֶשׁ
  choice: kudus
  rationale: “Kudus” mempertahankan bobot ritual dan teologis istilah קֹדֶשׁ dalam konteks persembahan.
theological_decisions:
- issue: Pemadanan istilah kultis הַמִּלֻּאִים dalam konteks pelantikan imam
  choice: persembahan pentahbisan
  alternative: persembahan pelantikan
  rationale: Istilah Ibrani ini berkaitan dengan ritus penetapan imam dalam jabatannya. “Pentahbisan” jelas dan lazim dalam bahasa Indonesia, sedangkan “pelantikan” juga mungkin dan menonjolkan aspek pemasangan dalam jabatan. Catatan kaki mempertahankan alternatif itu tanpa menetapkan pengertian denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan pola syarat-perintah dari teks Ibrani. Penanda catatan kaki ditempatkan langsung setelah istilah yang dijelaskannya.
