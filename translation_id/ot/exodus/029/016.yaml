  text: And you shall slaughter the ram, and take its blood and throw it against the altar all around.
translation:
  language: id
  text: Sembelihlah domba jantan itu, ambillah darahnya, lalu percikkanlah darah itu pada semua sisi mezbah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁחַטְתָּ
  choice: Sembelihlah
  rationale: Dalam konteks kurban, שׁחט berarti menyembelih; bentuk וְקָטַל dalam rangkaian perintah diterjemahkan sebagai imperatif alami dalam bahasa Indonesia.
- source_word: הָאָיִל
  choice: domba jantan itu
  rationale: אַיִל menunjuk pada domba jantan dewasa, dan artikelnya dipertahankan dengan kata penunjuk 'itu'.
- source_word: וְזָרַקְתָּ
  choice: lalu siramkanlah
  rationale: זרק secara harfiah menggambarkan tindakan melemparkan atau menghamburkan, tetapi ketika objeknya darah dalam ritual mezbah, 'siramkanlah' menyampaikan tindakan mengayunkan atau mencurahkan darah ke permukaan mezbah tanpa ungkapan Indonesia yang janggal seperti 'melemparkan darah'.
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: pada mezbah di sekelilingnya
  rationale: עַל menunjukkan bahwa darah dikenakan pada mezbah, sedangkan סָבִיב menerangkan penyebarannya mengelilingi mezbah, bukan sekadar ditumpahkan ke tanah di sekitarnya.
theological_decisions:
- issue: Cara penerapan darah pada mezbah
  choice: siramkanlah darah itu pada mezbah di sekelilingnya
  alternative: percikkanlah darah itu pada mezbah di sekelilingnya
  rationale: '''Siramkanlah'' mempertahankan kekuatan tindakan זרק dan tidak mempersempitnya menjadi percikan halus; rumusan ini juga menjaga bahwa darah mengenai mezbah pada semua sisinya.'
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bernada ritual yang wajar. Rangkaian tiga tindakan dibuat sebagai perintah langsung dengan 'lalu' untuk memperjelas urutan tanpa menambah isi.
