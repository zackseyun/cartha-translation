lexical_decisions:
- source_word: וְ/זֶה אֲשֶׁר
  choice: Inilah yang
  rationale: Menyampaikan konstruksi pengantar Ibrani secara wajar dalam bahasa Indonesia tanpa menambahkan penanda waktu yang tidak tersurat.
- source_word: תַּעֲשֶׂה
  choice: harus kaupersembahkan
  rationale: Secara leksikal berarti 'melakukan/membuat', tetapi dalam konteks korban di atas mazbah menunjuk pada tindakan mempersembahkan; modal 'harus' menyampaikan daya instruksional bentuk imperfek.
- source_word: עַל הַמִּזְבֵּחַ
  choice: di atas mazbah
  rationale: Padanan langsung dan lazim untuk lokasi tindakan persembahan pada mezbah korban; 'mazbah' dipilih sebagai istilah Alkitabiah Indonesia yang ringkas dan dikenal.
- source_word: כְּבָשִׂים
  choice: anak domba
  rationale: Menunjuk pada domba muda; spesifikasi umurnya dinyatakan oleh frasa berikutnya.
- source_word: בְּנֵי שָׁנָה
  choice: berumur satu tahun
  rationale: Padanan idiomatis dari ungkapan harfiah 'anak-anak satu tahun' yang mempertahankan ketentuan umur korban.
- source_word: שְׁנַיִם
  choice: dua ekor
  rationale: Numeralia diterjemahkan langsung dengan penggolong alami untuk hewan dalam bahasa Indonesia.
- source_word: לַיּוֹם
  choice: setiap hari
  rationale: Menyampaikan makna distributif, yakni dua anak domba untuk tiap-tiap hari.
- source_word: תָּמִיד
  choice: secara tetap
  rationale: Dalam konteks ibadah, kata ini menunjuk pada pelaksanaan teratur dan berkelanjutan, bukan tindakan tanpa henti secara harfiah.
