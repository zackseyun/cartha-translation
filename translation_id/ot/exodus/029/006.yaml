  text: And you shall place the turban on his head[a], and put the holy diadem on the turban.
translation:
  language: id
  text: Pasangkanlah serban itu di kepalanya, lalu pasanglah mahkota kudus[a] pada serban itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "diadem kudus." Kata Ibrani nezer dapat menunjuk pada mahkota atau lambang seperti diadem yang menandakan pengkhususan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Kenakanlah
  rationale: Verba שׂים berarti menaruh atau memasang. Karena objeknya serban yang dikenakan pada kepala dalam tata upacara, 'kenakanlah' merupakan ungkapan Indonesia yang alami dan tetap menyampaikan tindakan penempatan.
- source_word: הַמִּצְנֶפֶת
  choice: serban itu
  rationale: מִצְנֶפֶת menunjuk pada penutup kepala imam berupa lilitan kain. 'Serban' jelas bagi pembaca modern dan tidak membawa asosiasi gerejawi yang dapat timbul dari istilah tradisional tertentu.
- source_word: עַל רֹאשׁוֹ
  choice: pada kepalanya
  rationale: Terjemahan langsung dan alami untuk frasa tempat עַל רֹאשׁוֹ.
- source_word: וְנָתַתָּ
  choice: lalu pasanglah
  rationale: נתן dalam konteks ini berarti menaruh atau memasang benda pada serban. 'Pasanglah' menyatakan penempatan yang terarah, sedangkan 'lalu' memperlihatkan urutan instruksi.
- source_word: אֵת
  choice: '[tidak diterjemahkan secara terpisah]'
  rationale: Penanda objek langsung bahasa Ibrani ini tidak memiliki padanan tersendiri dalam bahasa Indonesia.
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: jamang kudus
  rationale: נֵזֶר dapat menunjuk pada lambang kepala seperti mahkota atau diadem yang menandakan pengkhususan. 'Jamang' menggambarkan perhiasan yang dikenakan pada bagian depan kepala dan membantu membedakannya dari mahkota kerajaan penuh; הַקֹּדֶשׁ diterjemahkan secara atributif sebagai 'kudus'.
- source_word: עַל הַמִּצְנֶפֶת
  choice: pada serban itu
  rationale: Preposisi עַל dipertahankan sebagai 'pada' untuk menunjukkan bahwa jamang tersebut dipasang pada serban.
