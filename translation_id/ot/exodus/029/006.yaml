translation_notes:
  register: Bahasa Indonesia modern yang lugas dan khidmat. Bentuk imperatif dipakai secara alami untuk rangkaian petunjuk upacara. 'Jamang' dipilih sebagai istilah ringkas untuk hiasan kepala sakral, dengan alternatif 'mahkota' dicatat karena cakupan makna נֵזֶר.
