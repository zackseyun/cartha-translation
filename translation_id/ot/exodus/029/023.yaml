  text: וְ/כִכַּ֨ר לֶ֜חֶם אַחַ֗ת וַֽ/חַלַּ֨ת לֶ֥חֶם שֶׁ֛מֶן אַחַ֖ת וְ/רָקִ֣יק אֶחָ֑ד מִ/סַּל֙ הַ/מַּצּ֔וֹת אֲשֶׁ֖ר לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/023.yaml
  text: and one loaf of bread[a], one cake of bread with oil, and one wafer, from the basket of unleavened bread that is before Yahweh.
translation:
  language: id
  text: dan satu roti bundar, satu kue roti dengan minyak, serta satu roti tipis, dari bakul roti tidak beragi yang ada di hadapan Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּכַּר לֶחֶם
  choice: roti bundar
  rationale: כִּכָּר menunjuk pada bentuk bundar; pilihan ini membedakannya dari חַלָּה berikutnya tanpa menambahkan gagasan yang tidak ada dalam teks.
- source_word: אַחַת / אֶחָד
  choice: satu
  rationale: Bilangan kardinal diulang pada ketiga jenis roti untuk mempertahankan ketepatan daftar ritual.
- source_word: חַלַּת לֶחֶם שֶׁמֶן
  choice: roti dengan minyak
  rationale: Ungkapan Ibrani secara harfiah menghubungkan roti dengan minyak, tetapi tidak menyatakan secara eksplisit apakah minyak dicampurkan atau dioleskan; terjemahan ini mempertahankan ketaksaan tersebut.
- source_word: רָקִיק
  choice: roti tipis
  rationale: רָקִיק adalah roti atau kue tipis; 'roti tipis' lebih jelas dan alami bagi pembaca Indonesia daripada istilah serapan yang dapat memberi kesan pangan modern tertentu.
- source_word: מִסַּל הַמַּצּוֹת
  choice: dari bakul roti tidak beragi
  rationale: מִן menyatakan asal, סַל berarti bakul, dan מַצּוֹת dipahami secara kolektif sebagai roti tidak beragi.
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: yang ada di hadapan Yahweh
  rationale: לִפְנֵי mempertahankan makna ruang dan kehadiran kultis, sedangkan verba 'ada' disediakan secara wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks sumber ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memuat Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan fungsi nama itu tanpa menggantinya dengan gelar.
- issue: Cara minyak terkait dengan roti חַלַּת לֶחֶם שֶׁמֶן
  choice: dengan minyak
  alternative: dicampur dengan minyak atau diolesi minyak
  rationale: Teks ayat ini tidak menyebut proses pembuatannya secara eksplisit; rumusan netral menjaga ambiguitas sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan daftar dipertahankan, tetapi konjungsi disesuaikan agar alami. Tidak ada catatan kaki karena tidak diperlukan untuk menjelaskan teks ini.
