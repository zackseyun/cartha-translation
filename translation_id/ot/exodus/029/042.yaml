  text: עֹלַ֤ת תָּמִיד֙ לְ/דֹרֹ֣תֵי/כֶ֔ם פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד לִ/פְנֵ֣י יְהוָ֑ה אֲשֶׁ֨ר אִוָּעֵ֤ד לָ/כֶם֙ שָׁ֔מָּ/ה לְ/דַבֵּ֥ר אֵלֶ֖י/ךָ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/042.yaml
  text: It shall be a regular burnt offering throughout your generations at the entrance of the tent of meeting before Yahweh[a], where I will meet with you[b], to speak to you there.
translation:
  language: id
  text: Kurban bakaran itu harus dipersembahkan secara teratur[a] turun-temurun di pintu masuk Kemah Pertemuan, di hadapan Yahweh. Di sanalah Aku akan bertemu dengan kalian[b] untuk berbicara kepadamu di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebagai kurban bakaran yang tetap” atau “sebagai kurban bakaran yang terus-menerus.”
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani beralih dari bentuk jamak dalam “dengan kalian” kepada bentuk tunggal dalam “kepadamu.” Bentuk tunggal itu kemungkinan ditujukan secara khusus kepada Musa.
    reason: source_ambiguity
lexical_decisions:
- source_word: עֹלַת תָּמִיד
  choice: kurban bakaran ... dipersembahkan secara teratur
  rationale: עֹלָה adalah istilah baku untuk kurban yang dibakar seluruhnya, sedangkan תָּמִיד menunjukkan pelaksanaan yang tetap dan berulang menurut ketetapan. Ungkapan ini alami dalam bahasa Indonesia dan tidak menyiratkan bahwa tindakan membakar berlangsung tanpa henti.
- source_word: לְדֹרֹתֵיכֶם
  choice: turun-temurun
  rationale: Ungkapan ini menyatakan keberlakuan bagi generasi-generasi berikutnya; 'turun-temurun' menyampaikan makna tersebut secara ringkas dan wajar.
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: di pintu masuk Kemah Pertemuan
  rationale: פֶּתַח menunjuk pada jalan masuk atau bukaan, dan אֹהֶל מוֹעֵד adalah kemah tempat pertemuan yang ditetapkan dengan Allah.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי dalam konteks tempat ibadah berarti berada di hadapan atau dalam hadirat; nama perjanjian יהוה dipertahankan sebagai 'Yahweh'.
- source_word: אֲשֶׁר אִוָּעֵד לָכֶם שָׁמָּה
  choice: Di sanalah Aku akan bertemu dengan kalian
  rationale: Bentuk Nifal dari יעד menyatakan pertemuan yang ditetapkan. 'Di sanalah' mempertahankan penekanan tempat dari שָׁמָּה, dan 'kalian' mempertahankan bentuk jamak לָכֶם.
- source_word: לְדַבֵּר אֵלֶיךָ שָׁם
  choice: untuk berbicara kepadamu
  rationale: Infinitif menyatakan tujuan pertemuan, sedangkan אֵלֶיךָ berbentuk tunggal dan karena itu diterjemahkan 'kepadamu'. Keterangan 'di sana' telah dinyatakan dengan tegas pada awal kalimat sebelumnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama diri ilahi יהוה. Bentuk 'Yahweh' mempertahankan nama perjanjian itu alih-alih menggantinya dengan gelar.
- issue: Peralihan jumlah dalam kata ganti orang kedua
  choice: mempertahankan bentuk jamak 'kalian' lalu bentuk tunggal 'kepadamu'
  alternative: menyeragamkan keduanya sebagai jamak atau tunggal
  rationale: Bahasa Ibrani beralih dari לָכֶם yang jamak kepada אֵלֶיךָ yang tunggal. Terjemahan mempertahankan peralihan ini tanpa memastikan secara dogmatis siapa saja yang tercakup dalam bentuk jamak atau siapa tepatnya yang disapa dalam bentuk tunggal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. 'Kurban' mengikuti ejaan baku; 'Kemah Pertemuan' dipakai sebagai nama konvensional bangunan ibadah. Pemisahan menjadi dua kalimat membuat struktur panjang bahasa Ibrani lebih alami tanpa menghilangkan penekanan tempat atau peralihan jumlah kata ganti.
