base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/022.yaml
  text: And you shall take from the ram the fat[a], and the fat tail, and the fat that covers the entrails, and the lobe of the liver, and the two kidneys, and the fat that is on them, and the right thigh, for it is a ram of ordination.
translation:
  language: id
  text: Kemudian ambillah dari domba jantan itu lemaknya, ekornya yang berlemak, lemak yang menutupi isi perut, umbai hati, kedua ginjal beserta lemak yang melekat padanya, dan paha kanannya, sebab domba itu adalah domba jantan penahbisan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “domba jantan pengudusan” atau “domba jantan pelantikan.” Ungkapan Ibrani ini menunjuk pada domba jantan yang digunakan dalam upacara pengangkatan para imam ke dalam jabatan mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Kemudian ambillah
  rationale: Dalam rangkaian petunjuk ritual, bentuk ini menyatakan perintah lanjutan. 'Kemudian ambillah' mengalir alami dalam bahasa Indonesia dan mempertahankan urutan tindakan.
- source_word: חֵלֶב
  choice: lemak
  rationale: Dalam konteks persembahan, kata ini menunjuk pada bagian-bagian lemak hewan yang ditetapkan untuk ritual. 'Lemak' merupakan padanan langsung dan jelas.
- source_word: אַלְיָה
  choice: ekornya yang berlemak
  rationale: Istilah ini menunjuk secara khusus pada ekor berlemak dari domba, bukan sekadar ekor biasa. Padanan ini mempertahankan kekhususan anatomisnya.
- source_word: הַמְכַסֶּה אֶת־הַקֶּרֶב
  choice: yang menutupi isi perut
  rationale: Frasa ini menggambarkan lemak yang menyelubungi organ-organ dalam. 'Isi perut' alami dan mudah dipahami dalam petunjuk penyembelihan ritual.
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: umbai hati
  rationale: Bagian anatomi yang tepat masih diperdebatkan, tetapi 'umbai hati' adalah istilah Indonesia yang ringkas dan lazim untuk bagian hati yang dimaksud dalam tata korban.
- source_word: כְּלָיֹת
  choice: ginjal
  rationale: Kata Ibrani ini secara langsung berarti ginjal dan digunakan secara harfiah dalam konteks anatomi korban.
- source_word: שׁוֹק הַיָּמִין
  choice: paha kanannya
  rationale: Dalam pembagian bagian hewan korban, שׁוֹק menunjuk pada bagian paha atau tungkai. 'Paha' memberi gambaran bagian potongan yang lebih khusus.
- source_word: אֵיל מִלֻּאִים
  choice: domba jantan penahbisan
  rationale: Frasa ini menunjuk pada domba jantan yang dipakai dalam upacara pengangkatan imam ke dalam tugasnya. 'Penahbisan' menyampaikan fungsi ritual tersebut secara ringkas tanpa mengaitkannya secara khusus dengan struktur gerejawi kemudian.
theological_decisions:
- issue: Istilah bagi pengangkatan imam dalam אֵיל מִלֻּאִים
  choice: domba jantan penahbisan
  alternative: domba jantan pengudusan; domba jantan pelantikan
  rationale: '''Penahbisan'' menyatakan bahwa domba ini digunakan dalam ritus yang menempatkan Harun dan anak-anaknya dalam jabatan imam. Karena ungkapan Ibraninya secara harfiah berkaitan dengan ''pengisian'' tangan, beberapa padanan ritual tetap mungkin dan dicatat dalam catatan kaki.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya petunjuk ritual yang lugas dan bermartabat. Istilah anatomi dibuat konkret serta mudah dipahami, sementara ragam padanan bagi ritus pengangkatan imam dipertahankan dalam catatan kaki.
