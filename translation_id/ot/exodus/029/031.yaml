base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/031.yaml
  text: And you shall take the ram of ordination and boil its flesh in a holy place[a][b].
translation:
  language: id
  text: Ambillah domba jantan untuk penahbisan itu[a], lalu rebuslah dagingnya di suatu tempat yang kudus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “domba jantan untuk pengudusan.” Istilah Ibrani ini menunjuk pada upacara pelantikan atau penahbisan imam.
    reason: lexical_alternative
  - marker: b
    text: Atau, “di Tempat Kudus,” meskipun secara lebih harfiah bahasa Ibraninya berbunyi “di suatu tempat yang kudus.”
    reason: alternative_reading
lexical_decisions:
- source_word: אֵיל
  choice: domba jantan
  rationale: Ini adalah padanan Indonesia yang alami dan tepat untuk hewan kurban jantan dewasa.
- source_word: הַמִּלֻּאִים
  choice: untuk penahbisan
  rationale: Dalam konteks imamat, istilah ini menunjuk pada upacara pelantikan atau penahbisan imam; frasa ini menyampaikan fungsi ritualnya dengan jelas.
- source_word: תִּקָּח
  choice: Ambillah
  rationale: Bentuk imperatif Indonesia secara alami menyampaikan daya perintah dari bentuk instruksional orang kedua tunggal Ibrani.
- source_word: וּבִשַּׁלְתָּ
  choice: lalu rebuslah
  rationale: Kata kerja Ibrani di sini merujuk pada memasak dengan merebus; 'lalu' mempertahankan urutan tindakan secara alami.
- source_word: בְּשָׂרוֹ
  choice: dagingnya
  rationale: Dalam bahasa Indonesia modern, 'dagingnya' adalah padanan alami bagi daging hewan yang akan dimakan dalam konteks kurban.
- source_word: בְּמָקוֹם קָדֹשׁ
  choice: di suatu tempat yang kudus
  rationale: Frasa Ibrani tidak memakai artikel tertentu, sehingga terjemahan tak tentu ini tidak mengidentifikasikannya secara berlebihan dengan ruang khusus Kemah Suci.
theological_decisions:
- issue: Makna teknis הַמִּלֻּאִים dalam konteks pelantikan imam
  choice: domba jantan untuk penahbisan
  alternative: domba jantan untuk pentahbisan; domba jantan penahbisan
  rationale: '''Penahbisan'' menyatakan pelantikan imam ke dalam tugas kudus tanpa menghilangkan unsur pengudusannya. Bentuk ''untuk penahbisan'' terdengar lebih alami dalam bahasa Indonesia.'
- issue: Apakah בְּמָקוֹם קָדֹשׁ menunjuk tempat kudus secara umum atau ruang teknis 'Tempat Kudus'
  choice: di suatu tempat yang kudus
  alternative: di Tempat Kudus
  rationale: Bahasa Ibrani tidak mengharuskan rujukan kepada ruang Kemah Suci yang secara teknis disebut 'Tempat Kudus'; terjemahan generik mempertahankan ketidakspesifikan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk perintah '-lah' dipakai untuk menyampaikan instruksi langsung dengan wajar; istilah teknis dijelaskan melalui catatan kaki.
