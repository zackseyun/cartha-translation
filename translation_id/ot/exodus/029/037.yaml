  text: שִׁבְעַ֣ת יָמִ֗ים תְּכַפֵּר֙ עַל הַ/מִּזְבֵּ֔חַ וְ/קִדַּשְׁתָּ֖ אֹת֑/וֹ וְ/הָיָ֤ה הַ/מִּזְבֵּ֨חַ֙ קֹ֣דֶשׁ קָֽדָשִׁ֔ים כָּל הַ/נֹּגֵ֥עַ בַּ/מִּזְבֵּ֖חַ יִקְדָּֽשׁ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/037.yaml
  text: For seven days you shall make atonement for the altar and consecrate it[a], and the altar shall be most holy. Whatever touches the altar shall become holy.
translation:
  language: id
  text: Selama tujuh hari engkau harus mengadakan pendamaian bagi mazbah itu dan menguduskannya; mazbah itu akan menjadi maha kudus. Apa pun yang menyentuh mazbah itu akan menjadi kudus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apa pun yang menyentuh mazbah itu akan kudus.” Ungkapan Ibrani ini dapat dipahami sebagai kekudusan yang diperoleh melalui sentuhan, atau sebagai ketentuan bahwa hanya orang atau benda yang kudus boleh menyentuh mazbah itu.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּכַפֵּר
  choice: mengadakan pendamaian
  rationale: Dalam konteks ritual keimaman, kata ini menunjuk pada pelaksanaan ritus pendamaian sekaligus pemurnian. Pilihan ini mempertahankan istilah teologis yang lazim tanpa merinci mekanismenya melebihi teks.
- source_word: עַל הַמִּזְבֵּחַ
  choice: bagi mazbah itu
  rationale: Dengan verba כפר, preposisi עַל menandai objek yang baginya pendamaian diadakan, bukan sekadar lokasi tindakan.
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: dan menguduskannya
  rationale: Menguduskan menyampaikan tindakan menjadikan atau menetapkan mazbah secara khusus bagi ranah kudus dan sesuai dengan konteks ibadah.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: maha kudus
  rationale: Konstruksi pengulangan Ibrani menyatakan tingkat kekudusan tertinggi. 'Maha kudus' ringkas, alami, dan membedakannya dari nama ruang 'Ruang Mahakudus'.
- source_word: כָּל הַנֹּגֵעַ
  choice: Apa pun yang menyentuh
  rationale: Partisip dengan כָּל bersifat luas dan dapat mencakup orang maupun benda; 'apa pun' tidak membatasinya hanya kepada manusia.
- source_word: יִקְדָּשׁ
  choice: akan menjadi kudus
  rationale: Bentuk verba paling wajar dipahami menyatakan hasil kontak dengan mazbah, yakni masuk ke dalam status kudus, sambil mencatat kemungkinan pemahaman lain dalam catatan kaki.
theological_decisions:
- issue: Apakah kekudusan dialihkan melalui sentuhan atau sentuhan dibatasi kepada yang kudus
  choice: Teks utama menyatakan bahwa apa pun yang menyentuh mazbah akan menjadi kudus.
  alternative: Hanya orang atau benda yang kudus boleh menyentuh mazbah; atau setiap orang yang menyentuhnya harus kudus.
  rationale: Urutan klausa dan bentuk יִקְדָּשׁ paling langsung menyatakan keadaan yang dihasilkan oleh kontak. Namun, karena ungkapan ini juga dipahami sebagai ketentuan pembatasan akses ke benda yang maha kudus, ketegangan tersebut dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Engkau' dipertahankan karena perintah ditujukan kepada satu orang. Istilah 'mazbah', 'pendamaian', dan 'menguduskan' dipakai karena konteks ritual memerlukan ketepatan teknis, sedangkan susunan kalimat dibuat langsung dan mudah dipahami.
