  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/יָדְע֗וּ כִּ֣י אֲנִ֤י יְהוָה֙ אֱלֹ֣הֵי/הֶ֔ם אֲשֶׁ֨ר הוֹצֵ֧אתִי אֹתָ֛/ם מֵ/אֶ֥רֶץ מִצְרַ֖יִם לְ/שָׁכְנִ֣/י בְ/תוֹכָ֑/ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/הֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/046.yaml
  text: And they shall know that I am Yahweh their God[a], who brought them out from the land of Egypt so that I might dwell among them[b]. I am Yahweh their God.
translation:
  language: id
  text: Mereka akan mengetahui bahwa Akulah Yahweh, Allah mereka, yang telah membawa mereka keluar dari negeri Mesir supaya Aku tinggal di tengah-tengah mereka[a]. Akulah Yahweh, Allah mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “untuk tinggal di tengah-tengah mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדְעוּ
  choice: Mereka akan mengetahui
  rationale: Bentuk ini dalam konteks janji sebelumnya menyatakan hasil yang akan terjadi. “Akan mengetahui” alami dalam bahasa Indonesia dan mempertahankan nuansa pengenalan yang sungguh-sungguh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks Ibrani tetap tampak.
- source_word: אֱלֹהֵיהֶם
  choice: Allah mereka
  rationale: Walaupun bentuk אֱלֹהִים secara morfologis jamak, konstruksi dengan nama Yahweh dan konteksnya dengan jelas menunjuk kepada satu Allah Israel.
- source_word: הוֹצֵאתִי אֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: yang telah membawa mereka keluar dari negeri Mesir
  rationale: Ungkapan ini menerjemahkan formula keluaran secara langsung. “Telah membawa” menandai tindakan lampau yang menjadi dasar pengenalan Israel akan Yahweh.
- source_word: לְשָׁכְנִי
  choice: supaya Aku tinggal
  rationale: 'Infinitif dengan prefiks לְ menyatakan tujuan: Yahweh membawa Israel keluar dengan maksud tinggal di tengah mereka. Bentuk alternatif yang lebih formal dicatat dalam catatan kaki.'
- source_word: בְתוֹכָם
  choice: di tengah-tengah mereka
  rationale: Pilihan ini dekat dengan idiom Ibrani dan tetap alami dalam bahasa Indonesia; ungkapan tersebut menekankan kehadiran Allah di dalam komunitas umat-Nya.
- source_word: אֲנִי יְהוָה אֱלֹהֵיהֶם
  choice: Akulah Yahweh, Allah mereka
  rationale: Partikel penegas “-lah” pada “Aku” mempertahankan tekanan formula perjanjian dan susunan ini terdengar wajar serta bermartabat dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama diri ilahi. “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan sebuah gelar.
- issue: Fungsi לְ pada לְשָׁכְנִי
  choice: 'Tujuan: “supaya Aku tinggal”'
  alternative: “untuk tinggal”
  rationale: Konteks paling wajar menunjukkan tujuan tindakan keluaran. Terjemahan ini menyatakan hubungan sintaksis itu tanpa menambahkan penjelasan teologis di luar teks.
- issue: Makna kehadiran dalam בְתוֹכָם
  choice: “di tengah-tengah mereka”
  alternative: “di antara mereka”
  rationale: Keduanya memungkinkan, tetapi pilihan utama lebih dekat dengan bentuk Ibrani dan mempertahankan gambaran kehadiran Yahweh di tengah umat-Nya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. “Akulah” dipakai untuk mempertahankan penegasan formula perjanjian, sedangkan struktur kalimat dibuat alami tanpa menghilangkan hubungan tujuan dalam teks Ibrani.
