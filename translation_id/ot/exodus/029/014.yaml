base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/014.yaml
  text: But the flesh of the bull[a], and its hide, and its dung, you shall burn with fire outside the camp; it is a sin offering.
translation:
  language: id
  text: Tetapi daging lembu jantan itu, kulitnya, dan kotorannya harus kaubakar dengan api di luar perkemahan. Itulah kurban dosa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kurban pemurnian.” Kata Ibrani חַטָּאת dapat berarti “dosa” atau kurban yang berkaitan dengan dosa. Dalam konteks kurban seperti ini, istilah itu sering diterjemahkan “kurban dosa,” sedangkan “kurban pemurnian” menonjolkan fungsi ritualnya untuk memurnikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשַׂר הַפָּר
  choice: daging lembu jantan itu
  rationale: Dalam konteks tubuh hewan kurban, 'daging' merupakan padanan Indonesia yang alami dan konkret bagi בְּשַׂר; הַפָּר menunjuk kepada lembu jantan yang telah disebutkan.
- source_word: עֹרוֹ
  choice: kulitnya
  rationale: '''Kulit'' adalah padanan langsung dan wajar untuk kulit hewan dalam bahasa Indonesia.'
- source_word: פִּרְשׁוֹ
  choice: kotorannya
  rationale: פֶּרֶשׁ berarti kotoran atau tinja; 'kotorannya' mempertahankan arti tersebut tanpa mengaburkannya menjadi isi perut atau jeroan.
- source_word: תִּשְׂרֹף
  choice: harus kaubakar
  rationale: Bentuk orang kedua tunggal dalam konteks instruksi menyatakan kewajiban; 'harus kaubakar' alami dalam bahasa Indonesia dan mempertahankan sapaan tunggal.
- source_word: בָּאֵשׁ
  choice: dengan api
  rationale: Preposisi בְּ di sini bersifat instrumental, yakni pembakaran dilakukan dengan api.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: di luar perkemahan
  rationale: Padanan ini menyatakan lokasi di luar batas perkemahan Israel secara jelas dan idiomatis.
- source_word: חַטָּאת
  choice: kurban penghapus dosa
  rationale: Dalam konteks ritual, kata ini menunjuk kepada kurban yang berhubungan dengan dosa. Ungkapan ini mudah dipahami pembaca Indonesia, sementara fungsi pemurnian yang mungkin ditekankan istilah tersebut dicatat dalam catatan kaki.
- source_word: הוּא
  choice: Itulah
  rationale: Kata ganti tersebut mengidentifikasi hewan atau tindakan kurban yang baru disebut sebagai חַטָּאת.
- source_word: וְאֶת ... וְאֶת ... וְאֶת
  choice: daging ..., kulitnya, dan kotorannya
  rationale: Daftar semua bagian dipertahankan dengan koordinasi yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna חַטָּאת dalam peraturan kurban
  choice: kurban penghapus dosa
  alternative: kurban pemurnian; dosa
  rationale: Konteks langsung menuntut pengertian sebagai jenis kurban, bukan sekadar konsep abstrak 'dosa'. 'Kurban penghapus dosa' dipakai dalam teks utama karena jelas dan dikenal, sedangkan 'kurban pemurnian' dicatat sebagai alternatif yang menonjolkan fungsi ritual pembersihan tanpa memaksakan salah satu sisi makna Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'kaubakar' mempertahankan orang kedua tunggal dalam instruksi. Struktur daftar dibuat alami tanpa menghilangkan satu pun unsur sumber.
