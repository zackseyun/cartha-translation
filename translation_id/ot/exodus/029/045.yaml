  text: And I will dwell among the sons of Israel[c][b][a], and I will be their God.
translation:
  language: id
  text: Aku akan tinggal di tengah-tengah orang Israel[a], dan Aku akan menjadi Allah mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “di tengah-tengah anak-anak lelaki Israel”; yaitu orang Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Aku akan menjadi Allah bagi mereka.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁכַנְתִּי
  choice: Aku akan tinggal
  rationale: Kata שׁכן menyatakan tinggal atau menetap. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan makna kehadiran Allah tanpa memasukkan tafsiran khusus tentang Kemah Suci ke dalam teks utama.
- source_word: בְּתוֹךְ
  choice: di tengah-tengah
  rationale: Ungkapan ini menyatakan kehadiran di dalam komunitas Israel. 'Di tengah-tengah' tetap dekat dengan bentuk Ibrani sekaligus wajar dan bermartabat dalam bahasa Indonesia.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Secara harfiah berarti 'anak-anak lelaki Israel', tetapi dalam konteks ini menunjuk kepada umat yang berasal dari Israel. 'Keturunan Israel' mempertahankan idiom kekerabatan tanpa menimbulkan kesan bahwa hanya laki-laki yang dimaksud.
- source_word: וְהָיִיתִי
  choice: dan menjadi
  rationale: Dalam rangkaian bahasa Indonesia, 'Aku akan tinggal ... dan menjadi ...' secara alami membuat cakupan 'akan' berlaku pada kedua verba. Di sini היה menyatakan relasi perjanjian, bukan perubahan hakikat.
- source_word: לָהֶם
  choice: mereka
  rationale: Konstruksi Ibrani harfiahnya 'bagi mereka', tetapi rumusan relasional yang alami dalam bahasa Indonesia ialah 'Allah mereka'.
- source_word: לֵאלֹהִים
  choice: Allah
  rationale: Dalam formula perjanjian dengan Israel dan dengan Allah sebagai penutur, אֱלֹהִים merujuk kepada Allah, bukan kepada 'suatu allah'.
theological_decisions:
- issue: Rumusan perjanjian
  choice: menjadi Allah mereka
  alternative: menjadi Allah bagi mereka
  rationale: Pilihan utama menyampaikan hubungan perjanjian secara alami dan ringkas. Alternatif yang lebih harfiah dicatat agar bentuk konstruksi Ibrani tetap terlihat.
- issue: Sebutan kelompok בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak lelaki Israel
  rationale: Bentuk Ibrani secara leksikal maskulin dan harfiah berarti 'anak-anak lelaki Israel', tetapi sebagai sebutan kolektif konteksnya mencakup umat Israel. 'Keturunan Israel' menjaga unsur genealogis tanpa mempersempit rujukannya secara tidak semestinya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Pronomina 'Aku' mengikuti ujaran langsung Allah. Susunan kalimat mempertahankan kesejajaran dua tindakan ilahi dalam teks Ibrani.
