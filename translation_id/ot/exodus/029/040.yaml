  text: and a tenth of fine flour mixed with a quarter of a hin of beaten oil[a], and a drink offering of a quarter of a hin of wine[c][b], for the one lamb.
translation:
  language: id
  text: dan sepersepuluh efa tepung halus yang dicampur dengan seperempat hin minyak zaitun hasil tumbukan,[a] serta persembahan curahan berupa seperempat hin anggur untuk anak domba yang satu itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maksudnya, minyak yang dihasilkan dari buah zaitun yang ditumbuk atau dihancurkan; dapat juga diterjemahkan “minyak zaitun hasil tumbukan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “untuk seekor anak domba”; dalam konteksnya, kemungkinan yang dimaksud ialah anak domba pertama dari kedua anak domba yang dipersembahkan setiap hari.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעִשָּׂרֹן סֹלֶת
  choice: dan sepersepuluh efa tepung halus
  rationale: Dalam konteks persembahan, עִשָּׂרוֹן adalah ukuran sepersepuluh efa. Menyebutkan 'efa' secara eksplisit membuat ukuran yang tersirat dalam istilah teknis Ibrani dapat dipahami pembaca Indonesia.
- source_word: בָּלוּל בְּשֶׁמֶן
  choice: yang dicampur dengan ... minyak
  rationale: Partisip pasif בָּלוּל menyatakan bahwa tepung dicampur dengan minyak; susunan ini alami dan jelas dalam bahasa Indonesia.
- source_word: שֶׁמֶן כָּתִית
  choice: minyak dari buah zaitun yang ditumbuk
  rationale: כָּתִית menerangkan minyak yang dihasilkan dari zaitun yang ditumbuk atau dihancurkan. Penyebutan buah zaitun menjernihkan sumber minyak yang tersirat tanpa mengubah cara pembuatannya.
- source_word: רֶבַע הַהִין
  choice: seperempat hin
  rationale: Mempertahankan satuan cair kuno 'hin' dan menerjemahkan pecahannya secara langsung.
- source_word: וְנֵסֶךְ
  choice: serta persembahan curahan
  rationale: נֶסֶךְ adalah istilah teknis bagi persembahan cairan yang dicurahkan. 'Persembahan curahan' jelas, ringkas, dan sesuai tindakan ritualnya.
- source_word: רְבִעִית הַהִין יָיִן
  choice: berupa seperempat hin anggur
  rationale: Bahasa Ibrani menetapkan isi dan takaran persembahan curahan; 'berupa' menghubungkannya secara alami dalam bahasa Indonesia.
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: untuk anak domba yang satu itu
  rationale: Mempertahankan artikel dan bilangan dalam bahasa Ibrani tanpa menafsirkan הָאֶחָד secara pasti sebagai 'yang pertama'.
theological_decisions:
- issue: Rujukan הָאֶחָד pada anak domba
  choice: anak domba yang satu itu
  alternative: anak domba yang pertama
  rationale: Konteks ayat sebelumnya menunjuk pada anak domba pertama dari dua persembahan harian, tetapi bentuk Ibrani secara harfiah berarti 'yang satu itu'. Terjemahan utama mempertahankan bentuk tersebut, sedangkan tafsiran kontekstual dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan istilah persembahan yang mudah dipahami. Satuan kuno 'efa' dan 'hin' dipertahankan. Semua penanda catatan kaki ditempatkan tepat sesudah unsur yang diterangkan.
