base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/001.yaml
  text: 'And this is the thing that you shall do for them to consecrate them to serve as priests for me: take one bull from the herd and two unblemished rams[a][b].'
translation:
  language: id
  text: 'Inilah yang harus kaulakukan bagi mereka untuk menguduskan mereka supaya mereka melayani-Ku sebagai para imam: ambillah seekor sapi jantan dari kawanan lembu[a] dan dua ekor domba jantan yang tidak bercacat[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “seekor sapi jantan muda.” Secara harfiah, frasa Ibraninya berbunyi “seekor sapi jantan, anak dari ternak lembu,” suatu ungkapan untuk hewan lembu dari kawanan.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “yang tidak memiliki cacat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדָּבָר
  choice: inilah yang
  rationale: Dalam konteks petunjuk ritual, ungkapan ini secara alami memperkenalkan tindakan yang segera dijabarkan, tanpa kekakuan harfiah seperti 'inilah hal'.
- source_word: תַּעֲשֶׂה
  choice: harus kaulakukan
  rationale: Bentuk imperfek berfungsi sebagai instruksi; 'harus kaulakukan' menyampaikan daya perintah dengan bahasa Indonesia modern dan wajar.
- source_word: לְקַדֵּשׁ
  choice: untuk menguduskan
  rationale: Dalam konteks keimaman, kata ini berarti memisahkan atau menetapkan bagi pelayanan kudus. 'Menguduskan' mempertahankan istilah utama yang lazim dalam bahasa Alkitab Indonesia.
- source_word: לְכַהֵן לִי
  choice: supaya melayani-Ku sebagai imam
  rationale: Ungkapan ini menunjuk pada pelaksanaan jabatan imam bagi Allah; terjemahan ini mempertahankan fungsi keimaman dan arah pelayanannya.
- source_word: לְקַח
  choice: ambillah
  rationale: Imperatif ini secara langsung memerintahkan Musa mengambil hewan-hewan yang diperlukan.
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: seekor sapi jantan dari kawanan
  rationale: פַּר berarti sapi jantan, sedangkan בֶּן בָּקָר merupakan keterangan idiomatis tentang hewan lembu dari kawanan. Pilihan ini tidak memaksakan usia muda yang hanya tersirat secara mungkin.
- source_word: אֵילִם שְׁנַיִם
  choice: dua ekor domba jantan
  rationale: אֵיל berarti domba jantan, dan jumlah dua dinyatakan secara eksplisit.
- source_word: תְּמִימִם
  choice: yang tidak bercacat
  rationale: Dalam konteks korban, istilah ini menyatakan hewan yang bebas dari cacat; frasa ini jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Bahasa fungsi keimaman
  choice: melayani-Ku sebagai imam
  alternative: menjadi imam bagi-Ku
  rationale: Pilihan utama menegaskan tindakan menjalankan jabatan imam bagi Allah tanpa mengubahnya menjadi sekadar identitas atau memasukkan pengertian jabatan gerejawi kemudian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada instruksi ritual yang bermartabat. Bentuk enklitik 'kaulakukan' dan 'melayani-Ku' mempertahankan sapaan tunggal kepada Musa serta rujukan ilahi. Penanda catatan kaki ditempatkan setelah syarat 'tidak bercacat'; catatan [a] menerangkan frasa tentang sapi jantan, sedangkan [b] memberi padanan bagi istilah kelayakan korban.
