  yaml_path: translation/ot/exodus/029/003.yaml
  text: You shall put them into one basket[a], and you shall bring them near in the basket[b], along with the bull and the two rams.
translation:
  language: id
  text: Letakkanlah semuanya dalam satu keranjang[a], lalu bawalah semuanya mendekat dalam keranjang itu[b], bersama lembu jantan dan kedua domba jantan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di dalam satu keranjang.” Preposisi Ibrani ini secara harfiah lazimnya berarti “di atas,” tetapi dalam konteks wadah ini maksudnya ialah menaruh semuanya dalam satu keranjang.
    reason: lexical_alternative
  - marker: b
    text: Atau “hadapkanlah semuanya” atau “persembahkanlah semuanya.” Verba Ibrani yang digunakan adalah istilah umum dalam konteks kurban yang secara harfiah berarti “membawa mendekat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ אוֹתָם
  choice: Taruhlah semuanya
  rationale: Kata נָתַן dalam petunjuk prosedural ini berarti menaruh atau menempatkan. Pronomina jamak merujuk pada berbagai jenis roti dalam ayat sebelumnya; 'semuanya' menyampaikan rujukan kolektif itu secara alami.
- source_word: עַל סַל אֶחָד
  choice: dalam satu keranjang
  rationale: Walaupun עַל biasanya berarti 'di atas', bersama verba menaruh dan wadah, konteksnya menunjukkan benda-benda dimasukkan ke dalam satu keranjang. 'Satu' mempertahankan אֶחָד.
- source_word: וְהִקְרַבְתָּ אֹתָם
  choice: lalu bawalah semuanya mendekat
  rationale: Bentuk kausatif קרב dalam konteks ibadah berarti membawa mendekat dan dapat pula bermakna mempersembahkan. Terjemahan ini mempertahankan gambaran dasar serta tidak mempersempit tindakan menjadi tahap persembahan tertentu.
- source_word: בַּסָּל
  choice: dalam keranjang itu
  rationale: Preposisi ב menunjukkan bahwa berbagai roti tetap berada di dalam keranjang ketika dibawa mendekat. Kata 'itu' menandai keranjang yang baru disebutkan.
- source_word: וְאֶת הַפָּר וְאֵת שְׁנֵי הָאֵילִם
  choice: bersama dengan lembu jantan dan kedua domba jantan itu
  rationale: Penanda objek yang berulang mengoordinasikan hewan-hewan ini sebagai objek tambahan yang harus dibawa mendekat. 'Bersama dengan' memperjelas hubungan tersebut dalam bahasa Indonesia.
- source_word: הַפָּר
  choice: lembu jantan
  rationale: פַּר menunjuk pada lembu jantan; pilihan ini jelas dan lazim dalam bahasa Indonesia Alkitabiah modern.
- source_word: שְׁנֵי הָאֵילִם
  choice: kedua domba jantan itu
  rationale: Bentuk bilangan konstruk dengan nomina definit secara alami diterjemahkan 'kedua ... itu'.
theological_decisions:
- issue: Makna kultis וְהִקְרַבְתָּ
  choice: bawalah ... mendekat
  alternative: persembahkanlah
  rationale: Verba ini merupakan istilah kurban yang dapat berarti membawa mendekat atau mempersembahkan. Karena objeknya mencakup roti dalam keranjang dan hewan, terjemahan harfiah-fungsional mempertahankan keluasan makna dan ketegangan antara tindakan mendekatkan dan mempersembahkan.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat dengan bentuk imperatif prosedural. Pengulangan 'semuanya' menjaga rujukan kepada berbagai jenis roti, sedangkan 'membawa mendekat' mempertahankan nuansa istilah kurban Ibrani tanpa menafsirkannya terlalu sempit.
