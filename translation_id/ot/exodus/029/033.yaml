  text: וְ/אָכְל֤וּ אֹתָ/ם֙ אֲשֶׁ֣ר כֻּפַּ֣ר בָּ/הֶ֔ם לְ/מַלֵּ֥א אֶת יָדָ֖/ם לְ/קַדֵּ֣שׁ אֹתָ֑/ם וְ/זָ֥ר לֹא יֹאכַ֖ל כִּי קֹ֥דֶשׁ הֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/033.yaml
  text: They shall eat those things by which atonement was made[a], to ordain them and to consecrate them; but an outsider shall not eat them[c][b], because they are holy.
translation:
  language: id
  text: Mereka harus memakan bagian-bagian itu, yang dengannya pendamaian diadakan, untuk menahbiskan dan menguduskan mereka. Namun, orang yang tidak berwenang[c] tidak boleh memakannya, karena bagian-bagian itu kudus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: Yang dimaksud ialah orang yang tidak berwenang mengambil bagian dalam ritus keimaman, bukan semata-mata orang asing secara etnis.
    reason: cultural_note
lexical_decisions:
- source_word: וְאָכְלוּ אֹתָם
  choice: Mereka harus memakan persembahan
  rationale: Bentuk verba menyampaikan ketentuan ritual. Pronomina objek merujuk pada bagian-bagian persembahan dalam konteks sebelumnya; 'persembahan' memperjelas rujukannya tanpa mengubah makna.
- source_word: אֲשֶׁר כֻּפַּר בָּהֶם
  choice: yang dengannya pendamaian diadakan
  rationale: 'Preposisi ב pada bentuk pasif כפר menandai sarana: bagian-bagian persembahan itu menjadi sarana dalam ritus pendamaian. Bahasa Ibrani tidak secara eksplisit menyatakan penerima pendamaian dalam klausa ini.'
- source_word: לְמַלֵּא אֶת יָדָם
  choice: untuk menahbiskan mereka
  rationale: Secara harfiah berarti 'memenuhi tangan mereka', sebuah idiom teknis bagi pelantikan imam. 'Menahbiskan' menyampaikan fungsi ritualnya dalam bahasa Indonesia yang wajar.
- source_word: לְקַדֵּשׁ אֹתָם
  choice: dan menguduskan mereka
  rationale: Dalam konteks keimaman, קדשׁ berarti mengkhususkan sebagai kudus bagi pelayanan suci. 'Menguduskan' mempertahankan hubungan leksikal dengan קֹדֶשׁ pada akhir ayat.
- source_word: וְזָר
  choice: Namun, orang yang tidak berwenang
  rationale: Dalam hukum peribadatan, זָר menunjuk kepada orang di luar kelompok yang diberi wewenang mengikuti ritus, bukan terutama orang asing secara etnis.
- source_word: לֹא יֹאכַל
  choice: tidak boleh memakannya
  rationale: Ungkapan ini merupakan larangan langsung; objek tersirat dinyatakan dengan '-nya' agar alami dalam bahasa Indonesia.
- source_word: כִּי קֹדֶשׁ הֵם
  choice: karena semuanya itu kudus
  rationale: Klausa ini memberi alasan bagi larangan. Bentuk jamak הֵם merujuk pada benda-benda yang dimakan; 'semuanya itu' memperjelas rujukan tersebut.
theological_decisions:
- issue: Makna כפר dalam konteks korban
  choice: pendamaian diadakan
  alternative: penghapusan kesalahan dilakukan
  rationale: '''Pendamaian'' merupakan istilah Indonesia yang cukup dikenal dan mempertahankan keluasan makna ritual כפר. Alternatif yang lebih sempit tidak dipaksakan ke dalam teks utama.'
- issue: Makna idiom pelantikan imam מִלֵּא יָד
  choice: menahbiskan mereka
  alternative: memenuhi tangan mereka; melantik mereka
  rationale: Terjemahan utama menyampaikan fungsi idiom dalam ritus pelantikan imam tanpa menganggap bentuk penahbisan dari tradisi gerejawi tertentu. Arti harfiahnya dicatat dalam catatan kaki.
- issue: Identitas זָר dalam hukum peribadatan
  choice: orang yang tidak berwenang
  alternative: orang luar; orang awam
  rationale: Pilihan ini menjaga batas ritual yang dimaksud dan menghindari kesan bahwa larangan itu semata-mata didasarkan pada etnis atau kebangsaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami sambil mempertahankan urutan tujuan ritus, larangan, dan alasannya. Istilah 'pendamaian', 'menahbiskan', 'menguduskan', dan 'kudus' menjaga bobot sakral tanpa mengikat teks pada tradisi denominasi tertentu.
