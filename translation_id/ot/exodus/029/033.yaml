  to: Mereka harus memakan bagian-bagian itu, yang dengannya pendamaian diadakan, untuk menahbiskan dan menguduskan mereka. Namun, orang yang tidak berwenang[c] tidak boleh memakannya, karena bagian-bagian itu kudus.
