translation:
  language: id
  text: Kemudian, ambillah domba jantan yang satu itu[a]. Hendaklah Harun dan putra-putranya menumpangkan tangan mereka pada kepala domba jantan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “domba jantan yang satu itu,” untuk membedakannya dari domba jantan lain dalam upacara penahbisan; sejumlah terjemahan menerjemahkannya “domba jantan yang pertama.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: Kemudian
  rationale: Konjungsi yang diikuti penanda objek memperkenalkan tahap berikutnya dalam rangkaian petunjuk; “Kemudian” menyatakan urutan itu secara alami.
- source_word: הָ/אַיִל הָ/אֶחָד
  choice: domba jantan yang satu itu
  rationale: אַיִל berarti domba jantan, sedangkan הָאֶחָד secara harfiah menunjuk kepada “yang satu itu”, membedakannya dari domba jantan lain tanpa mengubahnya menjadi bilangan urutan “pertama”.
- source_word: תִּקָּח
  choice: ambillah
  rationale: Bentuk orang kedua tunggal maskulin dalam konteks instruksi ditujukan kepada Musa; bentuk imperatif Indonesia menyampaikan daya perintah secara wajar.
- source_word: וְ/סָמְכוּ
  choice: lalu ... harus menumpangkan
  rationale: Dalam konteks kurban, סמך menunjuk pada tindakan ritual meletakkan atau menumpangkan tangan pada hewan. “Menumpangkan tangan” merupakan ungkapan Indonesia yang jelas dan lazim.
- source_word: אַהֲרֹן וּ/בָנָי/ו
  choice: Harun dan anak-anaknya
  rationale: בָּנָיו di sini menunjuk kepada anak-anak laki-laki Harun dalam konteks penahbisan imam; bentuk Indonesia “anak-anaknya” alami dan konteks telah memperjelas rujukannya.
- source_word: אֶת יְדֵי/הֶם
  choice: tangan mereka
  rationale: Bahasa Ibrani memakai bentuk jamak, tetapi bahasa Indonesia secara idiomatis dapat memakai “tangan mereka” untuk tindakan yang dilakukan masing-masing orang tanpa mengesankan setiap orang harus memakai kedua tangan.
- source_word: עַל רֹאשׁ הָ/אָיִל
  choice: pada kepala domba jantan itu
  rationale: Frasa ini menyatakan lokasi tindakan secara langsung; pengulangan “domba jantan itu” menjaga kejelasan rujukan.
theological_decisions:
- issue: Makna tindakan ritual סמך dalam upacara penahbisan
  choice: menumpangkan tangan mereka pada kepala domba jantan itu
  alternative: menekankan tangan mereka pada kepala domba jantan itu
  rationale: Pilihan ini mempertahankan tindakan ritual yang dinyatakan teks tanpa menambahkan penjelasan mengenai pemindahan dosa, identifikasi, atau makna teologis lain yang tidak dijelaskan dalam ayat ini.
- issue: הָאֶחָד sebagai penunjuk atau bilangan urutan
  choice: yang satu itu
  alternative: yang pertama
  rationale: Teks Ibrani secara leksikal mengatakan “yang satu itu”. Terjemahan ini mempertahankan pembedaan dari domba jantan lain dan tidak secara diam-diam menafsirkan kata tersebut sebagai ordinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “ambillah” mempertahankan sapaan tunggal kepada Musa, sedangkan “harus menumpangkan” menyampaikan sifat preskriptif tindakan Harun dan anak-anaknya.
