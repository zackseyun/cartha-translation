translation:
  language: id
  text: Bawalah anak-anak laki-lakinya mendekat, lalu kenakanlah tunik-tunik[a] pada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pakaian-pakaian.” Istilah Ibrani ini mengacu pada pakaian yang dikenakan dekat tubuh; bentuk tepatnya tidak sepenuhnya pasti.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנָיו
  choice: anak-anaknya
  rationale: Dalam konteks ini bentuk tersebut merujuk secara khusus kepada anak-anak laki-laki Harun; bahasa Indonesia lazim memakai 'anak-anaknya' tanpa harus menambahkan 'laki-laki' karena acuannya sudah jelas dari konteks.
- source_word: תַּקְרִיב
  choice: suruhlah ... mendekat
  rationale: Bentuk kausatif dari קרב berarti membawa atau menyuruh seseorang mendekat. Pilihan ini alami dalam bahasa Indonesia sekaligus mempertahankan nuansa pendekatan atau penghadapan dalam upacara.
- source_word: וְהִלְבַּשְׁתָּם
  choice: lalu kenakanlah ... kepada mereka
  rationale: Ungkapan ini menyampaikan tindakan memakaikan pakaian kepada orang lain dan terdengar alami serta khidmat dalam bahasa Indonesia.
- source_word: כֻּתֳּנֹת
  choice: kemeja-kemeja panjang
  rationale: כֻּתֹּנֶת menunjuk pakaian badan panjang, bukan mantel modern atau jubah luar. 'Kemeja panjang' cukup mudah dipahami dan membedakannya dari jenis pakaian imam lainnya.
