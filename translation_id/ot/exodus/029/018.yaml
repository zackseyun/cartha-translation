  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הִקְטַרְתָּ֤ אֶת כָּל הָ/אַ֨יִל֙ הַ/מִּזְבֵּ֔חָ/ה עֹלָ֥ה ה֖וּא לַֽ/יהוָ֑ה רֵ֣יחַ נִיח֔וֹחַ אִשֶּׁ֥ה לַ/יהוָ֖ה הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/018.yaml
  text: And you shall burn the whole ram on the altar[a]. It is a burnt offering to Yahweh, a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: id
  text: Bakarlah seluruh domba jantan itu di atas mazbah. Itulah kurban bakaran bagi Yahweh, aroma yang menyenangkan[a]; itulah persembahan dengan api[b] bagi Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “aroma yang menenteramkan.” Ini merupakan formula tetap dalam bahasa Ibrani untuk kurban yang berkenan kepada Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Atau “persembahan makanan.” Makna tepat istilah Ibraninya diperdebatkan; secara tradisional kata ini dipahami sebagai persembahan yang disajikan melalui api.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטַרְתָּ
  choice: Bakarlah
  rationale: Bentuk Hifil dari קטר dalam konteks kurban berarti membuat kurban terbakar dan naik sebagai asap di atas mazbah. “Bakarlah” alami dalam bahasa Indonesia, sedangkan konteks mazbah mempertahankan makna ritualnya.
- source_word: כָּל הָאַיִל
  choice: seluruh domba jantan itu
  rationale: כָּל menegaskan bahwa segenap hewan dipersembahkan, dan אַיִל secara khusus berarti domba jantan dewasa.
- source_word: הַמִּזְבֵּחָה
  choice: di atas mazbah
  rationale: Akhiran penunjuk arah menyatakan gerak menuju mazbah; dalam konteks pembakaran kurban, “di atas mazbah” merupakan ungkapan Indonesia yang paling wajar.
- source_word: עֹלָה
  choice: kurban bakaran
  rationale: Istilah baku ini menyatakan kurban yang dibakar seluruhnya; makna dasarnya yang berkaitan dengan ‘naik’ tidak perlu dipaksakan ke dalam terjemahan.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menandai peruntukan atau penyerahan kurban kepada Yahweh.
- source_word: רֵיחַ נִיחוֹחַ
  choice: aroma yang menyenangkan
  rationale: Ungkapan ritual tetap ini menyatakan bahwa kurban tersebut berkenan atau diterima oleh Allah. Terjemahan ini mempertahankan citra aroma tanpa menyiratkan bahwa Allah perlu ditenangkan.
- source_word: אִשֶּׁה
  choice: persembahan dengan api
  rationale: Kata ini menunjuk pada persembahan yang disajikan melalui api. Terjemahan ini mempertahankan hubungan eksplisit dengan api dan tidak menjadikan etimologi ‘makanan’ yang diperdebatkan sebagai teks utama.
- source_word: הוּא
  choice: Itulah
  rationale: Kata ganti ini berfungsi sebagai kopula penegas dalam kedua klausa, sehingga “Itulah” mempertahankan identifikasi dan penekanannya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. “Yahweh” mempertahankan nama diri itu tanpa menggantinya dengan gelar.
- issue: Makna formula רֵיחַ נִיחוֹחַ
  choice: aroma yang menyenangkan
  alternative: aroma yang menenteramkan; aroma yang berkenan
  rationale: Pilihan utama mempertahankan metafora penciuman dan gagasan penerimaan ilahi, tetapi tidak secara diam-diam menafsirkan ungkapan itu sebagai tindakan meredakan murka Allah.
- issue: Makna אִשֶּׁה
  choice: persembahan dengan api
  alternative: persembahan makanan
  rationale: Hubungan istilah ini dengan api paling langsung dalam konteks ini, sedangkan analisis sebagai pemberian makanan tetap mungkin tetapi diperdebatkan; karena itu alternatif tersebut dicatat tanpa dimasukkan ke teks utama.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. “Mazbah” dipertahankan sebagai istilah ritual yang ringkas dan dikenal dalam konteks Alkitab. Imperatif “Bakarlah” mencerminkan perintah langsung kepada orang kedua tunggal. Tanda titik koma membantu mempertahankan dua klausa predikatif dengan הוּא tanpa menghasilkan pengulangan yang kaku.
