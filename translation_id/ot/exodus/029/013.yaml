  register: Bahasa prosedural yang lugas dan berwibawa dipertahankan melalui bentuk perintah. Istilah anatomi dibuat jelas bagi pembaca modern tanpa menghilangkan ketidakpastian istilah Ibrani, sedangkan 'mezbah' dipakai sebagai istilah baku dalam konteks kurban.
