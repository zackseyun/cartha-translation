base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/013.yaml
  text: Then you shall take all the fat that covers the entrails[a], the lobe on the liver, the two kidneys, and the fat that is on them, and you shall burn them on the altar.
translation:
  language: id
  text: Kemudian ambillah seluruh lemak yang menutupi organ-organ dalam, bagian yang menempel pada hati[a], kedua ginjal beserta lemak yang ada padanya, lalu bakarlah semuanya di atas mezbah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini menunjuk pada suatu bagian yang melekat atau berkaitan dengan hati, tetapi identifikasi anatominya secara tepat tidak pasti; mungkin yang dimaksud adalah salah satu lobus hati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Kemudian ambillah
  rationale: Bentuk perfektum dengan waw dalam rangkaian petunjuk berfungsi sebagai perintah lanjutan. Bentuk ini menyampaikan urutan tindakan secara alami dalam bahasa Indonesia.
- source_word: כָּל הַחֵלֶב
  choice: seluruh lemak
  rationale: חֵלֶב menunjuk pada bagian-bagian berlemak dari hewan kurban. 'Lemak' jelas dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: הַמְכַסֶּה אֶת הַקֶּרֶב
  choice: yang menutupi organ-organ dalam
  rationale: Dalam konteks ini קֶרֶב menunjuk pada bagian atau organ dalam hewan. Pilihan ini konkret dan lebih wajar daripada istilah yang terlalu teknis.
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: bagian yang menempel pada hati
  rationale: יוֹתֶרֶת adalah istilah anatomi yang sulit dipastikan, yaitu suatu bagian yang berkaitan dengan hati. Ungkapan ini mempertahankan ketidakpastian itu dan mencerminkan עַל tanpa menetapkannya secara pasti sebagai lobus tertentu.
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: kedua ginjal
  rationale: Padanan anatomi langsung dan alami bagi bentuk dual כְּלָיֹת.
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵיהֶן
  choice: lemak yang ada padanya
  rationale: Menerjemahkan hubungan yang dinyatakan oleh עֲלֵיהֶן secara dekat, dengan pronomina tunggal kolektif yang secara alami merujuk kepada kedua ginjal.
- source_word: וְהִקְטַרְתָּ
  choice: lalu bakarlah semuanya
  rationale: Dalam konteks kurban, bentuk Hifil קטר berarti membakar bagian kurban di mezbah sehingga menjadi asap. 'Bakarlah' jelas, sedangkan konteks mezbah mempertahankan makna ritualnya.
- source_word: הַמִּזְבֵּחָה
  choice: di atas mezbah
  rationale: Akhiran arah pada הַמִּזְבֵּחָה menunjukkan gerak menuju atau penempatan di atas mezbah. 'Di atas mezbah' merupakan ungkapan Indonesia yang alami dalam petunjuk kurban.
theological_decisions: []
