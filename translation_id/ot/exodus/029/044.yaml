  yaml_path: translation/ot/exodus/029/044.yaml
  text: And I will consecrate the tent of meeting and the altar[b][a]; and I will consecrate Aaron and his sons to serve me as priests.
translation:
  language: id
  text: Aku akan menguduskan[a] Kemah Pertemuan dan mezbah; Harun dan putra-putranya akan Kukuduskan untuk menjalankan pelayanan sebagai imam bagi-Ku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengkhususkan sebagai kudus”; demikian juga pada kata “Kukuduskan” kemudian dalam ayat ini.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “menjadi imam bagi-Ku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִדַּשְׁתִּי / אֲקַדֵּשׁ
  choice: Aku akan menguduskan / akan Kukuduskan
  rationale: Bentuk piel dari קדשׁ menyatakan tindakan menetapkan sebagai kudus atau mengkhususkan bagi tujuan suci. “Menguduskan” wajar dalam bahasa Indonesia, berlaku baik bagi tempat dan benda maupun bagi orang, serta mempertahankan pengulangan verba Ibrani.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Padanan baku dan jelas bagi tempat pertemuan yang ditetapkan antara Allah dan umat-Nya; huruf kapital menandai nama bangunan suci tertentu dalam konteks ini.
- source_word: הַמִּזְבֵּחַ
  choice: mezbah itu
  rationale: “Mezbah” adalah istilah kultis yang lazim untuk tempat persembahan korban, sedangkan “itu” mencerminkan ke definitan artikel Ibrani dan menunjuk pada mezbah yang telah dibicarakan.
- source_word: אַהֲרֹן
  choice: Harun
  rationale: Mengikuti bentuk nama yang baku dalam bahasa Indonesia.
- source_word: בָּנָיו
  choice: anak-anak lelakinya
  rationale: Teks Ibrani secara khusus menyebut anak-anak laki-laki Harun. Bentuk ini mempertahankan ketepatan gender tanpa memakai ungkapan yang dapat dipahami mencakup semua anak.
- source_word: לְכַהֵן לִי
  choice: untuk melayani-Ku sebagai imam
  rationale: Verba כהן menunjuk pada pelaksanaan tugas keimaman. Padanan ini alami dalam bahasa Indonesia dan mempertahankan bahwa pelayanan itu ditujukan kepada Allah.
theological_decisions:
- issue: Bahasa kekudusan dalam konteks ibadah
  choice: menguduskan
  alternative: menahbiskan / mengkhususkan sebagai kudus
  rationale: “Menguduskan” mempertahankan unsur dasar kekudusan dalam קדשׁ dan dapat diterapkan secara konsisten pada Kemah, mezbah, serta para imam, tanpa mempersempit maknanya hanya pada upacara penahbisan manusia.
- issue: Rujukan gender dalam garis keimaman
  choice: anak-anak lelakinya
  alternative: anak-anaknya
  rationale: בָּנָיו berbentuk maskulin dan dalam konteks ini merujuk kepada putra-putra Harun yang menjalankan tugas imam; terjemahan mempertahankan kekhususan tersebut.
- issue: Makna pelayanan keimaman kepada Allah
  choice: melayani-Ku sebagai imam
  alternative: menjadi imam bagi-Ku
  rationale: Pilihan ini mengungkapkan fungsi verbal לְכַהֵן, yakni menjalankan pelayanan sebagai imam, sekaligus mempertahankan לִי sebagai pihak yang menerima pelayanan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi ditulis dengan huruf kapital menurut kebiasaan ejaan religius Indonesia. Susunan klausa kedua mempertahankan penonjolan Harun dan anak-anak lelakinya dalam bahasa Ibrani, tetapi tetap terdengar alami.
