  text: Then you shall take the second ram, and Aaron and his sons shall lay their hands on the head of the ram.
translation:
  language: id
  text: Kemudian, ambillah domba jantan yang kedua, lalu Harun dan putra-putranya harus menumpangkan tangan mereka ke atas kepala domba jantan itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Kemudian, ambillah
  rationale: Bentuk Qal perfektum dengan waw dalam rangkaian petunjuk berfungsi sebagai perintah kepada Musa. “Kemudian” menyatakan urutan tindakan, sedangkan “ambillah” menyampaikan daya imperatif secara alami dalam bahasa Indonesia.
- source_word: הָאַיִל הַשֵּׁנִי
  choice: domba jantan yang kedua
  rationale: אַיִל berarti domba jantan, dan הַשֵּׁנִי adalah bilangan bertingkat “yang kedua,” merujuk pada domba jantan kedua dalam rangkaian penahbisan.
- source_word: וְסָמַךְ
  choice: lalu ... harus meletakkan
  rationale: Dalam konteks kurban, סמך menunjuk pada tindakan ritual menumpangkan atau meletakkan tangan pada hewan. “Meletakkan” mempertahankan tindakan konkret tanpa menambahkan penafsiran simbolis; “lalu” menandai kelanjutan prosedur.
- source_word: אַהֲרֹן וּבָנָיו
  choice: Harun dan anak-anaknya
  rationale: בָנָיו merujuk pada anak-anak lelaki Harun dalam konteks penahbisan imam. Dalam bahasa Indonesia, “anak-anaknya” adalah ungkapan alami dan konteks telah menentukan bahwa yang dimaksud ialah para putranya.
- source_word: אֶת יְדֵיהֶם
  choice: tangan mereka
  rationale: Bahasa Ibrani memakai bentuk jamak, yakni tangan-tangan milik subjek jamak. “Tangan mereka” merupakan ungkapan jamak yang wajar dalam bahasa Indonesia.
- source_word: עַל רֹאשׁ הָאָיִל
  choice: di atas kepala domba jantan itu
  rationale: Ungkapan ini menyatakan lokasi tindakan secara langsung. Kata penunjuk “itu” secara alami menandai bahwa domba jantan tersebut telah disebut sebelumnya dalam ayat.
theological_decisions:
- issue: Penyajian ritus penumpangan tangan tanpa memasukkan penjelasan teologis yang tidak dinyatakan ayat
  choice: harus meletakkan tangan mereka di atas kepala domba jantan itu
  alternative: harus menumpangkan tangan mereka ke atas kepala domba jantan itu
  rationale: Ayat hanya menggambarkan tindakan ritual dan tidak menjelaskan maknanya. Terjemahan mempertahankan tindakan konkret tersebut tanpa menyimpulkan adanya pemindahan kesalahan, identifikasi, atau makna penahbisan tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk imperatif “ambillah” ditujukan kepada Musa; “harus meletakkan” menyampaikan instruksi bagi Harun dan anak-anaknya. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual penting yang harus ditampilkan kepada pembaca.
