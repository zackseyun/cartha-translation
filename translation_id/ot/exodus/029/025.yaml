  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לָקַחְתָּ֤ אֹתָ/ם֙ מִ/יָּדָ֔/ם וְ/הִקְטַרְתָּ֥ הַ/מִּזְבֵּ֖חָ/ה עַל הָ/עֹלָ֑ה לְ/רֵ֤יחַ נִיח֨וֹחַ֙ לִ/פְנֵ֣י יְהוָ֔ה אִשֶּׁ֥ה ה֖וּא לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/025.yaml
  text: Then you shall take them from their hands and burn them on the altar[a], on top of the burnt offering, as a pleasing aroma before Yahweh. It is an offering made by fire to Yahweh.
translation:
  language: id
  text: Lalu ambillah semuanya dari tangan mereka dan bakarlah di atas mazbah, di atas kurban bakaran, sebagai aroma yang menyenangkan di hadapan Yahweh. Itulah persembahan yang dibakar bagi Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “persembahan api bagi Yahweh.” Istilah Ibraninya adalah istilah teknis untuk persembahan yang disajikan dengan dibakar.
    reason: Alternatif leksikal bagi אִשֶּׁה, yang makna dan asal katanya diperdebatkan.
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Lalu ambillah
  rationale: Bentuk perfektum Qal dengan waw dalam rangkaian petunjuk menyatakan perintah berikutnya. “Lalu” menandai urutan tindakan, sedangkan “ambillah” mempertahankan daya perintah.
- source_word: אֹתָם מִיָּדָם
  choice: semuanya dari tangan mereka
  rationale: Pronomina objek merujuk pada seluruh bagian persembahan yang sebelumnya diletakkan di tangan para imam. “Semuanya” lebih wajar daripada “mereka” untuk benda-benda tersebut, sementara gambaran konkret “dari tangan mereka” dipertahankan.
- source_word: וְהִקְטַרְתָּ
  choice: bakarlah
  rationale: Hifil dari קטר dalam konteks kurban berarti membakar persembahan di mazbah sehingga asapnya naik. “Bakarlah” alami dan jelas dalam bahasa Indonesia; konteks mazbah menyampaikan nuansa ritualnya.
- source_word: הַמִּזְבֵּחָה
  choice: di atas mazbah
  rationale: Akhiran arah pada nomina, bersama verba pengurbanan, menunjukkan penempatan ke atas mazbah. “Di atas mazbah” merupakan ungkapan Indonesia yang alami dalam konteks ini.
- source_word: עַל הָעֹלָה
  choice: di atas kurban bakaran
  rationale: Preposisi עַל menyatakan bahwa bagian-bagian itu ditempatkan di atas kurban bakaran yang sudah ada. Pengulangan “di atas” mempertahankan hubungan spasial teks.
- source_word: לְרֵיחַ נִיחוֹחַ
  choice: sebagai aroma yang menyenangkan
  rationale: Ungkapan tetap dalam bahasa kurban ini menggambarkan aroma yang berkenan atau menyenangkan bagi Allah. Terjemahan ini mempertahankan metaforanya tanpa memakai bahasa usang.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי menyatakan keberadaan atau tindakan di hadapan seseorang, dan nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”.
- source_word: אִשֶּׁה
  choice: persembahan yang dibakar
  rationale: Istilah kurban ini berkaitan dengan persembahan yang disajikan melalui pembakaran, meskipun etimologi dan cakupan tepatnya diperdebatkan. Pilihan ini alami dalam bahasa Indonesia dan tidak menyiratkan bahwa api itu sendiri adalah persembahannya.
- source_word: הוּא לַיהוָה
  choice: Itulah ... bagi Yahweh
  rationale: Pronomina eksplisit הוּא ditegaskan dengan “Itulah”, sedangkan ל menandai bahwa persembahan itu diperuntukkan atau dipersembahkan bagi Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani menyebut nama perjanjian secara langsung. “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Makna istilah kurban אִשֶּׁה
  choice: persembahan yang dibakar
  alternative: persembahan api; persembahan berupa makanan
  rationale: Istilah ini secara tradisional dihubungkan dengan api, tetapi hubungan etimologis dan nuansa teknisnya tidak sepenuhnya pasti. Terjemahan utama menekankan cara penyajiannya melalui pembakaran; alternatif yang lebih harfiah dicatat tanpa memasukkan gagasan “makanan” yang tidak dinyatakan langsung dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah “mazbah” dan “kurban bakaran” dipertahankan karena merupakan kosakata ritual yang mapan, sedangkan struktur kalimat dibuat lugas dan mudah dipahami.
