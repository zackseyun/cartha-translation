  text: וְ/הִקְרַבְתָּ֙ אֶת הַ/פָּ֔ר לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ/סָמַ֨ךְ אַהֲרֹ֧ן וּ/בָנָ֛י/ו אֶת יְדֵי/הֶ֖ם עַל רֹ֥אשׁ הַ/פָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/010.yaml
  text: You shall bring the bull before the tent of meeting[a], and Aaron and his sons shall lay their hands on the head of the bull.
translation:
  language: id
  text: Engkau harus membawa lembu jantan itu ke hadapan Kemah Pertemuan[a], lalu Harun dan anak-anaknya harus menumpangkan tangan mereka di atas kepala lembu jantan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mendekatkan” atau “mempersembahkan” lembu jantan itu di hadapan Kemah Pertemuan.
    reason: Alternatif leksikal bagi וְהִקְרַבְתָּ, yang dalam konteks kurban dapat berarti membawa dekat atau mempersembahkan.
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: Engkau harus membawa
  rationale: Bentuk Hifil dari קרב berarti membawa dekat atau mempersembahkan dalam konteks kurban. 'Membawa' alami dalam bahasa Indonesia, sedangkan nuansa mendekatkan atau mempersembahkan dicatat dalam catatan kaki.
- source_word: הַפָּר
  choice: lembu jantan itu
  rationale: פַּר menunjuk pada lembu jantan, sering kali yang masih muda dalam konteks kurban. 'Lembu jantan' jelas dan tepat tanpa menambahkan usia yang tidak dinyatakan secara eksplisit.
- source_word: לִפְנֵי
  choice: ke hadapan
  rationale: Ungkapan ini menunjukkan gerak menuju posisi di depan atau di hadapan suatu tempat; 'ke hadapan' selaras dengan verba membawa dan mempertahankan nuansa arah.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Sebutan baku dan bermartabat bagi tempat kudus kemah dalam konteks Israel, dengan unsur pertemuan tetap dipertahankan.
- source_word: וְסָמַךְ
  choice: lalu ... harus menumpangkan
  rationale: Dalam ritus kurban, סמך dengan tangan sebagai objek berarti menumpangkan atau menekan tangan pada kepala hewan. 'Menumpangkan tangan' merupakan ungkapan Indonesia yang alami untuk tindakan konkret ini; 'lalu' menyampaikan kelanjutan waw Ibrani.
- source_word: יְדֵיהֶם
  choice: tangan mereka
  rationale: Bentuk Ibrani adalah jamak dan merujuk secara kolektif kepada Harun beserta anak-anaknya; terjemahan tidak mengubahnya menjadi bentuk tunggal.
- source_word: עַל רֹאשׁ הַפָּר
  choice: di atas kepala lembu jantan itu
  rationale: Terjemahan ini mempertahankan tindakan fisik dan hubungan spasial yang dinyatakan teks.
- source_word: אַהֲרֹן וּבָנָיו
  choice: Harun dan anak-anaknya
  rationale: בָּנָיו berarti anak-anak laki-lakinya dalam konteks penahbisan imam. Dalam bahasa Indonesia, 'anak-anaknya' alami dan konteks telah mengidentifikasi mereka sebagai putra-putra Harun.
theological_decisions:
- issue: Makna teologis penumpangan tangan pada hewan kurban
  choice: menumpangkan tangan mereka di atas kepala lembu jantan itu
  alternative: meletakkan tangan mereka pada kepala lembu jantan itu
  rationale: Ayat hanya menggambarkan tindakan ritual dan tidak menjelaskan simbolismenya. Terjemahan mempertahankan tindakan tersebut tanpa menambahkan gagasan seperti pemindahan kesalahan atau identifikasi yang tidak dinyatakan secara eksplisit di sini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'Engkau' mempertahankan sapaan tunggal kepada Musa. Kapitalisasi 'Kemah Pertemuan' menandai nama tempat kudus tertentu. Struktur dua tindakan dipertahankan secara jelas tanpa menjelaskan simbolisme ritual di luar teks.
