translation:
  language: id
  text: Kemudian, ambillah minyak urapan itu, tuangkanlah pada kepalanya, dan urapilah dia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Kemudian, ambillah
  rationale: Bentuk perfektum Qal dengan waw dalam rangkaian petunjuk ritual menyatakan tindakan berikutnya. 'Kemudian' memperjelas urutan, sedangkan bentuk imperatif '-lah' menyampaikan daya perintah secara wajar dalam bahasa Indonesia.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: minyak pengurapan itu
  rationale: Frasa konstruksi ini secara harfiah berarti 'minyak pengurapan'. Kata 'itu' menandai minyak khusus yang telah disebutkan dalam konteks, sementara 'pengurapan' mempertahankan fungsi ritualnya.
- source_word: וְיָצַקְתָּ
  choice: tuangkanlah
  rationale: Kata kerja יצק berarti 'menuangkan'. Bentuk '-lah' mempertahankan corak instruksi dan koordinasinya dengan tindakan lain.
- source_word: עַל רֹאשׁוֹ
  choice: ke atas kepalanya
  rationale: Preposisi עַל bersama verba 'menuangkan' secara alami menyatakan sasaran cairan. 'Ke atas kepalanya' jelas dan idiomatis dalam bahasa Indonesia.
- source_word: וּמָשַׁחְתָּ אֹתוֹ
  choice: dan urapilah dia
  rationale: משׁח adalah verba baku untuk tindakan ritual 'mengurapi'. Terjemahan ini mempertahankan tindakan konsekrasi yang disebutkan secara eksplisit, tanpa menggantinya dengan tafsiran seperti 'khususkanlah'.
theological_decisions:
- issue: Hubungan antara tindakan menuangkan dan mengurapi
  choice: 'Kedua tindakan dipertahankan secara tersendiri: ''tuangkanlah ... dan urapilah dia''.'
  alternative: Menggabungkannya menjadi satu gagasan, misalnya 'urapilah dia dengan menuangkan minyak itu ke atas kepalanya'.
  rationale: Teks Ibrani memakai dua verba yang dikoordinasikan. Mempertahankan keduanya menjaga bentuk tindakan fisik sekaligus tindakan ritualnya tanpa menentukan bahwa keduanya hanyalah dua cara menyebut tindakan yang sama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Rangkaian imperatif dengan enklitik '-lah' sesuai untuk petunjuk ritual yang berwibawa tanpa terdengar kuno. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual atau leksikal penting yang harus ditampilkan kepada pembaca.
