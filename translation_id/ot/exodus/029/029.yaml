base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/029.yaml
  text: And the holy garments that are Aaron’s shall belong to his sons after him[a], for anointing in them and for ordaining them in them.
translation:
  language: id
  text: Dan pakaian kudus milik Harun akan menjadi milik anak-anaknya sepeninggalnya, supaya mereka diurapi dengan mengenakannya dan ditahbiskan dengan mengenakannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, "mengisi tangan mereka," suatu ungkapan Ibrani untuk menahbiskan atau melantik mereka sebagai imam.
    reason: Menjelaskan idiom teknis מלא את־יד yang diterjemahkan secara fungsional dalam teks utama.
lexical_decisions:
- source_word: בִגְדֵי הַקֹּדֶשׁ
  choice: pakaian kudus
  rationale: Ungkapan ini menunjuk pada pakaian yang dikhususkan bagi pelayanan imam. 'Pakaian kudus' alami dalam bahasa Indonesia dan mempertahankan gagasan kekudusan ritual.
- source_word: אֲשֶׁר לְאַהֲרֹן
  choice: milik Harun
  rationale: Preposisi לְ menyatakan kepunyaan atau peruntukan. 'Milik Harun' ringkas dan jelas.
- source_word: יִהְיוּ לְבָנָיו אַחֲרָיו
  choice: harus menjadi milik anak-anaknya sesudah dia
  rationale: Klausa ini menyatakan peralihan pakaian kepada keturunan Harun dalam suksesi jabatan imam. 'Harus menjadi' menyampaikan daya modal bentuk imperfek dalam konteks perintah ini.
- source_word: לְמָשְׁחָה בָהֶם
  choice: supaya mereka diurapi dengan mengenakannya
  rationale: בָהֶם paling wajar menunjukkan bahwa pengurapan dilakukan ketika mereka memakai pakaian itu, bukan bahwa pakaian tersebut menjadi alat pengurapan. Ungkapan ini menjelaskan relasi tersebut secara alami.
- source_word: וּלְמַלֵּא בָם אֶת יָדָם
  choice: dan ditahbiskan dengan mengenakannya
  rationale: מלא את־יד adalah idiom teknis bagi pelantikan atau penahbisan imam. Terjemahan fungsional diperlukan dalam teks utama agar dapat dipahami secara alami; gambaran harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan idiom pelantikan imam מלא את־יד
  choice: ditahbiskan
  alternative: dipenuhi tangannya; dilantik
  rationale: '''Ditahbiskan'' menyampaikan fungsi ritual resmi dalam konteks keimaman tanpa menyiratkan bahwa tangan secara fisik diisi. Catatan kaki mempertahankan bentuk harfiah Ibrani dan alternatif ''dilantik''.'
- issue: Makna בָהֶם / בָם sehubungan dengan pakaian
  choice: dengan mengenakannya
  alternative: di dalamnya; dengan pakaian itu
  rationale: 'Preposisi ב di sini paling mungkin bersifat situasional: para penerus diurapi dan ditahbiskan saat mengenakan pakaian tersebut. Rumusan ini menghindari kesan bahwa pakaian adalah bahan atau alat pengurapan.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan struktur yang mudah dipahami. Bentuk tunggal kolektif 'pakaian' diacu dengan '-nya'; pengulangan 'dengan mengenakannya' mempertahankan kedua frasa Ibrani tanpa menimbulkan kesan bahwa pakaian menjadi alat pengurapan atau penahbisan.
