  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/פַ֨ר חַטָּ֜את תַּעֲשֶׂ֤ה לַ/יּוֹם֙ עַל הַ/כִּפֻּרִ֔ים וְ/חִטֵּאתָ֙ עַל הַ/מִּזְבֵּ֔חַ בְּ/כַפֶּרְ/ךָ֖ עָלָ֑י/ו וּ/מָֽשַׁחְתָּ֥ אֹת֖/וֹ לְ/קַדְּשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/036.yaml
  text: And each day you shall offer a bull as a sin offering for atonement[a], and you shall purify the altar when you make atonement for it, and you shall anoint it to consecrate it.
translation:
  language: id
  text: Setiap hari haruslah engkau mempersembahkan seekor sapi jantan sebagai kurban penghapus dosa untuk pendamaian.[a] Engkau harus menyucikan mazbah itu ketika engkau mengadakan pendamaian atasnya, lalu mengurapinya untuk menguduskannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban penyucian.” Istilah Ibrani חַטָּאת dapat berarti “dosa” atau, dalam konteks persembahan, kurban yang dipakai untuk penyucian dari dosa atau kenajisan.
    reason: lexical_alternative
lexical_decisions:
- source_word: פַר
  choice: seekor sapi jantan
  rationale: Istilah ini menunjuk kepada sapi jantan; teks tidak mengharuskan penambahan bahwa hewan itu masih muda.
- source_word: חַטָּאת
  choice: kurban penghapus dosa
  rationale: Dalam konteks persembahan, istilah ini menunjuk kepada kurban yang berkaitan dengan penghapusan dosa dan penyucian, bukan kepada dosa sebagai gagasan abstrak.
- source_word: לַיּוֹם
  choice: setiap hari
  rationale: Konteks ritual yang berulang mendukung makna distributif, yakni tindakan yang dilakukan setiap hari.
- source_word: עַל הַכִּפֻּרִים
  choice: untuk pendamaian
  rationale: Bentuk jamak Ibrani merujuk kepada ritus pendamaian atau penyucian; bentuk tunggal abstrak lebih alami dalam bahasa Indonesia.
- source_word: וְחִטֵּאתָ
  choice: engkau harus menyucikan
  rationale: Bentuk piel dari חטא dalam konteks kultis berarti membersihkan atau menyucikan secara ritual. Mazbah bukan pelaku dosa yang memerlukan pengampunan moral.
- source_word: הַמִּזְבֵּחַ
  choice: mazbah
  rationale: Mazbah adalah istilah Indonesia yang mapan dan tepat untuk tempat persembahan korban dalam konteks Kemah Suci.
- source_word: בְּכַפֶּרְךָ עָלָיו
  choice: ketika engkau mengadakan pendamaian baginya
  rationale: Preposisi ב dengan infinitif dapat bernilai temporal atau instrumental. Terjemahan temporal dipilih, sedangkan pronomina dipahami merujuk kepada mazbah.
- source_word: וּמָשַׁחְתָּ
  choice: lalu mengurapinya
  rationale: Mengurapi merupakan istilah ritual yang tepat untuk penggunaan minyak dalam penahbisan benda kudus.
- source_word: לְקַדְּשׁוֹ
  choice: untuk menguduskannya
  rationale: Kata קדשׁ di sini berarti menjadikan atau menetapkan mazbah itu kudus bagi penggunaan sakral.
theological_decisions:
- issue: Bahasa penyucian dan pendamaian kultis tanpa memasukkan kategori doktrinal yang lebih kemudian
  choice: Memakai “kurban penghapus dosa,” “menyucikan,” dan “mengadakan pendamaian” dalam arti ritual Kemah Suci
  alternative: Memakai “kurban penyucian” dan menerjemahkan וְחִטֵּאתָ sebagai “membersihkan dari dosa”
  rationale: Pilihan ini mempertahankan kategori ritual Ibrani dan membedakan penyucian mazbah dari pengampunan moral, sambil tetap menggunakan ungkapan yang dapat dipahami pembaca Indonesia.
- issue: Rujukan pronomina dalam בְּכַפֶּרְךָ עָלָיו
  choice: 'Memahami עָלָיו sebagai merujuk kepada mazbah: “baginya”'
  alternative: 'Memahami frasa itu secara lokatif: “di atasnya”'
  rationale: Rujukan kepada mazbah paling sesuai dengan objek tindakan penyucian dalam klausa tersebut, tetapi bentuk Ibraninya memungkinkan nuansa lokatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “engkau” mempertahankan sapaan tunggal kepada Musa. Istilah ritual “mazbah,” “pendamaian,” “mengurapi,” dan “menguduskan” dipertahankan karena mapan serta sesuai dengan konteks Kemah Suci.
