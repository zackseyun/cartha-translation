revisions:
- from: Setiap hari haruslah engkau mempersembahkan seekor sapi jantan sebagai kurban penghapus dosa untuk pendamaian.[a] Engkau harus menyucikan mazbah itu ketika engkau mengadakan pendamaian baginya, lalu mengurapinya untuk menguduskannya.
  to: Setiap hari haruslah engkau mempersembahkan seekor sapi jantan sebagai kurban penghapus dosa untuk pendamaian.[a] Engkau harus menyucikan mazbah itu ketika engkau mengadakan pendamaian atasnya, lalu mengurapinya untuk menguduskannya.
  rationale: Revisi terbatas pada “baginya” menjadi “atasnya.” Ini lebih dekat dengan עָלָיו, lebih wajar bagi tindakan ritual yang dilakukan pada mazbah, dan tetap tidak memaksakan apakah preposisi בְּ pada infinitif dipahami secara temporal atau instrumental. Selebihnya, draft setia pada sumber dan memakai register Indonesia modern yang sesuai.
