    rationale: Preposisi לְ di sini lebih tepat menyatakan status/ketetapan yang melekat pada keimaman (“sebagai ketetapan ...”), bukan dasar kausal atau legal (“berdasarkan”).
  - severity: low
    issue: “Pasanglah penutup kepala” kurang mencerminkan tindakan mengenakan atau mengikat pada kepala.
    rationale: חבש dalam konteks ini menunjuk pada tindakan mengenakan/mengikat tutup kepala. “Kenakanlah” tetap netral mengenai bentuk penutup kepala dan lebih idiomatis.
