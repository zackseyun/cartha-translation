  terminology: “Harun,” “jabatan imam,” dan “menahbiskan” dapat dipertahankan. “Penutup kepala” dengan tepat tidak memaksakan identifikasi dengan serban imam besar. Frasa durasi perlu memakai padanan yang menyatakan ketetapan itu sendiri, sambil tidak mengharuskan penafsiran filosofis di luar konteks hukum-kultis.
