  source_fidelity: 'Terjemahan pada umumnya mengikuti teks Ibrani dengan baik: tindakan mengenakan ikat pinggang dan penutup kepala, penetapan keimaman bagi Harun dan anak-anaknya, serta idiom pentahbisan semuanya terwakili. Namun, “berdasarkan ketetapan untuk seterusnya” menggeser fungsi לְחֻקַּת עוֹלָם: frasa itu menyatakan keimaman sebagai ketetapan yang berlaku terus, bukan dasar atau alasan administratif bagi kepemilikan jabatan tersebut.'
