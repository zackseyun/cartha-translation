revisions:
- from: Ikatkanlah ikat pinggang pada mereka, yakni Harun dan anak-anaknya, dan pasanglah penutup kepala pada mereka. Jabatan imam itu akan menjadi milik mereka berdasarkan ketetapan untuk seterusnya. Demikianlah engkau harus menahbiskan Harun dan anak-anaknya.[a]
  to: Ikatkanlah ikat pinggang pada mereka, yakni Harun dan anak-anaknya, dan kenakanlah penutup kepala pada mereka. Jabatan imam itu akan menjadi milik mereka sebagai ketetapan untuk selama-lamanya. Demikianlah engkau harus menahbiskan Harun dan anak-anaknya.[a]
  rationale: Revisi memperbaiki fungsi sintaktis לְחֻקַּת עוֹלָם menjadi “sebagai ketetapan untuk selama-lamanya,” yang lebih dekat dengan teks sumber dan tetap mempertahankan keluasan makna עוֹלָם. Kata kerja bagi penutup kepala diubah menjadi “kenakanlah” agar lebih alami dan sesuai konteks. Catatan kaki tetap diperlukan dan jangkar [a] tetap ditempatkan pada “menahbiskan,” padanan idiom וּמִלֵּאתָ יַד.
