  text: וְ/חָגַרְתָּ֩ אֹתָ֨/ם אַבְנֵ֜ט אַהֲרֹ֣ן וּ/בָנָ֗י/ו וְ/חָבַשְׁתָּ֤ לָ/הֶם֙ מִגְבָּעֹ֔ת וְ/הָיְתָ֥ה לָ/הֶ֛ם כְּהֻנָּ֖ה לְ/חֻקַּ֣ת עוֹלָ֑ם וּ/מִלֵּאתָ֥ יַֽד אַהֲרֹ֖ן וְ/יַד בָּנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/009.yaml
  text: You shall fasten sashes on them[a], on Aaron and on his sons, and you shall bind caps on them. The priesthood shall belong to them as a permanent statute. So you shall ordain Aaron and his sons.
translation:
  language: id
  text: Ikatkanlah ikat pinggang pada mereka, yakni Harun dan anak-anaknya, dan kenakanlah penutup kepala pada mereka. Jabatan imam itu akan menjadi milik mereka sebagai ketetapan untuk selama-lamanya. Demikianlah engkau harus menahbiskan Harun dan anak-anaknya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memenuhi tangan Harun dan tangan anak-anaknya,” sebuah ungkapan Ibrani untuk melantik atau menahbiskan mereka dalam pelayanan sebagai imam.
    reason: lexical_alternative
lexical_decisions:
- source_word: חָגַרְתָּ ... אַבְנֵט
  choice: ikatkanlah ikat pinggang
  rationale: Kata חגר bersama אַבְנֵט menunjuk pada tindakan mengenakan dan mengikat ikat pinggang atau selempang imam. Ungkapan ini alami dalam bahasa Indonesia dan tetap memperlihatkan tindakan yang dimaksud.
- source_word: אַהֲרֹן וּבָנָיו
  choice: yakni Harun dan anak-anaknya
  rationale: Frasa ini menjelaskan acuan kata ganti 'mereka'. 'Yakni' menyatakan hubungan aposisional itu dengan jelas tanpa mengubah makna.
- source_word: חָבַשְׁתָּ לָהֶם מִגְבָּעֹת
  choice: pasanglah penutup kepala pada mereka
  rationale: חבש berarti memasang atau mengikat pada kepala, sedangkan מִגְבָּעוֹת adalah penutup kepala para imam yang dibedakan dari serban imam besar. 'Penutup kepala' mempertahankan pembedaan tersebut tanpa menentukan bentuknya secara berlebihan.
- source_word: וְהָיְתָה לָהֶם כְּהֻנָּה
  choice: Jabatan imam itu akan menjadi milik mereka
  rationale: Konstruksi הָיְתָה לָהֶם menyatakan kepemilikan atau penetapan bagi mereka. 'Jabatan imam' lebih jelas dalam bahasa Indonesia daripada nomina abstrak 'keimaman' dan tetap menunjuk pada kedudukan kultis tersebut.
- source_word: לְחֻקַּת עוֹלָם
  choice: berdasarkan ketetapan untuk seterusnya
  rationale: חֻקָּה adalah ketetapan yang mengikat, sedangkan עוֹלָם dalam konteks hukum-kultis menyatakan keberlangsungan tanpa menetapkan di dalam terjemahan suatu kesimpulan filosofis tentang kekekalan mutlak.
- source_word: וּמִלֵּאתָ יַד
  choice: menahbiskan
  rationale: Secara harfiah idiom ini berarti 'memenuhi tangan' dan merupakan ungkapan teknis untuk melantik atau menahbiskan seseorang ke dalam pelayanan imam. 'Menahbiskan' menyampaikan fungsinya secara ringkas; bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Jangka waktu dalam לְחֻקַּת עוֹלָם
  choice: berdasarkan ketetapan untuk seterusnya
  alternative: sebagai ketetapan untuk selama-lamanya
  rationale: '''Untuk seterusnya'' mempertahankan daya hukum yang berkelanjutan dalam tatanan perjanjian Israel, tanpa diam-diam memutuskan apakah עוֹלָם di sini harus dipahami sebagai kekekalan mutlak tanpa batas.'
- issue: Idiom pelantikan imam וּמִלֵּאתָ יַד
  choice: menahbiskan Harun dan anak-anaknya
  alternative: memenuhi tangan Harun dan tangan anak-anaknya
  rationale: Idiom Ibrani ini bersifat teknis dan kultis. Terjemahan fungsional 'menahbiskan' dapat dipahami pembaca modern, sedangkan gambaran harfiahnya dipertahankan dalam catatan kaki demi keterlacakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk perintah dengan -lah mempertahankan nada instruksi ritual. Istilah 'penutup kepala' dipilih agar tidak menyamakan מִגְבָּעוֹת milik para imam dengan serban khusus imam besar.
