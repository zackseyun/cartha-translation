  text: וְ/אֶת אַהֲרֹ֤ן וְ/אֶת בָּנָי/ו֙ תַּקְרִ֔יב אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/רָחַצְתָּ֥ אֹתָ֖/ם בַּ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/004.yaml
  text: You shall bring Aaron and his sons near to the entrance of the tent of meeting[a], and you shall wash them with water.
translation:
  language: id
  text: Bawalah Harun dan putra-putranya ke pintu masuk Kemah Pertemuan[a], lalu basuhlah mereka dengan air.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hadapkanlah Harun dan putra-putranya.” Kata kerja Ibrani ini dapat mengandung arti kultis formal, yaitu menghadapkan seseorang untuk suatu tindakan ritual.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּקְרִיב
  choice: bawalah ... mendekat
  rationale: Bentuk Hifil dari קרב berarti membawa dekat atau mempersembahkan/menghadapkan. Ungkapan ini mempertahankan nuansa pendekatan ritual dalam pentahbisan imam dan tetap alami dalam bahasa Indonesia.
- source_word: אֶל
  choice: ke
  rationale: Preposisi ini menyatakan gerak menuju suatu tempat; 'ke' merupakan padanan Indonesia yang wajar.
- source_word: פֶּתַח
  choice: pintu masuk
  rationale: Kata ini menunjuk pada bukaan atau jalan masuk, tanpa harus menyiratkan adanya daun pintu.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Sebutan baku dan jelas untuk kemah suci sebagai tempat pertemuan yang ditetapkan.
- source_word: וְרָחַצְתָּ
  choice: lalu basuhlah
  rationale: רחץ berarti membasuh atau memandikan. Dalam rangkaian petunjuk ritual, 'lalu' menyatakan urutan tindakan, sedangkan bentuk imperatif menyampaikan daya perintahnya secara alami.
- source_word: בַּמָּיִם
  choice: dengan air
  rationale: Preposisi ב di sini menyatakan sarana; 'dengan air' adalah ungkapan Indonesia yang jelas dan alami.
- source_word: אַהֲרֹן
  choice: Harun
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: בָּנָיו
  choice: anak-anaknya
  rationale: Dalam konteks ini kata tersebut merujuk kepada putra-putra Harun yang akan ditahbiskan. Bentuk 'anak-anaknya' alami dalam bahasa Indonesia, sementara konteks keimaman menjelaskan rujukan laki-lakinya.
theological_decisions:
- issue: Nuansa kultis קרב dalam konteks pentahbisan imam
  choice: bawalah Harun dan anak-anaknya mendekat
  alternative: hadapkanlah Harun dan anak-anaknya
  rationale: '''Mendekat'' mempertahankan gambaran gerak menuju tempat kudus sekaligus nuansa ritual tanpa menetapkan bahwa verba itu semata-mata berarti tindakan formal ''mempersembahkan'' atau ''menghadapkan''.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Imperatif 'bawalah' dan 'basuhlah' cocok untuk petunjuk ritual. Kapitalisasi 'Kemah Pertemuan' menandai nama tempat kudus tertentu.
