base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/030.yaml
  text: For seven days the priest from among his sons who succeeds him shall put them on[c][b][a], when he enters the tent of meeting to minister in the holy place.
translation:
  language: id
  text: Selama tujuh hari, imam dari antara anak-anaknya yang menggantikannya[b] akan mengenakan pakaian itu[a] ketika ia masuk ke Kemah Pertemuan untuk melayani di tempat kudus.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “akan memakai pakaian itu.” Kata kerja Ibraninya dapat berarti mengenakan atau memakai, bergantung pada konteks.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “imam di tempatnya dari antara anak-anaknya,” yaitu imam yang menggantikannya.
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan “di tempat suci.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעַת יָמִים
  choice: Selama tujuh hari
  rationale: Frasa ini menyatakan jangka waktu. Kata “selama” mengungkapkan fungsi duratifnya secara alami dalam bahasa Indonesia.
- source_word: יִלְבָּשָׁם
  choice: harus mengenakan pakaian-pakaian itu
  rationale: Kata kerja לָבַשׁ dapat berarti memakai atau mengenakan. Akhiran objek jamak merujuk pada pakaian imam dalam konteks sebelumnya; penyebutan “pakaian-pakaian itu” memperjelas acuannya tanpa menambah unsur baru.
- source_word: הַכֹּהֵן תַּחְתָּיו מִבָּנָיו
  choice: imam dari antara anak-anaknya yang menggantikannya
  rationale: 'תַּחְתָּיו secara harfiah berarti “di tempatnya” dan dalam konteks ini menunjuk pada penggantian dalam jabatan imam. מִבָּנָיו mempertahankan makna partitif: pengganti itu berasal dari antara anak-anaknya.'
- source_word: אֲשֶׁר יָבֹא
  choice: ketika ia masuk
  rationale: Klausa relatif Ibrani ini secara kontekstual menyatakan keadaan atau waktu saat imam pengganti memasuki Kemah Pertemuan untuk bertugas.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Padanan baku dan jelas untuk nama tempat ibadah Israel ini; huruf kapital menandai sebutan khusus.
- source_word: לְשָׁרֵת
  choice: untuk melayani
  rationale: Dalam konteks keimaman, kata ini menunjuk pada pelaksanaan pelayanan resmi di tempat ibadah. “Melayani” tetap alami dan cukup bermartabat dalam bahasa Indonesia.
- source_word: בַּקֹּדֶשׁ
  choice: di tempat kudus
  rationale: Padanan ini mempertahankan rujukan konkret kepada ruang sakral, sekaligus membiarkan kemungkinan cakupan istilah Ibrani dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Bahasa tentang pergantian imam
  choice: imam dari antara anak-anaknya yang menggantikannya
  alternative: imam di tempatnya dari antara anak-anaknya
  rationale: Terjemahan utama menyampaikan pergantian jabatan dalam garis keluarga yang dinyatakan teks, tanpa memasukkan gagasan teologis tentang suksesi di luar konteks keimaman Harun.
- issue: Lokasi pelayanan dalam בַּקֹּדֶשׁ
  choice: di tempat kudus
  alternative: di tempat suci; di tempat kudus itu
  rationale: Ungkapan ini mempertahankan rujukan ruang ibadah yang konkret. Karena istilah Ibrani dapat juga dipahami lebih umum sebagai kawasan suci, alternatif tersebut dicatat dan tidak diselesaikan secara dogmatis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat mudah dipahami sambil mempertahankan jangka waktu, garis keluarga imam, tujuan pelayanan, dan ketaksaan leksikal utama teks Ibrani.
