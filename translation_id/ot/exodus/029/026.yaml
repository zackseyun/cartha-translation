  terminology: “Yahweh,” “domba jantan,” “dada,” dan “persembahan unjukan” sesuai dan konsisten dengan istilah sumber. Catatan kaki secara tepat menyatakan “pengudusan” sebagai alternatif serta menjelaskan fungsi istilah teknis tersebut. “Unjukkanlah ... sebagai persembahan unjukan” mempertahankan keterkaitan kata kerja-nomina ritual dalam bahasa Indonesia.
