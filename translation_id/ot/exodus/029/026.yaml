revisions:
- from: Kemudian ambillah dada dari domba jantan penahbisan[a] yang diperuntukkan bagi Harun, lalu unjukkanlah itu sebagai persembahan unjukan di hadapan Yahweh; bagian itu akan menjadi bagianmu.
  to: Kemudian ambillah dada dari domba jantan untuk penahbisan[a] yang diperuntukkan bagi Harun, lalu unjukkanlah itu sebagai persembahan unjukan di hadapan Yahweh; dan itu akan menjadi bagianmu.
  rationale: Revisi terbatas pada kelancaran bahasa Indonesia modern. “Untuk penahbisan” mempertahankan fungsi ritual istilah Ibrani tanpa kekakuan konstruksi nominal sebelumnya, sedangkan “itu akan menjadi bagianmu” menghilangkan tautologi sambil mempertahankan makna alokasi ritual dalam teks sumber.
