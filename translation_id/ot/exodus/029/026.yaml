  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לָקַחְתָּ֣ אֶת הֶֽ/חָזֶ֗ה מֵ/אֵ֤יל הַ/מִּלֻּאִים֙ אֲשֶׁ֣ר לְ/אַהֲרֹ֔ן וְ/הֵנַפְתָּ֥ אֹת֛/וֹ תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה וְ/הָיָ֥ה לְ/ךָ֖ לְ/מָנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/026.yaml
  text: Then you shall take the breast from the ram of ordination that is for Aaron[a], and you shall wave it as a wave offering before Yahweh; and it shall be your portion.
translation:
  language: id
  text: Kemudian ambillah dada dari domba jantan untuk penahbisan[a] yang diperuntukkan bagi Harun, lalu unjukkanlah itu sebagai persembahan unjukan di hadapan Yahweh; dan itu akan menjadi bagianmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “domba jantan pengudusan.” Istilah teknis Ibrani ini menunjuk pada domba jantan yang digunakan dalam upacara pelantikan imam.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶחָזֶה
  choice: dada
  rationale: Dalam konteks kurban, חָזֶה menunjuk pada bagian dada hewan yang secara khusus dialokasikan menurut ketentuan keimaman.
- source_word: אֵיל הַמִּלֻּאִים
  choice: domba jantan penahbisan
  rationale: Ungkapan ini merupakan istilah teknis bagi domba jantan yang digunakan dalam upacara pelantikan Harun sebagai imam. 'Penahbisan' menyampaikan dimensi pelantikan ke dalam jabatan tanpa menerjemahkan bentuk harfiahnya secara kabur.
- source_word: אֲשֶׁר לְאַהֲרֹן
  choice: yang diperuntukkan bagi Harun
  rationale: Frasa ini menghubungkan domba jantan tersebut dengan Harun tanpa memaksakan arti kepemilikan.
- source_word: וְהֵנַפְתָּ אֹתוֹ תְּנוּפָה
  choice: unjukkanlah itu sebagai persembahan unjukan
  rationale: Kata kerja dan nomina serumpun ini membentuk ungkapan ritual tetap. Pengulangan akar 'unjuk' mempertahankan hubungan formal keduanya dan tetap dapat dipahami dalam bahasa Indonesia.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Dalam konteks ibadah, לִפְנֵי secara alami berarti 'di hadapan', sedangkan nama ilahi יְהוָה ditransliterasikan sebagai 'Yahweh'.
- source_word: וְהָיָה לְךָ לְמָנָה
  choice: bagian itu akan menjadi bagianmu
  rationale: מָנָה berarti bagian atau jatah yang dialokasikan. Susunan ini memperjelas bahwa bagian dada tersebut menjadi jatah penerima perintah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama diri, bukan menggantinya dengan gelar.
- issue: Istilah teknis הַמִּלֻּאִים dalam upacara pelantikan imam
  choice: penahbisan
  alternative: pengudusan
  rationale: Konteksnya ialah pelantikan Harun ke dalam jabatan imam. 'Penahbisan' menonjolkan dimensi pelantikan jabatan, sementara 'pengudusan' tetap mungkin dan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada instruksional-khidmat. Bentuk imperatif '-lah' mencerminkan daya perintah dalam rangkaian hukum ritual. Istilah 'persembahan unjukan' dipertahankan sebagai istilah kultis yang ringkas dan konsisten.
