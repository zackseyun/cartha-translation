  source_fidelity: 'Pada umumnya setia pada teks Ibrani: חָזֶה diterjemahkan “dada,” אַיִל “domba jantan,” istilah ritual מִלֻּאִים ditangani sebagai penahbisan, tindakan תְּנוּפָה dipertahankan sebagai unjukan, dan nama ilahi diterjemahkan “Yahweh.” Frasa “yang diperuntukkan bagi Harun” secara wajar menyampaikan אֲשֶׁר לְאַהֲרֹן tanpa memaksakan kepemilikan. Namun, pengulangan “bagian itu akan menjadi bagianmu” menambahkan pengulangan leksikal yang tidak diperlukan; pronomina Ibrani cukup diterjemahkan “itu.”'
