  text: וְ/הָיָה֩ לְ/אַהֲרֹ֨ן וּ/לְ/בָנָ֜י/ו לְ/חָק עוֹלָ֗ם מֵ/אֵת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כִּ֥י תְרוּמָ֖ה ה֑וּא וּ/תְרוּמָ֞ה יִהְיֶ֨ה מֵ/אֵ֤ת בְּנֵֽי יִשְׂרָאֵל֙ מִ/זִּבְחֵ֣י שַׁלְמֵי/הֶ֔ם תְּרוּמָתָ֖/ם לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/028.yaml
  text: It shall belong to Aaron and to his sons as a permanent statute from the Israelites[a], for it is a contribution; it shall be a contribution from the Israelites, from the sacrifices of their peace offerings, their contribution to Yahweh.
translation:
  language: id
  text: Bagian itu akan menjadi hak tetap bagi Harun dan anak-anaknya, yang diberikan oleh orang Israel, sebab bagian itu adalah persembahan khusus. Bagian itu akan menjadi persembahan khusus dari orang Israel, dari kurban-kurban persembahan keselamatan mereka[a], sebagai persembahan khusus mereka kepada TUHAN.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “persembahan damai” atau “persembahan persekutuan”. Istilah Ibrani ini mengandung gagasan tentang damai, keutuhan, kesejahteraan, dan hubungan yang dipulihkan.
    reason: Menjaga keluasan makna istilah שְׁלָמִים dan menyediakan padanan ritual alternatif.
lexical_decisions:
- source_word: וְהָיָה לְאַהֲרֹן וּלְבָנָיו
  choice: Bagian itu harus menjadi hak Harun dan anak-anaknya
  rationale: Secara harfiah, frasa ini berarti 'dan itu akan menjadi bagi Harun dan anak-anaknya'. Dalam konteks pembagian kurban, bentuk לְ menyatakan peruntukan atau hak; penambahan 'Bagian itu' memperjelas acuan dari ayat sebelumnya tanpa mengubah makna.
- source_word: לְחָק עוֹלָם
  choice: sebagai ketetapan tetap
  rationale: חֹק menunjuk pada ketetapan atau bagian yang ditentukan, sedangkan עוֹלָם dalam konteks hukum ritual menyatakan keberlakuan yang terus-menerus. 'Ketetapan tetap' mempertahankan daya hukum tanpa menyiratkan pembahasan filosofis tentang kekekalan.
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: dari orang Israel
  rationale: Ungkapan idiomatis בְּנֵי יִשְׂרָאֵל secara alami merujuk kepada orang Israel sebagai umat.
- source_word: תְרוּמָה
  choice: persembahan khusus
  rationale: תְרוּמָה adalah bagian yang dipisahkan dan dipersembahkan, sering kali sebagai bagian yang diangkat. 'Persembahan khusus' mudah dipahami dan membedakannya dari istilah umum untuk segala jenis persembahan.
- source_word: וּתְרוּמָה יִהְיֶה
  choice: Bagian itu harus menjadi persembahan khusus
  rationale: Pengulangan istilah תְרוּמָה dipertahankan karena menegaskan status ritual bagian tersebut.
- source_word: מִזִּבְחֵי שַׁלְמֵיהֶם
  choice: yang diambil dari kurban persembahan keselamatan mereka
  rationale: Terjemahan ini mencerminkan konstruksi 'dari kurban-kurban persembahan keselamatan mereka'. Kata 'keselamatan' mempertahankan hubungan שְׁלָמִים dengan damai, keutuhan, dan kesejahteraan, sementara alternatif yang wajar dicatat dalam catatan kaki.
- source_word: תְּרוּמָתָם לַיהוָה
  choice: sebagai persembahan khusus mereka kepada TUHAN
  rationale: Akhiran pronominal dipertahankan melalui 'mereka', dan לְ diterjemahkan 'kepada' untuk menyatakan arah persembahan.
- source_word: יהוה
  choice: TUHAN
  rationale: Bentuk TUHAN mengikuti konvensi Alkitab bahasa Indonesia untuk nama ilahi YHWH dan menjaga kesinambungan dengan tradisi pembacaan yang penuh hormat.
theological_decisions:
- issue: Makna istilah ritual שְׁלָמִים
  choice: persembahan keselamatan
  alternative: persembahan damai atau persembahan persekutuan
  rationale: Istilah ini berkaitan dengan damai, keutuhan, kesejahteraan, dan persekutuan. Teks utama memakai istilah yang cukup mapan dan ringkas, sedangkan catatan kaki menjaga keluasan maknanya tanpa membatasi istilah itu pada satu penafsiran teologis.
- issue: Penerjemahan nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH atau Yahweh
  rationale: TUHAN adalah konvensi baku dalam banyak Alkitab Indonesia dan mencerminkan tradisi pembacaan nama ilahi dengan sebutan pengganti, tanpa membuat klaim mengenai pelafalan kunonya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah ritual dibuat cukup jelas bagi pembaca umum; pengulangan hukum dalam bahasa sumber dipertahankan. Penanda catatan kaki [a] ditempatkan langsung setelah istilah yang dijelaskan.
