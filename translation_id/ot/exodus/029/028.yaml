  terminology: “TUHAN” konsisten untuk יהוה. “Persembahan khusus” dapat dipakai untuk תְּרוּמָה sebagai persembahan yang dipisahkan. “Persembahan keselamatan” dipertahankan sebagai istilah ritual yang telah dikenal, dengan alternatif semantis pada catatan kaki.
