  source_fidelity: 'Makna pokok dan pengulangan תְּרוּמָה dipertahankan. Namun, frasa “sebagai ketetapan tetap dari orang Israel” kurang tepat menangkap לְחָק עוֹלָם מֵאֵת בְּנֵי יִשְׂרָאֵל: konteksnya menyatakan hak/tunjangan tetap bagi Harun dan anak-anaknya yang berasal dari orang Israel, bukan terutama suatu ketetapan yang berasal dari mereka.'
