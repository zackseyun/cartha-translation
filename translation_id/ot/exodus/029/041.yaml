  text: וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֣ין הָ/עַרְבָּ֑יִם כְּ/מִנְחַ֨ת הַ/בֹּ֤קֶר וּ/כְ/נִסְכָּ/הּ֙ תַּֽעֲשֶׂה לָּ֔/הּ לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/029/041.yaml
  text: And you shall offer the second lamb at twilight[a]; you shall offer for it its grain offering and its drink offering, as in the morning, as a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: id
  text: Domba yang kedua harus kaupersembahkan pada waktu senja[a]. Persembahkanlah untuknya kurban sajian dan kurban curahan seperti pada pagi hari, sebagai aroma yang menyenangkan, sebagai persembahan yang dipersembahkan dengan api bagi Yahweh[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di antara kedua petang”, sebuah ungkapan Ibrani untuk waktu sore menjelang malam atau senja.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “persembahan makanan”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֶּבֶשׂ הַשֵּׁנִי
  choice: domba yang kedua
  rationale: כֶּבֶשׂ menunjuk pada domba muda yang layak dikurbankan; bentuk ordinal mempertahankan urutan dengan domba pertama pada ayat sebelumnya.
- source_word: תַּעֲשֶׂה
  choice: harus kaupersembahkan / persembahkanlah
  rationale: Arti dasarnya ialah ‘melakukan/membuat’, tetapi dalam konteks tata kurban, ‘mempersembahkan’ menyampaikan fungsi kultisnya secara wajar dalam bahasa Indonesia.
- source_word: בֵּין הָעַרְבָּיִם
  choice: pada waktu senja
  rationale: Ungkapan harfiahnya ‘di antara kedua petang’ dan menunjuk pada rentang sore menjelang malam; bentuk harfiahnya dipertahankan dalam catatan kaki.
- source_word: מִנְחַת הַבֹּקֶר
  choice: kurban sajian ... seperti pada pagi hari
  rationale: Dalam hukum kurban, מִנְחָה adalah persembahan hasil pangan, terutama tepung atau biji-bijian; ‘kurban sajian’ merupakan istilah Indonesia yang ringkas dan membedakannya dari kurban hewan.
- source_word: נִסְכָּהּ
  choice: kurban curahan
  rationale: נֶסֶךְ ialah cairan yang dicurahkan sebagai persembahan; ‘kurban curahan’ jelas dan mempertahankan tindakan ritualnya.
- source_word: לְרֵיחַ נִיחֹחַ
  choice: sebagai aroma yang menyenangkan
  rationale: Ungkapan kurban yang tetap ini menggambarkan aroma yang menyenangkan atau menenteramkan; pilihan ini mempertahankan metafora tanpa menjelaskan secara berlebihan kepada siapa aroma itu menyenangkan.
- source_word: אִשֶּׁה
  choice: persembahan yang dibakar
  rationale: Istilah kultis ini lazim dikaitkan dengan api dan menunjuk pada persembahan yang dibakar. Kemungkinan pemahaman sebagai ‘persembahan berupa makanan’ dicatat agar ambiguitas leksikal tidak dihapus.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama diri ilahi secara langsung; ‘Yahweh’ mempertahankan nama itu dan sesuai dengan lapisan konsultasi POB.
- issue: Makna kultis אִשֶּׁה
  choice: persembahan yang dibakar
  alternative: persembahan berupa makanan
  rationale: Pilihan utama mempertahankan kaitan tradisional istilah tersebut dengan api tanpa menyamakannya dengan kategori khusus kurban bakaran; alternatif yang didukung secara leksikal disajikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Bentuk ‘kaupersembahkan’ dipilih untuk sapaan orang kedua tunggal yang tersirat dalam verba Ibrani. Istilah ritual ‘kurban sajian’ dan ‘kurban curahan’ dipakai secara konsisten, sementara susunan kalimat dibuat alami tanpa menghilangkan unsur persembahan pendamping.
