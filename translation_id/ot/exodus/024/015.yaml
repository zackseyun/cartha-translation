translation:
  language: id
  text: Lalu Musa naik ke gunung itu[a], dan awan menutupi gunung itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Musa naik ke gunung itu.” Konjungsi naratif Ibrani dapat diterjemahkan “dan” atau, seperti dalam teks utama, “lalu”. Preposisi Ibrani berarti “ke”; dengan kata “naik”, frasa ini juga dapat diungkapkan “naik menuju gunung itu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: Lalu ... naik
  rationale: Kata kerja עלה menyatakan gerak naik; bentuk naratif berawalan waw melanjutkan urutan peristiwa. 'Lalu ... naik' alami dalam bahasa Indonesia modern.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk baku nama tokoh ini dalam tradisi dan bahasa Indonesia.
- source_word: אֶל
  choice: ke
  rationale: Preposisi ini menyatakan arah menuju gunung. Bersama kata 'naik', bahasa Indonesia 'naik ke gunung' dapat mencakup gerak menuju dan memasuki kawasan gunung tanpa memaksakan rincian spasial.
- source_word: הָהָר
  choice: gunung / gunung itu
  rationale: הַר dalam konteks Sinai tepat diterjemahkan 'gunung'. Pada penyebutan kedua, 'gunung itu' menandai nomina tertentu secara alami dalam bahasa Indonesia.
- source_word: וַיְכַס
  choice: dan ... menutupi
  rationale: כסה berarti 'menutupi'. Konjungsi 'dan' mempertahankan hubungan naratif langsung dengan klausa sebelumnya.
- source_word: הֶעָנָן
  choice: awan
  rationale: Nomina tertentu ini merujuk kepada awan yang sudah dapat dikenali dari konteks. Bahasa Indonesia lazim tidak memakai penanda definit eksplisit bila acuannya jelas.
- source_word: אֶת
  choice: '[penanda objek langsung tidak diterjemahkan]'
  rationale: Penanda objek langsung Ibrani tidak memiliki padanan leksikal dan dinyatakan melalui susunan kalimat bahasa Indonesia.
theological_decisions:
- issue: Hakikat awan
  choice: Diterjemahkan secara deskriptif sebagai 'awan' tanpa tambahan penjelasan teologis dalam teks utama.
  alternative: '''awan kemuliaan'' atau ''awan TUHAN'''
  rationale: Teks Ibrani ayat ini hanya menyebut 'awan'. Walaupun konteks yang lebih luas menghubungkannya dengan kehadiran ilahi, terjemahan tidak menambahkan unsur yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur singkat mengikuti alur narasi Ibrani, sementara pengulangan 'gunung itu' terdengar alami dan memperjelas bahwa awan menutupi gunung yang sama.
