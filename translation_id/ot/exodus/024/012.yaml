  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה עֲלֵ֥ה אֵלַ֛/י הָ/הָ֖רָ/ה וֶ/הְיֵה שָׁ֑ם וְ/אֶתְּנָ֨ה לְ/ךָ֜ אֶת לֻחֹ֣ת הָ/אֶ֗בֶן וְ/הַ/תּוֹרָה֙ וְ/הַ/מִּצְוָ֔ה אֲשֶׁ֥ר כָּתַ֖בְתִּי לְ/הוֹרֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/012.yaml
  text: Then Yahweh said to Moses[a], “Come up to me on the mountain and remain there, and I will give you the stone tablets, and the law and the commandment[b], which I have written for their instruction.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Musa, “Naiklah kepada-Ku ke gunung dan tinggallah di sana. Aku akan memberikan kepadamu loh-loh batu, serta hukum dan perintah[a] yang telah Kutulis untuk mengajar mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hukum” juga dapat diterjemahkan “pengajaran.” Frasa “hukum dan perintah” dapat dipahami sebagai pengajaran perjanjian yang diberikan bersama loh-loh batu, atau sebagai penjelasan lebih lanjut tentang apa yang tertulis pada loh-loh itu.
    reason: lexical_alternative_and_alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama pribadi ilahi yang dinyatakan dalam Tetragramaton, bukan menggantinya dengan gelar.
- source_word: עֲלֵה אֵלַי הָהָרָה
  choice: Naiklah menghadap Aku di gunung
  rationale: Ungkapan ini menyampaikan gerak naik menuju Yahweh di gunung secara alami dalam bahasa Indonesia; “menghadap Aku” mempertahankan אֵלַי tanpa menyiratkan bahwa Musa masuk ke dalam gunung.
- source_word: וֶהְיֵה שָׁם
  choice: dan tinggallah di sana
  rationale: Imperatif היה dengan שָׁם dalam konteks ini menyatakan keberadaan yang berlanjut, sehingga “tinggallah” lebih wajar daripada “jadilah” atau “beradalah”.
- source_word: וְאֶתְּנָה לְךָ
  choice: Aku akan memberikan kepadamu
  rationale: Bentuk kohortatif menyatakan maksud atau janji Yahweh sesudah perintah.
- source_word: לֻחֹת הָאֶבֶן
  choice: loh-loh batu
  rationale: “Loh” adalah istilah Indonesia yang mapan untuk lempeng bertulis dalam konteks Sinai, sedangkan pengulangan menandai bentuk jamak.
- source_word: וְהַתּוֹרָה
  choice: hukum
  rationale: Dalam konteks perjanjian Sinai, “hukum” merupakan padanan yang wajar dan dikenal, sementara nuansa dasar ‘pengajaran’ dijelaskan dalam catatan kaki dan tercermin pada tujuan “untuk mengajar mereka”.
- source_word: וְהַמִּצְוָה
  choice: perintah
  rationale: Mempertahankan bentuk tunggal Ibrani tanpa mengubahnya menjadi jamak atau meleburkannya dengan תּוֹרָה.
- source_word: אֲשֶׁר כָּתַבְתִּי
  choice: yang telah Kutulis
  rationale: Menyatakan tindakan penulisan ilahi yang telah selesai dan tetap relevan; pronomina objek ilahi ditulis serangkai menurut kebiasaan ejaan Alkitab Indonesia.
- source_word: לְהוֹרֹתָם
  choice: untuk mengajar mereka
  rationale: Infinitif Hifil dari ירה menyatakan tujuan, yaitu memberi pengajaran kepada umat Israel.
theological_decisions:
- issue: Cakupan “hukum dan perintah” dalam hubungannya dengan loh-loh batu
  choice: 'Mempertahankan rangkaian unsur yang dikoordinasikan: “loh-loh batu, serta hukum dan perintah.”'
  alternative: Memahami “hukum dan perintah” sebagai keterangan aposisional yang hanya menjelaskan isi loh-loh itu.
  rationale: Struktur Ibrani mengoordinasikan nomina-nomina tersebut dan tidak memastikan apakah semuanya menunjuk hanya pada isi loh atau juga pada pengajaran perjanjian yang lebih luas. Terjemahan utama tidak menutup ambiguitas itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat dan mudah dipahami. “Berfirman” dipakai untuk ujaran ilahi; “loh-loh batu” mempertahankan istilah Alkitab yang telah dikenal. Ambiguitas hubungan antara loh, hukum, dan perintah dipertahankan dan diterangkan dalam catatan kaki.
