  terminology: “Yahweh,” “Musa,” “loh-loh batu,” “hukum,” dan “perintah” sesuai dengan istilah Alkitab Indonesia modern. Catatan kaki dengan tepat menjaga kemungkinan makna pengajaran bagi תורה dan tidak memutuskan hubungan penafsiran antara loh-loh batu dan hukum serta perintah.
