  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקַּ֤ח מֹשֶׁה֙ אֶת הַ/דָּ֔ם וַ/יִּזְרֹ֖ק עַל הָ/עָ֑ם וַ/יֹּ֗אמֶר הִנֵּ֤ה דַֽם הַ/בְּרִית֙ אֲשֶׁ֨ר כָּרַ֤ת יְהוָה֙ עִמָּ/כֶ֔ם עַ֥ל כָּל הַ/דְּבָרִ֖ים הָ/אֵֽלֶּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/008.yaml
  text: Then Moses took the blood and threw it on the people[a], and said, “Behold[b], the blood of the covenant that Yahweh has made with you concerning all these words.”
translation:
  language: id
  text: Lalu Musa mengambil darah itu dan menghamburkannya ke atas umat itu,[a] lalu berkata, “Inilah darah perjanjian yang telah Yahweh adakan dengan kalian berdasarkan semua firman ini.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memercikkannya ke atas umat itu.” Kata kerja Ibrani pada dasarnya berarti “melempar” atau “menghamburkan,” tetapi dalam konteks kurban dapat menggambarkan penerapan darah secara ritual.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “darah perjanjian yang telah Yahweh potong dengan kalian.” “Memotong perjanjian” adalah ungkapan Ibrani yang berarti mengadakan perjanjian. Frasa terakhir juga dapat diterjemahkan “mengenai semua firman ini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: Padanan naratif yang langsung dan alami bagi לקח.
- source_word: הַדָּם
  choice: darah itu
  rationale: Artikel tertentu menunjuk kepada darah kurban yang telah disebut dalam konteks sebelumnya.
- source_word: וַיִּזְרֹק
  choice: memercikkannya
  rationale: זרק secara dasar berarti melempar atau menghamburkan, tetapi dalam konteks ritual darah menunjuk pada penerapan darah dengan gerakan menghamburkan; 'memercikkan' paling alami dalam bahasa Indonesia tanpa menghilangkan sifat ritualnya.
- source_word: עַל הָעָם
  choice: kepada umat itu
  rationale: Dalam ungkapan Indonesia tentang tindakan memercikkan, 'kepada' menyampaikan sasaran tindakan secara alami; darah tersebut mengenai umat.
- source_word: הִנֵּה
  choice: Lihatlah, inilah
  rationale: Gabungan ini mempertahankan fungsi deiktis dan nada penyajian yang khidmat dari הִנֵּה sambil menghasilkan kalimat Indonesia yang wajar.
- source_word: דַם הַבְּרִית
  choice: darah perjanjian
  rationale: Mempertahankan hubungan konstruksi Ibrani dan ungkapan penting yang bergema dalam bagian Alkitab lain.
- source_word: כָּרַת
  choice: adakan
  rationale: Secara harfiah berarti 'memotong' dalam idiom membuat perjanjian. Bahasa Indonesia lazim memakai 'mengadakan perjanjian'; terjemahan harfiah 'memotong' akan mudah disalahpahami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה alih-alih menggantinya dengan gelar.
- source_word: עִמָּכֶם
  choice: dengan kalian
  rationale: Akhiran orang kedua jamak dinyatakan secara eksplisit dengan 'kalian'.
- source_word: עַל כָּל הַדְּבָרִים הָאֵלֶּה
  choice: berdasarkan semua firman ini
  rationale: עַל menghubungkan pengadaan perjanjian dengan perkataan atau ketentuan yang baru disampaikan. 'Berdasarkan' menjaga hubungan dasarnya, sedangkan 'firman' mempertahankan bobot דְּבָרִים dalam konteks perkataan ilahi.
theological_decisions:
- issue: Idiom pengadaan perjanjian כָּרַת ... בְּרִית
  choice: perjanjian yang telah Yahweh adakan
  alternative: perjanjian yang telah Yahweh potong
  rationale: Terjemahan idiomatis menghindari kesan keliru bahwa perjanjiannya sendiri dipotong secara harfiah. Catatan kaki mempertahankan transparansi terhadap bentuk Ibraninya dan kaitannya dengan ritual.
- issue: Penerjemahan nama יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung; 'Yahweh' mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Cakupan עַל כָּל הַדְּבָרִים הָאֵלֶּה
  choice: berdasarkan semua firman ini
  alternative: mengenai semua firman ini
  rationale: '''Berdasarkan'' menyatakan bahwa perkataan yang disampaikan menjadi dasar atau isi ketentuan perjanjian, sambil tetap mengakui bahwa preposisi עַל dapat dipahami lebih umum sebagai ''mengenai''.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. 'Umat itu' dipilih untuk הָעָם dalam konteks Israel sebagai komunitas perjanjian. 'Kalian' menandai bentuk jamak tanpa kekakuan 'kamu sekalian'. Semua penanda catatan kaki dicantumkan dalam teks utama.
