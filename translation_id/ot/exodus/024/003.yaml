  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּבֹ֣א מֹשֶׁ֗ה וַ/יְסַפֵּ֤ר לָ/עָם֙ אֵ֚ת כָּל דִּבְרֵ֣י יְהוָ֔ה וְ/אֵ֖ת כָּל הַ/מִּשְׁפָּטִ֑ים וַ/יַּ֨עַן כָּל הָ/עָ֜ם ק֤וֹל אֶחָד֙ וַ/יֹּ֣אמְר֔וּ כָּל הַ/דְּבָרִ֛ים אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה נַעֲשֶֽׂה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/003.yaml
  text: Then Moses came and told the people all the words of Yahweh and all the ordinances[a], and all the people answered with one voice and said, “All the words that Yahweh has spoken we will do.”
translation:
  language: id
  text: Kemudian Musa datang dan menyampaikan kepada bangsa itu segala firman Yahweh dan segala ketetapan hukum[a]. Seluruh bangsa itu menjawab dengan satu suara, “Segala firman yang telah Yahweh firmankan akan kami lakukan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “segala keputusan hukum” atau “segala peraturan”; Ibrani mishpatim menunjuk pada ketentuan atau putusan hukum dalam perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Kemudian Musa datang
  rationale: Bentuk wayyiqtol melanjutkan alur narasi, sedangkan בוא pada konteks ini secara wajar berarti 'datang'.
- source_word: וַיְסַפֵּר
  choice: menyampaikan
  rationale: Bentuk piel dari ספר berarti menceritakan, memaparkan, atau menyampaikan. 'Menyampaikan' alami dalam bahasa Indonesia dan cocok untuk penyampaian firman serta hukum kepada bangsa itu.
- source_word: כָּל דִּבְרֵי יְהוָה
  choice: segala firman Yahweh
  rationale: '''Firman'' mempertahankan acuan pada perkataan ilahi tanpa mempersempitnya menjadi perintah, dan merupakan ungkapan Indonesia yang wajar dalam konteks ini.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan sebuah gelar.
- source_word: הַמִּשְׁפָּטִים
  choice: ketetapan hukum
  rationale: Dalam konteks perjanjian ini, מִשְׁפָּטִים menunjuk pada keputusan atau aturan hukum. 'Ketetapan hukum' jelas dan alami, sambil mempertahankan nuansa yuridisnya.
- source_word: וַיַּעַן
  choice: menjawab
  rationale: ענה dalam konstruksi ini berarti menjawab atau memberikan tanggapan.
- source_word: קוֹל אֶחָד
  choice: dengan satu suara
  rationale: Ungkapan harfiah ini juga alami dalam bahasa Indonesia dan menyatakan jawaban bersama yang bulat.
- source_word: כָּל הַדְּבָרִים
  choice: Segala firman
  rationale: Pengulangan 'firman' mempertahankan kaitan leksikal dengan apa yang baru saja Musa sampaikan.
- source_word: דִּבֶּר
  choice: telah disampaikan
  rationale: Bentuk ini menunjuk pada perkataan Yahweh yang mendahului jawaban bangsa itu. 'Disampaikan' menjaga kaitan dengan 'firman' dan terdengar alami dalam kalimat Indonesia.
- source_word: נַעֲשֶׂה
  choice: akan kami lakukan
  rationale: עשה secara langsung berarti melakukan. Terjemahan ini mempertahankan ungkapan Ibrani dan tidak memperluasnya secara interpretatif menjadi 'menaati', walaupun ketaatan tersirat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama pribadi Allah dalam konteks perjanjian tanpa menggantinya dengan gelar.
- issue: Cakupan respons bangsa terhadap perkataan Yahweh
  choice: akan kami lakukan
  alternative: akan kami taati
  rationale: Ungkapan 'melakukan' mengikuti נַעֲשֶׂה dengan dekat dan membiarkan daya perjanjian serta implikasi ketaatannya tetap hadir tanpa menambah penafsiran.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat tetapi mudah dipahami. 'Bangsa itu' dipakai untuk העם dalam konteks Israel sebagai keseluruhan umat; pengulangan 'segala firman' sengaja dipertahankan untuk mencerminkan struktur Ibrani.
