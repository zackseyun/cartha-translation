base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/013.yaml
  text: So Moses arose with Joshua his attendant[a], and Moses went up to the mountain of God.
translation:
  language: id
  text: Lalu Musa bangkit bersama Yosua, pelayannya[a], dan Musa naik ke gunung Allah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "pembantunya." Istilah Ibrani ini dapat menunjuk kepada orang yang melayani dan mendampingi seseorang; di sini tampaknya Yosua adalah pembantu pribadi Musa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: bangkit
  rationale: Bentuk wayyiqtol Qal dari קום menyatakan bahwa Musa bangkit atau berdiri untuk bertindak; 'bangkit' mempertahankan urutan naratif tanpa mempersempit maknanya menjadi sekadar berangkat.
- source_word: וִיהוֹשֻׁעַ
  choice: Yosua
  rationale: Menggunakan bentuk nama yang baku dan lazim dalam bahasa Indonesia.
- source_word: מְשָׁרְתוֹ
  choice: pelayannya
  rationale: Kata dari akar שׁרת menunjuk kepada orang yang melayani atau mendampingi seseorang. 'Pelayannya' mempertahankan hubungan pelayanan pribadi kepada Musa tanpa memberi kesan jabatan gerejawi.
- source_word: וַיַּעַל
  choice: naik
  rationale: Dalam konteks gunung, עלה menyatakan gerak ke atas; 'naik' merupakan padanan Indonesia yang alami dan tepat.
- source_word: הַר הָאֱלֹהִים
  choice: gunung Allah
  rationale: Padanan ini mempertahankan susunan dan makna frasa Ibrani serta arti penting gunung itu sebagai gunung yang dikaitkan dengan Allah.
theological_decisions:
- issue: Hubungan Yosua dengan Musa dalam מְשָׁרְתוֹ
  choice: Yosua disebut pelayan pribadi Musa, yaitu orang yang melayani dan mendampinginya.
  alternative: Yosua disebut hambanya atau pembantunya.
  rationale: Istilah Ibrani ini memiliki cakupan makna pelayanan yang cukup luas. Konteks dan sufiks posesif menunjuk kepada pelayanan pribadi kepada Musa, tanpa harus menyiratkan perbudakan atau jabatan keagamaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bernada naratif luhur. Pengulangan nama Musa dipertahankan karena terdapat dalam teks Ibrani dan memperjelas bahwa Musalah yang naik ke gunung Allah.
