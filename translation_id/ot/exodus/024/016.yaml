  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁכֹּ֤ן כְּבוֹד יְהוָה֙ עַל הַ֣ר סִינַ֔י וַ/יְכַסֵּ֥/הוּ הֶ/עָנָ֖ן שֵׁ֣שֶׁת יָמִ֑ים וַ/יִּקְרָ֧א אֶל מֹשֶׁ֛ה בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י מִ/תּ֥וֹךְ הֶ/עָנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/016.yaml
  text: And the glory of Yahweh settled on Mount Sinai[a], and the cloud covered it for six days[b]. On the seventh day he called to Moses from the midst of the cloud.
translation:
  language: id
  text: Kemuliaan Yahweh berdiam di atas Gunung Sinai, dan awan itu menutupinya[a] selama enam hari. Pada hari ketujuh, Ia memanggil Musa dari tengah awan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Akhiran “-nya” dapat merujuk kepada Gunung Sinai atau kepada kemuliaan Yahweh.
    reason: alternative_reading
  - marker: b
    text: Atau, “dari dalam awan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכֹּן
  choice: berdiam
  rationale: Kata kerja שכן menyatakan kehadiran yang tinggal atau menetap. “Berdiam” mempertahankan gambaran kemuliaan Yahweh yang mengambil tempat di atas gunung dengan bahasa Indonesia yang wajar dan bermartabat.
- source_word: כְּבוֹד יְהוָה
  choice: Kemuliaan Yahweh
  rationale: כָּבוֹד di sini menunjuk pada kemuliaan atau kehadiran Yahweh yang tampak. Susunan ini menerjemahkan rantai konstruksi Ibrani secara alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh” agar nama pribadi yang dinyatakan kepada Israel tetap terlihat dan tidak diganti dengan gelar.
- source_word: עַל הַר סִינַי
  choice: di atas Gunung Sinai
  rationale: Menyampaikan makna lokasi dari עַל secara jelas dan alami dalam bahasa Indonesia.
- source_word: וַיְכַסֵּהוּ
  choice: menutupinya
  rationale: Akhiran orang ketiga tunggal maskulin paling mungkin merujuk kepada Gunung Sinai, tetapi secara tata bahasa juga dapat merujuk kepada kemuliaan Yahweh. Bentuk “-nya” mempertahankan ambiguitas asli tersebut.
- source_word: הֶעָנָן
  choice: awan itu
  rationale: Nomina definit ini merujuk pada awan teofanik yang sudah dikenal dalam konteks kisah Sinai; “awan itu” menandai rujukan tertentu secara alami.
- source_word: שֵׁשֶׁת יָמִים
  choice: selama enam hari
  rationale: “Selama” menyatakan durasi yang terkandung dalam bentuk keterangan waktu Ibrani.
- source_word: וַיִּקְרָא
  choice: Ia memanggil
  rationale: קרא dalam konteks ini berarti memanggil. Subjek yang paling wajar adalah Yahweh, sementara kata ganti mempertahankan alur ringkas teks Ibrani.
- source_word: אֶל מֹשֶׁה
  choice: Musa
  rationale: Dengan verba “memanggil”, bahasa Indonesia tidak memerlukan padanan terpisah untuk אֶל; objek “Musa” menyampaikan relasi yang dimaksud secara idiomatis.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: Pada hari ketujuh
  rationale: Padanan temporal yang alami serta mempertahankan bentuk ordinal definit dari teks Ibrani.
- source_word: מִתּוֹךְ הֶעָנָן
  choice: dari tengah awan
  rationale: מִתּוֹךְ menggambarkan asal suara dari bagian dalam atau tengah awan. Ungkapan ini mempertahankan gambaran spasial teks sumber.
theological_decisions:
- issue: Subjek dalam frasa “Ia memanggil”
  choice: Kata ganti “Ia” dipahami merujuk kepada Yahweh.
  alternative: Kemuliaan Yahweh dapat dipahami secara metonimis sebagai subjek.
  rationale: Alur kisah teofani Sinai paling wajar menunjukkan bahwa Yahweh memanggil Musa. Kata ganti dipertahankan, bukannya nama Yahweh diulang, agar bentuk dan ketegangan naratif teks Ibrani tidak diperjelas secara berlebihan.
- issue: Rujukan akhiran objek pada וַיְכַסֵּהוּ
  choice: Kemungkinan utama ialah Gunung Sinai.
  alternative: Akhiran itu dapat merujuk kepada kemuliaan Yahweh.
  rationale: Gambaran naratif mendukung gunung sebagai objek yang ditutupi awan, tetapi kedua anteseden berjenis maskulin dalam bahasa Ibrani. Terjemahan utama mempertahankan ketaksaan itu melalui “-nya”, disertai catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama ilahi ditulis “Yahweh”. Kata “berdiam” dipilih untuk menjaga gagasan kehadiran yang menetap tanpa terdengar arkais. Kapitalisasi “Ia” mengikuti rujukan kepada Allah, sedangkan ambiguitas akhiran objek dipertahankan dan dijelaskan dalam catatan kaki.
