id: EXO.24.4
reference: Exodus 24:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּכְתֹּ֣ב מֹשֶׁ֗ה אֵ֚ת כָּל דִּבְרֵ֣י יְהוָ֔ה וַ/יַּשְׁכֵּ֣ם בַּ/בֹּ֔קֶר וַ/יִּ֥בֶן מִזְבֵּ֖חַ תַּ֣חַת הָ/הָ֑ר וּ/שְׁתֵּ֤ים עֶשְׂרֵה֙ מַצֵּבָ֔ה לִ/שְׁנֵ֥ים עָשָׂ֖ר שִׁבְטֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/004.yaml
  text: And Moses wrote down all the words of Yahweh[a]. He rose early in the morning and built an altar at the foot of the mountain[b], and twelve pillars for the twelve tribes of Israel.
translation:
  language: id
  text: Musa menuliskan semua firman Yahweh. Pagi-pagi, ia bangun lalu membangun sebuah mazbah di kaki gunung[a] dan mendirikan dua belas tugu batu[b] bagi kedua belas suku Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di bawah gunung,” yaitu di bagian dasar atau kaki gunung.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “dua belas batu tegak.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: menuliskan
  rationale: Bentuk ini secara alami menyatakan tindakan mencatat perkataan dalam tulisan dan tetap dekat dengan arti dasar כתב.
- source_word: דִּבְרֵי
  choice: firman
  rationale: Dalam frasa yang merujuk pada perkataan Yahweh, 'firman' merupakan padanan Indonesia yang wajar dan khidmat tanpa mempersempit maknanya menjadi hanya perintah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh' agar nama perjanjian dalam teks Ibrani tidak diganti dengan sebuah gelar.
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: Pagi-pagi, ia bangun
  rationale: Ungkapan ini menyampaikan makna idiomatis bentuk Hifil שׁכם, yaitu bangun awal, sekaligus mempertahankan keterangan waktu בַּבֹּקֶר.
- source_word: וַיִּבֶן מִזְבֵּחַ
  choice: membangun sebuah mazbah
  rationale: '''Membangun'' menerjemahkan בנה secara langsung, sedangkan ''mazbah'' adalah istilah Indonesia yang mapan untuk tempat persembahan korban.'
- source_word: תַּחַת הָהָר
  choice: di kaki gunung
  rationale: Secara harfiah berarti 'di bawah gunung', tetapi dalam konteks ruang ungkapan itu menunjuk pada bagian dasar atau kaki gunung.
- source_word: וּשְׁתֵּים עֶשְׂרֵה מַצֵּבָה
  choice: dan mendirikan dua belas tugu batu
  rationale: מַצֵּבָה menunjuk pada batu yang ditegakkan atau tugu. Kata kerja 'mendirikan' melengkapi elipsis Ibrani secara alami tanpa mengubah hubungan sintaksisnya.
- source_word: לִשְׁנֵים עָשָׂר שִׁבְטֵי יִשְׂרָאֵל
  choice: bagi kedua belas suku Israel
  rationale: Preposisi ל menyatakan peruntukan atau korespondensi; 'bagi' mempertahankan keluwesan itu tanpa secara eksplisit menambahkan gagasan 'melambangkan'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama tersebut, bukan menggantinya dengan gelar, sementara ketidakpastian historis mengenai pelafalan tidak dijadikan alasan untuk menghapus nama itu.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Struktur naratif Ibrani dipertahankan tanpa menambahkan bahwa peristiwa ini terjadi pada hari berikutnya. 'Firman', 'mazbah', dan 'Yahweh' dipakai sebagai kosakata religius yang mapan, sedangkan 'tugu batu' memperjelas bahwa מַצֵּבָה adalah batu yang ditegakkan.
