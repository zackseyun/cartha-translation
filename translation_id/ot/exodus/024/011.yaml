  text: וְ/אֶל אֲצִילֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א שָׁלַ֖ח יָד֑/וֹ וַֽ/יֶּחֱזוּ֙ אֶת הָ֣/אֱלֹהִ֔ים וַ/יֹּאכְל֖וּ וַ/יִּשְׁתּֽוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/011.yaml
  text: But he did not stretch out his hand against the nobles of the sons of Israel; they saw God[a], and they ate and drank.
translation:
  language: id
  text: Namun, Dia tidak mengangkat tangan-Nya terhadap para pemuka Israel. Mereka melihat Allah[a] dan makan serta minum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memandang Allah”—kata kerja ini dapat mengandung arti menatap atau memandang dengan saksama.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶל
  choice: terhadap
  rationale: Dalam ungkapan שָׁלַח יָד, preposisi ini mengarah pada tindakan yang merugikan atau menghukum. Dalam bahasa Indonesia, nuansa tersebut tersampaikan secara alami melalui keseluruhan frasa 'mengulurkan tangan-Nya terhadap' tanpa perlu menambahkan kata 'menyerang'.
- source_word: אֲצִילֵי
  choice: para pemuka
  rationale: Kata ini menunjuk kepada orang-orang terkemuka atau pilihan dalam masyarakat. 'Para pemuka' alami dalam bahasa Indonesia modern dan tidak menyiratkan kelas kebangsawanan turun-temurun.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: Ungkapan ini mempertahankan citra kekeluargaan Ibrani secara ringkas dan merupakan bentuk yang dikenal dalam ragam Alkitab bahasa Indonesia.
- source_word: שָׁלַח יָדוֹ
  choice: mengulurkan tangan-Nya
  rationale: Terjemahan ini mempertahankan metafora Ibrani tentang tindakan penghukuman atau kekerasan, tanpa mempersempitnya menjadi 'memukul' atau 'membinasakan'.
- source_word: וַיֶּחֱזוּ
  choice: melihat
  rationale: '''Melihat'' jelas dan wajar dalam bahasa Indonesia modern, sedangkan kemungkinan nuansa memandang dengan saksama dicatat dalam catatan kaki.'
- source_word: אֶת הָאֱלֹהִים
  choice: Allah
  rationale: Frasa tentu ini merujuk kepada Allah Israel. Bahasa Indonesia secara wajar tidak memerlukan kata sandang.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: lalu makan dan minum
  rationale: Terjemahan sederhana ini mempertahankan urutan tindakan dan kelaziman makan-minum sesudah perjumpaan ilahi; 'lalu' mengungkapkan nilai naratif waw berturut-turut secara alami.
theological_decisions:
- issue: Subjek ungkapan 'tidak mengulurkan tangan-Nya'
  choice: Kata ganti 'Dia' dan akhiran '-Nya' secara eksplisit merujuk kepada Allah.
  alternative: Membiarkan subjek tersirat sebagaimana dalam bahasa Ibrani.
  rationale: Subjek verba memang tersirat dalam bahasa Ibrani, tetapi konteks paling wajar menunjuk kepada Allah. Menyatakannya dalam bahasa Indonesia menjernihkan sintaksis tanpa menambahkan klaim teologis baru.
- issue: Penggambaran perjumpaan ilahi
  choice: Mereka melihat Allah.
  alternative: Mereka melihat penampakan Allah; mereka memandang Allah.
  rationale: Teks Ibrani menyatakannya secara langsung. Terjemahan tidak melunakkan pernyataan itu demi menyelaraskannya dengan ayat lain tentang manusia yang melihat Allah, sehingga ketegangan teologis asli tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. 'Para pemuka' dipilih daripada 'kaum bangsawan', sedangkan 'bani Israel' mempertahankan ungkapan kekeluargaan sumber. Huruf kapital pada pronomina ilahi mengikuti kebiasaan umum penerbitan Alkitab Indonesia.
