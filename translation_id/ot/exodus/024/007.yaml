source:
  edition: WLC
  text: וַ/יִּקַּח֙ סֵ֣פֶר הַ/בְּרִ֔ית וַ/יִּקְרָ֖א בְּ/אָזְנֵ֣י הָ/עָ֑ם וַ/יֹּ֣אמְר֔וּ כֹּ֛ל אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה נַעֲשֶׂ֥ה וְ/נִשְׁמָֽע־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/007.yaml
  text: Then he took the Book of the Covenant and read it in the hearing of the people[a], and they said, “All that Yahweh has spoken we will do, and we will obey.”
translation:
  language: id
  text: Lalu ia mengambil Kitab Perjanjian itu dan membacakannya kepada bangsa itu. Mereka berkata, “Segala sesuatu yang telah Yahweh firmankan akan kami lakukan, dan kami akan mendengarkan[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan kami akan taat.” Kata kerja Ibrani yang digunakan dapat berarti “mendengar/mendengarkan” dan, dalam konteks perjanjian, “menaati.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: Lalu ia mengambil
  rationale: Bentuk wayyiqtol melanjutkan rangkaian narasi; “lalu” menyampaikan urutan itu secara alami dalam bahasa Indonesia tanpa menambahkan identitas pelaku yang tidak disebutkan dalam ayat ini.
- source_word: סֵפֶר הַבְּרִית
  choice: Kitab Perjanjian itu
  rationale: “Kitab” mempertahankan gambaran dokumen tertulis, sedangkan “itu” menandai dokumen perjanjian tertentu yang dikenal dari konteks.
- source_word: וַיִּקְרָא בְּאָזְנֵי הָעָם
  choice: membacakannya kepada bangsa itu
  rationale: Dengan dokumen tertulis sebagai objek, קרא berarti membaca dengan suara nyaring. Ungkapan בְּאָזְנֵי secara idiomatis menyatakan bahwa pembacaan itu diperdengarkan kepada bangsa tersebut; bentuk Indonesia ini alami dan jelas.
- source_word: הָעָם
  choice: bangsa itu
  rationale: Dalam konteks ini עָם menunjuk kepada umat Israel sebagai satu bangsa. “Bangsa itu” mempertahankan rujukan kontekstual tanpa menambahkan nama Israel ke dalam teks.
- source_word: כֹּל אֲשֶׁר דִּבֶּר יְהוָה
  choice: Segala sesuatu yang telah Yahweh firmankan
  rationale: “Segala sesuatu” menyampaikan cakupan menyeluruh כֹּל אֲשֶׁר, dan bentuk perfektif דִּבֶּר diterjemahkan secara alami sebagai tindakan yang telah terjadi. Nama ilahi ditransliterasikan sebagai “Yahweh” dan tidak diganti dengan gelar.
- source_word: נַעֲשֶׂה
  choice: akan kami lakukan
  rationale: עשה pada dasarnya berarti melakukan atau melaksanakan. Terjemahan ini mempertahankan verba konkret tersebut tanpa meleburkannya ke dalam gagasan ketaatan.
- source_word: וְנִשְׁמָע
  choice: dan kami akan mendengarkan
  rationale: שׁמע mencakup arti mendengar atau mendengarkan dan, khususnya dalam konteks perjanjian, menaati. “Mendengarkan” mempertahankan citra auditif yang menonjol dalam konteks pembacaan perjanjian, sementara nuansa ketaatan dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Makna tanggapan perjanjian וְנִשְׁמָע
  choice: dan kami akan mendengarkan
  alternative: dan kami akan taat
  rationale: Kata kerja שׁמע dapat menyatakan tindakan mendengarkan sekaligus ketaatan yang lahir dari mendengarkan. Teks utama mempertahankan ketegangan makna itu dan kaitannya dengan pembacaan perjanjian, sedangkan alternatif kontekstualnya dicatat tanpa menjadikannya satu-satunya tafsiran.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami bagi pembaca umum, dengan nama ilahi “Yahweh” dipertahankan dan ambiguitas penting pada שׁמע tidak dihilangkan.
