  text: וַ/יַּ֥עַל מֹשֶׁ֖ה וְ/אַהֲרֹ֑ן נָדָב֙ וַ/אֲבִיה֔וּא וְ/שִׁבְעִ֖ים מִ/זִּקְנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/009.yaml
  text: Then Moses went up, and Aaron, Nadab, Abihu, and seventy of the elders of Israel.
translation:
  language: id
  text: Kemudian Musa naik bersama Harun, Nadab, Abihu, dan tujuh puluh orang dari antara para tua-tua Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: Kemudian ... naik
  rationale: Bentuk dari עלה menyatakan gerak ke atas. 'Naik' alami dalam bahasa Indonesia dan tidak menambahkan 'ke gunung', yang tersirat dari konteks tetapi tidak dinyatakan dalam ayat ini.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk baku nama ini dalam tradisi Alkitab berbahasa Indonesia.
- source_word: וְאַהֲרֹן
  choice: bersama Harun
  rationale: Konjungsi Ibrani mengoordinasikan Harun dengan Musa sebagai pihak yang naik. 'Bersama' membuat hubungan itu jelas dan alami dalam bahasa Indonesia tanpa mengubah makna.
- source_word: נָדָב וַאֲבִיהוּא
  choice: Nadab, Abihu
  rationale: Mempertahankan bentuk nama yang lazim dalam Alkitab berbahasa Indonesia.
- source_word: וְשִׁבְעִים מִזִּקְנֵי
  choice: dan tujuh puluh orang dari antara para tua-tua
  rationale: 'מן digunakan secara partitif: tujuh puluh orang dipilih dari kelompok para tua-tua. Kata ''orang'' diperlukan agar frasa bilangan terdengar alami dan jelas dalam bahasa Indonesia.'
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Bentuk baku nama bangsa tersebut dalam bahasa Indonesia.
