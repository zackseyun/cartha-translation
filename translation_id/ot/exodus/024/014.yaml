base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/014.yaml
  text: And to the elders he said[a], “Wait here for us until we return to you. And look, Aaron and Hur are with you. Whoever has a dispute, let him approach them.”
translation:
  language: id
  text: Kepada para tua-tua ia berkata, “Tunggulah kami di sini sampai kami kembali kepada kalian. Lihatlah, Harun dan Hur ada bersama kalian. Siapa pun yang mempunyai sengketa[a], hendaklah ia menghadap mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “perkara.”
    reason: Ungkapan Ibrani dapat menunjuk secara umum kepada perkara atau kasus hukum, selain sengketa.
lexical_decisions:
- source_word: הַזְּקֵנִים
  choice: para tua-tua
  rationale: Istilah ini menunjuk kepada para pemimpin yang diakui dalam komunitas, bukan sekadar orang-orang lanjut usia. ‘Para tua-tua’ merupakan padanan baku dalam konteks Alkitab.
- source_word: שְׁבוּ לָנוּ בָזֶה
  choice: Tunggulah kami di sini
  rationale: Kata kerja ישׁב secara harfiah dapat berarti ‘duduk’, ‘tinggal’, atau ‘tetap’. Dalam perintah ini maksudnya ialah tetap berada di tempat sambil menantikan kepulangan Musa dan rekannya; susunan ini alami dalam bahasa Indonesia dan tetap memuat unsur לָנוּ, ‘kami’.
- source_word: עַד אֲשֶׁר נָשׁוּב אֲלֵיכֶם
  choice: sampai kami kembali kepada kalian
  rationale: Menerjemahkan klausa waktu dan verba שוב secara langsung, dengan bentuk jamak ‘kalian’ untuk sasaran ujaran kepada para tua-tua.
- source_word: וְהִנֵּה
  choice: Perhatikanlah
  rationale: הִנֵּה mengarahkan perhatian kepada keadaan yang disebut berikutnya. ‘Perhatikanlah’ mempertahankan fungsi wacana itu dalam ragam modern dan bermartabat tanpa memakai ungkapan arkais.
- source_word: עִמָּכֶם
  choice: ada bersama kalian
  rationale: Preposisi עִם menyatakan kehadiran atau kebersamaan; padanan ini langsung dan jelas.
- source_word: מִי בַעַל דְּבָרִים
  choice: Siapa pun yang mempunyai sengketa
  rationale: Ungkapan idiomatis ini menunjuk kepada seseorang yang terlibat dalam urusan hukum, gugatan, atau perselisihan. ‘Mempunyai sengketa’ menyampaikan nuansa yudisialnya dengan jelas; ‘mempunyai perkara’ tetap merupakan kemungkinan yang dicatat dalam catatan kaki.
- source_word: יִגַּשׁ אֲלֵהֶם
  choice: hendaklah ia menghadap mereka
  rationale: Bentuk imperfek di sini memiliki daya yusif atau instruksional. ‘Hendaklah’ menyampaikan arahan tersebut, sedangkan ‘menghadap’ sesuai dengan tindakan membawa sengketa kepada pihak yang berwenang.
theological_decisions:
- issue: Bentuk tunggal generik dalam petunjuk hukum
  choice: hendaklah ia menghadap mereka
  alternative: hendaklah mereka menghadap keduanya
  rationale: Bahasa Ibrani memakai subjek tunggal generik (מִי ... יִגַּשׁ). Bahasa Indonesia dapat mempertahankannya secara alami dengan ‘siapa pun ... ia’ tanpa menentukan jenis kelamin orang tersebut. Rujukan jamak ‘mereka’ mengikuti bentuk Ibrani yang merujuk kepada Harun dan Hur.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Kalian’ dipakai untuk memperjelas bahwa pronomina orang kedua dalam bahasa Ibrani berbentuk jamak. Nama חוּר ditransliterasikan sebagai ‘Hur’, sesuai bentuk yang lazim dalam Alkitab bahasa Indonesia.
