  text: וַ/יִּשְׁלַ֗ח אֶֽת נַעֲרֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּֽעֲל֖וּ עֹלֹ֑ת וַֽ/יִּזְבְּח֞וּ זְבָחִ֧ים שְׁלָמִ֛ים לַ/יהוָ֖ה פָּרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/005.yaml
  text: And he sent the young men of the sons of Israel[b][a], and they offered up burnt offerings and sacrificed peace offerings of bulls to Yahweh.
translation:
  language: id
  text: Kemudian ia mengutus para pemuda dari antara orang Israel[a], dan mereka mempersembahkan kurban bakaran serta kurban persekutuan[b] berupa lembu-lembu jantan kepada Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “para pemuda dari bani Israel.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “kurban kesejahteraan” atau “kurban perdamaian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: ia mengutus
  rationale: Bentuk naratif dari שׁלח menyatakan tindakan pengutusan secara langsung. Kata ganti “ia” mempertahankan rujukan implisit dalam teks Ibrani.
- source_word: נַעֲרֵי בְּנֵי יִשְׂרָאֵל
  choice: para pemuda Israel
  rationale: נַעַר di sini menunjuk kepada laki-laki muda, sehingga “para pemuda” tepat dan alami. “Israel” menyampaikan hubungan konstruktus בְּנֵי יִשְׂרָאֵל tanpa ungkapan Indonesia yang kaku.
- source_word: וַיַּעֲלוּ עֹלֹת
  choice: mereka mempersembahkan kurban bakaran
  rationale: Gabungan עלה dan עֹלָה merupakan ungkapan ibadah kurban. “Mempersembahkan kurban bakaran” adalah padanan Indonesia yang jelas dan lazim.
- source_word: וַיִּזְבְּחוּ
  choice: menyembelih ... sebagai kurban
  rationale: זבח mengacu pada penyembelihan ritual. Rumusan ini mempertahankan tindakan konkretnya sekaligus menjelaskan fungsi hewan tersebut sebagai kurban.
- source_word: זְבָחִים שְׁלָמִים
  choice: kurban persekutuan
  rationale: Istilah ini menyatakan jenis kurban שְׁלָמִים dan menonjolkan persekutuan yang terkait dengan perjamuan kurban, tanpa menutup kemungkinan nuansa damai atau kesejahteraan yang dicatat dalam catatan kaki.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Nama perjanjian יהוה dipertahankan sebagai “Yahweh”. Preposisi ל diterjemahkan “bagi” untuk menyatakan bahwa kurban dipersembahkan kepada-Nya.
- source_word: פָּרִים
  choice: lembu-lembu jantan
  rationale: פָּרִים secara khusus menunjuk pada lembu jantan. Penempatannya sebelum “sebagai kurban persekutuan” memperjelas bahwa hewan-hewan itulah yang disembelih.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama ilahi secara langsung. “Yahweh” mempertahankan nama perjanjian itu dan mengikuti lapisan konsultasi yang telah diaudit.
- issue: Makna kategori kurban זְבָחִים שְׁלָמִים
  choice: kurban persekutuan
  alternative: kurban kesejahteraan; kurban keselamatan; kurban perdamaian
  rationale: Akar שלם membawa medan makna keutuhan, damai, dan kesejahteraan, sedangkan praktik kurban ini juga melibatkan persekutuan. Teks utama memakai istilah yang mudah dipahami, sementara nuansa alternatif dipertahankan dalam catatan kaki.
- issue: Ungkapan maskulin נַעֲרֵי בְּנֵי יִשְׂרָאֵל
  choice: para pemuda Israel
  alternative: orang-orang muda dari bani Israel
  rationale: “Para pemuda” mempertahankan rujukan laki-laki muda dalam נַעֲרֵי. Ungkapan “Israel” lebih alami dalam bahasa Indonesia daripada reproduksi harfiah seluruh rantai konstruktus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur dibagi menjadi dua kalimat agar rangkaian tindakan mudah dipahami, tanpa mengubah urutan narasi Ibrani. Istilah ritual dipilih agar dapat dimengerti pembaca umum sekaligus mempertahankan kategori kurban dalam teks sumber.
