id: EXO.24.2
reference: Exodus 24:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/נִגַּ֨שׁ מֹשֶׁ֤ה לְ/בַדּ/וֹ֙ אֶל יְהוָ֔ה וְ/הֵ֖ם לֹ֣א יִגָּ֑שׁוּ וְ/הָ/עָ֕ם לֹ֥א יַעֲל֖וּ עִמּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/002.yaml
  text: Moses alone shall come near to Yahweh[a], but they shall not come near, and the people shall not go up with him.
translation:
  language: id
  text: Hanya Musa yang boleh mendekat kepada Yahweh[a]. Mereka tidak boleh mendekat, dan bangsa itu tidak boleh naik bersama Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN”.'
    reason: Menjelaskan bentuk nama ilahi dan padanan tradisionalnya.
lexical_decisions:
- source_word: וְנִגַּשׁ
  choice: boleh mendekat
  rationale: Bentuk Ibrani menyatakan tindakan Musa dalam konteks ketetapan tentang siapa yang diizinkan mendekat. 'Boleh mendekat' menyampaikan izin eksklusif secara alami dalam bahasa Indonesia.
- source_word: מֹשֶׁה לְבַדּוֹ
  choice: Hanya Musa
  rationale: לְבַדּוֹ menegaskan bahwa Musa seorang diri, bukan kelompok yang disebut sebelumnya, yang boleh mendekat.
- source_word: אֶל יְהוָה
  choice: kepada Yahweh
  rationale: אֶל menunjukkan gerak mendekati hadirat, sedangkan nama perjanjian יְהוָה ditransliterasikan 'Yahweh'.
- source_word: וְהֵם לֹא יִגָּשׁוּ
  choice: Mereka tidak boleh mendekat
  rationale: Mengulang 'mendekat' untuk mempertahankan pengulangan akar נגשׁ dan kontras dengan izin khusus bagi Musa.
- source_word: וְהָעָם
  choice: dan bangsa itu
  rationale: הָעָם menunjuk kepada umat yang sudah dikenal dari konteks. 'Bangsa itu' mempertahankan bentuk definit tanpa menambahkan 'Israel', yang tidak dinyatakan dalam ayat ini.
- source_word: לֹא יַעֲלוּ
  choice: tidak boleh naik
  rationale: עלה menyatakan gerak naik, dalam konteks ini ke gunung; 'naik' alami dan mempertahankan gambaran ruangnya.
- source_word: עִמּוֹ
  choice: bersama Musa
  rationale: Secara harfiah berarti 'bersamanya'. Nama Musa diulang dalam bahasa Indonesia agar rujukan pronomina jelas dan tidak disalahpahami sebagai kelompok lain.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri perjanjian יְהוָה. 'Yahweh' mempertahankannya sebagai nama, sedangkan bentuk tradisional 'TUHAN' dicatat dalam catatan kaki agar pembaca mengenali padanannya.
- issue: Daya modal bentuk verba dalam konteks perintah
  choice: tidak boleh / boleh
  alternative: akan / tidak akan
  rationale: Walaupun bentuk Ibraninya secara morfologis dapat tampak sebagai yiqtol, rangkaian ketetapan dalam konteks memberikan daya direktif atau permisif. Ungkapan 'boleh' dan 'tidak boleh' menyampaikan batas akses tanpa mengubahnya menjadi sekadar ramalan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur dibuat ringkas, dengan pengulangan 'mendekat' dipertahankan untuk menonjolkan kontras dalam teks Ibrani. Tanda [a] ditempatkan langsung sesudah 'Yahweh'.
