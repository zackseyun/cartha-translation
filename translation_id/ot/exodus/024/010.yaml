  yaml_path: translation/ot/exodus/024/010.yaml
  text: And they saw the God of Israel[a], and under his feet was something like a pavement of sapphire stone[b], like the very heavens in clearness.
translation:
  language: id
  text: Mereka melihat Allah Israel, dan di bawah kaki-Nya tampak sesuatu seperti hamparan batu safir[a], sejernih langit itu sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “lapis lazuli”; identifikasi tepat סַפִּיר sebagai mineral di dunia kuno tidak pasti.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: Mereka melihat
  rationale: Bentuk Qal wayyiqtol dari ראה menyatakan penglihatan secara langsung; “melihat” mempertahankan ketegasan klaim naratif tanpa memperlunaknya.
- source_word: אֵת אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Penanda objek langsung diikuti frasa konstruksi menunjuk secara khusus kepada Allah yang disembah Israel. “Allah Israel” adalah ungkapan Indonesia yang alami dan tepat.
- source_word: וְתַחַת רַגְלָיו
  choice: dan di bawah kaki-Nya tampak
  rationale: תחת berarti “di bawah.” Ibrani memakai klausa tanpa verba; “tampak” dilengkapi dalam bahasa Indonesia agar deskripsi visualnya mengalir, sementara “kaki-Nya” mempertahankan bahasa antropomorfis teks.
- source_word: כְּמַעֲשֵׂה לִבְנַת
  choice: sesuatu seperti hamparan
  rationale: מַעֲשֶׂה menunjuk pada hasil atau bentuk pekerjaan, sedangkan לִבְנַת berkaitan dengan bata atau ubin. Dalam konteks permukaan di bawah kaki, “sesuatu seperti hamparan” menyampaikan bentuk permukaan buatan tanpa memberi kesan satu bata saja.
- source_word: הַסַּפִּיר
  choice: batu safir
  rationale: סַפִּיר secara tradisional diterjemahkan “safir,” meskipun identifikasi mineral kunonya tidak pasti. “Batu safir” mempertahankan istilah konvensional dan sifatnya sebagai batu permata.
- source_word: וּכְעֶצֶם הַשָּׁמַיִם
  choice: langit itu sendiri
  rationale: עֶצֶם di sini memberi penegasan, bukan berarti harfiah “tulang.” “Langit itu sendiri” menyampaikan bahwa kejernihannya menyerupai hakikat atau penampakan langit.
- source_word: לָטֹהַר
  choice: sejernih
  rationale: טֹהַר berarti kemurnian atau kejernihan. Dalam gambaran visual ini, “sejernih” secara alami mengungkapkan kualitas bening atau cerah yang dimaksud.
theological_decisions:
- issue: Penglihatan antropomorfis akan Allah
  choice: Mempertahankan pernyataan langsung “Mereka melihat Allah Israel” dan ungkapan “di bawah kaki-Nya.”
  alternative: “Mereka melihat penampakan Allah Israel” atau “mereka melihat tempat Allah Israel berdiri.”
  rationale: Teks Ibrani secara tegas mengatakan bahwa mereka melihat Allah Israel dan menyebut kaki-Nya. Terjemahan tidak menambahkan pembatas seperti “penampakan,” sehingga ketegangan teologis dalam teks tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami tanpa mengurangi ketegasan pernyataan bahwa mereka melihat Allah. “Kaki-Nya” memakai huruf kapital sesuai kebiasaan penulisan pronomina ilahi dalam bahasa Indonesia.
