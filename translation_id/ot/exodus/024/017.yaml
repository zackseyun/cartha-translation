base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/017.yaml
  text: And the appearance of the glory of Yahweh was like a consuming fire on the top of the mountain in the sight of the sons of Israel[a][b].
translation:
  language: id
  text: Penampakan kemuliaan Yahweh tampak seperti api yang melalap di puncak gunung di depan mata orang Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anak-anak Israel”; secara harfiah, “putra-putra Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַרְאֵה
  choice: tampaknya
  rationale: Dalam konstruksi ini, מַרְאֵה menunjuk pada rupa atau penampakan yang terlihat. “Tampaknya” menghasilkan kalimat Indonesia yang alami tanpa menyiratkan pengalaman penglihatan kenabian.
- source_word: כְּבוֹד
  choice: kemuliaan
  rationale: Ketika merujuk pada kehadiran Yahweh yang tampak, “kemuliaan” merupakan padanan baku dan sesuai konteks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: כְּאֵשׁ אֹכֶלֶת
  choice: seperti api yang melalap
  rationale: כְּ menandai perbandingan, sedangkan partisip אֹכֶלֶת secara harfiah berarti “memakan” dan secara idiomatis menggambarkan api yang melalap atau menghanguskan.
- source_word: בְּרֹאשׁ הָהָר
  choice: di puncak gunung
  rationale: Ungkapan ini menunjukkan lokasi pada bagian paling atas gunung; “di puncak gunung” ringkas dan alami.
- source_word: לְעֵינֵי
  choice: di depan mata
  rationale: Padanan ini mempertahankan gambaran visual ungkapan Ibrani dan menyatakan bahwa hal itu tampak jelas bagi mereka.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  rationale: Dalam konteks ini ungkapan tersebut berfungsi sebagai sebutan kolektif bagi orang-orang Israel. “Umat Israel” alami dalam bahasa Indonesia dan tidak membatasi rujukannya hanya kepada laki-laki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama pribadi; “Yahweh” mempertahankan fungsi nama itu tanpa menggantinya dengan gelar.
- issue: Sebutan perjanjian בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  alternative: anak-anak Israel; orang Israel
  rationale: Walaupun bentuk Ibraninya secara harfiah “anak-anak lelaki Israel,” ungkapan ini lazim menjadi sebutan kolektif bagi bangsa Israel. “Umat Israel” menyampaikan cakupan tersebut secara wajar dalam bahasa Indonesia tanpa menghapus identitas perjanjiannya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mempertahankan fokus visual teks Ibrani, sementara “api yang melalap” menjaga daya ungkap partisip aktif אֹכֶלֶת.
