  yaml_path: translation/ot/exodus/024/006.yaml
  text: Moses took half of the blood and put it in basins[a], and half of the blood he threw against the altar.
translation:
  language: id
  text: Musa mengambil setengah darah itu dan menaruhnya ke dalam baskom-baskom. Setengah darah itu dilontarkannya[a] ke mazbah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memercikkannya pada mazbah.” Kata Ibrani ini dapat menunjuk pada tindakan melontarkan darah dalam konteks kurban, yang dapat menghasilkan percikan pada mazbah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: Makna naratif biasa dari לקח dan padanan Indonesia yang langsung serta alami.
- source_word: חֲצִי הַדָּם
  choice: separuh dari darah itu
  rationale: Mempertahankan makna partitif dan ketakrifan frasa Ibrani.
- source_word: וַיָּשֶׂם
  choice: menaruhnya
  rationale: שׂים adalah verba penempatan yang luas; 'menaruh' alami untuk memasukkan darah ke dalam wadah.
- source_word: בָּאַגָּנֹת
  choice: dalam beberapa baskom
  rationale: אַגָּנֹת menunjuk wadah-wadah penampung cairan; bentuk jamak dinyatakan secara alami dalam bahasa Indonesia.
- source_word: זָרַק
  choice: dipercikkannya
  rationale: Dalam konteks kurban, זרק menggambarkan penerapan darah dengan melontarkan atau memercikkannya; pilihan ini lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'melemparkan darah'.
- source_word: עַל הַמִּזְבֵּחַ
  choice: pada mazbah
  rationale: עַל menandai sasaran atau permukaan tempat darah dikenakan; 'pada' mempertahankan cakupan maknanya tanpa menentukan secara berlebihan apakah darah mengenai bagian atas atau sisi mazbah.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
theological_decisions:
- issue: Tindakan ritual penerapan darah
  choice: dipercikkannya pada mazbah
  alternative: disiramkannya pada mazbah; dilemparkannya ke arah mazbah
  rationale: Ungkapan ini menyampaikan tindakan penerapan darah dalam ritus kurban secara alami, sementara catatan kaki mempertahankan kemungkinan bahwa זרק menyiratkan gerakan yang lebih kuat daripada percikan halus.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Mazbah' dipakai sebagai istilah ringkas yang lazim untuk altar kurban; susunan kalimat kedua dibuat alami tanpa menghilangkan pembagian darah menjadi dua bagian.
