  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֶל מֹשֶׁ֨ה אָמַ֜ר עֲלֵ֣ה אֶל יְהוָ֗ה אַתָּה֙ וְ/אַהֲרֹן֙ נָדָ֣ב וַ/אֲבִיה֔וּא וְ/שִׁבְעִ֖ים מִ/זִּקְנֵ֣י יִשְׂרָאֵ֑ל וְ/הִשְׁתַּחֲוִיתֶ֖ם מֵ/רָחֹֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/001.yaml
  text: Then he said to Moses[a], “Come up to Yahweh, you and Aaron, Nadab and Abihu, and seventy of the elders of Israel, and bow down from a distance.”
translation:
  language: id
  text: Kemudian Dia berkata kepada Musa[a], “Naiklah menghadap Yahweh, engkau bersama Harun, Nadab, Abihu, dan tujuh puluh orang dari antara para tua-tua Israel; hendaklah kalian sujud dari kejauhan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, susunan Ibraninya berbunyi, “Dan kepada Musa Dia berkata, ‘Naiklah menghadap Yahweh.’” Teks mempertahankan penyebutan “Yahweh” meskipun pembicaranya tampaknya Yahweh; sebagian terjemahan menghaluskannya menjadi “naiklah menghadap-Ku” atau “naiklah ke hadapan Yahweh.”
    reason: Menjelaskan rumusan Ibrani yang tidak lazim dan alternatif terjemahan tanpa menyelesaikan ambiguitas dalam teks utama.
lexical_decisions:
- source_word: וְ/אֶל מֹשֶׁה אָמַר
  choice: Kemudian Dia berkata kepada Musa
  rationale: Susunan Ibrani secara harfiah, 'Dan kepada Musa dia berkata,' membuka unit perkataan baru yang terkait dengan konteks sebelumnya. 'Kemudian' menghasilkan narasi Indonesia yang alami, sedangkan 'Dia' melengkapi subjek tersirat verba orang ketiga tunggal maskulin.
- source_word: עֲלֵה
  choice: Naiklah
  rationale: Imperatif עלה berarti naik atau mendaki. 'Naiklah' wajar dalam konteks pendakian menuju hadirat ilahi dan tidak menambahkan arah deiktis yang tidak wajib dalam bahasa Indonesia.
- source_word: אֶל יְהוָה
  choice: menghadap Yahweh
  rationale: Preposisi אֶל menyatakan gerak menuju. Dalam bahasa Indonesia, 'menghadap Yahweh' secara alami menyampaikan gerak mendekati hadirat-Nya sambil tetap mempertahankan nama ilahi dan rumusan orang ketiga yang tidak lazim.
- source_word: אַתָּה וְ/אַהֲרֹן נָדָב וַ/אֲבִיהוּא
  choice: engkau bersama Harun, Nadab, Abihu
  rationale: Pronomina eksplisit אַתָּה mengawali daftar orang yang dipanggil. 'Engkau bersama' memperjelas bahwa Musa dan orang-orang yang disebut harus naik, tanpa memberi penekanan berlebihan.
- source_word: וְ/שִׁבְעִים מִ/זִּקְנֵי יִשְׂרָאֵל
  choice: dan tujuh puluh orang dari antara para tua-tua Israel
  rationale: 'Konstruksi מן bersifat partitif: tujuh puluh orang dipilih dari kelompok para tua-tua Israel. ''Dari antara'' mempertahankan nuansa tersebut.'
- source_word: וְ/הִשְׁתַּחֲוִיתֶם
  choice: Sujudlah
  rationale: Verba ini menunjuk tindakan membungkuk atau merebahkan diri dengan hormat. 'Sujudlah' mempertahankan tindakan jasmani dan nuansa penghormatan tanpa membatasinya menjadi istilah ibadah yang semata-mata abstrak.
- source_word: מֵ/רָחֹק
  choice: dari kejauhan
  rationale: Frasa ini menyatakan jarak spasial dari hadirat ilahi. 'Dari kejauhan' jelas, alami, dan bermartabat dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian yang dinyatakan dalam sumber dan sesuai dengan lapisan konsultasi yang diberikan.
- issue: Rumusan tidak lazim ketika sang pembicara tampaknya adalah Yahweh tetapi berkata אֶל יְהוָה
  choice: 'Mempertahankan rujukan orang ketiga: ''menghadap Yahweh'''
  alternative: '''naiklah menghadap-Ku'' atau ''naiklah ke hadapan Yahweh'''
  rationale: Bahasa Ibrani secara eksplisit menyebut Yahweh, bukan pronomina orang pertama. Terjemahan tidak diam-diam menyelesaikan ketegangan tekstual atau teologis ini.
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam naratif yang jelas dan bermartabat. 'Engkau' dipakai dalam ujaran ilahi agar tetap alami dan khidmat; 'para tua-tua' mempertahankan sebutan kepemimpinan komunal, dan 'sujudlah' menyampaikan tindakan hormat secara konkret.
