base_translation:
  language: en
  yaml_path: translation/ot/exodus/024/018.yaml
  text: Moses entered into the midst of the cloud and went up the mountain[a]. And Moses was on the mountain forty days and forty nights.
translation:
  language: id
  text: Musa masuk ke tengah-tengah awan itu[a], lalu naik ke gunung. Musa berada di gunung itu selama empat puluh hari dan empat puluh malam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “ke dalam awan itu.” Bahasa Ibrani menegaskan bahwa Musa memasuki awan itu sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: masuk
  rationale: Dalam konteks ini, verba בוא menggambarkan gerak Musa memasuki awan; 'masuk' menyampaikan arah gerak itu secara alami.
- source_word: בְּתוֹךְ
  choice: ke tengah-tengah
  rationale: תּוֹךְ menunjuk bagian dalam atau tengah. Ungkapan ini menegaskan bahwa Musa masuk ke dalam awan itu sendiri, bukan sekadar mendekatinya.
- source_word: הֶעָנָן
  choice: awan itu
  rationale: Kata sandang Ibrani dipertahankan melalui 'itu', yang merujuk kepada awan yang sudah disebut dalam narasi.
- source_word: וַיַּעַל אֶל הָהָר
  choice: lalu naik ke gunung
  rationale: עלה menyatakan gerak naik, sedangkan אֶל menyatakan arah atau tujuan; susunan ini alami dalam bahasa Indonesia dan tidak menambahkan gagasan 'mendaki' yang lebih spesifik.
- source_word: וַיְהִי מֹשֶׁה בָּהָר
  choice: Musa berada di gunung itu
  rationale: היה menyatakan keadaan atau lokasi. 'Berada' lebih alami daripada 'ada' di sini dan tidak menambahkan nuansa 'tinggal' atau 'menetap'.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: selama empat puluh hari dan empat puluh malam
  rationale: Penambahan 'selama' membuat fungsi frasa sebagai keterangan durasi jelas dan alami dalam bahasa Indonesia tanpa mengubah makna.
theological_decisions:
- issue: Gambaran awan yang berkaitan dengan kehadiran ilahi
  choice: awan itu
  alternative: awan tebal itu
  rationale: Teks Ibrani memakai עָנָן dengan kata sandang, tanpa kata sifat yang berarti 'tebal'. Terjemahan mempertahankan gambaran teofanik tanpa memperluasnya secara interpretatif.
- issue: Seberapa jauh Musa memasuki awan
  choice: ke tengah-tengah awan itu
  alternative: ke dalam awan itu
  rationale: בְּתוֹךְ secara eksplisit menyoroti bagian tengah atau interior. Terjemahan utama mempertahankan penekanan ini, sementara catatan kaki mencatat bentuk Indonesia yang lebih ringkas.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Pengulangan nama Musa dipertahankan karena mencerminkan struktur teks Ibrani. 'Tengah-tengah' mempertahankan daya gambar sumber, sedangkan 'selama' memperjelas durasi secara alami.
