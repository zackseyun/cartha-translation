base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/008.yaml
  text: And the quota of bricks that they were making yesterday and the day before[a], you shall impose on them; you shall not reduce any of it, because they are idle. Therefore they are crying out, saying, ‘Let us go and sacrifice to our God.’
translation:
  language: id
  text: Kuota batu bata yang mereka hasilkan kemarin dan dua hari yang lalu[a] harus kalian kenakan kepada mereka; jangan kurangi sedikit pun dari kuota itu, sebab mereka malas. Itulah sebabnya mereka berseru, ‘Mari kita pergi dan mempersembahkan kurban kepada Allah kita.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini juga dapat dipahami secara idiomatis sebagai “dahulu” atau “seperti sebelumnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַתְכֹּנֶת
  choice: jatah
  rationale: Dalam konteks kerja paksa, kata ini menunjuk pada jumlah produksi yang ditetapkan. “Jatah batu bata” ringkas dan lazim dipahami sebagai target atau kuota wajib.
- source_word: הַלְּבֵנִים
  choice: batu bata
  rationale: Padanan konkret dan baku untuk bahan bangunan dalam konteks ini.
- source_word: תְּמוֹל שִׁלְשֹׁם
  choice: kemarin dan dua hari yang lalu
  rationale: Mempertahankan ungkapan waktu Ibrani secara jelas dalam bahasa Indonesia; kemungkinan fungsi idiomatis yang lebih luas dicatat dalam catatan kaki.
- source_word: תָּשִׂימוּ עֲלֵיהֶם
  choice: harus kalian bebankan kepada mereka
  rationale: Ungkapan menaruh sesuatu atas seseorang di sini berarti memberlakukan kewajiban. “Bebankan” mempertahankan nuansa administratif sekaligus menekan.
- source_word: לֹא תִגְרְעוּ מִמֶּנּוּ
  choice: jangan kurangi sedikit pun dari jumlah itu
  rationale: Menegaskan larangan mengurangi bagian mana pun dari jatah yang telah ditetapkan.
- source_word: נִרְפִּים
  choice: bermalas-malasan
  rationale: Menyampaikan tuduhan Firaun bahwa mereka tidak bekerja dengan giat, tanpa menyajikannya sebagai penilaian narator.
- source_word: צֹעֲקִים
  choice: berseru
  rationale: Menggambarkan seruan kuat yang diikuti ujaran langsung dan sesuai dengan ragam bahasa bermartabat.
- source_word: נֵלְכָה נִזְבְּחָה
  choice: Mari kita pergi dan mempersembahkan kurban
  rationale: Kedua bentuk kohortatif menyatakan ajakan atau tekad bersama; susunan ini alami dalam bahasa Indonesia.
- source_word: לֵאלֹהֵינוּ
  choice: kepada Allah kita
  rationale: Menyatakan bahwa Allah mereka adalah penerima kurban. “Kita” sesuai dengan ajakan langsung yang mencakup penutur dan kelompoknya.
