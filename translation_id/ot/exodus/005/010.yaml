  verdict: revise
  source_fidelity: Revisi diperlukan terutama pada נֹגְשֵׂי. “Pengerah kerja” dapat berarti pihak yang mengerahkan atau merekrut tenaga kerja dan tidak cukup menyatakan fungsi pengawasan serta pemaksaan kuota kerja yang dimaksud dalam konteks Keluaran. “Pengawas kerja paksa” lebih setia pada peran para taskmaster. Terjemahan “para mandor mereka” untuk שֹׁטְרָיו dapat dipertahankan, dengan catatan kaki untuk alternatif administratif yang lebih luas. Penolakan Firaun diterjemahkan secara lebih idiomatis dengan objek “jerami” yang dinyatakan.
  naturalness: “Bangsa itu” yang diulang terdengar kurang alami untuk הָעָם dalam narasi ini. “Rakyat itu” lebih wajar sebagai nomina kolektif. “Beginilah firman Firaun” bernada sangat sakral dan dalam pemakaian modern terutama berasosiasi dengan ujaran ilahi; “Beginilah kata Firaun” mempertahankan formula proklamasi tanpa konotasi tambahan. Susunan revisi tetap baku dan lancar.
  terminology: “Firaun” dan “jerami” sudah tepat. “Pengawas kerja paksa” membedakan נֹגְשִׂים dari שֹׁטְרִים, yang diterjemahkan “mandor.” Catatan kaki mempertahankan kemungkinan makna “pejabat bawahan” bagi שֹׁטְרָיו tanpa memaksakan satu pembacaan yang terlalu sempit.
