base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/010.yaml
  text: 'So the taskmasters of the people and their officers went out and said to the people[a], “Thus says Pharaoh: I am not giving you straw.”'
translation:
  language: id
  text: 'Kemudian para pengawas kerja paksa rakyat itu dan para mandor mereka keluar lalu berkata kepada rakyat itu[a], “Beginilah kata Firaun: Aku tidak memberikan jerami kepada kalian.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para pejabat mereka.” Istilah Ibrani ini dapat menunjuk pada pejabat bawahan dari kalangan rakyat itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹגְשֵׂי
  choice: para pengerah kerja
  rationale: Istilah ini menunjuk kepada orang-orang yang memaksa dan mengawasi pelaksanaan jatah kerja. “Pengerah kerja” menyampaikan fungsi tersebut secara alami tanpa menambahkan secara eksplisit status perbudakan yang tidak dinyatakan oleh kata itu sendiri.
- source_word: שֹׁטְרָיו
  choice: para mandor mereka
  rationale: Dalam konteks kerja paksa, para pejabat bawahan dari kalangan bangsa itu berfungsi sebagai mandor. Akhiran pronominal dipertahankan dengan “mereka,” yang merujuk kepada bangsa itu.
- source_word: וַיֵּצְאוּ
  choice: keluar
  rationale: Padanan langsung bagi verba gerak ini dan cocok dengan perpindahan mereka dari hadapan Firaun menuju bangsa itu.
- source_word: הָעָם
  choice: bangsa itu
  rationale: Kata benda kolektif ini merujuk kepada bangsa Israel; “bangsa itu” mempertahankan rujukan kolektif dan sesuai dengan konteks naratif.
- source_word: לֵאמֹר
  choice: lalu berkata
  rationale: Ungkapan pengantar tuturan langsung diterjemahkan secara idiomatis dalam bahasa Indonesia.
- source_word: כֹּה אָמַר
  choice: Beginilah firman
  rationale: Formula utusan yang resmi dipertahankan dengan ungkapan Indonesia yang lazim dan bermartabat; bentuk ini menyampaikan pernyataan penguasa yang sedang diberlakukan.
- source_word: פַּרְעֹה
  choice: Firaun
  rationale: Bentuk baku bahasa Indonesia untuk gelar raja Mesir.
- source_word: אֵינֶנִּי נֹתֵן
  choice: Aku tidak memberi
  rationale: Mempertahankan nuansa penolakan kini/berlangsung dari konstruksi partisipial tanpa membatasinya hanya pada masa depan.
- source_word: תֶּבֶן
  choice: jerami
  rationale: Padanan baku bagi bahan yang dipakai dalam pembuatan batu bata dalam konteks ini.
