base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/015.yaml
  text: Then the officers of the sons of Israel came and cried out to Pharaoh[a], saying[c][b], “Why do you do this to your servants?”
translation:
  language: id
  text: Kemudian mandor-mandor Israel datang dan berseru kepada Firaun, “Mengapa engkau berbuat demikian kepada hamba-hambamu?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “budak-budakmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Kemudian ... datang
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita; 'Kemudian' menyatakannya secara alami dalam bahasa Indonesia.
- source_word: שֹׁטְרֵי
  choice: para mandor
  rationale: Dalam konteks kerja paksa di Keluaran, istilah ini menunjuk para pengawas bawahan Israel yang berada di bawah pejabat Mesir; 'mandor' paling jelas menyampaikan peran kerja mereka.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: Ungkapan ini mempertahankan corak kekeluargaan harfiah 'anak-anak lelaki/keturunan Israel' dan sudah lazim serta bermartabat dalam bahasa Indonesia Alkitabiah.
- source_word: וַיִּצְעֲקוּ
  choice: berseru
  rationale: Kata kerja ini menyatakan seruan atau permohonan yang mendesak, bukan sekadar berbicara atau mengajukan permintaan resmi.
- source_word: אֶל פַּרְעֹה
  choice: kepada Firaun
  rationale: Preposisi menunjukkan arah seruan kepada Firaun; 'kepada' merupakan padanan idiomatis alami.
- source_word: לֵאמֹר
  choice: tidak dinyatakan secara terpisah
  rationale: Dalam bahasa Indonesia, kutipan langsung setelah verba 'berseru' secara alami sudah menjalankan fungsi pengantar ujaran לֵאמֹר; menambahkan 'dengan berkata' akan terasa kaku.
- source_word: לָמָּה
  choice: Mengapa
  rationale: Padanan langsung dan alami untuk kata tanya yang meminta alasan.
- source_word: תַעֲשֶׂה כֹה
  choice: engkau berbuat demikian
  rationale: Terjemahan ini dekat dengan susunan Ibrani 'berbuat demikian' sambil tetap wajar dalam register permohonan resmi.
- source_word: לַעֲבָדֶיךָ
  choice: terhadap hamba-hambamu
  rationale: עבד dapat berarti hamba atau budak. Dalam sapaan merendahkan diri kepada raja, 'hamba-hambamu' mempertahankan register istana tanpa meniadakan kemungkinan status perbudakan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dengan nuansa permohonan resmi kepada raja. 'Bani Israel' mempertahankan ungkapan kekeluargaan sumber, sedangkan 'mandor' memperjelas fungsi para pejabat pekerja Israel dalam konteks pasal ini.
