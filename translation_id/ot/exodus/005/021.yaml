  to: Lalu mereka berkata kepada mereka, “Kiranya Yahweh memperhatikan kalian dan menghakimi kalian, sebab kalian telah membuat kami berbau busuk di mata Firaun dan para pegawainya,[a] dengan menaruh pedang di tangan mereka untuk membunuh kami.”
