  text: וַ/יֹּאמְר֣וּ אֲלֵ/הֶ֔ם יֵ֧רֶא יְהוָ֛ה עֲלֵי/כֶ֖ם וְ/יִשְׁפֹּ֑ט אֲשֶׁ֧ר הִבְאַשְׁתֶּ֣ם אֶת רֵיחֵ֗/נוּ בְּ/עֵינֵ֤י פַרְעֹה֙ וּ/בְ/עֵינֵ֣י עֲבָדָ֔י/ו לָֽ/תֶת חֶ֥רֶב בְּ/יָדָ֖/ם לְ/הָרְגֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/021.yaml
  text: And they said to them[a], “May Yahweh look on you and judge, because you have made us stink in the sight of Pharaoh and in the sight of his servants, putting a sword in their hand to kill us.”
translation:
  language: id
  text: Lalu mereka berkata kepada mereka, “Kiranya Yahweh memperhatikan kalian dan menghakimi kalian, sebab kalian telah membuat kami berbau busuk di mata Firaun dan para pegawainya,[a] dengan menaruh pedang di tangan mereka untuk membunuh kami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “kalian telah membuat bau kami busuk di mata Firaun dan di mata para pegawainya,” yaitu membuat mereka memandang kami sebagai orang yang menjijikkan atau memualkan.'
    reason: Menjelaskan metafora Ibrani yang dipertahankan dalam teks utama serta pengulangan idiom 'di mata'.
lexical_decisions:
- source_word: וַיֹּאמְרוּ אֲלֵהֶם
  choice: Lalu mereka berkata kepada keduanya
  rationale: Waw-konsekutif melanjutkan alur narasi. Pronomina jamak Ibrani dipertahankan tanpa menyisipkan nama Musa dan Harun; 'keduanya' memperjelas bahwa acuannya adalah dua orang.
- source_word: יֵרֶא יְהוָה עֲלֵיכֶם וְיִשְׁפֹּט
  choice: Kiranya Yahweh memperhatikan kalian dan menghakimi kalian
  rationale: Kedua bentuk imperfek berfungsi secara yusif sebagai seruan agar Allah memperhatikan perkara mereka dan menjatuhkan penghakiman. 'Memperhatikan' lebih alami daripada 'melihat atas' dan tetap menyampaikan perhatian ilahi.
- source_word: אֲשֶׁר
  choice: sebab
  rationale: Kata penghubung ini memperkenalkan alasan bagi seruan penghakiman.
- source_word: הִבְאַשְׁתֶּם אֶת־רֵיחֵנוּ
  choice: kalian telah membuat kami berbau busuk
  rationale: Ungkapan harfiahnya, 'membuat bau kami busuk,' adalah metafora tentang menjadikan mereka menjijikkan atau dibenci. Terjemahan ini mempertahankan citra bau tanpa menghasilkan susunan Indonesia yang janggal.
- source_word: בְּעֵינֵי פַרְעֹה וּבְעֵינֵי עֲבָדָיו
  choice: di mata Firaun dan para pegawainya
  rationale: Idiom 'di mata' wajar dalam bahasa Indonesia dan menyatakan penilaian atau pandangan Firaun beserta para pejabat bawahannya. Pengulangan 'di mata' tidak diperlukan dalam bahasa sasaran.
- source_word: לָתֶת חֶרֶב בְּיָדָם
  choice: sehingga memberi mereka pedang
  rationale: Infinitif dipahami sebagai hasil atau akibat tindakan Musa dan Harun. Pedang tunggal kolektif dipertahankan, sementara 'di tangan mereka' tersirat secara alami oleh verba 'memberi'.
- source_word: לְהָרְגֵנוּ
  choice: untuk membunuh kami
  rationale: Terjemahan langsung dan modern dari infinitif dengan sufiks orang pertama jamak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama diri ilahi YHWH. 'Yahweh' mempertahankan nama perjanjian itu, bukan menggantinya dengan gelar.
- issue: Daya ujar יֵרֶא ... וְיִשְׁפֹּט
  choice: 'permohonan kutukan: ''Kiranya ... memperhatikan ... dan menghakimi'''
  alternative: 'pernyataan masa depan: ''Yahweh akan melihat ... dan menghakimi'''
  rationale: Dalam konteks keluhan terhadap Musa dan Harun, bentuk-bentuk ini paling wajar dibaca secara yusif, sebagai permohonan agar Yahweh bertindak sebagai hakim, tanpa menentukan terlebih dahulu seperti apa putusan-Nya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk 'kalian' dipakai karena teguran ditujukan kepada dua orang, dan 'para pegawai' dipilih untuk עֲבָדָיו dalam arti pejabat atau pelayan Firaun. Metafora bau tetap dipertahankan, dengan penjelasan dalam catatan kaki.
