  naturalness: Teks pada umumnya baku dan alami. Namun, 'sehingga memberi mereka pedang' menghasilkan konstruksi partisipial yang menggantung serta menghilangkan unsur 'di tangan mereka'. 'Dengan menaruh pedang di tangan mereka' jelas, alami, dan dekat dengan citraan Ibrani.
  terminology: '''Yahweh'', ''Firaun'', ''menghakimi'', dan ''di mata'' sesuai dengan istilah serta register yang diinginkan. Catatan kaki sebaiknya membatasi penjelasan pada makna ''menjijikkan/memualkan'' tanpa menambahkan ''dibenci'', yang tidak dinyatakan secara khusus oleh ungkapan Ibrani.'
