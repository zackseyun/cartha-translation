    issue: '''kepada keduanya'' menambahkan penanda jumlah yang tidak ada dalam teks Ibrani.'
    rationale: אֲלֵהֶם hanya berarti 'kepada mereka'. Walaupun rujukannya adalah Musa dan Harun dari konteks, teks utama sebaiknya mempertahankan pronomina tanpa penjelasan tambahan.
  - severity: high
