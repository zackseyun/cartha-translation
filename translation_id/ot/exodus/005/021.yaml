    rationale: לָתֵת חֶרֶב בְּיָדָם memuat idiom 'menaruh/memberi pedang di tangan mereka'. Terjemahan draf menghilangkan 'di tangan mereka' dan 'sehingga memberi' tidak memiliki subjek yang jelas dalam bahasa Indonesia.
  - severity: low
    issue: Catatan kaki menambahkan kemungkinan 'dibenci'.
    rationale: Metafora tersebut menyatakan bahwa mereka dibuat tampak busuk, menjijikkan, atau memualkan dalam pandangan Firaun dan para pegawainya; 'dibenci' merupakan penajaman interpretatif yang tidak perlu.
