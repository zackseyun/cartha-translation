  text: וַ/יֹּ֣אמֶר פַּרְעֹ֔ה מִ֤י יְהוָה֙ אֲשֶׁ֣ר אֶשְׁמַ֣ע בְּ/קֹל֔/וֹ לְ/שַׁלַּ֖ח אֶת יִשְׂרָאֵ֑ל לֹ֤א יָדַ֨עְתִּי֙ אֶת יְהוָ֔ה וְ/גַ֥ם אֶת יִשְׂרָאֵ֖ל לֹ֥א אֲשַׁלֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/002.yaml
  text: Pharaoh said[a], “Who is Yahweh, that I should obey his voice and let Israel go? I do not know Yahweh, and moreover I will not let Israel go.”
translation:
  language: id
  text: Firaun berkata, “Siapakah Yahweh[a], sehingga aku harus menaati suaranya dan membiarkan Israel pergi? Aku tidak mengenal Yahweh, dan terlebih lagi, aku tidak akan membiarkan Israel pergi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH, nama ilahi yang secara tradisional diterjemahkan “TUHAN”. Bentuk transliterasi lain mencakup “Yehuwa”.'
    reason: Menjelaskan bentuk nama ilahi dalam bahasa Ibrani serta tradisi penerjemahannya tanpa menyebut bentuk yang dipakai dalam teks utama sebagai alternatif.
lexical_decisions:
- source_word: פַּרְעֹה
  choice: Firaun
  rationale: Bentuk baku dalam bahasa Indonesia untuk gelar raja Mesir.
- source_word: מִי
  choice: Siapakah
  rationale: Kata tanya ini menanyakan identitas dan mempertahankan nada tantangan Firaun.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH alih-alih menggantinya dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap terlihat.
- source_word: אֲשֶׁר אֶשְׁמַע בְּקֹלוֹ
  choice: sehingga aku harus menaati suara-Nya
  rationale: Ungkapan שׁמע בְּקוֹל menyatakan mendengarkan dengan ketaatan; terjemahan ini mempertahankan unsur 'suara' sekaligus menyampaikan maksud idiomatisnya.
- source_word: לְשַׁלַּח אֶת יִשְׂרָאֵל
  choice: membiarkan Israel pergi
  rationale: Dalam konteks tuntutan kepada Firaun, שׁלח secara idiomatis berarti mengizinkan atau melepaskan Israel untuk pergi.
- source_word: לֹא יָדַעְתִּי
  choice: Aku tidak mengenal
  rationale: Bentuk perfektum menyatakan sikap Firaun saat itu; 'tidak mengenal' mempertahankan kemungkinan makna tidak mengetahui maupun tidak mengakui tanpa mempersempitnya secara berlebihan.
- source_word: וְגַם
  choice: dan terlebih lagi
  rationale: Gabungan ini menambahkan penegasan pada penolakan berikutnya, bukan sekadar menghubungkan dua klausa.
- source_word: לֹא אֲשַׁלֵּחַ
  choice: aku tidak akan membiarkan ... pergi
  rationale: Bentuk imperfektum menyampaikan tekad atau penolakan Firaun mengenai tindakan yang diminta.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. 'Yahweh' mempertahankan nama tersebut, sementara catatan kaki memberi tahu pembaca tentang bentuk Ibrani dan tradisi penerjemahan lainnya.
- issue: Makna pernyataan Firaun bahwa ia tidak mengenal Yahweh
  choice: Aku tidak mengenal Yahweh
  alternative: Aku tidak mengakui Yahweh
  rationale: '''Mengenal'' mempertahankan keluasan makna ידע, termasuk ketidaktahuan dan penolakan untuk mengakui, sehingga ketegangan dalam ucapan Firaun tidak diselesaikan secara sepihak.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur pertanyaan retoris serta pengulangan 'membiarkan Israel pergi' dipertahankan untuk mencerminkan ketegasan dan nada menantang dalam teks Ibrani.
