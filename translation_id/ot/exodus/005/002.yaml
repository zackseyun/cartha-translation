  - severity: low
    issue: Bentuk "Yehova" kurang lazim dalam bahasa Indonesia.
    rationale: '"Yehuwa" adalah bentuk Indonesia yang lebih dikenal untuk alternatif "Jehovah"; catatan dapat pula membatasi diri pada penjelasan YHWH dan "TUHAN" agar tidak membebani ayat.'
  - severity: low
