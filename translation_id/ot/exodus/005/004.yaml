review_pass:
  verdict: approve
  source_fidelity: Teks Indonesia secara akurat menyampaikan respons raja Mesir. “Membuat rakyat meninggalkan pekerjaannya” mempertahankan daya kausatif תַּפְרִיעוּ dan tuduhan bahwa Musa dan Harun mengalihkan rakyat dari pekerjaan mereka. “Menanggung beban kerja kalian” menyampaikan סִבְלֹתֵיכֶם sebagai beban/kewajiban kerja yang menindas tanpa memaksakan istilah “kerja paksa” ke dalam teks utama.
  naturalness: Bahasanya baku, modern, dan wajar. Sapaan jamak “kalian” tepat bagi Musa dan Harun, sedangkan “rakyat” dan “pekerjaannya” dapat berfungsi secara kolektif dalam konteks ini. “Namun” cocok untuk tanggapan yang kontras dalam alur dialog.
  terminology: Nama Musa dan Harun sudah baku. “Raja Mesir,” “rakyat,” “pekerjaan,” dan “beban kerja” sesuai register naratif dan tidak menambahkan penafsiran teologis atau denominasi.
