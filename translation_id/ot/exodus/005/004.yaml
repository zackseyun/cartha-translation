base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/004.yaml
  text: But the king of Egypt said to them[a], “Why, Moses and Aaron[b], are you causing the people to neglect their work? Go to your burdens.”
translation:
  language: id
  text: Namun, raja Mesir berkata kepada mereka, “Mengapa kalian, Musa dan Harun, membuat rakyat meninggalkan pekerjaannya?[a] Kembalilah menanggung beban kerja kalian.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengalihkan perhatian rakyat dari pekerjaannya?”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Pergilah kepada beban-beban kalian”; dapat juga diterjemahkan “Kembalilah kepada kerja paksa kalian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Namun, ... berkata
  rationale: Bentuk naratif ini melanjutkan alur, sedangkan “Namun” secara alami menandai tanggapan Firaun yang berlawanan dengan permintaan Musa dan Harun pada ayat sebelumnya.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: raja Mesir
  rationale: Menerjemahkan konstruksi posesif Ibrani secara langsung dan wajar dalam bahasa Indonesia.
- source_word: לָמָּה
  choice: Mengapa
  rationale: Mempertahankan pertanyaan langsung dengan ungkapan Indonesia yang sederhana dan alami.
- source_word: תַּפְרִיעוּ
  choice: membuat ... meninggalkan
  rationale: Bentuk Hifil menyatakan tindakan menyebabkan rakyat berhenti atau menjauh dari pekerjaan mereka. Pilihan ini mempertahankan daya kausatif dan nada tuduhan sang raja tanpa memberi kesan pembebasan yang positif.
- source_word: הָעָם
  choice: rakyat
  rationale: Dalam konteks perkataan raja Mesir, “rakyat” merupakan padanan alami bagi sebutan kolektif Ibrani dan tidak mempersempitnya menjadi sekadar “para pekerja”.
- source_word: מִמַּעֲשָׂיו
  choice: pekerjaannya
  rationale: Pronomina tunggal Ibrani mengikuti nomina kolektif “rakyat”; bentuk tunggal “pekerjaannya” mempertahankan konstruksi kolektif dan tetap alami dalam bahasa Indonesia.
- source_word: לְכוּ
  choice: Kembalilah
  rationale: Imperatif harfiah berarti “pergilah”, tetapi dalam konteks perintah untuk kembali menjalankan kewajiban kerja, “Kembalilah” menyampaikan arah pragmatisnya dengan jelas.
- source_word: לְסִבְלֹתֵיכֶם
  choice: menanggung beban kerja kalian
  rationale: סְבָלוֹת menunjuk pada beban dan kerja berat yang diwajibkan. Ungkapan ini mempertahankan citra beban sekaligus memperjelas bahwa yang dimaksud ialah kewajiban kerja.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Dialog dibuat tegas sesuai nada sang raja. Pronomina “kalian” dipakai karena Musa dan Harun disapa sebagai dua orang, sementara “rakyat” diperlakukan sebagai nomina kolektif.
