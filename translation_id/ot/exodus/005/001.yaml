  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אַחַ֗ר בָּ֚אוּ מֹשֶׁ֣ה וְ/אַהֲרֹ֔ן וַ/יֹּאמְר֖וּ אֶל פַּרְעֹ֑ה כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שַׁלַּח֙ אֶת עַמִּ֔/י וְ/יָחֹ֥גּוּ לִ֖/י בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/001.yaml
  text: 'Afterward Moses and Aaron went in and said to Pharaoh[a], “Thus says Yahweh, the God of Israel: Let my people go[b], so that they may hold a feast to me in the wilderness.”'
translation:
  language: id
  text: 'Sesudah itu, Musa dan Harun datang menghadap Firaun dan berkata, “Beginilah firman Yahweh[a], Allah Israel: Biarkan umat-Ku pergi agar mereka merayakan hari raya bagi-Ku[b] di padang belantara.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH, nama ilahi yang juga sering diterjemahkan sebagai “TUHAN”.'
    reason: Menjelaskan bentuk nama ilahi dalam teks sumber dan tradisi penerjemahan alternatif.
  - marker: b
    text: Dapat juga diterjemahkan “mengadakan perayaan bagi-Ku”; kata kerja Ibrani menunjuk pada perayaan hari raya atau festival.
    reason: Mempertahankan cakupan leksikal kata חָגַג dan menjelaskan alternatif ungkapan Indonesia.
lexical_decisions:
- source_word: וְאַחַר
  choice: Sesudah itu
  rationale: Penanda waktu ini melanjutkan urutan cerita tanpa menentukan berapa lama selang waktunya.
- source_word: בָּאוּ
  choice: datang menghadap
  rationale: Dalam konteks audiensi dengan seorang raja, ungkapan ini menyampaikan bahwa Musa dan Harun datang ke hadapan Firaun, bukan sekadar tiba di suatu tempat.
- source_word: וַיֹּאמְרוּ אֶל־פַּרְעֹה
  choice: berkata ... kepada Firaun
  rationale: Ini merupakan rumusan naratif biasa untuk memperkenalkan perkataan langsung; susunan Indonesia dibuat alami dengan 'berkata' setelah penyebutan Firaun sebagai pihak yang dihadap.
- source_word: כֹּה אָמַר
  choice: Beginilah firman
  rationale: Ungkapan ini mempertahankan nada resmi dan berwibawa dari formula seorang utusan yang menyampaikan pesan ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai 'Yahweh' agar nama diri dalam teks Ibrani tetap tampak dan tidak diganti secara diam-diam dengan gelar.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Bentuk konstruksi Ibrani diterjemahkan secara ringkas dan wajar dalam bahasa Indonesia, dengan tetap menyatakan hubungan khusus Yahweh dengan Israel.
- source_word: שַׁלַּח אֶת־עַמִּי
  choice: Biarkan umat-Ku pergi
  rationale: Perintah kepada Firaun menuntut agar ia melepaskan Israel; pilihan ini mempertahankan daya imperatifnya dan terdengar alami dalam bahasa Indonesia.
- source_word: וְיָחֹגּוּ לִי
  choice: agar mereka merayakan hari raya bagi-Ku
  rationale: Kata kerja חָגַג menunjuk pada perayaan hari raya atau festival keagamaan, bukan ibadah secara umum. 'Agar' menyatakan tujuan pelepasan yang dituntut.
- source_word: בַּמִּדְבָּר
  choice: di padang belantara
  rationale: מִדְבָּר menunjuk pada kawasan liar atau tandus dan tidak harus berupa gurun pasir; 'padang belantara' mempertahankan cakupan tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi YHWH. Bentuk 'Yahweh' mempertahankan nama itu, sedangkan tradisi lain menggantinya dengan gelar 'TUHAN'; catatan kaki memberi tahu pembaca tentang perbedaan tersebut tanpa mengaburkan bentuk sumber.
- issue: Makna tujuan וְיָחֹגּוּ לִי
  choice: agar mereka merayakan hari raya bagi-Ku
  alternative: agar mereka beribadah kepada-Ku
  rationale: Kata kerja Ibrani secara khusus berkaitan dengan perayaan hari raya. Terjemahan umum 'beribadah' akan menghilangkan nuansa perayaan ritual yang nyata dalam sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Beginilah firman' mempertahankan nada resmi pesan ilahi, sedangkan 'datang menghadap' dan 'padang belantara' dipilih agar jelas bagi pembaca umum tanpa menjadi terlalu bebas.
