  text: So Pharaoh commanded on that day the taskmasters of the people and his officers[a], saying[c][b],
translation:
  language: id
  text: Pada hari itu[a], Firaun memerintahkan para pengerah kerja atas rakyat itu[b] dan para petugasnya[c] dengan berkata,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pada hari itu juga”. Secara harfiah, “pada hari itu”; ungkapan ini dapat menekankan bahwa perintah tersebut segera diberikan.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani ini menunjuk kepada orang-orang yang mendesak atau menuntut kerja; dapat juga diterjemahkan “para pengawas kerja”.
    reason: lexical_alternative
  - marker: c
    text: Atau “para mandornya”. Istilah Ibrani ini menunjuk kepada pejabat bawahan dalam tata kerja paksa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: memerintahkan
  rationale: Bentuk naratif dari צוה menyatakan perintah berwenang dan melanjutkan rangkaian peristiwa dengan kala lampau yang tersirat dalam bahasa Indonesia.
- source_word: פַּרְעֹה
  choice: Firaun
  rationale: Bentuk baku dalam bahasa Indonesia untuk gelar raja Mesir.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu juga
  rationale: Ungkapan waktu ini secara harfiah berarti 'pada hari itu'; penambahan 'juga' secara wajar menonjolkan kedekatan waktunya dalam alur cerita tanpa mengubah acuannya.
- source_word: הַנֹּגְשִׂים
  choice: para pengerah kerja
  rationale: Dalam konteks kerja paksa di Keluaran, kata ini menunjuk kepada orang-orang yang mendesak atau menuntut pekerjaan dari para pekerja. 'Pengerah kerja' mempertahankan unsur pemaksaan lebih baik daripada istilah administratif yang netral.
- source_word: בָּעָם
  choice: yang membawahi bangsa itu
  rationale: Preposisi ב menghubungkan para pengerah kerja dengan bangsa yang berada dalam lingkup tugas atau kewenangan mereka. Ungkapan ini alami dalam bahasa Indonesia, meskipun 'di antara bangsa itu' juga mungkin.
- source_word: שֹׁטְרָיו
  choice: para petugasnya
  rationale: Kata שׁטרים menunjuk kepada pejabat bawahan dalam tata kerja paksa. 'Petugas' cukup luas untuk mempertahankan sifat jabatan itu, sedangkan 'mandor' lebih khusus.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Rumus Ibrani ini memperkenalkan perkataan langsung yang dimulai pada ayat berikutnya. 'Katanya' merupakan penghubung naratif yang alami dan tetap formal.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif resmi. 'Firaun' mengikuti bentuk Alkitabiah yang lazim; 'pengerah kerja' dan 'petugas' membedakan dua tingkat pelaksana dalam sistem kerja paksa. Penanda catatan kaki ditempatkan tepat sesudah unsur yang diterangkan.
