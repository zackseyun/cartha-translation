  text: Let the work be heavy on the men[a], so that they may labor at it and not pay attention to lying words.
translation:
  language: id
  text: Hendaklah pekerjaan itu dibuat lebih berat bagi para lelaki itu, supaya mereka mengerjakannya dan tidak menghiraukan perkataan dusta[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “perkataan palsu” atau “perkataan yang menyesatkan.” Kata kerja Ibrani yang diterjemahkan “menghiraukan” juga dapat berarti “memperhatikan” atau “mengindahkan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּכְבַּד
  choice: diperberat
  rationale: Bentuk Qal secara harfiah berarti ‘menjadi berat’, tetapi dalam perintah Firaun konteksnya menuntut agar beban kerja dibuat semakin berat. ‘Diperberat’ mengungkapkan maksud kontekstual itu secara alami dalam bahasa Indonesia.
- source_word: הָעֲבֹדָה
  choice: pekerjaan itu
  rationale: עֲבֹדָה menunjuk pada pekerjaan atau kerja paksa yang telah dibicarakan; ‘pekerjaan itu’ jelas dan alami.
- source_word: עַל הָאֲנָשִׁים
  choice: bagi orang-orang itu
  rationale: עַל menggambarkan beban yang dikenakan kepada mereka. Dalam bahasa Indonesia, ‘diperberat bagi’ menyampaikan hubungan tersebut tanpa ungkapan kaku ‘di atas’. הָאֲנָשִׁים merujuk kepada kelompok pekerja yang sudah diketahui dari konteks.
- source_word: וְיַעֲשׂוּ בָהּ
  choice: supaya mereka terus mengerjakannya
  rationale: עשה dengan בָהּ berarti melakukan atau mengerjakan pekerjaan itu. ‘Supaya’ menyatakan nuansa tujuan, sedangkan ‘terus’ secara alami menggambarkan perhatian penuh pada pekerjaan tanpa menambahkan gagasan baru yang berarti.
- source_word: וְאַל יִשְׁעוּ
  choice: dan tidak menghiraukan
  rationale: שעה dapat berarti memperhatikan, mengindahkan, atau menghiraukan. ‘Tidak menghiraukan’ merupakan larangan yang jelas dan wajar dalam bahasa Indonesia.
- source_word: בְּדִבְרֵי שָׁקֶר
  choice: perkataan dusta
  rationale: דִּבְרֵי berarti perkataan-perkataan, sedangkan שָׁקֶר berarti kepalsuan atau dusta. ‘Perkataan dusta’ mempertahankan penilaian meremehkan Firaun terhadap pesan Musa dan Harun.
