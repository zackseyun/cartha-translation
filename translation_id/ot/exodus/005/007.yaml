  terminology: “Jerami” dan “batu bata” tepat dan konsisten. “Bangsa itu” dapat dipahami, tetapi “rakyat itu” lebih wajar untuk לָעָם dalam ujaran penguasa kepada para pejabatnya dan tidak mempersempit atau menambah makna.
