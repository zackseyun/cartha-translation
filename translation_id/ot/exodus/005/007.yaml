  register: Bahasa Indonesia modern, lugas, dan berwibawa. Larangan langsung dipertahankan. Ungkapan 'mengumpulkan sendiri jerami bagi mereka' sengaja menjaga penekanan refleksif sekaligus dativus לָהֶם, meski sedikit lebih formal daripada percakapan sehari-hari.
