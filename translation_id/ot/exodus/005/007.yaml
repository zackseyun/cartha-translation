  source_fidelity: 'Makna utama diterjemahkan dengan tepat: penghentian pemberian jerami, tujuan pembuatan batu bata, idiom waktu lampau, serta perintah agar para pekerja mengumpulkan jerami sendiri. Namun, keterangan harfiah catatan kaki keliru karena שִׁלְשׁוֹם tidak berarti “tiga hari yang lalu” dalam ungkapan ini, melainkan “sehari sebelum kemarin”/“hari sebelumnya.”'
