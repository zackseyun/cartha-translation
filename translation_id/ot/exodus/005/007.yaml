  - severity: low
    issue: Frasa “sendiri jerami bagi mereka” bersifat redundan.
    rationale: Pronomina datif לָהֶם secara idiomatis tercakup dalam “jerami sendiri”; penambahan “bagi mereka” tidak menambah informasi dan membuat kalimat kaku.
