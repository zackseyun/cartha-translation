  text: You shall no longer give straw to the people for making bricks as before[a]; let them go and gather straw for themselves.
translation:
  language: id
  text: “Jangan lagi berikan jerami kepada rakyat itu untuk membuat batu bata seperti sebelumnya[a]. Biarlah mereka pergi mengumpulkan jerami sendiri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seperti kemarin dan sehari sebelum kemarin,” sebuah ungkapan yang berarti “seperti sebelumnya” atau “dahulu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֹאסִפוּן
  choice: Jangan lagi
  rationale: Bentuk Hifil יסף dengan negasi menyatakan penghentian kebiasaan yang sedang berlangsung; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya perintahnya.
- source_word: לָתֵת
  choice: berikan
  rationale: נתן adalah verba umum 'memberi'; bentuk imperatif Indonesia sesuai dengan larangan dalam konteks.
- source_word: תֶּבֶן
  choice: jerami
  rationale: Padanan baku untuk bahan tumbuhan kering yang dipakai dalam pembuatan batu bata, dan diterjemahkan konsisten pada kedua kemunculannya.
- source_word: לָעָם
  choice: kepada bangsa itu
  rationale: עם berarti 'bangsa' atau 'rakyat'. 'Bangsa itu' mempertahankan sebutan kolektif Ibrani dan menunjuk kelompok Israel yang telah disebutkan dalam konteks.
- source_word: לִלְבֹּן הַלְּבֵנִים
  choice: untuk membuat batu bata
  rationale: Infinitif dengan objek menyatakan tujuan; terjemahan ini dekat dengan struktur sumber sekaligus alami.
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: seperti sebelumnya
  rationale: Ungkapan idiomatis yang secara harfiah merujuk kepada hari-hari terdahulu berarti 'seperti dahulu/sebelumnya'; bentuk alami dipakai dalam teks dan arti harfiah dicatat.
- source_word: הֵם יֵלְכוּ
  choice: Biarkan mereka pergi
  rationale: Pronomina mandiri dan bentuk imperfek memiliki daya direktif/jusif dalam konteks; pilihan ini mempertahankan bentuk perintah mengenai tindakan mereka.
- source_word: וְקֹשְׁשׁוּ
  choice: mengumpulkan
  rationale: קשש berarti menghimpun atau memungut bahan yang tersebar; 'mengumpulkan' jelas dan tepat dalam konteks.
- source_word: לָהֶם
  choice: sendiri ... bagi mereka
  rationale: Dativus pronominal menandakan bahwa mereka harus memperoleh jerami untuk diri mereka sendiri, tanpa disediakan oleh para mandor; susunan ini juga mempertahankan unsur 'bagi mereka' yang eksplisit.
theological_decisions: []
