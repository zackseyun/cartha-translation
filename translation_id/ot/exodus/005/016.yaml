language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: תֶּ֗בֶן אֵ֤ין נִתָּן֙ לַ/עֲבָדֶ֔י/ךָ וּ/לְבֵנִ֛ים אֹמְרִ֥ים לָ֖/נוּ עֲשׂ֑וּ וְ/הִנֵּ֧ה עֲבָדֶ֛י/ךָ מֻכִּ֖ים וְ/חָטָ֥את עַמֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/016.yaml
  text: No straw is given to your servants[a], yet they say to us, ‘Make bricks!’ And behold, your servants are being beaten, but the fault is with your own people.
translation:
  language: id
  text: Jerami tidak diberikan kepada hamba-hambamu, tetapi mereka berkata kepada kami, ‘Buatlah batu bata!’ Lihatlah, hamba-hambamu dipukuli, padahal rakyatmu sendiri yang bersalah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “dan rakyatmu telah berdosa.” Klausa Ibraninya ringkas dan dapat diterjemahkan demikian, tetapi dalam konteks kemungkinan besar berarti bahwa kesalahan terletak pada orang-orang Firaun.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֶּבֶן
  choice: jerami
  rationale: Padanan Indonesia yang lazim untuk bahan tumbuhan yang digunakan dalam pembuatan batu bata pada konteks ini.
- source_word: אֵין נִתָּן
  choice: tidak diberikan
  rationale: Konstruksi eksistensial negatif dengan partisip pasif menyatakan bahwa jerami tidak disediakan; bentuk pasif ini mempertahankan struktur dan maksud sumber.
- source_word: לַעֲבָדֶיךָ / עֲבָדֶיךָ
  choice: hamba-hambamu
  rationale: Dalam ujaran kepada Firaun, istilah ini sekaligus menyatakan ketundukan sosial dan bahasa penghormatan; 'hamba-hambamu' mempertahankan keduanya.
- source_word: לְבֵנִים
  choice: batu bata
  rationale: Merujuk pada hasil produksi yang dituntut dari para pekerja; ini padanan Indonesia yang langsung dan alami.
- source_word: אֹמְרִים לָנוּ עֲשׂוּ
  choice: mereka berkata kepada kami, ‘Buatlah batu bata!’
  rationale: Mempertahankan ujaran langsung dan bentuk perintah; objek 'batu bata' dinyatakan kembali secara alami dari nomina yang mendahuluinya.
- source_word: וְהִנֵּה
  choice: Lihatlah
  rationale: Menyampaikan seruan deiktis dan penekanan dalam permohonan mereka dengan bahasa Indonesia yang bermartabat serta mudah dipahami.
- source_word: מֻכִּים
  choice: dipukuli
  rationale: Partisip pasif menggambarkan perlakuan kekerasan yang sedang atau berulang kali dialami; 'dipukuli' menangkap sifat berulang itu.
- source_word: וְחָטָאת עַמֶּךָ
  choice: padahal rakyatmu sendiri yang bersalah
  rationale: Klausa Ibrani ini ringkas dan sulit secara sintaksis. Dalam konteks, para mandor menyatakan bahwa kesalahan terletak pada pihak Firaun, bukan pada para pekerja; 'sendiri' menonjolkan kontras tersebut tanpa menghapus alternatif harfiahnya, yang dicatat dalam catatan kaki.
theological_decisions:
- issue: Subjek dan makna klausa וְחָטָאת עַמֶּךָ
  choice: padahal rakyatmu sendiri yang bersalah
  alternative: dan rakyatmu telah berdosa
  rationale: Konteks pengaduan mendukung arti bahwa pihak Firaunlah yang bersalah, tetapi bentuk Ibraninya dapat dipahami lebih harfiah sebagai pernyataan bahwa rakyatnya telah berdosa. Ambiguitas ini dipertahankan melalui catatan kaki, bukan diselesaikan secara dogmatis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pengaduan hormat kepada penguasa. Bentuk 'hamba-hambamu' mempertahankan kesantunan istana dan ketundukan sosial; 'Lihatlah' menjaga daya seru הִנֵּה tanpa memakai bentuk arkais.
