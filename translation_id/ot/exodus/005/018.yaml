  text: So now[a], go, work; but straw will not be given to you, yet you must deliver the required number of bricks.
translation:
  language: id
  text: Sekarang, pergilah dan bekerjalah! Jerami tidak akan diberikan kepada kalian, tetapi kalian harus memenuhi jumlah batu bata yang ditetapkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jatah batu bata.” Kata Ibrani תֹכֶן mengacu pada jumlah atau ukuran tetap yang diwajibkan dari para pekerja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Jadi sekarang
  rationale: Mengungkapkan peralihan sekaligus penegasan yang mengantar perintah penutup Firaun dengan wajar dalam bahasa Indonesia.
- source_word: לְכוּ
  choice: pergilah
  rationale: Padanan langsung untuk bentuk imperatif הלך dan mempertahankan ketegasan perintah.
- source_word: עִבְדוּ
  choice: bekerjalah
  rationale: Dalam konteks ini yang diperintahkan ialah kerja paksa, bukan pelayanan ibadah; karena itu 'bekerjalah' paling jelas dan alami.
- source_word: וְתֶבֶן
  choice: Jerami
  rationale: תֶבֶן menunjuk jerami yang dipakai dalam pembuatan batu bata. Kontras kontekstual dengan perintah bekerja dinyatakan melalui 'tetapi' sebelum klausa kewajiban terakhir.
- source_word: יִנָּתֵן לָכֶם
  choice: tidak akan diberikan kepada kalian
  rationale: Mempertahankan bentuk pasif, negasi, dan penerima jamak dari teks Ibrani secara jelas.
- source_word: תֹכֶן
  choice: jumlah ... yang ditetapkan
  rationale: Menunjuk jumlah atau ukuran tetap yang diwajibkan dari para pekerja. Ungkapan ini alami dalam bahasa Indonesia dan tidak menghilangkan gagasan tentang ketetapan.
- source_word: לְבֵנִים
  choice: batu bata
  rationale: Melengkapi hubungan konstruksi dengan תֹכֶן sebagai barang yang jumlahnya ditetapkan.
- source_word: תִּתֵּנוּ
  choice: kalian harus menyerahkan
  rationale: Secara harfiah berarti 'kalian akan memberikan', tetapi dalam konteks perintah menyatakan kewajiban memenuhi hasil produksi; 'harus menyerahkan' mempertahankan daya wajib dan arah penyerahannya.
