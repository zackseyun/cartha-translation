  text: Pharaoh said[a], “Look, the people of the land are now many, and you are making them rest from their burdens.”
translation:
  language: id
  text: Firaun berkata, “Lihatlah, rakyat negeri ini sekarang banyak, dan kalian membuat mereka berhenti dari beban kerja mereka.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kalian telah membuat mereka berhenti dari pekerjaan mereka,” atau, “kalian menyebabkan mereka beristirahat dari beban mereka.” Kata kerja Ibrani ini berbentuk kausatif (“membuat berhenti”) dan dapat diterjemahkan dengan beberapa cara yang dekat, bergantung pada seberapa jelas konteks kerja dinyatakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: Lihat
  rationale: Mempertahankan daya penunjuk dan penegasan seruan Ibrani dalam bahasa Indonesia modern.
- source_word: רַבִּים
  choice: sudah banyak
  rationale: Menyampaikan keadaan jumlah yang besar pada saat itu; 'sudah' secara alami berpadu dengan עַתָּה ('sekarang').
- source_word: עַם הָאָרֶץ
  choice: rakyat negeri ini
  rationale: Mencerminkan ungkapan harfiah 'rakyat negeri itu' secara alami, dengan 'ini' merujuk kepada negeri tempat Firaun berbicara tanpa mempersempitnya menjadi golongan sosial tertentu.
- source_word: עַתָּה
  choice: sekarang
  rationale: Padanan temporal langsung dan wajar dalam bahasa Indonesia.
- source_word: וְהִשְׁבַּתֶּם
  choice: tetapi kalian membuat mereka berhenti
  rationale: Bentuk Hifil bersifat kausatif, yaitu menyebabkan mereka berhenti. 'Tetapi' mengungkapkan hubungan keluhan/pertentangan yang dibawa waw dalam konteks, dan 'kalian' menunjuk kepada Musa serta Harun.
- source_word: מִסִּבְלֹתָם
  choice: dari pekerjaan berat mereka
  rationale: Dalam konteks penindasan di Keluaran, kata ini menunjuk pada beban kerja; padanan ini lebih alami daripada 'beban-beban mereka' dan tidak seinterpretatif 'kerja paksa'.
