translation:
  language: id
  text: Maka rakyat itu berpencar ke seluruh tanah Mesir untuk mengumpulkan sisa-sisa batang tanaman sebagai pengganti jerami.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “untuk mengumpulkan sisa-sisa batang tanaman sebagai jerami.” Kata-kata Ibrani yang diterjemahkan “sisa-sisa batang tanaman” dan “jerami” kadang-kadang dapat memiliki makna yang bertumpang tindih; teks utama mempertahankan perbedaan yang paling mungkin di sini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּפֶץ
  choice: berpencar
  rationale: Bentuk naratif dari פוץ menggambarkan rakyat yang tersebar luas akibat kebijakan Firaun. Dalam bahasa Indonesia, bentuk aktif ber- ini secara alami menyatakan keadaan dan gerak menyebar tanpa harus menentukan pelaku yang tidak disebutkan dalam ayat.
- source_word: הָעָם
  choice: rakyat itu
  rationale: עם menunjuk secara kolektif kepada rakyat, dalam konteks ini para pekerja Israel. 'Rakyat itu' alami, bermartabat, dan mempertahankan rujukan tertentu dari artikel Ibrani.
- source_word: בְּכָל אֶרֶץ מִצְרָיִם
  choice: ke seluruh tanah Mesir
  rationale: Ungkapan ini menyatakan penyebaran melintasi wilayah Mesir secara luas. 'Ke seluruh tanah Mesir' mempertahankan unsur gerak serta cakupan distributif בְּכָל.
- source_word: לְקֹשֵׁשׁ
  choice: untuk mengumpulkan
  rationale: קשש berarti memungut atau mengumpulkan bahan kecil yang berserakan; 'mengumpulkan' jelas dan sesuai dengan konteks.
- source_word: קַשׁ
  choice: tunggul
  rationale: קש dapat menunjuk sisa batang tanaman atau jerami kasar. Karena תבן juga muncul dalam klausa yang sama, 'tunggul' mempertahankan perbedaan leksikal dan menggambarkan bahan pengganti yang harus dikumpulkan.
- source_word: לַתֶּבֶן
  choice: sebagai pengganti jerami
  rationale: ל dapat menyatakan tujuan atau fungsi. Dalam konteks pembuatan batu bata dan penghentian pasokan jerami, frasa ini secara alami menyatakan bahwa tunggul yang dipungut akan digunakan menggantikan jerami.
