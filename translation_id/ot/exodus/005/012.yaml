  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. 'Maka' menandai kelanjutan akibat dalam narasi; 'berpencar' lebih alami daripada konstruksi pasif harfiah, sedangkan 'sebagai pengganti jerami' memperjelas fungsi tanpa menghilangkan catatan mengenai bentuk yang lebih harfiah.
