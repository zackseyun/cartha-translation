base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/022.yaml
  text: Then Moses returned to Yahweh and said[a], “Lord, why have you brought harm on this people? Why then did you send me?”
translation:
  language: id
  text: Lalu Musa kembali menghadap Yahweh dan berkata, “Ya Tuhan, mengapa Engkau mendatangkan celaka kepada bangsa ini? Mengapa pula Engkau mengutus aku?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah dalam bahasa Ibrani: “Mengapa ini Engkau mengutus aku?” Ungkapan tersebut menegaskan pertanyaan Musa: “Mengapa pula Engkau mengutus aku?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: kembali menghadap
  rationale: Kata שׁוּב menyatakan bahwa Musa kembali; tambahan “menghadap” membuat gerak kembali kepada Allah terdengar alami dalam bahasa Indonesia tanpa mengubah maknanya.
- source_word: אֶל יְהוָה
  choice: kepada Yahweh
  rationale: Preposisi אֶל berarti “kepada,” sedangkan nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh.” Dalam kalimat utuh, “kembali menghadap Yahweh” merupakan padanan Indonesia yang alami.
- source_word: אֲדֹנָי
  choice: Ya Tuhan
  rationale: אֲדֹנָי adalah sapaan hormat kepada Allah. Partikel “Ya” menandai sapaan langsung secara alami dan membedakan gelar ini dari nama Yahweh.
- source_word: לָמָה
  choice: mengapa
  rationale: Kedua kemunculan לָמָה mengajukan pertanyaan sebab atau tujuan dan secara langsung dipadankan dengan “mengapa.”
- source_word: הֲרֵעֹתָה
  choice: Engkau mendatangkan celaka
  rationale: Bentuk Hifil dari רעע menyatakan tindakan menyebabkan keburukan, kesusahan, atau celaka. “Mendatangkan celaka” mempertahankan daya kausatifnya tanpa secara tidak perlu menyatakan bahwa Allah melakukan kejahatan moral.
- source_word: לָעָם הַזֶּה
  choice: kepada bangsa ini
  rationale: עָם menunjuk kepada umat Israel sebagai suatu kelompok. “Bangsa ini” alami dalam konteks identitas kolektif mereka, sedangkan ל diterjemahkan sebagai “kepada.”
- source_word: לָמָּה זֶּה
  choice: Mengapa pula
  rationale: Unsur זֶה memberi penekanan pada pertanyaan לָמָה. “Mengapa pula” menyampaikan tekanan retoris itu dengan bahasa Indonesia yang wajar; bentuk harfiahnya dijelaskan dalam catatan kaki.
- source_word: שְׁלַחְתָּנִי
  choice: Engkau mengutus aku
  rationale: Bentuk perfektum orang kedua tunggal dengan akhiran objek orang pertama tunggal berarti “Engkau mengutus aku.” “Mengutus” sesuai dengan penugasan ilahi kepada Musa.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יְהוָה secara langsung. “Yahweh” mempertahankannya sebagai nama diri dan membedakannya dari sapaan אֲדֹנָי, “Tuhan.”
- issue: Nuansa tuduhan Musa dalam הֲרֵעֹתָה
  choice: mendatangkan celaka
  alternative: berbuat jahat
  rationale: Keluhan Musa tetap disampaikan dengan tajam, tetapi bentuk kausatif dalam konteks ini berfokus pada celaka yang menimpa bangsa itu. Pilihan ini mempertahankan ketegangan ucapan Musa tanpa menetapkan bahwa ia sedang menuduh Allah melakukan kejahatan moral.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “Ya Tuhan” serta pronomina “Engkau” menjaga keluwesan dialog doa, sementara “Yahweh” mempertahankan nama ilahi. Struktur pertanyaan dibuat alami tanpa menghilangkan nada keluhan Musa.
