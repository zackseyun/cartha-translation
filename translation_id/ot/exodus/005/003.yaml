language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמְר֔וּ אֱלֹהֵ֥י הָ/עִבְרִ֖ים נִקְרָ֣א עָלֵ֑י/נוּ נֵ֣לֲכָה נָּ֡א דֶּרֶךְ֩ שְׁלֹ֨שֶׁת יָמִ֜ים בַּ/מִּדְבָּ֗ר וְ/נִזְבְּחָה֙ לַֽ/יהוָ֣ה אֱלֹהֵ֔י/נוּ פֶּ֨ן יִפְגָּעֵ֔/נוּ בַּ/דֶּ֖בֶר א֥וֹ בֶ/חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/003.yaml
  text: And they said[a], “The God of the Hebrews has met with us. Please let us go a journey of three days into the wilderness, so that we may sacrifice to Yahweh our God, lest he strike us with plague or with the sword.”
translation:
  language: id
  text: Lalu mereka berkata, “Allah orang Ibrani telah berjumpa dengan kami.[a] Izinkanlah kami pergi dalam perjalanan tiga hari ke padang belantara untuk mempersembahkan kurban kepada Yahweh, Allah kami, agar Ia tidak menghantam kami dengan wabah atau pedang.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “telah memanggil kami.” Ungkapan Ibrani ini dapat berarti bahwa Allah telah berjumpa dengan mereka atau telah memanggil mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהֵי הָעִבְרִים
  choice: Allah orang Ibrani
  rationale: Mempertahankan sebutan etnis עִבְרִים yang dipakai dalam narasi, tanpa menghaluskannya menjadi 'orang Israel'.
- source_word: נִקְרָא עָלֵינוּ
  choice: telah menemui kami
  rationale: Bentuk Niphal קרא dengan עַל di sini dapat menyatakan perjumpaan ilahi; terjemahan ini alami dalam bahasa Indonesia dan tetap menyisakan alternatif makna 'memanggil', yang dicatat dalam catatan kaki.
- source_word: נֵלֲכָה נָּא
  choice: Izinkanlah kami pergi
  rationale: Menyampaikan daya kohortatif sebagai permohonan sopan kepada Firaun; נָא tercermin dalam bentuk permohonan 'izinkanlah'.
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: sejauh tiga hari perjalanan
  rationale: Mengungkapkan idiom Ibrani tentang jarak yang ditempuh dalam perjalanan selama tiga hari, bukan semata-mata durasi tinggal.
- source_word: בַּמִּדְבָּר
  choice: ke padang belantara
  rationale: מִדְבָּר menunjuk kawasan liar atau tidak dihuni dan tidak selalu gurun pasir; 'padang belantara' jelas dan wajar dalam bahasa Indonesia.
- source_word: וְנִזְבְּחָה
  choice: untuk mempersembahkan kurban
  rationale: Kohortatif kedua dalam rangkaian ini paling alami dipahami sebagai tujuan perjalanan; 'mempersembahkan kurban' menyatakan tindakan kultis dengan jelas.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Mentransliterasikan nama perjanjian יהוה sebagai 'Yahweh', bukan menggantinya dengan gelar.
- source_word: פֶּן
  choice: Jika tidak
  rationale: Menyampaikan nuansa peringatan atau akibat yang dikhawatirkan dari פֶּן dalam bahasa Indonesia modern secara alami.
- source_word: יִפְגָּעֵנוּ
  choice: Ia mungkin menghantam kami
  rationale: Dalam konteks hukuman berupa wabah atau pedang, פגע menyatakan tindakan keras yang menimpa mereka. 'Menghantam' mempertahankan kekuatan ungkapannya, sedangkan 'mungkin' mencerminkan akibat yang dikhawatirkan setelah פֶּן tanpa menyatakan kepastian.
- source_word: בַּדֶּבֶר א֥וֹ בֶחָרֶב
  choice: dengan wabah atau pedang
  rationale: Mempertahankan kesejajaran kedua sarana penghukuman; 'wabah' merupakan padanan modern yang jelas bagi דֶּבֶר.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan fungsi nama perjanjian dan mengikuti kebijakan POB yang diberikan, tanpa menggantinya dengan gelar.
- issue: Subjek tersirat pada יִפְגָּעֵנוּ
  choice: Ia, yaitu Yahweh, sebagai pihak yang mungkin menghantam
  alternative: Ungkapan tanpa subjek eksplisit, misalnya 'agar kami tidak dihantam'
  rationale: Kata kerja Ibrani berbentuk orang ketiga maskulin tunggal, dan anteseden terdekatnya adalah Yahweh, Allah kami. Terjemahan mempertahankan ketegangan bahwa umat harus menaati tuntutan ibadah agar tidak terkena hukuman ilahi.
- issue: Hubungan וְנִזְבְּחָה dengan permohonan pergi
  choice: 'tujuan: ''untuk mempersembahkan kurban'''
  alternative: 'koordinasi: ''dan kami akan mempersembahkan kurban'''
  rationale: Urutan kohortatif memungkinkan koordinasi formal, tetapi dalam konteks permohonan perjalanan, tindakan mempersembahkan kurban menjelaskan tujuannya. Padanan tujuan menghasilkan bahasa Indonesia yang alami tanpa mengubah isi.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. 'Allah orang Ibrani' mempertahankan istilah naratif sumber; 'padang belantara' menghindari kesan bahwa מִדְבָּר harus berupa gurun pasir; 'kurban' mengikuti ejaan baku modern. Penanda catatan kaki ditempatkan tepat setelah klausa yang diterangkannya.
