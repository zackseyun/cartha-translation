  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מֵ/אָ֞ז בָּ֤אתִי אֶל פַּרְעֹה֙ לְ/דַבֵּ֣ר בִּ/שְׁמֶ֔/ךָ הֵרַ֖ע לָ/עָ֣ם הַ/זֶּ֑ה וְ/הַצֵּ֥ל לֹא הִצַּ֖לְתָּ אֶת עַמֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/023.yaml
  text: For since I came to Pharaoh to speak in your name[a], he has done evil to this people[c][b], and you have certainly not delivered your people.
translation:
  language: id
  text: Sejak aku datang kepada Firaun untuk berbicara atas nama-Mu, ia telah berbuat jahat terhadap bangsa ini,[a] dan Engkau sama sekali belum membebaskan umat-Mu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ia telah memperburuk keadaan bangsa ini.”'
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani menggabungkan bentuk infinitif absolut dengan verba dari akar yang sama—secara harfiah, “membebaskan, Engkau tidak membebaskan”—untuk menegaskan pernyataan negatif itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵאָז
  choice: Sejak
  rationale: מֵאָז menyatakan waktu yang bermula pada suatu titik di masa lalu, ‘sejak saat itu’. Dalam bahasa Indonesia, ‘sejak’ secara alami menghubungkan kedatangan Musa dengan keadaan yang terus berlangsung sesudahnya; waw penghubung tidak perlu diterjemahkan tersendiri pada awal kalimat.
- source_word: בָּאתִי אֶל־פַּרְעֹה
  choice: aku datang kepada Firaun
  rationale: Terjemahan langsung ini mempertahankan verba בוא dan arah yang ditandai אֶל, tanpa menambahkan gagasan khusus yang tidak dinyatakan.
- source_word: לְדַבֵּר בִּשְׁמֶךָ
  choice: untuk berbicara atas nama-Mu
  rationale: Infinitif menyatakan tujuan. Ungkapan Indonesia ‘atas nama-Mu’ secara wajar menyampaikan tindakan sebagai wakil yang membawa nama dan wewenang Allah.
- source_word: הֵרַע לָעָם הַזֶּה
  choice: ia telah berbuat jahat terhadap bangsa ini
  rationale: Bentuk hifil רעע dapat menyatakan berbuat jahat, mendatangkan celaka, atau memperburuk keadaan. Pilihan ini mempertahankan bobot moral ungkapan Ibrani sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: וְהַצֵּל לֹא הִצַּלְתָּ
  choice: dan Engkau sama sekali belum membebaskan
  rationale: Infinitif absolut yang diikuti verba finit dari akar yang sama menegaskan penyangkalan. ‘Sama sekali belum’ menyampaikan penekanan itu serta menunjukkan bahwa sampai saat Musa berbicara pembebasan yang diharapkan belum terjadi.
- source_word: אֶת־עַמֶּךָ
  choice: umat-Mu
  rationale: Dalam konteks relasi Israel dengan Allah, ‘umat-Mu’ merupakan padanan alami bagi עַמֶּךָ dan mempertahankan penanda kepunyaan orang kedua tunggal.
theological_decisions:
- issue: Bobot moral dan akibat praktis dari הֵרַע
  choice: ia telah berbuat jahat terhadap bangsa ini
  alternative: ia telah memperburuk keadaan bangsa ini
  rationale: Pilihan utama mempertahankan kemungkinan tuduhan moral dalam akar רעע, sedangkan catatan kaki mencatat kemungkinan bahwa bentuk kausatif itu terutama menunjuk pada keadaan bangsa yang menjadi lebih buruk.
- issue: Penegasan dalam keluhan Musa bahwa Allah belum membebaskan umat-Nya
  choice: Engkau sama sekali belum membebaskan umat-Mu
  alternative: Engkau benar-benar tidak membebaskan umat-Mu
  rationale: Konstruksi infinitif absolut menuntut penegasan. ‘Sama sekali belum’ mempertahankan keberanian keluhan Musa, tetapi tidak mengubahnya menjadi pernyataan bahwa Allah tidak akan pernah membebaskan mereka.
- issue: Makna perwakilan dalam בִּשְׁמֶךָ
  choice: atas nama-Mu
  alternative: dengan membawa nama-Mu
  rationale: ‘Atas nama-Mu’ alami dalam bahasa Indonesia dan tetap memuat gagasan bahwa Musa berbicara sebagai wakil Allah dengan wewenang-Nya, tanpa menjabarkan implikasi teologis secara berlebihan.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Sapaan kepada Allah memakai huruf kapital pada unsur pronominal (“-Mu”, “Engkau”). ‘Bangsa ini’ dipakai untuk הָעָם הַזֶּה dalam keluhan tentang Israel, sedangkan ‘umat-Mu’ dipakai ketika kepunyaan dan relasi dengan Allah dinyatakan secara langsung. Struktur kalimat mempertahankan perkembangan keluhan Musa: sejak ia menghadap Firaun, penderitaan bertambah dan pembebasan belum terjadi.'
