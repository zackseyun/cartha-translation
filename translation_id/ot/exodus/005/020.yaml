  text: They met Moses and Aaron[a], who were standing to meet them when they came out from Pharaoh.
translation:
  language: id
  text: Mereka bertemu dengan Musa dan Harun[a], yang sedang berdiri untuk menemui mereka ketika mereka keluar dari hadapan Firaun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mereka menjumpai Musa dan Harun.” Dalam konteks tertentu, kata kerjanya juga dapat berarti “menghadapi,” dengan kemungkinan nuansa permusuhan, tetapi teks utama mempertahankan arti yang lebih umum, “bertemu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְגְּעוּ
  choice: Mereka bertemu dengan
  rationale: Kata kerja פגע dapat berarti bertemu atau berpapasan, dan dalam konteks tertentu dapat bernuansa menghadapi secara bermusuhan. Terjemahan ini mempertahankan arti luasnya tanpa memasukkan sikap bermusuhan yang baru tampak jelas dalam ayat berikutnya.
- source_word: אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: Musa dan Harun
  rationale: Penanda objek langsung tidak perlu diterjemahkan; nama-nama tersebut memakai bentuk baku dalam bahasa Indonesia.
- source_word: נִצָּבִים
  choice: yang sedang berdiri
  rationale: Partisipel dari נצב menggambarkan Musa dan Harun dalam keadaan berdiri atau mengambil posisi di tempat itu; 'sedang berdiri' mempertahankan aspek duratifnya secara alami.
- source_word: לִקְרָאתָם
  choice: menantikan mereka
  rationale: Ungkapan לקראת menunjuk pada posisi atau gerak untuk menemui seseorang. Dalam bahasa Indonesia, 'menantikan mereka' secara alami menggambarkan Musa dan Harun yang berdiri di sana untuk menemui para mandor, tanpa menambahkan nuansa konfrontatif.
- source_word: בְּצֵאתָם
  choice: ketika mereka keluar
  rationale: Infinitif konstruksi dengan prefiks ב menyatakan keadaan waktu; bentuk ini jelas dan alami dalam bahasa Indonesia.
- source_word: מֵאֵת פַּרְעֹה
  choice: dari hadapan Firaun
  rationale: מֵאֵת menyatakan gerak menjauh dari seseorang atau dari hadapannya. 'Dari hadapan Firaun' mempertahankan nuansa bahwa mereka baru keluar setelah menghadap Firaun.
