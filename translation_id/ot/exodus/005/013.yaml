  text: And the taskmasters kept pressing them[a], saying, “Finish your work, each day’s matter in its day, just as when there was straw.”
translation:
  language: id
  text: Para mandor kerja paksa terus mendesak mereka dengan berkata, “Selesaikan jatah pekerjaan harian kalian setiap hari, seperti ketika jerami masih tersedia.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנֹּגְשִׂים
  choice: para pengawas kerja paksa
  rationale: Dalam konteks kerja paksa di Mesir, istilah ini menunjuk kepada orang-orang yang memaksa para pekerja memenuhi tuntutan kerja. Pilihan ini lebih jelas dan lebih kuat daripada sekadar “para pengawas” atau “para mandor”.
- source_word: אָצִים
  choice: terus mendesak
  rationale: Bentuk partisip menyatakan tekanan yang sedang berlangsung, sedangkan konteksnya menunjukkan desakan yang bersifat memaksa.
- source_word: כַּלּוּ
  choice: Selesaikan
  rationale: Kata perintah ini menuntut agar pekerjaan yang diwajibkan dituntaskan; “selesaikan” lugas dan wajar dalam bahasa Indonesia modern.
- source_word: מַעֲשֵׂיכֶם
  choice: pekerjaan kalian
  rationale: Dalam konteks ini kata tersebut mengacu pada pekerjaan pembuatan batu bata yang diwajibkan kepada bangsa Israel. “Pekerjaan” tetap cukup luas untuk mencerminkan istilah Ibrani.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: jatah setiap hari pada hari itu juga
  rationale: Ungkapan Ibrani secara harfiah berbicara tentang “perkara suatu hari pada harinya” dan dalam konteks ini menunjuk kepada jumlah pekerjaan yang harus dipenuhi setiap hari. “Jatah” menyampaikan maksud kontekstualnya secara alami.
- source_word: כַּאֲשֶׁר
  choice: sama seperti
  rationale: Frasa ini memperkenalkan perbandingan dengan keadaan sebelumnya dan menegaskan bahwa tuntutan hasil kerja tidak berubah.
- source_word: בִּהְיוֹת הַתֶּבֶן
  choice: ketika jerami masih tersedia
  rationale: Konstruksi infinitif ini menunjuk kepada keadaan sebelumnya ketika jerami ada atau tersedia. Konteks yang lebih luas menyiratkan bahwa jerami dahulu disediakan, tetapi ayat ini sendiri hanya menyatakan keberadaannya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku yang modern dan bermartabat. “Kalian” mempertahankan sapaan orang kedua jamak dalam bahasa Ibrani, sedangkan “pengawas kerja paksa” memperjelas peran koersif para נֹגְשִׂים. Tanda pisah menampilkan “jatah setiap hari pada hari itu juga” sebagai penjelasan atas “pekerjaan kalian” tanpa menghilangkan daya perintah kalimat.
