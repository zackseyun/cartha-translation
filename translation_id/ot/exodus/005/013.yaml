  source_fidelity: 'Makna pokok sudah tepat: para נֹגְשִׂים terus menekan orang Israel agar memenuhi tuntutan kerja yang sama seperti ketika jerami tersedia. Namun, tanda pisah membuat frasa tentang jatah harian terasa sebagai sisipan penjelas, padahal dalam teks Ibrani frasa itu merupakan isi langsung dari perintah. Frasa “pada hari itu juga” juga memberi penekanan tambahan yang tidak perlu.'
