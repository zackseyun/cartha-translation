revisions:
- from: Para pengawas kerja paksa terus mendesak mereka, katanya, “Selesaikan pekerjaan kalian—jatah setiap hari pada hari itu juga[a]—sama seperti ketika jerami masih tersedia.”
  to: Para mandor kerja paksa terus mendesak mereka dengan berkata, “Selesaikan jatah pekerjaan harian kalian setiap hari, seperti ketika jerami masih tersedia.”
  rationale: Revisi menata ulang perintah agar idiom Ibrani tentang tuntutan setiap hari berfungsi sebagai isi perintah, bukan sebagai sisipan. “Mandor kerja paksa” adalah padanan Indonesia yang lebih alami bagi para pejabat yang memaksa pemenuhan kerja, sedangkan “ketika jerami masih tersedia” mempertahankan perbandingan dengan keadaan sebelumnya tanpa menyatakan secara eksplisit siapa yang menyediakannya.
