  terminology: “Pengawas kerja paksa” dapat dipahami, tetapi “mandor kerja paksa” lebih idiomatis untuk pejabat yang secara koersif menagih hasil kerja. “Jatah pekerjaan harian” menyampaikan idiom דְּבַר־יוֹם בְּיוֹמוֹ secara jelas; catatan kaki mempertahankan ungkapan harfiahnya dan menjelaskan bahwa ini menunjuk pada tuntutan harian.
