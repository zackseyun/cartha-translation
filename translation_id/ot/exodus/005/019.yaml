  yaml_path: translation/ot/exodus/005/019.yaml
  text: Then the officers of the sons of Israel saw that they were in trouble when it was said[a], “You must not reduce the number of your bricks[b], the daily quota each day.”
translation:
  language: id
  text: Para mandor Israel[a] menyadari bahwa mereka berada dalam kesulitan ketika diberi tahu, “Kalian tidak boleh mengurangi jumlah batu bata kalian, yaitu jumlah yang ditetapkan untuk setiap hari.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Israel.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “perkara satu hari pada harinya,” yaitu jumlah yang diwajibkan untuk setiap hari.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: menyadari
  rationale: 'Makna dasarnya adalah ‘melihat’, tetapi dalam konteks ini penglihatan itu bersifat kognitif: para mandor memahami keadaan buruk yang mereka hadapi. ‘Menyadari’ merupakan ungkapan Indonesia yang alami.'
- source_word: שֹׁטְרֵי
  choice: para mandor
  rationale: Dalam narasi ini mereka adalah pengawas bawahan dari kalangan Israel yang mengatur para pekerja di bawah kekuasaan Mesir. ‘Mandor’ menyampaikan fungsi tersebut lebih jelas daripada istilah umum ‘pejabat’.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan ini secara harfiah berarti ‘anak-anak Israel’, tetapi lazim menunjuk kepada bangsa Israel. ‘Orang Israel’ alami dalam bahasa Indonesia dan tidak membatasi rujukannya hanya kepada laki-laki.
- source_word: אֹתָם בְּרָע
  choice: mereka berada dalam kesulitan
  rationale: Kata ganti itu merujuk kembali kepada para mandor, sedangkan בְּרָע menunjukkan keadaan buruk atau merugikan, bukan kejahatan moral.
- source_word: לֵאמֹר
  choice: ketika diberi tahu
  rationale: Bentuk ini memperkenalkan perkataan yang membuat para mandor memahami kesulitan mereka. Ungkapan pasif-temporal ini alami dalam bahasa Indonesia dan mempertahankan hubungannya dengan kutipan berikut.
- source_word: לֹא תִגְרְעוּ
  choice: Kalian tidak boleh mengurangi
  rationale: גרע berarti mengurangi atau menyusutkan. ‘Tidak boleh’ menyampaikan daya larangan dengan jelas dalam bahasa Indonesia modern.
- source_word: מִלִּבְנֵיכֶם
  choice: jumlah batu bata kalian
  rationale: Secara harfiah berbunyi ‘dari batu bata kalian’; dalam konteks larangan mengurangi hasil produksi, bahasa Indonesia memerlukan ‘jumlah’ agar maksud kuantitatifnya jelas.
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: jatah yang harus dibuat setiap hari
  rationale: Idiom Ibrani ‘perkara satu hari pada harinya’ menunjuk kepada jumlah produksi yang ditetapkan untuk setiap hari. ‘Jatah’ mempertahankan gagasan kewajiban harian tanpa ungkapan yang kaku.
