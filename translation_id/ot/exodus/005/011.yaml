  register: Bahasa Indonesia baku modern dengan bentuk jamak “kalian” yang jelas, perintah berakhiran -lah, dan susunan yang tetap dekat dengan bahasa Ibrani tanpa terasa kaku. Penekanan אַתֶּם dipertahankan melalui “Kalian sendiri”; hubungan kausal כִּי diterjemahkan “karena”.
