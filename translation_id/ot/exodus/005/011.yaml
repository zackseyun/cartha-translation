  yaml_path: translation/ot/exodus/005/011.yaml
  text: You yourselves[a], go and get straw for yourselves wherever you can find it[b], for nothing of your work will be reduced.
translation:
  language: id
  text: Kalian sendiri, pergilah dan ambillah jerami untuk diri kalian dari mana pun kalian dapat menemukannya, karena pekerjaan kalian tidak akan dikurangi sedikit pun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “karena tidak ada satu hal pun yang dikurangi dari pekerjaan kalian.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַתֶּם
  choice: Kalian sendiri
  rationale: Pronomina mandiri ini memberi penekanan sebelum dua bentuk perintah; “kalian sendiri” mempertahankan penekanan bahwa merekalah yang harus bertindak.
- source_word: לְכוּ
  choice: pergilah
  rationale: Bentuk imperatif jamak dari הלך diterjemahkan dengan perintah alami dan bermartabat dalam bahasa Indonesia.
- source_word: קְחוּ
  choice: ambillah
  rationale: Makna dasarnya “ambil”; dalam konteks ini mencakup tindakan memperoleh jerami yang mereka temukan.
- source_word: לָכֶם
  choice: bagi kalian
  rationale: 'Menjaga fungsi datif/refleksif: mereka harus memperoleh jerami untuk keperluan mereka sendiri, tanpa memasukkan gagasan tambahan.'
- source_word: תֶּבֶן
  choice: jerami
  rationale: Dalam konteks pembuatan batu bata, kata ini menunjuk pada jerami yang dipakai sebagai bahan.
- source_word: מֵאֲשֶׁר תִּמְצָאוּ
  choice: dari mana pun kalian dapat menemukannya
  rationale: Terjemahan ini mempertahankan unsur “dari” dan cakupan sumber yang tidak dibatasi, sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: כִּי
  choice: karena
  rationale: Konjungsi ini paling langsung menyatakan alasan bagi perintah sebelumnya; hubungan kausal dipertahankan tanpa menggantinya dengan hubungan adversatif.
- source_word: אֵין נִגְרָע
  choice: tidak akan dikurangi
  rationale: Konstruksi negatif dengan bentuk pasif menyatakan bahwa pengurangan tidak akan dilakukan; bentuk futur sesuai dengan ketetapan yang sedang diberlakukan.
- source_word: מֵעֲבֹדַתְכֶם
  choice: pekerjaan kalian
  rationale: עֲבֹדָה di sini adalah pekerjaan atau beban kerja yang diwajibkan kepada bangsa Israel.
- source_word: דָּבָר
  choice: sedikit pun
  rationale: 'Dalam konstruksi negatif ini, דָּבָר menguatkan penyangkalan: tidak ada bagian apa pun yang akan dikurangi. “Sedikit pun” menyampaikan idiom tersebut secara alami.'
