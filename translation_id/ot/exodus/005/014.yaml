base_translation:
  language: en
  yaml_path: translation/ot/exodus/005/014.yaml
  text: And the Israelite foremen[a], whom Pharaoh’s taskmasters had set over them, were beaten, saying, “Why have you not finished your quota of brickmaking as before, both yesterday and today?”
translation:
  language: id
  text: Lalu para mandor Israel, yang telah diangkat oleh para pengerah kerja Firaun untuk mengawasi mereka, dipukuli. Para pengerah kerja itu berkata, “Mengapa kalian tidak menyelesaikan jatah pembuatan batu bata seperti sebelumnya[a], baik kemarin maupun hari ini?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seperti kemarin dan sehari sebelumnya,” suatu ungkapan yang berarti “seperti sebelumnya” atau “seperti dahulu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּכּוּ
  choice: dipukuli
  rationale: Bentuk pasif jamak dari נכה menyatakan hukuman fisik; “dipukuli” alami dalam bahasa Indonesia dan tidak menentukan alat atau cara pemukulan.
- source_word: שֹׁטְרֵי בְּנֵי יִשְׂרָאֵל
  choice: para mandor Israel
  rationale: Dalam konteks kerja paksa, שֹׁטְרִים menunjuk para pengawas bawahan dari kalangan Israel; “mandor” menyampaikan peran itu dengan jelas.
- source_word: אֲשֶׁר שָׂמוּ עֲלֵהֶם נֹגְשֵׂי פַרְעֹה
  choice: yang telah diangkat oleh para pengerah kerja Firaun untuk mengawasi mereka
  rationale: נֹגְשִׂים adalah pejabat yang mendesak atau memaksa para pekerja; “pengerah kerja” cocok dengan konteks kerja paksa tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: לֵאמֹר
  choice: Para pengerah kerja itu berkata
  rationale: Infinitif pengutip ini memperkenalkan ucapan. Menjadikan pelaku tersurat dalam kalimat baru menghindari kesan bahwa para mandor yang dipukuli mengucapkan pertanyaan tersebut.
- source_word: מַדּוּעַ
  choice: Mengapa
  rationale: Padanan langsung dan alami untuk kata tanya alasan.
- source_word: לֹא כִלִּיתֶם
  choice: tidak menyelesaikan
  rationale: כלה di sini berarti menuntaskan jumlah pekerjaan yang diwajibkan.
- source_word: חָקְכֶם
  choice: jatah
  rationale: חֹק menunjuk jumlah atau bagian yang telah ditetapkan; “jatah” ringkas dan mudah dipahami dalam konteks target produksi wajib.
- source_word: לִלְבֹּן
  choice: pembuatan batu bata
  rationale: Infinitif לבן merujuk pada kegiatan membuat batu bata dan berhubungan langsung dengan jumlah kerja yang ditetapkan.
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: seperti sebelumnya
  rationale: Ungkapan harfiahnya menunjuk waktu lampau dan berfungsi idiomatis dengan arti “seperti dahulu/sebelumnya”; bentuk alami dipakai dalam teks dan arti harfiah dicatat.
- source_word: גַּם תְּמוֹל גַּם הַיּוֹם
  choice: kemarin dan hari ini
  rationale: Konstruksi גַּם...גַּם mencakup dan menegaskan kedua hari tersebut; susunan Indonesia ini jelas dan alami.
