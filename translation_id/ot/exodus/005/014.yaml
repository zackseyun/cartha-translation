translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. Istilah “mandor” dan “pengerah kerja” membedakan pengawas Israel dari pejabat Firaun, sedangkan pemecahan klausa pengutip memperjelas siapa yang berbicara. Penanda catatan kaki [a] ditempatkan setelah kalimat yang memuat ungkapan terkait.
