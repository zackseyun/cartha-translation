  yaml_path: translation/ot/exodus/005/017.yaml
  text: But he said[a], “You are idle, idle! That is why you say, ‘Let us go and sacrifice to Yahweh.’”
translation:
  language: id
  text: Namun, Firaun berkata, “Kalian malas, benar-benar malas! Itulah sebabnya kalian berkata, ‘Mari kita pergi dan mempersembahkan kurban kepada Yahweh.’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Namun, Firaun berkata
  rationale: Bentuk naratif berarti ‘ia berkata’; nama Firaun dijelaskan dari konteks agar rujukannya alami dalam bahasa Indonesia. ‘Namun’ menyampaikan pertentangan dengan keluhan sebelumnya.
- source_word: נִרְפִּים אַתֶּם נִרְפִּים
  choice: Kalian malas, benar-benar malas!
  rationale: נִרְפִּים menuduh mereka enggan bekerja atau bermalas-malasan. Pengulangan Ibrani bersifat intensif; ‘benar-benar’ mempertahankan tekanannya dengan ungkapan Indonesia yang alami.
- source_word: עַל כֵּן
  choice: Itulah sebabnya
  rationale: Frasa ini menyatakan hubungan sebab-akibat menurut tuduhan Firaun.
- source_word: אֹמְרִים
  choice: kalian berkata
  rationale: Partisip Ibrani berfungsi sebagai verba kini dalam ucapan langsung; ‘kalian’ menandai bentuk orang kedua jamak.
- source_word: נֵלְכָה נִזְבְּחָה
  choice: Biarkanlah kami pergi dan mempersembahkan kurban
  rationale: Kedua bentuk kohortatif menyatakan ajakan atau permohonan bersama. ‘Biarkanlah kami pergi’ sesuai dengan konteks permintaan kepada Firaun, sedangkan ‘mempersembahkan kurban’ menyampaikan tindakan ritual זבח dengan jelas.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menandai penerima persembahan, dan nama perjanjian יהוה ditransliterasikan sebagai ‘Yahweh’.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama diri ilahi dan mengikuti keputusan proyek tanpa memasukkan penafsiran denominasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. ‘Kalian’ memperjelas sapaan jamak; ‘kurban’ memakai ejaan baku KBBI. Repetisi harfiah ‘malas, malas’ dialihkan menjadi ‘malas, benar-benar malas’ agar tekanan retoris terdengar alami.
