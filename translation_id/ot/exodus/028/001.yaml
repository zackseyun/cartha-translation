  text: וְ/אַתָּ֡ה הַקְרֵ֣ב אֵלֶי/ךָ֩ אֶת אַהֲרֹ֨ן אָחִ֜י/ךָ וְ/אֶת בָּנָ֣י/ו אִתּ֔/וֹ מִ/תּ֛וֹךְ בְּנֵ֥י יִשְׂרָאֵ֖ל לְ/כַהֲנ/וֹ לִ֑/י אַהֲרֹ֕ן נָדָ֧ב וַ/אֲבִיה֛וּא אֶלְעָזָ֥ר וְ/אִיתָמָ֖ר בְּנֵ֥י אַהֲרֹֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/001.yaml
  text: 'And you[a], bring near to yourself Aaron your brother, and his sons with him, from among the sons of Israel, to serve as priests for me: Aaron, Nadab and Abihu, Eleazar and Ithamar, Aaron’s sons.'
translation:
  language: id
  text: 'Adapun engkau, bawalah mendekat kepadamu Harun, saudaramu, dan anak-anaknya beserta dia, dari antara bani Israel[a], untuk melayani Aku sebagai imam: Harun, Nadab dan Abihu, Eleazar dan Itamar, anak-anak Harun.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang Israel.” Secara harfiah, bahasa Ibrani berbunyi “anak-anak Israel,” suatu sebutan baku bagi umat perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Adapun engkau
  rationale: Pronomina yang dinyatakan secara eksplisit memberi penekanan dan menandai peralihan langsung kepada Musa; “Adapun engkau” menyampaikan keduanya secara wajar dalam bahasa Indonesia.
- source_word: הַקְרֵב אֵלֶיךָ
  choice: bawalah mendekat kepadamu
  rationale: Mempertahankan gambaran konkret verba kausatif “membawa mendekat” serta arah tindakan kepada Musa, tanpa menafsirkannya terlalu jauh sebagai penahbisan.
- source_word: אַהֲרֹן אָחִיךָ
  choice: Harun, saudaramu
  rationale: Menyatakan hubungan keluarga yang disebutkan secara eksplisit dalam teks Ibrani.
- source_word: וְאֶת־בָּנָיו אִתּוֹ
  choice: dan anak-anaknya bersama dia
  rationale: Unsur penyertaan אִתּוֹ dipertahankan untuk menunjukkan bahwa anak-anak Harun dibawa bersama Harun.
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: dari antara bani Israel
  rationale: “Bani Israel” merupakan ungkapan baku dan bermartabat dalam bahasa Indonesia yang mempertahankan bentuk genealogis sekaligus fungsi kolektif sebutan perjanjian ini.
- source_word: לְכַהֲנוֹ לִי
  choice: untuk melayani Aku sebagai imam
  rationale: Menyampaikan fungsi pelayanan keimaman dan relasinya kepada Allah. Susunan tanpa pronomina subjek tambahan juga mempertahankan ketegangan gramatikal antara bentuk tunggal Ibrani dan daftar Harun beserta anak-anaknya.
- source_word: בְּנֵי אַהֲרֹן
  choice: anak-anak Harun
  rationale: Bentuk konstruksi genealogis diterjemahkan langsung dan alami.
theological_decisions:
- issue: Cakupan לְכַהֲנוֹ לִי dan bentuk tunggalnya
  choice: untuk melayani Aku sebagai imam
  alternative: supaya dia melayani Aku sebagai imam
  rationale: Bentuk Ibrani memiliki unsur tunggal yang dapat menunjuk kepada Harun, tetapi konteks langsung menyebut Harun dan keempat anaknya dalam penetapan pelayanan imam. Bahasa Indonesia tanpa subjek eksplisit mempertahankan kemungkinan rujukan tersebut dan tidak memaksakan penyelesaian teologis atau sintaktis.
- issue: Sebutan kolektif בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: orang Israel
  rationale: Pilihan utama mempertahankan nuansa keturunan dan sebutan umat perjanjian dalam bahasa Ibrani, sedangkan padanan kolektif yang lebih eksplisit dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan “bawalah mendekat kepadamu” sengaja agak formal untuk mempertahankan citra kultis teks sumber; nama אִיתָמָר ditulis “Itamar” menurut bentuk yang lazim dalam bahasa Indonesia.
