  text: וּ/מִלֵּאתָ֥ ב/וֹ֙ מִלֻּ֣אַת אֶ֔בֶן אַרְבָּעָ֖ה טוּרִ֣ים אָ֑בֶן ט֗וּר אֹ֤דֶם פִּטְדָה֙ וּ/בָרֶ֔קֶת הַ/טּ֖וּר הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/017.yaml
  text: 'And you shall set in it settings of stones[a], four rows of stones: the first row shall be a ruby, a topaz, and an emerald.'
translation:
  language: id
  text: Haruslah engkau memasang padanya tatahan batu permata[a], empat deret batu permata. Deret pertama terdiri atas batu mirah, batu topas, dan batu zamrud.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jenis-jenis batu permata ini tidak dapat diidentifikasi dengan pasti. “Batu mirah” mungkin juga batu akik merah; “batu topas” mungkin juga krisolit atau peridot; dan “batu zamrud” mungkin juga beril.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִלֵּאתָ בּוֹ מִלֻּאַת אֶבֶן
  choice: Haruslah engkau memasang padanya tatahan batu permata
  rationale: Kata kerja מלא secara harfiah berarti 'memenuhi', tetapi dalam konteks pembuatan tutup dada menunjuk pada pemasangan batu ke dalam tatahan. 'Memasang ... tatahan batu permata' menyampaikan tindakan pertukangan itu secara alami dalam bahasa Indonesia.
- source_word: אַרְבָּעָה טוּרִים אָבֶן
  choice: empat deret batu permata
  rationale: טוּר berarti deret atau barisan yang tersusun; אֶבֶן berbentuk tunggal tetapi berfungsi kolektif dalam konteks beberapa permata.
- source_word: טוּר ... הָאֶחָד
  choice: deret pertama
  rationale: Ungkapan ini menandai deret pertama dalam urutan empat deret.
- source_word: אֹדֶם
  choice: batu mirah
  rationale: Jenis mineralnya tidak pasti. 'Batu mirah' merupakan padanan tradisional yang wajar untuk batu merah ini, sementara kemungkinan 'batu akik merah' dicatat dalam catatan kaki.
- source_word: פִּטְדָה
  choice: batu topas
  rationale: Identifikasi tepatnya tidak pasti; 'topas' mempertahankan padanan tradisional yang dikenal, dengan kemungkinan lain dicatat dalam catatan kaki.
- source_word: בָרֶקֶת
  choice: batu zamrud
  rationale: Istilah ini berkaitan dengan kilau atau cahaya yang memancar, tetapi jenis batunya tidak pasti. 'Zamrud' adalah padanan tradisional yang mudah dikenali; kemungkinan 'beril' dicatat dalam catatan kaki.
