translation:
  language: id
  text: Buatlah dua rantai dari emas murni, yang dipilin seperti tali[a]; lalu pasanglah rantai-rantai yang dipilin itu pada bingkai-bingkai[b] tersebut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani memakai dua ungkapan yang berkaitan dengan pengerjaan yang dipilin atau berbentuk tali. Terjemahan lain: “Buatlah dua rantai dari emas murni, berupa pilinan, hasil pekerjaan tali-temali.”'
    reason: lexical_alternative
  - marker: b
    text: “Bingkai-bingkai” juga dapat diterjemahkan “dudukan-dudukan” atau “bingkai-bingkai kerawang”, yaitu bagian emas yang dipasang pada pakaian imam.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי שַׁרְשְׁרֹת
  choice: dua rantai
  rationale: Ungkapan ini menunjuk pada dua rantai sebagai bagian dari perlengkapan pakaian imam; “rantai” paling sesuai dengan bahan emas dan konteks perhiasan.
- source_word: זָהָב טָהוֹר
  choice: emas murni
  rationale: Padanan baku dan alami untuk bahan berkualitas tinggi yang digunakan dalam perlengkapan kudus.
- source_word: מִגְבָּלֹת ... מַעֲשֵׂה עֲבֹת
  choice: yang dipilin seperti tali
  rationale: Kedua ungkapan Ibrani yang sulit ini sama-sama menggambarkan pengerjaan menyerupai tali yang dipilin. Terjemahan ini mempertahankan gambaran utamanya tanpa membuat kalimat Indonesia terasa berulang secara berlebihan.
- source_word: שַׁרְשְׁרֹת הָעֲבֹתֹת
  choice: rantai-rantai yang dipilin
  rationale: Mencerminkan pengulangan kata “rantai” beserta penekanan pada bentuk atau pengerjaannya yang menyerupai tali pilin.
- source_word: עַל הַמִּשְׁבְּצֹת
  choice: pada bingkai-bingkai tersebut
  rationale: Istilah ini menunjuk pada bingkai atau dudukan emas dalam konteks perlengkapan efod; “bingkai” mudah dipahami dan tetap sesuai dengan konteks kerajinan perhiasan.
