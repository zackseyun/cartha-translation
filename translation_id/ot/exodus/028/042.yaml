  text: וַ/עֲשֵׂ֤ה לָ/הֶם֙ מִכְנְסֵי בָ֔ד לְ/כַסּ֖וֹת בְּשַׂ֣ר עֶרְוָ֑ה מִ/מָּתְנַ֥יִם וְ/עַד יְרֵכַ֖יִם יִהְיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/042.yaml
  text: And make for them linen undergarments to cover their naked flesh[b][a]; they shall be from the hips to the thighs.
translation:
  language: id
  text: Buatlah bagi mereka pakaian dalam dari linen[a] untuk menutupi tubuh mereka yang telanjang; panjangnya harus dari pinggang hingga paha.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "celana pendek dari linen." Istilah Ibrani ini menunjuk pakaian tubuh bagian bawah yang dikenakan di balik pakaian imam.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, "dari pinggang sampai paha." Kata Ibrani yang diterjemahkan "pinggang" juga dapat berarti "daerah pinggul" atau "pinggang/loins."
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה
  choice: Buatlah
  rationale: Bentuk perintah Qal diterjemahkan secara langsung dan wajar dalam rangkaian petunjuk pembuatan pakaian imam.
- source_word: לָהֶם
  choice: bagi mereka
  rationale: Menunjukkan pihak yang menerima pakaian itu, yaitu para imam yang disebut dalam konteks sebelumnya.
- source_word: מִכְנְסֵי בָד
  choice: celana dalam dari linen
  rationale: מִכְנְסֵי menunjuk pakaian tubuh bagian bawah yang dikenakan di bawah pakaian imam; 'celana dalam' menyampaikan fungsi itu dalam bahasa Indonesia modern. בָד di sini adalah linen.
- source_word: לְכַסּוֹת
  choice: untuk menutupi
  rationale: Infinitif ini menyatakan tujuan pakaian tersebut.
- source_word: בְּשַׂר עֶרְוָה
  choice: aurat mereka
  rationale: Secara harfiah berarti 'daging ketelanjangan'. 'Aurat mereka' merupakan ungkapan Indonesia yang alami dan bermartabat bagi bagian tubuh telanjang yang harus ditutupi, tanpa mempersempitnya secara tidak perlu.
- source_word: מִמָּתְנַיִם
  choice: dari pinggang
  rationale: מָתְנַיִם dapat menunjuk pinggang atau bagian panggul. 'Pinggang' paling alami untuk menyatakan batas atas pakaian dalam konteks ukuran pakaian.
- source_word: וְעַד יְרֵכַיִם
  choice: sampai paha
  rationale: יָרֵךְ lazim berarti paha dan di sini menyatakan batas bawah pakaian.
- source_word: יִהְיוּ
  choice: celana itu harus menutupi
  rationale: Kata kerjanya secara harfiah berarti 'harus ada/berada'. Dalam pernyataan rentang pakaian, pengulangan subjek dan 'menutupi' menghasilkan bahasa Indonesia yang jelas serta mempertahankan daya wajib bentuk verbal itu.
