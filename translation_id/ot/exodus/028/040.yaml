  yaml_path: translation/ot/exodus/028/040.yaml
  text: For Aaron’s sons you shall make tunics[a], and you shall make sashes for them, and you shall make caps for them, for glory and for beauty.
translation:
  language: id
  text: Untuk anak-anak Harun, buatlah pakaian panjang; buatlah ikat pinggang bagi mereka; dan buatlah penutup kepala[a] bagi mereka, untuk kemuliaan dan keindahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “topi,” “serban,” atau “tutup kepala”; bentuk tepat perlengkapan kepala imam ini tidak diketahui.
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי אַהֲרֹן
  choice: bagi anak-anak Harun
  rationale: Menyampaikan hubungan filial langsung dan terdengar alami dalam bahasa Indonesia.
- source_word: תַּעֲשֶׂה / וְעָשִׂיתָ
  choice: haruslah kaubuat / bagi mereka
  rationale: Bentuk verbal dalam konteks petunjuk menyatakan perintah. Variasi susunan menghindari pengulangan yang kaku tanpa menghilangkan daya perintahnya.
- source_word: כֻתֳּנֹת
  choice: pakaian panjang
  rationale: Istilah ini menunjuk pada pakaian tubuh dasar yang panjang; pilihan ini lebih mudah dipahami daripada istilah pinjaman 'tunik' dan tidak menimbulkan gambaran mantel modern.
- source_word: אַבְנֵטִים
  choice: ikat pinggang
  rationale: Menunjuk pada kain yang dililitkan di pinggang; 'ikat pinggang' merupakan padanan Indonesia yang lazim, meski tidak menentukan bahannya.
- source_word: מִגְבָּעוֹת
  choice: penutup kepala
  rationale: Padanan umum ini mempertahankan ketidakpastian tentang bentuk khusus perlengkapan kepala imam tersebut; kemungkinan topi atau serban dicatat dalam catatan kaki.
- source_word: לְכָבוֹד
  choice: untuk kemuliaan
  rationale: Mempertahankan nada luhur כָבוֹד serta kesejajarannya dengan tujuan estetis pakaian itu.
- source_word: וּלְתִפְאָרֶת
  choice: dan keindahan
  rationale: Menyampaikan aspek keindahan dan keelokan dari תִפְאֶרֶת secara wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Tujuan pakaian keimaman
  choice: untuk kemuliaan dan keindahan
  alternative: untuk kehormatan dan semarak
  rationale: Terjemahan mempertahankan tujuan yang luhur dan estetis dalam teks Ibrani tanpa menambahkan simbolisme teologis yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'haruslah kaubuat' mempertahankan nada instruksional, sedangkan susunan klausa dibuat alami dan mudah dibaca.
