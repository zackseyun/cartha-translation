base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/027.yaml
  text: You shall make two rings of gold and put them on the two shoulder-pieces of the ephod[a], underneath, on its front side, opposite its seam[b], above the skillfully woven band of the ephod.
translation:
  language: id
  text: Haruslah engkau membuat dua cincin emas dan memasangnya pada kedua bagian bahu efod itu, di sebelah bawah, pada sisi depannya, berhadapan dengan tempat penyambungannya[a], di atas sabuk tenunan efod itu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sambungannya” atau “titik pengikatnya.” Kata Ibrani ini secara luas menunjuk pada tempat bagian-bagian efod disatukan.
    reason: lexical_alternative
  - marker: b
    text: Atau “ikat pinggang efod itu.” Kata Ibrani חֵשֶׁב menunjuk pada sabuk atau bagian pengikat efod yang dibuat secara khusus.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַבְּעֹת
  choice: gelang
  rationale: Dalam perlengkapan Kemah Suci, kata ini lazim menunjuk pada gelang logam yang dipakai sebagai pengikat.
- source_word: כִתְפוֹת
  choice: bagian bahu
  rationale: Dalam konteks pembuatan pakaian, istilah ini menunjuk pada bagian efod yang berada di bahu, bukan pada bahu tubuh secara langsung.
- source_word: הָאֵפוֹד
  choice: efod
  rationale: Istilah teknis bagi pakaian imam ini dipertahankan sebagai transliterasi karena tidak memiliki padanan Indonesia yang singkat dan tepat.
- source_word: מִלְּמַטָּה
  choice: di sebelah bawah
  rationale: Ungkapan ini menyatakan letak pada bagian bawah; pilihan ini alami dan tidak memaksakan apakah benda itu tepat berada di bawah atau pada sisi bawah.
- source_word: מִמּוּל פָּנָיו
  choice: pada sisi depannya
  rationale: Secara harfiah ungkapan ini berkaitan dengan 'bagian muka'; untuk benda, 'sisi depan' menyampaikan orientasinya secara wajar.
- source_word: לְעֻמַּת
  choice: berhadapan dengan
  rationale: Preposisi ini menyatakan posisi yang sejajar, bersesuaian, atau berhadapan; terjemahan ini mempertahankan relasi ruang tersebut.
- source_word: מֶחְבַּרְתּוֹ
  choice: tempat penyambungannya
  rationale: Nomina ini menunjuk secara luas pada tempat bagian-bagian efod disambungkan. Pilihan ini tidak mempersempit maknanya menjadi jahitan tertentu.
- source_word: מִמַּעַל
  choice: di atas
  rationale: Menunjukkan posisi yang lebih tinggi daripada unsur pakaian yang disebut sesudahnya.
- source_word: חֵשֶׁב הָאֵפוֹד
  choice: sabuk tenunan efod itu
  rationale: Dalam konteks ini חֵשֶׁב menunjuk pada bagian efod berbentuk sabuk atau pengikat yang dikerjakan sebagai satu tenunan; frasa ini menyampaikan fungsi dan pembuatannya secara ringkas.
