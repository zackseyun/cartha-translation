translation:
  language: id
  text: Haruslah engkau membuat bingkai-bingkai dari emas.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dudukan-dudukan” atau “bingkai-bingkai kerawang.” Istilah Ibrani ini menunjuk pada bingkai atau dudukan hias, kemungkinan untuk memasang batu-batu atau mengaitkan rantai-rantai yang disebut dalam ayat-ayat di sekitarnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עָשִׂיתָ
  choice: Haruslah engkau membuat
  rationale: Dalam rangkaian petunjuk ini, bentuk orang kedua tunggal maskulin berfungsi sebagai perintah. 'Haruslah engkau membuat' mempertahankan gaya preskriptif dan bermartabat; waw penghubung tidak perlu diterjemahkan tersendiri dalam bahasa Indonesia karena ayat ini tetap terbaca sebagai kelanjutan petunjuk sebelumnya.
- source_word: מִשְׁבְּצֹת
  choice: bingkai-bingkai
  rationale: Kata benda jamak ini menunjuk pada wadah atau dudukan hias untuk memasang benda berharga atau mengaitkan rantai. 'Bingkai-bingkai' alami dalam bahasa Indonesia dan tidak menentukan teknik pengerjaan secara berlebihan.
- source_word: זָהָב
  choice: dari emas
  rationale: Menunjukkan bahan pembuat bingkai tersebut; 'dari emas' merupakan ungkapan Indonesia yang jelas dan wajar.
