  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָיָ֥ה עַֽל אַהֲרֹ֖ן לְ/שָׁרֵ֑ת וְ/נִשְׁמַ֣ע ק֠וֹל/וֹ בְּ/בֹא֨/וֹ אֶל הַ/קֹּ֜דֶשׁ לִ/פְנֵ֧י יְהוָ֛ה וּ/בְ/צֵאת֖/וֹ וְ/לֹ֥א יָמֽוּת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/035.yaml
  text: It shall be on Aaron when he ministers[a], and its sound shall be heard when he goes into the Holy Place before Yahweh and when he comes out[c][b], so that he may not die.
translation:
  language: id
  text: Jubah itu harus dikenakan Harun ketika ia melayani, dan bunyinya[a] harus terdengar ketika ia masuk ke Tempat Kudus[b] di hadapan Yahweh dan ketika ia keluar, supaya ia tidak mati.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bunyinya.” Sufiks Ibrani kemungkinan besar mengacu kepada jubah dan lonceng-loncengnya yang disebut dalam ayat-ayat sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “tempat suci”; dalam konteks ini istilah Ibrani tersebut menunjuk ruang kudus dalam Kemah Suci di hadapan Yahweh.
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan “agar jangan ia mati.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה עַל אַהֲרֹן
  choice: Jubah itu harus dikenakan Harun
  rationale: Dalam konteks petunjuk ritual, bentuk ini menyatakan ketentuan bahwa jubah yang baru saja dijelaskan harus berada pada tubuh Harun. Bentuk pasif ini alami dalam bahasa Indonesia dan mempertahankan acuan kontekstualnya.
- source_word: לְשָׁרֵת
  choice: ketika ia melayani
  rationale: Infinitif dengan ל dapat menyatakan tujuan atau keadaan. Di sini ungkapan temporal ini secara alami menggambarkan pelayanan imamat Harun.
- source_word: וְנִשְׁמַע קוֹלוֹ
  choice: dan bunyinya harus terdengar
  rationale: Bentuk pasif Ibrani dipertahankan. Sufiks tunggal paling wajar mengacu kepada jubah beserta lonceng-lonceng pada kelimnya yang disebut dalam ayat-ayat sebelumnya.
- source_word: בְּבֹאוֹ
  choice: ketika ia masuk
  rationale: Infinitif berkonstruksi dengan ב dan sufiks menyatakan waktu. Karena tujuannya langsung disebutkan, 'masuk' lebih alami daripada terjemahan harfiah 'pergi'.
- source_word: אֶל הַקֹּדֶשׁ
  choice: ke Tempat Kudus
  rationale: Dalam konteks Kemah Suci, istilah ini menunjuk ruang kudus tempat pelayanan imam. 'Tempat Kudus' mempertahankan kekhususan ritual istilah tersebut.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Ungkapan ini menyatakan kehadiran ilahi; nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'.
- source_word: וּבְצֵאתוֹ
  choice: dan ketika ia keluar
  rationale: Ungkapan temporal ini sejajar dengan 'ketika ia masuk' dan menyatakan keluarnya Harun dari ruang kudus.
- source_word: וְלֹא יָמוּת
  choice: supaya ia tidak mati
  rationale: Dalam ketentuan ritual ini, klausa tersebut paling alami menyatakan hasil atau pencegahan yang dimaksud, tanpa meniadakan kemungkinan nuansa peringatan.
theological_decisions:
- issue: Acuan bunyi yang terdengar
  choice: Bunyi jubah, khususnya lonceng-lonceng pada kelimnya
  alternative: Bunyi gerakan atau kehadiran Harun secara umum
  rationale: Konteks langsung dalam ayat 33–34 menyebut lonceng-lonceng pada kelim jubah, sehingga bunyi lonceng merupakan acuan paling dekat dan paling wajar. Teks utama tetap memakai bentuk 'bunyinya' agar tidak melebihi bentuk sumber.
- issue: Hubungan klausa terakhir dengan ketentuan sebelumnya
  choice: 'Tujuan atau hasil pencegahan: ''supaya ia tidak mati'''
  alternative: 'Peringatan langsung: ''agar jangan ia mati'' atau konsekuensi: ''dan ia tidak akan mati'''
  rationale: Konstruksi Ibrani memungkinkan nuansa hasil maupun peringatan. Terjemahan utama menyampaikan fungsi pencegahan secara jelas, sedangkan alternatif dipertahankan dalam catatan kaki.
- issue: Penerjemahan nama יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Transliterasi mempertahankan nama diri ilahi yang terdapat dalam teks Ibrani dan sesuai kebijakan istilah proyek.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan jelas. Istilah ritual 'Tempat Kudus' dipertahankan, sedangkan susunan kalimat dibuat alami tanpa menghilangkan hubungan antarklausa dalam teks Ibrani.
