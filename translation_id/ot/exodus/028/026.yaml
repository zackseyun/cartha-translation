  text: וְ/עָשִׂ֗יתָ שְׁתֵּי֙ טַבְּע֣וֹת זָהָ֔ב וְ/שַׂמְתָּ֣ אֹתָ֔/ם עַל שְׁנֵ֖י קְצ֣וֹת הַ/חֹ֑שֶׁן עַל שְׂפָת֕/וֹ אֲשֶׁ֛ר אֶל עֵ֥בֶר הָ/אֵפֹ֖ד בָּֽיְתָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/026.yaml
  text: You shall make two gold rings and put them on the two ends of the breastpiece[a], on its edge that is toward the inner side of the ephod.
translation:
  language: id
  text: Haruslah engkau membuat dua gelang emas dan memasangnya pada kedua ujung tutup dada itu, pada tepinya yang menghadap ke sisi dalam efod.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pada batasnya yang menghadap ke dalam, ke arah efod.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Haruslah engkau membuat
  rationale: Bentuk perfektum Qal dengan waw dalam rangkaian petunjuk menyatakan perintah; ungkapan ini mempertahankan daya direktif dengan ragam Indonesia yang khidmat dan jelas.
- source_word: שְׁתֵּי טַבְּעוֹת זָהָב
  choice: dua gelang emas
  rationale: טַבַּעַת menunjuk gelang atau cincin pengait; 'gelang emas' alami dalam konteks perlengkapan kemah suci dan menyatakan bahannya secara langsung.
- source_word: וְשַׂמְתָּ אֹתָם
  choice: dan memasangnya
  rationale: שׂים berarti menaruh, menempatkan, atau memasang. Karena gelang-gelang dilekatkan pada tutup dada, 'memasang' paling tepat dalam konteks pengerjaan.
- source_word: עַל שְׁנֵי קְצוֹת הַחֹשֶׁן
  choice: pada kedua ujung tutup dada itu
  rationale: קָצֶה berarti ujung atau bagian paling tepi. חֹשֶׁן diterjemahkan 'tutup dada' sebagai benda pakaian imam yang dimaksud dalam konteks ini.
- source_word: עַל שְׂפָתוֹ
  choice: pada tepinya
  rationale: שָׂפָה secara harfiah dapat berarti bibir, tepian, atau batas; untuk benda tekstil, 'tepi' merupakan padanan Indonesia yang paling alami.
- source_word: אֲשֶׁר אֶל עֵבֶר הָאֵפֹד בָּיְתָה
  choice: yang menghadap ke sisi dalam efod
  rationale: עֵבֶר menunjukkan sisi atau arah hadap, sedangkan בָּיְתָה berarti ke dalam. Terjemahan ini menyampaikan letak relatifnya sambil mempertahankan sedikit kelonggaran sintaksis frasa Ibrani.
