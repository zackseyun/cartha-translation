  text: 'dan baris ketiga: lesyem[a], akik[b], dan kecubung.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jenis batu yang disebut lesyem (לֶשֶׁם) tidak diketahui secara pasti. Batu ini sering diterjemahkan “yacinth”; secara tradisional juga “ligur”, dan ada yang mengusulkan “ambar”.
