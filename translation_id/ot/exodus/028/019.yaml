  - marker: b
    text: Atau mungkin “oniks”; istilah batu permata kuno tidak selalu dapat dicocokkan secara tepat dengan nama mineral modern.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר
  choice: dan baris yang
  rationale: Dalam konteks permata pada tutup dada, טוּר menunjuk pada baris atau deretan batu. Prefiks וְ diterjemahkan “dan” karena ayat ini melanjutkan daftar sebelumnya.
- source_word: הַשְּׁלִישִׁי
  choice: ketiga
  rationale: Kata bilangan bertingkat ini secara langsung menandai baris ketiga.
- source_word: לֶשֶׁם
  choice: lasyam
  rationale: Jenis batu yang dimaksud tidak dapat dipastikan. Transliterasi yang disesuaikan dengan ejaan Indonesia mempertahankan ketidakpastian tanpa memberi kesan bahwa identifikasi mineral modern tertentu sudah pasti.
- source_word: שְׁבוֹ
  choice: akik
  rationale: “Akik” merupakan padanan tradisional yang masuk akal dan mudah dikenali, meskipun istilah batu permata kuno ini mungkin menunjuk pada jenis lain, termasuk oniks.
- source_word: וְאַחְלָמָה
  choice: dan kecubung
  rationale: אַחְלָמָה lazim diidentifikasi sebagai amethyst; “kecubung” adalah nama batu tersebut yang alami dalam bahasa Indonesia.
