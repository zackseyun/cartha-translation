  text: And you shall put the two braided chains of gold on the two rings[b][a], at the ends of the breastpiece.
translation:
  language: id
  text: Pasanglah kedua rantai emas yang berpilin itu pada kedua gelang di ujung-ujung tutup dada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani untuk “tutup dada” juga sering diterjemahkan “baju dada”; yang dimaksud ialah perlengkapan imam yang dikenakan di dada, bukan zirah logam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Pasanglah
  rationale: Bentuk perfektum Qal dengan waw dalam rangkaian petunjuk berfungsi sebagai perintah. Karena rantai dihubungkan pada gelang, “pasanglah” lebih tepat dan alami daripada sekadar “taruhlah”.
- source_word: שְׁתֵּי עֲבֹתֹת הַזָּהָב
  choice: kedua rantai emas yang berpilin
  rationale: עֲבֹתֹת menunjuk pada untaian atau rantai yang dibuat dengan cara dipilin/dianyam. Frasa ini mempertahankan bahan emas sekaligus ciri pembuatannya tanpa memakai istilah kuno.
- source_word: עַל שְׁתֵּי הַטַּבָּעֹת
  choice: pada kedua gelang
  rationale: עַל di sini menyatakan tempat pemasangan. “Pada” alami dalam petunjuk pemasangan, sedangkan טַבָּעֹת adalah gelang-gelang pengait pada perlengkapan imam.
- source_word: אֶל קְצֹוֹת הַחֹשֶׁן
  choice: di ujung-ujung tutup dada
  rationale: קְצֹוֹת berbentuk jamak dan menunjuk pada bagian-bagian ujung. חֹשֶׁן adalah perlengkapan kain hias pada dada imam, bukan pelindung logam; “tutup dada” menyatakan letak dan bentuk umum benda itu dengan bahasa Indonesia yang mudah dipahami.
theological_decisions: []
