    rationale: Partikel “supaya” menjadikan klausa terakhir terutama klausa tujuan. Waw Ibrani di sini lebih aman diterjemahkan sebagai kelanjutan konsekuensial/hasil (“dan mereka akan ...”), tanpa menetapkan nuansa tujuan.
