  source_fidelity: 'Draf pada dasarnya mencerminkan urutan tindakan Ibrani dan istilah ritualnya dengan baik. Namun, “supaya mereka” mempersempit konjungsi waw pada וְכִהֲנוּ לִי menjadi tujuan, sedangkan teks menyatakannya sebagai kelanjutan/hasil: mereka akan menjalankan pelayanan imam bagi Allah. Objek pakaian memang tersirat dari konteks langsung, tetapi “pakaian itu” lebih tepat dibuat jamak agar selaras dengan perangkat pakaian imam yang telah disebutkan.'
