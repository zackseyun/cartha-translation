base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/041.yaml
  text: You shall clothe Aaron your brother and his sons with him[a], and you shall anoint them and ordain them and consecrate them, and they shall serve as priests to me.
translation:
  language: id
  text: Kenakanlah pakaian-pakaian itu pada Harun, saudaramu, dan pada anak-anaknya bersama dia. Urapilah mereka, tahbiskanlah mereka[a], dan kuduskanlah mereka, dan mereka akan melayani sebagai imam bagi-Ku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “penuhilah tangan mereka,” sebuah ungkapan Ibrani untuk melantik atau menetapkan seseorang dalam pelayanan imam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִלְבַּשְׁתָּ אֹתָם
  choice: Kenakanlah pakaian itu kepada
  rationale: Bentuk kausatif dari לבשׁ berarti membuat seseorang berpakaian. Dalam konteks ini yang dimaksud ialah pakaian imam yang baru saja diperintahkan; ungkapan ini alami dalam bahasa Indonesia tanpa mengubah rujukan kepada Harun dan anak-anaknya.
- source_word: אֶת אַהֲרֹן אָחִיךָ וְאֶת בָּנָיו אִתּוֹ
  choice: Harun, saudaramu, dan kepada anak-anaknya yang bersamanya
  rationale: Mempertahankan hubungan keluarga dan unsur אִתּוֹ, ‘bersamanya’, sambil menyusun frasa secara wajar dalam bahasa Indonesia.
- source_word: וּמָשַׁחְתָּ אֹתָם
  choice: Urapilah mereka
  rationale: משׁח adalah istilah ritual untuk mengurapi seseorang dengan minyak dalam penetapan bagi pelayanan kudus.
- source_word: וּמִלֵּאתָ אֶת יָדָם
  choice: tahbiskanlah mereka
  rationale: Secara harfiah berarti ‘penuhilah tangan mereka’, tetapi merupakan ungkapan Ibrani bagi pelantikan resmi ke dalam jabatan imam. ‘Tahbiskanlah’ menyampaikan fungsi ungkapan itu secara ringkas; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וְקִדַּשְׁתָּ אֹתָם
  choice: kuduskanlah mereka
  rationale: קדשׁ di sini berarti mengkhususkan mereka sebagai kudus bagi pelayanan sakral. ‘Kuduskanlah’ mempertahankan hubungan leksikal dengan kekudusan tanpa menambahkan rincian ritual.
- source_word: וְכִהֲנוּ לִי
  choice: supaya mereka melayani-Ku sebagai imam
  rationale: Bentuk כהן menyatakan pelaksanaan tugas imam, bukan sekadar menyandang gelar. ‘Melayani-Ku sebagai imam’ mempertahankan fungsi keimaman dan relasi pelayanan kepada Allah yang dinyatakan oleh לִי.
theological_decisions:
- issue: Makna ungkapan pelantikan imam מִלֵּא אֶת־יָד
  choice: Menerjemahkannya secara idiomatis sebagai ‘tahbiskanlah mereka’
  alternative: ‘penuhilah tangan mereka’ atau ‘lantiklah mereka’
  rationale: Ungkapan Ibrani ini menunjuk pada penetapan resmi ke dalam pelayanan imam, bukan tindakan mengisi tangan secara biasa. ‘Tahbiskanlah’ jelas dalam konteks keagamaan, sedangkan bentuk harfiah dipertahankan dalam catatan kaki agar dasar bahasanya transparan.
- issue: Hubungan klausa וְכִהֲנוּ לִי dengan tindakan pengudusan sebelumnya
  choice: Menggunakan ‘supaya’ untuk menyatakan hasil atau tujuan pelayanan imam
  alternative: ‘dan mereka akan melayani-Ku sebagai imam’
  rationale: Rangkaian tindakan tersebut mempersiapkan Harun dan anak-anaknya untuk menjalankan pelayanan imam. ‘Supaya’ menyampaikan hubungan kontekstual itu tanpa menentukan secara tajam apakah nuansanya semata-mata tujuan atau hasil.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk perintah dipakai untuk mencerminkan rangkaian instruksi ilahi. Istilah ‘urapi’, ‘tahbiskan’, ‘kuduskan’, dan ‘imam’ dipertahankan karena dikenal luas dan sesuai dengan konteks ritual, tanpa memasukkan tata tahbisan denominasi tertentu.
