  terminology: “Urapilah,” “tahbiskanlah,” “kuduskanlah,” dan “imam” sesuai untuk konteks pentahbisan imam. Catatan kaki mempertahankan idiom Ibrani secara transparan dan tidak perlu diubah secara substantif.
