    rationale: Konstruksi ini kurang idiomatis; juga “pakaian” tunggal kurang mencerminkan seperangkat pakaian imam dalam konteks. Perubahan ke “Kenakanlah pakaian-pakaian itu pada” memperbaiki kelancaran tanpa mengubah makna.
