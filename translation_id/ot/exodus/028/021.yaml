  text: וְ֠/הָ/אֲבָנִים תִּֽהְיֶ֜יןָ עַל שְׁמֹ֧ת בְּנֵֽי יִשְׂרָאֵ֛ל שְׁתֵּ֥ים עֶשְׂרֵ֖ה עַל שְׁמֹתָ֑/ם פִּתּוּחֵ֤י חוֹתָם֙ אִ֣ישׁ עַל שְׁמ֔/וֹ תִּֽהְיֶ֕יןָ לִ/שְׁנֵ֥י עָשָׂ֖ר שָֽׁבֶט־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/021.yaml
  text: And the stones shall correspond to the names of the sons of Israel[a], twelve according to their names. They shall be engraved like a signet, each with his name[c][b], for the twelve tribes.
translation:
  language: id
  text: Batu-batu itu harus sesuai dengan nama putra-putra Israel[a], dua belas batu menurut nama mereka. Batu-batu itu harus diukir seperti meterai[b], masing-masing dengan namanya, untuk kedua belas suku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “putra-putra Israel.” Ungkapan ini juga dapat diterjemahkan “anak-anak Israel” atau “orang Israel.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “dengan ukiran meterai” atau “diukir seperti pada meterai.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲבָנִים
  choice: Batu-batu itu
  rationale: Konjungsi Ibrani tidak perlu selalu dinyatakan dengan 'dan' dalam bahasa Indonesia; bentuk definit 'itu' menjaga kesinambungan dengan batu-batu yang telah disebut.
- source_word: תִּהְיֶיןָ עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: harus sesuai dengan nama anak-anak Israel
  rationale: Secara harfiah verba berarti 'akan/harus ada' dan עַל menandai hubungan dengan nama-nama. 'Sesuai dengan' menyampaikan hubungan korespondensi secara alami tanpa menentukan bahwa nama secara fisik berada di atas batu sebelum tindakan pengukiran dijelaskan.
- source_word: שְׁתֵּים עֶשְׂרֵה עַל שְׁמֹתָם
  choice: dua belas batu menurut nama mereka
  rationale: Kata 'batu' ditambahkan secara eksplisit dari anteseden feminin jamak agar jumlah dua belas tidak menggantung dalam bahasa Indonesia; 'menurut nama mereka' mempertahankan pengulangan sumber.
- source_word: פִּתּוּחֵי חוֹתָם
  choice: diukir seperti meterai
  rationale: Ungkapan nominal ini menunjuk pada ukiran bergaya meterai; bentuk pasif verbal lebih wajar dalam bahasa Indonesia dan sejalan dengan konteks pembuatan batu.
- source_word: אִישׁ עַל שְׁמוֹ
  choice: masing-masing dengan namanya
  rationale: אִישׁ berfungsi distributif, yaitu tiap batu memiliki satu nama. Bahasa Indonesia tidak membedakan pronomina posesif maskulin, sehingga 'namanya' secara alami mempertahankan rujukan tunggal.
- source_word: לִשְׁנֵי עָשָׂר שָׁבֶט
  choice: untuk kedua belas suku
  rationale: Preposisi לְ menyatakan peruntukan atau hubungan representatif; 'untuk' ringkas dan setia.
theological_decisions:
- issue: Ungkapan perjanjian בְּנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  alternative: orang Israel; keturunan Israel
  rationale: בְּנֵי secara leksikal berarti 'anak-anak laki-laki/anak-anak', tetapi dalam ungkapan kolektif ini menunjuk kepada keturunan Yakub yang menjadi asal kedua belas suku. 'Anak-anak Israel' mempertahankan bentuk kekerabatan sumber tanpa memasukkan istilah denominasi atau meniadakan kaitan dengan para leluhur suku.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada instruksional yang bermartabat. Pengulangan 'nama' dan 'dua belas' dipertahankan karena menonjol dalam teks Ibrani. Semua penanda catatan kaki muncul dalam teks utama.
