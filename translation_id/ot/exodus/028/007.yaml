translation:
  language: id
  text: Efod itu harus mempunyai dua bagian bahu yang tersambung pada kedua ujungnya[a], supaya efod itu tersambung.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dua tali bahu yang tersambung pada kedua ujungnya.” Istilah Ibrani dapat menunjuk pada bagian pakaian yang berada di bahu, bukan bahu tubuh secara harfiah.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah: “dan efod itu akan disambungkan.” Klausa terakhir dapat menyatakan hasil penyambungan ataupun sekadar melanjutkan petunjuk tersebut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי כְתֵפֹת
  choice: dua bagian bahu
  rationale: כְתֵפֹת dalam konteks pakaian imam menunjuk pada bagian baju efod yang berada di bahu, bukan bahu tubuh secara harfiah. “Bagian bahu” alami dan cukup spesifik dalam bahasa Indonesia.
- source_word: חֹבְרֹת
  choice: yang disambungkan
  rationale: Partisip feminin jamak dari חבר menerangkan kedua bagian bahu sebagai bagian yang disambungkan kepada kedua ujung baju efod; pilihan ini mempertahankan gambaran konstruksi pakaian.
- source_word: יִהְיֶה לּוֹ
  choice: harus mempunyai
  rationale: Konstruksi eksistensial dengan ל menyatakan kepunyaan. Dalam konteks petunjuk pembuatan, “harus mempunyai” menyampaikan daya preskriptif bentuk imperfek secara wajar.
- source_word: אֶל שְׁנֵי קְצוֹתָיו
  choice: pada kedua ujungnya
  rationale: אֶל menyatakan hubungan bagian bahu dengan ujung-ujung baju, sedangkan קְצוֹתָיו berarti dua ujung atau bagian terluarnya. “Pada kedua ujungnya” merupakan ungkapan konstruksi pakaian yang alami.
- source_word: וְחֻבָּר
  choice: sehingga baju itu menjadi satu
  rationale: Bentuk pasif dari חבר menyatakan hasil penyambungan. Ungkapan ini menyampaikan bahwa baju efod disatukan oleh kedua bagian bahu, sambil menghindari pengulangan Indonesia yang kaku.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Referen pronomina diperjelas menjadi “baju efod” karena ayat ini melanjutkan uraian tentang efod pada ayat sebelumnya. Pengulangan akar חבר dipertahankan secara semantis melalui “disambungkan” dan “menjadi satu”, sedangkan kemungkinan bentuk yang lebih harfiah dicatat dalam catatan kaki.
