translation:
  language: id
  text: Buatlah dua cincin emas pada tutup dada itu, lalu pasanglah kedua cincin itu pada kedua ujung tutup dada itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Haruslah engkau membuat
  rationale: Bentuk perfektum Qal dengan waw dalam rangkaian petunjuk menyatakan perintah; ungkapan ini mempertahankan daya direktifnya dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: עַל הַחֹשֶׁן
  choice: pada tutup dada itu
  rationale: Preposisi עַל menyatakan lokasi pemasangan pada benda tersebut. חֹשֶׁן di sini menunjuk pada perlengkapan imam yang dikenakan di dada; 'tutup dada' jelas dan tidak menambahkan unsur 'pengadilan' yang tidak hadir dalam frasa ayat ini.
- source_word: שְׁתֵּי טַבְּעוֹת זָהָב
  choice: dua gelang emas
  rationale: טַבַּעַת dalam konteks perlengkapan Kemah Suci adalah gelang atau cincin pengait; 'gelang emas' merupakan ungkapan bahan yang alami dan langsung.
- source_word: וְנָתַתָּ
  choice: lalu memasang
  rationale: Kata kerja נתן secara harfiah berarti memberi atau menaruh, tetapi dalam petunjuk perakitan ini tindakan yang dimaksud ialah menempatkan dan melekatkan gelang; 'memasang' menyampaikan tindakan fisiknya secara alami.
- source_word: אֶת שְׁתֵּי הַטַּבָּעוֹת
  choice: kedua gelang itu
  rationale: Frasa objek tentu ini merujuk kembali kepada dua gelang yang baru disebut; 'kedua ... itu' mempertahankan jumlah dan ketentuannya.
- source_word: עַל שְׁנֵי קְצֹוֹת הַחֹשֶׁן
  choice: pada kedua ujung tutup dada tersebut
  rationale: קָצֶה berarti ujung atau bagian terluar. 'Kedua ujung' mencerminkan bentuk dualitas yang dinyatakan teks dan cocok dengan petunjuk pemasangan.
