  register: Bahasa Indonesia baku, modern, dan lugas. “Harus” mempertahankan sifat instruktif ayat, sedangkan “pinggiran yang ditenun” menyampaikan bahan sekaligus pengerjaannya tanpa memakai istilah teknis yang kurang umum.
