  text: וְ/הָיָ֥ה פִֽי רֹאשׁ֖/וֹ בְּ/תוֹכ֑/וֹ שָׂפָ֡ה יִֽהְיֶה֩ לְ/פִ֨י/ו סָבִ֜יב מַעֲשֵׂ֣ה אֹרֵ֗ג כְּ/פִ֥י תַחְרָ֛א יִֽהְיֶה לּ֖/וֹ לֹ֥א יִקָּרֵֽעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/032.yaml
  text: Its opening for the head shall be in the middle of it; around its opening there shall be a woven edge[a], like the opening of a coat of mail, so that it may not be torn.
translation:
  language: id
  text: Lubang untuk kepala harus ada di tengah-tengahnya. Di sekeliling lubang itu harus ada pinggiran yang ditenun, seperti lubang pada baju zirah[a], supaya tidak robek.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seperti lubang pada pakaian pelindung” atau “seperti lubang pada kuiras.” Istilah Ibrani תַּחְרָא jarang digunakan; perbandingan ini tampaknya menunjuk pada lubang leher yang diperkuat agar tidak mudah robek.
    reason: lexical_alternative
lexical_decisions:
- source_word: פִי רֹאשׁוֹ
  choice: lubang untuk kepala
  rationale: פֶּה secara harfiah berarti “mulut”, tetapi dalam konteks pakaian menunjuk pada lubang atau bukaan; רֹאשׁוֹ menjelaskan bahwa bukaan itu diperuntukkan bagi kepala pemakainya.
- source_word: בְּתוֹכוֹ
  choice: di tengah-tengahnya
  rationale: Menunjukkan letak bukaan pada bagian tengah pakaian; ungkapan ini alami dalam bahasa Indonesia dan tetap dekat dengan gambaran Ibraninya.
- source_word: שָׂפָה ... מַעֲשֵׂה אֹרֵג
  choice: pinggiran yang ditenun
  rationale: שָׂפָה berarti bibir, tepi, atau pinggiran, sedangkan מַעֲשֵׂה אֹרֵג menerangkan bahwa pinggiran tersebut merupakan hasil pekerjaan tenun.
- source_word: לְפִיו סָבִיב
  choice: di sekeliling lubang itu
  rationale: פֶּה kembali menunjuk pada lubang pakaian, dan סָבִיב menyatakan bahwa pinggiran tersebut mengitari seluruh lubang.
- source_word: כְּפִי תַחְרָא
  choice: seperti lubang pada baju zirah
  rationale: תַחְרָא adalah istilah langka yang biasanya dipahami sebagai pakaian pelindung atau baju zirah. Terjemahan ini mempertahankan perbandingan dengan bukaan pakaian yang diperkuat tanpa menetapkan secara berlebihan jenis zirahnya.
- source_word: לֹא יִקָּרֵעַ
  choice: supaya tidak robek
  rationale: Bentuk Nifal menyampaikan makna pasif atau resultatif. Dalam konteks petunjuk pembuatan pakaian, frasa tujuan ini secara alami menyatakan fungsi pinggiran yang diperkuat.
