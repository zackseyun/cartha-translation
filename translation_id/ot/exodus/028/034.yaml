translation:
  language: id
  text: Giring-giring emas dan buah delima[b], giring-giring emas dan buah delima, pada kelim jubah itu, di sekelilingnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “di sekeliling kelim jubah itu.” Bahasa Ibrani menggabungkan kata depan yang berarti “pada/di atas” dengan kata keterangan yang berarti “di sekeliling” atau “berkeliling.”
    reason: lexical_alternative
  - marker: b
    text: “Buah delima” di sini kemungkinan besar adalah hiasan berbentuk buah delima yang dipasang di antara giring-giring.
    reason: cultural_note
lexical_decisions:
- source_word: פַּעֲמֹן
  choice: giring-giring
  rationale: Kata ini menunjuk pada lonceng kecil yang dipasang pada pakaian imam. “Giring-giring” menyampaikan ukuran dan fungsi tersebut dengan tepat dalam konteks ini.
- source_word: זָהָב
  choice: emas
  rationale: Kata benda bahan ini secara langsung menerangkan bahwa giring-giring tersebut terbuat dari emas.
- source_word: רִמּוֹן
  choice: buah delima
  rationale: Makna dasarnya ialah buah delima. Dalam konteks pakaian Kemah Suci, yang dimaksud kemungkinan besar ialah hiasan berbentuk buah delima, tetapi terjemahan utama mempertahankan ungkapan Ibrani tanpa memperjelasnya secara berlebihan.
- source_word: עַל
  choice: pada
  rationale: Preposisi ini secara dasar berarti “pada/di atas” dan di sini menyatakan letak benda-benda tersebut pada kelim jubah.
- source_word: שׁוּלֵי
  choice: kelim
  rationale: Dalam konteks pakaian, bentuk ini menunjuk pada tepian bawah atau kelim pakaian.
- source_word: מְעִיל
  choice: jubah
  rationale: Dalam konteks busana imam, “jubah” merupakan padanan Indonesia yang alami dan tepat.
- source_word: סָבִיב
  choice: di sekelilingnya
  rationale: Kata keterangan ini menegaskan bahwa susunan tersebut mengitari seluruh kelim jubah.
