base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/025.yaml
  text: And you shall put the two ends of the two cords on the two settings[a], and you shall place them on the shoulder pieces of the ephod, at its front.
translation:
  language: id
  text: Dua ujung dari kedua rantai berpilin itu harus kaupasang pada kedua bingkai[a], lalu kaupasang bingkai-bingkai itu pada bagian-bagian bahu efod, di sebelah depannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kedua dudukan.” Istilah Ibrani dapat menunjuk pada bingkai atau dudukan emas; bentuk tepatnya tidak pasti. Istilah yang diterjemahkan “rantai berpilin” juga dapat dipahami sebagai tali atau jalinan berpilin.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְצוֹת
  choice: ujung
  rationale: Kata ini menunjuk pada bagian paling akhir dari rantai berpilin; 'ujung' alami dan tepat dalam petunjuk pembuatan ini.
- source_word: הָעֲבֹתֹת
  choice: rantai berpilin
  rationale: Dalam konteks karya emas pada ayat-ayat sekitar, istilah ini merujuk pada untaian yang dibuat seperti tali dari emas; 'rantai berpilin' mempertahankan bentuk jalinannya sekaligus konteks bahannya.
- source_word: הַמִּשְׁבְּצֹת
  choice: bingkai
  rationale: Istilah ini menunjuk pada dudukan atau bingkai emas. 'Bingkai' jelas bagi pembaca modern tanpa menentukan secara berlebihan bentuk ornamennya.
- source_word: כִתְפֹת
  choice: bagian-bagian bahu
  rationale: Secara harfiah berarti 'bahu', tetapi dalam konteks pakaian menunjuk pada bagian efod yang berada di bahu.
- source_word: אֵפֹד
  choice: efod
  rationale: Nama pakaian khusus imam ini dipertahankan sebagai transliterasi karena tidak memiliki padanan Indonesia yang tepat.
- source_word: אֶל מוּל פָּנָיו
  choice: di sebelah depannya
  rationale: Frasa ruang ini menunjukkan sisi depan efod; pilihan ini alami dalam bahasa Indonesia dan mempertahankan rujukan pronominal teks.
- source_word: וְנָתַתָּה
  choice: lalu kaupasang
  rationale: Dalam konteks konstruksi, נתן menyatakan tindakan menempatkan atau memasangkan. 'Kaupasang' menyampaikan hubungan fungsional bagian-bagian tersebut dengan jelas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk 'kau-' dipakai untuk perintah tunggal kepada Musa. Pengulangan 'kedua' dipertahankan karena penting bagi ketepatan petunjuk konstruksi.
