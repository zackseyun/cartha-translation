  text: Ambillah dua batu oniks[a] dan ukirkan pada kedua batu itu nama-nama putra-putra Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani syoham menunjuk pada sejenis batu berharga yang secara tradisional diterjemahkan “oniks”; jenis mineralnya yang tepat tidak pasti. Sardoniks atau beril juga pernah diusulkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Ambillah
  rationale: Bentuk Qal perfek dengan waw dalam rangkaian petunjuk menyampaikan perintah. Imperatif Indonesia paling alami mengungkapkan daya direktifnya; urutan dilanjutkan dengan 'lalu' pada klausa berikutnya.
- source_word: שְׁתֵּי אַבְנֵי שֹׁהַם
  choice: dua batu oniks
  rationale: שֹׁהַם menunjuk pada batu berharga yang identitas mineralnya tidak pasti. 'Oniks' adalah padanan tradisional yang dikenal luas, sementara ketidakpastiannya dipertahankan dalam catatan kaki.
- source_word: וּפִתַּחְתָּ
  choice: lalu ukirlah
  rationale: Dalam konteks nama yang ditorehkan pada batu permata, 'ukirlah' secara alami menyatakan tindakan membuat tulisan dengan menggores atau memahat permukaan; 'lalu' menjaga urutan waw.
- source_word: עֲלֵיהֶם
  choice: pada keduanya
  rationale: Rujukannya ialah kedua batu tersebut. 'Pada keduanya' jelas dan alami serta menegaskan bahwa pengukiran dilakukan pada kedua batu.
- source_word: שְׁמוֹת
  choice: nama
  rationale: Bahasa Indonesia lazim memakai bentuk tak berubah 'nama' setelah konteks menunjukkan jamak; objeknya adalah nama-nama tertentu milik anak-anak Israel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: anak-anak laki-laki Israel
  rationale: Dalam konteks ini frasa tersebut merujuk secara khusus kepada putra-putra Israel yang menjadi leluhur suku-suku, bukan kepada bangsa Israel secara umum. Padanan ini mempertahankan kekhususan gender dan hubungan keluarga.
