translation:
  language: id
  text: Buatlah pakaian kudus bagi Harun, saudaramu, untuk kemuliaan dan keindahan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “untuk kehormatan dan keindahan” atau “untuk kemuliaan dan semarak.”'
    reason: Alternatif leksikal bagi כָּבוֹד dan תִּפְאָרֶת mempertahankan keluasan makna pasangan istilah Ibrani tersebut.
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Haruslah engkau membuat
  rationale: Bentuk Qal perfektif orang kedua tunggal maskulin dengan waw dalam konteks petunjuk menyatakan perintah. Ungkapan ini mempertahankan daya direktifnya secara wajar dan bermartabat dalam bahasa Indonesia.
- source_word: בִגְדֵי קֹדֶשׁ
  choice: pakaian kudus
  rationale: Bentuk konstruksi ini secara harfiah menunjuk pada pakaian yang dikhususkan bagi penggunaan sakral. 'Pakaian kudus' tepat tanpa memasukkan istilah gerejawi yang lebih kemudian.
- source_word: לְאַהֲרֹן אָחִיךָ
  choice: bagi Harun, saudaramu
  rationale: Nama pribadi mengikuti bentuk baku bahasa Indonesia, sedangkan hubungan kekeluargaan dengan Musa dipertahankan secara eksplisit.
- source_word: לְכָבוֹד
  choice: untuk kemuliaan
  rationale: כבוד dapat berarti kehormatan, kemuliaan, atau wibawa. 'Kemuliaan' mempertahankan ragam tinggi serta keluasan maknanya dalam konteks pakaian imam.
- source_word: וּלְתִפְאָרֶת
  choice: dan keindahan
  rationale: תפארת dapat menunjuk pada keindahan, semarak, atau keagungan. 'Keindahan' menyampaikan dimensi estetis dengan jelas dan berpasangan secara alami dengan 'kemuliaan'.
theological_decisions:
- issue: Tujuan atau dampak pakaian imam dalam frasa לְכָבוֹד וּלְתִפְאָרֶת
  choice: untuk kemuliaan dan keindahan
  alternative: untuk kehormatan dan keindahan; untuk kemuliaan dan semarak
  rationale: Frasa Ibrani tetap dibiarkan luas, mencakup martabat dan keelokan tanpa menetapkan secara berlebihan apakah kemuliaan itu terutama milik Allah, Harun, atau jabatan imam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Engkau' dipakai karena Musa disapa secara langsung dalam konteks ilahi; susunan kalimat tetap alami serta mempertahankan nuansa perintah dan kesejajaran dua frasa tujuan.
