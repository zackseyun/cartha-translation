source:
  edition: WLC
  text: וְ/שַׂמְתָּ֞ אֶת שְׁתֵּ֣י הָ/אֲבָנִ֗ים עַ֚ל כִּתְפֹ֣ת הָֽ/אֵפֹ֔ד אַבְנֵ֥י זִכָּרֹ֖ן לִ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/נָשָׂא֩ אַהֲרֹ֨ן אֶת שְׁמוֹתָ֜/ם לִ/פְנֵ֧י יְהוָ֛ה עַל שְׁתֵּ֥י כְתֵפָ֖י/ו לְ/זִכָּרֹֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/012.yaml
  text: And you shall set the two stones on the shoulder pieces of the ephod as memorial stones for the sons of Israel[b][a], and Aaron shall bear their names before Yahweh on his two shoulders for remembrance.
translation:
  language: id
  text: Haruslah engkau menempatkan kedua batu itu pada kedua bagian bahu efod sebagai batu-batu peringatan[a] bagi anak-anak Israel[b]. Harun harus membawa nama-nama mereka di hadapan Yahweh pada kedua bahunya sebagai peringatan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “batu-batu kenangan.”'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak-anak Israel”; ungkapan kekeluargaan ini merujuk secara kolektif kepada keturunan atau umat Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Haruslah engkau menempatkan
  rationale: Menyampaikan daya perintah dari bentuk orang kedua tunggal maskulin serta makna dasar שׂים, yaitu menaruh atau menempatkan.
- source_word: שְׁתֵּי הָאֲבָנִים
  choice: kedua batu itu
  rationale: Bentuk definit menunjuk kepada dua batu yang telah disebut dalam konteks sebelumnya tanpa mengulang jenis batunya.
- source_word: כִּתְפֹת הָאֵפֹד
  choice: bagian bahu efod
  rationale: Dalam konteks pakaian imam, כָּתֵף menunjuk pada bagian atau sambungan bahu efod, bukan bahu manusia secara harfiah.
- source_word: אַבְנֵי זִכָּרֹן
  choice: batu-batu peringatan
  rationale: Ungkapan konstruksi ini secara wajar berarti batu yang berfungsi sebagai peringatan; bentuk jamak dipertahankan.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: bagi anak-anak Israel
  rationale: Mempertahankan ungkapan kekeluargaan Ibrani בְּנֵי יִשְׂרָאֵל, yang dalam konteks ini merujuk secara kolektif kepada keturunan atau umat Israel.
- source_word: וְנָשָׂא ... אֶת שְׁמוֹתָם
  choice: Harun harus membawa nama-nama mereka
  rationale: נשׂא berarti membawa atau memikul; 'membawa' alami dalam bahasa Indonesia dan mempertahankan gambaran representatif imam.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Menerjemahkan ungkapan kehadiran לִפְנֵי secara langsung dan mempertahankan nama ilahi יהוה sebagai Yahweh.
- source_word: עַל שְׁתֵּי כְתֵפָיו
  choice: pada kedua bahunya
  rationale: Berbeda dari bagian bahu efod pada klausa pertama, frasa ini secara konkret menunjuk kepada kedua bahu Harun.
- source_word: לְזִכָּרֹן
  choice: sebagai peringatan
  rationale: Mempertahankan kaitan leksikal dengan זִכָּרֹן sebelumnya tanpa menentukan secara eksplisit siapa yang mengingat.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks sumber memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian dan mengikuti lapisan konsultasi yang telah diaudit.
- issue: Cakupan ungkapan בְּנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  alternative: orang Israel; umat Israel; keturunan Israel
  rationale: Pilihan ini mempertahankan bentuk kekeluargaan teks sumber, sementara catatan menjelaskan bahwa ungkapan tersebut merujuk secara kolektif kepada umat Israel dan tidak dibatasi hanya pada anak kecil atau laki-laki.
- issue: Pihak yang mengingat dalam לְזִכָּרֹן
  choice: dibiarkan tidak ditentukan
  alternative: agar Yahweh mengingat; agar Israel mengingat
  rationale: Bahasa Ibrani hanya menyatakan fungsi peringatan dan tidak secara eksplisit menetapkan subjek yang mengingat; terjemahan tidak menyelesaikan ambiguitas itu.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan khidmat. 'Efod' dipertahankan sebagai istilah teknis pakaian imam. Struktur dua klausa dan pengulangan 'peringatan' dipertahankan untuk mencerminkan susunan serta kaitan leksikal teks Ibrani.
