source:
  edition: WLC
  text: וְ/אֵ֨לֶּה הַ/בְּגָדִ֜ים אֲשֶׁ֣ר יַעֲשׂ֗וּ חֹ֤שֶׁן וְ/אֵפוֹד֙ וּ/מְעִ֔יל וּ/כְתֹ֥נֶת תַּשְׁבֵּ֖ץ מִצְנֶ֣פֶת וְ/אַבְנֵ֑ט וְ/עָשׂ֨וּ בִגְדֵי קֹ֜דֶשׁ לְ/אַהֲרֹ֥ן אָחִ֛י/ךָ וּ/לְ/בָנָ֖י/ו לְ/כַהֲנ/וֹ לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/004.yaml
  text: 'And these are the garments that they shall make: a breastpiece[a], an ephod, a robe, a checkered tunic, a turban, and a sash. They shall make holy garments for Aaron your brother and for his sons[d][c][b], for him to serve as priest to me.'
translation:
  language: id
  text: 'Inilah pakaian yang harus mereka buat: penutup dada[a], efod[b], jubah, tunik yang ditenun berpola[c], serban, dan ikat pinggang. Mereka harus membuat pakaian kudus[d] bagi Harun, saudaramu, dan bagi anak-anak lelakinya, supaya ia melayani-Ku sebagai imam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "baju dada". Istilah Ibrani ini menunjuk pada perlengkapan imam yang dikenakan di dada, bukan perlengkapan zirah.
    reason: lexical_alternative
  - marker: b
    text: Efod adalah pakaian khas imam yang tidak mempunyai padanan tepat dalam bahasa Indonesia.
    reason: cultural_note
  - marker: c
    text: Atau "tunik berkotak-kotak"; kata Ibraninya menunjuk pada tenunan yang dikerjakan dengan suatu pola, tetapi bentuk persis polanya tidak pasti.
    reason: lexical_alternative
  - marker: d
    text: Atau "pakaian suci".
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּגָדִים
  choice: pakaian
  rationale: Istilah umum yang alami dan tepat untuk busana imam; tidak memasukkan nuansa gerejawi yang lebih kemudian.
- source_word: יַעֲשׂוּ
  choice: harus mereka buat
  rationale: Bentuk imperfek dalam rangkaian perintah ini menyatakan instruksi; 'harus' mempertahankan daya perintah dalam bahasa Indonesia modern.
- source_word: חֹשֶׁן
  choice: penutup dada
  rationale: Menunjuk perlengkapan imam pada bagian dada, bukan zirah; ungkapan deskriptif ini menghindari kesan militer dari 'pelindung dada'.
- source_word: אֵפוֹד
  choice: efod
  rationale: Transliterasi dipertahankan karena benda khas busana imam ini tidak mempunyai padanan Indonesia yang tepat.
- source_word: מְעִיל
  choice: jubah
  rationale: Padanan Indonesia yang jelas dan wajar bagi pakaian luar panjang dalam konteks ini.
- source_word: כְתֹנֶת תַּשְׁבֵּץ
  choice: tunik tenunan berpola
  rationale: כְתֹנֶת adalah tunik, sedangkan תַּשְׁבֵּץ menunjukkan pekerjaan tenun berpola atau berkotak; pilihan ini menyampaikan sifat tekstilnya tanpa memastikan pola yang masih diperdebatkan.
- source_word: מִצְנֶפֶת
  choice: serban
  rationale: Padanan yang lazim dan jelas untuk penutup kepala imam yang dililitkan.
- source_word: אַבְנֵט
  choice: selempang
  rationale: Menunjuk kain panjang yang dililitkan pada tubuh; lebih sesuai dengan busana upacara daripada 'ikat pinggang' yang dapat menyiratkan sabuk biasa.
- source_word: בִגְדֵי קֹדֶשׁ
  choice: pakaian kudus
  rationale: Terjemahan langsung yang mempertahankan kosakata kekudusan yang penting dalam konteks keimaman.
- source_word: לְאַהֲרֹן אָחִיךָ
  choice: bagi Harun, saudaramu
  rationale: Mempertahankan sapaan kepada Musa dan identifikasi hubungan keluarga dalam teks Ibrani.
- source_word: וּלְבָנָיו
  choice: dan bagi anak-anak lelakinya
  rationale: בָּנִים secara khusus merujuk kepada putra-putra Harun dalam garis pelayanan imam; bentuk ini menghindari netralisasi gender.
- source_word: לְכַהֲנוֹ לִי
  choice: supaya ia melayani-Ku sebagai imam
  rationale: Infinitif menyatakan tujuan dan verba כיהן mengandung gagasan menjalankan pelayanan imam, bukan sekadar menyandang kedudukan.
theological_decisions:
- issue: Istilah busana imam perlu mempertahankan kekhasan kultis tanpa memasukkan tradisi gerejawi kemudian.
  choice: Memakai istilah Indonesia yang biasa namun tepat, sambil mempertahankan 'efod' sebagai istilah teknis.
  alternative: Menerjemahkan efod secara deskriptif sebagai celemek imam atau memakai istilah busana liturgis yang lebih gerejawi.
  rationale: Tidak ada satu padanan deskriptif yang sepenuhnya mewakili efod. Transliterasi menjaga kekhasan bendanya, sedangkan unsur lain dapat diterjemahkan secara alami.
- issue: Makna תַּשְׁבֵּץ pada jenis tunik.
  choice: tunik tenunan berpola
  alternative: tunik berkotak-kotak
  rationale: Kata tersebut menunjuk pekerjaan tekstil berpola, tetapi bentuk persis polanya tidak sepenuhnya pasti. Terjemahan tidak memaksakan pola kotak sebagai satu-satunya kemungkinan.
- issue: Gender dalam penerusan pelayanan imam.
  choice: anak-anak lelakinya
  alternative: anak-anaknya atau keturunannya
  rationale: Teks secara khusus menyebut putra-putra Harun yang akan melayani sebagai imam; terjemahan mempertahankan kekhususan ini.
- issue: Cakupan tunggal לְכַהֲנוֹ setelah Harun dan putra-putranya disebutkan.
  choice: supaya ia melayani-Ku sebagai imam
  alternative: supaya mereka melayani-Ku sebagai imam-imam
  rationale: Akhiran tunggal pada bentuk Ibrani secara gramatikal merujuk kepada Harun. Terjemahan mempertahankan bentuk tunggal dan tidak memperluasnya secara diam-diam, meskipun konteks yang lebih luas juga menetapkan putra-putranya sebagai imam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada perintah yang khidmat tetapi mudah dipahami. Istilah teknis 'efod' dipertahankan, sedangkan benda lainnya diterjemahkan dengan kosakata busana yang umum. Kapital pada '-Ku' mengikuti konvensi Indonesia untuk pronomina yang merujuk kepada Allah.
