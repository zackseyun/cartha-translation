base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/028.yaml
  text: They shall bind the breastpiece by its rings to the rings of the ephod with a cord of blue yarn[a], so that it may be on the skillfully woven band of the ephod[c][b], and the breastpiece shall not come loose from the ephod.
translation:
  language: id
  text: Mereka harus mengikat cincin-cincin tutup dada itu pada cincin-cincin efod dengan tali biru[a], supaya tutup dada itu berada di atas sabuk efod yang ditenun dengan indah dan tidak bergeser dari efod.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani תְּכֵלֶת menunjuk pada bahan tekstil berwarna biru, mungkin biru keunguan, yang digunakan dalam Kemah Suci dan pakaian imam.
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “tidak terlepas dari efod.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִרְכְּסוּ
  choice: Mereka harus mengikat
  rationale: Kata kerja ini menyatakan tindakan mengikat atau memasangkan dengan erat; bentuk ini alami dalam konteks cincin dan tali tanpa memperinci cara ikatannya secara berlebihan.
- source_word: הַחֹשֶׁן
  choice: tutup dada
  rationale: Dalam konteks pakaian imam, istilah ini menunjuk pada perlengkapan berhias yang dikenakan di dada dan dipasang pada efod, bukan zirah.
- source_word: מִטַּבְּעֹתָיו אֶל טַבְּעֹת הָאֵפֹד
  choice: melalui cincin-cincinnya pada cincin-cincin efod
  rationale: Ungkapan ini menyampaikan bahwa cincin pada tutup dada menjadi titik pengikatan menuju cincin efod; 'melalui ... pada' jelas dan wajar dalam petunjuk pemasangan.
- source_word: בִּפְתִיל תְּכֵלֶת
  choice: dengan tali dari benang biru
  rationale: פְּתִיל berarti tali atau benang yang dipilin, sedangkan תְּכֵלֶת menunjuk pada bahan tekstil berwarna biru yang dipakai dalam Kemah Suci dan pakaian imam.
- source_word: לִהְיוֹת עַל חֵשֶׁב הָאֵפֹד
  choice: supaya tutup dada itu tetap berada di atas sabuk tenunan efod
  rationale: Infinitif menyatakan tujuan atau hasil. 'Tetap berada' sesuai dengan fungsi pengikat yang dijelaskan, sementara חֵשֶׁב dalam konteks ini adalah sabuk atau ikat pinggang tenunan yang menjadi bagian efod.
- source_word: וְלֹא יִזַּח הַחֹשֶׁן מֵעַל הָאֵפֹד
  choice: dan tidak bergeser dari efod
  rationale: Bentuk Nifal יִזַּח menyatakan dipindahkan, bergeser, atau terlepas dari kedudukannya; 'tidak bergeser' mempertahankan gagasan posisi tanpa membatasi makna hanya pada terlepasnya ikatan.
