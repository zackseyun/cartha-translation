translation_notes:
  register: Bahasa Indonesia baku modern dengan nada instruksional yang lugas dan bermartabat. Istilah teknis 'efod' dipertahankan; 'tutup dada' dipilih agar tidak menimbulkan kesan sebagai zirah. Semua penanda catatan kaki ditempatkan dalam teks utama.
