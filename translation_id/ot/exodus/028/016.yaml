lexical_decisions:
- source_word: רָבוּעַ
  choice: persegi
  rationale: Kata sifat ini menyatakan bentuk bersegi empat dengan panjang dan lebar yang sama; “persegi” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: יִהְיֶה
  choice: harus
  rationale: Bentuk imperfek dalam konteks petunjuk pembuatan menyampaikan ketentuan mengenai bentuk benda tersebut.
- source_word: כָּפוּל
  choice: dibuat rangkap
  rationale: Partisip pasif ini menggambarkan benda yang dibuat dalam bentuk ganda, mungkin dengan melipat bahan; pilihan ini mempertahankan ketidakpastian mengenai cara pembuatannya.
- source_word: זֶרֶת
  choice: sejengkal
  rationale: Istilah ini menunjuk ukuran panjang berdasarkan rentangan tangan; “jengkal” adalah padanan Indonesia yang tepat dan mudah dipahami.
- source_word: אָרְכּוֹ
  choice: panjangnya
  rationale: Nomina dengan akhiran orang ketiga tunggal maskulin merujuk pada panjang tutup dada.
- source_word: וְזֶרֶת
  choice: dan sejengkal
  rationale: Konjungsi menghubungkan ukuran kedua, dan pengulangan satuan terdengar alami dalam rumusan ukuran bahasa Indonesia.
- source_word: רָחְבּוֹ
  choice: lebarnya
  rationale: Kata ini menyatakan dimensi lebar, berpasangan secara alami dengan “panjangnya”.
