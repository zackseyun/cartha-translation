source:
  edition: WLC
  text: וְ/נָתַתָּ֞ אֶל חֹ֣שֶׁן הַ/מִּשְׁפָּ֗ט אֶת הָ/אוּרִים֙ וְ/אֶת הַ/תֻּמִּ֔ים וְ/הָיוּ֙ עַל לֵ֣ב אַהֲרֹ֔ן בְּ/בֹא֖/וֹ לִ/פְנֵ֣י יְהוָ֑ה וְ/נָשָׂ֣א אַ֠הֲרֹן אֶת מִשְׁפַּ֨ט בְּנֵי יִשְׂרָאֵ֧ל עַל לִבּ֛/וֹ לִ/פְנֵ֥י יְהוָ֖ה תָּמִֽיד־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/030.yaml
  text: And you shall put the Urim and the Thummim into the breastpiece of judgment[a], and they shall be on Aaron’s heart when he goes in before Yahweh[c][b]. And Aaron shall bear the judgment of the sons of Israel on his heart before Yahweh continually.
translation:
  language: id
  text: Haruslah engkau menaruh Urim dan Tumim[a] ke dalam tutup dada keputusan[b]. Keduanya harus berada pada dada Harun ketika ia masuk menghadap Yahweh. Harun harus membawa keputusan mengenai bani Israel[c] pada dadanya di hadapan Yahweh senantiasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Urim dan Tumim adalah nama Ibrani bagi benda-benda kudus yang berkaitan dengan pengambilan keputusan oleh imam. Bentuk dan cara penggunaannya tidak diketahui dengan pasti. Berdasarkan kemungkinan etimologinya, nama-nama itu kadang dipahami sebagai “cahaya-cahaya” dan “kesempurnaan-kesempurnaan”.
    reason: lexical_alternative
  - marker: b
    text: Atau “tutup dada penghakiman” atau “tutup dada keadilan”. Kata Ibrani מִשְׁפָּט dapat berarti keputusan, penghakiman, atau keadilan, bergantung pada konteks.
    reason: alternative_reading
  - marker: c
    text: Secara harfiah, “anak-anak lelaki Israel”; ungkapan Ibrani ini merupakan sebutan kolektif bagi umat Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹשֶׁן הַמִּשְׁפָּט
  choice: tutup dada keputusan
  rationale: חֹשֶׁן menunjuk pada perlengkapan imam yang dikenakan pada dada dan tampaknya juga berfungsi sebagai wadah. מִשְׁפָּט dalam konteks Urim dan Tumim paling alami menyatakan keputusan berwenang, tetapi kemungkinan makna ‘penghakiman’ atau ‘keadilan’ tetap dicatat.
- source_word: הָאוּרִים וְהַתֻּמִּים
  choice: Urim dan Tumim
  rationale: Keduanya merupakan istilah teknis untuk benda-benda kudus yang bentuk dan cara penggunaannya tidak diketahui dengan pasti; transliterasi menghindari penyajian etimologi yang diperdebatkan sebagai makna yang pasti.
- source_word: אֶל
  choice: ke dalam
  rationale: Dengan verba נָתַתָּ dan tutup dada yang dapat berfungsi sebagai wadah, frasa ini paling mungkin menyatakan penempatan ke dalamnya.
- source_word: וְהָיוּ עַל לֵב אַהֲרֹן
  choice: Keduanya harus berada di atas jantung Harun
  rationale: Terjemahan ini mempertahankan gambaran konkret bahwa benda-benda itu dikenakan pada bagian dada tepat di atas jantung, sekaligus tidak menghilangkan kemungkinan nilai simbolis ‘jantung’.
- source_word: בְּבֹאוֹ לִפְנֵי יְהוָה
  choice: ketika ia masuk menghadap Yahweh
  rationale: Ungkapan ini menunjukkan saat Harun masuk ke tempat kudus dan hadir di hadapan Yahweh; ‘masuk menghadap’ menyampaikan kedua unsur tersebut secara alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וְנָשָׂא
  choice: harus membawa
  rationale: נשא memiliki arti dasar membawa atau menanggung. ‘Membawa’ mempertahankan tindakan fisik dan masih memungkinkan nuansa perwakilan imam.
- source_word: מִשְׁפַּט בְּנֵי יִשְׂרָאֵל
  choice: keputusan bagi bani Israel
  rationale: Konstruksi ini dalam konteksnya kemungkinan besar menunjuk pada keputusan ilahi yang diperoleh bagi Israel. Preposisi ‘bagi’ memperjelas relasinya tanpa menganggap Israel sebagai pihak yang dihakimi secara negatif.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: ‘Bani Israel’ merupakan ungkapan Indonesia yang ringkas dan lazim untuk keturunan sekaligus umat perjanjian Israel, serta mempertahankan bentuk kolektif ungkapan Ibrani.
- source_word: עַל לִבּוֹ
  choice: di atas jantungnya
  rationale: Pilihan ini konsisten dengan kemunculan sebelumnya dan mempertahankan dimensi fisik serta simbolis ungkapan Ibrani.
- source_word: תָּמִיד
  choice: senantiasa
  rationale: Dalam konteks keimaman, תָּמִיד menyatakan kewajiban yang tetap dan berulang di hadapan Allah, bukan keharusan melakukan tindakan fisik itu tanpa jeda setiap saat.
theological_decisions:
- issue: Apakah אוּרִים dan תֻּמִּים diterjemahkan menurut dugaan etimologinya atau ditransliterasikan
  choice: Ditransliterasikan sebagai ‘Urim’ dan ‘Tumim’
  alternative: Diterjemahkan sebagai ‘cahaya-cahaya’ dan ‘kesempurnaan-kesempurnaan’
  rationale: Bentuk, fungsi, dan etimologi tepat kedua benda itu tidak pasti. Transliterasi mempertahankan ketidakpastian teks tanpa memasukkan teori tertentu tentang cara Allah menyatakan keputusan-Nya.
- issue: Makna מִשְׁפָּט dalam ayat ini
  choice: Diterjemahkan sebagai ‘keputusan’ pada kedua kemunculannya
  alternative: ‘penghakiman’ atau ‘keadilan’
  rationale: Kaitan langsungnya dengan Urim dan Tumim mendukung arti keputusan berwenang atau jawaban hukum-ilahi. Pengulangan istilah dipertahankan, sementara catatan kaki mengakui rentang makna yang lebih luas.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: ‘bani Israel’ sebagai sebutan kolektif bagi umat Israel
  alternative: ‘anak-anak lelaki Israel’ atau ‘orang Israel’
  rationale: Dalam konteks ini frasa tersebut berfungsi sebagai nama kolektif umat perjanjian, bukan pembatasan rujukan hanya kepada laki-laki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk ‘haruslah engkau’ mempertahankan sapaan tunggal serta daya perintah teks, sedangkan ‘Yahweh’, ‘Urim’, dan ‘Tumim’ dipertahankan sebagai nama diri. Pengulangan ‘keputusan’ dan ‘di atas jantung’ sengaja dipertahankan untuk mencerminkan struktur serta citra Ibrani.
