  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָיוּ֩ עַל אַהֲרֹ֨ן וְ/עַל בָּנָ֜י/ו בְּ/בֹאָ֣/ם אֶל אֹ֣הֶל מוֹעֵ֗ד א֣וֹ בְ/גִשְׁתָּ֤/ם אֶל הַ/מִּזְבֵּ֨חַ֙ לְ/שָׁרֵ֣ת בַּ/קֹּ֔דֶשׁ וְ/לֹא יִשְׂא֥וּ עָוֺ֖ן וָ/מֵ֑תוּ חֻקַּ֥ת עוֹלָ֛ם ל֖/וֹ וּ/לְ/זַרְע֥/וֹ אַחֲרָֽי/ו־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/043.yaml
  text: And they shall be on Aaron and on his sons when they enter the tent of meeting[a], or when they approach the altar to minister in the holy place, so that they may not bear guilt and die[b]. It shall be a permanent statute for him and for his offspring after him.
translation:
  language: id
  text: Pakaian itu harus dikenakan oleh Harun dan anak-anaknya ketika mereka masuk ke Kemah Pertemuan atau ketika mereka mendekati mazbah untuk melayani di tempat kudus, supaya mereka tidak menanggung kesalahan[a] lalu mati. Itulah ketetapan untuk selamanya[b] bagi Harun dan keturunannya sesudah dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menjadi bersalah”; secara harfiah, “menanggung kesalahan,” suatu ungkapan hukum dan peribadatan.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “ketetapan tetap.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ עַל
  choice: harus dikenakan oleh
  rationale: Dalam konteks pakaian imam, ungkapan harfiah 'berada di atas' secara alami berarti pakaian itu harus dipakai; bentuk preskriptif hukum dipertahankan dengan 'harus'.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Padanan baku, jelas, dan mempertahankan fungsi kemah sebagai tempat pertemuan yang ditetapkan.
- source_word: בְגִשְׁתָּם אֶל הַמִּזְבֵּחַ
  choice: ketika mereka mendekati mazbah
  rationale: נגשׁ dalam konteks keimaman menunjuk pada tindakan datang mendekat untuk pelayanan suci; 'mendekati' mempertahankan nuansa tersebut.
- source_word: לְשָׁרֵת בַּקֹּדֶשׁ
  choice: untuk melayani di tempat kudus
  rationale: '''Melayani'' menyampaikan pelayanan imam dengan bahasa Indonesia yang wajar, sedangkan ''tempat kudus'' mempertahankan unsur kekudusan dalam קֹדֶשׁ.'
- source_word: וְלֹא יִשְׂאוּ עָוֹן
  choice: supaya mereka tidak menanggung kesalahan
  rationale: Ungkapan hukum-kultis נשׂא עון dipertahankan cukup dekat tanpa memakai 'kedurhakaan' yang dapat mempersempit atau memperberat maknanya.
- source_word: וָמֵתוּ
  choice: lalu mati
  rationale: Menunjukkan kematian sebagai akibat lanjutan dari menanggung kesalahan dalam konteks pelanggaran kekudusan.
- source_word: חֻקַּת עוֹלָם
  choice: ketetapan untuk selamanya
  rationale: Menyampaikan sifat terus berlaku dari ketetapan itu dengan bahasa modern sambil mempertahankan cakupan temporal עוֹלָם.
- source_word: זַרְעוֹ
  choice: keturunannya
  rationale: Padanan kolektif yang alami bagi זֶרַע dalam konteks garis keturunan Harun.
theological_decisions:
- issue: Hubungan antara pelanggaran imam, kesalahan, dan kematian
  choice: Pakaian diwajibkan supaya para imam tidak menanggung kesalahan lalu mati.
  alternative: Pakaian diwajibkan supaya mereka tidak menjadi bersalah dan mati.
  rationale: Pilihan utama mempertahankan idiom hukum-kultis 'menanggung kesalahan' dan kaitan serius antara pelanggaran terhadap kekudusan dan kematian, tanpa menjelaskan mekanismenya lebih jauh daripada teks.
- issue: Jangka waktu ketetapan
  choice: ketetapan untuk selamanya
  alternative: ketetapan tetap
  rationale: Keduanya mungkin untuk חֻקַּת עוֹלָם; pilihan utama mempertahankan secara lebih terbuka daya temporal עוֹלָם tanpa menentukan secara teologis bagaimana keberlakuannya dipahami dalam kerangka yang lebih luas.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. 'Mazbah' dipakai sebagai istilah peribadatan yang ringkas dan lazim dalam register Alkitab, sedangkan susunan kalimat dibuat alami tanpa menghilangkan daya hukum ayat.
