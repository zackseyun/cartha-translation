  text: מַעֲשֵׂ֣ה חָרַשׁ֮ אֶבֶן֒ פִּתּוּחֵ֣י חֹתָ֗ם תְּפַתַּח֙ אֶת שְׁתֵּ֣י הָ/אֲבָנִ֔ים עַל שְׁמֹ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל מֻסַבֹּ֛ת מִשְׁבְּצ֥וֹת זָהָ֖ב תַּעֲשֶׂ֥ה אֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/011.yaml
  text: Like the work of an engraver in stone[a], like the engravings of a signet, you shall engrave the two stones with the names of the sons of Israel[b]; you shall make them enclosed in settings of gold.
translation:
  language: id
  text: Dengan keahlian seorang pengukir batu, seperti ukiran pada meterai, ukirlah kedua batu itu dengan nama-nama putra-putra Israel[a]. Buatlah keduanya dengan bingkai emas di sekelilingnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “putra-putra Israel.” Yang dimaksud adalah putra-putra Yakub (Israel), yang namanya mewakili suku-suku keturunan mereka.
    reason: cultural_note
lexical_decisions:
- source_word: מַעֲשֵׂה חָרַשׁ אֶבֶן
  choice: Dengan keahlian seorang pengukir batu
  rationale: Frasa ini menunjukkan cara atau mutu pengerjaan oleh perajin batu. Pilihan ini alami dalam bahasa Indonesia dan sesuai dengan konteks pengukiran batu permata.
- source_word: פִּתּוּחֵי חֹתָם
  choice: seperti ukiran meterai
  rationale: Menunjuk pada ukiran khas yang dibuat pada meterai. Kata 'meterai' mempertahankan benda kuno yang dipakai untuk menghasilkan cap.
- source_word: תְּפַתַּח
  choice: ukirlah
  rationale: Dalam konteks penorehan nama pada batu, 'mengukir' merupakan padanan Indonesia yang tepat dan lazim.
- source_word: שְׁתֵּי הָאֲבָנִים
  choice: kedua batu itu
  rationale: Mempertahankan sebutan umum 'batu' dari teks Ibrani tanpa mempersempitnya menjadi batu permata.
- source_word: עַל שְׁמֹת בְּנֵי יִשְׂרָאֵל
  choice: dengan nama anak-anak lelaki Israel
  rationale: Preposisi עַל dalam konteks ini menyatakan isi ukiran. 'Anak-anak lelaki Israel' mempertahankan rujukan genealogis maskulin kepada putra-putra Israel yang menjadi leluhur suku-suku.
- source_word: מֻסַבֹּת מִשְׁבְּצוֹת זָהָב
  choice: dikelilingi bingkai emas
  rationale: Menggambarkan batu-batu yang dipasang atau dilingkupi oleh dudukan hias dari emas tanpa menentukan teknik pengerjaan kuno secara berlebihan.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: Buatlah keduanya
  rationale: Perintah ini merujuk kembali kepada kedua batu; 'keduanya' menghindari pengulangan yang kaku.
theological_decisions:
- issue: Istilah kekerabatan maskulin בְּנֵי יִשְׂרָאֵל
  choice: anak-anak lelaki Israel
  alternative: orang Israel; keturunan Israel
  rationale: Konteks langsung berbicara tentang nama putra-putra Israel sebagai leluhur kedua belas suku. Bentuk maskulin dan hubungan genealogis dipertahankan, sementara catatan menjelaskan cakupan representatifnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada luhur. Bentuk perintah 'ukirlah' dan 'buatlah' menyampaikan konstruksi perintah Ibrani secara langsung. Istilah teknis dibuat cukup jelas bagi pembaca umum tanpa menambahkan rincian teknik perhiasan yang tidak pasti.
