  text: 'Dan baris keempat: beril[a], oniks, dan yaspis; semuanya harus dipasang dalam tatahan emas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Identifikasi tepat beberapa batu permata pada tutup dada imam besar tidak diketahui dengan pasti. Padanan tradisional untuk תַּרְשִׁישׁ ialah “beril” dan untuk שֹׁהַם ialah “oniks”, tetapi identifikasi lain juga telah diusulkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַטּוּר הָרְבִיעִי
  choice: Dan baris yang keempat
  rationale: Dalam konteks daftar batu pada tutup dada, טוּר menunjuk pada satu baris batu; bentuk ordinal diterjemahkan secara langsung.
- source_word: תַּרְשִׁישׁ
  choice: beril
  rationale: Jenis batu kuno ini tidak dapat diidentifikasi dengan pasti. 'Beril' mempertahankan padanan tradisional yang dikenal tanpa meniadakan ketidakpastian, yang dijelaskan dalam catatan kaki.
- source_word: וְשֹׁהַם
  choice: oniks
  rationale: Identifikasi mineralnya diperdebatkan, tetapi 'oniks' merupakan padanan tradisional yang dikenal dalam konteks perlengkapan Kemah Suci.
- source_word: וְיָשְׁפֵה
  choice: yaspis
  rationale: '''Yaspis'' adalah nama batu permata yang lazim dalam bahasa Indonesia dan merupakan padanan umum bagi istilah Ibrani ini.'
- source_word: מְשֻׁבָּצִים זָהָב יִהְיוּ בְּמִלּוּאֹתָם
  choice: Batu-batu itu harus dipasang pada tatahan emas
  rationale: Bentuk pasif dan daya preskriptif יִהְיוּ disampaikan dengan 'harus dipasang'. 'Tatahan emas' mengungkapkan dudukan atau bingkai emas tempat batu-batu itu dipasang secara alami dalam bahasa Indonesia.
