base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/036.yaml
  text: 'And you shall make a plate of pure gold[a], and engrave on it, like the engravings of a seal: ‘Holy to Yahweh.’'
translation:
  language: id
  text: 'Buatlah sebuah lempeng dari emas murni dan ukirlah pada lempeng itu, seperti ukiran pada meterai: “Kudus bagi Yahweh.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kekudusan bagi Yahweh.”
    reason: Alternatif leksikal yang mempertahankan kemungkinan bahwa קֹדֶשׁ dipahami sebagai nomina abstrak.
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Haruslah engkau membuat
  rationale: Bentuk verba dengan waw melanjutkan rangkaian petunjuk pembuatan pakaian imam. Ungkapan ini mempertahankan daya perintah sekaligus urutan wacananya dalam bahasa Indonesia yang wajar.
- source_word: צִּיץ
  choice: lempeng
  rationale: Walaupun kata ini di tempat lain dapat berarti bunga atau kuntum, dalam konteks ini yang dimaksud ialah perhiasan emas pada serban imam besar. “Lempeng” jelas menggambarkan benda logam tersebut tanpa menambahkan bentuk yang tidak dinyatakan.
- source_word: זָהָב טָהוֹר
  choice: dari emas murni
  rationale: Frasa ini menyatakan bahan dan mutunya; “dari emas murni” merupakan padanan Indonesia yang alami dan tepat.
- source_word: וּפִתַּחְתָּ עָלָיו
  choice: dan mengukir padanya
  rationale: Dalam konteks pengerjaan logam, verba ini menunjuk pada pembuatan tulisan dengan cara mengukir. “Padanya” mempertahankan rujukan kepada lempeng itu.
- source_word: פִּתּוּחֵי חֹתָם
  choice: seperti ukiran meterai
  rationale: Frasa ini menerangkan corak atau cara pengukiran, yakni seperti tulisan yang diukir pada meterai. Bentuk tunggal kolektif “ukiran” terdengar alami dalam bahasa Indonesia meskipun nomina Ibraninya berbentuk jamak.
- source_word: קֹדֶשׁ לַיהוָה
  choice: Kudus bagi Yahweh
  rationale: Rumusan singkat ini cocok sebagai inskripsi dan mempertahankan kemungkinan nuansa sifat atau peruntukan. Alternatif nominal “Kekudusan bagi Yahweh” dicantumkan dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi tanpa menggantinya dengan gelar atau memilih vokalisasi alternatif.
- issue: Makna inskripsi קֹדֶשׁ לַיהוָה
  choice: Kudus bagi Yahweh
  alternative: Kekudusan bagi Yahweh
  rationale: קֹדֶשׁ dapat berfungsi dalam rumusan dedikatif yang ringkas dan dapat diungkapkan dengan “Kudus” atau nomina “Kekudusan”. Teks utama mempertahankan keringkasan inskripsi, sedangkan kemungkinan nominal dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina “engkau” mempertahankan sapaan orang kedua tunggal kepada Musa. Tanda baca menampilkan frasa terakhir sebagai tulisan yang harus diukir.
