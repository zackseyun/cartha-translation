  terminology: Istilah bahan dan warna dipakai secara konsisten. "Merah tua" adalah padanan Indonesia yang mapan untuk bahan merah/kirmizi dalam konteks ini; catatan kaki dengan tepat mempertahankan idiom Ibrani serta asal zat warnanya. Catatan pada "benang biru" secara memadai memberi ruang bagi rentang makna bahan celupan tersebut.
