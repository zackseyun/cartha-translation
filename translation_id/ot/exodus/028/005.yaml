base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/005.yaml
  text: And they shall take the gold[a], and the blue, and the purple, and the scarlet yarn[b], and the fine linen.
translation:
  language: id
  text: Mereka harus mengambil emas, benang biru[a], benang ungu, benang merah tua[b], dan lenan halus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini dapat menunjuk bahan tekstil berwarna biru atau biru-ungu, bukan hanya warna secara abstrak.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “merah tua dari ulat,” yaitu bahan berwarna merah yang zat warnanya berasal dari serangga.
    reason: cultural_note
lexical_decisions:
- source_word: וְהֵם
  choice: Mereka
  rationale: Pronomina mandiri Ibrani menyatakan subjek secara eksplisit dan memberi sedikit penegasan; bahasa Indonesia alami cukup memakai “mereka” tanpa menambahkan penekanan yang berlebihan.
- source_word: יִקְחוּ
  choice: harus mengambil
  rationale: Bentuk imperfek berfungsi sebagai instruksi dalam rangkaian perintah tentang pembuatan pakaian imam; “harus” menyampaikan daya direktif dengan wajar dalam bahasa Indonesia modern.
- source_word: הַזָּהָב
  choice: emas
  rationale: Dalam daftar bahan, bahasa Indonesia tidak memerlukan padanan eksplisit bagi artikel Ibrani; “emas” secara alami menunjuk bahan yang telah ditentukan oleh konteks.
- source_word: הַתְּכֵלֶת
  choice: benang biru
  rationale: Istilah ini menunjuk bahan tekstil yang dicelup biru atau biru-ungu, bukan semata-mata warna abstrak. “Benang biru” sesuai dengan konteks pembuatan pakaian, sementara rentang warnanya dicatat dalam catatan kaki.
- source_word: הָאַרְגָּמָן
  choice: benang ungu
  rationale: Istilah ini menunjuk bahan tekstil berwarna ungu. Penambahan “benang” memperjelas bahwa yang dimaksud ialah bahan untuk membuat pakaian, bukan warna abstrak.
- source_word: תּוֹלַעַת הַשָּׁנִי
  choice: benang merah tua
  rationale: Ungkapan harfiah yang berkaitan dengan zat warna dari serangga menunjuk bahan tekstil merah menyala atau merah tua. Pilihan ini alami bagi pembaca Indonesia dan rincian idiomnya dipertahankan dalam catatan kaki.
- source_word: הַשֵּׁשׁ
  choice: lenan halus
  rationale: Dalam konteks Kemah Suci, istilah ini menunjuk kain lenan bermutu halus; “lenan halus” mempertahankan jenis bahan dan kualitasnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Daftar bahan dibuat konsisten dengan memakai “benang” pada bahan-bahan berwarna, sedangkan emas dan lenan dipertahankan sebagai nama bahan. Konjungsi pembuka Ibrani tidak diterjemahkan secara mekanis karena ayat ini alami sebagai kelanjutan langsung dalam bahasa Indonesia.
