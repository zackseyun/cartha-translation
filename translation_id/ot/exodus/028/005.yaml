  source_fidelity: 'Teks Indonesia dengan setia mencerminkan daftar bahan dalam Ibrani: emas, bahan tekstil biru (tekelet), ungu (argaman), merah tua/kirmizi (tola''at hasyani), dan lenan halus (syesh). "Mereka harus mengambil" secara wajar menyampaikan fungsi direktif imperfek dalam konteks instruksi. Penggunaan "benang" untuk tiga bahan berwarna merupakan penjelasan kontekstual yang masih aman, karena istilah-istilah Ibrani tersebut menunjuk bahan tekstil celupan.'
