    issue: Sufiks posesif ‘his ephod’ tidak dinyatakan secara langsung.
    rationale: ‘Efod itu’ dapat merujuk pada efod yang telah disebut dalam konteks, tetapi אֲפֻדָּתוֹ secara eksplisit berarti ‘efodnya’; bentuk itu dapat dipertahankan tanpa mengurangi kelancaran bahasa Indonesia.
  - severity: medium
    issue: ‘Merah tua’ terlalu luas untuk תוֹלַעַת שָׁנִי.
    rationale: Istilah tersebut menunjuk bahan berwarna scarlet/crimson. ‘Kirmizi’ atau ‘merah kirmizi’ lebih tepat dan lazim dalam register Alkitab Indonesia.
  - severity: low
