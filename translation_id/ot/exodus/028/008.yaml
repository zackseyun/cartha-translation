revisions:
- from: Sabuk tenunan terampil pada efod itu[a] harus dibuat dengan cara yang sama dan menyatu dengannya, dari emas, benang biru, ungu, dan merah tua[b], serta linen halus yang dipintal.
  to: 'Sabuk tenunan yang dikerjakan dengan terampil pada efodnya[a], yang terpasang padanya, harus dibuat dengan cara yang sama dan menyatu dengan efod itu: dari emas, benang biru, ungu, dan merah kirmizi[b], serta linen halus yang dipintal.'
  rationale: Revisi memperbaiki ketepatan leksikal dan kelancaran tanpa menambah rincian konstruksi yang tidak dinyatakan sumber. ‘Harus dibuat dengan cara yang sama’ mencerminkan כְּמַעֲשֵׂהוּ, sedangkan ‘menyatu dengan efod itu’ menyampaikan daya tekan מִמֶּנּוּ יִהְיֶה. Catatan a mempertahankan kehati-hatian terhadap rujukan pronominal.
