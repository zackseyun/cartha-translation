base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/008.yaml
  text: 'And the skillfully woven band of his ephod[a], which is on it, shall be like its workmanship, of one piece with it: gold, blue, and purple, and scarlet yarn[b], and fine twisted linen.'
translation:
  language: id
  text: 'Sabuk tenunan yang dikerjakan dengan terampil pada efodnya[a], yang terpasang padanya, harus dibuat dengan cara yang sama dan menyatu dengan efod itu: dari emas, benang biru, ungu, dan merah kirmizi[b], serta linen halus yang dipintal.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sabuk tenun yang dikerjakan dengan terampil pada efodnya.” Secara harfiah, frasa berikutnya berbunyi “yang ada padanya”; dalam konteks ini, rujukannya paling mungkin efod.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani untuk “biru, ungu, dan merah kirmizi” menunjuk pada bahan tekstil berwarna yang digunakan untuk Kemah Suci dan pakaian imam.
    reason: cultural_note
lexical_decisions:
- source_word: חֵשֶׁב אֲפֻדָּתוֹ
  choice: sabuk tenunan terampil pada efod itu
  rationale: Dalam konteks pakaian imam, חֵשֶׁב menunjuk pada komponen tenunan yang berfungsi sebagai sabuk atau pengikat. Ungkapan ini mempertahankan unsur tekstil dan keterampilan pembuatannya; bentuk אֲפֻדָּתוֹ dipahami sebagai efod yang sedang dibicarakan.
- source_word: אֲשֶׁר עָלָיו
  choice: pada efod itu
  rationale: Akhiran pronominal paling wajar merujuk kepada efod sebagai anteseden terdekat. Pengulangan nomina dalam bahasa Indonesia menghindari ketidakjelasan rujukan.
- source_word: כְּמַעֲשֵׂהוּ מִמֶּנּוּ יִהְיֶה
  choice: harus dibuat dengan cara yang sama dan menyatu dengannya
  rationale: כְּמַעֲשֵׂהוּ menyatakan kesesuaian cara pengerjaan, sedangkan מִמֶּנּוּ יִהְיֶה secara harfiah berarti 'darinya itu harus ada/jadi' dan dalam konteks ini menunjukkan kesatuan integral dengan efod. Terjemahan mempertahankan kedua gagasan tanpa meleburkan yang pertama ke dalam yang kedua.
- source_word: זָהָב
  choice: emas
  rationale: Padanan langsung untuk bahan yang disebutkan.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: benang biru, ungu, dan merah tua
  rationale: Istilah-istilah warna ini dalam konteks Kemah Suci menunjuk pada bahan tekstil yang diwarnai. Kata 'benang' dibuat eksplisit sekali untuk seluruh rangkaian agar alami dalam bahasa Indonesia.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: linen halus yang dipintal
  rationale: שֵׁשׁ berarti linen halus dan מָשְׁזָר menunjukkan benang yang dipilin atau dipintal; padanan ini mempertahankan kedua unsur tersebut.
