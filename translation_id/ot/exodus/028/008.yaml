  register: Bahasa Indonesia baku modern dengan gaya bermartabat dan mudah dipahami. Istilah teknis 'efod' dipertahankan karena merupakan nama khusus pakaian imam. Struktur kalimat dibuat alami sambil menjaga perbedaan antara kesamaan pengerjaan dan kesatuan sabuk dengan efod.
