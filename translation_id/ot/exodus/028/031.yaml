  text: וְ/עָשִׂ֛יתָ אֶת מְעִ֥יל הָ/אֵפ֖וֹד כְּלִ֥יל תְּכֵֽלֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/031.yaml
  text: You shall make the robe of the ephod entirely of blue[a][b].
translation:
  language: id
  text: Haruslah engkau membuat jubah efod itu seluruhnya dari kain biru[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semuanya biru,” yang berarti bahwa seluruh jubah itu dibuat dari bahan berwarna biru.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani yang diterjemahkan “biru” dapat menunjuk pada bahan mahal yang dicelup dalam rentang warna biru hingga biru-ungu.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Haruslah engkau membuat
  rationale: Bentuk perfektum Qal dengan waw dalam rangkaian petunjuk berfungsi sebagai perintah. Ungkapan ini mempertahankan nada instruksional yang tegas dan wajar dalam bahasa Indonesia.
- source_word: מְעִיל
  choice: jubah
  rationale: Kata ini menunjuk pada pakaian panjang imam; 'jubah' merupakan padanan modern yang jelas dan alami.
- source_word: הָאֵפֹד
  choice: efod
  rationale: Efod adalah istilah teknis bagi pakaian imam. Transliterasi mempertahankan acuannya tanpa memasukkan gambaran yang belum pasti; frasa ini berarti jubah yang berkaitan dengan efod.
- source_word: כְּלִיל
  choice: seluruhnya
  rationale: Kata ini menyatakan keutuhan atau keseluruhan. Secara adverbial, 'seluruhnya' alami untuk menerangkan bahwa jubah itu dibuat sepenuhnya dari bahan berwarna tersebut.
- source_word: תְּכֵלֶת
  choice: kain biru
  rationale: Istilah ini dapat menunjuk pada bahan atau benang mahal yang dicelup dalam rentang biru hingga biru-ungu. Dalam konteks pembuatan jubah, 'kain biru' jelas dan mudah dipahami, sementara nuansa warnanya dijelaskan dalam catatan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'Haruslah engkau' mempertahankan corak perintah ilahi, sedangkan istilah teknis 'efod' dipertahankan. Kata 'kain' ditambahkan secara kontekstual agar hubungan bahan pakaian terdengar alami dalam bahasa Indonesia.
