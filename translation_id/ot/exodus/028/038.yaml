id: EXO.28.38
reference: Exodus 28:38
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָיָה֮ עַל מֵ֣צַח אַהֲרֹן֒ וְ/נָשָׂ֨א אַהֲרֹ֜ן אֶת עֲוֺ֣ן הַ/קֳּדָשִׁ֗ים אֲשֶׁ֤ר יַקְדִּ֨ישׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לְ/כָֽל מַתְּנֹ֖ת קָדְשֵׁי/הֶ֑ם וְ/הָיָ֤ה עַל מִצְח/וֹ֙ תָּמִ֔יד לְ/רָצ֥וֹן לָ/הֶ֖ם לִ/פְנֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/038.yaml
  text: It shall be on Aaron’s forehead[a], and Aaron shall bear the iniquity of the holy things that the sons of Israel consecrate, for all the gifts of their holy things. It shall always be on his forehead[c][b], for acceptance for them before Yahweh.
translation:
  language: id
  text: Lempeng itu harus berada pada dahi Harun. Harun akan menanggung kesalahan[a] yang berkaitan dengan hal-hal kudus yang dikhususkan umat Israel sebagai kudus, dalam segala pemberian kudus mereka. Lempeng itu harus selalu berada pada dahinya, agar mereka diterima[c] di hadapan Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menanggung tanggung jawab atas kesalahan”. Ungkapan Ibrani ini dapat berarti menanggung kesalahan atau tanggung jawab atas kesalahan yang berkaitan dengan persembahan kudus.
    reason: lexical_alternative
  - marker: c
    text: Atau “untuk perkenanan bagi mereka” atau “agar mereka mendapat perkenanan”. Dalam konteks ini, penerimaan umat berkaitan dengan pemberian kudus mereka.
    reason: alternative_reading
lexical_decisions:
- source_word: מֵצַח / מִצְחוֹ
  choice: dahi / dahinya
  rationale: Kata ini menunjuk pada dahi atau bagian depan kepala; “dahi” merupakan padanan Indonesia modern yang paling jelas dan sesuai dengan keterangan letak benda tersebut.
- source_word: נָשָׂא ... עֲוֺן
  choice: menanggung kesalahan
  rationale: Ungkapan imamat ini menyatakan tindakan menanggung kesalahan atau tanggung jawab atas kesalahan. Pilihan ini mempertahankan nuansa hukum dan ibadah tanpa menafsirkan lebih jauh bahwa Harun secara langsung menghapusnya.
- source_word: הַקֳּדָשִׁים
  choice: benda-benda kudus
  rationale: Dalam konteks ibadah ini, bentuk jamak tersebut menunjuk pada benda atau persembahan yang telah dikhususkan sebagai kudus. “Benda-benda kudus” mempertahankan kategori luas dalam teks sumber.
- source_word: יַקְדִּישׁוּ
  choice: dikuduskan
  rationale: Bentuk ini menyatakan bahwa sesuatu dikhususkan atau dipersembahkan sebagai kudus. Bentuk pasif dalam bahasa Indonesia menghasilkan susunan yang alami dengan tetap dekat pada teks Ibrani.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: “Bani Israel” mempertahankan sebutan perjanjian yang secara harfiah berarti anak-anak Israel, tetapi lazim dipahami secara kolektif sebagai umat Israel.
- source_word: לְכָל מַתְּנֹת קָדְשֵׁיהֶם
  choice: dalam segala pemberian kudus mereka
  rationale: Frasa Ibrani ini sukar secara sintaksis. Terjemahan tersebut menjaga hubungan antara pengudusan dan seluruh pemberian kudus mereka tanpa meleburkannya menjadi parafrasa yang terlalu spesifik.
- source_word: תָּמִיד
  choice: selalu
  rationale: Kata ini menyatakan keberadaan yang terus-menerus; “selalu” jelas dan alami dalam bahasa Indonesia modern.
- source_word: לְרָצוֹן לָהֶם
  choice: supaya mereka berkenan
  rationale: Frasa ini menyatakan tujuan atau hasil berupa penerimaan atau perkenanan bagi mereka di hadapan Yahweh. Rumusan ini idiomatis dalam bahasa Indonesia, sementara catatan kaki mempertahankan kemungkinan nuansa alternatif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai “Yahweh”, bukan diganti dengan gelar, untuk mempertahankan nama pribadi dalam teks Ibrani.
theological_decisions:
- issue: Makna Harun menanggung kesalahan benda-benda kudus
  choice: Harun menanggung kesalahan atau tanggung jawab atas kesalahan yang berkaitan dengan benda-benda kudus dalam perannya sebagai imam.
  alternative: Harun secara langsung menghapus dosa benda-benda kudus; atau ia hanya membawa lambang pengingat akan dosa Israel.
  rationale: Ungkapan נָשָׂא עָוֺן dalam teks-teks imamat dapat berarti menanggung kesalahan atau tanggung jawab atasnya. Terjemahan tidak menetapkan teori pendamaian yang melampaui ayat ini.
- issue: Rujukan frasa לְרָצוֹן לָהֶם
  choice: Frasa itu menyatakan bahwa umat memperoleh perkenanan sehubungan dengan pemberian kudus mereka.
  alternative: Frasa itu hanya menunjuk pada diterimanya pemberian-pemberian tersebut.
  rationale: Pronomina “mereka” paling wajar menunjuk pada umat, tetapi konteks tetap menghubungkan perkenanan itu dengan persembahan mereka; terjemahan tidak mempersempit rujukannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat mudah dipahami oleh pembaca umum, sedangkan ungkapan imamat dan ambiguitas mengenai kesalahan serta perkenanan tetap dipertahankan. “Benda itu” merujuk pada lempeng emas yang disebut dalam konteks sebelumnya.
