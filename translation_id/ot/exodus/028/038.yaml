  source_fidelity: Revisi diperlukan terutama pada frasa penutup. לְרָצוֹן לָהֶם menyatakan penerimaan/perkenanan bagi mereka di hadapan Yahweh, bukan bahwa mereka sendiri 'berkenan' dalam arti merasa senang atau bersedia. Frasa tentang Harun menanggung kesalahan yang berkaitan dengan hal-hal kudus dipertahankan tanpa menambahkan teori pendamaian.
  naturalness: “Agar mereka diterima” adalah bahasa Indonesia baku yang jelas. “Lempeng itu” lebih spesifik dan alami daripada “Benda itu” karena merujuk kepada lempeng emas yang menjadi anteseden langsung dalam konteks sebelumnya. “Umat Israel” lebih lazim dalam bahasa Indonesia modern daripada “bani Israel” dan tetap menyampaikan rujukan kolektif.
  terminology: “Lempeng,” “dahi,” “menanggung kesalahan,” “hal-hal kudus,” “dikhususkan sebagai kudus,” dan “Yahweh” mempertahankan register ibadah serta istilah penting sumber. “Hal-hal kudus” tidak membatasi הַקֳּדָשִׁים hanya pada benda fisik, sementara catatan kaki menjelaskan kaitannya dengan persembahan.
