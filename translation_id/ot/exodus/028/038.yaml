  - severity: low
    issue: “Benda itu” terlalu umum bagi anteseden lempeng emas.
    rationale: Walaupun rujukannya dapat dipahami dari konteks, “lempeng itu” memberikan kesinambungan leksikal yang lebih tepat tanpa menambah makna.
  - severity: low
