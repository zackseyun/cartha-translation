revisions:
- from: Benda itu harus berada pada dahi Harun. Harun akan menanggung kesalahan[a] yang berkaitan dengan benda-benda kudus yang dikuduskan bani Israel[b] dalam segala pemberian kudus mereka. Benda itu harus selalu berada pada dahinya, supaya mereka berkenan[c] di hadapan Yahweh.
  to: Lempeng itu harus berada pada dahi Harun. Harun akan menanggung kesalahan[a] yang berkaitan dengan hal-hal kudus yang dikhususkan umat Israel sebagai kudus, dalam segala pemberian kudus mereka. Lempeng itu harus selalu berada pada dahinya, agar mereka diterima[c] di hadapan Yahweh.
  rationale: Revisi membetulkan makna frasa penerimaan pada akhir ayat, memperjelas rujukan lempeng tanpa memperkenalkan informasi baru ke dalam ayat, dan menggunakan diksi Indonesia modern. Ambiguitas sintaktis dan teologis seputar “kesalahan hal-hal kudus” serta kaitan penerimaan umat dengan persembahan mereka tetap dipertahankan. Catatan b dipertahankan sebagai catatan budaya, walaupun tidak diperlukan oleh teks yang telah memakai “umat Israel,” untuk mendokumentasikan bentuk harfiah sumber.
