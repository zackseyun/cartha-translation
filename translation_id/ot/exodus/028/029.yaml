revisions:
- from: Harun harus membawa[a] nama-nama anak Israel[c] pada tutup dada penghakiman[b], di atas jantungnya, ketika ia masuk ke tempat kudus, sebagai tanda pengingat[d] di hadapan Yahweh senantiasa.
  to: Harun akan membawa[a] nama-nama anak-anak Israel[c] dalam tutup dada penghakiman[b] di atas hatinya ketika ia masuk ke tempat kudus, sebagai peringatan[d] di hadapan Yahweh senantiasa.
  rationale: Revisi mengganti modalitas yang terlalu kuat dengan bentuk futurum, memulihkan bentuk kolektif-jamak yang alami bagi “anak-anak Israel,” memakai “hati” sebagai padanan idiomatis untuk לֵב, dan menerjemahkan לְזִכָּרוֹן sebagai “peringatan” tanpa menambahkan unsur “tanda” ke teks utama. Istilah kultis “tutup dada penghakiman” dan alternatifnya dipertahankan agar ambiguitas מִשְׁפָּט tetap terbuka. Semua penanda catatan kaki dipertahankan dan ditempatkan pada unsur yang diterangkan.
