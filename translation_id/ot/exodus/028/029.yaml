review_pass:
  verdict: revise
  source_fidelity: Draf pada umumnya mengikuti susunan dan unsur-unsur Ibrani dengan baik, termasuk nama-nama, perlengkapan dada, masuk ke tempat kudus, fungsi memorial, dan Yahweh. Namun, “harus membawa” menambah nuansa kewajiban yang tidak perlu pada bentuk Ibrani yang dalam konteks ini lebih baik diterjemahkan sebagai masa depan, dan “tanda pengingat” mempersempit/menambah unsur “tanda” yang tidak ada dalam לְזִכָּרוֹן.
  naturalness: “Anak Israel” tidak alami sebagai ungkapan kolektif dalam bahasa Indonesia modern, dan “pada tutup dada ... di atas jantungnya” terasa kaku serta kurang sesuai dengan idiom Indonesia. “Anak-anak Israel,” “dalam tutup dada ... di atas hatinya,” dan “sebagai peringatan” lebih alami tanpa mengurangi ketelitian.
  terminology: “Tutup dada penghakiman” dapat dipertahankan sebagai gelar kultis formal yang tidak menyelesaikan makna מִשְׁפָּט secara berlebihan. “Hati,” bukan “jantung,” merupakan padanan idiomatis dan semantis bagi לֵב dalam konteks ini. Nama ilahi “Yahweh” konsisten dengan kebijakan proyek.
  issues:
  - severity: medium
    issue: “Harus membawa” untuk וְנָשָׂא
    rationale: “Harus” menyatakan kewajiban secara eksplisit, sedangkan bentuk verbal Ibrani di sini secara wajar menyatakan tindakan masa depan Aaron. “Akan membawa” mempertahankan daya futurum tanpa penambahan modalitas.
  - severity: medium
    issue: “anak Israel” untuk בְּנֵי יִשְׂרָאֵל
    rationale: Bentuk tunggal tanpa pengulangan tidak lazim untuk ungkapan genealogis kolektif ini dalam bahasa Indonesia dan dapat terdengar seolah-olah hanya satu anak. “Anak-anak Israel” mencerminkan bentuk jamak sumber dan tetap genealogis.
  - severity: medium
    issue: “tanda pengingat” untuk לְזִכָּרוֹן
    rationale: Kata “tanda” tidak dinyatakan dalam teks sumber, sedangkan “pengingat” kurang tepat untuk nomina memorial dalam ragam ayat ini. “Sebagai peringatan” menyampaikan fungsi memorial sambil membiarkan subjek tindakan mengingat tetap tidak ditegaskan, seperti dalam Ibrani.
  - severity: low
    issue: “jantungnya” dan konstruksi lokasi
    rationale: לֵב biasanya dipadankan “hati” dalam bahasa Indonesia, termasuk bagi letak simbolis pada pakaian. “Dalam ... di atas hatinya” lebih lancar dan dekat dengan relasi spasial Ibrani.
