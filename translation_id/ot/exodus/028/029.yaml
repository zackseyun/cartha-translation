  text: וְ/נָשָׂ֣א אַ֠הֲרֹן אֶת שְׁמ֨וֹת בְּנֵֽי יִשְׂרָאֵ֜ל בְּ/חֹ֧שֶׁן הַ/מִּשְׁפָּ֛ט עַל לִבּ֖/וֹ בְּ/בֹא֣/וֹ אֶל הַ/קֹּ֑דֶשׁ לְ/זִכָּרֹ֥ן לִ/פְנֵֽי יְהוָ֖ה תָּמִֽיד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/029.yaml
  text: Aaron shall carry the names of the sons of Israel in the breastpiece of judgment over his heart when he goes into the Holy Place[d][c][b][a], for a memorial before Yahweh continually.
translation:
  language: id
  text: Harun akan membawa[a] nama-nama anak-anak Israel[c] dalam tutup dada penghakiman[b] di atas hatinya ketika ia masuk ke tempat kudus, sebagai peringatan[d] di hadapan Yahweh senantiasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menanggung.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “tutup dada keputusan.” Sebutan Ibrani ini menghubungkan tutup dada imam dengan penghakiman atau keputusan di hadapan Allah.'
    reason: alternative_reading
  - marker: c
    text: 'Secara harfiah: “anak-anak Israel,” yaitu keturunan Israel yang diwakili oleh suku-suku mereka.'
    reason: lexical_alternative
  - marker: d
    text: 'Atau: “sebagai tanda peringatan.” Ungkapan Ibrani menyatakan fungsi memorial di hadapan Yahweh.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשָׂא
  choice: harus membawa
  rationale: נשׂא berarti membawa atau menanggung. “Membawa” mempertahankan gambaran konkret bahwa Harun mengenakan dan membawa nama-nama itu pada dirinya dalam pelayanan imam.
- source_word: שְׁמוֹת
  choice: nama-nama
  rationale: Bentuk jamak diterjemahkan langsung karena yang dimaksud ialah nama-nama yang diukir pada batu-batu tutup dada.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: anak Israel
  rationale: Ungkapan genealogis ini secara harfiah berarti anak-anak laki-laki atau keturunan Israel dan dalam konteks ini menunjuk kepada suku-suku yang berasal darinya. Bentuk ringkas “anak Israel” mempertahankan corak genealogis tanpa menyamakannya begitu saja dengan seluruh orang Israel.
- source_word: בְּחֹשֶׁן הַמִּשְׁפָּט
  choice: pada tutup dada penghakiman
  rationale: חֹשֶׁן ialah perlengkapan imam yang dikenakan pada dada. מִשְׁפָּט dapat menyatakan penghakiman, keadilan, atau keputusan; terjemahan utama mempertahankan sebutan formalnya, sedangkan kemungkinan “keputusan” dicatat dalam catatan kaki.
- source_word: עַל לִבּוֹ
  choice: di atas jantungnya
  rationale: Terjemahan ini mempertahankan letak fisik tutup dada sekaligus gambaran simbolis yang dinyatakan teks.
- source_word: בְּבֹאוֹ אֶל הַקֹּדֶשׁ
  choice: ketika ia masuk ke tempat kudus
  rationale: Infinitif dengan בְּ menyatakan waktu, sedangkan הַקֹּדֶשׁ dalam konteks Kemah Suci menunjuk kepada ruang kudus.
- source_word: לְזִכָּרוֹן
  choice: sebagai tanda pengingat
  rationale: Ungkapan ini menyatakan fungsi memorial di hadapan Allah. “Tanda pengingat” alami dalam bahasa Indonesia dan tetap membuka siapa yang secara khusus diingatkan oleh tanda itu.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Ini merupakan padanan alami bagi idiom yang berarti berada di depan atau dalam hadirat Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: תָּמִיד
  choice: senantiasa
  rationale: Kata ini menyatakan kesinambungan atau keteraturan yang tetap dalam pelayanan ibadah; “senantiasa” cocok dengan ragam bahasa yang bermartabat.
theological_decisions:
- issue: Makna gelar kultis חֹשֶׁן הַמִּשְׁפָּט
  choice: tutup dada penghakiman
  alternative: tutup dada keputusan
  rationale: Konstruksi Ibrani tidak menjelaskan secara sempit apakah מִשְׁפָּט terutama menunjuk kepada penghakiman, keputusan ilahi, atau fungsi hukum. Terjemahan utama dan catatan kaki mempertahankan rentang ini.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: anak Israel
  alternative: keturunan Israel; suku-suku Israel
  rationale: Ungkapan sumber bersifat genealogis, tetapi dalam konteks nama-nama pada tutup dada rujukannya adalah para leluhur suku dan suku-suku yang mereka wakili. Terjemahan tidak meratakan ungkapan itu menjadi sekadar “orang Israel”.
- issue: Fungsi לְזִכָּרוֹן di hadapan Yahweh
  choice: sebagai tanda pengingat di hadapan Yahweh
  alternative: sebagai peringatan di hadapan Yahweh
  rationale: Teks menyatakan fungsi memorial tanpa secara eksplisit menentukan apakah penekanannya pada Allah yang mengingat Israel, pada representasi Israel oleh imam, atau keduanya. Rumusan ini mempertahankan keterbukaan tersebut.
translation_notes:
  register: Bahasa Indonesia modern yang formal dan mudah dipahami. Struktur ayat dipertahankan sebagai satu kalimat, istilah perlengkapan imam diterjemahkan secara cukup formal, dan nama ilahi ditulis “Yahweh”. Semua penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskannya.
