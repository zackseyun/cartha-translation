base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/003.yaml
  text: And you shall speak to all the wise of heart[a], whom I have filled with a spirit of wisdom, and they shall make Aaron’s garments to consecrate him[c][b], for him to serve me as priest.
translation:
  language: id
  text: Engkau harus berbicara kepada semua orang yang bijaksana hatinya[a], yang telah Kupenuhi dengan roh hikmat[b]. Mereka harus membuat pakaian Harun untuk menguduskannya untuk melayani-Ku sebagai imam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang-orang yang bijaksana hati”; ungkapan Ibrani bagi orang yang dikaruniai kecakapan dan pengertian.
    reason: lexical_alternative
  - marker: b
    text: Atau “Roh hikmat”. Bahasa Ibrani dapat menunjuk pada roh atau pembawaan hikmat yang Allah karuniakan, tanpa menentukan rujukannya secara lebih khusus.
    reason: alternative_reading
lexical_decisions:
- source_word: תְּדַבֵּר
  choice: harus berbicara
  rationale: Bentuk imperfek Piel dalam konteks perintah menyatakan kewajiban; ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: חַכְמֵי לֵב
  choice: orang yang bijaksana hatinya
  rationale: Mempertahankan unsur 'bijaksana' dan metafora 'hati', sedangkan catatan menjelaskan bahwa ungkapan itu mencakup kecakapan dan pengertian.
- source_word: מִלֵּאתִיו רוּחַ חָכְמָה
  choice: yang telah Kupenuhi dengan roh hikmat
  rationale: Mempertahankan gambaran verba 'memenuhi' serta ketaktertentuan רוּחַ; frasa ini tidak dipersempit menjadi sebutan eksplisit bagi Roh Kudus.
- source_word: בִּגְדֵי אַהֲרֹן
  choice: pakaian Harun
  rationale: Menerjemahkan konstruksi kepunyaan secara langsung tanpa menambahkan 'keimaman', yang tidak dinyatakan dalam frasa ini.
- source_word: לְקַדְּשׁוֹ
  choice: untuk menguduskannya
  rationale: Dalam konteks imamat, verba ini berarti memisahkan atau mengkhususkan bagi tugas kudus; 'menguduskan' mempertahankan hubungan leksikal dengan kekudusan.
- source_word: לְכַהֲנוֹ לִי
  choice: agar ia melayani-Ku sebagai imam
  rationale: Menampilkan tujuan konsekrasi dan makna verbal כהן, yaitu bertugas atau melayani sebagai imam bagi Allah.
- source_word: וְעָשׂוּ
  choice: Mereka harus membuat
  rationale: Dalam rangkaian instruksi, bentuk ini melanjutkan daya perintah; kalimat baru menghasilkan bahasa Indonesia yang jelas dan alami.
theological_decisions:
- issue: Apakah רוּחַ חָכְמָה merupakan sebutan langsung bagi Roh Kudus
  choice: roh hikmat
  alternative: Roh hikmat
  rationale: Teks Ibrani tidak memakai kata sandang dan dapat menunjuk pada roh atau pembawaan hikmat yang dikaruniakan Allah. Huruf kecil mempertahankan ambiguitas tanpa menolak kemungkinan karya Roh Allah.
- issue: Hubungan antara pengudusan Harun dan pelayanannya sebagai imam
  choice: untuk menguduskannya agar ia melayani-Ku sebagai imam
  alternative: untuk menguduskannya, untuk melayani-Ku sebagai imam
  rationale: 'Dua infinitif berturut-turut paling wajar dipahami sebagai tujuan yang berkaitan erat: Harun dikuduskan dengan tujuan melayani Allah sebagai imam, tanpa meleburkan kedua gagasan tersebut.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan tunggal kepada Musa diterjemahkan dengan 'kamu'; kapitalisasi pada 'Kupenuhi' dan 'melayani-Ku' menandai pembicara ilahi. Struktur dipecah menjadi dua kalimat agar jelas tanpa mengubah urutan gagasan sumber.
