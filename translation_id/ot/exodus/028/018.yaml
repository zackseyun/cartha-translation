  text: 'dan pada baris kedua: batu pirus[a], batu safir, dan intan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Identitas tepat beberapa batu mulia kuno tidak pasti. נֹפֶךְ mungkin berarti “zamrud” atau “karbunkel”; סַפִּיר mungkin menunjuk pada “lapis lazuli”; dan יָהֲלֹם mungkin berarti “yakut kuning” atau “yaspis”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/טּוּר
  choice: dan baris
  rationale: Dalam konteks susunan batu pada tutup dada, טוּר menunjuk pada satu baris batu. Konjungsi וְ diterjemahkan sebagai “dan” untuk mempertahankan kesinambungan daftar.
- source_word: הַ/שֵּׁנִי
  choice: yang kedua
  rationale: Kata bilangan bertingkat ini menerangkan “baris”; bentuk “yang kedua” alami dan jelas dalam bahasa Indonesia.
- source_word: נֹפֶךְ
  choice: batu pirus
  rationale: Identitas batu kuno ini tidak pasti. “Batu pirus” merupakan padanan modern yang masuk akal, sedangkan kemungkinan lain dicatat dalam catatan kaki.
- source_word: סַפִּיר
  choice: batu safir
  rationale: Padanan tradisional “batu safir” dipertahankan demi keterbacaan, meskipun istilah Ibraninya mungkin menunjuk pada lapis lazuli; ketidakpastian ini dicatat.
- source_word: וְ/יָהֲלֹם
  choice: dan intan
  rationale: “Intan” adalah padanan tradisional yang ringkas dan wajar dalam daftar batu mulia, tetapi identifikasi tepat istilah kunonya tidak pasti dan alternatifnya dicantumkan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata “batu” ditambahkan pada nama pirus dan safir untuk memperjelas bahwa yang dimaksud ialah batu mulia; “intan” sudah lazim berdiri sendiri. Struktur daftar dan ambiguitas leksikal teks sumber dipertahankan.
