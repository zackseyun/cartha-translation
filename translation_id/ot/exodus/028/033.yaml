  text: You shall make on its hem pomegranates of blue and purple and scarlet yarn[a], all around its hem, with bells of gold between them all around.
translation:
  language: id
  text: Pada kelim jubah itu haruslah kaubuat buah-buah delima dari benang biru, ungu, dan merah tua[a], di sekeliling kelim itu, dengan lonceng-lonceng emas di antara buah-buah delima itu, di sekeliling kelim itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “hiasan-hiasan berbentuk buah delima.” Teks Ibrani secara harfiah berbunyi “buah-buah delima.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: haruslah kaubuat
  rationale: Bentuk perfektum Qal dengan waw dalam rangkaian petunjuk berfungsi sebagai perintah; ungkapan ini alami dan tegas dalam bahasa Indonesia.
- source_word: שׁוּלָיו
  choice: kelim jubah itu / kelimnya
  rationale: Kata ini menunjuk bagian tepi bawah pakaian; 'kelim' merupakan istilah Indonesia yang tepat dan konteks sebelumnya memperjelas bahwa yang dimaksud ialah jubah.
- source_word: רִמֹּנֵי
  choice: buah-buah delima
  rationale: Teks Ibrani secara harfiah menyebut buah delima. Bentuk jamak diungkapkan dengan pengulangan, sementara kemungkinan bahwa ini ornamen berbentuk delima dipertahankan dalam catatan kaki.
- source_word: תְּכֵלֶת וְאַרְגָּמָן וְתוֹלַעַת שָׁנִי
  choice: benang biru, ungu, dan merah tua
  rationale: Ketiga istilah merupakan bahan tekstil berwarna dalam konteks pakaian ibadah. 'Benang' ditambahkan sekali untuk memperjelas bahan tanpa mengulanginya pada setiap warna.
- source_word: סָבִיב
  choice: di sekeliling
  rationale: Menyatakan penempatan yang mengitari seluruh kelim dan dipertahankan pada kedua kemunculannya.
- source_word: וּפַעֲמֹנֵי זָהָב
  choice: dengan lonceng-lonceng emas
  rationale: Menyampaikan unsur tambahan pada kelim secara alami, sambil mempertahankan bentuk jamak dan bahan emas.
- source_word: בְּתוֹכָם
  choice: di antara buah-buah itu
  rationale: Secara harfiah berarti 'di tengah mereka'; dalam susunan hiasan ini menunjuk lonceng yang ditempatkan di antara buah-buah delima.
