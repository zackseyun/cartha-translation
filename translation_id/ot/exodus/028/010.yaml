  source_fidelity: Terjemahan menangkap pembagian enam nama pada masing-masing dari dua batu serta urutan kelahiran dalam כְּתוֹלְדֹתָם. Namun, frasa Ibrani kedua merujuk pada “nama-nama dari keenam orang yang tersisa,” bukan terutama pada “enam orang” itu sendiri.
  naturalness: “Enam dari nama mereka” dapat dipahami, tetapi kurang idiomatis dalam bahasa Indonesia baku. “Enam nama mereka” lebih lancar dalam konteks pembagian dua kelompok nama. “Nama keenam orang yang tersisa” juga lebih jelas dan alami daripada “nama enam orang yang selebihnya.”
  terminology: “Batu yang satu ... batu yang kedua” mempertahankan kontras Ibrani dengan baik. “Urutan kelahiran” adalah pemaknaan kontekstual yang wajar untuk כְּתוֹלְדֹתָם; catatan kaki secara tepat mempertahankan kemungkinan nuansa garis keturunan.
