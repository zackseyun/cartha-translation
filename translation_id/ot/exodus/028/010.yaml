  text: enam nama mereka pada batu yang satu, dan nama keenam orang yang tersisa pada batu yang kedua, menurut urutan kelahiran mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menurut garis keturunan mereka”; ungkapan Ibrani ini dapat menunjuk pada garis keturunan atau pada urutan kelahiran yang berkaitan dengannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁשָּׁה מִשְּׁמֹתָם
  choice: enam dari nama mereka
  rationale: 'Mempertahankan fungsi partitif מִן: enam nama diambil dari keseluruhan nama yang disebut.'
- source_word: עַל הָאֶבֶן הָאֶחָת
  choice: pada batu yang satu
  rationale: Menerjemahkan kontras harfiah antara הָאֶחָת, 'yang satu', dan הַשֵּׁנִית, 'yang kedua', tanpa mengubah yang pertama menjadi bilangan tingkat.
- source_word: הַשִּׁשָּׁה הַנּוֹתָרִים
  choice: enam orang yang selebihnya
  rationale: Kata נוֹתָרִים menunjuk kepada enam yang tersisa; penambahan 'orang' menjadikan rujukannya kepada para pemilik nama jelas dan alami dalam bahasa Indonesia.
- source_word: עַל הָאֶבֶן הַשֵּׁנִית
  choice: pada batu yang kedua
  rationale: Menerjemahkan bilangan tingkat הַשֵּׁנִית secara langsung dan mempertahankan kesejajaran dengan 'batu yang satu'.
- source_word: כְּתוֹלְדֹתָם
  choice: menurut urutan kelahiran mereka
  rationale: Dalam konteks pembagian nama anak-anak Israel, ungkapan ini paling wajar menunjuk pada susunan berdasarkan kelahiran, sambil tetap mengakui bahwa תּוֹלְדוֹת juga dapat bernuansa garis keturunan atau riwayat generasi.
