translation:
  language: id
  text: Haruslah engkau membuat pada tutup dada itu rantai-rantai dari emas murni[a], yang dijalin seperti tali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “rantai-rantai terpilin” atau “rantai-rantai seperti tali”; bahasa Ibrani menggambarkan rantai yang dibuat dengan pola pilinan atau menyerupai tali.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Haruslah engkau membuat
  rationale: Bentuk perfektum Qal dengan waw dalam rangkaian petunjuk berfungsi sebagai perintah; ungkapan ini mempertahankan daya preskriptifnya dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: עַל הַחֹשֶׁן
  choice: pada tutup dada itu
  rationale: Preposisi עַל terutama berarti 'pada/di atas' dan di sini menunjuk pada penempatan atau pemasangan rantai pada tutup dada.
- source_word: שַׁרְשֹׁת
  choice: rantai-rantai
  rationale: Nomina jamak ini menunjuk pada rantai atau rangkaian mata rantai; bentuk ulang menyatakan kejamakan secara jelas.
- source_word: גַּבְלֻת
  choice: pilinan
  rationale: Kata yang langka ini menggambarkan bentuk yang terikat, terjalin, atau terpilin; 'pilinan' menjaga gambaran pembuatannya tanpa menentukan teknik secara berlebihan.
- source_word: מַעֲשֵׂה עֲבֹת
  choice: berupa karya pilinan seperti tali
  rationale: Frasa ini secara harfiah menggambarkan pekerjaan yang menyerupai tali atau tambang; terjemahan ini mempertahankan citra serta cara pembuatannya dalam bahasa Indonesia alami.
- source_word: זָהָב טָהוֹר
  choice: emas murni
  rationale: Padanan baku dan langsung bagi keterangan bahan dalam petunjuk pembuatan Kemah Suci.
