source:
  edition: WLC
  text: וְ/עָשִׂ֜יתָ חֹ֤שֶׁן מִשְׁפָּט֙ מַעֲשֵׂ֣ה חֹשֵׁ֔ב כְּ/מַעֲשֵׂ֥ה אֵפֹ֖ד תַּעֲשֶׂ֑/נּוּ זָ֠הָב תְּכֵ֨לֶת וְ/אַרְגָּמָ֜ן וְ/תוֹלַ֧עַת שָׁנִ֛י וְ/שֵׁ֥שׁ מָשְׁזָ֖ר תַּעֲשֶׂ֥ה אֹתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/015.yaml
  text: 'You shall make a breastpiece of judgment[a], the work of a skillful designer; like the work of the ephod you shall make it: of gold, blue, purple, scarlet yarn[b], and finely twisted linen you shall make it.'
translation:
  language: id
  text: “Haruslah kaubuat penutup dada keputusan[a], karya seorang perancang terampil[b]; buatlah itu seperti pengerjaan efod. Dari emas, benang biru, benang ungu, benang merah kirmizi, dan linen halus yang dipintal, haruslah kaubuat itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “penutup dada penghakiman” atau “penutup dada untuk mengambil keputusan.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “hasil tenunan yang dibuat dengan terampil”; bahasa Ibrani menunjuk pada karya ahli yang dirancang dengan cakap.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹשֶׁן
  choice: penutup dada
  rationale: Istilah ini menunjuk pada perlengkapan upacara yang dikenakan di dada imam besar. ‘Penutup dada’ lebih tepat daripada istilah yang dapat mengesankan baju zirah.
- source_word: מִשְׁפָּט
  choice: keputusan
  rationale: Dalam rangkaian חֹשֶׁן מִשְׁפָּט, kata ini dapat berkaitan dengan penghakiman atau pengambilan keputusan. ‘Keputusan’ mempertahankan kaitan yudisial-orakuler tanpa menentukan mekanismenya.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: karya seorang perancang terampil
  rationale: Frasa ini menggambarkan hasil kerja ahli yang merancang pola secara cakap, bukan sekadar kegiatan menenun biasa.
- source_word: כְּמַעֲשֵׂה אֵפֹד
  choice: seperti efod dibuat
  rationale: Ungkapan perbandingan ini menyatakan bahwa penutup dada harus dibuat dengan jenis atau mutu pengerjaan yang sama seperti efod.
- source_word: אֵפֹד
  choice: efod
  rationale: Istilah teknis untuk pakaian imam tertentu; transliterasi mempertahankan kekhususannya karena tidak ada padanan Indonesia yang singkat dan tepat.
- source_word: זָהָב
  choice: emas
  rationale: Nama bahan yang lugas dalam daftar bahan pembuatan.
- source_word: תְּכֵלֶת
  choice: benang biru
  rationale: Istilah warna atau bahan celupan dalam tekstil Kemah Suci; ‘benang’ dinyatakan agar konteks tekstil jelas.
- source_word: אַרְגָּמָן
  choice: ungu
  rationale: Padanan lazim bagi warna dari bahan celup mewah ini; unsur ‘benang’ dipahami dari susunan daftar.
- source_word: תוֹלַעַת שָׁנִי
  choice: merah kirmizi
  rationale: Ungkapan ini menunjuk pada bahan atau benang berwarna merah menyala; ‘merah kirmizi’ merupakan padanan warna yang jelas dalam bahasa Indonesia modern.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: linen halus yang dipintal
  rationale: Mempertahankan baik mutu bahan linen maupun cara pengerjaan benangnya.
- source_word: תַּעֲשֶׂנּוּ ... תַּעֲשֶׂה אֹתוֹ
  choice: Buatlah itu ... haruslah kaubuat itu
  rationale: Pengulangan verba dipertahankan untuk mencerminkan gaya instruksi Ibrani dan penegasan pada pembuatan benda tersebut.
theological_decisions:
- issue: Fungsi חֹשֶׁן מִשְׁפָּט
  choice: penutup dada keputusan
  alternative: penutup dada penghakiman; penutup dada untuk mengambil keputusan
  rationale: Ayat ini memberi nama yang mengandung nuansa yudisial atau pengambilan keputusan, tetapi tidak menjelaskan mekanisme atau fungsi persisnya. Terjemahan utama tetap ringkas, sedangkan catatan kaki mempertahankan kemungkinan makna lainnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk instruksi ‘haruslah kaubuat’ mempertahankan nada resmi teks hukum-kultis, sedangkan susunan kalimat dipecah agar daftar bahan tetap mudah dipahami. Istilah teknis ‘efod’ dipertahankan.
