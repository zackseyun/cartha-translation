  text: And you shall put it on a cord of blue[a], and it shall be on the turban[b]; it shall be at the front of the turban.
translation:
  language: id
  text: Haruslah engkau menaruhnya pada seutas tali biru[a], dan itu harus berada pada serban; itu harus berada di bagian depan serban[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “benang biru” atau “tali pintal biru”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, frasa Ibrani ini menyatakan penempatan “menghadap bagian depan serban”, yakni pada sisi depannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ אֹתוֹ
  choice: Haruslah engkau memasangnya
  rationale: Kata שׂים berarti menaruh, menempatkan, atau memasang. Dalam konteks mengikat lempeng pada penutup kepala, 'memasangnya' menyampaikan tindakan yang dimaksud secara alami; akhiran -nya merujuk kepada benda yang disebut pada ayat sebelumnya.
- source_word: פְּתִיל
  choice: seutas tali
  rationale: פְּתִיל dapat menunjuk pada tali, benang, atau untaian untuk mengikat. 'Seutas tali' alami dalam bahasa Indonesia dan sesuai dengan fungsi pengikatnya, tanpa memastikan ketebalannya.
- source_word: תְּכֵלֶת
  choice: biru
  rationale: תְּכֵלֶת menunjuk pada warna biru khas dari bahan pewarna mahal yang dipakai dalam perlengkapan Kemah Suci. 'Biru' merupakan padanan yang jelas, sedangkan rona biru-ungu atau nila tidak dapat dipastikan.
- source_word: וְהָיָה עַל הַמִּצְנָפֶת
  choice: dan benda itu harus berada pada serban
  rationale: מִצְנֶפֶת adalah penutup kepala yang dililitkan; 'serban' merupakan istilah Indonesia yang tepat. Frasa 'harus berada' menyampaikan daya instruksional bentuk imperfek dalam konteks ini.
- source_word: אֶל מוּל פְּנֵי הַמִּצְנֶפֶת
  choice: di bagian depan serban
  rationale: Gabungan אֶל מוּל פְּנֵי menyatakan orientasi atau penempatan menghadap sisi depan. 'Di bagian depan serban' memberi petunjuk lokasi yang jelas dan alami, sementara nuansa harfiahnya dicatat dalam catatan kaki.
- source_word: יִהְיֶה
  choice: benda itu harus berada
  rationale: Pengulangan 'harus berada' mempertahankan penegasan Ibrani terhadap lokasi benda tersebut dan menghindari rujukan pronomina yang kurang jelas.
