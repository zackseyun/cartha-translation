base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/039.yaml
  text: You shall weave the tunic in checker work of fine linen[a], and you shall make a turban of fine linen, and you shall make a sash, the work of an embroiderer.
translation:
  language: id
  text: Haruslah engkau menenun tunik dari linen halus dengan pola kotak-kotak[a]. Haruslah engkau membuat serban dari linen halus dan membuat ikat pinggang sebagai karya penyulam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “membuat tunik dari linen halus dengan pola berkotak-kotak.” Kata kerja Ibraninya kemungkinan menunjuk pada pembuatan kain berpola.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁבַּצְתָּ הַכְּתֹנֶת
  choice: menenun tunik ... dengan pola kotak-kotak
  rationale: Dalam konteks pakaian imam, verba שׁבץ kemungkinan menunjuk pada pembuatan kain berpola. Ungkapan ini menyampaikan proses tekstil dan hasil berpola tanpa mengartikannya sekadar sebagai 'memasang'.
- source_word: שֵׁשׁ
  choice: linen halus
  rationale: Dalam konteks Kemah Suci dan pakaian imam, שֵׁשׁ menunjuk pada linen bermutu tinggi; 'linen halus' mempertahankan bahan dan mutunya.
- source_word: מִצְנֶפֶת
  choice: serban
  rationale: Istilah ini menunjuk pada penutup kepala imam yang dililitkan; 'serban' merupakan padanan Indonesia yang jelas dan lazim.
- source_word: אַבְנֵט
  choice: ikat pinggang
  rationale: Istilah ini menunjuk pada kain panjang penghias pinggang dalam pakaian imam. 'Ikat pinggang' mudah dipahami dalam bahasa Indonesia modern, meski bentuknya bukan sabuk kaku.
- source_word: מַעֲשֵׂה רֹקֵם
  choice: sebagai karya penyulam
  rationale: Frasa konstruksi Ibrani menekankan hasil kerja perajin yang membuat hiasan tekstil; padanan ini mempertahankan fokus pada keahlian penyulam.
