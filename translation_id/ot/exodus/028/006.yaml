translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur perintah dibuat lugas; istilah teknis “efod” dipertahankan, sedangkan daftar bahan dirumuskan secara alami tanpa menghapus ketidakjelasan mengenai bentuk emas yang digunakan.
