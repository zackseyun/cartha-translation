  text: וְ/עָשׂ֖וּ אֶת הָ/אֵפֹ֑ד זָ֠הָב תְּכֵ֨לֶת וְ/אַרְגָּמָ֜ן תּוֹלַ֧עַת שָׁנִ֛י וְ/שֵׁ֥שׁ מָשְׁזָ֖ר מַעֲשֵׂ֥ה חֹשֵֽׁב־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/028/006.yaml
  text: And they shall make the ephod of gold[a], blue, and purple, scarlet yarn, and fine twisted linen[b], the work of a skillful designer.
translation:
  language: id
  text: Mereka harus membuat efod itu dari emas[a], benang biru, benang ungu, benang merah kirmizi, dan lenan halus yang dipintal, dengan pengerjaan seorang perancang ahli[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “benang emas”; teks Ibrani hanya menyebut “emas”, tetapi dalam konteks pembuatan ini emas mungkin dikerjakan menjadi atau dipadukan ke dalam kain.
    reason: lexical_alternative
  - marker: b
    text: Atau “pengerjaan seorang perancang” atau “pengerjaan seorang ahli”; ungkapan Ibrani menunjuk pada pengerjaan artistik dan berpola yang memerlukan keahlian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: Mereka harus membuat
  rationale: Bentuk ini berfungsi sebagai perintah dalam rangkaian petunjuk pembuatan. Ungkapan “harus membuat” menyampaikan daya instruktifnya secara wajar dalam bahasa Indonesia modern.
- source_word: הָאֵפֹד
  choice: efod
  rationale: Istilah teknis untuk pakaian ibadah ini tidak memiliki padanan Indonesia yang tepat; transliterasi mempertahankan acuannya tanpa menentukan bentuk pakaian secara berlebihan.
- source_word: זָהָב
  choice: emas
  rationale: Teks Ibrani hanya menyebut “emas”. Dalam konteks ini emas kemungkinan diolah agar dapat dipadukan dengan kain, tetapi kata “benang” tidak dinyatakan pada ayat ini.
- source_word: תְּכֵלֶת וְאַרְגָּמָן תּוֹלַעַת שָׁנִי
  choice: benang biru, ungu, dan merah kirmizi
  rationale: Istilah-istilah warna ini muncul dalam daftar bahan tekstil. “Benang” menjadikan maksud tekstilnya jelas dalam bahasa Indonesia, sedangkan “merah kirmizi” membedakan warna scarlet dari merah biasa.
- source_word: שֵׁשׁ מָשְׁזָר
  choice: lenan halus yang dipintal
  rationale: שֵׁשׁ menunjuk pada lenan halus dan מָשְׁזָר pada sifatnya yang dipintal atau dipilin.
- source_word: מַעֲשֵׂה חֹשֵׁב
  choice: karya seorang perancang ahli
  rationale: Ungkapan ini menunjuk pada pengerjaan artistik yang dirancang dengan keahlian. Pilihan ini tidak mempersempit tekniknya menjadi sulaman saja.
