  text: וַ/יַּעֲמֹ֥ד הָ/עָ֖ם מֵ/רָחֹ֑ק וּ/מֹשֶׁה֙ נִגַּ֣שׁ אֶל הָֽ/עֲרָפֶ֔ל אֲשֶׁר שָׁ֖ם הָ/אֱלֹהִֽים־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/021.yaml
  text: The people stood at a distance[a], and Moses approached the thick darkness where God was.
translation:
  language: id
  text: Bangsa itu berdiri di kejauhan, sedangkan Musa mendekati kegelapan pekat[a] tempat Allah berada.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “awan gelap” atau “kesuraman”. Istilah Ibrani ini dapat menunjuk pada kegelapan tebal yang berkaitan dengan penampakan Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: berdiri
  rationale: Bentuk wayyiqtol dari עמד menyatakan tindakan atau keadaan lampau secara sederhana. “Berdiri” ringkas, alami, dan tidak menambahkan penekanan yang tidak tersurat.
- source_word: הָעָם
  choice: bangsa itu
  rationale: עם berartikel menunjuk kepada seluruh bangsa Israel yang telah hadir dalam konteks Sinai. “Bangsa itu” mempertahankan makna kolektif tanpa menambahkan nama Israel yang tidak muncul dalam ayat ini.
- source_word: מֵרָחֹק
  choice: di kejauhan
  rationale: Gabungan preposisi dan רָחֹק menyatakan jarak secara ruang. “Di kejauhan” merupakan ungkapan Indonesia yang alami dan mempertahankan kontras dengan Musa yang mendekat.
- source_word: נִגַּשׁ
  choice: mendekati
  rationale: נגשׁ berarti datang mendekat atau menghampiri. “Mendekati” jelas dan langsung dalam bahasa Indonesia modern.
- source_word: הָעֲרָפֶל
  choice: kegelapan pekat
  rationale: עֲרָפֶל menunjuk pada kegelapan atau kesuraman yang tebal, khususnya dalam konteks penampakan ilahi. “Kegelapan pekat” mempertahankan ketidakjelasan fisik dan suasana khidmat tanpa menafsirkannya semata-mata sebagai awan.
- source_word: אֲשֶׁר שָׁם הָאֱלֹהִים
  choice: tempat Allah berada
  rationale: Klausa relatif ini menunjukkan lokasi keberadaan Allah. “Tempat Allah berada” menyampaikan fungsi אֲשֶׁר שָׁם secara alami tanpa menambahkan gagasan penjelas seperti “hadir”.
- source_word: הָאֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini אֱלֹהִים jelas menunjuk kepada Allah Israel sebagai satu pribadi ilahi, sehingga bentuk tunggal “Allah” tepat.
theological_decisions:
- issue: Penggambaran penampakan ilahi dalam kegelapan
  choice: Mempertahankan gambaran konkret sebagai “kegelapan pekat”.
  alternative: “awan gelap” atau “kesuraman”
  rationale: Ayat ini mempertahankan ketegangan antara kehadiran Allah dan keadaan yang gelap serta tak tertembus. Terjemahan tidak menguranginya menjadi gejala cuaca semata atau menjelaskannya sebagai simbol belaka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat mempertahankan kontras antara bangsa yang berada jauh dan Musa yang mendekat. Penanda catatan kaki ditempatkan langsung sesudah frasa yang dijelaskannya.
