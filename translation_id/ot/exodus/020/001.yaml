lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu ... mengucapkan
  rationale: Bentuk wayyiqtol melanjutkan narasi; “mengucapkan” secara alami memperkenalkan rangkaian firman yang disampaikan langsung.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Padanan baku dalam bahasa Indonesia untuk אֱלֹהִים ketika menunjuk kepada Allah Israel.
- source_word: כָּל־הַדְּבָרִים הָאֵלֶּה
  choice: semua perkataan ini
  rationale: Menjaga cakupan כָּל dan arti dasar דְּבָרִים sebagai perkataan, tanpa membatasinya menjadi istilah teknis seperti “perintah”.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Infinitif formulaik ini memperkenalkan tuturan langsung; dalam bahasa Indonesia modern, fungsi tersebut paling alami dinyatakan dengan tanda titik dua dan tidak perlu diduplikasi sebagai “demikian”.
