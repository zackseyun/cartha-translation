base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/010.yaml
  text: but the seventh day is a Sabbath to Yahweh your God[a]; you shall not do any work—you, or your son, or your daughter, your male servant, or your female servant, or your livestock[c][b], or the sojourner within your gates.
translation:
  language: id
  text: Namun, hari ketujuh adalah hari Sabat bagi Yahweh, Allahmu; jangan melakukan pekerjaan apa pun—engkau, anak laki-lakimu atau anak perempuanmu, budak laki-lakimu atau budak perempuanmu[a], ternakmu, ataupun pendatang yang tinggal di kota-kotamu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “budak laki-lakimu dan budak perempuanmu”; istilah Ibraninya kadang diterjemahkan “hamba laki-lakimu dan hamba perempuanmu.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “pendatangmu yang ada di dalam gerbang-gerbangmu.” Yang dimaksud ialah orang bukan pribumi yang menetap di kota-kota atau wilayah permukiman Israel.
    reason: idiom_and_lexical_clarification
lexical_decisions:
- source_word: וְיוֹם הַשְּׁבִיעִי
  choice: Namun, hari ketujuh
  rationale: Konjungsi ו dapat berarti “dan”, tetapi dalam konteks ini menandai kontras dengan enam hari untuk bekerja pada ayat sebelumnya; “namun” menyampaikan kontras itu secara alami.
- source_word: שַׁבָּת
  choice: hari Sabat
  rationale: Mempertahankan istilah khusus Sabat, bukan mereduksinya menjadi sekadar “hari istirahat”; penambahan “hari” wajar dalam bahasa Indonesia.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: bagi Yahweh, Allahmu
  rationale: Preposisi ל menyatakan peruntukan atau pengkhususan; “bagi” menunjukkan bahwa hari itu dikhususkan bagi Yahweh.
- source_word: לֹא תַעֲשֶׂה כָל מְלָאכָה
  choice: jangan melakukan pekerjaan apa pun
  rationale: Larangan hukum Ibrani disampaikan secara langsung dan alami; “apa pun” mempertahankan cakupan menyeluruh כָל.
- source_word: עַבְדְּךָ וַאֲמָתְךָ
  choice: budakmu laki-laki atau budakmu perempuan
  rationale: Pasangan istilah ini menunjuk pada status perbudakan dalam rumah tangga. “Budak” menyatakan realitas sosial tersebut secara lebih transparan daripada “hamba” atau “pelayan”.
- source_word: וּבְהֶמְתֶּךָ
  choice: ternakmu
  rationale: בְּהֵמָה secara kolektif menunjuk pada hewan domestik milik rumah tangga; “ternak” tepat dan mudah dipahami.
- source_word: וְגֵרְךָ אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: pendatang yang tinggal di dalam kotamu
  rationale: גֵּר adalah orang bukan pribumi yang menetap di tengah masyarakat Israel. Ungkapan “di dalam gerbangmu” secara idiomatis berarti dalam wilayah permukiman atau kota.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה secara langsung; “Yahweh” mempertahankan nama diri itu, bukan menggantinya dengan gelar.
- issue: Cakupan hukum Sabat atas seisi rumah tangga
  choice: Menyebut anak, budak, ternak, dan pendatang secara eksplisit
  alternative: Meringkasnya sebagai seluruh anggota rumah tangga
  rationale: Daftar lengkap dalam teks menegaskan bahwa larangan bekerja tidak hanya berlaku bagi kepala rumah tangga dan tidak boleh diringkas sehingga kategori sosialnya hilang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk tunggal “engkau/Allahmu” mempertahankan sapaan orang kedua tunggal dalam Ibrani. Tanda pisah memperjelas bahwa seluruh daftar berada di bawah larangan yang sama.
