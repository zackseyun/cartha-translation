translation:
  language: id
  text: Enam hari engkau harus bekerja dan melakukan segala pekerjaanmu,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Selama enam hari engkau harus bekerja.”'
    reason: Frasa Ibrani שֵׁשֶׁת יָמִים dapat diungkapkan secara idiomatis dengan penanda durasi “selama”, meskipun preposisi itu tidak dinyatakan secara eksplisit.
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Enam hari
  rationale: Frasa bilangan konstruktus ini secara langsung menyatakan rentang waktu. “Enam hari” alami dalam bahasa Indonesia dan tidak menambahkan preposisi yang tidak dinyatakan secara eksplisit dalam bahasa Ibrani.
- source_word: תַּעֲבֹד
  choice: engkau harus bekerja
  rationale: Dalam bentuk Qal, עבד dapat berarti bekerja, melayani, atau berjerih lelah. Dalam konteks perintah Sabat, “bekerja” adalah padanan Indonesia yang paling alami; “harus” menyampaikan daya direktif bentuk imperfek dalam ketetapan hukum.
- source_word: וְעָשִׂיתָ
  choice: dan melakukan
  rationale: עשה memiliki arti luas, “melakukan” atau “membuat”. Bersama מְלַאכְתֶּךָ, frasa “melakukan segala pekerjaanmu” mempertahankan unsur verba yang tersendiri dalam teks Ibrani dan tetap wajar dalam bahasa Indonesia.
- source_word: כָּל
  choice: segala
  rationale: כָּל berarti seluruh atau setiap. “Segala” berpadu secara alami dengan nomina “pekerjaan” dalam frasa ini.
- source_word: מְלַאכְתֶּךָ
  choice: pekerjaanmu
  rationale: מְלָאכָה menunjuk pada pekerjaan, tugas, atau kegiatan, terutama dalam konteks Sabat. “Pekerjaanmu” merupakan padanan langsung, luas, dan sesuai konteks.
theological_decisions:
- issue: Daya perintah bentuk imperfek dalam ketetapan Sabat
  choice: engkau harus bekerja
  alternative: engkau boleh bekerja; engkau akan bekerja
  rationale: Dalam konteks Dekalog, bentuk ini berfungsi sebagai petunjuk perjanjian, bukan sekadar ramalan. “Harus” mempertahankan nada normatif tanpa mengubahnya menjadi sekadar izin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina “engkau” mempertahankan sapaan orang kedua tunggal dalam bahasa Ibrani. Tanda koma dipertahankan karena perintah berlanjut dan dikontraskan dengan ayat berikutnya.
