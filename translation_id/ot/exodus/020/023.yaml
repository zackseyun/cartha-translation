  yaml_path: translation/ot/exodus/020/023.yaml
  text: You shall not make gods of silver alongside me[a], nor shall you make for yourselves gods of gold.
translation:
  language: id
  text: Janganlah kalian membuat dewa-dewa perak di samping-Ku[a], dan janganlah kalian membuat bagi diri kalian dewa-dewa emas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bersama-Ku” atau “dengan Aku”; “di samping-Ku” merupakan pemahaman kontekstual yang umum.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲשׂוּן / תַעֲשׂוּ
  choice: membuat
  rationale: Dalam konteks ini, עשה merujuk pada pembuatan benda-benda pemujaan. “Membuat” adalah padanan Indonesia yang alami, langsung, dan tidak mempersempit makna pada teknik pengerjaan tertentu.
- source_word: אִתִּי
  choice: bagi-Ku
  rationale: Secara harfiah berarti “dengan Aku,” tetapi dalam susunan Ibrani ini frasa tersebut dapat menyatakan bahwa dewa-dewa itu dibuat untuk disandingkan dengan TUHAN. “Bagi-Ku” menghasilkan kalimat Indonesia yang alami sambil mempertahankan ketegangan maknanya melalui catatan kaki.
- source_word: אֱלֹהֵי כֶסֶף
  choice: dewa-dewa dari perak
  rationale: Rangkaian konstruksi ini paling langsung menunjuk kepada dewa-dewa yang terbuat dari perak. Bentuk ini jelas bagi pembaca Indonesia dan mempertahankan fokus pada ilah buatan.
- source_word: וֵאלֹהֵי זָהָב
  choice: dan ... dewa-dewa dari emas
  rationale: Pengulangan larangan dipertahankan dalam klausa kedua, sedangkan ו diterjemahkan “dan” sesuai koordinasi Ibrani.
- source_word: לָכֶם
  choice: bagi diri kalian
  rationale: Frasa ini menyatakan bahwa dewa-dewa tersebut dibuat untuk dimiliki atau digunakan oleh umat sendiri. “Bagi diri kalian” mempertahankan unsur refleksif dan bentuk jamak.
- source_word: לֹא ... לֹא
  choice: Janganlah ... dan janganlah ...
  rationale: Pengulangan “janganlah” mempertahankan dua larangan yang sejajar dan memberi nada hukum-perjanjian yang tegas namun alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna אִתִּי dalam larangan membuat dewa-dewa perak
  choice: bagi-Ku, dengan catatan alternatif “bersama-Ku” atau “di samping-Ku”
  alternative: bersama-Ku; di samping-Ku
  rationale: Teks Ibrani secara harfiah memakai preposisi “dengan,” sementara konteksnya menyiratkan penyandingan ilah lain dengan TUHAN. Terjemahan utama dibuat alami dalam bahasa Indonesia tanpa meniadakan ambiguitas leksikal; alternatif yang lebih harfiah dan yang lebih interpretatif dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai karena bentuk Ibraninya jamak; “dewa-dewa” membedakan ilah buatan ini dari Allah. Huruf kapital pada enklitik “-Ku” mengikuti kaidah umum penulisan rujukan kepada Allah.
