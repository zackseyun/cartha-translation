base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/024.yaml
  text: You shall make for me an altar of earth[a], and on it you shall sacrifice your burnt offerings and your peace offerings, your flock and your herd. In every place where I cause my name to be remembered, I will come to you and bless you.
translation:
  language: id
  text: Buatlah bagi-Ku sebuah altar dari tanah. Di atasnya persembahkanlah kurban bakaranmu dan kurban damai sejahteramu, serta kambing domba dan sapimu. Di setiap tempat di mana Aku membuat nama-Ku diingat[a], Aku akan datang kepadamu dan memberkatimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “di mana Aku menyatakan nama-Ku” atau “di mana Aku mencatat nama-Ku.” Kata kerja Ibrani berbentuk kausatif, yakni “membuat diingat atau disebut”; nuansanya dapat mencakup penyataan, pengabadian sebagai peringatan, atau penyeruan nama Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִזְבַּח אֲדָמָה
  choice: sebuah altar dari tanah
  rationale: Frasa konstruksi ini menunjuk pada altar yang dibuat dari tanah. Pilihan ini konkret, alami dalam bahasa Indonesia modern, dan tidak mempersempitnya menjadi jenis bahan lain.
- source_word: תַּעֲשֶׂה לִּי
  choice: Buatlah bagi-Ku
  rationale: Bentuk imperfek orang kedua tunggal maskulin berfungsi sebagai perintah dalam konteks hukum. 'Bagi-Ku' mempertahankan makna peruntukan atau pengabdian.
- source_word: וְזָבַחְתָּ עָלָיו
  choice: Di atasnya persembahkanlah
  rationale: Dalam konteks ibadah, זבח berarti mempersembahkan sebagai kurban, bukan sekadar menyembelih. Penempatan 'di atasnya' mempertahankan rujukan yang jelas kepada altar.
- source_word: עֹלֹתֶיךָ
  choice: kurban bakaranmu
  rationale: Istilah ini menunjuk pada kurban yang dibakar seluruhnya; 'kurban bakaran' merupakan padanan kultis yang jelas dan mapan.
- source_word: שְׁלָמֶיךָ
  choice: kurban damai sejahteramu
  rationale: Padanan ini mempertahankan hubungan leksikal dengan keutuhan, kesejahteraan, dan perdamaian tanpa membatasi maknanya hanya pada persekutuan.
- source_word: אֶת צֹאנְךָ וְאֶת בְּקָרֶךָ
  choice: yaitu kambing domba dan sapimu
  rationale: צאן mencakup ternak kecil, terutama domba dan kambing, sedangkan בקר menunjuk pada sapi. 'Yaitu' menyatakan hubungan aposisional dengan jenis kurban secara wajar dalam bahasa Indonesia.
- source_word: בְּכָל הַמָּקוֹם
  choice: Di setiap tempat
  rationale: Ungkapan ini bersifat distributif; padanan tersebut alami dan mempertahankan cakupan pernyataan.
- source_word: אֲשֶׁר אַזְכִּיר אֶת שְׁמִי
  choice: di mana Aku membuat nama-Ku diingat
  rationale: Bentuk Hifil dari זכר bersifat kausatif. Terjemahan ini mempertahankan tindakan ilahi yang menyebabkan nama-Nya diingat atau disebut, tanpa menetapkan mekanismenya secara lebih sempit.
- source_word: אָבֹא אֵלֶיךָ וּבֵרַכְתִּיךָ
  choice: Aku akan datang kepadamu dan memberkatimu
  rationale: Padanan langsung ini mempertahankan janji tentang kedatangan atau kehadiran Allah dan berkat-Nya.
theological_decisions:
- issue: Makna tindakan Allah dalam אֲשֶׁר אַזְכִּיר אֶת שְׁמִי
  choice: di mana Aku membuat nama-Ku diingat
  alternative: di mana Aku menyatakan nama-Ku; di mana Aku mencatat nama-Ku
  rationale: Pilihan utama mempertahankan bentuk kausatif dan ambiguitas tentang apakah nama Allah dibuat diingat melalui penyebutan, pewartaan, pencatatan, atau penetapan tempat ibadah. Dengan demikian, terjemahan tidak menyelesaikan ketegangan teologis melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk perintah dipakai secara langsung tetapi wajar. Istilah kurban dipertahankan untuk konteks ibadah, sedangkan 'kambing domba' dipakai agar cakupan צאן tidak menyempit menjadi domba saja. Penanda catatan kaki [a] ditempatkan pada klausa yang benar-benar dijelaskan oleh catatan tersebut.
