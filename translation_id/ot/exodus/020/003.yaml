  text: לֹֽ֣א יִהְיֶֽה לְ/ךָ֛ אֱלֹהִ֥ים אֲחֵרִ֖ים עַל פָּנָֽ/יַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/003.yaml
  text: You shall have no other gods before me[a].
translation:
  language: id
  text: Jangan ada padamu ilah-ilah lain di hadapan-Ku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “selain Aku” atau “di hadirat-Ku.” Secara harfiah, bahasa Ibrani berbunyi “di depan wajah-Ku.”
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: Jangan ada padamu
  rationale: Konstruksi harfiahnya menyatakan bahwa sesuatu tidak boleh ada bagi atau pada orang yang disapa. Ungkapan ini alami dalam bahasa Indonesia, mempertahankan bentuk larangan, dan mencerminkan sapaan tunggal Ibrani tanpa menambahkan gagasan 'menyembah' yang tidak dinyatakan secara eksplisit.
- source_word: אֱלֹהִים
  choice: ilah-ilah
  rationale: Dalam konteks ini bentuk jamak yang diterangkan oleh 'lain' menunjuk pada dewa atau sosok ilahi tandingan. 'Ilah-ilah' merupakan padanan yang jelas dan bermartabat serta membedakannya dari nama atau sebutan bagi Allah Israel.
- source_word: אֲחֵרִים
  choice: lain
  rationale: Kata sifat ini berarti 'lain' atau 'yang lain.' Padanan 'lain' tidak mempersempit maknanya menjadi hanya ilah asing.
- source_word: עַל פָּנָי
  choice: di hadapan-Ku
  rationale: Ungkapan Ibrani ini secara harfiah berkaitan dengan 'wajah-Ku' dan dapat menyatakan keberadaan di hadapan atau dalam hadirat seseorang. 'Di hadapan-Ku' mempertahankan citra relasionalnya, sementara kemungkinan makna eksklusif dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna עַל פָּנָי dalam perintah pertama
  choice: di hadapan-Ku
  alternative: selain Aku; di hadirat-Ku
  rationale: Idiom Ibrani dapat menekankan hadirat Allah dan, dalam konteks perjanjian ini, larangan memiliki ilah lain selain Dia. Teks utama mempertahankan ungkapan yang dekat dengan bentuk Ibrani, sedangkan alternatifnya dicatat agar ketegangan makna tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada ringkas dan khidmat. Bentuk 'padamu' mempertahankan sapaan tunggal; kapital pada '-Ku' mengikuti kebiasaan penulisan rujukan kepada Allah dalam teks keagamaan Indonesia.
