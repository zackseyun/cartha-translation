  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה כֹּ֥ה תֹאמַ֖ר אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל אַתֶּ֣ם רְאִיתֶ֔ם כִּ֚י מִן הַ/שָּׁמַ֔יִם דִּבַּ֖רְתִּי עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/022.yaml
  text: 'Then Yahweh said to Moses[c][b][a], “Thus you shall say to the sons of Israel: You yourselves have seen that I have spoken to you from heaven.”'
translation:
  language: id
  text: 'Lalu Yahweh berfirman kepada Musa, “Beginilah yang harus kaukatakan kepada orang Israel[a]: Kalian sendiri telah melihat bahwa Aku telah berbicara dengan kalian[b] dari langit[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “putra-putra Israel”; ungkapan ini lazim menunjuk kepada orang Israel atau umat Israel secara kolektif.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “Aku telah berbicara kepada kalian.” Bahasa Ibraninya memakai kata depan yang secara dasar berarti “dengan,” sehingga menonjolkan perjumpaan langsung.
    reason: lexical_alternative
  - marker: c
    text: Kata Ibrani yang diterjemahkan “langit” berbentuk jamak. Dalam konteks ini, bahasa Indonesia secara alami memakai “dari langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Waw-konsekutif melanjutkan urutan narasi, sehingga “lalu” alami dalam bahasa Indonesia. Karena subjeknya Yahweh, “berfirman” mempertahankan ragam Alkitab yang wajar dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan agar nama perjanjian dalam teks Ibrani tetap tampak, bukan diganti dengan gelar.
- source_word: כֹּה תֹאמַר
  choice: Beginilah yang harus kaukatakan
  rationale: Menerjemahkan formula utusan secara alami sambil mempertahankan nada instruktif dan bentuk orang kedua tunggal yang ditujukan kepada Musa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan Ibrani ini merupakan sebutan kolektif bagi bangsa Israel. “Orang Israel” alami dalam bahasa Indonesia; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: אַתֶּם
  choice: Kalian sendiri
  rationale: Pronomina mandiri bersifat tegas dan berbentuk jamak. “Kalian sendiri” menyatakan baik kejamakan maupun penekanannya.
- source_word: רְאִיתֶם
  choice: telah melihat
  rationale: Bentuk perfektif menunjuk pada pengalaman yang sudah terjadi dan kini menjadi dasar kesaksian mereka.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi dari apa yang telah mereka lihat, bukan alasan kausal.
- source_word: מִן הַשָּׁמַיִם
  choice: dari langit
  rationale: Walaupun bentuk Ibraninya secara morfologis jamak, “langit” adalah ungkapan Indonesia yang alami untuk tempat asal suara ilahi.
- source_word: דִּבַּרְתִּי עִמָּכֶם
  choice: Aku telah berbicara dengan kalian
  rationale: Preposisi עִם secara dasar berarti “dengan” dan dapat menonjolkan perjumpaan langsung. Pilihan yang lebih lazim, “kepada kalian,” dicatat sebagai alternatif.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama diri ilahi, sehingga transliterasi “Yahweh” mempertahankan ciri tersebut tanpa menggantinya dengan gelar.
- issue: Sebutan kolektif בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel; keturunan Israel
  rationale: Dalam konteks ini ungkapan tersebut menunjuk kepada umat Israel secara kolektif. Terjemahan utama menghindari kesan bahwa hanya anak-anak atau hanya laki-laki yang dimaksud, sedangkan bentuk harfiah tetap dijelaskan dalam catatan kaki.
- issue: Nuansa דִּבַּרְתִּי עִמָּכֶם
  choice: Aku telah berbicara dengan kalian
  alternative: Aku telah berbicara kepada kalian
  rationale: “Dengan” mempertahankan nilai dasar preposisi עִם dan nuansa perjumpaan langsung tanpa memaksakan gagasan percakapan timbal balik; alternatif yang lebih idiomatis tetap diberikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kaukatakan” mempertahankan sapaan tunggal kepada Musa, sedangkan “kalian” menandai bahwa seluruh umat disapa. Kapitalisasi “Aku” mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan kepada Allah.
