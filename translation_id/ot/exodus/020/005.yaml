source:
  edition: WLC
  text: לֹֽא תִשְׁתַּחֲוֶ֥ה לָ/הֶ֖ם וְ/לֹ֣א תָעָבְדֵ֑/ם כִּ֣י אָֽנֹכִ֞י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֵ֣ל קַנָּ֔א פֹּ֠קֵד עֲוֺ֨ן אָבֹ֧ת עַל בָּנִ֛ים עַל שִׁלֵּשִׁ֥ים וְ/עַל רִבֵּעִ֖ים לְ/שֹׂנְאָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/005.yaml
  text: You shall not bow down to them or serve them[a], for I, Yahweh your God, am a jealous God, visiting the iniquity of fathers on children, on the third and on the fourth generations of those who hate me[d][c][b],
translation:
  language: id
  text: Jangan bersujud kepada mereka[a] dan jangan beribadah kepada mereka[b], sebab Akulah Yahweh, Allahmu, Allah yang cemburu, yang memperhitungkan kesalahan bapak-bapak kepada anak-anak[c], hingga generasi ketiga dan keempat dari mereka yang membenci-Ku[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “jangan merebahkan diri di hadapan mereka”; kata Ibrani ini menunjuk pada tindakan bersujud atau merendahkan diri sebagai tanda hormat.
    reason: lexical_alternative
  - marker: b
    text: Atau, “jangan melayani mereka”; dalam konteks berhala, kata “melayani” dapat menunjuk pada pelayanan atau ibadah kultis kepada mereka.
    reason: lexical_alternative
  - marker: c
    text: Bahasa Ibrani berbunyi, “memperhitungkan kesalahan bapak-bapak kepada anak-anak.” Rumusan ini mempertahankan idiom Ibrani; bandingkan Ulangan 24:16 dan Yehezkiel 18 mengenai tanggung jawab pribadi.
    reason: cross_reference
  - marker: d
    text: Atau, “hingga generasi ketiga dan keempat dari orang-orang yang membenci-Ku.”
    reason: alternative_reading
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: sujud menyembah
  rationale: Kata kerja ini menggambarkan tindakan merendahkan diri atau bersujud di hadapan sesuatu yang dihormati. 'Sujud menyembah' mempertahankan tindakan konkretnya sekaligus menjelaskan makna religiusnya dalam konteks berhala.
- source_word: תָעָבְדֵם
  choice: beribadah kepada mereka
  rationale: עבד secara dasar berarti melayani, tetapi dalam konteks ilah atau berhala menunjuk pada pelayanan kultis. 'Beribadah kepada' alami dalam bahasa Indonesia dan tetap dibedakan dari tindakan sujud pada klausa sebelumnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh' agar nama pribadi dalam teks Ibrani tetap tampak dan tidak diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk konstruk dengan akhiran orang kedua tunggal diterjemahkan secara langsung dan alami sebagai 'Allahmu'.
- source_word: אֵל קַנָּא
  choice: Allah yang cemburu
  rationale: Dalam konteks perjanjian, קַנָּא menyatakan tuntutan Allah akan kesetiaan eksklusif dan penolakan terhadap penyembahan tandingan. 'Cemburu' mempertahankan ketegangan relasional tersebut.
- source_word: פֹּקֵד
  choice: memperhitungkan
  rationale: פֹּקֵד menyatakan tindakan Allah memperhatikan dan menangani secara yudisial. 'Memperhitungkan' lebih alami daripada idiom harfiah 'mengunjungi' dalam bahasa Indonesia, tanpa mempersempitnya semata-mata menjadi 'menghukum'.
- source_word: עֲוֺן
  choice: kesalahan
  rationale: עָוֹן dapat mencakup kejahatan, kesalahan, rasa bersalah, dan akibatnya. 'Kesalahan' cukup luas untuk mempertahankan jangkauan makna dalam konstruksi ini.
- source_word: אָבֹת
  choice: bapak-bapak
  rationale: Bentuk Ibrani adalah jamak maskulin dan dalam rumusan antargenerasi ini menunjuk kepada para bapak atau leluhur laki-laki; pilihan ini tidak menetralkannya menjadi 'orang tua'.
- source_word: בָּנִים
  choice: anak-anak
  rationale: בָּנִים dapat berarti anak-anak atau keturunan dalam rumusan ini; 'anak-anak' menyampaikan cakupan generasional tanpa membatasinya hanya kepada laki-laki.
- source_word: שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: sampai keturunan yang ketiga dan yang keempat
  rationale: Bilangan ordinal dalam bahasa Ibrani bersifat eliptis. Penambahan 'keturunan' membuat maksud generasional jelas dan wajar dalam bahasa Indonesia.
- source_word: לְשֹׂנְאָי
  choice: dari orang-orang yang membenci-Ku
  rationale: Frasa ini dipertahankan dekat dengan susunan Ibrani sehingga dapat dipahami sebagai penjelas garis keturunan yang terus membenci Allah, tanpa diam-diam menghapus ambiguitas hubungan sintaktisnya.
theological_decisions:
- issue: Cara menerjemahkan kecemburuan ilahi
  choice: Allah yang cemburu
  alternative: Allah yang menuntut kesetiaan penuh
  rationale: Konteksnya adalah eksklusivitas perjanjian dalam larangan penyembahan berhala. 'Cemburu' mempertahankan bahasa dan ketegangan teologis teks, sedangkan alternatif menjelaskan makna tetapi mengurangi metafora relasionalnya.
- issue: Cara menyatakan penghakiman antargenerasi
  choice: yang memperhitungkan kesalahan bapak-bapak kepada anak-anak, sampai keturunan yang ketiga dan yang keempat
  alternative: yang menghukum anak-anak karena dosa bapak-bapak sampai keturunan yang ketiga dan keempat
  rationale: '''Memperhitungkan'' mempertahankan keluasan פֹּקֵד dan tidak menetapkan mekanisme penghakiman secara lebih sempit daripada teks. Rumusan ini membiarkan ketegangan kanonik dengan ajaran mengenai tanggung jawab pribadi tetap ada.'
- issue: Cakupan frasa 'orang-orang yang membenci-Ku'
  choice: dari orang-orang yang membenci-Ku
  alternative: yaitu pada mereka yang membenci-Ku
  rationale: Susunan terpilih mempertahankan hubungan frasa dengan rentang generasi dan tidak sepenuhnya menyelesaikan apakah frasa itu secara khusus membatasi setiap generasi yang terkena atau menggambarkan garis keluarga para pembenci Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Yahweh' mempertahankan nama ilahi. 'Sujud menyembah' dan 'beribadah' membedakan kedua verba Ibrani secara wajar, sedangkan 'memperhitungkan' menjaga idiom yudisial tanpa memperkerasnya menjadi tafsiran eksplisit 'menghukum'.
