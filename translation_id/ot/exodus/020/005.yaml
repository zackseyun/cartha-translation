  to: Jangan bersujud kepada mereka[a] dan jangan beribadah kepada mereka[b], sebab Akulah Yahweh, Allahmu, Allah yang cemburu, yang memperhitungkan kesalahan bapak-bapak kepada anak-anak[c], hingga generasi ketiga dan keempat dari mereka yang membenci-Ku[d].
