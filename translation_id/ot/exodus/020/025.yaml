  text: וְ/אִם מִזְבַּ֤ח אֲבָנִים֙ תַּֽעֲשֶׂה לִּ֔/י לֹֽא תִבְנֶ֥ה אֶתְ/הֶ֖ן גָּזִ֑ית כִּ֧י חַרְבְּ/ךָ֛ הֵנַ֥פְתָּ עָלֶ֖י/הָ וַ/תְּחַֽלְלֶֽ/הָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/025.yaml
  text: And if you make for me an altar of stones[a], you shall not build it of cut stones; for if you wield your sword on it[b], you will profane it.
translation:
  language: id
  text: Dan jika engkau membuat bagi-Ku sebuah mazbah dari batu, janganlah engkau membangunnya dengan batu-batu yang dipahat[a], sebab jika engkau mengayunkan pedangmu ke atasnya[b], engkau akan mencemarkannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “batu-batu yang dipotong.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “pedangmu”; dalam konteks ini mungkin yang dimaksud ialah alat logam bermata tajam yang digunakan untuk mengerjakan batu.'
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: Dan jika
  rationale: Mempertahankan baik daya penghubung וְ maupun unsur persyaratan אִם dalam rangkaian ketetapan sebelumnya.
- source_word: מִזְבַּח אֲבָנִים
  choice: sebuah mazbah dari batu
  rationale: Menyampaikan hubungan konstruksi Ibrani secara alami dalam bahasa Indonesia; “mazbah” mempertahankan istilah khusus untuk tempat persembahan kurban.
- source_word: תַּעֲשֶׂה לִּי
  choice: engkau membuat bagi-Ku
  rationale: Preposisi לְ menyatakan bahwa mazbah itu dibuat bagi TUHAN tanpa menambahkan motif yang tidak dinyatakan.
- source_word: לֹא תִבְנֶה אֶתְהֶן גָּזִית
  choice: janganlah engkau membangunnya dengan batu-batu pahat
  rationale: Larangan hukum diterjemahkan secara tegas dan wajar. Bentuk jamak feminin אֶתְהֶן merujuk kepada batu-batu, sedangkan susunan Indonesia berfokus pada mazbah yang dibangun dengan batu-batu tersebut.
- source_word: חַרְבְּךָ
  choice: pedangmu
  rationale: Makna leksikal harfiahnya adalah “pedang”; konteks mungkin menunjuk pada alat logam bermata tajam, tetapi kemungkinan itu tidak menggantikan kata sumber dalam teks utama.
- source_word: הֵנַפְתָּ עָלֶיהָ
  choice: engkau mengayunkan ... ke atasnya
  rationale: Mempertahankan gambaran tindakan mengangkat atau mengayunkan pedang terhadap batu/mazbah tanpa mereduksinya menjadi sekadar “menggunakan alat”.
- source_word: וַתְּחַלְלֶהָ
  choice: engkau akan mencemarkannya
  rationale: חלל menyatakan pencemaran terhadap sesuatu yang kudus. “Mencemarkan” alami dalam bahasa Indonesia dan tetap mempertahankan dimensi kultisnya.
theological_decisions:
- issue: Sifat pencemaran mazbah
  choice: Tindakan mengerjakan batu dengan pedang menyebabkan mazbah tercemar dalam pengertian kekudusan ibadah.
  alternative: Larangan ini semata-mata menolak kekerasan, kemewahan, atau hiasan berlebihan.
  rationale: Kata חלל secara eksplisit berkaitan dengan pencemaran sesuatu yang kudus, tetapi ayat ini tidak menjelaskan alasan simbolis yang lebih lengkap; karena itu terjemahan tidak menambahkan penafsiran tersebut.
- issue: Identitas pedang sebagai perkakas
  choice: Teks utama mempertahankan “pedangmu”.
  alternative: Menerjemahkannya langsung sebagai “perkakasmu” atau “alat besimu”.
  rationale: חֶרֶב biasanya berarti pedang. Konteks memungkinkan penggunaannya sebagai alat pemahat atau sebutan bagi alat logam bermata tajam, tetapi ambiguitas itu sebaiknya dijelaskan dalam catatan, bukan diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “engkau” sesuai dengan sapaan tunggal dalam teks Ibrani, sedangkan “bagi-Ku” menandai bahwa pembicara adalah Allah. Istilah “mazbah” dipilih karena merupakan istilah ibadah yang ringkas dan dikenal luas; susunan kalimat tetap dekat dengan bentuk hukum sumber tanpa terasa kaku.
