base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/019.yaml
  text: And they said to Moses[a], “You speak with us, and we will listen; but let not God speak with us, lest we die.”
translation:
  language: id
  text: Lalu mereka berkata kepada Musa, “Berbicaralah engkau dengan kami, dan kami akan mendengarkan[a]. Namun, janganlah Allah berbicara dengan kami, jangan sampai kami mati.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kami akan mendengar.” Kata kerja Ibrani ini dapat berarti mendengar dalam arti menyimak dengan penuh perhatian atau menanggapi dengan ketaatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Lalu mereka berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita. “Lalu” menyatakan urutan naratif secara alami dalam bahasa Indonesia.
- source_word: דַּבֵּר אַתָּה
  choice: Engkaulah yang berbicara
  rationale: Kata ganti אַתָּה yang dinyatakan secara eksplisit memberi penekanan bahwa Musalah, bukan Allah, yang diminta berbicara. Bentuk “Engkaulah” mempertahankan kontras itu.
- source_word: עִמָּנוּ
  choice: dengan kami
  rationale: Preposisi עִם pada dasarnya berarti “dengan”; pilihan ini mempertahankan nuansa relasional dalam permintaan bangsa itu.
- source_word: וְנִשְׁמָעָה
  choice: dan kami akan mendengarkan
  rationale: Bentuk kohortatif menyatakan tanggapan yang bersifat kesediaan. “Mendengarkan” mencakup perhatian dan respons lebih baik daripada sekadar “mendengar”.
- source_word: וְאַל יְדַבֵּר
  choice: Namun, janganlah ... berbicara
  rationale: אַל dengan bentuk imperfek menyatakan larangan atau permohonan negatif. “Namun” menampilkan kontras dengan permintaan agar Musa berbicara.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Walaupun bentuk katanya secara morfologis jamak, verba yang menyertainya tunggal dan konteks menunjuk kepada Allah Israel.
- source_word: פֶּן נָמוּת
  choice: jangan sampai kami mati
  rationale: פֶּן memperkenalkan akibat yang ditakuti. Ungkapan Indonesia ini mempertahankan nada kekhawatiran tanpa mengubahnya menjadi pernyataan akibat yang pasti.
theological_decisions:
- issue: Rujukan dan jumlah gramatikal אֱלֹהִים
  choice: Allah dalam bentuk tunggal
  alternative: allah-allah/dewa-dewa
  rationale: Konteks Sinai dan verba tunggal menunjukkan satu rujukan, yaitu Allah Israel. Keputusan ini berdasarkan tata bahasa dan konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Engkaulah” dipakai untuk mempertahankan penekanan pada Musa, sedangkan “jangan sampai” menyampaikan akibat yang ditakuti secara alami.
