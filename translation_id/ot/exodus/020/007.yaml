  naturalness: “Menyandang nama” adalah pilihan formal yang dapat diterima dan menjaga metafora teks sumber. Sebaliknya, “menyandang nama ... untuk kepalsuan” terdengar tidak idiomatis dalam bahasa Indonesia modern. “Dengan sia-sia” lebih alami, tetap cukup luas dalam konteks ini, dan dapat dipertegas melalui catatan kaki.
  terminology: “Yahweh,” “Allahmu,” dan “nama-Nya” konsisten dan tepat. “Tidak akan membiarkan ... tanpa hukuman” menyampaikan arti יְנַקֶּה dengan baik. Catatan kaki perlu menyebutkan padanan tradisional yang lebih akurat; “dengan sembarangan” terlalu menyempitkan dan bukan bentuk tradisional Indonesia yang lazim untuk ayat ini.
