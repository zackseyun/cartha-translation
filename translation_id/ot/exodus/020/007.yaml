base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/007.yaml
  text: You shall not bear the name of Yahweh your God falsely[a], for Yahweh will not leave unpunished the one who bears his name falsely.
translation:
  language: id
  text: Jangan menyandang nama Yahweh, Allahmu, dengan sia-sia[a], sebab Yahweh tidak akan membiarkan tanpa hukuman orang yang menyandang nama-Nya dengan sia-sia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Terjemahan tradisional: “Jangan menyebut nama TUHAN, Allahmu, dengan tidak hormat” atau “dengan sia-sia.” Secara lebih harfiah, bahasa Ibraninya berarti “menyandang/membawa nama ... untuk kehampaan atau kepalsuan”; cakupannya dapat meliputi sumpah palsu, seruan kosong, atau tindakan yang secara tidak benar mengatasnamakan Allah.'
    reason: Menjelaskan keluasan נשא dan שָׁוְא, serta mencatat rumusan tradisional tanpa mempersempit teks utama.
lexical_decisions:
- source_word: תִשָּׂא / יִשָּׂא (נשא)
  choice: menyandang
  rationale: Kata kerja נשא berarti mengangkat, membawa, atau menanggung. “Menyandang” mempertahankan gambaran konkret membawa nama dan mengulang kata kerja yang sama dalam kedua klausa, tanpa mempersempitnya hanya pada ucapan.
- source_word: שֵׁם
  choice: nama
  rationale: Padanan langsung yang dalam konteks mencakup identitas, reputasi, dan tuntutan perjanjian Yahweh, bukan sekadar pelafalan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Mempertahankan sapaan orang kedua tunggal dan nuansa hubungan perjanjian.
- source_word: לַשָּׁוְא
  choice: untuk kepalsuan
  rationale: שָׁוְא dapat menunjuk pada kehampaan, kesia-siaan, kepalsuan, atau sesuatu yang tidak bernilai. “Untuk kepalsuan” cukup alami dalam hubungan dengan tindakan menyandang nama, tetap mempertahankan arah tujuan frasa לַ־, dan tidak membatasi larangan hanya pada sumpah palsu atau ucapan profan.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan yang mendasari larangan secara jelas dan wajar dalam bahasa Indonesia.
- source_word: יְנַקֶּה (נקה)
  choice: tidak akan membiarkan tanpa hukuman
  rationale: Bentuk piel di sini menyatakan tidak membebaskan seseorang dari kesalahan atau akibat hukuman. Ungkapan ini menyampaikan daya yudisialnya dengan jelas.
- source_word: אֲשֶׁר
  choice: orang yang
  rationale: Menunjuk secara umum kepada siapa pun yang melakukan tindakan tersebut dengan bentuk Indonesia yang alami.
- source_word: שְׁמוֹ
  choice: nama-Nya
  rationale: Merujuk kembali secara eksplisit kepada nama Yahweh; kapitalisasi pronomina mengikuti kebiasaan hormat dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan larangan mengenai nama ilahi
  choice: Larangan luas terhadap menyandang nama Yahweh bagi kepalsuan, kehampaan, atau tujuan yang tidak patut.
  alternative: Membatasinya pada sumpah palsu saja, atau pada ucapan hujat dan penggunaan nama secara sembarangan saja.
  rationale: Gabungan נשא, שֵׁם, dan שָׁוְא lebih luas daripada tindakan melafalkan nama dengan tidak sopan. Teks dapat mencakup sumpah palsu, seruan kosong, dan representasi yang tidak benar; terjemahan utama mempertahankan keluasan itu.
- issue: Penerjemahan nama ilahi YHWH
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: “Yahweh” mempertahankan nama diri yang dinyatakan dalam teks Ibrani tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. “Menyandang” dipilih untuk mempertahankan metafora Ibrani dan pengulangan antarklausa. “Untuk kepalsuan” sengaja sedikit formal agar ambiguitas semantis שָׁוְא tetap terlihat; catatan kaki membantu pembaca memahami cakupannya.
