base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/020.yaml
  text: And Moses said to the people[a], “Do not fear, for God has come to test you, and so that the fear of him may be before you[c][b], so that you may not sin.”
translation:
  language: id
  text: Lalu Musa berkata kepada bangsa itu, “Jangan takut[a], sebab Allah datang untuk menguji kamu dan supaya takut akan Dia tetap ada di hadapan kamu[b], agar kamu tidak berbuat dosa.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani dengan akar yang sama dipakai lagi dalam ungkapan “takut akan Dia” pada ayat ini. Dengan demikian, terdapat kontras antara ketakutan yang membuat gentar dan takut yang semestinya kepada Allah.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di atas wajahmu.” Ungkapan ini menunjuk pada sesuatu yang terus berada di hadapan seseorang atau tetap hadir dalam kesadarannya. “Takut akan Dia” juga dapat dipahami sebagai “hormat penuh gentar kepada-Nya.”
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּירָאוּ
  choice: Jangan takut
  rationale: Mempertahankan akar kata takut yang muncul lagi dalam יִרְאָתוֹ, sehingga kontras antara ketakutan yang dilarang dan takut yang semestinya kepada Allah tetap terdengar.
- source_word: לְבַעֲבוּר נַסּוֹת אֶתְכֶם
  choice: untuk menguji kamu
  rationale: Ungkapan ini menyatakan tujuan; 'menguji' menyampaikan makna נסה tanpa memberi kesan bahwa Allah menggoda manusia untuk berbuat jahat.
- source_word: בָּא הָאֱלֹהִים
  choice: Allah datang
  rationale: Bentuk Ibrani menunjuk pada kedatangan Allah dalam peristiwa yang sedang berlangsung; bentuk lampau sempurna bahasa Indonesia tidak perlu dinyatakan secara khusus.
- source_word: וּבַעֲבוּר
  choice: dan supaya
  rationale: Menandai tujuan kedua secara alami dalam bahasa Indonesia.
- source_word: יִרְאָתוֹ
  choice: takut akan Dia
  rationale: Menjaga hubungan leksikal dengan 'Jangan takut' dan mempertahankan keluasan makna antara rasa takut dan rasa hormat penuh gentar.
- source_word: עַל־פְּנֵיכֶם
  choice: tetap ada di hadapanmu
  rationale: Menyampaikan idiom harfiahnya, 'di atas wajahmu', sebagai sesuatu yang terus berada dalam kesadaran mereka.
- source_word: לְבִלְתִּי תֶחֱטָאוּ
  choice: agar kamu tidak berbuat dosa
  rationale: Menyatakan tujuan negatif dengan bahasa Indonesia yang jelas dan wajar.
theological_decisions:
- issue: Ketegangan antara larangan untuk takut dan perlunya takut akan Allah
  choice: Menggunakan kata 'takut' pada kedua bagian
  alternative: Menerjemahkan bagian pertama 'Jangan gentar' dan bagian kedua 'hormat kepada-Nya'
  rationale: Teks Ibrani sengaja memakai akar kata yang sama. Pilihan ini mempertahankan ketegangan antara kepanikan yang dilarang dan takut kepada Allah yang mencegah dosa.
- issue: Hakikat pengujian oleh Allah
  choice: menguji
  alternative: mencobai; membuktikan
  rationale: '''Menguji'' mempertahankan makna pemeriksaan atau pembuktian tanpa menyiratkan bahwa Allah membujuk orang untuk berbuat jahat.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti jamak pada verba Ibrani diterjemahkan dengan 'kamu', sedangkan bentuk posesif ilahi dibuat eksplisit sebagai 'Dia'. Permainan akar kata takut dipertahankan tanpa membuat kalimat menjadi kaku.
