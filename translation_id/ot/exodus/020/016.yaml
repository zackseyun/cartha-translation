translation:
  language: id
  text: Jangan memberikan kesaksian palsu terhadap sesamamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Jangan bersaksi dusta terhadap sesamamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: Jangan
  rationale: Partikel negasi dalam bentuk larangan paling alami diterjemahkan dengan “jangan” dalam bahasa Indonesia modern.
- source_word: תַעֲנֶה
  choice: memberikan kesaksian
  rationale: Dalam konteks hukum, verba ענה dapat berarti menjawab atau bersaksi. Ungkapan “memberikan kesaksian” menyampaikan makna forensik dengan jelas dan wajar.
- source_word: בְרֵעֲךָ
  choice: terhadap sesamamu
  rationale: רֵעַ berarti sesama atau rekan, dan preposisi ב dalam konteks forensik menunjuk kepada orang yang menjadi sasaran kesaksian. “Terhadap sesamamu” mempertahankan cakupan ini tanpa menyiratkan bahwa kesaksian itu harus selalu merugikan.
- source_word: עֵד שָׁקֶר
  choice: kesaksian palsu
  rationale: Gabungan ini menunjuk pada kesaksian yang tidak benar atau menipu. “Kesaksian palsu” merupakan padanan hukum yang alami dan bermartabat dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bernada hukum. Bentuk “sesamamu” dipilih karena bermartabat dan lazim dalam konteks perintah etis, sedangkan catatan kaki mempertahankan alternatif verbal yang lebih langsung.
