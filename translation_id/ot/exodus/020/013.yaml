lexical_decisions:
- source_word: לֹא
  choice: jangan
  rationale: Partikel negasi ini, bersama bentuk verba orang kedua dalam konteks hukum, secara alami menyatakan larangan langsung dalam bahasa Indonesia.
- source_word: תִּרְצָח
  choice: membunuh
  rationale: Verba רצח menunjuk pada tindakan menghilangkan nyawa manusia secara terlarang. Dalam bahasa Indonesia, bentuk ringkas dan lazim untuk perintah ini adalah “jangan membunuh”; catatan kaki membatasi cakupannya agar tidak disalahartikan sebagai larangan terhadap setiap tindakan menghilangkan nyawa tanpa membedakan konteks.
theological_decisions:
- issue: Cakupan larangan dalam Dekalog
  choice: Memakai “membunuh” dengan catatan bahwa yang dimaksud ialah pembunuhan manusia secara terlarang
  alternative: Jangan melakukan pembunuhan.
  rationale: Bahasa Indonesia tidak memiliki verba tunggal yang sama alami dan langsungnya dengan nuansa khusus “murder” dalam bahasa Inggris. “Jangan membunuh” mempertahankan bentuk perintah yang dikenal dan lugas, sedangkan catatan kaki menjaga cakupan leksikal רצח agar tidak diperluas menjadi larangan mutlak atas segala penghilangan nyawa.
translation_notes:
  register: Bahasa modern, ringkas, dan berwibawa. Bentuk “Jangan membunuh” merupakan larangan langsung yang alami dalam bahasa Indonesia; catatan kaki diperlukan untuk menjaga ketepatan cakupan verba Ibrani.
