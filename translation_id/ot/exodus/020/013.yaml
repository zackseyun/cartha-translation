  footnotes:
  - marker: a
    text: Atau, “Jangan membunuh.” Kata Ibrani yang dipakai di sini biasanya merujuk pada pembunuhan manusia yang tidak sah, bukan setiap tindakan menghilangkan nyawa dalam segala keadaan.
