  verdict: revise
  source_fidelity: Larangan, sapaan orang kedua tunggal, kepemilikan mazbah oleh Allah, serta alasan agar עֶרְוָתְךָ tidak tersingkap telah diterjemahkan dengan setia. Namun, בְּמַעֲלֹת secara khusus menunjuk pada anak-anak tangga/undakan, bukan sekadar ‘tangga’ sebagai sarana umum; ‘melalui anak-anak tangga’ lebih dekat kepada konstruksi Ibrani dan menghindari kemungkinan pembacaan sebagai tangga portabel.
  naturalness: Kalimatnya lugas dan sesuai register Alkitab Indonesia modern. ‘Janganlah engkau’ dan ‘mazbah-Ku’ mempertahankan gaya luhur tanpa terasa kuno berlebihan. Penggantian ‘dengan tangga’ menjadi ‘melalui anak-anak tangga’ lebih idiomatis untuk tindakan naik lewat undakan.
  terminology: ‘Mazbah’ adalah istilah Alkitab yang mapan. ‘Auratmu’ menyampaikan עֶרְוָה secara santun dan tidak mempersempitnya menjadi bagian tubuh tertentu. ‘Tersingkap’ tepat untuk nifal תִּגָּלֶה. Tidak diperlukan catatan kaki, karena alternatif ‘terbuka/tersingkap’ tidak perlu dimasukkan ke dalam teks dan tidak ada jangkar catatan kaki dalam draf.
