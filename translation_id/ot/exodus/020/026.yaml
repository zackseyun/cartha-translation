  text: And you shall not go up by steps to my altar[a], so that your nakedness may not be exposed on it.
translation:
  language: id
  text: Janganlah engkau naik ke mazbah-Ku melalui anak-anak tangga, supaya auratmu tidak tersingkap di atasnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַעֲלֶה
  choice: engkau naik
  rationale: Kata עלה berarti ‘naik’. Bentuk tunggal ‘engkau’ mempertahankan sapaan Ibrani dan terdengar wajar dalam larangan ini.
- source_word: בְמַעֲלֹת
  choice: dengan tangga
  rationale: מַעֲלוֹת menunjuk pada anak-anak tangga atau tangga. ‘Dengan tangga’ secara alami menyatakan sarana untuk naik.
- source_word: מִזְבְּחִי
  choice: mazbah-Ku
  rationale: מִזְבֵּחַ dengan akhiran orang pertama tunggal berarti ‘mazbah-Ku’; istilah ‘mazbah’ tetap lazim dan tepat dalam register Alkitab bahasa Indonesia.
- source_word: אֲשֶׁר לֹא
  choice: supaya ... tidak
  rationale: Dalam konteks ini frasa tersebut memperkenalkan akibat atau tujuan yang hendak dihindari setelah larangan. ‘Supaya ... tidak’ jelas dan alami dalam bahasa Indonesia modern.
- source_word: תִּגָּלֶה
  choice: tersingkap
  rationale: Bentuk nifal dari גלה menyatakan keadaan pasif, ‘tersingkap’ atau ‘terbuka’. ‘Tersingkap’ cocok dengan konteks aurat tanpa mempersempit maknanya.
- source_word: עֶרְוָתְךָ
  choice: auratmu
  rationale: עֶרְוָה menunjuk pada ketelanjangan atau bagian tubuh yang harus ditutupi. ‘Auratmu’ merupakan padanan Indonesia yang ringkas, alami, dan mempertahankan nuansa kesopanan seksual.
- source_word: עָלָיו
  choice: di atasnya
  rationale: Pronomina ini merujuk kembali kepada mazbah. ‘Di atasnya’ mempertahankan relasi ruang yang dinyatakan oleh עַל tanpa menjelaskan lebih jauh bagaimana penyingkapan itu terlihat.
theological_decisions:
- issue: Alasan larangan memakai tangga untuk naik ke mazbah
  choice: Teks menyatakan kekhawatiran agar aurat tidak tersingkap dalam kaitannya dengan mazbah.
  alternative: Larangan ini melambangkan kerendahan hati di hadapan Allah, atau secara khusus berkaitan dengan pakaian imam.
  rationale: Teks Ibrani sendiri menyebut tersingkapnya aurat sebagai alasan larangan. Terjemahan tidak menambahkan penafsiran simbolis atau mengkhususkannya pada pakaian imam.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. ‘Janganlah’ mempertahankan daya larangan; ‘mazbah’ dipilih sebagai istilah Alkitab yang mapan, sedangkan ‘aurat’ menyampaikan makna tubuh yang tersingkap secara alami tanpa menjadi vulgar.
