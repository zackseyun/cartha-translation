  text: but showing steadfast love to thousands[a], to those who love me and keep my commandments.
translation:
  language: id
  text: tetapi menunjukkan kasih setia kepada ribuan[a], yaitu mereka yang mengasihi-Ku dan menaati perintah-perintah-Ku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepada seribu generasi” (bandingkan Ulangan 5:10); teks Ibrani di sini hanya berbunyi “kepada ribuan.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְעֹשֶׂה
  choice: tetapi menunjukkan
  rationale: Partisipel עשה melanjutkan kontras dengan hukuman pada ayat sebelumnya. Dalam konteks ini, 'tetapi' menyatakan daya adversatif waw secara wajar, sedangkan 'menunjukkan' mengungkapkan tindakan kasih dengan bahasa Indonesia alami.
- source_word: חֶסֶד
  choice: kasih setia
  rationale: חֶסֶד menunjuk pada kasih, kebaikan, dan kesetiaan relasional dalam ikatan perjanjian. 'Kasih setia' mempertahankan keluasan makna itu dalam ungkapan Indonesia yang lazim dan bermartabat.
- source_word: לַאֲלָפִים
  choice: kepada beribu-ribu orang
  rationale: Teks Ibrani secara harfiah menyebut 'kepada ribuan' tanpa kata 'keturunan' atau 'generasi'. Kata 'orang' ditambahkan secara minimal agar alami dalam bahasa Indonesia, sementara kemungkinan cakupan generasi dicatat dalam catatan kaki.
- source_word: לְאֹהֲבַי
  choice: mereka yang mengasihi-Ku
  rationale: Partisipel dengan sufiks orang pertama paling alami diterjemahkan sebagai klausa relatif dan menyatakan kesetiaan relasional yang berkelanjutan.
- source_word: וּלְשֹׁמְרֵי
  choice: dan menaati
  rationale: שׁמר berarti menjaga, memelihara, atau menuruti. Dengan 'perintah-perintah' sebagai objek, 'menaati' merupakan padanan Indonesia yang paling jelas dan idiomatis.
- source_word: מִצְוֺתָי
  choice: perintah-perintah-Ku
  rationale: Bentuk jamak מצוה merujuk pada ketetapan ilahi. 'Perintah-perintah-Ku' mempertahankan register hukum-perjanjian dan bentuk jamaknya.
theological_decisions:
- issue: Cakupan לַאֲלָפִים
  choice: kepada beribu-ribu orang
  alternative: kepada seribu generasi / kepada beribu-ribu generasi
  rationale: Ayat ini tidak memuat kata Ibrani yang berarti 'generasi'. Teks utama mempertahankan bentuk sumber yang ringkas, sedangkan penafsiran generasional yang didukung oleh Ulangan 5:10 disajikan dalam catatan kaki agar ambiguitas asli tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan register luhur tetapi mudah dipahami. Kapital pada sufiks yang merujuk kepada Allah mengikuti kebiasaan ortografi Alkitab Indonesia. Susunan 'yaitu mereka' memperjelas bahwa pihak yang mengasihi dan menaati adalah penerima kasih setia tanpa menghapus kemungkinan bahwa 'ribuan' dipahami secara generasional.
