  variant: modern standard Indonesian
source:
  edition: WLC
  text: לֹ֥א תַחְמֹ֖ד בֵּ֣ית רֵעֶ֑/ךָ לֹֽא תַחְמֹ֞ד אֵ֣שֶׁת רֵעֶ֗/ךָ וְ/עַבְדּ֤/וֹ וַ/אֲמָת/וֹ֙ וְ/שׁוֹר֣/וֹ וַ/חֲמֹר֔/וֹ וְ/כֹ֖ל אֲשֶׁ֥ר לְ/רֵעֶֽ/ךָ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/017.yaml
  text: You shall not covet your neighbor’s house; you shall not covet your neighbor’s wife[a], or his male servant, or his female servant, or his ox, or his donkey, or anything that belongs to your neighbor.
translation:
  language: id
  text: Jangan mengingini rumah sesamamu; jangan mengingini istri sesamamu, budak laki-lakinya, budak perempuannya, lembunya, keledainya, atau apa pun yang menjadi milik sesamamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, "rumah tangga sesamamu." Kata Ibrani untuk "rumah" juga dapat berarti rumah tangga, walaupun dalam ayat ini "rumah" sesuai dengan daftar terpisah yang menyusul.
    reason: alternatif_leksikal
lexical_decisions:
- source_word: תַחְמֹד
  choice: mengingini
  rationale: Dalam larangan ini, חמד menunjuk pada hasrat yang salah terhadap milik orang lain. “Mengingini” alami dalam bahasa Indonesia dan, dalam konteks perintah ini, mempertahankan daya etisnya.
- source_word: בֵּית רֵעֶךָ
  choice: rumah sesamamu
  rationale: בַּיִת dapat berarti bangunan rumah atau rumah tangga. Karena istri, budak, dan hewan kemudian disebut secara terpisah, arti “rumah” paling sesuai dengan susunan ayat.
- source_word: רֵעֶךָ
  choice: sesamamu
  rationale: רֵעַ dalam hukum perjanjian menunjuk kepada orang lain dalam lingkungan komunitas. “Sesama” merupakan padanan Indonesia yang wajar dan mempertahankan dimensi etis antarmanusia.
- source_word: אֵשֶׁת רֵעֶךָ
  choice: istri sesamamu
  rationale: Frasa konstruksi ini secara langsung berarti istri dari sesama, dan bentuk Indonesia ini jelas serta alami.
- source_word: עַבְדּוֹ וַאֲמָתוֹ
  choice: budaknya yang laki-laki atau yang perempuan
  rationale: עֶבֶד dan אָמָה menunjukkan orang dalam status perbudakan, masing-masing laki-laki dan perempuan. “Budak” tidak memperhalus status sosial yang tampak jelas dalam daftar hukum ini, sedangkan pembedaan gender tetap dipertahankan.
- source_word: שׁוֹרוֹ
  choice: lembunya
  rationale: שׁוֹר menunjuk pada hewan jenis sapi, sering sebagai hewan kerja. “Lembu” merupakan padanan Indonesia yang ringkas dan cocok dalam daftar ini.
- source_word: חֲמֹרוֹ
  choice: keledainya
  rationale: “Keledai” adalah padanan modern dan jelas bagi חֲמוֹר.
- source_word: וְכֹל אֲשֶׁר לְרֵעֶךָ
  choice: atau apa pun yang menjadi milik sesamamu
  rationale: Frasa ini merupakan penutup menyeluruh. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan makna kepunyaan pada לְ.
- source_word: לֹא ... לֹא
  choice: Jangan ... jangan
  rationale: Pengulangan larangan dipertahankan agar penekanan dan susunan teks Ibrani tidak hilang.
theological_decisions:
- issue: Apakah בֵּית pada klausa pertama berarti “rumah” atau “rumah tangga”
  choice: rumah
  alternative: rumah tangga
  rationale: Walaupun בַּיִת dapat berarti rumah tangga, ayat ini selanjutnya menyebut istri, budak, dan hewan secara tersendiri. “Rumah” menghindari pengulangan cakupan dan sesuai dengan perkembangan daftar.
- issue: Penerjemahan istilah perbudakan dalam hukum perjanjian
  choice: budak laki-laki / budak perempuan
  alternative: hamba laki-laki / hamba perempuan; pelayan laki-laki / pelayan perempuan
  rationale: Dalam daftar kepunyaan ini, status keterikatan sosial menonjol. “Budak” menyampaikan status tersebut dengan lebih tepat daripada “pelayan” dan tidak memperhalus realitas teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Bentuk “jangan” memberi larangan langsung yang alami, sementara pengulangannya mempertahankan retorika Ibrani. Pronomina kepunyaan diringkas secara alami tanpa menghilangkan unsur daftar.
