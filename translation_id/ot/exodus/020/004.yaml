  text: לֹֽ֣א תַֽעֲשֶׂ֨ה לְ/ךָ֥ פֶ֨סֶל֙ וְ/כָל תְּמוּנָ֔ה אֲשֶׁ֤ר בַּ/שָּׁמַ֨יִם֙ מִ/מַּ֔עַל וַ/אֲשֶׁ֥ר בָּ/אָ֖רֶץ מִ/תָּ֑חַת וַ/אֲשֶׁ֥ר בַּ/מַּ֖יִם מִ/תַּ֥חַת לָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/004.yaml
  text: You shall not make for yourself a carved image[a], or any likeness of what is in the heavens above, or on the earth beneath[c][b], or in the waters under the earth.
translation:
  language: id
  text: Jangan membuat bagi dirimu sendiri patung pahatan[a] atau rupa apa pun[b] dari sesuatu yang ada di langit di atas, di bumi di bawah, atau di dalam air di bawah bumi.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “patung ukiran.” Kata Ibrani ini secara khusus menunjuk pada citra yang dibuat dengan memahat; “berhala” merupakan terjemahan yang lebih interpretatif.
    reason: lexical_alternative
  - marker: b
    text: Atau “bentuk apa pun” atau “gambaran apa pun.”
    reason: lexical_alternative
  - marker: c
    text: 'Ayat ini menggambarkan ranah-ranah ciptaan dengan istilah kosmologis kuno: langit di atas, bumi di bawah, dan air di bawah bumi.'
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תַעֲשֶׂה
  choice: Jangan membuat
  rationale: Bentuk imperfek Qal orang kedua tunggal dengan לֹא menyatakan larangan langsung. “Jangan membuat” alami dalam bahasa Indonesia dan mempertahankan daya perintah hukum.
- source_word: לְךָ
  choice: bagi dirimu sendiri
  rationale: Pronomina datif ini menunjukkan kepentingan pribadi dan dalam konteks berfungsi secara refleksif; ungkapan ini mempertahankan unsur tersebut tanpa menambahkan tujuan penyembahan.
- source_word: פֶסֶל
  choice: patung pahatan
  rationale: Kata ini menunjuk pada citra yang dibentuk dengan memahat. “Patung pahatan” lebih tepat secara leksikal daripada “berhala,” yang sudah menafsirkan fungsi religius benda itu.
- source_word: וְכָל תְּמוּנָה
  choice: atau rupa apa pun
  rationale: תְּמוּנָה dapat berarti rupa, bentuk, atau gambaran. “Rupa apa pun” cukup luas, alami, dan tidak membatasi larangan hanya pada satu jenis representasi.
- source_word: אֲשֶׁר בַּשָּׁמַיִם מִמַּעַל
  choice: dari sesuatu yang ada di langit di atas
  rationale: Ungkapan ini mempertahankan cakupan klausa relatif dan gambaran ruang vertikal dari teks Ibrani. “Langit” merupakan padanan Indonesia yang alami bagi bentuk Ibrani שָׁמַיִם.
- source_word: וַאֲשֶׁר בָּאָרֶץ מִתָּחַת
  choice: di bumi di bawah
  rationale: Pilihan ini mempertahankan kesejajaran kosmologis dengan “langit di atas” tanpa mempersempit אֶרֶץ menjadi tanah atau negeri.
- source_word: וַאֲשֶׁר בַּמַּיִם מִתַּחַת לָאָרֶץ
  choice: atau di dalam air di bawah bumi
  rationale: Terjemahan ini mempertahankan ranah ketiga dan gambaran spasial kuno dalam frasa Ibrani, tanpa menjelaskannya secara berlebihan di dalam teks utama.
- source_word: וְ
  choice: atau
  rationale: Konjungsi yang berulang menghubungkan unsur-unsur dalam daftar larangan. “Atau” menyampaikan hubungan disjungtif itu secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan larangan dalam perintah kedua
  choice: Ayat ini melarang pembuatan patung pahatan dan rupa dari tatanan ciptaan, tanpa menambahkan pembatasan “untuk disembah” ataupun menyatakannya sebagai larangan atas segala karya seni.
  alternative: Menerjemahkannya sebagai larangan mutlak atas setiap representasi visual, atau mempersempitnya secara eksplisit menjadi larangan membuat berhala untuk disembah.
  rationale: Teks Ibrani menyebut patung pahatan dan rupa, lalu merinci ranah ciptaan. Konteks sujud dan ibadah baru dinyatakan dalam ayat berikutnya. Karena itu, terjemahan ayat ini mempertahankan ketegangan tekstual dan tidak menyelesaikannya dengan tambahan interpretatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan khidmat. Susunan “langit di atas, bumi di bawah, dan air di bawah bumi” sengaja dipertahankan untuk mencerminkan kesejajaran dan gambaran kosmologis teks sumber. Istilah “berhala” dihindari dalam teks utama karena akan menyelesaikan pertanyaan fungsi objek secara interpretatif.
