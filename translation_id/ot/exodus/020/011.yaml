source:
  edition: WLC
  text: כִּ֣י שֵֽׁשֶׁת יָמִים֩ עָשָׂ֨ה יְהוָ֜ה אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָ֗רֶץ אֶת הַ/יָּם֙ וְ/אֶת כָּל אֲשֶׁר בָּ֔/ם וַ/יָּ֖נַח בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֑י עַל כֵּ֗ן בֵּרַ֧ךְ יְהוָ֛ה אֶת י֥וֹם הַ/שַּׁבָּ֖ת וַֽ/יְקַדְּשֵֽׁ/הוּ־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/011.yaml
  text: For in six days Yahweh made the heavens and the earth[a], the sea, and all that is in them, and he rested on the seventh day. Therefore Yahweh blessed the Sabbath day and made it holy.
translation:
  language: id
  text: Sebab dalam enam hari Yahweh menjadikan langit dan bumi, laut dan segala yang ada di dalamnya, lalu Dia beristirahat[a] pada hari ketujuh. Itulah sebabnya Yahweh memberkati hari Sabat dan menguduskannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berhenti bekerja.” Kata kerja Ibrani ini dapat menekankan masuk ke dalam keadaan istirahat atau berhenti dari pekerjaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi perintah Sabat dalam ayat sebelumnya.
- source_word: שֵׁשֶׁת יָמִים
  choice: dalam enam hari
  rationale: Ungkapan waktu ini menyatakan rentang berlangsungnya karya penciptaan tanpa menambahkan unsur yang tidak terdapat dalam bahasa Ibrani.
- source_word: עָשָׂה
  choice: menjadikan
  rationale: Dalam konteks penciptaan, kata kerja umum yang berarti melakukan atau membuat ini secara alami diterjemahkan 'menjadikan' dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri dan tidak diganti dengan gelar.
- source_word: הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: langit dan bumi
  rationale: Pasangan kosmologis ini merupakan ungkapan Indonesia yang alami dan mencakup seluruh ciptaan.
- source_word: הַיָּם
  choice: laut
  rationale: Bentuk tunggal bahasa Ibrani dipertahankan.
- source_word: כָּל אֲשֶׁר בָּם
  choice: segala yang ada di dalamnya
  rationale: Terjemahan ini mempertahankan cakupan menyeluruh dari klausa relatif Ibrani.
- source_word: וַיָּנַח
  choice: lalu Dia beristirahat
  rationale: Kata kerja נוח menyatakan beristirahat atau berhenti dari pekerjaan; 'beristirahat' paling alami dalam konteks pola Sabat, sedangkan kemungkinan nuansa berhenti bekerja dicatat dalam catatan kaki.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: pada hari ketujuh
  rationale: Ini adalah ungkapan waktu yang alami dalam bahasa Indonesia.
- source_word: עַל כֵּן
  choice: Itulah sebabnya
  rationale: Ungkapan ini menandai kesimpulan yang ditarik dari pola penciptaan.
- source_word: בֵּרַךְ
  choice: memberkati
  rationale: Terjemahan langsung ini menyatakan bahwa Yahweh menganugerahkan berkat kepada hari tersebut.
- source_word: וַיְקַדְּשֵׁהוּ
  choice: dan menguduskannya
  rationale: Akhiran objek tunggal merujuk kepada hari Sabat; 'menguduskan' mempertahankan gagasan menetapkan sebagai kudus.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai nama perjanjian secara langsung; bentuk 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Gambaran tentang tindakan Allah pada hari ketujuh
  choice: Dia beristirahat
  alternative: Dia berhenti bekerja
  rationale: Kata kerja נוח mendukung gagasan beristirahat atau menetap dalam keadaan istirahat setelah bekerja. Terjemahan utama mempertahankan pola Sabat tanpa menyiratkan kelelahan, sedangkan nuansa berhenti bekerja disediakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur sebab-akibat dipertahankan dengan 'Sebab' dan 'Itulah sebabnya'. Pronomina 'Dia' digunakan secara wajar dan mudah dipahami; tanda catatan kaki ditempatkan langsung setelah frasa yang diterangkannya.
