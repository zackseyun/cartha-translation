  text: אָֽנֹכִ֖י יְהוָ֣ה אֱלֹהֶ֑י/ךָ אֲשֶׁ֧ר הוֹצֵאתִ֛י/ךָ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/002.yaml
  text: I am Yahweh your God[a], who brought you out from the land of Egypt[b], from the house of servants.
translation:
  language: id
  text: Akulah Yahweh,[a] Allahmu, yang membawa engkau keluar dari tanah Mesir, dari rumah para budak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani YHWH, yang secara tradisional diterjemahkan “TUHAN”; nama ini juga ditransliterasikan “Yahweh.”
    reason: alternative_reading
lexical_decisions:
- source_word: אָֽנֹכִי
  choice: Akulah
  rationale: Pronomina orang pertama mandiri ini bersifat menegaskan. Bentuk “Akulah” mempertahankan penekanan dalam klausa nominal Ibrani sekaligus terdengar wajar dan khidmat dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks sumber tetap tampak, bukan diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Walaupun bentuk dasar אֱלֹהִים secara morfologis berbentuk jamak, konteks dan sufiks tunggal merujuk kepada Allah Israel. “Allahmu” menyampaikan bentuk tunggal dan kepemilikan orang kedua tunggal.
- source_word: אֲשֶׁר
  choice: yang
  rationale: Partikel relatif ini secara alami diterjemahkan “yang” untuk memperkenalkan klausa yang menerangkan Yahweh.
- source_word: הוֹצֵאתִיךָ
  choice: membawa engkau keluar
  rationale: Bentuk Hifil dari יצא berarti menyebabkan keluar atau membawa keluar. “Membawa engkau keluar” mempertahankan tindakan pembebasan oleh Yahweh dan sapaan orang kedua tunggal.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: dari tanah Mesir
  rationale: Kata depan מן menunjukkan asal, sedangkan אֶרֶץ mempertahankan ungkapan geografis “tanah Mesir.”
- source_word: מִבֵּית עֲבָדִים
  choice: dari rumah perbudakan
  rationale: Secara harfiah ungkapan ini adalah “dari rumah para budak,” tetapi dalam konteks penindasan Mesir, “rumah perbudakan” menyampaikan idiom tersebut dengan jelas dan alami sambil mempertahankan citra “rumah.” Bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama YHWH secara langsung. Transliterasi “Yahweh” mempertahankan nama perjanjian itu, sedangkan padanan tradisional Indonesia dicatat sebagai alternatif.
- issue: Makna עֲבָדִים dalam konteks penindasan di Mesir
  choice: perbudakan
  alternative: para budak
  rationale: Konteksnya adalah keterikatan dan kerja paksa bangsa Israel. “Perbudakan” menyatakan keadaan yang dimaksud secara idiomatis; terjemahan konkret dan harfiahnya tetap disediakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Engkau” dipakai karena sufiks Ibrani berbentuk orang kedua tunggal dan konteksnya adalah sabda langsung ilahi. Susunan berulang “dari ... dari ...” dipertahankan untuk mencerminkan paralelisme sumber.
