base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/012.yaml
  text: Honor your father and your mother[b][a], so that your days may be long on the land that Yahweh your God is giving you.
translation:
  language: id
  text: Hormatilah ayahmu dan ibumu, supaya umurmu panjang[a] di negeri[b] yang sedang Yahweh, Allahmu, berikan kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “supaya hari-harimu menjadi panjang,” yaitu supaya engkau hidup lama.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “di atas tanah”; dalam konteks ini, tanah itu adalah negeri yang Yahweh berikan kepadamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּבֵּד
  choice: Hormatilah
  rationale: Bentuk imperatif piel menuntut agar ayah dan ibu diperlakukan sebagai pribadi yang berbobot dan layak dihormati. “Hormatilah” alami dalam bahasa Indonesia dan lebih kuat daripada sekadar “hargailah”.
- source_word: אָבִיךָ וְאֶת אִמֶּךָ
  choice: ayahmu dan ibumu
  rationale: Padanan langsung dan alami untuk kedua nomina tunggal dengan sufiks orang kedua maskulin tunggal.
- source_word: לְמַעַן
  choice: supaya
  rationale: Menandai tujuan atau hasil dan menghubungkan perintah dengan hasil yang dijanjikan tanpa menentukan lebih jauh hubungan kausalnya.
- source_word: יַאֲרִכוּן יָמֶיךָ
  choice: umurmu panjang
  rationale: Secara harfiah berarti “hari-harimu menjadi panjang,” sebuah ungkapan Ibrani untuk hidup lama. Padanan ini menyampaikan maksudnya secara wajar dalam bahasa Indonesia.
- source_word: עַל הָאֲדָמָה
  choice: di negeri
  rationale: Dalam konteks tanah yang Allah berikan kepada Israel, אֲדָמָה menunjuk pada negeri, bukan sekadar tanah atau permukaan bumi. “Di” merupakan ungkapan lokasi yang paling alami dalam bahasa Indonesia, sementara nuansa harfiah preposisi dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH dan tidak menggantinya dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Padanan baku untuk bentuk dengan sufiks orang kedua tunggal dan sesuai dengan sapaan langsung kepada Israel.
- source_word: נֹתֵן לָךְ
  choice: sedang diberikan ... kepadamu
  rationale: Partisipel Ibrani dapat menunjukkan tindakan yang berlangsung atau segera terwujud. Bentuk ini mempertahankan nuansa pemberian yang sedang berlangsung dalam latar Sinai.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama perjanjian itu secara langsung; transliterasi “Yahweh” mempertahankan perbedaannya dari gelar אֲדֹנָי.
- issue: Cakupan הָאֲדָמָה dalam janji
  choice: negeri
  alternative: tanah; bumi
  rationale: Klausa “yang sedang diberikan ... kepadamu” dalam konteks Sinai menunjuk pada negeri yang diberikan kepada Israel. Pilihan ini mempertahankan latar historis-perjanjian tanpa menambahkan kata “perjanjian” atau “yang dijanjikan” yang tidak tersurat.
- issue: Hubungan yang diperkenalkan לְמַעַן
  choice: supaya
  alternative: agar; sehingga
  rationale: Kata Ibrani dapat membawa nuansa tujuan dan hasil. “Supaya” mempertahankan hubungan itu tanpa secara tegas membatasi maknanya hanya pada salah satunya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “Hormatilah” mempertahankan daya perintah; “umurmu panjang” mengalihkan idiom Ibrani secara alami; susunan “Yahweh, Allahmu” menjaga identitas nama ilahi dan relasi perjanjian.
