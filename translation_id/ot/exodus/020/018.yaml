  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/כָל הָ/עָם֩ רֹאִ֨ים אֶת הַ/קּוֹלֹ֜ת וְ/אֶת הַ/לַּפִּידִ֗ם וְ/אֵת֙ ק֣וֹל הַ/שֹּׁפָ֔ר וְ/אֶת הָ/הָ֖ר עָשֵׁ֑ן וַ/יַּ֤רְא הָ/עָם֙ וַ/יָּנֻ֔עוּ וַ/יַּֽעַמְד֖וּ מֵֽ/רָחֹֽק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/020/018.yaml
  text: All the people were seeing the thunder and the flashes of fire[a], and the sound of the trumpet, and the mountain smoking; and when the people saw it[c][b], they trembled and stood at a distance.
translation:
  language: id
  text: Seluruh bangsa itu sedang melihat[a] guruh[b], kilatan-kilatan api[c], bunyi sangkakala, dan gunung yang berasap. Ketika bangsa itu melihat semuanya, mereka gemetar dan berdiri jauh-jauh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani mengatakan bahwa bangsa itu sedang “melihat” berbagai gejala yang juga mencakup bunyi, sehingga mempertahankan kesan indrawi yang luar biasa dalam peristiwa ini.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “bunyi-bunyi” atau “suara-suara”; dalam konteks ini kemungkinan besar yang dimaksud ialah guruh.'
    reason: lexical_alternative
  - marker: c
    text: Atau “obor-obor”; dalam konteks ini istilah tersebut kemungkinan menunjuk kepada kilatan api yang menyerupai kilat.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹאִים
  choice: sedang melihat
  rationale: Partisipel Ibrani memberi nuansa tindakan yang sedang berlangsung. Kata 'melihat' dipertahankan meskipun objeknya mencakup bunyi, sehingga gambaran indrawi yang mencolok dalam teks sumber tidak dihaluskan.
- source_word: הַקּוֹלֹת
  choice: guruh
  rationale: Secara harfiah berarti 'bunyi-bunyi' atau 'suara-suara', tetapi dalam konteks penampakan di Sinai bentuk jamak ini paling wajar menunjuk kepada guruh.
- source_word: הַלַּפִּידִם
  choice: kilatan-kilatan api
  rationale: Kata ini secara harfiah dapat berarti 'obor-obor'. Dalam konteks teofani, ungkapan ini menggambarkan kilatan berapi yang menyerupai kilat tanpa membatasi maknanya hanya pada fenomena cuaca biasa.
- source_word: קוֹל הַשֹּׁפָר
  choice: bunyi sangkakala
  rationale: Frasa ini secara langsung menyatakan bunyi alat tiup tanduk. 'Sangkakala' merupakan padanan Indonesia yang alami dan bermartabat dalam konteks ini.
- source_word: הָהָר עָשֵׁן
  choice: gunung yang berasap
  rationale: Ungkapan predikatif ini menggambarkan gunung dalam keadaan mengeluarkan atau diliputi asap; bentuk ini jelas dan alami dalam bahasa Indonesia.
- source_word: וַיַּרְא הָעָם
  choice: ketika bangsa itu melihat semuanya
  rationale: Klausa ini mengulang tindakan melihat sebelum menyatakan reaksi bangsa itu. 'Semuanya' merujuk secara kolektif kepada seluruh gejala yang baru disebutkan dan membuat hubungan antarklausa alami.
- source_word: וַיָּנֻעוּ
  choice: mereka gemetar
  rationale: Kata kerja ini menyatakan gerakan mengguncang atau bergoyang, dan dalam konteks respons ketakutan paling tepat diterjemahkan 'gemetar'.
- source_word: וַיַּעַמְדוּ מֵרָחֹק
  choice: berdiri jauh-jauh
  rationale: Ungkapan ini menyatakan bahwa mereka mengambil posisi pada jarak tertentu. 'Berdiri jauh-jauh' dekat dengan bentuk Ibrani sekaligus alami dalam bahasa Indonesia.
- source_word: וְכָל הָעָם
  choice: seluruh bangsa itu
  rationale: הָעָם menunjuk kepada umat Israel sebagai satu kelompok kolektif; 'seluruh bangsa itu' menyampaikan cakupan keseluruhannya dengan jelas.
theological_decisions:
- issue: Bahasa indrawi yang menyatakan bahwa bangsa itu 'melihat' gejala yang mencakup bunyi
  choice: Mempertahankan kata 'melihat' dengan objek 'guruh' dan 'bunyi sangkakala'
  alternative: Menormalkannya menjadi 'mendengar guruh' atau 'merasakan semua gejala itu'
  rationale: Teks Ibrani memadukan penglihatan dan pendengaran secara mencolok dalam penggambaran penampakan ilahi yang dahsyat. Terjemahan mempertahankan ketegangan ini dan menjelaskannya melalui catatan kaki, alih-alih diam-diam menghapusnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada yang bermartabat dan mudah dipahami. Susunan kalimat mempertahankan urutan gejala dalam teks Ibrani. Bentuk 'sedang melihat' menjaga aspek berlangsung dari partisipel, sedangkan 'melihat guruh' sengaja dipertahankan sebagai ungkapan yang mencolok dan dijelaskan dalam catatan kaki.
