  yaml_path: translation/ot/exodus/020/008.yaml
  text: Remember the Sabbath day[a], to keep it holy.
translation:
  language: id
  text: Ingatlah hari Sabat untuk menguduskannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk menjaganya tetap kudus” atau “untuk menetapkannya sebagai hari yang kudus.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכוֹר
  choice: Ingatlah
  rationale: Imperatif Qal tunggal dari זכר memerintahkan tindakan mengingat secara aktif. “Ingatlah” merupakan padanan langsung, alami, dan tetap mempertahankan daya perintah dalam konteks perjanjian.
- source_word: אֶת
  choice: '[penanda objek langsung, tidak diterjemahkan]'
  rationale: Partikel ini menandai objek langsung tertentu dalam bahasa Ibrani dan tidak memerlukan padanan tersendiri dalam bahasa Indonesia.
- source_word: יוֹם
  choice: hari
  rationale: Padanan baku dan langsung untuk יוֹם dalam konteks ini.
- source_word: הַשַּׁבָּת
  choice: hari Sabat
  rationale: Mengacu pada hari Sabat tertentu yang dikenal dalam perjanjian. “Hari Sabat” merupakan ungkapan baku dalam bahasa Indonesia dan mempertahankan makna serta penggunaan alkitabiahnya.
- source_word: לְקַדְּשׁוֹ
  choice: dengan menguduskannya
  rationale: 'Infinitif konstruk dengan sufiks orang ketiga maskulin tunggal dari קדשׁ menyatakan tujuan atau cara: hari Sabat diingat dengan menjadikannya atau memperlakukannya sebagai kudus. “Dengan menguduskannya” alami dalam konteks perintah ini dan mempertahankan bobot teologis akar קדשׁ.'
theological_decisions:
- issue: Penerjemahan bahasa קדשׁ dalam perintah mengenai hari Sabat
  choice: dengan menguduskannya
  alternative: untuk menjaganya tetap kudus; dengan menetapkannya sebagai hari yang kudus
  rationale: Bahasa Ibrani dapat menunjuk pada menjadikan, memperlakukan, atau menetapkan hari itu sebagai kudus. Pilihan ini mempertahankan konsep pengudusan tanpa mempersempitnya menjadi sekadar pelaksanaan ritual, sementara catatan kaki menyajikan nuansa alternatif yang sah.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Bentuk “Ingatlah” mempertahankan imperatif tunggal, sedangkan “hari Sabat” mengikuti istilah alkitabiah yang telah dikenal luas.
