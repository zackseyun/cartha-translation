lexical_decisions:
- source_word: לֹא
  choice: Jangan
  rationale: Negasi לֹא dengan bentuk verba imperfek orang kedua dalam konteks hukum menyatakan larangan tegas. Dalam bahasa Indonesia modern, “Jangan” merupakan bentuk larangan yang paling alami dan langsung.
- source_word: תִּנְאָף
  choice: berzina
  rationale: Verba נאף dalam qal berarti melakukan zina. “Berzina” adalah padanan baku, ringkas, dan tepat dalam konteks hukum serta mempertahankan bobot moral perintah ini.
theological_decisions:
- issue: Gaya larangan dalam Sepuluh Perintah
  choice: Jangan berzina.
  alternative: Engkau tidak boleh berzina.
  rationale: Bahasa Ibrani memakai לֹא dengan verba imperfek orang kedua tunggal untuk larangan perjanjian. “Jangan berzina” menyampaikan daya larangan yang tegas dan tetap secara lebih alami dalam bahasa Indonesia modern, tanpa mengurangi kekhidmatannya.
- issue: Cakupan bentuk maskulin tunggal orang kedua
  choice: Larangan langsung tanpa subjek yang dinyatakan
  alternative: Janganlah engkau berzina.
  rationale: Bentuk Ibrani secara gramatikal maskulin tunggal, tetapi berfungsi sebagai sapaan representatif kepada anggota umat perjanjian. Bentuk imperatif Indonesia “Jangan berzina” tidak menambahkan pembatasan gender dan tetap mempertahankan sapaan langsung.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, tegas, dan khidmat. Tidak diperlukan penanda catatan kaki karena tidak ada ambiguitas tekstual atau leksikal yang perlu dijelaskan dalam teks.
