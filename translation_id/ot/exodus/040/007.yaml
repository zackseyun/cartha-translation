base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/007.yaml
  text: And you shall place the basin between the tent of meeting and the altar[a], and you shall put water there.
translation:
  language: id
  text: Tempatkanlah bak pembasuhan[a] di antara Kemah Pertemuan dan mazbah, lalu taruhlah air di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini secara tradisional juga diterjemahkan “bejana pembasuhan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Tempatkanlah
  rationale: Bentuk ini menyampaikan perintah kepada Musa, sedangkan verba נָתַן dalam konteks penataan perlengkapan berarti menaruh atau menempatkan secara sengaja.
- source_word: הַכִּיֹּר
  choice: bak pembasuhan
  rationale: כִּיּוֹר menunjuk pada wadah besar berisi air untuk pembasuhan dalam pelayanan Kemah Suci. 'Bak pembasuhan' jelas bagi pembaca modern dan menyatakan fungsinya tanpa memakai istilah kuno.
- source_word: בֵּין אֹהֶל מוֹעֵד וּבֵין הַמִּזְבֵּחַ
  choice: di antara Kemah Pertemuan dan mazbah
  rationale: Susunan בֵּין...וּבֵין menyatakan letak di antara dua benda. 'Kemah Pertemuan' merupakan padanan transparan bagi אֹהֶל מוֹעֵד, dan 'mazbah' adalah istilah Indonesia yang tepat untuk tempat persembahan korban.
- source_word: וְנָתַתָּ שָׁם מָיִם
  choice: lalu taruhlah air di sana
  rationale: Terjemahan ini mempertahankan שָׁם, 'di sana', dan tidak menambahkan objek 'ke dalamnya' yang tidak dinyatakan secara eksplisit dalam bahasa Ibrani. 'Lalu' mengungkapkan kelanjutan instruksi secara alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas dengan nada instruksional yang khidmat. Istilah kultis dipertahankan sejauh masih dapat dipahami; kapitalisasi 'Kemah Pertemuan' menandainya sebagai sebutan khusus. Frasa 'di sana' sengaja dipertahankan agar tidak mempersempit acuan Ibrani secara tidak perlu.
