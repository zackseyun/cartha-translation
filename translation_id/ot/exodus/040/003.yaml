base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/003.yaml
  text: And you shall place there the ark of the testimony[b][a], and you shall screen the ark with the curtain.
translation:
  language: id
  text: Tempatkanlah di sana tabut kesaksian, lalu pasanglah tirai untuk menyekat tabut itu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "tabir". Kata Ibrani פָּרֹכֶת menunjuk pada tirai bagian dalam Kemah Suci yang menyekat ruang tempat tabut berada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Tempatkanlah
  rationale: Bentuk perfektum Qal dengan waw dalam rangkaian petunjuk berfungsi sebagai perintah kepada Musa. Bentuk ini alami dan tegas dalam bahasa Indonesia.
- source_word: שָׁם
  choice: di sana
  rationale: Mempertahankan penunjukan tempat yang merujuk kepada Kemah Suci yang telah disebut dalam konteks, tanpa memperjelas secara berlebihan.
- source_word: אֲרוֹן הָעֵדוּת
  choice: tabut kesaksian
  rationale: Menerjemahkan unsur עֵדוּת sebagai 'kesaksian' sesuai teks Ibrani, bukan mengharmonisasikannya menjadi 'perjanjian'. 'Tabut' adalah istilah Indonesia yang mapan untuk peti suci ini.
- source_word: וְסַכֹּתָ עַל הָאָרֹן
  choice: lalu pisahkanlah tabut itu dari pandangan
  rationale: Kata kerja סכך berarti menutupi, melindungi, atau menyekat. Dalam tata ruang Kemah Suci, tirai tidak dibentangkan di atas tabut, melainkan menjadi penyekat yang menutupi tabut dari pandangan; ungkapan ini menyampaikan fungsi spasial tersebut secara alami.
- source_word: הַפָּרֹכֶת
  choice: tirai
  rationale: פָּרֹכֶת menunjuk pada tirai bagian dalam Kemah Suci yang menyekat ruang tabut. 'Tirai' merupakan padanan modern yang jelas; alternatif tradisional 'tabir' dicatat dalam catatan kaki.
theological_decisions:
- issue: Istilah אֲרוֹן הָעֵדוּת
  choice: tabut kesaksian
  alternative: tabut perjanjian
  rationale: Teks Ibrani ayat ini secara eksplisit memakai עֵדוּת, 'kesaksian'. Terjemahan mempertahankan istilah sumber dan tidak menggantinya dengan sebutan teologis yang lebih familier dari konteks lain.
- issue: Fungsi פָּרֹכֶת
  choice: tirai
  alternative: tabir
  rationale: Pilihan 'tirai' mengutamakan kejelasan bagi pembaca modern, sedangkan 'tabir' tetap sah dan memiliki resonansi tradisional sehingga dicantumkan sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk perintah mempertahankan rangkaian instruksi kepada Musa. Susunan kalimat dibuat alami tanpa memberi kesan bahwa tirai diletakkan langsung di atas tabut.
