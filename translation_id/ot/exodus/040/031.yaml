translation:
  language: id
  text: Dari bejana itu Musa, Harun, dan putra-putranya membasuh tangan dan kaki mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan itu”; secara lebih harfiah bahasa Ibrani berbunyi “dari itu,” yang merujuk kepada bejana pembasuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחֲצוּ
  choice: membasuh
  rationale: Bentuk wayyiqtol Qal dari רחץ menyampaikan tindakan lampau berurutan; dalam konteks ritual, “membasuh” terdengar alami dan bermartabat.
- source_word: מִמֶּנּוּ
  choice: Dari bejana itu
  rationale: Preposisi מן dengan sufiks orang ketiga maskulin tunggal secara harfiah berarti “dari itu” dan merujuk kembali kepada bejana pembasuhan; nomina “bejana” diperjelas agar rujukannya alami dalam bahasa Indonesia.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk baku nama ini dalam bahasa Indonesia.
- source_word: וְאַהֲרֹן
  choice: Harun
  rationale: Bentuk baku nama ini dalam bahasa Indonesia; konjungsi diwujudkan dalam rangkaian daftar.
- source_word: וּבָנָיו
  choice: dan anak-anaknya
  rationale: בנים dengan sufiks tunggal merujuk kepada putra-putra Harun dalam konteks keimaman. Bahasa Indonesia lazim memakai “anak-anaknya”; konteks telah menentukan bahwa mereka laki-laki.
- source_word: אֶת יְדֵיהֶם
  choice: tangan mereka
  rationale: Padanan langsung bagi bentuk jamak dengan sufiks orang ketiga jamak.
- source_word: וְאֶת רַגְלֵיהֶם
  choice: dan kaki mereka
  rationale: Mempertahankan pasangan anggota tubuh yang disebutkan dalam bahasa Ibrani.
