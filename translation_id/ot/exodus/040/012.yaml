  text: Kemudian bawalah Harun dan putra-putranya mendekat ke pintu masuk Kemah Pertemuan dan basuhlah mereka dengan air.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: bawalah ... mendekat
  rationale: Bentuk Hifil dari קרב menyatakan tindakan menyebabkan seseorang datang dekat. Ungkapan ini mempertahankan makna kausatif dan nuansa ritualnya.
- source_word: אַהֲרֹן
  choice: Harun
  rationale: Mengikuti bentuk nama yang baku dan luas dikenal dalam Alkitab berbahasa Indonesia.
- source_word: בָּנָיו
  choice: anak-anaknya
  rationale: Dalam konteks penahbisan imam, bentuk ini merujuk kepada putra-putra Harun. 'Anak-anaknya' merupakan ungkapan Indonesia yang alami, dan konteks memperjelas rujukan laki-lakinya.
- source_word: פֶּתַח
  choice: pintu
  rationale: Dalam konteks kemah, 'pintu' secara alami menunjuk tempat masuk atau bukaan akses, tanpa menyiratkan rincian bentuk yang tidak dinyatakan.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Padanan baku dan jelas bagi istilah tempat kudus tempat pertemuan, dengan kapitalisasi sebagai sebutan khusus.
- source_word: וְרָחַצְתָּ
  choice: basuhlah
  rationale: רחץ berarti mencuci atau membasuh. 'Basuhlah' sesuai dengan tindakan ritual dan tidak menentukan cara yang lebih khusus daripada teks.
- source_word: אֹתָם
  choice: mereka
  rationale: Kata ganti ini merujuk bersama-sama kepada Harun dan anak-anaknya.
- source_word: בַּמָּיִם
  choice: dengan air
  rationale: 'Preposisi ב dipahami secara instrumental: air adalah sarana pembasuhan. Ini juga merupakan ungkapan Indonesia yang alami.'
