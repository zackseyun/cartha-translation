  - severity: low
    issue: '''pintu'' dapat diperjelas menjadi ''pintu masuk.'''
    rationale: פֶּתַח menunjuk bukaan atau tempat masuk. 'Pintu masuk' merupakan padanan Indonesia yang lebih jelas dan tetap setia, tanpa mengandaikan jenis struktur pintunya.
