  text: And you shall clothe Aaron with the holy garments[a], and you shall anoint him and consecrate him, and he shall serve as priest to me.
translation:
  language: id
  text: Pakaikanlah pakaian kudus kepada Harun, urapilah dia dan kuduskanlah dia, lalu ia akan melayani sebagai imam bagi-Ku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “lalu ia akan menjalankan jabatan imam bagi-Ku.” Kata kerja Ibrani yang dipakai berarti berfungsi atau melayani sebagai imam.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִלְבַּשְׁתָּ
  choice: Pakaikanlah
  rationale: 'Bentuk Hifil dari לבשׁ bersifat kausatif: Musa harus mengenakan pakaian itu pada Harun. Bentuk imperatif ini alami dalam konteks rangkaian petunjuk.'
- source_word: אַהֲרֹן
  choice: Harun
  rationale: Menggunakan bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: pakaian kudus
  rationale: Frasa konstruksi ini secara harfiah berarti 'pakaian kekudusan'. 'Pakaian kudus' alami dalam bahasa Indonesia dan mempertahankan makna khusus bagi ibadah.
- source_word: וּמָשַׁחְתָּ
  choice: urapilah
  rationale: Mengungkapkan tindakan ritual pengurapan dalam pelantikan imam tanpa menambahkan penafsiran.
- source_word: וְקִדַּשְׁתָּ
  choice: kuduskanlah
  rationale: Piel קדשׁ menyatakan tindakan mengkhususkan seseorang bagi pelayanan kudus. Pilihan ini mempertahankan kaitan leksikal dengan kekudusan dan membedakannya dari pengurapan.
- source_word: וְכִהֵן
  choice: lalu ia akan melayani sebagai imam
  rationale: Kata kerja כהן berarti menjalankan fungsi atau pelayanan imam. 'Lalu' menandai hasil dalam urutan tindakan tanpa mengubahnya menjadi klausa tujuan yang terlalu eksplisit.
- source_word: לִי
  choice: bagi-Ku
  rationale: Preposisi ini menyatakan bahwa pelayanan imam ditujukan kepada TUHAN. 'Bagi-Ku' lebih alami daripada 'kepada-Ku' dalam konstruksi Indonesia ini.
theological_decisions:
- issue: Bahasa pelantikan imam
  choice: Pengurapan dan pengudusan dipertahankan sebagai dua tindakan yang berbeda tetapi berkaitan.
  alternative: Meringkas keduanya dengan istilah seperti 'menahbiskan'.
  rationale: Teks Ibrani menyebut secara berurutan tindakan mengenakan pakaian, mengurapi, menguduskan, dan pelayanan sebagai imam. Mempertahankan tiap tindakan menghindari pemasukan kategori jabatan keagamaan yang lebih kemudian.
- issue: Daya sintaksis וְכִהֵן לִי
  choice: lalu ia akan melayani sebagai imam bagi-Ku
  alternative: supaya ia melayani sebagai imam bagi-Ku
  rationale: Setelah rangkaian verba orang kedua, verba orang ketiga dapat dipahami sebagai hasil tindakan sebelumnya. 'Lalu' mempertahankan alur koordinatif dan nuansa hasil tanpa menetapkan hubungan tujuan secara mutlak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk imperatif dipakai sesuai konteks petunjuk ilahi; pronomina yang merujuk kepada Allah ditulis dengan huruf kapital menurut kebiasaan ejaan teks keagamaan Indonesia.
