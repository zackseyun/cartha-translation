  text: Then he spread the tent over the tabernacle and put the covering of the tent over it from above, just as Yahweh had commanded Moses.
translation:
  language: id
  text: Kemudian Musa membentangkan kemah itu di atas Kemah Suci dan memasang tudung kemah itu di atasnya, seperti yang Yahweh perintahkan kepada Musa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְרֹשׂ
  choice: membentangkan
  rationale: Verba פרשׂ menyatakan tindakan membentangkan atau menghamparkan suatu lapisan; “membentangkan” alami dalam bahasa Indonesia dan tidak menambahkan gagasan mendirikan yang tidak dinyatakan secara langsung.
- source_word: הָאֹהֶל
  choice: kemah itu
  rationale: אֹהֶל pada dasarnya berarti “kemah” dan di sini menunjuk pada lapisan kemah yang dibentangkan di atas struktur Kemah Suci; pilihan ini mempertahankan pembedaan dari מִכְסֶה, “tudung”.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: מִשְׁכָּן secara harfiah berkaitan dengan tempat kediaman, tetapi dalam konteks Keluaran menunjuk pada tempat kudus portabel Israel. “Kemah Suci” merupakan istilah Indonesia yang jelas, wajar, dan membedakannya dari lapisan אֹהֶל.
- source_word: וַיָּשֶׂם
  choice: memasang
  rationale: שׂים berarti menaruh, menempatkan, atau memasang. Dalam konteks penempatan tudung pada bagian atas struktur, “memasang” menyampaikan tindakan tersebut secara alami.
- source_word: מִכְסֵה הָאֹהֶל
  choice: tudung kemah itu
  rationale: מִכְסֶה adalah lapisan penutup. “Tudung kemah” ringkas dan mempertahankan perbedaannya dari kemah itu sendiri tanpa terdengar seperti penutup pintu atau kain biasa.
- source_word: עָלָיו מִלְמָעְלָה
  choice: di bagian paling atas
  rationale: Gabungan עָלָיו dan מִלְמָעְלָה menekankan letak tudung di atas struktur. Ungkapan Indonesia ini menghindari pengulangan janggal “di atasnya dari atas” sambil mempertahankan hubungan spasialnya.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: tepat seperti yang diperintahkan Yahweh kepadanya
  rationale: כַּאֲשֶׁר menandai kesesuaian tindakan Musa dengan perintah sebelumnya. “Tepat seperti” menonjolkan kesesuaian itu, sedangkan “kepadanya” secara alami merujuk kembali kepada Musa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan bentuk nama tersebut dan tidak menggantinya dengan gelar.
- issue: Subjek tersirat pada verba orang ketiga maskulin tunggal
  choice: Musa
  alternative: ia/dia
  rationale: Subjek kedua verba tidak disebutkan ulang dalam ayat ini, tetapi konteks langsung mengidentifikasinya sebagai Musa. Menyebut “Musa” membuat kalimat Indonesia mandiri dan jelas tanpa mengubah rujukan kontekstual.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Istilah “Kemah Suci” dipakai untuk מִשְׁכָּן, sedangkan “kemah” dan “tudung” mempertahankan tiga unsur konstruksi yang dibedakan dalam teks Ibrani. Tidak diperlukan catatan kaki.
