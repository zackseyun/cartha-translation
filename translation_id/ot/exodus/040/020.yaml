base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/020.yaml
  text: Then he took the testimony and put it into the ark[a], and he set the poles on the ark[b], and he placed the mercy seat on the ark above.
translation:
  language: id
  text: Lalu ia mengambil Kesaksian itu dan menaruhnya ke dalam tabut[a]. Ia memasang kayu-kayu pengusung pada tabut itu, lalu menempatkan tutup pendamaian[b] di atas tabut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lempeng-lempeng Kesaksian.” Dalam bahasa Ibrani, “Kesaksian” adalah istilah khusus bagi apa yang ditempatkan di dalam tabut.
    reason: lexical_alternative
  - marker: b
    text: Atau “takhta pendamaian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵדֻת
  choice: Kesaksian itu
  rationale: Mempertahankan istilah teknis Ibrani bagi kesaksian perjanjian yang dimasukkan ke dalam tabut. Konteks menunjukkan benda konkret, kemungkinan besar lempeng-lempeng batu, tetapi teks tidak menyebutkannya secara eksplisit.
- source_word: הָאָרֹן
  choice: tabut
  rationale: Dalam konteks Kemah Suci, אָרוֹן menunjuk pada tabut suci. 'Tabut' merupakan padanan Indonesia yang lazim tanpa menambahkan keterangan 'perjanjian' yang tidak terdapat dalam ayat ini.
- source_word: הַבַּדִּים
  choice: kayu-kayu pengusung
  rationale: Istilah ini menunjuk pada batang-batang yang dipakai untuk mengusung tabut. Padanan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: הַכַּפֹּרֶת
  choice: tutup pendamaian
  rationale: Istilah ini menamai tutup emas khusus di atas tabut dan mengandung makna ritual pendamaian. 'Tutup pendamaian' mempertahankan fungsi fisik maupun bobot kultisnya.
- source_word: מִלְמָעְלָה
  choice: di atas tabut
  rationale: Ungkapan ini menunjukkan bahwa tutup pendamaian ditempatkan pada bagian atas tabut. Penyebutan ulang 'tabut' menghasilkan bahasa Indonesia yang jelas tanpa mengubah hubungan spasial dalam teks.
- source_word: וַיִּתֵּן ... אֶל
  choice: menaruhnya ke dalam
  rationale: Dalam konteks tindakan fisik ini, נתן dengan אֶל berarti menaruh atau menempatkan sesuatu ke dalam suatu wadah.
- source_word: וַיָּשֶׂם ... עַל
  choice: memasang ... pada
  rationale: Kata kerja ini menggambarkan penempatan kayu-kayu pengusung pada posisi yang semestinya di tabut; 'memasang' merupakan ungkapan Indonesia yang alami.
theological_decisions:
- issue: Acuan 'Kesaksian'
  choice: Mempertahankan sebutan kultis 'Kesaksian itu' tanpa secara langsung menggantinya dengan lempeng-lempeng batu.
  alternative: lempeng-lempeng Kesaksian; lempeng-lempeng perjanjian
  rationale: Tindakan memasukkannya ke dalam tabut menunjukkan acuan konkret, tetapi bahasa Ibraninya memakai istilah teknis עֵדוּת dan tidak secara eksplisit menyebut lempeng-lempeng. Terjemahan mempertahankan ketegangan ini.
- issue: Makna כַּפֹּרֶת
  choice: tutup pendamaian
  alternative: takhta pendamaian; tutup pengampunan
  rationale: Kata tersebut menunjuk pada benda khusus yang menutupi tabut sekaligus berkaitan erat dengan ritus pendamaian. Pilihan ini tidak mereduksinya menjadi sekadar tutup biasa dan tidak memaksakan gambaran takhta yang tidak dinyatakan langsung oleh katanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Kalimat dibagi agar rangkaian tindakan mudah diikuti. Istilah teknis 'Kesaksian' dipertahankan dan dijelaskan dalam catatan kaki; 'kayu-kayu pengusung' dipilih karena lebih mudah dipahami daripada bentuk yang lebih arkais.
