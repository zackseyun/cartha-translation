base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/006.yaml
  text: And you shall place the altar of burnt offering before the entrance of the tabernacle[a], the tent of meeting.
translation:
  language: id
  text: Lalu tempatkanlah mazbah kurban bakaran di depan pintu masuk Kemah Suci, yaitu Kemah Pertemuan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga diterjemahkan: “di hadapan pintu masuk Kemah Suci, yaitu Kemah Pertemuan.”'
    reason: לִפְנֵי dapat diungkapkan sebagai “di depan” atau “di hadapan”; keduanya menyatakan letak mazbah pada sisi muka pintu masuk.
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Lalu tempatkanlah
  rationale: Dalam konteks petunjuk penataan Kemah Suci, נתן berarti menaruh atau menempatkan. Bentuk perintah “tempatkanlah” menyampaikan fungsi bentuk Ibrani dengan wajar; “lalu” menghubungkannya dengan rangkaian instruksi sebelumnya.
- source_word: מִזְבַּח הָעֹלָה
  choice: mazbah kurban bakaran
  rationale: מִזְבֵּחַ adalah tempat persembahan kurban, dan עֹלָה ialah kurban yang dibakar seluruhnya. “Mazbah kurban bakaran” mempertahankan istilah ibadah yang dikenal sekaligus menyatakan jenis kurbannya dengan jelas.
- source_word: לִפְנֵי
  choice: di depan
  rationale: Makna spasial לִפְנֵי di sini paling alami diterjemahkan “di depan,” yakni pada sisi muka atau di hadapan pintu masuk.
- source_word: פֶּתַח
  choice: pintu masuk
  rationale: פֶּתַח menunjuk pada bukaan atau jalan masuk. “Pintu masuk” jelas dan alami dalam bahasa Indonesia modern tanpa mengharuskan adanya daun pintu.
- source_word: מִשְׁכַּן
  choice: Kemah Suci
  rationale: מִשְׁכָּן adalah sebutan teknis bagi tempat kediaman kudus dalam kitab Keluaran. “Kemah Suci” merupakan istilah Indonesia yang mudah dipahami dan membedakannya dari kemah biasa.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Ungkapan tetap ini menunjuk pada kemah tempat pertemuan ilahi. “Kemah Pertemuan” ringkas, lazim, dan mempertahankan fungsi nama tersebut.
theological_decisions:
- issue: Hubungan antara מִשְׁכַּן dan אֹהֶל מוֹעֵד
  choice: Kemah Suci, yaitu Kemah Pertemuan
  alternative: Kemah Suci dari Kemah Pertemuan
  rationale: Frasa “Kemah Pertemuan” paling masuk akal dibaca sebagai sebutan penjelas bagi “Kemah Suci.” Penambahan “yaitu” membuat hubungan aposisional itu jelas dalam bahasa Indonesia tanpa menyatakan bahwa keduanya adalah dua bangunan terpisah.
translation_notes:
  register: Bahasa instruksional yang lugas dan bermartabat. Istilah “mazbah,” “kurban bakaran,” “Kemah Suci,” dan “Kemah Pertemuan” dipertahankan sebagai kosakata ibadah yang mapan, sedangkan susunan kalimat dibuat alami bagi pembaca Indonesia masa kini.
