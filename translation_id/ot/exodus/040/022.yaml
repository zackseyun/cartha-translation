translation:
  language: id
  text: Ia menempatkan meja itu di dalam Kemah Pertemuan, pada sisi utara Kemah Suci, di luar tirai[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di luar tabir.” Kata Ibrani פָּרֹכֶת menunjuk pada tirai pemisah bagian dalam yang membatasi Ruang Mahakudus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: Ia menempatkan
  rationale: Dalam konteks penataan ruang, נתן menyatakan tindakan menaruh atau menempatkan sesuatu. “Menempatkan” alami dan secara tepat menonjolkan penentuan lokasi.
- source_word: הַשֻּׁלְחָן
  choice: meja itu
  rationale: Teks Ibrani hanya menyebut “meja” dengan kata sandang tertentu. “Meja itu” merujuk pada meja yang sudah dikenal dari konteks tanpa menambahkan fungsi yang tidak disebutkan dalam ayat ini.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: di dalam Kemah Pertemuan
  rationale: Terjemahan ini mempertahankan nama khusus tempat ibadah tersebut dan memakai “di dalam” untuk memperjelas lokasi interior yang dimaksud oleh בְּ.
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן צָפֹנָה
  choice: pada sisi utara Kemah Suci
  rationale: יֶרֶךְ secara harfiah menunjuk sisi atau bagian samping, sedangkan צָפֹנָה menunjukkan arah utara. Susunan ini jelas dan wajar dalam bahasa Indonesia.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: מִשְׁכָּן secara dasar berarti tempat kediaman, tetapi dalam konteks bangunan ibadah di Keluaran menunjuk Kemah Suci. Pilihan ini lebih mudah dipahami pembaca umum daripada istilah serapan “tabernakel”.
- source_word: מִחוּץ לַפָּרֹכֶת
  choice: di luar tirai
  rationale: מִחוּץ menyatakan lokasi di sebelah luar, sedangkan פָּרֹכֶת adalah tirai penyekat bagian dalam yang menutupi ruang mahakudus. “Tirai” merupakan padanan modern yang jelas.
