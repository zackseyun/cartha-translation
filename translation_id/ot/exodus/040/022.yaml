translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “Kemah Pertemuan” dan “Kemah Suci” dipakai sebagai sebutan yang jelas bagi pembaca umum. Penanda catatan kaki ditempatkan langsung setelah “tirai”, yaitu kata yang dijelaskan.
