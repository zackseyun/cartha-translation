base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/026.yaml
  text: And he placed the gold altar in the tent of meeting[a], before the veil.
translation:
  language: id
  text: Lalu Musa menempatkan mezbah emas di dalam Kemah Pertemuan, di depan tabir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tirai”. Istilah Ibrani ini menunjuk pada sekat bagian dalam Kemah Suci.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Lalu Musa menempatkan
  rationale: Bentuk wayyiqtol dari שׂוּם menyatakan tindakan berurutan dalam narasi. Subjek tersirat diperjelas sebagai Musa berdasarkan konteks langsung, sedangkan “menempatkan” sesuai dengan penataan perlengkapan Kemah Suci.
- source_word: מִזְבַּח הַזָּהָב
  choice: mezbah emas
  rationale: Frasa ini secara harfiah berarti “mezbah dari emas”; “mezbah emas” alami dalam bahasa Indonesia dan mempertahankan konstruksi nominal Ibrani.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: di dalam Kemah Pertemuan
  rationale: אֹהֶל מוֹעֵד adalah sebutan baku bagi bangunan tempat TUHAN bertemu dengan umat-Nya. Kapitalisasi menandai nama khusus tempat kudus tersebut.
- source_word: לִפְנֵי
  choice: di depan
  rationale: Preposisi ini menunjukkan letak ruang mezbah terhadap tabir; “di depan” jelas dan alami dalam bahasa Indonesia modern.
- source_word: הַפָּרֹכֶת
  choice: tabir
  rationale: פָּרֹכֶת menunjuk pada tirai pemisah bagian dalam Kemah Suci. “Tabir” ringkas, bermartabat, dan mempertahankan nuansa istilah peribadatan.
theological_decisions:
- issue: Istilah perlengkapan ibadah untuk הַפָּרֹכֶת
  choice: tabir
  alternative: tirai
  rationale: “Tabir” mempertahankan bobot kontekstual dan hubungan antarteks dari sekat ruang kudus tanpa memberi makna yang melampaui arti dasarnya sebagai tirai pemisah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif dibuat alami tanpa menghilangkan urutan tindakan atau ketepatan istilah tempat kudus.
