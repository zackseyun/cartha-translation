base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/018.yaml
  text: So Moses set up the tabernacle[a], and placed its bases, and set its frames, and put in its bars[c][b], and raised up its pillars.
translation:
  language: id
  text: 'Lalu Musa mendirikan Kemah Suci: ia memasang alas-alasnya, menempatkan papan-papannya[a], memasang palang-palangnya, dan menegakkan tiang-tiangnya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rangka-rangkanya”. Kata Ibrani קְרָשָׁיו menunjuk pada papan-papan tegak yang menjadi bagian struktural Kemah Suci.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: mendirikan
  rationale: Bentuk Hifil dari קום berarti membuat berdiri atau mendirikan; dalam konteks pembangunan Kemah Suci, 'mendirikan' alami dan tepat.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: מִשְׁכָּן secara harfiah berarti tempat kediaman, tetapi dalam konteks Keluaran menunjuk pada tempat kudus portabel Israel; 'Kemah Suci' adalah istilah Indonesia yang jelas dan lazim.
- source_word: אֲדָנָיו
  choice: alas-alasnya
  rationale: אֶדֶן menunjuk pada bagian fondasi berongga tempat papan atau rangka ditancapkan; 'alas' menyampaikan fungsi strukturalnya tanpa istilah teknis yang berlebihan.
- source_word: קְרָשָׁיו
  choice: papan-papannya
  rationale: קֶרֶשׁ secara leksikal berarti papan atau bilah kayu struktural. 'Papan-papan' mempertahankan gambaran konkret bahasa Ibrani, sementara alternatif 'rangka-rangka' dicatat karena fungsi strukturalnya.
- source_word: בְּרִיחָיו
  choice: palang-palangnya
  rationale: בְּרִיחַ adalah batang melintang yang menyatukan papan-papan; 'palang' merupakan padanan Indonesia yang ringkas dan sesuai konteks.
- source_word: עַמּוּדָיו
  choice: tiang-tiangnya
  rationale: עַמּוּד berarti penyangga tegak; 'tiang' terdengar alami dan tepat bagi bangunan kemah.
- source_word: וַיִּתֵּן / וַיָּשֶׂם
  choice: memasang / menempatkan
  rationale: Kedua verba menyatakan tindakan menaruh atau menempatkan unsur bangunan. Variasi Indonesia ini mengikuti objek masing-masing dan menghindari pengulangan yang kaku.
