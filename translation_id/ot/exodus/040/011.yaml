lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: Engkau harus mengurapi
  rationale: Dalam konteks ritual, משׁח menunjuk pada pengurapan dengan minyak untuk menetapkan sesuatu bagi penggunaan kudus. Bentuk instruksi diterjemahkan secara wajar dengan “harus”; waw tidak perlu diwakili dengan “dan” pada awal kalimat.
- source_word: הַכִּיֹּר
  choice: bejana pembasuhan itu
  rationale: כִּיּוֹר adalah bejana besar untuk pembasuhan dalam pelayanan Kemah Suci. Ungkapan ini lebih jelas bagi pembaca modern daripada istilah tradisional yang kurang umum.
- source_word: כַּנּוֹ
  choice: penyangganya
  rationale: כֵּן di sini menunjuk pada struktur yang menopang bejana. “Penyangga” menyampaikan fungsi tersebut dengan alami; “alas” tetap merupakan kemungkinan leksikal.
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: lalu menguduskannya
  rationale: Bentuk Piel קדשׁ berarti menetapkan atau mengkhususkan sebagai kudus. “Menguduskan” mempertahankan hubungan leksikal dengan kekudusan dan sesuai dengan konteks perlengkapan ibadah. Pronomina tunggal dipertahankan tanpa memperjelas secara berlebihan apakah acuannya hanya bejana atau bejana beserta penyangganya sebagai satu kesatuan.
theological_decisions:
- issue: Makna קדשׁ dalam konteks perlengkapan Kemah Suci
  choice: menguduskannya
  alternative: mengkhususkannya sebagai kudus
  rationale: Tindakan ini adalah penetapan ritual bagi penggunaan kudus, bukan perubahan moral. Pilihan tersebut mempertahankan bahasa kekudusan tanpa memasukkan nuansa doktrinal lain.
- issue: Acuan pronomina tunggal אֹתוֹ
  choice: mempertahankan bentuk tunggal “-nya”
  alternative: menguduskan keduanya
  rationale: Bahasa Ibrani memakai objek tunggal maskulin, yang dapat mengacu pada bejana sebagai benda utama atau pada perlengkapan itu sebagai satu kesatuan. Terjemahan tidak mengubahnya menjadi jamak dan dengan demikian mempertahankan ambiguitas yang nyata.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada instruksional yang khidmat. “Engkau” dipakai untuk sapaan tunggal sesuai konteks perintah kepada Musa. Struktur kalimat dibuat alami tanpa menghilangkan urutan tindakan dalam teks Ibrani.
