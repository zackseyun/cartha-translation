  text: Engkau harus mengurapi bejana pembasuhan itu dan penyangganya[a], dan menguduskannya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “alasnya.”
    reason: lexical_alternative
  - marker: b
    text: Atau “mengkhususkannya sebagai kudus.”
