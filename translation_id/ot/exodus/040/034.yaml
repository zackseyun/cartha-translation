  source_fidelity: 'Teks Indonesia dengan setia menerjemahkan urutan dan unsur-unsur teks Ibrani: wayyiqtol naratif (“Lalu”), awan yang definit (“awan itu”), אֹהֶל מוֹעֵד (“Kemah Pertemuan”), kemuliaan Yahweh, dan הַמִּשְׁכָּן (“Kemah Suci”). Pembedaan istilah antara Kemah Pertemuan dan Kemah Suci juga mempertahankan diksi sumber.'
  naturalness: 'Kalimatnya baku, jelas, dan alami dalam bahasa Indonesia modern: “Lalu awan itu menutupi Kemah Pertemuan, dan kemuliaan Yahweh memenuhi Kemah Suci.” Register khidmatnya sesuai untuk narasi kitab suci tanpa terasa kuno atau berlebihan.'
