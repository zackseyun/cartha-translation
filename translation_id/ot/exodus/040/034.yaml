source:
  edition: WLC
  text: וַ/יְכַ֥ס הֶ/עָנָ֖ן אֶת אֹ֣הֶל מוֹעֵ֑ד וּ/כְב֣וֹד יְהוָ֔ה מָלֵ֖א אֶת הַ/מִּשְׁכָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/034.yaml
  text: Then the cloud covered the tent of meeting[a], and the glory of Yahweh filled the tabernacle.
translation:
  language: id
  text: Lalu awan itu menutupi Kemah Pertemuan, dan kemuliaan Yahweh[a] memenuhi Kemah Suci.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam banyak terjemahan, nama ilahi יְהוָה ditampilkan sebagai “TUHAN”.
    reason: Menjelaskan tradisi penerjemahan alternatif bagi Tetragramaton tanpa mengganti nama diri dalam teks utama.
lexical_decisions:
- source_word: וַיְכַס
  choice: Lalu ... menutupi
  rationale: Bentuk wayyiqtol melanjutkan alur narasi, sehingga diterjemahkan dengan “Lalu”; verba כסה secara konkret berarti “menutupi”.
- source_word: הֶעָנָן
  choice: awan itu
  rationale: Nomina ini memakai kata sandang dan menunjuk kepada awan tertentu yang telah dikenal dalam narasi Keluaran.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Terjemahan ini mempertahankan makna frasa konstruksi sebagai kemah yang menjadi tempat pertemuan yang ditetapkan, sekaligus memakai istilah yang alami dan dikenal dalam bahasa Indonesia.
- source_word: כְבוֹד יְהוָה
  choice: kemuliaan Yahweh
  rationale: כָּבוֹד di sini menunjuk pada kemuliaan atau kehadiran ilahi yang nyata; nama יְהוָה dipertahankan sebagai nama diri “Yahweh”.
- source_word: מָלֵא
  choice: memenuhi
  rationale: Dalam konstruksi transitif ini, verba מלא menyatakan bahwa kemuliaan memenuhi seluruh bangunan tersebut.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: מִשְׁכָּן adalah istilah teknis bagi tempat kediaman suci portabel dalam Keluaran. “Kemah Suci” jelas bagi pembaca Indonesia dan membedakannya dari אֹהֶל מוֹעֵד tanpa menghilangkan rujukan kultisnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama perjanjian itu, sedangkan catatan kaki menjelaskan tradisi penggantian dengan gelar “TUHAN”.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mengikuti gerak narasi Ibrani, sedangkan kapitalisasi “Kemah Pertemuan” dan “Kemah Suci” menandai sebutan khusus bagi bangunan ibadah tersebut.
