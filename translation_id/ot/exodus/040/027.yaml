  text: And he burned fragrant incense on it[a], just as Yahweh had commanded Moses.
translation:
  language: id
  text: Lalu Musa membakar dupa harum[a] di atasnya, seperti yang Yahweh perintahkan kepada Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dupa rempah-rempah” atau “dupa aromatik”; frasa Ibrani ini menunjuk pada dupa yang dibuat dari rempah-rempah harum.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְטֵר
  choice: membakar
  rationale: Bentuk Hifil dari קטר dalam konteks ibadah berarti membuat persembahan naik sebagai asap; dengan objek dupa, “membakar” merupakan ungkapan Indonesia yang alami dan tepat.
- source_word: עָלָיו
  choice: di atasnya
  rationale: Kata ini merujuk kepada mazbah dupa dalam konteks sebelumnya; “di atasnya” mempertahankan hubungan lokatif dengan jelas.
- source_word: קְטֹרֶת סַמִּים
  choice: dupa harum
  rationale: Gabungan ini menunjuk pada dupa yang dibuat dari rempah-rempah beraroma. “Dupa harum” alami dalam bahasa Indonesia sambil mempertahankan sifat aromatiknya.
- source_word: כַּאֲשֶׁר
  choice: tepat seperti
  rationale: Ungkapan ini menandai kesesuaian tindakan Musa dengan perintah ilahi.
- source_word: צִוָּה
  choice: yang diperintahkan
  rationale: Konstruksi relatif pasif menghasilkan bahasa Indonesia yang wajar dan menyatakan bahwa perintah itu telah diberikan sebelumnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
theological_decisions:
- issue: Subjek tersirat pada וַיַּקְטֵר
  choice: Musa
  alternative: ia
  rationale: Kata kerja Ibrani hanya menyatakan subjek maskulin tunggal, sedangkan konteks rangkaian tindakan dalam pasal ini mengidentifikasinya sebagai Musa. Menyebut “Musa” membuat rujukan alami dan jelas dalam bahasa Indonesia tanpa mengubah pelaku.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama ilahi; “Yahweh” mempertahankannya sebagai nama diri.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan kalimat dibuat alami, dengan penanda [a] ditempatkan langsung setelah frasa yang dijelaskan.
