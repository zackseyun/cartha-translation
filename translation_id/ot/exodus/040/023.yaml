  yaml_path: translation/ot/exodus/040/023.yaml
  text: And he arranged on it the bread in order before Yahweh[a], just as Yahweh had commanded Moses.
translation:
  language: id
  text: Lalu Musa menata susunan roti[a] di atas meja di hadapan Yahweh, tepat seperti yang diperintahkan Yahweh kepada Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Ibraninya dapat diterjemahkan lebih harfiah, “susunan roti”; secara tradisional roti ini disebut “roti sajian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲרֹךְ
  choice: menata
  rationale: Kata kerja ערך berarti mengatur atau menempatkan secara teratur. Dalam konteks ibadah ini, “menata” menyampaikan bahwa roti diletakkan menurut susunan yang ditetapkan.
- source_word: עָלָיו
  choice: di atas meja
  rationale: Pronomina ini merujuk kepada meja pada ayat sebelumnya. Penyebutan kembali “meja” membuat rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: עֵרֶךְ לֶחֶם
  choice: roti itu
  rationale: Frasa ini secara harfiah menunjuk pada susunan roti. Gagasan susunannya telah disampaikan oleh verba “menata”, sehingga “roti itu” menghindari pengulangan yang kaku tanpa menghilangkan makna pokok.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Ungkapan kultis ini berarti di depan atau dalam hadirat Yahweh. “Di hadapan” alami, ringkas, dan mempertahankan nuansa kehadiran ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: tepat seperti yang diperintahkan Yahweh kepadanya
  rationale: Ungkapan ini menekankan kesesuaian tindakan Musa dengan perintah Yahweh. Pronomina “kepadanya” menghindari pengulangan nama Musa yang tidak perlu dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi secara langsung; “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Istilah bagi roti yang ditata
  choice: roti itu, dengan catatan alternatif “susunan roti” dan sebutan tradisional “roti sajian”
  alternative: susunan roti / roti sajian
  rationale: עֵרֶךְ לֶחֶם secara deskriptif berarti roti dalam susunan tertentu dan bukan frasa teknis לֶחֶם הַפָּנִים. Terjemahan utama dibuat alami, sedangkan alternatif yang lebih harfiah dan istilah tradisional dicatat tanpa menyamakan keduanya secara mutlak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Subjek “Musa” dijelaskan dari konteks ayat sebelumnya, dan “meja” menggantikan pronomina agar rujukannya mudah dipahami. Penanda catatan kaki [a] ditempatkan sesudah “Yahweh” mengikuti lapisan konsultasi Inggris, tetapi isi catatan menjelaskan frasa roti yang mendahuluinya.
