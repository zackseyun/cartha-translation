  text: וְ/נָתַתָּ֞ה אֶת מִזְבַּ֤ח הַ/זָּהָב֙ לִ/קְטֹ֔רֶת לִ/פְנֵ֖י אֲר֣וֹן הָ/עֵדֻ֑ת וְ/שַׂמְתָּ֛ אֶת מָסַ֥ךְ הַ/פֶּ֖תַח לַ/מִּשְׁכָּֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/005.yaml
  text: And you shall place the golden altar for incense before the ark of the testimony[b][a], and you shall set the screen for the entrance of the tabernacle.
translation:
  language: id
  text: Tempatkanlah mazbah emas untuk pembakaran dupa di depan tabut Kesaksian[a], dan pasanglah tirai pada pintu masuk Kemah Suci.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara tradisional sering disebut “tabut Perjanjian”; teks Ibrani di sini berbunyi “tabut Kesaksian”.
    reason: alternative_reading
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: Tempatkanlah
  rationale: Bentuk perintah ini secara alami menyampaikan tindakan menaruh atau menempatkan perlengkapan suci pada posisinya.
- source_word: מִזְבַּח הַזָּהָב
  choice: mazbah emas
  rationale: Frasa ini secara langsung menyatakan bahan mazbah; 'mazbah emas' alami dan tepat dalam bahasa Indonesia.
- source_word: לִקְטֹרֶת
  choice: untuk pembakaran dupa
  rationale: Preposisi ל menyatakan fungsi atau tujuan. Ungkapan ini lebih jelas daripada sekadar 'untuk dupa' dan tidak mengubahnya menjadi konstruksi kepunyaan.
- source_word: לִפְנֵי
  choice: di depan
  rationale: Dalam konteks penataan ruang, frasa ini terutama menunjukkan posisi secara spasial.
- source_word: אֲרוֹן הָעֵדֻת
  choice: tabut Kesaksian
  rationale: עֵדֻת berarti 'kesaksian', bukan 'perjanjian'. Huruf kapital pada 'Kesaksian' menandai sebutan khusus bagi loh atau ketetapan kesaksian yang terkait dengan tabut.
- source_word: וְשַׂמְתָּ
  choice: pasanglah
  rationale: Untuk tirai pada pintu masuk, 'pasanglah' lebih wajar daripada mengulang 'tempatkanlah' dan tetap menyampaikan tindakan menaruhnya pada tempat yang ditentukan.
- source_word: מָסַךְ הַפֶּתַח
  choice: tirai pada pintu masuk
  rationale: מָסַךְ menunjuk tirai penutup pada bukaan; 'tirai' merupakan istilah Indonesia yang alami, sedangkan 'pada pintu masuk' menyatakan letaknya dengan jelas.
- source_word: לַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: מִשְׁכָּן secara harfiah berkaitan dengan tempat kediaman, tetapi dalam konteks ini menunjuk bangunan ibadah portabel yang lazim dan jelas disebut 'Kemah Suci' dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan עֵדֻת dalam nama tabut
  choice: tabut Kesaksian
  alternative: tabut Perjanjian
  rationale: Teks Ibrani secara eksplisit memakai עֵדֻת, 'kesaksian'. Mempertahankan istilah itu mengutamakan bentuk sumber dan tidak menggantinya dengan gelar tradisional yang lebih umum tetapi tidak persis sama dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk imperatif dipakai karena konteksnya adalah instruksi langsung. Istilah 'mazbah', 'dupa', 'tabut', dan 'Kemah Suci' dipertahankan sebagai kosakata Alkitab yang luas dikenal; susunan kalimat dibuat lugas bagi pembaca modern.
