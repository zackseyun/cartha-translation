translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Kapitalisasi “Kemah Pertemuan” dipakai sebagai sebutan khusus, sedangkan “mezbah” tetap berupa nama benda umum. Susunan kalimat mempertahankan urutan tindakan dan tidak menambahkan pelaku atau objek pembasuhan yang tidak dinyatakan dalam ayat.
