  text: He placed the basin between the tent of meeting and the altar[a], and put water there for washing.
translation:
  language: id
  text: Ia menempatkan bejana pembasuhan[a] di antara Kemah Pertemuan dan mezbah, lalu menaruh air di situ untuk pembasuhan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani הַכִּיּוֹר menunjuk pada wadah besar yang digunakan untuk membasuh; istilah ini juga dapat diterjemahkan “bak pembasuhan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Ia menempatkan
  rationale: Bentuk dari שׂוּם menyatakan tindakan menaruh atau menempatkan sesuatu pada posisinya. “Menempatkan” alami dalam bahasa Indonesia dan sesuai dengan penataan bejana tersebut.
- source_word: הַכִּיֹּר
  choice: bejana pembasuhan
  rationale: כִּיּוֹר menunjuk pada wadah besar untuk membasuh dalam pelayanan Kemah Suci. “Bejana pembasuhan” lebih jelas dan bermartabat dalam bahasa Indonesia modern daripada istilah tradisional yang kurang umum atau “baskom,” yang dapat memberi kesan wadah rumah tangga biasa.
- source_word: בֵּין אֹהֶל מוֹעֵד וּבֵין הַמִּזְבֵּחַ
  choice: di antara Kemah Pertemuan dan mezbah
  rationale: אֹהֶל מוֹעֵד diterjemahkan langsung sebagai “Kemah Pertemuan.” Pengulangan בֵּין ... וּבֵין diungkapkan secara wajar dengan konstruksi Indonesia “di antara ... dan ...”.
- source_word: וַיִּתֵּן
  choice: lalu menaruh
  rationale: Bentuk dari נָתַן di sini berarti menaruh atau menempatkan. “Lalu” menyampaikan urutan naratif waw beruntun secara alami.
- source_word: שָׁמָּה
  choice: di situ
  rationale: Adverbia ini berarti “di sana/di situ.” Pilihan ini mempertahankan ungkapan sumber tanpa secara eksplisit menggantinya dengan “ke dalam bejana itu,” meskipun rujukannya jelas dari konteks.
- source_word: מַיִם
  choice: air
  rationale: Padanan langsung bagi מַיִם, yang walaupun berbentuk jamak secara morfologis berfungsi sebagai nomina massa.
- source_word: לְרָחְצָה
  choice: untuk membasuh
  rationale: Infinitif dari רָחַץ menyatakan tujuan, yaitu membasuh. Teks Ibrani tidak menyebutkan objek atau pelaku pembasuhan secara eksplisit, sehingga terjemahan ini tidak menambahkan “diri,” “tangan dan kaki,” atau “para imam.”
