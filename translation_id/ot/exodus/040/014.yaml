  text: And you shall bring near his sons and clothe them with tunics[a].
translation:
  language: id
  text: Bawalah putra-putranya mendekat[a] dan pakaikanlah tunik kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hadirkanlah putra-putranya” atau “bawalah putra-putranya maju.” Kata Ibrani ini sering bernuansa formal atau kultis, yaitu membawa seseorang mendekat untuk pelayanan kudus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶת בָּנָיו תַּקְרִיב
  choice: Bawalah anak-anaknya mendekat
  rationale: Bentuk Hifil dari קרב berarti membawa seseorang mendekat dan dalam konteks ini bernuansa resmi-kultis. Susunan ini mempertahankan gambaran mendekat tanpa terasa kaku dalam bahasa Indonesia.
- source_word: בָּנָיו
  choice: anak-anaknya
  rationale: Dalam konteks imamat, bentuk ini menunjuk kepada putra-putra Harun. Bahasa Indonesia lazim memakai 'anak-anaknya' tanpa membedakan jenis kelamin; konteks langsung menjelaskan rujukannya.
- source_word: וְהִלְבַּשְׁתָּ אֹתָם
  choice: lalu kenakanlah ... kepada mereka
  rationale: Bentuk kausatif menyatakan tindakan mengenakan pakaian kepada orang lain. 'Kenakanlah ... kepada mereka' alami dan mempertahankan arah tindakan itu.
- source_word: כֻּתֳּנֹת
  choice: baju panjang
  rationale: Kata ini menunjuk pakaian badan semacam tunik, bukan jubah luar. 'Baju panjang' lebih mudah dipahami pembaca umum Indonesia daripada istilah pinjaman 'tunik', tanpa menambahkan bahan yang tidak disebutkan.
theological_decisions:
- issue: Nuansa imamat/kultis pada קרב
  choice: Bawalah ... mendekat
  alternative: Hadirkanlah / bawalah ... maju
  rationale: Pilihan ini mempertahankan gagasan harfiah tentang membawa mendekat sekaligus membiarkan konteks pentahbisan menentukan makna sakralnya, tanpa menambahkan penafsiran bahwa mereka dipersembahkan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk imperatif dipakai karena konteksnya adalah perintah langsung kepada Musa. Istilah teknis 'tunik' ditempatkan dalam catatan agar teks utama tetap mudah dipahami.
