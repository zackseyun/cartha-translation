  text: 'Lalu Yahweh berfirman kepada Musa:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan alur kisah. Dalam bahasa Indonesia, “Lalu” menyatakan urutan naratif, sedangkan “berfirman” merupakan padanan alami dan bermartabat untuk tindakan Allah berbicara dalam formula pengantar ucapan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap tampak dan tidak diganti dengan gelar.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai pihak yang menjadi tujuan tuturan; “kepada” adalah padanan Indonesia yang alami.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: “Musa” adalah bentuk baku nama tokoh ini dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: '[tidak dinyatakan secara terpisah]'
  rationale: Formula לֵאמֹר memperkenalkan isi ucapan yang langsung menyusul. Dalam bahasa Indonesia, fungsi tersebut sudah tersampaikan secara alami oleh “berfirman kepada Musa” dan tanda koma; menerjemahkannya sebagai “demikian” atau “dengan berkata” akan terasa kaku dan berlebihan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks sumber memakai Tetragramaton sebagai nama pribadi. “Yahweh” mempertahankan nama itu secara langsung tanpa menggantinya dengan gelar; catatan kaki mengakui bentuk Ibrani dan transliterasi alternatif.
- issue: Pemadatan formula לֵאמֹר
  choice: Tidak diterjemahkan sebagai kata tersendiri
  alternative: dengan berfirman; demikian
  rationale: Kata ini berfungsi sebagai pengantar kutipan, bukan sebagai isi teologis tersendiri. Penghilangan padanan eksplisit menghasilkan bahasa Indonesia yang wajar tanpa menghilangkan fungsi wacananya.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. “Berfirman” dipakai secara idiomatis untuk tuturan ilahi, sedangkan susunan kalimat mempertahankan urutan naratif teks Ibrani.
