translation:
  language: id
  text: Dirikanlah pelataran itu di sekelilingnya, lalu pasanglah tirai[a] pada pintu gerbang pelataran itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tabir,” yaitu kain gantung pada pintu masuk pelataran.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתָּ
  choice: Pasanglah
  rationale: Kata kerja שׂים berarti menaruh atau menempatkan; dalam konteks pendirian Kemah Suci, bentuk perintah "pasanglah" secara alami menyampaikan tindakan menata dan mendirikan unsur pelataran.
- source_word: הֶחָצֵר
  choice: pelataran itu
  rationale: חָצֵר di sini menunjuk pada area terbuka berpagar yang mengelilingi Kemah Suci. "Pelataran" jelas, konkret, dan sesuai dengan bahasa Indonesia baku.
- source_word: סָבִיב
  choice: di sekeliling
  rationale: Adverbia ini menyatakan penempatan yang mengitari sesuatu. Ungkapan "di sekeliling" mempertahankan pengertian spasial tanpa menambahkan objek yang tidak dinyatakan dalam ayat.
- source_word: וְנָתַתָּ
  choice: dan pasanglah
  rationale: נתן secara luas berarti memberi, menaruh, atau menempatkan. Karena objeknya adalah tirai pada jalan masuk, "pasanglah" merupakan padanan kontekstual yang wajar.
- source_word: מָסַךְ
  choice: tirai
  rationale: מָסָךְ dalam konteks Kemah Suci adalah kain gantung yang menutup atau menyekat jalan masuk. "Tirai" mudah dipahami dan tidak menentukan bahan atau bentuk secara berlebihan.
- source_word: שַׁעַר
  choice: gerbang
  rationale: שַׁעַר menunjuk pada jalan masuk pelataran. "Gerbang" mempertahankan gambaran struktur masuk, meskipun penutupnya berupa kain.
- source_word: שַׁעַר הֶחָצֵר
  choice: gerbang pelataran itu
  rationale: Rangkaian konstruksi Ibrani ini secara alami menyatakan gerbang yang menjadi jalan masuk ke pelataran tersebut.
