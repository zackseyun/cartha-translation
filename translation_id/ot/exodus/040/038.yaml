  text: כִּי֩ עֲנַ֨ן יְהוָ֤ה עַֽל הַ/מִּשְׁכָּן֙ יוֹמָ֔ם וְ/אֵ֕שׁ תִּהְיֶ֥ה לַ֖יְלָה בּ֑/וֹ לְ/עֵינֵ֥י כָל בֵּֽית יִשְׂרָאֵ֖ל בְּ/כָל מַסְעֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/038.yaml
  text: For the cloud of Yahweh was over the tabernacle by day[a], and fire was in it by night[b], before the eyes of all the house of Israel throughout all their journeys.
translation:
  language: id
  text: Sebab pada siang hari awan Yahweh berada di atas Kemah Suci, dan pada malam hari ada api di dalamnya, di depan mata seluruh kaum Israel dalam seluruh perjalanan mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai rangkuman penjelas yang terkait dengan uraian sebelumnya; “Sebab” mempertahankan hubungan wacana tanpa menjadikannya terlalu tegas sebagai sebab-akibat.
- source_word: עֲנַן יְהוָה
  choice: awan Yahweh
  rationale: Menyampaikan hubungan konstruksi secara alami dan tetap mengaitkan awan itu dengan kehadiran Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: Istilah Indonesia yang wajar dan mudah dipahami untuk tempat kediaman kudus portabel dalam konteks Keluaran.
- source_word: יוֹמָם
  choice: pada siang hari
  rationale: Padanan temporal alami yang sejajar dengan “pada malam hari”.
- source_word: וְאֵשׁ תִּהְיֶה לַיְלָה בּוֹ
  choice: dan pada malam hari ada api di dalamnya
  rationale: Mencerminkan konstruksi eksistensial dan preposisi בּוֹ. Rujukan pronomina dibiarkan sebagaimana dalam teks, tanpa memperjelas secara berlebihan apakah menunjuk kepada awan atau Kemah Suci.
- source_word: לְעֵינֵי
  choice: di depan mata
  rationale: Mempertahankan idiom konkret Ibrani dalam ungkapan Indonesia yang tetap dapat dipahami.
- source_word: כָל בֵּית יִשְׂרָאֵל
  choice: seluruh kaum Israel
  rationale: “Kaum Israel” mempertahankan gagasan korporat בֵּית יִשְׂרָאֵל dengan lebih alami daripada terjemahan harfiah “rumah Israel”.
- source_word: בְּכָל מַסְעֵיהֶם
  choice: sepanjang segala perjalanan mereka
  rationale: Menyatakan keberlangsungan fenomena itu selama seluruh rangkaian perjalanan atau tahap perpindahan Israel.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankan fungsi nama perjanjian tanpa menggantinya dengan sebuah gelar.
- issue: Rujukan sufiks בּוֹ dalam ungkapan tentang api
  choice: di dalamnya
  alternative: di dalam awan itu; di atas Kemah Suci itu
  rationale: Rujukan sufiks dapat dipahami berkaitan dengan awan atau latar Kemah Suci. Terjemahan pronominal mempertahankan ketidakjelasan asli dan tidak memaksakan penafsiran teologis atau visual tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern, khidmat tetapi mudah dipahami. Struktur paralel siang–malam dipertahankan, begitu pula idiom visual “di depan mata”. Tidak diperlukan catatan kaki karena alternatif pada lapisan konsultasi bahasa Inggris tidak sesuai dengan posisi penanda yang diberikan dan teks Indonesia dapat mempertahankan makna sumber secara langsung.
