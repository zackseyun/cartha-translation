  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מָשַׁחְתָּ֣ אֹתָ֗/ם כַּ/אֲשֶׁ֤ר מָשַׁ֨חְתָּ֙ אֶת אֲבִי/הֶ֔ם וְ/כִהֲנ֖וּ לִ֑/י וְ֠/הָיְתָה לִ/הְיֹ֨ת לָ/הֶ֧ם מָשְׁחָתָ֛/ם לִ/כְהֻנַּ֥ת עוֹלָ֖ם לְ/דֹרֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/015.yaml
  text: You shall anoint them just as you anointed their father[a], so that they may serve as priests to me. And their anointing shall be for them an everlasting priesthood throughout their generations.
translation:
  language: id
  text: Engkau harus mengurapi mereka sebagaimana engkau telah mengurapi ayah mereka, agar mereka melayani-Ku sebagai imam. Pengurapan mereka akan menjadi bagi mereka suatu imamat yang berlaku untuk selama-lamanya[a], turun-temurun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “imamat yang tetap.” Kata Ibrani yang dipakai di sini dapat menyatakan kesinambungan yang berlangsung dari generasi ke generasi dalam konteks perjanjian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: Engkau harus mengurapi
  rationale: Bentuk perfektum dengan waw dalam rangkaian petunjuk menyatakan perintah yang harus dilaksanakan; frasa ini menyampaikan daya direktifnya secara wajar dalam bahasa Indonesia.
- source_word: כַּאֲשֶׁר מָשַׁחְתָּ אֶת אֲבִיהֶם
  choice: sebagaimana engkau telah mengurapi ayah mereka
  rationale: כַּאֲשֶׁר menyatakan perbandingan langsung, sedangkan bentuk verba kedua merujuk pada pengurapan Harun yang telah dilakukan.
- source_word: וְכִהֲנוּ לִי
  choice: agar mereka melayani-Ku sebagai imam
  rationale: Verba כהן berarti menjalankan pelayanan imam. 'Melayani-Ku sebagai imam' mempertahankan fungsi keimaman dan pihak yang menerima pelayanan itu.
- source_word: מָשְׁחָתָם
  choice: Pengurapan mereka
  rationale: Nomina ini menunjuk pada pengurapan atau penahbisan melalui pengurapan; konteks ini tidak mengharuskan arti 'minyak pengurapan mereka'.
- source_word: לִכְהֻנַּת עוֹלָם
  choice: jabatan imam untuk selama-lamanya
  rationale: '''Jabatan imam'' merupakan ungkapan Indonesia yang lebih alami daripada ''keimaman'' bagi כהנה, sementara ''untuk selama-lamanya'' mempertahankan kekuatan duratif עוֹלָם tanpa meniadakan nuansa kesinambungan perjanjian.'
- source_word: לְדֹרֹתָם
  choice: turun-temurun
  rationale: Ungkapan ini secara alami menyatakan kesinambungan dalam generasi-generasi keturunan mereka.
theological_decisions:
- issue: Jangka waktu yang dinyatakan oleh עוֹלָם dalam bahasa perjanjian keimaman
  choice: untuk selama-lamanya
  alternative: untuk seterusnya
  rationale: עוֹלָם dapat menyatakan kelangsungan yang tetap dari generasi ke generasi dalam kerangka perjanjian, bukan semata-mata pernyataan filosofis tentang ketakterhinggaan. Teks utama mempertahankan padanan yang kuat, sedangkan catatan kaki menunjukkan alternatif yang tetap membuka nuansa kontekstual itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'melayani-Ku' jelas bagi pembaca umum, sedangkan 'jabatan imam' dipilih daripada istilah abstrak 'keimaman'. Penanda catatan kaki ditempatkan sesudah frasa durasi yang diterangkannya.
