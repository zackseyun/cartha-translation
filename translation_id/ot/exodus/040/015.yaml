revisions:
- from: Engkau harus mengurapi mereka sebagaimana engkau telah mengurapi ayah mereka, agar mereka melayani-Ku sebagai imam. Pengurapan mereka akan memberi mereka jabatan imam untuk selama-lamanya[a], turun-temurun.
