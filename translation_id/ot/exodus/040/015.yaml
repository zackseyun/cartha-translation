  rationale: 'Revisi menghapus tambahan makna kausatif “akan memberi mereka” dan mempertahankan hubungan yang lebih dekat dengan konstruksi Ibrani: pengurapan mereka berkenaan dengan imamat yang berkelanjutan bagi mereka. Istilah dan register lainnya dipertahankan; “turun-temurun” secara ringkas menerjemahkan “bagi generasi-generasi mereka.”'
