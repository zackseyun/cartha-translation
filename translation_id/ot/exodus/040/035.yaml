  yaml_path: translation/ot/exodus/040/035.yaml
  text: And Moses was not able to enter the tent of meeting[a], because the cloud settled on it, and the glory of Yahweh filled the tabernacle.
translation:
  language: id
  text: Musa tidak dapat masuk ke dalam Kemah Pertemuan, sebab awan itu menetap[a] di atasnya dan kemuliaan Yahweh memenuhi Kemah Suci.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berdiam” atau “tinggal.” Kata Ibrani ini dapat berarti menetap atau tinggal di suatu tempat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יָכֹל מֹשֶׁה
  choice: Musa tidak dapat
  rationale: Ungkapan ini menyampaikan ketidakmampuan Musa secara langsung dan wajar dalam bahasa Indonesia. Waw pembuka dipahami sebagai kelanjutan narasi, tetapi tidak perlu selalu dinyatakan dengan “dan” pada awal kalimat Indonesia.
- source_word: לָבוֹא אֶל אֹהֶל מוֹעֵד
  choice: masuk ke dalam Kemah Pertemuan
  rationale: “Masuk ke dalam” menyatakan gerakan memasuki bangunan secara alami, sedangkan “Kemah Pertemuan” mempertahankan sebutan khusus אֹהֶל מוֹעֵד.
- source_word: כִּי
  choice: sebab
  rationale: Konjungsi ini menjelaskan alasan Musa tidak dapat masuk. “Sebab” jelas, ringkas, dan sesuai dengan ragam naratif yang bermartabat.
- source_word: שָׁכַן עָלָיו הֶעָנָן
  choice: awan itu berdiam di atasnya
  rationale: שָׁכַן dapat berarti tinggal, menetap, atau mengambil tempat. “Berdiam” mempertahankan kaitannya dengan gagasan kediaman sekaligus menggambarkan awan yang tetap berada di atas kemah; alternatif konkret dicatat dalam catatan kaki.
- source_word: וּכְבוֹד יְהוָה
  choice: dan kemuliaan Yahweh
  rationale: Hubungan konstruksi diterjemahkan secara alami. כָּבוֹד dipertahankan sebagai “kemuliaan,” dan nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh.”
- source_word: מָלֵא אֶת הַמִּשְׁכָּן
  choice: memenuhi Kemah Suci
  rationale: Bentuk verba menyatakan bahwa kemuliaan Yahweh memenuhi tempat itu. Dalam konteks Keluaran, “Kemah Suci” merupakan sebutan Indonesia yang jelas bagi מִשְׁכָּן dan membedakannya dari אֹהֶל מוֹעֵד.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung. “Yahweh” mempertahankan nama pribadi itu dan tidak menggantinya dengan gelar.
- issue: Nuansa שָׁכַן dan gagasan kediaman ilahi
  choice: berdiam
  alternative: menetap atau hinggap
  rationale: “Berdiam” menjaga kemungkinan makna tinggal atau bersemayam tanpa mengubah awan menjadi sekadar penutup. Karena verba ini juga dapat menggambarkan sesuatu yang turun lalu tetap berada di suatu tempat, alternatif yang lebih konkret diberikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama-nama sebutan tempat ibadah ditulis dengan huruf kapital sebagai sebutan khusus dalam konteks ini. Kalimat dibuat mengalir alami tanpa menghilangkan hubungan sebab-akibat atau nuansa verba Ibrani.
