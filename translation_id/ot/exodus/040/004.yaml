translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk imperatif “bawalah”, “aturlah”, dan “nyalakanlah” mencerminkan rangkaian perintah kepada Musa. Pengulangan “bawalah masuk” dipertahankan karena juga diulang dalam teks Ibrani.
