base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/036.yaml
  text: Whenever the cloud was taken up from over the tabernacle[a], the sons of Israel would set out in all their journeys.
translation:
  language: id
  text: Setiap kali awan itu terangkat dari atas Kemah Suci, orang Israel[a] pun berangkat dalam semua perjalanan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak lelaki Israel”; maksudnya umat atau orang Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/הֵעָל֤וֹת
  choice: Setiap kali ... terangkat
  rationale: Gabungan konjungsi, preposisi, dan infinitif konstruk memperkenalkan keadaan waktu yang berulang. 'Setiap kali' menyatakan sifat iteratifnya, sedangkan 'terangkat' mempertahankan gambaran awan yang naik tanpa menentukan pelakunya.
- source_word: הֶֽ/עָנָן֙
  choice: awan itu
  rationale: Nomina definit ini menunjuk kepada awan khusus yang telah disebutkan dalam konteks, yakni awan hadirat ilahi.
- source_word: מֵ/עַ֣ל
  choice: dari atas
  rationale: Frasa ini menyatakan gerak menjauh dari posisi di atas Kemah Suci.
- source_word: הַ/מִּשְׁכָּ֔ן
  choice: Kemah Suci
  rationale: Dalam konteks Keluaran, istilah ini menunjuk kepada tempat kediaman kudus yang dapat dipindahkan. 'Kemah Suci' alami dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: יִסְע֖וּ
  choice: pun berangkat
  rationale: Verba ini menyatakan keberangkatan untuk melanjutkan perjalanan. Dengan klausa 'setiap kali', bentuk ini secara alami menyampaikan tindakan yang biasa berulang.
- source_word: בְּנֵ֣י יִשְׂרָאֵ֑ל
  choice: orang Israel
  rationale: Secara harfiah berarti 'anak-anak lelaki Israel', tetapi sebagai sebutan korporat frasa ini mencakup umat Israel. 'Orang Israel' merupakan padanan Indonesia yang alami; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: בְּ/כֹ֖ל מַסְעֵי/הֶֽם
  choice: dalam setiap tahap perjalanan mereka
  rationale: Nomina jamak מַסָּע dapat menunjuk kepada perjalanan atau tahap perjalanan. Dalam konteks perjalanan padang gurun, 'setiap tahap perjalanan' menyampaikan distribusi tindakan pada seluruh rangkaian keberangkatan mereka.
theological_decisions:
- issue: Sebutan korporat בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak lelaki Israel; keturunan Israel
  rationale: Frasa Ibrani berbentuk maskulin secara harfiah, tetapi berfungsi sebagai nama korporat bagi umat Israel. Teks utama memakai ungkapan Indonesia yang alami tanpa membatasi rujukannya hanya kepada laki-laki, sementara bentuk sumber dipertahankan dalam catatan kaki.
- issue: Pelaku yang mengangkat awan
  choice: awan itu terangkat
  alternative: awan itu diangkat
  rationale: Bentuk sumber dapat menggambarkan naiknya awan tanpa menyebut pelaku. 'Terangkat' menjaga ketidaktersuratan pelaku dan tidak memaksakan konstruksi pasif ilahi.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Kemah Suci' dipakai sebagai istilah yang mudah dipahami untuk מִשְׁכָּן. Partikel 'pun' menautkan keberangkatan Israel secara alami dengan terangkatnya awan.
