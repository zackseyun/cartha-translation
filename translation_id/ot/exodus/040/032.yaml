base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/032.yaml
  text: Whenever they entered the tent of meeting, and whenever they approached the altar, they washed, just as Yahweh had commanded Moses.
translation:
  language: id
  text: Setiap kali mereka masuk ke Kemah Pertemuan dan setiap kali mereka mendekati mazbah, mereka membasuh diri, tepat seperti yang diperintahkan Yahweh kepada Musa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּבֹאָם
  choice: Setiap kali mereka masuk
  rationale: Gabungan ב dengan infinitif konstruk dan akhiran orang ketiga jamak menyatakan keadaan waktu. Dalam konteks tindakan keimaman yang berulang, “setiap kali” menyampaikan aspek kebiasaan secara alami.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Istilah ini merupakan sebutan baku dan jelas bagi kemah suci tempat Yahweh berjumpa dengan Israel; kapitalisasi menandainya sebagai nama khusus bangunan ibadah tersebut.
- source_word: וּבְקָרְבָתָם
  choice: dan setiap kali mereka mendekati
  rationale: Konstruksi temporal yang sejajar dengan בְּבֹאָם dipertahankan. “Mendekati” menyatakan gerak datang dekat kepada mazbah dengan bahasa Indonesia yang wajar.
- source_word: הַמִּזְבֵּחַ
  choice: mazbah
  rationale: “Mazbah” adalah istilah Indonesia yang tepat untuk tempat persembahan korban dalam konteks Kemah Pertemuan dan mempertahankan nuansa ibadah teks sumber.
- source_word: יִרְחָצוּ
  choice: mereka membasuh diri
  rationale: Bentuk imperfek dalam narasi ini menyatakan tindakan kebiasaan. Objek tidak disebutkan dalam ayat Ibrani; “membasuh diri” menghasilkan kalimat Indonesia yang utuh tanpa menambahkan anggota tubuh tertentu ke dalam teks ayat ini.
- source_word: כַּאֲשֶׁר
  choice: tepat seperti
  rationale: Ungkapan ini menegaskan bahwa tindakan tersebut dilakukan sesuai dengan perintah yang telah diberikan.
- source_word: צִוָּה
  choice: yang diperintahkan
  rationale: Konstruksi Indonesia ini secara alami menunjukkan bahwa perintah Yahweh kepada Musa mendahului pelaksanaannya, tanpa memerlukan bentuk kala gramatikal khusus.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: אֶת מֹשֶׁה
  choice: kepada Musa
  rationale: Dengan verba צוה, penanda objek אֶת menunjuk kepada orang yang menerima perintah; bahasa Indonesia secara idiomatis memakai “memerintahkan ... kepada Musa” dalam konstruksi pasif nominal ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu dan tidak menggantinya dengan sebuah gelar.
- issue: Cakupan tindakan membasuh
  choice: membasuh diri tanpa menyebut anggota tubuh
  alternative: membasuh tangan dan kaki mereka
  rationale: Ayat ini sendiri tidak menyatakan objek verba יִרְחָצוּ, walaupun ayat sebelumnya menjelaskan tangan dan kaki. Terjemahan tidak memasukkan keterangan kontekstual itu ke dalam ayat sehingga elipsis sumber tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan “setiap kali” dipertahankan untuk mencerminkan kesejajaran kedua konstruksi temporal Ibrani. Istilah “Kemah Pertemuan” dan “mazbah” menjaga ketepatan konteks ibadah tanpa membuat susunan kalimat terasa kaku.
