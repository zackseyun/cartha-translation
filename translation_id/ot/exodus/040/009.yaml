  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לָקַחְתָּ֙ אֶת שֶׁ֣מֶן הַ/מִּשְׁחָ֔ה וּ/מָשַׁחְתָּ֥ אֶת הַ/מִּשְׁכָּ֖ן וְ/אֶת כָּל אֲשֶׁר בּ֑/וֹ וְ/קִדַּשְׁתָּ֥ אֹת֛/וֹ וְ/אֶת כָּל כֵּלָ֖י/ו וְ/הָ֥יָה קֹֽדֶשׁ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/009.yaml
  text: Then you shall take the anointing oil and anoint the tabernacle and all that is in it[a], and you shall consecrate it and all its furnishings[b], and it shall be holy.
translation:
  language: id
  text: Kemudian ambillah minyak pengurapan dan urapilah Kemah Suci[a] beserta segala yang ada di dalamnya. Kuduskanlah kemah itu beserta segala perlengkapannya, maka kemah itu akan menjadi kudus[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kemah Kediaman.”
    reason: Makna dasar מִשְׁכָּן ialah tempat kediaman, sementara “Kemah Suci” adalah istilah kontekstual yang lazim dalam bahasa Indonesia.
  - marker: b
    text: 'Ibrani: “kudus”; bukan “mahakudus.”'
    reason: Menjaga agar tingkat kekudusan tidak diperkuat melampaui bentuk Ibrani yang digunakan.
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Kemudian ambillah
  rationale: Bentuk perfektum dengan waw dalam rangkaian petunjuk menyampaikan perintah yang berurutan. “Kemudian” memperjelas urutan tindakan, sedangkan bentuk “ambillah” mempertahankan daya perintahnya.
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: minyak pengurapan
  rationale: Ungkapan konstruksi ini secara alami dan tepat menunjuk pada minyak khusus yang digunakan untuk pengurapan.
- source_word: וּמָשַׁחְתָּ
  choice: dan urapilah
  rationale: Dalam konteks ibadah, משׁח berarti mengolesi dengan minyak untuk menetapkan sesuatu bagi penggunaan kudus. Bentuk perintah sesuai dengan fungsi verba dalam rangkaian petunjuk ini.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: “Kemah Suci” merupakan istilah Indonesia yang lazim dan mudah dikenali untuk tempat ibadah portabel Israel. Catatan kaki mempertahankan makna etimologisnya sebagai tempat kediaman.
- source_word: כָּל אֲשֶׁר בּוֹ
  choice: segala yang ada di dalamnya
  rationale: Terjemahan ini mempertahankan cakupan menyeluruh dari frasa Ibrani dan mengacu kepada seluruh isi Kemah Suci.
- source_word: וְקִדַּשְׁתָּ אֹתוֹ
  choice: Kuduskanlah kemah itu
  rationale: Bentuk Piel dari קדשׁ di sini berarti menetapkan atau mengkhususkan bagi penggunaan kudus. “Kuduskanlah” mempertahankan hubungan leksikal dengan hasil akhirnya, yaitu “kudus”.
- source_word: וְאֶת כָּל כֵּלָיו
  choice: beserta segala perlengkapannya
  rationale: כֵּלִים merupakan istilah luas bagi berbagai barang, perkakas, dan peralatan Kemah Suci; “perlengkapan” tidak mempersempit maknanya menjadi hanya bejana atau perkakas tertentu.
- source_word: וְהָיָה קֹדֶשׁ
  choice: maka kemah itu akan menjadi kudus
  rationale: Klausa hasil ini menyatakan status kudus Kemah Suci sesudah pengurapan dan pengudusan. Kata קֹדֶשׁ berarti “kudus” tanpa bentuk superlatif.
theological_decisions:
- issue: Status Kemah Suci setelah diurapi dan dikuduskan
  choice: Kemah itu akan menjadi kudus
  alternative: Kemah itu akan menjadi mahakudus
  rationale: Teks Ibrani hanya memakai קֹדֶשׁ (“kudus”), bukan קֹדֶשׁ קָדָשִׁים (“mahakudus”). Terjemahan tidak menambahkan tingkat kekudusan yang tidak dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk imperatif dipakai untuk mencerminkan rangkaian instruksi langsung kepada Musa; pengulangan “kemah itu” menghindari ketidakjelasan rujukan kata ganti.
