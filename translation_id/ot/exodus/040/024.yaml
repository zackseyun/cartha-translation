  text: He placed the lampstand in the tent of meeting[a], opposite the table, on the south side of the tabernacle.
translation:
  language: id
  text: Ia menempatkan kaki pelita di dalam Kemah Pertemuan, berhadapan dengan meja[a], di sisi selatan Kemah Suci.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "di depan meja" atau "menghadap meja". Istilah Ibrani ini dapat menyatakan posisi yang berhadapan atau di depan sesuatu.
    reason: alternatif_leksikal
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Ia menempatkan
  rationale: Bentuk wayyiqtol dari שׂים menyatakan tindakan lampau dalam rangkaian narasi. 'Menempatkan' alami dan sesuai dengan penataan perlengkapan secara sengaja.
- source_word: הַמְּנֹרָה
  choice: kaki pelita
  rationale: מְנוֹרָה menunjuk pada tempat berdiri bercabang bagi pelita-pelita dalam ibadah, bukan sekadar sebuah pelita. 'Kaki pelita' jelas bagi pembaca Indonesia dan tidak bergantung pada transliterasi.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: di dalam Kemah Pertemuan
  rationale: Ungkapan ini adalah sebutan tetap bagi kemah tempat pertemuan ilahi-manusia. 'Kemah Pertemuan' mempertahankan unsur leksikal dan berfungsi sebagai nama tempat kudus tersebut.
- source_word: נֹכַח הַשֻּׁלְחָן
  choice: berhadapan dengan meja
  rationale: נֹכַח menyatakan posisi di seberang, di depan, atau menghadap sesuatu. 'Berhadapan dengan' mempertahankan relasi spasial tanpa memberi ketepatan yang melampaui bahasa Ibrani.
- source_word: הַשֻּׁלְחָן
  choice: meja
  rationale: Teks hanya menyebut 'meja'; identifikasinya sebagai meja roti tidak ditambahkan dari konteks.
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן
  choice: di sisi ... Kemah Suci
  rationale: יֶרֶךְ secara harfiah berarti sisi atau rusuk. Bersama penunjuk arah sesudahnya, frasa ini secara alami diterjemahkan sebagai lokasi pada sisi selatan.
- source_word: נֶגְבָּה
  choice: selatan
  rationale: Bentuk berakhiran lokatif ini menunjukkan arah atau lokasi ke sebelah selatan; dalam konteks ini, 'sisi selatan' merupakan ungkapan Indonesia yang wajar.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: מִשְׁכָּן secara leksikal berkaitan dengan tempat kediaman dan dalam konteks Keluaran menunjuk pada bangunan kudus itu. 'Kemah Suci' merupakan istilah Indonesia yang jelas dan bermartabat, serta membedakannya dari Kemah Pertemuan tanpa mengubah acuannya.
