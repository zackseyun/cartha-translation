  text: And he put the screen at the entrance to the tabernacle[a].
translation:
  language: id
  text: Lalu ia memasang tirai pada pintu masuk Kemah Suci.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tirai untuk pintu masuk Kemah Suci.”
    reason: Alternatif ini mempertahankan kemungkinan bahwa ל menyatakan fungsi atau peruntukan tirai, bukan semata-mata lokasinya.
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: Lalu ia memasang
  rationale: Kata kerja שׂוּם berarti menaruh, menempatkan, atau menetapkan. Dalam konteks tirai pada sebuah pintu masuk, “memasang” secara alami menyatakan tindakan menempatkan tirai itu pada posisinya.
- source_word: מָסַךְ
  choice: tirai
  rationale: Dalam konteks Kemah Suci, מָסָךְ adalah kain gantung yang menutup atau menyekat pintu masuk. “Tirai” merupakan padanan Indonesia yang alami dan tetap membedakannya secara kontekstual dari פָּרֹכֶת, tabir bagian dalam.
- source_word: הַפֶּתַח
  choice: pintu masuk
  rationale: פֶּתַח menunjuk pada bukaan atau jalan masuk. “Pintu masuk” jelas dan wajar dalam bahasa Indonesia modern tanpa menyiratkan adanya daun pintu.
- source_word: לַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: מִשְׁכָּן secara harfiah berkaitan dengan tempat kediaman dan dalam konteks Keluaran menunjuk pada tempat ibadah portabel Israel. “Kemah Suci” adalah istilah Indonesia yang lazim dan mudah dipahami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. “Memasang” dipilih agar tindakan penempatan tirai terdengar alami; “Kemah Suci” memakai kapitalisasi sebagai sebutan bagi bangunan ibadah khusus tersebut.
