  text: וַ/יָּ֣קֶם אֶת הֶ/חָצֵ֗ר סָבִיב֙ לַ/מִּשְׁכָּ֣ן וְ/לַ/מִּזְבֵּ֔חַ וַ/יִּתֵּ֕ן אֶת מָסַ֖ךְ שַׁ֣עַר הֶ/חָצֵ֑ר וַ/יְכַ֥ל מֹשֶׁ֖ה אֶת הַ/מְּלָאכָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/033.yaml
  text: Then he set up the courtyard around the tabernacle and the altar[a], and put up the screen for the gate of the courtyard. So Moses finished the work.
translation:
  language: id
  text: Kemudian ia mendirikan pelataran di sekeliling Kemah Suci dan mazbah, serta memasang tirai[a] pada pintu gerbang pelataran. Demikianlah Musa menyelesaikan pekerjaan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kain penutup” atau “kain gantung”; istilah Ibrani מָסַךְ menunjuk pada penutup dari kain di jalan masuk pelataran.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: mendirikan
  rationale: Bentuk Hifil dari קום dalam konteks pembangunan tempat suci berarti mendirikan atau memasang suatu bangunan; “mendirikan” wajar untuk keseluruhan pelataran.
- source_word: הֶחָצֵר
  choice: pelataran
  rationale: חָצֵר menunjuk pada kawasan terbuka berpagar yang mengelilingi Kemah Suci; “pelataran” merupakan istilah Indonesia yang jelas dan sesuai konteks.
- source_word: סָבִיב
  choice: di sekeliling
  rationale: Kata ini menyatakan bahwa pelataran mengitari Kemah Suci dan mazbah.
- source_word: לַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: מִשְׁכָּן adalah istilah khusus bagi tempat kediaman kudus portabel dalam kitab Keluaran; “Kemah Suci” alami dan mudah dipahami dalam bahasa Indonesia.
- source_word: וְלַמִּזְבֵּחַ
  choice: dan mazbah
  rationale: מִזְבֵּחַ berarti tempat persembahan kurban; “mazbah” mempertahankan istilah kultis yang ringkas dan mapan.
- source_word: וַיִּתֵּן
  choice: memasang
  rationale: Walaupun arti dasarnya “menaruh”, dalam konteks ini נתן menggambarkan pemasangan kain penutup pada pintu gerbang.
- source_word: מָסַךְ
  choice: tirai
  rationale: מָסַךְ di sini adalah kain penutup pada jalan masuk; “tirai” jelas bagi pembaca modern, sementara alternatif maknanya dicatat dalam catatan kaki.
- source_word: שַׁעַר הֶחָצֵר
  choice: pintu gerbang pelataran
  rationale: Frasa konstruksi ini menunjuk pada jalan masuk resmi ke pelataran; “pintu gerbang pelataran” mempertahankan gambaran sumber.
- source_word: וַיְכַל
  choice: menyelesaikan
  rationale: כלה menyatakan bahwa seluruh tugas pembangunan telah dituntaskan.
- source_word: הַמְּלָאכָה
  choice: pekerjaan itu
  rationale: מְלָאכָה merangkum seluruh pekerjaan pembangunan yang telah disebutkan; penunjuk “itu” membuat rujukannya alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “ia” mempertahankan subjek tersirat dalam klausa pertama, sedangkan nama “Musa” tetap dinyatakan pada klausa penutup sebagaimana dalam teks Ibrani. Penanda catatan kaki ditempatkan langsung sesudah kata yang dijelaskan.
