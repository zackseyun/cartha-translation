  text: On the first day of the first month[a], you shall set up the tabernacle, the tent of meeting.
translation:
  language: id
  text: Pada hari pertama bulan pertama, engkau harus mendirikan Kemah Suci, yaitu Kemah Pertemuan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “Kemah Suci, Kemah Pertemuan.” Dalam bahasa Ibrani, dua sebutan tempat kudus ini dirangkaikan; keduanya dapat dipahami sebagai aposisi atau sebagai gabungan yang lebih erat, seolah-olah “Kemah Suci dari Kemah Pertemuan.”
    reason: alternative_reading
lexical_decisions:
- source_word: בְּ/יוֹם
  choice: Pada hari
  rationale: Preposisi ב dengan יוֹם menyatakan waktu; “pada hari” merupakan ungkapan waktu yang wajar dalam bahasa Indonesia.
- source_word: הַ/חֹדֶשׁ הָ/רִאשׁוֹן
  choice: bulan pertama
  rationale: Dalam konteks penanggalan, חֹדֶשׁ berarti “bulan,” sedangkan הָרִאשׁוֹן menunjukkan urutan pertama.
- source_word: בְּ/אֶחָד לַ/חֹדֶשׁ
  choice: hari pertama bulan pertama
  rationale: Rumus tanggal Ibrani ini secara harfiah berbunyi kira-kira “pada satu bulan itu,” tetapi secara idiomatis menunjuk pada hari pertama dalam bulan tersebut. Susunan Indonesia ini jelas dan tidak kaku.
- source_word: תָּקִים
  choice: haruslah engkau mendirikan
  rationale: Bentuk Hifil dari קום berarti membuat sesuatu berdiri, yakni mendirikan. “Haruslah engkau” mempertahankan bentuk perintah langsung kepada orang kedua tunggal dengan ragam yang khidmat dan alami.
- source_word: מִשְׁכַּן
  choice: Kemah Suci
  rationale: Dalam konteks Keluaran, istilah ini menunjuk pada tempat kediaman kudus portabel. “Kemah Suci” adalah padanan Indonesia yang dikenal luas dan mudah dipahami.
- source_word: אֹהֶל מוֹעֵד
  choice: Kemah Pertemuan
  rationale: Istilah ini merupakan sebutan tetap bagi tempat pertemuan kudus dalam Keluaran. “Kemah Pertemuan” mempertahankan unsur kemah dan pertemuan secara ringkas.
theological_decisions:
- issue: Hubungan antara מִשְׁכַּן dan אֹהֶל מוֹעֵד
  choice: 'Aposisional: “Kemah Suci, yaitu Kemah Pertemuan”'
  alternative: 'Ungkapan rapat menyerupai konstruksi kepunyaan: “Kemah Suci dari Kemah Pertemuan”'
  rationale: Teks Ibrani menempatkan kedua sebutan tempat kudus itu berdampingan tanpa penanda genitif yang eksplisit. Dalam konteks, keduanya menunjuk pada bangunan kudus yang sama dari sudut yang saling melengkapi. “Yaitu” memperjelas aposisi tanpa meniadakan kemungkinan gramatikal alternatif, yang dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. “Engkau” dipakai karena perintah ditujukan kepada orang kedua tunggal. Huruf kapital pada “Kemah Suci” dan “Kemah Pertemuan” menandai keduanya sebagai sebutan khusus bagi tempat kudus yang sama.
