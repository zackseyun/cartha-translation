  yaml_path: translation/ot/exodus/040/016.yaml
  text: And Moses did according to all that Yahweh commanded him[a]; so he did.
translation:
  language: id
  text: Musa melakukan segala sesuatu sesuai dengan segala yang Yahweh perintahkan kepadanya[a]; demikianlah ia melakukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “YHWH”; secara tradisional diterjemahkan “TUHAN.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: melakukan
  rationale: Dalam konteks ketaatan pada perintah, עשה menunjuk pada pelaksanaan, bukan sekadar pembuatan benda.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
- source_word: כְּכֹל
  choice: segala sesuatu sesuai dengan
  rationale: Ungkapan ini mempertahankan gagasan kesesuaian penuh dengan seluruh perintah, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר צִוָּה
  choice: yang diperintahkan
  rationale: Konstruksi pasif Indonesia menyampaikan isi tindakan memerintah secara alami tanpa perlu menambahkan aspek waktu yang tidak dinyatakan secara eksplisit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, alih-alih menggantinya dengan gelar.
- source_word: אֹתוֹ
  choice: kepadanya
  rationale: Objek orang dari verba 'memerintahkan' secara idiomatis dinyatakan dengan 'kepada'; rujukannya adalah Musa.
- source_word: כֵּן עָשָׂה
  choice: demikianlah dilakukannya
  rationale: Mempertahankan pengulangan verba dan penegasan bahwa tindakan Musa tepat bersesuaian dengan perintah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama tersebut dan sesuai dengan bukti pelafalan yang lazim diterima, tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur paralel serta pengulangan dalam bahasa Ibrani dipertahankan, tetapi susunan kalimat dibuat alami bagi pembaca Indonesia.
