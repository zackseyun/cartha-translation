  text: וּ/מָשַׁחְתָּ֛ אֶת מִזְבַּ֥ח הָ/עֹלָ֖ה וְ/אֶת כָּל כֵּלָ֑י/ו וְ/קִדַּשְׁתָּ֙ אֶת הַ/מִּזְבֵּ֔חַ וְ/הָיָ֥ה הַ/מִּזְבֵּ֖חַ קֹ֥דֶשׁ קָֽדָשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/010.yaml
  text: You shall anoint the altar of burnt offering and all its utensils[a], and you shall consecrate the altar, and the altar shall be most holy.
translation:
  language: id
  text: Engkau harus mengurapi mazbah kurban bakaran beserta segala perkakasnya. Engkau harus menguduskan mazbah itu, dan mazbah itu akan menjadi mahakudus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “kudus segala kudus,” suatu ungkapan superlatif yang berarti “mahakudus.”'
    reason: Menjelaskan bentuk khas ungkapan Ibrani dan dasar penerjemahan superlatifnya.
lexical_decisions:
- source_word: וּמָשַׁחְתָּ
  choice: Engkau harus mengurapi
  rationale: Dalam konteks ibadah, משׁח menunjuk pada pengurapan dengan minyak untuk menetapkan sesuatu bagi tujuan kudus. Bentuk orang kedua tunggal dipertahankan dengan “engkau”.
- source_word: מִזְבַּח הָעֹלָה
  choice: mazbah kurban bakaran
  rationale: Frasa konstruksi ini menunjuk pada mazbah yang digunakan untuk kurban bakaran. “Mazbah” mempertahankan istilah ibadah yang tepat, sedangkan “kurban bakaran” jelas dan lazim dalam bahasa Indonesia Alkitabiah.
- source_word: כָּל כֵּלָיו
  choice: segala perkakasnya
  rationale: כֵּלִים mencakup berbagai benda atau alat yang berkaitan dengan mazbah; “perkakas” cukup luas dan alami dalam bahasa Indonesia modern.
- source_word: וְקִדַּשְׁתָּ
  choice: Engkau harus menguduskan
  rationale: Dalam konteks ritual, קדשׁ berarti menetapkan atau memisahkan sebagai kudus. “Menguduskan” mempertahankan hubungan leksikal dengan status kudus yang disebut sesudahnya.
- source_word: וְהָיָה
  choice: akan menjadi
  rationale: Bentuk ini menyatakan keadaan yang dihasilkan oleh tindakan pengudusan, bukan sekadar identitas statis.
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: mahakudus
  rationale: Konstruksi Ibrani ini merupakan ungkapan superlatif bagi tingkat kekudusan tertinggi. “Mahakudus” ringkas, wajar dalam register kitab suci, dan tidak mengubahnya menjadi sebutan ruang tertentu.
theological_decisions:
- issue: Makna formula kekudusan קֹדֶשׁ קָדָשִׁים
  choice: mahakudus
  alternative: yang paling kudus; kudus segala kudus
  rationale: Frasa tersebut menerangkan status tertinggi kekudusan mazbah, bukan merujuk kepada ruang Mahakudus. Terjemahan ini mempertahankan daya superlatif tanpa memasukkan asosiasi ruang yang tidak dinyatakan oleh ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Engkau” mempertahankan sapaan orang kedua tunggal; “mazbah,” “kurban bakaran,” dan “menguduskan” dipakai sebagai istilah ibadah yang tepat sekaligus mudah dikenali. Penanda catatan kaki [a] ditempatkan sesudah frasa yang benar-benar dijelaskannya.
