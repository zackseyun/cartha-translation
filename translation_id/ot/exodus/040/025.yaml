  text: And he set up the lamps before Yahweh[a], just as Yahweh had commanded Moses.
translation:
  language: id
  text: Lalu Musa menyalakan pelita-pelita itu[a] di hadapan Yahweh, tepat seperti yang diperintahkan Yahweh kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “membuat pelita-pelita itu naik”; ungkapan Ibrani ini dapat berarti menyalakan pelita-pelita itu atau memasang dan menatanya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: menyalakan
  rationale: Bentuk Hifil dari עלה secara harfiah berarti ‘membuat naik’. Dalam konteks pelita Kemah Suci, ungkapan ini lazim menunjuk pada tindakan membuat pelita menyala, meskipun dapat pula dipahami sebagai memasang atau menata pelita; kemungkinan lain itu dipertahankan dalam catatan kaki.
- source_word: הַנֵּרֹת
  choice: pelita-pelita itu
  rationale: נֵרֹת menunjuk pada pelita-pelita konkret pada kaki pelita, bukan pada cahaya secara abstrak. Bentuk ulang menyatakan jamak dan ‘itu’ menandai kejelasan nomina Ibrani.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי merupakan ungkapan spasial dan peribadatan yang berarti ‘di hadapan’ atau ‘dalam hadirat’; ‘di hadapan’ alami dan tetap mempertahankan nuansa peribadatan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber dipertahankan.
- source_word: כַּאֲשֶׁר
  choice: tepat seperti
  rationale: Kata penghubung ini menyatakan kesesuaian tindakan dengan perintah sebelumnya; ‘tepat seperti’ menegaskan kesesuaian tersebut.
- source_word: צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: yang diperintahkan Yahweh kepadanya
  rationale: Dalam bahasa Indonesia, konstruksi pasif ini alami dan jelas menyatakan bahwa Musa menaati perintah Yahweh. Pronomina ‘kepadanya’ merujuk kepada Musa yang telah disebut sebagai pelaku pada awal kalimat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi. ‘Yahweh’ mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Makna tindakan terhadap pelita-pelita
  choice: menyalakan
  alternative: memasang atau menata
  rationale: Dalam konteks pelayanan kaki pelita, bentuk kausatif ‘membuat naik’ paling wajar menunjuk pada membuat nyala pelita naik, yakni menyalakannya. Karena verba itu sendiri dapat mencakup pemasangan atau penataan pelita, ambiguitas leksikal dinyatakan dalam catatan kaki dan tidak dijadikan kesimpulan teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Nama ‘Musa’ dinyatakan pada awal kalimat agar subjek yang tersirat dalam verba Ibrani jelas dari konteks, sedangkan ‘kepadanya’ menghindari pengulangan yang kaku.
