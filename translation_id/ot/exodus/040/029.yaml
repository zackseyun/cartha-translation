base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/029.yaml
  text: And he set the altar of burnt offering at the entrance to the tabernacle of the tent of meeting, and offered on it the burnt offering and the grain offering, just as Yahweh had commanded Moses.
translation:
  language: id
  text: Ia menempatkan mezbah kurban bakaran di depan pintu masuk Kemah Suci, yaitu Kemah Pertemuan, lalu mempersembahkan di atasnya kurban bakaran dan persembahan sajian, tepat seperti yang diperintahkan Yahweh kepada Musa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִזְבַּח הָעֹלָה
  choice: mezbah kurban bakaran
  rationale: Frasa konstruksi ini menyebut mezbah menurut fungsi utamanya. “Mezbah kurban bakaran” mempertahankan istilah kultis עֹלָה dan wajar dalam bahasa Indonesia Alkitabiah modern.
- source_word: שָׂם
  choice: menempatkan
  rationale: Dalam konteks pendirian Kemah Suci, “menempatkan” secara jelas menyatakan tindakan meletakkan mezbah pada lokasi yang telah ditentukan.
- source_word: פֶּתַח
  choice: di pintu masuk
  rationale: פֶּתַח menunjuk pada bukaan atau jalan masuk; “di pintu masuk” menyampaikan hubungan ruang secara alami.
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  choice: Kemah Suci, yaitu Kemah Pertemuan
  rationale: Ungkapan Ibrani menumpuk dua sebutan bagi tempat kudus. Bentuk penjelas ini mempertahankan keduanya tanpa menghasilkan rangkaian nomina yang kaku dalam bahasa Indonesia.
- source_word: וַיַּעַל עָלָיו
  choice: lalu mempersembahkan di atasnya
  rationale: Dalam konteks kurban, עלה berarti mempersembahkan kurban di mezbah. “Di atasnya” mempertahankan rujukan eksplisit kepada mezbah.
- source_word: הָעֹלָה
  choice: kurban bakaran
  rationale: Padanan khusus bagi persembahan yang seluruhnya dibakar di mezbah.
- source_word: הַמִּנְחָה
  choice: persembahan sajian
  rationale: Dalam konteks keimaman, מִנְחָה menunjuk pada persembahan berbahan hasil tanaman atau tepung. “Persembahan sajian” merupakan istilah ringkas yang tidak membatasi bahannya hanya pada bulir gandum.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: tepat seperti yang diperintahkan
  rationale: “Tepat seperti” menonjolkan kesesuaian tindakan Musa dengan perintah yang telah diberikan, sedangkan bentuk pasif terasa alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Hubungan antara מִשְׁכַּן dan אֹהֶל מוֹעֵד
  choice: Kemah Suci, yaitu Kemah Pertemuan
  alternative: Kemah Suci dari Kemah Pertemuan
  rationale: Hubungan sintaksis frasa Ibrani sangat rapat, tetapi ungkapan “Kemah Suci dari Kemah Pertemuan” kaku dan dapat menyiratkan dua bangunan. Bentuk penjelas mempertahankan kedua sebutan sambil membiarkan keduanya merujuk pada kompleks kudus yang sama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Istilah kultis “mezbah”, “kurban bakaran”, dan “persembahan sajian” dipertahankan demi ketepatan, sedangkan susunan kalimat dibuat lancar bagi pembaca umum.
