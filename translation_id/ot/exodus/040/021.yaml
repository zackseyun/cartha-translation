base_translation:
  language: en
  yaml_path: translation/ot/exodus/040/021.yaml
  text: He brought the ark into the tabernacle[a], set up the veil of the screen, and screened the ark of the testimony[b], just as Yahweh had commanded Moses.
translation:
  language: id
  text: Ia membawa tabut itu ke dalam Kemah Suci, memasang tirai penyekat itu, dan menutup tabut kesaksian itu dari pandangan, tepat seperti yang diperintahkan Yahweh kepada Musa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֵא אֶת הָאָרֹן
  choice: Ia membawa tabut itu masuk
  rationale: Bentuk kausatif dari בוא menyatakan tindakan membawa masuk; 'tabut' adalah istilah baku bagi peti suci dalam konteks Kemah Suci.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: Dalam kitab Keluaran, מִשְׁכָּן menunjuk kepada tempat kudus portabel tempat Yahweh berdiam; 'Kemah Suci' alami dan sudah dikenal dalam bahasa Indonesia.
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: tirai penyekat
  rationale: פָּרֹכֶת menunjuk kepada tirai bagian dalam, sedangkan הַמָּסָךְ menekankan fungsinya sebagai penyekat; frasa Indonesia ini mempertahankan kedua unsur secara wajar.
- source_word: וַיָּשֶׂם
  choice: memasang
  rationale: Dalam konteks penataan perlengkapan tempat kudus, שׂים berarti menempatkan pada posisinya; 'memasang' paling alami untuk tirai.
- source_word: וַיָּסֶךְ עַל
  choice: menutupi pandangan ke arah ... dengan tirai itu
  rationale: Kata kerja ini menyatakan menutupi atau menyekat. Rumusan ini mengungkap fungsi tirai dalam menyembunyikan atau memisahkan tabut tanpa memberi kesan bahwa tirai dibentangkan langsung di atas tabut.
- source_word: אֲרוֹן הָעֵדוּת
  choice: tabut kesaksian
  rationale: Terjemahan formal ini mempertahankan istilah עֵדוּת dan kaitannya dengan loh-loh kesaksian, tanpa memperluasnya secara interpretatif menjadi 'dokumen perjanjian'.
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: tepat seperti yang diperintahkan Yahweh kepada Musa
  rationale: Rumusan ini menonjolkan kesesuaian tindakan Musa dengan perintah ilahi dan mempertahankan nama diri ilahi יְהוָה sebagai 'Yahweh'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama ilahi alih-alih menggantinya dengan gelar.
- issue: Makna עֵדוּת dalam אֲרוֹן הָעֵדוּת
  choice: kesaksian
  alternative: perjanjian; dokumen perjanjian
  rationale: '''Kesaksian'' mempertahankan istilah Ibrani dan hubungan konseptualnya dengan loh-loh yang ditempatkan dalam tabut, tanpa menyelesaikan nuansanya melalui penjelasan tambahan.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina 'Ia' mengikuti subjek Musa dari konteks. 'Kemah Suci' digunakan sebagai istilah yang mudah dipahami bagi tempat kudus portabel, dan nama 'Yahweh' dipertahankan.
