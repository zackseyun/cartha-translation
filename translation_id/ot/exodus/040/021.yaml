- from: Ia membawa tabut itu masuk ke Kemah Suci, memasang tirai penyekat, lalu menutupi pandangan ke arah tabut kesaksian dengan tirai itu[a], tepat seperti yang diperintahkan Yahweh kepada Musa.
  to: Ia membawa tabut itu ke dalam Kemah Suci, memasang tirai penyekat itu, dan menutup tabut kesaksian itu dari pandangan, tepat seperti yang diperintahkan Yahweh kepada Musa.
  rationale: Revisi mengganti parafrasa yang bertele-tele dengan ungkapan Indonesia yang langsung, sambil mempertahankan ambiguitas wajar kata kerja Ibrani mengenai tindakan menutupi atau menyekat tabut. Penanda catatan kaki dipertahankan pada klausa yang memuat pilihan leksikal tersebut.
