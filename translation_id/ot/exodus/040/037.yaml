  yaml_path: translation/ot/exodus/040/037.yaml
  text: But if the cloud did not rise[a], they did not set out until the day it rose.
translation:
  language: id
  text: Namun, jika awan itu tidak naik, mereka tidak berangkat hingga hari awan itu naik.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “hingga hari naiknya awan itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Gabungan penghubung dan partikel syarat menyatakan keadaan yang berlawanan dengan ayat sebelumnya; “Namun, jika” mempertahankan alur kontras secara alami.
- source_word: לֹא יֵעָלֶה הֶעָנָן
  choice: awan itu tidak terangkat
  rationale: Kata kerja עלה dalam konteks awan yang berada di atas Kemah Suci berarti bergerak naik atau terangkat. Bentuk “terangkat” alami dalam bahasa Indonesia dan tidak menentukan siapa yang mengangkatnya.
- source_word: וְלֹא יִסְעוּ
  choice: mereka tidak berangkat
  rationale: Dalam konteks perjalanan dan perkemahan, נסע menunjuk pada tindakan meninggalkan tempat untuk melanjutkan perjalanan; “berangkat” ringkas dan idiomatis.
- source_word: עַד יוֹם
  choice: sampai pada hari
  rationale: Terjemahan ini mempertahankan יוֹם, “hari,” tanpa menggeneralisasikannya menjadi “waktu.”
- source_word: הֵעָלֹתוֹ
  choice: awan itu terangkat
  rationale: Infinitif konstruk dengan sufiks orang ketiga maskulin tunggal secara harfiah berarti “terangkatnya”; rujukannya adalah awan. Klausa finit lebih jelas dalam bahasa Indonesia.
theological_decisions: []
