  text: And it happened in the first month of the second year[a], on the first day of the month[b], that the tabernacle was set up.
translation:
  language: id
  text: Maka pada bulan pertama tahun kedua, pada hari pertama bulan itu[a], Kemah Suci didirikan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “pada tanggal satu bulan itu.” Ungkapan Ibraninya secara harfiah berbunyi, “pada satu dari bulan itu.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “ditegakkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Maka
  rationale: Bentuk naratif ini melanjutkan rangkaian peristiwa. “Maka” mempertahankan kesinambungan narasi secara wajar tanpa memakai ungkapan harfiah yang kaku seperti “dan terjadilah.”
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: pada bulan pertama
  rationale: Dalam konteks penanggalan, חֹדֶשׁ berarti “bulan,” dan bentuk dengan kata sandang serta bilangan tingkat menunjuk pada bulan pertama.
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: tahun kedua
  rationale: Frasa ini menentukan tahun dalam rumus penanggalan. Susunan “bulan pertama tahun kedua” alami dan jelas dalam bahasa Indonesia.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: pada hari pertama bulan itu
  rationale: Ungkapan Ibrani ini secara idiomatis berarti hari pertama dalam bulan tersebut. Kata “hari” diperjelas dalam terjemahan agar maknanya langsung dipahami.
- source_word: הוּקַם
  choice: didirikan
  rationale: Bentuk Hofal dari קום menyatakan tindakan pasif, yakni bahwa Kemah Suci dibuat berdiri atau dipasang. “Didirikan” alami untuk sebuah kemah atau bangunan suci portabel.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: מִשְׁכָּן di sini menunjuk pada tempat ibadah portabel yang pembuatannya dijelaskan dalam Kitab Keluaran. “Kemah Suci” merupakan istilah Indonesia yang jelas dan khusus dalam konteks ini.
