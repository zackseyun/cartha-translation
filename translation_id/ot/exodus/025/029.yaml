base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/029.yaml
  text: You shall make its plates and its dishes[a], and its pitchers and its bowls with which the drink offering is poured[b]; you shall make them of pure gold.
translation:
  language: id
  text: Buatlah pinggan-pinggannya, cawan-cawannya, kendi-kendinya, dan mangkuk-mangkuknya yang dipakai untuk mencurahkan persembahan curahan.[a] Buatlah semuanya dari emas murni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani untuk dua jenis wadah terakhir jarang dipakai, sehingga identifikasi atau fungsi tepatnya tidak pasti; keduanya berkaitan dengan pencurahan persembahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְּעָרֹתָיו
  choice: pinggan-pinggannya
  rationale: Kata ini menunjuk pada wadah yang relatif datar. “Pinggan” wajar dalam konteks perlengkapan meja dan membedakannya dari jenis wadah berikutnya.
- source_word: כַפֹּתָיו
  choice: cawan-cawannya
  rationale: כַּף dapat menunjuk pada benda berbentuk telapak tangan dan, sebagai perluasan makna, wadah kecil. “Cawan” mempertahankan gambaran sebuah wadah tanpa menetapkan fungsi yang tidak dinyatakan.
- source_word: קְשׂוֹתָיו
  choice: kendi-kendinya
  rationale: Istilah perlengkapan ibadah ini langka dan makna tepatnya tidak pasti. Dalam konteks tindakan mencurahkan, “kendi” secara alami menyampaikan gagasan wadah penampung dan penuang cairan.
- source_word: מְנַקִּיֹּתָיו
  choice: mangkuk-mangkuknya
  rationale: Istilah ini menunjuk pada wadah yang berkaitan dengan pencurahan. “Mangkuk” merupakan padanan umum yang tidak terlalu memperinci bentuk atau ukurannya.
- source_word: אֲשֶׁר יֻסַּךְ בָּהֵן
  choice: yang dipakai untuk mencurahkan persembahan curahan
  rationale: Bentuk pasif dari נסך merujuk pada tindakan mencurahkan cairan sebagai persembahan. Penyebutan “persembahan curahan” mengungkapkan makna ritual yang tersirat dalam verba dan konteksnya.
- source_word: זָהָב טָהוֹר
  choice: emas murni
  rationale: Ini adalah padanan baku dan alami bagi ketentuan bahan dalam petunjuk pembuatan Kemah Suci.
- source_word: וְעָשִׂיתָ ... תַּעֲשֶׂה אֹתָם
  choice: Buatlah ... Semuanya harus kaubuat
  rationale: Susunan ini mempertahankan pengulangan perintah Ibrani sambil menghasilkan kalimat instruksional yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Objek yang dicurahkan tidak disebut secara eksplisit dalam bahasa Ibrani.
  choice: persembahan curahan
  alternative: yang dipakai untuk mencurahkan
  rationale: Dalam konteks perlengkapan ibadah, verba נסך secara khusus menyatakan pencurahan sebagai persembahan. Padanan ini membuat makna ritualnya jelas tanpa menentukan jenis cairan yang tidak disebutkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bersifat instruksional. Bentuk terikat “-nya” dipertahankan pada setiap benda untuk menunjukkan bahwa semua perlengkapan itu milik atau diperuntukkan bagi meja yang disebut dalam konteks sebelumnya.
