  text: Its tongs and its firepans shall be of pure gold[a][b].
translation:
  language: id
  text: Penjepitnya[a] dan wadah baranya[b] harus terbuat dari emas murni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pemotong sumbunya”; istilah Ibrani ini menunjuk pada alat untuk menjepit atau merapikan sumbu yang berkaitan dengan kaki pelita.
    reason: lexical_alternative
  - marker: b
    text: Atau “nampannya,” atau—yang kurang mungkin dalam konteks ini—“pedupaannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְקָחֶיהָ
  choice: penjepitnya
  rationale: Kata ini menunjuk pada alat untuk menjepit atau merapikan sumbu dalam konteks kaki pelita. “Penjepit” alami dalam bahasa Indonesia modern dan tidak mempersempit fungsinya secara berlebihan.
- source_word: מַחְתֹּתֶיהָ
  choice: wadah baranya
  rationale: Kata ini biasanya menunjuk pada wadah untuk membawa bara atau api. “Wadah bara” mempertahankan fungsi perkakas tersebut tanpa menentukannya secara terlalu khusus sebagai pedupaan.
- source_word: זָהָב טָהוֹר
  choice: dari emas murni
  rationale: Frasa ini menyatakan bahan pembuatannya; bentuk “dari emas murni” wajar sesudah konstruksi verbal “harus dibuat”.
- source_word: וּ
  choice: dan
  rationale: Konjungsi berawalan ini menghubungkan kedua jenis perkakas.
- source_word: ־הָ
  choice: -nya
  rationale: Akhiran orang ketiga feminin tunggal merujuk kepada kaki pelita; bahasa Indonesia secara alami memakai bentuk posesif netral “-nya”.
