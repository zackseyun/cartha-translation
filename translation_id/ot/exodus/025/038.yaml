  register: Bahasa Indonesia baku modern dengan gaya ringkas dan bermartabat. Bentuk “harus dibuat” menyampaikan daya instruksional yang tersirat dalam rangkaian perintah pembuatan perlengkapan Kemah Suci, sedangkan penanda catatan kaki ditempatkan langsung setelah istilah terkait.
