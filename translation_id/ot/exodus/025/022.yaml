base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/022.yaml
  text: And there I will meet with you[a], and I will speak with you from above the mercy seat, from between the two cherubim that are over the ark of the testimony[b], about all that I will command you for the sons of Israel.
translation:
  language: id
  text: Di sanalah Aku akan bertemu denganmu dan berbicara denganmu dari atas tutup pendamaian[a], dari antara kedua kerub yang berada di atas tabut Kesaksian, tentang segala sesuatu yang akan Kuperintahkan kepadamu untuk anak-anak Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tutup tabut”; secara tradisional juga disebut “takhta belas kasihan.” Istilah Ibrani menunjuk pada tutup emas tabut yang berkaitan dengan upacara pendamaian.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “kepada anak-anak Israel” atau, dengan memperjelas maksudnya, “untuk disampaikan kepada anak-anak Israel.” Bahasa Ibraninya ringkas dan secara harfiah memakai ungkapan “kepada/untuk anak-anak Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנוֹעַדְתִּי לְךָ שָׁם
  choice: Di sanalah Aku akan bertemu denganmu
  rationale: Bentuk Nifal dari יעד menyatakan pertemuan yang ditetapkan. Susunan “di sanalah” menegaskan lokasi yang baru saja dijelaskan tanpa menambah tafsiran.
- source_word: וְדִבַּרְתִּי אִתְּךָ
  choice: dan berbicara denganmu
  rationale: Preposisi אֵת mendukung nuansa komunikasi langsung “denganmu,” bukan sekadar penyampaian satu arah.
- source_word: מֵעַל הַכַּפֹּרֶת
  choice: dari atas tutup pendamaian
  rationale: “Dari atas” menyatakan lokasi asal suara, sedangkan “tutup pendamaian” mengenali benda suci di atas tabut dan mempertahankan kaitan kultis istilah Ibrani.
- source_word: מִבֵּין שְׁנֵי הַכְּרֻבִים
  choice: dari antara kedua kerub
  rationale: Terjemahan langsung dan wajar bagi keterangan tempat; “kerub” merupakan bentuk serapan yang lazim dalam bahasa Indonesia.
- source_word: אֲשֶׁר עַל אֲרֹן הָעֵדֻת
  choice: yang berada di atas tabut Kesaksian
  rationale: Frasa ini mempertahankan posisi kedua kerub dan menerjemahkan הָעֵדֻת secara formal sebagai “Kesaksian,” tanpa mempersempitnya menjadi loh-loh.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּה אֹתְךָ
  choice: tentang segala sesuatu yang akan Kuperintahkan kepadamu
  rationale: “Tentang” menghubungkan isi pembicaraan dengan semua perintah yang akan diberikan, sedangkan “segala sesuatu” mempertahankan cakupan כָּל.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: untuk keturunan Israel
  rationale: “Untuk” mempertahankan kepadatan dan keluwesan fungsi אֶל dalam susunan ini. “Keturunan Israel” menjaga ungkapan kekeluargaan בְּנֵי יִשְׂרָאֵל secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna הַכַּפֹּרֶת
  choice: tutup pendamaian
  alternative: tutup tabut; takhta belas kasihan
  rationale: “Tutup pendamaian” mengenali benda konkret berupa tutup emas pada tabut sekaligus mempertahankan bobot kultisnya. Pilihan ini tidak menentukan secara berlebihan teori tertentu tentang pendamaian.
- issue: Hubungan perintah dengan בְּנֵי יִשְׂרָאֵל
  choice: yang akan Kuperintahkan kepadamu untuk keturunan Israel
  alternative: yang akan Kuperintahkan kepadamu untuk disampaikan kepada keturunan Israel
  rationale: Teks utama mempertahankan konstruksi Ibrani yang ringkas dan tidak menyisipkan kata “disampaikan,” meskipun konteks sangat mungkin menyiratkan bahwa Musa harus meneruskan perintah itu.
- issue: Identitas הָעֵדֻת
  choice: Kesaksian
  alternative: loh-loh kesaksian; dokumen perjanjian
  rationale: Bahasa Ibrani hanya menyebut “Kesaksian” di sini. Terjemahan ini menghindari penjelasan yang lebih khusus daripada bunyi ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi ditulis dengan huruf kapital sesuai kelaziman penerbitan Alkitab bahasa Indonesia. Kalimat mempertahankan pengulangan keterangan tempat dalam sumber Ibrani serta ambiguitas hubungan preposisional pada bagian akhir ayat.
