  text: They shall make an ark of acacia wood[a], two and a half cubits its length, a cubit and a half its width[c][b], and a cubit and a half its height.
translation:
  language: id
  text: “Mereka harus membuat sebuah tabut[a] dari kayu akasia, panjangnya dua setengah hasta[b], lebarnya satu setengah hasta, dan tingginya satu setengah hasta.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “tabut” juga dapat berarti “peti” atau “wadah”. Istilah “tabut” digunakan di sini karena konteksnya adalah benda suci yang kemudian disebut Tabut Perjanjian.
    reason: lexical_alternative
  - marker: b
    text: Satu hasta adalah satuan panjang kuno, kira-kira sepanjang jarak dari siku sampai ujung jari.
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: Mereka harus membuat
  rationale: Bentuk jamak dalam konteks petunjuk ilahi menyatakan kewajiban; 'harus membuat' alami dalam bahasa Indonesia dan tetap mempertahankan subjek jamak.
- source_word: אֲרוֹן
  choice: tabut
  rationale: Kata Ibrani ini pada dasarnya menunjuk peti atau wadah, tetapi 'tabut' adalah istilah Indonesia yang mapan untuk benda suci dalam konteks Kemah Suci.
- source_word: עֲצֵי שִׁטִּים
  choice: kayu akasia
  rationale: Frasa konstruksi ini menyebut bahan pembuatannya; 'kayu akasia' merupakan padanan modern yang jelas.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: dua setengah hasta
  rationale: Ukuran sumber dipertahankan tanpa konversi, dengan susunan bilangan yang alami dalam bahasa Indonesia.
- source_word: אָרְכּוֹ
  choice: panjangnya
  rationale: Akhiran pronominal orang ketiga tunggal mengacu kepada tabut; bentuk '-nya' ringkas dan alami.
- source_word: וְאַמָּה וָחֵצִי
  choice: satu setengah hasta
  rationale: Ungkapan Ibrani harfiah 'satu hasta dan setengah' disampaikan dengan bentuk Indonesia yang lebih alami tanpa mengubah nilainya.
- source_word: רָחְבּוֹ
  choice: lebarnya
  rationale: Menunjukkan dimensi horizontal tabut dan secara alami mempertahankan rujukan pronominalnya.
- source_word: קֹמָתוֹ
  choice: tingginya
  rationale: Dalam pemerian benda, kata ini menunjuk dimensi vertikal, sehingga 'tingginya' merupakan padanan yang tepat.
