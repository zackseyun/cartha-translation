  yaml_path: translation/ot/exodus/025/016.yaml
  text: And you shall put into the ark the testimony that I will give you[a].
translation:
  language: id
  text: Haruslah engkau menaruh ke dalam tabut itu kesaksian yang akan Kuberikan kepadamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, secara lebih khusus menurut konteks: “loh-loh kesaksian.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: Haruslah engkau menaruh
  rationale: Dalam konstruksi ini, נָתַן menyatakan tindakan menempatkan sesuatu. Bentuk ‘haruslah’ menyampaikan daya perintah dari bentuk perfektum berwaw dalam rangkaian petunjuk, sedangkan ‘menaruh’ alami dalam bahasa Indonesia.
- source_word: אֶל
  choice: ke dalam
  rationale: Walaupun arti dasarnya ‘ke/kepada’, bersama verba penempatan dan wadah berupa tabut, frasa Indonesia ‘ke dalam’ secara tepat menyatakan gerak memasukkan.
- source_word: הָאָרֹן
  choice: tabut itu
  rationale: ‘Tabut’ adalah istilah Indonesia yang mapan untuk peti kudus dalam konteks Kemah Suci. Penunjuk ‘itu’ secara alami mewakili ke definitan nomina Ibrani dan merujuk pada tabut yang baru saja diperintahkan untuk dibuat.
- source_word: הָעֵדֻת
  choice: kesaksian
  rationale: עֵדוּת berarti ‘kesaksian’ atau ‘saksi’ dan dalam kitab Keluaran menunjuk pada kesaksian perjanjian yang diberikan Allah. Pilihan ini tidak mempersempit rujukannya menjadi loh-loh dalam teks utama.
- source_word: אֲשֶׁר אֶתֵּן אֵלֶיךָ
  choice: yang akan Kuberikan kepadamu
  rationale: Klausa relatif dipertahankan; bentuk imperfek orang pertama menyatakan tindakan yang akan datang, dan אֵלֶיךָ diterjemahkan eksplisit sebagai ‘kepadamu’.
theological_decisions:
- issue: Rujukan ‘kesaksian’
  choice: Mempertahankan sebutan umum ‘kesaksian’ dalam teks utama.
  alternative: Menafsirkan dan menerjemahkannya secara khusus sebagai ‘loh-loh kesaksian’.
  rationale: Ayat Ibrani ini hanya menyebut הָעֵדֻת, sedangkan konteks yang lebih luas mengidentifikasikannya dengan loh-loh. Terjemahan utama mempertahankan keluasan ungkapan sumber; catatan kaki memberi penjelasan kontekstual tanpa menambahkannya ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk ‘engkau’ dan kapitalisasi ‘Kuberikan’ mengikuti sapaan tunggal kepada Musa dan tuturan ilahi; susunan kalimat dibuat alami tanpa menghilangkan hubungan sintaksis teks Ibrani.
