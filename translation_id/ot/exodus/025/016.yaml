  source_fidelity: 'Teks Indonesia menerjemahkan seluruh unsur utama Ibrani dengan setia: וְנָתַתָּ sebagai perintah untuk menempatkan, אֶל sebagai gerak masuk ke dalam, הָאָרֹן sebagai tabut, dan הָעֵדֻת sebagai "kesaksian." Klausa "yang akan Kuberikan kepadamu" mempertahankan aspek futurum אֶתֵּן dan penerima tunggal אֵלֶיךָ. Terjemahan tidak secara tidak perlu mempersempit "kesaksian" menjadi loh-loh dalam teks utama.'
