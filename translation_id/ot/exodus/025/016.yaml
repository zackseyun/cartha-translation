  terminology: '"Tabut" merupakan istilah mapan dan tepat dalam konteks Kemah Suci. "Kesaksian" secara leksikal setia kepada עֵדוּת dan mempertahankan rujukan yang belum diperinci dalam ayat ini. Kapitalisasi "Kuberikan" konsisten dengan tuturan Allah dalam register Alkitab Indonesia.'
