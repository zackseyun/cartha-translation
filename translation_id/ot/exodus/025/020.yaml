  text: וְ/הָי֣וּ הַ/כְּרֻבִים֩ פֹּרְשֵׂ֨י כְנָפַ֜יִם לְ/מַ֗עְלָ/ה סֹכְכִ֤ים בְּ/כַנְפֵי/הֶם֙ עַל הַ/כַּפֹּ֔רֶת וּ/פְנֵי/הֶ֖ם אִ֣ישׁ אֶל אָחִ֑י/ו אֶל הַ/כַּפֹּ֔רֶת יִהְי֖וּ פְּנֵ֥י הַ/כְּרֻבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/020.yaml
  text: And the cherubim shall spread out their wings upward[a], overshadowing the mercy seat with their wings, and their faces shall be one toward another; the faces of the cherubim shall be toward the mercy seat.
translation:
  language: id
  text: Kerub-kerub itu harus membentangkan sayapnya ke atas dan menaungi tutup pendamaian[a] dengan sayap mereka. Wajah mereka harus saling berhadapan, dan wajah kerub-kerub itu harus menghadap tutup pendamaian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: kapporet, yaitu penutup emas pada tabut; dapat juga diterjemahkan “tutup pengampunan.”'
    reason: Menjelaskan benda khusus yang dimaksud dan mempertahankan alternatif terjemahan bagi istilah kultis Ibrani.
lexical_decisions:
- source_word: וְהָיוּ הַכְּרֻבִים פֹּרְשֵׂי כְנָפַיִם לְמַעְלָה
  choice: Kerub-kerub itu harus membentangkan sayapnya ke atas
  rationale: Dalam konteks petunjuk pembuatan Kemah Suci, bentuk Ibrani ini menyatakan ketentuan. Ungkapan aktif ini alami dalam bahasa Indonesia dan mempertahankan arah sayap ke atas.
- source_word: סֹכְכִים בְּכַנְפֵיהֶם
  choice: menaungi ... dengan sayap mereka
  rationale: Kata kerja סכך menggambarkan tindakan menutupi atau menaungi; 'menaungi' mempertahankan gambaran sayap yang terbentang di atas benda tersebut.
- source_word: הַכַּפֹּרֶת
  choice: tutup pendamaian
  rationale: Istilah ini menunjuk pada penutup emas tabut yang memiliki fungsi penting dalam ritus pendamaian. 'Tutup pendamaian' lebih konkret dan mudah dipahami dalam bahasa Indonesia daripada mempertahankan metafora tempat duduk.
- source_word: וּפְנֵיהֶם אִישׁ אֶל אָחִיו
  choice: Wajah mereka harus saling berhadapan
  rationale: Ungkapan distributif harfiah 'masing-masing kepada saudaranya' menyatakan bahwa kedua kerub itu berhadapan satu sama lain; terjemahan ini mempertahankan unsur konkret 'wajah' secara alami.
- source_word: אֶל הַכַּפֹּרֶת יִהְיוּ פְּנֵי הַכְּרֻבִים
  choice: wajah kerub-kerub itu harus menghadap tutup pendamaian
  rationale: Susunan ini mempertahankan penyebutan wajah dan orientasinya kepada tutup tabut, tanpa menghilangkan pengulangan yang terdapat dalam teks Ibrani.
theological_decisions:
- issue: Makna kultis כַּפֹּרֶת dalam petunjuk tentang tabut
  choice: tutup pendamaian
  alternative: tutup pengampunan; penutup tabut
  rationale: Pilihan utama mempertahankan bahwa benda itu merupakan penutup tabut sekaligus berkaitan dengan pendamaian, tanpa menetapkan teori pendamaian tertentu. Catatan kaki menjelaskan referennya dan mengakui alternatif leksikal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'harus' menyampaikan daya instruktif teks. 'Kerub-kerub' memakai bentuk jamak Indonesia yang jelas. Kalimat dibagi dua agar mudah dibaca tanpa menghilangkan kesejajaran dan pengulangan sumber.
