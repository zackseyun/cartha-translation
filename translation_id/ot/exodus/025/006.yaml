  text: minyak untuk penerangan, rempah-rempah untuk minyak urapan dan untuk dupa dari rempah-rempah[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dupa dari bahan-bahan aromatik.”
    reason: Menunjukkan alternatif leksikal bagi הַסַּמִּים tanpa mengubah konstruksi “dupa dari …” dalam teks utama.
lexical_decisions:
- source_word: שֶׁמֶן
  choice: minyak
  rationale: Kata Ibrani ini berarti ‘minyak’ secara umum. Walaupun dalam konteks Kemah Suci kemungkinan besar yang dimaksud ialah minyak zaitun, ayat ini tidak menyebutkan jenisnya.
- source_word: לַמָּאֹר
  choice: untuk penerangan
  rationale: מָאוֹר berkaitan dengan sumber cahaya atau penerangan. ‘Untuk penerangan’ menyampaikan fungsi minyak secara alami tanpa mempersempitnya menjadi satu pelita tertentu.
- source_word: בְּשָׂמִים
  choice: rempah-rempah
  rationale: Bentuk jamak ini menunjuk pada bahan-bahan aromatik yang dipakai dalam pembuatan perlengkapan ibadah; ‘rempah-rempah’ jelas dan wajar dalam bahasa Indonesia.
- source_word: לְשֶׁמֶן הַמִּשְׁחָה
  choice: untuk minyak pengurapan
  rationale: Ungkapan ini menunjukkan tujuan rempah-rempah tersebut, yaitu untuk membuat minyak khusus yang dipakai dalam pengurapan.
- source_word: קְטֹרֶת הַסַּמִּים
  choice: untuk dupa harum
  rationale: Dalam konteks Kemah Suci, קְטֹרֶת berarti ‘dupa’. Ungkapan konstruk dengan הַסַּמִּים secara idiomatis dapat diterjemahkan ‘dupa harum’, sementara bentuk harfiahnya dijelaskan dalam catatan kaki.
