  text: You shall overlay it with pure gold[a], and you shall make for it a gold molding all around.
translation:
  language: id
  text: Lapisi meja itu dengan emas murni dan buatlah tepi hias dari emas di sekelilingnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lis emas”, “pinggiran emas”, atau “mahkota emas”; kata Ibrani ini dapat menunjuk pada tepian hias yang mengelilingi meja.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ
  choice: Lapisi
  rationale: Dalam konteks pengerjaan perabot kayu, verba צפה menyatakan pelapisan dengan logam; “lapisi” alami dan tepat dalam bahasa Indonesia.
- source_word: אֹתוֹ
  choice: meja itu
  rationale: Pronomina objek merujuk kepada meja pada ayat sebelumnya. Mengulangi nomina membuat rujukannya jelas dalam kutipan ayat yang berdiri sendiri.
- source_word: זָהָב טָהוֹר
  choice: emas murni
  rationale: Ungkapan ini menunjuk pada emas berkadar tinggi; “emas murni” merupakan padanan Indonesia yang langsung dan lazim.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: dan buatlah
  rationale: Bentuk instruktif diterjemahkan dengan imperatif Indonesia. Hubungan “untuknya” sudah tersampaikan secara alami melalui objek dan frasa lokasi, sehingga tidak perlu dinyatakan secara kaku.
- source_word: זֵר זָהָב
  choice: bingkai emas
  rationale: זֵר dalam konteks perabot Kemah Suci menunjuk pada tepian dekoratif yang mengelilingi meja. “Bingkai” cukup alami dan tidak menimbulkan kesan mahkota yang dikenakan.
- source_word: סָבִיב
  choice: di sekelilingnya
  rationale: Padanan ini menyatakan bahwa bingkai tersebut mengitari meja pada semua sisinya.
