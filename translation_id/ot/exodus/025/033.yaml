base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/033.yaml
  text: three almond-blossom-shaped cups on the one branch[a], with bulb and flower, and three almond-blossom-shaped cups on the one branch, with bulb and flower[c][b]; so it shall be for the six branches coming out from the lampstand.
translation:
  language: id
  text: Pada satu cabang ada tiga cawan berbentuk bunga badam[a], beserta bonggol[b] dan bunga; dan pada satu cabang ada tiga cawan berbentuk bunga badam, beserta bonggol dan bunga. Demikianlah halnya dengan keenam cabang yang keluar dari kaki pelita[c] itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “tiga cawan yang dibuat menyerupai bunga badam.”
    reason: lexical_alternative
  - marker: b
    text: “Bonggol” menerjemahkan kata Ibrani כַּפְתֹּר, yaitu tonjolan hias berbentuk bulat; dapat juga diterjemahkan “tombol”.
    reason: lexical_alternative
  - marker: c
    text: Kata Ibrani מְנֹרָה sering ditransliterasikan sebagai “menorah”.
    reason: lexical_alternative
lexical_decisions:
- source_word: גְבִעִים
  choice: cawan
  rationale: Kata ini menunjuk pada wadah atau hiasan berbentuk cawan. “Cawan” mempertahankan bentuk konkret yang dimaksud dalam rancangan kaki pelita.
- source_word: מְשֻׁקָּדִים
  choice: berbentuk bunga badam
  rationale: Bentuk ini berasal dari שׁקד, “badam”, dan dalam konteks hiasan menggambarkan cawan yang dibuat menyerupai bunga badam, bukan sekadar buah badam.
- source_word: קָּנֶה
  choice: cabang
  rationale: Dalam gambaran kaki pelita, kata ini menunjuk pada batang yang menjulur dari batang utama. “Cabang” sesuai dengan citra tumbuhan yang diperkuat oleh hiasan bunga.
- source_word: כַּפְתֹּר
  choice: bonggol
  rationale: Istilah ini menunjuk pada tonjolan hias berbentuk bulat. “Bonggol” cukup konkret dan selaras dengan rancangan bercorak tumbuhan, sementara kemungkinan “tombol” dicatat dalam catatan kaki.
- source_word: פֶרַח / פָרַח
  choice: bunga
  rationale: Kata benda ini berarti bunga atau kembang. “Bunga” merupakan padanan Indonesia modern yang wajar dan tidak mengulang kata “bunga” sebagai unsur bentuk majemuk secara berlebihan.
- source_word: כֵּן
  choice: demikianlah bentuk
  rationale: Ungkapan ini merangkum bahwa pola yang baru dijelaskan berlaku pada keenam cabang. Penambahan “bentuk” membuat hubungan tersebut jelas tanpa mengubah isinya.
- source_word: לְשֵׁשֶׁת הַקָּנִים
  choice: keenam cabang
  rationale: Frasa ini menyatakan bahwa susunan yang sama berlaku pada seluruh enam cabang.
- source_word: הַיֹּצְאִים מִן הַמְּנֹרָה
  choice: yang keluar dari kaki pelita itu
  rationale: Terjemahan ini mempertahankan gambaran cabang-cabang yang menjulur keluar dari bagian utama kaki pelita.
- source_word: מְנֹרָה
  choice: kaki pelita
  rationale: Ini adalah benda yang menyangga pelita-pelita. “Kaki pelita” merupakan padanan maknawi yang jelas dalam bahasa Indonesia; transliterasi “menorah” dicatat sebagai alternatif.
theological_decisions:
- issue: Pengulangan הָאֶחָד pada kedua kelompok cabang
  choice: “cabang yang satu” dan “cabang yang satu lagi”
  alternative: Mengulang secara harfiah “cabang yang satu” pada kedua klausa
  rationale: Teks Ibrani mengulang bentuk yang secara harfiah berarti “yang satu”. Dalam pasangan paralel ini, bahasa Indonesia secara alami menyatakan cabang pasangan sebagai “yang satu lagi”. Pilihan ini tidak menentukan simbolisme atau rincian teologis apa pun, tetapi menyampaikan pola distributif yang kemudian diterapkan kepada keenam cabang.
translation_notes:
  register: Bahasa yang dipakai modern, lugas, dan bermartabat. Kalimat Ibrani yang panjang dibagi menjadi tiga kalimat agar rincian teknis mudah dipahami. Istilah benda tetap konkret, dan pola tumbuhan pada rancangan kaki pelita dipertahankan.
