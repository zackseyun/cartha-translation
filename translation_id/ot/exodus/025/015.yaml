translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'kayu-kayu' dipertahankan demi kejelasan rujukan, sedangkan 'harus tetap berada' menyampaikan daya duratif perintah tanpa menghapus alternatif harfiahnya.
