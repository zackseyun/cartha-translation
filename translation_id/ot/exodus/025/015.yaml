  text: The poles shall remain in the rings of the ark[a]; they shall not be removed from it.
translation:
  language: id
  text: Galah-galah pengusung itu harus tetap berada di dalam gelang-gelang tabut[a]; galah-galah itu tidak boleh dikeluarkan dari tabut itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Galah-galah pengusung itu harus berada di dalam gelang-gelang tabut; galah-galah itu tidak boleh diambil dari tabut itu.”
    reason: Alternatif ini memakai terjemahan yang lebih dekat dengan arti dasar יִהְיוּ, “harus berada,” dan לֹא יָסֻרוּ, “tidak boleh diambil/disingkirkan.”
lexical_decisions:
- source_word: בְּטַבְּעֹת
  choice: dalam gelang-gelang
  rationale: טַבַּעַת menunjuk pada gelang tempat kayu pengusung dimasukkan; preposisi בְ secara wajar diterjemahkan 'dalam' untuk menyatakan posisinya.
- source_word: הָאָרֹן
  choice: tabut
  rationale: Dalam konteks Kemah Suci, אָרוֹן adalah tabut suci; 'tabut' merupakan istilah Indonesia yang tepat dan sudah dikenal.
- source_word: יִהְיוּ
  choice: harus tetap berada
  rationale: Secara harfiah berarti 'akan/harus berada', tetapi konteks dan larangan berikutnya menunjukkan keadaan yang harus terus dipertahankan.
- source_word: הַבַּדִּים
  choice: kayu-kayu pengusung
  rationale: בַּדִּים adalah batang atau kayu yang dipakai untuk mengusung tabut. Pilihan ini lebih jelas daripada sekadar 'kayu-kayu' dan lebih alami daripada istilah yang kuno.
- source_word: לֹא יָסֻרוּ
  choice: tidak boleh dikeluarkan
  rationale: סוּר dapat berarti menyingkir, beralih, atau disingkirkan. Dalam konteks benda yang berada dalam gelang, bentuk ini menyatakan larangan mengeluarkan kayu-kayu tersebut.
- source_word: מִמֶּנּוּ
  choice: dari sana
  rationale: Akhiran pronominal tunggal merujuk pada tabut. Dalam bahasa Indonesia, 'dari sana' secara alami mengacu pada tempat kayu-kayu itu berada, yaitu gelang-gelang tabut, tanpa menimbulkan bentuk janggal 'darinya'.
