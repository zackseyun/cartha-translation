  yaml_path: translation/ot/exodus/025/037.yaml
  text: You shall make its seven lamps[b][a], and he shall set up its lamps so that they give light in front of it.
translation:
  language: id
  text: Buatlah tujuh pelitanya, lalu ia harus memasang pelita-pelitanya[a] sehingga pelita-pelita itu menerangi ke arah depan kaki pelita itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “lalu ia harus menyalakan pelita-pelitanya sehingga pelita-pelita itu menerangi ke arah depan kaki pelita itu.” Kata kerja Ibrani secara harfiah dapat berarti “membuat naik”; dalam konteks ini, maknanya dapat mencakup menyalakan maupun memasang pelita-pelita itu. Subjek “ia” tidak disebutkan secara eksplisit, tetapi bentuk kata kerjanya tunggal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Buatlah
  rationale: Bentuk Qal perfektum dengan waw dalam konteks petunjuk berfungsi sebagai perintah kepada Musa; bentuk imperatif Indonesia menyampaikan daya perintah secara alami.
- source_word: נֵרֹתֶיהָ שִׁבְעָה
  choice: ketujuh pelitanya
  rationale: נֵר menunjuk pada pelita, sedangkan sufiks feminin tunggal merujuk kepada kaki pelita; שִׁבְעָה menyatakan jumlah tujuh.
- source_word: וְהֶעֱלָה
  choice: lalu ia harus memasang
  rationale: Bentuk Hifil orang ketiga maskulin tunggal dari עלה secara harfiah berarti 'membuat naik'. Dalam konteks pelita, ungkapan ini dapat berarti memasang atau menyalakan; 'memasang' mempertahankan tindakan tersendiri tanpa memastikan bahwa yang dimaksud hanya penyalaan. Subjek tunggalnya tidak disebutkan.
- source_word: וְהֵאִיר
  choice: supaya menerangi
  rationale: Bentuk Hifil dari אור menyatakan hasil atau tujuan penempatan pelita, yakni memberikan terang.
- source_word: עַל עֵבֶר פָּנֶיהָ
  choice: bagian di depannya
  rationale: Gabungan עֵבֶר dan פָּנִים menunjuk kepada sisi atau kawasan di depan kaki pelita; pilihan ini menyampaikan arah pancaran tanpa menjadikan kaki pelita itu sendiri sebagai objek yang diterangi.
theological_decisions:
- issue: Subjek tersirat pada וְהֶעֱלָה
  choice: 'Dipertahankan sebagai orang ketiga tunggal: ''ia'''
  alternative: '''mereka'' atau menyebut ''imam'' secara eksplisit'
  rationale: Teks Ibrani memakai bentuk orang ketiga maskulin tunggal tetapi tidak menyebut identitas pelakunya. Bentuk tunggal dipertahankan, sementara identitasnya tidak ditambahkan ke dalam teks.
- issue: Makna tindakan terhadap pelita
  choice: '''memasang'' dalam teks utama dengan alternatif ''menyalakan'' dalam catatan kaki'
  alternative: Langsung menerjemahkan 'menyalakan'
  rationale: Hifil עלה dalam pemakaian kultis dapat mencakup pemasangan atau penyalaan. Catatan kaki menjaga ambiguitas leksikal yang nyata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Pelita' dipilih sebagai istilah yang jelas bagi lampu berbahan bakar minyak dalam konteks Kemah Suci. Pronomina 'ia' mempertahankan subjek orang ketiga tunggal yang tidak dinamai; akhiran '-nya' merujuk kepada kaki pelita dari konteks sebelumnya.
