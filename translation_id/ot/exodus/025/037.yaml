  terminology: '"Pelita" dan "kaki pelita" sesuai dengan terminologi perlengkapan Kemah Suci. "Memasang" merupakan pilihan utama yang dapat dipertahankan untuk Hifil עלה, dengan "menyalakan" sebagai alternatif yang dijelaskan dalam catatan kaki.'
