  yaml_path: translation/ot/exodus/025/011.yaml
  text: You shall overlay it with pure gold; from the inside and from the outside you shall overlay it[a], and you shall make on it a gold molding all around.
translation:
  language: id
  text: Engkau harus melapisinya dengan emas murni; bagian dalam maupun luarnya harus kaulapisi. Buatlah lis emas[a] di sekelilingnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bingkai emas” atau “tepian emas”; secara tradisional: “mahkota emas.” Kata Ibrani זֵר menunjuk pada tepian hias yang mengelilingi benda itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצִפִּיתָ / תְּצַפֶּנּוּ
  choice: harus melapisinya / harus kaulapisi
  rationale: Dalam konteks pembuatan perlengkapan Kemah Suci, צפה berarti menutupi permukaan benda dengan lapisan logam. “Melapisi” tepat dan lazim dalam bahasa Indonesia untuk pengerjaan dengan emas serta mempertahankan pengulangan verba Ibrani.
- source_word: זָהָב טָהוֹר
  choice: emas murni
  rationale: Ungkapan ini menunjuk pada emas yang telah dimurnikan dan tidak bercampur; “emas murni” merupakan padanan Indonesia modern yang jelas dan wajar.
- source_word: מִבַּיִת וּמִחוּץ
  choice: bagian dalam maupun luarnya
  rationale: Pasangan ini menunjuk pada kedua permukaan, interior dan eksterior. Bentuk “bagian dalam maupun luarnya” menyampaikan kontras sekaligus cakupan keduanya secara alami.
- source_word: וְעָשִׂיתָ עָלָיו
  choice: buatlah ... di sekelilingnya
  rationale: Perintah untuk membuat hiasan pada peti disampaikan dengan imperatif Indonesia yang wajar. Hubungan עָלָיו dengan benda tetap tersirat melalui akhiran “-nya” dan keterangan posisi.
- source_word: זֵר זָהָב
  choice: lis emas
  rationale: זֵר di sini menunjuk pada tepian hias yang mengelilingi sebuah benda, bukan mahkota untuk kepala. “Lis emas” adalah istilah Indonesia yang ringkas dan mudah dipahami untuk jalur atau bingkai hias pada perabot.
- source_word: סָבִיב
  choice: di sekelilingnya
  rationale: Padanan ini menyatakan bahwa lis tersebut mengitari benda pada semua sisinya dan terdengar alami dalam bahasa Indonesia modern.
