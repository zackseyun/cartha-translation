translation:
  language: id
  text: kulit domba jantan yang diwarnai merah, kulit takhas[a], dan kayu akasia,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Arti kata Ibrani תְּחָשִׁים (tekhasyim) tidak pasti. Kata ini mungkin menunjuk pada kulit dugong, kulit lumba-lumba, atau suatu jenis kulit bermutu tinggi.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹרֹת
  choice: kulit
  rationale: Bentuk jamak terikat dari עוֹר menunjuk pada kulit binatang sebagai bahan; “kulit” alami dalam daftar bahan dan tidak menentukan secara berlebihan tingkat pengolahannya.
- source_word: אֵילִם
  choice: domba jantan
  rationale: Kata ini berarti domba jantan; dalam frasa bahan, “kulit domba jantan” menyampaikan sumber kulit dengan jelas dan alami.
- source_word: מְאָדָּמִים
  choice: yang diwarnai merah
  rationale: Bentuk ini menunjukkan bahwa kulit tersebut dibuat menjadi merah, bukan sekadar berwarna merah secara alami; “diwarnai merah” mempertahankan nuansa perlakuan terhadap bahan.
- source_word: עֹרֹת תְּחָשִׁים
  choice: kulit takhas
  rationale: Arti תְּחַשׁ tidak pasti. Transliterasi mempertahankan ketidakpastian sumber tanpa secara spekulatif menentukan binatang atau mutu pengolahannya; catatan kaki menjelaskan beberapa kemungkinan.
- source_word: עֲצֵי
  choice: kayu
  rationale: Bentuk jamak terikat ini secara idiomatis dinyatakan sebagai nomina bahan tunggal “kayu” dalam bahasa Indonesia.
- source_word: שִׁטִּים
  choice: akasia
  rationale: Istilah ini lazim dan secara luas dikenali sebagai akasia; “kayu akasia” jelas bagi pembaca modern.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan ringkas yang sesuai dengan daftar bahan. Istilah “takhas” dipertahankan agar ketidakpastian leksikal dalam teks sumber tidak diselesaikan secara spekulatif; penjelasan diberikan dalam catatan kaki.
