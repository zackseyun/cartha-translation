lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Buatlah
  rationale: Bentuk perfektum Qal dengan waw dalam rangkaian petunjuk berfungsi sebagai perintah; bentuk imperatif ini alami dan mempertahankan daya direktifnya.
- source_word: בַדֵּי
  choice: kayu-kayu pengusung
  rationale: Nomina ini menunjuk pada batang-batang yang dipakai untuk mengusung tabut. Pilihan ini jelas dalam bahasa Indonesia dan sesuai dengan fungsi benda tersebut.
- source_word: עֲצֵי שִׁטִּים
  choice: dari kayu akasia
  rationale: Rangkaian konstruksi ini berarti kayu dari pohon akasia; 'kayu akasia' merupakan padanan modern yang jelas.
- source_word: וְצִפִּיתָ
  choice: lalu lapisi
  rationale: Verba ini menyatakan tindakan menutupi permukaan dengan suatu bahan. 'Lapisi' tepat untuk pekerjaan melapisi kayu dengan emas, sedangkan 'lalu' menandai urutan petunjuk secara alami.
- source_word: אֹתָם
  choice: semuanya
  rationale: Pronomina objek maskulin jamak merujuk kepada seluruh kayu pengusung; 'semuanya' mengungkapkan rujukan jamak itu secara alami dan tidak rancu.
- source_word: זָהָב
  choice: dengan emas
  rationale: Emas adalah bahan pelapis; konstruksi 'lapisi ... dengan emas' merupakan ungkapan Indonesia yang alami dan akurat.
