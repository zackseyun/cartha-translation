base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/021.yaml
  text: And you shall put the mercy seat on top of the ark[a], and into the ark you shall put the testimony that I will give you.
translation:
  language: id
  text: Letakkanlah tutup pendamaian itu di atas tabut,[a] dan ke dalam tabut itu haruslah engkau memasukkan kesaksian yang akan Kuberikan kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tutup tabut.” Istilah Ibrani ini menunjuk pada penutup tabut dan memiliki kaitan dengan pendamaian dalam ibadah Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפֹּרֶת
  choice: tutup pendamaian
  rationale: Istilah ini menunjuk pada penutup tabut sekaligus memiliki kaitan kultis dengan pendamaian. Pilihan ini jelas bagi pembaca modern dan mempertahankan kedua unsur tersebut.
- source_word: מִלְמָעְלָה
  choice: di atas
  rationale: Dalam konteks penempatan penutup terhadap tabut, frasa ini menyatakan posisi di bagian atas secara alami.
- source_word: עֵדֻת
  choice: kesaksian
  rationale: Padanan formal ini mempertahankan makna kesaksian dalam hubungan perjanjian tanpa menambahkan bahwa benda itu adalah loh-loh, yang tidak disebutkan secara eksplisit dalam ayat ini.
- source_word: נָתַתָּ / תִּתֵּן / אֶתֵּן
  choice: letakkanlah / haruslah ... memasukkan / akan Kuberikan
  rationale: 'Ragam verba Indonesia disesuaikan dengan objek dan arah tindakan: penutup diletakkan di atas tabut, kesaksian dimasukkan ke dalamnya, dan Allah akan memberikannya.'
- source_word: אֶל הָאָרֹן
  choice: ke dalam tabut
  rationale: Dengan verba נתן dan objek kesaksian, אֶל di sini menyatakan gerak masuk ke bagian dalam tabut.
theological_decisions:
- issue: Penerjemahan כַּפֹּרֶת dalam konteks ibadah dan pendamaian
  choice: tutup pendamaian
  alternative: tutup tabut; tutup belas kasihan
  rationale: Kata Ibrani ini adalah penutup tabut, tetapi juga terkait dengan ritus pendamaian. 'Tutup pendamaian' mempertahankan fungsi bendawi dan kaitan kultisnya tanpa menjadikannya istilah yang menyiratkan tafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk perintah dipertahankan, sedangkan susunan kalimat dibuat alami. Kapitalisasi pada “Kuberikan” menandai pembicara ilahi sesuai kelaziman penerbitan Alkitab Indonesia.
