  yaml_path: translation/ot/exodus/025/003.yaml
  text: 'And this is the contribution that you shall take from them: gold[a], silver, and bronze.'
translation:
  language: id
  text: 'Inilah persembahan yang harus kamu ambil dari mereka: emas, perak, dan perunggu[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tembaga”; kata Ibrani נְחֹשֶׁת dapat merujuk secara luas pada tembaga atau perunggu, bergantung pada konteks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֹאת
  choice: Inilah
  rationale: Gabungan konjungsi dan kata tunjuk memperkenalkan rincian yang menyusul. 'Inilah' menyampaikan daya presentasionalnya secara alami dalam bahasa Indonesia; konjungsi Ibrani tidak perlu selalu diterjemahkan tersendiri.
- source_word: הַ/תְּרוּמָה
  choice: persembahan
  rationale: תְּרוּמָה menunjuk pada sumbangan yang dikhususkan bagi keperluan sakral. 'Persembahan' alami dalam konteks Kemah Suci dan tetap dapat merujuk pada bahan-bahan yang disumbangkan.
- source_word: אֲשֶׁר תִּקְחוּ מֵ/אִתָּם
  choice: yang harus kamu ambil dari mereka
  rationale: Bentuk orang kedua jamak pada תִּקְחוּ memiliki daya pengarahan. Bahasa Indonesia tidak menandai jumlah pada 'kamu', tetapi konteks menunjukkan bahwa Musa dan pihak yang bertugas menjadi penerima perintah; 'ambil dari mereka' mempertahankan makna langsung verba dan preposisinya.
- source_word: זָהָב
  choice: emas
  rationale: Padanan baku untuk bahan logam ini.
- source_word: וָ/כֶסֶף
  choice: perak
  rationale: Padanan baku dalam daftar bahan logam.
- source_word: וּ/נְחֹשֶׁת
  choice: perunggu
  rationale: נְחֹשֶׁת dapat menunjuk pada tembaga atau paduan tembaga. 'Perunggu' merupakan padanan konvensional dan sesuai untuk logam olahan dalam konteks perlengkapan Kemah Suci, sementara alternatifnya dipertahankan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. 'Inilah' dipilih agar pembukaan daftar terdengar alami. Penanda catatan kaki ditempatkan sesudah 'perunggu', yaitu istilah yang memiliki alternatif leksikal.
