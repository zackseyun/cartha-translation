  yaml_path: translation/ot/exodus/025/018.yaml
  text: And you shall make two cherubim of gold; of hammered work you shall make them[a], at the two ends of the mercy seat.
translation:
  language: id
  text: Haruslah engkau membuat dua kerub dari emas. Sebagai karya tempaan, buatlah keduanya dari kedua ujung tutup pendamaian itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “penutup tabut.” Istilah Ibrani ini menunjuk pada penutup tabut; “tutup pendamaian” merupakan terjemahan tradisional dalam konteks ibadah ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Haruslah engkau membuat
  rationale: Bentuk perfektum Qal dengan waw dalam rangkaian petunjuk berfungsi sebagai perintah. Bentuk ini mempertahankan daya wajibnya dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: שְׁנַיִם כְּרֻבִים
  choice: dua kerub
  rationale: שְׁנַיִם adalah bilangan dua, sedangkan כְּרֻבִים menunjuk pada makhluk surgawi khusus. Bentuk Indonesia 'kerub' dengan bilangan sudah menyatakan jamak tanpa perlu mempertahankan akhiran jamak Ibrani.
- source_word: זָהָב
  choice: dari emas
  rationale: Menunjukkan bahan pembuat kedua kerub.
- source_word: מִקְשָׁה
  choice: dengan ditempa
  rationale: Istilah ini menggambarkan pengerjaan logam dengan cara ditempa. Ungkapan ini alami dalam bahasa Indonesia dan tidak menambahkan secara tegas gagasan 'dari satu bongkah', meskipun konteks dapat menyiratkan bahwa kerub dan tutup itu merupakan karya terpadu.
- source_word: תַּעֲשֶׂה אֹתָם
  choice: Buatlah keduanya
  rationale: Pengulangan kata kerja dalam bahasa Ibrani dipertahankan untuk menegaskan cara pembuatannya; 'keduanya' merujuk jelas kepada dua kerub.
- source_word: מִשְּׁנֵי קְצוֹת
  choice: pada kedua ujung
  rationale: Dalam konstruksi ini, מן menghubungkan kerub dengan kedua ujung tutup. 'Pada kedua ujung' menyampaikan letaknya secara alami tanpa memaksakan rincian teknis yang melampaui ayat ini.
- source_word: הַכַּפֹּרֶת
  choice: tutup pendamaian
  rationale: Kata ini menunjuk pada tutup tabut dalam konteks ibadah dan berkaitan dengan pendamaian. 'Tutup pendamaian' mempertahankan bentuk bendanya sekaligus fungsi kultisnya.
theological_decisions:
- issue: Makna הַכַּפֹּרֶת dalam konteks Kemah Suci
  choice: tutup pendamaian
  alternative: tutup tabut
  rationale: Terjemahan utama menyatakan bahwa benda itu adalah tutup sekaligus mempertahankan kaitannya dengan pendamaian. Alternatif yang lebih netral secara leksikal dicatat dalam catatan kaki agar hubungan dengan tutup tabut tetap jelas tanpa menghapus nuansa teologis istilah tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'engkau' sesuai dengan perintah langsung Allah kepada Musa. Kalimat kedua mempertahankan pengulangan kata kerja Ibrani tanpa menjadi kaku; istilah teknis 'kerub' dan 'tutup pendamaian' dipertahankan dengan penjelasan singkat dalam catatan kaki.
