  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk perintah ‘Masukkanlah’ mempertahankan daya imperatif, sedangkan ‘kayu-kayu pengusung’ menjaga kejelasan fungsi benda tersebut.
