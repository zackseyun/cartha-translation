  text: And you shall put the poles into the rings on the sides of the ark[a], to carry the ark with them.
translation:
  language: id
  text: Masukkanlah kayu-kayu pengusung itu ke dalam gelang-gelang pada sisi-sisi tabut[a] untuk mengusung tabut dengan kayu-kayu itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Bawalah kayu-kayu pengusung itu ke dalam gelang-gelang pada sisi-sisi tabut.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הֵֽבֵאתָ
  choice: Masukkanlah
  rationale: Secara harfiah verba בוא berarti ‘membawa/masuk’, tetapi dalam konstruksi ini tindakan yang dimaksud ialah menempatkan kayu pengusung ke dalam gelang. ‘Masukkanlah’ alami dan menyatakan arah gerak dengan jelas.
- source_word: הַ/בַּדִּים
  choice: kayu-kayu pengusung
  rationale: בדים menunjuk pada batang-batang untuk mengusung perabot kudus. Pilihan ini lebih jelas daripada sekadar ‘kayu-kayu’ dan lebih alami dalam bahasa Indonesia modern daripada istilah arkais.
- source_word: בַּ/טַּבָּעֹת
  choice: ke dalam gelang-gelang
  rationale: Preposisi ב dalam konteks gerak ini menunjukkan pemasukan atau penempatan ke dalam gelang.
- source_word: עַל צַלְעֹת הָ/אָרֹן
  choice: pada sisi-sisi tabut
  rationale: צלעות berarti sisi-sisi atau bagian-bagian samping; terjemahan ini alami dan cukup tepat tanpa mempersempitnya menjadi panel.
- source_word: הָ/אָרֹן
  choice: tabut
  rationale: Walaupun ארון dapat berarti peti, dalam konteks Kemah Suci ‘tabut’ merupakan istilah baku dan tepat untuk benda kudus ini.
- source_word: לָ/שֵׂאת
  choice: untuk mengusung
  rationale: נשא di sini berarti membawa secara fisik. ‘Mengusung’ secara tepat menggambarkan membawa dengan kayu-kayu pengusung.
- source_word: בָּ/הֶם
  choice: dengan kayu-kayu itu
  rationale: Pronomina tersebut merujuk kepada kayu-kayu pengusung sebagai sarana untuk membawa tabut. Pengulangan nomina menghindari ketidakjelasan rujukan dalam bahasa Indonesia.
theological_decisions: []
