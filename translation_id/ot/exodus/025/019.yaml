base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/019.yaml
  text: Make one cherub on one end and one cherub on the other end[a]; from the mercy seat you shall make the cherubim on its two ends.
translation:
  language: id
  text: Buatlah satu kerub pada ujung yang satu dan satu kerub pada ujung yang lain.[a] Dari tutup pendamaian itu, kamu harus membuat kedua kerub itu pada kedua ujungnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, lebih jelas: “Buatlah kerub-kerub itu menyatu dengan tutup pendamaian pada kedua ujungnya.” Kata Ibrani yang diterjemahkan “dari” menunjukkan bahwa kerub-kerub itu dibentuk dari tutup tersebut, bukan dibuat terpisah lalu dipasang padanya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשֵׂה
  choice: Buatlah
  rationale: Bentuk imperatif dalam rangkaian petunjuk diterjemahkan sebagai perintah langsung yang alami dan bermartabat dalam bahasa Indonesia.
- source_word: כְּרוּב ... וּכְרוּב
  choice: satu kerub ... satu kerub
  rationale: Bentuk tunggal dipertahankan untuk menyebut setiap sosok secara tersendiri; 'kerub' merupakan istilah teknis yang lazim dalam bahasa Indonesia.
- source_word: מִקָּצָה מִזֶּה ... מִקָּצָה מִזֶּה
  choice: pada ujung yang satu ... pada ujung yang lain
  rationale: Ungkapan ini secara idiomatis menunjuk lokasi yang berlawanan pada kedua ujung; susunan tersebut mempertahankan kesejajaran teks Ibrani.
- source_word: מִן הַכַּפֹּרֶת
  choice: dari tutup pendamaian itu
  rationale: 'כַּפֹּרֶת menunjuk tutup khusus pada tabut, sedangkan מִן menyatakan sumber atau bahan: kerub-kerub dibentuk dari tutup itu sendiri.'
- source_word: תַּעֲשׂוּ
  choice: haruslah kamu membuat
  rationale: Bentuk orang kedua jamak dalam konteks instruksi diterjemahkan sebagai kewajiban yang ditujukan kepada para pelaksana; bahasa Indonesia tidak menandai jumlah pada 'kamu'.
- source_word: הַכְּרֻבִים
  choice: kedua kerub tersebut
  rationale: Bentuk jamak dengan artikel merujuk kembali kepada dua kerub yang baru disebut; 'kedua' memperjelas jumlah tanpa memakai bentuk serapan plural asing.
- source_word: עַל שְׁנֵי קְצוֹתָיו
  choice: pada kedua ujungnya
  rationale: עַל menyatakan penempatan pada ujung-ujung, dan akhiran tunggal merujuk pada tutup pendamaian.
theological_decisions:
- issue: Makna כַּפֹּרֶת
  choice: tutup pendamaian
  alternative: tutup; takhta belas kasihan
  rationale: '''Tutup pendamaian'' mempertahankan bahwa benda ini adalah tutup tabut sekaligus mempertahankan kaitan leksikal dan kultis dengan pendamaian, tanpa mengubahnya menjadi istilah spasial yang tidak dinyatakan secara langsung.'
- issue: Hubungan kerub dengan tutup pendamaian
  choice: Dari tutup pendamaian itu haruslah kamu membuat kedua kerub
  alternative: buatlah kedua kerub menyatu dengan tutup pendamaian
  rationale: Terjemahan utama mempertahankan preposisi sumber מִן dan tidak mengganti bentuk teks dengan penjelasan teknis; implikasi bahwa kerub dibentuk dari bahan yang sama dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada instruksional. Istilah 'kerub' dipertahankan sebagai istilah teknis Alkitab, sedangkan 'tutup pendamaian' dipilih agar fungsi fisik dan makna kultis כַּפֹּרֶת tetap terdengar. Penanda catatan kaki [a] ditempatkan setelah penyebutan kedua ujung, tempat penjelasan konstruksi paling relevan.
