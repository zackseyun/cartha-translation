lexical_decisions:
- source_word: תְכֵלֶת
  choice: benang biru
  rationale: Istilah ini menunjuk pada bahan tekstil yang dicelup biru hingga biru keunguan. Dalam daftar bahan Kemah Suci, “benang biru” menyampaikan warna sekaligus jenis bahan yang tersirat.
- source_word: אַרְגָּמָן
  choice: ungu
  rationale: Istilah ini menunjuk pada bahan tekstil mahal berwarna ungu. Kata “benang” pada awal rangkaian secara alami juga mencakup unsur ini.
- source_word: תוֹלַעַת שָׁנִי
  choice: merah tua
  rationale: Ungkapan ini secara harfiah berkaitan dengan serangga penghasil zat pewarna merah dan secara metonimis menunjuk pada benang atau bahan yang diwarnainya. “Merah tua” merupakan padanan warna yang alami tanpa memasukkan serangganya ke dalam teks utama.
- source_word: שֵׁשׁ
  choice: linen halus
  rationale: Dalam konteks perlengkapan Kemah Suci, kata ini menunjuk pada kain linen bermutu halus.
- source_word: עִזִּים
  choice: bulu kambing
  rationale: Teks Ibrani secara harfiah berbunyi “kambing-kambing”, tetapi dalam daftar bahan ini yang dimaksud ialah bulu kambing yang dipakai untuk membuat kain penutup.
