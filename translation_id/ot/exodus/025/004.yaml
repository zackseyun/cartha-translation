translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan wajar untuk sebuah daftar bahan. “Benang” ditempatkan sekali di awal rangkaian tiga warna agar tidak terasa kaku, sedangkan pengulangan kata sambung Ibrani disesuaikan dengan pola daftar alami dalam bahasa Indonesia.
