base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/031.yaml
  text: And you shall make a lampstand of pure gold[a]. The lampstand shall be made of hammered work; its base and its shaft, its cups, its buds[b], and its flowers shall be of one piece with it.
translation:
  language: id
  text: Buatlah kaki pelita dari emas murni. Kaki pelita itu harus dibuat sebagai satu hasil tempaan[a]. Alas dan batangnya, cawan-cawannya, kuntum-kuntumnya[b], dan bunga-bunganya harus menjadi satu bagian dengannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini juga dapat diterjemahkan “hasil tempaan.” Ungkapan itu menekankan bahwa kaki pelita dibentuk dengan ditempa, tampaknya dari satu bagian logam dan bukan dirakit dari bagian-bagian terpisah.
    reason: lexical_alternative
  - marker: b
    text: “Kuntum-kuntumnya” juga dapat diterjemahkan “tonjolan-tonjolannya.” Kata Ibrani ini menunjuk pada hiasan bulat yang menonjol dalam rancangan bercorak tumbuhan pada kaki pelita.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְנֹרַת
  choice: kaki pelita
  rationale: Kata ini menunjuk pada penyangga yang memegang pelita-pelita, bukan pada pelita itu sendiri. “Kaki pelita” merupakan padanan bahasa Indonesia yang jelas dan lazim.
- source_word: זָהָב טָהוֹר
  choice: emas murni
  rationale: Padanan alami untuk emas yang dimurnikan dan tidak bercampur bahan lain.
- source_word: מִקְשָׁה
  choice: dibuat dengan cara ditempa
  rationale: Menunjukkan pengerjaan logam dengan penempaan, tampaknya dibentuk dari satu massa logam dan bukan dirakit dari bagian-bagian terpisah.
- source_word: תֵּעָשֶׂה
  choice: harus dibuat
  rationale: Bentuk ini, dalam konteks petunjuk pembuatan, menyatakan kewajiban atau perintah.
- source_word: יְרֵכָהּ
  choice: alasnya
  rationale: Secara harfiah dapat berarti “paha” atau “sisi”, tetapi untuk benda ini menunjuk pada bagian bawah yang menopang.
- source_word: וְקָנָהּ
  choice: batangnya
  rationale: Bentuk tunggal ini menunjuk pada batang utama kaki pelita, sebelum cabang-cabang samping dijelaskan dalam ayat berikutnya.
- source_word: גְּבִיעֶיהָ
  choice: kelopak-kelopaknya
  rationale: Istilah ini menunjuk pada unsur hias berbentuk cawan. Dalam rancangan bercorak tumbuhan, “kelopak” menyampaikan bentuk tersebut secara alami, meski arti dasarnya adalah cawan.
- source_word: כַּפְתֹּרֶיהָ
  choice: kuntum-kuntumnya
  rationale: Menunjuk pada tonjolan hias yang bulat. “Kuntum” sesuai dengan keseluruhan corak tumbuhan, sambil mempertahankan kemungkinan bentuk seperti tombol melalui catatan kaki.
- source_word: וּפְרָחֶיהָ
  choice: bunga-bunganya
  rationale: Secara langsung menyatakan hiasan berbentuk bunga.
- source_word: מִמֶּנָּה יִהְיוּ
  choice: harus menyatu dengannya
  rationale: Ungkapan ini menunjukkan bahwa semua bagian tersebut berasal dari tubuh kaki pelita itu sendiri, bukan dipasang sebagai komponen terpisah.
