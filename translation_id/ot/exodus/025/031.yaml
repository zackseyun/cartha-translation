  register: Bahasa Indonesia baku modern dengan nada instruksional yang lugas dan bermartabat. Istilah konkret dipilih agar mudah dipahami pembaca umum, sementara rincian teknis dan ambiguitas bentuk hias dijelaskan dalam catatan kaki.
