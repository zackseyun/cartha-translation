  to: Buatlah kaki pelita dari emas murni. Kaki pelita itu harus dibuat sebagai satu hasil tempaan[a]. Alas dan batangnya, cawan-cawannya, kuntum-kuntumnya[b], dan bunga-bunganya harus menjadi satu bagian dengannya.
  rationale: Revisi mengganti istilah yang terlalu mengarah pada bagian bunga (“kelopak”) dengan arti bentuk yang lebih langsung (“cawan”), serta menyatakan secara tegas kesatuan konstruksi yang ditunjukkan oleh frasa Ibrani penutup. “Satu hasil tempaan” mempertahankan cara pembuatan dan, bersama kalimat terakhir, menyampaikan bahwa bagian-bagian itu bukan komponen terpisah.
