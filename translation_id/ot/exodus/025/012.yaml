base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/012.yaml
  text: 'And you shall cast four rings of gold for it and put them on its four feet: two rings on one side of it and two rings on its second side[a].'
translation:
  language: id
  text: Corlah empat gelang emas untuk tabut itu, lalu pasanglah gelang-gelang itu pada keempat kakinya:[a] dua gelang pada sisinya yang satu dan dua gelang pada sisinya yang kedua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keempat sudutnya” untuk “keempat kakinya”. Istilah Ibraninya sulit dipastikan, tetapi kemungkinan menunjuk pada kaki atau penopang bawah tabut, bukan sekadar titik-titik sudut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצַקְתָּ
  choice: Corlah
  rationale: Dalam konteks pembuatan perlengkapan emas, verba יצק menunjuk pada pengecoran logam, bukan sekadar menuangkan cairan.
- source_word: טַבְּעֹת
  choice: gelang
  rationale: Nomina ini menunjuk pada gelang logam tempat kayu pengusung dimasukkan; 'gelang' jelas dan lazim dalam konteks ini.
- source_word: זָהָב
  choice: emas
  rationale: Sebutan bahan yang langsung dan tidak ambigu.
- source_word: וְנָתַתָּה
  choice: lalu pasanglah
  rationale: נתן bermakna luas, tetapi dalam petunjuk konstruksi ini pemasangan gelang pada tabut merupakan maksud yang paling alami.
- source_word: פַּעֲמֹתָיו
  choice: keempat kakinya
  rationale: Istilah ini sulit, tetapi kemungkinan menunjuk pada kaki atau penopang bawah tabut. Pilihan ini mempertahankan gambaran konkret teks sambil mencatat alternatif dalam catatan kaki.
- source_word: צַלְעוֹ
  choice: sisinya
  rationale: Dalam konteks benda atau bangunan, צלע lazim berarti sisi.
- source_word: הָאֶחָת ... הַשֵּׁנִית
  choice: yang satu ... yang kedua
  rationale: Pilihan ini mempertahankan urutan eksplisit dalam bahasa Ibrani, meski 'yang lain' juga mungkin lebih idiomatis.
theological_decisions: []
