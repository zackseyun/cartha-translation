  naturalness: Bahasa draf sudah baku dan mudah dipahami. Susunan “Hendaklah kamu mengambil persembahan-Ku dari setiap orang ...” lebih alami dalam bahasa Indonesia sambil tetap mempertahankan bahwa pihak yang menerima persembahan itu adalah “kamu” (jamak).
