source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/יִקְחוּ לִ֖/י תְּרוּמָ֑ה מֵ/אֵ֤ת כָּל אִישׁ֙ אֲשֶׁ֣ר יִדְּבֶ֣/נּוּ לִבּ֔/וֹ תִּקְח֖וּ אֶת תְּרוּמָתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/002.yaml
  text: Speak to the sons of Israel[a], that they take an offering for me. From every man whose heart moves him[c][b], you shall take my offering.
translation:
  language: id
  text: Katakanlah kepada umat Israel[a] agar mereka mengambil persembahan bagi-Ku. Hendaklah kamu mengambil persembahan-Ku dari setiap orang yang hatinya mendorongnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak lelaki Israel”; ungkapan Ibrani ini merupakan sebutan umum bagi bangsa Israel.
    reason: cultural_note
  - marker: b
    text: Dapat juga diterjemahkan, “yang hatinya menggerakkannya” atau “yang hatinya terdorong.” Ungkapan Ibrani ini menekankan kesediaan batin yang sukarela.
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר אֶל
  choice: Katakanlah kepada
  rationale: Imperatif Piel דַּבֵּר memerintahkan Musa menyampaikan firman; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya perintahnya.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: umat Israel
  rationale: Secara harfiah berarti 'anak-anak lelaki Israel', tetapi merupakan sebutan perjanjian yang lazim bagi bangsa Israel secara keseluruhan. 'Umat Israel' menyampaikan acuannya secara wajar tanpa memberi kesan bahwa hanya laki-laki yang dimaksud.
- source_word: וְיִקְחוּ לִי
  choice: agar mereka mengambil ... bagi-Ku
  rationale: Bentuk verba sesudah imperatif menyatakan arahan atau hasil yang dikehendaki. 'Agar' mempertahankan hubungan sintaksis tersebut, sedangkan 'mengambil' menjaga kaitan leksikal dengan תִּקְחוּ pada klausa berikutnya.
- source_word: תְּרוּמָה
  choice: persembahan
  rationale: Istilah ini menunjuk pada sumbangan yang dikhususkan bagi penggunaan kudus. 'Persembahan' mempertahankan orientasinya kepada Allah tanpa mempersempitnya menjadi korban ritual.
- source_word: מֵאֵת כָּל אִישׁ
  choice: dari setiap orang
  rationale: Frasa ini bersifat distributif. Dalam konteks pengumpulan dari umat, 'setiap orang' merupakan padanan Indonesia yang alami bagi אִישׁ tanpa menyatakan pembatasan yang tidak ditegaskan oleh konteks.
- source_word: אֲשֶׁר יִדְּבֶנּוּ לִבּוֹ
  choice: yang hatinya terdorong untuk memberi
  rationale: Idiom Ibrani menggambarkan dorongan batin yang sukarela. Tambahan 'untuk memberi' menjelaskan arah dorongan itu dari konteks tanpa menambahkan kewajiban.
- source_word: תִּקְחוּ אֶת תְּרוּמָתִי
  choice: haruslah kamu sekalian mengambil persembahan bagi-Ku
  rationale: Bentuk orang kedua jamak dipertahankan secara eksplisit dengan 'kamu sekalian'. 'Haruslah' menyampaikan daya instruktif imperfek dalam konteks ini, dan 'mengambil' mempertahankan pengulangan akar לקח.
theological_decisions:
- issue: Makna תְּרוּמָה dalam konteks pembangunan Kemah Suci
  choice: persembahan
  alternative: sumbangan
  rationale: '''Persembahan'' menyatakan bahwa pemberian ini diperuntukkan bagi Allah dan penggunaan kudus, tetapi tidak mengidentifikasikannya secara keliru sebagai korban sembelihan. ''Sumbangan'' tetap mungkin dan dicatat sebagai alternatif.'
- issue: Sifat sukarela dalam אֲשֶׁר יִדְּבֶנּוּ לִבּוֹ
  choice: yang hatinya terdorong untuk memberi
  alternative: yang hatinya menggerakkannya
  rationale: Pilihan ini mempertahankan sumber batiniah dari tindakan tersebut dan sifat kesediaannya, tanpa mengubah perintah pengumpulan menjadi kewajiban memberi bagi setiap orang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan ilahi ditulis 'bagi-Ku'. Bentuk jamak 'kamu sekalian' digunakan untuk memperjelas bahwa תִּקְחוּ berjumlah jamak. Penanda catatan kaki ditempatkan langsung sesudah unsur yang dijelaskan.
