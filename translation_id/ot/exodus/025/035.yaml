  text: and a knob under two branches from it, and a knob under two branches from it, and a knob under two branches from it, for the six branches going out from the lampstand.
translation:
  language: id
  text: Satu tombol di bawah dua cabang yang keluar darinya, satu tombol di bawah dua cabang yang keluar darinya, dan satu tombol di bawah dua cabang yang keluar darinya, untuk keenam cabang yang keluar dari kandil itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַפְתֹּר
  choice: tombol
  rationale: Istilah ini menunjuk pada hiasan menonjol berbentuk bulat pada kandil; 'tombol' alami dalam bahasa Indonesia dan membedakannya dari bunga serta kelopak yang disebut dalam konteks.
- source_word: קָנִים
  choice: cabang
  rationale: Dalam konteks kandil, kata ini menunjuk pada lengan-lengan yang memancar dari batang utama; 'cabang' jelas dan lazim bagi pembaca modern.
- source_word: מְנֹרָה
  choice: kandil
  rationale: Menunjuk pada perangkat penerangan bercabang di Kemah Suci, bukan hanya lampu tunggal; 'kandil' mempertahankan nuansa benda ibadah kuno.
- source_word: שְׁנֵי
  choice: pasangan
  rationale: Secara harfiah berarti 'dua'; dalam struktur ayat, masing-masing tombol terletak di bawah dua cabang yang membentuk satu pasangan. Pilihan ini memperjelas susunan tanpa mengubah jumlah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bermartabat. Pengulangan sumber dipertahankan, sementara 'pertama', 'kedua', dan 'ketiga' ditambahkan secara distributif untuk memperjelas bahwa tiga tombol masing-masing berada di bawah satu pasangan dari keenam cabang.
