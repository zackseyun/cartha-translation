base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/023.yaml
  text: You shall make a table of acacia wood[a], two cubits its length, one cubit its width, and a cubit and a half its height.
translation:
  language: id
  text: Buatlah sebuah meja dari kayu akasia, panjangnya dua hasta, lebarnya satu hasta, dan tingginya satu setengah hasta.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Buatlah
  rationale: Bentuk Qal dengan waw dalam rangkaian petunjuk berfungsi sebagai perintah. Bentuk ini menyampaikan daya direktif secara alami dalam bahasa Indonesia; hubungan dengan perintah sebelumnya tetap tersirat oleh konteks.
- source_word: שֻׁלְחָן
  choice: sebuah meja
  rationale: Padanan baku dan wajar untuk perabot ibadah yang baru diperkenalkan dalam petunjuk ini.
- source_word: עֲצֵי שִׁטִּים
  choice: dari kayu akasia
  rationale: Rangkaian konstruksi ini secara idiomatis menunjuk bahan, yaitu kayu akasia.
- source_word: אַמָּתַיִם אָרְכּוֹ
  choice: panjangnya dua hasta
  rationale: Mempertahankan satuan budaya sumber dan menyajikan rumus ukuran secara alami dalam bahasa Indonesia.
- source_word: וְאַמָּה רָחְבּוֹ
  choice: lebarnya satu hasta
  rationale: Menyatakan ukuran lebar secara eksplisit dan sejajar dengan panjang serta tinggi.
- source_word: וְאַמָּה וָחֵצִי קֹמָתוֹ
  choice: dan tingginya satu setengah hasta
  rationale: Menyampaikan ukuran secara jelas dan idiomatis sambil mempertahankan satuan hasta.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bermartabat. Susunan ukuran dibuat sejajar agar mudah dipahami. Tidak diperlukan catatan kaki karena alternatif ‘Dan buatlah’ hanya menyangkut hubungan wacana dan tidak menimbulkan ambiguitas penting dalam ayat ini.
