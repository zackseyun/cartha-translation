  yaml_path: translation/ot/exodus/025/025.yaml
  text: You shall make for it a surrounding frame a handbreadth wide[a], and you shall make a gold molding around its frame.
translation:
  language: id
  text: Buatlah bingkai selebar satu telapak tangan di sekelilingnya, dan buatlah lis emas[a] mengelilingi bingkai itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mahkota emas”. Kata Ibrani זֵר dapat menunjuk pada tepian hias atau lis; “mahkota” adalah terjemahan tradisional.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְגֶּרֶת
  choice: bingkai
  rationale: Kata ini menunjuk pada bagian pembatas atau kerangka yang terpasang pada meja. “Bingkai” alami dalam bahasa Indonesia dan tidak memperinci bentuknya melampaui teks Ibrani.
- source_word: טֹפַח
  choice: selebar satu telapak tangan
  rationale: Nomina ini menyatakan ukuran satu telapak tangan. Penambahan “selebar” memperjelas bahwa ukuran tersebut menerangkan lebar bingkai.
- source_word: סָבִיב
  choice: di sekelilingnya / mengelilingi
  rationale: Kata ini muncul dua kali dan menyatakan penempatan yang mengitari meja serta bingkainya. Variasi bentuk dipakai agar kalimat alami sambil mempertahankan pengulangan gagasannya.
- source_word: זֵר
  choice: lis
  rationale: Dalam konteks perabot Kemah Suci, kata ini menunjuk pada tepian hias atau molding. “Lis” menyampaikan fungsi hias dan bentuk tepian secara wajar; terjemahan tradisional “mahkota” dipertahankan dalam catatan kaki karena bentuk tepatnya tidak sepenuhnya pasti.
- source_word: זָהָב
  choice: emas
  rationale: Nomina bahan diterjemahkan langsung sebagai “emas” untuk menerangkan lis.
- source_word: לּוֹ / לְמִסְגַּרְתּוֹ
  choice: -nya / bingkai itu
  rationale: Akhiran pronominal merujuk kembali kepada meja dalam konteks. “Di sekelilingnya” mempertahankan rujukan pronominal, sedangkan “bingkai itu” menghindari rangkaian akhiran yang berpotensi kabur.
- source_word: וְעָשִׂיתָ
  choice: Buatlah / dan buatlah
  rationale: Bentuk verba menyampaikan perintah kepada orang kedua tunggal dalam rangkaian petunjuk. Bentuk imperatif Indonesia mempertahankan daya perintah secara alami dan bermartabat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada instruksional yang lugas dan bermartabat. Susunan kalimat mempertahankan dua perintah paralel serta dua gagasan mengelilingi dalam teks Ibrani. Penanda catatan kaki ditempatkan sesudah “lis emas”, yaitu pada istilah yang memiliki alternatif leksikal.
