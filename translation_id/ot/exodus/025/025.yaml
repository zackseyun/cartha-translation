  text: וְ/עָשִׂ֨יתָ לּ֥/וֹ מִסְגֶּ֛רֶת טֹ֖פַח סָבִ֑יב וְ/עָשִׂ֧יתָ זֵר זָהָ֛ב לְ/מִסְגַּרְתּ֖/וֹ סָבִֽיב־׃
base_translation:
