  yaml_path: translation/ot/exodus/025/028.yaml
  text: You shall make the poles of acacia wood and overlay them with gold[a], and by them the table shall be carried.
translation:
  language: id
  text: Buatlah galah-galah itu dari kayu akasia dan lapisilah galah-galah itu dengan emas. Dengan galah-galah itu meja tersebut harus diangkut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Buatlah
  rationale: Bentuk perfek Qal dengan waw dalam rangkaian petunjuk berfungsi sebagai perintah. Bentuk imperatif Indonesia ini alami dan mempertahankan daya instruksinya.
- source_word: הַבַּדִּים
  choice: galah-galah itu
  rationale: Dalam konteks perabot Kemah Suci, istilah ini menunjuk pada batang panjang untuk mengangkut perabot. 'Galah' jelas dan lazim dalam bahasa Indonesia modern.
- source_word: עֲצֵי שִׁטִּים
  choice: dari kayu akasia
  rationale: Ungkapan konstruksi Ibrani secara idiomatis merujuk pada bahan kayu akasia.
- source_word: וְצִפִּיתָ אֹתָם זָהָב
  choice: dan lapisilah semuanya dengan emas
  rationale: Kata kerja צפה dalam konteks pengerjaan benda berarti melapisi dengan suatu bahan. 'Semuanya' memperjelas bahwa pronomina jamak mengacu pada seluruh galah tanpa menambah gagasan baru.
- source_word: וְנִשָּׂא בָם
  choice: Dengan galah-galah itu ... harus diangkut
  rationale: Bentuk נִשָּׂא menyatakan bahwa meja menjadi sasaran tindakan mengangkut, sedangkan בָם menandai sarana. Susunan ini alami dalam bahasa Indonesia dan mempertahankan penekanan pada fungsi galah.
- source_word: הַשֻּׁלְחָן
  choice: meja tersebut
  rationale: Kata ini menunjuk pada meja yang baru saja diuraikan dalam konteks. 'Tersebut' menandai rujukan khusus itu tanpa memasukkan keterangan tafsiriah.
