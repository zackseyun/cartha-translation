  yaml_path: translation/ot/exodus/025/040.yaml
  text: And see that you make them according to their pattern[a], which was shown to you on the mountain.
translation:
  language: id
  text: Perhatikanlah dan buatlah semuanya menurut pola[a] yang diperlihatkan kepadamu di atas gunung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Lihatlah, dan buatlah semuanya sesuai dengan pola yang diperlihatkan kepadamu di atas gunung.”'
    reason: Alternatif ini lebih dekat mempertahankan koordinasi harfiah kedua imperatif Ibrani serta memakai 'sesuai dengan' untuk בְּתַבְנִיתָם.
lexical_decisions:
- source_word: וּרְאֵה
  choice: Perhatikanlah
  rationale: Imperatif ראה di sini berfungsi sebagai peringatan agar Musa memberi perhatian sungguh-sungguh; bentuk ini lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'dan lihatlah'.
- source_word: וַעֲשֵׂה
  choice: dan buatlah semuanya
  rationale: עשה berarti 'membuat' dalam konteks pembuatan perlengkapan kemah suci. 'Semuanya' menyatakan objek jamak yang tersirat dalam akhiran jamak pada בְּתַבְנִיתָם dan konteks sebelumnya.
- source_word: בְּתַבְנִיתָם
  choice: menurut pola
  rationale: תבנית dapat berarti pola, model, atau bentuk. 'Menurut pola' secara alami menyatakan kesesuaian dengan model yang ditunjukkan; rujukan jamaknya diungkapkan melalui 'semuanya' tanpa memaksakan frasa Indonesia yang kaku.
- source_word: אֲשֶׁר
  choice: yang
  rationale: Partikel relatif ini memperkenalkan klausa yang menerangkan pola.
- source_word: אַתָּה מָרְאֶה
  choice: diperlihatkan kepadamu
  rationale: מָרְאֶה paling tepat dipahami sebagai partisip Hophal dari ראה, yaitu 'diperlihatkan'. Pronomina eksplisit אַתָּה tercakup dalam 'kepadamu'.
- source_word: בָּהָר
  choice: di atas gunung
  rationale: Ungkapan ini menunjukkan lokasi Musa di gunung; 'di atas gunung' merupakan padanan Indonesia yang alami dalam konteks tersebut.
theological_decisions:
- issue: Hakikat model yang dinyatakan bagi perlengkapan kemah suci
  choice: pola
  alternative: model; bentuk; rancangan
  rationale: '''Pola'' mempertahankan keluasan makna תבנית tanpa menetapkan bahwa yang diperlihatkan merupakan arketipe surgawi, salinan, atau sekadar gambar teknis.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Perhatikanlah' menyampaikan fungsi idiomatis imperatif pembuka, sedangkan 'buatlah' mempertahankan perintah langsung. Klausa partisip Ibrani diterjemahkan tanpa penanda waktu eksplisit agar bahasa Indonesia tetap alami dan ambiguitas aspeknya terpelihara.
