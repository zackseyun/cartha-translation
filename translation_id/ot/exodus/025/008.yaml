  yaml_path: translation/ot/exodus/025/008.yaml
  text: And let them make a sanctuary for me[a], so that I may dwell among them.
translation:
  language: id
  text: Hendaklah mereka membuat tempat kudus bagi-Ku, dan Aku akan tinggal di tengah-tengah mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשׂוּ
  choice: Hendaklah mereka membuat
  rationale: Bentuk ini dalam konteks petunjuk menyampaikan perintah kepada orang ketiga jamak. “Hendaklah mereka membuat” mempertahankan pelaku jamak dan bernuansa instruktif secara wajar dalam bahasa Indonesia.
- source_word: לִי
  choice: bagi-Ku
  rationale: Preposisi ל dengan sufiks orang pertama tunggal menyatakan tujuan atau peruntukan; “bagi-Ku” alami dan tepat dalam konteks tempat kudus yang dibuat untuk hadirat Allah.
- source_word: מִקְדָּשׁ
  choice: tempat kudus
  rationale: Kata ini menunjuk pada tempat yang dikhususkan sebagai kudus bagi hadirat ilahi. “Tempat kudus” jelas, alami, dan tidak terlalu bergantung pada istilah gerejawi tertentu.
- source_word: וְשָׁכַנְתִּי
  choice: supaya Aku tinggal
  rationale: Kata kerja שׁכן berarti tinggal atau menetap. Dalam konteks ini, klausa tersebut secara wajar menyatakan tujuan atau hasil dari pembangunan tempat kudus, tanpa meniadakan nuansa janji yang mungkin terkandung dalam bentuknya.
- source_word: בְּתוֹכָם
  choice: di tengah-tengah mereka
  rationale: Ungkapan ini secara dekat mencerminkan arti harfiah Ibrani dan mempertahankan sufiks jamak, sehingga hadirat Allah berhubungan dengan umat, bukan hanya dengan bangunan.
theological_decisions:
- issue: Tempat berdiamnya Allah
  choice: di tengah-tengah mereka
  alternative: di dalamnya
  rationale: Teks Ibrani memakai sufiks jamak “mereka”, bukan sufiks tunggal yang merujuk kepada tempat kudus. Karena itu, terjemahan mempertahankan penekanan bahwa Allah tinggal di tengah umat-Nya, sementara tempat kudus menjadi sarana kehadiran tersebut.
- issue: Hubungan antara pembuatan tempat kudus dan berdiamnya Allah
  choice: supaya Aku tinggal
  alternative: dan Aku akan tinggal
  rationale: Konteks mendukung hubungan tujuan atau hasil, tetapi bentuk Ibrani juga dapat dibaca sebagai pernyataan tindakan mendatang. “Supaya” menyampaikan kaitan kontekstual secara alami tanpa mengubah subjek atau objek kehadiran ilahi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Hendaklah” dipakai untuk perintah orang ketiga; kapitalisasi pronomina ilahi mengikuti konvensi umum penerbitan Alkitab bahasa Indonesia. Tidak diperlukan catatan kaki karena “di tengah-tengah mereka” sudah mempertahankan bentuk dan penekanan teks Ibrani secara langsung.
