  text: Exactly according to all that I am showing you—the pattern of the tabernacle and the pattern of all its furnishings—so you shall make it[a][b].
translation:
  language: id
  text: Sesuai dengan segala sesuatu yang sedang Aku tunjukkan kepadamu—pola[a] Kemah Suci dan pola segala perlengkapannya—demikianlah harus kalian buat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rancangan”, “model”, atau “desain” untuk kata Ibrani תַּבְנִית.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “kalian harus buat” berbentuk jamak, sedangkan “kepadamu” dalam bagian sebelumnya berbentuk tunggal.
    reason: source_form
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר
  choice: Sesuai dengan segala sesuatu yang
  rationale: Ungkapan ini menyatakan kesesuaian yang menyeluruh dan cermat. Bentuk ini alami dalam bahasa Indonesia tanpa menambahkan penegasan yang tidak dinyatakan secara leksikal.
- source_word: מַרְאֶה
  choice: sedang Aku tunjukkan
  rationale: 'Partisipel hiphil dari ראה memiliki daya kini atau berlangsung: Allah sedang memperlihatkan atau menunjukkan pola itu kepada Musa.'
- source_word: תַּבְנִית
  choice: pola
  rationale: Kata ini dapat menunjuk bentuk, pola, rancangan, atau model. “Pola” mempertahankan keluasan maknanya tanpa memastikan apakah yang diperlihatkan berupa gambar rencana, model fisik, atau prototipe surgawi.
- source_word: הַמִּשְׁכָּן
  choice: Kemah Suci
  rationale: Dalam konteks Keluaran, מִשְׁכָּן adalah tempat kediaman kudus berbentuk kemah. “Kemah Suci” merupakan padanan Indonesia yang jelas dan lazim.
- source_word: כָּל כֵּלָיו
  choice: segala perlengkapannya
  rationale: כֵּלִים mencakup berbagai benda, perkakas, dan perabot untuk pelayanan tempat kudus; “perlengkapan” cukup luas dan tidak membatasinya hanya pada bejana.
- source_word: וְכֵן
  choice: demikianlah
  rationale: Kata ini menandai cara yang harus sesuai dengan pola yang baru disebutkan.
- source_word: תַּעֲשׂוּ
  choice: kalian harus membuatnya
  rationale: Bentuk verba adalah orang kedua jamak. “Kalian” mempertahankan peralihan dari Musa sebagai penerima penglihatan tunggal kepada kelompok yang bertanggung jawab membuatnya; “-nya” merujuk pada Kemah Suci beserta perlengkapannya.
theological_decisions:
- issue: Apakah תַּבְנִית secara eksplisit harus dipahami sebagai prototipe surgawi
  choice: pola
  alternative: rancangan, model, atau desain
  rationale: Ayat ini menyatakan bahwa Allah menunjukkan suatu תַּבְנִית, tetapi tidak menjelaskan hakikat ontologisnya. “Pola” membiarkan kemungkinan prototipe yang diwahyukan tetap terbuka tanpa memasukkan kesimpulan teologis yang lebih tegas daripada teks.
- issue: Peralihan dari penerima tunggal kepada pelaksana jamak
  choice: “kepadamu” untuk Musa dan “kalian” untuk para pembuat
  alternative: Memakai “kamu” pada kedua bagian atau menghilangkan pembedaan jumlah
  rationale: אוֹתְךָ berbentuk tunggal, sedangkan תַּעֲשׂוּ berbentuk jamak. Pembedaan ini dipertahankan karena dapat menunjukkan bahwa Musa menerima pola tersebut, sedangkan pekerjaan dilaksanakan secara bersama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda pisah mempertahankan aposisi dalam bahasa Ibrani. “Aku” mengikuti suara langsung Allah; “kepadamu” dan “kalian” sengaja membedakan bentuk tunggal dan jamak pada teks sumber.
