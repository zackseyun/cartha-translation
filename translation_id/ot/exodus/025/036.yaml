  text: Kuncup-kuncup dan cabang-cabangnya harus dibuat menyatu dengan kaki pelita itu[a]; seluruhnya harus berupa satu hasil tempaan[b] dari emas murni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “harus berasal darinya”; maksudnya, kuncup-kuncup dan cabang-cabang itu dibentuk sebagai bagian utuh dari kaki pelita, bukan dipasang secara terpisah.
    reason: lexical_alternative
  - marker: b
    text: Atau “satu karya yang dipukul hingga terbentuk.” Kata Ibrani menekankan bahwa seluruh kaki pelita dibuat dengan ditempa sebagai satu kesatuan dari emas murni.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפְתֹּרֵיהֶם
  choice: kuncup-kuncupnya
  rationale: Dalam gambaran kaki pelita yang bercorak tumbuhan, istilah ini menunjuk pada hiasan bulat menyerupai kuncup; pilihan ini lebih jelas daripada 'tombol' dan tidak memberi kesan arsitektural seperti 'kepala tiang'.
- source_word: וּקְנֹתָם
  choice: dan cabang-cabangnya
  rationale: Walaupun קָנֶה pada dasarnya dapat berarti buluh atau batang, dalam konteks kaki pelita istilah ini menunjuk pada lengan-lengan yang mencuat; 'cabang' mempertahankan citra tumbuhan dan wajar dalam bahasa Indonesia.
- source_word: מִמֶּנָּה יִהְיוּ
  choice: harus menyatu dengannya
  rationale: Ungkapan Ibrani secara harfiah berarti 'harus berasal darinya' dan menandakan bahwa bagian-bagian itu dibentuk secara integral dari kaki pelita, bukan dipasang secara terpisah. Catatan kaki mempertahankan bentuk yang lebih harfiah.
- source_word: כֻּלָּהּ
  choice: seluruhnya
  rationale: Kata ini menekankan keseluruhan kaki pelita sebagai satu benda yang utuh.
- source_word: מִקְשָׁה אַחַת
  choice: satu karya tempaan
  rationale: מִקְשָׁה menunjuk pada benda yang dibentuk dengan ditempa, sedangkan אַחַת menekankan kesatuan pengerjaannya. Ungkapan ini alami sekaligus mempertahankan makna proses dan keutuhan bahan.
- source_word: זָהָב טָהוֹר
  choice: emas murni
  rationale: Padanan baku dan alami untuk ungkapan Ibrani yang menyatakan mutu atau kemurnian emas.
