base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/030.yaml
  text: And you shall set the bread of the Presence on the table before me continually[a].
translation:
  language: id
  text: Letakkanlah roti hadirat di atas meja itu di hadapan-Ku senantiasa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara tradisional disebut “roti sajian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/נָתַתָּ
  choice: Taruhlah
  rationale: Bentuk perintah ini secara alami diterjemahkan “Taruhlah” dalam bahasa Indonesia; נתן di sini berarti menaruh atau menempatkan benda pada tempat yang ditentukan.
- source_word: עַל הַ/שֻּׁלְחָן
  choice: di atas meja itu
  rationale: Frasa ini menyatakan posisi roti pada meja tertentu yang telah dijelaskan dalam petunjuk sebelumnya.
- source_word: לֶחֶם פָּנִים
  choice: roti sajian
  rationale: Istilah Indonesia yang ringkas dan cukup dikenal untuk roti kultis yang disajikan di hadapan Allah; catatan kaki mempertahankan arti harfiahnya, “roti hadirat.”
- source_word: לְ/פָנַ/י
  choice: di hadapan-Ku
  rationale: Secara harfiah berarti “di depan wajah-Ku”; “di hadapan-Ku” alami, khidmat, dan mempertahankan ujaran langsung Allah.
- source_word: תָּמִיד
  choice: senantiasa
  rationale: Dalam konteks ibadah, kata ini menunjukkan keberadaan atau pelaksanaan yang terus-menerus dan teratur.
theological_decisions:
- issue: Makna istilah kultis לֶחֶם פָּנִים
  choice: roti sajian
  alternative: roti hadirat; roti yang disajikan di hadapan-Ku
  rationale: “Roti sajian” dapat dipahami sebagai nama benda kultis tanpa menghapus kaitannya dengan hadirat Allah, yang dijelaskan melalui catatan kaki dan frasa berikutnya. Pilihan ini juga menghindari pengulangan kaku “roti hadirat di hadapan-Ku.”
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. Kapital pada “-Ku” menandai rujukan kepada Allah menurut kebiasaan ejaan terbitan Alkitab Indonesia.
