  text: 'And six branches shall come out from its sides: three branches of the lampstand from its one side[a], and three branches of the lampstand from its other side.'
translation:
  language: id
  text: 'Enam cabang harus menjulur dari sisi-sisinya: tiga cabang kaki pelita dari sisinya yang satu dan tiga cabang kaki pelita dari sisinya yang lain.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָנִים / קְנֵי
  choice: cabang
  rationale: Dalam konteks perlengkapan Kemah Suci, kata ini menunjuk pada bagian-bagian yang memanjang dari batang utama kaki pelita. “Cabang” mempertahankan gambaran bentuknya dan mudah dipahami.
- source_word: יֹצְאִים
  choice: harus menjulur
  rationale: Partisip ini menggambarkan cabang-cabang yang keluar atau memanjang dari kedua sisi. “Harus” menyampaikan daya instruksional konteks, sedangkan “menjulur” menggambarkan bentuk fisiknya secara alami.
- source_word: מִצִּדֶּיהָ
  choice: dari sisi-sisinya
  rationale: Bentuk jamak dengan akhiran feminin tunggal merujuk pada kedua sisi kaki pelita.
- source_word: מְנֹרָה
  choice: kaki pelita
  rationale: Istilah ini menunjuk pada penyangga bercabang yang memegang pelita-pelita, bukan hanya sebuah pelita. “Kaki pelita” merupakan padanan Indonesia yang jelas dan mapan.
- source_word: הָאֶחָד ... הַשֵּׁנִי
  choice: yang satu ... yang lain
  rationale: Pasangan ungkapan ini secara alami menyatakan kontras antara satu sisi dan sisi lainnya; padanan ini mempertahankan simetri tanpa memberi kesan adanya lebih dari dua sisi yang dimaksud.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bermartabat. Struktur paralel Ibrani dipertahankan, sementara “menjulur” dipakai agar gambaran fisik cabang-cabang yang memanjang dari kedua sisi terdengar alami.
