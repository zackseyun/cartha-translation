  text: כִּכָּ֛ר זָהָ֥ב טָה֖וֹר יַעֲשֶׂ֣ה אֹתָ֑/הּ אֵ֥ת כָּל הַ/כֵּלִ֖ים הָ/אֵֽלֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/039.yaml
  text: He shall make it[a], with all these utensils, from a talent of pure gold.
translation:
  language: id
  text: Ia harus membuatnya, beserta segala perlengkapan[a] ini, dari satu talenta emas murni.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perkakas” atau “wadah”. Istilah Ibraninya dapat mencakup berbagai benda yang digunakan bersama kandil.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּכָּר
  choice: satu talenta
  rationale: כִּכָּר adalah satuan berat baku. Istilah metrologis tradisional “talenta” dipertahankan agar lebih tepat daripada ungkapan umum tentang sejumlah emas.
- source_word: זָהָב טָהוֹר
  choice: emas murni
  rationale: Ungkapan ini menunjuk pada emas yang murni sebagai bahan pembuatan; “emas murni” merupakan padanan Indonesia yang alami dan tepat.
- source_word: יַעֲשֶׂה
  choice: Ia harus membuat
  rationale: Bentuk Qal imperfek orang ketiga tunggal maskulin menyatakan ketentuan dalam konteks petunjuk. “Ia harus membuat” mempertahankan bentuk aktif dan subjek tersirat tanpa mengubahnya menjadi pasif.
- source_word: אֹתָהּ
  choice: -nya
  rationale: Pronomina objek feminin tunggal merujuk kembali kepada kandil dalam konteks sebelumnya. Bentuk “-nya” mempertahankan rujukan pronominal tanpa menambahkan nomina secara eksplisit.
- source_word: אֵת כָּל הַכֵּלִים הָאֵלֶּה
  choice: beserta segala perlengkapan ini
  rationale: כֵּלִים adalah istilah luas untuk berbagai perkakas, barang, atau wadah. “Perlengkapan” terdengar alami dalam konteks benda-benda yang menyertai kandil dan tetap cukup luas.
