  yaml_path: translation/ot/exodus/025/026.yaml
  text: And you shall make for it four gold rings[b][a], and you shall put the rings on the four corners that are at its four feet.
translation:
  language: id
  text: Buatlah untuk meja itu empat gelang emas, lalu pasanglah gelang-gelang itu pada keempat sudut[a] yang ada pada keempat kakinya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keempat sisi” atau “keempat tepi”.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “kaki” dapat menunjuk pada kaki atau tungkai, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Buatlah
  rationale: Bentuk perfektum Qal dengan waw dalam rangkaian petunjuk berfungsi sebagai perintah; bentuk imperatif Indonesia menyampaikan daya direktifnya secara alami.
- source_word: לּוֹ
  choice: untuk meja itu
  rationale: Pronomina maskulin tunggal merujuk kepada meja dalam konteks sebelumnya. Penyebutan nomina memperjelas acuannya dalam bahasa Indonesia.
- source_word: אַרְבַּע טַבְּעֹת זָהָב
  choice: empat gelang emas
  rationale: Ungkapan ini menyatakan empat gelang yang terbuat dari emas; susunan tersebut ringkas dan wajar dalam bahasa Indonesia modern.
- source_word: וְנָתַתָּ
  choice: lalu pasanglah
  rationale: נתן secara dasar berarti memberi atau menaruh, tetapi dalam petunjuk pembuatan benda, 'pasanglah' secara alami menyatakan penempatan gelang pada meja.
- source_word: עַל
  choice: pada
  rationale: Preposisi ini menunjukkan lokasi penempatan; 'pada' sesuai untuk gelang yang dipasang di bagian tertentu dari meja.
- source_word: אַרְבַּע הַפֵּאֹת
  choice: keempat sudut
  rationale: פֵּאָה dapat berarti sisi, tepi, atau sudut. Dalam uraian lokasi gelang pada meja, 'sudut' paling jelas menggambarkan empat ujungnya tanpa meniadakan alternatif leksikal.
- source_word: אֲשֶׁר לְאַרְבַּע רַגְלָיו
  choice: yang terdapat di dekat keempat kakinya
  rationale: Konstruksi dengan לְ menghubungkan sudut-sudut itu dengan empat penyangga meja. 'Di dekat' mempertahankan hubungan lokasi tanpa menyatakan secara berlebihan bahwa gelang berada tepat pada kaki; רֶגֶל untuk perabot secara alami diterjemahkan 'kaki'.
