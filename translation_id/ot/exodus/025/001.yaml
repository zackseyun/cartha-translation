  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: id
  text: 'Kemudian Yahweh berfirman kepada Musa[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; juga ditransliterasikan atau dilafalkan “Yahweh” atau “Yehova”.'
    reason: Menjelaskan bentuk konsonantal nama ilahi dalam teks Ibrani serta ragam bentuk yang digunakan dalam bahasa lain.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Kemudian ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. “Kemudian” menyatakan urutan secara alami, sedangkan “berfirman” merupakan padanan bahasa Indonesia yang wajar dan bermartabat untuk tindakan Allah berbicara.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dialihaksarakan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap tampak, bukan diganti dengan gelar.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menandai orang yang menjadi tujuan perkataan; “kepada” adalah padanan Indonesia yang alami.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Menggunakan bentuk nama yang sudah baku dan dikenal luas dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara terpisah
  rationale: Dalam rumus pengantar ujaran Ibrani, infinitif ini memperkenalkan perkataan langsung. Bahasa Indonesia secara alami cukup memakai “berfirman kepada Musa” sebelum isi firman pada ayat berikutnya; menerjemahkannya sebagai “dengan mengatakan” akan terasa kaku dan berulang.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memuat nama ilahi YHWH, sehingga “Yahweh” mempertahankan nama pribadi itu. Catatan kaki menjelaskan bentuk Ibraninya dan ragam penyebutannya tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Berfirman” dipilih karena pembicaranya adalah Allah dan merupakan ungkapan baku yang mudah dipahami. Tanda koma mempertahankan fungsi ayat ini sebagai pengantar bagi perkataan langsung yang berlanjut pada ayat berikutnya.
