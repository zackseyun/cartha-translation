  text: The rings shall be opposite the frame[b][a], as holders for the poles to carry the table.
translation:
  language: id
  text: Cincin-cincin itu harus terletak berhadapan dengan bingkai[a], sebagai tempat bagi kayu-kayu pengusung[b] untuk mengusung meja itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di sisi bingkai” atau “sejajar dengan bingkai.” Kata Ibraninya menunjukkan posisi dalam kaitannya dengan bingkai tanpa menentukan susunan yang persis.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “sebagai rumah-rumah bagi kayu-kayu pengusung,” yaitu wadah atau tempat untuk memasukkan kayu-kayu itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֻמַּת
  choice: berhadapan dengan
  rationale: Ungkapan ini menunjukkan posisi relatif terhadap bingkai, tetapi tidak menetapkan geometri yang persis; 'berhadapan dengan' mempertahankan arti spasial utamanya.
- source_word: הַמִּסְגֶּרֶת
  choice: bingkai
  rationale: Dalam konteks perabot Kemah Suci, kata ini menunjuk pada unsur pembingkai atau pembatas struktural di sekeliling meja.
- source_word: תִּהְיֶיןָ
  choice: harus berada
  rationale: Bentuk imperfek dalam rangkaian petunjuk pembuatan menyatakan ketentuan tentang letak cincin-cincin.
- source_word: הַטַּבָּעֹת
  choice: cincin-cincin itu
  rationale: Padanan lazim bagi cincin logam pada perabot Kemah Suci.
- source_word: לְבָתִּים
  choice: sebagai tempat memasukkan
  rationale: Secara harfiah berarti 'sebagai rumah-rumah', tetapi di sini fungsinya ialah wadah atau tempat masuknya kayu pengusung.
- source_word: לְבַדִּים
  choice: kayu-kayu pengusung
  rationale: Dalam konteks ini בַּדִּים adalah batang-batang yang dimasukkan ke dalam cincin untuk mengusung meja; padanan ini jelas dan alami dalam bahasa Indonesia.
- source_word: לָשֵׂאת
  choice: untuk mengangkut
  rationale: Infinitif ini menyatakan tujuan penggunaan kayu-kayu pengusung.
- source_word: הַשֻּׁלְחָן
  choice: meja itu
  rationale: Padanan langsung dan baku bagi meja yang sedang dijelaskan.
