  text: וְ/עָשִׂ֥יתָ כַפֹּ֖רֶת זָהָ֣ב טָה֑וֹר אַמָּתַ֤יִם וָ/חֵ֨צִי֙ אָרְכָּ֔/הּ וְ/אַמָּ֥ה וָ/חֵ֖צִי רָחְבָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/exodus/025/017.yaml
  text: And you shall make a mercy seat of pure gold; its length shall be two cubits and a half[a], and its width a cubit and a half.
translation:
  language: id
  text: Buatlah tutup pendamaian[a] dari emas murni. Panjangnya dua setengah hasta dan lebarnya satu setengah hasta.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini menamai penutup emas yang diletakkan di atas tabut dan berkaitan dengan akar kata כפר, yang berhubungan dengan pendamaian. Dapat juga diterjemahkan “tutup”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Buatlah
  rationale: Bentuk Qal perfektum dengan waw dalam konteks petunjuk berfungsi sebagai perintah. Bentuk imperatif Indonesia ini alami dan mempertahankan daya perintahnya.
- source_word: כַפֹּרֶת
  choice: tutup pendamaian
  rationale: Kata ini menunjuk pada penutup emas khusus di atas tabut dan berkaitan dengan akar כפר, yang berhubungan dengan pendamaian. Pilihan ini lebih jelas daripada sekadar 'tutup' dan tidak mengesankan benda itu sebagai tempat duduk secara harfiah.
- source_word: זָהָב טָהוֹר
  choice: dari emas murni
  rationale: Ungkapan ini menyatakan bahan dan mutunya; susunan 'dari emas murni' merupakan padanan Indonesia yang alami dan tepat.
- source_word: אַמָּתַיִם וָחֵצִי
  choice: dua setengah hasta
  rationale: Ukuran kuno hasta dipertahankan tanpa konversi, sedangkan susunan bilangannya dibuat alami dalam bahasa Indonesia.
- source_word: אָרְכָּהּ
  choice: Panjangnya
  rationale: Pronomina feminin tunggal merujuk kepada כַפֹּרֶת; bentuk berakhiran -nya menyampaikan rujukan tersebut dengan ringkas.
- source_word: וְאַמָּה וָחֵצִי
  choice: dan ... satu setengah hasta
  rationale: Terjemahan mempertahankan ukuran kuno dan hubungan koordinatif dengan ukuran panjang.
- source_word: רָחְבָּהּ
  choice: lebarnya
  rationale: Nomina dengan sufiks feminin tunggal menyatakan lebar benda yang sama; 'lebarnya' alami dan tepat.
theological_decisions:
- issue: Makna כַפֹּרֶת sebagai benda ibadah yang terkait dengan pendamaian
  choice: tutup pendamaian
  alternative: tutup; tutup belas kasihan
  rationale: Istilah ini menamai penutup emas tabut dan memiliki kaitan leksikal dengan akar כפר. 'Tutup pendamaian' mempertahankan identitas bendanya sekaligus hubungan teologisnya tanpa mengubahnya menjadi sekadar tutup biasa. Catatan kaki mendokumentasikan bahwa istilah Ibraninya bersifat khusus dan sarat makna.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Kalimat perintah dibuat langsung, ukuran hasta dipertahankan sebagai satuan kuno, dan istilah kultis dijelaskan melalui catatan kaki.
