  text: batu-batu oniks[a] dan batu-batu untuk tatahan[b], untuk efod dan tutup dada[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini secara tradisional diterjemahkan “oniks,” tetapi jenis batu yang tepat tidak diketahui dengan pasti; mungkin batu berharga lain.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “batu-batu untuk dipasang” atau “batu-batu tatahan.”
    reason: lexical_alternative
  - marker: c
    text: Atau “penutup dada”; secara tradisional “tutup dada.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבְנֵי שֹׁהַם
  choice: batu-batu krisopras
  rationale: אַבְנֵי adalah bentuk jamak konstruktus yang berarti 'batu-batu', sedangkan identitas שֹׁהַם tidak pasti. 'Krisopras' dipakai sebagai padanan tradisional yang dikenal dalam sejumlah terjemahan Indonesia, dengan ketidakpastiannya dinyatakan dalam catatan kaki.
- source_word: אַבְנֵי מִלֻּאִים
  choice: batu-batu permata untuk ditatahkan
  rationale: מִלֻּאִים berkaitan dengan isian atau tatahan. Dalam konteks perlengkapan imam, frasa ini menunjuk pada batu-batu berharga yang akan dipasang dalam tatahan; kata 'permata' membuat konteks inventaris bahan berharga jelas dalam bahasa Indonesia alami.
- source_word: לָאֵפֹד
  choice: pada efod
  rationale: אֵפוֹד adalah istilah teknis bagi pakaian imam sehingga dipertahankan sebagai transliterasi 'efod'. Preposisi ל menyatakan peruntukan atau pemasangan; 'pada' paling alami bersama 'ditatahkan'.
- source_word: וְלַחֹשֶׁן
  choice: dan penutup dada
  rationale: חֹשֶׁן menunjuk pada perlengkapan imam yang dikenakan di dada dan memuat batu-batu. 'Penutup dada' jelas serta tidak menimbulkan kesan baju zirah seperti 'pelindung dada'.
