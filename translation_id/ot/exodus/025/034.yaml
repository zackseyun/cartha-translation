translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'kaki pelita' dipakai untuk keseluruhan lampstand, sedangkan bentuk jamak pada unsur hias dipertahankan secara alami. Penanda catatan kaki ditempatkan tepat sesudah unsur yang dijelaskannya.
