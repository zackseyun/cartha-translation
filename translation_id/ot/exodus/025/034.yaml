  text: And on the lampstand there shall be four cups made like almond blossoms[b][a], with its buds and its flowers.
translation:
  language: id
  text: Pada kandil itu harus ada empat cawan berbentuk bunga badam[a], lengkap dengan kuncup-kuncup[b] dan bunga-bunganya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berbentuk seperti badam” atau “dihiasi bunga badam.” Bahasa Ibrani menggambarkan cawan-cawan itu dengan gambaran dari pohon badam dan dapat menekankan bentuk ataupun hiasannya.
    reason: lexical_alternative
  - marker: b
    text: Atau “tombol-tombol.” Istilah Ibrani ini menunjuk pada bagian hias yang membulat pada kandil.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַמְּנֹרָה
  choice: Pada kaki pelita itu
  rationale: Preposisi ב paling alami menyatakan letak pada bagian kaki pelita. מְנֹרָה menunjuk pada seluruh kaki pelita, bukan hanya pelitanya.
- source_word: אַרְבָּעָה גְבִעִים
  choice: empat cawan
  rationale: גְבִעִים menunjuk pada bentuk hiasan menyerupai mangkuk atau cawan; 'cawan' jelas dan wajar dalam uraian benda ibadah.
- source_word: מְשֻׁקָּדִים
  choice: berbentuk bunga badam
  rationale: Bentuk denominatif dari akar yang berkaitan dengan pohon badam menggambarkan pola berciri bunga badam. Terjemahan ini komunikatif sambil tetap mengakui bahwa bentuk atau hiasan dapat menjadi tekanannya.
- source_word: כַּפְתֹּרֶיהָ
  choice: kuncup-kuncupnya
  rationale: Istilah ini menunjuk pada tonjolan hias yang membulat. 'Kuncup' selaras dengan gambaran tumbuhan, tetapi makna 'tombol' tetap mungkin.
- source_word: וּפְרָחֶיהָ
  choice: dan bunga-bunganya
  rationale: פֶּרַח berarti bunga atau kuntum yang mekar; 'bunga' alami dalam bahasa Indonesia dan berpasangan baik dengan 'kuncup'.
