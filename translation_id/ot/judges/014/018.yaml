base_translation:
  language: en
  yaml_path: translation/ot/judges/014/018.yaml
  text: And the men of the city said to him on the seventh day[a], before the sun went down, “What is sweeter than honey, and what is stronger than a lion?” And he said to them, “If you had not plowed with my heifer[b], you would not have found out my riddle.”
translation:
  language: id
  text: Pada hari ketujuh, sebelum matahari terbenam,[a] orang-orang kota itu berkata kepadanya, “Apa yang lebih manis daripada madu, dan apa yang lebih kuat daripada singa?” Ia berkata kepada mereka, “Seandainya kalian tidak membajak dengan lembu betinaku,[b] kalian tidak akan menemukan jawaban atas teka-tekiku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sebelum matahari masuk,” suatu ungkapan yang berarti sebelum matahari terbenam.
    reason: lexical_alternative
  - marker: b
    text: Simson memakai “lembu betinaku” sebagai metafora bagi istrinya. Ia menuduh mereka memanfaatkan istrinya untuk memperoleh jawaban teka-teki itu.
    reason: cultural_note
lexical_decisions:
- source_word: אַנְשֵׁי הָעִיר
  choice: orang-orang kota itu
  rationale: Menerjemahkan frasa maskulin jamak secara alami dalam bahasa Indonesia; konteks menunjukkan para lelaki kota tersebut tanpa perlu memakai ungkapan kaku ‘kaum laki-laki kota’.
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: Pada hari ketujuh
  rationale: Padanan temporal yang baku, jelas, dan dekat dengan bentuk Ibrani.
- source_word: בְּטֶרֶם יָבֹא הַחַרְסָה
  choice: sebelum matahari terbenam
  rationale: Mengungkapkan makna idiom Ibrani secara wajar; bentuk harfiahnya diterangkan dalam catatan kaki.
- source_word: מַה מָּתוֹק מִדְּבַשׁ
  choice: Apa yang lebih manis daripada madu
  rationale: Preposisi מן berfungsi komparatif, sehingga ‘daripada’ menyampaikan maksud teka-teki secara tepat.
- source_word: וּמֶה עַז מֵאֲרִי
  choice: dan apa yang lebih kuat daripada singa
  rationale: עַז dapat berarti kuat, perkasa, atau ganas; ‘lebih kuat’ paling sesuai dengan susunan perbandingan dan jawaban teka-teki.
- source_word: לוּלֵא
  choice: Seandainya ... tidak
  rationale: Menandai syarat yang berlawanan dengan kenyataan dan cocok dengan akibat lampau ‘tidak akan’.
- source_word: חֲרַשְׁתֶּם
  choice: membajak
  rationale: Mempertahankan metafora pertanian yang tajam, alih-alih melunakkannya menjadi ‘memanfaatkan’.
- source_word: בְּעֶגְלָתִי
  choice: dengan lembu betinaku
  rationale: Mempertahankan citra harfiah dan sindiran yang menghina terhadap istri Simson; acuannya dijelaskan dalam catatan kaki.
- source_word: מְצָאתֶם חִידָתִי
  choice: menemukan jawaban teka-tekiku
  rationale: Secara kontekstual, ‘menemukan’ berarti memperoleh penyelesaian teka-teki. Penambahan ‘jawaban’ membuat maksudnya alami dalam bahasa Indonesia tanpa mengubah makna.
