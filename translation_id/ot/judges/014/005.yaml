base_translation:
  language: en
  yaml_path: translation/ot/judges/014/005.yaml
  text: Then Samson went down with his father and his mother to Timnah[a], and they came as far as the vineyards of Timnah. And behold[c][b], a young lion was roaring as it came toward him.
translation:
  language: id
  text: Lalu Simson turun bersama ayah dan ibunya ke Timna. Mereka sampai di kebun-kebun anggur Timna. Dan lihatlah, seekor singa muda sedang mengaum sambil mendatanginya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “seekor singa muda sedang mengaum menyongsongnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: pergi turun
  rationale: Mempertahankan nuansa arah verba ירד, yaitu bergerak turun dari daerah perbukitan menuju Timna, dalam ungkapan Indonesia yang wajar.
- source_word: תִּמְנָתָה
  choice: ke Timna
  rationale: Akhiran penunjuk arah menyatakan gerak menuju tempat tersebut; 'ke Timna' menyampaikan tujuan secara alami.
- source_word: וַיָּבֹאוּ עַד
  choice: ketika mereka sampai di
  rationale: Gabungan בוא dan עַד menunjukkan bahwa mereka mencapai suatu titik dalam perjalanan. Susunan temporal ini menghasilkan narasi Indonesia yang alami tanpa menghilangkan tahap perjalanan tersebut.
- source_word: כַּרְמֵי תִמְנָתָה
  choice: kebun-kebun anggur Timna
  rationale: Bentuk jamak konstruksi merujuk pada kebun-kebun anggur yang berkaitan dengan Timna.
- source_word: וְהִנֵּה
  choice: tiba-tiba
  rationale: Dalam konteks naratif, הִנֵּה mengarahkan perhatian kepada kemunculan yang mengejutkan. 'Tiba-tiba' menyampaikan efek wacananya secara alami dalam bahasa Indonesia modern.
- source_word: כְּפִיר אֲרָיוֹת
  choice: seekor singa muda
  rationale: כְּפִיר berarti singa muda, sedangkan rangkaian dengan אֲרָיוֹת merupakan ungkapan Ibrani yang tidak perlu diterjemahkan kata demi kata.
- source_word: שֹׁאֵג
  choice: mengaum
  rationale: Partisip ini menggambarkan tindakan yang sedang berlangsung; dalam konstruksi Indonesia, 'mengaum menyongsongnya' mempertahankan kejelasan dan daya hidup adegan.
- source_word: לִקְרָאתוֹ
  choice: menyongsongnya
  rationale: Ungkapan ini dapat berarti menuju atau menemui seseorang. 'Menyongsongnya' mempertahankan gerak ke arah Simson tanpa secara berlebihan menetapkan rincian serangannya.
