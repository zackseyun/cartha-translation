  text: So his father went down to the woman[a], and Samson made a feast there, for that is what the young men did.
translation:
  language: id
  text: Lalu ayahnya turun menemui perempuan itu, dan Simson mengadakan perjamuan[a] di sana, sebab begitulah yang biasa dilakukan para pemuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pesta” atau “perjamuan dengan minum.” Kata Ibrani מִשְׁתֶּה sering merujuk pada jamuan perayaan yang melibatkan minum.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: turun
  rationale: Mempertahankan nuansa arah dari ירד dalam narasi Ibrani.
- source_word: אָבִיהוּ
  choice: ayahnya
  rationale: Akhiran pronominal orang ketiga maskulin tunggal mengacu kepada Simson dalam konteks.
- source_word: אֶל הָאִשָּׁה
  choice: menemui perempuan itu
  rationale: Menjaga sebutan umum 'perempuan itu' tanpa mempersempitnya menjadi 'istrinya'; 'menemui' merupakan ungkapan Indonesia yang alami untuk gerak menuju seseorang.
- source_word: וַיַּעַשׂ
  choice: mengadakan
  rationale: Dalam kolokasi dengan מִשְׁתֶּה, 'mengadakan perjamuan' lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'membuat perjamuan'.
- source_word: שָׁם
  choice: di sana
  rationale: Padanan lokatif langsung dan alami.
- source_word: מִשְׁתֶּה
  choice: perjamuan
  rationale: Menunjukkan jamuan perayaan yang lazimnya mencakup minum-minum tanpa menjadikan unsur minuman sebagai satu-satunya fokus.
- source_word: כִּי כֵּן יַעֲשׂוּ
  choice: sebab demikianlah kebiasaan
  rationale: Imperfek dalam konteks ini menyatakan tindakan yang lazim; rumusan ini mengungkapkan aspek kebiasaan secara jelas dan bermartabat.
- source_word: הַבַּחוּרִים
  choice: para pemuda
  rationale: Padanan alami bagi laki-laki muda dalam konteks perayaan perkawinan.
