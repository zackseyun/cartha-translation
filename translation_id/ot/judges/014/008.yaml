translation:
  language: id
  text: Beberapa waktu kemudian, ia kembali untuk mengambil perempuan itu menjadi istrinya. Ia berbelok untuk melihat bangkai singa itu, dan lihatlah, di dalam bangkai singa itu ada sekawanan lebah dan madu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִיָּמִים
  choice: Beberapa waktu kemudian
  rationale: Ungkapan waktu Ibrani ini secara harfiah berkaitan dengan 'hari-hari', tetapi dalam konteks menyatakan berlalunya waktu yang tidak ditentukan.
- source_word: לְקַחְתָּהּ
  choice: untuk mengambil perempuan itu menjadi istrinya
  rationale: Kata 'mengambil' dalam konteks rangkaian perkawinan berarti membawanya sebagai istri; tambahan 'menjadi istrinya' membuat maksudnya jelas dalam bahasa Indonesia tanpa mengganti tindakan dasarnya.
- source_word: מַפֶּלֶת הָאַרְיֵה
  choice: bangkai singa itu
  rationale: Secara harfiah menunjuk pada singa yang telah jatuh atau terbunuh; dalam konteks, padanan alami dan tepat ialah 'bangkai'.
- source_word: עֲדַת דְּבוֹרִים
  choice: sekawanan lebah
  rationale: עֵדָה menyatakan kumpulan atau kawanan; 'sekawanan lebah' merupakan ungkapan Indonesia yang alami.
- source_word: בִּגְוִיַּת הָאַרְיֵה
  choice: di dalam tubuh singa itu
  rationale: גְּוִיָּה dapat berarti tubuh atau jasad. 'Tubuh' mempertahankan perbedaan leksikal dari מַפֶּלֶת yang sebelumnya diterjemahkan 'bangkai'.
- source_word: וּדְבָשׁ
  choice: dan madu
  rationale: Mempertahankan konstruksi ringkas sumber, yang hanya menambahkan keberadaan madu tanpa verba tersurat.
