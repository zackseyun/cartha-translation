translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan konjungsi Ibrani diolah menjadi kalimat-kalimat alami, sedangkan penutup ringkas 'dan madu' dipertahankan sedekat mungkin dengan bentuk sumber.
