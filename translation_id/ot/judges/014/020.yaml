  text: And Samson’s wife became the wife of his companion[a], who had been his friend.
translation:
  language: id
  text: Lalu istri Simson menjadi istri rekan Simson, yang dahulu menjadi sahabat Simson.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sahabat Simson ... yang dahulu menjadi rekannya.” Bahasa Ibrani memakai kata-kata yang berkerabat dari kelompok kata רעה untuk menyatakan hubungan sosial.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: menjadi
  rationale: 'Bentuk naratif dari היה di sini menunjukkan perubahan keadaan atau hasil: istri Simson beralih menjadi istri laki-laki lain.'
- source_word: אֵשֶׁת שִׁמְשׁוֹן
  choice: istri Simson
  rationale: Rangkaian konstruksi ini secara langsung menyatakan hubungan perkawinan; bentuk ini alami dalam bahasa Indonesia modern.
- source_word: לְמֵרֵעֵהוּ
  choice: menjadi istri pendampingnya
  rationale: Preposisi ל bersama היה menyatakan peralihan atau hubungan baru. Nomina dari kelompok kata רעה menunjuk pada seorang rekan atau pendamping; konteks pesta perkawinan mendukung 'pendamping'.
- source_word: אֲשֶׁר רֵעָה לוֹ
  choice: yang telah menjadi sahabatnya
  rationale: Klausa relatif ini menggambarkan laki-laki tersebut sebagai orang yang bergaul dengan Simson atau menjadi sahabatnya, bukan sebagai gembala.
