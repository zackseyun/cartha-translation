translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bermartabat. 'Pendamping' mempertahankan kaitan dengan konteks pesta perkawinan, sedangkan catatan kaki mencatat kemungkinan makna 'sahabat' dan permainan kata berkerabat dalam bahasa Ibrani.
