  verdict: revise
  source_fidelity: Terjemahan umumnya setia pada alur dan intensitas teks Ibrani. Namun, הַחִידָה berarti “teka-teki,” bukan “jawaban”; konteks memang mengisyaratkan pemecahannya, tetapi teks sumber tidak menyatakannya secara eksplisit. Selain itu, בְנֵי עַמָּהּ secara harfiah merujuk pada laki-laki dari bangsanya, sehingga terjemahan utama sebaiknya mempertahankan unsur maskulin itu.
  naturalness: Bahasa Indonesia baku, lancar, dan bernada naratif wajar. “Menangis di hadapannya” adalah penghalusan yang alami untuk idiom Ibrani, dengan daya tekanan emosional dijelaskan oleh catatan kaki.
  terminology: “Perjamuan,” “mendesaknya,” dan “teka-teki” tepat dalam register ini. “Para lelaki sebangsanya” lebih tepat daripada “orang-orang sebangsanya” karena mempertahankan bentuk maskulin dalam sumber tanpa membuat kalimat tidak alami.
  issues:
  - severity: medium
    issue: “jawabannya” dan “jawaban teka-teki itu” menambahkan objek yang tidak disebutkan secara eksplisit oleh teks Ibrani.
    rationale: Kata kerja נגד hanya menyatakan bahwa Simson memberitahukan sesuatu kepadanya, sedangkan objek eksplisit pada klausa berikutnya ialah “teka-teki itu” (הַחִידָה). Walaupun pembaca dapat menyimpulkan bahwa yang dibocorkan adalah solusinya, terjemahan utama perlu mempertahankan ungkapan sumber.
