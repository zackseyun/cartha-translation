    issue: “orang-orang sebangsanya” menghilangkan unsur maskulin dalam בְנֵי עַמָּהּ.
    rationale: Dalam konteks istilah ini menunjuk kepada para lelaki dari bangsanya. “Para lelaki sebangsanya” alami dalam bahasa Indonesia dan lebih setia secara leksikal.
