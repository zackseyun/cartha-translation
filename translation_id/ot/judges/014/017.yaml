  to: Selama tujuh hari perjamuan itu berlangsung, perempuan itu menangis di hadapannya[a]. Pada hari ketujuh, Simson memberitahukan hal itu kepadanya karena perempuan itu terus mendesaknya. Lalu perempuan itu memberitahukan teka-teki itu kepada para lelaki sebangsanya[b].
