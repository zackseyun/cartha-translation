base_translation:
  language: en
  yaml_path: translation/ot/judges/014/017.yaml
  text: She wept before him the seven days that they had the feast[a]. And on the seventh day he told her, because she pressed him hard[b]; then she told the riddle to the sons of her people.
translation:
  language: id
  text: Selama tujuh hari perjamuan itu berlangsung, perempuan itu menangis di hadapannya[a]. Pada hari ketujuh, Simson memberitahukan hal itu kepadanya karena perempuan itu terus mendesaknya. Lalu perempuan itu memberitahukan teka-teki itu kepada para lelaki sebangsanya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menangis atasnya.” Ungkapan Ibrani ini menggambarkan tangisan yang diarahkan kepada Simson dan dipakai untuk terus menekan dia secara emosional.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak-anak lelaki bangsanya”; dalam konteks, kemungkinan yang dimaksud ialah para lelaki Filistin yang sebangsa dengannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּבְךְּ עָלָיו
  choice: perempuan itu menangis di hadapannya
  rationale: בכה berarti menangis, sedangkan עַל dengan sufiks menunjukkan bahwa tangisnya diarahkan kepada Simson dan menjadi tekanan emosional. Ungkapan Indonesia ini alami; daya desaknya dijelaskan dalam catatan.
- source_word: שִׁבְעַת הַיָּמִים אֲשֶׁר הָיָה לָהֶם הַמִּשְׁתֶּה
  choice: selama tujuh hari perjamuan itu berlangsung
  rationale: Frasa ini menyatakan seluruh rentang tujuh hari pesta. מִשְׁתֶּה adalah perjamuan atau pesta, sering dengan unsur minum-minum, tetapi konteks tidak mengharuskan unsur itu dinyatakan.
- source_word: וַיְהִי בַּיּוֹם הַשְּׁבִיעִי
  choice: Pada hari ketujuh
  rationale: Bentuk ini berfungsi sebagai peralihan waktu dalam alur narasi dan dapat diterjemahkan secara wajar tanpa padanan harfiah 'terjadilah'.
- source_word: וַיַּגֶּד לָהּ
  choice: Simson memberitahukan jawabannya kepadanya
  rationale: נגד berarti memberitahukan atau menyatakan. Subjek eksplisit 'Simson' menghindari rentetan pronomina yang kabur dalam bahasa Indonesia, sedangkan 'jawabannya' menyatakan objek tersirat dari konteks teka-teki.
- source_word: כִּי הֱצִיקַתְהוּ
  choice: karena perempuan itu terus mendesaknya
  rationale: Bentuk hiphil צוק menyampaikan tekanan kuat dan berulang. 'Terus mendesaknya' alami dalam bahasa Indonesia serta mempertahankan intensitas dan sifat persisten tindakannya.
- source_word: וַתַּגֵּד הַחִידָה
  choice: memberitahukan jawaban teka-teki itu
  rationale: Secara harfiah teks menyebut 'teka-teki', tetapi dalam konteks yang diberitahukan adalah pemecahan atau jawabannya. Pilihan ini mencegah kesan bahwa ia hanya mengulangi bunyi teka-teki.
- source_word: לִבְנֵי עַמָּהּ
  choice: kepada orang-orang sebangsanya
  rationale: Secara harfiah 'kepada anak-anak lelaki bangsanya'. Dalam konteks, ungkapan itu menunjuk kepada kaum lelaki dari bangsanya; 'orang-orang sebangsanya' merupakan ungkapan Indonesia yang alami sambil membiarkan cakupan tepatnya dijelaskan dalam catatan.
