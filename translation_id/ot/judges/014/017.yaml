  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Nama 'Simson' dan nomina 'perempuan itu' dipakai untuk menjernihkan rujukan pronomina. Semua penanda catatan kaki dicantumkan dalam teks utama.
