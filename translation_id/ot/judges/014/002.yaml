base_translation:
  language: en
  yaml_path: translation/ot/judges/014/002.yaml
  text: Then he went up and told his father and mother[a], and he said, “I saw a woman in Timnah from the daughters of the Philistines. So now, get her for me as a wife.”
translation:
  language: id
  text: Lalu ia pergi ke atas dan memberi tahu ayah dan ibunya. Katanya, “Aku melihat seorang perempuan di Timna, salah seorang anak perempuan orang Filistin.[a] Sekarang, ambillah dia bagiku sebagai istri.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari antara anak-anak perempuan orang Filistin.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: Lalu ia pulang
  rationale: Kata עלה secara harfiah berarti ‘naik/pergi ke atas’, tetapi dalam konteks ini menunjuk pada kepulangan Simson dari Timna kepada orang tuanya. ‘Pulang’ menyampaikan gerak naratif secara alami tanpa memaksakan keterangan topografis yang kurang wajar dalam bahasa Indonesia.
- source_word: וַיַּגֵּד
  choice: memberi tahu
  rationale: Bentuk Hifil dari נגד berarti memberitahukan atau melaporkan; ‘memberi tahu’ alami dalam bahasa Indonesia modern.
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: ayah dan ibunya
  rationale: Menyampaikan kedua hubungan keluarga dengan bentuk kepunyaan yang alami dalam bahasa Indonesia.
- source_word: אִשָּׁה
  choice: seorang perempuan
  rationale: Di sini אִשָּׁה berarti perempuan, bukan istri, sebab permintaan untuk menjadikannya istri baru muncul sesudahnya.
- source_word: רָאִיתִי
  choice: Aku melihat
  rationale: Bentuk perfektif dalam tuturan naratif ini paling wajar diterjemahkan sebagai tindakan lampau sederhana.
- source_word: בְתִמְנָתָה
  choice: di Timna
  rationale: Bentuk tempat ini menunjuk lokasi di Timna; ‘di’ merupakan padanan Indonesia yang alami.
- source_word: מִבְּנוֹת פְּלִשְׁתִּים
  choice: salah seorang anak perempuan orang Filistin
  rationale: Menjaga makna partitif ‘seorang dari antara anak-anak perempuan orang Filistin’ dan citra kekerabatan Ibrani, sambil tetap dapat dipahami.
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Menandai peralihan dari laporan kepada permintaan; hubungan konsekuensial sudah jelas dari konteks.
- source_word: קְחוּ
  choice: ambillah
  rationale: Bentuk jamak imperatif לקח ditujukan kepada kedua orang tua. ‘Ambillah’ mempertahankan ungkapan permintaan perkawinan dalam teks sumber.
- source_word: אוֹתָהּ לִּי לְאִשָּׁה
  choice: dia untukku menjadi istriku
  rationale: Mempertahankan unsur ‘untukku’ dan tujuan perkawinan, dengan susunan yang tetap alami dan tegas dalam bahasa Indonesia.
