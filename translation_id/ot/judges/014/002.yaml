revisions:
- from: Lalu ia pulang dan memberi tahu ayah dan ibunya. Katanya, “Aku melihat seorang perempuan di Timna, salah seorang anak perempuan orang Filistin.[a] Sekarang, ambillah dia untukku menjadi istriku.”
  to: Lalu ia pergi ke atas dan memberi tahu ayah dan ibunya. Katanya, “Aku melihat seorang perempuan di Timna, salah seorang anak perempuan orang Filistin.[a] Sekarang, ambillah dia bagiku sebagai istri.”
  rationale: Revisi mengganti 'pulang' dengan 'pergi ke atas' untuk mempertahankan arah gerak yang dinyatakan oleh וַיַּעַל tanpa menyimpulkan kepulangan. Formula permintaan perkawinan dirapikan menjadi bahasa Indonesia yang lebih alami, dan catatan kaki dibatasi pada alternatif harfiah frasa partitif Ibrani.
