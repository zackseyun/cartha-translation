  register: Bahasa Indonesia baku, modern, dan bermartabat. Tuturan langsung dibuat lugas sesuai nada tuntutan Simson. Nama tempat ditulis ‘Timna’, bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
