  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אָבִ֨י/ו וְ/אִמּ֜/וֹ לֹ֣א יָדְע֗וּ כִּ֤י מֵ/יְהוָה֙ הִ֔יא כִּי תֹאֲנָ֥ה הֽוּא מְבַקֵּ֖שׁ מִ/פְּלִשְׁתִּ֑ים וּ/בָ/עֵ֣ת הַ/הִ֔יא פְּלִשְׁתִּ֖ים מֹשְׁלִ֥ים בְּ/יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/004.yaml
  text: But his father and mother did not know that it was from Yahweh[a], for he was seeking an occasion from the Philistines[b]. At that time the Philistines were ruling over Israel.
translation:
  language: id
  text: Namun, ayah dan ibunya tidak tahu bahwa hal itu berasal dari Yahweh,[a] sebab ia sedang mencari kesempatan untuk melawan orang Filistin.[b] Pada waktu itu, orang Filistin berkuasa atas Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebab Dia sedang mencari kesempatan untuk melawan orang Filistin,” dengan “Dia” dipahami sebagai Yahweh. Bahasa Ibrani memungkinkan pemahaman ini, meskipun konteks lebih mungkin menunjuk kepada Simson.
    reason: alternative_reading
  - marker: b
    text: Atau “dalih” atau “peluang” untuk bertindak terhadap orang Filistin.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵיְהוָה
  choice: berasal dari Yahweh
  rationale: Mempertahankan nama perjanjian יהוה sebagai “Yahweh” dan menyatakan bahwa perkara tersebut bersumber dari tindakan atau maksud ilahi tanpa menjelaskan mekanismenya lebih jauh.
- source_word: הִיא
  choice: hal itu
  rationale: Pronomina feminin ini menunjuk pada perkara atau situasi yang sedang dibicarakan; “hal itu” wajar dalam bahasa Indonesia dan tidak memaksakan gender gramatikal Ibrani.
- source_word: תֹאֲנָה
  choice: kesempatan
  rationale: Kata ini menunjuk pada alasan, dalih, atau kesempatan untuk bertindak. “Kesempatan” menjaga keluasan makna tanpa langsung menyiratkan ketidaktulusan seperti “dalih”.
- source_word: מְבַקֵּשׁ
  choice: sedang mencari
  rationale: Bentuk partisip menampilkan tindakan yang sedang berlangsung pada waktu itu.
- source_word: מִפְּלִשְׁתִּים
  choice: untuk melawan orang Filistin
  rationale: Walaupun preposisi מִן secara harfiah dapat berarti “dari,” konstruksi dan konteks menunjukkan kesempatan untuk bertindak terhadap orang Filistin; “untuk melawan” menyampaikan arah permusuhan secara alami.
- source_word: וּבָעֵת הַהִיא
  choice: Pada waktu itu
  rationale: Ungkapan waktu yang alami dan setia bagi latar naratif.
- source_word: מֹשְׁלִים בְּיִשְׂרָאֵל
  choice: berkuasa atas Israel
  rationale: Menyampaikan keadaan pemerintahan atau dominasi yang sedang berlangsung dengan bahasa Indonesia yang ringkas dan wajar.
- source_word: וְאָבִיו וְאִמּוֹ
  choice: ayah dan ibunya
  rationale: Koordinasi posesif ini alami dalam bahasa Indonesia dan tetap mempertahankan kedua pihak.
- source_word: לֹא יָדְעוּ
  choice: tidak tahu
  rationale: Padanan langsung dan jelas bagi bentuk perfektif ידע yang dinegasikan.
theological_decisions:
- issue: Keterlibatan ilahi dalam tindakan Simson dan konflik berikutnya
  choice: Teks menyatakan bahwa perkara itu berasal dari Yahweh, sekaligus menggambarkan Simson sebagai pihak yang mencari kesempatan melawan orang Filistin.
  alternative: Menafsirkan ayat ini secara eksklusif sebagai penentuan ilahi yang menyeluruh, atau hanya sebagai pemanfaatan kemudian atas pilihan manusia yang sepenuhnya mandiri.
  rationale: Bahasa Ibrani menegaskan asal ilahi perkara itu sekaligus menyajikan pelaku manusia. Terjemahan mempertahankan kedua unsur tersebut tanpa menyelesaikan ketegangan teologis melampaui teks.
- issue: Rujukan subjek pada מְבַקֵּשׁ, “ia sedang mencari”
  choice: Dalam teks utama, “ia” dipahami sebagai Simson.
  alternative: “Ia” dapat dipahami sebagai Yahweh.
  rationale: Konteks naratif paling wajar menunjuk kepada Simson sebagai orang yang mencari kesempatan melalui perkara perkawinannya, tetapi tata bahasa Ibrani memungkinkan Yahweh sebagai rujukan; karena itu alternatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. “Namun” menandai kontras dengan ayat sebelumnya. Nama ilahi ditransliterasikan sebagai “Yahweh” sesuai lapisan konsultasi yang diberikan. Semua penanda catatan kaki dicantumkan dalam teks utama.
