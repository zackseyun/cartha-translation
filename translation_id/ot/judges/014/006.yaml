  text: וַ/תִּצְלַ֨ח עָלָ֜י/ו ר֣וּחַ יְהוָ֗ה וַֽ/יְשַׁסְּעֵ֨/הוּ֙ כְּ/שַׁסַּ֣ע הַ/גְּדִ֔י וּ/מְא֖וּמָה אֵ֣ין בְּ/יָד֑/וֹ וְ/לֹ֤א הִגִּיד֙ לְ/אָבִ֣י/ו וּ/לְ/אִמּ֔/וֹ אֵ֖ת אֲשֶׁ֥ר עָשָֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/006.yaml
  text: Then the Spirit of Yahweh rushed upon him[a], and he tore it apart as one tears apart a young goat, though he had nothing in his hand[b]. But he did not tell his father or his mother what he had done.
translation:
  language: id
  text: Lalu Roh Yahweh datang atasnya dengan kuasa[a], dan ia mencabik-cabik singa itu seperti orang mencabik-cabik anak kambing, padahal tidak ada apa pun di tangannya[b]. Namun, ia tidak memberi tahu ayah atau ibunya tentang apa yang telah dilakukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “datang atasnya dengan dahsyat” atau “datang dengan kuat atasnya.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dan tidak ada apa pun di tangannya.” Dalam konteks ini, hal itu menunjukkan bahwa ia tidak menggunakan senjata.
    reason: clarification
lexical_decisions:
- source_word: וַתִּצְלַח עָלָיו
  choice: berkuasa atas dia dengan dahsyat
  rationale: Ungkapan צלח dengan עַל menyatakan datangnya Roh secara kuat dan mendadak untuk memberi kuasa. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan unsur kekuatan tanpa menyiratkan gerak fisik secara berlebihan.
- source_word: רוּחַ יְהוָה
  choice: Roh Yahweh
  rationale: רוּחַ di sini menunjuk kepada Roh Allah yang memberi kuasa, sedangkan nama perjanjian יְהוָה dipertahankan sebagai Yahweh.
- source_word: וַיְשַׁסְּעֵהוּ
  choice: ia mencabik-cabik singa itu
  rationale: שׁסע menggambarkan tindakan merobek atau membelah dengan keras. Objek pronominalnya merujuk kepada singa dari konteks sebelumnya; penyebutan 'singa itu' membuat rujukannya jelas dalam bahasa Indonesia.
- source_word: כְּשַׁסַּע הַגְּדִי
  choice: seperti orang mencabik-cabik anak kambing
  rationale: Perbandingan Ibrani menyoroti cara atau mudahnya tindakan itu. 'Anak kambing' jelas bagi pembaca modern dan menghindari istilah yang kurang umum.
- source_word: וּמְאוּמָה אֵין בְּיָדוֹ
  choice: padahal tidak ada apa pun di tangannya
  rationale: Klausa ini menegaskan bahwa ia tidak memakai senjata. 'Padahal' secara wajar menyampaikan hubungan konsesif yang tersirat.
- source_word: וְלֹא הִגִּיד לְאָבִיו וּלְאִמּוֹ
  choice: Namun, ia tidak memberi tahu ayah atau ibunya
  rationale: Dalam kalimat negatif bahasa Indonesia, 'atau' secara alami menyatakan bahwa ia tidak memberi tahu salah satu pun dari kedua orang tuanya.
- source_word: אֵת אֲשֶׁר עָשָׂה
  choice: tentang apa yang telah dilakukannya
  rationale: 'Bentuk ''telah dilakukannya'' menjaga urutan naratif: perbuatan itu terjadi sebelum ia tidak menceritakannya.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung. Bentuk 'Yahweh' mempertahankan nama ilahi, bukan menggantinya dengan gelar.
- issue: Identitas רוּחַ dalam konteks pemberian kuasa
  choice: Roh Yahweh
  alternative: roh dari Yahweh
  rationale: Konstruksi Ibrani dan pola kitab Hakim-Hakim menunjuk kepada Roh Yahweh yang memberi kuasa kepada Simson, bukan sekadar angin, semangat, atau kecenderungan batin.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti naratif 'ia' dipakai untuk kelancaran; ungkapan tindakan dibuat hidup tanpa menambah rincian di luar teks. Semua penanda catatan kaki dicantumkan dalam teks utama.
