base_translation:
  language: en
  yaml_path: translation/ot/judges/014/014.yaml
  text: And he said to them[a], “Out of the eater came food[b], and out of the strong came sweetness.” But they could not tell the riddle for three days.
translation:
  language: id
  text: Lalu ia berkata kepada mereka, “Dari pemakan keluarlah makanan, dan dari yang kuat[a] keluarlah sesuatu yang manis.” Namun, selama tiga hari mereka tidak dapat memecahkan teka-teki itu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang ganas.” Kata Ibrani ini dapat berarti “kuat,” “perkasa,” atau “ganas.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “mereka tidak dapat menjelaskan teka-teki itu selama tiga hari.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ia berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. “Lalu” wajar dalam bahasa Indonesia tanpa memberi urutan waktu yang lebih tegas daripada konteks.
- source_word: מֵהָאֹכֵל
  choice: Dari si pemakan
  rationale: Partisipel Qal dengan artikel dipakai secara substantival, harfiah “si pemakan.” Bentuk ini mempertahankan gaya ringkas dan gambaran teka-teki.
- source_word: יָצָא
  choice: keluar
  rationale: Kata ini menyatakan kemunculan atau keluarnya sesuatu dan membentuk ungkapan teka-teki yang ringkas serta alami.
- source_word: מַאֲכָל
  choice: makanan
  rationale: Nomina ini berarti makanan atau sesuatu yang dapat dimakan. “Makanan” mempertahankan permainan kata dengan “pemakan.”
- source_word: וּמֵעַז
  choice: dan dari si kuat
  rationale: Adjektiva עַז dipakai secara substantival dan dapat berarti kuat, perkasa, atau ganas. “Si kuat” mempertahankan kesejajaran dan tidak terlalu cepat mengidentifikasikannya dengan singa.
- source_word: מָתוֹק
  choice: sesuatu yang manis
  rationale: Adjektiva ini berfungsi substantival. Ungkapan “sesuatu yang manis” terdengar alami dalam bahasa Indonesia dan tetap mempertahankan ketidaklangsungan teka-teki.
- source_word: לֹא יָכְלוּ
  choice: tidak dapat
  rationale: Padanan ringkas dan idiomatis bagi bentuk yang menyatakan ketidakmampuan.
- source_word: לְהַגִּיד הַחִידָה
  choice: menjelaskan teka-teki itu
  rationale: Dalam konteks teka-teki, להגיד dapat menunjuk pada menyampaikan atau menerangkan jawabannya. “Menjelaskan” alami dalam bahasa Indonesia, sementara alternatif yang lebih eksplisit dicatat dalam catatan kaki.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: selama tiga hari
  rationale: Padanan duratif yang alami dan tidak memaksakan batas waktu yang lebih terperinci daripada teks Ibrani.
