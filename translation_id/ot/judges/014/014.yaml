  register: Bahasa Indonesia modern yang lugas dan bermartabat. Struktur paralel teka-teki dipertahankan, dengan “si pemakan” dan “si kuat” untuk mencerminkan pemakaian substantival dalam bahasa Ibrani. Pronomina “ia” tidak dikapitalisasi karena merujuk kepada Simson.
