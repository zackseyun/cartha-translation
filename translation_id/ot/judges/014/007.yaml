  text: Then he went down and spoke to the woman[a], and she was pleasing in Samson’s eyes.
translation:
  language: id
  text: Lalu ia turun dan berbicara kepada perempuan itu, dan perempuan itu dipandang baik oleh Simson.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “perempuan itu baik di mata Simson”; atau, “perempuan itu berkenan kepada Simson.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: Lalu ia pergi ke sana
  rationale: Secara harfiah berarti 'turun'. Dalam bahasa Indonesia, 'pergi ke sana' lebih alami untuk gerak menuju Timna, sementara 'lalu' menyampaikan urutan narasi yang ditandai waw konsekutif.
- source_word: וַיְדַבֵּר
  choice: berbicara
  rationale: דבר dengan ל menyatakan berbicara kepada seseorang. 'Berbicara' merupakan padanan langsung dan tetap wajar dalam ragam naratif.
- source_word: לָאִשָּׁה
  choice: kepada perempuan itu
  rationale: אִשָּׁה dapat berarti 'perempuan' atau 'istri'. Karena pada tahap ini ia belum menjadi istri Simson, 'perempuan itu' paling sesuai dan tidak menambahkan tafsiran.
- source_word: וַתִּישַׁר
  choice: dipandang baik
  rationale: Bentuk dari ישר di sini menyatakan bahwa perempuan itu baik, tepat, atau berkenan menurut penilaian Simson. 'Dipandang baik' mempertahankan nuansa evaluatif tanpa menjadikannya sekadar rasa suka.
- source_word: בְּעֵינֵי שִׁמְשׁוֹן
  choice: oleh Simson
  rationale: Unsur penilai dipadukan secara alami dengan 'dipandang baik'. Catatan kaki mempertahankan gambaran harfiah 'di mata Simson' dan kemungkinan gema tematisnya.
theological_decisions:
- issue: Kemungkinan gema tematis dengan motif dalam kitab Hakim-Hakim tentang apa yang benar atau baik di mata seseorang
  choice: Gunakan 'dipandang baik oleh Simson' dalam teks utama dan pertahankan idiom harfiahnya dalam catatan kaki
  alternative: baik di mata Simson
  rationale: Rumusan utama terdengar alami dalam bahasa Indonesia sekaligus mempertahankan penilaian subjektif Simson. Catatan kaki menjaga ungkapan Ibrani dan kemungkinan kaitan sastranya tanpa memaksakan tafsiran.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama 'Simson' mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan sesudah frasa yang dijelaskannya.
