base_translation:
  language: en
  yaml_path: translation/ot/judges/014/003.yaml
  text: But his father and his mother said to him[a], “Is there not a woman among the daughters of your brothers or among all my people, that you are going to take a wife from the uncircumcised Philistines?” But Samson said to his father, “Get her for me[b], for she is right in my eyes.”
translation:
  language: id
  text: Tetapi ayah dan ibunya berkata kepadanya, “Tidak adakah perempuan di antara anak-anak perempuan saudara-saudaramu[a] atau di antara seluruh bangsaku, sehingga engkau hendak mengambil seorang istri dari orang-orang Filistin yang tidak bersunat itu?” Simson berkata kepada ayahnya, “Ambillah dia bagiku, sebab dia benar di mataku.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “anak-anak perempuan saudara-saudaramu” kemungkinan merujuk secara luas kepada perempuan-perempuan dari kaum kerabat atau bangsanya, bukan hanya kepada anak perempuan saudara kandung Simson.
    reason: cultural_note
  - marker: b
    text: Atau, “dia menyenangkan di mataku” atau “dia tampak tepat bagiku.” Ungkapan Ibrani ini dapat menyatakan persetujuan pribadi atau ketertarikan; teks utama mempertahankan susunan yang menggemakan tema berulang dalam kitab Hakim-Hakim.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֵין
  choice: Tidak adakah
  rationale: Mempertahankan bentuk pertanyaan retoris dengan penyangkalan dan terdengar wajar dalam bahasa Indonesia.
- source_word: בִּבְנוֹת אַחֶיךָ
  choice: di antara anak-anak perempuan saudara-saudaramu
  rationale: Mempertahankan ungkapan kekerabatan Ibrani secara dekat; cakupannya yang mungkin lebih luas dijelaskan dalam catatan kaki.
- source_word: וּבְכָל עַמִּי
  choice: atau di antara seluruh bangsaku
  rationale: Mempertahankan akhiran orang pertama tunggal pada teks Ibrani, meskipun kedua orang tua disebut sebagai pembicara.
- source_word: הוֹלֵךְ לָקַחַת אִשָּׁה
  choice: engkau pergi mengambil istri
  rationale: Mencerminkan konstruksi verbal Ibrani dan makna perkawinan tanpa mengubahnya menjadi parafrasa yang terlalu bebas.
- source_word: מִפְּלִשְׁתִּים הָעֲרֵלִים
  choice: dari orang-orang Filistin yang tidak bersunat
  rationale: Mempertahankan sebutan etnis dan julukan bermuatan identitas perjanjian yang terdapat dalam tuturan Israel.
- source_word: אוֹתָהּ קַח לִי
  choice: Ambillah dia bagiku
  rationale: Mempertahankan imperatif dan peranan ayah dalam pengaturan perkawinan, dengan susunan yang tetap jelas dalam bahasa Indonesia.
- source_word: יָשְׁרָה בְעֵינַי
  choice: dia benar di mataku
  rationale: Mempertahankan ungkapan ‘di mataku’ serta gema tematis dalam kitab Hakim-Hakim tentang apa yang benar di mata seseorang.
theological_decisions:
- issue: Gema naratif יָשְׁרָה בְעֵינַי dalam kitab Hakim-Hakim
  choice: dia benar di mataku
  alternative: dia menyenangkan di mataku; dia tampak tepat bagiku
  rationale: Ungkapan itu dapat menyatakan ketertarikan atau persetujuan pribadi, tetapi terjemahan utama mempertahankan kaitannya dengan rumusan berulang tentang apa yang benar di mata seseorang tanpa menentukan penilaian moral yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “engkau” dipakai dalam dialog keluarga untuk menjaga corak naratif Alkitab tanpa menjadi arkais. Ungkapan sumber yang penting secara tematis dipertahankan, sementara kemungkinan salah paham budaya dijelaskan melalui catatan kaki.
