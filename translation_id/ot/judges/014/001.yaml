  yaml_path: translation/ot/judges/014/001.yaml
  text: Then Samson went down to Timnah[a], and at Timnah he saw a woman from the daughters of the Philistines.
translation:
  language: id
  text: Lalu Simson turun ke Timna. Di Timna ia melihat seorang perempuan, salah seorang dari perempuan Filistin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: pergi turun
  rationale: Mempertahankan arti dasar ירד, yaitu bergerak turun, serta nuansa topografis narasi Ibrani; susunan ini tetap wajar dalam bahasa Indonesia.
- source_word: שִׁמְשׁוֹן
  choice: Simson
  rationale: Menggunakan bentuk nama yang baku dan dikenal luas dalam tradisi Alkitab bahasa Indonesia.
- source_word: תִּמְנָתָה
  choice: ke Timna
  rationale: Akhiran penunjuk arah menyatakan gerak menuju tempat itu; 'ke Timna' merupakan padanan Indonesia yang alami.
- source_word: וַיַּרְא
  choice: ia melihat
  rationale: Menerjemahkan ראה secara langsung tanpa menambahkan gagasan seperti tertarik atau memperhatikan.
- source_word: אִשָּׁה
  choice: seorang perempuan
  rationale: Dalam konteks ini perempuan tersebut belum menjadi istri Simson; pilihan ini tidak mendahului perkembangan cerita.
- source_word: בְּתִמְנָתָה
  choice: Di Timna
  rationale: Preposisi ב menyatakan lokasi; 'di Timna' adalah bentuk alami dalam bahasa Indonesia.
- source_word: מִבְּנוֹת פְּלִשְׁתִּים
  choice: dari antara perempuan-perempuan Filistin
  rationale: Ungkapan harfiah 'dari anak-anak perempuan orang Filistin' berfungsi sebagai penanda kelompok etnis. Padanan ini menyampaikan maknanya secara alami tanpa memberi kesan bahwa perempuan itu adalah putri seorang tokoh tertentu.
