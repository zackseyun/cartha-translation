    rationale: Dalam bahasa Indonesia, akhiran -nya paling dekat merujuk kepada “jawabannya,” sehingga dapat terbaca sebagai “memecahkan jawabannya.” Menyebut “teka-teki itu” secara eksplisit memulihkan objek yang dimaksud.
