  source_fidelity: 'Revisi diperlukan karena “dapat memberitahukan” menambahkan nuansa kemampuan yang tidak dinyatakan oleh infinitif absolut dan verba Ibrani; konstruksi itu terutama memberi penegasan pada tindakan “memberitahukan.” Selain itu, pronomina dalam “memecahkannya” secara gramatikal mudah merujuk kepada “jawabannya,” bukan kepada teka-teki. Revisi mempertahankan urutan dua tindakan dalam teks sumber: menyatakan jawaban kepada Simson dan menemukan/memecahkan teka-teki.'
