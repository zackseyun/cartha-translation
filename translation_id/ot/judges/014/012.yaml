  to: Lalu Simson berkata kepada mereka, “Izinkanlah aku mengajukan sebuah teka-teki kepada kalian. Jika dalam tujuh hari perjamuan itu kalian benar-benar mengungkapkan jawabannya kepadaku dan memecahkan teka-teki itu[a], aku akan memberikan kepada kalian tiga puluh pakaian linen dan tiga puluh setel pakaian[b].”
