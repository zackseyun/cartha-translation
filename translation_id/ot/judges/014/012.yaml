base_translation:
  language: en
  yaml_path: translation/ot/judges/014/012.yaml
  text: And Samson said to them[a], “Please let me put a riddle to you. If you indeed tell it to me within the seven days of the feast and solve it[c][b], then I will give you thirty linen garments and thirty changes of clothes.”
translation:
  language: id
  text: Lalu Simson berkata kepada mereka, “Izinkanlah aku mengajukan sebuah teka-teki kepada kalian. Jika dalam tujuh hari perjamuan itu kalian benar-benar mengungkapkan jawabannya kepadaku dan memecahkan teka-teki itu[a], aku akan memberikan kepada kalian tiga puluh pakaian linen dan tiga puluh setel pakaian[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dan menemukannya”; maksudnya, menemukan jawaban teka-teki itu.
    reason: lexical_alternative
  - marker: b
    text: Jenis persis kedua macam pakaian ini tidak pasti. Bahasa Ibrani menyebut pakaian dari linen dan perangkat atau pakaian ganti.
    reason: cultural_note
lexical_decisions:
- source_word: אָחֽוּדָה נָּא
  choice: Izinkanlah aku mengajukan
  rationale: Bentuk kohortatif dengan נָא menyatakan usul atau permintaan yang sopan; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nuansa volitifnya.
- source_word: חִידָה
  choice: sebuah teka-teki
  rationale: Kata ini menunjuk pada teka-teki atau perkataan penuh teka-teki; dalam konteks ini, “teka-teki” adalah padanan yang paling langsung dan wajar.
- source_word: אִם הַגֵּד תַּגִּידוּ
  choice: Jika ... kalian benar-benar dapat memberitahukan jawabannya
  rationale: Infinitif absolut yang diikuti verba finit memberi penegasan. “Benar-benar” menyampaikan tekanan itu, sedangkan “jawabannya” memperjelas objek yang tersirat secara alami dalam konteks teka-teki.
- source_word: שִׁבְעַת יְמֵי הַמִּשְׁתֶּה
  choice: dalam tujuh hari perjamuan itu
  rationale: מִשְׁתֶּה adalah perjamuan atau pesta, di sini perjamuan perkawinan. “Dalam tujuh hari” menyampaikan batas waktu tantangan tanpa mempersempitnya secara berlebihan.
- source_word: וּמְצָאתֶם
  choice: dan memecahkannya
  rationale: Secara harfiah berarti “dan menemukannya”, tetapi dalam konteks teka-teki maksud idiomatisnya ialah menemukan pemecahan atau memecahkan teka-teki.
- source_word: שְׁלֹשִׁים סְדִינִים
  choice: tiga puluh pakaian linen
  rationale: סְדִינִים menunjuk pada barang sandang dari linen, tetapi bentuk persisnya tidak pasti. “Pakaian linen” akurat tanpa memberi rincian yang tidak didukung.
- source_word: שְׁלֹשִׁים חֲלִפֹת בְּגָדִים
  choice: tiga puluh setel pakaian
  rationale: Frasa ini menunjuk pada perangkat atau pakaian ganti. “Setel pakaian” terdengar alami dan menyampaikan gagasan satu perangkat pakaian.
- source_word: וְנָתַתִּי לָכֶם
  choice: aku akan memberikan kepada kalian
  rationale: Dalam susunan bersyarat ini, klausa tersebut menyatakan hasil yang akan berlaku jika syarat dipenuhi; bahasa Indonesia tidak memerlukan kata tambahan “maka” agar hubungan itu jelas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Kata ganti jamak “kalian” dipakai karena Simson berbicara kepada sekelompok orang. Susunan kalimat mempertahankan penegasan Ibrani pada keberhasilan mereka menjawab, sambil menghindari pengulangan yang kaku.
