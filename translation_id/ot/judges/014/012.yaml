  terminology: “Simson,” “teka-teki,” “perjamuan,” “pakaian linen,” dan “setel pakaian” sesuai register naratif dan makna leksikal. Catatan pakaian dipertahankan untuk menandai ketidakpastian jenis barang sandang, tanpa menentukan bentuknya secara berlebihan.
