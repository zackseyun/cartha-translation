base_translation:
  language: en
  yaml_path: translation/ot/judges/014/009.yaml
  text: He scraped it into his hands and went on[a], eating as he went. Then he went to his father and mother and gave some to them, and they ate. But he did not tell them that he had scraped the honey from the carcass of the lion.
translation:
  language: id
  text: Ia mengeruk madu itu[a] ke dalam kedua telapak tangannya, lalu berjalan sambil memakannya. Sesudah itu, ia pergi kepada ayah dan ibunya, lalu memberi mereka sebagian, dan mereka pun memakannya. Namun, ia tidak memberi tahu mereka bahwa ia telah mengeruk madu itu dari bangkai singa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengambilnya” atau “mencedoknya”; kata Ibrani yang digunakan menggambarkan tindakan mengeluarkan madu dari dalam bangkai dengan tangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְדֵּהוּ
  choice: Ia mengeruk madu itu
  rationale: Verba רדה dalam konteks ini menunjuk pada tindakan mengambil madu dari dalam bangkai dengan tangan. 'Mengeruk' mempertahankan sifat fisik dan konkret tindakan itu; objek 'madu' dibuat eksplisit dari konteks agar alami dalam bahasa Indonesia.
- source_word: אֶל כַּפָּיו
  choice: ke telapak tangannya
  rationale: כַּף secara khusus dapat berarti 'telapak tangan'. Bentuk tunggal kolektif dalam bahasa Indonesia terdengar alami dan tetap menggambarkan madu yang ditampung pada kedua telapak tangan.
- source_word: וַיֵּלֶךְ הָלוֹךְ וְאָכֹל
  choice: lalu berjalan sambil memakannya
  rationale: 'Gabungan verba finit dengan infinitif absolut menyatakan tindakan yang berlangsung terus: ia berjalan sembari makan. Rumusan ini alami dan mempertahankan aspek duratifnya.'
- source_word: וַיֵּלֶךְ אֶל אָבִיו וְאֶל אִמּוֹ
  choice: Sesudah itu, ia pergi kepada ayah dan ibunya
  rationale: הלך berarti 'pergi/berjalan'. 'Sesudah itu' menyampaikan kelanjutan urutan naratif tanpa menambahkan rincian baru.
- source_word: וַיִּתֵּן לָהֶם
  choice: lalu memberi mereka sebagian
  rationale: Objek yang tersirat ialah sebagian madu yang dibawanya. 'Sebagian' mengungkapkan makna partitif yang jelas dari konteks dan menghasilkan bahasa Indonesia yang wajar.
- source_word: וַיֹּאכֵלוּ
  choice: dan mereka pun memakannya
  rationale: Objeknya adalah madu yang baru diberikan. Pronomina '-nya' memperjelas rujukan tanpa mengubah isi.
- source_word: וְלֹא הִגִּיד לָהֶם
  choice: Namun, ia tidak memberi tahu mereka
  rationale: הגיד berarti memberitahukan atau menyatakan. 'Namun' menampilkan kontras naratif antara membagikan madu dan menyembunyikan asalnya.
- source_word: מִגְּוִיַּת הָאַרְיֵה
  choice: dari bangkai singa
  rationale: גְּוִיָּה menunjuk pada tubuh yang mati. Untuk hewan, 'bangkai' adalah padanan Indonesia yang tepat dan mempertahankan kekonkretan teks.
- source_word: רָדָה הַדְּבָשׁ
  choice: ia telah mengeruk madu itu
  rationale: Verba רדה diterjemahkan secara konsisten dengan kemunculan pertamanya. 'Telah' menandai bahwa pengambilan madu terjadi sebelum ia tidak memberitahukan asalnya.
