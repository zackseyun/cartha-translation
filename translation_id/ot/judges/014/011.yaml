  text: And when they saw him[a], they took thirty companions, and they were with him.
translation:
  language: id
  text: Ketika mereka melihatnya, mereka mengambil tiga puluh orang sebagai pendamping[a], dan orang-orang itu pun bersama dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: sahabat; mungkin secara khusus para pendamping pengantin laki-laki.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ketika ...
  rationale: Bentuk naratif ini mengantar peristiwa berikutnya. Dalam bahasa Indonesia, maknanya menyatu secara alami dengan anak kalimat waktu tanpa perlu diterjemahkan secara kaku sebagai “dan terjadilah”.
- source_word: כִּרְאוֹתָם
  choice: ketika mereka melihat
  rationale: 'Preposisi כ dengan infinitif konstruk ראה dan sufiks orang ketiga jamak menyatakan waktu: “ketika mereka melihat”.'
- source_word: אֹתוֹ
  choice: dia
  rationale: Pronomina objek ini merujuk kepada Simson.
- source_word: וַיִּקְחוּ
  choice: mereka memilih
  rationale: לקח pada dasarnya berarti “mengambil”, tetapi dalam konteks penetapan sejumlah orang sebagai pendamping, “memilih” lebih wajar dalam bahasa Indonesia dan tidak mengubah tindakan pokoknya.
- source_word: שְׁלֹשִׁים
  choice: tiga puluh orang
  rationale: Bilangan kardinal diterjemahkan langsung; kata penggolong “orang” ditambahkan agar alami karena yang dihitung adalah manusia.
- source_word: מֵרֵעִים
  choice: pendamping
  rationale: Kata ini menunjuk kepada rekan atau orang yang menyertai seseorang. “Pendamping” mempertahankan arti umum tanpa memastikan jabatan resmi dalam pesta pernikahan.
- source_word: וַיִּהְיוּ אִתּוֹ
  choice: dan mereka berada bersamanya
  rationale: Terjemahan ini mempertahankan ungkapan sederhana Ibrani, “mereka ada bersama dia”, tanpa mempersempitnya menjadi “tinggal” atau “mengawal”.
