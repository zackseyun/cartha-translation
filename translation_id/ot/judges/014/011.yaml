  register: Bahasa Indonesia baku, modern, dan lugas. Struktur kalimat mempertahankan urutan narasi Ibrani, sedangkan “memilih ... sebagai pendamping” digunakan agar tindakan tersebut alami dan mudah dipahami dalam bahasa Indonesia.
