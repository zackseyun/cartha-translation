  - severity: low
    issue: Rujukan “mereka” pada klausa terakhir kurang jelas dalam bahasa Indonesia.
    rationale: Setelah “tiga puluh orang”, pembaca lebih mudah memahami bahwa merekalah yang bersama Simson bila dirujuk sebagai “orang-orang itu”, tanpa mengubah informasi sumber.
  revised_text: Ketika mereka melihatnya, mereka mengambil tiga puluh orang sebagai pendamping[a], dan orang-orang itu pun bersama dia.
