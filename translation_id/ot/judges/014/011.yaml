  verdict: revise
  source_fidelity: 'Draf secara umum menangkap urutan dan unsur-unsur Ibrani: keterangan waktu, objek yang merujuk kepada Simson, jumlah tiga puluh, dan keberadaan mereka bersama dia. Namun, “memilih” mempersempit וַיִּקְחוּ (“mengambil”) menjadi tindakan seleksi, sedangkan konstruksi “memilih ... sebagai pendamping” juga membuat hubungan kelompok itu dengan Simson lebih eksplisit daripada ungkapan sumber.'
  naturalness: “Mereka berada bersamanya” dapat dipahami, tetapi kurang luwes dalam narasi Indonesia modern. “Orang-orang itu pun bersama dia” lebih alami sekaligus memperjelas bahwa kelompok tiga puluh itulah yang dimaksud dalam klausa terakhir.
  terminology: “Pendamping” merupakan pilihan yang baik untuk מֵרֵעִים karena tidak menetapkan mereka sebagai pengiring pengantin laki-laki. Catatan kaki yang menyebut “sahabat” dan kemungkinan konteks pernikahan patut dipertahankan.
