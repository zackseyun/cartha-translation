base_translation:
  language: en
  yaml_path: translation/ot/judges/014/019.yaml
  text: And the Spirit of Yahweh rushed upon him[a], and he went down to Ashkelon and struck down thirty men from among them, and took their spoil garments and gave the changes of clothes to those who had explained the riddle. And his anger burned, and he went up to his father's house.
translation:
  language: id
  text: Roh Yahweh datang dengan penuh kuasa atasnya. Ia turun ke Askelon dan membunuh tiga puluh orang dari antara mereka. Ia mengambil pakaian mereka sebagai jarahan[a], lalu memberikan pakaian ganti itu kepada orang-orang yang telah memberitahukan jawaban teka-teki tersebut. Amarahnya berkobar, kemudian ia naik ke rumah ayahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pakaian mereka.” Kata Ibrani ini dapat secara lebih khusus menunjuk pada pakaian yang dilucuti dari orang-orang yang dibunuh dan diambil sebagai jarahan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְלַח עָלָיו רוּחַ יְהוָה
  choice: Roh Yahweh datang dengan penuh kuasa atasnya
  rationale: Dalam kisah Hakim-Hakim, צלח dengan רוּחַ יְהוָה menggambarkan datangnya kuasa ilahi secara kuat dan mendadak. Ungkapan ini alami dalam bahasa Indonesia dan tidak menyiratkan bahwa Allah menyetujui secara moral setiap tindakan yang menyusul.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וַיֵּרֶד אַשְׁקְלוֹן
  choice: Ia turun ke Askelon
  rationale: Mempertahankan arah yang dinyatakan oleh ירד dan gaya geografis narasi.
- source_word: וַיַּךְ מֵהֶם שְׁלֹשִׁים אִישׁ
  choice: membunuh tiga puluh orang dari antara mereka
  rationale: Dalam konteks ini נכה menyatakan tindakan mematikan; מֵהֶם dipertahankan dengan frasa partitif 'dari antara mereka'.
- source_word: חֲלִיצוֹתָם
  choice: pakaian mereka sebagai jarahan
  rationale: Kata ini dapat menunjuk pada pakaian atau perlengkapan yang dilucuti dari orang yang telah dibunuh. Teks utama menyampaikan konteks jarahan, sedangkan kemungkinan terjemahan yang lebih umum dicatat dalam catatan kaki.
- source_word: הַחֲלִיפוֹת
  choice: pakaian ganti
  rationale: Dalam konteks taruhan teka-teki, istilah ini menunjuk pada perangkat atau setel pakaian pengganti.
- source_word: לְמַגִּידֵי הַחִידָה
  choice: kepada orang-orang yang telah memberitahukan jawaban teka-teki tersebut
  rationale: Bentuk partisipel dari נגד menunjuk kepada mereka yang menyatakan atau memberitahukan jawaban teka-teki; pilihan ini tidak menyiratkan bahwa mereka menemukannya sendiri.
- source_word: וַיִּחַר אַפּוֹ
  choice: Amarahnya berkobar
  rationale: Mempertahankan metafora Ibrani tentang amarah yang menyala dalam ungkapan Indonesia yang wajar.
- source_word: וַיַּעַל בֵּית אָבִיהוּ
  choice: ia pulang ke rumah ayahnya
  rationale: עלה secara harfiah berarti 'naik', tetapi dalam konteks ini gerak kembali ke rumah ayahnya lebih alami dinyatakan sebagai 'pulang' dalam bahasa Indonesia; unsur arah tidak menentukan makna adegan.
theological_decisions:
- issue: Bahasa tentang pemberdayaan oleh Roh Yahweh
  choice: Roh Yahweh datang dengan penuh kuasa atasnya
  alternative: Roh Yahweh menyergapnya; Roh Yahweh berkuasa atasnya
  rationale: Terjemahan menyatakan tindakan langsung dan kuat dari Roh Yahweh, tetapi tidak menambahkan penilaian bahwa Allah menyetujui secara moral seluruh tindakan Simson. Ketegangan naratif tetap dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kalimat panjang sumber dibagi agar mudah dipahami, sementara urutan tindakan dan hubungan antarklausa tetap dipertahankan.
