  source_fidelity: Terjemahan pada umumnya setia pada urutan dan makna teks Ibrani. “Roh Yahweh datang dengan penuh kuasa atasnya,” pembunuhan tiga puluh orang, pengambilan pakaian sebagai jarahan, pemberian pakaian ganti, dan amarah Simson tersampaikan dengan baik. Namun, וַיַּעַל secara eksplisit berarti “ia naik”; “ia pulang” menambahkan nuansa kembali ke rumah yang tersirat oleh konteks tetapi tidak dinyatakan oleh verba itu sendiri.
  naturalness: Bahasa Indonesia baku, lugas, dan mudah dipahami. “Ia naik ke rumah ayahnya” tetap alami dalam gaya naratif Alkitab dan lebih dekat dengan arah gerak dalam teks sumber.
  terminology: “Yahweh,” “Roh Yahweh,” “pakaian ganti,” dan “amarahnya berkobar” konsisten serta tepat registernya. “Pakaian mereka sebagai jarahan” merupakan pilihan yang dapat dipertahankan untuk חֲלִיצוֹתָם; catatan kaki dengan tepat mencatat kemungkinan yang lebih umum.
