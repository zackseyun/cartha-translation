  text: וַ/יְהִ֣י בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י וַ/יֹּאמְר֤וּ לְ/אֵֽשֶׁת שִׁמְשׁוֹן֙ פַּתִּ֣י אֶת אִישֵׁ֗/ךְ וְ/יַגֶּד לָ֨/נוּ֙ אֶת הַ֣/חִידָ֔ה פֶּן נִשְׂרֹ֥ף אוֹתָ֛/ךְ וְ/אֶת בֵּ֥ית אָבִ֖י/ךְ בָּ/אֵ֑שׁ הַ/לְ/יָרְשֵׁ֕/נוּ קְרָאתֶ֥ם לָ֖/נוּ הֲ/לֹֽא׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/015.yaml
  text: And on the seventh day they said to Samson’s wife[a], “Entice your husband so that he may tell us the riddle, lest we burn you and your father’s household with fire[b]. Did you invite us to dispossess us? Is that not so?”
translation:
  language: id
  text: Pada hari ketujuh, mereka berkata kepada istri Simson, “Bujuklah suamimu agar ia mengungkapkan teka-teki itu kepada kami. Kalau tidak, kami akan membakar engkau dan seisi rumah ayahmu dengan api.[a] Apakah kalian mengundang kami untuk merampas milik kami?[b] Bukankah begitu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rumah ayahmu.” Ungkapan Ibrani ini dapat berarti bangunan rumah atau, secara lebih luas, rumah tangga dan keluarga sang ayah.
    reason: lexical_alternative
  - marker: b
    text: Atau “membuat kami jatuh miskin” atau “mengambil alih kepunyaan kami.” Verba Ibrani ini dapat berarti merampas atau mengambil sesuatu menjadi milik sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: Pada hari ketujuh
  rationale: Padanan temporal yang langsung, wajar, dan setia pada teks Ibrani.
- source_word: פַּתִּי
  choice: Bujuklah
  rationale: Bentuk imperatif Piel ini mengandung gagasan membujuk atau merayu dengan maksud manipulatif. “Bujuklah” alami dalam bahasa Indonesia dan mempertahankan tekanan tersebut.
- source_word: אֶת־אִישֵׁךְ
  choice: suamimu
  rationale: Dalam konteks perempuan yang telah menikah, אִישׁ secara idiomatis menunjuk kepada suaminya.
- source_word: וְיַגֶּד לָנוּ אֶת־הַחִידָה
  choice: supaya ia memberi tahu kami jawaban teka-teki itu
  rationale: Rangkaian konjungsi dan bentuk verba menyatakan tujuan. Dalam konteks taruhan, yang diminta bukan pengulangan teka-teki, melainkan pemberitahuan jawabannya; padanan ini membuat maksud kontekstual jelas tanpa mengubah tindakan dasarnya.
- source_word: פֶּן נִשְׂרֹף אוֹתָךְ וְאֶת־בֵּית אָבִיךְ בָּאֵשׁ
  choice: Kalau tidak, kami akan membakar engkau dan seisi rumah ayahmu dengan api
  rationale: פֶּן memperkenalkan akibat mengancam. “Kalau tidak” menyampaikan ancaman itu secara alami, sedangkan “dengan api” mempertahankan ungkapan eksplisit dalam bahasa Ibrani.
- source_word: בֵּית אָבִיךְ
  choice: seisi rumah ayahmu
  rationale: Ungkapan Ibrani dapat menunjuk kepada rumah secara fisik ataupun rumah tangga/keluarga. “Seisi rumah ayahmu” sesuai dengan ancaman terhadap orang-orang dalam lingkup keluarga sekaligus mempertahankan citra rumah.
- source_word: הֲלְיָרְשֵׁנוּ
  choice: untuk merampas milik kami
  rationale: Verba ירשׁ di sini dapat berarti mengambil alih milik atau merampas kepunyaan seseorang. Pilihan ini alami dalam konteks kerugian akibat taruhan dan tidak membatasi maknanya pada pengambilalihan tanah.
- source_word: קְרָאתֶם לָנוּ
  choice: Apakah kalian mengundang kami
  rationale: קרא dengan ל dalam konteks perjamuan berarti memanggil atau mengundang. Pronomina “kalian” mempertahankan bentuk jamak dalam bahasa Ibrani.
- source_word: הֲלֹא
  choice: Bukankah begitu?
  rationale: Partikel ini membentuk pertanyaan retoris yang mengharapkan persetujuan dan bernada menuduh.
