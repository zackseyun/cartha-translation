  text: וְ/אִם לֹ֣א תוּכְלוּ֮ לְ/הַגִּ֣יד לִ/י֒ וּ/נְתַתֶּ֨ם אַתֶּ֥ם לִ/י֙ שְׁלֹשִׁ֣ים סְדִינִ֔ים וּ/שְׁלֹשִׁ֖ים חֲלִיפ֣וֹת בְּגָדִ֑ים וַ/יֹּ֣אמְרוּ ל֔/וֹ ח֥וּדָ/ה חִידָתְ/ךָ֖ וְ/נִשְׁמָעֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/014/013.yaml
  text: But if you cannot tell me[a], then you must give me thirty linen garments and thirty changes of clothes.” And they said to him, “Tell your riddle, and let us hear it.”
translation:
  language: id
  text: Tetapi jika kalian tidak dapat memberitahukannya kepadaku, kalian harus memberikan kepadaku tiga puluh pakaian linen[a] dan tiga puluh pakaian ganti.” Mereka berkata kepadanya, “Sampaikanlah teka-tekimu, supaya kami mendengarnya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tiga puluh helai kain linen”; istilah Ibraninya dapat menunjuk barang dari linen halus, tetapi di sini kemungkinan besar berarti barang yang dikenakan, sejajar dengan “pakaian ganti”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תוּכְלוּ
  choice: kalian tidak dapat
  rationale: Bentuk dari יכל menyatakan kemampuan; dalam syarat ini, frasa tersebut secara alami menyampaikan ketidakmampuan, bukan ketidakmauan.
- source_word: לְהַגִּיד לִי
  choice: memberitahukannya kepadaku
  rationale: Hifil נגד berarti 'memberitahukan/menyatakan'. Pronomina '-nya' mengacu secara kontekstual pada jawaban teka-teki dari ayat sebelumnya.
- source_word: וּנְתַתֶּם אַתֶּם לִי
  choice: kalian harus memberikan kepadaku
  rationale: Waw dengan bentuk perfektif menyatakan konsekuensi yang mengikat dalam taruhan; 'harus' mempertahankan daya kewajibannya dalam bahasa Indonesia alami.
- source_word: סְדִינִים
  choice: pakaian linen
  rationale: Istilah ini dapat menunjuk kain atau barang sandang linen halus. Dalam konteks hadiah berupa sandang dan paralelnya dengan pakaian ganti, 'pakaian linen' paling sesuai, sementara alternatif leksikal dicatat.
- source_word: חֲלִיפוֹת בְּגָדִים
  choice: pakaian ganti
  rationale: Ungkapan ini menunjuk seperangkat pakaian pengganti; 'pakaian ganti' ringkas, alami, dan jelas dalam bahasa Indonesia.
- source_word: חוּדָה
  choice: Sampaikanlah
  rationale: Imperatif חוד digunakan untuk mengemukakan teka-teki. 'Sampaikanlah teka-tekimu' terdengar alami dan mempertahankan tindakan mengajukan teka-teki.
- source_word: חִידָתְךָ
  choice: teka-tekimu
  rationale: Padanan modern dan tepat untuk חידה dalam konteks ini.
- source_word: וְנִשְׁמָעֶנָּה
  choice: supaya kami mendengarnya
  rationale: Bentuk kohortatif jamak pertama dengan sufiks feminin tunggal mengacu kepada teka-teki; susunan ini mempertahankan nuansa ajakan/kehendak secara alami.
