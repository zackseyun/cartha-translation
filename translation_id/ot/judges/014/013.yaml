  source_fidelity: 'Terjemahan dengan tepat mempertahankan struktur syarat dan kewajiban taruhan: ketidakmampuan untuk memberi tahu jawabannya berakibat pemberian tiga puluh סְדִינִים dan tiga puluh חֲלִיפוֹת בְּגָדִים. Objek tersirat pada “memberitahukannya kepadaku” sah secara kontekstual, sebab yang dimaksud ialah jawaban teka-teki. Kalimat terakhir secara memadai menyampaikan imperatif untuk mengajukan teka-teki serta kohortatif “biarlah/kami hendak mendengarnya.”'
