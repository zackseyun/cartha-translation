base_translation:
  language: en
  yaml_path: translation/ot/judges/014/016.yaml
  text: Then Samson’s wife wept before him and said[a], “You only hate me; you do not love me. You have posed the riddle to the sons of my people, but you have not told me.” And he said to her, “Look, I have not told my father or my mother, so should I tell you?”
translation:
  language: id
  text: Lalu istri Simson menangis di hadapannya dan berkata, “Kamu hanya membenciku; kamu tidak mencintaiku. Kamu mengajukan teka-teki itu kepada para lelaki bangsaku[a], tetapi tidak memberitahukannya kepadaku.” Jawab Simson kepadanya, “Lihat, kepada ayah dan ibuku saja aku tidak memberitahukannya; masakan kepadamu aku akan memberitahukannya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “kepada anak-anak laki-laki bangsaku.” Bentuk Ibraninya maskulin dan dalam konteks ini kemungkinan menunjuk kepada para lelaki dari bangsanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּבְךְּ ... עָלָיו
  choice: menangis di hadapannya
  rationale: בכה berarti ‘menangis’, sedangkan עַל dengan orang yang menjadi sasaran tangisan di sini menunjukkan bahwa ia menangis di hadapan Simson sebagai tekanan emosional. Pilihan ini menghindari ‘menangisinya’, yang dalam bahasa Indonesia lazim menyiratkan perkabungan.
- source_word: אֵשֶׁת שִׁמְשׁוֹן
  choice: istri Simson
  rationale: Frasa konstruksi ini secara langsung menyatakan hubungan perkawinan; bentuk ini alami dan ringkas dalam bahasa Indonesia.
- source_word: רַק שְׂנֵאתַנִי וְלֹא אֲהַבְתָּנִי
  choice: Kamu hanya membenciku; kamu tidak mencintaiku
  rationale: רַק memberi tekanan pada tuduhan, sementara pasangan ‘membenci’ dan ‘mencintai’ dipertahankan untuk menjaga kontras emosional dalam ucapan perempuan itu.
- source_word: הַחִידָה חַדְתָּ
  choice: Kamu mengajukan teka-teki itu
  rationale: חִידָה berarti ‘teka-teki’, dan חוד dalam konteks ini berarti mengemukakan atau mengajukan teka-teki.
- source_word: לִבְנֵי עַמִּי
  choice: kepada orang-orang sebangsaku[a]
  rationale: Secara harfiah ungkapan ini berbentuk maskulin, ‘anak-anak laki-laki bangsaku’, tetapi dalam konteks menunjuk kepada para lelaki dari bangsanya. ‘Orang-orang sebangsaku’ merupakan ungkapan Indonesia yang alami, sedangkan rincian bentuk Ibraninya dipertahankan dalam catatan kaki.
- source_word: וְלִי לֹא הִגַּדְתָּה
  choice: tetapi tidak memberitahukannya kepadaku
  rationale: Hifil נגד berarti ‘memberi tahu, menyatakan, membuat diketahui’. Pronomina ‘-nya’ mempertahankan ketidaktersuratan objek dalam bahasa Ibrani, yang dalam konteks kemungkinan besar adalah jawaban teka-teki.
- source_word: הִנֵּה
  choice: Lihat
  rationale: הִנֵּה menarik perhatian dan memberi penekanan. ‘Lihat’ mempertahankan fungsi wacananya tanpa memakai ragam arkais.
- source_word: לְאָבִי וּלְאִמִּי לֹא הִגַּדְתִּי
  choice: kepada ayah dan ibuku saja aku tidak memberitahukannya
  rationale: Kedua orang tua disebut secara eksplisit. Partikel ‘saja’ menolong menyampaikan tekanan argumen dalam dialog Indonesia tanpa mengubah acuannya.
- source_word: וְלָךְ אַגִּיד
  choice: masakan kepadamu aku akan memberitahukannya?
  rationale: Bentuk imperfek berfungsi sebagai pertanyaan retoris. ‘Masakan’ secara alami menyampaikan daya retoris tersebut dan mempertahankan perbandingan tersirat dengan ayah serta ibunya.
