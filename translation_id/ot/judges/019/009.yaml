translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan kalimat dibuat alami tanpa menghapus citra 'hati' dalam bahasa Ibrani. Perbedaan jumlah yang tidak dapat ditandai pada imperatif bahasa Indonesia dijelaskan melalui 'kalian' dan catatan kaki.
