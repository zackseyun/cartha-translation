base_translation:
  language: en
  yaml_path: translation/ot/judges/019/009.yaml
  text: When the man rose to leave with his concubine and his attendant, his father-in-law, the young woman’s father, said to him, “Look, the day is waning toward evening. Please stay the night. Look, the day is nearly over[a]. Spend the night here and let your heart be glad. Then rise early tomorrow for your journey[b], and go home[c].”
translation:
  language: id
  text: Ketika laki-laki itu bangkit untuk pergi bersama gundik dan pelayannya, mertuanya, yaitu ayah perempuan muda itu, berkata kepadanya, “Lihat, hari mulai surut menjelang petang. Tolong, bermalamlah. Lihat, hari hampir berakhir[a]. Bermalamlah di sini dan biarlah hatimu bersukacita. Besok bangunlah pagi-pagi untuk perjalanan kalian[b], lalu pulanglah[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “hari sedang berkemah,” suatu gambaran tentang hari yang mulai menetap atau segera berakhir.
    reason: source_image
  - marker: b
    text: Kata “bangunlah pagi-pagi” dalam bahasa Ibrani berbentuk jamak dan ditujukan kepada rombongan yang bepergian, sedangkan “pulanglah” berikutnya berbentuk tunggal dan ditujukan kepada laki-laki itu.
    reason: grammar
  - marker: c
    text: Secara harfiah, “pergilah ke kemahmu,” sebuah ungkapan yang dalam konteks ini berarti pulang ke rumah.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: laki-laki itu
  rationale: Istilah אִישׁ berarti laki-laki atau orang laki-laki. Pilihan ini mempertahankan gaya naratif tanpa menambahkan sebutan relasional yang tidak dipakai dalam ayat ini.
- source_word: פִילַגְשׁוֹ
  choice: gundiknya
  rationale: פִילֶגֶשׁ menunjuk pada gundik sebagai kategori sosial dalam kisah ini; pilihan ini tidak melunakkannya menjadi sekadar 'istri'.
- source_word: נַעֲרוֹ
  choice: pelayannya
  rationale: Dalam konteks perjalanan ini נַעַר berfungsi sebagai pelayan atau pengiring; usia orang tersebut bukan pokok pernyataannya.
- source_word: חֹתְנוֹ
  choice: mertuanya
  rationale: Konteks dan keterangan berikutnya, 'ayah perempuan muda itu', memastikan bahwa yang dimaksud ialah mertua laki-laki tersebut.
- source_word: אֲבִי הַנַּעֲרָה
  choice: ayah perempuan muda itu
  rationale: נַעֲרָה berarti perempuan muda. Ungkapan ini alami dalam bahasa Indonesia dan tidak mengecilkan tokoh itu sebagai anak kecil.
- source_word: רָפָה הַיּוֹם לַעֲרֹב
  choice: hari mulai surut menjelang petang
  rationale: Ungkapan itu menggambarkan kekuatan atau terang hari yang melemah ketika petang mendekat. 'Mulai surut' mempertahankan citranya dalam bahasa Indonesia yang wajar.
- source_word: לִינוּ נָא
  choice: Tolong, bermalamlah
  rationale: לון berarti bermalam atau menginap, sedangkan נָא memberi nada permohonan; 'tolong' menyampaikan desakan ramah tersebut secara modern.
- source_word: חֲנוֹת הַיּוֹם
  choice: hari hampir berakhir
  rationale: Secara harfiah frasa yang tidak biasa ini menggambarkan hari sedang 'berkemah' atau menetap. Teks utama menyampaikan maksud waktunya, sementara citra sumber dicatat dalam catatan kaki.
- source_word: וְיִיטַב לְבָבֶךָ
  choice: biarlah hatimu bersukacita
  rationale: Pilihan ini mempertahankan gambaran Ibrani tentang hati dan menyampaikan keadaan batin yang senang atau riang tanpa meratakannya menjadi sekadar merasa nyaman.
- source_word: וְהִשְׁכַּמְתֶּם מָחָר
  choice: Besok bangunlah pagi-pagi
  rationale: Bentuk Ibraninya jamak dan ditujukan kepada rombongan. Karena imperatif Indonesia tidak menandai jumlah, kata 'kalian' pada frasa perjalanan berikutnya memperjelas cakupan jamak tersebut.
- source_word: וְהָלַכְתָּ לְאֹהָלֶךָ
  choice: lalu pulanglah
  rationale: Secara harfiah berarti 'pergilah ke kemahmu', tetapi dalam konteks ini merupakan ungkapan konvensional untuk kembali ke rumah. Terjemahan utama menghindari kesan keliru bahwa tujuannya sebuah kemah harfiah.
