base_translation:
  language: en
  yaml_path: translation/ot/judges/019/028.yaml
  text: He said to her[a], “Get up, and let us go.” But there was no answer. Then he put her on the donkey[c][b], and the man rose and went to his place.
translation:
  language: id
  text: Lalu ia berkata kepada perempuan itu, “Bangunlah, mari kita pergi.” Namun, tidak ada jawaban.[a] Kemudian ia menaikkan perempuan itu ke atas keledai,[b] lalu laki-laki itu bangkit dan pergi ke tempatnya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “tidak ada yang menjawab.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “ia mengambil perempuan itu ke atas keledai.” Kata kerja Ibrani secara harfiah berarti “mengambil”; dalam konteks ini kata itu dapat berarti menempatkan atau menaikkannya ke atas hewan.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “pergi ke rumahnya.” Secara harfiah: “ke tempatnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  choice: Lalu ia berkata kepada perempuan itu
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. “Lalu” menyatakan urutan secara alami, sedangkan pronomina feminin diterjemahkan dengan “perempuan itu” agar rujukannya jelas dalam bahasa Indonesia.
- source_word: קוּמִי
  choice: Bangunlah
  rationale: Imperatif feminin tunggal dari קום. “Bangunlah” merupakan perintah langsung yang alami dan bermartabat dalam bahasa Indonesia modern.
- source_word: וְנֵלֵכָה
  choice: mari kita pergi
  rationale: Bentuk kohortatif orang pertama jamak menyatakan ajakan atau tekad bersama; “mari kita pergi” mempertahankan nuansa volitif itu.
- source_word: וְאֵין עֹנֶה
  choice: Namun, tidak ada jawaban
  rationale: Ungkapan Ibrani secara harfiah berarti tidak ada yang menjawab. “Namun” memperlihatkan pertentangan kontekstual dengan perintah sebelumnya tanpa menyatakan secara eksplisit keadaan perempuan itu.
- source_word: וַיִּקָּחֶהָ עַל הַחֲמוֹר
  choice: Kemudian ia mengangkat perempuan itu ke atas keledai
  rationale: לקח pada dasarnya berarti “mengambil”, tetapi bersama עַל הַחֲמוֹר konteksnya menunjukkan tindakan mengangkat atau menaikkan perempuan itu ke atas hewan. Pilihan ini jelas dalam bahasa Indonesia tanpa menambahkan kesimpulan tentang kondisinya.
- source_word: וַיָּקָם הָאִישׁ
  choice: lalu laki-laki itu bangkit
  rationale: “Bangkit” mempertahankan tindakan קום sebagai tahap tersendiri sebelum tindakan pergi, dan tidak meleburkannya menjadi “berangkat”.
- source_word: וַיֵּלֶךְ לִמְקֹמוֹ
  choice: dan pergi ke tempatnya
  rationale: מקום berarti “tempat”. Dalam konteks, yang dimaksud mungkin rumah atau daerah kediamannya, tetapi “tempatnya” mempertahankan keluasan makna teks sumber.
theological_decisions:
- issue: Keadaan perempuan ketika tidak menjawab
  choice: Tidak menyatakan apakah ia sudah meninggal atau masih hidup
  alternative: Menjelaskan bahwa ia sudah mati atau tidak sadarkan diri
  rationale: Ayat ini hanya mengatakan bahwa tidak ada jawaban. Terjemahan mempertahankan ketegangan naratif dan tidak mendahului informasi atau penafsiran dari konteks selanjutnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur naratif berurutan dipertahankan dengan “lalu” dan “kemudian”. Terjemahan tidak memperhalus kekerasan konteks ataupun memastikan keadaan perempuan yang dibiarkan ambigu oleh ayat ini.
