  yaml_path: translation/ot/judges/019/010.yaml
  text: But the man was not willing to spend the night. He rose and went and came opposite Jebus (that is[a], Jerusalem), and with him were a pair of saddled donkeys and his concubine.
translation:
  language: id
  text: Namun, orang itu tidak bersedia bermalam. Ia bangkit, pergi, dan tiba di hadapan Yebus[a] (yaitu Yerusalem). Bersamanya ada sepasang keledai berpelana dan gundiknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di sekitar Yebus” atau “di suatu tempat yang berhadapan dengan Yebus”. Ungkapan Ibrani menunjukkan lokasi di hadapan atau berseberangan dengan kota itu, bukan dengan jelas di dalamnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבָה
  choice: tidak bersedia
  rationale: Kata kerja ini menyatakan kemauan atau persetujuan; bentuk negatifnya menunjukkan bahwa ia memilih untuk tidak bermalam.
- source_word: לָלוּן
  choice: bermalam
  rationale: Infinitif ini secara khusus berarti tinggal melewati malam; 'bermalam' alami dan ringkas dalam bahasa Indonesia.
- source_word: וַיָּקָם וַיֵּלֶךְ וַיָּבֹא
  choice: Ia bangkit, pergi, dan tiba
  rationale: Tiga tindakan berurutan dipertahankan untuk mencerminkan gerak dan irama narasi Ibrani.
- source_word: עַד נֹכַח
  choice: tiba di seberang
  rationale: Ungkapan ini menunjuk pada posisi di hadapan atau berhadapan dengan kota, tanpa memastikan bahwa rombongan sudah masuk ke dalamnya.
- source_word: יְבוּס הִיא יְרוּשָׁלָם
  choice: Yebus (yaitu Yerusalem)
  rationale: Keterangan aposisional mengidentifikasi nama lama Yebus sebagai Yerusalem.
- source_word: צֶמֶד חֲמוֹרִים
  choice: sepasang keledai
  rationale: צֶמֶד ketika dipakai untuk hewan menunjukkan satu pasang.
- source_word: חֲבוּשִׁים
  choice: berpelana
  rationale: Dalam konteks perjalanan, partisip pasif ini paling wajar menunjuk pada keledai yang telah diperlengkapi atau dipasangi pelana.
- source_word: פִּילַגְשׁוֹ
  choice: gundiknya
  rationale: '''Gundik'' mempertahankan istilah khusus bagi perempuan berstatus pasangan sekunder, tanpa mengubahnya menjadi kategori perkawinan yang lebih tegas.'
