source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לְ/נַעֲר֔/וֹ לְךָ֥ וְ/נִקְרְבָ֖ה בְּ/אַחַ֣ד הַ/מְּקֹמ֑וֹת וְ/לַ֥נּוּ בַ/גִּבְעָ֖ה א֥וֹ בָ/רָמָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/013.yaml
  text: He said to his young man[a], “Come, and let us draw near to one of these places[b], and spend the night in Gibeah or in Ramah.”
translation:
  language: id
  text: Ia berkata kepada pelayannya[a], “Mari, kita mendekati salah satu tempat ini dan bermalam di Gibea atau Rama.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “pelayannya” juga dapat berarti “pemudanya” atau “pendampingnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְנַעֲרוֹ
  choice: kepada pelayannya
  rationale: נַעַר dapat berarti pemuda, pelayan, atau pendamping. Dalam konteks perjalanan ini, orang tersebut melayani dan menyertai orang Lewi itu; “pelayannya” paling alami dalam bahasa Indonesia tanpa menentukan usia secara berlebihan.
- source_word: לְךָ
  choice: Mari
  rationale: Secara leksikal bentuk imperatif הלך berarti “pergilah,” tetapi bersama kohortatif berikutnya kata ini mengajak pendengar bergerak bersama; “Mari” menyampaikan fungsi ajakan itu secara alami.
- source_word: וְנִקְרְבָה
  choice: kita mendekati
  rationale: Bentuk kohortatif menyatakan ajakan atau tekad bersama, sedangkan קרב mempertahankan nuansa bergerak mendekat.
- source_word: בְּאַחַד הַמְּקֹמוֹת
  choice: salah satu tempat ini
  rationale: Ungkapan ini menunjuk kepada salah satu tempat terdekat yang sedang dipertimbangkan, yang langsung diperinci sebagai Gibea atau Rama.
- source_word: וְלַנּוּ
  choice: dan bermalam
  rationale: Kata לון berarti menginap atau melewatkan malam; “bermalam” ringkas, jelas, dan wajar dalam bahasa Indonesia modern.
- source_word: בַגִּבְעָה
  choice: di Gibea
  rationale: Nama tempat ditransliterasikan sebagai “Gibea”; preposisi “di” alami untuk bermalam dalam sebuah kota.
- source_word: בָרָמָה
  choice: di Rama
  rationale: Nama tempat ditransliterasikan sebagai “Rama,” sejajar dengan Gibea; preposisi “di” dipahami dari konstruksi sebelumnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Ajakan “Mari, kita…” dipilih agar gerak bersama yang dinyatakan oleh imperatif dan kohortatif terdengar alami. Penanda catatan kaki [a] ditempatkan langsung setelah kata yang diterangkan.
