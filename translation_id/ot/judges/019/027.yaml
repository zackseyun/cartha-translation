base_translation:
  language: en
  yaml_path: translation/ot/judges/019/027.yaml
  text: Her master got up in the morning and opened the doors of the house and went out to go on his way[a], and behold, the woman, his concubine, was lying at the entrance of the house, with her hands on the threshold.
translation:
  language: id
  text: Pada pagi hari, tuannya bangun, membuka pintu-pintu rumah itu, lalu keluar untuk meneruskan perjalanannya. Ternyata, perempuan itu, yakni gundiknya, terbaring[a] di pintu masuk rumah itu dengan kedua tangannya di atas ambang pintu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “jatuh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנֶיהָ
  choice: tuannya
  rationale: Mempertahankan arti ‘tuan’ dan relasi sosial yang tidak setara dalam bahasa Ibrani, tanpa menggantinya dengan ‘suaminya’, yang akan mempersempit makna.
- source_word: בַּבֹּקֶר
  choice: pada pagi hari
  rationale: Ungkapan waktu yang wajar dan jelas dalam bahasa Indonesia modern.
- source_word: דַּלְתוֹת הַבַּיִת
  choice: pintu-pintu rumah itu
  rationale: Bentuk jamak דַּלְתוֹת dipertahankan, demikian pula gambaran konkret tentang rumah tersebut.
- source_word: וַיֵּצֵא לָלֶכֶת לְדַרְכּוֹ
  choice: lalu keluar untuk meneruskan perjalanannya
  rationale: Menyampaikan konstruksi tujuan dan idiom ‘pergi menempuh jalannya’ secara alami dalam bahasa Indonesia.
- source_word: וְהִנֵּה
  choice: ternyata
  rationale: Menandai penemuan yang mendadak dan mengejutkan secara alami, tanpa mengubahnya menjadi pernyataan eksplisit bahwa laki-laki itu melihat.
- source_word: הָאִשָּׁה פִילַגְשׁוֹ
  choice: perempuan itu, yakni gundiknya
  rationale: Mempertahankan susunan aposisional teks Ibrani; ‘gundik’ merupakan padanan baku dan tepat bagi פִילֶגֶשׁ.
- source_word: נֹפֶלֶת
  choice: terbaring
  rationale: Partisip ini secara harfiah berkaitan dengan keadaan jatuh, tetapi dalam konteks menggambarkan posisi perempuan itu. ‘Terbaring’ menyampaikan keadaan tersebut tanpa memastikan bagaimana ia sampai pada posisi itu; arti yang lebih harfiah dicatat dalam catatan kaki.
- source_word: פֶּתַח הַבַּיִת
  choice: di pintu masuk rumah itu
  rationale: Menyampaikan arti bukaan atau jalan masuk rumah dengan jelas dalam bahasa Indonesia.
- source_word: וְיָדֶיהָ עַל הַסַּף
  choice: dengan kedua tangannya di atas ambang pintu
  rationale: Mengalihkan klausa nominal Ibrani ke konstruksi Indonesia yang alami sambil mempertahankan gambaran yang hidup; bentuk jamak ‘tangan-tangannya’ dinyatakan secara idiomatis sebagai ‘kedua tangannya’.
