translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Bentuk jamak ‘pintu-pintu’ serta sebutan ‘tuannya’ dipertahankan demi kedekatan dengan teks Ibrani, sedangkan susunan kalimat dibuat alami bagi pembaca umum.
