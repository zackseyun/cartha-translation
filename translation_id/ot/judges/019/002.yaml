  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תִּזְנֶ֤ה עָלָי/ו֙ פִּֽילַגְשׁ֔/וֹ וַ/תֵּ֤לֶךְ מֵֽ/אִתּ/וֹ֙ אֶל בֵּ֣ית אָבִ֔י/הָ אֶל בֵּ֥ית לֶ֖חֶם יְהוּדָ֑ה וַ/תְּהִי שָׁ֕ם יָמִ֖ים אַרְבָּעָ֥ה חֳדָשִֽׁים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/002.yaml
  text: But his concubine was unfaithful to him[a], and she went away from him to her father's house, to Bethlehem in Judah, and was there for four months.
translation:
  language: id
  text: Namun, gundiknya tidak setia kepadanya[a]. Perempuan itu pergi meninggalkannya dan pulang ke rumah ayahnya di Betlehem, wilayah Yehuda. Ia tinggal di sana selama empat bulan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “berlaku seperti pelacur terhadapnya.” Beberapa penafsir kuno memahami klausa ini secara berbeda, misalnya “menjadi marah kepadanya” atau “bertengkar dengannya.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּזְנֶה עָלָיו
  choice: tidak setia kepadanya
  rationale: Bentuk verba זנה dalam teks Masoret lazimnya menyatakan ketidaksetiaan seksual. Ungkapan ini menyampaikan makna yang paling mungkin secara alami tanpa mempersempitnya menjadi pelacuran komersial.
- source_word: פִּילַגְשׁוֹ
  choice: gundiknya
  rationale: “Gundik” merupakan padanan Indonesia yang ringkas dan lazim untuk פילגש, yaitu perempuan dalam ikatan perkawinan atau seksual yang statusnya lebih rendah daripada istri utama.
- source_word: וַתֵּלֶךְ מֵאִתּוֹ
  choice: pergi meninggalkannya
  rationale: Pilihan ini mempertahankan unsur gerak pada הלך sekaligus unsur perpisahan pada מֵאִתּוֹ, dan terdengar alami dalam narasi Indonesia.
- source_word: אֶל בֵּית אָבִיהָ
  choice: pulang ke rumah ayahnya
  rationale: “Ke rumah ayahnya” menerjemahkan frasa secara langsung, sedangkan “pulang” secara alami menyatakan gerak kembali ke rumah keluarga asal yang tersirat oleh konteks.
- source_word: אֶל בֵּית לֶחֶם יְהוּדָה
  choice: di Betlehem, wilayah Yehuda
  rationale: Padanan ini mengidentifikasi kota tersebut sebagai Betlehem yang terletak di Yehuda dan membedakannya dari tempat lain dengan nama serupa.
- source_word: וַתְּהִי שָׁם
  choice: Ia tinggal di sana
  rationale: Dalam konteks durasi, “tinggal di sana” merupakan ungkapan Indonesia yang lebih wajar daripada terjemahan harfiah “berada di sana”.
- source_word: יָמִים אַרְבָּעָה חֳדָשִׁים
  choice: selama empat bulan
  rationale: Ungkapan Ibrani yang secara harfiah memuat “hari-hari, empat bulan” menyatakan jangka waktu empat bulan; padanan ini jelas dan setia pada maksudnya.
theological_decisions:
- issue: Penafsiran וַתִּזְנֶה dalam narasi yang mengandung tuduhan moral
  choice: ketidaksetiaan seksual (“tidak setia kepadanya”)
  alternative: “berlaku seperti pelacur terhadapnya”; menurut tradisi penafsiran kuno tertentu, “menjadi marah kepadanya” atau “bertengkar dengannya”
  rationale: Vokalisasi Masoret dan arti normal זנה mendukung ketidaksetiaan seksual. Karena sejumlah penafsir atau versi kuno memahami klausa ini secara berbeda dan kurang menuduh, alternatif tersebut dicatat dalam catatan kaki agar ketegangan tekstual dan penafsiran tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kalimat panjang sumber dibagi agar mudah dipahami. Penanda catatan kaki [a] ditempatkan langsung setelah klausa yang diterangkannya.
