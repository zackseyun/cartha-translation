base_translation:
  language: en
  yaml_path: translation/ot/judges/019/020.yaml
  text: The old man said[a], “Peace be to you. Only let all your needs be my responsibility; only do not spend the night in the open square.”
translation:
  language: id
  text: Laki-laki tua itu berkata, “Damai sejahtera bagimu! Biarlah aku saja yang menanggung segala kebutuhanmu. Hanya saja, jangan bermalam di lapangan umum kota[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di jalan.” Istilah Ibrani ini lebih khusus menunjuk pada ruang terbuka atau lapangan umum di dalam kota.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ הַזָּקֵן
  choice: Laki-laki tua itu
  rationale: Ungkapan ini secara tepat menyatakan jenis kelamin dan usia tokoh serta menghindari ambiguitas frasa Indonesia “orang tua,” yang juga dapat berarti ayah dan ibu.
- source_word: שָׁלוֹם לָךְ
  choice: Damai sejahtera bagimu
  rationale: Mempertahankan kandungan leksikal שָׁלוֹם sekaligus berfungsi secara wajar sebagai ucapan yang menenteramkan dalam konteks ini.
- source_word: כָּל מַחְסוֹרְךָ
  choice: Segala kebutuhanmu
  rationale: מַחְסוֹר menunjuk pada apa yang kurang atau dibutuhkan; “segala kebutuhanmu” alami dalam konteks tawaran keramahtamahan.
- source_word: עָלָי
  choice: menjadi tanggung jawabku
  rationale: Ungkapan harfiah “atas aku” menyatakan bahwa si pembicara bersedia menanggung dan menyediakan apa yang diperlukan.
- source_word: רַק
  choice: Hanya saja
  rationale: Partikel ini membatasi tawaran dengan satu syarat utama. Dalam bahasa Indonesia, “hanya saja” menyampaikan fungsi tersebut dengan alami; batasan pada kemunculan pertama tercakup dalam pernyataan tanggung jawab yang langsung disusul syarat.
- source_word: בָּרְחוֹב
  choice: di lapangan kota
  rationale: רְחוֹב di sini menunjuk pada ruang umum yang terbuka di dalam kota, bukan terutama jalan sebagai jalur lalu lintas.
- source_word: אַל תָּלַן
  choice: jangan bermalam
  rationale: Bentuk larangan ini menyuruh agar orang itu tidak tinggal atau menginap sepanjang malam di tempat tersebut.
