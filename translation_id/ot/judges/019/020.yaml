translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Laki-laki tua” dipilih alih-alih “orang tua” untuk mencegah salah pengertian. Kalimat langsung dibuat alami tanpa menghilangkan tawaran tanggung jawab maupun larangan yang tegas.
