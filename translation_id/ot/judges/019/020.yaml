  terminology: “Laki-laki tua itu” menghindari ambiguitas “orang tua” dan sesuai dengan narasi. “Damai sejahtera bagimu” adalah salam bernuansa Alkitab yang lazim dan dapat diterima. Catatan kaki secara tepat menjelaskan bahwa רְחוֹב bukan sekadar jalan.
