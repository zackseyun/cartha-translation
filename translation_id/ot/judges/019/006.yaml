base_translation:
  language: en
  yaml_path: translation/ot/judges/019/006.yaml
  text: So the two of them sat down together and ate and drank. Then the young woman's father said to the man[a], "Please, be willing to stay the night, and let your heart be glad."
translation:
  language: id
  text: Lalu keduanya duduk, makan, dan minum bersama-sama. Kemudian ayah dari perempuan muda itu berkata kepada laki-laki itu, “Sudilah kiranya bermalam,[a] dan biarlah hatimu bergembira.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Sudilah menyetujui untuk bermalam, dan biarlah hatimu bersukacita.”
    reason: Alternatif leksikal untuk הוֹאֶל נָא (“bersedialah/menyetujuilah”) dan untuk idiom וְיִטַב לִבֶּךָ (“biarlah hatimu bersukacita”).
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: duduk
  rationale: Dalam rangkaian narasi yang mengantar kepada makan dan minum, bentuk dari יׁשב paling wajar dipahami sebagai tindakan duduk, bukan tetap tinggal.
- source_word: שְׁנֵיהֶם יַחְדָּו
  choice: keduanya ... bersama
  rationale: Mempertahankan penegasan Ibrani bahwa kedua orang itu melakukan tindakan tersebut bersama-sama, sambil tetap alami dalam bahasa Indonesia.
- source_word: וַיֹּאכְלוּ ... וַיִּשְׁתּוּ
  choice: makan, dan minum
  rationale: Terjemahan langsung dari rangkaian verba naratif; tidak menambahkan objek minuman karena teks Ibrani juga tidak menyebutkannya.
- source_word: אֲבִי הַנַּעֲרָה
  choice: ayah perempuan muda itu
  rationale: נַעֲרָה di sini menunjuk kepada seorang perempuan muda; pilihan ini lebih bermartabat dan sesuai konteks daripada 'gadis kecil' atau 'anak perempuan'.
- source_word: הָאִישׁ
  choice: laki-laki itu
  rationale: Teks ayat ini memakai istilah umum אִישׁ. Identitasnya tidak diperinci menjadi 'suami' atau 'orang Lewi' dalam terjemahan.
- source_word: הוֹאֶל נָא
  choice: Sudilah kiranya
  rationale: Mengungkapkan kesediaan atau persetujuan yang dimohon dengan sopan; נָא memperhalus desakan tersebut.
- source_word: וְלִין
  choice: bermalam
  rationale: לון berarti tinggal atau menginap semalam. 'Bermalam' ringkas, alami, dan tepat dalam konteks keramahtamahan.
- source_word: וְיִטַב לִבֶּךָ
  choice: biarlah hatimu bergembira
  rationale: Mempertahankan gambaran 'hati' dalam teks Ibrani, sekaligus menyampaikan idiom bahwa orang itu hendaknya menikmati jamuan dengan hati senang.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ungkapan sopan 'Sudilah kiranya' mempertahankan nada bujukan tuan rumah, sedangkan 'hatimu bergembira' menjaga citra bahasa Ibrani tanpa terdengar kaku.
