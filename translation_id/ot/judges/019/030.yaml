  text: וְ/הָיָ֣ה כָל הָ/רֹאֶ֗ה וְ/אָמַר֙ לֹֽא נִהְיְתָ֤ה וְ/לֹֽא נִרְאֲתָה֙ כָּ/זֹ֔את לְ/מִ/יּ֞וֹם עֲל֤וֹת בְּנֵֽי יִשְׂרָאֵל֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה שִֽׂימוּ לָ/כֶ֥ם עָלֶ֖י/הָ עֻ֥צוּ וְ/דַבֵּֽרוּ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/030.yaml
  text: And everyone who saw it said[a], “Nothing like this has happened or been seen from the day the sons of Israel came up from the land of Egypt until this day. Consider it, take counsel, and speak.”
translation:
  language: id
  text: Setiap orang yang melihatnya berkata, “Hal seperti ini belum pernah terjadi dan belum pernah terlihat sejak hari orang Israel keluar dari tanah Mesir sampai hari ini. Perhatikanlah hal ini, bermusyawarahlah, dan berbicaralah.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כָל הָרֹאֶה וְאָמַר
  choice: Setiap orang yang melihatnya berkata
  rationale: וְהָיָה memperkenalkan keadaan atau reaksi yang terjadi, sehingga tidak perlu diterjemahkan secara kaku sebagai 'dan terjadilah'. Bentuk partisipial dengan כָל menyatakan setiap orang yang melihat, sedangkan וְאָמַר menyampaikan reaksi mereka.
- source_word: לֹא נִהְיְתָה וְלֹא נִרְאֲתָה כָּזֹאת
  choice: Hal seperti ini belum pernah terjadi dan belum pernah terlihat
  rationale: Terjemahan ini mempertahankan dua verba Ibrani serta penekanan bahwa peristiwa tersebut sama sekali belum pernah terjadi maupun disaksikan.
- source_word: לְמִיּוֹם עֲלוֹת בְּנֵי יִשְׂרָאֵל מֵאֶרֶץ מִצְרַיִם
  choice: sejak hari orang Israel keluar dari tanah Mesir
  rationale: Dalam rumusan eksodus, עֲלוֹת berarti bergerak naik atau keluar dari Mesir. 'Orang Israel' merupakan etnonim Indonesia yang alami dan mencakup bangsa yang dimaksud oleh בְּנֵי יִשְׂרָאֵל tanpa mengesankan hanya anak-anak biologis Yakub.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Ungkapan Indonesia ini secara langsung mempertahankan rentang waktu sampai masa narator.
- source_word: שִׂימוּ לָכֶם עָלֶיהָ
  choice: Perhatikanlah hal ini
  rationale: Idiom Ibrani menyerukan agar perkara itu ditaruh dalam pikiran atau hati untuk dipertimbangkan sungguh-sungguh. 'Perhatikanlah hal ini' alami sekaligus mempertahankan desakan imperatif.
- source_word: עֻצוּ
  choice: bermusyawarahlah
  rationale: Imperatif ini menyerukan pertimbangan dan perundingan bersama. 'Bermusyawarahlah' paling wajar dalam bahasa Indonesia untuk nuansa komunal tersebut.
- source_word: וְדַבֵּרוּ
  choice: dan berbicaralah
  rationale: Objek perkataan tidak disebutkan dalam sumber. Terjemahan yang ringkas ini mempertahankan keterbukaan dan ketegasan perintah tersebut.
theological_decisions:
- issue: Terjemahan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel
  rationale: Dalam konteks ini frasa tersebut berfungsi sebagai nama kolektif bangsa Israel. 'Orang Israel' adalah padanan Indonesia modern yang alami dan tidak mempersempit rujukan kepada keturunan laki-laki atau anak-anak secara harfiah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan tiga imperatif pada akhir ayat dipertahankan untuk menjaga daya retoris sumber; tidak diperlukan catatan kaki karena alternatif leksikal tidak menimbulkan ambiguitas penting dalam bahasa sasaran.
