base_translation:
  language: en
  yaml_path: translation/ot/judges/019/003.yaml
  text: Then her husband arose and went after her to speak to her heart and bring her back[a]. His young servant was with him, along with a pair of donkeys. She brought him into her father’s house, and when the young woman’s father saw him[b], he rejoiced to meet him.
translation:
  language: id
  text: Lalu suaminya bangkit dan pergi menyusul perempuan itu untuk berbicara dengan lembut kepadanya[a] dan membawanya kembali[b]. Pelayan mudanya menyertainya, bersama sepasang keledai. Perempuan itu membawa suaminya masuk ke rumah ayahnya. Ketika ayah perempuan muda itu melihat laki-laki itu, ia bersukacita menyambutnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “berbicara kepada hatinya,” yaitu berbicara dengan lembut, menenangkan, atau membujuk.'
    reason: lexical_alternative
  - marker: b
    text: 'Bentuk kata Ibrani untuk “membawanya kembali” sulit secara tekstual: teks konsonantal memiliki akhiran maskulin, sedangkan konteks menunjukkan bahwa perempuan itulah yang hendak dibawanya kembali.'
    reason: textual_variant
lexical_decisions:
- source_word: אִישָׁהּ
  choice: suaminya
  rationale: Secara harfiah berarti “laki-lakinya,” tetapi dalam konteks hubungan mereka ungkapan ini secara wajar menunjuk kepada suaminya.
- source_word: אַחֲרֶיהָ
  choice: menyusul perempuan itu
  rationale: Preposisi ini menggambarkan gerak mengikuti seseorang. “Menyusul” menyampaikan maksud perjalanan dengan alami dan memperjelas rujukan pronomina.
- source_word: לְדַבֵּר עַל־לִבָּהּ
  choice: berbicara dengan lembut kepadanya
  rationale: Ungkapan Ibrani harfiahnya “berbicara kepada hatinya” dan dapat menyiratkan perkataan yang lembut, menenangkan, atau membujuk. Pilihan ini alami dalam bahasa Indonesia tanpa menentukan bahwa tindakannya pasti berhasil.
- source_word: ל/השיב/ו
  choice: dan membawanya kembali
  rationale: Konteks menunjukkan bahwa maksud perjalanan itu ialah membawa perempuan tersebut kembali, tetapi bentuk akhiran pronominal dalam teks Ibrani sulit secara tekstual; hal ini dicatat dalam catatan kaki.
- source_word: נַעֲרוֹ
  choice: pelayan mudanya
  rationale: נַעַר dapat berarti pemuda atau pelayan. Dalam konteks seorang pendamping perjalanan, “pelayan muda” mencakup usia dan perannya.
- source_word: צֶמֶד חֲמֹרִים
  choice: sepasang keledai
  rationale: צֶמֶד menunjuk kepada sepasang, sering kali pasangan hewan kerja, tanpa mengharuskan terjemahan bahwa keduanya sedang dipasangi kuk.
- source_word: וַתְּבִיאֵהוּ
  choice: Perempuan itu membawa dia masuk
  rationale: Kata kerjanya berjenis feminin tunggal sehingga perempuan itu adalah subjeknya; “masuk” mengungkapkan arah menuju rumah secara alami.
- source_word: הַנַּעֲרָה
  choice: perempuan muda
  rationale: Istilah ini menyebutnya sebagai seorang perempuan muda. Pilihan ini akurat dan tidak memakai sebutan arkais atau yang menyiratkan bahwa ia belum menikah.
- source_word: וַיִּשְׂמַח לִקְרָאתוֹ
  choice: ia bersukacita menyambutnya
  rationale: Frasa ini menyatakan sukacita sang ayah ketika menemui atau menyambut laki-laki itu. “Bersukacita menyambutnya” ringkas, wajar, dan mempertahankan kekuatan emosinya.
