id: JDG.19.16
reference: Judges 19:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הִנֵּ֣ה אִ֣ישׁ זָקֵ֗ן בָּ֣א מִֽן מַעֲשֵׂ֤/הוּ מִן הַ/שָּׂדֶה֙ בָּ/עֶ֔רֶב וְ/הָ/אִישׁ֙ מֵ/הַ֣ר אֶפְרַ֔יִם וְ/הוּא גָ֖ר בַּ/גִּבְעָ֑ה וְ/אַנְשֵׁ֥י הַ/מָּק֖וֹם בְּנֵ֥י יְמִינִֽי׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/016.yaml
  text: And behold[a], an old man was coming in from his work in the field at evening. The man was from the hill country of Ephraim, and he was staying in Gibeah[b], but the men of the place were Benjaminites.
translation:
  language: id
  text: Lihatlah, seorang laki-laki tua datang dari pekerjaannya di ladang pada waktu petang. Orang itu berasal dari daerah pegunungan Efraim[a] dan tinggal sebagai pendatang di Gibea[b], sedangkan orang-orang setempat adalah orang Benyamin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “gunung Efraim”; ungkapan ini menunjuk pada kawasan pegunungan Efraim.'
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang dipakai dapat berarti tinggal atau menetap sebagai pendatang, yakni bukan sebagai penduduk asli.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Lihatlah
  rationale: Mempertahankan penanda wacana Ibrani yang mengarahkan perhatian kepada perkembangan baru dalam kisah.
- source_word: אִישׁ זָקֵן
  choice: seorang laki-laki tua
  rationale: Padanan langsung dan wajar untuk nomina beserta sifatnya, tanpa menambahkan informasi yang tidak terdapat dalam teks.
- source_word: בָּא מִן מַעֲשֵׂהוּ מִן הַשָּׂדֶה
  choice: datang dari pekerjaannya di ladang
  rationale: Menggabungkan dua frasa berpreposisi secara alami dalam bahasa Indonesia sambil mempertahankan bahwa ia pulang dari pekerjaan yang dilakukan di ladang.
- source_word: בָּעֶרֶב
  choice: pada waktu petang
  rationale: Padanan alami yang mempertahankan keterangan waktu dalam teks.
- source_word: מֵהַר אֶפְרַיִם
  choice: berasal dari daerah pegunungan Efraim
  rationale: הַר אֶפְרַיִם merupakan sebutan geografis bagi kawasan perbukitan atau pegunungan Efraim, bukan semata-mata satu gunung tertentu.
- source_word: גָר בַּגִּבְעָה
  choice: tinggal sebagai pendatang di Gibea
  rationale: Kata גּוּר menyatakan tinggal atau menetap sebagai orang yang bukan penduduk asli; terjemahan ini mempertahankan nuansa tersebut.
- source_word: וְאַנְשֵׁי הַמָּקוֹם
  choice: sedangkan orang-orang setempat
  rationale: Kata penghubung diterjemahkan secara kontras untuk menonjolkan perbedaan antara asal orang tua itu dan identitas penduduk setempat.
- source_word: בְּנֵי יְמִינִי
  choice: orang Benyamin
  rationale: Padanan idiomatis bagi sebutan kesukuan, yakni orang-orang dari suku Benyamin.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Lihatlah” mempertahankan daya penunjuk narasi Ibrani, sedangkan “tinggal sebagai pendatang” menjaga nuansa status orang tersebut tanpa menyimpulkan apakah masa tinggalnya singkat atau lama.
