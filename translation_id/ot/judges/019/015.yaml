base_translation:
  language: en
  yaml_path: translation/ot/judges/019/015.yaml
  text: They turned aside there to go in and spend the night at Gibeah[a]. He went in and sat down in the open square of the city[b], and there was no man gathering them into his house to spend the night.
translation:
  language: id
  text: Mereka berbelok ke sana untuk masuk dan bermalam di Gibea. Ia masuk lalu duduk di lapangan kota[a], dan tidak ada seorang pun[b] yang menerima mereka di rumahnya untuk bermalam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di jalan lebar kota”; istilah Ibrani ini dapat menunjuk pada tempat umum yang luas atau lapangan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tidak ada seorang laki-laki pun”; maksudnya, tidak ada penduduk yang menerima mereka sebagai tamu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסֻרוּ
  choice: Mereka berbelok
  rationale: Bentuk jamak dari סור dalam konteks perjalanan menyatakan penyimpangan dari jalur atau berbelok menuju suatu tempat, bukan sekadar berhenti.
- source_word: לָבוֹא לָלוּן
  choice: untuk masuk dan bermalam
  rationale: בוא menyatakan masuk, sedangkan לון berarti tinggal semalam. Gabungan ini dipertahankan secara ringkas dan alami dalam bahasa Indonesia.
- source_word: בַּגִּבְעָה
  choice: di Gibea
  rationale: Nama tempat ditransliterasikan sebagai Gibea, bentuk yang lazim dalam bahasa Indonesia; preposisi ב menyatakan lokasi tempat mereka hendak bermalam.
- source_word: וַיָּבֹא וַיֵּשֶׁב
  choice: Ia masuk lalu duduk
  rationale: Peralihan ke verba tunggal dipertahankan dengan 'Ia', yang menunjuk kepada tokoh utama sebagai wakil rombongan. Urutan naratif wayyiqtol dinyatakan dengan 'lalu'.
- source_word: בִּרְחוֹב הָעִיר
  choice: di lapangan kota
  rationale: רְחוֹב dapat berarti ruang publik yang lebar atau lapangan kota, bukan hanya jalan. 'Lapangan kota' jelas dan alami, sementara alternatif leksikal dicatat dalam catatan kaki.
- source_word: וְאֵין אִישׁ
  choice: tidak ada seorang pun
  rationale: Ungkapan ini secara idiomatis menyatakan bahwa tak seorang pun bertindak. Bahasa Indonesia alami memakai bentuk netral ini; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: מְאַסֵּף אוֹתָם הַבַּיְתָה
  choice: yang mengajak mereka masuk ke rumahnya
  rationale: אסף dengan arah הַבַּיְתָה menggambarkan penerimaan musafir ke dalam rumah sebagai tindakan keramahtamahan. 'Mengajak ... masuk' menyampaikan tindakan itu secara alami tanpa menjelaskan lebih jauh daripada konteks.
- source_word: לָלוּן
  choice: untuk bermalam
  rationale: לון berarti melewatkan malam atau tinggal semalam; 'bermalam' merupakan padanan Indonesia yang ringkas, modern, dan tepat.
theological_decisions: []
translation_notes:
