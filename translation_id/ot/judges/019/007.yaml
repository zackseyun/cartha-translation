  text: וַ/יָּ֥קָם הָ/אִ֖ישׁ לָ/לֶ֑כֶת וַ/יִּפְצַר בּ/וֹ֙ חֹתְנ֔/וֹ וַ/יָּ֖שָׁב וַ/יָּ֥לֶן שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/007.yaml
  text: Then the man got up to go[a], but his father-in-law urged him, so he turned back and spent the night there.
translation:
  language: id
  text: Lalu orang itu bangun untuk pergi, tetapi ayah mertuanya terus mendesaknya[a]. Karena itu, ia kembali dan bermalam di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bersikeras membujuknya”; kata Ibrani ini menyatakan desakan yang kuat dan terus-menerus.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: bangun
  rationale: Bentuk naratif dari קום menandai tindakan bangkit untuk melakukan sesuatu; “bangun” alami dalam bahasa Indonesia dan mempertahankan tindakan persiapan sebelum pergi.
- source_word: הָאִישׁ
  choice: orang itu
  rationale: אִישׁ secara harfiah berarti “laki-laki/orang”; dalam alur ini acuannya sudah jelas, sehingga “orang itu” merupakan sebutan naratif yang alami tanpa menggantinya dengan label relasional yang tidak tertulis.
- source_word: לָלֶכֶת
  choice: untuk pergi
  rationale: Infinitif dari הלך sesudah קום menyatakan tujuan. “Untuk pergi” langsung dan tidak mempersempit makna menjadi “berangkat” atau “meninggalkan tempat itu”.
- source_word: וַיִּפְצַר בּוֹ
  choice: terus mendesaknya
  rationale: פצר ב menyampaikan desakan atau bujukan yang kuat dan berulang. Kata “terus” membantu menyatakan kegigihan tindakan, sedangkan “mendesaknya” mempertahankan daya tekan ungkapan Ibrani.
- source_word: חֹתְנוֹ
  choice: ayah mertuanya
  rationale: Dalam konteks ini חֹתְנוֹ menunjuk kepada ayah perempuan itu dalam hubungannya dengan orang Lewi tersebut. “Ayah mertuanya” lebih tepat daripada “mertuanya,” yang dalam bahasa Indonesia tidak menyatakan jenis kelamin.
- source_word: וַיָּשָׁב
  choice: ia kembali
  rationale: שׁוב berarti kembali atau berbalik. “Ia kembali” mempertahankan makna dasar dan secara alami menunjukkan bahwa niatnya untuk pergi dibatalkan.
- source_word: וַיָּלֶן שָׁם
  choice: bermalam di sana
  rationale: לון berarti tinggal atau menginap semalam. “Bermalam di sana” ringkas, jelas, dan alami dalam narasi Indonesia.
