  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Kata ganti “engkau” dipakai untuk percakapan langsung dalam narasi Alkitab. Penanda catatan kaki ditempatkan tepat sesudah unsur yang dijelaskannya.
