base_translation:
  language: en
  yaml_path: translation/ot/judges/019/017.yaml
  text: He looked up and saw the traveler in the open square of the city[a], and the old man said, “Where are you going[b], and where do you come from?”
translation:
  language: id
  text: Ia mengangkat pandangannya dan melihat seorang musafir[a] di lapangan kota[b]. Laki-laki tua itu berkata, “Ke mana engkau pergi, dan dari mana engkau datang?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang yang sedang dalam perjalanan” atau “tamu”. Kata Ibrani ini menunjuk kepada orang yang bepergian dan, dalam konteks keramahtamahan, dapat juga menunjuk kepadanya sebagai tamu.
    reason: lexical_alternative
  - marker: b
    text: Atau “di jalan kota”. Kata Ibrani ini lebih khusus menunjuk kepada tempat umum yang luas atau lapangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא עֵינָיו
  choice: Ia mengangkat pandangannya
  rationale: Ungkapan ini mempertahankan gambaran idiom Ibrani tentang mengarahkan mata ke atas, tetapi terdengar lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “mengangkat matanya”.
- source_word: וַיַּרְא
  choice: melihat
  rationale: Kata ini menyatakan persepsi visual secara langsung; “melihat” tepat dan tidak menambahkan penafsiran seperti “memperhatikan” atau “menyadari”.
- source_word: הָאִישׁ הָאֹרֵחַ
  choice: seorang musafir
  rationale: אֹרֵחַ menunjuk kepada orang yang sedang dalam perjalanan dan, dalam konteks keramahtamahan, dapat pula dipandang sebagai tamu. “Musafir” ringkas, lazim, dan mempertahankan fokus pada statusnya sebagai orang yang bepergian.
- source_word: בִּרְחֹב הָעִיר
  choice: di lapangan kota
  rationale: רְחוֹב di sini menunjuk kepada ruang umum yang luas atau lapangan, bukan terutama jalan sempit. “Lapangan kota” alami dan jelas bagi pembaca modern.
- source_word: הָאִישׁ הַזָּקֵן
  choice: Orang tua itu
  rationale: Frasa ini secara langsung menunjuk kepada laki-laki tua yang telah disebut dalam konteks; “orang tua itu” merupakan bentuk naratif Indonesia yang alami tanpa menambah gelar atau status.
- source_word: אָנָה תֵלֵךְ
  choice: Ke mana engkau pergi
  rationale: אָנָה menanyakan tujuan, sedangkan bentuk verba menyatakan perjalanan yang sedang atau akan dilakukan. Susunan ini alami dan mempertahankan arah pertanyaan.
- source_word: וּמֵאַיִן תָּבוֹא
  choice: dan dari mana engkau datang
  rationale: Frasa ini secara eksplisit menanyakan tempat asal perjalanan. “Dari mana engkau datang” mempertahankan kontras dengan pertanyaan tentang tujuan.
