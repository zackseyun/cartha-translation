translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas dengan irama naratif yang ringkas. Pilihan 'mencampurkan pakan' mempertahankan kekhususan leksikal teks Ibrani, sementara catatan kaki menyediakan padanan yang lebih idiomatis. Semua penanda catatan kaki ditempatkan langsung sesudah klausa yang diterangkan.
