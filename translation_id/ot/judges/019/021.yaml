  text: So he brought him into his house and fed the donkeys[b][a]. Then they washed their feet and ate and drank.
translation:
  language: id
  text: Lalu ia membawa orang itu masuk ke rumahnya dan menyiapkan pakan untuk keledai-keledai itu.[a] Mereka membasuh kaki mereka,[b] lalu makan dan minum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “memberi makan keledai-keledai itu.” Kata Ibrani yang dipakai di sini dapat merujuk pada penyediaan pakan, mungkin pakan campuran.
    reason: lexical_alternative
  - marker: b
    text: Membasuh kaki merupakan kebiasaan dalam penyambutan tamu di Timur Dekat kuno.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבִיאֵהוּ
  choice: ia membawa orang itu masuk
  rationale: Bentuk Hifil dari בוא menyatakan tindakan menyebabkan seseorang masuk atau membawa; frasa ini alami dalam bahasa Indonesia dan memperjelas bahwa tuan rumah membawa orang Lewi itu ke dalam rumah.
- source_word: לְבֵיתוֹ
  choice: ke rumahnya
  rationale: Preposisi ל sesudah verba gerak menyatakan arah ke rumah milik tuan rumah; unsur masuk sudah dinyatakan oleh verba sebelumnya.
- source_word: וַיָּבָול
  choice: mencampurkan pakan untuk
  rationale: Berasal dari בלל, 'mencampur'; dalam konteks ini menunjuk pada menyiapkan pakan campuran bagi hewan. Terjemahan ini mempertahankan gambaran konkret sumber tanpa memakai istilah kuno.
- source_word: לַחֲמוֹרִים
  choice: keledai-keledai itu
  rationale: חמור berarti 'keledai'; bentuk ulang menandai jamak secara wajar, sedangkan 'itu' merujuk pada keledai yang sudah hadir dalam konteks.
- source_word: וַיִּרְחֲצוּ רַגְלֵיהֶם
  choice: mereka membasuh kaki
  rationale: Terjemahan langsung dan alami untuk tindakan membersihkan kaki sebagai bagian dari penerimaan tamu. Dalam bahasa Indonesia, kepemilikan kaki sudah jelas dari subjek 'mereka'.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: mereka makan dan minum
  rationale: Mempertahankan urutan dan gaya narasi Ibrani yang ringkas.
