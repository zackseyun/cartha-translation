  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הִנֵּה֩ בִתִּ֨/י הַ/בְּתוּלָ֜ה וּ/פִֽילַגְשֵׁ֗/הוּ אוֹצִֽיאָה נָּ֤א אוֹתָ/ם֙ וְ/עַנּ֣וּ אוֹתָ֔/ם וַ/עֲשׂ֣וּ לָ/הֶ֔ם הַ/טּ֖וֹב בְּ/עֵינֵי/כֶ֑ם וְ/לָ/אִ֤ישׁ הַ/זֶּה֙ לֹ֣א תַעֲשׂ֔וּ דְּבַ֖ר הַ/נְּבָלָ֥ה הַ/זֹּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/024.yaml
  text: Look[a], here are my virgin daughter and his concubine. Please let me bring them out. Violate them and do to them what is good in your eyes[c][b]. But to this man do not do this outrageous thing.
translation:
  language: id
  text: Lihat, ini anak perempuanku yang masih perawan dan gundiknya. Biarlah aku membawa mereka keluar. Perkosalah mereka[a] dan lakukanlah kepada mereka apa yang baik di mata kalian.[b] Tetapi jangan lakukan perbuatan keji ini terhadap laki-laki ini.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang dipakai dapat berarti menghina, menindas, atau memperlakukan dengan kejam; dalam konteks ini yang dimaksud adalah kekerasan seksual.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “apa yang baik di mata kalian”; ungkapan ini berarti apa yang kalian anggap baik atau menyenangkan.
    reason: cultural_note
  - marker: c
    text: Atau “perbuatan bejat ini” atau “tindakan memalukan ini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihat
  rationale: Kata seru penunjuk ini mendesak para pendengar untuk memperhatikan. “Lihat” alami dalam bahasa Indonesia modern dan mempertahankan daya serunya.
- source_word: בִתִּי הַבְּתוּלָה
  choice: anak perempuanku yang masih perawan
  rationale: Ungkapan ini menyebut anak perempuan sang pembicara dan secara eksplisit menyatakan bahwa ia perawan; terjemahan ini mempertahankan kedua unsur tanpa menyamakannya hanya dengan status belum menikah.
- source_word: וּפִילַגְשֵׁהוּ
  choice: dan gundiknya
  rationale: “Gundik” merupakan padanan Indonesia yang lazim bagi perempuan berstatus pasangan sekunder dalam latar sosial kuno. Akhiran “-nya” mempertahankan rujukan pronominal teks sumber.
- source_word: אוֹצִיאָה נָּא אוֹתָם
  choice: Biarlah aku membawa mereka keluar
  rationale: Bentuk kohortatif dan partikel permohonan menyatakan kehendak atau permintaan mendesak. “Biarlah aku” menyampaikan nuansa tersebut dengan wajar.
- source_word: וְעַנּוּ אוֹתָם
  choice: Perkosalah mereka
  rationale: Dalam konteks tuntutan seksual pada ayat sebelumnya, bentuk Piel dari ענה menunjuk pada penghinaan atau pelanggaran seksual. “Perkosalah” menyatakan kekerasan seksual secara jelas; catatan kaki tetap mencatat rentang leksikal verba itu.
- source_word: וַעֲשׂוּ לָהֶם הַטּוֹב בְּעֵינֵיכֶם
  choice: dan lakukanlah kepada mereka apa yang baik di mata kalian
  rationale: Terjemahan ini mempertahankan idiom Ibrani “baik di mata kalian” beserta ironi moralnya, sementara catatan menjelaskan bahwa maksud idiomatisnya ialah apa yang mereka anggap baik atau menyenangkan.
- source_word: וְלָאִישׁ הַזֶּה לֹא תַעֲשׂוּ
  choice: Tetapi jangan lakukan ... terhadap laki-laki ini
  rationale: Frasa depan yang ditempatkan di awal menandai kontras tajam antara laki-laki itu dan kedua perempuan yang ditawarkan. Susunan Indonesia ini alami dan tetap mempertahankan kontras tersebut.
- source_word: דְּבַר הַנְּבָלָה הַזֹּאת
  choice: perbuatan keji ini
  rationale: נְבָלָה menyatakan tindakan yang sangat tercela, memalukan, dan melanggar norma moral, bukan sekadar kebodohan. “Perbuatan keji” menyampaikan kecaman moral itu secara jelas.
theological_decisions:
- issue: Kejelasan bahasa kekerasan seksual tanpa menutupi keburukan adegan
  choice: Menerjemahkan וְעַנּוּ אוֹתָם sebagai “Perkosalah mereka”
  alternative: “Hinakanlah mereka” atau “aniayalah mereka”
  rationale: Konteks langsung menjadikan maksud seksualnya nyata. Padanan yang eksplisit mencegah penghalusan kekerasan dalam teks, sedangkan catatan kaki mengakui bahwa verba Ibrani memiliki cakupan penghinaan dan penindasan yang lebih luas.
- issue: Mempertahankan ironi moral dalam idiom הַטּוֹב בְּעֵינֵיכֶם
  choice: Mempertahankan ungkapan “apa yang baik di mata kalian” dalam teks utama
  alternative: “sesuka hati kalian” atau “apa yang kalian anggap baik”
  rationale: Bentuk harfiah tetap dapat dimengerti dalam bahasa Indonesia dan mempertahankan ketegangan antara apa yang dipandang “baik” oleh massa dan kebejatan usulan tersebut. Catatan kaki memberi makna idiomatis tanpa menyelesaikan ironi itu di dalam teks.
- issue: Kecaman moral dalam istilah נְבָלָה
  choice: “perbuatan keji”
  alternative: “perbuatan bejat,” “tindakan memalukan,” atau “kebodohan”
  rationale: Istilah ini menandai pelanggaran moral yang berat. “Perbuatan keji” jelas bagi pembaca modern dan tidak mereduksinya menjadi kekeliruan intelektual.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kekerasan seksual disebut dengan jelas tanpa bahasa sensasional. Bentuk jamak “kalian” dipakai karena semua verba larangan dan perintah ditujukan kepada sekelompok orang. Ungkapan “baik di mata kalian” sengaja dipertahankan untuk menjaga idiom dan ironi moral teks sumber.
