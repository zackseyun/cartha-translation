base_translation:
  language: en
  yaml_path: translation/ot/judges/019/011.yaml
  text: When they were near Jebus[a], and the day was far spent, the young man said to his master, “Please come[c][b], let us turn aside to this city of the Jebusites and spend the night in it.”
translation:
  language: id
  text: Ketika mereka sudah dekat Yebus[a], hari sudah sangat larut.[b] Orang muda itu[c] berkata kepada tuannya, “Mari, kita singgah ke kota orang Yebus ini dan bermalam di sana.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yebus adalah nama lama Yerusalem.
    reason: cross_reference
  - marker: b
    text: Atau, “hari telah sangat menurun,” yakni hari sudah sangat larut.
    reason: lexical_alternative
  - marker: c
    text: “Orang muda” juga dapat berarti pelayan atau pembantu dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵם עִם יְבוּס
  choice: mereka sudah dekat Yebus
  rationale: Dalam konteks perjalanan, עִם dengan nama tempat menyatakan kedekatan. Ungkapan ini menyampaikan makna tersebut secara alami dalam bahasa Indonesia.
- source_word: יְבוּס
  choice: Yebus
  rationale: Nama lama yang dipakai teks Ibrani dipertahankan, bukan langsung diganti dengan Yerusalem.
- source_word: וְהַיּוֹם רַד מְאֹד
  choice: hari sudah sangat senja
  rationale: Ungkapan Ibrani menggambarkan hari yang telah jauh menurun menuju malam. Pilihan ini mempertahankan citra waktu sekaligus terdengar wajar.
- source_word: הַנַּעַר
  choice: orang muda itu
  rationale: נַעַר dapat berarti anak laki-laki, orang muda, atau pelayan. Terjemahan utama mempertahankan arti leksikal yang lebih terbuka, sementara konteks menunjukkan kedudukannya di bawah seorang tuan.
- source_word: אֲדֹנָיו
  choice: tuannya
  rationale: Dalam konteks hubungan sosial ini, אֲדוֹן menunjuk kepada atasan atau tuan, bukan gelar ilahi.
- source_word: לְכָה נָּא
  choice: Mari
  rationale: Imperatif gerak dengan partikel permohonan נָא berfungsi sebagai ajakan sopan; “Mari” menyampaikannya secara ringkas dan alami.
- source_word: וְנָסוּרָה
  choice: singgahlah kita
  rationale: Bentuk kohortatif dari סוּר menyatakan ajakan menyimpang dari rute untuk memasuki tempat itu. “Singgahlah kita” menyampaikan tujuan perjalanan tersebut dengan alami.
- source_word: עִיר הַיְבוּסִי הַזֹּאת
  choice: kota orang Yebus ini
  rationale: Bentuk gentilik dipahami secara kolektif sebagai penduduk Yebus, sedangkan kata tunjuk “ini” dipertahankan.
- source_word: וְנָלִין בָּהּ
  choice: dan bermalam di sana
  rationale: לוּן berarti tinggal atau menginap semalam. “Bermalam di sana” jelas dan idiomatis dalam bahasa Indonesia modern.
