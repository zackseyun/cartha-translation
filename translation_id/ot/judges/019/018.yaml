  terminology: Nama Yahweh dialihaksarakan secara konsisten. “Rumah Yahweh” mempertahankan bacaan Masoret yang sulit secara kontekstual tanpa memaksakan tafsiran “rumahku.” Catatan kaki secara tepat menyajikan kemungkinan alternatif.
