  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֵלָ֗י/ו עֹבְרִ֨ים אֲנַ֜חְנוּ מִ/בֵּֽית לֶ֣חֶם יְהוּדָה֮ עַד יַרְכְּתֵ֣י הַר אֶפְרַיִם֒ מִ/שָּׁ֣ם אָנֹ֔כִי וָ/אֵלֵ֕ךְ עַד בֵּ֥ית לֶ֖חֶם יְהוּדָ֑ה וְ/אֶת בֵּ֤ית יְהוָה֙ אֲנִ֣י הֹלֵ֔ךְ וְ/אֵ֣ין אִ֔ישׁ מְאַסֵּ֥ף אוֹתִ֖/י הַ/בָּֽיְתָ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/018.yaml
  text: He said to him[a], “We are passing through from Bethlehem in Judah to the remote parts of the hill country of Ephraim. I am from there, and I went to Bethlehem in Judah, and I am going to the house of Yahweh, but no man is taking me into his house.”
translation:
  language: id
  text: Ia berkata kepadanya, “Kami sedang dalam perjalanan dari Betlehem di Yehuda menuju pelosok pegunungan Efraim. Aku berasal dari sana, dan aku pergi ke Betlehem di Yehuda. Aku sedang menuju rumah Yahweh[a], tetapi tidak ada seorang pun yang menerima aku di rumahnya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “aku sedang pulang” atau “aku sedang menuju rumahku.” Sebagian orang memahami ungkapan Ibrani ini secara idiomatis atau menganggapnya mencerminkan bacaan lain, sebab “rumah Yahweh” tidak terduga dalam konteks ini.
    reason: alternative_reading
lexical_decisions:
- source_word: עֹבְרִים אֲנַחְנוּ
  choice: Kami sedang dalam perjalanan
  rationale: Partisipel עֹבְרִים bersama pronomina menyatakan perjalanan yang sedang berlangsung. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan gagasan bahwa mereka sedang bepergian atau melintas.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: dari Betlehem di Yehuda
  rationale: Frasa ini menunjukkan Betlehem yang terletak di wilayah Yehuda; bentuk “di Yehuda” membedakannya secara alami dari tempat lain yang bernama Betlehem.
- source_word: יַרְכְּתֵי הַר אֶפְרַיִם
  choice: pelosok pegunungan Efraim
  rationale: יַרְכְּתֵי menunjuk pada bagian ujung, terpencil, atau jauh. “Pelosok” menyampaikan nuansa daerah terpencil, sedangkan הַר אֶפְרַיִם merupakan kawasan pegunungan Efraim.
- source_word: מִשָּׁם אָנֹכִי
  choice: Aku berasal dari sana
  rationale: Terjemahan langsung dan alami untuk pernyataan tentang tempat asal si pembicara.
- source_word: וָאֵלֵךְ עַד בֵּית לֶחֶם יְהוּדָה
  choice: dan aku pergi ke Betlehem di Yehuda
  rationale: Bentuk wayyiqtol dari הלך paling wajar dipahami sebagai tindakan lampau. Terjemahan ini mempertahankan bentuk tersebut tanpa merapikan urutan perjalanan yang memang ringkas dalam teks Ibrani.
- source_word: וְאֶת בֵּית יְהוָה אֲנִי הֹלֵךְ
  choice: Sekarang aku sedang menuju rumah Yahweh
  rationale: Teks Masoret secara eksplisit memuat “rumah Yahweh.” Kata “menuju” menyatakan arah gerak secara alami, dan “sekarang” memperjelas peralihan kembali kepada perjalanan yang sedang berlangsung tanpa mengubah tujuan yang disebutkan teks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh,” bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: וְאֵין אִישׁ מְאַסֵּף אוֹתִי הַבָּיְתָה
  choice: tetapi tidak ada seorang pun yang menerima aku di rumahnya
  rationale: Dalam konteks keramahtamahan, אסף berarti menerima atau menampung seseorang di rumah. “Tidak ada seorang pun” adalah bentuk Indonesia yang alami untuk אֵין אִישׁ, sedangkan “di rumahnya” menyatakan maksud הַבָּיְתָה secara idiomatis.
theological_decisions:
- issue: Makna וְאֶת בֵּית יְהוָה אֲנִי הֹלֵךְ yang sulit secara kontekstual
  choice: Sekarang aku sedang menuju rumah Yahweh
  alternative: Sekarang aku sedang pulang / menuju rumahku
  rationale: Teks konsonantal dan Masoret secara eksplisit berbunyi “rumah Yahweh.” Karena alternatif “pulang” atau “menuju rumahku” memerlukan pemahaman idiomatis atau bacaan lain, teks utama mempertahankan bacaan sumber dan mencatat alternatifnya dalam catatan kaki.
- issue: Nomina maskulin tunggal אִישׁ dalam pernyataan negatif
  choice: tidak ada seorang pun
  alternative: tidak ada seorang laki-laki pun
  rationale: Dalam konstruksi negatif ini אִישׁ berfungsi secara umum sebagai “seorang pun.” Bahasa Indonesia tidak menandai gender pada “seorang,” dan penyebutan “laki-laki” akan memberi penekanan gender yang tidak diperlukan bagi makna pernyataan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. “Pelosok pegunungan Efraim” mempertahankan nuansa geografis tanpa terdengar teknis. Susunan kalimat tidak menghilangkan ketegangan kontekstual dalam tujuan perjalanan tokoh.
