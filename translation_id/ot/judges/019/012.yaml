  text: But his master said to him[a], “We will not turn aside into a foreign city, which is not of the sons of Israel; rather, we will go on as far as Gibeah.”
translation:
  language: id
  text: Namun, tuannya berkata kepadanya, “Kita tidak akan berbelok ke kota asing yang penduduknya bukan orang Israel; kita akan melanjutkan perjalanan sampai ke Gibea.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲדֹנָיו
  choice: tuannya
  rationale: Dalam konteks ini, kata tersebut menunjuk kepada atasan manusia dari pelayan itu, bukan gelar ilahi. ‘Tuannya’ menyampaikan hubungan sosial tersebut secara wajar dalam bahasa Indonesia.
- source_word: נָסוּר
  choice: kita tidak akan menyimpang
  rationale: Kata kerja סור berarti berbelok atau menyimpang dari jalur. Di sini maksudnya meninggalkan rute untuk memasuki kota; ‘menyimpang’ mempertahankan gambaran arah perjalanan.
- source_word: עִיר נָכְרִי
  choice: kota asing
  rationale: נָכְרִי menandai sesuatu atau seseorang yang berasal dari luar komunitas Israel. ‘Kota asing’ ringkas, alami, dan sesuai dengan konteks.
- source_word: אֲשֶׁר לֹא מִבְּנֵי יִשְׂרָאֵל הֵנָּה
  choice: yang penduduknya bukan keturunan Israel
  rationale: Ungkapan Ibrani mengidentifikasi kota itu melalui penduduknya sebagai bukan bagian dari bani atau keturunan Israel. Penyebutan ‘penduduknya’ membuat maksud kolektifnya jelas tanpa mengubah perbedaan etnis yang dinyatakan teks.
- source_word: וְעָבַרְנוּ
  choice: kita akan meneruskan perjalanan
  rationale: Dalam konteks perjalanan, עבר menyatakan tindakan terus bergerak melewati pilihan tempat singgah yang ada. Ungkapan ini alami dalam bahasa Indonesia.
- source_word: עַד גִּבְעָה
  choice: sampai ke Gibea
  rationale: עַד menunjukkan batas atau tujuan yang hendak dicapai. ‘Sampai ke Gibea’ menyampaikan makna tersebut secara tepat dan idiomatis.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pemakaian ‘kita’ bersifat inklusif karena sang tuan berbicara kepada pelayannya mengenai perjalanan yang akan mereka lanjutkan bersama. Struktur dua kalimat dipilih agar ujaran terdengar alami tanpa menghilangkan pertentangan antara tidak singgah di kota asing dan melanjutkan perjalanan ke Gibea.
