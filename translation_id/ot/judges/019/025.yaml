base_translation:
  language: en
  yaml_path: translation/ot/judges/019/025.yaml
  text: But the men were not willing to listen to him[a], so the man seized his concubine and brought her out to them. And they knew her and abused her all night until morning, and they let her go at the dawn.
translation:
  language: id
  text: Namun, orang-orang itu tidak mau mendengarkan dia. Maka laki-laki itu mencengkeram gundiknya dan membawa perempuan itu keluar kepada mereka. Mereka menggauli perempuan itu[a] dan memperlakukannya dengan keji sepanjang malam sampai pagi. Ketika fajar menyingsing, mereka melepaskannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mengenal dia”; dalam konteks ini, ungkapan Ibrani tersebut merupakan eufemisme untuk pelanggaran seksual dengan kekerasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבוּ
  choice: tidak mau
  rationale: Mengungkapkan ketidakbersediaan atau penolakan secara alami dan tepat dalam bahasa Indonesia.
- source_word: לִשְׁמֹעַ לוֹ
  choice: mendengarkan dia
  rationale: Mempertahankan arti mendengar atau mengindahkan permohonan tanpa mempersempitnya menjadi ketaatan formal.
- source_word: וַיַּחֲזֵק
  choice: mencengkeram
  rationale: Menunjukkan tindakan memegang dengan paksa, sesuai dengan bentuk dan konteks kekerasan.
- source_word: פִּילַגְשׁוֹ
  choice: gundiknya
  rationale: Istilah Indonesia yang lazim untuk kategori sosial פילגש, tanpa mengubahnya menjadi istri dalam pengertian penuh.
- source_word: וַיֹּצֵא אֲלֵיהֶם הַחוּץ
  choice: membawa perempuan itu keluar kepada mereka
  rationale: Menyatakan bentuk kausatif יצא dan unsur הַחוּץ secara alami; kata 'keluar' sudah menunjukkan perpindahan ke luar rumah.
- source_word: וַיֵּדְעוּ אוֹתָהּ
  choice: mereka mengenal perempuan itu
  rationale: Mempertahankan eufemisme Ibrani ידע dan kekerasan konteksnya dijelaskan dalam catatan kaki, sehingga ungkapan sumber tidak diam-diam diperjelas dalam teks utama.
- source_word: וַיִּתְעַלְּלוּ בָהּ
  choice: memperlakukannya dengan keji
  rationale: Menyampaikan perlakuan yang abusif, menghina, dan kejam tanpa membatasi cakupan kata hanya pada satu bentuk kekerasan.
- source_word: כָּל הַלַּיְלָה עַד הַבֹּקֶר
  choice: sepanjang malam sampai pagi
  rationale: Ungkapan waktu yang alami dan mempertahankan penekanan pada lamanya kekerasan.
- source_word: וַיְשַׁלְּחוּהָ
  choice: mereka melepaskannya
  rationale: Sesuai dengan arti mengizinkan pergi atau membebaskan dalam konteks ini.
- source_word: בַּעֲלוֹת הַשָּׁחַר
  choice: ketika fajar menyingsing
  rationale: Mencerminkan gambaran harfiah tentang terbitnya fajar dalam bahasa Indonesia yang alami.
theological_decisions:
- issue: Eufemisme seksual ידע dalam konteks kekerasan
  choice: Mempertahankan ungkapan 'mengenal' dalam teks utama dan menjelaskan maksudnya dalam catatan kaki.
  alternative: Menerjemahkannya langsung sebagai 'memperkosa' atau 'bersetubuh dengan'.
  rationale: Teks Ibrani memakai eufemisme, sedangkan seluruh konteks menunjukkan bahwa tindakan itu merupakan pelanggaran seksual dengan kekerasan. Pilihan ini mempertahankan bentuk retoris sumber tanpa mengaburkan maknanya bagi pembaca.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat jelas bagi pembaca umum, sementara pengulangan 'perempuan itu' dipakai untuk menghindari ketidakjelasan rujukan. Kekerasan narasi tidak diperhalus, tetapi rincian yang tidak dinyatakan secara eksplisit oleh bentuk leksikal Ibrani juga tidak ditambahkan.
