base_translation:
  language: en
  yaml_path: translation/ot/judges/019/026.yaml
  text: The woman came as morning was dawning and fell at the entrance of the house of the man where her master was[b][a], until it was light.
translation:
  language: id
  text: Ketika pagi mulai menyingsing[b], perempuan itu datang dan jatuh di ambang pintu rumah orang itu, tempat tuannya[a] berada, sampai hari menjadi terang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “majikannya.” Bahasa Ibrani memakai istilah yang berarti “tuan,” bukan secara eksplisit “suami.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “menjelang pagi” atau “sebelum fajar.” Ungkapan Ibrani ini secara harfiah menunjuk pada beralihnya pagi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנוֹת הַבֹּקֶר
  choice: Menjelang pagi
  rationale: Ungkapan dengan פנה menandai beralihnya waktu menuju pagi. 'Menjelang pagi' alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi waktu yang pasti sebelum atau tepat saat fajar.
- source_word: וַתָּבֹא
  choice: datang
  rationale: בוא adalah verba gerak umum 'datang'. 'Kembali' mungkin tersirat oleh konteks, tetapi tidak dinyatakan oleh verba ini.
- source_word: וַתִּפֹּל
  choice: jatuh
  rationale: נפל secara langsung berarti 'jatuh'. 'Tersungkur' atau 'roboh' akan menambahkan rincian mengenai cara atau sebab yang tidak disebutkan.
- source_word: פֶּתַח בֵּית
  choice: di depan pintu rumah
  rationale: פֶּתַח menunjuk pada bukaan atau jalan masuk. 'Di depan pintu rumah' merupakan ungkapan Indonesia yang konkret dan wajar untuk lokasi tersebut.
- source_word: הָאִישׁ
  choice: orang
  rationale: אִישׁ berarti 'laki-laki/orang'. Dalam konstruksi kepemilikan rumah ini, 'orang' terdengar alami tanpa menambahkan identitas khusus sang pemilik rumah.
- source_word: אֲדוֹנֶיהָ
  choice: tuannya
  rationale: אדון dengan sufiks feminin berarti 'tuannya' dan menyatakan kedudukan berwenang. Terjemahan 'suaminya' akan menafsirkan relasi secara lebih khusus daripada istilah Ibraninya.
- source_word: אֲשֶׁר ... שָׁם
  choice: yang menjadi tempat ... berada
  rationale: Gabungan אֲשֶׁר dan שָׁם menyatakan lokasi, yakni rumah tempat tuannya berada. Susunan ini mempertahankan hubungan relatif tanpa mengidentifikasi pemilik rumah dengan tuannya.
- source_word: עַד הָאוֹר
  choice: sampai hari terang
  rationale: Ungkapan ini menandai berlangsungnya keadaan itu hingga datangnya cahaya pagi. 'Sampai hari terang' ringkas dan wajar dalam narasi Indonesia.
theological_decisions:
- issue: Hubungan perempuan itu dengan אֲדוֹנֶיהָ
  choice: tuannya
  alternative: suaminya
  rationale: Teks memakai istilah otoritas 'tuan', bukan istilah yang secara eksplisit berarti 'suami'. Pilihan ini mempertahankan ketegangan sosial dan naratif teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Urutan klausa mengikuti alur Ibrani sambil menghindari susunan yang dapat keliru menyiratkan bahwa 'tuannya' adalah pemilik rumah. Penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
