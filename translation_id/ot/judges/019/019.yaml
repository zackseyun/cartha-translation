  text: וְ/גַם תֶּ֤בֶן גַּם מִסְפּוֹא֙ יֵ֣שׁ לַ/חֲמוֹרֵ֔י/נוּ וְ֠/גַם לֶ֣חֶם וָ/יַ֤יִן יֶשׁ לִ/י֙ וְ/לַֽ/אֲמָתֶ֔/ךָ וְ/לַ/נַּ֖עַר עִם עֲבָדֶ֑י/ךָ אֵ֥ין מַחְס֖וֹר כָּל דָּבָֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/019.yaml
  text: Yet there is both straw and fodder for our donkeys[a], and there is bread and wine for me, for your female servant, and for the young man with your servants[c][b]; there is no lack of anything.
translation:
  language: id
  text: Lagi pula, tersedia jerami dan pakan untuk keledai kami, dan juga roti serta anggur bagiku, bagi hamba perempuanmu, dan bagi pemuda yang bersama hamba-hambamu.[a][b][c] Kami tidak kekurangan apa pun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, bagian awal ayat ini berbunyi, “Dan juga ada jerami, juga pakan untuk keledai kami.” Pengulangan kata “juga” memberi penekanan.
    reason: lexical_alternative
  - marker: b
    text: “Hamba perempuanmu” adalah sebutan merendahkan diri bagi perempuan yang bepergian bersamanya.
    reason: cultural_note
  - marker: c
    text: Teks Ibrani berbunyi “bersama hamba-hambamu,” dengan akhiran orang kedua tunggal. Hubungan tepat frasa ini dalam kalimat tidak sepenuhnya pasti.
    reason: textual_clarity
lexical_decisions:
- source_word: וְגַם ... גַם ... וְגַם
  choice: Lagi pula ... dan ... juga
  rationale: Rangkaian partikel ini bersifat menambahkan dan menegaskan bahwa rombongan itu sudah membawa semua perbekalan. Susunan Indonesia dibuat alami tanpa menghilangkan pengulangan penekanan.
- source_word: תֶּבֶן
  choice: jerami
  rationale: Menunjuk pada jerami yang dapat dipakai sebagai makanan atau alas bagi hewan.
- source_word: מִסְפּוֹא
  choice: pakan
  rationale: Istilah Indonesia modern dan jelas untuk makanan ternak, serta membedakannya dari roti dan anggur bagi manusia.
- source_word: לַחֲמוֹרֵינוּ
  choice: untuk keledai-keledai kami
  rationale: Mempertahankan bentuk jamak dan akhiran milik orang pertama jamak.
- source_word: לֶחֶם וָיַיִן
  choice: roti dan anggur
  rationale: Mempertahankan kedua jenis perbekalan yang disebut secara konkret.
- source_word: יֶשׁ לִי
  choice: ada ... untuk aku
  rationale: Mempertahankan konstruksi eksistensial bahasa Ibrani dan penekanan pada tersedianya perbekalan.
- source_word: אֲמָתֶךָ
  choice: hambamu yang perempuan
  rationale: Mempertahankan jenis kelamin dan ungkapan merendahkan diri di hadapan calon tuan rumah tanpa memakai istilah arkais.
- source_word: לַנַּעַר
  choice: untuk pemuda
  rationale: נַעַר dapat berarti pemuda atau pelayan muda; 'pemuda' mempertahankan keluasan maknanya dalam konteks ini.
- source_word: עִם עֲבָדֶיךָ
  choice: yang bersama hamba-hambamu
  rationale: Mempertahankan akhiran orang kedua tunggal dalam teks Masoret serta hubungan frasa ini dengan pemuda, tanpa membetulkan ke bentuk yang dianggap lebih mudah.
- source_word: אֵין מַחְסוֹר כָּל דָּבָר
  choice: Kami tidak kekurangan apa pun
  rationale: Ungkapan idiomatis ini menyatakan kecukupan penuh; bentuk Indonesia ini alami dan menjaga maksud sumber.
