translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “pakan” dipilih karena lebih lazim daripada “makanan ternak” dalam pasangan ringkas dengan “jerami”. Pergantian “kami” ke “aku” mengikuti perbedaan bentuk orang dalam sumber.
