base_translation:
  language: en
  yaml_path: translation/ot/judges/019/023.yaml
  text: Then the man[a], the master of the house, went out to them and said to them, “No, my brothers, please do not act wickedly. Since this man has come into my house, do not do this disgraceful thing.”
translation:
  language: id
  text: Lalu laki-laki pemilik rumah itu keluar menemui mereka dan berkata, “Jangan, saudara-saudaraku! Tolong, jangan berbuat jahat. Karena orang ini telah datang ke rumahku, jangan lakukan perbuatan keji ini.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perbuatan memalukan ini” atau “tindakan yang keterlaluan ini.” Istilah Ibrani tersebut menunjuk kepada perbuatan yang memalukan dan sangat tercela secara moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעַל הַבַּיִת
  choice: pemilik rumah itu
  rationale: Ungkapan ini menunjuk kepada laki-laki yang berkuasa atas rumah tangga tersebut. “Pemilik rumah” alami dalam bahasa Indonesia dan tidak menimbulkan kemungkinan bahwa ia sekadar penjamu.
- source_word: אַחַי
  choice: saudara-saudaraku
  rationale: Terjemahan langsung bentuk maskulin ini mempertahankan sapaan kepada sesama laki-laki sekotanya, sekaligus menyampaikan nada permohonan.
- source_word: תָּרֵעוּ
  choice: jangan berbuat jahat
  rationale: Kata kerja רעע di sini menyatakan larangan moral yang kuat; “berbuat jahat” jelas dan alami dalam bahasa Indonesia modern.
- source_word: נָא
  choice: tolong
  rationale: Partikel ini menambahkan nada permohonan yang mendesak; “tolong” merupakan padanan Indonesia yang alami.
- source_word: אַחֲרֵי אֲשֶׁר בָּא ... אֶל־בֵּיתִי
  choice: Karena orang ini telah datang ke rumahku
  rationale: Dalam konteks ini konstruksi tersebut menyatakan keadaan yang memperberat pelanggaran, yaitu bahwa tamu itu telah berada di bawah perlindungan rumah si pembicara. “Karena” menyampaikan hubungan kontekstual itu secara alami, tanpa menambahkan penjelasan tentang adat keramahtamahan.
- source_word: הַנְּבָלָה הַזֹּאת
  choice: perbuatan keji ini
  rationale: נְבָלָה menunjuk kepada tindakan memalukan dan sangat tercela secara moral. “Perbuatan keji” mempertahankan bobot moralnya dan mudah dipahami pembaca modern.
- source_word: וַיֵּצֵא אֲלֵיהֶם
  choice: keluar menemui mereka
  rationale: Frasa ini menerjemahkan gerak keluar menuju kelompok tersebut dengan idiom Indonesia yang alami.
