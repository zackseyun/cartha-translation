  source_fidelity: Terjemahan dengan setia menyampaikan urutan naratif, identitas pembicara sebagai laki-laki yang berwenang atas rumah tangga, larangan moral yang mendesak, dan kecaman terhadap perbuatan yang memalukan atau tercela. “Karena orang ini telah datang ke rumahku” menangkap fungsi kontekstual אַחֲרֵי אֲשֶׁר secara wajar, yakni keadaan kedatangan tamu yang memperberat pelanggaran, tanpa memasukkan penjelasan adat di luar teks.
  naturalness: Bahasa Indonesia baku dan modern. “Keluar menemui mereka,” “saudara-saudaraku,” “tolong,” dan “jangan berbuat jahat” terdengar jelas serta sesuai dengan register dialog naratif. Susunan “laki-laki pemilik rumah itu” sedikit padat, tetapi tetap gramatikal dan dapat dipahami secara alami sebagai penjelasan identitas tokoh.
  terminology: “Pemilik rumah,” “saudara-saudaraku,” “berbuat jahat,” dan “perbuatan keji ini” merupakan padanan yang tepat dan tidak memaksakan penafsiran teologis. Catatan kaki pada “perbuatan keji ini” secara tepat menjelaskan rentang makna נְבָלָה, termasuk unsur rasa malu dan kecaman moral.
