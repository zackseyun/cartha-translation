base_translation:
  language: en
  yaml_path: translation/ot/judges/019/004.yaml
  text: And his father-in-law[a], the young woman's father, urged him to stay, and he remained with him three days; and they ate and drank, and spent the nights there.
translation:
  language: id
  text: Lalu mertuanya, ayah perempuan muda itu, mendesaknya untuk tinggal[a]. Maka ia tinggal bersamanya selama tiga hari. Mereka makan dan minum serta bermalam di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “terus membujuknya”, “menekannya”, atau “menahannya”. Ungkapan Ibrani ini secara harfiah mengatakan bahwa mertuanya “bersikap kuat terhadapnya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק בּוֹ
  choice: mendesaknya untuk tinggal
  rationale: Ungkapan חזק ב secara harfiah menggambarkan tindakan 'berlaku kuat terhadap' seseorang. Dalam konteks ini, ungkapan tersebut menyatakan desakan agar orang Lewi itu tetap tinggal; terjemahan ini memperjelas maksud yang tersirat tanpa menyiratkan paksaan fisik.
- source_word: חֹתְנוֹ
  choice: mertuanya
  rationale: Istilah ini menyatakan hubungan kekerabatan melalui perkawinan dari sudut pandang orang Lewi. 'Mertua' adalah sebutan Indonesia yang alami, dan frasa berikutnya menjelaskan bahwa yang dimaksud ialah ayah perempuan itu.
- source_word: אֲבִי הַנַּעֲרָה
  choice: ayah perempuan muda itu
  rationale: Frasa aposisional ini memperjelas identitas sang mertua. נַעֲרָה diterjemahkan 'perempuan muda' agar sesuai dengan konteks perkawinan dan tidak memberi kesan bahwa ia masih anak-anak.
- source_word: וַיֵּשֶׁב אִתּוֹ
  choice: Maka ia tinggal bersamanya
  rationale: Dalam konteks perjalanan dan persinggahan, ישב berarti tetap tinggal atau menetap untuk sementara. 'Maka' menyatakan hubungan naratif dengan desakan sebelumnya tanpa menjadikannya lebih tegas daripada teks.
- source_word: שְׁלֹשֶׁת יָמִים
  choice: selama tiga hari
  rationale: Ungkapan waktu ini diterjemahkan langsung dan alami dalam bahasa Indonesia.
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: Mereka makan dan minum
  rationale: Kedua verba sederhana dipertahankan, bukan diringkas secara interpretatif menjadi 'berpesta'.
- source_word: וַיָּלִינוּ שָׁם
  choice: serta bermalam di sana
  rationale: לון secara khusus berarti melewatkan malam atau menginap. Dalam rangkaian tiga hari, bentuk naratif jamak menyiratkan bahwa mereka bermalam di sana selama masa tersebut.
