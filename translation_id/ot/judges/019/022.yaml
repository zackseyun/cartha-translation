  text: הֵמָּה֮ מֵיטִיבִ֣ים אֶת לִבָּ/ם֒ וְ/הִנֵּה֩ אַנְשֵׁ֨י הָ/עִ֜יר אַנְשֵׁ֣י בְנֵֽי בְלִיַּ֗עַל נָסַ֨בּוּ֙ אֶת הַ/בַּ֔יִת מִֽתְדַּפְּקִ֖ים עַל הַ/דָּ֑לֶת וַ/יֹּאמְר֗וּ אֶל הָ֠/אִישׁ בַּ֣עַל הַ/בַּ֤יִת הַ/זָּקֵן֙ לֵ/אמֹ֔ר הוֹצֵ֗א אֶת הָ/אִ֛ישׁ אֲשֶׁר בָּ֥א אֶל בֵּיתְ/ךָ֖ וְ/נֵדָעֶֽ/נּוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/022.yaml
  text: While they were making their hearts merry[a], behold, the men of the city, worthless men, surrounded the house, pounding on the door. They said to the old man, the master of the house, “Bring out the man who came into your house[b], so that we may know him.”
translation:
  language: id
  text: Ketika mereka sedang bersukaria, tampaklah kaum lelaki kota itu, orang-orang dursila[a], mengepung rumah itu sambil menggedor-gedor pintu. Mereka berkata kepada laki-laki tua itu, pemilik rumah tersebut, “Bawa keluar orang yang datang ke rumahmu supaya kami mengenalnya.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “anak-anak ketidakbergunaan”; yaitu sebutan bagi orang-orang fasik atau tidak bermoral.
    reason: lexical_alternative
  - marker: b
    text: “Mengenalnya” merupakan eufemisme seksual. Dalam konteks ini, maksud mereka ialah melakukan kekerasan seksual terhadapnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵיטִיבִים אֶת לִבָּם
  choice: sedang bersukaria
  rationale: Ungkapan Ibrani ini secara harfiah berarti ‘membuat hati mereka baik’ dan dalam konteks menggambarkan kegembiraan dalam perjamuan. ‘Bersukaria’ menyampaikan idiom itu secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: וְהִנֵּה
  choice: tiba-tiba
  rationale: Penanda wacana ini menonjolkan perubahan adegan yang mendadak. ‘Tiba-tiba’ lebih alami dalam narasi Indonesia modern daripada ‘lihatlah’ tanpa menghilangkan daya kejutnya.
- source_word: אַנְשֵׁי הָעִיר אַנְשֵׁי בְנֵי בְלִיַּעַל
  choice: orang-orang kota itu, yaitu orang-orang bejat
  rationale: Frasa pertama mengidentifikasi mereka sebagai kaum lelaki kota tersebut, sedangkan idiom ‘anak-anak belial/ketiadaan nilai’ menilai kebejatan moral mereka. ‘Orang-orang bejat’ alami dan cukup kuat tanpa memasukkan tafsiran denominatif.
- source_word: נָסַבּוּ אֶת הַבַּיִת
  choice: mengepung rumah itu
  rationale: Kata kerja ini menyatakan tindakan mengelilingi rumah; ‘mengepung’ juga menyampaikan sifat mengancam dari tindakan tersebut.
- source_word: מִתְדַּפְּקִים עַל הַדָּלֶת
  choice: menggedor-gedor pintunya
  rationale: Bentuk partisip refleksif/intensif menunjukkan pukulan keras yang berulang. Reduplikasi ‘menggedor-gedor’ menangkap aspek berulang dan agresif itu.
- source_word: בַּעַל הַבַּיִת הַזָּקֵן
  choice: orang tua pemilik rumah itu
  rationale: הַזָּקֵן di sini menunjuk usia, bukan jabatan penatua, dan בַּעַל הַבַּיִת menyatakan orang yang memiliki atau menguasai rumah. Susunan ini jelas dalam bahasa Indonesia.
- source_word: הוֹצֵא
  choice: Bawa keluar
  rationale: Imperatif ini menuntut agar tamu tersebut dibawa ke luar rumah; padanan ini langsung dan alami.
- source_word: וְנֵדָעֶנּוּ
  choice: supaya kami mengenal dia
  rationale: Teks Ibrani memakai kata ‘mengenal’ sebagai eufemisme seksual. Terjemahan utama mempertahankan ungkapan dan kaitan sastranya dengan Kejadian 19, sedangkan catatan kaki menjelaskan maksudnya.
theological_decisions:
- issue: Makna eufemisme seksual וְנֵדָעֶנּוּ
  choice: Mempertahankan ‘supaya kami mengenal dia’ dalam teks utama dan menjelaskan maksud seksualnya dalam catatan kaki.
  alternative: ‘supaya kami bersetubuh dengan dia’ atau ‘supaya kami memerkosa dia’
  rationale: Kata ידע memang berfungsi sebagai eufemisme seksual di sini. Mempertahankan bentuk eufemistis menghormati pilihan kata sumber dan gema Kejadian 19, sementara catatan menjamin bahwa ancaman kekerasan seksual tidak tersamarkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. ‘Bersukaria’ mempertahankan warna idiomatik tanpa terdengar kuno; ‘menggedor-gedor’ memberi gambaran tindakan keras dan berulang. Semua penanda catatan kaki muncul dalam teks utama.
