id: JDG.19.1
reference: Judges 19:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִי֙ בַּ/יָּמִ֣ים הָ/הֵ֔ם וּ/מֶ֖לֶךְ אֵ֣ין בְּ/יִשְׂרָאֵ֑ל וַ/יְהִ֣י אִ֣ישׁ לֵוִ֗י גָּ֚ר בְּ/יַרְכְּתֵ֣י הַר אֶפְרַ֔יִם וַ/יִּֽקַּֽח ל/וֹ֙ אִשָּׁ֣ה פִילֶ֔גֶשׁ מִ/בֵּ֥ית לֶ֖חֶם יְהוּדָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/001.yaml
  text: And it happened in those days[a], when there was no king in Israel, that a Levite man was dwelling in the remote parts of the hill country of Ephraim, and he took for himself a woman, a concubine[b], from Bethlehem in Judah.
translation:
  language: id
  text: Pada masa itu[a], ketika tidak ada raja di Israel, seorang Lewi tinggal di daerah terpencil di pegunungan Efraim. Ia mengambil bagi dirinya seorang perempuan sebagai gundik[b] dari Betlehem di Yehuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Pada masa itu, tidak ada raja di Israel.” Dalam bahasa Ibrani, bagian ini memakai klausa sejajar yang dapat dipahami sebagai pernyataan tersendiri atau sebagai latar waktu.
    reason: alternative_reading
  - marker: b
    text: “Gundik” adalah perempuan dalam ikatan yang diakui, tetapi dengan kedudukan sosial lebih rendah daripada istri; bukan sekadar pasangan hubungan sementara.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: Pada masa itu
  rationale: Rumus naratif Ibrani membuka episode baru. Ungkapan ini alami dalam bahasa Indonesia modern dan mempertahankan latar waktu tanpa memakai bentuk yang kuno.
- source_word: וּמֶלֶךְ אֵין בְּיִשְׂרָאֵל
  choice: ketika tidak ada raja di Israel
  rationale: Walaupun secara bentuk merupakan klausa koordinatif, klausa ini dapat berfungsi sebagai latar waktu. Pilihan ini mempertahankan refrein kitab Hakim-Hakim tanpa menambahkan penilaian terhadap sistem kerajaan.
- source_word: אִישׁ לֵוִי
  choice: seorang Lewi
  rationale: Dalam bahasa Indonesia, sebutan 'seorang Lewi' sudah secara wajar menunjuk kepada seorang laki-laki dari golongan Lewi; menerjemahkan אִישׁ secara terpisah akan terasa berlebihan.
- source_word: גָּר
  choice: tinggal sebagai pendatang
  rationale: Kata גור dapat menunjukkan tinggal di suatu tempat dengan kedudukan sebagai pendatang atau penghuni yang bukan warga asal. Terjemahan ini mempertahankan nuansa tersebut tanpa menyiratkan secara pasti bahwa masa tinggalnya singkat.
- source_word: בְּיַרְכְּתֵי הַר אֶפְרַיִם
  choice: di daerah terpencil di pegunungan Efraim
  rationale: יַרְכְּתֵי menunjuk bagian ujung, belakang, atau pelosok, sedangkan הַר אֶפְרַיִם adalah kawasan pegunungan, bukan satu gunung tertentu.
- source_word: וַיִּקַּח לוֹ
  choice: Ia mengambil bagi dirinya
  rationale: Ungkapan ini mempertahankan unsur refleksif לוֹ dan bahasa relasional sumber, tanpa memperhalus tindakan tokoh menjadi rumusan yang lebih interpretatif.
- source_word: אִשָּׁה פִילֶגֶשׁ
  choice: seorang perempuan sebagai gundik
  rationale: 'Terjemahan mempertahankan kedua unsur: אִשָּׁה, ''perempuan'', dan פִילֶגֶשׁ, status sosial-relasionalnya sebagai gundik.'
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: dari Betlehem di Yehuda
  rationale: Frasa geografis ini membedakan Betlehem di wilayah Yehuda dari tempat lain yang bernama sama.
theological_decisions:
- issue: Refrein tentang tidak adanya raja di Israel
  choice: ketika tidak ada raja di Israel
  alternative: dan tidak ada raja di Israel
  rationale: Bentuk temporal menghasilkan bahasa Indonesia yang lancar, tetapi catatan kaki mempertahankan kemungkinan bahwa klausa Ibrani dibaca sebagai pernyataan koordinatif tersendiri. Tidak ditambahkan kesimpulan bahwa teks sedang mendukung atau menolak monarki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Gundik' dipertahankan sebagai istilah status sosial kuno dan dijelaskan dalam catatan. Susunan kalimat dibagi menjadi dua agar alami, sambil menjaga urutan informasi dan ketegangan naratif teks Ibrani.
