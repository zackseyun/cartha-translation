  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan naratif dibuat alami, sedangkan idiom “kuatkanlah hatimu” dan peralihan dari sapaan tunggal ke kata kerja jamak dipertahankan agar ciri teks Ibrani tetap terlihat.
