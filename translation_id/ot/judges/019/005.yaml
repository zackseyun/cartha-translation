  text: וַֽ/יְהִי֙ בַּ/יּ֣וֹם הָ/רְבִיעִ֔י וַ/יַּשְׁכִּ֥ימוּ בַ/בֹּ֖קֶר וַ/יָּ֣קָם לָ/לֶ֑כֶת וַ/יֹּאמֶר֩ אֲבִ֨י הַֽ/נַּעֲרָ֜ה אֶל חֲתָנ֗/וֹ סְעָ֧ד לִבְּ/ךָ֛ פַּת לֶ֖חֶם וְ/אַחַ֥ר תֵּלֵֽכוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/019/005.yaml
  text: On the fourth day[a], they rose early in the morning, and he got up to go. But the young woman’s father said to his son-in-law, “Refresh your heart with a morsel of bread[b], and afterward you may go.”
translation:
  language: id
  text: Pada hari keempat, mereka bangun pagi-pagi, dan ia bangkit untuk pergi. Namun, ayah perempuan muda itu berkata kepada menantunya, “Kuatkanlah hatimu dengan sepotong roti,[a] dan sesudah itu kalian boleh pergi.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Kuatkanlah hatimu dengan sepotong roti.” Ungkapan ini berarti memulihkan atau menopang tenaga dengan makan.
    reason: lexical_alternative
  - marker: b
    text: Kata kerja “pergi” berbentuk jamak dalam bahasa Ibrani dan tampaknya mengacu kepada seluruh rombongan, meskipun sang ayah berbicara langsung kepada menantunya.
    reason: grammatical_clarification
lexical_decisions:
- source_word: בַּיּוֹם הָרְבִיעִי
  choice: Pada hari keempat
  rationale: Ungkapan waktu ini diterjemahkan secara langsung tanpa menambahkan keterangan yang tidak dinyatakan dalam teks.
- source_word: וַיַּשְׁכִּימוּ בַבֹּקֶר
  choice: mereka bangun pagi-pagi
  rationale: Bentuk jamak dipertahankan, dan ungkapan Indonesia ini menyampaikan tindakan bangun sejak dini secara alami.
- source_word: וַיָּקָם לָלֶכֶת
  choice: ia bangkit untuk pergi
  rationale: Bentuk tunggal menandai peralihan fokus kepada laki-laki itu; terjemahan ini mempertahankan tujuan tindakannya tanpa menambahkan bahwa ia benar-benar telah berangkat.
- source_word: אֲבִי הַנַּעֲרָה
  choice: ayah perempuan muda itu
  rationale: נַעֲרָה di sini menunjuk kepada seorang perempuan muda; pilihan ini wajar dalam bahasa Indonesia dan tidak memberi kesan usia yang terlalu muda.
- source_word: חֲתָנוֹ
  choice: menantunya
  rationale: Dalam konteks ini kata tersebut menyatakan hubungan sang ayah dengan laki-laki itu sebagai menantunya.
- source_word: סְעָד לִבְּךָ
  choice: Kuatkanlah hatimu
  rationale: Terjemahan ini mempertahankan citra harfiah idiom Ibrani, sementara konteks makan menjelaskan bahwa maksudnya ialah memulihkan atau menopang tenaga.
- source_word: פַּת לֶחֶם
  choice: sepotong roti
  rationale: Pilihan ini mempertahankan gambaran konkret tentang sebagian kecil roti dan terdengar alami dalam bahasa Indonesia modern.
- source_word: וְאַחַר תֵּלֵכוּ
  choice: lalu sesudah itu kalian boleh pergi
  rationale: Kata kerja Ibrani berbentuk jamak, sehingga “kalian” mempertahankan rujukan kepada rombongan, meskipun ucapan itu secara langsung ditujukan kepada sang menantu.
