base_translation:
  language: en
  yaml_path: translation/ot/judges/019/008.yaml
  text: He got up early in the morning on the fifth day to go[a], but the young woman's father said, “Please strengthen your heart with a morsel of food, and wait until the day declines.” So the two of them ate.
translation:
  language: id
  text: Pagi-pagi pada hari kelima, ia bangun untuk pergi. Lalu ayah perempuan muda itu berkata, “Silakan makan dahulu agar tenagamu pulih[a], lalu tinggallah kalian sampai hari mulai petang.” Maka mereka berdua makan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kuatkanlah hatimu.” Ini adalah ungkapan untuk makan agar tenaga pulih.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם בַּבֹּקֶר
  choice: ia bangun pagi-pagi
  rationale: Ungkapan ini menyatakan bangun atau memulai kegiatan pada pagi hari. “Bangun pagi-pagi” alami dalam bahasa Indonesia dan mempertahankan penekanan waktunya.
- source_word: בַּיּוֹם הַחֲמִישִׁי
  choice: Pada hari kelima
  rationale: Terjemahan langsung dan wajar untuk keterangan waktu dalam rangkaian narasi.
- source_word: לָלֶכֶת
  choice: untuk pergi
  rationale: Kata הלך pada dasarnya berarti “pergi”. Konteks menyiratkan keberangkatan, tetapi “pergi” tetap dekat dengan bentuk Ibrani.
- source_word: אֲבִי הַנַּעֲרָה
  choice: ayah perempuan muda itu
  rationale: נַעֲרָה dapat berarti gadis atau perempuan muda. Dalam konteks hubungan perkawinan, “perempuan muda” lebih tepat dan tidak bernada kekanak-kanakan.
- source_word: סְעָד נָא לְבָבְךָ
  choice: Pulihkanlah tenagamu dahulu
  rationale: Secara harfiah ungkapan ini berbicara tentang menopang atau menguatkan hati, tetapi dalam konteks makan maksudnya memulihkan tenaga. “Dahulu” secara alami menyampaikan partikel permohonan נָא dalam ajakan tuan rumah; citra harfiahnya dicatat dalam catatan kaki.
- source_word: וְהִתְמַהְמְהוּ
  choice: lalu tunggulah kalian
  rationale: Bentuk jamak ini mengajak rombongan untuk menunda keberangkatan. Kata “kalian” mempertahankan peralihan dari sapaan tunggal pada klausa sebelumnya ke bentuk jamak di sini.
- source_word: עַד נְטוֹת הַיּוֹם
  choice: sampai hari mulai petang
  rationale: Ungkapan ini secara idiomatis menggambarkan hari yang condong atau beralih menuju petang. Pilihan ini alami sekaligus mempertahankan gerak waktunya.
- source_word: וַיֹּאכְלוּ שְׁנֵיהֶם
  choice: Maka, mereka berdua makan
  rationale: “Mereka berdua” mempertahankan penegasan eksplisit שְׁנֵיהֶם, sedangkan “maka” menunjukkan bahwa tindakan itu merupakan tanggapan atas ajakan sang ayah.
