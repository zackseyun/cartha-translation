base_translation:
  language: en
  yaml_path: translation/ot/judges/019/014.yaml
  text: So they passed on and went their way[a], and the sun set on them near Gibeah, which belongs to Benjamin.
translation:
  language: id
  text: Mereka pun berlalu dan melanjutkan perjalanan. Matahari terbenam ketika mereka berada dekat Gibea, yang termasuk wilayah Benyamin.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang menjadi milik Benyamin.” Frasa Ibrani mengaitkan Gibea dengan suku atau wilayah Benyamin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: melewati tempat itu
  rationale: Bentuk dari עבר dalam rangkaian narasi menunjukkan bahwa mereka tidak berhenti di tempat yang sebelumnya dipertimbangkan, melainkan melewatinya.
- source_word: וַיֵּלֵכוּ
  choice: melanjutkan perjalanan
  rationale: Menerjemahkan verba gerak kedua secara tersendiri tanpa menghasilkan pengulangan yang kaku dalam bahasa Indonesia.
- source_word: וַתָּבֹא לָהֶם הַשֶּׁמֶשׁ
  choice: Matahari terbenam ketika mereka berada
  rationale: Ungkapan harfiah 'matahari datang kepada mereka' menyatakan bahwa matahari terbenam atau malam menyusul mereka dalam perjalanan; pilihan ini menyampaikan idiom tersebut secara alami.
- source_word: אֵצֶל
  choice: dekat
  rationale: Preposisi ini menyatakan kedekatan lokasi.
- source_word: הַגִּבְעָה
  choice: Gibea
  rationale: Dalam konteks ini kata tersebut adalah nama tempat, bukan sekadar kata umum 'bukit'; ejaan Gibea mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: אֲשֶׁר לְבִנְיָמִן
  choice: yang termasuk wilayah Benyamin
  rationale: Frasa ini mengaitkan Gibea dengan suku atau wilayah Benyamin tanpa memaksakan pengertian kepemilikan pribadi.
- source_word: בִנְיָמִן
  choice: Benyamin
  rationale: Nama suku ini memakai bentuk yang mapan dan alami dalam bahasa Indonesia.
