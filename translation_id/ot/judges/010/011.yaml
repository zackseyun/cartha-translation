base_translation:
  language: en
  yaml_path: translation/ot/judges/010/011.yaml
  text: And Yahweh said to the sons of Israel[a], “Was it not from Egypt, and from the Amorites, and from the Ammonites, and from the Philistines[b], that I delivered you?"
translation:
  language: id
  text: Lalu Yahweh berkata kepada orang Israel[a], “Bukankah Aku telah membebaskan kalian[b] dari Mesir, dari orang Amori, dari orang Amon, dan dari orang Filistin?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Israel”; ungkapan ini digunakan sebagai sebutan kolektif bagi orang Israel.'
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani ayat ini berbentuk eliptis dan tidak menyebutkan kata kerja “membebaskan”; kata itu disediakan berdasarkan konteks kalimat dan ayat-ayat berikutnya.
    reason: source_ellipsis
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk naratif wayyiqtol dari אמר memperkenalkan kelanjutan peristiwa dan ucapan langsung; “lalu ... berkata” wajar dalam narasi Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga identitas nama dalam teks sumber tetap dipertahankan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah berarti “anak-anak lelaki Israel”, tetapi dalam konteks ini merupakan sebutan kolektif bagi umat Israel; “orang Israel” menyampaikan maknanya secara alami dalam bahasa Indonesia modern.
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Gabungan partikel tanya dan negasi memperkenalkan pertanyaan retoris yang mengharapkan jawaban membenarkan.
- source_word: מִמִּצְרַיִם
  choice: dari Mesir
  rationale: Preposisi מִן menyatakan asal atau pihak yang darinya Israel dibebaskan; “dari” juga menjaga kesejajaran daftar.
- source_word: הָאֱמֹרִי
  choice: orang Amori
  rationale: Bentuk tunggal kolektif menunjuk kepada kelompok etnis Amori; padanan kolektif Indonesia yang alami ialah “orang Amori”.
- source_word: בְּנֵי עַמּוֹן
  choice: bani Amon
  rationale: Ungkapan harfiah “anak-anak Amon” merupakan nama kelompok etnis; “bani Amon” adalah bentuk Indonesia yang ringkas dan lazim dalam register Alkitab.
- source_word: פְּלִשְׁתִּים
  choice: orang Filistin
  rationale: Padanan Indonesia yang baku dan alami untuk nama bangsa berbentuk jamak ini.
- source_word: '[kata kerja tersirat dari konteks]'
  choice: Aku telah menyelamatkan kalian
  rationale: Ayat Ibrani ini eliptis dan hanya mencantumkan pihak-pihak yang darinya Israel dibebaskan. Kata kerja disediakan dari konteks dekat agar kalimat Indonesia lengkap, tanpa mengubah arah pertanyaan retoris.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Mempertahankan nama diri yang terdapat dalam teks Ibrani, alih-alih menggantinya dengan sebuah gelar.
- issue: Makna kata kerja yang tersirat dalam pertanyaan eliptis
  choice: menyelamatkan
  alternative: membebaskan
  rationale: Konteks para hakim berbicara tentang tindakan Allah melepaskan Israel dari para penindas. “Menyelamatkan” cukup luas untuk mempertahankan tema tersebut tanpa membatasinya pada satu jenis pembebasan; catatan kaki menjelaskan bahwa kata kerjanya tersirat.
- issue: Sapaan jamak kepada Israel
  choice: kalian
  alternative: kamu
  rationale: Rujukannya adalah umat Israel secara kolektif dan bentuk Ibraninya jamak. “Kalian” membuat jumlah jamak itu jelas dalam bahasa Indonesia modern.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur pertanyaan retoris dipertahankan dengan “Bukankah”, sedangkan pengulangan “dari” mencerminkan susunan daftar Ibrani. Istilah “bani Amon” mempertahankan sedikit warna historis-Alkitabiah tanpa membuat kalimat terasa kuno.
