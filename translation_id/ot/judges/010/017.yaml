base_translation:
  language: en
  yaml_path: translation/ot/judges/010/017.yaml
  text: Then the Ammonites were summoned and camped in Gilead[a], and the sons of Israel gathered together and camped at Mizpah.
translation:
  language: id
  text: Kemudian orang-orang Amon dikerahkan dan berkemah di Gilead,[a] dan orang-orang Israel berkumpul dan berkemah di Mizpa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Kemudian orang-orang Amon berseru dan berkemah di Gilead.” Kata kerja Ibrani yang dipakai dapat berarti “berseru”, meskipun dalam konteks ini kemungkinan merujuk pada pengerahan untuk berperang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּעֲקוּ
  choice: dikerahkan
  rationale: Kata kerja צעק biasanya berarti 'berseru', tetapi dalam konteks militer yang langsung diikuti tindakan berkemah, bentuk ini kemungkinan menggambarkan pengerahan pasukan. Terjemahan 'dikerahkan' menyampaikan makna kontekstual tersebut tanpa menghilangkan kemungkinan harfiahnya, yang dicatat dalam catatan kaki.
- source_word: בְּנֵי עַמּוֹן
  choice: orang-orang Amon
  rationale: Ungkapan harfiahnya 'anak-anak Amon', tetapi di sini menunjuk kepada kelompok bangsa; 'orang-orang Amon' alami dan jelas dalam bahasa Indonesia.
- source_word: וַיַּחֲנוּ
  choice: berkemah
  rationale: Kata חנה berarti mendirikan atau menempati perkemahan; 'berkemah' alami dan tetap mempertahankan latar militer.
- source_word: בַּגִּלְעָד
  choice: di Gilead
  rationale: Preposisi ב dengan nama wilayah paling wajar diterjemahkan 'di'.
- source_word: וַיֵּאָסְפוּ
  choice: berkumpul
  rationale: Kata אסף menyatakan tindakan berhimpun atau berkumpul; dalam konteks ini menunjuk pada mobilisasi bersama orang Israel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang-orang Israel
  rationale: Ungkapan harfiahnya 'anak-anak Israel', tetapi berfungsi sebagai sebutan kolektif bagi bangsa Israel. 'Orang-orang Israel' mempertahankan sifat kolektif dan terdengar alami dalam bahasa Indonesia.
- source_word: בַּמִּצְפָּה
  choice: di Mizpa
  rationale: Preposisi ב menunjukkan lokasi perkemahan; 'di Mizpa' merupakan ungkapan tempat yang alami dalam bahasa Indonesia.
