translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Konjungsi 'sedangkan' menandai gerakan dua pihak yang berhadapan tanpa menambahkan penafsiran teologis. Bentuk nama 'Mizpa' mengikuti ejaan Indonesia yang lazim.
