  text: וַ/יֹּאמְר֨וּ הָ/עָ֜ם שָׂרֵ֤י גִלְעָד֙ אִ֣ישׁ אֶל רֵעֵ֔/הוּ מִ֣י הָ/אִ֔ישׁ אֲשֶׁ֣ר יָחֵ֔ל לְ/הִלָּחֵ֖ם בִּ/בְנֵ֣י עַמּ֑וֹן יִֽהְיֶ֣ה לְ/רֹ֔אשׁ לְ/כֹ֖ל יֹשְׁבֵ֥י גִלְעָֽד־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/018.yaml
  text: And the people[a], the leaders of Gilead, said to one another, “Who is the man who will begin to fight against the sons of Ammon? He shall become head over all the inhabitants of Gilead.”
translation:
  language: id
  text: Kemudian rakyat, yakni para pemimpin Gilead,[a] berkata satu sama lain, “Siapakah laki-laki yang akan mulai berperang melawan bani Amon? Dialah yang akan menjadi pemimpin atas seluruh penduduk Gilead.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani menempatkan “rakyat” dan “para pemimpin Gilead” berdampingan tanpa kata penghubung. Susunannya dapat dipahami secara aposisional seperti dalam teks utama; sebagian terjemahan hanya menyebut “para pemimpin Gilead”.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: הָעָם שָׂרֵי גִלְעָד
  choice: rakyat, yakni para pemimpin Gilead
  rationale: 'Kedua unsur Ibrani dipertahankan dan dipahami secara aposisional: rakyat yang berbicara itu dijelaskan sebagai para pemimpin Gilead. Kata “yakni” membuat hubungan yang tidak dinyatakan secara eksplisit dalam bahasa Ibrani menjadi wajar dalam bahasa Indonesia tanpa menghapus ketegangan sintaksisnya; kemungkinan lain dicatat dalam catatan kaki.'
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: satu sama lain
  rationale: Ungkapan harfiah “seorang kepada sesamanya” bersifat distributif dan menyatakan percakapan timbal balik. “Satu sama lain” merupakan padanan Indonesia yang alami.
- source_word: מִי הָאִישׁ
  choice: Siapakah laki-laki
  rationale: Mempertahankan unsur maskulin eksplisit אִישׁ dalam konteks pemilihan seorang pemimpin perang, sekaligus memakai bentuk tanya yang alami dalam bahasa Indonesia.
- source_word: יָחֵל לְהִלָּחֵם
  choice: akan mulai berperang
  rationale: Bentuk Hifil יָחֵל berarti “mulai”, sedangkan לְהִלָּחֵם mengacu pada tindakan berperang. “Akan” sesuai dengan pertanyaan tentang tindakan yang belum dilakukan.
- source_word: בִּבְנֵי עַמּוֹן
  choice: melawan bani Amon
  rationale: בְּ dalam konteks verba perang berarti “melawan”. “Bani Amon” mempertahankan bentuk etnonim harfiah “anak-anak Amon” dalam ungkapan Indonesia yang sudah lazim dan bermartabat.
- source_word: יִהְיֶה לְרֹאשׁ
  choice: Dialah yang akan menjadi pemimpin
  rationale: רֹאשׁ secara harfiah berarti “kepala”, tetapi di sini menunjuk pada kedudukan kepemimpinan. Konstruksi “dialah” menyampaikan penegasan bahwa orang yang memulai pertempuran itu akan memperoleh kedudukan tersebut.
- source_word: לְכֹל יֹשְׁבֵי גִלְעָד
  choice: atas seluruh penduduk Gilead
  rationale: Menyampaikan cakupan wewenang atas semua orang yang tinggal di Gilead dengan bahasa Indonesia modern dan jelas.
theological_decisions:
- issue: Bahasa maskulin eksplisit dalam pemilihan pemimpin perang
  choice: Memakai “laki-laki” dalam teks utama
  alternative: “orang” atau “siapa” tanpa penanda gender
  rationale: Teks Ibrani secara eksplisit memakai אִישׁ dan konteksnya adalah pencarian seorang pemimpin militer laki-laki. Penanda gender dipertahankan tanpa menambahkan kesimpulan teologis mengenai kepemimpinan di luar konteks ayat.
- issue: Hubungan antara “rakyat” dan “para pemimpin Gilead”
  choice: 'Memahami frasa kedua sebagai aposisi: “rakyat, yakni para pemimpin Gilead”'
  alternative: “para pemimpin Gilead” saja, atau memahami kedua kelompok sebagai pihak yang berbeda
  rationale: Bahasa Ibrani menempatkan kedua frasa secara berdampingan tanpa kata penghubung. Pembacaan aposisional mempertahankan keduanya dan paling sesuai dengan verba jamak, tetapi ketidaklaziman susunannya tetap diakui melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Bani Amon” dipilih sebagai etnonim yang dekat dengan bentuk Ibrani dan tetap mudah dipahami. “Pemimpin” lebih alami daripada metafora harfiah “kepala” dalam konteks pemerintahan.
