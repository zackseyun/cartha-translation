  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אַתֶּם֙ עֲזַבְתֶּ֣ם אוֹתִ֔/י וַ/תַּעַבְד֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים לָ/כֵ֥ן לֹֽא אוֹסִ֖יף לְ/הוֹשִׁ֥יעַ אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/013.yaml
  text: But you have forsaken me and served other gods[a]; therefore I will no longer save you.
translation:
  language: id
  text: Namun kamu telah meninggalkan Aku dan melayani ilah-ilah lain. Karena itu, Aku tidak akan menyelamatkan kamu lagi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membebaskan kamu” atau “menolong kamu dari bahaya.” Kata kerja Ibrani ini dapat menunjuk pada pembebasan dari musuh maupun penyelamatan dalam arti yang lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: Namun kamu
  rationale: Kata penghubung yang disertai kata ganti eksplisit menyatakan pertentangan sekaligus penekanan dalam konteks. “Namun kamu” menyampaikannya secara alami dalam bahasa Indonesia.
- source_word: עֲזַבְתֶּם אוֹתִי
  choice: telah meninggalkan Aku
  rationale: Kata עזב berarti meninggalkan atau menelantarkan. “Telah meninggalkan” mempertahankan bobot relasional tindakan itu tanpa memakai ungkapan yang terlalu arkais.
- source_word: וַ/תַּעַבְדוּ
  choice: dan melayani
  rationale: Dalam hubungan dengan ilah, עבד menunjuk pada pelayanan dan penyembahan sebagai bentuk kesetiaan. “Melayani” mempertahankan keluasan makna tersebut.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ilah-ilah lain
  rationale: Ungkapan ini secara langsung membedakan ilah-ilah tersebut dari TUHAN. “Ilah-ilah lain” lebih tepat daripada “ilah-ilah asing,” sebab unsur keasingan bukan pokok ungkapan ini.
- source_word: לָכֵן
  choice: Karena itu
  rationale: Menandai akibat atau keputusan yang timbul dari tindakan Israel dengan hubungan sebab-akibat yang jelas.
- source_word: לֹא אוֹסִיף
  choice: tidak akan ... lagi
  rationale: Bentuk יסף dengan penyangkalan menyatakan bahwa tindakan itu tidak akan diteruskan atau dilakukan lagi. Susunan ini idiomatis dalam bahasa Indonesia.
- source_word: לְ/הוֹשִׁיעַ אֶתְ/כֶם
  choice: menyelamatkan kamu
  rationale: Kata ישע dapat berarti menyelamatkan, membebaskan, atau menolong dari bahaya. Dalam konteks Hakim-Hakim, yang dimaksud terutama ialah pembebasan dari penindasan, tetapi “menyelamatkan” tetap mencakup arti tersebut dan mempertahankan keluasan istilah Ibraninya.
theological_decisions:
- issue: Makna tindakan ilahi yang dinyatakan oleh ישע dalam konteks kitab Hakim-Hakim
  choice: menyelamatkan
  alternative: membebaskan; menolong dari bahaya
  rationale: Konteks langsung berbicara tentang pembebasan Israel dari para penindas, tetapi kata Ibraninya memiliki cakupan lebih luas. “Menyelamatkan” mempertahankan cakupan itu tanpa mengubahnya menjadi keselamatan rohani semata; catatan kaki menjelaskan nuansa naratifnya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti ilahi “Aku” dikapitalisasi sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Bentuk “kamu” mewakili orang kedua jamak dalam bahasa Ibrani; konteks menunjukkan bahwa seluruh Israel sedang disapa.
