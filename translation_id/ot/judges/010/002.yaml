  text: Ia memimpin Israel sebagai hakim selama dua puluh tiga tahun. Kemudian ia meninggal dan dimakamkan di Samir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: Ia menghakimi
  rationale: Kata kerja שׁפט dalam kitab Hakim-Hakim menggambarkan tugas seorang hakim yang memimpin Israel. “Menghakimi” mempertahankan istilah khas dan kaitannya dengan sebutan para hakim.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Penanda objek langsung diikuti nama bangsa; diterjemahkan langsung sebagai “Israel”.
- source_word: עֶשְׂרִים וְשָׁלֹשׁ שָׁנָה
  choice: selama dua puluh tiga tahun
  rationale: Ungkapan bilangan dibuat wajar dalam bahasa Indonesia, sedangkan “selama” memperjelas bahwa frasa tersebut menyatakan durasi.
- source_word: וַיָּמָת
  choice: Kemudian ia meninggal
  rationale: Bentuk naratif dengan waw memajukan urutan peristiwa. “Kemudian” menyatakan urutan secara alami tanpa memberi kesan pertentangan.
- source_word: וַיִּקָּבֵר
  choice: dan dimakamkan
  rationale: Bentuk nifal bersifat pasif. “Dimakamkan” mempertahankan kepasifan tanpa menambahkan pelaku.
- source_word: בְּשָׁמִיר
  choice: di Samir
  rationale: Preposisi ב bersifat lokatif, dan nama tempat שָׁמִיר ditransliterasikan secara wajar sebagai “Samir”.
