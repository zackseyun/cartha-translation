id: JDG.10.6
reference: Judges 10:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּסִ֣פוּ בְּנֵ֣י יִשְׂרָאֵ֗ל לַ/עֲשׂ֣וֹת הָ/רַע֮ בְּ/עֵינֵ֣י יְהוָה֒ וַ/יַּעַבְד֣וּ אֶת הַ/בְּעָלִ֣ים וְ/אֶת הָ/עַשְׁתָּר֡וֹת וְ/אֶת אֱלֹהֵ֣י אֲרָם֩ וְ/אֶת אֱלֹהֵ֨י צִיד֜וֹן וְ/אֵ֣ת אֱלֹהֵ֣י מוֹאָ֗ב וְ/אֵת֙ אֱלֹהֵ֣י בְנֵי עַמּ֔וֹן וְ/אֵ֖ת אֱלֹהֵ֣י פְלִשְׁתִּ֑ים וַ/יַּעַזְב֥וּ אֶת יְהוָ֖ה וְ/לֹ֥א עֲבָדֽוּ/הוּ׀־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/006.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[a], and they served the Baals and the Ashtoreths, and the gods of Aram, the gods of Sidon, the gods of Moab, the gods of the sons of Ammon, and the gods of the Philistines[b]. They forsook Yahweh and did not serve him.
translation:
  language: id
  text: Orang Israel kembali melakukan apa yang jahat di mata Yahweh[a]. Mereka melayani para Baal dan para Asytoret, juga dewa-dewa Aram, dewa-dewa Sidon, dewa-dewa Moab, dewa-dewa bani Amon[b], dan dewa-dewa orang Filistin. Mereka meninggalkan Yahweh dan tidak melayani-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “terus melakukan apa yang jahat di mata Yahweh.” Kata kerja Ibrani dapat menyatakan pengulangan atau kelanjutan.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dewa-dewa anak-anak Amon,” yaitu dewa-dewa yang disembah oleh orang Amon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: kembali melakukan
  rationale: Konstruksi יסף dengan infinitif dapat menyatakan pengulangan atau kelanjutan. Dalam rumusan berulang kitab Hakim-Hakim, “kembali melakukan” alami dalam bahasa Indonesia dan mempertahankan nuansa siklus; kemungkinan nuansa kelanjutan dicatat dalam catatan kaki.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Orang Israel
  rationale: Ungkapan idiomatis Indonesia ini merujuk kepada bangsa Israel secara kolektif tanpa menimbulkan kesan bahwa yang dimaksud hanya laki-laki atau keturunan langsung tertentu.
- source_word: לַעֲשׂוֹת הָרַע בְּעֵינֵי יְהוָה
  choice: melakukan apa yang jahat di mata Yahweh
  rationale: Terjemahan ini alami namun tetap mempertahankan metafora evaluatif Ibrani “di mata”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai Yahweh, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: וַיַּעַבְדוּ / עֲבָדוּהוּ
  choice: melayani / melayani-Nya
  rationale: Pemakaian “melayani” pada kedua klausa mempertahankan pengulangan leksikal dan kontras retoris antara kesetiaan kepada dewa-dewa lain dan kepada Yahweh.
- source_word: הַבְּעָלִים
  choice: para Baal
  rationale: Bentuk jamak merujuk pada berbagai perwujudan atau pusat pemujaan Baal. “Para Baal” mempertahankan nama kultis dan bentuk jamaknya.
- source_word: הָעַשְׁתָּרוֹת
  choice: para Asytoret
  rationale: Nama kultis ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia; “para” menyampaikan bentuk jamak Ibrani.
- source_word: אֱלֹהֵי אֲרָם / צִידוֹן / מוֹאָב / פְלִשְׁתִּים
  choice: dewa-dewa Aram / Sidon / Moab / orang Filistin
  rationale: Rangkaian konstruksi Ibrani diterjemahkan secara langsung dan alami, dengan nama wilayah atau kelompok bangsa tetap eksplisit.
- source_word: אֱלֹהֵי בְנֵי עַמּוֹן
  choice: dewa-dewa bani Amon
  rationale: “Bani Amon” secara ringkas mempertahankan unsur harfiah “anak-anak Amon” sekaligus berfungsi sebagai nama kelompok bangsa dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian YHWH. “Yahweh” mempertahankan nama itu dan merupakan transliterasi ilmiah yang luas diterima, tanpa menggantinya dengan gelar.
- issue: Makna עבד dalam konteks penyembahan berhala
  choice: melayani
  alternative: menyembah
  rationale: 'Walaupun konteksnya mencakup penyembahan, “melayani” mempertahankan arti dasar kata dan paralel yang disengaja: mereka melayani dewa-dewa lain tetapi tidak melayani Yahweh.'
- issue: Nuansa aspektual וַיֹּסִפוּ
  choice: kembali melakukan
  alternative: terus melakukan
  rationale: Keduanya mungkin secara leksikal. Konteks formula siklus dalam Hakim-Hakim mendukung pengulangan, tetapi ambiguitas kelanjutan tetap dinyatakan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. “Orang Israel” dipilih daripada bentuk harfiah “anak-anak Israel”; nama kultis dan nama ilahi dipertahankan melalui transliterasi. Semua penanda catatan kaki muncul dalam teks utama.
