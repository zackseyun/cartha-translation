  text: וַ/יָּקָם֩ אַחֲרֵ֨י אֲבִימֶ֜לֶךְ לְ/הוֹשִׁ֣יעַ אֶת יִשְׂרָאֵ֗ל תּוֹלָ֧ע בֶּן פּוּאָ֛ה בֶּן דּוֹד֖וֹ אִ֣ישׁ יִשָּׂשכָ֑ר וְ/הֽוּא יֹשֵׁ֥ב בְּ/שָׁמִ֖יר בְּ/הַ֥ר אֶפְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/001.yaml
  text: After Abimelech[a], Tola son of Puah, son of Dodo, a man of Issachar, arose to save Israel; and he lived in Shamir in the hill country of Ephraim.
translation:
  language: id
  text: Sesudah Abimelekh, Tola anak Pua, anak Dodo,[a] seorang dari suku Isakhar, bangkit untuk menyelamatkan Israel. Ia tinggal di Samir, di pegunungan Efraim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “anak pamannya.” Frasa Ibrani בֶּן־דּוֹדוֹ dapat dibaca dengan Dodo sebagai nama diri dalam silsilah ini, atau sebagai ungkapan yang berarti “anak pamannya.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּקָם
  choice: bangkitlah
  rationale: Dalam konteks naratif, קום menandai tampilnya seorang pemimpin. “Bangkitlah” mempertahankan nuansa formal tanpa menyiratkan pengangkatan resmi.
- source_word: אַחֲרֵי אֲבִימֶלֶךְ
  choice: Sesudah Abimelekh
  rationale: Penanda waktu yang menunjukkan urutan narasi setelah Abimelekh.
- source_word: לְהוֹשִׁיעַ אֶת־יִשְׂרָאֵל
  choice: untuk menyelamatkan Israel
  rationale: Bentuk Hifil dari ישׁע berarti menyelamatkan atau membebaskan. “Menyelamatkan” alami dalam bahasa Indonesia dan tidak membatasi tindakan itu hanya pada pembebasan militer.
- source_word: תּוֹלָע
  choice: Tola
  rationale: Nama orang ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: בֶּן־פּוּאָה
  choice: anak Pua
  rationale: Konstruksi silsilah diterjemahkan secara langsung dan alami.
- source_word: בֶּן־דּוֹדוֹ
  choice: anak Dodo
  rationale: Teks Masoret menunjuk Dodo sebagai nama diri dan konteksnya wajar sebagai nama leluhur. Kemungkinan pembacaan sebagai kata umum dipertahankan dalam catatan kaki.
- source_word: אִישׁ יִשָּׂשכָר
  choice: seorang dari suku Isakhar
  rationale: Frasa ini menyatakan afiliasi kesukuan; terjemahan ini lebih jelas dan alami daripada bentuk harfiah “seorang Isakhar”.
- source_word: וְהוּא יֹשֵׁב
  choice: Ia tinggal
  rationale: Konstruksi partisipial menerangkan tempat kediamannya. “Tinggal” merupakan padanan modern dan idiomatis.
- source_word: בְּשָׁמִיר
  choice: di Samir
  rationale: Nama tempat ditransliterasikan.
- source_word: בְּהַר אֶפְרָיִם
  choice: di pegunungan Efraim
  rationale: הַר dalam ungkapan geografis ini menunjuk kawasan perbukitan atau pegunungan Efraim; “pegunungan Efraim” merupakan ungkapan geografis yang alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan urutan utama teks Ibrani, tetapi dibagi menjadi dua kalimat agar jelas dan alami. Nama-nama ditulis dalam bentuk transliterasi Indonesia yang lazim.
