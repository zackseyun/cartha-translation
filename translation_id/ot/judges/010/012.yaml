source:
  edition: WLC
  text: וְ/צִידוֹנִ֤ים וַֽ/עֲמָלֵק֙ וּ/מָע֔וֹן לָחֲצ֖וּ אֶתְ/כֶ֑ם וַ/תִּצְעֲק֣וּ אֵלַ֔/י וָ/אוֹשִׁ֥יעָ/ה אֶתְ/כֶ֖ם מִ/יָּדָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/012.yaml
  text: The Sidonians[a], Amalek, and Maon oppressed you, and you cried out to me[b], and I saved you from their hand.
translation:
  language: id
  text: Orang Sidon, Amalek[a], dan Maon[b] menindas kalian. Lalu kalian berseru kepada-Ku, dan Aku menyelamatkan kalian dari tangan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Amalek”. Teks Ibrani berbunyi “Amalek”, yang dapat mewakili bangsa itu secara keseluruhan.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang Maon”. Teks Ibrani berbunyi “Maon”, yang tampaknya menunjuk kepada suatu kelompok bangsa yang terkait dengan Maon.
    reason: lexical_alternative
lexical_decisions:
- source_word: צִידוֹנִים
  choice: Orang Sidon
  rationale: Bentuk Ibrani adalah nomina jamak yang menunjuk kepada penduduk Sidon. “Orang Sidon” merupakan sebutan kelompok yang alami dan jelas dalam bahasa Indonesia.
- source_word: עֲמָלֵק
  choice: Amalek
  rationale: Teks Ibrani memakai nama diri “Amalek”, yang di sini dapat mewakili seluruh kelompok bangsa. Nama itu dipertahankan tanpa memperjelasnya secara diam-diam menjadi “orang Amalek”.
- source_word: מָעוֹן
  choice: Maon
  rationale: Teks konsonantal memuat nama diri “Maon”. Nama tersebut dipertahankan, sementara kemungkinan bahwa yang dimaksud ialah kelompok orang Maon dicatat dalam catatan kaki.
- source_word: לָחֲצוּ
  choice: menindas
  rationale: Kata kerja ini menyatakan tindakan menekan atau menindas dengan keras. “Menindas” alami dalam bahasa Indonesia dan sesuai dengan konteks kekuasaan musuh atas Israel.
- source_word: וַתִּצְעֲקוּ אֵלַי
  choice: kalian berseru kepada-Ku
  rationale: Ungkapan ini menyampaikan seruan mendesak yang diarahkan kepada Allah. “Berseru kepada-Ku” mempertahankan daya emosional dan arah seruan tersebut.
- source_word: וָאוֹשִׁיעָה
  choice: Aku menyelamatkan
  rationale: Kata kerja dari akar ישׁע berarti menyelamatkan atau melepaskan. “Menyelamatkan” jelas, langsung, dan mempertahankan kaitan leksikal dengan tema keselamatan dalam Alkitab.
- source_word: מִיָּדָם
  choice: dari tangan mereka
  rationale: Ungkapan harfiah Ibrani berarti dibebaskan dari kuasa atau kendali mereka. Metafora “dari tangan mereka” tetap dapat dipahami dalam bahasa Indonesia dan mempertahankan citra teks sumber.
theological_decisions:
- issue: Pembicara ilahi dalam bentuk orang pertama
  choice: Kata ganti “Aku” dan enklitik “-Ku” ditulis dengan huruf kapital.
  alternative: Menuliskannya sebagai “aku” dan “-ku”.
  rationale: Kapitalisasi membantu pembaca Indonesia mengenali bahwa Allah sedang berbicara, tanpa menambahkan gelar atau penafsiran teologis yang tidak terdapat dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang wajar dan bermartabat. “Kalian” dipakai untuk membedakan orang kedua jamak dalam teks Ibrani. Kalimat dibagi dua agar alur tindakan mudah dipahami, sedangkan “dari tangan mereka” mempertahankan idiom dan citra sumber.
