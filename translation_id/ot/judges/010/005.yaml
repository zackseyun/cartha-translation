  text: And Jair died and was buried in Kamon.
translation:
  language: id
  text: Kemudian Yair meninggal dan dikuburkan di Kamon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: meninggal
  rationale: Berasal dari מות, verba naratif baku untuk kematian. “Meninggal” merupakan padanan Indonesia yang langsung, wajar, dan bermartabat.
- source_word: יָאִיר
  choice: Yair
  rationale: Nama diri ditransliterasikan mengikuti bentuk Ibrani dan konvensi Alkitab bahasa Indonesia.
- source_word: וַיִּקָּבֵר
  choice: dikuburkan
  rationale: Bentuk nifal dari קבר menyatakan pasif; “dikuburkan” mempertahankan diatesis sumber dan merupakan ungkapan Indonesia yang alami.
- source_word: בְּקָמוֹן
  choice: di Kamon
  rationale: Preposisi בְּ menandai lokasi. “Di Kamon” adalah padanan lokatif yang paling langsung untuk nama tempat dalam berita penguburan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bermartabat. Konjungsi naratif וַ diterjemahkan “Kemudian” agar urutan peristiwa terasa alami tanpa menambahkan penafsiran. Tanda פ pada WLC merupakan penanda pembagian teks masoretik dan tidak diterjemahkan.
