  text: After him arose Jair the Gileadite[a], and he judged Israel twenty-two years.
translation:
  language: id
  text: Setelah dia, bangkit Yair, orang Gilead[a]. Ia menghakimi Israel selama dua puluh dua tahun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Setelah dia tampil Yair, orang Gilead.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם אַחֲרָיו
  choice: Sesudah dia, bangkitlah
  rationale: Ungkapan ini merupakan formula pergantian tokoh dalam narasi. Terjemahan ini mempertahankan unsur קום, yaitu 'bangkit', dan אַחֲרָיו, yaitu 'sesudah dia', tanpa menjadikannya sekadar penanda kronologis.
- source_word: יָאִיר
  choice: Yair
  rationale: Nama Ibrani ditransliterasikan menurut bentuk yang lazim dan dekat dengan pelafalan sumber.
- source_word: הַגִּלְעָדִי
  choice: orang Gilead
  rationale: Adjektiva nisbah ini menyatakan asal atau keterkaitan regional. 'Orang Gilead' alami dan jelas dalam bahasa Indonesia modern.
- source_word: וַיִּשְׁפֹּט אֶת יִשְׂרָאֵל
  choice: Ia menjadi hakim atas Israel
  rationale: Dalam kitab Hakim-Hakim, שפט mencakup peran memimpin sebagai hakim, bukan hanya memutus perkara. Rumusan ini mempertahankan istilah khas kitab tersebut sekaligus menghindari pengertian yudisial modern yang terlalu sempit.
- source_word: עֶשְׂרִים וּשְׁתַּיִם שָׁנָה
  choice: selama dua puluh dua tahun
  rationale: Bilangan dan durasi diterjemahkan secara idiomatis dalam bahasa Indonesia modern.
