id: JDG.10.15
reference: Judges 10:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ בְנֵי יִשְׂרָאֵ֤ל אֶל יְהוָה֙ חָטָ֔אנוּ עֲשֵׂה אַתָּ֣ה לָ֔/נוּ כְּ/כָל הַ/טּ֖וֹב בְּ/עֵינֶ֑י/ךָ אַ֛ךְ הַצִּילֵ֥/נוּ נָ֖א הַ/יּ֥וֹם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/015.yaml
  text: And the sons of Israel said to Yahweh[a], “We have sinned. Do to us according to all that is good in your eyes[c][b]. Only please deliver us this day.”
translation:
  language: id
  text: Lalu orang Israel berkata kepada Yahweh, “Kami telah berdosa. Perlakukanlah kami sesuai dengan segala yang baik di mata-Mu.[a] Hanya, tolong selamatkanlah kami pada hari ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sesuai dengan segala yang baik di mata-Mu”; maksudnya, sesuai dengan apa pun yang Kauanggap baik.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “lalu” menyatakannya secara alami dalam bahasa Indonesia tanpa memberi urutan waktu yang terlalu tegas.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan ini secara harfiah berarti “anak-anak lelaki Israel,” tetapi dalam konteks menunjuk kepada bangsa Israel secara kolektif. “Orang Israel” alami, akurat, dan tidak menyiratkan bahwa hanya laki-laki yang berbicara.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: חָטָאנוּ
  choice: Kami telah berdosa
  rationale: Bentuk perfektif menyatakan pengakuan atas dosa yang telah dilakukan; “telah berdosa” mempertahankan daya pengakuannya.
- source_word: עֲשֵׂה אַתָּה לָנוּ
  choice: Perlakukanlah kami
  rationale: Secara harfiah berarti “lakukanlah kepada kami”; “perlakukanlah kami” lebih wajar dalam bahasa Indonesia dan tetap mempertahankan ketundukan mereka terhadap tindakan Yahweh.
- source_word: כְּכָל הַטּוֹב בְּעֵינֶיךָ
  choice: sesuai dengan segala yang baik di mata-Mu
  rationale: Mempertahankan idiom Ibrani “baik di matamu” sekaligus mencerminkan unsur כְּכָל, “sesuai dengan segala.”
- source_word: אַךְ
  choice: Hanya
  rationale: 'Partikel ini membatasi permohonan setelah pernyataan ketundukan: mereka menerima perlakuan Yahweh, tetapi memohon satu hal.'
- source_word: הַצִּילֵנוּ
  choice: selamatkanlah kami
  rationale: Bentuk Hifil dari נצל berarti melepaskan, menyelamatkan, atau membebaskan dari bahaya. “Selamatkanlah” tepat dan alami dalam konteks permohonan.
- source_word: נָא
  choice: tolong
  rationale: Partikel permohonan ini melembutkan imperatif; “tolong” adalah padanan modern yang alami.
- source_word: הַיּוֹם הַזֶּה
  choice: pada hari ini
  rationale: Mencerminkan bentuk Ibrani yang lebih penuh dan menegaskan kemendesakan permohonan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung; mempertahankan “Yahweh” membedakannya dari gelar dan mengikuti bukti teks sumber.
- issue: Cakupan בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak lelaki Israel
  rationale: Walaupun bentuk Ibraninya secara harfiah maskulin, ungkapan tersebut merupakan sebutan kolektif bagi bangsa Israel. Terjemahan tidak membatasi pelaku kepada laki-laki tanpa dasar kontekstual.
- issue: Makna permohonan הַצִּילֵנוּ
  choice: selamatkanlah kami
  alternative: lepaskanlah kami
  rationale: Konteksnya adalah penyelamatan dari penindasan dan bahaya. “Selamatkanlah” mempertahankan keluasan makna tanpa menentukan secara sempit bentuk pelepasannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan kepada Yahweh memakai bentuk hormat “-Mu” dan “Kau-”. Struktur pengakuan, ketundukan, lalu permohonan yang mendesak dipertahankan.
