translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Orang Israel” dipilih daripada terjemahan harfiah “anak-anak Israel” agar alami dan tidak ambigu. Dua kalimat dipakai untuk menjernihkan susunan waktu Ibrani yang sangat padat tanpa menghilangkan ketegangan tekstual; ketidakpastian sintaksis dan alternatif pasangan kata kerja dicatat dalam catatan kaki.
