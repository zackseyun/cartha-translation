    rationale: Frasa Ibrani berarti “yang berada di seberang Yordan” dan tidak secara eksplisit menyatakan bahwa mereka bermukim di sana. Penghilangan kata tersebut menjaga keterbukaan dan ketelitian geografis sumber.
  - severity: low
