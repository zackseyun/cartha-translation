  text: וַֽ/יִּרְעֲצ֤וּ וַ/יְרֹֽצְצוּ֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל בַּ/שָּׁנָ֖ה הַ/הִ֑יא שְׁמֹנֶ֨ה עֶשְׂרֵ֜ה שָׁנָ֗ה אֶֽת כָּל בְּנֵ֤י יִשְׂרָאֵל֙ אֲשֶׁר֙ בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֔ן בְּ/אֶ֥רֶץ הָ/אֱמֹרִ֖י אֲשֶׁ֥ר בַּ/גִּלְעָֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/008.yaml
  text: And they shattered and crushed the sons of Israel in that year[a]; for eighteen years they oppressed all the sons of Israel who were beyond the Jordan in the land of the Amorites[b], which is in Gilead.
translation:
  language: id
  text: Pada tahun itu mereka meremukkan dan menindas orang Israel.[a] Selama delapan belas tahun mereka menindas semua orang Israel yang berada di seberang Sungai Yordan, di negeri orang Amori, yang berada di Gilead.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani memakai dua kata kerja yang kuat dan hampir searti, yang dapat diterjemahkan “mereka mematahkan dan meremukkan.” Susunan kalimatnya padat: sesudah “pada tahun itu” disebut “delapan belas tahun.” Terjemahan ini mengungkapkan bahwa penindasan berlanjut selama delapan belas tahun.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: וַיִּרְעֲצוּ
  choice: mereka meremukkan
  rationale: Kata kerja ini menyampaikan tindakan menghancurkan atau mematahkan dengan keras. “Meremukkan” mempertahankan daya ungkap metaforis dan kekerasan tindakan itu.
- source_word: וַיְרֹצְצוּ
  choice: dan menindas
  rationale: Dalam pasangan dengan kata kerja sebelumnya, kata ini dapat berarti meremukkan atau menindas. “Menindas” mempertahankan gagasan tekanan berkepanjangan dan menghindari dua kata Indonesia yang nyaris identik tanpa menghilangkan intensitas pasangan Ibrani.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah berarti “anak-anak Israel,” tetapi dalam konteks ini menunjuk kepada bangsa Israel. “Orang Israel” merupakan ungkapan Indonesia modern yang alami dan tidak menimbulkan kesan bahwa yang dimaksud hanya anak-anak.
- source_word: בַּשָּׁנָה הַהִיא
  choice: Pada tahun itu
  rationale: Menerjemahkan penanda waktu secara langsung dan alami dalam bahasa Indonesia.
- source_word: שְׁמֹנֶה עֶשְׂרֵה שָׁנָה
  choice: Selama delapan belas tahun
  rationale: “Selama” menyatakan durasi secara jelas. Kalimat baru membantu mengungkap kelanjutan penindasan yang tersirat dalam susunan Ibrani yang padat.
- source_word: אֶת כָּל בְּנֵי יִשְׂרָאֵל
  choice: semua orang Israel
  rationale: “Semua” mempertahankan cakupan כָּל, sedangkan pengulangan “orang Israel” mencerminkan pengulangan dalam teks sumber.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: di seberang Sungai Yordan
  rationale: Ungkapan ini dekat dengan idiom Ibrani dan tidak menentukan arah timur atau barat yang tidak dinyatakan secara eksplisit dalam frasa itu sendiri.
- source_word: בְּאֶרֶץ הָאֱמֹרִי
  choice: di negeri orang Amori
  rationale: Mempertahankan bentuk penunjukan wilayah secara formal; bentuk tunggal Ibrani dipahami secara kolektif sebagai bangsa Amori.
- source_word: אֲשֶׁר בַּגִּלְעָד
  choice: yang berada di Gilead
  rationale: Mempertahankan klausa relatif dan mengaitkannya secara alami dengan negeri orang Amori.
