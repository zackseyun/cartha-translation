  verdict: revise
  source_fidelity: Terjemahan menangkap kekerasan pasangan verba Ibrani dan durasi delapan belas tahun. Namun, kata “tinggal” menambahkan keterangan tempat tinggal yang tidak dinyatakan oleh בְּעֵבֶר הַיַּרְדֵּן, yang hanya mengidentifikasi kelompok itu sebagai berada di seberang Yordan. Pengulangan “menindas” dalam kalimat kedua adalah penjelasan sintaktis yang wajar untuk durasi dan sejalan dengan jejak audit bahasa Inggris, tetapi sebaiknya dibedakan dalam catatan kaki dari dua verba eksplisit pada awal ayat.
  naturalness: Bahasa Indonesia draft pada dasarnya baku dan jelas. “Orang Israel” adalah pilihan modern yang alami. Menghapus “tinggal” membuatnya lebih dekat pada sumber tanpa mengurangi kelancaran. Koma sebelum klausa “yang berada di Gilead” memperjelas bahwa klausa itu menerangkan “negeri orang Amori.”
  terminology: “Orang Israel,” “Sungai Yordan,” “orang Amori,” dan “Gilead” konsisten serta sesuai register. Pasangan “meremukkan dan menindas” dapat dipertahankan sebagai pengungkapan dua verba yang keras, sementara “menindas” yang diulang untuk periode delapan belas tahun dijelaskan sebagai pelengkapan sintaktis.
