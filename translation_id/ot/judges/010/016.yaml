  text: וַ/יָּסִ֜ירוּ אֶת אֱלֹהֵ֤י הַ/נֵּכָר֙ מִ/קִּרְבָּ֔/ם וַ/יַּעַבְד֖וּ אֶת יְהוָ֑ה וַ/תִּקְצַ֥ר נַפְשׁ֖/וֹ בַּ/עֲמַ֥ל יִשְׂרָאֵֽל־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/016.yaml
  text: So they removed the foreign gods from among them and served Yahweh[a], and he became impatient over the misery of Israel.
translation:
  language: id
  text: Lalu mereka menyingkirkan dewa-dewa asing dari tengah-tengah mereka dan melayani Yahweh, dan Ia tidak tahan lagi terhadap kesusahan Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia menjadi tidak sabar karena kesusahan Israel.” Secara harfiah, bahasa Ibraninya berbunyi, “jiwa-Nya menjadi pendek karena kesusahan Israel,” suatu ungkapan yang dapat menyatakan ketidaksabaran atau bahwa Ia tidak sanggup menanggungnya lebih lama lagi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסִירוּ
  choice: menyingkirkan
  rationale: Bentuk Hifil dari סור menyatakan tindakan membuat sesuatu pergi atau membuangnya; “menyingkirkan” wajar dalam bahasa Indonesia dan cocok untuk pembuangan berhala.
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: dewa-dewa asing
  rationale: Ungkapan ini menunjuk kepada ilah-ilah bangsa lain; “dewa-dewa asing” jelas dan alami dalam konteks politeistis.
- source_word: מִקִּרְבָּם
  choice: dari tengah-tengah mereka
  rationale: Mempertahankan gambaran harfiah tentang sesuatu yang berada di lingkungan komunitas Israel.
- source_word: וַיַּעַבְדוּ אֶת יְהוָה
  choice: beribadah kepada Yahweh
  rationale: עבד ketika berobjek Allah mencakup melayani dan beribadah. Dalam kontras langsung dengan penyingkiran dewa-dewa, “beribadah kepada” paling alami tanpa meniadakan makna kesetiaan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi sesuai bentuk sumber dan kebijakan proyek.
- source_word: וַתִּקְצַר נַפְשׁוֹ
  choice: Ia tidak tahan lagi
  rationale: Secara harfiah, “jiwanya menjadi pendek”; idiom ini menyatakan bahwa batas kesabaran atau daya menanggung telah tercapai. Pilihan ini menyampaikan daya ungkap idiom itu secara alami.
- source_word: בַּעֲמַל יִשְׂרָאֵל
  choice: melihat kesusahan Israel
  rationale: עָמָל dapat berarti kesusahan, penderitaan, atau jerih payah. Preposisi בְּ menyatakan hal yang membuat-Nya tidak tahan lagi; “melihat” ditambahkan secara idiomatis, bukan untuk menentukan mekanisme teologis tertentu.
theological_decisions:
- issue: Bahasa antropopatik dalam וַתִּקְצַר נַפְשׁוֹ
  choice: Ia tidak tahan lagi melihat kesusahan Israel
  alternative: jiwa-Nya menjadi pendek karena kesusahan Israel / Ia menjadi tidak sabar terhadap kesusahan Israel
  rationale: Terjemahan utama mempertahankan gambaran bahwa Yahweh mencapai batas dalam menanggung kesusahan Israel, tanpa mengubahnya menjadi pernyataan doktrinal abstrak. Catatan kaki menjaga idiom harfiah dan kemungkinan nuansa ketidaksabaran.
translation_notes:
  register: Bahasa Indonesia baku modern dan bermartabat. “Dewa-dewa” dipakai bagi ilah asing, sedangkan nama perjanjian ditampilkan sebagai “Yahweh”. Struktur kalimat dibuat lancar bagi pembaca umum, sementara ambiguitas idiom pada klausa terakhir dipertahankan melalui catatan kaki.
