base_translation:
  language: en
  yaml_path: translation/ot/judges/010/004.yaml
  text: He had thirty sons, riding on thirty donkeys, and they had thirty towns. To this day they are called Havvoth-jair, which are in the land of Gilead.
translation:
  language: id
  text: Ia mempunyai tiga puluh anak laki-laki yang menunggang tiga puluh keledai, dan mereka mempunyai tiga puluh kota. Sampai hari ini kota-kota itu disebut Hawot-Yair dan terletak di tanah Gilead.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲיָרִים
  choice: keledai
  rationale: Dalam konteks ini bentuk tersebut berarti keledai-keledai, bukan kota-kota; pengulangan bunyi dengan עָרִים dalam bahasa Ibrani tidak dapat dipertahankan secara alami dalam bahasa Indonesia.
- source_word: עָרִים
  choice: kota
  rationale: Menunjuk pada tiga puluh permukiman yang dimiliki anak-anak Yair; 'kota' merupakan padanan Indonesia yang wajar.
- source_word: חַוֺּת יָאִיר
  choice: Hawot-Yair
  rationale: Nama tempat ditransliterasikan dari bahasa Ibrani dan dipertahankan sebagai nama diri, tanpa memaksakan terjemahan maknanya.
- source_word: אֶרֶץ הַגִּלְעָד
  choice: tanah Gilead
  rationale: Menerjemahkan אֶרֶץ secara langsung sambil mempertahankan Gilead sebagai nama wilayah.
