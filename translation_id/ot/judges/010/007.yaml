  terminology: “Yahweh,” “orang Filistin,” dan “orang Amon” konsisten dengan penggunaan nama dan etnonim yang jelas dalam bahasa Indonesia. “Ia” tetap memiliki rujukan yang jelas kepada Yahweh.
