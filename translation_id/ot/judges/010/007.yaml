  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵ֑ל וַֽ/יִּמְכְּרֵ/ם֙ בְּ/יַד פְּלִשְׁתִּ֔ים וּ/בְ/יַ֖ד בְּנֵ֥י עַמּֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/007.yaml
  text: So Yahweh’s anger burned against Israel[c][b][a], and he sold them into the hand of the Philistines and into the hand of the Ammonites.
translation:
  language: id
  text: Maka murka Yahweh menyala terhadap Israel, dan Ia menjual mereka ke dalam tangan orang Filistin dan ke dalam tangan orang Amon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara harfiah, “ke dalam tangan orang Filistin dan ke dalam tangan anak-anak Amon.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: murka ... menyala
  rationale: Ungkapan Ibrani menggambarkan amarah sebagai sesuatu yang menyala. Bentuk ini mempertahankan citra sumber sekaligus terdengar wajar dan bermartabat dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH, bukan menggantinya dengan gelar.
- source_word: בְּיִשְׂרָאֵל
  choice: terhadap Israel
  rationale: Dalam ungkapan tentang murka, preposisi ב menyatakan sasaran kemarahan dan paling alami diterjemahkan 'terhadap'.
- source_word: וַיִּמְכְּרֵם
  choice: Ia menjual mereka
  rationale: Mempertahankan arti dasar מכר dan metafora penghakiman yang berulang dalam kitab Hakim-Hakim, tanpa memperlunaknya menjadi sekadar 'menyerahkan'.
- source_word: בְּיַד
  choice: ke dalam tangan
  rationale: Mempertahankan idiom konkret Ibrani tentang jatuh ke bawah kuasa pihak lain; ungkapan ini tetap dapat dipahami dalam bahasa Indonesia.
- source_word: פְּלִשְׁתִּים
  choice: orang Filistin
  rationale: Sebutan baku dan alami dalam bahasa Indonesia bagi kelompok bangsa ini.
- source_word: בְּנֵי עַמּוֹן
  choice: bani Amon
  rationale: Mencerminkan bentuk harfiah 'anak-anak Amon' sekaligus memakai etnonim Indonesia yang ringkas dan lazim dalam ragam Alkitab.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks sumber secara langsung memakai Tetragramaton. 'Yahweh' mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan gelar.
- issue: Gambaran penghakiman ilahi dalam וַיִּמְכְּרֵם
  choice: Ia menjual mereka
  alternative: Ia menyerahkan mereka; Ia membiarkan mereka jatuh ke tangan
  rationale: Teks menyatakan tindakan aktif Yahweh dalam menyerahkan Israel kepada penindasan sebagai penghakiman. Terjemahan ini mempertahankan metafora keras dan motif berulang kitab Hakim-Hakim.
- issue: Acuan pronomina pelaku
  choice: Ia
  alternative: Yahweh
  rationale: Pelakunya tetap jelas dari klausa pertama. Huruf kapital mengikuti konvensi Indonesia untuk pronomina yang merujuk kepada Allah tanpa menambahkan unsur yang tidak ada dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Citra 'murka menyala', metafora 'menjual', dan idiom 'ke dalam tangan' dipertahankan untuk menjaga kekuatan serta pola sastra teks Ibrani. Penanda catatan kaki [a] ditempatkan setelah bagian yang dijelaskannya.
