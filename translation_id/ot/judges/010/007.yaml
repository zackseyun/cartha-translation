  rationale: Revisi mengganti “bani Amon” dengan “orang Amon” demi kelaziman bahasa Indonesia modern, sambil mempertahankan struktur dan metafora Ibrani. Catatan kaki diperjelas agar alternatif “anak-anak Amon” disajikan secara akurat dan tanpa perluasan interpretatif.
