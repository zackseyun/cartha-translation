id: JDG.10.10
reference: Judges 10:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יִּזְעֲקוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל יְהוָ֖ה לֵ/אמֹ֑ר חָטָ֣אנוּ לָ֔/ךְ וְ/כִ֤י עָזַ֨בְנוּ֙ אֶת אֱלֹהֵ֔י/נוּ וַֽ/נַּעֲבֹ֖ד אֶת הַ/בְּעָלִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/010.yaml
  text: Then the sons of Israel cried out to the LORD, saying, “We have sinned against you, because we have forsaken our God and have served the Baals.”
translation:
  language: id
  text: Lalu orang Israel berseru kepada TUHAN, “Kami telah berdosa terhadap Engkau, karena kami telah meninggalkan Allah kami dan beribadah kepada para Baal.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah berarti 'anak-anak Israel', tetapi dalam konteks ini menunjuk kepada bangsa Israel secara kolektif; 'orang Israel' lebih alami dalam bahasa Indonesia modern.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia yang lazim untuk nama ilahi YHWH, dengan huruf kapital penuh.
- source_word: וַנַּעֲבֹד
  choice: beribadah kepada
  rationale: Kata עבד dalam konteks hubungan dengan ilah berarti melayani atau menyembah; 'beribadah kepada' menyampaikan tindakan kultis dan kesetiaan religius secara alami.
- source_word: הַבְּעָלִים
  choice: para Baal
  rationale: Bentuk jamak menunjuk kepada berbagai manifestasi atau berhala Baal; 'para Baal' mempertahankan bentuk jamaknya.
theological_decisions:
- issue: Hubungan klausa pengakuan dosa dengan tindakan meninggalkan Allah dan beribadah kepada para Baal
  choice: karena
  alternative: dan bahwa / yakni
  rationale: וְכִי di sini paling wajar menjelaskan dasar atau isi konkret dosa mereka. 'Karena' mempertahankan hubungan kausal yang didukung konteks tanpa menambahkan penafsiran denominasi.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan khidmat. Sapaan 'Engkau' memakai huruf kapital karena merujuk kepada Allah. Kalimat langsung dibuat ringkas tanpa menghilangkan pengulangan teologis antara 'TUHAN' dan 'Allah kami'.
