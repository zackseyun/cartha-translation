id: JDG.10.14
reference: Judges 10:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לְכ֗וּ וְ/זַֽעֲקוּ֙ אֶל הָ֣/אֱלֹהִ֔ים אֲשֶׁ֥ר בְּחַרְתֶּ֖ם בָּ֑/ם הֵ֛מָּה יוֹשִׁ֥יעוּ לָ/כֶ֖ם בְּ/עֵ֥ת צָרַתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/010/014.yaml
  text: Go and cry out to the gods whom you have chosen[a]; let them save you in the time of your distress.
translation:
  language: id
  text: Pergilah dan berserulah kepada dewa-dewa yang telah kalian pilih; biarlah mereka menyelamatkan kalian pada waktu kalian mengalami kesesakan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka akan menyelamatkan kalian.” Bentuk Ibraninya dapat diterjemahkan sebagai masa depan biasa, tetapi dalam konteks ini berfungsi sebagai tantangan ironis.
    reason: alternative_reading
lexical_decisions:
- source_word: לְכוּ
  choice: Pergilah
  rationale: Imperatif jamak dari הלך bernada penolakan tegas. “Pergilah” alami, langsung, dan tetap bermartabat.
- source_word: וְזַעֲקוּ
  choice: dan berserulah
  rationale: זעק menunjuk pada seruan keras untuk meminta pertolongan dalam keadaan genting. “Berserulah” mempertahankan urgensi dan nuansa permohonan.
- source_word: אֶל הָאֱלֹהִים
  choice: kepada dewa-dewa
  rationale: Konteks serta pronomina dan verba jamak sesudahnya menunjukkan ilah-ilah asing dalam bentuk jamak. “Dewa-dewa” membedakannya dengan jelas dari Allah Israel.
- source_word: אֲשֶׁר בְּחַרְתֶּם בָּם
  choice: yang telah kalian pilih
  rationale: בחר dengan ב di sini secara idiomatis menyatakan tindakan memilih. Bentuk “kalian” mempertahankan sapaan orang kedua jamak.
- source_word: הֵמָּה
  choice: mereka
  rationale: Pronomina mandiri memberi penekanan pada dewa-dewa itu sebagai pihak yang ditantang untuk bertindak; subjek eksplisit “mereka” mempertahankan penekanan tersebut secara alami.
- source_word: יוֹשִׁיעוּ
  choice: biarlah mereka menyelamatkan kalian
  rationale: Hifil dari ישׁע berarti menyelamatkan atau melepaskan. Dalam konteks teguran TUHAN, bentuk ini berfungsi sebagai tantangan ironis, yang wajar diungkapkan dengan “biarlah mereka menyelamatkan kalian”.
- source_word: בְּעֵת צָרַתְכֶם
  choice: pada waktu kalian mengalami kesesakan
  rationale: Ungkapan ini berarti pada masa kesusahan atau krisis. Rumusan verbal ini terdengar alami dalam bahasa Indonesia sambil mempertahankan makna צָרָה sebagai kesesakan berat.
theological_decisions:
- issue: Daya ujar יוֹשִׁיעוּ dalam konteks teguran TUHAN
  choice: 'Diterjemahkan sebagai tantangan ironis: “biarlah mereka menyelamatkan kalian”'
  alternative: “mereka akan menyelamatkan kalian”
  rationale: Bentuk Ibrani dapat dibaca sebagai masa depan sederhana, tetapi konteksnya merupakan teguran konfrontatif kepada Israel karena memilih dewa-dewa lain. Terjemahan utama mempertahankan daya tantang tanpa mengubahnya menjadi ramalan, sedangkan kemungkinan gramatikal alternatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tegas dan bermartabat. “Kalian” dipakai untuk menandai sapaan jamak yang jelas; “dewa-dewa” dipilih untuk ilah-ilah asing. Penanda catatan kaki ditempatkan setelah kalimat yang memuat verba ambigu.
