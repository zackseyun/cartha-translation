base_translation:
  language: en
  yaml_path: translation/ot/judges/010/009.yaml
  text: Then the Ammonites crossed the Jordan to fight also against Judah[a], Benjamin, and the house of Ephraim, and Israel was greatly distressed.
translation:
  language: id
  text: Kemudian orang Amon menyeberangi Sungai Yordan untuk berperang juga melawan Yehuda, Benyamin, dan kaum Efraim, dan Israel sangat terdesak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: menyeberangi
  rationale: Dengan Sungai Yordan sebagai objek langsung, verba עבר menyatakan gerakan menyeberang secara konkret.
- source_word: בְנֵי עַמּוֹן
  choice: orang Amon
  rationale: Padanan etnonim yang alami dalam bahasa Indonesia; terjemahan harfiah 'anak-anak Amon' kurang idiomatis dalam narasi ini.
- source_word: אֶת הַיַּרְדֵּן
  choice: Sungai Yordan
  rationale: Penyebutan 'Sungai' membuat nama geografis ini langsung jelas bagi pembaca Indonesia modern.
- source_word: לְהִלָּחֵם
  choice: untuk berperang
  rationale: Bentuk infinitif ini menyatakan keterlibatan dalam peperangan; 'berperang' sesuai dengan serangan antarkelompok dalam konteks.
- source_word: גַּם
  choice: juga
  rationale: 'Mempertahankan daya aditifnya: serangan diperluas dari wilayah sebelumnya ke wilayah di sebelah barat Sungai Yordan.'
- source_word: בִּיהוּדָה וּבְבִנְיָמִין וּבְבֵית אֶפְרָיִם
  choice: melawan Yehuda, Benyamin, dan kaum Efraim
  rationale: Dalam kaitan dengan verba 'berperang', preposisi בְּ menunjuk sasaran permusuhan. 'Kaum Efraim' mempertahankan unsur בֵּית sebagai kelompok kolektif tanpa ungkapan Indonesia yang kaku.
- source_word: וַתֵּצֶר לְיִשְׂרָאֵל מְאֹד
  choice: Karena itu, Israel mengalami kesesakan yang sangat berat
  rationale: Konstruksi impersonal dengan לְיִשְׂרָאֵל menyatakan bahwa Israel menjadi pihak yang mengalami keadaan sangat terjepit. 'Kesesakan yang sangat berat' menjaga intensitas מְאֹד tanpa menentukan secara berlebihan apakah tekanannya terutama batiniah atau lahiriah.
