  naturalness: Frasa 'Di tempat itu tidak kekurangan apa pun' tidak lazim dalam bahasa Indonesia baku. Struktur apposisional dapat diterjemahkan secara alami sebagai 'suatu tempat yang tidak kekurangan apa pun ...'.
  terminology: '''Allah'' tepat untuk אֱלֹהִים dengan verba tunggal dalam konteks ini. ''Bangsa yang hidup dengan aman'' dan ''negeri yang luas'' merupakan padanan yang wajar. ''Ke dalam tangan kalian'' dapat dipertahankan sebagai idiom yang mudah dipahami tanpa catatan kaki tersendiri.'
  issues:
