    rationale: Catatan Inggris menandai idiom 'broad of hands' pada keterangan tentang keluasan negeri. Dalam draf, b justru melekat pada 'ke dalam tangan kalian' dan menjelaskan idiom lain. Penanda dipindahkan ke 'luas' dan catatannya disesuaikan.
  - severity: medium
