  variant: modern standard Indonesian
source:
  edition: WLC
  text: כְּ/בֹאֲ/כֶ֞ם תָּבֹ֣אוּ אֶל עַ֣ם בֹּטֵ֗חַ וְ/הָ/אָ֨רֶץ֙ רַחֲבַ֣ת יָדַ֔יִם כִּֽי נְתָנָ֥/הּ אֱלֹהִ֖ים בְּ/יֶדְ/כֶ֑ם מָקוֹם֙ אֲשֶׁ֣ר אֵֽין שָׁ֣ם מַחְס֔וֹר כָּל דָּבָ֖ר אֲשֶׁ֥ר בָּ/אָֽרֶץ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/010.yaml
  text: When you go[a], you will come to a secure people, and the land is broad; for God has given it into your hand[b], a place where there is no lack of anything that is in the land.
translation:
  language: id
  text: Ketika kalian tiba, kalian akan mendapati suatu bangsa yang hidup dengan aman[a] dan negeri yang luas[b], sebab Allah telah menyerahkannya ke dalam tangan kalian—suatu tempat yang tidak kekurangan apa pun yang ada di negeri itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “suatu bangsa yang merasa aman” atau “suatu bangsa yang tidak menaruh curiga.” Bahasa Ibrani menggambarkan mereka hidup dengan rasa aman.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “luas tangan”; ini adalah ungkapan Ibrani untuk negeri yang luas atau lapang.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבֹאֲכֶם תָּבֹאוּ
  choice: Ketika kalian tiba, kalian akan mendapati
  rationale: Gabungan infinitif 'ketika kalian datang/tiba' dan verba finit 'kalian akan datang' terdengar berulang jika diterjemahkan secara harfiah. Dalam konteks laporan para pengintai, 'akan mendapati' menyampaikan hasil kedatangan mereka secara alami tanpa mengubah pokok makna.
- source_word: עַם בֹּטֵחַ
  choice: suatu bangsa yang hidup dengan aman
  rationale: בֹּטֵחַ menyatakan keadaan merasa aman atau tenteram. Pilihan ini mempertahankan makna dasarnya tanpa mempersempitnya menjadi 'tidak menaruh curiga'.
- source_word: וְהָאָרֶץ רַחֲבַת יָדַיִם
  choice: dan negeri yang luas
  rationale: Ungkapan harfiah 'luas tangan' merupakan idiom bagi wilayah yang lapang atau luas. Bahasa Indonesia alami cukup memakai 'negeri yang luas'.
- source_word: כִּי נְתָנָהּ אֱלֹהִים בְּיֶדְכֶם
  choice: Allah telah menyerahkannya ke dalam tangan kalian
  rationale: Bentuk perfektif menyajikan penyerahan itu sebagai kenyataan yang pasti dari sudut pandang para pengintai. Ungkapan 'ke dalam tangan' mempertahankan idiom Ibrani tentang kuasa atau penguasaan.
- source_word: מָקוֹם אֲשֶׁר אֵין שָׁם מַחְסוֹר
  choice: Di tempat itu tidak kekurangan
  rationale: מָקוֹם menunjuk tempat atau wilayah tersebut, sedangkan מַחְסוֹר berarti kekurangan atau kebutuhan yang tidak terpenuhi.
- source_word: כָּל דָּבָר אֲשֶׁר בָּאָרֶץ
  choice: apa pun yang terdapat di negeri itu
  rationale: Dalam konteks ini הָאָרֶץ menunjuk negeri atau wilayah yang sedang dibicarakan, bukan seluruh bumi.
theological_decisions:
- issue: Makna אֱלֹהִים dalam ucapan para pengintai
  choice: Allah
  alternative: allah atau dewa-dewa
  rationale: Nomina ini menjadi subjek verba tunggal dan dalam konteks Israel menunjuk kepada Allah. Terjemahan tunggal 'Allah' paling sesuai tanpa menambahkan penafsiran teologis lain.
- issue: Kepastian penyerahan negeri oleh Allah
  choice: telah menyerahkannya
  alternative: akan menyerahkannya
  rationale: Perfek Ibrani menggambarkan tindakan itu sebagai sudah pasti atau telah terlaksana dari sudut pandang pembicara; terjemahan bentuk lampau mempertahankan daya retoris tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' untuk bentuk orang kedua jamak. Diksi dibuat lugas dan bermartabat; idiom Ibrani dipertahankan bila mudah dipahami dan dijelaskan melalui catatan kaki.
