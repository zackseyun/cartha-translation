id: JDG.18.2
reference: Judges 18:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁלְח֣וּ בְנֵי דָ֣ן מִֽ/מִּשְׁפַּחְתָּ֡/ם חֲמִשָּׁ֣ה אֲנָשִׁ֣ים מִ/קְצוֹתָ/ם֩ אֲנָשִׁ֨ים בְּנֵי חַ֜יִל מִ/צָּרְעָ֣ה וּ/מֵֽ/אֶשְׁתָּאֹ֗ל לְ/רַגֵּ֤ל אֶת הָ/אָ֨רֶץ֙ וּ/לְ/חָקְרָ֔/הּ וַ/יֹּאמְר֣וּ אֲלֵ/הֶ֔ם לְכ֖וּ חִקְר֣וּ אֶת הָ/אָ֑רֶץ וַ/יָּבֹ֤אוּ הַר אֶפְרַ֨יִם֙ עַד בֵּ֣ית מִיכָ֔ה וַ/יָּלִ֖ינוּ שָֽׁם־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/002.yaml
  text: So the sons of Dan sent five men from their clan[a], from among their whole number, valiant men from Zorah and from Eshtaol, to spy out the land and to explore it. And they said to them, “Go, explore the land.” So they came to the hill country of Ephraim, as far as the house of Micah[c][b], and spent the night there.
translation:
  language: id
  text: Lalu orang-orang Dan mengutus lima orang pria dari klan mereka, yang dipilih dari antara mereka—orang-orang tangguh[a] dari Zora dan Esytaol—untuk mengintai negeri itu dan menyelidikinya.[b] Orang-orang Dan berkata kepada mereka, “Pergilah, selidikilah negeri itu.” Maka mereka tiba di daerah perbukitan Efraim, sampai ke rumah Mikha.[c] Mereka bermalam di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang-orang yang cakap” atau “orang-orang yang gagah berani.”'
    reason: lexical_alternative
  - marker: b
    text: “Menyelidiki” juga dapat diterjemahkan “memeriksa dengan saksama.”
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “rumah Mikha”; ungkapan ini dapat menunjuk rumah atau kompleks kediaman Mikha.'
    reason: cultural_note
lexical_decisions:
- source_word: בְנֵי דָן
  choice: bani Dan
  rationale: Ungkapan ini mempertahankan idiom kekerabatan suku dalam bahasa Ibrani, tetapi tetap lazim dan mudah dipahami dalam ragam Alkitab bahasa Indonesia.
- source_word: מִמִּשְׁפַּחְתָּם
  choice: dari kaum mereka
  rationale: מִשְׁפָּחָה di sini menunjuk kelompok kekerabatan dalam suku Dan. “Kaum” lebih sesuai daripada “keluarga” modern yang terlalu sempit atau “suku” yang terlalu luas.
- source_word: חֲמִשָּׁה אֲנָשִׁים
  choice: lima orang
  rationale: Konteks dan nomina Ibrani menunjukkan lima laki-laki; dalam bahasa Indonesia, “lima orang” alami dan tidak mengaburkan rujukan karena frasa berikutnya menjelaskan mereka sebagai orang-orang yang diutus.
- source_word: מִקְצוֹתָם
  choice: yang dipilih dari antara mereka
  rationale: 'Dalam konteks ini frasa tersebut bersifat partitif: kelima orang itu berasal dari antara kelompok mereka. Terjemahan harfiah “dari ujung-ujung mereka” tidak alami dan tidak menyampaikan idiomnya.'
- source_word: אֲנָשִׁים בְּנֵי חַיִל
  choice: orang-orang tangguh
  rationale: חַיִל dapat menyatakan kekuatan, keberanian, kecakapan, atau kemampuan. “Tangguh” sesuai dengan tugas pengintaian dan tidak membatasi maknanya hanya pada keberanian militer.
- source_word: מִצָּרְעָה וּמֵאֶשְׁתָּאֹל
  choice: dari Zora dan Esytaol
  rationale: Nama tempat ditransliterasikan menurut bentuk yang wajar dalam bahasa Indonesia.
- source_word: לְרַגֵּל
  choice: untuk mengintai
  rationale: Kata kerja ini menunjukkan kegiatan pengintaian atau pengumpulan informasi tentang suatu wilayah.
- source_word: וּלְחָקְרָהּ / חִקְרוּ
  choice: menyelidikinya / selidikilah
  rationale: Akar חקר menekankan pemeriksaan yang saksama. Pengulangan padanan “selidik” mempertahankan kaitan leksikal antara perintah dan tujuan pengutusan.
- source_word: הָאָרֶץ
  choice: negeri itu
  rationale: Dalam konteks ini הָאָרֶץ menunjuk wilayah yang hendak diperiksa dan diduduki. “Negeri” alami dalam bahasa Indonesia dan mempertahankan cakupan geografisnya.
- source_word: הַר אֶפְרַיִם
  choice: daerah perbukitan Efraim
  rationale: Ungkapan ini menunjuk kawasan dataran tinggi Efraim, bukan satu gunung tertentu.
- source_word: עַד בֵּית מִיכָה
  choice: sampai ke rumah Mikha
  rationale: עַד menyatakan batas perjalanan, sedangkan בֵּית מִיכָה secara harfiah berarti “rumah Mikha”; istilah “rumah” juga dapat mencakup kompleks kediaman atau rumah tangga.
- source_word: וַיָּלִינוּ שָׁם
  choice: Mereka bermalam di sana
  rationale: Bentuk kata kerja לון di sini berarti tinggal atau menginap semalam.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat diatur agar rangkaian keterangan panjang dalam bahasa Ibrani tetap jelas. Tanda pisah menandai keterangan aposisional tentang kelima utusan. “Bani Dan” mempertahankan warna kekerabatan suku, sedangkan “daerah perbukitan Efraim” menghindari kesan bahwa הַר menunjuk satu puncak.
