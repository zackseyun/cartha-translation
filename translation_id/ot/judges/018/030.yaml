revisions:
- from: Lalu bani Dan mendirikan bagi diri mereka sendiri patung pahatan itu. Yonatan anak Gersom, anak Musa,[a] bersama anak-anaknya menjadi imam bagi suku Dan sampai hari ketika negeri itu dibuang.
  to: Lalu bani Dan mendirikan bagi diri mereka sendiri patung pahatan itu. Yonatan anak Gersom, anak Musa,[a] dan anak-anaknya menjadi imam bagi suku Dan sampai hari pembuangan negeri itu.
  rationale: Revisi menegaskan subjek jamak “Yonatan ... dan anak-anaknya” tanpa menambahkan informasi, mempertahankan ambiguitas frasa pembuangan melalui “hari pembuangan negeri itu,” dan memperjelas dasar tekstual varian nama dalam catatan kaki.
