  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּקִ֧ימוּ לָ/הֶ֛ם בְּנֵי דָ֖ן אֶת הַ/פָּ֑סֶל וִ֠/יהוֹנָתָן בֶּן גֵּרְשֹׁ֨ם בֶּן מְ ה֣וּא וּ/בָנָ֗י/ו הָי֤וּ כֹהֲנִים֙ לְ/שֵׁ֣בֶט הַ/דָּנִ֔י עַד י֖וֹם גְּל֥וֹת הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/030.yaml
  text: Then the sons of Dan set up for themselves the carved image, and Jonathan the son of Gershom, son of Moses,[a] he and his sons were priests for the tribe of the Danites until the day of the exile of the land.
translation:
  language: id
  text: Lalu bani Dan mendirikan bagi diri mereka sendiri patung pahatan itu. Yonatan anak Gersom, anak Musa,[a] dan anak-anaknya menjadi imam bagi suku Dan sampai hari pembuangan negeri itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “Musa”; tradisi Masoret menyertakan huruf nun yang ditulis menggantung, sehingga menghasilkan pembacaan tradisional “Manasye”.'
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּקִימוּ
  choice: mendirikan
  rationale: Bentuk Hifil dari קום berarti membuat berdiri; dalam konteks ini, mendirikan atau memasang patung untuk pemujaan.
- source_word: לָהֶם
  choice: bagi diri mereka sendiri
  rationale: Datif ini menunjukkan bahwa bani Dan bertindak untuk kepentingan atau penggunaan mereka sendiri.
- source_word: בְּנֵי דָן
  choice: bani Dan
  rationale: Ungkapan ini dekat dengan bentuk Ibrani dan tetap wajar dalam ragam Alkitab bahasa Indonesia, sekaligus membedakannya dari sebutan kesukuan pada bagian berikutnya.
- source_word: הַפָּסֶל
  choice: patung pahatan
  rationale: פֶּסֶל secara konkret menunjuk pada patung atau gambar yang dibuat dengan memahat; pilihan ini tidak mengganti istilah benda dengan penilaian interpretatif seperti 'berhala'.
- source_word: וִיהוֹנָתָן
  choice: Yonatan
  rationale: Nama diri dialihaksarakan menurut kelaziman bahasa Indonesia.
- source_word: בֶּן גֵּרְשֹׁם
  choice: anak Gersom
  rationale: Terjemahan langsung bagi konstruksi silsilah Ibrani.
- source_word: בֶּן מְהוּא
  choice: anak Musa
  rationale: Teks dasar dengan huruf nun yang digantung menunjuk pada Musa, sedangkan tradisi pembacaan 'Manasye' dicantumkan dalam catatan kaki.
- source_word: וּבָנָיו
  choice: bersama anak-anaknya
  rationale: Ungkapan ini secara alami menandai bahwa Yonatan dan keturunannya sama-sama menjadi subjek pelayanan sebagai imam.
- source_word: כֹהֲנִים
  choice: menjadi imam
  rationale: כהנים adalah istilah baku bagi imam dalam konteks ibadah; predikat nominal Ibrani diungkapkan secara alami dengan 'menjadi'.
- source_word: לְשֵׁבֶט הַדָּנִי
  choice: bagi suku Dan
  rationale: Menunjukkan pelayanan kepada kelompok kesukuan Dan dengan ungkapan Indonesia yang alami dan jelas.
- source_word: עַד יוֹם גְּלוֹת הָאָרֶץ
  choice: sampai hari ketika negeri itu dibuang
  rationale: Terjemahan ini mempertahankan konstruksi Ibrani yang ringkas dan tidak biasa, termasuk ambiguitas mengenai peristiwa pembuangan yang dimaksud dan nuansa bahwa negeri itu sendiri mengalami pembuangan.
theological_decisions:
- issue: Identitas leluhur Yonatan dalam silsilah
  choice: anak Musa
  alternative: anak Manasye
  rationale: Bentuk tertulis dalam tradisi Masoret memuat nun yang digantung sehingga pembacaan dasar berkaitan dengan Musa, sementara nun tersebut menghasilkan pembacaan tradisional 'Manasye'. Ketegangan tekstual dipertahankan dengan 'Musa' dalam teks utama dan alternatifnya dalam catatan kaki.
- issue: Rujukan pembuangan pada akhir ayat
  choice: tidak mengidentifikasi peristiwa sejarah tertentu
  alternative: menafsirkannya secara khusus sebagai pembuangan Asyur atau pemindahan Tabut
  rationale: Frasa Ibrani tidak menyebut secara eksplisit peristiwa mana yang dimaksud. Terjemahan mempertahankan ketidakjelasan itu tanpa menetapkan suatu rekonstruksi sejarah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Bani Dan' mempertahankan warna genealogis teks tanpa menjadi sukar dipahami; 'patung pahatan' konkret dan tidak terlalu interpretatif. Susunan kalimat dibuat alami, sementara kejanggalan bermakna pada frasa pembuangan tetap dipertahankan.
