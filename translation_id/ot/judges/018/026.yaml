  text: וַ/יֵּלְכ֥וּ בְנֵי דָ֖ן לְ/דַרְכָּ֑/ם וַ/יַּ֣רְא מִיכָ֗ה כִּי חֲזָקִ֥ים הֵ֨מָּה֙ מִמֶּ֔/נּוּ וַ/יִּ֖פֶן וַ/יָּ֥שָׁב אֶל בֵּיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/026.yaml
  text: Then the sons of Dan went on their way, and Micah saw that they were stronger than he was, so he turned and went back to his house.
translation:
  language: id
  text: Kemudian keturunan Dan meneruskan perjalanan mereka. Ketika Mikha melihat bahwa mereka lebih kuat daripada dirinya, ia berbalik dan pulang ke rumahnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי דָן
  choice: keturunan Dan
  rationale: Ungkapan kekerabatan Ibrani dipakai sebagai sebutan suku. 'Keturunan Dan' mempertahankan hubungan dengan leluhur Dan sekaligus terdengar alami dalam bahasa Indonesia modern.
- source_word: לְדַרְכָּם
  choice: meneruskan perjalanan mereka
  rationale: Mengungkapkan secara idiomatis bahwa mereka pergi melanjutkan perjalanan, sesuai konteks naratif.
- source_word: חֲזָקִים הֵמָּה מִמֶּנּוּ
  choice: mereka lebih kuat daripada dirinya
  rationale: Mempertahankan bentuk perbandingan yang dinyatakan oleh חזק dengan מן tanpa menambahkan gagasan bahwa mereka 'terlalu' kuat.
- source_word: וַיִּפֶן
  choice: ia berbalik
  rationale: Menerjemahkan tindakan berbalik secara langsung; tindakan pulang dinyatakan secara terpisah oleh verba berikutnya.
- source_word: וַיָּשָׁב אֶל בֵּיתוֹ
  choice: pulang ke rumahnya
  rationale: '''Pulang ke rumahnya'' merupakan ungkapan Indonesia yang alami dan tetap menyampaikan makna kembali menuju rumah miliknya.'
- source_word: בֵּיתוֹ
  choice: rumahnya
  rationale: Padanan langsung dan wajar bagi bentuk בית dengan akhiran milik orang ketiga tunggal.
