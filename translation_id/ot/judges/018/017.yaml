  text: וַֽ/יַּעֲל֞וּ חֲמֵ֣שֶׁת הָ/אֲנָשִׁ֗ים הַ/הֹלְכִים֮ לְ/רַגֵּ֣ל אֶת הָ/אָרֶץ֒ בָּ֣אוּ שָׁ֔מָּ/ה לָקְח֗וּ אֶת הַ/פֶּ֨סֶל֙ וְ/אֶת הָ֣/אֵפ֔וֹד וְ/אֶת הַ/תְּרָפִ֖ים וְ/אֶת הַ/מַּסֵּכָ֑ה וְ/הַ/כֹּהֵ֗ן נִצָּב֙ פֶּ֣תַח הַ/שַּׁ֔עַר וְ/שֵׁשׁ מֵא֣וֹת הָ/אִ֔ישׁ הֶ/חָג֖וּר כְּלֵ֥י הַ/מִּלְחָמָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/017.yaml
  text: Then the five men who had gone to spy out the land went up[a], came there, and took the carved image, the ephod, the household gods, and the cast image[b], while the priest was standing at the entrance of the gate with the six hundred men armed with weapons of war.
translation:
  language: id
  text: Lalu kelima orang yang dahulu pergi mengintai negeri itu naik. Mereka datang ke sana dan mengambil patung pahatan, efod, dewa-dewa rumah tangga[a], serta patung tuangan[b]. Sementara itu, imam tersebut berdiri di pintu gerbang bersama enam ratus orang yang diperlengkapi dengan senjata perang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “terafim.” Istilah Ibrani ini menunjuk pada benda-benda pemujaan atau dewa-dewa rumah tangga.'
    reason: lexical_alternative
  - marker: b
    text: 'Terjemahan tradisional: “patung leburan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: naik
  rationale: Makna dasar עלה ialah ‘naik’. Pilihan ini mempertahankan arah gerak yang dinyatakan teks Ibrani tanpa menambahkan tujuan yang tidak disebutkan.
- source_word: הַהֹלְכִים לְרַגֵּל אֶת־הָאָרֶץ
  choice: yang dahulu pergi mengintai negeri itu
  rationale: רגל dalam konteks ini menunjuk pada kegiatan pengintaian untuk tujuan strategis. Kata ‘dahulu’ memperjelas bahwa misi itu terjadi sebelum tindakan dalam ayat ini.
- source_word: בָּאוּ שָׁמָּה
  choice: Mereka datang ke sana
  rationale: Terjemahan langsung ini tidak menentukan tempat atau bangunan yang dimasuki, sebab objek semacam itu tidak dinyatakan secara eksplisit.
- source_word: לָקְחוּ
  choice: mengambil
  rationale: לקח adalah kata umum untuk ‘mengambil’. Konteks narasi sudah menunjukkan sifat tindakan itu sehingga tidak perlu diperkeras menjadi ‘merampas’.
- source_word: הַפֶּסֶל
  choice: patung pahatan
  rationale: פסל menunjuk pada patung atau gambar yang dibuat dengan cara dipahat. Ungkapan ini konkret dan tidak menambahkan penilaian yang terkandung dalam kata ‘berhala’.
- source_word: הָאֵפוֹד
  choice: efod
  rationale: Efod adalah benda kebudayaan dan keagamaan tertentu yang tidak memiliki padanan sederhana dalam bahasa Indonesia; bentuk serapan mempertahankan istilah sumber.
- source_word: הַתְּרָפִים
  choice: dewa-dewa rumah tangga
  rationale: תרפים menunjuk pada benda-benda pemujaan atau dewa-dewa rumah tangga. Terjemahan maknawi dipakai dalam teks agar mudah dipahami, sedangkan istilah ‘terafim’ dicantumkan dalam catatan kaki.
- source_word: הַמַּסֵּכָה
  choice: patung tuangan
  rationale: מסכה di sini menunjuk pada patung yang dibuat melalui proses penuangan, biasanya dari logam. ‘Patung tuangan’ akurat dan lebih wajar daripada ungkapan tradisional ‘patung leburan’.
- source_word: וְהַכֹּהֵן נִצָּב
  choice: Sementara itu, imam tersebut berdiri
  rationale: Klausa ini menggambarkan keadaan yang berlangsung bersamaan dengan pengambilan benda-benda tersebut. ‘Sementara itu’ menyampaikan fungsi sirkumstansialnya secara alami.
- source_word: פֶּתַח הַשַּׁעַר
  choice: di pintu gerbang
  rationale: Ungkapan Indonesia ini menyampaikan lokasi pada bukaan atau jalan masuk gerbang tanpa susunan yang kaku.
- source_word: וְשֵׁשׁ מֵאוֹת הָאִישׁ הֶחָגוּר כְּלֵי הַמִּלְחָמָה
  choice: bersama keenam ratus orang yang diperlengkapi dengan senjata perang
  rationale: Frasa ini dipahami sebagai keterangan pihak yang berada bersama imam. חגור menyatakan keadaan siap atau diperlengkapi dengan persenjataan; terjemahan ini mempertahankan gambaran militernya.
