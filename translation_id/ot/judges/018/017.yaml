translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Istilah kebudayaan khusus ‘efod’ dipertahankan, sedangkan ‘terafim’ dijelaskan melalui terjemahan maknawi dan catatan kaki. Pemenggalan menjadi tiga kalimat dipakai agar rangkaian tindakan dan klausa keadaan tetap jelas bagi pembaca umum.
