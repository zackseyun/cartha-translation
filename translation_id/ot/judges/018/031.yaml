base_translation:
  language: en
  yaml_path: translation/ot/judges/018/031.yaml
  text: So they set up for themselves Micah’s carved image that he had made[a], all the days that the house of God was in Shiloh.
translation:
  language: id
  text: Mereka menegakkan bagi diri mereka patung pahatan yang dibuat Mikha itu, dan mereka menegakkannya selama rumah Allah ada di Silo.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berhala.” Kata Ibrani ini menunjuk pada citra kultis yang dipahat; “patung pahatan” mempertahankan makna konkretnya, sedangkan “berhala” lebih menonjolkan fungsinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂימוּ לָהֶם
  choice: mereka mendirikan bagi diri mereka
  rationale: שׂים berarti menaruh atau menempatkan; dalam konteks pemujaan, “mendirikan” secara alami menyatakan pemasangan patung untuk digunakan, sedangkan לָהֶם dipertahankan sebagai “bagi diri mereka.”
- source_word: פֶּסֶל
  choice: patung pahatan
  rationale: Istilah ini menunjuk pada patung buatan untuk keperluan kultis. “Patung pahatan” mempertahankan segi konkret pembuatannya tanpa langsung menggantinya dengan istilah fungsional “berhala.”
- source_word: מִיכָה
  choice: Mikha
  rationale: Nama orang ditransliterasikan menurut bentuk baku yang lazim dalam Alkitab bahasa Indonesia.
- source_word: אֲשֶׁר עָשָׂה
  choice: buatan Mikha
  rationale: Klausa relatif secara harfiah berarti “yang telah dibuatnya.” Bentuk ringkas “buatan Mikha” jelas merujuk pada tindakan Mikha sebelumnya dan menghasilkan bahasa Indonesia yang alami.
- source_word: כָּל יְמֵי הֱיוֹת
  choice: selama ... berada
  rationale: Ungkapan temporal ini menyatakan seluruh rentang waktu keberadaan rumah Allah di Silo; “selama” menyampaikan daya duratifnya secara wajar.
- source_word: בֵּית הָאֱלֹהִים
  choice: rumah Allah
  rationale: Terjemahan langsung ini mempertahankan ungkapan sumber serta ketegangan antara pusat ibadah di Silo dan pemujaan patung di Dan tanpa menambahkan penafsiran.
- source_word: בְּשִׁלֹה
  choice: di Silo
  rationale: Nama tempat ditransliterasikan dalam bentuk baku bahasa Indonesia, dengan preposisi בְּ diterjemahkan “di.”
theological_decisions:
- issue: Makna בֵּית הָאֱלֹהִים dalam konteks pemujaan di Dan yang berhadapan dengan pusat ibadah Israel di Silo
  choice: rumah Allah
  alternative: tempat suci Allah
  rationale: “Rumah Allah” mengikuti bentuk sumber dan tidak secara eksplisit mengidentifikasinya lebih jauh. Dengan demikian, kontras teologis dalam narasi tetap hadir tanpa diperjelas secara berlebihan oleh terjemahan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Mendirikan” dipilih sebagai ungkapan alami untuk pemasangan patung pemujaan; susunan kalimat dijaga ringkas tanpa menghilangkan hubungan waktu dalam teks Ibrani.
