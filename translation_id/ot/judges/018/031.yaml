  naturalness: Kalimat draf dapat dipahami, tetapi “patung pahatan buatan Mikha ... selama rumah Allah berada di Silo” menimbulkan keterikatan yang janggal dan agak kabur. Susunan dengan “dan” serta “selama rumah Allah ada di Silo” lebih alami dan jelas.
