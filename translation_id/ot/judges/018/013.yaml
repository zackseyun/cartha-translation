  terminology: “Efraim” dan “Mikha” sesuai dengan bentuk nama yang lazim dalam Alkitab bahasa Indonesia. Catatan a dihapus karena perbedaan antara bentuk posesif Indonesia “rumah Mikha” dan bentuk harfiah “rumah Mikha” tidak menghasilkan alternatif terjemahan yang bermakna; “kediaman” bukan padanan leksikal yang perlu dicatat di sini.
