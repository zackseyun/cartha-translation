  text: From there they passed through the hill country of Ephraim and came as far as Micah’s house[a][b].
translation:
  language: id
  text: Dari sana mereka melintasi daerah pegunungan Efraim[b] dan sampai ke rumah Mikha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Secara tradisional juga diterjemahkan “Gunung Efraim.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְרוּ
  choice: mereka melintasi
  rationale: Kata kerja עבר menyatakan gerak melewati atau melintasi suatu wilayah; dalam konteks perjalanan ini, “melintasi” alami dan tetap mempertahankan gambaran pergerakan melalui daerah tersebut.
- source_word: מִשָּׁם
  choice: Dari sana
  rationale: Ungkapan penunjuk tempat ini menandai titik keberangkatan dari lokasi sebelumnya dan diterjemahkan secara lugas serta idiomatis.
- source_word: הַר אֶפְרָיִם
  choice: pegunungan Efraim
  rationale: Ungkapan ini merupakan nama kawasan perbukitan atau pegunungan Efraim, bukan semata-mata satu puncak; “pegunungan Efraim” jelas dan alami dalam bahasa Indonesia.
- source_word: וַיָּבֹאוּ
  choice: dan tiba
  rationale: בוא dapat berarti datang, masuk, atau tiba. Dalam rangkaian perjalanan menuju suatu tempat, “tiba” menyampaikan tercapainya tujuan secara alami.
- source_word: עַד
  choice: di
  rationale: Walaupun עַד secara harfiah dapat berarti “sampai ke”, bersama verba “tiba” makna batas atau tujuan telah tersampaikan secara idiomatis oleh “tiba di”.
- source_word: בֵּית מִיכָה
  choice: rumah Mikha
  rationale: Frasa konstruksi ini secara harfiah berarti “rumah Mikha”; bentuk tersebut alami dalam bahasa Indonesia dan mempertahankan kemungkinan bahwa yang dimaksud ialah rumah atau kediaman milik Mikha.
