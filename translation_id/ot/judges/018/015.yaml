  text: וַ/יָּס֣וּרוּ שָׁ֔מָּ/ה וַ/יָּבֹ֛אוּ אֶל בֵּֽית הַ/נַּ֥עַר הַ/לֵּוִ֖י בֵּ֣ית מִיכָ֑ה וַ/יִּשְׁאֲלוּ ל֖/וֹ לְ/שָׁלֽוֹם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/015.yaml
  text: They turned aside there and came to the house of the young Levite[a], to the house of Micah, and asked him about his welfare.
translation:
  language: id
  text: Mereka menyimpang ke sana, lalu sampai di rumah orang muda Lewi itu, yaitu rumah Mikha, dan menanyakan keadaannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “memberi salam kepadanya” atau “menanyakan apakah ia baik-baik saja.” Ungkapan Ibrani secara harfiah berarti menanyakan damai atau kesejahteraan seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסוּרוּ שָׁמָּה
  choice: Mereka menyimpang ke sana
  rationale: Kata סוּר menyatakan berbelok atau menyimpang dari jalan menuju tempat itu; bentuk ini mempertahankan unsur gerak tanpa menafsirkannya sekadar sebagai singgah.
- source_word: וַיָּבֹאוּ אֶל
  choice: lalu sampai di
  rationale: בוא dengan אֶל menunjukkan kedatangan ke suatu tempat. 'Sampai di' alami dalam narasi Indonesia dan tidak menyiratkan secara berlebihan bahwa mereka masuk.
- source_word: בֵּית הַנַּעַר הַלֵּוִי
  choice: rumah orang muda Lewi itu
  rationale: Terjemahan ini mempertahankan נַעַר sebagai 'orang muda' dan הַלֵּוִי sebagai identitas suku/jabatan Lewi, dengan bentuk yang wajar dalam bahasa Indonesia.
- source_word: בֵּית מִיכָה
  choice: yaitu rumah Mikha
  rationale: Pengulangan frasa 'rumah' dipertahankan sebagai penjelasan aposisional yang mengidentifikasi rumah orang Lewi muda itu sebagai rumah Mikha.
- source_word: וַיִּשְׁאֲלוּ לוֹ לְשָׁלוֹם
  choice: dan menanyakan keadaannya
  rationale: Ungkapan Ibrani secara harfiah berkaitan dengan menanyakan damai atau kesejahteraan seseorang. 'Menanyakan keadaannya' menyampaikan idiom itu secara alami sambil mempertahankan kemungkinan bahwa ini lebih dari salam biasa.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur pengulangan lokasi dalam bahasa Ibrani dipertahankan dengan 'yaitu' agar jelas dan tetap alami. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang dijelaskannya.
