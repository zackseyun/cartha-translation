  text: He said to them[a], “Thus and so Micah did for me, and he hired me, and I became his priest.”
translation:
  language: id
  text: Ia berkata kepada mereka, “Mikha melakukan begini dan begitu[a] kepadaku. Ia mengupah aku, dan aku menjadi imamnya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seperti ini dan seperti itu”; ungkapan Ibrani ini merangkum tindakan yang telah disebutkan tanpa mengulang rinciannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Ia berkata kepada mereka
  rationale: Bentuk naratif ini memperkenalkan jawaban orang Lewi itu. Kata penghubung waw tidak perlu dinyatakan sebagai “dan” karena urutan narasi sudah jelas dalam bahasa Indonesia.
- source_word: כָּזֹה וְכָזֶה
  choice: Begini dan begitulah
  rationale: Ungkapan Ibrani ini merangkum tindakan yang telah diceritakan tanpa mengulang rinciannya; pilihan ini mempertahankan bentuk idiomatis dan ketidakspesifikannya.
- source_word: עָשָׂה לִי
  choice: yang dilakukan ... kepadaku
  rationale: Preposisi לִי di sini menyatakan tindakan Mikha dalam hubungannya dengan orang Lewi itu. “Kepadaku” alami dalam bahasa Indonesia dan tidak mempersempit maknanya hanya menjadi tindakan demi kepentingannya.
- source_word: מִיכָה
  choice: Mikha
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וַיִּשְׂכְּרֵנִי
  choice: Ia mengupah aku
  rationale: Kata שׂכר menyatakan mempekerjakan seseorang dengan upah. “Mengupah aku” mempertahankan unsur pembayaran yang tersirat jelas dalam bentuk Ibrani.
- source_word: וָאֱהִי לוֹ לְכֹהֵן
  choice: dan aku menjadi imamnya
  rationale: היה dalam rangkaian naratif menunjukkan masuknya orang Lewi itu ke dalam peran baru. “Imamnya” secara wajar mengungkapkan pelayanan imam yang terikat kepada Mikha.
theological_decisions:
- issue: Sifat jabatan imam dalam lingkungan ibadah yang tidak teratur
  choice: aku menjadi imamnya
  alternative: aku menjadi imam baginya
  rationale: Teks menyatakan hubungan pelayanan pribadi kepada Mikha tanpa menilai atau mengesahkan keabsahan jabatan tersebut. Terjemahan mempertahankan ketegangan naratif dan teologis itu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Begini dan begitulah” dipilih untuk mempertahankan idiom peringkas dalam bahasa sumber, sedangkan “mengupah” menegaskan hubungan kerja berbayar tanpa menambahkan penilaian terhadapnya.
