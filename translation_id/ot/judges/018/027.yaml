base_translation:
  language: en
  yaml_path: translation/ot/judges/018/027.yaml
  text: So they took what Micah had made[a], along with the priest who belonged to him, and came against Laish, against a people quiet and secure. They struck them with the edge of the sword and burned the city with fire.
translation:
  language: id
  text: Maka mereka mengambil apa yang telah dibuat Mikha, juga imam yang melayani Mikha. Mereka datang ke Lais untuk menyerang suatu bangsa yang hidup tenang dan aman. Mereka memukul mereka dengan mata pedang[a] dan membakar kota itu dengan api.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dengan mulut pedang,” sebuah ungkapan yang berarti “dengan mata pedang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמָּה
  choice: Maka mereka
  rationale: Kata ganti mandiri memberi penekanan pada pelaku sekaligus melanjutkan alur cerita; “Maka mereka” menyampaikannya secara wajar dalam narasi Indonesia.
- source_word: לָקְחוּ
  choice: mengambil
  rationale: Padanan yang cukup luas untuk mencakup benda-benda buatan Mikha dan imam itu tanpa menambahkan gagasan perampasan yang tidak dinyatakan langsung oleh verba.
- source_word: אֵת אֲשֶׁר עָשָׂה מִיכָה
  choice: apa yang telah dibuat Mikha
  rationale: Menerjemahkan konstruksi relatif secara alami dan tetap merujuk pada benda-benda ibadah yang telah disebutkan dalam konteks.
- source_word: וְאֶת הַכֹּהֵן אֲשֶׁר הָיָה לוֹ
  choice: juga imam yang menjadi imamnya
  rationale: Ungkapan היה לו menyatakan hubungan imam itu dengan Mikha. Pengulangan “imam” terdengar lebih alami dan tidak menyiratkan kepemilikan manusia sebagai barang.
- source_word: וַיָּבֹאוּ עַל לַיִשׁ
  choice: Mereka datang menyerang Lais
  rationale: Dalam konteks militer, בוא על menunjukkan gerakan bermusuhan terhadap suatu tempat; “datang menyerang” mempertahankan unsur kedatangan dan maksud serangannya.
- source_word: עַל עַם שֹׁקֵט וּבֹטֵחַ
  choice: menyerang suatu bangsa yang hidup tenang dan aman
  rationale: שֹׁקֵט menggambarkan ketenangan, sedangkan בֹטֵחַ menggambarkan rasa aman. Kata “hidup” ditambahkan secara idiomatis tanpa mengubah makna.
- source_word: וַיַּכּוּ אוֹתָם
  choice: Mereka menewaskan orang-orang itu
  rationale: Dalam konteks serangan dengan pedang dan pembakaran kota, נכה paling wajar menyatakan tindakan mematikan. “Orang-orang itu” memperjelas rujukan pronomina dalam bahasa Indonesia.
- source_word: לְפִי חָרֶב
  choice: dengan mata pedang
  rationale: Ini adalah ungkapan Ibrani yang secara harfiah menyebut “mulut pedang”; “mata pedang” merupakan idiom Indonesia yang mempertahankan gambaran sisi tajam pedang.
- source_word: וְאֶת הָעִיר שָׂרְפוּ בָאֵשׁ
  choice: dan membakar kota itu dengan api
  rationale: Mempertahankan penyebutan eksplisit “dengan api” serta penekanan pada kota sebagai objek yang dibakar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur paralel “menyerang Lais, menyerang suatu bangsa” dipertahankan untuk mencerminkan pengulangan עַל dalam teks Ibrani. Penanda catatan kaki ditempatkan pada ungkapan yang diterangkannya.
