revisions:
- from: Maka mereka mengambil apa yang telah dibuat Mikha, juga imam yang menjadi imamnya. Mereka datang menyerang Lais, menyerang suatu bangsa yang hidup tenang dan aman. Mereka menewaskan orang-orang itu dengan mata pedang[a] dan membakar kota itu dengan api.
  to: Maka mereka mengambil apa yang telah dibuat Mikha, juga imam yang melayani Mikha. Mereka datang ke Lais untuk menyerang suatu bangsa yang hidup tenang dan aman. Mereka memukul mereka dengan mata pedang[a] dan membakar kota itu dengan api.
  rationale: Revisi mengganti “menewaskan” dengan “memukul” untuk mempertahankan keluasan verba Ibrani נכה. Hubungan imam dengan Mikha dibuat lebih jelas dan wajar. Struktur serangan atas Lais dan penduduknya diungkapkan secara idiomatis dalam bahasa Indonesia sambil mempertahankan maksud bermusuhan dari בוא על.
