base_translation:
  language: en
  yaml_path: translation/ot/judges/018/005.yaml
  text: And they said to him[a], “Please inquire of God, so that we may know whether the journey on which we are going will succeed.”
translation:
  language: id
  text: Lalu mereka berkata kepadanya[a], “Tolong tanyakanlah kepada Allah, supaya kami mengetahui apakah perjalanan yang sedang kami tempuh ini akan berhasil.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “apakah jalan kami akan berhasil,” dengan “jalan” mempertahankan gambaran yang lebih harfiah dari bahasa Ibrani.
    reason: alternatif_leksikal
lexical_decisions:
- source_word: וַיֹּאמְרוּ לוֹ
  choice: Lalu mereka berkata kepadanya
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. “Lalu” menyampaikan urutan peristiwa secara wajar dalam bahasa Indonesia tanpa menambahkan hubungan sebab-akibat.
- source_word: שְׁאַל נָא
  choice: Tolong tanyakanlah
  rationale: Kata נָא melunakkan bentuk perintah. Dalam konteks ini, “tanyakanlah kepada Allah” secara alami berarti meminta petunjuk atau jawaban ilahi melalui imam.
- source_word: בֵאלֹהִים
  choice: kepada Allah
  rationale: Dengan kata kerja שׁאל, preposisi ב dapat menyatakan pihak yang dimintai jawaban. Konteks paling wajar menunjuk kepada Allah dalam arti tunggal.
- source_word: וְנֵדְעָה
  choice: supaya kami mengetahui
  rationale: Bentuk kohortatif di sini menyatakan tujuan dari permintaan mereka; “supaya” membuat hubungan itu jelas dan alami.
- source_word: הֲתַצְלִיחַ
  choice: apakah ... akan berhasil
  rationale: Bentuk Hifil dari צלח menyatakan keberhasilan atau kelancaran. “Akan berhasil” tepat bagi ekspedisi yang sedang ditempuh dan tidak membatasi maknanya pada kemakmuran materi.
- source_word: דַּרְכֵּנוּ
  choice: perjalanan ... ini
  rationale: Secara harfiah berarti “jalan kami”, tetapi dalam konteks menunjuk kepada perjalanan atau ekspedisi mereka. “Perjalanan ... ini” menyampaikan acuannya dengan jelas; unsur kepemilikan orang pertama sudah tersirat oleh klausa “kami tempuh”.
- source_word: אֲשֶׁר אֲנַחְנוּ הֹלְכִים עָלֶיהָ
  choice: yang sedang kami tempuh
  rationale: Ungkapan Ibrani secara harfiah menggambarkan jalan yang di atasnya mereka berjalan. “Yang sedang kami tempuh” merupakan ungkapan Indonesia yang alami dan mempertahankan aspek perjalanan yang sedang berlangsung.
theological_decisions:
- issue: Acuan אֱלֹהִים
  choice: Allah (tunggal)
  alternative: allah-allah/dewa-dewa
  rationale: Walaupun bentuk אֱלֹהִים secara morfologis dapat tampak jamak, dalam konteks permintaan petunjuk ilahi melalui imam, makna tunggal paling sesuai. Pilihan ini bersifat leksikal-kontekstual dan tidak menambahkan penjelasan doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan alur narasi, kesantunan permintaan, tujuan mengetahui hasil, dan gambaran perjalanan dalam teks Ibrani.
