  text: וַ/יֹּאמְרוּ֩ ל֨/וֹ הַחֲרֵ֜שׁ שִֽׂים יָדְ/ךָ֤ עַל פִּ֨י/ךָ֙ וְ/לֵ֣ךְ עִמָּ֔/נוּ וֶֽ/הְיֵה לָ֖/נוּ לְ/אָ֣ב וּ/לְ/כֹהֵ֑ן הֲ/ט֣וֹב הֱיוֹתְ/ךָ֣ כֹהֵ֗ן לְ/בֵית֙ אִ֣ישׁ אֶחָ֔ד א֚וֹ הֱיוֹתְ/ךָ֣ כֹהֵ֔ן לְ/שֵׁ֥בֶט וּ/לְ/מִשְׁפָּחָ֖ה בְּ/יִשְׂרָאֵֽל־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/019.yaml
  text: They said to him[a], “Be quiet; put your hand over your mouth, and come with us, and be to us a father and a priest. Is it better for you to be priest to the house of one man[c][b], or to be priest to a tribe and a clan in Israel?”
translation:
  language: id
  text: Mereka berkata kepadanya, “Diamlah![a] Letakkan tanganmu di atas mulutmu, lalu pergilah bersama kami dan jadilah bapa[b] serta imam bagi kami. Apakah lebih baik bagimu menjadi imam bagi rumah tangga satu orang, atau menjadi imam bagi satu suku dan satu klan[c] di Israel?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Jangan bersuara!” Kata perintah Ibrani ini dapat berarti diam atau tidak berbicara.
    reason: lexical_alternative
  - marker: b
    text: “Bapa” di sini merupakan gelar kepemimpinan sosial atau keagamaan, bukan hubungan biologis.
    reason: cultural_note
  - marker: c
    text: Atau “keluarga besar”. Istilah Ibrani ini menunjuk kepada kelompok kekerabatan dalam suatu suku.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲרֵשׁ
  choice: Diamlah!
  rationale: Bentuk perintah dari חרשׁ menyuruh orang itu berhenti berbicara. ‘Diamlah!’ alami dalam bahasa Indonesia dan mempertahankan ketegasan perintah.
- source_word: שִׂים יָדְךָ עַל־פִּיךָ
  choice: Letakkan tanganmu pada mulutmu
  rationale: Terjemahan ini mempertahankan gambaran fisik Ibrani yang menyatakan sikap diam atau menahan diri.
- source_word: וְלֵךְ עִמָּנוּ
  choice: pergilah bersama kami
  rationale: Menerjemahkan langsung verba הלך dan frasa עִמָּנוּ tanpa mengubahnya menjadi ungkapan yang lebih interpretatif.
- source_word: וֶהְיֵה לָנוּ לְאָב וּלְכֹהֵן
  choice: jadilah bapa serta imam bagi kami
  rationale: Mempertahankan kedua peran dalam teks. ‘Bapa’ dibiarkan sebagai gelar sosial-keagamaan, bukan ditafsirkan secara sempit sebagai penasihat atau pemimpin.
- source_word: הֲטוֹב
  choice: Manakah yang lebih baik bagimu
  rationale: Bentuk pertanyaan dan dua pilihan sesudahnya menyiratkan perbandingan keuntungan; ‘lebih baik’ menyampaikan fungsi komparatif itu secara alami.
- source_word: לְבֵית אִישׁ אֶחָד
  choice: bagi rumah tangga satu orang
  rationale: בֵּית dalam konteks ini menunjuk kepada rumah sebagai kesatuan keluarga atau rumah tangga, bukan hanya bangunan.
- source_word: לְשֵׁבֶט וּלְמִשְׁפָּחָה בְּיִשְׂרָאֵל
  choice: bagi satu suku dan satu kaum di Israel
  rationale: שֵׁבֶט diterjemahkan ‘suku’, sedangkan מִשְׁפָּחָה diterjemahkan ‘kaum’ untuk membedakan kelompok kekerabatan di dalam suku dari keluarga inti.
theological_decisions:
- issue: Makna ‘bapa’ sebagai gelar
  choice: Mempertahankan sebutan harfiah ‘bapa’.
  alternative: penasihat; pelindung; pemimpin
  rationale: Teks Ibrani menempatkan gelar ‘bapa’ berdampingan dengan ‘imam’. Mempertahankannya menjaga keluasan makna sosial-keagamaan dan tidak memasukkan jabatan tertentu yang tidak dinyatakan teks.
- issue: Pembedaan kelompok kekerabatan מִשְׁפָּחָה dari שֵׁבֶט
  choice: Menerjemahkan מִשְׁפָּחָה sebagai ‘kaum’ dan שֵׁבֶט sebagai ‘suku’.
  alternative: keluarga; keluarga besar
  rationale: Pilihan ini mempertahankan perbedaan antara suku dan kelompok kekerabatan yang lebih kecil tanpa menyamakannya dengan keluarga inti modern.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat langsung mempertahankan ketegasan para penutur; istilah ‘bapa’, ‘imam’, ‘suku’, dan ‘kaum’ menjaga warna sosial-keagamaan serta susunan kelompok dalam teks Ibrani.
