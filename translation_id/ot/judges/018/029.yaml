  text: וַ/יִּקְרְא֤וּ שֵׁם הָ/עִיר֙ דָּ֔ן בְּ/שֵׁם֙ דָּ֣ן אֲבִי/הֶ֔ם אֲשֶׁ֥ר יוּלַּ֖ד לְ/יִשְׂרָאֵ֑ל וְ/אוּלָ֛ם לַ֥יִשׁ שֵׁם הָ/עִ֖יר לָ/רִאשֹׁנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/029.yaml
  text: And they called the name of the city Dan[a], after the name of Dan their father, who was born to Israel; however, the name of the city formerly was Laish.
translation:
  language: id
  text: Mereka menamai kota itu Dan menurut nama Dan, leluhur mereka,[a] yang dilahirkan bagi Israel. Namun, nama kota itu sebelumnya adalah Lais.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “bapak mereka”; kata Ibrani ini juga dapat merujuk kepada seorang leluhur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ שֵׁם הָעִיר
  choice: Mereka menamai kota itu
  rationale: Ungkapan harfiah 'menyebut nama kota itu' merupakan idiom Ibrani untuk tindakan memberi nama. 'Menamai kota itu' menyampaikan maknanya secara alami dalam bahasa Indonesia modern.
- source_word: דָּן
  choice: Dan
  rationale: Nama diri dipertahankan dalam bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בְּשֵׁם דָּן
  choice: menurut nama Dan
  rationale: Preposisi בְּ bersama שֵׁם menunjukkan bahwa kota itu dinamai dengan merujuk kepada Dan; pilihan ini tetap dekat dengan bentuk sumber tanpa menambahkan gagasan yang tidak dinyatakan.
- source_word: אֲבִיהֶם
  choice: bapak leluhur mereka
  rationale: אָב dapat menunjuk kepada ayah langsung maupun nenek moyang. Dalam konteks suku Dan, yang dimaksud ialah leluhur eponim mereka; 'bapak leluhur' mempertahankan citra kekerabatan dan menjernihkan hubungan genealogis.
- source_word: אֲשֶׁר יוּלַּד לְיִשְׂרָאֵל
  choice: yang dilahirkan bagi Israel
  rationale: Bentuk pasif יוּלַּד dengan לְ dipertahankan, dan nama Israel tidak diganti secara interpretatif dengan Yakub.
- source_word: וְאוּלָם
  choice: Namun
  rationale: Partikel adversatif ini mengontraskan nama baru kota dengan nama terdahulunya.
- source_word: לַיִשׁ
  choice: Lais
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: לָרִאשֹׁנָה
  choice: sebelumnya
  rationale: Dalam konteks ini ungkapan tersebut menunjuk pada keadaan terdahulu, sebelum kota itu dinamai Dan.
theological_decisions:
- issue: Cakupan genealogis אֲבִיהֶם
  choice: bapak leluhur mereka
  alternative: ayah mereka
  rationale: Secara leksikal אָב berarti 'ayah/bapak', tetapi juga lazim menunjuk kepada nenek moyang. Karena Dan bukan ayah langsung semua anggota suku itu, 'bapak leluhur' menyampaikan rujukan genealogis tanpa menghilangkan metafora kekeluargaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami, sedangkan nama Israel dan bentuk pasif pada klausa kelahiran dipertahankan agar tetap dekat dengan teks Ibrani.
