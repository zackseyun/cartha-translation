  to: Ketika mereka berada di dekat rumah Mikha, mereka mengenali suara pemuda Lewi itu. Lalu mereka berbelok ke sana dan bertanya kepadanya, “Siapa yang membawamu ke sini? Apa yang sedang kaulakukan di tempat ini?[a] Apa urusanmu di sini?”[b]
