base_translation:
  language: en
  yaml_path: translation/ot/judges/018/003.yaml
  text: While they were near Micah’s house[a], they recognized the voice of the young Levite. So they turned aside there and said to him[b], “Who brought you here? What are you doing in this place? And what do you have here?”
translation:
  language: id
  text: Ketika mereka berada di dekat rumah Mikha, mereka mengenali suara pemuda Lewi itu. Lalu mereka berbelok ke sana dan bertanya kepadanya, “Siapa yang membawamu ke sini? Apa yang sedang kaulakukan di tempat ini?[a] Apa urusanmu di sini?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Apa yang sedang kaulakukan dalam hal ini?” Ungkapan Ibraninya dapat juga dipahami, “Apa yang sedang kaulakukan dengan ini?”
    reason: lexical_alternative
  - marker: b
    text: Atau, “Apa yang kaumiliki di sini?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה עִם בֵּית מִיכָה
  choice: Ketika mereka berada di dekat rumah Mikha
  rationale: עִם dalam konteks ini menunjukkan kedekatan tempat, bukan kebersamaan dengan rumah. Bentuk 'ketika' mengungkapkan fungsi keadaan dari klausa Ibrani secara alami.
- source_word: הִכִּירוּ אֶת קוֹל הַנַּעַר הַלֵּוִי
  choice: mereka mengenali suara pemuda Lewi itu
  rationale: Hifil נכר berarti 'mengenali'; קוֹל berarti 'suara', dan הַנַּעַר הַלֵּוִי menunjuk kepada pemuda yang adalah seorang Lewi.
- source_word: וַיָּסוּרוּ שָׁם
  choice: Lalu mereka menyimpang ke sana
  rationale: סור menggambarkan tindakan menyimpang atau berbelok dari rute untuk mendatangi tempat itu. 'Menyimpang ke sana' mempertahankan gambaran geraknya.
- source_word: מִי הֱבִיאֲךָ הֲלֹם
  choice: Siapa yang membawamu ke sini?
  rationale: Bentuk Hifil בוא bersifat kausatif, yaitu 'membawa', sedangkan הֲלֹם berarti 'ke sini'.
- source_word: וּמָה אַתָּה עֹשֶׂה בָּזֶה
  choice: Apa yang sedang kaulakukan di tempat ini?
  rationale: בָּזֶה secara harfiah berarti 'dalam/dengan ini' dan bersifat eliptis. Konteks mendukung pengertian lokatif, tetapi kemungkinan harfiahnya dipertahankan dalam catatan kaki.
- source_word: וּמַה לְּךָ פֹה
  choice: Apa urusanmu di sini?
  rationale: Ungkapan idiomatis מַה לְךָ פֹה menanyakan kepentingan, urusan, atau apa yang dimiliki seseorang di suatu tempat. 'Apa urusanmu di sini?' paling alami dalam bahasa Indonesia, sementara bentuk lebih konkret dicatat sebagai alternatif.
