base_translation:
  language: en
  yaml_path: translation/ot/judges/018/023.yaml
  text: They called out to the sons of Dan[a], and they turned around and said to Micah, “What is the matter with you[b], that you have called out?”
translation:
  language: id
  text: Mereka memanggil orang-orang Dan, lalu orang-orang Dan itu berbalik dan berkata kepada Mikha, “Ada apa denganmu sehingga kamu berteriak?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sehingga kamu berseru” atau “sehingga kamu mengadakan teriakan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְאוּ אֶל־בְּנֵי דָן
  choice: Mereka berseru kepada orang-orang Dan
  rationale: קרא berarti memanggil atau berseru. Dalam adegan ini, mereka berseru agar rombongan Dan mendengar; בְּנֵי דָן secara harfiah berarti 'anak-anak Dan', tetapi 'orang-orang Dan' merupakan ungkapan Indonesia yang alami untuk anggota suku itu.
- source_word: וַיַּסֵּבּוּ פְּנֵיהֶם
  choice: lalu orang-orang Dan itu menoleh
  rationale: Ungkapan harfiahnya 'mereka memalingkan wajah mereka'. 'Menoleh' menyampaikan tindakan berbalik menghadap para pengejar secara ringkas dan alami; subjek diulangi demi mencegah ketaksaan pronomina.
- source_word: וַיֹּאמְרוּ לְמִיכָה
  choice: dan berkata kepada Mikha
  rationale: Padanan langsung dan alami bagi verba אמר dengan preposisi לְ serta nama diri Mikha.
- source_word: מַה־לְּךָ
  choice: Ada apa denganmu
  rationale: Idiom ini menanyakan keadaan, masalah, atau alasan tindakan seseorang. Padanan ini mempertahankan nada pertanyaan yang dapat terdengar menantang dalam konteksnya.
- source_word: כִּי נִזְעָקְתָּ
  choice: sehingga kamu mengerahkan orang-orang ini
  rationale: Nifal זעק di sini dapat berarti membuat orang berkumpul karena seruan, bukan sekadar bersuara. Bentuk orang kedua tunggal merujuk kepada Mikha, sedangkan konteks ayat sebelumnya menunjukkan rombongan yang dikerahkannya. Kata 'ini' bersifat kontekstual dan dijelaskan lewat catatan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Orang-orang Dan' dipilih daripada 'anak-anak Dan' karena lebih alami sebagai sebutan kesukuan. Pengulangan subjek menjernihkan pergantian pelaku. Catatan mempertahankan kemungkinan bahwa נִזְעָקְתָּ hanya menunjuk pada tindakan berseru.
