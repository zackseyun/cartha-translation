base_translation:
  language: en
  yaml_path: translation/ot/judges/018/011.yaml
  text: So six hundred men from the clan of the Danites set out from there[a], from Zorah and from Eshtaol[b], armed with weapons of war.
translation:
  language: id
  text: Lalu enam ratus orang laki-laki dari klan orang Dan[b] berangkat dari sana, dari Zora dan Esytaol, dengan menyandang senjata perang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bersabuk dengan perlengkapan perang.”
    reason: lexical_alternative
  - marker: b
    text: Atau “keluarga besar orang Dan”; istilah Ibrani ini menunjuk kelompok kekerabatan dalam suatu suku, yaitu klan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: berangkat
  rationale: Dalam alur narasi, bentuk dari נסע menyatakan mulai bergerak atau meninggalkan tempat. “Berangkat” alami dalam bahasa Indonesia dan sesuai dengan konteks rombongan yang memulai perjalanan.
- source_word: מִשָּׁם
  choice: dari sana
  rationale: Padanan langsung bagi keterangan tempat ini dan menjaga kaitan dengan lokasi yang baru disebutkan dalam konteks.
- source_word: מִמִּשְׁפַּחַת הַדָּנִי
  choice: dari kaum Dan
  rationale: מִשְׁפָּחָה menunjuk kelompok kekerabatan di bawah tingkat suku. “Kaum Dan” ringkas dan wajar, tanpa memperluas maknanya menjadi seluruh suku Dan.
- source_word: מִצָּרְעָה וּמֵאֶשְׁתָּאֹל
  choice: dari Zora dan Estaol
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia. “Yaitu” ditambahkan untuk memperjelas bahwa kedua kota itu menerangkan “dari sana” tanpa mengubah isi.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: enam ratus orang laki-laki
  rationale: אִישׁ dalam konstruksi bilangan ini menunjuk laki-laki yang dihitung, dan konteks militer menguatkan makna tersebut.
- source_word: חָגוּר
  choice: dengan menyandang
  rationale: Secara harfiah berarti ‘bersabuk’ atau ‘terikat pada pinggang’, tetapi bersama perlengkapan perang menggambarkan orang yang telah mengenakan atau membawa senjata untuk bertempur. “Menyandang” mempertahankan gambaran perlengkapan yang dikenakan sambil tetap alami.
- source_word: כְּלֵי מִלְחָמָה
  choice: senjata perang
  rationale: כְּלִי dapat berarti alat atau perlengkapan; dalam konteks militer frasa ini menunjuk senjata/peralatan tempur. “Senjata perang” mempertahankan unsur eksplisit מִלְחָמָה.
