  - severity: low
    issue: Nama tempat “Estaol” tidak memakai bentuk Indonesia Alkitab yang lazim.
    rationale: Bentuk “Esytaol” lebih selaras dengan penggunaan nama tempat tradisional dalam Alkitab bahasa Indonesia.
  - severity: low
