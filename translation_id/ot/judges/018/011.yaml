  register: Bahasa Indonesia baku-modern dengan gaya naratif yang lugas dan bermartabat. Susunan kalimat dibuat alami, sementara pengulangan unsur asal tempat tetap dipertahankan melalui “dari sana, yaitu dari Zora dan Estaol”. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
