  terminology: “Senjata perang” dan “menyandang” dapat diterima untuk כְּלֵי מִלְחָמָה dan חָגוּר dalam konteks ini. “Esytaol” dipakai sebagai bentuk nama tempat yang telah mapan dalam Alkitab bahasa Indonesia. Catatan tentang מִשְׁפָּחָה diperjelas agar alternatifnya tidak mengaburkan tingkat kekerabatan yang dimaksud.
