  source_fidelity: Perlu revisi kecil. Terjemahan pada dasarnya menyampaikan enam ratus laki-laki yang berangkat, asal mereka dari unit kekerabatan Dan, kedua tempat asal, dan kesiapan militer mereka. Namun, “yaitu” membuat hubungan antara “dari sana” dan nama-nama kota lebih eksplikatif daripada teks Ibrani, dan “Estaol” tidak mengikuti bentuk nama yang lazim dalam penggunaan Alkitab bahasa Indonesia.
