  text: וַ/יִּיטַב֙ לֵ֣ב הַ/כֹּהֵ֔ן וַ/יִּקַּח֙ אֶת הָ֣/אֵפ֔וֹד וְ/אֶת הַ/תְּרָפִ֖ים וְ/אֶת הַ/פָּ֑סֶל וַ/יָּבֹ֖א בְּ/קֶ֥רֶב הָ/עָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/020.yaml
  text: And the priest’s heart was glad[a], and he took the ephod, the household idols, and the carved image[b], and went into the midst of the people.
translation:
  language: id
  text: Hati imam itu pun menjadi gembira, lalu ia mengambil efod, berhala-berhala rumah tangga[a], dan patung pahatan[b] itu, kemudian masuk ke tengah-tengah rombongan itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “terafim.” Istilah Ibrani ini mengacu pada benda-benda kultis atau dewa-dewa rumah tangga.
    reason: lexical_alternative
  - marker: b
    text: Atau “berhala” atau “patung ukiran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיטַב לֵב הַכֹּהֵן
  choice: Hati imam itu pun menjadi gembira
  rationale: Mempertahankan ungkapan Ibrani secara cukup dekat—secara harfiah hati imam itu menjadi baik/gembira—namun tetap alami dan jelas dalam bahasa Indonesia.
- source_word: הָאֵפוֹד
  choice: efod
  rationale: Istilah teknis kultis ini ditransliterasikan karena tidak memiliki padanan Indonesia yang ringkas dan tepat.
- source_word: הַתְּרָפִים
  choice: berhala-berhala rumah tangga
  rationale: Mengomunikasikan bahwa terafim merupakan benda-benda kultis atau ilah rumah tangga, dengan bentuk jamak yang mencerminkan bentuk Ibraninya.
- source_word: הַפָּסֶל
  choice: patung pahatan
  rationale: Menunjukkan secara konkret sebuah patung atau citra yang dibuat dengan dipahat; lebih modern daripada ungkapan tradisional yang arkais.
- source_word: בְּקֶרֶב הָעָם
  choice: masuk ke tengah-tengah rombongan itu
  rationale: Menjaga unsur gerak pada וַיָּבֹא dan nuansa ruang dari בְּקֶרֶב. Dalam konteks ini הָעָם menunjuk kepada kelompok orang Dan yang sedang bergerak, sehingga 'rombongan' lebih alami daripada 'rakyat'.
theological_decisions:
- issue: Penyebutan תְּרָפִים sebagai benda kultis
  choice: berhala-berhala rumah tangga
  alternative: terafim; dewa-dewa rumah tangga
  rationale: '''Berhala-berhala rumah tangga'' menyampaikan fungsi kultisnya tanpa memberi legitimasi teologis kepada benda-benda tersebut; catatan kaki mempertahankan istilah sumber sebagai alternatif.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang bermartabat. Ungkapan 'hati ... menjadi gembira' mempertahankan citraan idiom Ibrani, sedangkan 'rombongan' memperjelas bahwa הָעָם di sini adalah kelompok orang Dan, bukan rakyat sebagai suatu bangsa.
