translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat. Struktur kalimat panjang Ibrani dipecah agar jelas bagi pembaca umum. Pengulangan gagasan keamanan dipertahankan melalui pasangan 'aman' dan 'tenang dan tenteram', sedangkan ketidakpastian ungkapan יוֹרֵשׁ עֶצֶר dijelaskan dalam catatan kaki dan tidak diselesaikan secara dogmatis.
