  text: וַ/יֵּלְכוּ֙ חֲמֵ֣שֶׁת הָ/אֲנָשִׁ֔ים וַ/יָּבֹ֖אוּ לָ֑יְשָׁ/ה וַ/יִּרְא֣וּ אֶת הָ/עָ֣ם אֲשֶׁר בְּ/קִרְבָּ֣/הּ יוֹשֶֽׁבֶת לָ֠/בֶטַח כְּ/מִשְׁפַּ֨ט צִדֹנִ֜ים שֹׁקֵ֣ט וּ/בֹטֵ֗חַ וְ/אֵין מַכְלִ֨ים דָּבָ֤ר בָּ/אָ֨רֶץ֙ יוֹרֵ֣שׁ עֶ֔צֶר וּ/רְחֹקִ֥ים הֵ֨מָּה֙ מִ/צִּ֣דֹנִ֔ים וְ/דָבָ֥ר אֵין לָ/הֶ֖ם עִם אָדָֽם־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/007.yaml
  text: Then the five men went and came to Laish[a], and they saw the people who were in it, dwelling securely, according to the custom of the Sidonians, quiet and secure. And there was no one in the land to humiliate them in anything, possessing authority; and they were far from the Sidonians[c][b], and they had no dealings with anyone.
translation:
  language: id
  text: Lalu kelima orang itu pergi dan tiba di Lais. Mereka melihat bahwa penduduk di sana hidup dengan aman menurut kebiasaan orang Sidon[a], tenang dan tenteram. Di negeri itu tidak ada seorang pun yang mempermalukan mereka dalam hal apa pun atau yang memegang kekuasaan atas mereka.[b] Mereka tinggal jauh dari orang Sidon dan tidak mempunyai hubungan dengan siapa pun.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “mengikuti cara hidup orang Sidon.”'
    reason: lexical_alternative
  - marker: b
    text: 'Teks Ibrani sulit. Secara lebih harfiah: “tidak ada yang mempermalukan sesuatu di negeri itu, yang memiliki kekuasaan.” Maksudnya mungkin bahwa tidak ada penguasa atau penindas yang dapat mempermalukan atau menguasai mereka.'
    reason: source_ambiguity
  - marker: c
    text: 'Atau: “tidak mempunyai urusan atau persekutuan dengan siapa pun.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָיְשָׁה
  choice: Lais
  rationale: Nama tempat לַיִשׁ dialihaksarakan dalam bentuk yang wajar bagi pembaca bahasa Indonesia; akhiran ־ָה menandai arah, bukan bagian dari nama.
- source_word: יוֹשֶׁבֶת לָבֶטַח
  choice: hidup dengan aman
  rationale: Mengungkapkan keadaan menetap tanpa ancaman secara alami dalam bahasa Indonesia.
- source_word: כְּמִשְׁפַּט צִדֹנִים
  choice: menurut kebiasaan orang Sidon
  rationale: מִשְׁפָּט di sini paling mungkin menunjuk pada tata cara atau pola hidup, bukan putusan hukum.
- source_word: שֹׁקֵט וּבֹטֵחַ
  choice: tenang dan tenteram
  rationale: Mempertahankan pasangan istilah yang menekankan kehidupan tanpa gangguan dan rasa aman, tanpa pengulangan kaku atas kata 'aman' sebelumnya.
- source_word: מַכְלִים דָּבָר
  choice: mempermalukan mereka dalam hal apa pun
  rationale: Bentuk Hifil dari כלם menyatakan tindakan mendatangkan malu; objek tersirat diperjelas dari konteks.
- source_word: יוֹרֵשׁ עֶצֶר
  choice: yang memegang kekuasaan atas mereka
  rationale: Ungkapan Ibrani ini sulit. Terjemahan menyampaikan kemungkinan fungsi seorang penguasa yang mengendalikan atau menindas, sementara catatan kaki mempertahankan ketidakpastian teks.
- source_word: וּרְחֹקִים הֵמָּה מִצִּדֹנִים
  choice: Mereka tinggal jauh dari orang Sidon
  rationale: Pernyataan jarak diterjemahkan secara lugas; 'tinggal' tersirat oleh uraian tentang permukiman mereka.
- source_word: וְדָבָר אֵין לָהֶם עִם אָדָם
  choice: tidak mempunyai hubungan dengan siapa pun
  rationale: Idiom 'tidak ada perkara/perkataan dengan' menunjuk pada ketiadaan hubungan atau urusan; אָדָם bersifat umum sehingga diterjemahkan 'siapa pun'.
