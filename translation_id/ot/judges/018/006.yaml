base_translation:
  language: en
  yaml_path: translation/ot/judges/018/006.yaml
  text: And the priest said to them[a], “Go in peace. The journey on which you are going is before Yahweh.”
translation:
  language: id
  text: Lalu imam itu berkata kepada mereka, “Pergilah dengan damai. Perjalanan yang kalian tempuh berada di hadapan Yahweh[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Jalan kalian ada di hadapan Yahweh,” yaitu perjalanan kalian berada dalam pandangan-Nya. Ungkapan ini tidak serta-merta berarti bahwa Yahweh secara tegas menyetujui perjalanan tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “lalu” alami dalam narasi Indonesia tanpa menentukan jeda waktu secara berlebihan.
- source_word: הַכֹּהֵן
  choice: imam itu
  rationale: Nomina definit merujuk kepada imam yang sudah dikenal dalam konteks.
- source_word: לְכוּ
  choice: Pergilah
  rationale: Imperatif jamak dari הלך diterjemahkan secara langsung dan wajar.
- source_word: לְשָׁלוֹם
  choice: dengan damai
  rationale: Mempertahankan ungkapan berkat perpisahan Ibrani tanpa mempersempitnya menjadi sekadar keselamatan dalam perjalanan.
- source_word: נֹכַח
  choice: berada di hadapan
  rationale: Menyatakan bahwa perjalanan tersebut ada di depan atau dalam pandangan Yahweh; pilihan ini tidak menambahkan gagasan persetujuan atau jaminan keberhasilan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar.
- source_word: דַּרְכְּכֶם
  choice: perjalanan yang kalian tempuh
  rationale: Secara harfiah berarti “jalan kalian”; dalam konteks para pengintai yang sedang bepergian, “perjalanan” menyampaikan maksudnya secara alami, sedangkan klausa berikut mempertahankan gambaran menempuh jalan.
- source_word: אֲשֶׁר תֵּלְכוּ בָהּ
  choice: yang kalian tempuh
  rationale: Klausa relatif ini menerangkan perjalanan atau jalan mereka; “tempuh” merupakan ungkapan Indonesia yang alami untuk bergerak melalui suatu jalan atau menjalani perjalanan.
theological_decisions:
- issue: Makna pernyataan imam mengenai Yahweh dan perjalanan orang-orang Dan
  choice: Perjalanan mereka “berada di hadapan Yahweh,” yakni berada dalam pandangan-Nya.
  alternative: “Yahweh menyetujui perjalanan kalian” atau “Perjalanan kalian berada dalam pemeliharaan Yahweh.”
  rationale: Frasa נֹכַח יְהוָה paling langsung menyatakan posisi perjalanan itu di hadapan atau dalam pandangan Yahweh. Teks tidak secara eksplisit menyatakan persetujuan, berkat, pemeliharaan, ataupun jaminan keberhasilan; karena itu ketegangan teologisnya dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “kalian” menyatakan dengan jelas bahwa pihak yang disapa berbentuk jamak. Susunan kalimat dibuat alami tanpa menghilangkan ambiguitas frasa Ibrani mengenai sikap Yahweh terhadap perjalanan itu.
