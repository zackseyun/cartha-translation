translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. 'Bani Dan' mempertahankan identitas kesukuan, 'engkau' menjaga sapaan tunggal kepada Mikha, dan 'kalian' mencerminkan bentuk jamak Ibrani pada sasaran serangan. Penanda catatan kaki ditempatkan tepat setelah bagian yang dijelaskan.
