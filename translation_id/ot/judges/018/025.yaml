base_translation:
  language: en
  yaml_path: translation/ot/judges/018/025.yaml
  text: And the sons of Dan said to him[a], “Do not let your voice be heard among us, lest men bitter of soul fall upon you[b], and you lose your life and the lives of your household.”
translation:
  language: id
  text: Lalu bani Dan berkata kepadanya, “Jangan sampai suaramu terdengar di antara kami,[a] kalau tidak, orang-orang yang sakit hati[b] akan menyerang kalian, dan engkau akan kehilangan nyawamu serta nyawa seisi rumahmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Jangan biarkan suaramu terdengar bersama kami.” Ungkapan ini merupakan peringatan agar ia tidak terus bersuara di hadapan mereka.
    reason: lexical_alternative
  - marker: b
    text: Atau, “orang-orang yang nekat,” “orang-orang yang ganas,” atau secara lebih harfiah, “orang-orang yang pahit jiwanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי דָן
  choice: bani Dan
  rationale: Ungkapan ini mempertahankan bentuk kekerabatan Ibrani sekaligus memakai istilah Indonesia yang lazim untuk suatu suku.
- source_word: אַל תַּשְׁמַע קוֹלְךָ עִמָּנוּ
  choice: Jangan sampai suaramu terdengar di tengah-tengah kami
  rationale: Terjemahan ini mempertahankan citra harfiah tentang suara yang terdengar dan menyampaikan ancaman agar Mikha berhenti bersuara di antara mereka.
- source_word: פֶּן
  choice: supaya jangan
  rationale: Ungkapan ini secara alami menyampaikan akibat yang diperingatkan atau diancamkan tanpa mengubah hubungan antarklausa.
- source_word: יִפְגְּעוּ בָכֶם
  choice: menyerang kalian
  rationale: Dalam konteks bermusuhan ini, verba tersebut menunjuk pada perjumpaan yang berujung serangan. Bentuk jamak 'kalian' mempertahankan perubahan dari sapaan tunggal kepada objek jamak dalam bahasa Ibrani.
- source_word: אֲנָשִׁים מָרֵי נֶפֶשׁ
  choice: orang-orang yang sakit hati
  rationale: Idiom Ibrani ini menggambarkan orang yang pahit, nekat, dan berbahaya. 'Sakit hati' cukup alami dalam bahasa Indonesia, sedangkan alternatif yang lebih eksplisit dicatat dalam catatan kaki.
- source_word: וְאָסַפְתָּה נַפְשְׁךָ
  choice: lalu engkau kehilangan nyawamu
  rationale: Dalam konteks ini, idiom אסף dengan נפש menyatakan hilangnya nyawa, bukan tindakan mengumpulkan secara harfiah.
- source_word: וְנֶפֶשׁ בֵּיתֶךָ
  choice: dan nyawa seisi rumahmu
  rationale: Walaupun נפש berbentuk tunggal, בֵּיתֶךָ merujuk secara kolektif kepada anggota rumah tangga; ungkapan Indonesia ini menyampaikan bahwa seluruh rumah tangganya terancam.
