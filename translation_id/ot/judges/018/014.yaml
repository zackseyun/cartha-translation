  text: וַֽ/יַּעֲנ֞וּ חֲמֵ֣שֶׁת הָ/אֲנָשִׁ֗ים הַ/הֹלְכִים֮ לְ/רַגֵּל֮ אֶת הָ/אָ֣רֶץ לַיִשׁ֒ וַ/יֹּֽאמְרוּ֙ אֶל אֲחֵי/הֶ֔ם הַ/יְדַעְתֶּ֗ם כִּ֠י יֵ֣שׁ בַּ/בָּתִּ֤ים הָ/אֵ֨לֶּה֙ אֵפ֣וֹד וּ/תְרָפִ֔ים וּ/פֶ֖סֶל וּ/מַסֵּכָ֑ה וְ/עַתָּ֖ה דְּע֥וּ מַֽה תַּעֲשֽׂוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/014.yaml
  text: Then the five men who had gone to spy out the land of Laish answered and said to their brothers[a], “Do you know that in these houses there are an ephod, teraphim, a carved image, and a cast image? So now[b], know what you will do.”
translation:
  language: id
  text: Kemudian kelima orang yang dahulu pergi mengintai wilayah Lais itu menjawab dan berkata kepada saudara-saudara mereka, “Tahukah kalian bahwa di rumah-rumah ini ada efod, terafim[a], patung pahatan, dan patung tuangan? Sekarang, pertimbangkanlah apa yang akan kalian lakukan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Terafim adalah benda atau patung kultis yang berkaitan dengan rumah tangga; istilah Ibraninya dapat juga dipahami sebagai dewa-dewa rumah tangga.
    reason: Menjelaskan istilah transliterasi yang makna tepat dan bentuk bendanya tidak sepenuhnya pasti.
lexical_decisions:
- source_word: וַיַּעֲנוּ ... וַיֹּאמְרוּ
  choice: berkata
  rationale: Gabungan formula naratif harfiah ‘menjawab dan berkata’ berfungsi memperkenalkan tuturan. Dalam bahasa Indonesia modern, ‘berkata’ menyampaikan fungsi itu secara alami; ‘menjawab’ dapat menyiratkan adanya pertanyaan yang tidak disebutkan.
- source_word: חֲמֵשֶׁת הָאֲנָשִׁים
  choice: kelima orang
  rationale: Menunjuk kembali kepada kelompok lima pengintai yang telah disebutkan dalam konteks.
- source_word: הַהֹלְכִים לְרַגֵּל
  choice: yang dahulu pergi mengintai
  rationale: Partisip tersebut mencirikan mereka berdasarkan tugas pengintaian yang sudah dilakukan; ‘dahulu pergi’ menandai hubungan waktu itu secara wajar.
- source_word: אֶת הָאָרֶץ לַיִשׁ
  choice: wilayah Lais
  rationale: אֶרֶץ di sini ialah daerah yang berkaitan dengan kota Lais; ‘wilayah Lais’ lebih alami daripada konstruksi yang dapat memberi kesan bahwa Lais adalah nama negeri.
- source_word: אֶל אֲחֵיהֶם
  choice: kepada saudara-saudara mereka
  rationale: Mempertahankan istilah kekerabatan maskulin Ibrani, yang dalam konteks mengacu kepada sesama orang Dan.
- source_word: הֲיְדַעְתֶּם
  choice: Tahukah kalian
  rationale: Bentuk tanya ini menarik perhatian para pendengar kepada informasi yang akan mendorong tindakan.
- source_word: בַּבָּתִּים הָאֵלֶּה
  choice: di rumah-rumah ini
  rationale: Terjemahan langsung bentuk jamak בָּתִּים tanpa menafsirkan bangunan-bangunan itu sebagai kompleks ibadah atau rumah tangga.
- source_word: אֵפוֹד
  choice: efod
  rationale: Istilah kultis khusus yang tidak memiliki padanan Indonesia sederhana; transliterasi mempertahankan kekhususannya.
- source_word: תְּרָפִים
  choice: terafim
  rationale: Transliterasi mempertahankan istilah Ibrani dan menghindari penyempitan makna menjadi sekadar patung rumah tangga atau dewa rumah tangga.
- source_word: פֶסֶל
  choice: patung pahatan
  rationale: Menunjukkan benda berbentuk citra yang dibuat dengan memahat, serta membedakannya dari benda berikutnya.
- source_word: מַסֵּכָה
  choice: patung tuangan
  rationale: Menunjukkan citra yang dibuat dengan menuang bahan cair ke dalam cetakan; berbeda dari patung pahatan.
- source_word: דְּעוּ מַה תַּעֲשׂוּן
  choice: pertimbangkanlah apa yang akan kalian lakukan
  rationale: Secara idiomatis menyampaikan desakan agar mereka menyadari informasi itu dan menentukan tindakan, tanpa menetapkan tindakan tertentu.
theological_decisions:
- issue: Daftar benda kultis di rumah Mikha
  choice: 'Mempertahankan empat sebutan berbeda: efod, terafim, patung pahatan, dan patung tuangan.'
  alternative: Menyatukannya sebagai perlengkapan berhala atau menerjemahkan terafim sebagai berhala rumah tangga.
  rationale: Teks Ibrani sengaja menyebut benda-benda itu dengan istilah berbeda. Terjemahan tidak menambahkan penilaian atau menghapus perbedaan di antara objek-objek tersebut.
- issue: Daya ujar דְּעוּ מַה תַּעֲשׂוּן
  choice: pertimbangkanlah apa yang akan kalian lakukan
  alternative: ketahuilah apa yang akan kalian lakukan; kalian tahu apa yang harus dilakukan
  rationale: Ungkapan itu mendesak pendengar menentukan respons. Pilihan ini menjaga dorongannya tanpa menganggap tindakan yang dimaksud sudah pasti atau secara eksplisit diperintahkan.
- issue: Istilah kekerabatan אֲחֵיהֶם
  choice: saudara-saudara mereka
  alternative: sesama orang Dan; rekan-rekan mereka
  rationale: Pilihan ini mempertahankan metafora kekerabatan asli dan sesuai dengan kelompok laki-laki dalam konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk ‘kalian’ dipakai karena sapaan Ibrani berbentuk jamak dan percakapan berlangsung di antara sesama anggota rombongan. Nama לַיִשׁ ditulis ‘Lais’ sesuai bentuk yang lazim dalam Alkitab bahasa Indonesia.
