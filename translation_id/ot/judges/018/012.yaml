base_translation:
  language: en
  yaml_path: translation/ot/judges/018/012.yaml
  text: They went up and camped at Kiriath-jearim in Judah. Therefore that place has been called Mahaneh-dan to this day; behold, it is west of Kiriath-jearim.
translation:
  language: id
  text: Mereka naik dan berkemah di Kiryat-Yearim, di wilayah Yehuda. Itulah sebabnya tempat itu disebut Mahane-Dan[a] sampai hari ini. Tempat itu berada di belakang Kiryat-Yearim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahane-Dan berarti “Perkemahan Dan”.
    reason: Menjelaskan arti nama tempat Ibrani yang berkaitan langsung dengan perkemahan suku Dan dalam narasi.
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: Mereka berangkat
  rationale: Secara harfiah berarti 'mereka naik'. Dalam konteks perjalanan, ungkapan ini secara wajar menyatakan keberangkatan atau perjalanan menuju suatu tempat; 'berangkat' menghindari kesan bahwa arah vertikal merupakan pokok pernyataan.
- source_word: בְּקִרְיַת יְעָרִים בִּיהוּדָה
  choice: di Kiryat-Yearim, di wilayah Yehuda
  rationale: Menjaga nama tempat sambil memperjelas bahwa Yehuda adalah kawasan tempat Kiryat-Yearim berada.
- source_word: מַחֲנֵה דָן
  choice: Mahane-Dan
  rationale: Nama tempat ditransliterasikan; maknanya, 'Perkemahan Dan', dicantumkan dalam catatan kaki agar permainan nama tetap terlihat.
- source_word: הִנֵּה
  choice: Tempat itu
  rationale: Partikel penunjuk ini memperkenalkan keterangan lokasi. Dalam bahasa Indonesia modern, acuan eksplisit menghasilkan kalimat alami tanpa perlu mempertahankan seruan harfiah 'lihatlah'.
- source_word: אַחֲרֵי קִרְיַת יְעָרִים
  choice: di sebelah barat Kiryat-Yearim
  rationale: אַחֲרֵי secara dasar berarti 'di belakang'. Dalam orientasi Ibrani kuno yang menghadap ke timur, 'belakang' dapat menunjuk ke barat; konteks ini dipahami sebagai keterangan geografis.
