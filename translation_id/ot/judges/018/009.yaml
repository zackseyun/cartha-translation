base_translation:
  language: en
  yaml_path: translation/ot/judges/018/009.yaml
  text: And they said, “Rise up, and let us go up against them, for we have seen the land, and behold, it is very good. And you are keeping silent—do not be sluggish to go, to enter, to take possession of the land.”
translation:
  language: id
  text: Lalu mereka berkata, “Bangkitlah, mari kita maju menyerang mereka! Sebab kami telah melihat negeri itu, dan sungguh, negeri itu sangat baik. Namun kalian diam saja. Jangan berlambat-lambat untuk pergi, masuk, dan merebut negeri itu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קוּמָה וְנַעֲלֶה
  choice: Bangkitlah, mari kita maju
  rationale: Mempertahankan seruan untuk segera bertindak; נעלה secara harfiah berarti ‘naik’, tetapi dalam konteks gerakan militer lebih alami diterjemahkan ‘maju’.
- source_word: עֲלֵיהֶם
  choice: menyerang mereka
  rationale: Preposisi על dalam konteks ekspedisi bersenjata menyatakan gerakan melawan pihak yang dituju.
- source_word: וְהִנֵּה טוֹבָה מְאֹד
  choice: dan sungguh, negeri itu sangat baik
  rationale: ‘Sungguh’ menyampaikan fungsi penegasan והנה secara wajar dalam bahasa Indonesia.
- source_word: מַחְשִׁים
  choice: hanya berdiam diri
  rationale: Kata ini berarti diam atau tidak bertindak; ‘berdiam diri’ menangkap teguran terhadap kepasifan dalam konteks ini.
- source_word: אַל תֵּעָצְלוּ
  choice: Jangan berlambat-lambat
  rationale: Menyampaikan larangan agar tidak lamban atau enggan bertindak tanpa memakai ungkapan Indonesia yang kaku.
- source_word: לָלֶכֶת לָבֹא לָרֶשֶׁת
  choice: pergi ke sana untuk memasuki dan merebut
  rationale: 'Mempertahankan rangkaian tujuan Ibrani: pergi, masuk, lalu mengambil negeri itu sebagai milik; ‘merebut’ sesuai dengan konteks pengambilalihan wilayah.'
theological_decisions:
- issue: Makna ירש dalam konteks pendudukan tanah
  choice: merebut negeri itu
  alternative: memiliki negeri itu
  rationale: Dalam konteks ekspedisi suku Dan terhadap penduduk negeri tersebut, verba ini mencakup pengambilalihan nyata, sehingga ‘merebut’ lebih transparan tanpa menambahkan penilaian teologis.
translation_notes:
  register: Bahasa Indonesia baku-modern, lugas, dan bermartabat. Bentuk ‘kalian’ dipakai untuk sapaan orang kedua jamak agar jelas; pertanyaan retoris menyampaikan daya teguran klausa וְאַתֶּם מַחְשִׁים secara alami.
