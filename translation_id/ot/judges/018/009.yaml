    issue: Klausa וְאַתֶּם מַחְשִׁים diterjemahkan sebagai “Mengapa kalian hanya berdiam diri?”
    rationale: Teks sumber menyatakan bahwa mereka diam, bukan mengajukan pertanyaan “mengapa”; kata “hanya” juga tidak dinyatakan.
  - severity: low
    issue: Rangkaian “pergi ke sana untuk memasuki dan merebut” menjadikan tindakan pergi sebagai sarana bagi dua tindakan berikutnya.
    rationale: Teks Ibrani menempatkan “pergi, masuk, merebut/mengambil alih” sebagai tiga infinitif berurutan; koordinasi eksplisit lebih setia.
  revised_text: Lalu mereka berkata, “Bangkitlah, mari kita maju menyerang mereka! Sebab kami telah melihat negeri itu, dan sungguh, negeri itu sangat baik. Namun kalian diam saja. Jangan berlambat-lambat untuk pergi, masuk, dan merebut negeri itu.”
