  yaml_path: translation/ot/judges/018/021.yaml
  text: So they turned and went on[a], and put the little children, the livestock[b], and the valuables before them.
translation:
  language: id
  text: Lalu mereka berbalik dan pergi, serta menempatkan anak-anak kecil, ternak, dan barang-barang berharga[a] di depan mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "barang-barang," "barang bawaan," atau "harta milik." Istilah Ibrani di sini menunjuk kepada harta benda yang dapat dibawa, bukan "kemuliaan."
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, "di hadapan mereka"; dapat juga berarti "mendahului mereka."
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: mereka berbalik
  rationale: Bentuk dari פנה menyatakan tindakan berbalik; pilihan ini mempertahankan gerak naratif tanpa menentukan arah yang tidak dinyatakan.
- source_word: וַיֵּלֵכוּ
  choice: dan pergi
  rationale: הלך melanjutkan rangkaian tindakan secara sederhana; 'pergi' alami dalam narasi Indonesia.
- source_word: וַיָּשִׂימוּ
  choice: menempatkan
  rationale: שׂים berarti menaruh atau menempatkan; 'menempatkan' sesuai karena objek-objek itu diatur pada posisi tertentu.
- source_word: הַטַּף
  choice: anak-anak kecil
  rationale: טף menunjuk kepada anak-anak atau mereka yang masih kecil, khususnya anggota kelompok yang rentan.
- source_word: הַמִּקְנֶה
  choice: ternak
  rationale: מקנה mencakup hewan ternak secara umum, tidak hanya sapi.
- source_word: הַכְּבוּדָּה
  choice: barang-barang berharga
  rationale: Dalam konteks perjalanan, כבודה menunjuk kepada harta atau barang bawaan yang bernilai, bukan 'kemuliaan'.
- source_word: לִפְנֵיהֶם
  choice: di depan mereka
  rationale: Padanan langsung dan alami bagi ungkapan yang berarti 'di hadapan mereka' atau 'lebih dahulu daripada mereka'.
