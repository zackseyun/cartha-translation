id: JDG.18.1
reference: Judges 18:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין מֶ֖לֶךְ בְּ/יִשְׂרָאֵ֑ל וּ/בַ/יָּמִ֣ים הָ/הֵ֗ם שֵׁ֣בֶט הַ/דָּנִ֞י מְבַקֶּשׁ ל֤/וֹ נַֽחֲלָה֙ לָ/שֶׁ֔בֶת כִּי֩ לֹֽא נָ֨פְלָה לּ֜/וֹ עַד הַ/יּ֥וֹם הַ/ה֛וּא בְּ/תוֹךְ שִׁבְטֵ֥י יִשְׂרָאֵ֖ל בְּ/נַחֲלָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/001.yaml
  text: In those days there was no king in Israel[a]. And in those days the tribe of the Danites was seeking for itself an inheritance to dwell in[b], because up to that day no inheritance had fallen to it among the tribes of Israel.
translation:
  language: id
  text: Pada zaman itu tidak ada raja di Israel. Pada zaman itu juga, suku Dan sedang mencari tanah milik pusaka untuk didiami, sebab sampai hari itu belum ada tanah milik pusaka yang jatuh kepadanya[a] di antara suku-suku Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “jatuh kepadanya” berkaitan dengan pembagian tanah sebagai milik pusaka, yang lazimnya ditentukan melalui undian.
    reason: Menjelaskan idiom pembagian tanah tanpa menggantinya dengan tafsiran yang menghapus ketegangan teks.
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Pada zaman itu
  rationale: Ungkapan waktu yang alami dalam bahasa Indonesia dan mempertahankan sudut pandang retrospektif narator. Pengulangannya dipertahankan karena juga diulang dalam teks Ibrani.
- source_word: אֵין מֶלֶךְ בְּיִשְׂרָאֵל
  choice: tidak ada raja di Israel
  rationale: Menyampaikan negasi eksistensial secara langsung tanpa menambahkan penilaian politik atau teologis.
- source_word: שֵׁבֶט הַדָּנִי
  choice: suku Dan
  rationale: Padanan Indonesia yang paling alami bagi kelompok suku keturunan Dan; bentuk adjektival Ibrani tidak perlu ditiru secara kaku sebagai 'suku orang-orang Dan'.
- source_word: מְבַקֵּשׁ לוֹ
  choice: sedang mencari
  rationale: Partisip Ibrani menunjukkan tindakan yang sedang berlangsung. Unsur refleksif לוֹ tersirat secara alami karena yang dicari ialah tanah bagi suku itu sendiri.
- source_word: נַחֲלָה
  choice: tanah milik pusaka
  rationale: Dalam konteks pembagian wilayah antarsuku, kata ini menunjuk pada warisan teritorial. 'Tanah milik pusaka' mempertahankan nuansa warisan sekaligus menjelaskan bahwa yang dimaksud ialah wilayah.
- source_word: לָשֶׁבֶת
  choice: untuk didiami
  rationale: Menunjukkan tujuan pencarian wilayah, yaitu menetap dan tinggal di sana, dalam ungkapan Indonesia yang wajar.
- source_word: כִּי לֹא נָפְלָה לוֹ
  choice: sebab ... belum ada ... yang jatuh kepadanya
  rationale: Mempertahankan idiom Ibrani tentang bagian tanah yang 'jatuh' kepada suatu suku, sambil memakai susunan kalimat Indonesia yang dapat dipahami.
- source_word: עַד הַיּוֹם הַהוּא
  choice: sampai hari itu
  rationale: Padanan temporal langsung yang mempertahankan perspektif naratif.
- source_word: בְּתוֹךְ שִׁבְטֵי יִשְׂרָאֵל
  choice: di antara suku-suku Israel
  rationale: Padanan idiomatis untuk posisi suku Dan dalam lingkungan pembagian tanah kepada suku-suku Israel.
- source_word: בְּנַחֲלָה
  choice: tanah milik pusaka
  rationale: Nuansa cara atau status sebagai pusaka diserap ke dalam frasa utama agar kalimat Indonesia tidak menjadi kaku atau berulang secara tidak alami.
theological_decisions:
- issue: Pernyataan bahwa tidak ada raja di Israel
  choice: Dipertahankan sebagai pernyataan narator tanpa tambahan penilaian
  alternative: Menerjemahkannya dengan bahasa yang secara eksplisit mengecam zaman para hakim atau mendukung monarki
  rationale: Teks menyatakan keadaan politik tersebut, tetapi terjemahan tidak boleh memutuskan sendiri apakah pernyataan itu sepenuhnya netral atau mengandung kritik tersirat.
- issue: Ketegangan antara ayat ini dan pemberian wilayah kepada Dan dalam Yosua 19
  choice: Pernyataan Ibrani bahwa belum ada pusaka yang 'jatuh kepadanya' dipertahankan
  alternative: Menjelaskannya dalam teks utama sebagai kegagalan suku Dan merebut atau menguasai wilayah yang sudah dibagikan
  rationale: Penjelasan alternatif mungkin sesuai dengan konteks lebih luas, tetapi ayat ini sendiri memakai bahasa yang lebih tajam dan ambigu. Terjemahan tidak boleh diam-diam menghapus ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “Pada zaman itu” dipertahankan sebagai ciri penekanan naratif. Istilah “tanah milik pusaka” dipilih agar pembaca umum memahami bahwa נַחֲלָה di sini adalah warisan berupa wilayah, bukan harta warisan secara umum.
