base_translation:
  language: en
  yaml_path: translation/ot/judges/018/022.yaml
  text: When they had gone some distance from Micah’s house[a], the men who were in the houses near Micah’s house were called together, and they overtook the sons of Dan.
translation:
  language: id
  text: Ketika mereka sudah jauh dari rumah Mikha, para lelaki yang berada di rumah-rumah dekat rumah Mikha dikerahkan[a], lalu mereka menyusul orang-orang Dan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: menyerukan tanda bahaya. Kata kerja Ibrani ini dapat menunjuk pada seruan tanda bahaya atau pada pengerahan orang-orang sebagai akibat seruan itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה הִרְחִיקוּ מִבֵּית מִיכָה
  choice: ketika mereka sudah agak jauh dari rumah Mikha
  rationale: Bentuk הִרְחִיקוּ menyatakan bahwa rombongan Dan telah menjauh. Ungkapan 'sudah agak jauh' menyampaikan urutan waktu dan jarak secara alami tanpa mengartikan bahwa mereka sudah sangat jauh.
- source_word: הָאֲנָשִׁים
  choice: orang-orang
  rationale: Dalam konteks ini אֲנָשִׁים menunjuk kepada kelompok laki-laki yang mengejar rombongan Dan. 'Orang-orang' terdengar alami dalam narasi Indonesia dan tidak mengubah mereka menjadi seluruh penduduk tanpa batas.
- source_word: אֲשֶׁר בַּבָּתִּים אֲשֶׁר עִם בֵּית מִיכָה
  choice: yang berada di rumah-rumah dekat rumah Mikha
  rationale: Frasa Ibrani harfiahnya agak kaku, 'di rumah-rumah yang bersama/dekat rumah Mikha.' Di sini עִם menyatakan kedekatan atau keterkaitan; 'dekat' mempertahankan maksud spasial dengan bahasa Indonesia yang jelas.
- source_word: נִזְעֲקוּ
  choice: dikerahkan
  rationale: Bentuk nifal ini dapat menggambarkan orang-orang yang dihimpun melalui seruan untuk bertindak. 'Dikerahkan' sesuai dengan pengejaran yang segera terjadi, sedangkan kemungkinan makna seruan tanda bahaya dipertahankan dalam catatan kaki.
- source_word: וַיַּדְבִּיקוּ
  choice: lalu mereka menyusul
  rationale: Kata kerja ini menyatakan bahwa para pengejar mencapai atau menyusul rombongan di depan mereka. 'Menyusul' ringkas dan alami dalam bahasa Indonesia.
- source_word: אֶת בְּנֵי דָן
  choice: keturunan Dan
  rationale: Ungkapan harfiahnya 'anak-anak Dan,' tetapi dalam konteks kesukuan menunjuk kepada anggota suku atau keturunan Dan. 'Keturunan Dan' mempertahankan hubungan kekerabatan tanpa memberi kesan bahwa mereka anak-anak kecil atau putra langsung Dan.
