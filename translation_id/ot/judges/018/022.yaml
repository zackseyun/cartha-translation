    rationale: הִרְחִיקוּ menyatakan bahwa mereka telah menjauh/pergi jauh; "agak" dapat menyiratkan jarak yang hanya sedikit.
  - severity: low
    issue: '"Orang-orang" tidak menandai rujukan laki-laki dalam הָאֲנָשִׁים.'
    rationale: Walaupun lazim dalam bahasa Indonesia, istilah generik ini menghilangkan spesifikasi leksikal sumber yang dapat dipertahankan secara alami dengan "para lelaki."
  - severity: low
