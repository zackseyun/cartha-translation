  text: וְ/אֵ֗לֶּה בָּ֚אוּ בֵּ֣ית מִיכָ֔ה וַ/יִּקְחוּ֙ אֶת פֶּ֣סֶל הָ/אֵפ֔וֹד וְ/אֶת הַ/תְּרָפִ֖ים וְ/אֶת הַ/מַּסֵּכָ֑ה וַ/יֹּ֤אמֶר אֲלֵי/הֶם֙ הַ/כֹּהֵ֔ן מָ֥ה אַתֶּ֖ם עֹשִֽׂים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/018.yaml
  text: These men went into Micah’s house and took the carved image[a], the ephod, the household idols, and the cast image. Then the priest said to them, “What are you doing?”
translation:
  language: id
  text: Orang-orang itu masuk ke rumah Mikha dan mengambil patung pahatan dan efod,[a] berhala-berhala rumah tangga, serta patung tuangan. Lalu imam itu berkata kepada mereka, “Apa yang sedang kalian lakukan?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalam bahasa Ibrani, “patung pahatan” dan “efod” dapat dipahami sebagai satu frasa yang menghubungkan kedua benda itu. Namun, daftar benda dalam Hakim-Hakim 18:17 mendukung pemahaman teks utama sebagai dua benda: patung pahatan dan efod.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Orang-orang itu
  rationale: Kata penunjuk ini secara harfiah berarti “dan mereka ini” dan merujuk kepada orang-orang yang disebut dalam konteks sebelumnya. “Orang-orang itu” wajar dalam narasi Indonesia dan memperjelas rujukannya tanpa menambah informasi baru.
- source_word: בָּאוּ בֵּית מִיכָה
  choice: masuk ke rumah Mikha
  rationale: Kata kerja בוא berarti datang/masuk; dengan “rumah Mikha” sebagai tujuan, “masuk ke” menyampaikan gerak memasuki rumah secara alami.
- source_word: וַיִּקְחוּ
  choice: mengambil
  rationale: Padanan naratif langsung yang tidak melebihkan unsur kekerasan seperti “merampas”, meskipun tindakannya jelas dilakukan tanpa hak.
- source_word: פֶּסֶל
  choice: patung pahatan
  rationale: Istilah ini menunjuk kepada patung atau gambar yang dibuat dengan memahat. Pilihan ini mempertahankan cara pembuatannya dan tidak meratakan semua benda ibadah dalam daftar menjadi sekadar “berhala”.
- source_word: הָאֵפוֹד
  choice: efod
  rationale: Efod adalah benda khas dalam lingkungan ibadah Israel dan tidak memiliki padanan Indonesia yang tepat. Transliterasi mempertahankan istilah khusus tanpa menentukan secara berlebihan bentuk atau fungsinya dalam praktik ibadah yang menyimpang ini.
- source_word: הַתְּרָפִים
  choice: berhala-berhala rumah tangga
  rationale: Terafim ialah benda-benda kultis domestik. Ungkapan ini mudah dipahami pembaca modern dan menunjukkan fungsi rumah tangganya tanpa menyiratkan bahwa benda-benda itu benar-benar ilahi.
- source_word: הַמַּסֵּכָה
  choice: patung tuangan
  rationale: Kata ini menunjuk kepada patung yang dibuat dengan menuang logam cair ke dalam cetakan. “Patung tuangan” mempertahankan ciri pembuatannya dan terdengar wajar dalam bahasa Indonesia.
- source_word: וַיֹּאמֶר אֲלֵיהֶם הַכֹּהֵן
  choice: Lalu imam itu berkata kepada mereka
  rationale: “Lalu” menyampaikan urutan tindakan dari waw naratif; bentuk definit “imam itu” merujuk kepada imam yang telah dikenal dari konteks.
- source_word: מָה אַתֶּם עֹשִׂים
  choice: Apa yang sedang kalian lakukan?
  rationale: Pertanyaan langsung ini memakai bentuk jamak. “Kalian” mempertahankan jumlah dan cocok untuk teguran langsung kepada kelompok tersebut; unsur progresif menyampaikan tindakan yang sedang berlangsung.
theological_decisions:
- issue: Pembedaan benda-benda kultis dalam konteks penyembahan berhala
  choice: Memakai istilah konkret “patung pahatan”, “efod”, “berhala-berhala rumah tangga”, dan “patung tuangan”.
  alternative: Menerjemahkan semuanya secara umum sebagai “berhala-berhala”.
  rationale: Teks menyebut benda-benda kultis yang berbeda. Mempertahankan perbedaan leksikalnya menyajikan rincian teks tanpa menambahkan penilaian teologis di luar konteks.
- issue: Hubungan sintaksis antara פֶּסֶל dan הָאֵפוֹד
  choice: 'Memahami keduanya sebagai dua benda dalam daftar: “patung pahatan dan efod”.'
  alternative: Memahami bentuk Ibrani secara konstruktif sebagai “patung pahatan efod” atau “patung pahatan dari efod”.
  rationale: Susunan Ibrani secara harfiah sulit dan tidak memiliki penghubung yang lazim di antara kedua nomina. Konteks dekat, khususnya daftar benda dalam Hakim-Hakim 18:17, mendukung pemahaman bahwa patung pahatan dan efod adalah dua benda, tetapi ketidaklaziman bentuk Ibrani didokumentasikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. “Kalian” dipakai untuk mempertahankan orang kedua jamak dalam ucapan langsung. Istilah khusus “efod” dipertahankan, sedangkan terafim dijelaskan secara fungsional sebagai “berhala-berhala rumah tangga”.
