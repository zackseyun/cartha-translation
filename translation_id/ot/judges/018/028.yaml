  text: וְ/אֵ֨ין מַצִּ֜יל כִּ֧י רְֽחוֹקָה הִ֣יא מִ/צִּיד֗וֹן וְ/דָבָ֤ר אֵין לָ/הֶם֙ עִם אָדָ֔ם וְ/הִ֕יא בָּ/עֵ֖מֶק אֲשֶׁ֣ר לְ/בֵית רְח֑וֹב וַ/יִּבְנ֥וּ אֶת הָ/עִ֖יר וַ/יֵּ֥שְׁבוּ בָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/028.yaml
  text: And there was no one to deliver them[a], because it was far from Sidon, and they had no dealings with anyone; and it was in the valley that belongs to Beth-rehob. Then they rebuilt the city and lived in it.
translation:
  language: id
  text: Tidak ada seorang pun yang menyelamatkan mereka, karena kota itu jauh dari Sidon dan penduduknya tidak mempunyai hubungan dengan siapa pun. Kota itu terletak di lembah yang termasuk wilayah Bet-Rehob.[a] Kemudian mereka membangun kembali kota itu dan tinggal di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di lembah dekat Bet-Rehob.” Frasa Ibraninya eliptis, dan kata depannya dapat menunjukkan kedekatan, bukan kepemilikan wilayah.'
    reason: alternative_reading
lexical_decisions:
- source_word: מַצִּיל
  choice: yang menyelamatkan mereka
  rationale: Partisipel Hifil dari נצל menunjuk kepada orang yang melepaskan atau menyelamatkan dari bahaya. Dalam konteks serangan militer, 'menyelamatkan' alami dalam bahasa Indonesia; objek 'mereka' dipasok dari konteks penduduk kota.
- source_word: רְחוֹקָה הִיא מִצִּידוֹן
  choice: kota itu jauh dari Sidon
  rationale: Pronomina feminin merujuk kepada kota. Penyebutan eksplisit 'kota itu' membuat rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: וְדָבָר אֵין לָהֶם עִם אָדָם
  choice: penduduknya tidak mempunyai hubungan dengan siapa pun
  rationale: Ungkapan harfiah 'tidak ada perkara bagi mereka dengan manusia' menyatakan keterasingan sosial atau politik. 'Tidak mempunyai hubungan' mempertahankan keluasan makna tanpa membatasinya pada perdagangan atau perjanjian.
- source_word: אָדָם
  choice: siapa pun
  rationale: Kata tunggal ini dipakai secara generik, sehingga 'siapa pun' menyampaikan cakupannya secara wajar dan tanpa pembatasan gender.
- source_word: בָּעֵמֶק
  choice: di lembah
  rationale: עֵמֶק lazim menunjuk lembah atau dataran rendah; 'lembah' merupakan padanan langsung dan alami.
- source_word: אֲשֶׁר לְבֵית רְחוֹב
  choice: yang termasuk wilayah Bet-Rehob
  rationale: Frasa ini eliptis, dan לְ dapat menyatakan kepunyaan atau kaitan kewilayahan. 'Termasuk wilayah' menyampaikan kemungkinan utama tanpa menghilangkan alternatif lokatif yang dicatat dalam catatan kaki.
- source_word: וַיִּבְנוּ אֶת הָעִיר
  choice: mereka membangun kembali kota itu
  rationale: Walaupun verba dasarnya berarti 'membangun', konteks ayat sebelumnya menyatakan kota itu dibakar; karena itu 'membangun kembali' mengungkapkan implikasi kontekstual secara alami.
- source_word: וַיֵּשְׁבוּ בָהּ
  choice: tinggal di sana
  rationale: ישב dalam konteks ini berarti mendiami atau menetap. 'Tinggal di sana' jelas, modern, dan cocok sebagai penutup narasi.
- source_word: בֵית רְחוֹב
  choice: Bet-Rehob
  rationale: Nama tempat dialihaksarakan menurut bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Subjek 'penduduknya' dibuat eksplisit untuk memperjelas pergantian acuan dari kota kepada orang-orangnya. Ambiguitas hubungan lembah dengan Bet-Rehob dipertahankan melalui catatan kaki.
