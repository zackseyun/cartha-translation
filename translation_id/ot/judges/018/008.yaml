translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Bentuk “kalian” dipakai karena pihak yang disapa jamak. Pertanyaan penutup dibiarkan cukup terbuka untuk menjaga keeliptisan teks Ibrani.
