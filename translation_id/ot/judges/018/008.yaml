  text: וַ/יָּבֹ֨אוּ֙ אֶל אֲחֵי/הֶ֔ם צָרְעָ֖ה וְ/אֶשְׁתָּאֹ֑ל וַ/יֹּאמְר֥וּ לָ/הֶ֛ם אֲחֵי/הֶ֖ם מָ֥ה אַתֶּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/008.yaml
  text: Then they came to their brothers at Zorah and Eshtaol[a], and their brothers said to them[b], “What is with you?”
translation:
  language: id
  text: Lalu mereka datang kepada saudara-saudara mereka[a] di Zora dan Esytaol. Saudara-saudara mereka bertanya kepada mereka, “Bagaimana dengan kalian?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “saudara-saudara” juga dapat berarti “kaum kerabat”; dalam konteks ini kemungkinan yang dimaksud ialah sesama anggota suku atau kaum mereka.
    reason: lexical_alternative
  - marker: b
    text: Pertanyaan Ibrani ini sangat singkat dan eliptis, secara harfiah kira-kira, “Apa, kalian?” Kemungkinan besar mereka sedang diminta menyampaikan keadaan atau laporan mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: Lalu mereka datang
  rationale: Bentuk wayyiqtol memajukan alur cerita. “Lalu” menyatakan urutan naratif secara wajar tanpa menambahkan gagasan yang tidak tersurat seperti “kembali”.
- source_word: אֶל אֲחֵיהֶם
  choice: kepada saudara-saudara mereka
  rationale: Kata אָח dapat menunjuk saudara kandung maupun kerabat sesuku. Terjemahan utama mempertahankan ungkapan Ibrani, sedangkan cakupan maknanya dijelaskan dalam catatan kaki.
- source_word: צָרְעָה וְאֶשְׁתָּאֹל
  choice: Zora dan Esytaol
  rationale: Nama tempat ditransliterasikan dalam bentuk yang wajar dan lazim bagi pembaca Indonesia.
- source_word: וַיֹּאמְרוּ לָהֶם אֲחֵיהֶם
  choice: Saudara-saudara mereka bertanya kepada mereka
  rationale: Kata kerja אָמַר secara harfiah berarti “berkata”, tetapi karena diikuti pertanyaan langsung, “bertanya” lebih alami dalam bahasa Indonesia. Subjek eksplisit tetap dipertahankan.
- source_word: מָה אַתֶּם
  choice: Bagaimana dengan kalian?
  rationale: Ungkapan Ibrani ini sangat ringkas dan eliptis, secara harfiah kira-kira “Apa, kalian?” Pilihan ini mempertahankan pertanyaan umum yang mengundang laporan tanpa menentukan secara berlebihan apa yang ditanyakan.
