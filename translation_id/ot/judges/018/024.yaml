  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר אֶת אֱלֹהַ/י֩ אֲשֶׁר עָשִׂ֨יתִי לְקַחְתֶּ֧ם וְֽ/אֶת הַ/כֹּהֵ֛ן וַ/תֵּלְכ֖וּ וּ/מַה לִּ֣/י ע֑וֹד וּ/מַה זֶּ֛ה תֹּאמְר֥וּ אֵלַ֖/י מַה לָּֽ/ךְ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/018/024.yaml
  text: He said[a], “You have taken my gods that I made, and the priest, and you have gone away. What do I have left now? So how can you say to me, ‘What is the matter with you?’”
translation:
  language: id
  text: Ia berkata, “Kalian telah mengambil dewa-dewaku[a] yang kubuat, juga imam itu, lalu pergi. Apa lagi yang masih kumiliki? Jadi, bagaimana mungkin kalian berkata kepadaku, ‘Ada apa denganmu?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ilahku” atau “patung-patung dewata milikku.” Kata Ibrani yang dipakai dapat bermakna tunggal atau jamak dalam konteks tertentu, tetapi konteks di sini lebih mendukung arti “dewa-dewaku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱלֹהַי
  choice: dewa-dewaku
  rationale: Bentuk ini dapat bermakna tunggal atau jamak dalam konteks tertentu, tetapi konteks pasal ini—benda-benda pemujaan buatan Mikha—lebih mendukung arti jamak. Pilihan ini mempertahankan ironi bahwa dewa-dewa tersebut dibuat oleh manusia.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: yang kubuat
  rationale: Menerjemahkan klausa relatif secara langsung dan mempertahankan daya retoris pernyataan bahwa Mikha sendiri membuat atau menyuruh membuat benda-benda yang disebutnya dewa.
- source_word: לְקַחְתֶּם
  choice: kalian telah mengambil
  rationale: 'Bentuk orang kedua jamak dipertahankan, dengan aspek hasil yang masih berlangsung: apa yang diambil kini tidak lagi dimiliki Mikha.'
- source_word: הַכֹּהֵן
  choice: imam itu
  rationale: Kata sandang tentu diterjemahkan dengan 'itu', menunjuk kepada imam tertentu milik Mikha yang dikenal dari konteks.
- source_word: וַתֵּלְכוּ
  choice: lalu pergi
  rationale: Menyampaikan tindakan lanjutan orang-orang Dan; subjek 'kalian' tetap dipahami dari klausa sebelumnya dan alami dalam bahasa Indonesia.
- source_word: וּמַה לִּי עוֹד
  choice: Apa lagi yang masih kumiliki?
  rationale: Ungkapan ini menyatakan kehilangan total, bukan sekadar pertanyaan tentang kepemilikan.
- source_word: וּמַה זֶּה תֹּאמְרוּ אֵלַי
  choice: Jadi, bagaimana mungkin kalian bertanya kepadaku
  rationale: Menyampaikan ungkapan Ibrani yang idiomatis dan bernada gusar sebagai sanggahan terhadap pertanyaan mereka, tanpa menghilangkan hubungan inferensial dengan keluhan sebelumnya.
- source_word: מַה לָּךְ
  choice: Ada apa denganmu?
  rationale: Padanan Indonesia yang alami dan langsung untuk pertanyaan idiomatis tentang apa yang mengganggu atau menimpa seseorang.
theological_decisions:
- issue: Makna אֱלֹהַי dalam konteks benda-benda pemujaan rumah tangga
  choice: dewa-dewaku
  alternative: allahku; ilah-ilahku; patung-patung dewata milikku
  rationale: Konteks mendukung bentuk jamak dan mengacu pada objek pemujaan buatan manusia. 'Dewa-dewaku' mempertahankan istilah teologis sumber serta ironi naratifnya, tanpa meratakannya menjadi 'berhala' atau 'patung' dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan tuturan langsung yang alami dan bernada gusar. Kata ganti 'kalian' mencerminkan orang kedua jamak; 'imam itu' mempertahankan ketentuan referennya. Bentuk 'kubuat' dan 'kumiliki' ringkas, jelas, dan sesuai bagi narasi Alkitab modern.
