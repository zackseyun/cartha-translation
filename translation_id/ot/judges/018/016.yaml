base_translation:
  language: en
  yaml_path: translation/ot/judges/018/016.yaml
  text: And six hundred men[a], armed with their weapons of war, were standing at the entrance of the gate; these were from the sons of Dan.
translation:
  language: id
  text: Enam ratus orang itu, yang menyandang perlengkapan perang mereka, berdiri di pintu gerbang; mereka berasal dari keturunan Dan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dari anak-anak Dan”; ungkapan ini dapat merujuk kepada orang-orang dari suku Dan.'
    reason: Ungkapan Ibrani genealogis dapat diterjemahkan secara harfiah sebagai “anak-anak Dan”, tetapi dalam konteks ini menunjuk pada keanggotaan suku.
lexical_decisions:
- source_word: וְ/שֵׁשׁ מֵאוֹת אִישׁ
  choice: Keenam ratus orang
  rationale: Dalam kesinambungan narasi bahasa Indonesia, וְ tidak perlu diterjemahkan secara tersendiri. Bentuk dengan ke-... itu menandai kelompok enam ratus orang yang sudah disebut dalam konteks, sedangkan אִישׁ setelah bilangan dipahami secara kolektif.
- source_word: חֲגוּרִים
  choice: yang menyandang
  rationale: Partisip ini secara harfiah berarti 'berikat pinggang/berikat', tetapi bersama perlengkapan perang menunjuk pada keadaan siap dengan senjata atau perlengkapan yang dikenakan. 'Menyandang' mempertahankan gambaran konkret tanpa terdengar kuno.
- source_word: כְּלֵי מִלְחַמְתָּם
  choice: perlengkapan perang mereka
  rationale: כְּלִי dapat mencakup alat, barang perlengkapan, atau senjata. 'Perlengkapan perang' mempertahankan keluasan makna dan tidak membatasi acuan hanya pada senjata tertentu.
- source_word: נִצָּבִים
  choice: berdiri
  rationale: Partisip ini menggambarkan posisi mereka dalam adegan. 'Berdiri' alami dalam bahasa Indonesia dan tidak menambahkan gagasan bahwa mereka secara resmi ditempatkan di sana.
- source_word: פֶּתַח הַשָּׁעַר
  choice: di pintu gerbang
  rationale: Secara harfiah berarti 'di bukaan/pintu masuk gerbang'. Dalam bahasa Indonesia, 'di pintu gerbang' secara wajar menunjuk tempat masuk gerbang tanpa pengulangan yang kaku.
- source_word: אֲשֶׁר מִבְּנֵי דָן
  choice: mereka berasal dari keturunan Dan
  rationale: Klausa relatif ini mengidentifikasi kelompok tersebut. 'Keturunan Dan' menyampaikan ungkapan genealogis בְּנֵי דָן secara alami, sementara 'berasal dari' mempertahankan unsur מִן.
