  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תֹּ֤אמֶר לָ/הֶם֙ הַ/גֶּ֔פֶן הֶ/חֳדַ֨לְתִּי֙ אֶת תִּ֣ירוֹשִׁ֔/י הַֽ/מְשַׂמֵּ֥חַ אֱלֹהִ֖ים וַ/אֲנָשִׁ֑ים וְ/הָ֣לַכְתִּ֔י לָ/נ֖וּעַ עַל הָ/עֵצִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/013.yaml
  text: But the vine said to them[a], ‘Should I stop producing my new wine, which gladdens gods and men, and go to sway over the trees?’
translation:
  language: id
  text: Namun, pohon anggur itu berkata kepada mereka, “Haruskah aku berhenti menghasilkan anggur baruku, yang menggembirakan para ilah dan manusia,[a] lalu pergi bergoyang-goyang di atas pohon-pohon?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang menggembirakan Allah dan manusia.”
    reason: אֱלֹהִים dapat dipahami sebagai bentuk jamak “para ilah” atau, berdasarkan pemakaian Ibrani yang lazim, sebagai sebutan tunggal “Allah”.
lexical_decisions:
- source_word: הַגֶּפֶן
  choice: pohon anggur
  rationale: Dalam bahasa Indonesia, “pohon anggur” adalah sebutan alami bagi tanaman anggur yang berbicara dalam perumpamaan Yotam.
- source_word: הֶחֳדַלְתִּי
  choice: Haruskah aku berhenti menghasilkan
  rationale: Bentuk perfektum orang pertama berfungsi sebagai pertanyaan retoris deliberatif dalam konteks ini. “Menghasilkan” memperjelas hubungan alami dengan objek “anggur baruku” tanpa mengubah maksud.
- source_word: תִּירוֹשִׁי
  choice: anggur baruku
  rationale: תִּירוֹשׁ menunjuk pada anggur baru atau segar; pilihan ini mempertahankan pembedaan leksikalnya dari istilah umum untuk anggur.
- source_word: הַמְשַׂמֵּחַ
  choice: yang menggembirakan
  rationale: Partisipel kausatif ini menerangkan anggur baru dan secara alami berarti “yang membuat gembira.”
- source_word: אֱלֹהִים וַאֲנָשִׁים
  choice: para ilah dan manusia
  rationale: אֱלֹהִים secara morfologis berbentuk jamak dan dalam konteks sastra perumpamaan ini dapat dipahami sebagai para ilah. “Manusia” merupakan padanan Indonesia yang wajar dan inklusif bagi אֲנָשִׁים.
- source_word: וְהָלַכְתִּי
  choice: lalu pergi
  rationale: Menyampaikan gerak lanjutan dalam pertanyaan retoris secara alami.
- source_word: לָנוּעַ
  choice: bergoyang-goyang
  rationale: Mempertahankan gambaran fisik pohon yang bergerak ke sana kemari; kedudukan “atas” pohon-pohon juga menyiratkan pemerintahan dalam perumpamaan.
- source_word: עַל הָעֵצִים
  choice: di atas pohon-pohon
  rationale: Mempertahankan gambaran spasial sekaligus kemungkinan nuansa berkuasa atas pohon-pohon.
theological_decisions:
- issue: Makna אֱלֹהִים dalam frasa yang menggembirakan אֱלֹהִים dan manusia
  choice: para ilah
  alternative: Allah
  rationale: Bentuk Ibraninya secara morfologis jamak, dan konteks perumpamaan puitis memungkinkan rujukan kepada para ilah. Karena אֱלֹהִים juga dapat dipakai bagi Allah Israel dan pembacaan tunggal memiliki tradisi penerjemahan yang kuat, alternatif itu dicatat dalam catatan kaki agar ketegangan teks tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Personifikasi dipertahankan dengan “aku”; pengulangan “pohon-pohon” menjaga corak perumpamaan. “Bergoyang-goyang di atas” dipilih untuk mempertahankan permainan citra gerak dan kekuasaan, bukan meratakannya menjadi sekadar “memerintah”.
