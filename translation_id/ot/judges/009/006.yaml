  text: וַ/יֵּאָ֨סְפ֜וּ כָּל בַּעֲלֵ֤י שְׁכֶם֙ וְ/כָל בֵּ֣ית מִלּ֔וֹא וַ/יֵּ֣לְכ֔וּ וַ/יַּמְלִ֥יכוּ אֶת אֲבִימֶ֖לֶךְ לְ/מֶ֑לֶךְ עִם אֵל֥וֹן מֻצָּ֖ב אֲשֶׁ֥ר בִּ/שְׁכֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/006.yaml
  text: Then all the leaders of Shechem and all Beth-millo gathered together[b][a], and they went and made Abimelech king beside the oak pillar that was in Shechem.
translation:
  language: id
  text: Lalu semua pemuka Sikhem dan semua orang Bet-Milo[a] berkumpul. Mereka pergi dan mengangkat Abimelekh menjadi raja di dekat pohon besar di sisi tugu yang ada di Sikhem.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bet-Milo dapat berarti “rumah Milo”, tetapi ungkapan ini kemungkinan berfungsi sebagai nama tempat atau kelompok.
    reason: cultural_note
  - marker: b
    text: Frasa Ibraninya sulit dipastikan. Frasa itu juga dapat dipahami sebagai “di dekat pohon besar yang berhubungan dengan tugu atau batu tegak”. Makna tepat kata Ibrani untuk “tugu” tidak pasti. Jenis pohon yang dimaksud juga dapat dipahami sebagai pohon ek atau tarbantin.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֵי שְׁכֶם
  choice: pemuka Sikhem
  rationale: Secara harfiah berarti para pemilik atau penguasa Sikhem, tetapi dalam konteks politik kota menunjuk kepada orang-orang terkemuka yang memegang kuasa. “Pemuka” menyampaikan fungsi sosial-politik itu tanpa memberi kesan sistem feodal.
- source_word: בֵּית מִלּוֹא
  choice: Bet-Milo
  rationale: Ungkapan ini tampaknya berfungsi sebagai nama tempat atau kelompok. Transliterasi mempertahankan ketidakpastian acuannya dan menghindari penafsiran berlebihan sebagai rumah tangga biasa.
- source_word: וַיַּמְלִיכוּ ... לְמֶלֶךְ
  choice: mengangkat Abimelekh menjadi raja
  rationale: Bentuk kausatif dari מלך menyatakan tindakan menjadikan seseorang raja. “Mengangkat ... menjadi raja” wajar dalam bahasa Indonesia dan tidak menambahkan upacara penobatan yang tidak disebutkan.
- source_word: עִם
  choice: di dekat
  rationale: Dalam kaitan dengan sebuah tengara, kata ini menyatakan kedekatan tempat. “Di dekat” menyampaikan lokasi tindakan secara alami.
- source_word: אֵלוֹן
  choice: pohon besar
  rationale: Kata ini dapat menunjuk pada pohon besar, sering kali ek atau tarbantin. Karena jenis pohonnya tidak pasti, padanan umum “pohon besar” tidak memaksakan identifikasi botani.
- source_word: מֻצָּב
  choice: tugu
  rationale: Kata ini berasal dari akar yang berarti berdiri atau didirikan dan tampaknya menunjuk pada sebuah benda tegak sebagai tengara. “Tugu” mempertahankan gagasan tersebut, sementara hubungan sintaksisnya dengan pohon dijelaskan dalam catatan kaki.
- source_word: וַיֵּאָסְפוּ
  choice: berkumpullah
  rationale: Kata kerja ini berarti berkumpul atau berhimpun. Bentuk inversi ringan mempertahankan alur naratif yang bermartabat dan tetap mudah dipahami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Nama Ibrani ditransliterasikan secara lazim sebagai Sikhem, Bet-Milo, dan Abimelekh. Ketidakpastian pada Bet-Milo serta hubungan antara pohon dan tugu dipertahankan melalui catatan kaki.
