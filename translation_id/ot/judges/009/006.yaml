revisions:
- from: Lalu berkumpullah semua pemuka Sikhem dan seluruh Bet-Milo[a]. Mereka pergi dan mengangkat Abimelekh menjadi raja di dekat pohon besar di sisi tugu yang ada di Sikhem.[b]
  to: Lalu semua pemuka Sikhem dan semua orang Bet-Milo[a] berkumpul. Mereka pergi dan mengangkat Abimelekh menjadi raja di dekat pohon besar di sisi tugu yang ada di Sikhem.[b]
  rationale: Revisi membuat subjek kolektif Bet-Milo idiomatis dalam bahasa Indonesia dan memperbaiki catatan tekstual agar tidak menambahkan gagasan kepemilikan. Terjemahan utama tetap mempertahankan pembacaan yang wajar atas tengara berupa pohon dan tugu, sementara ketidakpastian sintaksis serta leksikalnya dinyatakan dalam catatan kaki.
