    rationale: Bet-Milo tampaknya nama tempat atau kelompok, tetapi verba 'berkumpul' menuntut pelaku manusia dalam bahasa Indonesia. 'Semua orang Bet-Milo' menyatakan pelaku kolektif tanpa memutuskan apakah Bet-Milo khususnya tempat atau kelompok kekerabatan.
  - severity: medium
    issue: Alternatif dalam catatan kaki b, 'pohon besar milik tugu/batu tegak', menambahkan relasi kepemilikan.
    rationale: Konstruksi אֵלוֹן מֻצָּב memang sulit, tetapi tidak menyatakan 'milik'. Catatan sebaiknya hanya menyebut kemungkinan hubungan dengan tugu atau batu tegak dan ketidakpastian makna מֻצָּב.
