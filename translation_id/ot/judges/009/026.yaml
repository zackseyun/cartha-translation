  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Bin” dipakai sebagai bentuk patronimik yang ringkas dan umum dalam terjemahan nama Semitik. Ambiguitas gerak pada עבר serta nuansa sosial-politik בעלי dipertahankan melalui catatan kaki.
