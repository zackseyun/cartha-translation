base_translation:
  language: en
  yaml_path: translation/ot/judges/009/026.yaml
  text: Then Gaal son of Ebed came with his brothers and crossed into Shechem[c][b][a], and the leaders of Shechem put their trust in him.
translation:
  language: id
  text: Kemudian Gaal bin Ebed datang bersama saudara-saudaranya dan memasuki Sikhem[a]. Para pemimpin Sikhem[b] menaruh kepercayaan kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melintasi Sikhem” atau “melewati Sikhem”; kata Ibraninya dapat berarti menyeberang atau melintas, dan arah geraknya dalam konteks ini tidak sepenuhnya pasti.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “para tuan dari Sikhem”; ungkapan Ibrani ini menunjuk pada orang-orang terkemuka atau para pemegang kuasa di kota itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: Kemudian ... datang
  rationale: Waw konsekutif melanjutkan alur cerita; “kemudian” menyampaikan urutan naratif secara wajar dalam bahasa Indonesia.
- source_word: גַּעַל בֶּן עֶבֶד
  choice: Gaal bin Ebed
  rationale: Nama diri ditransliterasikan, sedangkan konstruksi patronimik Ibrani diterjemahkan dengan bentuk Indonesia yang lazim, “bin”.
- source_word: וְאֶחָיו
  choice: bersama saudara-saudaranya
  rationale: Walaupun konjungsinya secara harfiah berarti “dan”, dalam konstruksi ini bahasa Indonesia secara alami menyatakan penyertaan dengan “bersama”.
- source_word: וַיַּעַבְרוּ בִּשְׁכֶם
  choice: lalu mereka masuk ke Sikhem
  rationale: Kata עבר menyatakan gerak melintas atau menyeberang; dengan nama tempat di sini, arah geraknya tidak sepenuhnya pasti. “Masuk ke” menghasilkan bahasa Indonesia yang alami, sementara alternatif yang lebih harfiah dipertahankan dalam catatan kaki.
- source_word: וַיִּבְטְחוּ בוֹ
  choice: menaruh kepercayaan kepadanya
  rationale: Konstruksi בטח dengan בְ menyatakan kepercayaan atau keyakinan kepada seseorang.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: para pemimpin Sikhem
  rationale: Bentuk בעלי dalam konteks kota menunjuk pada orang-orang yang berkedudukan atau memegang kuasa, bukan semata-mata semua penduduk.
