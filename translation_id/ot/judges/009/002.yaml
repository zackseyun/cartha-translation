revisions:
- from: '“Tolong sampaikanlah kepada semua pemuka Sikhem: Mana yang lebih baik bagi kalian—ketujuh puluh anak laki-laki Yerubaal memerintah atas kalian, atau satu orang saja memerintah atas kalian? Ingatlah bahwa aku adalah tulang dan daging kalian sendiri.”[a]'
  to: '“Tolong, katakanlah kepada semua pemuka Sikhem: Mana yang lebih baik bagi kalian: tujuh puluh orang, yaitu semua anak laki-laki Yerubaal, memerintah kalian, atau satu laki-laki memerintah kalian? Ingatlah bahwa aku adalah tulang dan daging kalian sendiri.”[a]'
  rationale: Revisi membetulkan bilangan ordinal yang keliru menjadi jumlah kardinal “tujuh puluh,” memulihkan rujukan maskulin pada kontras “satu laki-laki,” dan merapikan susunan aposisional agar jelas bahwa ketujuh puluh orang itu semuanya anak laki-laki Yerubaal. Catatan kaki disederhanakan supaya menjelaskan fungsi idiom tanpa menyatakan bentuk harfiah yang tidak sepenuhnya sama dengan susunan teks utama.
