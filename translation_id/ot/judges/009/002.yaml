  source_fidelity: Revisi diperlukan karena “ketujuh puluh” berarti bentuk ordinal (“the seventieth”), sedangkan שִׁבְעִים berarti “tujuh puluh.” Selain itu, אִישׁ אֶחָד secara kontekstual menunjuk “satu laki-laki/pria,” bukan bentuk netral “satu orang.” Terjemahan revisi mempertahankan struktur pertanyaan retoris, pengulangan “memerintah,” serta idiom kekerabatan Ibrani.
  naturalness: Teks revisi memakai bahasa Indonesia baku modern dan langsung. “Tujuh puluh orang, yaitu semua anak laki-laki Yerubaal” jelas, alami, dan mempertahankan aposisi pada teks Ibrani. “Memerintah kalian” lebih wajar daripada “memerintah atas kalian” tanpa mengurangi makna.
  terminology: “Pemuka Sikhem” merupakan padanan yang baik bagi בַּעֲלֵי שְׁכֶם dalam konteks kepemimpinan sipil. Nama “Sikhem” dan “Yerubaal” dipertahankan. Idiom “tulang dan daging kalian sendiri” dipertahankan dalam teks utama dan dijelaskan secara non-doktrinal dalam catatan kaki.
  issues:
  - severity: high
    issue: “ketujuh puluh anak laki-laki” memakai bilangan ordinal.
    rationale: Bentuk ini secara normal berarti “anak laki-laki yang ketujuh puluh,” bukan jumlah tujuh puluh. Teks Ibrani menyatakan שִׁבְעִים אִישׁ, “tujuh puluh orang laki-laki.”
  - severity: medium
    issue: “satu orang saja” menetralkan אִישׁ אֶחָד.
    rationale: Dalam kontras dengan tujuh puluh putra Yerubaal dan dengan Abimelekh sebagai pembicara, “satu laki-laki” atau “satu pria” lebih setia kepada rujukan maskulin teks sumber.
