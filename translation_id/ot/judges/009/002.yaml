id: JDG.9.2
reference: Judges 9:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: דַּבְּרוּ נָ֞א בְּ/אָזְנֵ֨י כָל בַּעֲלֵ֣י שְׁכֶם֮ מַה טּ֣וֹב לָ/כֶם֒ הַ/מְשֹׁ֨ל בָּ/כֶ֜ם שִׁבְעִ֣ים אִ֗ישׁ כֹּ֚ל בְּנֵ֣י יְרֻבַּ֔עַל אִם מְשֹׁ֥ל בָּ/כֶ֖ם אִ֣ישׁ אֶחָ֑ד וּ/זְכַרְתֶּ֕ם כִּֽי עַצְמֵ/כֶם וּ/בְשַׂרְ/כֶ֖ם אָנִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/002.yaml
  text: 'Please speak in the hearing of all the leaders of Shechem: Which is better for you—that seventy men[a], all the sons of Jerubbaal, rule over you, or that one man rule over you? And remember that I am your bone and your flesh.'
translation:
  language: id
  text: '“Tolong, katakanlah kepada semua pemuka Sikhem: Mana yang lebih baik bagi kalian: tujuh puluh orang, yaitu semua anak laki-laki Yerubaal, memerintah kalian, atau satu laki-laki memerintah kalian? Ingatlah bahwa aku adalah tulang dan daging kalian sendiri.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani “tulang dan daging” menyatakan hubungan darah atau kekerabatan dekat.
    reason: Menjelaskan idiom kekerabatan tanpa menggantikan citra konkret Ibrani dalam teks utama.
lexical_decisions:
- source_word: דַּבְּרוּ נָא
  choice: Tolong sampaikanlah
  rationale: Bentuk imperatif jamak dengan partikel permohonan נָא. Pilihan ini menyampaikan desakan yang sopan dan sesuai dengan tugas para kerabat Abimelekh untuk meneruskan perkataannya.
- source_word: בְּאָזְנֵי
  choice: kepada
  rationale: Ungkapan Ibrani harfiah 'di telinga' berarti berbicara agar didengar oleh pihak yang dituju. Dalam bahasa Indonesia modern, 'kepada' paling alami; nuansa penyampaian tetap hadir melalui kata 'sampaikanlah'.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: semua pemuka Sikhem
  rationale: בַּעֲלֵי dapat menunjuk para pemilik, warga terpandang, atau penguasa setempat. Dalam konteks politik kota Sikhem, 'pemuka' menyampaikan kedudukan dan pengaruh mereka tanpa memberi gelar kerajaan.
- source_word: מַה טּוֹב לָכֶם
  choice: Mana yang lebih baik bagi kalian
  rationale: Bentuk pertanyaan membandingkan dua pilihan yang langsung disebutkan sesudahnya. 'Mana yang lebih baik' mengungkapkan daya komparatifnya secara wajar.
- source_word: הַמְשֹׁל בָּכֶם ... אִם מְשֹׁל בָּכֶם
  choice: memerintah atas kalian ... memerintah atas kalian
  rationale: Pengulangan verba משל dipertahankan untuk menjaga kesejajaran dan tekanan retoris teks Ibrani.
- source_word: שִׁבְעִים אִישׁ כֹּל בְּנֵי יְרֻבַּעַל
  choice: ketujuh puluh anak laki-laki Yerubaal
  rationale: Frasa ini merujuk kepada tujuh puluh orang laki-laki yang semuanya adalah anak Yerubaal. Bentuk Indonesia ini ringkas, jelas, dan tetap menandai jenis kelamin yang dinyatakan oleh konteks.
- source_word: אִישׁ אֶחָד
  choice: satu orang saja
  rationale: Dalam konteks, orang itu adalah Abimelekh, seorang laki-laki. Kata 'saja' mempertajam kontras satu lawan tujuh puluh tanpa menambahkan makna baru.
- source_word: וּזְכַרְתֶּם
  choice: Ingatlah
  rationale: Walaupun bentuknya secara morfologis perfektif dengan waw, dalam konteks ini ungkapan tersebut berfungsi sebagai ajakan atau perintah langsung.
- source_word: עַצְמֵכֶם וּבְשַׂרְכֶם
  choice: tulang dan daging kalian sendiri
  rationale: Ungkapan kekerabatan konkret dipertahankan, alih-alih langsung diparafrasakan menjadi 'kerabat', agar citra dan daya relasional teks Ibrani tidak hilang.
- source_word: אָנִי
  choice: aku adalah
  rationale: Pronomina mandiri memberi penekanan kepada identitas pembicara. Susunan 'aku adalah' tetap lugas dan bermartabat dalam konteks pidato.
theological_decisions:
- issue: Ungkapan kekerabatan עַצְמֵכֶם וּבְשַׂרְכֶם
  choice: Mempertahankan ungkapan konkret 'tulang dan daging kalian sendiri' dalam teks utama.
  alternative: Menerjemahkannya secara idiomatis sebagai 'darah daging kalian sendiri' atau secara eksplikatif sebagai 'kerabat dekat kalian'.
  rationale: Ungkapan itu menegaskan hubungan keluarga yang menjadi dasar bujukan politik Abimelekh. Mempertahankan citra Ibrani menghindari penyempitan makna, sementara catatan kaki menjelaskan fungsi idiomatisnya.
- issue: Bahasa bergender bagi anak-anak Yerubaal
  choice: Menggunakan 'anak laki-laki' untuk kelompok tujuh puluh orang.
  alternative: Menggunakan bentuk netral 'anak-anak' atau 'orang-orang'.
  rationale: Konteks dan kata אִישׁ merujuk khusus kepada putra-putra Yerubaal; penanda jenis kelamin karena itu dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pidato yang langsung dan bermartabat. Sapaan jamak 'kalian' dipakai karena Abimelekh berbicara mengenai seluruh kelompok pemuka Sikhem. Tanda pisah menonjolkan dua pilihan dalam pertanyaan retoris.
