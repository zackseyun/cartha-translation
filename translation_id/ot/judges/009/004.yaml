base_translation:
  language: en
  yaml_path: translation/ot/judges/009/004.yaml
  text: And they gave him seventy pieces of silver from the house of Baal-berith[a], and with them Abimelek hired worthless and reckless men[c][b], and they followed him.
translation:
  language: id
  text: Mereka memberikan kepadanya tujuh puluh keping perak[b] dari rumah Baal-Berit[a]. Dengan perak itu Abimelekh mengupah orang-orang yang tidak berguna dan gegabah[c], lalu mereka mengikutinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari kuil Baal-Berit.” Dalam konteks pemujaan, kata Ibrani yang berarti “rumah” dapat merujuk pada kuil atau tempat suci.
    reason: lexical_alternative
  - marker: b
    text: Atau “tujuh puluh syikal perak.” Secara harfiah, bahasa Ibraninya berbunyi “tujuh puluh perak”, yaitu sejumlah uang yang dinyatakan menurut berat.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “orang-orang yang kosong dan gegabah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעִים כֶּסֶף
  choice: tujuh puluh keping perak
  rationale: Secara harfiah frasa ini berarti 'tujuh puluh perak' dan menunjuk pada sejumlah uang yang dihitung menurut berat. 'Keping perak' terdengar alami dalam bahasa Indonesia tanpa memasukkan satuan 'syikal' yang tidak disebutkan secara eksplisit.
- source_word: מִבֵּית בַּעַל בְּרִית
  choice: dari rumah Baal-Berit
  rationale: בַּיִת berarti 'rumah' dan dalam konteks pemujaan dapat merujuk pada kuil atau tempat suci. Terjemahan 'rumah' mempertahankan gambaran Ibrani, sedangkan Baal-Berit dipertahankan sebagai nama.
- source_word: וַיִּשְׂכֹּר בָּהֶם
  choice: Dengan perak itu ... mengupah
  rationale: Pronomina sesudah preposisi ב merujuk kembali pada perak sebagai alat pembayaran. Susunan ini menyampaikan hubungan tersebut dengan jelas dan alami dalam bahasa Indonesia.
- source_word: אֲנָשִׁים רֵיקִים
  choice: orang-orang yang tidak berguna
  rationale: רֵיקִים secara harfiah berarti 'kosong', tetapi di sini menggambarkan orang yang tidak bernilai atau tidak berbobot secara sosial dan moral. 'Tidak berguna' mempertahankan penilaian negatif itu secara idiomatis.
- source_word: וּפֹחֲזִים
  choice: dan nekat
  rationale: Kata ini menggambarkan orang yang gegabah, tidak terkendali, dan tidak dapat diandalkan. 'Nekat' ringkas, alami, dan sesuai dengan konteks para pengacau bayaran.
- source_word: וַיֵּלְכוּ אַחֲרָיו
  choice: lalu mereka mengikutinya
  rationale: Ungkapan harfiahnya ialah 'mereka berjalan di belakangnya', tetapi dalam konteks ini berarti mereka bergabung sebagai pengikut Abimelekh.
