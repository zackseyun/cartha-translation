  yaml_path: translation/ot/judges/009/032.yaml
  text: Now then[a], arise by night, you and the people who are with you[b], and lie in wait in the field.
translation:
  language: id
  text: Sekarang, bangkitlah pada malam hari[a], engkau dan orang-orang yang bersamamu, lalu mengadanglah di padang[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pada waktu malam.” Ungkapan Ibrani menunjukkan bahwa tindakan itu dilakukan pada malam hari, tetapi tidak harus berarti “malam ini.”
    reason: lexical_alternative
  - marker: b
    text: Atau “menunggulah untuk menyergap” atau “pasanglah penyergapan.” Verba Ibrani berarti mengadang atau menunggu untuk menyergap, dan sering kali mengandung gagasan penyergapan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Penanda wacana ini mengalihkan pembicaraan kepada perintah yang harus segera dilaksanakan. “Sekarang” menyampaikan peralihan dan desakan itu secara alami dalam bahasa Indonesia.
- source_word: קוּם
  choice: bangkitlah
  rationale: Bentuk imperatif dari קום. “Bangkitlah” mempertahankan kelangsungan perintah dan nuansa agak luhur yang sesuai dengan konteks militer.
- source_word: לַיְלָה
  choice: pada malam hari
  rationale: Ungkapan adverbial yang menunjukkan waktu tindakan. Pilihan ini tidak mempersempit maknanya menjadi “malam ini,” yang tidak dinyatakan secara tegas oleh bahasa Ibrani.
- source_word: אַתָּה
  choice: engkau
  rationale: Pronomina eksplisit dipertahankan karena memberi penekanan kepada orang yang menerima perintah.
- source_word: וְהָעָם אֲשֶׁר אִתָּךְ
  choice: dan orang-orang yang bersamamu
  rationale: עָם secara dasar berarti “rakyat/orang-orang,” tetapi dalam konteks ini menunjuk kepada kelompok yang menyertainya. “Orang-orang” alami dan tidak menambahkan pengertian khusus seperti “pasukan” atau “kaum laki-laki.”
- source_word: וֶאֱרֹב
  choice: lalu ambillah posisi untuk menyergap
  rationale: Verba ארב menggambarkan tindakan menunggu secara tersembunyi dengan maksud menyergap. Ungkapan ini membedakan pengambilan posisi dari serangan penyergapan itu sendiri.
- source_word: בַּשָּׂדֶה
  choice: di padang
  rationale: שָׂדֶה dapat berarti ladang atau kawasan terbuka. “Di padang” sesuai dengan lokasi taktis dalam konteks ini tanpa menentukan bahwa tanah itu sedang dibudidayakan.
