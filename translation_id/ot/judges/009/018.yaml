  text: וְ/אַתֶּ֞ם קַמְתֶּ֨ם עַל בֵּ֤ית אָבִ/י֙ הַ/יּ֔וֹם וַ/תַּהַרְג֧וּ אֶת בָּנָ֛י/ו שִׁבְעִ֥ים אִ֖ישׁ עַל אֶ֣בֶן אֶחָ֑ת וַ/תַּמְלִ֜יכוּ אֶת אֲבִימֶ֤לֶךְ בֶּן אֲמָת/וֹ֙ עַל בַּעֲלֵ֣י שְׁכֶ֔ם כִּ֥י אֲחִי/כֶ֖ם הֽוּא־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/018.yaml
  text: But you have risen up against my father's house today[a], and you killed his sons, seventy men, on one stone, and you made Abimelek, the son of his female servant, king over the leaders of Shechem, because he is your brother.
translation:
  language: id
  text: Namun, hari ini kalian telah bangkit melawan keluarga ayahku dan membunuh anak-anak lelakinya—tujuh puluh orang—di atas satu batu. Lalu kalian mengangkat Abimelekh, anak dari hamba perempuan ayahku,[a] menjadi raja atas para pemimpin Sikhem, karena ia saudara kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anak dari budak perempuan ayahku”; secara lebih interpretatif, “anak dari gundik ayahku”. Bahasa Ibrani berbunyi “anak dari hamba perempuannya”.
    reason: Menjaga alternatif leksikal dan nuansa status sosial אֲמָה tanpa memasukkan tafsiran yang lebih khusus ke dalam teks utama; penambahan “ayahku” memperjelas rujukan sufiks Ibrani dalam bahasa Indonesia.
lexical_decisions:
- source_word: קַמְתֶּם עַל
  choice: telah bangkit melawan
  rationale: Ungkapan ini menyatakan tindakan bermusuhan atau perlawanan. Pilihan ini mempertahankan metafora dan nada tuduhan dalam bahasa Ibrani, tetapi tetap alami dalam bahasa Indonesia.
- source_word: בֵּית אָבִי
  choice: keluarga ayahku
  rationale: Kata 'rumah' di sini menunjuk pada keluarga atau garis keturunan, bukan bangunan. 'Keluarga ayahku' menyampaikan makna tersebut dengan jelas dalam bahasa Indonesia modern.
- source_word: הַיּוֹם
  choice: hari ini
  rationale: Mempertahankan penekanan waktu pada peristiwa yang sedang dikecam Yotam.
- source_word: וַתַּהַרְגוּ
  choice: membunuh
  rationale: Kata kerja Ibrani menyatakan tindakan membunuh tanpa dengan sendirinya menetapkan kategori hukum tertentu; karena itu tidak diterjemahkan dengan istilah yang lebih interpretatif.
- source_word: בָּנָיו שִׁבְעִים אִישׁ
  choice: anak-anak lelakinya—tujuh puluh orang—
  rationale: Akhiran pronomina paling wajar merujuk kepada ayah Yotam. Bentuk sisipan mempertahankan susunan yang menyebut para anak lalu menjelaskan jumlah mereka.
- source_word: עַל אֶבֶן אֶחָת
  choice: di atas satu batu
  rationale: Terjemahan langsung ini mempertahankan gambaran konkret dan mengerikan tentang tempat atau sarana eksekusi bersama tersebut.
- source_word: וַתַּמְלִיכוּ
  choice: mengangkat ... menjadi raja
  rationale: Bentuk kausatif kata kerja מלך berarti menjadikan seseorang raja. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya kausatifnya.
- source_word: בֶּן אֲמָתוֹ
  choice: anak dari hamba perempuannya
  rationale: אָמָה secara leksikal menunjuk kepada hamba atau budak perempuan. Pilihan utama ini mempertahankan keterangan jenis kelamin dan status sosial tanpa langsung menafsirkannya sebagai 'gundik'.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: para pemimpin Sikhem
  rationale: Dalam konteks politik kota, istilah ini menunjuk kepada orang-orang berkedudukan atau pemuka kota. 'Para pemimpin' lebih jelas bagi pembaca modern daripada terjemahan harfiah 'para tuan'.
- source_word: כִּי אֲחִיכֶם הוּא
  choice: karena ia saudara kalian
  rationale: כִּי menyatakan alasan, sedangkan bentuk jamak 'kalian' mempertahankan bahwa tuduhan itu ditujukan kepada sekelompok orang.
theological_decisions:
- issue: Nuansa status sosial אֲמָתוֹ dalam keterangan mengenai ibu Abimelekh
  choice: hamba perempuannya
  alternative: budak perempuannya; gundiknya
  rationale: Istilah Ibrani menekankan status ibu Abimelekh sebagai perempuan yang berada dalam kedudukan pelayanan atau perbudakan dan dipakai secara polemis dalam tuduhan Yotam. Teks utama tidak mempersempit status itu menjadi hubungan pergundikan, sedangkan kemungkinan tersebut dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tuduhan yang tegas dan bermartabat. Bentuk sapaan jamak 'kalian' dipakai untuk memperjelas subjek jamak Ibrani. Tanda pisah membantu mempertahankan aposisi jumlah tanpa menghasilkan susunan yang kaku.
