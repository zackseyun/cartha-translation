base_translation:
  language: en
  yaml_path: translation/ot/judges/009/027.yaml
  text: And they went out into the field and gathered the grapes from their vineyards and trod them[a], and they held a festival[b]. Then they went into the house of their god and ate and drank and cursed Abimelek.
translation:
  language: id
  text: Mereka pergi ke ladang, memetik buah anggur dari kebun-kebun anggur mereka, lalu menginjak-injak buah itu. Mereka mengadakan perayaan[a], kemudian masuk ke rumah dewa mereka[b]. Di sana mereka makan dan minum, lalu mengutuk Abimelekh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka mengadakan pesta panen” atau “mereka bersukaria.” Istilah Ibrani ini menunjuk pada perayaan meriah, kemungkinan berkaitan dengan panen anggur.
    reason: lexical_alternative
  - marker: b
    text: Atau, “rumah dewa-dewa mereka.” Bentuk Ibraninya dapat dibaca sebagai jamak, meskipun di sini kemungkinan bermakna tunggal dan menunjuk pada dewa yang disembah di tempat itu.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ הַשָּׂדֶה
  choice: Mereka pergi ke ladang
  rationale: Akhiran penunjuk arah pada הַשָּׂדֶה menyatakan gerak menuju ruang terbuka atau ladang. Ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan konteks orang-orang yang keluar dari kota.
- source_word: וַיִּבְצְרוּ אֶת כַּרְמֵיהֶם
  choice: memetik buah anggur dari kebun-kebun anggur mereka
  rationale: Dalam konteks kebun anggur, בצר secara khusus berarti memanen atau memetik buah anggur. Rumusan ini menyatakan objek tindakan dengan jelas.
- source_word: וַיִּדְרְכוּ
  choice: menginjak-injak buah itu
  rationale: דרך di sini menunjuk pada penginjakan buah anggur untuk memerasnya. Terjemahan ini mempertahankan gambaran konkret tanpa mengganti tindakan itu dengan penjelasan teknis.
- source_word: וַיַּעֲשׂוּ הִלּוּלִים
  choice: Mereka mengadakan perayaan
  rationale: הִלּוּלִים dalam konteks ini menunjuk pada perayaan meriah yang berkaitan dengan panen anggur. 'Mengadakan perayaan' jelas dan wajar tanpa memastikan bentuk ritual yang tidak dijelaskan.
- source_word: בֵּית אֱלֹהֵיהֶם
  choice: rumah dewa mereka
  rationale: '''Rumah'' mempertahankan ungkapan sumber secara dekat, sedangkan ''dewa'' menandai bahwa yang dimaksud ialah ilah yang disembah di tempat itu. Bentuk אֱלֹהֵיהֶם dapat dipahami tunggal atau jamak, sehingga alternatif jamaknya dicatat.'
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: mereka makan dan minum
  rationale: Terjemahan langsung ini mempertahankan urutan tindakan dan tidak menambahkan unsur pesta makan yang hanya tersirat oleh konteks.
- source_word: וַיְקַלְלוּ אֶת אֲבִימֶלֶךְ
  choice: mengutuki Abimelekh
  rationale: Bentuk piel dari קלל di sini berarti mengutuki, lebih kuat daripada sekadar menghina atau mencela.
theological_decisions:
- issue: Makna tunggal atau jamak אֱלֹהֵיהֶם dalam konteks penyembahan non-Israel
  choice: dewa mereka
  alternative: dewa-dewa mereka
  rationale: Walaupun bentuk Ibraninya secara morfologis dapat dibaca sebagai jamak, konteks kemungkinan besar menunjuk pada dewa tertentu yang rumah ibadahnya mereka masuki. Terjemahan utama memakai bentuk tunggal, sementara kemungkinan jamak tetap dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang jelas dan bermartabat. Rangkaian tindakan dibuat mengalir secara alami, sedangkan istilah konkret seperti 'menginjak-injak' dan 'rumah dewa' mempertahankan citra serta bentuk ungkapan Ibrani. Ambiguitas jumlah pada אֱלֹהֵיהֶם dan cakupan makna הִלּוּלִים disajikan dalam catatan kaki.
