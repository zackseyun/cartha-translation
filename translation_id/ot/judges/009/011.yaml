  yaml_path: translation/ot/judges/009/011.yaml
  text: But the fig tree said to them[a], ‘Should I stop producing my sweetness and my good fruit, and go to sway over the trees?’
translation:
  language: id
  text: Namun, pohon ara itu berkata kepada mereka, “Haruskah aku berhenti menghasilkan kemanisanku dan buahku yang baik, lalu pergi untuk bergoyang di atas pohon-pohon[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memerintah atas pohon-pohon.” Kata kerja Ibrani ini secara harfiah berarti “bergoyang” atau “bergerak”; ungkapan itu mempertahankan gambaran pohon sekaligus menyiratkan pemerintahan dalam fabel ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Namun, ... berkata
  rationale: Waw meneruskan alur narasi, sedangkan “Namun” menyatakan kontras antara ajakan para pohon dan penolakan pohon ara.
- source_word: הַתְּאֵנָה
  choice: pohon ara
  rationale: Nomina ini menunjuk kepada pohon ara sebagai tokoh yang berbicara dalam fabel.
- source_word: הֶחֳדַלְתִּי
  choice: Haruskah aku berhenti menghasilkan
  rationale: Bentuk perfektif dalam pertanyaan retoris ini memiliki daya deliberatif. Kata “menghasilkan” ditambahkan secara idiomatis karena objeknya adalah hasil pohon.
- source_word: מָתְקִי
  choice: rasa manisku
  rationale: Ungkapan ini mempertahankan konsep harfiah tentang kemanisan sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: תְּנוּבָתִי הַטּוֹבָה
  choice: buahku yang baik
  rationale: תְּנוּבָה berarti hasil atau buah; dalam konteks pohon ara, “buah” merupakan padanan yang paling alami.
- source_word: וְהָלַכְתִּי
  choice: lalu pergi
  rationale: Klausa ini tetap bergantung pada pertanyaan deliberatif sebelumnya dan melanjutkan konsekuensi tindakan yang dipertimbangkan.
- source_word: לָנוּעַ
  choice: bergoyang-goyang
  rationale: Kata kerja נוע secara dasar berarti bergerak, bergoyang, atau terhuyung. Pilihan ini mempertahankan permainan citra pohon, sementara implikasi memerintah dijelaskan dalam catatan kaki.
- source_word: עַל הָעֵצִים
  choice: di atas pohon-pohon lain
  rationale: עַל dapat menyatakan posisi di atas sekaligus otoritas atas. “Lain” dibuat eksplisit secara kontekstual karena pohon ara sendiri termasuk pohon.
