  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk “bergoyang-goyang di atas” sengaja mempertahankan citra dan ambiguitas leksikal bahasa Ibrani, sedangkan makna pemerintahan diberikan sebagai alternatif dalam catatan kaki.
