lexical_decisions:
- source_word: וַיָּשַׂר
  choice: memerintah
  rationale: Kata kerja dari akar שׂרר menyatakan pelaksanaan kekuasaan atau pemerintahan. “Memerintah” merupakan padanan Indonesia modern yang alami dan mempertahankan makna politiknya.
- source_word: אֲבִימֶלֶךְ
  choice: Abimelekh
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang mencerminkan nama Ibrani dan konvensi ejaan bahasa Indonesia.
- source_word: עַל
  choice: atas
  rationale: Bersama kata kerja yang bermakna memerintah, עַל menandai pihak yang berada di bawah kekuasaan; frasa “memerintah atas” mempertahankan relasi tersebut.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Menggunakan bentuk baku nama bangsa dalam bahasa Indonesia.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: selama tiga tahun
  rationale: Ungkapan durasi ini secara alami dinyatakan dengan “selama” dalam bahasa Indonesia.
