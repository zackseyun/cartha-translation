  text: וַ/יָּבֹ֤א אֲבִימֶ֨לֶךְ֙ עַד הַ/מִּגְדָּ֔ל וַ/יִּלָּ֖חֶם בּ֑/וֹ וַ/יִּגַּ֛שׁ עַד פֶּ֥תַח הַ/מִּגְדָּ֖ל לְ/שָׂרְפ֥/וֹ בָ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/052.yaml
  text: Abimelech came up to the tower and fought against it, and he came near to the entrance of the tower to burn it with fire.
translation:
  language: id
  text: Abimelekh datang ke menara itu dan menyerangnya. Ia mendekati pintu masuk menara itu untuk membakarnya dengan api.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא ... עַד־הַמִּגְדָּל
  choice: maju sampai ke menara itu
  rationale: Konstruksi ini menyatakan gerak hingga mencapai menara; 'maju' secara alami menyampaikan pendekatan dalam konteks penyerangan tanpa menambahkan gagasan geografis yang tidak dinyatakan.
- source_word: וַיִּלָּחֶם בּוֹ
  choice: menyerangnya
  rationale: Secara harfiah, 'berperang melawannya'; dalam konteks serangan terhadap sebuah menara, 'menyerangnya' lebih alami dan tetap mempertahankan objek pronominal yang merujuk kepada menara.
- source_word: פֶּתַח הַמִּגְדָּל
  choice: pintu masuk menara itu
  rationale: פֶּתַח menunjuk pada bukaan atau jalan masuk; 'pintu masuk' jelas dan wajar dalam bahasa Indonesia modern tanpa memastikan adanya daun pintu.
- source_word: לְשָׂרְפוֹ בָאֵשׁ
  choice: untuk membakarnya dengan api
  rationale: Mempertahankan konstruksi tujuan dan ungkapan eksplisit 'dengan api' dalam teks Ibrani, meskipun dalam bahasa Indonesia unsur itu terasa agak redundan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kalimat Ibrani yang panjang dibagi menjadi dua kalimat agar alami dan mudah dipahami, tanpa mengubah urutan tindakan atau isi.
