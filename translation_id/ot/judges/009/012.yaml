base_translation:
  language: en
  yaml_path: translation/ot/judges/009/012.yaml
  text: Then the trees said to the vine[a], ‘Come, reign over us.’
translation:
  language: id
  text: Kemudian pohon-pohon itu berkata kepada pohon anggur, “Mari[a], jadilah raja atas kami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Pergilah, engkau jadilah raja atas kami.” Dalam konteks ini, ungkapan Ibrani tersebut lebih wajar disampaikan sebagai ajakan, “Mari, jadilah raja atas kami.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Kemudian ... berkata
  rationale: Waw-konsekutif melanjutkan urutan cerita; “kemudian” menyampaikan perkembangan narasi secara wajar dalam bahasa Indonesia.
- source_word: הָעֵצִים
  choice: pohon-pohon itu
  rationale: Dalam konteks perumpamaan Yotam, bentuk jamak עֵץ menunjuk kepada pohon-pohon, bukan kayu sebagai bahan.
- source_word: לַגָּפֶן
  choice: kepada pohon anggur
  rationale: גֶּפֶן berarti tanaman anggur; “pohon anggur” merupakan sebutan yang lazim dan mudah dipahami dalam bahasa Indonesia.
- source_word: לְכִי
  choice: Mari
  rationale: Walaupun bentuk dari הלך secara leksikal berarti “pergi/berjalan”, dalam rangkaian ajakan yang diikuti imperatif, “mari” menyampaikan fungsi idiomatisnya secara alami.
- source_word: אַתְּ
  choice: tersirat dalam bentuk sapaan dan imperatif
  rationale: Pronomina feminin tunggal ini menegaskan bahwa pohon anggur menjadi pihak yang disapa. Bahasa Indonesia tidak perlu menyatakan “engkau” secara eksplisit di sini.
- source_word: מְלֹכִי
  choice: jadilah raja
  rationale: Imperatif feminin tunggal dari מלך menyatakan pengangkatan atau pelaksanaan pemerintahan sebagai raja. “Jadilah raja” mempertahankan gambaran kerajaan dengan jelas.
- source_word: עָלֵינוּ
  choice: atas kami
  rationale: Dengan מלך, preposisi עַל menandai pihak yang diperintah; “atas kami” merupakan padanan langsung dan wajar.
theological_decisions: []
