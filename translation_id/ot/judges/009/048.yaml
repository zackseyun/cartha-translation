revisions:
- from: Lalu Abimelekh naik ke Gunung Zalmon bersama seluruh rakyat yang menyertainya. Abimelekh mengambil kapak-kapak dengan tangannya, memotong seikat ranting[a], mengangkatnya, lalu menaruhnya di atas bahunya. Kemudian ia berkata kepada rakyat yang menyertainya, “Apa yang kalian lihat telah kulakukan, cepatlah lakukan juga seperti aku!”
  to: Lalu Abimelekh naik ke Gunung Zalmon, ia dan seluruh orang yang bersamanya. Abimelekh mengambil kapak-kapak itu ke dalam tangannya, memotong seikat ranting[a], mengangkatnya, lalu meletakkannya di atas bahunya. Kemudian ia berkata kepada orang-orang yang bersamanya, “Apa yang kalian lihat aku lakukan, cepatlah lakukan seperti yang kulakukan!”
  rationale: Revisi ini mempertahankan semua unsur naratif dan ambiguitas leksikal teks sumber, sambil membetulkan penyebutan tangan yang tunggal, memakai rujukan netral untuk עָם, dan melicinkan perintah langsung dalam bahasa Indonesia modern. Catatan kaki tetap menandai bahwa arti tepat istilah Ibrani untuk kumpulan ranting/belukar diperdebatkan.
