  text: וַ/יַּ֨עַל אֲבִימֶ֜לֶךְ הַר צַלְמ֗וֹן הוּא֮ וְ/כָל הָ/עָ֣ם אֲשֶׁר אִתּ/וֹ֒ וַ/יִּקַּח֩ אֲבִימֶ֨לֶךְ אֶת הַ/קַּרְדֻּמּ֜וֹת בְּ/יָד֗/וֹ וַ/יִּכְרֹת֙ שׂוֹכַ֣ת עֵצִ֔ים וַ/יִּ֨שָּׂאֶ֔/הָ וַ/יָּ֖שֶׂם עַל שִׁכְמ֑/וֹ וַ/יֹּ֜אמֶר אֶל הָ/עָ֣ם אֲשֶׁר עִמּ֗/וֹ מָ֤ה רְאִיתֶם֙ עָשִׂ֔יתִי מַהֲר֖וּ עֲשׂ֥וּ כָמֽוֹ/נִי־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/048.yaml
  text: Then Abimelek went up Mount Zalmon[a], he and all the people who were with him. Abimelek took the axes in his hand, cut down a bundle of branches, lifted it, and put it on his shoulder. Then he said to the people who were with him, “What you have seen me do, hurry and do as I have done.”
translation:
  language: id
  text: Lalu Abimelekh naik ke Gunung Zalmon, ia dan seluruh orang yang bersamanya. Abimelekh mengambil kapak-kapak itu ke dalam tangannya, memotong seikat ranting[a], mengangkatnya, lalu meletakkannya di atas bahunya. Kemudian ia berkata kepada orang-orang yang bersamanya, “Apa yang kalian lihat aku lakukan, cepatlah lakukan seperti yang kulakukan!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebuah dahan pohon,” “belukar,” atau “seberkas ranting”; istilah Ibraninya jarang dipakai dan menunjuk pada sekumpulan dahan, ranting, atau belukar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: naik
  rationale: Kata עלה dalam narasi menyatakan gerak ke tempat yang lebih tinggi; 'naik' alami dan tepat dalam bahasa Indonesia.
- source_word: הַר צַלְמוֹן
  choice: Gunung Zalmon
  rationale: Nama tempat ditransliterasikan, sedangkan הַר diterjemahkan secara idiomatis sebagai 'Gunung'.
- source_word: הוּא וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: bersama seluruh rakyat yang menyertainya
  rationale: עָם tetap diterjemahkan secara umum sebagai 'rakyat', tanpa mempersempitnya menjadi pasukan atau laki-laki; susunan Indonesia dibuat alami.
- source_word: הַקַּרְדֻּמּוֹת
  choice: kapak-kapak
  rationale: Bentuk Ibrani bermorfologi jamak dan berartikel, sehingga jumlah jamaknya dipertahankan meskipun konteksnya tidak sepenuhnya jelas.
- source_word: בְּיָדוֹ
  choice: dengan tangannya
  rationale: Preposisi בְּ di sini dapat menunjukkan sarana atau cara memegang; frasa ini mempertahankan penyebutan tangan secara eksplisit.
- source_word: וַיִּכְרֹת שׂוֹכַת עֵצִים
  choice: memotong seikat ranting
  rationale: שׂוֹכַת עֵצִים menunjuk pada sekumpulan dahan, ranting, atau semak kayu yang dapat dipikul. 'Seikat ranting' sesuai konteks tanpa menghilangkan ketidakpastian leksikal, yang dicatat dalam catatan kaki.
- source_word: וַיִּשָּׂאֶהָ
  choice: mengangkatnya
  rationale: נשא dapat berarti mengangkat atau membawa; 'mengangkatnya' mempertahankan urutan sebelum benda itu diletakkan di bahu.
- source_word: וַיָּשֶׂם עַל שִׁכְמוֹ
  choice: menaruhnya di atas bahunya
  rationale: Terjemahan langsung dan wajar dari tindakan meletakkan beban pada bahu.
- source_word: מָה רְאִיתֶם עָשִׂיתִי
  choice: Apa yang kalian lihat telah kulakukan
  rationale: Ungkapan Ibrani padat; bentuk ini mempertahankan hubungan antara apa yang dilihat dan tindakan Abimelekh tanpa menambahkan penafsiran.
- source_word: מַהֲרוּ עֲשׂוּ כָמוֹנִי
  choice: cepatlah lakukan juga seperti aku
  rationale: Kedua imperatif jamak dan desakan untuk meniru tindakan Abimelekh disampaikan secara langsung dan alami.
