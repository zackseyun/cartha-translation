base_translation:
  language: en
  yaml_path: translation/ot/judges/009/009.yaml
  text: But the olive tree said to them[a], ‘Should I stop producing my oil, by which gods and men are honored[b], and go to sway over the trees?’
translation:
  language: id
  text: Namun, pohon zaitun itu berkata kepada mereka, “Haruskah aku berhenti menghasilkan minyakku,[a] yang dengannya para ilah dan manusia dihormati,[b] lalu pergi bergoyang-goyang di atas pohon-pohon?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “kegemukanku,” ungkapan kiasan bagi hasil pohon zaitun yang kaya, terutama minyaknya.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Allah dan manusia dihormati.” Kata Ibrani yang diterjemahkan “para ilah” berbentuk jamak dan diikuti verba jamak, tetapi dapat dipahami sebagai sebutan bagi Allah dalam kaitannya dengan penggunaan minyak zaitun dalam ibadah.'
    reason: alternative_reading
lexical_decisions:
- source_word: הַזַּיִת
  choice: pohon zaitun
  rationale: Dalam fabel ini nomina tersebut menunjuk pada pohon yang berbicara, bukan sekadar buah zaitun.
- source_word: הֶחֳדַלְתִּי
  choice: Haruskah aku meninggalkan
  rationale: Bentuk perfektum berfungsi sebagai pertanyaan retoris dalam konteks undangan untuk menjadi raja.
- source_word: דִּשְׁנִי
  choice: hasilku yang kaya
  rationale: Secara harfiah berarti 'kegemukanku/kelimpahanku' dan secara kontekstual menunjuk pada hasil kaya pohon zaitun, terutama minyaknya, tanpa mengganti metafora Ibrani dengan kata 'minyak' secara langsung.
- source_word: אֲשֶׁר בִּי
  choice: yang dengannya
  rationale: Mengungkapkan fungsi instrumental dari hasil pohon zaitun secara alami dalam bahasa Indonesia.
- source_word: יְכַבְּדוּ
  choice: dihormati
  rationale: Walaupun verba Ibrani aktif dan jamak, pelakunya tidak dinyatakan; bentuk pasif mempertahankan fokus dan tidak menambahkan subjek.
- source_word: אֱלֹהִים
  choice: para ilah
  rationale: Bentuk nomina dan verbanya jamak; 'para ilah' mempertahankan pembacaan plural, sementara kemungkinan rujukan kepada Allah dicatat dalam catatan kaki.
- source_word: וַאֲנָשִׁים
  choice: dan manusia
  rationale: Padanan kolektif yang alami bagi bentuk jamak Ibrani dan sesuai dengan pasangan 'para ilah dan manusia'.
- source_word: לָנוּעַ
  choice: bergoyang-goyang
  rationale: Mempertahankan citra gerak pohon dan ironi fabel; kedudukan memerintah tersirat oleh frasa 'di atas pohon-pohon' dan konteks pengangkatan raja.
- source_word: עַל הָעֵצִים
  choice: di atas pohon-pohon
  rationale: Mempertahankan makna spasial sekaligus nuansa kedudukan berkuasa yang dimaksud dalam fabel.
theological_decisions:
- issue: Rujukan אֱלֹהִים dalam klausa mengenai penghormatan
  choice: para ilah
  alternative: Allah
  rationale: Bentuk אֱלֹהִים disertai verba jamak, sehingga pembacaan plural paling langsung. Namun, pemakaian minyak zaitun dalam ibadah memungkinkan pembacaan tradisional 'Allah'; ketegangan ini dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Diksi 'hasilku yang kaya' menjaga metafora sumber sekaligus tetap mudah dipahami; 'bergoyang-goyang di atas' mempertahankan permainan citra pohon dan kekuasaan.
