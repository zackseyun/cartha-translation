base_translation:
  language: en
  yaml_path: translation/ot/judges/009/037.yaml
  text: Gaal spoke again and said[a], “Look, people are coming down from the center of the land[b], and one company is coming by the way of the Oak of the Soothsayers.”
translation:
  language: id
  text: Gaal kembali berbicara dan berkata, “Lihat, orang-orang sedang turun dari pusat negeri[a], dan satu kelompok datang dari arah Pohon Tarbantin Para Peramal[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pusar negeri,” sebuah ungkapan untuk bagian tengah negeri.
    reason: lexical_alternative
  - marker: b
    text: Atau “Pohon Ek Para Peramal,” “Pohon Tarbantin Para Penilik,” atau “Pohon Tarbantin Meonenim.” Jenis pohon dan arti unsur terakhir nama tempat ini tidak pasti; unsur terakhir itu mungkin mengacu kepada para peramal atau penilik pertanda.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד גַּעַל לְדַבֵּר
  choice: Gaal berbicara lagi
  rationale: Ungkapan harfiah ‘menambahkan lagi untuk berbicara’ secara idiomatis menyatakan bahwa Gaal kembali atau melanjutkan berbicara. ‘Berbicara lagi’ alami dan ringkas dalam bahasa Indonesia.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Partikel ini menarik perhatian kepada sesuatu yang sedang tampak. ‘Lihat’ mempertahankan daya deiktisnya dalam bahasa Indonesia modern.
- source_word: עָם יֹרְדִים
  choice: orang-orang sedang turun
  rationale: עָם pada konteks pengamatan ini menunjuk kepada sejumlah orang; bentuk partisipelnya menyatakan gerakan yang sedang berlangsung. ‘Pasukan’ dihindari karena akan mempersempit makna nomina sumber.
- source_word: מֵעִם טַבּוּר הָאָרֶץ
  choice: dari pusat negeri
  rationale: טַבּוּר secara harfiah berarti ‘pusar’, tetapi dalam pemakaian geografis menunjuk bagian tengah. ‘Pusat negeri’ menyampaikan maksud idiom tersebut secara wajar, sementara metafora sumber dicatat dalam catatan kaki.
- source_word: וְרֹאשׁ אֶחָד
  choice: dan satu kelompok
  rationale: רֹאשׁ secara harfiah berarti ‘kepala’, tetapi di sini menunjuk satu bagian atau rombongan tersendiri dari kumpulan yang mendekat. ‘Kelompok’ tidak menentukan ukuran atau susunan militernya secara berlebihan.
- source_word: בָּא מִדֶּרֶךְ
  choice: datang dari arah
  rationale: Frasa ini menunjukkan jalur atau arah kedatangan. ‘Datang dari arah’ alami dalam laporan seseorang yang sedang mengamati pergerakan dari kejauhan.
- source_word: אֵלוֹן מְעוֹנְנִים
  choice: Pohon Tarbantin Para Peramal
  rationale: אֵלוֹן dapat menunjuk pohon besar, khususnya tarbantin atau ek. מְעוֹנְנִים kemungkinan berkaitan dengan praktik meramal dan tampaknya menjadi unsur nama tempat. Huruf kapital menandai fungsi toponimisnya, sedangkan ketidakpastian unsur-unsurnya dipertahankan dalam catatan kaki.
