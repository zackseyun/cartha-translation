  register: Bahasa Indonesia modern, lugas, dan bermartabat. Dialog mempertahankan kesan laporan langsung melalui ‘Lihat’ dan bentuk progresif ‘sedang turun’. Istilah militer yang terlalu khusus dihindari karena teks Ibrani hanya menyebut ‘orang-orang’ dan ‘satu kepala/bagian’.
