base_translation:
  language: en
  yaml_path: translation/ot/judges/009/014.yaml
  text: Then all the trees said to the bramble[a], ‘You come, reign over us.’
translation:
  language: id
  text: Lalu semua pohon berkata kepada semak duri[a], “Datanglah, jadilah raja atas kami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “belukar berduri.” Kata Ibrani אָטָד menunjuk pada sejenis semak berduri; spesiesnya tidak dapat dipastikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Lalu ... berkata
  rationale: Waw-konsekutif melanjutkan urutan cerita; “lalu” menghasilkan alur naratif Indonesia yang alami.
- source_word: כָל הָעֵצִים
  choice: semua pohon
  rationale: Menerjemahkan subjek kolektif secara langsung dan alami dalam bahasa Indonesia.
- source_word: אֶל הָאָטָד
  choice: kepada semak duri
  rationale: אָטָד menunjuk pada semak berduri tanpa memastikan spesies botaninya; “semak duri” mempertahankan gambaran itu tanpa spesifikasi berlebihan.
- source_word: לֵךְ אַתָּה
  choice: Datanglah
  rationale: Dalam rangkaian dengan imperatif berikutnya, לֵךְ berfungsi sebagai ajakan atau penugasan yang mendesak. “Datanglah” lebih alami daripada terjemahan harfiah “pergilah” dalam konteks para pohon mengundang semak duri menjadi raja.
- source_word: מְלָךְ
  choice: jadilah raja
  rationale: Bentuk imperatif verba מלך berarti memerintah sebagai raja atau menjadi raja. “Jadilah raja” mempertahankan nuansa kerajaan dan terdengar wajar dalam ajakan langsung.
- source_word: עָלֵינוּ
  choice: atas kami
  rationale: Padanan ringkas dan baku untuk על dalam konteks pemerintahan.
