base_translation:
  language: en
  yaml_path: translation/ot/judges/009/031.yaml
  text: And he sent messengers to Abimelek secretly[a], saying, “Look, Gaal son of Ebed and his brothers have come to Shechem, and look, they are besieging the city against you.”
translation:
  language: id
  text: Ia mengirim utusan-utusan kepada Abimelekh secara diam-diam, katanya, “Lihat, Gaal anak Ebed dan saudara-saudaranya telah datang ke Sikhem. Lihatlah, mereka sedang menghasut kota itu untuk melawanmu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mereka sedang mengepung kota itu untuk melawanmu” atau “mereka sedang membuat kota itu memusuhimu.” Verba Ibrani di sini sulit dipastikan. Dalam konteksnya, kata itu mungkin menunjuk pada tindakan Gaal dan kelompoknya yang menggerakkan penduduk Sikhem melawan Abimelekh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Ia mengirim
  rationale: Bentuk wayyiqtol melanjutkan alur narasi dan secara alami diterjemahkan dengan verba lampau kontekstual dalam bahasa Indonesia; subjek laki-laki tunggal dipertahankan dengan “Ia”.
- source_word: מַלְאָכִים
  choice: utusan-utusan
  rationale: Dalam konteks politik dan militer ini, kata tersebut menunjuk kepada manusia yang membawa pesan, bukan malaikat.
- source_word: בְּתָרְמָה
  choice: secara diam-diam
  rationale: Ungkapan ini menyatakan tindakan terselubung atau rahasia. “Secara diam-diam” alami dalam bahasa Indonesia dan tidak menambahkan penilaian moral sekuat “dengan tipu daya”.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Rumus Ibrani yang memperkenalkan perkataan langsung diterjemahkan secara idiomatis dan ringkas.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Partikel ini menarik perhatian pendengar kepada laporan yang mendesak; “Lihat” mempertahankan fungsi wacananya tanpa bahasa arkais.
- source_word: גַעַל בֶּן עֶבֶד
  choice: Gaal anak Ebed
  rationale: Nama-nama ditransliterasikan dan konstruksi hubungan ayah-anak diterjemahkan langsung.
- source_word: וְאֶחָיו
  choice: dan saudara-saudaranya
  rationale: Terjemahan mempertahankan istilah sumber “saudara,” walaupun dalam konteks tertentu cakupannya dapat meliputi kerabat dekat atau para sekutu.
- source_word: בָּאִים שְׁכֶמָה
  choice: telah datang ke Sikhem
  rationale: Partisip dengan akhiran penunjuk arah menyatakan kedatangan yang sudah terjadi dan tetap relevan dengan keadaan saat laporan disampaikan.
- source_word: וְהִנָּם
  choice: Lihatlah, mereka sedang
  rationale: Partikel perhatian yang diikuti pronomina diberi bentuk yang menegaskan keadaan mereka saat itu.
- source_word: צָרִים אֶת הָעִיר עָלֶיךָ
  choice: mereka sedang mengepung kota itu untuk melawanmu
  rationale: “Mengepung” mempertahankan arti konkret yang lazim dari verba צור, sedangkan catatan kaki menjaga kemungkinan kontekstual bahwa yang dimaksud ialah menghasut atau membuat kota itu memusuhi Abimelekh.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Bentuk “Abimelekh” dan “Sikhem” mengikuti transliterasi nama yang umum dalam Alkitab bahasa Indonesia. Pengulangan “Lihat ... Lihatlah” dipertahankan untuk mencerminkan dua penanda perhatian dalam teks Ibrani. Penanda catatan kaki ditempatkan pada klausa yang benar-benar memiliki kesulitan leksikal.
