  to: Ia mengirim utusan-utusan kepada Abimelekh secara diam-diam, katanya, “Lihat, Gaal anak Ebed dan saudara-saudaranya telah datang ke Sikhem. Lihatlah, mereka sedang menghasut kota itu untuk melawanmu[a].”
