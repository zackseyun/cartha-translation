id: JDG.9.17
reference: Judges 9:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֲשֶׁר נִלְחַ֥ם אָבִ֖/י עֲלֵי/כֶ֑ם וַ/יַּשְׁלֵ֤ךְ אֶת נַפְשׁ/וֹ֙ מִ/נֶּ֔גֶד וַ/יַּצֵּ֥ל אֶתְ/כֶ֖ם מִ/יַּ֥ד מִדְיָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/017.yaml
  text: because my father fought for you[a], cast his life in front of him[b], and delivered you from the hand of Midian.
translation:
  language: id
  text: sebab ayahku telah berperang demi kamu, mempertaruhkan nyawanya[a], dan melepaskan kamu dari tangan Midian[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “melemparkan nyawanya dari hadapannya,” sebuah ungkapan yang berarti membiarkan dirinya menghadapi bahaya maut.
    reason: lexical_alternative
  - marker: b
    text: Atau “dari kekuasaan Midian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: sebab
  rationale: Dalam rangkaian argumentasi Yotam, partikel relatif ini berfungsi menjelaskan alasan bagi pernyataan sebelumnya. “Sebab” menyatakan hubungan kausal itu secara wajar dalam bahasa Indonesia.
- source_word: נִלְחַם אָבִי עֲלֵיכֶם
  choice: ayahku telah berperang demi kamu
  rationale: Bentuk נִלְחַם berarti “berperang,” sedangkan עֲלֵיכֶם dalam konteks penyelamatan dari Midian menyatakan kepentingan atau manfaat bagi para pendengar, bukan perlawanan terhadap mereka.
- source_word: וַיַּשְׁלֵךְ אֶת־נַפְשׁוֹ מִנֶּגֶד
  choice: mempertaruhkan nyawanya
  rationale: Ungkapan Ibrani yang secara harfiah menggambarkan seseorang melemparkan nyawanya dari hadapannya berarti membiarkan dirinya menghadapi bahaya maut. “Mempertaruhkan nyawanya” menyampaikan idiom itu dengan jelas dan tetap kuat.
- source_word: וַיַּצֵּל
  choice: melepaskan
  rationale: Bentuk Hifil dari נצל berarti merebut dari bahaya, menyelamatkan, atau melepaskan. “Melepaskan” berpadu alami dengan ungkapan “dari tangan” dan mempertahankan gambaran pembebasan dari kuasa musuh.
- source_word: מִיַּד מִדְיָן
  choice: dari tangan Midian
  rationale: Terjemahan ini mempertahankan idiom Ibrani “dari tangan,” yang dalam konteks berarti keluar dari kuasa atau kekuasaan Midian.
