translation_notes:
  register: 'Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama-nama mengikuti bentuk Indonesia yang lazim: Ofra, Yerubaal, dan Yotam. Tanda pisah mempertahankan penekanan aposisional pada jumlah korban.'
