  text: וַ/יָּבֹ֤א בֵית אָבִי/ו֙ עָפְרָ֔תָ/ה וַֽ/יַּהֲרֹ֞ג אֶת אֶחָ֧י/ו בְּנֵֽי יְרֻבַּ֛עַל שִׁבְּעִ֥ים אִ֖ישׁ עַל אֶ֣בֶן אֶחָ֑ת וַ/יִּוָּתֵ֞ר יוֹתָ֧ם בֶּן יְרֻבַּ֛עַל הַ/קָּטֹ֖ן כִּ֥י נֶחְבָּֽא־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/005.yaml
  text: Then he went to his father’s house at Ophrah and killed his brothers[a], the sons of Jerubbaal—seventy men—on one stone. But Jotham, the youngest son of Jerubbaal, was left[c][b], because he hid himself.
translation:
  language: id
  text: Lalu ia pergi ke rumah ayahnya di Ofra[a] dan membunuh saudara-saudaranya, anak-anak Yerubaal—tujuh puluh orang—di atas satu batu[b]. Namun, Yotam, putra Yerubaal yang bungsu, tetap hidup[c], karena ia bersembunyi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Lalu ia datang ke rumah ayahnya, ke Ofra.”'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “di atas satu batu” mungkin menunjuk kepada sebuah batu yang menjadi lokasi pelaksanaan pembunuhan itu, sehingga ketujuh puluh orang tersebut dibunuh di satu lokasi.
    reason: cultural_note
  - marker: c
    text: 'Secara lebih harfiah: “tersisa” atau “tertinggal”; dapat juga diterjemahkan “dibiarkan hidup.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא בֵית אָבִיו עָפְרָתָה
  choice: Lalu ia pergi ke rumah ayahnya di Ofra
  rationale: Bentuk naratif וַיָּבֹא melanjutkan rangkaian peristiwa. Walaupun arti dasarnya dapat diterjemahkan 'datang', bahasa Indonesia lebih alami memakai 'pergi' ketika gerak menuju tujuan dipandang dari sudut pelaku. Akhiran direktif pada עָפְרָתָה menyatakan arah menuju Ofra; keseluruhan frasa diterjemahkan secara alami sebagai rumah ayahnya yang berada di Ofra.
- source_word: וַיַּהֲרֹג
  choice: membunuh
  rationale: Pilihan ini menyampaikan arti dasar verba tanpa menambahkan penilaian hukum yang tidak dinyatakan secara leksikal; kekejaman tindakan itu sudah jelas dari konteks.
- source_word: אֶת אֶחָיו בְּנֵי יְרֻבַּעַל
  choice: saudara-saudaranya, anak-anak Yerubaal
  rationale: Frasa kedua merupakan aposisi yang menjelaskan identitas saudara-saudaranya. Kedua unsur dipertahankan agar penekanan dan kejelasan teks Ibrani tidak hilang.
- source_word: שִׁבְעִים אִישׁ
  choice: tujuh puluh orang
  rationale: Dalam konstruksi sesudah bilangan, אִישׁ dapat berarti 'orang'. Pilihan ini alami dalam bahasa Indonesia dan tetap merujuk kepada anak-anak lelaki Yerubaal.
- source_word: עַל אֶבֶן אֶחָת
  choice: di atas satu batu
  rationale: Terjemahan ini mempertahankan gambaran konkret dan mengerikan dalam teks Ibrani tanpa memastikan fungsi batu tersebut lebih jauh daripada yang dinyatakan teks.
- source_word: וַיִּוָּתֵר
  choice: tetap hidup
  rationale: Bentuk Nifal ini berarti 'tertinggal' atau 'tersisa'. Dalam konteks pembunuhan saudara-saudaranya, 'tetap hidup' menyampaikan maksud kontekstual secara jelas, sementara arti yang lebih harfiah dicatat dalam catatan kaki.
- source_word: הַקָּטֹן
  choice: anak bungsu
  rationale: Dalam konteks hubungan keluarga, kata yang secara dasar berarti 'yang kecil/muda' secara alami menunjuk kepada anak termuda.
- source_word: כִּי נֶחְבָּא
  choice: karena ia bersembunyi
  rationale: Klausa ini memberikan alasan Yotam selamat. Bentuk Nifal di sini secara kontekstual bernuansa refleksif dan alami diterjemahkan 'bersembunyi'.
