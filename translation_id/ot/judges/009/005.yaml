    issue: Frasa 'anak bungsu Yerubaal' tidak secara eksplisit menerjemahkan בֶּן ('putra').
    rationale: Ibrani menyebut Yotam sebagai 'putra Yerubaal, yang bungsu'. 'Anak' dapat dipahami lebih umum dalam bahasa Indonesia; 'putra' mempertahankan informasi sumber secara jelas.
  - severity: low
    issue: Catatan kaki b menyatakan bahwa 'di atas satu batu' mungkin menunjuk kepada 'satu batu atau satu tempat'.
    rationale: Teks Ibrani secara spesifik menyebut satu batu. Catatan boleh menjelaskan kemungkinan batu itu merupakan lokasi eksekusi, tetapi tidak sebaiknya mengganti rujukan batu dengan 'tempat' sebagai alternatif.
