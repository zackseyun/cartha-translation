base_translation:
  language: en
  yaml_path: translation/ot/judges/009/023.yaml
  text: Then God sent an evil spirit between Abimelech and the leaders of Shechem[c][b][a], and the leaders of Shechem dealt treacherously with Abimelech.
translation:
  language: id
  text: Lalu Allah mengirim roh jahat[a] di antara Abimelekh dan para pemimpin Sikhem[b], dan para pemimpin Sikhem berkhianat terhadap Abimelekh.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roh yang mencelakakan.” Kata Ibrani yang digunakan dapat menekankan kejahatan moral ataupun akibat yang membahayakan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “para tuan Sikhem”; dalam konteks ini kemungkinan besar para tokoh terkemuka atau pemimpin kota itu.
    reason: lexical_alternative
  - marker: c
    text: Atau “bertindak khianat terhadap Abimelekh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengirim
  rationale: Bentuk naratif dari שׁלח secara langsung menyatakan tindakan mengirim dan mempertahankan tindakan aktif Allah tanpa tambahan tafsir.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini אֱלֹהִים menunjuk kepada Allah yang bertindak dalam penghakiman; 'Allah' adalah padanan baku dalam bahasa Indonesia.
- source_word: רוּחַ רָעָה
  choice: roh jahat
  rationale: Terjemahan ini paling langsung mempertahankan רוּחַ dan sifat רָעָה. Kemungkinan penekanan pada akibat yang mencelakakan dicatat dalam catatan kaki.
- source_word: בֵּין ... וּבֵין
  choice: di antara ... dan
  rationale: Pasangan preposisi ini menunjukkan bahwa roh tersebut bekerja di antara kedua pihak dan menimbulkan permusuhan atau perpecahan.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: para pemimpin Sikhem
  rationale: Secara harfiah בַּעֲלֵי berarti para tuan atau pemilik, tetapi dalam konteks politik kota ini menunjuk kepada orang-orang yang memegang kuasa di Sikhem.
- source_word: וַיִּבְגְּדוּ
  choice: berkhianat
  rationale: בגד menyatakan tindakan tidak setia atau khianat. 'Berkhianat' alami dalam bahasa Indonesia dan mempertahankan bobot moralnya.
- source_word: בַּאֲבִימֶלֶךְ
  choice: terhadap Abimelekh
  rationale: Dengan verba בגד, preposisi ב menandai pihak yang menjadi sasaran ketidaksetiaan; 'terhadap' merupakan ungkapan Indonesia yang wajar.
theological_decisions:
- issue: Tindakan Allah dalam mengirim roh jahat
  choice: Allah mengirim roh jahat
  alternative: Allah mengizinkan roh jahat atau roh permusuhan
  rationale: Verba dan sintaksis Ibrani secara langsung mengaitkan tindakan mengirim dengan Allah. Terjemahan tidak melemahkannya menjadi sekadar izin, dan membiarkan ketegangan teologis teks tetap terbuka.
- issue: Hubungan antarklausa
  choice: sehingga para pemimpin Sikhem berkhianat
  alternative: dan para pemimpin Sikhem berkhianat
  rationale: Waw naratif dapat diterjemahkan secara berurutan sebagai 'dan', tetapi konteks memperlihatkan tindakan khianat itu sebagai hasil dari roh yang dikirim di antara kedua pihak. 'Sehingga' menyatakan hubungan kontekstual ini tanpa menjelaskan mekanismenya.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Nama tempat dan tokoh mengikuti ejaan Alkitab Indonesia yang lazim: Sikhem dan Abimelekh. Susunan kalimat mempertahankan tindakan langsung Allah serta hubungan permusuhan antara kedua pihak.'
