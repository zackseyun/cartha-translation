  yaml_path: translation/ot/judges/009/039.yaml
  text: So Gaal went out before the leaders of Shechem and fought against Abimelech[a].
translation:
  language: id
  text: Lalu Gaal maju di depan para pemimpin Sikhem dan berperang melawan Abimelekh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di barisan depan para pemimpin Sikhem.” Ungkapan Ibrani yang secara harfiah berarti “di depan” dalam konteks ini dapat menyiratkan bahwa Gaal memimpin mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: maju
  rationale: Qal wayyiqtol dari יצא berarti ‘keluar/pergi keluar’. Dalam konteks pasukan yang keluar untuk bertempur, ‘maju’ terdengar alami dalam narasi Indonesia dan menyampaikan gerak menuju pertempuran.
- source_word: גַעַל
  choice: Gaal
  rationale: Nama diri ditransliterasikan menurut bentuk Ibrani.
- source_word: לִפְנֵי
  choice: di depan
  rationale: Secara harfiah berarti ‘di hadapan/di depan’. Pilihan ini mempertahankan gambaran posisi Gaal, sekaligus membiarkan kemungkinan bahwa ia berada sebagai pemimpin mereka.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: para pemimpin Sikhem
  rationale: בעלים di sini menunjuk pada orang-orang terkemuka atau penguasa kota, bukan sekadar seluruh penduduk. ‘Para pemimpin’ menyampaikan fungsi sosial-politiknya dengan jelas dalam bahasa Indonesia modern.
- source_word: וַיִּלָּחֶם
  choice: berperang
  rationale: Niphal wayyiqtol dari לחם bermakna bertempur atau berperang. ‘Berperang’ sesuai dengan konteks bentrokan bersenjata dan tetap ringkas.
- source_word: בַּאֲבִימֶלֶךְ
  choice: melawan Abimelekh
  rationale: Dengan verba לחם, preposisi ב menandai lawan. ‘Melawan’ menghindari ambiguitas dan jelas menunjukkan Abimelekh sebagai pihak lawan.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bernada naratif. ‘Maju di depan’ mempertahankan citra spasial teks Ibrani sambil tetap wajar dalam konteks militer. Ejaan nama mengikuti bentuk yang dekat dengan bahasa Ibrani: Sikhem dan Abimelekh.'
