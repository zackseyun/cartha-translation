  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּ֥שֶׁב אֲבִימֶ֖לֶךְ בָּ/ארוּמָ֑ה וַ/יְגָ֧רֶשׁ זְבֻ֛ל אֶת גַּ֥עַל וְ/אֶת אֶחָ֖י/ו מִ/שֶּׁ֥בֶת בִּ/שְׁכֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/041.yaml
  text: And Abimelech stayed in Arumah[a], and Zebul drove Gaal and his brothers out from dwelling in Shechem.
translation:
  language: id
  text: Abimelekh tinggal di Aruma, sedangkan Zebul mengusir Gaal dan saudara-saudaranya sehingga mereka tidak dapat tinggal di Sikhem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: tinggal
  rationale: Kata kerja ישׁב dapat berarti duduk, menetap, atau tinggal. Dalam konteks naratif ini, “tinggal” menyampaikan keberadaan Abimelekh di Aruma tanpa menyiratkan secara pasti bahwa itu merupakan kediaman jangka panjang.
- source_word: בָּארוּמָה
  choice: di Aruma
  rationale: Nama tempat ditransliterasikan sesuai bentuk yang lazim dan preposisinya diterjemahkan secara lokatif.
- source_word: וַיְגָרֶשׁ
  choice: mengusir
  rationale: גרשׁ menyatakan tindakan memaksa seseorang keluar. “Mengusir” alami dalam bahasa Indonesia dan tidak menambahkan nuansa hukuman resmi.
- source_word: זְבֻל
  choice: Zebul
  rationale: Nama pribadi ditransliterasikan.
- source_word: גַּעַל
  choice: Gaal
  rationale: Nama pribadi ditransliterasikan dalam bentuk sederhana yang mudah dibaca dalam bahasa Indonesia.
- source_word: אֶחָיו
  choice: saudara-saudaranya
  rationale: אח dalam bentuk jamak bersufiks secara langsung berarti “saudara-saudaranya”; konteks tidak mengharuskan perluasan menjadi kerabat atau pengikut.
- source_word: מִשֶּׁבֶת
  choice: sehingga mereka tidak dapat tinggal
  rationale: Gabungan מן dengan infinitif konstruk ישׁב menyatakan pencegahan atau pengucilan dari tindakan tinggal. Ungkapan hasil ini lebih alami dalam bahasa Indonesia daripada bentuk harfiah “dari tinggal”.
- source_word: בִּשְׁכֶם
  choice: di Sikhem
  rationale: Nama tempat ditransliterasikan menurut bentuk Indonesia yang lazim, dengan preposisi lokatif “di”.
theological_decisions: []
translation_notes:
  register: Bahasa naratif modern, lugas, dan bermartabat. Hubungan klausa memakai “sedangkan” untuk membedakan lokasi Abimelekh dari tindakan Zebul tanpa menambahkan hubungan sebab-akibat. Konstruksi akhir dibuat eksplisit secara idiomatis karena bahasa Ibrani menyatakan pencegahan dari menetap di Sikhem.
