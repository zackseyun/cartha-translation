  yaml_path: translation/ot/judges/009/040.yaml
  text: Abimelech pursued him[a], and he fled before him; and many slain fell as far as the entrance of the gate.
translation:
  language: id
  text: Abimelekh mengejarnya, dan Gaal melarikan diri dari hadapannya. Banyak orang tewas berjatuhan hingga ke pintu gerbang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְדְּפֵהוּ
  choice: mengejarnya
  rationale: Kata רדף menyatakan tindakan mengejar musuh. Bentuk pronominal '-nya' mempertahankan objek tunggal dalam teks Ibrani.
- source_word: וַיָּנָס
  choice: Gaal melarikan diri
  rationale: Kata נוס berarti 'melarikan diri'. Nama Gaal, yang dirujuk oleh verba tunggal berdasarkan ayat sebelumnya, dinyatakan untuk memperjelas pergantian pelaku dalam bahasa Indonesia.
- source_word: מִפָּנָיו
  choice: dari hadapannya
  rationale: Ungkapan ini secara harfiah berarti 'dari wajah/hadiratnya' dan dalam konteks ini menggambarkan pelarian dari hadapan pengejar. Pilihan ini alami sekaligus dekat dengan idiom sumber.
- source_word: וַיִּפְּלוּ חֲלָלִים רַבִּים
  choice: Banyak orang yang terbunuh bergelimpangan
  rationale: חֲלָלִים menunjuk kepada orang-orang yang tertikam atau terbunuh dalam pertempuran, sedangkan נפל mempertahankan gambaran bahwa mereka 'jatuh'. 'Bergelimpangan' menyampaikan secara wajar dalam bahasa Indonesia bahwa banyak korban tewas tergeletak di sepanjang jalur pertempuran.
- source_word: עַד פֶּתַח הַשָּׁעַר
  choice: sampai ke pintu gerbang
  rationale: Ungkapan ini menunjuk hingga bukaan atau jalan masuk gerbang. 'Pintu gerbang' merupakan padanan Indonesia yang ringkas dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama 'Gaal' dieksplisitkan demi kejelasan rujukan, tanpa mengubah identitas yang ditentukan konteks sebelumnya. Idiom pertempuran Ibrani disampaikan secara hidup melalui 'bergelimpangan'.
