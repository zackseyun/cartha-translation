id: JDG.9.20
reference: Judges 9:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אִם אַ֕יִן תֵּ֤צֵא אֵשׁ֙ מֵ/אֲבִימֶ֔לֶךְ וְ/תֹאכַ֛ל אֶת בַּעֲלֵ֥י שְׁכֶ֖ם וְ/אֶת בֵּ֣ית מִלּ֑וֹא וְ/תֵצֵ֨א אֵ֜שׁ מִ/בַּעֲלֵ֤י שְׁכֶם֙ וּ/מִ/בֵּ֣ית מִלּ֔וֹא וְ/תֹאכַ֖ל אֶת אֲבִימֶֽלֶךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/020.yaml
  text: But if not[a], let fire come out from Abimelech and consume the leaders of Shechem and Beth-millo[b]; and let fire come out from the leaders of Shechem and from Beth-millo and consume Abimelech.
translation:
  language: id
  text: Namun, jika tidak, biarlah api keluar dari Abimelekh dan melalap para pemimpin Sikhem[a] serta Bet-Milo[b]. Biarlah pula api keluar dari para pemimpin Sikhem dan dari Bet-Milo, lalu melalap Abimelekh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “para penguasa Sikhem.” Ungkapan Ibrani ini menunjuk kepada orang-orang terkemuka atau para penguasa kota itu.'
    reason: lexical_alternative
  - marker: b
    text: Bet-Milo dapat juga diterjemahkan “keluarga Milo” atau “rumah Milo”; mungkin yang dimaksud ialah suatu tempat atau kelompok penguasa yang berkaitan dengan Sikhem.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם אַיִן
  choice: Namun, jika tidak
  rationale: Ungkapan bersyarat ini melanjutkan pernyataan pada ayat sebelumnya dan beralih kepada kutuk jika syarat itu tidak terpenuhi. Bentuk ini wajar dalam bahasa Indonesia tanpa menambahkan penjelasan yang tidak ada dalam teks.
- source_word: תֵּצֵא אֵשׁ
  choice: biarlah api keluar
  rationale: Bentuk yiqtol di sini berfungsi sebagai jusif dalam ucapan kutuk. 'Biarlah' mempertahankan nuansa harapan atau kutuk, bukan mengubahnya menjadi ramalan masa depan yang tegas.
- source_word: וְתֹאכַל
  choice: dan melalap / lalu melalap
  rationale: Ketika api menjadi subjek, אכל secara alami berarti 'melalap' atau 'menghanguskan'. 'Melalap' mempertahankan gambaran api yang menghancurkan dan terdengar alami dalam bahasa Indonesia.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: para pemimpin Sikhem
  rationale: Dalam konteks kota, bentuk jamak בַּעֲלֵי menunjuk kepada orang-orang terkemuka atau berkuasa di Sikhem, bukan sekadar seluruh penduduknya. 'Para pemimpin' jelas bagi pembaca modern, sedangkan alternatif harfiahnya dicatat dalam catatan kaki.
- source_word: בֵּית מִלּוֹא
  choice: Bet-Milo
  rationale: Bentuk ini diperlakukan sebagai nama tempat atau kelompok yang dikenal dan ditransliterasikan mengikuti bentuk nama Ibrani yang lazim dalam bahasa Indonesia. Kemungkinan arti harfiahnya dipertahankan dalam catatan kaki.
- source_word: מֵאֲבִימֶלֶךְ / מִבַּעֲלֵי שְׁכֶם וּמִבֵּית מִלּוֹא
  choice: dari Abimelekh / dari para pemimpin Sikhem dan dari Bet-Milo
  rationale: 'Pengulangan ''dari'' mempertahankan struktur kutuk timbal balik: kehancuran keluar dari Abimelekh menuju pihak Sikhem, lalu dari pihak Sikhem menuju Abimelekh.'
theological_decisions:
- issue: Sifat gambaran 'api'
  choice: Mempertahankan 'api' sebagai gambaran konkret dalam ucapan kutuk tanpa menjelaskan dalam teks utama apakah api itu harfiah atau metaforis.
  alternative: Menafsirkannya secara eksplisit sebagai konflik bersenjata atau sebagai api penghukuman ilahi.
  rationale: Teks Ibrani membiarkan gambaran tersebut terbuka. Konteks mengarah kepada kehancuran timbal balik, tetapi terjemahan tidak boleh meniadakan ketegangan antara makna harfiah dan kiasan.
- issue: Daya ujar bentuk jusif
  choice: Menerjemahkan dengan 'biarlah' sebagai kutuk atau seruan.
  alternative: 'Menerjemahkan sebagai kepastian masa depan: ''api akan keluar''.'
  rationale: Bentuk verbal dan konteks pidato Yotam mendukung daya jusif. Pilihan ini tidak memaksakan apakah ucapan itu sekaligus berfungsi sebagai nubuat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama-nama ditulis sebagai Abimelekh, Sikhem, dan Bet-Milo. Paralelisme kutuk timbal balik dipertahankan melalui pengulangan 'biarlah api keluar' dan frasa sumber 'dari'.
