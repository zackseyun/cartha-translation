base_translation:
  language: en
  yaml_path: translation/ot/judges/009/029.yaml
  text: If only this people were in my hand[a], then I would remove Abimelek. And he said to Abimelek[b], “Increase your army and come out!”
translation:
  language: id
  text: “Seandainya rakyat ini diserahkan ke tanganku[a], aku akan menyingkirkan Abimelekh.” Lalu ia berkata kepada Abimelekh[b], “Perbanyaklah pasukanmu dan keluarlah!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Siapa yang akan menyerahkan rakyat ini ke tanganku? Aku akan menyingkirkan Abimelekh.” Ungkapan Ibrani “Siapa yang akan memberikan ...?” menyatakan suatu harapan.'
    reason: lexical_alternative
  - marker: b
    text: Tantangan “Perbanyaklah pasukanmu dan keluarlah!” tampaknya ditujukan kepada Abimelekh sebagai ejekan, entah disampaikan langsung kepadanya atau diucapkan secara retoris.
    reason: cultural_note
lexical_decisions:
- source_word: וּמִי יִתֵּן
  choice: Seandainya ... diserahkan
  rationale: Ungkapan harfiah ‘Siapa yang akan memberikan ...?’ menyatakan suatu harapan. ‘Seandainya ... diserahkan’ menyampaikan daya optatifnya secara wajar dalam bahasa Indonesia modern.
- source_word: הָעָם הַזֶּה
  choice: rakyat ini
  rationale: עָם menunjuk kepada kelompok orang sebagai satu kesatuan. ‘Rakyat ini’ alami dalam konteks perebutan kekuasaan dan tidak mempersempit maknanya menjadi pasukan saja.
- source_word: בְּיָדִי
  choice: ke tanganku
  rationale: Terjemahan ini mempertahankan metafora Ibrani tentang tangan sebagai lambang kekuasaan atau kendali, dan tetap mudah dipahami dalam bahasa Indonesia.
- source_word: וְאָסִירָה
  choice: aku akan menyingkirkan
  rationale: Bentuk kausatif dari סוּר berarti menyingkirkan atau membuang. Pilihan ini mempertahankan keluasan ancamannya tanpa memastikan apakah yang dimaksud adalah membunuh, mengusir, atau melengserkan.
- source_word: וַיֹּאמֶר לַאֲבִימֶלֶךְ
  choice: Lalu ia berkata kepada Abimelekh
  rationale: Preposisi ל paling langsung menandai pihak yang dituju. Terjemahan ini tidak memastikan apakah ucapan itu disampaikan langsung atau merupakan tantangan retoris.
- source_word: רַבֶּה צְבָאֲךָ
  choice: Perbanyaklah pasukanmu
  rationale: Imperatif רבה meminta agar jumlah atau kekuatan צָבָא ditambah. ‘Perbanyaklah pasukanmu’ merupakan tantangan militer yang jelas dan alami.
- source_word: וָצֵאָה
  choice: dan majulah
  rationale: יצא secara dasar berarti keluar. Dalam tantangan terhadap lawan untuk bertempur, ‘majulah’ menyampaikan maksud kontekstualnya dengan alami tanpa menambah hasil pertempuran.
