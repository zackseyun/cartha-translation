  yaml_path: translation/ot/judges/009/055.yaml
  text: When the men of Israel saw that Abimelech was dead[a], each went to his own place.
translation:
  language: id
  text: Ketika orang-orang Israel melihat bahwa Abimelekh sudah mati, mereka masing-masing pergi ke tempatnya sendiri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bagian akhir berbunyi, “masing-masing ke tempatnya.” Bentuk tunggal “masing-masing” membagikan tindakan itu kepada setiap orang dalam kelompok tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: melihat
  rationale: Bentuk naratif dari ראה menyatakan penglihatan yang menghasilkan pengenalan; “melihat” mempertahankan ungkapan Ibrani dan alami dalam konteks ini.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: orang-orang Israel
  rationale: Walaupun אִישׁ berbentuk tunggal, verba jamak menunjukkan bahwa ungkapan ini bersifat kolektif. “Orang-orang Israel” menyampaikan kelompok yang dimaksud secara wajar dalam bahasa Indonesia.
- source_word: כִּי
  choice: bahwa
  rationale: כִּי memperkenalkan isi yang mereka lihat atau ketahui, yaitu keadaan Abimelekh.
- source_word: מֵת
  choice: sudah mati
  rationale: Kata ini menggambarkan keadaan Abimelekh sebagai orang yang telah mati pada saat hal itu dilihat. “Sudah mati” merupakan ungkapan Indonesia yang alami dan tetap berfokus pada keadaan tersebut.
- source_word: אֲבִימֶלֶךְ
  choice: Abimelekh
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: וַיֵּלְכוּ
  choice: pergi
  rationale: הלך dalam rangkaian naratif ini berarti “pergi”; menerjemahkannya sebagai “pulang” akan menambahkan gagasan yang tidak dinyatakan secara eksplisit.
- source_word: אִישׁ לִמְקֹמוֹ
  choice: mereka masing-masing pergi ke tempatnya sendiri
  rationale: אִישׁ sesudah verba jamak berfungsi secara distributif, sedangkan מָקוֹם berarti “tempat,” bukan secara khusus “rumah.” Susunan ini menyampaikan kedua unsur tersebut secara alami.
