source:
  edition: WLC
  text: וְ/אִם בֶּ/אֱמֶ֨ת וּ/בְ/תָמִ֧ים עֲשִׂיתֶ֛ם עִם יְרֻבַּ֥עַל וְ/עִם בֵּית֖/וֹ הַ/יּ֣וֹם הַ/זֶּ֑ה שִׂמְחוּ֙ בַּ/אֲבִימֶ֔לֶךְ וְ/יִשְׂמַ֥ח גַּם ה֖וּא בָּ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/019.yaml
  text: And if today you have acted in truth and integrity toward Jerubbaal and toward his house[a], rejoice in Abimelech[c][b], and let him also rejoice in you.
translation:
  language: id
  text: Dan jika pada hari ini kalian telah bertindak dengan setia dan tulus terhadap Yerubaal dan keluarganya[a], bersukacitalah karena Abimelekh, dan biarlah ia juga bersukacita karena kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rumahnya”; ungkapan ini dapat berarti rumah tangga, keluarga, atau garis keturunannya.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִם
  choice: Dan jika
  rationale: Mempertahankan kata penghubung dan unsur persyaratan yang meneruskan retorika bersyarat dalam pidato Yotam.
- source_word: בֶּאֱמֶת וּבְתָמִים
  choice: dengan setia dan tulus
  rationale: אֱמֶת dalam konteks hubungan dapat menyatakan kesetiaan atau kelurusan, sedangkan תָמִים menyatakan keutuhan moral atau ketulusan. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan dua unsur etik yang sejajar.
- source_word: עֲשִׂיתֶם עִם
  choice: kalian telah bertindak ... terhadap
  rationale: Menyampaikan idiom Ibrani 'berbuat dengan/terhadap' sebagai tindakan atau perlakuan kepada seseorang; bentuk 'kalian' mempertahankan orang kedua jamak.
- source_word: יְרֻבַּעַל
  choice: Yerubaal
  rationale: Nama diri ditransliterasikan dalam bentuk yang wajar bagi pembaca Indonesia.
- source_word: בֵּיתוֹ
  choice: keluarganya
  rationale: בַּיִת di sini menunjuk bukan terutama kepada bangunan, melainkan rumah tangga, keluarga, atau garis keturunan Yerubaal, sebagaimana ditunjukkan oleh konteks pembunuhan anak-anaknya.
- source_word: הַיּוֹם הַזֶּה
  choice: pada hari ini
  rationale: Menerjemahkan frasa demonstratif temporal secara jelas dan cukup formal, sekaligus mempertahankan tekanannya.
- source_word: שִׂמְחוּ בַּאֲבִימֶלֶךְ
  choice: bersukacitalah karena Abimelekh
  rationale: Kata depan ב dengan שׂמח dapat menandai orang yang menjadi alasan atau objek sukacita. 'Karena' terdengar alami dalam bahasa Indonesia tanpa meniadakan nuansa relasionalnya.
- source_word: וְיִשְׂמַח גַּם הוּא בָּכֶם
  choice: dan biarlah ia juga bersukacita karena kalian
  rationale: Bentuk imperfek sesudah imperatif dipahami berjussif. 'Biarlah' mempertahankan dorongan atau harapan timbal balik, bukan mengubahnya menjadi pernyataan masa depan biasa.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk 'kalian' dipakai untuk menandai bahwa sapaan Ibrani berbentuk jamak. Nada ironis-retoris ayat dipertahankan melalui susunan bersyarat dan dua perintah sukacita yang timbal balik.
