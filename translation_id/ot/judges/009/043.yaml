  naturalness: Teks revisi mempertahankan gaya naratif baku dan lugas. “Bersembunyi untuk menyergap di ladang” secara alami menyatakan tindakan menanti dalam ambush, dan “bangkit melawan mereka serta memukul mereka” tidak menambahkan hasil yang tidak dinyatakan sumber.
