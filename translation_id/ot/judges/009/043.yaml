  to: Ia mengambil orang-orang itu, membagi mereka menjadi tiga kelompok[a], lalu bersembunyi untuk menyergap di ladang. Ketika ia melihat orang-orang itu keluar dari kota, ia bangkit melawan mereka serta memukul mereka.
