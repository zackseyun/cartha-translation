base_translation:
  language: en
  yaml_path: translation/ot/judges/009/043.yaml
  text: He took the people[a], divided them into three companies, and lay in wait in the field. When he saw that the people were coming out of the city, he rose up against them and struck them down.
translation:
  language: id
  text: Ia mengambil orang-orang itu, membagi mereka menjadi tiga kelompok[a], lalu bersembunyi untuk menyergap di ladang. Ketika ia melihat orang-orang itu keluar dari kota, ia bangkit melawan mereka serta memukul mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menjadi tiga kepala”; ini adalah ungkapan Ibrani untuk pembagian menjadi tiga kelompok atau satuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח אֶת הָעָם
  choice: Ia membawa orang-orangnya
  rationale: עָם secara harfiah berarti “rakyat/orang-orang,” tetapi dalam konteks militer ini menunjuk kepada pasukan yang menyertai Abimelekh. “Orang-orangnya” alami dalam bahasa Indonesia dan tidak mempersempitnya menjadi tentara profesional.
- source_word: וַיֶּחֱצֵם לִשְׁלֹשָׁה רָאשִׁים
  choice: membagi mereka menjadi tiga pasukan
  rationale: חצה berarti “membagi,” sedangkan רָאשִׁים (“kepala-kepala”) merupakan ungkapan bagi kelompok atau satuan. “Pasukan” sesuai dengan konteks penyerangan.
- source_word: וַיֶּאֱרֹב בַּשָּׂדֶה
  choice: lalu menghadang di ladang
  rationale: ארב menyatakan tindakan menunggu secara tersembunyi untuk menyergap. “Menghadang” menyampaikan maksud taktisnya secara wajar, sementara “di ladang” mempertahankan lokasi yang disebutkan.
- source_word: וַיַּרְא וְהִנֵּה
  choice: Ketika ia melihat
  rationale: Rangkaian naratif dengan הִנֵּה memberi kesan pengamatan langsung. “Ketika ia melihat” menyampaikannya secara alami tanpa menerjemahkan הִנֵּה secara kaku sebagai “lihatlah.”
- source_word: הָעָם יֹצֵא מִן־הָעִיר
  choice: orang-orang keluar dari kota
  rationale: Partisipel יֹצֵא menggambarkan tindakan yang sedang diamati. Dalam konstruksi Indonesia setelah “melihat,” bentuk “orang-orang keluar” secara alami menyatakan kejadian yang terlihat sedang berlangsung.
- source_word: וַיָּקָם עֲלֵיהֶם
  choice: ia bangkit menyerang mereka
  rationale: קום על berarti bangkit melawan atau menyerang. Gabungan “bangkit menyerang” mempertahankan citra verba sekaligus memperjelas tindakan bermusuhan.
- source_word: וַיַּכֵּם
  choice: dan menewaskan mereka
  rationale: נכה memiliki rentang arti memukul, menghantam, mengalahkan, atau membunuh. Dalam adegan serangan bersenjata ini, “menewaskan” menyatakan hasil kekerasan secara alami, meskipun bentuk yang lebih netral tetap mungkin.
