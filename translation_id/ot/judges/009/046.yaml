id: JDG.9.46
reference: Judges 9:46
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יִּשְׁמְע֔וּ כָּֽל בַּעֲלֵ֖י מִֽגְדַּל שְׁכֶ֑ם וַ/יָּבֹ֣אוּ אֶל צְרִ֔יחַ בֵּ֖ית אֵ֥ל בְּרִֽית־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/046.yaml
  text: When all the leaders of the tower of Shechem heard it[c][b][a], they went into the inner chamber of the house of El-berith.
translation:
  language: id
  text: Ketika semua pemuka Menara Sikhem[a] mendengar hal itu, mereka masuk ke ruang bagian dalam[b] rumah El-Berit.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Migdal-Sikhem”, jika frasa ini dipahami sebagai nama tempat, bukan “Menara Sikhem”.
    reason: alternative_reading
  - marker: b
    text: Istilah Ibrani ini juga dapat diterjemahkan “ruang berkubah”, “kubu”, atau “ruang terlindung”.
    reason: lexical_alternative
  - marker: c
    text: El-Berit dapat berarti “Allah Perjanjian”. Bandingkan nama terkait “Baal-Berit” di bagian lain pasal ini.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: mendengar hal itu
  rationale: Kata kerjanya berarti “mendengar”; “hal itu” dipasok secara wajar dari konteks peristiwa sebelumnya tanpa menentukan lebih jauh isi kabar tersebut.
- source_word: בַּעֲלֵי
  choice: pemuka
  rationale: Secara harfiah berarti “tuan-tuan” atau “orang-orang yang berkuasa”; dalam konteks kemasyarakatan ini, “pemuka” menyampaikan kedudukan para tokoh utama dengan bahasa Indonesia yang alami.
- source_word: מִגְדַּל שְׁכֶם
  choice: Menara Sikhem
  rationale: מִגְדַּל berarti “menara”. Bentuk ini mempertahankan kemungkinan bahwa frasa tersebut merupakan sebutan bangunan atau nama tempat; kemungkinan nama tempat dijelaskan dalam catatan kaki.
- source_word: וַיָּבֹאוּ אֶל
  choice: mereka masuk ke
  rationale: Gabungan kata kerja gerak dan preposisi di sini menunjukkan gerakan menuju serta memasuki tempat perlindungan yang disebut sesudahnya.
- source_word: צְרִיחַ
  choice: ruang bagian dalam
  rationale: Istilah ini menunjuk pada ruang interior yang terlindung, tetapi bentuk arsitekturnya tidak pasti; terjemahan ini tidak mempersempit maknanya menjadi ruang bawah tanah atau kubah.
- source_word: בֵּית אֵל בְּרִית
  choice: rumah El-Berit
  rationale: בֵּית secara harfiah berarti “rumah” dan dapat menunjuk pada kuil. Transliterasi “El-Berit” mempertahankan nama atau gelar Ibrani tanpa menyamakannya dengan Baal-Berit berdasarkan konteks sekitar.
theological_decisions:
- issue: Penerjemahan nama atau gelar kultis אֵל בְּרִית
  choice: El-Berit
  alternative: Allah Perjanjian; Baal-Berit
  rationale: Transliterasi mempertahankan ketidakpastian apakah ungkapan ini berfungsi sebagai nama ilahi atau gelar yang berarti “Allah Perjanjian”, serta menghindari harmonisasi dengan nama Baal-Berit dalam bagian lain pasal ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang jelas dan bermartabat. “Pemuka” dipilih untuk peran sosial-politik; “ruang bagian dalam” mempertahankan ketidakpastian arsitektural; nama “El-Berit” ditransliterasikan agar ambiguitas sumber tetap terjaga.
