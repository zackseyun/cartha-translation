  source_fidelity: 'Teks dengan setia menerjemahkan unsur-unsur Ibrani: וַיִּשְׁמְעוּ sebagai “mendengar hal itu” dengan objek yang dipahami dari konteks; בַּעֲלֵי sebagai “pemuka”; מִגְדַּל שְׁכֶם sebagai “Menara Sikhem”; צְרִיחַ secara hati-hati sebagai “ruang bagian dalam”; dan בֵּית אֵל בְּרִית sebagai “rumah El-Berit.” Tidak ada harmonisasi yang tidak didukung sumber dengan Baal-Berit.'
