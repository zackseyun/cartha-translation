base_translation:
  language: en
  yaml_path: translation/ot/judges/009/050.yaml
  text: Then Abimelech went to Thebez[a], camped against Thebez, and captured it.
translation:
  language: id
  text: Kemudian Abimelekh pergi ke Tebes, berkemah di dekat Tebes[a], lalu merebutnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “berkemah di Tebes.” Dalam konteks militer, frasa ini juga dapat dipahami sebagai berkemah di dekat atau terhadap Tebes.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: pergi
  rationale: Bentuk naratif dari הלך secara wajar berarti ‘pergi’; ‘bergerak maju’ atau ‘berbaris’ akan menambahkan nuansa militer yang tidak dinyatakan oleh verba itu sendiri.
- source_word: אֲבִימֶלֶךְ
  choice: Abimelekh
  rationale: Nama pribadi ditransliterasikan secara konsisten dengan bentuk Ibrani dan konvensi Indonesia.
- source_word: אֶל תֵּבֵץ
  choice: ke Tebes
  rationale: Preposisi אֶל terutama menyatakan arah atau tujuan gerak. Sikap bermusuhan tampak dari konteks pengepungan dan perebutan kota.
- source_word: וַיִּחַן בְּתֵבֵץ
  choice: berkemah mengepung Tebes
  rationale: חנה berarti berkemah. Dalam konteks operasi militer terhadap sebuah kota, בְּ dapat menunjukkan perkemahan di dekat atau terhadap kota itu; ‘berkemah mengepung’ menyampaikan fungsi militernya secara alami tanpa menyatakan bahwa pasukan sudah berada di dalam kota.
- source_word: וַיִּלְכְּדָהּ
  choice: lalu merebut kota itu
  rationale: לכד lazim dipakai untuk merebut atau menaklukkan kota. Pronomina feminin merujuk kepada Tebes sebagai kota; penyebutan ‘kota itu’ membuat rujukannya jelas dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. ‘Mengepung’ dipakai untuk memperjelas hubungan militer antara perkemahan dan kota, sedangkan catatan kaki mempertahankan kemungkinan terjemahan preposisi Ibrani yang lebih harfiah.
