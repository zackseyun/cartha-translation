base_translation:
  language: en
  yaml_path: translation/ot/judges/009/024.yaml
  text: so that the violence done to the seventy sons of Jerubbaal might come[a], and their blood be laid on Abimelech their brother, who killed them, and on the leaders of Shechem[c][b], who strengthened his hands to kill his brothers.
translation:
  language: id
  text: supaya kekerasan yang dilakukan terhadap tujuh puluh anak laki-laki Yerubaal itu dibalaskan, dan darah mereka ditanggungkan kepada Abimelekh, saudara mereka, yang telah membunuh mereka, serta kepada para pemuka Sikhem, yang telah menguatkan tangannya untuk membunuh saudara-saudara laki-lakinya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָבוֹא חֲמַס
  choice: kekerasan ... berbalik kepada para pelakunya
  rationale: Secara harfiah ungkapan ini menyatakan bahwa kekerasan itu “datang”. Dalam konteks akibat ilahi pada ayat sebelumnya dan penyebutan pihak-pihak yang bertanggung jawab sesudahnya, “berbalik kepada para pelakunya” menyampaikan arah akibat tersebut dalam bahasa Indonesia yang alami tanpa mengubah kekerasan menjadi sekadar gagasan abstrak tentang kesalahan.
- source_word: שִׁבְעִים בְּנֵי יְרֻבָּעַל
  choice: ketujuh puluh anak Yerubaal
  rationale: Rantai konstruksi diterjemahkan langsung; בני di sini menunjuk kepada anak-anak lelaki Yerubaal, tetapi konteks dan bentuk nama diri membuat “anak” cukup jelas dan alami dalam bahasa Indonesia.
- source_word: וְדָמָם לָשׂוּם עַל
  choice: darah mereka ditanggungkan kepada
  rationale: “Darah mereka” mempertahankan metonimia Ibrani bagi tanggung jawab atas penumpahan darah. “Ditanggungkan kepada” menyampaikan tindakan menaruh atau membebankan darah itu pada pihak yang bersalah.
- source_word: אֲבִימֶלֶךְ אֲחִיהֶם
  choice: Abimelekh, saudara mereka
  rationale: Frasa aposisional dipertahankan untuk menonjolkan ironi dan beratnya tindakan Abimelekh terhadap saudara-saudaranya sendiri.
- source_word: אֲשֶׁר הָרַג אוֹתָם
  choice: yang telah membunuh mereka
  rationale: הרג adalah verba umum untuk membunuh. Bentuk “telah membunuh” wajar dalam urutan narasi Indonesia dan tidak menambahkan klasifikasi hukum yang tidak tersurat dalam leksem.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: para pemuka Sikhem
  rationale: Dalam konteks kota, בעלי menunjuk kepada orang-orang yang berkuasa atau terkemuka, bukan seluruh penduduk. “Para pemuka” menyampaikan kedudukan sosial-politik itu secara alami.
- source_word: חִזְּקוּ אֶת יָדָיו
  choice: menguatkan tangannya
  rationale: Citra Ibrani dipertahankan dalam teks utama. Maksud idiomatisnya ialah memberi dukungan atau bantuan kepada Abimelekh.
- source_word: לַהֲרֹג אֶת אֶחָיו
  choice: untuk membunuh saudara-saudaranya
  rationale: Infinitif tujuan diterjemahkan langsung. Bentuk jamak “saudara-saudaranya” secara kontekstual menunjuk kepada saudara laki-laki Abimelekh.
theological_decisions:
- issue: Gambaran pertanggungjawaban atas darah yang tertumpah
  choice: Mempertahankan “darah mereka ditanggungkan kepada”
  alternative: kesalahan atas penumpahan darah mereka dibebankan kepada
  rationale: Teks Ibrani memakai “darah” secara metonimis dan yudisial. Mempertahankan gambaran darah menjaga daya teologis dan ketegangan ungkapan sumber tanpa menjelaskannya secara berlebihan sebagai konsep hukum semata.
- issue: Arah datangnya akibat kekerasan
  choice: “berbalik kepada para pelakunya” dengan catatan bentuk harfiah
  alternative: “datang” atau “mendapat balasan”
  rationale: Konteks menyatakan bahwa akibat kekerasan kembali kepada pihak-pihak yang bertanggung jawab, tetapi teks tidak secara eksplisit memakai kata “pembalasan”. Pilihan ini menghindari penambahan istilah teologis yang lebih khusus sambil membuat hubungan sintaksis dapat dipahami.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Nama diri mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia, dengan ejaan “Abimelekh” yang mencerminkan konsonan akhir nama Ibrani. Citra “darah ditanggungkan” dan “menguatkan tangannya” dipertahankan, sedangkan catatan kaki menjelaskan idiom agar tetap mudah dipahami.
