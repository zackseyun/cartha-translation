    rationale: Ibrani לָבוֹא חֲמַס menyebut kekerasan itu ‘datang’; identifikasi Abimelekh dan para pemuka Sikhem muncul dalam klausa berikutnya tentang darah. Terjemahan sebaiknya tidak memajukan atau menambahkan unsur tersebut ke klausa pertama.
  - severity: low
    issue: “ketujuh puluh anak Yerubaal” tidak menyatakan secara eksplisit bahwa בני adalah anak-anak laki-laki.
    rationale: Konteks jelas, tetapi “anak laki-laki” memberi padanan yang lebih tepat bagi בני tanpa mengurangi kelancaran.
  revised_text: supaya kekerasan yang dilakukan terhadap tujuh puluh anak laki-laki Yerubaal itu dibalaskan, dan darah mereka ditanggungkan kepada Abimelekh, saudara mereka, yang telah membunuh mereka, serta kepada para pemuka Sikhem, yang telah menguatkan tangannya untuk membunuh saudara-saudara laki-lakinya.
