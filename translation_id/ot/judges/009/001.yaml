  source_fidelity: 'Terjemahan pada umumnya setia pada teks Ibrani: Abimelekh pergi ke Sikhem, mendatangi saudara-saudara laki-laki ibunya, lalu berbicara kepada mereka dan seluruh kelompok kekerabatan pihak ibu. Namun, "keluarga ayah ibunya" dapat terbaca tidak jelas dalam bahasa Indonesia, seolah-olah merujuk kepada keluarga ayah dan ibu secara umum, bukan kepada keluarga kakek dari pihak ibu.'
  naturalness: Bahasanya baku dan mengalir. "Menemui saudara-saudara laki-laki ibunya" merupakan pengungkapan alami. Penggantian frasa kekerabatan terakhir dengan "kaum keluarga kakeknya dari pihak ibu" membuat acuannya jelas dan tetap sesuai register.
