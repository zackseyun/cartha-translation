  text: וַ/יֵּ֨לֶךְ אֲבִימֶ֤לֶךְ בֶּן יְרֻבַּ֨עַל֙ שְׁכֶ֔מָ/ה אֶל אֲחֵ֖י אִמּ֑/וֹ וַ/יְדַבֵּ֣ר אֲלֵי/הֶ֔ם וְ/אֶל כָּל מִשְׁפַּ֛חַת בֵּית אֲבִ֥י אִמּ֖/וֹ לֵ/אמֹֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/001.yaml
  text: Abimelech son of Jerubbaal went to Shechem[a], to his mother's brothers, and spoke to them and to the whole clan of his mother's father's house, saying,
translation:
  language: id
  text: Abimelekh, anak Yerubaal, pergi ke Sikhem menemui saudara-saudara laki-laki ibunya. Ia berbicara kepada mereka dan kepada seluruh kaum keluarga kakeknya dari pihak ibu[a], katanya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rumah ayah ibunya”; ungkapan ini menunjuk rumah tangga atau garis keturunan kakeknya dari pihak ibu.
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: pergi
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; bahasa Indonesia tidak memerlukan kata penghubung tambahan di awal ayat.
- source_word: אֲבִימֶלֶךְ בֶּן יְרֻבַּעַל
  choice: Abimelekh, anak Yerubaal
  rationale: Nama-nama ditransliterasikan, sedangkan בֶּן diterjemahkan secara langsung sebagai 'anak'.
- source_word: שְׁכֶמָה
  choice: ke Sikhem
  rationale: Akhiran penunjuk arah pada nama tempat menyatakan gerak menuju Sikhem.
- source_word: אֶל אֲחֵי אִמּוֹ
  choice: menemui saudara-saudara laki-laki ibunya
  rationale: אֲחֵי secara harfiah berarti saudara-saudara laki-laki; dalam hubungan ini mereka adalah paman-paman dari pihak ibu. 'Menemui' secara alami menyampaikan gerak kepada orang-orang tersebut tanpa mengubah hubungan kekerabatannya.
- source_word: וַיְדַבֵּר אֲלֵיהֶם
  choice: Ia berbicara kepada mereka
  rationale: דבר berarti berbicara; kalimat baru menghindari rangkaian konjungsi yang kaku dalam bahasa Indonesia.
- source_word: וְאֶל כָּל מִשְׁפַּחַת
  choice: dan kepada seluruh kaum
  rationale: מִשְׁפָּחָה menunjuk kelompok kekerabatan yang lebih luas daripada keluarga inti; 'kaum' sesuai dengan satuan sosial tersebut.
- source_word: בֵּית אֲבִי אִמּוֹ
  choice: dari keluarga ayah ibunya
  rationale: Ungkapan harfiah 'rumah ayah ibunya' menunjuk rumah tangga atau garis keturunan keluarga dari pihak ibu. 'Keluarga ayah ibunya' mempertahankan relasi kekerabatan dan terdengar alami.
- source_word: לֵאמֹר
  choice: katanya,
  rationale: Infinitif ini memperkenalkan perkataan langsung yang berlanjut pada ayat berikutnya.
