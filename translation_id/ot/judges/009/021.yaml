base_translation:
  language: en
  yaml_path: translation/ot/judges/009/021.yaml
  text: Then Jotham fled and escaped and went to Beer[a], and he lived there away from Abimelech his brother.
translation:
  language: id
  text: Lalu Yotam melarikan diri dan lolos; ia pergi ke Beer[a] dan tinggal di sana, jauh dari Abimelekh, saudaranya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Beera.” Nama tempat Ibrani בְּאֵרָה dapat ditransliterasikan sebagai “Beer” atau “Beera.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנָס
  choice: melarikan diri
  rationale: Kata kerja נוס menyatakan tindakan lari dari bahaya; “melarikan diri” alami dan tepat dalam narasi Indonesia.
- source_word: וַיִּבְרַח
  choice: luput
  rationale: Kata ברח kembali menyatakan pelarian. “Melarikan diri dan luput” mempertahankan dua kata kerja Ibrani yang berdekatan tanpa pengulangan yang kaku.
- source_word: בְּאֵרָה
  choice: Beer
  rationale: Nama tempat ditransliterasikan sebagai “Beer”; akhiran ־ָה di sini dapat dipahami sebagai penanda arah, yaitu ‘ke Beer’, bukan bagian nama tempat.
- source_word: וַיֵּשֶׁב שָׁם
  choice: tinggal di sana
  rationale: Dalam konteks ini ישב menunjukkan bahwa Yotam menetap atau berdiam di tempat tersebut; “tinggal di sana” adalah ungkapan modern dan wajar.
- source_word: מִפְּנֵי
  choice: jauh dari
  rationale: Ungkapan ini secara harfiah berkaitan dengan menjauh ‘dari hadapan’ seseorang. Dalam konteks pelarian, “jauh dari” menyampaikan pemisahan dari Abimelekh tanpa menambahkan secara eksplisit motif ketakutan.
- source_word: אָחִיו
  choice: saudaranya
  rationale: Istilah kekerabatan dan sufiks orang ketiga tunggal dipertahankan untuk menonjolkan hubungan keluarga dalam konflik tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Nama יוֹתָם ditulis “Yotam” dan אֲבִימֶלֶךְ ditulis “Abimelekh” untuk mendekati bentuk Ibrani. Kalimat dipecah agar rangkaian tindakan terdengar alami dalam bahasa Indonesia, sementara penggandaan verba pelarian tetap dipertahankan.
