base_translation:
  language: en
  yaml_path: translation/ot/judges/009/053.yaml
  text: But a certain woman threw an upper millstone on Abimelech’s head and crushed his skull[a].
translation:
  language: id
  text: Namun, seorang perempuan melemparkan sebuah batu bagian atas dari sebuah kilangan ke kepala Abimelekh dan meremukkan tengkoraknya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebuah pecahan dari batu bagian atas sebuah kilangan”; ungkapan Ibraninya mungkin menekankan bagian atau pecahan batu kilangan atas itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּשְׁלֵךְ
  choice: melemparkan
  rationale: Verba שׁלך dalam bentuk naratif menyatakan tindakan melempar; pilihan ini mempertahankan daya aktifnya dan lebih tepat daripada 'menjatuhkan'.
- source_word: אִשָּׁה אַחַת
  choice: seorang perempuan
  rationale: Secara harfiah berarti 'satu perempuan', tetapi dalam narasi Ibrani berfungsi wajar sebagai penyebutan seorang tokoh yang tidak disebut namanya.
- source_word: פֶּלַח רֶכֶב
  choice: batu kilangan bagian atas
  rationale: רֶכֶב menunjuk pada batu kilangan atas, sedangkan פֶּלַח dapat menunjuk bagian atau kepingannya. Teks utama menyampaikan benda yang dimaksud secara alami; kemungkinan bahwa yang dilempar ialah pecahannya dicatat dalam catatan kaki.
- source_word: עַל רֹאשׁ
  choice: ke kepala
  rationale: Dalam konteks verba gerak 'melemparkan', bahasa Indonesia alami memakai 'ke' untuk sasaran, sambil tetap menyampaikan bahwa batu itu mengenai kepala.
- source_word: אֲבִימֶלֶךְ
  choice: Abimelekh
  rationale: Nama ditransliterasikan dengan bentuk yang mencerminkan konsonan akhir Ibrani dan lazim dipahami pembaca Indonesia.
- source_word: וַתָּרִץ
  choice: meremukkan
  rationale: Verba רצץ berarti meremukkan atau menghancurkan; 'meremukkan' mempertahankan kekuatan tindakan tanpa melebih-lebihkannya.
- source_word: גֻּלְגָּלְתּוֹ
  choice: tengkoraknya
  rationale: Nomina ini secara khusus berarti tengkorak, bukan sekadar kepala.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Namun' menghubungkan ayat ini dengan serangan sebelumnya tanpa terdengar kaku. Istilah 'batu kilangan bagian atas' dipilih demi ketepatan benda budaya kuno, sedangkan ambiguitas פֶּלַח dipertahankan dalam catatan kaki.
