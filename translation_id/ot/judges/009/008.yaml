base_translation:
  language: en
  yaml_path: translation/ot/judges/009/008.yaml
  text: The trees once went to anoint a king over themselves[a], and they said to the olive tree, ‘Reign over us.’
translation:
  language: id
  text: Pohon-pohon itu pergi untuk mengurapi seorang raja untuk memerintah mereka.[a] Mereka berkata kepada pohon zaitun, “Berkuasalah atas kami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani memakai infinitif absolut yang diikuti verba sejenis, suatu bentuk yang menegaskan tindakan "pergi". Dapat juga diterjemahkan, “Pohon-pohon itu benar-benar pergi” atau “Pohon-pohon itu berangkat untuk mengurapi seorang raja untuk memerintah mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלוֹךְ הָלְכוּ
  choice: berangkat
  rationale: Gabungan infinitif absolut dan verba finit dari הלך memberi penekanan pada tindakan pergi. Dalam bahasa Indonesia, “berangkat” secara wajar menyatakan bahwa pohon-pohon itu mulai pergi dengan suatu tujuan, tanpa meniru pengulangan Ibrani secara kaku.
- source_word: הָעֵצִים
  choice: pohon-pohon itu
  rationale: Bentuk jamak ini merujuk pada pohon-pohon yang dipersonifikasikan dalam perumpamaan Yotam. Penentu “itu” membuat rujukan naratifnya alami dalam bahasa Indonesia.
- source_word: לִמְשֹׁחַ
  choice: untuk mengurapi
  rationale: משׁח berarti mengurapi, khususnya dalam pelantikan seseorang ke dalam jabatan. “Mengurapi” mempertahankan gambaran konkret dan makna pelantikan kerajaan.
- source_word: עֲלֵיהֶם מֶלֶךְ
  choice: seorang raja atas mereka
  rationale: מֶלֶךְ bersifat tak tentu, sedangkan עַל menyatakan kekuasaan atas pihak yang diperintah. Susunan ini mempertahankan hubungan gramatikal dan makna pemerintahan.
- source_word: לַזַּיִת
  choice: kepada pohon zaitun
  rationale: זַיִת dapat berarti buah zaitun atau pohon zaitun; sebagai tokoh yang diajak memerintah dalam perumpamaan ini, yang dimaksud adalah pohonnya.
- source_word: מלוכה עָלֵינוּ
  choice: Jadilah raja atas kami
  rationale: Bentuk imperatif feminin dari מלך ditujukan kepada pohon zaitun. “Jadilah raja” mengungkapkan permintaan untuk menerima kedudukan kerajaan, sementara “atas kami” mempertahankan nuansa dominion dari עַל.
