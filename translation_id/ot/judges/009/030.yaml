  text: וַ/יִּשְׁמַ֗ע זְבֻל֙ שַׂר הָ/עִ֔יר אֶת דִּבְרֵ֖י גַּ֣עַל בֶּן עָ֑בֶד וַ/יִּ֖חַר אַפּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/030.yaml
  text: When Zebul[a], the ruler of the city, heard the words of Gaal son of Ebed, his anger burned.
translation:
  language: id
  text: Ketika Zebul, penguasa kota itu, mendengar perkataan Gaal anak Ebed, amarahnya menyala.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah dalam bahasa Ibrani: “hidungnya menyala,” sebuah ungkapan yang berarti “ia menjadi marah” atau “amarahnya menyala.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ketika ... mendengar
  rationale: Bentuk naratif berwaw memajukan alur. Dalam bahasa Indonesia, hubungan waktunya wajar dinyatakan dengan “ketika”; שׁמע di sini berarti mendengar ucapan Gaal, bukan menaati.
- source_word: זְבֻל
  choice: Zebul
  rationale: Nama diri ditransliterasikan dalam bentuk yang alami bagi pembaca Indonesia.
- source_word: שַׂר הָעִיר
  choice: penguasa kota itu
  rationale: שַׂר menunjuk pemimpin atau pejabat yang berwenang. “Penguasa” mempertahankan keluasan maknanya tanpa menentukan jabatan administratif modern secara berlebihan.
- source_word: אֶת דִּבְרֵי
  choice: perkataan
  rationale: דִּבְרֵי secara konkret berarti “kata-kata/perkataan”; bentuk tunggal kolektif “perkataan” alami dalam narasi Indonesia.
- source_word: גַּעַל בֶּן עָבֶד
  choice: Gaal anak Ebed
  rationale: Nama-nama ditransliterasikan, sedangkan patronimik בֶּן diterjemahkan secara langsung dan alami sebagai “anak”.
- source_word: וַיִּחַר אַפּוֹ
  choice: amarahnya menyala
  rationale: Ungkapan Ibrani secara harfiah menggambarkan hidung yang terbakar sebagai idiom kemarahan. “Amarahnya menyala” mempertahankan daya metaforisnya sekaligus jelas dalam bahasa Indonesia.
