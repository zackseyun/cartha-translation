  text: וַ/יִּכְרְת֨וּ גַם כָּל הָ/עָ֜ם אִ֣ישׁ שׂוֹכֹ֗/ה וַ/יֵּ֨לְכ֜וּ אַחֲרֵ֤י אֲבִימֶ֨לֶךְ֙ וַ/יָּשִׂ֣ימוּ עַֽל הַ/צְּרִ֔יחַ וַ/יַּצִּ֧יתוּ עֲלֵי/הֶ֛ם אֶֽת הַ/צְּרִ֖יחַ בָּ/אֵ֑שׁ וַ/יָּמֻ֜תוּ גַּ֣ם כָּל אַנְשֵׁ֧י מִֽגְדַּל שְׁכֶ֛ם כְּ/אֶ֖לֶף אִ֥ישׁ וְ/אִשָּֽׁה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/049.yaml
  text: So all the people also cut down a branch each[a], and they went after Abimelech and piled them against the inner chamber, and set the inner chamber on fire over them, so that all the people of the tower of Shechem also died[b], about a thousand men and women.
translation:
  language: id
  text: Maka seluruh rakyat itu juga masing-masing memotong sebatang dahan, lalu mengikuti Abimelekh. Mereka menumpuk dahan-dahan itu pada ruang perlindungan[a] dan membakar ruang itu di atas mereka. Demikianlah seluruh penghuni Menara Sikhem juga tewas, kira-kira seribu laki-laki dan perempuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kubu pertahanan.” Kata Ibrani ini tampaknya menunjuk pada tempat perlindungan tertutup di dalam kompleks menara, bukan seluruh menara itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְרְתוּ גַם כָּל־הָעָם אִישׁ שׂוֹכֹה
  choice: seluruh rakyat itu juga masing-masing memotong sebatang dahan
  rationale: Ungkapan distributif אִישׁ שׂוֹכֹה secara harfiah berarti 'masing-masing orang dahannya'. Susunan Indonesia ini mempertahankan bahwa setiap orang mengambil satu dahan tanpa terdengar kaku.
- source_word: וַיֵּלְכוּ אַחֲרֵי אֲבִימֶלֶךְ
  choice: lalu mengikuti Abimelekh
  rationale: Secara harfiah berarti 'berjalan di belakang Abimelekh', tetapi dalam konteks tindakan bersama maknanya adalah mengikuti teladan atau pimpinan tindakannya.
- source_word: הַצְּרִיחַ
  choice: ruang perlindungan
  rationale: Istilah ini menunjuk pada bagian tertutup yang menjadi tempat berlindung di dalam kompleks menara, bukan menara secara keseluruhan; terjemahan ini juga membedakannya dari מִגְדַּל pada akhir ayat.
- source_word: וַיָּשִׂימוּ עַל הַצְּרִיחַ
  choice: Mereka menumpuk dahan-dahan itu pada ruang perlindungan
  rationale: עַל dapat berarti 'di atas' atau 'pada/menempel pada'. Dalam konteks pembakaran bangunan, 'pada' menjaga keluasan relasi spasial tanpa menetapkan secara berlebihan bahwa dahan hanya berada di atas atau di sampingnya.
- source_word: וַיַּצִּיתוּ עֲלֵיהֶם אֶת־הַצְּרִיחַ בָּאֵשׁ
  choice: membakar ruang itu di atas orang-orang yang ada di dalamnya
  rationale: Terjemahan ini mempertahankan daya spasial עֲלֵיהֶם ('di atas mereka') sekaligus menjelaskan rujukan pronomina yang dalam bahasa Indonesia akan terasa kabur.
- source_word: כָּל־אַנְשֵׁי מִגְדַּל שְׁכֶם
  choice: seluruh penghuni Menara Sikhem
  rationale: אַנְשֵׁי secara bentuk berarti 'orang-orang dari', dan konteks langsung kemudian menyebut laki-laki maupun perempuan. 'Penghuni' menyampaikan kelompok yang berlindung atau terkait dengan menara tanpa menimbulkan kesan hanya laki-laki.
- source_word: כְּאֶלֶף אִישׁ וְאִשָּׁה
  choice: kira-kira seribu laki-laki dan perempuan
  rationale: Prefiks כְּ menyatakan perkiraan, sedangkan pasangan אִישׁ וְאִשָּׁה secara alami diterjemahkan 'laki-laki dan perempuan'.
