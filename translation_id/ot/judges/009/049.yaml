  terminology: '"Abimelekh" dan "Sikhem" konsisten dengan bentuk yang lazim dalam Alkitab Indonesia. "Ruang perlindungan" dengan catatan alternatif "kubu pertahanan" membedakan הַצְּרִיחַ dari מִגְדַּל, tanpa mengklaim kepastian leksikal yang berlebihan. Catatan kaki terpasang pada istilah yang tepat.'
