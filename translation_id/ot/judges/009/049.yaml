translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang wajar dan bermartabat. Nama אֲבִימֶלֶךְ ditransliterasikan 'Abimelekh' untuk mencerminkan konsonan akhir Ibrani; שְׁכֶם ditulis 'Sikhem'. Istilah 'ruang perlindungan' dipilih agar dapat dipahami pembaca umum sambil mempertahankan pembedaan leksikal dari 'Menara Sikhem'.
