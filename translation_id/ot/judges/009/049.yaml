  verdict: revise
  source_fidelity: 'Terjemahan pada umumnya setia pada teks Ibrani: tindakan distributif memotong dahan, mengikuti Abimelekh, penempatan dahan pada/terhadap ruang perlindungan, kematian para penghuni Menara Sikhem, dan jumlah perkiraan semuanya terwakili. Namun, frasa "orang-orang yang ada di dalamnya" menambahkan penjelasan eksplisit yang tidak dinyatakan dalam ayat ini. Kata ganti עֲלֵיהֶם secara harfiah mempertahankan relasi spasial "di atas mereka"; konteks memang mendukung bahwa mereka berlindung di ruang itu, tetapi terjemahan sebaiknya tidak memperluasnya dalam teks utama.'
