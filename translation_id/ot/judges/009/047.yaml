  yaml_path: translation/ot/judges/009/047.yaml
  text: And it was reported to Abimelech that all the leaders of the tower of Shechem had gathered together.
translation:
  language: id
  text: Lalu Abimelekh diberi tahu bahwa semua pemimpin Menara Sikhem telah berkumpul.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: diberi tahu
  rationale: Bentuk hofal wayyiqtol dari נגד menyatakan bahwa informasi itu disampaikan kepada Abimelekh; konstruksi pasif alami ini mempertahankan fokus teks.
- source_word: בַּעֲלֵי
  choice: pemimpin
  rationale: Dalam konteks kelompok penguasa atau tokoh kota, בַּעֲלֵי menunjuk para pemegang kedudukan, bukan 'tuan' dalam arti pemilik atau ilah.
- source_word: מִגְדַּל שְׁכֶם
  choice: Menara Sikhem
  rationale: Dipertahankan sebagai nama tempat atau komunitas yang terkait dengan sebuah menara di Sikhem, selaras dengan konteks ayat 46–49.
- source_word: הִתְקַבְּצוּ
  choice: telah berkumpul
  rationale: Bentuk hitpael perfektif menunjukkan bahwa mereka sudah berhimpun; 'telah' menyampaikan keadaan yang dilaporkan kepada Abimelekh.
theological_decisions: []
