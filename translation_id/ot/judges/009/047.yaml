  source_fidelity: Teks secara tepat menerjemahkan וַיֻּגַּד sebagai pemberitahuan pasif kepada Abimelekh, כָּל־בַּעֲלֵי sebagai semua pemimpin, dan הִתְקַבְּצוּ sebagai tindakan berkumpul yang telah terjadi. Relasi konstruksi מִגְדַּל שְׁכֶם dipertahankan dalam “Menara Sikhem.”
