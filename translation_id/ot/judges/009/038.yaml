translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang tegas. Bentuk ‘engkau/kau-’ dipakai karena percakapan ini bersifat langsung dan konfrontatif. Nama אַבִימֶלֶךְ ditransliterasikan ‘Abimelekh’ untuk mencerminkan konsonan akhir sumber.
