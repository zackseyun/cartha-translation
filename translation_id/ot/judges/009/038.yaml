base_translation:
  language: en
  yaml_path: translation/ot/judges/009/038.yaml
  text: Then Zebul said to him[a], “Where is your mouth now, you who said, ‘Who is Abimelech, that we should serve him?’ Is this not the people whom you despised? Go out now and fight against them.”
translation:
  language: id
  text: Lalu Zebul berkata kepadanya, “Di manakah mulutmu sekarang[a], engkau yang berkata, ‘Siapakah Abimelekh sehingga kita harus melayaninya?’ Bukankah ini orang-orang yang kaupandang rendah? Keluarlah sekarang dan berperanglah melawan mereka!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Di manakah mulutmu sekarang?” Ini adalah ejekan terhadap ucapan Gaal sebelumnya yang penuh keberanian.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיֵּה אֵפוֹא פִיךָ
  choice: Di manakah mulutmu sekarang
  rationale: Mempertahankan gambaran harfiah Ibrani sekaligus daya ejekannya; dalam konteks, ‘mulut’ menunjuk pada ucapan pongah Gaal sebelumnya.
- source_word: אֲשֶׁר תֹּאמַר
  choice: engkau yang berkata
  rationale: Klausa relatif ini menunjuk langsung kepada Gaal sebagai orang yang mengucapkan tantangan sebelumnya.
- source_word: מִי אֲבִימֶלֶךְ כִּי נַעַבְדֶנּוּ
  choice: Siapakah Abimelekh sehingga kita harus melayaninya?
  rationale: Menjaga bentuk pertanyaan retoris dan nada meremehkan; ‘melayani’ menyampaikan tindakan tunduk kepada penguasa tanpa mempersempitnya menjadi status budak.
- source_word: הֲלֹא זֶה הָעָם
  choice: Bukankah ini rakyat
  rationale: Mempertahankan pertanyaan retoris konfrontatif. ‘Rakyat’ cocok untuk kelompok pengikut atau pasukan Abimelekh yang disebut secara kolektif sebagai עָם.
- source_word: אֲשֶׁר מָאַסְתָּה בּוֹ
  choice: yang telah kauhina itu
  rationale: מָאַס menyatakan penolakan yang disertai rasa jijik atau penghinaan; ‘kauhina’ menangkap nada ejekan Zebul secara alami.
- source_word: צֵא נָא עַתָּה
  choice: Keluarlah sekarang
  rationale: Imperatif ini mendesak Gaal keluar menghadapi lawan. Partikel נָא di sini bersifat mendesak, bukan permohonan sopan.
- source_word: וְהִלָּחֶם בּוֹ
  choice: dan berperanglah melawan mereka
  rationale: Secara gramatikal pronomina Ibrani berbentuk maskulin tunggal karena merujuk kembali kepada kata kolektif הָעָם (‘rakyat’). Dalam bahasa Indonesia, ‘mereka’ secara alami merujuk kepada orang-orang dalam kelompok itu dan menghindari kesan bahwa lawannya hanya satu orang.
