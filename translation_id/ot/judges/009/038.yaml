  - severity: low
    issue: '"yang telah kauhina" untuk מָאַסְתָּ'
    rationale: Kata Ibrani ini terutama menyatakan memandang rendah, menolak, atau meremehkan. "Kaupandang rendah" lebih dekat kepada sikap penghinaan yang diejek Zebul dan tidak menambahkan gagasan tindakan penghinaan.
