  register: Bahasa Indonesia baku, modern, dan naratif. “Mengambil posisi” mempertahankan nuansa penempatan taktis. Terjemahan utama memakai “pasukan” demi kejelasan konteks, sementara bentuk harfiah teks Ibrani dicatat dalam catatan kaki.
