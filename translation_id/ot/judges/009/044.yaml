base_translation:
  language: en
  yaml_path: translation/ot/judges/009/044.yaml
  text: And Abimelech and the leaders who were with him rushed forward and took their stand at the entrance of the city gate[a], while the two other companies rushed against everyone who was in the field and struck them down.
translation:
  language: id
  text: Abimelekh dan pasukan yang bersamanya maju menyerang, lalu mengambil posisi di pintu gerbang kota, sedangkan kedua pasukan lainnya menyerbu semua orang yang berada di ladang dan memukul mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani secara harfiah menyebut “Abimelekh dan para pemimpin yang bersamanya” serta “kedua pemimpin.” Dalam konteks tiga kelompok yang disebut pada ayat sebelumnya, ungkapan itu mungkin menunjuk pada satu kelompok bersama Abimelekh dan dua kelompok pasukan yang tersisa.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּשְׁטוּ
  choice: bergerak menyerbu / menyerbu
  rationale: Dalam konteks gerakan militer, verba ini menunjuk pada gerak maju untuk menyerang, bukan sekadar menyebar.
- source_word: הָרָאשִׁים
  choice: pasukan
  rationale: Secara harfiah berarti “kepala-kepala” atau “para pemimpin,” tetapi konteks ayat 43—pasukan dibagi menjadi tiga kelompok—menunjukkan bahwa yang dimaksud di sini adalah kelompok-kelompok pasukan.
- source_word: וַיַּעַמְדוּ
  choice: mengambil posisi
  rationale: Ungkapan ini menyampaikan tindakan sengaja menempatkan diri pada posisi taktis, bukan hanya berdiri.
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: di pintu gerbang kota
  rationale: Frasa ini menunjuk pada bukaan atau jalan masuk gerbang kota; bentuk Indonesia ini alami dan mempertahankan lokasi konkret.
- source_word: עַל כָּל אֲשֶׁר בַּשָּׂדֶה
  choice: semua orang yang berada di ladang
  rationale: Pronomina objek pada verba berikutnya menunjukkan sasaran manusia; “semua orang” membuat rujukan itu jelas.
- source_word: וַיַּכּוּם
  choice: menewaskan mereka
  rationale: Dalam konteks serangan terhadap penduduk yang berada di ladang, נכה menyatakan tindakan memukul jatuh atau membunuh; “menewaskan” menyampaikan hasil mematikan secara wajar dalam bahasa Indonesia.
theological_decisions: []
