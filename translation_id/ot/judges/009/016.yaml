  text: וְ/עַתָּ֗ה אִם בֶּ/אֱמֶ֤ת וּ/בְ/תָמִים֙ עֲשִׂיתֶ֔ם וַ/תַּמְלִ֖יכוּ אֶת אֲבִימֶ֑לֶךְ וְ/אִם טוֹבָ֤ה עֲשִׂיתֶם֙ עִם יְרֻבַּ֣עַל וְ/עִם בֵּית֔/וֹ וְ/אִם כִּ/גְמ֥וּל יָדָ֖י/ו עֲשִׂ֥יתֶם לֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/016.yaml
  text: Now therefore[a], if you have acted in truth and integrity when you made Abimelech king, and if you have dealt well with Jerubbaal and with his house, and if you have dealt with him according to the recompense of his hands,
translation:
  language: id
  text: Maka sekarang, jika kalian telah bertindak dengan jujur dan berintegritas ketika mengangkat Abimelekh menjadi raja, jika kalian telah berbuat baik terhadap Yerubaal dan seisi rumahnya, dan jika kalian telah memperlakukannya sesuai dengan apa yang layak diterimanya atas perbuatannya[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sesuai dengan ganjaran perbuatan tangannya.” Idiom Ibrani ini menunjuk pada perlakuan yang setimpal dengan perbuatan seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Maka sekarang
  rationale: Menandai peralihan wacana sekaligus kesimpulan atau tantangan yang timbul dari perkataan Yotam sebelumnya.
- source_word: בֶּאֱמֶת וּבְתָמִים
  choice: dengan setia dan tulus
  rationale: 'Mengungkapkan kualitas moral tindakan: אֱמֶת menunjuk pada kesetiaan atau ketulusan yang dapat dipercaya, sedangkan תָמִים menunjuk pada keutuhan niat. Pasangan ini dibuat alami dalam bahasa Indonesia tanpa menghapus nuansa etikanya.'
- source_word: וַתַּמְלִיכוּ אֶת־אֲבִימֶלֶךְ
  choice: ketika mengangkat Abimelekh menjadi raja
  rationale: Bentuk kausatif מלך berarti membuat seseorang memerintah atau menjadi raja; 'mengangkat ... menjadi raja' merupakan ungkapan Indonesia yang jelas dan wajar.
- source_word: טוֹבָה עֲשִׂיתֶם עִם
  choice: kalian telah berbuat baik terhadap
  rationale: Menerjemahkan idiom 'melakukan yang baik terhadap' secara alami sambil mempertahankan penilaian moralnya.
- source_word: יְרֻבַּעַל
  choice: Yerubaal
  rationale: Mempertahankan nama yang benar-benar digunakan teks Ibrani, bukan menggantinya dengan Gideon.
- source_word: בֵּיתוֹ
  choice: keluarganya
  rationale: Dalam konteks ini בַּיִת menunjuk pada keluarga atau kaum Yerubaal, bukan bangunan rumah; 'keluarganya' paling mudah dipahami pembaca modern.
- source_word: כִּגְמוּל יָדָיו
  choice: sesuai dengan perbuatan tangannya
  rationale: Mempertahankan citraan konkret idiom Ibrani. Ungkapan itu berarti perlakuan yang setimpal dengan apa yang telah dilakukan atau dihasilkan oleh tangan seseorang.
- source_word: עֲשִׂיתֶם לוֹ
  choice: kalian telah memperlakukannya
  rationale: Menyampaikan arti relasional 'melakukan kepadanya' dalam bahasa Indonesia yang alami dan sesuai dengan konteks evaluatif.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan jamak 'kalian' dipakai karena verba-verba Ibrani berbentuk orang kedua jamak. Ayat dibiarkan berakhir dengan koma karena rangkaian syarat retoris Yotam berlanjut ke ayat berikutnya.
