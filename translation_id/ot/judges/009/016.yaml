  to: Maka sekarang, jika kalian telah bertindak dengan jujur dan berintegritas ketika mengangkat Abimelekh menjadi raja, jika kalian telah berbuat baik terhadap Yerubaal dan seisi rumahnya, dan jika kalian telah memperlakukannya sesuai dengan apa yang layak diterimanya atas perbuatannya[a],
