  text: וַ/יְדַבְּר֨וּ אֲחֵֽי אִמּ֜/וֹ עָלָ֗י/ו בְּ/אָזְנֵי֙ כָּל בַּעֲלֵ֣י שְׁכֶ֔ם אֵ֥ת כָּל הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וַ/יֵּ֤ט לִבָּ/ם֙ אַחֲרֵ֣י אֲבִימֶ֔לֶךְ כִּ֥י אָמְר֖וּ אָחִ֥י/נוּ הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/003.yaml
  text: And his mother’s brothers spoke all these words about him in the hearing of all the leaders of Shechem[a], and their hearts turned after Abimelech, for they said[b], “He is our brother.”
translation:
  language: id
  text: Lalu saudara-saudara laki-laki ibunya menyampaikan semua perkataan itu[a] tentang dia kepada semua pemimpin Sikhem.[b] Hati mereka pun berpihak kepada Abimelekh, sebab mereka berkata, “Dia saudara kita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semua hal itu” atau “semua perkara itu.” Kata Ibrani ini dapat berarti perkataan maupun hal-hal/perkara; di sini tampaknya menunjuk pada usul yang baru saja disampaikan.
    reason: lexical_alternative
  - marker: b
    text: Atau “semua penguasa Sikhem” atau “semua tokoh terkemuka Sikhem.” Ungkapan Ibrani ini menunjuk pada orang-orang berpengaruh di kota itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: menyampaikan
  rationale: Dalam konteks ini bentuk piel dengan objek 'semua perkataan itu' menunjuk pada penyampaian usul Abimelekh kepada para pemimpin Sikhem; 'menyampaikan' alami dalam bahasa Indonesia dan tidak menambahkan cara berbicara tertentu.
- source_word: אֲחֵי אִמּוֹ
  choice: saudara-saudara laki-laki ibunya
  rationale: Frasa konstruksi ini secara khusus menunjuk pada saudara kandung laki-laki dari ibu Abimelekh, bukan kerabat ibu secara umum.
- source_word: עָלָיו
  choice: tentang dia
  rationale: Preposisi ini paling langsung menyatakan bahwa pembicaraan itu mengenai Abimelekh. Kemungkinan nuansa 'demi kepentingannya' tidak dimasukkan ke dalam teks utama agar maksudnya tidak ditentukan secara berlebihan.
- source_word: בְּאָזְנֵי
  choice: kepada
  rationale: Ungkapan harfiah 'di telinga' berarti berbicara sehingga didengar oleh pihak yang dituju. 'Kepada' menyampaikan fungsi idiomatisnya secara wajar dalam bahasa Indonesia.
- source_word: כָּל בַּעֲלֵי שְׁכֶם
  choice: semua pemimpin Sikhem
  rationale: בעלים dapat berarti para tuan, pemilik, atau tokoh berpengaruh. Dalam konteks politik kota, 'pemimpin' paling jelas menyatakan kelompok berpengaruh tanpa menyiratkan seluruh penduduk.
- source_word: אֵת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: semua perkataan itu
  rationale: דברים dapat berarti perkataan atau hal-hal. Di sini frasa tersebut merujuk kembali pada usul yang diucapkan dalam ayat sebelumnya, sehingga 'perkataan' mempertahankan kaitan verbalnya.
- source_word: וַיֵּט לִבָּם
  choice: Hati mereka pun berpihak
  rationale: Idiom Ibrani mengenai hati yang condong menyatakan perubahan kecenderungan batin atau dukungan. 'Berpihak' terdengar alami dalam konteks politik dan tidak memasukkan pelaku kausatif yang tidak dinyatakan.
- source_word: אַחֲרֵי אֲבִימֶלֶךְ
  choice: kepada Abimelekh
  rationale: Secara harfiah 'mengikuti/di belakang Abimelekh'; bersama idiom hati yang condong, frasa ini menyatakan dukungan atau kesetiaan kepadanya. 'Berpihak kepada' menyampaikan metafora tersebut secara alami.
- source_word: כִּי אָמְרוּ
  choice: sebab mereka berkata
  rationale: כִּי memperkenalkan alasan mereka mendukung Abimelekh; 'sebab' mempertahankan hubungan penjelas itu.
- source_word: אָחִינוּ הוּא
  choice: Dia saudara kita
  rationale: '''Saudara'' adalah padanan langsung dan mempertahankan seruan pada solidaritas kekerabatan melalui ibu Abimelekh; ''kerabat'' akan lebih luas daripada ungkapan sumber.'
