  text: וַ/יַּגִּ֣דוּ לְ/יוֹתָ֗ם וַ/יֵּ֨לֶךְ֙ וַֽ/יַּעֲמֹד֙ בְּ/רֹ֣אשׁ הַר גְּרִזִ֔ים וַ/יִּשָּׂ֥א קוֹל֖/וֹ וַ/יִּקְרָ֑א וַ/יֹּ֣אמֶר לָ/הֶ֗ם שִׁמְע֤וּ אֵלַ/י֙ בַּעֲלֵ֣י שְׁכֶ֔ם וְ/יִשְׁמַ֥ע אֲלֵי/כֶ֖ם אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/007.yaml
  text: And they told Jotham[a], and he went and stood on the top of Mount Gerizim, and he lifted up his voice and called out and said to them, “Listen to me, leaders of Shechem[b], that God may listen to you.”
translation:
  language: id
  text: Mereka memberitahukan hal itu kepada Yotam. Lalu ia pergi dan berdiri di puncak Gunung Gerizim. Ia mengangkat suaranya, berseru kepada mereka, dan berkata, “Dengarkanlah aku, para pemimpin Sikhem,[a] supaya Allah mendengarkan kalian.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “para tuan” atau “para pemilik Sikhem”; ungkapan ini menunjuk kepada para pemegang kuasa di Sikhem.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “dan semoga Allah mendengarkan kalian.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגִּדוּ לְיוֹתָם
  choice: Ketika hal itu diberitahukan kepada Yotam
  rationale: Bentuk jamak tanpa subjek tertentu dapat diterjemahkan secara pasif dalam bahasa Indonesia. Objek yang tidak dinyatakan dalam bahasa Ibrani dibuat sebagai ‘hal itu’ berdasarkan konteks, tanpa menentukan siapa pemberitahunya.
- source_word: וַיֵּלֶךְ וַיַּעֲמֹד
  choice: ia pergi dan berdiri
  rationale: Mempertahankan urutan tindakan naratif secara lugas dan alami.
- source_word: בְּרֹאשׁ הַר גְּרִזִים
  choice: di puncak Gunung Gerizim
  rationale: רֹאשׁ dalam pemakaian topografis berarti puncak; nama tempat ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: וַיִּשָּׂא קוֹלוֹ וַיִּקְרָא וַיֹּאמֶר
  choice: Ia berseru dengan suara lantang kepada mereka
  rationale: Merangkum rangkaian idiom Ibrani secara alami tanpa menghilangkan unsur bahwa Yotam meninggikan suara dan menyampaikan seruan publik kepada mereka.
- source_word: שִׁמְעוּ אֵלַי
  choice: Dengarkanlah aku
  rationale: Imperatif שׁמע dengan אֶל menyatakan permintaan agar orang memberi perhatian dan mendengarkan.
- source_word: בַּעֲלֵי שְׁכֶם
  choice: para penguasa Sikhem
  rationale: בְּעָלִים secara harfiah dapat berarti para tuan, pemilik, atau penguasa. Dalam konteks ini ungkapan tersebut menunjuk kepada para pemegang kuasa di Sikhem, bukan sekadar semua penduduknya.
- source_word: וְיִשְׁמַע אֲלֵיכֶם אֱלֹהִים
  choice: supaya Allah mendengarkan kalian
  rationale: Kata penghubung dengan bentuk imperfek dapat menyatakan tujuan atau hasil setelah perintah sebelumnya. Pengulangan ‘mendengarkan’ mempertahankan permainan retoris dari kata שׁמע pada kedua klausa.
theological_decisions:
- issue: Daya ungkap klausa penutup Yotam
  choice: supaya Allah mendengarkan kalian
  alternative: dan semoga Allah mendengarkan kalian
  rationale: Kata וְ sebelum bentuk imperfek memungkinkan pembacaan tujuan/hasil maupun harapan bernuansa jussif. Teks utama memakai hubungan tujuan/hasil karena paling jelas menyampaikan timbal balik retorisnya, sedangkan pembacaan sebagai harapan dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Struktur Ibrani yang berulang dipadatkan secukupnya agar alami, sementara seruan lantang, kedudukan para pemegang kuasa di Sikhem, dan ambiguitas klausa penutup tetap dipertahankan.
