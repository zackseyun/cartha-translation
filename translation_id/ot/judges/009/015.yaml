base_translation:
  language: en
  yaml_path: translation/ot/judges/009/015.yaml
  text: Then the bramble said to the trees[a], ‘If you are truly anointing me as king over you, come, take refuge in my shade; but if not[c][b], let fire come out from the bramble and consume the cedars of Lebanon.’
translation:
  language: id
  text: Lalu semak berduri itu berkata kepada pohon-pohon itu[a], “Jika kalian sungguh-sungguh mengurapi aku sebagai raja atas kalian, datanglah dan berlindunglah di bawah naunganku[b]. Namun jika tidak, biarlah api keluar dari semak berduri itu[c] dan menghanguskan pohon-pohon aras Lebanon.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semak duri.” Kata Ibrani אָטָד menunjuk pada sejenis semak atau perdu berduri.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “berlindunglah di bawah naunganku” mungkin bernada ironis, sebab semak berduri hanya memberi sedikit naungan nyata.
    reason: literary_irony
  - marker: c
    text: Atau “api akan keluar dari semak berduri itu.” Kata kerja Ibraninya dapat dipahami sebagai harapan atau kutukan, maupun sebagai pernyataan tentang apa yang akan terjadi.
    reason: source_ambiguity
lexical_decisions:
- source_word: הָאָטָד
  choice: semak berduri
  rationale: Kata Ibrani אָטָד menunjuk pada semak atau perdu berduri. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan kontras dalam fabel dengan pohon-pohon yang besar.
- source_word: אִם בֶּאֱמֶת
  choice: Jika kalian sungguh-sungguh
  rationale: Ungkapan ini menekankan ketulusan atau kesungguhan tindakan, sekaligus mempertahankan nada tantangan bersyarat.
- source_word: מֹשְׁחִים אֹתִי לְמֶלֶךְ
  choice: mengurapi aku menjadi raja
  rationale: Kata משׁח secara khusus berarti mengurapi dan penting dalam konteks pengangkatan raja; karena itu citra sumber dipertahankan, bukan diratakan menjadi sekadar mengangkat.
- source_word: עֲלֵיכֶם
  choice: atas kalian
  rationale: Dalam konteks kerajaan, preposisi ini menyatakan kekuasaan atau pemerintahan atas rakyat.
- source_word: בֹּאוּ חֲסוּ
  choice: datanglah dan berlindunglah
  rationale: Kedua imperatif mengundang para pohon untuk mendekat dan mencari perlindungan. 'Berlindunglah' menyampaikan tindakan mencari tempat aman secara wajar.
- source_word: בְצִלִּי
  choice: di bawah naunganku
  rationale: צֵל berarti bayang-bayang atau naungan. 'Di bawah naunganku' idiomatis bagi perlindungan pohon dan tetap memungkinkan ironi bahwa semak berduri hampir tidak memberi naungan.
- source_word: וְאִם אַיִן
  choice: Namun jika tidak
  rationale: Ungkapan ini memperkenalkan akibat yang berlawanan dari syarat sebelumnya secara jelas dan alami.
- source_word: תֵּצֵא אֵשׁ מִן הָאָטָד
  choice: biarlah api keluar dari semak berduri itu
  rationale: Bentuk imperfek dapat dipahami secara yusif sebagai kehendak atau kutukan. 'Biarlah' mempertahankan nuansa tersebut tanpa menutup kemungkinan pemahaman prediktif.
- source_word: וְתֹאכַל
  choice: dan menghanguskan
  rationale: Ketika api menjadi subjek, אכל menyatakan pembinasaan dengan membakar. 'Menghanguskan' alami dalam bahasa Indonesia dan menampilkan citra api dengan jelas.
- source_word: אַרְזֵי הַלְּבָנוֹן
  choice: pohon-pohon aras Lebanon
  rationale: Ungkapan ini menunjuk pada pohon aras megah yang diasosiasikan dengan Lebanon. Bentuk ini jelas dan mempertahankan resonansi sastranya.
theological_decisions:
- issue: Daya ujar תֵּצֵא dalam akibat bersyarat
  choice: biarlah api keluar
  alternative: api akan keluar
  rationale: Bentuk Ibrani dapat dibaca sebagai kehendak atau kutukan yang bersifat yusif maupun sebagai pernyataan prediktif. Teks utama memakai bentuk yusif, sedangkan ambiguitas dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Sapaan jamak 'kalian' dipakai agar jumlah orang dalam bentuk Ibrani tetap jelas. Diksi 'mengurapi' mempertahankan istilah kerajaan, sedangkan 'semak berduri' dan 'naungan' mudah dipahami pembaca umum.
