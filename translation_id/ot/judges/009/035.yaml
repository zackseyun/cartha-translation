base_translation:
  language: en
  yaml_path: translation/ot/judges/009/035.yaml
  text: Then Gaal son of Ebed went out and stood at the entrance of the city gate[b][a], and Abimelech and the people who were with him rose from the ambush.
translation:
  language: id
  text: Gaal bin Ebed keluar lalu berdiri di pintu gerbang kota. Kemudian Abimelekh dan orang-orang yang bersamanya bangkit dari tempat penyergapan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari penyergapan”. Kata Ibrani yang dipakai dapat menunjuk pada penyergapan itu sendiri ataupun tempat orang-orang bersembunyi untuk menyergap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: keluar
  rationale: Kata kerja יצא menyatakan gerakan ke luar. Dalam bahasa Indonesia, “keluar” secara alami mempertahankan arah gerak tanpa menentukan sudut pandang sebagai “pergi” atau “datang”.
- source_word: גַּעַל בֶּן עֶבֶד
  choice: Gaal bin Ebed
  rationale: Nama diri ditransliterasikan, sedangkan patronimik בֶּן diterjemahkan dengan bentuk Indonesia yang ringkas dan lazim, “bin”.
- source_word: וַיַּעֲמֹד
  choice: berdiri
  rationale: עמד pada dasarnya berarti “berdiri”; pilihan ini tidak menambahkan nuansa militer yang tidak dinyatakan secara eksplisit.
- source_word: פֶּתַח שַׁעַר הָעִיר
  choice: di pintu gerbang kota
  rationale: Ungkapan ini secara harfiah menunjuk pada bukaan atau jalan masuk gerbang kota. “Di pintu gerbang kota” merupakan ungkapan Indonesia yang alami dan cukup jelas dalam konteks.
- source_word: וַיָּקָם
  choice: bangkit
  rationale: קום menggambarkan Abimelekh dan kelompoknya bangun atau bergerak dari persembunyian; “bangkit” mempertahankan daya naratif tanpa menjelaskan tindakan lebih jauh daripada teks.
- source_word: וְהָעָם אֲשֶׁר אִתּוֹ
  choice: dan orang-orang yang bersamanya
  rationale: עם secara leksikal berarti “rakyat/orang-orang”. Dalam konteks ini mereka adalah pasukan Abimelekh, tetapi terjemahan dipertahankan dekat dengan bentuk Ibrani.
- source_word: מִן הַמַּאְרָב
  choice: dari tempat penyergapan
  rationale: מארב dapat menunjuk pada penyergapan maupun posisi atau tempat penyergapan. Konteks dengan preposisi “dari” membuat “tempat penyergapan” paling alami dalam bahasa Indonesia, sambil mencatat alternatifnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama Abimelekh memakai transliterasi yang mencerminkan konsonan akhir nama Ibrani; patronimik diterjemahkan dengan “bin”. Penanda catatan kaki ditempatkan langsung sesudah frasa yang diterangkannya.
