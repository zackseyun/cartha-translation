base_translation:
  language: en
  yaml_path: translation/ot/judges/009/042.yaml
  text: And it happened on the next day that the people went out into the field[a], and it was reported to Abimelek.
translation:
  language: id
  text: Keesokan harinya, penduduk itu keluar ke ladang, dan hal itu diberitahukan kepada Abimelekh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dan mereka memberitahukan kepada Abimelekh”; subjek jamaknya tidak disebutkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: Keesokan harinya
  rationale: Ungkapan naratif ini menandai kejadian pada hari berikutnya. Bentuk ringkas ini alami dalam bahasa Indonesia dan tetap mempertahankan urutan waktunya.
- source_word: וַיֵּצֵא
  choice: pergi
  rationale: Kata kerja יצא menyatakan gerak keluar. Dalam gabungan dengan tujuan 'ke ladang', 'pergi' menghasilkan ungkapan Indonesia yang wajar.
- source_word: הָעָם
  choice: rakyat
  rationale: Kata עם adalah nomina kolektif bagi masyarakat atau penduduk sebagai kelompok, bukan khusus laki-laki.
- source_word: הַשָּׂדֶה
  choice: ke ladang
  rationale: Kata שדה menunjuk pada lahan terbuka atau lahan pertanian di luar kota; 'ladang' mempertahankan bentuk tunggal dan sesuai dengan konteks.
- source_word: וַיַּגִּידוּ
  choice: hal itu dilaporkan
  rationale: Bahasa Ibrani memakai verba orang ketiga jamak dengan subjek yang tidak disebutkan. Bentuk pasif impersonal ini menyampaikan maksud yang sama secara alami dalam bahasa Indonesia tanpa menetapkan siapa pelapornya.
- source_word: לַאֲבִימֶלֶךְ
  choice: kepada Abimelekh
  rationale: Nama diri ditransliterasikan secara langsung dari bentuk Ibrani, dan preposisi ל menyatakan penerima laporan.
