  terminology: Ejaan Abimelekh, Sikhem, Yerubaal, dan Zebul konsisten dengan penggunaan Indonesia yang lazim. “Pejabatnya” merupakan padanan yang aman bagi פְּקִידוֹ tanpa menspesifikkan jabatan. “Orang-orang Hamor” mempertahankan אַנְשֵׁי חֲמוֹר.
