id: JDG.9.28
reference: Judges 9:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר גַּ֣עַל בֶּן עֶ֗בֶד מִֽי אֲבִימֶ֤לֶךְ וּ/מִֽי שְׁכֶם֙ כִּ֣י נַעַבְדֶ֔/נּוּ הֲ/לֹ֥א בֶן יְרֻבַּ֖עַל וּ/זְבֻ֣ל פְּקִיד֑/וֹ עִבְד֗וּ אֶת אַנְשֵׁ֤י חֲמוֹר֙ אֲבִ֣י שְׁכֶ֔ם וּ/מַדּ֖וּעַ נַעַבְדֶ֥/נּוּ אֲנָֽחְנוּ׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/028.yaml
  text: And Gaal son of Ebed said[a], “Who is Abimelek, and who is Shechem, that we should serve him? Is he not the son of Jerubbaal, and Zebul his officer? Serve the men of Hamor[c][b], the father of Shechem! But why should we serve him?”
translation:
  language: id
  text: Lalu berkatalah Gaal anak Ebed, “Siapakah Abimelekh, dan siapakah Sikhem, sehingga kita harus mengabdi kepadanya? Bukankah dia anak Yerubaal dan Zebul pejabatnya?[a] Mengabdilah kepada orang-orang Hamor, ayah Sikhem![b] Namun, mengapa kita harus mengabdi kepadanya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Pejabatnya” dapat juga diterjemahkan “wakilnya” atau “pejabat yang diangkatnya”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ayah Sikhem”. Hamor dikenang sebagai ayah dari tokoh bernama Sikhem dan dikaitkan dengan asal-usul masyarakat kota itu; bandingkan Kejadian 34.
    reason: cross_reference
lexical_decisions:
- source_word: מִי אֲבִימֶלֶךְ וּמִי שְׁכֶם
  choice: Siapakah Abimelekh, dan siapakah Sikhem
  rationale: Mempertahankan bentuk pertanyaan retoris dan penyebutan langsung nama Sikhem. Nama Sikhem kemungkinan dipakai secara metonimis untuk kota atau masyarakat penguasanya, tetapi terjemahan tidak menutup ambiguitas itu.
- source_word: כִּי נַעַבְדֶנּוּ
  choice: sehingga kita harus mengabdi kepadanya
  rationale: Dalam konteks ini עבד menunjuk pada ketundukan atau pelayanan politik. 'Mengabdi' menyampaikan hubungan loyalitas kepada penguasa secara alami dalam bahasa Indonesia.
- source_word: הֲלֹא בֶן יְרֻבַּעַל
  choice: Bukankah dia anak Yerubaal
  rationale: הֲלֹא memperkenalkan pertanyaan retoris yang mengharapkan persetujuan; bentuk 'Bukankah' mempertahankan daya retoris tersebut.
- source_word: וּזְבֻל פְּקִידוֹ
  choice: dan bukankah Zebul pejabatnya
  rationale: פָּקִיד berarti pejabat atau petugas yang diangkat. Pengulangan 'bukankah' secara wajar menjelaskan bahwa frasa ini masih berada dalam pertanyaan retoris tanpa menentukan jabatan Zebul secara terlalu khusus.
- source_word: עִבְדוּ
  choice: Mengabdilah
  rationale: Mempertahankan bentuk imperatif jamak dan kontras tajam dengan pengabdian kepada Abimelekh.
- source_word: אַנְשֵׁי חֲמוֹר אֲבִי שְׁכֶם
  choice: orang-orang Hamor, leluhur Sikhem
  rationale: אַנְשֵׁי חֲמוֹר secara harfiah adalah 'orang-orang Hamor' dan dapat menunjuk pada kelompok yang berhubungan dengan atau berasal darinya. אֲבִי שְׁכֶם secara harfiah dapat berarti 'ayah Sikhem', tetapi dalam retorika mengenai kota/komunitas, 'leluhur Sikhem' lebih alami dan tetap mempertahankan kaitan asal-usul.
- source_word: וּמַדּוּעַ נַעַבְדֶנּוּ אֲנָחְנוּ
  choice: Namun, mengapa kita harus mengabdi kepadanya?
  rationale: '''Namun'' menampilkan daya adversatif dan klimaks tantangan itu. Kata ganti eksplisit אֲנָחְנוּ memberi penekanan pada ''kita'', yang secara alami tersampaikan melalui susunan pertanyaan Indonesia.'
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bernada retoris. ''Mengabdi'' dipilih untuk ketundukan politik, bukan pekerjaan biasa. Ejaan nama mengikuti bentuk Indonesia yang lazim: Abimelekh, Sikhem, dan Yerubaal.'
