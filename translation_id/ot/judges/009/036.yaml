base_translation:
  language: en
  yaml_path: translation/ot/judges/009/036.yaml
  text: When Gaal saw the people[a], he said to Zebul, “Look, people are coming down from the tops of the mountains.” But Zebul said to him, “You are seeing the shadow of the mountains as men.”
translation:
  language: id
  text: Ketika Gaal melihat orang-orang itu, ia berkata kepada Zebul, “Lihat, orang-orang sedang turun dari puncak-puncak gunung.” Namun Zebul berkata kepadanya, “Bayang-bayang gunung itu kaulihat sebagai laki-laki.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: melihat
  rationale: Bentuk naratif Qal dari ראה menyatakan tindakan melihat secara langsung.
- source_word: הָעָם / עָם
  choice: orang-orang itu / orang-orang
  rationale: עָם berarti ‘rakyat’ atau ‘orang-orang’ dan di sini menunjuk pada sekelompok orang yang mendekat. Pilihan ini tidak menambahkan keterangan eksplisit bahwa mereka adalah pasukan.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Kata seru ini menarik perhatian lawan bicara; ‘Lihat’ alami dalam bahasa Indonesia modern.
- source_word: יוֹרֵד
  choice: sedang turun
  rationale: Partisip ini menggambarkan gerakan yang sedang terlihat. Walaupun bentuk Ibraninya tunggal karena mengikuti nomina kolektif עָם, bahasa Indonesia tidak memerlukan penandaan persesuaian jumlah.
- source_word: מֵרָאשֵׁי הֶהָרִים
  choice: dari puncak-puncak gunung
  rationale: רֹאשׁ dalam konstruksi ini menunjuk pada bagian teratas atau puncak gunung; bentuk ulang menyampaikan jamak Ibrani dengan jelas.
- source_word: צֵל הֶהָרִים
  choice: bayang-bayang gunung
  rationale: צֵל dapat berarti bayang-bayang atau naungan. ‘Bayang-bayang’ paling sesuai dengan kekeliruan penglihatan yang dikemukakan Zebul.
- source_word: אַתָּה רֹאֶה כָּאֲנָשִׁים
  choice: kaulihat seperti laki-laki
  rationale: Susunan ini mempertahankan perbandingan dengan כְּ dan menyampaikan bahwa Gaal dianggap salah mengenali bayang-bayang sebagai sosok manusia.
- source_word: אֲנָשִׁים
  choice: laki-laki
  rationale: Nomina ini berbentuk jamak maskulin dan dalam konteks kelompok bersenjata menunjuk pada sosok laki-laki; pilihan ini mempertahankan kekhususan bentuk sumber.
