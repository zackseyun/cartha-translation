base_translation:
  language: en
  yaml_path: translation/ot/judges/009/025.yaml
  text: Then the leaders of Shechem set men in ambush for him on the tops of the mountains[a], and they robbed everyone who passed by them on the road; and it was reported to Abimelech.
translation:
  language: id
  text: Kemudian para pemimpin Sikhem[a] menempatkan orang-orang untuk menyergap Abimelekh di puncak-puncak gunung. Mereka merampok setiap orang yang melewati mereka di jalan itu, dan hal tersebut dilaporkan kepada Abimelekh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “warga Sikhem” atau “para penguasa Sikhem.” Ungkapan Ibrani ini secara harfiah berarti “para pemilik/tuan Sikhem” dan dapat menunjuk kepada para pemimpin atau pemegang kuasa di kota itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַעֲלֵי שְׁכֶם
  choice: para pemimpin Sikhem
  rationale: Secara harfiah berarti para pemilik, tuan, atau pemegang kuasa di Sikhem. Dalam konteks politik kota ini, “para pemimpin Sikhem” menyampaikan fungsi sosial-politiknya tanpa memberi kesan gelar feodal.
- source_word: וַיָּשִׂימוּ לוֹ מְאָרְבִים
  choice: menempatkan orang-orang untuk menyergap Abimelekh
  rationale: Ungkapan ini menggambarkan penempatan sejumlah penyergap terhadap seseorang. Nama Abimelekh dipakai untuk memperjelas rujukan pronomina dalam bahasa Indonesia.
- source_word: עַל רָאשֵׁי הֶהָרִים
  choice: di puncak-puncak gunung
  rationale: Mempertahankan gambaran harfiah “di kepala/puncak gunung-gunung” sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: וַיִּגְזְלוּ
  choice: mereka merampok
  rationale: Kata kerja ini menunjuk pada perampasan dengan kekerasan; “merampok” sesuai dengan tindakan terhadap para pelintas jalan.
- source_word: אֵת כָּל אֲשֶׁר יַעֲבֹר עֲלֵיהֶם בַּדָּרֶךְ
  choice: setiap orang yang melintas di jalan itu
  rationale: Bentuk tunggal setelah כָּל bersifat distributif. Terjemahan ini menyampaikan bahwa setiap pelintas menjadi sasaran tanpa menghasilkan susunan yang kaku dalam bahasa Indonesia.
- source_word: וַיֻּגַּד לַאֲבִימֶלֶךְ
  choice: hal tersebut dilaporkan kepada Abimelekh
  rationale: Bentuk pasif dipertahankan karena pelapor tidak disebutkan dalam teks sumber.
