base_translation:
  language: en
  yaml_path: translation/ot/judges/009/057.yaml
  text: And God repaid all the evil of the men of Shechem on their own heads, and the curse of Jotham son of Jerubbaal came upon them.
translation:
  language: id
  text: Allah membuat seluruh kejahatan orang-orang Sikhem kembali menimpa kepala mereka sendiri, dan kutuk Yotam anak Yerubaal pun menimpa mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵשִׁיב
  choice: membalaskan
  rationale: 'Bentuk Hifil dari שוב dengan ''kejahatan'' sebagai objek dan ''ke atas kepala mereka'' sebagai pelengkap menyatakan pembalasan: Allah membuat kejahatan mereka kembali menimpa mereka. ''Membalaskan'' menyampaikan tindakan penghukuman ilahi secara alami.'
- source_word: רָעַת
  choice: kejahatan
  rationale: רעה di sini menunjuk pada kejahatan moral yang dilakukan orang-orang Sikhem, bukan sekadar kemalangan atau bahaya.
- source_word: בְּרֹאשָׁם
  choice: ke atas kepala mereka sendiri
  rationale: Ungkapan ini mempertahankan gambaran Ibrani bahwa akibat kejahatan kembali kepada para pelakunya; 'sendiri' memperjelas daya refleksifnya.
- source_word: קִלֲלַת
  choice: kutuk
  rationale: Kata benda ini merujuk pada kutuk yang diucapkan Yotam sebelumnya. 'Kutuk' merupakan padanan ringkas dan wajar dalam register Alkitab Indonesia.
- source_word: וַתָּבֹא אֲלֵיהֶם
  choice: pun menimpa mereka
  rationale: Ungkapan ini menyatakan bahwa kutuk itu sampai kepada mereka dan menjadi nyata. 'Menimpa' alami dalam bahasa Indonesia serta mempertahankan nuansa datangnya hukuman.
- source_word: אַנְשֵׁי שְׁכֶם
  choice: orang-orang Sikhem
  rationale: Ungkapan Ibrani secara harfiah berarti 'orang-orang lelaki Sikhem', tetapi dalam konteks naratif menunjuk secara korporat kepada warga/pihak Sikhem. 'Orang-orang Sikhem' alami dan tidak mempersempitnya menjadi para pemimpin saja.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Kata ini memakai tindakan verbal tunggal dan jelas merujuk kepada Allah Israel sebagai pelaku penghakiman.
- source_word: יוֹתָם בֶּן יְרֻבָּעַל
  choice: Yotam anak Yerubaal
  rationale: Nama-nama ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia, sementara hubungan anak-bapak dipertahankan secara langsung.
theological_decisions:
- issue: Bahasa pembalasan ilahi
  choice: Allah membalaskan kejahatan mereka ke atas kepala mereka sendiri.
  alternative: Allah membiarkan kejahatan mereka kembali menimpa mereka.
  rationale: Teks Ibrani menjadikan Allah subjek gramatikal הֵשִׁיב dan dengan demikian menggambarkan tindakan penghakiman-Nya secara aktif. Terjemahan tidak melunakkannya menjadi izin pasif.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur paralel ayat dipertahankan. Ungkapan 'ke atas kepala mereka sendiri' sengaja mempertahankan citra idiomatis Ibrani, sedangkan partikel 'pun' menandai hasil lanjutan dalam klausa kedua.
