source:
  edition: WLC
  text: וַ/יֹּאמְר֥וּ הָ/עֵצִ֖ים לַ/תְּאֵנָ֑ה לְכִי אַ֖תְּ מָלְכִ֥י עָלֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/010.yaml
  text: Then the trees said to the fig tree, ‘You come, reign over us.’
translation:
  language: id
  text: Lalu pohon-pohon itu berkata kepada pohon ara, “Datanglah, engkau, dan jadilah raja atas kami.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita; “Lalu” menyampaikan gerak naratif secara alami, sedangkan “berkata” merupakan arti biasa אמר.
- source_word: הָעֵצִים
  choice: pohon-pohon itu
  rationale: עֵצִים adalah bentuk jamak umum untuk pohon atau kayu; dalam konteks fabel ini jelas menunjuk kepada pohon-pohon yang berbicara. Penanda “itu” mencerminkan kejelasan nomina Ibrani.
- source_word: לַתְּאֵנָה
  choice: kepada pohon ara
  rationale: תְּאֵנָה dalam konteks ini menunjuk kepada pohon ara, bukan sekadar buah ara; prefiks ל menandai pihak yang diajak bicara.
- source_word: לְכִי
  choice: Datanglah
  rationale: Imperatif feminin tunggal dari הלך dapat berarti “pergilah” atau, dalam ajakan untuk mengambil kedudukan, “datanglah.” Bahasa Indonesia secara alami memakai “Datanglah” di sini.
- source_word: אַתְּ
  choice: engkau
  rationale: Kata ganti mandiri feminin tunggal dinyatakan secara eksplisit dan memberi penekanan. “Engkau” mempertahankan penekanan itu dengan ragam yang wajar dan bermartabat.
- source_word: מָלְכִי
  choice: jadilah raja
  rationale: Imperatif feminin tunggal dari מלך berarti memerintah sebagai raja. “Jadilah raja” mempertahankan citra kerajaan yang penting dalam fabel dan konteks pasal ini, meskipun kata “raja” dalam bahasa Indonesia tidak menandai gender gramatikal.
- source_word: עָלֵינוּ
  choice: atas kami
  rationale: Dengan מלך, preposisi על menyatakan kekuasaan atas rakyat; “atas kami” adalah padanan Indonesia yang ringkas dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan “Datanglah, engkau” sengaja mempertahankan kata ganti Ibrani yang eksplisit dan menekankan bahwa pohon ara kini dipanggil secara langsung; konjungsi “dan” membantu menghasilkan ajakan yang alami dalam bahasa Indonesia.
