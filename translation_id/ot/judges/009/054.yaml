  text: וַ/יִּקְרָ֨א מְהֵרָ֜ה אֶל הַ/נַּ֣עַר נֹשֵׂ֣א כֵלָ֗י/ו וַ/יֹּ֤אמֶר ל/וֹ֙ שְׁלֹ֤ף חַרְבְּ/ךָ֙ וּ/מ֣וֹתְתֵ֔/נִי פֶּן יֹ֥אמְרוּ לִ֖/י אִשָּׁ֣ה הֲרָגָ֑תְ/הוּ וַ/יִּדְקְרֵ֥/הוּ נַעֲר֖/וֹ וַ/יָּמֹֽת־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/054.yaml
  text: Then he quickly called to the young man who carried his weapons and said to him[a], “Draw your sword and kill me, lest they say of me, ‘A woman killed him.’” So his young man pierced him through, and he died.
translation:
  language: id
  text: Lalu ia segera memanggil orang muda yang membawa senjatanya dan berkata kepadanya[a], “Hunuslah pedangmu dan bunuhlah aku, supaya jangan orang berkata tentang aku, ‘Seorang perempuan membunuhnya.’” Maka orang mudanya menikamnya hingga tembus, dan Abimelekh mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih idiomatis, “pembawa senjatanya” untuk “orang muda yang membawa senjatanya” dan “orang mudanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא מְהֵרָה
  choice: Lalu ia segera memanggil
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi, sedangkan מְהֵרָה menyatakan tindakan yang dilakukan dengan segera.
- source_word: הַנַּעַר
  choice: orang muda
  rationale: Menjaga arti leksikal נַעַר dan menghindari penyempitan makna menjadi 'pelayan', meskipun dalam konteks ini ia adalah pembawa senjata Abimelekh.
- source_word: נֹשֵׂא כֵלָיו
  choice: yang membawa senjatanya
  rationale: Secara transparan menyampaikan orang yang membawa perlengkapan atau senjata miliknya; 'pembawa senjata' dicatat sebagai padanan idiomatis.
- source_word: שְׁלֹף חַרְבְּךָ
  choice: Hunuslah pedangmu
  rationale: Ungkapan Indonesia yang alami dan tepat untuk tindakan menarik pedang dari sarungnya.
- source_word: וּמוֹתְתֵנִי
  choice: dan bunuhlah aku
  rationale: Menyampaikan secara langsung permintaan agar orang muda itu menyebabkan kematiannya.
- source_word: פֶּן יֹאמְרוּ לִי
  choice: supaya jangan orang berkata tentang aku
  rationale: פֶּן memperkenalkan akibat yang hendak dicegah. לִי secara harfiah dapat berarti 'kepadaku', tetapi konteks menunjukkan perkataan mengenai dirinya.
- source_word: אִשָּׁה הֲרָגָתְהוּ
  choice: ‘Seorang perempuan membunuhnya’
  rationale: Mempertahankan susunan aktif yang mengedepankan 'seorang perempuan' serta tekanan sosial dalam ucapan itu.
- source_word: וַיִּדְקְרֵהוּ
  choice: menikamnya hingga tembus
  rationale: Menjaga kekhususan verba yang menggambarkan penusukan atau penembusan dengan senjata.
- source_word: נַעֲרוֹ
  choice: orang mudanya
  rationale: Mempertahankan konsistensi leksikal dengan הַנַּעַר pada bagian awal ayat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Hunuslah' dipertahankan karena merupakan istilah baku dan alami bagi pedang. Struktur kutipan langsung serta tekanan pada 'seorang perempuan' dipertahankan.
