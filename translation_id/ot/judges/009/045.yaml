source:
  edition: WLC
  text: וַ/אֲבִימֶ֜לֶךְ נִלְחָ֣ם בָּ/עִ֗יר כֹּ֚ל הַ/יּ֣וֹם הַ/ה֔וּא וַ/יִּלְכֹּד֙ אֶת הָ/עִ֔יר וְ/אֶת הָ/עָ֥ם אֲשֶׁר בָּ֖/הּ הָרָ֑ג וַ/יִּתֹּץ֙ אֶת הָ/עִ֔יר וַ/יִּזְרָעֶ֖/הָ מֶֽלַח־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/009/045.yaml
  text: And Abimelech fought against the city all that day[a], and he captured the city and killed the people who were in it[b]. Then he tore down the city and sowed it with salt.
translation:
  language: id
  text: Abimelekh berperang melawan kota itu sepanjang hari itu[a]. Ia merebut kota itu dan membunuh orang-orang yang ada di dalamnya. Kemudian ia meruntuhkan kota itu dan menaburinya dengan garam[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “menyerang kota itu.” Kata kerja Ibrani secara harfiah berarti “berperang” dan, dengan kata depan yang dipakai di sini, kemungkinan menunjuk pada tindakan militer terhadap kota itu.
    reason: lexical_alternative
  - marker: b
    text: Menaburi kota dengan garam merupakan tindakan simbolis yang menyatakan kehancuran dan kutuk serta menandai bahwa kota itu telah dibinasakan.
    reason: cultural_note
lexical_decisions:
- source_word: נִלְחָם בָּעִיר
  choice: berperang melawan kota itu
  rationale: Kata kerja לחם dengan preposisi ב dalam konteks ini menunjuk pada tindakan militer terhadap kota. Pilihan ini mempertahankan arti harfiah 'berperang' tanpa mempersempitnya menjadi hanya serangan awal.
- source_word: כֹּל הַיּוֹם הַהוּא
  choice: sepanjang hari itu
  rationale: Ungkapan ini menekankan lamanya tindakan pada hari tertentu dan diterjemahkan secara alami dalam bahasa Indonesia modern.
- source_word: וַיִּלְכֹּד
  choice: ia merebut
  rationale: Dalam konteks peperangan, לכד berarti merebut atau menguasai kota. 'Merebut' jelas dan idiomatis.
- source_word: הָעָם אֲשֶׁר בָּהּ
  choice: orang-orang yang ada di dalamnya
  rationale: עָם di sini menunjuk pada penduduk atau kumpulan orang di dalam kota; terjemahan ini mempertahankan bentuk klausa relatif dan tidak menambahkan rincian.
- source_word: הָרָג
  choice: membunuh
  rationale: Kata ini secara langsung menyatakan tindakan membunuh; pilihan Indonesia ini lugas dan tidak arkais.
- source_word: וַיִּתֹּץ
  choice: meruntuhkan
  rationale: נתץ berarti merobohkan atau menghancurkan bangunan. 'Meruntuhkan' sesuai untuk penghancuran sebuah kota dan terdengar alami.
- source_word: וַיִּזְרָעֶהָ מֶלַח
  choice: menaburinya dengan garam
  rationale: Terjemahan ini mempertahankan citra harfiah tindakan 'menabur' garam sambil menggunakan konstruksi Indonesia yang alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama אַבִימֶלֶךְ ditransliterasikan sebagai “Abimelekh” agar mencerminkan konsonan akhir Ibrani. Urutan tindakan dalam teks Ibrani dipertahankan, dan semua penanda catatan kaki ditempatkan pada bagian teks yang dijelaskannya.
