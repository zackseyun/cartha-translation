base_translation:
  language: en
  yaml_path: translation/ot/judges/009/033.yaml
  text: Then in the morning[a], as soon as the sun rises, you must get up early and spread out against the city. And look, when he and the people who are with him come out to you, you shall do to him as your hand finds.
translation:
  language: id
  text: Pada pagi hari, begitu matahari terbit, bangunlah pagi-pagi dan majulah menyerang kota itu. Lihatlah, ketika ia dan orang-orang yang bersamanya keluar mendatangimu, lakukanlah terhadapnya menurut kemampuan dan kesempatan yang ada.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “sebagaimana tanganmu mendapati.” Ungkapan Ibrani ini berarti bertindak menurut kemampuan atau kesempatan yang tersedia.'
    reason: Menjelaskan idiom Ibrani yang tidak memiliki padanan alami dengan citra yang sama dalam bahasa Indonesia serta mempertahankan kemungkinan nuansa kemampuan maupun kesempatan.
lexical_decisions:
- source_word: וְהָיָה בַבֹּקֶר
  choice: Pada pagi hari
  rationale: Bentuk וְהָיָה mengantar tahap berikut dalam rencana, sedangkan בַבֹּקֶר menyatakan waktunya. Dalam bahasa Indonesia, urutan itu dapat disampaikan secara alami tanpa menerjemahkan וְהָיָה secara kaku.
- source_word: כִּזְרֹחַ הַשֶּׁמֶשׁ
  choice: begitu matahari terbit
  rationale: Konstruksi temporal ini menunjuk saat matahari terbit; 'begitu' menyampaikan ketepatan dan kesegeraan waktu dalam instruksi militer.
- source_word: תַּשְׁכִּים
  choice: bangunlah pagi-pagi
  rationale: Bentuk Hifil dari שׁכם berarti bangun atau mulai pagi-pagi. Bentuk perintah sesuai dengan fungsi rangkaian instruksi dalam konteks.
- source_word: וּפָשַׁטְתָּ עַל הָעִיר
  choice: dan serbulah kota itu
  rationale: Dalam konteks militer, פשט dapat berarti bergerak menyerbu, merazia, atau menyebar untuk menyerang. 'Serbulah' alami dalam bahasa Indonesia dan mempertahankan tindakan ofensif tanpa menentukan taktik secara berlebihan.
- source_word: וְהִנֵּה
  choice: Lihatlah
  rationale: Partikel ini menarik perhatian pada perkembangan yang segera menyusul. 'Lihatlah' mempertahankan fungsi deiktisnya dalam ragam Indonesia yang wajar dan bermartabat.
- source_word: הוּא וְהָעָם אֲשֶׁר אִתּוֹ
  choice: dia dan orang-orang yang bersamanya
  rationale: עָם menunjuk kelompok yang menyertainya. 'Orang-orang' tetap luas dan tidak menambahkan secara eksplisit bahwa mereka adalah pasukan.
- source_word: יֹצְאִים אֵלֶיךָ
  choice: keluar mendatangimu
  rationale: אֵלֶיךָ secara harfiah menyatakan arah 'kepadamu'. 'Mendatangimu' mempertahankan arah gerak tanpa memasukkan unsur 'melawan' yang hanya tersirat oleh konteks pertempuran.
- source_word: וְעָשִׂיתָ לּוֹ
  choice: lakukanlah terhadapnya
  rationale: Akhiran pronominal tunggal dipertahankan, terutama merujuk kepada pemimpin tersebut, meskipun dalam konteks ia dapat mewakili kelompoknya.
- source_word: כַּאֲשֶׁר תִּמְצָא יָדֶךָ
  choice: semampumu
  rationale: Ungkapan harfiah 'sebagaimana tanganmu mendapati' adalah idiom tentang kemampuan atau kesempatan yang tersedia. 'Semampumu' alami dalam bahasa Indonesia, sementara cakupan idiom dijelaskan dalam catatan kaki.
