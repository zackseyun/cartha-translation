translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Nama שְׁכֶם ditransliterasikan sebagai “Sikhem”, dan אֲבִימֶלֶךְ sebagai “Abimelekh”. Penanda catatan kaki ditempatkan sesudah frasa yang dijelaskannya, yaitu “empat kelompok”.
