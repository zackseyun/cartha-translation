base_translation:
  language: en
  yaml_path: translation/ot/judges/009/034.yaml
  text: So Abimelech and all the people who were with him got up by night[a], and they lay in ambush against Shechem in four companies.
translation:
  language: id
  text: Abimelekh dan seluruh orang yang bersama dia bangun pada malam hari, lalu mereka mengadang Sikhem dalam empat kelompok.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “empat kepala”, sebuah ungkapan untuk empat kelompok atau bagian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: bangun
  rationale: Bentuk naratif dari קום menyatakan bangkit atau mulai bertindak. “Bangun” mempertahankan gambaran konkret dan sesuai dengan tindakan pada malam hari tanpa mempersempit maknanya menjadi “berangkat”.
- source_word: לָיְלָה
  choice: pada malam hari
  rationale: Berfungsi sebagai keterangan waktu. Ungkapan ini alami dalam bahasa Indonesia dan tidak menyiratkan bahwa tindakan itu berlangsung sepanjang malam.
- source_word: וַיֶּאֶרְבוּ
  choice: bersembunyi untuk menyergap
  rationale: Kata ארב berarti menanti secara tersembunyi untuk menyerang. Rumusan ini jelas dan alami dalam bahasa Indonesia serta mempertahankan unsur penyergapan militer.
- source_word: עַל שְׁכֶם
  choice: menyergap Sikhem
  rationale: Dalam konstruksi dengan ארב, עַל menandai sasaran tindakan bermusuhan. Objek langsung setelah “menyergap” menyampaikan hubungan ini secara alami dalam bahasa Indonesia.
- source_word: אַרְבָּעָה רָאשִׁים
  choice: dalam empat kelompok
  rationale: Secara harfiah berarti “empat kepala”, tetapi dalam konteks ini merupakan idiom bagi empat kelompok atau satuan yang terpisah. “Kelompok” jelas tanpa menambahkan tingkat organisasi militer yang tidak dinyatakan.
- source_word: הָעָם אֲשֶׁר עִמּוֹ
  choice: seluruh rakyat yang menyertainya
  rationale: עָם secara umum berarti “rakyat” atau “orang-orang”. Terjemahan ini tidak mempersempitnya menjadi “pasukan” atau “para lelaki”, meskipun konteksnya bersifat militer.
