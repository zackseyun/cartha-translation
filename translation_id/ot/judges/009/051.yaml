base_translation:
  language: en
  yaml_path: translation/ot/judges/009/051.yaml
  text: But there was a strong tower in the middle of the city[a], and all the men and women and all the leaders of the city fled there and shut themselves in[b], and they went up onto the roof of the tower.
translation:
  language: id
  text: Di tengah kota itu terdapat sebuah menara yang kokoh[a]. Semua laki-laki dan perempuan serta semua pemuka kota itu melarikan diri ke sana. Mereka mengurung diri di dalam menara itu, lalu naik ke atapnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menara pertahanan”. Secara harfiah, frasa Ibrani menggabungkan kata “menara” dan “kekuatan”, dengan menekankan kekokohan menara itu sebagai tempat perlindungan.
    reason: lexical_alternative
  - marker: b
    text: Atau “semua orang terkemuka kota itu”. Secara harfiah, ungkapan Ibrani berarti “para pemilik” atau “para tuan kota”; dalam konteks ini ungkapan tersebut menunjuk pada orang-orang terkemuka di kota itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְדַּל עֹז
  choice: menara yang kokoh
  rationale: Frasa Ibrani secara harfiah menggabungkan 'menara' dengan 'kekuatan'. 'Menara yang kokoh' alami dalam bahasa Indonesia dan menyampaikan fungsi pertahanannya tanpa mengubah bangunan nyata ini menjadi metafora.
- source_word: בְּתוֹךְ הָעִיר
  choice: di tengah kota itu
  rationale: בְּתוֹךְ menyatakan keberadaan di tengah atau di dalam; 'di tengah kota itu' mempertahankan nuansa ruang yang lebih khusus.
- source_word: וַיָּנֻסוּ שָׁמָּה
  choice: melarikan diri ke sana
  rationale: נוּס berarti melarikan diri. Pilihan ini mempertahankan tindakan yang dinyatakan teks tanpa menambahkan tujuan tersirat seperti 'mencari perlindungan'.
- source_word: כָּל הָאֲנָשִׁים וְהַנָּשִׁים
  choice: semua laki-laki dan perempuan
  rationale: Teks Ibrani secara eksplisit menyebut laki-laki dan perempuan, sehingga keduanya dipertahankan.
- source_word: וְכֹל בַּעֲלֵי הָעִיר
  choice: serta semua pemuka kota itu
  rationale: בַּעֲלֵי secara dasar berarti para pemilik atau penguasa, tetapi dalam konteks sipil ini menunjuk pada orang-orang terkemuka kota. 'Pemuka kota' mempertahankan nuansa status tanpa menyiratkan jabatan pemerintahan tertentu.
- source_word: וַיִּסְגְּרוּ בַעֲדָם
  choice: mereka mengunci diri di dalam menara itu
  rationale: Ungkapan ini berarti bahwa mereka menutup akses di belakang atau bagi diri mereka sendiri. Terjemahan ini menyampaikan bahwa mereka membarikade atau mengurung diri tanpa menambahkan objek seperti pintu yang tidak disebutkan dalam teks.
- source_word: וַיַּעֲלוּ עַל גַּג הַמִּגְדָּל
  choice: lalu naik ke atapnya
  rationale: עָלָה berarti naik dan גַּג secara khusus berarti atap. Pronomina '-nya' secara alami merujuk kembali kepada menara yang baru disebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Kalimat Ibrani yang panjang dibagi menjadi tiga kalimat agar mudah dipahami, tanpa mengubah urutan peristiwa. 'Pemuka kota' dipilih karena lebih wajar dan lebih tepat secara kontekstual daripada terjemahan harfiah 'para pemilik kota'.
