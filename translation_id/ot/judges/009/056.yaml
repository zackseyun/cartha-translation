  yaml_path: translation/ot/judges/009/056.yaml
  text: Thus God repaid Abimelech for the evil that he had done to his father by killing his seventy brothers[a].
translation:
  language: id
  text: Demikianlah Allah membalas kejahatan Abimelekh yang telah dilakukannya terhadap ayahnya dengan membunuh tujuh puluh saudara laki-lakinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengembalikan kejahatan Abimelekh kepadanya.” Ungkapan Ibrani menggambarkan bahwa Allah menyebabkan kejahatannya kembali menimpa dirinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: membalas
  rationale: Bentuk hifil dari שׁוּב secara idiomatis menyatakan bahwa Allah menyebabkan kejahatan Abimelekh kembali menimpa dirinya. “Membalas” menyampaikan makna penghakiman itu secara alami dalam bahasa Indonesia, sedangkan gambaran harfiahnya dipertahankan dalam catatan kaki.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Bentuk ini merujuk kepada Allah yang esa dan menjadi subjek tindakan penghakiman.
- source_word: רָעַת אֲבִימֶלֶךְ
  choice: kejahatan Abimelekh
  rationale: רָעָה di sini menunjuk pada perbuatan yang secara moral jahat, bukan sekadar kemalangan atau kerugian.
- source_word: אֲשֶׁר עָשָׂה לְאָבִיו
  choice: yang telah dilakukannya terhadap ayahnya
  rationale: Bentuk lampau “telah dilakukannya” sesuai dengan rangkuman retrospektif, dan “terhadap” menyatakan bahwa ayahnya adalah pihak yang terkena oleh kejahatan itu.
- source_word: לַהֲרֹג
  choice: dengan membunuh
  rationale: Infinitif berawalan ל menjelaskan tindakan yang merupakan isi atau cara kejahatan tersebut dilakukan.
- source_word: שִׁבְעִים אֶחָיו
  choice: ketujuh puluh saudaranya
  rationale: Ungkapan ini menyatakan seluruh kelompok yang berjumlah tujuh puluh dan mempertahankan hubungan keluarga yang penting dalam konteks.
- source_word: וַ
  choice: Demikianlah
  rationale: Dalam rangkuman penutup ini, kata tersebut menyampaikan hubungan hasil atau kesimpulan dengan peristiwa sebelumnya secara wajar.
theological_decisions:
- issue: Peran langsung Allah dalam penghakiman
  choice: Allah secara aktif membalas kejahatan Abimelekh.
  alternative: Allah hanya membiarkan akibat kejahatan Abimelekh kembali menimpanya.
  rationale: Teks Ibrani menempatkan Allah sebagai subjek langsung dari verba kausatif. Terjemahan mempertahankan pernyataan tentang tindakan ilahi ini tanpa memperlemahnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara idiom Ibrani dan gambaran kejahatan yang kembali kepada pelakunya dijelaskan dalam catatan kaki.
