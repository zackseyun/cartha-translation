base_translation:
  language: en
  yaml_path: translation/ot/judges/002/004.yaml
  text: And when the angel of Yahweh spoke these words to all the sons of Israel[b][a], the people raised their voices and wept.
translation:
  language: id
  text: Ketika malaikat Yahweh[a] menyampaikan perkataan-perkataan ini kepada semua orang Israel[b], bangsa itu mengangkat suara mereka dan menangis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “utusan Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “kepada semua anak Israel”; secara harfiah, “kepada semua putra Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּדַבֵּר
  choice: Ketika ... menyampaikan
  rationale: Rangkaian וַיְהִי dengan infinitif berkonstruksi memperkenalkan anak kalimat waktu. Dalam bahasa Indonesia modern, “Ketika” menyampaikan fungsi naratifnya tanpa ungkapan kaku “terjadilah ketika.” דִּבֵּר di sini diterjemahkan “menyampaikan” karena objeknya ialah perkataan yang ditujukan kepada seluruh Israel.
- source_word: מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  rationale: מַלְאַךְ dapat berarti utusan manusia maupun malaikat. Dalam ungkapan naratif yang khas ini, “malaikat” merupakan padanan utama yang alami, sementara kemungkinan leksikal “utusan” dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh,” sehingga nama pribadi dalam teks sumber tidak diganti dengan gelar.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: perkataan-perkataan ini
  rationale: דְּבָרִים merujuk pada ujaran yang baru disampaikan. Bentuk ulang mempertahankan nuansa jamak teks sumber dan tetap wajar dalam bahasa Indonesia.
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: kepada seluruh keturunan Israel
  rationale: Secara harfiah frasa ini berarti “kepada semua anak laki-laki Israel,” tetapi sebagai sebutan kolektif merujuk kepada orang Israel. “Seluruh keturunan Israel” mempertahankan citra hubungan keturunan tanpa menyiratkan bahwa hanya laki-laki yang dimaksud.
- source_word: וַיִּשְׂאוּ הָעָם אֶת קוֹלָם
  choice: bangsa itu ... dengan suara nyaring
  rationale: Idiom Ibrani “mengangkat suara” dalam konteks tangisan berarti menangis atau berseru dengan suara keras. Padanan ini alami dalam bahasa Indonesia dan tidak meniru idiom sumber secara kaku.
- source_word: וַיִּבְכּוּ
  choice: menangis
  rationale: בכה berarti menangis atau meratap. “Menangis” merupakan pilihan langsung dan tidak menambahkan gagasan ratapan ritual yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama tersebut dalam bentuk transliterasi yang lazim secara ilmiah, alih-alih menggantinya dengan gelar.
- issue: Identitas מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  alternative: utusan Yahweh
  rationale: Kata מַלְאַךְ sendiri dapat berarti “utusan” atau “malaikat.” Teks tidak menjelaskan lebih lanjut hakikat tokoh tersebut; karena itu terjemahan utama mengikuti pemakaian naratif yang lazim, sedangkan alternatif leksikal dipertahankan dalam catatan kaki tanpa menetapkan identitas teologis tertentu.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Susunan kalimat dibuat alami dengan anak kalimat waktu di awal. Ungkapan idiomatis tentang mengangkat suara diterjemahkan menurut maknanya dalam konteks, sedangkan ambiguitas מַלְאַךְ dan bentuk harfiah בְּנֵי יִשְׂרָאֵל dijaga melalui catatan kaki.
