base_translation:
  language: en
  yaml_path: translation/ot/judges/002/010.yaml
  text: And all that generation also were gathered to their fathers[a], and another generation arose after them who did not know Yahweh[b], or even the work that he had done for Israel.
translation:
  language: id
  text: Seluruh generasi itu juga dikumpulkan kepada nenek moyang mereka[a]. Sesudah mereka, muncul generasi lain yang tidak mengenal Yahweh[b], bahkan tidak mengenal perbuatan yang telah dilakukan-Nya bagi Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dikumpulkan kepada nenek moyang mereka,” sebuah ungkapan Ibrani untuk meninggal dan bergabung dengan para leluhur.
    reason: cultural_note
  - marker: b
    text: Atau “tidak mengakui Yahweh.” Kata kerja Ibrani ini dapat menunjuk pada pengenalan yang bersifat relasional atau terkait perjanjian, bukan hanya pengetahuan tentang fakta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם כָּל הַדּוֹר הַהוּא
  choice: Seluruh angkatan itu pun
  rationale: Menjaga cakupan כָּל dan daya tambah/penegasan וְגַם, sekaligus memakai susunan Indonesia yang alami.
- source_word: נֶאֶסְפוּ אֶל אֲבוֹתָיו
  choice: dikumpulkan kepada leluhur mereka
  rationale: Mempertahankan ungkapan Ibrani tentang kematian dan bergabung dengan para pendahulu, sedangkan 'leluhur' lebih alami dan inklusif daripada 'bapa-bapa' dalam bahasa Indonesia modern.
- source_word: וַיָּקָם דּוֹר אַחֵר אַחֲרֵיהֶם
  choice: Sesudah mereka, bangkitlah angkatan lain
  rationale: Menyatakan urutan waktu dengan jelas dan mempertahankan citra 'bangkit' bagi munculnya angkatan baru.
- source_word: לֹא יָדְעוּ אֶת יְהוָה
  choice: tidak mengenal Yahweh
  rationale: Kata 'mengenal' mempertahankan kemungkinan makna faktual, pengalaman, relasional, dan perjanjian dari יָדַע tanpa mempersempitnya.
- source_word: וְגַם אֶת הַמַּעֲשֶׂה
  choice: bahkan tidak mengenal perbuatan
  rationale: Dalam cakupan penyangkalan sebelumnya, 'bahkan tidak' menyampaikan daya tambah dan penegasan וְגַם secara wajar dalam bahasa Indonesia.
- source_word: אֲשֶׁר עָשָׂה לְיִשְׂרָאֵל
  choice: yang telah dilakukan-Nya bagi Israel
  rationale: Bentuk lampau selesai sesuai konteks, dan 'bagi Israel' menyampaikan fungsi benefaktif ל tanpa memberi kesan tindakan bermusuhan terhadap Israel.
theological_decisions:
- issue: Makna 'tidak mengenal Yahweh'
  choice: Membiarkan maknanya mencakup ketidaktahuan faktual, pengalaman, relasional, atau perjanjian
  alternative: tidak mengakui Yahweh / tidak setia kepada Yahweh
  rationale: יָדַע dapat memuat semua nuansa tersebut. Teks utama tidak mempersempitnya, sementara catatan kaki menjelaskan rentang maknanya.
- issue: Penyajian nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN / Yehuwa
  rationale: Transliterasi 'Yahweh' menyajikan nama ilahi secara langsung dan sesuai dengan lapisan konsultasi proyek.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Angkatan' dipilih untuk kohor antargenerasi dalam narasi, sedangkan idiom sumber dipertahankan dalam teks dan dijelaskan melalui catatan kaki.
