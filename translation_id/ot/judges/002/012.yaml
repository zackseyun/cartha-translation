  terminology: “Yahweh” tepat untuk יהוה; “Allah” tepat bagi Allah nenek moyang mereka; dan “ilah-ilah” secara konsisten membedakan allah lain tanpa menambahkan penilaian seperti “palsu.” Catatan kaki diperlukan pada frasa partitif “dari antara,” karena konstruksi מִן dapat pula dipahami lebih umum.
