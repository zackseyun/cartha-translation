id: JDG.2.12
reference: Judges 2:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּעַזְב֞וּ אֶת יְהוָ֣ה אֱלֹהֵ֣י אֲבוֹתָ֗/ם הַ/מּוֹצִ֣יא אוֹתָ/ם֮ מֵ/אֶ֣רֶץ מִצְרַיִם֒ וַ/יֵּלְכ֞וּ אַחֲרֵ֣י אֱלֹהִ֣ים אֲחֵרִ֗ים מֵ/אֱלֹהֵ֤י הָֽ/עַמִּים֙ אֲשֶׁר֙ סְבִיב֣וֹתֵי/הֶ֔ם וַ/יִּֽשְׁתַּחֲו֖וּ לָ/הֶ֑ם וַ/יַּכְעִ֖סוּ אֶת יְהוָֽה־׀׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/012.yaml
  text: And they abandoned Yahweh[a], the God of their fathers, who had brought them out from the land of Egypt, and went after other gods from among the gods of the peoples who were around them, and they bowed down to them and provoked Yahweh to anger.
translation:
  language: id
  text: Mereka meninggalkan Yahweh, Allah nenek moyang mereka, yang telah membawa mereka keluar dari tanah Mesir. Mereka mengikuti ilah-ilah lain dari antara ilah-ilah bangsa-bangsa di sekeliling mereka[a], lalu bersujud kepada ilah-ilah itu dan membuat Yahweh murka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ilah-ilah bangsa-bangsa di sekeliling mereka.” Frasa Ibrani ini juga dapat dipahami secara lebih umum sebagai ilah-ilah yang disembah oleh bangsa-bangsa di sekitar Israel.
    reason: alternatif_leksikal
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: meninggalkan
  rationale: Dalam konteks ini עזב menyatakan berpaling dan meninggalkan kesetiaan kepada Yahweh; “meninggalkan” alami dalam bahasa Indonesia dan tetap mempertahankan daya relasionalnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי אֲבוֹתָם
  choice: Allah nenek moyang mereka
  rationale: Ungkapan ini menunjuk kepada Allah yang disembah para leluhur Israel; “nenek moyang” merupakan padanan Indonesia yang alami bagi bentuk jamak maskulin generik dalam konteks silsilah umat.
- source_word: הַמּוֹצִיא אוֹתָם מֵאֶרֶץ מִצְרַיִם
  choice: yang telah membawa mereka keluar dari tanah Mesir
  rationale: Partisip berartikel menerangkan Yahweh melalui tindakan keluaran; “telah membawa” sesuai dengan urutan narasi dan “keluar dari tanah Mesir” mencerminkan preposisi sumber.
- source_word: וַיֵּלְכוּ אַחֲרֵי
  choice: mereka mengikuti
  rationale: Idiom harfiah “berjalan di belakang” di sini menyatakan mengikuti atau memberikan kesetiaan; “mengikuti” alami dan tepat dalam bahasa Indonesia.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ilah-ilah lain
  rationale: “Lain” menerjemahkan אֲחֵרִים secara langsung tanpa menambahkan gagasan “asing”; “ilah” membedakannya dari sebutan bagi Allah Israel.
- source_word: מֵאֱלֹהֵי הָעַמִּים אֲשֶׁר סְבִיבוֹתֵיהֶם
  choice: dari antara ilah-ilah bangsa-bangsa di sekeliling mereka
  rationale: 'מִן dipahami secara partitif: ilah-ilah yang mereka ikuti berasal dari kelompok ilah yang disembah bangsa-bangsa sekitar. “Dari antara” mempertahankan hubungan sintaksis itu.'
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: sujud menyembah ilah-ilah itu
  rationale: Kata kerja ini menggambarkan tindakan membungkuk atau bersujud yang dalam konteks ini merupakan penyembahan. “Sujud menyembah” mempertahankan tindakan konkret sekaligus makna kultisnya; nomina diulang agar rujukan pronomina tidak rancu.
- source_word: וַיַּכְעִסוּ אֶת יְהוָה
  choice: membangkitkan murka Yahweh
  rationale: Bentuk Hifil menyatakan menyebabkan atau memancing kemarahan. Idiom Indonesia ini menyampaikan daya kausatif secara wajar dan bermartabat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian secara langsung; transliterasi “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Makna kemurtadan Israel
  choice: Mempertahankan rangkaian meninggalkan, mengikuti, sujud menyembah, dan membangkitkan murka tanpa penjelasan doktrinal tambahan
  alternative: Menambahkan istilah seperti “melanggar perjanjian”
  rationale: Bahasa ayat itu sendiri sudah menyampaikan bobot relasional dan teologis kemurtadan Israel; penambahan istilah tafsiran tidak diperlukan.
- issue: Status ilah-ilah bangsa lain
  choice: ilah-ilah lain
  alternative: allah-allah palsu
  rationale: Teks menyebut אֱלֹהִים אֲחֵרִים, “ilah-ilah lain”, tanpa kata sifat “palsu”. Terjemahan tidak menambahkan penilaian ontologis yang tidak dinyatakan secara leksikal dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat panjang Ibrani dibagi menjadi dua kalimat agar mudah dipahami, sambil mempertahankan urutan tindakan dan hubungan antarklausa. “Allah” dipakai untuk Allah Israel, sedangkan “ilah-ilah” untuk dewa-dewa bangsa sekitar.
