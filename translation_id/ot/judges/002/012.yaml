revisions:
- from: Mereka meninggalkan Yahweh, Allah nenek moyang mereka, yang telah membawa mereka keluar dari tanah Mesir. Mereka mengikuti ilah-ilah lain dari antara ilah-ilah bangsa-bangsa di sekeliling mereka, lalu sujud menyembah ilah-ilah itu dan membangkitkan murka Yahweh.
  to: Mereka meninggalkan Yahweh, Allah nenek moyang mereka, yang telah membawa mereka keluar dari tanah Mesir. Mereka mengikuti ilah-ilah lain dari antara ilah-ilah bangsa-bangsa di sekeliling mereka[a], lalu bersujud kepada ilah-ilah itu dan membuat Yahweh murka.
  rationale: Revisi mengganti “sujud menyembah” dengan “bersujud kepada” agar tindakan yang dinyatakan kata kerja Ibrani tetap konkret tanpa penambahan eksplisit, serta mengganti idiom “membangkitkan murka Yahweh” dengan bentuk kausatif yang langsung. Catatan kaki ditambahkan untuk mencatat alternatif yang sah bagi konstruksi מִן, sementara terjemahan utama mempertahankan pembacaan partitif.
