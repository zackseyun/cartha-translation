id: JDG.2.3
reference: Judges 2:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/גַ֣ם אָמַ֔רְתִּי לֹֽא אֲגָרֵ֥שׁ אוֹתָ֖/ם מִ/פְּנֵי/כֶ֑ם וְ/הָי֤וּ לָ/כֶם֙ לְ/צִדִּ֔ים וֵ/אלֹ֣הֵי/הֶ֔ם יִהְי֥וּ לָ/כֶ֖ם לְ/מוֹקֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/003.yaml
  text: So I also said[a], ‘I will not drive them out from before you; they will become adversaries to you, and their gods will become a snare to you.’
translation:
  language: id
  text: Karena itu Aku juga berkata, “Aku tidak akan menghalau mereka dari hadapanmu. Mereka akan menjadi lawan bagimu,[a] dan ilah-ilah mereka akan menjadi jerat bagimu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani secara harfiah: “sisi-sisi.” Sejumlah versi kuno dan ayat-ayat paralel membaca atau menafsirkannya sebagai “duri di lambungmu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם אָמַרְתִּי
  choice: Karena itu Aku juga berkata
  rationale: וְגַם menghubungkan pernyataan ini dengan teguran sebelumnya serta dapat menyiratkan akibat. Ungkapan ini menyampaikan hubungan tersebut secara alami dalam bahasa Indonesia.
- source_word: לֹא אֲגָרֵשׁ אוֹתָם
  choice: Aku tidak akan menghalau mereka
  rationale: גרש berarti mengusir atau menghalau. 'Menghalau' sesuai dengan konteks penyingkiran bangsa-bangsa dari negeri itu.
- source_word: מִפְּנֵיכֶם
  choice: dari hadapanmu
  rationale: Mempertahankan idiom ruang Ibrani secara wajar dan bermartabat. Akhiran orang kedua jamak diterjemahkan dengan bentuk kolektif 'mu', karena yang disapa adalah Israel sebagai umat.
- source_word: וְהָיוּ לָכֶם לְצִדִּים
  choice: Mereka akan menjadi lawan bagimu
  rationale: Teks Masoret secara harfiah memuat 'sisi-sisi', suatu bacaan yang sulit. 'Lawan bagimu' menyampaikan makna permusuhan yang paling mungkin tanpa memasukkan kata 'duri' ke dalam teks utama; bentuk sulitnya dijelaskan dalam catatan kaki.
- source_word: וֵאלֹהֵיהֶם
  choice: dan ilah-ilah mereka
  rationale: Bentuk jamak dengan akhiran orang ketiga jamak menunjuk kepada dewa-dewa bangsa-bangsa itu. 'Ilah-ilah' jelas dalam konteks penyembahan berhala dan membedakannya dari sebutan bagi Allah Israel.
- source_word: יִהְיוּ לָכֶם לְמוֹקֵשׁ
  choice: akan menjadi jerat bagimu
  rationale: מוֹקֵשׁ adalah jerat atau perangkap, yang di sini menjadi metafora bagi bahaya rohani. 'Jerat' mempertahankan gambaran itu.
theological_decisions:
- issue: Bacaan sulit לְצִדִּים dalam Teks Masoret
  choice: lawan bagimu
  alternative: duri di lambungmu; sisi-sisi bagimu
  rationale: Teks sumber berbunyi harfiah 'sisi-sisi', bukan 'duri'. Terjemahan utama mengungkapkan makna permusuhan yang mungkin dimaksud tanpa mengharmoniskannya secara diam-diam dengan versi kuno atau ayat paralel. Catatan kaki mempertahankan ketegangan tekstual tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang lugas dan bermartabat. Kata ganti ilahi ditulis dengan huruf kapital. Bentuk 'mu' dipakai secara kolektif untuk sapaan kepada Israel; bahasa Indonesia tidak membedakan tunggal dan jamak dalam bentuk ini. Penanda catatan ditempatkan langsung sesudah frasa yang dijelaskan.
