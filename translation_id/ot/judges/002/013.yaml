  yaml_path: translation/ot/judges/002/013.yaml
  text: They abandoned Yahweh and served Baal and the Ashtoreths[a][b][c].
translation:
  language: id
  text: Mereka meninggalkan Yahweh dan beribadah kepada Baal serta para Asytoret.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melayani Baal serta para Asytoret.”
    reason: lexical_alternative
  - marker: b
    text: Ibrani “para Asytoret”; bentuknya jamak dan mungkin merujuk kepada berbagai manifestasi atau patung dewi yang juga dikenal sebagai Asytoret atau Astarte.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: meninggalkan
  rationale: Kata עזב berarti meninggalkan atau menelantarkan. “Meninggalkan” alami dalam bahasa Indonesia dan, dalam konteks ini, tetap menyampaikan ketidaksetiaan Israel kepada Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar “TUHAN”.
- source_word: וַיַּעַבְדוּ
  choice: beribadah kepada
  rationale: Kata עבד dapat berarti melayani dan, ketika objeknya dewa, beribadah atau menyembah. “Beribadah kepada” menyatakan makna kultis konteks ini secara wajar tanpa membatasi tindakan itu hanya pada sikap batin.
- source_word: לַבַּעַל
  choice: Baal
  rationale: Meskipun bentuk Ibraninya memakai kata sandang, “Baal” merupakan bentuk nama yang paling alami dalam bahasa Indonesia.
- source_word: וְלָעַשְׁתָּרוֹת
  choice: dewi-dewi Asytoret
  rationale: Bentuk עשתרות bersifat jamak. “Dewi-dewi Asytoret” mempertahankan kejamakan itu dalam bahasa Indonesia yang jelas, tanpa menentukan apakah yang dimaksud ialah sejumlah dewi, manifestasi setempat, atau patung-patungnya.
theological_decisions:
- issue: Ke jamakan bentuk עשתרות
  choice: dewi-dewi Asytoret
  alternative: Asytoret; patung-patung Asytoret; berbagai wujud Asytoret
  rationale: Teks utama mempertahankan bentuk jamak Ibrani, sedangkan catatan menjelaskan bahwa rujukannya dapat mencakup berbagai manifestasi atau patung dewi yang dikenal sebagai Asytoret/Astarte.
- issue: Nuansa kultis kata עבד
  choice: beribadah kepada
  alternative: melayani; menyembah
  rationale: Karena objeknya adalah Baal dan dewi-dewi Asytoret, kata kerja ini jelas digunakan dalam arti pelayanan religius. Pilihan ini alami dalam bahasa Indonesia dan tidak menghilangkan unsur pengabdian yang terkandung dalam עבד.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Nama ilahi dipertahankan sebagai Yahweh; istilah keagamaan dibuat jelas bagi pembaca umum, dan kejamakan עשתרות tidak diratakan menjadi nama tunggal.
