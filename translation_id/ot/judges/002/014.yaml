  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/יִשְׂרָאֵ֔ל וַֽ/יִּתְּנֵ/ם֙ בְּ/יַד שֹׁסִ֔ים וַ/יָּשֹׁ֖סּוּ אוֹתָ֑/ם וַֽ/יִּמְכְּרֵ֞/ם בְּ/יַ֤ד אֽוֹיְבֵי/הֶם֙ מִ/סָּבִ֔יב וְ/לֹֽא יָכְל֣וּ ע֔וֹד לַ/עֲמֹ֖ד לִ/פְנֵ֥י אוֹיְבֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/014.yaml
  text: Then the anger of Yahweh burned against Israel[a], and he gave them into the hand of plunderers, who plundered them. He sold them into the hand of their enemies all around[c][b], so that they could no longer stand before their enemies.
translation:
  language: id
  text: Maka murka Yahweh menyala terhadap Israel,[a] dan Ia menyerahkan mereka ke dalam tangan para penjarah, yang menjarah mereka. Ia menjual mereka ke dalam tangan musuh-musuh di sekeliling mereka,[b] sehingga mereka tidak sanggup lagi bertahan menghadapi musuh-musuh mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Yahweh menjadi murka terhadap Israel.”
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “ke dalam tangan” berarti ke bawah kuasa atau kendali pihak lain.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: murka ... menyala
  rationale: Mempertahankan metafora Ibrani tentang murka yang menyala dengan ungkapan Indonesia yang alami dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks sumber, bukan menggantinya dengan gelar.
- source_word: וַיִּתְּנֵם בְּיַד
  choice: Ia menyerahkan mereka ke dalam tangan
  rationale: Mempertahankan idiom konkret Ibrani yang menyatakan penyerahan ke bawah kuasa pihak lain dan masih dapat dipahami dalam bahasa Indonesia.
- source_word: שֹׁסִים ... וַיָּשֹׁסּוּ
  choice: para penjarah, yang menjarah mereka
  rationale: Menjaga kaitan akar kata antara pelaku dan tindakan dalam teks Ibrani.
- source_word: וַיִּמְכְּרֵם
  choice: Ia menjual mereka
  rationale: Menerjemahkan verba secara konkret dan mempertahankan kerasnya gambaran penghukuman.
- source_word: אֹיְבֵיהֶם מִסָּבִיב
  choice: musuh-musuh di sekeliling mereka
  rationale: Menyampaikan bahwa musuh berada di berbagai sisi tanpa menentukan apakah Israel sepenuhnya terkepung.
- source_word: וְלֹא יָכְלוּ עוֹד לַעֲמֹד לִפְנֵי
  choice: mereka tidak sanggup lagi bertahan menghadapi
  rationale: Mengungkapkan makna ketidakmampuan mempertahankan kedudukan di hadapan lawan dalam bahasa Indonesia yang alami.
theological_decisions:
- issue: Bahasa antropopatik tentang murka ilahi
  choice: murka Yahweh menyala terhadap Israel
  alternative: Yahweh menjadi murka terhadap Israel
  rationale: Pilihan ini mempertahankan metafora hidup dalam bahasa Ibrani tanpa menambahkan penjelasan teologis yang tidak dinyatakan teks.
- issue: Metafora penjualan sebagai tindakan penghukuman
  choice: Ia menjual mereka
  alternative: Ia menyerahkan mereka
  rationale: Mempertahankan metafora sumber dan ketegangan teologis bahwa Yahweh secara aktif menyerahkan Israel kepada musuh sebagai penghukuman.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama ilahi dipertahankan sebagai “Yahweh”. Struktur Ibrani dipertahankan bila tetap jelas, sedangkan frasa penutup dibuat idiomatis dengan “bertahan menghadapi”.
