base_translation:
  language: en
  yaml_path: translation/ot/judges/002/023.yaml
  text: So Yahweh left these nations[a], not driving them out quickly, and he did not give them into the hand of Joshua.
translation:
  language: id
  text: Maka Yahweh membiarkan bangsa-bangsa itu tetap ada[a], tanpa segera menghalau mereka, dan Ia tidak menyerahkan mereka ke dalam tangan Yosua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “meninggalkan bangsa-bangsa itu”; kata Ibrani ini dapat berarti “membiarkan tetap berada” atau “meninggalkan di tempatnya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנַּח
  choice: membiarkan ... tetap ada
  rationale: Bentuk kausatif dari נוח menyatakan membiarkan tetap berada atau meninggalkan tanpa disingkirkan. Ungkapan ini alami dalam bahasa Indonesia dan sesuai dengan konteks bangsa-bangsa yang masih berada di Kanaan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: bangsa-bangsa itu
  rationale: גּוֹיִם merujuk kepada kelompok-kelompok bangsa yang masih tinggal di Kanaan; 'bangsa-bangsa' merupakan padanan Indonesia yang lazim.
- source_word: לְבִלְתִּי הוֹרִישָׁם מַהֵר
  choice: dengan tidak segera menghalau mereka
  rationale: Klausa infinitif negatif dapat menyatakan cara, hasil, atau tujuan. Terjemahan ini mempertahankan hubungannya dengan tindakan membiarkan tanpa memaksakan tujuan yang lebih tegas daripada teks sumber.
- source_word: וְלֹא נְתָנָם
  choice: Ia tidak menyerahkan mereka
  rationale: נתן dengan pelengkap 'ke dalam tangan' merupakan ungkapan penyerahan ke bawah kuasa seseorang; 'menyerahkan' menyampaikan makna tersebut secara wajar.
- source_word: בְּיַד יְהוֹשֻׁעַ
  choice: ke dalam tangan Yosua
  rationale: Mempertahankan citra idiom Ibrani tentang kuasa atau kendali, yang tetap dapat dipahami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi Allah; bentuk 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Tetap ada' dipakai agar konstruksi 'membiarkan' lengkap dan alami, sedangkan catatan kaki mempertahankan kemungkinan terjemahan yang lebih harfiah. Huruf kapital pada 'Ia' mengikuti kebiasaan penghormatan kepada Allah tanpa mengubah makna sumber.
