  text: וַ/יִּֽחַר אַ֥ף יְהוָ֖ה בְּ/יִשְׂרָאֵ֑ל וַ/יֹּ֗אמֶר יַעַן֩ אֲשֶׁ֨ר עָבְר֜וּ הַ/גּ֣וֹי הַ/זֶּ֗ה אֶת בְּרִיתִ/י֙ אֲשֶׁ֣ר צִוִּ֣יתִי אֶת אֲבוֹתָ֔/ם וְ/לֹ֥א שָׁמְע֖וּ לְ/קוֹלִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/020.yaml
  text: So the anger of Yahweh burned against Israel[a], and he said, “Because this nation has transgressed my covenant that I commanded their fathers[b], and they have not listened to my voice,”
translation:
  language: id
  text: Maka murka Yahweh menyala terhadap Israel. Ia berfirman, “Karena bangsa ini telah melanggar[a] perjanjian-Ku yang Kuperintahkan kepada nenek moyang mereka dan tidak mendengarkan suara-Ku[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “mengingkari perjanjian-Ku”. Kata kerja Ibrani ini secara harfiah berarti “menyeberangi” atau “melampaui”; dalam konteks perjanjian, kata ini berarti melanggar.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “tidak menaati suara-Ku”. Ungkapan Ibrani “mendengarkan suara” sering mencakup arti mengindahkan dan menaati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: menyala-nyalalah murka
  rationale: Ungkapan Ibrani menggambarkan murka sebagai sesuatu yang menyala atau menjadi panas. Bentuk ini mempertahankan metafora sumber sekaligus tetap wajar dalam bahasa Indonesia yang bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap terlihat.
- source_word: בְּיִשְׂרָאֵל
  choice: terhadap Israel
  rationale: Dalam konstruksi yang menyatakan kemarahan, preposisi ב menandai pihak yang menjadi sasaran murka; “terhadap Israel” alami dan tepat dalam bahasa Indonesia.
- source_word: יַעַן אֲשֶׁר
  choice: Karena
  rationale: Gabungan ini memperkenalkan alasan bagi pernyataan ilahi; “Karena” ringkas dan sesuai.
- source_word: עָבְרוּ
  choice: telah melanggar
  rationale: Dengan objek “perjanjian”, verba עבר menyatakan tindakan melampaui batas atau melanggar kewajiban perjanjian. “Melanggar” mempertahankan bobot moral dan yuridisnya.
- source_word: הַגּוֹי הַזֶּה
  choice: bangsa ini
  rationale: גוי secara langsung berarti “bangsa”. Pilihan ini mempertahankan istilah sumber yang ditandai, alih-alih meratakannya menjadi “umat” atau “orang-orang”.
- source_word: בְּרִיתִי
  choice: perjanjian-Ku
  rationale: “Perjanjian” merupakan padanan baku dan tepat bagi ברית dalam hubungan Yahweh dengan Israel.
- source_word: צִוִּיתִי אֶת אֲבוֹתָם
  choice: yang Kuperintahkan kepada nenek moyang mereka
  rationale: Konstruksi Ibraninya padat dan menyatakan bahwa perjanjian itu diperintahkan kepada para leluhur mereka. Terjemahan ini setia sekaligus idiomatis.
- source_word: שָׁמְעוּ לְקוֹלִי
  choice: tidak mendengarkan suara-Ku
  rationale: Idiom ini mencakup tindakan mendengar sekaligus mengindahkan atau menaati. Terjemahan utama mempertahankan citra suara dari teks sumber tanpa meniadakan nuansa ketaatan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. Transliterasi “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan sebuah gelar.
- issue: Bahasa pelanggaran perjanjian
  choice: telah melanggar perjanjian-Ku
  alternative: telah mengingkari perjanjian-Ku; telah merusak perjanjian-Ku
  rationale: Pilihan ini mempertahankan kerangka perjanjian dan daya yuridis-moral verba sumber tanpa memperluasnya menjadi penafsiran doktrinal tertentu.
- issue: Nuansa mendengar dan menaati dalam שָׁמְעוּ לְקוֹלִי
  choice: tidak mendengarkan suara-Ku
  alternative: tidak menaati suara-Ku
  rationale: Terjemahan utama mempertahankan metafora pendengaran dan ketegangan antara mendengar serta mengindahkan; catatan kaki menyatakan nuansa ketaatan yang terkandung dalam idiom tersebut.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Metafora murka yang menyala serta ungkapan “mendengarkan suara-Ku” dipertahankan karena keduanya jelas bagi pembaca umum dan membawa tekstur teks Ibrani. Kapitalisasi pronomina ilahi mengikuti kelaziman penerbitan Alkitab bahasa Indonesia. Tanda koma penutup dipertahankan karena ayat ini berlanjut secara sintaksis ke ayat berikutnya.
