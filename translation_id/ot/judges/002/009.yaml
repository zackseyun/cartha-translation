  text: And they buried him within the territory of his inheritance[a], in Timnath-heres, in the hill country of Ephraim, north of Mount Gaash.
translation:
  language: id
  text: Lalu mereka menguburkan dia di wilayah pusakanya, di Timnat-Heres[a], di pegunungan Efraim, di sebelah utara Gunung Gaas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yosua 24:30 memakai nama “Timnat-Serah”, bukan “Timnat-Heres”. Perbedaan nama tempat dalam kedua catatan pemakaman yang sejajar ini dipertahankan.
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: Lalu mereka menguburkan dia
  rationale: Bentuk wayyiqtol melanjutkan alur narasi dengan peristiwa lampau. 'Lalu' wajar dalam narasi Indonesia, dan אֹתוֹ dinyatakan dengan 'dia', merujuk kepada Yosua dalam konteks.
- source_word: בִּגְבוּל נַחֲלָתוֹ
  choice: di wilayah milik pusakanya
  rationale: גְּבוּל di sini menunjuk pada wilayah, bukan sekadar garis perbatasan, sedangkan נַחֲלָה menyatakan milik pusaka atau bagian tanah yang diterima. Ungkapan ini mempertahankan nuansa pembagian tanah secara alami.
- source_word: בְּתִמְנַת חֶרֶס
  choice: di Timnat-Heres
  rationale: Nama tempat ditransliterasikan dalam bentuk yang sesuai dengan ejaan Indonesia; preposisi בְּ diterjemahkan 'di'.
- source_word: בְּהַר אֶפְרָיִם
  choice: di pegunungan Efraim
  rationale: Dalam ungkapan geografis ini, הַר menunjuk pada kawasan perbukitan atau pegunungan, bukan satu gunung tertentu. 'Pegunungan Efraim' merupakan bentuk geografis yang ringkas dan alami.
- source_word: מִצְּפוֹן לְהַר גָּעַשׁ
  choice: di sebelah utara Gunung Gaas
  rationale: Konstruksi ini menyatakan letak relatif terhadap Gunung Gaas. 'Di sebelah utara' jelas dan idiomatis dalam bahasa Indonesia.
