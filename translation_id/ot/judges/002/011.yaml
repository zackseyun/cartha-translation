id: JDG.2.11
reference: Judges 2:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יַּעַבְד֖וּ אֶת הַ/בְּעָלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/011.yaml
  text: And the sons of Israel did what was evil in the sight of Yahweh[b][a], and they served the Baals.
translation:
  language: id
  text: Lalu orang Israel melakukan apa yang jahat di mata Yahweh dan beribadah kepada para Baal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “melayani para Baal.” Kata Ibrani yang dipakai dapat berarti melayani, termasuk pelayanan yang diberikan dalam ibadah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: melakukan
  rationale: Berasal dari עשה, verba umum 'melakukan/membuat'. Dalam ungkapan ini, 'melakukan apa yang jahat' merupakan padanan Indonesia yang alami.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah berarti 'anak-anak lelaki Israel', tetapi dalam konteks ini menunjuk kepada bangsa Israel secara kolektif. 'Orang Israel' jelas, alami, dan tidak membatasi rujukan hanya kepada laki-laki.
- source_word: אֶת הָרַע
  choice: apa yang jahat
  rationale: Ungkapan Ibrani harfiah 'melakukan yang jahat' dialihkan menjadi bentuk Indonesia yang alami sambil mempertahankan penilaian moralnya.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Mempertahankan metafora Ibrani tentang penilaian ilahi; ungkapan 'di mata' lazim dan mudah dipahami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: וַיַּעַבְדוּ
  choice: beribadah kepada
  rationale: Verba עבד secara dasar berarti 'melayani', tetapi dalam konstruksi dengan dewa sebagai objek, konteksnya menyatakan pelayanan kultis atau ibadah. Pilihan ini alami dalam bahasa Indonesia; nuansa harfiah dicatat dalam catatan kaki.
- source_word: הַבְּעָלִים
  choice: para Baal
  rationale: Bentuk Ibrani ini jamak. 'Para Baal' mempertahankan rujukan kepada berbagai perwujudan atau kultus lokal Baal tanpa menjadikannya tunggal.
theological_decisions:
- issue: Penerjemahan nama perjanjian יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung. 'Yahweh' mempertahankan nama itu dan membedakannya dari sebuah gelar.
- issue: Makna עבד dalam konteks penyembahan berhala
  choice: beribadah kepada
  alternative: melayani
  rationale: Konteks dewa-dewa sebagai objek menunjukkan pelayanan kultis. 'Beribadah kepada' menyampaikan maksud kontekstual dengan jelas, sedangkan alternatif harfiahnya tetap diberikan agar keluasan leksikal verba tidak hilang.
- issue: Bentuk jamak הַבְּעָלִים
  choice: para Baal
  alternative: Baal
  rationale: Bentuk jamak dalam sumber dipertahankan dan tidak diseragamkan menjadi nama ilah tunggal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Lalu' meneruskan alur narasi; 'orang Israel' dipilih sebagai sebutan kolektif yang alami. Metafora 'di mata Yahweh' serta bentuk jamak 'para Baal' dipertahankan.
