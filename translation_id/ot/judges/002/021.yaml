  text: גַּם אֲנִי֙ לֹ֣א אוֹסִ֔יף לְ/הוֹרִ֥ישׁ אִ֖ישׁ מִ/פְּנֵי/הֶ֑ם מִן הַ/גּוֹיִ֛ם אֲשֶׁר עָזַ֥ב יְהוֹשֻׁ֖עַ וַ/יָּמֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/021.yaml
  text: I also will no longer continue to drive out before them any of the nations that Joshua left when he died[a].
translation:
  language: id
  text: Aku pun tidak akan lagi menghalau dari hadapan mereka satu pun dari bangsa-bangsa yang ditinggalkan Yosua ketika ia meninggal.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku pun tidak akan lagi menghalau dari hadapan mereka satu pun dari bangsa-bangsa yang ditinggalkan Yosua, lalu ia meninggal.” Secara lebih harfiah, bahasa Ibraninya berbunyi “dan ia meninggal”; “ketika ia meninggal” menyatakan hubungan waktunya dalam bahasa Indonesia yang lebih lancar.
    reason: Alternatif sintaksis dan terjemahan yang lebih harfiah untuk וַיָּמֹת.
lexical_decisions:
- source_word: גַּם אֲנִי
  choice: Aku pun
  rationale: Gabungan גַּם dengan pronomina mandiri menegaskan kelanjutan dan keterlibatan sang pembicara; “Aku pun” alami dalam bahasa Indonesia serta mempertahankan penekanannya.
- source_word: לֹא אוֹסִיף לְהוֹרִישׁ
  choice: tidak akan lagi menghalau
  rationale: Dalam konstruksi negatif, יסף bentuk Hifil yang diikuti infinitif menyatakan penghentian tindakan, sedangkan הורישׁ dalam konteks penaklukan berarti mengusir atau menghalau penduduk dari wilayah mereka. Ungkapan ini menyampaikan makna tersebut secara alami tanpa pengulangan yang kaku.
- source_word: אִישׁ ... מִן הַגּוֹיִם
  choice: satu pun dari bangsa-bangsa
  rationale: אִישׁ berfungsi secara distributif atau intensif, dan מִן menyatakan bagian dari suatu kelompok. “Satu pun dari bangsa-bangsa” mempertahankan penekanan bahwa tidak ada satu bangsa pun yang akan dihalau.
- source_word: מִפְּנֵיהֶם
  choice: dari hadapan mereka
  rationale: Ungkapan dengan פָּנִים berarti menyingkirkan sesuatu dari hadapan atau keberadaan seseorang. Bentuk ini mempertahankan citra Ibrani dan tetap dapat dipahami dalam bahasa Indonesia.
- source_word: אֲשֶׁר עָזַב יְהוֹשֻׁעַ
  choice: yang ditinggalkan Yosua
  rationale: עזב berarti meninggalkan atau membiarkan tetap ada. Terjemahan ini ringkas dan mengidentifikasi bangsa-bangsa yang masih tersisa sesudah masa Yosua.
- source_word: וַיָּמֹת
  choice: ketika ia meninggal
  rationale: Secara bentuk klausa ini berbunyi “dan ia meninggal,” tetapi dalam hubungan wacana dapat menyatakan waktu. “Ketika ia meninggal” membuat hubungan temporal itu alami dalam bahasa Indonesia, sementara bentuk yang lebih harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Identitas pembicara ilahi dalam bentuk orang pertama
  choice: Mempertahankan “Aku” tanpa menambahkan “TUHAN”
  alternative: Menambahkan “TUHAN” demi kejelasan
  rationale: Teks Ibrani memakai orang pertama tunggal tanpa mengulang nama ilahi dalam ayat ini. Konteks telah menetapkan pembicaranya, sehingga penambahan nama ilahi tidak diperlukan.
- issue: Hubungan וַיָּמֹת dengan klausa sebelumnya
  choice: 'Memahaminya secara temporal: “ketika ia meninggal”'
  alternative: 'Menerjemahkan secara koordinatif: “dan ia meninggal”'
  rationale: Hubungan temporal sesuai dengan konteks dan menghasilkan bahasa Indonesia yang lancar, tetapi bentuk koordinatif Ibraninya tetap disajikan dalam catatan kaki agar ambiguitas sintaksis tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. “Aku” mempertahankan tuturan langsung ilahi, “menghalau” cocok dengan konteks penyingkiran bangsa-bangsa, dan “satu pun” menyampaikan penekanan distributif secara alami.
