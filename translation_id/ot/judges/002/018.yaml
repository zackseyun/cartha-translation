  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/כִֽי הֵקִ֨ים יְהוָ֥ה לָ/הֶם֮ שֹֽׁפְטִים֒ וְ/הָיָ֤ה יְהוָה֙ עִם הַ/שֹּׁפֵ֔ט וְ/הֽוֹשִׁיעָ/ם֙ מִ/יַּ֣ד אֹֽיְבֵי/הֶ֔ם כֹּ֖ל יְמֵ֣י הַ/שּׁוֹפֵ֑ט כִּֽי יִנָּחֵ֤ם יְהוָה֙ מִ/נַּֽאֲקָתָ֔/ם מִ/פְּנֵ֥י לֹחֲצֵי/הֶ֖ם וְ/דֹחֲקֵי/הֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/018.yaml
  text: Whenever Yahweh raised up judges for them[a], Yahweh was with the judge and saved them from the hand of their enemies all the days of the judge, for Yahweh was moved to pity by their groaning because of those who oppressed and afflicted them.
translation:
  language: id
  text: Setiap kali Yahweh membangkitkan hakim-hakim bagi mereka, Yahweh menyertai hakim itu dan menyelamatkan mereka dari tangan musuh-musuh mereka selama hakim itu hidup. Sebab Yahweh berbelaskasihan[a] karena keluhan mereka akibat orang-orang yang menindas dan menekan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “berubah sikap” atau “menaruh belas kasihan.” Kata kerja Ibrani ini dapat menyatakan perubahan sikap maupun tanggapan penuh belas kasihan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Setiap kali
  rationale: Dalam ringkasan tentang pola yang berulang ini, ungkapan tersebut paling tepat dipahami secara temporal dan iteratif.
- source_word: הֵקִים
  choice: membangkitkan
  rationale: Mempertahankan gambaran idiom Ibrani tentang prakarsa ilahi dalam menghadirkan para hakim.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar.
- source_word: שֹׁפְטִים
  choice: hakim-hakim
  rationale: Istilah baku untuk para pemimpin dalam kitab Hakim-Hakim; fungsi penyelamatan mereka dinyatakan oleh verba berikutnya.
- source_word: וְהָיָה יְהוָה עִם הַשֹּׁפֵט
  choice: Yahweh menyertai hakim itu
  rationale: Ungkapan Indonesia yang alami untuk kehadiran dan dukungan ilahi tanpa menambahkan tafsiran.
- source_word: וְהוֹשִׁיעָם
  choice: menyelamatkan mereka
  rationale: Hifil dari ישׁע menyatakan tindakan membebaskan atau menyelamatkan dari kuasa musuh.
- source_word: מִיַּד אֹיְבֵיהֶם
  choice: dari tangan musuh-musuh mereka
  rationale: Mempertahankan idiom konkret Ibrani yang tetap mudah dipahami dalam bahasa Indonesia.
- source_word: כֹּל יְמֵי הַשּׁוֹפֵט
  choice: selama hakim itu hidup
  rationale: Menyampaikan secara alami rentang masa sang hakim yang dimaksud oleh ungkapan Ibrani.
- source_word: יִנָּחֵם
  choice: tergerak oleh belas kasihan
  rationale: Dalam konteks ini bentuk Nifal dari נחם menyatakan tanggapan belas kasihan Yahweh terhadap penderitaan umat, sambil tetap mengakui kemungkinan nuansa 'mengurungkan' atau 'berubah sikap'.
- source_word: מִנַּאֲקָתָם
  choice: ketika mendengar keluhan mereka
  rationale: Menjadikan hubungan sebab atau pemicu tanggapan Yahweh jelas dan alami dalam bahasa Indonesia; unsur 'mendengar' tersirat secara kontekstual, bukan dinyatakan sebagai verba tersendiri dalam Ibrani.
- source_word: מִפְּנֵי לֹחֲצֵיהֶם וְדֹחֲקֵיהֶם
  choice: akibat orang-orang yang menindas dan mendesak mereka
  rationale: Mempertahankan dua partisip aktif dan hubungan kausal; 'mendesak' menjaga pembedaan leksikal tanpa menentukan lebih jauh bentuk tekanan tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri; transliterasi mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Bahasa antropopatik dalam יִנָּחֵם יְהוָה
  choice: Yahweh tergerak oleh belas kasihan
  alternative: Yahweh mengurungkan niat-Nya atau Yahweh berbelaskasihan
  rationale: Pilihan utama menyampaikan tanggapan penuh belas kasihan terhadap penderitaan Israel tanpa menyiratkan pertobatan dari kesalahan; catatan kaki mempertahankan rentang makna verba yang dapat mencakup perubahan sikap atau tindakan.
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. Struktur berulang dipertahankan dengan “Setiap kali”; idiom utama Ibrani dipertahankan bila tetap jelas bagi pembaca umum.
