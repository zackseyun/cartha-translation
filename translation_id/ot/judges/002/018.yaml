revisions:
- from: Setiap kali Yahweh membangkitkan hakim-hakim bagi mereka, Yahweh menyertai hakim itu dan menyelamatkan mereka dari tangan musuh-musuh mereka selama hakim itu hidup. Sebab, Yahweh tergerak oleh belas kasihan[a] ketika mendengar keluhan mereka akibat orang-orang yang menindas dan mendesak mereka.
  to: Setiap kali Yahweh membangkitkan hakim-hakim bagi mereka, Yahweh menyertai hakim itu dan menyelamatkan mereka dari tangan musuh-musuh mereka selama hakim itu hidup. Sebab Yahweh berbelaskasihan[a] karena keluhan mereka akibat orang-orang yang menindas dan menekan mereka.
