base_translation:
  language: en
  yaml_path: translation/ot/judges/002/002.yaml
  text: And you were not to make a covenant with the inhabitants of this land; you were to tear down their altars[a]. But you have not listened to my voice. What is this you have done?
translation:
  language: id
  text: Kamu tidak boleh mengikat perjanjian[a] dengan penduduk negeri ini, dan mezbah-mezbah mereka harus kamu robohkan. Namun, kamu tidak mendengarkan suara-Ku. Apa yang telah kamu lakukan ini?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah dalam bahasa Ibrani: “memotong perjanjian.”'
    reason: Menjelaskan idiom Ibrani yang diterjemahkan secara alami sebagai ‘mengikat perjanjian’.
lexical_decisions:
- source_word: תִכְרְתוּ בְרִית
  choice: mengikat perjanjian
  rationale: Ungkapan Ibrani secara harfiah memakai kata kerja ‘memotong’ bersama ‘perjanjian’. Dalam bahasa Indonesia, ‘mengikat perjanjian’ adalah padanan idiomatis yang mempertahankan gagasan perjanjian dan lebih luas daripada sekadar persekutuan politik.
- source_word: לְיֹשְׁבֵי הָאָרֶץ הַזֹּאת
  choice: dengan penduduk negeri ini
  rationale: Bentuk partisipial substantif menunjuk kepada orang-orang yang mendiami negeri itu. ‘Penduduk negeri ini’ ringkas, alami, dan mempertahankan unsur penunjuk ‘ini’.
- source_word: מִזְבְּחוֹתֵיהֶם תִּתֹּצוּן
  choice: mezbah-mezbah mereka harus kamu robohkan
  rationale: נתץ berarti merobohkan atau menghancurkan bangunan, termasuk mezbah. Susunan ini menyatakan kewajiban yang diperintahkan sebelumnya sambil tetap terdengar alami dalam teguran retrospektif.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקֹלִי
  choice: Namun, kamu tidak mendengarkan suara-Ku
  rationale: שמע dengan בְּקוֹל mencakup mendengar yang semestinya menghasilkan ketaatan. Terjemahan ini mempertahankan citra ‘suara-Ku’ dan membiarkan implikasi ketidaktaatan muncul dari konteks.
- source_word: מַה זֹּאת עֲשִׂיתֶם
  choice: Apa yang telah kamu lakukan ini?
  rationale: Bentuk pertanyaan Ibrani mengungkapkan keterkejutan dan teguran atas tindakan Israel. Padanan ini tidak mengubah pertanyaan tentang tindakan menjadi pertanyaan tentang alasan.
- source_word: וְאַתֶּם לֹא ... תִּכְרְתוּ ... תִּתֹּצוּן
  choice: Kamu tidak boleh ... harus kamu robohkan
  rationale: Bentuk-bentuk imperfek mengingatkan kembali perintah ilahi dan diikuti pernyataan bahwa Israel gagal menaatinya. ‘Tidak boleh’ dan ‘harus’ menyampaikan daya wajib perintah tersebut dengan alami.
theological_decisions:
- issue: Istilah bagi hubungan terlarang antara Israel dan penduduk Kanaan
  choice: mengikat perjanjian
  alternative: mengadakan persekutuan atau perjanjian politik
  rationale: בְּרִית adalah istilah yang lebih luas daripada perjanjian politik belaka. ‘Perjanjian’ mempertahankan kategori teologis dan relasional dalam teks tanpa mempersempitnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada teguran yang tegas dan bermartabat. Bentuk jamak ‘kamu’ tidak dibedakan secara morfologis dalam bahasa Indonesia, tetapi konteks menunjukkan bahwa seluruh umat Israel sedang disapa.
