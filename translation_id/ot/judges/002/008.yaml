  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּ֛מָת יְהוֹשֻׁ֥עַ בִּן נ֖וּן עֶ֣בֶד יְהוָ֑ה בֶּן מֵאָ֥ה וָ/עֶ֖שֶׂר שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/008.yaml
  text: And Joshua son of Nun[a], the servant of Yahweh, died at the age of one hundred and ten years.
translation:
  language: id
  text: Lalu Yosua bin Nun, hamba[a] Yahweh, meninggal pada usia seratus sepuluh tahun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “budak Yahweh.” Kata Ibrani ini dapat berarti “hamba” maupun “budak”; di sini kata itu dipakai sebagai gelar kehormatan bagi Yosua.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: Lalu ... meninggal
  rationale: Bentuk wayyiqtol melanjutkan rangkaian narasi. “Lalu” menyampaikan kesinambungan peristiwa secara alami dalam bahasa Indonesia, sedangkan “meninggal” merupakan padanan yang wajar dan bermartabat.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: בִּן נוּן
  choice: bin Nun
  rationale: Rangkaian konstruksi ini menyatakan hubungan ayah-anak. “Bin Nun” ringkas, jelas, dan lazim dalam ragam Indonesia untuk nama tokoh Alkitab.
- source_word: עֶבֶד יְהוָה
  choice: hamba Yahweh
  rationale: עֶבֶד dapat berarti hamba atau budak. Dalam konteks ini kata tersebut berfungsi sebagai gelar kehormatan bagi Yosua dalam hubungannya dengan Yahweh; “hamba” mempertahankan martabat gelar itu tanpa menghapus kemungkinan makna status yang lebih kuat, yang dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks Ibrani dipertahankan sebagai nama diri, bukan diganti dengan gelar “TUHAN”.
- source_word: בֶּן מֵאָה וָעֶשֶׂר שָׁנִים
  choice: pada usia seratus sepuluh tahun
  rationale: Ungkapan usia Ibrani secara harfiah memakai “anak dari”, tetapi bahasa Indonesia modern secara alami menyatakannya dengan “pada usia”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan fungsi nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Penerjemahan עֶבֶד sebagai gelar Yosua
  choice: hamba
  alternative: budak
  rationale: Kata Ibrani mencakup kedua kemungkinan tersebut, tetapi di sini berfungsi sebagai gelar kehormatan bagi Yosua. “Hamba” paling sesuai dalam teks utama, sementara alternatif yang lebih menonjolkan keterikatan status dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. “Lalu” menjaga alur naratif; “bin Nun” mempertahankan bentuk patronimik yang ringkas dan dikenal; nama ilahi ditulis “Yahweh.”
