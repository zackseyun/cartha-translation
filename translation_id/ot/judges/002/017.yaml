  source_fidelity: 'Struktur dan isi ayat pada dasarnya setia pada Ibrani: penegasan ''bahkan'', penolakan untuk mendengarkan para hakim, penyimpangan yang cepat, metafora jalan, dan kontras dengan ketaatan nenek moyang semuanya terpelihara. Namun, ''berzina dengan mengikuti'' kurang jelas dan kurang alami untuk metafora זָנוּ אַחֲרֵי; ''melacurkan diri dengan mengikuti'' menyampaikan metafora ketidaksetiaan seksual dan hubungan ''mengikuti'' secara lebih langsung.'
