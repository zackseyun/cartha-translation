id: JDG.2.17
reference: Judges 2:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/גַ֤ם אֶל שֹֽׁפְטֵי/הֶם֙ לֹ֣א שָׁמֵ֔עוּ כִּ֣י זָנ֗וּ אַֽחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַ/יִּֽשְׁתַּחֲו֖וּ לָ/הֶ֑ם סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֜רֶךְ אֲשֶׁ֨ר הָלְכ֧וּ אֲבוֹתָ֛/ם לִ/שְׁמֹ֥עַ מִצְוֺת יְהוָ֖ה לֹא עָ֥שׂוּ כֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/017.yaml
  text: Yet they did not listen even to their judges[a], for they prostituted themselves after other gods and bowed down to them. They quickly turned aside from the way in which their fathers had walked in obeying the commandments of Yahweh; they did not do so.
translation:
  language: id
  text: Namun, mereka bahkan tidak mendengarkan para hakim mereka, sebab mereka melacurkan diri dengan mengikuti ilah-ilah lain[a] dan bersujud menyembah mereka. Mereka segera menyimpang dari jalan yang ditempuh nenek moyang mereka dalam menaati perintah-perintah Yahweh; mereka tidak berbuat demikian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani memakai metafora melacurkan diri untuk penyembahan berhala dan ketidaksetiaan terhadap perjanjian.
    reason: Menjelaskan metafora seksual yang kuat dalam זָנוּ tanpa menghilangkannya dari teks utama.
lexical_decisions:
- source_word: וְגַם אֶל שֹׁפְטֵיהֶם לֹא שָׁמֵעוּ
  choice: Namun, mereka bahkan tidak mendengarkan para hakim mereka
  rationale: “Namun” menyampaikan kontras dalam konteks, sedangkan “bahkan” mempertahankan penekanan וְגַם. “Mendengarkan” mempertahankan idiom Ibrani yang dalam konteks menyiratkan mengindahkan atau menaati.
- source_word: שֹׁפְטֵיהֶם
  choice: para hakim mereka
  rationale: Mempertahankan sebutan historis bagi para hakim yang dibangkitkan untuk memimpin dan menyelamatkan Israel, tanpa menggeneralisasikannya menjadi sekadar “pemimpin”.
- source_word: כִּי זָנוּ אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: sebab mereka berzina dengan mengikuti ilah-ilah lain
  rationale: “Berzina” mempertahankan metafora kuat tentang ketidaksetiaan perjanjian, sedangkan “dengan mengikuti” mengungkapkan idiom אַחֲרֵי secara wajar dalam bahasa Indonesia.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: dan sujud menyembah kepada mereka
  rationale: Ungkapan ini mempertahankan gambaran tindakan membungkuk atau bersujud sekaligus menjelaskan makna penyembahannya dalam konteks.
- source_word: סָרוּ מַהֵר מִן הַדֶּרֶךְ
  choice: Mereka segera menyimpang dari jalan
  rationale: “Menyimpang dari jalan” mempertahankan metafora perilaku perjanjian, dan “segera” menyampaikan unsur kecepatan מַהֵר.
- source_word: אֲשֶׁר הָלְכוּ אֲבוֹתָם
  choice: yang ditempuh nenek moyang mereka
  rationale: “Ditempuh” mempertahankan metafora berjalan secara alami; “nenek moyang” merupakan padanan Indonesia yang lazim bagi אֲבוֹתָם dalam konteks antargenerasi.
- source_word: לִשְׁמֹעַ מִצְוֺת יְהוָה
  choice: dengan menaati perintah-perintah Yahweh
  rationale: Dengan objek “perintah-perintah”, שׁמע paling tepat berarti menaati. Frasa “dengan menaati” mengaitkan tindakan itu dengan jalan yang ditempuh nenek moyang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan sebuah gelar.
- source_word: לֹא עָשׂוּ כֵן
  choice: mereka tidak berbuat demikian
  rationale: Padanan langsung yang mempertahankan rujukan ringkas teks sumber kepada teladan ketaatan nenek moyang.
theological_decisions:
- issue: Metafora ketidaksetiaan perjanjian dalam זָנוּ
  choice: Mempertahankan metafora seksual dengan “mereka berzina”
  alternative: “mereka tidak setia” atau “mereka melacurkan diri”
  rationale: Teks Ibrani sengaja memakai bahasa perzinaan untuk menggambarkan penyembahan berhala sebagai pengkhianatan perjanjian. “Berzina” mempertahankan daya teologis metafora itu tanpa memakai ungkapan yang terlalu harfiah tetapi kurang alami.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Transliterasi “Yahweh” mempertahankan nama pribadi ilahi yang terdapat dalam teks sumber.
- issue: Hubungan לִשְׁמֹעַ מִצְוֺת יְהוָה dengan frasa sebelumnya
  choice: 'Menghubungkannya dengan jalan hidup nenek moyang: “jalan yang ditempuh ... dengan menaati”'
  alternative: 'Membacanya sebagai tujuan terpisah: “untuk menaati”'
  rationale: Susunan Ibrani paling wajar menerangkan jalan yang ditempuh nenek moyang, yaitu kehidupan yang ditandai oleh ketaatan kepada perintah Yahweh, sambil tetap mempertahankan kepadatan sintaksis ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Istilah historis “para hakim” dan nama “Yahweh” dipertahankan. Susunan kalimat dibuat alami bagi pembaca umum, sedangkan metafora jalan, bersujud, dan perzinaan tetap dijaga.
