  text: בְּ/כֹ֣ל אֲשֶׁ֣ר יָצְא֗וּ יַד יְהוָה֙ הָיְתָה בָּ֣/ם לְ/רָעָ֔ה כַּֽ/אֲשֶׁר֙ דִּבֶּ֣ר יְהוָ֔ה וְ/כַ/אֲשֶׁ֛ר נִשְׁבַּ֥ע יְהוָ֖ה לָ/הֶ֑ם וַ/יֵּ֥צֶר לָ/הֶ֖ם מְאֹֽד׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/015.yaml
  text: Wherever they went out[a], the hand of Yahweh was against them for harm, just as Yahweh had spoken and just as Yahweh had sworn to them[b], and they were greatly distressed.
translation:
  language: id
  text: Ke mana pun mereka pergi[a], tangan Yahweh melawan mereka untuk mendatangkan malapetaka[b], tepat seperti yang telah Yahweh firmankan dan seperti yang telah Yahweh sumpahkan kepada mereka. Mereka pun sangat terdesak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Setiap kali mereka keluar,” mungkin dengan pengertian maju berperang atau berangkat dalam suatu operasi militer.
    reason: lexical_alternative
  - marker: b
    text: Atau “celaka” atau “bencana”; kata Ibrani רָעָה di sini menunjuk pada malapetaka atau kerugian, bukan dengan sendirinya pada kejahatan moral.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹל אֲשֶׁר יָצְאוּ
  choice: Ke mana pun mereka pergi
  rationale: Ungkapan ini mencakup setiap kesempatan atau tempat mereka keluar untuk suatu usaha. Terjemahan utama dibuat alami dan tetap luas, sedangkan kemungkinan nuansa maju berperang dicatat dalam catatan kaki.
- source_word: יַד יְהוָה
  choice: tangan Yahweh
  rationale: Metafora antropomorfis Ibrani dipertahankan untuk menyatakan kuasa dan tindakan aktif Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: הָיְתָה בָם לְרָעָה
  choice: melawan mereka dan mendatangkan malapetaka
  rationale: Frasa ini menyatakan tindakan ilahi yang merugikan mereka. 'Malapetaka' menyampaikan bencana atau celaka tanpa menyiratkan kejahatan moral pada diri Allah.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה וְכַאֲשֶׁר נִשְׁבַּע יְהוָה לָהֶם
  choice: tepat seperti yang telah Yahweh firmankan dan sumpahkan kepada mereka
  rationale: Bentuk perfektif menunjuk kembali kepada perkataan dan sumpah Yahweh sebelumnya; pengulangan nama yang kedua diringkas secara alami tanpa mengubah pelaku kedua verba.
- source_word: וַיֵּצֶר לָהֶם מְאֹד
  choice: Mereka pun sangat terdesak
  rationale: Ungkapan ini menyatakan keadaan tekanan atau kesesakan yang amat berat; 'sangat' mempertahankan daya מְאֹד.
theological_decisions:
- issue: Tindakan Yahweh dalam penghukuman perjanjian
  choice: tangan Yahweh melawan mereka dan mendatangkan malapetaka
  alternative: tangan Yahweh melawan mereka untuk mencelakakan mereka
  rationale: Pilihan utama mempertahankan bahwa Yahweh bertindak aktif dalam penghukuman, tetapi tidak mengartikan רָעָה sebagai kejahatan moral. Ketegangan teologis antara tindakan ilahi dan malapetaka yang dialami Israel tetap dibiarkan tampak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Metafora “tangan Yahweh” dipertahankan, sementara susunan klausa dibuat alami bagi pembaca umum.
