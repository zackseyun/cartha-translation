  text: וַ/יְשַׁלַּ֥ח יְהוֹשֻׁ֖עַ אֶת הָ/עָ֑ם וַ/יֵּלְכ֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אִ֥ישׁ לְ/נַחֲלָת֖/וֹ לָ/רֶ֥שֶׁת אֶת הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/006.yaml
  text: Then Joshua sent the people away[a], and the sons of Israel went, each man to his inheritance, to take possession of the land.
translation:
  language: id
  text: Kemudian Yosua menyuruh rakyat itu pergi, dan orang Israel pergi, masing-masing ke tanah warisannya untuk memiliki tanah itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: menyuruh ... pergi
  rationale: Dalam konteks ini שׁלח berarti menyuruh atau melepas orang pergi. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan makna kausatifnya.
- source_word: הָעָם
  choice: bangsa itu
  rationale: Nomina Ibrani ini secara harfiah berarti 'bangsa/rakyat itu'. 'Bangsa itu' sesuai dengan rujukannya kepada Israel tanpa menambahkan nama yang tidak dinyatakan dalam frasa ini.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Idiom Ibrani harfiah 'anak-anak lelaki Israel' secara wajar menunjuk kepada orang Israel secara kolektif. 'Orang Israel' adalah padanan Indonesia yang alami dan tidak menyiratkan bahwa hanya anak laki-laki yang dimaksud.
- source_word: אִישׁ
  choice: masing-masing
  rationale: Dalam pemakaian distributif, אִישׁ menandai bahwa setiap orang atau kelompok pergi ke bagiannya sendiri. 'Masing-masing' menyampaikan fungsi ini secara alami.
- source_word: לְנַחֲלָתוֹ
  choice: ke tanah warisannya
  rationale: נַחֲלָה di sini menunjuk pada bagian tanah yang diwariskan atau dianugerahkan. Penambahan 'tanah' memperjelas rujukan konkret tanpa menghilangkan nuansa warisan.
- source_word: לָרֶשֶׁת
  choice: untuk menduduki
  rationale: ירשׁ dalam konteks pemukiman tanah berarti mengambil dan menempati sebagai milik. 'Menduduki' menyampaikan tujuan tindakan itu dengan ringkas dan wajar.
- source_word: הָאָרֶץ
  choice: negeri itu
  rationale: אֶרֶץ di sini adalah wilayah tertentu yang hendak ditempati Israel. 'Negeri itu' lebih alami daripada 'bumi itu' dan tetap mempertahankan sifat definitnya.
theological_decisions:
- issue: Sebutan kolektif בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel
  rationale: Frasa itu merupakan idiom genealogis-kolektif, bukan pembatasan kepada anak laki-laki. Padanan idiomatis 'orang Israel' mempertahankan referen korporatnya dalam bahasa Indonesia modern.
- issue: Istilah pembagian tanah נַחֲלָה
  choice: tanah warisan
  alternative: milik pusaka
  rationale: '''Tanah warisan'' mempertahankan kaitan antara pemberian tanah dan warisan, sekaligus jelas bagi pembaca modern; ''milik pusaka'' lebih tradisional dan dapat terdengar kurang langsung.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif Ibrani dipertahankan dengan 'Kemudian ... dan ...', sementara idiom yang kaku dialihkan secara alami. Tidak diperlukan catatan kaki karena alternatif leksikal tidak menimbulkan ambiguitas penting dalam ayat ini.
