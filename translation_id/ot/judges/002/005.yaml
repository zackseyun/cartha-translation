id: JDG.2.5
reference: Judges 2:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יִּקְרְא֛וּ שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא בֹּכִ֑ים וַ/יִּזְבְּחוּ שָׁ֖ם לַֽ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/005.yaml
  text: So they called the name of that place Bochim[a], and they sacrificed there to Yahweh.
translation:
  language: id
  text: Maka mereka menamai tempat itu Bokhim[a], lalu mereka mempersembahkan kurban di sana kepada Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Bokhim berbunyi seperti kata Ibrani yang berarti “orang-orang yang menangis.”
    reason: Menjelaskan makna nama tempat dan kaitan bunyinya dengan akar kata Ibrani untuk menangis.
lexical_decisions:
- source_word: וַיִּקְרְאוּ שֵׁם
  choice: mereka menamai
  rationale: Ungkapan Ibrani harfiah 'memanggil nama' secara idiomatis berarti memberi nama; 'menamai' menyampaikan maknanya secara alami dalam bahasa Indonesia.
- source_word: הַמָּקוֹם הַהוּא
  choice: tempat itu
  rationale: Mewakili nomina definit dan demonstrativa הַהוּא dengan ungkapan Indonesia yang wajar.
- source_word: בֹּכִים
  choice: Bokhim
  rationale: Kata ini berfungsi sebagai nama tempat, sehingga ditransliterasikan; bunyi kh mewakili konsonan Ibrani ח, sedangkan kaitannya dengan tindakan menangis dijelaskan dalam catatan kaki.
- source_word: וַיִּזְבְּחוּ
  choice: mereka mempersembahkan kurban
  rationale: Verba זבח menyatakan tindakan mempersembahkan kurban; ungkapan ini lebih alami dan jelas dalam bahasa Indonesia daripada 'mereka berkurban'.
- source_word: שָׁם
  choice: di sana
  rationale: Keterangan tempat ini merujuk kembali kepada tempat yang baru dinamai.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menyatakan arah/penerima persembahan, dan nama ilahi יהוה ditransliterasikan sebagai Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks menyebut nama perjanjian ilahi secara langsung; 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Apakah בֹּכִים diterjemahkan atau ditransliterasikan
  choice: Bokhim
  alternative: Orang-orang yang Menangis; Para Peratap
  rationale: Karena kata tersebut menjadi nama tempat dalam ayat ini, nama itu ditransliterasikan, sementara arti dan permainan katanya diterangkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Maka ... lalu ...' mempertahankan urutan naratif Ibrani tanpa terasa kaku; 'kurban' memakai ejaan baku masa kini.
