  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֧עַל מַלְאַךְ יְהוָ֛ה מִן הַ/גִּלְגָּ֖ל אֶל הַ/בֹּכִ֑ים וַ/יֹּאמֶר֩ אַעֲלֶ֨ה אֶתְ/כֶ֜ם מִ/מִּצְרַ֗יִם וָ/אָבִ֤יא אֶתְ/כֶם֙ אֶל הָ/אָ֗רֶץ אֲשֶׁ֤ר נִשְׁבַּ֨עְתִּי֙ לַ/אֲבֹ֣תֵי/כֶ֔ם וָ/אֹמַ֕ר לֹֽא אָפֵ֧ר בְּרִיתִ֛/י אִתְּ/כֶ֖ם לְ/עוֹלָֽם־־־פ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/001.yaml
  text: Then the angel of Yahweh went up from Gilgal to Bochim and said[a], “I brought you up from Egypt and brought you into the land that I swore to your fathers, and I said[b], ‘I will never break my covenant with you.’”
translation:
  language: id
  text: Kemudian malaikat Yahweh[a] naik dari Gilgal ke Bokhim[b] dan berkata, “Aku telah membawa kalian keluar dari Mesir dan telah membawa kalian ke negeri yang Kujanjikan dengan sumpah kepada leluhur kalian. Aku telah berkata, ‘Aku tidak akan pernah membatalkan perjanjian-Ku dengan kalian.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “utusan Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: Bokhim kemungkinan berarti “orang-orang yang menangis” atau menunjuk pada tempat orang menangis.
    reason: cultural_note
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  rationale: מַלְאַךְ dapat berarti ‘utusan’ atau ‘malaikat’. ‘Malaikat Yahweh’ mempertahankan pengertian konvensional dalam konteks ini, sedangkan alternatif ‘utusan Yahweh’ dicatat dalam catatan kaki agar ambiguitas leksikal tetap terlihat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar ‘TUHAN’, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: וַיַּעַל
  choice: naik
  rationale: Kata עלה menyatakan gerak naik. ‘Naik’ mempertahankan arah perjalanan yang dinyatakan sumber tanpa menambahkan penjelasan topografis.
- source_word: הַגִּלְגָּל
  choice: Gilgal
  rationale: Nama tempat ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: הַבֹּכִים
  choice: Bokhim
  rationale: Nama tempat ditransliterasikan, sementara maknanya yang berkaitan dengan tangisan dijelaskan dalam catatan kaki.
- source_word: אַעֲלֶה אֶתְכֶם מִמִּצְרַיִם
  choice: Aku telah membawa kalian keluar dari Mesir
  rationale: Walaupun bentuk verba secara morfologis dapat dibaca sebagai imperfek, rangkaian ujaran ini mengenang tindakan penyelamatan yang telah terjadi. Bentuk lampau beraspek selesai paling sesuai dengan alur wacana; ‘keluar’ menyampaikan gerak dari Mesir secara alami dalam bahasa Indonesia.
- source_word: וָאָבִיא אֶתְכֶם
  choice: dan membawa kalian
  rationale: Bentuk Hifil dari בוא berarti menyebabkan masuk atau membawa. Tujuan geraknya dinyatakan oleh frasa berikutnya, ‘ke negeri’.
- source_word: הָאָרֶץ
  choice: negeri
  rationale: ‘Negeri’ merupakan padanan Indonesia yang alami dan tetap mempertahankan gema tanah yang dijanjikan dalam konteks perjanjian.
- source_word: נִשְׁבַּעְתִּי לַאֲבֹתֵיכֶם
  choice: yang Kujanjikan dengan sumpah kepada leluhur kalian
  rationale: Ungkapan ini menyatakan bahwa Yahweh bersumpah mengenai pemberian negeri itu. ‘Kujanjikan dengan sumpah’ alami dalam bahasa Indonesia dan mempertahankan kekuatan sumpah; ‘leluhur’ menyampaikan rujukan kepada generasi pendahulu Israel tanpa ungkapan yang kaku.
- source_word: וָאֹמַר
  choice: Aku telah berkata
  rationale: Terjemahan ini meneruskan rangkaian tindakan lampau yang sedang dikenang dan memperkenalkan kutipan langsung.
- source_word: לֹא אָפֵר בְּרִיתִי אִתְּכֶם לְעוֹלָם
  choice: Aku tidak akan pernah mengingkari perjanjian-Ku dengan kalian
  rationale: Dalam konteks perjanjian, הפר berarti membatalkan, melanggar, atau mengingkari. ‘Mengingkari perjanjian’ jelas dan idiomatis; ‘tidak akan pernah’ menyampaikan negasi berjangka tetap dari לְעוֹלָם.
theological_decisions:
- issue: Identitas מַלְאַךְ יְהוָה
  choice: Diterjemahkan ‘malaikat Yahweh’ tanpa menentukan apakah sosok ini malaikat ciptaan atau penampakan ilahi.
  alternative: ‘Utusan Yahweh’, atau penafsiran eksplisit bahwa sosok tersebut adalah manifestasi Yahweh sendiri.
  rationale: Tokoh itu disebut malaikat/utusan Yahweh, tetapi berbicara dalam orang pertama sebagai pelaku tindakan ilahi. Terjemahan mempertahankan ketegangan teologis tersebut dan tidak menyelesaikannya secara interpretatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Sapaan jamak diterjemahkan ‘kalian’ agar jumlah jamak dalam bahasa Ibrani terlihat. Kapitalisasi pada bentuk terikat ‘Kujanjikan’ dan ‘perjanjian-Ku’ mengikuti kaidah penghormatan bagi rujukan kepada Allah.
