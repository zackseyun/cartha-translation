  naturalness: Bahasa baku dan mudah dipahami. Bentuk ‘telah membawa ... dan membawa’ sedikit tidak seimbang secara aspek; penyelarasan kecil membuat urutan tindakan lampau lebih lancar.
  terminology: ‘Malaikat Yahweh’, ‘Gilgal’, dan ‘Bokhim’ sesuai. ‘Perjanjian-Ku’ dipertahankan. ‘Leluhur’ adalah padanan Indonesia yang alami untuk idiom ‘bapak-bapak/nenek moyang’ dalam konteks ini, tanpa memasukkan pembatasan penafsiran tambahan.
