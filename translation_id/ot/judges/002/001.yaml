  to: Kemudian malaikat Yahweh[a] naik dari Gilgal ke Bokhim[b] dan berkata, “Aku telah membawa kalian keluar dari Mesir dan telah membawa kalian ke negeri yang Kujanjikan dengan sumpah kepada leluhur kalian. Aku telah berkata, ‘Aku tidak akan pernah membatalkan perjanjian-Ku dengan kalian.’”
