    issue: ‘Mengingkari perjanjian-Ku’
    rationale: Verba Ibrani הפר dalam frasa ini menyatakan membatalkan, meniadakan, atau melanggar perjanjian. ‘Mengingkari’ dapat terutama bermakna menyangkal atau tidak mengakui, sehingga kurang langsung menyampaikan tindakan terhadap perjanjian itu sendiri.
  - severity: low
    issue: Aspek tidak sejajar dalam ‘telah membawa ... dan membawa’
    rationale: Kedua tindakan dipaparkan sebagai tindakan penyelamatan masa lampau. Menandai keduanya dengan ‘telah’ menghasilkan konstruksi Indonesia yang lebih jelas dan seimbang.
