base_translation:
  language: en
  yaml_path: translation/ot/judges/002/016.yaml
  text: Then Yahweh raised up judges[a], and they saved them from the hand of those who plundered them.
translation:
  language: id
  text: Lalu Yahweh membangkitkan hakim-hakim, dan mereka menyelamatkan[a] bangsa itu dari tangan orang-orang yang menjarah bangsa itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “membebaskan bangsa itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֶם
  choice: membangkitkan
  rationale: Bentuk hifil dari קום menyatakan bahwa Yahweh menyebabkan para pemimpin itu tampil. “Membangkitkan” mempertahankan prakarsa ilahi dan lebih kaya daripada sekadar “mengangkat.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar, sehingga nama pribadi Allah dalam teks Ibrani tetap tampak.
- source_word: שֹׁפְטִים
  choice: hakim-hakim
  rationale: Ini adalah padanan langsung yang mempertahankan istilah khas kitab Hakim-Hakim. Peran mereka sebagai penyelamat dinyatakan oleh verba berikutnya, bukan dimasukkan ke dalam sebutan mereka.
- source_word: וַיּוֹשִׁיעוּם
  choice: dan mereka menyelamatkan bangsa itu
  rationale: Verba ישׁע menyatakan tindakan menyelamatkan atau membebaskan. Pronomina objek jamak merujuk kepada umat Israel; “bangsa itu” menghindari rangkaian pronomina yang kaku dalam bahasa Indonesia tanpa mengubah acuannya.
- source_word: מִיַּד
  choice: dari tangan
  rationale: Metafora Ibrani tentang tangan sebagai kuasa atau kendali dipertahankan karena tetap dapat dipahami secara alami dalam bahasa Indonesia.
- source_word: שֹׁסֵיהֶם
  choice: orang-orang yang menjarah mereka
  rationale: Ungkapan ini mempertahankan nuansa perampasan keras dari akar שסה/שסס. “Menindas” terlalu umum dan menghilangkan unsur penjarahan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu alih-alih menggantinya dengan gelar.
- issue: Apakah שֹׁפְטִים perlu diterjemahkan menurut jabatan atau fungsi penyelamatan
  choice: Memakai “hakim-hakim” sebagai sebutan dan menyatakan fungsi mereka melalui “menyelamatkan.”
  alternative: Memakai “para pembebas” sebagai sebutan
  rationale: Teks Ibrani sendiri mempertahankan ketegangan antara sebutan mereka sebagai hakim dan tindakan mereka sebagai penyelamat. Terjemahan ini tidak mempersempit peran mereka menjadi salah satu fungsi saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan gerak narasi Ibrani serta metafora “dari tangan,” sementara “bangsa itu” memperjelas acuan pronomina kepada Israel. Penanda catatan kaki ditempatkan sesudah frasa verbal yang memang memiliki alternatif leksikal.
