source:
  edition: WLC
  text: וַ/יַּעַבְד֤וּ הָ/עָם֙ אֶת יְהוָ֔ה כֹּ֖ל יְמֵ֣י יְהוֹשֻׁ֑עַ וְ/כֹ֣ל יְמֵ֣י הַ/זְּקֵנִ֗ים אֲשֶׁ֨ר הֶאֱרִ֤יכוּ יָמִים֙ אַחֲרֵ֣י יְהוֹשׁ֔וּעַ אֲשֶׁ֣ר רָא֗וּ אֵ֣ת כָּל מַעֲשֵׂ֤ה יְהוָה֙ הַ/גָּד֔וֹל אֲשֶׁ֥ר עָשָׂ֖ה לְ/יִשְׂרָאֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/002/007.yaml
  text: And the people served Yahweh all the days of Joshua[a], and all the days of the elders who lived on after Joshua, who had seen all the great work of Yahweh that he had done for Israel.
translation:
  language: id
  text: Bangsa itu mengabdi kepada Yahweh sepanjang hidup Yosua dan sepanjang hidup para tua-tua yang masih hidup sesudah Yosua, yang telah melihat seluruh karya besar[a] Yahweh yang telah dilakukan-Nya bagi Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “seluruh perbuatan besar” atau “seluruh tindakan besar.”'
    reason: Kata Ibrani מַעֲשֵׂה berbentuk tunggal dan dapat berarti karya, perbuatan, atau tindakan secara kolektif.
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: mengabdi kepada
  rationale: Kata עבד dengan Yahweh sebagai objek menyatakan pelayanan dan kesetiaan perjanjian yang mencakup, tetapi tidak terbatas pada, ibadah ritual. “Mengabdi kepada” mempertahankan keluasan makna itu dalam bahasa Indonesia alami.
- source_word: הָעָם
  choice: bangsa itu
  rationale: עם menunjuk secara kolektif kepada umat Israel. Dalam konteks narasi ini, “bangsa itu” jelas dan wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: כֹּל יְמֵי
  choice: sepanjang hidup
  rationale: Ungkapan ini menyatakan seluruh masa hidup atau masa keberadaan orang yang disebut; “sepanjang hidup” menyampaikan maksudnya secara alami.
- source_word: הַזְּקֵנִים
  choice: para tua-tua
  rationale: Istilah ini menunjuk kepada para anggota senior yang diakui sebagai pemimpin masyarakat Israel. “Para tua-tua” mempertahankan istilah sosial tradisional yang masih dikenal luas.
- source_word: הֶאֱרִיכוּ יָמִים אַחֲרֵי
  choice: masih hidup sesudah
  rationale: Ungkapan harfiahnya berarti memperpanjang hari-hari sesudah seseorang, yakni tetap hidup setelah orang itu tiada.
- source_word: רָאוּ
  choice: telah melihat
  rationale: Bentuk ini menyatakan pengalaman terdahulu para tua-tua yang menjadi latar bagi kesetiaan mereka.
- source_word: אֵת כָּל מַעֲשֵׂה יְהוָה הַגָּדוֹל
  choice: seluruh perbuatan besar yang dilakukan Yahweh
  rationale: מַעֲשֵׂה berbentuk tunggal dan dapat dipahami secara kolektif sebagai keseluruhan karya atau tindakan besar Yahweh. Susunan Indonesia ini mempertahankan kesatuan kolektif tersebut tanpa menjadi kaku.
- source_word: עָשָׂה לְיִשְׂרָאֵל
  choice: dilakukan Yahweh bagi Israel
  rationale: 'Preposisi ל bersifat benefaktif: tindakan itu dilakukan demi kepentingan Israel. “Bagi Israel” menyatakan nuansa tersebut dengan jelas.'
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. “Yahweh” mempertahankan nama pribadi itu dan tidak menggantinya dengan gelar.
- issue: Cakupan עבד dalam hubungan dengan Yahweh
  choice: mengabdi kepada
  alternative: beribadah kepada; melayani
  rationale: Dalam konteks Kitab Hakim-Hakim, kata ini mencakup kesetiaan dan pelayanan kepada Yahweh, termasuk ibadah, sehingga tidak sebaiknya dipersempit hanya pada kegiatan ritual.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pengulangan “sepanjang hidup” dipertahankan untuk mencerminkan struktur dan penekanan teks Ibrani. Penanda catatan kaki [a] ditempatkan tepat setelah frasa yang dijelaskannya.
