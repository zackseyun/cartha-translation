base_translation:
  language: en
  yaml_path: translation/ot/judges/002/022.yaml
  text: in order to test Israel by them[a], whether they would keep the way of Yahweh by walking in it, as their fathers kept it, or not.
translation:
  language: id
  text: untuk menguji Israel melalui bangsa-bangsa itu,[a] apakah mereka akan mengikuti jalan Yahweh dengan hidup menurut jalan itu, seperti nenek moyang mereka mengikutinya, atau tidak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dengan perantaraan bangsa-bangsa itu.” Kata ganti Ibrani tersebut merujuk pada bangsa-bangsa yang dibiarkan tinggal di negeri itu (lihat konteks sebelumnya).'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן נַסּוֹת
  choice: untuk menguji
  rationale: Mempertahankan daya tujuan לְמַעַן dan arti נסה sebagai menguji atau membuktikan kesetiaan Israel.
- source_word: בָּם
  choice: melalui bangsa-bangsa itu
  rationale: Pronomina Ibrani merujuk pada bangsa-bangsa yang dibiarkan tinggal menurut konteks sebelumnya. Penyebutan nomina acuannya membuat bahasa Indonesia jelas; 'dengan perantaraan bangsa-bangsa itu' juga mungkin.
- source_word: הֲשֹׁמְרִים הֵם
  choice: apakah mereka akan tetap mengikuti
  rationale: Konstruksi interogatif dengan partisip menyatakan isi ujian. 'Tetap mengikuti' menyampaikan gagasan memelihara atau menaati suatu jalan secara wajar dalam bahasa Indonesia.
- source_word: דֶּרֶךְ יְהוָה
  choice: jalan Yahweh
  rationale: Mempertahankan metafora jalan sebagai pola hidup yang diperintahkan Yahweh serta nama ilahi sebagai nama diri.
- source_word: לָלֶכֶת בָּם
  choice: dengan hidup menurut jalan itu
  rationale: Ungkapan harfiah 'berjalan di dalamnya' adalah idiom perilaku. Terjemahan ini mempertahankan fungsi penjelasnya dan menghasilkan bahasa Indonesia alami.
- source_word: כַּאֲשֶׁר שָׁמְרוּ אֲבוֹתָם
  choice: seperti yang dilakukan oleh nenek moyang mereka
  rationale: Kata 'dilakukan' mengacu pada tindakan mengikuti jalan Yahweh dan menghindari pengulangan kaku. אבות dalam konteks genealogis paling alami diterjemahkan 'nenek moyang' dalam bahasa Indonesia tanpa menghapus acuan leluhur.
- source_word: אִם לֹא
  choice: atau tidak
  rationale: Melengkapi pertanyaan tidak langsung 'apakah ... atau tidak' secara idiomatis.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama perjanjian itu dan mengikuti bentuk transliterasi yang diminta tanpa menggantinya dengan gelar.
- issue: Sarana ujian ilahi
  choice: melalui bangsa-bangsa itu
  alternative: dengan bangsa-bangsa itu
  rationale: Prefiks ב dapat menyatakan sarana. Pilihan 'melalui' mempertahankan bahwa bangsa-bangsa yang tersisa menjadi perantara ujian tanpa menambahkan penjelasan tentang mekanismenya.
- issue: Makna אֲבוֹתָם
  choice: nenek moyang mereka
  alternative: bapak-bapak mereka
  rationale: Dalam bahasa Indonesia, 'nenek moyang' merupakan padanan genealogis alami bagi para leluhur Israel. Pilihan ini tidak menentukan leluhur tertentu di luar yang dinyatakan konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Metafora 'jalan Yahweh' dipertahankan, sedangkan idiom berjalan diterjemahkan secara alami sebagai 'hidup menurut jalan itu'. Penanda catatan kaki [a] ditempatkan tepat sesudah frasa yang dijelaskannya.
