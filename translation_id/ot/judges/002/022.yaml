  terminology: “Yahweh” tepat untuk יְהוָה. “Jalan Yahweh” mempertahankan metafora penting; “mengikuti” dan “hidup menurut jalan itu” menyampaikan fungsi שׁמר dan הלך secara idiomatis. “Nenek moyang” adalah padanan Indonesia yang lazim bagi אֲבוֹתָם dalam idiom genealogis ini.
