base_translation:
  language: en
  yaml_path: translation/ot/judges/002/019.yaml
  text: And when the judge died[a], they turned back and acted more corruptly than their fathers, going after other gods to serve them and to bow down to them. They did not drop any of their deeds or their stubborn way.
translation:
  language: id
  text: 'Ketika hakim itu meninggal[a], mereka kembali dan bertindak lebih jahat daripada nenek moyang mereka: mereka mengikuti ilah-ilah lain untuk mengabdi kepada ilah-ilah itu dan sujud kepada mereka. Mereka tidak meninggalkan perbuatan-perbuatan mereka ataupun jalan hidup mereka yang keras kepala.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mereka tidak membiarkan satu pun dari perbuatan-perbuatan mereka atau jalan hidup mereka yang keras kepala itu jatuh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בְּמוֹת הַשּׁוֹפֵט
  choice: Ketika hakim itu meninggal
  rationale: Rumus naratif וְהָיָה dengan keterangan waktu dialihkan secara alami sebagai anak kalimat temporal. “Hakim” mempertahankan istilah khas kitab Hakim-Hakim bagi pemimpin pembebas yang dibangkitkan Allah.
- source_word: יָשֻׁבוּ וְהִשְׁחִיתוּ מֵאֲבוֹתָם
  choice: mereka kembali berbuat lebih rusak daripada nenek moyang mereka
  rationale: יָשֻׁבוּ menyatakan kambuhnya mereka kepada perilaku lama, sedangkan bentuk Hifil וְהִשְׁחִיתוּ bersama מִן menyatakan tindakan yang lebih rusak dibandingkan generasi terdahulu.
- source_word: לָלֶכֶת אַחֲרֵי אֱלֹהִים אֲחֵרִים
  choice: Mereka mengikuti ilah-ilah lain
  rationale: “Mengikuti” mengungkapkan metafora kesetiaan dalam לָלֶכֶת אַחֲרֵי secara wajar. “Ilah-ilah lain” mempertahankan kontras dengan TUHAN tanpa mempersempitnya menjadi ilah bangsa asing.
- source_word: לְעָבְדָם
  choice: untuk mengabdi kepada ilah-ilah itu
  rationale: “Mengabdi” mempertahankan gagasan pelayanan kepada suatu ilah dan membedakannya dari tindakan bersujud dalam frasa berikutnya.
- source_word: וּלְהִשְׁתַּחֲוֹת לָהֶם
  choice: dan sujud menyembahnya
  rationale: Bentuk Hitpael ini menunjukkan tindakan merendahkan diri atau bersujud dalam penghormatan religius; “sujud menyembah” membawa nuansa jasmani dan kultisnya dalam bahasa Indonesia alami.
- source_word: לֹא הִפִּילוּ מִמַּעַלְלֵיהֶם
  choice: Mereka tidak melepaskan perbuatan-perbuatan mereka
  rationale: Hifil נפל dengan מִן memakai gambaran membiarkan sesuatu jatuh atau lepas. “Tidak melepaskan” mempertahankan sebagian gambaran itu sekaligus menyampaikan maksud idiomatis bahwa mereka tidak meninggalkan perbuatan mereka.
- source_word: וּמִדַּרְכָּם הַקָּשָׁה
  choice: ataupun jalan hidup mereka yang keras kepala
  rationale: דֶּרֶךְ secara metaforis menunjuk cara hidup, sedangkan קָשֶׁה di sini menyatakan sikap keras dan membangkang. “Jalan hidup” mempertahankan metafora sumber.
theological_decisions:
- issue: Makna אֱלֹהִים אֲחֵרִים dalam konteks kemurtadan Israel
  choice: ilah-ilah lain
  alternative: ilah-ilah asing
  rationale: Teks menekankan bahwa Israel mengejar ilah selain TUHAN. “Ilah-ilah lain” mempertahankan kontras perjanjian itu tanpa menambahkan pengertian etnis atau geografis yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “ilah-ilah” dipertahankan untuk memperjelas rujukan jamak; “jalan hidup” mempertahankan metafora Ibrani tanpa terdengar terlalu harfiah.
