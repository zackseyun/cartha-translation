base_translation:
  language: en
  yaml_path: translation/ot/judges/003/016.yaml
  text: Ehud made himself a sword with two edges[a], a cubit in length[b], and strapped it on under his clothes on his right thigh.
translation:
  language: id
  text: Ehud membuat bagi dirinya sebilah pedang bermata dua[a], yang panjangnya satu gomed[b]. Ia mengikatkan pedang itu di bawah pakaiannya, pada paha kanannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sebilah pedang, dan padanya ada dua mulut,” yakni dua sisi tajam.
    reason: lexical_alternative
  - marker: b
    text: Gomed adalah satuan panjang Ibrani yang jarang ditemukan dan ukuran tepatnya tidak diketahui. Satuan ini biasanya dipahami kira-kira sepanjang satu hasta atau lengan bawah.
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעַשׂ לּוֹ
  choice: membuat bagi dirinya
  rationale: Frasa dengan לּוֹ menunjukkan bahwa Ehud membuat pedang itu untuk dipakainya sendiri. Bentuk ini mempertahankan makna benefaktif/refleksif tanpa menyatakan lebih dari teks.
- source_word: חֶרֶב
  choice: pedang
  rationale: חֶרֶב adalah istilah umum untuk pedang. Walaupun ukurannya mungkin menyerupai belati, teks Ibrani tidak memakai istilah yang khusus berarti belati.
- source_word: וְלָהּ שְׁנֵי פֵיוֹת
  choice: bermata dua
  rationale: Secara harfiah ungkapan ini berarti bahwa pedang itu mempunyai 'dua mulut', yaitu dua sisi tajam. 'Bermata dua' alami dalam bahasa Indonesia dan mempertahankan gambaran mata atau sisi tajam senjata.
- source_word: גֹּמֶד אָרְכָּהּ
  choice: panjangnya satu gomed
  rationale: גֹּמֶד adalah satuan panjang yang hanya muncul di sini dan ukuran tepatnya tidak diketahui. Mempertahankan istilah 'gomed' dalam teks, disertai catatan kaki, lebih jujur daripada mengubahnya secara pasti menjadi hasta.
- source_word: וַיַּחְגֹּר אוֹתָהּ
  choice: mengikatkan pedang itu
  rationale: חגר berarti mengikat atau memasang sesuatu pada tubuh, khususnya senjata. Pengulangan 'pedang itu' memperjelas rujukan dalam bahasa Indonesia.
- source_word: מִתַּחַת לְמַדָּיו
  choice: di bawah pakaiannya
  rationale: מַד dapat berarti pakaian atau jubah. Bentuk umum 'pakaiannya' menghindari penentuan jenis pakaian yang tidak diberikan oleh teks.
- source_word: עַל יֶרֶךְ יְמִינוֹ
  choice: pada paha kanannya
  rationale: יָרֵךְ menunjuk paha atau daerah pangkal paha. 'Pada paha kanannya' merupakan padanan langsung dan jelas.
theological_decisions: []
