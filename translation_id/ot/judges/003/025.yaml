source:
  edition: WLC
  text: וַ/יָּחִ֣ילוּ עַד בּ֔וֹשׁ וְ/הְנֵּ֛ה אֵינֶ֥/נּוּ פֹתֵ֖חַ דַּלְת֣וֹת הָֽ/עֲלִיָּ֑ה וַ/יִּקְח֤וּ אֶת הַ/מַּפְתֵּ֨חַ֙ וַ/יִּפְתָּ֔חוּ וְ/הִנֵּה֙ אֲדֹ֣נֵי/הֶ֔ם נֹפֵ֥ל אַ֖רְצָ/ה מֵֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/025.yaml
  text: And they waited until they were embarrassed[a], and behold, he still was not opening the doors of the upper room. So they took the key and opened them, and behold, their master had fallen to the floor[c][b], dead.
translation:
  language: id
  text: Mereka menunggu sampai merasa serba salah[a], tetapi ternyata ia tidak juga membuka pintu-pintu kamar atas[b] itu. Lalu mereka mengambil kunci dan membukanya. Ternyata tuan mereka[c] sudah tergeletak di tanah dalam keadaan mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sampai merasa malu.” Ungkapan Ibrani ini dapat menyatakan rasa malu atau kecanggungan sosial; di sini kemungkinan besar yang dimaksud adalah perasaan serba salah karena mereka terus menunggu.
    reason: lexical_alternative
  - marker: b
    text: Atau “kamar di tingkat atas.”
    reason: lexical_alternative
  - marker: c
    text: Atau “junjungan mereka.” Kata ini di sini menunjuk kepada Eglon sebagai atasan manusia mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּחִילוּ
  choice: mereka menunggu
  rationale: Dalam konteks ini, para pelayan terus menanti di luar ruangan. 'Menunggu' merupakan padanan alami dan tepat dalam bahasa Indonesia modern.
- source_word: עַד בּוֹשׁ
  choice: sampai merasa serba salah
  rationale: Ungkapan ini dapat menunjukkan rasa malu atau kecanggungan sosial. 'Merasa serba salah' menyampaikan situasi para pelayan yang semakin canggung karena terlalu lama menunggu tanpa lancang mengganggu tuannya.
- source_word: וְהִנֵּה
  choice: ternyata
  rationale: Partikel ini menandai penemuan atau perubahan adegan yang mendadak. 'Ternyata' mempertahankan daya naratifnya secara alami dan digunakan pada kedua kemunculannya.
- source_word: אֵינֶנּוּ פֹתֵחַ
  choice: ia tidak juga membuka
  rationale: Konstruksi ini menggambarkan tindakan yang belum terjadi ketika terus dinantikan. 'Tidak juga membuka' secara alami menyatakan harapan yang tak kunjung terpenuhi tanpa terlalu menentukan nuansa aspek.
- source_word: דַּלְתוֹת הָעֲלִיָּה
  choice: pintu-pintu kamar atas
  rationale: Bentuk jamak 'pintu-pintu' dipertahankan, sedangkan עֲלִיָּה menunjuk pada kamar atau ruangan di bagian atas bangunan.
- source_word: הַמַּפְתֵּחַ
  choice: kunci
  rationale: Padanan langsung dan jelas dalam konteks membuka pintu.
- source_word: וַיִּפְתָּחוּ
  choice: membukanya
  rationale: Akhiran '-nya' merujuk secara alami kepada pintu-pintu yang baru disebutkan dan menghindari pengulangan yang kaku.
- source_word: אֲדֹנֵיהֶם
  choice: tuan mereka
  rationale: Kata ini di sini menunjuk kepada Eglon sebagai atasan manusia para pelayan, bukan gelar ilahi. 'Tuan mereka' mempertahankan hubungan sosial tersebut.
- source_word: נֹפֵל אַרְצָה
  choice: sudah tergeletak di tanah
  rationale: Partisip dan penunjuk arah menggambarkan keadaan tubuh yang mereka dapati. 'Ter­geletak' menyampaikan keadaan hasil secara alami; 'di tanah' mempertahankan padanan lebih langsung bagi אַרְצָה tanpa memaksakan 'lantai'.
- source_word: מֵת
  choice: dalam keadaan mati
  rationale: Kata ini menyatakan kondisi Eglon saat ditemukan. Frasa tersebut jelas dan menyatu alami dengan 'tergeletak'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. 'Serba salah' dipilih untuk menangkap kecanggungan sosial tanpa memberi kesan rasa bersalah moral. Penanda kejutan וְהִנֵּה diterjemahkan secara konsisten dengan 'ternyata', dan semua bentuk jamak serta penanda catatan kaki dipertahankan.
