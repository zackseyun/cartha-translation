  text: וַ/יִּקְח֨וּ אֶת בְּנוֹתֵי/הֶ֤ם לָ/הֶם֙ לְ/נָשִׁ֔ים וְ/אֶת בְּנוֹתֵי/הֶ֖ם נָתְנ֣וּ לִ/בְנֵי/הֶ֑ם וַ/יַּעַבְד֖וּ אֶת אֱלֹהֵי/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/006.yaml
  text: They took their daughters for themselves as wives[a], and they gave their daughters to their sons, and they served their gods.
translation:
  language: id
  text: Mereka mengambil anak-anak perempuan bangsa-bangsa itu menjadi istri bagi diri mereka, dan mereka memberikan anak-anak perempuan mereka kepada anak-anak laki-laki bangsa-bangsa itu. Lalu mereka melayani ilah-ilah bangsa-bangsa itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “beribadah kepada ilah-ilah bangsa-bangsa itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: mengambil
  rationale: Mempertahankan arti dasar לקח; frasa berikutnya, 'menjadi istri mereka', memperjelas konteks perkawinan.
- source_word: בְּנוֹתֵיהֶם
  choice: anak-anak perempuan bangsa-bangsa itu
  rationale: Akhiran orang ketiga jamak merujuk kepada bangsa-bangsa yang disebut dalam konteks. Penyebutan anteseden secara eksplisit menghindari kerancuan pronomina dalam bahasa Indonesia.
- source_word: לָהֶם לְנָשִׁים
  choice: menjadi istri mereka
  rationale: Mengungkapkan fungsi perkawinan dan kepentingan bagi pihak Israel secara alami tanpa meniru susunan preposisi Ibrani secara kaku.
- source_word: וְאֶת־בְּנוֹתֵיהֶם נָתְנוּ לִבְנֵיהֶם
  choice: dan memberikan anak-anak perempuan mereka sendiri kepada anak-anak lelaki bangsa-bangsa itu
  rationale: Subjek tersirat verba 'memberikan' adalah orang Israel; objeknya anak perempuan Israel, sedangkan akhiran pada 'anak-anak lelaki' merujuk kepada bangsa-bangsa itu. 'Mereka sendiri' memperjelas peralihan rujukan tanpa menambahkan makna substantif.
- source_word: וַיַּעַבְדוּ
  choice: beribadah kepada
  rationale: Dalam konstruksi dengan ilah, עבד menyatakan pelayanan religius atau penyembahan. 'Beribadah kepada' terdengar alami dalam bahasa Indonesia dan tetap menunjukkan pengabdian religius.
- source_word: אֱלֹהֵיהֶם
  choice: ilah-ilah bangsa-bangsa itu
  rationale: Bentuk jamak dengan akhiran merujuk kepada dewa-dewa bangsa sekitar. 'Ilah-ilah' menjaga pembedaan antara Allah Israel dan objek penyembahan bangsa-bangsa tersebut.
theological_decisions:
- issue: Cakupan makna עבד ketika objeknya ilah-ilah asing
  choice: beribadah kepada ilah-ilah bangsa-bangsa itu
  alternative: melayani ilah-ilah mereka
  rationale: עבד dapat berarti 'melayani' maupun 'beribadah/menyembah' ketika objeknya ilah. Teks utama memakai ungkapan Indonesia yang alami bagi tindakan religius, sedangkan alternatif dicatat untuk mempertahankan dimensi pelayanan dan kesetiaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Rujukan pronomina diperjelas karena akhiran jamak Ibrani berganti antara bangsa-bangsa sekitar dan orang Israel dalam ayat yang sama.
