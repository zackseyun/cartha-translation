revisions:
- from: Mereka mengambil anak-anak perempuan bangsa-bangsa itu menjadi istri mereka, dan memberikan anak-anak perempuan mereka sendiri kepada anak-anak lelaki bangsa-bangsa itu. Lalu mereka beribadah kepada ilah-ilah bangsa-bangsa itu.[a]
  to: Mereka mengambil anak-anak perempuan bangsa-bangsa itu menjadi istri bagi diri mereka, dan mereka memberikan anak-anak perempuan mereka kepada anak-anak laki-laki bangsa-bangsa itu. Lalu mereka melayani ilah-ilah bangsa-bangsa itu.[a]
  rationale: Revisi mempertahankan rujukan yang berganti dalam bahasa Ibrani—bangsa-bangsa itu pada klausa pertama dan penerima pada klausa kedua, orang Israel sebagai pemberi anak-anak perempuan mereka—tanpa penekanan tambahan dari "sendiri". "Melayani" dipakai untuk עבד, sementara makna ibadah religius yang sah dicantumkan sebagai alternatif.
