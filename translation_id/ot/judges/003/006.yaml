  terminology: '"Ilah-ilah" merupakan istilah yang baik dan membedakan dewa-dewa bangsa itu dari Allah Israel. Untuk עבד, "melayani" mempertahankan cakupan kesetiaan dan pengabdian religius; "beribadah kepada" layak dicatat sebagai alternatif kontekstual.'
