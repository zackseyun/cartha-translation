  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֨וּ בְנֵי יִשְׂרָאֵ֤ל אֶת הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה וַֽ/יִּשְׁכְּח֖וּ אֶת יְהוָ֣ה אֱלֹֽהֵי/הֶ֑ם וַ/יַּעַבְד֥וּ אֶת הַ/בְּעָלִ֖ים וְ/אֶת הָ/אֲשֵׁרֽוֹת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/007.yaml
  text: And the sons of Israel did what was evil in the eyes of Yahweh[c][b][a], and they forgot Yahweh their God and served the Baals and the Asherahs.
translation:
  language: id
  text: Orang Israel[a] melakukan apa yang jahat di mata Yahweh[b]. Mereka melupakan Yahweh, Allah mereka, lalu beribadah kepada para Baal dan Asyera-asyera[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Israel”; maksudnya ialah orang-orang atau bangsa Israel.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani “jahat di mata Yahweh” berarti sesuatu yang Yahweh nilai jahat.
    reason: lexical_alternative
  - marker: c
    text: Atau “tiang-tiang Asyera.” Istilah Ibrani ini dapat menunjuk kepada benda-benda kultis yang berkaitan dengan Asyera atau, secara lebih luas, kepada representasi dan pemujaan Asyera.
    reason: alternative_reading
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Orang Israel
  rationale: Ungkapan Ibrani harfiah berarti “anak-anak Israel,” tetapi secara idiomatis menunjuk kepada bangsa Israel secara kolektif. “Orang Israel” alami dalam bahasa Indonesia modern tanpa mengubah acuannya.
- source_word: הָרַע בְּעֵינֵי יְהוָה
  choice: apa yang jahat di mata Yahweh
  rationale: Mempertahankan rumusan evaluatif Ibrani dan unsur idiomatis “di mata,” yakni apa yang dinilai jahat oleh Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung, bukan menggantinya dengan gelar.
- source_word: וַיִּשְׁכְּחוּ
  choice: mereka melupakan
  rationale: Menerjemahkan makna dasar שׁכח secara langsung; dalam konteks perjanjian, tindakan ini juga menyiratkan pengabaian praktis, tetapi implikasi itu tidak dimasukkan secara eksplisit.
- source_word: אֱלֹהֵיהֶם
  choice: Allah mereka
  rationale: Karena acuannya adalah Yahweh, bentuk ini bermakna tunggal dan diterjemahkan “Allah mereka.”
- source_word: וַיַּעַבְדוּ
  choice: beribadah kepada
  rationale: Dalam konteks kultis, עבד berarti melayani atau menyembah. “Beribadah kepada” menyampaikan tindakan keagamaan secara alami dalam bahasa Indonesia.
- source_word: הַבְּעָלִים
  choice: para Baal
  rationale: Mempertahankan bentuk jamak Ibrani, yang dapat menunjuk pada berbagai manifestasi atau bentuk pemujaan Baal setempat.
- source_word: הָאֲשֵׁרוֹת
  choice: Asyera-asyera
  rationale: Mempertahankan bentuk jamak serta ambiguitas apakah istilah itu menunjuk kepada representasi atau benda kultis Asyera, atau kepada pemujaan Asyera secara lebih luas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung; bentuk “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Makna הָאֲשֵׁרוֹת
  choice: Asyera-asyera
  alternative: tiang-tiang Asyera
  rationale: Istilah Ibrani dapat menunjuk pada benda-benda kultis yang berkaitan dengan Asyera atau, secara lebih luas, representasi dan pemujaannya. Pilihan utama mempertahankan ketidakpastian tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Struktur dua kalimat menghindari rangkaian konjungsi yang kaku, sedangkan “lalu” tetap menyampaikan kesinambungan tindakan. Semua penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
