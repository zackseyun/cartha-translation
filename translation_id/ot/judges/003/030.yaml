  source_fidelity: Teks Indonesia dengan setia menerjemahkan וַתִּכָּנַע sebagai “ditundukkan,” mempertahankan Moab sebagai subjek yang berada di bawah kuasa Israel tanpa menyiratkan pemusnahan. “Pada hari itu,” “selama delapan puluh tahun,” dan rujukan “negeri itu” sesuai dengan unsur-unsur Ibrani. “Tenteram” secara wajar menyampaikan שקט dalam konteks berhentinya gangguan atau konflik.
