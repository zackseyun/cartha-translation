id: JDG.3.30
reference: Judges 3:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תִּכָּנַ֤ע מוֹאָב֙ בַּ/יּ֣וֹם הַ/ה֔וּא תַּ֖חַת יַ֣ד יִשְׂרָאֵ֑ל וַ/תִּשְׁקֹ֥ט הָ/אָ֖רֶץ שְׁמוֹנִ֥ים שָׁנָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/030.yaml
  text: So Moab was subdued under the hand of Israel that day[c][b][a], and the land had rest for eighty years.
translation:
  language: id
  text: Pada hari itu Moab pun ditundukkan di bawah kekuasaan Israel,[a] dan negeri itu tenteram[b] selama delapan puluh tahun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di bawah tangan Israel,” sebuah ungkapan yang berarti berada di bawah kuasa Israel.
    reason: cultural_note
  - marker: b
    text: Atau “tenang” atau “mengalami masa damai.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכָּנַע
  choice: ditundukkan
  rationale: Bentuk Nifal dari כנע menyatakan bahwa Moab dibawa ke dalam keadaan takluk. Pilihan ini mempertahankan makna militer-politis tanpa menguatkannya menjadi pemusnahan.
- source_word: מוֹאָב
  choice: Moab
  rationale: Bentuk nama bangsa yang baku dalam bahasa Indonesia.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu
  rationale: Terjemahan langsung dan alami untuk ungkapan waktu dengan unsur penunjuk.
- source_word: תַּחַת יַד יִשְׂרָאֵל
  choice: di bawah kekuasaan Israel
  rationale: Mengungkapkan makna idiom Ibrani secara alami dalam bahasa Indonesia, sementara citra harfiahnya dijelaskan dalam catatan kaki.
- source_word: וַתִּשְׁקֹט
  choice: tenteram
  rationale: Kata שקט menunjuk pada keadaan tenang dan bebas dari gangguan atau peperangan. 'Tenteram' sesuai dengan konteks masa damai dalam kitab Hakim-Hakim.
- source_word: הָאָרֶץ
  choice: negeri itu
  rationale: Dalam konteks ini menunjuk pada wilayah Israel secara keseluruhan. 'Negeri itu' alami dalam bahasa Indonesia dan tidak memperluas rujukannya.
- source_word: שְׁמוֹנִים שָׁנָה
  choice: selama delapan puluh tahun
  rationale: Kata 'selama' menyatakan rentang waktu secara wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat penguasaan Israel atas Moab
  choice: penaklukan militer-politis
  alternative: sekadar perendahan secara kiasan atau pemusnahan total
  rationale: Ayat ini menyatakan Moab dibawa ke bawah kuasa Israel dan kemudian negeri mengalami ketenteraman. Terjemahan tidak melemahkan penaklukan menjadi keadaan batin ataupun menguatkannya menjadi pemusnahan.
- issue: Sifat ketenteraman negeri
  choice: keadaan tenang dan bebas dari konflik
  alternative: istirahat dalam arti fisik atau damai dalam pengertian teologis yang lebih khusus
  rationale: Kata sumber menyatakan berhentinya gangguan; 'tenteram' mempertahankan cakupan ini tanpa memasukkan penafsiran teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mengikuti alur Ibrani, tetapi idiom 'di bawah tangan' dialihkan ke bentuk yang mudah dipahami dan bentuk harfiahnya dipertahankan dalam catatan kaki.
