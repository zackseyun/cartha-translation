    rationale: Frasa Ibrani tersebut melekat pada ruang atas dan menekankan bahwa ruang itu milik/penggunaan pribadi Eglon. Terjemahan semula dapat menggeser penekanan menjadi keadaan Eglon duduk tanpa orang lain.
