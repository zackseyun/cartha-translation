  text: וְ/אֵה֣וּד בָּ֣א אֵלָ֗י/ו וְ/הֽוּא יֹ֠שֵׁב בַּ/עֲלִיַּ֨ת הַ/מְּקֵרָ֤ה אֲשֶׁר ל/וֹ֙ לְ/בַדּ֔/וֹ וַ/יֹּ֣אמֶר אֵה֔וּד דְּבַר אֱלֹהִ֥ים לִ֖/י אֵלֶ֑י/ךָ וַ/יָּ֖קָם מֵ/עַ֥ל הַ/כִּסֵּֽא׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/020.yaml
  text: Then Ehud came to him while he was sitting alone in his cool roof chamber[a], and Ehud said[c][b], “I have a word from God for you.” So he rose from his seat.
translation:
  language: id
  text: Kemudian Ehud datang kepadanya ketika ia sedang duduk di ruang atas yang sejuk, yang khusus untuk dirinya.[a] Ehud berkata, “Aku memiliki pesan dari Allah untukmu.”[b] Lalu ia bangkit dari tempat duduknya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ruang atas di atap yang sejuk.” Makna tepat ungkapan Ibraninya tidak pasti; ruang itu mungkin dibuat sejuk atau memiliki ventilasi.
    reason: lexical_alternative
  - marker: b
    text: Atau “firman dari Allah.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “dari atas tempat duduk”; kata Ibraninya juga dapat berarti “kursi” atau “takhta.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא
  choice: datang
  rationale: Kata kerja ini menyatakan kedatangan Ehud kepada Eglon tanpa merinci cara ia mendekat.
- source_word: יֹשֵׁב
  choice: sedang duduk
  rationale: Bentuk partisip Ibrani memberi latar tindakan yang sedang berlangsung ketika Ehud datang.
- source_word: עֲלִיַּת הַמְּקֵרָה
  choice: ruang atasnya yang sejuk
  rationale: עֲלִיָּה menunjuk ruang di bagian atas bangunan, sedangkan הַמְּקֵרָה kemungkinan menggambarkan ruang yang dibuat sejuk atau berventilasi. Bentuk dengan -nya juga sesuai dengan keterangan berikut bahwa ruang itu dikhususkan bagi Eglon.
- source_word: אֲשֶׁר לוֹ לְבַדּוֹ
  choice: seorang diri
  rationale: Ungkapan ini menekankan bahwa Eglon berada sendirian di ruang yang diperuntukkan baginya; susunan Indonesia menyampaikan unsur privasi secara alami.
- source_word: דְּבַר אֱלֹהִים
  choice: firman dari Allah
  rationale: דָּבָר dapat berarti perkataan atau pesan. 'Firman' mempertahankan hubungan verbal dengan ungkapan Ibrani, sementara 'dari Allah' menyatakan sumbernya dengan jelas tanpa menjadikannya istilah teknis 'Firman Allah'.
- source_word: לִי אֵלֶיךָ
  choice: Aku mendapat ... untukmu
  rationale: Susunan ini mengungkapkan bahwa firman itu datang kepada Ehud dan ditujukan kepada Eglon, dengan bahasa Indonesia yang alami.
- source_word: וַיָּקָם
  choice: ia bangkit
  rationale: Terjemahan ringkas dan bermartabat untuk tindakan berdiri dari posisi duduk.
- source_word: מֵעַל הַכִּסֵּא
  choice: dari tempat duduknya
  rationale: כִּסֵּא dapat berarti tempat duduk, kursi, atau takhta. Konteks ruang pribadi tidak memastikan bahwa yang dimaksud adalah takhta.
theological_decisions:
- issue: Makna אֱלֹהִים dalam perkataan Ehud
  choice: Allah
  alternative: allah-allah
  rationale: Walaupun bentuk katanya secara morfologis jamak, אֱלֹהִים sangat lazim dipakai dengan arti tunggal. Dalam frasa דְּבַר אֱלֹהִים dan konteks ini, 'Allah' adalah pembacaan yang paling wajar. Terjemahan hanya melaporkan ucapan Ehud tanpa menilai klaimnya.
translation_notes:
  register: Bahasa naratif modern, jelas, dan bermartabat. 'Ia' dipakai untuk Eglon dalam narasi, sedangkan 'Aku' dan '-mu' mempertahankan sapaan langsung Ehud. Penanda catatan kaki ditempatkan pada frasa yang benar, karena penempatan penanda dalam lapisan konsultasi Inggris tidak selaras dengan isi catatannya.
