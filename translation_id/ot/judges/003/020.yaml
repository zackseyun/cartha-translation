    issue: “Aku mendapat firman dari Allah untukmu”
    rationale: Kata “mendapat” menyatakan tindakan menerima/memperoleh dan bukan padanan yang tepat bagi konstruksi nominal Ibrani dalam ujaran ini, yang berfungsi seperti “Aku memiliki sebuah pesan dari Allah untukmu.”
  - severity: medium
