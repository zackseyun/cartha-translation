id: JDG.3.1
reference: Judges 3:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אֵ֤לֶּה הַ/גּוֹיִם֙ אֲשֶׁ֣ר הִנִּ֣יחַ יְהוָ֔ה לְ/נַסּ֥וֹת בָּ֖/ם אֶת יִשְׂרָאֵ֑ל אֵ֚ת כָּל אֲשֶׁ֣ר לֹֽא יָדְע֔וּ אֵ֖ת כָּל מִלְחֲמ֥וֹת כְּנָֽעַן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/001.yaml
  text: 'These are the nations that Yahweh left to test Israel by them[a], that is, all who had not known any of the wars of Canaan:'
translation:
  language: id
  text: 'Inilah bangsa-bangsa yang Yahweh biarkan tetap tinggal untuk menguji Israel melalui mereka, yakni semua orang Israel yang tidak pernah mengenal[a] satu pun peperangan Kanaan:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: mengalami.'
    reason: Verba יָדַע dapat berarti “mengenal” dan, dalam konteks ini, dapat menunjuk pada pengalaman langsung dalam peperangan.
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Inilah
  rationale: Demonstratif ini memperkenalkan daftar baru sambil melanjutkan narasi. “Inilah” alami dalam bahasa Indonesia dan tidak menambahkan keterangan waktu yang tidak ada dalam teks sumber.
- source_word: הַגּוֹיִם
  choice: bangsa-bangsa
  rationale: Istilah ini menunjuk pada kelompok-kelompok etnis-politis yang tetap berada di negeri itu; “bangsa-bangsa” merupakan padanan yang baku dan sesuai konteks.
- source_word: הִנִּיחַ
  choice: biarkan tetap tinggal
  rationale: Bentuk kausatif verba ini dapat berarti membiarkan atau membuat tetap berada. Ungkapan ini memperjelas bahwa bangsa-bangsa tersebut dibiarkan tetap ada di Kanaan tanpa menambah alasan di luar teks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: לְנַסּוֹת
  choice: untuk menguji
  rationale: נסה di sini menyatakan tindakan menguji atau membuktikan. “Menguji” jelas, wajar, dan tidak memasukkan nuansa negatif “menggoda”.
- source_word: בָּם
  choice: melalui mereka
  rationale: Preposisi dengan sufiks pronominal menyatakan sarana pengujian, yaitu bangsa-bangsa tersebut. “Melalui mereka” mempertahankan hubungan instrumental itu.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Nama diri yang menjadi objek langsung verba “menguji” dipertahankan secara langsung.
- source_word: אֵת כָּל אֲשֶׁר לֹא יָדְעוּ
  choice: yakni semua orang Israel yang tidak pernah mengenal
  rationale: Frasa ini menjelaskan kelompok dalam Israel yang dimaksud. “Orang Israel” diulang secara eksplisit agar hubungan aposisionalnya jelas dalam bahasa Indonesia, sedangkan “mengenal” mempertahankan idiom Ibrani.
- source_word: אֵת כָּל מִלְחֲמוֹת כְּנָעַן
  choice: satu pun peperangan Kanaan
  rationale: Secara harfiah frasa ini berarti “segala peperangan Kanaan”. Dalam cakupan negasi, “tidak pernah ... satu pun” menyampaikan bahwa mereka tidak mengenal peperangan-peperangan tersebut sama sekali, sementara “peperangan Kanaan” mempertahankan hubungan genitif yang dapat merujuk pada peperangan yang berkaitan dengan Kanaan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian יהוה secara langsung. Alih aksara “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan sebuah gelar.
- issue: Maksud pengujian ilahi
  choice: untuk menguji Israel melalui mereka
  alternative: untuk membuktikan Israel melalui mereka
  rationale: Teks menyatakan bahwa Yahweh membiarkan bangsa-bangsa itu tetap tinggal dengan tujuan menguji Israel. Terjemahan mempertahankan ketegangan teologis ini tanpa melunakkan atau menjelaskan hasil maupun motif pengujian lebih jauh.
- issue: Kelompok Israel yang dimaksud
  choice: yakni semua orang Israel yang tidak pernah mengenal satu pun peperangan Kanaan
  alternative: yaitu semua yang tidak pernah mengalami peperangan Kanaan
  rationale: Frasa kedua dipahami sebagai penjelasan aposisional tentang Israel, khususnya generasi yang tidak memiliki pengenalan langsung terhadap peperangan Kanaan. Penyebutan ulang “orang Israel” memperjelas acuan tanpa mengubah cakupan kelompok tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat tetap dekat dengan struktur Ibrani, tetapi pengulangan “orang Israel” dipakai untuk memperjelas aposisi. Tanda titik dua dipertahankan karena ayat ini memperkenalkan daftar pada ayat berikutnya.
