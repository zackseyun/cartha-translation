base_translation:
  language: en
  yaml_path: translation/ot/judges/003/022.yaml
  text: The hilt also went in after the blade[a], and the fat closed over the blade, because he did not pull the sword out of his belly[b]; and the dung came out.
translation:
  language: id
  text: Bahkan gagangnya ikut masuk sesudah bilahnya[a], lalu lemak menutupi bilah itu, sebab Ehud tidak mencabut pedang itu dari perutnya; dan kotoran[b] keluar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pegangannya”; istilah Ibrani ini menunjuk pada bagian pedang yang berada di belakang bilah.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani yang diterjemahkan “kotoran” jarang digunakan dan mungkin secara lebih luas merujuk pada tinja atau isi usus.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּצָּב
  choice: gagangnya
  rationale: Dalam konteks pedang, kata ini menunjuk pada bagian pegangan yang ikut masuk setelah bilah. “Gagang” merupakan istilah Indonesia yang alami dan cukup luas untuk mempertahankan sedikit ketidakpastian bentuk bagian senjata itu.
- source_word: הַלַּהַב
  choice: bilahnya / bilah itu
  rationale: Walaupun kata ini dapat berarti “nyala” dalam konteks lain, di sini konteks senjata jelas menunjuk pada bilah pedang.
- source_word: וַיִּסְגֹּר ... בְּעַד
  choice: menutup
  rationale: Gabungan kata kerja dan preposisi ini menggambarkan lemak yang menutup atau menyelubungi bilah; “menutup” menyampaikan gambaran tersebut dengan wajar dalam bahasa Indonesia.
- source_word: הַחֵלֶב
  choice: lemak
  rationale: Terjemahan konkret ini mempertahankan gambaran tubuh yang lugas dan tajam dalam narasi Ibrani.
- source_word: שָׁלַף
  choice: mencabut
  rationale: Kata ini lazim dipakai untuk menarik atau menghunus senjata. Karena pedang sudah berada di dalam tubuh, “mencabut” adalah pilihan Indonesia yang paling alami.
- source_word: מִבִּטְנוֹ
  choice: dari perutnya
  rationale: “Perut” mempertahankan gaya narasi yang konkret dan umum, tanpa memakai istilah klinis seperti “abdomen”.
- source_word: הַפַּרְשְׁדֹנָה
  choice: kotoran
  rationale: Istilah Ibrani ini langka dan maknanya tidak sepenuhnya pasti, tetapi secara tradisional dipahami sebagai tinja atau isi usus. “Kotoran” jelas, bermartabat, dan mudah dipahami; ketidakpastiannya dicatat dalam catatan kaki.
- source_word: וַיֵּצֵא
  choice: keluar
  rationale: Bentuk sederhana ini menyampaikan tindakan keluar secara langsung dan alami.
- source_word: גַם
  choice: bahkan ... ikut
  rationale: Ungkapan ini menegaskan bahwa bukan hanya bilah, melainkan gagangnya pun masuk, sesuai fungsi penekanan partikel Ibrani.
