translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas, konkret, dan bermartabat. Nama “Ehud” dihadirkan untuk memperjelas subjek tersirat dalam verba Ibrani tanpa mengubah rujukannya. Kedua penanda catatan kaki ditempatkan langsung dalam teks.
