base_translation:
  language: en
  yaml_path: translation/ot/judges/003/011.yaml
  text: So the land had rest for forty years. Then Othniel son of Kenaz died.
translation:
  language: id
  text: Lalu negeri itu aman selama empat puluh tahun. Kemudian Otniel anak Kenas meninggal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּשְׁקֹט
  choice: aman
  rationale: Kata kerja שׁקט menyatakan keadaan tenang dan tidak terusik. Dalam konteks kitab Hakim-Hakim, kata ini menunjuk pada masa bebas dari penindasan sesudah pembebasan; “aman” menyampaikan makna itu secara alami tanpa menyiratkan kemakmuran total.
- source_word: הָאָרֶץ
  choice: negeri itu
  rationale: Dalam konteks ini אֶרֶץ menunjuk pada wilayah tempat Israel hidup, bukan seluruh bumi. “Negeri itu” merupakan ungkapan Indonesia yang alami dan tetap mempertahankan acuan kontekstualnya.
- source_word: אַרְבָּעִים שָׁנָה
  choice: selama empat puluh tahun
  rationale: Frasa ini menyatakan lamanya keadaan aman; “selama” membuat fungsi duratifnya jelas dalam bahasa Indonesia.
- source_word: וַיָּמָת
  choice: Kemudian ... meninggal
  rationale: Bentuk wayyiqtol melanjutkan rangkaian narasi. “Kemudian” menyatakan urutan peristiwa secara wajar, sedangkan “meninggal” adalah padanan yang netral dan bermartabat.
- source_word: עָתְנִיאֵל
  choice: Otniel
  rationale: Nama ini ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: בֶּן קְנַז
  choice: anak Kenas
  rationale: Frasa konstruksi ini mengenali Otniel berdasarkan garis keturunannya. “Anak Kenas” ringkas dan alami dalam bahasa Indonesia.
