base_translation:
  language: en
  yaml_path: translation/ot/judges/003/004.yaml
  text: And they were there to test Israel[a], to know whether they would listen to the commandments of Yahweh[c][b], which he commanded their fathers through Moses.
translation:
  language: id
  text: Bangsa-bangsa itu tetap ada untuk menguji Israel melalui mereka, untuk mengetahui apakah orang Israel akan menaati perintah-perintah Yahweh yang telah diperintahkan-Nya kepada nenek moyang mereka melalui Musa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: Bangsa-bangsa itu dibiarkan tinggal
  rationale: Bentuk ini melanjutkan konteks ayat sebelumnya tentang bangsa-bangsa yang dibiarkan berada di negeri itu. Ungkapan Indonesia ini menyampaikan keberadaan mereka yang berlanjut secara alami.
- source_word: לְנַסּוֹת בָּם אֶת־יִשְׂרָאֵל
  choice: untuk menguji Israel melalui mereka
  rationale: נסה menyatakan pengujian, sedangkan בם secara eksplisit menunjukkan bahwa bangsa-bangsa tersebut menjadi sarana pengujian. Susunan ini mempertahankan unsur instrumental itu tanpa mengartikannya sebagai godaan untuk berbuat jahat.
- source_word: לָדַעַת
  choice: supaya diketahui
  rationale: Secara harfiah berarti 'untuk mengetahui'. Bentuk pasif impersonal dalam bahasa Indonesia menjaga tujuan pengujian sekaligus menghindari penambahan subjek yang tidak dinyatakan oleh teks Ibrani.
- source_word: הֲיִשְׁמְעוּ
  choice: apakah ... mau menaati
  rationale: שמע ketika berobjek perintah berarti mendengarkan dengan mengindahkan atau menaati. 'Mau menaati' alami dalam konteks pertanyaan tidak langsung dan menyatakan respons yang dituntut.
- source_word: מִצְוֺת
  choice: perintah-perintah
  rationale: Bentuk jamak menunjuk pada berbagai perintah perjanjian Yahweh; pengulangan kata mempertahankan jumlah jamaknya dengan jelas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan, bukan diganti dengan gelar, sehingga identitas nama pribadi dalam teks sumber tetap tampak.
- source_word: אֲשֶׁר צִוָּה אֶת־אֲבוֹתָם
  choice: yang telah diperintahkan-Nya kepada nenek moyang mereka
  rationale: Klausa relatif dipertahankan, dan sufiks -Nya memperjelas bahwa Yahweh adalah subjek 'memerintahkan'. 'Nenek moyang' merupakan padanan Indonesia yang wajar bagi אבות dalam arti para leluhur Israel.
- source_word: בְּיַד־מֹשֶׁה
  choice: melalui Musa
  rationale: Idiom 'dengan tangan Musa' menyatakan perantaraan atau keagenan. 'Melalui Musa' menyampaikan fungsi perantara tersebut dalam bahasa Indonesia modern.
theological_decisions:
- issue: Makna pengujian Israel melalui bangsa-bangsa yang tersisa
  choice: Bangsa-bangsa itu merupakan sarana untuk menguji apakah Israel menaati perintah Yahweh.
  alternative: Pengujian dipahami hanya sebagai pengamatan historis tanpa tujuan teologis.
  rationale: Dua bentuk infinitif לְנַסּוֹת dan לָדַעַת menyatakan tujuan. Terjemahan mempertahankan kaitan teologis itu tanpa menjelaskan lebih jauh siapa yang perlu memperoleh pengetahuan tersebut atau menyamakannya dengan godaan.
- issue: Subjek tersirat pada לָדַעַת, 'untuk mengetahui'
  choice: Dipakai bentuk impersonal 'supaya diketahui'.
  alternative: Supaya Ia mengetahui; atau supaya mereka mengetahui.
  rationale: Teks Ibrani tidak menyebutkan subjek eksplisit bagi tindakan mengetahui. Bentuk impersonal mempertahankan ambiguitas itu dan tidak menyelesaikan ketegangan teologis mengenai pengetahuan Allah.
- issue: Penerjemahan nama יהוה
  choice: Yahweh
  alternative: TUHAN; atau Yehova.
  rationale: Transliterasi 'Yahweh' mempertahankan nama ilahi sebagai nama pribadi yang terdapat dalam teks sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Orang Israel' dipakai pada klausa berikutnya untuk menghindari kesan bahwa nama kolektif 'Israel' merujuk kepada satu individu. Tidak diperlukan catatan kaki karena unsur instrumental בם dipertahankan langsung dalam teks utama dan ambiguitas subjek לָדַעַת dijaga melalui bentuk impersonal.
