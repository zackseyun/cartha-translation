revisions:
- from: Bangsa-bangsa itu dibiarkan tinggal untuk menguji Israel melalui mereka, supaya diketahui apakah orang Israel mau menaati perintah-perintah Yahweh yang telah diperintahkan-Nya kepada nenek moyang mereka melalui Musa.
  to: Bangsa-bangsa itu tetap ada untuk menguji Israel melalui mereka, untuk mengetahui apakah orang Israel akan menaati perintah-perintah Yahweh yang telah diperintahkan-Nya kepada nenek moyang mereka melalui Musa.
  rationale: “Tetap ada” menyampaikan keberadaan berkelanjutan dalam alur narasi tanpa memasukkan verba “membiarkan” dari konteks. “Untuk mengetahui” mempertahankan tujuan kedua dan ambiguitas mengenai subjek yang mengetahui. “Akan menaati” secara idiomatis menyatakan pertanyaan apakah Israel akan mengindahkan perintah-perintah Yahweh, tanpa menambahkan unsur kemauan.
