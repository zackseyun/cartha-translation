  text: וּ/בְנֵ֣י יִשְׂרָאֵ֔ל יָשְׁב֖וּ בְּ/קֶ֣רֶב הַֽ/כְּנַעֲנִ֑י הַ/חִתִּ֤י וְ/הָֽ/אֱמֹרִי֙ וְ/הַ/פְּרִזִּ֔י וְ/הַ/חִוִּ֖י וְ/הַ/יְבוּסִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/005.yaml
  text: And the sons of Israel lived among the Canaanites[a], the Hittites, the Amorites, the Perizzites, the Hivites, and the Jebusites.
translation:
  language: id
  text: Orang Israel tinggal di antara orang Kanaan, orang Het, orang Amori, orang Feris, orang Hewi, dan orang Yebus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Orang Israel
  rationale: Ungkapan harfiah 'anak-anak lelaki Israel' merupakan sebutan kolektif bagi bangsa Israel. 'Orang Israel' adalah padanan Indonesia yang alami dan mencakup seluruh umat tanpa mengaburkan identitas kolektifnya.
- source_word: יָשְׁבוּ
  choice: tinggal
  rationale: Kata ישׁב di sini menyatakan keberadaan atau kediaman yang berlangsung; 'tinggal' alami dalam bahasa Indonesia dan tidak memberi penekanan tambahan pada tindakan mulai menetap.
- source_word: בְּקֶרֶב
  choice: di antara
  rationale: Ungkapan ini menyatakan hidup di tengah kelompok-kelompok bangsa lain; 'di antara' mempertahankan hubungan spasial dan sosial tersebut secara alami.
- source_word: הַכְּנַעֲנִי
  choice: orang Kanaan
  rationale: Bentuk tunggal dalam bahasa Ibrani berfungsi sebagai nama bangsa secara kolektif; pola Indonesia 'orang + nama bangsa' menyampaikan makna kolektif dengan wajar.
- source_word: הַחִתִּי
  choice: orang Het
  rationale: Etnonim kolektif diterjemahkan menurut bentuk nama bangsa yang lazim dalam bahasa Indonesia.
- source_word: הָאֱמֹרִי
  choice: orang Amori
  rationale: Etnonim tunggal kolektif dirender sebagai nama kelompok bangsa secara alami dalam bahasa Indonesia.
- source_word: הַפְּרִזִּי
  choice: orang Feris
  rationale: Etnonim kolektif ditransliterasikan dengan bentuk Indonesia yang dikenal dalam tradisi Alkitab Indonesia.
- source_word: הַחִוִּי
  choice: orang Hewi
  rationale: Etnonim kolektif ditransliterasikan dengan bentuk Indonesia yang dikenal dan mudah dibaca.
- source_word: הַיְבוּסִי
  choice: orang Yebus
  rationale: Etnonim kolektif diterjemahkan sebagai kelompok bangsa dengan bentuk nama yang lazim dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan 'orang' mempertahankan kejelasan bahwa setiap nama menunjuk kepada kelompok bangsa. Konjungsi pembuka waw dalam bahasa Ibrani tidak diterjemahkan secara mekanis karena ayat ini terbaca alami sebagai kelanjutan narasi tanpa 'dan' dalam bahasa Indonesia.
