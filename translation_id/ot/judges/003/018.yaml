base_translation:
  language: en
  yaml_path: translation/ot/judges/003/018.yaml
  text: And when he had finished presenting the tribute[a], he sent away the people who were carrying the tribute.
translation:
  language: id
  text: Setelah Ehud selesai menyerahkan upeti[a] itu, ia menyuruh pulang orang-orang yang membawa upeti tersebut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pemberian” atau “persembahan.” Di sini istilah Ibrani ini kemungkinan menunjuk pada upeti yang diserahkan kepada seorang penguasa, bukan persembahan kurban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Setelah
  rationale: Rumus naratif ini mengantar peristiwa berikutnya dalam hubungan waktu. Dalam bahasa Indonesia modern, 'setelah' secara alami menghubungkan selesainya penyerahan upeti dengan tindakan berikutnya tanpa menerjemahkan secara kaku unsur 'terjadilah'.
- source_word: כִּלָּה
  choice: selesai
  rationale: Kata kerja ini berarti menyelesaikan atau menuntaskan; konstruksi 'setelah ... selesai' menunjukkan bahwa penyerahan telah tuntas sebelum orang-orang itu disuruh pulang.
- source_word: לְהַקְרִיב
  choice: menyerahkan
  rationale: Bentuk Hifil dari קרב berarti membawa mendekat atau mempersembahkan. Dalam konteks pemberian kepada penguasa, 'menyerahkan' alami dan menghindari kesan khusus tentang persembahan ibadah.
- source_word: הַמִּנְחָה
  choice: upeti
  rationale: Dalam konteks penaklukan Israel oleh Eglon, istilah ini kemungkinan menunjuk pada pemberian wajib kepada penguasa. 'Upeti' menangkap konteks politik itu, sedangkan alternatif leksikal dicatat dalam catatan kaki.
- source_word: וַיְשַׁלַּח
  choice: ia menyuruh pulang
  rationale: Kata kerja ini berarti menyuruh pergi atau melepas. 'Menyuruh pulang' menyatakan bahwa Ehud membubarkan rombongan pengangkut setelah tugas mereka selesai.
- source_word: הָעָם
  choice: orang-orang
  rationale: Istilah kolektif ini menunjuk pada para penyerta Ehud tanpa menentukan jenis kelamin; 'orang-orang' lebih alami daripada 'rakyat' untuk rombongan terbatas ini.
- source_word: נֹשְׂאֵי הַמִּנְחָה
  choice: yang membawa upeti tersebut
  rationale: Konstruksi partisipial menjelaskan peran orang-orang itu. Klausa relatif ini alami dalam bahasa Indonesia dan mempertahankan pengulangan istilah sumber.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. Nama 'Ehud' dimunculkan untuk memperjelas subjek tersirat dalam verba Ibrani berdasarkan konteks langsung; 'ia' dipakai selanjutnya agar kalimat tetap alami.
