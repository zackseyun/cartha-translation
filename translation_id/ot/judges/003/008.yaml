  source_fidelity: 'Teks Indonesia menyampaikan seluruh unsur Ibrani dengan setia: murka Yahweh yang menyala terhadap Israel, tindakan ''menjual'' mereka ke tangan Kusyan-Risyataim, gelarnya sebagai raja Aram-Naharaim, serta pengabdian Israel selama delapan tahun. Metafora Ibrani dipertahankan tanpa penambahan tafsiran.'
