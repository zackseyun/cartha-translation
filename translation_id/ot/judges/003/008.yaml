  terminology: “Yahweh” konsisten dengan nama ilahi dalam sumber. Transliterasi “Kusyan-Risyataim” dan “Aram-Naharaim” dapat diterima dalam ejaan Indonesia. Catatan b secara tepat menjelaskan bahwa “Orang Israel” menerjemahkan ungkapan kolektif בני ישראל, tanpa secara keliru membatasi rujukannya hanya pada laki-laki.
