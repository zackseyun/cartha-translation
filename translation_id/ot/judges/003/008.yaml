id: JDG.3.8
reference: Judges 3:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/יִשְׂרָאֵ֔ל וַֽ/יִּמְכְּרֵ֗/ם בְּ/יַד֙ כּוּשַׁ֣ן רִשְׁעָתַ֔יִם מֶ֖לֶךְ אֲרַ֣ם נַהֲרָ֑יִם וַ/יַּעַבְד֧וּ בְנֵֽי יִשְׂרָאֵ֛ל אֶת כּוּשַׁ֥ן רִשְׁעָתַ֖יִם שְׁמֹנֶ֥ה שָׁנִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/008.yaml
  text: So the anger of Yahweh burned against Israel[a], and he sold them into the hand of Cushan-rishathaim king of Aram-naharaim[b]. And the sons of Israel served Cushan-rishathaim eight years.
translation:
  language: id
  text: Maka murka Yahweh menyala terhadap Israel, lalu Ia menjual mereka ke tangan Kusyan-Risyataim, raja Aram-Naharaim.[a] Orang Israel[b] mengabdi kepada Kusyan-Risyataim selama delapan tahun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “Mesopotamia”; bahasa Ibrani: “Aram-Naharaim”, yang secara tradisional dipahami sebagai “Aram di antara Dua Sungai”.'
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “anak-anak lelaki Israel”; ungkapan Ibrani ini lazim menunjuk kepada orang Israel sebagai suatu umat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: murka ... menyala
  rationale: Mempertahankan gambaran idiom Ibrani tentang murka yang menyala, dengan susunan yang tetap jelas dan wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks, bukan menggantinya dengan gelar.
- source_word: וַיִּמְכְּרֵם
  choice: Ia menjual mereka
  rationale: Kata kerja מכר pada dasarnya berarti 'menjual'; pilihan ini mempertahankan metafora kuat tentang penghukuman perjanjian.
- source_word: בְּיַד
  choice: ke tangan
  rationale: Mempertahankan citra idiom Ibrani yang menyatakan penyerahan ke dalam kuasa atau kendali seseorang.
- source_word: כּוּשַׁן רִשְׁעָתַיִם
  choice: Kusyan-Risyataim
  rationale: Nama pribadi ditransliterasikan menurut ejaan Indonesia; tanda hubung memperlihatkan bahwa unsur-unsurnya membentuk satu sebutan.
- source_word: אֲרַם נַהֲרָיִם
  choice: Aram-Naharaim
  rationale: Nama tempat ditransliterasikan agar bentuk Ibraninya tetap terlihat; padanan tradisional dijelaskan dalam catatan kaki.
- source_word: וַיַּעַבְדוּ
  choice: mengabdi kepada
  rationale: עבד berarti 'melayani/mengabdi' dan dalam konteks ini menunjuk pada ketundukan politik. 'Mengabdi kepada' menjaga makna dasarnya tanpa secara eksplisit menambahkan gagasan perbudakan.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Orang Israel
  rationale: Ungkapan baku Ibrani ini menunjuk kepada umat Israel secara kolektif. Padanan idiomatis Indonesia lebih alami dalam teks utama, sedangkan bentuk harfiahnya dicatat.
- source_word: שְׁמֹנֶה שָׁנִים
  choice: selama delapan tahun
  rationale: Padanan langsung dan alami untuk keterangan jangka waktu tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan sebuah gelar.
- issue: Cakupan בְנֵי יִשְׂרָאֵל
  choice: Orang Israel
  alternative: anak-anak lelaki Israel atau keturunan Israel
  rationale: Dalam konteks ini ungkapan tersebut merupakan sebutan kolektif bagi umat Israel, bukan pembatasan yang jelas hanya kepada laki-laki. Catatan kaki mempertahankan informasi tentang bentuk harfiahnya.
- issue: Metafora penghukuman dalam וַיִּמְכְּרֵם בְּיַד
  choice: menjual mereka ke tangan
  alternative: menyerahkan mereka ke dalam kuasa
  rationale: Pilihan utama mempertahankan metafora penjualan dan tangan dari bahasa sumber, tanpa melunakkan tindakan ilahi menjadi parafrasa umum.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Citra utama bahasa Ibrani—murka yang menyala, menjual, dan tangan—dipertahankan, sementara ungkapan kolektif בְנֵי יִשְׂרָאֵל dibuat alami bagi pembaca Indonesia. Penanda catatan ditempatkan tepat setelah unsur yang diterangkan.
