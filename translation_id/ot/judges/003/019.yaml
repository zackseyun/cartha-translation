base_translation:
  language: en
  yaml_path: translation/ot/judges/003/019.yaml
  text: But he himself turned back from the carved images that were near Gilgal and said[a], “I have a secret message for you, O king.” And he said[c][b], “Silence.” Then all who were standing by him went out from his presence.
translation:
  language: id
  text: Tetapi Ehud sendiri kembali dari patung-patung pahatan[a] yang berada di dekat Gilgal[b], lalu berkata, “Ada pesan rahasia[c] yang hendak kusampaikan kepadamu, ya Raja.” Raja berkata, “Diam!” Lalu semua orang yang berdiri mendampinginya keluar dari hadapannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berhala-berhala.” Istilah Ibrani ini menunjuk pada benda-benda pahatan dan sering dipakai untuk patung pemujaan.
    reason: lexical_alternative
  - marker: b
    text: Atau “yang di Gilgal.” Ungkapan tempat dalam bahasa Ibrani sangat ringkas dan dapat menunjukkan lokasi di Gilgal atau di dekatnya.
    reason: lexical_alternative
  - marker: c
    text: Atau “perkataan rahasia” atau “urusan pribadi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁב
  choice: berbalik
  rationale: Menunjukkan bahwa Ehud membalik arah perjalanannya setelah mengantar persembahan; bentuk ini alami dalam alur narasi Indonesia.
- source_word: הַפְּסִילִים
  choice: patung-patung pahatan
  rationale: Mempertahankan arti konkret benda-benda yang dipahat tanpa langsung membatasi maknanya menjadi berhala, meskipun konteksnya sangat mungkin bersifat kultis.
- source_word: אֲשֶׁר אֶת־הַגִּלְגָּל
  choice: yang di dekat Gilgal
  rationale: Ungkapan Ibraninya ringkas dan eliptis; pilihan ini mempertahankan hubungan tempat tanpa memastikan bahwa patung-patung itu tepat berada di dalam Gilgal.
- source_word: דְּבַר סֵתֶר
  choice: pesan rahasia
  rationale: דבר dapat berarti perkataan, perkara, atau pesan, sedangkan סתר menunjukkan sesuatu yang tersembunyi; 'pesan rahasia' alami dalam konteks audiensi kerajaan.
- source_word: לִי אֵלֶיךָ
  choice: yang hendak kusampaikan kepadamu
  rationale: Mengungkapkan secara alami idiom kepemilikan dan arah dalam bahasa Indonesia tanpa mempertahankan susunan Ibrani yang janggal.
- source_word: הַמֶּלֶךְ
  choice: ya Raja
  rationale: Menandai sapaan langsung yang formal dan sesuai dengan ragam bahasa Indonesia yang bermartabat.
- source_word: הָס
  choice: Diam!
  rationale: Mempertahankan ketegasan dan keringkasan perintah; dalam konteks ini perintah kemungkinan ditujukan kepada para pelayan yang hadir.
- source_word: כָּל הָעֹמְדִים עָלָיו
  choice: semua orang yang berdiri mendampinginya
  rationale: Menggambarkan orang-orang yang berdiri di dekat raja sebagai para pengiring atau pelayannya tanpa menambahkan jabatan tertentu.
- source_word: מֵעָלָיו
  choice: dari hadapannya
  rationale: Menyampaikan makna penarikan diri dari kehadiran raja dalam suasana istana dengan ungkapan Indonesia yang alami.
