revisions:
- from: Namun Ehud sendiri berbalik dari patung-patung pahatan[a] yang di dekat Gilgal[b], lalu berkata, “Ada pesan rahasia[c] yang hendak kusampaikan kepadamu, ya Raja.” Raja berkata, “Diam!” Lalu semua orang yang berdiri mendampinginya keluar dari hadapannya.
  to: Tetapi Ehud sendiri kembali dari patung-patung pahatan[a] yang berada di dekat Gilgal[b], lalu berkata, “Ada pesan rahasia[c] yang hendak kusampaikan kepadamu, ya Raja.” Raja berkata, “Diam!” Lalu semua orang yang berdiri mendampinginya keluar dari hadapannya.
