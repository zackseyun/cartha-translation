translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Sapaan “ya Raja” mempertahankan formalitas istana, sementara “Diam!” menjaga ketegasan ujaran singkat dalam teks Ibrani. Semua ambiguitas leksikal utama mengenai patung, lokasi, dan pesan dipertahankan melalui catatan kaki.
