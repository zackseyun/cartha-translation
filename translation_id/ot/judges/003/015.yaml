source:
  edition: WLC
  text: וַ/יִּזְעֲק֣וּ בְנֵֽי יִשְׂרָאֵל֮ אֶל יְהוָה֒ וַ/יָּקֶם֩ יְהוָ֨ה לָ/הֶ֜ם מוֹשִׁ֗יעַ אֶת אֵה֤וּד בֶּן גֵּרָא֙ בֶּן הַ/יְמִינִ֔י אִ֥ישׁ אִטֵּ֖ר יַד יְמִינ֑/וֹ וַ/יִּשְׁלְח֨וּ בְנֵי יִשְׂרָאֵ֤ל בְּ/יָד/וֹ֙ מִנְחָ֔ה לְ/עֶגְל֖וֹן מֶ֥לֶךְ מוֹאָֽב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/015.yaml
  text: Then the sons of Israel cried out to Yahweh[a], and Yahweh raised up for them a deliverer, Ehud son of Gera, a Benjaminite, a man hindered in his right hand. And the sons of Israel sent tribute by his hand to Eglon king of Moab.
translation:
  language: id
  text: Kemudian orang Israel berseru kepada Yahweh, lalu Yahweh membangkitkan bagi mereka seorang pembebas, yaitu Ehud anak Gera, dari suku Benyamin, yang penggunaan tangan kanannya terbatas.[a] Orang Israel mengirim upeti melalui dia kepada Eglon, raja Moab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, menurut pemahaman tradisional, “seorang kidal.” Ungkapan Ibrani secara harfiah menggambarkan adanya keterbatasan atau hambatan pada tangan kanan Ehud.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: berseru
  rationale: Kata זעק menyatakan seruan dalam kesesakan atau permohonan pertolongan. “Berseru” mempertahankan urgensinya tanpa menambahkan objek yang tidak dinyatakan.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan ini secara idiomatis menunjuk kepada bangsa Israel; “orang Israel” alami dalam bahasa Indonesia modern dan tidak mempersempit rujukannya hanya kepada laki-laki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: וַיָּקֶם ... מוֹשִׁיעַ
  choice: membangkitkan bagi mereka seorang pembebas
  rationale: “Membangkitkan” mempertahankan idiom tentang tindakan Allah menetapkan seorang hakim, sedangkan “pembebas” sesuai dengan peran manusia yang melepaskan Israel dari penindasan.
- source_word: אֵהוּד בֶּן גֵּרָא
  choice: Ehud anak Gera
  rationale: Nama diri dialihaksarakan menurut bentuk yang lazim, dan בֶּן diterjemahkan langsung sebagai “anak”.
- source_word: בֶּן הַיְמִינִי
  choice: seorang dari suku Benyamin
  rationale: Bentuk ini menyatakan afiliasi suku; terjemahan tersebut lebih jelas dan alami daripada meniru susunan Ibrani secara harfiah.
- source_word: אִישׁ אִטֵּר יַד יְמִינוֹ
  choice: yang terbatas penggunaan tangan kanannya
  rationale: Ungkapan Ibrani yang tidak biasa ini menggambarkan keterbatasan pada tangan kanan dan tidak secara langsung memakai kata “kidal”. Penambahan “penggunaan” menghasilkan bahasa Indonesia yang alami tanpa menghilangkan ketaksaan sumber.
- source_word: וַיִּשְׁלְחוּ ... בְּיָדוֹ
  choice: mengirim ... melalui dia
  rationale: בְּיָדוֹ menyatakan perantaraan atau keagenan. “Melalui dia” menyampaikan bahwa Ehud membawa dan menyerahkan upeti, tanpa ungkapan Indonesia yang kaku “melalui tangannya”.
- source_word: מִנְחָה
  choice: upeti
  rationale: Dalam konteks politik ini, kata tersebut menunjuk kepada pembayaran kepada penguasa yang berkuasa, bukan persembahan ibadah atau sekadar hadiah.
- source_word: לְעֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: kepada Eglon, raja Moab
  rationale: Terjemahan langsung dengan tanda baca yang alami untuk aposisi gelar kerajaan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankannya sebagai nama perjanjian dan tidak menggantinya dengan sebuah gelar.
- issue: Makna אִטֵּר יַד יְמִינוֹ
  choice: yang terbatas penggunaan tangan kanannya
  alternative: seorang kidal
  rationale: Teks menyebut suatu keterbatasan pada tangan kanan, sedangkan “kidal” merupakan penafsiran tradisional yang masuk akal tetapi lebih tegas daripada bentuk Ibraninya. Ketaksaan dipertahankan dalam teks utama dan alternatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan naratif dibuat mengalir dengan “kemudian” dan “lalu”; istilah politik “upeti” dipertahankan. Penanda catatan kaki ditempatkan tepat setelah frasa tentang tangan kanan yang dijelaskannya.
