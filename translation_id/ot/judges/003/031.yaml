  text: וְ/אַחֲרָ֤י/ו הָיָה֙ שַׁמְגַּ֣ר בֶּן עֲנָ֔ת וַ/יַּ֤ךְ אֶת פְּלִשְׁתִּים֙ שֵֽׁשׁ מֵא֣וֹת אִ֔ישׁ בְּ/מַלְמַ֖ד הַ/בָּקָ֑ר וַ/יֹּ֥שַׁע גַּם ה֖וּא אֶת יִשְׂרָאֵֽל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/031.yaml
  text: After him was Shamgar son of Anath[a], and he struck down six hundred Philistines with an ox goad[b]; he too saved Israel.
translation:
  language: id
  text: Sesudah dia, ada Samgar anak Anat. Ia menewaskan enam ratus orang Filistin dengan tongkat penghalau lembu[a]. Ia juga menyelamatkan Israel[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tongkat penghalau lembu adalah tongkat, biasanya berujung runcing, yang digunakan untuk menggiring atau mengarahkan lembu.
    reason: cultural_note
  - marker: b
    text: Atau “membebaskan Israel.” Kata kerja Ibrani ini dapat berarti menyelamatkan atau membebaskan dalam konteks militer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: Sesudah dia
  rationale: Mempertahankan rujukan anaforis kepada tokoh sebelumnya tanpa menambahkan nama Ehud yang tidak disebutkan dalam ayat ini.
- source_word: הָיָה
  choice: ada
  rationale: Menerjemahkan verba eksistensial secara sederhana dan alami; tidak menambahkan nuansa seperti 'bangkit' atau 'muncul'.
- source_word: שַׁמְגַּר בֶּן־עֲנָת
  choice: Samgar bin Anat
  rationale: Nama ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia. 'Bin Anat' mempertahankan bentuk Ibrani secara ringkas tanpa memastikan apakah Anat adalah nama orang tua atau bagian dari gelar.
- source_word: וַיַּךְ
  choice: menewaskan
  rationale: Dalam konteks pertempuran, נכה lazim menunjuk pada tindakan memukul hingga kalah atau mati. 'Menewaskan' menyampaikan hasil yang kemungkinan besar mematikan tanpa ungkapan yang kaku.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: enam ratus orang Filistin
  rationale: Bentuk hitungan diterjemahkan secara alami dalam bahasa Indonesia dan mempertahankan jumlah yang dinyatakan teks.
- source_word: בְּמַלְמַד הַבָּקָר
  choice: dengan tongkat penghalau lembu
  rationale: Menggambarkan alat pertanian berupa tongkat, biasanya berujung runcing, yang dipakai untuk menggiring atau mengarahkan lembu.
- source_word: וַיֹּשַׁע
  choice: menyelamatkan
  rationale: ישׁע menyatakan penyelamatan atau pembebasan dari ancaman. 'Menyelamatkan' alami dalam bahasa Indonesia serta mempertahankan kosakata tematis kitab Hakim-Hakim.
- source_word: גַּם הוּא
  choice: Ia juga
  rationale: Mempertahankan penekanan aditif bahwa Samgar pun menjadi penyelamat Israel.
- source_word: אֶת־יִשְׂרָאֵל
  choice: Israel
  rationale: Objek langsung verba penyelamatan diterjemahkan secara lugas sebagai nama bangsa.
theological_decisions:
- issue: Sifat penyelamatan yang dilakukan Samgar
  choice: Ia juga menyelamatkan Israel
  alternative: Ia juga membebaskan Israel
  rationale: Ayat ini menyatakan bahwa Samgar benar-benar menyelamatkan Israel, tetapi tidak menjelaskan cakupan atau lamanya. 'Menyelamatkan' mempertahankan ketegangan itu tanpa memasukkan pengertian keselamatan rohani yang lebih luas ataupun membatasi tindakan tersebut hanya pada kemenangan militer.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Kalimat Ibrani dibagi menjadi tiga kalimat pendek agar alami dan mudah dipahami, tanpa mengubah urutan peristiwa atau menghilangkan penekanan 'juga'.
