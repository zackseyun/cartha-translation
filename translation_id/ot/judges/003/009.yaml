  text: וַ/יִּזְעֲק֤וּ בְנֵֽי יִשְׂרָאֵל֙ אֶל יְהוָ֔ה וַ/יָּ֨קֶם יְהוָ֥ה מוֹשִׁ֛יעַ לִ/בְנֵ֥י יִשְׂרָאֵ֖ל וַ/יּֽוֹשִׁיעֵ֑/ם אֵ֚ת עָתְנִיאֵ֣ל בֶּן קְנַ֔ז אֲחִ֥י כָלֵ֖ב הַ/קָּטֹ֥ן מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/009.yaml
  text: 'Then the sons of Israel cried out to Yahweh[a], and Yahweh raised up a deliverer for the sons of Israel, who delivered them: Othniel son of Kenaz[c][b], Caleb’s younger brother.'
translation:
  language: id
  text: Lalu orang Israel berseru kepada Yahweh, dan Yahweh membangkitkan bagi orang Israel seorang pembebas, yaitu Otniel anak Kenas, saudara Kaleb yang lebih muda daripada Kaleb, yang membebaskan mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “saudara Kaleb, yang lebih muda daripadanya.” Istilah Ibrani untuk “saudara” juga dapat menunjuk kepada kerabat dekat; karena itu, hubungan tepat Otniel dengan Kaleb tidak sepenuhnya pasti.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: berseru
  rationale: Dalam konteks penindasan, verba זעק menyatakan seruan mendesak untuk meminta pertolongan; “berseru” alami dalam bahasa Indonesia dan tetap memuat kesan kesesakan.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan harfiahnya “anak-anak Israel”, tetapi dalam konteks kolektif menunjuk kepada bangsa Israel; “orang Israel” lebih alami dan jelas dalam bahasa Indonesia modern.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: וַיָּקֶם
  choice: membangkitkan
  rationale: Bentuk kausatif dari קום di sini berarti membuat seseorang tampil atau bangkit untuk menjalankan suatu peran; “membangkitkan” mempertahankan citra dan idiom sumber.
- source_word: מוֹשִׁיעַ
  choice: seorang pembebas
  rationale: Partisipel dari ישׁע menunjuk kepada seorang yang menyelamatkan dari penindasan. “Pembebas” cocok dengan konteks politis-militer kitab Hakim-Hakim.
- source_word: וַיּוֹשִׁיעֵם
  choice: yang membebaskan mereka
  rationale: Verba ישׁע di sini menyatakan tindakan nyata melepaskan Israel dari penindasan; klausa relatif menjelaskan bahwa Otniel adalah pembebas yang dimaksud.
- source_word: אֵת עָתְנִיאֵל בֶּן קְנַז
  choice: yaitu Otniel anak Kenas
  rationale: Penanda אֵת dan nama sesudah klausa mengidentifikasi pembebas itu secara aposisional; “yaitu” membuat hubungan ini jelas dan alami dalam bahasa Indonesia.
- source_word: אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ
  choice: adik Kaleb
  rationale: Frasa ini paling wajar dipahami sebagai saudara laki-laki Kaleb yang lebih muda daripada Kaleb. “Adik Kaleb” ringkas dan idiomatis, sedangkan catatan kaki mempertahankan adanya persoalan hubungan sintaksis.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai nama YHWH secara langsung; “Yahweh” mempertahankannya sebagai nama pribadi, bukan menggantinya dengan gelar.
- issue: Makna מוֹשִׁיעַ dalam konteks Hakim-Hakim
  choice: pembebas
  alternative: penyelamat atau penolong
  rationale: Tokoh yang dimaksud adalah manusia yang dibangkitkan Allah untuk melepaskan Israel dari penindasan. “Pembebas” menyampaikan fungsi tersebut tanpa menghapus kaitannya dengan ranah keselamatan.
- issue: Hubungan Otniel dengan Kaleb dalam אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ
  choice: adik Kaleb
  alternative: kerabat yang lebih muda daripada Kaleb
  rationale: Pembacaan sintaksis yang paling langsung menjadikan Otniel saudara laki-laki Kaleb dan lebih muda daripadanya, tetapi istilah kekerabatan אָח dapat memiliki cakupan lebih luas; ambiguitas itu dicatat.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pengulangan akar ישׁע dipertahankan melalui “pembebas” dan “membebaskan”, sedangkan pengulangan “orang Israel” yang terasa berat diringkas menjadi pronomina tanpa mengubah acuannya.
