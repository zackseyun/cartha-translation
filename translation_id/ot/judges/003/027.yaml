base_translation:
  language: en
  yaml_path: translation/ot/judges/003/027.yaml
  text: And when he arrived[a], he blew the trumpet in the hill country of Ephraim, and the sons of Israel went down with him from the hill country[b], and he was before them.
translation:
  language: id
  text: Ketika Ehud tiba, ia meniup sangkakala di pegunungan Efraim. Orang-orang Israel turun bersama dia dari pegunungan itu, dan ia berada di depan mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי בְּבוֹאוֹ
  choice: Ketika Ehud tiba
  rationale: Konstruksi temporal Ibrani ini secara wajar menyatakan urutan waktu. Nama Ehud disebut untuk memperjelas rujukan pronomina dalam bahasa Indonesia tanpa mengubah pelaku.
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: ia meniup sangkakala
  rationale: שׁוֹפָר adalah alat tiup dari tanduk yang digunakan sebagai pemberi isyarat. 'Sangkakala' merupakan padanan Indonesia yang alami dan bermartabat dalam konteks narasi perang.
- source_word: בְּהַר אֶפְרָיִם
  choice: di pegunungan Efraim
  rationale: Dalam ungkapan geografis ini, הַר menunjuk pada kawasan dataran tinggi, bukan satu gunung tertentu.
- source_word: וַיֵּרְדוּ עִמּוֹ בְנֵי יִשְׂרָאֵל
  choice: Orang-orang Israel turun bersama dia
  rationale: בְנֵי יִשְׂרָאֵל adalah sebutan kolektif bagi orang Israel; padanan ini alami dalam bahasa Indonesia dan, dalam konteks, dapat merujuk kepada pasukan Israel tanpa menambahkan kata 'pasukan' yang tidak eksplisit.
- source_word: מִן הָהָר
  choice: dari pegunungan itu
  rationale: Frasa ini merujuk kembali pada kawasan pegunungan Efraim; 'itu' membuat hubungan anaforisnya jelas.
- source_word: וְהוּא לִפְנֵיהֶם
  choice: dan ia berjalan di depan mereka
  rationale: Secara harfiah, Ehud 'di hadapan/di depan mereka'. Dalam konteks gerak turun, 'berjalan di depan' menyampaikan posisi tersebut tanpa secara berlebihan mengubahnya menjadi pernyataan eksplisit bahwa ia memimpin.
theological_decisions:
- issue: Cakupan ungkapan kolektif בְנֵי יִשְׂרָאֵל
  choice: Orang-orang Israel
  alternative: Anak-anak lelaki Israel
  rationale: Ungkapan ini berfungsi sebagai nama kolektif bangsa atau kelompok Israel. Bentuk Indonesia yang harfiah akan terasa janggal dan dapat keliru dipahami sebagai anak-anak; konteks kemungkinan besar menunjuk para laki-laki yang dihimpun untuk bertempur, tetapi teks tidak memakai istilah khusus untuk 'pasukan'.
- issue: Implikasi kepemimpinan dalam וְהוּא לִפְנֵיהֶם
  choice: ia berjalan di depan mereka
  alternative: ia memimpin mereka
  rationale: Teks menyatakan posisi Ehud di depan kelompok itu, yang memang menyiratkan kepemimpinan, tetapi tidak perlu diperjelas menjadi verba 'memimpin' sehingga ketegangan antara posisi dan fungsi tetap terjaga.
translation_notes:
  register: Bahasa Indonesia baku, modern, naratif, dan bermartabat. Kalimat panjang Ibrani dibagi menjadi dua kalimat agar alami dibaca, sambil mempertahankan urutan tindakan.
