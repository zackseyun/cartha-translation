source:
  edition: WLC
  text: וְ/אֵה֥וּד נִמְלַ֖ט עַ֣ד הִֽתְמַהְמְהָ֑/ם וְ/הוּא֙ עָבַ֣ר אֶת הַ/פְּסִילִ֔ים וַ/יִּמָּלֵ֖ט הַ/שְּׂעִירָֽתָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/026.yaml
  text: But Ehud escaped while they delayed[b][a], and he passed beyond the carved images and escaped to Seirah.
translation:
  language: id
  text: Namun, Ehud meloloskan diri sementara mereka masih berlambat-lambat. Ia melewati patung-patung pahatan[a] itu, lalu meloloskan diri ke Seira[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “berhala-berhala” atau “patung-patung ukiran.”'
    reason: lexical_alternative
  - marker: b
    text: Nama tempat ini juga dapat ditransliterasikan “Seirat.”
    reason: alternative_reading
lexical_decisions:
- source_word: נִמְלַט / וַיִּמָּלֵט
  choice: meloloskan diri
  rationale: 'Bentuk Nifal dari מלט menunjukkan keberhasilan keluar dari bahaya. Pengulangan ungkapan ini dipertahankan untuk mencerminkan pengulangan verba Ibrani: mula-mula Ehud berhasil pergi, lalu mencapai tempat aman.'
- source_word: עַד הִתְמַהְמְהָם
  choice: sementara mereka masih berlambat-lambat
  rationale: Dalam konteks ini, konstruksi tersebut menyatakan rentang waktu ketika para pelayan terus menunda tindakan. Ungkapan ini mempertahankan nuansa tindakan yang berlangsung tanpa menjadikannya sekadar keraguan batin.
- source_word: עָבַר אֶת הַפְּסִילִים
  choice: melewati patung-patung pahatan itu
  rationale: Verba עבר dengan objek langsung dalam konteks perjalanan berarti bergerak melewati sebuah tengara. Kata penunjuk 'itu' membuat rujukan tentu dari artikel Ibrani terasa alami dalam bahasa Indonesia.
- source_word: הַפְּסִילִים
  choice: patung-patung pahatan
  rationale: פסילים secara harfiah menunjuk pada benda atau patung yang dipahat. Pilihan ini mempertahankan bentuk leksikalnya dan tidak memutuskan secara tersirat apakah penekanan teks terletak pada fungsi berhalanya atau pada benda pahatannya sebagai tengara.
- source_word: הַשְּׂעִירָתָה
  choice: ke Seira
  rationale: Nama tempat ditransliterasikan sebagai 'Seira', sedangkan akhiran ה arah diterjemahkan dengan preposisi 'ke'.
- source_word: וְ
  choice: Namun
  rationale: Konjungsi pembuka menandai kontras naratif dengan para pelayan yang masih menunggu dalam ayat sebelumnya; 'Namun' menyampaikan hubungan itu secara alami.
