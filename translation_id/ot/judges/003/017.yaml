  yaml_path: translation/ot/judges/003/017.yaml
  text: He presented the tribute to Eglon king of Moab[a]. Now Eglon was a very fat man.
translation:
  language: id
  text: Ia menyerahkan upeti itu kepada Eglon, raja Moab.[a] Eglon adalah seorang pria yang sangat gemuk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pemberian” atau “persembahan”. Kata Ibrani minḥah dapat berarti persembahan atau pemberian, tetapi di sini kemungkinan besar menunjuk pada upeti yang dibayarkan oleh bangsa taklukan kepada penguasanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: Ia menyerahkan
  rationale: Bentuk Hifil dari קרב di sini berarti membawa atau mempersembahkan sesuatu kepada seorang penguasa. Dalam konteks penyerahan upeti, “menyerahkan” terdengar alami dan tepat.
- source_word: הַמִּנְחָה
  choice: upeti
  rationale: מִנְחָה dapat berarti pemberian atau persembahan, tetapi konteks penaklukan Israel oleh Moab menunjukkan pembayaran wajib kepada penguasa, sehingga “upeti” paling tepat.
- source_word: לְעֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: kepada Eglon, raja Moab
  rationale: Susunan aposisi ini alami dalam bahasa Indonesia dan mempertahankan nama diri serta gelar yang terdapat dalam teks sumber.
- source_word: וְעֶגְלוֹן
  choice: Eglon adalah
  rationale: Waw memperkenalkan keterangan naratif tentang Eglon. Dalam bahasa Indonesia, kalimat baru tanpa padanan eksplisit untuk waw menyampaikan fungsi wacana itu secara alami.
- source_word: אִישׁ
  choice: orang
  rationale: Dalam konstruksi אִישׁ בָּרִיא, “orang yang” merupakan ungkapan Indonesia yang alami untuk menggambarkan Eglon, sementara referen laki-lakinya sudah jelas dari nama dan konteks.
- source_word: בָּרִיא
  choice: gemuk
  rationale: Kata ini menunjuk pada kegemukan atau tubuh yang tambun. “Gemuk” adalah padanan langsung dan penting bagi perkembangan narasi berikutnya.
- source_word: מְאֹד
  choice: sangat
  rationale: Padanan adverbial yang lazim dan tepat bagi intensifier Ibrani ini.
