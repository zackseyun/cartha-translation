  source_fidelity: Terjemahan mempertahankan dua kali רַק (“hanya”), tujuan לְמַעַן, serta ketidakspesifikan ידע dengan “mengenal.” Namun, objek “peperangan” perlu dinyatakan pada klausa pertama agar rujukan sufiks -ם dalam לֹא יְדָעוּם jelas dan agar makna sumber tidak tampak menjadi sekadar ‘tahu’ tanpa objek.
  naturalness: “Generasi-generasi keturunan Israel” kurang alami dalam bahasa Indonesia modern. “Generasi-generasi orang Israel” lebih idiomatis untuk kelompok korporat ini. Penambahan “dapat” membuat tujuan dalam bahasa Indonesia mengalir tanpa menambah isi substantif.
  terminology: “Orang Israel” adalah sebutan korporat yang lazim dan alami; catatan kaki mempertahankan bentuk harfiahnya, “anak-anak Israel.” “Mengenal peperangan” mempertahankan keluasan ידע, sedangkan “mengajar mereka berperang” menyampaikan לְלַמְּדָם מִלְחָמָה secara idiomatis. Catatan alternatif untuk ‘mengalami perang’ tetap diperlukan.
