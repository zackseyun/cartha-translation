  text: רַ֗ק לְמַ֨עַן֙ דַּ֚עַת דֹּר֣וֹת בְּנֵֽי יִשְׂרָאֵ֔ל לְ/לַמְּדָ֖/ם מִלְחָמָ֑ה רַ֥ק אֲשֶׁר לְ/פָנִ֖ים לֹ֥א יְדָעֽוּ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/002.yaml
  text: only so that the generations of the sons of Israel might know[b][a], to teach them war—only those who formerly had not known it.
translation:
  language: id
  text: Hanya supaya generasi-generasi orang Israel[a] dapat mengenal peperangan, untuk mengajar mereka berperang—hanya mereka yang sebelumnya belum mengenalnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “keturunan Israel.” Secara harfiah, “anak-anak Israel.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “belum mengalami perang sebelumnya.”
    reason: alternative_reading
lexical_decisions:
- source_word: רַק
  choice: hanya
  rationale: Partikel ini membatasi tujuan dan muncul dua kali; pengulangannya dipertahankan.
- source_word: לְמַעַן
  choice: supaya
  rationale: Menyatakan tujuan secara alami dalam bahasa Indonesia modern.
- source_word: דַּעַת
  choice: tahu
  rationale: Mempertahankan arti dasar ידע dan tidak langsung mempersempitnya menjadi ‘mengalami’ atau ‘belajar’.
- source_word: דֹּרוֹת בְּנֵי יִשְׂרָאֵל
  choice: generasi-generasi keturunan Israel
  rationale: Mewakili bentuk jamak ‘generasi-generasi’ serta ungkapan korporat harfiah ‘anak-anak Israel’ dengan bahasa Indonesia yang wajar.
- source_word: לְלַמְּדָם מִלְחָמָה
  choice: untuk mengajari mereka berperang
  rationale: Piel למד berarti ‘mengajari mereka’; bersama מִלְחָמָה, ungkapan idiomatis Indonesianya adalah ‘mengajari mereka berperang’.
- source_word: אֲשֶׁר לְפָנִים
  choice: mereka yang dahulu
  rationale: Menunjukkan kelompok pada masa sebelumnya tanpa menambahkan gagasan yang tidak tersurat.
- source_word: לֹא יְדָעוּם
  choice: tidak mengenalnya
  rationale: Mempertahankan kata kerja ‘mengenal/mengetahui’; pronomina ‘-nya’ merujuk secara kolektif kepada perang atau peperangan.
theological_decisions:
- issue: Ungkapan korporat בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: orang Israel; anak-anak Israel
  rationale: Ungkapan ini menamai umat Israel secara korporat. ‘Keturunan Israel’ mempertahankan hubungan genealogis tanpa memberi kesan bahwa yang dimaksud hanya anak kecil atau hanya laki-laki.
- issue: Makna ‘mengetahui perang’
  choice: tahu ... tidak mengenalnya
  alternative: mengalami perang; mengenal peperangan
  rationale: Bahasa Ibrani memakai ידע, ‘tahu/mengenal’. Terjemahan utama mempertahankan keluasan maknanya, sedangkan kemungkinan makna pengalaman langsung dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur yang agak tersendat serta pengulangan ‘hanya’ dipertahankan karena mencerminkan sintaksis dan penekanan teks Ibrani; tanda pisah membantu keterbacaan tanpa menghapus ketegangannya.
