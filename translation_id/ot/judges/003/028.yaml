  text: וַ/יֹּ֤אמֶר אֲלֵ/הֶם֙ רִדְפ֣וּ אַחֲרַ֔/י כִּֽי נָתַ֨ן יְהוָ֧ה אֶת אֹיְבֵי/כֶ֛ם אֶת מוֹאָ֖ב בְּ/יֶדְ/כֶ֑ם וַ/יֵּרְד֣וּ אַחֲרָ֗י/ו וַֽ/יִּלְכְּד֞וּ אֶת מַעְבְּר֤וֹת הַ/יַּרְדֵּן֙ לְ/מוֹאָ֔ב וְ/לֹֽא נָתְנ֥וּ אִ֖ישׁ לַ/עֲבֹֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/028.yaml
  text: And he said to them[a], “Follow after me, for Yahweh has given your enemies, Moab, into your hand.” So they went down after him and captured the fords of the Jordan against Moab[c][b], and they did not allow anyone to cross over.
translation:
  language: id
  text: Lalu ia berkata kepada mereka, “Ikutilah aku[a], sebab Yahweh telah menyerahkan musuh-musuh kalian, yaitu Moab, ke dalam tangan kalian.” Mereka pun turun mengikuti dia, lalu merebut tempat-tempat penyeberangan Sungai Yordan ke arah Moab[b], dan tidak membiarkan seorang pun menyeberang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kejarlah aku.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “tempat-tempat penyeberangan Sungai Yordan menuju Moab.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רִדְפוּ אַחֲרַי
  choice: Ikutilah aku
  rationale: Secara leksikal רדף dapat berarti ‘mengejar’, tetapi dalam seruan kepada pasukan yang harus bergerak di belakang Ehud, ‘ikutilah aku’ paling alami dalam bahasa Indonesia; nuansa alternatif ‘kejarlah mengikuti aku’ dicatat dalam catatan kaki.
- source_word: נָתַן ... בְּיֶדְכֶם
  choice: telah menyerahkan ... ke dalam tangan kalian
  rationale: Ungkapan ini menyatakan penyerahan ke dalam kuasa pihak lain. ‘Menyerahkan’ memperjelas tindakan, sedangkan ‘ke dalam tangan kalian’ mempertahankan citra Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֹיְבֵיכֶם אֶת מוֹאָב
  choice: musuh-musuh kalian, yaitu Moab
  rationale: ‘Moab’ berada dalam aposisi terhadap ‘musuh-musuh kalian’. Kata ‘yaitu’ membuat hubungan itu jelas tanpa mengganti nama bangsa dengan etnonim ‘orang Moab’.
- source_word: וַיֵּרְדוּ אַחֲרָיו
  choice: Mereka pun turun mengikuti dia
  rationale: ‘Turun’ mempertahankan gerak geografis dari daerah perbukitan menuju lembah Yordan; ‘mengikuti dia’ menyampaikan אַחֲרָיו secara alami.
- source_word: מַעְבְּרוֹת הַיַּרְדֵּן
  choice: tempat-tempat penyeberangan Sungai Yordan
  rationale: Istilah ini menunjuk lokasi untuk menyeberangi sungai, kemungkinan arungan. Ungkapan Indonesia ini jelas dan tidak membatasi secara berlebihan pada jenis penyeberangan tertentu.
- source_word: לְמוֹאָב
  choice: ke arah Moab
  rationale: Preposisi ל dapat menyatakan arah atau tujuan. Terjemahan ini mempertahankan hubungan geografis yang ambigu dan menghindari tafsiran kontekstual ‘melawan Moab’.
- source_word: וְלֹא נָתְנוּ אִישׁ לַעֲבֹר
  choice: tidak membiarkan seorang pun menyeberang
  rationale: Ini merupakan padanan idiomatis modern bagi ungkapan harfiah ‘tidak memberikan seorang untuk menyeberang’, dengan אִישׁ dipahami secara distributif.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memuat nama diri ilahi secara langsung; ‘Yahweh’ mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar.
- issue: Nama bangsa מוֹאָב sebagai entitas kolektif
  choice: Moab
  alternative: orang-orang Moab
  rationale: Bahasa Ibrani menyebut nama bangsa dan menempatkannya sebagai aposisi bagi ‘musuh-musuh kalian’. Bentuk ‘Moab’ menjaga personifikasi kolektif asli.
- issue: Makna relasional לְמוֹאָב
  choice: ke arah Moab
  alternative: melawan Moab; bagi Moab
  rationale: Preposisi tersebut memungkinkan nuansa arah/tujuan, sedangkan ‘melawan Moab’ memasukkan kesimpulan kontekstual yang tidak dinyatakan secara tegas oleh bentuk Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk ‘kalian’ dipakai karena sapaan orang kedua jamak dinyatakan jelas dalam bahasa Ibrani. ‘Sungai Yordan’ lebih alami dan langsung dipahami daripada ‘Yordan’ saja.
