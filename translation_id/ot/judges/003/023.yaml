  text: Then Ehud went out into the vestibule and shut the doors of the upper room behind him and locked them[a].
translation:
  language: id
  text: Kemudian Ehud keluar ke serambi[a]. Ia menutup pintu-pintu kamar atas itu di belakangnya, lalu mengunci pintu-pintu itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “beranda”, “ruang depan”, atau “selasar bertiang”; istilah Ibrani ini jarang dipakai dan menunjuk pada ruang arsitektural yang berdampingan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: keluar
  rationale: Bentuk naratif dari יצא menyatakan gerak meninggalkan kamar atas; “keluar” merupakan padanan Indonesia yang langsung dan alami.
- source_word: הַמִּסְדְּרוֹנָה
  choice: menuju serambi
  rationale: Istilah מִסְדְּרוֹן sangat jarang dan menunjuk pada ruang arsitektural yang berdampingan. “Serambi” cukup luas untuk mempertahankan ketidakpastian bentuk ruang itu, sedangkan akhiran arah -ה dinyatakan dengan “menuju”.
- source_word: וַיִּסְגֹּר
  choice: menutup
  rationale: סגר lazim berarti menutup; bentuk ini alami dengan objek pintu dalam bahasa Indonesia.
- source_word: דַּלְתוֹת
  choice: pintu-pintu
  rationale: Bentuk Ibrani adalah jamak dan mungkin menunjuk pada dua daun pintu; “pintu-pintu” mempertahankan bentuk jamak tanpa menentukan konstruksinya.
- source_word: הָעֲלִיָּה
  choice: kamar atas
  rationale: עֲלִיָּה adalah kamar atau ruangan pada bagian atas bangunan; “kamar atas” jelas dan mempertahankan gambaran arsitekturalnya.
- source_word: בַּעֲדוֹ
  choice: di belakangnya
  rationale: 'Bersama verba menutup, בְּעַד menyatakan hubungan ruang: pintu ditutup setelah Ehud keluar sehingga berada tertutup di belakangnya.'
- source_word: וְנָעָל
  choice: lalu menguncinya
  rationale: Dalam konteks pintu, נעל berarti mengunci atau memasang pengancing. “Menguncinya” alami dalam bahasa Indonesia, dengan pronomina merujuk kepada pintu-pintu.
