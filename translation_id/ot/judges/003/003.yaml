base_translation:
  language: en
  yaml_path: translation/ot/judges/003/003.yaml
  text: the five rulers of the Philistines[a], and all the Canaanites, and the Sidonians, and the Hivites who lived in the hill country of Lebanon, from Mount Baal-hermon as far as Lebo-hamath.
translation:
  language: id
  text: lima penguasa orang Filistin, seluruh orang Kanaan, orang Sidon, dan orang Hewi yang tinggal di pegunungan Lebanon, dari Gunung Baal-Hermon sampai ke Lebo-Hamat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sampai ke jalan masuk ke Hamat.” Ungkapan Ibrani ini dapat dipahami sebagai nama tempat, Lebo-Hamat, atau secara deskriptif.
    reason: alternative_reading
lexical_decisions:
- source_word: חֲמֵשֶׁת סַרְנֵי פְלִשְׁתִּים
  choice: kelima penguasa orang Filistin
  rationale: Bentuk konstruksi dengan nama bangsa yang tertentu menunjuk pada lima pemimpin politik Filistin sebagai satu kelompok yang dikenal. “Penguasa” jelas dalam bahasa Indonesia modern dan tidak membawa nuansa feodal dari “tuan”.
- source_word: וְכָל הַכְּנַעֲנִי
  choice: seluruh orang Kanaan
  rationale: Bentuk etnis tunggal berfungsi kolektif; “seluruh orang Kanaan” menyampaikan cakupan total atas kelompok tersebut secara alami.
- source_word: וְהַצִּידֹנִי
  choice: orang Sidon
  rationale: Sebutan etnis tunggal kolektif diterjemahkan sebagai nama kelompok yang lazim dan mudah dipahami.
- source_word: וְהַחִוִּי
  choice: orang Hewi
  rationale: Bentuk etnis tunggal kolektif diterjemahkan dengan sebutan kelompok yang lazim dalam bahasa Indonesia Alkitabiah.
- source_word: יֹשֵׁב
  choice: yang tinggal
  rationale: Partisipel ini menerangkan orang Hewi; klausa relatif menghasilkan bahasa Indonesia yang alami tanpa menghilangkan fungsi deskriptifnya.
- source_word: הַר הַלְּבָנוֹן
  choice: pegunungan Lebanon
  rationale: Secara harfiah frasa ini memakai bentuk tunggal “gunung”, tetapi dalam konteks geografis menunjuk kawasan bergunung di Lebanon; bentuk jamak Indonesia menghindari kesan bahwa yang dimaksud hanya satu puncak.
- source_word: מֵהַר בַּעַל חֶרְמוֹן
  choice: mulai dari Gunung Baal-Hermon
  rationale: Nama tempat dipertahankan melalui transliterasi; “mulai dari” menyatakan batas awal wilayah dengan wajar.
- source_word: עַד לְבוֹא חֲמָת
  choice: sampai ke Lebo-Hamat
  rationale: Ungkapan ini diperlakukan sebagai nama tempat yang dikenal dalam geografi Alkitab, sambil mencatat kemungkinan pemahaman deskriptif dalam catatan kaki.
