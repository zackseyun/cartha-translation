  text: וַ/יַּעַבְד֤וּ בְנֵֽי יִשְׂרָאֵל֙ אֶת עֶגְל֣וֹן מֶֽלֶךְ מוֹאָ֔ב שְׁמוֹנֶ֥ה עֶשְׂרֵ֖ה שָׁנָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/014.yaml
  text: And the sons of Israel served Eglon king of Moab for eighteen years[a].
translation:
  language: id
  text: Maka orang Israel mengabdi kepada Eglon, raja Moab, selama delapan belas tahun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, dengan mengungkapkan maknanya secara lebih langsung: “Maka orang Israel tunduk kepada Eglon, raja Moab, selama delapan belas tahun.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַבְדוּ
  choice: mengabdi kepada
  rationale: Dalam konteks ini, עבד menyatakan pelayanan yang dipaksakan atau ketundukan politik kepada penguasa asing, bukan ibadah. “Mengabdi kepada” mempertahankan citra dasar verba Ibrani sambil tetap wajar dalam bahasa Indonesia; makna politik yang lebih eksplisit dicantumkan dalam catatan kaki.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan ini merupakan sebutan kolektif bagi bangsa Israel. “Orang Israel” alami dalam bahasa Indonesia modern dan tidak mempersempit rujukannya hanya kepada anak laki-laki biologis.
- source_word: אֶת עֶגְלוֹן
  choice: Eglon
  rationale: אֶת adalah penanda objek langsung dan tidak diterjemahkan tersendiri; nama עֶגְלוֹן ditransliterasikan sebagai “Eglon”.
- source_word: מֶלֶךְ מוֹאָב
  choice: raja Moab
  rationale: Frasa konstruksi Ibrani ini diterjemahkan secara alami sebagai gelar dalam aposisi sesudah nama Eglon.
- source_word: שְׁמוֹנֶה עֶשְׂרֵה שָׁנָה
  choice: selama delapan belas tahun
  rationale: Bentuk ini menyatakan durasi; “selama” membuat fungsi temporalnya jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Arti pelayanan Israel kepada Eglon
  choice: mengabdi kepada
  alternative: tunduk kepada
  rationale: Teks menggambarkan dominasi politik Eglon, bukan penyembahan. Terjemahan utama mempertahankan cakupan leksikal עבד, sedangkan alternatif di catatan kaki menjelaskan implikasi politiknya tanpa memasukkannya secara berlebihan ke dalam teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Maka” mencerminkan kesinambungan naratif waw-konsekutif. Tanda baca aposisi memperjelas bahwa “raja Moab” adalah gelar Eglon.
