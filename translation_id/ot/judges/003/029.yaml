base_translation:
  language: en
  yaml_path: translation/ot/judges/003/029.yaml
  text: And at that time they struck down about ten thousand men of Moab[a], every stout man and every man of valor[c][b]; not a man escaped.
translation:
  language: id
  text: Pada waktu itu mereka menewaskan kira-kira sepuluh ribu orang-orang Moab, semuanya orang yang tegap[a] dan cakap berperang[b]. Tidak seorang pun lolos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “semuanya yang gemuk”; dalam konteks ini mungkin berarti orang-orang yang tegap, kuat, atau berkecukupan.
    reason: lexical_alternative
  - marker: b
    text: Atau “semuanya orang yang perkasa” atau “orang yang gagah berani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: mereka menewaskan
  rationale: Dalam konteks pertempuran, נכה menunjuk pada tindakan memukul hingga tewas atau membinasakan lawan. 'Menewaskan' menyampaikan hasil kekerasan itu secara alami dalam bahasa Indonesia.
- source_word: אֶת מוֹאָב
  choice: orang Moab
  rationale: Teks Ibrani secara harfiah menyebut 'Moab', tetapi keterangan berikutnya menghitung sekitar sepuluh ribu orang; 'orang Moab' membuat rujukan kolektif itu jelas tanpa menambah unsur yang tidak tersirat.
- source_word: בָּעֵת הַהִיא
  choice: Pada waktu itu
  rationale: Ungkapan temporal baku yang dekat dengan bentuk Ibrani dan alami dalam bahasa Indonesia modern.
- source_word: כַּעֲשֶׂרֶת אֲלָפִים אִישׁ
  choice: kira-kira sepuluh ribu orang
  rationale: Awalan כ־ menyatakan perkiraan; 'kira-kira' mempertahankan ketidakpastian jumlah tersebut.
- source_word: כָּל שָׁמֵן
  choice: semuanya orang yang kuat
  rationale: שָׁמֵן secara harfiah berarti 'gemuk', tetapi dalam konteks militer kemungkinan menggambarkan orang yang tegap, makmur, atau kuat. 'Orang yang kuat' menyampaikan daya kontekstualnya, sementara makna harfiahnya dicatat dalam catatan kaki.
- source_word: וְכָל אִישׁ חָיִל
  choice: dan gagah perkasa
  rationale: אִישׁ חַיִל dalam konteks peperangan menunjuk pada orang yang perkasa, cakap, atau berani. 'Gagah perkasa' merupakan ungkapan Indonesia yang wajar dan mempertahankan nuansa militer.
- source_word: וְלֹא נִמְלַט אִישׁ
  choice: Tidak seorang pun lolos
  rationale: Menyampaikan penekanan distributif dan menyeluruh dari ungkapan Ibrani secara ringkas dan alami.
