base_translation:
  language: en
  yaml_path: translation/ot/judges/003/024.yaml
  text: When he had gone out[a], his servants came and looked, and behold, the doors of the upper room were locked. So they said, “Surely he is relieving himself in the cool inner room.”
translation:
  language: id
  text: Setelah Ehud keluar, para pelayan raja datang dan melihat bahwa pintu-pintu kamar atas itu terkunci. Maka kata mereka, “Tentulah ia sedang buang air[a] di kamar dalam yang sejuk itu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menutupi kakinya,” sebuah ungkapan halus dalam bahasa Ibrani untuk membuang hajat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא יָצָא
  choice: Setelah Ehud keluar
  rationale: Klausa ini merujuk kembali pada kepergian Ehud dan menjadi latar waktu bagi kedatangan para pelayan. Nama Ehud dipakai untuk memperjelas acuan pronomina dalam bahasa Indonesia.
- source_word: עֲבָדָיו
  choice: para pelayan raja
  rationale: Dalam konteks rumah tangga kerajaan, istilah ini menunjuk para pelayan atau pengiring raja. Penambahan 'raja' memperjelas pemilik para pelayan tanpa mengharuskan pembaca menebak acuan 'nya'.
- source_word: וַיִּרְאוּ וְהִנֵּה
  choice: melihat bahwa
  rationale: Gabungan verba 'melihat' dan partikel presentatif menyatakan penemuan mereka. Bentuk ini alami dalam narasi Indonesia dan mempertahankan unsur pengamatan.
- source_word: דַּלְתוֹת הָעֲלִיָּה
  choice: pintu-pintu kamar atas itu
  rationale: עֲלִיָּה adalah ruang atau kamar di bagian atas bangunan. Bentuk jamak 'pintu-pintu' mengikuti דַּלְתוֹת.
- source_word: נְעֻלוֹת
  choice: terkunci
  rationale: Partisipel pasif dari נעל menunjukkan bahwa pintu-pintu itu dalam keadaan dikunci atau diselak; 'terkunci' paling jelas dalam bahasa Indonesia modern.
- source_word: אַךְ
  choice: Tentulah
  rationale: Partikel ini di sini mengungkapkan kesimpulan atau dugaan yakin para pelayan.
- source_word: מֵסִיךְ ... אֶת רַגְלָיו
  choice: sedang buang air
  rationale: Ungkapan Ibrani harfiah 'menutupi kakinya' merupakan eufemisme untuk membuang hajat. Terjemahan idiomatis diperlukan agar maksudnya dipahami, sedangkan bentuk harfiahnya dipertahankan dalam catatan kaki.
- source_word: בַּחֲדַר הַמְּקֵרָה
  choice: di kamar dalam yang sejuk itu
  rationale: Frasa tersebut menunjuk sebuah kamar pribadi yang dikaitkan dengan kesejukan. 'Kamar dalam yang sejuk' mempertahankan kedua unsur tanpa memastikan rincian arsitektur yang tidak dinyatakan.
theological_decisions: []
translation_notes:
  register: Bahasa naratif modern, jelas, dan bermartabat. 'Buang air' dipilih sebagai ungkapan umum yang cukup halus; catatan kaki mempertahankan idiom Ibraninya. Acuan pelaku diperjelas dengan 'Ehud' dan 'raja' untuk menghindari ambiguitas pronomina Indonesia.
