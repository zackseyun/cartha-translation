  text: וַ/יֶּאֱסֹ֣ף אֵלָ֔י/ו אֶת בְּנֵ֥י עַמּ֖וֹן וַ/עֲמָלֵ֑ק וַ/יֵּ֗לֶךְ וַ/יַּךְ֙ אֶת יִשְׂרָאֵ֔ל וַ/יִּֽירְשׁ֖וּ אֶת עִ֥יר הַ/תְּמָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/013.yaml
  text: He gathered to himself the Ammonites and Amalek[a], and he went and struck Israel[b], and they took possession of the City of Palms.
translation:
  language: id
  text: Ia menghimpun orang Amon dan Amalek[a] untuk bergabung dengannya. Kemudian ia pergi menyerang Israel, dan mereka menduduki Kota Pohon Kurma[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: orang Amalek. Dalam bahasa Ibrani, “Amalek” dipakai sebagai nama kolektif bagi kelompok bangsa itu.'
    reason: lexical_alternative
  - marker: b
    text: Kemungkinan besar yang dimaksud adalah Yerikho; bandingkan Ulangan 34:3 dan 2 Tawarikh 28:15.
    reason: cross_reference
lexical_decisions:
- source_word: וַיֶּאֱסֹף אֵלָיו
  choice: Ia menghimpun ... untuk bergabung dengannya
  rationale: Ungkapan ini menyatakan bahwa ia mengumpulkan para sekutu kepadanya atau di bawah kepemimpinannya. Susunan ini alami dalam bahasa Indonesia dan mempertahankan arah tindakan yang terkandung dalam אֵלָיו.
- source_word: בְּנֵי עַמּוֹן
  choice: orang Amon
  rationale: Ini adalah sebutan etnis; 'orang Amon' merupakan padanan Indonesia yang wajar dan jelas, sedangkan terjemahan harfiah 'anak-anak Amon' dapat disalahpahami.
- source_word: עֲמָלֵק
  choice: Amalek
  rationale: Nama diri Ibrani ini dapat dipakai secara kolektif untuk kelompok bangsanya. Bentuk sumber dipertahankan, sementara padanan eksplisit 'orang Amalek' dicatat dalam catatan kaki.
- source_word: וַיֵּלֶךְ
  choice: Kemudian ia pergi
  rationale: הלך adalah verba umum 'pergi'. Terjemahan ini mempertahankan urutan narasi tanpa menambahkan gagasan khusus seperti 'berbaris'.
- source_word: וַיַּךְ אֶת יִשְׂרָאֵל
  choice: menyerang Israel
  rationale: נכה berarti memukul atau menghantam dan dalam konteks perang dapat menyatakan serangan. 'Menyerang' menyampaikan makna militer secara alami tanpa memastikan hasil berupa kekalahan, yang tidak dinyatakan langsung oleh verba ini.
- source_word: וַיִּירְשׁוּ
  choice: mereka menduduki
  rationale: Verba berbentuk jamak dan mengacu kepada penguasa beserta pasukan sekutunya. Dalam konteks penaklukan kota, 'menduduki' secara ringkas menyampaikan tindakan mengambil dan menguasai tempat itu.
- source_word: עִיר הַתְּמָרִים
  choice: Kota Pohon Kurma
  rationale: Sebutan deskriptif Ibrani dipertahankan sebagai nama tempat dan tidak langsung diganti dengan 'Yerikho'. Kapitalisasi menandai pemakaiannya sebagai sebutan geografis.
theological_decisions:
- issue: Identifikasi עִיר הַתְּמָרִים
  choice: Kota Pohon Kurma dalam teks utama
  alternative: Yerikho
  rationale: Teks Ibrani memakai sebutan deskriptif, bukan nama Yerikho secara eksplisit. Terjemahan mempertahankan bentuk sumber, sedangkan identifikasi yang sangat mungkin ditempatkan dalam catatan kaki agar tidak menghapus perbedaan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Rangkaian kalimat Ibrani dibagi menjadi dua kalimat agar alami, tanpa mengubah urutan tindakan. Penanda catatan kaki ditempatkan pada istilah yang benar; data konsultasi Inggris tampaknya menukar posisi penanda untuk catatan tentang Amalek dan Kota Pohon Kurma.
