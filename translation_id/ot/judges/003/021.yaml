  yaml_path: translation/ot/judges/003/021.yaml
  text: Then Ehud reached with his left hand[a], took the sword from his right thigh[b], and thrust it into his belly.
translation:
  language: id
  text: Lalu Ehud mengulurkan tangan kirinya, mengambil pedang[a] dari paha kanannya, lalu menusukkannya ke perut Eglon.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “pedang”; berdasarkan konteks, senjata ini mungkin berupa pedang pendek atau belati.'
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “ke perutnya”; yang dimaksud ialah perut Eglon.'
    reason: clarification
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengulurkan
  rationale: Dalam konteks tindakan fisik dengan tangan, שׁלח berarti mengulurkan atau menjulurkan tangan; “mengulurkan” alami dan tetap dekat dengan gambaran sumber.
- source_word: יַד שְׂמֹאלוֹ
  choice: tangan kirinya
  rationale: Kata יַד secara eksplisit berarti “tangan”; frasa ini mempertahankan penekanan naratif pada penggunaan tangan kiri Ehud.
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: Padanan langsung dan wajar bagi לקח dalam rangkaian tindakan naratif, tanpa menambahkan nuansa kekerasan yang tidak diwajibkan konteks.
- source_word: הַחֶרֶב
  choice: pedang
  rationale: חֶרֶב adalah istilah umum untuk pedang. Senjata itu mungkin pendek seperti belati menurut konteks, tetapi istilah sumber lebih luas.
- source_word: מֵעַל יֶרֶךְ יְמִינוֹ
  choice: dari paha kanannya
  rationale: Ungkapan ini menunjukkan bahwa senjata diambil dari tempatnya pada paha kanan Ehud; bentuk Indonesia ini ringkas dan idiomatis.
- source_word: וַיִּתְקָעֶהָ
  choice: menikamkannya
  rationale: תקע di sini menggambarkan tindakan menusukkan senjata dengan kuat. “Menikamkannya” menyampaikan tindakan itu secara alami, sedangkan akhiran “-nya” merujuk kepada pedang.
- source_word: בְּבִטְנוֹ
  choice: ke perut Eglon
  rationale: בֶּטֶן berarti perut atau bagian perut. Nama “Eglon” dipakai agar akhiran pronominal Ibrani tidak keliru dipahami dalam bahasa Indonesia sebagai merujuk kepada Ehud.
