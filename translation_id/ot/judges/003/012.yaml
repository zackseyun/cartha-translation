language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יְחַזֵּ֨ק יְהוָ֜ה אֶת עֶגְל֤וֹן מֶֽלֶךְ מוֹאָב֙ עַל יִשְׂרָאֵ֔ל עַ֛ל כִּֽי עָשׂ֥וּ אֶת הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/012.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[a], and Yahweh strengthened Eglon king of Moab against Israel, because they had done what was evil in the eyes of Yahweh.
translation:
  language: id
  text: Orang Israel[a] kembali melakukan apa yang jahat di mata Yahweh, lalu Yahweh menguatkan Eglon, raja Moab, untuk melawan Israel, karena mereka telah melakukan apa yang jahat di mata Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, "anak-anak Israel"; juga dapat diterjemahkan secara idiomatis, "orang Israel."
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: kembali melakukan
  rationale: Idiom יסף diikuti infinitif menyatakan pengulangan tindakan; dalam pola siklus kitab Hakim-Hakim, 'kembali melakukan' menyampaikan makna itu secara alami.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Orang Israel
  rationale: Ungkapan harfiah 'anak-anak Israel' dalam konteks ini menunjuk kepada bangsa Israel. 'Orang Israel' alami dalam bahasa Indonesia modern dan tidak mempersempit rujukan kepada laki-laki saja.
- source_word: לַעֲשׂוֹת הָרַע
  choice: melakukan apa yang jahat
  rationale: Ungkapan ini menyatakan tindakan yang dinilai jahat; pilihan tersebut alami dan tetap mempertahankan sifat evaluatif teks.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Mempertahankan metafora evaluatif Ibrani yang juga jelas dan lazim dipahami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks sumber, bukan menggantinya dengan gelar.
- source_word: וַיְחַזֵּק
  choice: menguatkan
  rationale: Bentuk piel dari חזק menyatakan tindakan aktif membuat kuat atau memberi kekuatan; terjemahan ini tidak melemahkan peranan langsung Yahweh.
- source_word: אֶת עֶגְלוֹן מֶלֶךְ מוֹאָב
  choice: Eglon, raja Moab
  rationale: Menyampaikan konstruksi aposisional secara jelas dan alami dalam bahasa Indonesia.
- source_word: עַל יִשְׂרָאֵל
  choice: untuk melawan Israel
  rationale: Dalam konteks permusuhan ini, עַל menyatakan arah kekuatan Eglon terhadap Israel. 'Untuk melawan' memperjelas hubungan tersebut tanpa mengartikannya sebagai sekadar pemerintahan atas Israel.
- source_word: עַל כִּי
  choice: karena
  rationale: Gabungan partikel ini memperkenalkan alasan bagi tindakan Yahweh; 'karena' merupakan padanan Indonesia yang langsung.
- source_word: עָשׂוּ אֶת הָרַע
  choice: mereka telah melakukan apa yang jahat
  rationale: Klausa ini menyatakan tindakan Israel sebagai alasan bagi penguatan Eglon; 'telah melakukan' menunjukkan hubungan tindakan yang mendahului konsekuensinya tanpa memaksakan aspek yang terlalu teknis.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi YHWH secara langsung. 'Yahweh' mempertahankan nama pribadi itu, sedangkan 'TUHAN' menggantinya dengan gelar.
- issue: Peranan ilahi dalam וַיְחַזֵּק יְהוָה אֶת עֶגְלוֹן
  choice: Yahweh menguatkan Eglon
  alternative: Yahweh membiarkan Eglon menjadi kuat
  rationale: Kata kerja sumber menyatakan bahwa Yahweh bertindak aktif menguatkan Eglon. Terjemahan tidak mengubahnya menjadi izin pasif, sehingga ketegangan teologis teks tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam naratif yang lugas dan bermartabat. Struktur Ibrani dipertahankan bila alami, khususnya metafora 'di mata Yahweh', sedangkan ungkapan familial בְּנֵי יִשְׂרָאֵל dialihkan secara idiomatis menjadi 'Orang Israel'.
