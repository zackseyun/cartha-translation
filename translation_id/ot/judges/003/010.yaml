  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תְּהִ֨י עָלָ֥י/ו רֽוּחַ יְהוָה֮ וַ/יִּשְׁפֹּ֣ט אֶת יִשְׂרָאֵל֒ וַ/יֵּצֵא֙ לַ/מִּלְחָמָ֔ה וַ/יִּתֵּ֤ן יְהוָה֙ בְּ/יָד֔/וֹ אֶת כּוּשַׁ֥ן רִשְׁעָתַ֖יִם מֶ֣לֶךְ אֲרָ֑ם וַ/תָּ֣עָז יָד֔/וֹ עַ֖ל כּוּשַׁ֥ן רִשְׁעָתָֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/003/010.yaml
  text: The Spirit of Yahweh came upon him[a], and he judged Israel. He went out to battle, and Yahweh gave Cushan-rishathaim king of Aram into his hand[b], and his hand prevailed over Cushan-rishathaim.
translation:
  language: id
  text: Roh Yahweh datang atasnya[a], lalu ia menghakimi Israel. Ia maju berperang, dan Yahweh menyerahkan Kusyan-Risyataim, raja Aram[b], ke dalam tangannya. Tangannya pun berkuasa atas Kusyan-Risyataim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Roh Yahweh ada padanya.” Ungkapan Ibrani ini dapat diterjemahkan secara lebih statis, meskipun konteks narasi mendukung “datang atasnya.”
    reason: lexical_alternative
  - marker: b
    text: Aram adalah nama Ibrani untuk wilayah yang dalam terjemahan lama sering disebut Siria.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתְּהִי עָלָיו רוּחַ יְהוָה
  choice: Roh Yahweh turun ke atasnya
  rationale: Ungkapan היה על dengan רוּחַ menyatakan Roh Yahweh berada atau datang ke atas seseorang untuk memperlengkapinya. Dalam alur narasi ini, bentuk dinamis 'turun ke atasnya' paling alami dan menandai awal pemberdayaan, sementara kemungkinan statis dipertahankan dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, untuk mencerminkan nama pribadi dalam teks Ibrani.
- source_word: וַיִּשְׁפֹּט אֶת יִשְׂרָאֵל
  choice: ia memimpin Israel sebagai hakim
  rationale: Dalam kitab Hakim-Hakim, שׁפט mencakup tindakan menjalankan peran hakim, termasuk memimpin dan membebaskan. Ungkapan ini mempertahankan istilah khas kitab sekaligus menghindari kesan bahwa kegiatannya hanya mengadili perkara.
- source_word: וַיֵּצֵא לַמִּלְחָמָה
  choice: Ia maju berperang
  rationale: Ini merupakan ungkapan militer baku. 'Maju berperang' alami dalam bahasa Indonesia dan menyampaikan tindakan keluar menghadapi musuh.
- source_word: וַיִּתֵּן יְהוָה בְּיָדוֹ
  choice: Yahweh menyerahkan ... ke dalam tangannya
  rationale: נתן ביד adalah idiom penyerahan seorang musuh ke dalam kuasa seseorang. 'Ke dalam tangannya' mempertahankan citra Ibrani yang masih dapat dipahami dalam bahasa Indonesia.
- source_word: כּוּשַׁן רִשְׁעָתַיִם
  choice: Kusyan-Risyataim
  rationale: Nama diri ini ditransliterasikan menurut pola ejaan Indonesia; tanda hubung mempertahankan bentuk majemuknya.
- source_word: מֶלֶךְ אֲרָם
  choice: raja Aram
  rationale: Aram mempertahankan nama wilayah Ibrani dan menghindari penggantian tradisional dengan 'Siria'.
- source_word: וַתָּעָז יָדוֹ עַל
  choice: Tangannya pun menjadi kuat atas
  rationale: Terjemahan ini mempertahankan metafora tangan dalam bahasa Ibrani dan menyatakan bahwa kuasa atau dominasinya menguat atas lawan. Bentuk yang lebih idiomatis, 'ia mengalahkan', akan menghilangkan citra sumber.
theological_decisions:
- issue: Cara menerjemahkan frasa Roh ilahi
  choice: Roh Yahweh turun ke atasnya
  alternative: Roh Yahweh ada padanya
  rationale: Konteks naratif mendukung datangnya pemberdayaan ilahi, tetapi konstruksi Ibrani juga dapat dibaca secara lebih statis. Terjemahan utama mengikuti dinamika konteks tanpa menambahkan uraian doktrinal, dan alternatif dicatat.
- issue: Cakupan peran שׁפט
  choice: ia memimpin Israel sebagai hakim
  alternative: ia menghakimi Israel
  rationale: Pilihan utama memperjelas fungsi tokoh dalam konteks kitab Hakim-Hakim tanpa membatasi perannya pada pengadilan hukum. Istilah 'hakim' tetap dipertahankan agar hubungan tematis kitab tidak hilang.
- issue: Nama wilayah אֲרָם
  choice: Aram
  alternative: Siria
  rationale: Nama sumber dipertahankan dan tidak diganti dengan sebutan geografis tradisional yang berpotensi anakronistis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur narasi dibuat lancar bagi pembaca umum, sedangkan metafora penting dari bahasa Ibrani—khususnya 'ke dalam tangannya' dan 'tangannya ... menjadi kuat'—dipertahankan. Nama Yahweh dan Aram ditampilkan secara langsung sesuai teks sumber.
