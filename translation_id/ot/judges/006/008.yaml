base_translation:
  language: en
  yaml_path: translation/ot/judges/006/008.yaml
  text: 'Then Yahweh sent a man[a], a prophet, to the sons of Israel, and he said to them, “Thus says Yahweh, the God of Israel: I brought you up from Egypt[b], and I brought you out from the house of slavery.”'
translation:
  language: id
  text: 'Lalu Yahweh mengutus seorang laki-laki, seorang nabi, kepada orang Israel, dan ia berkata kepada mereka, “Beginilah firman Yahweh, Allah Israel: Akulah yang membawa kalian keluar dari Mesir dan yang mengeluarkan kalian dari rumah perbudakan.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Lalu ... mengutus
  rationale: Bentuk wayyiqtol melanjutkan rangkaian narasi; “lalu” menyatakan urutan secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: אִישׁ נָבִיא
  choice: seorang nabi
  rationale: Secara harfiah berarti “seorang laki-laki, seorang nabi”, tetapi dalam konstruksi aposisional ini אִישׁ berfungsi memperkenalkan orang tersebut; “seorang nabi” merupakan ungkapan Indonesia yang alami tanpa kehilangan informasi referensial.
- source_word: אֶל־בְּנֵי יִשְׂרָאֵל
  choice: kepada orang Israel
  rationale: Ungkapan idiomatis ini menunjuk kepada umat Israel secara kolektif; “orang Israel” alami dan tepat dalam bahasa Indonesia.
- source_word: כֹּה אָמַר
  choice: Beginilah firman
  rationale: Rumus utusan kenabian ini lazim dan bermartabat diterjemahkan “Beginilah firman” dalam bahasa Indonesia.
- source_word: אָנֹכִי
  choice: Akulah
  rationale: Bentuk pronomina mandiri bersifat menegaskan; “Akulah” mempertahankan penekanan tersebut.
- source_word: הֶעֱלֵיתִי אֶתְכֶם מִמִּצְרַיִם
  choice: membawa kalian keluar dari Mesir
  rationale: Walaupun verba secara harfiah mengandung arah “naik”, dalam konteks eksodus bahasa Indonesia alami memakai “membawa ... keluar dari Mesir”; arah keluarnya juga dipertegas oleh klausa sejajar berikutnya.
- source_word: מִבֵּית עֲבָדִים
  choice: dari tempat perbudakan
  rationale: Secara harfiah “dari rumah para budak”; frasa itu merupakan idiom bagi tempat atau keadaan perbudakan. “Tempat perbudakan” mempertahankan unsur lokatif dan terdengar alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama perjanjian YHWH secara langsung; transliterasi “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Penegasan pelaku ilahi dalam אָנֹכִי
  choice: Akulah yang membawa
  alternative: Aku membawa
  rationale: Pronomina mandiri Ibrani memberi penekanan pada Yahweh sebagai pelaku pembebasan; bentuk “Akulah yang” menyampaikan tekanan ini tanpa menambah gagasan baru.
- issue: Sebutan kolektif בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel; keturunan Israel
  rationale: Dalam konteks ini frasa tersebut adalah sebutan konvensional bagi umat Israel secara kolektif, bukan pembatasan pada laki-laki atau anak-anak secara harfiah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai karena bentuk Ibrani orang kedua jamak menunjuk seluruh umat, sehingga perbedaan jumlah yang nyata dalam sumber tetap terbaca.
