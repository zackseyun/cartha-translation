  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Istilah 'guntingan bulu domba' dipilih untuk kejelasan referen, dan penanda catatan kaki [a] ditempatkan langsung sesudah frasa terkait.
