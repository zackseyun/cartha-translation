base_translation:
  language: en
  yaml_path: translation/ot/judges/006/038.yaml
  text: And it was so. He rose early the next day and squeezed the fleece[a], wringing dew from the fleece—a bowlful of water.
translation:
  language: id
  text: Dan terjadilah demikian. Keesokan harinya Gideon bangun pagi-pagi, lalu memeras bulu domba itu[a] dan mengeluarkan embun darinya, sebanyak semangkuk penuh air.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menekan bulu domba itu” atau “memeras bulu domba itu.” Teks Ibrani memakai dua kata kerja secara berurutan untuk menggambarkan tindakan menekan bulu domba itu dan mengeluarkan embun darinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כֵן
  choice: Dan terjadilah demikian
  rationale: Ungkapan ini menegaskan bahwa tanda yang diminta Gideon benar-benar terjadi, sambil mempertahankan alur naratif Ibrani.
- source_word: וַיַּשְׁכֵּם מִמָּחֳרָת
  choice: Keesokan harinya Gideon bangun pagi-pagi
  rationale: Mengungkapkan tindakan bangun dini pada hari berikutnya secara alami; nama Gideon dinyatakan agar subjek tetap jelas dalam bahasa Indonesia.
- source_word: וַיָּזַר אֶת־הַגִּזָּה
  choice: lalu memeras guntingan bulu domba itu
  rationale: Kata kerja menunjuk pada tindakan menekan atau memeras bahan tersebut. 'Guntingan bulu domba' menjelaskan bahwa yang dimaksud ialah bulu yang telah dicukur, bukan kulit domba.
- source_word: וַיִּמֶץ טַל מִן־הַגִּזָּה
  choice: Ia memeras embun dari guntingan bulu itu
  rationale: Mempertahankan verba kedua yang menggambarkan pengeluaran cairan dari bulu, meskipun pengulangan 'memeras' mencerminkan kedekatan tindakan-tindakan dalam teks sumber.
- source_word: מְלֹא הַסֵּפֶל מָיִם
  choice: sebanyak semangkuk penuh air
  rationale: Menyampaikan ukuran hasilnya—air yang cukup untuk memenuhi sebuah mangkuk—dengan ungkapan Indonesia yang jelas dan wajar.
