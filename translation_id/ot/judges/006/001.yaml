id: JDG.6.1
reference: Judges 6:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֧וּ בְנֵי יִשְׂרָאֵ֛ל הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יִּתְּנֵ֧/ם יְהוָ֛ה בְּ/יַד מִדְיָ֖ן שֶׁ֥בַע שָׁנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/001.yaml
  text: And the sons of Israel did what was evil in the eyes of Yahweh[c][b][a], and Yahweh gave them into the hand of Midian for seven years.
translation:
  language: id
  text: Orang Israel melakukan yang jahat di mata Yahweh, lalu Yahweh menyerahkan mereka ke dalam kekuasaan Midian selama tujuh tahun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Orang Israel
  rationale: Ungkapan harfiah 'anak-anak lelaki Israel' merupakan sebutan kolektif bagi bangsa Israel. 'Orang Israel' menyampaikan rujukan korporat itu secara alami dalam bahasa Indonesia tanpa membatasi maknanya pada keturunan laki-laki saja.
- source_word: הָרַע
  choice: apa yang jahat
  rationale: Dalam konstruksi dengan עשה, bentuk ini berarti melakukan sesuatu yang jahat. Pilihan ini mempertahankan bobot penilaian moral teks dan merupakan ungkapan Indonesia yang wajar.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Terjemahan ini mempertahankan idiom evaluatif Ibrani dan tetap jelas serta alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: וַיִּתְּנֵם
  choice: menyerahkan mereka
  rationale: Dalam gabungan dengan בְיַד, verba נתן menyatakan penyerahan kepada kuasa pihak lain. 'Menyerahkan' lebih langsung menyampaikan idiom tersebut daripada terjemahan harfiah 'memberikan'.
- source_word: בְּיַד מִדְיָן
  choice: ke dalam kekuasaan Midian
  rationale: Secara harfiah frasa ini berarti 'ke dalam tangan Midian'; 'tangan' di sini merupakan idiom bagi kuasa atau kendali. Terjemahan maknawi ini alami dan tidak mengaburkan maksudnya.
- source_word: שֶׁבַע שָׁנִים
  choice: selama tujuh tahun
  rationale: '''Selama'' secara alami menandai durasi dalam bahasa Indonesia tanpa menambah makna.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama ilahi secara langsung. Bentuk 'Yahweh' mempertahankan nama itu, sedangkan 'TUHAN' merupakan penggantian tradisional dengan gelar.
- issue: Sebutan kolektif בְנֵי יִשְׂרָאֵל
  choice: Orang Israel
  alternative: Anak-anak lelaki Israel
  rationale: Dalam konteks ini, frasa Ibrani adalah sebutan idiomatis bagi komunitas Israel secara keseluruhan. 'Orang Israel' mempertahankan cakupan korporatnya dalam bahasa Indonesia modern.
- issue: Idiom penyerahan בְיַד מִדְיָן
  choice: ke dalam kekuasaan Midian
  alternative: ke dalam tangan Midian
  rationale: Yang dimaksud ialah penundukan Israel di bawah kuasa Midian, bukan tindakan fisik. Terjemahan ini menyatakan makna idiom tanpa menambahkan penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mengikuti urutan naratif Ibrani, sementara idiom 'ke dalam tangan' dialihkan menjadi 'ke dalam kekuasaan' agar segera dipahami pembaca umum. Tidak diperlukan catatan kaki karena semua pilihan utama dapat disampaikan dengan jelas dalam teks.
