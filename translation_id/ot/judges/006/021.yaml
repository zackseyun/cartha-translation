reference: Judges 6:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֞ח מַלְאַ֣ךְ יְהוָ֗ה אֶת קְצֵ֤ה הַ/מִּשְׁעֶ֨נֶת֙ אֲשֶׁ֣ר בְּ/יָד֔/וֹ וַ/יִּגַּ֥ע בַּ/בָּשָׂ֖ר וּ/בַ/מַּצּ֑וֹת וַ/תַּ֨עַל הָ/אֵ֜שׁ מִן הַ/צּ֗וּר וַ/תֹּ֤אכַל אֶת הַ/בָּשָׂר֙ וְ/אֶת הַ/מַּצּ֔וֹת וּ/מַלְאַ֣ךְ יְהוָ֔ה הָלַ֖ךְ מֵ/עֵינָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/021.yaml
  text: Then the angel of Yahweh reached out the tip of the staff that was in his hand and touched the meat and the unleavened bread[a]. And fire went up from the rock and consumed the meat and the unleavened bread[c][b]. Then the angel of Yahweh went away from his sight.
translation:
  language: id
  text: Lalu Malaikat Yahweh[a] mengulurkan ujung tongkat yang ada di tangannya dan menyentuh daging[b] serta roti tidak beragi itu. Api pun naik dari batu dan menghanguskan daging serta roti tidak beragi itu. Kemudian Malaikat Yahweh pergi dari pandangan Gideon[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Utusan Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang dipakai berarti “daging”; di sini yang dimaksud ialah daging yang telah disiapkan sebagai persembahan.
    reason: lexical_clarification
  - marker: c
    text: 'Secara harfiah: “pergi dari matanya”; maksudnya, Malaikat Yahweh tidak terlihat lagi oleh Gideon. Teks tidak menjelaskan apakah ia lenyap seketika atau pergi dengan cara lain.'
    reason: source_idiom_and_ambiguity
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: Malaikat Yahweh
  rationale: מַלְאָךְ dapat berarti utusan atau malaikat. Dalam konteks tindakan adikodrati ini, “Malaikat” paling alami, sedangkan konstruksi Ibrani dan nama ilahi tetap dipertahankan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks sumber tidak diganti dengan gelar.
- source_word: וַיִּשְׁלַח ... אֶת קְצֵה הַמִּשְׁעֶנֶת
  choice: mengulurkan ujung tongkat
  rationale: Dalam konteks ini, שׁלח menyatakan gerakan mengulurkan tongkat, sedangkan קְצֵה menunjuk pada ujungnya.
- source_word: וַיִּגַּע
  choice: menyentuh
  rationale: נגע pada dasarnya berarti menyentuh atau membuat kontak; konteks tidak mengharuskan arti yang lebih keras seperti memukul.
- source_word: בָּשָׂר
  choice: daging
  rationale: Kata ini secara harfiah berarti daging dan di sini mengacu pada daging yang telah disiapkan sebagai persembahan.
- source_word: מַצּוֹת
  choice: roti tidak beragi
  rationale: Ungkapan ini jelas bagi pembaca Indonesia modern dan menyampaikan bahwa roti tersebut dibuat tanpa ragi.
- source_word: וַתַּעַל הָאֵשׁ מִן הַצּוּר
  choice: Api pun naik dari batu
  rationale: Terjemahan ini mempertahankan gambaran arah dalam עלה dan asal api yang dinyatakan dengan מן.
- source_word: וַתֹּאכַל
  choice: menghanguskan
  rationale: Secara harfiah verba ini berarti “memakan”, tetapi bila subjeknya api, “menghanguskan” merupakan ungkapan Indonesia yang alami dan menyampaikan bahwa persembahan itu habis dilalap.
- source_word: הָלַךְ מֵעֵינָיו
  choice: pergi dari pandangan Gideon
  rationale: Pilihan ini mempertahankan unsur “pergi” dan “pandangan” dalam ungkapan Ibrani tanpa memastikan bahwa sang malaikat lenyap secara mendadak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama itu alih-alih menggantinya dengan gelar.
- issue: Identitas dan sebutan מַלְאַךְ יְהוָה
  choice: Malaikat Yahweh
  alternative: utusan Yahweh
  rationale: Kata מַלְאָךְ secara leksikal dapat berarti utusan manusia atau malaikat. Tindakan adikodrati dalam perikop mendukung “Malaikat”, tetapi alternatif leksikal tetap dicatat tanpa menetapkan lebih jauh hakikat tokoh tersebut.
- issue: Cara Malaikat Yahweh meninggalkan pandangan Gideon
  choice: pergi dari pandangan Gideon
  alternative: lenyap dari pandangan Gideon
  rationale: Bahasa Ibrani menyatakan bahwa ia “pergi dari mata/pandangannya”, tetapi tidak secara eksplisit menentukan apakah kepergiannya terjadi dengan menghilang seketika.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat dan mudah dipahami. Nama Gideon disebut pada klausa terakhir untuk memperjelas rujukan pronomina Ibrani tanpa mengubah pelaku atau peristiwa. Pengulangan “daging serta roti tidak beragi itu” mengikuti penekanan dan urutan teks sumber.
