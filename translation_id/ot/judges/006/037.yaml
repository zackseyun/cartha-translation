  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הִנֵּ֣ה אָנֹכִ֗י מַצִּ֛יג אֶת גִּזַּ֥ת הַ/צֶּ֖מֶר בַּ/גֹּ֑רֶן אִ֡ם טַל֩ יִהְיֶ֨ה עַֽל הַ/גִּזָּ֜ה לְ/בַדָּ֗/הּ וְ/עַל כָּל הָ/אָ֨רֶץ֙ חֹ֔רֶב וְ/יָדַעְתִּ֗י כִּֽי תוֹשִׁ֧יעַ בְּ/יָדִ֛/י אֶת יִשְׂרָאֵ֖ל כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/037.yaml
  text: Look[a], I am placing a fleece of wool on the threshing floor. If there is dew on the fleece alone, and dryness on all the ground, then I will know that you will save Israel by my hand, just as you have spoken.
translation:
  language: id
  text: Lihat, aku sedang meletakkan bulu domba di tempat pengirikan. Jika embun hanya ada pada bulu domba itu, sedangkan seluruh tanah[a] kering, maka aku akan tahu bahwa Engkau akan menyelamatkan Israel melalui tanganku, seperti yang telah Engkau firmankan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seluruh negeri” atau “seluruh bumi”. Kata Ibrani yang dipakai dapat menunjuk pada tanah setempat ataupun wilayah yang lebih luas. Di sini kemungkinan besar yang dimaksud ialah tanah di sekitar tempat berlangsungnya tanda itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihat
  rationale: Mempertahankan fungsi penarik perhatian yang menegaskan tanda yang diajukan Gideon, dengan ungkapan Indonesia modern dan wajar.
- source_word: מַצִּיג
  choice: sedang meletakkan
  rationale: Partisipel bersama אָנֹכִי menunjukkan tindakan yang sedang atau segera dilakukan; pilihan ini konkret dan alami.
- source_word: גִּזַּת הַצֶּמֶר
  choice: segumpal bulu domba
  rationale: Menunjuk pada bulu domba yang telah dicukur sebagai satu kesatuan. Ungkapan ini lebih mudah dipahami daripada istilah teknis, tanpa mengubah benda yang dimaksud.
- source_word: בַּגֹּרֶן
  choice: di tempat pengirikan
  rationale: גֹּרֶן adalah area atau lantai yang dipakai untuk mengirik; 'tempat pengirikan' jelas dan idiomatis dalam bahasa Indonesia.
- source_word: טַל יִהְיֶה
  choice: embun ... ada
  rationale: Mencerminkan konstruksi keberadaan dalam bahasa Ibrani tanpa menambahkan gagasan bahwa embun harus 'turun'.
- source_word: עַל הַגִּזָּה לְבַדָּהּ
  choice: hanya ada pada bulu itu
  rationale: Menjaga penekanan eksklusif לְבַדָּהּ bahwa embun terdapat pada bulu itu saja.
- source_word: וְעַל כָּל הָאָרֶץ חֹרֶב
  choice: sedangkan seluruh tanah tetap kering
  rationale: Konteks membandingkan bulu dengan permukaan tanah di sekitarnya. 'Tetap' mengungkapkan keadaan kering secara alami, tanpa mengubah inti syarat.
- source_word: וְיָדַעְתִּי
  choice: maka aku akan tahu
  rationale: Dalam kalimat bersyarat, bentuk ini menyatakan hasil bila tanda terpenuhi; 'maka' memperjelas hubungan logis.
- source_word: כִּי תוֹשִׁיעַ
  choice: bahwa Engkau akan menyelamatkan
  rationale: Hifil יָשַׁע menyatakan tindakan menyelamatkan atau membebaskan; 'menyelamatkan' mempertahankan makna langsung dan luas.
- source_word: בְּיָדִי
  choice: melalui tanganku
  rationale: Mempertahankan citra idiom Ibrani mengenai tangan sebagai sarana tindakan, sambil terdengar wajar dalam bahasa Indonesia.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: seperti yang telah Engkau firmankan
  rationale: Mempertahankan makna 'berbicara' tanpa memperkuatnya menjadi 'berjanji'; 'firmankan' sesuai karena Gideon berbicara kepada Allah.
theological_decisions:
- issue: Cakupan הָאָרֶץ dalam tanda Gideon
  choice: tanah
  alternative: negeri; bumi
  rationale: Dalam adegan ini, kontrasnya adalah antara bulu domba dan permukaan tanah di sekitar tempat pengirikan. 'Tanah' mempertahankan cakupan lokal yang paling mungkin, sementara catatan kaki menjaga kemungkinan leksikal yang lebih luas.
- issue: Makna בְּיָדִי sebagai sarana penyelamatan
  choice: melalui tanganku
  alternative: melalui aku; dengan perantaraanku
  rationale: Pilihan ini tidak menjadikan Gideon sumber keselamatan; Allah tetap subjek yang menyelamatkan, sedangkan tangan Gideon adalah sarana, sesuai ketegangan dan citra teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan kepada Allah memakai 'Engkau' dan 'firmankan'. Struktur syarat dipertahankan dengan jelas, dan idiom 'melalui tanganku' menjaga citra sumber tanpa terdengar kaku.
