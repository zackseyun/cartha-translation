  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו מַלְאַ֣ךְ הָ/אֱלֹהִ֗ים קַ֣ח אֶת הַ/בָּשָׂ֤ר וְ/אֶת הַ/מַּצּוֹת֙ וְ/הַנַּח֙ אֶל הַ/סֶּ֣לַע הַלָּ֔ז וְ/אֶת הַ/מָּרַ֖ק שְׁפ֑וֹךְ וַ/יַּ֖עַשׂ כֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/020.yaml
  text: Then the angel of God said to him[a], “Take the meat and the unleavened bread, and set them on this rock, and pour out the broth.” And he did so.
translation:
  language: id
  text: Lalu malaikat Allah berkata kepadanya[a], “Ambillah daging dan roti tidak beragi itu, letakkanlah keduanya di atas batu ini, lalu tuangkanlah kaldunya.” Ia pun melakukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “utusan Allah”. Kata Ibrani yang dipakai dapat berarti utusan manusia maupun utusan surgawi; dalam konteks ini, sosok tersebut tampaknya merupakan utusan adikodrati.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: malaikat Allah
  rationale: מַלְאַךְ dapat berarti utusan manusia atau malaikat; dalam konteks kisah ini sosok tersebut tampil sebagai utusan adikodrati Allah, sehingga “malaikat Allah” paling alami, sementara alternatif leksikal dicatat dalam catatan kaki.
- source_word: קַח
  choice: Ambillah
  rationale: Imperatif לקח paling langsung berarti mengambil; bentuk -lah menyampaikan perintah secara wajar dan bermartabat dalam bahasa Indonesia.
- source_word: הַבָּשָׂר
  choice: daging
  rationale: Dalam konteks makanan, בָּשָׂר secara alami diterjemahkan “daging”, bukan “tubuh” atau “jasad”.
- source_word: הַמַּצּוֹת
  choice: roti tidak beragi
  rationale: מַצּוֹת menunjuk pada makanan panggang tanpa ragi; bentuk kolektif “roti tidak beragi” jelas dan lazim dalam bahasa Indonesia.
- source_word: וְהַנַּח
  choice: letakkanlah keduanya
  rationale: Bentuk Hifil imperatif dari נוח di sini berarti menaruh atau meletakkan. “Keduanya” memperjelas bahwa perintah itu menyangkut daging dan roti tanpa menambah unsur baru.
- source_word: אֶל־הַסֶּלַע הַלָּז
  choice: di atas batu ini
  rationale: Dengan verba “meletakkan”, preposisi אֶל paling alami dinyatakan sebagai “di atas”; סֶלַע berarti batu atau batu besar, dan הַלָּז berfungsi demonstratif, “ini”.
- source_word: הַמָּרַק
  choice: kaldu
  rationale: מָרָק adalah cairan hasil memasak atau kuah; “kaldu” tepat dan alami dalam konteks sajian daging.
- source_word: שְׁפֹוךְ
  choice: tuangkanlah
  rationale: Imperatif שפך berarti menuangkan atau mencurahkan. “Tuangkanlah” alami untuk kaldu dan tidak perlu menambahkan objek tujuan yang tidak dinyatakan secara eksplisit.
- source_word: וַיַּעַשׂ כֵּן
  choice: Gideon pun melakukannya
  rationale: Ungkapan ini melaporkan kepatuhan secara ringkas. Nama “Gideon” dipakai untuk menjernihkan rujukan pronomina dalam bahasa Indonesia tanpa mengubah pelaku dalam konteks.
theological_decisions:
- issue: Istilah bagi utusan ilahi dalam konteks penampakan adikodrati
  choice: malaikat Allah
  alternative: utusan Allah
  rationale: Kata Ibrani מַלְאַךְ sendiri dapat berarti “utusan” atau “malaikat”. Konteks Hakim-Hakim 6 mendukung sosok adikodrati, sehingga teks utama memakai “malaikat Allah”, tetapi kemungkinan leksikal “utusan Allah” tetap dinyatakan dalam catatan kaki tanpa memaksakan penjelasan lebih jauh mengenai identitasnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Bentuk imperatif -lah mempertahankan kekuatan perintah tanpa terdengar kasar. “Keduanya” dipakai demi kejelasan sintaksis; nama Gideon menjernihkan pelaku pada klausa penutup.
