  revised_text: Masing-masing berkata kepada sesamanya, “Siapa yang telah melakukan perbuatan ini?” Lalu mereka menyelidiki dan mencari-cari, kemudian berkata, “Gideon anak Yoas telah melakukan perbuatan ini.”
