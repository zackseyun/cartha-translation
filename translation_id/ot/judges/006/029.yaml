base_translation:
  language: en
  yaml_path: translation/ot/judges/006/029.yaml
  text: And each man said to his neighbor[a], “Who has done this thing?” And they inquired and searched, and they said[b], “Gideon son of Joash has done this thing.”
translation:
  language: id
  text: Masing-masing berkata kepada sesamanya, “Siapa yang telah melakukan perbuatan ini?” Lalu mereka menyelidiki dan mencari-cari, kemudian berkata, “Gideon anak Yoas telah melakukan perbuatan ini.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ אֶל־רֵעֵהוּ
  choice: seorang kepada yang lain
  rationale: Ungkapan ini menyatakan percakapan timbal balik di antara orang-orang kota. Bentuk Indonesia ini alami dan tetap mempertahankan corak distributif ungkapan Ibrani.
- source_word: מִי
  choice: Siapa
  rationale: Kata tanya ini menanyakan pelaku tindakan.
- source_word: עָשָׂה
  choice: telah melakukan
  rationale: Dalam konteks ini, verba tersebut menunjuk pada tindakan yang sudah selesai; 'melakukan' lebih tepat daripada arti harfiah lain seperti 'membuat'.
- source_word: הַדָּבָר הַזֶּה
  choice: perbuatan ini
  rationale: דָּבָר memiliki rentang arti 'perkataan', 'hal', atau 'perkara', tetapi di sini mengacu pada tindakan yang baru diketahui. 'Perbuatan ini' jelas dan wajar dalam bahasa Indonesia.
- source_word: וַיִּדְרְשׁוּ
  choice: mereka menyelidiki
  rationale: דרשׁ di sini menyatakan tindakan meminta keterangan atau melakukan penyelidikan.
- source_word: וַיְבַקְשׁוּ
  choice: mencari tahu
  rationale: בקשׁ berarti mencari atau berusaha memperoleh sesuatu. 'Mencari tahu' membedakannya dari penyelidikan sebelumnya dan mengungkapkan usaha mereka menemukan pelakunya.
- source_word: וַיֹּאמְרוּ
  choice: Mereka pun berkata
  rationale: Terjemahan ini mempertahankan verba ujaran yang sama tanpa memperkuatnya menjadi 'menyimpulkan'; partikel 'pun' menandai kelanjutan hasil pencarian secara alami.
- source_word: גִּדְעוֹן בֶּן־יוֹאָשׁ
  choice: Gideon anak Yoas
  rationale: Nama-nama mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia, dan patronimik Ibrani diterjemahkan secara langsung.
