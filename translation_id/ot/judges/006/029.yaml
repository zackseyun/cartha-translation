  source_fidelity: 'Makna pokok terjaga: penduduk saling bertanya tentang pelaku, melakukan penyelidikan dan pencarian, lalu menyebut Gideon anak Yoas. Namun, konstruksi jawaban "Gideon anak Yoas yang telah melakukan" tidak menyatakan predikasi secara sejelas teks Ibrani; verba utama perlu dinyatakan langsung.'
  naturalness: '"Mereka berkata seorang kepada yang lain" dapat dipahami, tetapi kurang idiomatis dalam bahasa Indonesia modern. "Masing-masing berkata kepada sesamanya" menyampaikan corak distributif Ibrani dengan lebih alami. Pasangan "menyelidiki dan mencari-cari" juga lebih tepat membedakan dua verba pencarian tanpa redundansi "menyelidiki dan mencari tahu."'
  terminology: '"Gideon" dan "Yoas" sesuai bentuk nama yang lazim dalam Alkitab bahasa Indonesia. "Anak Yoas" secara tepat menerjemahkan patronimik. "Perbuatan ini" adalah pilihan yang wajar untuk הַדָּבָר הַזֶּה dalam konteks ini.'
