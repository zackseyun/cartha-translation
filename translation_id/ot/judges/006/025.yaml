base_translation:
  language: en
  yaml_path: translation/ot/judges/006/025.yaml
  text: And it happened that night that Yahweh said to him[a], “Take your father’s bull and the second bull, seven years old, and tear down the altar of Baal that belongs to your father[b], and cut down the Asherah that is upon it.”
translation:
  language: id
  text: Pada malam itu, Yahweh berfirman kepadanya, “Ambillah lembu jantan milik ayahmu dan juga lembu jantan yang kedua, yang berumur tujuh tahun. Robohkanlah mazbah Baal milik ayahmu dan tebanglah Asyera[a] yang ada di atasnya.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tiang Asyera” atau “tiang suci.” Istilah Ibrani ini dapat menunjuk pada benda kultis yang berkaitan dengan Asyera.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “yang di atasnya.” Ungkapan ini dapat menunjukkan bahwa Asyera itu berada di atas, pada, atau dalam hubungan sangat dekat dengan mazbah tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: Pada malam itu
  rationale: Ungkapan pembuka naratif diterjemahkan secara alami dalam bahasa Indonesia modern; unsur waktu dan kesinambungan cerita tetap terpelihara tanpa ungkapan kaku seperti 'terjadilah'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan membedakannya dari gelar 'Tuhan'.
- source_word: קַח
  choice: Ambillah
  rationale: Menyampaikan bentuk perintah langsung dengan partikel -lah yang wajar dan bermartabat.
- source_word: פַּר הַשּׁוֹר אֲשֶׁר לְאָבִיךָ
  choice: lembu jantan milik ayahmu
  rationale: פַּר menunjuk pada lembu jantan, sedangkan konstruksi kepemilikan dinyatakan secara alami dengan 'milik ayahmu'.
- source_word: וּפַר הַשֵּׁנִי שֶׁבַע שָׁנִים
  choice: dan lembu jantan yang kedua, yang berumur tujuh tahun
  rationale: Mempertahankan waw koordinatif dan urutan ungkapan Ibrani, sambil mencatat kemungkinan bahwa frasa ini menjelaskan lembu sebelumnya, bukan menyebut hewan tambahan.
- source_word: וְהָרַסְתָּ
  choice: Robohkanlah
  rationale: Kata ini secara tepat menyatakan penghancuran suatu bangunan atau struktur seperti mazbah.
- source_word: מִזְבַּח הַבַּעַל
  choice: mazbah Baal
  rationale: '''Mazbah'' merupakan istilah Indonesia yang mapan untuk altar persembahan, dan konstruksi ini mempertahankan hubungan dengan Baal.'
- source_word: הָאֲשֵׁרָה
  choice: Asyera
  rationale: Transliterasi mempertahankan ketidakpastian apakah istilah ini menunjuk pada benda kultis, tiang suci, atau representasi dewi Asyera.
- source_word: אֲשֶׁר עָלָיו
  choice: yang ada di atasnya
  rationale: Menerjemahkan arti dasar עַל secara dekat tanpa memastikan hubungan spasial yang dalam konteks ini dapat berarti di atas, pada, atau berdekatan erat dengan mazbah.
- source_word: תִּכְרֹת
  choice: tebanglah
  rationale: Kata kerja yang alami untuk memotong hingga tumbang suatu benda kultis berbahan kayu.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Bentuk 'Yahweh' menyajikan nama diri dalam teks sumber dan tidak menggantinya dengan gelar.
- issue: Identitas הָאֲשֵׁרָה
  choice: Asyera
  alternative: tiang Asyera atau tiang suci
  rationale: Teks tidak menjelaskan secara pasti sifat benda kultis tersebut; transliterasi menghindari penetapan bentuk fisiknya secara berlebihan.
- issue: Jumlah lembu dalam perintah
  choice: 'dua lembu: lembu milik ayah Gideon dan lembu yang kedua'
  alternative: 'satu lembu: lembu milik ayah Gideon, yaitu lembu yang kedua'
  rationale: Waw koordinatif mendukung pembacaan dua hewan, tetapi susunan Ibrani dan konteks lanjutan memungkinkan frasa kedua bersifat menjelaskan; ambiguitas ini dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk perintah dengan -lah mempertahankan ketegasan tuturan ilahi. Istilah 'mazbah' dipakai karena lazim dalam register Alkitab Indonesia, sedangkan catatan kaki menjaga ambiguitas leksikal dan sintaksis sumber.
