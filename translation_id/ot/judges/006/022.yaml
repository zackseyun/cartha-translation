base_translation:
  language: en
  yaml_path: translation/ot/judges/006/022.yaml
  text: Then Gideon saw that he was the angel of Yahweh[a], and Gideon said, “Ah, Lord GOD! For I have seen the angel of Yahweh face to face.”
translation:
  language: id
  text: Lalu Gideon menyadari bahwa dia adalah malaikat Yahweh[a]. Gideon berkata, “Ah, Tuhan Yahweh! Sebab aku telah melihat malaikat Yahweh berhadapan muka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “utusan Yahweh.” Kata Ibrani yang dipakai dapat berarti “malaikat” atau “utusan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: Lalu ... menyadari
  rationale: Secara harfiah verba ini berarti ‘melihat’, tetapi dengan klausa isi yang mengikutinya, konteks menekankan bahwa Gideon mengenali jati diri sosok tersebut. ‘Menyadari’ menyampaikan makna kontekstual itu secara alami dalam bahasa Indonesia.
- source_word: מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  rationale: מַלְאָךְ dapat berarti ‘malaikat’ atau ‘utusan’. Dalam konteks ini sosok tersebut merupakan utusan adikodrati; ‘malaikat’ paling alami, sementara kemungkinan ‘utusan’ dipertahankan dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’ agar nama pribadi dalam teks Ibrani tetap tampak dan tidak diganti dengan gelar.
- source_word: אֲהָהּ
  choice: Aduh
  rationale: Kata seru ini menyatakan rasa takut atau gentar. ‘Aduh’ alami dalam bahasa Indonesia modern dan tetap sesuai dengan seruan Gideon yang serius.
- source_word: אֲדֹנָי יְהוִה
  choice: Tuhan Yahweh
  rationale: Terjemahan ini mempertahankan baik gelar אֲדֹנָי maupun nama ilahi יְהוָה tanpa menghasilkan pengulangan gelar.
- source_word: כִּי עַל כֵּן
  choice: tanpa konjungsi eksplisit
  rationale: Ungkapan ini memperkenalkan alasan seruan Gideon. Dalam ujaran langsung bahasa Indonesia, hubungan sebab sudah jelas dari kalimat berikutnya sehingga dapat disampaikan secara alami tanpa ‘karena’ yang terasa menggantung.
- source_word: פָּנִים אֶל פָּנִים
  choice: muka dengan muka
  rationale: Ungkapan tetap ini menggambarkan perjumpaan langsung. Bentuk idiomatis tersebut mempertahankan citra konkret bahasa Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama perjanjian sebagai nama pribadi, bukan menggantinya dengan gelar.
- issue: Identitas מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  alternative: utusan Yahweh
  rationale: Konteks mendukung sosok adikodrati, tetapi istilah Ibrani sendiri juga dapat berarti ‘utusan’. Terjemahan utama memakai ‘malaikat’ tanpa menjelaskan identitas sosok itu lebih jauh, sehingga ketegangan teologis narasi tetap dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. ‘Aduh’ dipakai sebagai seruan gentar yang mudah dipahami; ‘muka dengan muka’ mempertahankan idiom dan citra sumber.
