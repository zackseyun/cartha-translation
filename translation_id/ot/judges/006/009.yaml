  text: וָ/אַצִּ֤ל אֶתְ/כֶם֙ מִ/יַּ֣ד מִצְרַ֔יִם וּ/מִ/יַּ֖ד כָּל לֹחֲצֵי/כֶ֑ם וָ/אֲגָרֵ֤שׁ אוֹתָ/ם֙ מִ/פְּנֵי/כֶ֔ם וָ/אֶתְּנָ֥/ה לָ/כֶ֖ם אֶת אַרְצָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/009.yaml
  text: And I delivered you from the hand of Egypt and from the hand of all your oppressors, and I drove them out from before you and gave you their land.
translation:
  language: id
  text: Aku melepaskan kalian dari tangan Mesir dan dari tangan semua orang yang menindas kalian. Aku mengusir mereka dari hadapan kalian dan memberikan negeri mereka kepada kalian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאַצִּל
  choice: Aku melepaskan
  rationale: Bentuk dari נצל menyatakan tindakan menyelamatkan atau melepaskan dari bahaya maupun kuasa pihak lain. “Melepaskan” berpadu alami dengan ungkapan “dari tangan” dan mempertahankan gagasan pembebasan.
- source_word: מִיַּד
  choice: dari tangan
  rationale: Ungkapan Ibrani ini menggambarkan kuasa atau kendali. Citra konkretnya tetap jelas dan wajar dalam bahasa Indonesia.
- source_word: מִצְרַיִם
  choice: Mesir
  rationale: Padanan baku untuk nama negeri atau bangsa tersebut.
- source_word: כָּל לֹחֲצֵיכֶם
  choice: semua orang yang menindas kalian
  rationale: Partisip לֹחֲצֵי menunjuk kepada pihak-pihak yang menekan atau menindas. Bentuk frasa ini lebih alami bagi pembaca modern daripada nomina “para penindas” dan lebih tepat daripada istilah umum “musuh”.
- source_word: וָאֲגָרֵשׁ
  choice: Aku mengusir
  rationale: גרש berarti menghalau, mengusir, atau mengeluarkan secara paksa. “Mengusir” tepat dan alami dalam konteks penguasaan negeri.
- source_word: מִפְּנֵיכֶם
  choice: dari hadapan kalian
  rationale: Padanan ini mempertahankan gambaran ruang dalam ungkapan Ibrani “dari depan wajah/hadapan kalian” tanpa menjadi sukar dipahami.
- source_word: וָאֶתְּנָה לָכֶם אֶת אַרְצָם
  choice: dan memberikan negeri mereka kepada kalian
  rationale: Menyampaikan secara langsung tindakan memberi, penerima, dan objeknya. “Negeri” sesuai untuk אֶרֶץ dalam konteks wilayah yang didiami dan dikuasai.
theological_decisions:
- issue: Tindakan ilahi dalam pembebasan Israel dan pemberian negeri
  choice: 'Allah tetap menjadi subjek orang pertama yang tersirat pada setiap tindakan: melepaskan, mengusir, dan memberikan negeri.'
  alternative: Menggabungkan tindakan-tindakan itu dengan susunan yang dapat mengaburkan pelaku atau menonjolkan peranan Israel.
  rationale: Ketiga verba orang pertama dalam bahasa Ibrani menekankan tindakan langsung Allah. Terjemahan mempertahankan penekanan itu tanpa menambahkan penafsiran tentang sarana atau proses tindakan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Aku” dipakai untuk suara ilahi orang pertama sesuai konteks langsung, sedangkan “kalian” memperjelas bahwa pronomina Ibrani berbentuk jamak. Pengulangan “Aku” pada kalimat kedua membuat pelaku tetap jelas dan mencerminkan rangkaian verba orang pertama.
