  yaml_path: translation/ot/judges/006/034.yaml
  text: Then the Spirit of Yahweh clothed Gideon[a], and he blew the trumpet[c][b], and Abiezer was summoned after him.
translation:
  language: id
  text: Lalu Roh Yahweh menyelubungi Gideon[a], dan Gideon meniup sangkakala[b]. Kemudian kaum Abiezer dipanggil untuk mengikutinya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Roh Yahweh mengenakan Gideon sebagai pakaian”; dapat juga dipahami, “Roh Yahweh datang ke atas Gideon.”
    reason: lexical_alternative
  - marker: b
    text: Sangkakala ini adalah syofar, yaitu tanduk yang ditiup untuk memberi isyarat.
    reason: cultural_note
  - marker: c
    text: Dapat juga diterjemahkan, “kaum Abiezer dihimpun di belakangnya” atau “kaum Abiezer berkumpul mendukungnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ יְהוָה
  choice: Roh Yahweh
  rationale: Dalam konteks pemberdayaan ilahi ini, רוּחַ berarti “Roh,” sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh.”
- source_word: לָבְשָׁה אֶת גִּדְעוֹן
  choice: menyelubungi Gideon
  rationale: Kata לָבַשׁ secara harfiah berkaitan dengan mengenakan atau membungkus dengan pakaian. “Menyelubungi” mempertahankan metafora Ibrani bahwa Roh bertindak atas Gideon, tanpa menghasilkan ungkapan Indonesia yang terlalu janggal.
- source_word: וַיִּתְקַע בַּשּׁוֹפָר
  choice: Ia meniup sangkakala
  rationale: שׁוֹפָר ialah tanduk tiup untuk memberi isyarat. “Sangkakala” merupakan istilah Indonesia yang alami dan bermartabat, dengan kekhususan bendanya dijelaskan dalam catatan kaki.
- source_word: וַיִּזָּעֵק
  choice: dipanggil
  rationale: Bentuk nifal menunjukkan bahwa pihak tersebut dihimpun atau dipanggil sebagai tanggapan atas bunyi sangkakala; bentuk pasif sumber dipertahankan.
- source_word: אֲבִיעֶזֶר
  choice: kaum Abiezer
  rationale: Dalam konteks ini nama tersebut menunjuk pada kelompok kekerabatan Abiezer, bukan hanya seorang individu; “kaum” memperjelas referennya secara wajar.
- source_word: אַחֲרָיו
  choice: untuk mengikutinya
  rationale: Ungkapan harfiah “di belakangnya” di sini menyatakan bahwa kaum Abiezer berhimpun mengikuti dan mendukung Gideon.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Nama diri ilahi dalam teks sumber dipertahankan sebagai “Yahweh,” bukan diganti dengan gelar.
- issue: Metafora pemberdayaan oleh Roh
  choice: Roh Yahweh menyelubungi Gideon
  alternative: Roh Yahweh datang ke atas Gideon
  rationale: Pilihan utama mempertahankan gambaran khas verba לָבַשׁ sambil membiarkan ketegangan metaforis teks tetap terdengar; padanan yang lebih interpretatif dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dipecah agar alami dalam bahasa Indonesia, sedangkan urutan tindakan dan bentuk pasif pada pemanggilan kaum Abiezer tetap dipertahankan. Semua penanda catatan kaki ditempatkan pada unsur yang dijelaskannya.
