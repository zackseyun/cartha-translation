  text: וַ/יֹּ֨אמֶר ל֧/וֹ יְהוָ֛ה שָׁל֥וֹם לְ/ךָ֖ אַל תִּירָ֑א לֹ֖א תָּמֽוּת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/023.yaml
  text: But Yahweh said to him[a], “Peace be to you. Do not fear; you shall not die.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepadanya, “Damai bagimu.[a] Jangan takut; engkau tidak akan mati.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Keadaanmu baik” atau “Engkau aman.” Kata Ibrani syalom dapat menyatakan damai, kesejahteraan, atau jaminan yang menenteramkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. Karena subjeknya Yahweh dan isinya merupakan perkataan ilahi, “berfirman” wajar dan bermartabat dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, agar nama pribadi dalam teks sumber tetap dipertahankan.
- source_word: שָׁלוֹם לְךָ
  choice: Damai bagimu
  rationale: Ungkapan ini berfungsi sebagai jaminan dan dapat mencakup damai, keadaan baik, serta keselamatan. “Damai bagimu” mempertahankan bentuk ungkapan Ibrani sekaligus tetap alami dalam bahasa Indonesia.
- source_word: אַל תִּירָא
  choice: Jangan takut
  rationale: Larangan dengan ירא merupakan rumusan penenteraman yang langsung dan alami diterjemahkan “Jangan takut”.
- source_word: לֹא תָּמוּת
  choice: engkau tidak akan mati
  rationale: Bentuk imperfek dalam konteks ini menyatakan jaminan mengenai masa depan. “Tidak akan mati” menyampaikan kepastian tersebut secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. Transliterasi “Yahweh” mempertahankan nama ilahi tanpa menggantinya dengan gelar.
- issue: Nuansa שָׁלוֹם sebagai jaminan ilahi
  choice: Damai bagimu
  alternative: Keadaanmu baik; Engkau aman
  rationale: Pilihan utama mempertahankan keluasan makna שָׁלוֹם dan tidak membatasi ungkapan itu hanya pada keselamatan fisik, meskipun konteks berikutnya menegaskan bahwa Gideon tidak akan mati.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti “engkau” dipakai dalam perkataan langsung ilahi untuk menjaga nada personal dan khidmat tanpa terasa kuno. Penanda catatan kaki ditempatkan tepat setelah ungkapan yang dijelaskannya.
