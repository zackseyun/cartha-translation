  terminology: “Hasil bumi” cocok untuk יְבוּל הָאָרֶץ. “Sumber penghidupan” adalah pilihan yang cukup luas untuk מִחְיָה dan tidak membatasi maknanya hanya pada makanan. “Sapi” dapat berfungsi secara kolektif untuk שׁוֹר dalam bahasa Indonesia modern; tidak perlu dipersempit menjadi “lembu.” Nama Gaza dan Israel konsisten.
