base_translation:
  language: en
  yaml_path: translation/ot/judges/006/004.yaml
  text: They would encamp against them and destroy the produce of the land as far as Gaza[a], and they would leave no sustenance in Israel, nor sheep, ox[b], or donkey.
translation:
  language: id
  text: Mereka biasa berkemah untuk menyerang orang Israel dan memusnahkan hasil bumi sampai ke Gaza[a]. Mereka tidak menyisakan sumber penghidupan[b] apa pun di Israel—baik domba, sapi, maupun keledai.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sampai engkau tiba di Gaza,” sebuah ungkapan yang menunjukkan batas daerah yang dicapai ke arah Gaza.
    reason: lexical_alternative
  - marker: b
    text: Atau “penopang hidup” atau “persediaan untuk hidup.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ עֲלֵיהֶם
  choice: Mereka biasa berkemah untuk menyerang orang Israel
  rationale: Kata חנה berarti berkemah, sedangkan עַל dalam konteks ini menunjukkan sikap bermusuhan. Kata 'biasa' menyampaikan tindakan berulang dalam rangkaian serangan yang dijelaskan pada ayat 3–5; 'orang Israel' memperjelas rujukan pronomina tanpa mengubah makna kontekstual.
- source_word: וַיַּשְׁחִיתוּ
  choice: memusnahkan
  rationale: Bentuk Hifil dari שׁחת berarti memusnahkan, merusakkan, atau membinasakan. 'Memusnahkan' dengan tepat menggambarkan penghancuran hasil pertanian.
- source_word: יְבוּל הָאָרֶץ
  choice: hasil bumi
  rationale: יְבוּל menunjuk pada hasil, panen, atau produksi tanah. 'Hasil bumi' merupakan ungkapan Indonesia yang alami dan cukup luas.
- source_word: עַד בּוֹאֲךָ עַזָּה
  choice: sampai ke Gaza
  rationale: Ungkapan Ibrani harfiah 'sampai engkau tiba di Gaza' merupakan idiom penunjuk batas wilayah. 'Sampai ke Gaza' menyampaikan maksud geografisnya secara alami, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: לֹא יַשְׁאִירוּ
  choice: Mereka tidak menyisakan ... apa pun
  rationale: Bentuk Hifil dari שׁאר berarti meninggalkan atau menyisakan. Susunan ini menyampaikan penyangkalan menyeluruh dengan bahasa Indonesia yang wajar.
- source_word: מִחְיָה
  choice: sumber penghidupan
  rationale: מִחְיָה dapat berarti penopang hidup, persediaan untuk hidup, atau sarana penghidupan. 'Sumber penghidupan' mempertahankan keluasan ekonomi dan daya penyambung hidup dalam konteks penghancuran pertanian dan ternak.
- source_word: וְשֶׂה וָשׁוֹר וַחֲמוֹר
  choice: baik domba, sapi, maupun keledai
  rationale: Ketiga nomina tunggal dipakai secara kolektif untuk jenis-jenis ternak. Pola 'baik ... maupun ...' secara alami menunjukkan bahwa tidak satu pun dari ketiganya disisakan.
