  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Aspek kebiasaan dinyatakan dengan 'biasa', dan daftar ternak dibuat alami tanpa menghilangkan cakupan kolektif teks Ibrani.
