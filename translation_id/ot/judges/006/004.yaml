  source_fidelity: 'Terjemahan dengan tepat menyampaikan tindakan berulang para penyerang: mereka berkemah melawan Israel, merusak hasil tanah hingga Gaza, dan tidak menyisakan sarana penghidupan maupun ternak. “Sampai ke Gaza” merupakan pemadanan idiomatis yang wajar bagi עַד בּוֹאֲךָ עַזָּה, sementara catatan kaki melestarikan bentuk harfiahnya. “Sumber penghidupan” mencakup makna מִחְיָה dalam konteks perampasan hasil pertanian dan ternak.'
