  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/גִדְע֣וֹן בָּ֗א וַ/יַּ֤עַשׂ גְּדִֽי עִזִּים֙ וְ/אֵיפַת קֶ֣מַח מַצּ֔וֹת הַ/בָּשָׂר֙ שָׂ֣ם בַּ/סַּ֔ל וְ/הַ/מָּרַ֖ק שָׂ֣ם בַּ/פָּר֑וּר וַ/יּוֹצֵ֥א אֵלָ֛י/ו אֶל תַּ֥חַת הָ/אֵלָ֖ה וַ/יַּגַּֽשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/019.yaml
  text: Then Gideon went in and prepared a young goat and unleavened bread from an ephah of flour[a]. He put the meat in a basket and the broth in a pot[b], and brought them out to him under the terebinth and presented them.
translation:
  language: id
  text: Lalu Gideon masuk dan menyiapkan seekor anak kambing serta roti tidak beragi dari satu efa tepung[a]. Dagingnya ia taruh dalam keranjang dan kuahnya dalam periuk. Kemudian ia membawa semuanya keluar kepada orang itu di bawah pohon tarbantin[b], lalu menyajikannya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Efa adalah takaran untuk bahan kering, kira-kira 22 liter.
    reason: cultural_measure
  - marker: b
    text: Atau “pohon ek.” Kata Ibrani ini kemungkinan besar menunjuk kepada pohon tarbantin, meskipun “pohon ek” merupakan terjemahan tradisional.
    reason: lexical_alternative
  - marker: c
    text: Atau “mendekatkannya” atau “menaruhnya di hadapannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּא
  choice: masuk
  rationale: Dalam konteks ini Gideon meninggalkan tamunya untuk menyiapkan makanan; “masuk” secara alami menyatakan gerak menuju rumah atau tempat penyiapan.
- source_word: וַיַּעַשׂ
  choice: menyiapkan
  rationale: Untuk makanan, “menyiapkan” merupakan padanan Indonesia yang alami bagi verba umum “membuat/mengerjakan”.
- source_word: גְּדִי עִזִּים
  choice: seekor anak kambing
  rationale: Frasa konstruksi ini menunjuk kepada kambing yang masih muda; padanan ini jelas dan wajar dalam bahasa Indonesia.
- source_word: אֵיפַת קֶמַח
  choice: satu efa tepung
  rationale: Nama takaran kering yang khusus dipertahankan agar rincian teks sumber tidak digeneralisasi.
- source_word: מַצּוֹת
  choice: roti tidak beragi
  rationale: Istilah ini menunjuk kepada roti yang dibuat tanpa ragi; bentuk persisnya, misalnya bundar atau pipih, tidak ditentukan.
- source_word: הַבָּשָׂר
  choice: dagingnya
  rationale: Dalam konteks hidangan, “daging” adalah padanan alami bagi istilah yang secara harfiah juga dapat berarti “daging tubuh”.
- source_word: סַּל
  choice: keranjang
  rationale: Padanan umum dan langsung untuk wadah angkut yang dimaksud.
- source_word: הַמָּרַק
  choice: kuahnya
  rationale: Kata Ibrani ini menunjuk kepada cairan hasil masakan atau kaldu; “kuah” paling alami dalam konteks makanan Indonesia.
- source_word: פָּרוּר
  choice: periuk
  rationale: Istilah ini menunjuk kepada wadah untuk memasak atau menampung cairan; “periuk” mempertahankan nuansa wadah masak dengan register yang bermartabat.
- source_word: וַיּוֹצֵא אֵלָיו
  choice: ia membawa semuanya keluar kepada orang itu
  rationale: Verba Ibrani berbentuk tunggal dan objeknya tidak dinyatakan, tetapi konteks mencakup daging dan kuah. “Semuanya” merujuk secara kolektif kepada hidangan yang telah disiapkan.
- source_word: תַּחַת הָאֵלָה
  choice: di bawah pohon tarbantin
  rationale: אֵלָה paling mungkin menunjuk kepada pohon tarbantin, meskipun secara tradisional juga diterjemahkan “pohon tarbantin besar” atau “pohon ek”.
- source_word: וַיַּגַּשׁ
  choice: lalu menyajikannya
  rationale: Verba ini berarti membawa mendekat atau mempersembahkan di hadapan seseorang. Dalam konteks jamuan, “menyajikan” alami dan tidak terlalu dini memberi tindakan itu makna kurban.
theological_decisions:
- issue: Kemungkinan nuansa kurban dalam tindakan Gideon
  choice: Bahasa penyajian makanan tanpa menyebutnya sebagai kurban
  alternative: “mempersembahkannya sebagai kurban”
  rationale: Ayat ini sendiri hanya mengatakan bahwa Gideon menyiapkan, membawa keluar, dan mendekatkan atau menyajikan makanan. Nuansa kurban berkembang dalam ayat-ayat berikutnya, sehingga terjemahan ini mempertahankan ketegangan naratif dan tidak memasukkan penafsiran itu lebih awal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan naratif yang lancar. “Periuk” dipilih untuk nuansa wadah masak yang jelas, sedangkan “orang itu” menghindari ketidakjelasan rujukan pronomina. Akhiran -nya pada “menyajikannya” merujuk secara kolektif kepada seluruh hidangan.
