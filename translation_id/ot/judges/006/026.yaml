id: JDG.6.26
reference: Judges 6:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בָנִ֨יתָ מִזְבֵּ֜חַ לַ/יהוָ֣ה אֱלֹהֶ֗י/ךָ עַ֣ל רֹ֧אשׁ הַ/מָּע֛וֹז הַ/זֶּ֖ה בַּ/מַּֽעֲרָכָ֑ה וְ/לָֽקַחְתָּ֙ אֶת הַ/פָּ֣ר הַ/שֵּׁנִ֔י וְ/הַעֲלִ֣יתָ עוֹלָ֔ה בַּ/עֲצֵ֥י הָ/אֲשֵׁרָ֖ה אֲשֶׁ֥ר תִּכְרֹֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/026.yaml
  text: Then build an altar to Yahweh your God on the top of this stronghold[a], in orderly arrangement, and take the second bull and offer it up as a burnt offering with the wood of the Asherah that you cut down.
translation:
  language: id
  text: Lalu bangunlah sebuah mazbah bagi Yahweh, Allahmu, di puncak kubu pertahanan ini, dengan susunan yang teratur. Ambillah lembu jantan yang kedua dan persembahkanlah itu sebagai kurban bakaran dengan kayu dari Asyera[a] yang kautebang itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tiang Asyera.” Istilah Ibrani ini dapat menunjuk benda kultis dari kayu yang berkaitan dengan Asyera.
    reason: Alternatif leksikal diperlukan karena bentuk persis benda yang dimaksud oleh אֲשֵׁרָה tidak pasti.
lexical_decisions:
- source_word: וּבָנִיתָ
  choice: Lalu bangunlah
  rationale: Bentuk perfek konsekutif dalam rangkaian perintah diterjemahkan sebagai perintah lanjutan; “lalu” menyatakan urutan tindakan secara alami.
- source_word: מִזְבֵּחַ
  choice: sebuah mazbah
  rationale: “Mazbah” adalah istilah Indonesia yang mapan untuk bangunan tempat persembahan dan sesuai dengan konteks ibadah.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: bagi Yahweh, Allahmu
  rationale: Preposisi ל menyatakan peruntukan atau pengabdian. Nama perjanjian יהוה dan sapaan “Allahmu” dipertahankan secara eksplisit.
- source_word: עַל רֹאשׁ הַמָּעוֹז הַזֶּה
  choice: di puncak kubu pertahanan ini
  rationale: רֹאשׁ berarti bagian atas atau puncak, sedangkan מָעוֹז menunjuk tempat yang kuat atau terlindung; “kubu pertahanan” mempertahankan kedua unsur tersebut tanpa mengandaikan sebuah benteng besar.
- source_word: בַּמַּעֲרָכָה
  choice: dengan susunan yang teratur
  rationale: מַעֲרָכָה dapat menunjuk susunan atau penataan. Terjemahan ini mempertahankan ketidakspesifikan objek yang disusun dan tidak menambahkan batu atau kayu yang tidak disebutkan.
- source_word: הַפָּר הַשֵּׁנִי
  choice: lembu jantan yang kedua
  rationale: פַּר berarti lembu jantan; “yang kedua” dipertahankan untuk membedakannya dari lembu yang disebut sebelumnya.
- source_word: וְהַעֲלִיתָ עוֹלָה
  choice: persembahkanlah itu sebagai kurban bakaran
  rationale: Gabungan bentuk Hifil עלה dengan עֹלָה merupakan ungkapan teknis persembahan yang seluruhnya dibakar.
- source_word: בַּעֲצֵי הָאֲשֵׁרָה אֲשֶׁר תִּכְרֹת
  choice: dengan kayu dari Asyera[a] yang kautebang itu
  rationale: Teks menyebut kayu dari אֲשֵׁרָה yang harus ditebang. Nama “Asyera” dipertahankan karena bentuk tepat benda kultis tersebut tidak pasti, sementara catatan kaki memberi alternatif penjelas.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung; “Yahweh” mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Rujukan אֲשֵׁרָה
  choice: Asyera
  alternative: tiang Asyera; benda kayu pemujaan Asyera
  rationale: Istilah ini dapat menunjuk benda kultis dari kayu yang berkaitan dengan dewi Asyera, tetapi wujud bendanya diperdebatkan. Teks utama tidak mempersempit maknanya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk perintah memakai “-lah”; “kautebang” mengikuti ejaan baku untuk pronomina terikat. Kalimat dibagi menjadi dua agar rangkaian instruksi mudah dipahami tanpa mengubah urutan tindakan.
