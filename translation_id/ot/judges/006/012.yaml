id: JDG.6.12
reference: Judges 6:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּרָ֥א אֵלָ֖י/ו מַלְּאַ֣ךְ יְהוָ֑ה וַ/יֹּ֣אמֶר אֵלָ֔י/ו יְהוָ֥ה עִמְּ/ךָ֖ גִּבּ֥וֹר הֶ/חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/012.yaml
  text: Then the angel of Yahweh appeared to him and said to him[a], “Yahweh is with you[b], mighty warrior.”
translation:
  language: id
  text: Lalu malaikat Yahweh[a] menampakkan diri kepadanya dan berkata, “Yahweh menyertai engkau, hai pejuang perkasa[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “utusan Yahweh.” Kata Ibrani yang dipakai dapat berarti “utusan” atau “malaikat”; “malaikat” paling sesuai dengan adegan penampakan ini.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “orang perkasa yang gagah berani.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: menampakkan diri
  rationale: Bentuk Nifal dari ראה dalam kisah penampakan paling wajar diterjemahkan sebagai tindakan muncul atau menampakkan diri, bukan secara kaku sebagai “terlihat”.
- source_word: מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  rationale: מַלְאָךְ dapat berarti “utusan” atau “malaikat”; dalam adegan penampakan makhluk surgawi ini, “malaikat” paling alami, sementara nama ilahi tetap diterjemahkan sebagai Yahweh.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: dan berkata
  rationale: Bahasa Indonesia tidak perlu mengulang “kepadanya” setelah kalimat sebelumnya sudah menyebut orang yang sama; penghilangan ini alami dan tidak mengubah rujukan pronomina Ibrani.
- source_word: יְהוָה עִמְּךָ
  choice: Yahweh menyertai engkau
  rationale: Klausa tanpa verba ini paling wajar dipahami sebagai pernyataan bahwa Yahweh hadir bersama Gideon. “Menyertai” mengungkapkan makna relasional עִם secara alami dalam bahasa Indonesia.
- source_word: גִּבּוֹר הֶחָיִל
  choice: pejuang perkasa
  rationale: Ungkapan ini menunjuk kepada seorang yang kuat, cakap, dan gagah dalam konteks peperangan. “Pejuang perkasa” ringkas, modern, dan mempertahankan daya bela dirinya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama diri ilahi. Bentuk “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Identitas מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  alternative: utusan Yahweh
  rationale: Terjemahan mempertahankan sebutan Ibrani tanpa mengidentifikasi sosok ini secara lebih khusus atau memasukkan kesimpulan kristologis ke dalam teks.
- issue: Fungsi klausa יְהוָה עִמְּךָ
  choice: 'pernyataan: “Yahweh menyertai engkau”'
  alternative: 'harapan atau salam: “Kiranya Yahweh menyertai engkau”'
  rationale: Dalam konteks panggilan Gideon, klausa ini paling alami sebagai penegasan kehadiran Yahweh, meskipun bentuk Ibraninya sendiri tidak memuat verba eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Engkau” dipakai untuk sapaan tunggal dalam wacana Alkitab, sedangkan “hai” menandai sapaan langsung dengan alami. Nama ilahi dipertahankan sebagai “Yahweh”.
