  source_fidelity: 'Teks Indonesia dengan setia merepresentasikan susunan dan makna Ibrani: malaikat Yahweh adalah subjek yang menampakkan diri kepada Gideon, lalu menyampaikan pernyataan bahwa Yahweh menyertainya dan menyapanya sebagai גִּבּוֹר הֶחָיִל. Klausa nominal יְהוָה עִמְּךָ diterjemahkan wajar sebagai pernyataan, bukan harapan.'
