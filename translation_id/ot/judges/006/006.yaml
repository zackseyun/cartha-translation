base_translation:
  language: en
  yaml_path: translation/ot/judges/006/006.yaml
  text: So Israel became very poor because of Midian[c][b][a], and the sons of Israel cried out to Yahweh.
translation:
  language: id
  text: Israel menjadi sangat lemah karena orang Midian,[a] lalu orang Israel[b] berseru kepada Yahweh.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “menjadi sangat miskin” atau “sangat direndahkan.” Kata Ibrani ini dapat menyatakan keadaan dilemahkan, dibuat berkekurangan, atau direndahkan oleh penindasan.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “anak-anak lelaki Israel,” sebutan kolektif yang lazim bagi bangsa Israel.'
    reason: lexical_alternative
  - marker: c
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּדַּל ... מְאֹד
  choice: menjadi sangat lemah
  rationale: Kata kerja דל menyatakan keadaan menjadi lemah, rendah, atau berkekurangan; konteks penindasan Midian mendukung ungkapan luas yang tidak membatasi maknanya pada kemiskinan ekonomi.
- source_word: מִפְּנֵי מִדְיָן
  choice: karena orang Midian
  rationale: מִפְּנֵי menyatakan sebab dalam konteks ini. Nama Midian merujuk secara kolektif kepada kelompok penindas, sehingga 'orang Midian' alami dalam bahasa Indonesia.
- source_word: וַיִּזְעֲקוּ
  choice: berseru
  rationale: זעק menggambarkan seruan dalam kesesakan; 'berseru' mempertahankan urgensi tanpa menambahkan secara eksplisit kata 'minta tolong'.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah ungkapan ini berarti 'anak-anak lelaki Israel', tetapi di sini berfungsi sebagai sebutan kolektif bagi bangsa Israel; 'orang Israel' menyampaikan referen tersebut dengan wajar dan tidak menyiratkan bahwa hanya laki-laki yang berseru.
- source_word: אֶל יְהוָה
  choice: kepada Yahweh
  rationale: אֶל berarti 'kepada', sedangkan nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri יהוה; 'Yahweh' mempertahankan nama itu, sementara catatan memberi padanan tradisional Indonesia.
- issue: Cakupan בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak lelaki Israel
  rationale: Bentuk maskulin tersebut merupakan sebutan kolektif baku bagi umat Israel dalam konteks ini. Terjemahan idiomatis menghindari penyempitan yang tidak dimaksudkan, sedangkan bentuk harfiahnya dicatat.
- issue: Nuansa keadaan Israel dalam וַיִּדַּל
  choice: menjadi sangat lemah
  alternative: menjadi sangat miskin / direndahkan sekali
  rationale: Kata kerja memungkinkan nuansa kelemahan, kerendahan, dan kemelaratan. Teks utama mempertahankan cakupan yang luas tanpa menetapkan bahwa akibatnya semata-mata ekonomis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur sebab-akibat serta peralihan menuju seruan Israel dipertahankan. Tanda baca menempatkan catatan tepat setelah unsur yang dijelaskannya.
