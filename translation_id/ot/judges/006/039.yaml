  text: וַ/יֹּ֤אמֶר גִּדְעוֹן֙ אֶל הָ֣/אֱלֹהִ֔ים אַל יִ֤חַר אַפְּ/ךָ֙ בִּ֔/י וַ/אֲדַבְּרָ֖ה אַ֣ךְ הַ/פָּ֑עַם אֲנַסֶּ֤ה נָּא רַק הַ/פַּ֨עַם֙ בַּ/גִּזָּ֔ה יְהִי נָ֨א חֹ֤רֶב אֶל הַ/גִּזָּה֙ לְ/בַדָּ֔/הּ וְ/עַל כָּל הָ/אָ֖רֶץ יִֽהְיֶה טָּֽל־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/039.yaml
  text: 'Then Gideon said to God[a], “Do not let your anger burn against me, and let me speak just this once. Please let me test just this once with the fleece: let there be dryness on the fleece alone[c][b], and on all the ground let there be dew.”'
translation:
  language: id
  text: Lalu Gideon berkata kepada Allah, “Janganlah murka-Mu menyala terhadap aku, dan izinkanlah aku berbicara hanya kali ini saja. Kumohon, biarlah aku menguji hanya kali ini saja dengan guntingan bulu domba itu:[a] kiranya hanya pada guntingan bulu itu saja ada kekeringan, sedangkan di seluruh tanah ada embun.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kumohon, biarlah aku mencoba hanya kali ini saja dengan guntingan bulu domba itu.”
    reason: lexical_alternative
  - marker: b
    text: “Tanah” dapat juga diterjemahkan “negeri” atau “bumi”; dalam konteks ini, kata tersebut dikontraskan dengan guntingan bulu domba.
    reason: lexical_clarification
lexical_decisions:
- source_word: אַל יִחַר אַפְּךָ בִּי
  choice: Janganlah murka-Mu menyala terhadap aku
  rationale: Mempertahankan gambaran idiom Ibrani tentang murka yang menyala, dengan susunan yang tetap wajar dan khidmat dalam bahasa Indonesia.
- source_word: וַאֲדַבְּרָה אַךְ הַפָּעַם
  choice: dan izinkanlah aku berbicara sekali ini saja
  rationale: Bentuk kohortatif dipahami sebagai permohonan Gideon untuk berbicara satu kali lagi; frasa pembatasnya dipertahankan.
- source_word: אֲנַסֶּה נָּא רַק הַפַּעַם בַּגִּזָּה
  choice: Biarlah aku menguji dengan guntingan bulu domba ini sekali lagi saja
  rationale: נסה tetap diterjemahkan 'menguji', bukan diperhalus menjadi sekadar meminta tanda. 'Sekali lagi saja' menyampaikan pembatasan dalam konteks permintaan sebelumnya.
- source_word: הַגִּזָּה
  choice: guntingan bulu domba
  rationale: גִּזָּה menunjuk pada bulu domba yang telah digunting, bukan kulit domba; pilihan ini jelas bagi pembaca modern.
- source_word: יְהִי נָא חֹרֶב אֶל הַגִּזָּה לְבַדָּהּ
  choice: kiranya hanya guntingan bulu itu yang kering
  rationale: Mengungkapkan konstruksi jusif dan keadaan kering secara alami tanpa memperluas חֹרֶב menjadi kekeringan wilayah.
- source_word: וְעַל כָּל הָאָרֶץ יִהְיֶה טָּל
  choice: sedangkan seluruh tanah di sekitarnya berembun
  rationale: Dalam kontras dengan bulu domba, הָאָרֶץ menunjuk pada tanah setempat. 'Di sekitarnya' memperjelas cakupan kontekstual tanpa menyiratkan seluruh bumi.
- source_word: הָאֱלֹהִים
  choice: Allah
  rationale: Dalam narasi dan sapaan ini, bentuk berartikel menunjuk kepada Allah; bahasa Indonesia secara alami tidak memakai artikel.
theological_decisions:
- issue: Permintaan Gideon untuk menguji Allah melalui satu tanda lagi
  choice: Mempertahankan kata 'menguji' serta nada permohonan yang berhati-hati
  alternative: Memperkerasnya sebagai tindakan lancang atau memperhalusnya menjadi sekadar permohonan tanda
  rationale: Teks menyandingkan kekhawatiran Gideon akan murka Allah dengan permintaannya untuk menguji sekali lagi. Terjemahan tidak menambahkan penilaian teologis yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Metafora murka yang menyala dipertahankan; pengulangan pembatasan permintaan Gideon juga dijaga. Semua penanda catatan kaki muncul dalam teks utama.
