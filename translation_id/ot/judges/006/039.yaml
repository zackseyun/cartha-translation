  to: Lalu Gideon berkata kepada Allah, “Janganlah murka-Mu menyala terhadap aku, dan izinkanlah aku berbicara hanya kali ini saja. Kumohon, biarlah aku menguji hanya kali ini saja dengan guntingan bulu domba itu:[a] kiranya hanya pada guntingan bulu itu saja ada kekeringan, sedangkan di seluruh tanah ada embun.”[b]
