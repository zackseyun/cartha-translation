base_translation:
  language: en
  yaml_path: translation/ot/judges/006/036.yaml
  text: Then Gideon said to God, “If you will save Israel by my hand, as you have spoken,”
translation:
  language: id
  text: Lalu Gideon berkata kepada Allah, “Jika Engkau akan menyelamatkan Israel melalui tanganku, seperti yang telah Engkau firmankan—”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “Lalu” menyampaikan urutan naratif secara wajar dalam bahasa Indonesia modern.
- source_word: אֶל הָאֱלֹהִים
  choice: kepada Allah
  rationale: Dalam konteks ini Gideon berbicara kepada Allah Israel. “Kepada Allah” merupakan ungkapan Indonesia yang alami dan spesifik.
- source_word: אִם
  choice: Jika
  rationale: Memulai anak kalimat bersyarat yang berlanjut ke ayat berikutnya, tanpa menutup atau menyelesaikan ketegangan kalimat tersebut.
- source_word: יֶשְׁךָ מוֹשִׁיעַ
  choice: Engkau akan menyelamatkan
  rationale: Konstruksi יֵשׁ dengan sufiks pronominal dan partisip menyatakan tindakan yang dimaksudkan atau akan dilakukan. “Akan menyelamatkan” alami, langsung, dan tetap mempertahankan nuansa prospektif.
- source_word: בְּיָדִי
  choice: melalui tanganku
  rationale: Mempertahankan citra konkret idiom Ibrani tentang tangan sebagai sarana atau perantaraan, sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Penanda objek langsung אֵת tidak diterjemahkan; Israel tetap menjadi objek tindakan penyelamatan.
- source_word: כַּאֲשֶׁר דִּבַּרְתָּ
  choice: seperti yang telah Engkau firmankan
  rationale: “Telah” mencerminkan perkataan terdahulu yang masih relevan, sedangkan “firmankan” sesuai untuk perkataan Allah dalam ragam Alkitab Indonesia yang dignified namun tetap mudah dipahami.
theological_decisions:
- issue: Penyebutan אֱלֹהִים dalam sapaan Gideon
  choice: Allah
  alternative: allah; Sang Allah
  rationale: Konteks menunjuk secara khusus kepada Allah Israel. Kapitalisasi dan bentuk “Allah” menyampaikan rujukan itu tanpa menambahkan penafsiran doktrinal lain.
- issue: Makna keselamatan dalam מוֹשִׁיעַ
  choice: menyelamatkan
  alternative: membebaskan
  rationale: Konteks langsungnya adalah pembebasan Israel dari penindasan militer, tetapi “menyelamatkan” mempertahankan keluasan makna verba ישׁע dan resonansi teologisnya tanpa menghapus konteks historis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Tanda pisah sebelum penutup kutipan menandai bahwa syarat yang dimulai dalam ayat ini belum selesai dan berlanjut pada ayat berikutnya; tidak ditambahkan tanda baca yang akan menjadikannya kalimat lengkap.
