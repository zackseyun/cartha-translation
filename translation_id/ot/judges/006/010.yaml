base_translation:
  language: en
  yaml_path: translation/ot/judges/006/010.yaml
  text: And I said to you[a], ‘I am Yahweh your God; do not fear the gods of the Amorites, in whose land you dwell[b]. But you have not listened to my voice.’
translation:
  language: id
  text: Aku berkata kepada kalian, “Akulah Yahweh, Allah kalian. Jangan takut[a] kepada allah-allah orang Amori, yang negerinya kalian diami. Namun, kalian tidak mendengarkan suara-Ku[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “takut” juga dapat mencakup sikap menghormati atau memuja.
    reason: lexical_alternative
  - marker: b
    text: “Mendengarkan suara-Ku” juga dapat dipahami sebagai “menaati Aku”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמְרָה לָכֶם
  choice: Aku berkata kepada kalian
  rationale: Bentuk wayyiqtol orang pertama tunggal dari אמר melanjutkan penuturan tentang perkataan Yahweh pada masa lampau. “Kalian” menyatakan bahwa sufiks Ibrani berbentuk jamak.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan suatu gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allah kalian
  rationale: Walaupun אֱלֹהִים berbentuk jamak secara morfologis, dalam frasa ini kata tersebut merujuk secara tunggal kepada Allah Israel. “Kalian” mempertahankan jumlah jamak pada sufiksnya.
- source_word: לֹא תִירְאוּ
  choice: Jangan takut
  rationale: Imperfek dengan לֹא di sini menyatakan larangan. Ungkapan langsung “jangan takut” alami dalam bahasa Indonesia dan tetap mempertahankan rentang makna dasar ירא.
- source_word: אֶת אֱלֹהֵי הָאֱמֹרִי
  choice: kepada allah-allah orang Amori
  rationale: Bentuk tunggal kolektif הָאֱמֹרִי menunjuk kepada bangsa Amori, sedangkan אֱלֹהֵי menunjuk kepada dewa-dewa yang mereka sembah. Huruf kecil pada “allah-allah” membedakannya dari Allah Israel.
- source_word: אֲשֶׁר אַתֶּם יוֹשְׁבִים בְּאַרְצָם
  choice: yang negerinya kalian diami
  rationale: Klausa relatif ini menerangkan orang Amori. “Kalian diami” menyampaikan makna menetap dari ישׁב dengan ringkas dan wajar.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקוֹלִי
  choice: Namun, kalian tidak mendengarkan suara-Ku
  rationale: Konstruksi שׁמע בקול secara harfiah berbicara tentang mendengarkan suara, tetapi juga mengandung arti mengindahkan atau menaati. Teks utama mempertahankan idiom Ibrani, sedangkan “Namun” menyatakan pertentangan kontekstual.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה secara langsung; transliterasi mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Nuansa ירא terhadap allah-allah orang Amori
  choice: takut kepada
  alternative: menghormati atau menyembah
  rationale: “Takut” mempertahankan padanan utama dan ambiguitas leksikal ירא. Karena objeknya adalah ilah-ilah asing, konteks dapat mencakup sikap hormat religius atau pemujaan; kemungkinan ini dicatat tanpa memasukkannya secara sepihak ke teks utama.
- issue: Makna שׁמע בקול
  choice: mendengarkan suara-Ku
  alternative: menaati Aku
  rationale: Idiom konkret dalam bahasa Ibrani dipertahankan, sementara implikasi ketaatan dijelaskan dalam catatan agar hubungan antara mendengar dan menaati tidak dipersempit secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “kalian” dipakai untuk memperlihatkan bahwa orang kedua dalam teks Ibrani berbentuk jamak. Kapitalisasi “Allah” dan “allah-allah” membedakan Allah Israel dari ilah-ilah orang Amori; “suara-Ku” mengikuti kaidah kapitalisasi pronomina yang merujuk kepada Allah.
