base_translation:
  language: en
  yaml_path: translation/ot/judges/006/018.yaml
  text: Please do not depart from here until I come to you and bring out my offering and set it before you." And he said[a], "I will stay until you return.
translation:
  language: id
  text: “Tolong jangan pergi dari sini sampai aku datang kepadamu, membawa ke luar persembahanku[a] dan menaruhnya di hadapanmu.” Ia menjawab, “Aku akan tetap di sini sampai engkau kembali.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pemberianku” atau “upetiku”; istilah Ibrani ini dapat merujuk secara luas pada pemberian yang disajikan dan, dalam konteks tertentu, pada persembahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא תָמֻשׁ מִזֶּה
  choice: Tolong jangan pergi dari sini
  rationale: נָא menyatakan permohonan sopan, sedangkan מוש dengan מִזֶּה berarti bergerak atau pergi dari tempat ini. Ungkapan ini alami dalam bahasa Indonesia modern.
- source_word: עַד בֹּאִי אֵלֶיךָ
  choice: sampai aku datang kepadamu
  rationale: Bentuk infinitif dengan sufiks orang pertama dialihkan menjadi klausa finite yang wajar tanpa menambah gagasan yang tidak ada dalam teks.
- source_word: וְהֹצֵאתִי
  choice: membawa ke luar
  rationale: Bentuk Hifil dari יצא di sini berarti membawa sesuatu keluar dari tempat Gideon akan menyiapkannya.
- source_word: מִנְחָתִי
  choice: persembahanku
  rationale: מִנְחָה dapat berarti pemberian, upeti, atau persembahan. 'Persembahan' mempertahankan nuansa religius dalam alur ini tanpa mempersempitnya menjadi kurban sajian tertentu.
- source_word: וְהִנַּחְתִּי לְפָנֶיךָ
  choice: dan menaruhnya di hadapanmu
  rationale: Terjemahan ini menyampaikan tindakan meletakkan sesuatu di hadapan seseorang secara alami dan tetap dekat dengan susunan Ibrani.
- source_word: אָנֹכִי אֵשֵׁב
  choice: Aku akan tetap di sini
  rationale: Walaupun ישב secara harfiah dapat berarti 'duduk', dalam konteks ini maksudnya adalah tetap berada di tempat tersebut. 'Tetap di sini' menyatakan makna kontekstual dengan jelas.
- source_word: עַד שׁוּבֶךָ
  choice: sampai engkau kembali
  rationale: Infinitif dengan sufiks orang kedua paling alami diterjemahkan sebagai klausa finite dalam bahasa Indonesia.
theological_decisions:
- issue: Makna מִנְחָה dalam penyajian Gideon
  choice: persembahan
  alternative: pemberian; upeti; kurban sajian
  rationale: Istilah ini mencakup beberapa jenis pemberian yang disajikan. Konteks berikutnya memberikan nuansa sakral, tetapi ayat ini sendiri tidak mengharuskan arti teknis 'kurban sajian'. Karena itu, 'persembahan' menjaga keluasan makna dan ketegangan naratifnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Tolong' menyampaikan permohonan sopan secara alami; 'engkau' dipakai dalam dialog bernuansa Kitab Suci tanpa menjadi terlalu arkais. Penanda catatan kaki ditempatkan langsung sesudah kata yang dijelaskannya.
