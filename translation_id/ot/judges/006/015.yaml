  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ בִּ֣י אֲדֹנָ֔/י בַּ/מָּ֥ה אוֹשִׁ֖יעַ אֶת יִשְׂרָאֵ֑ל הִנֵּ֤ה אַלְפִּ/י֙ הַ/דַּ֣ל בִּ/מְנַשֶּׁ֔ה וְ/אָנֹכִ֥י הַ/צָּעִ֖יר בְּ/בֵ֥ית אָבִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/015.yaml
  text: But he said to him[a], “Please, my lord, how can I save Israel? Look, my clan is the weakest in Manasseh[c][b], and I am the youngest in my father’s house.”
translation:
  language: id
  text: Namun Gideon berkata kepadanya, “Mohon, Tuanku, bagaimana mungkin aku menyelamatkan Israel? Lihatlah, puakku[a] adalah yang paling lemah[b] di Manasye, dan akulah yang paling muda[c] dalam keluarga ayahku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seribuku”; istilah Ibrani ini dapat menunjuk pada puak atau kelompok keluarga dalam suatu suku.
    reason: lexical_alternative
  - marker: b
    text: Atau, “yang paling miskin” atau “yang paling kecil kedudukannya”.
    reason: lexical_alternative
  - marker: c
    text: Atau, “yang paling kecil” atau “yang paling tidak penting”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי
  choice: Mohon
  rationale: Partikel permohonan yang menyatakan kesopanan; “Mohon” alami dalam bahasa Indonesia dan mempertahankan nada hormat Gideon.
- source_word: אֲדֹנָי
  choice: Tuanku
  rationale: Sapaan hormat kepada pihak yang berkuasa. Bentuk ini tidak secara dini memastikan apakah Gideon sudah memahami lawan bicaranya sebagai Tuhan, sehingga ketegangan naratif tetap terpelihara.
- source_word: בַּמָּה
  choice: bagaimana mungkin
  rationale: Secara harfiah menanyakan ‘dengan apa’, tetapi dalam konteks ini menyatakan pertanyaan tentang sarana dan kemampuan. Ungkapan Indonesia ini menyampaikan keraguan Gideon secara wajar.
- source_word: אוֹשִׁיעַ
  choice: aku menyelamatkan
  rationale: Bentuk Hifil dari יָשַׁע berarti menyelamatkan atau membebaskan. “Menyelamatkan” mempertahankan cakupan makna yang luas.
- source_word: הִנֵּה
  choice: Ketahuilah
  rationale: Penanda untuk mengarahkan perhatian kepada alasan yang segera diberikan. “Ketahuilah” lebih bermartabat dan alami daripada terjemahan harfiah “Lihatlah” dalam konteks ujaran ini.
- source_word: אַלְפִּי
  choice: puakku
  rationale: אֶלֶף secara harfiah berkaitan dengan ‘seribu’, tetapi dalam susunan sosial kesukuan dapat menunjuk pada puak atau kelompok kekerabatan. “Puak” tepat bagi konteks Manasye.
- source_word: הַדַּל
  choice: yang paling lemah
  rationale: דַּל dapat berarti lemah, miskin, atau rendah kedudukannya. “Paling lemah” cocok dengan pengakuan Gideon tentang ketidakmampuan dan rendahnya kedudukan puaknya, sambil mencatat alternatifnya.
- source_word: בִּמְנַשֶּׁה
  choice: di Manasye
  rationale: Nama suku diterjemahkan dengan bentuk Indonesia yang lazim.
- source_word: הַצָּעִיר
  choice: yang paling muda
  rationale: Kata ini dapat berarti muda, kecil, atau tidak penting. Dalam lingkungan keluarga ayah, “paling muda” merupakan pengertian kekeluargaan yang paling langsung, sementara kemungkinan makna status dicatat.
- source_word: בְּבֵית אָבִי
  choice: dalam keluarga ayahku
  rationale: Ungkapan Ibrani ‘rumah ayahku’ menunjuk pada keluarga atau rumah tangga pihak ayah. “Keluarga ayahku” mencegah pembaca memahaminya sebagai bangunan fisik.
theological_decisions:
- issue: Daya sapaan אֲדֹנָי kepada lawan bicara Gideon
  choice: “Tuanku” sebagai sapaan hormat yang tetap terbuka
  alternative: “Tuhan” sebagai gelar ilahi
  rationale: Konteks naratif menghubungkan pembicara dengan TUHAN, tetapi sapaan itu sendiri juga dapat dipahami sebagai penghormatan kepada seorang atasan. “Tuanku” tidak memaksakan tingkat pengenalan Gideon dan mempertahankan ketegangan naratif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama Gideon ditambahkan sebagai subjek untuk memperjelas rujukan pronomina tanpa mengubah isi. “Aku” sesuai dengan tuturan langsung dan nada pribadi. Istilah “puak” mempertahankan latar sosial kesukuan, sedangkan “keluarga ayahku” mengungkapkan idiom Ibrani secara jelas.
