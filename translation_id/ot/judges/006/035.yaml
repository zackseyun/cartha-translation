language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מַלְאָכִים֙ שָׁלַ֣ח בְּ/כָל מְנַשֶּׁ֔ה וַ/יִזָּעֵ֥ק גַּם ה֖וּא אַחֲרָ֑י/ו וּ/מַלְאָכִ֣ים שָׁלַ֗ח בְּ/אָשֵׁ֤ר וּ/בִ/זְבֻלוּן֙ וּ/בְ/נַפְתָּלִ֔י וַֽ/יַּעֲל֖וּ לִ/קְרָאתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/035.yaml
  text: And he sent messengers throughout all Manasseh[a], and it too was called out after him. He also sent messengers through Asher, Zebulun, and Naphtali, and they went up to meet them.
translation:
  language: id
  text: Ia mengirim utusan ke seluruh wilayah Manasye, dan suku itu pun dikerahkan untuk mengikutinya. Ia juga mengirim utusan ke wilayah Asyer, Zebulon, dan Naftali, lalu orang-orang dari suku-suku itu maju untuk menemui mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “mereka” dalam bahasa Ibrani berbentuk jamak, tetapi acuannya tidak disebutkan secara tegas. Kemungkinan besar yang dimaksud ialah pasukan musuh; kemungkinan lain ialah Gideon beserta pasukannya.
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְאָכִים
  choice: utusan
  rationale: Dalam konteks pengerahan pasukan, kata ini menunjuk kepada manusia yang membawa panggilan, bukan malaikat.
- source_word: בְּכָל מְנַשֶּׁה
  choice: ke seluruh wilayah Manasye
  rationale: Ungkapan ini menyatakan bahwa para utusan dikirim ke segenap wilayah atau kelompok suku Manasye.
- source_word: וַיִּזָּעֵק
  choice: dikerahkan
  rationale: 'Bentuk Niphal di sini memiliki arti pasif dalam konteks militer: suku Manasye dipanggil dan dihimpun untuk berperang.'
- source_word: גַּם הוּא
  choice: suku itu pun
  rationale: Kata ganti tunggal mengacu kepada Manasye sebagai satu kesatuan suku; penyebutan eksplisit menghasilkan bahasa Indonesia yang alami dan jelas.
- source_word: אַחֲרָיו
  choice: untuk mengikutinya
  rationale: Ungkapan ini menggambarkan Manasye berhimpun di belakang Gideon sebagai pemimpin.
- source_word: בְּאָשֵׁר וּבִזְבֻלוּן וּבְנַפְתָּלִי
  choice: ke wilayah Asyer, Zebulon, dan Naftali
  rationale: Preposisi yang berulang menunjukkan daerah atau kelompok suku yang didatangi para utusan untuk menyampaikan panggilan.
- source_word: וַיַּעֲלוּ
  choice: maju
  rationale: Secara harfiah verba ini berarti 'naik', tetapi dalam gerakan militer dapat menyatakan bergerak maju; pilihan ini alami dalam bahasa Indonesia tanpa menambahkan arah geografis yang tidak dijelaskan.
- source_word: לִקְרָאתָם
  choice: untuk menemui mereka
  rationale: Akhiran pronominalnya berbentuk jamak. Terjemahan mempertahankan bentuk jamak dan tidak menentukan acuannya secara eksplisit.
theological_decisions:
- issue: Acuan kata ganti jamak dalam לִקְרָאתָם
  choice: Mempertahankan kata ganti jamak 'mereka' tanpa menyebut acuannya dalam teks utama
  alternative: Menafsirkannya secara eksplisit sebagai pasukan musuh, atau sebagai Gideon beserta pasukannya
  rationale: Bahasa Ibrani memakai akhiran jamak tetapi tidak menyatakan antesedennya. Konteks memungkinkan acuan kepada pasukan musuh yang telah berkumpul, sedangkan Gideon bersama pasukannya juga mungkin dipahami sebagai acuan. Ketegangan ini tidak sepatutnya diselesaikan secara dogmatis dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Istilah 'dikerahkan' mempertahankan nuansa panggilan militer, sedangkan penyebutan 'suku itu' dan 'orang-orang dari suku-suku itu' memperjelas acuan kolektif yang dalam bahasa Ibrani dinyatakan melalui bentuk pronominal.
