  text: וְ/הָיָ֖ה אִם זָרַ֣ע יִשְׂרָאֵ֑ל וְ/עָלָ֨ה מִדְיָ֧ן וַֽ/עֲמָלֵ֛ק וּ/בְנֵי קֶ֖דֶם וְ/עָל֥וּ עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/003.yaml
  text: And whenever Israel sowed[a], Midian and Amalek and the people of the East would come up against them.
translation:
  language: id
  text: Setiap kali orang Israel menabur benih, orang Midian, orang Amalek, dan orang-orang dari Timur datang menyerang mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani tertulis “dia”, yakni Israel yang dipandang sebagai satu bangsa.
    reason: Menjelaskan bahwa kata ganti tunggal dalam teks sumber dialihkan menjadi bentuk jamak kolektif yang alami dalam bahasa Indonesia.
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Setiap kali
  rationale: Gabungan ini memperkenalkan keadaan yang berulang dalam narasi; 'setiap kali' menyampaikan daya iteratifnya secara alami.
- source_word: זָרַע יִשְׂרָאֵל
  choice: orang Israel menabur benih
  rationale: זָרַע berarti menabur; penambahan 'benih' membuat tindakan pertanian ini jelas dan alami. 'Orang Israel' merujuk kepada bangsa itu secara kolektif.
- source_word: וְעָלָה ... וְעָלוּ עָלָיו
  choice: datang menyerang mereka
  rationale: עלה על dalam konteks gerakan militer menyatakan datang maju melawan atau menyerang. Bentuk berulang sudah dinyatakan oleh 'setiap kali'.
- source_word: מִדְיָן וַעֲמָלֵק
  choice: orang Midian, orang Amalek
  rationale: Nama-nama ini secara kolektif menunjuk kepada kedua bangsa; bentuk 'orang ...' jelas dan wajar dalam bahasa Indonesia.
- source_word: וּבְנֵי קֶדֶם
  choice: orang-orang dari Timur
  rationale: Secara harfiah 'anak-anak Timur', sebuah sebutan kolektif bagi kelompok-kelompok yang berasal dari wilayah timur.
- source_word: עָלָיו
  choice: mereka
  rationale: Sufiks Ibrani berbentuk tunggal maskulin dan mengacu secara kolektif kepada Israel; bahasa Indonesia alami menggunakan 'mereka' untuk bangsa yang terdiri dari orang-orang.
