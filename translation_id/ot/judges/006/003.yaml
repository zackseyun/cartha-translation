  terminology: “Orang Israel”, “orang Midian”, “orang Amalek”, dan “orang-orang dari Timur” konsisten dengan fungsi kolektif nama-nama dalam ayat ini. Catatan kaki memakai istilah yang dapat dipahami pembaca umum sambil memberikan penjelasan kebahasaan yang memadai.
