base_translation:
  language: en
  yaml_path: translation/ot/judges/006/017.yaml
  text: And he said to him, “If now I have found favor in your eyes, then give me a sign that you are the one speaking with me.”
translation:
  language: id
  text: Lalu Gideon berkata kepada-Nya, “Jika aku mendapat perkenanan di mata-Mu, berilah aku suatu tanda bahwa Engkaulah yang sedang berbicara denganku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: aku mendapat perkenanan di mata-Mu
  rationale: Mempertahankan ungkapan Ibrani tentang memperoleh perkenanan dengan bentuk yang tetap alami dan bermartabat dalam bahasa Indonesia.
- source_word: וְעָשִׂיתָ לִּי אוֹת
  choice: berilah aku suatu tanda
  rationale: Dalam konteks ini עשׂה ... אות berarti menyediakan atau memberikan tanda; pilihan ini jelas dan wajar dalam bahasa Indonesia.
- source_word: שָׁאַתָּה מְדַבֵּר עִמִּי
  choice: bahwa Engkaulah yang sedang berbicara denganku
  rationale: Konstruksi dengan pronomina eksplisit אַתָּה memberi penekanan pada identitas pembicara; '-lah' mempertahankan penekanan tersebut.
theological_decisions:
- issue: Identitas sosok yang diajak bicara Gideon
  choice: Kata ganti ilahi ditulis dengan huruf kapital tanpa menambahkan gelar atau nama.
  alternative: Menggunakan huruf kecil atau secara eksplisit menulis 'Malaikat TUHAN'/'TUHAN'.
  rationale: Ayat Ibrani memakai kata ganti orang dan tidak mengulang identitas pembicara. Kapitalisasi mengikuti konteks, sedangkan tidak menambahkan gelar menjaga ketegangan naratif dan tidak melampaui teks ayat.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Nama 'Gideon' digunakan untuk memperjelas subjek pronominal sesuai konteks langsung, tanpa mengubah makna.
