  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּשְׁכִּ֜ימוּ אַנְשֵׁ֤י הָ/עִיר֙ בַּ/בֹּ֔קֶר וְ/הִנֵּ֤ה נֻתַּץ֙ מִזְבַּ֣ח הַ/בַּ֔עַל וְ/הָ/אֲשֵׁרָ֥ה אֲשֶׁר עָלָ֖י/ו כֹּרָ֑תָה וְ/אֵת֙ הַ/פָּ֣ר הַ/שֵּׁנִ֔י הֹֽעֲלָ֔ה עַל הַ/מִּזְבֵּ֖חַ הַ/בָּנֽוּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/028.yaml
  text: When the men of the city rose early in the morning[a], behold, the altar of Baal had been torn down, and the Asherah that was on it had been cut down[b], and the second bull had been offered up on the altar that had been built.
translation:
  language: id
  text: Ketika para lelaki kota itu bangun pagi-pagi, ternyata mezbah Baal telah dirobohkan, Asyera[a] yang ada di atasnya[b] telah ditebang, dan lembu jantan yang kedua telah dipersembahkan di atas mezbah yang telah dibangun itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “tiang Asyera” atau “tiang keramat”; Ibrani: “Asyera.”'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di atasnya”; mungkin juga bermakna “di sampingnya” atau menunjukkan bahwa Asyera itu berkaitan dengan mezbah tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּימוּ
  choice: bangun pagi-pagi
  rationale: Bentuk verba dari שׁכם menekankan tindakan bangun pada waktu pagi; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan penekanan waktunya.
- source_word: אַנְשֵׁי הָעִיר
  choice: orang-orang kota itu
  rationale: Merujuk pada para laki-laki penduduk kota; dalam narasi Indonesia, 'orang-orang kota itu' paling alami, tanpa mengharuskan bahwa seluruh penduduk hadir.
- source_word: וְהִנֵּה
  choice: tampaklah bahwa
  rationale: Mengungkapkan penemuan yang mendadak dan mencolok tanpa memakai seruan arkais.
- source_word: נֻתַּץ מִזְבַּח הַבַּעַל
  choice: mazbah Baal telah dirobohkan
  rationale: Bentuk pasif נתץ berarti merobohkan atau menghancurkan suatu bangunan; 'mazbah' mempertahankan istilah ibadah yang lazim dan bermartabat.
- source_word: הָאֲשֵׁרָה
  choice: Asyera
  rationale: Transliterasi mempertahankan ketidakpastian apakah istilah ini menunjuk pada objek kultis, tiang/pohon keramat, atau lambang dewi Asyera.
- source_word: אֲשֶׁר עָלָיו
  choice: yang ada di atasnya
  rationale: Menerjemahkan עַל secara langsung sebagai 'di atas'; hubungan ruang persisnya tetap dapat dipahami sebagai berada pada atau terkait dengan mazbah.
- source_word: כֹּרָתָה
  choice: telah ditebang
  rationale: Verba כרת dalam konteks objek kayu berarti ditebang atau dipotong jatuh.
- source_word: הַפָּר הַשֵּׁנִי
  choice: lembu jantan yang kedua
  rationale: Menerjemahkan פַּר secara tepat sebagai lembu jantan dan mempertahankan kaitan 'yang kedua' dengan perintah sebelumnya.
- source_word: הֹעֲלָה
  choice: telah dipersembahkan
  rationale: Bentuk Hophal dari עלה dalam konteks ritual menyatakan bahwa hewan itu telah dinaikkan sebagai persembahan; 'dipersembahkan' alami dan tidak menambahkan rincian yang tidak dinyatakan verba ini sendiri.
- source_word: הַמִּזְבֵּחַ הַבָּנוּי
  choice: mazbah yang telah dibangun itu
  rationale: Partisip pasif menunjuk pada mazbah yang sebelumnya dibangun dalam narasi.
theological_decisions:
- issue: Makna אֲשֵׁרָה
  choice: Asyera
  alternative: tiang Asyera; tiang keramat
  rationale: Teks Ibrani menyebut אֲשֵׁרָה tanpa menjelaskan bentuk objeknya. Transliterasi menghindari penentuan berlebihan dan alternatif dijelaskan dalam catatan kaki.
- issue: Makna spasial עָלָיו
  choice: di atasnya
  alternative: di sampingnya; padanya
  rationale: Arti paling langsung dari עַל dengan sufiks adalah 'di atasnya'. Karena konteks kultis dapat menunjukkan hubungan atau kedekatan, ketidakpastian itu dicatat tanpa mengganti makna formal dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang bermartabat. 'Tampaklah bahwa' mempertahankan daya penemuan וְהִנֵּה tanpa terdengar terlalu arkais. Istilah 'mazbah' dipakai secara konsisten untuk konteks ibadah kuno.
