id: JDG.6.11
reference: Judges 6:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּבֹ֞א מַלְאַ֣ךְ יְהוָ֗ה וַ/יֵּ֨שֶׁב֙ תַּ֤חַת הָֽ/אֵלָה֙ אֲשֶׁ֣ר בְּ/עָפְרָ֔ה אֲשֶׁ֥ר לְ/יוֹאָ֖שׁ אֲבִ֣י הָֽעֶזְרִ֑י וְ/גִדְע֣וֹן בְּנ֗/וֹ חֹבֵ֤ט חִטִּים֙ בַּ/גַּ֔ת לְ/הָנִ֖יס מִ/פְּנֵ֥י מִדְיָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/011.yaml
  text: Then the angel of Yahweh came and sat under the oak that was in Ophrah[a], which belonged to Joash the Abiezrite[c][b], while Gideon his son was beating out wheat in the winepress to hide it from Midian.
translation:
  language: id
  text: Lalu malaikat Yahweh datang dan duduk di bawah pohon besar[a] di Ofra, yang merupakan milik Yoas, orang Abiezer[b]. Sementara itu, Gideon, anaknya, sedang mengirik[c] gandum di tempat pemerasan anggur untuk menyembunyikannya dari orang Midian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pohon tarbantin.” Istilah Ibrani menunjuk pada sejenis pohon besar, tetapi identifikasi tepatnya tidak pasti.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “orang Abiezer”; maksudnya, anggota kaum atau keturunan Abiezer.'
    reason: cultural_clarification
  - marker: c
    text: 'Atau: “sedang memukul-mukul gandum” untuk melepaskan bulirnya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  rationale: מַלְאַךְ dapat berarti utusan atau malaikat, tetapi konteks narasi ini paling wajar menunjuk kepada utusan surgawi; nama ilahi יְהוָה dipertahankan sebagai Yahweh.
- source_word: וַיָּבֹא וַיֵּשֶׁב
  choice: datang dan duduk
  rationale: Menyampaikan dua tindakan naratif konkret secara langsung dan alami.
- source_word: הָאֵלָה
  choice: pohon besar
  rationale: Identifikasi botanis אֵלָה tidak sepenuhnya pasti; terjemahan umum ini tidak memaksakan jenis pohon tertentu, sedangkan kemungkinan 'pohon tarbantin' dicatat dalam catatan kaki.
- source_word: בְּעָפְרָה
  choice: di Ofra
  rationale: Nama tempat ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: אֲשֶׁר לְיוֹאָשׁ
  choice: yang merupakan milik Yoas
  rationale: Menjaga klausa relatif posesif Ibrani dengan ungkapan Indonesia yang jelas.
- source_word: אֲבִי הָעֶזְרִי
  choice: orang Abiezer
  rationale: Gentilik ini menyatakan afiliasi Yoas dengan kaum atau keturunan Abiezer; bentuk deskriptif ini lebih alami daripada membentuk gentilik yang asing dalam bahasa Indonesia.
- source_word: חֹבֵט חִטִּים
  choice: sedang mengirik gandum
  rationale: חבט berarti memukul-mukul biji-bijian untuk melepaskannya; 'mengirik' merupakan istilah Indonesia yang ringkas dan tepat, dengan tindakan harfiahnya dijelaskan di catatan kaki.
- source_word: בַּגַּת
  choice: di tempat pemerasan anggur
  rationale: Mengikuti preposisi dan menggambarkan lokasi tersembunyi yang tidak lazim untuk mengirik gandum.
- source_word: לְהָנִיס מִפְּנֵי מִדְיָן
  choice: untuk menyembunyikannya dari orang Midian
  rationale: Bentuk kausatif נוּס secara harfiah berkaitan dengan membuat lari atau menyingkirkan; dalam konteks gandum dan ancaman Midian, maksud praktisnya ialah menjauhkan gandum agar tidak ditemukan atau dirampas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama ilahi secara langsung; transliterasi 'Yahweh' mempertahankan nama pribadi itu dan tidak menggantinya dengan gelar.
- issue: Makna מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  alternative: utusan Yahweh
  rationale: Konteks naratif mendukung sosok utusan surgawi, tetapi terjemahan ini tidak menetapkan lebih jauh identitas ontologisnya dan dengan demikian mempertahankan ketegangan teologis teks.
- issue: Rujukan מִדְיָן
  choice: orang Midian
  alternative: Midian
  rationale: Nama tunggal kolektif dalam bahasa Ibrani merujuk kepada pihak Midian yang mengancam Israel; bentuk 'orang Midian' alami dalam bahasa Indonesia tanpa menambahkan penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif yang lugas dan bermartabat. Susunan kalimat dibagi agar hubungan antara kepemilikan pohon, identitas Yoas, dan tindakan Gideon tetap jelas. Istilah teknis 'mengirik' dipertahankan, lalu dijelaskan melalui catatan kaki.
