base_translation:
  language: en
  yaml_path: translation/ot/judges/006/002.yaml
  text: And the hand of Midian prevailed against Israel[a]. Because of Midian, the sons of Israel made for themselves the dens that are in the mountains, and the caves[b], and the strongholds.
translation:
  language: id
  text: Orang Midian pun berkuasa atas Israel. Karena orang Midian, orang Israel membuat untuk diri mereka sendiri tempat-tempat persembunyian[a] di pegunungan, gua-gua, dan kubu-kubu pertahanan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini langka; mungkin berarti liang-liang, ruang-ruang perlindungan, atau tempat-tempat persembunyian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּעָז יַד מִדְיָן עַל יִשְׂרָאֵל
  choice: Orang Midian pun berkuasa atas Israel
  rationale: Ungkapan Ibrani secara harfiah menyatakan bahwa ‘tangan Midian menjadi kuat atas Israel.’ Dalam bahasa Indonesia modern, ‘berkuasa atas’ menyampaikan dominasi yang dimaksud tanpa mempertahankan idiom ‘tangan’ yang terasa kurang alami.
- source_word: מִפְּנֵי מִדְיָן
  choice: Karena orang Midian
  rationale: Frasa ini menyatakan bahwa ancaman atau tekanan dari Midian menjadi alasan tindakan Israel. ‘Karena’ mempertahankan hubungan sebab tanpa menambahkan secara eksplisit unsur ketakutan yang tidak disebutkan dalam teks.
- source_word: עָשׂוּ לָהֶם
  choice: membuat bagi diri mereka
  rationale: Mempertahankan verba ‘membuat’ serta nuansa benefaktif/refleksif dari לָהֶם, yaitu bahwa tempat-tempat itu dibuat untuk mereka sendiri.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ini adalah padanan kolektif yang alami dan inklusif dalam bahasa Indonesia untuk ungkapan harfiah ‘anak-anak lelaki Israel,’ yang dalam konteks ini menunjuk kepada bangsa Israel.
- source_word: הַמִּנְהָרוֹת אֲשֶׁר בֶּהָרִים
  choice: tempat-tempat persembunyian di pegunungan
  rationale: הַמִּנְהָרוֹת adalah istilah langka yang tampaknya menunjuk pada lubang, ruang perlindungan, atau tempat bersembunyi. Terjemahan ini sesuai dengan fungsi tempat tersebut dalam konteks dan tetap membedakannya dari ‘gua-gua’ yang disebut berikutnya; ketidakpastian leksikal dicatat dalam catatan kaki.
- source_word: הַמְּעָרוֹת
  choice: gua-gua
  rationale: Padanan Indonesia yang baku dan langsung untuk gua atau rongga alami.
- source_word: הַמְּצָדוֹת
  choice: kubu-kubu pertahanan
  rationale: Menunjuk pada tempat-tempat yang kuat dan dapat dipertahankan. Bentuk ini lebih jelas bagi pembaca modern daripada hanya ‘kubu-kubu,’ tanpa mengharuskan bangunan benteng besar.
