  text: וַ/יִּ֤פֶן אֵלָי/ו֙ יְהוָ֔ה וַ/יֹּ֗אמֶר לֵ֚ךְ בְּ/כֹחֲ/ךָ֣ זֶ֔ה וְ/הוֹשַׁעְתָּ֥ אֶת יִשְׂרָאֵ֖ל מִ/כַּ֣ף מִדְיָ֑ן הֲ/לֹ֖א שְׁלַחְתִּֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/014.yaml
  text: Then Yahweh turned to him and said[a], “Go in this strength of yours and save Israel from the hand of Midian[b]. Have I not sent you?”
translation:
  language: id
  text: Lalu Yahweh berpaling kepadanya dan berkata, “Pergilah dengan kekuatanmu ini[a] dan selamatkanlah Israel dari tangan Midian[b]. Bukankah Aku telah mengutusmu?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “dalam kekuatanmu ini.” Kata depan Ibrani dapat menyatakan sarana maupun lokasi/keadaan, dan kata “ini” memberi penekanan.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani “dari tangan Midian” berarti dibebaskan dari kuasa atau kendali Midian.
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung, sesuai bentuk nama perjanjian dalam teks Ibrani.
- source_word: וַיִּפֶן אֵלָיו
  choice: berpaling kepadanya
  rationale: Mempertahankan tindakan naratif ‘berpaling/berbalik ke arah’ tanpa membatasinya hanya pada tindakan melihat.
- source_word: לֵךְ
  choice: Pergilah
  rationale: Bentuk imperatif langsung yang alami dan bermartabat dalam bahasa Indonesia.
- source_word: בְּכֹחֲךָ זֶה
  choice: dengan kekuatanmu yang ini
  rationale: ‘Dengan’ menyampaikan kemungkinan fungsi instrumental dari prefiks ב, sedangkan ‘yang ini’ mempertahankan penekanan demonstratif זֶה. Karena susunannya terasa bertanda dalam bahasa Indonesia, alternatif yang lebih lokatif dijelaskan dalam catatan kaki.
- source_word: וְהוֹשַׁעְתָּ
  choice: dan selamatkanlah
  rationale: Dalam rangkaian sesudah imperatif לֵךְ, bentuk ini paling alami dipahami sebagai kelanjutan perintah atau penugasan.
- source_word: מִכַּף מִדְיָן
  choice: dari tangan Midian
  rationale: Mempertahankan metafora Ibrani ‘tangan’ untuk kuasa atau kendali, yang tetap dapat dipahami dalam bahasa Indonesia.
- source_word: הֲלֹא שְׁלַחְתִּיךָ
  choice: Bukankah Aku yang mengutusmu?
  rationale: Mempertahankan pertanyaan retoris yang mengharapkan jawaban ya; ‘Aku yang’ menegaskan bahwa pengutusnya ialah Yahweh tanpa mengubahnya menjadi pernyataan biasa.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; ‘Yahweh’ mempertahankan nama diri ilahi tanpa menggantinya dengan gelar.
- issue: Sumber kekuatan Gideon dalam בְּכֹחֲךָ זֶה
  choice: kekuatanmu yang ini
  alternative: kekuatan ini atau kekuatan yang Kuberikan kepadamu
  rationale: Teks secara eksplisit memakai sufiks orang kedua ‘-mu’ dan demonstratif ‘ini’, tetapi tidak menjelaskan apakah kekuatan itu bersifat alamiah, baru dinyatakan, atau dianugerahkan. Terjemahan tidak menyelesaikan ketegangan teologis itu secara diam-diam.
- issue: Daya pertanyaan הֲלֹא שְׁלַחְתִּיךָ
  choice: Bukankah Aku yang mengutusmu?
  alternative: Aku mengutusmu!
  rationale: Bentuk pertanyaan retoris dipertahankan karena menegaskan jaminan pengutusan tanpa menghapus bentuk dialogis teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Partikel imperatif ‘-lah’ dipakai untuk menyampaikan perintah secara alami. Huruf kapital pada ‘Aku’ mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia untuk rujukan ilahi, sedangkan pronomina terikat ‘-mu’ tetap mengikuti ejaan normal.
