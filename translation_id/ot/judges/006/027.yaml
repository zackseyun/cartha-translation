  text: וַ/יִּקַּ֨ח גִּדְע֜וֹן עֲשָׂרָ֤ה אֲנָשִׁים֙ מֵֽ/עֲבָדָ֔י/ו וַ/יַּ֕עַשׂ כַּ/אֲשֶׁ֛ר דִּבֶּ֥ר אֵלָ֖י/ו יְהוָ֑ה וַ/יְהִ֡י כַּ/אֲשֶׁ֣ר יָרֵא֩ אֶת בֵּ֨ית אָבִ֜י/ו וְ/אֶת אַנְשֵׁ֥י הָ/עִ֛יר מֵ/עֲשׂ֥וֹת יוֹמָ֖ם וַ/יַּ֥עַשׂ לָֽיְלָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/027.yaml
  text: So Gideon took ten men from among his servants and did as Yahweh had spoken to him. But because he feared his father's household and the men of the city too much to do it by day[a], he did it at night.
translation:
  language: id
  text: Lalu Gideon mengambil sepuluh orang laki-laki dari antara hamba-hambanya dan melakukan seperti yang difirmankan Yahweh kepadanya. Namun, karena ia takut kepada seisi rumah ayahnya dan para lelaki kota itu sehingga tidak berani melakukannya pada siang hari,[a] ia melakukannya pada malam hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “karena ia takut kepada seisi rumah ayahnya dan para lelaki kota itu untuk melakukannya pada siang hari.” Maksudnya, rasa takut itu membuatnya tidak melakukannya pada siang hari.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: mengambil
  rationale: Makna dasar לָקַח dalam narasi adalah ‘mengambil’; bentuk ini langsung dan alami dalam konteks.
- source_word: עֲשָׂרָה אֲנָשִׁים
  choice: sepuluh orang
  rationale: Dalam bahasa Indonesia, ‘sepuluh orang’ merupakan ungkapan alami untuk sekelompok laki-laki; konteks dan bentuk Ibrani menunjukkan bahwa mereka laki-laki tanpa perlu menambahkan kata yang terasa kaku.
- source_word: מֵעֲבָדָיו
  choice: dari antara hamba-hambanya
  rationale: ‘Dari antara’ mencerminkan fungsi partitif מִן. עֶבֶד dapat berarti hamba atau budak; konteks ini tidak menekankan status perbudakan, sehingga ‘hamba’ dipilih.
- source_word: וַיַּעַשׂ כַּאֲשֶׁר דִּבֶּר אֵלָיו יְהוָה
  choice: melakukan seperti yang difirmankan Yahweh kepadanya
  rationale: ‘Seperti yang’ mempertahankan kesesuaian antara perintah ilahi dan tindakan Gideon, sedangkan ‘difirmankan’ merupakan padanan Indonesia yang wajar dan bermartabat bagi perkataan Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks sumber dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Namun, karena
  rationale: Konstruksi ini memperkenalkan keadaan yang menjelaskan mengapa Gideon bertindak pada malam hari; ‘Namun, karena’ menyampaikan peralihan naratif dan hubungan sebab secara alami.
- source_word: יָרֵא
  choice: takut kepada
  rationale: Dalam konteks ini יָרֵא menyatakan ketakutan Gideon terhadap kelompok-kelompok manusia tertentu.
- source_word: בֵּית אָבִיו
  choice: seisi rumah ayahnya
  rationale: Ungkapan ini menunjuk pada rumah tangga atau kelompok keluarga di bawah ayah Gideon, bukan sekadar bangunan; ‘seisi rumah’ mempertahankan nuansa sosial tersebut.
- source_word: אַנְשֵׁי הָעִיר
  choice: orang-orang kota itu
  rationale: Padanan ini alami dalam bahasa Indonesia dan tetap menunjuk para anggota laki-laki masyarakat kota yang disebut teks.
- source_word: מֵעֲשׂוֹת יוֹמָם
  choice: sehingga tidak berani melakukannya pada siang hari
  rationale: מִן dengan infinitif sesudah verba takut menyatakan pencegahan atau keengganan. Terjemahan ini menjelaskan bahwa rasa takut menghalangi tindakan pada siang hari tanpa mengubah maksud teks.
- source_word: וַיַּעַשׂ לָיְלָה
  choice: ia melakukannya pada malam hari
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kontras dengan ‘pada siang hari’.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. ‘Yahweh’ mempertahankan nama ilahi dan menghindari penggantian nama itu dengan sebuah gelar.
- issue: Objek ketakutan Gideon
  choice: seisi rumah ayahnya dan orang-orang kota itu
  alternative: rumah ayahnya dan penduduk kota itu
  rationale: Pilihan ini mempertahankan dua kelompok sosial yang disebut teks dan tidak menafsirkan ‘rumah’ sebagai bangunan fisik semata.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang jelas dan bermartabat. Kalimat mempertahankan urutan tindakan dan alasan dalam bahasa Ibrani, sambil mengungkapkan fungsi idiomatis מֵעֲשׂוֹת secara alami. Penanda catatan kaki [a] dicantumkan dalam teks utama.
