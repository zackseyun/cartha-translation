  naturalness: ‘Membela perkara Baal’ dan ‘membela perkaranya’ dapat dipahami, tetapi kurang idiomatis dalam bahasa Indonesia baku modern. ‘Membela Baal’ / ‘membelanya’ lebih alami dan tetap mempertahankan pengulangan retoris.
