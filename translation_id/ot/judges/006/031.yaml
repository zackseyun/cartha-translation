source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יוֹאָ֡שׁ לְ/כֹל֩ אֲשֶׁר עָמְד֨וּ עָלָ֜י/ו הַ/אַתֶּ֣ם תְּרִיב֣וּ/ן לַ/בַּ֗עַל אִם אַתֶּם֙ תּוֹשִׁיע֣וּ/ן אוֹת֔/וֹ אֲשֶׁ֨ר יָרִ֥יב ל֛/וֹ יוּמַ֖ת עַד הַ/בֹּ֑קֶר אִם אֱלֹהִ֥ים הוּא֙ יָ֣רֶב ל֔/וֹ כִּ֥י נָתַ֖ץ אֶֽת מִזְבְּחֽ/וֹ־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/031.yaml
  text: But Joash said to all who stood against him[a], “Will you contend for Baal? Will you save him? Whoever contends for him shall be put to death by morning. If he is a god, let him contend for himself, because his altar has been torn down.”
translation:
  language: id
  text: Namun, Yoas berkata kepada semua orang yang menentangnya[a], “Apakah kalian hendak membela Baal? Apakah kalian hendak menyelamatkannya? Siapa pun yang membelanya harus dihukum mati sebelum pagi. Jika ia ilah, biarlah ia membela dirinya sendiri, karena mazbahnya telah dirobohkan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang berdiri di hadapannya.” Ungkapan Ibrani ini secara harfiah dapat menggambarkan posisi terhadap Yoas, tetapi konteks menunjukkan bahwa mereka sedang menentangnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָמְדוּ עָלָיו
  choice: yang menentangnya
  rationale: Dalam konteks ini orang-orang itu menghadapi Yoas dan menuntut kematian Gideon; ungkapan tersebut bersifat adversatif, bukan sekadar menunjukkan posisi fisik.
- source_word: תְּרִיבוּן / יָרִיב / יָרֶב
  choice: membela perkara / membela perkaranya
  rationale: Akar ריב diulang sebagai unsur retoris dan dapat mencakup perselisihan hukum maupun pertikaian. Ungkapan 'membela perkara' mempertahankan nuansa tersebut sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: תּוֹשִׁיעוּן
  choice: menyelamatkan
  rationale: 'Padanan langsung bentuk Hifil ישׁע ini mempertahankan ironi pertanyaan: apakah manusia perlu menyelamatkan dewa mereka?'
- source_word: אֲשֶׁר יָרִיב לוֹ
  choice: Siapa pun yang membela perkaranya
  rationale: Klausa relatif tak tentu ini menyatakan ketentuan umum; 'siapa pun' menyampaikan daya cakupnya dengan jelas.
- source_word: יוּמַת
  choice: harus dihukum mati
  rationale: Bentuk Hofal menyatakan tindakan kausatif-pasif, sehingga bukan sekadar 'akan mati', melainkan dibuat mati atau dihukum mati.
- source_word: עַד הַבֹּקֶר
  choice: sebelum pagi
  rationale: Dalam ancaman ini frasa tersebut paling wajar dipahami sebagai batas waktu menuju pagi yang akan datang. 'Sebelum pagi' mempertahankan tenggat itu tanpa menyiratkan secara kaku bahwa tindakan terjadi tepat pada pagi hari.
- source_word: אֱלֹהִים הוּא
  choice: ia memang ilah
  rationale: אֱלֹהִים merujuk kepada Baal sebagai sosok yang diklaim ilahi, bukan kepada Allah Israel. 'Ilah' menyampaikan kategori dewa dan 'memang' memberi tekanan kondisional yang alami.
- source_word: כִּי נָתַץ אֶת מִזְבְּחוֹ
  choice: karena mazbahnya telah dirobohkan
  rationale: Verba maskulin tunggal tidak menyebut subjek secara eksplisit. Bentuk pasif Indonesia mempertahankan fokus pada perobohan mazbah tanpa menambahkan 'seseorang' atau secara tegas menetapkan Gideon sebagai subjek.
- source_word: וַיֹּאמֶר
  choice: Namun Yoas berkata
  rationale: Waw naratif di sini mengantar jawaban Yoas yang berlawanan dengan tuntutan orang-orang itu; 'namun' menyatakan peralihan kontrastif tersebut secara alami.
theological_decisions:
- issue: Rujukan אֱלֹהִים kepada Baal
  choice: Diterjemahkan 'ilah', bukan 'Allah'
  alternative: Jika ia adalah Allah, biarlah ia membela perkaranya sendiri
  rationale: Yoas sedang menguji klaim keilahian Baal, bukan mengidentifikasikan Baal dengan Allah Israel. 'Ilah' menjaga makna kategoris tersebut tanpa mengesahkan klaim itu.
- issue: Subjek tersirat dalam כִּי נָתַץ אֶת מִזְבְּחוֹ
  choice: Mazbahnya telah dirobohkan
  alternative: karena ia telah merobohkan mazbahnya
  rationale: Bahasa Ibrani memuat verba orang ketiga maskulin tunggal tanpa nomina subjek. Terjemahan utama tidak menetapkan identitas subjek, sedangkan kemungkinan bahwa Gideon adalah subjek dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Sapaan jamak 'kalian' dipakai karena Yoas berbicara langsung kepada sekelompok orang. 'Mazbah' dipertahankan sebagai istilah Alkitab yang lazim, sedangkan 'membela perkara' menjaga pengulangan akar ריב dan nuansa hukum-konfrontatifnya.
