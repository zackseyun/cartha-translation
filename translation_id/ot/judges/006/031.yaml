  to: Namun, Yoas berkata kepada semua orang yang menentangnya[a], “Apakah kalian hendak membela Baal? Apakah kalian hendak menyelamatkannya? Siapa pun yang membelanya harus dihukum mati sebelum pagi. Jika ia ilah, biarlah ia membela dirinya sendiri, karena mazbahnya telah dirobohkan.”
