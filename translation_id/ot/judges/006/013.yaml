id: JDG.6.13
reference: Judges 6:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֤י/ו גִּדְעוֹן֙ בִּ֣י אֲדֹנִ֔/י וְ/יֵ֤שׁ יְהוָה֙ עִמָּ֔/נוּ וְ/לָ֥/מָּה מְצָאַ֖תְ/נוּ כָּל זֹ֑את וְ/אַיֵּ֣ה כָֽל נִפְלְאֹתָ֡י/ו אֲשֶׁר֩ סִפְּרוּ לָ֨/נוּ אֲבוֹתֵ֜י/נוּ לֵ/אמֹ֗ר הֲ/לֹ֤א מִ/מִּצְרַ֨יִם֙ הֶעֱלָ֣/נוּ יְהוָ֔ה וְ/עַתָּה֙ נְטָשָׁ֣/נוּ יְהוָ֔ה וַֽ/יִּתְּנֵ֖/נוּ בְּ/כַף מִדְיָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/013.yaml
  text: Gideon said to him[a], “Please, my lord, if Yahweh is with us, why then has all this happened to us? And where are all his wonders that our fathers told us about, saying[c][b], ‘Did not Yahweh bring us up from Egypt?’ But now Yahweh has abandoned us and given us into the hand of Midian.”
translation:
  language: id
  text: Gideon berkata kepadanya, “Mohon, Tuanku,[a] jika Yahweh menyertai kami, mengapa semua ini menimpa kami? Di manakah segala perbuatan-Nya yang menakjubkan[b] yang diceritakan leluhur kami kepada kami? Mereka berkata, ‘Bukankah Yahweh membawa kita keluar dari Mesir?’ Namun sekarang Yahweh telah meninggalkan kami dan menyerahkan kami ke dalam kuasa Midian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Maaf, Tuanku.” Ungkapan Ibrani ini merupakan bentuk sapaan dan permohonan yang sopan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “segala keajaiban-Nya” atau “segala mukjizat-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: Mohon, Tuanku
  rationale: בִּי adalah seruan permohonan yang sopan, sedangkan אֲדֹנִי merupakan sapaan hormat kepada sosok yang diajak bicara. Bentuk ini mempertahankan kesantunan tanpa memastikan bahwa sapaan tersebut adalah gelar ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai Yahweh, bukan diganti dengan gelar.
- source_word: וְיֵשׁ יְהוָה עִמָּנוּ
  choice: jika Yahweh menyertai kami
  rationale: Walaupun bentuk harfiahnya menyerupai 'dan Yahweh ada bersama kami', dalam pertanyaan retoris Gideon frasa ini berfungsi sebagai premis bersyarat.
- source_word: לָמָּה מְצָאַתְנוּ כָּל זֹאת
  choice: mengapa semua ini menimpa kami?
  rationale: מצא dengan malapetaka sebagai subjek bermakna menimpa atau terjadi atas seseorang; 'menimpa' alami dan tetap mempertahankan citra kesusahan yang datang atas mereka.
- source_word: נִפְלְאֹתָיו
  choice: perbuatan-Nya yang menakjubkan
  rationale: Kata ini menunjuk pada tindakan luar biasa yang membangkitkan rasa takjub. Pilihan ini lebih alami dalam bahasa Indonesia daripada sekadar 'keajaiban-Nya' dan tidak mempersempit maknanya hanya menjadi mukjizat.
- source_word: אֲבוֹתֵינוּ
  choice: leluhur kami
  rationale: Dalam konteks pewarisan kisah Israel, 'leluhur' menyampaikan para pendahulu bangsa secara wajar dalam bahasa Indonesia modern.
- source_word: הֲלֹא מִמִּצְרַיִם הֶעֱלָנוּ יְהוָה
  choice: Bukankah Yahweh membawa kita keluar dari Mesir?
  rationale: Partikel tanya mengharapkan jawaban positif. 'Membawa keluar' menyampaikan peristiwa eksodus secara alami; pergantian ke 'kita' cocok dengan kutipan tradisi kolektif yang mencakup penutur dan pendengar.
- source_word: נְטָשָׁנוּ
  choice: telah meninggalkan kami
  rationale: נטש menyatakan tindakan meninggalkan atau menelantarkan. 'Meninggalkan' jelas, modern, dan mempertahankan kekuatan keluhan Gideon.
- source_word: וַיִּתְּנֵנוּ בְּכַף מִדְיָן
  choice: menyerahkan kami ke dalam kuasa Midian
  rationale: Ungkapan harfiah 'ke dalam tangan Midian' merupakan idiom untuk berada di bawah kuasa Midian. Terjemahan maknawi ini lebih alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama pribadi.
- issue: Rujukan אֲדֹנִי dalam sapaan Gideon
  choice: sapaan hormat manusiawi, 'Tuanku'
  alternative: gelar ilahi, 'Tuhan'
  rationale: Pada tahap percakapan ini, klausa tersebut tidak dengan sendirinya mengharuskan pembaca menganggap sapaan itu gelar ilahi. 'Tuanku' mempertahankan kesopanan sekaligus ambiguitas naratif.
- issue: Keluhan Gideon bahwa Yahweh meninggalkan Israel
  choice: dipertahankan sebagai pernyataan langsung Gideon
  alternative: dilunakkan menjadi kesan subjektif, misalnya 'seolah-olah meninggalkan kami'
  rationale: Teks menyajikan keluhan Gideon tanpa pelemahan. Terjemahan tidak boleh menyelesaikan ketegangan teologis antara penyertaan Yahweh dan pengalaman penderitaan Israel.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Mohon, Tuanku' mempertahankan kesantunan kuno tanpa terasa sangat arkais. Idiom Ibrani 'ke dalam tangan Midian' diterjemahkan menurut maknanya menjadi 'ke dalam kuasa Midian' agar langsung dipahami pembaca umum.
