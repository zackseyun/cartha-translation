base_translation:
  language: en
  yaml_path: translation/ot/judges/006/030.yaml
  text: Then the men of the city said to Joash[a], “Bring out your son, that he may die, because he has torn down the altar of Baal and cut down the Asherah that was beside it.”
translation:
  language: id
  text: Lalu para lelaki kota itu berkata kepada Yoas, “Bawalah anakmu keluar supaya ia mati, sebab ia telah merobohkan mazbah Baal dan menebang Asyera[a] yang ada di sampingnya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tiang Asyera.” Istilah Ibrani ini dapat menunjuk kepada benda pemujaan yang dikaitkan dengan Asyera; dalam konteks ini, tindakan menebangnya menunjukkan bahwa yang dimaksud adalah benda tersebut, bukan sang dewi.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי הָעִיר
  choice: orang-orang kota itu
  rationale: Ungkapan ini secara harfiah berarti ‘orang-orang lelaki kota itu’. Dalam konteks tindakan bersama warga laki-laki kota, ‘orang-orang kota itu’ terdengar alami dalam bahasa Indonesia dan tidak memperluas rujukan menjadi seluruh penduduk.
- source_word: הוֹצֵא
  choice: Bawalah ... keluar
  rationale: Bentuk imperatif kausatif dari יצא menuntut Yoas membuat anaknya keluar; susunan ini alami dan mempertahankan perintah langsung.
- source_word: וְיָמֹת
  choice: supaya ia mati
  rationale: Konjungsi dengan bentuk yusif menyatakan hasil atau tujuan yang dituntut. Terjemahan ini mempertahankan kata ‘mati’ tanpa menambahkan prosedur hukum yang tidak dinyatakan secara eksplisit.
- source_word: נָתַץ
  choice: merobohkan
  rationale: Kata ini lazim dipakai untuk penghancuran atau perobohan bangunan; ‘merobohkan’ tepat untuk sebuah mazbah.
- source_word: מִזְבַּח הַבַּעַל
  choice: mazbah Baal
  rationale: Hubungan konstruksi menyatakan mazbah milik atau diperuntukkan bagi Baal. ‘Mazbah Baal’ ringkas, jelas, dan sesuai ragam Alkitab Indonesia.
- source_word: כָרַת
  choice: menebang
  rationale: Dalam kaitan dengan benda kultis dari kayu atau pohon, kata ini secara alami berarti ‘menebang’.
- source_word: הָאֲשֵׁרָה
  choice: Asyera
  rationale: Istilah Ibrani dapat menunjuk kepada dewi Asyera atau benda kultis yang dikaitkan dengannya. Verba ‘menebang’ menunjukkan bahwa di sini yang dimaksud kemungkinan besar benda kultis, tetapi nama istilah dipertahankan agar ambiguitas leksikal tidak dihapus.
- source_word: אֲשֶׁר עָלָיו
  choice: yang ada di sampingnya
  rationale: Preposisi על dapat berarti ‘di atas’, ‘pada’, atau ‘di dekat’. Dalam tata letak tempat pemujaan ini, ‘di sampingnya’ paling wajar, sedangkan ‘di atasnya’ dapat keliru menyiratkan bahwa Asyera berdiri di atas mazbah.
theological_decisions:
- issue: Rujukan אֲשֵׁרָה dalam konteks pemujaan Baal
  choice: Asyera
  alternative: tiang Asyera; dewi Asyera
  rationale: Konteks dan verba ‘menebang’ menunjuk kepada benda kultis, tetapi kata Ibrani sendiri tidak secara eksplisit menyebut bentuknya sebagai tiang. Mempertahankan ‘Asyera’ dalam teks dan menjelaskannya dalam catatan kaki menjaga kekhususan agama serta ambiguitas sumber.
- issue: Daya tuntutan וְיָמֹת
  choice: supaya ia mati
  alternative: biarlah ia mati; ia harus dihukum mati
  rationale: Bentuk ini menyampaikan tujuan atau hasil yang dituntut setelah perintah untuk membawa Gideon keluar, tanpa mengubahnya menjadi rumusan hukum formal yang lebih eksplisit daripada teks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Mazbah’ dipertahankan sebagai istilah keagamaan yang mapan; struktur kalimat dibuat langsung dan mudah dipahami. Penanda catatan kaki ditempatkan tepat sesudah ‘Asyera’.
