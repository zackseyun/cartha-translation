base_translation:
  language: en
  yaml_path: translation/ot/judges/006/033.yaml
  text: Then all Midian and Amalek and the people of the East gathered together[a], crossed over, and camped in the Valley of Jezreel.
translation:
  language: id
  text: Lalu seluruh Midian, Amalek, dan orang-orang dari Timur[a] berkumpul bersama-sama, menyeberang, lalu berkemah di Lembah Yizreel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Timur”, ungkapan Ibrani untuk bangsa-bangsa dari wilayah timur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל מִדְיָן
  choice: seluruh Midian
  rationale: Mempertahankan nama etnis yang dipakai secara kolektif dalam bahasa Ibrani. Bentuk ini lebih dekat dengan sumber daripada memperluasnya menjadi 'semua orang Midian'.
- source_word: וַ/עֲמָלֵק
  choice: Amalek
  rationale: Nama etnis ini berfungsi secara kolektif, sejajar dengan 'Midian'; tidak perlu diperluas menjadi 'orang Amalek'.
- source_word: וּ/בְנֵי קֶדֶם
  choice: orang-orang dari Timur
  rationale: Secara harfiah berarti 'anak-anak Timur', sebuah ungkapan Ibrani bagi kelompok-kelompok yang berasal dari wilayah timur. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan cakupan kolektif-geografisnya.
- source_word: נֶאֶסְפוּ יַחְדָּו
  choice: berkumpul
  rationale: Kata kerja bentuk Niphal bersama יַחְדָּו menyatakan bahwa kelompok-kelompok itu berhimpun bersama. 'Berkumpul' menyampaikan makna tersebut secara wajar tanpa pengulangan yang tidak perlu.
- source_word: וַ/יַּעַבְרוּ
  choice: menyeberang
  rationale: Menerjemahkan makna umum עבר, sementara objek atau batas yang diseberangi tetap tidak disebutkan sebagaimana dalam teks Ibrani.
- source_word: וַֽ/יַּחֲנוּ
  choice: berkemah
  rationale: Dalam konteks pergerakan pasukan, חנה berarti mendirikan perkemahan atau berkemah.
- source_word: בְּ/עֵמֶק יִזְרְעֶאל
  choice: di Lembah Yizreel
  rationale: עֵמֶק berarti lembah atau dataran rendah. 'Lembah Yizreel' merupakan padanan geografis yang jelas dan alami; ejaan 'Yizreel' cukup dekat dengan bentuk Ibrani יִזְרְעֶאל.
