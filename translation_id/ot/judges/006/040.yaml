translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Tanda titik dua mempertahankan hubungan hasil/penjelasan antara tindakan Allah dan keadaan guntingan bulu serta tanah, sementara 'sedangkan' mengungkapkan kontras yang tersirat dalam susunan Ibrani.
