  yaml_path: translation/ot/judges/006/040.yaml
  text: And God did so that night[a], and there was dryness on the fleece alone, and on all the ground there was dew.
translation:
  language: id
  text: Allah melakukan demikian pada malam itu, dan hanya bulu domba itu yang kering, sedangkan di seluruh tanah ada embun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di seluruh negeri ada embun.” Kata Ibrani אֶרֶץ dapat berarti “tanah”, “negeri”, atau “bumi”; dalam konteks tanda Gideon ini, “tanah” paling sesuai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ אֱלֹהִים כֵּן
  choice: Allah melakukan demikian
  rationale: Ungkapan ini menunjuk kembali pada tanda yang diminta Gideon. 'Melakukan demikian' mempertahankan gaya naratif yang ringkas dan hubungan anaforis כֵּן.
- source_word: בַּלַּיְלָה הַהוּא
  choice: pada malam itu
  rationale: Padanan waktu yang alami dan tetap mempertahankan kekhususan malam yang dimaksud.
- source_word: חֹרֶב אֶל הַגִּזָּה לְבַדָּהּ
  choice: hanya guntingan bulu itu yang kering
  rationale: חֹרֶב secara harfiah menyatakan keadaan kering, tetapi konstruksi predikatif ini lebih alami dalam bahasa Indonesia sebagai 'yang kering'. גִּזָּה adalah bulu domba yang telah digunting; 'guntingan bulu' lebih tepat daripada sekadar 'bulu'.
- source_word: וְעַל כָּל הָאָרֶץ הָיָה טָל
  choice: sedangkan seluruh tanah di sekelilingnya berembun
  rationale: Klausa ini menyatakan kontras dengan guntingan bulu. Dalam konteks tanda setempat, אֶרֶץ menunjuk pada tanah sekitar, dan konstruksi 'berembun' menyampaikan adanya embun secara wajar.
