base_translation:
  language: en
  yaml_path: translation/ot/judges/006/024.yaml
  text: Then Gideon built an altar there to Yahweh and called it[a], “Yahweh Is Peace.” It remains there to this day in Ophrah of the Abiezrites.
translation:
  language: id
  text: Lalu Gideon membangun sebuah mazbah di sana bagi Yahweh dan menamainya[a] “Yahweh adalah damai.” Mazbah itu masih ada sampai hari ini di Ofra milik kaum Abiezer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “YHWH šālôm”; sering ditransliterasikan “Yahweh-shalom.”'
    reason: Menjelaskan bentuk Ibrani nama mazbah dan memberikan bentuk transliterasinya tanpa menggantikan terjemahan maknanya dalam teks utama.
lexical_decisions:
- source_word: וַיִּבֶן
  choice: membangun
  rationale: Padanan naratif yang lazim bagi בנה ketika objeknya adalah mazbah.
- source_word: מִזְבֵּחַ
  choice: mazbah
  rationale: Istilah baku dan bermartabat dalam bahasa Indonesia untuk tempat persembahan korban.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menandai peruntukan atau pengabdian mazbah itu kepada Yahweh.
- source_word: וַיִּקְרָא לוֹ
  choice: menamainya
  rationale: Dalam konteks ini קרא + ל menyatakan pemberian nama kepada mazbah, bukan seruan kepadanya.
- source_word: יְהוָה שָׁלוֹם
  choice: Yahweh Adalah Damai
  rationale: Menerjemahkan formula nama Ibrani yang tanpa kopula dengan memasukkan 'adalah' agar alami dan jelas dalam bahasa Indonesia.
- source_word: שָׁלוֹם
  choice: damai
  rationale: Padanan ringkas dan alami dalam formula nama, sambil tetap membawa nuansa kesejahteraan dan keutuhan.
- source_word: עַד הַיּוֹם הַזֶּה עוֹדֶנּוּ
  choice: Mazbah itu masih ada sampai hari ini
  rationale: Mengungkapkan secara alami keberadaan yang berlanjut hingga masa narator; subjek diulangi demi kejelasan.
- source_word: בְּעָפְרָת אֲבִי הָעֶזְרִי
  choice: di Ofra milik kaum Abiezer
  rationale: Bentuk gentilik menunjuk pada Ofra yang terkait dengan kelompok keturunan Abiezer; 'milik kaum Abiezer' alami sebagai pembeda geografis.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה dalam peruntukan mazbah dan nama mazbah
  choice: Yahweh / Yahweh Adalah Damai
  alternative: TUHAN / TUHAN adalah damai; Yahweh-Syalom
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung. Transliterasi 'Yahweh' mempertahankan nama tersebut, sedangkan penerjemahan שָׁלוֹם menyampaikan makna nama mazbah.
- issue: Sifat pernyataan יְהוָה שָׁלוֹם
  choice: 'Mempertahankannya sebagai nama mazbah sekaligus pernyataan teologis: “Yahweh Adalah Damai”'
  alternative: Yahweh-Syalom; Yahweh Memberi Damai
  rationale: Konstruksi Ibrani bersifat nominal dan tidak memuat kata kerja 'memberi'; karena itu terjemahan tidak mempersempitnya menjadi tindakan pemberian damai.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Mazbah' dipertahankan sebagai istilah kultis yang mapan; 'kaum Abiezer' memperjelas sebutan klan. Penanda catatan kaki [a] ditempatkan tepat sesudah verba penamaan.
