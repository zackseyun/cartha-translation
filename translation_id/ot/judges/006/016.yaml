base_translation:
  language: en
  yaml_path: translation/ot/judges/006/016.yaml
  text: And Yahweh said to him[a], “Surely I will be with you, and you will strike Midian as one man.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepadanya, “Sungguh, Aku akan menyertai engkau, dan engkau akan mengalahkan Midian seolah-olah Midian hanya satu orang.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seperti satu orang.” Ungkapan Ibrani ini menyatakan bahwa Midian akan dikalahkan seolah-olah hanya menghadapi satu orang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו
  choice: Lalu ... berfirman kepadanya
  rationale: Waw-konsekutif melanjutkan alur cerita. Dalam konteks perkataan ilahi, “berfirman” merupakan padanan Indonesia yang wajar dan bermartabat bagi אמר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה dan tidak menggantinya dengan gelar.
- source_word: כִּי
  choice: Sungguh
  rationale: Di sini כִּי menguatkan jaminan yang menjadi dasar kemenangan Gideon; “Sungguh” menyampaikan daya penegasan itu secara alami.
- source_word: אֶהְיֶה עִמָּךְ
  choice: Aku akan menyertai engkau
  rationale: Bentuk imperfek היה menyatakan janji dalam konteks ini. “Menyertai” merupakan ungkapan Indonesia yang alami untuk kehadiran yang dijanjikan.
- source_word: וְהִכִּיתָ
  choice: dan engkau akan mengalahkan
  rationale: Bentuk ini menyatakan hasil pada masa mendatang. נכה secara harfiah berkaitan dengan tindakan memukul, tetapi dalam konteks perang “mengalahkan” menyampaikan maksudnya secara jelas dan alami.
- source_word: אֶת מִדְיָן
  choice: Midian
  rationale: Mempertahankan nama kolektif tunggal dalam teks Ibrani, bukan menggantinya langsung dengan “orang Midian.”
- source_word: כְּאִישׁ אֶחָד
  choice: seolah-olah mereka hanya satu orang
  rationale: 'Mengungkapkan idiom Ibrani secara alami dalam bahasa Indonesia sambil mempertahankan gambaran satu orang: seluruh Midian akan dikalahkan semudah mengalahkan satu orang.'
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Jehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri; “Yahweh” mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Daya idiom כְּאִישׁ אֶחָד
  choice: seolah-olah mereka hanya satu orang
  alternative: seperti satu orang; sebagai satu orang
  rationale: Pilihan ini mempertahankan perbandingan dalam bahasa sumber dan gambaran maskulin tunggal, tanpa mengubahnya menjadi pernyataan teologis tentang gender. Catatan kaki mencatat bentuk yang lebih harfiah serta kemungkinan nuansanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Engkau” dipakai dalam sapaan langsung ilahi kepada Gideon; struktur kalimat tetap dekat dengan urutan teks Ibrani tanpa menjadi kaku.
