  yaml_path: translation/ot/judges/006/032.yaml
  text: So on that day he called him Jerubbaal[a], saying, “Let Baal contend against him[b], because he tore down his altar.”
translation:
  language: id
  text: Maka pada hari itu ia menamai dia Yerubaal[a], katanya, “Biarlah Baal berperkara melawan dia[b], sebab dia telah merobohkan mazbah Baal.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Yerubaal berkaitan dengan kata kerja Ibrani yang berarti “berperkara” atau “bersengketa”; penjelasannya ialah, “Biarlah Baal berperkara melawan dia.”
    reason: lexical_alternative
  - marker: b
    text: 'Atau “Semoga Baal berperkara melawan dia.” Kata kerja Ibraninya dapat dipahami sebagai harapan. Sebagian memahaminya sebagai pernyataan: “Baal akan berperkara melawan dia.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא לוֹ
  choice: ia menamai dia
  rationale: Konstruksi קרא dengan ל dapat berarti memberi nama. Bentuk tunggal subjek dipertahankan tanpa menentukan siapa yang dimaksud, sesuai ketidakjelasan dalam teks Ibrani.
- source_word: בַיּוֹם הַהוּא
  choice: pada hari itu
  rationale: Padanan temporal langsung dan wajar dalam bahasa Indonesia.
- source_word: יְרֻבַּעַל
  choice: Yerubaal
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim bagi pembaca Alkitab berbahasa Indonesia; permainan katanya dengan ריב dijelaskan melalui klausa berikut dan catatan kaki.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Ungkapan pengantar kutipan yang alami dalam narasi Indonesia dan tetap mencerminkan fungsi לאמר.
- source_word: יָרֶב בּוֹ הַבַּעַל
  choice: Biarlah Baal berbantah dengan dia
  rationale: Bentuk jussif diterjemahkan dengan 'Biarlah'. 'Berbantah dengan' mempertahankan arti adversatif yang luas dari ריב serta kaitan bunyinya dengan Yerubaal, tanpa mempersempitnya menjadi perkelahian fisik.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi penamaan atau perkataan tersebut dengan gaya naratif yang wajar dan bermartabat.
- source_word: נָתַץ
  choice: telah merobohkan
  rationale: נתץ menunjuk pada tindakan meruntuhkan bangunan atau mazbah; 'merobohkan' tepat dan alami.
- source_word: אֶת מִזְבְּחוֹ
  choice: mazbah Baal
  rationale: Akhiran pronominal maskulin tunggal secara alami merujuk kepada Baal. Nama rujukannya dibuat eksplisit agar bahasa Indonesia tidak menimbulkan kerancuan mengenai pemilik mazbah.
theological_decisions:
- issue: Makna בַּעַל dalam konteks polemik terhadap penyembahan berhala
  choice: Baal
  alternative: tuan
  rationale: Di sini בַּעַל adalah nama atau gelar dewa Kanaan, bukan kata benda umum 'tuan'. Bentuk 'Baal' mencegah kerancuan dengan TUHAN.
- issue: Daya modal יָרֶב
  choice: Biarlah Baal berbantah dengan dia
  alternative: Baal akan berbantah dengan dia
  rationale: Bentuknya dapat didengar sebagai jussif atau sebagai indikatif. Teks utama memilih nuansa jussif yang cocok dengan tantangan dalam konteks, sedangkan kemungkinan indikatif dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, naratif, dan bermartabat. 'Mazbah' dipakai sebagai istilah Alkitab yang ringkas untuk altar kurban. Ketidakjelasan subjek tunggal pada awal ayat dipertahankan dengan 'ia', sementara permainan kata pada nama dijelaskan dalam catatan.
