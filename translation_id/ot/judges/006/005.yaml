base_translation:
  language: en
  yaml_path: translation/ot/judges/006/005.yaml
  text: For they and their livestock would come up[a], and their tents would come like locusts in multitude; both they and their camels were without number[c][b], and they came into the land to destroy it.
translation:
  language: id
  text: Sebab mereka dan ternak mereka biasa datang, dan kemah-kemah mereka datang seperti belalang dalam jumlah besar.[a] Mereka dan unta-unta mereka tak terhitung jumlahnya. Mereka biasa memasuki negeri itu untuk merusaknya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kemah-kemah mereka datang seperti belalang dalam jumlah besar”; “kemah-kemah” merupakan metonimia untuk perkemahan para penyerbu.
    reason: cultural_note
  - marker: b
    text: Atau “untuk menghancurkannya” atau “untuk meluluhlantakkannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan penjelasan mengenai bagaimana Israel dibuat melarat dalam konteks sebelumnya.
- source_word: הֵם וּמִקְנֵיהֶם יַעֲלוּ
  choice: mereka datang menyerbu bersama ternak ... mereka
  rationale: Bentuk imperfek menyatakan tindakan yang berulang pada masa lampau. 'Datang menyerbu' menyampaikan gerak naiknya para penyerang secara wajar dalam konteks Indonesia, sedangkan 'ternak' mencakup hewan peliharaan secara luas.
- source_word: וְאָהֳלֵיהֶם יָבֹאוּ
  choice: bersama ... kemah-kemah mereka
  rationale: Ibrani secara harfiah menjadikan kemah sebagai subjek yang datang, suatu metonimia bagi perkemahan bergerak; susunan ini mengungkapkan maksudnya dengan alami tanpa menghilangkan kemah dari gambaran.
- source_word: כְדֵי אַרְבֶּה לָרֹב
  choice: sebanyak kawanan belalang
  rationale: Menyampaikan perbandingan jumlah para penyerbu dan perkemahan mereka dengan kawanan belalang yang sangat banyak.
- source_word: וְלָהֶם וְלִגְמַלֵּיהֶם אֵין מִסְפָּר
  choice: Mereka dan unta-unta mereka tidak terhitung jumlahnya
  rationale: Mempertahankan penekanan bahwa baik orang-orang maupun unta mereka tak terbilang.
- source_word: וַיָּבֹאוּ בָאָרֶץ
  choice: Mereka memasuki negeri itu
  rationale: Padanan naratif yang alami bagi tindakan datang masuk ke wilayah tersebut.
- source_word: לְשַׁחֲתָהּ
  choice: untuk memusnahkannya
  rationale: Infinitif menyatakan tujuan serbuan; pilihan ini mempertahankan arti kuat שׁחת, sementara 'merusaknya' merupakan kemungkinan yang lebih lunak.
