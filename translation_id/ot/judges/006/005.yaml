revisions:
- from: Sebab mereka datang menyerbu bersama ternak dan kemah-kemah mereka, sebanyak kawanan belalang.[a] Mereka dan unta-unta mereka tidak terhitung jumlahnya. Mereka memasuki negeri itu untuk memusnahkannya.[b]
  to: Sebab mereka dan ternak mereka biasa datang, dan kemah-kemah mereka datang seperti belalang dalam jumlah besar.[a] Mereka dan unta-unta mereka tak terhitung jumlahnya. Mereka biasa memasuki negeri itu untuk merusaknya.[b]
  rationale: Revisi memulihkan tindakan berulang yang digambarkan oleh bentuk imperfek Ibrani, menghapus tambahan "menyerbu," dan mempertahankan kemah-kemah sebagai subjek metonimis. Padanan "merusaknya" menerjemahkan tujuan לְשַׁחֲתָהּ secara memadai tanpa menyatakan pemusnahan total yang lebih kuat daripada yang perlu.
