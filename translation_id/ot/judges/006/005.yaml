review_pass:
  verdict: revise
  source_fidelity: Draf mempertahankan unsur-unsur pokok ayat, termasuk ternak, kemah, belalang, unta, dan tujuan memasuki negeri. Namun, bentuk kebiasaan/berulang dari verba Ibrani diratakan menjadi peristiwa lampau tunggal, dan tambahan "menyerbu" tidak dinyatakan oleh verba sumber. Selain itu, kemah-kemah perlu tetap tampil sebagai subjek metonimis yang "datang".
  naturalness: Bahasa draf umumnya baku dan jelas. Revisi mempertahankan kelancaran bahasa Indonesia sambil memulihkan pola tindakan berulang dan gambaran metonimis kemah-kemah yang datang.
  terminology: '"Ternak," "kemah-kemah," "unta-unta," dan "negeri" tepat. "Merusaknya" mencakup makna שׁחת dalam konteks ini tanpa menguatkannya menjadi pemusnahan total.'
  issues:
  - severity: medium
    issue: Aspek kebiasaan/berulang dalam verba Ibrani tidak tercermin.
    rationale: יַעֲלוּ dan יָבֹאוּ berada dalam rangkaian deskripsi serangan yang berulang pada masa lampau; "datang" dan "memasuki" dalam draf terdengar sebagai satu kejadian. "Biasa datang" dan "biasa memasuki" menyampaikan daya iteratif tersebut.
  - severity: medium
    issue: '"Datang menyerbu" menambahkan cara atau maksud yang tidak dieksplisitkan dalam klausa Ibrani.'
    rationale: Konteks memang menggambarkan para penyerbu, tetapi verba יַעֲלוּ berarti "datang naik/maju". Terjemahan sebaiknya tidak memasukkan "menyerbu" sebagai bagian dari verba ayat.
  - severity: medium
    issue: Kemah-kemah tidak dipertahankan sebagai subjek dari verba "datang."
    rationale: וְאָהֳלֵיהֶם יָבֹאוּ secara harfiah menyatakan bahwa kemah-kemah mereka datang, sebagai metonimia perkemahan bergerak. Menggabungkannya sekadar sebagai barang yang dibawa mengurangi citra teks.
