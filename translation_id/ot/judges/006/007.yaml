id: JDG.6.7
reference: Judges 6:7
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֕י כִּֽי זָעֲק֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶל יְהוָ֑ה עַ֖ל אֹד֥וֹת מִדְיָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/006/007.yaml
  text: And it happened that[a], when the sons of Israel cried out to Yahweh because of Midian[b],
translation:
  language: id
  text: Maka, ketika orang Israel[a] berseru kepada Yahweh karena Midian,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Israel.”'
    reason: lexical_alternative
  - marker: b
    text: Ayat ini merupakan klausa pengantar yang berlanjut ke ayat 8.
    reason: discourse_structure
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Maka, ketika
  rationale: Gabungan ini membuka perkembangan naratif dengan klausa waktu. “Maka, ketika” mempertahankan kesinambungan cerita dan hubungan temporal tanpa memakai ungkapan Indonesia yang kaku seperti “terjadilah bahwa.”
- source_word: זָעֲקוּ
  choice: berseru
  rationale: Kata kerja ini menyatakan seruan mendesak untuk meminta pertolongan; “berseru” alami dalam konteks doa dan penderitaan.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan Ibrani harfiahnya “anak-anak Israel,” tetapi dalam konteks ini menunjuk kepada bangsa Israel secara kolektif. “Orang Israel” jelas, wajar, dan tidak membatasi rujukannya hanya kepada laki-laki.
- source_word: אֶל יְהוָה
  choice: kepada Yahweh
  rationale: אֶל menunjukkan arah seruan kepada pihak yang dituju, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh.”
- source_word: עַל אֹדוֹת מִדְיָן
  choice: karena Midian
  rationale: Ungkapan עַל אֹדוֹת menyatakan alasan atau penyebab seruan. “Karena Midian” ringkas dan idiomatis, sambil membiarkan konteks menjelaskan bahwa yang dimaksud ialah penindasan oleh Midian.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung. “Yahweh” mempertahankan pembedaan nama tersebut dari gelar umum bagi Tuhan tanpa menambahkan tafsiran denominatif.
- issue: Cakupan בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel
  rationale: Dalam konteks ini frasa tersebut merupakan sebutan kolektif bagi umat Israel, bukan pernyataan bahwa hanya putra laki-laki yang berseru. Bentuk harfiahnya tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Tanda koma akhir dipertahankan karena kalimat Ibrani berlanjut ke ayat berikutnya; catatan kaki menjelaskan struktur ini agar penggalan ayat tidak disalahpahami sebagai kalimat lengkap.
