  text: וַ/תֹּ֜אמֶר הָלֹ֧ךְ אֵלֵ֣ךְ עִמָּ֗/ךְ אֶ֚פֶס כִּי֩ לֹ֨א תִֽהְיֶ֜ה תִּֽפְאַרְתְּ/ךָ֗ עַל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר אַתָּ֣ה הוֹלֵ֔ךְ כִּ֣י בְֽ/יַד אִשָּׁ֔ה יִמְכֹּ֥ר יְהוָ֖ה אֶת סִֽיסְרָ֑א וַ/תָּ֧קָם דְּבוֹרָ֛ה וַ/תֵּ֥לֶך עִם בָּרָ֖ק קֶֽדְשָׁ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/009.yaml
  text: And she said[a], “I will surely go with you. Nevertheless, the honor will not be yours on the way that you are going, for Yahweh will sell Sisera into the hand of a woman.” Then Deborah arose and went with Barak to Kedesh.
translation:
  language: id
  text: Ia berkata, “Aku pasti akan pergi bersamamu. Namun, kehormatan tidak akan menjadi milikmu dalam perjalanan yang kautempuh, sebab Yahweh akan menjual Sisera ke tangan seorang perempuan[a].” Lalu Debora bangkit dan pergi bersama Barak ke Kedesh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau secara lebih idiomatis, “Yahweh akan menyerahkan Sisera kepada seorang perempuan.”
    reason: Alternatif ini menjelaskan idiom Ibrani “menjual ke tangan” sebagai tindakan menyerahkan seseorang ke dalam kuasa pihak lain.
lexical_decisions:
- source_word: הָלֹךְ אֵלֵךְ
  choice: Aku pasti akan pergi
  rationale: Gabungan infinitif absolut dan bentuk imperfek menegaskan tindakan. Kata “pasti” menyampaikan penekanan itu secara alami dalam bahasa Indonesia.
- source_word: עִמָּךְ
  choice: bersamamu
  rationale: Menyatakan penyertaan atau kebersamaan dengan orang kedua tunggal laki-laki.
- source_word: אֶפֶס
  choice: Namun
  rationale: Partikel ini memperkenalkan pembatasan terhadap persetujuan Debora; “namun” menyampaikan pertentangan itu dengan jelas dan wajar.
- source_word: תִּפְאַרְתְּךָ
  choice: kehormatan tidak akan menjadi milikmu
  rationale: Dalam konteks kemenangan militer, kata ini menunjuk pada kehormatan, kemasyhuran, atau pujian yang diperoleh. Rumusan ini mempertahankan gagasan bahwa Barak tidak akan mendapatkan kehormatan tersebut.
- source_word: עַל הַדֶּרֶךְ אֲשֶׁר אַתָּה הוֹלֵךְ
  choice: dalam perjalanan yang kautempuh ini
  rationale: Mempertahankan citra jalan atau perjalanan dalam bahasa sumber tanpa memastikan apakah yang dimaksud terutama perjalanan fisik atau tindakan militer yang sedang dijalankan.
- source_word: בְיַד אִשָּׁה
  choice: ke tangan seorang perempuan
  rationale: Mempertahankan citra Ibrani tentang seseorang yang diserahkan ke dalam kuasa pihak lain.
- source_word: יִמְכֹּר
  choice: akan menjual
  rationale: Makna leksikal dasarnya adalah “menjual”. Dalam konteks ini, ungkapan tersebut berarti menyerahkan musuh ke dalam kuasa seseorang; alternatif yang lebih idiomatis dicantumkan dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וַתָּקָם
  choice: bangkit
  rationale: Mempertahankan urutan naratif dan ragam bahasa yang bermartabat; dalam konteks ini juga menyiratkan bahwa Debora mulai bertindak atau berangkat.
- source_word: קֶדְשָׁה
  choice: ke Kedesh
  rationale: Akhiran penunjuk arah diterjemahkan dengan preposisi “ke”, sedangkan nama tempat ditransliterasikan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama diri ilahi dan tidak menggantinya dengan gelar.
- issue: Perempuan yang akan menerima Sisera
  choice: seorang perempuan
  alternative: perempuan itu
  rationale: Bahasa sumber memakai bentuk tak tentu dan tidak secara eksplisit mengidentifikasi perempuan tersebut pada titik ini. Terjemahan mempertahankan ketaktertentuan itu dan tidak mendahului perkembangan narasi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Bentuk “kautempuh” menjaga kelancaran ujaran langsung. Citra “menjual” dan “tangan” dipertahankan untuk kedekatan dengan bahasa sumber, sementara makna idiomatisnya diberikan dalam catatan kaki.
