  text: וַ/יַּכְנַ֤ע אֱלֹהִים֙ בַּ/יּ֣וֹם הַ/ה֔וּא אֵ֖ת יָבִ֣ין מֶֽלֶךְ כְּנָ֑עַן לִ/פְנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/023.yaml
  text: So on that day God subdued Jabin king of Canaan before the sons of Israel[a].
translation:
  language: id
  text: Maka pada hari itu Allah menundukkan Yabin, raja Kanaan, di hadapan anak-anak Israel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Israel.” Teks Ibrani berbunyi “anak-anak Israel” (secara harfiah, “putra-putra Israel”).
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכְנַע
  choice: menundukkan
  rationale: Bentuk Hifil dari כנע menyatakan tindakan membuat musuh takluk atau berada di bawah kekuasaan. “Menundukkan” alami dalam konteks kemenangan militer dan mempertahankan tindakan langsung Allah.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini אֱלֹהִים jelas menunjuk kepada Allah Israel sebagai pelaku tunggal dalam sejarah.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu
  rationale: Ungkapan ini mempertahankan penanda waktu naratif dalam bahasa Indonesia yang alami.
- source_word: יָבִין
  choice: Yabin
  rationale: Nama diri ditransliterasikan dengan bentuk Indonesia yang lazim.
- source_word: מֶלֶךְ כְּנָעַן
  choice: raja Kanaan
  rationale: Rangkaian konstruksi ini secara langsung berarti “raja Kanaan”; aposisi dipisahkan dengan koma agar hubungan dengan Yabin jelas.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Pilihan ini mempertahankan relasi yang dinyatakan teks Ibrani tanpa mempersempitnya secara tafsir menjadi sekadar “oleh” atau “di bawah kekuasaan”.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: “Bani Israel” merupakan ungkapan Indonesia yang dikenal luas dan cukup dekat dengan bentuk Ibrani “anak-anak lelaki Israel,” sekaligus menunjuk kepada umat Israel secara kolektif.
theological_decisions:
- issue: Peran Allah dalam kemenangan Israel
  choice: Allah dinyatakan sebagai subjek langsung yang menundukkan Yabin.
  alternative: Merumuskan ayat sebagai kemenangan militer Israel dengan peran Allah hanya tersirat.
  rationale: Teks Ibrani secara eksplisit menempatkan אֱלֹהִים sebagai subjek kata kerja, sehingga tindakan ilahi harus tetap menjadi pusat kalimat.
- issue: Sebutan kolektif bagi umat perjanjian
  choice: bani Israel
  alternative: orang Israel; anak-anak Israel; anak-anak lelaki Israel
  rationale: Pilihan ini menjaga nuansa ungkapan sumber yang secara harfiah berbentuk maskulin plural, tetapi tetap berfungsi sebagai sebutan kolektif yang dapat dipahami dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bermartabat. “Maka” mempertahankan kesinambungan naratif; “bani Israel” dipilih sebagai ungkapan kolektif yang dikenal, sedangkan bentuk harfiah dan alternatif yang lebih umum dijelaskan dalam catatan kaki.
