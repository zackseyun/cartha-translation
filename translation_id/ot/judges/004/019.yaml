  text: וַ/יֹּ֧אמֶר אֵלֶ֛י/הָ הַשְׁקִי/נִי נָ֥א מְעַט מַ֖יִם כִּ֣י צָמֵ֑אתִי וַ/תִּפְתַּ֞ח אֶת נֹ֧אוד הֶ/חָלָ֛ב וַ/תַּשְׁקֵ֖/הוּ וַ/תְּכַסֵּֽ/הוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/019.yaml
  text: And he said to her[a], “Please give me a little water to drink, for I am thirsty.” So she opened the skin of milk and gave him a drink and covered him.
translation:
  language: id
  text: Ia berkata kepadanya, “Tolong beri aku sedikit air untuk diminum, karena aku haus.” Maka perempuan itu membuka kantong kulit berisi susu[a], memberinya minum, lalu menutupinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wadah ini dibuat dari kulit binatang, bukan botol dalam pengertian modern.
    reason: cultural_note
lexical_decisions:
- source_word: הַשְׁקִי/נִי נָא
  choice: Tolong beri aku ... untuk diminum
  rationale: Bentuk imperatif kausatif שׁקה dengan akhiran orang pertama tunggal berarti ‘beri aku minum’, sedangkan נָא memperhalus permintaan. ‘Tolong beri aku ... untuk diminum’ alami dalam bahasa Indonesia modern dan mempertahankan kesantunan permintaan.
- source_word: מְעַט מַיִם
  choice: sedikit air
  rationale: מְעַט menunjukkan jumlah kecil; ‘sedikit air’ merupakan padanan langsung dan wajar.
- source_word: כִּי צָמֵאתִי
  choice: karena aku haus
  rationale: כִּי memperkenalkan alasan bagi permintaan. ‘Karena aku haus’ jelas, alami, dan mempertahankan hubungan sebab.
- source_word: נֹאוד הֶחָלָב
  choice: kantong kulit berisi susu
  rationale: נֹאוד adalah wadah dari kulit binatang, bukan botol modern. Frasa ‘berisi susu’ menyampaikan hubungan konstruksi Ibrani secara alami serta mempertahankan kontras antara air yang diminta dan susu yang diberikan.
- source_word: וַתַּשְׁקֵהוּ
  choice: memberinya minum
  rationale: Bentuk kausatif שׁקה berarti memberi seseorang minum. Susu tidak diulangi karena sudah jelas dari klausa sebelumnya, sebagaimana dalam teks Ibrani.
- source_word: וַתְּכַסֵּהוּ
  choice: menutupinya
  rationale: כסה berarti menutupi atau menyelubungi. ‘Menutupinya’ mempertahankan objek penutup yang tidak disebutkan dalam teks Ibrani dan tidak menambahkan gagasan pemaksaan atau benda tertentu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pronomina ‘ia’ mempertahankan bentuk naratif tanpa menambahkan nama yang tidak terdapat dalam ayat. Penanda catatan kaki ditempatkan pada ‘kantong kulit berisi susu’, yaitu unsur yang diterangkannya.
