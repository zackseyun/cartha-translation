id: JDG.4.17
reference: Judges 4:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/סִֽיסְרָא֙ נָ֣ס בְּ/רַגְלָ֔י/ו אֶל אֹ֣הֶל יָעֵ֔ל אֵ֖שֶּׁת חֶ֣בֶר הַ/קֵּינִ֑י כִּ֣י שָׁל֗וֹם בֵּ֚ין יָבִ֣ין מֶֽלֶךְ חָצ֔וֹר וּ/בֵ֕ין בֵּ֖ית חֶ֥בֶר הַ/קֵּינִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/017.yaml
  text: But Sisera fled on foot to the tent of Jael[a], the wife of Heber the Kenite[b], because there was peace between Jabin king of Hazor and the house of Heber the Kenite.
translation:
  language: id
  text: Namun, Sisera melarikan diri dengan berjalan kaki menuju kemah Yael[a], istri Heber, orang Keni itu, sebab ada hubungan damai antara Yabin, raja Hazor, dan keluarga Heber, orang Keni itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan Sisera melarikan diri dengan berjalan kaki.” Kata penghubung Ibrani dapat diterjemahkan sederhana sebagai “dan”; “namun” mencerminkan kontras dalam alur cerita.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “rumah Heber”, yaitu rumah tangga, keluarga besar, atau kelompok kerabat Heber.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/סִֽיסְרָא֙
  choice: Namun, Sisera
  rationale: Konjungsi ו dapat diterjemahkan “dan”, tetapi dalam alur ini menandai kontras dengan kekalahan pasukannya pada ayat sebelumnya. “Namun” menyampaikan peralihan naratif itu secara alami tanpa menambah gagasan baru.
- source_word: נָ֣ס
  choice: melarikan diri
  rationale: Bentuk qal dari נוס berarti melarikan diri; pilihan ini langsung, wajar, dan sesuai dengan konteks Sisera yang meninggalkan medan pertempuran.
- source_word: בְּ/רַגְלָ֔י/ו
  choice: dengan berjalan kaki
  rationale: Secara harfiah berarti “dengan kakinya”. Ungkapan Indonesia ini secara alami menyatakan bahwa Sisera melarikan diri tanpa kereta.
- source_word: אֶל אֹ֣הֶל יָעֵ֔ל
  choice: menuju kemah Yael
  rationale: Menerjemahkan frasa konstruksi Ibrani secara ringkas dan alami; אֶל menyatakan arah gerakan menuju kemah tersebut.
- source_word: אֵ֖שֶּׁת חֶ֣בֶר הַ/קֵּינִ֑י
  choice: istri Heber, orang Keni itu
  rationale: Mempertahankan identifikasi Yael sebagai istri Heber serta nisbah etnis Heber. Koma membantu mencegah kesan bahwa “Keni” adalah bagian dari nama diri.
- source_word: כִּ֣י
  choice: sebab
  rationale: כִּי memperkenalkan alasan Sisera menuju tempat itu. “Sebab” jelas dan bermartabat dalam narasi Indonesia.
- source_word: שָׁל֗וֹם
  choice: hubungan damai
  rationale: שָׁלוֹם di sini menggambarkan keadaan relasi damai di antara dua pihak. “Hubungan damai” lebih jelas daripada sekadar “damai” tetapi tidak mempersempit maknanya menjadi perjanjian atau aliansi resmi.
- source_word: בֵּ֚ין יָבִ֣ין מֶֽלֶךְ חָצ֔וֹר וּ/בֵ֕ין
  choice: antara Yabin, raja Hazor, dan
  rationale: Menerjemahkan struktur korelatif “antara ... dan ...” serta mempertahankan gelar Yabin sebagai aposisi.
- source_word: בֵּ֖ית חֶ֥בֶר הַ/קֵּינִֽי
  choice: keluarga Heber, orang Keni itu
  rationale: בֵּית dalam konteks sosial dapat berarti rumah tangga, keluarga besar, atau kelompok kerabat. “Keluarga” alami dalam bahasa Indonesia, sementara catatan kaki mempertahankan keluasan konsep sumber.
theological_decisions: []
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan ragam naratif yang jelas dan bermartabat. Nama Ibrani ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia: Yael, Heber, Yabin, Hazor, dan Keni. Struktur dibuat alami tanpa menghilangkan kontras naratif maupun keluasan makna sosial בֵּית.'
