  text: וַ/תִּקַּ֣ח יָעֵ֣ל אֵֽשֶׁת חֶ֠בֶר אֶת יְתַ֨ד הָ/אֹ֜הֶל וַ/תָּ֧שֶׂם אֶת הַ/מַּקֶּ֣בֶת בְּ/יָדָ֗/הּ וַ/תָּב֤וֹא אֵלָי/ו֙ בַּ/לָּ֔אט וַ/תִּתְקַ֤ע אֶת הַ/יָּתֵד֙ בְּ/רַקָּת֔/וֹ וַ/תִּצְנַ֖ח בָּ/אָ֑רֶץ וְ/הֽוּא נִרְדָּ֥ם וַ/יָּ֖עַף וַ/יָּמֹֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/021.yaml
  text: Then Jael[a], the wife of Heber, took a tent peg and put a hammer in her hand, and she went to him quietly and drove the peg into his temple, and it went down into the ground. Now he was fast asleep and exhausted[b], and he died.
translation:
  language: id
  text: Lalu Yael, istri Heber, mengambil sebuah patok kemah dan menggenggam palu. Ia menghampiri Sisera dengan diam-diam[a], lalu menancapkan patok itu ke pelipisnya, dan patok itu masuk ke dalam tanah[b]. Sisera sedang tertidur lelap dan kelelahan, lalu ia mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “secara sembunyi-sembunyi.” Bahasa Ibrani menekankan bahwa ia mendekat dengan senyap dan tanpa menarik perhatian.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dan itu turun ke dalam tanah.” Bentuk kata kerjanya paling wajar merujuk kepada patok tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְתַד / הַיָּתֵד
  choice: patok kemah / patok itu
  rationale: Istilah ini menunjuk pada patok untuk mengikat atau menegakkan kemah. “Patok kemah” konkret, tepat, dan lazim dalam bahasa Indonesia modern.
- source_word: הַמַּקֶּבֶת
  choice: palu
  rationale: Kata ini menunjuk pada alat pemukul yang digunakan bersama patok. “Palu” merupakan padanan umum yang alami tanpa mempersempitnya menjadi jenis palu tertentu.
- source_word: בְּיָדָהּ
  choice: menggenggam
  rationale: Secara harfiah berarti “di tangannya”. Dalam rangkaian tindakan ini, “menggenggam palu” mengungkapkan maknanya secara alami dalam bahasa Indonesia.
- source_word: בַּלָּאט
  choice: dengan diam-diam
  rationale: Menggambarkan cara Yael mendekat secara senyap dan tidak menarik perhatian. Padanan ini mempertahankan kemungkinan nuansa “secara sembunyi-sembunyi” tanpa memastikan motif yang tidak dinyatakan.
- source_word: וַתִּתְקַע
  choice: menancapkan
  rationale: Dalam konteks patok dan palu, verba ini menyatakan tindakan memasukkan patok dengan kuat. “Menancapkan” alami dan mempertahankan gambaran konkretnya.
- source_word: בְּרַקָּתוֹ
  choice: ke pelipisnya
  rationale: רַקָּה menunjuk pada pelipis atau sisi kepala. “Ke pelipisnya” jelas secara anatomis dan tidak melebihkan arah lintasan dengan menerjemahkannya sebagai “menembus pelipis”.
- source_word: וַתִּצְנַח בָּאָרֶץ
  choice: dan patok itu masuk ke dalam tanah
  rationale: Verba feminin paling wajar mengacu kepada patok, yang juga berjenis feminin dalam bahasa Ibrani. Terjemahan ini mempertahankan urutan tindakan dan tidak mengubahnya menjadi klausa tujuan atau durasi.
- source_word: נִרְדָּם
  choice: tertidur lelap
  rationale: Bentuk partisip ini menggambarkan keadaan tidur. “Tertidur lelap” sesuai dengan penekanan narasi dan alami dalam bahasa Indonesia.
- source_word: וַיָּעַף
  choice: kelelahan
  rationale: Menggambarkan keadaan Sisera yang letih setelah melarikan diri. “Kelelahan” merupakan padanan modern yang kuat tanpa menambahkan sebab yang tidak dinyatakan.
- source_word: וַיָּמֹת
  choice: lalu ia mati
  rationale: Mempertahankan kelanjutan narasi yang singkat dan lugas serta finalitas pernyataan Ibrani.
- source_word: אֵשֶׁת חֶבֶר
  choice: istri Heber
  rationale: Padanan ini alami dalam bahasa Indonesia dan tetap mempertahankan keterangan aposisional tentang identitas Yael.
