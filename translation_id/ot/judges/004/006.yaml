base_translation:
  language: en
  yaml_path: translation/ot/judges/004/006.yaml
  text: 'She sent and summoned Barak son of Abinoam from Kedesh-naphtali, and said to him, “Has not the LORD, the God of Israel, commanded: ‘Go, draw up to Mount Tabor, and take with you ten thousand men from the sons of Naphtali and from the sons of Zebulun’?”'
translation:
  language: id
  text: 'Ia mengutus orang untuk memanggil Barak bin Abinoam dari Kedesh di wilayah Naftali, lalu berkata kepadanya, “Bukankah TUHAN, Allah Israel, telah memerintahkan: ‘Pergilah, kerahkanlah pasukan ke Gunung Tabor. Bawalah bersamamu sepuluh ribu laki-laki dari antara keturunan Naftali dan keturunan Zebulon’?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּשְׁלַח וַתִּקְרָא
  choice: Ia menyuruh orang memanggil
  rationale: Rangkaian verba ini secara harfiah berarti ‘ia mengutus dan memanggil’; dalam konteks, ungkapan Indonesia ini menyampaikan bahwa sang perempuan mengirim utusan untuk memanggil Barak tanpa mengulang tindakan secara kaku.
- source_word: מִקֶּדֶשׁ נַפְתָּלִי
  choice: dari Kedesh di wilayah Naftali
  rationale: Menjelaskan hubungan geografis konstruksi Ibrani secara alami dan membedakan Kedesh ini dari tempat lain yang bernama sama.
- source_word: הֲלֹא צִוָּה
  choice: Bukankah ... telah memerintahkan
  rationale: Mempertahankan bentuk pertanyaan retoris yang mengandaikan jawaban ya serta aspek perintah yang sudah diberikan.
- source_word: לֵךְ וּמָשַׁכְתָּ בְּהַר תָּבוֹר
  choice: Pergilah, kerahkanlah pasukan ke Gunung Tabor
  rationale: מָשַׁךְ pada dasarnya berarti ‘menarik’; dalam konteks militer ini kemungkinan berarti mengerahkan atau membawa pasukan menuju Tabor. Penyebutan ‘pasukan’ dibuat eksplisit dari konteks sepuluh ribu orang pada klausa berikutnya.
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ
  choice: sepuluh ribu orang
  rationale: Padanan langsung dan wajar untuk jumlah pasukan laki-laki yang disebut dalam teks.
- source_word: מִבְּנֵי נַפְתָּלִי וּמִבְּנֵי זְבֻלוּן
  choice: dari antara keturunan Naftali dan keturunan Zebulon
  rationale: בְּנֵי dapat berarti ‘anak-anak lelaki’ atau secara kolektif ‘keturunan/anggota suku’; konteks perekrutan suku mendukung ‘keturunan’.
theological_decisions:
- issue: Nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH atau Yahweh
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia yang luas dikenal dengan huruf kapital, seraya membedakannya dari sebutan umum ‘Tuhan’; tidak memasukkan rekonstruksi pelafalan ke dalam teks utama.
- issue: Daya ujar pertanyaan Debora
  choice: Pertanyaan retoris yang mengutip perintah ilahi
  alternative: 'Pernyataan langsung: ‘TUHAN ... telah memerintahkan engkau’'
  rationale: Partikel הֲלֹא harus dipertahankan karena menampilkan perintah itu sebagai sesuatu yang semestinya telah diketahui atau diakui Barak, tanpa menjelaskan lebih jauh bagaimana perintah tersebut diterimanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ‘Ia’ dipertahankan karena nama Debora tersedia dalam konteks ayat sebelumnya. Tanda petik bertingkat membedakan ucapan Debora dari perintah TUHAN yang dikutipnya.
