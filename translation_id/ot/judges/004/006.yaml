  to: 'Ia mengutus orang untuk memanggil Barak bin Abinoam dari Kedesh di wilayah Naftali, lalu berkata kepadanya, “Bukankah TUHAN, Allah Israel, telah memerintahkan: ‘Pergilah, kerahkanlah pasukan ke Gunung Tabor. Bawalah bersamamu sepuluh ribu laki-laki dari antara keturunan Naftali dan keturunan Zebulon’?”'
