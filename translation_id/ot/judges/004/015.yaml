base_translation:
  language: en
  yaml_path: translation/ot/judges/004/015.yaml
  text: And Yahweh threw Sisera[a], all his chariots, and all his army into confusion before Barak by the sword[c][b]. Then Sisera got down from his chariot and fled on foot.
translation:
  language: id
  text: Yahweh menimbulkan kekacauan pada Sisera[a], seluruh pasukan keretanya, dan seluruh tentaranya di hadapan Barak dengan mata pedang[b]. Lalu Sisera turun dari keretanya dan melarikan diri dengan berjalan kaki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “membuat ... panik” atau “mengacaukan”; kata Ibrani ini menggambarkan timbulnya kepanikan dan kekacauan dalam pertempuran.'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menurut mulut pedang”; ini adalah idiom untuk tindakan dengan mata pedang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּהָם
  choice: membuat ... menjadi kacau
  rationale: 'Bentuk ini menyatakan tindakan penyebab: Yahweh menimbulkan kepanikan atau kekacauan dalam pertempuran. Ungkapan ini mempertahankan cakupan makna tanpa langsung menyamakannya dengan kekalahan total.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: הָרֶכֶב
  choice: pasukan keretanya
  rationale: רֶכֶב dapat menunjuk secara kolektif pada kereta-kereta atau pasukan kereta. 'Pasukan kereta' lebih jelas dalam konteks militer, sedangkan akhiran posesif alami dalam bahasa Indonesia menunjukkan kaitannya dengan Sisera.
- source_word: הַמַּחֲנֶה
  choice: tentaranya
  rationale: Dalam narasi perang, מַחֲנֶה dapat berarti perkemahan atau keseluruhan kekuatan yang berkemah; di sini 'tentara' menyampaikan rujukan kontekstualnya secara alami.
- source_word: לְפִי חֶרֶב
  choice: oleh mata pedang
  rationale: Ungkapan Ibrani secara harfiah berarti 'oleh mulut pedang'. 'Mata pedang' merupakan idiom Indonesia yang wajar dan tetap mempertahankan citra ujung tajam pedang.
- source_word: לִפְנֵי בָרָק
  choice: di hadapan Barak
  rationale: Mencerminkan makna spasial dan naratif bahwa kekacauan itu terjadi di depan Barak ketika ia maju berperang.
- source_word: וַיֵּרֶד מֵעַל הַמֶּרְכָּבָה
  choice: turun dari keretanya
  rationale: Ungkapan alami untuk tindakan Sisera meninggalkan kereta yang dinaikinya; bentuk posesif memperjelas rujukan tanpa mengubah makna.
- source_word: וַיָּנָס בְּרַגְלָיו
  choice: melarikan diri dengan berjalan kaki
  rationale: Menyampaikan kontras bahwa Sisera tidak lagi menggunakan kereta, melainkan melarikan diri dengan kakinya sendiri.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama tersebut dan tidak menggantinya dengan sebuah gelar.
- issue: Peran Yahweh dan sarana pedang dalam kekalahan pasukan Sisera
  choice: Mempertahankan Yahweh sebagai pelaku yang menimbulkan kekacauan, disusul frasa 'oleh mata pedang'
  alternative: Menjadikan Barak satu-satunya pelaku atau menafsirkan frasa itu secara eksplisit sebagai 'Barak membunuh mereka'
  rationale: Susunan Ibrani menghubungkan tindakan ilahi, keadaan di hadapan Barak, dan sarana pedang tanpa menjabarkan secara penuh hubungan kausal di antara semuanya. Terjemahan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Pasukan kereta' menghindari kesan bahwa benda-benda kereta itu sendiri dibuat kacau, sementara 'mata pedang' mempertahankan idiom sumber dalam bentuk yang dikenal pembaca Indonesia.
