revisions:
- from: Yahweh membuat Sisera[a], seluruh pasukan keretanya, dan seluruh tentaranya menjadi kacau di hadapan Barak oleh mata pedang.[b] Lalu Sisera turun dari keretanya dan melarikan diri dengan berjalan kaki.
  to: Yahweh menimbulkan kekacauan pada Sisera[a], seluruh pasukan keretanya, dan seluruh tentaranya di hadapan Barak dengan mata pedang[b]. Lalu Sisera turun dari keretanya dan melarikan diri dengan berjalan kaki.
  rationale: Revisi memperhalus ungkapan kausatif agar alami dalam Bahasa Indonesia, mengganti preposisi instrumen menjadi “dengan,” dan membetulkan catatan kaki serta posisi penandanya. Tidak ada perubahan pada pelaku, objek, urutan peristiwa, atau cakupan makna sumber.
