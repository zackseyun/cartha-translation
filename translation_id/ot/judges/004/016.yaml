base_translation:
  language: en
  yaml_path: translation/ot/judges/004/016.yaml
  text: And Barak pursued the chariots and the army as far as Harosheth of the nations[a], and all Sisera’s army fell by the edge of the sword[b]; not even one was left.
translation:
  language: id
  text: Barak mengejar kereta-kereta perang dan pasukan itu sampai ke Haroset-Hagoyim[a]. Seluruh pasukan Sisera tewas oleh mata pedang; tidak seorang pun tersisa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani “Haroset bangsa-bangsa”; secara tradisional, “Haroset-Hagoyim.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רָדַף אַחֲרֵי
  choice: mengejar
  rationale: Kata kerja dengan preposisi ini menyatakan pengejaran aktif dalam pertempuran; “mengejar” alami dan tepat dalam bahasa Indonesia.
- source_word: הָרֶכֶב
  choice: kereta-kereta perang
  rationale: Nomina ini bersifat kolektif dalam konteks militer. “Kereta-kereta perang” memperjelas bahwa yang dimaksud bukan kendaraan biasa.
- source_word: הַמַּחֲנֶה
  choice: pasukan
  rationale: Dalam narasi pertempuran ini, istilah tersebut menunjuk kepada kekuatan militer, bukan sekadar perkemahan.
- source_word: עַד חֲרֹשֶׁת הַגּוֹיִם
  choice: sampai ke Haroset-Hagoyim
  rationale: Frasa ini menunjukkan batas pengejaran. Bentuk tradisional nama tempat dipertahankan melalui transliterasi agar unsur nama diri tidak secara keliru dibaca sebagai keterangan biasa.
- source_word: וַיִּפֹּל כָּל מַחֲנֵה סִיסְרָא
  choice: Seluruh pasukan Sisera tewas
  rationale: Subjek kolektif menunjuk pada kekalahan menyeluruh pasukan Sisera. “Tewas” menyampaikan makna jatuh terbunuh dalam konteks pertempuran secara alami.
- source_word: לְפִי חֶרֶב
  choice: oleh mata pedang
  rationale: Ungkapan Ibrani harfiah “menurut mulut pedang” merupakan idiom kematian dalam pertempuran; “mata pedang” mempertahankan citra idiomatis secara wajar dalam bahasa Indonesia.
- source_word: לֹא נִשְׁאַר עַד אֶחָד
  choice: tidak seorang pun tersisa
  rationale: Ungkapan ini menegaskan bahwa tidak ada satu orang pun dari pasukan tersebut yang tertinggal.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dibagi menjadi dua untuk keterbacaan, sementara urutan peristiwa, cakupan total kekalahan, dan citra “mata pedang” tetap dipertahankan.
