base_translation:
  language: en
  yaml_path: translation/ot/judges/004/010.yaml
  text: Then Barak summoned Zebulun and Naphtali to Kedesh[a], and ten thousand men went up following him, and Deborah went up with him.
translation:
  language: id
  text: Lalu Barak memanggil Zebulon dan Naftali ke Kedesh. Sepuluh ribu orang naik mengikutinya,[a] dan Debora naik bersamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di kakinya”, sebuah ungkapan yang berarti bahwa mereka mengikuti dia atau naik di bawah pimpinannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּזְעֵק
  choice: memanggil ... untuk berkumpul
  rationale: Bentuk Hifil dari זעק dalam konteks militer berarti memanggil atau menghimpun orang. Ungkapan ini alami dalam bahasa Indonesia dan tidak menyiratkan wajib militer secara berlebihan.
- source_word: אֶת זְבוּלֻן וְאֶת נַפְתָּלִי
  choice: suku Zebulon dan suku Naftali
  rationale: Nama-nama ini menunjuk pada kedua suku sebagai kelompok yang dipanggil Barak; penambahan 'suku' memperjelas acuannya bagi pembaca modern.
- source_word: קֶדְשָׁה
  choice: di Kedesh
  rationale: Akhiran penunjuk arah menyatakan gerak menuju Kedesh. Dalam konstruksi Indonesia 'memanggil ... untuk berkumpul di Kedesh', tujuan gerak tersebut tersampaikan secara alami.
- source_word: וַיַּעַל
  choice: maju
  rationale: עלה secara harfiah berarti 'naik/pergi naik', tetapi dalam konteks gerakan pasukan, 'maju' menyampaikan tindakan militer dengan alami. Pengulangan kata sumber dipertahankan dalam klausa tentang Debora.
- source_word: בְּרַגְלָיו
  choice: mengikuti dia
  rationale: Secara harfiah 'di kakinya'; dalam konteks ini merupakan ungkapan bagi pasukan yang mengikuti atau berada di bawah pimpinan Barak. Makna idiomatis dipakai dalam teks utama, sementara bentuk harfiahnya dicatat.
- source_word: עֲשֶׂרֶת אַלְפֵי אִישׁ
  choice: sepuluh ribu orang
  rationale: Ungkapan Ibrani ini menyatakan pasukan berjumlah sepuluh ribu laki-laki. 'Orang' merupakan padanan Indonesia yang wajar dalam narasi, sementara konteks menunjukkan bahwa mereka adalah pasukan.
- source_word: וַתַּעַל עִמּוֹ דְּבוֹרָה
  choice: dan Debora turut maju bersamanya
  rationale: Terjemahan ini mempertahankan tindakan yang sama seperti pada pasukan dan dengan jelas menyatakan bahwa Debora menyertai Barak.
