  text: Then the sons of Israel cried out to the LORD, because he had nine hundred iron chariots, and he oppressed the sons of Israel harshly for twenty years.
translation:
  language: id
  text: Lalu orang Israel berseru kepada TUHAN meminta pertolongan, sebab Sisera mempunyai sembilan ratus kereta perang dari besi dan menindas orang Israel dengan keras selama dua puluh tahun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְעֲקוּ ... אֶל־יְהוָה
  choice: berseru kepada TUHAN meminta pertolongan
  rationale: Kata צעק dalam konteks penindasan menyatakan seruan minta pertolongan; tambahan eksplisit ini membuat maksud idiomatisnya jelas dalam bahasa Indonesia. Nama perjanjian יהוה ditampilkan sebagai TUHAN menurut konvensi Alkitab Indonesia.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan harfiah 'anak-anak Israel' secara idiomatis menunjuk bangsa Israel; 'orang Israel' lebih alami dan tepat bagi pembaca modern.
- source_word: תְּשַׁע מֵאוֹת רֶכֶב בַּרְזֶל
  choice: sembilan ratus kereta perang dari besi
  rationale: רכב dalam konteks militer berarti kereta perang. 'Dari besi' mempertahankan bentuk Ibrani tanpa menentukan apakah seluruh kereta atau hanya perlengkapannya terbuat dari besi.
- source_word: לָחַץ ... בְּחָזְקָה
  choice: menindas ... dengan kejam
  rationale: לָחַץ berarti menekan atau menindas, sedangkan בְּחָזְקָה memberi nuansa keras/kejam; gabungan ini alami dan kuat dalam bahasa Indonesia.
theological_decisions:
- issue: Referen pronomina tunggal dalam 'לוֹ' dan 'וְהוּא'
  choice: Sisera mempunyai ... dan telah menindas
  alternative: ia mempunyai ... dan ia telah menindas
  rationale: Ayat sebelumnya menyebut Sisera sebagai panglima pasukan; penyebutan namanya menghindari ambiguitas pronomina bahasa Indonesia tanpa mengubah pelaku yang dimaksud dalam konteks.
- issue: Representasi nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH atau Yahweh
  rationale: TUHAN dengan huruf kapital mengikuti konvensi mapan bahasa Indonesia untuk membedakan nama ilahi dari gelar biasa, tanpa memaksakan rekonstruksi pelafalan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dijaga lancar bagi pembaca umum, sementara detail angka, bahan kereta, lamanya penindasan, dan intensitas tindakan dipertahankan.
