  text: וְ֠/הִיא יוֹשֶׁ֨בֶת תַּֽחַת תֹּ֜מֶר דְּבוֹרָ֗ה בֵּ֧ין הָ/רָמָ֛ה וּ/בֵ֥ין בֵּֽית אֵ֖ל בְּ/הַ֣ר אֶפְרָ֑יִם וַ/יַּעֲל֥וּ אֵלֶ֛י/הָ בְּנֵ֥י יִשְׂרָאֵ֖ל לַ/מִּשְׁפָּֽט־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/005.yaml
  text: She used to sit under the palm of Deborah[a], between Ramah and Bethel in the hill country of Ephraim[b], and the sons of Israel went up to her for judgment.
translation:
  language: id
  text: Ia biasa duduk di bawah pohon kurma Debora, di antara Rama dan Betel, di pegunungan Efraim. Orang Israel[a] naik kepadanya untuk memperoleh keputusan hukum.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak laki-laki Israel”; ungkapan Ibrani yang lazim untuk bangsa Israel secara keseluruhan.
    reason: lexical_alternative
  - marker: b
    text: Atau “untuk mendapatkan keadilan” atau “untuk diadili.” Istilah Ibrani dapat menunjuk keputusan hukum maupun pelaksanaan keadilan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֶׁבֶת
  choice: biasa duduk
  rationale: Bentuk partisipial dalam uraian ini paling wajar dipahami sebagai kebiasaan Debora menjalankan tugasnya di tempat tersebut, bukan tindakan sesaat.
- source_word: תֹּמֶר דְּבוֹרָה
  choice: pohon kurma Debora
  rationale: Frasa konstruksi ini menunjukkan pohon kurma yang dikenal melalui kaitannya dengan Debora; huruf kecil dipakai karena teks tidak mengharuskan pembacaan sebagai nama resmi.
- source_word: בְּהַר אֶפְרָיִם
  choice: di daerah pegunungan Efraim
  rationale: Kata tunggal הַר di sini menunjuk kawasan berbukit atau bergunung, bukan satu gunung tertentu.
- source_word: וַיַּעֲלוּ אֵלֶיהָ
  choice: datang mendaki untuk menghadap dia
  rationale: Terjemahan ini mempertahankan unsur gerak naik dalam עלה sekaligus menyampaikan secara alami bahwa bangsa itu datang kepada Debora dalam kapasitasnya sebagai hakim.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Orang Israel
  rationale: Ungkapan Ibrani harfiahnya 'anak-anak lelaki Israel', tetapi secara idiomatis menunjuk bangsa Israel secara keseluruhan; 'Orang Israel' menyampaikan rujukan korporat itu dengan jelas dalam bahasa Indonesia modern.
- source_word: לַמִּשְׁפָּט
  choice: untuk memperoleh keputusan hukum
  rationale: Dalam konteks tugas Debora sebagai hakim, מִשְׁפָּט menunjuk proses atau hasil pengadilan; pilihan ini jelas tanpa mempersempit maknanya secara berlebihan.
theological_decisions:
- issue: Ungkapan korporat bergender בְּנֵי יִשְׂרָאֵל
  choice: Orang Israel
  alternative: anak-anak Israel
  rationale: Walaupun bentuk sumber secara harfiah maskulin, ungkapan ini secara konvensional merujuk seluruh umat Israel, bukan hanya laki-laki. Terjemahan utama menyampaikan cakupan tersebut, sedangkan bentuk harfiahnya dipertahankan dalam catatan.
- issue: Cakupan makna מִשְׁפָּט
  choice: keputusan hukum
  alternative: penghakiman; keadilan
  rationale: Konteksnya bersifat yudisial, tetapi istilah Ibrani dapat menyoroti keputusan, pelaksanaan pengadilan, atau keadilan. Teks utama memilih ungkapan yang alami sambil mempertahankan alternatif dalam catatan.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Biasa duduk' menyatakan kebiasaan; 'datang mendaki' mempertahankan nuansa topografis; 'menghadap dia' sesuai dengan suasana yudisial. Penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskannya.
