base_translation:
  language: en
  yaml_path: translation/ot/judges/004/013.yaml
  text: Then Sisera called together all his chariots[a], nine hundred iron chariots, and all the people who were with him, from Harosheth-haggoyim to the Wadi Kishon.
translation:
  language: id
  text: Lalu Sisera memanggil seluruh keretanya, sembilan ratus kereta besi, dan semua orang yang bersamanya, dari Haroset-Hagoyim ke Sungai Kison[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Wadi Kison” atau “aliran deras Kison”; kata Ibrani naḥal dapat menunjuk pada wadi, alur sungai, atau lembah dengan aliran musiman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּזְעֵק
  choice: mengerahkan
  rationale: Dalam konteks militer dan dengan pasukan sebagai objek langsung, verba ini berarti memanggil lalu menghimpun kekuatan untuk bertindak; “mengerahkan” menyampaikan fungsi tersebut secara alami dalam bahasa Indonesia.
- source_word: רִכְבּוֹ
  choice: seluruh kereta perangnya
  rationale: רֶכֶב dapat menunjuk pada kereta atau pasukan kereta secara kolektif. Keterangan berikutnya, “sembilan ratus kereta besi,” mendukung pengertian konkret; “perang” memperjelas jenis kereta dalam konteks militer.
- source_word: תְּשַׁע מֵאוֹת רֶכֶב בַּרְזֶל
  choice: sembilan ratus kereta besi
  rationale: Terjemahan ini mempertahankan bentuk ringkas frasa Ibrani tanpa menentukan apakah kereta itu seluruhnya terbuat dari besi atau hanya diperkuat dan diperlengkapi dengan besi.
- source_word: כָּל הָעָם אֲשֶׁר אִתּוֹ
  choice: semua orang yang menyertainya
  rationale: עָם secara harfiah berarti “rakyat/orang-orang,” tetapi di sini merujuk pada kekuatan yang menyertai Sisera. Pilihan ini mempertahankan keluasan kata sumber tanpa secara eksplisit mengubahnya menjadi “tentara.”
- source_word: מֵחֲרֹשֶׁת הַגּוֹיִם
  choice: dari Haroset-Hagoyim
  rationale: Nama tempat ditransliterasikan dalam bentuk yang mudah dibaca menurut ejaan Indonesia, sementara prefiks מִן diterjemahkan “dari.”
- source_word: נַחַל קִישׁוֹן
  choice: Sungai Kison
  rationale: “Sungai” merupakan istilah geografis yang paling mudah dipahami pembaca Indonesia; catatan kaki mempertahankan cakupan makna נַחַל yang juga dapat menunjuk pada wadi, alur sungai, atau aliran musiman.
