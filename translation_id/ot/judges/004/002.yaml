id: JDG.4.2
reference: Judges 4:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּמְכְּרֵ֣/ם יְהוָ֗ה בְּ/יַד֙ יָבִ֣ין מֶֽלֶךְ כְּנַ֔עַן אֲשֶׁ֥ר מָלַ֖ךְ בְּ/חָצ֑וֹר וְ/שַׂר צְבָא/וֹ֙ סִֽיסְרָ֔א וְ/ה֥וּא יוֹשֵׁ֖ב בַּ/חֲרֹ֥שֶׁת הַגּוֹיִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/002.yaml
  text: So Yahweh sold them into the hand of Jabin king of Canaan[a], who reigned in Hazor; and the commander of his army was Sisera[b], who lived in Harosheth-haggoyim.
translation:
  language: id
  text: Maka Yahweh menjual mereka ke dalam tangan Yabin[a], raja Kanaan, yang memerintah di Hazor. Panglima tentaranya ialah Sisera, yang tinggal di Haroset-Hagoyim[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menjual mereka ke dalam tangan” berarti menyerahkan mereka ke bawah kekuasaan Yabin; ini merupakan ungkapan penghakiman perjanjian.
    reason: lexical_alternative
  - marker: b
    text: Haroset-Hagoyim mungkin berarti “Haroset Bangsa-Bangsa.”
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמְכְּרֵם
  choice: menjual mereka
  rationale: Mempertahankan arti harfiah dan metafora penghakiman yang kuat dari מָכַר, yang dalam kitab Hakim-Hakim menggambarkan penyerahan Israel kepada penindas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: בְּיַד
  choice: ke dalam tangan
  rationale: Mempertahankan citra idiom Ibrani yang berarti menyerahkan ke dalam kuasa seseorang; maknanya dijelaskan dalam catatan kaki.
- source_word: יָבִין מֶלֶךְ כְּנַעַן
  choice: Yabin, raja Kanaan
  rationale: Menyajikan nama dan gelar secara wajar dalam bahasa Indonesia tanpa menambahkan unsur yang tidak diperlukan.
- source_word: אֲשֶׁר מָלַךְ בְּחָצוֹר
  choice: yang memerintah di Hazor
  rationale: מָלַךְ berarti memerintah sebagai raja; 'memerintah' terdengar alami dan tetap tepat dalam konteks.
- source_word: וְשַׂר צְבָאוֹ
  choice: Panglima tentaranya ialah
  rationale: שַׂר צָבָא menunjuk pemimpin tertinggi pasukan; 'panglima tentara' jelas dan sesuai dengan ragam naratif bermartabat.
- source_word: סִיסְרָא
  choice: Sisera
  rationale: Transliterasi baku nama pribadi tersebut dalam bahasa Indonesia.
- source_word: וְהוּא יוֹשֵׁב
  choice: yang tinggal
  rationale: Klausa ini paling alami merujuk kepada Sisera dan menyatakan tempat kediamannya; bentuk partisip diterjemahkan secara idiomatis.
- source_word: בַּחֲרֹשֶׁת הַגּוֹיִם
  choice: di Haroset-Hagoyim
  rationale: Mempertahankan nama tempat melalui transliterasi, sementara arti unsur הַגּוֹיִם diterangkan dalam catatan kaki.
theological_decisions:
- issue: Tindakan ilahi dalam penindasan Israel
  choice: Yahweh secara langsung 'menjual mereka' ke dalam tangan Yabin.
  alternative: Yahweh hanya mengizinkan mereka jatuh ke bawah kekuasaan Yabin.
  rationale: Bentuk verba Ibrani menyatakan tindakan langsung Yahweh dalam penghakiman; terjemahan tidak melunakkannya menjadi sekadar izin.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang wajar dan bermartabat. Metafora Ibrani 'menjual ... ke dalam tangan' dipertahankan dalam teks dan dijelaskan agar mudah dipahami. Ejaan nama mengikuti bentuk Indonesia yang transparan.
