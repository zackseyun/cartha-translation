  register: Bahasa Indonesia modern, lugas, dan bermartabat. Ungkapan Ibrani tentang 'tangan' diterjemahkan menurut maknanya sebagai kuasa agar kalimat alami, sementara pengulangan gelar Yabin dipertahankan untuk mencerminkan penekanan teks sumber.
