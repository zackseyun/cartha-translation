  yaml_path: translation/ot/judges/004/024.yaml
  text: And the hand of the sons of Israel went on[a], growing stronger against Jabin king of Canaan[c][b], until they cut off Jabin king of Canaan.
translation:
  language: id
  text: Kuasa orang Israel terus makin kuat melawan Yabin, raja Kanaan, hingga mereka membinasakan Yabin, raja Kanaan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menyingkirkan Yabin, raja Kanaan, secara tuntas.” Kata Ibrani yang diterjemahkan “membinasakan” secara harfiah berarti “memotong” atau “menyingkirkan”; dalam konteks ini maknanya ialah mengalahkan atau menghapuskan dia dengan tegas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּלֶךְ יַד
  choice: kuasa ... semakin kuat
  rationale: Secara harfiah ungkapan ini berbicara tentang 'tangan' yang terus bergerak, tetapi dalam konteks permusuhan יַד menunjuk pada kuasa atau kekuatan. Bahasa Indonesia alami menyatakan perkembangan tersebut sebagai kuasa yang semakin kuat.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan harfiah 'anak-anak Israel' merupakan sebutan kolektif bagi bangsa Israel; 'orang Israel' menyampaikan acuannya secara jelas dan wajar dalam bahasa Indonesia modern.
- source_word: הָלוֹךְ וְקָשָׁה
  choice: semakin kuat
  rationale: Gabungan infinitif absolut הָלוֹךְ dengan וְקָשָׁה menyatakan perkembangan yang terus meningkat. Dalam konteks ini yang meningkat ialah daya tekan atau keunggulan kuasa Israel terhadap Yabin.
- source_word: עַל
  choice: atas
  rationale: Preposisi ini di sini menandai keunggulan atau tekanan yang diarahkan kepada Yabin. 'Atas' mempertahankan nuansa dominasi, sedangkan 'terhadap' juga mungkin.
- source_word: הִכְרִיתוּ
  choice: membinasakan
  rationale: Bentuk kausatif dari כרת berarti menyingkirkan atau memutuskan secara tuntas dan dalam konteks peperangan berarti membinasakan. Padanan ini lebih alami daripada terjemahan harfiah 'memutuskan'.
