source:
  edition: WLC
  text: וַ/תֹּאמֶר֩ דְּבֹרָ֨ה אֶל בָּרָ֜ק ק֗וּם כִּ֣י זֶ֤ה הַ/יּוֹם֙ אֲשֶׁר֩ נָתַ֨ן יְהוָ֤ה אֶת סִֽיסְרָא֙ בְּ/יָדֶ֔/ךָ הֲ/לֹ֥א יְהוָ֖ה יָצָ֣א לְ/פָנֶ֑י/ךָ וַ/יֵּ֤רֶד בָּרָק֙ מֵ/הַ֣ר תָּב֔וֹר וַ/עֲשֶׂ֧רֶת אֲלָפִ֛ים אִ֖ישׁ אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/014.yaml
  text: Then Deborah said to Barak[a], “Arise, for this is the day on which Yahweh has given Sisera into your hand. Has not Yahweh gone out before you?” So Barak went down from Mount Tabor[b], with ten thousand men following him.
translation:
  language: id
  text: Lalu Debora berkata kepada Barak, “Bangkitlah, sebab inilah hari ketika Yahweh telah menyerahkan Sisera ke dalam tanganmu.[a] Bukankah Yahweh telah maju di depanmu?[b]” Maka Barak turun dari Gunung Tabor dengan sepuluh ribu orang mengikutinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “telah memberikan Sisera ke dalam tanganmu”; maksudnya, telah menyerahkannya ke dalam kuasamu.
    reason: Menjelaskan idiom Ibrani נתן ... ביד, sambil mempertahankan citranya dalam teks utama.
  - marker: b
    text: Secara harfiah, “telah keluar di depanmu”; dapat juga diterjemahkan “telah berjalan di depanmu.”
    reason: Mencatat bentuk dasar ungkapan Ibrani dan kemungkinan padanan yang kurang menonjolkan nuansa militer.
lexical_decisions:
- source_word: קוּם
  choice: Bangkitlah
  rationale: Bentuk imperatif ini menyampaikan seruan agar Barak segera bertindak, dengan nada yang tegas dan tetap wajar dalam bahasa Indonesia modern.
- source_word: כִּי זֶה הַיּוֹם אֲשֶׁר
  choice: sebab inilah hari ketika
  rationale: Mempertahankan penekanan demonstratif pada “inilah hari” dan menyatakan alasan bagi perintah Debora secara alami.
- source_word: נָתַן ... בְּיָדֶךָ
  choice: telah menyerahkan ... ke dalam tanganmu
  rationale: Mengungkapkan bahwa Sisera telah ditempatkan dalam kuasa Barak, sekaligus mempertahankan citra idiom Ibrani “ke dalam tanganmu.” Bentuk perfektif diterjemahkan “telah” untuk mencerminkan kemenangan yang dinyatakan sebagai kepastian.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Mempertahankan bentuk pertanyaan retoris yang mengharapkan jawaban setuju.
- source_word: יָצָא לְפָנֶיךָ
  choice: telah maju mendahuluimu
  rationale: Menyampaikan gerak Yahweh ke depan dalam konteks pertempuran secara alami, tanpa menghilangkan gagasan bahwa Ia berjalan di depan Barak.
- source_word: וַיֵּרֶד
  choice: turun
  rationale: Padanan naratif yang langsung dan alami untuk gerak turun dari gunung.
- source_word: מֵהַר תָּבוֹר
  choice: dari Gunung Tabor
  rationale: Menggunakan bentuk nama geografis yang lazim dalam bahasa Indonesia.
- source_word: וַעֲשֶׂרֶת אֲלָפִים אִישׁ אַחֲרָיו
  choice: dan sepuluh ribu orang mengikuti dia
  rationale: Mempertahankan jumlah pasukan dan posisi mereka di belakang Barak dalam susunan bahasa Indonesia yang alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai Tetragramaton sebagai nama pribadi Allah; “Yahweh” mempertahankan fungsi nama itu tanpa menggantinya dengan gelar.
- issue: Kepastian kemenangan dalam נָתַן
  choice: telah menyerahkan
  alternative: akan menyerahkan
  rationale: Bentuk perfektif menggambarkan penyerahan Sisera sebagai kenyataan yang pasti, walaupun pelaksanaan kemenangan dalam alur cerita masih segera terjadi.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Bangkitlah” mempertahankan daya dorong seruan Debora; “maju mendahuluimu” terdengar alami dalam konteks pertempuran. Struktur pertanyaan retoris dipertahankan, dan idiom “ke dalam tanganmu” sengaja dijaga dengan penjelasan dalam catatan kaki.
