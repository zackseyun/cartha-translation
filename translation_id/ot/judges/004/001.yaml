reference: Judges 4:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וְ/אֵה֖וּד מֵֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/001.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh after Ehud died[a].
translation:
  language: id
  text: Orang Israel kembali melakukan apa yang jahat di mata Yahweh setelah Ehud meninggal.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: kembali melakukan
  rationale: Konstruksi יסף dengan infinitif menyatakan pengulangan atau kelanjutan. Dalam pola naratif kitab Hakim-Hakim, “kembali melakukan” secara alami menandai kambuhnya perilaku Israel.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Orang Israel
  rationale: Ungkapan Ibrani secara harfiah berarti “anak-anak lelaki Israel,” tetapi berfungsi sebagai sebutan kolektif bagi bangsa Israel. “Orang Israel” adalah padanan Indonesia yang alami, tepat, dan mencakup seluruh kelompok yang dimaksud.
- source_word: לַעֲשׂוֹת הָרַע
  choice: melakukan apa yang jahat
  rationale: Adjektiva bersubstantif dengan artikel paling wajar diterjemahkan “apa yang jahat,” sambil mempertahankan penilaian moral dalam rumusan berulang ini.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Padanan ini mempertahankan metafora Ibrani “di mata” dan tetap jelas serta alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh,” bukan diganti dengan suatu gelar.
- source_word: וְאֵהוּד מֵת
  choice: setelah Ehud meninggal
  rationale: Walaupun bentuknya secara formal adalah waw diikuti subjek dan verba qatal, dalam konteks klausa ini memberi latar waktu bagi kambuhnya kejahatan Israel sesudah kematian Ehud.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama perjanjian YHWH secara langsung; “Yahweh” mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan gelar.
- issue: Sebutan kolektif בְּנֵי יִשְׂרָאֵל
  choice: Orang Israel
  alternative: anak-anak Israel; keturunan Israel
  rationale: Dalam konteks ini bentuk maskulin tersebut adalah sebutan kolektif bagi bangsa Israel, bukan pembatasan rujukan hanya kepada laki-laki. Padanan alami bahasa Indonesia tidak perlu mempertahankan idiom kekerabatan Ibrani secara harfiah.
- issue: Hubungan klausa וְאֵהוּד מֵת dengan klausa utama
  choice: setelah Ehud meninggal
  alternative: dan Ehud meninggal; ketika Ehud sudah mati
  rationale: Konteks naratif mendukung fungsi temporal, tetapi terjemahan tidak menambahkan hubungan kausal antara kematian Ehud dan kejahatan Israel.
translation_notes:
  register: Bahasa Indonesia baku modern, ringkas, dan bermartabat. Susunan kalimat mempertahankan rumusan teologis “jahat di mata Yahweh” sambil memakai sebutan kolektif yang alami bagi pembaca Indonesia.
