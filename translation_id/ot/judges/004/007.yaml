source:
  edition: WLC
  text: וּ/מָשַׁכְתִּ֨י אֵלֶ֜י/ךָ אֶל נַ֣חַל קִישׁ֗וֹן אֶת סִֽיסְרָא֙ שַׂר צְבָ֣א יָבִ֔ין וְ/אֶת רִכְבּ֖/וֹ וְ/אֶת הֲמוֹנ֑/וֹ וּ/נְתַתִּ֖י/הוּ בְּ/יָדֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/007.yaml
  text: And I will draw Sisera[a], the commander of Jabin’s army, along with his chariots and his multitude, to you at the Wadi Kishon[b], and I will give him into your hand.
translation:
  language: id
  text: Aku akan menarik Sisera, panglima tentara Yabin, beserta kereta-keretanya dan pasukannya[a], kepadamu, ke Wadi Kison[b]. Aku akan menyerahkan dia ke dalam tanganmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang banyaknya” atau “kumpulannya.” Dalam konteks ini, yang dimaksud dapat berupa pasukan atau bala tentaranya.
    reason: lexical_alternative
  - marker: b
    text: Atau “ke Sungai Kison” atau “ke alur Kison.” Kata Ibrani yang dipakai dapat menunjuk wadi, alur sungai, atau lembah yang dialiri arus deras.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָשַׁכְתִּי
  choice: Aku akan menarik
  rationale: Mempertahankan daya metaforis verba משׁך, yakni menyebabkan Sisera bergerak ke tempat yang ditentukan, tanpa menambahkan maksud tipu daya seperti dalam 'memancing'.
- source_word: אֵלֶיךָ
  choice: kepadamu
  rationale: Menunjukkan arah gerak menuju Barak dan wajar dalam bahasa Indonesia.
- source_word: אֶל נַחַל קִישׁוֹן
  choice: di Wadi Kison
  rationale: נחל dapat menunjuk wadi, alur sungai, atau lembah berarus deras; 'Wadi' mempertahankan ciri geografisnya, sedangkan 'di' menghasilkan susunan Indonesia yang alami bersama 'menarik ... kepadamu'.
- source_word: סִיסְרָא
  choice: Sisera
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: שַׂר צְבָא יָבִין
  choice: panglima tentara Yabin
  rationale: שׂר צבא menunjuk pemimpin militer; 'panglima tentara' jelas, modern, dan sesuai konteks.
- source_word: רִכְבּוֹ
  choice: kereta-keretanya
  rationale: רכב di sini merujuk pada kereta perang atau pasukan kereta secara kolektif; bentuk ini lugas dan tetap mempertahankan gambaran konkret.
- source_word: הֲמוֹנוֹ
  choice: seluruh pasukannya
  rationale: המון secara harfiah berarti kumpulan atau orang banyak; dalam konteks militer, 'seluruh pasukannya' paling alami, sementara keluasan makna katanya dicatat dalam catatan kaki.
- source_word: וּנְתַתִּיהוּ
  choice: Aku akan menyerahkan dia
  rationale: נתן dengan ungkapan 'ke dalam tangan' berarti menyerahkan seseorang ke dalam kuasa pihak lain; 'menyerahkan' menyampaikan idiom itu secara jelas.
- source_word: בְּיָדֶךָ
  choice: ke dalam tanganmu
  rationale: Mempertahankan idiom Ibrani tentang penyerahan ke dalam kuasa seseorang, yang tetap mudah dipahami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Tuturan langsung memakai 'Aku' dan 'kepadamu' sesuai konteks ilahi kepada satu orang. Istilah geografis 'wadi' dipertahankan dan dijelaskan dalam catatan kaki; idiom 'ke dalam tanganmu' dipertahankan agar citra teks sumber tidak hilang.
