revisions:
- from: Heber, orang Keni itu, telah memisahkan diri dari suku Keni, yakni dari keturunan Hobab, mertua Musa.[a] Ia telah mendirikan kemahnya sampai ke pohon besar di Zaananim,[b] yang terletak dekat Kedesh.
  to: Heber, orang Keni itu, telah memisahkan diri dari suku Keni, dari keturunan Hobab, ayah mertua Musa, dan telah mendirikan kemahnya sampai ke pohon besar di Zaannanim,[a] yang terletak dekat Kedesh.
  rationale: Revisi memperjelas pembacaan utama חֹתֵן sebagai “ayah mertua” sambil mempertahankan ambiguitas leksikalnya dalam catatan kaki. Nama tempat diselaraskan menjadi “Zaannanim.” Catatan kaki kekerabatan dipindahkan agar melekat pada “ayah mertua Musa”; dalam teks ini penanda ditempatkan pada istilah tersebut.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T19:31:33Z'
