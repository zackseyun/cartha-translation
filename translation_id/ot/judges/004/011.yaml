reference: Judges 4:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/חֶ֤בֶר הַ/קֵּינִי֙ נִפְרָ֣ד מִ/קַּ֔יִן מִ/בְּנֵ֥י חֹבָ֖ב חֹתֵ֣ן מֹשֶׁ֑ה וַ/יֵּ֣ט אָהֳל֔/וֹ עַד אֵל֥וֹן ב/צענים אֲשֶׁ֥ר אֶת קֶֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/011.yaml
  text: Heber the Kenite had separated from the Kenites[a], from the sons of Hobab, the father-in-law of Moses, and had pitched his tent as far as the oak in Zaannannim[b], which is near Kedesh.
translation:
  language: id
  text: Heber, orang Keni itu, telah memisahkan diri dari suku Keni, dari keturunan Hobab, ayah mertua Musa, dan telah mendirikan kemahnya sampai ke pohon besar di Zaannanim,[a] yang terletak dekat Kedesh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: pohon tarbantin di Zaannanim; mungkin juga pohon ek.'
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפְרָד
  choice: telah memisahkan diri
  rationale: Bentuk nifal verba פרד menyatakan pemisahan dari suatu kelompok. Bentuk aktif refleksif ini alami dalam bahasa Indonesia dan sesuai dengan fungsi ayat sebagai keterangan latar.
- source_word: הַקֵּינִי / מִקַּיִן
  choice: orang Keni / suku Keni
  rationale: Dalam konteks ini kedua bentuk menunjuk kepada identitas etnis atau kelompok Keni, bukan kepada tokoh Kain.
- source_word: מִבְּנֵי חֹבָב
  choice: dari keturunan Hobab
  rationale: Secara harfiah berarti 'dari anak-anak Hobab', tetapi di sini menunjuk kepada garis keturunan atau kelompok keluarganya; 'keturunan' lebih wajar dan jelas dalam bahasa Indonesia.
- source_word: חֹתֵן מֹשֶׁה
  choice: mertua Musa
  rationale: חֹתֵן lazim menunjuk kepada kerabat karena perkawinan dan dalam tradisi tentang Musa kemungkinan besar berarti mertua. Cakupan makna yang lebih luas dicatat dalam catatan kaki.
- source_word: וַיֵּט אָהֳלוֹ
  choice: Ia telah mendirikan kemahnya
  rationale: Ungkapan נטה אהל berarti membentangkan atau mendirikan kemah. 'Telah' mempertahankan fungsi tindakan ini sebagai latar bagi kisah berikutnya.
- source_word: עַד
  choice: sampai ke
  rationale: Preposisi ini menandai batas atau jangkauan menuju suatu lokasi. Terjemahan ini mempertahankan unsur batas tempat tanpa mengubahnya menjadi sekadar 'dekat'.
- source_word: אֵלוֹן
  choice: pohon besar
  rationale: Istilah ini dapat menunjuk kepada pohon besar, yang sering diidentifikasi sebagai pohon tarbantin atau ek. Pilihan umum ini tidak memastikan jenis pohon yang tidak pasti.
- source_word: בצענים
  choice: di Zaananim
  rationale: Nama tempat ini dialihaksarakan dalam bentuk yang mudah dibaca oleh pembaca Indonesia tanpa menerjemahkan arti nama yang tidak pasti.
- source_word: אֲשֶׁר אֶת קֶדֶשׁ
  choice: yang terletak dekat Kedesh
  rationale: Konstruksi tersebut menyatakan kedekatan lokasi dengan Kedesh; 'terletak dekat' jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna חֹתֵן dalam hubungan Hobab dengan Musa
  choice: mertua Musa
  alternative: kerabat Musa karena perkawinan
  rationale: Istilah Ibrani dapat bermakna lebih luas daripada 'mertua', tetapi dalam tradisi naratif tentang Hobab dan Musa, 'mertua' merupakan pengertian yang lazim dan paling mungkin. Alternatif yang lebih luas dipertahankan dalam catatan kaki agar ketidakpastian tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang bermartabat dan mudah dipahami. Penanda wacana tambahan seperti 'Adapun' tidak dipakai karena tidak ada kata temporal atau penanda sepadan yang eksplisit dalam sumber. Nama diri ditulis sebagai Heber, Hobab, Zaananim, dan Kedesh.
