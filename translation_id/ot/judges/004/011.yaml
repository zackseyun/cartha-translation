  - severity: low
    issue: Ejaan “Zaananim” tidak mengikuti transliterasi nama tempat yang dipakai dalam audit trail.
    rationale: Bentuk “Zaannanim” lebih dekat dengan transliterasi yang disediakan dan mempertahankan konsonan rangkap pada nama tempat tersebut.
