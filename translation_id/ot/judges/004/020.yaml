base_translation:
  language: en
  yaml_path: translation/ot/judges/004/020.yaml
  text: And he said to her[a], “Stand at the entrance of the tent, and if anyone comes and asks you, saying, ‘Is there a man here?’ you shall say, ‘No.’”
translation:
  language: id
  text: Ia berkata kepadanya, “Berdirilah di pintu masuk kemah. Jika seseorang datang dan bertanya kepadamu, ‘Apakah ada seorang laki-laki di sini?’ katakanlah, ‘Tidak ada.’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalam bahasa Ibrani, kata yang sama, אִישׁ, muncul dalam klausa syarat dan pertanyaan: secara harfiah, “jika seorang laki-laki datang ... Apakah ada seorang laki-laki di sini?” Dalam klausa syarat, kata itu dapat dipakai secara tak tentu sehingga diterjemahkan “seseorang”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲמֹד
  choice: Berdirilah
  rationale: Perintah langsung dari עמד menyuruh orang yang diajak bicara mengambil atau mempertahankan posisi; bentuk ini alami dan tegas dalam bahasa Indonesia.
- source_word: פֶּתַח הָאֹהֶל
  choice: pintu masuk kemah
  rationale: פֶּתַח menunjuk pada bukaan atau jalan masuk. ‘Pintu masuk kemah’ jelas dan idiomatis tanpa menyiratkan adanya daun pintu yang kaku.
- source_word: וְהָיָה אִם
  choice: Jika
  rationale: Konstruksi ini memperkenalkan keadaan bersyarat; ‘jika’ menyampaikan fungsinya secara alami tanpa meniru idiom Ibrani secara kaku.
- source_word: אִישׁ
  choice: seseorang / seorang laki-laki
  rationale: Kemunculan pertama bersifat tak tentu dalam klausa syarat sehingga diterjemahkan ‘seseorang’; pengulangan dalam pertanyaan langsung diterjemahkan lebih leksikal sebagai ‘seorang laki-laki’, sesuai konteks pencarian.
- source_word: וּשְׁאֵלֵךְ
  choice: bertanya kepadamu
  rationale: שׁאל di sini berarti menanyakan atau meminta keterangan; ungkapan ini langsung dan lazim dalam bahasa Indonesia.
- source_word: הֲיֵשׁ פֹּה אִישׁ
  choice: Apakah ada seorang laki-laki di sini?
  rationale: Pertanyaan ini menanyakan keberadaan seseorang berjenis kelamin laki-laki; ‘apakah ada ... di sini?’ mempertahankan struktur dan maknanya secara alami.
- source_word: אָיִן
  choice: Tidak ada
  rationale: Jawaban Ibrani sangat singkat dan menyangkal keberadaan orang yang ditanyakan. ‘Tidak ada’ mempertahankan ketegasan serta kelengkapannya dalam bahasa Indonesia.
