base_translation:
  language: en
  yaml_path: translation/ot/judges/004/012.yaml
  text: And they told Sisera that Barak son of Abinoam had gone up to Mount Tabor.
translation:
  language: id
  text: Lalu orang-orang memberi tahu Sisera bahwa Barak anak Abinoam telah naik ke Gunung Tabor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: Lalu orang-orang memberi tahu
  rationale: Bentuk Hifil dari נגד berarti ‘memberi tahu’ atau ‘melaporkan’. Subjek jamaknya tidak disebutkan secara khusus; ‘orang-orang’ mempertahankan bentuk aktif dan ketidakjelasan identitas para pelapor secara alami dalam bahasa Indonesia.
- source_word: לְסִיסְרָא
  choice: Sisera
  rationale: Preposisi לְ menandai objek tak langsung, yang secara alami dirangkai dengan verba ‘memberi tahu’ dalam bahasa Indonesia.
- source_word: כִּי
  choice: bahwa
  rationale: Di sini כִּי memperkenalkan isi laporan, bukan menyatakan sebab.
- source_word: עָלָה
  choice: telah naik ke
  rationale: עלה berarti ‘naik’. Kata ‘telah’ menyampaikan bahwa tindakan Barak sudah terjadi sebelum laporan itu diberikan, sedangkan ‘ke’ mempertahankan arah menuju lokasi tersebut.
- source_word: בָּרָק
  choice: Barak
  rationale: Bentuk nama diri yang lazim dalam bahasa Indonesia.
- source_word: בֶּן אֲבִינֹעַם
  choice: anak Abinoam
  rationale: Konstruksi patronimik Ibrani diterjemahkan secara lugas dan alami sebagai ‘anak Abinoam’.
- source_word: הַר תָּבוֹר
  choice: Gunung Tabor
  rationale: הַר menunjuk gunung atau bukit; karena yang dimaksud ialah puncak geografis bernama Tabor, ‘Gunung Tabor’ merupakan padanan Indonesia yang tepat dan lazim.
theological_decisions: []
