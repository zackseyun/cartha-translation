base_translation:
  language: en
  yaml_path: translation/ot/judges/004/022.yaml
  text: And look, Barak was pursuing Sisera. Jael went out to meet him and said to him, “Come, and I will show you the man whom you are seeking.” So he went in to her, and look, Sisera was lying there dead, with the tent peg in his temple.
translation:
  language: id
  text: Lihatlah, Barak sedang mengejar Sisera. Yael keluar menemuinya dan berkata kepadanya, “Mari, akan kutunjukkan kepadamu orang yang sedang kaucari.” Maka Barak masuk menemui Yael, dan lihatlah, Sisera tergeletak mati dengan patok kemah tertancap di pelipisnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Lihatlah / dan lihatlah
  rationale: Mempertahankan penanda perhatian naratif yang muncul dua kali, dengan ungkapan Indonesia yang alami dan tetap mencolok.
- source_word: רֹדֵף
  choice: sedang mengejar
  rationale: Partisipel menggambarkan tindakan yang tengah berlangsung ketika adegan beralih kepada Barak.
- source_word: לֵךְ
  choice: Mari
  rationale: Dalam konteks ajakan Yael agar Barak mengikutinya, bentuk ini lebih alami daripada arti harfiah ‘pergilah’.
- source_word: וְאַרְאֶךָּ
  choice: akan kutunjukkan kepadamu
  rationale: Menyampaikan bentuk kausatif ראה dengan jelas dan wajar dalam bahasa Indonesia.
- source_word: נֹפֵל מֵת
  choice: tergeletak mati
  rationale: Secara idiomatis menggambarkan Sisera yang didapati dalam keadaan jatuh/terbaring dan sudah mati.
- source_word: הַיָּתֵד
  choice: patok kemah
  rationale: Konteks ayat 21 menunjukkan bahwa yang dimaksud adalah patok kemah, bukan pasak secara umum.
- source_word: בְּרַקָּתוֹ
  choice: di pelipisnya
  rationale: Padanan anatomi yang tepat dan lazim bagi רַקָּה dalam konteks ini.
