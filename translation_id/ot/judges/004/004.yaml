  yaml_path: translation/ot/judges/004/004.yaml
  text: Deborah, a woman, a prophetess, the wife of Lappidoth, was judging Israel at that time.
translation:
  language: id
  text: Debora, seorang perempuan, seorang nabi, istri Lapidot, sedang menghakimi Israel pada waktu itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִשָּׁה נְבִיאָה
  choice: seorang perempuan yang menjadi nabi
  rationale: Mempertahankan penyebutan eksplisit bahwa Debora adalah perempuan sekaligus menyampaikan perannya sebagai nabi dalam bahasa Indonesia modern tanpa memakai bentuk gender yang tidak lazim.
- source_word: אֵשֶׁת לַפִּידוֹת
  choice: istri Lapidot
  rationale: אֵשֶׁת secara paling langsung berarti 'istri dari'; Lapidot dipertahankan sebagai nama diri sesuai pembacaan tradisional teks.
- source_word: שֹׁפְטָה אֶת יִשְׂרָאֵל
  choice: bertindak sebagai hakim atas Israel
  rationale: Bentuk partisipel menunjukkan kegiatan atau peran yang sedang berlangsung. Ungkapan ini menyampaikan fungsi Debora sebagai hakim, bukan sekadar tindakan mengadili satu perkara.
- source_word: בָּעֵת הַהִיא
  choice: pada waktu itu
  rationale: Padanan langsung dan alami bagi penunjuk waktu dalam teks sumber.
theological_decisions:
- issue: Penyebutan gender dan peran kenabian Debora
  choice: seorang perempuan yang menjadi nabi
  alternative: seorang nabiah
  rationale: Pilihan ini tidak menghapus kata אִשָּׁה ('perempuan') dan tidak mengaburkan kenyataan bahwa teks menyebut Debora sebagai nabi.
- issue: Sifat jabatan kehakiman Debora
  choice: bertindak sebagai hakim atas Israel
  alternative: menghakimi Israel
  rationale: Pilihan ini menghindari kesan negatif yang dapat muncul dari 'menghakimi' dalam bahasa Indonesia masa kini dan tetap menunjukkan peran kepemimpinan yudisial yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan aposisional dipertahankan secara alami, dan tidak ditambahkan penanda wacana seperti 'adapun' karena waw dalam konteks ini tidak harus diterjemahkan secara eksplisit.
