  text: וַ/יֹּ֤אמֶר אֵלֶ֨י/הָ֙ בָּרָ֔ק אִם תֵּלְכִ֥י עִמִּ֖/י וְ/הָלָ֑כְתִּי וְ/אִם לֹ֥א תֵלְכִ֛י עִמִּ֖/י לֹ֥א אֵלֵֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/008.yaml
  text: Barak said to her[a], “If you will go with me, I will go; but if you will not go with me, I will not go.”
translation:
  language: id
  text: Barak berkata kepadanya, “Jika engkau pergi bersamaku, aku akan pergi. Namun, jika engkau tidak pergi bersamaku, aku tidak akan pergi.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  choice: berkata kepadanya
  rationale: Bentuk wayyiqtol dari אמר memperkenalkan perkataan langsung, sedangkan אֶל dengan akhiran orang ketiga feminin tunggal menunjuk kepada Debora; ungkapan ini alami dalam narasi Indonesia.
- source_word: בָּרָק
  choice: Barak
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dipakai dalam bahasa Indonesia.
- source_word: אִם
  choice: jika
  rationale: Partikel ini memperkenalkan klausa syarat dan secara langsung serta alami diterjemahkan 'jika'.
- source_word: תֵּלְכִי
  choice: engkau pergi
  rationale: Bentuk qal imperfek orang kedua feminin tunggal ditujukan kepada Debora. Dalam klausa bersyarat bahasa Indonesia, bentuk 'engkau pergi' sudah menyampaikan tindakan yang dipersyaratkan tanpa perlu penanda kala mendatang.
- source_word: עִמִּי
  choice: bersamaku
  rationale: Preposisi עִם dengan akhiran orang pertama tunggal menyatakan penyertaan; 'bersamaku' merupakan padanan yang ringkas dan alami.
- source_word: וְהָלָכְתִּי
  choice: aku akan pergi
  rationale: Bentuk qal perfek orang pertama tunggal sesudah protasis berfungsi sebagai akibat syarat. 'Akan' memperjelas hasil yang berlaku bila syarat dipenuhi.
- source_word: וְאִם לֹא
  choice: Namun, jika ... tidak
  rationale: Konjungsi bersama syarat kedua memperkenalkan pertentangan dengan syarat pertama. 'Namun' menyampaikan kontras tersebut secara alami tanpa mengubah hubungan logisnya.
- source_word: לֹא אֵלֵךְ
  choice: aku tidak akan pergi
  rationale: Qal imperfek orang pertama tunggal yang dinegasikan menyatakan penolakan Barak dalam kondisi tersebut; padanan ini langsung dan jelas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kata ganti 'engkau' dan 'aku' mempertahankan percakapan langsung yang personal tanpa menjadi terlalu sehari-hari. Struktur dua klausa syarat dipertahankan secara seimbang; tidak diperlukan catatan kaki karena perbedaan bentuk aspek Ibrani dapat disampaikan jelas dalam teks utama.
