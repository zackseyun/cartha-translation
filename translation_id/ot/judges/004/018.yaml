  text: וַ/תֵּצֵ֣א יָעֵל֮ לִ/קְרַ֣את סִֽיסְרָא֒ וַ/תֹּ֣אמֶר אֵלָ֗י/ו סוּרָ֧/ה אֲדֹנִ֛/י סוּרָ֥/ה אֵלַ֖/י אַל תִּירָ֑א וַ/יָּ֤סַר אֵלֶ֨י/הָ֙ הָ/אֹ֔הֱלָ/ה וַ/תְּכַסֵּ֖/הוּ בַּ/שְּׂמִיכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/004/018.yaml
  text: Jael went out to meet Sisera and said to him[a], “Turn aside, my lord, turn aside to me; do not be afraid.” So he turned aside to her into the tent[b], and she covered him with a blanket.
translation:
  language: id
  text: Yael keluar untuk menemui Sisera dan berkata kepadanya, “Singgahlah,[a] tuanku, singgahlah kepadaku; jangan takut.” Lalu ia pun berpaling kepada Yael dan masuk ke dalam kemah itu, dan Yael menutupinya dengan kain penutup.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Berpalinglah.” Kata Ibrani ini secara harfiah berarti berpaling atau menyimpang dari jalan; dalam konteks ini merupakan undangan untuk masuk ke tempat perlindungan.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani ini dapat menunjuk pada selimut, permadani, atau kain penutup lainnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּצֵא
  choice: keluar
  rationale: Bentuk dari יצא menyatakan gerak ke luar; konteksnya Yael keluar dari kemah untuk mendatangi Sisera.
- source_word: לִקְרַאת
  choice: untuk menemui
  rationale: Ungkapan ini menyatakan gerak yang disengaja menuju seseorang; 'menemui' alami dalam narasi Indonesia.
- source_word: סוּרָה
  choice: Singgahlah
  rationale: סור secara harfiah berarti berbelok atau menyimpang dari jalan. Dalam konteks undangan menuju kemah, 'singgahlah' mempertahankan gagasan meninggalkan jalur tanpa terdengar kaku; pengulangannya dipertahankan.
- source_word: אֲדֹנִי
  choice: Tuanku
  rationale: Sapaan hormat kepada laki-laki yang dipandang berkedudukan lebih tinggi; 'Tuanku' mempertahankan nada takzim tanpa menjadikannya gelar ilahi.
- source_word: אַל תִּירָא
  choice: jangan takut
  rationale: Padanan Indonesia modern dan langsung bagi larangan dari ירא.
- source_word: וַיָּסַר
  choice: singgah
  rationale: Pilihan ini menjaga kaitan leksikal dengan imperatif סוּרָה dan memperlihatkan bahwa Sisera menanggapi undangan Yael.
- source_word: הָאֹהֱלָה
  choice: masuk ke dalam kemah
  rationale: Akhiran direktif menyatakan gerak menuju kemah; dalam konteks, Sisera masuk ke dalamnya. Frasa ini dibuat eksplisit agar arah geraknya jelas.
- source_word: וַתְּכַסֵּהוּ
  choice: Yael menyelimutinya
  rationale: כסה berarti menutupi. Subjek 'Yael' disebut kembali demi kejernihan bahasa Indonesia, sedangkan 'menyelimuti' menyampaikan tindakan menutup tubuh dengan kain.
- source_word: בַּשְּׂמִיכָה
  choice: dengan kain penutup
  rationale: שׂמיכה menunjuk kain untuk menutupi, tetapi jenis tepatnya tidak pasti; 'kain penutup' mempertahankan keluasan makna tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa naratif modern, jelas, dan bermartabat. 'Singgahlah' dipilih agar undangan Yael terdengar alami sekaligus mempertahankan gambaran Sisera meninggalkan jalurnya. Sapaan 'Tuanku' mempertahankan nada hormat. Ketidakpastian benda penutup dipertahankan dalam teks dan dijelaskan dalam catatan kaki.
