revisions:
- from: Yael keluar untuk menemui Sisera dan berkata kepadanya, “Singgahlah, Tuanku, singgahlah ke tempatku; jangan takut.” Lalu Sisera singgah ke tempatnya, masuk ke dalam kemah, dan Yael menyelimutinya dengan kain penutup.[a]
  to: Yael keluar untuk menemui Sisera dan berkata kepadanya, “Singgahlah,[a] tuanku, singgahlah kepadaku; jangan takut.” Lalu ia pun berpaling kepada Yael dan masuk ke dalam kemah itu, dan Yael menutupinya dengan kain penutup.[b]
  rationale: Revisi menghapus pengulangan tindakan dan rujukan pronominal yang kurang jelas, sambil mempertahankan gerak Sisera sebagai tanggapan atas undangan Yael. Catatan kaki ditambahkan untuk menjelaskan rentang makna imperatif “Singgahlah” dan catatan tentang kain penutup dipertahankan.
