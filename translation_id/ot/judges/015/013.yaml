base_translation:
  language: en
  yaml_path: translation/ot/judges/015/013.yaml
  text: They said to him[a], “No, but we will surely bind you and hand you over into their hand[b]; yet we will certainly not put you to death.” So they bound him with two new ropes and brought him up from the rock.
translation:
  language: id
  text: Mereka berkata kepadanya, “Tidak, kami akan mengikatmu erat-erat dan menyerahkanmu ke tangan mereka[a]; kami sama sekali tidak akan membunuhmu.” Lalu mereka mengikatnya dengan dua tali baru dan membawanya naik dari bukit batu[b] itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyerahkanmu ke dalam kuasa mereka.” Ungkapan Ibraninya secara harfiah berbunyi “menyerahkanmu ke tangan mereka.”
    reason: lexical_alternative
  - marker: b
    text: Atau “batu besar itu” atau “tebing batu itu.” Kata Ibrani סֶלַע dapat menunjuk pada batu besar, tebing, atau tempat tinggi berbatu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כִּי
  choice: Tidak. Kami hanya akan
  rationale: Ungkapan ini menyangkal kekhawatiran Simson bahwa mereka sendiri akan menyerangnya, lalu menjelaskan tindakan yang memang akan mereka lakukan. Susunan ini alami dalam bahasa Indonesia dan mempertahankan kontrasnya.
- source_word: אָסֹר נֶאֱסָרְךָ
  choice: akan mengikatmu erat-erat
  rationale: Infinitif absolut yang diikuti verba finit memberi penegasan. 'Erat-erat' menyampaikan intensitas tindakan dengan bahasa Indonesia yang wajar.
- source_word: וּנְתַנּוּךָ בְיָדָם
  choice: menyerahkanmu ke tangan mereka
  rationale: Mempertahankan gambaran idiom Ibrani tentang penyerahan ke dalam kuasa pihak lain, sekaligus tetap mudah dipahami.
- source_word: וְהָמֵת לֹא נְמִיתֶךָ
  choice: kami sama sekali tidak akan membunuhmu
  rationale: Konstruksi infinitif absolut dan verba finit dengan negasi menekankan jaminan kuat bahwa mereka tidak akan menyebabkan kematiannya.
- source_word: וַיַּאַסְרֻהוּ
  choice: mereka mengikatnya
  rationale: Mempertahankan kesepadanan leksikal dengan akar אסר yang dipakai dalam ucapan sebelumnya.
- source_word: בִּשְׁנַיִם עֲבֹתִים חֲדָשִׁים
  choice: dengan dua tali baru
  rationale: עֲבֹתִים menunjuk pada tali atau tambang yang tebal. 'Tali' merupakan pilihan modern yang jelas, sedangkan 'baru' dipertahankan karena penting dalam alur kisah Simson.
- source_word: וַיַּעֲלֻהוּ מִן הַסָּלַע
  choice: membawanya naik dari bukit batu itu
  rationale: Bentuk kausatif עלה menyatakan membawa naik. סֶלַע dapat menunjuk pada batu besar, tebing, atau ketinggian berbatu; konteks mendukung tempat perlindungan berbatu.
