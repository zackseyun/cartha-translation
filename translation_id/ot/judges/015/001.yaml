revisions:
- from: Beberapa waktu kemudian, pada musim panen gandum, Simson mengunjungi istrinya sambil membawa seekor anak kambing. Katanya, “Aku mau masuk menemui istriku di kamar.”[a] Namun, ayah perempuan itu tidak mengizinkannya masuk.
  to: Beberapa waktu kemudian, pada musim panen gandum, Simson mengunjungi istrinya dengan membawa seekor anak kambing. Ia berkata, “Aku hendak masuk kepada istriku, ke kamar.”[a] Namun, ayah istrinya tidak mengizinkan Simson masuk.
  rationale: Revisi memulihkan arah gerak “ke kamar” dan eufemisme “masuk kepada istriku” tanpa membuat implikasi seksualnya menjadi lebih eksplisit daripada teks Ibrani. Penyesuaian pada penyebutan ayah meningkatkan kelancaran serta kejelasan rujukan dalam bahasa Indonesia modern.
