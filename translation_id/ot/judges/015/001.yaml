source:
  edition: WLC
  text: וַ/יְהִ֨י מִ/יָּמִ֜ים בִּ/ימֵ֣י קְצִיר חִטִּ֗ים וַ/יִּפְקֹ֨ד שִׁמְשׁ֤וֹן אֶת אִשְׁתּ/וֹ֙ בִּ/גְדִ֣י עִזִּ֔ים וַ/יֹּ֕אמֶר אָבֹ֥אָה אֶל אִשְׁתִּ֖/י הֶ/חָ֑דְרָ/ה וְ/לֹֽא נְתָנ֥/וֹ אָבִ֖י/הָ לָ/בֽוֹא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/001.yaml
  text: And after some days[a], in the days of the wheat harvest, Samson visited his wife with a young goat. He said, “Let me go in to my wife, into the inner room.” But her father would not allow him to go in.
translation:
  language: id
  text: Beberapa waktu kemudian, pada musim panen gandum, Simson mengunjungi istrinya dengan membawa seekor anak kambing. Ia berkata, “Aku hendak masuk kepada istriku, ke kamar.”[a] Namun, ayah istrinya tidak mengizinkan Simson masuk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Aku hendak masuk kepada istriku, ke ruang dalam.” Kata Ibrani itu menunjuk pada kamar atau ruang dalam; dalam konteks ini ungkapan tersebut dapat menyiratkan ruang pribadi suami istri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִיָּמִים
  choice: Beberapa waktu kemudian
  rationale: Ungkapan Ibrani ini menandai berlalunya waktu. Pilihan ini alami dalam narasi Indonesia dan tidak membatasi selang waktunya secara terlalu harfiah.
- source_word: בִּימֵי קְצִיר חִטִּים
  choice: pada musim panen gandum
  rationale: Menyampaikan penanda musim dengan jelas dan wajar dalam bahasa Indonesia modern.
- source_word: וַיִּפְקֹד
  choice: mengunjungi
  rationale: Dalam konteks ini, פקד berarti mendatangi atau mengunjungi seseorang, bukan menghitung, mengangkat, atau menghukum.
- source_word: אֶת אִשְׁתּוֹ
  choice: istrinya
  rationale: Bahasa Ibrani tetap menyebut perempuan itu sebagai istri Simson meskipun hubungan mereka sedang bermasalah.
- source_word: בִּגְדִי עִזִּים
  choice: sambil membawa seekor anak kambing
  rationale: Menjelaskan secara alami bahwa anak kambing itu dibawa Simson ketika berkunjung, kemungkinan sebagai pemberian, tanpa menyatakan tujuan yang tidak tersurat.
- source_word: אָבֹאָה אֶל אִשְׁתִּי
  choice: Aku mau masuk menemui istriku
  rationale: Bentuk kohortatif menyatakan kehendak atau maksud Simson. Kata 'masuk' mempertahankan kemungkinan nuansa hubungan suami-istri tanpa membuatnya terlalu eksplisit.
- source_word: הֶחָדְרָה
  choice: di kamar
  rationale: Bentuk berarah menunjuk ke kamar atau ruang dalam. Susunan 'masuk menemui ... di kamar' lebih alami dalam bahasa Indonesia daripada pengulangan 'masuk ... ke kamar'.
- source_word: וְלֹא נְתָנוֹ אָבִיהָ לָבוֹא
  choice: Namun, ayah perempuan itu tidak mengizinkannya masuk
  rationale: Menyatakan penolakan aktif sang ayah dan mempertahankan pengulangan verba 'masuk' dari ucapan Simson.
theological_decisions:
- issue: Nuansa seksual ungkapan 'masuk menemui istriku'
  choice: Mempertahankan ungkapan tidak langsung
  alternative: Menerjemahkan secara eksplisit sebagai keinginan untuk berhubungan dengan istrinya
  rationale: Teks Ibrani mengandung implikasi hubungan suami-istri dalam konteks kamar, tetapi tidak mengatakannya secara gamblang; terjemahan mempertahankan ketegangan dan kesantunan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. 'Ayah perempuan itu' dipakai untuk menghindari ambiguitas pronomina 'ayahnya'. Penanda catatan kaki [a] ditempatkan setelah kalimat langsung yang dijelaskannya.
