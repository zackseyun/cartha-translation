  yaml_path: translation/ot/judges/015/008.yaml
  text: And he struck them hip and thigh with a great slaughter[a], and he went down and stayed in the cleft of the rock of Etam.
translation:
  language: id
  text: Ia menghantam mereka—tungkai dan paha[a]—dengan pukulan dahsyat. Kemudian ia turun dan tinggal di celah batu karang Etam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tungkai dan paha”; kemungkinan merupakan ungkapan untuk kekalahan yang telak atau menyeluruh.
    reason: Ungkapan Ibrani ini sulit dipastikan makna tepatnya. Terjemahan mempertahankan citra konkretnya, sementara kemungkinan daya idiomatisnya dijelaskan dalam catatan.
lexical_decisions:
- source_word: וַיַּךְ
  choice: Ia menghantam mereka
  rationale: Kata נכה pada dasarnya berarti memukul atau menghantam. Dalam konteks pertempuran, “menghantam” menyampaikan serangan keras tanpa memastikan bahwa kata kerja ini sendiri berarti membunuh setiap orang.
- source_word: שׁוֹק עַל יָרֵךְ
  choice: betis dan paha
  rationale: Ungkapan Ibrani ini sulit dipastikan maknanya. Terjemahan konkret “betis dan paha” mempertahankan citra tubuh dalam teks sumber, sedangkan kemungkinan daya idiomatisnya dijelaskan dalam catatan kaki.
- source_word: מַכָּה גְדוֹלָה
  choice: menimbulkan kekalahan besar
  rationale: Dalam konteks peperangan, מַכָּה dapat menunjuk pada pukulan, pembantaian, atau kekalahan. “Menimbulkan kekalahan besar” terdengar alami dalam bahasa Indonesia dan menyampaikan hasil serangan tanpa secara berlebihan menyatakan bahwa semua lawan dibunuh.
- source_word: וַיֵּרֶד
  choice: ia turun
  rationale: Terjemahan langsung dan wajar yang mempertahankan arah gerakan dalam narasi.
- source_word: וַיֵּשֶׁב
  choice: tinggal
  rationale: Kata ישב dapat berarti duduk, menetap, atau tinggal. Dalam konteks tempat perlindungan ini, “tinggal” paling alami dan tidak menentukan berapa lama ia berada di sana.
- source_word: בִּסְעִיף סֶלַע
  choice: di celah batu karang
  rationale: סְעִיף menunjuk pada belahan atau celah, sedangkan סֶלַע adalah batu besar atau formasi batu karang. Gabungan ini secara alami menggambarkan tempat berlindung di celah batu karang.
- source_word: עֵיטָם
  choice: Etam
  rationale: Nama tempat ditransliterasikan ke dalam bentuk yang lazim dalam bahasa Indonesia.
