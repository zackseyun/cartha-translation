  to: Ayah perempuan itu berkata, “Aku sungguh menyangka bahwa engkau benar-benar membencinya, maka aku memberikannya kepada temanmu.[a] Bukankah adik perempuannya lebih baik daripada dia? Biarlah adik perempuannya menjadi milikmu sebagai gantinya.”
  rationale: Revisi menghapus penambahan 'istrimu', mempertahankan ungkapan sumber yang lebih umum, dan membuat rujukan kepada saudari yang lebih muda menjadi eksplisit. Catatan kaki dipertahankan dengan perumusan yang tidak menambahkan spesifikasi gender.
