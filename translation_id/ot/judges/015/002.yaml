base_translation:
  language: en
  yaml_path: translation/ot/judges/015/002.yaml
  text: And her father said[a], “I really thought that you utterly hated her, so I gave her to your companion. Is not her younger sister better than she? Please let her be yours instead of her.”
translation:
  language: id
  text: Ayah perempuan itu berkata, “Aku sungguh menyangka bahwa engkau benar-benar membencinya, maka aku memberikannya kepada temanmu.[a] Bukankah adik perempuannya lebih baik daripada dia? Biarlah adik perempuannya menjadi milikmu sebagai gantinya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pendampingmu”; istilah Ibrani ini dapat merujuk secara luas kepada seorang teman, rekan, atau pendamping. Dalam konteks pernikahan ini, sebagian orang memahaminya sebagai orang yang mendampingi Simson.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָבִיהָ
  choice: ayah perempuan itu
  rationale: Bentuk dengan sufiks feminin tunggal menunjuk kepada perempuan yang disebut dalam konteks; penyebutan ini lebih jelas dan alami dalam bahasa Indonesia.
- source_word: אָמֹר אָמַרְתִּי
  choice: Aku sungguh menyangka
  rationale: Infinitif absolut yang diikuti bentuk perfektif memberi penegasan; frasa ini mempertahankan intensitasnya secara wajar.
- source_word: שָׂנֹא שְׂנֵאתָהּ
  choice: engkau benar-benar membencinya
  rationale: Konstruksi infinitif absolut dan perfektif menegaskan kebencian; 'benar-benar' menyampaikan penekanan tanpa terdengar kaku.
- source_word: וָאֶתְּנֶנָּה
  choice: maka aku memberikannya
  rationale: Waw konsekutif di sini melanjutkan alasan sang ayah dengan nuansa akibat.
- source_word: לְמֵרֵעֶךָ
  choice: kepada temanmu
  rationale: מֵרֵעַ dapat berarti teman, rekan, atau pendamping; 'temanmu' alami dan tetap cukup luas, sedangkan peran khusus dalam pesta pernikahan tidak dipastikan oleh katanya sendiri.
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Menyampaikan pertanyaan retoris yang mengharapkan persetujuan secara alami dalam bahasa Indonesia.
- source_word: אֲחֹתָהּ הַקְּטַנָּה
  choice: adiknya
  rationale: Dalam hubungan saudara, הַקְּטַנָּה paling alami berarti saudari yang lebih muda; 'adik' mengungkapkannya secara ringkas.
- source_word: טוֹבָה מִמֶּנָּה
  choice: lebih baik daripada dia
  rationale: טוֹבָה menyatakan keunggulan secara umum; terjemahan ini tidak mempersempit makna menjadi kecantikan fisik.
- source_word: תְּהִי נָא לְךָ
  choice: Biarlah adiknya menjadi istrimu
  rationale: Bentuk jussif dengan נָא menyatakan permohonan. Dalam konteks pemberian perempuan sebagai pengganti istri, 'menjadi istrimu' membuat maksud relasional yang tersirat jelas dalam bahasa Indonesia.
- source_word: תַּחְתֶּיהָ
  choice: sebagai gantinya
  rationale: תַּחַת di sini menyatakan penggantian; frasa Indonesia ini idiomatis dan jelas.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang alami dan bermartabat. Bentuk 'engkau' dipakai untuk dialog bernuansa sastra Alkitab tanpa menjadi terlalu arkais. Dua konstruksi Ibrani yang intensif dipertahankan dengan 'sungguh' dan 'benar-benar'. Penanda catatan kaki [a] ditempatkan langsung setelah istilah terkait.
