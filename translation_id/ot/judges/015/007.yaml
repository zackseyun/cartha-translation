base_translation:
  language: en
  yaml_path: translation/ot/judges/015/007.yaml
  text: And Samson said to them, “If this is what you do, then I swear I will take vengeance on you, and after that I will stop.”
translation:
  language: id
  text: Simson berkata kepada mereka, “Kalau kalian melakukan ini, aku bersumpah[a] bahwa aku akan menuntut balas terhadap kalian. Sesudah itu barulah aku berhenti.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani memakai rumus sumpah yang eliptis. Terjemahan “aku bersumpah bahwa” mengungkapkan maksudnya tanpa menambahkan kutuk atau konsekuensi sumpah yang tidak dinyatakan dalam teks.
    reason: Memperbaiki penjelasan idiom כִּי אִם agar tidak memberi kesan bahwa parafrasa sebelumnya adalah terjemahan harfiah.
lexical_decisions:
- source_word: אִם תַּעֲשׂוּן כָּזֹאת
  choice: Kalau kalian berbuat seperti ini
  rationale: Mempertahankan bentuk syarat dalam bahasa Ibrani dan memakai sapaan jamak yang alami dalam bahasa Indonesia modern.
- source_word: נִקַּמְתִּי בָכֶם
  choice: akan membalas dendam kepada kalian
  rationale: Bentuk perfek dalam konteks sumpah menyatakan tindakan yang pasti akan dilaksanakan; verba נקם di sini berarti melakukan pembalasan terhadap pihak yang dituju.
- source_word: וְאַחַר אֶחְדָּל
  choice: Sesudah itu barulah aku berhenti
  rationale: 'Kata ''barulah'' menyampaikan urutan tegas dalam אַחַר: Simson akan berhenti hanya setelah pembalasan itu dilakukan.'
theological_decisions:
- issue: Rumus sumpah eliptis כִּי אִם
  choice: aku bersumpah
  alternative: sungguh, aku akan / aku tidak akan berhenti sebelum
  rationale: Dalam konteks ini כִּי אִם berfungsi sebagai rumus sumpah yang dipendekkan. Terjemahan eksplisit 'aku bersumpah' menyampaikan daya pragmatisnya tanpa melengkapi kutuk yang tidak dinyatakan dalam teks.
translation_notes:
  register: Bahasa modern, lugas, dan bermartabat. 'Kalian' dipakai karena objeknya jamak; susunan dua kalimat dalam ujaran Simson menjaga tekanan pada urutan pembalasan lalu berhenti.
