base_translation:
  language: en
  yaml_path: translation/ot/judges/015/004.yaml
  text: So Shimshon went and caught three hundred foxes[a], and he took torches and turned them tail to tail, and put one torch between each pair of tails, in the middle.
translation:
  language: id
  text: Lalu Simson pergi dan menangkap tiga ratus ekor rubah[a]. Ia mengambil obor-obor, menyusun rubah-rubah itu ekor ke ekor, lalu menaruh satu obor di tengah-tengah setiap pasang ekor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “jakal.” Kata Ibrani שׁוּעָלִים dapat merujuk pada rubah atau jenis kanid serupa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: pergi
  rationale: Bentuk wayyiqtol dari הלך melanjutkan rangkaian tindakan; 'pergi' merupakan padanan naratif yang lugas.
- source_word: שִׁמְשׁוֹן
  choice: Simson
  rationale: Menggunakan bentuk nama yang sudah baku dan dikenal luas dalam bahasa Indonesia.
- source_word: וַיִּלְכֹּד
  choice: menangkap
  rationale: Dalam konteks ini לכד menunjuk pada tindakan menangkap hewan; padanan ini alami dan tidak menambahkan cara penangkapannya.
- source_word: שְׁלֹשׁ מֵאוֹת שׁוּעָלִים
  choice: tiga ratus ekor rubah
  rationale: Kata penggolong 'ekor' membuat penyebutan jumlah hewan alami dalam bahasa Indonesia; שׁוּעָלִים diterjemahkan 'rubah' dengan alternatif leksikal dipertahankan dalam catatan kaki.
- source_word: לַפִּדִים / לַפִּיד
  choice: obor-obor / satu obor
  rationale: לַפִּיד berarti obor atau suluh yang menyala; 'obor' jelas dan umum dalam bahasa Indonesia modern.
- source_word: וַיֶּפֶן זָנָב אֶל זָנָב
  choice: mengatur rubah-rubah itu dengan ekor saling berhadapan
  rationale: פנה secara harfiah berkaitan dengan memalingkan atau menghadapkan. Terjemahan ini menyatakan susunan ekor dengan ekor tanpa menambahkan bahwa ekor-ekor itu diikat, sesuatu yang tidak dinyatakan secara eksplisit dalam teks.
- source_word: וַיָּשֶׂם לַפִּיד אֶחָד בֵּין שְׁנֵי הַזְּנָבוֹת בַּתָּוֶךְ
  choice: menaruh satu obor di tengah-tengah setiap pasang ekor
  rationale: Ungkapan sumber secara harfiah menyebut 'di antara kedua ekor, di tengah'; 'setiap pasang' menyampaikan secara alami bahwa tindakan tersebut diterapkan pada pasangan-pasangan hewan.
