  text: וַ/יִּבְקַ֨ע אֱלֹהִ֜ים אֶת הַ/מַּכְתֵּ֣שׁ אֲשֶׁר בַּ/לֶּ֗חִי וַ/יֵּצְא֨וּ מִמֶּ֤/נּוּ מַ֨יִם֙ וַ/יֵּ֔שְׁתְּ וַ/תָּ֥שָׁב רוּח֖/וֹ וַ/יֶּ֑חִי עַל כֵּ֣ן קָרָ֣א שְׁמָ֗/הּ עֵ֤ין הַקּוֹרֵא֙ אֲשֶׁ֣ר בַּ/לֶּ֔חִי עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/019.yaml
  text: Then God split open the hollow place that is at Lehi[a], and water came out from it. When he drank, his spirit returned and he revived. Therefore he called its name En-hakkore[b], which is at Lehi to this day.
translation:
  language: id
  text: Lalu Allah membelah tempat cekung yang ada di Lehi[a], lalu air keluar dari situ. Setelah Simson minum, daya hidupnya pulih dan ia kembali segar. Karena itu, ia menamai tempat itu En-Hakore[b], yang ada di Lehi sampai hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, menurut pembacaan lain atas peristiwa ini, “Allah membelah cekungan pada tulang rahang, lalu air keluar darinya.”
    reason: alternative_reading
  - marker: b
    text: En-Hakore kemungkinan berarti “Mata Air Orang yang Berseru” atau “Mata Air Dia yang Berseru,” mengacu pada seruan Simson kepada Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְקַע
  choice: membelah
  rationale: Kata kerja ini menyatakan tindakan membelah atau meretak dengan kuat; “membelah” konkret, alami, dan sesuai dengan tindakan Allah dalam konteks ini.
- source_word: הַמַּכְתֵּשׁ
  choice: cekungan
  rationale: Walaupun biasanya dapat berarti lesung, dalam konteks ini kata tersebut menunjuk pada rongga atau tempat cekung yang mengeluarkan air. “Cekungan” menyampaikan pengertian topografis tanpa memaksakan gambaran benda rumah tangga.
- source_word: בַּלֶּחִי
  choice: di Lehi
  rationale: Dalam alur narasi, Lehi berfungsi sebagai nama tempat. Namun, arti dasarnya “tulang rahang” tetap dicatat sebagai kemungkinan pembacaan lain.
- source_word: וַיֵּצְאוּ מִמֶּנּוּ מַיִם
  choice: sehingga air keluar dari situ
  rationale: Ungkapan ini menyampaikan hasil dari tindakan membelah secara alami dalam bahasa Indonesia, dengan “air” sebagai nomina massa.
- source_word: וַתָּשָׁב רוּחוֹ
  choice: semangatnya pulih
  rationale: רוּחַ dapat berarti roh, napas, atau daya hidup. Dalam konteks kehausan dan pemulihan jasmani, “semangatnya pulih” menyampaikan kembalinya daya hidup tanpa menyiratkan kebangkitan dari kematian.
- source_word: וַיֶּחִי
  choice: ia hidup kembali
  rationale: Di sini kata kerja menunjuk pada pulihnya vitalitas setelah hampir roboh, bukan kebangkitan dari kematian. Ungkapan ini mempertahankan citra hidup yang kuat dalam bahasa Ibrani.
- source_word: קָרָא שְׁמָהּ
  choice: ia menamai tempat itu
  rationale: Ini mengungkapkan formula pemberian nama dengan bahasa Indonesia yang wajar; “tempat itu” memperjelas rujukan sufiks feminin dalam konteks.
- source_word: עֵין הַקּוֹרֵא
  choice: En-Hakore
  rationale: Nama ditransliterasikan dalam teks utama, sementara makna etimologisnya yang penting bagi narasi dijelaskan dalam catatan kaki.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Ini adalah padanan Indonesia yang baku dan alami bagi formula waktu Ibrani tersebut.
theological_decisions:
- issue: Rujukan בַּלֶּחִי dan lokasi sumber air
  choice: Memahami Lehi sebagai nama tempat dalam teks utama.
  alternative: Allah membelah cekungan pada tulang rahang, lalu air keluar darinya.
  rationale: Konteks dekat berulang kali memperlakukan Lehi sebagai lokasi, dan klausa penutup “yang ada di Lehi sampai hari ini” sangat mendukung pembacaan geografis. Karena arti leksikal לֶחִי adalah “tulang rahang,” pembacaan alternatif tetap dipertahankan dalam catatan kaki.
- issue: Makna וַתָּשָׁב רוּחוֹ וַיֶּחִי
  choice: “semangatnya pulih dan ia hidup kembali” sebagai pemulihan daya hidup.
  alternative: “rohnya kembali dan ia hidup” atau “napasnya kembali dan ia pulih.”
  rationale: Konteks menggambarkan Simson yang sangat kehausan lalu segar kembali setelah minum, bukan seseorang yang bangkit dari kematian. Terjemahan mempertahankan ketegangan makna רוּחַ sambil tetap wajar dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Nama tempat ditransliterasikan secara sederhana; struktur kalimat dibuat alami bagi pembaca umum tanpa menghilangkan ambiguitas utama teks Ibrani.
