id: JDG.15.18
reference: Judges 15:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּצְמָא֮ מְאֹד֒ וַ/יִּקְרָ֤א אֶל יְהוָה֙ וַ/יֹּאמַ֔ר אַתָּה֙ נָתַ֣תָּ בְ/יַֽד עַבְדְּ/ךָ֔ אֶת הַ/תְּשׁוּעָ֥ה הַ/גְּדֹלָ֖ה הַ/זֹּ֑את וְ/עַתָּה֙ אָמ֣וּת בַּ/צָּמָ֔א וְ/נָפַלְתִּ֖י בְּ/יַ֥ד הָ/עֲרֵלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/018.yaml
  text: And he became very thirsty[a], and he called to Yahweh and said, “You have given this great deliverance by the hand of your servant[c][b], and now shall I die from thirst and fall into the hand of the uncircumcised?”
translation:
  language: id
  text: Ia menjadi sangat haus, lalu berseru kepada Yahweh[a] dan berkata, “Engkau telah memberikan kemenangan besar ini[b] melalui tangan hamba-Mu. Namun sekarang, haruskah aku mati kehausan dan jatuh ke tangan orang-orang yang tidak bersunat[c]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memanggil Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Kata yang diterjemahkan “kemenangan” juga dapat berarti “pembebasan” atau “penyelamatan.”
    reason: lexical_alternative
  - marker: c
    text: Sebutan “orang-orang yang tidak bersunat” di sini terutama menunjuk kepada orang Filistin, tetapi memakai istilah yang bermuatan perjanjian, bukan sekadar nama etnis.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּצְמָא מְאֹד
  choice: Ia menjadi sangat haus
  rationale: Bentuk verba dalam konteks ini menyatakan bahwa Simson mulai atau menjadi sangat haus; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan intensitas מְאֹד.
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: berseru kepada Yahweh
  rationale: קרא אל dalam konteks doa atau permohonan berarti memanggil atau berseru kepada seseorang. “Berseru kepada” paling alami dan sesuai dengan keadaan Simson yang mendesak.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks sumber tetap tampak.
- source_word: אַתָּה נָתַתָּ
  choice: Engkau telah memberikan
  rationale: Bentuk perfektif menunjuk pada tindakan yang sudah selesai tetapi masih sangat relevan dengan keadaan sekarang, yaitu kemenangan yang baru terjadi.
- source_word: בְיַד עַבְדְּךָ
  choice: melalui tangan hamba-Mu
  rationale: בְיַד dapat menandai sarana atau pelaku. Terjemahan ini mempertahankan citra “tangan” dalam bahasa Ibrani sekaligus menyatakan bahwa Yahweh berkarya melalui hamba-Nya.
- source_word: הַתְּשׁוּעָה הַגְּדֹלָה הַזֹּאת
  choice: kemenangan besar ini
  rationale: תְּשׁוּעָה dapat berarti pembebasan, penyelamatan, atau kemenangan. Dalam konteks kekalahan orang Filistin, “kemenangan” paling langsung dan alami, sedangkan keluasan maknanya dicatat dalam catatan kaki.
- source_word: וְעַתָּה
  choice: Namun sekarang
  rationale: Frasa ini menandai pertentangan tajam antara kemenangan besar yang baru diberikan Allah dan ancaman kematian karena haus. “Namun sekarang” menyampaikan fungsi wacananya secara alami.
- source_word: אָמוּת בַּצָּמָא
  choice: haruskah aku mati kehausan
  rationale: Walaupun tidak terdapat partikel tanya formal, konteks menunjukkan pertanyaan retoris. “Mati kehausan” merupakan padanan Indonesia yang alami untuk kematian akibat haus.
- source_word: וְנָפַלְתִּי בְּיַד
  choice: dan jatuh ke tangan
  rationale: Ungkapan ini berarti jatuh ke dalam kuasa pihak lain. Padanan Indonesia “jatuh ke tangan” mempertahankan metafora sekaligus menyampaikan makna idiomatisnya.
- source_word: הָעֲרֵלִים
  choice: orang-orang yang tidak bersunat
  rationale: Terjemahan harfiah ini mempertahankan sebutan yang bermuatan perjanjian dan bernada merendahkan, alih-alih langsung menggantinya dengan nama etnis “orang Filistin”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung. “Yahweh” mempertahankan nama pribadi dalam teks sumber dan tidak menggantinya dengan sebuah gelar.
- issue: Cakupan makna תְּשׁוּעָה
  choice: kemenangan
  alternative: pembebasan atau penyelamatan
  rationale: Konteks langsungnya adalah keberhasilan militer yang diberikan Allah, tetapi catatan kaki mempertahankan kemungkinan nuansa pembebasan atau penyelamatan agar dimensi teologis kata itu tidak hilang.
- issue: Daya perjanjian הָעֲרֵלִים
  choice: orang-orang yang tidak bersunat
  alternative: orang Filistin
  rationale: Sebutan dalam bahasa Ibrani menyoroti ketiadaan tanda perjanjian, bukan sekadar identitas etnis. Terjemahan harfiah mempertahankan ketegangan itu tanpa memasukkan penafsiran tambahan ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Struktur pertanyaan retoris dan pengulangan metafora “tangan” dipertahankan, sementara penghubung “Namun sekarang” dipakai untuk memperjelas kontras yang tersirat dalam bahasa Ibrani.
