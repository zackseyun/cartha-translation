  yaml_path: translation/ot/judges/015/012.yaml
  text: They said to him, “We have come down to bind you, to hand you over into the hand of the Philistines.” Samson said to them, “Swear to me that you yourselves will not attack me.”
translation:
  language: id
  text: Mereka berkata kepadanya, “Kami telah turun untuk mengikatmu dan menyerahkanmu ke dalam tangan orang Filistin.” Simson berkata kepada mereka, “Bersumpahlah kepadaku bahwa kalian sendiri tidak akan menyerangku.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְתִתְּךָ בְּיַד
  choice: menyerahkanmu ke dalam tangan
  rationale: Mempertahankan ungkapan Ibrani tentang penyerahan ke dalam kuasa pihak lain, sambil tetap jelas dalam bahasa Indonesia.
- source_word: תִּפְגְּעוּן בִּי
  choice: menyerang aku
  rationale: Kata פגע dalam konteks ini menyatakan tindakan menyerang atau mencelakai; “menyerang” alami dan tidak mempersempitnya pada cara tertentu.
- source_word: אַתֶּם
  choice: kalian sendiri
  rationale: Pronomina yang dinyatakan secara tegas memberi penekanan bahwa orang-orang Yehuda itu sendiri tidak boleh menyerang Simson.
theological_decisions:
- issue: Cakupan permintaan sumpah Simson
  choice: bahwa kalian sendiri tidak akan menyerang aku
  alternative: bahwa kalian sendiri tidak akan membunuh aku
  rationale: Teks memakai פגע, bukan kata khusus untuk “membunuh”; terjemahan mempertahankan cakupan tindakan yang lebih luas tanpa menambahkan batasan teologis atau naratif.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kalian” dipakai karena Simson berbicara kepada sekelompok orang; pengulangan “sendiri” mempertahankan penekanan sumber.
