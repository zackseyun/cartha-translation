  source_fidelity: 'Draf secara umum setia pada teks Ibrani: ''menyerahkanmu ke dalam tangan orang Filistin'' menyampaikan לְתִתְּךָ בְּיַד dengan baik, dan ''kalian sendiri tidak akan menyerangku'' mempertahankan penekanan אַתֶּם serta cakupan פֶּן תִּפְגְּעוּן בִּי. Namun, וַיֹּאמְרוּ ... יָרַדְנוּ (''kami telah turun'') belum diterjemahkan; ''Kami datang'' tidak menyatakan gerak turun yang eksplisit dalam sumber.'
