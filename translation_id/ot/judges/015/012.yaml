  revised_text: Mereka berkata kepadanya, “Kami telah turun untuk mengikatmu dan menyerahkanmu ke dalam tangan orang Filistin.” Simson berkata kepada mereka, “Bersumpahlah kepadaku bahwa kalian sendiri tidak akan menyerangku.”
