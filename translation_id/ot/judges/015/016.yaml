translation:
  language: id
  text: Lalu Simson berkata[a], “Dengan tulang rahang seekor keledai—sebuah tumpukan, dua tumpukan; dengan tulang rahang seekor keledai aku telah menjatuhkan seribu orang.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalam bahasa Ibrani terdapat permainan kata: kata untuk “keledai” memakai konsonan yang sama dengan bentuk yang di sini diterjemahkan “tumpukan.” Ungkapan “sebuah tumpukan, dua tumpukan” berusaha mempertahankan susunan permainan kata itu secara lebih harfiah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita; “lalu” menyampaikan perkembangan narasi secara alami dalam bahasa Indonesia.
- source_word: שִׁמְשׁוֹן
  choice: Simson
  rationale: Bentuk nama yang baku dan dikenal luas dalam Alkitab bahasa Indonesia.
- source_word: בִּלְחִי הַחֲמוֹר
  choice: Dengan rahang keledai
  rationale: לְחִי di sini menunjuk pada tulang rahang yang dipakai sebagai senjata, sedangkan בְּ menyatakan alat. “Rahang keledai” lebih alami daripada mengulang kata “tulang,” tanpa mengaburkan objek yang dimaksud.
- source_word: חֲמוֹר חֲמֹרָתָיִם
  choice: setumpuk, dua tumpuk
  rationale: Ungkapan ini memainkan kemiripan bunyi antara kata untuk “keledai” dan bentuk yang berkaitan dengan “tumpukan.” Terjemahan yang agak harfiah ini mempertahankan susunan puitis dan kejanggalan bermakna dalam bahasa Ibrani; permainan bunyinya dijelaskan dalam catatan kaki.
- source_word: הִכֵּיתִי
  choice: aku telah menewaskan
  rationale: נכה secara dasar berarti memukul atau menghantam, tetapi dalam konteks pertempuran ini hasilnya adalah kematian. “Menewaskan” menyampaikan maksud kontekstual secara wajar, sementara aspek perfektif dicerminkan dengan “telah.”
- source_word: אֶלֶף אִישׁ
  choice: seribu orang
  rationale: אִישׁ dipakai secara kolektif untuk para laki-laki yang dilawan Simson. Dalam bahasa Indonesia, “seribu orang” alami dan tidak mengubah kenyataan bahwa konteksnya adalah para petempur laki-laki.
