translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Rujukan pronomina diperjelas agar pembaca memahami bahwa ayah perempuan itu mengambil istri Simson dan memberikannya kepada kawannya. Semua penanda catatan kaki ditempatkan dalam teks utama.
