  to: Lalu orang Filistin itu berkata, “Siapa yang melakukan ini?” Mereka menjawab, “Simson, menantu laki-laki orang Timna itu, karena ayah perempuan itu telah mengambil istri Simson dan memberikannya kepada kawan Simson[a].” Maka orang Filistin itu pergi dan membakar perempuan itu dan ayahnya dengan api[b].
