base_translation:
  language: en
  yaml_path: translation/ot/judges/015/006.yaml
  text: Then the Philistines said[a], “Who did this?” And they said, “Samson, the Timnite’s son-in-law[b], because he took his wife and gave her to his companion.” So the Philistines went up and burned her and her father with fire.
translation:
  language: id
  text: Lalu orang Filistin itu berkata, “Siapa yang melakukan ini?” Mereka menjawab, “Simson, menantu laki-laki orang Timna itu, karena ayah perempuan itu telah mengambil istri Simson dan memberikannya kepada kawan Simson[a].” Maka orang Filistin itu pergi dan membakar perempuan itu dan ayahnya dengan api[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sahabat Simson.” Istilah Ibrani ini dapat berarti kawan atau sahabat; dalam konteks pernikahan, sebagian orang memahaminya secara lebih khusus sebagai pengiring atau pendamping pengantin laki-laki.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “membakar perempuan itu dan ayahnya dengan api.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְלִשְׁתִּים
  choice: orang Filistin
  rationale: Etnonim baku dalam bahasa Indonesia; bentuk kolektif 'orang Filistin' alami tanpa artikel.
- source_word: מִי עָשָׂה זֹאת
  choice: Siapa yang melakukan ini?
  rationale: Menyampaikan pertanyaan langsung dengan bentuk lampau naratif yang alami dalam bahasa Indonesia.
- source_word: חֲתַן הַתִּמְנִי
  choice: menantu laki-laki orang Timna itu
  rationale: חָתָן dapat berarti pengantin laki-laki atau menantu laki-laki; dalam hubungan dengan ayah perempuan itu, 'menantu laki-laki' paling jelas, sedangkan הַתִּמְנִי menunjuk orang yang berasal dari Timna.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan mengapa Simson disebut sebagai pelaku; 'sebab' ringkas dan sesuai dengan ragam naratif bermartabat.
- source_word: לָקַח אֶת אִשְׁתּוֹ
  choice: orang itu telah mengambil istri Simson
  rationale: Subjek tersiratnya adalah orang Timna, yaitu ayah perempuan tersebut. Penyebutan 'orang itu' dan 'istri Simson' menghindari ketidakjelasan rujukan pronomina dalam bahasa Indonesia tanpa mengubah isi.
- source_word: וַיִּתְּנָהּ לְמֵרֵעֵהוּ
  choice: dan memberikannya kepada kawannya
  rationale: מֵרֵעַ berarti kawan atau sahabat. 'Kawan' mempertahankan keluasan makna dan tidak memaksakan jabatan khusus dalam pesta pernikahan.
- source_word: וַיַּעֲלוּ
  choice: datang
  rationale: Kata kerja gerak Ibrani secara harfiah berarti 'naik/pergi naik', tetapi dalam bahasa Indonesia lokasi dan arah tidak cukup jelas untuk memakai 'naik'; 'datang' menyampaikan gerak menuju tempat kejadian secara alami.
- source_word: וַיִּשְׂרְפוּ אוֹתָהּ וְאֶת אָבִיהָ בָּאֵשׁ
  choice: membakar perempuan itu bersama ayahnya dengan api
  rationale: Mempertahankan penyebutan alat secara eksplisit, 'dengan api', serta tidak menambahkan 'sampai mati', walaupun akibat itu tersirat kuat dalam konteks.
