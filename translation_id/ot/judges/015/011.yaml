  text: וַ/יֵּרְד֡וּ שְׁלֹשֶׁת֩ אֲלָפִ֨ים אִ֜ישׁ מִֽ/יהוּדָ֗ה אֶל סְעִיף֮ סֶ֣לַע עֵיטָם֒ וַ/יֹּאמְר֣וּ לְ/שִׁמְשׁ֗וֹן הֲ/לֹ֤א יָדַ֨עְתָּ֙ כִּֽי מֹשְׁלִ֥ים בָּ֨/נוּ֙ פְּלִשְׁתִּ֔ים וּ/מַה זֹּ֖את עָשִׂ֣יתָ לָּ֑/נוּ וַ/יֹּ֣אמֶר לָ/הֶ֔ם כַּ/אֲשֶׁר֙ עָ֣שׂוּ לִ֔/י כֵּ֖ן עָשִׂ֥יתִי לָ/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/011.yaml
  text: Then three thousand men of Judah went down to the cleft of the rock of Etam and said to Samson[a], “Do you not know that the Philistines are ruling over us? What then is this that you have done to us?” And he said to them, “As they did to me, so I have done to them.”
translation:
  language: id
  text: Lalu tiga ribu orang laki-laki dari Yehuda turun ke celah batu karang Etam[a] dan berkata kepada Simson, “Tidakkah engkau tahu bahwa orang Filistin berkuasa atas kami? Jadi, apa yang telah kaulakukan terhadap kami ini?” Jawabnya kepada mereka, “Seperti yang mereka lakukan terhadapku, demikianlah yang kulakukan terhadap mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “rekahan pada batu karang Etam.”'
    reason: Alternatif leksikal bagi סְעִיף, yang dapat menunjuk pada celah atau rekahan batu.
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: turun
  rationale: Mempertahankan arah gerak yang dinyatakan oleh ירד, sekaligus alami dalam narasi bahasa Indonesia.
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ מִיהוּדָה
  choice: tiga ribu orang dari Yehuda
  rationale: Menyampaikan kelompok terhitung yang berasal dari suku atau wilayah Yehuda; 'orang' wajar dalam bahasa Indonesia dan konteksnya menunjukkan para laki-laki.
- source_word: אֶל סְעִיף סֶלַע עֵיטָם
  choice: ke celah batu karang Etam
  rationale: סְעִיף dalam konteks topografi menunjuk pada celah atau rekahan; סֶלַע diterjemahkan 'batu karang', sedangkan עֵיטָם ditransliterasikan sebagai Etam.
- source_word: הֲלֹא יָדַעְתָּ
  choice: Tidakkah engkau tahu
  rationale: Mempertahankan bentuk pertanyaan retoris dan anggapan bahwa keadaan tersebut sudah semestinya diketahui Simson.
- source_word: כִּי מֹשְׁלִים בָּנוּ פְּלִשְׁתִּים
  choice: bahwa orang Filistin berkuasa atas kami
  rationale: Partisip מֹשְׁלִים menyatakan kekuasaan yang sedang berlangsung; 'berkuasa atas kami' menyampaikan dominasi politik secara alami.
- source_word: וּמַה זֹּאת עָשִׂיתָ לָּנוּ
  choice: Jadi, apa yang telah kaulakukan terhadap kami ini?
  rationale: '''Jadi'' menangkap hubungan wacana dengan pertanyaan sebelumnya, sedangkan ''terhadap kami'' mempertahankan keluhan bahwa tindakan Simson berdampak pada mereka.'
- source_word: כַּאֲשֶׁר עָשׂוּ לִי כֵּן עָשִׂיתִי לָהֶם
  choice: Seperti yang mereka lakukan terhadapku, demikianlah yang kulakukan terhadap mereka
  rationale: Mempertahankan susunan korelatif Ibrani dan menyajikan alasan pembalasan Simson tanpa menambahkan penilaian moral.
theological_decisions:
- issue: Nada jawaban Simson sebagai pembalasan timbal balik
  choice: 'Jawaban diterjemahkan sebagai pernyataan langsung: “Seperti yang mereka lakukan terhadapku, demikianlah yang kulakukan terhadap mereka.”'
  alternative: Menafsirkannya secara eksplisit sebagai pembalasan yang benar atau sebagai dendam pribadi yang tercela.
  rationale: Teks melaporkan alasan Simson tanpa secara eksplisit membenarkan atau mengecamnya; terjemahan mempertahankan ketegangan moral dan teologis itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan 'engkau' sesuai untuk dialog naratif Alkitab tanpa terdengar terlalu arkais. Bentuk terikat 'kaulakukan', 'terhadapku', dan 'kulakukan' mengikuti ejaan baku serta menjaga kelancaran kalimat.
