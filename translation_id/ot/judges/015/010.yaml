translation:
  language: id
  text: Orang-orang Yehuda berkata, “Mengapa kalian datang melawan kami?” Mereka menjawab, “Kami datang untuk mengikat Simson dan melakukan kepadanya seperti yang ia lakukan kepada kami.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ יְהוּדָה
  choice: Orang-orang Yehuda
  rationale: Kata אִישׁ berbentuk tunggal, tetapi berfungsi kolektif dan diikuti verba jamak. Bentuk ini mempertahankan rujukan kepada kelompok laki-laki Yehuda secara wajar dalam bahasa Indonesia.
- source_word: לָמָה
  choice: Mengapa
  rationale: Padanan langsung dan alami untuk pertanyaan mengenai alasan.
- source_word: עֲלִיתֶם עָלֵינוּ
  choice: kalian maju menyerang kami
  rationale: Gabungan עלה dengan עַל menyatakan gerakan bermusuhan melawan pihak lain. 'Maju menyerang' mempertahankan unsur gerak sekaligus menjelaskan daya adversatif idiom Ibrani secara alami.
- source_word: עָלִינוּ
  choice: Kami maju
  rationale: Verba עלה diulang dari pertanyaan sebelumnya. Pengulangan 'maju' menjaga kaitan leksikal dalam dialog tanpa memaksakan gambaran geografis yang tidak pasti.
- source_word: לֶאֱסוֹר
  choice: untuk mengikat
  rationale: אָסַר berarti mengikat, membelenggu, atau menahan; 'mengikat' paling langsung dan sesuai dengan konteks penangkapan Simson.
- source_word: שִׁמְשׁוֹן
  choice: Simson
  rationale: Mengikuti bentuk nama yang sudah baku dan dikenal luas dalam bahasa Indonesia.
- source_word: לַעֲשׂוֹת לוֹ כַּאֲשֶׁר עָשָׂה לָנוּ
  choice: memperlakukannya sama seperti ia memperlakukan kami
  rationale: Secara harfiah ungkapan ini berarti 'melakukan kepadanya seperti yang dilakukannya kepada kami.' 'Memperlakukan' menyampaikan tindakan timbal balik secara alami dan tetap mempertahankan simetri pembalasan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti jamak 'kalian' dipakai untuk membedakan pihak Filistin yang diajak bicara dari kelompok Yehuda; 'ia' menjaga register naratif yang formal tetapi tetap mudah dipahami.
