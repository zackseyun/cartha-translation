  text: And he judged Israel in the days of the Philistines twenty years[a].
translation:
  language: id
  text: Ia menjadi hakim atas Israel pada zaman orang Filistin selama dua puluh tahun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia memimpin Israel selama dua puluh tahun”; kata kerja Ibrani ini dapat menunjuk pada kegiatan memimpin atau memerintah secara lebih luas, bukan hanya mengadili perkara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: Ia menjadi hakim atas
  rationale: Dalam kitab Hakim-Hakim, שׁפט menunjuk pada pelaksanaan peran hakim yang mencakup kepemimpinan, bukan hanya pengambilan keputusan di pengadilan. Ungkapan ini mempertahankan istilah kunci kitab tersebut sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Nama diri dalam teks sumber dipertahankan dan menjadi pelengkap alami bagi ungkapan 'menjadi hakim atas'.
- source_word: בִּימֵי
  choice: pada zaman
  rationale: Menyampaikan idiom temporal Ibrani 'pada hari-hari' secara wajar dan bermartabat dalam bahasa Indonesia modern.
- source_word: פְלִשְׁתִּים
  choice: orang Filistin
  rationale: Sebutan baku bagi kelompok bangsa tersebut dalam bahasa Indonesia.
- source_word: עֶשְׂרִים שָׁנָה
  choice: selama dua puluh tahun
  rationale: Kata 'selama' memperjelas bahwa frasa ini menyatakan durasi masa kepemimpinannya.
theological_decisions:
- issue: Cakupan peran Simson dalam שׁפט
  choice: menjadi hakim atas Israel
  alternative: memimpin Israel; memerintah Israel
  rationale: Pilihan ini menjaga hubungan leksikal dan sastra dengan tema para hakim dalam kitab ini tanpa mempersempit perannya menjadi fungsi pengadilan modern atau memperluasnya menjadi pemerintahan politik yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Susunan 'pada zaman orang Filistin selama dua puluh tahun' mempertahankan urutan unsur teks Ibrani sambil menandai durasi secara jelas.
