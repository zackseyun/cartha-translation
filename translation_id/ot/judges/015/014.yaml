  variant: modern standard Indonesian
source:
  edition: WLC
  text: הוּא בָ֣א עַד לֶ֔חִי וּ/פִלְשִׁתִּ֖ים הֵרִ֣יעוּ לִ/קְרָאת֑/וֹ וַ/תִּצְלַ֨ח עָלָ֜י/ו ר֣וּחַ יְהוָ֗ה וַ/תִּהְיֶ֨ינָה הָ/עֲבֹתִ֜ים אֲשֶׁ֣ר עַל זְרוֹעוֹתָ֗י/ו כַּ/פִּשְׁתִּים֙ אֲשֶׁ֣ר בָּעֲר֣וּ בָ/אֵ֔שׁ וַ/יִּמַּ֥סּוּ אֱסוּרָ֖י/ו מֵ/עַ֥ל יָדָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/014.yaml
  text: When he came as far as Lehi[a], the Philistines shouted as they came to meet him. Then the Spirit of Yahweh rushed upon him, and the ropes that were on his arms became like flax that has been burned in the fire, and his bonds melted off his hands.
translation:
  language: id
  text: Ketika ia sampai di Lehi[a], orang-orang Filistin bersorak sambil maju menyongsongnya. Lalu Roh Yahweh berkuasa dengan dahsyat atasnya. Tali-tali yang mengikat lengannya menjadi seperti serat rami yang terbakar dalam api, dan ikatan-ikatannya meleleh dari tangannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lehi adalah nama tempat. Kata Ibrani yang sama juga berarti “tulang rahang”, motif penting dalam kisah ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחִי
  choice: Lehi
  rationale: Konteks menunjukkan nama tempat. Makna leksikal yang berkaitan dengan 'tulang rahang' tetap dicatat karena penting dalam kisah di sekitarnya.
- source_word: הֵרִיעוּ לִקְרָאתוֹ
  choice: bersorak sambil maju menyongsongnya
  rationale: Mempertahankan seruan keras dan gerak konfrontatif untuk menemui Simson tanpa mempersempitnya secara pasti menjadi 'pekik perang'.
- source_word: וַתִּצְלַח עָלָיו רוּחַ יְהוָה
  choice: Roh Yahweh datang dengan dahsyat atas dirinya
  rationale: Ungkapan צלח ... על menggambarkan pemberdayaan yang mendadak dan kuat. Rumusan ini alami dalam bahasa Indonesia serta tidak menyiratkan bahwa Roh menyerang Simson.
- source_word: הָעֲבֹתִים אֲשֶׁר עַל זְרוֹעוֹתָיו
  choice: tali-tali yang melilit lengannya
  rationale: עֲבֹתִים adalah tali pengikat, sedangkan זְרוֹעוֹתָיו berarti lengannya. 'Melilit' mengungkapkan fungsi tali pada lengan secara wajar.
- source_word: כַּפִּשְׁתִּים אֲשֶׁר בָּעֲרוּ בָאֵשׁ
  choice: seperti serat rami yang terbakar dalam api
  rationale: פִשְׁתִּים menunjuk pada rami/flaks; 'serat rami' membuat gambaran bahan tali lebih mudah dipahami pembaca Indonesia.
- source_word: וַיִּמַּסּוּ אֱסוּרָיו מֵעַל יָדָיו
  choice: ikatan-ikatannya luruh dari tangannya
  rationale: מסס secara harfiah menggambarkan meleleh atau larut. 'Luruh' mempertahankan gambaran hilangnya kekuatan ikatan sekaligus terdengar alami bagi tali yang terlepas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. 'Yahweh' mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar.
- issue: Gambaran pemberdayaan ilahi atas Simson
  choice: Roh Yahweh datang dengan dahsyat atas dirinya
  alternative: Roh Yahweh berkuasa atas dirinya; Roh Yahweh datang dengan penuh kuasa atas dirinya
  rationale: Pilihan ini mempertahankan daya dan kemendadakan idiom Ibrani tanpa memasukkan kategori teologis yang tidak dinyatakan dalam narasi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Istilah 'menyongsong', 'dahsyat', dan 'luruh' dipilih agar hidup tetapi tetap mudah dipahami; struktur kalimat dipecah untuk kelancaran.
