revisions:
- from: Ketika ia sampai di Lehi[a], orang-orang Filistin bersorak sambil maju menyongsongnya. Lalu Roh Yahweh datang dengan dahsyat atas dirinya. Tali-tali yang melilit lengannya menjadi seperti serat rami yang terbakar dalam api, dan ikatan-ikatannya luruh dari tangannya.
  to: Ketika ia sampai di Lehi[a], orang-orang Filistin bersorak sambil maju menyongsongnya. Lalu Roh Yahweh berkuasa dengan dahsyat atasnya. Tali-tali yang mengikat lengannya menjadi seperti serat rami yang terbakar dalam api, dan ikatan-ikatannya meleleh dari tangannya.
  rationale: Revisi terbatas pada peningkatan kesetiaan terhadap metafora “meleleh”, penghindaran spesifikasi yang tidak diperlukan pada cara tali mengikat lengan, dan pelancaran idiom tentang Roh Yahweh. Nama tempat, nama ilahi, serta ambiguitas dan register naratif teks tetap dipertahankan.
