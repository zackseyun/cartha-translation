  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּעֲל֣וּ פְלִשְׁתִּ֔ים וַֽ/יַּחֲנ֖וּ בִּ/יהוּדָ֑ה וַ/יִּנָּטְשׁ֖וּ בַּ/לֶּֽחִי׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/015/009.yaml
  text: Then the Philistines went up and camped in Judah[a], and spread out at Lehi.
translation:
  language: id
  text: Kemudian orang Filistin maju dan berkemah di wilayah Yehuda, lalu menyebar di Lehi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menggelar pasukan di Lehi.” Kata kerja Ibrani yang digunakan dapat menggambarkan pasukan yang menyebar dalam formasi militer.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: maju
  rationale: Kata עלה secara harfiah menyatakan gerak naik, tetapi dalam konteks pasukan yang bergerak menuju wilayah Yehuda, “maju” terdengar alami dalam bahasa Indonesia dan tetap mempertahankan nuansa pergerakan militer tanpa menentukan rute geografis.
- source_word: פְלִשְׁתִּים
  choice: orang Filistin
  rationale: Sebutan baku dalam bahasa Indonesia bagi kelompok bangsa ini.
- source_word: וַיַּחֲנוּ
  choice: berkemah
  rationale: Kata חנה berarti mendirikan atau menempati perkemahan; “berkemah” jelas dan wajar dalam narasi modern.
- source_word: בִּיהוּדָה
  choice: di wilayah Yehuda
  rationale: Preposisi ב terutama menunjukkan lokasi. Penambahan “wilayah” memperjelas bahwa Yehuda di sini merupakan kawasan, tanpa mengubahnya menjadi makna “melawan Yehuda.”
- source_word: וַיִּנָּטְשׁוּ
  choice: menyebar
  rationale: Dalam konteks ini נטשׁ menggambarkan pasukan yang membentang atau menggelar diri di suatu kawasan; “menyebar” mempertahankan nuansa tersebut tanpa memakai istilah militer yang terlalu teknis.
- source_word: בַּלֶּחִי
  choice: di Lehi
  rationale: Lehi adalah nama tempat, dan preposisi ב secara alami diterjemahkan “di.”
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. “Maju” serta “menyebar” menyampaikan konteks militer dengan jelas tanpa menjadi terlalu teknis; nama tempat Lehi dipertahankan.
