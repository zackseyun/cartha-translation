  yaml_path: translation/ot/judges/015/003.yaml
  text: And Samson said to them[b][a], “This time I am blameless with respect to the Philistines when I do them harm.”
translation:
  language: id
  text: Lalu Simson berkata kepada mereka, “Kali ini aku tidak bersalah terhadap orang Filistin[a] ketika aku mencelakai mereka[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “aku bebas dari kesalahan sehubungan dengan orang Filistin.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “melakukan yang jahat terhadap mereka”; dalam konteks ini ungkapan itu berarti mendatangkan celaka atau kerugian.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “lalu” wajar dalam bahasa Indonesia tanpa memberi penekanan temporal yang berlebihan.
- source_word: לָהֶם
  choice: kepada mereka
  rationale: Mencerminkan preposisi לְ dengan sufiks orang ketiga jamak laki-laki; acuannya ditentukan oleh konteks.
- source_word: שִׁמְשׁוֹן
  choice: Simson
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: נִקֵּיתִי
  choice: aku tidak bersalah
  rationale: Bentuk dari נקה menyatakan bebas dari kesalahan atau tanggung jawab; frasa ini menyampaikan pengakuan Simson bahwa tindakannya kali ini tidak membuatnya patut dipersalahkan.
- source_word: הַפַּעַם
  choice: Kali ini
  rationale: Ungkapan temporal ini menandai tahap baru dalam pertikaian.
- source_word: מִפְּלִשְׁתִּים
  choice: terhadap orang Filistin
  rationale: Setelah נקה, preposisi מִן menyatakan kebebasan dari kesalahan dalam hubungan dengan pihak tertentu; “terhadap” alami dan tidak menyiratkan bahwa orang Filistinlah yang secara resmi membebaskannya.
- source_word: כִּי
  choice: apabila
  rationale: Di sini כִּי dapat memperkenalkan keadaan yang menyertai atau akan membuktikan klaim Simson. “Apabila” mengungkapkan tindakan yang segera dimaksudkannya sambil mempertahankan hubungan kalimat yang tidak sepenuhnya eksplisit.
- source_word: עֹשֶׂה אֲנִי
  choice: aku mencelakai
  rationale: Partisip Qal dengan pronomina eksplisit dapat menunjuk tindakan yang sedang berlangsung atau segera dilakukan; dalam konteks ini bentuk Indonesia tersebut secara alami merujuk pada niat yang akan dilaksanakan.
- source_word: עִמָּם
  choice: mereka
  rationale: Dalam konstruksi עשה עם, pihak yang dikenai tindakan paling alami menjadi objek dalam bahasa Indonesia.
- source_word: רָעָה
  choice: mencelakai
  rationale: רָעָה secara harfiah berkaitan dengan ‘kejahatan’ atau ‘hal buruk’, tetapi dalam konteks pembalasan konkret menunjuk tindakan yang merugikan; “mencelakai” tidak menambahkan penilaian moral yang lebih tegas daripada teks.
