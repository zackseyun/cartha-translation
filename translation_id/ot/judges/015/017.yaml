base_translation:
  language: en
  yaml_path: translation/ot/judges/015/017.yaml
  text: And when he had finished speaking[a], he threw the jawbone from his hand, and he called that place Ramath-lehi.
translation:
  language: id
  text: Setelah selesai berbicara, ia melemparkan tulang rahang itu dari tangannya, lalu menamai tempat itu Ramat-Lehi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ramat-Lehi kemungkinan berarti “Bukit Tulang Rahang” atau “Ketinggian Tulang Rahang”, dan mempertahankan permainan kata dengan lehi, “rahang” atau “tulang rahang”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכַלֹּתוֹ לְדַבֵּר
  choice: Setelah selesai berbicara
  rationale: Konstruksi כְּ dengan infinitif כלה dan לְדַבֵּר menyatakan waktu, yakni ketika atau setelah ia selesai berbicara. 'Setelah selesai berbicara' alami dalam bahasa Indonesia dan memperjelas urutan tindakan tanpa menambah makna.
- source_word: וַיַּשְׁלֵךְ
  choice: ia melemparkan
  rationale: Kata kerja ini berarti melempar atau membuang. 'Melemparkan' mempertahankan tindakan konkret tanpa menyiratkan kekuatan berlebihan.
- source_word: הַלְּחִי
  choice: tulang rahang itu
  rationale: Dalam konteks, yang dimaksud ialah tulang rahang keledai yang dipakai Simson sebagai senjata. Bentuk definit diterjemahkan dengan 'itu'.
- source_word: מִיָּדוֹ
  choice: dari tangannya
  rationale: Terjemahan langsung dan wajar dari preposisi מִן dengan 'tangannya'.
- source_word: וַיִּקְרָא לַמָּקוֹם הַהוּא
  choice: lalu menamai tempat itu
  rationale: Dalam konstruksi pemberian nama tempat, קרא dapat bermakna 'menamai'. Pilihan ini lebih alami daripada terjemahan harfiah 'memanggil tempat itu'.
- source_word: רָמַת לֶחִי
  choice: Ramat-Lehi
  rationale: Nama tempat ditransliterasikan dalam teks utama. Makna dan permainan katanya dengan לֶחִי, 'rahang/tulang rahang', dijelaskan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan naratif yang alami dan bermartabat. Nama tempat ditransliterasikan, sedangkan permainan kata Ibraninya dipertahankan melalui catatan kaki.
