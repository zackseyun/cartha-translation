  text: And he found a fresh jawbone of a donkey[a], and he reached out his hand and took it, and with it he struck down a thousand men.
translation:
  language: id
  text: Ia menemukan tulang rahang keledai yang masih segar[a]. Ia mengulurkan tangannya, mengambilnya, lalu dengan tulang itu ia menewaskan seribu orang laki-laki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: "tulang rahang keledai yang baru." Kata sifat Ibrani yang dipakai dapat berarti "segar" atau "baru."'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצָא
  choice: Ia menemukan
  rationale: Bentuk wayyiqtol dari מצא menyatakan peristiwa lampau dalam alur narasi; "menemukan" adalah padanan Indonesia yang lugas.
- source_word: לְחִי חֲמוֹר
  choice: tulang rahang keledai
  rationale: לְחִי dapat menunjuk rahang atau tulang rahang; konteksnya menampilkan benda itu sebagai senjata, sehingga "tulang rahang" paling tepat dan alami.
- source_word: טְרִיָּה
  choice: yang masih segar
  rationale: Kata sifat ini menunjukkan bahwa tulang tersebut belum kering atau rapuh. "Masih segar" mempertahankan nuansa keadaan benda tanpa mempersempitnya menjadi "masih basah".
- source_word: וַיִּשְׁלַח יָדוֹ
  choice: Ia mengulurkan tangannya
  rationale: Terjemahan ini mempertahankan gambaran konkret idiom Ibrani sekaligus wajar dalam narasi Indonesia.
- source_word: וַיִּקָּחֶהָ
  choice: mengambilnya
  rationale: Akhiran feminin mengacu kembali kepada tulang rahang; "mengambilnya" merupakan padanan langsung dan netral.
- source_word: וַיַּךְ בָּהּ
  choice: dengan tulang itu ia menewaskan
  rationale: נכה berarti memukul atau menghantam dan dalam konteks pertempuran ini berakibat fatal. "Menewaskan" menyampaikan hasil kontekstualnya dengan jelas, sedangkan alatnya disebut eksplisit agar rujukan pronominal alami dalam bahasa Indonesia.
- source_word: אֶלֶף אִישׁ
  choice: seribu orang
  rationale: אִישׁ dipakai secara distributif sesudah bilangan. Dalam bahasa Indonesia, "seribu orang" alami dan tidak menghapus konteks bahwa mereka adalah para petempur laki-laki.
