    rationale: וַיְשַׁלַּח memiliki objek tersirat yang dirujuk dari konteks sebelumnya, yaitu hewan-hewan yang jumlahnya banyak. “Melepaskan mereka” menyampaikan rujukan plural ini tanpa memasukkan nomina yang tidak disebut dalam ayat.
  - severity: low
    issue: “Gandum yang belum dituai” kurang langsung untuk קָמָה.
    rationale: קָמָה secara khusus menunjuk gandum yang masih berdiri/tegak. “Belum dituai” tidak salah secara hasil, tetapi “masih berdiri” lebih dekat dengan citra dan kontras agraris teks Ibrani.
