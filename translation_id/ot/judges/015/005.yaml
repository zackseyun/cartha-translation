base_translation:
  language: en
  yaml_path: translation/ot/judges/015/005.yaml
  text: He set fire to the torches and let them go into the standing grain of the Philistines[a], and burned up the shocks and the standing grain[b], and even the olive groves.
translation:
  language: id
  text: Ia menyalakan api pada obor-obor itu[a], lalu melepaskan mereka ke tengah gandum orang Filistin yang masih berdiri. Dengan demikian, ia membakar habis tumpukan gandum, gandum yang masih berdiri, bahkan kebun-kebun zaitun.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “suluh-suluh itu.”
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dari tumpukan gandum sampai gandum yang masih berdiri dan sampai kebun zaitun.” Terjemahan utama menyajikan cakupan kebakaran itu sebagai daftar segala sesuatu yang terbakar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּבְעֶר אֵשׁ בַּלַּפִּידִים
  choice: menyalakan api pada obor-obor itu
  rationale: Bentuk Hifil dari בער menyatakan tindakan menyalakan atau menyulut, sedangkan לַפִּידִים berarti obor atau suluh. Ungkapan ini mempertahankan unsur ‘api’ dan hubungan langsungnya dengan obor.
- source_word: וַיְשַׁלַּח
  choice: lalu melepaskannya
  rationale: Kata kerja ini dapat berarti ‘mengirim’ atau ‘melepaskan’. Bentuk objek yang tidak dinyatakan dalam bahasa Ibrani dibiarkan bergantung pada konteks sebelumnya; akhiran -nya menghasilkan bahasa Indonesia yang alami tanpa menambahkan ‘binatang-binatang itu’ ke dalam ayat.
- source_word: בְּקָמוֹת פְּלִשְׁתִּים
  choice: ke tengah gandum orang Filistin yang belum dituai
  rationale: קָמָה menunjuk pada tanaman gandum yang masih tegak di ladang. ‘Gandum ... yang belum dituai’ menyampaikan makna pertanian itu secara jelas bagi pembaca modern.
- source_word: וַיַּבְעֵר
  choice: ia membakar habis
  rationale: Pemakaian kedua בער menggambarkan akibat pembakaran. ‘Membakar habis’ menyatakan kehancuran yang ditimbulkan tanpa mengalihkan pelaku gramatikal dari Simson kepada api.
- source_word: מִגָּדִישׁ
  choice: tumpukan gandum
  rationale: גָּדִישׁ adalah tumpukan hasil panen atau gandum yang telah dikumpulkan. Istilah ini jelas dan membedakannya dari gandum yang masih tumbuh.
- source_word: וְעַד קָמָה
  choice: gandum yang belum dituai
  rationale: Terjemahan ini mempertahankan perbedaan antara hasil panen yang sudah ditumpuk dan tanaman yang masih berada di ladang.
- source_word: וְעַד כֶּרֶם זָיִת
  choice: bahkan kebun-kebun zaitun
  rationale: כֶּרֶם dengan זַיִת menunjuk pada lahan budidaya pohon zaitun. ‘Kebun-kebun zaitun’ merupakan padanan Indonesia yang alami, dan ‘bahkan’ menyampaikan perluasan klimaks kerusakan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. ‘Gandum yang belum dituai’ dipilih sebagai ungkapan yang mudah dipahami untuk tanaman gandum yang masih berdiri; pengulangan istilah itu menjaga kontras dengan ‘tumpukan gandum’. Ambiguitas objek tersirat pada וַיְשַׁלַּח tidak dijelaskan secara berlebihan dalam teks utama.
