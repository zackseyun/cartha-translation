base_translation:
  language: en
  yaml_path: translation/ot/judges/016/020.yaml
  text: And she said[a], “The Philistines are upon you, Samson!” And he awoke from his sleep and said, “I will go out as at other times and shake myself free.” But he did not know that Yahweh had departed from him.
translation:
  language: id
  text: Lalu perempuan itu berkata, “Orang-orang Filistin menyerangmu, Simson!” Simson pun terbangun dari tidurnya dan berkata, “Aku akan keluar seperti yang sudah-sudah dan melepaskan diri[a].” Namun, ia tidak tahu bahwa Yahweh telah meninggalkannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengguncangkan diri”; maksudnya kemungkinan mengguncangkan diri hingga terlepas, seperti pada kejadian-kejadian sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: Orang Filistin menyerangmu
  rationale: Ungkapan עַל dengan pelaku yang bermusuhan menunjukkan serangan atau upaya penangkapan yang segera terjadi. Terjemahan ini alami dalam bahasa Indonesia dan mempertahankan desakan peringatan Delila.
- source_word: וַיִּקַץ מִשְּׁנָתוֹ
  choice: terbangun dari tidurnya
  rationale: Menerjemahkan secara langsung verba יקץ dan frasa preposisionalnya dalam bahasa Indonesia modern yang wajar.
- source_word: אֵצֵא
  choice: Aku akan keluar
  rationale: Mempertahankan arti dasar יצא tanpa menambahkan bahwa Simson keluar untuk menghadapi atau melawan para penyerang, sebab maksud itu hanya tersirat.
- source_word: כְּפַעַם בְּפַעַם
  choice: seperti yang sudah-sudah
  rationale: Idiom ini menunjuk pada kejadian serupa yang berulang pada masa sebelumnya. Ungkapan Indonesia ini menyampaikan keyakinan Simson bahwa kali ini akan sama seperti sebelumnya.
- source_word: וְאִנָּעֵר
  choice: dan melepaskan diri
  rationale: Bentuk Niphal dari נער di sini kemungkinan menggambarkan Simson mengguncangkan dirinya hingga terlepas atau membebaskan diri. Terjemahan utama menyampaikan hasil yang tersirat, sedangkan gambaran harfiahnya dipertahankan dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi Allah dalam teks Ibrani tetap tampak.
- source_word: סָר מֵעָלָיו
  choice: telah meninggalkannya
  rationale: סור dengan מֵעַל menyatakan penarikan atau kepergian. Pilihan ini alami dan khidmat dalam bahasa Indonesia tanpa menjelaskan sifat, mekanisme, atau lamanya kepergian ilahi tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. Bentuk “Yahweh” mempertahankan nama ilahi, bukan menggantinya dengan gelar.
- issue: Sifat kepergian Yahweh dari Simson
  choice: Yahweh telah meninggalkannya
  alternative: kuasa Yahweh tidak lagi menyertainya
  rationale: Ayat ini menyatakan bahwa Yahweh telah pergi dari Simson, tetapi tidak merinci apakah yang dimaksud khususnya ialah kuasa, perkenanan, atau kategori teologis lain. Terjemahan tidak menambahkan penjelasan yang tidak dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk “seperti yang sudah-sudah” dipilih karena alami bagi pembaca umum, sedangkan “Namun” menandai peralihan naratif yang tragis tanpa menambah tafsiran.
