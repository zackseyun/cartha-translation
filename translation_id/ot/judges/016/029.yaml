- from: Lalu Simson mencengkeram kedua tiang yang di tengah[a], yang di atasnya bangunan itu berdiri. Ia menumpukan tubuhnya pada kedua tiang itu[b], yang satu dengan tangan kanannya dan yang satu lagi dengan tangan kirinya.
  to: Lalu Simson mencengkeram kedua tiang yang di tengah[a], yang menopang bangunan itu. Ia bertumpu pada kedua tiang itu[b], yang satu di sebelah kanannya dan yang satu lagi di sebelah kirinya.
  rationale: Revisi mempertahankan makna struktural dan urutan tindakan dalam teks Ibrani, sambil menghindari penetapan bahwa 'kanan' dan 'kiri' pasti merujuk pada tangan Simson. Pilihan 'bertumpu pada' juga lebih alami dalam bahasa Indonesia baku dan tetap mencakup nuansa bersandar/menopang diri.
