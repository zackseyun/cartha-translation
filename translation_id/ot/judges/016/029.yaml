  text: וַ/יִּלְפֹּ֨ת שִׁמְשׁ֜וֹן אֶת שְׁנֵ֣י עַמּוּדֵ֣י הַ/תָּ֗וֶךְ אֲשֶׁ֤ר הַ/בַּ֨יִת֙ נָכ֣וֹן עֲלֵי/הֶ֔ם וַ/יִּסָּמֵ֖ךְ עֲלֵי/הֶ֑ם אֶחָ֥ד בִּ/ימִינ֖/וֹ וְ/אֶחָ֥ד בִּ/שְׂמֹאלֽ/וֹ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/029.yaml
  text: Then Samson grasped the two middle pillars on which the house stood[a], and he braced himself against them[b], one with his right hand and one with his left.
translation:
  language: id
  text: Lalu Simson mencengkeram kedua tiang yang di tengah[a], yang menopang bangunan itu. Ia bertumpu pada kedua tiang itu[b], yang satu di sebelah kanannya dan yang satu lagi di sebelah kirinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kedua tiang pusat.”
    reason: lexical_alternative
  - marker: b
    text: Atau “Ia bersandar pada kedua tiang itu.” Kata kerja Ibrani dapat berarti bersandar atau menopang diri pada sesuatu; “bertumpu pada” mencerminkan tindakan fisik yang mungkin dimaksud dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְפֹּת
  choice: mencengkeram
  rationale: Kata kerja ini menyatakan tindakan memegang dengan kuat. “Mencengkeram” menyampaikan kekuatan dan kesengajaan tindakan Simson secara alami.
- source_word: שְׁנֵי עַמּוּדֵי הַתָּוֶךְ
  choice: kedua tiang yang di tengah
  rationale: Ungkapan ini menunjuk pada dua tiang di bagian tengah atau pusat bangunan. Bentuk ini jelas dan tetap mempertahankan gambaran ruang dalam bahasa Ibrani.
- source_word: אֲשֶׁר הַבַּיִת נָכוֹן עֲלֵיהֶם
  choice: yang di atasnya bangunan itu berdiri
  rationale: נָכוֹן di sini menggambarkan bangunan yang ditegakkan atau ditopang oleh kedua tiang tersebut. Rumusan ini alami dan menunjukkan fungsi struktural tiang tanpa menambahkan rincian.
- source_word: וַיִּסָּמֵךְ עֲלֵיהֶם
  choice: Ia menumpukan tubuhnya pada kedua tiang itu
  rationale: Kata סמך dapat berarti bersandar, menopang diri, atau menumpukan tubuh pada sesuatu. Pilihan ini menggambarkan posisi fisik Simson sekaligus mempertahankan keluasan maknanya.
- source_word: אֶחָד בִּימִינוֹ וְאֶחָד בִּשְׂמֹאלוֹ
  choice: yang satu dengan tangan kanannya dan yang satu lagi dengan tangan kirinya
  rationale: Susunan distributif Ibrani menempatkan satu tiang pada sisi kanan dan satu pada sisi kiri Simson. Penyebutan tangan membuat tindakan itu jelas dan alami dalam bahasa Indonesia.
- source_word: הַבַּיִת
  choice: bangunan itu
  rationale: Walaupun arti dasarnya adalah “rumah”, dalam konteks ini kata tersebut menunjuk pada keseluruhan struktur tempat orang banyak berkumpul. “Bangunan” menghindari kesan rumah tinggal dan tetap netral mengenai jenis strukturnya.
