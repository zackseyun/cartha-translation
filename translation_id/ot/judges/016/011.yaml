base_translation:
  language: en
  yaml_path: translation/ot/judges/016/011.yaml
  text: He said to her[a], “If they bind me with new ropes that have never been used for work[b], then I will become weak and be like one of the men.”
translation:
  language: id
  text: Ia berkata kepada perempuan itu, “Jika mereka benar-benar mengikat aku dengan tali-tali baru yang belum pernah dipakai untuk pekerjaan apa pun[a], aku akan menjadi lemah dan sama seperti manusia biasa[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang dengannya belum pernah dilakukan pekerjaan apa pun.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “seperti orang lain pada umumnya,” yaitu tanpa kekuatan yang luar biasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ
  choice: Ia berkata kepada perempuan itu
  rationale: Bentuk wayyiqtol melanjutkan narasi dan memperkenalkan jawaban Simson. Kata ganti feminin diterjemahkan secara wajar sebagai “perempuan itu” agar acuannya jelas dalam bahasa Indonesia.
- source_word: אִם אָסוֹר יַאַסְרוּנִי
  choice: Jika mereka benar-benar mengikat aku
  rationale: Infinitif absolut yang diikuti verba finit dari akar yang sama memberi penegasan. “Benar-benar” mempertahankan daya emfatis tanpa menentukan bahwa ikatannya harus ‘erat’, suatu nuansa cara yang tidak dinyatakan secara langsung.
- source_word: בַּעֲבֹתִים חֲדָשִׁים
  choice: dengan tali-tali baru
  rationale: עֲבֹתִים menunjuk pada tali atau tambang pengikat, mungkin berpilin tebal. “Tali-tali” jelas dan alami, sedangkan חֲדָשִׁים berarti “baru”.
- source_word: אֲשֶׁר לֹא נַעֲשָׂה בָהֶם מְלָאכָה
  choice: yang belum pernah dipakai untuk pekerjaan apa pun
  rationale: Ungkapan pasif Ibrani secara harfiah menyatakan bahwa belum ada pekerjaan yang dilakukan dengan tali-tali itu. Terjemahan ini menyampaikan secara alami bahwa tali tersebut sama sekali belum pernah digunakan.
- source_word: וְחָלִיתִי
  choice: aku akan menjadi lemah
  rationale: Dalam konteks hilangnya kekuatan Simson, חלה berarti menjadi lemah, bukan jatuh sakit.
- source_word: וְהָיִיתִי כְּאַחַד הָאָדָם
  choice: dan sama seperti manusia biasa
  rationale: Ungkapan ini membandingkan Simson dengan manusia pada umumnya yang tidak memiliki kekuatannya yang luar biasa. “Manusia biasa” alami dalam bahasa Indonesia dan mempertahankan inti kontras tersebut.
theological_decisions:
- issue: Makna כְּאַחַד הָאָדָם dalam kontras dengan kekuatan Simson
  choice: sama seperti manusia biasa
  alternative: seperti orang lain pada umumnya
  rationale: Frasa Ibrani menekankan bahwa Simson akan berada pada taraf manusia biasa tanpa kekuatan luar biasa. Bahasa Indonesia tidak perlu memaksakan gender gramatikal yang tidak dimilikinya; pilihan ini mempertahankan kontras teologis dan naratif tanpa menambahkan penafsiran denominasi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Pengulangan “tali-tali” mempertahankan bentuk jamak, sedangkan “benar-benar” menyampaikan penegasan sintaksis Ibrani tanpa menambahkan gagasan bahwa ikatan itu secara khusus harus erat.
