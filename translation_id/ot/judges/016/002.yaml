  to: Orang-orang Gaza diberi tahu[a], “Simson telah datang ke sini.” Lalu mereka mengepung[b] dan mengadang dia sepanjang malam di pintu gerbang kota. Sepanjang malam mereka berdiam diri[c] sambil berkata, “Sampai fajar menyingsing[d], lalu kita akan membunuhnya.”
