  text: לַֽ/עַזָּתִ֣ים לֵ/אמֹ֗ר בָּ֤א שִׁמְשׁוֹן֙ הֵ֔נָּה וַ/יָּסֹ֛בּוּ וַ/יֶּאֶרְבוּ ל֥/וֹ כָל הַ/לַּ֖יְלָה בְּ/שַׁ֣עַר הָ/עִ֑יר וַ/יִּתְחָרְשׁ֤וּ כָל הַ/לַּ֨יְלָה֙ לֵ/אמֹ֔ר עַד א֥וֹר הַ/בֹּ֖קֶר וַ/הֲרְגְנֻֽ/הוּ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/002.yaml
  text: The Gazites were told[a], saying, “Samson has come here.” So they surrounded him and lay in wait for him all night at the city gate. They kept quiet all night, saying, “Until the light of morning[c][b], then we will kill him.”
translation:
  language: id
  text: Orang-orang Gaza diberi tahu[a], “Simson telah datang ke sini.” Lalu mereka mengepung[b] dan mengadang dia sepanjang malam di pintu gerbang kota. Sepanjang malam mereka berdiam diri[c] sambil berkata, “Sampai fajar menyingsing[d], lalu kita akan membunuhnya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kabar sampai kepada orang-orang Gaza.”
    reason: Teks Ibrani hanya berbunyi secara harfiah, “kepada orang-orang Gaza, dengan berkata,” sehingga cara penyampaian kabar tidak disebutkan.
  - marker: b
    text: Objek kata “mengepung” tidak disebutkan dalam teks Ibrani; mungkin yang dimaksud ialah Simson atau tempat ia berada.
    reason: Menjaga ambiguitas gramatikal sumber mengenai objek verba.
  - marker: c
    text: Atau, “tetap diam” atau “tidak bersuara”; ungkapan Ibrani menyiratkan sikap diam-diam saat menunggu untuk menyergap.
    reason: Menampilkan rentang makna verba yang sesuai dengan konteks penyergapan.
  - marker: d
    text: Secara harfiah, “sampai terang pagi.”
    reason: Memperlihatkan bentuk ungkapan temporal dan citra harfiah teks Ibrani.
lexical_decisions:
- source_word: לַעַזָּתִים
  choice: Orang-orang Gaza
  rationale: Bentuk nisbah jamak ini menunjuk kepada penduduk Gaza. Pilihan ini alami dalam bahasa Indonesia modern dan tidak memakai sebutan etnis yang terasa asing.
- source_word: לֵאמֹר
  choice: diberi tahu
  rationale: Secara harfiah bentuknya hanya berarti ‘dengan berkata’, tanpa verba utama yang eksplisit. Dalam konteks ini konstruksi tersebut menyampaikan bahwa kabar sampai kepada penduduk Gaza.
- source_word: בָּא ... הֵנָּה
  choice: telah datang ke sini
  rationale: Bentuk perfektif menyatakan kedatangan Simson sebagai fakta yang baru dan masih relevan bagi tindakan berikutnya.
- source_word: וַיָּסֹבּוּ
  choice: mengepung tempat itu
  rationale: Verba berarti mengelilingi atau mengepung, tetapi teks Ibrani tidak menyatakan objeknya. ‘Tempat itu’ mempertahankan ketaktertentuan tersebut dengan pelengkap yang diperlukan agar kalimat Indonesia alami.
- source_word: וַיֶּאֶרְבוּ לוֹ
  choice: mengadang dia
  rationale: Dalam konteks ini ארב dengan ל menyatakan menunggu secara tersembunyi untuk menyerang. ‘Mengadang’ ringkas dan alami, sementara unsur menunggu tercakup oleh keterangan ‘sepanjang malam’.
- source_word: כָל הַלַּיְלָה
  choice: sepanjang malam
  rationale: Padanan Indonesia yang alami dan mempertahankan keseluruhan durasi.
- source_word: בְּשַׁעַר הָעִיר
  choice: di pintu gerbang kota
  rationale: Menunjuk kepada kawasan gerbang kota sebagai jalan keluar strategis.
- source_word: וַיִּתְחָרְשׁוּ
  choice: tetap diam
  rationale: Bentuk ini menyiratkan sikap diam atau tidak bergerak demi menjaga penyergapan tetap tersembunyi.
- source_word: לֵאמֹר
  choice: sambil berkata dalam hati
  rationale: Karena mereka sedang tetap diam, ungkapan ‘berkata’ secara kontekstual menyampaikan niat atau pembicaraan batin; terjemahan ini mempertahankan isi ujaran tanpa menimbulkan kesan bahwa mereka berbicara keras.
- source_word: עַד אוֹר הַבֹּקֶר
  choice: Begitu pagi mulai terang
  rationale: Mengungkapkan batas waktu sampai datangnya cahaya pagi secara alami, sambil mempertahankan citra terang pagi.
- source_word: וַהֲרְגְנֻהוּ
  choice: kita akan membunuhnya
  rationale: Bentuk orang pertama jamak dengan akhiran orang ketiga tunggal menyatakan keputusan bersama untuk membunuh Simson.
