  source_fidelity: Revisi diperlukan karena “sambil berkata dalam hati” menambahkan bahwa ujaran itu hanya batiniah, sesuatu yang tidak dinyatakan oleh teks Ibrani. Selain itu, “Begitu pagi mulai terang” mengubah batas temporal עַד (“sampai”) menjadi penanda waktu yang lebih tegas. Objek וַיָּסֹבּוּ memang tidak disebutkan; teks Indonesia dapat membiarkannya tersirat tanpa menetapkan “tempat itu.”
  naturalness: Teks revisi tetap memakai bahasa Indonesia baku dan lancar. “Mengepung” tanpa objek eksplisit dapat diterima dalam narasi ini karena objeknya tersirat dari konteks, dan catatan kaki menjelaskan ketidakjelasannya.
  terminology: “Orang-orang Gaza,” “Simson,” “pintu gerbang kota,” dan “membunuhnya” tepat serta sesuai register naratif. “Berdiam diri” menyampaikan nuansa diam/tersembunyi dari verba Ibrani tanpa menyatakan secara pasti bahwa mereka tidak bergerak.
  issues:
  - severity: medium
    issue: “sambil berkata dalam hati”
    rationale: Frasa “dalam hati” merupakan tambahan interpretatif. לֵאמֹר memperkenalkan isi ujaran/laporan maksud, tetapi tidak menyatakan bahwa perkataan itu hanya terjadi dalam batin.
  - severity: low
    issue: “Begitu pagi mulai terang”
    rationale: Ungkapan ini tidak mempertahankan secara dekat עַד אוֹר הַבֹּקֶר, “sampai cahaya pagi/fajar.” “Sampai fajar menyingsing” lebih dekat sambil tetap alami.
  - severity: low
    issue: “tempat itu” sebagai objek pengepungan
    rationale: Teks Ibrani tidak menyebutkan objek verba. Menetapkan “tempat itu” di teks utama mempersempit ambiguitas yang justru dicatat dalam catatan kaki.
