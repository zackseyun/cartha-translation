source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שִׁמְשׁ֗וֹן תָּמ֣וֹת נַפְשִׁ/י֮ עִם פְּלִשְׁתִּים֒ וַ/יֵּ֣ט בְּ/כֹ֔חַ וַ/יִּפֹּ֤ל הַ/בַּ֨יִת֙ עַל הַ/סְּרָנִ֔ים וְ/עַל כָּל הָ/עָ֖ם אֲשֶׁר בּ֑/וֹ וַ/יִּהְי֤וּ הַ/מֵּתִים֙ אֲשֶׁ֣ר הֵמִ֣ית בְּ/מוֹת֔/וֹ רַבִּ֕ים מֵ/אֲשֶׁ֥ר הֵמִ֖ית בְּ/חַיָּֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/030.yaml
  text: And Samson said[a], “Let me die with the Philistines.” Then he bent with all his strength, and the house fell on the rulers and on all the people who were in it[c][b]. So the dead whom he killed at his death were more than those whom he had killed during his life.
translation:
  language: id
  text: Lalu Simson berkata[a], “Biarlah aku mati bersama orang Filistin.” Kemudian ia membungkuk dengan sekuat tenaga, dan bangunan[b] itu roboh menimpa para penguasa[c] serta semua orang yang ada di dalamnya. Orang-orang yang dibunuhnya ketika ia mati lebih banyak daripada orang-orang yang dibunuhnya selama hidupnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Biarlah nyawaku mati bersama orang Filistin.” Kata “nyawaku” di sini merupakan ungkapan yang merujuk kepada Simson sendiri.
    reason: lexical_alternative
  - marker: b
    text: Atau “rumah”. Kata Ibrani yang dipakai adalah kata umum untuk rumah atau bangunan.
    reason: lexical_alternative
  - marker: c
    text: Atau “para tuan”. Istilah Ibrani ini menunjuk kepada para pemimpin orang Filistin.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּמוֹת נַפְשִׁי
  choice: Biarlah aku mati
  rationale: Secara harfiah ungkapan ini menyebut 'nyawaku/diriku', tetapi נֶפֶשׁ di sini merujuk secara idiomatis kepada diri Simson sendiri. Terjemahan ini mempertahankan daya volitif bentuk Ibrani tanpa menyiratkan pemisahan antropologis antara jiwa dan pribadi.
- source_word: עִם פְּלִשְׁתִּים
  choice: bersama orang Filistin
  rationale: עִם berarti 'dengan' atau 'bersama'; frasa ini menyatakan kesediaan Simson untuk mati bersamaan dengan orang Filistin.
- source_word: וַיֵּט בְּכֹחַ
  choice: ia membungkuk dengan sekuat tenaga
  rationale: נטה dapat berarti mencondongkan atau membungkukkan diri. Dalam konteks Simson bertumpu pada tiang-tiang, pilihan ini menggambarkan pengerahan tubuh tanpa mengganti verba tersebut dengan tindakan yang lebih khusus seperti 'mendorong'.
- source_word: הַבַּיִת
  choice: bangunan
  rationale: בַּיִת adalah kata umum untuk rumah, tetapi dalam konteks ini menunjuk pada keseluruhan struktur tempat orang Filistin berkumpul. 'Bangunan' terdengar alami dan menghindari penafsiran lebih khusus seperti 'kuil'.
- source_word: הַסְּרָנִים
  choice: para penguasa
  rationale: Istilah khas ini menunjuk kepada pemimpin-pemimpin kota atau wilayah Filistin. 'Para penguasa' menyampaikan kedudukan pemerintahan mereka dalam bahasa Indonesia modern.
- source_word: כָּל הָעָם אֲשֶׁר בּוֹ
  choice: semua orang yang ada di dalamnya
  rationale: Pilihan ini mempertahankan cakupan כָּל dan rujukan pronominal kepada bangunan secara jelas dan alami.
- source_word: אֲשֶׁר הֵמִית בְּמוֹתוֹ
  choice: yang dibunuhnya pada saat kematiannya
  rationale: Frasa ini menghubungkan kematian yang disebabkan Simson dengan peristiwa kematiannya sendiri, tanpa mengaburkan bahwa ia pun mati dalam keruntuhan itu.
- source_word: רַבִּים מֵאֲשֶׁר הֵמִית בְּחַיָּיו
  choice: lebih banyak daripada yang dibunuhnya semasa hidupnya
  rationale: Konstruksi perbandingan Ibrani menyatakan bahwa korban pada saat kematiannya melebihi seluruh korban yang dibunuhnya selama hidup.
theological_decisions:
- issue: Ungkapan נֶפֶשׁ dalam perkataan terakhir Simson
  choice: Biarlah aku mati bersama orang Filistin
  alternative: Biarlah nyawaku mati bersama orang Filistin
  rationale: נֶפֶשׁ berfungsi sebagai sebutan idiomatis bagi diri atau pribadi Simson. Terjemahan utama menyampaikan maksud ayat tanpa memasukkan doktrin tertentu tentang hakikat jiwa, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- issue: Identifikasi הַבַּיִת
  choice: bangunan
  alternative: kuil
  rationale: Konteks sebelumnya berkaitan dengan rumah Dagon, tetapi ayat ini sendiri memakai kata umum בַּיִת. Terjemahan tidak mempersempit istilah itu menjadi 'kuil', sehingga kadar kekhususan teks sumber tetap terjaga.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat dan mudah dipahami. Struktur kalimat mempertahankan urutan tindakan dalam teks Ibrani. Istilah teknis atau arkais dihindari, sedangkan ambiguitas mengenai bangunan dan ungkapan tentang nyawa dijelaskan melalui catatan kaki.
