  text: וַ/תְּיַשְּׁנֵ֨/הוּ֙ עַל בִּרְכֶּ֔י/הָ וַ/תִּקְרָ֣א לָ/אִ֔ישׁ וַ/תְּגַלַּ֕ח אֶת שֶׁ֖בַע מַחְלְפ֣וֹת רֹאשׁ֑/וֹ וַ/תָּ֨חֶל֙ לְ/עַנּוֹת֔/וֹ וַ/יָּ֥סַר כֹּח֖/וֹ מֵ/עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/019.yaml
  text: So she made him sleep on her knees[a], and she called for a man, and she shaved off the seven locks of his head. Then she began to afflict him[c][b], and his strength left him.
translation:
  language: id
  text: Lalu Delila membuat Simson tertidur di pangkuannya[a]. Ia memanggil seorang laki-laki[b], lalu mencukur ketujuh jalinan rambut di kepala Simson[c]. Kemudian ia mulai menganiaya Simson, dan kekuatan Simson meninggalkannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Harfiah: “di atas kedua lututnya.”'
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “menyuruh seorang laki-laki datang.” Teks Ibrani tidak memastikan apakah laki-laki itu sudah disebut atau diketahui sebelumnya.
    reason: alternative_reading
  - marker: c
    text: 'Atau: “ketujuh kepang rambut di kepala Simson.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּיַשְּׁנֵהוּ
  choice: membuat Simson tertidur
  rationale: 'Bentuk Hifil dari ישׁן menyatakan sebab: Delila menyebabkan Simson tidur. Nama diulangi agar rujukan pronomina tetap jelas dan alami dalam bahasa Indonesia.'
- source_word: עַל בִּרְכֶּיהָ
  choice: di pangkuannya
  rationale: Secara harfiah berarti 'di atas kedua lututnya', tetapi dalam bahasa Indonesia posisi yang dimaksud secara alami disebut 'di pangkuannya'; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וַתִּקְרָא לָאִישׁ
  choice: Ia memanggil seorang laki-laki
  rationale: קרא ל dapat berarti memanggil atau menyuruh datang. אִישׁ tidak memakai artikel, sehingga 'seorang laki-laki' mempertahankan ketakrifan yang terbuka tanpa memastikan apakah orang itu sudah diketahui pembaca.
- source_word: וַתְּגַלַּח
  choice: lalu mencukur
  rationale: Kata kerja feminin tunggal menjadikan Delila subjek gramatikal. Terjemahan mempertahankan hal itu, tanpa menutup kemungkinan bahwa tindakan dilakukan melalui laki-laki yang dipanggilnya.
- source_word: שֶׁבַע מַחְלְפוֹת רֹאשׁוֹ
  choice: ketujuh jalinan rambut di kepala Simson
  rationale: מַחְלְפוֹת menunjuk pada bagian-bagian rambut yang terjalin atau tergelung. 'Jalinan rambut' alami dalam bahasa Indonesia dan tidak memastikan bentuk tata rambut secara berlebihan.
- source_word: וַתָּחֶל לְעַנּוֹתוֹ
  choice: Kemudian ia mulai menindas Simson
  rationale: וַתָּחֶל menyatakan awal tindakan, sedangkan ענה Piel memiliki cakupan makna menindas, menyiksa, atau merendahkan. 'Menindas' mempertahankan keluasan maknanya tanpa mengkhususkan cara perlakuan tersebut.
- source_word: וַיָּסַר כֹּחוֹ מֵעָלָיו
  choice: kekuatan Simson pun lenyap
  rationale: Ungkapan Ibrani menyatakan bahwa kekuatannya pergi atau tidak lagi ada padanya. 'Lenyap' merupakan ungkapan Indonesia yang ringkas dan alami.
theological_decisions:
- issue: Sumber dan hakikat kekuatan Simson yang hilang
  choice: Menyatakan hanya bahwa kekuatan Simson lenyap, sebagaimana bunyi ayat ini.
  alternative: Menambahkan bahwa kekuatan dari TUHAN meninggalkannya.
  rationale: Ayat ini sendiri hanya menyebut kekuatannya. Hubungan dengan TUHAN muncul dalam konteks yang lebih luas, tetapi tidak ditambahkan ke dalam ayat ini agar ketegangan naratif dan batas informasi teks tetap terpelihara.
- issue: Pelaku pencukuran rambut
  choice: Mempertahankan Delila sebagai subjek gramatikal sambil membiarkan terbuka apakah ia melakukannya sendiri atau melalui laki-laki yang dipanggil.
  alternative: Menjadikan laki-laki yang dipanggil sebagai pelaku langsung pencukuran.
  rationale: Bentuk וַתְּגַלַּח adalah feminin tunggal dan secara gramatikal kembali kepada Delila. Namun, pemanggilan seorang laki-laki memungkinkan tindakan melalui perantara; terjemahan tidak memaksakan penyelesaian atas ketegangan ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama 'Simson' diulangi untuk menghindari rangkaian pronomina yang berpotensi kabur. Semua penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
