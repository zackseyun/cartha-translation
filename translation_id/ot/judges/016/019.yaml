  verdict: revise
  source_fidelity: 'Terjemahan pada umumnya setia pada urutan dan makna Ibrani: Delila menyebabkan Simson tidur, memanggil seorang laki-laki, mencukur tujuh jalinan rambutnya, lalu kekuatannya pergi. Namun, "menindas" kurang tepat untuk ענה dalam konteks tindakan langsung terhadap seorang individu; "menganiaya" lebih mencakup perlakuan menyakitkan tanpa menetapkan caranya. "Kekuatan Simson pun lenyap" dapat diterima, tetapi "meninggalkannya" lebih dekat dengan idiom וַיָּסַר כֹּחוֹ מֵעָלָיו.'
  naturalness: Bahasa baku dan jelas. "Di pangkuannya" adalah idiom Indonesia yang wajar untuk posisi tersebut, dengan catatan harfiah yang memadai. Pengulangan nama Simson menjaga kejelasan rujukan. Perubahan kecil pada dua ungkapan terakhir membuat narasi lebih idiomatis dan lebih dekat pada sumber.
  terminology: Nama Delila dan Simson sesuai pemakaian Indonesia. "Jalinan rambut" mempertahankan ketidakpastian antara helai/untaian dan kepang. "Menganiaya" menghindari nuansa penindasan sosial dalam "menindas" dan tidak menambahkan penjelasan teologis mengenai asal kekuatan Simson.
