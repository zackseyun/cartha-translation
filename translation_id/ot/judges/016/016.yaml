base_translation:
  language: en
  yaml_path: translation/ot/judges/016/016.yaml
  text: And it happened that[a], when she pressed him with her words all the days and urged him on, his soul grew short to the point of death.
translation:
  language: id
  text: Ketika perempuan itu mendesaknya dengan kata-katanya hari demi hari dan terus memaksanya, jiwa Simson menjadi sesak sampai ia merasa seakan-akan mau mati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jiwanya menjadi pendek untuk mati,” sebuah ungkapan Ibrani yang menyatakan tekanan batin, kejengkelan, atau kelelahan yang sangat berat. Ungkapan ini tidak dengan sendirinya menyatakan bahwa ia sungguh-sungguh berniat mati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Ketika
  rationale: Dalam rangkaian narasi Ibrani, ungkapan ini memperkenalkan keadaan yang berlangsung. “Ketika” menyampaikan fungsi waktunya secara alami dalam bahasa Indonesia tanpa ungkapan pembuka yang kaku.
- source_word: הֵצִיקָה לוֹ בִדְבָרֶיהָ
  choice: perempuan itu mendesaknya dengan kata-katanya
  rationale: Kata kerja ini menyatakan tekanan atau kesusahan yang ditimbulkan. “Mendesaknya” cocok dengan tekanan verbal yang terus-menerus, sedangkan “dengan kata-katanya” mempertahankan gambaran konkret teks Ibrani.
- source_word: כָּל הַיָּמִים
  choice: hari demi hari
  rationale: Ungkapan ini menyampaikan tindakan berulang dan berkelanjutan secara alami, serta lebih jelas daripada terjemahan harfiah “sepanjang hari-hari”.
- source_word: וַתְּאַלֲצֵהוּ
  choice: dan terus memaksanya
  rationale: Kata kerja ini memperkuat gambaran desakan yang menekan. “Memaksanya” mempertahankan unsur paksaan, dan “terus” menyatakan kegigihan dalam konteks tanpa sekadar mengulang kata “mendesak”.
- source_word: וַתִּקְצַר נַפְשׁוֹ
  choice: jiwa Simson menjadi sesak
  rationale: Pilihan ini mempertahankan gambaran idiomatis Ibrani tentang jiwa yang menjadi pendek atau sempit, tetapi memakai “sesak” agar gambaran tekanan batin dapat dipahami pembaca Indonesia. Nama “Simson” memperjelas rujukan pronomina dalam kalimat Indonesia.
- source_word: לָמוּת
  choice: sampai rasanya mau mati
  rationale: Ungkapan ini menyatakan tingkat penderitaan yang ekstrem tanpa memastikan bahwa Simson benar-benar berniat bunuh diri. Kata “rasanya” mempertahankan sifat idiomatis dan hiperbolis yang mungkin terkandung dalam frasa tersebut.
theological_decisions:
- issue: Apakah לָמוּת menyatakan niat harfiah untuk mati atau tingkat tekanan yang ekstrem
  choice: sampai rasanya mau mati
  alternative: sampai ingin mati
  rationale: “Ingin mati” dapat memastikan adanya kehendak untuk mati yang tidak dinyatakan secara tegas oleh teks. Terjemahan yang dipilih mempertahankan kemungkinan bahwa ungkapan itu menggambarkan penderitaan, kejengkelan, atau kelelahan batin yang sangat berat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat dibuat alami sambil mempertahankan gambaran khas Ibrani tentang jiwa yang terasa menyempit atau sesak.
