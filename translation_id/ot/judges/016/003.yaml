  text: וַ/יִּשְׁכַּ֣ב שִׁמְשׁוֹן֮ עַד חֲצִ֣י הַ/לַּיְלָה֒ וַ/יָּ֣קָם בַּ/חֲצִ֣י הַ/לַּ֗יְלָה וַ/יֶּאֱחֹ֞ז בְּ/דַלְת֤וֹת שַֽׁעַר הָ/עִיר֙ וּ/בִ/שְׁתֵּ֣י הַ/מְּזוּז֔וֹת וַ/יִּסָּעֵ/ם֙ עִֽם הַ/בְּרִ֔יחַ וַ/יָּ֖שֶׂם עַל כְּתֵפָ֑י/ו וַֽ/יַּעֲלֵ/ם֙ אֶל רֹ֣אשׁ הָ/הָ֔ר אֲשֶׁ֖ר עַל פְּנֵ֥י חֶבְרֽוֹן־׀־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/003.yaml
  text: And Samson lay until midnight[a]. Then he arose at midnight and seized the doors of the city gate and the two doorposts, and pulled them up with the bar[b]; he put them on his shoulders and carried them up to the top of the hill that is opposite Hebron.
translation:
  language: id
  text: Simson berbaring sampai tengah malam. Pada tengah malam ia bangun, memegang kedua daun pintu gerbang kota beserta kedua tiang pintunya, lalu mencabut semuanya bersama palangnya.[a] Ia menaruh semuanya di atas bahunya dan membawanya naik ke puncak bukit yang berhadapan dengan Hebron.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “merenggut semuanya hingga lepas bersama palangnya.” Kata kerja Ibrani yang dipakai dapat menggambarkan tindakan menarik atau mencabut sesuatu dari tempatnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “yang menghadap ke Hebron.” Ungkapan Ibraninya secara harfiah berarti “yang ada di hadapan Hebron.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: berbaring
  rationale: Kata שׁכב dapat berarti berbaring atau tidur. “Berbaring” mempertahankan tindakan fisik tanpa memastikan bahwa Simson tidur.
- source_word: עַד חֲצִי הַלַּיְלָה / בַּחֲצִי הַלַּיְלָה
  choice: sampai tengah malam / pada tengah malam
  rationale: Ungkapan ini secara harfiah menunjuk pada pertengahan malam; “tengah malam” merupakan padanan Indonesia yang alami dan jelas dalam kedua klausa.
- source_word: וַיֶּאֱחֹז
  choice: memegang
  rationale: “Memegang” menyampaikan tindakan mengambil pegangan dengan jelas; daya tindakan selanjutnya tampak dari verba “mencabut”.
- source_word: דַּלְתוֹת שַׁעַר הָעִיר
  choice: kedua daun pintu gerbang kota
  rationale: Bentuk jamak menunjuk pada sepasang daun pintu gerbang. “Daun pintu” membedakannya dengan keseluruhan bangunan gerbang.
- source_word: וּבִשְׁתֵּי הַמְּזוּזוֹת
  choice: beserta kedua tiang pintunya
  rationale: מְזוּזוֹת adalah kedua tiang atau kusen sisi yang mengapit pintu gerbang; “tiang pintu” mudah dipahami pembaca umum.
- source_word: וַיִּסָּעֵם עִם הַבְּרִיחַ
  choice: mencabut semuanya bersama palangnya
  rationale: Dalam konteks ini נסע berarti memindahkan dengan menarik atau mencabut dari tempatnya. “Bersama palangnya” menunjukkan bahwa palang gerbang turut dibawa, tanpa menyiratkan bahwa palang merupakan alat untuk mencabutnya.
- source_word: וַיָּשֶׂם עַל כְּתֵפָיו
  choice: menaruh semuanya di atas bahunya
  rationale: Terjemahan langsung dan alami untuk tindakan meletakkan seluruh bagian gerbang sebagai beban pada bahu.
- source_word: וַיַּעֲלֵם
  choice: membawanya naik
  rationale: Sufiks objek merujuk pada bagian-bagian gerbang, sedangkan konteks sebelumnya menunjukkan bahwa semuanya dibawa di bahu.
- source_word: אֶל רֹאשׁ הָהָר
  choice: ke puncak bukit
  rationale: רֹאשׁ berarti puncak, sementara הָהָר dapat merujuk pada bukit atau gunung. “Puncak bukit” sesuai dengan bentang geografis yang dimaksud dan alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר עַל פְּנֵי חֶבְרוֹן
  choice: yang berhadapan dengan Hebron
  rationale: Idiom עַל־פְּנֵי menyatakan posisi di hadapan atau menghadap suatu tempat. “Berhadapan dengan” mempertahankan relasi geografis tanpa menentukan jarak atau arah secara berlebihan.
