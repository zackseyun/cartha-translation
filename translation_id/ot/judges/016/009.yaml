revisions:
- from: Orang-orang yang hendak menyergap itu sedang menunggu untuknya[a] di dalam kamar. Lalu perempuan itu berkata kepadanya, “Orang Filistin menyerangmu, Simson!” Namun Simson memutuskan tali-tali itu seperti benang rami putus ketika tersentuh api. Dengan demikian, kekuatannya tidak tersingkap.
  to: Penyergap itu sedang menunggu di dalam kamar untuk perempuan itu[a], lalu perempuan itu berkata kepadanya, “Orang Filistin menyerangmu, Simson!” Tetapi ia memutuskan tali-tali itu seperti benang dari serat lenan putus ketika terkena api, dan kekuatannya tidak diketahui.
  rationale: Revisi memperbaiki ketepatan leksikal dan kelancaran bahasa Indonesia, sambil mempertahankan ambiguitas terbatas dari לָהּ melalui catatan kaki. Struktur naratif, seruan Delila, perbandingan dengan serat lenan yang terkena api, serta penutup pasif tentang kekuatan Simson tetap setia pada teks sumber.
