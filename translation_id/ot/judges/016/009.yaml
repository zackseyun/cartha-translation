base_translation:
  language: en
  yaml_path: translation/ot/judges/016/009.yaml
  text: The ambush was waiting for her in the inner room, and she said to him, “Philistines are upon you, Samson!” But he snapped the cords as a thread of tow snaps when it smells fire, and his strength was not discovered.
translation:
  language: id
  text: Penyergap itu sedang menunggu di dalam kamar untuk perempuan itu[a], lalu perempuan itu berkata kepadanya, “Orang Filistin menyerangmu, Simson!” Tetapi ia memutuskan tali-tali itu seperti benang dari serat lenan putus ketika terkena api, dan kekuatannya tidak diketahui.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sedang duduk baginya.” Frasa ini menyatakan bahwa penyergap itu berada di sana untuk Delila atau atas pengaturannya.
    reason: Mempertahankan pronomina feminin לָהּ dan menjelaskan hubungan yang diringkas oleh ungkapan Ibrani tanpa memaksakan satu penafsiran tertentu.
lexical_decisions:
- source_word: הָאֹרֵב
  choice: orang-orang yang hendak menyergap
  rationale: Kata kolektif ini menunjuk kepada pihak yang bersembunyi untuk menyergap; bentuk jamak alami dalam bahasa Indonesia juga sesuai dengan konteks adanya sejumlah orang Filistin.
- source_word: יֹשֵׁב לָהּ
  choice: sedang menunggu untuknya
  rationale: Mempertahankan pronomina feminin dan nuansa bahwa para penyergap berada di sana bagi Delila atau siap untuk kepentingannya, tanpa mengubahnya menjadi perintah yang tidak dinyatakan langsung.
- source_word: הַיְתָרִים
  choice: tali-tali itu
  rationale: Merujuk kembali kepada tali busur baru pada ayat sebelumnya; 'tali-tali' menjaga kesinambungan konteks tanpa pengulangan yang kaku.
- source_word: פְּתִיל הַנְּעֹרֶת
  choice: benang rami
  rationale: Menunjuk pada serat rami/flaks yang mudah putus ketika terkena api; ungkapan ini alami dan mudah dipahami pembaca Indonesia.
- source_word: וְלֹא נוֹדַע כֹּחוֹ
  choice: kekuatannya tidak tersingkap
  rationale: Bentuk pasif sumber menyatakan bahwa kekuatannya belum diketahui atau ditemukan; 'tidak tersingkap' mempertahankan nuansa penemuan tanpa menambahkan kata 'rahasia' atau 'sumber' yang tidak eksplisit.
theological_decisions:
- issue: Apakah penutup ayat menyatakan kekuatan Simson tidak diketahui atau sumber rahasianya tidak ditemukan
  choice: kekuatannya tidak tersingkap
  alternative: rahasia kekuatannya tidak diketahui
  rationale: Teks Ibrani hanya menyebut 'kekuatannya'; terjemahan tidak menambahkan 'rahasia' walaupun konteks mengarah pada pencarian sumber kekuatannya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Seruan dibuat alami tanpa menambahkan kata sandang yang tidak diperlukan. Perumpamaan api disampaikan secara idiomatis sebagai 'tersentuh api', sedangkan hasil percobaan tetap dirumuskan secara pasif agar ketegangan naratif sumber terjaga.
