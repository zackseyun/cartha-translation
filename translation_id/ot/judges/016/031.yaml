  text: וַ/יֵּרְד֨וּ אֶחָ֜י/ו וְ/כָל בֵּ֣ית אָבִי/הוּ֮ וַ/יִּשְׂא֣וּ אֹת/וֹ֒ וַֽ/יַּעֲל֣וּ וַ/יִּקְבְּר֣וּ אוֹת֗/וֹ בֵּ֤ין צָרְעָה֙ וּ/בֵ֣ין אֶשְׁתָּאֹ֔ל בְּ/קֶ֖בֶר מָנ֣וֹחַ אָבִ֑י/ו וְ/ה֛וּא שָׁפַ֥ט אֶת יִשְׂרָאֵ֖ל עֶשְׂרִ֥ים שָׁנָֽה־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/031.yaml
  text: Then his brothers and all his father’s household came down[a], carried him away, brought him up, and buried him between Zorah and Eshtaol, in the tomb of Manoah his father. And he judged Israel twenty years.
translation:
  language: id
  text: Kemudian saudara-saudaranya dan seluruh keluarga ayahnya turun, mengusung jenazahnya, membawanya naik, lalu menguburkannya di antara Zora dan Esytaol, di makam Manoah, ayahnya. Ia menghakimi Israel selama dua puluh tahun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia telah menghakimi Israel selama dua puluh tahun.” Bahasa Ibrani dapat dipahami sebagai ringkasan retrospektif.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: turun
  rationale: Kata ירד menunjukkan gerakan ke tempat yang lebih rendah. Bahasa Indonesia tidak perlu menentukan sudut pandang 'datang' atau 'pergi', sehingga ambiguitas naratif sumber tetap terpelihara.
- source_word: אֶחָיו
  choice: saudara-saudaranya
  rationale: Makna lazimnya adalah saudara laki-laki. Konteks tidak menuntut perluasan menjadi 'kaum kerabatnya'.
- source_word: כָּל בֵּית אָבִיהוּ
  choice: seluruh keluarga ayahnya
  rationale: Ungkapan harfiah 'seluruh rumah ayahnya' menunjuk pada keluarga atau rumah tangga dari garis ayah; padanan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: וַיִּשְׂאוּ אֹתוֹ
  choice: mengusung jenazahnya
  rationale: Dalam konteks pemakaman, נשא berarti mengangkat dan membawa tubuh. 'Mengusung jenazahnya' menyampaikan tindakan itu secara alami serta memperjelas bahwa yang dibawa adalah jasadnya tanpa mengubah acuan.
- source_word: וַיַּעֲלוּ
  choice: membawanya naik
  rationale: עלה menyatakan gerakan ke atas, kemungkinan secara topografis. Objek yang tersirat dipulihkan secara wajar dalam bahasa Indonesia.
- source_word: וַיִּקְבְּרוּ אֹתוֹ
  choice: menguburkannya
  rationale: Padanan langsung dan lazim bagi tindakan penguburan.
- source_word: בֵּין צָרְעָה וּבֵין אֶשְׁתָּאֹל
  choice: di antara Zora dan Esytaol
  rationale: Frasa tersebut menyatakan lokasi di antara dua tempat; ejaan nama disesuaikan dengan bentuk yang wajar dalam bahasa Indonesia.
- source_word: בְּקֶבֶר מָנוֹחַ אָבִיו
  choice: di makam Manoah, ayahnya
  rationale: קֶבֶר dapat berarti kubur atau makam. 'Makam' sesuai untuk tempat pemakaman keluarga, sedangkan aposisi 'ayahnya' dipertahankan dengan tanda koma agar jelas.
- source_word: וְהוּא שָׁפַט אֶת־יִשְׂרָאֵל
  choice: Ia menjadi hakim atas Israel
  rationale: שפט dalam kitab Hakim-Hakim menunjuk pada peran seorang hakim-pemimpin. Rumusan ini mempertahankan istilah khas kitab tersebut tanpa mempersempitnya menjadi sekadar tindakan mengadili perkara.
- source_word: עֶשְׂרִים שָׁנָה
  choice: selama dua puluh tahun
  rationale: Padanan langsung; 'selama' membuat fungsi rentang waktunya alami dalam bahasa Indonesia.
theological_decisions:
- issue: Ringkasan masa pelayanan Simson sebagai hakim
  choice: Ia menjadi hakim atas Israel selama dua puluh tahun
  alternative: Ia telah menjadi hakim atas Israel selama dua puluh tahun
  rationale: Bentuk Ibrani sesudah pemberitahuan pemakaman dapat dibaca sebagai ringkasan lampau sederhana atau sebagai tinjauan retrospektif. Teks utama mempertahankan rumusan ringkasan yang sederhana dan selaras dengan formula berulang dalam kitab Hakim-Hakim, sedangkan kemungkinan retrospektif dicatat tanpa menetapkannya sebagai satu-satunya pembacaan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Urutan gerak turun–mengusung–naik–menguburkan dipertahankan. Istilah 'hakim' dipakai untuk menjaga kosakata khas kitab Hakim-Hakim, sementara catatan kaki mempertahankan kemungkinan aspek retrospektif pada kalimat penutup.
