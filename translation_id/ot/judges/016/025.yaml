translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Struktur naratif Ibrani dipertahankan sejauh tetap alami, sedangkan ungkapan harfiah yang kaku seperti 'rumah para tahanan' diterjemahkan secara idiomatis sebagai 'penjara'.
