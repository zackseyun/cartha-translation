base_translation:
  language: en
  yaml_path: translation/ot/judges/016/025.yaml
  text: And when their hearts were merry[a], they said, “Call for Samson, so that he may entertain us.” So they called for Samson from the prison house, and he entertained them[b]. And they made him stand between the pillars.
translation:
  language: id
  text: Ketika hati mereka sedang gembira, mereka berkata, “Panggillah Simson supaya ia menghibur kita[a].” Maka mereka memanggil Simson dari penjara, lalu ia menjadi tontonan di hadapan mereka. Mereka menyuruhnya berdiri di antara tiang-tiang itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “supaya ia tampil bagi kita” atau “supaya ia menjadi tontonan bagi kita.” Kata kerja Ibrani ini dapat menyatakan hiburan, pertunjukan, atau menjadikan seseorang bahan olok-olok.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי טוֹב לִבָּם
  choice: ketika hati mereka sedang gembira
  rationale: Ungkapan Ibrani secara harfiah menyatakan bahwa hati mereka 'baik', yakni mereka sedang riang atau gembira. Pilihan ini mempertahankan gambaran tentang hati dan tetap alami dalam bahasa Indonesia.
- source_word: קִרְאוּ לְשִׁמְשׁוֹן
  choice: Panggillah Simson
  rationale: Kata kerja קרא dengan ל di sini berarti memanggil atau menyuruh seseorang datang. 'Panggillah' alami dalam konteks perintah ini.
- source_word: וִישַׂחֶק לָנוּ
  choice: supaya ia menghibur kita
  rationale: Kata kerja שׂחק dapat menunjuk pada hiburan, tontonan, atau menjadikan seseorang bahan olok-olok. 'Menghibur kita' menyampaikan fungsi tindakan itu tanpa menghapus ragam nuansanya; ambiguitas dijelaskan dalam catatan kaki.
- source_word: מִבֵּית הָאֲסִירִים
  choice: dari penjara
  rationale: Secara harfiah frasa ini berarti 'dari rumah para tahanan'. Dalam bahasa Indonesia modern, 'dari penjara' merupakan padanan yang jelas dan alami.
- source_word: וַיְצַחֵק לִפְנֵיהֶם
  choice: lalu ia menghibur mereka
  rationale: Bentuk ini menyatakan bahwa Simson menjadi hiburan atau tontonan di hadapan mereka. Pengulangan 'menghibur' menghubungkannya dengan permintaan sebelumnya, sementara konteks mempertahankan unsur penghinaan.
- source_word: וַיַּעֲמִידוּ אֹתוֹ בֵּין הָעַמּוּדִים
  choice: Mereka menyuruhnya berdiri di antara tiang-tiang itu
  rationale: Bentuk kausatif dari עמד berarti membuat atau menyuruh seseorang berdiri. 'Menyuruhnya berdiri' mempertahankan tindakan pihak lain yang menempatkan Simson di sana.
