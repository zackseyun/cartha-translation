  text: וַֽ/יְהִי֙ אַחֲרֵי כֵ֔ן וַ/יֶּאֱהַ֥ב אִשָּׁ֖ה בְּ/נַ֣חַל שֹׂרֵ֑ק וּ/שְׁמָ֖/הּ דְּלִילָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/004.yaml
  text: After this[a], he loved a woman in the Valley of Sorek, and her name was Delilah.
translation:
  language: id
  text: Sesudah itu, ia mencintai seorang perempuan di Lembah Sorek[a]. Namanya Delila.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di Wadi Sorek.” Kata Ibrani נַחַל dapat berarti lembah, dasar sungai, atau aliran air musiman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: Sesudah itu
  rationale: Ungkapan naratif Ibrani ini secara harfiah berarti 'dan terjadilah sesudah itu'. 'Sesudah itu' menyampaikan urutan waktunya secara alami dalam bahasa Indonesia modern.
- source_word: וַיֶּאֱהַב
  choice: ia mencintai
  rationale: Kata kerja אָהַב berarti 'mencintai'. Pilihan ini langsung dan tidak menambahkan nuansa seperti mulai jatuh cinta yang tidak dinyatakan oleh teks.
- source_word: אִשָּׁה
  choice: seorang perempuan
  rationale: Kata ini dapat berarti 'perempuan' atau 'istri', tetapi konteks tidak menyatakan adanya hubungan perkawinan. Karena itu, 'seorang perempuan' mempertahankan makna yang netral.
- source_word: בְּנַחַל שֹׂרֵק
  choice: di Lembah Sorek
  rationale: נַחַל dapat menunjuk pada lembah, dasar aliran, atau aliran air musiman. 'Lembah Sorek' alami dan mudah dipahami, sedangkan catatan kaki mempertahankan kemungkinan gambaran geografis lainnya.
- source_word: וּשְׁמָהּ
  choice: Namanya
  rationale: Klausa ini memperkenalkan nama perempuan tersebut. Kalimat tersendiri tetap dekat dengan struktur Ibrani sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: דְּלִילָה
  choice: Delila
  rationale: Nama pribadi dialihaksarakan menurut bentuk yang lazim dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan sederhana dan bermartabat. Kata ganti 'ia' dipakai untuk kesinambungan narasi tanpa mengulang nama Simson. Penanda catatan kaki ditempatkan pada frasa geografis yang dijelaskannya.
