  text: וַ/יַּגֶּד לָ֣/הּ אֶת כָּל לִבּ֗/וֹ וַ/יֹּ֤אמֶר לָ/הּ֙ מוֹרָה֙ לֹֽא עָלָ֣ה עַל רֹאשִׁ֔/י כִּֽי נְזִ֧יר אֱלֹהִ֛ים אֲנִ֖י מִ/בֶּ֣טֶן אִמִּ֑/י אִם גֻּלַּ֨חְתִּי֙ וְ/סָ֣ר מִמֶּ֣/נִּי כֹחִ֔/י וְ/חָלִ֥יתִי וְ/הָיִ֖יתִי כְּ/כָל הָ/אָדָֽם־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/017.yaml
  text: So he told her all his heart and said to her[a], “A razor has never come upon my head, for I have been a Nazirite of God from my mother’s womb. If I am shaved, then my strength will leave me[c][b], and I will become weak and be like every other man.”
translation:
  language: id
  text: Lalu ia mengungkapkan seluruh isi hatinya kepada perempuan itu[a] dan berkata, “Pisau cukur belum pernah menyentuh kepalaku, sebab sejak dalam kandungan ibuku aku adalah seorang nazir Allah[b]. Jika rambutku dicukur, kekuatanku akan meninggalkan aku; aku akan menjadi lemah dan menjadi seperti orang lain[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memberitahukan kepadanya seluruh hatinya”; maksudnya, mengungkapkan semua yang ada dalam hatinya.
    reason: lexical_alternative
  - marker: b
    text: Nazir adalah istilah teknis untuk orang yang dikhususkan bagi Allah.
    reason: cultural_note
  - marker: c
    text: Atau, “seperti manusia mana pun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֶּד לָהּ אֶת כָּל לִבּוֹ
  choice: ia mengungkapkan seluruh isi hatinya kepada perempuan itu
  rationale: Ungkapan Ibrani secara harfiah menyebut ‘seluruh hatinya’ dan menyatakan keterbukaan penuh. ‘Mengungkapkan seluruh isi hatinya’ mempertahankan metafora hati sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: מוֹרָה לֹא עָלָה עַל רֹאשִׁי
  choice: pisau cukur belum pernah menyentuh kepalaku
  rationale: מוֹרָה berarti pisau cukur. Idiom ‘naik atas kepalaku’ secara wajar dinyatakan sebagai ‘menyentuh kepalaku’, tanpa mengubah maksud larangan mencukur.
- source_word: נְזִיר אֱלֹהִים
  choice: seorang nazir Allah
  rationale: ‘Nazir’ mempertahankan istilah teknis bagi orang yang dikhususkan bagi Allah serta kaitannya dengan Bilangan 6 dan kisah panggilan Simson.
- source_word: מִבֶּטֶן אִמִּי
  choice: sejak dari kandungan ibuku
  rationale: Frasa ini menyatakan keadaan yang berlaku sejak masih dalam kandungan; bentuk Indonesia tersebut alami dan tetap dekat dengan citra sumber.
- source_word: אִם גֻּלַּחְתִּי
  choice: jika rambutku dicukur
  rationale: Bentuk pasif Ibrani menunjukkan bahwa Simson dikenai tindakan mencukur. Penyebutan ‘rambutku’ memperjelas objek yang tersirat dari konteks kepala.
- source_word: וְסָר מִמֶּנִּי כֹחִי
  choice: kekuatanku akan meninggalkan aku
  rationale: Terjemahan ini mempertahankan gambaran bahwa kekuatan itu pergi atau beralih darinya dalam rangkaian syarat yang berorientasi ke masa depan.
- source_word: וְחָלִיתִי
  choice: aku akan menjadi lemah
  rationale: Dalam konteks ini verba tersebut menunjuk pada hilangnya kekuatan, bukan penyakit.
- source_word: כְּכָל הָאָדָם
  choice: seperti setiap orang lainnya
  rationale: Frasa ini membandingkan Simson dengan manusia biasa pada umumnya. ‘Orang lainnya’ alami dalam bahasa Indonesia dan tidak menambahkan pembatasan jenis kelamin yang tidak harus dinyatakan oleh אָדָם di sini.
theological_decisions:
- issue: Penerjemahan istilah pengkhususan נְזִיר dalam pengakuan Simson
  choice: seorang nazir Allah
  alternative: seorang yang dikhususkan bagi Allah
  rationale: Transliterasi ‘nazir’ menjaga istilah teknis dan hubungan kanonisnya, sedangkan catatan kaki memberi penjelasan ringkas bagi pembaca umum.
- issue: Hubungan antara pencukuran dan hilangnya kekuatan
  choice: mempertahankan pernyataan Simson apa adanya tanpa menjelaskan mekanismenya
  alternative: menambahkan bahwa kekuatan berasal dari Allah atau dari rambut
  rationale: Ayat ini melaporkan perkataan Simson dan hanya menyatakan urutan kondisional. Terjemahan tidak boleh menyelesaikan ketegangan teologis dengan tambahan yang tidak terdapat dalam teks.
- issue: Cakupan הָאָדָם pada klausa terakhir
  choice: setiap orang lainnya
  alternative: setiap laki-laki lainnya
  rationale: Dalam konteks ini kata tersebut menekankan keadaan manusia biasa dibandingkan kekuatan luar biasa Simson; bahasa Indonesia tidak perlu memberi penandaan gender untuk menyampaikan kontras itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Perempuan itu’ dipakai agar rujukan pronomina jelas tanpa mengulang nama Delila. Struktur ujaran dijaga ringkas, sementara metafora hati dan istilah teknis ‘nazir’ dipertahankan.
