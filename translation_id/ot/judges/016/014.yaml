base_translation:
  language: en
  yaml_path: translation/ot/judges/016/014.yaml
  text: Then she fastened it with the pin and said to him[a], “The Philistines are upon you[c][b], Samson!” And he awoke from his sleep and pulled away the pin of the loom and the web.
translation:
  language: id
  text: Kemudian perempuan itu menancapkannya dengan pasak, lalu berkata kepadanya, “Orang-orang Filistin menyerangmu, Simson!” Simson terbangun dari tidurnya dan menarik lepas pasak alat tenun itu dan kain tenun itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani yang diterjemahkan “kain tenun itu” dapat menunjuk pada bentangan bahan yang sedang ditenun pada alat tenun.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְקַע בַּיָּתֵד
  choice: menancapkannya dengan pasak
  rationale: תקע menyatakan tindakan menancapkan atau memasang dengan kuat, sedangkan יָתֵד dapat berarti pasak atau pin. Dalam konteks alat tenun, “pasak” alami dalam bahasa Indonesia dan tidak merinci mekanismenya secara berlebihan.
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: Orang Filistin menyerangmu
  rationale: Secara harfiah ungkapan ini berarti “orang Filistin atasmu,” tetapi dalam seruan bahaya berulang di kisah Simson maksud idiomatisnya ialah bahwa mereka datang menyerang. Terjemahan ini mempertahankan urgensi dalam bahasa Indonesia yang wajar.
- source_word: וַיִּיקַץ מִשְּׁנָתוֹ
  choice: Simson terbangun dari tidurnya
  rationale: Terjemahan langsung dan alami; nama “Simson” dipakai sebagai subjek agar rujukan pronomina tetap jelas dalam bahasa Indonesia.
- source_word: וַיִּסַּע
  choice: mencabut
  rationale: Dalam konteks ini נסע berarti mengangkat, mencabut, atau melepaskan dengan tenaga. “Mencabut” sesuai dengan benda yang sebelumnya ditancapkan dan menyiratkan pelepasan kuat tanpa menambahkan rincian yang tidak disebutkan.
- source_word: הַיְתַד הָאֶרֶג
  choice: pasak tenun itu
  rationale: Frasa Ibrani menunjuk pada pasak yang terkait dengan kegiatan atau perangkat tenun. “Pasak tenun” ringkas dan dapat dipahami tanpa memaksakan istilah teknis tertentu.
- source_word: הַמַּסָּכֶת
  choice: kain tenunannya
  rationale: Istilah ini menunjuk pada bahan atau bentangan yang sedang ditenun. “Kain tenunan” lebih jelas bagi pembaca umum daripada istilah teknis seperti “lungsin,” sementara sufiks -nya mengaitkannya dengan susunan tenun yang disebut dalam konteks.
