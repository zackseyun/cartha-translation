    rationale: Nomina Ibrani tersebut berdefinit (“kain/bentangan tenun itu”), tetapi tidak memakai sufiks kepunyaan.
  - severity: low
    issue: “Mencabut” kurang luwes untuk objek gabungan pasak dan kain tenun.
    rationale: וַיִּסַּע menyatakan tindakan menarik atau melepaskan; “menarik lepas” mencakup pasak dan bahan tenun secara alami.
