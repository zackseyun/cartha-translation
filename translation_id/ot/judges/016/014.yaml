  terminology: “Simson,” “orang-orang Filistin,” “pasak,” dan “alat tenun” sesuai dengan penggunaan Indonesia modern dan register naratif Alkitab. Catatan kaki tetap ditempatkan pada “kain tenun itu” dan hanya menjelaskan kemungkinan makna tekstil tanpa memaksakan istilah teknis seperti “lungsin.”
