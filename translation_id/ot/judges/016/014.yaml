  to: Kemudian perempuan itu menancapkannya dengan pasak, lalu berkata kepadanya, “Orang-orang Filistin menyerangmu, Simson!” Simson terbangun dari tidurnya dan menarik lepas pasak alat tenun itu dan kain tenun itu.[a]
