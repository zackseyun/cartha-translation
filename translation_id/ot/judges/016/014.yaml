  source_fidelity: 'Terjemahan pada dasarnya mengikuti teks Ibrani: perempuan itu memasang/menancapkan susunan tenun dengan pasak, memberi seruan bahaya kepada Simson, dan Simson melepaskan pasak serta tenunannya. Namun, ״פְּלִשְׁתִּים״ adalah bentuk jamak sehingga perlu diterjemahkan secara eksplisit sebagai “orang-orang Filistin.” Untuk וַיִּסַּע, “menarik lepas” lebih mencakup kedua benda yang dikoordinasikan daripada “mencabut,” yang kurang lazim untuk kain tenun.'
