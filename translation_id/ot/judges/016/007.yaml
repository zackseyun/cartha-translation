base_translation:
  language: en
  yaml_path: translation/ot/judges/016/007.yaml
  text: And Samson said to her[a], “If they bind me with seven fresh bowstrings that have not dried, then I will become weak and be like one of the men.”
translation:
  language: id
  text: Lalu Simson berkata kepadanya, “Jika mereka mengikat aku dengan tujuh tali busur yang masih baru dan belum kering, aku akan menjadi lemah dan seperti salah seorang laki-laki.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “seperti laki-laki lain mana pun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלֶיהָ שִׁמְשׁוֹן
  choice: Lalu Simson berkata kepadanya
  rationale: Wayyiqtol melanjutkan alur narasi. “Lalu” merupakan penghubung naratif yang wajar dalam bahasa Indonesia tanpa menambahkan hubungan sebab-akibat.
- source_word: אִם יַאַסְרֻנִי
  choice: Jika mereka mengikat aku
  rationale: Bentuk orang ketiga jamak berfungsi sebagai subjek tak tentu dalam konteks ini. “Mereka” mempertahankan bentuk jamak tanpa menentukan pelaku tertentu.
- source_word: בְּשִׁבְעָה יְתָרִים
  choice: dengan tujuh tali busur
  rationale: Preposisi בְּ bersifat instrumental, dan יְתָרִים dalam konteks ini secara khusus menunjuk pada tali busur, bukan sekadar tali biasa.
- source_word: לַחִים אֲשֶׁר לֹא חֹרָבוּ
  choice: baru yang belum kering
  rationale: לַחִים menggambarkan tali yang masih segar atau belum mengering. “Baru” terdengar alami untuk tali busur dan klausa berikutnya memperjelas bahwa tali itu belum kering.
- source_word: וְחָלִיתִי
  choice: aku akan menjadi lemah
  rationale: חלה di sini berarti kehilangan kekuatan, bukan jatuh sakit. “Menjadi lemah” menyatakan perubahan keadaan yang dimaksud.
- source_word: וְהָיִיתִי כְּאַחַד הָאָדָם
  choice: dan menjadi seperti salah seorang laki-laki
  rationale: Terjemahan ini mempertahankan bentuk perbandingan sumber dengan seorang dari kalangan manusia/laki-laki biasa, tanpa menambahkan kata “biasa” ke dalam teks utama.
theological_decisions:
- issue: Makna אָדָם dalam ungkapan perbandingan כְּאַחַד הָאָדָם
  choice: seperti salah seorang laki-laki
  alternative: seperti laki-laki lain mana pun
  rationale: Dalam konteks kekuatan Simson, frasa itu membandingkannya dengan laki-laki lain pada umumnya. Teks utama tetap dekat dengan bentuk Ibrani, sedangkan padanan Indonesia yang lebih idiomatis dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan pola syarat dan akibat serta ungkapan perbandingan dalam bahasa Ibrani.
