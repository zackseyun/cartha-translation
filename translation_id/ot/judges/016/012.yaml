revisions:
- from: Lalu Delila mengambil tali-tali baru dan mengikat Simson dengan tali-tali itu.[a] Kemudian ia berkata kepadanya, “Orang Filistin menyerangmu, Simson!” Sementara itu, penyergap sedang menunggu di kamar dalam.[b][c] Tetapi Simson memutuskan tali-tali pada lengannya seperti benang.
  to: Lalu Delila mengambil tali-tali baru dan mengikat Simson dengan tali-tali itu.[a] Kemudian ia berkata kepadanya, “Orang Filistin menyerangmu, Simson!” Sementara itu, penyergap itu duduk di dalam kamar.[b][c] Lalu Simson merenggut tali-tali itu dari lengannya seperti sehelai benang.
  rationale: Revisi mempertahankan seruan idiomatis Delila dan ketaksaan partisip tunggal bagi pihak yang mengintai. Bagian akhir diperbaiki agar menyatakan bahwa Simson merenggut ikatan itu dari lengannya, sesuai dengan מֵעַל זְרֹעֹתָיו, dan perbandingan dengan sehelai benang dipertahankan.
