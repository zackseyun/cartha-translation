base_translation:
  language: en
  yaml_path: translation/ot/judges/016/012.yaml
  text: Then Delilah took new ropes and bound him with them[a], and said to him, “The Philistines are upon you, Samson!” Now the ambush was sitting in the inner room[c][b], but he snapped them from off his arms like a thread.
translation:
  language: id
  text: Lalu Delila mengambil tali-tali baru dan mengikat Simson dengan tali-tali itu.[a] Kemudian ia berkata kepadanya, “Orang Filistin menyerangmu, Simson!” Sementara itu, penyergap itu duduk di dalam kamar.[b][c] Lalu Simson merenggut tali-tali itu dari lengannya seperti sehelai benang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tambang-tambang baru.”
    reason: lexical_alternative
  - marker: b
    text: Atau “orang yang mengintai itu duduk di dalam kamar.” Bahasa Ibrani memakai partisip tunggal untuk orang atau pihak yang bersembunyi menunggu.
    reason: lexical_alternative
  - marker: c
    text: Kata yang diterjemahkan “kamar” dapat juga diterjemahkan “bilik” atau “kamar dalam.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבֹתִים חֲדָשִׁים
  choice: tali-tali baru
  rationale: עֲבֹתִים menunjuk pada tali pengikat yang cukup tebal, sedangkan חֲדָשִׁים berarti baru; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kontras dengan 'benang' pada akhir ayat.
- source_word: וַתַּאַסְרֵהוּ בָהֶם
  choice: mengikat Simson dengan tali-tali itu
  rationale: Kata kerja אסר berarti mengikat atau membelenggu. Nama 'Simson' dipakai untuk memperjelas rujukan pronomina secara alami dalam bahasa Indonesia.
- source_word: פְּלִשְׁתִּים עָלֶיךָ
  choice: Orang Filistin menyerangmu
  rationale: Seruan Ibrani secara harfiah menyatakan bahwa orang Filistin 'atasmu'; 'menyerangmu' menyampaikan ancaman yang mendesak secara wajar dalam bahasa Indonesia tanpa menyiratkan bahwa mereka sudah menyentuh Simson.
- source_word: וְהָאֹרֵב
  choice: penyergap
  rationale: Partisip tunggal Ibrani dapat menunjuk kepada orang yang mengintai atau secara fungsional kepada pihak penyergap. Bentuk tunggal dipertahankan agar ketaksaan gramatikal sumber tidak dihapus.
- source_word: יֹשֵׁב
  choice: sedang menunggu
  rationale: Secara harfiah berarti duduk atau tinggal, tetapi dalam konteks penyergapan tindakan itu berfungsi sebagai menunggu dalam persembunyian.
- source_word: בֶּחָדֶר
  choice: di kamar dalam
  rationale: חֶדֶר dapat berarti kamar, bilik, atau ruang bagian dalam; 'kamar dalam' menyampaikan lokasi tersembunyi dengan bahasa Indonesia yang ringkas.
- source_word: וַיְנַתְּקֵם מֵעַל זְרֹעֹתָיו
  choice: memutuskan tali-tali pada lengannya
  rationale: נתק menggambarkan tindakan memutus atau merenggut lepas. Frasa ini mempertahankan lokasi tali pada kedua lengan sambil tetap alami dalam bahasa Indonesia.
- source_word: כַּחוּט
  choice: seperti benang
  rationale: חוּט berarti benang atau tali tipis; 'benang' menghasilkan gambaran kontras yang jelas dengan tali-tali tebal.
