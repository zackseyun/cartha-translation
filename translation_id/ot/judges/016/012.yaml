review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan terutama pada penutup ayat. וַיְנַתְּקֵם menyatakan tindakan merenggut/lepas dengan paksa dari lengannya, bukan sekadar memutus tali yang berada pada lengannya. Partisip יֹשֵׁב secara harfiah berarti ‘duduk’; makna menunggu dapat tersirat oleh konteks penyergapan, tetapi sebaiknya tidak menggantikan citra sumber dalam teks utama.
  naturalness: Teks revisi memakai bahasa Indonesia baku dan mengalir. ‘Duduk di dalam kamar’ lebih langsung dan alami daripada ‘sedang menunggu di kamar dalam’, sambil tetap mempertahankan kemungkinan bahwa ia sedang menunggu dalam persembunyian.
  terminology: Nama Delila, Simson, dan Filistin dipertahankan. ‘Tali-tali baru’ masih dapat dipakai untuk עֲבֹתִים, dengan alternatif ‘tambang-tambang’ dalam catatan. Bentuk tunggal ‘penyergap’ mempertahankan partisip tunggal Ibrani tanpa memutuskan apakah yang dimaksud satu orang atau suatu pihak penyergap.
  issues:
  - severity: medium
    issue: ‘memutuskan tali-tali pada lengannya’ tidak cukup mencerminkan arah dan daya tindakan dalam וַיְנַתְּקֵם מֵעַל זְרֹעֹתָיו.
    rationale: Kata kerja tersebut menggambarkan merenggut atau melepaskan ikatan dari lengannya. ‘Pada lengannya’ juga kurang tepat untuk מֵעַל (‘dari/off’).
  - severity: low
    issue: ‘sedang menunggu’ menggantikan arti konkret יֹשֵׁב (‘duduk’) dengan implikasi kontekstual.
    rationale: Menunggu memang cocok dalam konteks, tetapi ‘duduk’ lebih setia pada bentuk sumber dan tetap wajar dalam narasi Indonesia.
