  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/סַרְנֵ֣י פְלִשְׁתִּ֗ים נֶֽאֱסְפוּ֙ לִ/זְבֹּ֧חַ זֶֽבַח גָּד֛וֹל לְ/דָג֥וֹן אֱלֹהֵי/הֶ֖ם וּ/לְ/שִׂמְחָ֑ה וַ/יֹּ֣אמְר֔וּ נָתַ֤ן אֱלֹהֵ֨י/נוּ֙ בְּ/יָדֵ֔/נוּ אֵ֖ת שִׁמְשׁ֥וֹן אוֹיְבֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/023.yaml
  text: The rulers of the Philistines gathered to offer a great sacrifice to Dagon their god and to celebrate[a], and they said[b], “Our god has given Samson our enemy into our hand.”
translation:
  language: id
  text: Para penguasa orang Filistin berkumpul untuk mempersembahkan kurban besar kepada Dagon, dewa mereka, dan untuk bersukacita. Mereka berkata, “Dewa kita telah menyerahkan Simson, musuh kita, ke dalam kekuasaan kita.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סַרְנֵי
  choice: para penguasa
  rationale: Istilah ini menunjuk kepada para pejabat utama negara-negara kota Filistin. 'Para penguasa' jelas dalam bahasa Indonesia modern dan mempertahankan kedudukan pemerintahan mereka.
- source_word: נֶאֱסְפוּ
  choice: berkumpul
  rationale: Bentuk Nifal dari אסף menyatakan bahwa mereka datang bersama sebagai satu kelompok; 'berkumpul' merupakan padanan Indonesia yang alami.
- source_word: לִזְבֹּחַ זֶבַח גָּדוֹל
  choice: untuk mempersembahkan kurban besar
  rationale: Gabungan verba dan nomina serumpun menekankan tindakan pengurbanan. Padanan ini mempertahankan makna tanpa pengulangan yang janggal dalam bahasa Indonesia.
- source_word: לְדָגוֹן אֱלֹהֵיהֶם
  choice: kepada Dagon, dewa mereka
  rationale: Frasa ini menyatakan Dagon sebagai dewa penerima kurban. Koma membantu menandai aposisi secara wajar.
- source_word: וּלְשִׂמְחָה
  choice: dan untuk berpesta
  rationale: שִׂמְחָה dapat menyatakan kegembiraan atau perayaan. Dalam konteks pesta kemenangan umum, 'berpesta' menyampaikan kegiatan perayaan dengan alami.
- source_word: נָתַן ... בְּיָדֵנוּ
  choice: telah menyerahkan ... ke dalam kekuasaan kita
  rationale: Ungkapan Ibrani harfiah 'memberikan ke dalam tangan kita' berarti menyerahkan seseorang kepada kuasa atau kendali pihak lain. Padanan ini menyampaikan idiom tersebut secara jelas.
- source_word: אֵת שִׁמְשׁוֹן
  choice: Simson
  rationale: Nama pribadi ditransliterasikan menurut bentuk baku yang lazim dalam Alkitab bahasa Indonesia.
- source_word: אוֹיְבֵינוּ
  choice: musuh kita
  rationale: Walaupun bentuk katanya secara morfologis tampak jamak, acuannya di sini adalah Simson seorang diri; bentuk tunggal sesuai dengan konteks.
theological_decisions:
- issue: Pemaknaan אֱלֹהֵיהֶם / אֱלֹהֵינוּ dalam konteks penyembahan Dagon
  choice: dewa mereka / Dewa kita
  alternative: allah mereka / Allah kita; dewa-dewa mereka / dewa-dewa kita
  rationale: Kedua bentuk tersebut dalam ayat ini secara khusus mengacu kepada Dagon, sehingga bentuk tunggal paling sesuai dengan sintaksis dan konteks. 'Dewa' membedakan ilah Filistin dari nama atau sebutan bagi Allah Israel tanpa menambahkan gagasan jamak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat panjang sumber dibagi menjadi dua kalimat agar ujaran langsung terbaca alami. Idiom 'ke dalam tangan kita' diterjemahkan menurut maknanya sebagai 'ke dalam kekuasaan kita'; karena itu tidak diperlukan catatan kaki.
