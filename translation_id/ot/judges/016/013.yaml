base_translation:
  language: en
  yaml_path: translation/ot/judges/016/013.yaml
  text: Then Delilah said to Samson[a], “Until now you have mocked me and told me lies. Tell me what you may be bound with.” And he said to her, “If you weave the seven locks of my head with the web.”
translation:
  language: id
  text: Lalu Delila berkata kepada Simson, “Sampai sekarang engkau telah mempermainkan aku dan berkata bohong kepadaku. Katakanlah kepadaku, dengan apa engkau dapat diikat?” Simson menjawabnya, “Jika engkau menenun tujuh kepang rambutku dengan kain tenunan itu[a]—”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani untuk pertenunan di sini bersifat khusus dan maknanya tidak sepenuhnya pasti. Frasa ini juga dapat diterjemahkan, “dengan alat tenun itu” atau “ke dalam kain yang sedang ditenun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵתַ֤לְתָּ בִּי
  choice: engkau telah mempermainkan aku
  rationale: Ungkapan ini menyatakan tindakan memperdaya sambil memperolok atau mempermainkan seseorang. Pilihan ini alami dalam bahasa Indonesia dan tidak mengulang gagasan kebohongan pada klausa berikutnya.
- source_word: כְּזָבִים
  choice: kebohongan
  rationale: Bentuk jamak Ibrani menyatakan berbagai pernyataan palsu; nomina kolektif “kebohongan” terdengar alami dalam konteks ini.
- source_word: הַגִּידָה לִּי
  choice: Katakanlah kepadaku
  rationale: Imperatif ini secara langsung meminta Simson memberitahukan sesuatu kepada Delila; bentuk ini jelas dan tetap bernada mendesak.
- source_word: בַּמֶּה תֵּאָסֵר
  choice: dengan apa engkau dapat diikat
  rationale: Mempertahankan unsur instrumental “dengan apa” dan bentuk pasif dari bahasa Ibrani tanpa mengubahnya menjadi pertanyaan yang lebih umum tentang cara.
- source_word: תַּאַרְגִי
  choice: engkau menenun
  rationale: Verba ארג lazim berarti menenun dan cocok dengan gambaran alat tenun dalam konteks ini.
- source_word: שֶׁבַע מַחְלְפ֥וֹת רֹאשִׁי
  choice: ketujuh kepang rambut kepalaku
  rationale: מחלפות dapat menunjuk pada kepang atau jalinan rambut. “Kepang rambut” mudah dipahami dan menjelaskan bahwa yang dimaksud ialah rambut kepala.
- source_word: עִם הַמַּסָּכֶת
  choice: bersama kain tenunan itu
  rationale: מַסָּכֶת adalah istilah pertenunan yang dapat menunjuk pada kain yang sedang ditenun atau unsur terkait alat tenun. Pilihan ini mempertahankan hubungan “bersama/dengan” dari עִם tanpa memastikan secara berlebihan bahwa rambut ditenun “ke dalam” kain.
