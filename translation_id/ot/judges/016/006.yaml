base_translation:
  language: en
  yaml_path: translation/ot/judges/016/006.yaml
  text: Then Delilah said to Samson[a], “Please tell me where your great strength lies, and how you could be bound to afflict you.”
translation:
  language: id
  text: Lalu Delila berkata kepada Simson, “Tolong katakan kepadaku, di manakah letak kekuatanmu yang besar, dan dengan cara apa engkau dapat diikat untuk menganiayamu?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “untuk merendahkanmu.” Kata kerja Ibrani ini dapat berarti menganiaya, menyengsarakan, atau merendahkan; dalam konteks ini juga dapat dipahami sebagai menundukkan atau mengalahkan seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “Lalu” menyatakan urutan secara alami dalam narasi Indonesia.
- source_word: דְּלִילָה ... שִׁמְשׁוֹן
  choice: Delila ... Simson
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: הַגִּידָה נָּא לִי
  choice: Tolong katakan kepadaku
  rationale: הגיד berarti memberi tahu atau mengatakan, sedangkan נא memberi nuansa permohonan; rumusan ini alami dan tetap mempertahankan nada permintaan.
- source_word: בַּמֶּה כֹּחֲךָ גָדוֹל
  choice: di manakah letak kekuatanmu yang begitu besar
  rationale: Secara harfiah בַּמֶּה berarti “dalam apa”; ungkapan “di manakah letak” menyampaikan pertanyaan tentang sumber atau dasar kekuatan secara alami. גָדוֹל diterjemahkan “begitu besar” untuk mempertahankan sifat predikatif frasa Ibrani.
- source_word: וּבַמֶּה תֵאָסֵר
  choice: dan dengan cara apa engkau dapat diikat
  rationale: Pertanyaan kedua menanyakan sarana atau cara. Niphal תֵאָסֵר menyatakan keadaan pasif “diikat,” sementara “dapat” sesuai dengan konteks kemungkinan.
- source_word: לְעַנּוֹתֶךָ
  choice: supaya engkau dapat ditundukkan
  rationale: Piel ענה dapat berarti menyengsarakan, merendahkan, atau menundukkan. Dalam konteks usaha mengatasi Simson, “ditundukkan” paling alami tanpa menghapus rentang makna kata tersebut.
