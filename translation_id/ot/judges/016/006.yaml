review_pass:
  verdict: revise
  source_fidelity: 'Terjemahan ini pada umumnya mengikuti Ibrani dengan baik: urutan naratif, nama-nama, permohonan, pertanyaan tentang dasar kekuatan, dan kemungkinan Simson diikat semuanya tersampaikan. Namun, לְעַנּוֹתֶךָ secara paling langsung berarti ‘untuk menganiaya/menyengsarakan/merendahkanmu’; ‘ditundukkan’ memilih hasil kontekstual yang lebih sempit daripada verba sumber. Perbaikan pada klausa tujuan diperlukan untuk mempertahankan makna leksikal sambil membiarkan pembacaan kontekstual tersedia dalam catatan kaki.'
  naturalness: Bahasa dan register sudah modern, jelas, dan sesuai narasi Alkitab. ‘Di manakah letak kekuatanmu yang begitu besar’ alami, meskipun ‘yang besar’ cukup untuk adjektiva גָדוֹל. Klausa yang direvisi tetap lancar dalam bahasa Indonesia.
  terminology: ‘Delila’ dan ‘Simson’ sesuai pemakaian Alkitab bahasa Indonesia. ‘Engkau’ konsisten dan tepat bagi register naratif. Untuk ענה, ‘menganiayamu’ lebih dekat dengan ‘afflict’ daripada ‘menundukkanmu’; alternatif ‘merendahkanmu’ dan ‘menundukkanmu’ dapat dicatat tanpa menjadikan salah satunya makna utama.
  issues:
  - severity: medium
    issue: Klausa utama menerjemahkan לְעַנּוֹתֶךָ sebagai ‘supaya engkau dapat ditundukkan.’
    rationale: ‘Menundukkan’ merupakan penafsiran kontekstual yang mungkin, tetapi verba Piel ענה terutama menyatakan menganiaya, menyengsarakan, atau merendahkan. Karena teks sumber tidak secara eksplisit memakai verba ‘menundukkan/mengalahkan’, makna yang lebih langsung sebaiknya dipakai dalam teks utama dan nuansa kontekstual ditempatkan dalam catatan kaki.
  - severity: low
    issue: Catatan kaki menyajikan ‘disiksa’ sebagai alternatif pertama dan merangkum makna verba secara agak tidak seragam dengan teks utama.
    rationale: ‘Disiksa’ dapat terlalu spesifik untuk ענה. Catatan yang memakai ‘merendahkan’ dan ‘menundukkan/mengalahkan dalam konteks’ lebih baik menjaga rentang makna tanpa mempersempitnya.
  revised_text: Lalu Delila berkata kepada Simson, “Tolong katakan kepadaku, di manakah letak kekuatanmu yang besar, dan dengan cara apa engkau dapat diikat untuk menganiayamu?”[a]
