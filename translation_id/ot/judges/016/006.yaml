  to: Lalu Delila berkata kepada Simson, “Tolong katakan kepadaku, di manakah letak kekuatanmu yang besar, dan dengan cara apa engkau dapat diikat untuk menganiayamu?”[a]
  rationale: Revisi mengganti ‘supaya engkau dapat ditundukkan’ dengan ‘untuk menganiayamu’ agar klausa tujuan lebih dekat dengan ענה tanpa meniadakan pembacaan kontekstual ‘menundukkan’. ‘Yang begitu besar’ disederhanakan menjadi ‘yang besar’ untuk mencerminkan גָדוֹל tanpa tambahan penekanan yang tidak diperlukan. Catatan kaki mempertahankan alternatif leksikal dan penafsiran kontekstual.
