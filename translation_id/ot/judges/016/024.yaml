base_translation:
  language: en
  yaml_path: translation/ot/judges/016/024.yaml
  text: When the people saw him, they praised their god, for they said, “Our god has given into our hand our enemy, the devastator of our land, the one who multiplied our slain.”
translation:
  language: id
  text: Ketika orang-orang itu melihat dia, mereka memuji ilah mereka, sebab mereka berkata, “Ilah kita telah menyerahkan ke dalam tangan kita musuh kita, penghancur negeri kita, orang yang telah memperbanyak orang-orang kita yang tewas.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱלֹהֵיהֶם / אֱלֹהֵינוּ
  choice: ilah mereka / ilah kita
  rationale: Konteksnya merujuk kepada dewa orang Filistin. Kata “ilah” menjaga padanan leksikal dan membedakannya secara wajar dari sebutan bagi Allah Israel.
- source_word: נָתַן ... בְיָדֵנוּ
  choice: telah menyerahkan ke dalam tangan kita
  rationale: Mempertahankan idiom Ibrani tentang penyerahan ke dalam kuasa pihak lain, dengan bentuk Indonesia yang tetap dapat dipahami.
- source_word: מַחֲרִיב אַרְצֵנוּ
  choice: penghancur negeri kita
  rationale: Partisipel ini menggambarkan orang yang menghancurkan atau membinasakan negeri mereka; “penghancur” ringkas dan mempertahankan daya tuduhnya.
- source_word: הִרְבָּה אֶת־חֲלָלֵינוּ
  choice: memperbanyak jumlah orang kita yang terbunuh
  rationale: Secara harfiah menyatakan bahwa ia membuat korban tewas mereka menjadi banyak. Penambahan “jumlah” membuat maksud kausatifnya alami dalam bahasa Indonesia tanpa mengubah isinya.
theological_decisions:
- issue: Ucapan orang Filistin yang menghubungkan kemenangan dengan ilah mereka
  choice: Diterjemahkan langsung sebagai isi pujian mereka tanpa koreksi narator
  alternative: Memberi tanda jarak atau penjelasan bahwa klaim itu keliru
  rationale: Teks melaporkan keyakinan para penutur, bukan mengesahkannya. Terjemahan perlu mempertahankan ironi dan ketegangan teologis narasi tanpa menambahkan penilaian eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan “kita” dipertahankan karena mencerminkan sudut pandang kolektif dalam nyanyian pujian orang Filistin.
