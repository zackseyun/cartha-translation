  yaml_path: translation/ot/judges/016/022.yaml
  text: But the hair of his head began to grow again after it had been shaved[a][b].
translation:
  language: id
  text: Namun rambut di kepalanya mulai tumbuh kembali setelah dicukur.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mulai tumbuh”—verba Ibraninya sendiri tidak secara eksplisit memuat arti “kembali”; arti itu dipahami dari konteks pencukuran sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: Atau, “ketika telah dicukur” atau “setelah ia dicukur.” Bahasa Ibrani memungkinkan beberapa cara untuk mengungkapkan anak kalimat waktu ini dan rujukan yang tersirat di dalamnya.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּחֶל
  choice: mulai
  rationale: Bentuk wayyiqtol dari חלל dalam pemakaian ini berarti ‘mulai’ dan secara alami diikuti oleh verba לְצַמֵּחַ.
- source_word: שְׂעַר רֹאשׁוֹ
  choice: rambut di kepalanya
  rationale: Mewakili rangkaian konstruksi harfiah ‘rambut kepalanya’ dengan ungkapan Indonesia yang alami, sambil mempertahankan penekanan pada rambut kepala Simson.
- source_word: לְצַמֵּחַ
  choice: tumbuh kembali
  rationale: צמח berarti ‘tumbuh’ atau ‘bertunas’. Kata ‘kembali’ tersirat dari konteks bahwa rambut itu sebelumnya telah dicukur, tetapi bukan unsur eksplisit verba Ibrani.
- source_word: כַּאֲשֶׁר
  choice: setelah
  rationale: Dalam konteks ini menyatakan hubungan waktu sesudah pencukuran; ‘setelah’ paling jelas dan wajar dalam bahasa Indonesia, meskipun ‘ketika’ juga mungkin.
- source_word: גֻּלָּח
  choice: dicukur
  rationale: Bentuk pasif dari גלח, ‘mencukur’. Bahasa Ibrani tidak menyatakan subjek pelaku, dan dalam bahasa Indonesia bentuk ‘dicukur’ mempertahankan kepasifan serta membiarkan rujukannya dipahami dari konteks.
