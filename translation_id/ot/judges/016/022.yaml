translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang ringkas, alami, dan bermartabat. ‘Namun’ mempertahankan fungsi kontras וַ dalam alur cerita. Catatan kaki menjaga ambiguitas leksikal dan sintaktis teks Ibrani tanpa membebani ayat utama.
