base_translation:
  language: en
  yaml_path: translation/ot/judges/016/021.yaml
  text: Then the Philistines seized him[a], gouged out his eyes, brought him down to Gaza, bound him with bronze shackles[b], and he was grinding in the prison house.
translation:
  language: id
  text: Lalu orang Filistin menangkapnya, mencungkil kedua matanya[a], membawanya turun ke Gaza, membelenggunya dengan belenggu perunggu, dan ia menggiling di penjara[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membutakan matanya.” Kata kerja Ibrani ini menunjuk pada tindakan konkret terhadap mata; “mencungkil” menyatakan kekerasan tindakan itu secara jelas.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di rumah para tahanan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאחֲזוּהוּ
  choice: menangkap dia
  rationale: Kata kerja אחז berarti memegang atau mencengkeram; dalam konteks tindakan bermusuhan ini, “menangkap” menyampaikan bahwa Simson dikuasai oleh orang Filistin secara alami dalam bahasa Indonesia.
- source_word: פְלִשְׁתִּים
  choice: orang Filistin
  rationale: Bentuk baku dalam bahasa Indonesia untuk menyebut kelompok bangsa tersebut.
- source_word: וַיְנַקְּרוּ אֶת־עֵינָיו
  choice: mencungkil kedua matanya
  rationale: נקר di sini menunjuk pada perusakan mata secara konkret. “Mencungkil” mempertahankan kekerasan fisik tindakan itu, sedangkan bentuk dual alami bahasa Indonesia, “kedua matanya,” sesuai dengan acuannya.
- source_word: וַיּוֹרִידוּ אוֹתוֹ עַזָּתָה
  choice: membawanya turun ke Gaza
  rationale: Bentuk kausatif ירד berarti membawa atau menurunkan. “Membawanya turun” mempertahankan unsur arah, sementara akhiran lokatif pada עַזָּתָה menyatakan gerak menuju Gaza.
- source_word: וַיַּאַסְרוּהוּ
  choice: membelenggunya
  rationale: אסר berarti mengikat atau membelenggu. Pilihan ini selaras dengan alat pengekang logam yang langsung disebutkan dan tidak mereduksi tindakan tersebut menjadi sekadar memenjarakan.
- source_word: בַּנְחֻשְׁתַּיִם
  choice: dengan belenggu perunggu
  rationale: Bentuk ini menunjuk pada alat pengekang dari logam. “Belenggu perunggu” jelas, wajar, dan lebih tepat daripada “rantai,” yang tidak dinyatakan secara khusus oleh teks.
- source_word: וַיְהִי טוֹחֵן
  choice: Ia pun menggiling
  rationale: Konstruksi ini menggambarkan kegiatan yang berlangsung sebagai keadaan baru Simson. Objek seperti “gandum” tidak ditambahkan karena tidak terdapat dalam teks Ibrani.
- source_word: בְּבֵית הָאֲסִירִים
  choice: di penjara
  rationale: Secara harfiah ungkapan ini berarti “di rumah para tahanan.” “Di penjara” merupakan padanan Indonesia yang alami, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
