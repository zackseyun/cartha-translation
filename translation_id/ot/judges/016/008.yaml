  text: So the Philistine rulers brought up to her seven fresh bowstrings that had not been dried[a], and she bound him with them.
translation:
  language: id
  text: Lalu para penguasa Filistin[a] membawa kepadanya tujuh tali busur yang masih lembap dan belum dikeringkan, lalu ia mengikatnya dengan tali-tali itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para kepala orang Filistin.” Istilah Ibrani ini merupakan gelar bagi para pejabat utama Filistin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ לָהּ
  choice: membawa kepadanya
  rationale: Bentuk kausatif dari עלה secara harfiah dapat berarti ‘membawa naik’, tetapi dalam konteks ini menyatakan bahwa para penguasa menyediakan dan membawa benda-benda itu kepada perempuan tersebut. Ungkapan ‘membawa kepadanya’ alami dalam bahasa Indonesia tanpa menghilangkan arah tindakannya.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: para penguasa Filistin
  rationale: Istilah סֶרֶן adalah gelar bagi para pejabat utama atau pemimpin politik Filistin. ‘Para penguasa Filistin’ jelas dan wajar bagi pembaca modern, sedangkan kekhasan gelarnya dijelaskan dalam catatan kaki.
- source_word: שִׁבְעָה יְתָרִים
  choice: tujuh tali busur
  rationale: יֶתֶר di sini menunjuk pada tali yang berkaitan dengan busur, bukan sekadar tali biasa. ‘Tali busur’ mempertahankan referen konkret yang paling mungkin dalam kisah ini.
- source_word: לַחִים
  choice: baru
  rationale: Kata ini menyatakan keadaan segar atau masih lembap, yakni belum kering. Dalam bahasa Indonesia, ‘tali busur baru yang belum dikeringkan’ menyampaikan keadaan bahan tersebut secara alami, dengan klausa berikut memperjelas maknanya.
- source_word: אֲשֶׁר לֹא חֹרָבוּ
  choice: yang belum dikeringkan
  rationale: Bentuk ini menekankan bahwa tali-tali itu belum mengalami pengeringan. Terjemahan ini mempertahankan nuansa pasif/resultatif sumber.
- source_word: וַתַּאַסְרֵהוּ
  choice: ia mengikatnya
  rationale: אָסַר berarti ‘mengikat’ atau ‘membelenggu’. Pronomina ‘ia’ dan ‘-nya’ mempertahankan rujukan pronominal teks Ibrani tanpa mengulang nama tokoh yang tidak disebutkan dalam ayat ini.
- source_word: בָּהֶם
  choice: dengan tali-tali itu
  rationale: Preposisi ב menandai alat. Pengulangan ‘tali-tali itu’ lebih jelas daripada ‘dengannya’ dalam bahasa Indonesia dan tetap setia pada rujukan jamak sumber.
theological_decisions: []
translation_notes:
  register: Bahasa naratif modern dan bermartabat. Susunan kalimat mengikuti alur tindakan teks Ibrani, sementara ungkapan yang terlalu harfiah seperti ‘membawa naik’ dihindari. Penanda catatan kaki ditempatkan sesudah frasa yang benar-benar dijelaskannya.
