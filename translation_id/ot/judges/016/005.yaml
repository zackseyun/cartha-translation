  text: וַ/יַּעֲל֨וּ אֵלֶ֜י/הָ סַרְנֵ֣י פְלִשְׁתִּ֗ים וַ/יֹּ֨אמְרוּ לָ֜/הּ פַּתִּ֣י אוֹת֗/וֹ וּ/רְאִי֙ בַּ/מֶּה֙ כֹּח֣/וֹ גָד֔וֹל וּ/בַ/מֶּה֙ נ֣וּכַל ל֔/וֹ וַ/אֲסַרְנֻ֖/הוּ לְ/עַנֹּת֑/וֹ וַ/אֲנַ֨חְנוּ֙ נִתַּן לָ֔/ךְ אִ֕ישׁ אֶ֥לֶף וּ/מֵאָ֖ה כָּֽסֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/005.yaml
  text: Then the lords of the Philistines came up to her and said to her[a], “Entice him, and see in what his great strength lies, and by what means we may prevail against him, so that we may bind him to afflict him; and we will each give you eleven hundred pieces of silver.”
translation:
  language: id
  text: Kemudian para penguasa orang Filistin mendatangi perempuan itu dan berkata kepadanya, “Bujuklah dia dan cari tahu apa sumber kekuatannya yang besar itu serta bagaimana kami dapat mengalahkannya, supaya kami dapat mengikatnya dan membuatnya menderita. Masing-masing dari kami akan memberimu seribu seratus keping perak[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi “seribu seratus perak”. Kemungkinan yang dimaksud ialah seribu seratus keping atau syikal perak dari setiap penguasa Filistin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ אֵלֶיהָ
  choice: mendatangi perempuan itu
  rationale: Kata kerja עלה dengan אֶל menyatakan gerak menuju seseorang. “Mendatangi” alami dalam bahasa Indonesia, sedangkan “perempuan itu” memperjelas rujukan pronomina feminin tanpa menambahkan nama yang tidak terdapat dalam ayat.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: para penguasa orang Filistin
  rationale: סֶרֶן adalah gelar khusus bagi para pemimpin Filistin. “Para penguasa” mempertahankan fungsi jabatan itu tanpa menyamakan mereka secara pasti dengan raja.
- source_word: פַּתִּי
  choice: Bujuklah
  rationale: Bentuk piel imperatif dari פתה di sini berarti memikat atau membujuk dengan maksud manipulatif. “Bujuklah” alami dan tidak memasukkan unsur seksual yang tidak diwajibkan oleh kata sumber.
- source_word: וּרְאִי בַּמֶּה כֹּחוֹ גָדוֹל
  choice: dan cari tahu apa sumber kekuatannya yang besar itu
  rationale: בַּמֶּה menanyakan dasar atau sarana kekuatan Simson. “Apa sumber” menyampaikan pertanyaan itu secara jelas dan wajar dalam bahasa Indonesia.
- source_word: וּבַמֶּה נוּכַל לוֹ
  choice: serta bagaimana kami dapat mengalahkannya
  rationale: Idiom יכל ל berarti mampu melawan, mengatasi, atau mengalahkan seseorang. “Mengalahkannya” sesuai dengan konteks permusuhan dan penangkapan.
- source_word: וַאֲסַרְנֻהוּ לְעַנֹּתוֹ
  choice: supaya kami dapat mengikatnya dan membuatnya menderita
  rationale: אָסַר berarti mengikat atau membelenggu. Piel ענה dapat berarti menindas, merendahkan, atau membuat menderita; ungkapan yang dipilih mempertahankan keluasan maknanya tanpa mempersempitnya menjadi penyiksaan tertentu.
- source_word: וַאֲנַחְנוּ נִתַּן לָךְ אִישׁ אֶלֶף וּמֵאָה כָּסֶף
  choice: Masing-masing dari kami akan memberimu seribu seratus keping perak
  rationale: אִישׁ dipakai secara distributif, yaitu setiap penguasa akan memberikan jumlah tersebut. “Keping” melengkapi ungkapan eliptis Ibrani agar jelas dalam bahasa Indonesia, sementara ketidakpastian satuannya dicatat dalam catatan kaki.
