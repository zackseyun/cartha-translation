  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Pronomina objek “dia/-nya” digunakan secara alami; istilah jabatan dan nilai perak diterangkan tanpa memaksakan kepastian yang tidak dinyatakan dalam teks Ibrani.
