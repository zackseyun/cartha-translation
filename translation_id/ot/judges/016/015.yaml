base_translation:
  language: en
  yaml_path: translation/ot/judges/016/015.yaml
  text: Then she said to him[a], “How can you say, ‘I love you,’ when your heart is not with me? These three times you have mocked me and have not told me in what your great strength lies.”
translation:
  language: id
  text: Lalu ia berkata kepadanya, “Bagaimana mungkin engkau berkata, ‘Aku mencintaimu,’ padahal hatimu tidak bersamaku? Sudah tiga kali engkau mempermainkan aku[a] dan tidak memberitahukan kepadaku apa yang menjadi sumber kekuatanmu yang besar.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “memperolok aku,” “memperdaya aku,” atau “memperbodoh aku.” Kata kerja Ibrani ini menggambarkan tindakan mempermainkan seseorang melalui ejekan yang menipu.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיךְ
  choice: Bagaimana mungkin
  rationale: Mengungkapkan tantangan retoris dan ketidakpercayaan Delila secara wajar dalam bahasa Indonesia.
- source_word: אֲהַבְתִּיךְ
  choice: Aku mencintaimu
  rationale: Bentuk perfek dalam ujaran langsung ini menyatakan pengakuan kasih yang dianggap sedang berlangsung, sehingga bentuk kini paling alami.
- source_word: לִבְּךָ אֵין אִתִּי
  choice: hatimu tidak bersamaku
  rationale: Mempertahankan ungkapan Ibrani tentang kesetiaan dan keterikatan batin tanpa mempersempit maknanya.
- source_word: זֶה שָׁלֹשׁ פְּעָמִים
  choice: Sudah tiga kali
  rationale: Padanan Indonesia yang alami untuk ungkapan Ibrani mengenai tiga kejadian yang telah berulang sampai saat ini.
- source_word: הֵתַלְתָּ בִּי
  choice: engkau mempermainkan aku
  rationale: Kata kerja ini mencakup tindakan memperolok atau memperdaya seseorang dengan jawaban menyesatkan; 'mempermainkan' mempertahankan keluasan nuansa tersebut.
- source_word: הִגַּדְתָּ לִּי
  choice: tidak memberitahukan kepadaku
  rationale: Padanan percakapan yang jelas bagi tindakan menyampaikan atau membuat sesuatu diketahui.
- source_word: בַּמֶּה כֹּחֲךָ גָדוֹל
  choice: di mana letak kekuatanmu yang besar itu
  rationale: Mengungkapkan pertanyaan tentang dasar atau sumber kekuatan Simson dengan idiom Indonesia yang alami tanpa menentukan jawaban teologis atau mekanisnya.
