review_pass:
  verdict: revise
  source_fidelity: 'Terjemahan umumnya setia kepada teks Ibrani: pengulangan pengungkapan ‘seluruh isi hati’ dipertahankan, pronomina feminin orang ketiga dalam ucapan Delila tidak dinormalisasi, dan para penguasa datang sambil membawa perak. Namun, ‘ia menyuruh orang memanggil’ merangkum dua verba naratif וַתִּשְׁלַח וַתִּקְרָא dan kurang jelas mempertahankan unsur ‘mengutus’.'
  naturalness: Bahasa Indonesia baku, jelas, dan bernada naratif alami. ‘Seluruh isi hatinya’ merupakan padanan idiomatis yang baik. Revisi kecil pada tindakan Delila membuat urutan tindakannya lebih dekat dengan sumber tanpa menjadi kaku.
  terminology: ‘Delila’, ‘Simson’, ‘Filistin’, dan ‘para penguasa Filistin’ sesuai penggunaan modern dan konteks. Catatan alternatif ‘para pembesar Filistin’ membantu menjelaskan gelar סַרְנֵי tanpa memaksakan padanan tunggal.
  issues:
