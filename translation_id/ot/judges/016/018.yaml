  text: וַ/תֵּ֣רֶא דְלִילָ֗ה כִּֽי הִגִּ֣יד לָ/הּ֮ אֶת כָּל לִבּ/וֹ֒ וַ/תִּשְׁלַ֡ח וַ/תִּקְרָא֩ לְ/סַרְנֵ֨י פְלִשְׁתִּ֤ים לֵ/אמֹר֙ עֲל֣וּ הַ/פַּ֔עַם כִּֽי הִגִּ֥יד ל/ה אֶת כָּל לִבּ֑/וֹ וְ/עָל֤וּ אֵלֶ֨י/הָ֙ סַרְנֵ֣י פְלִשְׁתִּ֔ים וַ/יַּעֲל֥וּ הַ/כֶּ֖סֶף בְּ/יָדָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/018.yaml
  text: When Delilah saw that he had told her all his heart[a], she sent and called for the Philistine rulers, saying, “Come up this time[c][b], for he has told her all his heart.” Then the Philistine rulers came up to her and brought the silver in their hands.
translation:
  language: id
  text: Ketika Delila melihat bahwa Simson telah menceritakan seluruh isi hatinya kepadanya, ia mengutus orang untuk memanggil para penguasa Filistin[b] dan berkata, “Datanglah kali ini, sebab ia telah menceritakan seluruh isi hatinya kepadanya[a].” Lalu para penguasa Filistin datang menemuinya dengan membawa perak itu[c] di tangan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani berbunyi “kepadanya,” dengan pronomina feminin orang ketiga. Dalam ucapan langsung ini, sebagian pembaca mungkin mengharapkan “kepadaku.”
    reason: textual_variant
  - marker: b
    text: 'Atau: “para pembesar Filistin.” Istilah Ibrani menunjuk para penguasa utama Filistin.'
    reason: lexical_alternative
  - marker: c
    text: Perak ini adalah pembayaran yang dijanjikan kepada Delila.
    reason: cultural_note
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: Ketika ... melihat
  rationale: Bentuk naratif ini melanjutkan rangkaian peristiwa. 'Ketika ... melihat' menyampaikan hubungan waktu secara alami tanpa mengganti verba 'melihat' dengan tafsiran seperti 'menyadari'.
- source_word: כִּי
  choice: bahwa
  rationale: Sesudah 'melihat', כִּי memperkenalkan isi yang dipahami Delila, bukan terutama alasan sebab-akibat.
- source_word: הִגִּיד
  choice: telah menceritakan
  rationale: Bentuk Hifil dari נגד berarti memberitahukan atau menceritakan. Pilihan ini alami dalam konteks pengungkapan rahasia dan tetap mempertahankan gagasan bahwa Simson menyampaikan sesuatu kepada Delila.
- source_word: אֶת כָּל לִבּוֹ
  choice: seluruh isi hatinya
  rationale: Ungkapan ini mempertahankan citra 'hati' dalam bahasa Ibrani sekaligus terdengar wajar dalam bahasa Indonesia; maksudnya ialah pengungkapan sepenuhnya, bukan sekadar emosi.
- source_word: וַתִּשְׁלַח וַתִּקְרָא
  choice: ia menyuruh orang memanggil
  rationale: Dua verba Ibrani, secara harfiah 'mengutus dan memanggil', disampaikan melalui ungkapan Indonesia yang alami untuk tindakan mengirim seseorang guna memanggil para penguasa.
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: para penguasa Filistin
  rationale: סרן menunjuk para pejabat atau pemimpin tertinggi khas Filistin. 'Para penguasa Filistin' jelas bagi pembaca modern dan tidak memberi kesan gelar feodal.
- source_word: עֲלוּ הַפַּעַם
  choice: Datanglah kali ini
  rationale: עלה menyatakan gerak menuju tempat Delila, sedangkan הַפַּעַם menandai bahwa kesempatan yang benar telah tiba setelah upaya-upaya sebelumnya.
- source_word: כִּי הִגִּיד לָהּ אֶת כָּל לִבּוֹ
  choice: sebab ia telah menceritakan seluruh isi hatinya kepadanya
  rationale: Terjemahan mempertahankan pronomina feminin orang ketiga dalam teks Ibrani yang diterima, meskipun dalam ucapan langsung bentuk orang pertama akan lebih lazim.
- source_word: וְעָלוּ אֵלֶיהָ
  choice: Lalu ... datang menemuinya
  rationale: Pilihan ini menyampaikan gerak para penguasa menuju Delila dalam bahasa Indonesia yang alami.
- source_word: וַיַּעֲלוּ הַכֶּסֶף בְּיָדָם
  choice: dengan membawa perak itu di tangan mereka
  rationale: Terjemahan mempertahankan 'perak' dan gambaran bahwa mereka membawanya sendiri; konteks menunjukkan bahwa perak tersebut merupakan pembayaran yang dijanjikan.
