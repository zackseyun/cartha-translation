translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Repetisi 'seluruh isi hatinya' dipertahankan karena menonjol dalam teks sumber. Bentuk 'kepadanya' dalam ucapan langsung sengaja tidak dibetulkan menjadi 'kepadaku'; ketegangan tekstual dijelaskan dalam catatan kaki. Penanda catatan ditempatkan tepat pada unsur yang dijelaskannya.
