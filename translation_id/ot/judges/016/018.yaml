  to: Ketika Delila melihat bahwa Simson telah menceritakan seluruh isi hatinya kepadanya, ia mengutus orang untuk memanggil para penguasa Filistin[b] dan berkata, “Datanglah kali ini, sebab ia telah menceritakan seluruh isi hatinya kepadanya[a].” Lalu para penguasa Filistin datang menemuinya dengan membawa perak itu[c] di tangan mereka.
