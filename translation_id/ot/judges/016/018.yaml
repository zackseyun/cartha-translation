    issue: Dua verba ‘mengutus dan memanggil’ diringkas menjadi ‘menyuruh orang memanggil’.
    rationale: Ungkapan draf dapat dipahami, tetapi ‘ia mengutus orang untuk memanggil’ dengan lebih jelas merepresentasikan וַתִּשְׁלַח וַתִּקְרָא sambil tetap alami dalam bahasa Indonesia.
  - severity: medium
    issue: Penanda catatan c ditempatkan pada ‘tangan mereka’, padahal catatan menjelaskan ‘perak’.
    rationale: Penanda harus melekat pada unsur yang diterangkan. Memindahkannya ke ‘perak itu’ memperbaiki jangkar catatan tanpa mengubah makna.
