  text: Then Delilah said to Samson[a], “Look, you have mocked me and spoken lies to me. Now please tell me what you may be bound with.”
translation:
  language: id
  text: Lalu Delila berkata kepada Simson, “Lihatlah, engkau telah mempermainkan aku[a] dan berkata bohong kepadaku. Sekarang, tolong beri tahu aku dengan apa engkau dapat diikat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah memperolok aku”; kata kerja Ibrani ini dapat berarti memperolok atau memperdaya seseorang dengan menjadikannya bahan permainan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: Lalu ... berkata
  rationale: Waw konsekutif melanjutkan urutan narasi; “Lalu” menghasilkan alur bahasa Indonesia yang alami.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Berfungsi sebagai seruan untuk menarik perhatian sebelum tuduhan Delila; “Lihat” mempertahankan daya deiktisnya dalam bahasa modern.
- source_word: הֵתַלְתָּ בִּי
  choice: engkau telah mempermainkan aku
  rationale: Kata kerja התל di sini menyiratkan memperolok atau memperdaya seseorang dengan menjadikannya bahan permainan. “Mempermainkan aku” menangkap unsur penipuan dan penghinaan tanpa bertumpang tindih sepenuhnya dengan klausa berikutnya.
- source_word: וַתְּדַבֵּר אֵלַי כְּזָבִים
  choice: dan mengatakan kebohongan-kebohongan kepadaku
  rationale: Mempertahankan tindakan berbicara, penerima ujaran, dan bentuk jamak כְּזָבִים, sambil tetap wajar dalam bahasa Indonesia.
- source_word: עַתָּה
  choice: Sekarang
  rationale: Menandai peralihan dari tuduhan kepada permintaan baru.
- source_word: הַגִּידָה נָּא לִי
  choice: tolong beri tahu aku
  rationale: Partikel נָא melunakkan imperatif menjadi permohonan; “tolong” menyampaikan nuansa itu dengan alami.
- source_word: בַּמֶּה תֵּאָסֵר
  choice: dengan apa engkau dapat diikat
  rationale: בַּמֶּה menanyakan alat atau sarana, “dengan apa,” sedangkan bentuk Nifal תֵּאָסֵר menyatakan keadaan pasif “diikat”; “dapat” sesuai dengan kemungkinan dalam konteks.
