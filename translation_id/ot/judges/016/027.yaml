  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Kata 'rumah' dipertahankan tanpa mengkhususkannya sebagai aula atau kuil. Ambiguitas ungkapan terakhir dipertahankan melalui catatan kaki.
