base_translation:
  language: en
  yaml_path: translation/ot/judges/016/027.yaml
  text: The house was full of men and women[a], and all the lords of the Philistines were there. And on the roof were about three thousand men and women watching Samson as he performed.
translation:
  language: id
  text: Rumah itu penuh dengan laki-laki dan perempuan, dan semua penguasa orang Filistin ada di sana. Di atas atap ada kira-kira tiga ribu laki-laki dan perempuan yang menyaksikan Simson beraksi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyaksikan Simson bermain” atau “menyaksikan Simson dipermainkan.” Ungkapan Ibrani memakai akar kata שׂחק, yang dapat berarti tertawa, bermain, bersenda gurau, menghibur, atau mempermainkan seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבַּיִת
  choice: rumah itu
  rationale: Makna dasarnya ialah rumah atau bangunan. Konteks menunjuk pada bangunan dalam kompleks kuil Dagon, tetapi teks hanya menyebut 'rumah itu', sehingga terjemahan tidak mempersempit acuannya.
- source_word: מָלֵא
  choice: penuh dengan
  rationale: Mengungkapkan keadaan 'penuh' secara alami dalam bahasa Indonesia.
- source_word: הָאֲנָשִׁים ... וְהַנָּשִׁים
  choice: laki-laki dan perempuan
  rationale: Mempertahankan penyebutan eksplisit kedua jenis kelamin dalam kerumunan.
- source_word: כֹּל סַרְנֵי פְלִשְׁתִּים
  choice: semua penguasa orang Filistin
  rationale: סרנים adalah gelar bagi para pemimpin politik khas Filistin. 'Penguasa' jelas dan wajar dalam bahasa Indonesia tanpa mengimpor gelar feodal yang asing.
- source_word: וְעַל הַגָּג
  choice: Di atas atap
  rationale: Mempertahankan latar tempat yang ditempatkan di depan dalam bahasa Ibrani.
- source_word: כִּשְׁלֹשֶׁת אֲלָפִים
  choice: kira-kira tiga ribu
  rationale: Prefiks כ־ menyatakan perkiraan jumlah.
- source_word: הָרֹאִים
  choice: yang menyaksikan
  rationale: Partisip ini menggambarkan kerumunan yang terus memperhatikan tontonan tersebut.
- source_word: בִּשְׂחוֹק שִׁמְשׁוֹן
  choice: Simson dipermainkan
  rationale: Frasa ini secara harfiah sulit dan memakai akar שׂחק, yang dapat berkaitan dengan tertawa, bermain, bersenda gurau, atau menjadikan seseorang hiburan. Bentuk pasif 'dipermainkan' sesuai dengan konteks penghinaan terhadap Simson, tetapi ketidakpastian leksikal tetap dijelaskan dalam catatan.
