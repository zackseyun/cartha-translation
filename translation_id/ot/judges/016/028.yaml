  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּקְרָ֥א שִׁמְשׁ֛וֹן אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר אֲדֹנָ֣/י יֱהֹוִ֡ה זָכְרֵ֣/נִי נָא֩ וְ/חַזְּקֵ֨/נִי נָ֜א אַ֣ךְ הַ/פַּ֤עַם הַ/זֶּה֙ הָ/אֱלֹהִ֔ים וְ/אִנָּקְמָ֧ה נְקַם אַחַ֛ת מִ/שְּׁתֵ֥י עֵינַ֖/י מִ/פְּלִשְׁתִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/028.yaml
  text: Then Samson called to Yahweh and said[a], “Lord GOD, please remember me, and please strengthen me just this once, O God, so that I may take vengeance on the Philistines for my two eyes with one act of vengeance.”
translation:
  language: id
  text: Lalu Simson berseru kepada Yahweh dan berkata, “Tuhan Yahweh, ingatlah aku, kiranya, dan kuatkanlah aku, kiranya, hanya kali ini saja, ya Allah, supaya aku dapat menuntut balas kepada orang Filistin atas kedua mataku dengan satu tindakan pembalasan.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “menuntut balas satu pembalasan dari orang Filistin atas kedua mataku.” Ungkapan “satu pembalasan” menekankan satu tindakan pembalasan; susunan Ibraninya padat.'
    reason: Menjelaskan konstruksi kognat dan fungsi “satu” tanpa menjadikan “salah satu mata” sebagai arti utama.
lexical_decisions:
- source_word: וַיִּקְרָא שִׁמְשׁוֹן אֶל־יְהוָה
  choice: Lalu Simson berseru kepada Yahweh
  rationale: קרא אל dalam konteks doa berarti berseru atau memanggil kepada Allah. “Berseru kepada” alami dalam bahasa Indonesia dan menyampaikan tindakan memohon tanpa menambahkan emosi yang berlebihan; nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”.
- source_word: אֲדֹנָי יֱהֹוִה
  choice: Tuhan YAHWEH
  rationale: Terjemahan ini membedakan gelar אֲדֹנָי (“Tuhan”) dari nama ilahi יְהוָה (“YAHWEH”) serta menghindari peleburan keduanya menjadi satu gelar umum.
- source_word: זָכְרֵנִי נָא
  choice: ingatlah kiranya kepadaku
  rationale: Bentuk perintah dengan נָא menyatakan permohonan. “Kiranya” mempertahankan nada memohon yang khidmat, sedangkan “ingatlah kepadaku” wajar dalam register doa dan tidak sekadar berarti mengingat secara mental.
- source_word: וְחַזְּקֵנִי נָא
  choice: dan berilah aku kekuatan kiranya
  rationale: Bentuk Piel dari חזק meminta agar Allah memberikan kekuatan. Ungkapan ini lebih alami daripada “kuatkanlah aku” sambil tetap tepat secara makna.
- source_word: אַךְ הַפַּעַם הַזֶּה
  choice: hanya kali ini saja
  rationale: אַךְ membatasi permohonan itu pada kesempatan sekarang. “Hanya kali ini saja” mempertahankan penekanan eksklusifnya.
- source_word: הָאֱלֹהִים
  choice: ya Allah
  rationale: Kata ini berfungsi sebagai sapaan langsung. Partikel “ya” menandai vokatif secara alami dalam doa bahasa Indonesia.
- source_word: וְאִנָּקְמָה נְקַם
  choice: supaya aku dapat membalas
  rationale: Bentuk kohortatif menyatakan tujuan atau keinginan Simson. Verba “membalas” menangkap gagasan menuntut pembalasan tanpa membuat konstruksi serumpun Ibrani terdengar kaku.
- source_word: אַחַת מִשְּׁתֵי עֵינַי
  choice: demi salah satu dari kedua mataku
  rationale: Secara tata bahasa, אַחַת berbentuk feminin dan paling langsung dipahami sebagai “satu” dari kedua mata Simson. Terjemahan ini mempertahankan ungkapan Ibrani yang mencolok, sementara kemungkinan hubungan “satu” dengan tindakan pembalasan dicatat dalam catatan kaki.
- source_word: מִפְּלִשְׁתִּים
  choice: orang Filistin
  rationale: Dengan akar נקם, preposisi מִן menandai pihak yang menjadi sasaran pembalasan. Dalam bahasa Indonesia, verba transitif “membalas orang Filistin” menyampaikannya secara ringkas dan alami.
theological_decisions:
- issue: Nama dan gelar ilahi dalam doa Simson
  choice: Membedakan יְהוָה sebagai “Yahweh” dan אֲדֹנָי יֱהֹוִה sebagai “Tuhan YAHWEH”
  alternative: “TUHAN” dan “Tuhan ALLAH”
  rationale: Pilihan ini mempertahankan nama pribadi ilahi dan susunan gelar majemuk dalam teks Ibrani, tanpa mengganti nama itu dengan gelar atau melebur kedua unsur sapaan.
- issue: Ruang lingkup pembalasan atas mata Simson
  choice: “demi salah satu dari kedua mataku” dalam teks utama
  alternative: “dengan satu tindakan pembalasan atas kedua mataku”
  rationale: Bentuk feminin אַחַת paling wajar berkaitan dengan עין yang juga feminin, sehingga menunjuk kepada salah satu dari dua mata. Namun, susunan padat dan konstruksi pembalasan serumpun memungkinkan hubungan lain; alternatif itu dicatat agar ambiguitas sumber tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan register doa yang khidmat tetapi mudah dipahami. Pengulangan “kiranya” dipertahankan karena teks Ibrani mengulang partikel permohonan נָא. Nama Yahweh dipertahankan, dan huruf kapital pada “YAHWEH” dalam gelar majemuk membantu membedakannya dari “Tuhan” sebagai gelar.
