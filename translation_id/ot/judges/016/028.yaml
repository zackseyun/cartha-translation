revisions:
- from: Lalu Simson berseru kepada Yahweh, katanya, “Tuhan YAHWEH, ingatlah kiranya kepadaku dan berilah aku kekuatan kiranya, hanya kali ini saja, ya Allah, supaya aku dapat membalas orang Filistin demi salah satu dari kedua mataku.”[a]
  to: Lalu Simson berseru kepada Yahweh dan berkata, “Tuhan Yahweh, ingatlah aku, kiranya, dan kuatkanlah aku, kiranya, hanya kali ini saja, ya Allah, supaya aku dapat menuntut balas kepada orang Filistin atas kedua mataku dengan satu tindakan pembalasan.”[a]
  rationale: 'Revisi mengoreksi kesalahan utama pada hubungan “satu” dan “kedua mataku,” sambil mempertahankan urutan gagasan Ibrani: permohonan kepada Yahweh, permohonan untuk diingat dan dikuatkan pada kesempatan ini saja, lalu tujuan menuntut balas kepada orang Filistin atas kedua mata Simson melalui satu tindakan pembalasan. Catatan kaki kini menjelaskan kepadatan ungkapan Ibrani secara proporsional.'
