  text: Then Samson said to the young man who was holding his hand, “Let me rest, and guide me to the pillars on which the house stands, so that I may lean against them.”
translation:
  language: id
  text: Lalu Simson berkata kepada anak muda yang memegang tangannya itu, “Biarkan aku beristirahat dan meraba tiang-tiang yang menopang rumah itu, supaya aku dapat bersandar pada tiang-tiang itu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנִּיחָה אוֹתִי
  choice: Biarkan aku beristirahat
  rationale: Ungkapan ini secara harfiah meminta agar Simson dibiarkan atau diberi kesempatan untuk beristirahat; pilihan ini mempertahankan makna kausatif dan sesuai dengan konteks.
- source_word: ו/הימש/ני
  choice: dan tuntunlah aku ke
  rationale: Bentuk teks WLC ini sulit secara morfologis, tetapi dalam konteks seorang anak muda yang memegang tangan Simson, makna mengarahkan atau menuntunnya menuju tiang-tiang paling masuk akal.
- source_word: הָעַמֻּדִים אֲשֶׁר הַבַּיִת נָכוֹן עֲלֵיהֶם
  choice: tiang-tiang yang menyangga rumah ini
  rationale: נָכוֹן di sini menyatakan bahwa bangunan berdiri kukuh atau ditopang di atas tiang-tiang tersebut; 'menyangga' mengungkapkan hubungan struktural itu secara alami dalam bahasa Indonesia.
- source_word: וְאֶשָּׁעֵן עֲלֵיהֶם
  choice: supaya aku dapat bersandar padanya
  rationale: Menyampaikan tujuan permintaan Simson dan arti verba 'bersandar' tanpa menambahkan motif yang belum dinyatakan dalam ayat ini.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. 'Anak muda' dipilih untuk הַנַּעַר tanpa menentukan usia lebih sempit, dan objek tunggal 'padanya' merujuk secara kolektif pada tiang-tiang.
