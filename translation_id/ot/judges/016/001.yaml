source:
  edition: WLC
  text: וַ/יֵּ֥לֶךְ שִׁמְשׁ֖וֹן עַזָּ֑תָ/ה וַ/יַּרְא שָׁם֙ אִשָּׁ֣ה זוֹנָ֔ה וַ/יָּבֹ֖א אֵלֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/016/001.yaml
  text: Samson went to Gaza[a], and there he saw a prostitute, and he went in to her.
translation:
  language: id
  text: Simson pergi ke Gaza. Di sana ia melihat seorang pelacur, lalu ia menghampiri perempuan itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ia berhubungan seksual dengan perempuan itu.” Secara harfiah, bahasa Ibrani berbunyi “ia masuk kepada perempuan itu,” suatu ungkapan halus yang dalam konteks ini lazim menunjuk kepada hubungan seksual.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: pergi
  rationale: Dalam rangkaian narasi, verba ini menyatakan gerak biasa; “pergi” merupakan padanan Indonesia yang alami dan tidak menambahkan nuansa perjalanan yang tidak dinyatakan.
- source_word: שִׁמְשׁוֹן
  choice: Simson
  rationale: Mengikuti bentuk nama yang lazim dan dikenal luas dalam tradisi Alkitab bahasa Indonesia.
- source_word: עַזָּתָה
  choice: ke Gaza
  rationale: Akhiran penunjuk arah pada nama tempat menyatakan gerak menuju kota itu; bahasa Indonesia secara alami memakai preposisi “ke”.
- source_word: וַיַּרְא שָׁם
  choice: Di sana ia melihat
  rationale: Urutan ini menyampaikan adverbia tempat secara alami dalam bahasa Indonesia sambil mempertahankan kesinambungan narasi Ibrani.
- source_word: אִשָּׁה זוֹנָה
  choice: seorang pelacur
  rationale: זוֹנָה menunjuk kepada perempuan yang melakukan prostitusi. “Pelacur” jelas, modern, dan lebih tepat daripada ungkapan yang sekadar berarti perempuan amoral atau suka berganti pasangan.
- source_word: וַיָּבֹא אֵלֶיהָ
  choice: lalu ia mendatangi perempuan itu
  rationale: Ungkapan Ibrani secara harfiah menyatakan bahwa Simson datang atau masuk kepadanya, tetapi dalam konteks ini berfungsi sebagai eufemisme seksual. “Mendatangi perempuan itu” mempertahankan ungkapan tidak langsung tanpa membuat arti seksualnya lebih eksplisit daripada teks sumber.
theological_decisions:
- issue: Apakah makna seksual וַיָּבֹא אֵלֶיהָ harus dinyatakan secara eksplisit
  choice: 'Mempertahankan eufemisme dalam teks utama: “ia mendatangi perempuan itu”'
  alternative: “ia berhubungan seksual dengan perempuan itu” atau “ia tidur dengan perempuan itu”
  rationale: Konteks sangat kuat menyiratkan hubungan seksual, tetapi bahasa Ibrani memakai ungkapan konvensional yang tidak langsung. Teks utama mempertahankan tingkat keeksplisitan tersebut, sedangkan catatan kaki menjelaskan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Kalimat dibagi menjadi dua agar alur tempat dan tindakan terbaca alami. Pengulangan “perempuan itu” dipilih daripada pronomina semata untuk menjaga kejelasan rujukan. Penanda catatan kaki ditempatkan langsung sesudah ungkapan yang dijelaskannya.
