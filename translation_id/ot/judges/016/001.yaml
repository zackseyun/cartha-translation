revisions:
- from: Simson pergi ke Gaza. Di sana ia melihat seorang pelacur, lalu ia mendatangi perempuan itu.[a]
  to: Simson pergi ke Gaza. Di sana ia melihat seorang pelacur, lalu ia menghampiri perempuan itu.[a]
  rationale: The revision preserves the Hebrew euphemism without making the main text more explicit than the source. It also avoids the overly neutral implication of “mendatangi,” while the anchored footnote gives both the literal wording and its contextual sexual sense.
