review_pass:
  verdict: revise
  source_fidelity: “Simson pergi ke Gaza” and “Di sana ia melihat seorang pelacur” faithfully render the Hebrew narrative, directional form, and designation אִשָּׁה זוֹנָה. However, “mendatangi perempuan itu” is too neutral in modern Indonesian and can simply mean paying someone a visit; it does not adequately retain the contextual sexual-euphemistic function of וַיָּבֹא אֵלֶיהָ.
  naturalness: The prose is clear, modern, and appropriately restrained. Replacing “mendatangi” with “menghampiri” supplies a more established Indonesian biblical euphemism while retaining indirectness. The two-sentence structure is natural.
  terminology: “Simson,” “Gaza,” and “pelacur” are standard and appropriate. “Pelacur” accurately conveys the occupational sense of זוֹנָה without archaic or moralizing language. The footnote should state the literal Hebrew idiom more accurately as “ia masuk kepada perempuan itu.”
  issues:
  - severity: medium
    issue: The main-text rendering “lalu ia mendatangi perempuan itu” weakens the sexual euphemism.
    rationale: In current Indonesian, mendatangi commonly means to visit or go to someone and does not normally signal sexual relations. Hebrew בוא אל, in this context, is a conventional euphemism for sexual intercourse. “Menghampiri” remains indirect but better preserves the biblical idiomatic register, with the footnote clarifying the sense.
  revised_text: Simson pergi ke Gaza. Di sana ia melihat seorang pelacur, lalu ia menghampiri perempuan itu.[a]
  revised_footnotes:
  - marker: a
    text: Atau “ia berhubungan seksual dengan perempuan itu.” Secara harfiah, bahasa Ibrani berbunyi “ia masuk kepada perempuan itu,” suatu ungkapan halus yang dalam konteks ini lazim menunjuk kepada hubungan seksual.
    reason: lexical_alternative
  revision_rationale: The revision preserves the Hebrew euphemism without making the main text more explicit than the source. It also avoids the overly neutral implication of “mendatangi,” while the anchored footnote gives both the literal wording and its contextual sexual sense.
