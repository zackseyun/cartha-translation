  text: וַ/תֹּ֨אמֶר ל֜/וֹ הָֽבָ/ה לִּ֣/י בְרָכָ֗ה כִּ֣י אֶ֤רֶץ הַ/נֶּ֨גֶב֙ נְתַתָּ֔/נִי וְ/נָתַתָּ֥ה לִ֖/י גֻּלֹּ֣ת מָ֑יִם וַ/יִּתֶּן לָ֣/הּ כָּלֵ֗ב אֵ֚ת גֻּלֹּ֣ת עִלִּ֔ית וְ/אֵ֖ת גֻּלֹּ֥ת תַּחְתִּֽית־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/015.yaml
  text: She said to him[a], “Please give me a blessing, because you have given me the land of the Negev[b]; give me also springs of water.” So Caleb gave her the upper springs and the lower springs.
translation:
  language: id
  text: Ia berkata kepadanya, “Berikanlah kepadaku suatu berkat. Karena engkau telah memberikan kepadaku tanah Negeb[a], berikanlah juga kepadaku sumber-sumber air[b].” Maka Kaleb memberikan kepadanya sumber-sumber air yang di sebelah atas dan yang di sebelah bawah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanah Selatan.” Kata Ibrani negeb dapat menjadi nama kawasan (“Negeb”) atau menunjuk pada daerah selatan yang kering.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani ini dapat menunjuk pada mata air, kolam, atau sumber air lainnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבָה לִּי בְרָכָה
  choice: Berikanlah kepadaku suatu berkat
  rationale: Mempertahankan makna harfiah ‘berkat’ sambil menyampaikan bentuk permohonan dengan akhiran -lah; dalam konteks ini berkat itu berupa pemberian yang bermanfaat.
- source_word: אֶרֶץ הַנֶּגֶב
  choice: tanah Negeb
  rationale: Negeb dapat menjadi nama kawasan selatan yang kering maupun sebutan topografis; transliterasi nama wilayah mempertahankan rujukan geografis tanpa meniadakan ambiguitasnya.
- source_word: גֻּלֹּת מָיִם
  choice: sumber-sumber air
  rationale: Istilah Ibrani menunjuk pada tempat-tempat tersedianya air, mungkin mata air, kolam, atau sumber air lain; pilihan umum ini menjaga ketidakpastian leksikal.
- source_word: גֻּלֹּת עִלִּית
  choice: sumber-sumber air yang di sebelah atas
  rationale: Menerjemahkan unsur ‘atas’ secara topografis dan mempertahankan keterkaitannya dengan sumber-sumber air yang diminta.
- source_word: גֻּלֹּת תַּחְתִּית
  choice: sumber-sumber air yang di sebelah bawah
  rationale: Menerjemahkan unsur ‘bawah’ sebagai pasangan yang jelas bagi sumber-sumber di sebelah atas.
- source_word: וַיִּתֶּן לָהּ כָּלֵב
  choice: Maka Kaleb memberikan kepadanya
  rationale: ‘Maka’ menyampaikan kemajuan sekaligus hubungan hasil dalam alur narasi, dan nama Kaleb tetap menjadi subjek sebagaimana dalam bahasa sumber.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kata ganti ‘engkau’ dipertahankan dalam ujaran langsung karena sesuai dengan hubungan pribadi dan tidak menambahkan sapaan kekerabatan yang tidak dinyatakan dalam teks Ibrani.
