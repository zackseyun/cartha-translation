  text: אָשֵׁ֗ר לֹ֤א הוֹרִישׁ֙ אֶת יֹשְׁבֵ֣י עַכּ֔וֹ וְ/אֶת יוֹשְׁבֵ֖י צִיד֑וֹן וְ/אֶת אַחְלָ֤ב וְ/אֶת אַכְזִיב֙ וְ/אֶת חֶלְבָּ֔ה וְ/אֶת אֲפִ֖יק וְ/אֶת רְחֹֽב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/031.yaml
  text: Asher did not drive out the inhabitants of Acco[a], or the inhabitants of Sidon, or Ahlab, or Achzib, or Helbah, or Aphek[b], or Rehob.
translation:
  language: id
  text: Suku Asyer tidak menghalau penduduk Akko[a], penduduk Sidon, ataupun penduduk Ahlab, Akhzib, Helba, Afik, dan Rehob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak menyingkirkan mereka dari tanah mereka” atau “tidak mengusir.” Kata kerja Ibrani ini menunjuk pada tindakan membuat penduduk sebelumnya kehilangan penguasaan atas negeri itu. Akko adalah kota pesisir kuno yang dalam bentuk bahasa lain kemudian dikenal sebagai Acre.
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: tidak menghalau
  rationale: Bentuk Hifil dari ירש dalam konteks perebutan negeri berarti membuat penduduk sebelumnya kehilangan penguasaan atas wilayahnya; 'menghalau' alami dalam bahasa Indonesia dan sesuai dengan pola berulang dalam Hakim-Hakim 1.
- source_word: יֹשְׁבֵי
  choice: penduduk
  rationale: Partisip dari ישב menunjuk kepada orang-orang yang mendiami suatu tempat; 'penduduk' ringkas, alami, dan mempertahankan makna kolektif.
- source_word: עַכּוֹ
  choice: Ako
  rationale: Nama tempat ditransliterasikan dari bahasa Ibrani dengan ejaan yang mudah dibaca dalam bahasa Indonesia.
- source_word: צִידוֹן
  choice: Sidon
  rationale: Transliterasi baku dan mudah dikenali dalam bahasa Indonesia.
- source_word: אַחְלָב
  choice: Ahlab
  rationale: Nama tempat ditransliterasikan langsung; huruf ח dipertahankan sebagai 'h' dalam gugus 'hl'.
- source_word: אַכְזִיב
  choice: Akhzib
  rationale: Transliterasi mempertahankan bunyi konsonantal nama Ibrani dan membedakannya dari ejaan berbasis bahasa Inggris.
- source_word: חֶלְבָּה
  choice: Helba
  rationale: Bentuk ini mengikuti bentuk konsonantal dan vokalisasi teks Ibrani pada ayat ini tanpa akhiran 'h' yang tidak lazim dalam ejaan Indonesia.
- source_word: אֲפִיק
  choice: Afik
  rationale: Nama tempat ditransliterasikan sesuai kaidah baca Indonesia, dengan פ tanpa dages sebagai 'f'.
- source_word: רְחֹב
  choice: Rehob
  rationale: Nama tempat ditransliterasikan langsung; 'h' mewakili ח secara sederhana dalam ejaan Indonesia.
- source_word: וְ/אֶת ... וְ/אֶת
  choice: ataupun ... dan
  rationale: Sesudah verba negatif, 'ataupun' menyatakan bahwa tidak satu pun kelompok dalam daftar itu dihalau. Unsur-unsur berikutnya dirangkai dengan 'dan' agar daftar panjang tetap alami dalam bahasa Indonesia tanpa mengubah cakupan negasinya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Subjek diperjelas menjadi 'Suku Asyer' karena nama Asyer di sini menunjuk pada kelompok suku. Kata 'penduduk' diulang pada Sidon lalu dipahami berlaku bagi semua nama kota berikutnya; ini alami dalam bahasa Indonesia dan tetap mencerminkan struktur Ibrani. Penanda catatan kaki [a] dicantumkan langsung sesudah Ako.
