  naturalness: Susunan kalimatnya lugas dan alami. Pengulangan «penduduk» secara terbatas dapat dipertahankan untuk memperjelas bahwa semua nama tempat dalam daftar merujuk kepada penduduknya.
  terminology: «Suku Asyer», «menghalau», dan nama-nama lain pada dasarnya sesuai. «Akko» lebih tepat daripada «Ako» untuk עַכּוֹ dan selaras dengan pemakaian nama itu dalam bahasa Indonesia.
