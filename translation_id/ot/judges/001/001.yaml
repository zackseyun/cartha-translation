  text: וַ/יְהִ֗י אַחֲרֵי֙ מ֣וֹת יְהוֹשֻׁ֔עַ וַֽ/יִּשְׁאֲלוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל בַּ/יהוָ֖ה לֵ/אמֹ֑ר מִ֣י יַעֲלֶה לָּ֧/נוּ אֶל הַֽ/כְּנַעֲנִ֛י בַּ/תְּחִלָּ֖ה לְ/הִלָּ֥חֶם בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/001.yaml
  text: And it happened after the death of Joshua that the sons of Israel asked Yahweh[a], saying[b], “Who will go up for us first against the Canaanites to fight against them?”
translation:
  language: id
  text: Setelah Yosua meninggal, orang Israel bertanya kepada Yahweh, “Siapakah yang akan maju lebih dahulu bagi kami melawan orang Kanaan untuk memerangi mereka?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, teks Ibrani memakai bentuk tunggal, “orang Kanaan,” sebagai sebutan kolektif; kata ganti sesudahnya juga berbentuk tunggal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי מוֹת יְהוֹשֻׁעַ
  choice: Setelah Yosua meninggal
  rationale: Ungkapan pembuka naratif וַיְהִי tidak perlu diterjemahkan secara mekanis; konstruksi temporal nominal dialihkan menjadi klausa yang alami dalam bahasa Indonesia.
- source_word: וַיִּשְׁאֲלוּ ... בַּיהוָה
  choice: orang Israel bertanya kepada Yahweh
  rationale: שׁאל dengan בְּ di sini berarti meminta petunjuk atau jawaban dari Yahweh. 'Bertanya kepada' jelas dan wajar, tanpa menambahkan cara khusus yang tidak disebutkan teks.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara idiomatis frasa ini menunjuk komunitas Israel, bukan hanya anak laki-laki biologis Yakub. 'Orang Israel' alami, inklusif, dan sesuai cakupan kolektifnya.
- source_word: מִי יַעֲלֶה לָּנוּ
  choice: Siapakah di antara kami yang akan maju
  rationale: עלה dalam konteks militer berarti bergerak maju untuk berperang. לָנוּ di sini berkaitan dengan pemilihan pihak dari kalangan Israel; 'di antara kami' menyampaikan maksud itu secara alami.
- source_word: אֶל הַכְּנַעֲנִי
  choice: melawan orang Kanaan
  rationale: Bentuk tunggal dengan kata sandang berfungsi kolektif, menunjuk bangsa atau penduduk Kanaan. Preposisi diterjemahkan 'melawan' berdasarkan konteks permusuhan.
- source_word: בַּתְּחִלָּה
  choice: lebih dahulu
  rationale: Menunjukkan urutan pertama dalam tindakan militer, bukan sekadar permulaan waktu.
- source_word: לְהִלָּחֶם בּוֹ
  choice: untuk memerangi mereka
  rationale: לחם berarti berperang atau bertempur. Pronomina Ibrani berbentuk tunggal karena merujuk kepada sebutan kolektif 'orang Kanaan'; bahasa Indonesia secara wajar memakai 'mereka' untuk kelompok tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama perjanjian יהוה. 'Yahweh' mempertahankannya sebagai nama diri dan mengikuti bentuk yang paling luas diterima dalam kajian Ibrani, tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Susunan pertanyaan dibuat alami tanpa menghilangkan nuansa pemilihan urutan maju berperang.
