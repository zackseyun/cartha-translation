  source_fidelity: Revisi diperlukan karena “di antara kami” mempersempit לָנוּ (“bagi kami/untuk kami”) menjadi pemilihan seseorang dari dalam kelompok Israel. Teks Ibrani menyatakan siapa yang akan maju bagi Israel, tanpa secara eksplisit membatasi calon itu dengan frasa tersebut. Selebihnya, urutan “sesudah Yosua meninggal,” tindakan bertanya kepada Yahweh, urutan “lebih dahulu,” dan pemakaian kolektif “orang Kanaan/mereka” sesuai dengan teks sumber.
  naturalness: Teks revisi tetap memakai Bahasa Indonesia baku modern dan lugas. “Maju lebih dahulu bagi kami” mempertahankan fungsi לָנוּ tanpa menambahkan batasan “di antara kami.”
  terminology: “Yosua,” “orang Israel,” “Yahweh,” dan “orang Kanaan” tepat dan konsisten. “Orang Kanaan” menyampaikan nomina tunggal Ibrani yang berfungsi secara kolektif; “mereka” adalah penyesuaian Indonesia yang alami untuk rujukan kolektif itu.
