  source_fidelity: 'Makna pokok tersampaikan dengan akurat: jumlah tujuh puluh raja, pemotongan ibu jari tangan dan kaki, tindakan berulang memunguti sisa di bawah meja, pembalasan ilahi, serta pembawaan ke Yerusalem dan kematian di sana. Namun, hubungan kepunyaan pada anggota tubuh perlu dibuat eksplisit agar sesuai dengan sufiks jamak Ibrani.'
  naturalness: Frasa “raja yang ibu jari tangan dan ibu jari kakinya dipotong biasa memunguti” kurang lancar secara sintaksis dalam bahasa Indonesia baku. Klausa relatif perlu dipisahkan dengan koma dan memakai “mereka” untuk kepunyaan para raja. Penambahan “telah” pada pembalasan juga membuat bentuk perfek Ibrani lebih jelas dalam alur naratif Indonesia.
  terminology: “Adoni-Bezek”, “Allah”, “Yerusalem”, “ibu jari tangan”, dan “ibu jari kaki” sesuai register Alkitab bahasa Indonesia modern dan mempertahankan pembedaan anatomis Ibrani. Catatan pada Allah tepat dan berjangkar pada unsur yang dijelaskan.
