  text: וַ/יֹּ֣אמֶר אֲדֹֽנִי בֶ֗זֶק שִׁבְעִ֣ים מְלָכִ֡ים בְּֽהֹנוֹת֩ יְדֵי/הֶ֨ם וְ/רַגְלֵי/הֶ֜ם מְקֻצָּצִ֗ים הָי֤וּ מְלַקְּטִים֙ תַּ֣חַת שֻׁלְחָנִ֔/י כַּ/אֲשֶׁ֣ר עָשִׂ֔יתִי כֵּ֥ן שִׁלַּם לִ֖/י אֱלֹהִ֑ים וַ/יְבִיאֻ֥/הוּ יְרוּשָׁלִַ֖ם וַ/יָּ֥מָת שָֽׁם־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/007.yaml
  text: And Adoni-bezek said[a], “Seventy kings, with the thumbs of their hands and their feet cut off, used to gather scraps under my table. As I have done, so God has repaid me.” And they brought him to Jerusalem[b], and he died there.
translation:
  language: id
  text: Adoni-Bezek berkata, “Tujuh puluh raja, yang ibu jari tangan dan ibu jari kaki mereka telah dipotong, biasa memunguti sisa makanan di bawah mejaku. Seperti yang telah kulakukan, demikianlah Allah[a] telah membalas aku.” Lalu mereka membawanya ke Yerusalem, dan ia mati di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani אֱלֹהִים berbentuk jamak secara morfologis, tetapi di sini disertai kata kerja tunggal; karena itu diterjemahkan “Allah”, bukan “dewa-dewa”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדֹנִי בֶזֶק
  choice: Adoni-Bezek
  rationale: Dalam konteks ini ungkapan tersebut berfungsi sebagai nama atau gelar diri tokoh, sehingga ditransliterasikan. Makna dasarnya dapat dipahami sebagai ‘tuan Bezek’, tetapi terjemahan itu tidak dipaksakan ke dalam teks utama.
- source_word: בְּהֹנוֹת יְדֵיהֶם וְרַגְלֵיהֶם
  choice: ibu jari tangan dan ibu jari kakinya
  rationale: בֹּהֶן menunjuk pada ibu jari tangan atau ibu jari kaki sesuai anggota tubuh yang disebut. Rumusan ini alami dalam bahasa Indonesia sekaligus mempertahankan kedua anggota tubuh yang dinyatakan dalam bahasa Ibrani.
- source_word: מְקֻצָּצִים
  choice: dipotong
  rationale: Bentuk partisip pasif dari קצץ menyatakan pemotongan atau penanggalan anggota tubuh. ‘Dipotong’ jelas dan tidak menambahkan rincian yang tidak dinyatakan.
- source_word: הָיוּ מְלַקְּטִים
  choice: biasa memunguti sisa makanan
  rationale: Konstruksi perifrastis ini menyatakan tindakan yang lazim atau berulang pada masa lampau. לקט berarti mengumpulkan atau memungut; konteks di bawah meja mendukung ‘sisa makanan’ sebagai padanan alami.
- source_word: כַּאֲשֶׁר עָשִׂיתִי כֵּן
  choice: Seperti yang telah kulakukan, demikianlah
  rationale: Mempertahankan pola perbandingan yang menekankan kesepadanan antara perbuatan Adoni-Bezek dan balasan yang diterimanya.
- source_word: שִׁלַּם לִי אֱלֹהִים
  choice: Allah membalas aku
  rationale: Bentuk piel שִׁלַּם menyatakan pembalasan atau pembayaran kembali. אֱלֹהִים diterjemahkan tunggal karena verba Ibraninya berbentuk tunggal.
- source_word: וַיְבִיאֻהוּ יְרוּשָׁלִַם
  choice: Lalu mereka membawanya ke Yerusalem
  rationale: Merender urutan naratif wayyiqtol secara alami, dengan subjek jamak dan objek tunggal tetap jelas.
- source_word: וַיָּמָת שָׁם
  choice: dan ia mati di sana
  rationale: Padanan langsung yang mempertahankan penunjuk tempat שָׁם.
theological_decisions:
- issue: Rujukan אֱלֹהִים dalam pengakuan Adoni-Bezek
  choice: Allah
  alternative: dewa-dewa
  rationale: Walaupun bentuk אֱלֹהִים secara morfologis jamak, verba שִׁלַּם berbentuk tunggal, sehingga makna tunggal paling kuat. Terjemahan tidak memperluas ucapan ini menjadi pengakuan iman yang lebih lengkap daripada yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Biasa memunguti’ mengungkapkan tindakan berulang secara alami, sedangkan ‘ibu jari tangan dan ibu jari kaki’ menjaga ketepatan anatomi teks Ibrani. Pronomina ‘ia’ dipakai dalam narasi agar alurnya ringkas dan formal.
