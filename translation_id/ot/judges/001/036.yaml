  yaml_path: translation/ot/judges/001/036.yaml
  text: And the border of the Amorites was from the Ascent of Akrabbim[b][a], from Sela and upward.
translation:
  language: id
  text: Batas wilayah orang Amori mulai dari Pendakian Akrabim[a], dari Sela[b] terus ke atas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Akrabim berarti “kalajengking”; nama ini juga dapat diterjemahkan “Pendakian Kalajengking”.
    reason: lexical_alternative
  - marker: b
    text: Atau “dari batu karang”, jika kata Ibrani ini dipahami sebagai kata benda umum, bukan nama tempat Sela.
    reason: alternative_reading
lexical_decisions:
- source_word: גְבוּל
  choice: batas wilayah
  rationale: Dalam pemberitahuan geografis ini, גְּבוּל menunjuk pada garis batas. Frasa 'batas wilayah' alami dalam bahasa Indonesia dan tidak menyiratkan seluruh daerah.
- source_word: הָאֱמֹרִי
  choice: orang Amori
  rationale: Bentuk tunggal Ibrani berfungsi secara kolektif sebagai nama kelompok etnis; 'orang Amori' merupakan ungkapan kolektif yang wajar dalam bahasa Indonesia.
- source_word: מִמַּעֲלֵה עַקְרַבִּים
  choice: mulai dari Pendakian Akrabim
  rationale: מַעֲלֵה berarti jalur pendakian atau tanjakan, sedangkan עַקְרַבִּים dipertahankan sebagai unsur nama tempat. 'Mulai dari' menyampaikan fungsi preposisi מִן dalam penentuan titik awal batas.
- source_word: מֵהַסֶּלַע
  choice: dari Sela
  rationale: Dalam konteks geografis, bentuk ini dapat dipahami sebagai nama tempat Sela, tetapi secara leksikal juga berarti 'dari batu karang'; kemungkinan kedua dipertahankan dalam catatan kaki.
- source_word: וָמָעְלָה
  choice: ke arah atas
  rationale: Ungkapan ini menandakan kelanjutan ke arah yang lebih tinggi atau lebih jauh dari titik tersebut. Terjemahan ini mempertahankan makna spasial tanpa menentukan arah mata angin yang tidak dinyatakan.
- source_word: וּ
  choice: —
  rationale: Konjungsi menghubungkan ayat ini dengan konteks sebelumnya. Dalam bahasa Indonesia, hubungan tersebut tetap jelas tanpa harus mengawali kalimat dengan 'Dan'.
