base_translation:
  language: en
  yaml_path: translation/ot/judges/001/034.yaml
  text: And the Amorites pressed the sons of Dan back into the hill country[a], because they did not allow them to go down into the valley.
translation:
  language: id
  text: Orang Amori memaksa keturunan Dan ke daerah perbukitan[a], karena mereka tidak membiarkan keturunan Dan turun ke lembah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “Orang Amori memaksa anak-anak Dan ke arah daerah perbukitan, sebab ia tidak membiarkan dia turun ke lembah.” Dalam bahasa Ibrani, “orang Amori” dan pronomina dalam klausa kedua berbentuk tunggal kolektif, sedangkan maknanya dalam konteks merujuk kepada kelompok-kelompok tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְחֲצוּ
  choice: mendesak ... kembali
  rationale: Kata kerja לחץ menyatakan tindakan menekan, menindas, atau memaksa ke posisi yang terbatas. Dalam konteks arah menuju daerah perbukitan, frasa ini secara wajar menyampaikan bahwa orang Dan dipaksa mundur.
- source_word: הָאֱמֹרִי
  choice: Orang Amori
  rationale: Bentuk Ibraninya tunggal kolektif dan menunjuk kepada kelompok bangsa. Dalam bahasa Indonesia, 'orang Amori' dapat berfungsi sebagai sebutan kolektif yang alami.
- source_word: בְּנֵי דָן
  choice: keturunan Dan
  rationale: Ungkapan ini mempertahankan hubungan kesukuan dalam 'anak-anak Dan' sekaligus lebih alami dalam bahasa Indonesia modern daripada terjemahan harfiah tersebut.
- source_word: הָהָרָה
  choice: ke daerah perbukitan
  rationale: Akhiran penunjuk arah menyatakan gerak menuju kawasan pegunungan atau perbukitan. 'Daerah perbukitan' merupakan padanan geografis yang alami dan berlawanan jelas dengan lembah.
- source_word: כִּי
  choice: karena
  rationale: Kata ini memperkenalkan alasan bagi tindakan pada klausa sebelumnya.
- source_word: לֹא נְתָנוֹ
  choice: mereka tidak membiarkan keturunan Dan
  rationale: Teks memakai bentuk tunggal kolektif beserta sufiks tunggal, tetapi acuannya adalah kedua kelompok bangsa. Pengulangan 'keturunan Dan' menghindari ketidakjelasan pronomina bahasa Indonesia.
- source_word: לָרֶדֶת
  choice: turun
  rationale: Padanan ini alami untuk ירד dan mempertahankan gerak topografis dari perbukitan menuju lembah.
- source_word: לָעֵמֶק
  choice: ke lembah
  rationale: עֵמֶק menunjuk lembah atau dataran rendah; 'lembah' paling langsung dan sesuai dengan pertentangannya terhadap daerah perbukitan.
