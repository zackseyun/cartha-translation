  text: וְ/אֶת הַ/יְבוּסִי֙ יֹשֵׁ֣ב יְרֽוּשָׁלִַ֔ם לֹ֥א הוֹרִ֖ישׁוּ בְּנֵ֣י בִנְיָמִ֑ן וַ/יֵּ֨שֶׁב הַ/יְבוּסִ֜י אֶת בְּנֵ֤י בִנְיָמִן֙ בִּ/יר֣וּשָׁלִַ֔ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/021.yaml
  text: But the sons of Benjamin did not drive out the Jebusites who were living in Jerusalem[a], so the Jebusites have lived with the sons of Benjamin in Jerusalem to this day.
translation:
  language: id
  text: Namun, keturunan Benyamin tidak mengusir orang-orang Yebus yang tinggal di Yerusalem.[a] Karena itu, orang-orang Yebus tetap tinggal bersama keturunan Benyamin di Yerusalem sampai hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang Yebus … tinggal bersama keturunan Benyamin”; bentuk tunggal dalam bahasa Ibrani ini berfungsi secara kolektif untuk kelompok etnis tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיְבוּסִי
  choice: orang Yebus
  rationale: Bentuk Ibraninya tunggal kolektif dan menunjuk kepada kelompok etnis; dalam bahasa Indonesia, “orang Yebus” secara alami dapat berfungsi sebagai sebutan kolektif.
- source_word: יֹשֵׁב יְרוּשָׁלַם
  choice: yang tinggal di Yerusalem
  rationale: Partisipel יֹשֵׁב menyatakan keadaan menetap yang sedang berlangsung; “yang tinggal” jelas dan alami dalam bahasa Indonesia modern.
- source_word: הוֹרִישׁוּ
  choice: tidak mengusir
  rationale: Dalam konteks penaklukan dan pendudukan negeri, bentuk ini berarti membuat penduduk pergi atau kehilangan tempatnya; “mengusir” menyampaikan makna tersebut secara lugas.
- source_word: בְּנֵי בִנְיָמִן
  choice: keturunan Benyamin
  rationale: Ungkapan ini mempertahankan corak genealogis-sukuis dari konstruksi harfiah “anak-anak Benyamin”, tetapi lebih alami dan tidak menimbulkan kesan bahwa yang dimaksud hanya anak kandung langsung.
- source_word: וַיֵּשֶׁב
  choice: tetap tinggal
  rationale: Dengan frasa “sampai hari ini”, verba ini menggambarkan keadaan tinggal yang berlanjut sampai masa penutur; “tetap tinggal” menyatakan keberlanjutan itu dengan wajar.
- source_word: אֶת בְּנֵי בִנְיָמִן
  choice: bersama keturunan Benyamin
  rationale: Di sini אֶת menyatakan kebersamaan, bukan penanda objek langsung; “bersama” secara jelas menggambarkan kehidupan berdampingan.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Ini merupakan padanan idiomatis yang lazim bagi rumus waktu Ibrani yang menunjuk sampai masa narator.
- source_word: וְ
  choice: Namun
  rationale: Konjungsi ini berfungsi kontras terhadap catatan keberhasilan penaklukan dalam konteks; “Namun” menyatakan hubungan adversatif tersebut secara alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Keturunan Benyamin” dipilih daripada “anak-anak Benyamin” agar makna kesukuan mudah dipahami, sedangkan “orang Yebus” mempertahankan fungsi kolektif bentuk tunggal Ibrani. Kalimat kedua memakai “Karena itu” untuk memperjelas hubungan akibat yang tersirat tanpa mengubah isi.
