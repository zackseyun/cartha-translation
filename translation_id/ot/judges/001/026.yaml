base_translation:
  language: en
  yaml_path: translation/ot/judges/001/026.yaml
  text: And the man went to the land of the Hittites and built a city and called its name Luz[a]; that is its name to this day.
translation:
  language: id
  text: Lalu orang itu pergi ke negeri orang Het. Ia membangun sebuah kota dan menamainya Lus[a]. Itulah nama kota itu sampai sekarang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “menyebut namanya Lus.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: pergi
  rationale: Bentuk naratif Qal dari הלך secara wajar berarti “pergi”; pilihan ini alami dalam narasi Indonesia.
- source_word: הָאִישׁ
  choice: orang itu
  rationale: Nomina definit tunggal ini menunjuk kembali kepada laki-laki yang telah disebut sebelumnya; “orang itu” mempertahankan kesinambungan acuan tanpa terasa kaku.
- source_word: אֶרֶץ הַחִתִּים
  choice: negeri orang Het
  rationale: Frasa konstruksi ini secara harfiah menunjuk pada negeri milik atau wilayah orang Het, tanpa menetapkan bentuk politik wilayah tersebut.
- source_word: וַיִּבֶן עִיר
  choice: membangun sebuah kota
  rationale: בנה dengan עִיר secara langsung berarti membangun sebuah kota; “mendirikan” dapat menyiratkan penafsiran tambahan tentang pendiriannya.
- source_word: וַיִּקְרָא שְׁמָהּ לוּז
  choice: menamainya Lus
  rationale: Ungkapan Ibrani harfiah “menyebut namanya Lus” paling alami disampaikan dalam bahasa Indonesia sebagai “menamainya Lus,” dengan objek merujuk kepada kota.
- source_word: לוּז
  choice: Lus
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dan alami dalam bahasa Indonesia.
- source_word: הוּא שְׁמָהּ
  choice: Itulah nama kota itu
  rationale: Klausa nominal dengan הוּא memiliki fungsi demonstratif atau penegasan. Penyebutan “kota itu” memperjelas rujukan pronominal feminin Ibrani secara alami.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Ini adalah padanan idiomatis standar bagi ungkapan waktu Ibrani tersebut dalam narasi Indonesia.
