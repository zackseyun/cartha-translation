id: JDG.1.35
reference: Judges 1:35
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יּ֤וֹאֶל הָֽ/אֱמֹרִי֙ לָ/שֶׁ֣בֶת בְּ/הַר חֶ֔רֶס בְּ/אַיָּל֖וֹן וּ/בְ/שַֽׁעַלְבִ֑ים וַ/תִּכְבַּד֙ יַ֣ד בֵּית יוֹסֵ֔ף וַ/יִּהְי֖וּ לָ/מַֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/035.yaml
  text: But the Amorites persisted in dwelling in Mount Heres[a], in Aijalon, and in Shaalbim; then the hand of the house of Joseph grew heavy[b], and they became subject to forced labor.
translation:
  language: id
  text: Namun, orang Amori berkeras untuk tetap tinggal di Gunung Heres, di Ayalon, dan di Saalbim. Kemudian kekuasaan kaum keturunan Yusuf semakin kuat[a], sehingga orang Amori diwajibkan melakukan kerja paksa[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tangan kaum keturunan Yusuf menjadi berat.” Ungkapan Ibrani ini dapat berarti bahwa kekuasaan mereka semakin kuat atau semakin menekan.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang Amori dijadikan pekerja wajib.” Istilah Ibrani ini menunjuk kewajiban memberikan tenaga kerja kepada pihak yang berkuasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: berkeras
  rationale: Dalam konstruksi dengan infinitif 'tinggal', verba ini menyatakan kemauan atau tekad yang kuat; konteksnya menunjukkan bahwa orang Amori bersikeras mempertahankan tempat tinggal mereka.
- source_word: הָאֱמֹרִי
  choice: orang Amori
  rationale: Bentuk Ibrani tunggal dipakai secara kolektif bagi kelompok etnis, sebagaimana tampak dari verba jamak pada klausa terakhir.
- source_word: לָשֶׁבֶת
  choice: untuk tetap tinggal
  rationale: Menunjukkan kelanjutan menetap di wilayah tersebut, bukan sekadar mulai tinggal.
- source_word: בְּהַר חֶרֶס
  choice: di Gunung Heres
  rationale: Mempertahankan nama tempat dan menerjemahkan הַר secara langsung; teks tidak memastikan apakah yang dimaksud satu gunung atau kawasan perbukitan.
- source_word: בְּאַיָּלוֹן
  choice: di Ayalon
  rationale: Transliterasi nama tempat yang wajar dalam bahasa Indonesia.
- source_word: וּבְשַׁעַלְבִים
  choice: dan di Saalbim
  rationale: Transliterasi nama tempat yang wajar dalam bahasa Indonesia, dengan konjungsi dipertahankan.
- source_word: וַתִּכְבַּד יַד
  choice: kekuasaan ... semakin kuat
  rationale: Secara harfiah berarti 'tangan ... menjadi berat'; idiom ini menyatakan kekuatan atau tekanan kekuasaan yang meningkat. Terjemahan utama dibuat alami, sementara citra harfiahnya dicatat.
- source_word: בֵּית יוֹסֵף
  choice: kaum keturunan Yusuf
  rationale: Ungkapan kekerabatan-politik 'kaum/rumah Yusuf' menunjuk kelompok suku yang berasal dari Yusuf; pilihan ini jelas bagi pembaca Indonesia modern.
- source_word: וַיִּהְיוּ לָמַס
  choice: orang Amori diwajibkan melakukan kerja paksa
  rationale: מַס menunjuk kerja wajib atau bakti kerja yang dikenakan oleh pihak penguasa. Subjek kolektif dijelaskan kembali agar rujukannya tidak kabur.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur sebab-akibat dibuat eksplisit dengan 'sehingga' agar hubungan antarklausa alami, tanpa menghilangkan bahwa teks Ibrani hanya menghubungkannya secara berurutan. Nama tempat ditransliterasikan sebagai Heres, Ayalon, dan Saalbim.
