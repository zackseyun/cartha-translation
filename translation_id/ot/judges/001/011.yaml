  text: From there he went against the inhabitants of Debir[b][a]. (The former name of Debir was Kiriath-sepher.)
translation:
  language: id
  text: Dari sana ia maju melawan penduduk Debir.[a] Dahulu nama Debir adalah Kiryat-Sefer.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “maju menuju penduduk Debir.” Kata depan Ibrani secara harfiah berarti “ke” atau “menuju”, tetapi dalam konteks penaklukan ini dapat menyatakan gerak maju yang bermusuhan.'
    reason: lexical_alternative
  - marker: b
    text: Kiryat-Sefer adalah nama Debir sebelumnya. Nama itu mungkin berarti “Kota Kitab” atau “Kota Para Juru Tulis”; nama tempat ini ditransliterasikan dalam teks utama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: ia pergi
  rationale: Bentuk naratif dari הלך pada dasarnya menyatakan tindakan pergi; konteks penaklukan memberi arah bermusuhan tanpa mengharuskan padanan yang lebih khusus seperti 'berbaris'.
- source_word: מִשָּׁם
  choice: dari sana
  rationale: Frasa keterangan tempat yang secara langsung menunjukkan titik asal gerakan dari lokasi yang disebut sebelumnya.
- source_word: אֶל
  choice: menyerang
  rationale: Secara harfiah berarti 'ke/menuju', tetapi dalam konteks kisah penaklukan frasa 'pergi menyerang' menyampaikan gerakan bermusuhan secara alami dalam bahasa Indonesia. Alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: יוֹשְׁבֵי
  choice: penduduk
  rationale: Partisipel substantival dari ישב menunjuk kepada orang-orang yang mendiami suatu tempat; 'penduduk' ringkas, alami, dan tepat.
- source_word: דְּבִיר
  choice: Debir
  rationale: Nama tempat ditransliterasikan dalam bentuk yang lazim dan tidak diterjemahkan.
- source_word: וְשֵׁם דְּבִיר לְפָנִים
  choice: Dahulu nama Debir adalah
  rationale: Susunan ini alami dalam bahasa Indonesia modern dan mempertahankan informasi temporal bahwa tempat itu sebelumnya memiliki nama lain.
- source_word: קִרְיַת סֵפֶר
  choice: Kiryat-Sefer
  rationale: Nama tempat ditransliterasikan; kemungkinan makna etimologisnya tidak dimasukkan ke dalam teks utama karena tidak pasti.
