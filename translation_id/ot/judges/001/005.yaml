base_translation:
  language: en
  yaml_path: translation/ot/judges/001/005.yaml
  text: They found Adoni-bezek in Bezek[a], and they fought against him and struck down the Canaanites and the Perizzites.
translation:
  language: id
  text: Mereka menemukan Adoni-Bezek di Bezek[a], lalu berperang melawan dia dan mengalahkan orang Kanaan serta orang Feris.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Adoni-Bezek secara etimologis dapat dipahami sebagai “penguasa Bezek”, tetapi di sini diterjemahkan sebagai nama diri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמְצְאוּ
  choice: mereka menemukan
  rationale: Verba מצא dalam narasi lazim berarti menemukan atau menjumpai; 'menemukan' langsung, alami, dan mempertahankan urutan naratif.
- source_word: אֲדֹנִי בֶזֶק
  choice: Adoni-Bezek
  rationale: Dalam konteks ini ungkapan tersebut paling baik diperlakukan sebagai nama diri, sambil mempertahankan bentuknya yang secara etimologis dapat dipahami sebagai gelar.
- source_word: בְּבֶזֶק
  choice: di Bezek
  rationale: Preposisi ב menandai lokasi; 'di Bezek' merupakan padanan Indonesia yang paling langsung dan alami.
- source_word: וַיִּלָּחֲמוּ בּוֹ
  choice: berperang melawan dia
  rationale: Bentuk Niphal dari לחם dengan ב menyatakan tindakan berperang melawan seorang lawan; pilihan ini memperjelas relasi adversatif tanpa menambah rincian.
- source_word: וַיַּכּוּ
  choice: mengalahkan
  rationale: Dalam konteks pertempuran, נכה dapat berarti memukul, menewaskan, atau mengalahkan. 'Mengalahkan' menyampaikan hasil militer tanpa menyatakan bahwa setiap orang dibunuh.
- source_word: הַכְּנַעֲנִי
  choice: orang Kanaan
  rationale: Walaupun bentuk Ibraninya tunggal, etnonim ini berfungsi secara kolektif. Dalam bahasa Indonesia, 'orang Kanaan' secara alami dapat menunjuk kelompok kolektif.
- source_word: הַפְּרִזִּי
  choice: orang Feris
  rationale: Etnonim tunggal ini juga dipakai secara kolektif. 'Orang Feris' mengikuti bentuk nama yang lazim dalam bahasa Indonesia dan menyampaikan kelompok bangsa.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Konjungsi 'lalu' menjaga alur tindakan berurutan. Nama diri dan nama bangsa memakai bentuk yang mudah dikenali oleh pembaca Alkitab berbahasa Indonesia.
