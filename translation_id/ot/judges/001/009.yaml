translation_notes:
  register: Bahasa Indonesia baku yang modern, lugas, dan bermartabat. Istilah geografis dibuat mudah dipahami; nama Negeb dipertahankan, sedangkan Syefela dijelaskan dalam catatan kaki. Penanda [a] ditempatkan langsung setelah frasa yang diterangkannya.
