base_translation:
  language: en
  yaml_path: translation/ot/judges/001/009.yaml
  text: Afterward[a], the sons of Judah went down to fight against the Canaanites living in the hill country, the Negev, and the lowland.
translation:
  language: id
  text: Sesudah itu, keturunan Yehuda turun untuk berperang melawan orang Kanaan yang tinggal di pegunungan, Negeb, dan dataran rendah[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Syefela”, yaitu kawasan kaki bukit Yehuda di antara pegunungan dan dataran pantai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר
  choice: Sesudah itu
  rationale: Menandai tindakan berikutnya dalam urutan narasi tanpa menentukan panjang selang waktunya.
- source_word: יָרְדוּ
  choice: turun
  rationale: Mempertahankan arah topografis konkret dari ירד; konteksnya menggambarkan pergerakan dari kawasan yang lebih tinggi.
- source_word: בְּנֵי יְהוּדָה
  choice: keturunan Yehuda
  rationale: Ungkapan harfiah 'anak-anak lelaki Yehuda' di sini menunjuk secara kolektif kepada anggota suku Yehuda; 'keturunan Yehuda' alami dalam bahasa Indonesia dan tetap mempertahankan hubungan genealogis-sukunya.
- source_word: לְהִלָּחֵם
  choice: untuk berperang
  rationale: Mengungkapkan tujuan tindakan dan arti Niphal לחם, yaitu bertempur atau berperang.
- source_word: בַּכְּנַעֲנִי
  choice: melawan orang Kanaan
  rationale: Bentuk tunggal dengan artikel berfungsi kolektif bagi kelompok etnis; konteks peperangan menuntut makna adversatif 'melawan'.
- source_word: יוֹשֵׁב
  choice: yang tinggal
  rationale: Partisip ישב menyatakan keadaan menetap atau mendiami wilayah-wilayah tersebut.
- source_word: הָהָר
  choice: pegunungan
  rationale: Dalam daftar geografis ini, הָהָר menunjuk kawasan dataran tinggi atau pegunungan, bukan satu gunung tertentu.
- source_word: הַנֶּגֶב
  choice: Tanah Negeb
  rationale: Dalam daftar kawasan geografis, נֶגֶב merujuk wilayah Negeb; 'Tanah Negeb' membantu pembaca mengenalinya sebagai nama daerah, bukan sekadar arah selatan.
- source_word: הַשְּׁפֵלָה
  choice: daerah perbukitan
  rationale: שְׁפֵלָה adalah kawasan kaki bukit Yehuda di antara pegunungan dan dataran pantai. 'Daerah perbukitan' lebih mudah dipahami daripada transliterasi teknis, sementara catatan kaki memberi nama geografis tradisionalnya.
