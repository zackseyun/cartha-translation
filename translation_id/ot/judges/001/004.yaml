id: JDG.1.4
reference: Judges 1:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֣עַל יְהוּדָ֔ה וַ/יִּתֵּ֧ן יְהוָ֛ה אֶת הַ/כְּנַעֲנִ֥י וְ/הַ/פְּרִזִּ֖י בְּ/יָדָ֑/ם וַ/יַּכּ֣וּ/ם בְּ/בֶ֔זֶק עֲשֶׂ֥רֶת אֲלָפִ֖ים אִֽישׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/004.yaml
  text: Then Judah went up[a], and Yahweh gave the Canaanites and the Perizzites into their hand[b], and they struck down ten thousand men at Bezek.
translation:
  language: id
  text: Lalu Yehuda maju[a]. Yahweh menyerahkan orang Kanaan dan orang Feris[b] ke dalam tangan mereka[c], dan di Bezek mereka mengalahkan sepuluh ribu orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: naik.'
    reason: lexical_alternative
  - marker: b
    text: Dalam bahasa Ibrani, ‘orang Kanaan’ dan ‘orang Feris’ berbentuk tunggal, tetapi dapat dipakai secara kolektif untuk menyebut bangsa-bangsa itu.
    reason: lexical_alternative
  - marker: c
    text: ‘Ke dalam tangan mereka’ adalah ungkapan Ibrani yang berarti ‘ke dalam kuasa mereka’.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: maju
  rationale: Kata עלה secara harfiah berarti ‘naik’, tetapi dalam kisah pergerakan pasukan dapat berarti bergerak maju. ‘Maju’ terdengar alami dalam konteks peperangan tanpa menetapkan rincian geografis yang tidak dinyatakan.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Nama suku dipertahankan sebagai ‘Yehuda’. Pergeseran dari bentuk tunggal ke kata ganti jamak mencerminkan Yehuda sebagai satu kesatuan suku beserta pasukannya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan sebuah gelar.
- source_word: הַכְּנַעֲנִי וְהַפְּרִזִּי
  choice: orang Kanaan dan orang Feris
  rationale: Kedua bentuk nisbah itu secara morfologis tunggal, tetapi di sini dipakai secara kolektif untuk menyebut kelompok-kelompok bangsa. Bahasa Indonesia secara alami dapat memakai ‘orang Kanaan’ dan ‘orang Feris’ dengan arti kolektif.
- source_word: בְּיָדָם
  choice: ke dalam tangan mereka
  rationale: Ungkapan Ibrani נתן ביד secara harfiah berarti menyerahkan ‘ke dalam tangan’ seseorang, yakni ke dalam kuasa atau kendalinya. Citra asli dipertahankan karena masih mudah dipahami dalam konteks.
- source_word: וַיַּכּוּם
  choice: mereka mengalahkan
  rationale: Kata נכה dapat berarti memukul, menewaskan, atau mengalahkan. ‘Mengalahkan’ mempertahankan cakupan makna militernya tanpa memastikan bahwa setiap orang dalam jumlah tersebut tewas.
- source_word: בְּבֶזֶק
  choice: di Bezek
  rationale: Preposisi ב dengan nama tempat secara alami diterjemahkan ‘di’ dalam bahasa Indonesia.
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ
  choice: sepuluh ribu orang
  rationale: Ini menerjemahkan jumlah secara langsung. Konteks peperangan menunjukkan bahwa yang dimaksud ialah para lelaki dalam pasukan, tetapi ‘prajurit’ akan menambahkan keterangan yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Transliterasi ‘Yahweh’ mempertahankan nama pribadi ilahi dalam teks sumber dan tidak menggantinya dengan gelar.
- issue: Hubungan antara tindakan ilahi dan tindakan manusia
  choice: Yahweh menyerahkan musuh; pasukan Yehuda mengalahkan mereka
  alternative: Menyeragamkan seluruh ayat dengan Yehuda sebagai pelaku tunggal atau menjadikan kemenangan sebagai bentuk pasif
  rationale: Teks Ibrani membedakan tindakan Yahweh yang memberikan musuh ke dalam kuasa mereka dari tindakan pasukan Yehuda dalam pertempuran. Pembedaan ini dipertahankan tanpa menjelaskan lebih jauh hubungan teologis keduanya.
- issue: Pergeseran dari Yehuda tunggal ke kata ganti jamak
  choice: Mempertahankan ‘Yehuda’ lalu ‘mereka’
  alternative: Mengubah semuanya menjadi bentuk tunggal atau mengulang ‘pasukan Yehuda’
  rationale: Bentuk Ibrani mula-mula memperlakukan Yehuda sebagai satu kesatuan, kemudian memakai akhiran dan verba jamak bagi orang-orangnya. Pergeseran tersebut dipertahankan agar dimensi kolektifnya tidak diratakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dibagi dua untuk menjaga kejelasan alur, sedangkan istilah ‘ke dalam tangan mereka’ mempertahankan citra Ibrani. ‘Maju’ dan ‘mengalahkan’ dipilih untuk menjaga ketegangan leksikal tanpa menambahkan kepastian geografis atau jumlah korban tewas.
