  yaml_path: translation/ot/judges/001/023.yaml
  text: And the house of Joseph spied out Bethel[a]; formerly the name of the city was Luz.
translation:
  language: id
  text: Kaum Yusuf menyuruh orang mengintai Betel[a]; dahulu nama kota itu Lus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menyelidiki Betel” atau “melakukan pengintaian terhadap Betel.” Kata kerja Ibrani ini, dalam konteks ini, menyatakan bahwa kaum Yusuf menugaskan orang untuk melakukan pengintaian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּתִירוּ
  choice: mengintai
  rationale: Dalam konteks penaklukan militer, verba ini menunjuk pada kegiatan menyelidiki atau mengamati suatu tempat sebagai pengintai. “Mengintai” alami dan ringkas dalam bahasa Indonesia.
- source_word: בֵית יוֹסֵף
  choice: keturunan Yusuf
  rationale: Ungkapan Ibrani harfiah “rumah Yusuf” merupakan sebutan kolektif bagi kelompok suku yang berasal dari Yusuf. “Keturunan Yusuf” lebih jelas bagi pembaca Indonesia modern tanpa menentukan lingkup sosialnya secara lebih sempit.
- source_word: בְּבֵית אֵל
  choice: Betel
  rationale: Preposisi ב bersama verba ini menandai tempat atau sasaran pengintaian; dalam bahasa Indonesia, verba “mengintai” dapat langsung diikuti objek.
- source_word: וְשֵׁם הָעִיר
  choice: nama kota itu
  rationale: Bentuk ini mempertahankan isi struktur Ibrani sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: לְפָנִים
  choice: dahulu
  rationale: Adverbia ini menunjukkan keadaan pada masa sebelumnya; “dahulu” jelas dan wajar dalam keterangan historis.
- source_word: לוּז
  choice: Lus
  rationale: Nama tempat ditransliterasikan sesuai kaidah dan bentuk yang lazim dalam Alkitab bahasa Indonesia.
