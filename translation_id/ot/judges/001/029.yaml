  yaml_path: translation/ot/judges/001/029.yaml
  text: And Ephraim did not drive out the Canaanites who lived in Gezer[a], and the Canaanites lived among them in Gezer.
translation:
  language: id
  text: Efraim tidak menghalau orang Kanaan yang tinggal di Gezer, dan orang Kanaan tinggal di tengah-tengah mereka[a] di Gezer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di tengah-tengahnya”; kata ganti tunggal itu merujuk kepada Efraim sebagai satu kesatuan suku.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: menghalau
  rationale: Dalam bentuk Hifil, ירשׁ berarti menyebabkan penduduk sebelumnya kehilangan tempat atau terusir. “Menghalau” menyampaikan tindakan menyingkirkan penduduk dengan jelas dan alami dalam konteks ini.
- source_word: הַכְּנַעֲנִי
  choice: orang Kanaan
  rationale: Walaupun berbentuk tunggal, sebutan etnis ini dipakai secara kolektif. Bahasa Indonesia secara alami dapat memakai “orang Kanaan” untuk kelompok tersebut.
- source_word: הַיּוֹשֵׁב
  choice: yang tinggal
  rationale: Partisipel ישׁב menunjukkan keadaan menetap yang berlangsung; “yang tinggal” merupakan padanan modern dan wajar.
- source_word: בְּגָזֶר
  choice: di Gezer
  rationale: Preposisi ב menandai lokasi, dan “di Gezer” adalah ungkapan lokasi yang alami untuk sebuah kota.
- source_word: וַיֵּשֶׁב
  choice: pun tetap tinggal
  rationale: Kata kerja ישׁב melanjutkan narasi dengan menyatakan keberadaan orang Kanaan di sana. “Tetap” memperjelas bahwa mereka tidak tersingkir, sedangkan “pun” mempertahankan kesinambungan naratif tanpa mengubah ו menjadi hubungan sebab-akibat yang tegas.
- source_word: בְּקִרְבּוֹ
  choice: di tengah-tengah mereka
  rationale: Secara harfiah frasa ini memakai sufiks tunggal yang merujuk kepada Efraim sebagai satu kesatuan suku. Bentuk jamak “mereka” menyampaikan makna kolektif suku itu secara alami dalam bahasa Indonesia.
