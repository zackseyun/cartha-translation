source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוּדָה֩ לְ/שִׁמְע֨וֹן אָחִ֜י/ו עֲלֵ֧ה אִתִּ֣/י בְ/גוֹרָלִ֗/י וְ/נִֽלָּחֲמָה֙ בַּֽ/כְּנַעֲנִ֔י וְ/הָלַכְתִּ֧י גַם אֲנִ֛י אִתְּ/ךָ֖ בְּ/גוֹרָלֶ֑/ךָ וַ/יֵּ֥לֶךְ אִתּ֖/וֹ שִׁמְעֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/003.yaml
  text: And Judah said to Simeon his brother[a], “Come up with me into my allotted territory, and let us fight against the Canaanites; and I too will go with you into your allotted territory.” So Simeon went with him.
translation:
  language: id
  text: Lalu Yehuda berkata kepada Simeon, saudaranya, “Majulah bersama aku ke wilayah yang menjadi bagianku[a], dan marilah kita berperang melawan orang Kanaan. Aku pun akan pergi bersamamu ke wilayah yang menjadi bagianmu.” Maka Simeon pergi bersamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dalam undianku”; demikian juga “dalam undianmu” kemudian dalam ayat ini. Dalam konteks ini, “undian” menunjuk pada wilayah yang diperoleh melalui pembagian dengan undi.
    reason: Menjelaskan makna metonimis גוֹרָל sambil membedakan bentuk harfiah dari penjelasan kontekstualnya.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan rangkaian narasi; “lalu” menyampaikan urutan peristiwa secara alami tanpa menambahkan hubungan sebab-akibat.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Nama suku atau sosok suku yang dipersonifikasikan, ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: לְשִׁמְעוֹן אָחִיו
  choice: kepada Simeon, saudaranya
  rationale: Mempertahankan sebutan persaudaraan yang eksplisit, yang dalam konteks juga menggambarkan hubungan antarsuku.
- source_word: עֲלֵה אִתִּי
  choice: Majulah bersama aku
  rationale: עלה dapat berarti naik atau maju. Dalam konteks pengerahan untuk berperang, “majulah” terdengar alami serta mempertahankan nuansa gerak menuju wilayah sasaran.
- source_word: בְּגוֹרָלִי
  choice: ke wilayah yang menjadi bagianku
  rationale: גוֹרָל secara harfiah berarti “undian”, tetapi di sini secara metonimis menunjuk pada wilayah yang ditetapkan melalui undian. Ungkapan ini jelas dalam bahasa Indonesia modern.
- source_word: וְנִלָּחֲמָה
  choice: dan marilah kita berperang
  rationale: Bentuk kohortatif orang pertama jamak menyatakan ajakan atau tekad bersama; “marilah kita” mempertahankan daya ajakannya.
- source_word: בַּכְּנַעֲנִי
  choice: melawan orang Kanaan
  rationale: Bentuk tunggal dengan fungsi kolektif merujuk kepada kelompok bangsa Kanaan; “orang Kanaan” dapat dipahami secara kolektif dalam bahasa Indonesia.
- source_word: וְהָלַכְתִּי גַם אֲנִי אִתְּךָ
  choice: Aku pun akan pergi bersamamu
  rationale: “Pun” mempertahankan penekanan גַם אֲנִי dan menyampaikan janji timbal balik secara alami.
- source_word: בְּגוֹרָלֶךָ
  choice: ke wilayah yang menjadi bagianmu
  rationale: Konsisten dengan pemaknaan גוֹרָל sebelumnya sebagai wilayah hasil pembagian melalui undian.
- source_word: וַיֵּלֶךְ אִתּוֹ שִׁמְעוֹן
  choice: Maka Simeon pergi bersamanya
  rationale: “Maka” menyampaikan kelanjutan sekaligus respons Simeon terhadap ajakan Yehuda, tanpa memperluas isi.
theological_decisions:
- issue: Makna bahasa persaudaraan אָחִיו
  choice: saudaranya
  alternative: kerabatnya
  rationale: Teks secara eksplisit memakai kata “saudara”. Dalam kerangka leluhur Israel, Yehuda dan Simeon adalah saudara dan sekaligus mewakili suku-suku yang bersaudara; karena itu istilah tersebut tidak perlu digeneralisasi.
- issue: Makna גוֹרָל dalam konteks pembagian tanah
  choice: wilayah yang menjadi bagianku/bagianmu
  alternative: undianku/undianmu
  rationale: Konteksnya adalah kerja sama militer di daerah warisan masing-masing. Terjemahan utama menyampaikan referen wilayah secara jelas, sedangkan catatan kaki mempertahankan gambaran harfiahnya sebagai hasil undian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “marilah kita” mempertahankan nada ajakan, sedangkan “wilayah yang menjadi bagian” menghindari kekaburan ungkapan harfiah “undian” dalam teks utama. Pronomina “aku” dan “-mu” sesuai dengan percakapan langsung antarsaudara tanpa menjadi terlalu informal.
