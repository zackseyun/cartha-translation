base_translation:
  language: en
  yaml_path: translation/ot/judges/001/014.yaml
  text: And when she came[a], she urged him to ask her father for the field. Then she dismounted from the donkey, and Caleb said to her[c][b], “What do you want?”
translation:
  language: id
  text: Ketika ia datang, ia membujuknya[a] untuk meminta ladang itu kepada ayahnya. Lalu ia turun dari keledainya,[b] dan Kaleb berkata kepadanya, “Apa yang kauinginkan?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mendorongnya” atau “menghasutnya.” Kata Ibrani ini dapat mencakup makna dari membujuk hingga menghasut; dalam konteks ini, “membujuk” merupakan pilihan yang netral.
    reason: lexical_alternative
  - marker: b
    text: Atau, “ia menjatuhkan diri dari keledainya.” Kata Ibrani ini dapat menggambarkan turun atau menjatuhkan diri.
    reason: lexical_alternative
  - marker: c
    text: Ungkapan Ibrani ini secara harfiah berbunyi, “Apa bagimu?” Ungkapan ini dapat berarti, “Apa yang kauinginkan?” atau “Ada apa?”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹאָהּ
  choice: ketika perempuan itu datang
  rationale: Infinitif konstruk dengan ב dan sufiks orang ketiga feminin tunggal menyatakan waktu. Subjek dinyatakan sebagai “perempuan itu” agar rujukan pronomina feminin tetap jelas dalam bahasa Indonesia.
- source_word: וַתְּסִיתֵהוּ
  choice: ia membujuk suaminya
  rationale: Verba סות dapat berarti menghasut, mendorong, atau membujuk. Dalam konteks permintaan keluarga ini, “membujuk” menyampaikan dorongan persuasif tanpa konotasi negatif yang tidak harus ada. Objek maskulin dinyatakan sebagai “suaminya” berdasarkan konteks dekat.
- source_word: לִשְׁאוֹל מֵאֵת אָבִיהָ הַשָּׂדֶה
  choice: untuk meminta ladang itu kepada ayahnya
  rationale: שאל dengan sumber yang ditandai מֵאֵת secara alami diterjemahkan “meminta ... kepada”; artikel pada הַשָּׂדֶה menunjuk pada ladang tertentu.
- source_word: וַתִּצְנַח מֵעַל הַחֲמוֹר
  choice: lalu ia turun dari keledainya
  rationale: צנח menggambarkan gerak turun atau menjatuhkan diri. “Turun dari keledainya” merupakan ungkapan Indonesia yang wajar bagi tindakan meninggalkan tunggangan, sambil mempertahankan alternatif yang lebih harfiah dalam catatan kaki.
- source_word: מַה לָּךְ
  choice: Apa yang kauinginkan?
  rationale: Idiom Ibrani harfiahnya berarti “Apa yang ada padamu/bagimu?” dan dalam konteks ini menanyakan keinginan atau permintaannya.
- source_word: כָּלֵב
  choice: Kaleb
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
