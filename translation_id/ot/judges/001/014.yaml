revisions:
- from: Ketika perempuan itu datang,[a] ia membujuk suaminya untuk meminta ladang itu kepada ayahnya. Lalu ia turun dari keledainya,[b] dan Kaleb bertanya kepadanya, “Apa yang kauinginkan?”[c]
  to: Ketika ia datang, ia membujuknya[a] untuk meminta ladang itu kepada ayahnya. Lalu ia turun dari keledainya,[b] dan Kaleb berkata kepadanya, “Apa yang kauinginkan?”[c]
  rationale: Revisi menghapus nomina yang tidak ada dalam teks sumber, mempertahankan “membujuk” sebagai padanan kontekstual yang netral, dan memindahkan serta memperbaiki catatan kaki agar benar-benar menjelaskan verba yang memiliki rentang makna diperdebatkan. “Berkata” mengikuti verba אמר secara langsung tanpa mengubah daya pragmatis pertanyaan.
