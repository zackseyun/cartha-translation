base_translation:
  language: en
  yaml_path: translation/ot/judges/001/032.yaml
  text: So the Asherites lived among the Canaanites[a], the inhabitants of the land, because they did not drive them out.
translation:
  language: id
  text: Maka orang-orang Asyer tinggal di antara orang Kanaan[a], penduduk negeri itu, sebab mereka tidak menghalau mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani memakai bentuk tunggal kolektif: secara harfiah, “orang Asyer ... orang Kanaan ... ia tidak menghalau dia.” Terjemahan ini menyatakan makna kelompok yang dimaksud.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: tinggal
  rationale: Kata kerja ישׁב dalam konteks ini menyatakan menetap atau berdiam; “tinggal” merupakan padanan Indonesia modern yang alami.
- source_word: הָאָשֵׁרִי
  choice: orang-orang Asyer
  rationale: Bentuk nisbah tunggal berartikel ini berfungsi secara kolektif untuk suku Asyer, sehingga bentuk jamak kolektif menghindari kesan bahwa yang dimaksud hanya satu orang.
- source_word: בְּקֶרֶב
  choice: di tengah-tengah
  rationale: Ungkapan ini menyatakan keberadaan di tengah suatu kelompok; pilihan ini jelas dan tetap dekat dengan bentuk Ibrani.
- source_word: הַכְּנַעֲנִי
  choice: orang Kanaan
  rationale: Walaupun bentuk Ibraninya tunggal, sebutan etnis ini bersifat kolektif dan diterangkan oleh partisipel jamak “penduduk negeri itu.” Dalam bahasa Indonesia, “orang Kanaan” dapat menyatakan kelompok secara alami.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: penduduk negeri itu
  rationale: Frasa partisipial ini menjelaskan orang Kanaan sebagai mereka yang mendiami negeri tersebut; “penduduk negeri itu” ringkas dan wajar.
- source_word: כִּי
  choice: sebab
  rationale: Partikel ini memperkenalkan alasan mengapa orang Asyer tinggal di tengah orang Kanaan.
- source_word: לֹא הוֹרִישׁוֹ
  choice: mereka tidak menghalau mereka
  rationale: Bentuk kausatif ירשׁ dalam konteks penaklukan berarti menyingkirkan atau mengusir penduduk dari wilayahnya. Bentuk jamak menyampaikan acuan kolektif subjek dan objek dengan jelas.
theological_decisions:
- issue: Bentuk tunggal kolektif bagi suku dan kelompok etnis
  choice: 'Menerjemahkan acuannya secara kolektif: “orang-orang Asyer,” “orang Kanaan,” dan “mereka tidak menghalau mereka.”'
  alternative: 'Mempertahankan bentuk tunggal secara harfiah: “orang Asyer ... orang Kanaan ... ia tidak menghalau dia.”'
  rationale: Bentuk-bentuk tunggal Ibrani mewakili kelompok secara kolektif. Terjemahan tunggal dalam bahasa Indonesia dapat disalahpahami sebagai dua individu, sedangkan konteks membicarakan suku Asyer dan penduduk Kanaan.
- issue: Hubungan sebab-akibat pada כִּי
  choice: Menerjemahkan כִּי dengan “sebab,” sehingga kegagalan menghalau orang Kanaan menjadi alasan keadaan hidup berdampingan tersebut.
  alternative: Menerjemahkan secara lebih longgar sebagai penghubung penjelas tanpa penanda sebab yang tegas.
  rationale: Dalam susunan ayat ini, כִּי paling wajar memperkenalkan alasan bagi pernyataan sebelumnya; pilihan ini mempertahankan hubungan logis teks tanpa menambahkan penilaian teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Orang-orang Asyer” menandai suku secara jelas, sedangkan “orang Kanaan” tetap alami sebagai sebutan kolektif. Pengulangan “mereka” dipertahankan agar hubungan subjek dan objek tetap dekat dengan teks sumber.
