translation_notes:
  register: Bahasa yang digunakan modern, lugas, dan bermartabat. Nama tempat mengikuti transliterasi yang lazim dalam bahasa Indonesia. Nama “Naftali” dipertahankan sebagai subjek kolektif sebagaimana dalam teks Ibrani, sedangkan pronomina jamak “mereka” mencerminkan anggota-anggota suku tersebut.
