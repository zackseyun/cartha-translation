  to: Naftali tidak menghalau penduduk Bet-Semes maupun penduduk Bet-Anat. Lalu ia tinggal di tengah-tengah orang-orang Kanaan, penduduk negeri itu. Penduduk Bet-Semes dan Bet-Anat menjadi pekerja paksa bagi mereka.[a]
