  text: נַפְתָּלִ֗י לֹֽא הוֹרִ֞ישׁ אֶת יֹשְׁבֵ֤י בֵֽית שֶׁ֨מֶשׁ֙ וְ/אֶת יֹשְׁבֵ֣י בֵית עֲנָ֔ת וַ/יֵּ֕שֶׁב בְּ/קֶ֥רֶב הַֽ/כְּנַעֲנִ֖י יֹשְׁבֵ֣י הָ/אָ֑רֶץ וְ/יֹשְׁבֵ֤י בֵֽית שֶׁ֨מֶשׁ֙ וּ/בֵ֣ית עֲנָ֔ת הָי֥וּ לָ/הֶ֖ם לָ/מַֽס־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/033.yaml
  text: Naphtali did not drive out the inhabitants of Beth-shemesh or the inhabitants of Beth-anath[a], so he lived among the Canaanites, the inhabitants of the land. And the inhabitants of Beth-shemesh and Beth-anath became forced labor for them.
translation:
  language: id
  text: Naftali tidak menghalau penduduk Bet-Semes maupun penduduk Bet-Anat. Lalu ia tinggal di tengah-tengah orang-orang Kanaan, penduduk negeri itu. Penduduk Bet-Semes dan Bet-Anat menjadi pekerja paksa bagi mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menjadi pekerja rodi bagi mereka.” Kata Ibrani מַס menunjuk pada kerja wajib atau kerja paksa, bukan sekadar pembayaran upeti.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: menghalau
  rationale: Bentuk Hifil dari ירש dalam konteks ini menunjuk pada tindakan menyingkirkan penduduk sebelumnya dari wilayah itu. “Menghalau” alami dalam bahasa Indonesia dan mempertahankan nuansa pengusiran.
- source_word: יֹשְׁבֵי
  choice: penduduk
  rationale: Partisipel ישב menunjuk kepada orang-orang yang mendiami suatu tempat. “Penduduk” ringkas, wajar, dan cocok dengan pengulangan rumusan ayat ini.
- source_word: בֵית שֶׁמֶשׁ
  choice: Bet-Semes
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia, bukan diterjemahkan secara harfiah.
- source_word: בֵית עֲנָת
  choice: Bet-Anat
  rationale: Nama tempat ditransliterasikan dan tidak diterjemahkan; tanda hubung membantu memperlihatkan bahwa unsur-unsurnya membentuk satu nama.
- source_word: וַיֵּשֶׁב בְּקֶרֶב
  choice: tetapi tinggal di tengah-tengah
  rationale: '“Tinggal di tengah-tengah” menyampaikan idiom בְּקֶרֶב secara alami. Kata sambung “tetapi” menonjolkan kontras naratif: Naftali tidak menghalau penduduk itu, melainkan hidup di antara mereka, tanpa mengubah hubungan itu menjadi sebab-akibat yang dinyatakan secara tegas.'
- source_word: הַכְּנַעֲנִי
  choice: orang Kanaan
  rationale: Walaupun berbentuk tunggal dalam bahasa Ibrani, istilah ini merupakan sebutan etnis kolektif. “Orang Kanaan” dapat berfungsi secara kolektif dengan alami dalam bahasa Indonesia.
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: penduduk negeri itu
  rationale: Frasa aposisional ini dipertahankan karena terdapat dalam teks Ibrani dan mengidentifikasi orang Kanaan sebagai penduduk negeri tersebut.
- source_word: הָיוּ לָהֶם לָמַס
  choice: menjadi tenaga kerja paksa bagi mereka
  rationale: מַס menunjuk pada kewajiban kerja paksa atau rodi, bukan sekadar pembayaran upeti. Pilihan ini mempertahankan konstruksi “menjadi ... bagi mereka” sekaligus dapat dipahami pembaca modern.
- source_word: לָהֶם
  choice: bagi mereka
  rationale: Pronomina jamak ini kemungkinan merujuk kepada anggota-anggota suku Naftali. Bentuk jamaknya dipertahankan agar tidak meniadakan pergeseran dari nama suku kolektif ke para anggotanya.
