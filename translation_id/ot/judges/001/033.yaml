    issue: Kata sambung "tetapi" pada klausa kedua
    rationale: וַיֵּשֶׁב hanya diawali waw naratif. Kontras dapat tersirat dari konteks, tetapi "tetapi" secara eksplisit memperkuat hubungan adversatif. "Lalu" menyampaikan urutan naratif tanpa menambah nuansa itu.
  - severity: medium
    issue: '"menjadi tenaga kerja paksa"'
    rationale: Dalam bahasa Indonesia, "tenaga kerja" sering berarti tenaga kerja sebagai sumber daya atau kumpulan buruh. Karena subjeknya adalah para penduduk yang dikenai מַס, "menjadi pekerja paksa" lebih tepat dan langsung.
  - severity: low
    issue: Alternatif catatan kaki "dikenai kewajiban kerja rodi bagi mereka"
    rationale: Frasa ini kurang lancar karena "bagi mereka" melekat secara tidak jelas pada "kewajiban". Rumusan alternatif yang paralel dengan teks utama lebih jelas.
