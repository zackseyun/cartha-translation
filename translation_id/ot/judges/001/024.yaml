  text: וַ/יִּרְאוּ֙ הַ/שֹּׁ֣מְרִ֔ים אִ֖ישׁ יוֹצֵ֣א מִן הָ/עִ֑יר וַ/יֹּ֣אמְרוּ ל֗/וֹ הַרְאֵ֤/נוּ נָא֙ אֶת מְב֣וֹא הָ/עִ֔יר וְ/עָשִׂ֥ינוּ עִמְּ/ךָ֖ חָֽסֶד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/024.yaml
  text: The watchers saw a man coming out of the city[a], and they said to him, “Please show us the entrance to the city[b], and we will deal kindly with you.”
translation:
  language: id
  text: Para pengintai melihat seorang laki-laki keluar dari kota itu, lalu berkata kepadanya, “Tolong tunjukkan kepada kami jalan masuk ke kota itu, maka kami akan memperlakukanmu dengan baik.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani khesed; menurut konteks dapat berarti “kebaikan”, “kesetiaan”, atau “kasih setia”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁמְרִים
  choice: para pengintai
  rationale: Partisipel dari שׁמר menunjuk kepada orang-orang yang mengawasi kota dari luar. Dalam konteks pengepungan, “para pengintai” alami dan tidak menyiratkan bahwa mereka penjaga kota.
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Nomina tunggal ini secara langsung menunjuk kepada seorang individu laki-laki.
- source_word: יוֹצֵא מִן־הָעִיר
  choice: keluar dari kota itu
  rationale: Partisipel יצא dengan מן menyatakan gerakan dari dalam ke luar kota; bentuk ini alami dalam bahasa Indonesia tanpa perlu menetapkan sudut pandang ‘datang’ atau ‘pergi’.
- source_word: מְבוֹא הָעִיר
  choice: jalan masuk ke kota itu
  rationale: מְבוֹא dapat berarti pintu masuk atau jalan untuk memasuki suatu tempat. Dalam konteks militer ini, “jalan masuk” mempertahankan kemungkinan bahwa yang dimaksud ialah akses tersembunyi, bukan gerbang resmi.
- source_word: נָא
  choice: tolong
  rationale: Partikel ini melunakkan bentuk perintah; “tolong” merupakan padanan Indonesia modern yang wajar.
- source_word: וְעָשִׂינוּ עִמְּךָ חָסֶד
  choice: maka kami akan memperlakukanmu dengan baik
  rationale: Dalam perundingan ini, חֶסֶד menunjuk pada perlakuan baik atau kemurahan yang dijanjikan sebagai balasan, tanpa harus diberi muatan perjanjian yang lebih kuat.
theological_decisions:
- issue: Makna חֶסֶד dalam janji kepada laki-laki itu
  choice: perlakuan baik
  alternative: kasih setia; kesetiaan perjanjian
  rationale: Walaupun חֶסֶד dapat menyatakan kasih setia atau loyalitas perjanjian, konteks langsungnya adalah janji untuk memperlakukan informan itu dengan baik. Terjemahan yang lebih sarat muatan perjanjian akan melampaui konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. “Para pengintai” dipilih untuk kelompok yang mengawasi dari luar, sedangkan “jalan masuk” mempertahankan keluasan makna מְבוֹא. Penanda catatan kaki ditempatkan sesudah klausa yang menerjemahkan חֶסֶד.
