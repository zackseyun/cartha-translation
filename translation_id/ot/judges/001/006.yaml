base_translation:
  language: en
  yaml_path: translation/ot/judges/001/006.yaml
  text: But Adoni-bezek fled[a], and they pursued him, seized him, and cut off his thumbs and big toes.
translation:
  language: id
  text: Tetapi Adoni-Bezek melarikan diri, lalu mereka mengejarnya, menangkapnya, dan memotong kedua ibu jari tangan dan kedua ibu jari kakinya hingga putus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “ibu-ibu jari tangan dan kakinya,” yaitu kedua ibu jari tangan dan kedua ibu jari kaki.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנָס
  choice: melarikan diri
  rationale: Bentuk wayyiqtol dari נוּס menyatakan tindakan lari untuk menghindar. “Melarikan diri” alami dalam narasi Indonesia dan tidak menyiratkan bahwa ia berhasil lolos, sebab sesudahnya ia tertangkap.
- source_word: אֲדֹנִי בֶזֶק
  choice: Adoni-Bezek
  rationale: Ungkapan ini berfungsi sebagai nama atau gelar-nama dalam konteks. Transliterasi mempertahankan bentuk nama tanpa memutuskan bahwa maknanya, “tuan Bezek,” harus diterjemahkan.
- source_word: וַיִּרְדְּפוּ אַחֲרָיו
  choice: mereka mengejarnya
  rationale: Konstruksi רדף + אַחַר berarti mengejar seseorang. “Mengejarnya” ringkas, wajar, dan sesuai dengan gaya narasi modern.
- source_word: וַיֹּאחֲזוּ אֹתוֹ
  choice: menangkapnya
  rationale: אחז berarti memegang atau menangkap. Dalam rangkaian pengejaran ini, “menangkapnya” menyampaikan hasil tindakan secara alami; “mencengkeramnya” akan terlalu menekankan cara memegang.
- source_word: וַיְקַצְּצוּ
  choice: memotong
  rationale: Dalam konteks anggota tubuh, קצץ berarti memotong hingga terpisah. Objek yang disebut sesudahnya membuat hasil pemotongan jelas dalam bahasa Indonesia.
- source_word: בְּהֹנוֹת יָדָיו וְרַגְלָיו
  choice: ibu jari tangan serta ibu jari kakinya
  rationale: בֹּהֶן menunjuk ibu jari pada tangan dan jari terbesar pada kaki. Pilihan ini mengungkapkan kedua rujukan ungkapan Ibrani secara alami dan tepat dalam bahasa Indonesia.
