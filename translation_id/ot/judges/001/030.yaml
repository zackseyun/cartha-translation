id: JDG.1.30
reference: Judges 1:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: זְבוּלֻ֗ן לֹ֤א הוֹרִישׁ֙ אֶת יוֹשְׁבֵ֣י קִטְר֔וֹן וְ/אֶת יוֹשְׁבֵ֖י נַהֲלֹ֑ל וַ/יֵּ֤שֶׁב הַֽ/כְּנַעֲנִי֙ בְּ/קִרְבּ֔/וֹ וַ/יִּֽהְי֖וּ לָ/מַֽס־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/030.yaml
  text: Zebulun did not drive out the inhabitants of Kitron or the inhabitants of Nahalol[b][a], so the Canaanites lived among them and became forced laborers.
translation:
  language: id
  text: Zebulon tidak menghalau penduduk Kitron maupun penduduk Nahalol[a]. Karena itu, orang Kanaan tinggal di tengah-tengah suku Zebulon[b] dan menjadi pekerja paksa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: "Nahalal"; bentuk nama tempat ini muncul dalam tradisi penerjemahan dan bagian-bagian terkait.'
    reason: alternative_reading
  - marker: b
    text: 'Secara harfiah: "orang Kanaan itu tinggal di tengah-tengahnya." Bahasa Ibrani memakai bentuk tunggal kolektif untuk orang Kanaan dan bentuk tunggal untuk Zebulon sebagai satu suku.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: menghalau
  rationale: Dalam konteks Hakim-Hakim 1, bentuk Hifil dari ירש menunjuk pada tindakan menyingkirkan penduduk terdahulu dari wilayah itu. 'Menghalau' alami dalam bahasa Indonesia dan mempertahankan nuansa tindakan paksa tanpa mempersempitnya menjadi sekadar pemindahan hak milik.
- source_word: יוֹשְׁבֵי
  choice: penduduk
  rationale: Partisip dari ישב menunjuk kepada orang-orang yang mendiami suatu tempat; 'penduduk' ringkas dan wajar dalam bahasa Indonesia modern.
- source_word: קִטְרוֹן
  choice: Kitron
  rationale: Nama tempat ditransliterasikan sesuai vokalisasi teks sumber.
- source_word: נַהֲלֹל
  choice: Nahalol
  rationale: Bentuk ini mengikuti vokalisasi WLC pada ayat ini; bentuk 'Nahalal' dicatat sebagai alternatif.
- source_word: וַיֵּשֶׁב הַכְּנַעֲנִי בְּקִרְבּוֹ
  choice: orang Kanaan tinggal di tengah-tengah suku Zebulon
  rationale: הַכְּנַעֲנִי berbentuk tunggal kolektif, sedangkan sufiks tunggal pada בְּקִרְבּוֹ kemungkinan merujuk kepada Zebulon sebagai satu suku. Penyebutan 'suku Zebulon' membuat acuan korporat itu jelas tanpa mengubah makna kolektif.
- source_word: לָמַס
  choice: pekerja paksa
  rationale: מַס di sini menyatakan kerja wajib yang dibebankan kepada penduduk taklukan, bukan semata-mata upeti berupa uang. 'Pekerja paksa' merupakan ungkapan Indonesia yang jelas bagi status orang-orang tersebut.
theological_decisions:
- issue: Bentuk tunggal kolektif הַכְּנַעֲנִי dan sufiks tunggal בְּקִרְבּוֹ
  choice: Menerjemahkan secara kolektif sebagai 'orang Kanaan tinggal di tengah-tengah suku Zebulon'
  alternative: '''orang Kanaan itu tinggal di tengah-tengahnya'''
  rationale: Bahasa Ibrani lazim memakai bentuk tunggal kolektif bagi suatu bangsa dan bentuk tunggal bagi suku sebagai kesatuan korporat. Terjemahan utama memperjelas kedua acuan tersebut dalam bahasa Indonesia, sedangkan bentuk harfiahnya didokumentasikan dalam catatan kaki.
- issue: Hubungan antarklausa setelah kegagalan menghalau
  choice: Karena itu
  alternative: dan
  rationale: Waw berurutan di sini melanjutkan hasil keadaan sebelumnya. 'Karena itu' mengungkapkan hubungan konsekuensial yang tersirat tanpa menambahkan penilaian teologis.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Maupun' menghubungkan dua objek yang sama-sama tidak berhasil dihalau. Frasa 'di tengah-tengah suku Zebulon' dipilih agar acuan sufiks tunggal korporat jelas, dan 'pekerja paksa' lebih alami daripada ungkapan abstrak 'kerja paksa' setelah verba 'menjadi'.
