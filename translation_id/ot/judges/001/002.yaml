source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָ֖ה יְהוּדָ֣ה יַעֲלֶ֑ה הִנֵּ֛ה נָתַ֥תִּי אֶת הָ/אָ֖רֶץ בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/002.yaml
  text: And the LORD said, “Judah shall go up. Look, I have given the land into his hand.”
translation:
  language: id
  text: TUHAN berfirman, “Yehuda harus maju. Lihat, Aku telah menyerahkan negeri itu ke dalam tangannya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia untuk nama ilahi YHWH dengan huruf kapital, selaras dengan lapisan konsultasi POB.
- source_word: יַעֲלֶה
  choice: harus maju
  rationale: Dalam konteks pengerahan untuk berperang, secara alami menyatakan bahwa Yehuda ditetapkan sebagai pihak yang maju lebih dahulu; bentuk Ibrani tetap membawa nuansa perintah/penetapan.
- source_word: הִנֵּה
  choice: Lihat
  rationale: Mempertahankan penanda perhatian dalam teks verklaring ilahi dengan ungkapan Indonesia yang langsung dan mudah dipahami.
- source_word: נָתַתִּי
  choice: telah menyerahkan
  rationale: Bentuk perfektif menyajikan kemenangan sebagai tindakan Allah yang sudah pasti; 'menyerahkan' sesuai dengan idiom penyerahan wilayah atau musuh.
- source_word: הָאָרֶץ
  choice: negeri itu
  rationale: Dalam konteks ini menunjuk pada wilayah yang akan direbut, bukan bumi secara umum.
- source_word: בְּיָדוֹ
  choice: ke dalam tangannya
  rationale: Mempertahankan metafora Ibrani tentang kuasa atau penguasaan tanpa menghilangkan gambaran aslinya.
theological_decisions:
- issue: Perfektif ilahi pada נָתַתִּי
  choice: telah menyerahkan
  alternative: akan menyerahkan
  rationale: Terjemahan perfektif dipertahankan agar kepastian tindakan ilahi tidak diubah menjadi sekadar janji masa depan.
- issue: Rujukan pronomina maskulin tunggal בְּיָדוֹ
  choice: tangannya
  alternative: tangan mereka
  rationale: Teks Ibrani memperlakukan Yehuda sebagai satu kesatuan kolektif dengan pronomina tunggal; bentuk itu dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dibuat alami untuk pembaca umum sambil mempertahankan metafora sumber dan kepastian pernyataan ilahi.
