  edition: WLC
  text: וַֽ/יְהִי֙ כִּֽי חָזַ֣ק יִשְׂרָאֵ֔ל וַ/יָּ֥שֶׂם אֶת הַֽ/כְּנַעֲנִ֖י לָ/מַ֑ס וְ/הוֹרֵ֖ישׁ לֹ֥א הוֹרִישֽׁ/וֹ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/028.yaml
  text: And when Israel became strong[a], they put the Canaanites to forced labor[b], but they did not drive them out completely.
translation:
  language: id
  text: Ketika bangsa Israel menjadi kuat, mereka membebani orang Kanaan dengan kerja paksa[a], tetapi mereka tidak menghalau mereka sepenuhnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dapat dipahami sebagai “menempatkan orang Kanaan di bawah kewajiban kerja.” Kata Ibrani yang dipakai menunjuk pada kerja wajib yang dikenakan oleh pihak penguasa.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani memakai objek tunggal, “dia,” yang merujuk secara kolektif kepada penduduk Kanaan; terjemahan memakai “mereka” agar alami dalam bahasa Indonesia.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִּי
  choice: Ketika
  rationale: Ungkapan naratif ini memperkenalkan anak kalimat waktu. “Ketika” menyampaikan hubungan waktunya secara alami tanpa meniru ungkapan Ibrani secara kaku.
- source_word: חָזַק
  choice: menjadi kuat
  rationale: Dalam konteks ini, verba tersebut menunjukkan bahwa Israel bertambah kuat atau mencapai posisi dominan, bukan sekadar berada dalam keadaan kuat.
- source_word: הַכְּנַעֲנִי
  choice: orang Kanaan
  rationale: Bentuk Ibraninya tunggal, tetapi berfungsi sebagai sebutan kolektif bagi penduduk Kanaan. Bahasa Indonesia dapat mempertahankan bentuk kolektif alami “orang Kanaan”.
- source_word: וַיָּשֶׂם ... לָמַס
  choice: membebani ... dengan kerja paksa
  rationale: Gabungan ini menyatakan bahwa pihak yang berkuasa mengenakan kewajiban kerja kepada pihak yang ditaklukkan. Pilihan ini jelas, alami, dan mempertahankan unsur pemaksaan.
- source_word: וְהוֹרֵישׁ לֹא הוֹרִישׁוֹ
  choice: tetapi sama sekali tidak menghalau mereka
  rationale: Infinitif absolut yang disertai verba seakar memberi penegasan pada tindakan yang dinegasikan. “Sama sekali tidak” mempertahankan penekanan itu, sedangkan “menghalau” sesuai dengan konteks pengusiran dari wilayah tersebut.
theological_decisions:
- issue: Perlakuan Israel terhadap orang Kanaan
  choice: Israel mengenakan kerja paksa kepada orang Kanaan dan tidak menghalau mereka sama sekali.
  alternative: Israel hanya mengenakan upeti berupa pembayaran biasa kepada orang Kanaan.
  rationale: Kata מַס dalam konteks ini menunjuk pada kewajiban kerja yang dipaksakan oleh penguasa, bukan pengaturan pajak netral. Terjemahan tidak melunakkan unsur pemaksaan dalam teks.
- issue: Penegasan bahwa orang Kanaan tidak dihalau
  choice: “sama sekali tidak menghalau”
  alternative: “tidak menghalau sepenuhnya”
  rationale: Susunan Ibrani menegaskan tidak terjadinya tindakan penghalauan. Pilihan ini mempertahankan tekanan gramatikal tanpa menentukan lebih jauh alasan atau cakupan politisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kerja paksa” dipilih karena mudah dipahami luas dan tidak terlalu terikat pada konteks sejarah tertentu seperti istilah “kerja rodi.” Struktur kalimat mempertahankan kontras antara meningkatnya kekuatan Israel dan kegagalan mereka menghalau penduduk Kanaan.
