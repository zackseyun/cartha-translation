  text: וַ/יֹּ֣אמֶר כָּלֵ֔ב אֲשֶׁר יַכֶּ֥ה אֶת קִרְיַת סֵ֖פֶר וּ/לְכָדָ֑/הּ וְ/נָתַ֥תִּי ל֛/וֹ אֶת עַכְסָ֥ה בִתִּ֖/י לְ/אִשָּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/012.yaml
  text: And Caleb said[a], “Whoever strikes Kiriath-sepher and captures it, I will give him my daughter Achsah as a wife.”
translation:
  language: id
  text: Lalu Kaleb berkata, “Siapa pun yang menyerang Kiryat-Sefer dan merebutnya, kepadanya akan kuberikan Akhsa, anak perempuanku, sebagai istri.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur narasi; “lalu” menyatakan urutan secara alami tanpa memberi tekanan waktu yang berlebihan.
- source_word: כָּלֵב
  choice: Kaleb
  rationale: Mengikuti bentuk nama pribadi yang lazim dalam tradisi Alkitab berbahasa Indonesia.
- source_word: אֲשֶׁר
  choice: siapa pun yang
  rationale: Kata relatif ini memperkenalkan tantangan terbuka dengan acuan orang yang tidak ditentukan.
- source_word: יַכֶּה
  choice: menyerang
  rationale: Dalam konteks operasi militer terhadap sebuah kota, bentuk hifil dari נכה berarti menyerang atau memukul; “menyerang” alami dalam bahasa Indonesia dan tidak mendahului hasil yang dinyatakan oleh verba berikutnya.
- source_word: קִרְיַת סֵפֶר
  choice: Kiryat-Sefer
  rationale: Nama tempat ditransliterasikan; tanda hubung mempertahankan kesatuan nama majemuk Ibrani.
- source_word: וּלְכָדָהּ
  choice: dan merebutnya
  rationale: לכד dalam konteks militer menunjuk pada tindakan menguasai atau merebut; sufiks feminin tunggal mengacu kepada kota tersebut.
- source_word: וְנָתַתִּי לוֹ
  choice: kepadanya akan kuberikan
  rationale: Menyampaikan janji bersyarat Kaleb sekaligus mempertahankan penekanan pada penerima melalui unsur לוֹ.
- source_word: עַכְסָה
  choice: Akhsa
  rationale: Transliterasi nama pribadi yang sesuai dengan ejaan Indonesia.
- source_word: בִתִּי
  choice: anak perempuanku
  rationale: Menyatakan hubungan keluarga secara eksplisit sebagaimana teks sumber.
- source_word: לְאִשָּׁה
  choice: sebagai istri
  rationale: Ungkapan ini berarti memberikan seorang perempuan dalam perkawinan; terjemahan tersebut jelas, alami, dan dekat dengan konstruksi Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan “kepadanya akan kuberikan” dipertahankan untuk mencerminkan objek tak langsung yang didahulukan dalam teks Ibrani. Tidak diperlukan catatan kaki karena אֲשֶׁר dapat diterjemahkan langsung dan alami sebagai “siapa pun yang” tanpa kehilangan ambiguitas penting.
