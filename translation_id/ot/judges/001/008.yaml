translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. 'Keturunan Yehuda' dipilih agar ungkapan kesukuan mudah dipahami, sedangkan 'mata pedang' mempertahankan citraan idiom Ibrani tanpa memakai bentuk harfiah yang janggal, 'mulut pedang'.
