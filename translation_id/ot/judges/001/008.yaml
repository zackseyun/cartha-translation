  text: Then the sons of Judah fought against Jerusalem and captured it[a], and struck it with the edge of the sword[b], and they set the city on fire.
translation:
  language: id
  text: Kemudian anak-anak Yehuda[a] berperang melawan Yerusalem[b], merebutnya, memukulnya dengan mata pedang, dan membakar kota itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Yehuda”; ungkapan ini menunjuk secara kolektif kepada kelompok suku Yehuda.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “berperang di Yerusalem”; tetapi konteksnya lebih mendukung “berperang melawan Yerusalem”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּלָּחֲמוּ בִירוּשָׁלִַם
  choice: berperang melawan Yerusalem
  rationale: Dalam konteks peperangan, verba לחם dengan preposisi ב paling wajar menunjukkan tindakan bermusuhan terhadap Yerusalem; rangkaian berikutnya, yaitu merebut kota itu, mendukung makna ini.
- source_word: בְנֵי יְהוּדָה
  choice: keturunan Yehuda
  rationale: Ungkapan harfiahnya berarti 'anak-anak lelaki Yehuda', tetapi di sini menunjuk secara kolektif kepada kelompok suku Yehuda. 'Keturunan Yehuda' mempertahankan gambaran kekerabatan tanpa menimbulkan kesan bahwa yang dimaksud hanya putra-putra langsung Yehuda.
- source_word: וַיִּלְכְּדוּ אוֹתָהּ
  choice: merebutnya
  rationale: לכד dalam kisah militer berarti menangkap atau merebut sebuah kota. 'Merebutnya' alami dalam bahasa Indonesia dan mempertahankan nuansa penaklukan.
- source_word: וַיַּכּוּהָ לְפִי חָרֶב
  choice: menumpasnya dengan mata pedang
  rationale: נכה berarti memukul atau menghantam, sedangkan idiom לְפִי חָרֶב, secara harfiah 'dengan mulut pedang', menyatakan penumpasan dengan pedang. Pilihan ini mempertahankan pronomina feminin yang merujuk kepada kota sekaligus menyampaikan daya idiom militernya.
- source_word: וְאֶת הָעִיר שִׁלְּחוּ בָאֵשׁ
  choice: Lalu mereka membakar kota itu
  rationale: Ungkapan שלח באש berarti menyerahkan sesuatu kepada api atau membuatnya terbakar. 'Membakar kota itu' merupakan ungkapan Indonesia yang alami dan tepat.
