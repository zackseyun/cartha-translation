base_translation:
  language: en
  yaml_path: translation/ot/judges/001/010.yaml
  text: Then Judah went against the Canaanites living in Hebron (Hebron’s former name was Kiriath-arba)[a], and they struck down Sheshai, Ahiman[c][b], and Talmai.
translation:
  language: id
  text: Lalu Yehuda maju melawan orang Kanaan[a] yang tinggal di Hebron—dahulu Hebron bernama Kiryat-Arba—dan mereka mengalahkan Sesai, Ahiman, serta Talmai.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani memakai bentuk tunggal “orang Kanaan,” yang kemungkinan berfungsi secara kolektif di sini.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “mengalahkan” juga dapat berarti “menghantam” atau “menewaskan” dalam konteks perang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ יְהוּדָה אֶל
  choice: Lalu Yehuda maju melawan
  rationale: Secara harfiah verba berarti 'pergi', tetapi אֶל dengan sasaran yang dimusuhi dalam narasi perang menunjukkan gerak untuk menyerang. 'Maju melawan' menyampaikan gerak dan nuansa permusuhan tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: הַכְּנַעֲנִי
  choice: orang Kanaan
  rationale: Bentuk Ibrani tunggal ini dapat berfungsi secara kolektif untuk kelompok bangsa; bahasa Indonesia secara alami memakai 'orang Kanaan', yang juga dapat dipahami secara kolektif.
- source_word: הַיּוֹשֵׁב בְּחֶבְרוֹן
  choice: yang tinggal di Hebron
  rationale: Partisipel tersebut menyatakan kediaman menetap; 'tinggal' adalah padanan modern dan wajar.
- source_word: וְשֵׁם חֶבְרוֹן לְפָנִים קִרְיַת אַרְבַּע
  choice: dahulu Hebron bernama Kiryat-Arba
  rationale: Susunan ini secara alami menyampaikan keterangan nama tempat pada masa sebelumnya. Nama tempat ditransliterasikan mengikuti pola ejaan Indonesia.
- source_word: וַיַּכּוּ
  choice: mereka mengalahkan
  rationale: נכה dalam konteks militer dapat berarti menghantam, menewaskan, atau mengalahkan. 'Mengalahkan' mempertahankan cakupan makna tanpa memastikan bahwa ketiganya dibunuh.
- source_word: שֵׁשַׁי וְאֶת אֲחִימַן וְאֶת תַּלְמָי
  choice: Sesai, Ahiman, serta Talmai
  rationale: Nama-nama pribadi ditransliterasikan dengan bentuk yang mudah dibaca dalam bahasa Indonesia.
