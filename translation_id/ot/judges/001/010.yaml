  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Yehuda' dipertahankan sebagai nama kolektif suku, sedangkan verba jamak 'mereka mengalahkan' mengikuti peralihan bilangan dalam teks Ibrani dan memperjelas bahwa Yehuda di sini merujuk pada kelompok.
