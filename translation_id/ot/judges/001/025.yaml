  text: So he showed them the entrance to the city[a], and they struck the city with the edge of the sword[b]; but they let the man and all his family go.
translation:
  language: id
  text: Lalu orang itu menunjukkan kepada mereka jalan masuk ke kota tersebut. Mereka membunuh penduduk kota itu dengan pedang[a], tetapi membiarkan orang itu dan seluruh keluarganya pergi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dengan mulut pedang,” suatu ungkapan yang berarti “dengan mata pedang.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “seluruh kaum keluarganya” atau “seluruh klannya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְאֵם
  choice: menunjukkan kepada mereka
  rationale: 'Bentuk verba ראה di sini berdaya kausatif: orang itu memperlihatkan atau memberitahukan jalan masuk kota kepada para penyerang.'
- source_word: מְבוֹא הָעִיר
  choice: jalan masuk ke kota tersebut
  rationale: מָבוֹא dapat menunjuk pada pintu masuk, jalan masuk, atau akses menuju kota. Dalam konteks militer ini, 'jalan masuk' terdengar alami dan dapat mencakup akses yang tersembunyi.
- source_word: וַיַּכּוּ
  choice: menumpas
  rationale: נכה berarti memukul, menyerang, atau mengalahkan. Bersama ungkapan pedang yang mengikutinya, 'menumpas' secara alami menyampaikan serangan mematikan atas kota tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: לְפִי חָרֶב
  choice: dengan mata pedang
  rationale: Secara harfiah ungkapan ini berarti 'dengan mulut pedang' dan merupakan idiom untuk membunuh dengan pedang. 'Mata pedang' mempertahankan citra konkret dalam bahasa Indonesia yang wajar.
- source_word: שִׁלֵּחוּ
  choice: membiarkan ... pergi
  rationale: Dalam konteks ini verba tersebut menyatakan bahwa mereka tidak membunuh orang itu, melainkan melepaskannya. Ungkapan ini alami dan tidak melebihkan makna.
- source_word: כָּל מִשְׁפַּחְתּוֹ
  choice: seluruh keluarganya
  rationale: מִשְׁפָּחָה dapat berarti keluarga, kaum keluarga, atau klan. 'Seluruh keluarganya' paling jelas bagi pembaca modern, sementara catatan mempertahankan keluasan maknanya.
- source_word: הָאִישׁ
  choice: orang itu
  rationale: Nomina definit ini merujuk kembali kepada orang yang disebut dalam ayat sebelumnya; 'orang itu' merupakan rujukan naratif yang jelas dan alami.
