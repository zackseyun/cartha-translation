source:
  edition: WLC
  text: וְ/לֹא הוֹרִ֣ישׁ מְנַשֶּׁ֗ה אֶת בֵּית שְׁאָ֣ן וְ/אֶת בְּנוֹתֶי/הָ֮ וְ/אֶת תַּעְנַ֣ךְ וְ/אֶת בְּנֹתֶי/הָ֒ וְ/אֶת ישב ד֜וֹר וְ/אֶת בְּנוֹתֶ֗י/הָ וְ/אֶת יוֹשְׁבֵ֤י יִבְלְעָם֙ וְ/אֶת בְּנֹתֶ֔י/הָ וְ/אֶת יוֹשְׁבֵ֥י מְגִדּ֖וֹ וְ/אֶת בְּנוֹתֶ֑י/הָ וַ/יּ֨וֹאֶל֙ הַֽ/כְּנַעֲנִ֔י לָ/שֶׁ֖בֶת בָּ/אָ֥רֶץ הַ/זֹּֽאת־־־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/027.yaml
  text: But Manasseh did not dispossess Beth-shean and its daughter towns[a], or Taanach and its daughter towns, or the inhabitants of Dor and its daughter towns, or the inhabitants of Ibleam and its daughter towns, or the inhabitants of Megiddo and its daughter towns[b]; and the Canaanites persisted in dwelling in this land.
translation:
  language: id
  text: Namun, suku Manasye tidak menghalau penduduk Bet-Sean beserta kota-kota bawahannya[a], penduduk Taanakh beserta kota-kota bawahannya, penduduk Dor beserta kota-kota bawahannya, penduduk Yibleam beserta kota-kota bawahannya, ataupun penduduk Megido beserta kota-kota bawahannya. Orang Kanaan bersikeras untuk tetap tinggal di negeri ini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak perempuannya”, yaitu kota-kota kecil atau permukiman yang bergantung pada kota utama.
    reason: cultural_note
  - marker: b
    text: Atau, “Orang Kanaan bertekad untuk tinggal di negeri ini.” Kata kerja Ibrani dapat menyatakan kemauan atau tekad.
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹרִישׁ
  choice: menghalau
  rationale: Bentuk Hifil dari ירשׁ dalam konteks ini berarti membuat pihak lain kehilangan tempat atau wilayahnya. “Menghalau” alami dalam bahasa Indonesia dan menyampaikan tindakan menyingkirkan penduduk dari wilayah itu.
- source_word: בְּנוֹתֶיהָ
  choice: kota-kota bawahannya
  rationale: Secara harfiah berarti “anak-anak perempuannya”, tetapi merupakan ungkapan bagi kota atau permukiman kecil yang bergantung pada kota utama. “Kota-kota bawahannya” menyampaikan hubungan administratif tersebut dengan jelas.
- source_word: ישב דּוֹר / יוֹשְׁבֵי יִבְלְעָם / יוֹשְׁבֵי מְגִדּוֹ
  choice: penduduk Dor ... penduduk Yibleam ... penduduk Megido
  rationale: Bentuk partisip dari ישׁב menunjuk kepada orang-orang yang mendiami tempat-tempat tersebut. “Penduduk” adalah padanan kolektif yang alami dalam bahasa Indonesia.
- source_word: וַיּוֹאֶל
  choice: bersikeras
  rationale: Kata kerja יאל dapat menyatakan kemauan atau tekad. Dalam konteks kegagalan Manasye menghalau mereka, “bersikeras” menyampaikan keteguhan orang Kanaan untuk terus menetap tanpa menghapus kemungkinan nuansa “bertekad”.
- source_word: הַכְּנַעֲנִי
  choice: Orang Kanaan
  rationale: Walaupun berbentuk tunggal dalam bahasa Ibrani, kata ini berfungsi secara kolektif untuk kelompok bangsa Kanaan. Bentuk “Orang Kanaan” juga dapat dipahami secara kolektif dalam bahasa Indonesia.
- source_word: לָשֶׁבֶת בָּאָרֶץ הַזֹּאת
  choice: untuk tetap tinggal di negeri itu
  rationale: Infinitif dengan ל menyatakan tindakan yang mereka kehendaki atau tekadkan. Kata “tetap” mengungkapkan keberlanjutan tinggal yang tersirat oleh konteks, sedangkan “negeri itu” mempertahankan unsur penunjuk.
- source_word: בֵּית שְׁאָן / תַּעְנַךְ / דּוֹר / יִבְלְעָם / מְגִדּוֹ
  choice: Bet-Sean, Taanakh, Dor, Yibleam, Megido
  rationale: Nama-nama tempat ditransliterasikan dalam bentuk yang lazim dan mudah dibaca oleh pembaca Alkitab berbahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Suku Manasye” memperjelas bahwa yang dimaksud ialah kelompok suku, sedangkan pengulangan “penduduk” membuat objek tindakan menghalau menjadi alami dalam bahasa Indonesia; pada dua nama pertama unsur penduduk dipahami secara metonimis dari nama kota dalam teks Ibrani.
