id: JDG.1.16
reference: Judges 1:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בְנֵ֣י קֵינִי֩ חֹתֵ֨ן מֹשֶׁ֜ה עָל֨וּ מֵ/עִ֤יר הַ/תְּמָרִים֙ אֶת בְּנֵ֣י יְהוּדָ֔ה מִדְבַּ֣ר יְהוּדָ֔ה אֲשֶׁ֖ר בְּ/נֶ֣גֶב עֲרָ֑ד וַ/יֵּ֖לֶךְ וַ/יֵּ֥שֶׁב אֶת הָ/עָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/016.yaml
  text: And the descendants of the Kenite[a], Moses’ father-in-law, went up from the City of Palms with the descendants of Judah into the wilderness of Judah, which is in the Negev of Arad[d][c][b]; then he went and settled with the people.
translation:
  language: id
  text: Keturunan orang Keni[a], ayah mertua Musa, naik dari Kota Pohon Kurma[b] bersama keturunan Yehuda menuju padang gurun Yehuda, yang terletak di Negeb Arad. Lalu ia pergi dan menetap[c] bersama bangsa itu.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kerabat Musa karena perkawinan.” Kata Ibrani ini dapat memiliki arti yang lebih luas daripada “ayah mertua”, meskipun “ayah mertua” merupakan pengertian yang paling lazim di sini.
    reason: lexical_alternative
  - marker: b
    text: “Kota Pohon Kurma” pada umumnya dipahami sebagai Yerikho.
    reason: cross_reference
  - marker: c
    text: 'Teks Ibrani beralih ke bentuk tunggal: “ia pergi dan menetap.” Ini mungkin menunjuk pada kaum Keni sebagai satu kesatuan, meskipun ada yang memahaminya dalam arti jamak.'
    reason: grammatical_ambiguity
  - marker: d
    text: Dapat juga diterjemahkan, “di tengah-tengah bangsa itu.” Sejumlah saksi kuno memiliki bacaan “bersama Amalek” sebagai ganti “bersama bangsa itu”.
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי קֵינִי
  choice: Keturunan orang Keni
  rationale: בְּנֵי secara harfiah berarti ‘anak-anak lelaki’, tetapi dalam konteks kesukuan menunjuk pada keturunan atau anggota kaum. ‘Keturunan orang Keni’ menyampaikan makna tersebut secara wajar dalam bahasa Indonesia.
- source_word: חֹתֵן מֹשֶׁה
  choice: mertua Musa
  rationale: חֹתֵן paling lazim berarti ‘mertua laki-laki’, tetapi dapat pula menunjuk pada kerabat karena perkawinan; kemungkinan yang lebih luas dicatat dalam catatan kaki.
- source_word: עָלוּ
  choice: berangkat
  rationale: עלה secara harfiah berarti ‘naik/pergi naik’. Dalam konteks perpindahan geografis ini, ‘berangkat’ terdengar alami tanpa meniadakan arah perjalanan yang dijelaskan oleh tujuannya.
- source_word: מֵעִיר הַתְּמָרִים
  choice: dari Kota Pohon Kurma
  rationale: Ungkapan Ibrani secara harfiah adalah ‘Kota Pohon Kurma’. Julukan geografis itu dipertahankan, sementara identifikasinya yang lazim dengan Yerikho diberikan dalam catatan kaki.
- source_word: אֶת בְּנֵי יְהוּדָה
  choice: bersama keturunan Yehuda
  rationale: אֶת di sini dipahami secara asosiatif, ‘bersama’, dan בְּנֵי menunjuk pada keturunan atau kelompok suku Yehuda.
- source_word: מִדְבַּר יְהוּדָה
  choice: menuju padang gurun Yehuda
  rationale: Frasa ini menyatakan daerah tujuan. ‘Menuju’ menyampaikan gerak ke tempat tersebut secara alami tanpa memaksakan apakah mereka baru sampai di batasnya atau masuk jauh ke dalamnya.
- source_word: אֲשֶׁר בְּנֶגֶב עֲרָד
  choice: yang terletak di Negeb Arad
  rationale: נֶגֶב dapat berarti wilayah Negeb atau daerah selatan. Bentuk ‘Negeb Arad’ mempertahankan corak nama geografis dan hubungan konstruksi Ibraninya.
- source_word: וַיֵּלֶךְ וַיֵּשֶׁב
  choice: Lalu ia pergi dan menetap
  rationale: Kedua verba berbentuk tunggal maskulin. Bentuk tunggal dipertahankan, meskipun subjek sebelumnya jamak, agar pergeseran gramatikal dalam teks Masoret tidak diselaraskan secara diam-diam.
- source_word: אֶת הָעָם
  choice: bersama bangsa itu
  rationale: אֶת dipahami secara asosiatif dan הָעָם secara harfiah berarti ‘bangsa itu/kaum itu’. Acuannya tidak dipastikan dalam teks utama.
theological_decisions:
- issue: Acuan bentuk tunggal pada וַיֵּלֶךְ וַיֵּשֶׁב
  choice: Dipertahankan sebagai ‘ia’
  alternative: ‘mereka’
  rationale: Teks Masoret memakai bentuk tunggal. Terjemahan tidak mengharmoniskannya dengan subjek jamak sebelumnya; kemungkinan bahwa kaum Keni dipandang sebagai satu kesatuan kolektif dijelaskan dalam catatan kaki.
- issue: Identitas הָעָם (‘bangsa itu’)
  choice: Dibiarkan tidak ditentukan
  alternative: Menafsirkannya secara eksplisit sebagai Yehuda atau memakai bacaan ‘Amalek’
  rationale: Teks Masoret tidak menyebut identitas bangsa itu secara eksplisit. Menentukan acuannya dalam teks utama akan menghilangkan ambiguitas asli.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Istilah geografis ‘Negeb’ dan julukan ‘Kota Pohon Kurma’ dipertahankan. Pergeseran dari subjek jamak ke verba tunggal serta ketidakjelasan acuan ‘bangsa itu’ sengaja tidak diperhalus.
