base_translation:
  language: en
  yaml_path: translation/ot/judges/001/018.yaml
  text: Judah captured Gaza and its territory[a], Ashkelon and its territory, and Ekron and its territory.
translation:
  language: id
  text: Yehuda merebut Gaza beserta wilayahnya,[a] Askelon beserta wilayahnya, dan Ekron beserta wilayahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “batasnya” pada setiap kemunculan kata “wilayahnya”; istilah Ibrani ini dapat berarti batas ataupun wilayah yang berada di dalam batas tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: merebut
  rationale: Kata kerja לכד dalam konteks penaklukan militer berarti merebut atau menguasai kota dengan kekuatan; “merebut” alami dan tepat dalam bahasa Indonesia.
- source_word: יְהוּדָה
  choice: Yehuda
  rationale: Nama ini dipakai secara korporatif untuk suku Yehuda. Teks mempertahankan bentuk nama tanpa menambahkan “suku”, yang tidak dinyatakan secara eksplisit.
- source_word: גְּבוּלָהּ
  choice: wilayahnya
  rationale: גְּבוּל dapat berarti batas atau daerah yang dibatasi. Dalam daftar kota yang ditaklukkan, “wilayahnya” secara alami menunjuk pada daerah di bawah kota tersebut, sambil mempertahankan alternatif “batasnya” dalam catatan kaki.
- source_word: עַזָּה
  choice: Gaza
  rationale: Bentuk nama tempat yang baku dan dikenal dalam bahasa Indonesia.
- source_word: אַשְׁקְלוֹן
  choice: Askelon
  rationale: Transliterasi nama tempat yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: עֶקְרוֹן
  choice: Ekron
  rationale: Transliterasi langsung dan lazim bagi nama tempat tersebut.
theological_decisions: []
