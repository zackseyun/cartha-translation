  text: They gave Hebron to Caleb[a], as Moses had said, and he drove out from there the three sons of Anak.
translation:
  language: id
  text: Mereka memberikan Hebron kepada Kaleb, seperti yang telah Musa katakan, lalu Kaleb mengusir dari sana ketiga anak Enak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “ketiga keturunan Enak” atau “ketiga orang Enak.” Secara harfiah: “ketiga putra Enak.” Ungkapan ini dapat menunjuk kepada keturunan atau anggota kaum Enak, bukan hanya anak kandung langsung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: Mereka memberikan
  rationale: Bentuk wayyiqtol dari נתן menyatakan tindakan lampau dalam rangkaian narasi. Kata sambung waw diungkapkan melalui alur kalimat tanpa harus diterjemahkan secara kaku sebagai “dan”.
- source_word: לְכָלֵב
  choice: kepada Kaleb
  rationale: Preposisi ל menandai penerima; nama pribadi disesuaikan dengan bentuk Indonesia yang lazim.
- source_word: אֶת חֶבְרוֹן
  choice: Hebron
  rationale: אֶת menandai objek langsung, sedangkan חֶבְרוֹן adalah nama tempat. Nama tempat saja sudah jelas tanpa menambahkan kata “kota”.
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: seperti yang telah dikatakan Musa
  rationale: כַּאֲשֶׁר berarti “seperti/sebagaimana,” dan דִּבֶּר berarti “berkata/berbicara.” Bentuk “telah dikatakan” menunjukkan bahwa perkataan Musa mendahului peristiwa ini tanpa memperkuatnya menjadi “dijanjikan.”
- source_word: וַיּוֹרֶשׁ
  choice: lalu Kaleb mengusir
  rationale: Bentuk Hifil dari ירש di sini berarti membuat pihak lain kehilangan tempatnya, yakni “mengusir” atau “menyingkirkan.” Nama Kaleb diulang agar subjek tidak keliru dipahami sebagai Musa, anteseden terdekat dalam bahasa Indonesia.
- source_word: מִשָּׁם
  choice: dari sana
  rationale: Ungkapan ini menunjuk kembali kepada Hebron dan dipertahankan secara alami dalam bahasa Indonesia.
- source_word: אֶת שְׁלֹשָׁה בְּנֵי הָעֲנָק
  choice: ketiga anak laki-laki Enak
  rationale: בְּנֵי secara harfiah berarti “anak-anak laki-laki dari.” Bentuk ini dipertahankan dalam teks utama, sementara kemungkinan makna keturunan atau anggota kelompok suku dicatat dalam catatan kaki.
