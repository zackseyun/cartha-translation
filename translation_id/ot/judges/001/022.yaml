  text: וַ/יַּעֲל֧וּ בֵית יוֹסֵ֛ף גַּם הֵ֖ם בֵּֽית אֵ֑ל וַֽ/יהוָ֖ה עִמָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/022.yaml
  text: The house of Joseph also went up against Bethel[a], and Yahweh was with them.
translation:
  language: id
  text: Keturunan Yusuf juga maju menyerang Betel[a], dan Yahweh menyertai mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “maju ke Betel.” Kata kerja Ibraninya secara harfiah berarti “naik,” tetapi dalam konteks militer ini kemungkinan besar berarti bergerak maju untuk menyerang kota itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: maju menyerang
  rationale: Secara harfiah berarti “naik”, tetapi dalam konteks gerakan militer menuju sebuah kota, ungkapan ini menyatakan gerak maju untuk menyerang. Pilihan ini wajar dalam bahasa Indonesia dan mempertahankan konteks permusuhan.
- source_word: בֵית יוֹסֵף
  choice: keturunan Yusuf
  rationale: Secara harfiah “kaum/rumah Yusuf”; dalam konteks suku Israel, frasa ini menunjuk pada kelompok keturunan Yusuf. “Keturunan Yusuf” lebih jelas bagi pembaca Indonesia modern tanpa mempersempit rujukannya.
- source_word: גַּם הֵם
  choice: juga
  rationale: Menambahkan tindakan kelompok Yusuf pada rangkaian penaklukan sebelumnya; “juga” menyampaikan fungsi aditifnya secara alami.
- source_word: בֵּית אֵל
  choice: Betel
  rationale: Bentuk nama tempat yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi יהוה secara langsung sesuai bukti teks sumber.
- source_word: עִמָּם
  choice: menyertai mereka
  rationale: Ungkapan “bersama mereka” dalam konteks ini menyatakan kehadiran dan dukungan ilahi. “Menyertai mereka” alami dalam bahasa Indonesia dan tidak menjelaskan lebih jauh daripada teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama diri itu, bukan menggantinya dengan gelar.
- issue: Makna kehadiran ilahi dalam עִמָּם
  choice: menyertai mereka
  alternative: berpihak kepada mereka
  rationale: “Menyertai” mempertahankan cakupan kehadiran sekaligus dukungan ilahi tanpa mempersempitnya hanya menjadi keberpihakan militer.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. “Keturunan Yusuf” dipilih agar istilah kesukuan dipahami pembaca umum; ambiguitas arah gerak versus serangan dipertahankan dalam catatan kaki.
