  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִ֤י יְהוָה֙ אֶתּ יְהוּדָ֔ה וַ/יֹּ֖רֶשׁ אֶת הָ/הָ֑ר כִּ֣י לֹ֤א לְ/הוֹרִישׁ֙ אֶת יֹשְׁבֵ֣י הָ/עֵ֔מֶק כִּי רֶ֥כֶב בַּרְזֶ֖ל לָ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/019.yaml
  text: And Yahweh was with Judah[a], and he took possession of the hill country; but he could not drive out the inhabitants of the valley, because they had iron chariots.
translation:
  language: id
  text: Yahweh menyertai Yehuda. Yehuda pun merebut daerah perbukitan, tetapi tidak dapat menghalau penduduk lembah[a] karena mereka memiliki kereta-kereta besi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dataran rendah”; istilah Ibrani ini dapat menunjuk kawasan lembah yang luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri sesuai bentuk YHWH dan gaya proyek.
- source_word: אֶת־יְהוּדָה
  choice: menyertai Yehuda
  rationale: אֵת di sini menyatakan penyertaan. 'Yehuda' secara metonimis menunjuk kepada suku Yehuda tanpa perlu menambah kata 'suku' dalam teks.
- source_word: וַיֹּרֶשׁ
  choice: merebut
  rationale: Bentuk Hifil ירש diikuti objek wilayah menyatakan pengambilalihan atau pendudukan. 'Merebut' alami dalam bahasa Indonesia dan sesuai dengan daerah perbukitan sebagai objek.
- source_word: הָהָר
  choice: daerah perbukitan
  rationale: Dalam konteks geografis, istilah ini menunjuk kawasan dataran tinggi, bukan satu gunung tertentu.
- source_word: כִּי לֹא לְהוֹרִישׁ
  choice: tetapi tidak dapat menghalau
  rationale: Klausa Ibrani bersifat eliptis. Konteks dan alasan yang menyusul mendukung makna ketidakberhasilan atau ketidakmampuan, sementara 'tetapi' menyatakan kontras dengan keberhasilan sebelumnya.
- source_word: יֹשְׁבֵי הָעֵמֶק
  choice: penduduk lembah
  rationale: Padanan ringkas dan alami untuk konstruksi partisipial 'orang-orang yang mendiami lembah'.
- source_word: עֵמֶק
  choice: lembah
  rationale: Ini padanan dasar yang wajar, tetapi kemungkinan makna kawasan dataran rendah yang luas dipertahankan dalam catatan kaki.
- source_word: רֶכֶב בַּרְזֶל לָהֶם
  choice: karena mereka memiliki kereta-kereta besi
  rationale: Ungkapan dengan לָהֶם menyatakan kepemilikan. Bentuk jamak 'kereta-kereta' sesuai makna kolektif רֶכֶב dan jelas bagi pembaca modern.
theological_decisions:
- issue: Subjek dan implikasi ketidakmampuan dalam klausa kedua
  choice: 'Klausa dipahami sebagai ketidakmampuan Yehuda: ''tetapi tidak dapat menghalau penduduk lembah''.'
  alternative: Menerjemahkan secara lebih harfiah dan eliptis sebagai 'tetapi tidak menghalau penduduk lembah', atau menafsirkan ulang agar tidak terkesan ada ketidakmampuan ketika Yahweh menyertai Yehuda.
  rationale: Alur sintaksis paling wajar menjadikan Yehuda subjek yang berlanjut, dan klausa tentang kereta besi memberi alasan bagi kegagalannya. Ketegangan dengan pernyataan bahwa Yahweh menyertai Yehuda dipertahankan, bukan diselesaikan secara teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Subjek 'Yehuda' diulang pada kalimat kedua agar rujukan pronominal tidak rancu dengan Yahweh. Istilah geografis diterjemahkan secara kontekstual, dan ketegangan teologis teks dipertahankan.
