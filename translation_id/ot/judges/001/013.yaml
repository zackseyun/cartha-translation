  text: וַֽ/יִּלְכְּדָ/הּ֙ עָתְנִיאֵ֣ל בֶּן קְנַ֔ז אֲחִ֥י כָלֵ֖ב הַ/קָּטֹ֣ן מִמֶּ֑/נּוּ וַ/יִּתֶּן ל֛/וֹ אֶת עַכְסָ֥ה בִתּ֖/וֹ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/013.yaml
  text: Othniel son of Kenaz[a], Caleb’s younger brother, captured it, and he gave him his daughter Achsah as a wife.
translation:
  language: id
  text: Otniel anak Kenas[a], adik laki-laki Kaleb, merebut kota itu. Lalu Kaleb memberikan Akhsa, putrinya, kepadanya sebagai istri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “Otniel anak Kenas, kerabat Kaleb yang lebih muda.” Susunan Ibraninya paling wajar berarti “saudara laki-laki Kaleb, yang lebih muda daripadanya,” tetapi istilah “saudara” dapat pula dipahami dalam arti kekerabatan yang lebih luas.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּלְכְּדָהּ
  choice: merebut kota itu
  rationale: Kata kerja לכד dalam konteks militer berarti merebut atau menaklukkan. Akhiran pronominal feminin tunggal merujuk pada kota yang disebut dalam ayat sebelumnya; penyebutan eksplisit 'kota itu' membuat rujukannya jelas dalam bahasa Indonesia.
- source_word: עָתְנִיאֵל
  choice: Otniel
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: בֶּן קְנַז
  choice: anak Kenas
  rationale: Konstruksi genealogis Ibrani בֶּן dipertahankan secara langsung dan alami.
- source_word: אֲחִי כָלֵב הַקָּטֹן מִמֶּנּוּ
  choice: adik Kaleb
  rationale: Secara paling alami frasa ini berarti 'saudara laki-laki Kaleb yang lebih muda daripadanya'. 'Adik Kaleb' mengungkapkan hubungan dan perbandingan usia itu secara ringkas; kemungkinan bahwa istilah kekerabatan dipakai lebih luas dicatat dalam catatan kaki.
- source_word: וַיִּתֶּן לוֹ
  choice: Lalu Kaleb memberikan ... kepadanya
  rationale: Subjek yang tersirat ialah Kaleb dan penerimanya ialah Otniel. Nama Kaleb dieksplisitkan agar pergantian pelaku jelas dan tidak menghasilkan rangkaian pronomina yang rancu dalam bahasa Indonesia.
- source_word: עַכְסָה
  choice: Akhsa
  rationale: Nama diri ditransliterasikan dalam bentuk yang alami bagi pembaca Indonesia dan cukup dekat dengan bunyi Ibrani.
- source_word: בִתּוֹ
  choice: putrinya
  rationale: Bentuk posesif merujuk kepada Kaleb; struktur aposisi 'Akhsa, putrinya' alami dan jelas dalam bahasa Indonesia.
- source_word: לְאִשָּׁה
  choice: sebagai istri
  rationale: Ungkapan ini menyatakan pemberian dalam perkawinan. 'Sebagai istri' mempertahankan bentuk dan makna idiom Ibrani tanpa ungkapan arkais.
theological_decisions:
- issue: Hubungan kekerabatan Otniel dengan Kaleb
  choice: Otniel disebut adik Kaleb dalam teks utama.
  alternative: Otniel dapat dipahami sebagai kerabat laki-laki Kaleb yang lebih muda; sebagian penafsiran juga menganggap susunan ini menyebut Otniel sebagai anak dari adik Kaleb.
  rationale: Susunan Ibrani paling wajar dibaca 'saudara Kaleb, yang lebih muda daripadanya'. Namun, אָח dapat digunakan lebih luas untuk kerabat atau anggota kelompok kekerabatan, dan hubungan unsur-unsur dalam frasa ini telah dipahami secara berbeda. Teks utama mempertahankan pembacaan sintaksis yang paling langsung, sedangkan ketidakpastiannya diaudit dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama pelaku pada klausa kedua dieksplisitkan demi kejelasan, sementara ambiguitas hubungan kekerabatan dipertahankan melalui catatan kaki.
