  text: וַ/יֵּ֤לֶךְ יְהוּדָה֙ אֶת שִׁמְע֣וֹן אָחִ֔י/ו וַ/יַּכּ֕וּ אֶת הַֽ/כְּנַעֲנִ֖י יוֹשֵׁ֣ב צְפַ֑ת וַ/יַּחֲרִ֣ימוּ אוֹתָ֔/הּ וַ/יִּקְרָ֥א אֶת שֵׁם הָ/עִ֖יר חָרְמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/001/017.yaml
  text: Then Judah went with Simeon his brother[a], and they struck down the Canaanites living in Zephath and devoted it to destruction[c][b]; so they called the name of the city Hormah.
translation:
  language: id
  text: Kemudian Yehuda pergi bersama Simeon, saudaranya,[a] dan mereka mengalahkan orang-orang Kanaan yang tinggal di Zefat. Mereka mengkhususkan kota itu untuk dimusnahkan,[b] lalu ia[c] menamai kota itu Horma.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Yehuda dan Simeon di sini mewakili suku-suku yang berasal dari kedua saudara itu.
    reason: cultural_clarification
  - marker: b
    text: Atau “memusnahkan kota itu sama sekali.” Kata Ibrani yang dipakai berarti mengkhususkan sesuatu secara tidak dapat ditarik kembali, sering kali dengan cara memusnahkannya.
    reason: alternative_reading
  - marker: c
    text: Secara harfiah, “ia”. Bentuk tunggal ini kemungkinan menunjuk kepada Yehuda sebagai kelompok atau sebagai pihak yang diwakili oleh seorang pemimpin. Sebagian terjemahan memakai “mereka”.
    reason: grammatical_ambiguity
  - marker: d
    text: Nama Horma terdengar seperti kata Ibrani ḥerem, yaitu sesuatu yang dikhususkan untuk dimusnahkan.
    reason: wordplay
lexical_decisions:
- source_word: וַיֵּלֶךְ יְהוּדָה אֶת שִׁמְעוֹן אָחִיו
  choice: Yehuda pergi bersama Simeon, saudaranya
  rationale: הלך berarti ‘pergi’, sedangkan אֶת dalam konstruksi ini menyatakan penyertaan. ‘Bersama’ menyampaikan hubungan itu secara alami tanpa menambahkan gagasan bahwa Yehuda berperang melawan Simeon. Nama-nama itu juga dapat mewakili suku masing-masing.
- source_word: וַיַּכּוּ
  choice: mereka menewaskan
  rationale: Dalam konteks peperangan, נכה menyatakan tindakan memukul atau menyerang hingga pihak lawan tewas atau dikalahkan. ‘Menewaskan’ mempertahankan daya kekerasan kata tersebut dan sesuai dengan tindakan pemusnahan yang menyusul.
- source_word: הַכְּנַעֲנִי
  choice: orang-orang Kanaan
  rationale: Bentuk Ibraninya tunggal kolektif, tetapi kata kerja jamak dan konteksnya menunjukkan suatu kelompok penduduk; karena itu bentuk jamak alami dalam bahasa Indonesia digunakan.
- source_word: יוֹשֵׁב צְפַת
  choice: yang tinggal di Zefat
  rationale: Partisipel ישב menunjuk kepada mereka yang menetap atau tinggal di tempat itu. ‘Yang tinggal di’ jelas dan wajar dalam bahasa Indonesia modern.
- source_word: וַיַּחֲרִימוּ אוֹתָהּ
  choice: mereka mengkhususkan kota itu untuk dimusnahkan
  rationale: Bentuk Hifil חרם mencakup tindakan menyerahkan atau mengkhususkan sesuatu secara tidak dapat ditarik kembali, biasanya melalui pemusnahan. Rumusan ini mempertahankan unsur pengkhususan dan unsur kehancuran.
- source_word: וַיִּקְרָא אֶת שֵׁם הָעִיר
  choice: lalu ia menamai kota itu
  rationale: Kata kerja וַיִּקְרָא berbentuk tunggal. ‘Ia menamai kota itu’ mempertahankan bentuk tersebut sekaligus mengungkapkan rumus penamaan Ibrani secara alami.
- source_word: חָרְמָה
  choice: Horma
  rationale: Nama tempat ini ditransliterasikan dalam bentuk Indonesia yang lazim. Hubungan bunyinya dengan akar חרם diterangkan dalam catatan kaki.
theological_decisions:
- issue: Makna חרם dalam konteks perang
  choice: mengkhususkan kota itu untuk dimusnahkan
  alternative: memusnahkan kota itu sama sekali; menempatkan kota itu di bawah larangan
  rationale: Kata Ibrani ini mengandung ketegangan antara pengkhususan yang tidak dapat ditarik kembali dan pemusnahan. Terjemahan utama mempertahankan kedua segi itu dan tidak mereduksinya menjadi tindakan militer biasa.
- issue: Subjek tunggal dalam וַיִּקְרָא setelah rangkaian tindakan jamak
  choice: ia menamai
  alternative: mereka menamai
  rationale: Teks Masoret memakai kata kerja tunggal. ‘Ia’ kemungkinan menunjuk kepada Yehuda sebagai tokoh kolektif atau wakil, tetapi terjemahan tidak mengubah bentuk tunggal itu menjadi jamak.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan bermartabat digunakan. Struktur naratif dibuat lancar, sedangkan bentuk tunggal pada tindakan penamaan dan nuansa teknis-teologis חרם dipertahankan serta dijelaskan melalui catatan kaki.
