  text: וַ/יָּבֹ֣א גִ֠דְעוֹן וּ/מֵאָה אִ֨ישׁ אֲשֶׁר אִתּ֜/וֹ בִּ/קְצֵ֣ה הַֽ/מַּחֲנֶ֗ה רֹ֚אשׁ הָ/אַשְׁמֹ֣רֶת הַ/תִּֽיכוֹנָ֔ה אַ֛ךְ הָקֵ֥ם הֵקִ֖ימוּ אֶת הַ/שֹּֽׁמְרִ֑ים וַֽ/יִּתְקְעוּ֙ בַּ/שּׁ֣וֹפָר֔וֹת וְ/נָפ֥וֹץ הַ/כַּדִּ֖ים אֲשֶׁ֥ר בְּ/יָדָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/019.yaml
  text: So Gideon and the hundred men who were with him came to the edge of the camp at the beginning of the middle watch[a], just as they had posted the watchmen[c][b]; and they blew the trumpets and smashed the jars that were in their hands.
translation:
  language: id
  text: Gideon dan seratus orang yang bersamanya tiba di tepi perkemahan pada awal giliran jaga tengah malam[a], tepat ketika para penjaga baru saja ditempatkan. Lalu mereka meniup sangkakala[b] dan memecahkan tempayan-tempayan yang ada di tangan mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “giliran jaga malam bagian tengah” atau “giliran jaga kedua.” Bahasa Ibrani menunjuk pada salah satu pembagian waktu malam.
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: syofar, yaitu tanduk yang digunakan sebagai alat tiup untuk memberi isyarat.'
    reason: cultural_note
lexical_decisions:
- source_word: בִּקְצֵה הַמַּחֲנֶה
  choice: di tepi perkemahan
  rationale: קָצֶה menunjuk pada ujung atau batas. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran ruang dalam teks.
- source_word: רֹאשׁ הָאַשְׁמֹרֶת הַתִּיכוֹנָה
  choice: pada awal giliran jaga tengah malam
  rationale: רֹאשׁ secara idiomatis berarti awal suatu kurun, sedangkan אַשְׁמֹרֶת הַתִּיכוֹנָה adalah giliran jaga malam bagian tengah. Penambahan 'malam' memperjelas pembagian waktu yang dimaksud.
- source_word: אַךְ הָקֵם הֵקִימוּ אֶת הַשֹּׁמְרִים
  choice: tepat ketika para penjaga baru saja ditempatkan
  rationale: אַךְ di sini menandai ketepatan atau kedekatan waktu, dan konstruksi infinitif absolut dengan verba finit menekankan tindakan menempatkan penjaga. Bentuk pasif alami dalam bahasa Indonesia serta tidak menentukan secara eksplisit siapa yang menempatkan mereka.
- source_word: וַיִּתְקְעוּ בַּשּׁוֹפָרוֹת
  choice: mereka meniup sangkakala
  rationale: שׁוֹפָר adalah tanduk yang dipakai sebagai alat tiup untuk memberi isyarat. 'Sangkakala' merupakan padanan Indonesia yang bermartabat dan lazim dalam konteks Alkitab; rincian bendanya dijelaskan dalam catatan kaki.
- source_word: וְנָפוֹץ הַכַּדִּים
  choice: dan memecahkan tempayan-tempayan
  rationale: נפץ menyatakan tindakan memecahkan atau menghancurkan dengan kuat, sedangkan כַּד adalah wadah atau tempayan. Pilihan ini jelas dan tidak menambahkan bahan wadah yang tidak dinyatakan oleh teks.
- source_word: אֲשֶׁר בְּיָדָם
  choice: yang ada di tangan mereka
  rationale: Terjemahan ini mempertahankan ungkapan konkret bahasa Ibrani tanpa memperluasnya menjadi penafsiran.
