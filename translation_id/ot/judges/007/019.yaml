translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Perkemahan', 'giliran jaga', dan 'penjaga' menjaga suasana militer; 'sangkakala' dipertahankan sebagai istilah Alkitab yang dikenal, dengan penjelasan budaya dalam catatan kaki.
