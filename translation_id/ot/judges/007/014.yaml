  - severity: low
    issue: Pilihan 'bin Yoas' dan 'seorang laki-laki Israel' agak kurang netral/idiomatis untuk bahasa Indonesia modern standar.
    rationale: '''Anak Yoas'' dan ''seorang pria Israel'' menyampaikan patronimik serta maskulin singular sumber secara lebih alami tanpa mengubah makna.'
