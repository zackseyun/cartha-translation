base_translation:
  language: en
  yaml_path: translation/ot/judges/007/014.yaml
  text: His companion answered and said[a], “This is nothing other than the sword of Gideon son of Joash, a man of Israel[b]. God has given Midian and the whole camp into his hand.”
translation:
  language: id
  text: Rekannya menjawab, “Ini tidak lain adalah pedang Gideon anak Yoas, seorang pria Israel. Allah telah menyerahkan Midian dan seluruh perkemahan itu ke dalam tangannya.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ke dalam tangannya” adalah ungkapan yang berarti ke dalam kuasa atau kendalinya.
    reason: Menjelaskan idiom Ibrani בְּיָדוֹ tanpa menggantikan ungkapan metaforis dalam teks utama.
lexical_decisions:
- source_word: וַיַּעַן רֵעֵהוּ וַיֹּאמֶר
  choice: Rekannya menjawab
  rationale: Dalam formula dialog naratif Ibrani, gabungan harfiah ‘menjawab dan berkata’ terasa berulang dalam bahasa Indonesia modern. ‘Rekannya menjawab’ menyampaikan tindakan tutur secara alami, sedangkan ‘rekan’ sesuai dengan konteks sesama anggota pasukan.
- source_word: אֵין זֹאת בִּלְתִּי אִם
  choice: Ini tidak lain adalah
  rationale: Ungkapan ini menyatakan identifikasi yang tegas dan eksklusif; bentuk Indonesia ini alami serta mempertahankan penekanannya.
- source_word: חֶרֶב גִּדְעוֹן
  choice: pedang Gideon
  rationale: Mempertahankan gambaran simbolis yang dipakai untuk menafsirkan mimpi, tanpa menjelaskannya sebagai pasukan atau kuasa Gideon.
- source_word: גִּדְעוֹן בֶּן יוֹאָשׁ
  choice: Gideon bin Yoas
  rationale: ‘Bin’ merupakan bentuk ringkas dan lazim dalam bahasa Indonesia untuk patronimik laki-laki.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: seorang laki-laki Israel
  rationale: Mempertahankan unsur maskulin tunggal איש sekaligus identitas nasional Gideon secara jelas.
- source_word: נָתַן הָאֱלֹהִים
  choice: Allah telah menyerahkan
  rationale: Perfect Ibrani di sini menyatakan hasil yang dipandang sudah pasti berdasarkan penafsiran mimpi. ‘Telah menyerahkan’ alami dalam bahasa Indonesia dan sesuai dengan konteks penyerahan musuh kepada kuasa seseorang.
- source_word: בְּיָדוֹ
  choice: ke dalam tangannya
  rationale: Mempertahankan idiom Ibrani tentang penyerahan kepada tangan seseorang, dengan penjelasan makna dalam catatan kaki.
- source_word: אֶת מִדְיָן וְאֶת כָּל הַמַּחֲנֶה
  choice: Midian dan seluruh perkemahan itu
  rationale: ‘Midian’ dapat menunjuk kelompok musuh, sedangkan הַמַּחֲנֶה menunjuk keseluruhan perkemahan atau pasukan yang berkemah; ‘perkemahan itu’ mempertahankan citra tempat dalam konteks.
theological_decisions:
- issue: Kepastian tindakan Allah dalam bentuk perfect נָתַן
  choice: Allah telah menyerahkan
  alternative: Allah menyerahkan
  rationale: Bentuk perfect dalam ucapan penafsir mimpi dapat menggambarkan kemenangan yang dipandang sudah ditetapkan atau pasti. Bentuk ‘telah’ mempertahankan sudut pandang itu tanpa menambahkan penjelasan tentang mekanisme ketetapan ilahi.
- issue: Identitas Gideon dalam אִישׁ יִשְׂרָאֵל
  choice: seorang laki-laki Israel
  alternative: seorang Israel
  rationale: Teks sumber secara eksplisit memakai nomina maskulin tunggal איש. Terjemahan mempertahankannya tanpa menarik kesimpulan teologis tambahan.
- issue: Metafora ‘pedang Gideon’
  choice: pedang Gideon
  alternative: kekuatan Gideon
  rationale: Metafora dalam penafsiran mimpi dipertahankan sebagaimana teks sumber, sehingga pembaca tidak diarahkan secara sempit kepada satu penjelasan abstrak.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Formula dialog dibuat alami dengan menghindari pengulangan harfiah ‘menjawab dan berkata’. Metafora ‘pedang’ serta idiom ‘ke dalam tangannya’ dipertahankan; idiom kedua dijelaskan dalam catatan kaki.
