  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל גִּדְע֔וֹן רַ֗ב הָ/עָם֙ אֲשֶׁ֣ר אִתָּ֔/ךְ מִ/תִּתִּ֥/י אֶת מִדְיָ֖ן בְּ/יָדָ֑/ם פֶּן יִתְפָּאֵ֨ר עָלַ֤/י יִשְׂרָאֵל֙ לֵ/אמֹ֔ר יָדִ֖/י הוֹשִׁ֥יעָה לִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/002.yaml
  text: And Yahweh said to Gideon[a], “The people who are with you are too many for me to give Midian into their hand, lest Israel boast against me, saying[b], ‘My own hand has saved me.’”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Gideon, “Orang-orang yang bersamamu terlalu banyak bagi-Ku untuk menyerahkan Midian ke dalam kekuasaan mereka[a]. Jangan sampai Israel menyombongkan diri terhadap-Ku dengan berkata, ‘Tanganku sendiri telah menyelamatkan aku[b].’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke dalam tangan mereka.” Dalam teks Ibrani, “tangan” berbentuk tunggal dan merupakan kiasan untuk kuasa atau kendali.
    reason: lexical_alternative
  - marker: b
    text: Atau, “telah melepaskan aku.” Kata kerja Ibrani ini dapat berarti “menyelamatkan” atau “melepaskan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama pribadi ilahi sebagaimana tertulis dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Mengungkapkan alur naratif waw-konsekutif secara wajar; 'berfirman' merupakan pilihan Indonesia yang bermartabat ketika subjeknya Allah.
- source_word: רַב הָעָם אֲשֶׁר אִתָּךְ
  choice: Orang-orang yang bersamamu terlalu banyak
  rationale: Kata רַב secara leksikal berarti banyak, tetapi konteks klausa berikutnya menunjukkan bahwa jumlah itu berlebihan untuk maksud Yahweh.
- source_word: מִתִּתִּי אֶת מִדְיָן בְּיָדָם
  choice: bagi-Ku untuk menyerahkan Midian ke dalam tangan mereka
  rationale: Mempertahankan konstruksi pencegahan dengan מן serta idiom Ibrani 'menyerahkan ke dalam tangan' yang menyatakan penyerahan kepada kuasa atau kendali pihak lain.
- source_word: פֶּן
  choice: Jangan sampai
  rationale: Menyampaikan tujuan atau akibat negatif yang dikhawatirkan dengan bahasa Indonesia modern dan alami.
- source_word: יִתְפָּאֵר עָלַי
  choice: menyombongkan diri terhadap-Ku
  rationale: Bentuk hitpael menyatakan pembanggaan atau peninggian diri, sedangkan עַל memberi nuansa bahwa kesombongan itu diarahkan terhadap Yahweh.
- source_word: יָדִי
  choice: Tanganku sendiri
  rationale: Kata 'sendiri' memperjelas penekanan pada daya Israel sendiri tanpa mengubah citra 'tangan' dalam teks sumber.
- source_word: הוֹשִׁיעָה לִּי
  choice: telah menyelamatkan aku
  rationale: ישׁע berarti menyelamatkan atau melepaskan; 'menyelamatkan' mempertahankan ironi bahwa Israel dapat mengaku sebagai sumber keselamatannya sendiri.
theological_decisions:
- issue: Penyebutan nama ilahi
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Transliterasi ini mempertahankan nama pribadi yang terdapat dalam teks sumber tanpa menggantinya dengan gelar.
- issue: Israel sebagai satu kesatuan kolektif
  choice: Israel ... ‘Tanganku sendiri telah menyelamatkan aku’
  alternative: Orang Israel ... ‘Tangan kami sendiri telah menyelamatkan kami’
  rationale: Teks Ibrani memperlakukan Israel sebagai pribadi kolektif tunggal. Bentuk tunggal dipertahankan agar sudut pandang dan ketegangan retoris sumber tidak diratakan.
- issue: Arah kesombongan Israel
  choice: menyombongkan diri terhadap-Ku
  alternative: membanggakan diri di hadapan-Ku
  rationale: Preposisi עַל mendukung nuansa pertentangan atau klaim yang meninggikan diri terhadap Yahweh, bukan sekadar tindakan yang berlangsung di hadapan-Nya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Idiom tangan dipertahankan karena dapat dipahami dan penting bagi permainan retoris antara 'tangan mereka' dan 'tanganku sendiri'. Bentuk tunggal kolektif untuk Israel juga dipertahankan.
