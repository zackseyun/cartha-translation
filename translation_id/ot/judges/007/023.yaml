  text: וַ/יִּצָּעֵ֧ק אִֽישׁ יִשְׂרָאֵ֛ל מִ/נַּפְתָּלִ֥י וּ/מִן אָשֵׁ֖ר וּ/מִן כָּל מְנַשֶּׁ֑ה וַֽ/יִּרְדְּפ֖וּ אַחֲרֵ֥י מִדְיָֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/023.yaml
  text: And the men of Israel were called out from Naphtali[a], from Asher, and from all Manasseh[c][b], and they pursued Midian.
translation:
  language: id
  text: Orang-orang Israel dikerahkan dari Naftali, dari Asyer, dan dari seluruh Manasye, lalu mereka mengejar Midian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Midian” di sini menunjuk pada pasukan Midian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּעֵק
  choice: dikerahkan
  rationale: Bentuk Nifal dalam konteks pengejaran militer ini paling wajar dipahami sebagai tindakan menghimpun atau mengerahkan pasukan. Pilihan ini lebih sesuai daripada arti harfiah akar katanya, “berseru”.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: orang-orang Israel
  rationale: Walaupun אִישׁ berbentuk tunggal, frasa ini bersifat kolektif; verba jamak berikutnya menegaskan bahwa yang dimaksud ialah sejumlah orang Israel.
- source_word: מִנַּפְתָּלִי
  choice: dari Naftali
  rationale: Preposisi מִן menyatakan asal, dan nama Naftali di sini menunjuk pada suku atau wilayah suku tersebut.
- source_word: וּמִן אָשֵׁר
  choice: dari Asyer
  rationale: Melanjutkan daftar asal kelompok yang dikerahkan; konjungsi Ibrani dinyatakan secara alami melalui susunan daftar bahasa Indonesia.
- source_word: וּמִן כָּל מְנַשֶּׁה
  choice: dan dari seluruh Manasye
  rationale: כָּל menyatakan cakupan menyeluruh. “Seluruh Manasye” mempertahankan tekanannya tanpa menambahkan kata “suku” yang tidak tersurat.
- source_word: וַיִּרְדְּפוּ
  choice: lalu mereka mengejar
  rationale: רדף dalam kisah peperangan berarti mengejar musuh. “Lalu” menyampaikan kesinambungan naratif waw secara alami.
- source_word: אַחֲרֵי מִדְיָן
  choice: Midian
  rationale: Dengan verba “mengejar”, אַחֲרֵי tidak perlu diterjemahkan tersendiri dalam bahasa Indonesia. Midian secara metonimis menunjuk pada pasukan Midian.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bermartabat. “Dikerahkan” dipilih untuk menyampaikan penghimpunan orang-orang Israel bagi pengejaran militer; nama suku mengikuti bentuk Indonesia yang lazim.
