base_translation:
  language: en
  yaml_path: translation/ot/judges/007/025.yaml
  text: And they captured the two princes of Midian[a], Oreb and Zeeb. They killed Oreb at the rock of Oreb, and they killed Zeeb at the winepress of Zeeb. Then they pursued Midian[b], and they brought the heads of Oreb and Zeeb to Gideon from across the Jordan.
translation:
  language: id
  text: Mereka menangkap kedua pemimpin Midian, Oreb dan Zeeb.[a] Mereka membunuh Oreb di Batu Oreb, sedangkan Zeeb mereka bunuh di tempat pemerasan anggur Zeeb. Kemudian mereka mengejar orang Midian dan membawa kepala Oreb dan Zeeb kepada Gideon dari seberang Sungai Yordan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nama Oreb berkaitan dengan kata Ibrani yang berarti “gagak”, dan nama Zeeb berkaitan dengan kata Ibrani yang berarti “serigala”. Keduanya ditampilkan sebagai nama orang dalam teks utama.
    reason: lexical_alternative
  - marker: b
    text: Atau, “dari wilayah seberang Sungai Yordan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי
  choice: pemimpin
  rationale: Kata שַׂר menunjuk pada tokoh berpangkat tinggi, baik sebagai penguasa maupun pemimpin militer. “Pemimpin” jelas dan alami dalam bahasa Indonesia, tanpa menyamakan mereka dengan raja-raja Midian yang disebut kemudian.
- source_word: וַיִּלְכְּדוּ
  choice: menangkap
  rationale: Kata kerja לָכַד dalam konteks peperangan berarti menangkap atau menguasai. “Menangkap” paling tepat karena Oreb dan Zeeb kemudian dibunuh.
- source_word: עֹרֵב
  choice: Oreb
  rationale: Bentuk ini merupakan nama diri dan karena itu ditransliterasikan, meskipun berkaitan dengan kata Ibrani yang berarti “gagak”.
- source_word: זְאֵב
  choice: Zeeb
  rationale: Bentuk ini merupakan nama diri dan karena itu ditransliterasikan, meskipun sama dengan kata Ibrani yang berarti “serigala”.
- source_word: בְּצוּר עוֹרֵב
  choice: di Batu Oreb
  rationale: צוּר berarti batu besar atau gunung batu. “Batu Oreb” mempertahankan bentuk nama tempat dan hubungan namanya dengan Oreb.
- source_word: בְיֶקֶב זְאֵב
  choice: di tempat pemerasan anggur Zeeb
  rationale: יֶקֶב adalah tempat atau wadah untuk memeras anggur. Ungkapan ini mudah dipahami pembaca modern dan tetap mempertahankan hubungan nama tempat tersebut dengan Zeeb.
- source_word: וַיִּרְדְּפוּ אֶל מִדְיָן
  choice: Kemudian mereka mengejar orang Midian
  rationale: Dalam konteks ini “Midian” merujuk secara kolektif kepada pasukan atau orang Midian. Penambahan “orang” menghasilkan bahasa Indonesia yang alami dan menghindari kesan bahwa yang dikejar adalah suatu tempat.
- source_word: וְרֹאשׁ עֹרֵב וּזְאֵב
  choice: kepala Oreb dan Zeeb
  rationale: 'Walaupun רֹאשׁ berbentuk tunggal, dua nama yang dikoordinasikan memberi makna distributif: kepala masing-masing tokoh. Bahasa Indonesia secara alami memakai “kepala Oreb dan Zeeb” tanpa harus menandai bentuk jamak.'
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: dari seberang Sungai Yordan
  rationale: Preposisi מִן mendukung arti “dari”, sedangkan עֵבֶר menunjuk wilayah di sisi lain sungai. “Sungai Yordan” memperjelas nama geografis bagi pembaca umum.
