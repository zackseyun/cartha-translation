  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יְהִי֙ בַּ/לַּ֣יְלָה הַ/ה֔וּא וַ/יֹּ֤אמֶר אֵלָי/ו֙ יְהוָ֔ה ק֖וּם רֵ֣ד בַּֽ/מַּחֲנֶ֑ה כִּ֥י נְתַתִּ֖י/ו בְּ/יָדֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/009.yaml
  text: And it happened that night that Yahweh said to him[a], “Arise, go down into the camp, for I have given it into your hand.”
translation:
  language: id
  text: Pada malam itu, Yahweh berfirman kepadanya, “Bangunlah, turunlah ke perkemahan itu, sebab Aku telah menyerahkannya ke dalam tanganmu[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “ke dalam tanganmu”; sebuah ungkapan Ibrani yang berarti “ke dalam kuasa atau kendalimu.”'
    reason: Menjelaskan idiom Ibrani sambil mempertahankan bentuk harfiahnya dalam teks utama.
lexical_decisions:
- source_word: וַיְהִי בַּלַּיְלָה הַהוּא
  choice: Pada malam itu
  rationale: Bentuk וַיְהִי membuka adegan naratif baru, sedangkan frasa berikutnya menetapkan waktunya. Dalam bahasa Indonesia modern, fungsi keduanya tersampaikan secara alami melalui pembuka “Pada malam itu” tanpa ungkapan kaku “terjadilah”.
- source_word: וַיֹּאמֶר אֵלָיו
  choice: berfirman kepadanya
  rationale: אמר berarti “berkata”; ketika subjeknya Yahweh dan isinya merupakan perkataan ilahi, “berfirman” merupakan padanan Indonesia yang wajar, ringkas, dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” dan tidak diganti dengan sebuah gelar.
- source_word: קוּם
  choice: Bangunlah
  rationale: Imperatif ini memanggil Gideon untuk segera bangkit dan bertindak. “Bangunlah” alami dalam bahasa Indonesia dan mempertahankan nada perintah.
- source_word: רֵד
  choice: turunlah
  rationale: ירד menyatakan gerak turun dan sesuai dengan konteks topografis serta militer.
- source_word: בַּמַּחֲנֶה
  choice: ke perkemahan itu
  rationale: Dengan kata kerja gerak רֵד, preposisi בְּ menyatakan tujuan gerakan. “Ke perkemahan itu” lebih alami daripada “ke dalam perkemahan” dan tidak menambahkan gagasan “menyerang” yang tidak dinyatakan secara eksplisit.
- source_word: כִּי
  choice: sebab
  rationale: Partikel ini memperkenalkan alasan bagi perintah sebelumnya.
- source_word: נְתַתִּיו
  choice: Aku telah menyerahkannya
  rationale: Bentuk perfektif נתן menggambarkan penyerahan sebagai keputusan ilahi yang sudah pasti atau tuntas. Sufiks maskulin tunggal dipertahankan sebagai “-nya”, dengan perkemahan mewakili pasukan musuh secara metonimis.
- source_word: בְּיָדֶךָ
  choice: ke dalam tanganmu
  rationale: Terjemahan ini mempertahankan idiom Ibrani yang menggambarkan penyerahan ke dalam kuasa atau kendali seseorang; maknanya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama tersebut, bukan menggantinya dengan gelar.
- issue: Aspek נְתַתִּיו dalam janji kemenangan
  choice: Aku telah menyerahkannya
  alternative: Aku akan menyerahkannya
  rationale: Bentuk perfektif menyajikan tindakan itu sebagai sudah ditetapkan atau terlaksana dari sudut pandang perkataan ilahi. Bentuk lampau perfektif dipertahankan agar kepastian retoris ini tidak diubah menjadi sekadar janji masa depan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Bentuk perintah memakai partikel -lah; kata ganti ilahi “Aku” ditulis dengan huruf kapital. Idiom “ke dalam tanganmu” dipertahankan untuk menjaga citra teks sumber dan dijelaskan lewat catatan kaki.
