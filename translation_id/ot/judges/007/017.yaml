translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina 'aku' sesuai dengan ucapan langsung seorang pemimpin kepada pasukannya; bentuk imperatif '-lah' mempertahankan nada instruktif. Pengulangan sumber dipertahankan karena menekankan bahwa tindakan Gideon harus menjadi pola mereka.
