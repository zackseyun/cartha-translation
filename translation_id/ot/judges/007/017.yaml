  text: And he said to them[a], “Watch me, and do likewise. Behold, when I come to the edge of the camp, then as I do, so you shall do.”
translation:
  language: id
  text: Ia berkata kepada mereka, “Perhatikanlah aku dan lakukanlah demikian. Lihatlah, ketika aku sampai di tepi perkemahan, lakukanlah seperti yang kulakukan.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִמֶּנִּי תִרְאוּ
  choice: Perhatikanlah aku
  rationale: Konstruksi ראה dengan מן dalam konteks instruksi meminta para prajurit mengamati Gideon sebagai contoh untuk ditiru; ungkapan ini alami dalam bahasa Indonesia.
- source_word: וְכֵן תַּעֲשׂוּ
  choice: dan lakukanlah seperti yang kulakukan
  rationale: כֵן menunjuk pada cara atau pola tindakan. Terjemahan eksplisit ini menyampaikan perintah untuk meniru Gideon dengan jelas.
- source_word: וְהִנֵּה
  choice: Ketika
  rationale: Dalam rangkaian instruksi ini, partikel tersebut mengarahkan perhatian kepada keadaan yang segera terjadi. Tidak diterjemahkan secara terpisah agar kalimat Indonesia tetap alami, sementara daya penunjuknya tercakup dalam klausa berikut.
- source_word: אָנֹכִי בָא
  choice: aku tiba
  rationale: Partisipel menyatakan tindakan yang segera berlangsung. Dalam klausa temporal bahasa Indonesia, 'aku tiba' menyampaikan gerak menuju sasaran dan cocok dengan konteks.
- source_word: בִּקְצֵה הַמַּחֲנֶה
  choice: di tepi perkemahan itu
  rationale: קָצֶה berarti ujung atau tepi; 'tepi perkemahan' merupakan padanan yang tepat dan alami.
- source_word: כַאֲשֶׁר אֶעֱשֶׂה כֵּן תַּעֲשׂוּן
  choice: lakukanlah persis seperti yang kulakukan
  rationale: Rumusan ini mempertahankan hubungan pola dan peniruan serta daya perintah dari bentuk verbal Ibrani; 'persis' menegaskan korelasi כַאֲשֶׁר ... כֵּן tanpa menambah tindakan tertentu.
