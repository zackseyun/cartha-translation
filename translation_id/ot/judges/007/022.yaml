language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַֽ/יִּתְקְעוּ֮ שְׁלֹשׁ מֵא֣וֹת הַ/שּׁוֹפָרוֹת֒ וַ/יָּ֣שֶׂם יְהוָ֗ה אֵ֣ת חֶ֥רֶב אִ֛ישׁ בְּ/רֵעֵ֖/הוּ וּ/בְ/כָל הַֽ/מַּחֲנֶ֑ה וַ/יָּ֨נָס הַֽ/מַּחֲנֶ֜ה עַד בֵּ֤ית הַשִּׁטָּה֙ צְֽרֵרָ֔תָ/ה עַ֛ד שְׂפַת אָבֵ֥ל מְחוֹלָ֖ה עַל טַבָּֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/022.yaml
  text: When the three hundred trumpets were blown[a], Yahweh set every man's sword against his companion and against the whole camp, and the camp fled as far as Beth-shittah toward Zererah, as far as the edge of Abel-meholah[d][c][b], by Tabbath.
translation:
  language: id
  text: Ketika mereka meniup tiga ratus sangkakala[a], Yahweh membuat pedang setiap orang berbalik melawan rekannya di seluruh perkemahan[b]. Pasukan itu pun melarikan diri sampai ke Bet-Sita, ke arah Zerera, sampai ke tepi Abel-Mehola[c][d], dekat Tabat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tiga ratus terompet tanduk.” Kata Ibrani שׁוֹפָרוֹת mengacu pada terompet yang terbuat dari tanduk, sering kali tanduk domba jantan.
    reason: lexical_alternative
  - marker: b
    text: Atau “melawan rekannya dan melawan seluruh perkemahan.” Bahasa Ibrani dapat dipahami sebagai pedang setiap orang diarahkan kepada orang-orang lain di perkemahan, atau sebagai serangan dan kepanikan yang menyebar di seluruh perkemahan.
    reason: alternative_reading
  - marker: c
    text: Bet-Sita, Zerera, Abel-Mehola, dan Tabat adalah nama-nama tempat pada jalur pelarian pasukan itu.
    reason: cultural_note
  - marker: d
    text: Atau “batas Abel-Mehola” maupun “tepian Abel-Mehola.” Kata Ibrani yang diterjemahkan “tepi” dapat menunjuk pada tepi, batas, atau tepian suatu wilayah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְקְעוּ ... שְׁלֹשׁ מֵאוֹת הַשּׁוֹפָרוֹת
  choice: Ketika mereka meniup ketiga ratus sangkakala
  rationale: 'Bentuk Ibrani bersifat aktif: mereka meniup. שׁוֹפָר adalah terompet dari tanduk, sering kali tanduk domba jantan; “sangkakala” merupakan istilah Indonesia yang wajar dan sesuai dengan konteks isyarat perang.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi berupa Tetragramaton dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וַיָּשֶׂם ... אֵת חֶרֶב אִישׁ בְּרֵעֵהוּ
  choice: membuat pedang setiap orang berbalik melawan rekannya
  rationale: Ungkapan ini mempertahankan gambaran pedang tiap-tiap orang diarahkan kepada sesamanya, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: וּבְכָל הַמַּחֲנֶה
  choice: di seluruh perkemahan
  rationale: בְּ dapat menunjukkan lingkup kejadian, sehingga frasa ini dipahami sebagai kepanikan dan saling serang yang berlangsung di seluruh perkemahan. Kemungkinan hubungan koordinatif dicatat dalam catatan kaki.
- source_word: וַיָּנָס הַמַּחֲנֶה
  choice: Pasukan itu pun melarikan diri
  rationale: מַחֲנֶה dapat berarti perkemahan atau pasukan. Karena yang melarikan diri adalah orang-orangnya, “pasukan” paling alami dalam kalimat ini.
- source_word: עַד בֵּית הַשִּׁטָּה צְרֵרָתָה
  choice: sampai ke Bet-Sita, ke arah Zerera
  rationale: Akhiran penunjuk arah pada צְרֵרָתָה dinyatakan dengan “ke arah”; kedua nama tempat ditransliterasikan secara wajar ke dalam bahasa Indonesia.
- source_word: שְׂפַת אָבֵל מְחוֹלָה
  choice: tepi Abel-Mehola
  rationale: שָׂפָה secara harfiah berarti bibir, tepi, atau batas. “Tepi” mempertahankan keluasan makna geografis tanpa memastikan bahwa yang dimaksud adalah tepian sungai.
- source_word: עַל טַבָּת
  choice: dekat Tabat
  rationale: עַל di sini kemungkinan menunjukkan letak yang berdekatan dengan Tabat. “Dekat” alami dalam bahasa Indonesia dan tidak menetapkan arah atau titik akhir secara berlebihan.
- source_word: אִישׁ
  choice: setiap orang
  rationale: Bentuk tunggal distributif menekankan bahwa orang-orang dalam pasukan itu masing-masing berbalik menyerang rekannya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai nama diri ilahi secara langsung. Bentuk “Yahweh” mempertahankan fungsi nama perjanjian itu tanpa menggantinya dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Susunan kalimat mempertahankan tindakan aktif para peniup sangkakala, tindakan ilahi Yahweh, kekacauan internal pasukan, dan urutan geografis pelarian. Nama tempat disesuaikan dengan ejaan Indonesia tanpa menambahkan identifikasi geografis yang tidak pasti.
