  text: וַ/יִּקְח֣וּ אֶת צֵדָה֩ הָ/עָ֨ם בְּ/יָדָ֜/ם וְ/אֵ֣ת שׁוֹפְרֹֽתֵי/הֶ֗ם וְ/אֵ֨ת כָּל אִ֤ישׁ יִשְׂרָאֵל֙ שִׁלַּח֙ אִ֣ישׁ לְ/אֹֽהָלָ֔י/ו וּ/בִ/שְׁלֹשׁ מֵא֥וֹת הָ/אִ֖ישׁ הֶֽחֱזִ֑יק וּ/מַחֲנֵ֣ה מִדְיָ֔ן הָ֥יָה ל֖/וֹ מִ/תַּ֥חַת בָּ/עֵֽמֶק־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/008.yaml
  text: So they took the provisions of the people in their hands[a], along with their trumpets. And he sent every man of Israel, each to his tent, but retained the three hundred men. And the camp of Midian was below him in the valley.
translation:
  language: id
  text: Mereka mengambil perbekalan milik rakyat itu ke tangan mereka, beserta sangkakala mereka[a]. Kemudian Gideon menyuruh semua laki-laki Israel pergi, masing-masing ke kemahnya, tetapi ia mempertahankan ketiga ratus orang itu. Perkemahan orang Midian berada di bawahnya, di lembah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanduk mereka” atau “tanduk domba jantan mereka”; istilah Ibrani menunjuk pada tanduk yang digunakan sebagai alat tiup pemberi isyarat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: Mereka mengambil
  rationale: Bentuk naratif jamak dari לקח diterjemahkan secara langsung; subjeknya secara kontekstual ialah ketiga ratus orang yang terpilih.
- source_word: צֵדָה הָעָם
  choice: perbekalan rakyat itu
  rationale: צֵדָה mencakup bekal atau persediaan untuk perjalanan maupun keperluan militer, sedangkan הָעָם dipertahankan dengan arti luas 'rakyat', bukan dipersempit menjadi 'pasukan'.
- source_word: בְּיָדָם
  choice: membawanya di tangan mereka
  rationale: Ungkapan konkret Ibrani dipertahankan dalam bahasa Indonesia yang wajar untuk menunjukkan bahwa perbekalan itu kini mereka bawa atau kuasai.
- source_word: שׁוֹפְרֹתֵיהֶם
  choice: sangkakala mereka
  rationale: שׁוֹפָר ialah tanduk yang digunakan sebagai alat tiup pemberi isyarat; 'sangkakala' sesuai dengan konteks militer dan tetap bermartabat.
- source_word: שִׁלַּח
  choice: menyuruh ... pergi
  rationale: Kata kerja tunggal menunjuk kepada Gideon sebagai subjek. Dalam konteks ini, tindakan mengirim berarti menyuruh kelompok lain pergi, tanpa harus menambahkan gagasan pemecatan secara khusus.
- source_word: כָּל אִישׁ יִשְׂרָאֵל ... אִישׁ לְאֹהָלָיו
  choice: semua laki-laki Israel pergi, masing-masing ke kemahnya
  rationale: Bentuk distributif dan rujukan maskulin kepada para prajurit dipertahankan; 'masing-masing ke kemahnya' mencerminkan pengulangan אִישׁ.
- source_word: וּבִשְׁלֹשׁ מֵאוֹת הָאִישׁ הֶחֱזִיק
  choice: tetapi ia mempertahankan ketiga ratus orang itu
  rationale: הֶחֱזִיק di sini berarti tetap memegang atau menahan sebagai pasukan. 'Tetapi' mengungkapkan kontras yang tersirat antara menyuruh yang lain pergi dan mempertahankan ketiga ratus orang.
- source_word: מַחֲנֵה מִדְיָן
  choice: Perkemahan orang Midian
  rationale: Rangkaian konstruksi Ibrani dinyatakan secara alami sebagai perkemahan milik atau yang dihuni pasukan Midian.
- source_word: מִתַּחַת ... בָּעֵמֶק
  choice: di bawah tempatnya, di lembah
  rationale: 'Terjemahan ini mempertahankan hubungan topografis: Gideon berada di tempat yang lebih tinggi dan perkemahan Midian berada di lembah di bawahnya.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama Gideon dinyatakan pada klausa kedua agar pergantian dari subjek jamak ke subjek tunggal jelas bagi pembaca. Susunan klausa tetap dekat dengan alur teks Ibrani, sementara ungkapan yang terlalu kaku disesuaikan agar alami.
