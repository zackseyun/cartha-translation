base_translation:
  language: en
  yaml_path: translation/ot/judges/007/012.yaml
  text: Midian and Amalek and all the people of the East were lying in the valley as numerous as locusts[a], and their camels were without number[b], as the sand on the seashore in abundance.
translation:
  language: id
  text: Orang Midian, orang Amalek, dan semua orang dari Timur[a] terhampar[b] di lembah, sebanyak belalang. Unta mereka tidak terhitung jumlahnya, sebanyak pasir di tepi laut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “semua anak Timur.”'
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani ini secara harfiah berkaitan dengan “jatuh” dan dapat dipahami sebagai “tergeletak” atau “tersebar”; dalam konteks ini kata itu menggambarkan pasukan yang terhampar atau berkemah di lembah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִדְיָן וַעֲמָלֵק וְכָל בְּנֵי קֶדֶם
  choice: Orang Midian, orang Amalek, dan semua orang dari Timur
  rationale: Konjungsi awal diterjemahkan dengan rangkaian yang alami dalam bahasa Indonesia tanpa menambahkan penanda waktu. Nama-nama bangsa dibuat jelas dengan kata 'orang', sedangkan ungkapan harfiah 'anak-anak Timur' dipahami sebagai sebutan etnogeografis.
- source_word: נֹפְלִים
  choice: berkemah tersebar
  rationale: Partisipel נפל secara harfiah dapat berarti 'jatuh/tergeletak', tetapi dalam konteks pasukan di lembah menggambarkan mereka yang telah menempatkan diri dan tersebar dalam perkemahan. Pilihan ini menyampaikan keadaan pasukan secara alami tanpa menghapus citra spasialnya.
- source_word: בָּעֵמֶק
  choice: di lembah
  rationale: Terjemahan langsung dan lazim bagi עֵמֶק dalam konteks geografis ini.
- source_word: כָּאַרְבֶּה לָרֹב
  choice: begitu banyak seperti belalang
  rationale: Perbandingan Ibrani menekankan jumlah pasukan yang luar biasa besar. Susunan ini mempertahankan unsur perbandingan dan penekanan לָרֹב.
- source_word: וְלִגְמַלֵּיהֶם אֵין מִסְפָּר
  choice: Unta mereka tidak terhitung jumlahnya
  rationale: Mengungkapkan idiom harfiah 'tidak ada bilangan' dalam bahasa Indonesia modern sambil mempertahankan gaya hiperbolis.
- source_word: כַּחוֹל שֶׁעַל שְׂפַת הַיָּם לָרֹב
  choice: begitu banyak seperti pasir di tepi laut
  rationale: Mempertahankan perumpamaan Ibrani tentang jumlah yang tak terhitung dan pengulangan penegasan jumlah besar pada akhir ayat.
