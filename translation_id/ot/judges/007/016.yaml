  text: Then he divided the three hundred men into three companies[a], and put trumpets into the hands of all of them, and empty jars[c][b], with torches inside the jars.
translation:
  language: id
  text: Lalu Gideon membagi tiga ratus orang itu menjadi tiga kelompok[a]. Ia memberikan kepada mereka semua sangkakala[b] dan kendi-kendi kosong[c], dengan obor di dalam kendi-kendi itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tiga kepala,” suatu ungkapan yang berarti tiga bagian atau kelompok.
    reason: lexical_alternative
  - marker: b
    text: 'Atau “tanduk domba jantan”; Ibrani: syofar, yaitu tanduk yang digunakan sebagai alat tiup pemberi tanda.'
    reason: lexical_alternative
  - marker: c
    text: Atau “tempayan kosong.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחַץ
  choice: membagi
  rationale: Kata kerja חצה di sini menyatakan pembagian pasukan ke dalam beberapa kelompok; 'membagi' alami dan tepat dalam bahasa Indonesia.
- source_word: שְׁלֹשׁ מֵאוֹת הָאִישׁ
  choice: ketiga ratus orang itu
  rationale: אִישׁ berarti 'orang/laki-laki'; konteksnya memang pasukan Gideon, tetapi 'orang' mempertahankan bentuk sumber tanpa menambahkan sebutan 'prajurit'.
- source_word: שְׁלֹשָׁה רָאשִׁים
  choice: tiga kelompok
  rationale: Secara harfiah berarti 'tiga kepala', tetapi merupakan ungkapan untuk tiga bagian atau kelompok. 'Kelompok' jelas bagi pembaca modern dan tidak terlalu menentukan struktur militernya.
- source_word: וַיִּתֵּן ... בְּיַד כֻּלָּם
  choice: Kepada mereka masing-masing diberikannya
  rationale: 'Bentuk ini menyampaikan tindakan Gideon dan daya distributif frasa ''ke dalam tangan mereka semua'': setiap orang menerima perlengkapan tersebut.'
- source_word: שׁוֹפָרוֹת
  choice: sangkakala
  rationale: שׁוֹפָר adalah alat tiup dari tanduk untuk memberi tanda. 'Sangkakala' merupakan padanan Alkitabiah Indonesia yang bermartabat dan tetap dapat dipahami; bahan tanduk dijelaskan dalam catatan.
- source_word: כַדִּים רֵקִים
  choice: kendi kosong
  rationale: כַּד menunjuk wadah seperti kendi atau tempayan. 'Kendi' ringkas, lazim, dan cocok bagi wadah yang dapat menyembunyikan obor.
- source_word: לַפִּדִים בְּתוֹךְ הַכַּדִּים
  choice: dengan obor di dalam kendi itu
  rationale: Terjemahan ini mempertahankan letak obor di dalam wadah sebagaimana dinyatakan teks Ibrani, tanpa menambahkan penjelasan tentang cara atau tujuannya.
