  text: וַֽ֠/יִּתְקְעוּ שְׁלֹ֨שֶׁת הָ/רָאשִׁ֥ים בַּ/שּֽׁוֹפָרוֹת֮ וַ/יִּשְׁבְּר֣וּ הַ/כַּדִּים֒ וַ/יַּחֲזִ֤יקוּ בְ/יַד שְׂמאוֹלָ/ם֙ בַּ/לַּפִּדִ֔ים וּ/בְ/יַ֨ד יְמִינָ֔/ם הַ/שּׁוֹפָר֖וֹת לִ/תְק֑וֹעַ וַֽ/יִּקְרְא֔וּ חֶ֥רֶב לַֽ/יהוָ֖ה וּ/לְ/גִדְעֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/020.yaml
  text: Then the three companies blew the trumpets and shattered the jars. They held the torches in their left hands and the trumpets in their right hands to blow[a], and they cried out, “A sword for Yahweh and for Gideon!”
translation:
  language: id
  text: Lalu ketiga kelompok itu meniup trompet dan memecahkan tempayan. Mereka memegang obor di tangan kiri dan trompet di tangan kanan untuk meniupnya. Mereka berseru, “Pedang bagi Yahweh dan bagi Gideon!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Pedang Yahweh dan Gideon!”
    reason: Ungkapan Ibrani tanpa verba ini dapat dipahami dengan lebih dari satu cara; alternatif tersebut menyatakan hubungan kepunyaan atau keterkaitan yang tersirat.
lexical_decisions:
- source_word: שְׁלֹשֶׁת הָרָאשִׁים
  choice: ketiga kelompok
  rationale: Dalam konteks pasukan yang dibagi menjadi tiga bagian (Hakim-Hakim 7:16), רָאשִׁים menunjuk pada kelompok atau bagian pasukan, bukan ‘kepala’ secara harfiah.
- source_word: שׁוֹפָרוֹת
  choice: trompet
  rationale: שׁוֹפָר adalah alat tiup dari tanduk yang digunakan untuk memberi tanda. ‘Trompet’ jelas dan alami dalam bahasa Indonesia modern tanpa sekadar mentransliterasikan istilah Ibrani.
- source_word: הַכַּדִּים
  choice: tempayan
  rationale: כַּד menunjuk pada wadah atau bejana. ‘Tempayan’ sesuai dengan wadah yang menyembunyikan obor dalam konteks ini dan tetap mudah dipahami.
- source_word: וַיַּחֲזִיקוּ
  choice: memegang
  rationale: Bentuk Hifil dari חזק di sini menyatakan tindakan memegang benda di tangan; ‘memegang’ alami dan tidak melebihkan unsur kekuatan.
- source_word: בְיַד שְׂמאוֹלָם ... וּבְיַד יְמִינָם
  choice: di tangan kiri ... di tangan kanan
  rationale: 'Bentuk tunggal Ibrani bersifat distributif: setiap orang memegang satu benda di masing-masing tangannya. Ungkapan ini alami dalam bahasa Indonesia.'
- source_word: לַפִּדִים
  choice: obor
  rationale: לַפִּיד menunjuk pada benda pembawa nyala api; ‘obor’ merupakan padanan yang langsung dan lazim.
- source_word: לִתְקֹעַ
  choice: untuk ditiup
  rationale: Infinitif ini menyatakan tujuan atau fungsi trompet yang mereka pegang. Bentuk pasif ‘untuk ditiup’ menghindari kesan bahwa mereka meniupnya terus-menerus sambil tetap memegang obor dan trompet.
- source_word: וַיִּקְרְאוּ
  choice: mereka berseru
  rationale: קרא dalam adegan ini adalah seruan perang yang lantang; ‘berseru’ menangkap daya dan urgensinya.
- source_word: חֶרֶב לַיהוָה וּלְגִדְעוֹן
  choice: Pedang bagi Yahweh dan bagi Gideon!
  rationale: Ungkapan Ibrani ini tanpa verba dan sangat ringkas. ‘Bagi’ mempertahankan fungsi dasar preposisi לְ serta bentuk seruan perang yang padat tanpa menambahkan verba penjelas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan sebuah gelar.
theological_decisions:
- issue: Makna seruan perang חֶרֶב לַיהוָה וּלְגִדְעוֹן
  choice: Pedang bagi Yahweh dan bagi Gideon!
  alternative: Pedang Yahweh dan Gideon!
  rationale: Susunan Ibrani bersifat eliptis dan dapat dipahami sebagai pedang ‘bagi’ Yahweh dan Gideon atau sebagai pedang yang dikaitkan dengan atau menjadi milik mereka. Teks utama mempertahankan preposisi לְ secara lebih langsung, sedangkan kemungkinan yang lebih tradisional dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Urutan tindakan dipertahankan dekat dengan teks Ibrani. Penanda catatan kaki ditempatkan sesudah seruan perang karena catatan menjelaskan ungkapan tersebut.
