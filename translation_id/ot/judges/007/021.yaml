  text: And each man stood in his place around the camp[a], and the whole camp ran, and they shouted and fled.
translation:
  language: id
  text: Setiap orang berdiri di tempatnya di sekeliling perkemahan itu. Lalu seluruh perkemahan itu berlari, berteriak[a], dan melarikan diri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyerukan pekik perang”. Kata Ibrani yang diterjemahkan “berteriak” dapat menunjuk pada seruan keras dalam pertempuran atau kepanikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַמְדוּ
  choice: tetap berdiri
  rationale: Bentuk dari עמד menyatakan berdiri atau mengambil posisi. Dalam konteks ini, “tetap berdiri” menegaskan bahwa pasukan Gideon tidak meninggalkan posisi mereka ketika perkemahan menjadi kacau.
- source_word: אִישׁ תַּחְתָּיו
  choice: setiap orang ... di tempatnya
  rationale: Ungkapan distributif ini berarti masing-masing orang berada pada posisi atau tempatnya sendiri. Terjemahan ini menyampaikan idiom Ibrani secara wajar dalam bahasa Indonesia.
- source_word: סָבִיב לַמַּחֲנֶה
  choice: mengelilingi perkemahan itu
  rationale: סָבִיב dengan ל menunjukkan posisi di sekeliling perkemahan. Bentuk “mengelilingi” alami dalam bahasa Indonesia dan tidak menyiratkan bahwa mereka bergerak.
- source_word: וַיָּרָץ כָּל הַמַּחֲנֶה
  choice: seluruh pasukan di perkemahan berlari
  rationale: Secara harfiah teks menyebut “seluruh perkemahan”, suatu metonimia bagi orang-orang atau pasukan di dalamnya. “Berlari” mempertahankan arti dasar רוץ tanpa menentukan arah atau pola geraknya.
- source_word: וַיָּרִיעוּ
  choice: berteriak
  rationale: Kata kerja ini dapat menunjuk pada seruan keras dalam pertempuran, tanda bahaya, atau kepanikan. “Berteriak” mempertahankan cakupan makna itu tanpa memastikan penyebab teriakan.
- source_word: ויניסו
  choice: melarikan diri
  rationale: Dalam konteks dan menurut pemahaman bentuk dari נוס yang tercermin dalam tradisi terjemahan ayat ini, tindakan tersebut adalah lari meninggalkan tempat karena takut atau kalah. “Melarikan diri” merupakan padanan Indonesia yang jelas dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. “Setiap orang” mempertahankan daya distributif teks, sedangkan “seluruh pasukan di perkemahan” menjelaskan metonimia “seluruh perkemahan” tanpa mengubah pelaku. Penanda catatan kaki ditempatkan langsung sesudah kata yang memiliki alternatif leksikal.
