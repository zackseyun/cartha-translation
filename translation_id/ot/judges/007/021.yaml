  verdict: revise
  source_fidelity: Draf dengan tepat mempertahankan urutan pokok tindakan dan makna dasar “berlari, berteriak, dan melarikan diri.” Namun, “tetap berdiri” menambahkan nuansa bertahan atau terus berada di posisi yang tidak dinyatakan secara eksplisit oleh וַיַּעַמְדוּ. Selain itu, “sedangkan” menciptakan kontras antarklausa yang lebih kuat daripada sambungan naratif Ibrani.
  naturalness: Bahasa draf pada umumnya baku dan jelas. “Di sekeliling perkemahan itu” lebih alami dan lebih tepat sebagai keterangan posisi daripada “mengelilingi perkemahan itu,” yang berpotensi dipahami sebagai tindakan aktif. “Seluruh pasukan di perkemahan” cukup jelas, tetapi “seluruh perkemahan itu” mempertahankan metonimia teks sumber dan tetap dapat dipahami secara wajar dalam gaya naratif.
  terminology: Tidak ada istilah teologis khusus. “Berteiak” merupakan padanan luas yang baik bagi וַיָּרִיעוּ dan catatan kaki mempertahankan kemungkinan “pekik perang” tanpa menghilangkan kemungkinan seruan panik.
