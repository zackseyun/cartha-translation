    rationale: Dua verba Indonesia yang hampir sama berturut-turut membuat arahan sulit dibaca. Verba kedua dapat diterjemahkan “meninggalkan” untuk membedakannya dari “pulang”, sambil catatan kaki mempertahankan ketidakpastian leksikalnya.
  - severity: low
    issue: Penanda catatan kaki a ditempatkan setelah “Gunung Gilead”, bukan sesudah verba yang diterjemahkan “pergi”.
    rationale: Catatan a membahas וְיִצְפֹּר, sedangkan catatan b membahas “Gunung Gilead”; masing-masing penanda perlu melekat pada unsur yang dijelaskannya.
