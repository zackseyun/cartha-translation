base_translation:
  language: en
  yaml_path: translation/ot/judges/007/003.yaml
  text: Please proclaim in the hearing of the people[a], saying, ‘Whoever is fearful and trembling, let him return and depart from Mount Gilead.’ Then twenty-two thousand of the people returned[b], and ten thousand remained.
translation:
  language: id
  text: 'Sekarang, umumkanlah kepada rakyat: “Siapa pun yang takut dan gemetar, hendaklah ia pulang dan meninggalkan[a] Gunung Gilead[b].” Lalu 22.000 orang dari antara rakyat itu pulang, sedangkan 10.000 orang tetap tinggal.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja Ibrani yang diterjemahkan “meninggalkan” (וְיִצְפֹּר) jarang digunakan dan maknanya diperdebatkan; kata itu mungkin menyiratkan pergi lebih awal atau menyelinap pergi.
    reason: lexical_alternative
  - marker: b
    text: “Gunung Gilead” merupakan terjemahan lugas teks Ibrani, tetapi rujukan geografisnya sulit dalam konteks ini. Sebagian orang memahami ungkapan itu secara lebih luas sebagai daerah perbukitan Gilead.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Partikel וְ menghubungkan perintah ini dengan konteks sebelumnya, sedangkan עַתָּה secara eksplisit berarti “sekarang”. Terjemahan ini mempertahankan penanda waktu dalam teks Ibrani.
- source_word: קְרָא נָא בְּאָזְנֵי הָעָם
  choice: umumkanlah kepada rakyat
  rationale: קרא adalah perintah untuk menyampaikan pengumuman, נָא melunakkan permintaan, dan ungkapan harfiah “di telinga rakyat” berarti menyampaikannya agar mereka mendengar. Bentuk “umumkanlah” alami dalam bahasa Indonesia dan tetap mencerminkan perintah publik yang bernada sopan.
- source_word: מִי יָרֵא וְחָרֵד
  choice: Siapa yang takut dan gemetar
  rationale: Kedua istilah itu bersama-sama menggambarkan rasa takut yang disertai kegentaran fisik. “Takut dan gemetar” mempertahankan intensitas ungkapan Ibrani.
- source_word: יָשֹׁב
  choice: hendaklah ia pulang
  rationale: Bentuk yusif ini menyatakan arahan atau izin agar orang yang takut kembali. “Hendaklah” mempertahankan daya direktifnya tanpa menjadikannya sekadar pernyataan masa depan.
- source_word: וְיִצְפֹּר
  choice: dan pergi
  rationale: Kata kerja ini jarang dan maknanya diperdebatkan. Dalam konteks ini, makna intinya ialah meninggalkan barisan atau tempat berkumpul. “Pergi” menyampaikan tindakan tersebut tanpa memastikan nuansa yang tidak pasti; kemungkinan nuansa lain dicatat dalam catatan kaki.
- source_word: מֵהַר הַגִּלְעָד
  choice: dari Gunung Gilead
  rationale: הַר dalam bentuk tunggal paling langsung berarti “gunung”. Rujukan geografisnya sulit dalam konteks ini, sehingga bacaan lugas dipertahankan dalam teks dan persoalannya dijelaskan dalam catatan kaki.
- source_word: וַיָּשָׁב מִן הָעָם עֶשְׂרִים וּשְׁנַיִם אֶלֶף
  choice: Lalu 22.000 orang dari antara rakyat itu pulang
  rationale: Kata kerja tunggal Ibrani diikuti bilangan sebagai subjek kolektif. Susunan Indonesia ini menyampaikan jumlah dan asal kelompok tersebut secara alami.
- source_word: וַעֲשֶׂרֶת אֲלָפִים נִשְׁאָרוּ
  choice: sedangkan 10.000 orang tetap tinggal
  rationale: נשאר berarti tetap ada atau tertinggal. “Tetap tinggal” secara jelas mengontraskan mereka dengan orang-orang yang pulang.
