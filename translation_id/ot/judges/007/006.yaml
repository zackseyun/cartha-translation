  register: Bahasa Indonesia baku modern dengan susunan kalimat yang lugas dan bermartabat. Gambaran tindakan menjilat dipertahankan, sedangkan perbedaan postur kedua kelompok dibuat jelas tanpa menambahkan penilaian atas maknanya.
