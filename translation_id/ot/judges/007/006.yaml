base_translation:
  language: en
  yaml_path: translation/ot/judges/007/006.yaml
  text: And the number of those lapping with their hand to their mouth was three hundred men[a], but all the rest of the people knelt on their knees to drink water.
translation:
  language: id
  text: Jumlah orang yang menjilat air sambil membawa air dengan tangan ke mulut mereka adalah tiga ratus orang[a], sedangkan semua orang selebihnya berlutut untuk minum air.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dari tangan mereka ke mulut mereka.” Frasa Ibrani menekankan bahwa mereka mengangkat air dengan tangan, bukan berlutut untuk minum langsung.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפַּר
  choice: Jumlah
  rationale: Padanan kuantitatif yang langsung dan alami untuk memperkenalkan jumlah kelompok.
- source_word: הַמֲלַקְקִים
  choice: orang yang menjilat air
  rationale: Mempertahankan gambaran konkret dari verba לקק; objek “air” dinyatakan secara wajar dalam bahasa Indonesia berdasarkan konteks.
- source_word: בְּיָדָם אֶל־פִּיהֶם
  choice: dengan membawa tangan ke mulut
  rationale: Menunjukkan bahwa mereka mengangkat air dengan tangan menuju mulut, sekaligus mempertahankan ungkapan distributif tunggal kolektif Ibrani.
- source_word: שְׁלֹשׁ מֵאוֹת אִישׁ
  choice: tiga ratus orang
  rationale: אִישׁ setelah bilangan menunjuk kepada orang-orang dalam kelompok itu; “orang” alami dan tidak mengaburkan konteks pasukan.
- source_word: וְכֹל יֶתֶר הָעָם
  choice: sedangkan semua orang lainnya
  rationale: Konjungsi diterjemahkan secara kontras karena klausa ini membedakan kelompok selebihnya dari tiga ratus orang.
- source_word: כָּרְעוּ עַל בִּרְכֵיהֶם
  choice: berlutut
  rationale: Bahasa Indonesia cukup menyatakan postur tersebut dengan “berlutut”; tambahan harfiah “di atas lutut mereka” akan terasa mubazir.
- source_word: לִשְׁתּוֹת מָיִם
  choice: untuk minum air
  rationale: Mempertahankan tujuan tindakan dan penyebutan eksplisit air.
