  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יּ֥וֹרֶד אֶת הָ/עָ֖ם אֶל הַ/מָּ֑יִם וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל גִּדְע֗וֹן כֹּ֣ל אֲשֶׁר יָלֹק֩ בִּ/לְשׁוֹנ֨/וֹ מִן הַ/מַּ֜יִם כַּ/אֲשֶׁ֧ר יָלֹ֣ק הַ/כֶּ֗לֶב תַּצִּ֤יג אוֹת/וֹ֙ לְ/בָ֔ד וְ/כֹ֛ל אֲשֶׁר יִכְרַ֥ע עַל בִּרְכָּ֖י/ו לִ/שְׁתּֽוֹת־־ס־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/005.yaml
  text: So he brought the people down to the water[a], and Yahweh said to Gideon, “Everyone who laps the water with his tongue, as a dog laps, you shall set apart by himself; likewise everyone who kneels on his knees to drink.”
translation:
  language: id
  text: Lalu Gideon membawa orang-orang itu turun ke air. Yahweh berfirman kepada Gideon, “Setiap orang yang menjilat air dengan lidahnya seperti anjing menjilat, harus kautempatkan secara terpisah[a]. Demikian juga setiap orang yang berlutut untuk minum.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “harus kautempatkan tersendiri”; kata kerja itu dapat berarti menempatkan atau membuat seseorang berdiri pada posisi tersendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹרֶד
  choice: membawa ... turun
  rationale: 'Bentuk Hifil dari ירד bersifat kausatif: Gideon membuat atau membawa orang-orang itu turun. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan unsur kausatifnya.'
- source_word: הָעָם
  choice: orang-orang itu
  rationale: עם menunjuk kelompok secara kolektif. Dalam konteks ini mereka adalah pasukan, tetapi pilihan yang lebih umum mempertahankan keluasan istilah Ibraninya tanpa memberi kesan bahwa seluruh rakyat hadir.
- source_word: אֶל הַמָּיִם
  choice: ke tempat air
  rationale: מים lazim berfungsi sebagai nomina massa. 'Ke tempat air' lebih alami daripada 'ke air' dalam bahasa Indonesia dan tidak secara khusus menambahkan 'tepi' atau 'sumber' yang tidak dinyatakan teks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: כֹּל אֲשֶׁר יָלֹק
  choice: Setiap orang yang menjilat
  rationale: Konstruksi ini bersifat distributif dan menunjuk tiap individu. 'Menjilat' mempertahankan gambaran konkret yang kemudian dibandingkan dengan cara anjing minum.
- source_word: בִּלְשׁוֹנוֹ
  choice: dengan lidahnya
  rationale: Akhiran tunggal maskulin merujuk kepada tiap orang dan dipertahankan secara konkret.
- source_word: מִן הַמַּיִם
  choice: air
  rationale: Preposisi מן menyatakan bahwa air diambil dari tempat air tersebut. Dalam bahasa Indonesia, objek langsung 'menjilat air' menyampaikan makna itu secara alami tanpa tambahan 'sebagian' yang tidak diperlukan.
- source_word: כַּאֲשֶׁר יָלֹק הַכֶּלֶב
  choice: seperti anjing menjilat
  rationale: Perbandingan eksplisit dan gambaran hidup dalam bahasa Ibrani dipertahankan dengan bentuk generik yang alami dalam bahasa Indonesia.
- source_word: תַּצִּיג אוֹתוֹ לְבָד
  choice: harus kautempatkan tersendiri
  rationale: Bentuk Hifil dari יצג berarti menempatkan atau memosisikan, sedangkan לְבָד menyatakan pemisahan. Pilihan ini mempertahankan perintah kepada Gideon dan tindakan pengelompokan.
- source_word: וְכֹל אֲשֶׁר יִכְרַע עַל בִּרְכָּיו לִשְׁתּוֹת
  choice: Demikian juga setiap orang yang berlutut untuk minum
  rationale: '''Berlutut'' secara alami sudah mencakup tindakan bertumpu pada lutut yang dinyatakan secara lebih lengkap dalam bahasa Ibrani. ''Demikian juga'' membuat elipsis perintah bagi kelompok kedua dapat dipahami tanpa mengubah hubungan antarklausa.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Transliterasi 'Yahweh' mempertahankan nama diri dalam teks sumber dan tidak menggantinya dengan gelar atau memasukkan penafsiran denominasi tertentu.
- issue: Perintah bagi kelompok kedua dinyatakan secara eliptis
  choice: Memakai 'Demikian juga' tanpa mengulang perintah
  alternative: Mengulang 'harus kautempatkan tersendiri' bagi kelompok kedua
  rationale: Teks Ibrani secara eksplisit memberi perintah setelah kelompok pertama, lalu menyebut kelompok kedua dengan penghubung. Terjemahan ini menjaga elipsis tersebut sambil memperjelas bahwa ketentuan yang sama berlaku pada kelompok kedua.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk 'kau-' mempertahankan sapaan tunggal kepada Gideon. 'Orang-orang itu' dipilih daripada 'rakyat' atau 'pasukan' agar istilah kolektif sumber tetap umum, sedangkan konteks militernya tetap tersedia dari perikop.
