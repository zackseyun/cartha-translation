  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּשְׁכֵּ֨ם יְרֻבַּ֜עַל ה֣וּא גִדְע֗וֹן וְ/כָל הָ/עָם֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַֽ/יַּחֲנ֖וּ עַל עֵ֣ין חֲרֹ֑ד וּ/מַחֲנֵ֤ה מִדְיָן֙ הָיָה ל֣/וֹ מִ/צָּפ֔וֹן מִ/גִּבְעַ֥ת הַ/מּוֹרֶ֖ה בָּ/עֵֽמֶק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/001.yaml
  text: Then Jerubbaal (that is[a], Gideon) and all the people who were with him rose early and camped by the spring of Harod. The camp of Midian was north of him, by the hill of Moreh in the valley.
translation:
  language: id
  text: Kemudian Yerubaal, yaitu Gideon, dan seluruh rakyat yang menyertainya bangun pagi-pagi lalu berkemah di dekat mata air Harod.[a] Perkemahan Midian berada di sebelah utara Gideon, dekat bukit More, di lembah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di En-Harod.” Nama Ibrani ini memuat kata yang berarti “mata air.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: bangun pagi-pagi
  rationale: Bentuk Hifil dari שׁכם lazim menyatakan bangun atau mulai bergerak pada pagi hari. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan keterangan waktunya.
- source_word: יְרֻבַּעַל הוּא גִדְעוֹן
  choice: Yerubaal, yaitu Gideon
  rationale: Pronomina הוּא berfungsi menjelaskan bahwa Yerubaal adalah Gideon; “yaitu” menyampaikan hubungan aposisional itu secara wajar.
- source_word: וְכָל הָעָם אֲשֶׁר אִתּוֹ
  choice: dan seluruh rakyat yang menyertainya
  rationale: עָם berarti “rakyat/umat/orang-orang.” Walaupun konteksnya militer, teks tidak memakai istilah khusus bagi pasukan, sehingga “rakyat” mempertahankan keluasan istilah sumber.
- source_word: וַיַּחֲנוּ
  choice: lalu berkemah
  rationale: Kata חנה berarti mendirikan kemah atau berkemah. “Lalu” menandai urutan narasi yang dibawa bentuk wayyiqtol.
- source_word: עַל עֵין חֲרֹד
  choice: di dekat mata air Harod
  rationale: עֵין dapat berarti “mata air” sekaligus menjadi unsur nama tempat. Terjemahan ini menyatakan maknanya dengan jelas, sementara bentuk nama tempat alternatif dicatat dalam catatan kaki.
- source_word: וּמַחֲנֵה מִדְיָן
  choice: Perkemahan Midian
  rationale: Frasa konstruksi Ibrani secara langsung berarti perkemahan milik atau yang berkaitan dengan Midian; pilihan ini tidak menambahkan bentuk gentilika yang tidak eksplisit.
- source_word: הָיָה לוֹ מִצָּפוֹן
  choice: berada di sebelah utaranya
  rationale: Sufiks tunggal לוֹ dipertahankan melalui “-nya,” dengan Yerubaal/Gideon sebagai rujukan, alih-alih dilancarkan menjadi bentuk jamak.
- source_word: מִגִּבְעַת הַמּוֹרֶה
  choice: dekat bukit More
  rationale: Dalam keterangan topografis ini, מן dipahami secara lokatif sebagai kedekatan dengan bukit More, bukan harus sebagai gerakan menjauh darinya.
- source_word: בָּעֵמֶק
  choice: di lembah
  rationale: עֵמֶק lazim berarti lembah; padanan langsung ini sesuai dengan keterangan medan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Nama-nama ditransliterasikan dalam bentuk yang lazim bagi pembaca Indonesia. Bentuk tunggal pada keterangan arah dipertahankan tanpa memperjelasnya menjadi jamak.
