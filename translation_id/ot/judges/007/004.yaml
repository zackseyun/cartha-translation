review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan agar padanan mengikuti struktur penetapan dalam Ibrani dengan lebih dekat. Frasa הָעָם adalah “orang-orang itu/bangsa itu,” tanpa tambahan “yang bersamamu”; וְהָיָה memperkenalkan hasil atau ketetapan (“Akan terjadi demikian”), bukan syarat “Jika”; dan bentuk yiqtol diulangi sebagai hasil keputusan ilahi, yang lebih netral diterjemahkan “akan pergi/tidak akan pergi” daripada “harus/tidak boleh.”
  naturalness: Teks revisi tetap menggunakan bahasa Indonesia baku dan lancar. “Bawalah mereka turun ke air” adalah ungkapan yang ringkas dan dekat dengan sumber; pengulangan “dialah yang akan pergi bersamamu” mempertahankan penegasan demonstratif Ibrani tanpa terasa terlalu kaku.
  terminology: “TUHAN” sesuai konvensi Indonesia untuk יהוה. “Menguji” adalah padanan umum dan langsung bagi צרף dalam konteks ini; makna pemilahan melalui ujian tetap tampak dari kelanjutan narasi. Tidak ada istilah teologis atau nama yang perlu diberi catatan kaki.
  issues:
  - severity: medium
    issue: Tambahan “yang bersamamu” pada “rakyat.”
    rationale: Tambahan ini tidak dinyatakan dalam הָעָם. Konteks memang menunjukkan mereka bersama Gideon, tetapi terjemahan tidak perlu menambah pembatas tersebut.
  - severity: medium
    issue: “Jika ...” menggantikan pengantar וְהָיָה.
    rationale: Ibrani menyatakan “dan akan terjadi” sebelum dua penetapan, bukan menyusun kedua pernyataan itu sebagai kalimat bersyarat.
  - severity: medium
    issue: “Harus pergi/tidak boleh pergi” untuk יֵלֵךְ/לֹא יֵלֵךְ.
    rationale: Modalitas kewajiban/larangan adalah penafsiran yang mungkin dalam konteks, tetapi bentuk Ibrani menyatakan hasil atau keputusan dengan bentuk imperfek. “Akan pergi/tidak akan pergi” mempertahankan ambiguitas dan paralelisme sumber.
  revised_text: 'Lalu TUHAN berfirman kepada Gideon, “Orang-orang itu masih terlalu banyak. Bawalah mereka turun ke air, dan di sana Aku akan menguji mereka bagimu. Akan terjadi demikian: setiap orang yang tentangnya Aku berkata kepadamu, ‘Orang ini akan pergi bersamamu,’ dialah yang akan pergi bersamamu. Tetapi setiap orang yang tentangnya Aku berkata kepadamu, ‘Orang ini tidak akan pergi bersamamu,’ ia tidak akan pergi.”'
