base_translation:
  language: en
  yaml_path: translation/ot/judges/007/004.yaml
  text: 'Then the LORD said to Gideon, “The people are still too many. Bring them down to the water, and there I will test them for you. And this is what will happen: anyone of whom I say to you, ‘This one shall go with you,’ he shall go with you; but anyone of whom I say to you, ‘This one shall not go with you,’ he shall not go.”'
translation:
  language: id
  text: 'Lalu TUHAN berfirman kepada Gideon, “Orang-orang itu masih terlalu banyak. Bawalah mereka turun ke air, dan di sana Aku akan menguji mereka bagimu. Akan terjadi demikian: setiap orang yang tentangnya Aku berkata kepadamu, ‘Orang ini akan pergi bersamamu,’ dialah yang akan pergi bersamamu. Tetapi setiap orang yang tentangnya Aku berkata kepadamu, ‘Orang ini tidak akan pergi bersamamu,’ ia tidak akan pergi.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: TUHAN
  rationale: Menerjemahkan nama ilahi dengan bentuk kapitel yang lazim dalam Alkitab bahasa Indonesia, tanpa menambahkan penjelasan yang tidak terdapat dalam ayat.
- source_word: הָעָם
  choice: rakyat yang bersamamu
  rationale: Dalam konteks pengerahan pasukan, עָם menunjuk kepada kumpulan orang yang menyertai Gideon; frasa tambahan 'yang bersamamu' tersirat oleh konteks dan membuat rujukannya jelas dalam bahasa Indonesia.
- source_word: וְאֶצְרְפֶנּוּ
  choice: Aku akan menyaring mereka
  rationale: Verba צרף secara harfiah berkaitan dengan pemurnian atau pengujian melalui penyaringan; 'menyaring' mempertahankan gambaran pemilahan orang-orang di tempat air.
- source_word: לְךָ
  choice: bagimu
  rationale: Mempertahankan datif Ibrani dan menunjukkan bahwa TUHAN melakukan penyaringan itu demi kepentingan atau keperluan Gideon.
- source_word: זֶה יֵלֵךְ אִתָּךְ
  choice: Orang ini harus pergi bersamamu
  rationale: Bentuk yiqtol dalam ucapan penetapan ilahi paling alami dinyatakan sebagai keharusan, sekaligus mempertahankan rujukan demonstratif 'orang ini'.
- source_word: זֶה לֹא יֵלֵךְ עִמָּךְ
  choice: Orang ini tidak boleh pergi bersamamu
  rationale: Menyampaikan keputusan negatif ilahi secara alami dan sejajar dengan klausa positif.
theological_decisions:
- issue: Nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH / Yahweh
  rationale: Bentuk 'TUHAN' mengikuti konvensi Indonesia yang luas dan membedakan nama perjanjian dari gelar biasa tanpa menetapkan pelafalan nama tersebut.
- issue: Makna tindakan ilahi צרף
  choice: menyaring
  alternative: menguji / memurnikan
  rationale: '''Menyaring'' mempertahankan unsur pemilahan yang menonjol dalam konteks, sedangkan ''menguji'' dapat terdengar hanya sebagai penilaian kemampuan dan ''memurnikan'' terlalu kuat menyiratkan perbaikan moral.'
- issue: Daya modal יֵלֵךְ setelah firman TUHAN
  choice: harus pergi / tidak boleh pergi
  alternative: akan pergi / tidak akan pergi
  rationale: Konteksnya adalah penetapan siapa yang diizinkan menyertai Gideon. Bentuk modal Indonesia menyatakan fungsi keputusan tersebut tanpa mengubahnya menjadi ramalan belaka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur pengulangan Ibrani dipertahankan secukupnya untuk menonjolkan kedaulatan pemilihan TUHAN, tetapi susunan kalimat dibuat alami bagi pembaca Indonesia. Tidak diperlukan catatan kaki.
