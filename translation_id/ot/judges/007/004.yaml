revisions:
- from: Lalu TUHAN berfirman kepada Gideon, “Rakyat yang bersamamu masih terlalu banyak. Bawalah mereka turun ke tempat air. Di sana Aku akan menyaring mereka bagimu. Jika Aku berkata kepadamu tentang seseorang, ‘Orang ini harus pergi bersamamu,’ ia harus pergi bersamamu. Namun, jika Aku berkata kepadamu tentang seseorang, ‘Orang ini tidak boleh pergi bersamamu,’ ia tidak boleh pergi.”
  to: 'Lalu TUHAN berfirman kepada Gideon, “Orang-orang itu masih terlalu banyak. Bawalah mereka turun ke air, dan di sana Aku akan menguji mereka bagimu. Akan terjadi demikian: setiap orang yang tentangnya Aku berkata kepadamu, ‘Orang ini akan pergi bersamamu,’ dialah yang akan pergi bersamamu. Tetapi setiap orang yang tentangnya Aku berkata kepadamu, ‘Orang ini tidak akan pergi bersamamu,’ ia tidak akan pergi.”'
  rationale: Revisi menghapus penambahan yang tidak eksplisit, memulihkan pengantar hasil/ketetapan Ibrani, dan mempertahankan bentuk masa depan yang berulang tanpa mempersempitnya menjadi kewajiban atau larangan. Susunan tetap modern, baku, dan setia pada penegasan berulang dalam sumber.
