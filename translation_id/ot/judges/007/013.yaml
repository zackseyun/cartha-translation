base_translation:
  language: en
  yaml_path: translation/ot/judges/007/013.yaml
  text: 'When Gideon came[a], behold, a man was telling a dream to his companion. He said, “Look, I dreamed a dream: behold, a round loaf of barley bread was rolling around in the camp of Midian, and it came up to the tent and struck it so that it fell, He turned it upside down, and the tent collapsed.”'
translation:
  language: id
  text: 'Ketika Gideon tiba, tampaklah seorang pria sedang menceritakan sebuah mimpi kepada kawannya. Katanya, “Lihat, aku bermimpi: tampak sebuah roti jelai bundar[a] berguling-guling di perkemahan Midian. Roti itu sampai ke kemah itu dan menghantamnya. Kemah itu roboh; roti itu membalikkannya, lalu kemah itu jatuh.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebuah kue jelai” atau “sepotong roti jelai”. Kata Ibrani yang diterjemahkan “bundar” sangat jarang dan mungkin menunjuk pada roti atau kue berbentuk bundar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא גִדְעוֹן
  choice: Ketika Gideon tiba
  rationale: Bentuk naratif memajukan kisah dan sekaligus mengantar keadaan yang sedang berlangsung ketika Gideon mendekat.
- source_word: וְהִנֵּה
  choice: tampaklah / Tampak
  rationale: Partikel ini mengarahkan perhatian secara hidup. Bentuk ini mempertahankan daya visualnya tanpa memakai ungkapan Indonesia yang usang.
- source_word: מְסַפֵּר לְרֵעֵהוּ חֲלוֹם
  choice: sedang menceritakan sebuah mimpi kepada kawannya
  rationale: Partisipel menunjukkan tindakan yang sedang berlangsung; 'kawan' cocok dengan konteks sesama anggota pasukan tanpa menyiratkan keakraban khusus.
- source_word: הִנֵּה חֲלוֹם חָלַמְתִּי
  choice: Dengar, aku bermimpi!
  rationale: Ungkapan serumpun Ibrani memberi penekanan. Bahasa Indonesia alami menyampaikan tekanan itu melalui seruan, bukan pengulangan harfiah 'memimpikan sebuah mimpi'.
- source_word: צלול לֶחֶם שְׂעֹרִים
  choice: sebongkah roti jelai bundar
  rationale: צלול sangat jarang dan tampaknya menunjuk pada roti atau kue yang bundar. 'Sebongkah' menggambarkan benda utuh yang dapat berguling tanpa memastikan bentuk lebih jauh.
- source_word: מִתְהַפֵּךְ בְּמַחֲנֵה מִדְיָן
  choice: berguling-guling di perkemahan Midian
  rationale: Bentuk refleksif menggambarkan benda yang berputar atau terguling pada dirinya sendiri; בְּ secara langsung berarti 'di/dalam', sehingga arah masuk tidak ditambahkan.
- source_word: וַיָּבֹא עַד הָאֹהֶל
  choice: sampai ke kemah
  rationale: עַד menandai gerak hingga mencapai suatu batas atau sasaran.
- source_word: וַיַּכֵּהוּ וַיִּפֹּל
  choice: menghantamnya hingga roboh
  rationale: Roti tetap menjadi pelaku yang menghantam kemah, dan bentuk maskulin tunggal berikutnya secara alami merujuk pada kemah yang roboh.
- source_word: וַיַּהַפְּכֵהוּ לְמַעְלָה
  choice: Roti itu membalikkannya
  rationale: Rangkaian verba paling alami mempertahankan roti sebagai pelaku dan kemah sebagai objek. Pengulangan nomina memperjelas rujukan pronomina yang sama-sama maskulin dalam bahasa Ibrani.
- source_word: וְנָפַל הָאֹהֶל
  choice: kemah itu pun ambruk
  rationale: Nomina 'kemah' disebut eksplisit dalam sumber. 'Ambruk' menyampaikan keruntuhan bangunan secara alami dan membedakannya dari verba sebelumnya.
