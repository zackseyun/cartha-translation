revisions:
- from: Ketika Gideon tiba, tampaklah seorang pria sedang menceritakan sebuah mimpi kepada kawannya. Katanya, “Dengar, aku bermimpi! Tampak sebongkah roti jelai bundar[a] berguling-guling di perkemahan Midian. Roti itu sampai ke kemah lalu menghantamnya hingga roboh. Roti itu membalikkannya, dan kemah itu pun ambruk.”
  to: 'Ketika Gideon tiba, tampaklah seorang pria sedang menceritakan sebuah mimpi kepada kawannya. Katanya, “Lihat, aku bermimpi: tampak sebuah roti jelai bundar[a] berguling-guling di perkemahan Midian. Roti itu sampai ke kemah itu dan menghantamnya. Kemah itu roboh; roti itu membalikkannya, lalu kemah itu jatuh.”'
  rationale: Revisi menghilangkan nuansa tambahan pada "sebongkah", mengganti seruan dialog dengan padanan yang lebih dekat untuk הִנֵּה, dan mempertahankan urutan verba naratif tanpa mempertegas sebab-akibat. Rujukan roti sebagai subjek dan kemah sebagai objek tetap dibuat eksplisit agar rangkaian tindakan dapat dipahami dalam bahasa Indonesia modern.
