    issue: '"Sebongkah roti"'
    rationale: '"Sebongkah" lazimnya menyiratkan gumpalan atau bongkahan dan bukan sekadar roti/kue bundar. Makna tepat צְלוּל tidak pasti; "sebuah roti jelai bundar" lebih netral, dengan alternatif dalam catatan kaki.'
  - severity: low
    issue: '"Dengar" untuk הִנֵּה dalam ujaran langsung'
    rationale: Partikel ini mengundang perhatian pada apa yang dilihat/diperhatikan, bukan terutama didengar. "Lihat" lebih dekat pada daya retoris sumber dan tetap alami dalam dialog Indonesia.
  - severity: low
    issue: '"menghantamnya hingga roboh"'
    rationale: Kata "hingga" menggabungkan dua verba naratif sebagai hubungan hasil yang eksplisit. Memisahkan tindakan dan kejatuhan mempertahankan urutan sumber tanpa menambah relasi kausal.
