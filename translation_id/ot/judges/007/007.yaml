  source_fidelity: 'Terjemahan pada dasarnya setia: bentuk jamak pada “kalian” dan bentuk tunggal pada “tanganmu” dipertahankan, demikian pula idiom penyerahan Midian ke dalam tangan Gideon. Namun, “yang lain” tidak hadir secara eksplisit dalam וְכָל־הָעָם dan sebaiknya tidak ditambahkan ke teks utama, walaupun pembedaan dari kelompok tiga ratus itu jelas dari konteks.'
  naturalness: Bahasa Indonesia baku dan alurnya alami. “Orang yang menjilat itu” dapat dipahami secara eliptis dari konteks dekat dan tidak perlu ditambahi “air”.
  terminology: “Yahweh,” “berfirman,” “menyelamatkan,” dan “menyerahkan ... ke dalam tanganmu” konsisten dengan register naratif Alkitab dan makna istilah Ibrani. Catatan alternatif instrumental dari jejak audit bahasa Inggris perlu dipertahankan dengan jangkar yang tepat.
  issues:
