  to: Lalu Yahweh berfirman kepada Gideon, “Dengan tiga ratus orang yang menjilat itu[a], Aku akan menyelamatkan kalian dan menyerahkan Midian ke dalam tanganmu. Biarlah semua orang itu pergi, masing-masing ke tempatnya.”
  rationale: Menghapus tambahan “yang lain” agar teks utama lebih dekat dengan וְכָל הָעָם, sambil membiarkan konteks menentukan bahwa kelompok tiga ratus tidak termasuk dalam mereka yang pergi. Menambahkan catatan kaki berjangkar pada “Dengan” untuk mempertahankan alternatif instrumental dalam audit bahasa Inggris.
