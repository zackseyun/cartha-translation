  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל גִּדְע֗וֹן בִּ/שְׁלֹשׁ֩ מֵא֨וֹת הָ/אִ֤ישׁ הַֽ/מֲלַקְקִים֙ אוֹשִׁ֣יעַ אֶתְ/כֶ֔ם וְ/נָתַתִּ֥י אֶת מִדְיָ֖ן בְּ/יָדֶ֑/ךָ וְ/כָל הָ/עָ֔ם יֵלְכ֖וּ אִ֥ישׁ לִ/מְקֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/007.yaml
  text: And Yahweh said to Gideon[a], “With the three hundred men who lapped, I will save you and give Midian into your hand. And let all the people go, each man to his place.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepada Gideon, “Dengan tiga ratus orang yang menjilat itu[a], Aku akan menyelamatkan kalian dan menyerahkan Midian ke dalam tanganmu. Biarlah semua orang itu pergi, masing-masing ke tempatnya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Melalui tiga ratus orang yang menjilat itu.”
    reason: Alternatif leksikal untuk preposisi בְּ yang dapat menyatakan sarana atau perantaraan.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan selaras dengan kebijakan proyek.
- source_word: בִּשְׁלֹשׁ מֵאוֹת הָאִישׁ
  choice: Dengan tiga ratus orang
  rationale: בְּ dipahami secara instrumental; “dengan” alami dalam bahasa Indonesia dan tetap menunjukkan sarana yang dipakai untuk penyelamatan.
- source_word: הַמֲלַקְקִים
  choice: yang menjilat itu
  rationale: Mempertahankan tindakan konkret yang mengidentifikasi kelompok tersebut dari konteks sebelumnya tanpa menambahkan objek “air” yang tidak diulangi dalam ayat ini.
- source_word: אוֹשִׁיעַ אֶתְכֶם
  choice: Aku akan menyelamatkan kalian
  rationale: Bentuk Hifil dari ישׁע berarti menyelamatkan atau melepaskan. “Kalian” mempertahankan bentuk objek jamak dalam bahasa Ibrani, berbeda dari akhiran tunggal pada “tanganmu” sesudahnya.
- source_word: וְנָתַתִּי אֶת מִדְיָן בְּיָדֶךָ
  choice: dan menyerahkan Midian ke dalam tanganmu
  rationale: Mempertahankan idiom Ibrani tentang pemberian kuasa atau kemenangan, sambil memakai verba Indonesia yang alami.
- source_word: וְכָל הָעָם
  choice: semua orang yang lain
  rationale: “Orang” mencerminkan הָעָם dalam konteks pasukan; “yang lain” memperjelas bahwa tiga ratus orang yang baru disebut tidak diperintahkan pergi.
- source_word: יֵלְכוּ
  choice: Biarlah ... pergi
  rationale: Imperfek ini berfungsi secara yusif, menyatakan perintah atau izin, bukan sekadar masa depan.
- source_word: אִישׁ לִמְקֹמוֹ
  choice: masing-masing ke tempatnya
  rationale: Menyampaikan konstruksi distributif secara wajar dan tidak mempersempit מָקוֹם menjadi “rumah”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; transliterasi “Yahweh” mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Cakupan kata ganti pada אוֹשִׁיעַ אֶתְכֶם dan בְּיָדֶךָ
  choice: “kalian” untuk objek jamak, lalu “tanganmu” untuk Gideon tunggal
  alternative: Meratakan keduanya menjadi bentuk tunggal atau jamak
  rationale: Bahasa Ibrani dengan sengaja beralih dari objek orang kedua jamak kepada akhiran orang kedua tunggal. Terjemahan mempertahankan perbedaan ini dan tidak memutuskan lebih jauh siapa saja yang tercakup dalam bentuk jamak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Berfirman” dipakai untuk ujaran ilahi; susunan kalimat dibuat alami tanpa menghilangkan idiom “ke dalam tanganmu” maupun peralihan kata ganti jamak ke tunggal.
