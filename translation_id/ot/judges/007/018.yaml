  text: וְ/תָקַעְתִּי֙ בַּ/שּׁוֹפָ֔ר אָנֹכִ֖י וְ/כָל אֲשֶׁ֣ר אִתִּ֑/י וּ/תְקַעְתֶּ֨ם בַּ/שּׁוֹפָר֜וֹת גַּם אַתֶּ֗ם סְבִיבוֹת֙ כָּל הַֽ/מַּחֲנֶ֔ה וַ/אֲמַרְתֶּ֖ם לַ/יהוָ֥ה וּ/לְ/גִדְעֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/018.yaml
  text: When I and all who are with me blow the ram’s horn[a], then you also must blow the horns all around the whole camp, and say[b], ‘For Yahweh and for Gideon!’
translation:
  language: id
  text: Ketika aku dan semua orang yang bersamaku meniup tanduk domba jantan[a], kalian juga harus meniup tanduk di sekeliling seluruh perkemahan dan berkata, “Demi Yahweh dan demi Gideon!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani שׁוֹפָר menunjuk pada alat tiup dari tanduk, biasanya tanduk domba jantan, bukan trompet logam.
    reason: cultural_note
  - marker: b
    text: Sejumlah terjemahan tradisional berbunyi, “Pedang Yahweh dan Gideon,” karena dipengaruhi rumusan yang berdekatan dalam Hakim-Hakim 7:20. Namun, teks Ibrani ayat ini hanya berbunyi, “Demi Yahweh dan demi Gideon.”
    reason: alternative_reading
lexical_decisions:
- source_word: תָקַעְתִּי / תְקַעְתֶּם
  choice: meniup
  rationale: Dalam konstruksi dengan שׁוֹפָר, verba תקע berarti meniup atau membunyikan tanduk. “Meniup” menyatakan tindakan konkret secara alami dalam bahasa Indonesia.
- source_word: שׁוֹפָר / שׁוֹפָרוֹת
  choice: tanduk domba jantan / tanduk
  rationale: שׁוֹפָר menunjuk pada alat tiup dari tanduk, lazimnya tanduk domba jantan, bukan trompet logam. Penyebutan lengkap pada kemunculan pertama memberi gambaran bendanya, sedangkan bentuk ringkas “tanduk” pada kemunculan kedua menghindari pengulangan yang berat.
- source_word: אָנֹכִי וְכָל אֲשֶׁר אִתִּי
  choice: aku dan semua orang yang bersamaku
  rationale: Frasa ini menunjuk kepada Gideon beserta orang-orang yang menyertainya. Rumusan ini alami dan mempertahankan cakupan “semua”.
- source_word: גַּם אַתֶּם
  choice: kalian juga
  rationale: גַּם menyatakan bahwa kelompok yang diajak bicara harus melakukan hal yang sama. “Kalian” memperjelas bahwa pronomina Ibrani berbentuk jamak.
- source_word: סְבִיבוֹת כָּל הַמַּחֲנֶה
  choice: di sekeliling seluruh perkemahan
  rationale: Ungkapan ini mempertahankan gagasan pengepungan dari segala sisi sekaligus cakupan menyeluruh dari כָּל.
- source_word: וַאֲמַרְתֶּם
  choice: dan berkata
  rationale: Verba אָמַר pada dasarnya berarti “berkata”. Walaupun konteks pertempuran menyiratkan seruan keras, teks tidak memakai verba khusus untuk berteriak.
- source_word: לַיהוָה וּלְגִדְעוֹן
  choice: Bagi Yahweh dan bagi Gideon!
  rationale: 'Preposisi ל diulang pada kedua nama dan dalam seruan perang ini paling wajar menyatakan keberpihakan atau pengabdian: “bagi/untuk”. Pengulangan “bagi” mempertahankan kesejajaran Ibraninya.'
theological_decisions:
- issue: Bentuk seruan perang לַיהוָה וּלְגִדְעוֹן
  choice: Bagi Yahweh dan bagi Gideon!
  alternative: Pedang Yahweh dan Gideon!
  rationale: Teks Ibrani ayat ini hanya berbunyi “bagi Yahweh dan bagi Gideon”; kata “pedang” tidak terdapat di sini dan berasal dari rumusan terkait dalam Hakim-Hakim 7:20. Terjemahan utama mengikuti bunyi ayat ini tanpa memasukkan kata dari ayat lain.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Nama perjanjian יהוה ditampilkan sebagai nama diri “Yahweh”, bukan diganti dengan gelar, sehingga bentuk sumber tetap terlihat bagi pembaca.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. “Kalian” dipakai karena orang kedua dalam bahasa Ibrani berbentuk jamak. Istilah teknis “syofar” dihindari dalam teks utama demi keterpahaman umum, sedangkan keterangan budaya diberikan dalam catatan kaki.
