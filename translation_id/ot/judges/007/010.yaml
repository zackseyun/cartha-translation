  yaml_path: translation/ot/judges/007/010.yaml
  text: But if you are afraid to go down[a], go down to the camp with Purah your servant.
translation:
  language: id
  text: Tetapi jika engkau takut untuk turun, turunlah ke perkemahan bersama Pura, pelayanmu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani na'ar dapat merujuk kepada seorang pemuda, pelayan, atau pendamping, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Tetapi jika
  rationale: Gabungan konjungsi dan partikel syarat memberi pembatasan yang agak kontras terhadap perintah sebelumnya; “Tetapi jika” wajar dan jelas dalam bahasa Indonesia.
- source_word: יָרֵא אַתָּה
  choice: engkau takut
  rationale: Ungkapan ini menyatakan keadaan Gideon; bentuk ini alami dalam bahasa Indonesia dan mempertahankan makna takut.
- source_word: לָרֶדֶת ... רֵד
  choice: untuk turun ... turunlah
  rationale: Pengulangan akar ירד dipertahankan karena memberi penekanan retoris dan menghubungkan syarat dengan perintah.
- source_word: וּפֻרָה
  choice: bersama Pura
  rationale: Konjungsi di sini menyatakan penyertaan; “bersama” lebih alami daripada menerjemahkannya secara harfiah sebagai “dan”.
- source_word: נַעַרְךָ
  choice: pelayanmu
  rationale: נַעַר dapat berarti orang muda, pelayan, atau pendamping. Dalam konteks ini Pura menyertai Gideon sebagai bawahannya, sehingga “pelayanmu” alami tanpa menutup alternatif leksikal lainnya.
- source_word: אֶל הַמַּחֲנֶה
  choice: ke perkemahan
  rationale: אֶל menunjukkan arah menuju suatu tempat. “Ke perkemahan” mempertahankan arah itu tanpa mempertegas bahwa mereka langsung masuk ke dalamnya.
