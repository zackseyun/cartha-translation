  text: וּ/מַלְאָכִ֡ים שָׁלַ֣ח גִּדְעוֹן֩ בְּ/כָל הַ֨ר אֶפְרַ֜יִם לֵ/אמֹ֗ר רְד֞וּ לִ/קְרַ֤את מִדְיָן֙ וְ/לִכְד֤וּ לָ/הֶם֙ אֶת הַ/מַּ֔יִם עַ֛ד בֵּ֥ית בָּרָ֖ה וְ/אֶת הַ/יַּרְדֵּ֑ן וַ/יִּצָּעֵ֞ק כָּל אִ֤ישׁ אֶפְרַ֨יִם֙ וַ/יִּלְכְּד֣וּ אֶת הַ/מַּ֔יִם עַ֛ד בֵּ֥ית בָּרָ֖ה וְ/אֶת הַ/יַּרְדֵּֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/024.yaml
  text: And Gideon sent messengers throughout all the hill country of Ephraim[a], saying, “Come down against Midian, and seize the waters as far as Beth-barah, and the Jordan.” So every man of Ephraim was called out, and they seized the waters as far as Beth-barah[c][b], and the Jordan.
translation:
  language: id
  text: Gideon mengirim para utusan ke seluruh daerah pegunungan Efraim dengan pesan, “Turunlah untuk menghadapi orang Midian dan rebutlah perairan[a] hingga Bet-Bara dan Sungai Yordan.” Maka semua laki-laki Efraim[b] dikerahkan[c], lalu mereka merebut perairan hingga Bet-Bara dan Sungai Yordan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “perairan.” Ungkapan ini mungkin menunjuk aliran-aliran air, titik-titik penyeberangan, atau akses air yang strategis.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “setiap laki-laki Efraim.” Bentuk tunggal ini dipakai secara kolektif untuk orang-orang Efraim.
    reason: lexical_alternative
  - marker: c
    text: Kata Ibrani ini sulit dipahami. Kata ini dapat diterjemahkan “dipanggil untuk berkumpul” atau “dikerahkan”; sebagian memahaminya lebih harfiah sebagai “berseru.”
    reason: alternative_reading
lexical_decisions:
- source_word: וּמַלְאָכִים
  choice: para utusan
  rationale: Dalam konteks ini מַלְאָכִים adalah manusia yang membawa pesan Gideon, bukan malaikat; “para utusan” merupakan padanan Indonesia yang jelas dan wajar.
- source_word: בְּכָל הַר אֶפְרַיִם
  choice: ke seluruh pegunungan Efraim
  rationale: הַר menunjuk kawasan pegunungan Efraim, bukan satu puncak tertentu. Preposisi Indonesia “ke” mengikuti tindakan mengirim para utusan menyusuri kawasan itu.
- source_word: רְדוּ לִקְרַאת מִדְיָן
  choice: Turunlah menghadang orang Midian
  rationale: רְדוּ mempertahankan gerak turun dari pegunungan, sedangkan לִקְרַאת dalam konteks militer menyatakan gerak untuk menemui dan mencegat lawan. “Orang Midian” lebih alami daripada memakai nama bangsa secara abstrak.
- source_word: וְלִכְדוּ לָהֶם
  choice: dan rebutlah
  rationale: לכד berarti merebut atau menguasai. Unsur pronominal לָהֶם tidak dieksplisitkan karena kemungkinan berfungsi sebagai datif kepentingan dan akan terasa janggal bila diterjemahkan secara harfiah.
- source_word: אֶת הַמַּיִם
  choice: tempat-tempat penyeberangan air
  rationale: Secara harfiah berarti “perairan/air-air,” tetapi dalam konteks pengejaran militer ungkapan ini kemungkinan menunjuk titik-titik strategis untuk menyeberangi aliran air. Catatan kaki mempertahankan arti harfiahnya dan kemungkinan alternatif.
- source_word: עַד בֵּית בָּרָה
  choice: sampai ke Bet-Bara
  rationale: עַד menyatakan batas jangkauan, sedangkan nama tempat ditransliterasikan dalam bentuk yang alami bagi pembaca Indonesia.
- source_word: וְאֶת הַיַּרְדֵּן
  choice: juga Sungai Yordan
  rationale: Partikel וְ mengoordinasikan sasaran tambahan. Penambahan “Sungai” memperjelas bahwa Yordan di sini adalah aliran air yang harus dikuasai.
- source_word: וַיִּצָּעֵק כָּל אִישׁ אֶפְרַיִם
  choice: Maka semua laki-laki Efraim dikerahkan
  rationale: Bentuk וַיִּצָּעֵק sulit diterjemahkan secara mekanis; dalam alur ini bentuk tersebut paling wajar menyatakan bahwa pasukan Efraim dipanggil atau dikerahkan. כָּל אִישׁ adalah kolektif tunggal yang mengacu kepada laki-laki Efraim, khususnya mereka yang dapat ikut bertempur.
- source_word: וַיִּלְכְּדוּ
  choice: lalu mereka merebut
  rationale: “Merebut” konsisten dengan akar לכד pada perintah sebelumnya dan menyatakan penguasaan atas titik-titik strategis.
