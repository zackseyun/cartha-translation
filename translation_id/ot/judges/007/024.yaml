  to: Gideon mengirim para utusan ke seluruh daerah pegunungan Efraim dengan pesan, “Turunlah untuk menghadapi orang Midian dan rebutlah perairan[a] hingga Bet-Bara dan Sungai Yordan.” Maka semua laki-laki Efraim[b] dikerahkan[c], lalu mereka merebut perairan hingga Bet-Bara dan Sungai Yordan.
