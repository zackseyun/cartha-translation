  register: Bahasa Indonesia baku modern dengan corak naratif yang lugas dan bermartabat. Bentuk “Turunlah” mempertahankan unsur topografis, sedangkan “menghadang” menyampaikan konteks militer tanpa melebihkan kekerasan. Ketidakpastian pada “perairan” dan וַיִּצָּעֵק dijaga melalui catatan kaki.
