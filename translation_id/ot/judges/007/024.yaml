    rationale: Konteks mendukung suatu pengerahan, tetapi frasa Ibrani sendiri hanya memakai singular kolektif “setiap laki-laki/orang Efraim.” Catatan sebaiknya menjelaskan bentuk kolektif tanpa menambahkan pembatasan sosial yang tidak eksplisit.
