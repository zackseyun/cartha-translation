id: JDG.7.15
reference: Judges 7:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִי֩ כִ/שְׁמֹ֨עַ גִּדְע֜וֹן אֶת מִסְפַּ֧ר הַ/חֲל֛וֹם וְ/אֶת שִׁבְר֖/וֹ וַ/יִּשְׁתָּ֑חוּ וַ/יָּ֨שָׁב֙ אֶל מַחֲנֵ֣ה יִשְׂרָאֵ֔ל וַ/יֹּ֣אמֶר ק֔וּמוּ כִּֽי נָתַ֧ן יְהוָ֛ה בְּ/יֶדְ/כֶ֖ם אֶת מַחֲנֵ֥ה מִדְיָֽן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/007/015.yaml
  text: And when Gideon heard the telling of the dream and its interpretation, he bowed down in worship. Then he returned to the camp of Israel and said, “Get up, for the LORD has given the camp of Midian into your hand.”
translation:
  language: id
  text: Ketika Gideon mendengar penuturan mimpi itu dan tafsirnya, ia pun sujud menyembah. Kemudian ia kembali ke perkemahan Israel dan berkata, “Bangunlah, sebab TUHAN telah menyerahkan perkemahan Midian ke dalam tangan kalian.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִסְפַּר הַחֲלוֹם
  choice: penuturan mimpi itu
  rationale: מִסְפָּר di sini menunjuk pada tindakan atau isi penceritaan mimpi, bukan angka; 'penuturan' menyampaikan makna itu secara alami dan bermartabat.
- source_word: שִׁבְרוֹ
  choice: tafsirnya
  rationale: Dalam konteks mimpi, שֵׁבֶר menunjuk pada pemecahan makna atau interpretasinya; 'tafsir' merupakan padanan Indonesia yang jelas.
- source_word: וַיִּשְׁתָּחוּ
  choice: ia pun sujud menyembah
  rationale: Bentuk ini dapat berarti membungkuk atau bersujud; konteks respons Gideon terhadap peneguhan ilahi mendukung tindakan penyembahan, sementara 'sujud' mempertahankan unsur jasmaninya.
- source_word: קוּמוּ
  choice: Bangunlah
  rationale: Imperatif jamak ini menyerukan pasukan agar bangkit dan bertindak; 'Bangunlah' alami dalam konteks pengerahan pasukan.
- source_word: נָתַן ... בְּיֶדְכֶם
  choice: telah menyerahkan ... ke dalam tangan kalian
  rationale: Ungkapan Ibrani menyatakan penyerahan kepada kuasa pihak lain. Bentuk perfektum dipertahankan sebagai 'telah menyerahkan', yang menonjolkan kepastian tindakan TUHAN.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia yang lazim untuk nama ilahi YHWH, dengan huruf kapital penuh.
theological_decisions:
- issue: Objek penyembahan dalam וַיִּשְׁתָּחוּ tidak disebutkan secara eksplisit
  choice: ia pun sujud menyembah
  alternative: ia pun bersujud
  rationale: Konteks langsung menunjukkan tanggapan religius Gideon setelah mendengar peneguhan tentang kemenangan dari TUHAN. Namun, terjemahan tidak menambahkan objek eksplisit seperti 'kepada TUHAN' yang tidak tertulis dalam teks Ibrani.
- issue: Aspek profetis dari נָתַן, bentuk perfektum untuk kemenangan yang segera terjadi
  choice: telah menyerahkan
  alternative: akan menyerahkan
  rationale: 'Mempertahankan bentuk lampau/perfektum menjaga ketegangan teks: kemenangan yang belum diwujudkan dipandang sudah pasti karena tindakan TUHAN.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Bentuk jamak 'kalian' dipakai untuk בְּיֶדְכֶם agar jelas bahwa Gideon berbicara kepada pasukannya. Tidak ada penanda catatan kaki karena tidak diperlukan.
