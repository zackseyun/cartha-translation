  yaml_path: translation/ot/judges/007/011.yaml
  text: and you will hear what they are saying[a], and afterward your hands will be strengthened[b], and you will go down into the camp.” So he went down with Purah his servant to the edge of the armed men who were in the camp.
translation:
  language: id
  text: dan engkau akan mendengar apa yang mereka katakan. Sesudah itu, tanganmu akan menjadi kuat,[a] lalu engkau akan turun ke perkemahan itu.” Maka Gideon turun bersama Pura, pelayannya,[b] sampai ke tepi pasukan bersenjata yang berada di perkemahan itu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “kedua tanganmu akan menjadi kuat”; sebuah ungkapan yang berarti memperoleh keberanian dan keteguhan untuk bertindak.'
    reason: idiom
  - marker: b
    text: Kata Ibrani yang digunakan juga dapat berarti “orang mudanya” atau “pendampingnya”.
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “sampai ke bagian terluar pasukan yang diperlengkapi untuk berperang”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ מַה יְדַבֵּרוּ
  choice: dan engkau akan mendengar apa yang mereka katakan
  rationale: Bentuk verba dalam rangkaian ini menyatakan tindakan mendatang; ungkapan ini secara alami menggambarkan Gideon mendengarkan percakapan mereka.
- source_word: וְאַחַר
  choice: Sesudah itu
  rationale: Menandai urutan waktu dengan jelas dan wajar dalam bahasa Indonesia.
- source_word: תֶּחֱזַקְנָה יָדֶיךָ
  choice: tanganmu akan dikuatkan
  rationale: Mempertahankan idiom Ibrani tentang tangan yang menjadi kuat, yang menyatakan keberanian dan keteguhan untuk bertindak.
- source_word: וְיָרַדְתָּ בַּמַּחֲנֶה
  choice: lalu engkau akan turun menyerbu perkemahan itu
  rationale: ירד berarti 'turun', sedangkan konteks dan konstruksi dengan ב menunjukkan gerak terhadap perkemahan musuh; 'menyerbu' menyampaikan tujuan tindakan tanpa menghilangkan verba geraknya.
- source_word: וַיֵּרֶד הוּא
  choice: Maka Gideon turun
  rationale: Wayyiqtol melanjutkan alur cerita. Nama Gideon dipakai menggantikan pronomina agar rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: וּפֻרָה נַעֲרוֹ
  choice: bersama Pura, pelayannya
  rationale: נַעַר dapat berarti orang muda, pelayan, atau pendamping; dalam konteks hubungan Pura dengan Gideon, 'pelayan' paling alami, sementara alternatifnya dicatat.
- source_word: אֶל קְצֵה הַחֲמֻשִׁים
  choice: sampai ke tepi pasukan bersenjata
  rationale: קצה berarti tepi atau ujung, dan חֲמֻשִׁים menunjuk kepada orang-orang yang diperlengkapi atau bersenjata untuk berperang.
- source_word: אֲשֶׁר בַּמַּחֲנֶה
  choice: yang berada di perkemahan itu
  rationale: Klausa relatif mengidentifikasi pasukan bersenjata yang berada atau ditempatkan di dalam perkemahan.
theological_decisions:
- issue: Makna idiom 'tanganmu akan dikuatkan'
  choice: Mempertahankan gambaran tangan secara harfiah
  alternative: engkau akan menjadi berani
  rationale: Teks menyatakan hasil berupa keberanian dan keteguhan melalui idiom tubuh; mempertahankan gambaran tersebut menghindari penyempitan makna.
- issue: Arah tindakan turun ke perkemahan
  choice: turun menyerbu perkemahan itu
  alternative: turun ke dalam perkemahan itu
  rationale: Konteksnya adalah perintah untuk menyerang sesudah Gideon memperoleh keberanian, tetapi kemungkinan nuansa gerak menuju atau masuk ke perkemahan tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Pronomina 'engkau' mempertahankan tuturan langsung yang serius. 'Perkemahan' dipilih untuk מחנה, dan idiom tangan dipertahankan dengan penjelasan singkat dalam catatan kaki.
