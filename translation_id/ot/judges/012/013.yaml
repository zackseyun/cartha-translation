base_translation:
  language: en
  yaml_path: translation/ot/judges/012/013.yaml
  text: After him, Abdon son of Hillel the Pirathonite judged Israel.
translation:
  language: id
  text: Sesudah dia, Abdon anak Hilel, orang Piraton, memerintah sebagai hakim atas Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: memerintah ... sebagai hakim
  rationale: Dalam kitab Hakim-Hakim, שׁפט menunjuk pada pelaksanaan peran seorang hakim atas Israel, yang mencakup kepemimpinan atau pemerintahan, bukan hanya mengadili perkara. Ungkapan ini mempertahankan istilah khas kitab tersebut sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: אַחֲרָיו
  choice: Sesudah dia
  rationale: Frasa ini menunjukkan bahwa Abdon tampil sebagai hakim setelah tokoh sebelumnya; terjemahan ini langsung dan alami.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Penanda objek langsung אֶת tidak perlu diterjemahkan tersendiri; nama Israel dipertahankan sebagai objek pemerintahan Abdon.
- source_word: עַבְדּוֹן
  choice: Abdon
  rationale: Nama pribadi dialihaksarakan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בֶּן הִלֵּל
  choice: bin Hilel
  rationale: Kata בֶּן menyatakan hubungan ayah-anak. 'Bin' adalah bentuk ringkas dan lazim dalam gaya nama Alkitab bahasa Indonesia.
- source_word: הַפִּרְעָתוֹנִי
  choice: orang Piraton
  rationale: Bentuk nisbah ini menyatakan bahwa Abdon berasal dari Piraton. 'Orang Piraton' menyampaikan maknanya secara jelas dan alami.
theological_decisions:
- issue: Cakupan peran 'hakim' dalam שׁפט
  choice: memerintah Israel sebagai hakim
  alternative: menghakimi Israel
  rationale: '''Menghakimi Israel'' dalam bahasa Indonesia modern mudah dipahami hanya sebagai menjatuhkan putusan atau hukuman. Pilihan ini mempertahankan jabatan hakim dalam kitab tersebut tanpa mempersempit perannya.'
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Susunan kalimat mempertahankan urutan suksesi, identitas tokoh, asal-usul keluarga, dan daerah asalnya, sambil memakai ungkapan yang jelas bagi pembaca modern.
