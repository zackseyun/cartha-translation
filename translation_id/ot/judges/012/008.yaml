base_translation:
  language: en
  yaml_path: translation/ot/judges/012/008.yaml
  text: After him[a], Ibzan from Bethlehem judged Israel.
translation:
  language: id
  text: Sesudah dia, Ebzan dari Betlehem menjadi hakim atas Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: menjadi hakim atas
  rationale: Dalam kitab Hakim-Hakim, שׁפט menunjuk pada tugas seorang hakim yang memimpin dan memerintah Israel. Ungkapan ini mempertahankan istilah khas kitab tersebut dan terdengar wajar dalam bahasa Indonesia.
- source_word: אַחֲרָיו
  choice: Sesudah dia
  rationale: Bentuk ini menunjukkan urutan atau pergantian sesudah hakim sebelumnya; acuannya jelas dari konteks tanpa perlu menambahkan nama Yefta.
- source_word: אֶת יִשְׂרָאֵל
  choice: Israel
  rationale: Penanda objek langsung אֶת tidak diterjemahkan tersendiri; Israel adalah pihak yang dihakimi atau dipimpin oleh Ebzan.
- source_word: אִבְצָן
  choice: Ebzan
  rationale: Nama diri ditransliterasikan dengan bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: מִבֵּית לָחֶם
  choice: dari Betlehem
  rationale: Prefiks מִן paling wajar menyatakan asal Ebzan dari Betlehem, meskipun secara leksikal dapat pula menyatakan keterkaitan dengan tempat itu.
