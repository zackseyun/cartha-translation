  text: וַ/יִּלְכֹּ֥ד גִּלְעָ֛ד אֶֽת מַעְבְּר֥וֹת הַ/יַּרְדֵּ֖ן לְ/אֶפְרָ֑יִם וְֽ֠/הָיָה כִּ֣י יֹאמְר֞וּ פְּלִיטֵ֤י אֶפְרַ֨יִם֙ אֶעֱבֹ֔רָה וַ/יֹּ֨אמְרוּ ל֧/וֹ אַנְשֵֽׁי גִלְעָ֛ד הַֽ/אֶפְרָתִ֥י אַ֖תָּה וַ/יֹּ֥אמֶֽר לֹֽא־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/005.yaml
  text: And Gilead captured the fords of the Jordan against Ephraim. And whenever the fugitives of Ephraim said[a], “Let me cross over,” the men of Gilead would say to him, “Are you an Ephraimite?” If he said, “No,”
translation:
  language: id
  text: Orang-orang Gilead merebut tempat-tempat penyeberangan[a] Sungai Yordan untuk menghadang orang Efraim. Setiap kali seorang pelarian Efraim berkata, “Izinkan aku menyeberang,” orang-orang Gilead bertanya kepadanya, “Apakah kamu orang Efraim?” Jika ia menjawab, “Bukan,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tempat-tempat penyeberangan”; yang dimaksud ialah bagian sungai yang dangkal dan biasa digunakan untuk menyeberangi Sungai Yordan.
    reason: Menjelaskan bahwa istilah Ibrani menunjuk pada titik penyeberangan sungai, khususnya bagian yang dangkal.
lexical_decisions:
- source_word: וַיִּלְכֹּד גִּלְעָד
  choice: Orang-orang Gilead merebut
  rationale: לכד menyatakan perebutan atau penguasaan secara militer. Nama wilayah Gilead dipakai secara kolektif untuk penduduk atau pasukannya, sehingga bentuk eksplisit ini alami dalam bahasa Indonesia.
- source_word: מַעְבְּרוֹת הַיַּרְדֵּן
  choice: tempat-tempat penyeberangan Sungai Yordan
  rationale: מַעְבְּרוֹת menunjuk pada titik-titik sungai yang dapat diseberangi, khususnya bagian dangkal. Ungkapan ini lebih mudah dipahami pembaca Indonesia daripada istilah teknis yang jarang dipakai.
- source_word: לְאֶפְרָיִם
  choice: untuk menghadang orang Efraim
  rationale: Dalam konteks permusuhan, לְ menyatakan arah tindakan terhadap Efraim. Terjemahan ini memperjelas bahwa titik penyeberangan dikuasai untuk menghalangi mereka tanpa menambahkan hasil tindakan yang belum dinyatakan.
- source_word: וְהָיָה כִּי
  choice: Setiap kali
  rationale: Idiom ini memperkenalkan kejadian yang berulang dalam prosedur penjagaan tempat penyeberangan.
- source_word: פְּלִיטֵי אֶפְרַיִם
  choice: seorang pelarian Efraim
  rationale: פְּלִיטֵי berbentuk jamak dan berarti orang-orang yang lolos dari pertempuran. Bentuk tunggal distributif dipakai karena klausa berikut menggambarkan pemeriksaan setiap pelarian secara perseorangan.
- source_word: אֶעֱבֹרָה
  choice: Izinkan aku menyeberang
  rationale: Bentuk kohortatif orang pertama menyampaikan keinginan atau permohonan untuk menyeberang.
- source_word: הַאֶפְרָתִי אַתָּה
  choice: Apakah kamu orang Efraim?
  rationale: Bentuk gentilik menanyakan identitas kesukuan. 'Orang Efraim' merupakan padanan Indonesia yang alami.
- source_word: וַיֹּאמֶר לֹא
  choice: Jika ia menjawab, “Bukan,”
  rationale: Dalam rangkaian prosedural yang berulang, jawaban ini berfungsi sebagai kondisi bagi tindakan dalam ayat berikutnya. 'Bukan' adalah jawaban alami terhadap pertanyaan identitas dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan situasi dipertahankan dengan 'Setiap kali', sedangkan pergantian dari kelompok pelarian kepada seorang individu dibuat eksplisit agar alur pemeriksaan mudah diikuti. Ayat diakhiri dengan koma karena kalimat prosedural berlanjut ke ayat berikutnya.
