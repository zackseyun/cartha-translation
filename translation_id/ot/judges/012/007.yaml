base_translation:
  language: en
  yaml_path: translation/ot/judges/012/007.yaml
  text: Jephthah judged Israel six years[a]. Then Jephthah the Gileadite died and was buried in the cities of Gilead.
translation:
  language: id
  text: Yefta menjadi hakim atas Israel selama enam tahun. Kemudian Yefta, orang Gilead itu, meninggal dan dimakamkan di kota-kota Gilead[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di kota-kota Gilead.” Bentuk jamak ini mungkin merupakan ungkapan untuk suatu kota yang tidak disebutkan secara khusus di wilayah Gilead.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: memimpin ... sebagai hakim
  rationale: Dalam kitab Hakim-Hakim, verba שׁפט menunjuk pada peran hakim yang memimpin Israel; ungkapan ini mempertahankan istilah khas kitab tersebut sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: שֵׁשׁ שָׁנִים
  choice: selama enam tahun
  rationale: Frasa durasi diterjemahkan langsung dan alami.
- source_word: הַגִּלְעָדִי
  choice: orang Gilead itu
  rationale: Bentuk nisbah ini mengenali Yefta berdasarkan asal daerahnya; pilihan ini lebih alami daripada bentuk adjektival yang kaku.
- source_word: וַיִּקָּבֵר
  choice: dimakamkan
  rationale: Bentuk pasif Ibrani dipertahankan dengan padanan Indonesia yang lazim untuk pemberitahuan kematian.
- source_word: בְּעָרֵי גִלְעָד
  choice: di kota-kota Gilead
  rationale: Terjemahan ini mempertahankan bentuk jamak teks Masoret dan tidak diam-diam menentukan bahwa yang dimaksud ialah salah satu kota saja.
