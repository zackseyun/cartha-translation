base_translation:
  language: en
  yaml_path: translation/ot/judges/012/012.yaml
  text: Then Elon the Zebulunite died[a], and he was buried in Aijalon, in the land of Zebulun.
translation:
  language: id
  text: Kemudian Elon, orang Zebulon, meninggal dan dimakamkan di Ayalon, di tanah Zebulon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di wilayah Zebulon”.
    reason: אֶרֶץ dalam konteks ini dapat menunjuk pada tanah atau wilayah suku Zebulon.
lexical_decisions:
- source_word: וַיָּמָת
  choice: Kemudian ... meninggal
  rationale: Bentuk wayyiqtol dari מות melanjutkan urutan peristiwa dalam narasi. “Kemudian” menyatakan perkembangan naratif secara alami, sedangkan “meninggal” mempertahankan makna dasarnya.
- source_word: אֵלוֹן
  choice: Elon
  rationale: Nama pribadi ditransliterasikan dengan bentuk yang sudah lazim dalam bahasa Indonesia.
- source_word: הַזְּבוּלֹנִי
  choice: orang Zebulon itu
  rationale: Kata nisbah dengan artikel menunjukkan asal atau afiliasi suku Elon. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan fungsi artikel Ibrani.
- source_word: וַיִּקָּבֵר
  choice: dan dimakamkan
  rationale: Bentuk nifal dari קבר bermakna pasif, yaitu “dimakamkan”. Subjeknya tetap jelas dari klausa sebelumnya sehingga kata ganti tidak perlu diulang.
- source_word: בְּאַיָּלוֹן
  choice: di Ayalon
  rationale: Nama tempat ditransliterasikan; preposisi בְּ dalam konteks lokasi pemakaman diterjemahkan “di”.
- source_word: בְּאֶרֶץ זְבוּלֻן
  choice: di tanah Zebulon
  rationale: אֶרֶץ dapat berarti “tanah”, “negeri”, atau “wilayah”. “Tanah Zebulon” dekat dengan bentuk sumber dan wajar sebagai keterangan geografis.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, sederhana, dan bermartabat. Urutan klausa serta pengulangan nama Zebulon dipertahankan. Penanda catatan kaki ditempatkan setelah frasa yang diterangkannya, yaitu “tanah Zebulon”.
