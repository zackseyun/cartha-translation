source:
  edition: WLC
  text: וַ/יִּקְבֹּ֤ץ יִפְתָּח֙ אֶת כָּל אַנְשֵׁ֣י גִלְעָ֔ד וַ/יִּלָּ֖חֶם אֶת אֶפְרָ֑יִם וַ/יַּכּוּ֩ אַנְשֵׁ֨י גִלְעָ֜ד אֶת אֶפְרַ֗יִם כִּ֤י אָמְרוּ֙ פְּלִיטֵ֤י אֶפְרַ֨יִם֙ אַתֶּ֔ם גִּלְעָ֕ד בְּ/ת֥וֹךְ אֶפְרַ֖יִם בְּ/ת֥וֹךְ מְנַשֶּֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/004.yaml
  text: Then Jephthah gathered all the men of Gilead and fought with Ephraim. And the men of Gilead struck Ephraim down[a], because they had said, “You Gileadites are fugitives of Ephraim, in the midst of Ephraim and in the midst of Manasseh.”
translation:
  language: id
  text: Lalu Yefta mengumpulkan semua laki-laki Gilead dan berperang melawan Efraim. Orang-orang Gilead mengalahkan orang-orang Efraim karena orang Efraim telah berkata, “Kalian, orang Gilead, adalah pelarian dari Efraim, di tengah Efraim dan di tengah Manasye.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani pada tuduhan terakhir sulit dipahami. Kemungkinan lain: “Kalian adalah pelarian dari Efraim, hai Gilead, di antara Efraim dan di antara Manasye.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְבֹּץ
  choice: mengumpulkan
  rationale: Kata kerja קבץ berarti mengumpulkan atau menghimpun. Dalam konteks ini, “mengumpulkan” secara alami menyampaikan pengerahan untuk berperang tanpa menambahkan gagasan wajib militer.
- source_word: כָּל אַנְשֵׁי גִלְעָד
  choice: semua laki-laki Gilead
  rationale: Secara harfiah menunjuk kepada semua laki-laki Gilead; dalam konteks pertempuran mereka adalah pasukan yang dikerahkan. Pilihan ini mempertahankan penyebutan gender dalam teks sumber tanpa mempersempitnya menjadi “prajurit”.
- source_word: וַיִּלָּחֶם אֶת אֶפְרָיִם
  choice: berperang melawan Efraim
  rationale: Bentuk Niphal dari לחם dalam konteks militer berarti berperang. Preposisi “melawan” menyatakan pihak lawan secara wajar dalam bahasa Indonesia.
- source_word: וַיַּכּוּ
  choice: mengalahkan
  rationale: נכה dapat berarti memukul, menghantam, atau mengalahkan dalam perang. “Mengalahkan” paling alami untuk objek kolektif di sini dan tidak menyatakan bahwa setiap orang Efraim dibunuh.
- source_word: כִּי
  choice: karena
  rationale: כִּי memperkenalkan alasan bagi tindakan sebelumnya; “karena” jelas dan alami dalam bahasa Indonesia modern.
- source_word: פְּלִיטֵי אֶפְרַיִם
  choice: pelarian dari Efraim
  rationale: פְּלִיטִים menunjuk kepada orang yang lolos atau melarikan diri. “Pelarian” mempertahankan daya hinaan ungkapan itu, sedangkan “dari Efraim” mencerminkan hubungan konstruksi yang maknanya tetap sulit dalam konteks ini.
- source_word: אַתֶּם גִּלְעָד
  choice: Kalian, orang Gilead
  rationale: Nama wilayah dipakai secara kolektif untuk penduduknya. Bentuk sapaan ini alami dalam bahasa Indonesia dan tetap dekat dengan susunan Ibrani.
- source_word: בְּתוֹךְ אֶפְרַיִם בְּתוֹךְ מְנַשֶּׁה
  choice: di tengah Efraim dan di tengah Manasye
  rationale: בְּתוֹךְ berarti “di tengah” atau “di antara”. Pengulangan dipertahankan karena terdapat dalam teks Ibrani; “di antara Efraim dan Manasye” akan menafsirkan frasa itu sebagai letak di antara dua wilayah.
theological_decisions:
- issue: Hinaan yang secara sintaksis sulit pada klausa terakhir
  choice: “Kalian, orang Gilead, adalah pelarian dari Efraim, di tengah Efraim dan di tengah Manasye.”
  alternative: “Kalian adalah pelarian dari Efraim, hai Gilead, di antara Efraim dan di antara Manasye.”
  rationale: Bahasa Ibrani pada tuduhan ini padat dan janggal. Terjemahan utama mempertahankan bentuk ujaran langsung, arti leksikal פְּלִיטֵי, serta pengulangan בְּתוֹךְ tanpa menjelaskan hubungan antarkelompok secara berlebihan. Catatan kaki memperlihatkan kemungkinan pembacaan lain; tidak ada persoalan doktrinal yang perlu diputuskan.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Nama-nama mengikuti bentuk Indonesia yang lazim: Yefta, Efraim, dan Manasye. Kejanggalan tuduhan terakhir tidak dilicinkan sepenuhnya karena mencerminkan kesulitan asli teks Ibrani.'
