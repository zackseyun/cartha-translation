  text: Then Ibzan died and was buried in Bethlehem.
translation:
  language: id
  text: Kemudian Ibzan meninggal dan dimakamkan di Betlehem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: Kemudian ... meninggal
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi. “Kemudian” menyatakan urutan itu secara alami dalam bahasa Indonesia, sedangkan “meninggal” merupakan padanan yang jelas dan bermartabat untuk kematian seseorang.
- source_word: אִבְצָן
  choice: Ibzan
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וַיִּקָּבֵר
  choice: dimakamkan
  rationale: Bentuk Nifal di sini menyatakan makna pasif, yaitu bahwa Ibzan dikuburkan. “Dimakamkan” adalah ungkapan Indonesia yang alami dan bermartabat.
- source_word: בְּבֵית לָחֶם
  choice: di Betlehem
  rationale: Preposisi בְּ menyatakan lokasi dan secara alami diterjemahkan “di”; nama tempat בֵּית לָחֶם ditransliterasikan dalam bentuk Indonesia yang lazim, “Betlehem”.
