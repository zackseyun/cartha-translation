base_translation:
  language: en
  yaml_path: translation/ot/judges/012/015.yaml
  text: And Abdon son of Hillel the Pirathonite died[a], and he was buried in Pirathon, in the land of Ephraim, in the hill country of the Amalekites.
translation:
  language: id
  text: Lalu Abdon anak Hilel, orang Piraton, meninggal. Ia dimakamkan di Piraton, di wilayah Efraim, di pegunungan orang Amalek.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “di gunung orang Amalek.” Kata Ibrani yang diterjemahkan “pegunungan” berbentuk tunggal, dan sebutan “orang Amalek” juga berbentuk tunggal secara gramatikal, tetapi kemungkinan dipakai dalam arti kolektif atau teritorial.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: meninggal
  rationale: Kata kerja מות secara langsung menyatakan kematian; “meninggal” merupakan padanan Indonesia yang wajar, lugas, dan bermartabat.
- source_word: עַבְדּוֹן
  choice: Abdon
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בֶּן הִלֵּל
  choice: anak Hilel
  rationale: Hubungan keturunan dalam konstruksi Ibrani diterjemahkan secara alami sebagai “anak Hilel”; nama הִלֵּל ditulis Hilel mengikuti ejaan Indonesia.
- source_word: הַפִּרְעָתוֹנִי
  choice: orang Piraton itu
  rationale: Gentilik berartikel ini mengidentifikasi Abdon berdasarkan asalnya. Ungkapan “orang Piraton itu” alami dalam bahasa Indonesia dan mempertahankan sifat definitnya.
- source_word: וַיִּקָּבֵר
  choice: Ia dimakamkan
  rationale: Bentuk nifal dari קבר menyatakan tindakan pasif; subjek dinyatakan kembali agar kalimat Indonesia jelas dan lancar.
- source_word: בְּפִרְעָתוֹן
  choice: di Piraton
  rationale: Preposisi בְּ diterjemahkan secara lokatif, dan nama tempat ditransliterasikan.
- source_word: בְּאֶרֶץ אֶפְרַיִם
  choice: di wilayah Efraim
  rationale: אֶרֶץ di sini menunjukkan kawasan geografis. “Wilayah Efraim” mempertahankan unsur tersebut dengan ungkapan Indonesia yang alami.
- source_word: בְּהַר הָעֲמָלֵקִי
  choice: di pegunungan orang Amalek
  rationale: Dalam keterangan kawasan, הַר dapat menunjuk daerah pegunungan, bukan hanya satu gunung. Bentuk gentilik tunggal dapat dipahami secara kolektif atau teritorial; “orang Amalek” mempertahankan bentuk kolektif yang alami dalam bahasa Indonesia.
