review_pass:
  verdict: revise
  source_fidelity: Frasa “datang menyelamatkan” menambahkan unsur ‘datang’ yang tidak terdapat dalam Ibrani. Partisip מוֹשִׁיעַ menyatakan bahwa lawan bicara tidak memberi pertolongan/penyelamatan. Terjemahan revisi menghapus tambahan ini. Gerak menyeberang menuju musuh dipertahankan tanpa menyatakan tujuan yang terlalu eksplisit.
  naturalness: Revisi memakai bahasa Indonesia modern yang lugas. “Orang Amon” lebih alami dalam prosa Indonesia modern daripada “bani Amon,” sambil tetap mempertahankan sebutan etnisnya. Peralihan kamu (tunggal) ke kalian (jamak) tetap jelas.
  terminology: “Yahweh” tepat untuk יְהוָה sesuai keputusan proyek. “Mempertaruhkan nyawaku” menyampaikan idiom Ibrani secara alami, dan catatan kaki mempertahankan citra harfiahnya. Istilah “orang Amon” merupakan padanan etnonim yang jelas dan netral.
  issues:
  - severity: medium
    issue: Tambahan kata “datang” dalam “kamu tidak datang menyelamatkan kami.”
    rationale: Teks Ibrani hanya menyatakan bahwa pihak yang disapa tidak sedang/ tidak memberi pertolongan; tidak ada verba gerak ‘datang’. Tambahan tersebut tidak diperlukan untuk kelengkapan bahasa Indonesia dan sedikit mempersempit makna.
  - severity: low
    issue: “Untuk menyerang” setelah “menyeberang” membuat tujuan serangan lebih eksplisit daripada verba arah אֶל itu sendiri.
    rationale: Konteksnya memang peperangan, tetapi “menyeberang menghadapi orang Amon” mempertahankan arah gerak terhadap lawan dengan lebih dekat dan tetap alami.
  revised_text: Ketika aku melihat bahwa kamu tidak menolong kami, aku mempertaruhkan nyawaku[a] dan menyeberang untuk menghadapi orang Amon. Yahweh menyerahkan mereka ke dalam tanganku. Jadi, mengapa hari ini kalian maju menyerang aku untuk berperang melawan aku?
