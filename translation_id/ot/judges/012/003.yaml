  variant: modern standard Indonesian
source:
  edition: WLC
  text: וָֽ/אֶרְאֶ֞ה כִּֽי אֵינְ/ךָ֣ מוֹשִׁ֗יע וָ/אָשִׂ֨ימָ/ה נַפְשִׁ֤/י בְ/כַפִּ/י֙ וָֽ/אֶעְבְּרָ/ה֙ אֶל בְּנֵ֣י עַמּ֔וֹן וַ/יִּתְּנֵ֥/ם יְהוָ֖ה בְּ/יָדִ֑/י וְ/לָ/מָ֞ה עֲלִיתֶ֥ם אֵלַ֛/י הַ/יּ֥וֹם הַ/זֶּ֖ה לְ/הִלָּ֥חֶם בִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/003.yaml
  text: When I saw that you were not delivering us[a], I put my life in my hand and crossed over against the Ammonites, and Yahweh gave them into my hand. So why have you come up against me today to fight against me?
translation:
  language: id
  text: Ketika aku melihat bahwa kamu tidak menolong kami, aku mempertaruhkan nyawaku[a] dan menyeberang untuk menghadapi orang Amon. Yahweh menyerahkan mereka ke dalam tanganku. Jadi, mengapa hari ini kalian maju menyerang aku untuk berperang melawan aku?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “aku menaruh nyawaku di telapak tanganku,” sebuah ungkapan yang berarti “aku mempertaruhkan nyawaku.”'
    reason: cultural_note
lexical_decisions:
- source_word: וָאֶרְאֶה
  choice: Ketika aku melihat
  rationale: Bentuk wayyiqtol dari ראה menyatakan pengamatan yang mendorong tindakan berikutnya; konstruksi temporal-kausal ini wajar dalam bahasa Indonesia.
- source_word: כִּי אֵינְךָ מוֹשִׁיעַ
  choice: bahwa kamu tidak datang menyelamatkan kami
  rationale: מוֹשִׁיעַ menunjuk pada pertolongan atau penyelamatan dalam konteks militer. Subjek orang kedua tunggal dipertahankan sebagai 'kamu', sedangkan objek 'kami' tersirat dari konteks dan diperlukan agar kalimat Indonesia lengkap. 'Datang' memperjelas bahwa pertolongan yang diharapkan tidak diberikan tanpa mengubah inti tuduhan.
- source_word: וָאָשִׂימָה נַפְשִׁי בְכַפִּי
  choice: aku mempertaruhkan nyawaku
  rationale: Ungkapan harfiah 'menaruh nyawaku di telapak tanganku' merupakan idiom Ibrani yang berarti menghadapkan diri pada bahaya maut. Padanan idiomatis Indonesia menyampaikan maknanya secara langsung, sementara citra aslinya dicatat dalam catatan kaki.
- source_word: וָאֶעְבְּרָה אֶל בְּנֵי עַמּוֹן
  choice: dan menyeberang untuk menyerang bani Amon
  rationale: עבר dengan אֶל dalam narasi perang menggambarkan gerak menyeberang menuju lawan. 'Untuk menyerang' menyatakan arah bermusuhan yang ditunjukkan konteks.
- source_word: בְּנֵי עַמּוֹן
  choice: bani Amon
  rationale: Ini merupakan sebutan etnis yang baku dan mudah dipahami dalam bahasa Indonesia Alkitabiah modern.
- source_word: וַיִּתְּנֵם יְהוָה בְּיָדִי
  choice: Yahweh menyerahkan mereka ke dalam tanganku
  rationale: Rumusan kemenangan ini dipertahankan dengan citra 'ke dalam tanganku', yang menyatakan bahwa musuh ditempatkan di bawah kuasa Yefta.
- source_word: וְלָמָה עֲלִיתֶם אֵלַי
  choice: Jadi, mengapa ... kalian maju menyerang aku
  rationale: Bentuk orang kedua jamak dibedakan dari 'kamu' yang tunggal sebelumnya. עלה dalam konteks militer berarti maju melawan atau menyerang.
- source_word: הַיּוֹם הַזֶּה
  choice: hari ini
  rationale: Padanan alami bahasa Indonesia modern bagi ungkapan waktu Ibrani tersebut.
- source_word: לְהִלָּחֶם בִּי
  choice: untuk berperang melawan aku
  rationale: Infinitif Niphal לחם dengan ב menyatakan tindakan tempur yang diarahkan melawan seseorang; terjemahan ini mempertahankan daya adversatifnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung. Bentuk 'Yahweh' mempertahankannya sebagai nama diri, bukan menggantinya dengan gelar.
- issue: Peralihan dari orang kedua tunggal ke jamak
  choice: '''kamu'' untuk אֵינְךָ dan ''kalian'' untuk עֲלִיתֶם'
  alternative: Memakai 'kalian' pada keduanya berdasarkan kelompok Efraim sebagai lawan bicara
  rationale: Teks Ibrani benar-benar beralih dari bentuk tunggal kepada bentuk jamak. Terjemahan mempertahankan peralihan itu tanpa menetapkan secara pasti apakah bentuk tunggal menyapa pemimpin atau memandang kelompok sebagai satu kesatuan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina 'aku' sesuai dengan tuturan langsung naratif. Perbedaan tunggal 'kamu' dan jamak 'kalian' dipertahankan karena terdapat dalam teks Ibrani. Idiom tentang nyawa diterjemahkan menurut maknanya agar alami, dengan bentuk harfiahnya disimpan dalam catatan kaki.
