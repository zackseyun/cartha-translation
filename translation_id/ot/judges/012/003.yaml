  revision_rationale: Revisi menghapus unsur ‘datang’ yang tidak didukung sumber, melunakkan penjelasan arah gerak menjadi “untuk menghadapi,” dan memakai etnonim Indonesia modern “orang Amon.” Makna idiom, nama ilahi, dan peralihan orang kedua tunggal ke jamak tetap dipertahankan.
