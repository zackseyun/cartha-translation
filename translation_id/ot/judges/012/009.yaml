translation_notes:
  register: Bahasa Indonesia baku yang modern dan bermartabat. Susunan kalimat pertama dipecah agar hubungan kepemilikan jelas dan tidak terasa kaku. Ungkapan “ke luar” dan “dari luar” dipertahankan untuk mencerminkan kontras dalam teks Ibrani, sedangkan konteks perkawinan dijelaskan dalam catatan kaki.
