base_translation:
  language: en
  yaml_path: translation/ot/judges/012/009.yaml
  text: He had thirty sons[a], and thirty daughters he sent away, and he brought in thirty daughters from outside for his sons. And he judged Israel seven years.
translation:
  language: id
  text: Ia mempunyai tiga puluh anak laki-laki dan tiga puluh anak perempuan. Anak-anak perempuannya itu ia kirim ke luar[a], dan ia mendatangkan tiga puluh anak perempuan dari luar bagi putra-putranya. Ia menghakimi Israel selama tujuh tahun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan menyatakan maksudnya secara lebih jelas, “ia menikahkan ketiga puluh anak perempuannya ke luar dari kaum atau rumah tangganya, lalu mendatangkan tiga puluh perempuan dari luar bagi putra-putranya.” Teks Ibrani secara harfiah memakai kata “anak perempuan” dalam kedua bagian itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי לוֹ
  choice: Ia mempunyai
  rationale: Ungkapan היה + ל menyatakan kepemilikan. “Ia mempunyai” merupakan padanan Indonesia yang alami dan tepat.
- source_word: שְׁלֹשִׁים בָּנִים
  choice: tiga puluh anak laki-laki
  rationale: Menerjemahkan bilangan dan istilah kekerabatan secara langsung serta mempertahankan jenis kelamin yang dinyatakan teks.
- source_word: וּשְׁלֹשִׁים בָּנוֹת
  choice: dan tiga puluh anak perempuan
  rationale: Padanan langsung untuk frasa Ibrani; “anak perempuan” dipertahankan sesuai kata sumber.
- source_word: שִׁלַּח הַחוּצָה
  choice: ia kirim ke luar
  rationale: Mempertahankan makna dasar שׁלח, “mengirim,” dan arah הַחוּצָה, “ke luar,” tanpa menjadikan dugaan tentang pernikahan sebagai makna eksplisit dalam teks utama.
- source_word: וּשְׁלֹשִׁים בָּנוֹת הֵבִיא לְבָנָיו מִן הַחוּץ
  choice: dan ia mendatangkan tiga puluh anak perempuan dari luar bagi anak-anak lelakinya
  rationale: Mempertahankan pengulangan “anak perempuan” dalam bahasa Ibrani dan kontras arah antara “ke luar” dan “dari luar.” Konteks sangat mungkin merujuk pada perempuan yang didatangkan sebagai istri, tetapi teks utama tidak menyatakannya secara eksplisit.
- source_word: וַיִּשְׁפֹּט אֶת יִשְׂרָאֵל
  choice: Ia menghakimi Israel
  rationale: “Menghakimi” mempertahankan istilah berulang שׁפט yang menjadi ciri kitab Hakim-Hakim dan peran tokoh sebagai hakim, tanpa mempersempitnya menjadi sekadar “memimpin” atau “memerintah.”
- source_word: שֶׁבַע שָׁנִים
  choice: selama tujuh tahun
  rationale: “Selama” membuat fungsi frasa waktu tersebut alami dan jelas dalam bahasa Indonesia.
