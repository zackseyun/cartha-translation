  to: Yefta berkata kepada mereka[a], “Aku dan rakyatku berada dalam pertikaian yang sangat sengit dengan bani Amon. Aku berseru meminta bantuan kepada kalian, tetapi kalian tidak menyelamatkan aku dari tangan mereka.”
