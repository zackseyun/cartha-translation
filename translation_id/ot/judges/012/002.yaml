base_translation:
  language: en
  yaml_path: translation/ot/judges/012/002.yaml
  text: Jephthah said to them[a], “I and my people were in a bitter conflict with the Ammonites, and I called out to you, but you did not save me from their hand.”
translation:
  language: id
  text: Yefta berkata kepada mereka[a], “Aku dan rakyatku berada dalam pertikaian yang sangat sengit dengan bani Amon. Aku berseru meminta bantuan kepada kalian, tetapi kalian tidak menyelamatkan aku dari tangan mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, secara lebih harfiah: “Aku adalah seorang yang bertikai—aku dan rakyatku—dengan bani Amon dengan sangat sengit.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ רִיב ... מְאֹד
  choice: sedang terlibat dalam pertikaian yang sangat sengit
  rationale: Ungkapan harfiah ‘seorang yang bertikai’ bersama היה menerangkan keadaan Yefta, bukan semata-mata wataknya. ‘Terlibat dalam pertikaian yang sangat sengit’ menyampaikan רִיב serta penguatan מְאֹד secara wajar dalam bahasa Indonesia.
- source_word: וְעַמִּי
  choice: dan rakyatku
  rationale: עַם berarti ‘rakyat/umat’. ‘Rakyatku’ mempertahankan cakupan kolektif tanpa mempersempitnya menjadi tentara.
- source_word: וּבְנֵי עַמּוֹן
  choice: dengan bani Amon
  rationale: ‘Bani Amon’ adalah sebutan etnis yang lazim dan dekat dengan bentuk Ibrani ‘anak-anak Amon’.
- source_word: וָאֶזְעַק אֶתְכֶם
  choice: Aku berseru meminta bantuan kepada kalian
  rationale: זעק dalam konteks ini menunjuk pada seruan memohon pertolongan. Penambahan ‘meminta bantuan’ membuat maksud seruan jelas tanpa mengubah referennya.
- source_word: וְלֹא הוֹשַׁעְתֶּם אוֹתִי
  choice: tetapi kalian tidak menyelamatkan aku
  rationale: Bentuk kausatif ישׁע berarti menyelamatkan atau melepaskan. ‘Menyelamatkan’ langsung dan sesuai dengan konteks ancaman militer.
- source_word: מִיָּדָם
  choice: dari tangan mereka
  rationale: Terjemahan ini mempertahankan metafora Ibrani mengenai tangan sebagai kuasa atau kendali, yang tetap mudah dipahami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Kalian’ dipakai karena Yefta berbicara kepada kelompok. Susunan kalimat dibuat alami sambil mempertahankan citra ‘tangan mereka’ dan ketegangan ungkapan Ibrani melalui catatan kaki.
