  text: After him, Elon the Zebulunite judged Israel ten years.
translation:
  language: id
  text: Sesudah dia, Elon, orang Zebulon, menghakimi Israel selama sepuluh tahun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: menghakimi
  rationale: Mempertahankan istilah berulang dari akar שׁפט dalam kitab Hakim-Hakim dan tidak mempersempit perannya menjadi sekadar memimpin atau memerintah.
- source_word: אַחֲרָיו
  choice: Sesudah dia
  rationale: Menerjemahkan bentuk pronominal secara langsung dan membiarkan konteks menentukan bahwa kata ganti itu merujuk kepada hakim sebelumnya.
- source_word: אֵילוֹן
  choice: Elon
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dan dekat dengan bunyi Ibrani.
- source_word: הַזְּבוּלֹנִי
  choice: orang Zebulon
  rationale: Menyatakan afiliasi suku Elon secara alami dalam bahasa Indonesia modern.
- source_word: עֶשֶׂר שָׁנִים
  choice: selama sepuluh tahun
  rationale: Ungkapan durasi ini diterjemahkan secara idiomatis dan jelas.
- source_word: וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל ... וַיִּשְׁפֹּט אֶת־יִשְׂרָאֵל
  choice: menghakimi Israel selama sepuluh tahun
  rationale: Pengulangan verba Ibrani diringkas agar kalimat alami dalam bahasa Indonesia, sementara pelaku, tindakan, objek, dan durasinya tetap terpelihara sepenuhnya.
theological_decisions:
- issue: Cakupan peran שׁפט dalam kitab Hakim-Hakim
  choice: menghakimi
  alternative: memimpin; memerintah
  rationale: Pilihan ini menjaga istilah khas kitab tersebut dan tidak memutuskan apakah peran Elon terutama bersifat yudisial, pemerintahan, atau kepemimpinan.
translation_notes:
  register: Bahasa Indonesia modern yang ringkas dan bermartabat. Koma mengapit aposisi “orang Zebulon,” dan “selama” memperjelas bahwa sepuluh tahun adalah durasi tugas Elon.
