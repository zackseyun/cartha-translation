  register: Bahasa Indonesia modern yang lugas dan bermartabat. Bentuk kolektif Ibrani dibuat alami dalam bahasa Indonesia, sedangkan ambiguitas mengenai Zafon dan gambaran harfiah dalam ancaman dipertahankan melalui catatan kaki.
