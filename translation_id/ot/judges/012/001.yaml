  to: Lalu orang-orang Efraim[b] dikerahkan. Mereka menyeberang ke Zafon[a] dan berkata kepada Yefta, “Mengapa engkau menyeberang untuk berperang melawan orang Amon, tetapi tidak memanggil kami untuk pergi bersamamu? Kami akan membakar rumahmu dengan api sementara engkau berada di dalamnya.”[c]
