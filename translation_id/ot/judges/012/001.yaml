base_translation:
  language: en
  yaml_path: translation/ot/judges/012/001.yaml
  text: Then the men of Ephraim were called together[a], and they crossed over to Zaphon and said to Jephthah[c][b], “Why did you cross over to fight against the Ammonites and not call us to go with you? We will burn your house down over you with fire.”
translation:
  language: id
  text: Lalu orang-orang Efraim[b] dikerahkan. Mereka menyeberang ke Zafon[a] dan berkata kepada Yefta, “Mengapa engkau menyeberang untuk berperang melawan orang Amon, tetapi tidak memanggil kami untuk pergi bersamamu? Kami akan membakar rumahmu dengan api sementara engkau berada di dalamnya.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke arah utara”, jika צָפוֹנָה dipahami sebagai kata keterangan arah dan bukan nama tempat Zafon.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, bahasa Ibrani memakai bentuk tunggal, “orang Efraim”, tetapi verba-verba dalam konteks ini menunjukkan arti kolektif, yaitu orang-orang Efraim sebagai satu kelompok.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “Kami akan membakar rumahmu di atasmu dengan api.” Ancaman ini tampaknya berarti bahwa mereka akan membakar rumah itu sementara Yefta berada di dalamnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּעֵק אִישׁ אֶפְרַיִם
  choice: orang-orang Efraim dikerahkan
  rationale: Bentuk verba menunjukkan bahwa kelompok itu dihimpun atau dikerahkan. Walaupun אִישׁ berbentuk tunggal, verba jamak berikutnya menunjukkan bahwa ungkapan ini berfungsi secara kolektif dan merujuk kepada orang-orang Efraim.
- source_word: וַיַּעֲבֹר
  choice: mereka menyeberang
  rationale: Verba Ibrani berbentuk tunggal karena mengikuti subjek kolektif, tetapi konteks dan verba jamak sesudahnya menunjukkan bahwa seluruh kelompok melakukan tindakan tersebut.
- source_word: צָפוֹנָה
  choice: ke Zafon
  rationale: Bentuk ini paling mungkin merupakan nama tempat, Zafon, yang menjadi tujuan penyeberangan mereka; kemungkinan sebagai kata keterangan arah tetap dicatat dalam catatan kaki.
- source_word: לְהִלָּחֵם בִּבְנֵי עַמּוֹן
  choice: untuk berperang melawan bani Amon
  rationale: Ungkapan ini menyatakan tindakan berperang melawan keturunan atau bangsa Amon. 'Bani Amon' merupakan sebutan yang alami dan dikenal dalam bahasa Indonesia Alkitabiah.
- source_word: וְלָנוּ לֹא קָרָאתָ לָלֶכֶת עִמָּךְ
  choice: tetapi tidak memanggil kami untuk pergi bersamamu
  rationale: קרא dalam konteks ini berarti memanggil atau mengikutsertakan mereka dalam peperangan. Kata penghubung 'tetapi' menyampaikan pertentangan yang tersirat secara alami dalam keluhan mereka.
- source_word: בֵּיתְךָ נִשְׂרֹף עָלֶיךָ בָּאֵשׁ
  choice: Kami akan membakar rumahmu dengan engkau di dalamnya
  rationale: Terjemahan ini menyampaikan ancaman bahwa Yefta akan ikut terbakar bersama rumahnya. Ungkapan harfiah 'di atasmu' tidak alami dalam bahasa Indonesia dan maknanya dijelaskan dalam catatan kaki.
