  text: He had forty sons and thirty grandsons, riding on seventy donkeys, and he judged Israel eight years.
translation:
  language: id
  text: Ia mempunyai empat puluh anak laki-laki dan tiga puluh cucu laki-laki; mereka mengendarai tujuh puluh keledai. Ia menjadi hakim atas Israel selama delapan tahun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּנִים
  choice: anak laki-laki
  rationale: Dalam konteks silsilah keluarga dan jumlah tunggangan, kata ini secara khusus merujuk kepada putra-putranya.
- source_word: בְּנֵי בָנִים
  choice: cucu laki-laki
  rationale: Secara harfiah berarti 'anak-anak dari anak-anak laki-laki' dan dalam konteks ini menunjuk kepada para cucu laki-laki.
- source_word: עֲיָרִם
  choice: keledai
  rationale: Bentuk ini merujuk kepada keledai jantan muda; 'keledai' merupakan padanan alami tanpa menambahkan rincian yang tidak diperlukan.
- source_word: וַיִּשְׁפֹּט אֶת יִשְׂרָאֵל
  choice: Ia memimpin Israel sebagai hakim
  rationale: Kata kerja שׁפט dalam kitab Hakim-Hakim mencakup fungsi memerintah atau memimpin sebagai hakim, bukan hanya mengadili perkara.
