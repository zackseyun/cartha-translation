  text: וַ/יֹּ֣אמְרוּ ל/וֹ֩ אֱמָר נָ֨א שִׁבֹּ֜לֶת וַ/יֹּ֣אמֶר סִבֹּ֗לֶת וְ/לֹ֤א יָכִין֙ לְ/דַבֵּ֣ר כֵּ֔ן וַ/יֹּאחֲז֣וּ אוֹת֔/וֹ וַ/יִּשְׁחָט֖וּ/הוּ אֶל מַעְבְּר֣וֹת הַ/יַּרְדֵּ֑ן וַ/יִּפֹּ֞ל בָּ/עֵ֤ת הַ/הִיא֙ מֵֽ/אֶפְרַ֔יִם אַרְבָּעִ֥ים וּ/שְׁנַ֖יִם אָֽלֶף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/012/006.yaml
  text: Then they said to him[a], “Please say ‘Shibboleth.’” But he said, “Sibboleth,” because he could not say it that way. So they seized him and slaughtered him at the fords of the Jordan. At that time forty-two thousand from Ephraim fell.
translation:
  language: id
  text: Lalu kata mereka kepadanya, “Coba ucapkan ‘Syibolet.’[a]” Tetapi ia mengucapkan, “Sibolet,” sebab ia tidak dapat mengucapkannya dengan cara itu. Maka mereka menangkap dan menyembelihnya di tempat-tempat penyeberangan Sungai Yordan. Pada waktu itu, empat puluh dua ribu orang dari Efraim tewas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani Syibolet dapat berarti “bulir gandum” atau “aliran air/banjir”, tetapi di sini digunakan sebagai kata untuk menguji pelafalan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמָר נָא
  choice: Coba ucapkan
  rationale: Imperatif dengan partikel נָא bernada permintaan. Dalam konteks tes pelafalan, “Coba ucapkan” alami dalam bahasa Indonesia dan tidak mengubahnya menjadi perintah yang kasar.
- source_word: שִׁבֹּלֶת
  choice: Syibolet
  rationale: Di sini kata tersebut berfungsi sebagai kata uji pelafalan, sehingga ditransliterasikan. Ejaan “Syibolet” menampilkan bunyi awal /sy/ yang dikontraskan dengan /s/.
- source_word: סִבֹּלֶת
  choice: Sibolet
  rationale: Transliterasi mempertahankan kontras utama antara bunyi awal שׁ dan ס dalam narasi.
- source_word: וְלֹא יָכִין לְדַבֵּר כֵּן
  choice: sebab ia tidak dapat mengucapkannya dengan cara itu
  rationale: Ungkapan Ibrani secara harfiah menyatakan bahwa ia tidak mampu mengarahkan atau menyiapkan diri untuk berbicara demikian. Konteks menunjukkan ketidakmampuan menghasilkan pelafalan yang diminta, tanpa memberi penilaian “benar” atau “salah” yang tidak dinyatakan teks.
- source_word: וַיֹּאחֲזוּ אוֹתוֹ
  choice: mereka menangkap
  rationale: אחז berarti memegang atau menangkap; dalam konteks penahanan sesudah tes pelafalan, “menangkap” paling alami.
- source_word: וַיִּשְׁחָטוּהוּ
  choice: menyembelihnya
  rationale: שׁחט lebih kuat dan lebih konkret daripada kata umum “membunuh”; “menyembelih” mempertahankan kekerasan ungkapan sumber.
- source_word: אֶל מַעְבְּרוֹת הַיַּרְדֵּן
  choice: di tempat-tempat penyeberangan Sungai Yordan
  rationale: מַעְבְּרוֹת menunjuk tempat-tempat untuk menyeberangi sungai. Bentuk ini tepat dan lebih mudah dipahami daripada istilah teknis “arungan”.
- source_word: וַיִּפֹּל ... מֵאֶפְרַיִם
  choice: orang dari Efraim tewas
  rationale: Dalam konteks konflik, נפל berarti gugur atau tewas. “Orang dari Efraim” mempertahankan konstruksi sumber tanpa harus menentukannya sebagai wilayah atau suku secara eksplisit.
- source_word: אַרְבָּעִים וּשְׁנַיִם אָלֶף
  choice: empat puluh dua ribu
  rationale: Angka kardinal diterjemahkan langsung dan dipertahankan tepat.
theological_decisions: []
translation_notes:
