  yaml_path: translation/ot/judges/005/029.yaml
  text: 'Her wisest princesses answer her; indeed, she herself repeats her words to herself:'
translation:
  language: id
  text: Para bangsawan perempuannya yang bijaksana menjawabnya; bahkan ia sendiri mengulangi perkataannya kepada dirinya sendiri:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: bahkan ia sendiri menjawab perkataannya sendiri.'
    reason: Menjaga kemungkinan arti yang lebih harfiah dari תָּשִׁיב אֲמָרֶיהָ לָהּ.
lexical_decisions:
- source_word: חַכְמוֹת שָׂרוֹתֶיהָ
  choice: para bangsawan perempuannya yang bijaksana
  rationale: Bentuk feminin jamak menunjuk kepada perempuan-perempuan bijaksana di kalangan para pembesar atau putri istana miliknya. Ungkapan ini menghindari kesan bahwa mereka adalah anak-anak perempuannya.
- source_word: תַּעֲנֶינָּה
  choice: menjawabnya
  rationale: Kata kerja ini secara langsung berarti bahwa para perempuan itu memberi jawaban kepadanya.
- source_word: אַף הִיא
  choice: bahkan ia sendiri
  rationale: Mempertahankan penegasan bahwa ibu Sisera turut mengucapkan tanggapan tersebut.
- source_word: תָּשִׁיב אֲמָרֶיהָ לָהּ
  choice: mengulangi perkataannya kepada dirinya sendiri
  rationale: Secara harfiah ungkapan ini menggambarkan dia mengembalikan perkataannya kepada dirinya sendiri; dalam konteksnya, ia mengulang atau meneguhkan jawaban itu bagi dirinya sendiri.
theological_decisions:
- issue: Apakah ibu Sisera menjawab dirinya sendiri atau mengulangi perkataannya
  choice: Teks utama memakai “mengulangi perkataannya kepada dirinya sendiri”
  alternative: “menjawab perkataannya sendiri”
  rationale: Bentuk Ibrani dapat berarti mengembalikan atau menjawab perkataan. Konteks nyanyian mendukung gagasan bahwa ia mengulang jawaban yang menenangkan dirinya, sementara alternatif yang lebih harfiah dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern dan bermartabat. “Bangsawan perempuan” dipilih daripada “putri-putri” agar tidak disalahpahami sebagai anak perempuan, dan susunan puitis ayat dipertahankan.
