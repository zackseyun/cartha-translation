base_translation:
  language: en
  yaml_path: translation/ot/judges/005/008.yaml
  text: They chose new gods[a]; then war was at the gates[b]. Was a shield or spear to be seen among forty thousand in Israel?
translation:
  language: id
  text: Mereka memilih ilah-ilah baru[a]; lalu perang terjadi di gerbang-gerbang[b]. Adakah perisai ataupun tombak terlihat di antara empat puluh ribu orang di Israel?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “ia/seseorang memilih ilah-ilah baru.” Verba Ibraninya berbentuk tunggal, tetapi maksudnya lazim dipahami secara kolektif sebagai umat Israel.
    reason: alternative_reading
  - marker: b
    text: 'Bahasa Ibrani pada baris ini sulit. Kemungkinan lain: “lalu pertempuran terjadi di gerbang-gerbang,” atau ungkapan serupa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִבְחַר
  choice: Mereka memilih
  rationale: Bentuk Ibraninya adalah orang ketiga tunggal, tetapi dalam konteks nyanyian ini subjeknya paling wajar dipahami secara tak tentu atau kolektif, yakni umat Israel. Bentuk jamak dalam bahasa Indonesia menyampaikan tuduhan itu dengan jelas; ketidaksesuaian gramatikal sumber tetap dicatat dalam catatan kaki.
- source_word: אֱלֹהִים חֲדָשִׁים
  choice: ilah-ilah baru
  rationale: Dalam konteks ini frasa tersebut menunjuk kepada dewa-dewa asing, bukan Allah Israel. Kata 'ilah-ilah' mempertahankan bentuk jamak dan nada polemis dengan bahasa yang wajar serta bermartabat.
- source_word: אָז
  choice: lalu
  rationale: Adverbia ini menghubungkan pemilihan ilah-ilah baru dengan krisis yang menyusul. 'Lalu' menyatakan urutan atau akibat secara ringkas tanpa mempertegas hubungan kausal yang tidak dinyatakan secara eksplisit.
- source_word: לָחֶם שְׁעָרִים
  choice: perang sampai ke pintu-pintu gerbang
  rationale: Ungkapan Ibraninya padat dan sulit. Memahami לָחֶם sebagai 'perang/pertempuran' menghasilkan gambaran bahwa konflik telah mencapai gerbang-gerbang kota; 'sampai ke' menyampaikan jangkauan itu secara alami dalam bahasa Indonesia.
- source_word: מָגֵן
  choice: perisai
  rationale: Padanan militer baku dan langsung dalam bahasa Indonesia.
- source_word: אִם יֵרָאֶה
  choice: Adakah ... terlihat
  rationale: Ungkapan ini berfungsi sebagai pertanyaan retoris yang menekankan ketiadaan senjata. Susunan 'Adakah ... terlihat' alami dan mempertahankan bentuk pasif dari gagasan 'dilihat/terlihat'.
- source_word: וָרֹמַח
  choice: ataupun tombak
  rationale: רֹמַח adalah senjata tikam bertangkai panjang; 'tombak' merupakan padanan modern yang paling jelas. Dalam pertanyaan negatif retoris, 'ataupun' secara idiomatis mencakup kedua jenis senjata tanpa mengubah maksud.
- source_word: בְּאַרְבָּעִים אֶלֶף
  choice: di antara empat puluh ribu orang
  rationale: Preposisi ב menandai kelompok tempat senjata itu dicari. Kata 'orang' ditambahkan secara wajar untuk memperjelas bahwa angka tersebut menghitung anggota Israel, bukan benda.
- source_word: בְּיִשְׂרָאֵל
  choice: di Israel
  rationale: Padanan lokatif dan sosial yang alami untuk lingkup bangsa Israel.
theological_decisions:
- issue: Subjek verba pembuka
  choice: 'Subjek dipahami sebagai umat Israel secara kolektif: ''Mereka memilih ilah-ilah baru.'''
  alternative: Ia/seseorang memilih ilah-ilah baru; atau Allah memilih hal-hal baru.
  rationale: Konteks langsung membicarakan penyimpangan Israel dan penindasan yang menyusul. Menjadikan Allah subjek yang memilih 'ilah-ilah baru' tidak sesuai dengan konteks dan menimbulkan pernyataan teologis yang janggal. Namun, karena verba sumber memang berbentuk tunggal dan subjek tidak dinyatakan, fakta ini dicatat agar ambiguitas gramatikal tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang ringkas dan bermartabat. 'Ilah-ilah' dipilih daripada 'dewa-dewa' agar selaras dengan register Alkitab Indonesia tanpa memasukkan kekhasan denominasi. Pertanyaan retoris pada paruh kedua dipertahankan.
