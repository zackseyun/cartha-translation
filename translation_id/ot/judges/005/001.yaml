  text: 'Then Deborah and Barak son of Abinoam sang on that day[a], saying:'
translation:
  language: id
  text: 'Pada hari itu, Debora dan Barak anak Abinoam bernyanyi[a] demikian:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, kata kerjanya berbentuk feminin tunggal, secara harfiah, ‘Debora bernyanyi’, lalu diikuti oleh ‘dan Barak’. Dalam konteksnya, Debora dan Barak bernyanyi bersama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשַׁר
  choice: bernyanyi
  rationale: Berasal dari שׁיר, ‘bernyanyi’. Bentuk verba feminin tunggal sesuai dengan Debora sebagai subjek pertama, sedangkan Barak kemudian dihubungkan dengannya. Dalam bahasa Indonesia, subjek majemuk ‘Debora dan Barak’ wajar diikuti verba tanpa penandaan jumlah. Tidak ditambahkan kata ‘nyanyian’ karena tidak tersurat dalam ayat ini.
- source_word: דְּבוֹרָה
  choice: Debora
  rationale: Bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וּבָרָק
  choice: dan Barak
  rationale: Konjungsi וּ diterjemahkan ‘dan’, disusul bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: בֶּן אֲבִינֹעַם
  choice: anak Abinoam
  rationale: Konstruksi patronimik Ibrani diterjemahkan secara alami sebagai ‘anak Abinoam’.
- source_word: בַּיּוֹם הַהוּא
  choice: Pada hari itu
  rationale: Mempertahankan frasa temporal yang menunjuk pada hari tertentu dalam alur kisah; penempatannya di awal menghasilkan susunan Indonesia yang alami dan bermartabat.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Bentuk infinitif ini berfungsi sebagai pengantar kutipan atau isi nyanyian. ‘Demikian:’ lebih alami daripada ‘dengan berkata’ untuk memperkenalkan syair panjang yang langsung menyusul.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang alami dan bermartabat. Susunan temporal ditempatkan di awal. Koma sebelum penanda catatan kaki memisahkan klausa pengantar dari ‘demikian:’, sementara catatan mempertahankan ciri gramatikal Ibrani yang tidak dapat ditampilkan secara langsung dalam verba bahasa Indonesia.
