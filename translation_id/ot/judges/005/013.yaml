id: JDG.5.13
reference: Judges 5:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אָ֚ז יְרַ֣ד שָׂרִ֔יד לְ/אַדִּירִ֖ים עָ֑ם יְהוָ֕ה יְרַד לִ֖/י בַּ/גִּבּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/013.yaml
  text: Then the remnant came down against the nobles[b][a]; the people of Yahweh came down for me against the mighty.
translation:
  language: id
  text: Kemudian kaum yang tersisa turun melawan kaum bangsawan[a]; umat Yahweh turun bagiku[b] melawan orang-orang perkasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Kemudian seorang yang selamat turun kepada kaum bangsawan.” Bahasa Ibrani dalam baris puisi ini sulit; preposisinya juga dapat dipahami secara non-hostil dengan arti “kepada”, “bagi”, atau “bersama”.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “bagiku”; kemungkinan besar ini adalah rujukan puitis Debora kepada dirinya sendiri.
    reason: cultural_note
lexical_decisions:
- source_word: אָז
  choice: Kemudian
  rationale: Kata keterangan waktu ini mengantar gerakan berikutnya dalam nyanyian; “Kemudian” ringkas dan alami.
- source_word: יְרַד / יְרַד
  choice: turun / turun
  rationale: Mempertahankan arti dasar dan pengulangan puitis verba Ibrani ירד.
- source_word: שָׂרִיד
  choice: kaum yang tersisa
  rationale: Nomina ini dapat menunjuk orang yang selamat atau kelompok yang masih tersisa; bentuk kolektif sesuai dengan konteks perang.
- source_word: לְאַדִּירִים
  choice: melawan kaum bangsawan
  rationale: אַדִּירִים menunjuk orang-orang terkemuka, kuat, atau bangsawan. Dalam konteks pertempuran, לְ dipahami secara adversatif, tetapi ketidakpastiannya dicatat dalam catatan kaki.
- source_word: עָם יְהוָה
  choice: umat Yahweh
  rationale: Ungkapan ini mengidentifikasi umat sebagai milik Yahweh; “umat Yahweh” alami sekaligus mempertahankan daya relasionalnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: לִי
  choice: bagiku
  rationale: Menerjemahkan langsung sufiks orang pertama tunggal dan tetap membiarkan nuansa hubungan yang tepat terbuka dalam baris puisi ini.
- source_word: בַּגִּבּוֹרִים
  choice: melawan orang-orang perkasa
  rationale: גִּבּוֹרִים dapat berarti orang-orang perkasa atau para pejuang. Konteks perang mendukung arti adversatif untuk preposisinya, sedangkan “orang-orang perkasa” mempertahankan rentang makna nomina.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi ilahi; “Yahweh” mempertahankan nama itu alih-alih menggantinya dengan gelar.
- issue: Fungsi preposisi dalam kedua bagian baris
  choice: 'Arti adversatif: “melawan kaum bangsawan” dan “melawan orang-orang perkasa”'
  alternative: 'Arti direktif, benefaktif, atau asosiatif: “kepada/bagi kaum bangsawan” dan “bersama/di antara orang-orang perkasa”'
  rationale: Konteks nyanyian kemenangan dan kesejajaran kedua bagian mendukung arti adversatif, tetapi bahasa Ibrani puisinya sulit dan memungkinkan pembacaan lain; karena itu ambiguitasnya dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan irama puitis yang ringkas. Pengulangan “turun” dipertahankan, istilah “kaum bangsawan” dibedakan dari “orang-orang perkasa”, dan ketidakpastian sintaksis Ibrani tidak disembunyikan.
