  yaml_path: translation/ot/judges/005/010.yaml
  text: You who ride on white donkeys[a], you who sit on carpets[b], and you who walk on the road—speak!
translation:
  language: id
  text: Kalian yang menunggang keledai betina putih, kalian yang duduk di atas permadani[a], dan kalian yang berjalan di jalan—berbicaralah![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “alas pelana” atau “tikar.” Kata Ibrani yang dipakai di sini langka dan maknanya tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: Atau “ceritakanlah” atau “renungkanlah.” Kata kerja Ibrani ini dapat berarti berbicara, menuturkan, atau merenungkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹכְבֵי
  choice: kamu yang menunggang
  rationale: Partisipel jamak dalam bentuk konstruk berfungsi sebagai sapaan, sejajar dengan partisipel-partisipel berikutnya.
- source_word: אֲתֹנוֹת
  choice: keledai-keledai betina
  rationale: Nomina Ibrani ini secara khusus menunjuk kepada keledai betina; bahasa Indonesia dapat menyatakannya secara alami tanpa mengaburkan rincian sumber.
- source_word: צְחֹרוֹת
  choice: putih
  rationale: Adjektiva ini paling wajar dipahami sebagai putih atau cerah, yang di sini menggambarkan hewan tunggangan yang istimewa.
- source_word: יֹשְׁבֵי
  choice: kamu yang duduk
  rationale: Sapaan partisipial ini mempertahankan kesejajaran puitis dan cocok dengan frasa yang menyebut sesuatu yang diduduki.
- source_word: מִדִּין
  choice: alas pelana
  rationale: Kata yang langka dan tidak pasti ini tampaknya menunjuk kepada alas atau hamparan tempat duduk; dalam konteks para penunggang, 'alas pelana' merupakan pilihan utama yang masuk akal, sementara alternatif dipertahankan dalam catatan kaki.
- source_word: וְהֹלְכֵי
  choice: dan kamu yang berjalan
  rationale: Partisipel sapaan ketiga mempertahankan gambaran konkret tentang orang yang bepergian dengan berjalan kaki.
- source_word: דֶּרֶךְ
  choice: di jalan
  rationale: Makna lazim nomina ini adalah jalan atau lintasan; 'di jalan' alami dalam konteks perjalanan.
- source_word: שִׂיחוּ
  choice: ceritakanlah
  rationale: Imperatif jamak שיח dapat berarti berbicara, menuturkan, atau merenungkan. Dalam nyanyian kemenangan ini, 'ceritakanlah' secara alami menyampaikan ajakan untuk menyuarakan atau menuturkan perbuatan yang dirayakan, tanpa menutup alternatif leksikal.
