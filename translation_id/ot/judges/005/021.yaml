  yaml_path: translation/ot/judges/005/021.yaml
  text: The torrent of Kishon swept them away— the ancient torrent[a], the torrent of Kishon. March on, my soul[b], with strength!
translation:
  language: id
  text: 'Arus deras Kison menghanyutkan mereka—

    arus purba[a], arus deras Kison.

    Majulah, hai jiwaku, dengan kekuatan![b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “arus dari zaman dahulu” atau “arus zaman purba.” Kata Ibrani קְדוּמִים dapat menunjuk kepurbaan; dalam puisi ini ungkapan tersebut mungkin juga berfungsi sebagai penguatan puitis, bukan hanya keterangan waktu.
    reason: lexical_alternative
  - marker: b
    text: Atau “Melangkahlah, hai jiwaku, dengan kekuatan!” atau “Gilaslah, hai jiwaku, dengan keperkasaan!” Ungkapan Ibraninya padat dan puitis; kata kerjanya dapat berarti menginjak, melangkah maju, atau menggilas.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחַל
  choice: arus deras
  rationale: Dalam konteks pertempuran ini, נַחַל menunjuk aliran air yang meluap dan kuat; “arus deras” menyampaikan daya banjir yang menghanyutkan tanpa memakai istilah teknis “wadi”.
- source_word: קִישׁוֹן
  choice: Kison
  rationale: Nama sungai ditransliterasikan dalam bentuk yang wajar bagi pembaca bahasa Indonesia.
- source_word: גְּרָפָם
  choice: menghanyutkan mereka
  rationale: Bentuk dari גרף menggambarkan tindakan menyapu atau menyeret oleh air; “menghanyutkan” paling alami dalam konteks arus banjir.
- source_word: נַחַל קְדוּמִים
  choice: arus purba
  rationale: קְדוּמִים berkaitan dengan zaman dahulu atau kepurbaan. “Arus purba” mempertahankan ungkapan puitis dan tidak mempersempitnya menjadi sekadar keterangan usia biasa.
- source_word: תִּדְרְכִי
  choice: Majulah
  rationale: דרך dapat berarti menginjak, melangkah, atau menggilas. Dalam seruan kepada diri sendiri, “Majulah” menyampaikan dorongan untuk terus bergerak dengan gagah, sambil membiarkan alternatif harfiahnya dijelaskan dalam catatan.
- source_word: נַפְשִׁי
  choice: hai jiwaku
  rationale: נַפְשִׁי merupakan sapaan puitis kepada diri sendiri. “Hai jiwaku” mempertahankan bentuk sapaan dan daya retoris teks.
- source_word: עֹז
  choice: dengan kekuatan
  rationale: 'עֹז berarti kekuatan atau keperkasaan. Konstruksi yang padat ini paling wajar dipahami secara adverbial: maju dengan kekuatan.'
