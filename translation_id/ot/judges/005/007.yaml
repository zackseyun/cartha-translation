base_translation:
  language: en
  yaml_path: translation/ot/judges/005/007.yaml
  text: Village life ceased in Israel; it ceased until I[a], Deborah, arose—until I arose as a mother in Israel.
translation:
  language: id
  text: Kehidupan desa[a] lenyap di Israel; lenyap sampai aku, Debora, bangkit—sampai aku bangkit sebagai seorang ibu di Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Penduduk desa lenyap di Israel,” atau “penduduk pedesaan lenyap di Israel.” Nomina Ibrani ini sulit dan dapat menunjuk kepada orang-orang yang tinggal di desa atau kepada kehidupan pedesaan secara lebih luas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָדְלוּ / חָדֵלּוּ
  choice: lenyap
  rationale: Kata kerja חדל yang diulang menyatakan berhentinya atau hilangnya suatu keadaan. “Lenyap” secara alami menggambarkan runtuhnya kehidupan pedesaan dan memungkinkan pengulangan puitis tetap terdengar.
- source_word: פְרָזוֹן
  choice: kehidupan di desa-desa
  rationale: Nomina yang sulit ini dapat menunjuk kepada penduduk desa, penduduk pedesaan, atau kehidupan di permukiman tanpa tembok secara lebih luas. Pilihan ini menyampaikan keadaan sosial yang terhenti tanpa mempersempit maknanya hanya pada tempat atau orang.
- source_word: בְּיִשְׂרָאֵל
  choice: di Israel
  rationale: Preposisi ב di sini paling wajar dipahami secara lokatif dan diterjemahkan secara idiomatis sebagai “di Israel”.
- source_word: עַד
  choice: sampai
  rationale: Menandai titik balik dalam nyanyian, yaitu keadaan sebelumnya berlangsung sampai Debora bangkit.
- source_word: שַׁקַּמְתִּי
  choice: aku bangkit
  rationale: Bentuk orang pertama dari קום menyatakan bangkit untuk bertindak. “Aku bangkit” mempertahankan penekanan orang pertama dan pengulangan puitis.
- source_word: דְּבוֹרָה
  choice: Debora
  rationale: Nama pribadi dialihaksarakan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: אֵם
  choice: seorang ibu
  rationale: Nomina ini merupakan gambaran atau sebutan kehormatan bagi peran perlindungan dan kepemimpinan Debora. “Seorang ibu” alami dalam bahasa Indonesia dan tidak menyiratkan bahwa ia ibu biologis seluruh Israel.
theological_decisions:
- issue: Daya metaforis sebutan Debora אֵם בְּיִשְׂרָאֵל
  choice: Debora berkata bahwa ia bangkit “sebagai seorang ibu di Israel,” yang membuka makna perlindungan, pengasuhan, dan kepemimpinan.
  alternative: “Ibu Israel” sebagai gelar yang lebih kuat, atau bahasa keibuan yang dipahami secara harfiah.
  rationale: Teks Ibrani berbunyi “ibu di Israel,” bukan “ibu Israel.” Mempertahankan “di Israel” menjaga bentuk sumber dan tidak melebihkan kadar gelarnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Pengulangan “lenyap” dan “aku bangkit” dipertahankan untuk mencerminkan struktur nyanyian Ibrani. Penanda catatan kaki ditempatkan sesudah seluruh klausa agar tidak mengganggu alur puisi.
