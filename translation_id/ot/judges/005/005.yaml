source:
  edition: WLC
  text: הָרִ֥ים נָזְל֖וּ מִ/פְּנֵ֣י יְהוָ֑ה זֶ֣ה סִינַ֔י מִ/פְּנֵ֕י יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/005.yaml
  text: The mountains quaked before Yahweh[a], this Sinai before Yahweh[b], the God of Israel.
translation:
  language: id
  text: Gunung-gunung mengalir turun[a] dari hadapan Yahweh; Sinai ini mengalir turun dari hadapan Yahweh, Allah Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “meleleh.” Kata kerja Ibrani yang digunakan berarti mengalir atau menetes; dalam gambaran puitis ini, kata itu sering dipahami sebagai “meleleh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרִים
  choice: Gunung-gunung
  rationale: Bentuk jamak dengan artikel tertentu menunjuk kepada gunung-gunung dalam gambaran teofani; bahasa Indonesia tidak menandai ketakrifan dengan artikel.
- source_word: נָזְלוּ
  choice: mengalir turun
  rationale: Kata kerja נזל pada dasarnya berarti mengalir, menetes, atau mencurah. Pilihan ini mempertahankan citra puitis Ibrani dan tidak menggantinya dengan tafsiran kontekstual seperti 'berguncang'.
- source_word: מִפְּנֵי
  choice: dari hadapan
  rationale: Ungkapan ini secara harfiah menyatakan gerak atau reaksi 'dari hadapan' seseorang; bentuk tersebut mempertahankan unsur מִן sekaligus gagasan kehadiran.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: זֶה סִינַי
  choice: Sinai ini
  rationale: Susunan yang mendadak mempertahankan demonstrativa זֶה dan daya tunjuk puitis teks Ibrani tanpa menambahkan kata 'Gunung'.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Frasa konstruksi ini secara alami mengidentifikasi Yahweh sebagai Allah Israel dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian secara langsung; transliterasi mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Citra teofani dalam נָזְלוּ
  choice: gunung-gunung mengalir turun
  alternative: gunung-gunung meleleh atau berguncang
  rationale: '''Mengalir turun'' mempertahankan arti leksikal dan ketegangan citra puisi. ''Meleleh'' merupakan penafsiran metaforis yang masuk akal, sedangkan ''berguncang'' sesuai konteks tetapi bukan arti langsung kata kerja tersebut.'
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan bermartabat. Tanda pisah menandai sisipan demonstratif yang mendadak, 'Sinai ini', sesuai susunan puisi Ibrani. Penanda catatan kaki [a] ditempatkan tepat setelah klausa yang dijelaskannya.
