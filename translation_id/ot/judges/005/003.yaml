base_translation:
  language: en
  yaml_path: translation/ot/judges/005/003.yaml
  text: Hear[a], O kings; give ear, O rulers. I, to Yahweh[b], I will sing; I will make music to Yahweh, the God of Israel.
translation:
  language: id
  text: Dengarlah, hai raja-raja; pasanglah telinga, hai para penguasa.[a] Aku, bagi Yahweh, aku akan bernyanyi; aku akan bermusik bagi Yahweh, Allah Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani memakai dua perintah yang hampir sejajar—“dengarlah” dan “pasanglah telinga”—untuk penegasan puitis.
    reason: lexical_alternative
  - marker: b
    text: 'Atau, “aku akan melantunkan pujian bagi Yahweh.” Bahasa Ibrani memakai dua kata kerja yang berkaitan tetapi berbeda: “bernyanyi” dan “bermusik.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ
  choice: Dengarlah
  rationale: Imperatif jamak yang membuka seruan puitis; bentuk ini alami, tegas, dan mempertahankan nada luhur.
- source_word: מְלָכִים
  choice: raja-raja
  rationale: Padanan langsung bagi nomina jamak yang menunjuk para raja sebagai pendengar seruan.
- source_word: הַאֲזִינוּ
  choice: pasanglah telinga
  rationale: Ungkapan puitis ini membedakannya dari שִׁמְעוּ sekaligus mempertahankan paralelisme dua imperatif yang hampir bersinonim.
- source_word: רֹזְנִים
  choice: para penguasa
  rationale: Istilah ini menunjuk orang-orang berkedudukan tinggi atau pemegang kuasa; padanan ini jelas dalam bahasa Indonesia modern.
- source_word: אָנֹכִי ... אָנֹכִי
  choice: Aku ... aku
  rationale: Pengulangan pronomina mandiri dipertahankan untuk menyampaikan penegasan diri dalam puisi.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל dengan verba musik dapat menyatakan arah maupun pengabdian; 'bagi' menjaga nuansa bahwa nyanyian dipersembahkan kepada Yahweh.
- source_word: יהוה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri 'Yahweh', sesuai bentuk nama perjanjian dalam teks Ibrani.
- source_word: אָשִׁירָה
  choice: aku akan bernyanyi
  rationale: Bentuk ini memiliki nuansa kehendak atau tekad; bentuk futur-volisional Indonesia menyampaikannya secara alami.
- source_word: אֲזַמֵּר
  choice: aku akan bermusik
  rationale: Padanan ini mempertahankan perbedaan dari verba sebelumnya tanpa memastikan secara berlebihan apakah musiknya vokal atau instrumental.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Frasa konstruksi ini secara langsung mengidentifikasi Yahweh sebagai Allah Israel; bentuk tersebut alami dan ringkas dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan fungsi nama perjanjian tanpa menggantinya dengan gelar.
- issue: Arah atau pengabdian dalam לַיהוָה
  choice: bagi Yahweh
  alternative: kepada Yahweh
  rationale: Preposisi ל bersama verba bernyanyi dapat mencakup arah dan dedikasi. 'Bagi' mempertahankan unsur persembahan/pengabdian tanpa meniadakan bahwa Yahweh adalah tujuan nyanyian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras puisi yang luhur tetapi mudah dipahami. Sapaan 'hai' dan ungkapan 'pasanglah telinga' mempertahankan gaya puitis; tanda pisah menonjolkan pengulangan emphatik אָנֹכִי tanpa membuat susunan Indonesia terlalu kaku.
