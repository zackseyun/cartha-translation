base_translation:
  language: en
  yaml_path: translation/ot/judges/005/012.yaml
  text: Awake[a], awake, Deborah! Awake, awake, sing a song! Rise up, Barak, and take captive your captives[b], son of Abinoam.
translation:
  language: id
  text: Bangunlah, bangunlah, Debora! Bangunlah, bangunlah, lantunkanlah sebuah nyanyian![a] Bangkitlah, Barak, dan tawanlah tawananmu,[b] anak Abinoam!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ucapkanlah sebuah nyanyian.” Kata kerja Ibraninya berarti “berbicara” atau “mengucapkan”, bukan kata yang biasanya berarti “bernyanyi”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tawanlah tawananmu”, ungkapan Ibrani yang menggambarkan kemenangan dengan menjadikan musuh tawanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עוּרִי
  choice: Bangunlah
  rationale: Imperatif feminin tunggal yang diulang empat kali untuk menciptakan desakan puitis. “Bangunlah” alami dalam bahasa Indonesia dan dapat menyampaikan panggilan untuk menggugah diri.
- source_word: דְּבוֹרָה
  choice: Debora
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: דַּבְּרִי שִׁיר
  choice: lantunkanlah sebuah nyanyian
  rationale: Secara harfiah verba דבר berarti “berbicara/mengucapkan”, tetapi dalam konstruksi puitis ini maksudnya ialah menyuarakan nyanyian. “Lantunkanlah” terdengar alami sekaligus tetap dekat dengan gagasan mengucapkan atau menyuarakan.
- source_word: קוּם
  choice: Bangkitlah
  rationale: Imperatif maskulin tunggal yang ditujukan kepada Barak. “Bangkitlah” sesuai dengan konteks tindakan dan kemenangan militer serta membedakannya secara wajar dari seruan kepada Debora.
- source_word: בָּרָק
  choice: Barak
  rationale: Nama pribadi ditransliterasikan.
- source_word: וּשֲׁבֵה
  choice: dan bawalah sebagai tawanan
  rationale: Imperatif dari שבה menyatakan tindakan menawan atau membawa pergi sebagai tawanan. Pilihan ini mempertahankan nuansa militer dan berpadu dengan objek kolektif berikutnya.
- source_word: שֶׁבְיְךָ
  choice: orang-orang yang kautawan
  rationale: Nomina שֶׁבִי dapat berarti kumpulan tawanan atau penawanan. Dalam nyanyian kemenangan ini, makna kolektif “orang-orang yang kautawan” paling sesuai dan mempertahankan permainan akar kata dengan verba sebelumnya.
- source_word: בֶּן אֲבִינֹעַם
  choice: hai anak Abinoam
  rationale: Formula patronimik dipertahankan; partikel vokatif “hai” memperjelas bahwa frasa ini merupakan sapaan langsung dalam puisi.
