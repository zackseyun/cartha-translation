  text: Zebulun was a people that risked its life to the death[a], and Naphtali also[b], on the heights of the field.
translation:
  language: id
  text: Zebulon adalah kaum yang mempertaruhkan nyawanya sampai mati,[a] dan Naftali juga demikian, di tempat-tempat tinggi di padang terbuka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “memandang hina nyawanya sampai mati,” maksudnya, mempertaruhkan nyawa bahkan sampai mati. Bahasa Ibrani memakai bentuk tunggal kolektif untuk Zebulon dan kata kerja yang berarti memperlakukan sesuatu dengan hina atau menganggapnya tidak berharga.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “di tempat-tempat tinggi di ladang.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: זְבֻלוּן
  choice: Zebulon
  rationale: Nama suku ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: עַם
  choice: suku
  rationale: Dalam konteks nyanyian yang menyebut kelompok-kelompok Israel, 'suku' secara alami menyampaikan nomina kolektif ini, meski secara harfiah berarti 'bangsa/umat'.
- source_word: חֵרֵף נַפְשׁוֹ לָמוּת
  choice: mempertaruhkan nyawanya sampai menghadapi maut
  rationale: Ungkapan ini menyampaikan bahwa Zebulon menganggap nyawanya tidak berharga untuk dipertahankan dalam pertempuran, yakni berani mengambil risiko hingga mati, tanpa menghasilkan ungkapan Indonesia yang janggal.
- source_word: וְנַפְתָּלִי
  choice: demikian juga Naftali
  rationale: Konjungsi menghubungkan Naftali dengan pujian yang sama; 'demikian juga' membuat elipsis puitis itu jelas dalam bahasa Indonesia.
- source_word: מְרוֹמֵי שָׂדֶה
  choice: tempat-tempat tinggi di padang terbuka
  rationale: '''Tempat-tempat tinggi'' mempertahankan gambaran topografis, sedangkan ''padang terbuka'' menyampaikan arti שָׂדֶה tanpa mempersempitnya menjadi medan perang.'
