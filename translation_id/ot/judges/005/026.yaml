base_translation:
  language: en
  yaml_path: translation/ot/judges/005/026.yaml
  text: She reached out her hand for the tent peg[a], her right hand for the workmen’s hammer; then she struck Sisera, she shattered his head[c][b], she smashed and pierced his temple.
translation:
  language: id
  text: Ia mengulurkan tangannya ke patok kemah, tangan kanannya ke palu para pekerja; lalu ia menghantam Sisera, meremukkan kepalanya, menghancurkan dan menembus pelipisnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja Ibrani terakhir juga dapat dipahami sebagai “melintas” atau “melewati”; dalam konteks ini, kata itu lazim dipahami sebagai tindakan menembus pelipis.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדָהּ ... תִּשְׁלַחְנָה
  choice: Tangannya diulurkannya
  rationale: Mempertahankan gambaran konkret tentang tangan yang diulurkan sekaligus menghasilkan susunan puitis yang wajar dalam bahasa Indonesia.
- source_word: לַיָּתֵד
  choice: kepada patok kemah
  rationale: Dalam konteks kisah Yael, יָתֵד menunjuk pada patok kemah; unsur 'kemah' memperjelas acuannya tanpa mengubah gambaran.
- source_word: וִימִינָהּ
  choice: tangan kanannya
  rationale: Terjemahan langsung yang mempertahankan kesejajaran puitis dengan 'tangannya'.
- source_word: לְהַלְמוּת עֲמֵלִים
  choice: kepada palu pekerja
  rationale: Ungkapan yang tidak lazim ini tampaknya menunjuk pada alat pemukul milik atau jenis yang digunakan pekerja; 'palu pekerja' mempertahankan hubungan genitif dan ketidakspesifikan bentuk alat.
- source_word: וְהָלְמָה סִיסְרָא
  choice: lalu dihantamnya Sisera
  rationale: Kata kerja menyatakan pukulan keras; bentuk inversi mempertahankan gerak puisi dan urutan tindakan.
- source_word: מָחֲקָה רֹאשׁוֹ
  choice: diremukkannya kepalanya
  rationale: מחק dalam konteks ini menyampaikan penghancuran atau peremukan keras pada kepala.
- source_word: וּמָחֲצָה
  choice: dihancurkan
  rationale: Pilihan berbeda dari 'diremukkan' mempertahankan penumpukan kata kerja keras yang berdekatan dalam puisi Ibrani.
- source_word: וְחָלְפָה רַקָּתוֹ
  choice: ditembusnya pelipisnya
  rationale: חלף dapat menggambarkan gerakan melewati atau menembus; dalam konteks pukulan pada pelipis, 'ditembusnya' menyampaikan hasil tindakan tanpa menambahkan keterangan 'sampai tembus'.
