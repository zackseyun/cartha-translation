- from: Tangannya diulurkannya kepada patok kemah, tangan kanannya kepada palu pekerja; lalu dihantamnya Sisera, diremukkannya kepalanya, dihancurkan dan ditembusnya pelipisnya.[a]
  to: Ia mengulurkan tangannya ke patok kemah, tangan kanannya ke palu para pekerja; lalu ia menghantam Sisera, meremukkan kepalanya, menghancurkan dan menembus pelipisnya.[a]
