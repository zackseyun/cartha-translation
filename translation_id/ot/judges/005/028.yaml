  yaml_path: translation/ot/judges/005/028.yaml
  text: 'Through the window Sisera’s mother looked out and wailed through the lattice: “Why is his chariot so late in coming? Why do the hoofbeats of his chariots delay?”[a][b]'
translation:
  language: id
  text: Dari balik jendela ibu Sisera memandang ke luar dan meratap[a] melalui kisi-kisi, “Mengapa keretanya begitu lama datang? Mengapa derap kereta-keretanya terlambat?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berseru”; kata Ibrani yang digunakan di sini langka dan mungkin menunjuk pada ratapan atau seruan penuh kegelisahan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “langkah-langkah” atau “jejak-jejak kereta-keretanya.” Kata “derap” menyampaikan bunyi gerakan yang tersirat tanpa memastikan apakah yang terutama dimaksud ialah langkah kuda penarik atau gerak kereta.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעַד הַחַלּוֹן
  choice: Dari balik jendela
  rationale: Dalam konteks memandang dari sebuah bukaan, בְּעַד dapat menyatakan posisi di balik atau arah melalui bukaan. Ungkapan ini alami dalam bahasa Indonesia dan menggambarkan ibu Sisera berada di dalam sambil memandang ke luar.
- source_word: נִשְׁקְפָה
  choice: memandang ke luar
  rationale: Kata kerja ini lazim menggambarkan tindakan memandang ke luar atau ke bawah dari jendela maupun tempat tinggi.
- source_word: וַתְּיַבֵּב
  choice: dan meratap
  rationale: Kata kerja yang langka ini tampaknya menunjuk pada seruan penuh kesedihan atau kegelisahan. 'Meratap' mempertahankan intensitas emosionalnya tanpa menentukan bentuk tangis secara lebih sempit.
- source_word: אֵם סִיסְרָא
  choice: ibu Sisera
  rationale: Hubungan konstruksi diterjemahkan dengan bentuk kepemilikan yang ringkas dan alami dalam bahasa Indonesia.
- source_word: בְּעַד הָאֶשְׁנָב
  choice: melalui kisi-kisi
  rationale: הָאֶשְׁנָב menunjuk pada bukaan berkisi. 'Melalui kisi-kisi' mempertahankan gambaran ruang dan pengulangan preposisi Ibrani.
- source_word: בֹּשֵׁשׁ רִכְבּוֹ לָבוֹא
  choice: keretanya begitu lama datang
  rationale: בֹּשֵׁשׁ berarti tertunda atau lama datang. Susunan ini menyampaikan kegelisahan sang ibu dalam bahasa Indonesia yang wajar.
- source_word: פַּעֲמֵי מַרְכְּבוֹתָיו
  choice: derap kereta-keretanya
  rationale: פַּעֲמֵי secara harfiah berkaitan dengan langkah, hentakan, atau jejak gerak. 'Derap' mempertahankan citra bunyi gerakan tanpa secara eksplisit mengubah rujukannya menjadi roda ataupun kuku kuda.
- source_word: אֶחֱרוּ
  choice: terlambat
  rationale: Kata kerja jamak ini menyatakan penundaan atau keterlambatan. Predikat 'terlambat' alami dalam bahasa Indonesia dan sesuai dengan subjek frasa yang mendahuluinya.
