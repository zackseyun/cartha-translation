id: JDG.5.17
reference: Judges 5:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: גִּלְעָ֗ד בְּ/עֵ֤בֶר הַ/יַּרְדֵּן֙ שָׁכֵ֔ן וְ/דָ֕ן לָ֥/מָּה יָג֖וּר אֳנִיּ֑וֹת אָשֵׁ֗ר יָשַׁב֙ לְ/ח֣וֹף יַמִּ֔ים וְ/עַ֥ל מִפְרָצָ֖י/ו יִשְׁכּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/017.yaml
  text: Gilead stayed beyond the Jordan[b][a]; and Dan—why did he sojourn by the ships? Asher sat by the seashore and stayed by his harbors.
translation:
  language: id
  text: 'Gilead tetap tinggal di seberang Sungai Yordan;

    dan mengapa ia tinggal dekat kapal-kapal?[a]

    Asyer duduk di tepi laut

    dan tetap tinggal di teluk-teluknya.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengapa ia tinggal sebagai pendatang dekat kapal-kapal?” Kata kerja Ibrani dapat berarti “tinggal,” “menetap,” atau “tinggal sebagai pendatang.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “pelabuhan-pelabuhannya” atau “ceruk-ceruk pantainya.” Kata Ibrani menunjuk bukaan atau celah dan, dalam konteks pesisir ini, mungkin berarti teluk, ceruk pantai, atau pelabuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּלְעָד
  choice: Gilead
  rationale: Nama wilayah/suku dipertahankan secara langsung; dalam konteks ini nama tersebut mewakili penduduknya tanpa perlu diperluas menjadi 'orang Gilead'.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: di seberang Sungai Yordan
  rationale: Ungkapan geografis ini berarti di sisi lain Yordan. Penambahan 'Sungai' wajar dalam bahasa Indonesia modern dan memperjelas nama geografis.
- source_word: שָׁכֵן
  choice: tetap tinggal
  rationale: Kata kerja ini menyatakan berdiam atau menetap; 'tetap tinggal' juga menyampaikan nada teguran karena Gilead tidak ikut bertempur.
- source_word: וְדָן
  choice: dan
  rationale: Nama suku ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: יָגוּר
  choice: tinggal
  rationale: Kata ini dapat berarti menetap atau tinggal sebagai pendatang. 'Tinggal' mempertahankan keluasan makna tanpa menambahkan gagasan 'berlambat-lambat' yang tidak dinyatakan secara eksplisit.
- source_word: אֳנִיּוֹת
  choice: kapal-kapal
  rationale: Bentuk jamak bagi kapal laut diterjemahkan secara langsung; bahasa Ibrani tidak memakai artikel tertentu di sini.
- source_word: אָשֵׁר
  choice: Asyer
  rationale: Nama suku memakai ejaan Indonesia modern yang lazim.
- source_word: יָשַׁב
  choice: duduk
  rationale: Arti harfiah 'duduk' mempertahankan gambaran puitis tentang ketidakaktifan, meskipun kata ini juga dapat berarti tinggal atau berdiam.
- source_word: לְחוֹף יַמִּים
  choice: di tepi laut
  rationale: Terjemahan alami bagi ungkapan pesisir; bentuk jamak 'laut-laut' tidak perlu direproduksi secara kaku dalam bahasa Indonesia.
- source_word: מִפְרָצָיו
  choice: teluk-teluknya
  rationale: Dalam konteks pesisir, kata yang secara dasar menunjuk bukaan atau celah kemungkinan berarti teluk kecil, ceruk pantai, atau pelabuhan. 'Teluk-teluknya' mempertahankan gambaran geografis tanpa memastikan bahwa tempat itu merupakan pelabuhan buatan.
- source_word: יִשְׁכּוֹן
  choice: tetap tinggal
  rationale: Kata kerja berdiam ini sejajar dengan baris pertama dan menegaskan bahwa Asyer tidak beranjak untuk ikut berperang.
theological_decisions: []
