  variant: modern standard Indonesian
source:
  edition: WLC
  text: הֲ/לֹ֨א יִמְצְא֜וּ יְחַלְּק֣וּ שָׁלָ֗ל רַ֤חַם רַחֲמָתַ֨יִם֙ לְ/רֹ֣אשׁ גֶּ֔בֶר שְׁלַ֤ל צְבָעִים֙ לְ/סִ֣יסְרָ֔א שְׁלַ֥ל צְבָעִ֖ים רִקְמָ֑ה צֶ֥בַע רִקְמָתַ֖יִם לְ/צַוְּארֵ֥י שָׁלָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/030.yaml
  text: ‘Are they not finding and dividing the spoil? A womb[a], two wombs for each man; spoil of dyed cloths for Sisera, spoil of dyed cloths, embroidered cloth, dyed cloth[b], two embroideries for the necks of the spoil.’
translation:
  language: id
  text: ‘Bukankah mereka sedang memperoleh dan membagi-bagikan jarahan? Satu rahim[a], dua rahim untuk setiap laki-laki; jarahan berupa kain-kain berwarna untuk Sisera, jarahan berupa kain-kain berwarna, kain bersulam, kain berwarna[b], dua sulaman untuk leher-leher milik jarahan itu.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “satu rahim, dua rahim,” sebuah metonimia kasar untuk perempuan yang dirampas sebagai jarahan seksual.
    reason: lexical_alternative
  - marker: b
    text: Atau, “untuk leher para tawanan / mereka yang dijadikan jarahan.” Frasa Ibrani pada bagian akhir sulit dipastikan dan mungkin merujuk pada kain bersulam yang dikenakan oleh perempuan-perempuan tawanan.
    reason: alternative_reading
lexical_decisions:
- source_word: הֲלֹא יִמְצְאוּ יְחַלְּקוּ
  choice: Bukankah mereka sedang menemukan dan membagi-bagi
  rationale: Pertanyaan retoris ini menyuarakan dugaan penuh harap dari ibu Sisera dan para perempuan bijaksana. Bentuk “sedang” mempertahankan gambaran tindakan yang mereka bayangkan tengah berlangsung.
- source_word: שָׁלָל
  choice: jarahan
  rationale: Istilah militer yang alami dalam bahasa Indonesia untuk harta atau orang yang dirampas dalam perang; pengulangannya dipertahankan sesuai puisi Ibrani.
- source_word: רַחַם רַחֲמָתַיִם
  choice: satu rahim, dua rahim
  rationale: Arti harfiahnya sengaja dipertahankan karena merupakan metonimia kasar dan merendahkan bagi perempuan yang dijadikan jarahan seksual. Terjemahan “perempuan” akan mengurangi daya kejut moral teks.
- source_word: לְרֹאשׁ גֶּבֶר
  choice: untuk setiap laki-laki
  rationale: Secara harfiah “untuk kepala seorang laki-laki,” tetapi idiom ini menyatakan pembagian per orang. “Setiap laki-laki” menyampaikan fungsi distributifnya dengan wajar dan tetap mempertahankan jenis kelamin yang dinyatakan sumber.
- source_word: צְבָעִים
  choice: kain-kain berwarna
  rationale: Menunjuk pada tekstil yang dicelup atau berwarna sebagai hasil jarahan. “Kain-kain berwarna” alami dalam bahasa Indonesia dan tidak secara berlebihan menentukan bahwa benda itu sudah berupa pakaian.
- source_word: רִקְמָה
  choice: kain bersulam
  rationale: Menyatakan hasil sulaman atau tekstil bersulam. Penambahan “kain” memperjelas rujukan tekstil dalam rangkaian puitis tanpa menghapus citra sumber.
- source_word: צֶבַע רִקְמָתַיִם
  choice: kain berwarna, dua sulaman
  rationale: Susunan Ibraninya padat dan sukar. Terjemahan dekat ini mempertahankan urutan serta bentuk dual “dua sulaman” tanpa memaksakan hubungan sintaksis yang belum pasti.
- source_word: לְצַוְּארֵי שָׁלָל
  choice: untuk leher-leher jarahan
  rationale: Terjemahan dekat mempertahankan bentuk jamak dan ketidakjelasan frasa penutup; kemungkinan bahwa “jarahan” merujuk kepada para tawanan dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Apakah idiom seksual רַחַם רַחֲמָתַיִם perlu diperhalus
  choice: Mempertahankan metonimia harfiah “satu rahim, dua rahim”
  alternative: “seorang perempuan, dua perempuan” atau “satu-dua gadis”
  rationale: Ucapan ini menggambarkan harapan kejam pihak Sisera, bukan persetujuan narator. Bahasa yang mengobjektifikasi itu perlu dipertahankan agar kekerasan moral dalam nyanyian tidak dilunakkan.
- issue: Penafsiran frasa sulit לְצַוְּארֵי שָׁלָל
  choice: Menggunakan terjemahan dekat dalam teks utama dan memberi kemungkinan tafsir dalam catatan kaki
  alternative: “untuk leher para tawanan” atau “untuk leher perempuan-perempuan yang dijarah”
  rationale: Sintaksis Ibraninya padat dan diperdebatkan. Terjemahan tidak seharusnya menutup ambiguitas asli dengan memilih satu tafsir secara terlalu pasti.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Pengulangan sengaja dipertahankan untuk mencerminkan gaya Nyanyian Debora. Ungkapan “rahim” terdengar keras, sebagaimana bahasa sumber, sedangkan dua catatan kaki menjelaskan metonimia seksual dan ambiguitas frasa penutup.
