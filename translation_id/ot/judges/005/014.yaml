  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִנִּ֣י אֶפְרַ֗יִם שָׁרְשָׁ/ם֙ בַּ/עֲמָלֵ֔ק אַחֲרֶ֥י/ךָ בִנְיָמִ֖ין בַּֽ/עֲמָמֶ֑י/ךָ מִנִּ֣י מָכִ֗יר יָֽרְדוּ֙ מְחֹ֣קְקִ֔ים וּ/מִ֨/זְּבוּלֻ֔ן מֹשְׁכִ֖ים בְּ/שֵׁ֥בֶט סֹפֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/014.yaml
  text: From Ephraim those whose root was in Amalek[a]; after you, Benjamin, among your peoples. From Machir commanders came down[e][d][c][b], and from Zebulun those who wield the staff of the scribe.
translation:
  language: id
  text: Dari Efraim, mereka yang akarnya berada di Amalek[a]; sesudahmu, Benyamin, di antara kelompok-kelompokmu[b]. Dari Makhir[c] turun para pemimpin[d], dan dari Zebulon mereka yang menggunakan tongkat juru tulis[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “akar mereka melawan Amalek” atau “akar mereka berada di pegunungan Amalek.” Baris Ibrani ini sulit dan kemungkinan merupakan ungkapan puitis-geografis.
    reason: alternative_reading
  - marker: b
    text: Atau “Benyamin mengikutimu, di antara kaum atau sanak saudaramu.” Ungkapan “di antara kelompok-kelompokmu” menerjemahkan secara dekat susunan Ibrani yang tidak lazim.
    reason: lexical_alternative
  - marker: c
    text: Makhir adalah kaum utama dalam suku Manasye; karena itu, sebagian terjemahan memakai nama suku yang lebih luas, “Manasye”.
    reason: cultural_note
  - marker: d
    text: Atau “para penguasa” atau “para pemberi hukum”. Istilah Ibrani ini dapat menunjuk orang yang memerintah atau menetapkan ketentuan.
    reason: lexical_alternative
  - marker: e
    text: Atau “mereka yang menarik dengan tongkat juru tulis” atau “mereka yang membawa tongkat pengerah pasukan”. Ungkapan Ibrani ini langka dan mungkin berkaitan dengan pengerahan tentara atau pencatatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּי אֶפְרַיִם
  choice: Dari Efraim
  rationale: Kata depan menunjukkan asal atau sumber. Pilihan ini wajar dalam bahasa Indonesia dan mempertahankan susunan puitis daftar suku.
- source_word: שָׁרְשָׁם
  choice: mereka yang akarnya
  rationale: Nomina Ibrani secara harfiah berarti 'akar'. Metafora itu dipertahankan agar teks tidak dipersempit menjadi 'keturunan' atau ditafsirkan secara berlebihan.
- source_word: בַּעֲמָלֵק
  choice: di Amalek
  rationale: Kata depan paling wajar dibaca secara lokatif. Terjemahan ini mempertahankan kesulitan ungkapan Ibrani tanpa menambahkan gagasan peperangan yang tidak dinyatakan secara eksplisit.
- source_word: אַחֲרֶיךָ בִנְיָמִין
  choice: sesudahmu, Benyamin
  rationale: Bahasa Ibraninya ringkas dan tidak memakai verba finit. Frasa ini mempertahankan urutan puitis tanpa menyisipkan 'datang' atau 'mengikuti' ke dalam teks utama.
- source_word: בַּעֲמָמֶיךָ
  choice: di antara kaum-kaummu
  rationale: Bentuk jamak 'bangsa/kaum' dengan akhiran orang kedua tunggal tidak lazim. 'Kaum-kaummu' cukup dekat dengan bentuk sumber dan dapat mencakup kelompok atau rumpun terkait.
- source_word: מִנִּי מָכִיר
  choice: Dari Makhir
  rationale: Teks menyebut Makhir secara langsung, yaitu kaum utama dalam suku Manasye. Nama itu dipertahankan dan tidak diganti dengan nama suku yang lebih luas.
- source_word: יָרְדוּ
  choice: turunlah
  rationale: Verba ini berarti turun atau bergerak ke tempat yang lebih rendah. Bentuk inversi dengan '-lah' sesuai dengan register puisi Indonesia dan menandai tindakan dengan jelas.
- source_word: מְחֹקְקִים
  choice: para pemimpin
  rationale: Istilah ini dapat menunjuk orang yang menetapkan ketentuan, penguasa, atau pemimpin. 'Para pemimpin' sesuai dengan konteks pengerahan suku tanpa menjadi semiliteristik 'panglima' atau sempit seperti 'pemberi hukum'.
- source_word: וּמִזְּבוּלֻן
  choice: dan dari Zebulon
  rationale: Terjemahan langsung ini meneruskan pola penyebutan asal suku.
- source_word: מֹשְׁכִים
  choice: mereka yang memegang
  rationale: Partisip Ibrani berarti menarik atau menggerakkan. Bersama kata 'tongkat', 'memegang' menghasilkan ungkapan Indonesia yang wajar sambil mempertahankan gambaran orang yang menggunakan atau membawa alat tersebut; nuansa harfiahnya dicatat dalam catatan kaki.
- source_word: בְּשֵׁבֶט סֹפֵר
  choice: tongkat juru tulis
  rationale: שֵׁבֶט berarti tongkat, gada, atau tongkat kekuasaan, sedangkan סֹפֵר berarti juru tulis. Terjemahan dekat ini mempertahankan citra dan ketidakpastian ungkapan langka tersebut.
