revisions:
- from: Dari Efraim, mereka yang akarnya di Amalek[a]; sesudahmu, Benyamin, di antara kaum-kaummu.[b] Dari Makhir[c] turunlah para pemimpin[d], dan dari Zebulon mereka yang memegang tongkat juru tulis.[e]
  to: Dari Efraim, mereka yang akarnya berada di Amalek[a]; sesudahmu, Benyamin, di antara kelompok-kelompokmu[b]. Dari Makhir[c] turun para pemimpin[d], dan dari Zebulon mereka yang menggunakan tongkat juru tulis[e].
  rationale: Revisi ini memperbaiki kelancaran bahasa Indonesia dan menguatkan nilai tindakan pada מֹשְׁכִים, sambil tetap mempertahankan metafora ‘akar’, urutan puitis tanpa verba pada bagian Benyamin, serta ambiguitas “tongkat juru tulis”. Semua jangkar catatan kaki dipertahankan dan ditempatkan pada unsur yang dijelaskannya.
