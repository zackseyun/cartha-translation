  - severity: low
    issue: Frasa “akarnya di Amalek” eliptis dan “kaum-kaummu” kurang lazim dalam bahasa Indonesia modern.
    rationale: Penambahan “berada” memperjelas predikasi tanpa mengubah metafora. “Kelompok-kelompokmu” mempertahankan pluralitas ganjil teks sumber dan dapat dijelaskan dalam catatan kaki.
