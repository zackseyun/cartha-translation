  text: מִן שָׁמַ֖יִם נִלְחָ֑מוּ הַ/כּֽוֹכָבִים֙ מִ/מְּסִלּוֹתָ֔/ם נִלְחֲמ֖וּ עִם סִיסְרָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/020.yaml
  text: From heaven the stars fought[b][a]; from their courses they fought against Sisera.
translation:
  language: id
  text: 'Dari langit bintang-bintang berperang;

    dari lintasan mereka, mereka berperang melawan Sisera.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dengan Sisera”; dalam konteks pertempuran, ungkapan ini berarti “melawan Sisera”.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן שָׁמַיִם
  choice: Dari langit
  rationale: Preposisi מִן menyatakan asal atau arah datangnya tindakan. Dalam bahasa Indonesia, “dari langit” alami dan mempertahankan gambaran puitis Ibrani tanpa perlu meniru bentuk jamak שָׁמַיִם.
- source_word: נִלְחָמוּ / נִלְחֲמוּ
  choice: berperang / berperang
  rationale: Bentuk Niphal dari לחם di sini berarti terlibat dalam pertempuran. Pengulangan kata yang sama dipertahankan karena merupakan unsur penting dalam kesejajaran puitis ayat ini.
- source_word: הַכּוֹכָבִים
  choice: bintang-bintang
  rationale: כּוֹכָבִים secara langsung berarti “bintang-bintang”. Pilihan ini mempertahankan personifikasi kosmis dalam nyanyian tanpa menafsirkannya sebagai malaikat atau sekadar kekuatan alam.
- source_word: מִמְּסִלּוֹתָם
  choice: dari lintasan mereka
  rationale: מְסִלּוֹת dapat berarti jalan raya, jalur, atau lintasan. Dalam konteks bintang-bintang, “lintasan” menyampaikan jalur yang mereka tempuh di langit sambil tetap mempertahankan metafora aslinya.
- source_word: עִם סִיסְרָא
  choice: melawan Sisera
  rationale: Walaupun עִם biasanya berarti “dengan”, bersama verba לחם dalam konteks pertempuran frasa ini menunjuk kepada pihak lawan. “Melawan Sisera” menyampaikan makna relasionalnya secara jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat keterlibatan bintang-bintang dalam pertempuran
  choice: Mempertahankan pernyataan puitis bahwa bintang-bintang berperang dari langit.
  alternative: Menjelaskannya sebagai campur tangan kosmis harfiah, bala tentara malaikat, atau metafora bagi kekuatan alam yang diatur oleh pemeliharaan Allah.
  rationale: Nyanyian Debora tidak menerangkan mekanisme keterlibatan bintang-bintang. Karena itu, terjemahan mempertahankan gambaran dan ketegangan teologis teks tanpa memilih satu penafsiran tertentu.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Susunan dua baris serta pengulangan “berperang” mempertahankan kesejajaran puisi Ibrani. “Lintasan” dipilih sebagai istilah yang mudah dipahami untuk jalur bintang-bintang di langit.
