  text: בִּ/פְרֹ֤עַ פְּרָעוֹת֙ בְּ/יִשְׂרָאֵ֔ל בְּ/הִתְנַדֵּ֖ב עָ֑ם בָּרֲכ֖וּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/002.yaml
  text: When leaders took the lead in Israel, when the people volunteered, bless the LORD!
translation:
  language: id
  text: 'Ketika para pemimpin memimpin di Israel,

    ketika rakyat maju dengan sukarela,

    pujilah TUHAN![a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Frasa pertama dalam bahasa Ibrani sulit dipastikan. Terjemahan lain yang mungkin: “Ketika rambut dibiarkan terurai di Israel,” yang dapat merujuk pada para pejuang yang mengabdikan diri untuk perang.'
    reason: Menjaga ambiguitas asli בִּפְרֹעַ פְּרָעוֹת, yang dapat dipahami sebagai kepemimpinan atau sebagai rambut yang dibiarkan terurai.
lexical_decisions:
- source_word: בִּפְרֹעַ פְּרָעוֹת
  choice: Ketika para pemimpin memimpin
  rationale: Ungkapan Ibrani ini sulit dan memuat permainan bunyi/akar kata. Dalam konteks nyanyian kemenangan, terjemahan ini menyampaikan tindakan kepemimpinan di Israel serta mempertahankan pengulangan retorisnya.
- source_word: בְּהִתְנַדֵּב עָם
  choice: ketika rakyat maju dengan sukarela
  rationale: Bentuk refleksif dari נדב menyatakan kesediaan sukarela. 'Maju dengan sukarela' terdengar alami dalam konteks rakyat yang ikut bertempur tanpa menambahkan gagasan kewajiban.
- source_word: בָּרֲכוּ
  choice: pujilah
  rationale: Secara harfiah verba ini berarti 'berkatilah', tetapi ketika manusia menjadi pelaku dan YHWH menjadi objek, ungkapan Indonesia yang wajar adalah 'pujilah'.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia untuk nama perjanjian ilahi YHWH dengan huruf kapital.
theological_decisions:
- issue: Pelaku kepemimpinan dalam frasa pembuka yang secara leksikal sulit
  choice: para pemimpin memimpin
  alternative: rambut dibiarkan terurai / para pejuang membiarkan rambutnya terurai
  rationale: Konteks paralel dengan rakyat yang maju sukarela mendukung pengertian tampilnya para pemimpin, tetapi ketidakpastian filologis tetap dinyatakan dalam catatan kaki agar alternatif kuno tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan mudah dipahami. Pengulangan 'para pemimpin memimpin' dipertahankan untuk mencerminkan permainan kata Ibrani. Baris-baris paralel mengikuti bentuk nyanyian.
