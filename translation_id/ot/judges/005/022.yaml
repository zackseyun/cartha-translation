- from: Pada waktu itu derap kaki kuda mengentak karena berpacu—derap pacu kuda-kudanya yang perkasa.[a]
  to: Pada waktu itu kuku-kuku kuda menghentak akibat derap pacu, derap pacu kuda-kudanya yang perkasa.[a]
  rationale: Revisi mengganti subjek yang kurang alami dengan “kuku-kuku kuda,” sehingga tindakan menghentak dinyatakan oleh bagian tubuh kuda, sambil mempertahankan intensitas bunyi dan pengulangan puitis. Pembacaan utama tetap merujuk kepada kuda-kuda perkasa, tetapi catatan kaki mengekalkan kemungkinan bahwa אַבִּירָיו merujuk kepada pejuang.
