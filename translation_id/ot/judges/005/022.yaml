  yaml_path: translation/ot/judges/005/022.yaml
  text: Then the horses’ hoofs pounded from the galloping[a], the galloping of his mighty steeds.
translation:
  language: id
  text: Pada waktu itu kuku-kuku kuda menghentak akibat derap pacu, derap pacu kuda-kudanya yang perkasa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “derap pacu para pejuangnya yang perkasa.” Ungkapan Ibrani ini dapat menunjuk kepada kuda-kuda yang kuat atau kepada para pejuang yang berkaitan dengan kuda-kuda itu.
    reason: alternative_reading
lexical_decisions:
- source_word: אָז
  choice: Pada waktu itu
  rationale: Penanda waktu yang melanjutkan adegan dalam nyanyian; ungkapan ini alami dalam bahasa Indonesia dan tetap bernuansa puitis.
- source_word: הָלְמוּ
  choice: mengentak
  rationale: Kata kerja ini menggambarkan hantaman kuat dan bunyi berulang dari kaki kuda.
- source_word: עִקְּבֵי סוּס
  choice: derap kaki kuda
  rationale: Secara harfiah unsur katanya dapat berarti 'tumit-tumit kuda', tetapi dalam konteks gerak kuda ungkapan Indonesia 'derap kaki kuda' menyampaikan bunyi dan hentakannya secara wajar.
- source_word: מִדַּהֲרוֹת דַּהֲרוֹת
  choice: karena berpacu—derap pacu
  rationale: Preposisi מִן dipahami sebagai sebab, sedangkan pengulangan דַּהֲרוֹת dipertahankan secara idiomatis untuk menampilkan intensifikasi puitis.
- source_word: אַבִּירָיו
  choice: kuda-kudanya yang perkasa
  rationale: Dalam konteks derap dan pacuan, kata ini paling alami menunjuk kepada kuda-kuda yang kuat, tetapi kemungkinan bahwa kata tersebut menunjuk kepada para kesatria tetap dicatat.
theological_decisions:
- issue: Acuan sufiks orang ketiga tunggal dan makna אַבִּירָיו
  choice: kuda-kudanya yang perkasa
  alternative: orang-orangnya yang perkasa / para kesatrianya
  rationale: Konteks langsung tentang kaki kuda dan pacuan mendukung acuan kepada kuda-kuda kuat. Namun, karena אַבִּיר dapat menunjuk kepada sosok yang perkasa dan dapat dipahami sebagai para pejuang yang terkait dengan kuda-kuda itu, alternatif tersebut dipertahankan dalam catatan kaki tanpa menetapkan identitas pemilik yang tidak disebutkan dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan mudah dipahami. 'Derap', 'mengentak', dan pengulangan 'berpacu—derap pacu' mempertahankan daya bunyi nyanyian Ibrani tanpa terasa kuno. Pronomina 'kuda-kudanya' sengaja tidak menjelaskan siapa pemiliknya karena teks ayat hanya memakai sufiks maskulin tunggal.
