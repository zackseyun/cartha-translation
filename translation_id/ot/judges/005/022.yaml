    text: Atau, “derap pacu para pejuangnya yang perkasa.” Ungkapan Ibrani ini dapat menunjuk kepada kuda-kuda yang kuat atau kepada para pejuang yang berkaitan dengan kuda-kuda itu.
    reason: alternative_reading
