  source_fidelity: 'Teks secara akurat mencerminkan tiga klausa Ibrani: Sisera meminta air, Yael memberikan susu, lalu menyuguhkan חֶמְאָה dalam סֵפֶל אַדִּירִים. Subjek dan penerima yang tersirat tidak ditambahkan secara berlebihan. “Mangkuk para bangsawan” mempertahankan hubungan genitif yang memang terbuka dalam bahasa Ibrani.'
