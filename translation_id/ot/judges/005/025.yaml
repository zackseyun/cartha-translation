  terminology: “Air,” “susu,” “mangkuk,” dan “para bangsawan” tepat. “Dadih” dipakai secara hati-hati untuk חֶמְאָה, dan catatan kaki dengan tepat mencatat kemungkinan “mentega” atau “krim.” Penanda catatan kaki sudah ditempatkan pada unsur yang sesuai, tidak mengikuti pertukaran penanda dalam audit bahasa Inggris.
