  text: מַ֥יִם שָׁאַ֖ל חָלָ֣ב נָתָ֑נָה בְּ/סֵ֥פֶל אַדִּירִ֖ים הִקְרִ֥יבָה חֶמְאָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/025.yaml
  text: He asked for water[a]; she gave milk[b]. In a bowl fit for nobles she brought him curds.
translation:
  language: id
  text: Ia meminta air; diberikannya susu. Dalam mangkuk para bangsawan[a], disuguhkannya dadih[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam mangkuk yang pantas bagi bangsawan”; secara harfiah, “dalam mangkuk para bangsawan.”
    reason: lexical_alternative
  - marker: b
    text: Atau “mentega” atau “krim”; kata Ibrani ini menunjuk pada produk susu yang kaya.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם
  choice: air
  rationale: Makna dasar kata ini adalah air secara harfiah; dipertahankan untuk menonjolkan perbedaan antara yang diminta dan yang diberikan.
- source_word: שָׁאַל
  choice: meminta
  rationale: Bentuk Qal perfektum orang ketiga maskulin tunggal menyatakan bahwa ia meminta air; 'meminta' alami dan tepat dalam bahasa Indonesia.
- source_word: חָלָב
  choice: susu
  rationale: Ini adalah padanan lazim untuk kata Ibrani tersebut dan mempertahankan gambaran keramahtamahan dalam syair.
- source_word: נָתָנָה
  choice: diberikannya
  rationale: Bentuk Qal perfektum orang ketiga feminin tunggal menunjuk kepada perempuan dalam konteks. Susunan inversi ini mempertahankan keringkasan dan kesejajaran puitis tanpa harus menambahkan nama yang tidak terdapat dalam ayat.
- source_word: בְּסֵפֶל
  choice: dalam mangkuk
  rationale: סֵפֶל menunjuk pada wadah seperti mangkuk atau baskom; 'mangkuk' merupakan padanan modern yang paling alami dalam konteks penyajian makanan.
- source_word: אַדִּירִים
  choice: para bangsawan
  rationale: Bentuk jamak ini dapat menunjuk kepada orang-orang mulia, berkuasa, atau terpandang. Frasa 'mangkuk para bangsawan' mempertahankan konstruksi Ibrani dan ambiguitas mengenai hubungan mangkuk itu dengan para bangsawan.
- source_word: הִקְרִיבָה
  choice: disuguhkannya
  rationale: Hifil dari קרב secara harfiah berarti membawa atau mendekatkan. Dalam konteks menjamu tamu, 'menyuguhkan' menyampaikan tindakan tersebut secara alami tanpa nuansa kurban yang tidak diperlukan.
- source_word: חֶמְאָה
  choice: dadih
  rationale: Kata ini dapat menunjuk pada produk susu yang kaya, seperti dadih, mentega, atau krim. 'Dadih' sesuai dengan konteks pangan kuno, sedangkan alternatif leksikal dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa dibuat ringkas, puitis, dan bermartabat sesuai bentuk nyanyian. Inversi 'diberikannya' dan 'disuguhkannya' mempertahankan kesejajaran antarklausa serta menghindari penambahan nama subjek yang tidak tertulis dalam ayat. Penanda catatan kaki ditempatkan pada unsur yang benar, karena penempatan penanda dalam lapisan konsultasi bahasa Inggris tampaknya tertukar.
