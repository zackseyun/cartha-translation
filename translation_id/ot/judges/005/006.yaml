base_translation:
  language: en
  yaml_path: translation/ot/judges/005/006.yaml
  text: In the days of Shamgar son of Anath[a], in the days of Jael, the highways were deserted[b], and travelers went by roundabout paths.
translation:
  language: id
  text: Pada zaman Samgar bin Anat, pada zaman Yael, jalan-jalan utama tidak lagi dilalui[a], dan para pengguna jalan menempuh jalan-jalan berliku[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jalan-jalan itu berhenti”; maksudnya, perjalanan biasa melalui jalur-jalur utama terhenti.
    reason: lexical_alternative
  - marker: b
    text: “Jalan-jalan berliku” kemungkinan menunjuk pada jalur tidak langsung yang ditempuh demi keamanan, bukan pada kebengkokan moral.
    reason: cultural_note
lexical_decisions:
- source_word: בִּימֵי
  choice: pada zaman
  rationale: Ungkapan waktu ini menunjuk pada masa yang ditandai oleh tokoh-tokoh yang disebut; “pada zaman” alami dan sesuai dengan ragam naratif-puitis Indonesia.
- source_word: שַׁמְגַּר בֶּן עֲנָת
  choice: Samgar bin Anat
  rationale: Nama diri ditransliterasikan menurut kebiasaan Indonesia, sedangkan בֶּן diterjemahkan dengan “bin” sebagai penanda hubungan anak laki-laki dengan ayah.
- source_word: יָעֵל
  choice: Yael
  rationale: Transliterasi ini mengikuti bentuk Ibrani dan lazim dalam Alkitab bahasa Indonesia.
- source_word: חָדְלוּ אֳרָחוֹת
  choice: jalan-jalan utama tidak lagi dilalui
  rationale: Secara harfiah, jalan-jalan itu “berhenti”; dalam konteks, pemakaian normal jalur-jalur umum terhenti. Ungkapan ini menyampaikan akibatnya tanpa menyatakan bahwa jalannya lenyap.
- source_word: הֹלְכֵי נְתִיבוֹת
  choice: orang-orang yang bepergian
  rationale: Secara harfiah berarti “mereka yang berjalan di jalur-jalur.” Terjemahan ini menyampaikan rujukan kepada para pengguna jalan secara wajar, tanpa menambahkan jenis pelancong tertentu.
- source_word: יֵלְכוּ
  choice: menempuh
  rationale: Bentuk imperfek dalam konteks nyanyian tentang masa lampau menggambarkan tindakan yang biasa dilakukan; “menempuh” berpadu alami dengan kata “jalan”.
- source_word: אֳרָחוֹת עֲקַלְקַלּוֹת
  choice: jalan-jalan berliku
  rationale: Kata sifatnya berarti berkelok, bengkok, atau tidak langsung. “Berliku” mempertahankan gambaran jalur tidak langsung dan tidak memasukkan makna moral.
