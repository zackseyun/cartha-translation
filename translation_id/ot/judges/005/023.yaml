  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: א֣וֹרוּ מֵר֗וֹז אָמַר֙ מַלְאַ֣ךְ יְהוָ֔ה אֹ֥רוּ אָר֖וֹר יֹשְׁבֶ֑י/הָ כִּ֤י לֹֽא בָ֨אוּ֙ לְ/עֶזְרַ֣ת יְהוָ֔ה לְ/עֶזְרַ֥ת יְהוָ֖ה בַּ/גִּבּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/023.yaml
  text: Curse Meroz[a], said the angel of Yahweh; curse, utterly curse its inhabitants, because they did not come to the help of Yahweh[b], to the help of Yahweh against the mighty.
translation:
  language: id
  text: “Kutukilah Meroz,” kata utusan Yahweh[a]. “Kutukilah, kutukilah habis-habisan penduduknya, karena mereka tidak datang membantu Yahweh, membantu Yahweh melawan para perkasa.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “malaikat Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: Frasa Ibrani terakhir secara harfiah dapat diterjemahkan “di antara para perkasa”; mungkin juga berarti “bersama para pejuang perkasa.”
    reason: alternative_reading
lexical_decisions:
- source_word: א֣וֹרוּ / אֹ֥רוּ אָר֖וֹר
  choice: Kutukilah / kutukilah habis-habisan
  rationale: Kata kerja ארר menyatakan kutukan yang keras. Gabungan imperatif dengan infinitif absolut pada seruan kedua memberi penegasan intensif, yang disampaikan secara alami dalam bahasa Indonesia dengan “kutukilah habis-habisan”.
- source_word: מֵר֗וֹז
  choice: Meroz
  rationale: Nama diri dipertahankan melalui transliterasi; ayat tidak menjelaskan lebih jauh apakah Meroz adalah kota atau daerah.
- source_word: מַלְאַ֣ךְ יְהוָ֔ה
  choice: utusan Yahweh
  rationale: מַלְאָךְ dapat berarti “utusan” atau “malaikat”. “Utusan” mempertahankan keluasan makna leksikal tanpa memutuskan identitas atau hakikat tokoh tersebut; alternatif tradisional dicatat dalam catatan kaki.
- source_word: יֹשְׁבֶ֑יהָ
  choice: penduduknya
  rationale: Bentuk partisipial dengan sufiks feminin tunggal menunjuk kepada orang-orang yang mendiami Meroz; “penduduknya” ringkas dan alami.
- source_word: כִּ֤י לֹֽא בָ֨אוּ֙
  choice: karena mereka tidak datang
  rationale: כִּי memperkenalkan alasan bagi kutukan, sehingga “karena” menyampaikan hubungan kausal dengan jelas.
- source_word: לְעֶזְרַ֣ת יְהוָ֔ה
  choice: membantu Yahweh
  rationale: Ungkapan nominal Ibrani secara harfiah berarti datang “untuk pertolongan Yahweh”. Dalam bahasa Indonesia, “datang membantu Yahweh” lebih wajar sambil mempertahankan pengulangan retorisnya.
- source_word: בַּגִּבּוֹרִֽים
  choice: melawan para perkasa
  rationale: Preposisi בְּ pada frasa sulit ini dapat dipahami dengan beberapa cara. Dalam konteks pertempuran, “melawan para perkasa” memberi makna yang koheren, tetapi kemungkinan “di antara” atau “bersama para pejuang perkasa” tetap dicatat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga bentuk nama dalam sumber tetap terlihat.
- issue: Identitas מַלְאַךְ יְהוָה
  choice: utusan Yahweh
  alternative: malaikat Yahweh
  rationale: Terjemahan ini tidak menetapkan apakah sosok tersebut malaikat surgawi, utusan lain, atau manifestasi khusus Yahweh; ambiguitas leksikal dan ketegangan teologis dijaga melalui catatan kaki.
- issue: Arah relasi dalam בַּגִּבּוֹרִים
  choice: melawan para perkasa
  alternative: di antara para perkasa atau bersama para pejuang perkasa
  rationale: Konteks nyanyian perang mendukung pembacaan adversatif, tetapi sintaks Ibraninya tidak tegas, sehingga pilihan lain dinyatakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan tegas. Pengulangan seruan kutukan dan frasa “membantu Yahweh” dipertahankan untuk mencerminkan retorika puisi Ibrani. Semua penanda catatan kaki muncul dalam teks utama.
