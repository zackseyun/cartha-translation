  source_fidelity: Terjemahan dengan setia mempertahankan imperatif kutukan yang berulang dan intensifikasi infinitif absolut dalam “kutukilah habis-habisan,” nama Meroz, alasan kausal, serta pengulangan retoris “membantu Yahweh.” “Utusan Yahweh” merupakan padanan yang sah untuk מַלְאַךְ יְהוָה tanpa memutuskan identitas sosok itu. “Melawan para perkasa” adalah pembacaan kontekstual yang mungkin bagi frasa Ibrani yang sintaksisnya diperdebatkan, dan alternatifnya telah dicatat.
