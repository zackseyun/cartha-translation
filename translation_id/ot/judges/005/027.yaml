base_translation:
  language: en
  yaml_path: translation/ot/judges/005/027.yaml
  text: Between her feet he sank[a], he fell, he lay; between her feet he sank, he fell; where he sank[c][b], there he fell—destroyed.
translation:
  language: id
  text: 'Di antara kedua kakinya[a] ia rebah, jatuh, terbaring;

    di antara kedua kakinya ia rebah, jatuh;

    di tempat ia rebah, di situ ia jatuh—binasa.[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “di dekat kakinya”; ungkapan Ibraninya secara harfiah berarti “di antara kedua kakinya.”
    reason: lexical_alternative
  - marker: b
    text: Kata yang diterjemahkan “binasa” juga dapat berarti “dihancurkan” atau, dalam konteks ini, “tewas.”
    reason: lexical_alternative
  - marker: c
    text: Bahasa Ibrani mengulang rangkaian verba pendek—“rebah, jatuh, terbaring ... rebah, jatuh”—untuk menghasilkan penekanan puitis.
    reason: cultural_note
lexical_decisions:
- source_word: בֵּין רַגְלֶיהָ
  choice: di antara kedua kakinya
  rationale: Mempertahankan gambaran ruang dan pengulangan bahasa Ibrani. Kata רַגְלַיִם berbentuk ganda dan secara wajar merujuk pada kedua kaki; terjemahan ini tidak membuat ungkapan itu sejelas-anatomis ‘di antara kedua pahanya’.
- source_word: כָּרַע
  choice: ia merosot
  rationale: Dalam adegan kematian ini, verba tersebut menggambarkan tubuh yang turun karena lutut atau badan melemah. ‘Merosot’ menghindari kesan penghormatan sukarela pada ‘membungkuk’ dan kesengajaan pada ‘berlutut’.
- source_word: נָפַל
  choice: jatuh
  rationale: Padanan langsung yang dipertahankan tanpa variasi agar irama dan penegasan melalui pengulangan tetap terasa.
- source_word: שָׁכָב
  choice: terbaring
  rationale: Menyampaikan keadaan tubuh setelah merosot dan jatuh serta menjaga rangkaian verba yang singkat dan tajam.
- source_word: בַּאֲשֶׁר
  choice: di tempat
  rationale: Bersama klausa berikutnya, bentuk ini berfungsi secara adverbial untuk menunjukkan tempat. ‘Di tempat ... di situ’ mempertahankan korelasi yang tegas dalam bahasa Ibrani.
- source_word: שָׁם
  choice: di situ
  rationale: Mempertahankan penunjuk tempat yang memberi penekanan pada larik penutup.
- source_word: שָׁדוּד
  choice: binasa
  rationale: Partisip pasif ini menyatakan keadaan seseorang yang telah dirusakkan, ditaklukkan, atau dihancurkan. Dalam konteks Sisera yang dibunuh, ‘binasa’ terdengar alami bagi orang yang tewas sekaligus mempertahankan daya puitis tanpa memperinci cara kematiannya.
