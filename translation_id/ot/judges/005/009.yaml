  text: לִבִּ/י֙ לְ/חוֹקְקֵ֣י יִשְׂרָאֵ֔ל הַ/מִּֽתְנַדְּבִ֖ים בָּ/עָ֑ם בָּרֲכ֖וּ יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/009.yaml
  text: My heart is with the leaders of Israel[a], who volunteered among the people. Bless Yahweh!
translation:
  language: id
  text: Hatiku tertuju kepada para pemimpin Israel[a], yang dengan sukarela menawarkan diri di antara rakyat. Pujilah Yahweh!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Hatiku tertuju kepada para pembuat ketetapan Israel, mereka yang dengan sukarela menawarkan diri di antara rakyat.”'
    reason: Alternatif ini mempertahankan hubungan leksikal חֹקְקֵי dengan tindakan menetapkan atau mengeluarkan ketetapan, sambil mempertahankan nuansa refleksif dari הַמִּתְנַדְּבִים, yaitu menawarkan diri dengan sukarela.
lexical_decisions:
- source_word: לִבִּי
  choice: Hatiku
  rationale: Mempertahankan ungkapan Ibrani harfiah dengan akhiran orang pertama tunggal; dalam konteks ini ungkapan tersebut menyatakan keberpihakan dan penghargaan Debora.
- source_word: לְחוֹקְקֵי
  choice: bersama para pemimpin
  rationale: Bentuk dari חקק dapat menunjuk kepada orang-orang yang menetapkan keputusan, yaitu penguasa atau pemimpin. 'Para pemimpin' paling jelas dalam konteks tanggung jawab kepemimpinan, sedangkan nuansa menetapkan ketetapan dipertahankan dalam catatan kaki.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Menunjukkan bahwa para pemimpin itu berasal dari atau termasuk dalam Israel.
- source_word: הַמִּתְנַדְּבִים
  choice: yang dengan sukarela tampil
  rationale: Bentuk hitpael dari נדב menyatakan kesediaan menawarkan diri. 'Dengan sukarela tampil' terdengar alami dan menunjukkan bahwa mereka maju untuk mengambil tanggung jawab tanpa paksaan.
- source_word: בָּעָם
  choice: di tengah-tengah rakyat
  rationale: עם pada dasarnya berarti 'rakyat' atau 'umat'. Terjemahan ini mempertahankan cakupan sosial yang luas tanpa mempersempitnya menjadi pasukan.
- source_word: בָּרֲכוּ
  choice: Pujilah
  rationale: Imperatif jamak dari ברך. Ketika manusia diarahkan untuk 'memberkati' Allah, ungkapan Indonesia yang alami dan sesuai maksudnya ialah 'memuji' Dia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama pribadi ilahi dan merupakan transliterasi yang lazim berdasarkan bentuk Ibraninya.
- issue: Makna tindakan manusia terhadap Allah dalam בָּרֲכוּ יְהוָה
  choice: Pujilah Yahweh
  alternative: Berkatilah Yahweh
  rationale: Kata sumber secara leksikal berarti 'memberkati', tetapi ketika objeknya Allah, maksud idiomatisnya adalah memuji atau menyatakan Dia terpuji. Pilihan ini menghindari kesan bahwa manusia menganugerahkan berkat kepada Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis secara ringan agar sesuai dengan nyanyian Debora. 'Rakyat' dipilih alih-alih 'pasukan' untuk tidak mempersempit עם, dan penanda catatan kaki ditempatkan langsung setelah frasa yang memiliki alternatif leksikal.
