base_translation:
  language: en
  yaml_path: translation/ot/judges/005/015.yaml
  text: And the princes of Issachar were with Deborah[a]; and Issachar was likewise with Barak; into the valley they were sent at his feet[c][b]. Among the divisions of Reuben there were great searchings of heart.
translation:
  language: id
  text: Para pemimpin Isakhar menyertai Debora[a], dan Isakhar pun menyertai Barak. Ke lembah mereka dikerahkan dengan mengikuti dia dari dekat[b]. Di antara kelompok-kelompok Ruben, ada pergulatan batin yang mendalam[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para pembesar Isakhar.” Ungkapan Ibraninya bersifat puitis dan mungkin digunakan secara idiomatis, bukan sebagai bentuk kepunyaan yang ketat.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di kakinya,” yaitu mengikuti Barak dari dekat.
    reason: lexical_alternative
  - marker: c
    text: Atau “pertimbangan hati yang besar” atau “tekad hati yang besar.” Ungkapan Ibraninya sulit; dalam konteks ini kemungkinan besar yang ditonjolkan ialah perdebatan batin Ruben, bukan tindakan nyata.
    reason: alternative_reading
lexical_decisions:
- source_word: שָׂרַי בְּיִשָּׂשכָר
  choice: para pemimpin Isakhar
  rationale: Dalam puisi ini, bentuk yang secara harfiah dapat tampak posesif paling wajar dipahami secara idiomatis sebagai para pemimpin atau pembesar Isakhar. “Pemimpin” alami dan jelas dalam bahasa Indonesia modern.
- source_word: עִם
  choice: menyertai
  rationale: Menyatakan kebersamaan dan dukungan aktif dalam konteks pengerahan perang; lebih alami daripada sekadar “bersama” dalam susunan kalimat ini.
- source_word: וְיִשָּׂשכָר כֵּן בָּרָק
  choice: dan Isakhar pun menyertai Barak
  rationale: כֵּן menandai kesejajaran, sedangkan klausa Ibrani bersifat eliptis. “Pun menyertai” melengkapi unsur yang tersirat tanpa menghilangkan paralelismenya.
- source_word: בָּעֵמֶק שֻׁלַּח
  choice: mereka dikerahkan ke lembah
  rationale: Konteks militer mendukung gerak menuju lembah. Walaupun verba berbentuk tunggal, subjek suku Isakhar bersifat kolektif sehingga bentuk jamak menyampaikan maksudnya secara wajar.
- source_word: בְּרַגְלָיו
  choice: dengan mengikuti jejak langkahnya
  rationale: Ungkapan harfiahnya “di kakinya” menunjukkan bahwa pasukan Isakhar mengikuti Barak dari dekat. Ungkapan Indonesia ini mempertahankan citra kaki sambil menjelaskan maksud idiomatisnya.
- source_word: בִּפְלַגּוֹת רְאוּבֵן
  choice: di antara kelompok-kelompok Ruben
  rationale: פְּלַגּוֹת menunjuk pada bagian, kelompok, atau faksi internal Ruben. “Kelompok-kelompok” tidak secara keliru menyiratkan satuan militer resmi.
- source_word: גְּדֹלִים חִקְקֵי לֵב
  choice: ada pergulatan batin yang mendalam
  rationale: Frasa puitis yang sulit ini menggambarkan pertimbangan atau penyelidikan hati yang kuat. Dalam konteks keraguan Ruben, “pergulatan batin” menjaga tekanan pada perenungan yang tidak segera menjadi tindakan.
