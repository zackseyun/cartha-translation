  yaml_path: translation/ot/judges/005/024.yaml
  text: Most blessed among women is Jael[a], the wife of Heber the Kenite; among women in the tent[b], most blessed is she.
translation:
  language: id
  text: Diberkatilah Yael[a], istri Heber, orang Keni itu, melebihi perempuan-perempuan; diberkatilah dia melebihi perempuan-perempuan di dalam kemah[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Di antara perempuan-perempuan, Yael paling diberkati … di antara perempuan-perempuan di dalam kemah, dialah yang paling diberkati.” Konstruksi perbandingan dalam bahasa Ibrani dapat diterjemahkan dengan arti “melebihi” atau “di antara … paling.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “di dalam kemah.” Ungkapan ini mungkin merujuk pada perempuan-perempuan penghuni kemah, tetapi kata Ibrani untuk “kemah” berbentuk tunggal.'
    reason: cultural_note
lexical_decisions:
- source_word: תְּבֹרַךְ
  choice: Diberkatilah
  rationale: Bentuk Pual orang ketiga feminin tunggal dari ברך menyatakan bahwa Yael diberkati atau dipuji. Bentuk Indonesia ini mempertahankan nada puitis dan deklaratif tanpa memaksakan apakah nuansanya pernyataan atau harapan.
- source_word: מִנָּשִׁים
  choice: melebihi perempuan-perempuan lain
  rationale: Preposisi מִן menandai perbandingan. Pilihan ini menyampaikan arti komparatif secara alami; kemungkinan memahami konstruksi itu secara superlatif sebagai 'di antara perempuan-perempuan' dicatat dalam catatan kaki.
- source_word: יָעֵל
  choice: Yael
  rationale: Nama pribadi ditransliterasikan sesuai bentuk yang wajar dalam bahasa Indonesia dan cukup dekat dengan bunyi Ibrani.
- source_word: אֵשֶׁת חֶבֶר הַקֵּינִי
  choice: istri Heber, orang Keni itu
  rationale: Rangkaian konstruksi ini mengidentifikasi Yael melalui hubungan pernikahan dan asal kelompok Heber. Susunan tersebut jelas dan alami dalam bahasa Indonesia.
- source_word: בָּאֹהֶל
  choice: yang tinggal di kemah
  rationale: Secara harfiah berarti 'di dalam kemah' dengan bentuk tunggal. Dalam konteks, ungkapan ini tampaknya menerangkan perempuan-perempuan yang hidup di lingkungan kemah; terjemahan utama dibuat alami, sedangkan bentuk harfiahnya dicatat.
- source_word: תְּבֹרָךְ
  choice: diberkatilah dia
  rationale: Pengulangan kata kerja dipertahankan untuk menjaga kesejajaran dan penekanan puitis baris Ibrani.
