id: JDG.5.11
reference: Judges 5:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִ/קּ֣וֹל מְחַֽצְצִ֗ים בֵּ֚ין מַשְׁאַבִּ֔ים שָׁ֤ם יְתַנּוּ֙ צִדְק֣וֹת יְהוָ֔ה צִדְקֹ֥ת פִּרְזֹנ֖/וֹ בְּ/יִשְׂרָאֵ֑ל אָ֛ז יָרְד֥וּ לַ/שְּׁעָרִ֖ים עַם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/011.yaml
  text: From the sound of archers among the watering places[a], there they recount the righteous acts of Yahweh, the righteous acts of his villagers in Israel[c][b]. Then the people of Yahweh went down to the gates.
translation:
  language: id
  text: 'Dari bunyi para pemanah di antara tempat-tempat orang menimba air,[a]

    di sana mereka menuturkan tindakan-tindakan adil Yahweh,

    tindakan-tindakan adil warga desa-Nya di Israel.[b]

    Lalu umat Yahweh turun ke gerbang-gerbang.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan pembuka dalam bahasa Ibrani sulit. Dapat juga diterjemahkan, “Pada bunyi para pemanah di antara tempat-tempat orang menimba air.” Sebagian memahami frasa ini sebagai keterangan tempat atau keadaan ketika nyanyian itu terdengar, bukan sebagai pemisahan dari bunyi itu.
    reason: alternative_reading
  - marker: b
    text: Kata Ibrani yang diterjemahkan “warga desa” tidak pasti maknanya. Kata itu juga dapat dipahami sebagai “permukiman tanpa tembok”, “penduduk pedesaan”, atau—meski kurang mungkin—“para penguasa”. Hubungan frasa ini dengan “tindakan-tindakan adil” juga dapat dipahami sebagai tindakan-tindakan adil Yahweh bagi penduduk desa.
    reason: lexical_alternative
  - marker: c
    text: Gerbang kota di Israel kuno merupakan tempat berkumpul untuk urusan masyarakat dan pengadilan, serta berkaitan dengan keamanan kota.
    reason: cultural_note
lexical_decisions:
- source_word: מִקּוֹל מְחַצְצִים
  choice: Dari tengah bunyi para pemanah
  rationale: מִן + קוֹל dapat menyatakan sumber atau hubungan dengan bunyi, sedangkan מְחַצְצִים dalam konteks ini lazim dipahami sebagai para pemanah. Ungkapan “dari tengah bunyi” mempertahankan gambaran puitis tanpa memastikan apakah bunyi itu sumber nyanyian atau keadaan yang melatarinya.
- source_word: בֵּין מַשְׁאַבִּים
  choice: di tempat-tempat menimba air
  rationale: מַשְׁאַבִּים menunjuk tempat orang menimba air, seperti sumur atau palungan air. Bentuk jamak dipertahankan, sedangkan בֵּין diterjemahkan secara idiomatis sebagai lokasi di tengah sejumlah tempat tersebut.
- source_word: יְתַנּוּ
  choice: orang menuturkan kembali
  rationale: Bentuk Piel ini menyatakan pengisahan atau pengulangan secara lisan. “Menuturkan kembali” cocok dengan suasana syair kemenangan tanpa memastikan bahwa tuturan itu dinyanyikan.
- source_word: צִדְקוֹת יְהוָה
  choice: segala tindakan benar Yahweh
  rationale: צִדְקוֹת di sini menunjuk tindakan nyata yang memperlihatkan kebenaran atau keadilan Yahweh. Terjemahan ini mempertahankan cakupan istilah dan tidak mempersempitnya menjadi kemenangan atau penyelamatan saja.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: צִדְקֹת פִּרְזֹנוֹ
  choice: segala tindakan benar warga desa-Nya
  rationale: פִּרְזוֹן adalah istilah puitis yang sulit; bentuk terkait dalam Hakim-Hakim 5:7 menunjuk kehidupan atau penduduk pedesaan. Terjemahan utama mengikuti kemungkinan bahwa akhiran pronominal menghubungkan warga desa itu dengan Yahweh, sambil mempertahankan alternatif dalam catatan kaki.
- source_word: אָז יָרְדוּ לַשְּׁעָרִים
  choice: Lalu ... turun menuju gerbang-gerbang kota
  rationale: אָז menandai kelanjutan waktu, dan יָרְדוּ mempertahankan gerak “turun”. Penambahan “kota” memperjelas bahwa gerbang yang dimaksud adalah ruang masuk dan ruang publik permukiman kuno.
- source_word: עַם יְהוָה
  choice: umat Yahweh
  rationale: “Umat Yahweh” adalah padanan Indonesia yang alami bagi frasa konstruksi ini dan mempertahankan identitas umat sebagai milik Yahweh.
theological_decisions:
- issue: Penerjemahan nama יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama diri.
- issue: Makna צִדְקוֹת dalam syair kemenangan
  choice: segala tindakan benar
  alternative: tindakan penyelamatan; kemenangan-kemenangan
  rationale: Istilah ini dapat mencakup tindakan yang menyatakan kebenaran dan keadilan, termasuk pembebasan dalam konteks ini. Padanan yang dipilih menjaga keluasan makna dan tidak membatasi rujukannya hanya pada kemenangan militer.
- issue: Hubungan צִדְקֹת dengan פִּרְזֹנוֹ
  choice: tindakan benar warga desa-Nya
  alternative: tindakan benar-Nya bagi penduduk desa; tindakan benar di permukiman tanpa tembok; tindakan benar para penguasa-Nya
  rationale: Susunan Ibrani dan arti kata terakhir diperdebatkan. Terjemahan utama mempertahankan konstruksi genitif secara dekat, tanpa diam-diam mengubah warga desa menjadi penerima tindakan Yahweh; ketidakpastian dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya puitis yang tetap mudah dipahami. Paralelisme Ibrani dipertahankan melalui pengulangan “segala tindakan benar”. Istilah budaya yang berpotensi kabur dijelaskan lewat catatan kaki, dan ambiguitas leksikal tidak diselesaikan secara dogmatis.
