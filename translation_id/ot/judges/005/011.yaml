  naturalness: Teks revisi memakai Bahasa Indonesia baku yang puitis namun wajar. “Tempat-tempat orang menimba air” menyampaikan bentuk jamak dan konteks מַשְׁאַבִּים secara lebih jelas daripada “tempat-tempat menimba air.”
  terminology: “Yahweh” dipertahankan untuk יהוה. “Tindakan-tindakan adil” menyampaikan צִדְקוֹת sebagai tindakan konkret yang menunjukkan keadilan/kebenaran tanpa mempersempitnya menjadi kemenangan atau penyelamatan. Frasa “warga desa-Nya” dipertahankan sebagai pembacaan utama yang dekat dengan konstruksi Ibrani, dengan ketidakpastian leksikal dan relasional dijelaskan dalam catatan.
