    segala tindakan benar warga desa-Nya di Israel.[b]

    Lalu umat Yahweh turun menuju gerbang-gerbang kota.[c]'
  to: 'Dari bunyi para pemanah di antara tempat-tempat orang menimba air,[a]

    di sana mereka menuturkan tindakan-tindakan adil Yahweh,

    tindakan-tindakan adil warga desa-Nya di Israel.[b]

    Lalu umat Yahweh turun ke gerbang-gerbang.[c]'
  rationale: Revisi menghapus tambahan makna ‘tengah’ dalam frasa pembuka, menerjemahkan בֵּין secara lebih tampak sebagai ‘di antara’, dan memakai ‘ke gerbang-gerbang’ sebagai padanan langsung bagi arah gerak dalam bahasa Ibrani. Paralelisme, nama Yahweh, serta ambiguitas istilah פִּרְזֹנוֹ tetap dipelihara.
