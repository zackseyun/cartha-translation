base_translation:
  language: en
  yaml_path: translation/ot/judges/005/019.yaml
  text: Kings came; they fought. Then the kings of Canaan fought at Taanach[a], by the waters of Megiddo; they took no plunder of silver.
translation:
  language: id
  text: Raja-raja datang, mereka berperang. Lalu raja-raja Kanaan berperang di Taanakh, dekat perairan Megido; mereka tidak memperoleh jarahan perak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keuntungan berupa perak” atau “laba berupa perak.” Ungkapan Ibrani ini dapat menunjuk pada keuntungan materi secara umum, tetapi dalam konteks pertempuran, “jarahan perak” paling sesuai.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאוּ מְלָכִים
  choice: Raja-raja datang
  rationale: Mempertahankan pembukaan puitis yang ringkas dan bentuk jamak tanpa artikel tertentu.
- source_word: נִלְחָמוּ
  choice: mereka berperang
  rationale: Padanan alami dan langsung untuk bentuk Nifal dari לחם dalam konteks pertempuran.
- source_word: אָז
  choice: Pada waktu itu
  rationale: Menandai adegan atau saat yang sama/berikutnya tanpa memaksakan urutan kronologis yang terlalu tegas dalam puisi.
- source_word: מַלְכֵי כְנַעַן
  choice: raja-raja Kanaan
  rationale: Mencerminkan konstruksi kepunyaan Ibrani secara wajar dalam bahasa Indonesia.
- source_word: בְּתַעְנַךְ
  choice: di Taanakh
  rationale: Preposisi ב menunjuk lokasi pertempuran; 'di' adalah bentuk Indonesia yang paling alami.
- source_word: עַל מֵי מְגִדּוֹ
  choice: dekat perairan Megido
  rationale: עַל dalam keterangan geografis ini menyatakan kedekatan dengan perairan; 'perairan' menjaga bentuk jamak kolektif מֵי.
- source_word: בֶּצַע כֶּסֶף
  choice: jarahan perak
  rationale: בצע dapat berarti keuntungan atau perolehan, termasuk rampasan; konteks perang mendukung 'jarahan' sambil mencatat alternatif dalam catatan kaki.
- source_word: לֹא לָקָחוּ
  choice: mereka tidak memperoleh
  rationale: Secara harfiah berarti 'mereka tidak mengambil'; bersama 'jarahan', 'memperoleh' terdengar alami dan menyatakan bahwa mereka tidak mendapatkan hasil pertempuran.
theological_decisions: []
