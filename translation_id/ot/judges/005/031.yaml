  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כֵּ֠ן יֹאבְד֤וּ כָל אוֹיְבֶ֨י/ךָ֙ יְהוָ֔ה וְ/אֹ֣הֲבָ֔י/ו כְּ/צֵ֥את הַ/שֶּׁ֖מֶשׁ בִּ/גְבֻרָת֑/וֹ וַ/תִּשְׁקֹ֥ט הָ/אָ֖רֶץ אַרְבָּעִ֥ים שָׁנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/031.yaml
  text: So may all your enemies perish[a], O Yahweh, but may those who love him be like the rising of the sun in its strength[b]. And the land had rest forty years.
translation:
  language: id
  text: Demikianlah kiranya semua musuh-Mu binasa, ya Yahweh! Namun, kiranya orang-orang yang mengasihi-Nya menjadi seperti matahari yang terbit dalam keperkasaannya.[a] Lalu negeri itu tenteram selama empat puluh tahun.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “seperti keluarnya matahari dalam keperkasaannya.”'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “negeri itu tenang”; dalam kitab Hakim-Hakim, ungkapan ini lazim menunjuk pada masa damai atau istirahat setelah konflik.
    reason: cross_reference
lexical_decisions:
- source_word: כֵּן יֹאבְדוּ
  choice: Demikianlah kiranya ... binasa
  rationale: כֵּן mengaitkan harapan penutup ini dengan kisah yang baru dinyanyikan, sedangkan bentuk imperfek יֹאבְדוּ dalam konteks ini menyatakan harapan atau permohonan. “Kiranya ... binasa” menyampaikan daya jusifnya tanpa menentukan cara kebinasaan itu.
- source_word: כָל אוֹיְבֶיךָ
  choice: semua musuh-Mu
  rationale: Menerjemahkan frasa konstruksi secara langsung dan mempertahankan sapaan orang kedua tunggal kepada Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: וְאֹהֲבָיו
  choice: Namun, kiranya orang-orang yang mengasihi-Nya
  rationale: וְ menyatakan pertentangan dengan nasib para musuh. Ungkapan ini mempertahankan akhiran orang ketiga tunggal dalam bahasa Ibrani dan tidak meratakan peralihan dari sapaan langsung “musuh-Mu” menjadi acuan “mengasihi-Nya”.
- source_word: כְּצֵאת הַשֶּׁמֶשׁ
  choice: seperti matahari yang terbit
  rationale: יצא secara dasar berarti “keluar”, tetapi bila subjeknya matahari, frasa ini secara wajar menunjuk pada kemunculan atau terbitnya matahari.
- source_word: בִּגְבֻרָתוֹ
  choice: dalam keperkasaannya
  rationale: Mempertahankan gambaran kekuatan atau kedahsyatan matahari tanpa mempersempitnya hanya pada terang atau panas.
- source_word: וַתִּשְׁקֹט הָאָרֶץ
  choice: Lalu negeri itu tenteram
  rationale: שׁקט secara harfiah menunjuk pada keadaan tenang; dalam rumus naratif kitab Hakim-Hakim, ungkapan ini menyatakan berhentinya konflik dan masa ketenteraman. “Negeri itu tenteram” alami dalam bahasa Indonesia dan tetap dekat dengan metafora sumber.
- source_word: אַרְבָּעִים שָׁנָה
  choice: selama empat puluh tahun
  rationale: “Selama” memperjelas bahwa frasa tersebut menyatakan jangka waktu.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi. Bentuk “Yahweh” mempertahankannya sebagai nama, bukan menggantinya dengan gelar.
- issue: Peralihan pronomina dalam כָל אוֹיְבֶיךָ ... וְאֹהֲבָיו
  choice: “musuh-Mu” lalu “orang-orang yang mengasihi-Nya”
  alternative: 'Meratakan keduanya menjadi sapaan orang kedua: “musuh-Mu ... orang-orang yang mengasihi-Mu”'
  rationale: Bahasa Ibrani beralih dari akhiran orang kedua tunggal pada “musuh-musuh-Mu” ke orang ketiga tunggal pada “orang-orang yang mengasihi-Nya”. Terjemahan mempertahankan peralihan yang asli dan tidak menafsirkan ulang ketegangan gramatikalnya.
- issue: Daya modal pada klausa orang-orang yang mengasihi Yahweh
  choice: kiranya ... menjadi
  alternative: orang-orang yang mengasihi-Nya adalah/seperti
  rationale: Walaupun klausa kedua tidak memiliki verba eksplisit, paralelismenya dengan יֹאבְדוּ mendukung pemahaman sebagai kelanjutan harapan penutup. “Kiranya” membuat hubungan itu jelas tanpa mengubah gambaran perbandingannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Demikianlah kiranya” mempertahankan corak penutup puitis, sedangkan “tenteram” menyampaikan rumus naratif dengan jelas. Kapitalisasi pronomina ilahi dipakai untuk kejelasan rujukan, sambil tetap mempertahankan peralihan orang kedua ke orang ketiga dalam teks Ibrani.
