id: JDG.5.4
reference: Judges 5:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְהוָ֗ה בְּ/צֵאתְ/ךָ֤ מִ/שֵּׂעִיר֙ בְּ/צַעְדְּ/ךָ֙ מִ/שְּׂדֵ֣ה אֱד֔וֹם אֶ֣רֶץ רָעָ֔שָׁה גַּם שָׁמַ֖יִם נָטָ֑פוּ גַּם עָבִ֖ים נָ֥טְפוּ מָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/005/004.yaml
  text: O Yahweh[a], when you went out from Seir, when you marched from the field of Edom, the earth trembled; the heavens also dripped[b], the clouds also dripped water.
translation:
  language: id
  text: 'Yahweh, ketika Engkau keluar dari Seir,

    ketika Engkau melangkah maju dari padang Edom[a],

    bumi gemetar[b];

    langit pun menetes,

    awan-awan pun meneteskan air.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari daerah Edom.” Secara harfiah, teks Ibrani berbunyi “dari padang Edom.”
    reason: lexical_alternative
  - marker: b
    text: Atau “tanah berguncang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan secara langsung sebagai “Yahweh”, sesuai bentuk Ibrani dan sapaan langsung dalam puisi ini.
- source_word: בְּצֵאתְךָ
  choice: ketika Engkau keluar
  rationale: Preposisi ב dengan infinitif konstruk dan akhiran orang kedua maskulin tunggal berfungsi temporal. “Ketika Engkau keluar” alami dalam bahasa Indonesia dan mempertahankan sapaan langsung kepada Yahweh.
- source_word: מִשֵּׂעִיר
  choice: dari Seir
  rationale: שֵׂעִיר adalah nama tempat, sedangkan prefiks מִן menyatakan asal, “dari”.
- source_word: בְּצַעְדְּךָ
  choice: ketika Engkau melangkah maju
  rationale: צעד menggambarkan tindakan melangkah atau berbaris. “Melangkah maju” menyampaikan gerak ilahi yang terarah tanpa menambahkan gambaran militer secara berlebihan.
- source_word: מִשְּׂדֵה אֱדוֹם
  choice: dari padang Edom
  rationale: שָׂדֶה dapat berarti ladang, padang, atau daerah terbuka. “Padang Edom” mempertahankan citra ruang terbuka dan lebih wajar daripada “ladang Edom” dalam konteks geografis.
- source_word: אֶרֶץ רָעָשָׁה
  choice: bumi gemetar
  rationale: Dalam kesejajaran dengan langit dan awan, אֶרֶץ paling mungkin menunjuk kepada bumi secara kosmis. רָעַשׁ menyatakan guncangan; “gemetar” mempertahankan personifikasi puitis.
- source_word: גַּם שָׁמַיִם נָטָפוּ
  choice: langit pun menetes
  rationale: גַּם diterjemahkan “pun” dan נָטַף dipertahankan dengan citra menetes. Klausa ini tidak diberi objek “air” karena teks Ibrani baru menyebutkannya secara eksplisit pada klausa berikutnya.
- source_word: גַּם עָבִים נָטְפוּ מָיִם
  choice: awan-awan pun meneteskan air
  rationale: עָבִים menunjuk kepada awan, sering kali awan hujan. Pengulangan akar נָטַף dipertahankan, sementara מָיִם diterjemahkan secara eksplisit sebagai “air”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. Bentuk “Yahweh” mempertahankan nama pribadi perjanjian dan tidak menggantinya dengan gelar.
- issue: Cakupan אֶרֶץ dalam gambaran teofani
  choice: bumi
  alternative: tanah atau negeri
  rationale: Kesejajaran dengan langit dan awan mendukung cakupan kosmis “bumi”, tetapi kemungkinan makna “tanah” tetap dicatat karena אֶרֶץ memiliki rentang makna tersebut.
translation_notes:
  register: Bahasa Indonesia modern dengan laras puitis dan khidmat. Kapitalisasi “Engkau” dipakai untuk sapaan langsung kepada Allah. Paralelisme serta pengulangan kata yang menggambarkan tetesan dipertahankan sejauh tetap alami dalam bahasa Indonesia.
