base_translation:
  language: en
  yaml_path: translation/ot/judges/005/016.yaml
  text: Why did you sit among the sheepfolds[a], to hear the whistling for the flocks? For the divisions of Reuben there were great searchings of heart.
translation:
  language: id
  text: Mengapa engkau duduk di antara kandang-kandang domba, mendengarkan bunyi siulan bagi kawanan ternak? Di antara kelompok-kelompok Ruben[a] terdapat pertimbangan-pertimbangan besar dalam hati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Di dekat aliran-aliran Ruben.” Kata Ibrani yang dipakai dapat berarti “kelompok-kelompok/pembagian-pembagian” atau “aliran-aliran air.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָמָּה
  choice: Mengapa
  rationale: Kata tanya langsung yang mempertanyakan alasan Ruben tidak turut bertindak.
- source_word: יָשַׁבְתָּ
  choice: engkau duduk
  rationale: Mempertahankan gambaran konkret dan daya teguran puitis dari verba yang dapat berarti duduk, tinggal, atau menetap.
- source_word: בֵּין הַמִּשְׁפְּתַיִם
  choice: di antara kandang-kandang domba
  rationale: Sesuai dengan gambaran pastoral pada frasa berikutnya; bentuk jamaknya ditampilkan secara alami dalam bahasa Indonesia.
- source_word: לִשְׁמֹעַ שְׁרִקוֹת עֲדָרִים
  choice: mendengarkan siulan untuk kawanan ternak
  rationale: Infinitif menyatakan kegiatan atau tujuan; 'siulan' mempertahankan bunyi panggilan para gembala yang diarahkan kepada kawanan.
- source_word: לִפְלַגּוֹת רְאוּבֵן
  choice: Di antara kelompok-kelompok Ruben
  rationale: פְלַגּוֹת dapat menunjuk pada pembagian atau kelompok dalam suku Ruben. Padanan alternatif 'aliran-aliran' dipertahankan dalam catatan kaki karena ambiguitas leksikalnya nyata.
- source_word: גְּדוֹלִים חִקְרֵי לֵב
  choice: ada pergumulan hati yang besar
  rationale: Mengungkapkan pemeriksaan batin atau pertimbangan mendalam dengan bahasa Indonesia yang wajar, sambil mempertahankan metafora 'hati' dan intensifikasi 'besar'.
