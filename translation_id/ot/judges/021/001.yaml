  text: וְ/אִ֣ישׁ יִשְׂרָאֵ֔ל נִשְׁבַּ֥ע בַּ/מִּצְפָּ֖ה לֵ/אמֹ֑ר אִ֣ישׁ מִמֶּ֔/נּוּ לֹא יִתֵּ֥ן בִּתּ֛/וֹ לְ/בִנְיָמִ֖ן לְ/אִשָּֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/001.yaml
  text: The men of Israel had sworn at Mizpah[a], saying, “No man among us shall give his daughter to Benjamin as a wife.”
translation:
  language: id
  text: 'Orang-orang Israel telah bersumpah di Mizpa demikian: “Tidak seorang laki-laki pun di antara kami akan memberikan anak perempuannya kepada orang Benyamin[a] sebagai istri.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepada Benyamin”; ungkapan ini dapat berarti kepada suku Benyamin atau kepada seorang anggota suku Benyamin.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: Orang-orang Israel
  rationale: Bentuk tunggal אִישׁ dipakai secara kolektif untuk para laki-laki Israel. Bentuk jamak bahasa Indonesia menyampaikan makna kelompok secara wajar. Waw naratif tidak perlu diterjemahkan tersendiri pada awal pasal.
- source_word: נִשְׁבַּע
  choice: telah bersumpah
  rationale: Bentuk Nifal verba שׁבע berarti bersumpah atau mengucapkan sumpah. Kata 'telah' menunjukkan bahwa sumpah itu mendahului peristiwa yang kemudian diceritakan.
- source_word: בַּמִּצְפָּה
  choice: di Mizpa
  rationale: Preposisi בּ dengan nama tempat menyatakan lokasi pengucapan sumpah; 'di Mizpa' alami dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif ini memperkenalkan isi langsung sumpah. Dalam bahasa Indonesia, 'demikian:' lebih alami daripada 'dengan berkata' dan tetap menunjukkan bahwa kutipan berikut adalah isi sumpah.
- source_word: אִישׁ מִמֶּנּוּ
  choice: Tak seorang pun dari antara kita
  rationale: 'Ungkapan ini bersifat distributif: tidak satu pun laki-laki dari kelompok Israel boleh melakukannya. Rumusan Indonesia ini jelas dan alami.'
- source_word: לֹא יִתֵּן
  choice: akan memberikan
  rationale: Imperfek yang dinegasikan dalam konteks sumpah menyatakan komitmen atau larangan untuk masa depan. Daya mengikatnya sudah tampak dari verba 'bersumpah'.
- source_word: בִּתּוֹ
  choice: anak perempuannya
  rationale: Menerjemahkan nomina tunggal dengan sufiks posesif orang ketiga secara langsung.
- source_word: לְבִנְיָמִן
  choice: kepada orang Benyamin[a]
  rationale: Nama tunggal Benyamin dapat menunjuk secara kolektif kepada sukunya atau secara distributif kepada seorang anggotanya. 'Orang Benyamin' mempertahankan keluasan rujukan itu dengan catatan kaki.
- source_word: לְאִשָּׁה
  choice: sebagai istri
  rationale: Ungkapan ini berarti memberikan seorang perempuan dalam perkawinan supaya menjadi istri.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Susunan 'bersumpah ... demikian:' menghindari ungkapan kaku 'dengan berkata' sambil mempertahankan fungsi pengantar kutipan dalam bahasa Ibrani.
