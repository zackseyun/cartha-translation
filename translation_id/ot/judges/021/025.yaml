  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין מֶ֖לֶךְ בְּ/יִשְׂרָאֵ֑ל אִ֛ישׁ הַ/יָּשָׁ֥ר בְּ/עֵינָ֖י/ו יַעֲשֶֽׂה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/025.yaml
  text: In those days there was no king in Israel[a]; each man did what was right in his own eyes.
translation:
  language: id
  text: Pada zaman itu tidak ada raja di Israel. Setiap orang[a] melakukan apa yang benar menurut pandangannya sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “setiap laki-laki”; bentuk tunggal maskulin dalam bahasa Ibrani dipakai secara distributif dengan arti “setiap orang.”
    reason: Menjelaskan bentuk gramatikal sumber dan padanan distributif yang dipakai dalam teks utama.
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Pada zaman itu
  rationale: Ungkapan waktu naratif ini secara alami dan tepat menyatakan latar masa lampau dalam bahasa Indonesia.
- source_word: אֵין מֶלֶךְ בְּיִשְׂרָאֵל
  choice: tidak ada raja di Israel
  rationale: Konstruksi negatif eksistensial diterjemahkan secara langsung dan wajar tanpa menambahkan penilaian mengenai bentuk pemerintahan.
- source_word: אִישׁ
  choice: Setiap orang
  rationale: Nomina tunggal ini dipakai secara distributif. Dalam bahasa Indonesia, “setiap orang” menyampaikan cakupan itu dengan alami; bentuk maskulin sumber dijelaskan dalam catatan kaki.
- source_word: הַיָּשָׁר
  choice: apa yang benar
  rationale: Adjektiva berartikel ini berfungsi secara substantival dan menunjuk kepada hal yang dianggap benar.
- source_word: בְּעֵינָיו
  choice: menurut pandangannya sendiri
  rationale: Ini menerjemahkan idiom Ibrani “di matanya” sebagai penilaian subjektif pribadi dengan bahasa Indonesia yang alami.
- source_word: יַעֲשֶׂה
  choice: melakukan
  rationale: Bentuk imperfek dalam pernyataan rangkuman ini menyatakan tindakan yang menjadi kebiasaan pada masa lampau; konteks “pada zaman itu” sudah memberi kerangka waktu lampau.
theological_decisions:
- issue: Bahasa maskulin representatif dalam אִישׁ
  choice: Setiap orang, dengan catatan mengenai bentuk harfiahnya
  alternative: Setiap laki-laki
  rationale: Dalam konteks ini bentuk tunggal maskulin digunakan secara distributif. Terjemahan utama menyampaikan makna cakupannya dalam bahasa Indonesia modern, sementara catatan mempertahankan transparansi terhadap bentuk sumber.
- issue: Penilaian tersirat dalam bagian penutup
  choice: Mempertahankan ungkapan “apa yang benar menurut pandangannya sendiri” tanpa penguatan tafsiran
  alternative: melakukan apa saja yang disukainya
  rationale: Konteks sastra dapat memberi kesan kecaman terhadap kekacauan Israel, tetapi teks Ibrani sendiri memakai istilah “benar.” Terjemahan tidak menggantinya dengan ungkapan yang lebih mencela.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Menurut pandangannya sendiri” mempertahankan makna idiom Ibrani tanpa terdengar kaku; dua kalimat menonjolkan hubungan antara ketiadaan raja dan perilaku tiap orang tanpa menambahkan hubungan sebab-akibat yang tidak dinyatakan secara eksplisit.
