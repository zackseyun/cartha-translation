  text: וַ/יֹּֽאמְר֨וּ זִקְנֵ֣י הָ/עֵדָ֔ה מַה נַּעֲשֶׂ֥ה לַ/נּוֹתָרִ֖ים לְ/נָשִׁ֑ים כִּֽי נִשְׁמְדָ֥ה מִ/בִּנְיָמִ֖ן אִשָּֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/016.yaml
  text: Then the elders of the congregation said[a], “What shall we do for wives for those who remain, since the women of Benjamin have been destroyed?”
translation:
  language: id
  text: Lalu para tua-tua umat itu berkata, “Apa yang akan kita lakukan untuk menyediakan istri bagi mereka yang masih tersisa? Sebab, perempuan-perempuan dari Benyamin telah dimusnahkan[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sebab dari Benyamin seorang perempuan telah dimusnahkan”; bentuk tunggal “perempuan” dipakai secara kolektif untuk perempuan-perempuan Benyamin.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי הָעֵדָה
  choice: para tua-tua umat itu
  rationale: Bentuk konstruksi jamak berarti para tua-tua dari komunitas yang berhimpun. 'Umat' menyampaikan keseluruhan komunitas Israel secara alami tanpa menyiratkan lembaga modern.
- source_word: מַה נַּעֲשֶׂה
  choice: Apa yang akan kita lakukan
  rationale: Kata tanya dengan bentuk imperfek orang pertama jamak menyatakan pertimbangan bersama mengenai tindakan yang akan diambil.
- source_word: לַנּוֹתָרִים
  choice: bagi mereka yang masih tersisa
  rationale: Mempertahankan arti partisipial, yaitu orang-orang yang masih hidup atau tertinggal setelah pembantaian, tanpa mempersempitnya secara berlebihan.
- source_word: לְנָשִׁים
  choice: untuk menyediakan istri
  rationale: Dalam konteks ini נָשִׁים merujuk kepada perempuan sebagai istri bagi orang-orang Benyamin yang tersisa. Kata 'menyediakan' melengkapi ungkapan Indonesia agar maksud pertanyaan jelas, meski tidak dinyatakan secara terpisah dalam bahasa Ibrani.
- source_word: כִּי
  choice: Sebab
  rationale: Partikel ini memperkenalkan alasan bagi pertanyaan sebelumnya; 'sebab' mempertahankan hubungan kausal dalam ragam yang wajar dan bermartabat.
- source_word: נִשְׁמְדָה
  choice: telah dimusnahkan
  rationale: Bentuk Nifal dari שׁמד menyatakan bahwa subjek telah dibinasakan atau dimusnahkan. Pilihan ini mempertahankan kerasnya pernyataan sumber.
- source_word: מִבִּנְיָמִן אִשָּׁה
  choice: perempuan-perempuan dari Benyamin
  rationale: Secara harfiah berbentuk tunggal, 'dari Benyamin seorang perempuan', tetapi kata tunggal itu dipakai secara kolektif. Bentuk jamak alami dalam bahasa Indonesia menyampaikan rujukan kolektifnya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sambil mempertahankan hubungan sebab-akibat dan kekerasan makna verba Ibrani. Penanda catatan kaki [a] ditempatkan langsung pada klausa yang dijelaskannya.
