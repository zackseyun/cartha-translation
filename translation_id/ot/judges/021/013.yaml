  text: Then the whole congregation sent word and spoke to the sons of Benjamin who were at the rock of Rimmon[a], and proclaimed peace to them.
translation:
  language: id
  text: Lalu seluruh umat itu mengutus orang-orang untuk berbicara kepada orang-orang Benyamin yang berada di batu karang Rimon[a], dan menyatakan perdamaian kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "yang berada di Sela-Rimon"; bahasa Ibrani dapat dipahami sebagai ungkapan deskriptif, "batu karang Rimon", atau sebagai nama tempat yang tetap.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: mengutus orang
  rationale: Kata kerja שׁלח berarti ‘mengutus’ atau ‘mengirim’. Karena tindakan ini langsung diikuti dengan berbicara kepada pihak lain, bahasa Indonesia secara alami memerlukan objek tersirat ‘orang’, tanpa menentukan bahwa mereka adalah utusan resmi.
- source_word: כָּל הָעֵדָה
  choice: seluruh umat itu
  rationale: עֵדָה menunjuk kepada komunitas Israel sebagai satu kesatuan. ‘Seluruh umat itu’ terdengar alami dan bermartabat dalam bahasa Indonesia serta mencerminkan כָּל.
- source_word: וַיְדַבְּרוּ אֶל
  choice: untuk berbicara kepada
  rationale: דבר אל adalah ungkapan biasa untuk ‘berbicara kepada’. Bentuk tujuan menghubungkan pengutusan dengan maksud komunikatifnya secara alami dalam bahasa Indonesia.
- source_word: בְּנֵי בִנְיָמִן
  choice: keturunan Benyamin
  rationale: Ungkapan harfiah ‘anak-anak lelaki Benyamin’ bersifat tribal dan mencakup anggota suku yang dimaksud; ‘keturunan Benyamin’ mempertahankan hubungan genealogis tanpa memberi kesan bahwa yang dimaksud hanya anak kandung langsung.
- source_word: אֲשֶׁר בְּסֶלַע רִמּוֹן
  choice: yang berada di Gunung Batu Rimon
  rationale: סֶלַע berarti batu besar, gunung batu, atau tebing batu. Dalam konteks ini konstruksi tersebut dapat dipahami secara deskriptif sebagai ‘Gunung Batu Rimon’, sambil mempertahankan kemungkinan bahwa seluruh ungkapan merupakan nama tempat melalui catatan kaki.
- source_word: וַיִּקְרְאוּ לָהֶם שָׁלוֹם
  choice: menyatakan perdamaian kepada mereka
  rationale: קרא dengan penerima dan שׁלום menyatakan pengumuman resmi mengenai hubungan damai. ‘Menyatakan perdamaian’ mempertahankan daya deklaratifnya dan lebih alami daripada terjemahan harfiah ‘menyerukan damai’.
- source_word: שָׁלוֹם
  choice: perdamaian
  rationale: Dalam konteks ini שָׁלוֹם menunjuk pada pemulihan hubungan damai, bukan semata-mata kesejahteraan pribadi; ‘perdamaian’ menyampaikan makna relasional tersebut.
