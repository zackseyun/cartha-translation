translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. ‘Umat’ mempertahankan sifat kolektif komunitas Israel; ‘keturunan Benyamin’ menghindari kekakuan ungkapan harfiah sambil menjaga nuansa kesukuan. Catatan kaki mempertahankan ambiguitas antara deskripsi geografis dan nama tempat.
