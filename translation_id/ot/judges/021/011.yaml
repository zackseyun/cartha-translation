base_translation:
  language: en
  yaml_path: translation/ot/judges/021/011.yaml
  text: 'And this is what you shall do: every male[a], and every woman who has known the bed of a male[b], you shall devote to destruction.'
translation:
  language: id
  text: 'Dan inilah yang harus kamu lakukan: setiap laki-laki dan setiap perempuan yang pernah bersetubuh dengan laki-laki[a] harus kamu khususkan untuk dimusnahkan[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang telah mengenal pembaringan laki-laki,” sebuah ungkapan halus untuk perempuan yang pernah melakukan hubungan seksual dengan laki-laki.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani ini berarti menempatkan seseorang di bawah larangan khusus untuk dimusnahkan, bukan sekadar membunuh dalam pengertian biasa.
    reason: cultural_note
lexical_decisions:
- source_word: וְ/זֶה הַ/דָּבָר אֲשֶׁר תַּעֲשׂוּ
  choice: Inilah yang harus kamu lakukan
  rationale: Menyampaikan konstruksi Ibrani secara alami dalam bahasa Indonesia, dengan tetap mempertahankan daya instruktifnya dan kesinambungan narasi melalui konteks.
- source_word: כָּל זָכָר
  choice: setiap laki-laki
  rationale: זָכָר menunjuk pada jenis kelamin laki-laki, bukan hanya status sosial sebagai pria dewasa. 'Setiap laki-laki' terdengar wajar dan mencakup seluruh golongan yang dimaksud.
- source_word: וְ/כָל אִשָּׁה
  choice: dan setiap perempuan
  rationale: אִשָּׁה di sini berarti perempuan, yang kemudian dibatasi oleh keterangan mengenai pengalaman seksual; 'istri' akan terlalu sempit.
- source_word: יֹדַעַת מִשְׁכַּב זָכָר
  choice: yang pernah bersetubuh dengan laki-laki
  rationale: Ungkapan Ibrani secara harfiah memakai bahasa eufemistis tentang 'mengenal pembaringan laki-laki'. Terjemahan eksplisit ini menyampaikan maknanya secara jelas dan alami tanpa mengaburkan bahwa yang dimaksud ialah hubungan seksual.
- source_word: תַּחֲרִימוּ
  choice: harus kamu khususkan untuk dimusnahkan
  rationale: Bentuk kausatif חרם menunjuk pada penempatan orang di bawah larangan khusus yang berujung pada pemusnahan. Pilihan ini mempertahankan unsur pengkhususan sekaligus akibatnya, bukan mereduksinya menjadi tindakan membunuh biasa.
theological_decisions:
- issue: Makna חרם dalam konteks perang dan penghukuman
  choice: khususkan untuk dimusnahkan
  alternative: tumpas seluruhnya; tempatkan di bawah larangan pemusnahan
  rationale: Kata Ibrani ini memuat gagasan teknis bahwa seseorang atau sesuatu ditempatkan di bawah ketetapan khusus untuk dimusnahkan. Rumusan yang dipilih mempertahankan ketegangan teologis-hukumnya tanpa menjadikannya istilah yang terlalu teknis atau sekadar sinonim 'membunuh'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Bentuk 'kamu' mengikuti sapaan jamak dalam konteks kepada kelompok, sebagaimana lazim dalam bahasa Indonesia karena pronomina ini tidak menandai jumlah. Kekerasan teks tidak diperhalus, sementara istilah teknis חרם dijelaskan melalui catatan kaki.
