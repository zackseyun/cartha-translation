  text: וַ/יֹּ֣אמְר֔וּ מִ֗י אֶחָד֙ מִ/שִּׁבְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֛ר לֹֽא עָלָ֥ה אֶל יְהוָ֖ה הַ/מִּצְפָּ֑ה וְ֠/הִנֵּה לֹ֣א בָא אִ֧ישׁ אֶל הַֽ/מַּחֲנֶ֛ה מִ/יָּבֵ֥ישׁ גִּלְעָ֖ד אֶל הַ/קָּהָֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/008.yaml
  text: And they said[a], “Which one of the tribes of Israel did not go up to Yahweh at Mizpah?” And behold, not a man from Jabesh-gilead had come to the camp[b], to the assembly.
translation:
  language: id
  text: Lalu mereka berkata, “Suku manakah dari antara suku-suku Israel yang tidak datang menghadap Yahweh di Mizpa?” Ternyata, tidak seorang pun dari Yabesh-Gilead datang ke perkemahan, ke perhimpunan itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Lalu mereka berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “lalu” merupakan penghubung naratif yang wajar dalam bahasa Indonesia.
- source_word: מִי אֶחָד מִשִּׁבְטֵי יִשְׂרָאֵל
  choice: Suku manakah dari antara suku-suku Israel
  rationale: Pertanyaan ini meminta identifikasi satu kelompok dari keseluruhan suku Israel; susunan ini mempertahankan fokus tunggal dan relasi pemilihan yang ditandai מִן.
- source_word: לֹא עָלָה אֶל יְהוָה הַמִּצְפָּה
  choice: yang tidak datang menghadap Yahweh di Mizpa
  rationale: עלה secara harfiah berarti “naik”, tetapi dalam konteks menghadiri pertemuan di hadapan Yahweh, “datang menghadap” menyampaikan fungsi ungkapan secara alami. Lokasi Mizpa tetap dinyatakan dengan jelas.
- source_word: וְהִנֵּה
  choice: Ternyata
  rationale: Ungkapan ini menandai penemuan yang patut diperhatikan; “ternyata” menyampaikan daya wacananya secara alami dalam narasi Indonesia.
- source_word: לֹא בָא אִישׁ
  choice: tidak seorang pun ... datang
  rationale: Bentuk tunggal אִישׁ sesudah negasi bersifat distributif dan menegaskan bahwa tidak ada satu individu pun yang hadir.
- source_word: מִיָּבֵישׁ גִּלְעָד
  choice: dari Yabesh-Gilead
  rationale: Preposisi מִן menunjukkan asal. Bentuk nama ini mengikuti transliterasi yang lazim dan dekat dengan bahasa sumber.
- source_word: אֶל הַמַּחֲנֶה ... אֶל הַקָּהָל
  choice: ke perkemahan, ke pertemuan umat itu
  rationale: Kedua frasa berpreposisi dipertahankan secara aposisional. קָהָל menunjuk komunitas yang berhimpun, sehingga “pertemuan umat” lebih jelas daripada istilah yang dapat berasosiasi khusus dengan gereja.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian YHWH secara langsung; “Yahweh” mempertahankan nama pribadi itu tanpa menggantinya dengan gelar.
- issue: Makna אֶל יְהוָה dalam konteks pertemuan
  choice: menghadap Yahweh
  alternative: kepada Yahweh
  rationale: Ungkapan ini dapat dipahami sebagai hadir di hadapan Yahweh pada tempat pertemuan. “Menghadap” mengungkapkan nuansa kehadiran tersebut tanpa menghapus orientasi pertemuan kepada Yahweh.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif-dignified. “Mizpa” dan “Yabesh-Gilead” digunakan sebagai bentuk nama tempat yang lazim. Tidak diperlukan catatan kaki karena nuansa penting dapat disampaikan secara langsung dalam teks tanpa membebani pembaca.
