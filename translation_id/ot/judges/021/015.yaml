translation:
  language: id
  text: Bangsa itu berdukacita atas Benyamin, sebab TUHAN telah membuat suatu celah di antara suku-suku Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִחָם לְבִנְיָמִן
  choice: berdukacita karena Benyamin
  rationale: Dalam konteks ini נִחָם menyatakan kesedihan atau penyesalan atas keadaan Benyamin; frasa Indonesia ini mempertahankan fokus emosional teks tanpa mengubahnya menjadi sekadar belas kasihan.
- source_word: פֶּרֶץ
  choice: keretakan
  rationale: Secara harfiah menunjuk pada celah atau bobolnya suatu kesatuan. “Keretakan” terdengar alami dan mempertahankan gambaran pecahnya keutuhan suku-suku Israel.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi penerjemahan Alkitab bahasa Indonesia untuk nama perjanjian ilahi YHWH.
theological_decisions:
- issue: Pernyataan bahwa YHWH membuat keretakan
  choice: Mempertahankan secara langsung bahwa TUHAN telah membuat keretakan
  alternative: Menyatakan bahwa TUHAN membiarkan atau mengizinkan keretakan
  rationale: Bentuk Ibrani עָשָׂה secara eksplisit berarti “membuat/melakukan”; terjemahan tidak melunakkan ketegangan teologis dengan memasukkan gagasan izin yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. “Bangsa itu” menerjemahkan הָעָם sebagai komunitas Israel yang disebut dalam konteks; “suku-suku Israel” mempertahankan bentuk jamak sumber.
