- from: Lalu bangsa itu datang ke Betel dan duduk di sana di hadapan Allah sampai petang. Mereka menangis dengan suara nyaring dan meratap hebat.[a]
  to: Lalu orang-orang itu datang ke Betel dan duduk di sana di hadapan Allah sampai petang. Mereka mengangkat suara mereka dan menangis dengan tangisan yang hebat.[a]
  rationale: Revisi memulihkan dua verba naratif sumber secara terpisah, mempertahankan intensifikasi melalui konstruksi serumpun בכה–בכי, dan menggunakan “orang-orang itu” untuk הָעָם dalam konteks kumpulan yang hadir. Tidak ada perubahan pada nama tempat, sebutan Allah, waktu, atau lokasi ritual.
