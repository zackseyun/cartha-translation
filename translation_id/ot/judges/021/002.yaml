base_translation:
  language: en
  yaml_path: translation/ot/judges/021/002.yaml
  text: Then the people came to Bethel and sat there before God until evening[a], and they raised their voices and wept with great weeping.
translation:
  language: id
  text: Lalu orang-orang itu datang ke Betel dan duduk di sana di hadapan Allah sampai petang. Mereka mengangkat suara mereka dan menangis dengan tangisan yang hebat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menangis dengan tangisan yang hebat”; bahasa Ibrani memakai kata kerja dan kata benda serumpun untuk menegaskan kuatnya perkabungan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא הָעָם
  choice: bangsa itu datang
  rationale: בוא menyatakan tibanya kelompok Israel di Betel; 'datang' mempertahankan arah naratif, sedangkan עם di sini merujuk secara kolektif kepada bangsa Israel.
- source_word: בֵּית אֵל
  choice: Betel
  rationale: Bentuk ini adalah nama tempat dan diterjemahkan dengan transliterasi Indonesia yang lazim, bukan sebagai frasa umum 'rumah Allah'.
- source_word: וַיֵּשְׁבוּ שָׁם
  choice: duduk di sana
  rationale: ישב dapat berarti duduk, tinggal, atau menetap. Dalam adegan perkabungan yang berlangsung hingga petang, arti konkret 'duduk' sesuai dan tidak menghilangkan nuansa duratif.
- source_word: עַד הָעֶרֶב
  choice: sampai petang
  rationale: Padanan temporal yang langsung dan alami dalam bahasa Indonesia modern.
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: di hadapan Allah
  rationale: Frasa kehadiran לִפְנֵי diterjemahkan secara formal dan wajar, sementara הָאֱלֹהִים dipertahankan sebagai 'Allah' tanpa menggantinya dengan nama ilahi YHWH.
- source_word: וַיִּשְׂאוּ קוֹלָם
  choice: menangis dengan suara nyaring
  rationale: Secara harfiah idiom ini berarti 'mengangkat suara mereka'. Dalam konteks yang langsung menyebut tangisan, bahasa Indonesia alami mengungkapkannya sebagai menangis dengan suara nyaring.
- source_word: וַיִּבְכּוּ בְּכִי גָדוֹל
  choice: meratap hebat
  rationale: Konstruksi serumpun בכה–בכי menguatkan tindakan menangis. 'Meratap hebat' menyampaikan intensitas itu secara alami dan menghindari pengulangan janggal setelah penyebutan tangisan.
theological_decisions:
- issue: Penerjemahan הָאֱלֹהִים dalam suasana ibadah
  choice: Allah
  alternative: TUHAN
  rationale: Teks Ibrani memakai הָאֱלֹהִים, bukan nama perjanjian YHWH. Karena itu terjemahan tidak menyelaraskannya secara teologis menjadi 'TUHAN'.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. 'Di hadapan Allah' mempertahankan corak formal teks, sedangkan 'menangis dengan suara nyaring dan meratap hebat' menyampaikan dua ungkapan Ibrani secara alami tanpa mengurangi intensitasnya.
