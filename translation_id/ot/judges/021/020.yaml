  text: And they commanded the sons of Benjamin[a], saying[b], “Go and lie in wait in the vineyards.”
translation:
  language: id
  text: Lalu ia memerintahkan orang-orang Benyamin[a], “Pergilah dan bersembunyilah untuk menyergap di kebun-kebun anggur.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Benyamin.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: ia memerintahkan
  rationale: Bentuk verba dalam teks Ibrani adalah orang ketiga tunggal maskulin, sehingga diterjemahkan secara formal sebagai “ia memerintahkan”, walaupun subjek tunggalnya tidak disebutkan secara eksplisit dalam ayat ini.
- source_word: אֶת בְּנֵי בִנְיָמִן
  choice: orang-orang Benyamin
  rationale: Ungkapan harfiahnya “anak-anak Benyamin”, yakni anggota suku atau keturunan Benyamin. “Orang-orang Benyamin” menyampaikan maksud itu secara alami dalam bahasa Indonesia; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Infinitif pengutip Ibrani ini memperkenalkan perkataan langsung. “Katanya” mempertahankan fungsi tersebut dengan ungkapan Indonesia yang ringkas dan wajar.
- source_word: לְכוּ
  choice: Pergilah
  rationale: Bentuk imperatif jamak dari הלך, yang langsung berarti perintah kepada beberapa orang untuk pergi.
- source_word: וַאֲרַבְתֶּם
  choice: dan mengendaplah
  rationale: Kata ארב berarti bersembunyi sambil menunggu kesempatan untuk menyerang atau menangkap. “Mengendaplah” mempertahankan tindakan menunggu secara tersembunyi tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: בַּכְּרָמִים
  choice: di kebun-kebun anggur
  rationale: Bentuk jamak כרמים menunjuk kepada kebun-kebun anggur, dan preposisinya paling langsung diterjemahkan “di”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk tunggal “ia” mengikuti morfologi teks Ibrani yang diberikan, bukan bentuk jamak pada lapisan konsultasi Inggris. “Orang-orang Benyamin” dipilih agar identitas kesukuan jelas bagi pembaca modern.
