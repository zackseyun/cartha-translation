  terminology: “Orang-orang Benyamin” merupakan padanan alami untuk בני בנימן dalam konteks anggota suku; catatan harfiah mempertahankan ungkapan kekerabatan Ibrani. “Kebun-kebun anggur” tepat untuk כרמים.
