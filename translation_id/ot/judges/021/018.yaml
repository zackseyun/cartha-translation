base_translation:
  language: en
  yaml_path: translation/ot/judges/021/018.yaml
  text: But we cannot give them wives from our daughters[a], because the sons of Israel have sworn, saying, ‘Cursed is the one who gives a wife to Benjamin.’
translation:
  language: id
  text: 'Namun, kita tidak dapat memberikan kepada mereka istri dari antara anak-anak perempuan kita, sebab orang Israel telah bersumpah demikian: “Terkutuklah orang yang memberikan seorang perempuan sebagai istri kepada Benyamin[a].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih eksplisit, “kepada suku Benyamin” atau “kepada seorang dari suku Benyamin”; teks Ibrani langsung memakai nama suku “Benyamin”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנַחְנוּ
  choice: Namun, kita
  rationale: Kata penghubung dan pronomina mandiri menandai kontras sekaligus menegaskan subjek. “Namun, kita” menyampaikan alur argumentasi itu secara alami dalam bahasa Indonesia.
- source_word: לֹא נוּכַל
  choice: tidak dapat
  rationale: יכל menyatakan kemampuan atau kemungkinan. Ketidakmampuan ini timbul karena sumpah, tetapi teks Ibrani tidak secara eksplisit mengatakan “tidak boleh,” sehingga “tidak dapat” mempertahankan bentuk pernyataannya.
- source_word: לָתֵת לָהֶם נָשִׁים מִבְּנוֹתֵינוּ
  choice: memberikan kepada mereka istri dari antara anak-anak perempuan kita
  rationale: נָשִׁים berarti “istri-istri” dalam konteks perkawinan, dan מן menunjukkan sumber atau kelompok asal. “Dari antara” memperjelas bahwa istri-istri itu akan berasal dari anak-anak perempuan mereka sendiri.
- source_word: כִּי נִשְׁבְּעוּ בְנֵי יִשְׂרָאֵל
  choice: sebab orang Israel telah bersumpah
  rationale: כִּי memperkenalkan alasan, sedangkan bentuk נִשְׁבְּעוּ menunjuk pada sumpah yang telah diucapkan dan masih mengikat. “Orang Israel” merupakan sebutan kolektif yang alami dalam bahasa Indonesia bagi בְנֵי יִשְׂרָאֵל.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif ini memperkenalkan isi sumpah. Dalam bahasa Indonesia modern, “demikian:” lebih alami daripada terjemahan harfiah “dengan berkata.”
- source_word: אָרוּר
  choice: Terkutuklah
  rationale: Bentuk ini mempertahankan daya pernyataan kutuk yang bersifat yudisial atau perjanjian dalam bahasa sumber.
- source_word: נֹתֵן אִשָּׁה
  choice: orang yang memberikan seorang istri
  rationale: Partisipel berfungsi secara generik, dan אִשָּׁה dalam konteks ini berarti seorang perempuan sebagai istri.
- source_word: לְבִנְיָמִן
  choice: kepada Benyamin
  rationale: Teks Ibrani memakai nama suku secara langsung. Terjemahan ringkas ini mempertahankan bentuk tersebut tanpa diam-diam mempersempitnya menjadi seorang individu atau memperluasnya secara eksplisit menjadi seluruh suku.
theological_decisions:
- issue: Ruang lingkup nama “Benyamin” dalam rumusan sumpah
  choice: Mempertahankan nama kolektif “Benyamin” secara langsung
  alternative: “suku Benyamin” atau “seorang Benyamin”
  rationale: Dalam konteks, nama itu menunjuk secara kolektif kepada suku atau anggotanya, tetapi bahasa sumber tetap memakai nama “Benyamin” tanpa penjelasan tambahan. Terjemahan utama mempertahankan ketegangan leksikal tersebut, sementara catatan kaki menjelaskan kemungkinan ungkapannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dibuat alami tanpa menambahkan larangan hukum yang tidak dinyatakan secara eksplisit oleh teks Ibrani. Penanda catatan kaki ditempatkan sesudah “Benyamin,” yaitu unsur yang dijelaskan oleh catatan tersebut.
