  text: וַֽ/יִּמְצְא֞וּ מִ/יּוֹשְׁבֵ֣י יָבֵ֣ישׁ גִּלְעָ֗ד אַרְבַּ֤ע מֵאוֹת֙ נַעֲרָ֣ה בְתוּלָ֔ה אֲשֶׁ֧ר לֹֽא יָדְעָ֛ה אִ֖ישׁ לְ/מִשְׁכַּ֣ב זָכָ֑ר וַ/יָּבִ֨יאוּ אוֹתָ֤/ם אֶל הַֽ/מַּחֲנֶה֙ שִׁלֹ֔ה אֲשֶׁ֖ר בְּ/אֶ֥רֶץ כְּנָֽעַן׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/012.yaml
  text: And from the inhabitants of Jabesh-gilead they found four hundred young women, virgins, who had not known a man by lying with a male; and they brought them to the camp at Shiloh, which is in the land of Canaan.
translation:
  language: id
  text: Dari antara penduduk Yabesh-Gilead mereka menemukan empat ratus perempuan muda yang masih perawan, yang belum pernah bersetubuh dengan laki-laki. Lalu mereka membawa perempuan-perempuan itu ke perkemahan di Silo, di tanah Kanaan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִיּוֹשְׁבֵי יָבֵישׁ גִּלְעָד
  choice: dari antara penduduk Yabesh-Gilead
  rationale: Menjaga makna partitif מִן secara alami dalam bahasa Indonesia serta mempertahankan nama tempat sebagai satu kesatuan.
- source_word: נַעֲרָה בְתוּלָה
  choice: perempuan muda yang masih perawan
  rationale: נַעֲרָה menunjuk perempuan muda dan בְתוּלָה menyatakan status perawan; keduanya diterjemahkan tanpa meleburkan salah satu unsur.
- source_word: אֲשֶׁר לֹא יָדְעָה אִישׁ לְמִשְׁכַּב זָכָר
  choice: yang belum pernah bersetubuh dengan laki-laki
  rationale: Ungkapan Ibrani harfiah 'tidak mengenal laki-laki dalam hal berbaring dengan seorang laki-laki' merupakan idiom hubungan seksual; terjemahan ini menyampaikan maksudnya secara jelas dan bermartabat.
- source_word: הַמַּחֲנֶה שִׁלֹה
  choice: perkemahan di Silo
  rationale: Susunan teks menunjuk perkemahan yang berada di Silo; bentuk ini alami dan tidak menyiratkan bahwa nama perkemahannya adalah Silo.
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: di tanah Kanaan
  rationale: Padanan langsung yang mempertahankan keterangan geografis eksplisit dalam sumber.
theological_decisions:
- issue: Penggambaran status seksual para perempuan muda
  choice: Menerjemahkan keterangan teks secara langsung sebagai belum pernah bersetubuh dengan laki-laki
  alternative: Memperhalusnya menjadi 'belum pernah mengenal laki-laki'
  rationale: Pilihan utama menghindari ketidakjelasan idiom dalam bahasa Indonesia modern, tanpa menambahkan penilaian moral atau penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Struktur kalimat diringankan agar alami, sementara rincian identitas, jumlah, status keperawanan, tindakan membawa, dan lokasi tetap dipertahankan.
