base_translation:
  language: en
  yaml_path: translation/ot/judges/021/006.yaml
  text: And the sons of Israel grieved over Benjamin their brother[a], and they said, “Today one tribe has been cut off from Israel.”
translation:
  language: id
  text: Orang Israel berdukacita atas Benyamin, saudara mereka,[a] dan berkata, “Hari ini satu suku telah terputus dari Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “merasa iba terhadap Benyamin, saudara mereka” atau “menyesali apa yang terjadi pada Benyamin, saudara mereka.” Kata kerja Ibrani ini, bergantung pada konteks, dapat menyatakan dukacita, belas kasihan, penyesalan, atau perubahan sikap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּנָּחֲמוּ
  choice: berdukacita atas
  rationale: Bentuk Nifal dari נחם di sini mengungkapkan dukacita atau belas kasihan sebagai tanggapan atas nyaris musnahnya Benyamin. Pilihan ini alami dalam bahasa Indonesia dan tidak menyempitkan maknanya menjadi sekadar penyesalan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Orang Israel
  rationale: Ungkapan ini menyampaikan kelompok keturunan Israel secara alami dalam bahasa Indonesia modern; bentuk harfiah 'anak-anak Israel' dapat disalahpahami sebagai anak-anak kecil.
- source_word: אֶל
  choice: atas
  rationale: Bersama verba נחם, preposisi ini menandai pihak yang menjadi sasaran dukacita atau belas kasihan; 'atas' berpasangan secara idiomatis dengan 'berdukacita'.
- source_word: בִּנְיָמִן אָחִיו
  choice: Benyamin, saudara mereka
  rationale: Akhiran tunggal pada 'saudaranya' berfungsi secara kolektif dengan subjek jamak, sehingga Benyamin digambarkan sebagai saudara seluruh Israel.
- source_word: נִגְדַּע
  choice: telah terputus
  rationale: Pilihan ini mempertahankan metafora גדע, yaitu dipotong atau ditebang, sekaligus menyatakan pemisahan satu suku dari keseluruhan Israel tanpa menafsirkan secara berlebihan sebagai kemusnahan total.
- source_word: הַיּוֹם
  choice: Hari ini
  rationale: Padanan modern yang langsung dan mempertahankan kedekatan waktu dalam ratapan tersebut.
- source_word: שֵׁבֶט אֶחָד
  choice: satu suku
  rationale: Merujuk secara langsung pada satu unit kesukuan di antara suku-suku Israel.
- source_word: מִיִּשְׂרָאֵל
  choice: dari Israel
  rationale: Preposisi מן bersifat separatif di sini, menandakan terputusnya suku itu dari kesatuan bangsa Israel.
