  yaml_path: translation/ot/judges/021/009.yaml
  text: And the people were mustered[a], and behold, there was not a man there from the inhabitants of Jabesh-gilead.
translation:
  language: id
  text: Lalu rakyat itu diperiksa, dan ternyata tidak ada seorang pun di sana dari antara penduduk Yabesh-Gilead.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tidak ada seorang laki-laki pun di sana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּקֵד
  choice: didata
  rationale: Bentuk Hitpael dari פקד dalam konteks ini menunjuk pada pemeriksaan atau pendataan kelompok yang berkumpul. 'Didata' alami dalam bahasa Indonesia dan sesuai dengan penemuan berikutnya bahwa satu kota tidak terwakili.
- source_word: הָעָם
  choice: rakyat
  rationale: עָם secara umum berarti 'rakyat' atau 'bangsa'. Di sini yang dimaksud ialah kumpulan orang Israel; 'rakyat' mempertahankan cakupan kolektif tanpa mempersempitnya menjadi 'tentara'.
- source_word: וְהִנֵּה
  choice: dan ternyata
  rationale: הִנֵּה mengarahkan perhatian kepada hasil mengejutkan yang ditemukan. 'Dan ternyata' menyampaikan fungsi wacana itu secara alami dalam narasi Indonesia modern.
- source_word: אֵין שָׁם אִישׁ
  choice: tidak ada seorang pun di sana
  rationale: Ungkapan Ibrani secara harfiah memakai אִישׁ, 'laki-laki/orang', tetapi dalam konstruksi eksistensial negatif ini 'seorang pun' secara idiomatis mempertahankan makna ketiadaan total tanpa menyiratkan secara tidak wajar bahwa hanya jenis kelamin laki-laki yang sedang dibicarakan.
- source_word: מִיּוֹשְׁבֵי
  choice: dari antara penduduk
  rationale: Partisip dari ישב menunjuk kepada orang-orang yang tinggal di suatu tempat. 'Dari antara penduduk' menyampaikan hubungan partitif prefiks מִן dengan jelas.
- source_word: יָבֵשׁ גִּלְעָד
  choice: Yabesh-Gilead
  rationale: Nama tempat ditransliterasikan mengikuti bentuk Ibrani dan ejaan Indonesia, dengan tanda hubung untuk menunjukkan satu toponim gabungan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Susunan naratif dipertahankan, sementara הִנֵּה diterjemahkan secara idiomatis sebagai 'ternyata'. Tidak diperlukan catatan kaki karena alternatif harfiah 'tidak ada seorang laki-laki' berpotensi mempersempit referen, sedangkan konteks dan konstruksi Ibrani mendukung ungkapan alami 'tidak ada seorang pun'.
