  text: וַ/יֹּ֣אמְר֔וּ לָ/מָ֗ה יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הָ֥יְתָה זֹּ֖את בְּ/יִשְׂרָאֵ֑ל לְ/הִפָּקֵ֥ד הַ/יּ֛וֹם מִ/יִּשְׂרָאֵ֖ל שֵׁ֥בֶט אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/003.yaml
  text: And they said[a], “Why, O Yahweh, God of Israel, has this happened in Israel[b], that today one tribe should be lacking from Israel?”
translation:
  language: id
  text: Lalu kata mereka, “Mengapa, ya Yahweh, Allah Israel, hal ini terjadi di Israel, sehingga pada hari ini Israel kehilangan satu suku?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Lalu kata mereka
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menyatakan perkembangan berikutnya secara alami dalam bahasa Indonesia.
- source_word: לָמָה
  choice: Mengapa
  rationale: Kata tanya ini mengungkapkan ratapan sekaligus pertanyaan mengenai sebab.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Rangkaian konstruksi ini menyatakan Yahweh sebagai Allah Israel; bentuk tersebut baku, ringkas, dan jelas dalam bahasa Indonesia.
- source_word: הָיְתָה זֹּאת
  choice: hal ini terjadi
  rationale: Secara harfiah berarti “hal ini ada/telah ada,” tetapi dalam konteks ini merupakan ungkapan idiomatis untuk sesuatu yang telah terjadi.
- source_word: לְהִפָּקֵד
  choice: tidak ada lagi
  rationale: Bentuk nifal dari פקד di sini menunjuk pada keadaan absen atau tidak terdapat dalam keseluruhan Israel; ungkapan ini alami dan tidak menyiratkan bahwa suku itu sekadar tersesat.
- source_word: הַיּוֹם
  choice: hari ini
  rationale: Mempertahankan penekanan waktu dengan ungkapan Indonesia yang wajar.
- source_word: שֵׁבֶט אֶחָד
  choice: satu suku
  rationale: Padanan langsung yang merujuk pada satu unit kesukuan Israel.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama diri.
- issue: Nuansa לְהִפָּקֵד dalam ratapan Israel
  choice: tidak ada lagi di Israel
  alternative: hilang dari Israel
  rationale: Pilihan utama menyampaikan ketidakhadiran satu suku tanpa menentukan lebih jauh apakah ungkapan itu berarti musnah, tidak terhitung, atau terpisah; alternatif literal dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Seruan “ya Yahweh” mempertahankan bentuk sapaan langsung, sedangkan susunan kalimat dibuat alami tanpa menghilangkan nada ratapan dan pertanyaan dalam teks Ibrani.
