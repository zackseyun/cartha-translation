id: JDG.21.19
reference: Judges 21:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּאמְר֡וּ הִנֵּה֩ חַג יְהוָ֨ה בְּ/שִׁל֜וֹ מִ/יָּמִ֣ים יָמִ֗ימָ/ה אֲשֶׁ֞ר מִ/צְּפ֤וֹנָ/ה לְ/בֵֽית אֵל֙ מִזְרְחָ֣/ה הַ/שֶּׁ֔מֶשׁ לִ/מְסִלָּ֔ה הָ/עֹלָ֥ה מִ/בֵּֽית אֵ֖ל שְׁכֶ֑מָ/ה וּ/מִ/נֶּ֖גֶב לִ/לְבוֹנָֽה־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/019.yaml
  text: And they said[a], "Look, there is a feast of Yahweh in Shiloh from year to year, which is north of Bethel, east of the highway that goes up from Bethel to Shechem[b], and south of Lebonah."
translation:
  language: id
  text: Mereka berkata, “Lihatlah, dari tahun ke tahun[b] ada perayaan bagi Yahweh[a] di Silo, yang terletak di sebelah utara Betel, di sebelah timur jalan raya yang menanjak dari Betel menuju Sikhem, dan di sebelah selatan Lebona.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “hari raya Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “dari hari-hari ke hari-hari,” yakni setiap tahun.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Penanda wacana ini menarik perhatian kepada informasi yang segera disampaikan; bentuk ini alami, jelas, dan tetap bermartabat dalam bahasa Indonesia.
- source_word: חַג יְהוָה
  choice: perayaan bagi Yahweh
  rationale: חַג menunjuk pada perayaan atau hari raya, sering kali berkaitan dengan ziarah. Preposisi 'bagi' menyampaikan bahwa perayaan itu diadakan untuk menghormati Yahweh tanpa membuat frasa Indonesia terasa kaku.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar 'TUHAN'.
- source_word: בְּשִׁלֹה
  choice: di Silo
  rationale: Preposisi lokatif dan nama tempat diterjemahkan secara langsung dengan bentuk nama yang lazim dalam bahasa Indonesia.
- source_word: מִיָּמִים יָמִימָה
  choice: dari tahun ke tahun
  rationale: Ungkapan Ibrani yang secara harfiah berarti 'dari hari-hari ke hari-hari' menyatakan perulangan tahunan; padanan ini mempertahankan bentuk idiomatis dan maknanya.
- source_word: מִצְּפוֹנָה לְבֵית אֵל
  choice: di sebelah utara Betel
  rationale: Menyatakan letak geografis relatif secara alami dalam bahasa Indonesia.
- source_word: מִזְרְחָה הַשֶּׁמֶשׁ לִמְסִלָּה
  choice: di sebelah timur jalan raya
  rationale: מִזְרְחָה הַשֶּׁמֶשׁ secara harfiah mengarah ke tempat terbit matahari, tetapi dalam keterangan geografis berarti 'timur'; מְסִלָּה menunjuk pada jalan utama atau jalan raya.
- source_word: הָעֹלָה מִבֵּית אֵל שְׁכֶמָה
  choice: yang menanjak dari Betel menuju Sikhem
  rationale: '''Menanjak'' mempertahankan gambaran topografis verba עלה, sedangkan akhiran arah pada שְׁכֶמָה diterjemahkan ''menuju Sikhem'' tanpa menyatakan secara berlebihan bahwa jalan itu berakhir di sana.'
- source_word: וּמִנֶּגֶב לִלְבוֹנָה
  choice: dan di sebelah selatan Lebona
  rationale: נֶגֶב berfungsi sebagai penunjuk arah 'selatan' dan melengkapi uraian lokasi Silo.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian ilahi dalam narasi yang tidak diperselisihkan. Transliterasi 'Yahweh' mempertahankan fungsi nama pribadi dan mengikuti kebijakan proyek.
- issue: Hubungan perayaan dengan Yahweh dalam חַג יְהוָה
  choice: perayaan bagi Yahweh
  alternative: perayaan Yahweh atau hari raya Yahweh
  rationale: Pilihan ini menjaga hubungan konstruksi Ibrani sambil menghindari kesan kepemilikan yang sempit; perayaan tersebut dipersembahkan atau diselenggarakan untuk Yahweh.
translation_notes:
  register: Bahasa Indonesia modern yang alami dan bermartabat. Susunan keterangan lokasi dibuat jelas bagi pembaca umum, sementara ungkapan arah dan gambaran jalan yang menanjak dipertahankan. Penanda catatan kaki ditempatkan langsung pada frasa yang dijelaskannya.
