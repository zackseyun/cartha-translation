base_translation:
  language: en
  yaml_path: translation/ot/judges/021/017.yaml
  text: And they said[a], “There must be an inheritance for the survivors of Benjamin, so that a tribe may not be blotted out from Israel.”
translation:
  language: id
  text: Lalu mereka berkata[a], “Harus ada milik pusaka bagi orang Benyamin yang tersisa, supaya satu suku tidak terhapus dari Israel.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Harus ada orang-orang yang tersisa bagi Benyamin,” atau, “harus ada milik pusaka bagi para penyintas Benyamin.” Bahasa Ibrani menempatkan “milik pusaka” dan “orang yang selamat/sisa” secara berdampingan dalam ungkapan yang padat, sehingga hubungan tepat antara kedua nomina itu dapat dipahami dengan lebih dari satu cara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Lalu kata mereka
  rationale: Bentuk wayyiqtol dari אמר melanjutkan alur narasi dan memperkenalkan perkataan kelompok itu; ungkapan ini alami dalam bahasa Indonesia tanpa menetapkan urutan waktu secara berlebihan.
- source_word: יְרֻשַּׁת
  choice: milik pusaka
  rationale: Nomina dari ירש menunjuk pada warisan atau kepunyaan turun-temurun. Dalam konteks keberlangsungan suku dan tanahnya, “milik pusaka” menyampaikan kedua unsur tersebut dengan jelas.
- source_word: פְּלֵיטָה
  choice: orang-orang ... yang selamat
  rationale: Istilah ini menunjuk pada orang yang lolos atau tersisa sesudah bencana. Pilihan ini jelas dan tidak menambahkan muatan teologis yang belum tentu dimaksudkan.
- source_word: לְבִנְיָמִן
  choice: bagi orang-orang Benyamin
  rationale: Preposisi ל menyatakan penerima atau pihak yang berkepentingan; dalam susunan Indonesia, pilihan ini secara alami mengaitkan milik pusaka dengan para penyintas suku Benyamin.
- source_word: וְלֹא יִמָּחֶה
  choice: supaya ... tidak terhapus
  rationale: Nifal מחה menyatakan dihapus atau dilenyapkan. “Supaya” menangkap hubungan tujuan yang tersirat dalam konteks, sedangkan “terhapus” mempertahankan gambaran sumber.
- source_word: שֵׁבֶט
  choice: satu suku
  rationale: שֵׁבֶט menunjuk pada salah satu suku Israel. “Satu suku” alami dalam bahasa Indonesia dan menekankan bahwa tidak satu pun unit kesukuan boleh lenyap.
- source_word: מִיִּשְׂרָאֵל
  choice: dari Israel
  rationale: מן bersifat separatif; “dari Israel” mempertahankan arti bahwa sebuah suku jangan sampai lenyap dari antara bangsa Israel.
theological_decisions:
- issue: Hubungan sintaksis antara יְרֻשַּׁת dan פְּלֵיטָה dalam klausa nominal yang padat
  choice: Harus ada milik pusaka bagi orang-orang Benyamin yang selamat
  alternative: Harus ada orang-orang yang tersisa bagi Benyamin / milik pusaka bagi para penyintas Benyamin
  rationale: Teks Ibrani menyejajarkan “milik pusaka” dan “orang yang selamat/sisa” tanpa verba eksplisit. Teks utama memilih hubungan yang paling sesuai dengan konteks pembagian istri dan kelangsungan suku, sementara catatan kaki mempertahankan ambiguitas yang asli.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. “Milik pusaka” dipilih agar unsur warisan turun-temurun tetap terdengar, dan ambiguitas klausa nominal Ibrani dijaga melalui catatan kaki.
