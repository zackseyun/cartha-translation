    issue: Catatan kaki a tidak selaras dengan pilihan teks utama.
    rationale: Teks utama menerjemahkan משפחתו sebagai 'kaum keluarganya', sedangkan catatan 'Atau “keluarganya”; istilah Ibrani ini dapat menunjuk pada kelompok kekerabatan yang lebih luas daripada keluarga inti' secara semantis mendukung teks utama, bukan alternatifnya. Catatan perlu menawarkan 'klan' atau menjelaskan luasnya 'kaum keluarga'.
  - severity: low
    issue: '''Berangkat'' untuk ויתהלכו sedikit kurang mencerminkan nuansa mereka pergi/berpencar dari tempat itu.'
    rationale: Dalam konteks pembubaran pertemuan, verba tersebut menyatakan bahwa mereka pergi dari sana; 'pergi' mempertahankan makna tanpa menonjolkan awal perjalanan.
  - severity: low
    issue: '''Menuju'' sedikit lebih terarah daripada kata depan Ibrani ל.'
    rationale: '''Ke'' adalah padanan netral dan idiomatis untuk tujuan atau tempat asal tiap orang.'
