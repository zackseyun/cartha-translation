base_translation:
  language: en
  yaml_path: translation/ot/judges/021/024.yaml
  text: Then the sons of Israel departed from there at that time[a], each man to his tribe and to his family, and they went out from there[b], each man to his inheritance.
translation:
  language: id
  text: Pada waktu itu orang Israel pergi dari sana, masing-masing ke sukunya dan kaum keluarganya[a]. Mereka pergi dari sana, masing-masing ke tanah warisannya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “klannya”; istilah Ibrani ini dapat menunjuk pada kelompok kekerabatan yang lebih luas daripada keluarga inti.
    reason: lexical_alternative
  - marker: b
    text: Atau “milik pusakanya”; yang dimaksud ialah bagian tanah turun-temurun yang telah dijatahkan kepadanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְהַלְּכוּ
  choice: berangkat
  rationale: Bentuk hitpael dari הלך di sini menyatakan tindakan meninggalkan tempat atau mulai menempuh perjalanan, bukan terutama cara berjalan secara harfiah.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan ini secara harfiah berarti 'anak-anak lelaki Israel', tetapi dalam konteks kebangsaan 'orang Israel' merupakan padanan Indonesia modern yang wajar dan mencakup identitas kolektif mereka.
- source_word: בָּעֵת הַהִיא
  choice: pada waktu itu
  rationale: Padanan langsung dan alami bagi penanda waktu dalam bahasa Ibrani.
- source_word: אִישׁ
  choice: masing-masing
  rationale: אִישׁ dipakai secara distributif. 'Masing-masing' menyampaikan bahwa setiap orang pergi ke kelompok dan tanah miliknya tanpa membuat kalimat Indonesia terasa kaku.
- source_word: לְשִׁבְטוֹ
  choice: menuju suku
  rationale: '''Suku'' adalah istilah baku dan tepat bagi שֵׁבֶט dalam susunan sosial Israel.'
- source_word: וּלְמִשְׁפַּחְתּוֹ
  choice: dan kaum keluarganya
  rationale: מִשְׁפָּחָה dapat menunjuk pada kelompok kekerabatan yang lebih luas daripada keluarga inti; 'kaum keluarga' menjaga nuansa itu dalam bahasa Indonesia yang mudah dipahami.
- source_word: וַיֵּצְאוּ
  choice: mereka pergi
  rationale: יצא secara harfiah berarti 'keluar', tetapi dalam konteks ini menyatakan keberangkatan dari tempat tersebut. 'Pergi' terdengar alami tanpa menambahkan gagasan kembali yang tidak dinyatakan oleh teks.
- source_word: לְנַחֲלָתוֹ
  choice: menuju tanah warisannya
  rationale: נַחֲלָה di sini merujuk pada bagian tanah turun-temurun yang menjadi jatah setiap orang. 'Tanah warisan' mempertahankan unsur kewilayahan dan pewarisan.
