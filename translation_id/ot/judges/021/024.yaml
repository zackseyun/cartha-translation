  rationale: Revisi kecil memperjelas kecocokan antara kedua verba naratif dan terjemahan Indonesia, memakai kata depan tujuan yang netral, serta membetulkan catatan a agar alternatif leksikalnya benar-benar berbeda dari teks utama dan menerangkan cakupan istilah Ibrani. Makna, pengulangan 'dari sana', dan sifat distributif 'masing-masing' dipertahankan.
