  text: וַ/יַּֽעֲשׂוּ כֵן֙ בְּנֵ֣י בִנְיָמִ֔ן וַ/יִּשְׂא֤וּ נָשִׁים֙ לְ/מִסְפָּרָ֔/ם מִן הַ/מְּחֹלְל֖וֹת אֲשֶׁ֣ר גָּזָ֑לוּ וַ/יֵּלְכ֗וּ וַ/יָּשׁ֨וּבוּ֙ אֶל נַ֣חֲלָתָ֔/ם וַ/יִּבְנוּ֙ אֶת הֶ֣/עָרִ֔ים וַ/יֵּשְׁב֖וּ בָּ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/023.yaml
  text: So the sons of Benjamin did so[a], and took wives according to their number from the dancers whom they had seized. Then they went and returned to their inheritance, rebuilt the cities[c][b], and lived in them.
translation:
  language: id
  text: Maka orang-orang Benyamin berbuat demikian. Sesuai dengan jumlah mereka, mereka mengambil perempuan-perempuan yang sedang menari itu sebagai istri. Perempuan-perempuan itulah yang telah mereka rampas[a]. Kemudian mereka pergi dan kembali ke tanah pusaka mereka. Mereka membangun kembali kota-kota itu[b] dan tinggal di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “telah mereka rebut dengan paksa” atau “telah mereka larikan.” Kata Ibraninya menyatakan pengambilan secara paksa atau perampasan.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “membangun kota-kota itu.” “Membangun kembali” mengikuti konteks kota-kota Benyamin yang sebelumnya telah dimusnahkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: berbuat demikian
  rationale: Mempertahankan rumus naratif Ibrani yang menunjukkan bahwa mereka melaksanakan rencana yang baru saja dijelaskan.
- source_word: בְּנֵי בִנְיָמִן
  choice: orang-orang Benyamin
  rationale: Dalam konteks kesukuan, ungkapan harfiah 'anak-anak Benyamin' merujuk kepada anggota laki-laki suku Benyamin. 'Orang-orang Benyamin' alami dalam bahasa Indonesia dan tidak menimbulkan kesan bahwa semuanya anak kandung Benyamin.
- source_word: וַיִּשְׂאוּ נָשִׁים
  choice: mengambil sebagai istri
  rationale: Mencerminkan idiom Ibrani tentang pengambilan perempuan menjadi istri tanpa menghaluskan peristiwa itu menjadi pernikahan yang terkesan sepenuhnya sukarela.
- source_word: לְמִסְפָּרָם
  choice: sesuai dengan jumlah mereka
  rationale: Menunjukkan bahwa jumlah istri yang diambil bersesuaian dengan jumlah laki-laki Benyamin yang membutuhkan istri, sambil tetap dekat dengan bentuk Ibraninya.
- source_word: מִן הַמְּחֹלְלוֹת
  choice: perempuan-perempuan yang sedang menari itu
  rationale: Partisip Ibrani berbentuk feminin jamak. Penyebutan 'perempuan-perempuan' membuat jenis kelamin rujukannya jelas dan tetap alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר גָּזָלוּ
  choice: yang telah mereka rampas
  rationale: Kata kerja גזל menyatakan pengambilan dengan paksa atau perampasan. 'Rampas' mempertahankan daya paksa dan bobot moral kata sumber.
- source_word: וַיֵּלְכוּ וַיָּשׁוּבוּ
  choice: Kemudian mereka pergi dan kembali
  rationale: 'Mempertahankan kedua kata kerja Ibrani: mereka meninggalkan tempat perayaan lalu kembali ke wilayah suku mereka.'
- source_word: אֶל נַחֲלָתָם
  choice: ke tanah pusaka mereka
  rationale: נחלה dalam konteks ini menunjuk pada bagian tanah warisan suku. 'Tanah pusaka' mempertahankan nuansa tanah warisan perjanjian dan lebih jelas daripada sekadar 'warisan'.
- source_word: וַיִּבְנוּ אֶת הֶעָרִים
  choice: membangun kembali kota-kota itu
  rationale: Kata Ibrani secara harfiah berarti 'membangun', tetapi konteks sebelumnya menyatakan bahwa kota-kota Benyamin telah dimusnahkan. 'Membangun kembali' menyampaikan makna kontekstual itu; catatan kaki mempertahankan bentuk harfiahnya.
- source_word: וַיֵּשְׁבוּ בָּהֶם
  choice: tinggal di sana
  rationale: Mengungkapkan secara alami bahwa mereka kembali menghuni kota-kota tersebut; dalam bahasa Indonesia, 'di sana' merujuk dengan jelas kepada kota-kota itu.
theological_decisions:
- issue: Daya moral גָּזָלוּ dalam pengambilan para perempuan
  choice: Memakai 'telah mereka rampas' yang secara jelas menyatakan pemaksaan.
  alternative: telah mereka ambil; telah mereka larikan
  rationale: Narasi tidak boleh diterjemahkan dengan ungkapan yang mengurangi kekerasan tindakan tersebut atau menyiratkan persetujuan para perempuan. Terjemahan ini melaporkan tindakan tanpa membenarkannya.
- issue: Istilah tanah kesukuan נחלה
  choice: Memakai 'tanah pusaka mereka'.
  alternative: wilayah mereka; milik pusaka mereka
  rationale: '''Tanah pusaka'' menjaga dimensi warisan tanah kesukuan tanpa memasukkan tafsiran doktrinal tambahan.'
- issue: Apakah וַיִּבְנוּ harus diterjemahkan secara harfiah atau kontekstual
  choice: Memakai 'membangun kembali' dalam teks utama.
  alternative: membangun
  rationale: Konteks kehancuran kota-kota Benyamin mendukung makna pemulihan, tetapi karena unsur 'kembali' tidak dinyatakan tersendiri dalam kata Ibrani, bentuk harfiahnya dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Susunan kalimat dibuat mudah dipahami pembaca umum, sementara istilah 'tanah pusaka' mempertahankan warna kesukuan Alkitab. Kata 'rampas' sengaja tidak diperhalus agar kekerasan dalam teks sumber tetap nyata.
