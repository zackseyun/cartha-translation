revisions:
- from: Maka orang-orang Benyamin berbuat demikian. Mereka mengambil sebagai istri perempuan-perempuan yang sedang menari itu, sesuai dengan jumlah mereka, yaitu perempuan-perempuan yang telah mereka rampas[a]. Kemudian mereka pergi dan kembali ke tanah pusaka mereka. Mereka membangun kembali kota-kota itu[b] dan tinggal di sana.
  to: Maka orang-orang Benyamin berbuat demikian. Sesuai dengan jumlah mereka, mereka mengambil perempuan-perempuan yang sedang menari itu sebagai istri. Perempuan-perempuan itulah yang telah mereka rampas[a]. Kemudian mereka pergi dan kembali ke tanah pusaka mereka. Mereka membangun kembali kota-kota itu[b] dan tinggal di sana.
