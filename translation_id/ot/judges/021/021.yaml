  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/רְאִיתֶ֗ם וְ֠/הִנֵּה אִם יֵ֨צְא֥וּ בְנוֹת שִׁילוֹ֮ לָ/ח֣וּל בַּ/מְּחֹלוֹת֒ וִֽ/יצָאתֶם֙ מִן הַ/כְּרָמִ֔ים וַ/חֲטַפְתֶּ֥ם לָ/כֶ֛ם אִ֥ישׁ אִשְׁתּ֖/וֹ מִ/בְּנ֣וֹת שִׁיל֑וֹ וַ/הֲלַכְתֶּ֖ם אֶ֥רֶץ בִּנְיָמִֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/021.yaml
  text: Watch[a], and behold, when the daughters of Shiloh come out to dance in the dances, then come out from the vineyards and seize for yourselves, each man his wife from the daughters of Shiloh, and go to the land of Benjamin.
translation:
  language: id
  text: 'Perhatikanlah: ketika para perempuan Silo keluar untuk menari dalam tari-tarian, keluarlah dari kebun-kebun anggur dan renggutlah[a] masing-masing seorang istri dari antara para perempuan Silo, lalu pergilah ke tanah Benyamin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "sambarlah" atau "bawa lari"; kata kerja Ibrani menunjukkan tindakan mengambil secara paksa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: Perhatikanlah
  rationale: Dalam rangkaian petunjuk ini, bentuk yang secara harfiah berarti 'dan kalian akan melihat' berfungsi sebagai perintah untuk mengamati dengan saksama.
- source_word: וְהִנֵּה
  choice: dan lihatlah
  rationale: Penanda perhatian ini dipertahankan untuk mencerminkan fungsi wacananya dan memberi tekanan pada apa yang akan tampak.
- source_word: אִם
  choice: ketika
  rationale: Walaupun bentuk dasarnya bersifat kondisional ('jika'), dalam skenario yang sudah diperkirakan ini kata tersebut secara alami menyatakan waktu; 'ketika' mempertahankan keterbukaan terhadap terlaksananya peristiwa tanpa membuat kalimat kaku.
- source_word: בְנוֹת שִׁילוֹ
  choice: anak-anak perempuan Silo
  rationale: Ungkapan sosial-kekeluargaan Ibrani dipertahankan tanpa menentukan usia mereka secara lebih sempit sebagai 'gadis-gadis'.
- source_word: לָחוּל בַּמְּחֹלוֹת
  choice: menari dalam tarian-tarian
  rationale: Terjemahan ini mempertahankan pengulangan akar kata dan bentuk jamak sumber, meskipun ungkapannya sedikit lebih formal dalam bahasa Indonesia.
- source_word: וִיצָאתֶם מִן הַכְּרָמִים
  choice: keluarlah dari kebun-kebun anggur
  rationale: Menggambarkan mereka muncul dari tempat persembunyian di kawasan kebun anggur; bentuk jamak sumber dipertahankan.
- source_word: וַחֲטַפְתֶּם
  choice: renggutlah
  rationale: Kata kerja ini menyatakan pengambilan secara tiba-tiba dan dengan kekuatan. 'Renggutlah' menyampaikan unsur paksaan tanpa memasukkan kategori hukum modern ke dalam teks utama.
- source_word: לָכֶם אִישׁ אִשְׁתּוֹ
  choice: bagi kalian masing-masing seorang istri
  rationale: Merender daya distributif ungkapan Ibrani—seorang istri untuk setiap laki-laki yang disapa—dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: מִבְּנוֹת שִׁילוֹ
  choice: dari antara anak-anak perempuan Silo
  rationale: '''Dari antara'' memperjelas makna pemilihan dari kelompok itu yang tersirat dalam preposisi Ibrani.'
- source_word: אֶרֶץ בִּנְיָמִן
  choice: tanah Benyamin
  rationale: Terjemahan formal yang mempertahankan penyebutan wilayah suku Benyamin.
theological_decisions:
- issue: Bahasa distributif bergender
  choice: bagi kalian masing-masing seorang istri
  alternative: setiap orang mengambil istrinya
  rationale: Sumber secara eksplisit menggambarkan para laki-laki mengambil perempuan sebagai istri. Terjemahan mempertahankan relasi bergender itu tanpa menambah gagasan bahwa perempuan-perempuan tersebut sebelumnya adalah istri mereka.
- issue: Penilaian moral atas tindakan
  choice: renggutlah
  alternative: culiklah
  rationale: Terjemahan harus menampilkan sifat paksa tindakan tersebut, tetapi tidak menambahkan istilah hukum yang lebih khusus daripada kata Ibrani. Alternatif yang menonjolkan makna membawa lari dicatat dalam catatan kaki.
- issue: Daya kondisional אִם
  choice: ketika
  alternative: jika
  rationale: Konteks memberikan petunjuk tentang kejadian yang diantisipasi, sehingga 'ketika' lebih alami. Namun, unsur ketidakpastian yang dimiliki 'jika' tidak dijadikan dasar untuk mengubah skenario menjadi kepastian teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk perintah jamak tidak ditandai secara khusus karena bahasa Indonesia tidak membedakannya secara morfologis. Ungkapan 'anak-anak perempuan Silo' dan 'tarian-tarian' sengaja mempertahankan tekstur formal sumber, sedangkan 'renggutlah' membuat unsur kekerasan dalam tindakan itu tetap jelas.
