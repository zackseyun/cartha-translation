- from: 'Perhatikanlah, dan lihatlah: ketika anak-anak perempuan Silo keluar untuk menari dalam tarian-tarian, keluarlah dari kebun-kebun anggur dan renggutlah[a] bagi kalian masing-masing seorang istri dari antara anak-anak perempuan Silo, lalu pergilah ke tanah Benyamin.'
  to: 'Perhatikanlah: ketika para perempuan Silo keluar untuk menari dalam tari-tarian, keluarlah dari kebun-kebun anggur dan renggutlah[a] masing-masing seorang istri dari antara para perempuan Silo, lalu pergilah ke tanah Benyamin.'
