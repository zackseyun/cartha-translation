base_translation:
  language: en
  yaml_path: translation/ot/judges/021/004.yaml
  text: And the next day the people rose early[a], built an altar there, and offered burnt offerings and peace offerings.
translation:
  language: id
  text: Keesokan harinya, orang-orang itu bangun pagi-pagi, membangun sebuah mezbah di sana, lalu mempersembahkan kurban bakaran dan kurban kesejahteraan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban persekutuan” atau “kurban perdamaian”. Istilah Ibrani ini menunjuk pada jenis kurban yang berkaitan dengan damai, keutuhan, kesejahteraan, dan persekutuan dalam jamuan kurban.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: Keesokan harinya
  rationale: Ungkapan naratif Ibrani secara harfiah memuat 'dan terjadilah', tetapi dalam narasi Indonesia modern unsur itu wajar diserap ke dalam keterangan waktu tanpa kehilangan makna.
- source_word: וַיַּשְׁכִּימוּ
  choice: bangun pagi-pagi
  rationale: Menjaga penekanan verba pada tindakan bangun lebih awal dan terdengar alami dalam bahasa Indonesia.
- source_word: הָעָם
  choice: rakyat itu
  rationale: Menerjemahkan nomina umum 'rakyat/bangsa itu' tanpa memperjelasnya menjadi 'orang Israel', yang tidak disebut secara eksplisit dalam ayat ini.
- source_word: וַיִּבְנוּ שָׁם מִזְבֵּחַ
  choice: membangun sebuah mazbah di sana
  rationale: Mempertahankan unsur lokasi שָׁם dan memakai istilah baku Alkitab Indonesia untuk altar persembahan.
- source_word: וַיַּעֲלוּ
  choice: mempersembahkan
  rationale: Dalam konteks kurban, verba yang secara harfiah berarti 'menaikkan' merupakan ungkapan kultis untuk mempersembahkan kurban.
- source_word: עֹלוֹת
  choice: kurban bakaran
  rationale: Padanan baku dan jelas bagi kurban yang dibakar seluruhnya di atas mazbah.
- source_word: וּשְׁלָמִים
  choice: kurban pendamaian
  rationale: Padanan Indonesia yang dikenal luas; catatan kaki mempertahankan keluasan makna istilah Ibrani yang berkaitan dengan damai, kesejahteraan, keutuhan, dan persekutuan.
theological_decisions:
- issue: Penerjemahan istilah kurban שְׁלָמִים
  choice: kurban pendamaian
  alternative: kurban persekutuan; kurban keselamatan/kesejahteraan
  rationale: Istilah tradisional yang mudah dikenali dipakai dalam teks utama, tetapi tidak dimaksudkan untuk membatasi makna pada tindakan meredakan murka. Catatan kaki menjaga rentang makna istilah Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Urutan tindakan Ibrani dipertahankan secara alami; istilah ritual diterjemahkan dengan kosakata Alkitab Indonesia yang lazim sambil menjelaskan ambiguitas leksikal melalui catatan kaki.
