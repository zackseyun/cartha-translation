  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מִ֠י אֲשֶׁ֨ר לֹא עָלָ֧ה בַ/קָּהָ֛ל מִ/כָּל שִׁבְטֵ֥י יִשְׂרָאֵ֖ל אֶל יְהוָ֑ה כִּי֩ הַ/שְּׁבוּעָ֨ה הַ/גְּדוֹלָ֜ה הָיְתָ֗ה לַ֠/אֲשֶׁר לֹא עָלָ֨ה אֶל יְהוָ֧ה הַ/מִּצְפָּ֛ה לֵ/אמֹ֖ר מ֥וֹת יוּמָֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/005.yaml
  text: And the sons of Israel said[a], “Who is there from all the tribes of Israel who did not come up to Yahweh in the assembly?” For the great oath had been made concerning whoever did not come up to Yahweh at Mizpah, saying[b], “He shall surely be put to death.”
translation:
  language: id
  text: 'Lalu orang Israel berkata[a], “Dari antara semua suku Israel, siapakah yang tidak datang menghadap Yahweh dalam perhimpunan?” Sebab sumpah besar itu berlaku terhadap siapa pun yang tidak datang menghadap Yahweh di Mizpa, demikian bunyinya: “Ia pasti akan dihukum mati.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “putra-putra Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan Ibrani harfiah 'anak-anak lelaki Israel' merupakan sebutan kolektif bagi bangsa Israel. 'Orang Israel' alami dalam bahasa Indonesia dan tidak mempersempit rujukan hanya kepada keturunan laki-laki.
- source_word: מִי אֲשֶׁר
  choice: siapakah yang
  rationale: Menyampaikan konstruksi interogatif-relatif yang meminta identifikasi pihak yang memenuhi keterangan berikutnya.
- source_word: לֹא עָלָה
  choice: tidak datang
  rationale: Kata עלה secara harfiah berarti 'naik', tetapi dalam konteks orang bergerak menuju tempat perhimpunan, 'datang' lebih alami dalam bahasa Indonesia; nuansa arah tidak menentukan makna ayat.
- source_word: בַקָּהָל
  choice: dalam perhimpunan itu
  rationale: קהל menunjuk komunitas yang berhimpun. 'Perhimpunan' mempertahankan gagasan berkumpul tanpa nuansa gerejawi yang dapat melekat pada 'jemaat'.
- source_word: אֶל יְהוָה
  choice: menghadap Yahweh
  rationale: Secara bentuk berarti 'kepada Yahweh'. Dalam konteks menghadiri perhimpunan sakral, 'menghadap Yahweh' merupakan ungkapan Indonesia yang alami tanpa mengubah tujuan religius tindakan itu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: הַשְּׁבוּעָה הַגְּדוֹלָה
  choice: sumpah besar
  rationale: Terjemahan langsung yang mempertahankan adjektiva 'besar'; 'sumpah khidmat' mungkin menangkap daya ungkapnya, tetapi lebih interpretatif.
- source_word: הָיְתָה לַאֲשֶׁר
  choice: mereka telah mengucapkan ... mengenai siapa pun
  rationale: Konstruksi Ibrani menyatakan bahwa sumpah itu berlaku terhadap orang yang dimaksud. Bentuk aktif berpelaku umum membuat kalimat Indonesia alami sambil mempertahankan lingkup sumpah.
- source_word: הַמִּצְפָּה
  choice: di Mizpa
  rationale: Menunjukkan lokasi perhimpunan; ejaan 'Mizpa' mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia.
- source_word: מוֹת יוּמָת
  choice: Ia harus dihukum mati
  rationale: Infinitif absolut bersama bentuk verbal pasif menegaskan hukuman mati yang pasti. 'Harus dihukum mati' menyampaikan daya hukum dan kepastian itu secara idiomatis.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama diri YHWH. 'Yahweh' mempertahankan statusnya sebagai nama ilahi; 'TUHAN' adalah penggantian tradisional dengan gelar.
- issue: Ungkapan kolektif maskulin בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak lelaki Israel
  rationale: Dalam konteks ini ungkapan tersebut berfungsi sebagai nama kolektif bangsa, bukan penegasan bahwa hanya laki-laki yang berbicara. Catatan kaki mempertahankan transparansi terhadap bentuk harfiahnya.
- issue: Relasi אֶל יְהוָה dengan perhimpunan
  choice: datang menghadap Yahweh dalam perhimpunan itu
  alternative: datang kepada Yahweh di dalam perhimpunan itu
  rationale: Pilihan ini menjaga kedua unsur teks—tujuan kepada Yahweh dan partisipasi dalam perhimpunan—tanpa menyamakan Yahweh dengan tempat atau majelis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur pertanyaan ditata ulang agar alami, sedangkan 'sumpah besar' dipertahankan untuk mencerminkan bentuk Ibrani. Nama ilahi ditulis 'Yahweh' secara konsisten.
