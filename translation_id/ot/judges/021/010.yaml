  text: וַ/יִּשְׁלְחוּ שָׁ֣ם הָ/עֵדָ֗ה שְׁנֵים עָשָׂ֥ר אֶ֛לֶף אִ֖ישׁ מִ/בְּנֵ֣י הֶ/חָ֑יִל וַ/יְצַוּ֨וּ אוֹתָ֜/ם לֵ/אמֹ֗ר לְ֠כוּ וְ/הִכִּיתֶ֞ם אֶת יוֹשְׁבֵ֨י יָבֵ֤שׁ גִּלְעָד֙ לְ/פִי חֶ֔רֶב וְ/הַ/נָּשִׁ֖ים וְ/הַ/טָּֽף־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/010.yaml
  text: So the assembly sent there twelve thousand men from the sons of valor, and they commanded them, saying, “Go and strike the inhabitants of Jabesh-gilead with the edge of the sword, including the women and the little ones.”
translation:
  language: id
  text: Lalu umat itu mengutus ke sana dua belas ribu orang dari antara para kesatria. Mereka memerintahkan mereka, “Pergilah dan bunuhlah penduduk Yabesh-Gilead dengan mata pedang, termasuk perempuan dan anak-anak.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֵדָה
  choice: umat itu
  rationale: Dalam konteks ini menunjuk pada himpunan umat Israel; 'umat itu' lebih alami dalam bahasa Indonesia daripada 'jemaah' dan tetap mengacu pada kelompok yang telah disebutkan.
- source_word: מִבְּנֵי הֶחָיִל
  choice: dari antara para kesatria
  rationale: Ungkapan ini secara harfiah berarti 'dari anak-anak/orang-orang keberanian atau kekuatan' dan di sini menggambarkan prajurit pilihan yang gagah.
- source_word: וְהִכִּיתֶם
  choice: bunuhlah
  rationale: Dalam perintah perang yang diikuti 'dengan mata pedang', verba נכה berarti menyerang hingga membunuh; pilihan ini menyatakan daya perintah secara jelas.
- source_word: לְפִי חֶרֶב
  choice: dengan mata pedang
  rationale: Mempertahankan idiom Ibrani yang lazim dan dapat dipahami sebagai pembunuhan dengan pedang.
- source_word: וְהַנָּשִׁים וְהַטָּף
  choice: termasuk perempuan dan anak-anak
  rationale: Waw di sini menambahkan kelompok yang termasuk dalam sasaran perintah. טף menunjuk anak-anak atau tanggungan kecil secara kolektif.
theological_decisions:
- issue: Cakupan perintah kekerasan terhadap penduduk Yabesh-Gilead
  choice: termasuk perempuan dan anak-anak
  alternative: beserta perempuan dan anak-anak
  rationale: Terjemahan tidak memperhalus atau membenarkan kekerasan dalam narasi, tetapi mempertahankan cakupan eksplisit teks Ibrani. 'Termasuk' mengungkap fungsi penambahan dalam konteks secara alami tanpa menambahkan penilaian teologis.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Nama tempat ditulis 'Yabesh-Gilead'. Kalimat langsung mempertahankan kerasnya narasi tanpa eufemisme atau komentar tambahan.
