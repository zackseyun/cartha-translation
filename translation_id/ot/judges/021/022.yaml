revisions:
- from: Apabila ayah atau saudara perempuan-perempuan itu datang untuk berbantah dengan kami,[a] kami akan berkata kepada mereka, ‘Kasihanilah kami dalam perkara mereka.[b] Sebab dalam peperangan itu kami tidak mengambil istri bagi setiap orang.[c] Bukan kalian yang memberikan perempuan-perempuan itu kepada mereka; seandainya kalian memberikannya, sekarang kalian akan bersalah.’[d]
  to: Apabila ayah atau saudara laki-laki mereka datang untuk berbantah dengan kami,[a] kami akan berkata kepada mereka, ‘Bermurahhatilah kepada kami dalam hal mereka.[b] Sebab, dalam peperangan itu kami tidak mengambil istri bagi setiap orang.[c] Bukan kalian yang memberikan perempuan-perempuan itu kepada mereka; seandainya kalian memberikan perempuan-perempuan itu, sekarang kalian akan bersalah.’[d]
