translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Berbantah” mempertahankan nada pertentangan; “Kasihanilah kami dalam perkara mereka” sengaja mempertahankan ketaksaan permohonan Ibrani. Rujukan kepada perempuan diperjelas hanya ketika rentetan pronomina akan terasa membingungkan dalam bahasa Indonesia.
