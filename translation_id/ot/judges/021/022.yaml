base_translation:
  language: en
  yaml_path: translation/ot/judges/021/022.yaml
  text: And it shall be[a], when their fathers or their brothers come to contend with us, that we will say to them, ‘Show us favor concerning them, because we did not take for each man his wife in the battle; for you did not give them to them[e][d][c][b], at this time, so that you should incur guilt.’
translation:
  language: id
  text: Apabila ayah atau saudara laki-laki mereka datang untuk berbantah dengan kami,[a] kami akan berkata kepada mereka, ‘Bermurahhatilah kepada kami dalam hal mereka.[b] Sebab, dalam peperangan itu kami tidak mengambil istri bagi setiap orang.[c] Bukan kalian yang memberikan perempuan-perempuan itu kepada mereka; seandainya kalian memberikan perempuan-perempuan itu, sekarang kalian akan bersalah.’[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “datang untuk mengeluh kepada kami” atau “datang untuk mengajukan perkara terhadap kami”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Bermurahhatilah kepada kami mengenai mereka.” Ungkapan ini dapat pula dipahami, “Berikanlah mereka kepada kami sebagai kemurahan.”
    reason: lexical_alternative
  - marker: c
    text: 'Bahasa Ibraninya padat: “kami tidak mengambil masing-masing orang istrinya dalam peperangan.” Kemungkinan maksudnya ialah bahwa dalam perang sebelumnya tidak diperoleh cukup istri bagi semua laki-laki Benyamin.'
    reason: cultural_note
  - marker: d
    text: 'Klausa penutup dalam bahasa Ibrani sulit. Maksudnya tampaknya: karena keluarga para perempuan tidak secara resmi memberikan mereka kepada orang-orang Benyamin, keluarga itu tidak melanggar sumpah dan tidak menanggung kesalahan.'
    reason: textual_difficulty
lexical_decisions:
- source_word: לָרוּב
  choice: datang untuk berbantah dengan kami
  rationale: Kata ריב dapat menunjuk pada berbantah, menyampaikan keluhan, atau mengajukan perkara. “Berbantah” mempertahankan sifat pertentangannya tanpa menjadikannya secara pasti sebagai proses hukum.
- source_word: חָנּוּנוּ אוֹתָם
  choice: Kasihanilah kami dalam perkara mereka
  rationale: Bentuk imperatif חנן dengan akhiran orang pertama jamak secara harfiah meminta agar para pembicara dikasihani atau diberi kemurahan. Frasa berikutnya menghubungkan permohonan itu dengan para perempuan; terjemahan ini mempertahankan kedua unsur tersebut tanpa memastikan bahwa para perempuan sedang diminta sebagai pemberian.
- source_word: לֹא לָקַחְנוּ אִישׁ אִשְׁתּוֹ בַּמִּלְחָמָה
  choice: dalam peperangan itu kami tidak mengambil istri bagi setiap orang
  rationale: Ungkapan Ibrani ini padat dan agak janggal. Susunan Indonesia menyampaikan bahwa istri tidak diperoleh bagi setiap laki-laki, sambil tetap mempertahankan tindakan “mengambil” dan latar peperangan.
- source_word: לֹא אַתֶּם נְתַתֶּם לָהֶם
  choice: Bukan kalian yang memberikan perempuan-perempuan itu kepada mereka
  rationale: Penekanan pada אַתֶּם dipertahankan dengan “bukan kalian”. Nomina “perempuan-perempuan itu” digunakan untuk memperjelas salah satu dari dua rujukan pronomina yang sangat ringkas dalam bahasa Ibrani.
- source_word: כָּעֵת תֶּאְשָׁמוּ
  choice: seandainya kalian memberikannya, sekarang kalian akan bersalah
  rationale: Klausa penutupnya sulit dan eliptis. Dalam konteks sumpah Israel, maksud yang paling mungkin ialah bahwa keluarga para perempuan tidak bersalah karena mereka tidak secara resmi menyerahkan perempuan-perempuan itu. Kata “seandainya” menandai syarat tersirat tanpa menghapus keterangan waktu “sekarang”.
