base_translation:
  language: en
  yaml_path: translation/ot/judges/021/014.yaml
  text: So Benjamin returned at that time[a], and they gave them the women whom they had kept alive from the women of Jabesh-gilead; but they did not find enough for them that way.
translation:
  language: id
  text: Pada waktu itu suku Benyamin kembali, lalu mereka memberikan kepada orang-orang Benyamin perempuan-perempuan dari Yabesh-Gilead yang telah mereka pertahankan tetap hidup. Namun, dengan cara itu mereka tidak mendapatkan cukup perempuan bagi mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “tetapi mereka tidak mendapatkan demikian bagi mereka.” Ungkapan Ibrani ini eliptis; maksudnya, perempuan yang diperoleh dengan cara ini tidak cukup bagi semua orang Benyamin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב בִּנְיָמִן
  choice: suku Benyamin kembali
  rationale: Nama Benyamin berbentuk tunggal tetapi berfungsi secara kolektif bagi suku itu. Penambahan 'suku' menjernihkan acuan dalam bahasa Indonesia tanpa mengubah makna.
- source_word: בָּעֵת הַהִיא
  choice: Pada waktu itu
  rationale: Ungkapan temporal baku ini mempertahankan penanda urutan narasi secara alami.
- source_word: וַיִּתְּנוּ לָהֶם
  choice: mereka memberikan kepada orang-orang Benyamin
  rationale: Subjek jamak tetap tersirat sesuai teks Ibrani dan konteks; objek tak langsung diperjelas agar pronomina Indonesia tidak rancu.
- source_word: הַנָּשִׁים
  choice: perempuan-perempuan
  rationale: Istilah Ibrani berarti 'perempuan-perempuan', bukan secara eksplisit 'istri-istri', meskipun konteksnya menyangkut penyediaan istri.
- source_word: אֲשֶׁר חִיּוּ
  choice: yang telah mereka biarkan hidup
  rationale: Bentuk piel dari חיה menyatakan bahwa mereka membuat atau membiarkan para perempuan itu tetap hidup setelah pembantaian; pilihan ini alami dan tepat dalam bahasa Indonesia.
- source_word: מִנְּשֵׁי יָבֵשׁ גִּלְעָד
  choice: dari Yabesh-Gilead
  rationale: Dalam susunan Indonesia, 'perempuan-perempuan dari Yabesh-Gilead' secara wajar menyampaikan asal mereka dan menghindari pengulangan kaku 'dari antara perempuan-perempuan'.
- source_word: וְלֹא מָצְאוּ לָהֶם כֵּן
  choice: Namun, perempuan-perempuan itu tidak cukup bagi mereka dengan cara demikian
  rationale: Ibrani bersifat eliptis, secara harfiah kira-kira 'dan mereka tidak mendapatkan demikian bagi mereka'. Konteks menunjukkan bahwa jumlah perempuan yang diperoleh melalui cara ini tidak mencukupi.
theological_decisions:
- issue: Status perempuan sebagai istri
  choice: Memakai 'perempuan-perempuan', bukan 'istri-istri'
  alternative: istri-istri
  rationale: Ayat ini sendiri menggunakan נָשִׁים dalam arti umum. Konteks menjelaskan tujuan pemberian mereka, tetapi terjemahan tidak perlu memasukkan status yang tidak dinyatakan secara eksplisit di sini.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Pengulangan 'perempuan-perempuan' dipertahankan demi kejelasan acuan, sedangkan 'orang-orang Benyamin' menjelaskan pemakaian kolektif nama suku.
