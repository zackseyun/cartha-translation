  text: מַה נַּעֲשֶׂ֥ה לָ/הֶ֛ם לַ/נּוֹתָרִ֖ים לְ/נָשִׁ֑ים וַ/אֲנַ֨חְנוּ֙ נִשְׁבַּ֣עְנוּ בַֽ/יהוָ֔ה לְ/בִלְתִּ֛י תֵּת לָ/הֶ֥ם מִ/בְּנוֹתֵ֖י/נוּ לְ/נָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/021/007.yaml
  text: What shall we do for them—for those who remain—to get wives? For we have sworn by Yahweh not to give them any of our daughters as wives.
translation:
  language: id
  text: Apa yang harus kita lakukan bagi mereka yang masih tersisa supaya mereka mendapat istri?[a] Sebab kita telah bersumpah demi Yahweh untuk tidak memberikan seorang pun dari anak-anak perempuan kita kepada mereka sebagai istri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “untuk istri-istri.” Maksud ungkapan Ibrani yang eliptis ini dijelaskan dalam teks.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה נַּעֲשֶׂה
  choice: Apa yang harus kita lakukan
  rationale: Bentuk tanya dengan imperfek orang pertama jamak menyatakan pertimbangan mengenai tindakan yang perlu diambil; frasa ini alami dalam bahasa Indonesia dan mempertahankan nuansa deliberatif.
- source_word: לָהֶם לַנּוֹתָרִים
  choice: bagi mereka yang masih tersisa
  rationale: לָהֶם menyatakan kepentingan atau manfaat, sedangkan לַנּוֹתָרִים menjelaskan siapa yang dimaksud, yaitu kaum Benyamin yang masih hidup. Susunan ini jelas dan alami tanpa menghilangkan hubungan penjelas tersebut.
- source_word: לְנָשִׁים
  choice: supaya mereka mendapat istri
  rationale: Ungkapan Ibrani pertama secara harfiah hanya berbunyi 'untuk istri-istri' dan bersifat eliptis. Konteks menuntut gagasan mencarikan atau memperoleh istri; 'supaya mereka mendapat istri' mengungkapkan maksud itu secara alami, dengan catatan kaki yang menjaga bentuk harfiahnya.
- source_word: וַאֲנַחְנוּ נִשְׁבַּעְנוּ
  choice: Sebab kita telah bersumpah
  rationale: Kata penghubung memperkenalkan alasan bagi dilema tersebut. Bentuk perfektif menunjuk pada sumpah yang sudah diucapkan dan tetap mengikat. 'Kita' cocok untuk pertimbangan bersama di antara orang Israel.
- source_word: בַיהוָה
  choice: demi Yahweh
  rationale: Preposisi ב digunakan dalam rumusan sumpah, sehingga 'demi' merupakan padanan Indonesia yang wajar. Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh'.
- source_word: לְבִלְתִּי תֵּת
  choice: untuk tidak memberikan
  rationale: Konstruksi ini menyatakan isi sumpah, yakni tidak memberikan anak perempuan mereka dalam perkawinan.
- source_word: מִבְּנוֹתֵינוּ
  choice: seorang pun dari anak-anak perempuan kita
  rationale: 'Preposisi מן bersifat partitif: tidak satu pun dari antara anak-anak perempuan mereka boleh diberikan. Rumusan ini mempertahankan daya cakup tersebut.'
- source_word: לְנָשִׁים
  choice: sebagai istri
  rationale: Pada kemunculan kedua, frasa ini menunjukkan status anak-anak perempuan yang diberikan dalam perkawinan; 'sebagai istri' merupakan ungkapan Indonesia yang langsung dan idiomatis.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה secara langsung. Bentuk 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Kata ganti inklusif 'kita' dipakai karena para pembicara sedang mempertimbangkan kewajiban bersama. Pengulangan 'sebagai istri' dipertahankan karena mencerminkan struktur dan pokok persoalan dalam teks Ibrani.
