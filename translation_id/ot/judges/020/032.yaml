base_translation:
  language: en
  yaml_path: translation/ot/judges/020/032.yaml
  text: And the sons of Benjamin said[a], “They are being struck down before us as at the first.” But the sons of Israel said[c][b], “Let us flee and draw them away from the city to the highways.”
translation:
  language: id
  text: Lalu orang-orang Benyamin berkata, “Mereka terpukul di hadapan kita seperti sebelumnya.” Namun orang-orang Israel berkata, “Mari kita melarikan diri dan menarik mereka[a] menjauh dari kota ke jalan-jalan raya.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, kata ganti objek dalam bahasa Ibrani berbentuk tunggal, “menarik dia menjauh,” tampaknya dengan Benyamin atau pasukannya dipandang sebagai satu kesatuan. Terjemahan utama memakai bentuk jamak yang alami dalam bahasa Indonesia.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani yang diterjemahkan “jalan-jalan raya” juga dapat berarti “jalan-jalan utama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: נִגָּפִים
  choice: terpukul
  rationale: Partisipel pasif ini dalam konteks perang menggambarkan pasukan yang sedang dipukul atau dikalahkan. ‘Terpukul’ mempertahankan gambaran konkret tanpa menjadikannya sekadar hasil abstrak ‘kalah’.
- source_word: לְפָנֵינוּ
  choice: di hadapan kita
  rationale: Ungkapan baku yang dalam konteks pertempuran berarti di depan mereka dan di bawah pukulan mereka.
- source_word: כְּבָרִאשֹׁנָה
  choice: seperti sebelumnya
  rationale: Merujuk pada pertempuran-pertempuran terdahulu dalam pasal ini. Ungkapan Indonesia ini alami dan tidak mempersempit rujukan hanya kepada satu pertempuran tertentu.
- source_word: נָנוּסָה
  choice: Mari kita melarikan diri
  rationale: Bentuk kohortatif orang pertama jamak menyatakan ajakan atau tekad bersama. ‘Mari kita’ mempertahankan nuansa volitif itu.
- source_word: וּנְתַקְּנֻהוּ
  choice: dan menarik mereka menjauh
  rationale: Verba נתק berarti menarik atau memisahkan dari suatu tempat. Sufiks objek Ibrani berbentuk tunggal, tetapi mengacu secara kolektif kepada Benyamin atau pasukannya; bahasa Indonesia secara alami memakai ‘mereka’ untuk kelompok manusia tersebut.
- source_word: הָעִיר
  choice: kota
  rationale: Padanan biasa untuk עִיר; dalam konteks ini menunjuk kepada Gibea sebagai pusat permukiman yang hendak dijauhi pasukan Benyamin.
- source_word: הַמְסִלּוֹת
  choice: jalan-jalan raya
  rationale: מְסִלָּה dapat menunjuk jalan utama atau jalan yang dibangun/ditinggikan. Bentuk jamaknya dipertahankan, dan ‘jalan-jalan raya’ lebih spesifik daripada sekadar ‘jalan’.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. ‘Orang-orang Benyamin’ dan ‘orang-orang Israel’ dipilih sebagai ungkapan alami bagi kelompok keturunan/suku. Penanda kala ‘telah berkata’ membantu menunjukkan bahwa ucapan Israel merupakan rencana yang sudah ditetapkan, sementara bahasa Ibrani sendiri memakai bentuk yang dapat tampil sebagai tindakan lampau dalam alur narasi.
