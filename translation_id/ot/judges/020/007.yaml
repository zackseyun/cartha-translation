  text: Look, all of you sons of Israel, give your word and counsel here.
translation:
  language: id
  text: Lihatlah, kalian semua, orang Israel! Kemukakanlah pendapat dan pertimbangan di sini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: Perhatikanlah
  rationale: Partikel penarik perhatian ini paling wajar disampaikan sebagai seruan agar para pendengar memperhatikan, bukan sebagai perintah melihat secara harfiah.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah berarti 'anak-anak Israel', tetapi dalam konteks ini menunjuk kepada umat Israel secara kolektif; 'orang Israel' alami dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: דָּבָר
  choice: pendapat
  rationale: Dalam pasangan dengan עֵצָה dan konteks musyawarah, kata ini menunjuk pada pernyataan atau pandangan yang dikemukakan, sehingga 'pendapat' lebih jelas daripada 'perkataan' tanpa menghilangkan fungsi deliberatifnya.
- source_word: עֵצָה
  choice: nasihat
  rationale: Mempertahankan arti umum kata tersebut sebagai nasihat atau pertimbangan yang diberikan dalam musyawarah.
- source_word: הֲלֹם
  choice: di sini
  rationale: Menerjemahkan penunjuk tempat secara langsung dan mempertahankan desakan agar pandangan disampaikan dalam pertemuan itu.
