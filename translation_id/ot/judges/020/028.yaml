  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ֠/פִינְחָס בֶּן אֶלְעָזָ֨ר בֶּֽן אַהֲרֹ֜ן עֹמֵ֣ד לְ/פָנָ֗י/ו בַּ/יָּמִ֣ים הָ/הֵם֮ לֵ/אמֹר֒ הַ/אוֹסִ֨ף ע֜וֹד לָ/צֵ֧את לַ/מִּלְחָמָ֛ה עִם בְּנֵֽי בִנְיָמִ֥ן אָחִ֖/י אִם אֶחְדָּ֑ל וַ/יֹּ֤אמֶר יְהוָה֙ עֲל֔וּ כִּ֥י מָחָ֖ר אֶתְּנֶ֥/נּוּ בְ/יָדֶֽ/ךָ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/028.yaml
  text: And Phinehas the son of Eleazar[a], son of Aaron, stood before him in those days, saying, “Shall I yet again go out to battle against the sons of Benjamin my brother, or shall I stop?” And Yahweh said, “Go up[c][b], for tomorrow I will give him into your hand.”
translation:
  language: id
  text: Pada waktu itu, Pinehas, anak Eleazar, anak Harun, berdiri di hadapannya[a] dan berkata, “Haruskah aku maju lagi untuk berperang melawan orang Benyamin, saudaraku,[b] atau haruskah aku berhenti?” Yahweh berfirman, “Majulah, sebab besok Aku akan menyerahkan dia[c] ke dalam tanganmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sufiks “-nya” dapat dipahami merujuk kepada Yahweh atau kepada tabut perjanjian yang disebut dalam ayat sebelumnya.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “anak-anak Benyamin, saudaraku”; bahasa kekerabatan ini tetap digunakan sekalipun mereka sedang terlibat dalam perang saudara.
    reason: cultural_note
  - marker: c
    text: Kata “dia” berbentuk tunggal dan tampaknya menyebut suku Benyamin sebagai satu kesatuan. “Menyerahkan ... ke dalam tanganmu” juga dapat diterjemahkan “memberikan dia ke dalam tanganmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִינְחָס בֶּן אֶלְעָזָר בֶּן אַהֲרֹן
  choice: Pinehas anak Eleazar, cucu Harun
  rationale: Nama ditransliterasikan secara lazim dalam bahasa Indonesia. Hubungan dua generasi dipertahankan dengan ungkapan alami “anak ... cucu ...”.
- source_word: עֹמֵד לְפָנָיו
  choice: berdiri di hadapannya
  rationale: Terjemahan ini mempertahankan gambaran berdiri di hadapan seseorang atau sesuatu serta tidak memutuskan secara diam-diam apakah sufiks itu merujuk kepada Yahweh atau tabut pada ayat sebelumnya.
- source_word: בַּיָּמִים הָהֵם
  choice: Pada waktu itu
  rationale: Padanan Indonesia modern dan alami bagi ungkapan waktu Ibrani, tanpa mengubah fungsi naratifnya.
- source_word: הַאוֹסִף עוֹד לָצֵאת לַמִּלְחָמָה
  choice: Haruskah aku maju lagi untuk berperang
  rationale: Konstruksi יסף dengan עוד menyatakan pengulangan, sedangkan יצא למלחמה merupakan ungkapan militer tentang maju untuk bertempur.
- source_word: עִם בְּנֵי בִנְיָמִן אָחִי
  choice: melawan keturunan Benyamin, saudaraku
  rationale: Dalam konteks peperangan, עִם menunjuk pihak lawan. “Keturunan Benyamin” alami dalam bahasa Indonesia, sedangkan “saudaraku” mempertahankan bahasa kekerabatan yang mencolok di tengah perang saudara.
- source_word: אִם אֶחְדָּל
  choice: atau haruskah aku berhenti?
  rationale: חדל berarti berhenti atau tidak melanjutkan; bentuk pertanyaan pertimbangan dipertahankan.
- source_word: עֲלוּ
  choice: Majulah kalian
  rationale: Bentuk perintah Ibrani ini jamak. Penyebutan “kalian” mempertahankan peralihan dari pertanyaan bersubjek tunggal kolektif kepada jawaban yang ditujukan kepada kelompok.
- source_word: כִּי מָחָר אֶתְּנֶנּוּ בְיָדֶךָ
  choice: sebab besok Aku akan menyerahkan dia ke dalam tanganmu
  rationale: Ungkapan “menyerahkan ... ke dalam tangan” mempertahankan idiom kemenangan atau penyerahan kuasa. Objek tunggal “dia” dipertahankan karena Benyamin diperlakukan secara kolektif.
theological_decisions:
- issue: Rujukan sufiks dalam לְפָנָיו
  choice: di hadapannya
  alternative: di hadapan tabut itu; di hadapan Yahweh
  rationale: Sufiks maskulin tunggal dapat dipahami merujuk kepada Yahweh atau, dalam kaitan dengan konteks ayat sebelumnya, kepada tabut perjanjian. Bentuk Indonesia yang berpronomina mempertahankan ketaksaan itu, dan catatan kaki menjelaskannya.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: “Yahweh” merepresentasikan nama ilahi secara langsung tanpa memasukkan penafsiran denominasi tertentu.
- issue: Bentuk tunggal kolektif dalam pertanyaan dan janji
  choice: aku ... dia ... tanganmu
  alternative: kami ... mereka ... tangan kalian
  rationale: Bentuk-bentuk tunggal dalam teks Ibrani dipertahankan agar gambaran Israel dan Benyamin sebagai kesatuan kolektif tidak diratakan menjadi bentuk jamak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat tetapi mudah dipahami. Struktur Ibrani dipertahankan bila membawa makna penting, sementara ungkapan yang terlalu kaku disesuaikan secara alami. Semua penanda catatan kaki ditempatkan tepat pada bagian teks yang diterangkan.
