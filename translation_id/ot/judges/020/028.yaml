revisions:
- from: Pada waktu itu Pinehas anak Eleazar, cucu Harun, berdiri di hadapannya[a] dan berkata, “Haruskah aku maju lagi untuk berperang melawan keturunan Benyamin, saudaraku,[b] atau haruskah aku berhenti?” Yahweh berfirman, “Majulah kalian, sebab besok Aku akan menyerahkan dia ke dalam tanganmu.”[c]
  to: Pada waktu itu, Pinehas, anak Eleazar, anak Harun, berdiri di hadapannya[a] dan berkata, “Haruskah aku maju lagi untuk berperang melawan orang Benyamin, saudaraku,[b] atau haruskah aku berhenti?” Yahweh berfirman, “Majulah, sebab besok Aku akan menyerahkan dia[c] ke dalam tanganmu.”
  rationale: Revisi ini memulihkan bentuk silsilah eksplisit dari bahasa Ibrani, memakai sebutan kesukuan Indonesia yang lebih alami, dan menghindari ketidakselarasan “kalian ... tanganmu” tanpa mengubah perintah jamak atau sufiks tunggal dalam sumber. Ketaksaan referen pada לְפָנָיו tetap dipertahankan dalam teks dan dijelaskan pada catatan kaki.
