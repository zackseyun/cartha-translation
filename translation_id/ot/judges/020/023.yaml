  text: וַ/יַּעֲל֣וּ בְנֵֽי יִשְׂרָאֵ֗ל וַ/יִּבְכּ֣וּ לִ/פְנֵֽי יְהוָה֮ עַד הָ/עֶרֶב֒ וַ/יִּשְׁאֲל֤וּ בַֽ/יהוָה֙ לֵ/אמֹ֔ר הַ/אוֹסִ֗יף לָ/גֶ֨שֶׁת֙ לַ/מִּלְחָמָ֔ה עִם בְּנֵ֥י בִנְיָמִ֖ן אָחִ֑/י וַ/יֹּ֥אמֶר יְהוָ֖ה עֲל֥וּ אֵלָֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/023.yaml
  text: Then the sons of Israel went up and wept before Yahweh until evening[a], and they inquired of Yahweh, saying, “Shall I continue to go near for battle with the sons of Benjamin, my brother?” And Yahweh said, “Go up against him.”
translation:
  language: id
  text: Kemudian orang-orang Israel naik dan menangis di hadapan Yahweh sampai petang. Mereka meminta petunjuk kepada Yahweh dengan berkata, “Haruskah aku maju lagi untuk berperang melawan orang-orang Benyamin, saudaraku?”[a] Yahweh berfirman, “Majulah melawan dia.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibraninya juga dapat diterjemahkan, “Haruskah aku terus maju untuk berperang dengan orang-orang Benyamin, saudaraku?” Verba yang dipakai dapat menyatakan pengulangan ataupun kelanjutan, dan kata depan yang secara harfiah berarti “dengan” dalam konteks pertempuran dapat bermakna “melawan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: naik
  rationale: Mempertahankan arah gerak verba עלה tanpa menentukan tujuan yang tidak disebutkan secara eksplisit.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang-orang Israel
  rationale: Ungkapan korporat ini diterjemahkan secara alami dalam bahasa Indonesia modern, sambil tetap menunjuk kepada bangsa Israel.
- source_word: וַיִּבְכּוּ לִפְנֵי יְהוָה
  choice: menangis di hadapan Yahweh
  rationale: Mempertahankan tindakan ratapan dan ungkapan kehadiran ilahi secara langsung.
- source_word: וַיִּשְׁאֲלוּ בַיהוָה
  choice: meminta petunjuk kepada Yahweh
  rationale: Konstruksi שׁאל ב dalam konteks ini menunjuk pada permohonan jawaban atau petunjuk ilahi, bukan sekadar mengajukan pertanyaan biasa.
- source_word: הַאוֹסִיף לָגֶשֶׁת
  choice: Haruskah aku maju lagi
  rationale: יסף dapat menyatakan pengulangan atau kelanjutan, sedangkan נגשׁ dalam konteks perang berarti maju mendekat untuk bertempur. Pilihan ini alami sekaligus mempertahankan bentuk orang pertama tunggal dalam bahasa Ibrani.
- source_word: עִם בְּנֵי בִנְיָמִן
  choice: melawan keturunan Benyamin
  rationale: Walaupun עִם secara dasar berarti 'dengan', konteks pertempuran menuntut hubungan adversatif. 'Keturunan Benyamin' mempertahankan unsur kekeluargaan dari בְנֵי.
- source_word: אָחִי
  choice: saudaraku
  rationale: Mempertahankan bentuk tunggal orang pertama dan ketegangan emosional bahwa Benyamin tetap diakui sebagai saudara.
- source_word: עֲלוּ אֵלָיו
  choice: Majulah melawan dia
  rationale: Mempertahankan verba gerak 'naik/maju' dan menjelaskan arah yang bersifat adversatif dalam konteks perang.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה; transliterasi 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Peralihan dari subjek jamak kepada ujaran orang pertama tunggal
  choice: aku ... saudaraku
  alternative: kami ... saudara kami
  rationale: Bentuk Ibrani הַאוֹסִיף dan אָחִי adalah orang pertama tunggal. Bentuk ini dipertahankan sebagai suara korporat Israel, tanpa menormalkannya menjadi jamak.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk orang pertama tunggal yang tidak lazim dipertahankan karena terdapat jelas dalam teks Ibrani dan menyuarakan Israel sebagai satu kesatuan korporat.
