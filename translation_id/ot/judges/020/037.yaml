base_translation:
  language: en
  yaml_path: translation/ot/judges/020/037.yaml
  text: Then the men in ambush quickly rushed against Gibeah[a], and the ambush advanced and struck the whole city with the edge of the sword.
translation:
  language: id
  text: Orang-orang yang bersembunyi untuk menyergap itu segera menyerbu Gibea, lalu pasukan penyergap itu maju[a] dan menewaskan seluruh penduduk kota dengan mata pedang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menarik”; kata kerja ini mungkin menggambarkan pasukan penyergap itu merentang maju atau terus mendesak masuk ke dalam kota.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹרֵב
  choice: orang-orang yang mengadang / pasukan pengadang
  rationale: Kata benda tunggal ini merujuk secara kolektif kepada pasukan yang ditempatkan untuk menyergap. Variasi ungkapan menghasilkan bahasa Indonesia yang alami tanpa mengubah acuannya.
- source_word: הֵחִישׁוּ
  choice: segera
  rationale: Bentuk verba ini menyatakan tindakan yang dilakukan dengan cepat atau tergesa-gesa.
- source_word: וַיִּפְשְׁטוּ אֶל
  choice: menyerbu ke arah
  rationale: Dalam konteks pertempuran, verba ini menggambarkan gerakan serangan yang cepat menuju Gibea; 'ke arah' mempertahankan arah yang dinyatakan oleh אֶל tanpa memastikan nuansa yang lebih keras daripada sumber.
- source_word: הַגִּבְעָה
  choice: Gibea
  rationale: Nama tempat ini ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: וַיִּמְשֹׁךְ
  choice: maju
  rationale: Secara harfiah verba ini berarti 'menarik', tetapi dalam konteks ini tampaknya menggambarkan pasukan pengadang yang bergerak atau merentang maju. Ketidakpastian leksikal dipertahankan dalam catatan kaki.
- source_word: וַיַּךְ
  choice: menewaskan
  rationale: Verba 'memukul' diikuti ungkapan 'dengan mata pedang' menunjukkan tindakan mematikan; 'menewaskan' menyampaikan hasil yang wajar dalam konteks ini.
- source_word: כָּל הָעִיר
  choice: seluruh penduduk kota
  rationale: Secara bentuk berarti 'seluruh kota', tetapi karena objeknya ditewaskan dengan pedang, kota dipakai secara metonimis untuk penduduknya. Ungkapan ini menghindari kesan bahwa bangunan dibunuh.
- source_word: לְפִי חָרֶב
  choice: dengan mata pedang
  rationale: Ungkapan Ibrani harfiah 'dengan mulut pedang' adalah idiom untuk pembunuhan dengan pedang; 'mata pedang' mempertahankan citra idiomatis secara alami dalam bahasa Indonesia.
