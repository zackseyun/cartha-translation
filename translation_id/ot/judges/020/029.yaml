  text: So Israel set men in ambush around Gibeah[a].
translation:
  language: id
  text: Lalu Israel menempatkan para penyergap di sekeliling Gibea.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “menempatkan para penyergap ke arah/di sekeliling Gibea.” Frasa ini mengacu pada penempatan para penyergap di sekitar kota itu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: menempatkan
  rationale: Kata kerja שׂוּם berarti menaruh atau menempatkan; dalam konteks militer ini, “menempatkan” menyatakan tindakan mengatur posisi pasukan secara alami dalam bahasa Indonesia.
- source_word: יִשְׂרָאֵל
  choice: orang Israel
  rationale: Nama kolektif ini menunjuk kepada pasukan Israel. “Orang Israel” jelas dan wajar dalam konteks narasi.
- source_word: אֹרְבִים
  choice: pasukan penyergap
  rationale: Partisipel dari ארב menunjuk kepada orang-orang yang mengadang atau menanti untuk menyerang, bukan sekadar konsep abstrak “penyergapan”. “Pasukan penyergap” mempertahankan makna personal sekaligus sesuai dengan konteks militer.
- source_word: אֶל ... סָבִיב
  choice: di sekeliling
  rationale: Walaupun אֶל sendiri lazim berarti “ke/ke arah”, gabungannya dengan סָבִיב dalam konteks penempatan pasukan menyatakan posisi mengelilingi kota. “Di sekeliling” mempertahankan fungsi lokatif frasa tersebut.
- source_word: הַגִּבְעָה
  choice: Gibea
  rationale: Ini adalah nama tempat. Bentuk “Gibea” mengikuti ejaan Alkitab bahasa Indonesia yang lazim.
