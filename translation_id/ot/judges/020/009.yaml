  source_fidelity: 'Teks Indonesia mempertahankan struktur deliberatif Ibrani: וְעַתָּה diterjemahkan dengan transisi yang wajar, rencana kolektif pada נַעֲשֶׂה dipertahankan, dan bagian akhir yang eliptis tetap tidak menambahkan verba seperti “maju” atau “menyerang.” “Melawannya berdasarkan undian” secara wajar mengungkapkan daya bermusuhan עָלֶיהָ serta בְּגוֹרָל, tanpa memaksakan secara pasti apakah undian menentukan tindakan, urutan, atau penugasannya.'
  naturalness: '“Tetapi sekarang, inilah yang akan kita lakukan terhadap Gibea: melawannya berdasarkan undian.” jelas dan dapat diterima dalam bahasa Indonesia modern. Kepadatan sesudah titik dua terasa agak eliptis, tetapi itu disengaja dan sesuai dengan kepadatan teks sumber; catatan kaki membantu pembaca.'
