  text: 'But now this is what we will do to Gibeah: against it by lot[a].'
translation:
  language: id
  text: 'Tetapi sekarang, inilah yang akan kita lakukan terhadap Gibea: melawannya berdasarkan undian[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kita akan bertindak melawannya dengan membuang undi.” Bahasa Ibraninya ringkas dan mungkin menyiratkan bahwa tindakan pasukan terhadap Gibea akan diatur atau ditentukan melalui undian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Tetapi sekarang
  rationale: Menandai peralihan dari pembicaraan sebelumnya menuju langkah yang hendak diambil; 'tetapi sekarang' mempertahankan nuansa transisi yang agak berlawanan sekaligus temporal.
- source_word: זֶה הַדָּבָר אֲשֶׁר
  choice: inilah yang
  rationale: Ungkapan Indonesia yang alami untuk konstruksi demonstratif, nomina, dan relatif dalam bahasa Ibrani, serta memperkenalkan rencana tertentu.
- source_word: נַעֲשֶׂה
  choice: akan kita lakukan
  rationale: Bentuk imperfek orang pertama jamak menyatakan tindakan mendatang yang telah diniatkan dalam konteks perencanaan.
- source_word: לַגִּבְעָה
  choice: terhadap Gibea
  rationale: Preposisi ל menandai sasaran tindakan. 'Terhadap' cukup luas untuk mempertahankan hubungan itu tanpa menambahkan verba serangan yang tidak tertulis.
- source_word: עָלֶיהָ
  choice: melawannya
  rationale: Dalam konteks militer, על dapat menunjukkan gerakan atau tindakan bermusuhan terhadap sebuah kota. Akhiran feminin tunggal secara alami dirujuk dengan '-nya' dalam bahasa Indonesia.
- source_word: בְּגוֹרָל
  choice: berdasarkan undian
  rationale: Menunjukkan bahwa tindakan atau pembagiannya ditentukan melalui undian; pilihan ini mempertahankan keringkasan sumber.
