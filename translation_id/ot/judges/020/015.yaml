  naturalness: Teks draf umumnya jelas, tetapi ‘Dari penduduk Gibea itu dikerahkan dan dihitung 700 orang pilihan’ kurang lancar. Susunan revisi menempatkan jumlah dan kelompok asal secara lebih wajar dalam Bahasa Indonesia modern.
  terminology: ‘Orang-orang Benyamin’ tetap mencerminkan identitas suku dalam בְנֵי בִנְיָמִן. ‘Orang pilihan’ merupakan padanan yang sesuai konteks militer untuk בָּחוּר, sambil catatan kaki mempertahankan kemungkinan makna ‘pemuda’.
