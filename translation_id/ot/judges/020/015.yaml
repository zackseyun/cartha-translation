revisions:
- from: Pada hari itu keturunan Benyamin dari kota-kota dikerahkan dan dihitung untuk berperang:[a] 26.000 orang yang menyandang pedang, belum termasuk penduduk Gibea. Dari penduduk Gibea itu dikerahkan dan dihitung 700 orang pilihan.[b]
  to: 'Pada hari itu, orang-orang Benyamin dari kota-kota didaftarkan untuk dinas militer: dua puluh enam ribu orang yang menghunus pedang,[a] belum termasuk penduduk Gibea. Selain itu, tujuh ratus orang pilihan dari antara penduduk Gibea didaftarkan.[b]'
  rationale: Revisi mempertahankan dua kali pemakaian verba sumber dengan ‘didaftarkan’, memperjelas bahwa tujuh ratus orang Gibea adalah tambahan yang terpisah, dan mengganti ‘menyandang pedang’ dengan ‘menghunus pedang’ untuk mengikuti idiom Ibrani secara lebih dekat. Tidak ada perubahan doktrinal atau penafsiran sektarian.
