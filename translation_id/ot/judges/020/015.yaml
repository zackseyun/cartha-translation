base_translation:
  language: en
  yaml_path: translation/ot/judges/020/015.yaml
  text: 'And on that day the sons of Benjamin were mustered from the cities: twenty-six thousand men drawing the sword[a], besides the inhabitants of Gibeah[b], who were mustered as seven hundred chosen men.'
translation:
  language: id
  text: 'Pada hari itu, orang-orang Benyamin dari kota-kota didaftarkan untuk dinas militer: dua puluh enam ribu orang yang menghunus pedang,[a] belum termasuk penduduk Gibea. Selain itu, tujuh ratus orang pilihan dari antara penduduk Gibea didaftarkan.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dihitung” atau “didata”; kata kerja Ibrani di sini menunjuk pada penghitungan atau pendaftaran orang untuk dinas militer.
    reason: lexical_alternative
  - marker: b
    text: Atau “tujuh ratus pemuda”; kata Ibrani ini juga dapat menunjuk kepada pemuda, tetapi dalam konteks ini kemungkinan menekankan prajurit pilihan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפָּקְדוּ / הִתְפָּקְדוּ
  choice: dikerahkan dan dihitung untuk berperang
  rationale: Bentuk hitpael dari פקד dalam konteks ini menunjuk pada pencatatan atau penghitungan pasukan untuk dinas militer. Ungkapan ini mempertahankan unsur penghitungan sekaligus konteks pengerahan, dan dipakai pada kedua kemunculannya untuk mencerminkan pengulangan Ibrani.
- source_word: בְנֵי בִנְיָמִן
  choice: keturunan Benyamin
  rationale: Ungkapan ini mempertahankan corak genealogis-sukubangsa dari idiom Ibrani, tetapi lebih alami dalam bahasa Indonesia modern daripada terjemahan harfiah 'anak-anak Benyamin'.
- source_word: בַּיּוֹם הַהוּא
  choice: Pada hari itu
  rationale: Padanan temporal yang alami dan tetap mempertahankan penunjuk 'itu'.
- source_word: מֵהֶעָרִים
  choice: dari kota-kota
  rationale: Menunjukkan kota-kota sebagai tempat asal pasukan yang dihitung, tanpa menambahkan kata ganti kepunyaan yang tidak dinyatakan dalam teks.
- source_word: עֶשְׂרִים וְשִׁשָּׁה אֶלֶף אִישׁ
  choice: 26.000 orang
  rationale: Merender jumlah secara langsung; konteks militer sudah jelas dari kata kerja dan frasa berikutnya sehingga 'orang' tidak perlu diperluas menjadi 'prajurit'.
- source_word: שֹׁלֵף חָרֶב
  choice: yang menyandang pedang
  rationale: Idiom ini menunjuk pada orang yang dipersenjatai dan siap berperang. 'Menyandang pedang' mempertahankan gambaran konkret dengan bahasa Indonesia yang wajar; terjemahan sangat harfiah 'menghunus pedang' dapat memberi kesan tindakan sesaat.
- source_word: לְבַד
  choice: belum termasuk
  rationale: Menandai bahwa penduduk Gibea dihitung secara terpisah dan ditambahkan pada jumlah sebelumnya.
- source_word: מִיֹּשְׁבֵי הַגִּבְעָה
  choice: penduduk Gibea
  rationale: Padanan alami bagi konstruksi partisipial yang berarti orang-orang yang mendiami Gibea.
- source_word: שְׁבַע מֵאוֹת אִישׁ
  choice: 700 orang
  rationale: Padanan langsung bagi angka dan kata אִישׁ.
- source_word: בָּחוּר
  choice: orang pilihan
  rationale: Dalam konteks militer, kata ini paling mungkin menekankan orang-orang terpilih atau unggulan, meskipun secara leksikal juga dapat menunjuk kepada pemuda.
