  - severity: low
    issue: ‘dikerahkan dan dihitung untuk berperang’ memperluas verba sumber dan membuat pengulangan kalimat kedua kurang alami.
    rationale: Verba hitpael פקד di sini berfokus pada pendaftaran atau penghitungan untuk layanan militer. ‘Didaftarkan untuk dinas militer’ mencakup konteks militer dan fungsi pendataan dengan lebih ringkas.
  - severity: low
    issue: Catatan kaki a tidak menawarkan alternatif ‘didaftarkan’ bagi pilihan utama yang direvisi.
    rationale: Catatan diperbarui agar alternatif leksikal dan penjelasannya selaras dengan teks utama.
