  yaml_path: translation/ot/judges/020/019.yaml
  text: Then the sons of Israel rose in the morning and camped against Gibeah[a].
translation:
  language: id
  text: Lalu, pada pagi hari orang Israel bangun dan berkemah menghadapi Gibea.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: bangun
  rationale: Bentuk wayyiqtol dari קום melanjutkan urutan narasi. Dalam konteks waktu pagi, “bangun” menyampaikan tindakan tersebut secara alami tanpa mempersempit artinya menjadi keberangkatan.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan harfiah “anak-anak Israel” merupakan idiom kolektif bagi bangsa Israel. “Orang Israel” adalah padanan Indonesia yang alami dan mencakup kelompok yang dimaksud tanpa mengubah acuannya.
- source_word: בַּבֹּקֶר
  choice: pada pagi hari
  rationale: Preposisi dengan nomina definit ini menyatakan waktu; “pada pagi hari” merupakan padanan Indonesia modern yang wajar.
- source_word: וַיַּחֲנוּ
  choice: berkemah
  rationale: Kata חנה menunjuk pada tindakan mendirikan atau menempati perkemahan; “berkemah” ringkas dan jelas dalam narasi militer.
- source_word: עַל
  choice: untuk menghadapi
  rationale: Dalam konteks pertempuran, עַל menandai penempatan yang bermusuhan terhadap kota itu. “Untuk menghadapi” menyatakan orientasi militer secara alami, bukan sekadar kedekatan lokasi.
- source_word: הַגִּבְעָה
  choice: Gibea
  rationale: Nama tempat ini lazim ditransliterasikan “Gibea” dalam bahasa Indonesia; artikelnya merupakan bagian dari bentuk nama dalam konteks Ibrani dan tidak diterjemahkan tersendiri.
theological_decisions: []
translation_notes:
  register: Bahasa naratif modern, lugas, dan bermartabat. Urutan tindakan Ibrani dipertahankan melalui “Lalu”, sementara idiom etnis diterjemahkan secara alami sebagai “orang Israel”.
