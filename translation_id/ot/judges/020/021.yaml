  text: Then the sons of Benjamin came out from Gibeah and struck down twenty-two thousand men of Israel that day[a].
translation:
  language: id
  text: Lalu orang-orang Benyamin keluar dari Gibea dan pada hari itu menewaskan dua puluh dua ribu orang Israel hingga jatuh ke tanah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: keluar
  rationale: Bentuk wayyiqtol melanjutkan rangkaian narasi dan dalam konteks pertempuran menggambarkan pasukan yang keluar dari kota.
- source_word: בְנֵי בִנְיָמִן
  choice: orang-orang Benyamin
  rationale: Ungkapan ini menyatakan anggota suku Benyamin. Bentuk ini lebih alami dalam bahasa Indonesia modern daripada terjemahan harfiah 'anak-anak Benyamin'.
- source_word: מִן הַגִּבְעָה
  choice: dari Gibea
  rationale: Preposisi מִן menyatakan asal, yaitu kota Gibea.
- source_word: וַיַּשְׁחִיתוּ
  choice: menewaskan
  rationale: Dalam konteks pertempuran dan jumlah korban, bentuk Hifil dari שׁחת menunjuk pada tindakan membinasakan atau membunuh. 'Menewaskan' menyampaikan akibat mematikan secara alami tanpa menghilangkan nuansa militer.
- source_word: בְיִשְׂרָאֵל
  choice: orang Israel
  rationale: Preposisi ב menandai pihak yang terkena tindakan. Bersama אִישׁ dan angka korban, bahasa Indonesia paling alami mengungkapkannya sebagai 'orang Israel'.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu
  rationale: Terjemahan langsung dan idiomatis untuk penanda waktu tersebut.
- source_word: שְׁנַיִם וְעֶשְׂרִים אֶלֶף
  choice: dua puluh dua ribu
  rationale: Bentuk bilangan baku dalam bahasa Indonesia.
- source_word: אִישׁ
  choice: orang
  rationale: Nomina tunggal sesudah bilangan besar berfungsi sebagai satuan hitung manusia. 'Orang' adalah bentuk Indonesia yang alami dan tidak menambahkan keterangan 'prajurit' yang tidak eksplisit.
- source_word: אָרְצָה
  choice: tersirat dalam 'menewaskan'
  rationale: Bentuk berarah 'ke tanah' menggambarkan korban yang dijatuhkan hingga mati. Dalam bahasa Indonesia, penggabungannya ke dalam verba 'menewaskan' menghindari ungkapan kaku, sementara catatan kaki mempertahankan citra harfiahnya.
