  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֡ה תְּנוּ֩ אֶת הָ/אֲנָשִׁ֨ים בְּנֵֽי בְלִיַּ֜עַל אֲשֶׁ֤ר בַּ/גִּבְעָה֙ וּ/נְמִיתֵ֔/ם וּ/נְבַעֲרָ֥ה רָעָ֖ה מִ/יִּשְׂרָאֵ֑ל וְ/לֹ֤א אָבוּ֙ בִּנְיָמִ֔ן לִ/שְׁמֹ֕עַ בְּ/ק֖וֹל אֲחֵי/הֶ֥ם בְּנֵֽי יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/013.yaml
  text: Hand over the men[a], the sons of worthlessness, who are in Gibeah, so that we may put them to death and purge evil from Israel. But Benjamin was not willing to listen to the voice of their brothers[c][b], the sons of Israel.
translation:
  language: id
  text: Serahkanlah orang-orang itu—orang-orang bejat[a] yang ada di Gibea—supaya kami menghukum mati mereka dan menyingkirkan kejahatan dari Israel. Namun, suku Benyamin tidak mau mendengarkan suara saudara-saudara mereka, yaitu orang Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak kebejatan”; secara tradisional: “anak-anak Belial.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “mendengarkan suara saudara-saudara mereka, anak-anak Israel.” Ungkapan “mendengarkan suara” juga dapat berarti “mengindahkan” atau “menaati.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ
  choice: Serahkanlah
  rationale: Dalam konteks tuntutan hukum ini, verba tersebut meminta agar para pelaku diserahkan kepada perhimpunan untuk dihukum, bukan sekadar 'diberikan'.
- source_word: הָאֲנָשִׁים בְּנֵי בְלִיַּעַל
  choice: orang-orang itu—orang-orang bejat
  rationale: הָאֲנָשִׁים menunjuk para pelaku laki-laki yang telah disebut dalam konteks, sedangkan idiom 'anak-anak kebejatan/ketiadaan nilai' paling wajar diungkapkan sebagai karakterisasi moral 'orang-orang bejat' dalam bahasa Indonesia modern.
- source_word: אֲשֶׁר בַּגִּבְעָה
  choice: yang ada di Gibea
  rationale: Klausa relatif ini mengidentifikasi para pelaku menurut lokasi mereka.
- source_word: וּנְמִיתֵם
  choice: supaya kami menghukum mati mereka
  rationale: Bentuk kohortatif menyatakan tindakan yang dimaksudkan setelah penyerahan; 'menghukum mati' mempertahankan nuansa pelaksanaan hukuman secara yudisial.
- source_word: וּנְבַעֲרָה רָעָה מִיִּשְׂרָאֵל
  choice: dan menyingkirkan kejahatan dari Israel
  rationale: Dalam rumusan hukum perjanjian ini, בער berarti membuang atau membersihkan kejahatan dari tengah komunitas; 'menyingkirkan' terdengar alami tanpa mengurangi daya moral-hukumnya.
- source_word: וְלֹא אָבוּ בִּנְיָמִן
  choice: Namun, suku Benyamin tidak mau
  rationale: בִּנְיָמִן dipakai secara kolektif bagi suku Benyamin. Penambahan 'suku' memperjelas acuan kolektif, dan 'tidak mau' mempertahankan unsur kemauan atau penolakan dalam אָבוּ.
- source_word: לִשְׁמֹעַ בְּקוֹל
  choice: mendengarkan
  rationale: Idiom harfiahnya 'mendengarkan suara' dapat berarti mengindahkan atau menaati. 'Mendengarkan' mempertahankan citra dasarnya dan tetap wajar dalam konteks penolakan.
- source_word: אֲחֵיהֶם בְּנֵי יִשְׂרָאֵל
  choice: saudara-saudara mereka, yaitu orang Israel
  rationale: Terjemahan ini mempertahankan bahasa kekerabatan אֲחֵיהֶם dan memahami בְּנֵי יִשְׂרָאֵל sebagai frasa aposisional yang menjelaskan siapa saudara-saudara itu.
theological_decisions:
- issue: Makna בְּנֵי בְלִיַּעַל
  choice: orang-orang bejat
  alternative: anak-anak kebejatan; anak-anak Belial
  rationale: Dalam konteks ini frasa tersebut merupakan penilaian moral terhadap para pelaku, bukan rujukan yang harus dipahami sebagai nama pribadi makhluk jahat. Terjemahan ini menghindari memasukkan asosiasi teologis yang berkembang kemudian.
- issue: Daya yudisial bentuk-bentuk kohortatif
  choice: supaya kami menghukum mati mereka dan menyingkirkan kejahatan dari Israel
  alternative: lalu kami akan membunuh mereka dan membuang kejahatan dari Israel
  rationale: Pilihan ini mempertahankan tujuan hukum komunal dan rumusan pemurnian perjanjian tanpa memperluas maknanya secara doktrinal.
- issue: Identitas kolektif Benyamin dan hubungan persaudaraan Israel
  choice: suku Benyamin ... saudara-saudara mereka, yaitu orang Israel
  alternative: Benyamin ... sesama orang Israel
  rationale: Pilihan ini memperjelas bahwa Benyamin adalah subjek kolektif sambil mempertahankan ketegangan naratif bahwa mereka menolak saudara-saudara mereka sendiri.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif-yudisial yang bermartabat. Tanda pisah membantu menunjukkan bahwa 'orang-orang bejat' menjelaskan 'orang-orang itu'. Istilah 'suku Benyamin' dipakai agar subjek kolektif jelas bagi pembaca umum.
