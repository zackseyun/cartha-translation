revisions:
- from: Lalu orang-orang Israel berbalik menyerang keturunan Benyamin dan membunuh mereka dengan mata pedang, dari kota ke kota—manusia, ternak, dan segala sesuatu yang mereka temukan.[a] Mereka juga membakar semua kota yang mereka temukan.
  to: Lalu orang-orang Israel berbalik menyerang keturunan Benyamin. Mereka membunuh dengan mata pedang segala yang ada di kota-kota itu—manusia, ternak, dan segala sesuatu yang ditemukan.[a] Semua kota yang mereka jumpai itu juga mereka bakar.
