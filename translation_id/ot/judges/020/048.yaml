base_translation:
  language: en
  yaml_path: translation/ot/judges/020/048.yaml
  text: And the men of Israel turned back against the sons of Benjamin and struck them with the edge of the sword[a], from each city, men to livestock, even all that was found[c][b]. Also all the cities that were found they set on fire.
translation:
  language: id
  text: Lalu orang-orang Israel berbalik menyerang keturunan Benyamin. Mereka membunuh dengan mata pedang segala yang ada di kota-kota itu—manusia, ternak, dan segala sesuatu yang ditemukan.[a] Semua kota yang mereka jumpai itu juga mereka bakar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Frasa Ibrani yang diterjemahkan “segala yang ada di kota-kota itu—manusia” sulit dipastikan. Kemungkinan besar maksudnya ialah bahwa mereka membunuh habis penduduk kota-kota itu, bersama ternak dan segala sesuatu yang ditemukan di sana.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: orang-orang Israel
  rationale: Bentuk tunggal אִישׁ dipakai secara kolektif dan diikuti verba jamak; konteksnya menunjuk kepada pasukan laki-laki Israel.
- source_word: שָׁבוּ אֶל בְּנֵי בִנְיָמִן
  choice: berbalik menyerang keturunan Benyamin
  rationale: שׁוב menyatakan pembalikan arah, sedangkan אֶל memperoleh nuansa bermusuhan dari verba berikutnya. 'Keturunan Benyamin' mempertahankan ungkapan kekerabatan Ibrani secara wajar.
- source_word: וַיַּכּוּם לְפִי חֶרֶב
  choice: membunuh mereka dengan mata pedang
  rationale: Dalam konteks pemusnahan manusia dan ternak, נכה berarti membunuh, sementara idiom לְפִי חֶרֶב dipertahankan dengan ungkapan Indonesia 'dengan mata pedang'.
- source_word: מֵעִיר מְתֹם
  choice: dari kota ke kota—manusia
  rationale: Frasa ini sulit dan mungkin menyatakan pemusnahan menyeluruh atas penduduk kota-kota. Terjemahan ini mempertahankan cakupan distributif antarkota tanpa memakai susunan Indonesia yang kabur.
- source_word: עַד בְּהֵמָה עַד כָּל הַנִּמְצָא
  choice: ternak, dan segala sesuatu yang mereka temukan
  rationale: Rangkaian עַד memperluas lingkup pembunuhan hingga ternak dan semua yang dijumpai; susunan koordinatif ini alami dalam bahasa Indonesia.
- source_word: גַּם כָּל הֶעָרִים הַנִּמְצָאוֹת שִׁלְּחוּ בָאֵשׁ
  choice: Mereka juga membakar semua kota yang mereka temukan
  rationale: מצא dipahami sebagai kota-kota yang dijumpai, dan idiom שׁלח באש berarti membakar atau menyerahkan kepada api.
