  text: וַ/יִּשְׁאֲל֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בַּֽ/יהוָ֑ה וְ/שָׁ֗ם אֲרוֹן֙ בְּרִ֣ית הָ/אֱלֹהִ֔ים בַּ/יָּמִ֖ים הָ/הֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/027.yaml
  text: And the sons of Israel inquired of Yahweh—for the ark of the covenant of God was there in those days—[a][b]
translation:
  language: id
  text: Lalu orang Israel meminta petunjuk kepada Yahweh[a]—tabut perjanjian Allah ada di sana pada masa itu[b]—.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Israel”; ungkapan ini merujuk kepada umat Israel secara kolektif.
    reason: lexical_alternative
  - marker: b
    text: Klausa ini merupakan keterangan sisipan tentang keberadaan tabut perjanjian Allah di sana pada waktu itu.
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ
  choice: meminta petunjuk
  rationale: Dalam konstruksi שׁאל dengan ב dan nama ilahi, kata ini menunjuk pada tindakan mencari jawaban atau petunjuk ilahi, bukan sekadar mengajukan pertanyaan biasa.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Ungkapan ini mempertahankan hubungan dengan bentuk harfiah 'anak-anak Israel' sekaligus terdengar alami dan mencakup umat Israel secara kolektif dalam bahasa Indonesia modern.
- source_word: בַּיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ב dalam idiom שׁאל ב menandai pihak ilahi yang dimintai petunjuk; 'kepada' menghasilkan ungkapan Indonesia yang alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: וְשָׁם
  choice: sebab ... ada di sana
  rationale: Dalam konteks ini klausa tersebut menjelaskan latar tindakan meminta petunjuk; tanda pisah mempertahankan sifat sisipannya.
- source_word: אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: tabut perjanjian Allah
  rationale: Padanan ini mempertahankan seluruh rangkaian konstruksi Ibrani dengan ungkapan yang sudah dikenal dan wajar dalam bahasa Indonesia.
- source_word: בַּיָּמִים הָהֵם
  choice: pada masa itu
  rationale: Padanan idiomatis ini menyampaikan acuan waktu lampau dengan alami; bentuk lebih harfiah 'pada hari-hari itu' juga mungkin.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Sifat tindakan Israel terhadap Yahweh
  choice: meminta petunjuk kepada Yahweh
  alternative: bertanya kepada Yahweh; meminta keputusan dari Yahweh
  rationale: Ungkapan Ibrani menyiratkan pencarian jawaban ilahi, tetapi tidak merinci cara atau bentuk orakelnya; terjemahan ini menjaga makna religius tanpa menambahkan mekanisme tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Meminta petunjuk' dipilih agar fungsi religius שׁאל ב jelas bagi pembaca umum. Tanda pisah menandai keterangan latar yang bersifat sisipan.
