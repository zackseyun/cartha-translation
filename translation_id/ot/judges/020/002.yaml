  text: וַ/יִּֽתְיַצְּב֞וּ פִּנּ֣וֹת כָּל הָ/עָ֗ם כֹּ֚ל שִׁבְטֵ֣י יִשְׂרָאֵ֔ל בִּ/קְהַ֖ל עַ֣ם הָ/אֱלֹהִ֑ים אַרְבַּ֨ע מֵא֥וֹת אֶ֛לֶף אִ֥ישׁ רַגְלִ֖י שֹׁ֥לֵֽף חָֽרֶב־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/002.yaml
  text: And the chiefs of all the people[a], of all the tribes of Israel, took their stand in the assembly of the people of God—four hundred thousand foot soldiers drawing the sword.
translation:
  language: id
  text: Lalu para pemimpin seluruh rakyat[a], yaitu semua suku Israel, menempatkan diri dalam perhimpunan umat Allah—empat ratus ribu prajurit pejalan kaki yang menghunus pedang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sudut-sudut seluruh rakyat”, sebuah ungkapan bagi para pemimpin atau tokoh utama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְיַצְּבוּ
  choice: mengambil tempat
  rationale: Bentuk hitpael dari יצב menyatakan menempatkan diri atau berdiri dalam kesiapan; pilihan ini alami dalam bahasa Indonesia dan tetap memuat nuansa resmi serta militer.
- source_word: פִּנּוֹת
  choice: para pemimpin
  rationale: Secara harfiah berarti 'sudut-sudut', tetapi di sini merupakan ungkapan metaforis bagi tokoh utama atau pemimpin rakyat. Makna harfiahnya dicatat dalam catatan kaki.
- source_word: כָּל הָעָם
  choice: seluruh rakyat
  rationale: Menyampaikan cakupan kolektif frasa Ibrani secara lugas dan alami.
- source_word: כֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: yaitu semua suku Israel
  rationale: Kata 'yaitu' memperjelas fungsi frasa ini sebagai keterangan aposisional tanpa mengubah acuannya.
- source_word: בִּקְהַל
  choice: dalam perhimpunan
  rationale: קהל menunjuk pada kumpulan yang telah berhimpun; 'perhimpunan' mempertahankan nuansa formal tanpa bunyi gerejawi yang tidak diperlukan.
- source_word: עַם הָאֱלֹהִים
  choice: umat Allah
  rationale: Ungkapan baku dan bermartabat dalam bahasa Indonesia untuk kelompok yang berelasi dengan Allah, tanpa menambahkan tafsiran doktrinal.
- source_word: אַרְבַּע מֵאוֹת אֶלֶף
  choice: empat ratus ribu
  rationale: Terjemahan langsung bilangan Ibrani.
- source_word: אִישׁ רַגְלִי
  choice: prajurit berjalan kaki
  rationale: Mencerminkan secara transparan arti harfiah 'orang yang berjalan kaki' dalam konteks militer dan membedakannya dari pasukan berkendaraan.
- source_word: שֹׁלֵף חָרֶב
  choice: yang menghunus pedang
  rationale: Mempertahankan gambaran aktif dari partisipel Ibrani dan ungkapan pedang dalam bentuk tunggal kolektif, tanpa menambahkan kata distributif 'masing-masing'.
theological_decisions:
- issue: Penerjemahan עַם הָאֱלֹהִים
  choice: umat Allah
  alternative: rakyat Allah
  rationale: '''Umat Allah'' merupakan padanan Indonesia yang alami dan khidmat bagi sebutan relasional ini; pilihan tersebut tidak mempersempitnya menjadi istilah denominasi atau gerejawi tertentu.'
translation_notes:
  register: Bahasa Indonesia modern yang resmi, jelas, dan bermartabat. Struktur aposisional dipertahankan, sementara idiom Ibrani yang tidak alami diterjemahkan menurut maknanya dan bentuk harfiahnya dicatat dalam catatan kaki.
