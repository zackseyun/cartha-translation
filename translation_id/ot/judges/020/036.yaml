  register: Bahasa Indonesia modern, naratif, dan bermartabat. 'Bani Benyamin' mempertahankan ungkapan kekerabatan; 'mundur memberi ruang' menyampaikan idiom taktis secara jelas. Penanda catatan kaki [a] dan [b] ditempatkan langsung pada unsur yang dijelaskan.
