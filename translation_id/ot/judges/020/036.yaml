  to: Maka bani Benyamin melihat bahwa mereka telah dikalahkan. Orang-orang Israel telah memberi ruang kepada Benyamin[a], sebab mereka mengandalkan penyergapan[b] yang telah mereka siapkan terhadap Gibea.
  rationale: Menghapus unsur “untuk menyerang,” yang terlalu spesifik dibandingkan dengan אֶל הַגִּבְעָה, dan mengganti “pasukan penghadang” dengan “penyergapan” agar ambiguitas leksikal sumber dipertahankan dalam teks utama. Catatan kaki tetap menyediakan alternatif yang merujuk kepada pasukan.
