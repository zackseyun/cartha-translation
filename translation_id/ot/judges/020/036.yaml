  terminology: “Bani Benyamin,” “orang-orang Israel,” dan “Gibea” konsisten dengan register naratif Alkitab Indonesia. “Penyergapan” mempertahankan ambiguitas אֹרֵב; catatan kaki menyatakan kemungkinan rujukan kepada pasukan penyergap.
