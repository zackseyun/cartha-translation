  text: וַ/יִּרְא֥וּ בְנֵֽי בִנְיָמִ֖ן כִּ֣י נִגָּ֑פוּ וַ/יִּתְּנ֨וּ אִֽישׁ יִשְׂרָאֵ֤ל מָקוֹם֙ לְ/בִנְיָמִ֔ן כִּ֤י בָֽטְחוּ֙ אֶל הָ֣/אֹרֵ֔ב אֲשֶׁר שָׂ֖מוּ אֶל הַ/גִּבְעָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/036.yaml
  text: So the sons of Benjamin saw that they were defeated[a]. Now the men of Israel had given place to Benjamin[b], because they trusted in the ambush that they had set against Gibeah.
translation:
  language: id
  text: Maka bani Benyamin melihat bahwa mereka telah dikalahkan. Orang-orang Israel telah memberi ruang kepada Benyamin[a], sebab mereka mengandalkan penyergapan[b] yang telah mereka siapkan terhadap Gibea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “telah memberi ruang kepada Benyamin”; maksudnya, Israel sengaja mundur untuk memancing pasukan Benyamin keluar.
    reason: lexical_alternative
  - marker: b
    text: Atau “pasukan penyergap”. Kata Ibrani אֹרֵב dapat menunjuk penyergapan atau orang-orang yang menunggu untuk menyergap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: melihat
  rationale: Mempertahankan arti dasar ראה dan kekonkretan narasi; dalam konteks ini tindakan melihat juga menyiratkan kesadaran.
- source_word: בְנֵי בִנְיָמִן
  choice: bani Benyamin
  rationale: Ungkapan Indonesia yang alami dan bermartabat untuk kelompok keturunan Benyamin, sekaligus mempertahankan citra kekerabatan Ibrani.
- source_word: כִּי נִגָּפוּ
  choice: bahwa mereka telah dikalahkan
  rationale: Bentuk Niphal נגף dalam konteks pertempuran menyatakan kekalahan; aspek telah selesai sesuai dengan saat mereka menyadarinya.
- source_word: וַיִּתְּנוּ ... מָקוֹם
  choice: memang telah mundur memberi ruang
  rationale: Menjelaskan idiom harfiah 'memberi tempat/ruang' sebagai tindakan taktis mundur yang disengaja, sedangkan 'memang telah' menandai keterangan retrospektif.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: orang-orang Israel
  rationale: Bentuk tunggal kolektif diterjemahkan sebagai kelompok para pejuang Israel secara alami dalam bahasa Indonesia.
- source_word: כִּי בָטְחוּ
  choice: sebab mereka mengandalkan
  rationale: בטח di sini berarti menaruh kepercayaan atau bersandar pada siasat dan kekuatan militer; 'mengandalkan' paling alami untuk objek tersebut.
- source_word: אֶל הָאֹרֵב
  choice: pasukan penghadang
  rationale: אֹרֵב dapat menunjuk penghadangan maupun orang-orang yang menunggu untuk menghadang. Dengan kata kerja שׂמוּ, rujukan kepada pasukan yang ditempatkan cocok dengan konteks, sementara ambiguitas dicatat.
- source_word: אֲשֶׁר שָׂמוּ
  choice: yang telah mereka tempatkan
  rationale: שׂים berarti menaruh atau menempatkan; pilihan ini wajar bila אֹרֵב dipahami sebagai pasukan.
- source_word: אֶל הַגִּבְעָה
  choice: untuk menyerang Gibea
  rationale: Dalam konteks militer, אֶל menunjukkan arah atau sasaran penghadangan. Terjemahan ini mengungkapkan orientasi terhadap kota tanpa menyatakan secara sempit lokasi pasukan.
