  yaml_path: translation/ot/judges/020/043.yaml
  text: They surrounded Benjamin[a], pursued him relentlessly, and trampled him down as far as opposite Gibeah[c][b], toward the east of the sun.
translation:
  language: id
  text: Mereka mengepung Benyamin, mengejarnya tanpa henti[a], lalu menginjak-injaknya[b] sampai di hadapan Gibea, di sebelah timur[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengejar Benyamin dari Menuha,” jika מְנוּחָה dipahami sebagai nama tempat, bukan sebagai keterangan cara.
    reason: alternative_reading
  - marker: b
    text: Atau, “menghalaunya”; kata kerja Ibrani ini dapat menyatakan tindakan menginjak dengan keras atau menyebabkan seseorang bergerak maju.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “dari tempat terbitnya matahari,” yaitu dari arah timur atau di sebelah timur.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּתְּרוּ
  choice: mengepung
  rationale: Kata kerja ini menyatakan tindakan mengelilingi atau mengurung lawan; “mengepung” wajar dalam konteks pertempuran.
- source_word: אֶת בִּנְיָמִן
  choice: Benyamin
  rationale: Nama suku dipakai secara kolektif, sebagaimana diperlihatkan oleh akhiran objek tunggal pada kata-kata kerja berikutnya.
- source_word: הִרְדִיפֻהוּ
  choice: mengejarnya
  rationale: רדף lazim berarti mengejar dalam konteks militer; bentuk tunggal “-nya” mempertahankan penggambaran Benyamin sebagai satu kesatuan kolektif.
- source_word: מְנוּחָה
  choice: tanpa henti
  rationale: Secara harfiah kata ini berkaitan dengan istirahat atau tempat perhentian. Dalam pemakaian adverbial yang sulit ini, “tanpa henti” menyampaikan kemungkinan bahwa pengejaran itu tidak memberi kesempatan beristirahat, sambil mencatat kemungkinan nama tempat dalam catatan kaki.
- source_word: הִדְרִיכֻהוּ
  choice: menginjak-injaknya
  rationale: Bentuk Hifil dari דרך dapat menyatakan menginjak atau menyebabkan bergerak. Dalam rangkaian tindakan perang ini, “menginjak-injaknya” mempertahankan daya kekerasan kata tersebut.
- source_word: עַד נֹכַח הַגִּבְעָה
  choice: sampai ke seberang Gibea
  rationale: נֹכַח menunjuk lokasi yang berhadapan, di depan, atau di seberang suatu tempat; “ke seberang Gibea” ringkas dan dapat dipahami secara spasial.
- source_word: מִמִּזְרַח שָׁמֶשׁ
  choice: di sebelah timur
  rationale: Ungkapan harfiahnya berkaitan dengan arah terbitnya matahari dan secara idiomatis menunjukkan sisi atau arah timur.
