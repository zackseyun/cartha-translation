  yaml_path: translation/ot/judges/020/014.yaml
  text: And the sons of Benjamin gathered from the cities to Gibeah to go out to battle against the sons of Israel[a][b].
translation:
  language: id
  text: Lalu orang-orang Benyamin berkumpul dari kota-kota ke Gibea untuk maju berperang melawan orang-orang Israel.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dengan orang-orang Israel”; dalam konteks pertempuran ini, maksudnya ialah “melawan orang-orang Israel”.
    reason: lexical_alternative
  - marker: b
    text: Atau “keturunan Benyamin ... melawan keturunan Israel”. Bahasa Ibrani secara harfiah memakai ungkapan kekerabatan, “anak-anak Benyamin” dan “anak-anak Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסְפוּ
  choice: berkumpul
  rationale: Bentuk Nifal wayyiqtol dari אסף menyatakan tindakan berhimpun; “berkumpul” alami dalam bahasa Indonesia dan cukup mempertahankan nuansa bahwa mereka datang bersama-sama.
- source_word: בְנֵי בִנְיָמִן
  choice: keturunan Benyamin
  rationale: Ungkapan ini mempertahankan idiom kekerabatan dan identitas suku dalam bahasa Ibrani, tetapi terdengar lebih alami daripada terjemahan harfiah “anak-anak Benyamin” dalam bahasa Indonesia modern.
- source_word: מִן הֶעָרִים
  choice: dari kota-kota
  rationale: Preposisi מִן menyatakan asal, sedangkan bentuk jamak הֶעָרִים menunjuk pada berbagai pusat permukiman.
- source_word: הַגִּבְעָתָה
  choice: ke Gibea
  rationale: Akhiran ה arah pada nama tempat menyatakan gerak menuju Gibea; “ke Gibea” merupakan padanan Indonesia yang langsung dan wajar.
- source_word: לָצֵאת לַמִּלְחָמָה
  choice: untuk maju berperang
  rationale: Secara harfiah berarti “untuk keluar menuju peperangan”; dalam konteks militer, “maju berperang” menyampaikan idiom tersebut secara alami tanpa menambahkan rincian yang tidak ada dalam teks.
- source_word: עִם בְּנֵי יִשְׂרָאֵל
  choice: melawan keturunan Israel
  rationale: Walaupun עִם biasanya berarti “dengan”, dalam konteks pertempuran kata itu memiliki daya adversatif, yaitu “melawan”. “Keturunan Israel” mempertahankan kesejajaran dengan ungkapan kesukuan sebelumnya.
