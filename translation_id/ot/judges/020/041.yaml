  text: וְ/אִ֤ישׁ יִשְׂרָאֵל֙ הָפַ֔ךְ וַ/יִּבָּהֵ֖ל אִ֣ישׁ בִּנְיָמִ֑ן כִּ֣י רָאָ֔ה כִּֽי נָגְעָ֥ה עָלָ֖י/ו הָ/רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/041.yaml
  text: Then the men of Israel turned[a], and the men of Benjamin were terrified, because they saw that disaster had come upon them.
translation:
  language: id
  text: Lalu orang-orang Israel berbalik[a], dan orang-orang Benyamin menjadi gentar, karena mereka melihat bahwa malapetaka telah menimpa mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, ungkapan “orang Israel,” “orang Benyamin,” “ia melihat,” dan “menimpa dia” berbentuk tunggal, tetapi di sini dipakai secara kolektif untuk kedua pasukan; karena itu diterjemahkan dalam bentuk jamak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִישׁ יִשְׂרָאֵל
  choice: Lalu orang-orang Israel
  rationale: אִישׁ berbentuk tunggal tetapi dipakai secara kolektif bagi pasukan Israel. 'Lalu' menyampaikan urutan narasi dari וְ secara wajar.
- source_word: הָפַךְ
  choice: berbalik
  rationale: Kata ini menggambarkan gerakan berbalik secara taktis dalam pertempuran; 'berbalik' dekat dengan bentuk sumber tanpa menambahkan arah yang tidak dinyatakan.
- source_word: וַ/יִּבָּהֵל
  choice: menjadi gentar
  rationale: בהל menyatakan ketakutan atau kepanikan yang mendadak. 'Menjadi gentar' alami dan bermartabat serta mempertahankan perubahan keadaan.
- source_word: אִישׁ בִּנְיָמִן
  choice: orang-orang Benyamin
  rationale: Bentuk tunggal berfungsi kolektif untuk pasukan Benyamin sehingga diterjemahkan dengan bentuk jamak yang alami dalam bahasa Indonesia.
- source_word: כִּי רָאָה
  choice: karena mereka melihat
  rationale: כִּי menyatakan sebab, sedangkan verba tunggal merujuk secara kolektif kepada orang-orang Benyamin.
- source_word: כִּי
  choice: bahwa
  rationale: כִּי yang kedua memperkenalkan isi dari apa yang mereka lihat.
- source_word: נָגְעָה עָלָיו
  choice: telah menimpa mereka
  rationale: Ungkapan נגע על dalam konteks ini berarti bencana telah mencapai atau mendatangi seseorang. 'Menimpa' merupakan padanan Indonesia yang idiomatis dan cukup dekat dengan citra sumber; sufiks tunggal dipahami secara kolektif.
- source_word: הָרָעָה
  choice: malapetaka
  rationale: Di sini רָעָה menunjuk pada bencana atau kehancuran dalam pertempuran, bukan kejahatan moral. 'Malapetaka' menyampaikan bobot ancamannya.
