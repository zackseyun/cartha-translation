  text: Then all the people rose up as one man, saying, “Not one of us will go to his tent, and not one of us will turn aside to his house.”
translation:
  language: id
  text: Lalu seluruh rakyat bangkit sebagai satu orang dan berkata, “Tidak seorang pun di antara kita akan pergi ke kemahnya, dan tidak seorang pun akan berbelok ke rumahnya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּאִישׁ אֶחָד
  choice: serentak
  rationale: Ungkapan harfiah ‘seperti satu orang’ menyatakan kesatuan tindakan seluruh rakyat; ‘serentak’ menyampaikannya secara alami dalam bahasa Indonesia modern.
- source_word: נֵלֵךְ
  choice: akan pergi
  rationale: Bentuk imperfek dalam pernyataan keputusan bersama paling wajar diterjemahkan sebagai tindakan yang tidak akan mereka lakukan.
- source_word: נָסוּר
  choice: akan pulang
  rationale: Dalam pasangan dengan ‘ke rumahnya’, verba yang secara harfiah berarti ‘berbelok/menyimpang’ menunjuk pada beralih dari pertemuan untuk kembali ke rumah; ‘pulang’ menyampaikan maksud kontekstual secara alami.
- source_word: אֹהֳלוֹ / בֵּיתוֹ
  choice: kemahnya / rumahnya
  rationale: Perbedaan leksikal antara ‘kemah’ dan ‘rumah’ dipertahankan sebagaimana dalam teks Ibrani.
