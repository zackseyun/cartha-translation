  text: וַ/יָּבֹאוּ֩ מִ/נֶּ֨גֶד לַ/גִּבְעָ֜ה עֲשֶׂרֶת֩ אֲלָפִ֨ים אִ֤ישׁ בָּחוּר֙ מִ/כָּל יִשְׂרָאֵ֔ל וְ/הַ/מִּלְחָמָ֖ה כָּבֵ֑דָה וְ/הֵם֙ לֹ֣א יָדְע֔וּ כִּֽי נֹגַ֥עַת עֲלֵי/הֶ֖ם הָ/רָעָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/034.yaml
  text: Then ten thousand chosen men from all Israel came against Gibeah[a], and the battle was fierce; but they did not know that disaster was closing in on them.
translation:
  language: id
  text: Kemudian sepuluh ribu prajurit pilihan dari seluruh Israel datang menyerang Gibea. Pertempuran itu sengit, tetapi mereka tidak tahu bahwa malapetaka sedang mendekati mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “malapetaka sedang menyentuh atau menjangkau mereka”; dapat juga diterjemahkan, “malapetaka sedang menimpa mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנֶּגֶד לַגִּבְעָה
  choice: datang menyerang Gibea
  rationale: מִנֶּגֶד secara dasar berarti berada di depan atau berhadapan dengan, tetapi dalam konteks pertempuran frasa ini menunjukkan gerakan bermusuhan terhadap Gibea. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan daya adversatif konteks.
- source_word: עֲשֶׂרֶת אֲלָפִים אִישׁ בָּחוּר
  choice: sepuluh ribu prajurit pilihan
  rationale: אִישׁ dipakai secara kolektif sesudah bilangan, sedangkan בָּחוּר di sini menunjuk kepada orang-orang yang dipilih untuk bertempur. 'Prajurit pilihan' menyampaikan fungsi militer mereka dengan ringkas.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: dari seluruh Israel
  rationale: Frasa ini menyatakan bahwa pasukan tersebut dihimpun dari segenap Israel.
- source_word: וְהַמִּלְחָמָה כָּבֵדָה
  choice: Pertempuran itu sengit
  rationale: כָּבֵדָה dalam konstruksi ini menggambarkan berat atau hebatnya pertempuran, bukan bobot fisik. 'Sengit' merupakan padanan Indonesia yang jelas dan wajar.
- source_word: וְהֵם לֹא יָדְעוּ
  choice: tetapi mereka tidak tahu
  rationale: Kata sambung וְ dapat menyatakan kelanjutan maupun kontras. 'Tetapi' memperjelas kontras antara sengitnya pertempuran dan ketidaktahuan mereka akan malapetaka yang mendekat tanpa menentukan rujukan pronomina lebih jauh daripada teks Ibrani.
- source_word: כִּי נֹגַעַת עֲלֵיהֶם הָרָעָה
  choice: bahwa malapetaka sedang mendekati mereka
  rationale: הָרָעָה di sini berarti bencana atau malapetaka, bukan kejahatan moral. Partisipel נֹגַעַת secara harfiah berarti 'menyentuh/menjangkau' dan dalam konteks ini menggambarkan malapetaka yang sudah mendekat. Terjemahan utama memakai ungkapan Indonesia yang alami, sementara gambaran harfiahnya dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Pronomina 'mereka' dipertahankan tanpa menambahkan 'orang Benyamin' agar ambiguitas rujukan dalam bentuk ayat ini tidak diselesaikan secara diam-diam.
