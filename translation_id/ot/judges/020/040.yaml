base_translation:
  language: en
  yaml_path: translation/ot/judges/020/040.yaml
  text: But the signal began to rise from the city as a pillar of smoke[a], and Benjamin turned behind him, and behold[c][b], the whole city was going up to the heavens.
translation:
  language: id
  text: Isyarat itu mulai membubung dari kota sebagai tiang asap[a]. Orang-orang Benyamin menoleh ke belakang[b], dan lihatlah, seluruh kota itu membubung ke langit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “suar itu mulai membubung dari kota sebagai tiang asap.” Kata Ibrani yang dipakai dapat menunjuk pada sesuatu yang dinaikkan dan di sini tampaknya merujuk pada isyarat pertempuran yang telah disepakati.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “Benyamin berpaling ke belakangnya.” Ini dapat berarti bahwa orang-orang Benyamin berbalik atau menoleh untuk melihat ke belakang.
    reason: lexical_alternative
  - marker: c
    text: Atau “seluruh kota itu naik ke langit,” yakni dalam kobaran api dan asap.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּשְׂאֵת
  choice: isyarat
  rationale: Dalam konteks penyergapan ini, nomina tersebut menunjuk pada tanda yang telah disepakati. “Isyarat” menyampaikan fungsi komunikatifnya secara alami tanpa menentukan lebih jauh bentuk bendanya.
- source_word: הֵחֵלָּה לַעֲלוֹת
  choice: mulai membubung
  rationale: Gabungan verba ini menyatakan awal gerak ke atas. “Mulai membubung” wajar untuk asap dan mempertahankan gambaran visualnya.
- source_word: עַמּוּד עָשָׁן
  choice: tiang asap
  rationale: Ungkapan ini menggambarkan kepulan asap yang tegak seperti tiang; “tiang asap” akurat, ringkas, dan lazim dalam bahasa Indonesia Alkitabiah yang tetap mudah dipahami.
- source_word: וַיִּפֶן בִּנְיָמִן אַחֲרָיו
  choice: Orang-orang Benyamin menoleh ke belakang
  rationale: “Benyamin” dipakai secara kolektif untuk suku atau pasukannya. “Menoleh ke belakang” mempertahankan tindakan berbalik untuk melihat tanpa memaksakan bahwa mereka sepenuhnya berbalik arah.
- source_word: וְהִנֵּה
  choice: dan lihatlah
  rationale: Penanda wacana ini mengungkapkan penemuan yang mendadak dan dramatis. “Lihatlah” mempertahankan daya serunya dalam bahasa Indonesia modern yang bermartabat.
- source_word: עָלָה
  choice: membubung
  rationale: Dengan kota sebagai subjek dan arah menuju langit, verba ini melukiskan kota yang tampak naik melalui api dan asap. “Membubung” mempertahankan citra gerak ke atas tanpa menambahkan kata “terbakar” ke teks utama.
- source_word: כְלִיל הָעִיר
  choice: seluruh kota itu
  rationale: כְלִיל menyatakan keseluruhan atau totalitas. “Seluruh kota itu” merupakan padanan Indonesia yang alami dan jelas.
- source_word: הַשָּׁמָיְמָה
  choice: ke langit
  rationale: Akhiran penunjuk arah menyatakan gerak menuju langit. Bahasa Indonesia secara alami memakai bentuk tunggal “langit” untuk citra ini.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Orang-orang Benyamin” menjelaskan pemakaian nama suku secara kolektif, sedangkan “lihatlah” mempertahankan kejutan naratif. Gambaran kota yang “membubung ke langit” sengaja dipertahankan dalam teks utama, dengan makna kebakaran dijelaskan dalam catatan kaki agar metafora sumber tidak diratakan.
