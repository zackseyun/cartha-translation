revisions:
- from: Lalu mereka berbalik dari hadapan pasukan Israel menuju jalan ke padang gurun,[a] tetapi pertempuran itu menyusul mereka;[b] dan orang-orang yang datang dari kota-kota membinasakan mereka dari tengah-tengah mereka.[c]
  to: Lalu mereka berbalik dari hadapan pasukan Israel[a] menuju jalan ke padang gurun, tetapi pertempuran itu menyusul mereka;[b] dan orang-orang dari kota-kota membinasakan mereka di tengah-tengah mereka.[c]
  rationale: Revisi membetulkan preposisi bagi בְּתוֹכוֹ dari “dari” menjadi “di,” sehingga relasi lokasi dalam Ibrani tidak berubah menjadi gerak keluar. Frasa subjek terakhir juga dibuat lebih dekat dengan konstruksi eliptis Ibrani tanpa mengidentifikasi mereka secara berlebihan dalam teks utama. Penanda [a] dipindahkan agar langsung melekat pada frasa yang dijelaskan.
