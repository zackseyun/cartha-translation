  terminology: “Pasukan Israel,” “padang gurun,” “pertempuran,” dan “membinasakan” sesuai dengan register militer-naratif. Istilah “pasukan Benyamin” dalam catatan kaki merupakan penjelasan kontekstual yang layak, bukan penambahan pada teks utama.
