base_translation:
  language: en
  yaml_path: translation/ot/judges/020/042.yaml
  text: So they turned before the men of Israel toward the way of the wilderness[a], but the battle overtook them[c][b]; and those from the cities were destroying them in their midst.
translation:
  language: id
  text: Lalu mereka berbalik dari hadapan pasukan Israel[a] menuju jalan ke padang gurun, tetapi pertempuran itu menyusul mereka;[b] dan orang-orang dari kota-kota membinasakan mereka di tengah-tengah mereka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di hadapan pasukan Israel”; dalam konteks ini ungkapan itu dapat dipahami sebagai “dari hadapan pasukan Israel”, yakni mundur menjauhi mereka.
    reason: lexical_alternative
  - marker: b
    text: Atau, “pertempuran itu mengejar dan mencapai mereka.”
    reason: lexical_alternative
  - marker: c
    text: Klausa terakhir dalam bahasa Ibrani sangat padat dan sulit. Kemungkinan besar yang dimaksud ialah pasukan Israel yang keluar dari kota-kota atau dari tempat-tempat penyergapan lalu membinasakan pasukan Benyamin di tengah-tengah formasi mereka.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: mereka berbalik
  rationale: Mempertahankan arti dasar פנה, yaitu berbalik; dalam konteks pertempuran, tindakan ini menyiratkan mundur tanpa mengubahnya secara eksplisit menjadi 'melarikan diri'.
- source_word: לִפְנֵי אִישׁ יִשְׂרָאֵל
  choice: dari hadapan pasukan Israel
  rationale: לִפְנֵי secara harfiah berarti 'di hadapan', tetapi bersama verba gerak dalam konteks ini wajar dipahami sebagai gerakan menjauh 'dari hadapan'. 'Pasukan Israel' menyampaikan acuan kolektif-militer אִישׁ יִשְׂרָאֵל dengan bahasa Indonesia yang alami.
- source_word: אֶל דֶּרֶךְ הַמִּדְבָּר
  choice: menuju jalan ke padang gurun
  rationale: Menyampaikan דֶּרֶךְ sebagai 'jalan' dan relasi tujuannya dengan padang gurun secara alami dalam bahasa Indonesia.
- source_word: וְהַמִּלְחָמָה הִדְבִּיקָתְהוּ
  choice: tetapi pertempuran itu menyusul mereka
  rationale: Bentuk kausatif דבק menggambarkan pertempuran yang mengejar lalu mencapai pasukan Benyamin. 'Tetapi' memperjelas pertentangan konteks, sedangkan objek jamak mengikuti acuan kolektifnya.
- source_word: וַאֲשֶׁר מֵהֶעָרִים
  choice: dan orang-orang yang datang dari kota-kota
  rationale: Konstruksi Ibrani ini eliptis. Terjemahan tetap mempertahankan ketidakpastian identitas dan asal mereka, tanpa memasukkan 'pasukan penyergap' ke dalam teks utama.
- source_word: מַשְׁחִיתִים אֹתוֹ
  choice: membinasakan mereka
  rationale: Partisip שׁחת dalam konteks militer menyatakan tindakan membunuh atau memusnahkan. Pronomina tunggal Ibrani dipahami secara kolektif dan secara alami diterjemahkan dengan bentuk jamak.
- source_word: בְּתוֹכוֹ
  choice: dari tengah-tengah mereka
  rationale: Akhiran tunggal mengacu secara kolektif kepada pasukan Benyamin. 'Dari tengah-tengah mereka' mempertahankan gambaran serangan yang berlangsung di bagian dalam formasi mereka.
