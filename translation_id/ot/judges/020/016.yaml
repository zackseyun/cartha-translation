lexical_decisions:
- source_word: מִכֹּל הָעָם הַזֶּה
  choice: Dari seluruh rakyat itu
  rationale: Menjaga makna partitif ‘dari antara seluruh rakyat itu’; ‘rakyat’ tidak mempersempit עָם menjadi pasukan, meskipun konteksnya militer.
- source_word: שְׁבַע מֵאוֹת אִישׁ בָּחוּר
  choice: ada tujuh ratus orang pilihan
  rationale: אִישׁ adalah kata penghitung bagi laki-laki dewasa, sedangkan בָּחוּר menunjukkan bahwa mereka adalah orang-orang terpilih atau pilihan.
- source_word: אִטֵּר יַד יְמִינוֹ
  choice: yang kidal[a]
  rationale: Ungkapan Ibrani secara harfiah menggambarkan tangan kanan yang terhambat atau terbatas. Dalam konteks kemampuan tempur, ‘kidal’ menyampaikan implikasi idiom itu secara alami, sementara bentuk harfiahnya dipertahankan dalam catatan kaki.
- source_word: כָּל זֶה
  choice: Masing-masing
  rationale: 'Menangkap daya distributif ungkapan tersebut: kemampuan itu dimiliki setiap orang dari ketujuh ratus orang itu.'
- source_word: קֹלֵעַ בָּאֶבֶן
  choice: dapat melontarkan batu dengan umban
  rationale: Partisipel menyatakan kecakapan yang menjadi ciri mereka, bukan tindakan yang hanya sedang berlangsung; penyebutan ‘umban’ memperjelas cara melontarkan batu.
- source_word: אֶל הַשַּׂעֲרָה
  choice: ke arah sehelai rambut
  rationale: Mempertahankan gambaran konkret tentang sasaran yang sangat kecil tanpa menggantinya dengan ungkapan abstrak seperti ‘setepat rambut’.
- source_word: וְלֹא יַחֲטִא
  choice: tanpa meleset
  rationale: Dalam konteks membidik, חטא berarti gagal mengenai sasaran, bukan ‘berbuat dosa’.
