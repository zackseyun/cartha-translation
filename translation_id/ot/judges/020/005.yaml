  verdict: approve
  source_fidelity: 'Terjemahan dengan setia mencerminkan unsur-unsur Ibrani: permusuhan penduduk/lelaki Gibeah terhadap penutur, pengepungan rumah pada malam hari, niat membunuh, penganiayaan seksual terhadap gundik, dan kematiannya dalam urutan naratif. “Lalu ia mati” tidak memaksakan hubungan kausal yang lebih eksplisit daripada teks Ibrani.'
