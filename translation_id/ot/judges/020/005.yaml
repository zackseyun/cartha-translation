  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּקֻ֤מוּ עָלַ/י֙ בַּעֲלֵ֣י הַ/גִּבְעָ֔ה וַ/יָּסֹ֧בּוּ עָלַ֛/י אֶת הַ/בַּ֖יִת לָ֑יְלָה אוֹתִ/י֙ דִּמּ֣וּ לַ/הֲרֹ֔ג וְ/אֶת פִּילַגְשִׁ֥/י עִנּ֖וּ וַ/תָּמֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/005.yaml
  text: Then the men of Gibeah rose up against me and surrounded the house at night[a]. They intended to kill me, and they violated my concubine[b], and she died.
translation:
  language: id
  text: Lalu orang-orang Gibeah bangkit melawan aku dan mengepung rumah itu pada malam hari. Mereka berniat membunuh aku, dan mereka menodai gundikku[a], lalu ia mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “memerkosa gundikku.” Kata kerja Ibrani dapat berarti mempermalukan atau memperlakukan dengan kejam; dalam konteks ini yang dimaksud adalah kekerasan seksual.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲלֵי הַגִּבְעָה
  choice: orang-orang Gibeah
  rationale: Ungkapan ini secara idiomatis menunjuk kepada para lelaki atau penduduk laki-laki Gibeah, bukan para bangsawan atau pemilik kota.
- source_word: וַיָּקֻמוּ עָלַי
  choice: bangkit melawan aku
  rationale: Mempertahankan gambaran verba Ibrani sekaligus menyampaikan sikap permusuhan dengan jelas.
- source_word: וַיָּסֹבּוּ עָלַי אֶת־הַבַּיִת
  choice: mengepung rumah itu
  rationale: Bentuk Ibrani menyatakan bahwa mereka mengelilingi rumah tempat si pembicara berada; bahasa Indonesia tidak perlu mengulang 'di sekelilingku'.
- source_word: לָיְלָה
  choice: pada malam hari
  rationale: Menyatakan waktu terjadinya tindakan secara alami dalam bahasa Indonesia modern.
- source_word: אֹתִי דִּמּוּ לַהֲרֹג
  choice: mereka berniat membunuh aku
  rationale: Dalam konteks ini דמה menyatakan maksud atau niat; terjemahan ini jelas tanpa mempersempitnya menjadi rencana yang sudah terperinci.
- source_word: פִּילַגְשִׁי
  choice: gundikku
  rationale: '''Gundik'' merupakan istilah Indonesia yang lazim untuk פילגש dalam konteks sosial-historis ini, meskipun statusnya tidak sepenuhnya sepadan dengan kategori perkawinan modern.'
- source_word: עִנּוּ
  choice: menodai
  rationale: Dalam konteks narasi, bentuk piel dari ענה menunjuk pada penghinaan dan pelanggaran seksual. 'Menodai' mempertahankan keluasan leksikal, sedangkan catatan kaki menjelaskan makna kontekstualnya.
- source_word: וַתָּמֹת
  choice: lalu ia mati
  rationale: Menyampaikan urutan naratif waw-konsekutif tanpa menambahkan hubungan tujuan atau sebab yang tidak dinyatakan secara gramatikal.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Bentuk 'aku' dipertahankan karena ayat ini merupakan kesaksian langsung. Kekerasan seksual dinyatakan dengan bahasa terukur, sementara catatan kaki membuat makna konteksnya tegas.
