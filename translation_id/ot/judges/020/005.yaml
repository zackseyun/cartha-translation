  terminology: “Orang-orang Gibeah” merupakan padanan idiomatis yang aman untuk בַּעֲלֵי הַגִּבְעָה. “Gundikku” tepat untuk פִּילַגְשִׁי dalam konteks historis. “Menodai” mempertahankan keluasan עִנּוּ, sementara catatan kaki secara tepat menjelaskan bahwa konteksnya menunjuk pada kekerasan seksual tanpa mengaburkan makna.
