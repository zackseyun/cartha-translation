  naturalness: Bahasa draf umumnya baku dan jelas. Susunan “Kejahatan apakah ini yang telah terjadi di antara kalian?” lebih alami dan secara jelas mengaitkan “ini” dengan “kejahatan”, bukan dengan “kalian”.
