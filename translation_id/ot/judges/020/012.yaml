base_translation:
  language: en
  yaml_path: translation/ot/judges/020/012.yaml
  text: So the tribes of Israel sent men through all the tribes of Benjamin[a], saying[b], “What is this evil that has happened among you?”
translation:
  language: id
  text: Lalu suku-suku Israel mengutus beberapa orang ke semua kelompok suku Benyamin[a] untuk berkata, “Kejahatan apakah ini yang telah terjadi di antara kalian?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “di antara semua kelompok suku Benyamin” atau “di seluruh kelompok suku Benyamin.” Teks Ibrani secara harfiah memakai bentuk jamak, “suku-suku Benyamin,” dan preposisinya dapat dipahami secara distributif.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “perbuatan jahat” atau “kesalahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: mengutus
  rationale: Kata kerja שלח berarti menyuruh atau mengirim seseorang; “mengutus” wajar untuk orang-orang yang membawa pertanyaan resmi.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: suku-suku Israel
  rationale: Frasa konstruksi jamak ini menunjuk pada suku-suku Israel sebagai pelaku kolektif.
- source_word: אֲנָשִׁים
  choice: beberapa orang
  rationale: Teks Ibrani secara harfiah menyebut “orang-orang” tanpa secara khusus menamai mereka utusan atau wakil.
- source_word: בְּכָל שִׁבְטֵי בִנְיָמִן
  choice: ke seluruh suku Benyamin
  rationale: Preposisi ב dapat menyatakan arah atau penyebaran kepada seluruh kelompok yang disebut. Bentuk jamak “suku-suku” dalam bahasa Ibrani tidak ditiru secara kaku karena Benyamin merupakan satu suku; ketegangan tersebut dicatat dalam catatan kaki.
- source_word: לֵאמֹר
  choice: untuk berkata
  rationale: Infinitif ini memperkenalkan perkataan langsung; terjemahan tersebut mempertahankan bentuk ujaran dalam sumber.
- source_word: מָה
  choice: apakah
  rationale: Dalam susunan “Kejahatan apakah ... ini?”, bentuk ini menanyakan identitas atau sifat perbuatan, bukan penyebabnya.
- source_word: הָרָעָה הַזֹּאת
  choice: Kejahatan ... ini
  rationale: רָעָה di sini menunjuk pada perbuatan yang secara moral jahat. Unsur penunjuk הַזֹּאת dipertahankan dengan “ini”.
- source_word: אֲשֶׁר נִהְיְתָה
  choice: yang telah terjadi
  rationale: Bentuk Niphal dari היה menyatakan sesuatu yang terjadi atau berlangsung.
- source_word: בָּכֶם
  choice: di antara kalian
  rationale: Ungkapan ini menunjukkan bahwa kejahatan tersebut terjadi dalam lingkungan komunitas Benyamin.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai karena sapaan Ibrani berbentuk jamak dan ditujukan kepada komunitas Benyamin. Susunan pertanyaan mempertahankan unsur penunjuk “ini” serta daya moral kata רָעָה tanpa memperhalusnya.
