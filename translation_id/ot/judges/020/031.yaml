source:
  edition: WLC
  text: וַ/יֵּצְא֤וּ בְנֵֽי בִנְיָמִן֙ לִ/קְרַ֣את הָ/עָ֔ם הָנְתְּק֖וּ מִן הָ/עִ֑יר וַ/יָּחֵ֡לּוּ לְ/הַכּוֹת֩ מֵ/הָ/עָ֨ם חֲלָלִ֜ים כְּ/פַ֣עַם בְּ/פַ֗עַם בַּֽ/מְסִלּוֹת֙ אֲשֶׁ֨ר אַחַ֜ת עֹלָ֣ה בֵֽית אֵ֗ל וְ/אַחַ֤ת גִּבְעָ֨תָ/ה֙ בַּ/שָּׂדֶ֔ה כִּ/שְׁלֹשִׁ֥ים אִ֖ישׁ בְּ/יִשְׂרָאֵֽל־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/031.yaml
  text: And the sons of Benjamin came out to meet the people[a], and were drawn away from the city; and they began to strike down some of the people, as at other times, on the highways, one of which goes up to Bethel and one to Gibeah in the open country[d][c][b], about thirty men of Israel.
translation:
  language: id
  text: Orang-orang Benyamin keluar menghadapi pasukan Israel[a], lalu mereka terpancing menjauh dari kota[b]. Seperti dalam pertempuran-pertempuran sebelumnya[c], mereka mulai menewaskan beberapa orang dari pasukan Israel di jalan-jalan raya—yang satu menuju Betel dan yang lain menuju Gibea melalui daerah terbuka[d]—kira-kira tiga puluh orang Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rakyat itu.” Dalam konteks ini yang dimaksud ialah pasukan Israel.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “mereka ditarik menjauh dari kota” atau “mereka terpisah dari kota.” Maksudnya, mereka keluar dari perlindungan kota.
    reason: lexical_alternative
  - marker: c
    text: Ungkapan Ibrani ini berarti “seperti pada kali-kali sebelumnya”; dalam konteks ini, seperti dalam pertempuran-pertempuran terdahulu.
    reason: idiom_explanation
  - marker: d
    text: Atau “di padang.” Frasa ini tampaknya menerangkan jalan menuju Gibea yang melintasi daerah terbuka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: keluar
  rationale: Verba naratif dasar yang menggambarkan gerakan orang Benyamin keluar dari kota menuju medan pertempuran.
- source_word: בְנֵי בִנְיָמִן
  choice: orang-orang Benyamin
  rationale: Ungkapan Ibrani harfiahnya 'anak-anak Benyamin', tetapi dalam konteks kesukuan menunjuk kepada anggota suku Benyamin; bentuk ini alami dalam bahasa Indonesia modern.
- source_word: לִקְרַאת הָעָם
  choice: menghadapi pasukan Israel
  rationale: Secara leksikal berarti 'menemui rakyat itu', tetapi dalam konteks ini הָעָם adalah pasukan Israel yang sedang berperang. 'Menghadapi' menyampaikan gerak menuju lawan tanpa menentukan lebih dari konteks.
- source_word: הָנְתְּקוּ מִן הָעִיר
  choice: sehingga mereka terpancing menjauh dari kota
  rationale: Bentuk ini menyatakan bahwa pasukan Benyamin terpisah atau ditarik menjauh dari kota. 'Terpancing' membuat siasat dalam konteks jelas, sedangkan catatan kaki mempertahankan alternatif yang lebih formal.
- source_word: וַיָּחֵלּוּ לְהַכּוֹת ... חֲלָלִים
  choice: mereka mulai menewaskan beberapa orang
  rationale: Konstruksi itu menyatakan dimulainya serangan yang menghasilkan orang-orang tewas. 'Menewaskan' alami dan menghindari ungkapan predikatif yang kaku seperti 'memukul sebagai orang tewas'.
- source_word: כְּפַעַם בְּפַעַם
  choice: seperti dalam pertempuran-pertempuran sebelumnya
  rationale: Idiom ini membandingkan kejadian tersebut dengan bentrokan terdahulu dalam pasal ini; penambahan 'pertempuran' memperjelas acuannya.
- source_word: בַּמְסִלּוֹת
  choice: di jalan-jalan raya
  rationale: מְסִלָּה menunjuk jalan utama atau jalan yang ditinggikan; 'jalan-jalan raya' mempertahankan bentuk jamak dan nuansa jalur utama.
- source_word: אַחַת עֹלָה בֵית אֵל
  choice: yang satu menuju Betel
  rationale: עלה di sini bersifat topografis, secara harfiah 'naik ke Betel'; 'menuju' terdengar alami, sementara nuansa 'naik' dicatat sebagai alternatif.
- source_word: וְאַחַת גִּבְעָתָה בַּשָּׂדֶה
  choice: yang lain menuju Gibea melalui daerah terbuka
  rationale: Frasa בַשָּׂדֶה kemungkinan menerangkan jalur ke Gibea yang melewati medan terbuka; 'melalui daerah terbuka' menyampaikan hubungan topografis tersebut sambil mempertahankan alternatif literal dalam catatan.
- source_word: כִּשְׁלֹשִׁים אִישׁ בְּיִשְׂרָאֵל
  choice: kira-kira tiga puluh orang Israel
  rationale: Terjemahan langsung dan alami untuk jumlah perkiraan korban dari pihak Israel.
