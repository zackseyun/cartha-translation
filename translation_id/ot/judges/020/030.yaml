translation:
  language: id
  text: Pada hari ketiga, orang Israel maju melawan orang Benyamin dan mengatur barisan menghadapi Gibea seperti sebelumnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: maju menyerang
  rationale: Secara dasar berarti 'naik/maju', tetapi dalam konteks pertempuran menyatakan gerak maju untuk menyerang; terjemahan ini alami dalam bahasa Indonesia dan mempertahankan arah tindakan militer.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Mempertahankan ungkapan kekerabatan Ibrani dan kesejajarannya dengan 'keturunan Benyamin', dengan bahasa Indonesia yang lebih wajar daripada 'anak-anak Israel' dalam konteks ini.
- source_word: אֶל בְּנֵי בִנְיָמִן
  choice: menyerang keturunan Benyamin
  rationale: אֶל pada konteks militer ini menunjukkan gerakan yang bermusuhan terhadap pihak lawan.
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: pada hari ketiga
  rationale: Padanan temporal langsung dan alami.
- source_word: וַיַּעַרְכוּ
  choice: mengatur barisan
  rationale: Dalam konteks militer, ערך berarti menyusun atau menempatkan pasukan dalam barisan tempur.
- source_word: אֶל הַגִּבְעָה
  choice: untuk menghadapi Gibea
  rationale: Mengungkapkan penempatan barisan tempur yang diarahkan terhadap Gibea tanpa membatasi preposisi pada arti spasial semata.
- source_word: כְּפַעַם בְּפָעַם
  choice: seperti sebelumnya
  rationale: Padanan idiomatis yang ringkas untuk tindakan yang dilakukan sebagaimana pada kesempatan-kesempatan terdahulu.
