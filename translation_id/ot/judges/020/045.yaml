base_translation:
  language: en
  yaml_path: translation/ot/judges/020/045.yaml
  text: Then they turned and fled toward the wilderness[a], to the rock of Rimmon. And they cut down five thousand men of them on the highways, and pursued them as far as Gidom[b], and struck down two thousand men of them.
translation:
  language: id
  text: 'Kemudian mereka berbalik dan melarikan diri ke arah padang gurun, menuju batu Rimon. Di jalan-jalan raya, mereka menumpas lima ribu orang dari antara mereka[a]. Mereka mengejar mereka sampai ke Gidom[b] dan menewaskan dua ribu orang dari antara mereka.


    [a] Secara harfiah, bahasa Ibrani berbunyi “mereka memungutnya,” sebuah ungkapan yang di sini berarti menumpas atau membunuh orang-orang yang tersisa dalam pelarian.


    [b] Dalam bagian ini, bahasa Ibrani memakai kata ganti tunggal (“mengejar dia” dan “dari dia”) untuk menyebut orang-orang Benyamin yang melarikan diri sebagai satu kelompok.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi “mereka memungutnya,” sebuah ungkapan yang di sini berarti menumpas atau membunuh orang-orang yang tersisa dalam pelarian.
    reason: lexical_alternative
  - marker: b
    text: Dalam bagian ini, bahasa Ibrani memakai kata ganti tunggal (“mengejar dia” dan “dari dia”) untuk menyebut orang-orang Benyamin yang melarikan diri sebagai satu kelompok.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: mereka berbalik
  rationale: Kata kerja פנה menandai perubahan arah; “berbalik” alami dalam konteks pasukan yang melarikan diri tanpa menentukan bahwa mereka kembali ke tempat semula.
- source_word: וַיָּנֻסוּ הַמִּדְבָּרָה
  choice: melarikan diri ke arah padang gurun
  rationale: נוס berarti melarikan diri, sedangkan akhiran penunjuk arah pada הַמִּדְבָּרָה menyatakan gerak menuju padang gurun.
- source_word: אֶל סֶלַע הָרִמּוֹן
  choice: menuju Batu Cadas Rimon
  rationale: סֶלַע menunjuk batu besar atau tebing batu; “Batu Cadas Rimon” mempertahankan unsur geografis sekaligus mentransliterasikan nama Rimon.
- source_word: וַיְעֹלְלֻהוּ
  choice: mereka menumpas ... dari antara mereka
  rationale: Bentuk ini secara harfiah memakai gambaran memungut sisa panen, tetapi dalam konteks pengejaran perang berarti menghabisi atau menumpas para penyintas. Metafora harfiahnya dipertahankan dalam catatan kaki.
- source_word: בַּמְסִלּוֹת
  choice: di jalan-jalan raya
  rationale: מְסִלּוֹת menunjuk jalan yang dibangun atau jalur utama; bentuk jamaknya dipertahankan.
- source_word: חֲמֵשֶׁת אֲלָפִים אִישׁ
  choice: lima ribu orang
  rationale: Terjemahan ini mempertahankan jumlah dan tidak menambahkan keterangan “prajurit” yang tidak dinyatakan secara eksplisit.
- source_word: וַיַּדְבִּיקוּ אַחֲרָיו
  choice: mereka mengejar mereka
  rationale: Hifil דבק dalam konteks ini menyatakan pengejaran yang dekat atau berlanjut. Bahasa Indonesia memakai objek jamak sesuai rujukan kolektifnya, tanpa menambahkan keterangan intensitas yang tidak eksplisit.
- source_word: עַד גִּדְעֹם
  choice: sampai ke Gidom
  rationale: עַד menandai batas tempat pengejaran, dan nama tempat גִּדְעֹם ditransliterasikan sebagai Gidom.
- source_word: וַיַּכּוּ מִמֶּנּוּ
  choice: menewaskan ... dari antara mereka
  rationale: נכה dalam konteks pertempuran berarti memukul hingga tewas atau menewaskan. מִמֶּנּוּ bersifat partitif dan berbentuk tunggal dengan rujukan kolektif; “dari antara mereka” menyampaikan maknanya secara alami.
