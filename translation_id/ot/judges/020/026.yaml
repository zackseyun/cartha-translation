  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּעֲל֣וּ כָל בְּנֵי֩ יִשְׂרָאֵ֨ל וְ/כָל הָ/עָ֜ם וַ/יָּבֹ֣אוּ בֵֽית אֵ֗ל וַ/יִּבְכּוּ֙ וַ/יֵּ֤שְׁבוּ שָׁם֙ לִ/פְנֵ֣י יְהוָ֔ה וַ/יָּצ֥וּמוּ בַ/יּוֹם הַ/ה֖וּא עַד הָ/עָ֑רֶב וַֽ/יַּעֲל֛וּ עֹל֥וֹת וּ/שְׁלָמִ֖ים לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/026.yaml
  text: Then all the sons of Israel and all the people went up and came to Bethel[a], and they wept and sat there before Yahweh and fasted that day until evening[b]. Then they offered up burnt offerings and peace offerings before Yahweh.
translation:
  language: id
  text: Kemudian seluruh bani Israel[a] dan seluruh rakyat naik dan tiba di Betel. Mereka menangis dan duduk di sana di hadapan Yahweh. Pada hari itu mereka berpuasa sampai petang. Lalu mereka mempersembahkan kurban bakaran dan kurban damai[b] di hadapan Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “seluruh orang Israel.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “kurban persekutuan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: naik
  rationale: Mempertahankan nuansa gerak ke tempat yang lebih tinggi dalam narasi perjalanan tanpa memakai ungkapan yang kaku.
- source_word: כָל בְּנֵי יִשְׂרָאֵל וְכָל הָעָם
  choice: seluruh bani Israel dan seluruh rakyat
  rationale: “Bani Israel” mempertahankan ungkapan kekerabatan-kebangsaan Ibrani, sedangkan frasa kedua tetap dipertahankan sebagai penegasan, bukan dilebur.
- source_word: בֵית אֵל
  choice: Betel
  rationale: Menggunakan bentuk baku nama tempat dalam bahasa Indonesia, bukan menerjemahkannya secara harfiah sebagai “rumah Allah”.
- source_word: וַיִּבְכּוּ
  choice: mereka menangis
  rationale: Mengungkapkan ratapan nyata dalam konteks kekalahan, puasa, dan ibadah.
- source_word: וַיֵּשְׁבוּ שָׁם לִפְנֵי יְהוָה
  choice: mereka duduk di sana di hadapan Yahweh
  rationale: Mempertahankan makna konkret ישׁב sebagai tindakan duduk, sambil tetap mengakui konteks pengabdian di hadapan Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, alih-alih menggantinya dengan gelar.
- source_word: וַיָּצוּמוּ
  choice: mereka berpuasa
  rationale: Padanan Indonesia yang langsung dan lazim bagi tindakan menahan diri dari makanan sebagai ratapan atau pengabdian.
- source_word: בַיּוֹם הַהוּא עַד הָעָרֶב
  choice: pada hari itu ... sampai petang
  rationale: Menjaga batas waktu yang dinyatakan teks dengan susunan Indonesia yang alami.
- source_word: וַיַּעֲלוּ עֹלוֹת
  choice: mereka mempersembahkan kurban bakaran
  rationale: Dalam konstruksi kurban ini, bentuk kausatif עלה berarti mempersembahkan; “kurban bakaran” adalah padanan Indonesia yang jelas bagi עֹלוֹת.
- source_word: שְׁלָמִים
  choice: kurban damai
  rationale: Mencerminkan hubungan istilah ini dengan damai atau keutuhan tanpa mempersempitnya hanya pada aspek persekutuan; alternatif dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama perjanjian יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi YHWH secara langsung; bentuk “Yahweh” menjaga statusnya sebagai nama pribadi dan bukan gelar.
- issue: Sebutan kebangsaan בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: orang Israel
  rationale: Pilihan utama mempertahankan bentuk kekerabatan kolektif bahasa Ibrani, sedangkan alternatif yang lebih idiomatis dicatat tanpa menghilangkan cakupan seluruh umat.
- issue: Makna שְׁלָמִים
  choice: kurban damai
  alternative: kurban persekutuan
  rationale: Istilah Ibrani dapat menonjolkan damai, keutuhan, dan persekutuan dalam jamuan kurban. Pilihan utama tidak mengunci makna pada satu aspek saja, dan alternatif diberikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Bani Israel” dipakai sebagai ungkapan kebangsaan-kekerabatan yang masih umum dipahami; “kurban” mengikuti ejaan baku. Pengulangan “seluruh ... dan seluruh ...” dipertahankan karena terdapat dalam teks Ibrani dan memberi penegasan.
