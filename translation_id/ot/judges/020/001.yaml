  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּצְאוּ֮ כָּל בְּנֵ֣י יִשְׂרָאֵל֒ וַ/תִּקָּהֵ֨ל הָ/עֵדָ֜ה כְּ/אִ֣ישׁ אֶחָ֗ד לְ/מִ/דָּן֙ וְ/עַד בְּאֵ֣ר שֶׁ֔בַע וְ/אֶ֖רֶץ הַ/גִּלְעָ֑ד אֶל יְהוָ֖ה הַ/מִּצְפָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/001.yaml
  text: Then all the sons of Israel came out[a], and the congregation assembled as one man, from Dan to Beer-sheba, and from the land of Gilead[c][b], to Yahweh at Mizpah.
translation:
  language: id
  text: Lalu seluruh bani Israel keluar[a], dan umat itu berkumpul seperti satu orang[b], dari Dan sampai Bersyeba dan dari tanah Gilead, menghadap Yahweh di Mizpa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “semua anak lelaki Israel”; ungkapan Ibrani ini menunjuk umat atau suku-suku Israel secara keseluruhan, bukan hanya individu laki-laki.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani “seperti satu orang” berarti bahwa mereka bersatu dalam sikap dan tindakan.
    reason: lexical_alternative
  - marker: c
    text: Atau, “di hadapan Yahweh di Mizpa.” Susunan Ibraninya dapat dipahami sebagai umat yang berkumpul di hadirat Yahweh di Mizpa.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: keluar
  rationale: Kata kerja יצא berarti ‘keluar’ atau ‘pergi keluar’. Bentuk ringkas ‘keluar’ mempertahankan gambaran suku-suku yang bergerak untuk berkumpul tanpa menetapkan arah secara berlebihan.
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: seluruh bani Israel
  rationale: Ungkapan ‘bani Israel’ lazim dan bermartabat dalam bahasa Indonesia untuk sebutan korporat keturunan atau umat Israel, sekaligus mempertahankan jejak harfiah ‘anak-anak lelaki Israel’ tanpa menyiratkan bahwa hanya laki-laki yang dimaksud.
- source_word: וַתִּקָּהֵל הָעֵדָה
  choice: umat itu berkumpul
  rationale: עֵדָה menunjuk komunitas atau himpunan Israel. ‘Umat’ alami dalam konteks ini dan tidak memaksakan makna ibadah pada pertemuan tersebut; kata kerjanya diterjemahkan langsung sebagai ‘berkumpul’.
- source_word: כְּאִישׁ אֶחָד
  choice: seperti satu orang
  rationale: Terjemahan ini mempertahankan idiom Ibrani dan menyampaikan kesatuan sikap serta tindakan mereka. Catatan kaki menjelaskan daya idiomatisnya.
- source_word: לְמִדָּן וְעַד בְּאֵר שֶׁבַע
  choice: dari Dan sampai Bersyeba
  rationale: Ungkapan geografis ini merangkum bentang wilayah Israel dari utara ke selatan. ‘Sampai’ secara alami mewakili וְעַד.
- source_word: וְאֶרֶץ הַגִּלְעָד
  choice: dan dari tanah Gilead
  rationale: Pengulangan ‘dari’ memperjelas bahwa wilayah Gilead di seberang Yordan turut terwakili, meskipun preposisi itu tersirat dalam susunan Ibrani.
- source_word: אֶל יְהוָה
  choice: menghadap Yahweh
  rationale: אֶל secara dasar berarti ‘kepada/menuju’, tetapi dalam konteks sidang di tempat tertentu ungkapan ini dapat menyatakan berkumpul di hadapan Yahweh. ‘Menghadap Yahweh’ alami dalam bahasa Indonesia sambil mempertahankan orientasi pertemuan kepada-Nya.
- source_word: הַמִּצְפָּה
  choice: di Mizpa
  rationale: Nama tempat ditransliterasikan sebagai ‘Mizpa’, bentuk yang lazim dalam Alkitab bahasa Indonesia. ‘Di’ menjelaskan lokasi sidang, sedangkan hubungan sintaksisnya dengan אֶל יְהוָה dijaga melalui catatan alternatif.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama perjanjian dan mengikuti lapisan konsultasi yang telah diaudit, tanpa menggantinya dengan gelar.
- issue: Bahasa maskulin korporat dalam בְּנֵי יִשְׂרָאֵל dan כְּאִישׁ אֶחָד
  choice: bani Israel; seperti satu orang
  alternative: seluruh orang Israel; dengan sehati
  rationale: Pilihan utama mempertahankan bentuk dan citra bahasa sumber. Catatan kaki menerangkan bahwa yang pertama bersifat korporat dan yang kedua merupakan idiom kesatuan, sehingga cakupan dan maknanya tidak disalahpahami.
- issue: Hubungan אֶל יְהוָה dengan lokasi Mizpa
  choice: menghadap Yahweh di Mizpa
  alternative: kepada Yahweh, ke Mizpa; di hadapan Yahweh di Mizpa
  rationale: Susunan Ibrani dapat dipahami sebagai gerakan kepada Yahweh atau sebagai sidang di hadirat-Nya di Mizpa. Teks utama memakai ungkapan Indonesia yang wajar, sedangkan catatan mempertahankan kemungkinan pembacaan ‘di hadapan’.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Bani Israel’ dipertahankan karena dikenal luas serta menjaga warna ungkapan sumber; ‘umat’ menghindari kesan bahwa pertemuan ini semata-mata ibadah. Ejaan nama tempat memakai bentuk Indonesia ‘Bersyeba’ dan ‘Mizpa’. Semua penanda catatan kaki ditempatkan langsung pada unsur yang diterangkan.
