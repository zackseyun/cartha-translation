source:
  edition: WLC
  text: וַ/יִּגֹּ֨ף יְהוָ֥ה אֶֽת בִּנְיָמִן֮ לִ/פְנֵ֣י יִשְׂרָאֵל֒ וַ/יַּשְׁחִיתוּ֩ בְנֵ֨י יִשְׂרָאֵ֤ל בְּ/בִנְיָמִן֙ בַּ/יּ֣וֹם הַ/ה֔וּא עֶשְׂרִ֨ים וַ/חֲמִשָּׁ֥ה אֶ֛לֶף וּ/מֵאָ֖ה אִ֑ישׁ כָּל אֵ֖לֶּה שֹׁ֥לֵף חָֽרֶב׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/035.yaml
  text: And Yahweh struck Benjamin down before Israel[a], and the sons of Israel destroyed twenty-five thousand one hundred men of Benjamin that day[b], all these drawing the sword.
translation:
  language: id
  text: Yahweh mengalahkan suku Benyamin di hadapan Israel[a]. Pada hari itu orang Israel membinasakan 25.100 laki-laki dari suku Benyamin[b]; semuanya adalah orang yang menghunus pedang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “memukul kalah suku Benyamin di hadapan Israel.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “anak-anak Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגֹּף
  choice: mengalahkan
  rationale: Dalam konteks peperangan, נָגַף menyatakan tindakan memukul hingga kalah. 'Mengalahkan' alami dalam bahasa Indonesia dan tetap menunjukkan bahwa Yahweh menentukan hasil pertempuran.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: di hadapan Israel
  rationale: Mempertahankan idiom Ibrani yang dalam konteks ini berarti di depan atau ketika berhadapan dengan Israel.
- source_word: וַיַּשְׁחִיתוּ
  choice: membinasakan
  rationale: Bentuk Hifil dari שׁחת menyatakan penghancuran yang mematikan dalam laporan pertempuran; 'membinasakan' mempertahankan kekuatan maknanya.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan harfiah 'anak-anak Israel' secara idiomatis menunjuk kepada orang Israel; konteks dan אִישׁ kemudian memperjelas bahwa korban yang dihitung ialah laki-laki petempur.
- source_word: בְּבִנְיָמִן
  choice: dari suku Benyamin
  rationale: Preposisi ב menandai kelompok asal para korban; 'dari suku Benyamin' jelas dan alami dalam bahasa Indonesia.
- source_word: עֶשְׂרִים וַחֲמִשָּׁה אֶלֶף וּמֵאָה אִישׁ
  choice: 25.100 laki-laki
  rationale: Menyampaikan jumlah secara langsung dan menerjemahkan אִישׁ sebagai laki-laki dalam konteks pasukan.
- source_word: כָּל אֵלֶּה
  choice: semuanya
  rationale: Merujuk kembali kepada seluruh 25.100 laki-laki yang baru disebutkan.
- source_word: שֹׁלֵף חָרֶב
  choice: orang yang menghunus pedang
  rationale: Mempertahankan gambaran harfiah idiom militer Ibrani dan sekaligus menunjukkan bahwa mereka adalah petempur bersenjata.
theological_decisions:
- issue: Pelaku dan sebab kemenangan dalam pertempuran
  choice: Yahweh mengalahkan suku Benyamin, sedangkan orang Israel membinasakan para petempurnya.
  alternative: Menonjolkan hanya tindakan ilahi atau hanya tindakan militer manusia.
  rationale: Teks Ibrani menyandingkan tindakan Yahweh dan tindakan orang Israel tanpa meleburkan keduanya; terjemahan mempertahankan kedua pelaku serta ketegangan antara kedaulatan ilahi dan tindakan manusia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Suku Benyamin' dipakai untuk memperjelas bahwa Benyamin di sini adalah kelompok kesukuan, sedangkan 'menghunus pedang' mempertahankan citra militer teks sumber.
