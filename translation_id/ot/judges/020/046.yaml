  text: So all who fell from Benjamin that day were twenty-five thousand men who drew the sword[a]; all these were men of valor.
translation:
  language: id
  text: Maka, jumlah semua orang dari suku Benyamin yang gugur pada hari itu adalah dua puluh lima ribu orang yang menghunus pedang; mereka semua adalah pejuang yang gagah perkasa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כָל הַנֹּפְלִים
  choice: Maka, jumlah semua ... yang gugur ... adalah
  rationale: Bentuk naratif וַיְהִי memperkenalkan ringkasan hasil pertempuran. Susunan dengan 'jumlah ... adalah' menyampaikan idiom Ibrani secara alami dalam bahasa Indonesia, sementara 'yang gugur' mempertahankan daya verbal partisipel נפל sebagai korban tewas dalam pertempuran.
- source_word: מִבִּנְיָמִן
  choice: orang Benyamin
  rationale: Dalam konteks kesukuan, frasa ini menunjuk kepada orang-orang dari suku Benyamin. 'Orang Benyamin' lebih alami daripada terjemahan harfiah 'dari Benyamin' dan tidak menambahkan makna di luar sumber.
- source_word: עֶשְׂרִים וַחֲמִשָּׁה אֶלֶף אִישׁ
  choice: dua puluh lima ribu orang
  rationale: Terjemahan langsung ungkapan bilangan tersebut, dengan איש dipertahankan sebagai 'orang' tanpa menambahkan sebutan militer yang baru muncul dalam frasa berikutnya.
- source_word: שֹׁלֵף חֶרֶב
  choice: yang menghunus pedang
  rationale: Ungkapan ini merupakan idiom bagi laki-laki yang mampu bertempur, tetapi 'menghunus pedang' mempertahankan citra konkret bahasa Ibrani dan tetap wajar dalam bahasa Indonesia.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu
  rationale: Padanan temporal yang langsung dan alami.
- source_word: אֶת כָּל אֵלֶּה
  choice: mereka semua
  rationale: Ungkapan resumtif ini kembali menegaskan keseluruhan orang yang baru dihitung. 'Mereka semua' menyampaikan fungsi tersebut secara alami.
- source_word: אַנְשֵׁי חָיִל
  choice: pejuang yang gagah perkasa
  rationale: Dalam konteks perang, חַיִל menyatakan kecakapan, kekuatan, dan keberanian. 'Pejuang yang gagah perkasa' menyampaikan makna bela diri frasa ini secara jelas dan bermartabat, tanpa membatasinya pada nuansa moral semata.
