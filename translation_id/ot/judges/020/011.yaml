  text: So all the men of Israel gathered to the city[a], united as one man.
translation:
  language: id
  text: Maka semua laki-laki Israel berkumpul menghadapi kota itu sebagai satu orang, dalam kesatuan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “sebagai satu orang, tergabung bersama”—ungkapan yang menekankan kesatuan penuh dalam bertindak.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסֵף
  choice: berkumpul
  rationale: Bentuk Nifal dalam konteks kolektif menyatakan bahwa mereka berhimpun; bentuk aktif refleksif “berkumpul” alami dalam bahasa Indonesia dan mempertahankan makna dasarnya.
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: semua laki-laki Israel
  rationale: Ungkapan singular distributif ini menunjuk secara kolektif kepada kaum laki-laki Israel dalam konteks pengerahan pasukan, sehingga unsur gender dipertahankan.
- source_word: אֶל הָעִיר
  choice: menuju kota itu
  rationale: Preposisi אֶל pada dasarnya menyatakan arah “ke/menuju”. Konteksnya memang bermusuhan, tetapi unsur permusuhan tidak dinyatakan secara eksplisit oleh frasa ini.
- source_word: כְּאִישׁ אֶחָד
  choice: seperti satu orang
  rationale: Ungkapan ini menggambarkan kesatuan tindakan yang menyeluruh sambil mempertahankan citra harfiah bahasa Ibrani.
- source_word: חֲבֵרִים
  choice: bersatu
  rationale: Kata ini menambahkan gagasan bahwa mereka terikat atau tergabung erat; “bersatu” menyampaikan fungsinya secara alami dalam kalimat Indonesia.
