base_translation:
  language: en
  yaml_path: translation/ot/judges/020/039.yaml
  text: Then the men of Israel turned in the battle[a], and Benjamin began to strike down the slain among the men of Israel, about thirty men, for they said, “Surely he is utterly defeated before us[b], as in the first battle.”
translation:
  language: id
  text: Lalu pasukan Israel berbalik dalam pertempuran, dan orang-orang Benyamin mulai menewaskan kira-kira tiga puluh orang Israel[a], sebab mereka berkata, “Israel benar-benar kalah di hadapan kita[b], seperti dalam pertempuran yang pertama.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, frasa Ibraninya berbunyi kurang lebih, “mulai memukul yang tewas di antara orang Israel, kira-kira tiga puluh orang.” Ini adalah ungkapan perang yang padat untuk mulai menewaskan kira-kira tiga puluh orang Israel.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani memakai bentuk tunggal, secara harfiah, “ia benar-benar dikalahkan,” kemungkinan dengan Israel dipandang sebagai satu kesatuan. Bentuk itu juga dapat diterjemahkan “mereka benar-benar kalah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהֲפֹךְ אִישׁ יִשְׂרָאֵל
  choice: Ketika pasukan Israel berbalik
  rationale: אִישׁ יִשְׂרָאֵל berfungsi secara kolektif bagi para pejuang Israel. Bentuk temporal “ketika” menyampaikan hubungan tindakan dalam konteks pertempuran secara alami, sedangkan “berbalik” mempertahankan gerakan atau perubahan arah yang dinyatakan oleh הפך.
- source_word: וּבִנְיָמִן
  choice: orang-orang Benyamin
  rationale: Nama suku dipakai secara metonimis untuk para pejuangnya. Bentuk ini jelas dan alami dalam bahasa Indonesia tanpa mengubah rujukan kesukuan.
- source_word: הֵחֵל לְהַכּוֹת חֲלָלִים
  choice: mulai menewaskan
  rationale: Dalam konteks perang, נכה bersama חֲלָלִים menunjuk pada tindakan menjatuhkan korban tewas. “Menewaskan” menyampaikan maknanya secara wajar tanpa ungkapan harfiah yang janggal seperti “memukul orang-orang yang tewas”.
- source_word: כִּשְׁלֹשִׁים אִישׁ
  choice: kira-kira tiga puluh orang
  rationale: Prefiks כ menyatakan perkiraan; “kira-kira” mempertahankan unsur tersebut dengan bahasa Indonesia yang lazim.
- source_word: נִגּוֹף נִגָּף הוּא
  choice: Israel benar-benar telah terpukul kalah
  rationale: Gabungan infinitif absolut dan verba finit menguatkan kepastian atau intensitas kekalahan. Subjek tunggal kolektif diungkapkan sebagai “Israel,” yang alami dalam bahasa Indonesia dan mempertahankan kolektivitas sumber.
- source_word: כַּמִּלְחָמָה הָרִאשֹׁנָה
  choice: seperti dalam pertempuran yang pertama
  rationale: Terjemahan ini mempertahankan rujukan eksplisit kepada pertempuran pertama dan perbandingan dengan kekalahan sebelumnya.
