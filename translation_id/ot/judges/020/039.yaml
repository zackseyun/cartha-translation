translation_notes:
  register: Bahasa naratif dibuat modern, jelas, dan bermartabat. “Pasukan Israel” dan “orang-orang Benyamin” memperjelas bahwa konteksnya adalah para pejuang, sementara susunan Ibrani yang padat dijelaskan dalam catatan kaki tanpa menghilangkan nuansa kolektifnya.
