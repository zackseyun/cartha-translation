base_translation:
  language: en
  yaml_path: translation/ot/judges/020/024.yaml
  text: And the sons of Israel came near to the sons of Benjamin on the second day[a][b].
translation:
  language: id
  text: Lalu orang Israel mendekati[a] orang Benyamin[b] pada hari kedua.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "menghampiri"; dalam konteks militer, dapat juga dipahami "maju menghadapi".
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, "anak-anak Israel" dan "anak-anak Benyamin"; dapat juga diterjemahkan "keturunan Israel" dan "keturunan Benyamin".
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: Lalu ... mendekati
  rationale: Bentuk wayyiqtol melanjutkan alur narasi, sedangkan קרב dalam qal berarti datang mendekat atau menghampiri. Dalam konteks pertempuran, tindakan ini dapat berarti maju menghadapi lawan, tetapi kata Ibraninya sendiri tidak secara eksplisit menyatakan serangan.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah berarti 'anak-anak Israel', tetapi di sini menunjuk secara kolektif kepada pasukan suku-suku Israel. 'Orang Israel' alami dalam bahasa Indonesia modern dan tetap mempertahankan identitas kelompoknya.
- source_word: אֶל
  choice: orang Benyamin (objek dari 'mendekati')
  rationale: Preposisi אֶל pada dasarnya berarti 'ke' atau 'menuju'. Konstruksi Indonesia 'mendekati orang Benyamin' menyampaikan arah gerak tanpa menambahkan makna 'melawan' yang hanya tersirat oleh konteks militer.
- source_word: בְנֵי בִנְיָמִן
  choice: orang Benyamin
  rationale: Secara harfiah berarti 'anak-anak Benyamin' dan di sini menunjuk kepada kelompok suku Benyamin, khususnya pasukannya. Ungkapan 'orang Benyamin' lebih wajar daripada bentuk harfiah dalam bahasa Indonesia modern.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: pada hari kedua
  rationale: Terjemahan langsung ini mempertahankan bilangan bertingkat dalam bahasa Ibrani, bukan mengubahnya menjadi 'keesokan harinya'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sebutan kolektif 'orang Israel' dan 'orang Benyamin' dipilih agar alami, sementara bentuk kekerabatan harfiah dijelaskan dalam catatan kaki. Terjemahan mempertahankan ketidakjelasan apakah gerakan mendekat itu sendiri sudah merupakan tindakan menyerang.
