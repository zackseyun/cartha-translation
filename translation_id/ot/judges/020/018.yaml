  text: וַ/יָּקֻ֜מוּ וַ/יַּעֲל֣וּ בֵֽית אֵל֮ וַ/יִּשְׁאֲל֣וּ בֵ/אלֹהִים֒ וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל מִ֚י יַעֲלֶה לָּ֣/נוּ בַ/תְּחִלָּ֔ה לַ/מִּלְחָמָ֖ה עִם בְּנֵ֣י בִנְיָמִ֑ן וַ/יֹּ֥אמֶר יְהוָ֖ה יְהוּדָ֥ה בַ/תְּחִלָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/018.yaml
  text: Then they arose and went up to Bethel[a], and they inquired of God. The sons of Israel said, “Who will go up first for us to the battle against the sons of Benjamin?” And Yahweh said[c][b], “Judah first.”
translation:
  language: id
  text: Kemudian mereka bangkit lalu naik ke Betel dan meminta petunjuk Allah. Orang Israel berkata, “Siapakah dari antara kami yang akan maju lebih dahulu untuk berperang melawan orang Benyamin?” Yahweh menjawab, “Yehuda lebih dahulu.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Maksudnya, suku Yehuda harus maju lebih dahulu.
    reason: Menjelaskan jawaban Ibrani yang sangat ringkas dan tidak menyebut ulang kata kerja ‘maju’.
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: mereka berangkat
  rationale: Secara harfiah berarti ‘mereka bangkit’, tetapi dalam rangkaian perjalanan ungkapan ini secara idiomatis menandai dimulainya tindakan; ‘berangkat’ alami dalam narasi Indonesia.
- source_word: וַיַּעֲלוּ בֵית אֵל
  choice: pergi ke Betel
  rationale: עלה berarti ‘naik/pergi ke tempat yang lebih tinggi’, tetapi bahasa Indonesia tidak selalu memakai ‘naik’ untuk perjalanan ke suatu kota. Betel dipahami sebagai nama tempat dalam konteks ini.
- source_word: וַיִּשְׁאֲלוּ בֵאלֹהִים
  choice: meminta petunjuk Allah
  rationale: Konstruksi שאל ב־ di sini menunjukkan tindakan berkonsultasi kepada Allah untuk memperoleh arahan, bukan sekadar mengajukan pertanyaan biasa.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Orang Israel
  rationale: Ungkapan harfiahnya ‘anak-anak lelaki Israel’, tetapi berfungsi sebagai sebutan kolektif bagi bangsa Israel. ‘Orang Israel’ merupakan padanan Indonesia yang wajar dan tidak menyiratkan bahwa hanya laki-laki biologis yang berbicara.
- source_word: מִי יַעֲלֶה לָּנוּ בַתְּחִלָּה
  choice: Siapakah dari antara kami yang harus maju lebih dahulu
  rationale: Kata tanya dengan verba tunggal menanyakan pihak atau suku mana yang akan mengambil giliran pertama. ‘Dari antara kami’ menyampaikan fungsi לָנוּ secara alami, dan ‘maju’ cocok dengan konteks militer.
- source_word: לַמִּלְחָמָה עִם בְּנֵי בִנְיָמִן
  choice: untuk berperang melawan keturunan Benyamin
  rationale: Dalam konteks perang, עִם (‘dengan’) menyatakan pihak lawan. ‘Keturunan Benyamin’ mempertahankan citra kekerabatan בְּנֵי בִנְיָמִן dengan bahasa Indonesia yang alami.
- source_word: וַיֹּאמֶר יְהוָה
  choice: Yahweh menjawab
  rationale: יְהוָה adalah nama ilahi YHWH; ‘menjawab’ sesuai dengan pertanyaan sebelumnya dan alami dalam bahasa Indonesia.
- source_word: יְהוּדָה בַתְּחִלָּה
  choice: Yehuda lebih dahulu
  rationale: Jawaban Ibrani sengaja ringkas dan eliptis. Terjemahan ini mempertahankan keringkasan tersebut tanpa menambahkan verba yang tidak dinyatakan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri. Bentuk ‘Yahweh’ mempertahankan nama perjanjian secara langsung dan membedakannya dari gelar ‘Tuhan’.
- issue: Sebutan kolektif בְּנֵי יִשְׂרָאֵל
  choice: Orang Israel
  alternative: anak-anak Israel
  rationale: Dalam ayat ini ungkapan kekerabatan itu merujuk secara korporat kepada umat Israel. Padanan idiomatis Indonesia menghindari kesan keliru bahwa yang dimaksud adalah anak-anak menurut usia, tanpa mengubah rujukan kolektifnya.
translation_notes:
  register: 'Bahasa Indonesia modern, lugas, dan bermartabat. Narasi dibuat alami tanpa menghilangkan urutan tindakan. Nama-nama mengikuti bentuk Indonesia lazim: Betel, Benyamin, dan Yehuda. Jawaban ilahi tetap ringkas sesuai teks Ibrani.'
