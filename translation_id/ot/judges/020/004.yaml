  text: וַ/יַּ֜עַן הָ/אִ֣ישׁ הַ/לֵּוִ֗י אִ֛ישׁ הָ/אִשָּׁ֥ה הַ/נִּרְצָחָ֖ה וַ/יֹּאמַ֑ר הַ/גִּבְעָ֨תָ/ה֙ אֲשֶׁ֣ר לְ/בִנְיָמִ֔ן בָּ֛אתִי אֲנִ֥י וּ/פִֽילַגְשִׁ֖/י לָ/לֽוּן׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/004.yaml
  text: Then the Levite[a], the husband of the woman who had been murdered, answered and said, “I came to Gibeah, which belongs to Benjamin, I and my concubine, to spend the night.
translation:
  language: id
  text: Lalu orang Lewi itu, suami perempuan yang telah dibunuh itu, menjawab dan berkata, “Aku datang ke Gibea, yang termasuk wilayah Benyamin[a], bersama gundikku untuk bermalam.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang menjadi milik Benyamin.” Frasa Ibrani אֲשֶׁר לְבִנְיָמִן dapat menyatakan lokasi dalam wilayah suku Benyamin atau keterkaitan/kepemilikan oleh Benyamin.
    reason: Mempertahankan ambiguitas yang mungkin dalam frasa Ibrani sambil menjelaskan pilihan terjemahan utama.
lexical_decisions:
- source_word: וַיַּעַן
  choice: menjawab
  rationale: Pemakaian naratif baku dari ענה untuk memperkenalkan tanggapan; mempertahankan idiom Ibrani meskipun pertanyaan sebelumnya tidak dikutip secara langsung.
- source_word: הָאִישׁ הַלֵּוִי
  choice: orang Lewi itu
  rationale: Ungkapan Indonesia yang wajar untuk menyatakan identitas orang tersebut sebagai seorang Lewi.
- source_word: אִישׁ הָאִשָּׁה
  choice: suami perempuan
  rationale: Secara harfiah berarti ‘laki-laki perempuan itu’, tetapi dalam konteks hubungan keluarga kata אִישׁ menunjuk kepada suaminya; ayat-ayat sekitar juga memakai istilah kekerabatan perkawinan.
- source_word: הַנִּרְצָחָה
  choice: yang telah dibunuh
  rationale: Bentuk pasif dari רצח menunjukkan bahwa perempuan itu dibunuh. ‘Telah dibunuh’ alami dalam bahasa Indonesia dan tidak menambahkan penilaian hukum yang lebih khusus daripada bentuk sumber.
- source_word: וַיֹּאמַר
  choice: menjawab
  rationale: Dalam rangkaian וַיַּעַן ... וַיֹּאמַר, satu verba ujaran cukup dalam bahasa Indonesia; menerjemahkan keduanya sebagai ‘menjawab dan berkata’ terasa kaku dan berulang.
- source_word: הַגִּבְעָתָה
  choice: datang ke Gibea
  rationale: Akhiran penunjuk arah menyatakan gerak menuju Gibea; ‘ke Gibea’ merupakan padanan Indonesia yang alami.
- source_word: אֲשֶׁר לְבִנְיָמִן
  choice: yang termasuk wilayah Benyamin
  rationale: Frasa ini mengaitkan Gibea dengan Benyamin, kemungkinan sebagai kota dalam wilayah suku itu. Pilihan ini jelas dan alami sambil mencatat alternatif dalam catatan kaki.
- source_word: בָּאתִי אֲנִי
  choice: Aku ... datang
  rationale: Pronomina eksplisit אֲנִי memberi sedikit penekanan pada subjek. Bahasa Indonesia sudah menyatakannya secara wajar dengan ‘Aku’, sedangkan pasangan subjek berikutnya tetap dipertahankan.
- source_word: וּפִילַגְשִׁי
  choice: dan gundikku
  rationale: ‘Gundik’ adalah padanan baku untuk פִּילֶגֶשׁ dan mempertahankan status relasional yang berbeda dari istri utama tanpa parafrasa doktrinal.
- source_word: לָלוּן
  choice: untuk bermalam
  rationale: Infinitif לון berarti tinggal atau menginap pada malam hari; ‘bermalam’ ringkas, modern, dan tepat.
theological_decisions:
- issue: Hubungan antara orang Lewi dan perempuan itu
  choice: suami perempuan ... gundikku
  alternative: pasangan laki-laki perempuan ... istri keduaku
  rationale: Teks sendiri memakai אִישׁ dalam arti hubungan suami sekaligus פִּילֶגֶשׁ untuk status perempuan tersebut. Terjemahan mempertahankan kedua penyebutan itu dan ketegangan sosial yang ada, tanpa menyamakannya begitu saja dengan perkawinan modern atau menghapus salah satunya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pengulangan formula ujaran Ibrani diringkas menjadi ‘menjawab’ agar alami, tanpa menghilangkan fungsi naratifnya. Istilah ‘gundik’ dipertahankan karena merupakan padanan baku dan penting bagi konteks.
