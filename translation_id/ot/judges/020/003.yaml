base_translation:
  language: en
  yaml_path: translation/ot/judges/020/003.yaml
  text: The sons of Benjamin heard that the sons of Israel had gone up to Mizpah[a]. And the sons of Israel said, “Tell us[b], how did this evil happen?”
translation:
  language: id
  text: Orang-orang Benyamin mendengar bahwa orang-orang Israel telah pergi ke Mizpa.[a] Lalu orang-orang Israel berkata, “Katakanlah, bagaimana kejahatan ini[b] terjadi?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Benyamin” dan “anak-anak Israel”. Bahasa Ibrani mengulangi kedua ungkapan tersebut.
    reason: lexical_alternative
  - marker: b
    text: “Kejahatan” juga dapat diterjemahkan “keburukan” atau “perbuatan jahat”. Istilah Ibraninya mengandung bobot moral yang kuat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: mendengar
  rationale: Dalam konteks narasi ini, שׁמע berarti menerima atau mengetahui suatu kabar. “Mendengar” merupakan padanan langsung dan alami tanpa menambahkan penanda waktu yang tidak terdapat secara eksplisit dalam teks sumber.
- source_word: בְּנֵי בִנְיָמִן
  choice: orang-orang Benyamin
  rationale: Secara harfiah frasa ini berarti “anak-anak Benyamin”, tetapi dalam konteks kesukuan menunjuk kepada orang-orang dari suku Benyamin. Pilihan ini alami dalam bahasa Indonesia dan tidak menyiratkan hanya keturunan langsung.
- source_word: כִּי עָלוּ
  choice: bahwa ... telah pergi
  rationale: עלה secara dasar berarti “naik/pergi ke atas”. Dalam urutan narasi, “telah pergi” menyatakan bahwa perjalanan itu sudah berlangsung ketika kabarnya didengar, tanpa menafsirkan verba tersebut sebagai “berkumpul”.
- source_word: הַמִּצְפָּה
  choice: ke Mizpa
  rationale: Kata ini adalah nama tempat. Preposisi “ke” mengungkapkan arah gerak, sedangkan artikel Ibrani tidak perlu dipertahankan di depan nama tempat dalam bahasa Indonesia.
- source_word: וַיֹּאמְרוּ
  choice: Lalu ... berkata
  rationale: אמר berarti “berkata”. “Lalu” menyampaikan kesinambungan naratif waw tanpa memasukkan nuansa pertanyaan ke dalam verba pengantar.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang-orang Israel
  rationale: Frasa harfiahnya “anak-anak Israel”, tetapi di sini menunjuk kepada umat atau orang-orang Israel. Bentuk ini juga menjaga kesejajaran dengan “orang-orang Benyamin” secara alami.
- source_word: דַּבְּרוּ
  choice: Katakanlah
  rationale: Imperatif jamak dari דבר memerintahkan para pendengar untuk menyampaikan keterangan. Bahasa Indonesia tidak harus mengungkapkan objek tak tersurat seperti “kepada kami”.
- source_word: אֵיכָה
  choice: bagaimana
  rationale: Kata tanya ini menanyakan cara atau keadaan yang menyebabkan peristiwa tersebut terjadi.
- source_word: נִהְיְתָה
  choice: bisa terjadi
  rationale: Dalam konstruksi ini היה bersifat eventif, yaitu “terjadi” atau “menjadi kenyataan”. Kata “bisa” menghasilkan pertanyaan bahasa Indonesia yang alami mengenai bagaimana peristiwa itu sampai terjadi.
- source_word: הָרָעָה הַזֹּאת
  choice: kejahatan ini
  rationale: רָעָה dapat berarti kejahatan, keburukan, atau malapetaka. Konteks kekejian di Gibea menonjolkan bobot moralnya, sehingga “kejahatan” tepat tanpa mempersempitnya menjadi sekadar bencana.
