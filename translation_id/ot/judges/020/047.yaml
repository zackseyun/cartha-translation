base_translation:
  language: en
  yaml_path: translation/ot/judges/020/047.yaml
  text: But six hundred men turned and fled toward the wilderness[a], to the rock of Rimmon[b], and stayed at the rock of Rimmon four months.
translation:
  language: id
  text: Namun, enam ratus orang berbalik dan melarikan diri ke arah padang belantara[a], ke Batu Rimon[b]. Mereka tinggal di Batu Rimon selama empat bulan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “masuk ke padang belantara”. Bentuk penunjuk arah dalam bahasa Ibrani dapat menyatakan gerak menuju atau masuk ke kawasan padang belantara.
    reason: lexical_alternative
  - marker: b
    text: Ibrani “batu Rimon”; juga dapat diterjemahkan “Batu Karang Rimon”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: berbalik
  rationale: Menyatakan perubahan arah dalam rangkaian tindakan pelarian, tanpa menambahkan gagasan yang tidak dinyatakan secara eksplisit.
- source_word: וַיָּנֻסוּ
  choice: melarikan diri
  rationale: Makna lazim נוּס dalam konteks pertempuran adalah lari untuk menyelamatkan diri.
- source_word: הַמִּדְבָּרָה
  choice: ke arah padang belantara
  rationale: Akhiran arah pada bentuk Ibrani dapat menunjukkan gerak menuju atau masuk ke kawasan padang belantara; pilihan ini mempertahankan kelonggaran tersebut.
- source_word: אֶל סֶלַע הָרִמּוֹן
  choice: ke Batu Rimon
  rationale: סֶלַע berarti batu atau bukit batu; dalam konteks ini konstruksi tersebut berfungsi sebagai nama lokasi dan wajar diterjemahkan sebagai 'Batu Rimon'.
- source_word: שֵׁשׁ מֵאוֹת אִישׁ
  choice: enam ratus orang
  rationale: אִישׁ sesudah bilangan menunjuk pada orang-orang laki-laki dalam pasukan; bahasa Indonesia lazim memakai 'orang' sebagai penggolong, sementara konteks militer sudah memperjelas rujukannya.
- source_word: וַיֵּשְׁבוּ
  choice: tinggal
  rationale: ישׁב dapat berarti duduk, menetap, atau tinggal; 'tinggal' sesuai untuk keberadaan sementara selama empat bulan.
- source_word: בְּסֶלַע רִמּוֹן
  choice: di Batu Rimon
  rationale: Preposisi בְּ menunjukkan lokasi; 'di' merupakan padanan Indonesia yang alami tanpa menentukan apakah mereka berada di atas, di dalam, atau di sekitar bukit batu itu.
- source_word: אַרְבָּעָה חֳדָשִׁים
  choice: selama empat bulan
  rationale: Ungkapan durasi diterjemahkan secara langsung dan alami.
- source_word: וַ
  choice: Namun
  rationale: Waw naratif membuka ayat ini, tetapi konteks sebelumnya menonjolkan kontras antara kehancuran pasukan Benyamin dan enam ratus orang yang lolos.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. 'Padang belantara' dipilih untuk מִדְבָּר agar tidak menyempitkan maknanya menjadi gurun pasir. Pengulangan 'Batu Rimon' dipertahankan sesuai teks Ibrani, sedangkan kalimat dibagi dua agar alurnya alami dalam bahasa Indonesia.
