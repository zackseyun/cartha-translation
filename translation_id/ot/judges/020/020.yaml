base_translation:
  language: en
  yaml_path: translation/ot/judges/020/020.yaml
  text: The men of Israel went out to battle against Benjamin[a], and the men of Israel drew up for battle against them at Gibeah.
translation:
  language: id
  text: Para pria Israel keluar untuk berperang melawan Benyamin. Lalu para pria Israel menyusun barisan untuk bertempur menghadapi mereka[a] di Gibea.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “bersama mereka”; dalam konteks ini kedua pasukan berhadapan untuk bertempur.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “ke arah Gibea.”'
    reason: spatial_ambiguity
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: maju
  rationale: Dalam konteks militer, יצא menyatakan gerak keluar untuk bertempur. “Maju” alami dalam bahasa Indonesia dan menyampaikan gerakan pasukan tanpa menambahkan rincian yang tidak ada.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: orang-orang Israel
  rationale: Bentuk tunggal אִישׁ dipakai secara kolektif untuk para lelaki Israel yang menjadi pasukan. Bentuk jamak Indonesia diperlukan agar maknanya jelas dan wajar.
- source_word: לַמִּלְחָמָה
  choice: untuk berperang
  rationale: Frasa berpreposisi ini menyatakan tujuan gerakan mereka, yakni memasuki pertempuran.
- source_word: עִם בִּנְיָמִן
  choice: melawan orang Benyamin
  rationale: Walaupun עִם biasanya berarti “dengan”, konteks perang menunjukkan hubungan permusuhan. “Orang Benyamin” merujuk pada suku atau pasukan Benyamin, bukan hanya leluhur yang bernama Benyamin.
- source_word: וַיַּעַרְכוּ ... מִלְחָמָה
  choice: mengatur barisan tempur
  rationale: Dalam pemakaian militer, ערך bersama מִלְחָמָה menunjuk pada penataan pasukan dalam formasi untuk bertempur.
- source_word: אִתָּם
  choice: untuk menghadapi mereka
  rationale: Secara bentuk kata ini berarti “dengan mereka”, tetapi dalam konteks dua pasukan yang berhadapan, maksudnya adalah menghadapi pihak lawan. Catatan kaki mempertahankan bentuk harfiahnya.
- source_word: אֶל הַגִּבְעָה
  choice: di Gibea
  rationale: אֶל dapat menunjukkan arah atau hubungan lokasi. Dalam konteks ini, “di Gibea” merupakan pembacaan kontekstual yang alami, sementara kemungkinan “ke arah Gibea” dicatat.
theological_decisions:
- issue: Bahasa kolektif bergender dalam אִישׁ יִשְׂרָאֵל
  choice: orang-orang Israel
  alternative: pasukan Israel; Israel
  rationale: Konteks menyangkut para lelaki yang berperang. “Orang-orang Israel” mempertahankan rujukan personal dan kolektif tanpa mengubahnya menjadi abstraksi, meski bahasa Indonesia tidak menandai gender secara gramatikal.
- issue: Hubungan permusuhan yang dinyatakan dengan עִם / אִתָּם
  choice: melawan orang Benyamin; untuk menghadapi mereka
  alternative: dengan orang Benyamin; bersama mereka
  rationale: Konteks pertempuran menuntut makna adversatif, tetapi bentuk dasar preposisinya tetap diakui dalam catatan kaki agar ambiguitas leksikal tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. “Barisan tempur” mempertahankan nuansa taktis tanpa memakai istilah militer yang terlalu teknis. Nama tempat ditulis “Gibea”, sesuai bentuk yang lazim dalam Alkitab bahasa Indonesia.
