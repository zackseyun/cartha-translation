base_translation:
  language: en
  yaml_path: translation/ot/judges/020/022.yaml
  text: But the people[a], the men of Israel, strengthened themselves and again drew up for battle in the place where they had drawn up on the first day.
translation:
  language: id
  text: Namun, rakyat itu, yakni para pria Israel, menguatkan diri[a] dan kembali menyusun barisan untuk bertempur di tempat mereka telah menyusun barisan pada hari pertama.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memberanikan diri.” Kata Ibrani ini dapat menunjuk pada pulihnya keteguhan hati setelah mengalami kekalahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְחַזֵּק
  choice: menguatkan diri
  rationale: Bentuk Hitpael dari חזק di sini bersifat refleksif/intransitif dan menggambarkan pulihnya keteguhan Israel setelah kalah. “Menguatkan diri” mempertahankan nuansa refleksif tanpa menutup kemungkinan makna keberanian yang diperbarui.
- source_word: הָעָם אִישׁ יִשְׂרָאֵל
  choice: bangsa itu, yakni kaum laki-laki Israel
  rationale: Konstruksi aposisional Ibrani memadukan sebutan kolektif “bangsa itu” dengan “laki-laki Israel.” Terjemahan ini mempertahankan kedua unsur dan memperjelas bahwa yang dimaksud dalam konteks pertempuran ialah para laki-laki Israel.
- source_word: וַיֹּסִפוּ
  choice: kembali
  rationale: Bersama bentuk infinitif לַעֲרֹךְ, verba יסף menyatakan pengulangan atau dimulainya kembali tindakan, yang secara alami diungkapkan dengan “kembali” dalam bahasa Indonesia.
- source_word: לַעֲרֹךְ מִלְחָמָה
  choice: menyusun barisan untuk bertempur
  rationale: ערך dengan מִלְחָמָה menunjuk pada penataan pasukan atau barisan tempur. Ungkapan ini mempertahankan gambaran militer dengan bahasa Indonesia yang jelas dan alami.
- source_word: בַּמָּקוֹם
  choice: di tempat
  rationale: Ungkapan lokatif ini diterjemahkan langsung dan alami, serta mengantar klausa relatif berikutnya.
- source_word: אֲשֶׁר עָרְכוּ שָׁם
  choice: mereka menyusun barisan
  rationale: Pengulangan verba ערך dipertahankan untuk menghubungkan pengerahan kali ini dengan pengerahan sebelumnya. Unsur שָׁם tidak diterjemahkan tersendiri karena maknanya sudah tercakup oleh “di tempat.”
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: pada hari pertama
  rationale: Terjemahan temporal yang langsung, tepat, dan wajar dalam bahasa Indonesia modern.
