base_translation:
  language: en
  yaml_path: translation/ot/judges/020/017.yaml
  text: And the men of Israel[a], apart from Benjamin, were mustered at four hundred thousand men drawing the sword[c][b]; all these were men of war.
translation:
  language: id
  text: Laki-laki Israel—tidak termasuk Benyamin[a]—yang dikerahkan[b] berjumlah empat ratus ribu orang yang menghunus pedang[c]; mereka semua adalah prajurit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “selain Benyamin”; artinya, suku Benyamin tidak termasuk dalam jumlah ini.
    reason: lexical_alternative
  - marker: b
    text: Atau “didata.” Kata Ibrani ini dapat berarti dihitung atau dikerahkan untuk tugas militer.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “menghunus pedang,” sebuah ungkapan Ibrani untuk para pejuang bersenjata.
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: Orang-orang Israel
  rationale: Walaupun אִישׁ berbentuk tunggal, kata ini digunakan secara kolektif dan diikuti verba jamak; konteksnya menunjuk kepada kaum laki-laki Israel yang siap berperang.
- source_word: הִתְפָּקְדוּ
  choice: yang dikerahkan
  rationale: Dalam konteks militer, bentuk ini dapat berarti didata, dihitung, atau dihimpun untuk bertugas. “Dikerahkan” menyampaikan nuansa pengerahan pasukan secara wajar dalam bahasa Indonesia.
- source_word: לְבַד מִבִּנְיָמִן
  choice: tidak termasuk Benyamin
  rationale: Frasa ini mengecualikan suku Benyamin dari jumlah yang disebutkan; ungkapan ini jelas dan alami bagi pembaca Indonesia.
- source_word: אַרְבַּע מֵאוֹת אֶלֶף אִישׁ
  choice: empat ratus ribu orang
  rationale: Terjemahan ini mempertahankan angka dan penyebutan eksplisit אִישׁ tanpa menambahkan sebutan “tentara” sebelum sumber menyatakan bahwa mereka semua prajurit.
- source_word: שֹׁלֵף חָרֶב
  choice: yang menghunus pedang
  rationale: Pilihan ini mempertahankan gambaran harfiah idiom Ibrani tentang para pejuang bersenjata dan siap bertempur.
- source_word: כָּל זֶה אִישׁ מִלְחָמָה
  choice: mereka semua adalah prajurit
  rationale: Ungkapan ini menyampaikan secara alami bahwa seluruh kelompok yang baru dihitung terdiri atas orang-orang yang siap berperang.
