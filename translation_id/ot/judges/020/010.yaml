revisions:
- from: Kita akan memilih sepuluh orang dari setiap seratus orang dari seluruh suku Israel, seratus dari setiap seribu, dan seribu dari setiap sepuluh ribu. Mereka akan mengambil perbekalan bagi rakyat, supaya ketika rakyat tiba di Gibea di wilayah Benyamin, mereka dapat bertindak sesuai dengan segala perbuatan keji[a] yang telah dilakukan kota itu di Israel.[b]
  to: Kita akan mengambil sepuluh orang dari setiap seratus orang, dari seluruh suku Israel, seratus dari setiap seribu, dan seribu dari setiap sepuluh ribu, untuk menyediakan perbekalan bagi rakyat, supaya ketika mereka tiba di Gibea di Benyamin, mereka dapat bertindak sesuai dengan seluruh perbuatan keji[a] yang telah dilakukan di Israel.[b]
  rationale: 'Revisi mempertahankan urutan dan fungsi rangkaian infinitif Ibrani: memilih orang secara proporsional, menyediakan perbekalan bagi rakyat, lalu bertindak setibanya di Gibea. Bentuk arah “tiba di Gibea di Benyamin” dipulihkan. Pelaku tunggal pada klausa akhir tidak lagi ditetapkan sebagai “kota itu” dalam teks utama, sementara ambiguitas gramatikalnya dijelaskan dalam catatan kaki.'
