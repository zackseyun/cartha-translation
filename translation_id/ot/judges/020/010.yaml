  text: וְ/לָקַ֣חְנוּ עֲשָׂרָה֩ אֲנָשִׁ֨ים לַ/מֵּאָ֜ה לְ/כֹ֣ל שִׁבְטֵ֣י יִשְׂרָאֵ֗ל וּ/מֵאָ֤ה לָ/אֶ֨לֶף֙ וְ/אֶ֣לֶף לָ/רְבָבָ֔ה לָ/קַ֥חַת צֵדָ֖ה לָ/עָ֑ם לַ/עֲשׂ֗וֹת לְ/בוֹאָ/ם֙ לְ/גֶ֣בַע בִּנְיָמִ֔ן כְּ/כָל הַ֨/נְּבָלָ֔ה אֲשֶׁ֥ר עָשָׂ֖ה בְּ/יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/010.yaml
  text: And we will take ten men out of a hundred from all the tribes of Israel[a], and a hundred out of a thousand, and a thousand out of ten thousand, to get provisions for the people, so that when they come to Gibeah of Benjamin[b], they may do according to all the outrage that it committed in Israel.
translation:
  language: id
  text: Kita akan mengambil sepuluh orang dari setiap seratus orang, dari seluruh suku Israel, seratus dari setiap seribu, dan seribu dari setiap sepuluh ribu, untuk menyediakan perbekalan bagi rakyat, supaya ketika mereka tiba di Gibea di Benyamin, mereka dapat bertindak sesuai dengan seluruh perbuatan keji[a] yang telah dilakukan di Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kekejian” atau “perbuatan memalukan.” Istilah Ibrani ini menunjuk pada perbuatan yang sangat tercela dan memalukan secara moral.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibraninya secara harfiah berbunyi kira-kira, “untuk bertindak pada saat mereka tiba di Gibea di Benyamin sesuai dengan seluruh perbuatan keji yang telah dilakukannya di Israel.” Kata kerja “telah dilakukannya” berbentuk tunggal aktif. Rujukannya tidak dinyatakan secara eksplisit; dalam konteksnya dapat dipahami sebagai Gibea sebagai pelaku kolektif.
    reason: source_ambiguity
lexical_decisions:
- source_word: וְלָקַחְנוּ
  choice: Kita akan memilih
  rationale: Bentuk perfektum dengan waw dalam konteks musyawarah ini menyatakan rencana yang akan dijalankan. ‘Memilih’ memperjelas bahwa orang-orang itu diambil dari kelompok-kelompok menurut perbandingan tertentu.
- source_word: עֲשָׂרָה אֲנָשִׁים לַמֵּאָה ... וּמֵאָה לָאֶלֶף וְאֶלֶף לָרְבָבָה
  choice: sepuluh orang dari setiap seratus orang ... seratus dari setiap seribu, dan seribu dari setiap sepuluh ribu
  rationale: Ungkapan ini menunjukkan pemilihan secara proporsional. Kata ‘setiap’ membuat pola perbandingan itu jelas dan alami dalam bahasa Indonesia.
- source_word: לְכֹל שִׁבְטֵי יִשְׂרָאֵל
  choice: dari seluruh suku Israel
  rationale: Dalam rangkaian pemilihan proporsional, orang-orang tersebut berasal dari keseluruhan suku-suku Israel.
- source_word: לָקַחַת צֵדָה
  choice: mengambil perbekalan
  rationale: צֵדָה berarti bekal atau persediaan untuk perjalanan maupun operasi militer; ‘perbekalan’ mempertahankan cakupan maknanya.
- source_word: לָעָם
  choice: bagi rakyat
  rationale: Kata Ibrani עָם secara umum berarti ‘rakyat’ atau ‘bangsa’. Dalam konteks ini yang dimaksud ialah kumpulan pasukan Israel, tetapi terjemahan tidak mempersempitnya menjadi ‘tentara’.
- source_word: לַעֲשׂוֹת לְבוֹאָם
  choice: supaya ketika rakyat tiba ... mereka dapat bertindak
  rationale: Rangkaian infinitif Ibrani sangat padat. Terjemahan ini menguraikan hubungan tujuan dan waktu secara alami tanpa menentukan lebih jauh bentuk tindakan yang dimaksud.
- source_word: לְגֶבַע בִּנְיָמִן
  choice: di Gibea di wilayah Benyamin
  rationale: Preposisi menunjukkan arah kedatangan menuju Gibea; ‘di wilayah Benyamin’ menjelaskan hubungan Gibea dengan Benyamin secara wajar dalam bahasa Indonesia.
- source_word: כְּכָל הַנְּבָלָה
  choice: sesuai dengan segala perbuatan keji
  rationale: נְבָלָה menunjuk pada tindakan yang sangat tercela, memalukan, dan mengguncangkan secara moral. ‘Perbuatan keji’ menyampaikan bobot etisnya dalam bahasa Indonesia modern.
- source_word: אֲשֶׁר עָשָׂה בְּיִשְׂרָאֵל
  choice: yang telah dilakukan kota itu di Israel
  rationale: Kata kerja berbentuk maskulin tunggal. Dalam konteksnya, pelaku kolektif paling wajar dipahami sebagai Gibea yang dipersonifikasikan; ‘kota itu’ mencegah kata ganti Indonesia menjadi kabur, sementara catatan kaki mempertahankan ambiguitas gramatikalnya.
theological_decisions:
- issue: Penerjemahan istilah bermuatan moral נְבָלָה tanpa memasukkan kategori doktrinal tambahan
  choice: perbuatan keji
  alternative: kekejian; perbuatan memalukan; kebebalan
  rationale: Istilah ini mengecam tindakan di Gibea sebagai pelanggaran moral yang sangat tercela. ‘Perbuatan keji’ kuat dan mudah dipahami, tetapi tidak menambahkan istilah teologis teknis yang tidak terdapat dalam teks.
- issue: Pelaku dalam אֲשֶׁר עָשָׂה
  choice: kota itu, yakni Gibea sebagai pelaku kolektif
  alternative: dia; hal itu; yang telah dilakukan di Israel
  rationale: Bentuk kata kerja adalah orang ketiga maskulin tunggal, sedangkan rujukan tepatnya tidak dinyatakan ulang. Konteks mendukung Gibea sebagai pelaku kolektif, tetapi ambiguitas sumber tetap diberitahukan dalam catatan kaki.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Pola angka dipertahankan secara eksplisit. Kalimat Ibrani yang sangat panjang dibagi menjadi dua agar mudah dipahami, tanpa mengubah urutan rencana: pemilihan petugas, pengadaan perbekalan, lalu tindakan di Gibea.'
