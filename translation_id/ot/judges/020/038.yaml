  text: וְ/הַ/מּוֹעֵ֗ד הָיָ֛ה לְ/אִ֥ישׁ יִשְׂרָאֵ֖ל עִם הָ/אֹרֵ֑ב הֶ֕רֶב לְ/הַעֲלוֹתָ֛/ם מַשְׂאַ֥ת הֶ/עָשָׁ֖ן מִן הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/038.yaml
  text: The appointed sign between the men of Israel and the ambush was that they should make a great cloud of smoke rise from the city[a][b][c].
translation:
  language: id
  text: Tanda yang telah disepakati antara orang-orang Israel dan pasukan penyergap ialah bahwa mereka harus membuat kepulan asap yang besar membubung dari kota itu[a][b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketetapan yang telah disepakati” atau “tanda yang telah ditentukan.” Kata Ibrani מוֹעֵד sering berarti waktu yang ditetapkan, tetapi di sini menunjuk pada tanda atau kesepakatan yang telah diatur sebelumnya untuk pertempuran.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bagi orang-orang Israel dengan penyergap”; maksudnya ialah kesepakatan antara kedua pihak.
    reason: lexical_alternative
  - marker: c
    text: Atau “gumpalan asap” atau “kolom asap.” Ungkapan Ibrani ini menunjuk pada asap yang membubung dan tampak jelas sebagai tanda dari kota itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַמּוֹעֵד
  choice: Tanda yang telah disepakati
  rationale: מוֹעֵד biasanya menunjuk pada waktu atau pertemuan yang ditetapkan, tetapi dalam konteks strategi perang ini menunjuk pada tanda yang telah ditentukan bersama. Ungkapan ini menyampaikan fungsi kontekstualnya tanpa menambahkan penanda waktu yang tidak ada dalam teks.
- source_word: לְאִישׁ יִשְׂרָאֵל עִם הָאֹרֵב
  choice: antara orang-orang Israel dan pasukan penyergap
  rationale: Gabungan לְ ... עִם menyebut kedua pihak dalam kesepakatan. אֹרֵב berbentuk partisip yang dipakai secara kolektif bagi pasukan yang bersembunyi untuk menyergap.
- source_word: הֶרֶב
  choice: yang besar
  rationale: Bentuk intensif dari רבה menguatkan tindakan atau hasilnya. Dalam bahasa Indonesia, intensifikasi itu wajar dinyatakan sebagai kepulan asap 'yang besar'.
- source_word: לְהַעֲלוֹתָם
  choice: mereka harus membuat ... membubung
  rationale: Bentuk Hifil dari עלה berarti menyebabkan sesuatu naik. Akhiran orang ketiga jamak menunjuk pada pihak yang melaksanakan tanda tersebut.
- source_word: מַשְׂאַת הֶעָשָׁן
  choice: kepulan asap
  rationale: מַשְׂאַת menggambarkan sesuatu yang terangkat; bersama 'asap', frasa ini menunjuk pada massa atau kolom asap yang tampak jelas. 'Kepulan asap' alami dalam bahasa Indonesia dan tetap mempertahankan gambaran naiknya asap.
- source_word: מִן הָעִיר
  choice: dari kota itu
  rationale: מִן menyatakan sumber atau tempat asal. Artikel pada הָעִיר wajar diungkapkan dengan 'kota itu' dalam konteks naratif Indonesia.
