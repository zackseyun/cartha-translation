translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. 'Pasukan penyergap' memperjelas penggunaan kolektif tanpa mengubah pelakunya menjadi konsep abstrak, sedangkan 'membubung' mempertahankan citra asap yang dibuat naik.
