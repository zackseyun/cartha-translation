  text: וְ/כֹ֣ל אִ֣ישׁ יִשְׂרָאֵ֗ל קָ֚מוּ מִ/מְּקוֹמ֔/וֹ וַ/יַּעַרְכ֖וּ בְּ/בַ֣עַל תָּמָ֑ר וְ/אֹרֵ֧ב יִשְׂרָאֵ֛ל מֵגִ֥יחַ מִ/מְּקֹמ֖/וֹ מִ/מַּֽעֲרֵה גָֽבַע׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/020/033.yaml
  text: Then all the men of Israel rose from their place and drew up in battle formation at Baal-tamar[a], while the men lying in ambush of Israel rushed out from their place, from Maareh-geba.
translation:
  language: id
  text: Kemudian semua prajurit Israel bangkit dari tempat mereka dan menyusun barisan tempur di Baal-Tamar, sementara pasukan penyergap Israel menyerbu keluar dari tempat mereka, dari Maare-Geba.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani Maare-Geba mungkin merupakan nama tempat, seperti dalam terjemahan ini. Ungkapan itu juga dapat dipahami secara deskriptif sebagai “tempat terbuka di Geba” atau “padang rumput di Geba.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹל אִישׁ יִשְׂרָאֵל
  choice: seluruh pasukan Israel
  rationale: Secara harfiah berarti 'setiap laki-laki Israel', tetapi dalam konteks perang menunjuk secara kolektif kepada para prajurit Israel; 'seluruh pasukan Israel' alami dan tepat secara kontekstual.
- source_word: קָמוּ מִמְּקוֹמוֹ
  choice: bangkit dari tempat mereka
  rationale: Kata kerja jamak mengacu kepada pasukan secara kolektif, sedangkan sufiks tunggal pada 'tempat' bersifat distributif; bahasa Indonesia wajar memakai 'mereka'.
- source_word: וַיַּעַרְכוּ
  choice: mengatur barisan tempur
  rationale: Dalam konteks militer, ערך berarti menyusun atau menempatkan pasukan dalam formasi untuk bertempur.
- source_word: בְּבַעַל תָּמָר
  choice: di Baal-Tamar
  rationale: Ungkapan ini merupakan nama tempat sehingga ditransliterasikan, bukan diterjemahkan.
- source_word: אֹרֵב יִשְׂרָאֵל
  choice: pasukan Israel yang menghadang
  rationale: Partisip אֹרֵב menunjuk kepada orang-orang yang berbaring menunggu dalam penyergapan. Genitif יִשְׂרָאֵל paling wajar dipahami sebagai pasukan penghadang milik Israel, bukan pihak yang menghadang Israel.
- source_word: מֵגִיחַ
  choice: keluar dengan cepat
  rationale: Bentuk ini menggambarkan kemunculan atau gerak maju yang mendadak dari persembunyian, sesuai dengan konteks penyergapan.
- source_word: מִמְּקוֹמוֹ
  choice: dari tempat persembunyian mereka
  rationale: Secara harfiah 'dari tempatnya'; tambahan 'persembunyian' dijelaskan oleh konteks pasukan penghadang dan menghasilkan bahasa Indonesia yang alami tanpa mengubah peristiwa.
- source_word: מִמַּעֲרֵה גָבַע
  choice: dari Maare-Geba
  rationale: Ungkapan ini sulit dan mungkin merupakan nama tempat. Transliterasi mempertahankan ketidakpastian, sedangkan kemungkinan makna deskriptif dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif-militer. Nama tempat ditransliterasikan secara konsisten. Penanda catatan kaki ditempatkan sesudah Maare-Geba karena catatan tersebut menerangkan ungkapan itu, bukan Baal-Tamar.
