revisions:
- from: Kemudian seluruh pasukan Israel bangkit dari tempat mereka dan mengatur barisan tempur di Baal-Tamar, sementara pasukan Israel yang menghadang keluar dengan cepat dari tempat persembunyian mereka, dari Maare-Geba.[a]
  to: Kemudian semua prajurit Israel bangkit dari tempat mereka dan menyusun barisan tempur di Baal-Tamar, sementara pasukan penyergap Israel menyerbu keluar dari tempat mereka, dari Maare-Geba.[a]
  rationale: Revisi mengganti ungkapan yang dapat berarti menghadang secara terbuka dengan istilah yang secara tepat menunjukkan pasukan penyergap. Revisi juga menghapus tambahan "persembunyian" agar terjemahan tidak menentukan sifat lokasi yang masih diperselisihkan secara leksikal. Nama tempat dan catatan kaki yang memelihara ambiguitas Maare-Geba tetap dipertahankan.
