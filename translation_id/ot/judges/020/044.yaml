  yaml_path: translation/ot/judges/020/044.yaml
  text: And eighteen thousand men from Benjamin fell[a]; all these were valiant warriors.
translation:
  language: id
  text: Lalu gugurlah delapan belas ribu orang dari suku Benyamin; mereka semua adalah pejuang yang gagah perkasa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְּלוּ
  choice: gugurlah
  rationale: Dalam konteks pertempuran, נפל menyatakan jatuh dalam kematian. “Gugur” mempertahankan nuansa militer dengan wajar dalam bahasa Indonesia tanpa memperpanjangnya menjadi “tewas dalam pertempuran”.
- source_word: מִבִּנְיָמִן
  choice: dari suku Benyamin
  rationale: Preposisi מִן menandai asal atau keanggotaan. Penambahan “suku” membuat identitas kelompok jelas dan alami bagi pembaca Indonesia.
- source_word: שְׁמֹנָה עָשָׂר אֶלֶף אִישׁ
  choice: delapan belas ribu orang
  rationale: Kata אִישׁ dinyatakan secara eksplisit sesudah bilangan, sehingga diterjemahkan “orang”; “prajurit” akan lebih interpretatif.
- source_word: אֶת כָּל אֵלֶּה
  choice: mereka semua
  rationale: Ungkapan ini merangkum secara aposisional seluruh kelompok yang baru disebut. “Mereka semua” alami dalam bahasa Indonesia dan mempertahankan cakupan keseluruhannya.
- source_word: אַנְשֵׁי חָיִל
  choice: pejuang yang gagah perkasa
  rationale: Dalam konteks militer, frasa ini menunjuk kepada laki-laki yang cakap dan perkasa dalam berperang. “Pejuang yang gagah perkasa” menyampaikan fungsi militer dan keberanian mereka dengan bahasa modern yang bermartabat.
