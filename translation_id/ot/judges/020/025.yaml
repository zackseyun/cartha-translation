translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Orang Benyamin' dipakai sebagai sebutan kolektif suku, 'bani Israel' mempertahankan corak kekerabatan-kebangsaan sumber, dan gambaran 'menghunus pedang' dipertahankan daripada diratakan menjadi 'prajurit'.
