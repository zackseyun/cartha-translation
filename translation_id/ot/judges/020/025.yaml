base_translation:
  language: en
  yaml_path: translation/ot/judges/020/025.yaml
  text: Benjamin came out from Gibeah to meet them on the second day[a], and they struck down another eighteen thousand men of Israel to the ground[b]; all these were drawing the sword.
translation:
  language: id
  text: Pada hari kedua, orang Benyamin keluar dari Gibea untuk menghadapi mereka[a], lalu menewaskan delapan belas ribu orang lagi dari antara bani Israel, sehingga mereka rebah ke tanah. Semua orang itu adalah orang yang menghunus pedang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “untuk menyongsong mereka”; dalam konteks ini, ungkapan Ibrani tersebut menunjuk pada pertemuan yang bersifat bermusuhan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא בִנְיָמִן
  choice: orang Benyamin keluar
  rationale: Nama suku dipakai secara kolektif dalam bentuk tunggal, sementara kelanjutan ayat memakai verba jamak. Ungkapan 'orang Benyamin' alami dalam bahasa Indonesia dan mempertahankan acuan kolektif tersebut.
- source_word: לִקְרָאתָם
  choice: untuk menghadapi mereka
  rationale: Ungkapan ini dapat berarti pergi menyongsong atau menemui, tetapi dalam konteks pertempuran perjumpaan itu jelas bersifat bermusuhan. 'Menghadapi' menyampaikan konteks militer tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: מִן הַגִּבְעָה
  choice: dari Gibea
  rationale: Terjemahan langsung untuk keterangan tempat asal; nama tempat ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: Pada hari kedua
  rationale: Mempertahankan bilangan tingkat yang dinyatakan secara eksplisit dalam bahasa Ibrani.
- source_word: וַיַּשְׁחִיתוּ
  choice: lalu menewaskan
  rationale: Bentuk Hifil dari שׁחת berarti membinasakan atau menghancurkan. Dalam laporan korban pertempuran, 'menewaskan' secara alami menyatakan tindakan mematikan terhadap orang.
- source_word: בִבְנֵי יִשְׂרָאֵל
  choice: dari antara bani Israel
  rationale: Preposisi ב menandai kelompok yang terkena tindakan, sedangkan בְּנֵי יִשְׂרָאֵל adalah sebutan kebangsaan-kekerabatan. 'Dari antara bani Israel' menyampaikan keduanya secara jelas.
- source_word: עוֹד שְׁמֹנַת עָשָׂר אֶלֶף אִישׁ
  choice: delapan belas ribu orang lagi
  rationale: עוֹד menyatakan tambahan korban sesudah kerugian sebelumnya; susunan dengan 'lagi' merupakan bentuk Indonesia yang alami.
- source_word: אָרְצָה
  choice: hingga rebah ke tanah
  rationale: Bentuk berarah dari אֶרֶץ secara harfiah menunjuk gerak ke tanah. Dalam konteks orang yang ditewaskan, 'rebah ke tanah' mempertahankan gambaran sumber dengan ungkapan yang wajar.
- source_word: כָּל אֵלֶּה שֹׁלְפֵי חָרֶב
  choice: Mereka semua adalah orang yang menghunus pedang
  rationale: Terjemahan ini mempertahankan ungkapan partisipial yang harfiah dan hidup, 'para penghunus pedang', tanpa langsung menggantinya dengan istilah tafsiran seperti 'prajurit'.
