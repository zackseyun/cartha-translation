  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לֹא יָ֤סַף עוֹד֙ מַלְאַ֣ךְ יְהוָ֔ה לְ/הֵרָאֹ֖ה אֶל מָנ֣וֹחַ וְ/אֶל אִשְׁתּ֑/וֹ אָ֚ז יָדַ֣ע מָנ֔וֹחַ כִּֽי מַלְאַ֥ךְ יְהוָ֖ה הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/021.yaml
  text: And the angel of Yahweh did not appear again to Manoah and to his wife[a]. Then Manoah knew that he was the angel of Yahweh.
translation:
  language: id
  text: Malaikat Yahweh tidak menampakkan diri lagi kepada Manoah dan istrinya.[a] Maka Manoah tahu bahwa dia adalah malaikat Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “utusan Yahweh.” Kata Ibrani yang digunakan dapat berarti “utusan” atau “malaikat”; dalam konteks ini kata itu merujuk kepada sosok adikodrati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא יָסַף עוֹד ... לְהֵרָאֹה
  choice: tidak menampakkan diri lagi
  rationale: Gabungan יָסַף dengan עוֹד dan infinitif menyatakan bahwa tindakan itu tidak terjadi lagi. Bentuk Niphal לְהֵרָאֹה secara alami diterjemahkan 'menampakkan diri' dalam konteks tokoh adikodrati.
- source_word: מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  rationale: מַלְאַךְ dapat berarti 'utusan' atau 'malaikat'. Konteks narasi menunjukkan sosok adikodrati, sehingga 'malaikat' dipakai dalam teks, sementara alternatif leksikal dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', sehingga nama perjanjian dalam teks sumber tetap tampak.
- source_word: אֶל מָנוֹחַ וְאֶל אִשְׁתּוֹ
  choice: kepada Manoah dan istrinya
  rationale: Pengulangan אֶל tidak perlu diulang dalam bahasa Indonesia karena satu preposisi sudah mencakup kedua objek secara jelas dan alami.
- source_word: אָז יָדַע מָנוֹחַ
  choice: Maka Manoah tahu
  rationale: אָז menandai hasil atau kelanjutan berupa pengenalan Manoah. 'Maka' mengalir alami dalam narasi, sedangkan 'tahu' mempertahankan inti makna יָדַע.
- source_word: כִּי מַלְאַךְ יְהוָה הוּא
  choice: bahwa dia adalah malaikat Yahweh
  rationale: הוּא merujuk kepada sosok yang telah ditemui. Kata 'dia' mempertahankan rujukan personal tanpa menambahkan identifikasi teologis di luar teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama יהוה secara langsung. 'Yahweh' mempertahankan nama itu alih-alih menggantinya dengan gelar.
- issue: Identitas מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  alternative: utusan Yahweh
  rationale: Konteks menunjukkan sosok adikodrati, tetapi terjemahan tidak menyamakan sosok itu secara eksplisit dengan Yahweh atau dengan pribadi teologis tertentu. Dengan demikian, ketegangan naratif tetap dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. 'Menampakkan diri' dipilih daripada 'muncul' untuk mencerminkan verba sumber dan sifat perjumpaan tersebut.
