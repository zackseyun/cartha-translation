  terminology: “Abdi Allah,” “malaikat Allah,” dan “sangat menggentarkan” merupakan pilihan yang tepat dan mapan. “Malaikat Allah” tanpa artikel tidak memaksakan apakah yang dimaksud seorang malaikat atau sosok tertentu, sebagaimana bahasa Indonesia secara alami tidak menandai ketentuan nomina seperti bahasa Ibrani.
