  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/תָּבֹ֣א הָ/אִשָּׁ֗ה וַ/תֹּ֣אמֶר לְ/אִישָׁ/הּ֮ לֵ/אמֹר֒ אִ֤ישׁ הָ/אֱלֹהִים֙ בָּ֣א אֵלַ֔/י וּ/מַרְאֵ֕/הוּ כְּ/מַרְאֵ֛ה מַלְאַ֥ךְ הָ/אֱלֹהִ֖ים נוֹרָ֣א מְאֹ֑ד וְ/לֹ֤א שְׁאִלְתִּ֨י/הוּ֙ אֵֽי מִ/זֶּ֣ה ה֔וּא וְ/אֶת שְׁמ֖/וֹ לֹֽא הִגִּ֥יד לִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/006.yaml
  text: Then the woman came and said to her husband[a], “A man of God came to me, and his appearance was like the appearance of an angel of God, very fearsome. I did not ask him where he was from[b], and he did not tell me his name.”
translation:
  language: id
  text: Kemudian perempuan itu datang dan berkata kepada suaminya, “Seorang abdi Allah datang kepadaku. Rupanya seperti rupa malaikat Allah[a], sangat menggentarkan[b]. Aku tidak bertanya kepadanya dari mana asalnya, dan ia tidak memberitahukan namanya kepadaku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “utusan Allah.” Kata Ibrani yang sama dapat berarti malaikat atau utusan; dalam konteks ini penampilannya menunjukkan sosok adikodrati.
    reason: lexical_alternative
  - marker: b
    text: Atau, “sangat menakjubkan” atau “sangat menakutkan.” Kata Ibrani ini menggambarkan sesuatu yang membangkitkan rasa gentar dan takjub yang mendalam.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִשָּׁה
  choice: perempuan itu
  rationale: Bentuk dengan kata sandang menunjuk kepada istri Manoah yang sudah hadir dalam konteks. Hubungan perkawinannya dinyatakan secara alami melalui frasa berikutnya, ‘kepada suaminya’.
- source_word: לְאִישָׁהּ
  choice: kepada suaminya
  rationale: Dalam konteks perkawinan, אִישׁ dengan sufiks orang ketiga feminin tunggal secara idiomatis berarti ‘suaminya’.
- source_word: אִישׁ הָאֱלֹהִים
  choice: seorang abdi Allah
  rationale: ‘Abdi Allah’ merupakan padanan Indonesia yang lazim dan bermartabat bagi gelar Ibrani ini; ‘seorang’ mempertahankan pengenalan tokoh yang belum tertentu dalam laporan perempuan itu.
- source_word: וּמַרְאֵהוּ כְּמַרְאֵה
  choice: Rupanya seperti rupa
  rationale: Pengulangan מַרְאֶה dipertahankan sejauh wajar dalam bahasa Indonesia agar perbandingan eksplisit dalam bahasa Ibrani tetap terasa.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: malaikat Allah
  rationale: Bahasa Indonesia tidak mewajibkan artikel tentu atau tak tentu, sehingga ungkapan ini secara alami mempertahankan keterbukaan mengenai apakah perempuan itu mengenali sosok tertentu. ‘Malaikat’ sesuai dengan konteks penampakan adikodrati.
- source_word: נוֹרָא מְאֹד
  choice: sangat menggentarkan
  rationale: Ungkapan ini menyatakan penampilan yang membangkitkan rasa takut sekaligus kedahsyatan; ‘menggentarkan’ lebih alami daripada ‘menakutkan’ dan tidak melemahkan unsur rasa gentar.
- source_word: אֵי מִזֶּה הוּא
  choice: dari mana asalnya
  rationale: Ungkapan Ibrani menanyakan asal-usul atau tempat datangnya seseorang; bentuk Indonesia ini ringkas dan idiomatis.
- source_word: וְאֶת שְׁמוֹ לֹא הִגִּיד לִי
  choice: ia tidak memberitahukan namanya kepadaku
  rationale: Padanan ini menyampaikan arti ‘memberitahukan atau menyatakan’ dalam bentuk percakapan yang alami tanpa menambah informasi.
theological_decisions:
- issue: Identitas מַלְאַךְ הָאֱלֹהִים dalam perkembangan narasi
  choice: malaikat Allah
  alternative: seorang malaikat Allah; Malaikat Allah; utusan Allah
  rationale: 'Bentuk tanpa artikel dalam bahasa Indonesia mempertahankan ketegangan naratif: sosok itu dibandingkan dengan malaikat Allah, tetapi tingkat pengenalan perempuan tersebut tidak dipastikan secara berlebihan. Huruf kecil juga menghindari pemaksaan kesimpulan teologis dari bagian narasi yang lebih kemudian.'
- issue: Cakupan perbandingan dalam כְּמַרְאֵה מַלְאַךְ הָאֱלֹהִים
  choice: rupanya seperti rupa malaikat Allah
  alternative: ia tampak sebagai malaikat Allah
  rationale: Terjemahan mempertahankan perbandingan eksplisit ‘seperti’ dan tidak mengubah laporan perempuan itu menjadi identifikasi langsung.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. ‘Abdi Allah’ dipilih sebagai gelar yang dikenal luas, sedangkan ‘sangat menggentarkan’ menjaga perpaduan takut dan takjub. Semua penanda catatan kaki ditempatkan tepat setelah ungkapan yang dijelaskan.
