  source_fidelity: 'Teks Indonesia secara setia mencerminkan urutan dan isi Ibrani: perempuan itu datang kepada suaminya, menyebut pengunjung itu seorang abdi Allah, melaporkan perbandingan penampilannya dengan malaikat Allah, serta menyatakan bahwa ia tidak menanyakan asalnya dan tidak diberi tahu namanya. Perbandingan eksplisit dalam כְּמַרְאֵה dipertahankan dan tidak diubah menjadi identifikasi langsung.'
