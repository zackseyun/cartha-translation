base_translation:
  language: en
  yaml_path: translation/ot/judges/013/018.yaml
  text: And the angel of Yahweh said to him[a], “Why do you ask my name, seeing it is wonderful?”
translation:
  language: id
  text: Lalu malaikat Yahweh berkata kepadanya, “Mengapa engkau menanyakan namaku, padahal namaku ajaib[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melampaui pengertian,” “tak terselami,” atau mungkin “rahasia.” Kata Ibrani ini menunjuk pada sesuatu yang luar biasa atau terlalu menakjubkan untuk dipahami sepenuhnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  rationale: מַלְאַךְ dapat berarti utusan atau malaikat; dalam konteks penampakan adikodrati ini, “malaikat” paling alami. Nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh” untuk mempertahankan nama pribadi dalam teks sumber.
- source_word: לָמָּה זֶּה
  choice: Mengapa
  rationale: Ungkapan ini memperkenalkan pertanyaan retoris; “Mengapa” menyampaikan dayanya secara alami dalam bahasa Indonesia.
- source_word: תִּשְׁאַל לִשְׁמִי
  choice: engkau menanyakan namaku
  rationale: Konstruksi שׁאל dengan ל dan “nama” berarti menanyakan atau mencari tahu nama seseorang. Bentuk ini langsung, jelas, dan wajar.
- source_word: וְהוּא
  choice: Nama itu
  rationale: Pronomina maskulin tunggal merujuk secara alami kepada שְׁמִי, “namaku”. Mengulang “nama” menghindari ketidakjelasan pronomina bahasa Indonesia tanpa mengubah makna.
- source_word: פֶלִאי
  choice: ajaib
  rationale: Kata ini menyatakan sesuatu yang luar biasa, menakjubkan, atau melampaui pemahaman biasa. “Ajaib” ringkas dan mempertahankan kemungkinan gaung teologis tanpa menafsirkannya secara berlebihan.
theological_decisions:
- issue: Bobot teofanik atau kristologis yang mungkin terkandung dalam פֶלִאי
  choice: Menerjemahkannya secara leksikal sebagai “ajaib” tanpa menetapkan identitas malaikat dalam terjemahan.
  alternative: “melampaui pengertian,” “tak terselami,” atau memperlakukannya sebagai gelar khusus
  rationale: Ayat ini dapat mengundang refleksi teologis mengenai identitas malaikat Yahweh, tetapi bahasa Ibraninya tidak mengharuskan terjemahan untuk menyelesaikan persoalan itu. “Ajaib” mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Engkau” dipakai dalam dialog langsung bernuansa Alkitabiah tanpa menjadi arkais. Klausa terakhir dibuat eksplisit sebagai “Nama itu ajaib” agar rujukan pronomina jelas dalam bahasa Indonesia.
