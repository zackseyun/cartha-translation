id: JDG.13.4
reference: Judges 13:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּה֙ הִשָּׁ֣מְרִי נָ֔א וְ/אַל תִּשְׁתִּ֖י יַ֣יִן וְ/שֵׁכָ֑ר וְ/אַל תֹּאכְלִ֖י כָּל טָמֵֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/004.yaml
  text: Now please be careful[a], and do not drink wine or strong drink[c][b], and do not eat anything unclean.
translation:
  language: id
  text: Sekarang, jagalah dirimu baik-baik[a]. Jangan minum anggur atau minuman memabukkan[b], dan jangan makan apa pun yang najis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “waspadalah baik-baik.”
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah minuman beralkohol yang memabukkan selain anggur.
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Penanda waktu dan wacana ini secara alami mengantar petunjuk berikutnya; unsur penghubung וְ tidak perlu diterjemahkan tersendiri dalam bahasa Indonesia.
- source_word: הִשָּׁמְרִי נָא
  choice: jagalah dirimu baik-baik
  rationale: 'Bentuk imperatif Nifal feminin tunggal dari שׁמר memiliki nuansa refleksif: menjaga atau mengawasi diri dengan cermat. Ungkapan ini alami dalam bahasa Indonesia dan menyampaikan daya permintaan נָא tanpa harus menambahkan kata ''tolong''.'
- source_word: וְאַל תִּשְׁתִּי
  choice: Jangan minum
  rationale: Larangan yang ditujukan kepada seorang perempuan; kalimat baru membuat rangkaian petunjuk jelas dan alami.
- source_word: יַיִן
  choice: anggur
  rationale: Padanan langsung bagi minuman anggur dalam konteks ini.
- source_word: וְשֵׁכָר
  choice: atau minuman memabukkan
  rationale: שֵׁכָר menunjuk pada minuman beralkohol yang memabukkan selain anggur. 'Minuman memabukkan' lebih jelas dan lebih tepat daripada 'minuman keras', yang dalam pemakaian modern dapat menyiratkan jenis atau kadar alkohol tertentu.
- source_word: וְאַל תֹּאכְלִי
  choice: dan jangan makan
  rationale: Mempertahankan hubungan koordinatif dengan larangan sebelumnya.
- source_word: כָּל טָמֵא
  choice: apa pun yang najis
  rationale: כָּל dengan kata sifat substantival berarti segala sesuatu yang tergolong najis; 'najis' mempertahankan kategori ritual-perjanjian dan tidak menyempitkannya menjadi sekadar kotor secara fisik.
theological_decisions:
- issue: Makna טָמֵא dalam konteks petunjuk terkait kenaziran
  choice: najis
  alternative: tidak tahir
  rationale: '''Najis'' mempertahankan kategori ritual dalam Taurat dan lazim dipahami dalam bahasa Alkitab Indonesia. ''Tidak tahir'' juga mungkin, tetapi kurang ringkas dan tidak diperlukan untuk menjelaskan kategori tersebut.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Bentuk feminin pada kata kerja Ibrani tercermin secara kontekstual, bukan secara gramatikal, karena imperatif bahasa Indonesia tidak menandai gender. Tanda baca membagi pengantar dan larangan agar alami tanpa menghilangkan urutan perintah Ibrani.
