base_translation:
  language: en
  yaml_path: translation/ot/judges/013/011.yaml
  text: So Manoah arose and went after his wife[a], and came to the man and said to him, “Are you the man who spoke to the woman?” And he said[c][b], “I am.”
translation:
  language: id
  text: Lalu Manoah bangkit dan pergi mengikuti istrinya[a]. Ia mendatangi orang itu dan berkata kepadanya, “Apakah engkau orang yang telah berbicara kepada perempuan itu[b]?” Orang itu menjawab, “Akulah orangnya.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “sesudah istrinya.” Dapat juga diterjemahkan “di belakang istrinya.”'
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani berbunyi “perempuan itu,” bukan “istriku.”
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “Aku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם וַיֵּלֶךְ
  choice: bangkit dan mengikuti
  rationale: Rangkaian verba naratif menyatakan bahwa Manoah segera bertindak lalu pergi di belakang istrinya. “Bangkit” mempertahankan corak narasi Ibrani, sedangkan “mengikuti” menyampaikan arah gerak secara wajar dalam bahasa Indonesia.
- source_word: אַחֲרֵי אִשְׁתּוֹ
  choice: mengikuti istrinya
  rationale: אַחֲרֵי secara harfiah berarti “di belakang/setelah,” tetapi dalam konteks gerak paling alami dipahami sebagai mengikuti istrinya; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: וַיָּבֹא אֶל הָאִישׁ
  choice: Ia mendatangi orang itu
  rationale: בוא dengan אֶל menunjukkan gerak menuju seseorang. “Mendatangi” alami dalam bahasa Indonesia dan “orang itu” mempertahankan penyebutan אִישׁ tanpa memasukkan identitas sang tokoh yang baru diperjelas kemudian.
- source_word: הַאַתָּה הָאִישׁ
  choice: Apakah engkau orang
  rationale: Bentuk tanya dengan pronomina diterjemahkan langsung. “Engkau” memberi register naratif yang santun dan bermartabat tanpa menjadi arkais.
- source_word: אֲשֶׁר דִּבַּרְתָּ אֶל הָאִשָּׁה
  choice: yang telah berbicara kepada perempuan itu
  rationale: Terjemahan mempertahankan אֶל sebagai “kepada” dan הָאִשָּׁה sebagai “perempuan itu,” bukan menggantinya secara kontekstual dengan “istriku.” Aspek lampau dibuat alami dengan “telah.”
- source_word: אָנִי
  choice: Akulah dia
  rationale: Jawaban Ibrani secara harfiah hanya “Aku.” Dalam konteks pertanyaan identifikasi, “Akulah dia” merupakan jawaban afirmatif yang jelas dan alami, sambil mencatat bentuk harfiahnya dalam catatan kaki.
theological_decisions:
- issue: Identitas pengunjung
  choice: orang itu
  alternative: malaikat itu / utusan itu
  rationale: Ayat ini memakai הָאִישׁ, “orang/laki-laki itu.” Walaupun konteks yang lebih luas mengidentifikasinya sebagai Malaikat TUHAN, terjemahan mempertahankan cara tokoh tersebut tampil pada tahap ini dalam alur narasi.
- issue: Jawaban אָנִי dan kemungkinan gaung teologis
  choice: Akulah dia
  alternative: Aku ada / Akulah Aku
  rationale: Di sini אָנִי adalah jawaban identifikasi biasa terhadap pertanyaan “Apakah engkau orang itu?” Terjemahan tidak memasukkan rumusan nama ilahi atau penegasan ontologis yang tidak dinyatakan oleh teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur naratif dibuat lancar dengan memecah rangkaian panjang menjadi dua kalimat. “Engkau” dipilih untuk dialog Alkitab yang santun; “orang itu” mempertahankan perspektif naratif tanpa mendahului pengungkapan identitas pengunjung.
