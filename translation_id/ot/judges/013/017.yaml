  naturalness: “Siapakah namamu” dapat dipahami, tetapi “Apa namamu” lebih lazim untuk menanyakan nama dalam bahasa Indonesia modern. Susunan “supaya ketika perkataanmu menjadi kenyataan, kami dapat menghormatimu” janggal; tujuan dan waktu lebih alami jika dipisahkan dalam urutan yang jelas.
