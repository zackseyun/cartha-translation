base_translation:
  language: en
  yaml_path: translation/ot/judges/013/017.yaml
  text: Then Manoah said to the angel of Yahweh[a], “What is your name, so that when your words come to pass, we may honor you?”
translation:
  language: id
  text: Lalu Manoah berkata kepada malaikat Yahweh[a], “Apa namamu, supaya kami dapat menghormatimu apabila perkataanmu menjadi kenyataan?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “utusan Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  rationale: מַלְאַךְ dapat berarti 'utusan' atau 'malaikat'. Karena sosok dalam kisah ini ditampilkan secara adikodrati, 'malaikat' merupakan pilihan paling alami, sedangkan nama ilahi יְהוָה dipertahankan sebagai 'Yahweh'.
- source_word: מִי שְׁמֶךָ
  choice: Siapakah namamu
  rationale: Ungkapan Ibrani ini secara harfiah memakai kata tanya 'siapa' dan menanyakan nama. Bentuk ini alami dalam bahasa Indonesia sekaligus mempertahankan nuansa sumber.
- source_word: כִּי
  choice: supaya ketika
  rationale: Dalam kaitan antarklausa ini, כִּי memperkenalkan maksud Manoah mengetahui nama tersebut; unsur waktu yang berkaitan dengan penggenapan disampaikan secara alami bersama klausa berikutnya dengan 'ketika'.
- source_word: יָבֹא דְבָרֶיךָ
  choice: perkataanmu menjadi kenyataan
  rationale: Bentuk Ibrani secara morfologis jamak, tetapi dapat menunjuk pada pesan atau hal yang telah dikatakan. Bentuk tunggal kolektif 'perkataanmu' alami dalam bahasa Indonesia, dan 'menjadi kenyataan' menyampaikan idiom penggenapan.
- source_word: וְכִבַּדְנוּךָ
  choice: kami dapat menghormatimu
  rationale: Bentuk piel dari כבד berarti 'menghormati' atau 'memberi hormat'. 'Dapat menghormatimu' menyampaikan hubungan maksud/hasil tanpa memakai 'memuliakan', yang dapat membawa muatan teologis lebih kuat daripada yang dituntut teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian itu dan sesuai dengan keputusan proyek, tanpa menggantinya dengan gelar.
- issue: Identitas מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  alternative: utusan Yahweh
  rationale: Konteks narasi menampilkan sosok ini secara adikodrati sehingga 'malaikat' paling wajar, tetapi kemungkinan leksikal 'utusan' tetap dicatat tanpa menetapkan identitas teologis sosok itu lebih jauh.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sambil mempertahankan pertanyaan 'Siapakah namamu' dan tidak mempertegas identitas sosok tersebut melampaui teks.
