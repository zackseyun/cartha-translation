source:
  edition: WLC
  text: וַ/יְהִי֩ בַ/עֲל֨וֹת הַ/לַּ֜הַב מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ הַ/שָּׁמַ֔יְמָ/ה וַ/יַּ֥עַל מַלְאַךְ יְהוָ֖ה בְּ/לַ֣הַב הַ/מִּזְבֵּ֑חַ וּ/מָנ֤וֹחַ וְ/אִשְׁתּ/וֹ֙ רֹאִ֔ים וַ/יִּפְּל֥וּ עַל פְּנֵי/הֶ֖ם אָֽרְצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/020.yaml
  text: And when the flame went up from the altar toward heaven[a], the angel of Yahweh went up in the flame of the altar, while Manoah and his wife were watching[b]; and they fell on their faces to the ground.
translation:
  language: id
  text: Ketika nyala api naik dari mezbah menuju langit, Malaikat Yahweh[a] naik dalam nyala api mezbah itu, sementara Manoah dan istrinya sedang menyaksikannya; lalu mereka tersungkur dengan muka ke tanah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Utusan Yahweh.” Kata Ibrani yang dipakai dapat berarti “malaikat” atau “utusan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַעֲלוֹת
  choice: Ketika ... naik
  rationale: Konstruksi ini memperkenalkan anak kalimat waktu dalam alur narasi; bentuk ini alami dalam bahasa Indonesia tanpa mempertahankan idiom Ibrani secara kaku.
- source_word: הַלַּהַב
  choice: nyala api
  rationale: לַהַב menunjuk pada nyala atau kobaran api; 'nyala api' konkret, wajar, dan sesuai konteks persembahan.
- source_word: הַשָּׁמַיְמָה
  choice: menuju langit
  rationale: Akhiran direktif menyatakan gerak ke arah langit, bukan keharusan bahwa tujuan akhirnya dicapai.
- source_word: מַלְאַךְ יְהוָה
  choice: Malaikat Yahweh
  rationale: Dalam konteks ini sosoknya bersifat adikodrati, sehingga 'Malaikat' paling alami; nama ilahi יהוה dipertahankan sebagai 'Yahweh'. Catatan kaki menjaga kemungkinan leksikal 'utusan'.
- source_word: בְּלַהַב הַמִּזְבֵּחַ
  choice: dalam nyala api mezbah itu
  rationale: Preposisi ב dipahami secara lokatif, mempertahankan gambaran bahwa Malaikat naik di dalam nyala api tanpa menjelaskan mekanismenya lebih jauh.
- source_word: וּמָנוֹחַ וְאִשְׁתּוֹ רֹאִים
  choice: Manoah dan istrinya menyaksikannya
  rationale: Partisipel menyatakan bahwa mereka sedang melihat peristiwa itu; 'menyaksikannya' ringkas dan alami dalam narasi Indonesia.
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם אָרְצָה
  choice: lalu mereka tersungkur dengan muka ke tanah
  rationale: '''Tersungkur dengan muka ke tanah'' menyampaikan postur harfiah idiom Ibrani sekaligus terdengar wajar dan bermartabat dalam bahasa Indonesia.'
theological_decisions:
- issue: Identitas מַלְאַךְ יְהוָה
  choice: Malaikat Yahweh
  alternative: Utusan Yahweh; penampakan ilahi
  rationale: Teks menyebut sosok ini sebagai malaikat/utusan Yahweh tetapi tidak secara eksplisit menetapkan hakikat metafisiknya. Terjemahan mempertahankan sebutan teks dan tidak memutuskan apakah sosok itu malaikat ciptaan atau manifestasi ilahi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang alami dan bermartabat. Struktur kalimat dipecah agar jelas bagi pembaca umum, sementara urutan kejadian, arah gerak, dan ketegangan mengenai identitas Malaikat Yahweh tetap dipertahankan.
