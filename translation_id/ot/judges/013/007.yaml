    issue: Catatan kaki b menyatakan bahwa nazir dikhususkan “melalui suatu nazar atau status pengkhususan khusus.”
    rationale: Penjelasan ini tidak presisi untuk konteks Simson dan berisiko menyiratkan bahwa ia sendiri mengucapkan nazar. Ibrani hanya memakai istilah teknis nazir dan menghubungkannya dengan Allah; catatan sebaiknya menjelaskan status khusus itu tanpa menentukan mekanismenya.
  - severity: low
