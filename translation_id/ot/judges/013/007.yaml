base_translation:
  language: en
  yaml_path: translation/ot/judges/013/007.yaml
  text: For he said to me[a], ‘Look, you will conceive and bear a son. So now, do not drink wine or strong drink, and do not eat anything unclean[b], for the boy will be a Nazirite of God from the womb until the day of his death.’
translation:
  language: id
  text: Ia berkata kepadaku, “Lihatlah, engkau akan mengandung dan melahirkan seorang anak laki-laki.[a] Jadi sekarang, jangan minum anggur atau minuman memabukkan, dan jangan makan apa pun yang najis, sebab anak itu akan menjadi seorang nazir Allah[b] sejak dalam kandungan sampai hari kematiannya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Lihatlah, engkau mengandung dan akan melahirkan seorang anak laki-laki.” Dalam konteks ini, kata-kata tersebut dapat dipahami sebagai pemberitahuan tentang apa yang akan terjadi.'
    reason: lexical_alternative
  - marker: b
    text: Nazir adalah orang yang dikhususkan bagi Allah; istilah ini menunjuk pada status keagamaan khusus.
    reason: technical_term
lexical_decisions:
- source_word: וַיֹּאמֶר לִי
  choice: Ia berkata kepadaku
  rationale: Bentuk Ibrani secara langsung berarti ‘dan ia berkata kepadaku’. Dalam bahasa Indonesia, konjungsi pembuka tidak diperlukan karena kalimat ini melanjutkan laporan perkataan dalam konteks sebelumnya.
- source_word: הִנָּךְ הָרָה וְיֹלַדְתְּ בֵּן
  choice: Lihatlah, engkau akan mengandung dan melahirkan seorang anak laki-laki
  rationale: הִנָּךְ הָרָה secara bentuk dapat dibaca ‘lihatlah, engkau sedang mengandung’, tetapi dalam konteks pemberitahuan kelahiran konstruksi itu wajar dipahami secara prediktif. ‘Anak laki-laki’ mempertahankan jenis kelamin yang dinyatakan oleh בֵּן.
- source_word: וְעַתָּה
  choice: Jadi sekarang
  rationale: Ungkapan ini menandai peralihan dari pemberitahuan kepada petunjuk yang timbul darinya.
- source_word: יַיִן וְשֵׁכָר
  choice: anggur atau minuman memabukkan
  rationale: יַיִן adalah anggur, sedangkan שֵׁכָר menunjuk minuman beralkohol yang memabukkan selain anggur tanpa menentukan satu jenis modern tertentu.
- source_word: כָּל טֻמְאָה
  choice: apa pun yang najis
  rationale: Ungkapan ini merujuk pada sesuatu yang dianggap najis, khususnya dalam konteks larangan makan, dan diterjemahkan secara alami tanpa mengubahnya menjadi gagasan abstrak ‘kenajisan’.
- source_word: נְזִיר אֱלֹהִים
  choice: seorang nazir Allah
  rationale: נָזִיר adalah istilah teknis bagi orang yang dikhususkan melalui status kenaziran. Transliterasi ‘nazir’ mempertahankan latar hukum dan religius istilah tersebut; ‘Allah’ mempertahankan hubungan genitif dalam ungkapan Ibrani.
- source_word: מִן הַבֶּטֶן
  choice: sejak dalam kandungan
  rationale: Pilihan ini mempertahankan gambaran rahim atau kandungan dan menyatakan titik awal status anak itu secara alami dalam bahasa Indonesia.
- source_word: עַד יוֹם מוֹתוֹ
  choice: sampai hari kematiannya
  rationale: Ini merupakan padanan langsung yang mempertahankan batas waktu eksplisit dalam teks Ibrani.
theological_decisions:
- issue: Daya waktu dalam pemberitahuan kehamilan
  choice: engkau akan mengandung dan melahirkan seorang anak laki-laki
  alternative: engkau sedang mengandung dan akan melahirkan seorang anak laki-laki
  rationale: Kata הָרָה secara gramatikal dapat menyatakan keadaan ‘mengandung’, tetapi konteks pemberitahuan mendukung makna prediktif. Catatan kaki mempertahankan kemungkinan bentuk yang lebih harfiah tanpa membingungkan teks utama.
- issue: Sebutan kenaziran anak itu
  choice: seorang nazir Allah
  alternative: seorang yang dikhususkan bagi Allah
  rationale: Istilah teknis נָזִיר dipertahankan agar status khusus yang terkait dengan kenaziran tidak diratakan menjadi pengudusan umum. Bentuk ‘nazir Allah’ juga membiarkan hubungan antara nazir dan Allah tetap ringkas sebagaimana dalam bahasa sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat namun mudah dipahami. ‘Engkau’ dipakai karena ini kutipan langsung dalam konteks Alkitab, sedangkan ‘minuman memabukkan’ menghindari pembatasan שֵׁכָר pada satu jenis minuman tertentu.
