  text: וַ/יֵּרָ֥א מַלְאַךְ יְהוָ֖ה אֶל הָ/אִשָּׁ֑ה וַ/יֹּ֣אמֶר אֵלֶ֗י/הָ הִנֵּה נָ֤א אַתְּ עֲקָרָה֙ וְ/לֹ֣א יָלַ֔דְתְּ וְ/הָרִ֖ית וְ/יָלַ֥דְתְּ בֵּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/003.yaml
  text: And the angel of the LORD appeared to the woman and said to her, “Look, please—you are barren and have not borne children, but you will conceive and bear a son.”
translation:
  language: id
  text: Malaikat TUHAN menampakkan diri kepada perempuan itu dan berkata kepadanya, “Ketahuilah, engkau mandul dan belum pernah melahirkan, tetapi engkau akan mengandung dan melahirkan seorang anak laki-laki.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: Malaikat TUHAN
  rationale: Mempertahankan sebutan utusan ilahi dan mengikuti kebiasaan bahasa Indonesia untuk menampilkan nama perjanjian YHWH sebagai TUHAN.
- source_word: הִנֵּה נָא
  choice: Ketahuilah
  rationale: Menyampaikan penarik perhatian הִנֵּה yang diperhalus oleh נָא secara alami dan bermartabat, tanpa menjadikannya permohonan harfiah yang kaku.
- source_word: עֲקָרָה
  choice: mandul
  rationale: Padanan langsung dan lazim bagi keadaan tidak dapat memperoleh keturunan dalam konteks ini.
- source_word: וְלֹא יָלַדְתְּ
  choice: dan belum pernah melahirkan
  rationale: Bentuk perfektum menyatakan bahwa sampai saat itu perempuan tersebut belum melahirkan; konteks mendukung 'belum pernah'.
- source_word: וְהָרִית וְיָלַדְתְּ בֵּן
  choice: tetapi engkau akan mengandung dan melahirkan seorang anak laki-laki
  rationale: Rangkaian bentuk verbal dipahami sebagai pemberitahuan masa depan yang berlawanan dengan keadaan sekarang; 'anak laki-laki' menerjemahkan בֵּן secara natural.
theological_decisions:
- issue: Identitas מַלְאַךְ יְהוָה
  choice: Malaikat TUHAN
  alternative: utusan TUHAN
  rationale: Terjemahan tradisional ini mempertahankan ketegangan naratif mengenai hubungan sang malaikat dengan TUHAN tanpa menambahkan identifikasi teologis tertentu.
- issue: Hubungan antarklausa sebelum janji kelahiran
  choice: tetapi
  alternative: dan
  rationale: Waw dapat menandai kelanjutan, tetapi di sini isi nubuat berkontras dengan kemandulan dan belum adanya kelahiran; 'tetapi' membuat hubungan wacana alami tanpa mengubah isi.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina 'engkau' dipakai untuk sapaan tunggal dalam tuturan bernuansa Alkitabiah; tidak ada catatan kaki yang diperlukan.
