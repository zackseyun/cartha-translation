reference: Judges 13:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּי֩ הִנָּ֨/ךְ הָרָ֜ה וְ/יֹלַ֣דְתְּ בֵּ֗ן וּ/מוֹרָה֙ לֹא יַעֲלֶ֣ה עַל רֹאשׁ֔/וֹ כִּֽי נְזִ֧יר אֱלֹהִ֛ים יִהְיֶ֥ה הַ/נַּ֖עַר מִן הַ/בָּ֑טֶן וְ/ה֗וּא יָחֵ֛ל לְ/הוֹשִׁ֥יעַ אֶת יִשְׂרָאֵ֖ל מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/005.yaml
  text: For behold[a], you are pregnant and will bear a son. No razor shall come upon his head, for the boy shall be a Nazirite of God from the womb, and he will begin to save Israel from the hand of the Philistines.
translation:
  language: id
  text: Sebab lihatlah, engkau sedang mengandung dan akan melahirkan seorang anak laki-laki. Pisau cukur tidak boleh menyentuh kepalanya, sebab sejak dalam kandungan anak itu akan menjadi seorang nazir Allah. Ia akan mulai menyelamatkan[a] Israel dari tangan orang Filistin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membebaskan”. Kata kerja Ibrani ini dapat berarti “menyelamatkan” atau “membebaskan”, sesuai konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּךְ
  choice: lihatlah
  rationale: Partikel deiktis ini mengarahkan perhatian dan memberi tekanan pada pengumuman; 'lihatlah' mempertahankan daya serunya dalam bahasa Indonesia modern.
- source_word: הָרָה
  choice: sedang mengandung
  rationale: Bentuk ini menyatakan keadaan kini, bukan tindakan akan mulai mengandung; 'sedang mengandung' memperjelas nilai predikatifnya.
- source_word: וְיֹלַדְתְּ בֵּן
  choice: dan akan melahirkan seorang anak laki-laki
  rationale: Dalam konteks pemberitahuan, bentuk ini menunjuk pada kelahiran yang akan datang; ungkapan ini alami dan jelas.
- source_word: מוֹרָה לֹא יַעֲלֶה עַל רֹאשׁוֹ
  choice: Pisau cukur tidak boleh menyentuh kepalanya
  rationale: Mempertahankan larangan khusus terhadap pisau cukur sambil mengungkapkan idiom Ibrani secara wajar dalam bahasa Indonesia.
- source_word: נְזִיר אֱלֹהִים
  choice: seorang nazir Allah
  rationale: '''Nazir'' mempertahankan istilah teknis bagi orang yang dikhususkan, sedangkan ''Allah'' mencerminkan hubungan genitif dalam teks.'
- source_word: מִן הַבָּטֶן
  choice: sejak dalam kandungan
  rationale: Mempertahankan penekanan bahwa pengkhususan itu berlaku sejak masa dalam rahim, bukan sekadar sejak kelahiran.
- source_word: יָחֵל
  choice: akan mulai
  rationale: Verba ini secara eksplisit menandai permulaan tindakan dan penting bagi gambaran peran anak tersebut yang memulai pembebasan Israel.
- source_word: לְהוֹשִׁיעַ
  choice: menyelamatkan
  rationale: Kata kerja ini dapat berarti menyelamatkan atau membebaskan; 'menyelamatkan' dipakai dalam teks utama dan alternatif kontekstual dicatat.
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: dari tangan orang Filistin
  rationale: Terjemahan ini mempertahankan citra Ibrani tentang tangan sebagai kuasa atau kekuasaan yang menindas.
theological_decisions:
- issue: Sifat pengkhususan Simson
  choice: sejak dalam kandungan anak itu akan menjadi seorang nazir Allah
  alternative: sejak lahir anak itu akan dikhususkan bagi Allah
  rationale: Teks memakai istilah teknis נְזִיר dan secara eksplisit menyebut kandungan; terjemahan utama mempertahankan keduanya tanpa menggeneralisasi bentuk pengkhususannya.
- issue: Cakupan peran anak itu dalam penyelamatan Israel
  choice: akan mulai menyelamatkan Israel
  alternative: akan menyelamatkan Israel
  rationale: יָחֵל menyatakan permulaan. Menghilangkan 'mulai' akan melebihkan cakupan perannya dan menghapus ketegangan naratif bahwa ia memulai, bukan menuntaskan, penyelamatan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah teknis 'nazir' dipertahankan; susunan kalimat dibuat alami tanpa menghilangkan keadaan kini pada הָרָה, citra 'tangan', atau penekanan bahwa peran anak itu baru memulai penyelamatan.
