source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מָנ֜וֹחַ אֶת גְּדִ֤י הָ/עִזִּים֙ וְ/אֶת הַ/מִּנְחָ֔ה וַ/יַּ֥עַל עַל הַ/צּ֖וּר לַֽ/יהוָ֑ה וּ/מַפְלִ֣א לַ/עֲשׂ֔וֹת וּ/מָנ֥וֹחַ וְ/אִשְׁתּ֖/וֹ רֹאִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/019.yaml
  text: So Manoah took the young goat and the grain offering[a], and offered them on the rock to Yahweh, and he did a wondrous thing while Manoah and his wife were watching.
translation:
  language: id
  text: Lalu Manoah mengambil seekor anak kambing dan kurban sajian, lalu mempersembahkan keduanya di atas batu karang kepada Yahweh. Ia melakukan sesuatu yang ajaib[a] sementara Manoah dan istrinya sedang menyaksikan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “malaikat Yahweh melakukan sesuatu yang ajaib.” Teks Ibrani sangat ringkas dan tidak menyebut ulang subjeknya secara eksplisit, meskipun konteks menunjuk kepada utusan Yahweh.
    reason: alternative_reading
lexical_decisions:
- source_word: גְּדִי הָעִזִּים
  choice: seekor anak kambing
  rationale: Ungkapan Indonesia yang alami untuk kambing muda dan sesuai dengan hewan persembahan dalam konteks ini.
- source_word: הַמִּנְחָה
  choice: kurban sajian
  rationale: Dalam konteks ibadah dan persembahan, מִנְחָה menunjuk pada persembahan bahan pangan; istilah ini cukup khusus tanpa mempersempitnya secara tidak perlu menjadi biji-bijian.
- source_word: וַיַּעַל עַל הַצּוּר לַיהוָה
  choice: mempersembahkannya di atas batu karang kepada Yahweh
  rationale: Dalam konteks kurban, עלה menyatakan tindakan mempersembahkan. Pronomina -nya secara alami merujuk pada keseluruhan persembahan yang baru disebut.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai Yahweh, sejalan dengan lapisan konsultasi yang diberikan dan untuk mempertahankan nama diri dalam teks sumber.
- source_word: וּמַפְלִא לַעֲשׂוֹת
  choice: Dia melakukan sesuatu yang ajaib
  rationale: Klausa Ibrani sangat ringkas dan tidak menyebut ulang subjek. Bentuk ini mempertahankan subjek maskulin tunggal secara kontekstual tanpa menambahkan sebutan 'malaikat Yahweh' ke dalam teks utama.
- source_word: רֹאִים
  choice: menyaksikannya
  rationale: Partisip ini menggambarkan Manoah dan istrinya sebagai saksi yang sedang melihat berlangsungnya peristiwa tersebut.
theological_decisions:
- issue: Subjek tersirat dalam וּמַפְלִא לַעֲשׂוֹת
  choice: Memakai 'Dia' tanpa menyebut identitas subjek secara eksplisit.
  alternative: Menyatakan secara eksplisit, 'malaikat Yahweh melakukan sesuatu yang ajaib,' atau memakai bentuk impersonal, 'terjadilah sesuatu yang ajaib.'
  rationale: Konteks menunjuk kepada utusan Yahweh sebagai pelaku, tetapi klausa Ibrani tidak menyebut ulang subjeknya. Terjemahan ini mempertahankan elipsis dan ketegangan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kurban sajian' dipakai sebagai istilah ibadah yang mudah dipahami; susunan kalimat mempertahankan alur naratif serta ambiguitas subjek dalam teks Ibrani.
