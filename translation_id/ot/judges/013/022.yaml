  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר מָנ֛וֹחַ אֶל אִשְׁתּ֖/וֹ מ֣וֹת נָמ֑וּת כִּ֥י אֱלֹהִ֖ים רָאִֽינוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/022.yaml
  text: And Manoah said to his wife[a], “We will surely die, because we have seen God.”
translation:
  language: id
  text: Lalu Manoah berkata kepada istrinya, “Kita pasti mati, sebab kita telah melihat Allah[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seorang dewa” atau “sosok ilahi.” Kata Ibrani אֱלֹהִים dalam konteks tertentu dapat merujuk secara lebih luas kepada suatu sosok ilahi, tetapi di sini konteks lebih mendukung “Allah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk naratif dengan waw-konsekutif melanjutkan rangkaian peristiwa; “lalu” alami dalam narasi Indonesia tanpa memberi nuansa sebab-akibat yang berlebihan.
- source_word: מָנוֹחַ
  choice: Manoah
  rationale: Nama diri ditransliterasikan sesuai bentuk yang lazim dalam bahasa Indonesia.
- source_word: אֶל אִשְׁתּוֹ
  choice: kepada istrinya
  rationale: Ungkapan relasional ini secara alami dan tepat berarti “kepada istrinya” dalam konteks.
- source_word: מוֹת נָמוּת
  choice: Kita pasti mati
  rationale: Infinitif absolut yang diikuti bentuk finit dari akar yang sama menegaskan kepastian tindakan; “pasti mati” mempertahankan daya tekan itu secara alami.
- source_word: כִּי
  choice: sebab
  rationale: Partikel ini memperkenalkan alasan bagi ketakutan Manoah; “sebab” jelas, ringkas, dan sesuai dengan ragam naratif yang bermartabat.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Dalam konteks ini, seruan Manoah paling mungkin merujuk kepada Allah. Namun, keluasan makna istilah Ibrani tersebut dipertahankan dalam catatan kaki.
- source_word: רָאִינוּ
  choice: kita telah melihat
  rationale: Bentuk perfektif orang pertama jamak menunjuk pada pengalaman yang baru terjadi dan akibatnya masih dirasakan; “telah melihat” menyampaikan hubungan itu dengan alami.
theological_decisions:
- issue: Makna אֱלֹהִים dalam seruan Manoah setelah penampakan malaikat TUHAN
  choice: Allah
  alternative: seorang dewa atau sosok ilahi
  rationale: Konteks Hakim-Hakim 13 dan ketakutan bahwa melihat Allah mengakibatkan kematian mendukung “Allah”. Catatan kaki tetap mengakui kemungkinan leksikal yang lebih luas dan tidak menyelesaikan secara paksa misteri hubungan antara malaikat TUHAN dan Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. “Kita” dipakai karena Manoah menyertakan istrinya sebagai lawan bicara. Penanda catatan kaki ditempatkan langsung sesudah kata “Allah”, yaitu kata yang diterangkannya.
