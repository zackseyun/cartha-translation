  text: מִ/כֹּ֣ל אֲשֶׁר יֵצֵא֩ מִ/גֶּ֨פֶן הַ/יַּ֜יִן לֹ֣א תֹאכַ֗ל וְ/יַ֤יִן וְ/שֵׁכָר֙ אַל תֵּ֔שְׁתְּ וְ/כָל טֻמְאָ֖ה אַל תֹּאכַ֑ל כֹּ֥ל אֲשֶׁר צִוִּיתִ֖י/הָ תִּשְׁמֹֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/014.yaml
  text: She must not eat anything that comes from the grapevine[a], and she must not drink wine or strong drink, and she must not eat anything unclean. She must keep all that I commanded her.
translation:
  language: id
  text: Ia tidak boleh makan apa pun yang berasal dari pohon anggur[a]. Ia tidak boleh minum anggur atau minuman memabukkan, dan tidak boleh makan apa pun yang najis. Ia harus menaati semua yang telah kuperintahkan kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dari segala sesuatu yang keluar dari pohon anggur,” yaitu segala sesuatu yang berasal dari pohon anggur.'
    reason: Menjelaskan ungkapan Ibrani yang idiomatis serta cakupannya yang luas.
lexical_decisions:
- source_word: מִכֹּל אֲשֶׁר יֵצֵא מִגֶּפֶן הַיַּיִן
  choice: apa pun yang berasal dari pohon anggur
  rationale: Ungkapan ini bersifat menyeluruh dan mencakup segala sesuatu yang dihasilkan dari pohon anggur. Pilihan ini mempertahankan daya verbal יֵצֵא sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: לֹא תֹאכַל
  choice: ia tidak boleh makan
  rationale: Bentuk larangan ini diterjemahkan dengan 'tidak boleh' untuk menyampaikan kewajiban secara jelas dan wajar dalam bahasa Indonesia modern.
- source_word: יַיִן
  choice: anggur
  rationale: Padanan baku untuk minuman hasil fermentasi yang dimaksud oleh יַיִן; konteks membedakannya dari pohon anggur.
- source_word: שֵׁכָר
  choice: minuman memabukkan
  rationale: Istilah ini menunjuk pada minuman beralkohol selain anggur tanpa membatasi maknanya pada jenis tertentu. 'Minuman keras' mungkin dipahami terlalu sempit sebagai minuman berkadar alkohol tinggi.
- source_word: אַל תֵּשְׁתְּ
  choice: ia tidak boleh minum
  rationale: Larangan dengan אַל disampaikan secara alami dan tegas melalui 'tidak boleh'.
- source_word: כָל טֻמְאָה
  choice: apa pun yang najis
  rationale: '''Najis'' mempertahankan kategori kenajisan dalam tata ibadah dan hukum Taurat, sedangkan ungkapan ''apa pun'' menjaga keluasan frasa Ibrani.'
- source_word: כֹּל אֲשֶׁר צִוִּיתִיהָ
  choice: semua yang telah Kuperintahkan kepadanya
  rationale: Menyampaikan cakupan total frasa Ibrani dan tindakan perintah yang telah diberikan sebelumnya dalam konteks percakapan.
- source_word: תִּשְׁמֹר
  choice: ia harus menaati
  rationale: Dalam konteks perintah, שׁמר berarti memelihara atau melaksanakan dengan taat. 'Menaati' paling alami dan jelas bagi pembaca Indonesia modern.
theological_decisions:
- issue: Cakupan larangan terhadap hasil pohon anggur
  choice: Menerjemahkannya secara menyeluruh sebagai segala sesuatu yang berasal dari pohon anggur.
  alternative: Membatasinya pada buah anggur atau hasil pohon anggur tertentu yang dapat dimakan.
  rationale: Susunan Ibrani 'segala yang keluar dari pohon anggur penghasil anggur' sengaja bersifat luas. Konteksnya menyerupai ketentuan kenaziran, tetapi istilah teknis tambahan tidak dimasukkan ke dalam teks.
- issue: Makna טֻמְאָה
  choice: Menggunakan 'najis'.
  alternative: Menggunakan 'cemar' atau 'tidak tahir'.
  rationale: '''Najis'' mempertahankan kaitan dengan kategori ritual dan hukum Taurat tanpa menentukan bahwa kenajisan di sini semata-mata bersifat moral.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan larangan dipertahankan agar struktur dan penekanan teks Ibrani tetap terasa; pronomina 'ia' mempertahankan rujukan feminin dari konteks tanpa membuat bahasa Indonesia menjadi kaku.
