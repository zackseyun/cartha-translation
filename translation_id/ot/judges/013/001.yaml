id: JDG.13.1
reference: Judges 13:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּסִ֨פוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לַ/עֲשׂ֥וֹת הָ/רַ֖ע בְּ/עֵינֵ֣י יְהוָ֑ה וַ/יִּתְּנֵ֧/ם יְהוָ֛ה בְּ/יַד פְּלִשְׁתִּ֖ים אַרְבָּעִ֥ים שָׁנָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/001.yaml
  text: And the sons of Israel again did what was evil in the eyes of Yahweh[b][a], and Yahweh gave them into the hand of the Philistines for forty years.
translation:
  language: id
  text: Orang Israel kembali melakukan apa yang jahat di mata Yahweh, lalu Yahweh menyerahkan mereka ke dalam kekuasaan orang Filistin selama empat puluh tahun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסִפוּ
  choice: kembali melakukan
  rationale: Konstruksi יסף dengan infinitif menyatakan pengulangan atau kelanjutan. Dalam rumusan siklus kitab Hakim-Hakim, “kembali melakukan” secara alami menunjukkan bahwa Israel mengulangi kejahatannya.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Secara harfiah ungkapan ini berarti “anak-anak Israel,” tetapi berfungsi sebagai sebutan kolektif bagi seluruh bangsa. “Orang Israel” merupakan padanan Indonesia yang alami dan mencakup komunitas itu tanpa menyiratkan hanya laki-laki.
- source_word: לַעֲשׂוֹת הָרַע
  choice: melakukan apa yang jahat
  rationale: Ungkapan baku ini menyatakan tindakan yang dinilai jahat. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan sifat kualitatif dari הָרַע.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Padanan ini mempertahankan metafora Ibrani sekaligus menyampaikan bahwa perbuatan tersebut jahat menurut penilaian Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai “Yahweh,” bukan diganti dengan sebuah gelar.
- source_word: וַיִּתְּנֵם
  choice: menyerahkan mereka
  rationale: Dalam konstruksi dengan “ke dalam tangan,” נתן berarti menyerahkan seseorang kepada kuasa pihak lain. “Menyerahkan” menyampaikan makna tersebut dengan wajar.
- source_word: בְּיַד פְּלִשְׁתִּים
  choice: ke dalam kekuasaan orang Filistin
  rationale: Secara harfiah berarti “ke dalam tangan orang Filistin.” Dalam bahasa Indonesia, “ke dalam kekuasaan” menyampaikan idiom penguasaan dengan jelas dan alami.
- source_word: פְּלִשְׁתִּים
  choice: orang Filistin
  rationale: Ini adalah sebutan baku dalam bahasa Indonesia bagi kelompok bangsa tersebut.
- source_word: אַרְבָּעִים שָׁנָה
  choice: selama empat puluh tahun
  rationale: “Selama” menyatakan durasi yang terkandung dalam frasa Ibrani secara alami.
theological_decisions:
- issue: Penerjemahan nama perjanjian יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama ilahi itu dan tidak menggantinya dengan gelar.
- issue: Sebutan kolektif בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel
  rationale: Ungkapan ini secara idiomatis menunjuk seluruh umat Israel, bukan hanya keturunan laki-laki. “Orang Israel” mempertahankan cakupan korporatnya dalam bahasa Indonesia modern.
- issue: Idiom בְּיַד yang menyatakan dominasi
  choice: ke dalam kekuasaan orang Filistin
  alternative: ke dalam tangan orang Filistin
  rationale: Pilihan utama mengungkapkan makna idiomatisnya dengan jelas tanpa mengubah pernyataan bahwa Yahwehlah yang membuat Israel berada di bawah kuasa Filistin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat mempertahankan urutan dua tindakan utama dalam teks Ibrani, sedangkan idiom yang kurang alami dialihkan menurut maknanya. Tidak diperlukan catatan kaki karena alternatif leksikal tidak menimbulkan ambiguitas penting bagi pembaca.
