  edition: WLC
  text: וַ/תֵּ֤לֶד הָֽ/אִשָּׁה֙ בֵּ֔ן וַ/תִּקְרָ֥א אֶת שְׁמ֖/וֹ שִׁמְשׁ֑וֹן וַ/יִּגְדַּ֣ל הַ/נַּ֔עַר וַֽ/יְבָרְכֵ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/024.yaml
  text: And the woman bore a son and called his name Samson. And the boy grew, and Yahweh blessed him.
translation:
  language: id
  text: Perempuan itu melahirkan seorang anak laki-laki dan menamainya Simson. Anak itu tumbuh, dan Yahweh memberkatinya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: melahirkan
  rationale: Bentuk Qal wayyiqtol dari ילד menyatakan tindakan melahirkan; 'melahirkan' merupakan padanan Indonesia yang langsung dan alami.
- source_word: הָאִשָּׁה
  choice: perempuan itu
  rationale: Teks Ibrani secara eksplisit memakai 'perempuan itu', yang merujuk kembali kepada istri Manoah tanpa menambahkan sebutan yang tidak terdapat dalam ayat ini.
- source_word: בֵּן
  choice: seorang anak laki-laki
  rationale: Dalam konteks kelahiran, בֵּן menunjuk kepada anak berjenis kelamin laki-laki; bentuk ini lebih alami dalam bahasa Indonesia daripada sekadar 'seorang putra' dalam narasi tersebut.
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: menamainya
  rationale: Ungkapan Ibrani harfiah 'memanggil namanya' adalah formula pemberian nama; 'menamainya' menyampaikan maknanya secara wajar dan jelas dalam bahasa Indonesia modern.
- source_word: שִׁמְשׁוֹן
  choice: Simson
  rationale: Nama diri ini memakai bentuk yang sudah baku dan dikenal luas dalam tradisi bahasa Indonesia.
- source_word: וַיִּגְדַּל
  choice: bertumbuh
  rationale: Dalam konteks perkembangan anak, גדל berarti tumbuh; 'bertumbuh' mempertahankan gaya naratif yang ringkas tanpa menyiratkan bahwa ia menjadi agung.
- source_word: הַנַּעַר
  choice: anak itu
  rationale: נַעַר memiliki rentang usia yang luas; sesudah laporan kelahirannya, 'anak itu' paling sesuai dengan konteks perkembangan dan tetap membiarkan usia tepatnya tidak ditentukan.
- source_word: וַיְבָרְכֵהוּ
  choice: memberkatinya
  rationale: Bentuk dari ברך secara langsung berarti 'memberkati' dan mempertahankan bobot teologis tindakan ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga identitas nama pribadi dalam sumber dipertahankan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Sumber memakai Tetragramaton sebagai nama ilahi. 'Yahweh' mempertahankan nama itu melalui transliterasi dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, alami, dan bermartabat. Susunan dua kalimat menjaga alur narasi Ibrani, sedangkan 'menamainya' dipilih sebagai padanan idiomatis bagi formula pemberian nama.
