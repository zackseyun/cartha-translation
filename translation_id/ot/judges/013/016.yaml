source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ מַלְאַ֨ךְ יְהוָ֜ה אֶל מָנ֗וֹחַ אִם תַּעְצְרֵ֨/נִי֙ לֹא אֹכַ֣ל בְּ/לַחְמֶ֔/ךָ וְ/אִם תַּעֲשֶׂ֣ה עֹלָ֔ה לַ/יהוָ֖ה תַּעֲלֶ֑/נָּה כִּ֚י לֹא יָדַ֣ע מָנ֔וֹחַ כִּֽי מַלְאַ֥ךְ יְהוָ֖ה הֽוּא־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/016.yaml
  text: And the angel of Yahweh said to Manoah[a], “If you detain me, I will not eat your food. But if you prepare a burnt offering[b], offer it up to Yahweh.” For Manoah did not know that he was the angel of Yahweh.
translation:
  language: id
  text: Malaikat Yahweh berkata kepada Manoah, “Jika engkau menahan aku, aku tidak akan memakan makananmu.[a] Namun, jika engkau menyiapkan kurban bakaran,[b] persembahkanlah itu kepada Yahweh.” Sebab Manoah tidak tahu bahwa dia adalah malaikat Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “aku tidak akan memakan rotimu.” Di sini “roti” kemungkinan berarti makanan atau jamuan secara umum.
    reason: lexical_alternative
  - marker: b
    text: Atau, “jika engkau membuat kurban bakaran, engkau harus mempersembahkannya kepada Yahweh.” Bahasa Ibrani memakai satu verba untuk membuat atau menyiapkan kurban dan verba lain untuk mempersembahkannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  rationale: מַלְאַךְ dapat berarti utusan atau malaikat. Dalam kisah ini sosok tersebut tampil sebagai utusan adikodrati, sehingga “malaikat” paling sesuai dengan konteks; nama יְהוָה ditransliterasikan sebagai “Yahweh”.
- source_word: אִם תַּעְצְרֵנִי
  choice: sekalipun engkau menahan aku
  rationale: עצר dapat berarti menahan atau membuat seseorang tetap tinggal. Dalam konteks undangan Manoah, “menahan aku” mempertahankan gambaran sumber. Pada klausa ini אִם bernuansa konsesif karena hasilnya tetap berupa penolakan.
- source_word: לֹא אֹכַל בְּלַחְמֶךָ
  choice: aku tidak akan memakan makananmu
  rationale: לֶחֶם secara harfiah berarti roti, tetapi kerap merujuk pada makanan atau jamuan secara umum. “Makananmu” menyampaikan makna idiomatis dalam konteks ini.
- source_word: תַּעֲשֶׂה עֹלָה
  choice: engkau menyiapkan kurban bakaran
  rationale: עשה dengan objek kurban dapat berarti membuat atau menyiapkan. “Menyiapkan” membedakannya dari verba berikutnya yang secara khusus menyatakan tindakan mempersembahkan.
- source_word: עֹלָה
  choice: kurban bakaran
  rationale: Istilah ini menunjuk pada kurban yang dibakar seluruhnya sehingga asapnya naik; “kurban bakaran” merupakan padanan Indonesia yang jelas dan lazim.
- source_word: לַיהוָה תַּעֲלֶנָּה
  choice: persembahkanlah itu kepada Yahweh
  rationale: Bentuk kausatif עלה dalam konteks עֹלָה berarti mempersembahkan kurban itu. Kata “itu” mempertahankan sufiks objek feminin pada verba.
- source_word: כִּי לֹא יָדַע מָנוֹחַ
  choice: Sebab Manoah tidak tahu
  rationale: כִּי membuka komentar narator yang menjelaskan mengapa Manoah memperlakukan sosok itu sebagai tamu biasa.
- source_word: כִּי מַלְאַךְ יְהוָה הוּא
  choice: bahwa dia adalah malaikat Yahweh
  rationale: Terjemahan ini mempertahankan klausa identifikasi dan pronomina הוּא tanpa memperluas penafsirannya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri melalui transliterasi “Yahweh”, bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama pribadi itu tanpa menggantinya dengan gelar.
- issue: Identitas מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  alternative: utusan Yahweh
  rationale: Konteks naratif menunjukkan sosok adikodrati, tetapi terjemahan tidak menambahkan identifikasi kristologis atau doktrinal yang tidak dinyatakan secara eksplisit oleh ayat.
- issue: Daya makna אִם pada klausa pertama
  choice: sekalipun
  alternative: jika
  rationale: 'Susunan “jika engkau menahan aku, aku tidak akan makan” dapat berfungsi konsesif: meskipun Manoah membuatnya tinggal, ia tetap tidak akan makan. “Sekalipun” menyampaikan hubungan ini secara alami, sementara alternatif harfiah dicatat secara implisit dalam penjelasan penerjemahan.'
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pronomina “engkau” dipakai untuk dialog dalam narasi Alkitab tanpa gaya yang terlalu arkais. “Kurban” mengikuti ejaan baku modern; struktur dua tindakan—menyiapkan lalu mempersembahkan—dipertahankan.
