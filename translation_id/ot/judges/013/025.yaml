base_translation:
  language: en
  yaml_path: translation/ot/judges/013/025.yaml
  text: And the Spirit of Yahweh began to stir him in Mahaneh-dan[b][a], between Zorah and Eshtaol.
translation:
  language: id
  text: Lalu Roh Yahweh mulai menggerakkannya di Mahane-Dan[a], di antara Zora dan Esytaol.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mahane-Dan berarti “perkemahan Dan”; di sini ungkapan itu dipakai sebagai nama tempat.
    reason: cultural_note
lexical_decisions:
- source_word: וַתָּחֶל
  choice: mulai
  rationale: Bentuk wayyiqtol hifil dari חלל menyatakan permulaan tindakan; dalam narasi Indonesia, “lalu ... mulai” menyampaikan urutan dan aspek ingresif secara alami.
- source_word: רוּחַ יְהוָה
  choice: Roh Yahweh
  rationale: Dalam konteks kisah Simson, frasa ini menunjuk pada kehadiran dan kuasa ilahi yang bekerja atas dirinya; “Roh” paling sesuai daripada “angin” atau “napas”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri Yahweh, sesuai bentuk Ibrani dan kebijakan proyek.
- source_word: לְפַעֲמוֹ
  choice: menggerakkan dia
  rationale: Kata kerja פעם di sini dapat berarti menggerakkan, mendorong, atau menggugah. “Menggerakkan dia” mempertahankan keluasan makna dorongan ilahi tanpa menentukan secara berlebihan apakah tindakannya batiniah atau lahiriah.
- source_word: בְּמַחֲנֵה דָן
  choice: di Mahane-Dan
  rationale: Walaupun secara unsur berarti “perkemahan Dan,” dalam konteks ini ungkapan tersebut berfungsi sebagai nama tempat, sehingga ditransliterasikan.
- source_word: בֵּין צָרְעָה וּבֵין אֶשְׁתָּאֹל
  choice: di antara Zora dan Esytaol
  rationale: Ungkapan geografis diterjemahkan langsung, dengan ejaan nama tempat yang wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Makna רוּחַ יְהוָה dalam konteks ini
  choice: Roh Yahweh sebagai kehadiran ilahi yang mulai menggerakkan Simson
  alternative: angin Yahweh atau napas Yahweh
  rationale: Dalam rangkaian kisah Simson, frasa ini menggambarkan tindakan ilahi yang memperlengkapi dan mendorong dirinya, bukan gejala angin jasmani. Terjemahan tidak menambahkan perincian doktrinal yang melampaui konteks.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks menyebut Tetragramaton secara langsung; “Yahweh” mempertahankan fungsi nama diri dan selaras dengan kebijakan proyek.
- issue: Kadar kekuatan tindakan לְפַעֲמוֹ
  choice: menggerakkan dia
  alternative: mendorong dia atau menggugah dia
  rationale: Pilihan ini mempertahankan ketegangan leksikal antara dorongan, gerakan, dan penggugahan tanpa menyempitkannya menjadi emosi atau tindakan tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan “Lalu ... mulai” sesuai alur naratif. Nama tempat ditulis Mahane-Dan, Zora, dan Esytaol. Ambiguitas leksikal לְפַעֲמוֹ dipertahankan melalui “menggerakkan dia” tanpa catatan tambahan karena pilihan Indonesia ini cukup luas.
