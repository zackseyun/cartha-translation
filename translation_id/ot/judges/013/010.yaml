  yaml_path: translation/ot/judges/013/010.yaml
  text: So the woman hurried and ran and told her husband[a], and said to him, “Look, the man who came to me that day has appeared to me.”
translation:
  language: id
  text: Lalu perempuan itu bergegas dan berlari, lalu memberi tahu suaminya. Ia berkata kepada suaminya, “Lihatlah, laki-laki yang datang kepadaku hari itu[a] telah menampakkan diri kepadaku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tempo hari.” Secara harfiah, ungkapan Ibrani itu berarti “pada hari itu” dan dalam konteks merujuk kembali pada kunjungan sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: bergegas
  rationale: Kata kerja מהר menyatakan tindakan yang dilakukan dengan segera; “bergegas” alami dalam narasi Indonesia modern dan tetap mempertahankan unsur urgensi.
- source_word: וַתָּרָץ
  choice: berlari
  rationale: Kata רוץ secara langsung berarti berlari. Diterjemahkan tersendiri dari “bergegas” untuk mempertahankan dua kata kerja Ibrani yang menekankan kesegeraan tindakannya.
- source_word: וַתַּגֵּד
  choice: memberi tahu
  rationale: Bentuk Hifil dari נגד berarti memberitahukan atau melaporkan. “Memberi tahu” sesuai dengan ragam naratif modern dan tidak terlalu formal.
- source_word: לְאִישָׁהּ
  choice: suaminya
  rationale: Walaupun אִישׁ dapat berarti “laki-laki”, dengan akhiran posesif feminin tunggal dalam konteks rumah tangga ini ungkapan tersebut secara idiomatis berarti “suaminya”.
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Partikel ini menarik perhatian pendengar pada kabar yang segera disampaikan. “Lihatlah” mempertahankan daya serunya tanpa memakai ungkapan arkais.
- source_word: נִרְאָה אֵלַי
  choice: telah menampakkan diri kepadaku
  rationale: Bentuk Nifal dari ראה di sini menyatakan bahwa sosok itu muncul atau terlihat olehnya. “Telah menampakkan diri kepadaku” menyampaikan kemunculan yang baru saja terjadi dan cocok dengan laporan langsung perempuan itu.
- source_word: הָאִישׁ
  choice: laki-laki
  rationale: Nomina definit ini merujuk kembali kepada sosok yang sebelumnya ditemui. “Laki-laki” mempertahankan cara perempuan itu menyebutnya tanpa memasukkan identitas yang dinyatakan oleh konteks lebih luas.
- source_word: אֲשֶׁר בָּא בַיּוֹם אֵלַי
  choice: yang datang kepadaku hari itu
  rationale: Secara harfiah ungkapan ini menyebut “pada hari itu” dan dalam konteks menunjuk pada kunjungan sebelumnya. “Hari itu” wajar dalam bahasa Indonesia serta mempertahankan rujukan baliknya.
theological_decisions:
- issue: Identitas הָאִישׁ dalam ucapan perempuan itu
  choice: laki-laki
  alternative: malaikat; utusan Allah
  rationale: Walaupun konteks yang lebih luas mengidentifikasi sosok tersebut sebagai malaikat TUHAN, dalam ayat ini perempuan itu menyebutnya hanya sebagai “laki-laki”. Terjemahan mempertahankan sudut pandangnya saat berbicara dan tidak memasukkan identifikasi teologis dari luar ucapan ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Dua kata kerja “bergegas dan berlari” dipertahankan untuk mencerminkan penekanan ganda dalam teks Ibrani. Penanda catatan kaki ditempatkan setelah “hari itu”, yaitu frasa yang dijelaskan oleh catatan.
