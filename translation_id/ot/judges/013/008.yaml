  text: וַ/יֶּעְתַּ֥ר מָנ֛וֹחַ אֶל יְהוָ֖ה וַ/יֹּאמַ֑ר בִּ֣י אֲדוֹנָ֔/י אִ֣ישׁ הָ/אֱלֹהִ֞ים אֲשֶׁ֣ר שָׁלַ֗חְתָּ יָבוֹא נָ֥א עוֹד֙ אֵלֵ֔י/נוּ וְ/יוֹרֵ֕/נוּ מַֽה נַּעֲשֶׂ֖ה לַ/נַּ֥עַר הַ/יּוּלָּֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/008.yaml
  text: Then Manoah entreated Yahweh and said[a], “Please, Lord[c][b], let the man of God whom you sent come again to us and teach us what we should do for the boy who is to be born.”
translation:
  language: id
  text: Lalu Manoah memohon dengan sungguh-sungguh kepada Yahweh. Ia berkata, “Sudilah kiranya, Tuhan, orang Allah yang telah Engkau utus itu datang lagi kepada kami dan mengajar kami apa yang harus kami lakukan bagi anak laki-laki yang akan dilahirkan itu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּעְתַּר
  choice: memohon dengan sungguh-sungguh
  rationale: Kata kerja עתר menyatakan permohonan yang sungguh-sungguh kepada Allah; frasa ini mempertahankan intensitasnya dalam bahasa Indonesia modern.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH dan membedakannya dari gelar אֲדֹנָי dalam ayat yang sama.
- source_word: בִּי אֲדֹנָי
  choice: Ya Tuhan, kiranya
  rationale: בִּי berfungsi sebagai ungkapan permohonan sopan, sedangkan אֲדֹנָי adalah sapaan hormat kepada Allah. Susunan ini alami dan khidmat dalam bahasa Indonesia.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Ungkapan baku Indonesia ini menyampaikan arti seorang yang menjadi milik atau utusan Allah tanpa mengidentifikasinya secara eksplisit sebagai malaikat; dengan demikian, sudut pandang Manoah tetap terpelihara.
- source_word: אֲשֶׁר שָׁלַחְתָּ
  choice: yang telah Engkau utus
  rationale: Klausa relatif ini secara langsung merujuk kepada abdi Allah; aspek lampau tersirat oleh konteks pengutusan yang sudah terjadi.
- source_word: יָבוֹא נָא עוֹד אֵלֵינוּ
  choice: datang lagi kepada kami
  rationale: עוֹד berarti 'lagi', sedangkan daya permohonan dari נָא diwakili oleh 'kiranya' sebelumnya agar kalimat Indonesia tidak terasa berlebihan.
- source_word: וְיוֹרֵנוּ
  choice: dan mengajar kami
  rationale: Bentuk Hifil dari ירה berarti memberi pengajaran atau petunjuk; 'mengajar' jelas dan wajar dalam konteks ini.
- source_word: מַה נַּעֲשֶׂה
  choice: apa yang harus kami lakukan
  rationale: Mempertahankan nuansa deliberatif dan permintaan akan petunjuk praktis.
- source_word: לַנַּעַר
  choice: bagi anak laki-laki
  rationale: נַעַר bersifat maskulin dan dalam konteks menunjuk kepada putra yang dijanjikan; 'anak laki-laki' mempertahankan kekhususan itu.
- source_word: הַיּוּלָּד
  choice: yang akan dilahirkan itu
  rationale: Partisip pasif menunjuk kepada anak yang kelahirannya masih akan terjadi. Bentuk pasif 'dilahirkan' dekat dengan bentuk Ibrani dan tetap alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai nama ilahi YHWH, bukan gelar. 'Yahweh' mempertahankan nama pribadi itu dan membedakannya dari אֲדֹנָי yang diterjemahkan 'Tuhan'.
- issue: Identitas אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  alternative: utusan Allah atau malaikat Allah
  rationale: Ucapan Manoah menyebut sosok tersebut secara harfiah sebagai 'orang/abdi Allah'. Terjemahan tidak mendahului perkembangan narasi dengan menetapkan identitasnya secara lebih khusus.
- issue: Jenis kelamin לַנַּעַר
  choice: anak laki-laki
  alternative: anak
  rationale: Nomina Ibrani berbentuk maskulin dan konteksnya adalah putra yang dijanjikan; bentuk khusus gender dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan ilahi memakai huruf kapital pada 'Engkau'. 'Abdi Allah' dipilih sebagai ungkapan Alkitabiah yang masih mudah dipahami dan menjaga perspektif naratif Manoah. Tidak diperlukan catatan kaki karena alternatif leksikal utama dapat ditangani secara memadai dalam teks tanpa mengaburkan ambiguitas teologis.
