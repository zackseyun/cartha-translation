  text: וַ/יֹּ֣אמֶר מָנ֔וֹחַ עַתָּ֖ה יָבֹ֣א דְבָרֶ֑י/ךָ מַה יִּֽהְיֶ֥ה מִשְׁפַּט הַ/נַּ֖עַר וּ/מַעֲשֵֽׂ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/012.yaml
  text: Then Manoah said[a], “Now let your words come true[c][b]. What will be the rule for the boy and for his work?”
translation:
  language: id
  text: Lalu Manoah berkata, “Sekarang, biarlah perkataanmu menjadi kenyataan.[a] Apa yang akan menjadi ketentuan bagi anak laki-laki itu dan pekerjaannya?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apabila perkataanmu menjadi kenyataan.” Klausa Ibrani ini dapat dipahami sebagai harapan (“biarlah ... menjadi kenyataan”) atau sebagai asumsi waktu (“apabila ... menjadi kenyataan”).
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “Apa yang akan menjadi ketentuan bagi anak laki-laki itu dan pekerjaannya?” Kata yang diterjemahkan “ketentuan” juga dapat berarti “aturan”, “tata cara”, atau “cara hidup”; “pekerjaannya” juga dapat diterjemahkan “perbuatannya” atau “kegiatannya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan alur cerita; “Lalu” menyatakan urutan secara alami dalam bahasa Indonesia.
- source_word: מָנוֹחַ
  choice: Manoah
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: עַתָּה
  choice: Sekarang
  rationale: Kata ini menandai tanggapan dan pengharapan Manoah pada saat itu.
- source_word: יָבֹא דְבָרֶיךָ
  choice: biarlah perkataanmu menjadi kenyataan
  rationale: Secara harfiah, “biarlah perkataanmu datang”; ungkapan ini menyampaikan harapan agar pemberitahuan tersebut terlaksana, sambil mencatat kemungkinan pembacaan temporal dalam catatan kaki.
- source_word: מַה יִּהְיֶה
  choice: Apa yang harus menjadi
  rationale: Dalam konteks pertanyaan mengenai ketentuan bagi anak yang akan lahir, bentuk mendatang ini secara alami menyatakan apa yang akan atau harus berlaku.
- source_word: מִשְׁפַּט
  choice: ketentuan
  rationale: מִשְׁפַּט di sini dapat menunjuk pada aturan, tata cara, atau pola yang ditetapkan bagi anak itu; “ketentuan” cukup luas dan wajar dalam bahasa Indonesia.
- source_word: הַנַּעַר
  choice: anak itu
  rationale: Istilah ini merujuk pada anak laki-laki yang dijanjikan; “anak itu” alami karena ia belum lahir, tanpa menghilangkan rujukan kontekstualnya.
- source_word: וּמַעֲשֵׂהוּ
  choice: dan apa yang harus dilakukannya
  rationale: Secara harfiah berarti “dan perbuatannya/pekerjaannya.” Dalam pertanyaan ini, bentuk verbal lebih alami dan dapat mencakup tindakan, tugas, atau pekerjaannya.
theological_decisions:
- issue: Nuansa יָבֹא דְבָרֶיךָ
  choice: 'Dipahami sebagai harapan: “biarlah perkataanmu menjadi kenyataan”'
  alternative: 'Dipahami secara temporal: “apabila perkataanmu menjadi kenyataan”'
  rationale: Bentuk Ibrani dapat didengar sebagai ungkapan harapan atau sebagai asumsi mengenai penggenapannya. Teks utama memakai pembacaan optatif yang alami, dan ambiguitasnya dipertahankan dalam catatan kaki.
- issue: Cakupan מִשְׁפַּט ... וּמַעֲשֵׂהוּ
  choice: “ketentuan bagi anak itu dan apa yang harus dilakukannya”
  alternative: “tata cara hidup anak itu dan pekerjaannya”
  rationale: Pertanyaan dapat menyangkut aturan yang berlaku bagi anak tersebut serta tindakan, tugas, atau panggilannya. Terjemahan tidak mempersempitnya menjadi nazar atau jabatan tertentu.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. “Ketentuan” menjaga keluasan makna hukum atau tata cara, sedangkan “apa yang harus dilakukannya” membuat frasa kedua alami tanpa menentukan apakah yang dimaksud ialah perilaku, tugas, atau pekerjaan anak itu.
