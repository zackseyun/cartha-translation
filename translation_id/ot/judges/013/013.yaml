  yaml_path: translation/ot/judges/013/013.yaml
  text: And the angel of Yahweh said to Manoah[a], “The woman must be careful to do everything that I said to her.”
translation:
  language: id
  text: Lalu malaikat Yahweh berkata kepada Manoah, “Wanita itu hendaklah menjaga diri dari segala sesuatu yang Kukatakan kepadanya.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk naratif wayyiqtol melanjutkan rangkaian peristiwa; “Lalu” alami dalam narasi Indonesia tanpa memberi tekanan temporal berlebihan.
- source_word: מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  rationale: מַלְאַךְ dapat berarti utusan atau malaikat; dalam konteks penampakan ilahi ini, “malaikat” merupakan padanan konvensional, sementara nama יהוה dipertahankan sebagai “Yahweh”.
- source_word: אֶל מָנוֹחַ
  choice: kepada Manoah
  rationale: Padanan langsung dan alami untuk preposisi arah אֶל dengan nama diri.
- source_word: מִכֹּל אֲשֶׁר אָמַרְתִּי אֶל הָאִשָּׁה
  choice: dalam segala hal yang telah Kukatakan kepadanya
  rationale: מִכֹּל menandai cakupan menyeluruh dari petunjuk sebelumnya. “Kepadanya” merujuk secara wajar kepada perempuan itu tanpa mengulang nomina.
- source_word: תִּשָּׁמֵר
  choice: harus menjaga diri
  rationale: Bentuk nifal dari שׁמר di sini menyatakan kewaspadaan atau penjagaan diri dalam menaati pembatasan yang telah diberikan; pilihan ini mempertahankan nuansa refleksif dengan bahasa Indonesia yang alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה; transliterasi “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Nuansa identitas מַלְאַךְ יְהוָה
  choice: malaikat Yahweh
  alternative: utusan Yahweh
  rationale: “Malaikat” sesuai dengan konteks utusan surgawi, tetapi tidak dimaksudkan untuk menyelesaikan seluruh ketegangan naratif mengenai hubungan tokoh ini dengan Yahweh; kemungkinan leksikal “utusan” dicatat dalam keputusan penerjemahan.
- issue: Cakupan perintah kepada perempuan itu
  choice: menjaga diri dalam segala hal yang telah Kukatakan kepadanya
  alternative: berhati-hati melakukan segala sesuatu yang telah Kukatakan kepadanya
  rationale: Teks menekankan bahwa ia harus menjaga diri sehubungan dengan seluruh petunjuk yang disampaikan. Terjemahan tidak menambahkan objek tindakan yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Perempuan itu” mempertahankan הָאִשָּׁה tanpa mengubahnya menjadi “istrimu”; kapitalisasi “Ku-” menandai pembicara ilahi menurut kaidah umum Indonesia.
