  text: וַ/תֹּ֧אמֶר ל֣/וֹ אִשְׁתּ֗/וֹ לוּ֩ חָפֵ֨ץ יְהוָ֤ה לַ/הֲמִיתֵ֨/נוּ֙ לֹֽא לָקַ֤ח מִ/יָּדֵ֨/נוּ֙ עֹלָ֣ה וּ/מִנְחָ֔ה וְ/לֹ֥א הֶרְאָ֖/נוּ אֶת כָּל אֵ֑לֶּה וְ/כָ/עֵ֕ת לֹ֥א הִשְׁמִיעָ֖/נוּ כָּ/זֹֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/023.yaml
  text: But his wife said to him, “If the LORD had intended to kill us, he would not have accepted from our hand a burnt offering and a grain offering, or shown us all these things, or now announced to us such a thing as this.”
translation:
  language: id
  text: Namun istrinya berkata kepadanya, “Seandainya TUHAN bermaksud membunuh kita, Dia tidak akan menerima kurban bakaran dan persembahan sajian dari tangan kita, tidak akan memperlihatkan kepada kita semua hal ini, dan sekarang tidak akan memberitahukan hal seperti ini kepada kita.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חָפֵץ
  choice: bermaksud
  rationale: Dalam konstruksi ini kata tersebut menyatakan kehendak atau maksud; ‘bermaksud’ alami dalam bahasa Indonesia dan mempertahankan nuansa niat.
- source_word: עֹלָה
  choice: kurban bakaran
  rationale: Istilah baku dan mudah dipahami untuk persembahan yang dibakar seluruhnya.
- source_word: מִנְחָה
  choice: persembahan sajian
  rationale: Dalam konteks ritual, istilah ini menunjuk persembahan bahan pangan; pilihan ini menghindari pengertian umum ‘persembahan’ yang terlalu luas.
- source_word: לָקַח מִיָּדֵנוּ
  choice: menerima ... dari tangan kita
  rationale: Mempertahankan ungkapan sumber sekaligus tetap wajar dalam bahasa Indonesia; dalam konteks ini penerimaan kurban menyiratkan perkenanan.
- source_word: הִשְׁמִיעָנוּ
  choice: memberitahukan ... kepada kita
  rationale: Secara harfiah berkaitan dengan membuat seseorang mendengar; dalam konteks pewartaan janji, ‘memberitahukan’ jelas dan alami.
- source_word: כָזֹאת
  choice: hal seperti ini
  rationale: Mempertahankan sifat deiktis dan agak umum dari ungkapan Ibrani tanpa mempersempit isinya.
theological_decisions:
- issue: Nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH atau Yahweh
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia yang luas dikenal, tanpa menambahkan penafsiran denominasi.
- issue: Logika perkataan istri Manoah
  choice: Mempertahankan tiga bukti paralel bahwa TUHAN tidak bermaksud membunuh mereka
  alternative: Merangkum perkataannya sebagai jaminan keselamatan
  rationale: Struktur bersyarat dan rangkaian tindakan ilahi dalam teks sumber dipertahankan tanpa mengubah penalaran tokoh menjadi pernyataan teologis langsung dari narator.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Pengulangan ‘tidak akan’ mempertahankan struktur argumentatif Ibrani dan membuat cakupan negasi jelas. Kata ganti ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia.
