  text: וַ/יִּשְׁמַ֥ע הָ/אֱלֹהִ֖ים בְּ/ק֣וֹל מָנ֑וֹחַ וַ/יָּבֹ֣א מַלְאַךְ֩ הָ/אֱלֹהִ֨ים ע֜וֹד אֶל הָ/אִשָּׁ֗ה וְ/הִיא֙ יוֹשֶׁ֣בֶת בַּ/שָּׂדֶ֔ה וּ/מָנ֥וֹחַ אִישָׁ֖/הּ אֵ֥ין עִמָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/009.yaml
  text: And God listened to the voice of Manoah, and the angel of God came again to the woman while she was sitting in the field, and Manoah her husband was not with her.
translation:
  language: id
  text: Allah mendengarkan suara Manoah, lalu Malaikat Allah datang lagi kepada perempuan itu ketika ia sedang duduk di ladang. Manoah, suaminya, tidak ada bersamanya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁמַע ... בְּקוֹל מָנוֹחַ
  choice: Allah mendengarkan permohonan Manoah
  rationale: Ungkapan שׁמע בקול secara harfiah berkaitan dengan mendengarkan suara, tetapi dalam konteks ini menyatakan bahwa Allah mengindahkan doa atau permohonan Manoah pada ayat sebelumnya. 'Mendengarkan permohonan' alami dalam bahasa Indonesia dan mempertahankan nuansa tanggapan yang berkenan.
- source_word: מַלְאַךְ הָאֱלֹהִים
  choice: Malaikat Allah
  rationale: מַלְאָךְ dapat berarti utusan atau malaikat; dalam konteks penampakan adikodrati ini, 'malaikat' merupakan padanan yang alami dan tepat.
- source_word: עוֹד
  choice: lagi
  rationale: Kata ini menandai terulangnya kedatangan malaikat kepada perempuan tersebut.
- source_word: הָאִשָּׁה
  choice: perempuan itu
  rationale: Padanan ini mempertahankan cara narator menyebut tokoh tersebut tanpa mengganti nomina sumber dengan istilah relasional.
- source_word: וְהִיא יוֹשֶׁבֶת בַּשָּׂדֶה
  choice: ketika ia sedang duduk di ladang
  rationale: Partisipel יוֹשֶׁבֶת menyatakan tindakan latar yang sedang berlangsung ketika malaikat datang.
- source_word: אִישָׁהּ
  choice: suaminya
  rationale: אִישׁ dengan sufiks feminin tunggal dalam konteks ini secara idiomatis berarti 'suaminya'.
- source_word: אֵין עִמָּהּ
  choice: tidak ada bersamanya
  rationale: Konstruksi eksistensial negatif dengan עִם menyatakan bahwa Manoah tidak hadir bersama perempuan itu.
theological_decisions:
- issue: Makna הָאֱלֹהִים dalam ayat ini
  choice: Allah
  alternative: allah-allah
  rationale: Walaupun bentuk אֱלֹהִים secara morfologis jamak, konteks dan verba tunggal menunjukkan bahwa yang dimaksud ialah Allah Israel. 'Allah' adalah padanan baku bahasa Indonesia dan tidak menambahkan penafsiran denominasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Klausa pertama dibuat idiomatis dengan 'permohonan' berdasarkan konteks doa Manoah, sedangkan susunan naratif lainnya tetap dekat dengan bentuk Ibrani. Konjungsi terakhir diterjemahkan 'tetapi' untuk menyatakan kontras keadaan secara alami.
