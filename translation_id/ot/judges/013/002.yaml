  text: וַ/יְהִי֩ אִ֨ישׁ אֶחָ֧ד מִ/צָּרְעָ֛ה מִ/מִּשְׁפַּ֥חַת הַ/דָּנִ֖י וּ/שְׁמ֣/וֹ מָנ֑וֹחַ וְ/אִשְׁתּ֥/וֹ עֲקָרָ֖ה וְ/לֹ֥א יָלָֽדָה׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/002.yaml
  text: There was a certain man from Zorah[a], from the clan of the Danites, and his name was Manoah. His wife was barren and had not borne children.
translation:
  language: id
  text: Ada seorang laki-laki dari Zora, dari klan orang Dan, yang bernama Manoah. Istrinya mandul dan belum melahirkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dan ia tidak melahirkan.” Dalam teks Ibrani, kata kerja “melahirkan” tidak disertai objek yang dinyatakan.
    reason: Menjelaskan bentuk Ibrani tanpa menambahkan objek tunggal atau jamak maupun mengubah makna menjadi “mempunyai anak”.
lexical_decisions:
- source_word: וַיְהִי
  choice: Ada
  rationale: Bentuk naratif ini memperkenalkan tokoh dan adegan baru. "Ada" menyampaikan fungsi tersebut secara alami tanpa menambahkan penanda waktu yang tidak tersurat.
- source_word: אִישׁ אֶחָד
  choice: seorang laki-laki
  rationale: Dalam konteks narasi, gabungan ini memperkenalkan seorang tokoh tertentu yang kemudian disebut namanya. "Seorang laki-laki" alami dalam bahasa Indonesia dan tidak memberi tekanan berlebihan pada angka satu.
- source_word: מִצָּרְעָה
  choice: dari Zora
  rationale: Kata depan מִן menyatakan asal. Nama tempat צָרְעָה ditransliterasikan menurut bentuk Indonesia yang lazim, "Zora".
- source_word: מִמִּשְׁפַּחַת הַדָּנִי
  choice: dari kaum orang Dan
  rationale: מִשְׁפָּחָה menunjuk pada kelompok kekerabatan dalam suku, sehingga "kaum" lebih tepat daripada menyamakannya langsung dengan seluruh suku. Bentuk הַדָּנִי menunjuk kepada orang Dan secara kolektif.
- source_word: וּשְׁמוֹ מָנוֹחַ
  choice: yang bernama Manoah
  rationale: Ungkapan ini menyampaikan rumus penamaan Ibrani secara ringkas dan alami dalam bahasa Indonesia, tanpa menghilangkan nama tokoh.
- source_word: וְאִשְׁתּוֹ
  choice: Istrinya
  rationale: Akhiran pronominal menyatakan bahwa perempuan itu adalah istri Manoah. Memulai kalimat baru menghasilkan susunan Indonesia yang jelas dan tetap mempertahankan hubungan antarklausa.
- source_word: עֲקָרָה
  choice: mandul
  rationale: '"Mandul" merupakan padanan langsung, ringkas, dan umum untuk keadaan tidak dapat mempunyai keturunan dalam konteks kisah kelahiran ini.'
- source_word: וְלֹא יָלָדָה
  choice: dan belum pernah melahirkan
  rationale: Kata kerja יָלָדָה dengan subjek perempuan berarti melahirkan. Karena teks Ibrani tidak menyebut objek tunggal maupun jamak, terjemahan ini mempertahankan ketidaktersuratan objek tersebut dan menyatakan keadaan sampai waktu dalam narasi.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Istilah "kaum" mempertahankan struktur kekerabatan dalam suku Dan, sedangkan "belum pernah melahirkan" menghindari penambahan objek yang tidak terdapat dalam teks Ibrani.
