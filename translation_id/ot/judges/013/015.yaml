  text: וַ/יֹּ֥אמֶר מָנ֖וֹחַ אֶל מַלְאַ֣ךְ יְהוָ֑ה נַעְצְרָה נָּ֣א אוֹתָ֔/ךְ וְ/נַעֲשֶׂ֥ה לְ/פָנֶ֖י/ךָ גְּדִ֥י עִזִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/013/015.yaml
  text: Then Manoah said to the angel of the LORD, “Please let us detain you, and we will prepare a young goat for you.”
translation:
  language: id
  text: Lalu Manoah berkata kepada malaikat TUHAN, “Tolong, tinggallah sebentar, dan kami akan menyiapkan seekor anak kambing untukmu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נַעְצְרָה נָּא אוֹתָךְ
  choice: Tolong, tinggallah sebentar
  rationale: Bentuk kohortatif dengan נָא menyatakan permohonan sopan agar sang utusan menunda kepergiannya. Ungkapan alami ini menyampaikan maksud tersebut tanpa konotasi paksa dari ‘menahan’.
- source_word: וְנַעֲשֶׂה לְפָנֶיךָ
  choice: supaya kami menyiapkan ... untukmu
  rationale: Secara harfiah berarti ‘dan kami akan membuat di hadapanmu’; dalam konteks penyediaan makanan, ‘menyiapkan ... untukmu’ merupakan padanan Indonesia yang alami, sementara hubungan tujuan tersirat dibuat jelas.
- source_word: גְּדִי עִזִּים
  choice: seekor anak kambing
  rationale: Ungkapan Ibrani menunjuk pada anak kambing dari kawanan kambing; ‘anak kambing’ tepat dan tidak perlu dibuat berlebihan.
- source_word: מַלְאַךְ יְהוָה
  choice: malaikat TUHAN
  rationale: Mempertahankan ungkapan tradisional dan identitas ilahi YHWH melalui konvensi huruf kapital TUHAN.
theological_decisions:
- issue: Identitas malaikat TUHAN
  choice: malaikat TUHAN
  alternative: Malaikat TUHAN / utusan YHWH
  rationale: Ayat ini menyebut tokoh itu dengan konstruksi Ibrani מַלְאַךְ יְהוָה. Terjemahan tidak menyelesaikan secara dogmatis hubungan tokoh ini dengan TUHAN, sehingga ketegangan naratif tetap terpelihara.
- issue: Tujuan anak kambing
  choice: menyiapkan seekor anak kambing untukmu
  alternative: mempersembahkan seekor anak kambing kepadamu
  rationale: Kata kerja עשה berarti ‘membuat/menyiapkan’, bukan istilah teknis untuk mempersembahkan korban. Konteks ayat berikutnya akan memperjelas persoalan makanan versus persembahan tanpa memasukkannya terlebih dahulu ke ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. ‘Tinggallah sebentar’ lebih idiomatis daripada ‘izinkanlah kami menahanmu’ serta tetap menyampaikan permohonan Manoah agar tamunya menunda keberangkatan.
