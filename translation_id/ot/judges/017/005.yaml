base_translation:
  language: en
  yaml_path: translation/ot/judges/017/005.yaml
  text: The man Micah had a house of God[a], and he made an ephod and household idols, and he ordained one of his sons[b], and he became his priest.
translation:
  language: id
  text: Mikha memiliki sebuah tempat pemujaan[a]. Ia membuat efod dan patung-patung berhala rumah tangga, lalu menahbiskan salah seorang anak laki-lakinya[b], dan anak itu menjadi imamnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “rumah Allah” atau “rumah dewa-dewa”. Frasa Ibraninya secara harfiah dapat berarti demikian dan di sini dapat menunjuk pada tempat ibadah pribadi.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “memenuhi tangan salah seorang anak laki-lakinya”, sebuah ungkapan untuk mengangkat atau mengkhususkan seseorang bagi pelayanan sebagai imam.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּית אֱלֹהִים
  choice: sebuah tempat pemujaan
  rationale: Secara harfiah frasa ini dapat dibaca 'rumah Allah/dewa-dewa', tetapi dalam konteks benda-benda kultis milik Mikha frasa tersebut menunjuk pada tempat ibadah pribadi. 'Tempat pemujaan' menyampaikan fungsinya tanpa menyiratkan bahwa ibadah itu sah.
- source_word: אֵפוֹד
  choice: efod
  rationale: Istilah khusus bagi benda atau pakaian kultis kuno ini tidak mempunyai padanan sederhana dalam bahasa Indonesia; transliterasi mempertahankan kekhususannya.
- source_word: תְרָפִים
  choice: patung-patung berhala rumah tangga
  rationale: Bentuk jamak ini menunjuk pada patung kultis domestik. Pilihan ini menjelaskan bentuk dan fungsinya secara wajar dalam bahasa Indonesia.
- source_word: וַיְמַלֵּא אֶת־יַד
  choice: menahbiskan
  rationale: Ungkapan yang secara harfiah berarti 'memenuhi tangan' merupakan idiom untuk mengangkat atau mengkhususkan seseorang bagi pelayanan imam.
- source_word: אַחַד מִבָּנָיו
  choice: salah seorang anak laki-lakinya
  rationale: Mempertahankan makna partitif dan jenis kelamin yang dinyatakan oleh bentuk Ibrani.
- source_word: וַיְהִי לוֹ לְכֹהֵן
  choice: yang kemudian menjadi imamnya
  rationale: Mengungkapkan hasil pengangkatan secara alami dan tetap menunjukkan bahwa anak itu menjadi imam bagi Mikha.
- source_word: וְהָאִישׁ מִיכָה
  choice: Mikha
  rationale: Dalam bahasa Indonesia, nama diri saja merupakan pengungkapan alami bagi topik yang dilanjutkan; menerjemahkan הָאִישׁ secara kaku sebagai 'orang itu, Mikha' akan terasa janggal.
theological_decisions:
- issue: Apakah בֵּית אֱלֹהִים harus diterjemahkan dengan cara yang dapat menyiratkan ibadah yang sah kepada Allah
  choice: tempat pemujaan
  alternative: rumah Allah; rumah dewa-dewa
  rationale: Konteksnya adalah praktik kultis pribadi yang tidak teratur, termasuk efod, terafim, dan pengangkatan anak Mikha sendiri sebagai imam. Terjemahan fungsional ini tidak mengesahkan praktik tersebut, sekaligus catatan kaki mempertahankan ambiguitas bentuk Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Istilah kultis 'efod' dipertahankan, sedangkan ungkapan idiomatis dijelaskan melalui catatan kaki.
