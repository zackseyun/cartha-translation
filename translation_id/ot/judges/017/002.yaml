base_translation:
  language: en
  yaml_path: translation/ot/judges/017/002.yaml
  text: And he said to his mother[a], “The eleven hundred pieces of silver that were taken from you, about which you uttered a curse and also spoke in my hearing—look, the silver is with me; I took it.” And his mother said[b], “Blessed be my son by Yahweh.”
translation:
  language: id
  text: Lalu ia berkata kepada ibunya, “Seribu seratus keping perak yang telah diambil darimu—yang atasnya engkau mengucapkan kutuk[a] dan yang juga engkau bicarakan di hadapanku—lihat, perak itu ada padaku; akulah yang mengambilnya.” Ibunya berkata, “Diberkatilah anakku oleh Yahweh.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bersumpah”; kata kerja Ibrani yang dipakai dapat merujuk pada sumpah atau kutuk, tetapi konteks ini lebih mendukung “mengucapkan kutuk”.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah, rumusan Ibraninya ringkas: “Diberkatilah anakku oleh/bagi Yahweh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלֶף וּמֵאָה הַכֶּסֶף
  choice: seribu seratus keping perak
  rationale: Bahasa Ibrani menyebut jumlah perak tanpa menyatakan satuan berat secara eksplisit. “Keping perak” menyampaikan objek yang dihitung tanpa menambahkan “syikal” yang tidak terdapat dalam ayat ini.
- source_word: לֻקַּח לָךְ
  choice: telah diambil darimu
  rationale: Bentuk pasif לקח berarti “diambil”. Konteks menyiratkan pencurian, tetapi terjemahan ini tidak menambahkan unsur yang tidak dinyatakan oleh verba itu sendiri.
- source_word: וְאַתִּי אָלִית
  choice: engkau mengucapkan kutuk
  rationale: Verba אָלָה dapat berkaitan dengan sumpah atau kutuk. Dalam konteks hilangnya perak dan pengakuan anak itu, “mengucapkan kutuk” paling sesuai, sementara kemungkinan “bersumpah” dicatat dalam catatan kaki.
- source_word: וְגַם אָמַרְתְּ בְּאָזְנַי
  choice: dan juga berbicara dalam pendengaranku
  rationale: Ungkapan harfiah “di telingaku” menyatakan bahwa perkataan tersebut diucapkan dalam pendengaran si anak. Pilihan ini mempertahankan kaitan dengan tindakan berbicara tanpa memakai ungkapan Indonesia yang terlalu harfiah.
- source_word: הִנֵּה
  choice: lihat
  rationale: הִנֵּה menarik perhatian kepada perak yang kini diakui berada pada si anak. “Lihat” mempertahankan fungsi penunjuknya dalam bahasa Indonesia modern.
- source_word: הַכֶּסֶף אִתִּי
  choice: perak itu ada padaku
  rationale: Pilihan ini mengikuti susunan dan makna ungkapan Ibrani “perak itu bersamaku/padaku” dengan bahasa Indonesia yang jelas.
- source_word: אֲנִי לְקַחְתִּיו
  choice: akulah yang mengambilnya
  rationale: Pronomina eksplisit אֲנִי bersifat menegaskan. Bentuk “akulah” menyampaikan penekanan pengakuan tersebut secara alami.
- source_word: בָּרוּךְ בְּנִי לַיהוָה
  choice: Diberkatilah anakku oleh Yahweh
  rationale: Ini mempertahankan rumusan berkat yang ringkas dan memahami לַיהוָה sebagai menunjuk kepada Yahweh sebagai sumber atau pelaku berkat, sambil mencatat kekompakan dan kemungkinan relasi gramatikalnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
theological_decisions:
- issue: Makna אָלָה dalam ucapan sang ibu
  choice: mengucapkan kutuk
  alternative: bersumpah
  rationale: Konteks uang yang hilang dan pengakuan anak itu lebih mendukung kutuk yang diucapkan terhadap pelakunya, tetapi cakupan leksikal verba tersebut juga memungkinkan sumpah; ambiguitas ini dipertahankan melalui catatan kaki.
- issue: Rumusan berkat בָּרוּךְ בְּנִי לַיהוָה
  choice: Diberkatilah anakku oleh Yahweh
  alternative: Kiranya anakku diberkati Yahweh / Diberkatilah anakku bagi Yahweh
  rationale: Terjemahan utama membaca preposisi ל sebagai menandai sumber atau pelaku dalam rumusan berkat. Catatan kaki mengakui bahwa bahasa Ibraninya sangat ringkas dan dapat pula dipahami sebagai relasi “bagi/kepada Yahweh”.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN / Yehovah
  rationale: Teks memakai nama perjanjian יהוה secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama diri.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Kata ganti “engkau” dan “aku” dipakai untuk mempertahankan sapaan langsung keluarga dalam teks sumber. Tanda pisah membantu pembaca mengikuti keterangan panjang mengenai perak tanpa menghilangkan susunan retoris ayat.
