  yaml_path: translation/ot/judges/017/009.yaml
  text: Micah said to him[a], “Where do you come from?” And he said to him, “I am a Levite from Bethlehem in Judah, and I am going to sojourn wherever I may find a place.”
translation:
  language: id
  text: Mikha berkata kepadanya, “Dari mana kamu datang?” Ia menjawab, “Aku seorang Lewi dari Betlehem di Yehuda. Aku sedang pergi untuk tinggal sementara[a] di mana saja aku mendapat tempat.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani ini dapat berarti tinggal sebagai pendatang atau perantau, bukan menetap di tanah milik sendiri.
    reason: Menjelaskan nuansa לָגוּר sebagai tinggal dalam status pendatang tanpa membatasi maknanya pada durasi tertentu atau menyimpulkan status sosial yang tidak dinyatakan teks.
lexical_decisions:
- source_word: מֵאַיִן
  choice: Dari mana asalmu?
  rationale: Ungkapan ini secara alami menanyakan asal orang tersebut dan mempertahankan makna pertanyaan tentang tempat kedatangannya.
- source_word: לֵוִי
  choice: seorang Lewi
  rationale: Menunjukkan identitas orang itu sebagai anggota suku Lewi; bentuk ini wajar dalam pengakuan diri berbahasa Indonesia.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: dari Betlehem di Yehuda
  rationale: Menjelaskan bahwa yang dimaksud ialah Betlehem yang terletak di wilayah Yehuda.
- source_word: הֹלֵךְ
  choice: sedang pergi
  rationale: Partisip Ibrani menyatakan tindakan yang sedang berlangsung atau perjalanan yang sedang ditempuh tanpa menentukan sarana perjalanan.
- source_word: לָגוּר
  choice: untuk tinggal sementara
  rationale: גור menunjuk pada tinggal tanpa hak milik tetap, sering kali sebagai pendatang. 'Tinggal sementara' dapat dipahami pembaca modern tanpa memakai istilah arkais.
- source_word: בַּאֲשֶׁר אֶמְצָא
  choice: di mana pun aku mendapat tempat
  rationale: Bahasa Ibrani membiarkan objek kata 'mendapat/menemukan' tersirat. Penambahan 'tempat' membuat kalimat Indonesia alami sambil mempertahankan sifat tujuan yang belum pasti.
