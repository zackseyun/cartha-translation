  yaml_path: translation/ot/judges/017/006.yaml
  text: In those days there was no king in Israel[a]; each man did what was right in his own eyes.
translation:
  language: id
  text: Pada zaman itu tidak ada raja di Israel; setiap orang melakukan apa yang benar menurut pandangannya sendiri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיָּמִים הָהֵם
  choice: Pada zaman itu
  rationale: Ungkapan waktu naratif ini menunjuk kepada suatu masa lampau. “Pada zaman itu” alami dan bermartabat dalam bahasa Indonesia.
- source_word: אֵין מֶלֶךְ בְּיִשְׂרָאֵל
  choice: tidak ada raja di Israel
  rationale: Partikel eksistensial אֵין menyatakan ketiadaan; terjemahan ini mempertahankan makna lugas tanpa menambahkan penilaian mengenai monarki.
- source_word: אִישׁ
  choice: setiap orang
  rationale: Nomina maskulin tunggal ini digunakan secara distributif dan representatif, yakni setiap individu. “Setiap orang” menyampaikan cakupannya secara alami dalam bahasa Indonesia tanpa mengubah maksud sumber.
- source_word: הַיָּשָׁר
  choice: apa yang benar
  rationale: יָשָׁר dapat berarti lurus, benar, atau tepat. Dalam ungkapan ini, “apa yang benar” paling alami dan mempertahankan nuansa penilaian moral.
- source_word: בְּעֵינָיו
  choice: menurut pandangannya sendiri
  rationale: Secara harfiah berarti “di matanya”; idiom ini menunjuk pada penilaian subjektif seseorang. “Menurut pandangannya sendiri” merupakan padanan Indonesia yang jelas dan alami.
- source_word: יַעֲשֶׂה
  choice: melakukan
  rationale: Bentuk imperfek dalam ringkasan naratif ini menyatakan tindakan yang lazim atau berulang pada masa itu. Dalam konteks kerangka waktu lampau, “melakukan” menyampaikan kebiasaan tersebut secara wajar.
theological_decisions:
- issue: Penilaian narator terhadap keadaan Israel tanpa menjadikan monarki sebagai kebaikan teologis yang mutlak
  choice: Ayat diterjemahkan sebagai keterangan tentang tidak adanya raja yang sekaligus menyiratkan kritik melalui ungkapan “apa yang benar menurut pandangannya sendiri.”
  alternative: Membacanya sebagai catatan sejarah yang sepenuhnya netral, atau memperjelasnya menjadi pernyataan bahwa monarki adalah satu-satunya jalan keluar.
  rationale: Refrain dalam kitab Hakim-Hakim berfungsi sebagai gambaran kekacauan sosial dan keagamaan. Terjemahan mempertahankan ketegangan itu tanpa menambahkan teologi politik yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Tanda titik koma mempertahankan hubungan erat antara ketiadaan raja dan perilaku setiap orang tanpa menjelaskan hubungan itu secara berlebihan.
