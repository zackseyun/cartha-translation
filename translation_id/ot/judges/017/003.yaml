base_translation:
  language: en
  yaml_path: translation/ot/judges/017/003.yaml
  text: So he returned the eleven hundred pieces of silver to his mother[a], and his mother said, “I had solemnly dedicated the silver to Yahweh from my hand for my son, to make a carved image and a cast image[b]; so now I return it to you.”
translation:
  language: id
  text: Lalu ia mengembalikan seribu seratus keping perak itu kepada ibunya. Ibunya berkata, “Aku sungguh-sungguh telah mengkhususkan perak itu bagi Yahweh, dari tanganku sendiri, untuk anakku membuat patung pahatan dan patung tuangan.[a] Sekarang aku mengembalikannya kepadamu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani dapat menunjuk pada dua benda—sebuah patung pahatan dan sebuah patung tuangan—atau pada satu patung yang digambarkan dengan kedua istilah tersebut.
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: mengembalikan
  rationale: Bentuk Hifil dari שוב menyatakan menyebabkan sesuatu kembali, yakni menyerahkan kembali apa yang telah diambil.
- source_word: אֶלֶף וּמֵאָה הַכֶּסֶף
  choice: seribu seratus keping perak
  rationale: Teks menyebut jumlah perak tanpa menyatakan satuan berat secara eksplisit; “keping perak” alami dalam bahasa Indonesia dan tidak terlalu cepat memasukkan “syikal”.
- source_word: הַקְדֵּשׁ הִקְדַּשְׁתִּי
  choice: telah sungguh-sungguh mempersembahkan ... sebagai sesuatu yang kudus
  rationale: Infinitif absolut yang disertai verba finit memberi penegasan, sedangkan akar קדש mengandung gagasan mengkhususkan sebagai kudus bagi penggunaan keagamaan.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה dan mempertahankan arah atau penerima pengudusan.
- source_word: מִיָּדִי
  choice: dari tanganku sendiri
  rationale: Mempertahankan gambaran idiom Ibrani sekaligus menjadikannya wajar dalam bahasa Indonesia; ungkapan ini menekankan kepemilikan, sumber, atau tindakan pribadi sang ibu.
- source_word: לִבְנִי
  choice: untuk anakku
  rationale: Preposisi ל paling wajar menunjukkan pihak yang dimaksudkan sebagai penerima manfaat atau tujuan.
- source_word: פֶּסֶל וּמַסֵּכָה
  choice: patung pahatan dan patung tuangan
  rationale: Membedakan benda yang dipahat dari benda yang dibuat dengan menuang bahan cair, tanpa memakai istilah evaluatif yang tidak eksplisit pada kedua nomina itu.
- source_word: אֲשִׁיבֶנּוּ לָךְ
  choice: aku mengembalikannya kepadamu
  rationale: Bentuk Hifil imperfek dalam ujaran ini dapat menyatakan tindakan langsung atau yang segera dilakukan; bentuk kini terasa alami dan tetap dekat dengan konteks.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama perjanjian dan selaras dengan lapisan konsultasi yang telah diperbarui.
- issue: Bahasa pengudusan yang berujung pada pembuatan patung
  choice: mempertahankan bahwa perak dipersembahkan sebagai kudus bagi Yahweh untuk membuat patung
  alternative: melunakkan ungkapan menjadi sekadar menyumbangkan perak atau secara eksplisit mengecam tindakan itu
  rationale: Bahasa Ibrani menyandingkan pengudusan bagi Yahweh dengan pembuatan patung. Terjemahan tidak mengharmoniskan atau menghapus ketegangan teologis tersebut.
- issue: Kemungkinan satu benda atau dua benda dalam פֶּסֶל וּמַסֵּכָה
  choice: patung pahatan dan patung tuangan
  alternative: sebuah patung pahatan, yaitu patung tuangan
  rationale: Konjungsi secara formal menyebut kedua istilah, tetapi konteks tidak sepenuhnya memastikan apakah dua benda berbeda atau dua sebutan bagi satu benda; catatan kaki mempertahankan kemungkinan itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. “Sungguh-sungguh” menyampaikan penegasan gramatikal, sedangkan “dipersembahkan ... sebagai sesuatu yang kudus” mempertahankan nuansa kultis tanpa terdengar terlalu teknis. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang ambigu.
