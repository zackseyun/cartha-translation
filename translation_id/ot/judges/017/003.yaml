revisions:
- from: Lalu ia mengembalikan seribu seratus keping perak itu kepada ibunya. Ibunya berkata, “Aku telah sungguh-sungguh mempersembahkan perak ini sebagai sesuatu yang kudus bagi Yahweh, dari tanganku sendiri untuk anakku, supaya dibuat menjadi patung pahatan dan patung tuangan.[a] Sekarang aku mengembalikannya kepadamu.”
  to: Lalu ia mengembalikan seribu seratus keping perak itu kepada ibunya. Ibunya berkata, “Aku sungguh-sungguh telah mengkhususkan perak itu bagi Yahweh, dari tanganku sendiri, untuk anakku membuat patung pahatan dan patung tuangan.[a] Sekarang aku mengembalikannya kepadamu.”
  rationale: Revisi memulihkan hubungan sintaktis antara “untuk anakku” dan “membuat,” mengganti konstruksi yang kurang langsung dengan padanan kultis yang lebih setia, serta mempertahankan jumlah perak, nama ilahi, penegasan pengudusan, ketegangan teologis, dan ambiguitas mengenai satu atau dua patung.
