base_translation:
  language: en
  yaml_path: translation/ot/judges/017/010.yaml
  text: Micah said to him[a], “Stay with me, and be a father and a priest to me, and I will give you ten pieces of silver a year, a set of clothes[c][b], and your living.” So the Levite went in.
translation:
  language: id
  text: Mikha berkata kepadanya, “Tinggallah bersamaku dan jadilah bapak serta imam bagiku. Aku akan memberimu sepuluh keping perak setahun[a], seperangkat pakaian[b], dan biaya hidupmu.” Lalu orang Lewi itu pergi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sepuluh perak”; satuannya tidak disebutkan. Terjemahan “sepuluh syikal perak” merupakan penafsiran yang umum.
    reason: lexical_alternative
  - marker: b
    text: Atau “jatah pakaian.”
    reason: lexical_alternative
  - marker: c
    text: Atau “masuk.” Kata kerja Ibraninya berarti “pergi”, tetapi dalam konteks ini mungkin menyiratkan bahwa ia masuk ke rumah Mikha.
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבָה עִמָּדִי
  choice: Tinggallah bersamaku
  rationale: Bentuk perintah dari ישׁב mengundang orang Lewi itu untuk menetap bersama Mikha; bentuk “tinggallah” alami dalam bahasa Indonesia dan mempertahankan gagasan tinggal menetap.
- source_word: לְאָב וּלְכֹהֵן
  choice: bapak serta imam
  rationale: “Bapak” mempertahankan metafora kehormatan dan kewibawaan dalam teks Ibrani tanpa mengubahnya menjadi istilah jabatan yang lebih khusus; כֹהֵן diterjemahkan langsung sebagai “imam”.
- source_word: עֲשֶׂרֶת כֶּסֶף
  choice: sepuluh keping perak
  rationale: Teks Ibrani secara harfiah menyebut “sepuluh perak” tanpa menentukan satuannya. “Keping” menghasilkan ungkapan Indonesia yang wajar sambil tidak memasukkan satuan syikal ke dalam teks utama.
- source_word: לַיָּמִים
  choice: setahun
  rationale: Dalam konteks pembayaran, ungkapan ini menyatakan jangka tahunan; “setahun” ringkas dan alami.
- source_word: וְעֵרֶךְ בְּגָדִים
  choice: seperangkat pakaian
  rationale: Frasa ini menunjuk pada penyediaan atau jatah pakaian. “Seperangkat pakaian” menyampaikan makna konkret dengan bahasa Indonesia yang mudah dipahami, sedangkan alternatifnya dicatat dalam catatan kaki.
- source_word: וּמִחְיָתֶךָ
  choice: dan biaya hidupmu
  rationale: מִחְיָה mencakup nafkah atau pemeliharaan hidup, bukan hanya makanan. “Biaya hidupmu” mempertahankan cakupan dukungan yang luas.
- source_word: וַיֵּלֶךְ הַלֵּוִי
  choice: Lalu orang Lewi itu masuk
  rationale: Kata kerja dasarnya berarti “pergi”, tetapi dalam konteks penerimaan undangan untuk tinggal di rumah Mikha dapat dipahami sebagai masuk. Catatan kaki mempertahankan pembacaan harfiahnya.
theological_decisions:
- issue: Pemakaian “bapak” sebagai sebutan kehormatan dalam konteks tempat ibadah Mikha
  choice: Mempertahankan “bapak” secara harfiah
  alternative: penasihat; pembimbing rohani
  rationale: Teks Ibrani sengaja memakai metafora kekeluargaan. Mempertahankannya menjaga gambaran hubungan sosial-keagamaan itu tanpa membenarkan tata ibadahnya atau memasukkan istilah gerejawi yang muncul kemudian.
- issue: Satuan bagi jumlah perak tidak disebutkan
  choice: Tidak menambahkan “syikal” dalam teks utama
  alternative: sepuluh syikal perak
  rationale: Teks sumber hanya menyebut “sepuluh perak”. Terjemahan tidak boleh memastikan satuan yang tidak dinyatakan oleh bahasa Ibrani.
- issue: Arti kontekstual וַיֵּלֶךְ pada akhir ayat
  choice: masuk
  alternative: pergi
  rationale: Konteks dapat menyiratkan bahwa orang Lewi itu masuk ke rumah Mikha setelah menerima undangan, tetapi arti dasar “pergi” tetap diakui dalam catatan kaki agar ketegangan teks tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. “Bapak” dipilih daripada “ayah” karena lebih alami sebagai sebutan kehormatan bagi figur berwibawa, sementara “orang Lewi” merupakan sebutan yang umum dan mudah dipahami.
