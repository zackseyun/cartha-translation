  text: וַ/יְהִי נַ֗עַר מִ/בֵּ֥ית לֶ֨חֶם֙ יְהוּדָ֔ה מִ/מִּשְׁפַּ֖חַת יְהוּדָ֑ה וְ/ה֥וּא לֵוִ֖י וְ/ה֥וּא גָֽר שָֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/007.yaml
  text: There was a young man from Bethlehem in Judah[a], from the clan of Judah; and he was a Levite[b], and he was sojourning there.
translation:
  language: id
  text: Ada seorang pemuda dari Betlehem di Yehuda, dari kaum Yehuda; ia seorang Lewi, dan ia tinggal sebagai pendatang[a] di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menetap sementara di sana.” Kata Ibrani ini dapat berarti tinggal sebagai pendatang atau orang luar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ada
  rationale: Bentuk ini memperkenalkan tokoh baru dalam narasi. 'Ada' alami dalam bahasa Indonesia dan tidak menambahkan penanda waktu yang tidak tersurat.
- source_word: נַעַר
  choice: seorang pemuda
  rationale: Dalam konteks ini נַעַר menunjuk kepada laki-laki muda, bukan fungsi seorang pelayan.
- source_word: מִבֵּית לֶחֶם יְהוּדָה
  choice: dari Betlehem di Yehuda
  rationale: Yehuda menerangkan lokasi Betlehem dan membedakannya dari tempat lain yang bernama sama.
- source_word: מִמִּשְׁפַּחַת יְהוּדָה
  choice: dari kaum Yehuda
  rationale: מִשְׁפָּחָה menunjuk kepada kelompok kekerabatan atau kaum; 'kaum' lebih tepat daripada 'suku' dan lebih wajar daripada 'klan' dalam register Alkitab Indonesia.
- source_word: לֵוִי
  choice: seorang Lewi
  rationale: Sebutan ini secara ringkas mempertahankan identitas orang itu sebagai orang Lewi tanpa menyelaraskannya dengan keterangan sebelumnya.
- source_word: גָר שָׁם
  choice: tinggal sebagai pendatang di sana
  rationale: גור menyatakan tinggal di suatu tempat sebagai orang yang bukan anggota asli atau pemilik tetap; frasa ini mempertahankan nuansa tersebut tanpa memakai istilah arkais.
theological_decisions:
- issue: Ketegangan identitas antara 'dari kaum Yehuda' dan 'seorang Lewi'
  choice: Kedua pernyataan dipertahankan berdampingan tanpa harmonisasi.
  alternative: Menafsirkan 'dari kaum Yehuda' semata-mata secara geografis atau sosial dan memperjelasnya dalam teks utama.
  rationale: Teks Ibrani menyajikan kedua keterangan tersebut berdampingan. Terjemahan harus mempertahankan ketegangan yang sungguh ada dan tidak menyelesaikannya secara interpretatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur koordinatif teks Ibrani dipertahankan secukupnya, tetapi pengulangan kata penghubung disederhanakan agar alami. Penanda catatan kaki ditempatkan sesudah frasa yang diterangkannya.
