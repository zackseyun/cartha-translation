base_translation:
  language: en
  yaml_path: translation/ot/judges/017/008.yaml
  text: And the man went from the city[a], from Bethlehem of Judah, to sojourn wherever he might find a place. And he came to the hill country of Ephraim, as far as the house of Micah, to continue his journey.
translation:
  language: id
  text: Orang itu pergi dari kota Betlehem di Yehuda untuk tinggal sementara di mana pun ia dapat menemukan tempat. Dalam perjalanannya, ia tiba di daerah pegunungan Efraim, sampai ke rumah Mikha.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “untuk melanjutkan perjalanannya” atau “untuk meneruskan perjalanannya.” Secara harfiah, ungkapan Ibraninya berarti “untuk membuat jalannya.”
    reason: Ungkapan לַעֲשׂוֹת דַּרְכּוֹ bersifat idiomatis. Ungkapan ini dapat dipahami secara sirkumstansial, “dalam perjalanannya,” atau dengan nuansa tujuan, “untuk melanjutkan perjalanannya.”
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: pergi
  rationale: Bentuk naratif dari הלך menyatakan gerak secara sederhana; “pergi” alami dan dekat dengan teks sumber.
- source_word: הָאִישׁ
  choice: orang itu
  rationale: האיש secara harfiah berarti “laki-laki/orang itu.” Konteks ayat sebelumnya mengenalinya sebagai orang muda dan seorang Lewi, tetapi ayat ini sendiri memakai sebutan umum.
- source_word: מֵהָעִיר מִבֵּית לֶחֶם יְהוּדָה
  choice: dari kota Betlehem di Yehuda
  rationale: עיר dapat berarti kota atau permukiman; “kota” mempertahankan padanan leksikal langsung, sedangkan “di Yehuda” mengungkapkan penentu geografis secara alami dalam bahasa Indonesia.
- source_word: לָגוּר
  choice: untuk tinggal sementara
  rationale: גור menunjuk pada tinggal sebagai pendatang atau untuk suatu masa; “tinggal sementara” menyampaikan nuansa tersebut tanpa istilah yang kuno.
- source_word: בַּאֲשֶׁר יִמְצָא
  choice: di mana pun ia dapat menemukan tempat
  rationale: Ungkapan ini menunjukkan pencarian tempat mana pun yang tersedia. Kata “tempat” merupakan objek tersirat yang perlu dinyatakan agar wajar dalam bahasa Indonesia.
- source_word: וַיָּבֹא
  choice: ia sampai
  rationale: בוא di sini menyatakan tiba di wilayah tujuan dalam rangkaian perjalanan.
- source_word: הַר אֶפְרַיִם
  choice: daerah pegunungan Efraim
  rationale: Ungkapan geografis ini menunjuk pada kawasan perbukitan atau pegunungan Efraim, bukan satu gunung tertentu.
- source_word: עַד בֵּית מִיכָה
  choice: hingga ke rumah Mikha
  rationale: עד menyatakan batas atau titik yang dicapai dalam perjalanan.
- source_word: לַעֲשׂוֹת דַּרְכּוֹ
  choice: sementara menempuh perjalanannya
  rationale: Secara harfiah ungkapan ini berarti “membuat jalannya.” Terjemahan utama memahaminya secara sirkumstansial sebagai perjalanan yang sedang ditempuh, sambil mempertahankan kemungkinan nuansa tujuan dalam catatan kaki.
