translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Susunan kalimat mempertahankan urutan gerak dalam teks Ibrani, sementara objek tersirat “tempat” dinyatakan demi kejelasan. Penanda catatan kaki ditempatkan pada ungkapan yang benar-benar dijelaskannya.
