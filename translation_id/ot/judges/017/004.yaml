  text: וַ/יָּ֥שֶׁב אֶת הַ/כֶּ֖סֶף לְ/אִמּ֑/וֹ וַ/תִּקַּ֣ח אִמּ/וֹ֩ מָאתַ֨יִם כֶּ֜סֶף וַ/תִּתְּנֵ֣/הוּ לַ/צּוֹרֵ֗ף וַֽ/יַּעֲשֵׂ֨/הוּ֙ פֶּ֣סֶל וּ/מַסֵּכָ֔ה וַ/יְהִ֖י בְּ/בֵ֥ית מִיכָֽיְהוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/004.yaml
  text: So he returned the silver to his mother[a], and his mother took two hundred pieces of silver and gave it to the silversmith, and he made it into a carved image and a cast image[c][b], and it was in the house of Micah.
translation:
  language: id
  text: Lalu ia mengembalikan perak itu kepada ibunya. Ibunya mengambil dua ratus keping perak[a] dan memberikannya kepada tukang perak, yang membuatnya menjadi patung pahatan dan patung tuangan[b]. Itu ada di rumah Mikha.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dua ratus syikal perak”. Teks Ibrani hanya berbunyi “dua ratus perak” dan tidak menyebutkan satuannya secara eksplisit dalam ayat ini.
    reason: lexical_alternative
  - marker: b
    text: Atau “patung ukiran dan patung logam tuangan”. Kedua istilah ini mungkin menggambarkan satu benda atau satu kesatuan, tetapi dapat juga dipahami sebagai dua benda.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “dan itu ada di rumah Mikha”. Bahasa Ibrani memakai verba tunggal sesudah “patung pahatan dan patung tuangan”, kemungkinan dengan memandang hasil buatan itu sebagai satu benda atau satu kesatuan.
    reason: source_syntax
lexical_decisions:
- source_word: וַיָּשֶׁב
  choice: mengembalikan
  rationale: Bentuk Hifil dari שוב menyatakan bahwa ia membuat perak itu kembali kepada pemilik sebelumnya; 'mengembalikan' alami dan tepat dalam bahasa Indonesia.
- source_word: הַכֶּסֶף
  choice: perak itu
  rationale: כֶּסֶף dapat berarti perak atau uang, tetapi bahan tersebut kemudian dibentuk oleh tukang logam, sehingga makna konkret 'perak' lebih sesuai.
- source_word: מָאתַיִם כֶּסֶף
  choice: dua ratus keping perak
  rationale: Teks Ibrani hanya menyebut angka dan 'perak' tanpa menyatakan satuan. 'Keping perak' alami dalam bahasa Indonesia tanpa memastikan satuan syikal.
- source_word: לַצּוֹרֵף
  choice: kepada tukang perak
  rationale: צֹרֵף menunjuk kepada pengolah atau pemurni logam; karena bahannya perak, 'tukang perak' paling sesuai dengan konteks.
- source_word: וַיַּעֲשֵׂהוּ
  choice: yang membuatnya menjadi
  rationale: Subjek maskulin tunggal paling wajar merujuk kepada tukang perak, dan akhiran objek tunggal merujuk kepada perak tersebut.
- source_word: פֶּסֶל
  choice: patung pahatan
  rationale: פֶּסֶל adalah patung atau gambar yang dipahat; pilihan ini mempertahankan arti leksikal tanpa menambahkan penilaian eksplisit melalui kata 'berhala'.
- source_word: וּמַסֵּכָה
  choice: dan patung tuangan
  rationale: מַסֵּכָה menunjuk kepada benda yang dibuat dengan menuang logam cair; 'patung tuangan' akurat dan mudah dipahami.
- source_word: וַיְהִי בְּבֵית מִיכָיְהוּ
  choice: Patung itu ditempatkan di rumah Mikha
  rationale: Klausa mempertahankan acuan tunggal dari verba Ibrani setelah dua sebutan benda, sambil menyajikannya secara alami dalam bahasa Indonesia; catatan kaki menjelaskan kejanggalan gramatikalnya.
- source_word: מִיכָיְהוּ
  choice: Mikha
  rationale: Mikha adalah bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia untuk tokoh ini.
theological_decisions:
- issue: Apakah פֶּסֶל וּמַסֵּכָה harus diterjemahkan dengan istilah yang secara eksplisit mengecam
  choice: patung pahatan dan patung tuangan
  alternative: berhala pahatan dan berhala tuangan
  rationale: Konteks lebih luas menunjukkan bahwa benda-benda ini merupakan objek kultis yang bermasalah, tetapi ayat ini memakai istilah bendawi. Terjemahan mempertahankan ungkapan sumber tanpa memperkuatnya menjadi parafrasa teologis.
- issue: Apakah dua istilah menunjuk kepada satu benda atau dua benda
  choice: Mempertahankan kedua istilah tetapi memakai acuan tunggal pada klausa terakhir
  alternative: Menerjemahkannya sebagai dua patung yang berbeda dan memakai acuan jamak
  rationale: Teks menyebut dua nomina yang dihubungkan dengan 'dan', tetapi verba terakhir berbentuk tunggal dan sebelumnya terdapat akhiran objek tunggal. Ketegangan ini tidak diselesaikan secara dogmatis; catatan kaki mempertahankan ambiguitasnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Pengulangan 'ibunya' dipertahankan sesuai teks Ibrani. Istilah teknis dibuat mudah dipahami tanpa memakai kosakata arkais atau mempertegas kecaman yang tidak dinyatakan secara eksplisit oleh nomina sumber.
