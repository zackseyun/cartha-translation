base_translation:
  language: en
  yaml_path: translation/ot/judges/017/012.yaml
  text: So Micah ordained the Levite[a], and the young man became his priest and was in Micah’s house.
translation:
  language: id
  text: Mikha pun melantik orang Lewi itu[a]. Pemuda itu menjadi imamnya dan berada di rumah Mikha.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “memenuhi tangan orang Lewi itu”, sebuah ungkapan untuk melantik atau mengangkat seseorang ke dalam pelayanan keimaman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַלֵּא אֶת־יַד
  choice: melantik
  rationale: Ungkapan Ibrani harfiah “memenuhi tangan” menyatakan pengangkatan seseorang ke dalam jabatan atau pelayanan keimaman. “Melantik” menyampaikan fungsi ungkapan itu secara wajar dalam bahasa Indonesia tanpa menyatakan bahwa tindakan tersebut sah di hadapan Allah.
- source_word: הַלֵּוִי
  choice: orang Lewi itu
  rationale: Bentuk ini secara alami menunjukkan identitas orang tersebut sebagai anggota suku Lewi dan mempertahankan unsur definit dalam konteks narasi.
- source_word: הַנַּעַר
  choice: orang muda itu
  rationale: Kata נַעַר dapat berarti anak laki-laki, pemuda, atau pelayan. Karena tokoh ini bertindak mandiri dan menjalankan fungsi keimaman, “orang muda itu” paling sesuai dengan konteks.
- source_word: לְכֹהֵן
  choice: menjadi imamnya
  rationale: Preposisi לְ menandai peran atau fungsi, sedangkan pronomina pada לוֹ mengaitkan peran itu dengan Mikha. “Menjadi imamnya” menyampaikan peralihan ke dalam peran tersebut dengan alami.
- source_word: בְּבֵית מִיכָה
  choice: tinggal di rumah Mikha
  rationale: Secara harfiah frasa ini berarti “berada di rumah Mikha”. Dalam konteks naratif, “tinggal di rumah Mikha” secara alami menyatakan keberadaan menetap sang pemuda dalam rumah itu.
theological_decisions:
- issue: Penggambaran pelantikan dalam tata ibadah pribadi yang tidak teratur tanpa menyiratkan keabsahan ilahi
  choice: Mikha pun melantik orang Lewi itu
  alternative: Mikha pun menahbiskan orang Lewi itu; Mikha pun memenuhi tangan orang Lewi itu
  rationale: “Melantik” menyampaikan bahwa Mikha memasukkan orang Lewi itu ke dalam jabatan keimaman, tetapi tidak dengan sendirinya menyatakan bahwa tindakan tersebut diperintahkan atau disetujui Allah. Bentuk harfiahnya dipertahankan dalam catatan kaki karena merupakan idiom penting.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. “Melantik” dipilih daripada “menahbiskan” untuk menyampaikan pengangkatan ke jabatan tanpa membawa konotasi legitimasi gerejawi atau ilahi. Partikel “pun” mencerminkan kelanjutan tindakan dalam narasi.
