  yaml_path: translation/ot/judges/017/011.yaml
  text: So the Levite agreed to stay with the man[b][a], and the young man became like one of his sons to him.
translation:
  language: id
  text: Lalu orang Lewi itu bersedia tinggal dengan orang itu[a], dan pemuda itu menjadi seperti salah seorang anaknya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “setuju untuk tinggal dengan orang itu.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “pemuda itu menjadi baginya seperti salah seorang anaknya,” yang menggambarkan kedudukan orang Lewi itu dalam rumah tangga orang tersebut.
    reason: cultural_note
lexical_decisions:
- source_word: וַיּוֹאֶל
  choice: bersedia
  rationale: Bentuk Hifil dari יאל menyatakan kemauan atau persetujuan. “Bersedia” terdengar alami dalam bahasa Indonesia dan mempertahankan nuansa kesediaan tanpa menjadikannya sekadar persetujuan lisan.
- source_word: הַלֵּוִי
  choice: orang Lewi itu
  rationale: Nomina tentu ini menunjuk kepada orang Lewi yang sudah diperkenalkan dalam konteks sebelumnya.
- source_word: לָשֶׁבֶת
  choice: tinggal
  rationale: Kata ישׁב dapat berarti duduk, menetap, atau tinggal. Dalam konteks menerima tempat dalam rumah tangga Mikha, “tinggal” paling alami dan tepat.
- source_word: אֶת הָאִישׁ
  choice: bersama orang tersebut
  rationale: Sesudah ישׁב, אֶת menyatakan kebersamaan atau hubungan tempat tinggal. “Bersama” mengungkapkan hubungan itu secara wajar dalam bahasa Indonesia.
- source_word: וַיְהִי
  choice: menjadi
  rationale: Kata היה di sini menyatakan keadaan atau hubungan yang terwujud sebagai hasil dari keputusan sebelumnya; “menjadi” mempertahankan perkembangan tersebut.
- source_word: הַנַּעַר
  choice: pemuda tersebut
  rationale: נַעַר dapat berarti anak laki-laki, pemuda, atau pelayan. Karena orang Lewi ini bertindak mandiri, “pemuda” paling sesuai.
- source_word: כְּאַחַד מִבָּנָיו
  choice: seperti salah seorang anaknya
  rationale: Partikel perbandingan כְּ dipertahankan dengan “seperti,” sehingga teks tidak menyatakan bahwa ia secara harfiah menjadi anak kandung atau anak angkat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. “Orang tersebut” menghindari pengulangan yang terlalu kaku pada klausa pertama, sedangkan susunan “bagi orang itu” pada klausa kedua mempertahankan unsur לֹו (“baginya”) sekaligus menjelaskan bahwa perbandingan itu menggambarkan hubungan pemuda tersebut dengan kepala rumah tangga.
