  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מִיכָ֔ה עַתָּ֣ה יָדַ֔עְתִּי כִּֽי יֵיטִ֥יב יְהוָ֖ה לִ֑/י כִּ֧י הָיָה לִ֛/י הַ/לֵּוִ֖י לְ/כֹהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/013.yaml
  text: Then Micah said[a], “Now I know that Yahweh will do good to me, because I have a Levite as priest.”
translation:
  language: id
  text: Lalu Mikha berkata, “Sekarang aku tahu bahwa Yahweh akan berbuat baik kepadaku, karena aku mempunyai orang Lewi itu sebagai imam.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “Lalu ... berkata” alami dalam bahasa Indonesia dan mempertahankan kesinambungan peristiwa.
- source_word: מִיכָה
  choice: Mikha
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: עַתָּה
  choice: Sekarang
  rationale: Adverbia waktu ini menandai kesimpulan yang baru dicapai Mikha.
- source_word: יָדַעְתִּי
  choice: aku tahu
  rationale: Bentuk perfektif menyatakan keadaan mengetahui sebagai hasil dari suatu kesadaran; bentuk kini bahasa Indonesia paling alami.
- source_word: כִּי
  choice: bahwa
  rationale: כִּי pertama memperkenalkan isi dari apa yang diketahui Mikha.
- source_word: יֵיטִיב
  choice: akan berbuat baik
  rationale: Bentuk hifil dari יטב berarti berbuat baik atau memperlakukan dengan baik; pilihan ini mempertahankan keluasan makna tanpa mempersempitnya menjadi kemakmuran materi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: לִי
  choice: kepadaku
  rationale: Preposisi menandai pihak yang menerima kebaikan; “kepadaku” sesuai dengan konstruksi “berbuat baik”.
- source_word: כִּי
  choice: karena
  rationale: כִּי kedua menyatakan alasan bagi keyakinan Mikha.
- source_word: הָיָה לִי
  choice: aku mempunyai
  rationale: Secara harfiah “telah ada bagiku”; ini adalah konstruksi kepemilikan yang secara alami diterjemahkan “aku mempunyai”.
- source_word: הַלֵּוִי
  choice: orang Lewi itu
  rationale: Artikel tentu Ibrani dipertahankan karena menunjuk kepada orang Lewi tertentu yang telah diperkenalkan dalam narasi; bahasa Indonesia dapat mengungkapkannya secara alami dengan “itu”.
- source_word: לְכֹהֵן
  choice: sebagai imam
  rationale: Lamed menandai peran atau fungsi; “sebagai imam” adalah padanan Indonesia yang alami dan tepat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama ilahi tanpa menggantinya dengan sebuah gelar.
- issue: Keyakinan Mikha bahwa Yahweh akan berbuat baik kepadanya
  choice: Pernyataan Mikha diterjemahkan apa adanya tanpa membenarkan penalarannya
  alternative: Menambahkan bahasa yang menyatakan bahwa keyakinannya keliru atau bersifat ironis
  rationale: Ayat melaporkan kesimpulan Mikha berdasarkan keberadaan seorang Lewi sebagai imam, tetapi tidak secara eksplisit menilai kesimpulan itu dalam kalimat ini. Ketegangan teologis dan ironi naratif harus dibiarkan muncul dari konteks.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pronomina “aku” sesuai dengan ujaran langsung dalam narasi. Artikel Ibrani pada הַלֵּוִי dipertahankan secara alami melalui “orang Lewi itu”; tidak diperlukan catatan kaki karena bahasa Indonesia mampu menyatakan ketentuan tersebut tanpa kejanggalan.
