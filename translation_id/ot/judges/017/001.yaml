  terminology: “Efraim” adalah bentuk Indonesia yang mapan. “Mikhayehu” konsisten dengan kebijakan transliterasi nama sumber, sedangkan catatan kaki secara memadai memberi bentuk tradisional “Mikha”. Penanda catatan kaki ditempatkan tepat pada nama yang dijelaskan.
