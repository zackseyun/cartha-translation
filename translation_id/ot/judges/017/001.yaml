  text: וַֽ/יְהִי אִ֥ישׁ מֵֽ/הַר אֶפְרָ֖יִם וּ/שְׁמ֥/וֹ מִיכָֽיְהוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/017/001.yaml
  text: There was a man from the hill country of Ephraim[a], and his name was Mikayhu.
translation:
  language: id
  text: Ada seorang laki-laki dari daerah pegunungan Efraim, dan namanya Mikhayehu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara tradisional nama ini diterjemahkan sebagai “Mikha”. Bentuk Ibrani di sini ialah Mikhayehu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ada
  rationale: Dalam pembukaan unit narasi ini, bentuk wayyiqtol dari היה memperkenalkan keberadaan seorang tokoh. 'Ada' merupakan ungkapan Indonesia yang alami tanpa menambahkan penanda waktu eksplisit.
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Kata ini menunjuk kepada seorang pribadi laki-laki; terjemahan ini jelas dan tidak menambahkan nuansa 'tertentu' yang tidak dinyatakan.
- source_word: מֵהַר אֶפְרָיִם
  choice: dari daerah pegunungan Efraim
  rationale: Frasa ini menunjuk kepada kawasan dataran tinggi yang berkaitan dengan Efraim, bukan satu gunung tertentu.
- source_word: וּשְׁמוֹ
  choice: dan namanya
  rationale: Mempertahankan koordinasi sederhana dalam bahasa Ibrani sambil menghasilkan susunan yang wajar dalam bahasa Indonesia.
- source_word: מִיכָיְהוּ
  choice: Mikhayehu
  rationale: Transliterasi ini mencerminkan bentuk Ibrani yang muncul khusus dalam ayat ini, alih-alih menggantinya dengan bentuk nama tradisional yang lebih pendek.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Daerah pegunungan' dipilih agar pembaca tidak mengira bahwa הַר menunjuk kepada satu puncak gunung. Penanda catatan kaki ditempatkan sesudah nama karena catatan menjelaskan bentuk nama tersebut.
