base_translation:
  language: en
  yaml_path: translation/ot/judges/008/008.yaml
  text: From there he went up to Penuel and spoke to them in the same way[b][a], and the men of Penuel answered him just as the men of Succoth had answered.
translation:
  language: id
  text: Dari sana Gideon naik ke Pnuel[b] dan berbicara kepada mereka dengan cara yang sama.[a] Orang-orang Pnuel menjawabnya sama seperti orang-orang Sukot telah menjawab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dan berbicara kepada mereka demikian.” Bahasa Ibrani menunjuk kembali kepada permintaan atau perkataan yang disampaikan dalam ayat sebelumnya.'
    reason: lexical_alternative
  - marker: b
    text: Nama Pnuel juga ditulis Peniel di bagian lain.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַל מִשָּׁם
  choice: Dari sana Gideon pergi
  rationale: Kata kerja עָלָה mengandung arah ‘naik/pergi ke tempat yang lebih tinggi’. Dalam bahasa Indonesia, ‘pergi’ lebih alami dalam konteks perpindahan ini; nama Gideon ditambahkan untuk memperjelas subjek yang tersirat dalam bentuk verba Ibrani.
- source_word: פְּנוּאֵל
  choice: Pnuel
  rationale: Transliterasi mengikuti bentuk konsonantal nama tempat dalam ayat ini dan bentuk yang lazim dipakai dalam Alkitab bahasa Indonesia.
- source_word: וַיְדַבֵּר אֲלֵיהֶם כָּזֹאת
  choice: dan berbicara kepada mereka dengan cara yang sama
  rationale: Secara harfiah, frasa ini berarti ‘berbicara kepada mereka demikian’. Ungkapan ‘dengan cara yang sama’ menyampaikan rujukannya kepada permintaan Gideon dalam ayat sebelumnya tanpa mengulang isi perkataan.
- source_word: וַיַּעֲנוּ אוֹתוֹ
  choice: menjawabnya
  rationale: ענה dengan objek langsung secara alami berarti ‘menjawab dia’; ‘menjawabnya’ ringkas dan idiomatis.
- source_word: אַנְשֵׁי פְנוּאֵל
  choice: orang-orang Pnuel
  rationale: אַנְשֵׁי secara harfiah berarti ‘kaum laki-laki/orang-orang dari’. Dalam konteks wakil atau penduduk kota, ‘orang-orang Pnuel’ merupakan ungkapan Indonesia yang alami tanpa memastikan bahwa seluruh penduduk yang dimaksud hanya laki-laki.
- source_word: כַּאֲשֶׁר עָנוּ אַנְשֵׁי סֻכּוֹת
  choice: seperti orang-orang Sukot sebelumnya
  rationale: כַּאֲשֶׁר menyatakan perbandingan. ‘Sebelumnya’ menjelaskan bahwa jawaban orang Sukot telah terjadi lebih dahulu, sementara verba ‘menjawab’ dapat dipahami dari klausa utama tanpa pengulangan yang kaku.
- source_word: סֻכּוֹת
  choice: Sukot
  rationale: Transliterasi baku Indonesia bagi nama tempat Ibrani סֻכּוֹת.
