  source_fidelity: 'Makna pokok diterjemahkan dengan tepat: Gideon mengajukan permintaan kepada kelompok itu agar setiap orang memberikan satu perhiasan emas dari bagian rampasannya. Namun, אֶשְׁאֲלָה מִכֶּם שְׁאֵלָה secara lebih langsung menyatakan bahwa ia mengajukan suatu permintaan, bukan sekadar “meminta satu hal.”'
