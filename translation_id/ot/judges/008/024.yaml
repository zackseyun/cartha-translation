base_translation:
  language: en
  yaml_path: translation/ot/judges/008/024.yaml
  text: 'Then Gideon said to them, “Let me ask one request of you: each man, give me an earring from his spoil.” For they had gold earrings, because they were Ishmaelites.'
translation:
  language: id
  text: 'Lalu Gideon berkata kepada mereka, “Aku hendak mengajukan satu permintaan kepada kalian: hendaklah setiap orang memberikan kepadaku sebuah anting-anting dari jarahannya.” Sebab mereka memiliki anting-anting emas, karena mereka adalah orang Ismael.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶשְׁאֲלָה מִכֶּם שְׁאֵלָה
  choice: Aku hendak meminta satu hal dari kalian
  rationale: Mengungkapkan konstruksi intensif ‘meminta suatu permintaan’ secara alami dalam bahasa Indonesia tanpa menghilangkan bahwa Gideon mengajukan satu permintaan.
- source_word: אִישׁ
  choice: setiap orang
  rationale: Dalam konteks distributif, menunjuk masing-masing laki-laki di antara para prajurit; ‘setiap orang’ lebih wajar dan tetap tepat.
- source_word: נֶזֶם
  choice: anting-anting
  rationale: Dalam konteks ini benda perhiasan emas yang dikenakan kaum Ismael; padanan ‘anting-anting’ sesuai dengan konteks dan tradisi penerjemahan, meskipun kata Ibrani juga dapat merujuk pada cincin hidung di tempat lain.
- source_word: שְׁלָלוֹ
  choice: jarahannya
  rationale: Mempertahankan arti rampasan perang yang menjadi bagian masing-masing prajurit.
- source_word: יִשְׁמְעֵאלִים
  choice: orang Ismael
  rationale: Padanan etnonim yang jelas dan lazim dalam bahasa Indonesia Alkitabiah.
theological_decisions:
- issue: Identitas musuh sebagai orang Ismael
  choice: karena mereka adalah orang Ismael
  alternative: karena mereka keturunan Ismael
  rationale: Terjemahan mempertahankan sebutan etnis teks tanpa mencoba menyelaraskannya secara eksplisit dengan penyebutan orang Midian dalam konteks yang lebih luas.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk ‘kalian’ dipakai untuk sasaran jamak, sedangkan ‘hendaklah’ mempertahankan nada permintaan yang diarahkan kepada tiap anggota kelompok.
