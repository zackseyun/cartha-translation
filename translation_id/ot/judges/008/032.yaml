base_translation:
  language: en
  yaml_path: translation/ot/judges/008/032.yaml
  text: And Gideon son of Joash died at a good old age and was buried in the tomb of Joash his father[b][a], in Ophrah of the Abiezrites.
translation:
  language: id
  text: Gideon anak Yoas meninggal pada usia tua yang baik dan dikuburkan di makam[a] Yoas, ayahnya, di Ofra milik kaum Abiezer.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan "makam" juga dapat berarti "kubur" atau "tempat pemakaman."
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, "Ofra orang Abiezer." Ungkapan ini mengaitkan Ofra dengan kaum atau marga Abiezer.
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  choice: meninggal
  rationale: Kata kerja מות menyatakan kematian secara langsung. 'Meninggal' merupakan ungkapan Indonesia yang wajar dan bermartabat tanpa mengaburkan maknanya.
- source_word: גִּדְעוֹן בֶּן יוֹאָשׁ
  choice: Gideon anak Yoas
  rationale: Frasa konstruksi ini mengidentifikasi Gideon berdasarkan garis keturunannya; 'anak Yoas' alami dalam bahasa Indonesia.
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: pada usia lanjut yang baik
  rationale: שֵׂיבָה berarti usia lanjut atau uban, dan טוֹבָה memberinya penilaian positif. Terjemahan ini mempertahankan unsur 'baik' tanpa memperluasnya menjadi 'puas menikmati hidup' atau sekadar 'sangat tua'.
- source_word: וַיִּקָּבֵר
  choice: dan dikuburkan
  rationale: Bentuk nifal dari קבר di sini bermakna pasif, yaitu 'dikuburkan'; waw penghubung diterjemahkan dengan 'dan'.
- source_word: בְּקֶבֶר
  choice: dalam makam
  rationale: קֶבֶר dapat menunjuk pada kubur, makam, atau tempat pemakaman. 'Makam' sesuai untuk tempat pemakaman keluarga dan tetap mempertahankan kemungkinan bangunan atau lokasi penguburan.
- source_word: יוֹאָשׁ אָבִיו
  choice: Yoas, ayahnya
  rationale: Susunan ini mempertahankan Yoas sebagai pemilik makam lalu menjelaskan hubungannya dengan Gideon melalui aposisi 'ayahnya'.
- source_word: בְּעָפְרָה
  choice: di Ofra
  rationale: Nama tempat ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: אֲבִי הָעֶזְרִי
  choice: milik kaum Abiezer
  rationale: Bentuk gentilik tunggal secara harfiah adalah 'orang Abiezer', tetapi dalam konteks ini menerangkan Ofra sebagai kota atau wilayah yang terkait dengan kaum Abiezer. 'Milik kaum Abiezer' menyampaikan hubungan tersebut secara alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Ungkapan 'usia lanjut yang baik' sengaja mempertahankan penilaian positif dalam teks Ibrani, meskipun sedikit kurang idiomatis daripada 'usia yang sangat lanjut'. Penanda catatan kaki ditempatkan setelah keseluruhan frasa lokasi karena catatan menerangkan Ofra sekaligus alternatif leksikal untuk makam.
