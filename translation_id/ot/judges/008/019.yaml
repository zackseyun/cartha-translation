base_translation:
  language: en
  yaml_path: translation/ot/judges/008/019.yaml
  text: And he said[a], “They were my brothers, the sons of my mother. As Yahweh lives, if you had let them live[b], I would not have killed you.”
translation:
  language: id
  text: Lalu ia berkata, “Mereka adalah saudara-saudaraku, putra-putra ibuku. Demi Yahweh yang hidup, seandainya kalian membiarkan mereka hidup, aku tidak akan membunuh kalian.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמַר
  choice: Lalu ia berkata
  rationale: Wayyiqtol meneruskan alur narasi dan memperkenalkan jawaban Gideon; “lalu” wajar dalam narasi Indonesia tanpa menambah makna yang tidak ada.
- source_word: אַחַי
  choice: saudara-saudaraku
  rationale: Konteks dan keterangan berikutnya menunjukkan saudara laki-laki dalam arti harfiah, bukan sekadar kerabat.
- source_word: בְּנֵי אִמִּי
  choice: anak-anak ibuku
  rationale: Terjemahan dekat terhadap ungkapan Ibrani yang menegaskan bahwa mereka bersaudara seibu; tidak disederhanakan menjadi “saudara kandung” karena teks hanya menyebut ibu yang sama.
- source_word: הֵם
  choice: mereka adalah
  rationale: Klausa nominal Ibrani memerlukan kopula dalam bahasa Indonesia; bentuk kini tetap alami ketika Gideon mengidentifikasi orang-orang yang telah dibunuh.
- source_word: חַי יְהוָה
  choice: Demi Yahweh yang hidup
  rationale: Mengungkapkan fungsi formula sumpah dengan bahasa Indonesia yang alami sekaligus mempertahankan nama ilahi.
- source_word: לוּ הַחֲיִתֶם אוֹתָם
  choice: seandainya kalian membiarkan mereka hidup
  rationale: לוּ menandai syarat yang berlawanan dengan kenyataan, sedangkan bentuk Hifil חיה berarti menyebabkan atau membiarkan tetap hidup.
- source_word: לֹא הָרַגְתִּי אֶתְכֶם
  choice: aku tidak akan membunuh kalian
  rationale: Perfek dalam akibat syarat kontrafaktual menyatakan bahwa pembunuhan itu tidak akan dilakukan; bentuk Indonesia ini mempertahankan orientasi pada tindakan Gideon yang segera menyusul.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה dalam formula sumpah
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi, bukan gelar; transliterasi “Yahweh” mempertahankan pembedaan tersebut.
- issue: Apakah ucapan Gideon merupakan sumpah yang sungguh-sungguh atau sekadar penegasan
  choice: Demi Yahweh yang hidup
  alternative: Yahweh hidup
  rationale: חַי יְהוָה adalah formula sumpah baku. Terjemahan pilihan menyampaikan fungsi pragmatisnya tanpa menambahkan penilaian moral atau teologis atas tindakan Gideon.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “ia/aku/kalian” sesuai dengan tuturan langsung dan jamak orang kedua. Ungkapan “anak-anak ibuku” dipertahankan untuk menjaga rincian kekerabatan serta menghindari kesimpulan berlebihan bahwa mereka pasti juga seayah.
