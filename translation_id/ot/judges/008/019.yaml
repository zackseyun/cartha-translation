  naturalness: Bahasa Indonesia baku dan mengalir. ‘Demi Yahweh yang hidup’ berfungsi alami sebagai formula sumpah, dan ‘seandainya kalian membiarkan mereka hidup’ dengan jelas menyatakan syarat yang berlawanan dengan kenyataan.
  terminology: ‘Yahweh’ mempertahankan nama ilahi יהוה. ‘Saudara-saudaraku’ sesuai dengan אַחַי dalam konteks ini; ‘putra-putra ibuku’ mempertahankan penegasan hubungan melalui ibu tanpa menyimpulkan bahwa mereka juga seayah.
