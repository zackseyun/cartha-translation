  text: וַ/יֹּ֨אמֶר֙ שָׂרֵ֣י סֻכּ֔וֹת הֲ֠/כַף זֶ֧בַח וְ/צַלְמֻנָּ֛ע עַתָּ֖ה בְּ/יָדֶ֑/ךָ כִּֽי נִתֵּ֥ן לִֽ/צְבָאֲ/ךָ֖ לָֽחֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/006.yaml
  text: Then the leaders of Succoth said, “Are the hands of Zebah and Zalmunna already in your hand, that we should give bread to your army?”
translation:
  language: id
  text: Lalu para pemimpin Sukot berkata, “Apakah Zebah dan Salmuna sudah dalam genggamanmu sehingga kami harus memberikan roti kepada pasukanmu?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׂרֵי סֻכּוֹת
  choice: para pemimpin Sukot
  rationale: שָׂרֵי menunjuk para pejabat atau pemuka kota; “para pemimpin” alami dan cukup luas dalam bahasa Indonesia modern.
- source_word: הֲכַף ... בְּיָדֶךָ
  choice: apakah ... sudah ada dalam genggamanmu
  rationale: Ungkapan harfiah tentang telapak/tangan menyatakan bahwa Zebah dan Salmuna telah dikuasai atau ditangkap. “Dalam genggamanmu” mempertahankan citra tangan sekaligus terdengar alami.
- source_word: עַתָּה
  choice: sudah
  rationale: Dalam pertanyaan retoris ini, עַתָּה menyoroti apakah kemenangan itu telah tercapai pada saat tersebut; “sudah” menyampaikan nuansa kontekstual ini secara idiomatis.
- source_word: צְבָאֲךָ
  choice: pasukanmu
  rationale: צָבָא di sini merujuk kepada pasukan Gideon, bukan konsep abstrak tentang peperangan.
- source_word: לֶחֶם
  choice: roti
  rationale: Makna leksikal langsung dipertahankan; dalam konteks ini roti juga berfungsi sebagai makanan bagi pasukan.
