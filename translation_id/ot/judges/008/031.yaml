  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/פִֽילַגְשׁ/וֹ֙ אֲשֶׁ֣ר בִּ/שְׁכֶ֔ם יָֽלְדָה לּ֥/וֹ גַם הִ֖יא בֵּ֑ן וַ/יָּ֥שֶׂם אֶת שְׁמ֖/וֹ אֲבִימֶֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/031.yaml
  text: And his concubine who was in Shechem also bore him a son[a], and he named him Abimelek.
translation:
  language: id
  text: Selirnya yang berada di Sikhem juga melahirkan seorang anak laki-laki baginya, lalu ia menamainya Abimelekh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפִילַגְשׁוֹ
  choice: Selirnya
  rationale: פִּילֶגֶשׁ menunjuk kepada seorang selir, yakni perempuan yang berstatus pasangan tetapi tidak memiliki kedudukan penuh sebagai istri; 'selir' merupakan padanan Indonesia yang langsung dan lazim. Konjungsi וּ diwakili secara alami oleh kesinambungan kalimat tanpa harus selalu diterjemahkan 'dan' pada awal ayat.
- source_word: אֲשֶׁר בִּשְׁכֶם
  choice: yang berada di Sikhem
  rationale: Klausa relatif ini mengenali selir tersebut berdasarkan lokasinya. 'Berada di' mempertahankan ketidakspesifikan בִּשְׁכֶם dan tidak menambahkan gagasan menetap yang tidak dinyatakan secara eksplisit.
- source_word: יָלְדָה לּוֹ
  choice: melahirkan ... baginya
  rationale: Kata יָלְדָה menyatakan tindakan melahirkan, sedangkan לּוֹ menandai bahwa anak itu dilahirkan baginya. Susunan Indonesia disesuaikan agar alami.
- source_word: גַם הִיא
  choice: juga
  rationale: גַם הִיא menegaskan bahwa perempuan ini pun melahirkan seorang anak. 'Juga' menyampaikan hubungan tambahan tersebut secara wajar dalam bahasa Indonesia.
- source_word: בֵּן
  choice: seorang anak laki-laki
  rationale: בֵּן berarti anak laki-laki atau putra. Dalam konteks tindakan melahirkan, 'seorang anak laki-laki' terdengar alami dan jelas dalam bahasa Indonesia modern.
- source_word: וַיָּשֶׂם אֶת־שְׁמוֹ
  choice: lalu ia menamainya
  rationale: Ungkapan harfiah 'menetapkan namanya' merupakan idiom Ibrani untuk memberi nama. 'Lalu ia menamainya' menyampaikan maknanya secara alami sekaligus mempertahankan urutan narasi.
- source_word: אֲבִימֶלֶךְ
  choice: Abimelekh
  rationale: Bentuk 'Abimelekh' mengikuti transliterasi bunyi konsonan akhir Ibrani ך secara lebih dekat dan sesuai dengan ejaan Indonesia.
