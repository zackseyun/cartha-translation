base_translation:
  language: en
  yaml_path: translation/ot/judges/008/035.yaml
  text: And they did not show kindness to the house of Jerubbaal (that is, Gideon), in keeping with all the good that he had done for Israel.
translation:
  language: id
  text: Mereka tidak menunjukkan kasih setia kepada keluarga Yerubaal, yaitu Gideon, sesuai dengan segala kebaikan yang telah dilakukannya bagi Israel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶסֶד
  choice: kasih setia
  rationale: Menyampaikan kebaikan yang berakar pada kesetiaan dan kewajiban relasional, bukan sekadar keramahan.
- source_word: בֵּית
  choice: keluarga
  rationale: Dalam konteks ini menunjuk kepada keluarga atau keturunan Gideon, bukan bangunan rumah.
- source_word: כְּכָל הַטּוֹבָה
  choice: sepadan dengan segala kebaikan
  rationale: Mempertahankan gagasan bahwa tanggapan Israel tidak sesuai dengan seluruh kebaikan yang telah Gideon lakukan.
- source_word: עָשָׂה עִם יִשְׂרָאֵל
  choice: yang telah dilakukannya bagi Israel
  rationale: Bahasa Indonesia alami untuk tindakan baik yang dilakukan demi kepentingan Israel.
theological_decisions:
- issue: Hubungan nama Yerubaal dan Gideon
  choice: Yerubaal, yaitu Gideon
  alternative: Yerubaal Gideon
  rationale: Menjelaskan bahwa kedua nama itu merujuk kepada orang yang sama tanpa menambahkan tafsiran teologis.
- issue: Makna חֶסֶד dalam kewajiban Israel kepada keluarga Gideon
  choice: kasih setia
  alternative: kebaikan
  rationale: Menjaga dimensi kesetiaan relasional dalam istilah Ibrani dan membedakannya dari הַטּוֹבָה, yang diterjemahkan sebagai 'kebaikan' pada bagian berikutnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ayat dibuat alami sambil mempertahankan kontras antara ketidaksetiaan Israel dan segala kebaikan Gideon.
