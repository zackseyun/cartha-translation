  text: וַ/יֹּ֛אמֶר גַּם לְ/אַנְשֵׁ֥י פְנוּאֵ֖ל לֵ/אמֹ֑ר בְּ/שׁוּבִ֣/י בְ/שָׁל֔וֹם אֶתֹּ֖ץ אֶת הַ/מִּגְדָּ֥ל הַ/זֶּֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/009.yaml
  text: He also said to the men of Penuel[a], “When I return in peace[c][b], I will tear down this tower.”
translation:
  language: id
  text: Ia juga berkata kepada orang-orang Pnuel[a], “Ketika aku kembali dengan selamat[b], aku akan merobohkan menara ini[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani secara harfiah berbunyi “orang-orang laki-laki Pnuel”; kemungkinan yang dimaksud ialah para pemimpin atau wakil laki-laki kota itu, bukan setiap penduduknya.
    reason: cultural_note
  - marker: b
    text: 'Secara harfiah: “dalam damai”; dalam konteks ini dapat berarti kembali dengan aman, berhasil, dan tanpa cedera.'
    reason: lexical_alternative
  - marker: c
    text: “Menara” mungkin merupakan menara pertahanan atau kubu berbenteng di dalam Pnuel.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: juga
  rationale: Menandai bahwa Gideon menyampaikan ancaman tambahan kepada kelompok lain, selaras dengan konteks ayat sebelumnya.
- source_word: לְאַנְשֵׁי פְנוּאֵל
  choice: kepada orang-orang Pnuel
  rationale: אַנְשֵׁי secara harfiah berarti ‘orang-orang laki-laki dari’; dalam konteks sipil, ungkapan ini mungkin menunjuk para pemimpin atau wakil laki-laki kota. ‘Orang-orang Pnuel’ alami dalam bahasa Indonesia tanpa memperluasnya menjadi seluruh penduduk.
- source_word: בְּשׁוּבִי
  choice: ketika aku kembali
  rationale: Infinitif dengan sufiks orang pertama sesudah בְּ menyatakan waktu; bentuk ini alami dan tepat dalam bahasa Indonesia.
- source_word: בְשָׁלוֹם
  choice: dengan selamat
  rationale: Dalam konteks kepulangan dari pertempuran, שָׁלוֹם dapat berarti kembali dengan aman, utuh, dan berhasil. ‘Dengan selamat’ menyampaikan maksud kontekstual, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: אֶתֹּץ
  choice: aku akan merobohkan
  rationale: Kata kerja נתץ menyatakan penghancuran atau pembongkaran bangunan; ‘merobohkan’ jelas, kuat, dan idiomatis.
- source_word: הַמִּגְדָּל הַזֶּה
  choice: menara ini
  rationale: מִגְדָּל pada dasarnya berarti ‘menara’. Kemungkinan fungsinya sebagai bangunan pertahanan tidak dimasukkan secara pasti ke dalam teks utama.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas dengan nada naratif yang bermartabat. Nama tempat ditulis ‘Pnuel’, bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia. Ancaman Gideon dipertahankan secara langsung tanpa ditambah penilaian moral yang tidak dinyatakan dalam teks.
