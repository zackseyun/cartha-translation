base_translation:
  language: en
  yaml_path: translation/ot/judges/008/020.yaml
  text: Then he said to Jether his firstborn[a], “Get up, kill them.” But the young man did not draw his sword, because he was afraid, for he was still a young man.
translation:
  language: id
  text: Lalu ia berkata kepada Yeter, anak sulungnya, “Bangunlah, bunuh mereka!” Namun, pemuda itu[a] tidak menghunus pedangnya karena ia takut, sebab ia masih seorang pemuda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani na‘ar dapat berarti “anak laki-laki”, “remaja”, atau “pemuda”. Di sini dipilih “pemuda” karena ia membawa pedang dan diperintah untuk membunuh mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ia berkata
  rationale: Bentuk naratif dengan waw berurutan memajukan rangkaian peristiwa; “Lalu” menyatakan urutan secara alami dalam bahasa Indonesia.
- source_word: לְיֶתֶר
  choice: kepada Yeter
  rationale: Nama diri Ibrani יֶתֶר dialihaksarakan ke bentuk Indonesia “Yeter”.
- source_word: בְּכוֹרוֹ
  choice: anak sulungnya
  rationale: בְּכוֹר menunjuk anak laki-laki pertama dalam urutan kelahiran; “anak sulungnya” alami dan mempertahankan makna urutan kelahiran.
- source_word: קוּם
  choice: Bangunlah
  rationale: Imperatif קוּם merupakan perintah untuk bangkit; “Bangunlah” ringkas, wajar, dan sesuai dengan rangkaian tindakan yang diperintahkan.
- source_word: הֲרֹג אוֹתָם
  choice: bunuh mereka
  rationale: הרג adalah verba umum untuk membunuh; terjemahan langsung ini tidak memperhalus ataupun memperberat tindakan dalam teks.
- source_word: וְלֹא שָׁלַף
  choice: Namun, ... tidak menghunus
  rationale: “Namun” menandai pertentangan antara perintah dan kegagalan Yeter untuk bertindak, sedangkan “menghunus” merupakan padanan alami bagi tindakan menarik pedang dari sarungnya.
- source_word: הַנַּעַר
  choice: pemuda itu
  rationale: נַעַר dapat menunjuk anak laki-laki, remaja, atau pemuda. Konteks bahwa Yeter membawa pedang dan diperintah melakukan eksekusi mendukung “pemuda”, sambil tetap mengakui keluasan istilah sumber melalui catatan kaki.
- source_word: חַרְבּוֹ
  choice: pedangnya
  rationale: Padanan langsung untuk nomina dengan sufiks posesif orang ketiga maskulin tunggal.
- source_word: כִּי יָרֵא
  choice: karena ia takut
  rationale: כִּי di sini memberikan alasan mengapa ia tidak menghunus pedangnya; “karena” menyatakan hubungan sebab secara jelas.
- source_word: כִּי עוֹדֶנּוּ נָעַר
  choice: sebab ia masih seorang pemuda
  rationale: עוֹדֶנּוּ menyatakan keadaan yang masih berlangsung, dan pengulangan “pemuda” mempertahankan pengulangan נַעַר dalam teks Ibrani.
