source:
  edition: WLC
  text: וְ/זֶ֨בַח וְ/צַלְמֻנָּ֜ע בַּ/קַּרְקֹ֗ר וּ/מַחֲנֵי/הֶ֤ם עִמָּ/ם֙ כַּ/חֲמֵ֤שֶׁת עָשָׂר֙ אֶ֔לֶף כֹּ֚ל הַ/נּ֣וֹתָרִ֔ים מִ/כֹּ֖ל מַחֲנֵ֣ה בְנֵי קֶ֑דֶם וְ/הַ/נֹּ֣פְלִ֔ים מֵאָ֨ה וְ/עֶשְׂרִ֥ים אֶ֛לֶף אִ֖ישׁ שֹׁ֥לֵֽף חָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/010.yaml
  text: Zebah and Zalmunna were in Karkor[a], and their camps were with them, about fifteen thousand men, all who were left from all the camp of the sons of the east; and those who had fallen were one hundred twenty thousand men drawing the sword.
translation:
  language: id
  text: Zebah dan Zalmunna berada di Karkor, dan pasukan mereka ada bersama mereka, kira-kira lima belas ribu orang—semua yang tersisa dari seluruh pasukan orang-orang dari Timur[a]. Yang telah gugur berjumlah seratus dua puluh ribu orang yang menghunus pedang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Timur”; maksudnya, orang-orang dari wilayah timur.'
    reason: Ungkapan etnogeografis Ibrani בְנֵי קֶדֶם dapat dipertahankan secara harfiah atau dialihkan secara idiomatis. Teks utama memakai bentuk Indonesia yang alami, sedangkan catatan mempertahankan bentuk sumber.
lexical_decisions:
- source_word: בַּקַּרְקֹר
  choice: di Karkor
  rationale: Prefiks ב menyatakan lokasi; “di Karkor” merupakan padanan Indonesia yang alami.
- source_word: וּמַחֲנֵיהֶם עִמָּם
  choice: dan pasukan mereka ada bersama mereka
  rationale: מַחֲנֶה dapat berarti perkemahan atau pasukan yang berkemah. Dalam konteks jumlah prajurit, “pasukan” lebih alami, sementara עִמָּם tetap dinyatakan sebagai “bersama mereka.” Bentuk Ibrani מַחֲנֵיהֶם secara morfologis dapat dibaca sebagai jamak, tetapi bentuk kata ini juga dapat mewakili bentuk bersufiks dari nomina segolat; konteks mendukung pengertian kolektif.
- source_word: כַּחֲמֵשֶׁת עָשָׂר אֶלֶף
  choice: kira-kira lima belas ribu
  rationale: Prefiks כ pada bilangan menyatakan perkiraan dan diterjemahkan secara eksplisit dengan “kira-kira.”
- source_word: כֹּל הַנּוֹתָרִים
  choice: semua yang tersisa
  rationale: Partisipel Nifal dari יתר menyatakan orang-orang yang masih tinggal atau selamat; “yang tersisa” mempertahankan nuansa resultatifnya.
- source_word: מִכֹּל מַחֲנֵה בְנֵי קֶדֶם
  choice: dari seluruh pasukan orang-orang dari Timur
  rationale: מִן bersifat partitif (“dari”), מַחֲנֶה dipahami secara kolektif sebagai pasukan, dan ungkapan בְנֵי קֶדֶם diterjemahkan secara alami sebagai “orang-orang dari Timur.”
- source_word: וְהַנֹּפְלִים
  choice: Yang telah gugur
  rationale: Partisipel נפל dalam konteks peperangan menunjuk kepada mereka yang tewas; “telah gugur” alami dan terhormat dalam bahasa Indonesia.
- source_word: מֵאָה וְעֶשְׂרִים אֶלֶף
  choice: seratus dua puluh ribu
  rationale: Bentuk bilangan Ibrani dialihkan langsung ke susunan bilangan baku bahasa Indonesia.
- source_word: אִישׁ שֹׁלֵף חָרֶב
  choice: orang yang menghunus pedang
  rationale: אִישׁ sesudah bilangan berfungsi kolektif, sedangkan שֹׁלֵף חָרֶב dipertahankan sebagai gambaran harfiah tentang prajurit, tanpa meratakannya menjadi sekadar “bersenjata.”
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda pisah memperjelas bahwa kira-kira lima belas ribu orang itu adalah seluruh sisa pasukan. Klausa terakhir dijadikan kalimat tersendiri agar rangkaian angka mudah dipahami tanpa menghilangkan hubungan antarklausa.
