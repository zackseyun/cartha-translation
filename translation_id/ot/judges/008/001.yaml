base_translation:
  language: en
  yaml_path: translation/ot/judges/008/001.yaml
  text: Then the men of Ephraim said to him[a], “What is this thing you have done to us[b], not calling us when you went to fight against Midian?” And they contended with him strongly.
translation:
  language: id
  text: Kemudian orang-orang Efraim[a] berkata kepadanya, “Apa yang kaulakukan terhadap kami ini? Mengapa engkau tidak memanggil kami ketika engkau pergi berperang melawan Midian?” Mereka pun berbantah dengan sengit dengannya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang Efraim,” suatu ungkapan kolektif yang menunjuk kepada orang-orang dari suku Efraim.
    reason: lexical_alternative
  - marker: b
    text: Atau “bertengkar hebat dengannya” atau “berselisih keras dengannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אֶפְרַיִם
  choice: orang-orang Efraim
  rationale: Walaupun אִישׁ berbentuk tunggal, frasa ini berfungsi secara kolektif; kata kerja jamak sesudahnya menegaskan bahwa yang dimaksud ialah sekelompok orang dari suku Efraim. Pilihan ini alami dalam bahasa Indonesia dan tetap dekat dengan ungkapan Ibrani.
- source_word: מָה הַדָּבָר הַזֶּה עָשִׂיתָ לָּנוּ
  choice: Apa yang kaulakukan terhadap kami ini?
  rationale: Bentuk pertanyaan mempertahankan nada protes dari teks Ibrani. 'Terhadap kami' menyampaikan datif לָנוּ dalam konteks keluhan tanpa secara berlebihan menjadikannya 'melawan kami'.
- source_word: לְבִלְתִּי קְרֹאות לָנוּ
  choice: Mengapa engkau tidak memanggil kami
  rationale: Konstruksi infinitif negatif menjelaskan inti keluhan mereka. Dalam bahasa Indonesia, menjadikannya pertanyaan lanjutan menghasilkan ujaran yang alami tanpa mengubah hubungan maknanya.
- source_word: כִּי הָלַכְתָּ לְהִלָּחֵם בְּמִדְיָן
  choice: ketika engkau pergi berperang melawan Midian
  rationale: כִּי dipahami secara temporal dalam keluhan ini, sedangkan בְּ bersama verba 'berperang' menyatakan pihak lawan.
- source_word: וַיְרִיבוּן אִתּוֹ בְּחָזְקָה
  choice: Mereka pun berselisih keras dengannya
  rationale: ריב menyatakan perselisihan atau pertengkaran, dan בְּחָזְקָה menerangkan intensitasnya. 'Berselisih keras' mempertahankan keluasan makna tanpa mempersempitnya menjadi teguran atau tindakan hukum.
