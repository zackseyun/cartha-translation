translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang wajar dan bermartabat. Bentuk pronomina 'engkau' dipakai dalam kutipan langsung, sedangkan 'kepadanya/dengannya' menjaga alur narasi tetap alami.
