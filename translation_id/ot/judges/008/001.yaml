  to: Kemudian orang-orang Efraim[a] berkata kepadanya, “Apa yang kaulakukan terhadap kami ini? Mengapa engkau tidak memanggil kami ketika engkau pergi berperang melawan Midian?” Mereka pun berbantah dengan sengit dengannya.[b]
