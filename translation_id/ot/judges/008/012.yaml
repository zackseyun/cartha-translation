translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Nama Gideon dieksplisitkan untuk menjernihkan subjek tersirat dalam rangkaian kata kerja Ibrani. Kalimat dibagi dua agar alur tindakan mudah dipahami. Penanda catatan kaki [a] ditempatkan langsung sesudah frasa yang diterangkannya.
