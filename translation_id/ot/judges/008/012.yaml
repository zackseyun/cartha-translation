  text: וַ/יָּנ֗וּסוּ זֶ֚בַח וְ/צַלְמֻנָּ֔ע וַ/יִּרְדֹּ֖ף אַחֲרֵי/הֶ֑ם וַ/יִּלְכֹּ֞ד אֶת שְׁנֵ֣י מַלְכֵ֣י מִדְיָ֗ן אֶת זֶ֨בַח֙ וְ/אֶת צַלְמֻנָּ֔ע וְ/כָל הַֽ/מַּחֲנֶ֖ה הֶחֱרִֽיד־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/012.yaml
  text: Zebah and Zalmunna fled[a], and he pursued them and captured the two kings of Midian, Zebah and Zalmunna; and he threw the whole camp into panic.
translation:
  language: id
  text: Zebah dan Zalmunna melarikan diri, lalu Gideon mengejar mereka. Ia menangkap kedua raja Midian itu, yaitu Zebah dan Zalmunna, dan membuat seluruh perkemahan itu panik.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “membuat seluruh perkemahan itu gemetar” atau “mengacaukan seluruh perkemahan itu.” Kata kerja Ibrani yang dipakai dapat berarti menyebabkan gemetar atau panik dan, dalam konteks militer, dapat menyiratkan kekacauan atau tercerai-berainya pasukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּנוּסוּ
  choice: melarikan diri
  rationale: Bentuk Qal dari נוס menyatakan tindakan melarikan diri; pilihan ini alami dalam narasi Indonesia dan mempertahankan daya gerak teks.
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: Zebah dan Zalmunna
  rationale: Nama-nama pribadi ditransliterasikan dalam bentuk yang lazim digunakan dalam bahasa Indonesia.
- source_word: וַיִּרְדֹּף אַחֲרֵיהֶם
  choice: Gideon mengejar mereka
  rationale: רדף + אחרי berarti mengejar. Subjek tersirat diperjelas sebagai Gideon agar rujukannya alami dan tidak rancu dalam bahasa Indonesia.
- source_word: וַיִּלְכֹּד
  choice: menangkap
  rationale: Dalam konteks militer, לכד berarti menangkap atau merebut; objeknya ialah dua raja musuh.
- source_word: שְׁנֵי מַלְכֵי מִדְיָן
  choice: kedua raja Midian itu
  rationale: Pilihan ini mempertahankan hubungan konstruksi Ibrani sambil memakai bentuk Indonesia yang alami; 'itu' menandai kedua raja yang baru disebut.
- source_word: אֶת זֶבַח וְאֶת צַלְמֻנָּע
  choice: yaitu Zebah dan Zalmunna
  rationale: Pengulangan aposisional dipertahankan untuk mengidentifikasi kedua raja secara tegas.
- source_word: וְכָל הַמַּחֲנֶה
  choice: seluruh perkemahan
  rationale: מחנה di sini menunjuk pada perkemahan atau pasukan yang berkumpul di sana; 'seluruh perkemahan' mempertahankan gambaran konkret teks.
- source_word: הֶחֱרִיד
  choice: membuat ... gempar
  rationale: Bentuk Hifil dari חרד menyatakan menyebabkan orang gemetar, takut, atau panik. 'Membuat ... gempar' menangkap akibat berupa kepanikan dan kekacauan dalam konteks militer tanpa terlalu mempersempit makna.
