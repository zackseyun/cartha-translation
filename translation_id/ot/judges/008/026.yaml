  terminology: “Syikal” tepat sebagai satuan berat yang tersirat dan perlu diberi catatan. “Perhiasan berbentuk bulan sabit”, “perhiasan gantung”, “pakaian ungu”, dan “kalung” merupakan padanan yang baik. Catatan bagi istilah נזם ditambahkan dan ditempatkan pada istilah yang dirujuk.
