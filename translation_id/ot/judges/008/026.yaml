  text: וַ/יְהִ֗י מִשְׁקַ֞ל נִזְמֵ֤י הַ/זָּהָב֙ אֲשֶׁ֣ר שָׁאָ֔ל אֶ֥לֶף וּ/שְׁבַע מֵא֖וֹת זָהָ֑ב לְ֠/בַד מִן הַ/שַּׂהֲרֹנִ֨ים וְ/הַ/נְּטִפ֜וֹת וּ/בִגְדֵ֣י הָ/אַרְגָּמָ֗ן שֶׁ/עַל֙ מַלְכֵ֣י מִדְיָ֔ן וּ/לְ/בַד֙ מִן הָ֣/עֲנָק֔וֹת אֲשֶׁ֖ר בְּ/צַוְּארֵ֥י גְמַלֵּי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/026.yaml
  text: And the weight of the gold rings that he requested was 1,700 shekels of gold[a], besides the crescent ornaments and the pendants and the purple garments that were on the kings of Midian[b], and besides the necklaces that were on the necks of their camels.
translation:
  language: id
  text: Berat perhiasan emas berbentuk cincin[a] yang dimintanya adalah 1.700 syikal[b] emas, belum termasuk perhiasan berbentuk bulan sabit, perhiasan gantung, dan pakaian ungu yang dikenakan oleh raja-raja Midian, juga belum termasuk kalung yang ada pada leher unta-unta mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini dapat menunjuk pada cincin atau perhiasan cincin yang dikenakan pada telinga atau hidung.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani secara harfiah berbunyi “1.700 emas”; “syikal” ditambahkan sebagai satuan berat yang tersirat dalam konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁקַל
  choice: berat
  rationale: Kata benda ini menunjuk pada bobot yang diukur, bukan sekadar jumlah.
- source_word: נִזְמֵי הַזָּהָב
  choice: anting-anting emas
  rationale: נֶזֶם dapat berupa perhiasan berbentuk cincin pada telinga atau hidung. Dalam konteks Hakim-Hakim 8:24, barang yang diminta dari orang Ismael disebut berada pada telinga mereka, sehingga 'anting-anting' paling wajar di sini.
- source_word: אֲשֶׁר שָׁאָל
  choice: yang dimintanya
  rationale: Merujuk pada permintaan Gideon kepada orang-orang Israel dalam konteks sebelumnya; bentuk ini alami dan ringkas dalam bahasa Indonesia.
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת זָהָב
  choice: 1.700 syikal emas
  rationale: Teks Ibrani secara harfiah menyebut '1.700 emas'; syikal dipasok sebagai satuan berat yang tersirat oleh konteks.
- source_word: לְבַד מִן
  choice: belum termasuk
  rationale: Frasa ini menunjukkan bahwa barang-barang berikut tidak masuk dalam berat yang baru disebutkan.
- source_word: הַשַּׂהֲרֹנִים
  choice: perhiasan berbentuk bulan sabit
  rationale: Istilah ini menunjuk pada ornamen berbentuk bulan sabit; terjemahan ini jelas bagi pembaca modern.
- source_word: הַנְּטִפוֹת
  choice: perhiasan gantung
  rationale: Kata ini kemungkinan menunjuk pada ornamen yang menjuntai; pilihan umum ini tidak menentukan jenis perhiasannya secara berlebihan.
- source_word: בִגְדֵי הָאַרְגָּמָן
  choice: pakaian ungu
  rationale: Menunjuk pada pakaian dari bahan atau pewarna ungu, yang berkaitan dengan kedudukan kerajaan.
- source_word: שֶׁעַל מַלְכֵי מִדְיָן
  choice: yang dikenakan raja-raja Midian
  rationale: Dengan pakaian sebagai acuannya, עַל secara alami menyatakan sesuatu yang dipakai pada tubuh.
- source_word: הָעֲנָקוֹת
  choice: kalung
  rationale: Istilah ini menunjuk pada perhiasan leher; 'kalung' adalah padanan modern yang paling jelas.
- source_word: בְּצַוְּארֵי גְמַלֵּיהֶם
  choice: yang ada pada leher unta-unta mereka
  rationale: Menjaga keterangan lokasi dari teks Ibrani dengan susunan yang alami.
theological_decisions: []
