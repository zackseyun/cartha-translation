  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Belum termasuk' dipakai dua kali untuk memperjelas bahwa seluruh perhiasan dan pakaian berikut berada di luar berat 1.700 syikal. Istilah konkret dipilih tanpa menambahkan penafsiran teologis.
