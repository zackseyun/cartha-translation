  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר גִּדְע֔וֹן לָ/כֵ֗ן בְּ/תֵ֧ת יְהוָ֛ה אֶת זֶ֥בַח וְ/אֶת צַלְמֻנָּ֖ע בְּ/יָדִ֑/י וְ/דַשְׁתִּי֙ אֶת בְּשַׂרְ/כֶ֔ם אֶת קוֹצֵ֥י הַ/מִּדְבָּ֖ר וְ/אֶת הַֽ/בַּרְקֳנִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/007.yaml
  text: And Gideon said[a], “Therefore, when Yahweh gives Zebah and Zalmunna into my hand, I will thresh your flesh with the thorns of the wilderness and with briers.”
translation:
  language: id
  text: Gideon berkata, “Karena itu, ketika Yahweh menyerahkan Zebah dan Zalmunna ke dalam tanganku, aku akan mengirik daging kalian dengan duri-duri padang belantara dan semak-semak berduri[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “belukar berduri”; jenis tumbuhan yang dimaksud oleh istilah Ibrani ini tidak diketahui dengan pasti.
    reason: Alternatif leksikal karena identitas botanis הַבַּרְקֳנִים tidak pasti.
lexical_decisions:
- source_word: לָכֵן
  choice: Karena itu
  rationale: Menandai bahwa ancaman Gideon merupakan akibat langsung dari penolakan orang-orang Sukot pada ayat sebelumnya.
- source_word: בְּתֵת
  choice: ketika ... menyerahkan
  rationale: Gabungan preposisi ב dengan infinitif נתן berfungsi secara temporal di sini; bentuk ini alami dalam bahasa Indonesia dan tetap mempertahankan tindakan yang dinantikan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH sebagaimana muncul langsung dalam teks Ibrani.
- source_word: בְּיָדִי
  choice: ke dalam tanganku
  rationale: Mempertahankan gambaran konkret idiom Ibrani tentang penyerahan musuh ke dalam kuasa seseorang.
- source_word: וְדַשְׁתִּי
  choice: aku akan mengirik
  rationale: Mempertahankan metafora pertanian yang keras dari דושׁ, bukan memperlunaknya menjadi kata umum seperti menghukum atau memukul.
- source_word: בְּשַׂרְכֶם
  choice: daging kalian
  rationale: Padanan langsung yang mempertahankan sifat ancaman yang kasar dan mengerikan; 'tubuh kalian' akan sedikit mengurangi daya gambarnya.
- source_word: קוֹצֵי הַמִּדְבָּר
  choice: duri-duri padang belantara
  rationale: Mempertahankan baik gambaran tumbuhan berduri maupun latar מִדְבָּר dalam ungkapan yang dapat dipahami pembaca Indonesia.
- source_word: הַבַּרְקֳנִים
  choice: semak-semak berduri
  rationale: Istilah Ibrani menunjuk pada sejenis tumbuhan tajam, tetapi spesies tepatnya tidak pasti; pilihan ini jelas tanpa menentukan jenis botanis tertentu.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; bentuk 'Yahweh' mempertahankan nama pribadi ilahi tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Metafora keras 'mengirik daging' sengaja dipertahankan karena merupakan unsur penting dalam ancaman Gideon. Kata ganti jamak 'kalian' memperjelas bahwa Gideon berbicara kepada sekelompok orang.
