  terminology: Nama Zebah, Zalmunna, Gideon, dan Tabor dipertahankan dengan baik. “Putra raja” dapat berfungsi secara generik dan distributif setelah “masing-masing”; tidak perlu menafsirkan frasa itu menjadi “pangeran.”
