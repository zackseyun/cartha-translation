  text: וַ/יֹּ֗אמֶר אֶל זֶ֨בַח֙ וְ/אֶל צַלְמֻנָּ֔ע אֵיפֹה֙ הָ/אֲנָשִׁ֔ים אֲשֶׁ֥ר הֲרַגְתֶּ֖ם בְּ/תָב֑וֹר וַֽ/יֹּאמרוּ֙ כָּמ֣וֹ/ךָ כְמוֹ/הֶ֔ם אֶחָ֕ד כְּ/תֹ֖אַר בְּנֵ֥י הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/018.yaml
  text: Then he said to Zebah and Zalmunna[a], “Where are the men whom you killed at Tabor?” And they said, “As you are, so were they[b]; each one had the appearance of the sons of a king.”
translation:
  language: id
  text: Kemudian Gideon berkata kepada Zebah dan Zalmunna, “Di manakah orang-orang yang kalian bunuh di Tabor[a]?” Mereka menjawab, “Sebagaimana engkau, demikian juga mereka; masing-masing tampak seperti putra raja.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tabor merujuk kepada Gunung Tabor.
    reason: cultural_note
  - marker: b
    text: Ungkapan Ibrani dalam jawaban ini eliptis dan dapat juga diterjemahkan, “Mereka seperti engkau; masing-masing tampak seperti putra raja.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיפֹה
  choice: Di manakah
  rationale: Kata tanya ini pada dasarnya menanyakan tempat. Terjemahan tersebut mempertahankan bentuk pertanyaan Ibrani, meskipun jawaban berikutnya menggambarkan rupa orang-orang itu.
- source_word: הָאֲנָשִׁים
  choice: orang-orang
  rationale: Dalam konteks ini bentuk jamak tersebut menunjuk kepada sejumlah laki-laki tertentu; bahasa Indonesia lazim memakai “orang-orang” tanpa perlu menambahkan penanda gender yang kaku.
- source_word: הֲרַגְתֶּם
  choice: kalian bunuh
  rationale: Bentuk verba berorang kedua jamak ditujukan kepada Zebah dan Zalmunna. “Bunuh” menyampaikan makna dasar tanpa menambahkan penilaian hukum seperti “membunuh dengan keji”.
- source_word: בְּתָבוֹר
  choice: di Tabor
  rationale: Preposisi ב dan nama tempat diterjemahkan secara ringkas dan alami; catatan menjelaskan bahwa yang dimaksud ialah Gunung Tabor.
- source_word: כָּמוֹךָ כְמוֹהֶם
  choice: Sebagaimana engkau, demikian juga mereka
  rationale: Ungkapan Ibrani bersifat eliptis. Pilihan ini mempertahankan perbandingan langsung antara Gideon dan orang-orang yang dibunuh sambil membuat susunannya jelas dalam bahasa Indonesia.
- source_word: אֶחָד
  choice: masing-masing
  rationale: Bilangan tunggal ini dipakai secara distributif, sehingga menunjuk kepada setiap orang dalam kelompok itu.
- source_word: כְּתֹאַר
  choice: berperawakan seperti
  rationale: תֹאַר mencakup rupa, bentuk, atau penampilan lahiriah. “Berperawakan seperti” alami dalam konteks penilaian terhadap penampilan yang tampak mulia.
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: putra raja
  rationale: Ungkapan ini menggambarkan penampilan seorang anak laki-laki dari kalangan kerajaan. “Putra raja” mempertahankan citra Ibrani tanpa menggantinya dengan istilah interpretatif “pangeran”.
- source_word: וַיֹּאמֶר ... וַיֹּאמְרוּ
  choice: Kemudian Gideon berkata ... Jawab mereka
  rationale: Rangkaian naratif diterjemahkan secara alami. Nama “Gideon” menjernihkan subjek tersirat, sedangkan “jawab” sesuai dengan fungsi ucapan kedua dalam percakapan.
theological_decisions:
- issue: Ketidakselarasan lahiriah antara pertanyaan tentang tempat dan jawaban tentang rupa
  choice: Mempertahankan “Di manakah” dalam teks utama
  alternative: “Seperti apakah orang-orang yang kalian bunuh”
  rationale: Makna leksikal biasa אֵיפֹה adalah pertanyaan lokasi. Teks tidak diubah untuk menyelaraskan pertanyaan dengan jawaban; ketegangan naratif yang asli dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai karena sapaan Ibrani berbentuk jamak dan ditujukan kepada dua orang. Susunan jawaban dijaga cukup dekat dengan bentuk Ibrani agar perbandingan dan ambiguitasnya tidak hilang.
