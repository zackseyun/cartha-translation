  text: וַ/יֹּאמְר֤וּ אִֽישׁ יִשְׂרָאֵל֙ אֶל גִּדְע֔וֹן מְשָׁל בָּ֨/נוּ֙ גַּם אַתָּ֔ה גַּם בִּנְ/ךָ֖ גַּ֣ם בֶּן בְּנֶ֑/ךָ כִּ֥י הוֹשַׁעְתָּ֖/נוּ מִ/יַּ֥ד מִדְיָֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/022.yaml
  text: Then the men of Israel said to Gideon[a], “Rule over us—you, your son, and your grandson as well—for you have saved us from the hand of Midian.”
translation:
  language: id
  text: Kemudian orang-orang Israel berkata kepada Gideon, “Berkuasalah atas kami—engkau, anakmu, dan juga cucumu[a]—karena engkau telah menyelamatkan kami dari tangan Midian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak dari anakmu.” Bahasa Ibrani menyebutkan generasi berikutnya secara eksplisit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Kemudian ... berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “kemudian” menyampaikan perkembangan peristiwa secara alami dalam bahasa Indonesia.
- source_word: אִישׁ יִשְׂרָאֵל
  choice: orang-orang Israel
  rationale: Walaupun אִישׁ berbentuk tunggal, konstruksi ini bersifat kolektif dan diikuti verba jamak. “Orang-orang Israel” merupakan ungkapan Indonesia yang alami bagi kelompok tersebut tanpa mengubahnya menjadi nama bangsa yang terlalu umum.
- source_word: מְשָׁל בָּנוּ
  choice: Perintahlah kami
  rationale: Imperatif משל meminta Gideon menjalankan kekuasaan politik atas mereka. “Perintahlah kami” langsung, wajar, dan tidak memasukkan istilah kerajaan yang tidak terdapat dalam teks.
- source_word: גַּם אַתָּה גַּם בִּנְךָ גַּם בֶּן בְּנֶךָ
  choice: engkau, anakmu, dan juga cucumu
  rationale: Pengulangan גַּם menekankan bahwa kekuasaan itu diminta berlanjut kepada generasi-generasi sesudah Gideon. “Cucumu” alami dalam bahasa Indonesia, sedangkan catatan kaki mempertahankan ungkapan Ibrani yang eksplisit.
- source_word: כִּי
  choice: karena
  rationale: Kata ini memperkenalkan alasan permintaan Israel kepada Gideon.
- source_word: הוֹשַׁעְתָּנוּ
  choice: engkau telah menyelamatkan kami
  rationale: Bentuk dari akar ישׁע menyatakan penyelamatan atau pembebasan. “Menyelamatkan” mempertahankan jangkauan leksikalnya sekaligus sesuai dengan konteks militer.
- source_word: מִיַּד מִדְיָן
  choice: dari tangan Midian
  rationale: “Tangan” adalah kiasan Ibrani bagi kuasa atau kendali. Ungkapan ini masih dapat dipahami dalam bahasa Indonesia dan mempertahankan citra teks sumber.
theological_decisions:
- issue: Sifat kekuasaan yang diminta dari Gideon
  choice: 'Permintaan diterjemahkan sebagai pemerintahan turun-temurun: “Perintahlah kami—engkau, anakmu, dan juga cucumu.”'
  alternative: Permintaan umum agar Gideon memimpin tanpa implikasi dinasti.
  rationale: Imperatif משל bersama urutan eksplisit Gideon, anaknya, dan anak dari anaknya menunjukkan permintaan akan kekuasaan politik yang berlanjut secara turun-temurun. Terjemahan tidak memakai istilah “raja” karena istilah itu tidak muncul dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan “engkau” dipakai agar selaras dengan tuturan langsung bernuansa sastra Alkitab. Tanda pisah menonjolkan urutan penerus sebagaimana ditekankan oleh pengulangan גַּם dalam bahasa Ibrani.
