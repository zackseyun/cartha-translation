  source_fidelity: 'Terjemahan secara tepat mencerminkan Ibrani: וַיֵּלֶךְ sebagai “pergi,” nama יְרֻבַּעַל dipertahankan sebagai “Yerubaal,” בֶּן־יוֹאָשׁ sebagai “anak Yoas,” dan וַיֵּשֶׁב בְּבֵיתוֹ dalam makna kediaman sebagai “tinggal di rumahnya.” Tidak ada arah “pulang” atau informasi tambahan lain yang disisipkan.'
