  text: וַ/יֵּ֛לֶךְ יְרֻבַּ֥עַל בֶּן יוֹאָ֖שׁ וַ/יֵּ֥שֶׁב בְּ/בֵיתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/029.yaml
  text: Then Jerubbaal son of Joash went and lived in his house[a].
translation:
  language: id
  text: Lalu Yerubaal anak Yoas pergi dan tinggal di rumahnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “pergi dan menetap di rumahnya” atau “pergi dan berdiam di rumahnya”. Kata kerja Ibrani yang digunakan dapat berarti tinggal atau menetap, bukan hanya duduk secara fisik.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: pergi
  rationale: Dalam rangkaian narasi dengan waw konsekutif, kata ini paling wajar berarti “pergi”. “Pulang” akan menambahkan arah yang tidak dinyatakan secara eksplisit.
- source_word: יְרֻבַּעַל
  choice: Yerubaal
  rationale: Teks Ibrani memakai nama Yerubaal, sehingga nama itulah yang ditransliterasikan, bukan diganti dengan nama alternatifnya, Gideon.
- source_word: בֶּן יוֹאָשׁ
  choice: anak Yoas
  rationale: Konstruksi hubungan keturunan ini diterjemahkan secara langsung dan alami dalam bahasa Indonesia.
- source_word: וַיֵּשֶׁב
  choice: tinggal
  rationale: Dalam konteks rumah, ישב menunjuk pada berdiam atau menetap, bukan sekadar duduk secara fisik. “Tinggal” merupakan padanan modern yang jelas.
- source_word: בְּבֵיתוֹ
  choice: di rumahnya
  rationale: Padanan ini mempertahankan unsur “rumah” dan sufiks kepunyaan orang ketiga tunggal tanpa mengubahnya menjadi ungkapan yang lebih bebas seperti “pulang”.
- source_word: וַ...וַ
  choice: Lalu ... pergi dan tinggal
  rationale: “Lalu” dan rangkaian verba dengan “dan” mencerminkan gerak maju narasi Ibrani dalam bahasa Indonesia yang alami.
theological_decisions: []
