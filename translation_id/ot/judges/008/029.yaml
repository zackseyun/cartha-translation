  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Bentuk “Yerubaal” mengikuti transliterasi nama Ibrani yang lazim dalam bahasa Indonesia; “Yoas” mengikuti bentuk nama Alkitab Indonesia yang umum.
