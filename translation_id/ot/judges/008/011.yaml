source:
  edition: WLC
  text: וַ/יַּ֣עַל גִּדְע֗וֹן דֶּ֚רֶךְ הַ/שְּׁכוּנֵ֣י בָֽ/אֳהָלִ֔ים מִ/קֶּ֥דֶם לְ/נֹ֖בַח וְ/יָגְבֳּהָ֑ה וַ/יַּךְ֙ אֶת הַֽ/מַּחֲנֶ֔ה וְ/הַֽ/מַּחֲנֶ֖ה הָ֥יָה בֶֽטַח־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/011.yaml
  text: Then Gideon went up by the route of those who dwell in tents[a], east of Nobah and Jogbehah, and struck the camp while the camp was unsuspecting.
translation:
  language: id
  text: Lalu Gideon maju melalui jalur para penghuni kemah, di sebelah timur Nobah dan Yogbeha. Ia menyerang perkemahan itu ketika perkemahan itu berada dalam keadaan aman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ketika perkemahan itu merasa aman.” Kata Ibrani ini dapat menunjukkan keadaan aman atau rasa percaya diri; dalam konteks ini, hal itu mungkin menyiratkan bahwa mereka tidak waspada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: maju
  rationale: Dalam konteks pergerakan pasukan, verba עלה menyatakan gerak maju; pilihan ini alami dalam bahasa Indonesia tanpa secara berlebihan memasukkan makna serangan.
- source_word: דֶּרֶךְ הַשְּׁכוּנֵי בָאֳהָלִים
  choice: melalui jalan yang dilalui orang-orang yang tinggal di kemah
  rationale: Menerjemahkan דֶּרֶךְ sebagai jalan/rute dan mempertahankan gambaran harfiah para penghuni kemah tanpa langsung menafsirkan mereka sebagai kaum nomaden.
- source_word: מִקֶּדֶם לְנֹבַח וְיָגְבֳּהָה
  choice: di sebelah timur Nobah dan Yogbeha
  rationale: Dalam keterangan geografis ini, מִקֶּדֶם menunjukkan lokasi di sebelah timur kedua tempat tersebut.
- source_word: וַיַּךְ אֶת־הַמַּחֲנֶה
  choice: Ia menyerang perkemahan itu
  rationale: נכה memiliki cakupan makna memukul atau menyerang. Dalam adegan militer, 'menyerang' menyampaikan tindakannya secara alami tanpa menyatakan hasil yang tidak disebutkan.
- source_word: וְהַמַּחֲנֶה הָיָה בֶטַח
  choice: ketika mereka merasa aman
  rationale: בֶטַח menyatakan rasa aman atau keyakinan akan keamanan. Pronomina 'mereka' secara alami merujuk kepada orang-orang di perkemahan, sedangkan catatan kaki mempertahankan kemungkinan nuansa bahwa perkemahan itu tidak berjaga-jaga.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Nama יָגְבֳּהָה ditransliterasikan sebagai Yogbeha. Pengulangan kata 'perkemahan' dalam bahasa Ibrani diringankan dengan pronomina agar kalimat alami, sementara makna dan ambiguitas בֶטַח dijaga melalui catatan kaki.
