revisions:
- from: Lalu Gideon maju melalui jalan yang dilalui orang-orang yang tinggal di kemah, di sebelah timur Nobah dan Yogbeha. Ia menyerang perkemahan itu ketika mereka merasa aman.[a]
  to: Lalu Gideon maju melalui jalur para penghuni kemah, di sebelah timur Nobah dan Yogbeha. Ia menyerang perkemahan itu ketika perkemahan itu berada dalam keadaan aman.[a]
  rationale: Revisi mengganti parafrasa yang menambahkan gagasan "jalan yang dilalui" dengan "jalur para penghuni kemah," yang mempertahankan keterkaitan konstruksi Ibrani tanpa memaksakan identifikasi mereka sebagai kaum nomaden. Klausa terakhir dan catatan kaki kini membedakan makna dasar keadaan aman dari kemungkinan implikasi bahwa perkemahan itu tidak waspada.
