  - severity: low
    issue: Catatan kaki menyajikan "tidak berjaga-jaga" sebagai alternatif, padahal makna dasar בֶּטַח lebih langsung adalah keadaan aman/percaya diri.
    rationale: Nuansa tidak waspada dapat merupakan implikasi konteks militer, tetapi sebaiknya catatan kaki terlebih dahulu menyatakan alternatif leksikal "dalam keadaan aman," lalu menjelaskan implikasi kontekstualnya.
  revised_text: Lalu Gideon maju melalui jalur para penghuni kemah, di sebelah timur Nobah dan Yogbeha. Ia menyerang perkemahan itu ketika perkemahan itu berada dalam keadaan aman.[a]
