lexical_decisions:
- source_word: מִגְדַּל
  choice: menara
  rationale: Kata benda ini lazimnya menunjuk pada menara atau bangunan pertahanan yang tinggi; “menara” merupakan padanan langsung dan wajar dalam konteks ini.
- source_word: פְּנוּאֵל
  choice: Pnuel
  rationale: Nama tempat ini dialihaksarakan menurut bentuk konsonantal teks Ibrani; bentuk tradisional “Peniel” dipertahankan dalam catatan kaki.
- source_word: נָתָץ
  choice: merobohkan
  rationale: Kata kerja ini berarti meruntuhkan atau menghancurkan suatu bangunan. “Merobohkan” alami dalam bahasa Indonesia modern dan mempertahankan tindakan yang disengaja terhadap menara itu.
- source_word: וַיַּהֲרֹג
  choice: membunuh
  rationale: Kata kerja הרג secara langsung berarti membunuh; padanan ini jelas dan tidak menambahkan gambaran yang tidak tersurat.
- source_word: אַנְשֵׁי הָעִיר
  choice: para lelaki di kota itu
  rationale: Frasa tersebut secara harfiah merujuk kepada laki-laki kota itu. “Para lelaki di kota itu” mempertahankan rujukan maskulin sekaligus terdengar alami dalam bahasa Indonesia.
