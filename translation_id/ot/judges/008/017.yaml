  text: He tore down the tower of Penuel and killed the men of the city[a].
translation:
  language: id
  text: Ia merobohkan menara Pnuel dan membunuh para lelaki di kota itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Pnuel: secara tradisional juga disebut “Peniel”.'
