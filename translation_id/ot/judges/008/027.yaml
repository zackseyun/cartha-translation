  text: וַ/יַּעַשׂ֩ אוֹת֨/וֹ גִדְע֜וֹן לְ/אֵפ֗וֹד וַ/יַּצֵּ֨ג אוֹת֤/וֹ בְ/עִיר/וֹ֙ בְּ/עָפְרָ֔ה וַ/יִּזְנ֧וּ כָֽל יִשְׂרָאֵ֛ל אַחֲרָ֖י/ו שָׁ֑ם וַ/יְהִ֛י לְ/גִדְע֥וֹן וּ/לְ/בֵית֖/וֹ לְ/מוֹקֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/027.yaml
  text: Gideon made it into an ephod and set it up in his city[a], in Ophrah. And all Israel prostituted themselves after it there[b], and it became a snare to Gideon and to his house.
translation:
  language: id
  text: Gideon membuatnya menjadi sebuah efod[a] dan menempatkannya di kotanya, yaitu Ofra. Seluruh Israel berzina dengan mengikuti efod itu di sana[b], dan efod itu menjadi jerat bagi Gideon dan seisi rumahnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Efod adalah istilah untuk perlengkapan atau objek kultis yang dikaitkan dengan imam. Ayat ini tidak menjelaskan secara pasti bentuk atau fungsi efod yang dibuat Gideon.
    reason: cultural_note
  - marker: b
    text: Bahasa Ibrani memakai gambaran perzinaan atau pelacuran untuk ketidaksetiaan Israel dalam ibadah.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאֵפוֹד
  choice: menjadi sebuah efod
  rationale: 'Preposisi לְ setelah עשה dipahami secara resultatif: benda itu dijadikan efod. Istilah אֵפוֹד dipertahankan tanpa menentukan bentuk atau fungsi yang tidak dijelaskan oleh ayat ini.'
- source_word: וַיַּצֵּג
  choice: menegakkannya
  rationale: Bentuk kausatif ini menyatakan bahwa benda itu dibuat berdiri atau ditempatkan secara tegak. Pilihan ini mempertahankan gambaran pemasangan tanpa menyebutnya sebagai patung atau pajangan.
- source_word: בְעִירוֹ בְּעָפְרָה
  choice: di kotanya, yaitu Ofra
  rationale: עִיר diterjemahkan 'kota', sedangkan aposisi 'yaitu Ofra' menjelaskan secara alami bahwa Ofra adalah kota Gideon.
- source_word: וַיִּזְנוּ ... אַחֲרָיו
  choice: berzina dengan mengikuti efod itu
  rationale: זנה mempertahankan gambaran seksual yang kuat untuk ketidaksetiaan Israel dalam ibadah. Acuan pronomina dibuat eksplisit sebagai 'efod itu' agar jelas dalam bahasa Indonesia.
- source_word: שָׁם
  choice: di sana
  rationale: Keterangan tempat dipertahankan karena menekankan bahwa penyelewengan itu berlangsung di Ofra.
- source_word: לְמוֹקֵשׁ
  choice: menjadi jerat
  rationale: מוֹקֵשׁ secara harfiah menunjuk kepada jerat atau perangkap dan di sini menggambarkan bahaya yang membawa kepada dosa dan kehancuran.
- source_word: וּלְבֵיתוֹ
  choice: dan seisi rumahnya
  rationale: בַּיִת di sini mencakup rumah tangga, keluarga, atau wangsa Gideon. 'Seisi rumahnya' mempertahankan ungkapan rumah sekaligus menyampaikan makna kolektifnya.
theological_decisions:
- issue: Gambaran ketidaksetiaan Israel terhadap Allah melalui respons mereka kepada efod
  choice: Mempertahankan gambaran seksual dengan ungkapan 'berzina dengan mengikuti efod itu'
  alternative: berlaku tidak setia dengan mengikuti efod itu
  rationale: Bahasa Ibrani memakai זנה, metafora yang sengaja keras bagi ketidaksetiaan religius. Terjemahan tidak melunakkannya menjadi ketidaktaatan umum.
- issue: Hakikat efod buatan Gideon
  choice: Memakai istilah 'efod' tanpa mendefinisikannya lebih lanjut
  alternative: baju imam; berhala; patung suci; alat untuk meminta petunjuk
  rationale: Teks menyebut efod, tetapi tidak memastikan bentuk maupun fungsi khusus benda ini. Ambiguitas historis dan teologis itu dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Istilah teknis 'efod' dipertahankan serta dijelaskan dalam catatan kaki. Metafora keras dari teks sumber dipertahankan tanpa menambahkan kesimpulan bahwa benda itu pasti berupa pakaian, berhala, patung, atau alat ramalan.
