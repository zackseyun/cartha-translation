  to: Gideon membuatnya menjadi sebuah efod[a] dan menempatkannya di kotanya, yaitu Ofra. Seluruh Israel berzina dengan mengikuti efod itu di sana[b], dan efod itu menjadi jerat bagi Gideon dan seisi rumahnya.
  rationale: Revisi mengganti “menegakkannya” dengan “menempatkannya” untuk mempertahankan ketidakpastian mengenai cara pemasangan efod. Penanda catatan tentang metafora zinah dipindahkan ke akhir klausa yang memuat metafora tersebut. Catatan efod dirumuskan lebih netral agar tidak menentukan bentuk atau fungsi objek yang tidak dipastikan oleh teks.
