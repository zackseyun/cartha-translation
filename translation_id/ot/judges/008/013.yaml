  text: Then Gideon son of Joash returned from the battle by the ascent of Heres[a].
translation:
  language: id
  text: Kemudian Gideon anak Yoas kembali dari pertempuran, dari jalan naik Heres.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “dari jalan naik matahari.” Frasa Ibrani ini sulit dipahami; הֶחָרֶס dapat dimengerti sebagai nama tempat (“Heres”) atau berkaitan dengan “matahari.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: Kemudian ... kembali
  rationale: Bentuk wayyiqtol dari שׁוב melanjutkan alur narasi. "Kemudian" menyatakan urutan peristiwa secara alami, dan "kembali" menyampaikan arti dasarnya.
- source_word: גִּדְעוֹן
  choice: Gideon
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בֶּן יוֹאָשׁ
  choice: anak Yoas
  rationale: Konstruksi patronimik Ibrani diterjemahkan secara langsung dan alami dalam bahasa Indonesia.
- source_word: מִן הַמִּלְחָמָה
  choice: dari pertempuran
  rationale: מִלְחָמָה dapat berarti perang atau pertempuran; dalam konteks keterlibatan militer khusus ini, "pertempuran" lebih tepat.
- source_word: מִלְמַעֲלֵה
  choice: melalui pendakian
  rationale: Frasa berpreposisi ini tampaknya menunjukkan jalur atau lokasi kepulangan Gideon. "Melalui pendakian" mempertahankan nuansa topografis tanpa memastikan arah secara berlebihan.
- source_word: הֶחָרֶס
  choice: Heres
  rationale: Bentuk ini mungkin menunjuk pada nama tempat, tetapi juga dapat dipahami sebagai "matahari". Nama Heres dipertahankan dalam teks utama, sedangkan kemungkinan leksikal lainnya dicatat dalam catatan kaki.
