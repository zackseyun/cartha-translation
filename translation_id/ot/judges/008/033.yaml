source:
  edition: WLC
  text: וַ/יְהִ֗י כַּֽ/אֲשֶׁר֙ מֵ֣ת גִּדְע֔וֹן וַ/יָּשׁ֨וּבוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּזְנ֖וּ אַחֲרֵ֣י הַ/בְּעָלִ֑ים וַ/יָּשִׂ֧ימוּ לָ/הֶ֛ם בַּ֥עַל בְּרִ֖ית לֵ/אלֹהִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/033.yaml
  text: And it happened that[a], when Gideon died, the sons of Israel turned back and prostituted themselves after the Baals[b], and they made Baal-berith their god.
translation:
  language: id
  text: Ketika Gideon mati, orang Israel kembali berzina dengan mengikuti para Baal[b]. Mereka menjadikan Baal-Berit[a] sebagai ilah mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Baal-Berit kemungkinan berarti “Baal Perjanjian” atau “Tuan Perjanjian”.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “berzina dengan mengikuti para Baal”; bahasa Ibrani memakai gambaran seksual untuk ketidaksetiaan dalam penyembahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר מֵת גִּדְעוֹן
  choice: Ketika Gideon mati
  rationale: Rumus naratif dan klausa waktunya dialihkan secara alami ke dalam bahasa Indonesia. Kata כַּאֲשֶׁר menandai peralihan waktu sesudah kematian Gideon tanpa perlu mempertahankan ungkapan yang kaku seperti 'terjadilah bahwa'.
- source_word: וַיָּשׁוּבוּ
  choice: berbalik lagi
  rationale: Kata שׁוּב di sini menunjukkan kembalinya Israel kepada kemurtadan terdahulu, bukan perpindahan tempat.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan ini menunjuk kepada bangsa Israel secara kolektif. 'Orang Israel' merupakan padanan Indonesia modern yang wajar dan tidak mempersempit rujukannya hanya kepada laki-laki.
- source_word: וַיִּזְנוּ אַחֲרֵי
  choice: berzina dengan mengikuti
  rationale: Terjemahan ini mempertahankan gambaran seksual yang kuat dalam זנה sekaligus menyampaikan arah kesetiaan yang salah yang dinyatakan oleh אַחֲרֵי.
- source_word: הַבְּעָלִים
  choice: para Baal
  rationale: Bentuk jamak menunjuk kepada berbagai wujud atau pusat pemujaan Baal; 'para Baal' mempertahankan bentuk jamak tersebut.
- source_word: וַיָּשִׂימוּ לָהֶם
  choice: mereka menjadikan
  rationale: Dalam konteks ini, שׂים dengan ל menyatakan penetapan atau pengangkatan sesuatu bagi diri mereka.
- source_word: בַּעַל בְּרִית
  choice: Baal-Berit
  rationale: Nama kultis ini ditransliterasikan dalam teks utama, sedangkan arti unsur-unsurnya dijelaskan dalam catatan kaki.
- source_word: לֵאלֹהִים
  choice: sebagai ilah mereka
  rationale: Kata depan ל menandai penetapan Baal-Berit sebagai sembahan bagi mereka. 'Ilah' menjaga arti generik אֱלֹהִים dalam konteks dewa asing dan menghindari penyamaan tipografis dengan nama Allah.
theological_decisions:
- issue: Pemertahanan metafora seksual bagi penyembahan berhala
  choice: berzina dengan mengikuti para Baal
  alternative: tidak setia dengan mengikuti para Baal
  rationale: Bahasa Ibrani secara eksplisit memakai זנה. Metafora ini dipertahankan agar daya tuduhan tentang ketidaksetiaan Israel tidak diperhalus atau ditafsirkan secara diam-diam.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak lelaki Israel
  rationale: Dalam ayat ini ungkapan tersebut merupakan sebutan kolektif bagi umat Israel, bukan penegasan bahwa hanya laki-laki yang bertindak. Padanan idiomatis Indonesia mempertahankan cakupan kolektifnya.
- issue: Status Baal-Berit sebagai sembahan Israel
  choice: sebagai ilah mereka
  alternative: sebagai Allah mereka
  rationale: Pilihan ini menyampaikan bahwa mereka menetapkan Baal-Berit sebagai deity bagi diri mereka tanpa mengaburkan perbedaan antara dewa kultis tersebut dan Allah Israel.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur dibagi menjadi dua kalimat agar rangkaian tindakan mudah dipahami, sementara metafora tajam dari teks Ibrani tetap dipertahankan. Penanda catatan kaki ditempatkan langsung pada istilah yang dijelaskannya.
