  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֔ם מֶה עָשִׂ֥יתִי עַתָּ֖ה כָּ/כֶ֑ם הֲ/ל֗וֹא ט֛וֹב עֹלְל֥וֹת אֶפְרַ֖יִם מִ/בְצִ֥יר אֲבִיעֶֽזֶר־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/002.yaml
  text: But he said to them[a], “What have I done now compared to you? Are not the gleanings of Ephraim better than the grape harvest of Abiezer?”
translation:
  language: id
  text: Namun ia berkata kepada mereka, “Apa yang telah kulakukan sekarang dibandingkan dengan kalian? Bukankah sisa-sisa panen anggur Efraim lebih baik daripada panen anggur Abiezer?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם
  choice: Namun ia berkata kepada mereka
  rationale: 'Waw meneruskan alur narasi, tetapi konteksnya bersifat kontras: Gideon menanggapi keluhan orang Efraim dengan jawaban yang meredakan ketegangan. Karena itu, ''Namun'' wajar dalam bahasa Indonesia.'
- source_word: מֶה עָשִׂיתִי עַתָּה כָּכֶם
  choice: Apa yang telah kulakukan sekarang dibandingkan dengan kalian?
  rationale: כָּכֶם menyatakan perbandingan. Bentuk ini mempertahankan pertanyaan retoris dan nada merendahkan diri Gideon.
- source_word: הֲלוֹא
  choice: Bukankah
  rationale: Partikel ini membuka pertanyaan retoris yang mengharapkan persetujuan.
- source_word: טוֹב
  choice: lebih baik
  rationale: Dalam konstruksi perbandingan dengan מִן, kata sifat 'baik' bermakna komparatif, yaitu 'lebih baik daripada'.
- source_word: עֹלְלוֹת אֶפְרַיִם
  choice: sisa-sisa panen anggur Efraim
  rationale: עֹלְלוֹת menunjuk pada buah anggur yang tertinggal setelah panen utama dan kemudian dipungut. Pilihan ini jelas bagi pembaca modern sekaligus mempertahankan metafora kebun anggur.
- source_word: מִבְצִיר אֲבִיעֶזֶר
  choice: daripada panen anggur Abiezer
  rationale: בָּצִיר adalah panen atau pemetikan buah anggur, sedangkan prefiks מִן menandai perbandingan. 'Panen anggur' lebih mudah dipahami daripada istilah teknis yang kurang umum.
