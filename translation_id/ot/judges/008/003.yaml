source:
  edition: WLC
  text: בְּ/יֶדְ/כֶם֩ נָתַ֨ן אֱלֹהִ֜ים אֶת שָׂרֵ֤י מִדְיָן֙ אֶת עֹרֵ֣ב וְ/אֶת זְאֵ֔ב וּ/מַה יָּכֹ֖לְתִּי עֲשׂ֣וֹת כָּ/כֶ֑ם אָ֗ז רָפְתָ֤ה רוּחָ/ם֙ מֵֽ/עָלָ֔י/ו בְּ/דַבְּר֖/וֹ הַ/דָּבָ֥ר הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/003.yaml
  text: Into your hand God gave the princes of Midian[a], Oreb and Zeeb; and what was I able to do compared with you? Then their spirit relaxed toward him when he spoke this word.
translation:
  language: id
  text: “Allah telah menyerahkan para pemimpin Midian, Oreb dan Zeeb, ke dalam tangan kalian. Apa yang dapat kulakukan dibandingkan dengan kalian?” Ketika ia mengatakan hal itu, kemarahan mereka terhadapnya pun mereda.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “roh mereka mengendur dari atasnya.”'
    reason: Citra Ibrani yang mendasari ungkapan tentang meredanya kemarahan dipertahankan sebagai alternatif harfiah.
lexical_decisions:
- source_word: בְּיֶדְכֶם נָתַן אֱלֹהִים
  choice: Allah menyerahkan ... ke dalam tangan kalian
  rationale: Ungkapan Ibrani dengan bentuk tunggal ‘tangan’ menyatakan kuasa atau kendali. ‘Menyerahkan ... ke dalam tangan kalian’ alami dalam bahasa Indonesia sekaligus mempertahankan citra sumber.
- source_word: שָׂרֵי מִדְיָן
  choice: para pemimpin Midian
  rationale: שָׂרִים menunjuk kepada orang-orang berkedudukan sebagai penguasa atau kepala. ‘Para pemimpin’ jelas bagi pembaca modern dan tidak menyiratkan gelar kerajaan tertentu yang belum tentu dimaksudkan.
- source_word: עֹרֵב וְאֶת זְאֵב
  choice: Oreb dan Zeeb
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וּמַה יָּכֹלְתִּי עֲשׂוֹת כָּכֶם
  choice: Apa yang dapat kulakukan dibandingkan dengan kalian?
  rationale: כָכֶם memiliki daya pembanding. Bentuk ini mempertahankan nada Gideon yang merendahkan pencapaiannya sendiri dibandingkan dengan pencapaian orang Efraim.
- source_word: רָפְתָה רוּחָם מֵעָלָיו
  choice: kemarahan mereka terhadapnya pun mereda
  rationale: Secara harfiah, roh atau semangat mereka ‘mengendur dari atas/terhadap dia’; dalam konteks pertengkaran, idiom itu menyatakan surutnya kemarahan. Terjemahan utama dibuat alami, sedangkan citra harfiahnya dicatat dalam catatan kaki.
- source_word: בְּדַבְּרוֹ הַדָּבָר הַזֶּה
  choice: Setelah ia mengatakan hal itu
  rationale: Konstruksi ini menandai keadaan atau waktu ketika perubahan sikap terjadi. ‘Mengatakan hal itu’ menyampaikan makna דָבָר secara alami tanpa membuat ‘firman’ terkesan sebagai wahyu ilahi.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti ‘kalian’ dipakai karena Gideon berbicara kepada sekelompok orang; bentuk terikat ‘kulakukan’ menjaga kelancaran dialog. Penanda [a] ditempatkan pada ungkapan yang dijelaskannya.
