base_translation:
  language: en
  yaml_path: translation/ot/judges/008/015.yaml
  text: Then he came to the men of Succoth and said[a], “Here are Zebah and Zalmunna, about whom you taunted me, saying, ‘Are Zebah and Zalmunna already in your hand[b], that we should give bread to your weary men?’”
translation:
  language: id
  text: Kemudian Gideon mendatangi orang-orang Sukot dan berkata, “Lihat, inilah Zebah dan Salmuna! Mengenai mereka kalian telah menghina aku dengan berkata, ‘Apakah Zebah dan Salmuna sudah ada di tanganmu[a], sehingga kami harus memberikan roti kepada orang-orangmu yang kelelahan?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Apakah telapak tangan Zebah dan Salmuna sekarang ada dalam tanganmu?” Ungkapan ini berarti, “Apakah mereka sudah tertangkap dan berada dalam kuasamu?”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַנְשֵׁי סֻכּוֹת
  choice: orang-orang Sukot
  rationale: Secara harfiah berarti para lelaki Sukot. Dalam bahasa Indonesia, ‘orang-orang Sukot’ secara alami menunjuk kepada warga laki-laki yang sebelumnya menjawab Gideon, tanpa terdengar kaku.
- source_word: הִנֵּה
  choice: Lihat, inilah
  rationale: Gabungan ini menyampaikan daya penunjuk dan seruan yang menarik perhatian kepada kedua tawanan yang kini hadir di hadapan mereka.
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: Zebah dan Salmuna
  rationale: Nama pribadi ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: אֲשֶׁר חֵרַפְתֶּם אוֹתִי
  choice: Mengenai mereka kalian telah menghina aku
  rationale: Kata kerja חרף menyatakan celaan atau penghinaan bernada merendahkan. Frasa relatif tersebut mengaitkan penghinaan terhadap Gideon dengan kedua raja itu.
- source_word: לֵאמֹר
  choice: dengan berkata
  rationale: Pengantar kutipan ini menyatakan isi penghinaan mereka sebelumnya secara alami dalam bahasa Indonesia.
- source_word: הֲכַף ... בְּיָדֶךָ
  choice: Apakah ... sudah ada dalam tanganmu
  rationale: Mempertahankan citra idiomatis bahasa Ibrani tentang berada dalam tangan atau kuasa seseorang, sementara ‘sudah’ menyampaikan עַתָּה dalam pertanyaan retoris itu.
- source_word: כִּי נִתֵּן
  choice: sehingga kami harus memberikan
  rationale: 'Dalam konteks pertanyaan retoris, klausa ini mengungkapkan akibat yang mereka sangkal: belum tertangkapnya para raja dianggap alasan untuk tidak memberi roti.'
- source_word: לַאֲנָשֶׁיךָ הַיְּעֵפִים
  choice: kepada orang-orangmu yang kelelahan
  rationale: יְעֵפִים menunjukkan kondisi letih akibat pengejaran; ‘kelelahan’ jelas, alami, dan cukup kuat.
- source_word: לָחֶם
  choice: roti
  rationale: Padanan langsung yang tetap wajar dalam konteks, meskipun secara metonimis dapat berarti makanan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Bentuk ‘kalian’ dipakai karena Gideon berbicara kepada sekelompok orang, sedangkan ‘-mu’ dalam kutipan mempertahankan sapaan tunggal mereka kepada Gideon. Nama kota menggunakan bentuk ‘Sukot’; nama צַלְמֻנָּע ditulis ‘Salmuna’ agar sesuai dengan pola transliterasi Indonesia.
