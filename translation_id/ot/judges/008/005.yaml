  register: Bahasa Indonesia baku, modern, dan bermartabat. Urutan klausa Ibrani dipertahankan sejauh tetap alami. Kata ganti 'ia' dan 'aku' digunakan sesuai register naratif Alkitab; ungkapan idiomatis diterjemahkan menurut maknanya dengan bentuk harfiah disediakan dalam catatan kaki.
