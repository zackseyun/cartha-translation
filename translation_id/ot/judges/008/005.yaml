base_translation:
  language: en
  yaml_path: translation/ot/judges/008/005.yaml
  text: And he said to the men of Succoth[a], “Please give loaves of bread to the people who are with me, for they are weary, and I am pursuing Zebah and Zalmunna, the kings of Midian.”
translation:
  language: id
  text: Lalu ia berkata kepada para lelaki Sukot, “Tolong berikanlah roti kepada orang-orang yang menyertai aku,[a] sebab mereka kelelahan, dan aku sedang mengejar Zebah dan Salmuna, raja-raja Midian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang-orang yang di kakiku,” sebuah ungkapan bagi mereka yang menyertai atau mengikuti aku.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַנְשֵׁי סֻכּוֹת
  choice: kepada orang-orang Sukot
  rationale: Istilah אַנְשֵׁי berbentuk maskulin jamak dan dalam konteks ini menunjuk kepada para lelaki atau wakil kota Sukot; 'orang-orang Sukot' merupakan ungkapan Indonesia yang alami tanpa menyiratkan seluruh penduduk.
- source_word: תְּנוּ נָא
  choice: Tolong berikanlah
  rationale: Imperatif dengan נָא menyatakan permintaan yang sopan atau mendesak; bentuk ini mempertahankan nada permohonan dalam bahasa Indonesia modern.
- source_word: כִּכְּרוֹת לֶחֶם
  choice: roti
  rationale: Frasa ini secara harfiah menunjuk kepada ketul-ketul atau bundaran roti. Dalam bahasa Indonesia, 'roti' sudah alami sebagai nomina massa dan tidak memerlukan bentuk 'ketul-ketul roti' yang kaku.
- source_word: לָעָם אֲשֶׁר בְּרַגְלָי
  choice: kepada orang-orang yang menyertai aku
  rationale: Secara harfiah ungkapan ini berarti orang-orang 'yang di kakiku', yakni mereka yang berjalan mengikuti atau menyertai Gideon. Makna idiomatis ditempatkan dalam teks utama dan citra harfiahnya dicatat dalam catatan kaki.
- source_word: עֲיֵפִים
  choice: kelelahan
  rationale: Kata ini menunjukkan letih akibat pengerahan tenaga; 'kelelahan' tepat dan tidak melebihkan maknanya menjadi hampir pingsan.
- source_word: רֹדֵף אַחֲרֵי
  choice: sedang mengejar
  rationale: Partisip menunjukkan tindakan pengejaran yang tengah berlangsung.
- source_word: זֶבַח וְצַלְמֻנָּע
  choice: Zebah dan Salmuna
  rationale: Nama-nama pribadi ditransliterasikan menurut bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: מַלְכֵי מִדְיָן
  choice: raja-raja Midian
  rationale: Bentuk konstruksi Ibrani diterjemahkan langsung dan alami sebagai 'raja-raja Midian'.
