source:
  edition: WLC
  text: וְ/לֹ֤א זָֽכְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶת יְהוָ֖ה אֱלֹהֵי/הֶ֑ם הַ/מַּצִּ֥יל אוֹתָ֛/ם מִ/יַּ֥ד כָּל אֹיְבֵי/הֶ֖ם מִ/סָּבִֽיב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/034.yaml
  text: And the sons of Israel did not remember Yahweh their God[a], who had delivered them from the hand of all their enemies all around.
translation:
  language: id
  text: Dan orang-orang Israel[a] tidak mengingat Yahweh, Allah mereka, yang telah melepaskan mereka dari tangan semua musuh mereka di sekeliling mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak lelaki Israel”; dapat juga diterjemahkan “keturunan Israel.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: tidak
  rationale: Konjungsi וְ melanjutkan alur narasi, tetapi dalam bahasa Indonesia hubungan itu dapat dibiarkan tersirat agar kalimat tetap alami; לֹא menyatakan penyangkalan.
- source_word: זָכְרוּ
  choice: mengingat
  rationale: Kata זכר mencakup ingatan yang semestinya tampak dalam kesetiaan, tetapi terjemahan 'mengingat' mempertahankan keluasan makna tersebut tanpa menambahkan tafsiran.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: Keturunan Israel
  rationale: Ungkapan ini secara harfiah berarti 'anak-anak lelaki Israel', tetapi berfungsi sebagai sebutan kolektif bagi umat Israel. 'Keturunan Israel' mempertahankan hubungan dengan leluhur Israel dan tetap wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama perjanjian dalam teks sumber tetap tampak.
- source_word: אֱלֹהֵיהֶם
  choice: Allah mereka
  rationale: Bentuk ini merujuk kepada Yahweh sebagai Allah yang berelasi dengan Israel; dalam konteks ini maknanya tunggal.
- source_word: הַמַּצִּיל
  choice: yang telah melepaskan
  rationale: Partisip berartikel menggambarkan Yahweh melalui tindakan penyelamatan-Nya. Klausa relatif alami dalam bahasa Indonesia, dan 'telah' menunjukkan bahwa tindakan itu mendahului kegagalan Israel untuk mengingat.
- source_word: מִיַּד
  choice: dari tangan
  rationale: Ungkapan Ibrani ini melukiskan kuasa atau kendali. Citra 'tangan' dipertahankan karena masih dapat dipahami dalam bahasa Indonesia.
- source_word: כָּל אֹיְבֵיהֶם
  choice: semua musuh
  rationale: Kata כָּל menyatakan keseluruhan. Pronomina posesif tidak diulang karena rujukannya sudah jelas dari objek 'mereka' dan pengulangan akan terasa berat dalam bahasa Indonesia.
- source_word: מִסָּבִיב
  choice: di sekeliling mereka
  rationale: Frasa ini menunjukkan musuh-musuh yang berada di segala arah di sekitar Israel.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai nama ilahi secara langsung. 'Yahweh' mempertahankan nama pribadi itu dan tidak menggantinya dengan gelar.
- issue: Sebutan kolektif בְּנֵי יִשְׂרָאֵל
  choice: Keturunan Israel
  alternative: orang Israel; anak-anak lelaki Israel
  rationale: Sebutan ini berbentuk maskulin dalam bahasa Ibrani tetapi merujuk secara kolektif kepada umat Israel. Terjemahan utama menjaga kaitannya dengan leluhur Israel, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- issue: Makna 'mengingat' dalam hubungan perjanjian
  choice: mengingat
  alternative: tetap setia kepada
  rationale: Konteks dapat menyiratkan ingatan yang diwujudkan dalam kesetiaan, tetapi teks hanya memakai verba 'mengingat'. Terjemahan tidak mempersempit ketegangan makna itu menjadi satu penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan klausa mengikuti sumber tanpa menjadi kaku; citra 'dari tangan' dan nama 'Yahweh' dipertahankan.
