base_translation:
  language: en
  yaml_path: translation/ot/judges/008/025.yaml
  text: And they said[a], “We will surely give them.” Then they spread out the cloak[c][b], and each man threw there an earring from his spoil.
translation:
  language: id
  text: Mereka berkata, “Kami pasti akan memberikannya.”[a] Lalu mereka membentangkan jubah itu,[b] dan masing-masing melemparkan sebuah anting-anting[c] dari jarahannya ke sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Memberi, kami akan memberi.” Bahasa Ibrani memakai infinitif absolut bersama verba finit untuk memberi penegasan; dapat juga diterjemahkan, “Kami sungguh akan memberikannya.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “pakaian itu,” yang dibentangkan untuk menampung barang-barang itu.
    reason: cultural_note
  - marker: c
    text: Kata Ibrani yang diterjemahkan “anting-anting” secara lebih umum dapat berarti “cincin” dan dalam konteks lain dapat menunjuk pada cincin hidung.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתוֹן נִתֵּן
  choice: Kami pasti akan memberikannya
  rationale: Gabungan infinitif absolut dan verba finit dari נתן memberi penegasan. Kata “pasti” menyampaikan penekanan itu tanpa menambahkan gagasan kesukarelaan yang tidak dinyatakan secara eksplisit. Akhiran “-nya” merujuk pada anting-anting yang diminta dalam ayat sebelumnya.
- source_word: וַיִּפְרְשׂוּ אֶת הַשִּׂמְלָה
  choice: mereka membentangkan jubah itu
  rationale: פרשׂ berarti membentangkan atau menghamparkan, sedangkan שִׂמְלָה menunjuk pada pakaian atau jubah. “Membentangkan jubah” alami dalam bahasa Indonesia dan menggambarkan pakaian yang dibuka untuk menampung benda-benda.
- source_word: וַיַּשְׁלִיכוּ שָׁמָּה
  choice: melemparkan ke sana
  rationale: שלך memiliki arti melemparkan, bukan sekadar menaruh, dan שָׁמָּה berarti “ke sana.” Terjemahan ini mempertahankan ungkapan sumber; tempat yang dimaksud adalah jubah yang telah dibentangkan.
- source_word: אִישׁ
  choice: masing-masing
  rationale: אִישׁ dipakai secara distributif, yakni setiap orang dari kelompok itu. “Masing-masing” ringkas dan jelas dalam bahasa Indonesia tanpa perlu mengulang kata “orang.”
- source_word: נֶזֶם
  choice: sebuah anting-anting
  rationale: נֶזֶם dapat berarti cincin yang dikenakan pada telinga atau hidung. Dalam konteks ini, terutama karena permintaan Gideon pada ayat sebelumnya, “anting-anting” merupakan pilihan yang paling mungkin, sementara keluasan maknanya dicatat dalam catatan kaki.
- source_word: שְׁלָלוֹ
  choice: dari jarahannya
  rationale: שָׁלָל adalah barang jarahan perang. Bentuk dengan sufiks orang ketiga maskulin tunggal selaras dengan pemakaian distributif “masing-masing.”
