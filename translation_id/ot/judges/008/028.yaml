  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּכָּנַ֣ע מִדְיָ֗ן לִ/פְנֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/לֹ֥א יָסְפ֖וּ לָ/שֵׂ֣את רֹאשָׁ֑/ם וַ/תִּשְׁקֹ֥ט הָ/אָ֛רֶץ אַרְבָּעִ֥ים שָׁנָ֖ה בִּ/ימֵ֥י גִדְעֽוֹן׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/028.yaml
  text: So Midian was subdued before the sons of Israel[a], and they did not again lift up their head. And the land had rest forty years in the days of Gideon.
translation:
  language: id
  text: Demikianlah Midian ditundukkan di hadapan orang Israel. Mereka tidak lagi mengangkat kepala mereka.[a] Negeri itu pun tenteram selama empat puluh tahun pada zaman Gideon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memulihkan kekuatan mereka” atau “bangkit kembali.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכָּנַע
  choice: ditundukkan
  rationale: Bentuk Nifal menyatakan bahwa Midian dibawa ke dalam keadaan takluk; bentuk pasif ini sesuai dengan konteks militer.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Mempertahankan ungkapan relasional Ibrani yang menggambarkan Midian takluk terhadap Israel tanpa memperjelas pelakunya secara berlebihan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan ini merupakan sebutan kebangsaan konvensional. 'Orang Israel' menyampaikan rujukan kolektifnya secara alami dalam bahasa Indonesia modern.
- source_word: וְלֹא יָסְפוּ
  choice: tidak lagi
  rationale: Dengan infinitif berikutnya, יסף menyatakan bahwa tindakan tersebut tidak dilakukan kembali.
- source_word: לָשֵׂאת רֹאשָׁם
  choice: mengangkat kepala mereka
  rationale: Metafora konkret dalam teks dipertahankan; dalam konteks ini ungkapan tersebut menunjuk pada bangkitnya kembali keberanian, kekuatan, atau perlawanan.
- source_word: וַתִּשְׁקֹט
  choice: tenteram
  rationale: Dalam rangkuman kitab Hakim-Hakim, kata ini menggambarkan keadaan negeri yang tenang dan bebas dari konflik.
- source_word: הָאָרֶץ
  choice: negeri itu
  rationale: Dalam konteks ini menunjuk kepada wilayah Israel sebagai suatu negeri; 'negeri itu' alami dan mempertahankan rujukan tertentu dari artikel Ibrani.
- source_word: אַרְבָּעִים שָׁנָה
  choice: selama empat puluh tahun
  rationale: Keterangan 'selama' membuat fungsi durasi ungkapan Ibrani jelas dan alami dalam bahasa Indonesia.
- source_word: בִּימֵי גִדְעוֹן
  choice: pada zaman Gideon
  rationale: Padanan alami bagi ungkapan waktu Ibrani yang tidak mempersempit artinya secara khusus menjadi masa hidup Gideon.
theological_decisions:
- issue: Penerjemahan בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  alternative: anak-anak Israel
  rationale: Dalam ayat ini frasa tersebut berfungsi sebagai nama kolektif suatu bangsa, bukan penekanan pada jenis kelamin atau hubungan biologis. 'Orang Israel' merupakan padanan modern yang tepat tanpa menambahkan tafsiran.
- issue: Pelestarian metafora לָשֵׂאת רֹאשָׁם
  choice: mengangkat kepala mereka
  alternative: memulihkan kekuatan mereka
  rationale: Metafora sumber dipertahankan agar nuansa antara keberanian, kekuatan, dan kemampuan untuk melawan tidak diputuskan secara sepihak; kemungkinan maknanya dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Struktur dua kalimat pertama menjaga alur ringkasan naratif, sedangkan metafora Ibrani dipertahankan dengan penjelasan singkat dalam catatan kaki.
