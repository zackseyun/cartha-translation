- from: Lalu Zebah dan Zalmunna berkata, “Bangkitlah engkau sendiri dan tebaslah kami, sebab seperti orangnya, demikianlah kekuatannya.” Maka Gideon bangkit lalu membunuh Zebah dan Zalmunna. Kemudian ia mengambil perhiasan-perhiasan berbentuk bulan sabit[a] yang tergantung pada leher unta-unta mereka.
  to: Lalu Zebah dan Zalmunna berkata, “Bangkitlah engkau dan tewaskan kami, sebab seperti orangnya, demikianlah kekuatannya.” Maka Gideon bangkit dan membunuh Zebah dan Zalmunna. Kemudian ia mengambil hiasan berbentuk bulan sabit[a] yang ada pada leher unta mereka.
  rationale: Revisi mengganti "tebaslah" dengan "tewaskan" agar daya mematikan dalam konteks tetap tersampaikan tanpa menetapkan jenis pukulan atau senjata yang tidak disebutkan teks. Letak hiasan juga diterjemahkan tanpa menambahkan bahwa hiasan itu tergantung. Bentuk pepatah, penekanan pronomina, dan gema "bangkit" dipertahankan.
