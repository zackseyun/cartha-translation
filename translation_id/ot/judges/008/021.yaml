  text: וַ/יֹּ֜אמֶר זֶ֣בַח וְ/צַלְמֻנָּ֗ע ק֤וּם אַתָּה֙ וּ/פְגַע בָּ֔/נוּ כִּ֥י כָ/אִ֖ישׁ גְּבוּרָת֑/וֹ וַ/יָּ֣קָם גִּדְע֗וֹן וַֽ/יַּהֲרֹג֙ אֶת זֶ֣בַח וְ/אֶת צַלְמֻנָּ֔ע וַ/יִּקַּח֙ אֶת הַ/שַּׂ֣הֲרֹנִ֔ים אֲשֶׁ֖ר בְּ/צַוְּארֵ֥י גְמַלֵּי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/021.yaml
  text: Then Zebah and Zalmunna said[a], “Rise yourself and strike us down, for as the man is, so is his strength.” So Gideon rose and killed Zebah and Zalmunna[c][b], and he took the crescent ornaments that were on the necks of their camels.
translation:
  language: id
  text: Lalu Zebah dan Zalmunna berkata, “Bangkitlah engkau dan tewaskan kami, sebab seperti orangnya, demikianlah kekuatannya.” Maka Gideon bangkit dan membunuh Zebah dan Zalmunna. Kemudian ia mengambil hiasan berbentuk bulan sabit[a] yang ada pada leher unta mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hiasan berbentuk sabit” atau “bulan-bulan sabit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר זֶבַח וְצַלְמֻנָּע
  choice: Lalu Zebah dan Zalmunna berkata
  rationale: Kata kerja tunggal dengan subjek majemuk merupakan idiom Ibrani; dalam bahasa Indonesia digunakan bentuk alami tanpa pembedaan jumlah pada verba. 'Lalu' menyampaikan urutan naratif waw.
- source_word: קוּם אַתָּה
  choice: Bangkitlah engkau sendiri
  rationale: 'Pronomina eksplisit אַתָּה memberi penekanan: Gideon sendiri, bukan anaknya, harus melakukannya. ''Bangkitlah'' juga memungkinkan gema dengan tindakan Gideon dalam klausa berikut.'
- source_word: וּפְגַע בָּנוּ
  choice: dan tebaslah kami
  rationale: Dalam konteks eksekusi, פגע menunjuk pada serangan yang mematikan. 'Tebaslah' menyampaikan pukulan senjata yang mematikan secara alami tanpa sekadar memparafrasakannya sebagai 'bunuhlah'.
- source_word: כִּי כָאִישׁ גְּבוּרָתוֹ
  choice: sebab seperti orangnya, demikianlah kekuatannya
  rationale: Terjemahan ini mempertahankan bentuk pepatah dan hubungan antara sosok atau kecakapan seorang laki-laki dengan kekuatannya, tanpa menentukan secara sempit apakah אִישׁ terutama menunjuk pada usia, perawakan, atau keberanian.
- source_word: וַיָּקָם גִּדְעוֹן
  choice: Maka Gideon bangkit
  rationale: Mempertahankan urutan naratif sekaligus gema leksikal dengan perintah קוּם.
- source_word: וַיַּהֲרֹג
  choice: lalu membunuh
  rationale: Padanan langsung dan modern untuk verba umum yang berarti membunuh.
- source_word: הַשַּׂהֲרֹנִים
  choice: perhiasan-perhiasan berbentuk bulan sabit
  rationale: Nomina ini menunjuk pada benda berbentuk sabit atau bulan sabit, dalam konteks ini perhiasan pada unta. Ungkapan deskriptif ini jelas bagi pembaca modern.
- source_word: אֲשֶׁר בְּצַוְּארֵי גְמַלֵּיהֶם
  choice: yang tergantung pada leher unta-unta mereka
  rationale: Konstruksi בְּ menyatakan letaknya pada leher unta. 'Tergantung pada' alami untuk perhiasan leher, meskipun verba 'tergantung' tersirat dari konteks, bukan dinyatakan secara eksplisit.
theological_decisions:
- issue: Ungkapan pepatah maskulin כָאִישׁ גְּבוּרָתוֹ
  choice: seperti orangnya, demikianlah kekuatannya
  alternative: seperti seorang laki-laki, demikianlah kekuatannya
  rationale: Konteksnya jelas mengenai laki-laki dan kecakapan seorang pejuang, tetapi kata Indonesia 'orangnya' menghasilkan pepatah yang lebih alami dan tetap merujuk kepada Gideon secara kontekstual. Terjemahan tidak menetralkan konteks ataupun menambahkan penafsiran bahwa yang dimaksud khususnya usia, tubuh, atau keberanian.
- issue: Daya mematikan וּפְגַע בָּנוּ
  choice: tebaslah kami
  alternative: bunuhlah kami
  rationale: Konteks memastikan bahwa tindakan itu dimaksudkan untuk membunuh. Namun, pilihan 'tebaslah' mempertahankan citra serangan atau pukulan dalam verba sumber dan tidak menghapus nuansa tindakannya.
translation_notes:
  register: Bahasa Indonesia modern, naratif, dan bermartabat. Bentuk 'engkau sendiri' mempertahankan penekanan pronomina Ibrani; pengulangan 'bangkit' mempertahankan kaitan verbal antara perintah raja-raja itu dan respons Gideon. Bentuk pepatah sengaja dipertahankan agar ketegangan makna antara perawakan, kedewasaan, keberanian, dan kekuatan tidak diselesaikan secara berlebihan.
