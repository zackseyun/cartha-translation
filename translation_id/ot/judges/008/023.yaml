base_translation:
  language: en
  yaml_path: translation/ot/judges/008/023.yaml
  text: But Gideon said to them[a], “I will not rule over you, and my son will not rule over you; Yahweh will rule over you.”
translation:
  language: id
  text: Namun Gideon berkata kepada mereka[a], “Aku tidak akan memerintah kalian, dan anakku pun tidak akan memerintah kalian. Yahweh akan memerintah kalian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Lalu Gideon berkata kepada mereka.” Kata penghubung Ibrani dapat sekadar melanjutkan narasi, tetapi “Namun” menonjolkan pertentangan dengan permintaan mereka pada ayat sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Namun ... berkata
  rationale: Waw-konsekutif melanjutkan narasi, tetapi dalam konteks jawaban Gideon menolak permintaan pada ayat sebelumnya. “Namun” mengungkapkan pertentangan itu secara alami; “Lalu” tetap mungkin sebagai padanan naratif yang lebih netral.
- source_word: אֲלֵהֶם
  choice: kepada mereka
  rationale: Padanan langsung bagi preposisi penunjuk arah dengan sufiks pronominal orang ketiga jamak.
- source_word: גִּדְעוֹן
  choice: Gideon
  rationale: Mengikuti bentuk nama yang telah baku dalam tradisi Alkitab bahasa Indonesia.
- source_word: לֹא אֶמְשֹׁל אֲנִי בָּכֶם
  choice: Aku tidak akan memerintah atas kalian
  rationale: מָשַׁל menyatakan tindakan memerintah atau berkuasa. Pronomina eksplisit אֲנִי diwakili secara wajar oleh “Aku”; susunan Ibrani tidak harus diperkuat menjadi “aku sendiri”.
- source_word: וְלֹא יִמְשֹׁל בְּנִי בָּכֶם
  choice: dan anakku pun tidak akan memerintah atas kalian
  rationale: Mempertahankan kesejajaran dengan klausa sebelumnya serta penolakan terhadap kelanjutan kekuasaan melalui keturunan. Partikel “pun” membuat perluasan penyangkalan kepada anak Gideon jelas dan alami.
- source_word: בְּנִי
  choice: anakku
  rationale: Nomina tunggal dengan sufiks orang pertama tunggal berarti secara langsung “anakku”; implikasi dinasti tidak dimasukkan ke dalam teks utama.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga identitas nama pribadi dalam teks Ibrani tetap terlihat.
- source_word: יְהוָה יִמְשֹׁל בָּכֶם
  choice: Yahweh akan memerintah atas kalian
  rationale: Mengulangi padanan yang sama untuk מָשַׁל agar kontras retoris antara Gideon, anaknya, dan Yahweh tetap utuh.
theological_decisions:
- issue: Penolakan Gideon terhadap kekuasaan yang menyerupai kerajaan
  choice: Gideon menolak pemerintahan dirinya dan anaknya, lalu menyatakan bahwa Yahweh akan memerintah atas umat itu.
  alternative: Gideon hanya menolak gelar resmi sebagai raja, tetapi tetap menerima kekuasaan secara de facto.
  rationale: Ayat ini mengulang verba מָשַׁל bagi Gideon, anaknya, dan Yahweh, tetapi tidak memakai istilah “raja”. Karena itu, terjemahan mempertahankan kontras pemerintahan manusia dan ilahi tanpa mempersempitnya menjadi penolakan terhadap gelar politik tertentu atau menyelesaikan ketegangan dengan kisah selanjutnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk orang kedua jamak agar rujukannya jelas; “memerintah atas” dipertahankan dalam ketiga klausa untuk menampilkan pengulangan dan kontras dalam bahasa Ibrani.
