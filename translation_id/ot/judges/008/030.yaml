  yaml_path: translation/ot/judges/008/030.yaml
  text: Gideon had seventy sons[a], his own offspring, because he had many wives.
translation:
  language: id
  text: Gideon mempunyai tujuh puluh anak laki-laki kandung[a], karena ia mempunyai banyak istri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang keluar dari pangkal pahanya,” sebuah ungkapan untuk keturunan biologisnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְגִדְעוֹן הָיוּ
  choice: Gideon mempunyai
  rationale: Konstruksi היה + ל menyatakan kepunyaan; bahasa Indonesia modern secara alami mengungkapkannya dengan “mempunyai”. Waw tidak perlu diberi padanan tersendiri dalam ayat ini.
- source_word: שִׁבְעִים בָּנִים
  choice: tujuh puluh anak laki-laki
  rationale: בנים di sini secara khusus berarti anak-anak lelaki, bukan anak-anak secara umum.
- source_word: יֹצְאֵי יְרֵכוֹ
  choice: yang berasal dari tubuhnya sendiri
  rationale: Ungkapan harfiah “yang keluar dari pangkal paha/pinggangnya” merupakan idiom bagi keturunan biologis. Pilihan ini menyampaikan maknanya dengan wajar sambil mempertahankan penekanan bahwa mereka adalah anak kandung Gideon.
- source_word: כִּי
  choice: karena
  rationale: כִּי memperkenalkan alasan Gideon mempunyai begitu banyak anak laki-laki.
- source_word: נָשִׁים רַבּוֹת הָיוּ לוֹ
  choice: ia mempunyai banyak istri
  rationale: Dalam konteks rumah tangga Gideon, נָשִׁים berarti istri-istri, dan היה + ל kembali menyatakan kepunyaan.
theological_decisions:
- issue: Gambaran rumah tangga poligini
  choice: Menerjemahkan secara deskriptif sebagai “banyak istri” tanpa komentar moral.
  alternative: Mengaburkan relasi sebagai “banyak perempuan” atau menambahkan penilaian setuju/tidak setuju.
  rationale: Ayat ini melaporkan keadaan keluarga Gideon tanpa memberikan penilaian moral secara eksplisit; terjemahan tidak boleh menambahkannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. “Anak laki-laki” dipilih agar makna gender בנים tetap jelas; “berasal dari tubuhnya sendiri” lebih alami bagi pembaca umum daripada mempertahankan idiom anatomi Ibrani secara harfiah.
