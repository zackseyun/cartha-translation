translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Pergantian subjek yang tersirat dalam bahasa Ibrani diperjelas dengan “Pemuda itu” agar pembaca tidak mengira Gideon yang menulis. Tanda baca membagi tindakan penangkapan dan penulisan menjadi dua kalimat demi kejelasan tanpa mengubah urutan peristiwa.
