  text: וַ/יִּלְכָּד נַ֛עַר מֵ/אַנְשֵׁ֥י סֻכּ֖וֹת וַ/יִּשְׁאָלֵ֑/הוּ וַ/יִּכְתֹּ֨ב אֵלָ֜י/ו אֶת שָׂרֵ֤י סֻכּוֹת֙ וְ/אֶת זְקֵנֶ֔י/הָ שִׁבְעִ֥ים וְ/שִׁבְעָ֖ה אִֽישׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/014.yaml
  text: And he captured a young man from the men of Succoth and questioned him[a], and he wrote down for him the officials of Succoth and its elders, seventy-seven men.
translation:
  language: id
  text: Ia menangkap seorang pemuda dari antara orang-orang Sukot dan menanyainya. Pemuda itu menuliskan baginya daftar para pejabat[a] dan tua-tua Sukot, tujuh puluh tujuh orang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “para pemimpin Sukot”; istilah Ibrani ini dapat menunjuk kepada pejabat, kepala, atau penguasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלְכָּד
  choice: menangkap
  rationale: Kata kerja לכד lazim berarti menangkap atau merebut. Dalam konteks ini, “menangkap” menyampaikan penahanan orang untuk dimintai keterangan tanpa menambahkan cara penangkapannya.
- source_word: נַעַר
  choice: seorang pemuda
  rationale: נַעַר dapat berarti anak laki-laki, pemuda, atau pelayan. Karena orang ini berasal dari kalangan orang Sukot dan mampu memberikan keterangan tentang para pemimpin kota, “pemuda” paling sesuai tanpa menyiratkan bahwa ia masih anak-anak atau berstatus pelayan.
- source_word: מֵאַנְשֵׁי סֻכּוֹת
  choice: dari antara orang-orang Sukot
  rationale: Preposisi מן menunjukkan bahwa pemuda itu diambil dari kelompok orang Sukot. Ungkapan ini mempertahankan hubungan tersebut secara jelas dan wajar dalam bahasa Indonesia.
- source_word: וַיִּשְׁאָלֵהוּ
  choice: menanyainya
  rationale: שׁאל berarti bertanya atau meminta keterangan. “Menanyainya” cocok dengan penyelidikan yang disengaja dalam konteks militer, tetapi tidak membawa nuansa keras yang mungkin terkandung dalam “menginterogasinya”.
- source_word: וַיִּכְתֹּב אֵלָיו
  choice: Pemuda itu menuliskan baginya daftar
  rationale: Bentuk verba Ibrani tidak menyebut ulang subjek, tetapi konteks paling alami menunjukkan bahwa pemuda yang ditangkap itu menulis bagi Gideon. “Daftar” mengungkapkan secara wajar bahwa yang dicatat ialah identitas kelompok pejabat dan tua-tua, tanpa menambahkan nama tertentu ke dalam teks.
- source_word: שָׂרֵי סֻכּוֹת
  choice: para pejabat Sukot
  rationale: שָׂרִים dapat menunjuk kepada pejabat, kepala, penguasa, atau pemimpin. “Pejabat” cocok untuk konteks pemerintahan kota dan tidak menyiratkan gelar kebangsawanan seperti “pangeran”.
- source_word: זְקֵנֶיהָ
  choice: tua-tua Sukot
  rationale: Istilah זְקֵנִים dalam konteks ini menunjuk kepada kelompok pemimpin senior yang diakui dalam masyarakat, bukan sekadar semua orang lanjut usia. “Tua-tua” mempertahankan istilah sosial-politik Alkitab yang sudah dikenal.
- source_word: שִׁבְעִים וְשִׁבְעָה אִישׁ
  choice: tujuh puluh tujuh orang
  rationale: Bilangan Ibrani secara langsung berarti tujuh puluh tujuh. “Orang” mencerminkan אִישׁ dan merangkum para pejabat serta tua-tua yang disebut sebelumnya.
