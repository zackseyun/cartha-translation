  register: Bahasa Indonesia baku, modern, dan naratif. Kalimat dibagi untuk menghindari susunan yang kaku, sambil mempertahankan Gideon dan ketiga ratus orang sebagai subjek keadaan lelah dan tindakan mengejar.
