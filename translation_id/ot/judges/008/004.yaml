  text: וַ/יָּבֹ֥א גִדְע֖וֹן הַ/יַּרְדֵּ֑נָ/ה עֹבֵ֣ר ה֗וּא וּ/שְׁלֹשׁ מֵא֤וֹת הָ/אִישׁ֙ אֲשֶׁ֣ר אִתּ֔/וֹ עֲיֵפִ֖ים וְ/רֹדְפִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/008/004.yaml
  text: Then Gideon came to the Jordan and crossed over[a], he and the three hundred men who were with him, exhausted yet pursuing.
translation:
  language: id
  text: Kemudian Gideon tiba di Sungai Yordan dan menyeberang bersama ketiga ratus orang yang menyertainya. Mereka kelelahan, tetapi terus mengejar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “kelelahan dan mengejar”; dapat juga diterjemahkan “kelelahan, namun tetap mengejar.”'
    reason: Hubungan waw antara kedua partisipel dapat dibaca sebagai koordinatif (“dan”) atau, menurut konteks, konsesif (“namun/tetapi”).
lexical_decisions:
- source_word: וַיָּבֹא
  choice: sampai
  rationale: Dalam konteks gerak menuju suatu tempat, בוא menyatakan bahwa Gideon tiba atau sampai di Yordan; 'sampai' alami dalam narasi Indonesia.
- source_word: הַיַּרְדֵּנָה
  choice: di Sungai Yordan
  rationale: Akhiran penunjuk arah menyatakan gerak menuju Yordan. Sesudah 'sampai', bahasa Indonesia secara idiomatis memakai 'di'; 'Sungai' ditambahkan agar rujukannya jelas bagi pembaca modern.
- source_word: עֹבֵר הוּא
  choice: dan menyeberang. Ia
  rationale: Partisipel עֹבֵר menyatakan tindakan menyeberangi Yordan, sedangkan הוּא menonjolkan Gideon bersama pasukannya. Pemisahan kalimat menjaga kejelasan dan kelancaran tanpa menghilangkan penekanan itu.
- source_word: וּשְׁלֹשׁ מֵאוֹת הָאִישׁ אֲשֶׁר אִתּוֹ
  choice: bersama ketiga ratus orang yang menyertainya
  rationale: Frasa ini mengikutsertakan tiga ratus anggota pasukan yang bersama Gideon. 'Orang' wajar dalam bahasa Indonesia, sementara konteks militer sudah menjelaskan kelompok tersebut.
- source_word: עֲיֵפִים
  choice: kelelahan
  rationale: Kata ini menyatakan keletihan jasmani yang berat; 'kelelahan' jelas, modern, dan tidak menyiratkan bahwa mereka telah jatuh pingsan.
- source_word: וְרֹדְפִים
  choice: tetapi terus mengejar
  rationale: 'Secara bentuk, waw dapat diterjemahkan ''dan'', tetapi hubungan kontekstualnya bersifat kontras: walaupun lelah, mereka masih melakukan pengejaran. ''Terus'' mewakili tindakan partisipial yang berlanjut.'
