base_translation:
  language: en
  yaml_path: translation/ot/judges/008/016.yaml
  text: Then he took the elders of the city[a], and thorns of the wilderness and briers, and with them he disciplined the men of Succoth.
translation:
  language: id
  text: Kemudian Gideon menangkap para tua-tua kota itu, lalu mengambil duri-duri dari padang belantara dan tumbuhan berduri. Dengan semuanya itu ia memberi pelajaran[a] kepada orang-orang Sukot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dengan semuanya itu ia membuat orang-orang Sukot tahu.” Ungkapan Ibraninya sulit. Dalam konteks ini, ungkapan itu tampaknya menunjuk pada tindakan penghukuman dengan duri-duri dan tumbuhan berduri; ada yang menerjemahkannya “mengajar,” “mendisiplinkan,” atau, lebih kuat, “mengirik.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי הָעִיר
  choice: para tua-tua kota itu
  rationale: Ungkapan ini secara harfiah menunjuk kepada para tua-tua yang menjalankan peranan kepemimpinan dalam kota. Bentuk “tua-tua” mempertahankan gelar sosial-politiknya tanpa menggantinya dengan tafsiran “pemimpin”.
- source_word: קוֹצֵי הַמִּדְבָּר
  choice: duri-duri dari padang belantara
  rationale: קוֹצִים menunjuk kepada duri atau tumbuhan berduri, sedangkan הַמִּדְבָּר berarti kawasan liar atau padang belantara. Terjemahan ini mempertahankan gambaran konkret dan hubungan asalnya.
- source_word: הַבַּרְקֳנִים
  choice: tumbuhan berduri
  rationale: Kata ini menunjuk kepada sejenis tanaman berduri, tetapi jenis botanisnya tidak pasti. Ungkapan umum ini alami dalam bahasa Indonesia dan tidak memberikan kepastian palsu mengenai spesiesnya.
- source_word: וַיֹּדַע בָּהֶם
  choice: Dengan semuanya itu ia menghajar
  rationale: Bentuk Hifil dari ידע biasanya berarti “membuat tahu/memperkenalkan”, tetapi dalam konteks penggunaan duri sebagai alat hukuman ungkapan ini menyatakan tindakan penghukuman. “Menghajar” menyampaikan daya idiomatis dan kekerasan tindakan itu, sementara kesulitan harfiahnya dicatat dalam catatan kaki.
- source_word: אַנְשֵׁי סֻכּוֹת
  choice: orang-orang Sukot
  rationale: Walaupun אַנְשֵׁי secara bentuk berarti “laki-laki/orang-orang dari”, di sini ungkapan itu menunjuk kepada kelompok warga kota yang dikenai tindakan Gideon. “Orang-orang Sukot” merupakan padanan Indonesia yang alami tanpa memperluasnya menjadi seluruh penduduk secara tegas.
