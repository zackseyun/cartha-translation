  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama Gideon disebut untuk memperjelas subjek yang tersirat dalam verba Ibrani dan kesinambungan narasi. Kalimat dipecah agar daftar objek tidak terasa rancu dalam bahasa Indonesia; urutan tindakan sumber tetap dipertahankan.
