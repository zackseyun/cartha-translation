  text: וַ/יִּבְרַ֤ח יִפְתָּח֙ מִ/פְּנֵ֣י אֶחָ֔י/ו וַ/יֵּ֖שֶׁב בְּ/אֶ֣רֶץ ט֑וֹב וַ/יִּֽתְלַקְּט֤וּ אֶל יִפְתָּח֙ אֲנָשִׁ֣ים רֵיקִ֔ים וַ/יֵּצְא֖וּ עִמּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/003.yaml
  text: So Jephthah fled from his brothers and lived in the land of Tob[a], and worthless men gathered around Jephthah and went out with him.
translation:
  language: id
  text: Maka Yefta melarikan diri dari saudara-saudaranya dan tinggal di tanah Tob. Orang-orang yang tidak berguna[a] berkumpul di sekeliling Yefta dan pergi bersamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang-orang kosong”; ungkapan Ibrani ini menunjuk kepada orang-orang yang dipandang rendah atau buruk tabiatnya, bukan sekadar orang yang tidak memiliki harta.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: melarikan diri
  rationale: Kata ברח menyatakan tindakan melarikan diri karena bahaya atau permusuhan; pilihan ini wajar dalam narasi Indonesia dan mempertahankan kesan bahwa kepergiannya terjadi di bawah tekanan.
- source_word: מִפְּנֵי אֶחָיו
  choice: dari saudara-saudaranya
  rationale: Ungkapan מִפְּנֵי secara harfiah berarti 'dari hadapan', tetapi di sini menunjukkan bahwa Yefta menjauh karena tekanan bermusuhan dari saudara-saudaranya.
- source_word: וַיֵּשֶׁב
  choice: tinggal
  rationale: Kata ישב dalam konteks ini berarti berdiam atau menetap di suatu tempat; 'tinggal' alami dalam bahasa Indonesia dan tidak terlalu menekankan sifat permanen.
- source_word: בְּאֶרֶץ טוֹב
  choice: di tanah Tob
  rationale: Kata אֶרֶץ dapat berarti tanah atau wilayah. 'Tanah Tob' mempertahankan bentuk ringkas teks sumber dan memperlakukan Tob sebagai nama tempat.
- source_word: וַיִּתְלַקְּטוּ אֶל יִפְתָּח
  choice: berkumpul di sekeliling Yefta
  rationale: Bentuk hitpael menyatakan orang-orang yang menghimpunkan diri, sedangkan אֶל menunjukkan gerak menuju dan persekutuan dengan Yefta. Ungkapan ini alami dalam bahasa Indonesia tanpa menentukan struktur kelompok mereka.
- source_word: אֲנָשִׁים רֵיקִים
  choice: orang-orang yang tidak berguna
  rationale: Secara harfiah רֵיקִים berarti 'kosong', tetapi sebagai ungkapan ini menunjuk kepada orang-orang yang dipandang rendah, tidak terhormat, atau buruk tabiatnya. Terjemahan ini mempertahankan penilaian negatif tanpa mempersempitnya menjadi penjahat atau perampok.
- source_word: וַיֵּצְאוּ עִמּוֹ
  choice: pergi bersamanya
  rationale: Kata יצא berarti 'keluar/pergi'. Tujuan kegiatan mereka tidak disebutkan, sehingga terjemahan ini mempertahankan keterbukaan teks dan tidak menambahkan bahwa mereka merampok atau berperang.
