  text: וַ/יַּעֲבֹ֥ר יִפְתָּ֛ח אֶל בְּנֵ֥י עַמּ֖וֹן לְ/הִלָּ֣חֶם בָּ֑/ם וַ/יִתְּנֵ֥/ם יְהוָ֖ה בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/032.yaml
  text: So Jephthah crossed over to the Ammonites to fight against them[a], and Yahweh gave them into his hand.
translation:
  language: id
  text: Lalu Yefta menyeberang untuk mendatangi orang-orang Amon dan berperang melawan mereka, dan Yahweh menyerahkan mereka ke dalam tangannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: menyeberang
  rationale: Kata kerja עבר pada dasarnya berarti melintas atau menyeberang. Terjemahan ini mempertahankan gambaran gerak konkret tanpa memasukkan gagasan menyerang yang baru dinyatakan oleh frasa berikutnya.
- source_word: אֶל בְּנֵי עַמּוֹן
  choice: menuju bani Amon
  rationale: Preposisi אֶל menyatakan arah, sedangkan בְּנֵי עַמּוֹן adalah sebutan etnis. 'Menuju bani Amon' mempertahankan arah gerak dan memakai ungkapan Indonesia yang lazim dalam konteks Alkitab.
- source_word: לְהִלָּחֶם בָּם
  choice: untuk berperang melawan mereka
  rationale: Bentuk Niphal infinitif dari לחם dengan ב menyatakan tindakan bertempur melawan pihak tertentu. 'Berperang melawan' alami dan sesuai dengan konteks konflik antarkelompok.
- source_word: וַיִּתְּנֵם
  choice: menyerahkan mereka
  rationale: Dalam konstruksi dengan 'ke dalam tangan', נתן merupakan idiom kemenangan, yaitu menyerahkan musuh ke dalam kuasa pihak lain. 'Menyerahkan' lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'memberikan'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai 'Yahweh', bukan diganti dengan sebuah gelar.
- source_word: בְּיָדוֹ
  choice: ke dalam tangannya
  rationale: Terjemahan ini mempertahankan metafora Ibrani tentang tangan sebagai kuasa atau kendali. Akhiran pronominalnya secara gramatikal merujuk kepada Yefta.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai nama pribadi ilahi secara langsung; 'Yahweh' mempertahankannya sebagai nama dan tidak menggantinya dengan gelar.
- issue: Peranan Yahweh dalam kemenangan Yefta
  choice: Yahweh menyerahkan bani Amon ke dalam tangan Yefta
  alternative: Yefta mengalahkan bani Amon dengan pertolongan Yahweh
  rationale: Terjemahan mempertahankan pernyataan langsung teks bahwa Yahweh adalah pelaku yang menyerahkan musuh, tanpa mengubahnya menjadi penjelasan teologis yang lebih umum.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Yefta' mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia. Ungkapan 'ke dalam tangannya' sengaja mempertahankan citra idiomatis Ibrani; antesedennya jelas, yaitu Yefta.
