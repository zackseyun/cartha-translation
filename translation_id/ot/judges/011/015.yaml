    issue: “merebut” menerjemahkan לָקַח terlalu spesifik.
    rationale: Teks Ibrani hanya menyatakan bahwa Israel tidak “mengambil” tanah tersebut; konteks dapat menyangkut penguasaan, tetapi verba itu sendiri tidak menyatakan cara pengambilannya.
  - severity: medium
    issue: “firman Yefta” memberi nuansa yang tidak diperlukan.
    rationale: Dalam penggunaan Indonesia modern, “firman” kuat berasosiasi dengan perkataan ilahi. כֹּה אָמַר di sini adalah formula penyampaian resmi yang dapat diterjemahkan netral sebagai “Beginilah kata.”
  - severity: low
    issue: “bani Amon” kurang selaras dengan sasaran bahasa Indonesia modern baku.
    rationale: “Orang Amon” adalah sebutan etnis yang lebih alami; bentuk harfiahnya tetap dapat dicatat.
