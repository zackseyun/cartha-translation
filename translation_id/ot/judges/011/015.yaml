base_translation:
  language: en
  yaml_path: translation/ot/judges/011/015.yaml
  text: 'And he said to him[a], “Thus says Jephthah: Israel did not take the land of Moab or the land of the sons of Ammon.”'
translation:
  language: id
  text: 'Ia berkata kepadanya, “Beginilah kata Yefta: Israel tidak mengambil tanah Moab ataupun tanah orang Amon.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “tanah anak-anak Amon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: Ia berkata kepadanya
  rationale: Bentuk naratif wayyiqtol diikuti אמר menyatakan peristiwa ujaran berikutnya; 'berkata kepadanya' alami dan tetap dekat dengan struktur Ibrani.
- source_word: כֹּה אָמַר
  choice: Beginilah firman
  rationale: Formula utusan ini mempertahankan nada resmi dan deklaratif. Dalam bahasa Indonesia, 'Beginilah firman Yefta' lebih idiomatis dan bermartabat daripada susunan harfiah yang kaku.
- source_word: יִפְתָּח
  choice: Yefta
  rationale: Mengikuti bentuk nama yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: לֹא לָקַח
  choice: tidak merebut
  rationale: Dalam konteks sengketa wilayah dan penuturan sejarah, לקח berarti mengambil atau memperoleh melalui penaklukan; 'merebut' menyampaikan konteks tersebut dengan jelas tanpa menambahkan rincian yang tidak ada.
- source_word: אֶרֶץ
  choice: tanah
  rationale: '''Tanah'' merupakan padanan langsung yang wajar untuk wilayah geografis dan mempertahankan pengulangan konsep dalam teks sumber.'
- source_word: מוֹאָב
  choice: Moab
  rationale: Transliterasi baku nama tempat dan bangsa.
- source_word: בְּנֵי עַמּוֹן
  choice: bani Amon
  rationale: '''Bani Amon'' mempertahankan ungkapan Ibrani ''anak-anak Amon'' sebagai sebutan etnis yang sudah dikenal, sedangkan bentuk idiomatis modern dicantumkan dalam catatan kaki.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Formula diplomatik dipertahankan secara formal; 'bani Amon' dipakai dalam teks utama untuk mencerminkan bentuk sumber, dengan padanan modern dalam catatan kaki.
