base_translation:
  language: en
  yaml_path: translation/ot/judges/011/034.yaml
  text: Then Jephthah came to Mizpah[a], to his house, and behold, his daughter was coming out to meet him with tambourines and with dances. Now she was his only child[b]; besides her he had neither son nor daughter.
translation:
  language: id
  text: Kemudian Yefta datang ke Mizpa, ke rumahnya. Dan tampaklah, putrinya sedang keluar menyambutnya dengan rebana dan tari-tarian. Dialah anak satu-satunya[a]; selain dia, Yefta tidak mempunyai anak laki-laki ataupun anak perempuan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dia satu-satunya.” Konteks menjelaskan bahwa ia adalah satu-satunya anak Yefta.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא יִפְתָּח הַמִּצְפָּה אֶל בֵּיתוֹ
  choice: Kemudian Yefta tiba di rumahnya di Mizpa
  rationale: Bentuk naratif וַיָּבֹא melanjutkan urutan peristiwa. 'Tiba' menyampaikan sampainya Yefta ke tujuan secara alami, sedangkan susunan 'rumahnya di Mizpa' mengungkapkan kedua keterangan tempat tanpa kekakuan.
- source_word: וְהִנֵּה
  choice: Ternyata
  rationale: Penanda ini menghadirkan sesuatu yang mendadak dan mencolok dalam adegan. 'Ternyata' mempertahankan efek dramatis itu dalam bahasa Indonesia modern.
- source_word: בִתּוֹ יֹצֵאת לִקְרָאתוֹ
  choice: putrinya sedang keluar menyambutnya
  rationale: Partisipel יֹצֵאת menggambarkan tindakan yang sedang berlangsung ketika Yefta tiba; 'sedang keluar' mempertahankan kejelasan aspek tersebut. לִקְרָאתוֹ secara alami diterjemahkan 'menyambutnya'.
- source_word: בְתֻפִּים וּבִמְחֹלוֹת
  choice: dengan rebana dan tari-tarian
  rationale: '''Rebana'' merupakan istilah umum yang mudah dipahami untuk alat perkusi bingkai dalam suasana perayaan. Bentuk jamak מְחֹלוֹת dipertahankan dengan ''tari-tarian''.'
- source_word: וְרַק הִיא יְחִידָה
  choice: Dialah anak satu-satunya
  rationale: יְחִידָה secara harfiah menunjuk kepada 'satu-satunya' dan, berdasarkan klausa penjelas berikutnya, bermakna anak satu-satunya. Bentuk 'dialah' mempertahankan penekanan pada dirinya.
- source_word: אֵין לוֹ מִמֶּנּוּ בֵּן אוֹ בַת
  choice: selain dia, Yefta tidak mempunyai anak laki-laki ataupun anak perempuan
  rationale: Klausa ini menegaskan bahwa tidak ada keturunan lain. Nama 'Yefta' dipakai kembali agar rujukan pronomina jelas dan kalimat Indonesia tetap alami.
theological_decisions:
- issue: Status putri Yefta dan kaitannya dengan nazar dalam konteks selanjutnya
  choice: 'Ayat diterjemahkan secara deskriptif: ia adalah anak tunggal Yefta dan keluar menyambutnya dalam perayaan.'
  alternative: Penekanan pada status anak tunggal dapat ditafsirkan dalam kaitan dengan kurban harfiah atau dengan hidup tanpa menikah dan tanpa keturunan.
  rationale: Ayat ini sendiri belum menyatakan nasib putri Yefta. Terjemahan tidak mendahului narasi atau memutuskan perdebatan mengenai penggenapan nazar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif yang bermartabat. Nama tempat ditulis 'Mizpa' dan nama tokoh 'Yefta' sesuai bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia. Catatan kaki alternatif bahasa Inggris pada penanda setelah 'Mizpah' tidak diadopsi karena isinya tidak berkaitan dengan nama tempat dan tampaknya merupakan salah penempatan penanda.
