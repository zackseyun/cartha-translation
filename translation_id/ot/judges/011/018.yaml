  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ בַּ/מִּדְבָּ֗ר וַ/יָּ֜סָב אֶת אֶ֤רֶץ אֱדוֹם֙ וְ/אֶת אֶ֣רֶץ מוֹאָ֔ב וַ/יָּבֹ֤א מִ/מִּזְרַח שֶׁ֨מֶשׁ֙ לְ/אֶ֣רֶץ מוֹאָ֔ב וַֽ/יַּחֲנ֖וּ/ן בְּ/עֵ֣בֶר אַרְנ֑וֹן וְ/לֹא בָ֨אוּ֙ בִּ/גְב֣וּל מוֹאָ֔ב כִּ֥י אַרְנ֖וֹן גְּב֥וּל מוֹאָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/018.yaml
  text: Then he went through the wilderness and went around the land of Edom and the land of Moab[a], and came to the east side of the land of Moab, and they camped beyond the Arnon; but they did not enter the territory of Moab[b], for the Arnon was the border of Moab.
translation:
  language: id
  text: Kemudian Israel berjalan melalui padang belantara, mengelilingi tanah Edom dan tanah Moab, lalu tiba di sebelah timur tanah Moab.[a] Mereka berkemah di seberang Sungai Arnon,[b] tetapi tidak memasuki wilayah Moab, sebab Sungai Arnon adalah batas Moab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “datang dari arah terbitnya matahari menuju tanah Moab,” yaitu mendekati Moab dari sebelah timur.
    reason: lexical_alternative
  - marker: b
    text: Atau, “di sisi lain Sungai Arnon.” Sudut pandang yang menentukan sisi tersebut tidak disebutkan secara tegas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ בַּמִּדְבָּר
  choice: berjalan melalui padang belantara
  rationale: Kata הלך berarti pergi atau berjalan, sedangkan מִדְבָּר menunjuk kawasan liar dan gersang, tidak selalu gurun pasir. Frasa ini menyampaikan perjalanan melalui kawasan tersebut secara alami dalam bahasa Indonesia.
- source_word: וַיָּסָב אֶת אֶרֶץ אֱדוֹם וְאֶת אֶרֶץ מוֹאָב
  choice: mengelilingi tanah Edom dan tanah Moab
  rationale: Dalam konteks rute perjalanan, סבב berarti mengambil jalan memutar mengitari kedua wilayah itu, bukan melintasinya.
- source_word: וַיָּבֹא מִמִּזְרַח שֶׁמֶשׁ לְאֶרֶץ מוֹאָב
  choice: lalu tiba di sebelah timur tanah Moab
  rationale: Ungkapan harfiah 'dari arah terbitnya matahari' menunjukkan arah timur. Terjemahan ini menyatakan lokasi pendekatan dengan jelas tanpa menyiratkan bahwa Israel memasuki Moab.
- source_word: וַיַּחֲנוּן
  choice: Mereka berkemah
  rationale: Kata חנה berarti berkemah. Bentuk jamak Ibrani dipertahankan dengan 'mereka', sesudah Israel sebelumnya diperlakukan sebagai subjek kolektif tunggal.
- source_word: בְּעֵבֶר אַרְנוֹן
  choice: di seberang Sungai Arnon
  rationale: עֵבֶר berarti sisi seberang atau sisi lain, tetapi sudut pandang geografisnya tidak dinyatakan secara mutlak. 'Di seberang' mempertahankan keluwesan itu. Penambahan 'Sungai' memperjelas bahwa Arnon adalah unsur geografis yang menjadi batas.
- source_word: וְלֹא בָאוּ בִּגְבוּל מוֹאָב
  choice: tetapi tidak memasuki wilayah Moab
  rationale: גְּבוּל dapat berarti batas maupun wilayah yang dibatasi. Bersama verba 'masuk', makna kontekstualnya adalah tidak masuk ke dalam wilayah Moab.
- source_word: כִּי אַרְנוֹן גְּבוּל מוֹאָב
  choice: sebab Sungai Arnon adalah batas Moab
  rationale: כִּי memberi alasan bagi pernyataan sebelumnya, dan גְּבוּל di sini secara langsung menunjuk batas wilayah.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama kolektif 'Israel' dipakai untuk subjek tunggal tersirat, lalu peralihan sumber Ibrani kepada bentuk jamak dipertahankan melalui 'mereka'. Istilah 'padang belantara' menghindari kesan bahwa medan itu selalu berupa gurun pasir.
