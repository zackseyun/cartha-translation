base_translation:
  language: en
  yaml_path: translation/ot/judges/011/020.yaml
  text: But Sihon did not trust Israel to pass through his territory[a]. So Sihon gathered all his people, and they camped at Jahaz[c][b], and he fought against Israel.
translation:
  language: id
  text: Namun, Sihon tidak memercayai Israel untuk melintasi wilayahnya[a]. Lalu, Sihon mengumpulkan seluruh rakyatnya[b]. Mereka berkemah di Yahas, lalu ia berperang melawan Israel[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “tidak percaya kepada Israel”; maksud tersiratnya ialah Sihon tidak cukup memercayai mereka untuk membiarkan mereka melintas.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “seluruh rakyatnya”. Konteksnya bersifat militer, tetapi teks tidak secara khusus menyebut mereka “pasukan” atau “tentara”.'
    reason: lexical_alternative
  - marker: c
    text: Bahasa Ibrani memakai kata depan yang secara harfiah berarti “dengan”, tetapi dalam konstruksi ini maksudnya ialah berperang melawan Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶאֱמִין
  choice: memercayai
  rationale: Bentuk Hifil dari אמן di sini menyatakan menaruh kepercayaan kepada seseorang. Pilihan ini mempertahankan alasan penolakan Sihon tanpa sekadar menerjemahkan akibatnya sebagai 'tidak mengizinkan'.
- source_word: עֲבֹר בִּגְבֻלוֹ
  choice: untuk melintasi wilayahnya
  rationale: עבר dalam konteks ini menunjuk pada perjalanan melintasi tanah yang dikuasai Sihon, sedangkan גְּבוּל mencakup wilayah, bukan hanya garis perbatasan.
- source_word: וַיֶּאֱסֹף
  choice: mengumpulkan
  rationale: Kata ini menggambarkan pengerahan orang-orang untuk menghadapi Israel. 'Mengumpulkan' tetap dekat dengan teks dan tidak secara eksplisit mengubah mereka menjadi tentara.
- source_word: כָּל עַמּוֹ
  choice: seluruh rakyatnya
  rationale: Teks Ibrani secara harfiah menyebut 'seluruh rakyatnya', walaupun konteksnya jelas bersifat militer.
- source_word: וַיַּחֲנוּ
  choice: Mereka berkemah
  rationale: Kata kerja berbentuk jamak dan merujuk kepada rakyat yang baru saja dikumpulkan.
- source_word: בְּיָהְצָה
  choice: di Yahas
  rationale: Nama tempat יָהְצָה disajikan dengan bentuk Indonesia yang lazim, 'Yahas'; kata depan בְּ menunjukkan lokasi perkemahan.
- source_word: וַיִּלָּחֶם עִם
  choice: ia berperang melawan
  rationale: Kata kerja kembali berbentuk tunggal dengan Sihon sebagai subjek. Dalam konstruksi ini, עִם menyatakan pihak lawan, sehingga 'melawan' lebih alami dan tidak ambigu dalam bahasa Indonesia.
