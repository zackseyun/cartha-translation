base_translation:
  language: en
  yaml_path: translation/ot/judges/011/005.yaml
  text: And when the Ammonites fought against Israel[a], the elders of Gilead went to bring Jephthah from the land of Tob.
translation:
  language: id
  text: Ketika orang Amon berperang melawan Israel, para tua-tua Gilead pergi menjemput[a] Yefta dari tanah Tob.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “mengambil”. Dalam konteks ini, maksudnya ialah pergi mendapatkan Yefta lalu membawanya kembali.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: Ketika
  rationale: Rangkaian ini memperkenalkan keadaan waktu bagi tindakan utama berikutnya. “Ketika” menyampaikan fungsi temporalnya secara alami tanpa mempertahankan formula naratif Ibrani secara kaku.
- source_word: נִלְחֲמוּ
  choice: berperang
  rationale: Bentuk Nifal dari לחם di sini menyatakan keterlibatan dalam peperangan; “berperang” merupakan padanan Indonesia yang wajar dalam konteks ini.
- source_word: בְנֵי עַמּוֹן
  choice: bani Amon
  rationale: Ungkapan ini adalah sebutan etnis bagi orang Amon. “Bani Amon” merupakan bentuk ringkas dan lazim dalam ragam Alkitab bahasa Indonesia.
- source_word: עִם יִשְׂרָאֵל
  choice: melawan Israel
  rationale: Walaupun עִם pada dasarnya berarti “dengan”, sesudah verba berperang kata ini menandai pihak lawan; “melawan” menyatakan hubungan permusuhan itu dengan jelas.
- source_word: זִקְנֵי גִלְעָד
  choice: para tua-tua Gilead
  rationale: Rangkaian konstruksi ini menunjuk kepada para pemimpin yang diakui di Gilead. “Para tua-tua” mempertahankan gelar sosial-politiknya.
- source_word: לָקַחַת
  choice: menjemput
  rationale: לקח sering berarti “mengambil”, tetapi dalam konteks para tua-tua pergi ke tempat Yefta untuk membawanya kembali, “menjemput” paling alami dan tepat dalam bahasa Indonesia. Arti dasarnya dicatat dalam catatan kaki.
- source_word: אֶת יִפְתָּח
  choice: Yefta
  rationale: אֶת menandai objek langsung, sedangkan יִפְתָּח adalah nama pribadi yang secara konvensional ditulis “Yefta” dalam bahasa Indonesia.
- source_word: מֵאֶרֶץ טוֹב
  choice: dari tanah Tob
  rationale: אֶרֶץ dapat berarti tanah, negeri, atau wilayah. “Tanah Tob” mempertahankan ungkapan geografis yang ringkas dan tidak menentukan lebih jauh status kawasan tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Formula pembuka Ibrani disederhanakan menjadi hubungan temporal alami. Istilah “para tua-tua” dipertahankan sebagai gelar kepemimpinan tradisional, sedangkan “menjemput” dipilih agar arah tindakan para tua-tua jelas.
