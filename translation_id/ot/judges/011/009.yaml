  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יִפְתָּ֜ח אֶל זִקְנֵ֣י גִלְעָ֗ד אִם מְשִׁיבִ֨ים אַתֶּ֤ם אוֹתִ/י֙ לְ/הִלָּחֵם֙ בִּ/בְנֵ֣י עַמּ֔וֹן וְ/נָתַ֧ן יְהוָ֛ה אוֹתָ֖/ם לְ/פָנָ֑/י אָנֹכִ֕י אֶהְיֶ֥ה לָ/כֶ֖ם לְ/רֹֽאשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/009.yaml
  text: Jephthah said to the elders of Gilead[a], “If you bring me back to fight against the Ammonites, and Yahweh gives them before me[b], I will be your head.”
translation:
  language: id
  text: Yefta berkata kepada para tua-tua Gilead, “Jika kalian membawa aku kembali untuk berperang melawan bani Amon, dan Yahweh menyerahkan mereka kepadaku, aku akan menjadi pemimpin kalian.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Klausa terakhir dapat juga dipahami sebagai pertanyaan: “Apakah aku akan menjadi pemimpin kalian?” Secara harfiah, kata yang diterjemahkan “pemimpin” adalah “kepala.”'
    reason: Menjaga kemungkinan daya ujar interogatif yang timbul dari konteks sekaligus mencatat metafora leksikal ראש.
lexical_decisions:
- source_word: מְשִׁיבִים
  choice: membawa aku kembali
  rationale: Bentuk Hifil dari שוב bersifat kausatif, yaitu menyebabkan seseorang kembali. Ungkapan ini wajar dalam bahasa Indonesia dan sesuai dengan konteks Yefta yang sebelumnya diusir.
- source_word: לְהִלָּחֵם
  choice: untuk berperang
  rationale: Infinitif Nifal dari לחם menunjuk pada keterlibatan dalam pertempuran; “berperang” alami dan tepat untuk konteks militer.
- source_word: בִּבְנֵי עַמּוֹן
  choice: melawan bani Amon
  rationale: Secara harfiah berarti “melawan anak-anak Amon.” “Bani Amon” merupakan sebutan etnis yang lazim dan tetap dekat dengan bentuk Ibrani.
- source_word: וְנָתַן יְהוָה אוֹתָם לְפָנַי
  choice: dan Yahweh menyerahkan mereka kepadaku
  rationale: Ungkapan נתן ... לפני secara harfiah berarti “memberikan mereka di hadapanku,” tetapi dalam konteks perang menyatakan bahwa Yahweh membuat musuh takluk di hadapan Yefta. “Menyerahkan mereka kepadaku” menyampaikan makna idiomatis tanpa menambahkan metafora “ke dalam tanganku,” yang tidak terdapat dalam teks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar.
- source_word: לְרֹאשׁ
  choice: pemimpin
  rationale: ראש secara harfiah berarti “kepala,” tetapi di sini digunakan secara metaforis untuk orang yang memegang kekuasaan. “Pemimpin” menyampaikan fungsi politiknya dengan jelas dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama diri ilahi secara langsung; “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Daya ujar אָנֹכִי אֶהְיֶה לָכֶם לְרֹאשׁ
  choice: 'pernyataan: “aku akan menjadi pemimpin kalian”'
  alternative: 'pertanyaan: “apakah aku akan menjadi pemimpin kalian?”'
  rationale: Klausa Ibrani tidak memiliki partikel tanya dan secara gramatikal berbentuk pernyataan. Konteks perundingan memungkinkan nuansa meminta penegasan, tetapi penerjemahan utama mempertahankan bentuk eksplisit teks; kemungkinan interogatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan jamak “kalian” dipakai karena Yefta berbicara kepada sejumlah tua-tua. Nama tokoh mengikuti bentuk Indonesia yang lazim, “Yefta.”
