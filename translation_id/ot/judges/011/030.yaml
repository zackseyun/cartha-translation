lexical_decisions:
- source_word: וַיִּדַּר ... נֶדֶר
  choice: mengucapkan nazar
  rationale: Ungkapan ini mempertahankan verba dan objek serumpun dalam bahasa Ibrani, tetapi tetap alami dan jelas dalam bahasa Indonesia.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל diterjemahkan sebagai ‘kepada’, sedangkan nama perjanjian יהוה ditransliterasikan ‘Yahweh’.
- source_word: אִם
  choice: Jika
  rationale: Kata ini membuka anak kalimat syarat dari nazar Yefta, yang berlanjut ke ayat berikutnya.
- source_word: נָתוֹן תִּתֵּן
  choice: benar-benar menyerahkan
  rationale: Infinitif absolut yang diikuti verba finit memberi penegasan; ‘benar-benar’ menyampaikan intensitas itu secara wajar.
- source_word: בְּנֵי עַמּוֹן
  choice: orang Amon
  rationale: Ini adalah padanan idiomatis bagi sebutan etnis harfiah ‘anak-anak Amon’.
- source_word: בְּיָדִי
  choice: ke dalam tanganku
  rationale: Terjemahan ini mempertahankan bentuk tunggal dan kiasan Ibrani tentang penyerahan ke dalam kuasa seseorang.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; ‘Yahweh’ mempertahankan nama pribadi ilahi tanpa menggantinya dengan gelar.
- issue: Sifat syarat dalam nazar Yefta
  choice: Jika Engkau benar-benar menyerahkan
  alternative: Apabila Engkau menyerahkan
  rationale: Bentuk אִם dipertahankan sebagai syarat, sementara konstruksi penegas Ibrani diterjemahkan tanpa menentukan lebih jauh implikasi teologis nazar tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda koma pada akhir ayat dipertahankan karena ucapan nazar dan anak kalimat syarat berlanjut ke ayat berikutnya.
