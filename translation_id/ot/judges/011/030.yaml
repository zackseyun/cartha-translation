  yaml_path: translation/ot/judges/011/030.yaml
  text: And Jephthah made a vow to Yahweh and said[a], “If you indeed give the Ammonites into my hand,”
translation:
  language: id
  text: Lalu Yefta bernazar kepada Yahweh dan berkata, “Jika Engkau benar-benar[a] menyerahkan orang Amon ke dalam tanganku,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sungguh-sungguh.” Bahasa Ibrani memakai bentuk infinitif bersama kata kerja finit untuk memberi penegasan.
