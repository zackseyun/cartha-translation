  text: וַ/יִּשְׁלַ֤ח יִפְתָּח֙ מַלְאָכִ֔ים אֶל מֶ֥לֶךְ בְּנֵֽי עַמּ֖וֹן לֵ/אמֹ֑ר מַה לִּ֣/י וָ/לָ֔/ךְ כִּֽי בָ֥אתָ אֵלַ֖/י לְ/הִלָּחֵ֥ם בְּ/אַרְצִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/012.yaml
  text: Then Jephthah sent messengers to the king of the Ammonites[a], saying, “What is there between me and you, that you have come against me to fight in my land?”
translation:
  language: id
  text: Lalu Yefta mengirim utusan kepada raja orang Amon dengan berkata, “Apa urusanmu denganku,[a] sehingga engkau datang untuk berperang melawan aku di negeriku?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Apa urusan antara aku dan engkau?” Ungkapan Ibrani ini menyatakan permusuhan atau perselisihan antara dua pihak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: Lalu ... mengirim
  rationale: Waw konsekutif melanjutkan rangkaian narasi; “lalu” menyatakan urutan secara alami dalam bahasa Indonesia.
- source_word: יִפְתָּח
  choice: Yefta
  rationale: Nama pribadi ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: מַלְאָכִים
  choice: utusan-utusan
  rationale: Dalam konteks diplomatik ini, kata tersebut menunjuk kepada wakil manusia, bukan makhluk surgawi.
- source_word: אֶל מֶלֶךְ בְּנֵי עַמּוֹן
  choice: kepada raja bani Amon
  rationale: Bene Ammon adalah sebutan etnis; “bani Amon” merupakan bentuk yang ringkas dan dikenal dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: dengan pesan
  rationale: Mengantar kutipan langsung secara alami sekaligus menyampaikan fungsi formula Ibrani yang harfiah berarti “dengan berkata”.
- source_word: מַה לִּי וָלָךְ
  choice: Apa urusan antara aku dan engkau
  rationale: Ungkapan ini mempertahankan bentuk relasional idiom Ibrani dan menyatakan adanya perselisihan atau permusuhan tanpa mempersempit maknanya.
- source_word: כִּי
  choice: sehingga
  rationale: Dalam pertanyaan ini partikel tersebut menghubungkan perselisihan dengan tindakan lawan yang menyusul; “sehingga” menghasilkan pertanyaan Indonesia yang wajar tanpa memaksakan kausalitas yang terlalu tegas.
- source_word: בָאתָ אֵלַי
  choice: engkau datang menyerang aku
  rationale: Secara harfiah berarti “engkau datang kepadaku,” tetapi konteks permusuhan dan infinitif berikutnya memberi nuansa adversatif.
- source_word: לְהִלָּחֵם
  choice: untuk berperang
  rationale: Bentuk Niphal dari לחם berarti terlibat dalam pertempuran; “berperang” sesuai dengan konteks konflik antarbangsa.
- source_word: בְּאַרְצִי
  choice: di negeriku
  rationale: Preposisi בְּ dipertahankan sebagai “di”; “negeri” menyampaikan wilayah kekuasaan Yefta secara alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk “aku” dan “engkau” dipakai dalam dialog resmi untuk mempertahankan ketegasan diplomatik. Penanda catatan kaki ditempatkan tepat setelah ungkapan yang dijelaskannya.
