  terminology: '"Yefta" dan "Amon" tepat. "Utusan" tepat untuk מַלְאָכִים dalam konteks diplomatik. Catatan kaki dipertahankan, tetapi alternatifnya diubah menjadi bentuk yang lebih dekat dengan susunan harfiah Ibrani.'
