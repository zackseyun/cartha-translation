source:
  edition: WLC
  text: וְ/הָיָ֣ה הַ/יּוֹצֵ֗א אֲשֶׁ֨ר יֵצֵ֜א מִ/דַּלְתֵ֤י בֵיתִ/י֙ לִ/קְרָאתִ֔/י בְּ/שׁוּבִ֥/י בְ/שָׁל֖וֹם מִ/בְּנֵ֣י עַמּ֑וֹן וְ/הָיָה֙ לַֽ/יהוָ֔ה וְ/הַעֲלִיתִ֖/הוּ עוֹלָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/031.yaml
  text: then whatever comes out from the doors of my house to meet me when I return in peace from the Ammonites shall be Yahweh’s[a], and I will offer it up as a burnt offering.
translation:
  language: id
  text: maka yang keluar dari pintu rumahku untuk menyambut aku ketika aku kembali dengan selamat dari bani Amon akan menjadi milik TUHAN[a], dan aku akan mempersembahkannya sebagai kurban bakaran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akan menjadi milik TUHAN, atau aku akan mempersembahkannya sebagai kurban bakaran.” Sebagian penafsir memahami kata penghubung Ibrani di sini dalam arti pemisah, sehingga ada dua kemungkinan, bergantung pada siapa atau apa yang keluar untuk menyambut Yefta.
    reason: alternative_reading
lexical_decisions:
- source_word: הַיּוֹצֵא אֲשֶׁר יֵצֵא
  choice: yang keluar
  rationale: Ungkapan substantival ini secara harfiah menunjuk kepada ‘yang keluar’. Bahasa Indonesia memungkinkan bentuk ini tetap terbuka, tanpa lebih dahulu menentukan apakah yang dimaksud manusia atau hewan.
- source_word: מִדַּלְתֵי בֵיתִי
  choice: dari pintu rumahku
  rationale: Walaupun דַּלְתֵי berbentuk jamak, ‘pintu rumahku’ merupakan ungkapan Indonesia yang alami untuk tempat keluar dari rumah dan tidak menimbulkan kesan yang tidak perlu bahwa rumah itu memiliki banyak pintu masuk.
- source_word: לִקְרָאתִי
  choice: untuk menyambut aku
  rationale: Dalam konteks seseorang keluar dari rumah ketika pemenang perang pulang, ‘menyambut aku’ menyampaikan gerak untuk menemui sekaligus nuansa penerimaan yang wajar.
- source_word: בְּשׁוּבִי בְשָׁלוֹם
  choice: ketika aku kembali dengan selamat
  rationale: בְשָׁלוֹם di sini menyatakan kepulangan dalam keadaan aman dan utuh sesudah pertempuran; ‘dengan selamat’ merupakan padanan Indonesia yang alami.
- source_word: מִבְּנֵי עַמּוֹן
  choice: dari bani Amon
  rationale: Ungkapan ini secara harfiah berarti ‘dari anak-anak Amon’ dan dalam konteks menunjuk kepada bangsa Amon sebagai pihak yang dilawan. ‘Bani Amon’ adalah sebutan Indonesia yang ringkas dan lazim dalam konteks Alkitab.
- source_word: וְהָיָה לַיהוָה
  choice: akan menjadi milik TUHAN
  rationale: Frasa ini menyatakan bahwa yang keluar itu akan dikhususkan bagi atau menjadi kepunyaan YHWH, tanpa menentukan terlebih dahulu cara pengkhususannya.
- source_word: לַיהוָה
  choice: TUHAN
  rationale: Nama ilahi YHWH diterjemahkan dengan bentuk baku ‘TUHAN’ dalam teks utama.
- source_word: וְהַעֲלִיתִהוּ עוֹלָה
  choice: dan aku akan mempersembahkannya sebagai kurban bakaran
  rationale: Bentuk Hifil dari עלה bersama עוֹלָה merupakan ungkapan korban yang berarti mempersembahkan sebagai kurban bakaran. Akhiran pronominal maskulin tunggal diterjemahkan ‘-nya’ agar jenis referennya tetap terbuka.
theological_decisions:
- issue: Apakah nazar Yefta menyatakan satu hasil dengan penghubung ‘dan’, atau dua kemungkinan dengan penghubung ‘atau’.
  choice: 'Satu hasil: ‘akan menjadi milik TUHAN, dan aku akan mempersembahkannya sebagai kurban bakaran’.'
  alternative: 'Dua kemungkinan: ‘akan menjadi milik TUHAN, atau aku akan mempersembahkannya sebagai kurban bakaran’.'
  rationale: Kata penghubung וְ paling lazim berarti ‘dan’, sehingga bacaan utama mempertahankan hubungan konjungtif. Karena dalam konteks ini ada penafsiran yang memahami penghubung tersebut secara disjungtif, kemungkinan itu dicatat dalam catatan kaki agar ketegangan teks tidak diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami bagi pembaca umum, sementara ungkapan ‘yang keluar’ dan akhiran ‘-nya’ mempertahankan keterbukaan referen dalam bahasa Ibrani. Istilah ‘kurban bakaran’ dipakai sebagai istilah korban yang jelas dan lazim.
