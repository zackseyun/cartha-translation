base_translation:
  language: en
  yaml_path: translation/ot/judges/011/037.yaml
  text: 'And she said to her father[a], “Let this thing be done for me: leave me alone for two months, that I may go and wander on the mountains and weep over my virginity[b], I and my companions.”'
translation:
  language: id
  text: 'Lalu ia berkata kepada ayahnya, “Biarlah hal ini dilakukan untukku: biarkanlah aku selama dua bulan[a], supaya aku dapat pergi dan turun ke pegunungan serta menangisi keperawananku[b], aku bersama teman-temanku.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berilah aku kebebasan selama dua bulan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menangisi keperawananku.” Ungkapan ini menekankan bahwa ia belum menikah dan tidak mempunyai anak, tanpa memastikan di sini bagaimana keseluruhan kisah harus ditafsirkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵעָשֶׂה לִּי הַדָּבָר הַזֶּה
  choice: Biarlah hal ini dilakukan bagiku
  rationale: Mempertahankan bentuk pasif-yusif dari עשה dan ungkapan demonstratif ‘hal ini’, tanpa mengubahnya secara tersirat menjadi ‘kabulkan permintaanku’.
- source_word: הַרְפֵּה מִמֶּנִּי
  choice: biarkanlah aku
  rationale: Imperatif רפה dengan מן meminta agar si pembicara dilepas atau diberi kebebasan untuk suatu waktu. Ungkapan ini cukup alami dalam bahasa Indonesia ketika diikuti tujuan tindakannya.
- source_word: שְׁנַיִם חֳדָשִׁים
  choice: selama dua bulan
  rationale: Ungkapan waktu diterjemahkan langsung dengan penambahan ‘selama’ yang wajar dalam bahasa Indonesia.
- source_word: וְאֵלְכָה וְיָרַדְתִּי
  choice: supaya aku dapat pergi turun
  rationale: Kedua verba, ‘pergi’ dan ‘turun’, dipertahankan. Bentuk maksud/permohonan diungkapkan secara alami dengan ‘supaya aku dapat’.
- source_word: עַל הֶהָרִים
  choice: ke pegunungan
  rationale: Dalam konteks verba gerak ‘turun’, על diterjemahkan secara idiomatis sebagai arah menuju kawasan pegunungan; ini tidak menentukan lokasi yang lebih spesifik daripada teks sumber.
- source_word: וְאֶבְכֶּה עַל בְּתוּלַי
  choice: dan menangisi keperawananku
  rationale: בכה על berarti menangisi atau meratapi, sedangkan בְּתוּלִים menunjuk pada keadaan sebagai perawan. Terjemahan mempertahankan fokus eksplisit ayat tanpa menambahkan kematian atau pengabdian seumur hidup.
- source_word: אָנֹכִי וְרֵעוֹתָי
  choice: aku bersama teman-temanku
  rationale: Bentuk feminin jamak merujuk kepada teman-teman perempuan sang pembicara. Bahasa Indonesia tidak menandai gender pada ‘teman’, dan konteks sudah memadai.
theological_decisions:
- issue: Makna ratapan anak perempuan Yefta atas keperawanannya
  choice: Ayat diterjemahkan dengan tetap menyebut keperawanan sebagai objek ratapannya.
  alternative: Menjelaskannya secara eksplisit sebagai ratapan atas kematian yang akan datang, ketiadaan keturunan, atau hidup membujang dalam pengabdian.
  rationale: Ayat ini sendiri menonjolkan keperawanan dan tidak secara eksplisit menyebut kematian. Terjemahan karena itu tidak menyelesaikan ketegangan penafsiran dalam kisah yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Struktur Ibrani dipertahankan sejauh masih dapat dipahami, sementara urutan penutup dibuat alami sebagai ‘aku bersama teman-temanku’.
