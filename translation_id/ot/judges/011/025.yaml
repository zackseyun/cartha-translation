  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הֲ/ט֥וֹב טוֹב֙ אַתָּ֔ה מִ/בָּלָ֥ק בֶּן צִפּ֖וֹר מֶ֣לֶךְ מוֹאָ֑ב הֲ/ר֥וֹב רָב֙ עִם יִשְׂרָאֵ֔ל אִם נִלְחֹ֥ם נִלְחַ֖ם בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/025.yaml
  text: And now[a], are you really better than Balak son of Zippor, king of Moab? Did he ever contend with Israel[b], or did he ever fight against them?
translation:
  language: id
  text: Jadi sekarang, apakah engkau sungguh lebih baik daripada Balak anak Zipor, raja Moab?[a] Pernahkah ia benar-benar berbantah dengan Israel, atau pernahkah ia benar-benar berperang melawan mereka?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “apakah engkau baik, baik daripada Balak”; pengulangan kata Ibrani yang berarti “baik” menegaskan perbandingan, sehingga dapat juga diterjemahkan, “apakah engkau lebih baik sedikit pun daripada Balak?”
    reason: lexical_alternative
  - marker: b
    text: Kata pertama dapat berarti berbantah, berselisih, atau bersengketa, sedangkan kata kedua secara khusus menunjuk pada pertempuran atau peperangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Jadi sekarang
  rationale: Ungkapan ini menjadi penghubung wacana yang mengantar tantangan retoris Yefta; 'Jadi sekarang' mempertahankan daya penghubung וְ dan nuansa temporal עַתָּה secara alami.
- source_word: הֲטוֹב טוֹב אַתָּה
  choice: apakah engkau sungguh lebih baik
  rationale: Pengulangan טוֹב memberi penegasan pada pertanyaan perbandingan. 'Sungguh lebih baik' menyampaikan tekanan itu tanpa terjemahan harfiah yang janggal.
- source_word: מִבָּלָק בֶּן צִפּוֹר מֶלֶךְ מוֹאָב
  choice: daripada Balak anak Zipor, raja Moab
  rationale: Rangkaian nama dan gelar diterjemahkan langsung dan alami; preposisi מִן menyatakan perbandingan.
- source_word: הֲרוֹב רָב
  choice: Pernahkah ia benar-benar berbantah
  rationale: Konstruksi infinitif absolut dengan verba finit menegaskan pertanyaan retoris. 'Berbantah' mempertahankan keluasan ריב, yang dapat mencakup pertikaian atau persengketaan, tanpa menyamakannya dengan peperangan pada klausa berikutnya.
- source_word: עִם יִשְׂרָאֵל
  choice: dengan Israel
  rationale: עִם pada dasarnya berarti 'dengan'; bentuk ini juga alami bersama 'berbantah' dan menjaga perbedaan nuansa dari 'melawan mereka' pada klausa berikut.
- source_word: אִם
  choice: atau
  rationale: Di sini אִם memperkenalkan bagian kedua dari pertanyaan alternatif retoris dan secara idiomatis diterjemahkan 'atau'.
- source_word: נִלְחֹם נִלְחַם בָּם
  choice: pernahkah ia benar-benar berperang melawan mereka
  rationale: Infinitif absolut bersama bentuk finit memberi penegasan. 'Berperang melawan' menyatakan konflik bersenjata secara jelas serta membedakannya dari ריב.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Kata ganti 'engkau' mempertahankan sapaan tunggal langsung kepada raja Amon. Dua verba konflik dibedakan sebagai 'berbantah' dan 'berperang' agar ketegangan leksikal teks Ibrani tetap tampak.
