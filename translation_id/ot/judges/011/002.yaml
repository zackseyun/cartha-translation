base_translation:
  language: en
  yaml_path: translation/ot/judges/011/002.yaml
  text: And Gilead’s wife bore him sons. When the sons of the wife grew up, they drove Jephthah out and said to him, “You will not have an inheritance in our father’s house, for you are the son of another woman.”
translation:
  language: id
  text: Istri Gilead melahirkan anak-anak laki-laki bagi Gilead. Setelah anak-anak istri itu menjadi dewasa, mereka mengusir Yefta dan berkata kepadanya, “Engkau tidak akan mendapat warisan dalam keluarga ayah kami, sebab engkau anak dari perempuan lain.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵשֶׁת גִּלְעָד
  choice: istri Gilead
  rationale: Menerjemahkan konstruksi kepunyaan Ibrani secara langsung dan alami.
- source_word: בְּנֵי הָאִשָּׁה
  choice: anak-anak istri itu
  rationale: Mempertahankan artikel tertentu dan peralihan ungkapan dalam teks sumber, yang menunjuk kepada istri Gilead yang baru disebutkan.
- source_word: לֹא תִנְחַל
  choice: engkau tidak akan mendapat warisan
  rationale: Kata kerja נחל dalam konteks ini menyatakan memperoleh bagian warisan; ungkapan ini alami dalam bahasa Indonesia tanpa menentukan rincian hukum yang tidak dinyatakan.
- source_word: בְּבֵית אָבִינוּ
  choice: dalam keluarga ayah kami
  rationale: בֵּית אָב dapat menunjuk pada rumah tangga atau keluarga garis ayah, bukan semata-mata bangunan fisik.
- source_word: בֶּן אִשָּׁה אַחֶרֶת
  choice: anak dari perempuan lain
  rationale: Mempertahankan ungkapan sengaja merendahkan dari saudara-saudara Yefta tanpa menambahkan klasifikasi sosial atau hukum.
theological_decisions:
- issue: Dasar penolakan hak waris Yefta
  choice: 'Mempertahankan ucapan saudara-saudaranya sebagai klaim mereka: “engkau tidak akan mendapat warisan”'
  alternative: Menyatakannya sebagai keputusan hukum yang sah atau menerjemahkan “engkau tidak akan mewarisi”
  rationale: Ayat melaporkan tindakan dan perkataan para saudara, bukan penilaian ilahi atas keabsahan tuntutan mereka; pilihan ini tidak menyelesaikan ketegangan hukum secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama יפתח ditulis “Yefta” sesuai bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia. Tidak ada catatan kaki karena tidak ada ambiguitas yang memerlukan penjelasan tambahan pada ayat ini.
