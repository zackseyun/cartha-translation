  terminology: “Yefta” sesuai penggunaan Alkitab bahasa Indonesia. “Warisan,” “keluarga ayah kami,” dan “perempuan lain” mempertahankan makna serta nada penolakan para saudara tanpa menambahkan penilaian hukum atau status sosial yang tidak dinyatakan teks.
