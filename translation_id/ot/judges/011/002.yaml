  source_fidelity: 'Terjemahan dengan tepat mencerminkan unsur-unsur utama teks Ibrani: istri Gilead melahirkan putra-putra baginya; putra-putra istri itu setelah dewasa mengusir Yefta; dan mereka menolak hak warisnya dengan menyebutnya anak perempuan lain. Frasa “dalam keluarga ayah kami” merupakan pemahaman yang dapat dipertanggungjawabkan atas בְּבֵית אָבִינוּ dalam konteks warisan.'
