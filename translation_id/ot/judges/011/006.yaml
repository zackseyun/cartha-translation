base_translation:
  language: en
  yaml_path: translation/ot/judges/011/006.yaml
  text: And they said to Jephthah[a], “Come and be our commander, and let us fight against the Ammonites.”
translation:
  language: id
  text: Lalu mereka berkata kepada Yefta, “Datanglah dan jadilah panglima kami, dan mari kita berperang melawan bani Amon.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Amon”, sebutan umum bagi orang Amon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Lalu mereka berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menyatakannya secara alami dalam bahasa Indonesia.
- source_word: לְיִפְתָּח
  choice: kepada Yefta
  rationale: Nama יִפְתָּח ditransliterasikan dengan bentuk Indonesia yang lazim, “Yefta”.
- source_word: לְכָה
  choice: Datanglah
  rationale: Imperatif הלך dalam konteks pemanggilan ini berfungsi sebagai ajakan agar Yefta datang kepada mereka.
- source_word: וְהָיִיתָה לָּנוּ
  choice: dan jadilah ... kami
  rationale: Ungkapan harfiah “dan engkau menjadi bagi kami” dialihkan secara idiomatis tanpa mengubah tuntutan mereka.
- source_word: לְקָצִין
  choice: panglima
  rationale: קָצִין menunjuk pemimpin atau kepala militer; konteks perang mendukung “panglima”.
- source_word: וְנִלָּחֲמָה
  choice: supaya kita berperang
  rationale: Bentuk kohortatif jamak mengungkapkan tindakan bersama yang dimaksudkan menyusul pengangkatan Yefta; “supaya” menyampaikan hubungan maksud secara wajar, meski koordinasi sederhana juga mungkin.
- source_word: בִּבְנֵי עַמּוֹן
  choice: melawan bani Amon
  rationale: Dengan verba לחם, preposisi ב menandai lawan; בְּנֵי עַמּוֹן secara harfiah adalah “anak-anak Amon” dan merupakan sebutan etnis baku.
theological_decisions:
- issue: Hubungan sintaksis antara pengangkatan Yefta dan tindakan berperang
  choice: supaya kita berperang
  alternative: dan marilah kita berperang
  rationale: Kohortatif וְנִלָּחֲמָה dapat dibaca sebagai kelanjutan ajakan atau sebagai maksud pengangkatan. Terjemahan memilih hubungan maksud yang alami dalam konteks, tanpa menambahkan klaim teologis.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Panglima” mempertahankan nuansa militer konteks ini; “bani Amon” dipakai sebagai sebutan etnis yang lazim dan diterangkan dalam catatan kaki.
