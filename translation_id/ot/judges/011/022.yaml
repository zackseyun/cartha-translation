base_translation:
  language: en
  yaml_path: translation/ot/judges/011/022.yaml
  text: So they took possession of all the territory of the Amorites[a], from the Arnon as far as the Jabbok[c][b], and from the wilderness as far as the Jordan.
translation:
  language: id
  text: Maka mereka menguasai seluruh wilayah orang Amori,[a] dari Sungai Arnon sampai Sungai Yabok, dan dari padang belantara sampai Sungai Yordan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “menguasai” juga dapat berarti “memiliki” atau “mewarisi”; dalam konteks ini kata itu mengacu pada pengambilalihan dan penguasaan wilayah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְשׁוּ
  choice: mereka menduduki
  rationale: Dalam konteks penaklukan wilayah, ירשׁ menyatakan tindakan mengambil dan menguasai suatu negeri. “Menduduki” menyampaikan makna aktif itu secara ringkas dan alami.
- source_word: כָּל
  choice: seluruh
  rationale: Mempertahankan cakupan menyeluruh dari kata Ibrani.
- source_word: גְּבוּל
  choice: wilayah
  rationale: Walaupun dapat berarti “batas”, di sini kata ini menunjuk pada daerah yang terletak di dalam batas-batas geografis yang kemudian disebutkan.
- source_word: הָאֱמֹרִי
  choice: orang Amori
  rationale: Bentuk tunggal Ibrani dipakai secara kolektif untuk menyebut kelompok bangsa Amori; “orang Amori” merupakan bentuk kolektif yang alami dalam bahasa Indonesia.
- source_word: מֵאַרְנוֹן
  choice: dari Sungai Arnon
  rationale: Arnon merupakan sungai yang menjadi salah satu batas wilayah; penambahan “Sungai” memperjelas rujukan geografis bagi pembaca modern.
- source_word: וְעַד הַיַּבֹּק
  choice: sampai Sungai Yabok
  rationale: Mengungkapkan ujung lain dari rentang batas wilayah secara lugas dan alami.
- source_word: וּמִן הַמִּדְבָּר
  choice: dari padang belantara
  rationale: מִדְבָּר menunjuk pada kawasan liar atau tandus dan tidak selalu berupa gurun pasir; “padang belantara” mempertahankan cakupan makna itu.
- source_word: וְעַד הַיַּרְדֵּן
  choice: sampai Sungai Yordan
  rationale: Melengkapi pasangan batas geografis kedua dan memperjelas bahwa Yordan adalah sungai.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama geografis diberi penjelas “Sungai” agar mudah dipahami. Tanda koma sebelum penanda catatan kaki mengikuti frasa yang diterangkan.
