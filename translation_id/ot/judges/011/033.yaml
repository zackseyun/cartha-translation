  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּכֵּ֡/ם מֵ/עֲרוֹעֵר֩ וְ/עַד בּוֹאֲ/ךָ֨ מִנִּ֜ית עֶשְׂרִ֣ים עִ֗יר וְ/עַד֙ אָבֵ֣ל כְּרָמִ֔ים מַכָּ֖ה גְּדוֹלָ֣ה מְאֹ֑ד וַ/יִּכָּֽנְעוּ֙ בְּנֵ֣י עַמּ֔וֹן מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/033.yaml
  text: And he struck them from Aroer as far as the entrance to Minnith[a], twenty cities, and as far as Abel-keramim, with a very great slaughter[d][c][b]. So the sons of Ammon were subdued before the sons of Israel.
translation:
  language: id
  text: Ia menggempur mereka dari Aroer sampai ke pintu masuk Minit[a]—dua puluh kota—dan sampai ke Abel-Keramim[b], dengan hantaman yang sangat besar[c]. Demikianlah bani Amon ditundukkan di hadapan bani Israel[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sampai ke Minit” atau “sampai ke pintu masuk Minit”. Ungkapan Ibraninya agak sulit dan dapat menunjuk jalan menuju kota itu atau kota itu sendiri.
    reason: alternative_reading
  - marker: b
    text: Abel-Keramim adalah nama tempat. Unsur-unsur namanya dapat berarti kira-kira “padang rumput kebun-kebun anggur”.
    reason: lexical_alternative
  - marker: c
    text: Secara lebih harfiah, “dengan pukulan yang sangat besar”; dalam konteks perang, ungkapan ini dapat berarti hantaman dahsyat, kekalahan besar, atau pembantaian.
    reason: lexical_alternative
  - marker: d
    text: Secara lebih idiomatis, “orang Amon” dan “orang Israel”. Terjemahan utama mempertahankan ungkapan kekerabatan Ibrani, “bani Amon” dan “bani Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: Ia menggempur mereka
  rationale: Kata נכה menyatakan tindakan menghantam atau menyerang dalam pertempuran. “Menggempur” mempertahankan daya militer ungkapan itu tanpa dengan sendirinya menyatakan bahwa semuanya tewas.
- source_word: מֵעֲרוֹעֵר
  choice: dari Aroer
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: וְעַד בּוֹאֲךָ מִנִּית
  choice: sampai ke jalan masuk Minit
  rationale: בּוֹאֲךָ dalam keterangan geografis ini kemungkinan menunjuk jalan masuk atau arah pendekatan ke kota, tetapi bentuk Ibraninya dapat pula dipahami secara lebih umum sebagai “sampai ke Minit”; ketidakpastian dicatat dalam catatan kaki.
- source_word: עֶשְׂרִים עִיר
  choice: dua puluh kota
  rationale: Padanan langsung dan wajar bagi bilangan serta nomina Ibrani tersebut.
- source_word: וְעַד אָבֵל כְּרָמִים
  choice: dan sampai ke Abel-Keramim
  rationale: Ungkapan ini berfungsi sebagai nama tempat, sehingga ditransliterasikan dan bukan diterjemahkan secara harfiah.
- source_word: מַכָּה גְּדוֹלָה מְאֹד
  choice: kekalahan yang amat besar
  rationale: מַכָּה secara harfiah dapat berarti “pukulan”, tetapi dalam konteks perang juga menunjuk hantaman atau kekalahan besar. Pilihan ini menyampaikan akibat militer tanpa memastikan bahwa yang dimaksud ialah pembantaian.
- source_word: וַיִּכָּנְעוּ
  choice: ditundukkan
  rationale: Bentuk Nifal dari כנע di sini menyatakan bahwa pihak Amon dibuat takluk secara militer.
- source_word: בְּנֵי עַמּוֹן
  choice: bani Amon
  rationale: “Bani Amon” merupakan ungkapan Indonesia yang mapan dan tetap mempertahankan gambaran kekerabatan dalam bahasa Ibrani.
- source_word: מִפְּנֵי בְּנֵי יִשְׂרָאֵל
  choice: di hadapan bani Israel
  rationale: Padanan ini mempertahankan unsur relasional מִפְּנֵי dan kesejajaran dengan “bani Amon”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Menggempur” dipilih agar tindakan militer terasa kuat tetapi tidak menyelesaikan secara berlebihan apakah setiap korban dibunuh. Susunan kalimat dipecah secara sintaktis dengan “sehingga” supaya ungkapan Ibrani tentang pukulan atau kekalahan besar terdengar alami dalam bahasa Indonesia.
