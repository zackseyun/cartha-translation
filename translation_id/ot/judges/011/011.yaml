  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּ֤לֶךְ יִפְתָּח֙ עִם זִקְנֵ֣י גִלְעָ֔ד וַ/יָּשִׂ֨ימוּ הָ/עָ֥ם אוֹת֛/וֹ עֲלֵי/הֶ֖ם לְ/רֹ֣אשׁ וּ/לְ/קָצִ֑ין וַ/יְדַבֵּ֨ר יִפְתָּ֧ח אֶת כָּל דְּבָרָ֛י/ו לִ/פְנֵ֥י יְהוָ֖ה בַּ/מִּצְפָּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/011.yaml
  text: So Jephthah went with the elders of Gilead[a], and the people made him head and commander over them[b]. And Jephthah spoke all his words before Yahweh at Mizpah.
translation:
  language: id
  text: Lalu Yefta pergi bersama para tua-tua Gilead, dan rakyat mengangkat dia menjadi pemimpin dan panglima atas mereka.[a] Di Mizpa, Yefta menyampaikan segala perkataannya di hadapan Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah yang diterjemahkan “panglima” juga dapat berarti “penguasa”, “pejabat”, atau “kepala pasukan”.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “Yefta mengucapkan segala perkataannya di hadapan Yahweh.” Ini mungkin merujuk pada peneguhan khidmat atas hal-hal atau persyaratan yang sebelumnya telah ia nyatakan.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ יִפְתָּח עִם זִקְנֵי גִלְעָד
  choice: Lalu Yefta pergi bersama para tua-tua Gilead
  rationale: Menerjemahkan rangkaian naratif secara wajar; עִם menyatakan penyertaan, dan זִקְנֵי menunjuk para pemimpin masyarakat.
- source_word: וַיָּשִׂימוּ הָעָם אוֹתוֹ עֲלֵיהֶם
  choice: rakyat mengangkat dia ... atas mereka
  rationale: שׂים dengan objek dan עַל dalam konteks ini menyatakan penetapan seseorang pada kedudukan yang berwenang.
- source_word: לְרֹאשׁ וּלְקָצִין
  choice: menjadi pemimpin dan panglima
  rationale: רֹאשׁ merupakan sebutan metaforis bagi pemimpin utama, sedangkan קָצִין dapat berarti penguasa, pejabat, atau panglima; konteks perang mendukung 'panglima' tanpa menghapus cakupan kepemimpinannya.
- source_word: וַיְדַבֵּר ... אֶת כָּל דְּבָרָיו
  choice: menyampaikan segala perkataannya
  rationale: Menjaga keluasan ungkapan Ibrani 'mengucapkan segala perkataannya' tanpa mempersempitnya menjadi doa, sumpah, atau pengulangan syarat-syarat tertentu.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Ungkapan ini menunjukkan tindakan dalam hadirat ilahi dan dapat memiliki nuansa khidmat, perjanjian, atau peradilan.
- source_word: בַּמִּצְפָּה
  choice: Di Mizpa
  rationale: Nama tempat ditransliterasikan dalam bentuk Indonesia yang lazim; preposisi בְּ menyatakan lokasi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks secara langsung memakai nama perjanjian ilahi; 'Yahweh' mempertahankan nama tersebut alih-alih menggantinya dengan gelar.
- issue: Sifat perkataan Yefta di hadapan Yahweh
  choice: menyampaikan segala perkataannya
  alternative: mengulangi semua persyaratannya
  rationale: Frasa Ibrani dapat menunjuk peneguhan khidmat atas hal-hal yang telah dibicarakan, tetapi tidak secara eksplisit membatasi perkataan itu pada persyaratan hukum atau sumpah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. 'Para tua-tua' mempertahankan sebutan sosial-politik Alkitab, sementara 'pemimpin dan panglima' membedakan kepemimpinan umum dari peranan militer. Susunan kalimat terakhir dibuat alami dalam bahasa Indonesia tanpa menghilangkan lokasi dan nuansa hadirat ilahi.
