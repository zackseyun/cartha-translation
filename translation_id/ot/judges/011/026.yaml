  naturalness: Bahasa Indonesia modernnya jelas. Menyatukan klausa temporal dan pertanyaan retoris dalam satu kalimat membuat hubungan argumentatifnya lebih lancar dan lebih dekat dengan struktur sumber.
  terminology: “Kota-kota bawahannya” dan catatan penjelasnya merupakan padanan yang dapat diterima bagi idiom “anak-anak perempuannya,” yakni permukiman/kota yang bergantung pada kota utama. “Merebutnya kembali” sesuai konteks sengketa wilayah, dengan catatan leksikal yang diperbaiki agar bentuk alternatifnya alami dalam bahasa Indonesia.
