    issue: Alternatif “melepaskannya” dalam catatan kaki
    rationale: Untuk נצל bentuk Hifil, “membebaskannya” atau “menyelamatkannya” lebih alami dan lebih dekat secara leksikal daripada “melepaskannya,” yang dalam bahasa Indonesia dapat berarti melepaskan/merelakan.
