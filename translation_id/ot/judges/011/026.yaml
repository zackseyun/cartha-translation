    issue: “selama masa itu” untuk בָּעֵת הַהִיא
    rationale: Ungkapan Ibrani secara harfiah adalah “pada waktu itu.” Dalam konteksnya dapat mencakup masa yang telah disebut, tetapi “selama” secara eksplisit mengubahnya menjadi durasi menyeluruh. “Pada waktu itu” mempertahankan keluwesan demonstratif sumber.
  - severity: low
