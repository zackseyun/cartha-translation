  text: בְּ/שֶׁ֣בֶת יִ֠שְׂרָאֵל בְּ/חֶשְׁבּ֨וֹן וּ/בִ/בְנוֹתֶ֜י/הָ וּ/בְ/עַרְע֣וֹר וּ/בִ/בְנוֹתֶ֗י/הָ וּ/בְ/כָל הֶֽ/עָרִים֙ אֲשֶׁר֙ עַל יְדֵ֣י אַרְנ֔וֹן שְׁלֹ֥שׁ מֵא֖וֹת שָׁנָ֑ה וּ/מַדּ֥וּעַ לֹֽא הִצַּלְתֶּ֖ם בָּ/עֵ֥ת הַ/הִֽיא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/026.yaml
  text: While Israel has lived in Heshbon and its daughter towns[a], and in Aroer and its daughter towns, and in all the cities that are along the Arnon, for three hundred years[b], why did you not recover them during that time?
translation:
  language: id
  text: Selama tiga ratus tahun Israel tinggal di Hesbon dan kota-kota bawahannya[a], di Aroer dan kota-kota bawahannya, serta di semua kota di sepanjang Sungai Arnon, mengapa kalian tidak merebutnya kembali[b] pada waktu itu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak perempuannya”, yaitu permukiman-permukiman lebih kecil yang bergantung pada sebuah kota utama.
    reason: cultural_note
  - marker: b
    text: Dapat juga diterjemahkan “membebaskannya” atau “menyelamatkannya”; dalam konteks ini maksudnya ialah mengambil kembali wilayah tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשֶׁבֶת יִשְׂרָאֵל
  choice: Selama ... Israel tinggal
  rationale: Preposisi ב dengan infinitif konstruk menyatakan keadaan temporal yang berlangsung. Susunan ini alami dalam bahasa Indonesia dan mengaitkan masa tinggal Israel dengan jangka tiga ratus tahun.
- source_word: בְּנוֹתֶיהָ
  choice: kota-kota bawahannya
  rationale: Secara harfiah berarti 'anak-anak perempuannya', tetapi merupakan idiom bagi permukiman lebih kecil yang bergantung pada sebuah kota utama. Pilihan ini mempertahankan hubungan ketergantungan tanpa memakai metafora yang membingungkan.
- source_word: עַרְעוֹר
  choice: Aroer
  rationale: Transliterasi baku nama tempat tersebut dalam bahasa Indonesia.
- source_word: עַל יְדֵי אַרְנוֹן
  choice: di sepanjang Sungai Arnon
  rationale: Ungkapan ini berarti berada di sisi, dekat, atau sepanjang Arnon. Penambahan 'Sungai' memperjelas unsur geografis bagi pembaca modern.
- source_word: שְׁלֹשׁ מֵאוֹת שָׁנָה
  choice: Selama tiga ratus tahun
  rationale: Menyatakan lamanya Israel mendiami kota-kota dan wilayah yang disebutkan.
- source_word: הִצַּלְתֶּם
  choice: merebutnya kembali
  rationale: Bentuk Hifil dari נצל lazimnya berarti 'melepaskan' atau 'menyelamatkan'. Dalam konteks sengketa wilayah, tindakan yang dimaksud ialah mengambil kembali kota-kota atau wilayah tersebut; nuansa leksikal dasarnya dipertahankan dalam catatan kaki.
- source_word: בָּעֵת הַהִיא
  choice: selama masa itu
  rationale: Dalam konteks ini ungkapan tersebut merujuk pada keseluruhan masa tiga ratus tahun, bukan hanya satu titik waktu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Kalimat Ibrani yang panjang dibagi menjadi pernyataan dan pertanyaan retoris agar mudah dipahami, sementara hubungan temporal dan daya argumentasinya tetap dipertahankan. Kata ganti 'kalian' menyatakan bentuk orang kedua jamak dalam sumber.
