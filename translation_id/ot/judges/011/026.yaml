  to: Selama tiga ratus tahun Israel tinggal di Hesbon dan kota-kota bawahannya[a], di Aroer dan kota-kota bawahannya, serta di semua kota di sepanjang Sungai Arnon, mengapa kalian tidak merebutnya kembali[b] pada waktu itu?
