base_translation:
  language: en
  yaml_path: translation/ot/judges/011/038.yaml
  text: And he said[a], “Go.” So he sent her away for two months, and she went, she and her companions, and wept over her virginity on the mountains.
translation:
  language: id
  text: Ia berkata, “Pergilah.” Lalu ia melepas anak perempuannya itu pergi selama dua bulan. Anak perempuan itu pun pergi bersama teman-teman perempuannya dan menangisi keperawanannya[a] di pegunungan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “karena keperawanannya.” Teks Ibrani secara eksplisit menyatakan bahwa keperawanannya adalah pokok ratapannya, suatu rincian penting dalam berbagai penafsiran atas bagian ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵכִי
  choice: Pergilah
  rationale: Bentuk imperatif feminin tunggal dari הלך. “Pergilah” merupakan perintah langsung yang singkat dan wajar dalam bahasa Indonesia.
- source_word: וַיִּשְׁלַח אוֹתָהּ
  choice: ia membiarkan anaknya pergi
  rationale: Dalam konteks ini, שׁלח dengan objek langsung menyatakan pemberian izin atau pelepasan untuk pergi. Pilihan ini lebih alami daripada “mengutusnya” dan tidak menyiratkan pengusiran.
- source_word: שְׁנֵי חֳדָשִׁים
  choice: selama dua bulan
  rationale: Frasa ini menyatakan lamanya waktu yang diberikan kepadanya.
- source_word: וַתֵּלֶךְ הִיא וְרֵעוֹתֶיהָ
  choice: pergilah anaknya itu bersama teman-teman perempuannya
  rationale: Kata ganti eksplisit הִיא memberi sedikit penegasan pada sang anak perempuan. “Anaknya itu” memperjelas rujukan secara alami, sedangkan bentuk feminin jamak רֵעוֹתֶיהָ mendukung “teman-teman perempuannya.”
- source_word: וַתֵּבְךְּ
  choice: ia menangisi
  rationale: בכה berarti menangis atau meratap. Dengan objek yang diperkenalkan oleh עַל, “menangisi” menyampaikan ratapan mengenai sesuatu secara alami dan khidmat.
- source_word: עַל בְּתוּלֶיהָ
  choice: keperawanannya
  rationale: Frasa ini secara eksplisit menjadikan keperawanannya sebagai pokok tangisan. Terjemahan tidak memperluasnya menjadi kematian, keadaan tidak menikah, atau ketiadaan keturunan, sehingga ketegangan penafsiran tetap terpelihara.
- source_word: עַל הֶהָרִים
  choice: di pegunungan
  rationale: Dalam bahasa Indonesia, “di pegunungan” merupakan ungkapan lokasi yang lebih alami daripada “di atas gunung-gunung,” sambil tetap menyampaikan latar kawasan tinggi.
theological_decisions:
- issue: Makna ratapan anak perempuan Yefta atas keperawanannya
  choice: Teks utama menyatakan bahwa ia menangisi keperawanannya tanpa menentukan lebih jauh nasib yang tersirat dalam keseluruhan kisah.
  alternative: Menafsirkan ratapan itu secara khusus sebagai ratapan menjelang kematian, atau sebagai ratapan karena akan hidup tanpa menikah dan tanpa keturunan.
  rationale: Ayat Ibrani ini secara eksplisit menyebut keperawanannya sebagai pokok ratapan, tetapi tidak menyelesaikan perdebatan yang timbul dari konteks yang lebih luas. Terjemahan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa naratif modern, lugas, dan khidmat. “Anaknya” dipakai untuk memperjelas rujukan kepada anak perempuan tokoh yang berbicara tanpa memasukkan nama yang tidak terdapat dalam ayat ini. Pengulangan “pergi” mempertahankan hubungan antara perintah dan pelaksanaannya.
