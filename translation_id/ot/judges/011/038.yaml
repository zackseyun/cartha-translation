  to: Ia berkata, “Pergilah.” Lalu ia melepas anak perempuannya itu pergi selama dua bulan. Anak perempuan itu pun pergi bersama teman-teman perempuannya dan menangisi keperawanannya[a] di pegunungan.
  rationale: Revisi mengganti ungkapan izin pasif dengan “melepas ... pergi,” yang lebih dekat dengan tindakan dalam teks Ibrani namun tetap netral secara penafsiran. Teks tetap menyatakan ratapan atas keperawanan tanpa menyimpulkan apakah konteks lebih luas mengacu pada kematian, hidup selibat, atau keduanya. Catatan kaki mempertahankan alternatif kausal yang relevan bagi preposisi Ibrani.
