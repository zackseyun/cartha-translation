    rationale: Verba שׁלח dengan objek langsung di sini menyatakan bahwa ia melepas/mengirim perempuan itu pergi. “Membiarkan” dapat dipahami hanya sebagai tidak menghalangi, sehingga kurang langsung.
  - severity: low
    issue: Catatan kaki mencantumkan “meratapi keperawanannya” sebagai alternatif, padahal ini terutama variasi stilistis dari teks utama “menangisi keperawanannya.”
    rationale: Alternatif yang lebih relevan ialah kemungkinan hubungan kausal “karena keperawanannya,” sambil mempertahankan bahwa teks Ibrani menyebut keperawanan sebagai fokus ratapan.
