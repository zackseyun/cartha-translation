    rationale: Sufiks tunggal pada תִּירָשֶׁנּוּ tidak menyebut tanah secara eksplisit. Konteks sangat mendukung wilayah/tanah, tetapi terjemahan dan catatan sebaiknya tetap tidak menghapus kemungkinan rujukan kolektif kepada orang Amori.
