  text: וְ/עַתָּ֞ה יְהוָ֣ה אֱלֹהֵ֣י יִשְׂרָאֵ֗ל הוֹרִישׁ֙ אֶת הָ֣/אֱמֹרִ֔י מִ/פְּנֵ֖י עַמּ֣/וֹ יִשְׂרָאֵ֑ל וְ/אַתָּ֖ה תִּירָשֶֽׁ/נּוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/023.yaml
  text: And now Yahweh[a], the God of Israel, has dispossessed the Amorites from before his people Israel; and are you to possess it?
translation:
  language: id
  text: Maka sekarang, Yahweh, Allah Israel, telah mengusir orang Amori dari hadapan umat-Nya, Israel. Dan apakah engkau hendak mengambilnya sebagai milikmu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja Ibrani yang diterjemahkan “mengambilnya sebagai milikmu” juga dapat berarti “memilikinya,” “mewarisinya,” atau “mengambil alihnya.” Objeknya dinyatakan dengan kata ganti tunggal. Dalam konteks ini, kata ganti itu kemungkinan merujuk kepada wilayah yang sebelumnya dikuasai orang Amori, meskipun teks Ibrani tidak menyebut wilayah itu secara eksplisit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Penanda wacana ini mengantar kesimpulan Yefta dari argumen sebelumnya. Dalam bahasa Indonesia, “Sekarang” menyampaikan peralihan retoris itu secara alami; hubungan dengan kalimat sebelumnya tetap tersirat oleh konteks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar, sehingga nama pribadi yang terdapat dalam teks Ibrani tetap dipertahankan.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Bentuk konstruksi ini mengidentifikasi Yahweh sebagai Allah Israel. Ungkapan tersebut baku, ringkas, dan jelas dalam bahasa Indonesia.
- source_word: הוֹרִישׁ
  choice: telah mengusir
  rationale: Bentuk Hifil dari ירש menyatakan bahwa orang Amori dibuat kehilangan penguasaan atas wilayahnya. “Telah mengusir” alami dalam bahasa Indonesia dan sesuai dengan tindakan pemindahan dari wilayah, meski nuansa kepemilikan tanah diteruskan oleh klausa berikutnya.
- source_word: הָאֱמֹרִי
  choice: orang Amori
  rationale: Nomina etnis tunggal dalam bahasa Ibrani dipakai secara kolektif. “Orang Amori” dapat menunjuk kelompok bangsa itu secara wajar dalam bahasa Indonesia.
- source_word: מִפְּנֵי
  choice: dari hadapan
  rationale: Mempertahankan citra spasial ungkapan Ibrani sekaligus tetap dapat dipahami dalam ragam bahasa Indonesia yang bermartabat.
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: umat-Nya Israel
  rationale: Akhiran pronominal merujuk kepada Yahweh, sedangkan “Israel” menjelaskan identitas umat itu. Kapitalisasi “-Nya” mengikuti kebiasaan bahasa Indonesia untuk rujukan kepada Allah.
- source_word: וְאַתָּה
  choice: Lalu, engkaukah
  rationale: Pronomina mandiri bersifat emfatis. Bentuk “engkaukah” mempertahankan tekanan konfrontatif dalam pertanyaan retoris, sedangkan “Lalu” menghubungkannya dengan tindakan Yahweh pada klausa sebelumnya.
- source_word: תִּירָשֶׁנּוּ
  choice: hendak mengambilnya sebagai milikmu
  rationale: Qal ירש dalam konteks tanah dapat berarti memiliki, mewarisi, atau mengambil alih. Frasa ini menyampaikan klaim kepemilikan yang dipersoalkan, sementara “-nya” tidak memaksakan penyebutan eksplisit objek yang hanya dinyatakan melalui sufiks dalam bahasa Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi sebagai nama, tanpa menggantinya dengan gelar atau memilih bentuk transliterasi alternatif.
- issue: Pelaku ilahi dalam pencabutan penguasaan wilayah orang Amori
  choice: Yahweh secara langsung menjadi subjek “telah mengusir”
  alternative: Mengungkapkannya secara lebih tidak langsung, misalnya “orang Amori telah terusir”
  rationale: Struktur Ibrani secara eksplisit menempatkan Yahweh sebagai pelaku. Terjemahan mempertahankan pernyataan teologis teks tanpa memperlunak atau memperluasnya.
- issue: Objek klaim kepemilikan dalam תִּירָשֶׁנּוּ
  choice: Memakai pronomina “-nya” dan menjelaskan kemungkinan makna dalam catatan kaki
  alternative: Menuliskan secara eksplisit “wilayah mereka” atau “negeri itu”
  rationale: Sufiks objek maskulin tunggal dalam bahasa Ibrani tidak menyebut “tanah” secara eksplisit dan dapat berkaitan dengan orang Amori sebagai suatu kesatuan atau, berdasarkan konteks, wilayah yang mereka kuasai. Pronomina menjaga sebagian ambiguitas tersebut.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. “Engkaukah” dipilih untuk mempertahankan penekanan retoris, sedangkan “dari hadapan” sengaja mempertahankan citra Ibrani. Tanda catatan kaki [a] ditempatkan tepat setelah frasa yang diterangkannya.
