  naturalness: “Maka sekarang” memberikan transisi retoris yang lebih wajar daripada “Sekarang” yang segera diikuti “Lalu.” “Apakah engkau hendak ...?” mempertahankan tekanan pertanyaan retoris dengan idiom modern yang lebih lancar. Koma aposisional pada “umat-Nya, Israel” membantu pembacaan.
  terminology: “Yahweh,” “Allah Israel,” “orang Amori,” dan “umat-Nya” tepat dan konsisten. “Mengusir” dapat dipertahankan sebagai padanan alami untuk הוֹרִישׁ dalam konstruksi ini, sementara catatan kaki menjelaskan nuansa penguasaan/pemilikan dalam תִּירָשֶׁנּוּ.
