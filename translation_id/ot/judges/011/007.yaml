  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יִפְתָּח֙ לְ/זִקְנֵ֣י גִלְעָ֔ד הֲ/לֹ֤א אַתֶּם֙ שְׂנֵאתֶ֣ם אוֹתִ֔/י וַ/תְּגָרְשׁ֖וּ/נִי מִ/בֵּ֣ית אָבִ֑/י וּ/מַדּ֜וּעַ בָּאתֶ֤ם אֵלַ/י֙ עַ֔תָּה כַּ/אֲשֶׁ֖ר צַ֥ר לָ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/007.yaml
  text: Jephthah said to the elders of Gilead[a], “Did you not hate me and drive me out from my father’s house? So why have you come to me now, when you are in distress?”
translation:
  language: id
  text: Yefta berkata kepada para tua-tua Gilead, “Bukankah kalian membenci aku dan mengusir aku dari rumah ayahku? Jadi, mengapa sekarang kalian datang kepadaku ketika kalian sedang terdesak[a]?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketika kalian sedang mengalami kesusahan.” Ungkapan Ibrani menggambarkan keadaan terjepit atau tertekan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berkata
  rationale: Bentuk naratif dari אמר secara wajar diterjemahkan dengan verba ujaran umum “berkata”.
- source_word: זִקְנֵי גִלְעָד
  choice: para tua-tua Gilead
  rationale: Bentuk jamak konstruksi ini menunjuk kepada para pemimpin atau sesepuh resmi masyarakat; “para tua-tua” mempertahankan istilah sosial-politik yang lazim dalam terjemahan Alkitab Indonesia.
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Partikel ini memperkenalkan pertanyaan retoris yang mengharapkan persetujuan; “Bukankah” menyampaikan fungsi itu secara alami.
- source_word: שְׂנֵאתֶם
  choice: membenci
  rationale: Verba שׂנא secara langsung berarti membenci; pilihan ini tidak memperlemah permusuhan yang dinyatakan Yefta.
- source_word: וַתְּגָרְשׁוּנִי
  choice: mengusir aku
  rationale: גרשׁ menyatakan pengusiran secara paksa; “mengusir” alami dan mempertahankan kekuatannya.
- source_word: מִבֵּית אָבִי
  choice: dari rumah ayahku
  rationale: Terjemahan ini mempertahankan ungkapan konkret bahasa Ibrani sekaligus memungkinkan cakupan rumah tangga atau keluarga.
- source_word: וּמַדּוּעַ
  choice: Jadi, mengapa
  rationale: Kata penghubung mengaitkan pertanyaan ini sebagai kesimpulan dari tuduhan sebelumnya; “Jadi” menyampaikan hubungan inferensial tersebut.
- source_word: בָּאתֶם אֵלַי עַתָּה
  choice: sekarang kalian datang kepadaku
  rationale: Susunan ini alami dalam bahasa Indonesia dan mempertahankan penekanan temporal עַתָּה, “sekarang”.
- source_word: כַּאֲשֶׁר צַר לָכֶם
  choice: ketika kalian sedang terdesak
  rationale: Ungkapan צַר ל menggambarkan keadaan sempit, tertekan, atau mengalami kesusahan. “Sedang terdesak” cocok dengan ancaman yang dihadapi Gilead tanpa menentukan penyebab lebih jauh.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pronomina “kalian” memperjelas bahwa Yefta berbicara kepada sekelompok tua-tua. Nama יִפְתָּח ditulis “Yefta” sesuai bentuk yang lazim dalam Alkitab bahasa Indonesia.
