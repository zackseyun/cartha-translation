base_translation:
  language: en
  yaml_path: translation/ot/judges/011/001.yaml
  text: Jephthah the Gileadite was a mighty warrior[a], and he was the son of a prostitute[c][b]; and Gilead fathered Jephthah.
translation:
  language: id
  text: Yefta, orang Gilead, adalah seorang pejuang yang gagah perkasa[a]. Ia anak seorang pelacur[b], dan Gilead memperanakkan Yefta[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “seorang yang perkasa dan gagah berani.”'
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: “anak seorang perempuan pelacur.”'
    reason: lexical_alternative
  - marker: c
    text: Gilead di sini adalah nama pribadi ayah Yefta, bukan hanya nama wilayah.
    reason: cultural_note
lexical_decisions:
- source_word: הַגִּלְעָדִי
  choice: orang Gilead itu
  rationale: Bentuk nisbah ini menunjukkan asal atau keterkaitan wilayah Yefta. Ungkapan ini alami dalam bahasa Indonesia dan tetap membedakannya dari Gilead, nama pribadi ayahnya, pada akhir ayat.
- source_word: גִּבּוֹר חַיִל
  choice: seorang pejuang yang gagah perkasa
  rationale: Dalam konteks kisah ini, gabungan kata tersebut terutama menyatakan kekuatan dan kecakapan tempur. Pilihan ini mempertahankan nuansa keberanian dan kemampuan militer dalam bahasa Indonesia modern.
- source_word: בֶּן אִשָּׁה זוֹנָה
  choice: anak seorang pelacur
  rationale: זוֹנָה paling langsung menunjuk kepada perempuan yang menjadi pelacur. Terjemahan ini jelas, modern, dan tidak memperhalus daya sosial ungkapan sumber.
- source_word: וַיּוֹלֶד
  choice: adalah ayah
  rationale: Bentuk Hifil dari ילד di sini menyatakan hubungan biologis bahwa Gilead memperanakkan Yefta. Konstruksi 'adalah ayah' lebih alami daripada 'memperanakkan' dalam narasi Indonesia modern.
- source_word: גִּלְעָד
  choice: Gilead
  rationale: Nama ini menjadi subjek verba yang menyatakan paternitas, sehingga di sini menunjuk kepada seorang laki-laki bernama Gilead, bukan semata-mata wilayah.
- source_word: וְ
  choice: tidak diterjemahkan secara tersendiri pada awal ayat
  rationale: Waw pembuka menghubungkan episode ini dengan konteks sebelumnya. Dalam bahasa Indonesia, kesinambungan itu dapat tersirat tanpa penanda seperti 'Adapun' atau 'Dan', sehingga tidak ditambahkan kata temporal yang tidak ada dalam sumber.
