translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dipecah agar hubungan antarklausa jelas bagi pembaca umum, tanpa menghilangkan pengulangan nama Yefta atau identifikasi Gilead sebagai ayahnya.
