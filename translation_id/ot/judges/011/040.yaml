  text: מִ/יָּמִ֣ים יָמִ֗ימָ/ה תֵּלַ֨כְנָה֙ בְּנ֣וֹת יִשְׂרָאֵ֔ל לְ/תַנּ֕וֹת לְ/בַת יִפְתָּ֖ח הַ/גִּלְעָדִ֑י אַרְבַּ֥עַת יָמִ֖ים בַּ/שָּׁנָֽה׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/040.yaml
  text: From year to year the daughters of Israel would go to commemorate the daughter of Jephthah the Gileadite four days in the year[a].
translation:
  language: id
  text: Dari tahun ke tahun, anak-anak perempuan Israel pergi untuk mengenang anak perempuan Yefta, orang Gilead, selama empat hari setiap tahun.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “meratapi” atau “menceritakan tentang” anak perempuan Yefta. Kata kerja Ibrani yang dipakai di sini jarang ditemukan dan maknanya diperdebatkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיָּמִים יָמִימָה
  choice: Dari tahun ke tahun
  rationale: Ungkapan Ibrani ini menunjukkan kebiasaan yang berulang setiap tahun; terjemahan ini mempertahankan corak idiom aslinya dan tetap jelas dalam bahasa Indonesia.
- source_word: תֵּלַכְנָה
  choice: pergi
  rationale: Bentuk imperfek dalam konteks ini menyatakan tindakan yang menjadi kebiasaan. Bersama frasa 'Dari tahun ke tahun', bentuk 'pergi' secara alami menyampaikan pengulangan tersebut.
- source_word: בְּנוֹת יִשְׂרָאֵל
  choice: anak-anak perempuan Israel
  rationale: Terjemahan ini dekat dengan bentuk Ibrani tanpa menentukan usia atau status perkawinan mereka.
- source_word: לְתַנּוֹת
  choice: untuk mengenang
  rationale: Kata kerja ini jarang dan maknanya diperdebatkan. 'Mengenang' sesuai dengan praktik tahunan dalam konteks ini, sementara kemungkinan 'meratapi' atau 'menceritakan tentang' dipertahankan dalam catatan kaki.
- source_word: לְבַת יִפְתָּח הַגִּלְעָדִי
  choice: anak perempuan Yefta, orang Gilead itu
  rationale: Konstruksi tersebut menunjuk kepada anak perempuan Yefta dan mengidentifikasi Yefta sebagai orang Gilead. Bentuk ini alami dan jelas dalam bahasa Indonesia.
- source_word: אַרְבַּעַת יָמִים בַּשָּׁנָה
  choice: selama empat hari dalam setahun
  rationale: Kata 'selama' memperjelas bahwa empat hari merupakan lamanya peringatan tahunan, tanpa menjauh dari teks Ibrani.
theological_decisions:
- issue: Makna peringatan tahunan bagi anak perempuan Yefta
  choice: Menerjemahkan לְתַנּוֹת sebagai 'mengenang' dalam teks utama.
  alternative: meratapi; menceritakan tentang
  rationale: Kata kerja Ibrani itu langka dan dapat dipahami dalam beberapa cara. Pilihan utama tidak menentukan secara berlebihan nasib anak perempuan Yefta, sedangkan catatan kaki mempertahankan kemungkinan ratapan dan penceritaan agar ketegangan penafsiran tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang lugas dan bermartabat. Nama יִפְתָּח ditulis 'Yefta', bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan langsung sesudah kalimat.
