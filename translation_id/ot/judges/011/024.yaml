  text: הֲ/לֹ֞א אֵ֣ת אֲשֶׁ֧ר יוֹרִֽישְׁ/ךָ֛ כְּמ֥וֹשׁ אֱלֹהֶ֖י/ךָ אוֹת֥/וֹ תִירָ֑שׁ וְ/אֵת֩ כָּל אֲשֶׁ֨ר הוֹרִ֜ישׁ יְהוָ֧ה אֱלֹהֵ֛י/נוּ מִ/פָּנֵ֖י/נוּ אוֹת֥/וֹ נִירָֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/024.yaml
  text: Will you not possess what Chemosh your god causes you to possess? And all that Yahweh our God has dispossessed before us[b][a], that we will possess.
translation:
  language: id
  text: Bukankah kamu akan memiliki apa yang Kamos, allahmu, jadikan milikmu?[a] Dan segala yang telah Yahweh, Allah kami, singkirkan dari hadapan kami, itulah yang akan kami miliki.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “apa yang Kamos, allahmu, buat kamu miliki.” Kata Ibrani yang dipakai dapat mencakup memperoleh wilayah dengan menyingkirkan pemilik atau penghuninya yang terdahulu.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “singkirkan” dan “miliki” berasal dari akar yang sama. Bergantung pada bentuk dan konteksnya, akar ini dapat berarti membuat pihak lain kehilangan milik atau wilayah, maupun mengambil atau memiliki wilayah; dalam konteks tertentu juga dapat diterjemahkan “mewarisi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Menandai pertanyaan retoris yang mengharapkan persetujuan dan terdengar alami dalam bahasa Indonesia.
- source_word: יוֹרִישְׁךָ
  choice: berikan kepadamu untuk kamu miliki
  rationale: Mengungkapkan bentuk kausatif ירשׁ sebagai tindakan yang membuat pihak lain memperoleh wilayah, sambil menjaga kaitannya dengan kata kerja 'miliki' berikutnya.
- source_word: כְּמוֹשׁ אֱלֹהֶיךָ
  choice: Kamos, allahmu
  rationale: Nama ilahi ditransliterasikan dalam bentuk Indonesia yang lazim; 'allahmu' dipertahankan sebagai bagian dari ujaran diplomatis Yefta tanpa menyatakan pengesahan narator.
- source_word: תִירָשׁ
  choice: akan memiliki
  rationale: Dalam konteks sengketa wilayah, ירשׁ menunjuk pada memperoleh dan menguasai tanah; 'memiliki' menjaga pengulangan leksikal dengan klausa penutup.
- source_word: הוֹרִישׁ
  choice: telah ... rebut
  rationale: Bentuk Hifil menyiratkan perolehan wilayah melalui penyingkiran pemilik atau penghuni sebelumnya. 'Rebut' menyampaikan dimensi konflik secara alami, tanpa harus menambahkan objek berupa bangsa yang tidak dinyatakan dalam teks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama pribadi ilahi dipertahankan sebagai Yahweh, bukan diganti dengan gelar.
- source_word: מִפָּנֵינוּ
  choice: dari hadapan kami
  rationale: Mempertahankan gambaran spasial idiom Ibrani dan menunjukkan bahwa pihak sebelumnya disingkirkan dari depan Israel.
- source_word: נִירָשׁ
  choice: akan kami miliki
  rationale: Mempertahankan bentuk orang pertama jamak dan pengulangan ירשׁ dalam pengertian penguasaan wilayah.
theological_decisions:
- issue: Penyebutan Kamos sebagai 'allahmu' dalam perkataan Yefta
  choice: Diterjemahkan langsung sebagai bagian dari argumen diplomatis-retoris Yefta.
  alternative: Menambahkan tanda petik atau keterangan yang menyangkal keilahian Kamos.
  rationale: Teks Ibrani tidak menambahkan penyangkalan atau ironi eksplisit. Terjemahan mempertahankan retorika pembicara tanpa menyiratkan bahwa narator mengakui Kamos sebagai ilah yang sungguh ada atau berkuasa.
- issue: Hubungan tindakan ilahi dengan perebutan wilayah
  choice: Mempertahankan bahasa kausatif dan konflik melalui 'berikan ... untuk kamu miliki' serta 'rebut'.
  alternative: Menyeragamkan semuanya sebagai 'wariskan' atau 'berikan'.
  rationale: Akar ירשׁ dapat mencakup memperoleh milik sekaligus menyingkirkan penghuni sebelumnya. Variasi ini menjaga kedua sisi makna dalam konteks persengketaan wilayah.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk tunggal 'kamu' dipakai karena perkataan diarahkan kepada raja Amon. 'Demikian juga' membuat kesejajaran argumentatif kedua klausa alami tanpa menghapus kontras antara Kamos dan Yahweh.
