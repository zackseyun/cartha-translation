  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אָֽנֹכִי֙ לֹֽא חָטָ֣אתִי לָ֔/ךְ וְ/אַתָּ֞ה עֹשֶׂ֥ה אִתִּ֛/י רָעָ֖ה לְ/הִלָּ֣חֶם בִּ֑/י יִשְׁפֹּ֨ט יְהוָ֤ה הַ/שֹּׁפֵט֙ הַ/יּ֔וֹם בֵּ֚ין בְּנֵ֣י יִשְׂרָאֵ֔ל וּ/בֵ֖ין בְּנֵ֥י עַמּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/027.yaml
  text: I have not sinned against you[a], but you are doing me wrong by making war against me. May Yahweh, the Judge, judge today between the sons of Israel and the sons of Ammon.
translation:
  language: id
  text: Aku tidak berdosa terhadapmu, tetapi engkau berbuat jahat kepadaku dengan memerangi aku. Biarlah Yahweh, Sang Hakim, menghakimi hari ini antara bani Israel dan bani Amon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “antara orang Israel dan orang Amon.” Secara harfiah, teks Ibrani berbunyi, “antara anak-anak Israel dan anak-anak Amon.”
    reason: Menjelaskan bentuk korporatif בְּנֵי dan memberikan padanan Indonesia yang lebih langsung.
lexical_decisions:
- source_word: חָטָאתִי
  choice: tidak berdosa
  rationale: Kata חטא lazim berarti “berdosa” atau “berbuat salah.” Dalam konteks hukum-diplomatik ini, “tidak berdosa terhadapmu” mempertahankan bobot moral dan yudisial ungkapan Ibrani.
- source_word: לָךְ
  choice: terhadapmu
  rationale: Dengan חטא, preposisi ל menyatakan pihak yang menjadi sasaran pelanggaran; “terhadapmu” adalah ungkapan Indonesia yang alami.
- source_word: עֹשֶׂה אִתִּי רָעָה
  choice: berbuat jahat kepadaku
  rationale: Ungkapan ini secara dekat berarti melakukan kejahatan atau keburukan terhadap seseorang. Pilihan ini mempertahankan kontras moral dengan “tidak berdosa” tanpa mengurangi daya tuduhnya.
- source_word: לְהִלָּחֶם בִּי
  choice: dengan memerangi aku
  rationale: Infinitif ini menjelaskan cara kejahatan itu dilakukan. “Memerangi” sesuai dengan konteks konflik antarkelompok dan lebih tepat daripada sekadar “melawan.”
- source_word: יִשְׁפֹּט ... הַשֹּׁפֵט
  choice: Biarlah ... Sang Hakim, menghakimi
  rationale: Pengulangan akar שפט dipertahankan melalui “Hakim” dan “menghakimi.” “Biarlah” menyampaikan nuansa permohonan atau seruan agar keputusan diberikan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: הַיּוֹם
  choice: pada hari ini
  rationale: Ungkapan ini alami dalam pernyataan resmi dan mempertahankan kesegeraan seruan tersebut.
- source_word: בֵּין בְּנֵי יִשְׂרָאֵל וּבֵין בְּנֵי עַמּוֹן
  choice: antara bani Israel dan bani Amon
  rationale: “Bani” mempertahankan bentuk korporatif “anak-anak/keturunan” dalam בְּנֵי, tetapi tetap ringkas, bermartabat, dan lazim dalam bahasa Indonesia Alkitabiah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi tanpa menggantinya dengan gelar.
- issue: Daya moral-yudisial חטא dan רעה
  choice: “tidak berdosa” dan “berbuat jahat”
  alternative: “tidak bersalah” dan “berbuat tidak adil”
  rationale: Pilihan utama mempertahankan bahasa moral yang kuat dalam sumber sekaligus tetap sesuai dengan konteks sengketa hukum dan perang.
- issue: Ungkapan korporatif maskulin בְּנֵי
  choice: bani Israel ... bani Amon
  alternative: orang Israel ... orang Amon
  rationale: “Bani” mempertahankan citra keturunan korporatif pada teks Ibrani tanpa menyatakan bahwa hanya laki-laki yang dimaksud.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dengan sapaan tunggal “aku–engkau,” sesuai dengan pidato resmi Yefta kepada raja Amon. Pengulangan “Hakim–menghakimi” sengaja dipertahankan. Penanda catatan kaki [a] dicantumkan dalam teks utama.
