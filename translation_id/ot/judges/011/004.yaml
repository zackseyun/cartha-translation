lexical_decisions:
- source_word: וַיְהִי מִיָּמִים
  choice: Beberapa waktu kemudian
  rationale: Ungkapan Ibrani ini menandai berlalunya suatu jangka waktu. Pilihan ini alami dalam bahasa Indonesia modern dan mempertahankan fungsi temporalnya.
- source_word: וַיִּלָּחֲמוּ
  choice: berperang
  rationale: Bentuk dari לחם dalam konteks ini menyatakan keterlibatan dalam peperangan; 'berperang' merupakan padanan Indonesia yang jelas dan wajar.
- source_word: בְּנֵי עַמּוֹן
  choice: bani Amon
  rationale: Ungkapan ini merupakan sebutan etnis bagi orang-orang Amon. 'Bani Amon' adalah bentuk yang dikenal dalam ragam Alkitab Indonesia, tetap ringkas, dan cukup mudah dipahami.
- source_word: עִם יִשְׂרָאֵל
  choice: melawan Israel
  rationale: Walaupun עִם secara dasar berarti 'dengan', bersama kata kerja perang ungkapan ini menandai pihak lawan; 'melawan Israel' menyampaikan relasi tersebut secara idiomatis.
