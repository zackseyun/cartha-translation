  yaml_path: translation/ot/judges/011/028.yaml
  text: But the king of the Ammonites did not listen to the words of Jephthah that he sent to him.
translation:
  language: id
  text: Namun raja bani Amon tidak mengindahkan perkataan Yefta yang dikirimkannya kepada raja itu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹא שָׁמַע
  choice: Namun, ... tidak mengindahkan
  rationale: Dalam konteks diplomatik ini, שׁמע berarti bukan sekadar tidak mendengar, melainkan tidak mau memperhatikan atau menerima pesan. 'Namun' menyatakan pertentangan dengan penyampaian pesan sebelumnya.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: raja bani Amon
  rationale: '''Bani Amon'' merupakan sebutan yang ringkas, lazim, dan bermartabat bagi kelompok keturunan Amon.'
- source_word: אֶל דִּבְרֵי יִפְתָּח
  choice: perkataan Yefta
  rationale: Mempertahankan bentuk jamak kolektif דִּבְרֵי secara alami sebagai 'perkataan', yakni isi pesan Yefta.
- source_word: אֲשֶׁר שָׁלַח אֵלָיו
  choice: yang disampaikannya kepadanya
  rationale: 'שׁלח secara harfiah berarti ''mengirim'', tetapi objeknya adalah perkataan/pesan; ''disampaikan'' menghasilkan bahasa Indonesia yang alami. Akhiran orang ketiga tetap dibiarkan mengikuti rujukan kontekstual: Yefta menyampaikan perkataan itu kepada raja.'
