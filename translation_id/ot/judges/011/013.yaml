  text: וַ/יֹּאמֶר֩ מֶ֨לֶךְ בְּנֵי עַמּ֜וֹן אֶל מַלְאֲכֵ֣י יִפְתָּ֗ח כִּֽי לָקַ֨ח יִשְׂרָאֵ֤ל אֶת אַרְצִ/י֙ בַּ/עֲלוֹת֣/וֹ מִ/מִּצְרַ֔יִם מֵ/אַרְנ֥וֹן וְ/עַד הַ/יַּבֹּ֖ק וְ/עַד הַ/יַּרְדֵּ֑ן וְ/עַתָּ֕ה הָשִׁ֥יבָ/ה אֶתְ/הֶ֖ן בְּ/שָׁלֽוֹם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/013.yaml
  text: And the king of the Ammonites said to Jephthah’s messengers, “Because Israel took my land when it came up from Egypt, from the Arnon as far as the Jabbok and as far as the Jordan, now restore them peacefully.”
translation:
  language: id
  text: Raja bani Amon berkata kepada para utusan Yefta, “Sebab Israel telah mengambil tanahku ketika mereka keluar dari Mesir, dari Sungai Arnon sampai Sungai Yabok dan sampai Sungai Yordan. Sekarang, kembalikanlah wilayah-wilayah itu dengan damai.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: telah ... Karena itu
  rationale: Dalam jawaban raja bani Amon, partikel ini memperkenalkan alasan permusuhannya. Susunan dipecah secara alami dalam bahasa Indonesia tanpa mengubah hubungan sebab-akibat.
- source_word: אֶת־אַרְצִי
  choice: negeriku
  rationale: Bentuk tunggal dengan sufiks orang pertama berarti ‘negeriku’ atau ‘tanahku’; ‘negeriku’ sesuai dengan klaim teritorial seorang raja.
- source_word: בַּעֲלוֹתוֹ מִמִּצְרַיִם
  choice: ketika mereka keluar dari Mesir
  rationale: Secara harfiah subjek pronominalnya tunggal, merujuk pada Israel sebagai bangsa kolektif. Bahasa Indonesia secara alami memakai ‘mereka’ untuk bangsa Israel.
- source_word: מֵאַרְנוֹן וְעַד הַיַּבֹּק וְעַד הַיַּרְדֵּן
  choice: mulai dari Sungai Arnon sampai Sungai Yabok dan sampai Sungai Yordan
  rationale: Nama-nama ini menunjuk batas-batas sungai; penambahan ‘Sungai’ memperjelas referennya bagi pembaca modern.
- source_word: הָשִׁיבָה אֶתְהֶן
  choice: kembalikanlah seluruh wilayah itu
  rationale: Pronomina objek feminin jamak tampaknya merujuk pada kawasan atau bagian-bagian tanah yang baru disebutkan. Ungkapan ini mempertahankan arti jamak secara wajar tanpa memakai ‘mereka’ untuk wilayah.
- source_word: בְּשָׁלוֹם
  choice: dengan damai
  rationale: Mempertahankan tawaran agar wilayah itu diserahkan tanpa peperangan, sekaligus tidak memperluas makna menjadi formula perjanjian tertentu.
theological_decisions:
- issue: Status klaim raja bani Amon atas wilayah tersebut
  choice: Diterjemahkan sebagai klaim langsung dalam tuturannya, tanpa menegaskan bahwa klaim itu benar.
  alternative: Menambahkan ungkapan seperti ‘yang menurut pengakuannya adalah negerinya’.
  rationale: Teks menyajikan tuduhan raja tersebut dan konteks berikutnya akan menanggapinya; terjemahan tidak boleh mengesahkan ataupun menyangkal klaim itu secara tersirat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. ‘Bani Amon’ dipakai sebagai sebutan bangsa yang lazim dalam register Alkitab Indonesia; ‘para utusan’ menerjemahkan bentuk jamak. Kalimat sumber yang panjang dibagi menjadi dua kalimat demi kejelasan, sambil mempertahankan alur alasan menuju tuntutan.
