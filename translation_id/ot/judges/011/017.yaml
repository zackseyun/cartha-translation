  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֣ח יִשְׂרָאֵ֣ל מַלְאָכִ֣ים אֶל מֶלֶךְ֩ אֱד֨וֹם לֵ/אמֹ֜ר אֶעְבְּרָה נָּ֣א בְ/אַרְצֶ֗/ךָ וְ/לֹ֤א שָׁמַע֙ מֶ֣לֶךְ אֱד֔וֹם וְ/גַ֨ם אֶל מֶ֧לֶךְ מוֹאָ֛ב שָׁלַ֖ח וְ/לֹ֣א אָבָ֑ה וַ/יֵּ֥שֶׁב יִשְׂרָאֵ֖ל בְּ/קָדֵֽשׁ׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/017.yaml
  text: Then Israel sent messengers to the king of Edom[a], saying, ‘Please let us pass through your land,’ but the king of Edom did not listen. And he also sent to the king of Moab, but he was unwilling[b], so Israel remained at Kadesh.
translation:
  language: id
  text: Kemudian Israel mengirim para utusan kepada raja Edom dengan berkata, “Izinkanlah aku melewati negerimu.”[a] Namun, raja Edom tidak mau mendengarkan. Israel juga mengirim utusan kepada raja Moab, tetapi ia tidak bersedia.[b] Lalu Israel tetap tinggal di Kadesh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Izinkanlah aku melewati.” Israel berbicara sebagai satu kesatuan; menurut makna kolektifnya dapat juga diterjemahkan, “Izinkanlah kami melewati.”
    reason: lexical_alternative
  - marker: b
    text: Atau “ia tidak menyetujuinya” atau “ia menolak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengirim
  rationale: Bentuk naratif dari שׁלח paling wajar diterjemahkan dengan verba lampau kontekstual 'mengirim'; bahasa Indonesia tidak perlu menandai kala pada bentuk verba.
- source_word: מַלְאָכִים
  choice: utusan-utusan
  rationale: Dalam konteks diplomatik manusia, מַלְאָכִים berarti para utusan, bukan malaikat.
- source_word: מֶלֶךְ אֱדוֹם
  choice: raja Edom
  rationale: Terjemahan langsung dan alami untuk hubungan konstruksi yang menyatakan gelar penguasa Edom.
- source_word: לֵאמֹר
  choice: untuk berkata
  rationale: Mengantar perkataan langsung secara alami sekaligus mempertahankan fungsi bentuk Ibrani.
- source_word: אֶעְבְּרָה נָּא
  choice: Izinkanlah aku melewati
  rationale: Bentuk kohortatif orang pertama tunggal dengan נָא menyatakan permohonan sopan. Bentuk tunggal dipertahankan karena Israel berbicara secara korporatif sebagai satu kesatuan.
- source_word: בְאַרְצֶךָ
  choice: negerimu
  rationale: Dengan verba עבר, frasa ini secara idiomatis berarti melewati wilayah atau negeri milik lawan bicara.
- source_word: וְלֹא שָׁמַע
  choice: tidak mau mendengarkan
  rationale: שׁמע di sini berarti mengindahkan atau menanggapi dengan baik, bukan sekadar mendengar secara indrawi; 'tidak mau mendengarkan' menyampaikan penolakan tanpa memperinci tindakan lebih jauh.
- source_word: וְגַם אֶל מֶלֶךְ מוֹאָב שָׁלַח
  choice: Israel juga mengirim utusan kepada raja Moab
  rationale: Subjek tersirat diperjelas sebagai Israel agar rujukan tidak rancu dalam bahasa Indonesia; objek 'utusan' dipasok dari klausa sebelumnya sebagaimana dipahami dalam sumber.
- source_word: וְלֹא אָבָה
  choice: tetapi ia tidak bersedia
  rationale: אָבָה menunjuk pada kesediaan atau persetujuan. 'Tidak bersedia' dekat dengan arti leksikal dan tidak sekeras 'menolak'.
- source_word: וַיֵּשֶׁב
  choice: tetap tinggal
  rationale: Dalam konteks perjalanan, ungkapan ini menyatakan bahwa Israel tetap berada di tempat itu, tanpa menyiratkan permukiman permanen.
- source_word: בְּקָדֵשׁ
  choice: di Kadesh
  rationale: Preposisi lokasi yang alami dalam bahasa Indonesia untuk nama tempat.
theological_decisions:
- issue: Israel memakai bentuk orang pertama tunggal dalam permohonannya
  choice: Mempertahankan 'aku' dalam teks utama
  alternative: Menggunakan 'kami' karena yang dimaksud adalah bangsa Israel
  rationale: Bentuk אֶעְבְּרָה adalah orang pertama tunggal. Terjemahan mempertahankan gambaran Israel sebagai satu kesatuan korporatif, sedangkan catatan menjelaskan kemungkinan terjemahan berdasarkan makna kolektif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat dan mudah dipahami. Pengulangan 'raja Edom' dipertahankan, sedangkan subjek Israel pada pengiriman kedua diperjelas untuk menghindari ambiguitas pronominal yang tidak alami.
