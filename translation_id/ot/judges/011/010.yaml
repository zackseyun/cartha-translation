  text: וַ/יֹּאמְר֥וּ זִקְנֵֽי גִלְעָ֖ד אֶל יִפְתָּ֑ח יְהוָ֗ה יִהְיֶ֤ה שֹׁמֵ֨עַ֙ בֵּֽינוֹתֵ֔י/נוּ אִם לֹ֥א כִ/דְבָרְ/ךָ֖ כֵּ֥ן נַעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/010.yaml
  text: Then the elders of Gilead said to Jephthah[a], “Yahweh will be witness between us if we do not do according to your word.”
translation:
  language: id
  text: Lalu para tua-tua Gilead berkata kepada Yefta, “Yahweh akan menjadi saksi[a] di antara kita jika kami tidak melakukan seperti yang kaukatakan.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “akan mendengar di antara kita”; dalam konteks ini, “mendengar” menyatakan peran sebagai saksi atau hakim di antara kedua pihak.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: Lalu ... berkata
  rationale: Waw naratif melanjutkan urutan peristiwa; “lalu” wajar dalam narasi Indonesia modern.
- source_word: זִקְנֵי גִלְעָד
  choice: para tua-tua Gilead
  rationale: Frasa konstruksi ini menunjuk kepada para pemimpin masyarakat Gilead; “para tua-tua” mempertahankan istilah sosial-politik teks sumber.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: יִהְיֶה שֹׁמֵעַ בֵּינוֹתֵינוּ
  choice: akan menjadi saksi di antara kita
  rationale: Secara harfiah berarti ‘akan menjadi yang mendengar di antara kita’; dalam konteks sumpah, mendengar di antara kedua pihak berfungsi sebagai saksi atau hakim. Pilihan ini menyampaikan fungsi idiomatisnya dengan bahasa Indonesia yang alami.
- source_word: אִם לֹא
  choice: jika ... tidak
  rationale: Ungkapan ini memperkenalkan syarat negatif yang terkait dengan ikrar para tua-tua.
- source_word: כִדְבָרְךָ כֵּן נַעֲשֶׂה
  choice: kami tidak melakukan seperti yang kaukatakan
  rationale: Gabungan frasa itu berarti melakukan sesuai dengan perkataan atau ketentuan Yefta. Bentuk “kaukatakan” jelas, ringkas, dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian ilahi secara langsung; transliterasi mempertahankannya sebagai nama diri.
- issue: Peran Yahweh dalam rumusan ikrar
  choice: akan menjadi saksi di antara kita
  alternative: akan mendengar di antara kita
  rationale: Terjemahan utama menyatakan fungsi forensik ungkapan Ibrani tanpa menentukan secara berlebihan apakah perannya hanya sebagai saksi atau juga sebagai hakim; arti harfiahnya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Para tua-tua” dipertahankan sebagai sebutan tradisional yang masih mudah dipahami bagi para pemimpin masyarakat; pronomina “kami” menandai para tua-tua sebagai pihak yang berbicara kepada Yefta.
