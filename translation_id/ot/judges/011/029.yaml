base_translation:
  language: en
  yaml_path: translation/ot/judges/011/029.yaml
  text: Then the Spirit of Yahweh came upon Jephthah[a], and he passed through Gilead and Manasseh. He passed through Mizpah of Gilead, and from Mizpah of Gilead he passed on to the Ammonites.
translation:
  language: id
  text: Kemudian Roh Yahweh menghinggapi Yefta. Ia melintasi Gilead dan Manasye, lalu melintasi Mizpa-Gilead. Dari Mizpa-Gilead ia maju ke arah bani Amon.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “ia menyeberang ke tempat bani Amon.” Kata kerja Ibrani dapat berarti melintas, menyeberang, atau maju terus, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי עַל יִפְתָּח רוּחַ יְהוָה
  choice: Roh Yahweh datang atas Yefta
  rationale: Ungkapan ini menyatakan datangnya Roh Yahweh atas Yefta untuk memperlengkapinya dalam konteks narasi para hakim. Frasa “datang atas” mempertahankan daya peristiwa verba Ibrani dan tidak menambahkan rincian yang tidak dinyatakan teks.
- source_word: וַיַּעֲבֹר אֶת הַגִּלְעָד וְאֶת מְנַשֶּׁה
  choice: Ia melintasi Gilead dan Manasye
  rationale: Dengan wilayah sebagai objek langsung, עבר paling wajar menunjukkan gerak melintasi atau melewati daerah-daerah tersebut.
- source_word: מִצְפֵּה גִלְעָד
  choice: Mizpa-Gilead
  rationale: Bentuk ini diperlakukan sebagai nama tempat, bukan diterjemahkan menurut arti dasar מצפה, yaitu tempat pengintaian atau menara jaga.
- source_word: עָבַר בְּנֵי עַמּוֹן
  choice: ia bergerak menuju bani Amon
  rationale: Dalam konteks perjalanan menuju konflik, עבר menunjukkan gerak selanjutnya ke arah bani Amon. “Bergerak menuju” menjaga unsur gerak tanpa menyatakan bahwa serangan langsung sudah dimulai.
- source_word: בְּנֵי עַמּוֹן
  choice: bani Amon
  rationale: Ungkapan harfiah “anak-anak Amon” menunjuk pada bangsa Amon; “bani Amon” merupakan bentuk Indonesia yang ringkas dan tetap dekat dengan ungkapan sumber.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks menyebut nama perjanjian ilahi secara langsung. Bentuk “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Makna רוּחַ יְהוָה dalam pengalaman Yefta
  choice: Roh Yahweh datang atas Yefta
  alternative: angin atau napas Yahweh; Roh Yahweh menguasai Yefta
  rationale: Dalam konteks kitab Hakim-Hakim, ungkapan ini menandai pemberdayaan ilahi. Terjemahan mempertahankan hal itu tanpa memperluasnya menjadi klaim bahwa Roh mengendalikan seluruh tindakan Yefta selanjutnya.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Nama-nama mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia: Yefta, Gilead, Manasye, Mizpa-Gilead, dan Amon. Pengulangan gerak dalam teks sumber dipertahankan agar urutan perjalanan tetap jelas.'
