- from: Lalu Israel mengutus utusan-utusan[a] kepada Sihon, raja orang Amori, raja Hesybon. Israel berkata kepadanya, “Izinkanlah kiranya kami melewati negerimu menuju tempatku.”[b]
  to: Lalu Israel mengutus para utusan[a] kepada Sihon, raja orang Amori, raja Hesybon, dan Israel berkata kepadanya, “Izinkanlah kami kiranya melintasi negerimu menuju tempatku.”[b]
