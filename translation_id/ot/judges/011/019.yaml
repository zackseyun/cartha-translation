  text: וַ/יִּשְׁלַ֤ח יִשְׂרָאֵל֙ מַלְאָכִ֔ים אֶל סִיח֥וֹן מֶֽלֶךְ הָ/אֱמֹרִ֖י מֶ֣לֶךְ חֶשְׁבּ֑וֹן וַ/יֹּ֤אמֶר ל/וֹ֙ יִשְׂרָאֵ֔ל נַעְבְּרָה נָּ֥א בְ/אַרְצְ/ךָ֖ עַד מְקוֹמִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/019.yaml
  text: Then Israel sent messengers to Sihon king of the Amorites[a], king of Heshbon, and Israel said to him[b], “Please let us pass through your land to our place.”
translation:
  language: id
  text: Lalu Israel mengutus para utusan[a] kepada Sihon, raja orang Amori, raja Hesybon, dan Israel berkata kepadanya, “Izinkanlah kami kiranya melintasi negerimu menuju tempatku.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam konteks diplomatik ini, “utusan” juga dapat diterjemahkan “duta.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tempatku.” Israel berbicara sebagai satu pribadi kolektif, meskipun sebelumnya memakai bentuk jamak “kami.” Bandingkan permintaan sejajar dalam Bilangan 21:22.
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: mengutus
  rationale: Bentuk naratif dari שׁלח menyatakan tindakan mengirim; “mengutus” wajar untuk wakil resmi dalam konteks diplomatik.
- source_word: מַלְאָכִים
  choice: utusan-utusan
  rationale: Dalam konteks ini kata tersebut menunjuk kepada wakil manusia, bukan makhluk surgawi; bentuk ulang menyatakan jamak secara jelas.
- source_word: סִיחוֹן
  choice: Sihon
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: raja orang Amori
  rationale: Mempertahankan gelar dan penanda etnis dalam frasa Ibrani tanpa mengubahnya menjadi sebutan denominatif.
- source_word: מֶלֶךְ חֶשְׁבּוֹן
  choice: raja Hesybon
  rationale: Gelar kedua yang berdiri sebagai aposisi dipertahankan untuk mengidentifikasi wilayah kekuasaan Sihon.
- source_word: וַיֹּאמֶר לוֹ יִשְׂרָאֵל
  choice: Israel berkata kepadanya
  rationale: Nama “Israel” yang diulang secara eksplisit dalam bahasa Ibrani dipertahankan, meskipun bahasa Indonesia dapat menggantinya dengan pronomina.
- source_word: נַעְבְּרָה נָּא
  choice: Izinkanlah kiranya kami melewati
  rationale: Bentuk kohortatif dengan נָא menyampaikan permohonan sopan; “izinkanlah kiranya” menjaga nuansa permohonan dengan ragam yang bermartabat.
- source_word: בְאַרְצְךָ
  choice: melewati negerimu
  rationale: Dengan verba עבר, preposisi ini menyatakan gerak melintasi wilayah; “melewati negerimu” alami dan tepat dalam bahasa Indonesia.
- source_word: עַד מְקוֹמִי
  choice: menuju tempatku
  rationale: Teks WLC memakai bentuk orang pertama tunggal, “tempatku.” Terjemahan mempertahankannya sebagai ujaran Israel yang dipersonifikasikan secara kolektif, alih-alih menyelaraskannya menjadi “tempat kami.”
theological_decisions:
- issue: Peralihan antara “kami” dan “tempatku” dalam ujaran Israel
  choice: Mempertahankan “kami” untuk kohortatif jamak dan “tempatku” untuk sufiks tunggal dalam teks Ibrani
  alternative: “menuju tempat kami”
  rationale: Peralihan jumlah gramatikal terdapat dalam sumber dan mungkin mencerminkan Israel sebagai kelompok sekaligus pribadi kolektif. Menyeragamkannya akan meniadakan ketegangan asli tanpa dasar tekstual.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan aposisional “raja orang Amori, raja Hesybon” mempertahankan struktur identifikasi Ibrani. Partikel “kiranya” dipakai untuk menandai permohonan sopan tanpa membuat kalimat terlalu percakapan. Semua penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
