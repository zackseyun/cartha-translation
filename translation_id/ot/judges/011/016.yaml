id: JDG.11.16
reference: Judges 11:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֖י בַּ/עֲלוֹתָ֣/ם מִ/מִּצְרָ֑יִם וַ/יֵּ֨לֶךְ יִשְׂרָאֵ֤ל בַּ/מִּדְבָּר֙ עַד יַם ס֔וּף וַ/יָּבֹ֖א קָדֵֽשָׁ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/016.yaml
  text: For when they came up from Egypt[a], Israel went through the wilderness as far as the Red Sea and came to Kadesh.
translation:
  language: id
  text: Sebab, ketika mereka keluar dari Mesir, Israel berjalan melalui padang belantara sampai ke Laut Teberau[a], lalu tiba di Kadesh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara tradisional disebut “Laut Merah”; nama Ibraninya juga dapat diterjemahkan “Laut Gelagah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan latar atau alasan bagi penjelasan historis Yefta; 'Sebab' mempertahankan hubungan wacana dengan ayat sebelumnya.
- source_word: בַּעֲלוֹתָם מִמִּצְרָיִם
  choice: ketika mereka keluar dari Mesir
  rationale: Konstruksi ב dengan infinitif עלה dan sufiks berfungsi temporal. 'Keluar dari Mesir' mengungkapkan idiom eksodus secara alami dalam bahasa Indonesia, meskipun secara harfiah berarti 'naik dari Mesir'.
- source_word: וַיֵּלֶךְ יִשְׂרָאֵל בַּמִּדְבָּר
  choice: Israel berjalan melalui padang belantara
  rationale: הלך menyatakan gerak atau perjalanan, sedangkan בַּמִּדְבָּר menunjukkan kawasan yang dilalui. 'Berjalan melalui padang belantara' dekat dengan bentuk Ibrani dan tetap alami.
- source_word: עַד יַם סוּף
  choice: sampai ke Laut Teberau
  rationale: עַד menyatakan batas atau jangkauan. יַם סוּף secara leksikal berkaitan dengan tumbuhan teberau; pilihan ini mempertahankan bentuk nama yang lebih dekat dengan unsur Ibraninya, sementara identifikasi tradisional dicatat dalam catatan kaki.
- source_word: וַיָּבֹא קָדֵשָׁה
  choice: lalu tiba di Kadesh
  rationale: בוא dapat berarti datang atau tiba, dan akhiran arah pada קָדֵשָׁה menunjukkan gerak menuju Kadesh. 'Tiba di' merupakan ungkapan Indonesia yang alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Padang belantara' dipilih untuk מִדְבָּר agar menunjukkan wilayah liar yang tidak dihuni tanpa mengharuskan gambaran gurun pasir. Pronomina jamak 'mereka' mengikuti sufiks Ibrani sebelum subjek kolektif 'Israel' disebutkan.
