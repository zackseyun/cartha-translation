  source_fidelity: 'Teks Indonesia dengan setia mencerminkan struktur dan isi Ibrani: כִּי sebagai penghubung penjelas, konstruksi temporal ''ketika mereka keluar dari Mesir,'' perjalanan Israel di padang belantara hingga ים סוף, dan kedatangan di Kadesh. ''Keluar dari Mesir'' adalah padanan idiomatis yang aman bagi עלה tanpa mengubah makna.'
