  text: Then Jephthah again sent messengers to the king of the Ammonites[a].
translation:
  language: id
  text: Kemudian Yefta kembali mengutus para utusan kepada raja bani Amon[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “raja anak-anak Amon,” yaitu raja bangsa Amon.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף עוֹד
  choice: Kemudian ... kembali
  rationale: Ungkapan ini menyatakan pengulangan atau kelanjutan tindakan. 'Kembali' menyampaikan arti 'lagi', sedangkan 'Kemudian' secara alami menandai kelanjutan alur narasi.
- source_word: יִפְתָּח
  choice: Yefta
  rationale: Nama orang ditransliterasikan dalam bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וַיִּשְׁלַח
  choice: mengutus
  rationale: Dalam konteks diplomatik, 'mengutus' lebih alami daripada 'mengirim' untuk tindakan menugaskan para utusan.
- source_word: מַלְאָכִים
  choice: beberapa utusan
  rationale: Kata ini berbentuk jamak dan dalam konteks diplomatik menunjuk kepada manusia yang membawa pesan, bukan malaikat. 'Beberapa' membuat bentuk jamak alami dalam bahasa Indonesia tanpa menentukan jumlah.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi arah ini secara idiomatis diterjemahkan 'kepada' karena sasarannya adalah seorang raja.
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: raja bani Amon
  rationale: '''Bani Amon'' adalah ungkapan etnonim yang dikenal dalam bahasa Indonesia dan tetap cukup dekat dengan bentuk Ibrani harfiah ''anak-anak Amon''.'
