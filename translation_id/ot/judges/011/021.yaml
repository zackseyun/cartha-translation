  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ֠/יִּתֵּן יְהוָ֨ה אֱלֹהֵֽי יִשְׂרָאֵ֜ל אֶת סִיח֧וֹן וְ/אֶת כָּל עַמּ֛/וֹ בְּ/יַ֥ד יִשְׂרָאֵ֖ל וַ/יַּכּ֑וּ/ם וַ/יִּירַשׁ֙ יִשְׂרָאֵ֔ל אֵ֚ת כָּל אֶ֣רֶץ הָ/אֱמֹרִ֔י יוֹשֵׁ֖ב הָ/אָ֥רֶץ הַ/הִֽיא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/021.yaml
  text: And Yahweh[a], the God of Israel, gave Sihon and all his people into the hand of Israel, and they struck them down. So Israel took possession of all the land of the Amorites who lived in that land.
translation:
  language: id
  text: Yahweh, Allah Israel, menyerahkan Sihon beserta seluruh rakyatnya ke dalam kuasa Israel,[a] lalu orang Israel mengalahkan mereka. Lalu Israel mengambil alih seluruh wilayah orang Amori yang tinggal di negeri itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “ke dalam tangan Israel,” ungkapan Ibrani yang berarti ke dalam kuasa Israel.'
    reason: Menjelaskan idiom Ibrani בְּיַד sambil mempertahankan citra harfiahnya bagi pembaca.
lexical_decisions:
- source_word: וַיִּתֵּן ... בְּיַד יִשְׂרָאֵל
  choice: menyerahkan ... ke dalam kuasa Israel
  rationale: Gabungan נתן dengan בְּיַד merupakan ungkapan penyerahan ke bawah kuasa pihak lain. Terjemahan ini menyampaikan makna militernya secara alami, sementara catatan kaki mempertahankan bentuk harfiahnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: Allah Israel
  rationale: Bentuk rangkaian konstruksi ini secara alami mengidentifikasi Yahweh sebagai Allah Israel.
- source_word: סִיחוֹן
  choice: Sihon
  rationale: Transliterasi baku nama diri dalam bahasa Indonesia.
- source_word: כָּל עַמּוֹ
  choice: seluruh rakyatnya
  rationale: עַם pada dasarnya berarti rakyat atau bangsa; konteks perang tidak mengharuskan penyempitan makna menjadi tentara.
- source_word: וַיַּכּוּם
  choice: orang Israel mengalahkan mereka
  rationale: נכה dalam narasi peperangan dapat menyatakan pemukulan yang menghasilkan kekalahan. Subjek jamak yang tersirat dijelaskan sebagai orang Israel demi kejelasan dalam bahasa Indonesia.
- source_word: וַיִּירַשׁ
  choice: menduduki
  rationale: ירש di sini menunjuk pada pengambilalihan dan penguasaan wilayah sesudah kemenangan; 'menduduki' menyampaikan hasil teritorial itu dengan wajar.
- source_word: כָּל אֶרֶץ הָאֱמֹרִי
  choice: seluruh negeri orang Amori
  rationale: Bentuk tunggal kolektif הָאֱמֹרִי diterjemahkan dengan sebutan etnis kolektif yang alami dalam bahasa Indonesia.
- source_word: יוֹשֵׁב הָאָרֶץ הַהִיא
  choice: yang tinggal di negeri itu
  rationale: Partisipel tunggal mengikuti etnonim kolektif dan menerangkan orang Amori sebagai penduduk negeri tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi secara langsung; transliterasi 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Peran ilahi dalam kemenangan Israel
  choice: menyerahkan Sihon beserta seluruh rakyatnya ke dalam kuasa Israel
  alternative: membiarkan Israel mengalahkan Sihon
  rationale: Teks secara tegas menjadikan Yahweh pelaku yang menyerahkan Sihon kepada kuasa Israel; hubungan sebab-akibat ini dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Menyerahkan ... ke dalam kuasa' dipilih agar idiom peperangan mudah dipahami; 'orang Israel' memperjelas subjek jamak tersirat pada verba Ibrani. Penanda catatan kaki ditempatkan tepat sesudah ungkapan yang dijelaskan.
