base_translation:
  language: en
  yaml_path: translation/ot/judges/011/035.yaml
  text: And when he saw her[a], he tore his clothes and said, “Alas, my daughter! You have brought me very low, and you have become the cause of my trouble. For I have opened my mouth to Yahweh, and I cannot turn back.”
translation:
  language: id
  text: Ketika ia melihat putrinya, ia mengoyakkan pakaiannya dan berkata, “Aduh, putriku! Engkau benar-benar membuatku sangat terpuruk dan telah menjadi sumber kesusahanku. Aku telah membuka mulutku kepada Yahweh[a], dan aku tidak dapat menarik kembali perkataanku.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan menyatakan maksud ungkapannya secara lebih langsung, “Aku telah mengucapkan ikrar kepada Yahweh.” Secara harfiah teks Ibrani berbunyi, “Aku telah membuka mulutku kepada Yahweh.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כִרְאוֹתוֹ אוֹתָהּ
  choice: Ketika ia melihat anaknya
  rationale: Formula naratif וַיְהִי dengan klausa waktu diterjemahkan secara idiomatis sebagai klausa temporal. Objek feminin dirujukkan secara alami sebagai “anaknya” berdasarkan konteks dekat.
- source_word: וַיִּקְרַע אֶת־בְּגָדָיו
  choice: ia mengoyakkan pakaiannya
  rationale: Ungkapan ini menggambarkan tindakan berkabung atau sangat berduka. “Mengoyakkan pakaiannya” alami, jelas, dan mempertahankan tindakan konkret teks Ibrani.
- source_word: אֲהָהּ בִּתִּי
  choice: Aduh, anakku!
  rationale: “Aduh” menyampaikan seruan dukacita dan keterkejutan dalam bahasa Indonesia modern tanpa terdengar terlalu sehari-hari; בִּתִּי adalah sapaan langsung “anakku”.
- source_word: הַכְרֵעַ הִכְרַעְתִּנִי
  choice: Engkau benar-benar membuatku terpuruk
  rationale: Infinitif absolut yang diikuti verba finit memberi penegasan kuat. “Benar-benar” menyatakan intensifikasi itu, sedangkan “membuatku terpuruk” menyampaikan keadaan direndahkan atau dijatuhkan secara mendalam dengan wajar dalam bahasa Indonesia.
- source_word: וְאַתְּ הָיִיתְ בְּעֹכְרָי
  choice: dan telah menjadi sumber kesusahanku
  rationale: Akar עכר menunjuk pada tindakan mendatangkan kesusahan atau malapetaka. Frasa Indonesia ini mempertahankan nada tuduhan dalam ratapan Yefta tanpa memperkerasnya menjadi tuduhan kehancuran total.
- source_word: וְאָנֹכִי פָצִיתִי פִי אֶל־יְהוָה
  choice: Aku telah membuka mulutku kepada Yahweh
  rationale: Citra harfiah ungkapan Ibrani dipertahankan karena dapat dipahami dan memiliki bobot khidmat; dalam konteks, ungkapan ini menunjuk pada ikrar yang telah diucapkan. Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”.
- source_word: וְלֹא אוּכַל לָשׁוּב
  choice: dan aku tidak dapat menarik kembali perkataanku
  rationale: שוב secara harfiah berarti kembali atau berbalik. Dalam konteks ucapan ikrar, “menarik kembali perkataanku” mengungkapkan objek tersirat secara alami tanpa menentukan bagaimana ikrar itu akan dilaksanakan.
theological_decisions:
- issue: Apakah ucapan Yefta harus dinyatakan secara eksplisit sebagai ikrar dalam teks utama
  choice: Mempertahankan idiom “membuka mulutku kepada Yahweh” dan menjelaskan maknanya dalam catatan kaki.
  alternative: “Aku telah mengucapkan ikrar kepada Yahweh.”
  rationale: Konteks jelas menyangkut ikrar Yefta, tetapi teks Ibrani memakai ungkapan yang lebih konkret dan khidmat. Mempertahankannya menghindari parafrasa yang tidak perlu, sedangkan catatan kaki memberi arti kontekstualnya.
- issue: Seberapa kuat ratapan Yefta terhadap putrinya harus diterjemahkan
  choice: “membuatku terpuruk” dan “menjadi sumber kesusahanku”
  alternative: “menghancurkan aku” atau “menjadi pembawa malapetaka bagiku”
  rationale: Bahasa Ibrani menyatakan penderitaan yang sangat kuat, tetapi pilihan yang lebih keras dapat menyiratkan kecaman moral atau kehancuran total melebihi yang dipastikan teks.
- issue: Apakah terjemahan harus menjelaskan hasil atau pelaksanaan ikrar Yefta
  choice: Tidak menambahkan penjelasan mengenai cara ikrar itu akan dilaksanakan.
  alternative: Menafsirkan ucapan ini berdasarkan salah satu pandangan tentang nasib putrinya.
  rationale: Ayat ini hanya menyatakan keterikatan Yefta pada ucapannya. Menambahkan rincian mengenai hasil ikrar akan menyelesaikan ketegangan penafsiran yang tidak diselesaikan oleh ayat ini sendiri.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. “Aduh” dipilih sebagai seruan duka yang mudah dipahami; bentuk “mengoyakkan” dan nama “Yahweh” mempertahankan warna sastra serta kekhususan teks sumber.
