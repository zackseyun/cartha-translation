  text: וַ/יֹּאמְרוּ֩ זִקְנֵ֨י גִלְעָ֜ד אֶל יִפְתָּ֗ח לָ/כֵן֙ עַתָּה֙ שַׁ֣בְנוּ אֵלֶ֔י/ךָ וְ/הָלַכְתָּ֣ עִמָּ֔/נוּ וְ/נִלְחַמְתָּ֖ בִּ/בְנֵ֣י עַמּ֑וֹן וְ/הָיִ֤יתָ לָּ֨/נוּ֙ לְ/רֹ֔אשׁ לְ/כֹ֖ל יֹשְׁבֵ֥י גִלְעָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/008.yaml
  text: And the elders of Gilead said to Jephthah[a], “That is why we have now come back to you, so that you may go with us and fight against the Ammonites[b], and you will be head over all the inhabitants of Gilead.”
translation:
  language: id
  text: Lalu para tua-tua Gilead berkata kepada Yefta, “Itulah sebabnya sekarang kami kembali kepadamu, supaya engkau pergi bersama kami dan berperang melawan orang Amon[a]. Engkau akan menjadi pemimpin kami atas seluruh penduduk Gilead.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak Amon”, yaitu orang Amon.
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי גִלְעָד
  choice: para tua-tua Gilead
  rationale: Istilah ini menunjuk pada para pemuka yang diakui dalam masyarakat. 'Para tua-tua' mempertahankan sebutan jabatan sosial-politik tersebut.
- source_word: לָכֵן עַתָּה
  choice: Justru karena itulah sekarang
  rationale: Gabungan ini menyatakan alasan mereka kembali kepada Yefta sebagai jawaban atas keberatannya pada ayat sebelumnya, sekaligus menandai keadaan saat ini.
- source_word: שַׁבְנוּ אֵלֶיךָ
  choice: kami kembali kepadamu
  rationale: שׁוב secara langsung berarti 'kembali'; ungkapan ini mempertahankan gagasan bahwa para tua-tua itu memperbarui hubungan dengan Yefta setelah penolakan sebelumnya.
- source_word: וְהָלַכְתָּ עִמָּנוּ
  choice: engkau pergi bersama kami
  rationale: Terjemahan ini mengikuti arti dasar הלך, 'pergi', dan mempertahankan bentuk rangkaian verbal dalam tuturan para tua-tua.
- source_word: וְנִלְחַמְתָּ בִּבְנֵי עַמּוֹן
  choice: berperang melawan bani Amon
  rationale: '''Bani Amon'' adalah etnonim yang lazim dan dekat dengan bentuk Ibrani ''anak-anak Amon''; ''melawan'' menyampaikan makna permusuhan dari נלחם dengan בְּ.'
- source_word: וְהָיִיתָ לָּנוּ לְרֹאשׁ
  choice: Engkau akan menjadi pemimpin kami
  rationale: רֹאשׁ secara harfiah berarti 'kepala' dan di sini menunjuk pada kedudukan berwenang. 'Pemimpin kami' alami dalam bahasa Indonesia tanpa mempersempitnya menjadi komando militer semata.
- source_word: לְכֹל יֹשְׁבֵי גִלְעָד
  choice: atas semua penduduk Gilead
  rationale: Frasa ini memperluas lingkup kepemimpinan Yefta kepada seluruh orang yang tinggal di Gilead; 'penduduk' ringkas dan wajar.
theological_decisions:
- issue: Lingkup wewenang yang dijanjikan kepada Yefta
  choice: Para tua-tua menjanjikan kepemimpinan atas seluruh penduduk Gilead, bukan hanya komando dalam pertempuran.
  alternative: Janji itu hanya merujuk pada komando militer sementara.
  rationale: Frasa וְהָיִיתָ לָּנוּ לְרֹאשׁ לְכֹל יֹשְׁבֵי גִלְעָד melampaui permintaan untuk berperang dan menyatakan kepemimpinan atas seluruh penduduk Gilead, tanpa menentukan bentuk kelembagaan yang lebih khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Para tua-tua' mempertahankan istilah sosial-politik Alkitab; 'Yefta' dan 'bani Amon' mengikuti bentuk nama yang lazim dalam bahasa Indonesia. Tanda [a] ditempatkan tepat setelah istilah yang dijelaskan.
