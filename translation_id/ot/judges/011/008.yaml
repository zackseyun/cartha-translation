  terminology: “Para tua-tua,” “Yefta,” dan “pemimpin” sesuai konteks. “Pemimpin kami atas seluruh penduduk Gilead” menyatakan bahwa Yefta akan menjadi pemimpin mereka dengan cakupan seluruh penduduk Gilead, tanpa membatasi peran itu pada komando militer.
