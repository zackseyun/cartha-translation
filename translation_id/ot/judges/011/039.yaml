    issue: Ungkapan “melakukan terhadap dia” tidak idiomatis.
    rationale: Konstruksi ini meniru bentuk Ibrani secara kaku. “Melakukan kepadanya” merupakan padanan Indonesia yang lebih alami tanpa menentukan tindakan yang dimaksud.
  - severity: low
    issue: “Nazar yang telah diucapkannya” mengurangi pengulangan leksikal Ibrani.
    rationale: Teks Ibrani menyatakan “nazarnya yang telah ia nazarkan.” “Yang telah dinazarkannya” lebih dekat dan tetap dapat dipahami.
  - severity: medium
    issue: “Belum pernah berhubungan dengan laki-laki” berpotensi ambigu.
    rationale: Dalam bahasa Indonesia, “berhubungan dengan” tidak dengan sendirinya menyatakan relasi seksual. Penambahan “seksual” menyampaikan idiom sumber secara jelas.
