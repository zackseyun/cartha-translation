  text: וַ/יְהִ֞י מִ/קֵּ֣ץ שְׁנַ֣יִם חֳדָשִׁ֗ים וַ/תָּ֨שָׁב֙ אֶל אָבִ֔י/הָ וַ/יַּ֣עַשׂ לָ֔/הּ אֶת נִדְר֖/וֹ אֲשֶׁ֣ר נָדָ֑ר וְ/הִיא֙ לֹא יָדְעָ֣ה אִ֔ישׁ וַ/תְּהִי חֹ֖ק בְּ/יִשְׂרָאֵֽל׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/judges/011/039.yaml
  text: 'And at the end of two months she returned to her father[a], and he did to her according to his vow that he had vowed. Now she had not known a man[b]. And it became a statute in Israel:'
translation:
  language: id
  text: 'Setelah dua bulan berlalu, ia kembali kepada ayahnya, lalu ayahnya melakukan kepadanya sesuai dengan nazar yang telah dinazarkannya.[a] Ia belum pernah berhubungan seksual dengan seorang laki-laki.[b] Hal itu menjadi suatu kebiasaan di Israel:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “ia melakukan kepadanya nazarnya yang telah dinazarkannya.” Para penafsir berbeda pendapat apakah ini berarti Yefta mempersembahkan putrinya sebagai korban atau mengkhususkannya untuk hidup dalam keperawanan seumur hidup. Susunan bahasa Ibrani dalam ayat ini sendiri tidak menyelesaikan persoalan tersebut secara eksplisit.'
    reason: alternative_reading
  - marker: b
    text: 'Secara harfiah: “ia tidak mengenal seorang laki-laki,” suatu ungkapan Ibrani yang berarti bahwa ia belum pernah melakukan hubungan seksual.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ שְׁנַיִם חֳדָשִׁים
  choice: Setelah dua bulan berlalu
  rationale: Ungkapan ini menandai berakhirnya jangka waktu dua bulan. Bentuk ini alami dalam bahasa Indonesia sambil tetap mempertahankan batas waktu yang dinyatakan dalam bahasa Ibrani.
- source_word: וַתָּשָׁב אֶל אָבִיהָ
  choice: ia kembali kepada ayahnya
  rationale: Kata שׁוּב berarti kembali; tujuan relasional 'kepada ayahnya' dipertahankan secara eksplisit dan tidak diganti dengan 'pulang'.
- source_word: וַיַּעַשׂ לָהּ אֶת נִדְרוֹ אֲשֶׁר נָדָר
  choice: ayahnya melakukan terhadap dia sesuai dengan nazar yang telah diucapkannya
  rationale: Terjemahan ini mempertahankan ungkapan langsung עשה ל־, 'melakukan terhadap dia', serta pengulangan gagasan nazar tanpa menentukan secara eksplisit bagaimana nazar itu dilaksanakan.
- source_word: וְהִיא לֹא יָדְעָה אִישׁ
  choice: Gadis itu belum pernah berhubungan dengan laki-laki
  rationale: Dalam konteks ini, idiom יָדַע אִישׁ mengacu pada hubungan seksual. Terjemahan maknawi ini jelas dan wajar bagi pembaca Indonesia modern, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וַתְּהִי חֹק בְּיִשְׂרָאֵל
  choice: Hal itu menjadi suatu kebiasaan di Israel
  rationale: Dalam penutup narasi yang berlanjut kepada kegiatan tahunan pada ayat berikutnya, חֹק menunjuk pada praktik komunal yang tetap; 'kebiasaan' lebih sesuai daripada istilah hukum formal seperti 'ketetapan'.
theological_decisions:
- issue: Cara Yefta melaksanakan nazarnya
  choice: Teks utama mempertahankan ketidakjelasan bahasa Ibrani dengan menyatakan bahwa ia 'melakukan terhadap dia sesuai dengan nazar' tanpa menjelaskan bentuk pelaksanaannya.
  alternative: Menafsirkan bahwa Yefta mempersembahkan putrinya sebagai kurban bakaran, atau bahwa ia mengkhususkannya untuk hidup tanpa menikah.
  rationale: Bahasa Ibrani pada ayat ini tidak secara eksplisit menyelesaikan perdebatan tersebut. Karena itu, terjemahan tidak memasukkan salah satu penafsiran ke dalam teks utama, dan catatan kaki menyebutkan kedua kemungkinan utama secara netral.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata 'nazar' dipertahankan karena lazim dalam bahasa Alkitab dan tetap mudah dipahami. Hubungan subjek diperjelas dengan 'ayahnya' untuk menghindari ketaksaan pronomina, tanpa menambahkan penafsiran substantif. Tanda titik dua dipertahankan karena kalimat berlanjut ke penjelasan kebiasaan itu pada ayat berikutnya.
