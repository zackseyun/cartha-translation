base_translation:
  language: en
  yaml_path: translation/ot/judges/011/036.yaml
  text: And she said to him[a], “My father, you have opened your mouth to Yahweh; do to me according to what has gone out from your mouth, since Yahweh has taken vengeance for you on your enemies[b], on the sons of Ammon.”
translation:
  language: id
  text: Lalu ia berkata kepadanya, “Ayahku, engkau telah membuka mulutmu kepada Yahweh; lakukanlah kepadaku sesuai dengan apa yang telah keluar dari mulutmu,[a] sebab Yahweh telah melakukan pembalasan bagimu atas musuh-musuhmu, atas anak-anak Amon.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “membuka mulut kepada Yahweh” berarti mengucapkan nazar dengan sungguh-sungguh.
    reason: cultural_note
  - marker: b
    text: 'Atau “terhadap orang Amon.” Secara harfiah: “dari/atas anak-anak Amon.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּצִיתָה אֶת־פִּיךָ
  choice: engkau telah membuka mulutmu
  rationale: Mempertahankan ungkapan konkret Ibrani yang dalam konteks ini menunjuk pada pengucapan nazar dengan sungguh-sungguh; catatan kaki menjelaskan idiomnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar.
- source_word: עֲשֵׂה לִי
  choice: lakukanlah kepadaku
  rationale: Mencerminkan bentuk langsung ungkapan Ibrani dan penyerahan diri putri Yefta kepada pelaksanaan perkataan ayahnya tanpa menjelaskan bentuk pelaksanaannya.
- source_word: כַּאֲשֶׁר יָצָא מִפִּיךָ
  choice: sesuai dengan apa yang telah keluar dari mulutmu
  rationale: Mempertahankan citra perkataan yang keluar dari mulut dan kaitannya dengan ungkapan sebelumnya.
- source_word: אַחֲרֵי אֲשֶׁר
  choice: sebab
  rationale: Dalam konteks ini frasa tersebut terutama menyatakan alasan, bukan sekadar urutan waktu.
- source_word: נְקָמוֹת
  choice: pembalasan
  rationale: Menyampaikan tindakan pembalasan terhadap musuh tanpa melemahkannya menjadi sekadar pembenaran.
- source_word: מֵאֹיְבֶיךָ
  choice: atas musuh-musuhmu
  rationale: Bahasa Indonesia memakai 'pembalasan atas' untuk menyatakan sasaran tindakan tersebut secara wajar.
- source_word: מִבְּנֵי עַמּוֹן
  choice: yaitu bani Amon
  rationale: Menunjukkan bahwa bani Amon adalah musuh yang dimaksud, sambil mempertahankan bentuk etnonim tradisional yang dekat dengan ungkapan Ibrani 'anak-anak Amon'.
theological_decisions:
- issue: Hakikat nazar Yefta dalam jawaban putrinya
  choice: Menerjemahkan penyerahan dirinya kepada perkataan Yefta tanpa menentukan bagaimana nazar itu akan dilaksanakan.
  alternative: Menafsirkannya secara eksplisit sebagai penerimaan korban manusia atau sebagai pengabdian seumur hidup dalam keperawanan.
  rationale: Ayat ini sendiri tidak menjelaskan bentuk akhir pelaksanaan nazar. Terjemahan mempertahankan ketegangan dan ambiguitas teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “engkau” dipakai dalam hubungan anak kepada ayah pada konteks naratif Alkitab, sedangkan struktur idiomatik Ibrani dipertahankan sejauh tetap dapat dipahami.
