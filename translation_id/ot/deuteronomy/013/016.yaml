  text: הַכֵּ֣ה תַכֶּ֗ה אֶת יֹֽשְׁבֵ֛י הָ/עִ֥יר ה/הוא לְ/פִי חָ֑רֶב הַחֲרֵ֨ם אֹתָ֧/הּ וְ/אֶת כָּל אֲשֶׁר בָּ֛/הּ וְ/אֶת בְּהֶמְתָּ֖/הּ לְ/פִי חָֽרֶב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/016.yaml
  text: You shall surely strike the inhabitants of that city with the edge of the sword[a], devoting it to destruction, along with all that is in it and its livestock[b], with the edge of the sword.
translation:
  language: id
  text: Engkau harus sungguh-sungguh menewaskan penduduk kota itu dengan mata pedang, dan mengkhususkan kota itu untuk dimusnahkan[a], bersama segala sesuatu yang ada di dalamnya serta ternaknya, dengan mata pedang[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menumpasnya habis.” Kata kerja Ibrani ini menunjukkan pengkhususan sesuatu secara tidak dapat ditarik kembali untuk dimusnahkan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ke mulut pedang”; ungkapan ini berarti “dengan mata pedang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֵּה תַכֶּה
  choice: harus benar-benar menewaskan
  rationale: Gabungan infinitif absolut dan bentuk verba dari נכה menegaskan tindakan yang diperintahkan. “Benar-benar” mempertahankan penekanan itu, sedangkan “menewaskan” sesuai dengan konteks penggunaan pedang tanpa melunakkan akibatnya.
- source_word: יֹשְׁבֵי הָעִיר הַהוּא
  choice: penduduk kota itu
  rationale: Bentuk partisipial ini menunjuk kepada orang-orang yang tinggal di kota tersebut. “Penduduk” alami dan tepat dalam bahasa Indonesia modern.
- source_word: לְפִי חָרֶב
  choice: dengan mata pedang
  rationale: Ungkapan Ibrani ini secara harfiah berarti “dengan mulut pedang”. “Dengan mata pedang” mempertahankan gambaran konkret ungkapan tersebut dan dapat dipahami dalam bahasa Indonesia.
- source_word: הַחֲרֵם אֹתָהּ
  choice: menyerahkan kota itu kepada kebinasaan
  rationale: Bentuk Hifil חרם menyatakan penyerahan yang tidak dapat ditarik kembali kepada pemusnahan. Pilihan ini mempertahankan dimensi khusus atau sakral istilah itu, bukan sekadar menyatakan penghancuran biasa.
- source_word: וְאֶת כָּל אֲשֶׁר בָּהּ
  choice: beserta segala yang ada di dalamnya
  rationale: Frasa ini memperluas cakupan kebinasaan kepada semua yang terdapat di kota itu. “Beserta” menghubungkannya secara alami dengan kota yang disebut sebelumnya.
- source_word: בְּהֶמְתָּהּ
  choice: ternaknya
  rationale: בְּהֵמָה di sini merupakan sebutan kolektif bagi hewan peliharaan. “Ternak” tidak membatasinya hanya pada sapi.
theological_decisions:
- issue: Makna חרם dalam konteks perang dan penghukuman
  choice: menyerahkan kota itu kepada kebinasaan
  alternative: menumpas kota itu sampai binasa; menempatkan kota itu di bawah larangan
  rationale: Pilihan ini mempertahankan ketegangan bahwa tindakan tersebut bukan hanya penghancuran militer, melainkan penyerahan yang tidak dapat ditarik kembali kepada kebinasaan, tanpa memakai istilah teknis yang tidak jelas bagi pembaca umum.
- issue: Kerasnya bahasa penghukuman dalam ayat
  choice: mempertahankan daya penuh perintah untuk menewaskan dan membinasakan
  alternative: melunakkannya menjadi mengalahkan atau menaklukkan
  rationale: Teks Ibrani secara tegas memerintahkan tindakan mematikan dan pemusnahan menyeluruh; penerjemahan tidak boleh mengurangi beratnya pernyataan tersebut.
translation_notes:
  register: Bahasa dibuat modern, lugas, dan bermartabat. Pengulangan “dengan mata pedang” dipertahankan karena terdapat dua kali dalam teks Ibrani. Ungkapan “benar-benar” menyampaikan penegasan gramatikal sumber, dan istilah חרם diterjemahkan secara transparan sambil dijelaskan dalam catatan kaki.
