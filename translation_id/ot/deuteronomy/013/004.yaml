  text: לֹ֣א תִשְׁמַ֗ע אֶל דִּבְרֵי֙ הַ/נָּבִ֣יא הַ/ה֔וּא א֛וֹ אֶל חוֹלֵ֥ם הַ/חֲל֖וֹם הַ/ה֑וּא כִּ֣י מְנַסֶּ֞ה יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ אֶתְ/כֶ֔ם לָ/דַ֗עַת הֲ/יִשְׁ/כֶ֤ם אֹֽהֲבִים֙ אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֔ם בְּ/כָל לְבַבְ/כֶ֖ם וּ/בְ/כָל נַפְשְׁ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/004.yaml
  text: You shall not listen to the words of that prophet or to that dreamer of dreams[a], for Yahweh your God is testing you[b], to know whether you love Yahweh your God with all your heart and with all your soul.
translation:
  language: id
  text: Jangan dengarkan perkataan nabi itu atau orang yang bermimpi itu, sebab Yahweh, Allah kalian, sedang menguji kalian untuk mengetahui apakah kalian mengasihi Yahweh, Allah kalian, dengan segenap hati kalian dan dengan segenap jiwa kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “jiwa” juga dapat berarti “hidup”, “diri”, atau “seluruh keberadaan seseorang”.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִשְׁמַע אֶל
  choice: Jangan dengarkan
  rationale: Konstruksi שׁמע אֶל mencakup tindakan mendengarkan sekaligus mengindahkan. Larangan langsung dengan “jangan” alami dalam bahasa Indonesia dan tetap mempertahankan daya perintahnya.
- source_word: דִּבְרֵי הַנָּבִיא הַהוּא
  choice: perkataan nabi itu
  rationale: דִּבְרֵי adalah bentuk jamak konstruksi yang secara langsung berarti “perkataan-perkataan dari”; dalam bahasa Indonesia, “perkataan” sudah wajar sebagai nomina kolektif. Demonstratif הַהוּא dipertahankan dengan “itu”.
- source_word: חוֹלֵם הַחֲלוֹם הַהוּא
  choice: orang yang mendapat mimpi itu
  rationale: Ungkapan harfiah “pemimpi mimpi itu” tidak alami dan “pemimpi” dalam bahasa Indonesia mudah dipahami sebagai orang yang berangan-angan. Pilihan ini menyampaikan orang yang mengaku menerima mimpi pewahyuan dalam konteks tersebut tanpa menilai kebenaran klaimnya.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi larangan sebelumnya. “Sebab” ringkas, jelas, dan sesuai dengan gaya nasihat hukum.
- source_word: מְנַסֶּה
  choice: sedang menguji
  rationale: Partisipel Piel dari נסה menyatakan tindakan menguji yang sedang berlangsung dalam situasi ini. “Menguji” mempertahankan makna evaluatif tanpa menjelaskannya secara berlebihan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, agar nama perjanjian dalam teks sumber tetap tampak.
- source_word: אֱלֹהֵיכֶם
  choice: Allah kalian
  rationale: Bentuk dengan sufiks orang kedua jamak berarti “Allah kalian”. “Kalian” membuat kemajemukan pihak yang disapa lebih jelas daripada “kamu” dalam bahasa Indonesia modern.
- source_word: לָדַעַת
  choice: untuk mengetahui
  rationale: Infinitif ini secara langsung menyatakan tujuan atau hasil, “untuk mengetahui”. Rumusan tersebut dipertahankan tanpa mengubahnya menjadi “untuk memperlihatkan” atau “untuk menyingkapkan”.
- source_word: הֲיִשְׁכֶם אֹהֲבִים
  choice: apakah kalian mengasihi
  rationale: Partikel tanya dan partisipel menyatakan apakah kasih itu ada atau berlangsung. Bentuk kini sederhana dalam bahasa Indonesia menyampaikan keadaan berkelanjutan secara alami.
- source_word: בְּכָל לְבַבְכֶם
  choice: dengan segenap hati kalian
  rationale: לֵבָב menunjuk pusat batin, pikiran, dan kehendak. “Hati” tetap akurat, alami, dan menjaga kesinambungan bahasa perjanjian.
- source_word: וּבְכָל נַפְשְׁכֶם
  choice: dan dengan segenap jiwa kalian
  rationale: נֶפֶשׁ dapat berarti jiwa, hidup, diri, atau keseluruhan pribadi. “Jiwa” mempertahankan ungkapan perjanjian yang dikenal dan hubungan antarteks, sementara keluasan maknanya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung. Transliterasi “Yahweh” mempertahankan nama pribadi dalam teks dan tidak menggantinya dengan sebuah gelar.
- issue: Ungkapan antropomorfis bahwa Allah menguji “untuk mengetahui”
  choice: mempertahankan “sedang menguji kalian untuk mengetahui”
  alternative: “menguji kalian untuk memperlihatkan/menyingkapkan”
  rationale: Teks sumber menyatakan לָדַעַת, “untuk mengetahui”. Terjemahan tidak menyelesaikan ketegangan teologis mengenai pengetahuan Allah dengan memasukkan penafsiran yang tidak dinyatakan oleh teks.
- issue: Subjek jamak yang disapa
  choice: kalian
  alternative: kamu
  rationale: Semua sufiks orang kedua dalam ayat ini berbentuk jamak. “Kalian” menyatakannya secara eksplisit dalam bahasa Indonesia modern, meskipun “kamu” kadang digunakan secara kolektif dalam ragam Alkitab.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan langsung. Bentuk “kalian” dipakai untuk memperjelas orang kedua jamak; pengulangan “Allah kalian” dan “dengan segenap” dipertahankan demi penekanan perjanjian dalam teks Ibrani.
