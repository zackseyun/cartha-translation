  text: וּ/בָ֤א הָ/אוֹת֙ וְ/הַ/מּוֹפֵ֔ת אֲשֶׁר דִּבֶּ֥ר אֵלֶ֖י/ךָ לֵ/אמֹ֑ר נֵֽלְכָ֞ה אַחֲרֵ֨י אֱלֹהִ֧ים אֲחֵרִ֛ים אֲשֶׁ֥ר לֹֽא יְדַעְתָּ֖/ם וְ/נָֽעָבְדֵֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/003.yaml
  text: and the sign or the wonder comes to pass[a], about which he spoke to you, saying, ‘Let us go after other gods, which you have not known[c][b], and let us serve them,’
translation:
  language: id
  text: dan tanda atau mukjizat yang ia bicarakan kepadamu itu terjadi, dengan berkata, ‘Mari kita mengikuti allah-allah lain yang tidak kamu kenal dan beribadah kepada mereka,’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָא
  choice: terjadi
  rationale: Dalam konteks ramalan tentang suatu tanda atau mukjizat, bentuk kata kerja ini menyatakan bahwa hal yang dinubuatkan benar-benar terlaksana; ‘terjadi’ alami dalam bahasa Indonesia.
- source_word: הָאוֹת וְהַמּוֹפֵת
  choice: tanda atau mukjizat
  rationale: Pasangan istilah ini menunjuk pada kejadian yang berfungsi sebagai tanda dan/atau perbuatan luar biasa. ‘Atau’ menyampaikan fungsi idiomatis pasangan tersebut tanpa mengharuskan dua kejadian terpisah.
- source_word: אֲשֶׁר דִּבֶּר אֵלֶיךָ
  choice: yang telah dikatakannya kepadamu itu
  rationale: Frasa ini mengaitkan terjadinya tanda atau mukjizat dengan hal yang sebelumnya disampaikan orang tersebut.
- source_word: לֵאמֹר
  choice: lalu ia berkata
  rationale: Memperkenalkan isi ajakan langsung secara wajar dalam bahasa Indonesia; subjeknya dipahami dari konteks orang yang telah berbicara.
- source_word: נֵלְכָה אַחֲרֵי
  choice: Mari kita mengikuti
  rationale: Bentuk ajakan dan idiom ‘pergi mengikuti’ menyatakan pengikutan serta peralihan kesetiaan; ‘mengikuti’ paling alami dan jelas.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: allah-allah lain
  rationale: Ini merupakan ungkapan baku dalam konteks perjanjian kitab Ulangan. Huruf kecil menghindari penyamaan dengan nama diri Allah.
- source_word: אֲשֶׁר לֹא יְדַעְתָּם
  choice: yang tidak kamu kenal
  rationale: ‘Kenal’ mempertahankan cakupan makna pengetahuan, pengenalan, atau keterikatan tanpa menambahkan penafsiran teologis.
- source_word: וְנָעָבְדֵם
  choice: dan beribadah kepada mereka
  rationale: Dalam konteks pengabdian kepada ilah, עבד bermakna pelayanan keagamaan. ‘Beribadah kepada’ menyatakan maksud tersebut dengan alami, sementara unsur pengabdian tetap tersirat.
theological_decisions:
- issue: Status ontologis allah-allah lain
  choice: allah-allah lain yang tidak kamu kenal
  alternative: allah-allah lain yang belum pernah kamu sembah
  rationale: Terjemahan mempertahankan kata ‘mengenal’ dan tidak menentukan apakah ungkapan itu mengakui keberadaan pribadi ilah-ilah tersebut atau sekadar merujuk kepada objek penyembahan.
- issue: Makna pelayanan kepada ilah
  choice: beribadah kepada mereka
  alternative: melayani mereka
  rationale: Konteks jelas bersifat keagamaan, sehingga ‘beribadah’ alami dan tepat. Alternatif ‘melayani’ lebih formal tetapi dalam bahasa Indonesia dapat terdengar kurang spesifik tanpa konteks tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dipertahankan sebagai lanjutan sintaksis dari ayat sebelumnya. Kata ganti orang kedua tunggal diterjemahkan ‘kamu’ agar mudah dipahami; bentuk ‘-nya’ merujuk kepada nabi atau pemimpi dalam konteks sebelumnya.
