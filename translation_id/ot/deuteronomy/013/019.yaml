source:
  edition: WLC
  text: כִּ֣י תִשְׁמַ֗ע בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹר֙ אֶת כָּל מִצְוֺתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לַ/עֲשׂוֹת֙ הַ/יָּשָׁ֔ר בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/019.yaml
  text: if you listen to the voice of Yahweh your God, to keep all his commandments that I am commanding you today, to do what is right in the eyes of Yahweh your God.
translation:
  language: id
  text: jika engkau mendengarkan suara Yahweh, Allahmu, untuk menaati segala perintah-perintah-Nya yang kuperintahkan kepadamu hari ini, untuk melakukan apa yang benar di mata Yahweh, Allahmu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: jika
  rationale: Dalam konteks ini, partikel tersebut memperkenalkan syarat bagi janji pada ayat sebelumnya.
- source_word: תִשְׁמַע בְּקוֹל
  choice: kamu mendengarkan suara
  rationale: Ungkapan ini menyiratkan mendengar dengan penuh perhatian yang menghasilkan ketaatan; terjemahan ini mempertahankan citra pendengaran dan dimensi personalnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Padanan alami bagi ungkapan perjanjian dengan akhiran posesif orang kedua tunggal.
- source_word: לִשְׁמֹר אֶת כָּל מִצְוֺתָיו
  choice: dengan menaati segala perintah-Nya
  rationale: Dalam konteks perintah, שׁמר menyatakan pemeliharaan melalui ketaatan. 'Dengan' menghubungkannya secara alami dengan tindakan mendengarkan tanpa menjadikannya syarat terpisah.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: yang kusampaikan kepadamu hari ini
  rationale: Partisip Ibrani menunjukkan tindakan Musa yang sedang berlangsung dalam wacana ini; 'kusampaikan' terdengar alami dan tetap mengacu pada pemberian perintah.
- source_word: לַעֲשׂוֹת הַיָּשָׁר
  choice: dan melakukan apa yang benar
  rationale: Infinitif kedua disejajarkan secara alami dengan ketaatan pada perintah, sedangkan הַיָּשָׁר mempertahankan makna etis 'apa yang benar'.
- source_word: בְּעֵינֵי
  choice: di mata
  rationale: Mempertahankan idiom Ibrani tentang penilaian sambil tetap jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menggunakan nama perjanjian ilahi secara langsung; bentuk 'Yahweh' mempertahankannya sebagai nama pribadi.
- issue: Hubungan antara mendengarkan dan menaati
  choice: mendengarkan suara ... dengan menaati
  alternative: menaati
  rationale: Pilihan ini mempertahankan metafora suara dalam teks sekaligus mengungkapkan nuansa ketaatan yang terkandung dalam idiom שׁמע בקול.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina orang kedua tunggal dipertahankan melalui 'kamu' dan bentuk '-mu'; rujukan kepada Allah menggunakan 'Allahmu' dan kapitalisasi pronomina '-Nya' sesuai kebiasaan penulisan religius Indonesia.
