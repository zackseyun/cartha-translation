  naturalness: Susunan revisi tetap baku, jelas, dan wajar dalam bahasa Indonesia modern. Infinitif tujuan 'untuk menaati' dan 'untuk melakukan' merepresentasikan struktur sumber lebih dekat daripada 'dengan menaati' dan koordinasi 'dan melakukan'.
  terminology: '''Yahweh'' dan ''Allahmu'' dipertahankan. ''Perintah-perintah-Nya'' secara idiomatis menyatakan bentuk jamak ''segala perintah-Nya''; ''menaati'' sesuai dengan שׁמר dalam konteks hukum/perintah.'
