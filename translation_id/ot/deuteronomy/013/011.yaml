  text: וּ/סְקַלְתּ֥/וֹ בָ/אֲבָנִ֖ים וָ/מֵ֑ת כִּ֣י בִקֵּ֗שׁ לְ/הַדִּֽיחֲ/ךָ֙ מֵ/עַל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ הַ/מּוֹצִיאֲ/ךָ֛ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/011.yaml
  text: You shall stone him with stones[a], and he shall die, because he sought to drive you away from Yahweh your God, who brought you out from the land of Egypt[b], out of the house of slavery.
translation:
  language: id
  text: Rajamlah dia dengan batu hingga mati, karena dia berusaha menjauhkanmu dari Yahweh, Allahmu, yang telah membawa kamu keluar dari tanah Mesir, dari rumah perbudakan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari rumah budak-budak”; ini adalah ungkapan perjanjian yang menyebut Mesir sebagai tempat perbudakan dan mengenang pembebasan Israel.
    reason: cultural_note
lexical_decisions:
- source_word: וּסְקַלְתּוֹ בָאֲבָנִים וָמֵת
  choice: Kamu harus merajam dia dengan batu sampai mati
  rationale: Rangkaian hukum ini memerintahkan perajaman dan menyatakan hasilnya, yakni kematian. Ungkapan Indonesia ini alami, tegas, dan tetap memuat sarana serta hasil tindakan.
- source_word: כִּי בִקֵּשׁ
  choice: karena dia telah berusaha
  rationale: כִּי memperkenalkan alasan hukuman, sedangkan בִקֵּשׁ dalam konteks ini menyatakan maksud atau upaya yang disengaja.
- source_word: לְהַדִּיחֲךָ מֵעַל
  choice: menjauhkanmu dari
  rationale: Bentuk Hifil dari נדח menyatakan tindakan menyebabkan seseorang menyimpang atau terpisah dari kesetiaan. Pilihan ini mempertahankan daya kausatif tanpa menentukan apakah caranya berupa bujukan atau penyesatan.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Allahmu
  rationale: Nama ilahi יְהוָה ditransliterasikan sebagai Yahweh, sedangkan אֱלֹהֶיךָ diterjemahkan secara langsung sebagai Allahmu.
- source_word: הַמּוֹצִיאֲךָ
  choice: yang telah membawa kamu keluar
  rationale: Partisip ini berfungsi sebagai keterangan relatif yang menunjuk pada tindakan pembebasan historis Yahweh.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: dari tanah Mesir
  rationale: Terjemahan langsung dan alami bagi ungkapan geografis tersebut.
- source_word: מִבֵּית עֲבָדִים
  choice: dari rumah perbudakan
  rationale: Terjemahan ini mempertahankan metafora Ibrani 'rumah' dan keadaan perbudakan sebagai rumusan perjanjian tentang pembebasan dari Mesir.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama diri perjanjian secara langsung. Transliterasi 'Yahweh' mempertahankan fungsi nama itu dan tidak menggantinya dengan gelar.
- issue: Bahasa kemurtadan perjanjian dalam לְהַדִּיחֲךָ מֵעַל יְהוָה
  choice: menjauhkanmu dari Yahweh
  alternative: menyesatkanmu dari Yahweh; membujukmu meninggalkan Yahweh
  rationale: Pilihan ini mempertahankan gagasan kausatif tentang pemisahan dari kesetiaan kepada Yahweh, sambil tidak mempersempit tindakan itu hanya menjadi bujukan atau penyesatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kamu harus' menyampaikan daya perintah hukum; 'merajam' merupakan istilah Indonesia yang lazim untuk eksekusi dengan batu. Penanda catatan kaki [a] ditempatkan setelah ungkapan yang diterangkannya.
