  naturalness: '"Kamu harus merajam dia dengan batu sampai mati" dapat dipahami, tetapi "Rajamlah dia dengan batu hingga mati" lebih langsung, baku, dan sesuai dengan gaya perintah hukum. "Berusaha menjauhkanmu" lebih alami daripada "telah berusaha menjauhkanmu" dalam konteks ini.'
  terminology: '"Yahweh, Allahmu", "merajam", dan "rumah perbudakan" sudah tepat untuk register modern-baku dan formula perjanjian. Catatan kaki perlu menjelaskan bahwa "rumah perbudakan" menerjemahkan idiom Ibrani, tanpa menyebut "rumah para budak" sebagai padanan literal yang dapat terbaca sebagai tempat tinggal para budak.'
