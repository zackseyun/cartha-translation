id: DEU.13.2
reference: Deuteronomy 13:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי יָק֤וּם בְּ/קִרְבְּ/ךָ֙ נָבִ֔יא א֖וֹ חֹלֵ֣ם חֲל֑וֹם וְ/נָתַ֥ן אֵלֶ֛י/ךָ א֖וֹת א֥וֹ מוֹפֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/002.yaml
  text: If a prophet or a dreamer of dreams arises among you and gives you a sign or a wonder,[a]
translation:
  language: id
  text: Jika di tengah-tengahmu muncul seorang nabi atau seorang pemimpi, lalu ia memberikan kepadamu suatu tanda atau keajaiban,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “suatu tanda atau pertanda.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Jika
  rationale: Dalam rumusan hukum kasuistik ini, כִּי memperkenalkan syarat yang berlanjut ke ayat berikutnya; “Jika” paling jelas dalam bahasa Indonesia.
- source_word: יָקוּם
  choice: muncul
  rationale: Di sini קום menunjuk pada tampilnya seseorang di dalam komunitas. “Muncul” alami dalam bahasa Indonesia dan tidak menyiratkan gerakan berdiri secara harfiah.
- source_word: בְּקִרְבְּךָ
  choice: di tengah-tengahmu
  rationale: Ungkapan ini berarti berada di tengah atau di antara umat. Bentuk tunggal “-mu” mempertahankan sapaan kolektif Ibrani.
- source_word: נָבִיא
  choice: seorang nabi
  rationale: Padanan baku bagi נָבִיא.
- source_word: אוֹ
  choice: atau
  rationale: Konjungsi pemisah sederhana yang menghubungkan dua jenis tokoh dan kemudian dua jenis fenomena.
- source_word: חֹלֵם חֲלוֹם
  choice: seorang pemimpi
  rationale: Ungkapan partisip dengan nomina serumpun berarti orang yang bermimpi. “Seorang pemimpi” merupakan ungkapan Indonesia yang wajar; konteks membuat unsur mimpi tetap jelas tanpa pengulangan yang kaku.
- source_word: וְנָתַן אֵלֶיךָ
  choice: lalu ia memberikan kepadamu
  rationale: Dalam rangkaian syarat ini, bentuk verba menyatakan tindakan lanjutan. “Lalu” memperjelas urutan, sedangkan “memberikan kepadamu” mempertahankan arah tindakan dalam אֵלֶיךָ.
- source_word: אוֹת
  choice: suatu tanda
  rationale: אוֹת lazim menunjuk tanda yang berfungsi sebagai bukti atau peneguhan; “tanda” adalah padanan Indonesia yang paling langsung.
- source_word: מוֹפֵת
  choice: keajaiban
  rationale: מוֹפֵת dapat menunjuk kejadian mencolok, ajaib, atau bersifat pertanda. “Keajaiban” mempertahankan pasangan tradisional dengan “tanda” tanpa memastikan asal atau keasliannya.
theological_decisions:
- issue: Hakikat tanda atau keajaiban yang diberikan nabi atau pemimpi
  choice: “suatu tanda atau keajaiban” tanpa menjelaskan apakah fenomena itu sungguh adikodrati, menipu, atau sekadar diklaim
  alternative: “suatu tanda atau pertanda” atau “suatu tanda mukjizat atau keajaiban”
  rationale: Ayat ini menyebut אות atau מופת tetapi belum menerangkan sumber maupun sifat fenomenanya. Terjemahan tidak boleh mendahului konteks dengan menetapkan penilaian teologis yang tidak dinyatakan di ayat ini.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Sapaan tunggal kolektif Ibrani dipertahankan melalui “-mu”. “Pemimpi” dipilih agar alami, sementara catatan kaki mempertahankan alternatif leksikal מוֹפֵת.
