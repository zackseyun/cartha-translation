  text: וְ/הַ/נָּבִ֣יא הַ/ה֡וּא א֣וֹ חֹלֵם֩ הַ/חֲל֨וֹם הַ/ה֜וּא יוּמָ֗ת כִּ֣י דִבֶּר סָ֠רָה עַל יְהוָ֨ה אֱלֹֽהֵי/כֶ֜ם הַ/מּוֹצִ֥יא אֶתְ/כֶ֣ם מֵ/אֶ֣רֶץ מִצְרַ֗יִם וְ/הַ/פֹּֽדְ/ךָ֙ מִ/בֵּ֣ית עֲבָדִ֔ים לְ/הַדִּֽיחֲ/ךָ֙ מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֧ר צִוְּ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ לָ/לֶ֣כֶת בָּ֑/הּ וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/006.yaml
  text: But that prophet[a], or that dreamer of dreams, shall be put to death, because he has spoken rebellion against Yahweh your God, who brought you out from the land of Egypt and redeemed you from the house of slavery, to drive you from the way in which Yahweh your God commanded you to walk[b]. So you shall purge the evil from your midst.
translation:
  language: id
  text: Namun nabi itu atau pemimpi mimpi itu harus dihukum mati, karena ia telah menyerukan pemberontakan[a] terhadap Yahweh, Allah kalian, yang membawa kalian keluar dari negeri Mesir dan menebus engkau[c] dari rumah perbudakan[b], untuk menyesatkan engkau dari jalan yang Yahweh, Allahmu, perintahkan untuk kautempuh. Demikianlah engkau harus menyingkirkan kejahatan dari tengah-tengahmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “pemberontakan” juga dapat berarti “pembelotan” dari kesetiaan kepada Yahweh.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “rumah para budak”; maksudnya, tempat atau keadaan perbudakan.
    reason: literal_rendering
  - marker: c
    text: Teks Ibrani beralih dari sapaan jamak (“kalian”) ke sapaan tunggal (“engkau”) mulai dari “menebus engkau”. Sapaan tunggal itu menyapa umat sebagai satu kesatuan atau setiap orang di dalamnya.
    reason: source_form
lexical_decisions:
- source_word: וְהַנָּבִיא הַהוּא אוֹ חֹלֵם הַחֲלוֹם הַהוּא
  choice: Namun nabi itu atau pemimpi itu
  rationale: “Namun” menghubungkan putusan ini secara kontras dengan kasus sebelumnya. Ungkapan harfiah “pemimpi mimpi itu” dibuat alami sebagai “pemimpi itu” tanpa menghilangkan rujukan demonstratifnya.
- source_word: יוּמָת
  choice: harus dihukum mati
  rationale: Bentuk Hophal menyatakan tindakan kausatif-pasif dalam konteks hukum, yaitu eksekusi, bukan sekadar bahwa orang itu akan mati.
- source_word: כִּי דִבֶּר סָרָה עַל יְהוָה
  choice: karena ia telah berbicara untuk memberontak terhadap Yahweh
  rationale: סָרָה menunjuk pada pemberontakan atau pembelotan dari kesetiaan perjanjian. Rumusan ini mempertahankan unsur tindakan berbicara sekaligus menjelaskan arah ucapan tersebut secara alami dalam bahasa Indonesia.
- source_word: הַמּוֹצִיא אֶתְכֶם מֵאֶרֶץ מִצְרַיִם
  choice: yang membawa kalian keluar dari negeri Mesir
  rationale: Mempertahankan rumusan khas keluaran dan bentuk sapaan jamak אֶתְכֶם.
- source_word: וְהַפֹּדְךָ מִבֵּית עֲבָדִים
  choice: dan menebus engkau dari rumah perbudakan
  rationale: פּדה berarti menebus atau membebaskan dengan tindakan penebusan. “Rumah perbudakan” alami dalam bahasa Indonesia dan tetap mempertahankan citra “rumah” dalam teks Ibrani.
- source_word: לְהַדִּיחֲךָ מִן הַדֶּרֶךְ
  choice: Ia bermaksud menyimpangkan engkau dari jalan
  rationale: Hiphil נדח mengandung gagasan menyebabkan seseorang tersingkir atau menyimpang. “Dari jalan” mempertahankan metafora perilaku perjanjian.
- source_word: אֲשֶׁר צִוְּךָ יְהוָה אֱלֹהֶיךָ לָלֶכֶת בָּהּ
  choice: yang Yahweh, Allahmu, perintahkan untuk kautempuh
  rationale: “Kautempuh” menyampaikan idiom berjalan di suatu jalan dengan bahasa Indonesia yang alami sambil mempertahankan metafora jalan.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: Demikianlah engkau harus menyingkirkan kejahatan dari tengah-tengahmu
  rationale: Dalam formula hukum Ulangan, בער berarti membuang atau menyingkirkan secara tegas. “Kejahatan” dibiarkan dapat menunjuk baik pada perbuatan jahat maupun keberadaannya di tengah umat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks sumber secara langsung memakai nama perjanjian YHWH; “Yahweh” mempertahankannya sebagai nama diri.
- issue: Makna סָרָה dalam konteks kesetiaan perjanjian
  choice: berbicara untuk memberontak
  alternative: mengucapkan pembelotan atau kemurtadan
  rationale: “Memberontak” dapat dipahami pembaca umum dan mempertahankan tindakan menentang Yahweh tanpa membatasi istilah itu pada pengertian teknis denominasi tertentu.
- issue: Peralihan sapaan jamak ke tunggal
  choice: mempertahankan “kalian” lalu “engkau”
  alternative: menyeragamkan seluruh sapaan menjadi jamak atau tunggal
  rationale: Teks Ibrani beralih dari bentuk jamak pada “Allah kalian/membawa kalian” ke bentuk tunggal mulai “menebus engkau”. Peralihan retoris-komunal ini dipertahankan dan dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Engkau” dipakai untuk sapaan tunggal dalam wacana hukum-perjanjian, sedangkan “kalian” menandai bentuk jamak secara jelas. Struktur kalimat dipecah agar tujuan nabi palsu tidak salah terbaca sebagai tujuan tindakan Yahweh.
