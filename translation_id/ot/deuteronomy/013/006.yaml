revisions:
- from: Namun nabi itu atau pemimpi itu harus dihukum mati, karena ia telah berbicara untuk memberontak[a] terhadap Yahweh, Allah kalian, yang membawa kalian keluar dari negeri Mesir dan menebus engkau dari rumah perbudakan[b]. Ia bermaksud menyimpangkan engkau dari jalan yang Yahweh, Allahmu, perintahkan untuk kautempuh. Demikianlah engkau harus menyingkirkan kejahatan dari tengah-tengahmu.[c]
  to: Namun nabi itu atau pemimpi mimpi itu harus dihukum mati, karena ia telah menyerukan pemberontakan[a] terhadap Yahweh, Allah kalian, yang membawa kalian keluar dari negeri Mesir dan menebus engkau[c] dari rumah perbudakan[b], untuk menyesatkan engkau dari jalan yang Yahweh, Allahmu, perintahkan untuk kautempuh. Demikianlah engkau harus menyingkirkan kejahatan dari tengah-tengahmu.
  rationale: Revisi ini memperbaiki kelancaran bahasa Indonesia dan kejelasan sintaksis tanpa mengubah makna hukum atau historis ayat. Bentuk “pemimpi mimpi itu” mempertahankan pengulangan konstruksi Ibrani secara cukup dekat; istilah itu tetap dapat dipahami dalam register hukum yang bermartabat. Catatan dipertahankan dan jangkar catatan perubahan sapaan dipindahkan ke lokasi yang relevan.
