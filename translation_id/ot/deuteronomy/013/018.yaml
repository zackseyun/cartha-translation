  text: וְ/לֹֽא יִדְבַּ֧ק בְּ/יָדְ/ךָ֛ מְא֖וּמָה מִן הַ/חֵ֑רֶם לְמַעַן֩ יָשׁ֨וּב יְהוָ֜ה מֵ/חֲר֣וֹן אַפּ֗/וֹ וְ/נָֽתַן לְ/ךָ֤ רַחֲמִים֙ וְ/רִֽחַמְ/ךָ֣ וְ/הִרְבֶּ֔/ךָ כַּ/אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/018.yaml
  text: And nothing from what is devoted to destruction shall cling to your hand[a], so that Yahweh may turn from the fierceness of his anger and show you mercy, and have compassion on you, and multiply you[b], just as he swore to your fathers.
translation:
  language: id
  text: Jangan sampai sedikit pun dari apa yang dikhususkan untuk dimusnahkan melekat pada tanganmu[a], supaya Yahweh berpaling dari murka-Nya yang menyala-nyala[b], menunjukkan belas kasihan kepadamu, mengasihanimu, dan membuatmu bertambah banyak, seperti yang telah Ia sumpahkan kepada nenek moyangmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “melekat pada tanganmu.” Maksudnya, jangan menyimpan atau menguasai sedikit pun dari barang yang dikhususkan untuk dimusnahkan.
    reason: penjelasan_idiom_dan_leksikal
  - marker: b
    text: Secara harfiah, “dari nyala hidung-Nya,” sebuah idiom Ibrani untuk murka yang sangat hebat.
    reason: catatan_idiom_budaya
lexical_decisions:
- source_word: יִדְבַּק בְּיָדְךָ
  choice: melekat pada tanganmu
  rationale: Mempertahankan gambaran konkret verba דבק dan kata 'tangan', yang dalam konteks ini mengacu secara idiomatis pada penguasaan atau penyimpanan barang.
- source_word: מְאוּמָה
  choice: sedikit pun
  rationale: 'Dengan penyangkalan לֹא, ungkapan ini menegaskan larangan mutlak: tidak boleh ada barang sekecil apa pun yang tersisa dalam penguasaan orang Israel.'
- source_word: הַחֵרֶם
  choice: apa yang dikhususkan untuk dimusnahkan
  rationale: חֵרֶם menunjuk pada sesuatu yang dikhususkan secara mutlak bagi Allah dan, dalam konteks perang perjanjian ini, harus dimusnahkan. Rumusan ini lebih jelas bagi pembaca modern daripada istilah teknis yang tidak diterangkan.
- source_word: יָשׁוּב יְהוָה מֵחֲרוֹן אַפּוֹ
  choice: Yahweh berpaling dari murka-Nya yang menyala-nyala
  rationale: שׁוב מן menyatakan berpaling atau surut dari sesuatu, sedangkan חֲרוֹן אַף adalah idiom bagi kemarahan yang sangat hebat. Terjemahan ini mempertahankan daya ungkapnya tanpa menerjemahkan unsur tubuh secara kaku.
- source_word: וְנָתַן לְךָ רַחֲמִים וְרִחַמְךָ
  choice: menunjukkan belas kasihan kepadamu, mengasihani engkau
  rationale: Dua ungkapan serumpun dipertahankan sebagai penguatan yang hampir bersinonim, sambil tetap dibedakan secara wajar dalam bahasa Indonesia.
- source_word: וְהִרְבֶּךָ
  choice: membuatmu bertambah banyak
  rationale: Bentuk kausatif verba רבה berarti membuat menjadi banyak; pilihan ini mempertahankan kaitannya dengan janji pertambahan keturunan.
- source_word: לַאֲבֹתֶיךָ
  choice: kepada nenek moyangmu
  rationale: Ungkapan Indonesia ini secara alami menunjuk kepada para leluhur Israel, khususnya penerima janji perjanjian, tanpa terdengar seolah hanya merujuk kepada ayah langsung.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Nama perjanjian yang tertulis dalam teks Ibrani ditampilkan sebagai nama diri, bukan diganti dengan gelar.
- issue: Makna חֵרֶם dalam konteks ini
  choice: apa yang dikhususkan untuk dimusnahkan
  alternative: barang yang terkena larangan pemusnahan
  rationale: Pilihan utama menyatakan baik unsur pengkhususan yang mutlak maupun tujuan pemusnahan yang dituntut konteks, tanpa memasukkan penjelasan doktrinal tambahan ke dalam teks.
- issue: Bahasa antropopatik tentang murka Allah
  choice: berpaling dari murka-Nya yang menyala-nyala
  alternative: surut dari kehangatan hidung-Nya
  rationale: Idiom Ibrani menyatakan murka yang hebat. Terjemahan mempertahankan sifat personal dan intensitas murka ilahi, tetapi tidak mengalihkan perhatian pembaca dengan ungkapan anggota tubuh yang tidak idiomatis dalam bahasa Indonesia.
- issue: Hubungan antara ketaatan dan belas kasihan dalam klausa tujuan
  choice: supaya Yahweh ... menunjukkan belas kasihan
  alternative: sehingga Yahweh ... menunjukkan belas kasihan
  rationale: לְמַעַן dapat membawa nuansa tujuan atau hasil. 'Supaya' mempertahankan hubungan yang dinyatakan teks tanpa menjabarkannya menjadi rumusan teologis yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Struktur kalimat dan pengulangan belas kasihan dipertahankan sedekat mungkin, tetapi idiom Ibrani dijadikan alami dan mudah dipahami. Kapitalisasi pronomina ilahi digunakan secara konsisten dalam ayat ini.
