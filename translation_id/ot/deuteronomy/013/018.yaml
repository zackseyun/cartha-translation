  terminology: ‘Yahweh’, ‘apa yang dikhususkan untuk dimusnahkan’, dan ‘murka-Nya yang menyala-nyala’ merupakan padanan yang baik. ‘Nenek moyangmu’ secara idiomatis mencakup para bapa leluhur dalam konteks janji perjanjian. Catatan b secara tepat menerangkan idiom חֲרוֹן אַף.
