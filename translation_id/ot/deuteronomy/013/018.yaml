  - severity: low
    issue: Pronomina orang kedua tidak konsisten
    rationale: ‘Menunjukkan belas kasihan kepadamu, mengasihani engkau’ mencampurkan bentuk enklitik dan bentuk bebas. ‘Mengasihanimu’ mempertahankan register modern baku dan paralelisme.
