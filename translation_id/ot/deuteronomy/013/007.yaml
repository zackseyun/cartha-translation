  text: כִּ֣י יְסִֽיתְ/ךָ֡ אָחִ֣י/ךָ בֶן אִ֠מֶּ/ךָ אֽוֹ בִנְ/ךָ֨ אֽוֹ בִתְּ/ךָ֜ א֣וֹ אֵ֣שֶׁת חֵיקֶ֗/ךָ א֧וֹ רֵֽעֲ/ךָ֛ אֲשֶׁ֥ר כְּ/נַפְשְׁ/ךָ֖ בַּ/סֵּ֣תֶר לֵ/אמֹ֑ר נֵֽלְכָ֗ה וְ/נַֽעַבְדָה֙ אֱלֹהִ֣ים אֲחֵרִ֔ים אֲשֶׁר֙ לֹ֣א יָדַ֔עְתָּ אַתָּ֖ה וַ/אֲבֹתֶֽי/ךָ־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/007.yaml
  text: If your brother[a], the son of your mother, or your son or your daughter, or the wife of your embrace, or your friend who is like your own soul, secretly entices you, saying[b], ‘Let us go and serve other gods’—gods that neither you nor your fathers have known—
translation:
  language: id
  text: Jika saudara laki-lakimu, anak laki-laki ibumu, atau anak laki-lakimu atau anak perempuanmu, atau istri dalam dekapanmu[a], atau sahabatmu yang seperti nyawamu sendiri[b], diam-diam membujukmu dengan berkata, “Mari kita pergi dan mengabdi kepada ilah-ilah lain”—ilah-ilah yang tidak dikenal olehmu maupun oleh nenek moyangmu—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “istri dari dada/pangkuanmu.” Kata Ibrani ini juga dapat merujuk pada dekapan dan mengungkapkan keintiman perkawinan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “sahabatmu yang seperti jiwamu sendiri” atau “yang seperti dirimu sendiri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְסִיתְךָ
  choice: membujukmu
  rationale: Bentuk Hifil dari סות berarti membujuk, memikat, atau menghasut seseorang agar mengikuti suatu tindakan. “Membujukmu” alami dalam bahasa Indonesia dan tetap menyatakan upaya memengaruhi tanpa menentukan secara berlebihan caranya.
- source_word: אָחִיךָ בֶן אִמֶּךָ
  choice: saudara laki-lakimu, anak laki-laki ibumu
  rationale: Aposisi Ibrani dipertahankan untuk menonjolkan ikatan keluarga yang sangat dekat, bukan diringkas menjadi sekadar “saudara kandungmu”.
- source_word: אֵשֶׁת חֵיקֶךָ
  choice: istri yang kaupeluk erat
  rationale: חֵיק secara harfiah menunjuk pada dada, pangkuan, atau dekapan. Ungkapan ini diterjemahkan secara wajar sebagai gambaran keintiman perkawinan tanpa memakai ungkapan Indonesia yang terasa kuno.
- source_word: רֵעֲךָ אֲשֶׁר כְּנַפְשְׁךָ
  choice: sahabatmu yang seperti nyawamu sendiri
  rationale: נֶפֶשׁ dapat berarti nyawa, jiwa, atau diri. “Seperti nyawamu sendiri” mempertahankan intensitas gambaran Ibrani mengenai seorang sahabat yang amat dekat.
- source_word: בַּסֵּתֶר
  choice: diam-diam
  rationale: Frasa ini berarti “secara rahasia.” “Diam-diam” merupakan padanan adverbial yang alami dalam bahasa Indonesia.
- source_word: נֵלְכָה וְנַעַבְדָה
  choice: Mari kita pergi dan mengabdi kepada
  rationale: Kedua bentuk kohortatif menyampaikan ajakan. “Pergi dan mengabdi kepada” mempertahankan unsur gerak serta cakupan עבד sebagai pelayanan religius, tidak mempersempitnya hanya menjadi tindakan ibadah tertentu.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ilah-ilah lain
  rationale: אֲחֵרִים berarti “lain.” “Ilah-ilah lain” menerjemahkan ungkapan itu secara langsung tanpa menambahkan gagasan “asing” yang tidak dinyatakan oleh kata Ibraninya.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: yang tidak dikenal olehmu maupun oleh nenek moyangmu
  rationale: ידע di sini menyatakan pengenalan atau pengakuan religius. Susunan “olehmu maupun oleh nenek moyangmu” mempertahankan kedua subjek secara jelas dan alami.
theological_decisions:
- issue: Penerjemahan ungkapan kekerabatan dan keintiman
  choice: Mempertahankan gambaran konkret melalui “anak laki-laki ibumu,” “istri yang kaupeluk erat,” dan “sahabatmu yang seperti nyawamu sendiri.”
  alternative: Meratakannya menjadi “saudara kandungmu,” “istri tercintamu,” dan “sahabat terdekatmu.”
  rationale: Rangkaian sumber sengaja menyebut hubungan manusia yang paling dekat untuk memperkuat peringatan. Gambaran itu dipertahankan tanpa menambahkan penilaian emosional yang tidak dinyatakan secara eksplisit.
- issue: Makna עבד dalam hubungan dengan ilah-ilah lain
  choice: mengabdi kepada
  alternative: menyembah
  rationale: עבד mencakup pelayanan atau pengabdian religius, termasuk penyembahan, tetapi tidak terbatas pada tindakan liturgis. “Mengabdi kepada” menjaga keluasan maknanya.
- issue: Status sebutan אֱלֹהִים אֲחֵרִים
  choice: ilah-ilah lain
  alternative: dewa-dewa asing
  rationale: Terjemahan mengikuti sebutan dalam teks tanpa menyelesaikan pertanyaan ontologis mengenai ilah-ilah itu atau memasukkan unsur “asing” yang tidak terdapat dalam kata sifat אֲחֵרִים.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk terikat “kau-” dipakai secara konsisten untuk sapaan tunggal. Tanda pisah pada akhir ayat dipertahankan karena kalimat berlanjut ke ayat berikutnya. Penanda catatan kaki ditempatkan tepat sesudah ungkapan yang dijelaskannya.
