  text: אֵ֣ת כָּל הַ/דָּבָ֗ר אֲשֶׁ֤ר אָנֹכִי֙ מְצַוֶּ֣ה אֶתְ/כֶ֔ם אֹת֥/וֹ תִשְׁמְר֖וּ לַ/עֲשׂ֑וֹת לֹא תֹסֵ֣ף עָלָ֔י/ו וְ/לֹ֥א תִגְרַ֖ע מִמֶּֽ/נּוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/001.yaml
  text: Every word that I am commanding you[a], you shall be careful to do. You shall not add to it[b], and you shall not take away from it.
translation:
  language: id
  text: Segala yang kuperintahkan kepadamu haruslah kamu lakukan dengan saksama. Jangan menambahinya dan jangan menguranginya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam sebagian tradisi penomoran Alkitab, ayat ini bernomor Ulangan 12:32.
    reason: textual_variant
lexical_decisions:
- source_word: כָּל הַדָּבָר
  choice: Segala yang
  rationale: Ungkapan ini menyampaikan cakupan menyeluruh dari bentuk Ibrani kolektif tunggal secara wajar dalam bahasa Indonesia, tanpa mempersempit דָּבָר menjadi hanya kata-kata terpisah.
- source_word: מְצַוֶּה אֶתְכֶם
  choice: kuperintahkan kepadamu
  rationale: Partisipel Ibrani menyatakan perintah yang sedang disampaikan dalam konteks ini; bentuk Indonesia ini alami dan tetap mempertahankan pembicara orang pertama serta penerima jamak secara kontekstual.
- source_word: תִשְׁמְרוּ לַעֲשׂוֹת
  choice: haruslah kamu lakukan dengan sungguh-sungguh
  rationale: Idiom שׁמר dengan infinitif menuntut ketaatan yang saksama. Pilihan ini menyampaikan daya kewajiban dan perhatian untuk melaksanakan, bukan sekadar menyimpan.
- source_word: לֹא תֹסֵף עָלָיו
  choice: Jangan menambahinya
  rationale: Bentuk larangan dengan יסף dan עַל berarti menambahkan sesuatu kepada keseluruhan yang diperintahkan.
- source_word: וְלֹא תִגְרַע מִמֶּנּוּ
  choice: dan jangan menguranginya
  rationale: גרע berarti mengurangi atau mengambil sebagian; 'menguranginya' ringkas, tepat, dan sejajar dengan 'menambahinya'.
- source_word: אָנֹכִי
  choice: ku-
  rationale: Pronomina mandiri orang pertama diwujudkan secara alami dalam prefiks verbal bahasa Indonesia; penekanan tambahan tidak dipaksakan karena konteks sudah menyatakan otoritas pembicara.
theological_decisions:
- issue: Cakupan 'segala yang'
  choice: Mempertahankan rujukan luas kepada seluruh isi perintah yang disampaikan
  alternative: Menerjemahkan sebagai 'setiap perkataan' atau mempersempitnya menjadi 'setiap perintah'
  rationale: דָּבָר dapat berarti perkataan, perkara, atau isi yang disampaikan. 'Segala yang' menjaga cakupan kolektif dan tidak mengimpor pembatasan teologis yang tidak dinyatakan teks.
- issue: Hubungan wacana dan penomoran ayat
  choice: Menerjemahkan ayat sebagai perintah lengkap tanpa memasukkan isi ayat berikutnya
  alternative: Mengaitkannya secara eksplisit dengan bagian sebelumnya atau mengikuti penomoran 12:32 dalam teks utama
  rationale: Ayat Ibrani membentuk perintah lengkap sekaligus peralihan menuju ketentuan berikutnya; perbedaan penomoran cukup dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'haruslah' mempertahankan daya perintah, sedangkan 'dengan sungguh-sungguh' menyampaikan unsur ketelitian dalam idiom Ibrani. Penanda catatan kaki ditempatkan pada akhir ayat karena catatan menyangkut penomoran seluruh ayat.
