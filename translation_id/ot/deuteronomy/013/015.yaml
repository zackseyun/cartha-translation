  text: and you shall investigate[a], and search out, and inquire thoroughly; and behold, if it is true and certain that this abomination has been done in your midst,
translation:
  language: id
  text: Maka engkau harus menyelidiki, memeriksa, dan meminta keterangan dengan saksama; dan jika ternyata perkara itu benar dan telah dipastikan bahwa kekejian ini telah dilakukan di tengah-tengahmu,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְדָרַשְׁתָּ
  choice: engkau harus menyelidiki
  rationale: Dalam konteks hukum, דרש menunjuk pada penyelidikan resmi. Bentuk 'harus' menyampaikan tuntutan hukum dengan wajar dalam bahasa Indonesia.
- source_word: וְחָקַרְתָּ
  choice: memeriksa
  rationale: חקר menambahkan unsur pemeriksaan yang cermat dan dibedakan secara alami dari verba sebelumnya.
- source_word: וְשָׁאַלְתָּ הֵיטֵב
  choice: menanyakannya dengan saksama
  rationale: שאל berarti bertanya atau meminta keterangan, sedangkan הֵיטֵב menguatkannya sebagai tindakan yang dilakukan dengan saksama.
- source_word: וְהִנֵּה
  choice: Jika ternyata
  rationale: Dalam rumusan hukum ini, הנה memperkenalkan hasil yang ditemukan sesudah penyelidikan; 'ternyata' menyampaikan fungsi tersebut secara alami, sedangkan 'jika' menyatakan hubungan kondisional yang tersirat dalam konteks.
- source_word: אֱמֶת נָכוֹן הַדָּבָר
  choice: benar dan terbukti
  rationale: Ungkapan ini menegaskan bahwa perkara yang dilaporkan bukan hanya benar, tetapi juga telah dipastikan atau diteguhkan. 'Terbukti' sesuai dengan konteks pemeriksaan hukum.
- source_word: נֶעֶשְׂתָה
  choice: telah dilakukan
  rationale: Bentuk pasif Niphal menyatakan bahwa perbuatan tersebut telah terjadi atau dilakukan; bentuk perfektif Indonesia sesuai dengan kesimpulan penyelidikan.
- source_word: הַתּוֹעֵבָה הַזֹּאת
  choice: kekejian ini
  rationale: '''Kekejian'' mempertahankan bobot moral dan perjanjian dari תועבה tanpa mempersempitnya menjadi kategori tertentu.'
- source_word: בְּקִרְבֶּךָ
  choice: di tengah-tengahmu
  rationale: Ungkapan ini menunjukkan bahwa perbuatan tersebut terjadi di dalam komunitas yang disapa secara kolektif.
theological_decisions:
- issue: Rumus pembuktian hukum
  choice: Jika ternyata benar dan terbukti bahwa kekejian ini telah dilakukan di tengah-tengahmu
  alternative: jika laporan itu benar dan perkara itu telah dipastikan
  rationale: Terjemahan utama mempertahankan penumpukan gagasan kebenaran dan kepastian sesudah penyelidikan, tanpa menentukan bahwa הַדָּבָר semata-mata berarti 'laporan'. Ambiguitas rujukannya tetap terjaga.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Deretan tiga tindakan pemeriksaan dipertahankan untuk mencerminkan penekanan teks hukum Ibrani. Ayat dibiarkan berakhir dengan koma karena secara sintaksis berlanjut ke ayat berikutnya.
