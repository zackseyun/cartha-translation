  - severity: low
    issue: Titik setelah deretan verba melemahkan kesinambungan sintaktis dengan rumus hasil pemeriksaan.
    rationale: Teks Ibrani menghubungkan penyelidikan dan temuan dalam satu rangkaian. Titik koma lebih wajar dalam bahasa Indonesia sambil tetap mempertahankan koma akhir karena ayat berlanjut.
