  source_fidelity: Deretan tiga verba pemeriksaan, rumus verifikasi, istilah “kekejian,” dan penutup yang menggantung bagi kelanjutan ayat dipertahankan. Namun, “menanyakannya” kurang tepat secara idiomatis karena dalam bahasa Indonesia dapat terdengar seperti mengajukan pertanyaan kepada perkara itu sendiri; שאל dalam konteks ini lebih alami sebagai meminta keterangan atau mengadakan tanya jawab/inquiry.
  naturalness: Revisi memakai “meminta keterangan dengan saksama,” yang lazim dalam register pemeriksaan hukum modern dan tetap membedakan tindakan ini dari menyelidiki dan memeriksa. Titik koma mempertahankan hubungan langsung antara proses penyelidikan dan hasilnya.
  terminology: “Kekejian” merupakan padanan yang tepat dan cukup kuat bagi תּוֹעֵבָה. “Perkara itu benar dan telah dipastikan” menyatakan אמת, נכון, dan הדבר tanpa menentukan secara sempit apakah yang dimaksud adalah laporan atau perkara.
