  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַחֲרֵ֨י יְהוָ֧ה אֱלֹהֵי/כֶ֛ם תֵּלֵ֖כוּ וְ/אֹת֣/וֹ תִירָ֑אוּ וְ/אֶת מִצְוֺתָ֤י/ו תִּשְׁמֹ֨רוּ֙ וּ/בְ/קֹל֣/וֹ תִשְׁמָ֔עוּ וְ/אֹת֥/וֹ תַעֲבֹ֖דוּ וּ/ב֥/וֹ תִדְבָּקֽוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/005.yaml
  text: You shall walk after Yahweh your God and fear him[a], and keep his commandments and listen to his voice, and serve him[c][b], and cling to him.
translation:
  language: id
  text: Hendaklah kalian berjalan mengikuti Yahweh, Allah kalian,[a] takut kepada-Nya, menaati perintah-perintah-Nya, mendengarkan suara-Nya,[b] melayani Dia, dan berpaut kepada-Nya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berjalan di belakang Yahweh, Allah kalian”; maksudnya mengikuti Dia dengan setia.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “mendengarkan suara-Nya” juga mengandung arti menaati-Nya.
    reason: lexical_alternative
  - marker: c
    text: Atau “berpegang teguh kepada-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרֵי יְהוָה אֱלֹהֵיכֶם תֵּלֵכוּ
  choice: berjalan mengikuti Yahweh, Allah kalian
  rationale: Ungkapan Ibrani secara harfiah menggambarkan berjalan di belakang seseorang dan secara idiomatis menyatakan tindakan mengikuti dengan kesetiaan. Frasa 'berjalan mengikuti' mempertahankan gambaran aslinya sekaligus tetap wajar dalam bahasa Indonesia. 'Kalian' menyatakan bentuk jamak orang kedua dalam teks sumber.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, agar nama perjanjian dalam teks Ibrani tetap tampak.
- source_word: תִירָאוּ
  choice: takut kepada-Nya
  rationale: Kata ירא dalam hubungan dengan Allah mencakup rasa takut, hormat, dan gentar. 'Takut kepada-Nya' mempertahankan bobot dan keluasan istilah perjanjian ini tanpa mempersempitnya menjadi rasa hormat saja.
- source_word: מִצְוֺתָיו תִּשְׁמֹרוּ
  choice: menaati perintah-perintah-Nya
  rationale: Secara harfiah שׁמר berarti menjaga atau memelihara; ketika objeknya perintah, maknanya ialah memegang dan melaksanakannya. 'Menaati' menyampaikan maksud tersebut secara alami dalam bahasa Indonesia.
- source_word: וּבְקֹלוֹ תִשְׁמָעוּ
  choice: mendengarkan suara-Nya
  rationale: Terjemahan ini mempertahankan gambaran eksplisit 'mendengarkan suara-Nya'. Dalam pemakaian Ibrani, ungkapan itu juga menyiratkan ketaatan; nuansa tersebut dijelaskan dalam catatan kaki tanpa menggantikan ungkapan sumber.
- source_word: תַעֲבֹדוּ
  choice: melayani Dia
  rationale: עבד dapat mencakup pelayanan dan ibadah kepada Allah. 'Melayani' mempertahankan cakupan yang lebih luas dan tidak membatasinya hanya pada kegiatan ibadah.
- source_word: תִדְבָּקוּן
  choice: berpaut kepada-Nya
  rationale: דבק menyatakan keterikatan yang erat dan teguh. 'Berpaut' mempertahankan daya relasional serta kesetiaan perjanjian yang terkandung dalam kata tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi. Transliterasi 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Cakupan makna takut kepada Allah
  choice: takut kepada-Nya
  alternative: menghormati-Nya
  rationale: Pilihan utama mempertahankan ketegangan makna antara takut, gentar, dan hormat dalam ירא, sedangkan 'menghormati' saja dapat melembutkan maknanya.
- issue: Makna שׁמע בְּקוֹל sebagai mendengar dan menaati
  choice: mendengarkan suara-Nya
  alternative: menaati-Nya
  rationale: Teks utama mempertahankan ungkapan konkret dalam bahasa Ibrani, sementara catatan kaki menyebutkan bahwa mendengarkan dalam konteks ini juga mengandung tuntutan untuk taat.
- issue: Makna pelayanan kepada Allah dalam תַעֲבֹדוּ
  choice: melayani Dia
  alternative: beribadah kepada-Nya
  rationale: '''Melayani'' tidak mempersempit kata tersebut pada tindakan kultis saja, tetapi tetap dapat mencakup ibadah dan pengabdian perjanjian.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'kalian' dipakai untuk mempertahankan orang kedua jamak dari teks Ibrani. Rangkaian 'hendaklah' dengan verba sejajar menyampaikan daya perintah dari bentuk verbal Ibrani secara alami, sedangkan kapitalisasi pronomina ilahi mengikuti kebiasaan hormat yang umum dalam penerbitan Alkitab bahasa Indonesia.
