  source_fidelity: 'Teks Indonesia mencerminkan dengan setia urutan dan cakupan enam tuntutan dalam Ibrani: mengikuti/berjalan di belakang Yahweh, takut kepada-Nya, menaati perintah-perintah-Nya, mendengarkan suara-Nya, melayani Dia, dan berpaut kepada-Nya. Bentuk orang kedua jamak dipertahankan melalui “kalian.” Nuansa ketaatan dalam “mendengarkan suara-Nya” tepat dibiarkan tersirat dalam teks utama dan dijelaskan dalam catatan kaki.'
