  text: מֵ/אֱלֹהֵ֣י הָֽ/עַמִּ֗ים אֲשֶׁר֙ סְבִיבֹ֣תֵי/כֶ֔ם הַ/קְּרֹבִ֣ים אֵלֶ֔י/ךָ א֖וֹ הָ/רְחֹקִ֣ים מִמֶּ֑/ךָּ מִ/קְצֵ֥ה הָ/אָ֖רֶץ וְ/עַד קְצֵ֥ה הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/008.yaml
  text: from the gods of the peoples that are around you[a], whether near to you or far from you, from one end of the earth to the other end of the earth—
translation:
  language: id
  text: dari ilah-ilah bangsa-bangsa yang di sekelilingmu, baik yang dekat denganmu maupun yang jauh darimu, dari satu ujung bumi sampai ke ujung bumi yang lain[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dari satu ujung negeri sampai ke ujung negeri yang lain.” Kata Ibrani אֶרֶץ dapat berarti “bumi” atau “negeri.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאֱלֹהֵי
  choice: dari ilah-ilah
  rationale: Preposisi מִן menyatakan sumber atau kelompok yang dirujuk. Bentuk jamak “ilah-ilah” mempertahankan acuan kepada dewa-dewa bangsa lain, sedangkan huruf kecil membedakannya dari sebutan bagi Allah Israel.
- source_word: הָעַמִּים
  choice: bangsa-bangsa
  rationale: עַמִּים menunjuk kepada berbagai kelompok etnis atau bangsa. “Bangsa-bangsa” merupakan padanan Indonesia yang alami dalam konteks Ulangan.
- source_word: אֲשֶׁר סְבִיבֹתֵיכֶם
  choice: di sekelilingmu
  rationale: Ungkapan ini menyatakan letak bangsa-bangsa yang mengelilingi umat. Bentuk ringkas ini alami dalam bahasa Indonesia dan tetap mempertahankan makna spasialnya.
- source_word: הַקְּרֹבִים אֵלֶיךָ א֖וֹ הָרְחֹקִים מִמֶּךָּ
  choice: baik yang dekat maupun yang jauh darimu
  rationale: Pasangan “baik ... maupun ...” menyampaikan cakupan kedua kutub jarak secara wajar. “Darimu” secara eksplisit menyertai unsur jauh, sebagaimana dalam teks Ibrani, sementara relasi yang sama dipahami pada unsur dekat.
- source_word: מִקְצֵה הָאָרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: dari ujung bumi sampai ke ujung bumi
  rationale: Pengulangan “ujung bumi” mengikuti struktur Ibrani dan menegaskan cakupan geografis yang menyeluruh. “Bumi” mempertahankan daya retoris ungkapan yang luas, tanpa menghapus kemungkinan arti “negeri” dalam catatan kaki.
theological_decisions:
- issue: Cakupan הָאָרֶץ dalam ungkapan penutup
  choice: bumi
  alternative: negeri
  rationale: אֶרֶץ dapat berarti “bumi” atau “negeri.” Dalam ungkapan merismatik dari ujung ke ujung ini, “bumi” paling baik menyampaikan keluasan retorisnya, tetapi kemungkinan pembacaan “negeri” tetap dicatat agar ambiguitas leksikal sumber tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “ilah-ilah” mudah dipahami serta tepat bagi dewa-dewa bangsa lain. Tanda pisah pada akhir dipertahankan karena ayat ini merupakan bagian dari kalimat yang berlanjut dari dan ke konteks sekitarnya.
