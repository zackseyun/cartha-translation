  text: כִּֽי תִשְׁמַ֞ע בְּ/אַחַ֣ת עָרֶ֗י/ךָ אֲשֶׁר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ נֹתֵ֥ן לְ/ךָ֛ לָ/שֶׁ֥בֶת שָׁ֖ם לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/013.yaml
  text: If you hear it said in one of your cities that Yahweh your God is giving you to dwell there[a], saying[b],
translation:
  language: id
  text: 'Jika[a] kamu mendengar kabar tentang salah satu kotamu yang Yahweh, Allahmu, berikan kepadamu agar kamu tinggal di sana[b], demikian:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Ketika” atau “Apabila”; kata penghubung Ibrani ini dapat memperkenalkan keadaan bersyarat maupun waktu dalam bahan hukum.
    reason: lexical_alternative
  - marker: b
    text: Atau “agar kamu menetap di sana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Jika
  rationale: Dalam rumusan hukum kasuistik ini, kata tersebut memperkenalkan keadaan bersyarat. Catatan kaki mempertahankan kemungkinan nuansa waktu, yaitu “ketika” atau “apabila”.
- source_word: תִשְׁמַע
  choice: kamu mendengar kabar
  rationale: Kata kerja שׁמע di sini berarti menerima suatu laporan, bukan sekadar mendengarkan. Penambahan “kabar” membuat maksud itu jelas dan alami dalam bahasa Indonesia.
- source_word: בְּאַחַת עָרֶיךָ
  choice: di salah satu kotamu
  rationale: עִיר dapat berarti kota atau permukiman; “kota” merupakan padanan umum dan mempertahankan sapaan orang kedua tunggal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” dan tidak diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Padanan ini mempertahankan ungkapan perjanjian dan akhiran orang kedua tunggal.
- source_word: נֹתֵן לְךָ
  choice: berikan kepadamu
  rationale: Bentuk partisip Ibrani menggambarkan tindakan Yahweh dalam menganugerahkan kota-kota itu. Bentuk kini sederhana dalam bahasa Indonesia lebih alami daripada “sedang memberikan” dalam klausa relatif ini.
- source_word: לָשֶׁבֶת שָׁם
  choice: agar kamu tinggal di sana
  rationale: Konstruksi infinitif menyatakan tujuan atau hasil pemberian kota tersebut. “Tinggal” bersifat modern dan luas, sedangkan kemungkinan makna “menetap” dicatat.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Kata ini memperkenalkan isi laporan yang berlanjut pada ayat berikutnya. “Demikian:” berfungsi alami sebagai pengantar kutipan atau isi laporan dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian יְהוָה secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama pribadi tanpa menggantinya dengan gelar.
- issue: Nuansa pemberian kota-kota oleh Allah
  choice: yang Yahweh, Allahmu, berikan kepadamu
  alternative: yang sedang Yahweh, Allahmu, berikan kepadamu
  rationale: Pilihan ini mempertahankan Yahweh sebagai pelaku pemberian, tetapi menghindari kesan bahwa tindakan itu harus sedang berlangsung tepat pada saat laporan didengar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk tunggal “kamu”, “kotamu”, dan “Allahmu” dipertahankan sesuai sapaan maskulin tunggal dalam teks Ibrani. Tanda titik dua menunjukkan bahwa isi laporan menyusul pada ayat berikutnya.
