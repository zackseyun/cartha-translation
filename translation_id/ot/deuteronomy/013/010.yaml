  text: כִּ֤י הָרֹג֙ תַּֽהַרְגֶ֔/נּוּ יָֽדְ/ךָ֛ תִּֽהְיֶה בּ֥/וֹ בָ/רִֽאשׁוֹנָ֖ה לַ/הֲמִית֑/וֹ וְ/יַ֥ד כָּל הָ/עָ֖ם בָּ/אַחֲרֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/010.yaml
  text: For you must surely put him to death; your hand shall be first against him to put him to death[a], and afterward the hand of all the people.
translation:
  language: id
  text: Sebab, engkau harus benar-benar membunuhnya[a]; engkaulah yang harus pertama-tama mengangkat tangan terhadap dia untuk membunuhnya, lalu seluruh rakyat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “membunuh, engkau harus membunuhnya.” Dalam bahasa Ibrani, infinitif absolut dipakai bersama verba finit dari akar yang sama untuk memberi penegasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini menghubungkan perintah dalam ayat ini dengan larangan sebelumnya dan memperkenalkan dasar atau penjelasannya.
- source_word: הָרֹג תַּהַרְגֶנּוּ
  choice: engkau harus benar-benar membunuh dia
  rationale: Gabungan infinitif absolut dan verba finit menegaskan tindakan sebagai kewajiban yang pasti; bentuk ini mempertahankan pengulangan akar הרג yang juga dijelaskan dalam catatan kaki.
- source_word: יָדְךָ
  choice: tanganmu
  rationale: Ungkapan konkret Ibrani dipertahankan karena menjadi sejajar dengan 'tangan seluruh rakyat' dan menunjukkan keterlibatan langsung.
- source_word: תִּהְיֶה בּוֹ בָרִאשׁוֹנָה
  choice: harus menjadi yang pertama melawan dia
  rationale: Terjemahan ini mempertahankan gagasan prioritas tindakan serta nuansa adversatif dari בּוֹ dalam konteks pelaksanaan hukuman.
- source_word: לַהֲמִיתוֹ
  choice: untuk membunuhnya
  rationale: Bentuk kausatif dari מות berarti menyebabkan kematian. Dalam bahasa Indonesia, 'membunuhnya' menyampaikan tindakan itu secara langsung tanpa mengaburkankan kerasnya ketentuan hukum.
- source_word: וְיַד כָּל הָעָם
  choice: kemudian tangan seluruh rakyat
  rationale: Ungkapan 'tangan' dipertahankan agar kesejajarannya dengan 'tanganmu' tetap tampak dan partisipasi komunal tidak diratakan menjadi sekadar subjek verbal.
- source_word: בָּאַחֲרֹנָה
  choice: kemudian
  rationale: Dalam pertentangan dengan 'yang pertama', kata ini menandai tindakan yang menyusul; 'kemudian' alami dalam bahasa Indonesia.
theological_decisions:
- issue: Bahasa pelaksanaan hukuman mati yudisial
  choice: membunuh dia / membunuhnya
  alternative: menghukum mati dia / membuatnya mati
  rationale: Teks memakai dua akar berbeda, הרג dan מות. Terjemahan utama mempertahankan tindakan kematian secara lugas dan tidak melunakkannya, sementara catatan kaki menjelaskan penegasan khusus pada frasa pertama tanpa memasukkan penafsiran denominasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti tunggal 'engkau' mempertahankan peralihan langsung kepada orang yang diajak bertindak. Struktur 'tanganmu ... tangan seluruh rakyat' sengaja dipertahankan untuk menjaga citra hukum dan paralelisme Ibrani.
