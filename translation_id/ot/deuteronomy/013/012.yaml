  text: וְ/כָל יִשְׂרָאֵ֔ל יִשְׁמְע֖וּ וְ/יִֽרָא֑וּ/ן וְ/לֹֽא יוֹסִ֣פוּ לַ/עֲשׂ֗וֹת כַּ/דָּבָ֥ר הָ/רָ֛ע הַ/זֶּ֖ה בְּ/קִרְבֶּֽ/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/012.yaml
  text: And all Israel shall hear and fear[a], and they shall not again do this evil thing in your midst.
translation:
  language: id
  text: Seluruh Israel akan mendengar dan menjadi takut, dan mereka tidak akan lagi melakukan perbuatan jahat seperti ini di tengah-tengahmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di antaramu.” Bahasa Ibrani memakai bentuk sapaan tunggal bagi Israel sebagai satu umat.
    reason: Menjelaskan alternatif leksikal dan bentuk sapaan korporat tunggal dalam teks Ibrani.
lexical_decisions:
- source_word: וְכָל יִשְׂרָאֵל
  choice: Seluruh Israel
  rationale: כָּל bersama nama diri Israel menunjuk kepada seluruh umat secara kolektif. “Seluruh Israel” alami dan tepat dalam bahasa Indonesia.
- source_word: יִשְׁמְעוּ
  choice: akan mendengar
  rationale: Bentuk imperfek Qal orang ketiga jamak dari שׁמע menyatakan hasil atau keadaan pada masa mendatang dalam konteks hukum ini.
- source_word: וְיִרָאוּן
  choice: dan menjadi takut
  rationale: Kata ירא di sini menyatakan rasa takut yang berfungsi sebagai pencegah. “Menjadi takut” terdengar alami tanpa mempersempit maknanya menjadi kengerian semata.
- source_word: וְלֹא יוֹסִפוּ לַעֲשׂוֹת
  choice: dan mereka tidak akan lagi melakukan
  rationale: Ungkapan יסף yang diikuti infinitif lazim berarti mengulangi atau melakukan lagi. Susunan ini menyampaikan pencegahan terhadap pengulangan perbuatan tersebut.
- source_word: כַּדָּבָר הָרָע הַזֶּה
  choice: perbuatan jahat seperti ini
  rationale: דָּבָר dapat berarti perkara, hal, atau tindakan; konteks hukum menunjuk pada tindakan yang baru disebutkan. Unsur כַּ paling wajar disampaikan dengan “seperti ini”.
- source_word: בְּקִרְבֶּךָ
  choice: di tengah-tengahmu
  rationale: Terjemahan ini mempertahankan gambaran harfiah “di tengahmu” serta akhiran orang kedua tunggal yang menyapa Israel sebagai satu umat.
theological_decisions:
- issue: Bentuk tunggal dalam sapaan perjanjian kepada Israel
  choice: Mempertahankan bentuk tunggal “di tengah-tengahmu”
  alternative: di antara kalian
  rationale: Akhiran Ibrani berbentuk maskulin tunggal dan menyapa Israel secara korporat sebagai satu umat. Bentuk “-mu” mempertahankan ciri sumber tanpa menambahkan penafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur antarklausa dipertahankan cukup dekat dengan teks Ibrani, sementara “perbuatan jahat seperti ini” dipilih agar makna hukum konkret terdengar alami bagi pembaca umum.
