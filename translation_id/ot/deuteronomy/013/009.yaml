  rationale: Revisi tunggal mengganti “menyayangkannya” dengan “mengampuninya” untuk mencerminkan חמל secara lebih tepat dalam konteks yuridis, serta untuk membedakannya dengan חוס (‘matamu merasa iba’). Rangkaian lima larangan, orang kedua tunggal, dan ambiguitas cakupan ‘menyembunyikan’ tetap dipertahankan. Semua jangkar catatan kaki tetap melekat pada unsur yang relevan.
