  naturalness: Bahasa draf baku dan mudah dipahami. Susunan yang direvisi tetap mempertahankan gaya hukum yang tegas, tetapi memakai “mengampuninya” yang lebih lazim dan lebih tajam dalam konteks larangan untuk memberi kelonggaran.
  terminology: “Menuruti dia,” “mendengarkan dia,” dan “menyembunyikannya” sesuai dengan konteks dan makna leksikal. Idiom ‘matamu merasa iba’ patut dipertahankan. Untuk חמל, “mengampuninya” secara idiomatis mewakili ‘spare’ tanpa mengaburkan perbedaannya dari חוס.
