base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/009.yaml
  text: You shall not yield to him or listen to him[a], and your eye shall not pity him, and you shall not spare[c][b], and you shall not conceal him.
translation:
  language: id
  text: Janganlah engkau menuruti dia[a] atau mendengarkan dia. Janganlah matamu merasa iba kepadanya[b]; janganlah engkau mengampuninya ataupun menyembunyikannya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyetujui dia” atau “mengalah kepadanya.” Kata Ibraninya dapat berarti bersedia, menyetujui, atau menuruti.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “janganlah matamu merasa iba kepadanya,” sebuah ungkapan Ibrani yang melarang pandangan penuh belas kasihan yang membuat orang itu dibiarkan.
    reason: cultural_note
  - marker: c
    text: Atau “menutup-nutupinya”—yakni menyembunyikan orang itu atau menutupi kesalahannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹאבֶה לוֹ
  choice: menuruti dia
  rationale: Kata אָבָה dalam bentuk Qal dapat menyatakan kesediaan, persetujuan, atau tindakan mengalah kepada seseorang. Dalam konteks bujukan untuk menyembah ilah lain, “menuruti dia” secara wajar menyampaikan penolakan untuk menyetujui atau mengikuti bujukannya.
- source_word: תִשְׁמַע אֵלָיו
  choice: mendengarkan dia
  rationale: שׁמע dengan אֶל berarti mendengarkan atau mengindahkan. Pilihan ini mempertahankan cakupan maknanya tanpa mempersempitnya menjadi ketaatan penuh.
- source_word: תָחוֹס עֵינְךָ עָלָיו
  choice: matamu merasa iba kepadanya
  rationale: חוּס menyatakan rasa iba, belas kasihan, atau tindakan menyayangkan seseorang. Ungkapan ini mempertahankan gambaran eksplisit tentang “mata” dalam idiom Ibrani.
- source_word: תַחְמֹל
  choice: menyayangkannya
  rationale: חמל dapat berarti merasa kasihan atau menyayangkan sehingga tidak menjatuhkan tindakan yang dituntut. “Menyayangkannya” membedakan verba ini dari חוּס sebelumnya sambil mempertahankan daya kumulatif larangan.
- source_word: תְכַסֶּה עָלָיו
  choice: menyembunyikannya
  rationale: כסה dalam bentuk Piel berarti menutupi atau menyembunyikan. Objek pronominal dipertahankan sebagai orangnya, tanpa secara diam-diam membatasi makna pada penyembunyian orang atau penutupan kesalahannya saja.
theological_decisions:
- issue: Bahasa hukum perjanjian yang keras terhadap orang yang membujuk kepada kemurtadan
  choice: Mempertahankan rangkaian larangan langsung tanpa memperhalusnya menjadi sekadar ketidaksetujuan batin.
  alternative: Mengungkapkannya hanya sebagai larangan bersimpati atau secara umum melindungi orang tersebut.
  rationale: 'Teks Ibrani menumpuk lima larangan: tidak menuruti, tidak mendengarkan, tidak memandang dengan iba, tidak menyayangkan, dan tidak menyembunyikan. Terjemahan mempertahankan ketegangan serta kerasnya konteks hukum itu tanpa menambahkan penafsiran denominatif.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “janganlah engkau” dipakai untuk mempertahankan nada hukum yang tegas serta sapaan orang kedua tunggal dalam teks Ibrani. Pengulangan larangan dipertahankan, sementara tanda titik koma membantu keterbacaan.
