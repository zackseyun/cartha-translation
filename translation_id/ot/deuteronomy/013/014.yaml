  text: יָצְא֞וּ אֲנָשִׁ֤ים בְּנֵֽי בְלִיַּ֨עַל֙ מִ/קִּרְבֶּ֔/ךָ וַ/יַּדִּ֛יחוּ אֶת יֹשְׁבֵ֥י עִירָ֖/ם לֵ/אמֹ֑ר נֵלְכָ֗ה וְ/נַעַבְדָ֛ה אֱלֹהִ֥ים אֲחֵרִ֖ים אֲשֶׁ֥ר לֹא יְדַעְתֶּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/014.yaml
  text: Certain worthless men have gone out from among you and have led the inhabitants of their city astray[a], saying, ‘Let us go and serve other gods,’ which you have not known.
translation:
  language: id
  text: Beberapa orang bejat[a] telah keluar dari antara kamu dan menyesatkan penduduk kota mereka dengan berkata, “Mari kita pergi dan beribadah kepada ilah-ilah lain yang tidak kamu kenal.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak kebejatan”; secara tradisional: “anak-anak Belial.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָצְאוּ
  choice: telah muncul
  rationale: Dalam konteks laporan tentang penghasut yang berasal dari komunitas itu sendiri, ‘telah muncul’ menyampaikan makna idiomatis יצא dengan wajar tanpa mengaburkan asal mereka.
- source_word: אֲנָשִׁים
  choice: orang
  rationale: Bahasa Indonesia tidak perlu menandai gender gramatikal di sini; konteks Ibrani menyebut sekelompok laki-laki, tetapi ‘orang’ merupakan padanan alami bagi אֲנָשִׁים dalam konstruksi ini.
- source_word: בְּנֵי בְלִיַּעַל
  choice: orang bejat
  rationale: Ungkapan harfiahnya ‘anak-anak kebejatan/ketidakbergunaan’ dan secara idiomatis menunjuk kepada orang yang rusak secara moral atau durjana, bukan dengan sendirinya kepada sosok bernama Belial.
- source_word: מִקִּרְבְּךָ
  choice: dari tengah-tengah kamu
  rationale: Menegaskan bahwa para penghasut berasal dari dalam komunitas perjanjian; ‘kamu’ juga dapat berfungsi secara kolektif dalam bahasa Indonesia.
- source_word: וַיַּדִּיחוּ
  choice: menyesatkan
  rationale: Bentuk Hifil dari נדח menyatakan tindakan menyebabkan orang menyimpang, khususnya berpaling kepada ilah lain.
- source_word: יֹשְׁבֵי עִירָם
  choice: penduduk kota mereka
  rationale: Padanan ringkas dan alami bagi ‘orang-orang yang mendiami kota mereka’, dengan tetap mempertahankan pronomina jamak sumber.
- source_word: לֵאמֹר
  choice: dengan berkata
  rationale: Memperkenalkan ucapan langsung dan sekaligus menunjukkan sarana bujukan mereka.
- source_word: נֵלְכָה וְנַעַבְדָה
  choice: Mari kita pergi dan beribadah kepada
  rationale: Kedua bentuk kohortatif menyatakan ajakan. Dalam konteks pelayanan religius kepada ilah, ‘beribadah kepada’ lebih alami daripada ‘melayani’ dalam bahasa Indonesia modern.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ilah-ilah lain
  rationale: Mempertahankan ungkapan khas Ulangan tanpa mempersempitnya menjadi ‘ilah-ilah asing’.
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם
  choice: yang tidak pernah kamu kenal
  rationale: ‘Kenal’ mempertahankan nuansa pengetahuan atau pengenalan, sedangkan ‘tidak pernah’ menyampaikan nilai perfektif penyangkalan secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna בְּנֵי בְלִיַּעַל
  choice: orang bejat
  alternative: anak-anak Belial
  rationale: Dalam konteks Ibrani ini, frasa tersebut merupakan idiom bagi orang-orang durjana atau rusak secara moral. Menjadikan Belial nama diri akan memasukkan perkembangan teologis yang tidak dituntut oleh ayat ini.
- issue: Makna עבד dalam ajakan menyembah ilah lain
  choice: beribadah kepada
  alternative: melayani
  rationale: Kata Ibrani itu dapat berarti melayani maupun beribadah. Karena objeknya ilah-ilah lain dan konteksnya pembelotan keagamaan, ‘beribadah kepada’ menyampaikan makna kontekstual secara alami tanpa menambahkan tindakan ritual tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kalimat langsung dibuat alami bagi pembaca umum; istilah ‘ilah-ilah lain’ mempertahankan corak teologis teks, sedangkan catatan kaki menjaga bentuk harfiah idiom Ibrani dan pembacaan tradisionalnya.
