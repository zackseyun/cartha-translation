  source_fidelity: Revisi diperlukan terutama untuk memperbaiki pemetaan כָּלִיל. Frasa draf “sampai habis sebagai persembahan utuh” mencampurkan unsur adverbial dan nuansa persembahan secara kurang jelas. Revisi menempatkan pembakaran dengan api secara eksplisit dan menerjemahkan nuansa kultisnya sebagai persembahan yang dibakar seluruhnya, sambil mempertahankan pembacaan adverbial dalam catatan kaki. Klausa akhir diubah dari larangan deontik “tidak boleh” menjadi hasil/ketetapan masa depan yang lebih dekat dengan לֹא תִבָּנֶה עוֹד.
  naturalness: Bahasa revisi tetap baku dan modern. “Lapangan kota itu” lebih jelas daripada “lapangannya” untuk רְחֹבָהּ, dan titik koma membantu memisahkan akibat permanen dari ketetapan bahwa kota itu tidak dibangun kembali.
  terminology: “Jarahan,” “TUHAN, Allahmu,” dan “timbunan reruntuhan” sesuai konteks serta mempertahankan citra fisik תֵּל. “Persembahan yang dibakar seluruhnya” menyampaikan daya kultis כָּלִיל tanpa memaksakan istilah teknis “kurban bakaran.”
