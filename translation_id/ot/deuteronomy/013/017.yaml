base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/013/017.yaml
  text: You shall gather all its spoil into the middle of its open square[a], and you shall burn the city and all its spoil with fire as a whole offering to Yahweh your God. It shall remain a perpetual ruin mound[b]; it shall not be rebuilt again.
translation:
  language: id
  text: Kumpulkanlah seluruh jarahan kota itu ke tengah lapangan kota itu. Bakarlah kota itu beserta seluruh jarahannya dengan api sebagai persembahan yang dibakar seluruhnya bagi TUHAN, Allahmu.[a] Kota itu akan menjadi timbunan reruntuhan untuk selama-lamanya[b]; kota itu tidak akan dibangun kembali.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Bakarlah kota itu beserta seluruh jarahannya dengan api, seluruhnya bagi TUHAN, Allahmu.” Kata Ibrani yang diterjemahkan “sebagai persembahan yang dibakar seluruhnya” dapat dipahami secara adverbial, “seluruhnya,” atau dengan nuansa persembahan yang seluruhnya dihabiskan bagi Allah.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “timbunan untuk selamanya,” yakni timbunan reruntuhan yang tetap ada.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלָלָהּ
  choice: jarahan kota itu
  rationale: שָׁלָל menunjuk pada barang yang dirampas. 'Jarahan' alami dalam konteks perang dan akhiran pronominal diperjelas sebagai 'kota itu'.
- source_word: תִּקְבֹּץ
  choice: Kumpulkanlah
  rationale: Bentuk imperfek orang kedua tunggal dalam hukum instruksional berfungsi sebagai perintah.
- source_word: אֶל תּוֹךְ רְחֹבָהּ
  choice: ke tengah lapangannya
  rationale: רְחוֹב adalah ruang publik yang luas atau lapangan kota, bukan terutama jalan sempit.
- source_word: וְשָׂרַפְתָּ בָאֵשׁ
  choice: Bakarlah ... sampai habis
  rationale: Ungkapan Ibrani menyatakan pemusnahan dengan api; 'sampai habis' juga menghubungkan secara alami cakupan כָּלִיל.
- source_word: כָּלִיל
  choice: sebagai persembahan utuh
  rationale: Kata ini dapat berarti 'seluruhnya' secara adverbial atau memiliki nuansa kultis tentang sesuatu yang dihabiskan seluruhnya bagi Allah. Terjemahan utama mempertahankan nuansa persembahan tanpa memakai istilah teknis 'kurban bakaran'.
- source_word: לַיהוָה
  choice: bagi TUHAN
  rationale: Preposisi ל menandai pengkhususan atau penyerahan kepada Allah; nama ilahi ditampilkan sebagai 'TUHAN' sesuai kebiasaan Alkitab bahasa Indonesia.
- source_word: תֵּל עוֹלָם
  choice: timbunan reruntuhan untuk selama-lamanya
  rationale: תֵּל menggambarkan timbunan atau gundukan, khususnya bekas reruntuhan, sedangkan עוֹלָם menyatakan keadaan yang terus berlangsung.
- source_word: לֹא תִבָּנֶה עוֹד
  choice: tidak boleh dibangun kembali
  rationale: Bentuk pasif dengan עוֹד menyatakan bahwa kota tersebut tidak boleh didirikan kembali sesudah penghancurannya.
theological_decisions:
- issue: Nuansa kultis כָּלִיל dalam pembakaran kota
  choice: sampai habis sebagai persembahan utuh bagi TUHAN, Allahmu
  alternative: seluruhnya bagi TUHAN, Allahmu
  rationale: Susunan dengan לַיהוָה mendukung gagasan pengkhususan total kepada Allah, tetapi כָּלִיל tetap dapat dibaca secara adverbial. Teks utama memelihara nuansa kultis dan catatan kaki mempertahankan alternatif yang sungguh mungkin.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk perintah tunggal dipertahankan dengan akhiran -lah. 'Lapangan' dipilih sebagai istilah yang mudah dipahami untuk ruang terbuka umum di dalam kota; ambiguitas כָּלִיל dijaga melalui teks utama dan catatan kaki.
