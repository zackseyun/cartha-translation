language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כַּ/אֲשֶׁ֨ר עָֽשׂוּ לִ֜/י בְּנֵ֣י עֵשָׂ֗ו הַ/יֹּֽשְׁבִים֙ בְּ/שֵׂעִ֔יר וְ/הַ/מּ֣וֹאָבִ֔ים הַ/יֹּשְׁבִ֖ים בְּ/עָ֑ר עַ֤ד אֲשֶֽׁר אֶֽעֱבֹר֙ אֶת הַ/יַּרְדֵּ֔ן אֶל הָ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵ֖י/נוּ נֹתֵ֥ן לָֽ/נוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/029.yaml
  text: just as the sons of Esau who live in Seir and the Moabites who live in Ar did for me[a], until I cross the Jordan into the land that Yahweh our God is giving to us.
translation:
  language: id
  text: sebagaimana keturunan Esau yang tinggal di Seir dan orang Moab yang tinggal di Ar telah memperlakukan aku[a], sampai aku menyeberangi Sungai Yordan ke negeri yang Yahweh, Allah kita, sedang berikan kepada kita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “telah berbuat bagiku.” Dalam konteks ini ungkapan itu dapat merujuk pada perlakuan mereka kepada Musa, termasuk pemberian jalan lewat dan kesempatan memperoleh perbekalan.
    reason: Menjelaskan ungkapan Ibrani yang umum tanpa menjadikan rincian konteks sebagai isi eksplisit teks utama.
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: seperti yang
  rationale: Mempertahankan fungsi perbandingan dengan tindakan penduduk Seir dan Ar, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: עָשׂוּ לִי
  choice: dilakukan terhadap aku
  rationale: Ungkapan Ibrani secara harfiah berarti ‘mereka lakukan bagiku/terhadapku’. Terjemahan ini mempertahankan keluasan maknanya tanpa secara eksplisit menambahkan izin lewat dan perbekalan dari konteks sebelumnya.
- source_word: בְּנֵי עֵשָׂו
  choice: keturunan Esau
  rationale: Secara harfiah ‘anak-anak Esau’, tetapi dalam konteks ini menunjuk secara kolektif kepada keturunannya; ‘keturunan Esau’ merupakan ungkapan Indonesia yang lebih wajar dan tepat.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: yang tinggal di Seir
  rationale: Partisipel ישׁב menyatakan tempat tinggal menetap; ‘tinggal’ alami dalam bahasa Indonesia modern.
- source_word: וְהַמּוֹאָבִים
  choice: dan orang Moab
  rationale: Bentuk nisbah jamak menunjuk kepada anggota bangsa Moab; ‘orang Moab’ adalah padanan Indonesia yang lazim.
- source_word: הַיֹּשְׁבִים בְּעָר
  choice: yang tinggal di Ar
  rationale: Mempertahankan konstruksi yang sejajar dengan frasa tentang Seir dan mentransliterasikan Ar sebagai nama tempat.
- source_word: עַד אֲשֶׁר אֶעֱבֹר
  choice: sampai aku menyeberangi
  rationale: Dengan Sungai Yordan sebagai objek, ‘menyeberangi’ menyampaikan gerakan melintas secara jelas dan idiomatis.
- source_word: אֶת הַיַּרְדֵּן
  choice: Sungai Yordan
  rationale: Dalam bahasa Indonesia, penambahan unsur geografis ‘Sungai’ merupakan bentuk nama yang lazim dan memperjelas acuannya.
- source_word: אֶל הָאָרֶץ
  choice: menuju negeri
  rationale: Preposisi אֶל menyatakan arah tujuan. ‘Menuju negeri’ mempertahankan gerakan ke tujuan tanpa memaksakan nuansa ‘masuk ke dalam’.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Padanan langsung dan wajar bagi sebutan perjanjian ‘Allah kita’.
- source_word: נֹתֵן לָנוּ
  choice: diberikan ... kepada kita
  rationale: Partisipel menggambarkan pemberian yang sedang berlangsung atau dipandang pasti. Bentuk pasif relatif alami dalam klausa Indonesia dan tetap menyatakan Yahweh sebagai pemberi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri. ‘Yahweh’ mempertahankan nama tersebut, sedangkan ‘TUHAN’ menggantinya dengan gelar.
- issue: Cakupan makna עָשׂוּ לִי dalam konteks perjalanan
  choice: dilakukan terhadap aku
  alternative: mereka izinkan aku lewat dan memberi aku perbekalan
  rationale: Konteks ayat sebelumnya mendukung izin lewat dan pembelian makanan serta air, tetapi frasa Ibraninya sendiri tetap umum. Teks utama mempertahankan ketidakspesifikan itu dan catatan kaki menjelaskan acuannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. ‘Keturunan Esau’ dan ‘orang Moab’ dipilih agar mudah dipahami. Tanda petik penutup dipertahankan karena ayat ini merupakan akhir ucapan langsung yang dimulai pada konteks sebelumnya.
