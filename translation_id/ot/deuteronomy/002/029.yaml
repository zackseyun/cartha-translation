  naturalness: Susunan pasif “seperti yang dilakukan terhadap aku oleh keturunan Esau ... dan orang Moab ...” berat dan kurang alami dalam bahasa Indonesia modern. Susunan aktif dengan subjek jamak lebih jelas.
  terminology: “Keturunan Esau,” “orang Moab,” “Seir,” “Ar,” “Sungai Yordan,” “Yahweh,” dan “Allah kita” sesuai. “Negeri” dapat dipertahankan untuk הָאָרֶץ dalam konteks ini.
