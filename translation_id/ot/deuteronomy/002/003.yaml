  text: רַב לָ/כֶ֕ם סֹ֖ב אֶת הָ/הָ֣ר הַ/זֶּ֑ה פְּנ֥וּ לָ/כֶ֖ם צָפֹֽנָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/003.yaml
  text: You have gone around this hill country long enough[a]; turn northward.
translation:
  language: id
  text: Sudah cukup lama kalian mengelilingi daerah pegunungan ini[a]. Berbeloklah ke utara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gunung ini.” Kata Ibrani הַר dapat berarti sebuah gunung atau suatu daerah pegunungan; konteks perjalanan di sini mendukung arti yang lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַב לָכֶם סֹב
  choice: Sudah cukup lama kalian mengelilingi
  rationale: Ungkapan רַב לָכֶם menyatakan bahwa tindakan itu telah berlangsung sampai batas yang cukup, sedangkan סֹב menunjuk pada perjalanan mengitari suatu wilayah. Susunan ini menyampaikan daya ungkapan Ibrani secara alami dalam bahasa Indonesia.
- source_word: הָהָר הַזֶּה
  choice: daerah pegunungan ini
  rationale: הַר dapat menunjuk pada sebuah gunung maupun kawasan bergunung-gunung. Konteks perjalanan bangsa Israel mendukung makna kawasan geografis, bukan hanya satu puncak.
- source_word: פְּנוּ לָכֶם
  choice: Berbeloklah
  rationale: Bentuk perintah jamak dari פנה di sini memerintahkan perubahan arah perjalanan. Pronomina datif לָכֶם tidak diterjemahkan tersendiri karena tidak menambah makna yang alami dalam bahasa Indonesia.
- source_word: צָפֹנָה
  choice: ke utara
  rationale: Akhiran direktif pada kata ini menandakan gerak menuju arah utara; 'ke utara' menyatakan arah tersebut dengan jelas dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata ganti jamak 'kalian' dipakai agar jumlah jamak dalam sapaan Ibrani tetap jelas. Kalimat dibagi menjadi dua untuk menyampaikan pernyataan dan perintah secara alami.
