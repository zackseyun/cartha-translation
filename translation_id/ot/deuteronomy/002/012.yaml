revisions:
- from: Dahulu orang Hori tinggal di Seir, tetapi keturunan Esau merebut negeri itu dari mereka[a], memusnahkan mereka dari hadapan mereka[b], lalu tinggal menggantikan mereka. Demikian juga Israel memperlakukan negeri milik pusakanya[c], yang diberikan Yahweh kepada mereka.
  to: Dahulu orang Hori mendiami Seir, tetapi keturunan Esau menghalau mereka[a], memusnahkan mereka dari hadapan mereka[b], lalu menetap di tempat mereka. Hal itu seperti yang Israel lakukan terhadap negeri pusakanya[c], yang Yahweh berikan kepada mereka.
  rationale: Revisi memperjelas dan menaturalkan bahasa Indonesia tanpa mengurangi kekuatan tindakan pengusiran dan pemusnahan dalam teks sumber. Klausa perbandingan dipulihkan sebagai perbandingan langsung dengan tindakan Israel terhadap negeri pusakanya; tidak ada upaya untuk mengharmoniskan atau menjelaskan ketegangan kronologisnya. Semua jangkar catatan kaki tetap melekat pada unsur yang dijelaskan.
