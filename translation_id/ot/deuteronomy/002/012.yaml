  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami sambil mempertahankan kekuatan bahasa penaklukan, peralihan dari Israel sebagai kolektif tunggal ke bentuk jamak, serta ketegangan kronologis dalam klausa perbandingan.
