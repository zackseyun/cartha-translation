  text: וּ/בְ/שֵׂעִ֞יר יָשְׁב֣וּ הַ/חֹרִים֮ לְ/פָנִים֒ וּ/בְנֵ֧י עֵשָׂ֣ו יִֽירָשׁ֗וּ/ם וַ/יַּשְׁמִידוּ/ם֙ מִ/פְּנֵי/הֶ֔ם וַ/יֵּשְׁב֖וּ תַּחְתָּ֑/ם כַּ/אֲשֶׁ֧ר עָשָׂ֣ה יִשְׂרָאֵ֗ל לְ/אֶ֨רֶץ֙ יְרֻשָּׁת֔/וֹ אֲשֶׁר נָתַ֥ן יְהוָ֖ה לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/012.yaml
  text: And in Seir the Horites formerly lived[a], but the sons of Esau dispossessed them and destroyed them from before them, and settled in their place, just as Israel did to the land of his possession[c][b], which Yahweh gave to them.
translation:
  language: id
  text: Dahulu orang Hori mendiami Seir, tetapi keturunan Esau menghalau mereka[a], memusnahkan mereka dari hadapan mereka[b], lalu menetap di tempat mereka. Hal itu seperti yang Israel lakukan terhadap negeri pusakanya[c], yang Yahweh berikan kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengambil alih milik mereka.” Kata Ibrani ini dalam konteks pendudukan wilayah dapat berarti mengambil milik dengan menyingkirkan penghuni sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: “Dari hadapan mereka” adalah ungkapan Ibrani yang berarti menyingkirkan mereka dari hadapan atau wilayah pihak yang menaklukkan.
    reason: idiom_explanation
  - marker: c
    text: Atau “negeri miliknya” atau “negeri warisannya.” Kata Ibrani ini dapat menunjuk kepada milik yang diterima sebagai pusaka.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֹרִים
  choice: orang Hori
  rationale: Nama kelompok etnis ini secara wajar diterjemahkan dengan bentuk konvensional bahasa Indonesia, bukan transliterasi jamak Ibrani yang lebih kabur.
- source_word: לְפָנִים
  choice: dahulu
  rationale: Kata ini bermakna temporal dalam konteks ini; 'dahulu' alami dan jelas dalam bahasa Indonesia modern.
- source_word: יִירָשׁוּם
  choice: merebut negeri itu dari mereka
  rationale: Dalam konteks pendudukan wilayah, ירשׁ menyatakan mengambil milik dengan menyingkirkan penghuni sebelumnya. Objek wilayah tersirat dibuat eksplisit demi kejelasan tanpa mengubah makna.
- source_word: וַיַּשְׁמִידוּם
  choice: memusnahkan mereka
  rationale: שׁמד merupakan bahasa penghancuran yang kuat. 'Memusnahkan' mempertahankan kekuatan ungkapan tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: מִפְּנֵיהֶם
  choice: dari hadapan mereka
  rationale: Terjemahan ini mempertahankan idiom Ibrani dan ambiguitas acuannya; catatan kaki menjelaskan makna idiomatisnya.
- source_word: תַּחְתָּם
  choice: menggantikan mereka
  rationale: Dalam konteks ini frasa tersebut menunjukkan bahwa keturunan Esau menempati tempat para penghuni terdahulu.
- source_word: כַּאֲשֶׁר עָשָׂה יִשְׂרָאֵל
  choice: Demikian juga Israel memperlakukan
  rationale: Bentuk ini menyampaikan perbandingan tindakan secara alami dan tetap mempertahankan Israel sebagai subjek kolektif tunggal.
- source_word: לְאֶרֶץ יְרֻשָּׁתוֹ
  choice: negeri milik pusakanya
  rationale: יְרֻשָּׁה mencakup gagasan milik yang diterima sebagai pusaka. Ungkapan ini mempertahankan kedua nuansa serta akhiran tunggal yang mengacu kepada Israel secara kolektif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: לָהֶם
  choice: kepada mereka
  rationale: Bentuk jamak Ibrani dipertahankan, meskipun sebelumnya Israel disebut secara kolektif dengan bentuk tunggal.
theological_decisions:
- issue: Titik waktu perbandingan dengan tindakan Israel
  choice: Mempertahankan pernyataan sebagai perbandingan historis tanpa menyelesaikan persoalan kronologi atau sejarah penyuntingan.
  alternative: Menganggap klausa ini sebagai sisipan kemudian atau mengubah terjemahan agar tidak menyiratkan bahwa Israel telah bertindak terhadap negeri milik pusakanya.
  rationale: Teks Ibrani yang diterima secara langsung membandingkan tindakan keturunan Esau dengan tindakan Israel. Terjemahan tidak seharusnya memasukkan penyelarasan kronologis atau kesimpulan kritik sumber.
- issue: Penerjemahan nama יהוה
  choice: Yahweh
  alternative: TUHAN atau Jehovah
  rationale: Transliterasi ini mempertahankan nama ilahi sebagai nama diri dalam teks sumber.
