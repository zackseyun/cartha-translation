source:
  edition: WLC
  text: וַֽ/נַּעֲבֹ֞ר מֵ/אֵ֧ת אַחֵ֣י/נוּ בְנֵי עֵשָׂ֗ו הַ/יֹּֽשְׁבִים֙ בְּ/שֵׂעִ֔יר מִ/דֶּ֨רֶךְ֙ הָֽ/עֲרָבָ֔ה מֵ/אֵילַ֖ת וּ/מֵ/עֶצְיֹ֣ן גָּ֑בֶר וַ/נֵּ֨פֶן֙ וַֽ/נַּעֲבֹ֔ר דֶּ֖רֶךְ מִדְבַּ֥ר מוֹאָֽב־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/008.yaml
  text: So we passed on from our brothers[a], the sons of Esau, who live in Seir, away from the way of the Arabah, from Elath and from Ezion-geber[b]; and we turned and passed by the way of the wilderness of Moab.
translation:
  language: id
  text: Lalu kami berjalan meninggalkan saudara-saudara kami, keturunan Esau[a], yang tinggal di Seir, dan menjauh dari jalan Araba[b], dari Elat dan Ezion-Geber. Kemudian kami berbelok dan menempuh jalan melalui padang gurun Moab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “saudara-saudara kami, anak-anak Esau.”
    reason: Menjelaskan bentuk harfiah ungkapan kekerabatan Ibrani yang dalam teks utama diterjemahkan secara idiomatis.
  - marker: b
    text: Atau, “dari jalan Araba.” Araba adalah kawasan lembah retakan di sebelah selatan Laut Mati.
    reason: Mencatat terjemahan yang lebih harfiah bagi konstruksi Ibrani dan menjelaskan nama geografisnya.
lexical_decisions:
- source_word: וַנַּעֲבֹר מֵאֵת
  choice: kami berjalan meninggalkan
  rationale: Kombinasi verba עבר dan preposisi מֵאֵת dalam konteks perjalanan menunjukkan bahwa rombongan meneruskan perjalanan dengan melewati lalu menjauh dari suatu kelompok. Ungkapan ini alami dalam bahasa Indonesia tanpa menyiratkan penyeberangan perairan.
- source_word: אַחֵינוּ בְנֵי עֵשָׂו
  choice: saudara-saudara kami, keturunan Esau
  rationale: Mempertahankan sebutan kekerabatan yang penting dalam hubungan Israel dan Edom, sedangkan 'keturunan Esau' menyampaikan idiom Ibrani 'anak-anak Esau' secara wajar.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: yang tinggal di Seir
  rationale: Partisipel ישב menyatakan tempat tinggal menetap; 'tinggal' merupakan padanan modern dan alami.
- source_word: מִדֶּרֶךְ הָעֲרָבָה
  choice: menjauh dari jalan Araba
  rationale: מִן menunjukkan gerak menjauh, דֶּרֶךְ berarti jalan atau rute, dan Araba dipertahankan sebagai nama kawasan geografis.
- source_word: מֵאֵילַת וּמֵעֶצְיֹן גָּבֶר
  choice: dari Elat dan Ezion-Geber
  rationale: Menggunakan bentuk nama tempat yang lazim dalam Alkitab bahasa Indonesia dan mempertahankan pengulangan preposisi sumber.
- source_word: וַנֵּפֶן
  choice: kami berbelok
  rationale: Verba פנה di sini menyatakan perubahan arah perjalanan; 'berbelok' lebih jelas dan alami daripada sekadar 'berpaling'.
- source_word: וַנַּעֲבֹר דֶּרֶךְ מִדְבַּר מוֹאָב
  choice: menempuh jalan menuju padang gurun Moab
  rationale: Ungkapan ini mempertahankan unsur perjalanan dan 'jalan' sambil mengungkapkan rangkaian konstruksi Ibrani dalam bahasa Indonesia yang lancar.
theological_decisions:
- issue: Bahasa kekerabatan bagi keturunan Esau
  choice: saudara-saudara kami, keturunan Esau
  alternative: kaum kerabat kami, anak cucu Esau
  rationale: Teks Ibrani secara nyata menyebut orang Edom sebagai saudara Israel. Pilihan utama mempertahankan ketegangan historis-teologis ini tanpa mengubahnya menjadi istilah etnis yang umum.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Narasi perjalanan dibuat lancar bagi pembaca umum; istilah kekerabatan dan nama geografis tetap dekat dengan teks Ibrani.
