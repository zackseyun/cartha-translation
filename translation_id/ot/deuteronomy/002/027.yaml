  yaml_path: translation/ot/deuteronomy/002/027.yaml
  text: Let me pass through your land; I will go only by the road[a]. I will not turn aside to the right or to the left.
translation:
  language: id
  text: Izinkanlah aku melewati negerimu. Aku akan berjalan hanya di jalan itu[a] dan tidak akan menyimpang ke kanan atau ke kiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di jalan, di jalan.” Pengulangan ini memberi penekanan bahwa Israel akan tetap mengikuti rute tersebut dengan ketat.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעְבְּרָה
  choice: Izinkanlah aku melewati
  rationale: Bentuk kohortatif Qal orang pertama tunggal menyatakan permohonan dalam konteks diplomatik; ungkapan ini menyampaikan permintaan sopan, bukan sekadar pernyataan masa depan.
- source_word: בְאַרְצֶךָ
  choice: negerimu
  rationale: Sesudah verba עבר, preposisi ב secara idiomatis menunjukkan gerak melewati suatu wilayah; bersama 'melewati', 'negerimu' menghasilkan bahasa Indonesia yang alami.
- source_word: בַּדֶּרֶךְ בַּדֶּרֶךְ
  choice: hanya melalui jalan itu
  rationale: Pengulangan kata Ibrani bersifat emfatis dan menegaskan bahwa rombongan akan tetap mengikuti rute tersebut. 'Hanya' mempertahankan tekanannya tanpa pengulangan yang janggal dalam bahasa Indonesia.
- source_word: אֵלֵךְ
  choice: aku akan berjalan
  rationale: הלך menyatakan tindakan pergi atau menempuh perjalanan. 'Berjalan' mempertahankan citra pergerakan di jalan tanpa menyiratkan jalan raya modern.
- source_word: לֹא אָסוּר
  choice: tidak akan menyimpang
  rationale: סור berarti berbelok, menyimpang, atau meninggalkan jalur; 'menyimpang' cocok dengan konteks mengikuti rute secara ketat.
- source_word: יָמִין וּשְׂמֹאול
  choice: ke kanan atau ke kiri
  rationale: Ungkapan arah tetap ini berarti tidak menyimpang ke arah mana pun dan dipertahankan secara alami dalam bahasa Indonesia.
