  yaml_path: translation/ot/deuteronomy/002/018.yaml
  text: You are crossing today the border of Moab at Ar[a].
translation:
  language: id
  text: Hari ini engkau melintasi perbatasan Moab di Ar.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “perbatasan Moab, yaitu Ar.” Dalam bahasa Ibrani, penanda objek diulang sebelum “Ar”, sehingga Ar mungkin menjelaskan secara aposisional perbatasan atau kawasan Moab yang dimaksud.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹבֵר
  choice: melintasi
  rationale: Partisipel Qal maskulin tunggal yang dipakai secara predikatif bersama kata ganti אַתָּה menunjuk pada tindakan yang sedang atau segera berlangsung dalam konteks. Bahasa Indonesia secara alami dapat menyatakannya dengan verba sederhana setelah keterangan waktu “hari ini”.
- source_word: הַיּוֹם
  choice: Hari ini
  rationale: Ungkapan temporal umum yang berarti “hari ini”; penempatannya di awal mempertahankan penekanan waktu dan terdengar alami dalam bahasa Indonesia.
- source_word: גְּבוּל
  choice: perbatasan
  rationale: Dalam konteks geografis Moab, kata ini menunjuk pada batas wilayah. “Perbatasan” cocok dengan tindakan melintasi dan dapat mencakup kawasan batas, sedangkan “batas” lebih mudah dipahami hanya sebagai garis abstrak.
- source_word: מוֹאָב
  choice: Moab
  rationale: Nama tempat/bangsa ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: עָר
  choice: Ar
  rationale: Nama tempat dipertahankan sebagai transliterasi.
- source_word: אֶת ... אֶת
  choice: perbatasan Moab di Ar
  rationale: Pengulangan penanda objek sebelum “Ar” memungkinkan hubungan aposisional. “Di Ar” menyampaikan hubungan geografis secara alami tanpa menutup kemungkinan bahwa Ar mengidentifikasi perbatasan atau kawasan yang dimaksud; alternatif yang lebih eksplisit dicatat dalam catatan kaki.
- source_word: אַתָּה
  choice: engkau
  rationale: Kata ganti orang kedua maskulin tunggal ditujukan kepada Israel secara korporat. “Engkau” mempertahankan bentuk tunggal dan register yang bermartabat tanpa menambahkan penjelasan ke dalam teks.
theological_decisions:
- issue: Sapaan tunggal kepada Israel
  choice: Mempertahankan kata ganti tunggal “engkau” tanpa perluasan penjelas
  alternative: “Kalian” atau “engkau, Israel”
  rationale: Bahasa Ibrani menyapa Israel sebagai satu kesatuan dengan bentuk tunggal. “Engkau” mempertahankan retorika sumber dan tidak memasukkan tafsiran tambahan.
- issue: Hubungan Ar dengan perbatasan Moab
  choice: “di Ar” dalam teks utama, dengan alternatif aposisional dalam catatan kaki
  alternative: “perbatasan Moab, yaitu Ar”
  rationale: Pengulangan אֶת mendukung pembacaan aposisional, tetapi hubungan tepatnya tetap agak ambigu. Terjemahan utama dibuat alami, sementara catatan kaki menjaga kemungkinan bahwa Ar secara langsung mengidentifikasi perbatasan atau kawasan tersebut.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Engkau” dipakai untuk mempertahankan sapaan tunggal korporat; “melintasi perbatasan” dipilih sebagai ungkapan geografis yang alami. Penanda catatan kaki [a] ditempatkan tepat sesudah “Ar”.
