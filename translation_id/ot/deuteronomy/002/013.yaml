  text: עַתָּ֗ה קֻ֛מוּ וְ/עִבְר֥וּ לָ/כֶ֖ם אֶת נַ֣חַל זָ֑רֶד וַֽ/נַּעֲבֹ֖ר אֶת נַ֥חַל זָֽרֶד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/013.yaml
  text: Now rise up and cross over the Wadi Zered[a]. So we crossed over the Wadi Zered.
translation:
  language: id
  text: Sekarang bangkitlah dan seberangilah Wadi Zered[a]. Lalu kami menyeberangi Wadi Zered.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "Sungai Zered" atau "Lembah Zered". Kata Ibrani נחל dapat merujuk pada wadi, jurang, atau alur sungai, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה
  choice: Sekarang
  rationale: Penanda waktu yang mengantar tindakan berikutnya dan mempertahankan kesegeraan perintah Ibrani.
- source_word: קֻמוּ
  choice: bangkitlah
  rationale: Bentuk imperatif jamak dari קום. Pilihan ini mempertahankan daya perintah dengan ragam bahasa yang wajar dan bermartabat.
- source_word: וְעִבְרוּ
  choice: seberangilah
  rationale: Dalam konteks perjalanan, עבר berarti berpindah dari satu sisi ke sisi lain. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan kaitannya dengan verba yang diulang pada akhir ayat.
- source_word: לָכֶם
  choice: tidak diterjemahkan secara tersendiri
  rationale: Datif etis ini menambah penegasan idiomatis pada perintah, tetapi tidak memiliki padanan tersendiri yang alami dalam bahasa Indonesia; nuansanya tercakup dalam bentuk imperatif.
- source_word: נַחַל
  choice: Wadi
  rationale: Kata ini dapat menunjuk pada alur air musiman, jurang, atau lembah sungai. Dalam latar perjalanan di padang gurun, 'wadi' paling baik mempertahankan ciri geografisnya.
- source_word: זָרֶד
  choice: Zered
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: וַנַּעֲבֹר
  choice: Lalu kami menyeberangi
  rationale: Bentuk wayyiqtol orang pertama jamak menuturkan pelaksanaan perintah sebagai tindakan berikutnya. 'Lalu' menyampaikan urutan naratif secara alami tanpa melebihkan hubungan sebab-akibat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern, alami, dan bermartabat. 'Bangkitlah' mempertahankan kekuatan perintah, sedangkan 'wadi' dipakai sebagai istilah geografis yang lebih tepat bagi alur air musiman di kawasan kering. Penanda catatan kaki [a] dicantumkan langsung sesudah nama tempat pada kemunculan pertama.
