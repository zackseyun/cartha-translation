source:
  edition: WLC
  text: וְ/אֶת הָ/עָם֮ צַ֣ו לֵ/אמֹר֒ אַתֶּ֣ם עֹֽבְרִ֗ים בִּ/גְבוּל֙ אֲחֵי/כֶ֣ם בְּנֵי עֵשָׂ֔ו הַ/יֹּשְׁבִ֖ים בְּ/שֵׂעִ֑יר וְ/יִֽירְא֣וּ מִ/כֶּ֔ם וְ/נִשְׁמַרְתֶּ֖ם מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/004.yaml
  text: And command the people[a], saying, ‘You are about to pass through the territory of your brothers, the sons of Esau, who live in Seir; and they will be afraid of you[c][b]. So be very careful.’
translation:
  language: id
  text: 'Dan perintahkanlah umat itu demikian: “Kalian akan segera melintasi[a] wilayah[b] saudara-saudara kalian, yaitu keturunan Esau yang tinggal di Seir. Mereka akan takut kepada kalian. Berhati-hatilah sungguh-sungguh.”[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan ‘sedang melintasi’ atau ‘akan melintasi’. Partisip Ibrani dapat menyatakan tindakan yang segera terjadi.
    reason: lexical_alternative
  - marker: b
    text: Atau ‘perbatasan’. Kata Ibrani ini dapat berarti garis batas ataupun wilayah yang berada di dalam batas itu.
    reason: lexical_alternative
  - marker: c
    text: Secara lebih harfiah, ‘dan jagalah diri kalian dengan sungguh-sungguh’. Kata penghubung Ibrani dapat dipahami sebagai kelanjutan biasa atau sebagai konsekuensi dari kalimat sebelumnya.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: צַו
  choice: perintahkanlah
  rationale: Bentuk imperatif dari צוה menyampaikan arahan yang berwibawa; ‘perintahkanlah’ mempertahankan kekuatan tersebut.
- source_word: הָעָם
  choice: umat itu
  rationale: עם menunjuk kepada umat Israel secara kolektif. ‘Umat itu’ alami dalam konteks narasi Israel dan tidak mengubahnya menjadi istilah politis semata.
- source_word: אַתֶּם עֹבְרִים
  choice: kalian akan segera melintasi
  rationale: Pronomina mandiri bersama partisip dapat menyatakan tindakan yang sudah dekat atau akan berlangsung. ‘Akan segera melintasi’ menyampaikan daya prospektif dalam konteks perjalanan.
- source_word: בִּגְבוּל
  choice: wilayah
  rationale: גְּבוּל dapat berarti garis batas maupun daerah yang dibatasi. Dalam konteks perjalanan melintasi daerah Edom, ‘wilayah’ paling jelas, sementara ambiguitas leksikal dicatat dalam catatan kaki.
- source_word: אֲחֵיכֶם בְּנֵי עֵשָׂו
  choice: saudara-saudara kalian, yaitu keturunan Esau
  rationale: ‘Saudara-saudara kalian’ mempertahankan bahasa kekerabatan antara Israel dan Edom. ‘Keturunan Esau’ mengungkapkan ungkapan genealogis בני עשו secara alami dalam bahasa Indonesia modern.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: yang tinggal di Seir
  rationale: Partisip ישב menyatakan tempat tinggal yang menetap; ‘tinggal di Seir’ jelas dan wajar.
- source_word: וְיִירְאוּ מִכֶּם
  choice: Mereka akan takut kepada kalian
  rationale: ירא dengan מן di sini menyatakan ketakutan terhadap Israel. ‘Takut kepada kalian’ mempertahankan makna relasional dan daya prediktif bentuk verba.
- source_word: וְנִשְׁמַרְתֶּם מְאֹד
  choice: Karena itu, jagalah diri kalian baik-baik
  rationale: Bentuk Nifal dari שמר berdaya refleksif, yakni menjaga atau mengawasi diri. ‘Baik-baik’ menyampaikan penegasan מְאֹד secara alami; hubungan konsekuensial dengan kalimat sebelumnya dinyatakan melalui ‘Karena itu’ dan dicatat sebagai kemungkinan penafsiran sintaksis.
theological_decisions:
- issue: Bahasa kekerabatan bagi Edom
  choice: saudara-saudara kalian, yaitu keturunan Esau
  alternative: kerabat kalian, yaitu keturunan Esau
  rationale: Teks mendasarkan sikap Israel terhadap Edom pada hubungan persaudaraan genealogis. ‘Saudara-saudara’ mempertahankan ketegangan dan bobot hubungan itu tanpa mereduksinya menjadi sekadar kesamaan etnis.
- issue: Hubungan antara ketakutan Edom dan peringatan kepada Israel
  choice: Karena itu, jagalah diri kalian baik-baik
  alternative: Dan jagalah diri kalian baik-baik
  rationale: Waw dapat dipahami sebagai penghubung yang menyatakan konsekuensi dalam konteks ini, tetapi bentuk Ibrani tidak memakai kata sebab-akibat yang khusus. Terjemahan utama menyatakan alur yang paling masuk akal, sedangkan alternatif yang lebih netral dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan jamak ‘kalian’ dipakai untuk membedakan perintah kepada seluruh umat. Diksi ‘umat’, ‘wilayah’, dan ‘tinggal’ dipilih agar mudah dipahami tanpa kehilangan bahasa kekerabatan dan bentuk peringatan dalam teks Ibrani.
