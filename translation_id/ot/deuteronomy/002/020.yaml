reference: Deuteronomy 2:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֶֽרֶץ רְפָאִ֥ים תֵּחָשֵׁ֖ב אַף הִ֑וא רְפָאִ֤ים יָֽשְׁבוּ בָ/הּ֙ לְ/פָנִ֔ים וְ/הָֽ/עַמֹּנִ֔ים יִקְרְא֥וּ לָ/הֶ֖ם זַמְזֻמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/020.yaml
  text: That also is considered a land of the Rephaim[a]; Rephaim lived in it formerly[b], but the Ammonites call them Zamzummim.
translation:
  language: id
  text: Negeri itu juga dianggap sebagai negeri orang Refaim.[a] Dahulu orang Refaim tinggal di sana,[b] tetapi orang Amon menyebut mereka orang Zamzumim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “negeri orang Refaim itu.”'
    reason: lexical_alternative
  - marker: b
    text: Nama “Refaim” dapat merujuk kepada suatu bangsa kuno yang menurut tradisi dikaitkan dengan tubuh yang sangat besar; karena itu, sebagian terjemahan menyebut mereka “raksasa” di sini.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ רְפָאִים
  choice: negeri orang Refaim
  rationale: אֶרֶץ berarti ‘negeri/tanah’, sedangkan רְפָאִים berfungsi sebagai nama suatu kelompok bangsa. ‘Negeri orang Refaim’ alami dalam bahasa Indonesia dan tidak menafsirkan nama itu sebagai ‘raksasa’.
- source_word: תֵּחָשֵׁב
  choice: dianggap
  rationale: Bentuk Nifal dari חשׁב menyatakan bahwa negeri tersebut dipandang atau diperhitungkan sebagai negeri orang Refaim; ‘dianggap’ mempertahankan makna pasif secara wajar.
- source_word: אַף הִוא
  choice: Negeri itu juga
  rationale: Ungkapan ini menambahkan wilayah tersebut kepada pembahasan sebelumnya. Penyebutan ulang ‘negeri itu’ membuat rujukannya jelas dan alami.
- source_word: רְפָאִים
  choice: orang Refaim
  rationale: Dalam konteks ini istilah tersebut merupakan etnonim yang disejajarkan dengan nama yang digunakan orang Amon. Transliterasi mempertahankan kekhususan teks Ibrani tanpa memasukkan tafsiran ‘raksasa’ ke dalam teks utama.
- source_word: יָשְׁבוּ בָהּ
  choice: tinggal di sana
  rationale: ישׁב berarti tinggal atau menetap. ‘Di sana’ merupakan padanan Indonesia yang alami untuk pronomina feminin yang merujuk kepada negeri itu.
- source_word: לְפָנִים
  choice: Dahulu
  rationale: Adverbia ini menunjuk kepada masa lampau; ‘dahulu’ ringkas, jelas, dan sesuai dengan register naratif.
- source_word: וְהָעַמֹּנִים
  choice: tetapi orang Amon
  rationale: Walaupun ו secara dasar berarti ‘dan’, ‘tetapi’ menandai peralihan yang tersirat antara sebutan narator dan sebutan orang Amon. ‘Orang Amon’ adalah bentuk etnonim Indonesia yang lazim.
- source_word: יִקְרְאוּ לָהֶם
  choice: menyebut mereka
  rationale: Bentuk imperfek di sini menyatakan penamaan yang lazim. ‘Menyebut mereka’ lebih alami daripada terjemahan harfiah ‘memanggil kepada mereka’.
- source_word: זַמְזֻמִּים
  choice: orang Zamzumim
  rationale: Ini adalah nama kelompok bangsa dan karena itu ditransliterasikan, bukan diterjemahkan.
theological_decisions:
- issue: Identitas dan perawakan orang Refaim
  choice: Mempertahankan nama bangsa ‘orang Refaim’ dalam teks utama
  alternative: Menerjemahkannya sebagai ‘raksasa’
  rationale: Konteks memakai רְפָאִים sebagai nama kelompok yang juga disebut Zamzumim oleh orang Amon. Menerjemahkannya sebagai ‘raksasa’ akan menetapkan tafsiran tentang perawakan mereka yang tidak dinyatakan secara eksplisit dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Negeri’ dipilih untuk wilayah suatu bangsa, ‘tinggal’ untuk gaya yang mudah dipahami, dan nama-nama bangsa dipertahankan sebagai Refaim, Amon, serta Zamzumim. Semua penanda catatan kaki ditempatkan langsung dalam teks.
