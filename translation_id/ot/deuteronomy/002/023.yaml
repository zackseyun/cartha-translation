reference: Deuteronomy 2:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָֽ/עַוִּ֛ים הַ/יֹּשְׁבִ֥ים בַּ/חֲצֵרִ֖ים עַד עַזָּ֑ה כַּפְתֹּרִים֙ הַ/יֹּצְאִ֣ים מִ/כַּפְתּ֔וֹר הִשְׁמִידֻ֖/ם וַ/יֵּשְׁב֥וּ תַחְתָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/023.yaml
  text: As for the Avvim[a], who lived in villages as far as Gaza, the Caphtorim, who came out from Caphtor[b], destroyed them and settled in their place.
translation:
  language: id
  text: Adapun orang Awi[a], yang tinggal di perkampungan[b] sampai ke Gaza, kaum Kaftor yang keluar dari Kaftor memusnahkan mereka, lalu menetap di tempat mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kaum Awim.”
    reason: lexical_alternative
  - marker: b
    text: Kata ini juga dapat diterjemahkan “desa-desa”, “permukiman”, atau “perkemahan”, yaitu tempat-tempat kediaman.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעַוִּים
  choice: orang Awi
  rationale: Nama kelompok bangsa ditransliterasikan dalam bentuk yang alami dalam bahasa Indonesia; unsur gentilik dinyatakan dengan “orang”.
- source_word: הַיֹּשְׁבִים
  choice: yang tinggal
  rationale: ישב menyatakan keadaan bermukim; “tinggal” alami dan tetap mempertahankan makna tempat kediaman.
- source_word: בַּחֲצֵרִים
  choice: di perkampungan
  rationale: חֲצֵרִים dapat menunjuk desa tak bertembok, dusun, atau permukiman; “perkampungan” cukup luas untuk tidak menentukan bentuk permukimannya secara berlebihan.
- source_word: עַד עַזָּה
  choice: sampai ke Gaza
  rationale: עַד menandai batas geografis; ungkapan ini alami dalam bahasa Indonesia.
- source_word: כַּפְתֹּרִים
  choice: kaum Kaftor
  rationale: Nama kelompok bangsa ditransliterasikan, sedangkan “kaum” membedakannya dari nama tempat Kaftor dalam klausa berikutnya.
- source_word: הַיֹּצְאִים מִכַּפְתּוֹר
  choice: yang keluar dari Kaftor
  rationale: Mempertahankan gambaran gerak dari יצא, bukan meratakannya menjadi sekadar “berasal dari”.
- source_word: הִשְׁמִידֻם
  choice: memusnahkan mereka
  rationale: Bentuk Hifil dari שׁמד menyatakan penghancuran atau pembinasaan; “memusnahkan” menyampaikan kekuatan katanya tanpa tambahan tafsir.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: lalu menetap di tempat mereka
  rationale: Terjemahan ini menyampaikan bahwa kaum Kaftor bermukim di wilayah yang sebelumnya ditempati orang Awi serta mempertahankan ungkapan penggantian תַחְתָּם.
