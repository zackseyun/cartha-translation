  text: וַ/נִּלְכֹּ֤ד אֶת כָּל עָרָי/ו֙ בָּ/עֵ֣ת הַ/הִ֔וא וַֽ/נַּחֲרֵם֙ אֶת כָּל עִ֣יר מְתִ֔ם וְ/הַ/נָּשִׁ֖ים וְ/הַ/טָּ֑ף לֹ֥א הִשְׁאַ֖רְנוּ שָׂרִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/034.yaml
  text: At that time we captured all his cities[a], and we devoted to destruction every inhabited city, with the women and the little children. We left no survivor.
translation:
  language: id
  text: Pada waktu itu kami merebut semua kotanya. Kami mengkhususkan untuk dimusnahkan[a] setiap kota beserta laki-laki, perempuan, dan anak-anak kecil di dalamnya. Kami tidak membiarkan seorang pun tetap hidup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini memakai kata חרם (ḥerem), yaitu mengkhususkan atau menyerahkan sesuatu untuk dimusnahkan; ungkapan ini juga dapat diterjemahkan “menumpas habis.”
    reason: Menjelaskan makna teknis-sakral חרם dan memberikan alternatif terjemahan yang idiomatis.
lexical_decisions:
- source_word: וַנִּלְכֹּד
  choice: kami merebut
  rationale: Kata kerja לכד lazim dipakai untuk merebut kota dalam peperangan. “Merebut” alami dalam bahasa Indonesia dan mempertahankan konteks penaklukan.
- source_word: כָּל עָרָיו
  choice: semua kotanya
  rationale: עִיר dapat berarti kota atau permukiman; dalam konteks militer ini, “kota” tepat, sedangkan כָּל mempertahankan cakupan menyeluruh.
- source_word: בָּעֵת הַהִוא
  choice: Pada waktu itu
  rationale: Padanan temporal yang langsung, alami, dan bermartabat.
- source_word: וַנַּחֲרֵם
  choice: kami mengkhususkan untuk dimusnahkan
  rationale: Bentuk Hifil dari חרם menyatakan penyerahan atau pengkhususan di bawah ḥerem dengan akibat pemusnahan. Ungkapan ini mempertahankan dimensi teknis-sakralnya, tidak sekadar menyatakan tindakan membunuh.
- source_word: כָּל עִיר מְתִם
  choice: setiap kota beserta para laki-laki
  rationale: Konstruksi Ibrani padat, dan מְתִם menunjuk pada manusia, khususnya laki-laki, sebagai unsur pertama dalam daftar yang dilanjutkan dengan perempuan dan anak-anak. “Beserta” membuat hubungan sintaksisnya jelas tanpa menetralkan kekhususan gender.
- source_word: וְהַנָּשִׁים וְהַטָּף
  choice: perempuan, dan anak-anak kecil
  rationale: הַנָּשִׁים berarti perempuan, sedangkan הַטָּף menunjuk pada anak-anak kecil atau tanggungan muda; “anak-anak kecil” mempertahankan nuansa usia dan kerentanan.
- source_word: לֹא הִשְׁאַרְנוּ שָׂרִיד
  choice: Tidak seorang pun kami biarkan hidup
  rationale: Dalam konteks peperangan, שָׂרִיד berarti orang yang selamat. Rumusan ini idiomatis dalam bahasa Indonesia dan menyatakan bahwa tidak ada penyintas yang ditinggalkan.
theological_decisions:
- issue: Bahasa חרם dalam kisah penaklukan
  choice: kami mengkhususkan untuk dimusnahkan
  alternative: kami menumpas habis; kami menempatkan di bawah ḥerem
  rationale: Pilihan utama mempertahankan gagasan teknis bahwa sasaran dikhususkan atau diserahkan kepada pemusnahan, tanpa memperhalus kekerasan teks maupun menambahkan penjelasan teologis yang tidak dinyatakan ayat.
- issue: Kekhususan gender dalam מְתִם
  choice: para laki-laki, perempuan, dan anak-anak kecil
  alternative: semua penduduk, termasuk perempuan dan anak-anak
  rationale: Teks Ibrani membedakan laki-laki dari perempuan dan anak-anak. Terjemahan mempertahankan pembedaan tersebut dan tidak menggantinya dengan istilah generik.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kekerasan teks dinyatakan secara terbuka tanpa eufemisme, sementara istilah teknis חרם dijelaskan melalui catatan kaki.
