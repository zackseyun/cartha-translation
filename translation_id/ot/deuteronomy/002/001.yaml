base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/001.yaml
  text: Then we turned and set out for the wilderness by the way of the Red Sea[a], just as Yahweh had spoken to me, and we went around Mount Seir for many days.
translation:
  language: id
  text: Kemudian kami berbalik dan berangkat menuju padang gurun melalui jalan ke Laut Merah[a], sebagaimana Yahweh telah berfirman kepadaku, dan kami mengelilingi Gunung Seir selama berhari-hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Laut Buluh.” Nama Ibrani Yam Suf dapat diterjemahkan secara lebih harfiah demikian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֵּפֶן
  choice: Kemudian kami berbalik
  rationale: Bentuk wayyiqtol dari פנה menyatakan perubahan arah dalam urutan narasi; 'berbalik' tidak menambahkan gagasan kembali ke tempat semula.
- source_word: וַנִּסַּע הַמִּדְבָּרָה
  choice: dan berangkat menuju padang gurun
  rationale: נסע dalam konteks perjalanan berarti berangkat atau membongkar perkemahan, sedangkan akhiran arah pada מִדְבָּרָה menyatakan gerak menuju padang gurun.
- source_word: דֶּרֶךְ יַם סוּף
  choice: melalui jalan ke Laut Merah
  rationale: דֶּרֶךְ menyatakan jalan atau rute; konstruksi ini paling alami dipahami sebagai rute menuju Yam Suf. Nama tradisional 'Laut Merah' dipakai dalam teks, sedangkan arti yang lebih harfiah dicatat dalam catatan kaki.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה אֵלָי
  choice: seperti yang telah Yahweh firmankan kepadaku
  rationale: כַּאֲשֶׁר menyatakan kesesuaian, dan kala lampau 'telah' cocok dengan tinjauan naratif. 'Berfirman' merupakan padanan Indonesia yang wajar ketika Allah menjadi subjek, tanpa mengubah isi verba דִּבֶּר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dialihaksarakan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: וַנָּסָב אֶת הַר שֵׂעִיר
  choice: Kami mengelilingi Pegunungan Seir
  rationale: סבב berarti bergerak mengitari. Dalam konteks geografis ini הַר שֵׂעִיר dapat menunjuk kawasan pegunungan Seir, bukan hanya satu puncak; 'Pegunungan Seir' merupakan ungkapan geografis Indonesia yang alami.
- source_word: יָמִים רַבִּים
  choice: selama berhari-hari
  rationale: Frasa ini menyatakan durasi yang panjang secara idiomatis; 'selama berhari-hari' mempertahankan unsur 'hari' dan terdengar alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian YHWH secara langsung. 'Yahweh' mempertahankan nama pribadi itu tanpa menggantinya dengan gelar atau memilih bentuk alternatif 'Yehuwa'.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak naratif yang lugas dan bermartabat. 'Berangkat menuju' menyampaikan arah perjalanan dengan jelas; 'berfirman' mempertahankan ragam Alkitab yang masih umum dipahami. Penanda catatan kaki [a] ditempatkan tepat setelah istilah yang dijelaskan.
