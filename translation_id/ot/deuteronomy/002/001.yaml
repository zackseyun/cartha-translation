revisions:
- from: Kemudian kami berbalik dan berangkat menuju padang gurun melalui jalan ke Laut Merah[a], seperti yang telah Yahweh firmankan kepadaku. Kami mengelilingi Pegunungan Seir selama berhari-hari.
  to: Kemudian kami berbalik dan berangkat menuju padang gurun melalui jalan ke Laut Merah[a], sebagaimana Yahweh telah berfirman kepadaku, dan kami mengelilingi Gunung Seir selama berhari-hari.
  rationale: Revisi memperbaiki idiom verba “berfirman,” memakai padanan tunggal yang lebih langsung untuk הַר שֵׂעִיר, dan menetralkan alternatif leksikal di catatan kaki. Struktur koordinatif dipertahankan untuk mencerminkan rangkaian naratif Ibrani.
