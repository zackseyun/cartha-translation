  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י רְאֵ֗ה הַֽחִלֹּ֨תִי֙ תֵּ֣ת לְ/פָנֶ֔י/ךָ אֶת סִיחֹ֖ן וְ/אֶת אַרְצ֑/וֹ הָחֵ֣ל רָ֔שׁ לָ/רֶ֖שֶׁת אֶת אַרְצֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/031.yaml
  text: And Yahweh said to me[a], “See, I have begun to give Sihon and his land over to you[b]. Begin to take possession of his land.”
translation:
  language: id
  text: Yahweh berfirman kepadaku, “Lihatlah, Aku telah mulai menyerahkan Sihon dan negerinya ke dalam kuasamu.[a] Mulailah mengambil alih negerinya.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di hadapanmu.” Dalam konteks ini, ungkapan tersebut berarti bahwa Yahweh menyerahkan Sihon dan negerinya ke dalam kuasa pihak yang diajak bicara.
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani mengulang akar kata yang dapat berarti “mengambil milik” atau “memiliki”: “Mulailah mengambil milik, untuk memiliki negerinya.” Pengulangan itu menegaskan tindakan mengambil alih negeri tersebut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang dinyatakan oleh Tetragramaton, bukan menggantinya dengan gelar.
- source_word: רְאֵה
  choice: Lihatlah
  rationale: Bentuk perintah ini berfungsi menarik perhatian; “Lihatlah” alami dalam bahasa Indonesia dan tetap mempertahankan daya langsungnya.
- source_word: הַחִלֹּתִי
  choice: Aku telah mulai
  rationale: Bentuk perfektif dalam ujaran langsung menyatakan tindakan yang sudah dimulai dan kini sedang berlangsung.
- source_word: תֵּת
  choice: menyerahkan
  rationale: Dalam konteks penaklukan, נתן menyatakan penyerahan Sihon dan wilayahnya ke dalam kekuasaan Israel; “menyerahkan” lebih alami daripada terjemahan harfiah “memberikan”.
- source_word: לְפָנֶיךָ
  choice: ke dalam kuasamu
  rationale: Secara harfiah berarti “di hadapanmu,” tetapi dalam konteks ini merupakan ungkapan tentang penempatan seseorang dan wilayahnya dalam kuasa pihak lain.
- source_word: הָחֵל
  choice: Mulailah
  rationale: 'Mempertahankan kesejajaran yang disengaja: Yahweh telah mulai menyerahkan, dan Israel diperintahkan untuk mulai bertindak.'
- source_word: רָשׁ לָרֶשֶׁת
  choice: mengambil ... menjadi milikmu
  rationale: Akar ירש muncul dua kali dalam konstruksi yang menegaskan tindakan memperoleh negeri sebagai milik. Ungkapan Indonesia ini menyampaikan penaklukan sekaligus kepemilikan tanpa pengulangan yang kaku.
- source_word: אַרְצוֹ
  choice: negerinya
  rationale: אֶרֶץ di sini menunjuk wilayah kekuasaan Sihon; “negeri” sesuai dengan konteks politik dan teritorial.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama diri ilahi. Bentuk “Yahweh” mempertahankannya sebagai nama, bukan menggantinya dengan gelar.
- issue: Hubungan tindakan ilahi dan tindakan Israel
  choice: Mempertahankan kesejajaran “Aku telah mulai” dan “Mulailah”
  alternative: Meratakan kedua klausa menjadi satu pernyataan tentang kemenangan yang sudah selesai
  rationale: Teks menyandingkan tindakan Yahweh yang telah dimulai dengan perintah agar Israel mulai mengambil negeri itu; terjemahan tidak menghapus ketegangan antara pemberian ilahi dan tindakan manusia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya langsung dan bermartabat. “Negeri” dipilih untuk wilayah kekuasaan Sihon, sedangkan “ke dalam kuasamu” menjelaskan idiom Ibrani tanpa menghilangkan alternatif harfiahnya, yang dicatat dalam catatan kaki.
