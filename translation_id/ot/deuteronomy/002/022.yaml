source:
  edition: WLC
  text: כַּ/אֲשֶׁ֤ר עָשָׂה֙ לִ/בְנֵ֣י עֵשָׂ֔ו הַ/יֹּשְׁבִ֖ים בְּ/שֵׂעִ֑יר אֲשֶׁ֨ר הִשְׁמִ֤יד אֶת הַ/חֹרִי֙ מִ/פְּנֵי/הֶ֔ם וַ/יִּֽירָשֻׁ/ם֙ וַ/יֵּשְׁב֣וּ תַחְתָּ֔/ם עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/022.yaml
  text: just as he did for the sons of Esau who live in Seir[a], when he destroyed the Horites from before them[c][b], and they dispossessed them and settled in their place to this day.
translation:
  language: id
  text: seperti yang dilakukan-Nya bagi keturunan Esau yang tinggal di Seir, ketika Ia memusnahkan orang Hori dari hadapan mereka,[a] lalu mereka merebut wilayah orang Hori[b] dan menetap di tempat mereka sampai hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari hadapan mereka”; maksudnya, Ia menyingkirkan orang Hori dari hadapan atau wilayah keturunan Esau.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “merebut wilayah” secara gramatikal berobjek “mereka”. Dalam konteks ini, maksudnya ialah keturunan Esau menggusur orang Hori dan mengambil alih wilayah mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: seperti yang dilakukan-Nya
  rationale: Mengungkapkan perbandingan dengan ayat sebelumnya dan mempertahankan acuan eliptis kepada tindakan TUHAN tanpa memperinci tindakan itu lebih jauh.
- source_word: לִבְנֵי עֵשָׂו
  choice: bagi keturunan Esau
  rationale: Dalam konteks etnis dan sejarah, בנים menunjuk kepada para keturunan Esau; pilihan ini lebih jelas dan alami daripada 'anak-anak Esau'.
- source_word: הַיֹּשְׁבִים בְּשֵׂעִיר
  choice: yang tinggal di Seir
  rationale: Menerjemahkan partisipel ישׁב dengan bahasa Indonesia modern dan wajar.
- source_word: אֲשֶׁר הִשְׁמִיד
  choice: ketika Ia memusnahkan
  rationale: Klausa relatif Ibrani berfungsi secara sirkumstansial dalam konteks; 'ketika' menghasilkan sintaksis Indonesia yang alami. Huruf kapital menandai bahwa subjek tersiratnya adalah TUHAN dari konteks terdekat.
- source_word: הַחֹרִי
  choice: orang Hori
  rationale: Bentuk tunggal kolektif menunjuk kepada kelompok bangsa Hori.
- source_word: מִפְּנֵיהֶם
  choice: dari hadapan mereka
  rationale: Mempertahankan idiom Ibrani secara cukup formal; catatan kaki menjelaskan bahwa maksudnya ialah menyingkirkan mereka dari hadapan atau wilayah keturunan Esau.
- source_word: וַיִּירָשֻׁם
  choice: lalu mereka merebut wilayah orang Hori
  rationale: Dalam konteks penaklukan, ירשׁ berarti mengambil milik dengan menggusur penghuni sebelumnya. Objek pronominalnya secara harfiah adalah 'mereka', tetapi bahasa Indonesia memerlukan pengungkapan wilayah agar tidak terkesan bahwa manusianya dijadikan milik.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: dan menetap di tempat mereka
  rationale: Menyatakan bahwa keturunan Esau kemudian mendiami tempat bekas orang Hori; 'menetap' menunjukkan hunian yang berkelanjutan.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Padanan idiomatis baku bagi ungkapan waktu Ibrani tersebut.
theological_decisions:
- issue: Subjek verba tunggal 'melakukan' dan 'memusnahkan'
  choice: TUHAN, dinyatakan melalui pronomina hormat '-Nya' dan 'Ia'
  alternative: Membiarkan subjeknya kurang eksplisit atau menerjemahkan dengan pronomina huruf kecil
  rationale: Verba Ibrani berbentuk maskulin tunggal dan konteks langsung mengacu kepada tindakan TUHAN bagi Edom. Kapitalisasi pronomina mengikuti kebiasaan Indonesia untuk memperjelas rujukan tanpa menambahkan nama ilahi ke dalam teks.
- issue: Hubungan tindakan ilahi dengan tindakan keturunan Esau
  choice: 'Mempertahankan pergantian subjek: Ia memusnahkan, lalu mereka merebut dan menetap'
  alternative: Menggabungkan semua tindakan di bawah satu subjek
  rationale: 'Pergantian dari verba tunggal הִשְׁמִיד kepada verba jamak וַיִּירָשֻׁם dan וַיֵּשְׁבוּ penting: TUHAN adalah pelaku pemusnahan, sedangkan keturunan Esau mengambil alih dan mendiami wilayah itu.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Keturunan Esau' menghindari salah pengertian biologis sempit dari 'anak-anak Esau'; 'tinggal' dan 'menetap' dipilih daripada bentuk arkais. Semua penanda catatan kaki muncul dalam teks utama.
