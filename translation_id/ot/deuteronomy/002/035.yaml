  source_fidelity: 'Draf secara umum mencerminkan unsur-unsur Ibrani: רַק sebagai pembatasan, בְּהֵמָה sebagai ternak, לָנוּ sebagai unsur benefaktif/refleksif, serta לכד dalam arti merebut kota. Namun, susunan sekarang mudah terbaca seolah-olah pembatasan “hanya” bertentangan dengan tambahan “beserta jarahan,” dan “jarahan dari kota-kota” kurang jelas sebagai barang rampasan dari kota-kota yang direbut.'
  naturalness: Frasa nominal tanpa verba utama masih dapat dipahami, tetapi kurang lancar dalam bahasa Indonesia modern. Menjadikannya kalimat lengkap dan menempatkan “hanya” dekat dengan objek yang dibatasi menghasilkan pembacaan yang lebih jelas tanpa mengubah isi.
