  text: Only the livestock we took as plunder for ourselves[a], along with the spoil of the cities that we captured.
translation:
  language: id
  text: Kami mengambil bagi kami sendiri hanya ternak sebagai rampasan, serta barang jarahan dari kota-kota yang kami rebut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Hanya
  rationale: 'Menandai pembatasan terhadap pemusnahan yang disebut dalam ayat sebelumnya: ternak dan jarahan kota tetap diambil.'
- source_word: הַבְּהֵמָה
  choice: ternak
  rationale: Dalam konteks rampasan perang, kata ini menunjuk pada hewan peliharaan, sehingga “ternak” lebih tepat daripada “binatang” secara umum.
- source_word: בָּזַזְנוּ לָנוּ
  choice: kami rampas bagi kami sendiri
  rationale: Mempertahankan makna tindakan merampas dari verba בזז sekaligus daya benefaktif/refleksif לָנוּ.
- source_word: וּשְׁלַל
  choice: beserta jarahan
  rationale: שָׁלָל menunjuk pada barang rampasan perang; “beserta” mengungkapkan koordinasi secara alami tanpa mengaburkan hubungan sintaksis.
- source_word: הֶעָרִים
  choice: kota-kota
  rationale: Padanan umum dan sesuai bagi bentuk jamak עִיר dalam kisah penaklukan.
- source_word: אֲשֶׁר לָכָדְנוּ
  choice: yang telah kami rebut
  rationale: Dalam konteks militer, לכד berarti merebut atau menaklukkan; “merebut kota” merupakan ungkapan Indonesia yang alami dan tepat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku yang modern, ringkas, dan bermartabat. Struktur Ibrani dipertahankan sejauh wajar; frasa benefaktif “bagi kami sendiri” sengaja dipertahankan karena hadir secara eksplisit dalam teks sumber. Tidak digunakan catatan kaki karena alternatif pada lapisan konsultasi Inggris tampaknya muncul dari persoalan cakupan sintaksis, sedangkan teks Ibrani secara alami mengoordinasikan ternak dengan jarahan kota sebagai hal-hal yang diambil.
