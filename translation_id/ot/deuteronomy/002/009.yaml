  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י אֶל תָּ֨צַר֙ אֶת מוֹאָ֔ב וְ/אַל תִּתְגָּ֥ר בָּ֖/ם מִלְחָמָ֑ה כִּ֠י לֹֽא אֶתֵּ֨ן לְ/ךָ֤ מֵֽ/אַרְצ/וֹ֙ יְרֻשָּׁ֔ה כִּ֣י לִ/בְנֵי ל֔וֹט נָתַ֥תִּי אֶת עָ֖ר יְרֻשָּֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/009.yaml
  text: And Yahweh said to me[a], “Do not harass Moab or provoke them to war, for I will not give you any of its land as a possession[b], because I have given Ar to the sons of Lot as a possession.”
translation:
  language: id
  text: Lalu Yahweh berkata kepadaku, “Jangan memusuhi Moab[a] dan jangan berperang melawan mereka, sebab Aku tidak akan memberikan sedikit pun dari negerinya kepadamu sebagai milik pusaka[b]. Ar telah Kuberikan kepada keturunan Lot sebagai milik pusaka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jangan menindas Moab.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “sebagai warisan”; demikian juga pada akhir ayat.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap dipertahankan, bukan diganti dengan gelar.
- source_word: אֶל תָּצַר אֶת מוֹאָב
  choice: Jangan mengusik Moab
  rationale: Dalam konteks larangan ini, צרר menunjuk pada tindakan menekan atau mengganggu secara bermusuhan. “Mengusik” alami dalam bahasa Indonesia dan tetap membedakannya dari peperangan terbuka pada klausa berikutnya.
- source_word: וְאַל תִּתְגָּר בָּם מִלְחָמָה
  choice: dan jangan memancing mereka untuk berperang
  rationale: Ungkapan ini menyatakan tindakan membangkitkan atau memulai permusuhan yang mengarah pada perang. Pilihan ini mempertahankan nuansa provokasi sekaligus makna militernya.
- source_word: מֵאַרְצוֹ
  choice: sedikit pun dari negerinya
  rationale: 'Preposisi מִן bersifat partitif dalam konteks ini: Israel tidak akan menerima bagian mana pun dari wilayah Moab. Sufiks tunggal dipahami merujuk kepada Moab sebagai satu bangsa atau negeri.'
- source_word: יְרֻשָּׁה
  choice: sebagai milik pusaka
  rationale: Istilah ini menunjuk pada milik yang diberikan sebagai bagian tetap atau warisan. “Milik pusaka” mempertahankan kedua unsur tersebut dan dapat digunakan secara konsisten pada kedua kemunculannya.
- source_word: לִבְנֵי לוֹט
  choice: kepada keturunan Lot
  rationale: Secara harfiah berarti “anak-anak Lot”, tetapi dalam konteks bangsa Moab ungkapan genealogis ini mencakup para keturunannya. “Keturunan Lot” mencegah kesan bahwa yang dimaksud hanya anak langsung Lot.
- source_word: עָר
  choice: Ar
  rationale: Nama tempat atau wilayah ini ditransliterasikan secara langsung.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. “Yahweh” mempertahankan nama itu secara langsung tanpa menggantinya dengan gelar.
- issue: Makna יְרֻשָּׁה dalam pemberian tanah
  choice: milik pusaka
  alternative: warisan
  rationale: “Milik pusaka” mempertahankan gagasan tentang tanah yang diberikan untuk dimiliki secara tetap, tanpa menentukan lebih jauh mekanisme teologis pewarisannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Bentuk “Kuberikan” mempertahankan penekanan pada tindakan Allah dan tetap alami. “Negeri” dipilih untuk Moab sebagai wilayah suatu bangsa, sedangkan pronomina “mereka” memperlakukan Moab secara kolektif.
