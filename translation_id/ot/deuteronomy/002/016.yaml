translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Ayat dipertahankan sebagai anak kalimat yang belum selesai karena kalimat Ibraninya berlanjut ke ayat 17. Frasa “telah habis mati” sengaja mempertahankan penekanan sumber pada tuntasnya kematian seluruh angkatan perang tersebut.
