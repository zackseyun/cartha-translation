  text: Ketika semua laki-laki yang berperang telah habis mati dari tengah-tengah bangsa itu,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “semua laki-laki angkatan perang.” Secara harfiah: “semua laki-laki perang.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַאֲשֶׁר
  choice: Ketika
  rationale: Rangkaian ini membuka anak kalimat waktu yang berlanjut ke ayat berikutnya. Dalam bahasa Indonesia, unsur וַיְהִי paling alami diserap ke dalam penghubung temporal tanpa menambahkan frasa kaku seperti “terjadilah ketika”.
- source_word: תַּמּוּ ... לָמוּת
  choice: telah habis mati
  rationale: Gabungan kata kerja תמם dengan infinitif מות menyatakan bahwa proses kematian kelompok itu telah mencapai akhirnya. “Telah habis mati” mempertahankan nuansa ketuntasan yang lebih kuat daripada sekadar “telah mati”.
- source_word: כָּל
  choice: semua
  rationale: Kuantor menyeluruh dalam teks Ibrani dipertahankan secara eksplisit.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: orang yang sanggup berperang
  rationale: Ungkapan ini secara harfiah berarti “orang-orang perang” dan menunjuk kepada kaum laki-laki dalam angkatan perang. Pilihan ini alami dalam bahasa Indonesia dan tidak menyiratkan bahwa mereka semuanya prajurit profesional.
- source_word: מִקֶּרֶב הָעָם
  choice: dari tengah-tengah bangsa itu
  rationale: מִקֶּרֶב menyatakan lenyapnya mereka dari dalam kelompok tersebut. “Bangsa itu” merujuk secara kolektif kepada Israel dan sesuai dengan konteks narasi.
