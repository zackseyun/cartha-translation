  text: וְ/לֹ֣א אָבָ֗ה סִיחֹן֙ מֶ֣לֶךְ חֶשְׁבּ֔וֹן הַעֲבִרֵ֖/נוּ בּ֑/וֹ כִּֽי הִקְשָׁה֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֶת רוּח֗/וֹ וְ/אִמֵּץ֙ אֶת לְבָב֔/וֹ לְמַ֛עַן תִּתּ֥/וֹ בְ/יָדְ/ךָ֖ כַּ/יּ֥וֹם הַ/זֶּֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/030.yaml
  text: But Sihon king of Heshbon was not willing to let us pass through his land[a], because Yahweh your God had hardened his spirit and made his heart stubborn, in order to give him into your hand, as it is this day.
translation:
  language: id
  text: Namun, Sihon, raja Hesybon, tidak mau mengizinkan kita melintasi wilayahnya, karena Yahweh, Allahmu, telah mengeraskan rohnya dan meneguhkan hatinya[a], supaya Ia menyerahkan dia ke dalam tanganmu, sebagaimana nyata pada hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menguatkan hatinya.” Kata kerja Ibrani ini berarti membuat kuat atau teguh; dalam konteks ini, keteguhan tersebut menyiratkan sikap bersikeras atau tidak mau mengalah.
    reason: Alternatif leksikal untuk אמץ serta penjelasan tentang nuansa kontekstualnya.
lexical_decisions:
- source_word: אָבָה
  choice: tidak mau
  rationale: Kata kerja ini menyatakan ketidakmauan atau tidak adanya persetujuan, bukan hanya tindakan menolak secara lahiriah.
- source_word: הַעֲבִרֵנוּ בּוֹ
  choice: mengizinkan kita melintasi wilayahnya
  rationale: Bentuk kausatif dari עבר berarti mengizinkan atau menyebabkan untuk lewat; dalam konteks ini, pronomina בּוֹ menunjuk pada wilayah kekuasaan Sihon, sehingga 'wilayahnya' menyampaikan acuan tersirat secara wajar.
- source_word: הִקְשָׁה ... אֶת רוּחוֹ
  choice: telah mengeraskan rohnya
  rationale: Terjemahan ini mempertahankan verba kausatif 'mengeraskan' dan istilah antropologis רוּחַ, tanpa memparafrasakannya hanya sebagai sikap keras kepala.
- source_word: וְאִמֵּץ אֶת לְבָבוֹ
  choice: dan meneguhkan hatinya
  rationale: אמץ pada dasarnya berarti membuat kuat atau teguh. Pilihan ini menjaga perbedaan leksikal dari verba sebelumnya sekaligus membiarkan konteks menunjukkan bahwa keteguhan itu berupa sikap yang tidak mau mengalah.
- source_word: לְמַעַן
  choice: supaya
  rationale: Kata penghubung ini menyatakan tujuan atau hasil yang dimaksud; 'supaya' alami dalam bahasa Indonesia dan tetap mempertahankan daya purposifnya.
- source_word: תִּתּוֹ בְיָדְךָ
  choice: menyerahkan dia ke dalam tanganmu
  rationale: Ungkapan Ibrani ini berarti menyerahkan seseorang ke dalam kuasa pihak lain. Bentuk 'ke dalam tanganmu' mempertahankan citra idiom sumber dan tetap mudah dipahami.
- source_word: כַּיּוֹם הַזֶּה
  choice: seperti yang terjadi pada hari ini
  rationale: Ungkapan khas Ulangan ini menunjuk pada keadaan yang kini nyata sebagai hasil peristiwa tersebut; terjemahan ini mempertahankan acuan pada 'hari ini' dengan bahasa Indonesia yang wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
theological_decisions:
- issue: Pengerasan oleh Allah dan ketidakmauan manusia
  choice: Mempertahankan baik ketidakmauan Sihon maupun tindakan Yahweh yang mengeraskan rohnya dan meneguhkan hatinya.
  alternative: Menjadikan pengerasan itu semata-mata tindakan Sihon sendiri, atau memparafrasakan Yahweh hanya sebagai pihak yang membiarkannya terjadi.
  rationale: Teks Ibrani secara eksplisit menegaskan kedua unsur tersebut. Terjemahan tidak melunakkan salah satunya atau menyelesaikan ketegangan teologis di antara keduanya.
- issue: Nuansa אמץ dalam konteks pengerasan
  choice: Meneguhkan hatinya, dengan catatan mengenai kemungkinan nuansa keras atau bersikeras.
  alternative: Membuat hatinya keras kepala.
  rationale: Makna leksikal dasar 'menguatkan/meneguhkan' perlu dipertahankan, sementara konteks menunjukkan bahwa keteguhan ini berwujud sikap menolak. Catatan kaki menjaga kedua sisi tanpa menutup ambiguitas.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Susunan 'Sihon, raja Hesybon' jelas tanpa terasa kaku; 'wilayahnya' menjelaskan acuan teritorial yang tersirat; citra 'roh', 'hati', dan 'ke dalam tanganmu' dipertahankan karena penting bagi bentuk dan ketegangan teks sumber.
