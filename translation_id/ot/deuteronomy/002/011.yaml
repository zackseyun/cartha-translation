translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Nama-nama kelompok kuno ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia serta didahului kata "orang" agar mudah dipahami.
