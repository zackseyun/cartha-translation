  text: רְפָאִ֛ים יֵחָשְׁב֥וּ אַף הֵ֖ם כָּ/עֲנָקִ֑ים וְ/הַ/מֹּ֣אָבִ֔ים יִקְרְא֥וּ לָ/הֶ֖ם אֵמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/011.yaml
  text: They too were considered Rephaim[a], like the Anakim; but the Moabites call them Emim.
translation:
  language: id
  text: Mereka pun dianggap sebagai orang Refaim[a], seperti halnya orang Enak; tetapi orang Moab menyebut mereka orang Emim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “raksasa” untuk “Refaim”; tetapi dalam konteks ini, istilah Ibrani tersebut lebih wajar dipahami sebagai nama suatu kelompok bangsa kuno.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְפָאִים
  choice: orang Refaim
  rationale: Nama kelompok bangsa ditransliterasikan, bukan ditafsirkan sebagai "raksasa"; penambahan "orang" membuatnya alami dan jelas dalam bahasa Indonesia.
- source_word: יֵחָשְׁבוּ
  choice: dianggap sebagai
  rationale: Bentuk nifal menyatakan penggolongan pasif; frasa ini alami dalam bahasa Indonesia modern.
- source_word: אַף הֵם
  choice: mereka pun
  rationale: Mempertahankan nuansa penyertaan dan penekanan bahwa kelompok ini juga termasuk dalam golongan tersebut.
- source_word: כָּעֲנָקִים
  choice: seperti orang Enak
  rationale: Prefiks כ menyatakan perbandingan; Enak dipertahankan sebagai nama kelompok bangsa dengan penanda "orang".
- source_word: וְהַמֹּאָבִים
  choice: tetapi orang Moab
  rationale: Waw di sini dapat menandai peralihan dari penggolongan umum kepada sebutan khusus yang dipakai orang Moab; "tetapi" menyatakan peralihan itu secara alami.
- source_word: יִקְרְאוּ לָהֶם
  choice: menyebut mereka
  rationale: Ungkapan קרא ל berarti memanggil atau menamai; "menyebut mereka" paling wajar dalam konteks penamaan kelompok.
- source_word: אֵמִים
  choice: orang Emim
  rationale: Nama kelompok ditransliterasikan; "orang" memperjelas bahwa yang dimaksud ialah suatu kelompok bangsa tanpa mengubah nama Ibraninya.
