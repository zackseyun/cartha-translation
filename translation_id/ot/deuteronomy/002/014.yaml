id: DEU.2.14
reference: Deuteronomy 2:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הַ/יָּמִ֞ים אֲשֶׁר הָלַ֣כְנוּ מִ/קָּדֵ֣שׁ בַּרְנֵ֗עַ עַ֤ד אֲשֶׁר עָבַ֨רְנוּ֙ אֶת נַ֣חַל זֶ֔רֶד שְׁלֹשִׁ֥ים וּ/שְׁמֹנֶ֖ה שָׁנָ֑ה עַד תֹּ֨ם כָּל הַ/דּ֜וֹר אַנְשֵׁ֤י הַ/מִּלְחָמָה֙ מִ/קֶּ֣רֶב הַֽ/מַּחֲנֶ֔ה כַּ/אֲשֶׁ֛ר נִשְׁבַּ֥ע יְהוָ֖ה לָ/הֶֽם־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/014.yaml
  text: And the days that we traveled from Kadesh-barnea until we crossed the Wadi Zered were thirty-eight years[a], until the entire generation of the men of war had come to an end from the midst of the camp, just as Yahweh had sworn to them.
translation:
  language: id
  text: Lamanya perjalanan kita dari Kadesh-Barnea sampai kita menyeberangi Wadi Zered adalah tiga puluh delapan tahun[a], hingga seluruh angkatan laki-laki perang itu habis dari tengah-tengah perkemahan, seperti yang telah Yahweh sumpahkan kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Sungai Zered.” Kata Ibrani yang digunakan dapat berarti wadi, dasar sungai musiman, atau anak sungai; “Wadi Zered” lebih sesuai dengan keadaan geografis kawasan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר הָלַכְנוּ
  choice: Lamanya perjalanan kita
  rationale: Secara harfiah, frasa ini berbicara tentang 'hari-hari ketika kita berjalan', tetapi dalam konteks ini fungsinya menyatakan rentang waktu perjalanan. Bentuk ini alami dalam bahasa Indonesia dan mempertahankan fokus pada durasi.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: dari Kadesh-Barnea
  rationale: Menggunakan transliterasi nama tempat yang lazim dan mempertahankan bentuk majemuknya.
- source_word: עַד אֲשֶׁר עָבַרְנוּ
  choice: sampai kita menyeberangi
  rationale: Dalam hubungan dengan alur air, עָבַר paling wajar berarti menyeberang.
- source_word: נַחַל זֶרֶד
  choice: Wadi Zered
  rationale: נַחַל dapat menunjuk pada lembah aliran, dasar sungai musiman, atau anak sungai. 'Wadi' sesuai dengan geografi kawasan itu tanpa memastikan bahwa air selalu mengalir.
- source_word: שְׁלֹשִׁים וּשְׁמֹנֶה שָׁנָה
  choice: tiga puluh delapan tahun
  rationale: Padanan angka yang baku dalam bahasa Indonesia.
- source_word: עַד תֹּם כָּל הַדּוֹר
  choice: hingga seluruh angkatan ... habis
  rationale: תֹּם menyatakan berakhir atau lenyapnya kelompok tersebut. 'Habis' mempertahankan gagasan bahwa mereka tidak lagi tersisa tanpa menambahkan cara kematian yang tidak dinyatakan di ayat ini.
- source_word: אַנְשֵׁי הַמִּלְחָמָה
  choice: para prajurit
  rationale: Frasa harfiahnya adalah 'orang-orang perang' dan dalam konteks ini merujuk kepada laki-laki yang layak berperang. 'Para prajurit' merupakan ungkapan Indonesia yang alami dan tetap mempertahankan acuan militer.
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: dari tengah-tengah perkemahan
  rationale: Mempertahankan gambaran bahwa angkatan tersebut lenyap dari antara komunitas yang berkemah.
- source_word: כַּאֲשֶׁר נִשְׁבַּע יְהוָה לָהֶם
  choice: tepat seperti yang telah Yahweh sumpahkan kepada mereka
  rationale: Menjaga bahasa sumpah tetap eksplisit, mempertahankan nama ilahi, dan menandai bahwa sumpah itu mendahului masa perjalanan tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani menggunakan nama perjanjian secara langsung. 'Yahweh' mempertahankan nama itu alih-alih menggantinya dengan gelar.
- issue: Cakupan אַנְשֵׁי הַמִּלְחָמָה
  choice: para prajurit
  alternative: orang-orang yang siap berperang
  rationale: Acuannya adalah kelompok laki-laki militer dari angkatan yang terkena sumpah penghukuman. Padanan ini tidak menetralkan unsur militer, tetapi juga tidak menambahkan batas usia yang tidak disebutkan dalam ayat.
- issue: Makna תֹּם dalam penghukuman angkatan itu
  choice: habis
  alternative: binasa seluruhnya
  rationale: Konteks yang lebih luas menunjukkan kematian mereka, tetapi kata di ayat ini sendiri menekankan berakhir atau lenyapnya kelompok itu. 'Habis' menjaga ketegangan tersebut tanpa memperjelas secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat disederhanakan secukupnya agar mudah dibaca, sementara urutan durasi, berakhirnya angkatan perang, dan penggenapan sumpah tetap mengikuti teks Ibrani.
