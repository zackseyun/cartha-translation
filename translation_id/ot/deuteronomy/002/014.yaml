revisions:
- from: Lamanya perjalanan kita dari Kadesh-Barnea sampai kita menyeberangi Wadi Zered adalah tiga puluh delapan tahun[a], hingga seluruh angkatan para prajurit itu habis dari tengah-tengah perkemahan, tepat seperti yang telah Yahweh sumpahkan kepada mereka.
  to: Lamanya perjalanan kita dari Kadesh-Barnea sampai kita menyeberangi Wadi Zered adalah tiga puluh delapan tahun[a], hingga seluruh angkatan laki-laki perang itu habis dari tengah-tengah perkemahan, seperti yang telah Yahweh sumpahkan kepada mereka.
  rationale: Revisi memperbaiki klausa sumpah agar Yahweh menjadi subjek yang secara eksplisit “bersumpah,” sesuai bentuk Ibrani, dan mengganti “para prajurit” dengan “laki-laki perang” untuk mempertahankan referensi maskulin eksplisit. Tidak ada perubahan pada durasi, lokasi, atau nuansa bahwa angkatan itu berakhir dari tengah perkemahan.
