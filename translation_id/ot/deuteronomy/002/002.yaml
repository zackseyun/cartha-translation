lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan alur cerita, sehingga “Lalu” menyatakan urutan peristiwa secara alami. Dalam bahasa Indonesia Alkitabiah yang modern dan bermartabat, “berfirman” lazim digunakan ketika Allah menjadi subjek ujaran.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks sumber tetap tampak dan tidak diganti dengan gelar.
- source_word: אֵלַי
  choice: kepadaku
  rationale: Preposisi אֶל dengan akhiran orang pertama tunggal berarti “kepadaku”; bentuk ini alami dalam bahasa Indonesia modern.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif ini memperkenalkan perkataan langsung yang menyusul pada ayat berikutnya. “Demikian:” mewakili fungsi pengantarnya secara alami tanpa menghasilkan ungkapan Indonesia yang berulang seperti “berfirman ... dengan berkata”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama itu, bukan menggantinya dengan gelar, tanpa menambahkan penafsiran teologis lain.
- issue: Pemakaian verba khusus bagi ujaran Allah
  choice: berfirman
  alternative: berkata
  rationale: “Berfirman” merupakan padanan Indonesia yang wajar dan bermartabat ketika Allah berbicara. Pilihan ini tidak mengubah isi ujaran atau menyelesaikan ketegangan teologis apa pun.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Tanda titik dua menunjukkan bahwa perkataan langsung berlanjut pada ayat berikutnya; penanda catatan kaki [a] dipertahankan dalam teks utama.
