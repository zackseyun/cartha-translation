base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/026.yaml
  text: So I sent messengers from the wilderness of Kedemoth to Sihon king of Heshbon with words of peace[a], saying,
translation:
  language: id
  text: 'Lalu aku mengutus para utusan dari padang gurun Kedemot kepada Sihon, raja Hesbon, dengan pesan perdamaian[a] berikut:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tawaran damai.” Secara harfiah bahasa Ibrani berbunyi “kata-kata damai,” sebuah ungkapan untuk pendekatan diplomatik yang damai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלַח
  choice: Lalu aku mengutus
  rationale: Bentuk wayyiqtol orang pertama tunggal melanjutkan urutan cerita; “lalu” menyampaikan gerak naratif secara alami.
- source_word: מַלְאָכִים
  choice: para utusan
  rationale: Dalam konteks diplomatik ini kata tersebut menunjuk kepada manusia yang diutus, bukan makhluk surgawi.
- source_word: מִמִּדְבַּר קְדֵמוֹת
  choice: dari padang gurun Kedemot
  rationale: “Padang gurun” merupakan padanan Indonesia yang wajar untuk מִדְבָּר, sedangkan nama tempat ditransliterasikan sebagai Kedemot.
- source_word: אֶל סִיחוֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: kepada Sihon, raja Hesbon
  rationale: Preposisi menandai penerima misi; gelar kerajaan dipertahankan sebagai aposisi yang alami dalam bahasa Indonesia.
- source_word: דִּבְרֵי שָׁלוֹם
  choice: dengan membawa kata-kata damai
  rationale: Mempertahankan ungkapan harfiah “kata-kata damai” sambil membuat fungsi para utusan dan muatan pesan terdengar alami dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Formula pengantar kutipan ini menunjuk kepada ucapan yang berlanjut pada ayat berikutnya; “demikian:” lebih alami daripada bentuk partisipial yang kaku.
