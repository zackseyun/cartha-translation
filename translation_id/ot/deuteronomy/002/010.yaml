  text: הָ/אֵמִ֥ים לְ/פָנִ֖ים יָ֣שְׁבוּ בָ֑/הּ עַ֣ם גָּד֥וֹל וְ/רַ֛ב וָ/רָ֖ם כָּ/עֲנָקִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/010.yaml
  text: The Emim formerly lived there[a], a people great and numerous and tall as the Anakim.
translation:
  language: id
  text: Dahulu orang Emim tinggal di sana, suatu bangsa yang besar, banyak jumlahnya, dan tinggi seperti orang Enak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֵמִים
  choice: orang Emim
  rationale: Nama kelompok etnis ini ditransliterasikan; penambahan “orang” membuat rujukannya alami dan jelas dalam bahasa Indonesia.
- source_word: לְפָנִים
  choice: dahulu
  rationale: Dalam ungkapan ini maknanya temporal, yakni pada masa lampau, bukan spasial.
- source_word: יָשְׁבוּ בָהּ
  choice: tinggal di sana
  rationale: Kata kerja ישׁב dengan ב menyatakan tempat kediaman; “di sana” merujuk secara alami kepada wilayah yang disebut dalam konteks.
- source_word: עַם
  choice: suatu bangsa
  rationale: Di sini עַם menunjuk kepada kelompok etnis sebagai satu kesatuan; “bangsa” sesuai dengan pemerian kolektif berikutnya.
- source_word: גָּדוֹל
  choice: besar
  rationale: Mempertahankan arti luas tentang ukuran dan kegagahan bangsa tersebut.
- source_word: וְרַב
  choice: banyak jumlahnya
  rationale: Adjektiva ini menyatakan banyaknya anggota bangsa itu; frasa ini lebih alami dalam rangkaian pemerian bahasa Indonesia.
- source_word: וָרָם
  choice: tinggi
  rationale: Perbandingan dengan orang Enak menunjukkan bahwa kata ini merujuk kepada tinggi badan.
- source_word: כָּעֲנָקִים
  choice: seperti orang Enak
  rationale: Prefiks כ menyatakan perbandingan; nama etnis עֲנָקִים ditransliterasikan sebagai “orang Enak” sesuai bentuk yang lazim dalam Alkitab bahasa Indonesia.
