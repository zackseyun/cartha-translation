  terminology: '''Yahweh'' konsisten dengan kebijakan nama ilahi yang diberikan. ''Tangan Yahweh'' tepat dipertahankan. ''Habis dibinasakan'' menyampaikan terminasi dalam עַד תֻּמָּם tanpa menghilangkan pembedaan leksikal antara tindakan mengacaukan (הֻמָּם) dan hasil akhir.'
