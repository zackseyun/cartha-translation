id: DEU.2.15
reference: Deuteronomy 2:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/גַ֤ם יַד יְהוָה֙ הָ֣יְתָה בָּ֔/ם לְ/הֻמָּ֖/ם מִ/קֶּ֣רֶב הַֽ/מַּחֲנֶ֑ה עַ֖ד תֻּמָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/015.yaml
  text: Moreover[a], the hand of Yahweh was against them[b], to throw them into confusion from the midst of the camp until they were finished off.
translation:
  language: id
  text: Selain itu, tangan Yahweh melawan mereka untuk menimbulkan kekacauan di antara mereka, sampai mereka habis dibinasakan dari tengah-tengah perkemahan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sampai mereka habis,” “sampai mereka berakhir,” atau “sampai mereka binasa.” Kata kerja Ibrani untuk “menimbulkan kekacauan” dapat juga berarti “membuat mereka panik” atau “memorakporandakan mereka”; kata ini menunjuk pada kepanikan, kebingungan, atau kekacauan sebagai tindakan penghukuman ilahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: Bahkan
  rationale: Menyampaikan daya tambah sekaligus penegasan yang menghubungkan ayat ini dengan pernyataan sebelumnya.
- source_word: יַד יְהוָה
  choice: tangan Yahweh
  rationale: Mempertahankan ungkapan konkret Ibrani tentang kuasa dan tindakan ilahi serta menyatakan nama perjanjian יְהוָה sebagai “Yahweh”.
- source_word: בָם
  choice: melawan mereka
  rationale: Dalam ungkapan tentang tangan Yahweh, preposisi ini menunjukkan tindakan yang memusuhi atau menentang mereka.
- source_word: לְהֻמָּם
  choice: untuk membuat mereka kacau-balau
  rationale: Bentuk infinitif kausatif dari המם dapat menunjuk pada tindakan menimbulkan kepanikan, kebingungan, atau kekacauan; pilihan ini tidak meleburkan tindakan tersebut ke dalam akibat akhirnya, yaitu lenyapnya mereka.
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: dari tengah-tengah perkemahan
  rationale: Mempertahankan gambaran spasial bahwa mereka disingkirkan dari bagian dalam komunitas perkemahan.
- source_word: עַד תֻּמָּם
  choice: sampai mereka lenyap
  rationale: Menyatakan berakhirnya kelompok itu di bawah penghukuman sambil mempertahankan keluwesan makna antara habis, berakhir, dan binasa.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama ilahi, bukan menggantinya dengan gelar.
- issue: Sifat tindakan tangan Yahweh
  choice: melawan mereka
  alternative: atas mereka; di antara mereka
  rationale: Konteks penghukuman dan pemusnahan generasi itu mendukung daya adversatif, tetapi ungkapan antropomorfis “tangan Yahweh” tetap dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Ungkapan Ibrani “tangan Yahweh” dipertahankan, sedangkan לְהֻמָּם diungkapkan secara idiomatis sebagai “membuat mereka kacau-balau.” Penanda catatan kaki ditempatkan langsung pada frasa yang dijelaskannya.
