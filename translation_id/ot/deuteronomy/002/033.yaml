base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/033.yaml
  text: And Yahweh our God gave him over to us[a], and we struck him down[b], along with his sons and all his people.
translation:
  language: id
  text: Yahweh, Allah kita, menyerahkan dia kepada kita[a], lalu kita menewaskannya, beserta anak-anaknya[b] dan seluruh rakyatnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memberikan dia di hadapan kita”; dalam konteks ini artinya Yahweh menyerahkan dia ke dalam kuasa Israel.
    reason: lexical_alternative
  - marker: b
    text: Teks konsonantal Ibrani berbunyi “anaknya”; pembacaan tradisional memahaminya sebagai “anak-anaknya”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְּנֵהוּ ... לְפָנֵינוּ
  choice: menyerahkan dia kepada kita
  rationale: Gabungan נתן dengan לְפָנֵינוּ dalam konteks peperangan menyatakan bahwa musuh diserahkan ke dalam kuasa Israel; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan makna idiomatisnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Bentuk dengan akhiran orang pertama jamak berarti 'Allah kita'; 'Allah' merupakan sebutan baku dan wajar bagi God dalam bahasa Indonesia.
- source_word: וַנַּךְ אֹתוֹ
  choice: lalu kita menewaskan dia
  rationale: Dalam laporan perang, נכה menyatakan pukulan yang berakibat pada kekalahan atau kematian. 'Menewaskan' menyampaikan daya verba tersebut secara alami tanpa memperluasnya menjadi pemusnahan.
- source_word: בנו
  choice: anak-anaknya
  rationale: Teks konsonantal dapat dibaca sebagai bentuk tunggal 'anaknya', sedangkan pembacaan tradisional memahami bentuk jamak; bentuk jamak dipakai dalam teks utama dan perbedaannya dicatat.
- source_word: כָּל עַמּוֹ
  choice: seluruh rakyatnya
  rationale: עַם berarti 'rakyat/bangsa'. Dengan rujukan kepada seorang raja, 'seluruh rakyatnya' lebih tepat dan alami daripada membatasinya secara interpretatif menjadi tentara.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama diri ilahi; 'Yahweh' mempertahankan nama itu alih-alih menggantinya dengan sebuah gelar.
- issue: Cakupan pihak yang ditaklukkan bersama Sihon
  choice: anak-anaknya (jamak)
  alternative: anaknya (tunggal)
  rationale: Pembacaan jamak tradisional diikuti dalam teks utama, tetapi ambiguitas antara teks konsonantal dan pembacaan tradisional dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum; istilah peperangan tetap tegas, sementara ambiguitas tekstual pada בנו dijelaskan tanpa diselesaikan secara diam-diam.
