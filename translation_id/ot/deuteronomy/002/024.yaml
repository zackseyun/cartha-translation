id: DEU.2.24
reference: Deuteronomy 2:24
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: ק֣וּמוּ סְּע֗וּ וְ/עִבְרוּ֮ אֶת נַ֣חַל אַרְנֹן֒ רְאֵ֣ה נָתַ֣תִּי בְ֠/יָדְ/ךָ אֶת סִיחֹ֨ן מֶֽלֶךְ חֶשְׁבּ֧וֹן הָֽ/אֱמֹרִ֛י וְ/אֶת אַרְצ֖/וֹ הָחֵ֣ל רָ֑שׁ וְ/הִתְגָּ֥ר בּ֖/וֹ מִלְחָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/024.yaml
  text: Rise up[a], set out, and cross over the Arnon Valley. See, I have given into your hand Sihon king of Heshbon, the Amorite, and his land. Begin to take possession of it[c][b], and engage him in battle.
translation:
  language: id
  text: Bangkitlah, berangkatlah, dan seberangilah Wadi Arnon.[a] Lihatlah, Aku telah menyerahkan ke dalam tanganmu Sihon, raja Hesbon, orang Amori itu, beserta negerinya. Mulailah menguasai negerinya[b] dan berperanglah melawan dia.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Lembah Arnon” atau “Sungai Arnon.” Kata Ibrani נחל dapat menunjuk pada wadi, alur sungai, atau lembah.
    reason: lexical_alternative
  - marker: b
    text: Atau “mulailah mengambilnya menjadi milikmu.” Kata kerjanya juga dapat berarti “menghalau penduduknya”, tetapi objek yang dimaksud dalam konteks ini adalah negeri Sihon.
    reason: lexical_alternative
  - marker: c
    text: Atau “tantanglah dia untuk berperang” atau “lancarkan perang terhadapnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וּמוּ
  choice: Bangkitlah
  rationale: Imperatif jamak dari קום yang memerintahkan umat untuk bangun dan mulai bergerak; bentuk ini wajar sekaligus bermartabat dalam bahasa Indonesia.
- source_word: סְּע֗וּ
  choice: berangkatlah
  rationale: Dalam konteks perjalanan, נסע berarti berangkat atau meneruskan perjalanan; 'berangkatlah' jelas dan alami.
- source_word: וְ/עִבְרוּ֮
  choice: dan seberangilah
  rationale: עבר dengan objek geografis menunjuk pada tindakan menyeberangi batas atau alur air.
- source_word: נַ֣חַל אַרְנֹן
  choice: Wadi Arnon
  rationale: נחל dapat berarti wadi, lembah beralur air, atau sungai kecil. 'Wadi' paling tepat mempertahankan ciri geografis tanpa menyiratkan aliran air yang selalu ada.
- source_word: רְאֵ֣ה
  choice: Lihatlah
  rationale: Imperatif tunggal ini menarik perhatian Musa kepada pernyataan ilahi berikutnya.
- source_word: נָתַ֣תִּי בְ֠/יָדְ/ךָ
  choice: Aku telah menyerahkan ke dalam tanganmu
  rationale: Mempertahankan aspek selesai dari נָתַתִּי dan citra idiom Ibrani tentang penyerahan ke dalam kuasa seseorang.
- source_word: סִיחֹ֨ן מֶֽלֶךְ חֶשְׁבּ֧וֹן הָֽ/אֱמֹרִ֛י
  choice: Sihon, raja Hesbon, orang Amori itu
  rationale: 'Urutan aposisi mengikuti teks Ibrani: nama, jabatan dan wilayah pemerintahan, lalu identitas etnis.'
- source_word: וְ/אֶת אַרְצ֖/וֹ
  choice: beserta negerinya
  rationale: אֶרֶץ di sini menunjuk pada wilayah kekuasaan Sihon; 'negeri' alami dalam konteks kerajaan.
- source_word: הָחֵ֣ל רָ֑שׁ
  choice: Mulailah mendudukinya
  rationale: החל berarti 'mulailah', sedangkan ירש dalam konteks negeri dapat berarti mengambil milik atau menduduki. Akhiran '-nya' merujuk kepada negeri Sihon.
- source_word: וְ/הִתְגָּ֥ר בּ֖/וֹ מִלְחָמָֽה
  choice: dan hadapilah dia dalam peperangan
  rationale: Ungkapan ini memerintahkan dimulainya permusuhan atau pertempuran terhadap Sihon; 'hadapilah ... dalam peperangan' jelas tanpa membatasi makna pada sekadar provokasi.
theological_decisions:
- issue: Pemberian ilahi dan tindakan manusia dalam penaklukan
  choice: Mempertahankan baik pemberian Allah sebagai tindakan yang telah dinyatakan selesai maupun perintah agar Israel bertindak.
  alternative: Menerjemahkan 'Aku akan menyerahkan' sebagai janji masa depan, atau menonjolkan 'menghalau' sebagai arti utama ירש.
  rationale: Teks Ibrani menyandingkan נָתַתִּי, 'Aku telah menyerahkan', dengan imperatif untuk mulai menduduki dan berperang. Terjemahan tidak melemahkan salah satu sisi ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada perintah yang tegas dan bermartabat. 'Wadi' dipakai dalam teks utama karena ketepatan geografis, lalu dijelaskan melalui catatan kaki. Semua imperatif jamak Ibrani diterjemahkan secara alami tanpa menandai jumlah secara eksplisit, sebagaimana lazim dalam bahasa Indonesia.
