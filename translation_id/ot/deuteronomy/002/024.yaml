  source_fidelity: 'Makna pokok terpelihara: perintah untuk bergerak dan menyeberangi Arnon, pemberian Sihon serta negerinya oleh Allah, lalu perintah untuk mulai menguasai negeri itu dan berperang melawan Sihon. Namun, “mendudukinya” dapat terutama berarti menempati atau mengokupasi dan tidak cukup jelas menyampaikan ירש sebagai mengambil alih/menguasai negeri. “Hadapilah dia dalam peperangan” juga kurang langsung untuk הִתְגָּר בּוֹ מִלְחָמָה.'
  naturalness: Bahasa umumnya baku dan alami. “Mulailah menguasai negerinya dan berperanglah melawan dia” lebih jelas dan idiomatis dalam bahasa Indonesia modern daripada “Mulailah mendudukinya dan hadapilah dia dalam peperangan.”
  terminology: “Wadi Arnon” tepat dan catatannya memadai. “Sihon, raja Hesbon, orang Amori itu” mempertahankan aposisi Ibrani dan identitas etnisnya. “Aku telah menyerahkan ke dalam tanganmu” dengan baik mempertahankan metafora dan bentuk perfektum Ibrani.
