  to: Bangkitlah, berangkatlah, dan seberangilah Wadi Arnon.[a] Lihatlah, Aku telah menyerahkan ke dalam tanganmu Sihon, raja Hesbon, orang Amori itu, beserta negerinya. Mulailah menguasai negerinya[b] dan berperanglah melawan dia.[c]
  rationale: Revisi terbatas pada dua verba utama dan penyesuaian catatan kaki c. “Menguasai” menyampaikan pengertian ירש terhadap negeri tanpa memaksakan nuansa “menghalau” sebagai teks utama. “Berperanglah melawan dia” menyatakan secara eksplisit tindakan yang diperintahkan oleh הִתְגָּר בּוֹ מִלְחָמָה. Tidak ada perubahan pada makna teologis maupun pada identifikasi geografis dan tokoh.
