language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: רַ֛ק אֶל אֶ֥רֶץ בְּנֵי עַמּ֖וֹן לֹ֣א קָרָ֑בְתָּ כָּל יַ֞ד נַ֤חַל יַבֹּק֙ וְ/עָרֵ֣י הָ/הָ֔ר וְ/כֹ֥ל אֲשֶׁר צִוָּ֖ה יְהוָ֥ה אֱלֹהֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/037.yaml
  text: Only you did not come near the land of the sons of Ammon[a], all along the bank of the Jabbok, and the cities of the hill country[c][b], and all that Yahweh our God had commanded.
translation:
  language: id
  text: Hanya, kamu tidak mendekati negeri orang Amon[a], seluruh daerah di sepanjang Wadi Yabok[b], kota-kota di daerah pegunungan, ataupun segala yang diperintahkan Yahweh, Allah kita.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “negeri anak-anak Amon.” Secara harfiah: “negeri anak-anak Amon.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “seluruh tangan Wadi Yabok.” Dalam ungkapan ini, “tangan” berarti sisi, tepian, atau daerah di sepanjang aliran air.'
    reason: cultural_note
  - marker: c
    text: Bahasa Ibrani membiarkan isi atau objek lengkap perintah itu tersirat. Dalam konteks ini, perintah tersebut berkaitan dengan wilayah-wilayah yang tidak didekati.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Hanya saja
  rationale: Menandai pengecualian terhadap rangkuman sebelumnya dengan ungkapan Indonesia yang alami.
- source_word: אֶל אֶרֶץ בְּנֵי עַמּוֹן
  choice: negeri bani Amon
  rationale: Mempertahankan bentuk harfiah ‘anak-anak Amon’ melalui istilah Indonesia yang mapan, ‘bani Amon’, tanpa kehilangan rujukan kepada bangsa atau wilayah mereka.
- source_word: לֹא קָרָבְתָּ
  choice: kamu tidak mendekati
  rationale: Menjaga makna spasial verba קרב dan tidak mempersempitnya menjadi tindakan menyerang.
- source_word: כָּל יַד נַחַל יַבֹּק
  choice: seluruh daerah di sepanjang Wadi Yabok
  rationale: יד di samping aliran air merupakan idiom untuk sisi, tepian, atau kawasan di sepanjang aliran itu; ‘daerah di sepanjang’ jelas dalam bahasa Indonesia modern.
- source_word: וְעָרֵי הָהָר
  choice: kota-kota di pegunungan
  rationale: הָהָר di sini menunjuk kawasan tanah tinggi atau pegunungan, bukan semata-mata satu gunung.
- source_word: וְכֹל אֲשֶׁר צִוָּה
  choice: ataupun segala sesuatu yang mengenainya ... telah memberi perintah
  rationale: Mempertahankan keluasan dan elipsis bahasa Ibrani tanpa secara diam-diam menambahkan ‘melarang’, meskipun konteks menunjukkan bahwa perintah itu membatasi wilayah yang boleh didekati.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Padanan Indonesia yang lugas untuk sebutan perjanjian dengan pronomina milik orang pertama jamak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi; ‘Yahweh’ mempertahankan nama itu, sedangkan ‘TUHAN’ merupakan penggantian dengan gelar.
- issue: Isi tersirat dalam frasa וְכֹל אֲשֶׁר צִוָּה
  choice: Mempertahankan objek perintah yang tersirat
  alternative: ‘segala tempat yang dilarang Yahweh untuk kami dekati’
  rationale: Bahasa Ibrani tidak menyatakan verba ‘melarang’ atau objek lengkapnya. Konteks mendukung pengertian larangan wilayah, tetapi teks utama tidak boleh menutup ambiguitas itu tanpa catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Kamu’ dipakai untuk sapaan tunggal yang mewakili Israel secara kolektif. ‘Wadi’ mempertahankan jenis aliran/lembah air נַחַל, sementara catatan menjelaskan idiom yang menyertainya. Struktur daftar dijaga meskipun unsur terakhir eliptis dalam bahasa Ibrani.
