base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/028.yaml
  text: You may sell me food for silver[a], so that I may eat, and give me water for silver, so that I may drink[b]; only let me pass through on my feet—
translation:
  language: id
  text: Juallah kepadaku makanan dengan perak[a] supaya aku dapat makan, dan berilah kepadaku air dengan perak supaya aku dapat minum; hanya, izinkanlah aku lewat dengan berjalan kaki[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan uang.” Secara harfiah, bahasa Ibrani berbunyi “dengan perak.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “pada kakiku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹכֶל
  choice: makanan
  rationale: Istilah ini menunjuk pada makanan secara umum, bukan secara khusus roti, gandum, atau bekal.
- source_word: בַּכֶּסֶף
  choice: dengan perak
  rationale: Mempertahankan istilah konkret Ibrani כֶּסֶף dan cara pembayaran; dalam bahasa Indonesia ungkapan ini tetap dapat dipahami, dengan alternatif idiomatis dijelaskan dalam catatan kaki.
- source_word: תַּשְׁבִּרֵנִי
  choice: juallah kepadaku
  rationale: Bentuk Hifil dari שׁבר dalam konteks ini berarti menjual atau menyediakan makanan dengan pembayaran. Bentuk imperatif Indonesia menyampaikan permohonan langsung dalam ujaran ini.
- source_word: וְאָכַלְתִּי
  choice: supaya aku dapat makan
  rationale: Waw dengan bentuk perfektif di sini paling wajar menyatakan hasil atau tujuan yang dimaksudkan, bukan semata-mata urutan tindakan.
- source_word: וּמַיִם
  choice: air
  rationale: Padanan langsung dan alami.
- source_word: תִּתֶּן לִי
  choice: berilah kepadaku
  rationale: Menerjemahkan נתן dengan ל secara langsung dan menjaga kesejajaran dengan permintaan sebelumnya.
- source_word: וְשָׁתִיתִי
  choice: supaya aku dapat minum
  rationale: Sejajar dengan וְאָכַלְתִּי dan menyatakan hasil atau tujuan permintaan.
- source_word: רַק
  choice: hanya
  rationale: Membatasi inti permintaan pada izin untuk melintas.
- source_word: אֶעְבְּרָה
  choice: izinkanlah aku lewat
  rationale: Bentuk kohortatif dalam konteks permohonan ini memiliki nuansa permisif, bukan sekadar pernyataan masa depan.
- source_word: בְרַגְלָי
  choice: dengan berjalan kaki
  rationale: Ungkapan Indonesia yang alami untuk idiom harfiah 'dengan/pada kakiku', tanpa mengubah gagasan perjalanan melalui wilayah itu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “juallah” dan “berilah” menjaga nada permohonan langsung; “izinkanlah aku lewat” menyampaikan nuansa kohortatif. Tanda pisah akhir dipertahankan karena ayat berlanjut ke kalimat berikutnya.
