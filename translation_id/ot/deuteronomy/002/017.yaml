lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu ... berfirman
  rationale: Waw konsekutif melanjutkan urutan narasi, sehingga “Lalu” wajar dalam bahasa Indonesia. Dalam konteks perkataan ilahi, “berfirman” menyampaikan tindakan berbicara dengan ragam yang alami dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap dipertahankan.
- source_word: אֵלַי
  choice: kepadaku
  rationale: Preposisi אֶל dengan sufiks orang pertama tunggal menunjukkan arah ujaran kepada Musa; “kepadaku” merupakan padanan Indonesia yang langsung dan alami.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara terpisah
  rationale: Dalam formula וַיְדַבֵּר ... לֵאמֹר, infinitif ini memperkenalkan ujaran langsung. Bahasa Indonesia secara alami cukup memakai “berfirman kepadaku,” sebelum isi firman; menambahkan “demikian” atau “kata-Nya” akan terasa berulang.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar; catatan kaki memberi tahu pembaca tentang kebiasaan penerjemahan tradisional.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. “Berfirman” lazim untuk perkataan Allah, sedangkan struktur formula Ibrani disesuaikan secara wajar tanpa mengurangi fungsi pengantar ujaran langsung.
