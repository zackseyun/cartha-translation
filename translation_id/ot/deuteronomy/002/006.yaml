base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/006.yaml
  text: You shall buy food from them with silver[a], so that you may eat; and you shall also buy water from them with silver, so that you may drink.
translation:
  language: id
  text: Kamu harus membeli makanan dari mereka dengan perak[a] supaya kamu dapat makan. Kamu juga harus membeli air dari mereka dengan perak supaya kamu dapat minum.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dan kamu akan makan” dan “dan kamu akan minum.” Rangkaian dalam bahasa Ibrani juga dapat dipahami sebagai hasil atau tujuan pembelian perbekalan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹכֶל
  choice: makanan
  rationale: Istilah umum untuk bahan pangan atau sesuatu yang dapat dimakan; konteks tidak membatasinya pada gandum.
- source_word: תִּשְׁבְּרוּ
  choice: harus membeli
  rationale: Dalam konteks memperoleh makanan dengan pembayaran, verba ini berarti membeli; bentuk kewajiban menyampaikan daya perintahnya.
- source_word: מֵאִתָּם
  choice: dari mereka
  rationale: 'Menunjukkan sumber perbekalan: Israel harus memperolehnya dari penduduk setempat, bukan merampasnya.'
- source_word: בַּכֶּסֶף
  choice: dengan perak
  rationale: Mempertahankan ungkapan konkret Ibrani mengenai alat pembayaran; 'uang' lebih interpretatif.
- source_word: וַאֲכַלְתֶּם
  choice: supaya kamu dapat makan
  rationale: Dalam rangkaian instruksi ini, bentuk waw + perfek dapat menyatakan hasil atau tujuan yang dimaksudkan dari pembelian, sambil tetap mengakui terjemahan formal 'dan kamu akan makan'.
- source_word: וְגַם
  choice: juga
  rationale: Menandai tambahan instruksi sejajar mengenai air secara alami dalam bahasa Indonesia.
- source_word: מַיִם
  choice: air
  rationale: Padanan langsung dan wajar.
- source_word: תִּכְרוּ
  choice: harus membeli
  rationale: Walaupun כרה dapat berarti 'menggali' di tempat lain, kesejajaran komersial dengan makanan serta frasa 'dari mereka dengan perak' menunjukkan pembelian.
- source_word: וּשְׁתִיתֶם
  choice: supaya kamu dapat minum
  rationale: Menyampaikan hasil atau tujuan pembelian air secara alami, sejajar dengan klausa mengenai makanan.
theological_decisions:
- issue: Daya etis perintah mengenai sumber daya Edom
  choice: Israel diperintahkan membeli makanan dan air dengan pembayaran, bukan mengambilnya tanpa ganti rugi.
  alternative: Terjemahan yang lebih formal dapat berbunyi 'dan kamu akan makan ... dan kamu akan minum,' sehingga hubungan tujuan atau hasil dibiarkan kurang eksplisit.
  rationale: Konteks dan konstruksi pembayaran mendukung kewajiban memperoleh perbekalan secara sah. 'Supaya' menyampaikan tujuan atau hasil instruksi tanpa menambahkan isi baru, sementara alternatif formal dicatat karena koordinasi Ibraninya dapat dipahami demikian.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan bermartabat. Pronomina 'kamu' dipakai untuk sapaan jamak kolektif kepada Israel; bahasa Indonesia tidak menandai jumlah pada bentuk ini. Titik memisahkan dua instruksi sejajar agar mudah dibaca tanpa mengubah hubungan maknanya.
