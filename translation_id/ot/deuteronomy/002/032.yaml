  text: Then Sihon came out to meet us[a], he and all his people[b], for battle at Jahaz.
translation:
  language: id
  text: Lalu Sihon sendiri keluar menemui kami[a], bersama seluruh rakyatnya, untuk berperang di Yahas.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: menghadapi kami.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: keluar
  rationale: Bentuk naratif dari יצא menyatakan bahwa Sihon bergerak keluar untuk menghadapi Israel; “keluar” alami dan dekat dengan bentuk Ibrani.
- source_word: סִיחֹן
  choice: Sihon
  rationale: Nama diri ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: לִקְרָאתֵנוּ
  choice: menemui kami
  rationale: Ungkapan ini secara harfiah berarti bergerak untuk menemui seseorang. Konteks permusuhannya tetap jelas dari frasa “untuk berperang”; alternatif yang lebih eksplisit dicatat dalam catatan kaki.
- source_word: הוּא וְכָל עַמּוֹ
  choice: bersama seluruh rakyatnya
  rationale: Susunan Indonesia ini secara alami menyampaikan bahwa Sihon sendiri keluar disertai seluruh rakyatnya. “Rakyat” mempertahankan keluasan makna עַם dan tidak mempersempitnya menjadi tentara profesional.
- source_word: לַמִּלְחָמָה
  choice: untuk berperang
  rationale: Frasa ini menyatakan tujuan tindakan mereka dan diterjemahkan secara alami sebagai verba dalam bahasa Indonesia.
- source_word: יָהְצָה
  choice: di Yahas
  rationale: Nama tempat ditransliterasikan sebagai “Yahas”, bentuk yang wajar dalam tradisi Indonesia. Akhiran penunjuk arah pada bentuk Ibrani dipahami dalam konteks sebagai lokasi pertempuran.
