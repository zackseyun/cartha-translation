base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/021.yaml
  text: a people great[a], numerous, and tall like the Anakim. Yahweh destroyed them from before them, and they dispossessed them and lived in their place.
translation:
  language: id
  text: suatu bangsa yang besar, banyak jumlahnya, dan bertubuh tinggi seperti kaum Anakim.[a] Yahweh membinasakan mereka dari hadapan keturunan Esau. Kemudian keturunan Esau mengambil alih milik mereka dan tinggal di tempat mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kaum keturunan Anak.”'
    reason: Nama kelompok Ibrani עֲנָקִים dapat dipertahankan sebagai “Anakim” atau dinyatakan sebagai keturunan Anak.
lexical_decisions:
- source_word: עַם גָּדוֹל וְרַב
  choice: suatu bangsa yang besar, banyak jumlahnya
  rationale: 'Kata benda kolektif tunggal עַם diterjemahkan sebagai “suatu bangsa,” sedangkan dua sifatnya dibedakan: גָּדוֹל sebagai “besar” dan רַב sebagai “banyak jumlahnya.”'
- source_word: רָם
  choice: bertubuh tinggi
  rationale: Dalam perbandingan dengan kaum Anakim, kata ini menunjuk pada tinggi badan; “bertubuh tinggi” terdengar alami untuk menggambarkan suatu kelompok manusia.
- source_word: כָּעֲנָקִים
  choice: seperti kaum Anakim
  rationale: Awalan כְּ menyatakan perbandingan, dan nama kelompok עֲנָקִים dipertahankan dalam bentuk transliterasi “Anakim.”
- source_word: וַיַּשְׁמִידֵם
  choice: membinasakan bangsa itu
  rationale: Bentuk Hifil dari שׁמד menyatakan penghancuran atau penyingkiran kuat. “Membinasakan” mempertahankan daya ungkapnya tanpa secara khusus menambahkan gagasan pemusnahan mutlak.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam Tetragramaton ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: מִפְּנֵיהֶם
  choice: dari hadapan keturunan Esau
  rationale: Ungkapan ini secara harfiah berarti “dari hadapan mereka.” Acuan pronomina dijelaskan berdasarkan konteks langsung, yaitu keturunan Esau, agar alur pelaku tidak rancu dalam bahasa Indonesia.
- source_word: וַיִּירָשֻׁם
  choice: merebut wilayah mereka
  rationale: Dalam konteks pengambilalihan negeri, ירשׁ mencakup tindakan menyingkirkan penghuni sebelumnya dan mengambil alih milik mereka. “Merebut wilayah mereka” menyampaikan makna kontekstual itu secara wajar.
- source_word: וַיֵּשְׁבוּ תַחְתָּם
  choice: tinggal menggantikan mereka
  rationale: תַחְתָּם menyatakan bahwa kelompok baru menempati kedudukan atau tempat kelompok sebelumnya; terjemahan ini mempertahankan gagasan penggantian.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung. Bentuk “Yahweh” mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Acuan pronomina jamak dalam tindakan Yahweh dan pengambilalihan negeri
  choice: “bangsa itu” untuk kaum Emim dan “keturunan Esau” untuk pihak yang mengambil alih
  alternative: mempertahankan semua bentuk sebagai “mereka”
  rationale: Bahasa Ibrani bergantung pada konteks ayat sebelumnya. Penyebutan kembali kedua kelompok mencegah kerancuan dalam bahasa Indonesia tanpa mengubah siapa pelaku dan sasarannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Awal ayat dibiarkan sebagai frasa lanjutan karena struktur Ibraninya meneruskan gambaran pada ayat sebelumnya. Pengulangan “keturunan Esau” dipakai untuk menjernihkan acuan pronomina yang dalam bahasa Ibrani ditentukan oleh konteks.
