translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan tunggal kepada Israel diterjemahkan dengan “kamu,” sedangkan pembicara ilahi ditandai dengan “Aku.” Susunan kalimat dibagi menjadi dua agar hubungan tindakan dan tanggapan mudah dipahami; “lalu” mewakili rangkaian akibat dalam konteks.
