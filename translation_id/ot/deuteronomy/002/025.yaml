base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/025.yaml
  text: Today I will begin to put the dread and fear of you on the face of the peoples under all the heavens[b][a], who will hear the report about you and will tremble and writhe because of you.
translation:
  language: id
  text: Hari ini Aku akan mulai membuat bangsa-bangsa di seluruh kolong langit gentar dan takut terhadapmu. Mereka akan mendengar kabar tentang kamu[a], lalu gemetar dan menggeliat kesakitan[b] karena kamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mendengar kemasyhuranmu” atau “mendengar berita tentang kamu.” Ungkapan Ibrani ini dapat menunjuk pada kabar yang membentuk reputasi seseorang.
    reason: lexical_alternative
  - marker: b
    text: Atau “sangat menderita” atau “menggeliat seperti perempuan yang sedang bersalin.” Kata kerja Ibraninya menggambarkan penderitaan jasmani yang hebat.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַזֶּה
  choice: Hari ini
  rationale: Ungkapan penunjuk waktu ini secara alami dan tepat diterjemahkan sebagai “Hari ini” dalam bahasa Indonesia modern.
- source_word: אָחֵל תֵּת
  choice: Aku akan mulai membuat
  rationale: Bentuk kausatif חלל yang diikuti infinitif נתן membentuk ungkapan “mulai memberikan/menaruh.” Dalam konteks ini, “mulai membuat” menyampaikan secara alami bahwa TUHAN menyebabkan bangsa-bangsa merasa gentar dan takut.
- source_word: פַּחְדְּךָ וְיִרְאָתְךָ
  choice: gentar dan takut kepadamu
  rationale: Kedua nomina menyatakan kengerian dan ketakutan yang ditimbulkan oleh Israel, bukan rasa takut yang dimiliki Israel. Dua istilah dipertahankan agar pasangan kata Ibraninya tidak dilebur menjadi satu.
- source_word: עַל פְּנֵי הָעַמִּים
  choice: bangsa-bangsa
  rationale: Ungkapan עַל־פְּנֵי di sini menunjukkan bahwa kegentaran itu ditimpakan atas bangsa-bangsa. Struktur verbal “membuat bangsa-bangsa ...” menyampaikan hubungan tersebut secara wajar tanpa mempertahankan ungkapan harfiah “di atas muka,” yang tidak alami dalam bahasa Indonesia.
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: di seluruh kolong langit
  rationale: “Kolong langit” merupakan ungkapan Indonesia yang alami untuk wilayah di bawah langit; “seluruh” mempertahankan cakupan luas ungkapan Ibrani.
- source_word: אֲשֶׁר יִשְׁמְעוּן שִׁמְעֲךָ
  choice: Mereka akan mendengar kabar tentang kamu
  rationale: שֵׁמַע dapat berarti kabar, laporan, atau kemasyhuran. “Kabar tentang kamu” mempertahankan keluasan makna itu tanpa membatasi maksudnya hanya pada ketenaran.
- source_word: וְרָגְזוּ
  choice: lalu gemetar
  rationale: Kata kerja ini menggambarkan guncangan atau kegemetaran karena takut. “Gemetar” jelas dan alami dalam konteks ini.
- source_word: וְחָלוּ
  choice: dan menggeliat kesakitan
  rationale: Kata kerja ini dapat menggambarkan tubuh yang menggeliat dalam penderitaan, termasuk gambaran sakit bersalin. Terjemahan utama mempertahankan citra jasmaninya tanpa secara khusus menetapkan persalinan.
- source_word: מִפָּנֶיךָ
  choice: karena kamu
  rationale: Secara harfiah ungkapan ini berarti “dari hadapanmu,” tetapi dalam konteks ini menyatakan penyebab kegemetaran dan kesakitan mereka. “Karena kamu” menyampaikan fungsi tersebut dengan jelas.
