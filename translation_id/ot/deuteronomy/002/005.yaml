revisions:
- from: Jangan memancing permusuhan dengan mereka, sebab Aku tidak akan memberikan kepada kalian sedikit pun dari negeri mereka, bahkan tidak selebar tempat telapak kaki berpijak,[a] karena Pegunungan Seir telah Kuberikan kepada Esau sebagai milik pusaka.[b]
  to: Jangan memancing permusuhan dengan mereka, sebab Aku tidak akan memberikan kepada kalian sedikit pun dari negeri mereka, bahkan tidak ada tempat bagi telapak kaki untuk berpijak,[a] karena Pegunungan Seir telah Kuberikan kepada Esau sebagai milik.[b]
  rationale: Revisi menghilangkan tambahan gagasan “selebar” dan menerjemahkan idiom Ibrani sebagai ketiadaan tempat berpijak, sambil tetap mempertahankan citra telapak kaki. “Milik pusaka” disederhanakan menjadi “milik” agar lebih jelas dalam bahasa Indonesia modern; alternatif “warisan” dicatat karena יְרֻשָּׁה dapat mencakup kedua nuansa.
