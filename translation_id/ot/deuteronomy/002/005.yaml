source:
  edition: WLC
  text: אַל תִּתְגָּר֣וּ בָ֔/ם כִּ֠י לֹֽא אֶתֵּ֤ן לָ/כֶם֙ מֵֽ/אַרְצָ֔/ם עַ֖ד מִדְרַ֣ךְ כַּף רָ֑גֶל כִּֽי יְרֻשָּׁ֣ה לְ/עֵשָׂ֔ו נָתַ֖תִּי אֶת הַ֥ר שֵׂעִֽיר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/005.yaml
  text: Do not provoke them[a], for I will not give you any of their land, not even enough to set the sole of a foot on[c][b], because I have given Mount Seir to Esau as a possession.
translation:
  language: id
  text: Jangan memancing permusuhan dengan mereka, sebab Aku tidak akan memberikan kepada kalian sedikit pun dari negeri mereka, bahkan tidak ada tempat bagi telapak kaki untuk berpijak,[a] karena Pegunungan Seir telah Kuberikan kepada Esau sebagai milik.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “hingga pijakan telapak kaki”; ungkapan ini berarti tidak ada bagian tanah, betapa pun kecilnya.'
    reason: lexical_alternative
  - marker: b
    text: “Milik” juga dapat diterjemahkan “warisan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְגָּרוּ בָם
  choice: memancing permusuhan dengan mereka
  rationale: Bentuk hitpael dari גרה dengan ב menunjuk pada tindakan membangkitkan atau memasuki perseteruan. Dalam konteks larangan terhadap tindakan bermusuhan kepada keturunan Esau, ungkapan ini mempertahankan unsur provokasi sekaligus arah konflik tanpa membatasinya hanya pada pertempuran resmi.
- source_word: לֹא אֶתֵּן לָכֶם מֵאַרְצָם
  choice: Aku tidak akan memberikan kepada kalian sedikit pun dari negeri mereka
  rationale: 'Preposisi מן dipahami secara partitif: tidak ada bagian dari negeri mereka yang akan diberikan. ''Sedikit pun'' menyampaikan penyangkalan menyeluruh secara alami dalam bahasa Indonesia.'
- source_word: עַד מִדְרַךְ כַּף רָגֶל
  choice: bahkan tidak selebar tempat telapak kaki berpijak
  rationale: Ungkapan ini menggambarkan bagian tanah yang sekecil-kecilnya melalui citra pijakan telapak kaki. Terjemahan mempertahankan citra konkret dan menjelaskan daya idiomatisnya secara wajar.
- source_word: יְרֻשָּׁה
  choice: sebagai milik pusaka
  rationale: 'Kata ini dapat berarti milik atau warisan. ''Milik pusaka'' mempertahankan kedua nuansa: kepemilikan yang diberikan dan jatah turun-temurun, tanpa menentukan salah satunya secara berlebihan.'
- source_word: לְעֵשָׂו
  choice: kepada Esau
  rationale: Preposisi ל menandai Esau sebagai penerima pemberian ilahi; nama diri ditransliterasikan menurut bentuk Indonesia yang lazim.
- source_word: הַר שֵׂעִיר
  choice: Pegunungan Seir
  rationale: Dalam konteks geografis, הַר dapat menunjuk bukan hanya satu gunung, melainkan kawasan pegunungan. 'Pegunungan Seir' menghindari kesan bahwa seluruh wilayah Edom yang dimaksud hanya satu puncak.
theological_decisions:
- issue: Pemberian wilayah Edom oleh Allah
  choice: Larangan terhadap Israel didasarkan pada pernyataan Allah bahwa Ia telah memberikan Pegunungan Seir kepada Esau.
  alternative: Memahami ayat ini semata-mata sebagai larangan politik tanpa penekanan pada pembagian wilayah oleh Allah.
  rationale: 'Dua klausa כִּי memberi alasan bagi larangan tersebut: Allah tidak akan memberikan wilayah Edom kepada Israel karena Seir telah Ia berikan kepada Esau. Hubungan teologis ini dipertahankan tanpa penambahan doktrinal.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak 'kalian' untuk membedakan objek jamak dari bentuk hormat tunggal. Diksi dibuat lugas dan bermartabat. 'Pegunungan Seir' dipilih sebagai sebutan kawasan geografis; citra telapak kaki dipertahankan, sedangkan ambiguitas יְרֻשָּׁה dicatat dalam catatan kaki.
