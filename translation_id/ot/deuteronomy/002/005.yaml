  terminology: “Pegunungan Seir” merupakan pilihan yang sah untuk הַר שֵׂעִיר sebagai kawasan pegunungan. “Milik” secara jelas menyampaikan יְרֻשָּׁה dalam konteks pemberian wilayah; kemungkinan “warisan” tetap dicatat tanpa memaksakan nuansa pewarisan.
