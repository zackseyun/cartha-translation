source:
  edition: WLC
  text: כִּי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ בֵּֽרַכְ/ךָ֗ בְּ/כֹל֙ מַעֲשֵׂ֣ה יָדֶ֔/ךָ יָדַ֣ע לֶכְתְּ/ךָ֔ אֶת הַ/מִּדְבָּ֥ר הַ/גָּדֹ֖ל הַ/זֶּ֑ה זֶ֣ה אַרְבָּעִ֣ים שָׁנָ֗ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עִמָּ֔/ךְ לֹ֥א חָסַ֖רְתָּ דָּבָֽר־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/007.yaml
  text: For Yahweh your God has blessed you in all the work of your hands[a]. He has known your walking through this great wilderness. These forty years Yahweh your God has been with you; you have lacked nothing.
translation:
  language: id
  text: Sebab Yahweh, Allahmu, telah memberkatimu dalam segala pekerjaan tanganmu. Ia mengetahui[a] perjalananmu melintasi padang gurun yang luas ini. Selama empat puluh tahun ini Yahweh, Allahmu, menyertaimu; engkau tidak kekurangan apa pun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memperhatikan” atau “mengawasi perjalananmu”. Verba Ibrani secara harfiah berarti “mengetahui”, tetapi dalam konteks ini dapat menyiratkan perhatian dan pemeliharaan yang saksama.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan membedakannya dari gelar seperti “Tuhan”.
- source_word: בֵּרַכְךָ
  choice: telah memberkatimu
  rationale: Bentuk perfektif menggambarkan tindakan yang telah terjadi dan tetap relevan dalam tinjauan Musa; “memberkati” mempertahankan cakupan religius dan perjanjian dari verba itu.
- source_word: בְּכֹל מַעֲשֵׂה יָדֶךָ
  choice: dalam segala pekerjaan tanganmu
  rationale: Mempertahankan ungkapan konkret Ibrani dengan bentuk tunggal “tanganmu”; dalam bahasa Indonesia ungkapan ini dapat dipahami sebagai seluruh pekerjaan atau usaha seseorang.
- source_word: יָדַע
  choice: mengetahui
  rationale: Mempertahankan arti dasar verba “mengetahui” tanpa memasukkan gagasan penjagaan secara diam-diam ke dalam teks utama; nuansa perhatian dan pemeliharaan dijelaskan dalam catatan kaki.
- source_word: לֶכְתְּךָ
  choice: perjalananmu
  rationale: Infinitif dari הלך merujuk pada tindakan berjalan atau menempuh perjalanan; “perjalananmu” alami dalam bahasa Indonesia dan sesuai dengan konteks pengembaraan Israel.
- source_word: אֶת הַמִּדְבָּר הַגָּדֹל הַזֶּה
  choice: melintasi padang gurun yang luas ini
  rationale: “Melintasi” mengungkapkan hubungan antara perjalanan Israel dan wilayah yang ditempuh, sedangkan “luas” menyampaikan ukuran padang gurun secara alami.
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: selama empat puluh tahun ini
  rationale: Merupakan padanan Indonesia yang alami bagi ungkapan waktu yang menunjukkan keseluruhan masa empat puluh tahun hingga saat pembicaraan.
- source_word: עִמָּךְ
  choice: menyertaimu
  rationale: Frasa harfiah “denganmu” dinyatakan dengan verba Indonesia yang alami dan mempertahankan makna kehadiran Allah yang berlangsung terus.
- source_word: לֹא חָסַרְתָּ דָּבָר
  choice: engkau tidak kekurangan apa pun
  rationale: Padanan idiomatis yang menyatakan kecukupan menyeluruh tanpa mempersempit arti דָּבָר.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi Allah; “Yahweh” mempertahankan nama itu alih-alih menggantinya dengan sebuah gelar.
- issue: Nuansa יָדַע dalam hubungan dengan perjalanan Israel
  choice: mengetahui, dengan catatan tentang perhatian dan pemeliharaan
  alternative: mengawasi atau menjaga
  rationale: Arti dasar “mengetahui” dipertahankan agar ketegangan leksikal tidak diselesaikan secara berlebihan, sementara konteks memungkinkan pengertian bahwa pengetahuan Yahweh mencakup perhatian dan pemeliharaan-Nya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan tunggal dipertahankan dengan “-mu” dan “engkau”, sesuai dengan bentuk orang kedua tunggal dalam teks Ibrani yang menyapa Israel sebagai satu umat. Metafora “pekerjaan tanganmu” dipertahankan karena tetap jelas dan wajar dalam ragam Alkitabiah Indonesia.
