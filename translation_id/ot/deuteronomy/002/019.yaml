source:
  edition: WLC
  text: וְ/קָרַבְתָּ֗ מ֚וּל בְּנֵ֣י עַמּ֔וֹן אַל תְּצֻרֵ֖/ם וְ/אַל תִּתְגָּ֣ר בָּ֑/ם כִּ֣י לֹֽא אֶ֠תֵּן מֵ/אֶ֨רֶץ בְּנֵי עַמּ֤וֹן לְ/ךָ֙ יְרֻשָּׁ֔ה כִּ֥י לִ/בְנֵי ל֖וֹט נְתַתִּ֥י/הָ יְרֻשָּֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/019.yaml
  text: When you come opposite the sons of Ammon[a], do not harass them or provoke them, for I will not give you any of the land of the sons of Ammon as a possession[c][b], because I have given it as a possession to the sons of Lot.
translation:
  language: id
  text: Ketika engkau datang berhadapan dengan bani Amon[a], janganlah mengusik mereka[b] atau memancing pertikaian dengan mereka, sebab Aku tidak akan memberikan kepadamu sedikit pun dari negeri bani Amon sebagai milik[c], karena negeri itu telah Kuberikan sebagai milik kepada bani Lot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Amon”; demikian juga selanjutnya dalam ayat ini.
    reason: lexical_alternative
  - marker: b
    text: Atau “menyerang mereka”. Kata Ibrani ini dapat melarang tindakan bermusuhan secara luas, bukan hanya pengepungan resmi.
    reason: lexical_alternative
  - marker: c
    text: Atau “sebagai milik pusaka”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרַבְתָּ מוּל
  choice: Ketika engkau mendekati
  rationale: Konstruksi ini menggambarkan Israel datang mendekat dan berhadapan dengan bani Amon. Ungkapan Indonesia ini menyampaikan gerak mendekat secara alami tanpa menambahkan gagasan bahwa Israel memasuki wilayah mereka.
- source_word: בְּנֵי עַמּוֹן
  choice: bani Amon
  rationale: “Bani” mempertahankan ungkapan kekerabatan Ibrani sekaligus merupakan sebutan bangsa yang ringkas dan dikenal dalam bahasa Indonesia.
- source_word: אַל תְּצֻרֵם
  choice: janganlah memusuhi mereka
  rationale: Dalam konteks ini, verba tersebut melarang tindakan bermusuhan secara luas. “Memusuhi” tidak mempersempit maknanya hanya menjadi pengepungan resmi atau satu serangan tertentu.
- source_word: וְאַל תִּתְגָּר בָּם
  choice: atau memancing pertikaian dengan mereka
  rationale: Bentuk hitpael dari גרה menyatakan tindakan membangkitkan atau memasuki perselisihan. Terjemahan ini menjaga nuansa permusuhan tanpa menambahkan kata “perang”, yang tidak muncul dalam ayat ini.
- source_word: מֵאֶרֶץ בְּנֵי עַמּוֹן
  choice: sedikit pun dari negeri bani Amon
  rationale: '“Sedikit pun dari” menyatakan daya partitif מִן di bawah penyangkalan: tidak ada bagian dari negeri itu yang akan diberikan kepada Israel.'
- source_word: יְרֻשָּׁה
  choice: sebagai milik
  rationale: Dalam konteks pembagian tanah, kata ini menunjuk pada wilayah yang dianugerahkan untuk dimiliki. “Milik” jelas dan alami, sementara kemungkinan makna “milik pusaka” dicatat dalam catatan kaki.
- source_word: לִבְנֵי לוֹט
  choice: kepada bani Lot
  rationale: Pilihan ini mempertahankan kesejajaran ungkapan kekerabatan dengan “bani Amon” dan tidak mengganti bentuk sumber dengan penjelasan eksplisit “keturunan Lot”.
- source_word: נְתַתִּיהָ
  choice: negeri itu telah Kuberikan
  rationale: Bentuk perfektif menyatakan pemberian ilahi yang telah dilakukan dan tetap berlaku. Objek pronominal feminin dijelaskan secara alami sebagai “negeri itu”.
theological_decisions:
- issue: Ungkapan kekerabatan בְּנֵי dalam sebutan suatu bangsa
  choice: bani Amon / bani Lot
  alternative: orang Amon / keturunan Lot
  rationale: “Bani” mempertahankan bingkai keturunan dan hubungan keluarga yang terdapat dalam teks Ibrani, tanpa menjadikannya dasar bagi penafsiran denominasi tertentu.
- issue: Makna יְרֻשָּׁה dalam pemberian tanah
  choice: sebagai milik
  alternative: sebagai milik pusaka
  rationale: “Milik” menonjolkan hak atas tanah yang dianugerahkan Allah, tetapi catatan kaki mempertahankan kemungkinan nuansa warisan atau pusaka yang sungguh terdapat dalam istilah Ibrani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Pronomina “engkau” mengikuti sapaan tunggal kepada Israel sebagai umat kolektif; kapitalisasi “Aku” dan bentuk terikat “Kuberikan” menandai pembicara ilahi. “Bani” dipakai untuk mempertahankan bahasa kekerabatan sumber tanpa terdengar arkais secara berlebihan.
