  variant: modern standard Indonesian
source:
  edition: WLC
  text: מֵֽ/עֲרֹעֵ֡ר אֲשֶׁר֩ עַל שְׂפַת נַ֨חַל אַרְנֹ֜ן וְ/הָ/עִ֨יר אֲשֶׁ֤ר בַּ/נַּ֨חַל֙ וְ/עַד הַ/גִּלְעָ֔ד לֹ֤א הָֽיְתָה֙ קִרְיָ֔ה אֲשֶׁ֥ר שָׂגְבָ֖ה מִמֶּ֑/נּוּ אֶת הַ/כֹּ֕ל נָתַ֛ן יְהוָ֥ה אֱלֹהֵ֖י/נוּ לְ/פָנֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/002/036.yaml
  text: From Aroer[a], which is on the edge of the Arnon Valley, and the city that is in the valley, as far as Gilead, there was no town too high for us; Yahweh our God gave all of it before us.
translation:
  language: id
  text: Dari Aroer, yang terletak di tepi Lembah Arnon, dan kota yang berada di lembah itu, sampai ke Gilead, tidak ada kota yang terlalu tinggi bagi kita.[a] Yahweh, Allah kita, menyerahkan semuanya kepada kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak ada kota yang terlalu kuat bagi kita” atau “tidak ada kota yang tidak dapat kita capai.” Secara harfiah, bahasa Ibrani menyatakan bahwa tidak ada kota yang “terlalu tinggi bagi kita”; ketinggian dipakai sebagai gambaran tentang kekuatan pertahanan atau keadaan yang sulit dijangkau.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֲרֹעֵר
  choice: Dari Aroer
  rationale: Prefiks מ menandai titik awal rentang geografis; bentuk ini alami dalam bahasa Indonesia.
- source_word: שְׂפַת נַחַל אַרְנֹן
  choice: tepi Lembah Arnon
  rationale: שָׂפָה berarti bibir, tepi, atau sisi; נַחַל dapat menunjuk lembah sungai atau wadi. 'Tepi Lembah Arnon' jelas dan tidak terlalu teknis.
- source_word: וְהָעִיר אֲשֶׁר בַּנַּחַל
  choice: dan kota yang berada di lembah itu
  rationale: Mempertahankan konjungsi sederhana waw dan rincian geografis tanpa menambahkan 'dari' yang tidak dinyatakan pada frasa ini.
- source_word: וְעַד הַגִּלְעָד
  choice: sampai ke Gilead
  rationale: עַד menandai batas akhir rentang wilayah.
- source_word: קִרְיָה
  choice: kota
  rationale: קִרְיָה menunjuk permukiman kota, dalam konteks ini kemungkinan kota berkubu; 'kota' merupakan padanan Indonesia yang wajar.
- source_word: שָׂגְבָה מִמֶּנּוּ
  choice: terlalu tinggi bagi kita
  rationale: Mempertahankan metafora Ibrani tentang ketinggian, yang dalam konteks militer menyiratkan kekuatan pertahanan atau ketakterjangkauan.
- source_word: אֶת־הַכֹּל
  choice: semuanya
  rationale: Frasa kolektif ini mencakup seluruh wilayah dan kota yang baru disebutkan tanpa memaksakan referen tunggal atau jamak.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Yahweh, Allah kita
  rationale: Nama ilahi יְהוָה ditransliterasikan sebagai 'Yahweh', sedangkan אֱלֹהֵינוּ diterjemahkan 'Allah kita'.
- source_word: נָתַן ... לְפָנֵינוּ
  choice: diserahkan ... kepada kita
  rationale: Dalam konteks penaklukan, ungkapan ini berarti bahwa Yahweh menyerahkan semuanya ke dalam kuasa Israel. Bentuk pasif menghasilkan susunan Indonesia yang alami sambil mempertahankan Yahweh sebagai pelaku yang dinyatakan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יְהוָה secara langsung; 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Peran Yahweh dalam penaklukan
  choice: Semuanya diserahkan Yahweh, Allah kita, kepada kita
  alternative: Yahweh, Allah kita, memberikan semuanya di hadapan kita
  rationale: Terjemahan ini mempertahankan Yahweh sebagai pelaku penyerahan dan mengungkapkan idiom לְפָנֵינוּ secara alami dalam konteks militer, tanpa menambahkan penilaian teologis atas tindakan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Metafora sumber 'terlalu tinggi' dipertahankan dalam teks utama, sementara makna militernya dijelaskan dalam catatan kaki.
