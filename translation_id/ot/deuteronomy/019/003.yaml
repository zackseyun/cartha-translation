revisions:
- from: Persiapkanlah jalan, dan bagilah wilayah negerimu menjadi tiga bagian—negeri yang diberikan Yahweh, Allahmu, kepadamu sebagai milik pusaka—supaya setiap orang yang membunuh[a] dapat melarikan diri ke sana.
  to: Persiapkanlah jalan dan bagilah wilayah negerimu, yang Yahweh, Allahmu, berikan kepadamu sebagai milik pusaka, menjadi tiga bagian, supaya setiap orang yang membunuh[a] dapat melarikan diri ke sana.
  rationale: Revisi hanya memperbaiki pelekatan klausa relatif agar secara eksplisit dan alami menerangkan wilayah negeri yang dibagikan tiga. Makna, register, nama ilahi, istilah warisan, serta ambiguitas hukum pada רֹצֵחַ tetap dipertahankan. Catatan kaki a tetap tertambat pada istilah yang relevan dan tidak diperlukan catatan tersendiri untuk konstruksi tujuan yang telah diterjemahkan dengan wajar.
