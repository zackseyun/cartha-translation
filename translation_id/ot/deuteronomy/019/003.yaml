source:
  edition: WLC
  text: תָּכִ֣ין לְ/ךָ֮ הַ/דֶּרֶךְ֒ וְ/שִׁלַּשְׁתָּ֙ אֶת גְּב֣וּל אַרְצְ/ךָ֔ אֲשֶׁ֥ר יַנְחִֽילְ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/הָיָ֕ה לָ/נ֥וּס שָׁ֖מָּ/ה כָּל רֹצֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/003.yaml
  text: You shall prepare the road for yourself[a], and you shall divide into three parts the territory of your land that Yahweh your God is giving you as an inheritance[b], so that every manslayer may flee there.
translation:
  language: id
  text: Persiapkanlah jalan dan bagilah wilayah negerimu, yang Yahweh, Allahmu, berikan kepadamu sebagai milik pusaka, menjadi tiga bagian, supaya setiap orang yang membunuh[a] dapat melarikan diri ke sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang dipakai di sini dapat berarti orang yang menyebabkan kematian; ayat ini sendiri belum menentukan apakah tindakan itu disengaja atau tidak.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּכִין לְךָ הַדֶּרֶךְ
  choice: Persiapkanlah jalan
  rationale: Bentuk Hifil תָּכִין menyatakan tindakan menyiapkan atau membuat siap. לְךָ tidak perlu diterjemahkan secara kaku sebagai 'bagimu' karena dalam bahasa Indonesia perintah ini sudah jelas ditujukan kepada Israel dan objeknya ialah jalan yang harus disiapkan.
- source_word: וְשִׁלַּשְׁתָּ אֶת גְּבוּל אַרְצְךָ
  choice: dan bagilah wilayah negerimu menjadi tiga bagian
  rationale: Dalam konteks geografis ini, גְּבוּל menunjuk pada cakupan wilayah, bukan hanya garis perbatasan. Bentuk dari שלש menyatakan pembagian menjadi tiga.
- source_word: יַנְחִילְךָ
  choice: yang diberikan ... kepadamu sebagai milik pusaka
  rationale: Bentuk Hifil dari נחל menggabungkan gagasan pemberian dengan penerimaan warisan; terjemahan ini mempertahankan kedua unsur tersebut secara wajar dalam bahasa Indonesia.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Allahmu
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh', sedangkan אֱלֹהֶיךָ diterjemahkan secara langsung sebagai 'Allahmu'.
- source_word: וְהָיָה לָנוּס שָׁמָּה
  choice: supaya ... dapat melarikan diri ke sana
  rationale: Ungkapan Ibrani yang padat, secara harfiah 'dan itu akan menjadi untuk melarikan diri ke sana', menyatakan tujuan; bentuk purposif ini alami tanpa menambahkan isi.
- source_word: כָּל רֹצֵחַ
  choice: setiap orang yang membunuh
  rationale: Dalam hukum kota perlindungan, רֹצֵחַ mencakup orang yang menyebabkan kematian dan tidak dengan sendirinya menetapkan bahwa perbuatannya merupakan pembunuhan berencana. Ungkapan Indonesia ini mempertahankan keluasan istilah tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama pribadi perjanjian יהוה; 'Yahweh' mempertahankan nama itu secara langsung.
- issue: Apakah רֹצֵחַ menyatakan pembunuhan bersalah atau kategori yang lebih luas
  choice: orang yang membunuh
  alternative: pembunuh
  rationale: Konteks kota perlindungan mencakup kematian yang tidak disengaja. Pilihan ini tidak terlebih dahulu menentukan niat atau kadar kesalahan orang tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk perintah tunggal dipertahankan melalui akhiran -lah. Tanda pisah menandai klausa relatif yang menerangkan negeri tanpa mengaburkan perintah utama.
