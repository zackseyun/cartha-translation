  source_fidelity: 'Makna pokok terpelihara: jalan harus disiapkan, wilayah tanah yang dianugerahkan Yahweh dibagi tiga, dan orang yang membunuh dapat melarikan diri ke sana. Namun, klausa relatif Ibrani "yang Yahweh, Allahmu, berikan kepadamu sebagai milik pusaka" menerangkan "wilayah negerimu" dan perlu ditempatkan langsung bersamanya.'
  naturalness: Tanda pisah dalam draf membuat "negeri yang diberikan ..." tampak sebagai keterangan tambahan yang tidak lengkap dan secara sintaksis terlepas dari "wilayah negerimu". Menempatkan klausa relatif setelah nomina yang diterangkannya menghasilkan bahasa Indonesia baku yang lebih jelas.
  terminology: '"Yahweh, Allahmu" tepat untuk יהוה אֱלֹהֶיךָ. "Orang yang membunuh" dan catatan kaki mempertahankan keluasan רֹצֵחַ dalam konteks kota perlindungan tanpa menyempitkannya menjadi pembunuh yang disengaja. "Milik pusaka" dapat dipertahankan sebagai padanan idiomatis bagi pemberian sebagai warisan.'
  issues:
