translation_notes:
  register: Bahasa hukum yang lugas, modern, dan bermartabat. Kata 'maka' menghubungkan ayat ini dengan putusan pada konteks sebelumnya. Istilah 'penuntut darah' dipertahankan sebagai ungkapan teknis dan dijelaskan melalui catatan kaki.
