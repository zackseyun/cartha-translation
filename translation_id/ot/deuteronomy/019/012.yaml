  text: then the elders of his city shall send and take him from there and hand him over to the avenger of blood[a], and he shall die.
translation:
  language: id
  text: maka para tua-tua kotanya harus mengirim orang untuk mengambilnya dari sana dan menyerahkannya kepada pembalas darah[a], lalu ia harus mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penuntut darah”. Ungkapan Ibrani גֹּאֵל הַדָּם adalah istilah hukum bagi orang yang bertanggung jawab melakukan pembalasan atas penumpahan darah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁלְחוּ
  choice: harus mengutus orang
  rationale: Dalam konteks hukum, bentuk ini menyatakan kewajiban. Objek yang tidak disebutkan dalam bahasa Ibrani dibuat tersirat secara alami dalam bahasa Indonesia dengan 'orang', tanpa menentukan siapa utusannya.
- source_word: זִקְנֵי עִירוֹ
  choice: para tua-tua kotanya
  rationale: Menunjuk para pemimpin sipil yang diakui dalam kota orang tersebut; 'tua-tua' mempertahankan istilah kelembagaan Alkitab yang lazim.
- source_word: וְלָקְחוּ אֹתוֹ מִשָּׁם
  choice: mengambil dia dari sana
  rationale: Mempertahankan arti umum לקח dan tidak menambahkan kadar kekerasan yang tidak dinyatakan secara eksplisit.
- source_word: וְנָתְנוּ אֹתוֹ בְּיַד
  choice: menyerahkannya kepada
  rationale: Ungkapan harfiah 'memberikan ke dalam tangan' menyatakan penyerahan seseorang ke dalam kuasa atau wewenang pihak lain; 'menyerahkan kepada' merupakan padanan hukum yang alami.
- source_word: גֹּאֵל הַדָּם
  choice: penuntut darah
  rationale: Mempertahankan sifat teknis dan unsur 'darah' dalam ungkapan hukum Ibrani, yakni orang yang berwenang menuntut pembalasan atas darah yang tertumpah.
- source_word: וָמֵת
  choice: lalu ia harus mati
  rationale: Menyampaikan hasil hukum yang tegas setelah penyerahan, tanpa menambahkan cara atau pelaku kematian yang tidak dinyatakan dalam klausa ini.
