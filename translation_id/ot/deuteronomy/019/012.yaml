  rationale: Revisi mengganti istilah utama bagi גֹּאֵל הַדָּם dengan “pembalas darah” agar fungsi legalnya tersampaikan secara tepat, sambil mempertahankan “penuntut darah” sebagai kemungkinan leksikal di catatan kaki. Penyesuaian “mengambilnya” meningkatkan kelancaran bahasa Indonesia tanpa mengubah isi.
