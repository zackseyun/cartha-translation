  source_fidelity: Istilah גֹּאֵל הַדָּם tidak sekadar menunjuk pihak yang mengajukan tuntutan, melainkan pelaksana pembalasan darah dalam lembaga hukum ini. Karena itu, “penuntut darah” kurang tepat. Penambahan “orang” setelah “mengirim” dapat diterima dalam bahasa Indonesia untuk melengkapi objek yang tersirat, tanpa menetapkan identitas utusan.
  naturalness: Struktur kalimatnya pada dasarnya jelas dan sesuai register hukum. “Mengambilnya” lebih alami daripada “mengambil dia”, dan “pembalas darah” merupakan istilah yang lebih jelas serta lazim untuk konteks ini.
  terminology: “Para tua-tua kotanya” memadai untuk זִקְנֵי עִירוֹ. “Pembalas darah” dengan catatan kaki mempertahankan status teknis גֹּאֵל הַדָּם dan menghindari nuansa modern-yudisial yang terlalu sempit dari “penuntut darah”.
