source:
  edition: WLC
  text: פֶּן יִרְדֹּף֩ גֹּאֵ֨ל הַ/דָּ֜ם אַחֲרֵ֣י הָ/רֹצֵ֗חַ כִּי יֵחַם֮ לְבָב/וֹ֒ וְ/הִשִּׂיג֛/וֹ כִּֽי יִרְבֶּ֥ה הַ/דֶּ֖רֶךְ וְ/הִכָּ֣ה/וּ נָ֑פֶשׁ וְ/ל/וֹ֙ אֵ֣ין מִשְׁפַּט מָ֔וֶת כִּ֠י לֹ֣א שֹׂנֵ֥א ה֛וּא ל֖/וֹ מִ/תְּמ֥וֹל שִׁלְשֽׁוֹם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/006.yaml
  text: otherwise the avenger of blood may pursue the manslayer[a], because his heart is hot, and overtake him because the way is long, and strike him dead, though he did not deserve the death penalty[b], since he had not hated him previously.
translation:
  language: id
  text: Jangan sampai penuntut darah mengejar orang yang membunuh itu karena hatinya menjadi panas[a], lalu menyusulnya karena jalan yang harus ditempuh panjang dan memukulnya sampai mati, padahal orang itu tidak patut dijatuhi hukuman mati, sebab sebelumnya[b] ia tidak membenci orang yang dibunuhnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “hatinya menjadi panas,” suatu ungkapan Ibrani untuk amarah yang berkobar.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari kemarin dan sebelumnya,” suatu ungkapan Ibrani yang berarti “sebelumnya” atau “dahulu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: Jangan sampai
  rationale: Mengungkapkan tujuan pencegahan dan daya peringatan partikel Ibrani secara alami dalam bahasa Indonesia.
- source_word: גֹּאֵל הַדָּם
  choice: penuntut darah
  rationale: Mempertahankan istilah peran hukum-kekerabatan dalam Taurat, yaitu kerabat yang menuntut kematian sebagai pembalasan darah.
- source_word: הָרֹצֵחַ
  choice: orang yang membunuh itu
  rationale: Istilah ini dibuat netral karena konteks menyatakan bahwa pembunuhan tersebut terjadi tanpa kebencian sebelumnya; kata 'pembunuh' saja dapat menyiratkan pembunuhan sengaja.
- source_word: כִּי יֵחַם לְבָבוֹ
  choice: ketika hatinya menjadi panas
  rationale: Mempertahankan gambaran konkret idiom Ibrani tentang hati yang memanas karena amarah, tanpa mereduksinya menjadi istilah abstrak.
- source_word: וְהִשִּׂיגוֹ
  choice: lalu menyusulnya
  rationale: Secara alami menggambarkan keberhasilan mengejar dan mencapai orang yang melarikan diri.
- source_word: כִּי יִרְבֶּה הַדֶּרֶךְ
  choice: karena jalan yang harus ditempuh panjang
  rationale: Mempertahankan citra jalan serta menjelaskan bahwa jauhnya perjalanan memungkinkan pengejar menyusul.
- source_word: וְהִכָּהוּ נָפֶשׁ
  choice: dan memukulnya sampai mati
  rationale: Menyampaikan idiom tindakan memukul yang berakibat hilangnya nyawa, sambil mempertahankan kekonkretan tindak kekerasan.
- source_word: וְלוֹ אֵין מִשְׁפַּט מָוֶת
  choice: padahal orang itu tidak patut dijatuhi hukuman mati
  rationale: Mengungkapkan makna yuridis bahwa orang tersebut tidak memiliki dasar putusan atau tanggungan hukuman mati, dalam bahasa Indonesia yang alami.
- source_word: כִּי לֹא שֹׂנֵא הוּא לוֹ
  choice: sebab ... ia tidak membenci orang yang dibunuhnya
  rationale: 'Menjaga alasan hukum yang dinyatakan teks: tidak adanya kebencian terhadap korban.'
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: sebelumnya
  rationale: Menyampaikan idiom waktu Ibrani secara jelas; ungkapan harfiahnya menunjuk pada waktu yang telah lalu.
theological_decisions:
- issue: Status moral dan hukum orang yang membunuh
  choice: Tidak menyebutnya sebagai pembunuh dengan arti pelaku pembunuhan sengaja, dan menyatakan bahwa ia tidak patut dijatuhi hukuman mati.
  alternative: Menerjemahkan הָרֹצֵחַ sebagai 'pembunuh' atau 'pembunuh manusia'.
  rationale: Ayat ini sendiri menghubungkan ketiadaan hukuman mati dengan tidak adanya kebencian sebelumnya. Terjemahan tidak boleh terlebih dahulu menetapkan kesengajaan yang disangkal oleh konteks hukum.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam hukum yang tetap mudah dipahami. Struktur kalimat mengikuti rangkaian sebab-akibat teks Ibrani, sementara istilah netral 'orang yang membunuh' menghindari kesan pembunuhan sengaja. Pronomina diperjelas pada akhir ayat agar pelaku dan korban tidak tertukar.
