  text: לֹֽא יָקוּם֩ עֵ֨ד אֶחָ֜ד בְּ/אִ֗ישׁ לְ/כָל עָוֺן֙ וּ/לְ/כָל חַטָּ֔את בְּ/כָל חֵ֖טְא אֲשֶׁ֣ר יֶֽחֱטָ֑א עַל פִּ֣י שְׁנֵ֣י עֵדִ֗ים א֛וֹ עַל פִּ֥י שְׁלֹשָֽׁה עֵדִ֖ים יָק֥וּם דָּבָֽר־־־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/015.yaml
  text: A single witness shall not stand against a man for any iniquity or for any sin[a], in connection with any sin that he commits[c][b]; on the testimony of two witnesses or on the testimony of three witnesses a matter shall stand.
translation:
  language: id
  text: Seorang saksi saja tidak dapat tampil sebagai saksi terhadap seseorang atas kesalahan apa pun atau dosa apa pun, dalam hal dosa apa pun yang dilakukannya. Atas keterangan dua orang saksi atau tiga orang saksi[a], suatu perkara akan dikukuhkan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “atas mulut dua orang saksi atau atas mulut tiga orang saksi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “suatu perkara akan dinyatakan sah.” Kata Ibrani yang diterjemahkan “dikukuhkan” juga digunakan pada awal ayat tentang seorang saksi, sehingga membentuk kesejajaran hukum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יָקוּם ... יָקוּם
  choice: tidak dapat menjadi dasar yang sah ... harus ditegakkan
  rationale: Dalam konteks hukum, קום menyatakan bahwa kesaksian atau perkara berdiri sebagai sah atau terbukti. Bahasa Indonesia memerlukan ungkapan yang berbeda pada kedua klausa agar subjeknya jelas, tetapi gagasan hukum yang sama tetap dipertahankan.
- source_word: עֵד אֶחָד
  choice: satu orang saksi saja
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan menegaskan bahwa kesaksian tunggal tidak memadai.
- source_word: בְּאִישׁ
  choice: untuk melawan seseorang
  rationale: Preposisi ב dalam konteks hukum menunjukkan kesaksian yang diajukan terhadap orang tertentu. 'Seseorang' menyampaikan fungsi representatif אִישׁ secara wajar dalam bahasa Indonesia.
- source_word: לְכָל עָוֺן וּלְכָל חַטָּאת
  choice: dalam perkara kesalahan apa pun atau dosa apa pun
  rationale: '''Kesalahan'' mempertahankan nuansa moral-hukum עָוֺן, sedangkan ''dosa'' mempertahankan חַטָּאת sebagai istilah yang berdekatan tetapi tidak sepenuhnya dilebur.'
- source_word: בְּכָל חֵטְא אֲשֶׁר יֶחֱטָא
  choice: sehubungan dengan dosa apa pun yang dilakukannya
  rationale: Terjemahan ini menjaga cakupan menyeluruh dan pengulangan akar חטא tanpa menghasilkan ungkapan Indonesia yang janggal seperti 'dosa yang didosakannya'.
- source_word: עַל פִּי
  choice: berdasarkan kesaksian
  rationale: Secara harfiah berarti 'atas mulut', tetapi dalam konteks peradilan idiom ini menunjuk pada dasar kesaksian.
- source_word: שְׁנֵי עֵדִים ... שְׁלֹשָׁה עֵדִים
  choice: dua orang saksi atau tiga orang saksi
  rationale: Jumlah dan kesejajaran persyaratan hukum dipertahankan secara langsung.
- source_word: דָּבָר
  choice: suatu perkara
  rationale: Dalam konteks peradilan, דָּבָר menunjuk pada perkara yang diperiksa; 'perkara' cukup luas dan tetap bernuansa hukum.
theological_decisions:
- issue: Bahasa maskulin representatif dalam אִישׁ
  choice: seseorang
  alternative: seorang laki-laki
  rationale: Dalam bahasa Indonesia, 'seseorang' secara alami merujuk kepada satu individu tanpa meniadakan bentuk tunggal sumber. Hukum ini bersifat umum, dan אִישׁ di sini berfungsi representatif, bukan membatasi penerapannya hanya kepada laki-laki.
- issue: Hubungan antara kesaksian dan penegakan perkara
  choice: Kesaksian tunggal tidak menjadi dasar yang sah; perkara ditegakkan berdasarkan dua atau tiga saksi
  alternative: Saksi tunggal 'tidak berdiri', sedangkan perkara 'berdiri'
  rationale: Pilihan utama menyampaikan daya hukum verba קום dalam konteks pengadilan, sambil mempertahankan ketegangan antara ketidakabsahan satu saksi dan keabsahan perkara melalui saksi jamak.
translation_notes:
  register: Bahasa hukum yang modern, lugas, dan bermartabat. Frasa 'menjadi dasar yang sah' memperjelas fungsi kesaksian dalam proses hukum, sedangkan 'perkara harus ditegakkan' mempertahankan citra dasar verba Ibrani tanpa terdengar terlalu harfiah.
