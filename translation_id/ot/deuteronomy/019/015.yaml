  verdict: revise
  source_fidelity: 'Draf secara umum menyampaikan prinsip hukum Ibrani: seorang saksi tidak memadai, sedangkan suatu perkara dikukuhkan oleh dua atau tiga saksi. Namun, “satu orang saksi” kurang alami, dan “perkara harus ditegakkan” dapat terbaca sebagai perkara itu harus dijalankan atau diproses, bukan diteguhkan/dibuktikan. Revisi memakai istilah yang lebih jelas bagi pengesahan perkara, sambil mempertahankan cakupan berulang atas kesalahan dan dosa.'
  naturalness: “Seorang saksi saja” lebih wajar dalam bahasa Indonesia modern. “Tampil sebagai saksi terhadap seseorang” merupakan ungkapan hukum yang jelas. “Suatu perkara akan dikukuhkan” menyampaikan pengertian legal dari קום tanpa konotasi penegakan hukum yang tidak dimaksudkan.
  terminology: “Kesalahan” untuk עָוֺן dan “dosa” untuk חַטָּאת/חֵטְא mempertahankan pembedaan leksikal secara memadai. “Keterangan” untuk עַל־פִּי dalam konteks pengadilan alami dan tepat; catatan kaki mempertahankan idiom harfiahnya.
  issues:
  - severity: medium
    issue: Ungkapan “satu orang saksi” kurang idiomatis.
    rationale: Bahasa Indonesia modern lazim memakai “seorang saksi” atau “satu saksi”; bentuk dalam draf terdengar kaku.
  - severity: medium
    issue: “Suatu perkara harus ditegakkan” berpotensi bermakna perkara itu harus dilaksanakan atau diproses.
    rationale: דָּבָר יָקוּם dalam konteks ini berarti perkara dinyatakan kukuh/terbukti, bukan penegakan perkara dalam arti tindakan hukum.
  - severity: low
    issue: Catatan kaki b mengaitkan kata “berdiri” dengan terjemahan utama yang tidak lagi muncul secara eksplisit pada klausa pertama.
    rationale: Catatan perlu menjelaskan pengulangan verba Ibrani tanpa menyatakan bahwa padanan Indonesia yang sama dipakai pada kedua klausa.
