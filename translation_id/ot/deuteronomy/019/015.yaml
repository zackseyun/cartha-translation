revisions:
- from: Satu orang saksi saja tidak dapat menjadi dasar yang sah untuk melawan seseorang dalam perkara kesalahan apa pun atau dosa apa pun, sehubungan dengan dosa apa pun yang dilakukannya. Berdasarkan kesaksian dua orang saksi atau tiga orang saksi[a], suatu perkara harus ditegakkan.[b]
  to: Seorang saksi saja tidak dapat tampil sebagai saksi terhadap seseorang atas kesalahan apa pun atau dosa apa pun, dalam hal dosa apa pun yang dilakukannya. Atas keterangan dua orang saksi atau tiga orang saksi[a], suatu perkara akan dikukuhkan.[b]
  rationale: Revisi memperbaiki idiom Indonesia dan menghilangkan ambiguitas “ditegakkan,” sambil mempertahankan struktur serta pengulangan cakupan hukum dalam teks Ibrani. Bentuk “seseorang” wajar untuk penggunaan representatif אִישׁ dalam bahasa Indonesia dan tidak mempersempit cakupan hukum kepada laki-laki.
  reviewer_model: gpt-5.6-terra
