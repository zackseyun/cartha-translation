base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/021.yaml
  text: 'Your eye shall not pity: life for life[a], eye for eye, tooth for tooth, hand for hand[b], foot for foot.'
translation:
  language: id
  text: 'Janganlah matamu merasa iba[a]: nyawa ganti nyawa[b], mata ganti mata, gigi ganti gigi, tangan ganti tangan, kaki ganti kaki.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “berbelas kasihan” atau “menyisakan.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani נֶפֶשׁ di sini berarti hidup atau nyawa, bukan secara khusus “jiwa” dalam pengertian teologis yang muncul kemudian.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָחוֹס
  choice: merasa iba
  rationale: Kata חוס dapat berarti merasa iba, menaruh belas kasihan, atau membiarkan luput. Dalam ungkapan hukum ini, “merasa iba” alami dalam bahasa Indonesia dan mempertahankan kerasnya perintah tanpa menambahkan penafsiran.
- source_word: עֵינֶךָ
  choice: matamu
  rationale: Bahasa Ibrani menjadikan “matamu” sebagai subjek dalam idiom tentang belas kasihan. Bentuk konkret ini dipertahankan agar citra sumber tidak hilang.
- source_word: נֶפֶשׁ
  choice: nyawa
  rationale: Dalam rumusan נֶפֶשׁ בְּנֶפֶשׁ, נֶפֶשׁ menunjuk pada hidup atau nyawa, bukan secara khusus “jiwa” dalam pengertian metafisis yang lebih kemudian.
- source_word: בְּ
  choice: ganti
  rationale: Dalam setiap pasangan, בְּ menandai kesetaraan atau pembalasan yang sepadan. “Ganti” menghasilkan rumusan hukum yang ringkas dan lazim dalam bahasa Indonesia.
- source_word: עַיִן
  choice: mata
  rationale: Istilah anggota tubuh yang harfiah dalam rumusan hukum ini.
- source_word: שֵׁן
  choice: gigi
  rationale: Istilah anggota tubuh yang harfiah dan tepat.
- source_word: יָד
  choice: tangan
  rationale: Padanan langsung yang sesuai dengan rumusan konkret bahasa Ibrani.
- source_word: רֶגֶל
  choice: kaki
  rationale: Padanan yang lazim dan sesuai untuk anggota tubuh dalam rangkaian ini.
theological_decisions:
- issue: Apakah rumusan pembalasan hukum yang konkret dipertahankan atau dilunakkan menjadi asas umum tentang hukuman yang sepadan
  choice: 'Mempertahankan rumusan konkret: “nyawa ganti nyawa, mata ganti mata, gigi ganti gigi, tangan ganti tangan, kaki ganti kaki.”'
  alternative: Memparafrasakannya sebagai “hukuman harus setimpal dengan pelanggaran.”
  rationale: Teks Ibrani menyajikan rumusan yudisial tetap dengan anggota tubuh tertentu. Mempertahankannya menjaga ketegangan hukum dan kaitannya dengan bagian Taurat lain tanpa mengubahnya menjadi penjelasan abstrak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan “matamu jangan merasa iba” sengaja mempertahankan idiom konkret bahasa Ibrani, sedangkan rangkaian “X ganti X” menjaga irama padat rumusan hukum.
