id: DEU.19.9
reference: Deuteronomy 19:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי תִשְׁמֹר֩ אֶת כָּל הַ/מִּצְוָ֨ה הַ/זֹּ֜את לַ/עֲשֹׂתָ֗/הּ אֲשֶׁ֨ר אָנֹכִ֣י מְצַוְּ/ךָ֮ הַ/יּוֹם֒ לְ/אַהֲבָ֞ה אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ וְ/לָ/לֶ֥כֶת בִּ/דְרָכָ֖י/ו כָּל הַ/יָּמִ֑ים וְ/יָסַפְתָּ֨ לְ/ךָ֥ עוֹד֙ שָׁלֹ֣שׁ עָרִ֔ים עַ֖ל הַ/שָּׁלֹ֥שׁ הָ/אֵֽלֶּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/009.yaml
  text: if you keep all this commandment by doing it[a], which I am commanding you today—to love Yahweh your God and to walk in his ways all your days—then you shall add for yourself three more cities besides these three,
translation:
  language: id
  text: Jika kamu menaati seluruh perintah ini dengan melakukannya[a], yang kuperintahkan kepadamu hari ini—yakni mengasihi Yahweh, Allahmu, dan berjalan di jalan-jalan-Nya sepanjang hidupmu—maka kamu akan menambahkan tiga kota lagi bagimu, selain ketiga kota ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “seluruh perintah ini” (bentuk tunggal).'
    reason: Bentuk tunggal Ibrani dapat terasa tidak biasa karena ungkapan ini mencakup keseluruhan tuntutan yang sedang disampaikan; teks utama mempertahankan bentuk tunggal tersebut.
lexical_decisions:
- source_word: כִּי תִשְׁמֹר
  choice: Jika kamu menaati
  rationale: כִּי membuka syarat, sedangkan שׁמר dalam konteks perjanjian berarti menaati atau memelihara perintah. 'Menaati' alami dalam bahasa Indonesia dan tidak menambahkan keterangan yang tidak tersurat.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: seluruh perintah ini
  rationale: Bentuk tunggal מִצְוָה dipertahankan dengan 'perintah', sementara כָּל menyatakan keseluruhan cakupannya.
- source_word: לַעֲשֹׂתָהּ
  choice: dengan melakukannya
  rationale: Infinitif ini menegaskan pelaksanaan nyata sebagai wujud menaati perintah; sufiks feminin tunggal merujuk kembali kepada 'perintah ini'.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: yang kusampaikan kepadamu hari ini
  rationale: מְצַוְּךָ adalah tindakan Musa memberi perintah dalam pidatonya saat itu. 'Kusampaikan' menghindari susunan Indonesia yang kaku, meskipun nuansa memerintah tetap ditopang oleh objek 'perintah ini'.
- source_word: לְאַהֲבָה אֶת יְהוָה אֱלֹהֶיךָ
  choice: dengan mengasihi Yahweh, Allahmu
  rationale: Infinitif menjabarkan isi atau cara menaati perintah. Nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh'.
- source_word: וְלָלֶכֶת בִּדְרָכָיו
  choice: dan hidup menurut jalan-jalan-Nya
  rationale: Metafora Ibrani 'berjalan dalam jalan-jalan-Nya' menyatakan pola hidup. Bentuk ini mempertahankan citra 'jalan-jalan' sambil terdengar alami dalam bahasa Indonesia.
- source_word: כָּל הַיָּמִים
  choice: sepanjang umurmu
  rationale: Secara idiomatis menyatakan ketaatan seumur hidup dalam sapaan orang kedua tunggal.
- source_word: וְיָסַפְתָּ לְךָ עוֹד שָׁלֹשׁ עָרִים
  choice: maka kamu harus menambahkan tiga kota lagi bagi dirimu
  rationale: Bentuk berurutan menyatakan akibat dari syarat sebelumnya. לְךָ dipertahankan dengan 'bagi dirimu', dan עוֹד menunjukkan tambahan.
- source_word: עַל הַשָּׁלֹשׁ הָאֵלֶּה
  choice: di samping ketiga kota ini
  rationale: עַל di sini bersifat aditif, yakni tiga kota tambahan selain tiga kota yang telah disebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi, bukan gelar. 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan sebuah gelar.
- issue: Hubungan antara menaati, mengasihi, dan hidup menurut jalan Allah
  choice: Frasa mengasihi dan hidup menurut jalan-jalan-Nya dipertahankan sebagai penjabaran dari ketaatan
  alternative: Menjadikannya syarat-syarat yang sepenuhnya terpisah
  rationale: Rangkaian infinitif Ibrani paling wajar menjabarkan isi atau pelaksanaan 'seluruh perintah ini', tetapi tanda pisah mempertahankan keluasan hubungan sintaksisnya tanpa penjelasan teologis tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan orang kedua tunggal sesuai teks Ibrani. Nada dibuat resmi dan mudah dipahami. Kapitalisasi pronomina pada '-Nya' mengikuti kebiasaan penerbitan Alkitab Indonesia, tanpa mengubah makna sumber.
