- from: Jika kamu menaati seluruh perintah ini dengan melakukannya[a], yang kusampaikan kepadamu hari ini—dengan mengasihi Yahweh, Allahmu, dan hidup menurut jalan-jalan-Nya sepanjang umurmu—maka kamu harus menambahkan tiga kota lagi bagi dirimu di samping ketiga kota ini.
  to: Jika kamu menaati seluruh perintah ini dengan melakukannya[a], yang kuperintahkan kepadamu hari ini—yakni mengasihi Yahweh, Allahmu, dan berjalan di jalan-jalan-Nya sepanjang hidupmu—maka kamu akan menambahkan tiga kota lagi bagimu, selain ketiga kota ini.
