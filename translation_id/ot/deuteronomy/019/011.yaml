  text: וְ/כִֽי יִהְיֶ֥ה אִישׁ֙ שֹׂנֵ֣א לְ/רֵעֵ֔/הוּ וְ/אָ֤רַב ל/וֹ֙ וְ/קָ֣ם עָלָ֔י/ו וְ/הִכָּ֥ה/וּ נֶ֖פֶשׁ וָ/מֵ֑ת וְ/נָ֕ס אֶל אַחַ֖ת הֶ/עָרִ֥ים הָ/אֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/011.yaml
  text: But if there is a man who hates his neighbor[a], and lies in wait for him, and rises up against him, and strikes him so that he dies, and he flees to one of these cities,
translation:
  language: id
  text: Namun, jika seorang laki-laki membenci sesamanya, lalu menunggu untuk menyergapnya, menyerangnya, dan memukulnya hingga tewas[a], kemudian melarikan diri ke salah satu kota ini,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, ungkapan Ibrani ini berbunyi kira-kira, “memukulnya [berkenaan dengan] nyawa, lalu ia mati.” Ini adalah ungkapan untuk pukulan yang merenggut nyawa; dapat juga diterjemahkan, “memukulnya dengan pukulan mematikan sehingga ia mati.”
    reason: Menjelaskan idiom נֶפֶשׁ secara hati-hati tanpa menjadikan gloss harfiah Indonesia sebagai pembacaan sintaksis yang kaku, sambil mempertahankan rangkaian pukulan dan kematian dalam teks utama.
lexical_decisions:
- source_word: וְכִי
  choice: Namun, jika
  rationale: Kata penghubung ini memperkenalkan kasus bersyarat yang berlawanan dengan pembunuhan tidak disengaja dalam konteks sebelumnya. “Namun, jika” menyampaikan peralihan sekaligus syarat secara alami.
- source_word: יִהְיֶה אִישׁ
  choice: seorang laki-laki
  rationale: אִישׁ secara leksikal menunjuk kepada laki-laki dalam contoh hukum ini. Susunan eksistensial Ibrani disesuaikan menjadi bentuk Indonesia yang wajar.
- source_word: שֹׂנֵא לְרֵעֵהוּ
  choice: membenci sesamanya
  rationale: שֹׂנֵא berarti “membenci”, sedangkan רֵעַ dalam konteks hukum berarti sesama atau orang lain dalam komunitas, bukan selalu sahabat dekat.
- source_word: וְאָרַב לוֹ
  choice: lalu mengadang dia
  rationale: Kata kerja אָרַב menggambarkan tindakan menanti atau menghadang untuk menyergap, yang menunjukkan perencanaan. “Mengadang” ringkas dan jelas dalam bahasa Indonesia modern.
- source_word: וְקָם עָלָיו
  choice: menyerangnya
  rationale: Ungkapan harfiah “bangkit melawan dia” merupakan idiom tindakan bermusuhan. “Menyerangnya” menyampaikan makna idiomatis tanpa ungkapan Indonesia yang kaku.
- source_word: וְהִכָּהוּ נֶפֶשׁ וָמֵת
  choice: dan memukulnya hingga tewas
  rationale: Ungkapan dengan נֶפֶשׁ menunjukkan pukulan yang merenggut nyawa, lalu teks menyatakan bahwa korban mati. “Memukulnya hingga tewas” menyampaikan hasil fatal secara alami tanpa mengganti rangkaian tindakan itu dengan kata interpretatif seperti “membunuh” atau “membunuh dengan sengaja”.
- source_word: וְנָס אֶל אַחַת הֶעָרִים הָאֵל
  choice: kemudian melarikan diri ke salah satu kota ini
  rationale: נוּס berarti melarikan diri, dan penunjuk הָאֵל merujuk kepada kota-kota perlindungan yang baru disebut dalam konteks.
theological_decisions:
- issue: Pembedaan antara pembunuhan disengaja dan pembunuhan tidak disengaja
  choice: Mempertahankan rangkaian kebencian, pengadangan, penyerangan, pukulan fatal, dan pelarian.
  alternative: Meringkas seluruh rangkaian sebagai “membunuhnya dengan sengaja”.
  rationale: Konteks jelas menggambarkan pembunuhan yang direncanakan, tetapi teks Ibrani menyatakannya melalui rangkaian tindakan konkret. Mempertahankan rangkaian itu menjaga bentuk dan tekanan hukum teks tanpa menambahkan label teologis atau yuridis yang tidak dinyatakan langsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Sesamanya” dipilih daripada “temannya” agar tidak menyiratkan hubungan akrab. “Mengadang” dan “menyerangnya” menyampaikan idiom Ibrani dengan jelas bagi pembaca umum. Ayat dibiarkan berakhir dengan koma karena kalimat hukum berlanjut ke ayat berikutnya.
