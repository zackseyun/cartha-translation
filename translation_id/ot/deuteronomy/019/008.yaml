base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/008.yaml
  text: And if Yahweh your God enlarges your territory[a], as he swore to your fathers, and gives you all the land that he promised to give to your fathers,
translation:
  language: id
  text: Dan jika Yahweh, Allahmu, memperluas wilayahmu, sebagaimana Dia telah bersumpah kepada para bapa leluhurmu,[a] dan mengaruniakan kepadamu seluruh negeri yang Dia janjikan untuk diberikan kepada para bapa leluhurmu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “nenek moyangmu,” juga pada kemunculan kedua. Secara harfiah, bahasa Ibrani berbunyi “bapa-bapamu” dan menunjuk kepada para leluhur patriarkal Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Dan jika
  rationale: Gabungan konjungsi dan partikel syarat melanjutkan ketentuan hukum dari ayat sebelumnya; “Dan jika” mempertahankan kaitan itu.
- source_word: יַרְחִיב
  choice: memperluas
  rationale: Bentuk hifil dari רחב berarti membuat luas; dalam konteks batas wilayah, “memperluas” merupakan padanan Indonesia yang alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk konstruk dengan sufiks orang kedua tunggal diterjemahkan secara langsung dan alami.
- source_word: גְּבֻלְךָ
  choice: wilayahmu
  rationale: גְּבוּל dapat berarti batas atau wilayah; bersama verba “memperluas”, yang dimaksud adalah kawasan kekuasaan yang bertambah luas.
- source_word: כַּאֲשֶׁר נִשְׁבַּע
  choice: sebagaimana telah disumpahkan-Nya
  rationale: Ungkapan ini mempertahankan unsur sumpah ilahi dan mengingatkan pada komitmen-Nya kepada para leluhur.
- source_word: לַאֲבֹתֶיךָ
  choice: kepada bapa-bapa leluhurmu
  rationale: Pilihan ini mempertahankan unsur maskulin dari אָבוֹת sekaligus menjelaskan bahwa yang dimaksud ialah para leluhur patriarkal Israel.
- source_word: וְנָתַן לְךָ
  choice: dan memberikan kepadamu
  rationale: Bentuk perfektum berwaw berada dalam rangkaian syarat yang berorientasi ke masa depan; bentuk Indonesia ini mengalir wajar setelah “jika”.
- source_word: כָּל הָאָרֶץ
  choice: seluruh negeri
  rationale: אָרֶץ di sini menunjuk pada negeri yang dijanjikan kepada Israel, bukan bumi secara global.
- source_word: אֲשֶׁר דִּבֶּר לָתֵת
  choice: yang telah dijanjikan-Nya untuk diberikan
  rationale: Walaupun דִּבֶּר secara harfiah berarti “berkata/berbicara”, dalam konteks pemberian negeri ungkapan ini menyatakan janji ilahi.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi; transliterasi “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Makna אבות sebagai leluhur laki-laki atau leluhur secara umum
  choice: bapa-bapa leluhurmu
  alternative: nenek moyangmu
  rationale: Bentuk Ibrani secara harfiah berarti “bapa-bapamu” dan dalam konteks ini menunjuk kepada para bapa leluhur Israel. Alternatif yang lebih idiomatis dicatat tanpa menghapus rincian bentuk sumber dari teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat mempertahankan sifat ayat ini sebagai bagian awal dari kalimat bersyarat yang berlanjut ke ayat berikutnya; karena itu teks diakhiri dengan koma.
