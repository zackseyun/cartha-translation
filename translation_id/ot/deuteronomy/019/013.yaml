  yaml_path: translation/ot/deuteronomy/019/013.yaml
  text: Your eye shall not pity him[a], but you shall purge the innocent blood from Israel[b], and it shall go well with you.
translation:
  language: id
  text: Janganlah engkau merasa iba kepadanya,[a] tetapi singkirkanlah dari Israel kesalahan darah karena darah orang yang tidak bersalah telah ditumpahkan,[b] dan engkau akan hidup sejahtera.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “matamu jangan merasa iba kepadanya.” Dalam idiom Ibrani, mata dapat melambangkan rasa iba atau belas kasihan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “darah orang yang tidak bersalah.” Maksudnya ialah kesalahan darah yang ditimbulkan oleh penumpahan darah orang yang tidak bersalah dan yang harus disingkirkan dari komunitas Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תָחוֹס עֵינְךָ עָלָיו
  choice: Janganlah matamu merasa iba kepadanya
  rationale: Mempertahankan gambaran idiomatis Ibrani tentang mata sebagai tempat belas kasihan, sambil memakai ungkapan Indonesia yang jelas dan wajar. Dalam konteks hukum, larangan ini ditujukan kepada belas kasihan yang menghalangi pelaksanaan putusan yang adil.
- source_word: וּבִעַרְתָּ
  choice: tetapi hapuslah
  rationale: Dalam hukum Ulangan, verba בער menyatakan penyingkiran dari tengah komunitas, bukan pembakaran harfiah. 'Hapuslah' mempertahankan daya perintah dan cocok dengan objek berupa darah atau kesalahan darah.
- source_word: דַם הַנָּקִי
  choice: darah orang yang tidak bersalah
  rationale: Ungkapan ini secara harfiah menunjuk kepada 'darah yang tidak bersalah', yakni darah orang tak bersalah yang telah ditumpahkan. Bentuk ini alami dalam bahasa Indonesia dan tidak mengaburkan citra darah pada teks sumber.
- source_word: מִיִּשְׂרָאֵל
  choice: dari Israel
  rationale: Preposisi מן menyatakan penyingkiran dari komunitas Israel; terjemahan langsung ini mempertahankan cakupan komunalnya.
- source_word: וְטוֹב לָךְ
  choice: supaya keadaanmu baik
  rationale: Formula khas Ulangan ini menyatakan hasil baik yang mengikuti ketaatan. 'Supaya' menangkap nuansa akibat atau tujuan yang mungkin tersirat oleh rangkaian perintah, sedangkan bentuk orang kedua tunggal dipertahankan melalui '-mu'.
- source_word: וְ
  choice: tetapi
  rationale: 'Walaupun ו secara dasar berarti ''dan'', hubungan antarklausa bersifat kontras: jangan membiarkan rasa iba menghalangi, melainkan laksanakan tindakan hukum yang diperintahkan.'
theological_decisions:
- issue: Sifat perintah terhadap pembunuh yang disengaja
  choice: Ayat ini memerintahkan Israel untuk tidak membiarkan rasa iba menggagalkan tindakan hukum yang adil dan untuk menyingkirkan kesalahan darah dari komunitas.
  alternative: Ayat ini dapat disalahartikan sebagai pembenaran bagi pembalasan pribadi.
  rationale: Konteks Ulangan 19:11–12 adalah proses hukum terhadap seorang pembunuh yang bertindak dengan sengaja, bukan tindakan main hakim sendiri. Terjemahan tidak menambahkan pelaku institusional ke dalam teks, tetapi catatan menjelaskan makna komunal-hukumnya.
- issue: Makna 'darah orang yang tidak bersalah' sebagai objek yang dihapus
  choice: Ungkapan dipertahankan dalam teks utama sebagai citra darah, dengan penjelasan bahwa yang disingkirkan ialah kesalahan darah akibat penumpahan darah orang tak bersalah.
  alternative: Menerjemahkannya langsung sebagai 'kesalahan karena menumpahkan darah orang tak bersalah'.
  rationale: Bentuk kiasan sumber layak dipertahankan karena penting dalam bahasa hukum-perjanjian, sementara catatan kaki memberi kejelasan tanpa menutup daya ungkap aslinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Citra 'matamu' dan 'darah' dipertahankan untuk menjaga gaya hukum Ibrani, sedangkan susunan kalimat dibuat tetap mudah dipahami oleh pembaca umum.
