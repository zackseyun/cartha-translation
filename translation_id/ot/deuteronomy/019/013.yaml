  naturalness: “Janganlah matamu merasa iba” mempertahankan citra Ibrani, tetapi kurang idiomatis dalam bahasa Indonesia modern. “Janganlah engkau merasa iba kepadanya” lebih alami; citra ‘mata’ dapat dipelihara dengan tepat dalam catatan kaki. “Supaya keadaanmu baik” juga kurang lazim untuk formula Ulangan; “dan engkau akan hidup sejahtera” merupakan ungkapan Indonesia yang wajar bagi hasil baik yang dijanjikan.
  terminology: “Kesalahan darah” merupakan istilah hukum-keagamaan yang tepat untuk implikasi idiom דם הנקי dalam konteks ini. Penjelasan bahwa hal itu berkaitan dengan darah orang tidak bersalah yang telah ditumpahkan menjaga hubungan dengan ungkapan sumber tanpa menyiratkan pembalasan pribadi.
