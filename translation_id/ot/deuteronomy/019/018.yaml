  text: And the judges shall investigate thoroughly, and if the witness is a false witness and has testified falsely against his brother,
translation:
  language: id
  text: Para hakim harus menyelidikinya dengan saksama; jika ternyata saksi itu adalah saksi dusta dan telah memberikan kesaksian palsu terhadap saudaranya,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְדָרְשׁוּ הַשֹּׁפְטִים הֵיטֵב
  choice: Para hakim harus menyelidikinya dengan saksama
  rationale: Kata דָּרַשׁ dalam konteks hukum berarti menyelidiki atau memeriksa, sementara הֵיטֵב menekankan ketelitian; susunan ini wajar dan jelas dalam bahasa Indonesia modern.
- source_word: וְהִנֵּה
  choice: Jika ternyata
  rationale: Dalam konteks hasil penyelidikan, ungkapan ini memperkenalkan fakta yang didapati. 'Jika ternyata' mempertahankan sifat kondisional dalam alur pasal tanpa memakai seruan harfiah yang kaku.
- source_word: עֵד שֶׁקֶר
  choice: saksi dusta
  rationale: Ungkapan ini menunjuk pada saksi yang memberikan kesaksian tidak benar; 'saksi dusta' ringkas, bermartabat, dan lazim dalam ragam Alkitab Indonesia.
- source_word: שֶׁקֶר עָנָה
  choice: telah memberikan kesaksian palsu
  rationale: Dalam konteks pengadilan, ענה berarti bersaksi atau memberikan kesaksian, dan שקר menerangkan bahwa kesaksian itu palsu.
- source_word: בְאָחִיו
  choice: terhadap saudaranya
  rationale: Preposisi בְּ di sini menyatakan sasaran kesaksian. 'Saudaranya' mempertahankan istilah kekerabatan perjanjian yang dapat menunjuk sesama anggota umat.
theological_decisions:
- issue: Makna 'saudara' dalam ketentuan hukum Israel
  choice: saudaranya
  alternative: sesamanya
  rationale: Terjemahan harfiah mempertahankan bahasa relasional teks dan tidak mempersempit atau memperluas cakupannya secara interpretatif.
- issue: Hubungan וְהִנֵּה dengan hasil penyelidikan
  choice: Jika ternyata
  alternative: dan lihatlah, ternyata
  rationale: Konteks ayat 17–18 bersifat prosedural dan kondisional; pilihan ini menyampaikan temuan penyelidikan tanpa menghilangkan kemungkinan yang sedang diuji.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat dengan nuansa yudisial. Koma penutup dipertahankan karena kalimat berlanjut ke ayat 19.
