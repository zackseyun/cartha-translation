  text: וְ/עָמְד֧וּ שְׁנֵֽי הָ/אֲנָשִׁ֛ים אֲשֶׁר לָ/הֶ֥ם הָ/רִ֖יב לִ/פְנֵ֣י יְהוָ֑ה לִ/פְנֵ֤י הַ/כֹּֽהֲנִים֙ וְ/הַ/שֹּׁ֣פְטִ֔ים אֲשֶׁ֥ר יִהְי֖וּ בַּ/יָּמִ֥ים הָ/הֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/017.yaml
  text: then the two men who have the dispute shall stand before Yahweh[b][a], before the priests and the judges who are in office in those days.
translation:
  language: id
  text: maka kedua laki-laki yang bersengketa itu[a] harus berdiri di hadapan Yahweh, di hadapan para imam dan para hakim yang menjabat pada waktu itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “yang memiliki perselisihan itu”; dapat juga diterjemahkan “yang mempunyai perkara itu” atau “yang di antara mereka ada perselisihan.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “yang ada pada hari-hari itu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָמְדוּ
  choice: maka ... harus berdiri
  rationale: Waw dengan bentuk perfektum melanjutkan urutan prosedur hukum. “Maka” menyatakan kelanjutan itu secara alami, sedangkan “harus berdiri” mempertahankan daya wajib dalam ketentuan hukum.
- source_word: שְׁנֵי הָאֲנָשִׁים
  choice: kedua laki-laki
  rationale: Teks Ibrani secara eksplisit memakai bentuk jamak maskulin dengan bilangan dua. Pilihan ini mempertahankan bentuk sumber tanpa menggantinya dengan istilah hukum yang lebih interpretatif seperti “kedua pihak”.
- source_word: אֲשֶׁר לָהֶם הָרִיב
  choice: yang bersengketa itu
  rationale: רִיב dapat menunjuk pada perselisihan, sengketa, atau perkara hukum. “Bersengketa” alami dalam bahasa Indonesia dan tetap mencerminkan konteks yudisial, sementara alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: “Di hadapan” mempertahankan gambaran menghadap dalam kehadiran ilahi sekaligus nuansa pengadilan. Nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”.
- source_word: לִפְנֵי הַכֹּהֲנִים וְהַשֹּׁפְטִים
  choice: di hadapan para imam dan para hakim
  rationale: Pengulangan “di hadapan” dipertahankan untuk mengikuti susunan sumber dan menegaskan bahwa para pejabat tersebut menjadi pihak berwenang yang dihadapi.
- source_word: אֲשֶׁר יִהְיוּ בַּיָּמִים הָהֵם
  choice: yang menjabat pada waktu itu
  rationale: Secara harfiah klausa ini berarti “yang ada pada hari-hari itu,” tetapi dalam konteks kelembagaan maksudnya ialah imam dan hakim yang memegang jabatan ketika perkara diperiksa. “Menjabat pada waktu itu” menyampaikan fungsi tersebut secara ringkas dan wajar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Ayat ini memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Makna berdiri di hadapan Yahweh
  choice: Dipertahankan sebagai “berdiri di hadapan Yahweh” tanpa menjelaskan mekanisme kehadiran-Nya
  alternative: Menguraikannya sebagai berdiri di tempat ibadah atau di hadapan pengadilan Allah
  rationale: Teks menghubungkan kehadiran Yahweh dengan para imam dan hakim, tetapi tidak menjelaskan secara tepat bagaimana kehadiran itu dimediasi. Terjemahan tidak menyelesaikan ketegangan tersebut secara denominatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum yang tetap mudah dipahami. “Bersengketa” dan “menjabat” memberi ketepatan yudisial tanpa menjadi terlalu teknis; pengulangan “di hadapan” mempertahankan tekanan retoris teks Ibrani.
