  source_fidelity: 'Terjemahan secara tepat mengikuti urutan prosedural Ibrani: kedua laki-laki yang terlibat sengketa harus berdiri di hadapan Yahweh, lalu di hadapan imam dan hakim yang sedang memegang peran pada masa itu. “Bersengketa” menyampaikan אֲשֶׁר לָהֶם הָרִיב secara wajar tanpa menghilangkan sifat perkaranya, sedangkan “menjabat pada waktu itu” merupakan penjelasan kontekstual yang sah untuk אֲשֶׁר יִהְיוּ בַּיָּמִים הָהֵם. Pengulangan “di hadapan” mencerminkan pengulangan לִפְנֵי dalam sumber.'
