revisions:
- from: Misalnya, seseorang pergi bersama sesamanya ke hutan untuk menebang kayu. Ketika tangannya mengayunkan kapak untuk menebang pohon, mata kapak itu terlepas dari gagangnya[a] lalu mengenai sesamanya hingga orang itu mati. Orang tersebut boleh melarikan diri ke salah satu kota ini dan tetap hidup.
  to: Jika seseorang pergi bersama sesamanya ke hutan untuk menebang kayu, dan tangannya mengayunkan kapak untuk menebang pohon, mata kapak itu terlepas dari gagangnya[a] lalu mengenai sesamanya hingga orang itu mati, orang yang menebang itu boleh melarikan diri ke salah satu kota ini dan tetap hidup.
  rationale: Revisi memulihkan bentuk kondisional kasus hukum dan memperjelas bahwa pelarian serta kelangsungan hidup berlaku bagi pelaku kecelakaan, bukan korban. Makna leksikal dan catatan tentang “besi” serta “kayu” dipertahankan.
