  text: וַ/אֲשֶׁר֩ יָבֹ֨א אֶת רֵעֵ֥/הוּ בַ/יַּעַר֮ לַ/חְטֹ֣ב עֵצִים֒ וְ/נִדְּחָ֨ה יָד֤/וֹ בַ/גַּרְזֶן֙ לִ/כְרֹ֣ת הָ/עֵ֔ץ וְ/נָשַׁ֤ל הַ/בַּרְזֶל֙ מִן הָ/עֵ֔ץ וּ/מָצָ֥א אֶת רֵעֵ֖/הוּ וָ/מֵ֑ת ה֗וּא יָנ֛וּס אֶל אַחַ֥ת הֶ/עָרִים הָ/אֵ֖לֶּה וָ/חָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/005.yaml
  text: But if a man goes with his neighbor into the forest to cut wood[a], and his hand swings the axe to cut down the tree, and the iron head slips from the handle and strikes his neighbor so that he dies, he may flee to one of these cities and live.
translation:
  language: id
  text: Jika seseorang pergi bersama sesamanya ke hutan untuk menebang kayu, dan tangannya mengayunkan kapak untuk menebang pohon, mata kapak itu terlepas dari gagangnya[a] lalu mengenai sesamanya hingga orang itu mati, orang yang menebang itu boleh melarikan diri ke salah satu kota ini dan tetap hidup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “besi itu terlepas dari kayu.” Dalam konteks ini, “besi” berarti mata kapak dan “kayu” berarti gagangnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: Misalnya, seseorang
  rationale: Klausa relatif ini memperkenalkan contoh kasus dalam hukum sebelumnya. 'Misalnya' menyampaikan fungsi kasuistiknya secara alami tanpa mengubahnya menjadi syarat yang lebih tegas daripada bentuk Ibraninya.
- source_word: רֵעֵהוּ
  choice: sesamanya
  rationale: Dalam konteks hukum, רֵעַ menunjuk kepada orang lain atau rekan dalam masyarakat, bukan khusus sahabat dekat atau tetangga tempat tinggal.
- source_word: בַיַּעַר
  choice: ke hutan
  rationale: יַעַר berarti kawasan berhutan; 'hutan' merupakan padanan Indonesia modern yang langsung dan wajar.
- source_word: לַחְטֹב עֵצִים
  choice: untuk menebang kayu
  rationale: Ungkapan ini menggambarkan kegiatan memotong atau menebang kayu secara umum. Pilihan ini alami dalam bahasa Indonesia dan tetap dekat dengan teks.
- source_word: וְנִדְּחָה יָדוֹ בַגַּרְזֶן
  choice: tangannya mengayunkan kapak
  rationale: Bentuk medio-pasif menggambarkan gerakan tangan saat menggunakan kapak. Ungkapan aktif ini menyampaikan adegan secara idiomatis tanpa menghilangkan sifat tak disengaja dari kecelakaan tersebut.
- source_word: לִכְרֹת הָעֵץ
  choice: untuk menebang pohon
  rationale: Dalam konteks ini כרת berarti memotong hingga pohon roboh; 'menebang' adalah istilah Indonesia yang tepat.
- source_word: וְנָשַׁל הַבַּרְזֶל מִן־הָעֵץ
  choice: mata kapak itu terlepas dari gagangnya
  rationale: Secara harfiah, 'besi itu terlepas dari kayu'. Konteks menunjukkan bahwa 'besi' adalah mata kapak dan 'kayu' adalah gagangnya; makna kontekstual dipakai dalam teks utama dan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וּמָצָא אֶת־רֵעֵהוּ
  choice: lalu mengenai sesamanya
  rationale: מצא secara dasar berarti 'menemukan/mencapai', tetapi dalam konteks benda yang melayang atau terlepas dapat berarti mencapai dan mengenai sasaran.
- source_word: וָמֵת
  choice: hingga orang itu mati
  rationale: Ungkapan ini menjelaskan akibat pukulan sekaligus memperjelas bahwa korbanlah yang mati, tanpa menjadikan hubungan sebab-akibat lebih teknis daripada teks.
- source_word: הוּא יָנוּס ... וָחָי
  choice: Orang tersebut boleh melarikan diri ... dan tetap hidup
  rationale: Dalam ketentuan perlindungan ini bentuk verbal menyatakan jalan yang tersedia bagi pembunuh tak sengaja. 'Boleh' menyampaikan izin/perlindungan hukum, sedangkan 'tetap hidup' mengungkapkan hasil וָחָי secara alami.
theological_decisions:
- issue: 'Status pelarian ke kota perlindungan: perintah, ramalan, atau izin hukum'
  choice: boleh melarikan diri
  alternative: harus/akan melarikan diri
  rationale: Konteks hukum menyediakan perlindungan bagi orang yang membunuh tanpa sengaja. 'Boleh' mempertahankan fungsi permisif-protektif tanpa menyiratkan kewajiban mutlak atau sekadar prediksi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-naratif yang jelas dan bermartabat. Kalimat panjang Ibrani dibagi agar mudah dipahami. 'Sesamanya' dipilih daripada 'tetangganya' karena konteks tidak membatasi hubungan pada orang yang tinggal berdekatan. Penanda catatan kaki [a] ditempatkan tepat setelah ungkapan yang dijelaskannya.
