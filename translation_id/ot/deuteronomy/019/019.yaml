review_pass:
  verdict: revise
  source_fidelity: 'Struktur pembalasan setimpal dalam Ibrani dipertahankan: komunitas harus bertindak terhadap saksi itu sebagaimana ia bermaksud bertindak terhadap saudaranya. Namun, teks draf menghilangkan secara terlalu jauh infinitif לַעֲשׂוֹת (''untuk melakukan''), sehingga ''yang telah direncanakannya terhadap saudaranya'' dapat terdengar hanya sebagai rencana yang berkenaan dengan saudaranya, bukan rencana untuk melakukan sesuatu terhadapnya.'
  naturalness: Bahasa draf pada umumnya modern dan jelas. Penambahan 'untuk dilakukan' membuat hubungan 'merencanakan—melakukan terhadap' eksplisit dan tetap alami. 'Menyingkirkan kejahatan itu dari tengah-tengahmu' sesuai register hukum Ulangan.
  terminology: '''Saudaranya'' secara tepat mempertahankan אָחִיו, dan catatan kaki secara memadai mencatat kemungkinan makna komunitarian ''sesamanya''. ''Menyingkirkan kejahatan itu'' secara idiomatis menyampaikan rumusan בִּעַרְתָּ הָרָע tanpa mengharuskan makna pembakaran harfiah.'
  issues:
  - severity: medium
    issue: Infinitif לַעֲשׂוֹת belum dinyatakan cukup jelas dalam frasa 'yang telah direncanakannya terhadap saudaranya'.
    rationale: Dalam sumber, ia 'bermaksud/merencanakan untuk melakukan' sesuatu terhadap saudaranya. Menambahkan 'untuk dilakukan' menghindari ambiguitas bahwa yang direncanakan mungkin sekadar suatu hal mengenai saudaranya.
  revised_text: Maka kamu harus memperlakukan dia tepat seperti yang telah ia rencanakan untuk dilakukan terhadap saudaranya.[a] Dengan demikian, kamu harus menyingkirkan kejahatan itu dari tengah-tengahmu.
  revised_footnotes:
