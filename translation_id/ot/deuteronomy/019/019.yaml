  yaml_path: translation/ot/deuteronomy/019/019.yaml
  text: Then you shall do to him just as he intended to do to his brother[a]. So you shall purge the evil from your midst.
translation:
  language: id
  text: Maka kamu harus memperlakukan dia tepat seperti yang telah ia rencanakan untuk dilakukan terhadap saudaranya.[a] Dengan demikian, kamu harus menyingkirkan kejahatan itu dari tengah-tengahmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sesamanya”; secara harfiah, “saudaranya”. Dalam konteks hukum ini, istilah Ibrani tersebut menunjuk kepada sesama anggota umat perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: kamu harus memperlakukan
  rationale: Bentuk verba ini menyampaikan perintah hukum kepada umat atau para hakim. Dalam konstruksi dengan לְ, “memperlakukan” lebih alami dalam bahasa Indonesia daripada “melakukan kepada”, tanpa mengubah maknanya.
- source_word: לוֹ
  choice: dia
  rationale: Pronomina ini merujuk kepada saksi dusta dalam konteks sebelumnya dan menjadi objek dari “memperlakukan”.
- source_word: כַּאֲשֶׁר
  choice: tepat seperti
  rationale: Ungkapan ini menandai kesepadanan hukuman dengan tindakan yang direncanakan.
- source_word: זָמַם
  choice: telah direncanakannya
  rationale: Verba זמם berarti merencanakan atau bermaksud, dalam konteks ini dengan maksud mencelakakan. “Direncanakannya” mempertahankan unsur kesengajaan tanpa menambahkan warna emosi yang tidak dinyatakan secara eksplisit.
- source_word: לַעֲשׂוֹת
  choice: terhadap
  rationale: Makna harfiahnya “untuk melakukan”. Bersama verba sebelumnya, maknanya diungkapkan secara idiomatis dalam bahasa Indonesia melalui konstruksi “yang telah direncanakannya terhadap”.
- source_word: לְאָחִיו
  choice: terhadap saudaranya
  rationale: אָח secara harfiah berarti “saudara” dan dalam konteks hukum perjanjian dapat menunjuk kepada sesama anggota umat. Teks utama mempertahankan istilah konkret sumber, sedangkan cakupan komunalnya dijelaskan dalam catatan kaki.
- source_word: וּבִעַרְתָּ
  choice: Dengan demikian, kamu harus menyingkirkan
  rationale: Dalam rumusan hukum Ulangan, בער berarti membuang atau menyingkirkan kejahatan dari komunitas, bukan membakarnya secara harfiah. “Dengan demikian” mengungkapkan hubungan hasil atau tujuan dalam alur kalimat.
- source_word: הָרָע
  choice: kejahatan itu
  rationale: Frasa definit ini menunjuk kepada kejahatan yang sedang dibicarakan dan mempertahankan bobot moral dari rumusan hukum tersebut.
- source_word: מִקִּרְבֶּךָ
  choice: dari tengah-tengahmu
  rationale: Terjemahan ini mempertahankan gambaran komunal tentang kejahatan yang disingkirkan dari dalam umat.
theological_decisions:
- issue: Istilah perjanjian yang bergender אָחִיו dalam konteks hukum
  choice: saudaranya
  alternative: sesamanya; sesama orang Israel
  rationale: Bentuk Ibrani adalah maskulin tunggal dan secara harfiah berarti “saudaranya”, tetapi dalam hukum ini berfungsi untuk sesama anggota komunitas perjanjian. Teks utama mempertahankan bentuk sumber, sementara catatan kaki menjaga cakupan maknanya agar tidak dipersempit menjadi saudara kandung.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Gaya perintah hukum dipertahankan dengan “harus”; ungkapan idiomatis “memperlakukan dia” menghindari terjemahan kaku “melakukan kepadanya”. Penanda catatan kaki [a] ditempatkan langsung sesudah istilah yang dijelaskan.
