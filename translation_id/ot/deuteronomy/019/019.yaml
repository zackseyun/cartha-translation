  to: Maka kamu harus memperlakukan dia tepat seperti yang telah ia rencanakan untuk dilakukan terhadap saudaranya.[a] Dengan demikian, kamu harus menyingkirkan kejahatan itu dari tengah-tengahmu.
  rationale: Revisi terbatas pada penegasan infinitif Ibrani 'untuk melakukan'. Susunan hukum, istilah 'saudaranya', penanda catatan kaki, dan rumusan penghapusan kejahatan dipertahankan.
