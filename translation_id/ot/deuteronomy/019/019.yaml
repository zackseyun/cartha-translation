    reason: lexical_alternative
  revision_rationale: Revisi terbatas pada penegasan infinitif Ibrani 'untuk melakukan'. Susunan hukum, istilah 'saudaranya', penanda catatan kaki, dan rumusan penghapusan kejahatan dipertahankan.
