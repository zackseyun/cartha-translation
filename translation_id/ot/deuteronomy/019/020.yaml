revisions:
- from: Orang-orang yang masih ada akan mendengarnya dan menjadi takut, sehingga mereka tidak akan berbuat lagi hal jahat seperti itu di tengah-tengahmu.[a]
  to: Orang-orang yang tersisa akan mendengar dan menjadi takut, dan mereka tidak akan lagi melakukan hal jahat seperti itu di tengah-tengahmu.[a]
  rationale: Revisi menghilangkan objek tersirat pada 'mendengarnya' dan hubungan kausal eksplisit pada 'sehingga', sehingga susunan terjemahan lebih dekat kepada koordinasi teks Ibrani. 'Orang-orang yang tersisa' menggantikan ungkapan yang kurang idiomatis, sementara perbandingan 'seperti itu', larangan mengulangi, register hukum, serta sapaan tunggal korporat tetap dipertahankan.
