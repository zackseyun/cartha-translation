  source_fidelity: 'Secara umum setia pada teks Ibrani: הַנִּשְׁאָרִים, יִשְׁמְעוּ, וְיִרָאוּ, larangan untuk mengulangi, perbandingan ''seperti hal jahat ini'', dan sapaan tunggal korporat pada בְּקִרְבֶּךָ semuanya terwakili. Namun, akhiran ''-nya'' pada ''mendengarnya'' menambahkan objek yang tidak dinyatakan secara eksplisit oleh יִשְׁמְעוּ. Selain itu, ''sehingga'' mengubah koordinasi Ibrani menjadi hubungan hasil yang lebih eksplisit daripada teks sumber.'
