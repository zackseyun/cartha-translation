base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/020.yaml
  text: And those who remain shall hear and fear[c][b][a], and shall never again do such an evil thing in your midst.
translation:
  language: id
  text: Orang-orang yang tersisa akan mendengar dan menjadi takut, dan mereka tidak akan lagi melakukan hal jahat seperti itu di tengah-tengahmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata ganti “-mu” berbentuk tunggal; Israel disapa sebagai satu kesatuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּשְׁאָרִים
  choice: orang-orang yang masih ada
  rationale: Partisipel nifal dari שׁאר menunjuk kepada orang-orang lain yang tetap ada setelah pelaksanaan hukuman dalam konteks. Ungkapan ini alami dalam bahasa Indonesia dan tidak mempersempitnya menjadi kelompok tertentu.
- source_word: יִשְׁמְעוּ
  choice: akan mendengarnya
  rationale: שׁמע pada dasarnya berarti 'mendengar'. Akhiran '-nya' secara alami menunjuk kepada perkara atau hukuman yang baru disebut dan menghindari ungkapan Indonesia yang terasa menggantung.
- source_word: וְיִרָאוּ
  choice: dan menjadi takut
  rationale: ירא di sini menyatakan rasa takut yang timbul ketika orang mendengar hukuman tersebut dan berfungsi sebagai pencegah. Pilihan ini mempertahankan nada hukum tanpa menafsirkannya sebagai rasa hormat atau takut akan TUHAN secara khusus.
- source_word: וְלֹא יֹסִפוּ לַעֲשׂוֹת עוֹד
  choice: sehingga mereka tidak akan berbuat lagi
  rationale: Konstruksi יסף dengan infinitif dan עוֹד berarti tidak mengulangi atau tidak lagi melakukan. 'Tidak akan berbuat lagi' merupakan padanan Indonesia yang ringkas dan wajar; hubungan akibat dari rasa takut dinyatakan dengan 'sehingga' sesuai fungsi rangkaian dalam konteks hukum.
- source_word: כַּדָּבָר הָרָע הַזֶּה
  choice: hal jahat seperti itu
  rationale: דבר dapat berarti hal, perkara, atau tindakan, sedangkan prefiks כ menyatakan kemiripan atau jenis. 'Hal jahat seperti itu' mempertahankan cakupan umum dan daya bandingnya tanpa secara sempit menggantinya dengan 'kejahatan' tertentu.
- source_word: בְּקִרְבֶּךָ
  choice: di tengah-tengahmu
  rationale: Ungkapan ini berarti di dalam komunitas Israel. Bentuk '-mu' mempertahankan sufiks orang kedua maskulin tunggal yang menyapa Israel sebagai satu kesatuan.
theological_decisions:
- issue: Bilangan dan pihak yang disapa dalam בְּקִרְבֶּךָ
  choice: mempertahankan bentuk tunggal 'di tengah-tengahmu'
  alternative: menerjemahkan secara idiomatis sebagai 'di antara kalian'
  rationale: Sufiks Ibrani berbentuk tunggal dan menyapa Israel secara korporat. Bentuk Indonesia '-mu' menjaga ciri teks itu tanpa menambahkan penafsiran teologis.
- issue: Sifat rasa takut dalam וְיִרָאוּ
  choice: menerjemahkan sebagai 'menjadi takut' dalam fungsi pencegahan hukum
  alternative: menerjemahkan sebagai 'takut akan TUHAN' atau 'menaruh hormat'
  rationale: Objek rasa takut tidak disebutkan. Konteks menunjukkan dampak hukuman sebagai pencegah, tetapi teks tidak secara eksplisit menyebut TUHAN sebagai objek; karena itu objek tersebut tidak ditambahkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan nada hukum, fungsi pencegahan, dan sapaan korporat tunggal dalam teks Ibrani.
