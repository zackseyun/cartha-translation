  text: Therefore I am commanding you[a], saying, ‘You shall set apart three cities for yourself.’
translation:
  language: id
  text: 'Karena itu, aku memerintahkan kepadamu: “Khususkanlah tiga kota bagimu.”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Pisahkanlah tiga kota bagimu” atau “Tetapkanlah tiga kota bagimu.” Kata kerja Ibrani dapat berarti memisahkan, mengkhususkan, atau, dalam konteks ini, menetapkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Karena itu
  rationale: Menandai kesimpulan dari uraian sebelumnya dan mempertahankan daya logis ungkapan Ibrani secara alami dalam bahasa Indonesia.
- source_word: אָנֹכִי
  choice: aku
  rationale: Pronomina mandiri memberi sedikit penekanan pada penutur. Bentuk “aku” mempertahankan orang pertama dalam tuturan Musa tanpa menambahkan penegasan berlebihan seperti “aku sendiri”.
- source_word: מְצַוְּךָ
  choice: memerintahkan kepadamu
  rationale: Partisipel dengan sufiks orang kedua tunggal menyampaikan tindakan pemberian perintah dalam konteks tuturan sekarang. Ungkapan ini langsung dan wajar dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: ':'
  rationale: Infinitif pengutip ini memperkenalkan isi perintah. Tanda titik dua mengungkapkan fungsi tersebut secara lebih alami dalam bahasa Indonesia daripada terjemahan harfiah “dengan mengatakan”.
- source_word: שָׁלֹשׁ עָרִים
  choice: tiga kota
  rationale: Padanan langsung bagi konstruksi bilangan dan nomina.
- source_word: תַּבְדִּיל
  choice: Khususkanlah
  rationale: Bentuk Hifil dari בדל berarti memisahkan atau mengkhususkan. Dalam konteks penetapan kota perlindungan, “khususkanlah” menjaga gagasan pemisahan untuk tujuan tertentu sekaligus fungsi penetapannya.
- source_word: לָךְ
  choice: bagimu sendiri
  rationale: Preposisi dengan sufiks orang kedua maskulin tunggal menunjukkan bahwa kota-kota itu dipisahkan untuk penggunaan atau kepentingan pihak yang disapa. “Bagimu sendiri” mempertahankan bentuk refleksif-benefaktif Ibrani.
theological_decisions:
- issue: Sapaan orang kedua maskulin tunggal dalam hukum perjanjian
  choice: Mempertahankan sapaan tunggal melalui “kepadamu” dan “bagimu sendiri”.
  alternative: Menggunakan bentuk jamak eksplisit seperti “kalian”, atau mengubahnya menjadi konstruksi pasif tanpa pelaku.
  rationale: Hukum perjanjian Ibrani kerap menyapa Israel secara kolektif sebagai satu pihak dengan bentuk tunggal. Mempertahankan bentuk tunggal menjaga gaya retoris sumber tanpa menentukan secara berlebihan apakah tindakan praktis dilakukan oleh individu, bangsa, atau wakil-wakilnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda titik dua dipakai untuk menerjemahkan fungsi pengantar kutipan לֵאמֹר secara alami. Imperatif “Khususkanlah” mempertahankan kekuatan perintah dan hubungan leksikal dengan gagasan pemisahan untuk tujuan tertentu.
