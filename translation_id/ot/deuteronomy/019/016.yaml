  yaml_path: translation/ot/deuteronomy/019/016.yaml
  text: If a malicious witness rises up against a man to testify against him of rebellion[b][a],
translation:
  language: id
  text: Apabila seorang saksi yang berniat jahat[a] bangkit melawan seseorang untuk memberikan kesaksian terhadapnya mengenai suatu penyimpangan[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “saksi kekerasan/kelaliman”; dapat juga berarti “saksi palsu” atau saksi yang bertindak curang.
    reason: lexical_alternative
  - marker: b
    text: Atau “pemberontakan” atau “kemurtadan.” Kata Ibrani ini menunjuk pada tindakan menyimpang atau berpaling dan dapat menyatakan pelanggaran yang serius.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Apabila
  rationale: Dalam rumusan hukum kasuistis, כִּי memperkenalkan keadaan bersyarat. “Apabila” alami dan bermartabat dalam bahasa hukum Indonesia.
- source_word: יָקוּם
  choice: tampil
  rationale: Dalam konteks pengadilan, קום menunjuk pada tindakan muncul atau berdiri untuk memberikan kesaksian. “Tampil” menyampaikan fungsi itu secara wajar tanpa menuntut gerakan fisik harfiah.
- source_word: עֵד חָמָס
  choice: seorang saksi yang berniat jahat
  rationale: Ungkapan ini secara harfiah adalah “saksi kekerasan/kelaliman” dan dalam konteks hukum menunjuk pada saksi yang bertindak secara jahat atau curang. Pilihan ini mempertahankan unsur niat jahat tanpa langsung membatasi maknanya pada kepalsuan faktual.
- source_word: בְּאִישׁ
  choice: melawan seseorang
  rationale: Preposisi בְּ menandai orang yang menjadi sasaran kesaksian. אִישׁ di sini berfungsi secara umum dalam rumusan perkara hukum, sehingga “seseorang” lebih alami daripada “seorang laki-laki” dalam bahasa Indonesia.
- source_word: לַעֲנוֹת
  choice: untuk menuduhnya
  rationale: ענה dalam konteks yudisial berarti memberikan jawaban atau kesaksian. Karena kesaksian ini bersifat bermusuhan dan diarahkan kepada terdakwa, “menuduhnya” menyampaikan fungsi pragmatisnya dengan jelas.
- source_word: בּוֹ
  choice: -nya
  rationale: Pronomina ini merujuk kepada orang yang menjadi sasaran kesaksian dan secara idiomatis melekat pada verba “menuduh” dalam bahasa Indonesia.
- source_word: סָרָה
  choice: melakukan penyimpangan
  rationale: סָרָה mengandung gagasan berpaling atau menyimpang dan dapat merujuk pada pelanggaran serius, pemberontakan, atau pembelotan. “Penyimpangan” mempertahankan keluasan makna itu dalam konteks tuduhan hukum.
theological_decisions:
- issue: Cakupan makna סָרָה
  choice: penyimpangan
  alternative: pemberontakan atau kemurtadan
  rationale: Konteksnya adalah proses hukum umum, sedangkan kata Ibrani ini dapat memiliki bobot moral atau religius yang lebih khusus. Terjemahan utama tidak membatasi tuduhan pada kemurtadan, sementara catatan kaki mempertahankan kemungkinan makna yang lebih kuat.
- issue: Bahasa maskulin dalam rumusan perkara hukum
  choice: seseorang
  alternative: seorang laki-laki
  rationale: Walaupun אִישׁ berbentuk maskulin tunggal, dalam rumusan hukum ini kata tersebut dapat menunjuk pada individu sebagai pihak dalam perkara. Bahasa Indonesia tidak memerlukan penandaan gender, sehingga “seseorang” mempertahankan fungsi representatifnya tanpa menambahkan penegasan jenis kelamin yang tidak diperlukan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak hukum yang jelas. “Apabila” dan “tampil” menjaga martabat rumusan tanpa terasa kuno; struktur kalimat dibiarkan terbuka dengan koma karena ayat berikutnya melanjutkan perkara hukum ini.
