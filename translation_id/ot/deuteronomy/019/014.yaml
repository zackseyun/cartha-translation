source:
  edition: WLC
  text: לֹ֤א תַסִּיג֙ גְּב֣וּל רֵֽעֲ/ךָ֔ אֲשֶׁ֥ר גָּבְל֖וּ רִאשֹׁנִ֑ים בְּ/נַחֲלָֽתְ/ךָ֙ אֲשֶׁ֣ר תִּנְחַ֔ל בָּ/אָ֕רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ לְ/רִשְׁתָּֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/014.yaml
  text: You shall not move your neighbor’s boundary marker[a], which the former generations set, in your inheritance that you will inherit in the land that Yahweh your God is giving you to possess.
translation:
  language: id
  text: Janganlah engkau memindahkan tanda batas tanah sesamamu[a], yang telah ditetapkan oleh orang-orang terdahulu, di dalam tanah warisan yang akan kauwarisi di negeri yang Yahweh, Allahmu, sedang berikan kepadamu untuk kaududuki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “batas tanah sesamamu.” Bahasa Ibrani dapat menunjuk pada batas kepemilikan yang ditetapkan dengan sebuah penanda.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַסִּיג
  choice: memindahkan
  rationale: Bentuk Hifil dari נסג dalam konteks hukum tanah menunjuk pada tindakan menggeser batas demi merampas tanah. “Memindahkan” alami dalam bahasa Indonesia dan tidak mempersempit makna menjadi sekadar mencabut.
- source_word: גְּבוּל
  choice: tanda batas tanah
  rationale: Dalam konteks ini גְּבוּל adalah batas kepemilikan yang diwujudkan dengan penanda yang dapat dipindahkan. Frasa ini memperjelas benda konkret sekaligus fungsi hukumnya.
- source_word: רֵעֲךָ
  choice: sesamamu
  rationale: רֵעַ dalam konteks hukum perjanjian menunjuk pada sesama anggota masyarakat. “Sesamamu” lebih tepat daripada “tetanggamu,” yang dalam bahasa Indonesia dapat menyiratkan hanya orang yang tinggal bersebelahan.
- source_word: גָּבְלוּ
  choice: telah ditetapkan
  rationale: Kata kerja ini berarti menetapkan atau menandai batas. Bentuk pasif Indonesia menjaga fokus pada tanda batas dan tetap mewakili subjek jamak Ibrani, yakni orang-orang terdahulu.
- source_word: רִאשֹׁנִים
  choice: orang-orang terdahulu
  rationale: Adjektiva jamak ini secara harfiah menunjuk pada orang-orang yang lebih dahulu. Pilihan ini mempertahankan keluasan makna tanpa memastikan bahwa mereka adalah leluhur biologis atau beberapa generasi tertentu.
- source_word: בְּנַחֲלָתְךָ
  choice: di dalam tanah warisan
  rationale: נַחֲלָה adalah bagian tanah yang diterima sebagai warisan. Penambahan “tanah” membuat rujukan konkret jelas, sedangkan “warisan” mempertahankan nuansa hukum dan perjanjian.
- source_word: תִּנְחַל
  choice: akan kauwarisi
  rationale: Bentuk imperfek berorientasi pada penerimaan tanah yang akan terjadi dan menggemakan nomina נַחֲלָה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar, agar nama perjanjian dalam teks sumber tetap tampak.
- source_word: נֹתֵן לְךָ
  choice: diberikan ... kepadamu
  rationale: Partisip Ibrani menggambarkan tindakan pemberian Yahweh. Susunan pasif ini alami dalam kalimat Indonesia sambil tetap menyebut Yahweh sebagai pelaku.
- source_word: לְרִשְׁתָּהּ
  choice: untuk kaududuki
  rationale: Infinitif ירשׁ di sini menyatakan mengambil dan mempertahankan kepemilikan atas negeri. “Kaududuki” merupakan ungkapan ringkas dan alami dalam konteks tanah yang dianugerahkan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi secara langsung. “Yahweh” mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Hubungan antara warisan dan pendudukan negeri
  choice: tanah warisan yang akan kauwarisi ... untuk kaududuki
  alternative: milik yang akan kauterima ... untuk kaumiliki
  rationale: Pilihan ini mempertahankan pengulangan akar נחל serta istilah ירשׁ, sehingga dimensi pemberian ilahi dan tindakan Israel menduduki tanah tetap hadir tanpa meleburkan keduanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk tunggal “engkau” dipertahankan sesuai sapaan maskulin tunggal dalam teks Ibrani. Bentuk terikat “kau-” digunakan secara konsisten; susunan kalimat dibuat alami tanpa menghilangkan pengulangan teologis antara “tanah warisan” dan “akan kauwarisi.”
