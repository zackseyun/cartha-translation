  text: וְ/לֹ֤א יִשָּׁפֵךְ֙ דָּ֣ם נָקִ֔י בְּ/קֶ֣רֶב אַרְצְ/ךָ֔ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָ֑ה וְ/הָיָ֥ה עָלֶ֖י/ךָ דָּמִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/010.yaml
  text: so that innocent blood may not be shed in the midst of your land that Yahweh your God is giving you as an inheritance[a], and bloodguilt would be upon you.
translation:
  language: id
  text: supaya darah orang yang tidak bersalah tidak tertumpah di tengah negerimu yang Yahweh, Allahmu, berikan kepadamu sebagai milik pusaka, dan kamu akan menanggung utang darah.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dan darah akan ada atasmu.” Ungkapan Ibrani ini menyatakan tanggung jawab atas penumpahan darah orang yang tidak bersalah, yaitu utang darah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׁפֵךְ
  choice: tertumpah
  rationale: Bentuk Nifal menyatakan tindakan pasif, yaitu darah yang ditumpahkan; bentuk ini wajar dalam konteks pembunuhan dan mempertahankan citra harfiah verba Ibrani.
- source_word: דָּם נָקִי
  choice: darah orang yang tidak bersalah
  rationale: Ungkapan ini menunjuk pada darah seseorang yang tidak patut dihukum mati. Bentuk eksplisit ini lebih mudah dipahami dalam bahasa Indonesia modern daripada 'darah yang tidak bersalah'.
- source_word: בְּקֶרֶב אַרְצְךָ
  choice: di tengah negerimu
  rationale: Menjaga arti spasial קֶרֶב sekaligus mempertahankan nada hukum yang khidmat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks sumber, bukan menggantinya dengan gelar.
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: berikan kepadamu sebagai milik pusaka
  rationale: Partisipel נֹתֵן dipahami dalam bingkai pemberian yang sedang berlangsung, sedangkan נַחֲלָה adalah milik warisan atau pusaka yang diterima Israel.
- source_word: וְהָיָה עָלֶיךָ דָּמִים
  choice: supaya utang darah tidak tertanggung atasmu
  rationale: Dalam konteks hukum, bentuk jamak דָּמִים menyatakan pertanggungjawaban atas penumpahan darah. Rumusan ini juga mengikuti cakupan tujuan negatif dari awal ayat secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian secara langsung; 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan sebuah gelar.
- issue: Hubungan klausa terakhir dengan klausa tujuan
  choice: dan supaya utang darah tidak tertanggung atasmu
  alternative: dan utang darah akan tertanggung atasmu
  rationale: 'Secara formal וְהָיָה dapat dibaca sebagai akibat, tetapi dalam rangkaian yang dibuka oleh וְלֹא, klausa ini paling wajar menyatakan hal kedua yang hendak dicegah: darah tidak tertumpah dan utang darah tidak menimpa umat. Catatan kaki mempertahankan bentuk idiom Ibrani.'
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Milik pusaka' mempertahankan istilah tanah perjanjian; 'utang darah' mempertahankan bobot hukum-moral idiom sumber. Penanda catatan kaki ditempatkan pada klausa yang dijelaskannya.
