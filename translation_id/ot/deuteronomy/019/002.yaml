  text: You shall set apart three cities for yourself within your land that Yahweh your God is giving you to possess[a].
translation:
  language: id
  text: Di dalam negerimu yang Yahweh, Allahmu, berikan kepadamu untuk kamu miliki, pisahkanlah bagimu tiga kota.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk mewarisinya.” Kata kerja Ibrani ini dapat berarti “memiliki” atau “mewarisi” dalam konteks pemberian tanah.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלֹשׁ עָרִים
  choice: tiga kota
  rationale: עִיר dapat berarti kota atau permukiman; 'kota' merupakan padanan baku dan sesuai dengan konteks hukum mengenai kota-kota perlindungan.
- source_word: תַּבְדִּיל
  choice: pisahkanlah
  rationale: Bentuk Hifil dari בדל berarti memisahkan atau mengkhususkan. 'Pisahkanlah' mempertahankan gambaran spasial dari teks sumber, sementara konteks memberi nuansa penetapan resmi.
- source_word: לָךְ
  choice: bagimu
  rationale: Preposisi dengan sufiks menyatakan kepentingan atau manfaat; 'bagimu' mempertahankan nuansa benefaktif secara alami.
- source_word: בְּתוֹךְ אַרְצְךָ
  choice: di dalam negerimu
  rationale: בְּתוֹךְ menyatakan lokasi di tengah atau di dalam suatu wilayah. 'Di dalam negerimu' alami dalam bahasa Indonesia dan mempertahankan makna spasialnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh' agar nama pribadi dalam teks Ibrani tetap tampak dan tidak diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk dengan sufiks orang kedua maskulin tunggal; 'Allahmu' merupakan ungkapan perjanjian yang ringkas dan baku.
- source_word: נֹתֵן לְךָ
  choice: yang diberikan ... kepadamu
  rationale: Partisip Ibrani dapat menyatakan tindakan yang sedang berlangsung atau segera terlaksana. Dalam klausa relatif Indonesia, bentuk pasif 'yang diberikan ... kepadamu' menyampaikan tindakan pemberian secara alami tanpa mengubah pelakunya.
- source_word: לְרִשְׁתָּהּ
  choice: untuk kamu miliki
  rationale: ירשׁ dalam konteks pemberian tanah dapat berarti memiliki, mengambil alih, atau mewarisi. 'Untuk kamu miliki' jelas dan wajar, serta mempertahankan keterkaitannya dengan tanah sebagai pemberian.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. 'Yahweh' mempertahankan nama tersebut alih-alih menggantinya dengan gelar.
- issue: Makna ירשׁ dalam konteks pemberian tanah
  choice: memiliki
  alternative: mewarisi
  rationale: Kedua makna dimungkinkan dalam konteks tanah yang dianugerahkan. Teks utama memakai 'memiliki' karena alami dan tidak mempersempit makna pada pewarisan antargenerasi; kemungkinan 'mewarisi' dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat, dengan bentuk perintah tunggal sesuai sapaan Ibrani. Susunan kalimat dibuat alami tanpa menghilangkan nuansa hukum, benefaktif, dan pemberian tanah.
