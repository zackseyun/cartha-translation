base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/004.yaml
  text: 'This is the provision for the manslayer who may flee there and live: when he strikes his neighbor without intent[a], and he did not hate him in times past.'
translation:
  language: id
  text: 'Inilah ketentuan mengenai orang yang menyebabkan kematian dan dapat melarikan diri ke sana serta tetap hidup: orang yang memukul sesamanya tanpa disengaja dan sebelumnya[a] tidak membencinya.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari kemarin dan hari sebelumnya.” Ungkapan ini berarti “sebelumnya” atau “dahulu”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר
  choice: ketentuan
  rationale: Dalam konteks hukum, kata ini menunjuk pada ketentuan atau perkara yang mengatur kasus tersebut. “Ketentuan” jelas dan wajar dalam bahasa Indonesia.
- source_word: הָרֹצֵחַ
  choice: orang yang menyebabkan kematian
  rationale: Dalam konteks kota perlindungan, istilah ini mencakup orang yang mengakibatkan kematian tanpa harus menyiratkan pembunuhan berencana. Pilihan ini menghindari kesan bersalah yang lazim melekat pada kata “pembunuh”.
- source_word: יָנוּס שָׁמָּה
  choice: boleh melarikan diri ke sana
  rationale: Bentuk verba ini menjelaskan orang yang berhak melarikan diri ke kota perlindungan, bukan terutama memberikan perintah.
- source_word: וָחָי
  choice: dan tetap hidup
  rationale: Ungkapan ini menyatakan hasil dari pelarian ke kota perlindungan, yakni terpeliharanya hidup orang tersebut.
- source_word: יַכֶּה
  choice: memukul ... hingga tewas
  rationale: Verba dasarnya berarti “memukul” atau “menghantam”; tambahan “hingga tewas” menjadikan akibat fatal yang dituntut konteks hukum ini jelas tanpa mengganti tindakan dasarnya dengan verba pembunuhan yang dapat menyiratkan kesengajaan.
- source_word: רֵעֵהוּ
  choice: sesamanya
  rationale: Pilihan ini mempertahankan makna relasional רֵעַ dan terdengar alami dalam bahasa hukum-naratif Indonesia.
- source_word: בִּבְלִי דַעַת
  choice: tanpa disengaja
  rationale: Secara harfiah berarti “tanpa pengetahuan”, tetapi dalam konteks ini menunjuk pada tindakan yang tidak disadari atau tidak diniatkan. “Tanpa disengaja” menyampaikan daya hukumnya secara alami.
- source_word: לֹא שֹׂנֵא לוֹ
  choice: ia tidak membencinya
  rationale: Terjemahan ini mempertahankan penyangkalan terhadap sikap permusuhan yang telah berlangsung sebelumnya.
- source_word: מִתְּמֹל שִׁלְשֹׁם
  choice: sebelumnya
  rationale: Ungkapan harfiah “sejak kemarin dan hari sebelumnya” merupakan idiom untuk waktu lampau. “Sebelumnya” menyampaikan maknanya secara ringkas; bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Tingkat kesalahan orang yang menyebabkan kematian
  choice: Menggunakan istilah netral “orang yang menyebabkan kematian” dan “tanpa disengaja”.
  alternative: “Pembunuh” atau “pembunuh tanpa sengaja”.
  rationale: Ayat ini membedakan kematian yang tidak disengaja dari pembunuhan yang didorong kebencian sebelumnya. Terjemahan tidak boleh lebih dahulu menetapkan pelaku sebagai pembunuh yang bersalah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan corak ketentuan hukum sambil menghindari istilah teknis yang sukar dipahami pembaca umum. Penanda catatan kaki ditempatkan sesudah “sebelumnya”, yaitu pada frasa yang diterangkannya.
