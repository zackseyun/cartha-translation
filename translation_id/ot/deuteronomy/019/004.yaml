  naturalness: Bahasa draf umumnya baku dan jelas. Revisi menghilangkan bentuk “ia telah memukul” yang kurang sesuai dalam rumusan ketentuan umum serta memperlancar hubungan antarklausa.
  terminology: “Ketentuan”, “orang yang menyebabkan kematian”, “sesamanya”, dan “tanpa disengaja” sesuai dengan konteks kota perlindungan dan tidak memaksakan penilaian pidana. “Dapat melarikan diri ... serta tetap hidup” menyampaikan fungsi kelayakan dan hasilnya secara idiomatis.
