  to: Ketika Yahweh, Allahmu, menyingkirkan[a] bangsa-bangsa yang tanahnya Yahweh, Allahmu, berikan kepadamu, lalu engkau menghalau mereka dan tinggal di kota-kota serta rumah-rumah mereka,
