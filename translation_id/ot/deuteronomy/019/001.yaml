  text: כִּֽי יַכְרִ֞ית יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֶת הַ/גּוֹיִ֔ם אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ אֶת אַרְצָ֑/ם וִֽ/ירִשְׁתָּ֕/ם וְ/יָשַׁבְתָּ֥ בְ/עָרֵי/הֶ֖ם וּ/בְ/בָתֵּי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/019/001.yaml
  text: When Yahweh your God cuts off the nations whose land Yahweh your God is giving you[a], and you dispossess them and dwell in their cities and houses,
translation:
  language: id
  text: Ketika Yahweh, Allahmu, menyingkirkan[a] bangsa-bangsa yang tanahnya Yahweh, Allahmu, berikan kepadamu, lalu engkau menghalau mereka dan tinggal di kota-kota serta rumah-rumah mereka,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membinasakan” atau “melenyapkan”; secara harfiah, “memotong.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ketika
  rationale: Dalam konteks hukum ini, כִּי memperkenalkan keadaan mendatang yang dipandang pasti dan menjadi dasar perintah berikutnya; 'ketika' menyampaikan fungsi temporal itu secara alami.
- source_word: יַכְרִית
  choice: menyingkirkan
  rationale: Bentuk Hifil dari כרת di sini berarti membuat bangsa-bangsa itu tersingkir atau lenyap dari hadapan Israel. 'Menyingkirkan' mempertahankan cakupan makna tanpa harus menentukan bahwa kata ini hanya berarti membinasakan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk dengan sufiks orang kedua maskulin tunggal secara alami diterjemahkan 'Allahmu'.
- source_word: הַגּוֹיִם
  choice: bangsa-bangsa
  rationale: Padanan umum dan sesuai konteks bagi גּוֹיִם, tanpa memasukkan konotasi lebih kemudian dari istilah 'bangsa-bangsa bukan Yahudi'.
- source_word: נֹתֵן לְךָ אֶת־אַרְצָם
  choice: yang negerinya diberikan ... kepadamu
  rationale: Partisip נֹתֵן menyatakan tindakan ilahi yang sedang berlangsung atau dipastikan. Bentuk pasif dalam bahasa Indonesia menghubungkan 'negerinya' secara lancar dengan bangsa-bangsa tanpa mengubah pelaku, yaitu Yahweh.
- source_word: וִירִשְׁתָּם
  choice: lalu engkau menghalau mereka
  rationale: Dengan objek berupa orang, ירש menunjuk pada pengusiran atau perampasan kedudukan bangsa-bangsa itu, bukan 'mewarisi mereka'. 'Menghalau' menyampaikan perpindahan mereka dari negeri itu.
- source_word: וְיָשַׁבְתָּ
  choice: dan tinggal
  rationale: '''Tinggal'' merupakan ungkapan Indonesia yang alami untuk menetap atau berdiam di suatu tempat.'
- source_word: בְעָרֵיהֶם וּבְבָתֵּיהֶם
  choice: di kota-kota serta rumah-rumah mereka
  rationale: Preposisi 'di' secara alami mencakup kedua nomina, sedangkan 'mereka' mempertahankan sufiks kepunyaan jamak Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama diri perjanjian יהוה. Bentuk 'Yahweh' mempertahankannya sebagai nama, bukan menggantinya dengan gelar.
- issue: Cakupan tindakan יַכְרִית terhadap bangsa-bangsa
  choice: menyingkirkan
  alternative: membinasakan; melenyapkan
  rationale: Kata Ibrani dapat mencakup pemusnahan atau pelenyapan, tetapi dalam kalimat ini hasil yang ditekankan ialah bangsa-bangsa disingkirkan sehingga Israel menduduki tempat mereka. Terjemahan utama tidak mempersempit maknanya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-naratif yang khidmat. Sapaan orang kedua tunggal 'engkau' dipertahankan karena teks Ibrani memakai bentuk tunggal untuk Israel secara korporat. Tanda koma penutup dipakai karena ayat ini merupakan anak kalimat yang berlanjut ke perintah dalam ayat berikutnya.
