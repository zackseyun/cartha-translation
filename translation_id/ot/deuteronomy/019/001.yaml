  source_fidelity: 'Terjemahan pada dasarnya mengikuti struktur Ibrani: כִּי bernilai temporal (“Ketika”), יַכְרִית diterjemahkan cukup luas sebagai “menyingkirkan,” dan וִירִשְׁתָּם tepat dipahami sebagai tindakan menyingkirkan/menghalau bangsa-bangsa tersebut, bukan mewarisi mereka. Namun, frasa “negerinya diberikan Yahweh, Allahmu, kepadamu” kurang langsung mencerminkan bentuk aktif Ibrani, dengan Yahweh sebagai subjek yang memberikan tanah itu.'
  naturalness: Bahasanya baku dan register hukum-naratifnya sesuai. Pengulangan “Yahweh, Allahmu” diperlukan oleh teks sumber. Susunan aktif “yang tanahnya Yahweh, Allahmu, berikan kepadamu” lebih jelas dan lebih alami daripada konstruksi pasif draft.
  terminology: “Yahweh,” “Allahmu,” “bangsa-bangsa,” “menghalau,” dan “tinggal” sesuai dengan istilah serta register sumber. “Tanah” lebih dekat dengan אֶרֶץ daripada “negeri” dalam konteks pemberian wilayah. Catatan leksikal untuk “menyingkirkan” patut dipertahankan, tetapi penanda catatan harus melekat pada kata yang dijelaskannya.
