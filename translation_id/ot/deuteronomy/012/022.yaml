id: DEU.12.22
reference: Deuteronomy 12:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַ֗ךְ כַּ/אֲשֶׁ֨ר יֵאָכֵ֤ל אֶֽת הַ/צְּבִי֙ וְ/אֶת הָ֣/אַיָּ֔ל כֵּ֖ן תֹּאכְלֶ֑/נּוּ הַ/טָּמֵא֙ וְ/הַ/טָּה֔וֹר יַחְדָּ֖ו יֹאכְלֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/022.yaml
  text: But just as the gazelle and the deer are eaten[a], so you may eat it[b]; the unclean and the clean alike may eat it.
translation:
  language: id
  text: Namun, seperti kijang dan rusa dimakan[a], demikianlah kamu boleh memakannya; baik orang yang najis maupun orang yang tahir boleh memakannya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kijang dan rusa jantan.” Identifikasi tepat kedua jenis satwa ini tidak sepenuhnya pasti.'
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, baik orang yang berstatus najis secara ritual maupun orang yang berstatus tahir secara ritual boleh memakan daging itu.
    reason: cultural_note
lexical_decisions:
- source_word: אַךְ
  choice: Namun
  rationale: Menandai pembatasan atau kualifikasi terhadap perintah sebelumnya dengan penghubung yang wajar dan bermartabat dalam bahasa Indonesia.
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: seperti ... demikianlah
  rationale: Mempertahankan bentuk perbandingan korelatif dalam teks Ibrani secara jelas dan alami.
- source_word: יֵאָכֵל
  choice: dimakan
  rationale: Bentuk Nifal bermakna pasif dan di sini menyatakan kebiasaan umum mengenai kedua jenis satwa liar tersebut.
- source_word: הַצְּבִי
  choice: kijang
  rationale: Padanan Indonesia yang umum dan mudah dipahami untuk satwa sejenis gazel yang dimaksud oleh istilah Ibrani ini.
- source_word: הָאַיָּל
  choice: rusa
  rationale: Padanan umum yang akurat tanpa mempersempit makna menjadi rusa jantan.
- source_word: תֹּאכְלֶנּוּ
  choice: kamu boleh memakannya
  rationale: Imperfek dalam ketentuan hukum ini menyatakan izin, bukan sekadar tindakan pada masa depan.
- source_word: הַטָּמֵא ... הַטָּהוֹר
  choice: orang yang najis ... orang yang tahir
  rationale: Kata sifat substantival ini menunjuk kepada orang berdasarkan status ritual; penambahan 'orang yang' membuat acuannya jelas dalam bahasa Indonesia.
- source_word: יַחְדָּו
  choice: baik ... maupun
  rationale: Dalam konteks ini menyatakan bahwa kedua golongan sama-sama diizinkan, bukan bahwa mereka harus makan secara serentak.
- source_word: יֹאכְלֶנּוּ
  choice: boleh memakannya
  rationale: Imperfek kedua juga berfungsi sebagai izin hukum dan mempertahankan kesejajaran dengan klausa sebelumnya.
theological_decisions:
- issue: Istilah status ritual
  choice: orang yang najis maupun orang yang tahir
  alternative: orang yang tidak suci secara ritual maupun orang yang suci secara ritual
  rationale: Pilihan utama mempertahankan pasangan istilah penting najis–tahir, sementara catatan kaki menjelaskan bahwa yang dimaksud adalah status ritual, bukan watak moral.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur perbandingan Ibrani dipertahankan, sedangkan bentuk izin hukum diungkapkan dengan 'boleh'. Istilah tradisional 'najis' dan 'tahir' dipakai dengan penjelasan ritual dalam catatan kaki.
