  terminology: “Yahweh” konsisten dengan keputusan penerjemahan untuk יהוה. “Allahmu,” “kurban bakaran,” “kurban sembelihan,” “darah,” dan “daging” dipakai secara konsisten dan dapat dipahami dalam register Alkitabiah modern. Penanda catatan kaki [a] ditempatkan pada klausa yang dibahas dan sesuai dengan isi catatan.
