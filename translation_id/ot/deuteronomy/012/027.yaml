  source_fidelity: 'Teks Indonesia dengan tepat mencerminkan susunan dan unsur utama Ibrani: kurban bakaran beserta daging dan darahnya ditempatkan di atas mezbah, darah kurban sembelihan dicurahkan di atas mezbah, dan daging dapat dimakan. “Kurban bakaran,” “mezbah,” dan “dicurahkan” merupakan padanan yang setia konteks. “Tetapi ... boleh kamu makan” secara sah mengungkapkan kontras kontekstual antara darah dan daging, sementara catatan kaki mempertahankan kemungkinan pembacaan yang lebih instruktif dari waw dan bentuk imperfek terakhir.'
