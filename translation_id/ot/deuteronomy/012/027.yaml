  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עָשִׂ֤יתָ עֹלֹתֶ֨י/ךָ֙ הַ/בָּשָׂ֣ר וְ/הַ/דָּ֔ם עַל מִזְבַּ֖ח יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/דַם זְבָחֶ֗י/ךָ יִשָּׁפֵךְ֙ עַל מִזְבַּח֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הַ/בָּשָׂ֖ר תֹּאכֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/027.yaml
  text: And you shall offer your burnt offerings[a], the flesh and the blood, on the altar of Yahweh your God; and the blood of your sacrifices shall be poured out on the altar of Yahweh your God, and you shall eat the flesh.
translation:
  language: id
  text: Persembahkanlah kurban bakaranmu—daging dan darahnya—di atas mezbah Yahweh, Allahmu. Darah kurban sembelihanmu harus dicurahkan di atas mezbah Yahweh, Allahmu, tetapi dagingnya boleh kamu makan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “dan dagingnya harus kamu makan.” Dalam konteks hukum ini, bentuk Ibraninya dapat dipahami sebagai instruksi ataupun izin.'
    reason: Menjaga kemungkinan daya instruktif atau permisif dalam klausa Ibrani terakhir tanpa mengaburkan kontras antara darah dan daging.
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Persembahkanlah
  rationale: Walaupun secara dasar berarti ‘melakukan/membuat’, dalam konteks עֹלָה verba ini menunjuk pada pelaksanaan atau persembahan kurban. Bentuk imperatif wajar dalam bahasa Indonesia untuk instruksi hukum Ibrani.
- source_word: עֹלֹתֶיךָ
  choice: kurban bakaranmu
  rationale: עֹלָה adalah istilah baku bagi kurban yang dibakar seluruhnya di atas mezbah; ‘kurban bakaran’ jelas dan lazim dalam bahasa Indonesia Alkitabiah.
- source_word: הַבָּשָׂר וְהַדָּם
  choice: daging dan darahnya
  rationale: Dalam konteks hewan kurban, ‘daging’ merupakan padanan Indonesia yang konkret dan alami bagi בָּשָׂר; sufiks ‘-nya’ memperjelas hubungan keduanya dengan kurban bakaran tanpa mengubah makna.
- source_word: עַל מִזְבַּח יְהוָה אֱלֹהֶיךָ
  choice: di atas mezbah Yahweh, Allahmu
  rationale: ‘Di atas mezbah’ menyampaikan עַל secara alami dalam konteks ritual, sedangkan nama diri יהוה dipertahankan sebagai ‘Yahweh’.
- source_word: וְדַם זְבָחֶיךָ
  choice: Darah kurban sembelihanmu
  rationale: זֶבַח menunjuk pada kurban yang disembelih dan biasanya dapat dimakan oleh orang yang mempersembahkannya. ‘Kurban sembelihan’ membedakannya dari kurban bakaran sambil tetap mudah dipahami.
- source_word: יִשָּׁפֵךְ
  choice: harus dicurahkan
  rationale: Bentuk Nifal menyatakan bahwa darah dikenai tindakan pencurahan. ‘Harus’ menyampaikan daya instruktif bentuk verbal dalam hukum ini.
- source_word: וְהַבָּשָׂר תֹּאכֵל
  choice: tetapi dagingnya boleh kamu makan
  rationale: Klausa ini mengontraskan darah yang wajib dicurahkan dengan daging yang tersedia untuk dimakan. ‘Boleh’ menyampaikan kemungkinan daya permisif dalam konteks hukum; bentuk yang lebih formal dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. Transliterasi ‘Yahweh’ mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Daya klausa וְהַבָּשָׂר תֹּאכֵל
  choice: tetapi dagingnya boleh kamu makan
  alternative: dan dagingnya harus kamu makan
  rationale: Dalam konteks ini klausa tersebut terutama membedakan perlakuan terhadap daging dari larangan mengenai darah, sehingga dapat dipahami sebagai izin. Namun, konjungsi dan bentuk verbal Ibraninya juga dapat diterjemahkan lebih formal sebagai instruksi; kemungkinan itu dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk imperatif dipakai untuk instruksi hukum; tanda pisah memperjelas bahwa ‘daging dan darahnya’ menjabarkan kurban bakaran. Istilah ritual dipertahankan secara konsisten, tetapi susunan kalimat dibuat alami bagi pembaca umum.
