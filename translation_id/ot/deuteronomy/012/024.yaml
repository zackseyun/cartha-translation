  text: לֹ֖א תֹּאכְלֶ֑/נּוּ עַל הָ/אָ֥רֶץ תִּשְׁפְּכֶ֖/נּוּ כַּ/מָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/024.yaml
  text: You shall not eat it[a]; you shall pour it out on the ground like water.
translation:
  language: id
  text: Janganlah engkau memakannya[a]; curahkanlah itu ke tanah seperti air.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud ialah darah dari hewan yang disembelih, sebagaimana disebutkan dalam konteks sekitar.
    reason: cross_reference
lexical_decisions:
- source_word: לֹא תֹּאכְלֶנּוּ
  choice: Janganlah engkau memakannya
  rationale: Bentuk imperfek Qal orang kedua tunggal dengan sufiks objek orang ketiga tunggal berfungsi sebagai larangan. Bentuk ini mempertahankan sapaan tunggal dan pronomina objek dalam bahasa Ibrani dengan nada hukum yang wajar dalam bahasa Indonesia.
- source_word: עַל הָאָרֶץ
  choice: ke tanah
  rationale: Dalam petunjuk konkret ini, אֶרֶץ menunjuk pada permukaan tanah. Preposisi עַל bersama tindakan mencurahkan secara alami diterjemahkan 'ke tanah' dalam bahasa Indonesia.
- source_word: תִּשְׁפְּכֶנּוּ
  choice: curahkanlah itu
  rationale: Kata שׁפך menyatakan tindakan mencurahkan atau menumpahkan. 'Curahkanlah' sesuai dengan tindakan pembuangan darah dan mempertahankan bentuk perintah serta objek pronominal.
- source_word: כַּמָּיִם
  choice: seperti air
  rationale: Ungkapan komparatif ini menyatakan cara tindakan tersebut dilakukan dan similenya dipertahankan secara langsung.
theological_decisions:
- issue: Rujukan sufiks pronominal
  choice: Kata ganti objek dipertahankan sebagai '-nya' dan 'itu', dengan catatan bahwa rujukannya ialah darah dalam konteks sekitar.
  alternative: Mengganti kedua kata ganti dengan 'darah' di dalam teks utama.
  rationale: Teks Ibrani memakai sufiks pronominal dan tidak mengulang nomina 'darah'. Mempertahankan kata ganti menjaga struktur sumber, sedangkan catatan kaki memberi kejelasan kontekstual tanpa memasukkan perluasan tafsir ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'janganlah' dan 'curahkanlah' mempertahankan corak perintah hukum tanpa terdengar kuno; sapaan 'engkau' mencerminkan orang kedua tunggal dalam teks Ibrani.
