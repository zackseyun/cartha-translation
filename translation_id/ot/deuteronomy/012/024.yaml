  source_fidelity: Teks Indonesia dengan tepat mempertahankan larangan untuk memakan objek yang dirujuk oleh sufiks Ibrani serta perintah untuk mencurahkannya ke tanah seperti air. Penerjemahan עַל־הָאָרֶץ sebagai “ke tanah” wajar dalam bahasa Indonesia sehubungan dengan verba “mencurahkan” dan tidak mengubah maksud konkret frasa Ibrani.
  naturalness: “Janganlah engkau memakannya; curahkanlah itu ke tanah seperti air” adalah bahasa Indonesia baku, jelas, dan bernada hukum. Bentuk “engkau” dan akhiran -lah memberi register yang pantas tanpa menjadi tidak alami.
  terminology: “Curahkanlah,” “tanah,” dan “seperti air” akurat dan konsisten dengan tindakan ritual yang dimaksud. Kata ganti objek dipertahankan sebagaimana dalam teks Ibrani; catatan kaki secara memadai menjelaskan rujukannya dari konteks tanpa memasukkan “darah” ke dalam teks utama.
