    rationale: Ibrani menempatkan כָּל תּוֹעֲבַת ... sebelum verba עָשׂוּ. Penataan ulang dalam bahasa Indonesia meningkatkan kejelasan tanpa mengubah penekanan atau makna.
  - severity: low
