source:
  edition: WLC
  text: לֹא תַעֲשֶׂ֣ה כֵ֔ן לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ כִּי֩ כָּל תּוֹעֲבַ֨ת יְהוָ֜ה אֲשֶׁ֣ר שָׂנֵ֗א עָשׂוּ֙ לֵ/אלֹ֣הֵי/הֶ֔ם כִּ֣י גַ֤ם אֶת בְּנֵי/הֶם֙ וְ/אֶת בְּנֹ֣תֵי/הֶ֔ם יִשְׂרְפ֥וּ בָ/אֵ֖שׁ לֵֽ/אלֹהֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/031.yaml
  text: You shall not do so to Yahweh your God[a], for they have done for their gods every abomination of Yahweh that he hates, for they even burn their sons and their daughters in the fire for their gods.
translation:
  language: id
  text: Jangan lakukan demikian terhadap Yahweh, Allahmu.[a] Sebab segala kekejian yang dibenci Yahweh telah mereka lakukan bagi ilah-ilah mereka. Bahkan mereka membakar anak laki-laki dan anak perempuan mereka dalam api bagi ilah-ilah mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, lebih idiomatis dalam konteks: “Jangan beribadah kepada Yahweh, Allahmu, dengan cara demikian.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תַעֲשֶׂה כֵן
  choice: Jangan lakukan hal-hal seperti itu
  rationale: Bentuk larangan orang kedua tunggal dipertahankan, sedangkan “hal-hal seperti itu” secara alami menunjuk kembali kepada cara ibadah bangsa-bangsa yang dilarang dalam konteks sebelumnya.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: bagi Yahweh, Allahmu
  rationale: Preposisi ל menyatakan arah atau hubungan tindakan ibadah itu dengan Yahweh. “Bagi” cukup dekat dengan bentuk Ibrani dan tetap wajar dalam bahasa Indonesia.
- source_word: כָּל תּוֹעֲבַת יְהוָה אֲשֶׁר שָׂנֵא
  choice: segala kekejian yang dibenci Yahweh
  rationale: “Kekejian” mempertahankan bobot moral dan kultis תּוֹעֵבָה. Susunan Indonesia ini menyampaikan konstruksi Ibrani beserta klausa relatif אֲשֶׁר שָׂנֵא tanpa menghasilkan ungkapan yang kaku atau seolah-olah kekejian itu milik Yahweh.
- source_word: עָשׂוּ לֵאלֹהֵיהֶם
  choice: mereka melakukan bagi ilah-ilah mereka
  rationale: Kata kerja menyatakan praktik yang dilakukan bangsa-bangsa bagi dewa-dewa mereka; “ilah-ilah” membedakannya dari Allah Israel tanpa menambahkan penilaian yang tidak dinyatakan di sini.
- source_word: כִּי גַם
  choice: Bahkan
  rationale: Partikel גַם menonjolkan contoh yang paling mengerikan, sementara hubungan penjelas כִּי telah disampaikan oleh “Sebab” pada kalimat sebelumnya.
- source_word: בְּנֵיהֶם וְאֶת בְּנֹתֵיהֶם
  choice: anak-anak lelaki dan perempuan mereka
  rationale: Terjemahan mempertahankan penyebutan eksplisit anak lelaki dan anak perempuan, tetapi memakai susunan Indonesia yang ringkas dan alami.
- source_word: יִשְׂרְפוּ בָאֵשׁ
  choice: membakar ... dalam api
  rationale: Bentuk ini menggambarkan praktik berulang bangsa-bangsa dan mempertahankan gambaran harfiah pembakaran dalam api.
- source_word: לֵאלֹהֵיהֶם
  choice: bagi ilah-ilah mereka
  rationale: Preposisi ל menunjukkan bahwa pembakaran itu dilakukan sebagai tindakan kultis yang diarahkan atau dipersembahkan kepada ilah-ilah mereka.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Nama perjanjian dalam teks sumber ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga identitas nama ilahi tetap tampak.
- issue: Kekuatan penilaian moral dalam תּוֹעֵבָה dan שָׂנֵא
  choice: kekejian yang dibenci Yahweh
  alternative: hal menjijikkan yang tidak disukai Yahweh
  rationale: Pilihan utama mempertahankan kerasnya penilaian ilahi dalam kedua istilah Ibrani tanpa melunakkan atau menambah isi teologis.
- issue: Hubungan genitif dalam תּוֹעֲבַת יְהוָה
  choice: segala kekejian yang dibenci Yahweh
  alternative: segala kekejian bagi Yahweh yang dibenci-Nya
  rationale: Konstruksi itu dapat dipahami secara relasional, bukan sebagai kepemilikan. Klausa relatif berikutnya menjelaskan bahwa kekejian tersebut dibenci Yahweh; susunan yang dipilih paling alami dalam bahasa Indonesia sambil mempertahankan hubungan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada tegas dan bermartabat. Sapaan orang kedua tunggal tercermin dalam bentuk larangan tanpa kata ganti eksplisit. Istilah “kekejian” dipertahankan karena bobotnya sesuai dengan konteks moral-kultis, dan “ilah-ilah” dipakai untuk dewa-dewa bangsa lain.
