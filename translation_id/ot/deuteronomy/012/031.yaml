  source_fidelity: 'Makna dasar diteruskan dengan tepat: larangan melakukan praktik serupa dalam hubungan ibadah kepada Yahweh, penilaian kuat Yahweh atas praktik itu, dan pembakaran anak laki-laki maupun perempuan bagi ilah-ilah bangsa-bangsa. Namun, susunan objek dalam kalimat kedua sebaiknya didekatkan pada cakupan ''segala kekejian'' dalam teks Ibrani.'
  naturalness: Teks draft umumnya baku, tetapi “melakukan bagi ilah-ilah mereka segala kekejian” terasa kurang lancar dalam bahasa Indonesia modern. “Segala kekejian yang dibenci Yahweh telah mereka lakukan bagi ilah-ilah mereka” lebih jelas dan idiomatis. “Anak laki-laki dan anak perempuan mereka” juga lebih alami daripada “anak-anak lelaki dan perempuan mereka.”
  terminology: “Yahweh,” “Allahmu,” “ilah-ilah,” dan “kekejian” sesuai dengan istilah sumber dan register modern baku. “Terhadap Yahweh” secara idiomatis menyatakan larangan melakukan praktik itu dalam relasi kepada Yahweh, tanpa menyempitkan verba umum עשה menjadi hanya “menyembah.”
