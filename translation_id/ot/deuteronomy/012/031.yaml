  to: Jangan lakukan demikian terhadap Yahweh, Allahmu.[a] Sebab segala kekejian yang dibenci Yahweh telah mereka lakukan bagi ilah-ilah mereka. Bahkan mereka membakar anak laki-laki dan anak perempuan mereka dalam api bagi ilah-ilah mereka.
