    rationale: Sumber secara eksplisit menyebut anak laki-laki dan anak perempuan. Bentuk “anak laki-laki dan anak perempuan mereka” mempertahankan rincian itu dengan pemakaian modern yang lebih wajar.
  - severity: low
    issue: Catatan kaki memakai “menyembah,” yang lebih sempit daripada verba umum 'melakukan' dalam teks sumber.
    rationale: Konteksnya memang ibadah, tetapi alternatif sebaiknya menandai sifat idiomatis-kontekstualnya dan tidak menggantikan cakupan verba sumber pada teks utama.
