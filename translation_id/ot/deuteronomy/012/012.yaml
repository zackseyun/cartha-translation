  text: וּ/שְׂמַחְתֶּ֗ם לִ/פְנֵי֮ יְהוָ֣ה אֱלֹֽהֵי/כֶם֒ אַתֶּ֗ם וּ/בְנֵי/כֶם֙ וּ/בְנֹ֣תֵי/כֶ֔ם וְ/עַבְדֵי/כֶ֖ם וְ/אַמְהֹתֵי/כֶ֑ם וְ/הַ/לֵּוִי֙ אֲשֶׁ֣ר בְּ/שַֽׁעֲרֵי/כֶ֔ם כִּ֣י אֵ֥ין ל֛/וֹ חֵ֥לֶק וְ/נַחֲלָ֖ה אִתְּ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/012.yaml
  text: And you shall rejoice before Yahweh your God—you and your sons and your daughters[a], and your male servants and your female servants, and the Levite who is within your gates, because he has no portion or inheritance with you.
translation:
  language: id
  text: Kalian harus bersukacita di hadapan Yahweh, Allah kalian—kalian, anak-anak lelaki dan perempuan kalian, budak laki-laki dan budak perempuan kalian, serta orang Lewi yang ada di kota-kota kalian[a]—sebab ia tidak mempunyai bagian atau warisan bersama kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “yang ada di dalam gerbang-gerbang kalian.” Dalam ungkapan Ibrani, “gerbang-gerbang” sering menunjuk secara metonimis pada kota atau komunitas setempat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׂמַחְתֶּם
  choice: Kalian harus bersukacita
  rationale: Bentuk ini berfungsi sebagai perintah dalam konteks ketetapan. “Bersukacita” mempertahankan nuansa sukacita peribadatan dan perjanjian.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: di hadapan Yahweh, Allah kalian
  rationale: “Di hadapan” secara alami menyampaikan makna berada dalam kehadiran ilahi, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”.
- source_word: וּבְנֵיכֶם וּבְנֹתֵיכֶם
  choice: anak-anak kalian laki-laki dan perempuan
  rationale: Terjemahan ini mempertahankan penyebutan eksplisit kedua jenis kelamin tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: וְעַבְדֵיכֶם וְאַמְהֹתֵיכֶם
  choice: budak-budak kalian laki-laki dan perempuan
  rationale: Kedua istilah menunjuk pada anggota rumah tangga berstatus terikat dan secara eksplisit membedakan laki-laki serta perempuan. “Budak” mempertahankan realitas sosial-hukum itu lebih jelas daripada “pelayan”.
- source_word: וְהַלֵּוִי
  choice: orang Lewi
  rationale: Ini adalah sebutan Indonesia yang lazim dan alami bagi seorang anggota suku Lewi; bentuk tunggal sumber dipertahankan.
- source_word: אֲשֶׁר בְּשַׁעֲרֵיכֶם
  choice: yang tinggal di dalam gerbang-gerbang kalian
  rationale: Terjemahan utama mempertahankan idiom harfiah Ibrani dan gema hukum-komunalnya; makna metonimis “di kota-kota kalian” dicatat dalam catatan kaki.
- source_word: כִּי אֵין לוֹ חֵלֶק וְנַחֲלָה אִתְּכֶם
  choice: sebab ia tidak mempunyai bagian ataupun milik pusaka bersama kalian
  rationale: “Sebab” menyatakan alasan dimasukkannya orang Lewi. “Bagian” dan “milik pusaka” mempertahankan pasangan istilah yang merujuk pada jatah tanah warisan Israel.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi secara langsung. “Yahweh” mempertahankan nama perjanjian itu, bukan menggantinya dengan gelar.
- issue: Status sosial עֶבֶד dan אָמָה
  choice: budak-budak ... laki-laki dan perempuan
  alternative: hamba-hamba atau pelayan-pelayan laki-laki dan perempuan
  rationale: Dalam daftar anggota rumah tangga dalam ketetapan ini, status keterikatan sosial mereka relevan. “Budak” menghindari penghalusan realitas tersebut, sementara konteks ayat menegaskan bahwa mereka juga harus ikut bersukacita.
- issue: Ketiadaan bagian dan milik pusaka orang Lewi
  choice: tidak mempunyai bagian ataupun milik pusaka bersama kalian
  alternative: tidak mempunyai jatah warisan di antara kalian
  rationale: Pilihan utama tidak menyamakan begitu saja dua istilah Ibrani dan mempertahankan ketegangan pasangan “bagian” serta “milik pusaka”.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. “Kalian” dipakai untuk memperjelas bahwa seluruh bentuk orang kedua dalam ayat ini bersifat jamak. Tanda pisah mengapit daftar pihak yang turut bersukacita, dan penanda catatan kaki [a] ditempatkan tepat sesudah ungkapan yang dijelaskannya.
