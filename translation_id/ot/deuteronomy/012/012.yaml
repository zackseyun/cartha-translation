- from: Kalian harus bersukacita di hadapan Yahweh, Allah kalian—kalian, anak-anak kalian laki-laki dan perempuan, budak-budak kalian laki-laki dan perempuan, serta orang Lewi yang tinggal di dalam gerbang-gerbang kalian[a]—sebab ia tidak mempunyai bagian ataupun milik pusaka bersama kalian.
