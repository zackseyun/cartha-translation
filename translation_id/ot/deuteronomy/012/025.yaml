  text: לֹ֖א תֹּאכְלֶ֑/נּוּ לְמַ֨עַן יִיטַ֤ב לְ/ךָ֙ וּ/לְ/בָנֶ֣י/ךָ אַחֲרֶ֔י/ךָ כִּֽי תַעֲשֶׂ֥ה הַ/יָּשָׁ֖ר בְּ/עֵינֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/025.yaml
  text: You shall not eat it[a], so that it may go well with you and with your children after you, because you will do what is right in the eyes of Yahweh.
translation:
  language: id
  text: Janganlah kamu memakannya, supaya kamu dan anak-anakmu kelak hidup dalam keadaan baik, sebab kamu melakukan apa yang benar di mata Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֹּאכְלֶנּוּ
  choice: memakannya
  rationale: Kata אָכַל berarti ‘makan’, dan akhiran objek tunggalnya merujuk kepada darah dalam konteks langsung. ‘Memakannya’ menyampaikan larangan secara wajar dan langsung.
- source_word: לְמַעַן
  choice: supaya
  rationale: Menandai tujuan atau hasil. ‘Supaya’ alami dalam bahasa Indonesia dan mempertahankan hubungan antara ketaatan dan keadaan yang baik.
- source_word: יִיטַב לְךָ
  choice: keadaanmu ... baik
  rationale: Ungkapan Ibrani ini berarti bahwa segala sesuatu akan berjalan baik bagi seseorang; rumusan ini tidak mempersempit berkat menjadi kemakmuran materi saja.
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: dan anak-anakmu sesudah kamu
  rationale: בָּנִים dapat berarti anak laki-laki, anak-anak, atau keturunan. Dalam konteks perjanjian ini, ‘anak-anakmu’ mempertahankan bahasa kekeluargaan dan cakupan generasi berikutnya.
- source_word: כִּי
  choice: karena
  rationale: Di sini כִּי memberikan dasar bagi keadaan baik yang dijanjikan, yakni melakukan apa yang benar di hadapan Yahweh.
- source_word: תַעֲשֶׂה
  choice: kamu melakukan
  rationale: Bentuk imperfek dalam hubungan ini menyatakan tindakan yang menjadi dasar atau keadaan ketaatan, dan bahasa Indonesia paling alami memakai bentuk tak bertanda waktu ‘melakukan’.
- source_word: הַיָּשָׁר
  choice: apa yang benar
  rationale: יָשָׁר menunjuk kepada apa yang lurus, tepat, atau benar; ‘apa yang benar’ jelas dan sesuai dengan bahasa etis kitab Ulangan.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Mempertahankan metafora Ibrani yang menyatakan penilaian ilahi dan tetap alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks sumber tetap terlihat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama pribadi ilahi tanpa menggantinya dengan gelar.
- issue: Cakupan בָנֶיךָ
  choice: anak-anakmu
  alternative: anak-anak lelakimu atau keturunanmu
  rationale: Bentuknya maskulin jamak, tetapi dalam konteks akibat perjanjian dapat mencakup anak atau keturunan secara representatif. ‘Anak-anakmu’ mempertahankan nuansa keluarga tanpa membatasi makna hanya pada laki-laki.
- issue: Hubungan כִּי dengan janji keadaan baik
  choice: karena
  alternative: ketika atau sebab
  rationale: ‘Karena’ mempertahankan hubungan alasan antara melakukan yang benar dan keadaan baik yang disebutkan, tanpa mengubahnya menjadi jaminan mekanis mengenai kemakmuran material.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk tunggal ‘kamu’ mengikuti sapaan maskulin tunggal dalam teks Ibrani kepada umat sebagai satu kesatuan. Susunan ‘keadaanmu dan anak-anakmu ... baik’ dipilih untuk mempertahankan idiom perjanjian tanpa nuansa materialistis dari ‘makmur’.
