  to: Janganlah kamu memakannya, supaya kamu dan anak-anakmu kelak hidup dalam keadaan baik, sebab kamu melakukan apa yang benar di mata Yahweh.
  rationale: Revisi hanya memperbaiki ungkapan kesejahteraan agar jelas dan alami dalam bahasa Indonesia. "Kelak" menangkap orientasi antargenerasi dari אַחֲרֶיךָ tanpa secara tidak perlu menyatakan kematian, sedangkan "hidup dalam keadaan baik" mempertahankan keluasan idiom Ibrani.
