    issue: Klausa 'bangsa-bangsa yang akan kaudatangi ke sana untuk kauhalau' tidak idiomatis dan kurang jelas.
    rationale: Klausa Ibrani menyatakan bahwa Israel pergi ke sana dengan tujuan menyingkirkan/menghalau bangsa-bangsa itu. Dalam bahasa Indonesia, 'mendatangi ... ke sana' menumpuk penanda arah dan menyamarkan acuan 'ke sana'. Susunan ulang diperlukan demi keterbacaan tanpa mengubah makna.
