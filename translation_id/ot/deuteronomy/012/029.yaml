- from: Apabila Yahweh, Allahmu, menyingkirkan dari hadapanmu bangsa-bangsa yang akan kaudatangi ke sana untuk kauhalau, lalu engkau menghalau mereka dan tinggal di negeri mereka,
  to: Apabila Yahweh, Allahmu, menyingkirkan dari hadapanmu bangsa-bangsa yang akan kauhalau ketika engkau pergi ke sana, lalu engkau menghalau mereka dan tinggal di negeri mereka,
  rationale: Revisi hanya menyusun ulang klausa relatif agar 'pergi ke sana' dan tujuan penghalauan dapat dipahami secara alami dalam bahasa Indonesia. Tindakan Yahweh ('menyingkirkan'), tindakan Israel yang berulang ('menghalau'), dan bentuk ayat sebagai anak kalimat yang berlanjut tetap dipertahankan.
