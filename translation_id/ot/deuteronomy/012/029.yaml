  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי יַכְרִית֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֶת הַ/גּוֹיִ֗ם אֲשֶׁ֨ר אַתָּ֥ה בָא שָׁ֛מָּ/ה לָ/רֶ֥שֶׁת אוֹתָ֖/ם מִ/פָּנֶ֑י/ךָ וְ/יָרַשְׁתָּ֣ אֹתָ֔/ם וְ/יָשַׁבְתָּ֖ בְּ/אַרְצָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/029.yaml
  text: When Yahweh your God cuts off the nations before you, which you are going in there to dispossess, and you dispossess them and dwell in their land,
translation:
  language: id
  text: Apabila Yahweh, Allahmu, menyingkirkan dari hadapanmu bangsa-bangsa yang akan kauhalau ketika engkau pergi ke sana, lalu engkau menghalau mereka dan tinggal di negeri mereka,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Apabila
  rationale: Kata ini memperkenalkan keadaan yang akan terjadi dan menjadi latar bagi peringatan pada ayat berikutnya; karena itu, makna temporal-kondisional lebih tepat daripada makna sebab.
- source_word: יַכְרִית
  choice: menyingkirkan
  rationale: Bentuk Hifil dari כרת di sini menyatakan bahwa bangsa-bangsa itu disingkirkan dari hadapan Israel. Pilihan ini tidak mempersempit maknanya menjadi pemusnahan total.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk dengan akhiran orang kedua tunggal diterjemahkan langsung dan alami dalam ungkapan perjanjian “Yahweh, Allahmu”.
- source_word: הַגּוֹיִם
  choice: bangsa-bangsa
  rationale: Pilihan ini secara langsung merujuk pada kelompok-kelompok bangsa yang mendiami negeri itu.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: yang akan kaudatangi ke sana
  rationale: Terjemahan ini mempertahankan kata kerja datang/pergi serta penunjuk tempat שָׁמָּה, meskipun susunan Ibraninya lebih padat daripada bahasa Indonesia.
- source_word: לָרֶשֶׁת אֹתָם
  choice: untuk kauhalau
  rationale: Dengan bangsa-bangsa sebagai objek, ירש menyatakan pengambilalihan dengan mencabut kedudukan para penghuni sebelumnya; “menghalau” menyampaikan akibat praktis itu tanpa menambahkan gagasan pemusnahan.
- source_word: מִפָּנֶיךָ
  choice: dari hadapanmu
  rationale: Ungkapan ini dipertahankan secara dekat dan tetap dapat dipahami dalam bahasa Indonesia.
- source_word: וְיָרַשְׁתָּ אֹתָם
  choice: lalu engkau menghalau mereka
  rationale: Pengulangan ירש dipertahankan dengan pilihan yang sama secara maknawi; “lalu” menyatakan urutan dalam rangkaian keadaan masa depan.
- source_word: וְיָשַׁבְתָּ בְּאַרְצָם
  choice: dan tinggal di negeri mereka
  rationale: ישב berarti tinggal atau menetap; “tinggal” alami dan tetap mempertahankan nada luhur yang sederhana.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi. Bentuk “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Cakupan tindakan יַכְרִית terhadap bangsa-bangsa
  choice: menyingkirkan
  alternative: memusnahkan
  rationale: Konteks menyatakan pelenyapan bangsa-bangsa itu dari hadapan Israel, tetapi kata ini dalam ayat tersebut tidak dengan sendirinya menuntut penafsiran bahwa setiap orang dimusnahkan. Terjemahan tidak boleh menyelesaikan ketegangan itu secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada luhur. Bentuk terikat “kaudatangi” dan “kauhalau” menjaga kelancaran. Koma penutup dipertahankan karena ayat ini merupakan anak kalimat yang berlanjut ke peringatan pada ayat berikutnya.
