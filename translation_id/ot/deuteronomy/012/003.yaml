    issue: Register pronomina dan modalitas
    rationale: '"Kalian harus" terasa relatif percakapan. Bentuk "Haruslah kamu" lebih selaras dengan gaya perintah kitab suci Indonesia modern-baku tanpa mengubah makna.'
  - severity: medium
