  verdict: revise
  source_fidelity: Terjemahan pada umumnya setia pada urutan dan arti pokok teks Ibrani. Namun, "menebang patung-patung" tidak lazim untuk objek patung dalam bahasa Indonesia dan dapat mengaburkan גדע, yang di sini berarti memotong atau menghantam hingga terputus/runtuh. Frasa untuk פסילי אלהיהם juga perlu diperjelas agar hubungan "patung-patung pahatan milik dewa-dewa mereka" terbaca wajar.
  naturalness: '"Kalian harus" dapat dipahami, tetapi bernada lebih percakapan daripada register naskah perintah yang bermartabat. "Haruslah kamu" lebih baku dan tetap tegas. "Patung-patung ukiran dewa-dewa mereka" kurang lancar; "patung-patung pahatan dewa-dewa mereka" lebih idiomatis.'
  terminology: '"mezbah" adalah bentuk yang lebih mapan dalam pemakaian Alkitab bahasa Indonesia. "Tugu-tugu pemujaan" dan "tiang-tiang Asyera" secara memadai menyampaikan מצבות dan אשרים tanpa menyelesaikan perdebatan identitas objek secara berlebihan. "Melenyapkan nama mereka" dengan catatan kaki mempertahankan idiom Ibrani secara baik.'
