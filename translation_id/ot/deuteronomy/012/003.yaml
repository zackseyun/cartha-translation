  to: Haruslah kamu merobohkan mezbah-mezbah mereka, menghancurkan tugu-tugu pemujaan mereka, membakar tiang-tiang Asyera mereka dengan api[a], memotong patung-patung pahatan dewa-dewa mereka hingga runtuh[b], dan melenyapkan nama mereka[c] dari tempat itu.
