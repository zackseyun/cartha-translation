  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/נִתַּצְתֶּ֣ם אֶת מִזְבּחֹתָ֗/ם וְ/שִׁבַּרְתֶּם֙ אֶת מַצֵּ֣בֹתָ֔/ם וַ/אֲשֵֽׁרֵי/הֶם֙ תִּשְׂרְפ֣וּ/ן בָּ/אֵ֔שׁ וּ/פְסִילֵ֥י אֱלֹֽהֵי/הֶ֖ם תְּגַדֵּע֑וּ/ן וְ/אִבַּדְתֶּ֣ם אֶת שְׁמָ֔/ם מִן הַ/מָּק֖וֹם הַ/הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/003.yaml
  text: You shall tear down their altars[a], shatter their sacred pillars, burn their Asherah poles with fire, cut down the carved images of their gods[c][b], and destroy their name from that place.
translation:
  language: id
  text: Haruslah kamu merobohkan mezbah-mezbah mereka, menghancurkan tugu-tugu pemujaan mereka, membakar tiang-tiang Asyera mereka dengan api[a], memotong patung-patung pahatan dewa-dewa mereka hingga runtuh[b], dan melenyapkan nama mereka[c] dari tempat itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “lambang-lambang Asyera” atau “benda-benda pemujaan Asyera.” Istilah Ibrani ini menunjuk pada benda-benda kultis yang berkaitan dengan Asyera.
    reason: lexical_alternative
  - marker: b
    text: Atau “berhala-berhala dewa mereka.” Ungkapan Ibrani menekankan bahwa benda-benda pemujaan ini dibuat dengan dipahat atau diukir.
    reason: lexical_alternative
  - marker: c
    text: Ungkapan “melenyapkan nama mereka” berarti menghapus kehadiran yang dikenang dan sisa pemujaan mereka dari tempat itu.
    reason: cultural_note
lexical_decisions:
- source_word: נִתַּצְתֶּם אֶת מִזְבּחֹתָם
  choice: merobohkan mazbah-mazbah mereka
  rationale: Kata kerja נתץ menunjuk pada pembongkaran atau perobohan bangunan, sedangkan מִזְבֵּחַ secara khusus berarti mazbah. Bentuk ulang menyatakan jamak secara wajar dalam bahasa Indonesia.
- source_word: שִׁבַּרְתֶּם אֶת מַצֵּבֹתָם
  choice: menghancurkan tugu-tugu pemujaan mereka
  rationale: Bentuk intensif שׁבר menyampaikan penghancuran yang kuat. מַצֵּבָה adalah batu atau tugu tegak yang berfungsi dalam pemujaan; keterangan 'pemujaan' menjelaskan fungsi tanpa menyamakannya dengan tugu biasa.
- source_word: אֲשֵׁרֵיהֶם
  choice: tiang-tiang Asyera mereka
  rationale: Istilah ini menunjuk pada benda-benda kultis yang berkaitan dengan Asyera. 'Tiang-tiang Asyera' mempertahankan nama khusus serta kemungkinan bahwa yang dimaksud adalah benda kayu yang dapat dibakar.
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: membakar ... dengan api
  rationale: Ungkapan ini mempertahankan penyebutan api secara eksplisit dalam teks Ibrani dan tetap alami dalam bahasa Indonesia.
- source_word: פְסִילֵי אֱלֹהֵיהֶם
  choice: patung-patung ukiran dewa-dewa mereka
  rationale: פֶסֶל menekankan benda sembahan yang dibuat dengan dipahat atau diukir. 'Patung-patung ukiran' mempertahankan sifat benda buatan itu, tidak meratakannya menjadi istilah umum 'berhala'.
- source_word: תְּגַדֵּעוּן
  choice: menebang
  rationale: גדע berarti memotong atau menebang hingga runtuh. Pilihan ini mempertahankan gambaran konkret tindakan penghancuran, meskipun objeknya berupa patung ukiran.
- source_word: וְאִבַּדְתֶּם אֶת שְׁמָם
  choice: melenyapkan nama mereka
  rationale: Bentuk kausatif אבד berarti menyebabkan hilang atau musnah. Ungkapan 'melenyapkan nama' mempertahankan idiom Ibrani tentang penghapusan kehadiran dan ingatan mereka.
- source_word: מִן הַמָּקוֹם הַהוּא
  choice: dari tempat itu
  rationale: Terjemahan langsung dan alami yang merujuk kembali pada lokasi pemujaan dalam konteks.
theological_decisions:
- issue: Rujukan אֲשֵׁרֵיהֶם dalam pemujaan Kanaan
  choice: tiang-tiang Asyera mereka
  alternative: lambang-lambang Asyera mereka; benda-benda pemujaan Asyera mereka
  rationale: Terjemahan ini mempertahankan kekhususan budaya dan hubungan dengan Asyera tanpa menyatakan bahwa benda tersebut adalah sang dewi sendiri. Catatan kaki mengakui keluasan rujukan istilah Ibrani.
- issue: Sifat פְסִילֵי אֱלֹהֵיהֶם
  choice: patung-patung ukiran dewa-dewa mereka
  alternative: berhala-berhala mereka
  rationale: Teks Ibrani menonjolkan bahwa benda-benda pemujaan itu merupakan hasil pahatan atau ukiran. Terjemahan konkret menghindari penggantian dini dengan label teologis yang lebih umum.
- issue: Makna ungkapan 'melenyapkan nama mereka'
  choice: mempertahankan idiom dalam teks utama
  alternative: menghapus segala ingatan dan kehadiran pemujaan mereka dari tempat itu
  rationale: Kata 'nama' dapat mencakup ingatan, kehadiran yang diabadikan, dan pengenalan kultis, bukan hanya tulisan atau penyebutan harfiah. Idiom dipertahankan agar keluasan dan ketegangannya tidak dipersempit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada perintah yang tegas dan bermartabat. Kata 'mazbah' dipertahankan sebagai istilah khusus tempat persembahan; 'tugu pemujaan' dan catatan kaki menjelaskan benda-benda kultis tanpa memakai bahasa akademis yang berat.
