  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֠י אִֽם אֶל הַ/מָּק֞וֹם אֲשֶׁר יִבְחַ֨ר יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ מִ/כָּל שִׁבְטֵי/כֶ֔ם לָ/שׂ֥וּם אֶת שְׁמ֖/וֹ שָׁ֑ם לְ/שִׁכְנ֥/וֹ תִדְרְשׁ֖וּ וּ/בָ֥אתָ שָֽׁמָּ/ה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/005.yaml
  text: But to the place that Yahweh your God will choose from all your tribes to put his name there[a], for his dwelling, you shall seek, and there you shall go.
translation:
  language: id
  text: Sebaliknya, carilah tempat yang akan dipilih Yahweh, Allahmu, dari antara semua sukumu untuk menempatkan nama-Nya di sana, untuk kediaman-Nya[a], dan pergilah ke sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “untuk menempatkan nama-Nya di sana sebagai tempat kediaman-Nya.” Ungkapan Ibraninya padat; frasa ini dapat menekankan kediaman Allah, tempat itu sebagai kediaman-Nya, atau keduanya.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם
  choice: Sebaliknya
  rationale: Ungkapan ini mengalihkan larangan sebelumnya kepada pilihan yang benar. 'Sebaliknya' menyatakan kontras secara alami dalam bahasa Indonesia.
- source_word: הַמָּקוֹם
  choice: tempat
  rationale: Padanan konkret dan netral yang mempertahankan lokasi itu sebagai tempat yang belum disebutkan secara khusus.
- source_word: יִבְחַר
  choice: akan dipilih
  rationale: Bentuk imperfek menunjuk pada pemilihan tempat itu oleh Yahweh; bentuk pasif Indonesia mempertahankan tempat sebagai unsur yang menonjol dalam klausa relatif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan, bukan diganti dengan gelar, sehingga mempertahankan nama pribadi dalam teks sumber.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Sufiks Ibrani berbentuk jamak karena Israel disapa secara kolektif, tetapi bahasa Indonesia lazim memakai bentuk tunggal kolektif 'Allahmu' sesuai peralihan sumber kepada verba orang kedua tunggal pada akhir ayat.
- source_word: מִכָּל שִׁבְטֵיכֶם
  choice: dari antara semua sukumu
  rationale: '''Dari antara'' memperjelas bahwa tempat tersebut dipilih dari wilayah yang berkaitan dengan seluruh suku Israel, tanpa menentukan suku mana.'
- source_word: לָשׂוּם אֶת שְׁמוֹ שָׁם
  choice: untuk menempatkan nama-Nya di sana
  rationale: Padanan dekat dengan idiom Ibrani; tidak menambahkan penjelasan teologis di luar motif nama ilahi.
- source_word: לְשִׁכְנוֹ
  choice: sebagai tempat kediaman-Nya
  rationale: Mengungkap fungsi tempat itu sebagai kediaman ilahi, sambil menghindari penambahan verba kausatif seperti 'membuat'. Karena konstruksi Ibraninya ringkas dan dapat dihubungkan dengan klausa sebelumnya dengan beberapa cara, ambiguitas dicatat dalam catatan kaki.
- source_word: תִדְרְשׁוּ
  choice: carilah
  rationale: דרש dalam konteks ini menyatakan tindakan mencari tempat ibadah yang ditetapkan; bentuk imperatif Indonesia secara alami menyampaikan daya kewajiban dari bentuk Ibrani.
- source_word: וּבָאתָ שָׁמָּה
  choice: dan pergilah ke sana
  rationale: Walaupun בוא secara harfiah dapat berarti 'datang', 'pergi ke sana' lebih alami dari sudut pandang pendengar dan tetap mempertahankan שָׁמָּה, 'ke sana'.
theological_decisions:
- issue: Nama ilahi dan bahasa tentang tempat kediaman pusat
  choice: Yahweh ... menempatkan nama-Nya di sana sebagai tempat kediaman-Nya
  alternative: Yahweh ... menempatkan nama-Nya di sana untuk kediaman-Nya
  rationale: Terjemahan mempertahankan kedua motif teks—nama Yahweh dan kediaman-Nya—tanpa memasukkan perkembangan teologi Bait Suci yang lebih kemudian. Catatan kaki mempertahankan ketidakpastian hubungan sintaksis frasa לְשִׁכְנוֹ.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan kepada Israel diterjemahkan dengan bentuk tunggal kolektif agar sesuai dengan peralihan teks Ibrani dari bentuk jamak kepada bentuk tunggal pada bagian akhir ayat. Susunan kalimat dibuat alami dengan menjadikan 'carilah' sebagai predikat utama, tanpa menghilangkan unsur tempat yang dipilih, nama ilahi, kediaman, dan gerak menuju ke sana.
