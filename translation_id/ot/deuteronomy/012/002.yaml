  text: אַבֵּ֣ד תְּ֠אַבְּדוּ/ן אֶֽת כָּל הַ/מְּקֹמ֞וֹת אֲשֶׁ֧ר עָֽבְדוּ שָׁ֣ם הַ/גּוֹיִ֗ם אֲשֶׁ֥ר אַתֶּ֛ם יֹרְשִׁ֥ים אֹתָ֖/ם אֶת אֱלֹהֵי/הֶ֑ם עַל הֶ/הָרִ֤ים הָֽ/רָמִים֙ וְ/עַל הַ/גְּבָע֔וֹת וְ/תַ֖חַת כָּל עֵ֥ץ רַעֲנָן־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/002.yaml
  text: You must surely destroy all the places where the nations whom you are dispossessing served their gods[a], on the high mountains, on the hills, and under every green tree.
translation:
  language: id
  text: 'Kamu harus benar-benar memusnahkan semua tempat di mana bangsa-bangsa yang kamu usir itu beribadah kepada ilah-ilah mereka[a]: di atas gunung-gunung yang tinggi, di atas bukit-bukit, dan di bawah setiap pohon yang rimbun.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “melayani ilah-ilah mereka di sana.” Kata kerja Ibrani yang digunakan dapat berarti “melayani” dalam arti beribadah atau menyembah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַבֵּד תְּאַבְּדוּן
  choice: harus membinasakan sama sekali
  rationale: Infinitif absolut bersama verba finit menegaskan perintah. Ungkapan ini menyampaikan daya intensifnya secara alami dalam bahasa Indonesia modern tanpa harus menambahkan objek yang tidak ada.
- source_word: הַמְּקֹמוֹת
  choice: semua tempat
  rationale: Kata ini menunjuk pada lokasi-lokasi peribadatan. 'Tempat' tetap konkret dan tidak menafsirkan secara berlebihan seperti 'tempat ibadah'.
- source_word: עָבְדוּ שָׁם ... אֶת אֱלֹהֵיהֶם
  choice: di mana ... beribadah kepada ilah-ilah mereka
  rationale: Dalam konstruksi dengan ilah sebagai objek, עבד menyatakan pelayanan religius atau penyembahan. 'Beribadah kepada' terdengar alami dan jelas, sedangkan catatan kaki mempertahankan alternatif formal 'melayani'.
- source_word: הַגּוֹיִם
  choice: bangsa-bangsa
  rationale: Dalam konteks ini kata tersebut merujuk kepada bangsa-bangsa non-Israel di negeri itu; 'bangsa-bangsa' tidak mengimpor nuansa istilah yang lebih kemudian.
- source_word: אֲשֶׁר אַתֶּם יֹרְשִׁים אֹתָם
  choice: yang akan kamu halau
  rationale: Dalam konteks penaklukan, ירשׁ mencakup mengambil alih milik atau wilayah dengan menyingkirkan penduduk sebelumnya. 'Halau' mengungkapkan sisi penyingkiran secara wajar dan tidak menyiratkan pewarisan keluarga.
- source_word: אֱלֹהֵיהֶם
  choice: ilah-ilah mereka
  rationale: Bentuk Ibraninya jamak dengan akhiran posesif. 'Ilah-ilah' mempertahankan pembedaan leksikal dari nama atau sebutan bagi Allah Israel.
- source_word: עַל הֶהָרִים הָרָמִים
  choice: di atas gunung-gunung yang tinggi
  rationale: Terjemahan langsung dari nomina jamak dan adjektiva atributifnya serta cocok untuk lokasi kultis yang berada di tempat tinggi.
- source_word: הַגְּבָעוֹת
  choice: bukit-bukit
  rationale: Padanan langsung bagi bentuk jamak; preposisi sudah menunjukkan bahwa lokasi itu berada di atasnya.
- source_word: תַּחַת כָּל עֵץ רַעֲנָן
  choice: di bawah setiap pohon yang rimbun
  rationale: רַעֲנָן menggambarkan pohon yang segar, menghijau, dan lebat. 'Rimbun' lebih idiomatis dalam bahasa Indonesia untuk tempat teduh berdaun lebat daripada terjemahan harfiah 'hijau'.
theological_decisions:
- issue: Sasaran tindakan penghancuran yang diperintahkan
  choice: Perintah itu secara konkret menyasar semua lokasi tempat bangsa-bangsa tersebut beribadah kepada ilah-ilah mereka.
  alternative: Perintah itu dapat diparafrasakan secara lebih luas sebagai penghapusan praktik penyembahan berhala.
  rationale: Objek gramatikal verba adalah 'semua tempat', bukan praktik ibadah itu sendiri. Terjemahan mempertahankan fokus konkret ini dan membiarkan implikasi yang lebih luas tetap tersirat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada perintah yang tegas dan bermartabat. Kata ganti 'kamu' dipertahankan karena bentuk Ibraninya jamak dan menyapa umat secara kolektif; bahasa Indonesia tidak menandai jumlah pada 'kamu'. Susunan 'baik ... maupun ...' memperjelas rangkaian lokasi tanpa mengubah cakupan perintah.
