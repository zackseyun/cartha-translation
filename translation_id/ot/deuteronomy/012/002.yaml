- from: Kamu harus membinasakan sama sekali semua tempat di mana bangsa-bangsa yang akan kamu halau itu beribadah kepada ilah-ilah mereka[a], baik di atas gunung-gunung yang tinggi, di atas bukit-bukit, maupun di bawah setiap pohon yang rimbun.
  to: 'Kamu harus benar-benar memusnahkan semua tempat di mana bangsa-bangsa yang kamu usir itu beribadah kepada ilah-ilah mereka[a]: di atas gunung-gunung yang tinggi, di atas bukit-bukit, dan di bawah setiap pohon yang rimbun.'
  rationale: Revisi mengganti penandaan masa depan dan padanan yang lebih sempit bagi ירשׁ dengan "yang kamu usir," serta memperlancar ungkapan intensif perintah menjadi "benar-benar memusnahkan." Struktur lokasi dipertahankan secara lengkap, dan catatan kaki tetap melestarikan kemungkinan terjemahan formal bagi verba Ibrani "melayani."
