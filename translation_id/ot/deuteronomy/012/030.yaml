base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/030.yaml
  text: Be careful for yourself, lest you be ensnared after them, after they have been destroyed from before you, and lest you inquire about their gods, saying, “How did these nations serve their gods, so that I too may do the same?”
translation:
  language: id
  text: Jagalah dirimu agar jangan sampai engkau terjerat untuk mengikuti mereka setelah mereka dimusnahkan dari hadapanmu. Jangan pula engkau mencari tahu tentang ilah-ilah mereka dengan berkata, “Bagaimana bangsa-bangsa ini beribadah kepada ilah-ilah mereka? Aku pun akan berbuat demikian.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Jagalah dirimu
  rationale: Mempertahankan bentuk peringatan refleksif dalam bahasa Ibrani dengan ungkapan Indonesia yang alami dan tegas.
- source_word: פֶּן תִּנָּקֵשׁ אַחֲרֵיהֶם
  choice: agar jangan sampai engkau terjerat untuk mengikuti mereka
  rationale: תִּנָּקֵשׁ menggambarkan keadaan terjerat, sedangkan אַחֲרֵיהֶם menyatakan gerak mengikuti mereka; terjemahan ini menjaga citra perangkap sekaligus memperjelas hubungan frasa tersebut tanpa menentukan bentuk jeratnya.
- source_word: אַחֲרֵי הִשָּׁמְדָם מִפָּנֶיךָ
  choice: setelah mereka dimusnahkan dari hadapanmu
  rationale: Mengikuti urutan waktu dan bentuk pasif teks sumber serta mempertahankan ungkapan spasial 'dari hadapanmu'.
- source_word: תִּדְרֹשׁ לֵאלֹהֵיהֶם
  choice: mencari tahu tentang ilah-ilah mereka
  rationale: Dalam konteks pertanyaan mengenai cara bangsa-bangsa beribadah, דָּרַשׁ menyatakan penyelidikan atau pencarian informasi; 'ilah-ilah' mempertahankan sebutan umum bagi objek sembahan bangsa-bangsa itu.
- source_word: אֵיכָה יַעַבְדוּ
  choice: Bagaimana ... beribadah
  rationale: יַעַבְדוּ di sini menunjuk pada pelayanan kultis kepada ilah-ilah, sehingga 'beribadah' lebih tepat daripada kata umum 'melayani'.
- source_word: וְאֶעֱשֶׂה כֵּן גַּם־אָנִי
  choice: Aku pun akan berbuat demikian
  rationale: Mempertahankan penekanan גַּם־אָנִי ('aku pun') dan nilai volitif atau niat dari bentuk verbal dalam konteks kutipan.
theological_decisions:
- issue: Sifat larangan terhadap penyelidikan ibadah bangsa lain
  choice: Menerjemahkan tindakan sebagai mencari tahu dengan maksud meniru, sebagaimana dijelaskan oleh ucapan langsung berikutnya.
  alternative: Memahami frasa itu sebagai larangan mutlak atas segala pengetahuan mengenai agama bangsa lain.
  rationale: Teks menghubungkan penyelidikan itu dengan niat, 'Aku pun akan berbuat demikian'; terjemahan tidak memperluas larangan melampaui hubungan yang dinyatakan ayat.
- issue: Identitas objek sembahan bangsa-bangsa
  choice: ilah-ilah mereka
  alternative: dewa-dewa mereka
  rationale: '''Ilah-ilah'' secara formal sejalan dengan אֱלֹהִים dalam konteks jamak dan tidak memasukkan penilaian tambahan mengenai hakikat objek sembahan tersebut.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti tunggal 'engkau' mempertahankan sapaan langsung kepada Israel sebagai satu kesatuan. Struktur dibagi menjadi dua kalimat agar larangan ganda mudah dipahami tanpa mengubah hubungan logisnya.
