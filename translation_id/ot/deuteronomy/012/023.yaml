base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/023.yaml
  text: Only be sure not to eat the blood[a], because the blood is the life, and you shall not eat the life with the flesh.
translation:
  language: id
  text: Hanya pastikanlah bahwa engkau tidak memakan darah[a], karena darah adalah nyawa, dan engkau tidak boleh memakan nyawa bersama daging.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hidup” atau “jiwa” untuk kedua kemunculan נֶפֶשׁ. Di sini istilah Ibrani itu menunjuk pada nyawa yang menghidupkan makhluk.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Hanya
  rationale: Menandai pembatasan tegas terhadap izin yang disebut sebelumnya.
- source_word: חֲזַק לְבִלְתִּי אֲכֹל
  choice: pastikanlah bahwa engkau tidak memakan
  rationale: Secara harfiah חֲזַק berarti 'jadilah kuat', tetapi dalam konstruksi ini merupakan desakan agar sungguh-sungguh tidak melakukan tindakan tersebut. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan daya perintahnya.
- source_word: הַדָּם
  choice: darah
  rationale: Padanan langsung yang dipertahankan secara konsisten dalam kedua kemunculannya.
- source_word: כִּי
  choice: karena
  rationale: Memperkenalkan alasan bagi larangan tersebut.
- source_word: הַנָּפֶשׁ / הַנֶּפֶשׁ
  choice: nyawa
  rationale: Dalam konteks hukum makanan ini, נֶפֶשׁ menunjuk pada hidup yang menghidupkan makhluk, bukan secara khusus jiwa tak berwujud. 'Nyawa' mempertahankan kaitan konkret antara darah dan kehidupan makhluk.
- source_word: וְלֹא תֹאכַל
  choice: dan engkau tidak boleh memakan
  rationale: Bentuk imperfek dalam ketentuan hukum membawa daya larangan; 'tidak boleh' menyatakannya dengan jelas dan wajar dalam bahasa Indonesia modern.
- source_word: הַנֶּפֶשׁ עִם הַבָּשָׂר
  choice: nyawa bersama daging
  rationale: Mempertahankan gambaran konkret serta pengulangan istilah נֶפֶשׁ, dengan בָּשָׂר diterjemahkan sebagai 'daging'.
theological_decisions:
- issue: Makna נֶפֶשׁ dalam konteks hukum makanan
  choice: nyawa
  alternative: jiwa; hidup
  rationale: '''Nyawa'' menyampaikan kehidupan makhluk yang dikaitkan dengan darah tanpa memasukkan dualisme tubuh-jiwa yang tidak dituntut oleh teks. Catatan kaki mempertahankan kemungkinan padanan leksikal lainnya.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'engkau' mempertahankan sapaan orang kedua tunggal dalam teks Ibrani; susunan kalimat menjaga nada hukum sekaligus tetap mudah dipahami.
