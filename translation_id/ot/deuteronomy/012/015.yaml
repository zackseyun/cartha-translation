    issue: Susunan “yang telah Yahweh, Allahmu, berikan” tidak alami.
    rationale: Aposisi “Allahmu” yang disisipkan di antara subjek dan verba membuat kalimat tersendat. Susunan “berkat Yahweh, Allahmu, yang telah Dia berikan” mempertahankan semua unsur sumber dengan bahasa Indonesia yang lebih wajar.
  - severity: medium
    issue: “seperti halnya kijang dan rusa” dapat mengaburkan pokok perbandingan.
    rationale: Dalam sumber, perbandingan menyatakan bahwa daging itu boleh dimakan sebagaimana hewan buruan tersebut boleh dimakan. Penambahan verba “memakan” pada bagian kedua membuat elipsis sumber jelas tanpa mengubah makna.
