  verdict: revise
  source_fidelity: 'Terjemahan pada umumnya setia pada Ibrani: izin untuk menyembelih dan makan daging, ukuran berkat Yahweh, lokasi di kota-kota, serta izin bagi yang najis dan tahir semuanya tersampaikan. Namun, perbandingan terakhir perlu dibuat lebih jelas dalam bahasa Indonesia agar tidak terdengar seolah-olah orang-orang itu makan dengan cara yang dilakukan kijang dan rusa.'
  naturalness: Bahasa umumnya baku dan mudah dipahami. Frasa “yang telah Yahweh, Allahmu, berikan” kurang luwes karena susunan nama ilahi dan aposisinya memisahkan subjek dari verba. “Seperti halnya kijang dan rusa” juga ambigu secara sintaksis.
  terminology: “Yahweh,” “Allahmu,” “najis,” dan “tahir” tepat. Catatan kaki dengan tepat menjelaskan idiom “gerbang” sebagai kota atau permukiman dan mempertahankan rujukan harfiah pada “jiwa.”
