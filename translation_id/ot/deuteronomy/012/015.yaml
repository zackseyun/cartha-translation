source:
  edition: WLC
  text: רַק֩ בְּ/כָל אַוַּ֨ת נַפְשְׁ/ךָ֜ תִּזְבַּ֣ח וְ/אָכַלְתָּ֣ בָשָׂ֗ר כְּ/בִרְכַּ֨ת יְהוָ֧ה אֱלֹהֶ֛י/ךָ אֲשֶׁ֥ר נָֽתַן לְ/ךָ֖ בְּ/כָל שְׁעָרֶ֑י/ךָ הַ/טָּמֵ֤א וְ/הַ/טָּהוֹר֙ יֹאכְלֶ֔/נּוּ כַּ/צְּבִ֖י וְ/כָ/אַיָּֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/015.yaml
  text: But whenever your soul desires[a], you may slaughter and eat meat, according to the blessing of Yahweh your God that he has given you, within all your gates. The unclean and the clean alike may eat it[b], as they would the gazelle or the deer.
translation:
  language: id
  text: Namun, kapan pun kamu menginginkannya[a], kamu boleh menyembelih dan memakan daging sesuai dengan berkat Yahweh, Allahmu, yang telah Dia berikan kepadamu di setiap kotamu.[b] Orang yang najis maupun yang tahir boleh memakannya, sebagaimana mereka boleh memakan kijang dan rusa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “menurut segala keinginan jiwamu”; maksudnya, kapan pun kamu menginginkannya.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “di seluruh gerbangmu.” Dalam bahasa Ibrani, “gerbang” dapat merujuk pada kota atau permukiman.'
    reason: cultural_note
lexical_decisions:
- source_word: רַק
  choice: Namun
  rationale: Menandai pembatasan atau pengecualian terhadap perintah sebelumnya dengan penghubung yang wajar dalam bahasa Indonesia.
- source_word: בְּכָל אַוַּת נַפְשְׁךָ
  choice: kapan pun kamu menginginkannya
  rationale: Mengungkapkan idiom Ibrani secara alami; ungkapan harfiahnya dijelaskan dalam catatan kaki agar unsur נֶפֶשׁ tidak hilang tanpa penjelasan.
- source_word: תִּזְבַּח וְאָכַלְתָּ בָשָׂר
  choice: kamu boleh menyembelih dan memakan daging
  rationale: Dalam konteks ini bentuk verba memberi izin untuk menyembelih hewan sebagai makanan, bukan sekadar menyatakan masa depan atau memberi perintah mutlak.
- source_word: כְּבִרְכַּת יְהוָה אֱלֹהֶיךָ אֲשֶׁר נָתַן לְךָ
  choice: sesuai dengan berkat yang telah Yahweh, Allahmu, berikan kepadamu
  rationale: Mempertahankan nomina 'berkat' dan daya banding preposisi כ, sehingga pemakanan dikaitkan dengan berkat atau persediaan yang Allah karuniakan.
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: di setiap kotamu
  rationale: Secara harfiah 'di seluruh gerbangmu', tetapi 'gerbang' merupakan metonimia Ibrani bagi kota atau permukiman; padanan ini menyampaikan maksudnya dengan jelas.
- source_word: הַטָּמֵא וְהַטָּהוֹר
  choice: Orang yang najis maupun yang tahir
  rationale: Menunjuk pada status kenajisan ritual, bukan mutu moral; 'maupun' menegaskan bahwa kedua kelompok diizinkan makan.
- source_word: יֹאכְלֶנּוּ
  choice: boleh memakannya
  rationale: Konteks menyatakan izin, dan pronomina objeknya merujuk pada daging yang disembelih.
- source_word: כַּצְּבִי וְכָאַיָּל
  choice: seperti halnya kijang dan rusa
  rationale: Mempertahankan dua contoh hewan buruan yang dapat dimakan tanpa perlakuan sebagai kurban, dengan susunan yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung; bentuk 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Makna najis dan tahir
  choice: Mempertahankan istilah 'najis' dan 'tahir' sebagai status ritual
  alternative: Menjelaskannya dalam teks sebagai 'secara ritual najis maupun tahir'
  rationale: Istilah baku ini menjaga kategori hukum ritual dalam teks tanpa memperluas ayat atau mengesankan penilaian moral.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal 'kamu', selaras dengan bentuk orang kedua tunggal dalam teks Ibrani. Gaya dijaga lugas dan bermartabat; idiom yang akan terasa asing dialihkan secara alami dan bentuk harfiahnya dicatat.
