  yaml_path: translation/ot/deuteronomy/012/008.yaml
  text: You shall not do as we are doing here today[a], each man whatever is right in his own eyes.
translation:
  language: id
  text: Janganlah kamu bertindak menurut segala yang sedang kita lakukan di sini hari ini, yakni setiap orang[a] melakukan apa yang benar menurut pandangannya sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “setiap laki-laki”; ungkapan Ibrani ini bersifat distributif, yaitu setiap orang bertindak menurut penilaiannya sendiri.
    reason: Menjelaskan bentuk maskulin tunggal אִישׁ dan fungsi perwakilan-distributifnya.
lexical_decisions:
- source_word: לֹא תַעֲשׂוּן
  choice: Janganlah kamu melakukan
  rationale: Bentuk imperfek orang kedua jamak di bawah negasi menyatakan larangan. “Janganlah kamu” mempertahankan daya instruktifnya dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: כְּכֹל אֲשֶׁר
  choice: seperti segala yang
  rationale: Frasa perbandingan ini menyatakan kesamaan cara atau praktik. Bentuk ini menjaga unsur כֹּל tanpa menjadi terlalu kaku.
- source_word: אֲנַחְנוּ עֹשִׂים פֹּה הַיּוֹם
  choice: kita lakukan di sini pada hari ini
  rationale: Partisip menyatakan kegiatan yang sedang berlaku. “Kita” mencakup pembicara bersama para pendengar, sedangkan “pada hari ini” sesuai dengan register perjanjian yang khidmat.
- source_word: אִישׁ
  choice: setiap orang
  rationale: Walaupun bentuk Ibraninya tunggal maskulin, pemakaiannya di sini distributif. “Setiap orang” menyampaikan cakupan perwakilan secara alami dalam bahasa Indonesia tanpa menghilangkan sifat individualnya.
- source_word: כָּל הַיָּשָׁר
  choice: apa pun yang benar
  rationale: Ungkapan ini menunjuk pada segala sesuatu yang dinilai lurus atau tepat. Terjemahan ini mempertahankan kata “benar” dan tidak menambahkan nuansa “tampaknya” yang lebih interpretatif.
- source_word: בְּעֵינָיו
  choice: menurut pandangannya sendiri
  rationale: Ini adalah idiom Ibrani tentang penilaian pribadi. Padanan Indonesia ini mempertahankan maknanya dengan lebih alami daripada terjemahan harfiah “di matanya sendiri”.
theological_decisions:
- issue: Ungkapan distributif maskulin אִישׁ ... בְּעֵינָיו
  choice: setiap orang ... menurut pandangannya sendiri
  alternative: masing-masing laki-laki ... di matanya sendiri
  rationale: Konstruksi tunggal maskulin berfungsi secara distributif dan representatif dalam konteks seluruh Israel. Terjemahan utama mempertahankan tanggung jawab individual tanpa membatasi rujukannya hanya kepada laki-laki; catatan menjelaskan bentuk sumbernya.
- issue: Nilai moral הַיָּשָׁר dalam penilaian pribadi
  choice: yang benar menurut pandangannya sendiri
  alternative: yang dianggap benar menurut pandangannya sendiri
  rationale: Teks menempatkan “yang benar” dalam kerangka pandangan tiap orang, tetapi tidak secara eksplisit memakai verba “menganggap” atau “tampak.” Terjemahan mempertahankan ketegangan itu tanpa memperjelasnya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Larangan memakai “janganlah”; “pada hari ini” mempertahankan nuansa khidmat wacana perjanjian. Idiom Ibrani diterjemahkan secara alami sebagai “menurut pandangannya sendiri,” dengan penjelasan bentuk distributif dalam catatan kaki.
