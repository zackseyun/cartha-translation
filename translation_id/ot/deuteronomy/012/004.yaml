  text: You shall not do so to Yahweh your God[a][b].
translation:
  language: id
  text: Janganlah kamu berbuat demikian terhadap Yahweh, Allahmu.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “demikian” menunjuk kembali pada perintah sebelumnya mengenai penghancuran tempat-tempat ibadah bangsa-bangsa; Israel tidak boleh memperlakukan Yahweh dengan cara itu.
    reason: cross_reference
  - marker: b
    text: Ibrani YHWH, nama ilahi yang secara tradisional diterjemahkan “TUHAN.”
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא תַעֲשׂוּן
  choice: Janganlah kamu berbuat
  rationale: Gabungan negasi לֹא dengan bentuk imperfek orang kedua jamak menyatakan larangan langsung dalam konteks hukum. “Janganlah” mempertahankan nada perintah yang tegas dan bermartabat.
- source_word: כֵּן
  choice: demikian
  rationale: Kata ini menunjuk kembali pada tindakan yang baru saja disebutkan dalam konteks sebelumnya. “Demikian” alami dalam bahasa Indonesia dan mempertahankan rujukan singkat teks Ibrani tanpa memperluas tafsir dalam ayat.
- source_word: לַיהוָה
  choice: terhadap Yahweh
  rationale: Preposisi ל di sini menyatakan sasaran atau hubungan tindakan. “Terhadap” dengan jelas menyampaikan bahwa Israel tidak boleh memperlakukan Yahweh dengan cara tersebut.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: 'Bentuk dengan sufiks orang kedua jamak menyatakan hubungan perjanjian: Allah milik seluruh komunitas yang disapa. Bahasa Indonesia lazim memakai akhiran tunggal “-mu” untuk sapaan kolektif “kamu”.'
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian YHWH. Bentuk “Yahweh” mempertahankan nama diri itu dalam teks utama, sedangkan padanan tradisional “TUHAN” dicatat sebagai alternatif.
- issue: Cakupan larangan dalam konteks
  choice: Mempertahankan ungkapan ringkas “berbuat demikian”
  alternative: Memperjelas dalam teks utama sebagai larangan memperlakukan Yahweh seperti bangsa-bangsa memperlakukan ilah mereka
  rationale: כֵּן bersifat anaforis dan bergantung pada konteks sebelumnya. Terjemahan utama mempertahankan keringkasan serta kemungkinan ketegangan konteks, sementara catatan menjelaskan rujukannya tanpa memasukkan penafsiran panjang ke dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. “Janganlah” mempertahankan corak hukum-perjanjian tanpa terdengar usang; “Allahmu” mengikuti kebiasaan bahasa Indonesia untuk sapaan kolektif.
