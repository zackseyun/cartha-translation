  text: Only, you shall not eat the blood; you shall pour it out on the ground like water.
translation:
  language: id
  text: Hanya saja, kalian tidak boleh memakan darah itu; curahkanlah darah itu ke tanah seperti air.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Hanya saja
  rationale: Menandai pembatasan terhadap izin dalam konteks sebelumnya; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya restriktifnya.
- source_word: הַדָּם
  choice: darahnya
  rationale: Artikel Ibrani menunjuk pada darah hewan yang sedang dibicarakan. Sufiks -nya menyatakan acuan khusus itu secara alami dalam bahasa Indonesia tanpa menjadikannya posesif secara teologis.
- source_word: לֹא תֹאכֵלוּ
  choice: tidak boleh kamu makan
  rationale: Bentuk imperfek dengan negasi berfungsi sebagai larangan hukum. Susunan ini tegas, bermartabat, dan tetap mudah dipahami.
- source_word: עַל הָאָרֶץ
  choice: ke tanah
  rationale: Dalam tindakan fisik ini, אֶרֶץ merujuk pada permukaan tanah, bukan bumi atau wilayah. Preposisi Indonesia 'ke' sesuai dengan tindakan mencurahkan sesuatu menuju tanah.
- source_word: תִּשְׁפְּכֶנּוּ
  choice: kamu harus mencurahkannya
  rationale: Kata kerja berarti mencurahkan atau menumpahkan, dan sufiks objek merujuk kembali kepada darah. 'Mencurahkan' mempertahankan tindakan yang disengaja, sedangkan 'harus' menyampaikan daya instruksi hukum.
- source_word: כַּמָּיִם
  choice: seperti air
  rationale: Padanan perbandingan yang langsung dan alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Perlakuan terhadap darah dalam hukum makanan
  choice: Menerjemahkan ayat ini secara langsung sebagai larangan memakan darah dan perintah mencurahkannya ke tanah.
  alternative: Memberi makna simbolis atau penjelasan teologis tambahan tentang darah di dalam teks utama.
  rationale: Ayat ini menyampaikan ketentuan konkret. Terjemahan tidak perlu memasukkan penafsiran teologis dari konteks lain atau tradisi kemudian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk tunggal 'kamu' mengikuti orang kedua maskulin tunggal dalam teks Ibrani, sementara konteks hukum tetap bersifat umum. Tanda titik koma mempertahankan hubungan erat antara larangan dan perintah pembuangan darah.
