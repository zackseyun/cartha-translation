review_pass:
  verdict: revise
  source_fidelity: 'Draf pada umumnya setia kepada teks Ibrani: bentuk kausatif dalam לְשַׁכֵּן, arah dalam שָׁמָּה, daftar persembahan, dan “nazar-nazar pilihan” dipertahankan tanpa menambahkan “persembahan.” Namun, sufiks orang kedua dalam ayat ini berbentuk jamak; penggunaan “kamu/-mu” tunggal tidak konsisten dengan sasaran jamak teks sumber.'
  naturalness: Kalimat dan register umumnya baku dan jelas. Penggunaan “kalian” secara konsisten lebih alami dan tepat untuk pembaca modern ketika bentuk jamak sumber ingin dinyatakan. “Segala nazar kalian yang terbaik” menyampaikan konstruksi Ibrani dengan lebih langsung daripada “segala yang terbaik dari nazar.”
  terminology: “Yahweh,” “kurban bakaran,” “kurban sembelihan,” “persembahan persepuluhan,” dan “nazar” dapat dipertahankan. “Membuat nama-Nya berdiam” secara wajar mempertahankan kausatif tanpa memaksakan penafsiran teologis.
  issues:
  - severity: medium
    issue: Pronomina orang kedua diterjemahkan sebagai tunggal
    rationale: Bentuk kepunyaan dan verba orang kedua dalam Ibrani adalah jamak (Allah kalian; bawalah; persembahan kalian; nazar kalian). Draf memakai “Allahmu,” “kamu,” dan “-mu,” padahal catatannya sendiri mengakui bentuk jamak sumber.
  - severity: low
    issue: Ungkapan untuk מִבְחַר נִדְרֵיכֶם kurang langsung
    rationale: “Segala yang terbaik dari nazar” dapat dipahami, tetapi “segala nazar kalian yang terbaik” lebih langsung mencerminkan “seluruh pilihan/yang terbaik dari nazar-nazar kalian” dan terdengar lebih lengkap dalam bahasa Indonesia.
  revised_text: 'Maka, tempat yang akan dipilih Yahweh, Allah kalian, untuk membuat nama-Nya berdiam di sana[a]—ke sanalah kalian harus membawa segala yang kuperintahkan kepada kalian: kurban bakaran kalian, kurban sembelihan kalian, persembahan persepuluhan kalian, persembahan dari tangan kalian, dan segala nazar kalian yang terbaik, yang kalian ikrarkan kepada Yahweh.'
  revised_footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “agar nama-Nya berdiam di sana” atau “untuk menempatkan nama-Nya di sana.”
    reason: Bentuk Ibrani bersifat kausatif dan dapat diungkapkan secara lebih harfiah atau lebih idiomatis; catatan mempertahankan rentang makna serta citra “berdiam”.
