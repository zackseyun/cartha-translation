reference: Deuteronomy 12:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָיָ֣ה הַ/מָּק֗וֹם אֲשֶׁר יִבְחַר֩ יְהוָ֨ה אֱלֹהֵי/כֶ֥ם בּ/וֹ֙ לְ/שַׁכֵּ֤ן שְׁמ/וֹ֙ שָׁ֔ם שָׁ֣מָּ/ה תָבִ֔יאוּ אֵ֛ת כָּל אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֣ה אֶתְ/כֶ֑ם עוֹלֹתֵי/כֶ֣ם וְ/זִבְחֵי/כֶ֗ם מַעְשְׂרֹֽתֵי/כֶם֙ וּ/תְרֻמַ֣ת יֶדְ/כֶ֔ם וְ/כֹל֙ מִבְחַ֣ר נִדְרֵי/כֶ֔ם אֲשֶׁ֥ר תִּדְּר֖וּ לַֽ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/011.yaml
  text: 'Then the place that Yahweh your God will choose for his name to dwell there—to that place you shall bring all that I am commanding you: your burnt offerings[a], your sacrifices, your tithes, the contribution of your hand, and all the choicest of your vows that you vow to Yahweh.'
translation:
  language: id
  text: 'Maka, tempat yang akan dipilih Yahweh, Allah kalian, untuk membuat nama-Nya berdiam di sana[a]—ke sanalah kalian harus membawa segala yang kuperintahkan kepada kalian: kurban bakaran kalian, kurban sembelihan kalian, persembahan persepuluhan kalian, persembahan dari tangan kalian, dan segala nazar kalian yang terbaik, yang kalian ikrarkan kepada Yahweh.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “agar nama-Nya berdiam di sana” atau “untuk menempatkan nama-Nya di sana.”
    reason: Bentuk Ibrani bersifat kausatif dan dapat diungkapkan secara lebih harfiah atau lebih idiomatis; catatan mempertahankan rentang makna serta citra “berdiam”.
lexical_decisions:
- source_word: וְהָיָה
  choice: Maka
  rationale: Menandai keadaan atau hasil pada masa mendatang dari petunjuk sebelumnya dengan penghubung yang alami dalam bahasa Indonesia.
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: tempat yang akan dipilih
  rationale: Mempertahankan tempat tertentu sebagai tema utama dan nuansa mendatang dari konteks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: untuk membuat nama-Nya berdiam di sana
  rationale: Mempertahankan bentuk kausatif verba Ibrani sekaligus citra 'berdiam' yang penting dalam teologi nama di Ulangan.
- source_word: שָׁמָּה תָבִיאוּ
  choice: ke sanalah kamu harus membawa
  rationale: Menangkap arah menuju tempat tersebut serta daya perintah verba.
- source_word: כָּל אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם
  choice: segala yang kuperintahkan kepadamu
  rationale: Ungkapan Indonesia yang ringkas dan alami, dengan orang pertama tunggal merujuk kepada Musa sebagai penutur.
- source_word: עוֹלֹתֵיכֶם
  choice: kurban bakaranmu
  rationale: Istilah baku untuk kurban yang dibakar seluruhnya.
- source_word: זִבְחֵיכֶם
  choice: kurban sembelihanmu
  rationale: Mempertahankan unsur penyembelihan dalam istilah Ibrani tanpa mempersempitnya menjadi satu jenis kurban tertentu.
- source_word: מַעְשְׂרֹתֵיכֶם
  choice: persembahan persepuluhanmu
  rationale: Jelas bagi pembaca modern dan menunjukkan bahwa yang dimaksud ialah bagian sepersepuluh yang dipersembahkan.
- source_word: תְרֻמַת יֶדְכֶם
  choice: persembahan dari tanganmu
  rationale: Menjaga idiom konkret Ibrani mengenai pemberian yang dibawa atau diserahkan sendiri.
- source_word: וְכֹל מִבְחַר נִדְרֵיכֶם
  choice: dan segala yang terbaik dari nazar
  rationale: Mempertahankan makna superlatif atau pilihan terbaik tanpa menambahkan kata 'persembahan' yang tidak dinyatakan secara eksplisit.
- source_word: אֲשֶׁר תִּדְּרוּ לַיהוָה
  choice: yang kamu ikrarkan kepada Yahweh
  rationale: '''Ikrarkan'' merupakan pasangan alami bagi ''nazar'' dan mempertahankan Yahweh sebagai penerima nazar.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai nama diri ilahi; transliterasi 'Yahweh' mempertahankan fungsi nama itu tanpa menggantinya dengan gelar.
- issue: Bentuk kausatif dan teologi nama dalam לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: untuk membuat nama-Nya berdiam di sana
  alternative: agar nama-Nya berdiam di sana; untuk menempatkan nama-Nya di sana
  rationale: Pilihan utama mempertahankan baik daya kausatif maupun metafora berdiam, tanpa menyamakan kehadiran nama dengan pembatasan hakikat Allah pada satu lokasi.
- issue: Makna מִבְחַר נִדְרֵיכֶם
  choice: segala yang terbaik dari nazar yang kamu ikrarkan
  alternative: segala nazar pilihanmu; segala yang terbaik dari persembahan nazarmu
  rationale: Menjaga keterbukaan konstruksi Ibrani dan tidak menambahkan 'persembahan' sebagai unsur yang tidak eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Bentuk tunggal 'kamu' dipakai karena sufiks orang kedua dalam ayat ini berbentuk jamak secara kolektif, tetapi sapaan Indonesia dapat dibaca sebagai umat secara keseluruhan; bentuk kepunyaan dilekatkan agar daftar tetap lancar. Istilah ritual dibuat cukup jelas tanpa menjadi terlalu teknis.
