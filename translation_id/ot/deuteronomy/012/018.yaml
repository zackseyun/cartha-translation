  text: כִּ֡י אִם לִ/פְנֵי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ תֹּאכְלֶ֗/נּוּ בַּ/מָּקוֹם֙ אֲשֶׁ֨ר יִבְחַ֜ר יְהוָ֣ה אֱלֹהֶי/ךָ֮ בּ/וֹ֒ אַתָּ֨ה וּ/בִנְ/ךָ֤ וּ/בִתֶּ֨/ךָ֙ וְ/עַבְדְּ/ךָ֣ וַ/אֲמָתֶ֔/ךָ וְ/הַ/לֵּוִ֖י אֲשֶׁ֣ר בִּ/שְׁעָרֶ֑י/ךָ וְ/שָׂמַחְתָּ֗ לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כֹ֖ל מִשְׁלַ֥ח יָדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/018.yaml
  text: Instead[b][a], you shall eat it before Yahweh your God in the place that Yahweh your God will choose—you and your son and your daughter and your male servant and your female servant and the Levite who is within your gates—and you shall rejoice before Yahweh your God in all to which you put your hand.
translation:
  language: id
  text: Sebaliknya, engkau harus memakannya di hadapan Yahweh, Allahmu, di tempat yang akan dipilih Yahweh, Allahmu—engkau, anakmu laki-laki dan anakmu perempuan, hambamu laki-laki dan hambamu perempuan, serta orang Lewi yang tinggal di kotamu[a]—dan engkau harus bersukacita di hadapan Yahweh, Allahmu, dalam segala yang kaukerjakan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di dalam gerbang-gerbangmu,” sebuah ungkapan Ibrani bagi orang yang tinggal di kota atau lingkungan setempat.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “dalam segala penguluran tanganmu”; maksudnya, dalam segala pekerjaan atau usaha yang kaulakukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: Sebaliknya
  rationale: Dalam hubungan dengan larangan pada ayat sebelumnya, ungkapan ini memperkenalkan satu-satunya tindakan alternatif yang diperbolehkan. “Sebaliknya” menyampaikan kontras itu secara alami.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: di hadapan Yahweh, Allahmu
  rationale: לִפְנֵי berarti “di depan/di hadapan” dan di sini menyatakan kehadiran ilahi. Nama יהוה dipertahankan sebagai “Yahweh”.
- source_word: תֹּאכְלֶנּוּ
  choice: engkau harus memakannya
  rationale: Bentuk orang kedua tunggal dengan akhiran objek orang ketiga tunggal merujuk pada bagian kudus yang disebut sebelumnya dan memiliki daya instruktif.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ
  choice: di tempat yang akan dipilih Yahweh, Allahmu
  rationale: Rumusan khas Ulangan ini menunjuk pada tempat ibadah yang dipilih Allah. בּוֹ secara wajar terserap ke dalam frasa Indonesia “di tempat yang”.
- source_word: אַתָּה וּבִנְךָ וּבִתֶּךָ
  choice: engkau bersama anakmu laki-laki dan anakmu perempuan
  rationale: Daftar rumah tangga dan bentuk sapaan tunggal dipertahankan; “bersama” memperjelas bahwa mereka semua turut makan tanpa mengubah makna.
- source_word: וְעַבְדְּךָ וַאֲמָתֶךָ
  choice: hambamu laki-laki dan hambamu perempuan
  rationale: Pilihan ini mempertahankan pembedaan gender dalam pasangan kata Ibrani dengan bahasa Indonesia modern.
- source_word: וְהַלֵּוִי אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: orang Lewi yang tinggal di kotamu
  rationale: Secara harfiah ungkapan itu berbunyi “yang ada di dalam gerbang-gerbangmu,” sebuah idiom kewargaan bagi orang yang tinggal di kota atau lingkungan setempat.
- source_word: וְשָׂמַחְתָּ
  choice: Engkau harus bersukacita
  rationale: Kata kerja ini menyatakan sukacita aktif dalam perayaan ibadah; “bersukacita” mempertahankan nuansa tersebut.
- source_word: בְּכֹל מִשְׁלַח יָדֶךָ
  choice: dalam segala yang kaukerjakan
  rationale: Ungkapan harfiahnya adalah “dalam segala penguluran/pengiriman tanganmu,” yaitu segala pekerjaan atau usaha yang dilakukan seseorang. Terjemahan ini alami sambil mempertahankan keluasan maknanya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה secara langsung. Bentuk “Yahweh” mempertahankannya sebagai nama diri, bukan menggantinya dengan gelar.
- issue: Nuansa makan dan bersukacita di hadapan Allah
  choice: Mempertahankan ungkapan “di hadapan Yahweh” pada kedua klausa
  alternative: di tempat ibadah Yahweh
  rationale: Teks menekankan kehadiran ilahi tanpa secara eksplisit menjelaskan mekanisme atau teologi kehadiran itu; terjemahan tidak mempersempit maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “engkau” mempertahankan bentuk orang kedua tunggal Ibrani. Struktur daftar dibuat jelas tanpa mempertahankan semua pengulangan konjungsi secara kaku; dua kalimat dipakai agar mudah dibaca.
