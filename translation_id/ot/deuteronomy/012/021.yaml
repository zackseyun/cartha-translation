  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי יִרְחַ֨ק מִמְּ/ךָ֜ הַ/מָּק֗וֹם אֲשֶׁ֨ר יִבְחַ֜ר יְהוָ֣ה אֱלֹהֶי/ךָ֮ לָ/שׂ֣וּם שְׁמ֣/וֹ שָׁם֒ וְ/זָבַחְתָּ֞ מִ/בְּקָרְ/ךָ֣ וּ/מִ/צֹּֽאנְ/ךָ֗ אֲשֶׁ֨ר נָתַ֤ן יְהוָה֙ לְ/ךָ֔ כַּ/אֲשֶׁ֖ר צִוִּיתִ֑/ךָ וְ/אָֽכַלְתָּ֙ בִּ/שְׁעָרֶ֔י/ךָ בְּ/כֹ֖ל אַוַּ֥ת נַפְשֶֽׁ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/021.yaml
  text: If the place that Yahweh your God chooses to put his name there is too far from you[a], then you may slaughter from your herd and from your flock that Yahweh has given you, as I have commanded you[b], and you may eat within your gates according to all the desire of your soul.
translation:
  language: id
  text: Jika tempat yang Yahweh, Allahmu, pilih untuk menempatkan nama-Nya di sana terlalu jauh darimu, engkau boleh menyembelih dari ternak sapimu serta kambing dombamu yang telah Yahweh berikan kepadamu, seperti yang telah kuperintahkan kepadamu. Engkau boleh makan di kotamu[a] sesuai dengan segala keinginanmu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di dalam gerbang-gerbangmu,” yakni di kota-kota atau permukimanmu.'
    reason: Metonimia Ibrani memakai “gerbang” untuk menunjuk pada kota atau permukiman.
  - marker: b
    text: 'Secara harfiah: “sesuai dengan segala keinginan jiwamu”; dapat juga dipahami “sesuai dengan seluruh seleramu.”'
    reason: נֶפֶשׁ dapat berarti jiwa, diri, atau hasrat/selera seseorang; konteks makan memungkinkan nuansa selera.
lexical_decisions:
- source_word: כִּי יִרְחַק מִמְּךָ
  choice: Jika ... terlalu jauh darimu
  rationale: כִּי memperkenalkan keadaan bersyarat dalam ketentuan hukum ini. רחק secara leksikal berarti ‘jauh’; ‘terlalu jauh’ menyatakan secara alami alasan praktis bagi izin yang menyusul.
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ
  choice: tempat yang akan dipilih Yahweh, Allahmu
  rationale: Bentuk yiqtol יִבְחַר dalam rumusan hukum ini dapat menunjuk pada pilihan yang akan dilakukan; ‘akan dipilih’ alami dalam bahasa Indonesia dan tidak menghapus sifat umum rumusan tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: לָשׂוּם שְׁמוֹ שָׁם
  choice: untuk menempatkan nama-Nya di sana
  rationale: Terjemahan ini mengikuti arti langsung שׂים, ‘menempatkan’, serta mempertahankan rumusan khas Ulangan tanpa menambahkan gagasan ‘mendiami’.
- source_word: וְזָבַחְתָּ
  choice: engkau boleh menyembelih
  rationale: Dalam konteks ini זבח menunjuk pada penyembelihan ternak untuk konsumsi setempat, bukan keharusan mempersembahkan kurban. ‘Boleh’ menyampaikan daya permisif ketentuan tersebut.
- source_word: מִבְּקָרְךָ וּמִצֹּאנְךָ
  choice: sebagian dari kawanan sapi dan kawanan kambing dombamu
  rationale: בקר dan צאן adalah nomina kolektif bagi ternak besar serta ternak kecil. ‘Kambing domba’ mencakup domba dan kambing yang termasuk dalam צאן.
- source_word: אֲשֶׁר נָתַן יְהוָה לְךָ
  choice: yang telah Yahweh berikan kepadamu
  rationale: Bentuk perfektif נָתַן menggambarkan pemberian yang hasilnya kini dimiliki umat.
- source_word: כַּאֲשֶׁר צִוִּיתִךָ
  choice: seperti yang telah kuperintahkan kepadamu
  rationale: Bentuk orang pertama tunggal dipertahankan karena Musa tetap menjadi penutur.
- source_word: וְאָכַלְתָּ
  choice: Engkau boleh memakannya
  rationale: Dalam rangkaian hukum ini bentuk tersebut melanjutkan izin yang diberikan, bukan semata-mata menyatakan prediksi atau kewajiban.
- source_word: בִּשְׁעָרֶיךָ
  choice: di kotamu
  rationale: Secara harfiah ungkapan itu berarti ‘di dalam gerbang-gerbangmu’, tetapi ‘gerbang’ berfungsi sebagai metonimia bagi kota atau permukiman. ‘Di kotamu’ menyampaikan acuannya secara alami.
- source_word: בְּכֹל אַוַּת נַפְשֶׁךָ
  choice: sesuai dengan segala keinginanmu
  rationale: Ungkapan ini menyatakan seluruh keinginan atau selera seseorang. Terjemahan utama dibuat alami, sedangkan citra harfiah ‘keinginan jiwamu’ dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama perjanjian יהוה. Bentuk ‘Yahweh’ mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Sifat penyembelihan di luar tempat pusat
  choice: izin untuk menyembelih bagi konsumsi setempat
  alternative: perintah untuk mempersembahkan kurban setempat
  rationale: Konteks Ulangan 12 membedakan penyembelihan biasa untuk makanan dari kurban yang harus dibawa ke tempat pilihan Yahweh. Karena itu ‘boleh menyembelih’ menghindari kesan bahwa kurban lokal diizinkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal ‘engkau’ agar bentuk orang kedua tunggal Ibrani tetap terlihat. Susunan kalimat dipecah menjadi dua untuk keterbacaan, tanpa mengubah hubungan logisnya. Nada dipertahankan lugas, legal, dan bermartabat.
