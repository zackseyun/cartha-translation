revisions:
- from: Jika tempat yang akan dipilih Yahweh, Allahmu, untuk menempatkan nama-Nya di sana terlalu jauh darimu, engkau boleh menyembelih sebagian dari kawanan sapi dan kawanan kambing dombamu yang telah Yahweh berikan kepadamu, seperti yang telah kuperintahkan kepadamu. Engkau boleh memakannya di kotamu[a] sesuai dengan segala keinginanmu.[b]
  to: Jika tempat yang Yahweh, Allahmu, pilih untuk menempatkan nama-Nya di sana terlalu jauh darimu, engkau boleh menyembelih dari ternak sapimu serta kambing dombamu yang telah Yahweh berikan kepadamu, seperti yang telah kuperintahkan kepadamu. Engkau boleh makan di kotamu[a] sesuai dengan segala keinginanmu.[b]
  rationale: Revisi kecil ini meningkatkan kedekatan dengan subjek aktif dan bentuk takberobjek teks Ibrani, serta membuat istilah ternak lebih wajar dalam bahasa Indonesia modern. Penempatan catatan kaki dipertahankan pada frasa yang benar-benar dijelaskannya; ini lebih selaras dengan teks Ibrani daripada jangkar yang tampak tidak selaras dalam jejak audit bahasa Inggris.
