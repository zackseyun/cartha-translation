review_pass:
  verdict: revise
  source_fidelity: 'Draf pada dasarnya setia pada Ibrani: hubungan bersyarat, jarak tempat pilihan Yahweh, izin menyembelih ternak milik penerima, rujukan kepada perintah Musa, dan makan di permukiman sendiri semuanya terwakili. Namun, bentuk pasif “yang akan dipilih Yahweh” kurang langsung daripada Ibrani aktif “yang Yahweh ... pilih,” dan “memakannya” menambahkan objek tersurat yang tidak ada dalam teks.'
  naturalness: Ragamnya baku dan jelas. “Ternak sapi serta kambing dombamu” lebih lazim dan ringkas daripada “sebagian dari kawanan sapi dan kawanan kambing dombamu.” “Engkau boleh makan” juga lebih dekat dengan bentuk takberobjek dalam bahasa sumber dan tetap alami.
  terminology: “Yahweh” tepat untuk יהוה. “Allahmu,” “menempatkan nama-Nya,” dan “gerbang-gerbangmu” dalam catatan kaki sesuai dengan istilah dan citra Ibrani. Catatan tentang selera mempertahankan kemungkinan nuansa נֶפֶשׁ tanpa menjadikannya satu-satunya arti.
  issues:
  - severity: low
    issue: Konstruksi relatif pasif dan futurum
    rationale: “tempat yang akan dipilih Yahweh” dapat dipahami dengan baik, tetapi Ibrani menyatakan Yahweh sebagai subjek aktif dari יבחר. “tempat yang Yahweh, Allahmu, pilih” lebih langsung dan tidak memaksakan nuansa waktu masa depan.
  - severity: low
    issue: Objek tambahan pada kata ‘makan’
    rationale: “memakannya” secara wajar mengacu pada ternak/daging, tetapi וְאָכַלְתָּ tidak menyatakan objek. “Engkau boleh makan” mempertahankan keluasan teks.
  - severity: low
    issue: Pilihan ‘sebagian dari kawanan’
    rationale: Partitif “sebagian” tidak keliru, tetapi tidak perlu ditegaskan oleh preposisi מִן dalam konteks ini. “dari ternak sapimu serta kambing dombamu” lebih alami dan cukup setia.
  revised_text: Jika tempat yang Yahweh, Allahmu, pilih untuk menempatkan nama-Nya di sana terlalu jauh darimu, engkau boleh menyembelih dari ternak sapimu serta kambing dombamu yang telah Yahweh berikan kepadamu, seperti yang telah kuperintahkan kepadamu. Engkau boleh makan di kotamu[a] sesuai dengan segala keinginanmu.[b]
