  source_fidelity: Terjemahan dengan tepat menyampaikan pembatasan כִּי אִם dalam kesinambungan dengan ayat sebelumnya, tempat tertentu yang akan dipilih Yahweh, lokasi dalam wilayah salah satu suku, serta pengulangan שָׁם. “Korban-korban bakaranmu” sesuai dengan עֹלֹתֶיךָ, dan “segala yang Kuperintahkan kepadamu” mempertahankan cakupan כֹּל serta hubungan perintah ilahi.
