  terminology: “Yahweh” konsisten dengan kebijakan nama ilahi dan merepresentasikan יהוה secara langsung. “Wilayah salah satu sukumu” secara wajar mengungkapkan nilai lokatif frasa Ibrani, sementara catatan kaki menjaga bentuk harfiahnya. Istilah “korban bakaran” tepat untuk עֹלָה.
