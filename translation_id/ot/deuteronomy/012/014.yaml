id: DEU.12.14
reference: Deuteronomy 12:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֣י אִם בַּ/מָּק֞וֹם אֲשֶׁר יִבְחַ֤ר יְהוָה֙ בְּ/אַחַ֣ד שְׁבָטֶ֔י/ךָ שָׁ֖ם תַּעֲלֶ֣ה עֹלֹתֶ֑י/ךָ וְ/שָׁ֣ם תַּעֲשֶׂ֔ה כֹּ֛ל אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/014.yaml
  text: but only at the place that Yahweh will choose in one of your tribes—there you shall offer up your burnt offerings[b][a], and there you shall do all that I am commanding you.
translation:
  language: id
  text: melainkan hanya di tempat[a] yang akan dipilih Yahweh di wilayah salah satu sukumu[b]. Di sanalah harus kaupersembahkan korban-korban bakaranmu, dan di sanalah harus kaulakukan segala yang Kuperintahkan kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kecuali di tempat yang akan dipilih Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di salah satu sukumu”, yakni di dalam wilayah salah satu suku Israel.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי אִם
  choice: melainkan hanya
  rationale: Dalam kesinambungan dengan larangan pada ayat sebelumnya, ungkapan ini menyatakan pertentangan sekaligus pembatasan pada satu-satunya tempat yang diizinkan.
- source_word: בַּמָּקוֹם
  choice: di tempat
  rationale: Menunjuk pada lokasi ibadah tertentu yang akan dipilih Allah; bentuk definitnya dipahami dari klausa penjelas sesudahnya.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: yang akan dipilih Yahweh
  rationale: Bentuk yiqtol memiliki arah prospektif dalam konteks ini, dan nama ilahi יְהוָה dialihaksarakan sebagai “Yahweh”.
- source_word: בְּאַחַד שְׁבָטֶיךָ
  choice: di wilayah salah satu sukumu
  rationale: Secara harfiah berarti “di salah satu sukumu”, tetapi maksud lokatifnya ialah di dalam wilayah yang didiami atau menjadi bagian salah satu suku Israel. Catatan kaki mempertahankan bentuk harfiahnya.
- source_word: שָׁם ... וְשָׁם
  choice: Di sanalah ... dan di sanalah
  rationale: Pengulangan dipertahankan, sedangkan partikel -lah menegaskan bahwa tindakan ibadah itu harus dilakukan di tempat tersebut.
- source_word: תַּעֲלֶה עֹלֹתֶיךָ
  choice: harus kaupersembahkan korban-korban bakaranmu
  rationale: Hifil עלה bersama עֹלָה merupakan ungkapan persembahan kurban. “Mempersembahkan korban bakaran” alami dalam bahasa Indonesia dan menyampaikan makna kultisnya.
- source_word: כֹּל אֲשֶׁר אָנֹכִי מְצַוֶּךָּ
  choice: segala yang Kuperintahkan kepadamu
  rationale: Mencerminkan cakupan menyeluruh כֹּל dan rumusan perintah dengan partisipel מְצַוֶּה secara ringkas serta alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Sifat eksklusif tempat ibadah yang dipilih
  choice: melainkan hanya di tempat
  alternative: kecuali di tempat
  rationale: Pilihan utama mempertahankan daya pertentangan dan pembatasan כִּי אִם setelah larangan pada ayat sebelumnya, tanpa menentukan lebih jauh identitas historis tempat tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk tunggal orang kedua dipertahankan melalui “kau-”, “-mu”, dan “kepadamu”. Pengulangan “di sanalah” mengikuti penekanan teks Ibrani; “harus” menyampaikan daya normatif bentuk verbal dalam konteks perintah.
