  text: אֵ֠לֶּה הַֽ/חֻקִּ֣ים וְ/הַ/מִּשְׁפָּטִים֮ אֲשֶׁ֣ר תִּשְׁמְר֣וּ/ן לַ/עֲשׂוֹת֒ בָּ/אָ֕רֶץ אֲשֶׁר֩ נָתַ֨ן יְהוָ֜ה אֱלֹהֵ֧י אֲבֹתֶ֛י/ךָ לְ/ךָ֖ לְ/רִשְׁתָּ֑/הּ כָּל הַ/יָּמִ֔ים אֲשֶׁר אַתֶּ֥ם חַיִּ֖ים עַל הָ/אֲדָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/001.yaml
  text: These are the statutes and the judgments that you shall be careful to do in the land that Yahweh[a], the God of your fathers, has given you to possess[c][b], all the days that you are living on the earth.
translation:
  language: id
  text: Inilah ketetapan dan peraturan yang harus kamu lakukan dengan cermat di negeri yang Yahweh, Allah nenek moyangmu, telah berikan kepadamu untuk kamu miliki[a], selama kamu hidup di atas bumi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “untuk kamu warisi.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “di atas tanah.” Dalam konteks ini ungkapan itu juga dapat dipahami lebih sempit sebagai “di negeri itu.”'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: אֵלֶּה הַחֻקִּים וְהַמִּשְׁפָּטִים
  choice: Inilah ketetapan-ketetapan dan peraturan-peraturan
  rationale: “Inilah” secara alami memperkenalkan kumpulan hukum yang menyusul. “Ketetapan” dan “peraturan” mempertahankan pembedaan kedua istilah hukum Ibrani tanpa memakai “penghakiman,” yang dalam bahasa Indonesia modern mudah disalahartikan sebagai tindakan menghakimi.
- source_word: אֲשֶׁר תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: yang harus kamu lakukan dengan sungguh-sungguh
  rationale: Gabungan שׁמר dengan infinitif עשה menuntut ketaatan yang teliti dan nyata. Susunan ini lebih wajar dalam bahasa Indonesia daripada terjemahan harfiah “menjaga untuk melakukan.”
- source_word: בָּאָרֶץ
  choice: di negeri
  rationale: Dalam konteks Ulangan, אֶרֶץ menunjuk kepada wilayah yang diberikan kepada Israel; “negeri” menyampaikan makna teritorial tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: Allah nenek moyangmu
  rationale: “Nenek moyang” merupakan padanan Indonesia yang alami dan inklusif secara genealogis bagi אבות dalam rumusan perjanjian ini.
- source_word: לְרִשְׁתָּהּ
  choice: untuk kamu miliki
  rationale: Dalam konteks tanah, ירשׁ menyatakan memperoleh dan menguasai sebagai milik. Alternatif “mendudukinya” dapat terlalu menonjolkan tindakan okupasi, sedangkan “mewarisinya” dapat terdengar terlalu pasif.
- source_word: כָּל הַיָּמִים אֲשֶׁר אַתֶּם חַיִּים
  choice: selama kamu hidup
  rationale: Ungkapan Indonesia ini menyampaikan keseluruhan rentang waktu kehidupan secara alami dan ringkas.
- source_word: עַל הָאֲדָמָה
  choice: di atas bumi
  rationale: אֲדָמָה dapat berarti tanah atau bumi. “Bumi” membedakannya dari בָּאָרֶץ sebelumnya dan mempertahankan cakupan lebih luas yang mungkin dimaksud.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama pribadi Allah. “Yahweh” mempertahankan fungsi nama itu, sedangkan “TUHAN” menggantinya dengan gelar.
- issue: Cakupan עַל הָאֲדָמָה
  choice: di atas bumi
  alternative: di atas tanah / di negeri itu
  rationale: Kata tersebut dapat menunjuk tanah atau bumi. Teks utama memakai “bumi” karena frasa ini berada dalam keterangan sepanjang hidup dan dibedakan dari “di negeri” sebelumnya; catatan kaki mempertahankan kemungkinan arti yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan tunggal “kamu” dipertahankan dalam bagian yang secara gramatikal tunggal, walaupun perintah ditujukan kepada Israel secara kolektif; klausa penutup dalam bahasa Ibrani beralih ke bentuk jamak, tetapi bahasa Indonesia tidak menandai perbedaan itu tanpa tambahan yang berpotensi menafsirkan.
