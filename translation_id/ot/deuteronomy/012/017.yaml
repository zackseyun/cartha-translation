  text: לֹֽא תוּכַ֞ל לֶ/אֱכֹ֣ל בִּ/שְׁעָרֶ֗י/ךָ מַעְשַׂ֤ר דְּגָֽנְ/ךָ֙ וְ/תִֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֔/ךָ וּ/בְכֹרֹ֥ת בְּקָרְ/ךָ֖ וְ/צֹאנֶ֑/ךָ וְ/כָל נְדָרֶ֨י/ךָ֙ אֲשֶׁ֣ר תִּדֹּ֔ר וְ/נִדְבֹתֶ֖י/ךָ וּ/תְרוּמַ֥ת יָדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/017.yaml
  text: You may not eat within your gates the tithe of your grain[a], your new wine, or your oil, or the firstborn of your herd or your flock, or any of your vows that you vow, or your freewill offerings[c][b], or the contribution of your hand.
translation:
  language: id
  text: Di kota-kotamu[a] kamu tidak boleh memakan persepuluhan hasil biji-bijianmu, air anggur barumu, atau minyakmu, anak sulung ternak sapimu dan kawanan kambing dombamu, segala persembahan nazar yang kamu nazarkan[b], persembahan sukarelamu, ataupun persembahan dari tanganmu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di dalam gerbang-gerbangmu,” suatu ungkapan Ibrani untuk kota-kota atau permukiman setempat.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “segala nazarmu yang kamu nazarkan.” Dalam konteks ini, ungkapan tersebut tampaknya menunjuk pada persembahan yang dijanjikan melalui nazar.
    reason: lexical_alternative
  - marker: c
    text: Atau “persembahan khusus dari tanganmu”; secara tradisional, “persembahan unjukan dari tanganmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תוּכַל לֶאֱכֹל
  choice: kamu tidak boleh memakan
  rationale: Gabungan יכל dengan infinitif dalam konteks hukum menyatakan larangan, bukan sekadar ketidakmampuan. Bentuk ini langsung dan alami dalam bahasa Indonesia.
- source_word: בִּשְׁעָרֶיךָ
  choice: di kota-kotamu
  rationale: Secara harfiah berarti 'di dalam gerbang-gerbangmu', tetapi merupakan ungkapan untuk permukiman atau kota setempat. Terjemahan utama menyampaikan maknanya, sedangkan citra Ibraninya dipertahankan dalam catatan kaki.
- source_word: מַעְשַׂר דְּגָנְךָ
  choice: persepuluhan dari gandummu
  rationale: מַעְשַׂר adalah bagian sepersepuluh yang dikhususkan, sedangkan דָּגָן menunjuk pada hasil biji-bijian. 'Persepuluhan' mempertahankan istilah ibadah yang dikenal.
- source_word: תִּירֹשְׁךָ
  choice: anggur barumu
  rationale: תִּירוֹשׁ lazim menunjuk pada anggur baru atau hasil anggur segar dan dibedakan dari istilah Ibrani lain untuk anggur.
- source_word: יִצְהָרֶךָ
  choice: minyakmu
  rationale: Istilah ini biasanya menunjuk pada minyak segar, terutama minyak zaitun. 'Minyak' akurat tanpa menambahkan jenis yang tidak dinyatakan secara eksplisit.
- source_word: בְכֹרֹת בְּקָרְךָ וְצֹאנֶךָ
  choice: anak sulung dari ternak sapimu atau ternak kambing dombamu
  rationale: בְּכוֹרֹת berarti keturunan yang lahir pertama; בָּקָר adalah ternak sapi, sedangkan צֹאן mencakup kawanan domba dan kambing. 'Atau' mengalir alami dalam rangkaian hal yang dilarang dimakan tanpa mengubah cakupannya.
- source_word: כָל נְדָרֶיךָ אֲשֶׁר תִּדֹּר
  choice: segala persembahan nazar yang kamu nazarkan
  rationale: Secara bentuk, frasa itu menyebut 'segala nazarmu yang kamu nazarkan', tetapi dalam daftar makanan kudus konteksnya menunjuk pada persembahan yang terkait dengan nazar. Catatan kaki mempertahankan bentuk harfiah dan ambiguitas metonimisnya.
- source_word: נִדְבֹתֶיךָ
  choice: persembahan sukarelamu
  rationale: Istilah ini menunjuk pada pemberian ibadah yang diberikan secara sukarela, bukan karena nazar atau kewajiban.
- source_word: תְּרוּמַת יָדֶךָ
  choice: persembahan dari tanganmu
  rationale: תְּרוּמָה adalah sesuatu yang dipisahkan atau diserahkan sebagai persembahan. Ungkapan 'dari tanganmu' mempertahankan citra Ibrani tanpa memakai istilah teknis yang usang.
theological_decisions:
- issue: Istilah persembahan dalam konteks hukum ibadah
  choice: Menyebut 'persembahan nazar' dan 'persembahan sukarela' sebagai kategori persembahan yang berbeda.
  alternative: Menerjemahkan secara lebih harfiah sebagai 'nazar-nazarmu' dan 'pemberian-pemberian sukarelamu'.
  rationale: Ayat ini membicarakan hal-hal kudus yang dapat dimakan dan mengelompokkan jenis-jenisnya. Penyebutan 'persembahan' memperjelas rujukan kontekstual, sedangkan catatan kaki mengakui bahwa נדר secara leksikal berarti 'nazar' dan tidak secara eksplisit memuat kata 'persembahan'.
- issue: Makna lokal dari ungkapan 'di gerbang-gerbangmu'
  choice: Menerjemahkan idiom sebagai 'di kota-kotamu' dengan catatan bentuk harfiahnya.
  alternative: Mempertahankan 'di dalam gerbang-gerbangmu' dalam teks utama.
  rationale: Dalam hukum Ulangan, gerbang mewakili kota atau permukiman setempat. Terjemahan idiomatis menghindari kesan bahwa larangan hanya berlaku secara fisik di area gerbang.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-ibadah yang bermartabat. Susunan daftar dibagi dengan titik koma agar kategori-kategorinya mudah dibaca. Sapaan orang kedua tunggal dipertahankan dengan 'kamu', sesuai bentuk Ibrani dan gaya yang mudah dipahami pembaca umum.
