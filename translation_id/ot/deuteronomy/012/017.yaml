    issue: “Gandum” terlalu sempit untuk דָּגָן.
    rationale: דָּגָן merujuk pada hasil biji-bijian/serealia secara umum, bukan hanya gandum.
  - severity: low
    issue: “Atau” di antara ternak sapi dan ternak kambing domba tidak mengikuti konjungsi Ibrani.
    rationale: Teks Ibrani memakai וְ (“dan”). “Dan” juga jelas dalam bahasa Indonesia tanpa mengubah kedua kategori menjadi alternatif.
  - severity: low
    issue: “Anggur baru” dapat dipahami sebagai buah anggur baru dalam pemakaian Indonesia modern.
    rationale: “Air anggur baru” menyampaikan rujukan תִּירוֹשׁ kepada produk anggur cair/anggur baru dengan lebih jelas.
  revised_text: Di kota-kotamu[a] kamu tidak boleh memakan persepuluhan hasil biji-bijianmu, air anggur barumu, atau minyakmu, anak sulung ternak sapimu dan kawanan kambing dombamu, segala persembahan nazar yang kamu nazarkan[b], persembahan sukarelamu, ataupun persembahan dari tanganmu.[c]
