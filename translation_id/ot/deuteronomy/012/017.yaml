revisions:
- from: Di kota-kotamu[a] kamu tidak boleh memakan persepuluhan dari gandummu, anggur barumu, atau minyakmu; anak sulung dari ternak sapimu atau ternak kambing dombamu; segala persembahan nazar yang kamu nazarkan[b]; persembahan sukarelamu; ataupun persembahan dari tanganmu.[c]
  to: Di kota-kotamu[a] kamu tidak boleh memakan persepuluhan hasil biji-bijianmu, air anggur barumu, atau minyakmu, anak sulung ternak sapimu dan kawanan kambing dombamu, segala persembahan nazar yang kamu nazarkan[b], persembahan sukarelamu, ataupun persembahan dari tanganmu.[c]
  rationale: Revisi membetulkan penyempitan arti דָּגָן dan mengganti “atau” dengan “dan” sesuai koordinasi Ibrani antara ternak sapi dan kawanan kambing domba. “Air anggur baru” memperjelas bahwa תִּירוֹשׁ bukan buah anggur. Penafsiran kontekstual “persembahan nazar” dipertahankan secara hati-hati dan diberi catatan harfiah.
