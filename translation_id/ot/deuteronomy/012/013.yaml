  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּֽן תַּעֲלֶ֖ה עֹלֹתֶ֑י/ךָ בְּ/כָל מָק֖וֹם אֲשֶׁ֥ר תִּרְאֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/013.yaml
  text: Be careful lest you offer up your burnt offerings in any place that you see;[a]
translation:
  language: id
  text: Berhati-hatilah, jangan sampai kamu mempersembahkan kurban bakaranmu di sembarang tempat yang kamu lihat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Waspadalah agar kamu tidak mempersembahkan kurban bakaranmu di setiap tempat yang kamu lihat.”'
    reason: Alternatif ini mempertahankan arti distributif yang lebih harfiah dari בְּכָל מָקוֹם serta rumusan peringatan yang lebih formal.
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Berhati-hatilah
  rationale: Bentuk imperatif nifal dengan pronomina datif merupakan rumusan peringatan. Pilihan ini alami dalam bahasa Indonesia modern dan mempertahankan daya perintahnya.
- source_word: פֶּן
  choice: jangan sampai
  rationale: Partikel ini memperkenalkan akibat atau tindakan yang hendak dicegah dalam suatu peringatan negatif.
- source_word: תַּעֲלֶה
  choice: mempersembahkan
  rationale: Bentuk hifil dari עלה secara harfiah berarti 'membuat naik', tetapi dalam konteks ibadah menunjuk pada tindakan mempersembahkan kurban di atas mazbah.
- source_word: עֹלֹתֶיךָ
  choice: kurban bakaranmu
  rationale: עֹלָה adalah istilah baku untuk kurban yang dibakar di atas mazbah; 'kurban bakaran' merupakan padanan Indonesia yang jelas dan mapan.
- source_word: בְּכָל מָקוֹם
  choice: di sembarang tempat
  rationale: Dalam cakupan larangan, frasa ini melarang pemilihan lokasi secara bebas. 'Sembarang tempat' menyampaikan fungsi idiomatis tersebut tanpa menghilangkan gagasan ketidakterbatasan tempat.
- source_word: אֲשֶׁר תִּרְאֶה
  choice: yang kamu lihat
  rationale: Terjemahan ini mempertahankan ungkapan konkret bahasa Ibrani dan tidak menambahkan gagasan 'memilih' yang hanya tersirat oleh konteks.
theological_decisions:
- issue: Bahasa pemusatan tempat ibadah
  choice: Menerjemahkan ayat sebagai larangan mempersembahkan kurban bakaran di lokasi mana pun yang ditentukan sendiri.
  alternative: Memperluasnya menjadi larangan umum atas segala bentuk ibadah di luar tempat ibadah pusat.
  rationale: Ayat ini secara eksplisit menyebut kurban bakaran dan tempat yang dilihat orang itu. Konteks yang lebih luas mendukung pemusatan ibadah, tetapi terjemahan ayat ini tidak boleh melampaui cakupan leksikalnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk tunggal 'kamu' mengikuti pronomina tunggal dalam teks Ibrani. 'Berhati-hatilah, jangan sampai' dipilih sebagai rumusan peringatan alami, sedangkan catatan kaki mencatat alternatif yang lebih formal dan lebih harfiah.
