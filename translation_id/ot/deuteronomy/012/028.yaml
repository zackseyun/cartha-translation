language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שְׁמֹ֣ר וְ/שָׁמַעְתָּ֗ אֵ֚ת כָּל הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֑/ךָּ לְמַעַן֩ יִיטַ֨ב לְ/ךָ֜ וּ/לְ/בָנֶ֤י/ךָ אַחֲרֶ֨י/ךָ֙ עַד עוֹלָ֔ם כִּ֤י תַעֲשֶׂה֙ הַ/טּ֣וֹב וְ/הַ/יָּשָׁ֔ר בְּ/עֵינֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/028.yaml
  text: Be careful to listen to all these words that I am commanding you[a], so that it may go well with you and with your children after you forever[b], because you will do what is good and right in the eyes of Yahweh your God.
translation:
  language: id
  text: Peliharalah dan dengarkanlah segala perkataan ini yang kuperintahkan kepadamu, supaya engkau dan anak-anakmu sesudahmu hidup sejahtera untuk selama-lamanya, sebab engkau akan melakukan apa yang baik dan benar di mata Yahweh, Allahmu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Ibrani: “anak-anak lelaki”; dalam konteks ini kata tersebut dapat mencakup anak-anak atau keturunan secara umum.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמֹר וְשָׁמַעְתָּ
  choice: Dengarkanlah dengan saksama
  rationale: Gabungan imperatif שׁמר dan bentuk וְשָׁמַעְתָּ menuntut perhatian yang cermat serta pendengaran yang mengarah pada ketaatan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kedua unsur tanpa terjemahan harfiah yang kaku.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: segala perkataan ... ini
  rationale: דברים secara harfiah berarti 'perkataan-perkataan' dan di sini menunjuk pada ketetapan yang disampaikan Musa; 'segala perkataan ... ini' mempertahankan gambaran tuturan sumber.
- source_word: מְצַוֶּךָּ
  choice: yang kuperintahkan kepadamu
  rationale: Bentuk partisip menyatakan tindakan Musa yang sedang memberikan perintah. Konstruksi relatif ini lancar dan tepat dalam bahasa Indonesia.
- source_word: לְמַעַן יִיטַב לְךָ
  choice: supaya keadaanmu ... tetap baik
  rationale: Ungkapan perjanjian ini menyatakan kesejahteraan atau keadaan yang baik sebagai hasil. 'Supaya keadaanmu ... tetap baik' lebih alami daripada terjemahan kata demi kata.
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: dan anak-anakmu sesudah engkau
  rationale: בנים dapat berarti anak-anak atau keturunan dalam konteks janji antargenerasi. 'Anak-anakmu' mempertahankan citra kekeluargaan tanpa membatasi maknanya hanya pada anak laki-laki.
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Frasa ini menunjukkan kelangsungan tanpa batas yang ditentukan ke masa depan; padanan Indonesia ini wajar dalam register Kitab Suci.
- source_word: כִּי תַעֲשֶׂה
  choice: karena engkau melakukan
  rationale: כִּי paling langsung dibaca sebagai pemberi alasan bagi kesejahteraan yang disebut sebelumnya. Bentuk imperfek תַעֲשֶׂה dapat dipahami secara prospektif atau sebagai perilaku yang diharapkan; bentuk kini Indonesia tidak memaksakan pembedaan waktu yang tidak tegas dalam sumber.
- source_word: הַטּוֹב וְהַיָּשָׁר
  choice: apa yang baik dan benar
  rationale: Kedua kata sifat dipakai secara substantival. 'Apa yang baik dan benar' alami dan mempertahankan pasangan penilaian moral tersebut.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Padanan ini mempertahankan metafora Ibrani tentang penilaian ilahi dan tetap mudah dipahami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks sumber memakai Tetragramaton sebagai nama diri; 'Yahweh' mempertahankan fungsi tersebut tanpa menggantinya dengan gelar.
- issue: Cakupan בָנֶיךָ
  choice: anak-anakmu
  alternative: anak-anak lelakimu atau keturunanmu
  rationale: Dalam janji perjanjian antargenerasi, bentuk maskulin jamak ini dapat mewakili anak dan penerus keluarga secara umum. 'Anak-anakmu' mempertahankan unsur keluarga tanpa mempersempitnya hanya kepada laki-laki.
- issue: Hubungan כִּי dengan janji kesejahteraan
  choice: karena
  alternative: apabila atau ketika
  rationale: Pembacaan kausal paling langsung menjelaskan dasar bagi keadaan baik yang dijanjikan. Namun, hubungan kontekstualnya tetap mengaitkan kesejahteraan dengan tindakan yang baik dan benar, tanpa menetapkan teori teologis tambahan mengenai jasa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. Bentuk 'kuperintahkan' mempertahankan ucapan langsung Musa secara ringkas. Susunan kalimat dijaga dekat dengan alur Ibrani tanpa menghasilkan ungkapan yang kaku.
