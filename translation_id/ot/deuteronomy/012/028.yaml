    issue: Unsur שְׁמֹר tidak diterjemahkan dalam teks utama.
    rationale: “Dengarkanlah dengan saksama” terutama mencakup שָׁמַע. Seruan untuk menjaga/memelihara, yakni memperhatikan dan menjalankan dengan saksama, perlu tampak dalam terjemahan utama.
  - severity: medium
    issue: Klausa tentang kesejahteraan kurang jelas.
    rationale: Frasa “keadaanmu dan anak-anakmu sesudah engkau tetap baik” dapat memberi kesan bahwa “anak-anakmu” adalah pelengkap bagi “keadaanmu”. Sumber menyatakan kesejahteraan bagi engkau dan anak-anakmu sesudahmu.
  - severity: low
