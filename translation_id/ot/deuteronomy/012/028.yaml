revisions:
- from: Dengarkanlah dengan saksama segala perkataan yang kuperintahkan kepadamu ini[a], supaya keadaanmu dan anak-anakmu sesudah engkau tetap baik untuk selama-lamanya[b], karena engkau melakukan apa yang baik dan benar di mata Yahweh, Allahmu.
  to: Peliharalah dan dengarkanlah segala perkataan ini yang kuperintahkan kepadamu, supaya engkau dan anak-anakmu sesudahmu hidup sejahtera untuk selama-lamanya, sebab engkau akan melakukan apa yang baik dan benar di mata Yahweh, Allahmu.[b]
  rationale: Revisi memulihkan kedua verba pembuka Ibrani tanpa mengubah urutan atau hubungan kausal ayat. Klausa tujuan dibuat idiomatis dalam bahasa Indonesia sambil mempertahankan cakupan antargenerasi dan durasi “untuk selama-lamanya.” Bentuk prospektif “akan melakukan” mencerminkan imperfek Ibrani dengan baik dalam konteks ini. Catatan kaki a dihapus karena padanan langsungnya kini dipakai dalam teks utama, sedangkan catatan kaki b dipertahankan untuk menjelaskan cakupan istilah Ibrani.
