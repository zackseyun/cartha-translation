  yaml_path: translation/ot/deuteronomy/012/019.yaml
  text: Be careful that you do not forsake the Levite all your days on your land[a][b].
translation:
  language: id
  text: Berhati-hatilah, jangan sampai engkau menelantarkan orang Lewi[a] sepanjang hidupmu di tanahmu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kaum Lewi”; bahasa Ibrani memakai bentuk tunggal “orang Lewi,” kemungkinan sebagai sebutan representatif bagi golongan Lewi.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di atas tanahmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Berhati-hatilah
  rationale: Bentuk imperatif Nifal dengan לְךָ merupakan ungkapan peringatan agar seseorang menjaga diri. “Berhati-hatilah” menyampaikan daya perintahnya secara wajar dalam bahasa Indonesia modern.
- source_word: פֶּן
  choice: jangan sampai
  rationale: Kata ini memperkenalkan hal negatif yang harus diwaspadai. “Jangan sampai” mempertahankan nuansa peringatan, bukan sekadar larangan biasa.
- source_word: תַּעֲזֹב
  choice: menelantarkan
  rationale: Kata עזב dapat berarti meninggalkan atau membiarkan. Dalam konteks kewajiban sosial terhadap orang Lewi, “menelantarkan” secara alami menyatakan tindakan membiarkannya tanpa perhatian atau dukungan yang semestinya.
- source_word: אֶת הַלֵּוִי
  choice: orang Lewi
  rationale: Teks Ibrani memakai bentuk tunggal dengan kata sandang. “Orang Lewi” mempertahankan bentuk tunggal representatif yang menunjuk pada anggota golongan Lewi.
- source_word: כָּל יָמֶיךָ
  choice: sepanjang hidupmu
  rationale: Secara harfiah berarti “seluruh hari-harimu.” Ungkapan “sepanjang hidupmu” menyampaikan cakupan waktunya dengan jelas dan alami tanpa mengubah makna.
- source_word: עַל אַדְמָתֶךָ
  choice: di tanahmu
  rationale: אַדָמָה berarti tanah atau wilayah, sedangkan עַל secara dasar berarti “di atas.” Dalam bahasa Indonesia, “di tanahmu” adalah bentuk idiomatis untuk keberadaan atau kehidupan di wilayah tersebut.
theological_decisions:
- issue: Bentuk tunggal representatif untuk orang Lewi
  choice: orang Lewi
  alternative: kaum Lewi
  rationale: Bahasa Ibrani menggunakan nomina tunggal dengan kata sandang, kemungkinan sebagai bentuk tunggal representatif bagi golongan Lewi. Terjemahan mempertahankan bentuk itu tanpa membatasi perintah kepada hanya satu individu tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan tunggal “engkau” mengikuti bentuk orang kedua tunggal dalam teks Ibrani. Susunan “jangan sampai” mempertahankan nada peringatan, sedangkan “menelantarkan” menonjolkan kewajiban nyata untuk tidak membiarkan orang Lewi tanpa perhatian dan dukungan.
