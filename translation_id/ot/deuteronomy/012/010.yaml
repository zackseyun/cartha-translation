  text: וַ/עֲבַרְתֶּם֮ אֶת הַ/יַּרְדֵּן֒ וִֽ/ישַׁבְתֶּ֣ם בָּ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם מַנְחִ֣יל אֶתְ/כֶ֑ם וְ/הֵנִ֨יחַ לָ/כֶ֧ם מִ/כָּל אֹיְבֵי/כֶ֛ם מִ/סָּבִ֖יב וִֽ/ישַׁבְתֶּם בֶּֽטַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/010.yaml
  text: But when you cross the Jordan and live in the land that Yahweh your God is giving you to inherit[a], and he gives you rest from all your enemies around you, then you will live in safety.
translation:
  language: id
  text: Tetapi, ketika kalian menyeberangi Sungai Yordan dan menetap di negeri yang Yahweh, Allah kalian, berikan kepada kalian sebagai warisan, Ia akan memberi kalian kelegaan dari semua musuh di sekeliling kalian, dan kalian akan hidup dengan aman.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akan tinggal dengan tenteram.”
    reason: Alternatif ini mencerminkan secara lebih harfiah gabungan יָשַׁב (“tinggal”) dan בֶּטַח (“dengan aman/tenteram”).
lexical_decisions:
- source_word: וַעֲבַרְתֶּם
  choice: Kalian akan menyeberangi
  rationale: Bentuk ini melanjutkan rangkaian yang berorientasi pada masa depan. Dalam bahasa Indonesia, bentuk futur dengan “akan” menyampaikan urutannya secara alami tanpa harus mempertahankan kata sambung secara kaku.
- source_word: הַיַּרְדֵּן
  choice: Sungai Yordan
  rationale: Nama geografis ini secara lazim merujuk pada Sungai Yordan; penyebutan “Sungai” membuat acuannya jelas bagi pembaca Indonesia.
- source_word: וִישַׁבְתֶּם
  choice: menetap
  rationale: Kata יָשַׁב di sini menunjuk pada tinggal secara menetap di negeri itu, bukan sekadar duduk atau singgah.
- source_word: בָּאָרֶץ
  choice: di negeri
  rationale: “Negeri” mempertahankan makna wilayah yang dijanjikan dan diwariskan kepada Israel serta terdengar alami dalam konteks geografis-politik ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi diterjemahkan secara langsung sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: מַנְחִיל אֶתְכֶם
  choice: berikan kepada kalian sebagai warisan
  rationale: Bentuk Hifil dari נחל menyatakan tindakan membuat seseorang menerima milik warisan. Rumusan ini mempertahankan prakarsa ilahi dan nuansa warisan dalam bahasa Indonesia yang wajar.
- source_word: וְהֵנִיחַ לָכֶם
  choice: Ia akan memberi kalian kelegaan
  rationale: Bentuk Hifil dari נוח berarti memberi istirahat, ketenteraman, atau kelegaan. “Memberi ... kelegaan” mempertahankan motif pemberian ketenangan dari tekanan musuh.
- source_word: מִכָּל אֹיְבֵיכֶם מִסָּבִיב
  choice: dari semua musuh di sekeliling kalian
  rationale: Terjemahan ini mempertahankan cakupan menyeluruh “semua” dan gambaran spasial bahwa musuh-musuh berada di sekitar mereka.
- source_word: וִישַׁבְתֶּם בֶּטַח
  choice: kalian akan hidup dengan aman
  rationale: בֶּטַח menyatakan keadaan aman atau tenteram. “Hidup dengan aman” alami dalam bahasa Indonesia dan sesuai dengan konteks keamanan dari musuh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi secara langsung. “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Nuansa warisan dalam מַנְחִיל אֶתְכֶם
  choice: berikan kepada kalian sebagai warisan
  alternative: membuat kalian mewarisi
  rationale: Pilihan utama mempertahankan bahwa negeri itu merupakan pemberian Allah sekaligus warisan, tanpa menyiratkan bahwa Allah wafat seperti seorang pewaris manusia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti jamak “kalian” dipakai untuk mencerminkan bentuk orang kedua jamak dalam bahasa Ibrani. Struktur kalimat mengikuti rangkaian tindakan masa depan dalam teks sumber, dengan pemenggalan menjadi dua kalimat agar jelas bagi pembaca modern.
