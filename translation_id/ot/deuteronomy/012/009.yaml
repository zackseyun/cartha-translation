  yaml_path: translation/ot/deuteronomy/012/009.yaml
  text: For you have not yet come to the resting place and to the inheritance that Yahweh your God is giving you[a].
translation:
  language: id
  text: Sebab sampai sekarang kalian belum mencapai tempat peristirahatan[a] dan warisan yang Yahweh, Allah kalian, sedang berikan kepada kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “peristirahatan.” Kata Ibrani מְנוּחָה dapat berarti keadaan beristirahat atau tempat beristirahat; dalam konteks masuk ke negeri, makna tempat lebih mungkin.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menghubungkan ayat ini sebagai alasan bagi perintah sebelumnya dan mempertahankan daya kausalnya.
- source_word: בָּאתֶם
  choice: kalian ... tiba
  rationale: בוא dapat berarti datang, masuk, atau tiba. Dengan frasa tujuan yang mengikutinya, “tiba” terdengar alami tanpa mempersempit maknanya menjadi tindakan memasuki wilayah.
- source_word: עַד עָתָּה
  choice: sampai sekarang ... belum
  rationale: Bersama penyangkalan לֹא, frasa ini menyatakan bahwa hal tersebut belum terjadi hingga saat pembicaraan.
- source_word: הַמְּנוּחָה
  choice: tempat peristirahatan
  rationale: מְנוּחָה dapat menunjuk pada keadaan beristirahat atau tempat beristirahat. Konteks masuk ke negeri mendukung pengertian tempat tujuan, sedangkan catatan kaki mempertahankan alternatif abstraknya.
- source_word: הַנַּחֲלָה
  choice: warisan
  rationale: נַחֲלָה menunjuk pada milik yang diwariskan atau dianugerahkan, khususnya negeri pemberian Allah. “Warisan” mempertahankan unsur pemberian dan hak milik tanpa menambahkan kata “tanah” ke teks utama.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: נֹתֵן
  choice: sedang diberikan
  rationale: Bentuk partisip Ibrani menggambarkan pemberian sebagai tindakan yang sedang berlangsung atau segera terwujud dari sudut pandang pembicara.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankannya sebagai nama perjanjian Allah.
- issue: Makna מְנוּחָה dalam konteks janji negeri
  choice: tempat peristirahatan
  alternative: peristirahatan
  rationale: Konstruksi dengan verba gerak dan konteks masuk ke negeri mendukung makna konkret, tetapi kemungkinan makna keadaan tetap dicatat agar ketegangan leksikal tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Sapaan jamak Ibrani diterjemahkan dengan “kalian”; akhiran orang kedua tunggal kolektif pada “Allahmu” dan “kepadamu” dinaturalisasi sebagai jamak agar rujukannya jelas dalam bahasa Indonesia.
