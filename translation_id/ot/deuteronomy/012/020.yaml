base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/020.yaml
  text: When the LORD your God enlarges your territory, as he has promised you, and you say, “I want to eat meat,” because you crave to eat meat, you may eat meat according to all the desire of your soul.
translation:
  language: id
  text: Apabila TUHAN, Allahmu, memperluas wilayahmu seperti yang telah dijanjikan-Nya kepadamu, dan engkau berkata, “Aku ingin makan daging,” karena engkau ingin sekali makan daging, engkau boleh makan daging sepuas keinginanmu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַרְחִיב ... אֶת־גְּבוּלְךָ
  choice: memperluas wilayahmu
  rationale: Ungkapan ini secara harfiah menunjuk pada perluasan batas daerah; ‘memperluas wilayahmu’ alami dalam bahasa Indonesia dan tetap mempertahankan makna geografisnya.
- source_word: וְאָמַרְתָּ אֹכְלָה בָשָׂר
  choice: dan engkau berkata, “Aku ingin makan daging”
  rationale: Bentuk kohortatif אֹכְלָה dalam konteks ini menyatakan kehendak atau hasrat, bukan sekadar pernyataan tentang tindakan pada masa depan.
- source_word: תְאַוֶּה נַפְשְׁךָ
  choice: engkau ingin sekali
  rationale: Secara idiomatis berarti diri atau hasrat seseorang sangat menginginkan sesuatu. Terjemahan ini menghindari ungkapan Indonesia yang kaku seperti ‘jiwamu menginginkan’ tanpa menghilangkan intensitas hasrat.
- source_word: בְּכָל־אַוַּת נַפְשְׁךָ
  choice: sepuas keinginanmu
  rationale: Ungkapan ini menyatakan kebebasan makan daging sebanyak atau kapan pun yang diinginkan dalam cakupan izin ayat; bentuk Indonesia ini alami dan ringkas.
theological_decisions:
- issue: Representasi nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH atau Yahweh
  rationale: Memakai bentuk tradisional Indonesia ‘TUHAN’ dengan huruf kapital, selaras dengan register Alkitab Indonesia dan tanpa memasukkan pelafalan nama ilahi yang diperdebatkan.
- issue: Cakupan izin makan daging
  choice: engkau boleh makan daging sepuas keinginanmu
  alternative: engkau boleh makan daging sesuai dengan segala keinginan jiwamu
  rationale: Ayat memberi izin umum dalam konteks perluasan wilayah. Terjemahan tidak menambahkan pembatas atau kebebasan teologis di luar yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kata ganti tunggal ‘engkau’ mempertahankan sapaan orang kedua tunggal Ibrani. Pengulangan ‘makan daging’ dipertahankan karena menonjol dalam teks sumber, sedangkan idiom נֶפֶשׁ diterjemahkan secara alami menurut konteks.
