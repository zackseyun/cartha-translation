  text: וַ/הֲבֵאתֶ֣ם שָׁ֗מָּ/ה עֹלֹֽתֵי/כֶם֙ וְ/זִבְחֵי/כֶ֔ם וְ/אֵת֙ מַעְשְׂרֹ֣תֵי/כֶ֔ם וְ/אֵ֖ת תְּרוּמַ֣ת יֶדְ/כֶ֑ם וְ/נִדְרֵי/כֶם֙ וְ/נִדְבֹ֣תֵי/כֶ֔ם וּ/בְכֹרֹ֥ת בְּקַרְ/כֶ֖ם וְ/צֹאנְ/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/006.yaml
  text: And there you shall bring your burnt offerings[a], your sacrifices, your tithes, the contribution of your hand, your vow offerings, your freewill offerings[b], and the firstborn of your herd and of your flock.
translation:
  language: id
  text: Ke sanalah harus kamu bawa persembahan bakaranmu, kurban sembelihanmu, persembahan persepuluhanmu, persembahan dari tanganmu,[a] persembahan nazarmu,[b] persembahan sukarelamu, serta anak-anak sulung dari ternak sapimu dan kambing dombamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “persembahan tanganmu.” Ungkapan Ibrani mempertahankan gambaran tentang sesuatu yang diserahkan sendiri; dapat juga diterjemahkan “persembahanmu.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “nazarmu”; dalam konteks ini kemungkinan yang dimaksud ialah persembahan yang dibawa untuk memenuhi nazar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲבֵאתֶם
  choice: harus kamu bawa
  rationale: Bentuk Hifil dari בוא dalam ketentuan hukum menyatakan kewajiban membawa benda-benda tersebut ke tempat yang telah ditentukan; ungkapan ini alami dan tegas dalam bahasa Indonesia.
- source_word: שָׁמָּה
  choice: ke sanalah
  rationale: Adverbia ini menunjuk ke lokasi ibadah yang disebut sebelumnya. Bentuk berpartikel -lah mempertahankan penekanan lokatif Ibrani tanpa mengulang 'tempat itu'.
- source_word: עֹלֹתֵיכֶם
  choice: persembahan bakaranmu
  rationale: עוֹלָה adalah istilah kurban yang dibakar seluruhnya; 'persembahan bakaran' merupakan padanan teknis yang jelas dan lazim.
- source_word: זִבְחֵיכֶם
  choice: kurban sembelihanmu
  rationale: זֶבַח menunjuk pada kurban yang disembelih dan di sini dibedakan dari persembahan bakaran. Padanan ini mempertahankan pembedaan tersebut.
- source_word: מַעְשְׂרֹתֵיכֶם
  choice: persembahan persepuluhanmu
  rationale: Kata ini menunjuk pada bagian sepersepuluh yang dipersembahkan; frasa ini jelas bagi pembaca modern dan mempertahankan sifat kultisnya.
- source_word: תְּרוּמַת יֶדְכֶם
  choice: persembahan dari tanganmu
  rationale: תְּרוּמָה berarti sumbangan atau persembahan yang dikhususkan. 'Dari tanganmu' mempertahankan citra Ibrani mengenai apa yang secara pribadi diserahkan, tanpa memakai ungkapan Indonesia yang kaku.
- source_word: נִדְרֵיכֶם
  choice: persembahan nazarmu
  rationale: Secara harfiah kata ini berarti 'nazarmu', tetapi dalam daftar benda yang dibawa ke tempat ibadah, acuannya kemungkinan adalah persembahan yang terkait dengan pemenuhan nazar.
- source_word: נִדְבֹתֵיכֶם
  choice: persembahan sukarelamu
  rationale: Kata ini menunjuk pada pemberian sukarela yang tidak diwajibkan oleh nazar; padanan ini membedakannya dari persembahan nazar.
- source_word: בְכֹרֹת בְּקַרְכֶם וְצֹאנְכֶם
  choice: anak sulung dari kawanan sapi dan kawanan kambing dombamu
  rationale: בְּקָר menunjuk pada ternak besar, terutama sapi, sedangkan צֹאן mencakup ternak kecil berupa domba dan kambing. Padanan eksplisit ini lebih jelas daripada sekadar 'ternak besar dan kecil'.
theological_decisions:
- issue: Apakah נִדְרֵיכֶם berarti nazar yang diucapkan atau persembahan yang menyertainya
  choice: persembahan nazarmu
  alternative: nazarmu
  rationale: Konteksnya adalah daftar benda yang harus dibawa ke tempat ibadah, sehingga persembahan dalam pemenuhan nazar paling mungkin dimaksud. Catatan kaki mempertahankan kemungkinan terjemahan harfiahnya.
translation_notes:
  register: 'Bahasa Indonesia baku, modern, dan bermartabat. Istilah kultis dibedakan dengan jelas: ''persembahan bakaran'', ''kurban sembelihan'', ''persembahan nazar'', dan ''persembahan sukarela''. Bentuk tunggal kolektif dengan enklitik -mu mengikuti sapaan Ibrani jamak secara alami dalam gaya hukum Indonesia.'
