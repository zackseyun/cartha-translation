  text: וַ/אֲכַלְתֶּם שָׁ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וּ/שְׂמַחְתֶּ֗ם בְּ/כֹל֙ מִשְׁלַ֣ח יֶדְ/כֶ֔ם אַתֶּ֖ם וּ/בָתֵּי/כֶ֑ם אֲשֶׁ֥ר בֵּֽרַכְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/007.yaml
  text: And there you shall eat before Yahweh your God[a], and you shall rejoice in all the work of your hand, you and your households, with which Yahweh your God has blessed you.
translation:
  language: id
  text: Di sana kalian harus makan di hadapan Yahweh, Allah kalian, dan bersukacita atas segala usaha kalian[a]—kalian dan seisi rumah kalian—yang dengannya Yahweh, Allahmu, telah memberkatimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “atas segala sesuatu yang kalian lakukan.” Secara harfiah, “dalam segala penguluran tangan kalian,” sebuah ungkapan Ibrani untuk segala usaha atau pekerjaan yang dilakukan seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם
  choice: kalian harus makan
  rationale: Bentuk perfektum dengan waw dalam konteks hukum-instruksional ini menyatakan tindakan yang diperintahkan; “harus” menyampaikan daya instruksional secara wajar dalam bahasa Indonesia.
- source_word: שָׁם
  choice: di sana
  rationale: Mempertahankan rujukan deiktis kepada tempat yang akan dipilih Yahweh dalam konteks sekitarnya.
- source_word: לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: di hadapan Yahweh, Allah kalian
  rationale: “Di hadapan” secara alami menyatakan kegiatan peribadatan dalam kehadiran Allah; nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh”.
- source_word: וּשְׂמַחְתֶּם
  choice: dan bersukacita
  rationale: Mempertahankan kesejajaran instruksional dengan tindakan makan dan tema sukacita perjanjian.
- source_word: בְּכֹל מִשְׁלַח יֶדְכֶם
  choice: atas segala yang kalian kerjakan
  rationale: Ungkapan harfiahnya adalah “dalam setiap penguluran tangan kalian,” sebuah idiom bagi segala usaha atau pekerjaan. Terjemahan ini alami sekaligus cukup luas untuk mencakup usaha dan hasilnya.
- source_word: אַתֶּם וּבָתֵּיכֶם
  choice: kalian dan seisi rumah kalian
  rationale: בָּתִּים di sini menunjuk kepada satuan rumah tangga, bukan bangunan; “seisi rumah” menyampaikan cakupan komunalnya dengan alami.
- source_word: אֲשֶׁר בֵּרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: karena Yahweh, Allahmu, telah memberkatimu
  rationale: אֲשֶׁר dapat memperkenalkan dasar sukacita dalam konteks ini. Bentuk orang kedua tunggal pada “Allahmu” dan “memberkatimu” dipertahankan untuk mencerminkan peralihan Ibrani dari sapaan jamak kepada Israel sebagai satu kesatuan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks menggunakan Tetragramaton sebagai nama pribadi Allah; transliterasi “Yahweh” mempertahankan nama perjanjian tersebut tanpa menggantinya dengan gelar.
- issue: Peralihan sapaan jamak ke tunggal
  choice: Mempertahankan “kalian” pada bagian awal dan “Allahmu/memberkatimu” pada klausa akhir
  alternative: Menyeragamkan seluruh sapaan menjadi jamak atau tunggal
  rationale: Peralihan ini terdapat dalam teks Ibrani dan mencerminkan cara Ulangan menyapa Israel sekaligus sebagai banyak orang dan sebagai satu kesatuan; menyeragamkannya akan meratakan retorika sumber.
- issue: Hubungan klausa אֲשֶׁר בֵּרַכְךָ
  choice: karena Yahweh, Allahmu, telah memberkatimu
  alternative: yang dengannya Yahweh, Allahmu, telah memberkatimu
  rationale: Konstruksinya dapat dipahami secara kausal atau relatif. Bacaan kausal menghasilkan bahasa Indonesia yang lebih alami dan sesuai dengan berkat sebagai alasan bersukacita, sementara ambiguitas idiom pekerjaan dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku-modern dengan nada khidmat tetapi mudah dipahami. “Kalian” dipakai untuk sapaan jamak yang jelas, sedangkan bentuk tunggal pada akhir ayat sengaja dipertahankan. Tanda pisah menandai sisipan “kalian dan seisi rumah kalian” agar alur kalimat tetap jelas.
