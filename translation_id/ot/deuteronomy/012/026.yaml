id: DEU.12.26
reference: Deuteronomy 12:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: רַ֧ק קָֽדָשֶׁ֛י/ךָ אֲשֶׁר יִהְי֥וּ לְ/ךָ֖ וּ/נְדָרֶ֑י/ךָ תִּשָּׂ֣א וּ/בָ֔אתָ אֶל הַ/מָּק֖וֹם אֲשֶׁר יִבְחַ֥ר יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/012/026.yaml
  text: But only your holy things that belong to you[a], and your vow offerings, you shall carry and come to the place that Yahweh will choose.
translation:
  language: id
  text: Namun, hanya hal-hal kudusmu yang kaubawa dan persembahan nazarmu[a] hendaklah kaubawa ke tempat yang akan dipilih Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “nazar-nazarmu”; kata Ibrani ini dapat menunjuk pada nazar itu sendiri atau, dalam konteks persembahan korban, pada persembahan yang dibawa untuk memenuhi nazar tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Namun, hanya
  rationale: Menandai pembatasan yang berlawanan dengan izin sebelumnya untuk menyembelih dan memakan daging di tempat tinggal masing-masing.
- source_word: קָדָשֶׁיךָ אֲשֶׁר יִהְיוּ לְךָ
  choice: barang-barang kudusmu yang ada padamu
  rationale: Mempertahankan cakupan umum benda-benda yang dikhususkan sebagai kudus serta penegasan bahwa benda-benda itu berada pada atau menjadi tanggung jawab orang tersebut.
- source_word: וּנְדָרֶיךָ
  choice: dan persembahan nazarmu
  rationale: Dalam konteks ibadah korban, bentuk harfiah 'nazar-nazarmu' dapat menunjuk secara konkret kepada persembahan yang dibawa untuk memenuhi nazar; catatan kaki mempertahankan kemungkinan arti harfiahnya.
- source_word: תִּשָּׂא
  choice: harus kaubawa
  rationale: Kata kerja ini secara harfiah berarti mengangkat atau membawa dan di sini menunjuk pada pengangkutan benda-benda kudus ke tempat ibadah pusat.
- source_word: וּבָאתָ
  choice: lalu engkau harus datang
  rationale: Mempertahankan tindakan kedua dalam teks Ibrani, yakni datang ke tempat yang dipilih, tanpa meleburkannya sepenuhnya ke dalam kata 'membawa'.
- source_word: הַמָּקוֹם
  choice: tempat
  rationale: Padanan langsung bagi ungkapan khas dalam Ulangan mengenai lokasi ibadah yang ditetapkan Allah.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: yang akan dipilih Yahweh
  rationale: Bentuk verba bersifat prospektif dalam rumusan Ulangan ini, sedangkan nama ilahi dipertahankan sebagai Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung; 'Yahweh' mempertahankan nama itu dan sesuai dengan lapisan konsultasi yang diberikan.
- issue: Makna נְדָרֶיךָ dalam konteks korban
  choice: persembahan nazarmu
  alternative: nazar-nazarmu
  rationale: Konteks menuntut sesuatu yang dapat dibawa ke tempat ibadah, sehingga ungkapan itu kemungkinan menunjuk pada persembahan untuk memenuhi nazar. Namun, bentuk leksikalnya tetap dapat berarti nazar itu sendiri; ambiguitas ini dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Susunan objek di depan dipertahankan untuk mencerminkan penekanan pembatasan dalam bahasa Ibrani, sementara 'lalu' membuat urutan dua tindakan tetap alami dalam bahasa Indonesia.
