- from: 'Kemudian aku memilih para kepala suku kalian—orang-orang yang bijaksana dan berpengetahuan[a]—lalu mengangkat mereka menjadi kepala atas kalian: pemimpin atas seribu orang, pemimpin atas seratus orang, pemimpin atas lima puluh orang, pemimpin atas sepuluh orang, serta para petugas bagi suku-suku kalian.'
