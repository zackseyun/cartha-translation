base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/015.yaml
  text: 'So I took the heads of your tribes[a], wise and knowledgeable men, and appointed them as heads over you: commanders of thousands, commanders of hundreds, commanders of fifties, commanders of tens, and officers for your tribes.'
translation:
  language: id
  text: 'Kemudian aku mengambil para kepala suku kalian—orang-orang yang bijaksana dan terkenal[a]—lalu mengangkat mereka menjadi pemimpin atas kalian: pemimpin atas seribu orang, pemimpin atas seratus orang, pemimpin atas lima puluh orang, pemimpin atas sepuluh orang, serta para petugas bagi suku-suku kalian.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang dikenal.” Kata Ibrani ini secara harfiah dapat berarti orang-orang yang dikenal atau diakui; sebagian memahaminya sebagai orang-orang yang berpengetahuan atau cakap.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: Kemudian aku memilih
  rationale: Bentuk naratif ini melanjutkan urutan tindakan. Dalam konteks pengangkatan pemimpin, לקח menyatakan bahwa Musa mengambil orang-orang yang diajukan untuk dijadikan pemimpin; “memilih” menyampaikan tindakan itu secara wajar dalam bahasa Indonesia.
- source_word: רָאשֵׁי שִׁבְטֵיכֶם
  choice: para kepala suku kalian
  rationale: רֹאשׁ menunjuk kepada orang yang berada di pucuk suatu kelompok. “Kepala suku” mempertahankan metafora Ibrani dan cocok dengan pemakaian רָאשִׁים selanjutnya.
- source_word: אֲנָשִׁים חֲכָמִים וִידֻעִים
  choice: orang-orang yang bijaksana dan berpengetahuan
  rationale: חֲכָמִים menyatakan hikmat praktis yang diperlukan dalam kepemimpinan. וִידֻעִים mungkin menyatakan pengetahuan atau kecakapan yang diakui; “berpengetahuan” paling sesuai dengan konteks pemilihan pemimpin, sementara kemungkinan “dikenal” dicatat dalam catatan kaki.
- source_word: וָאֶתֵּן אֹתָם רָאשִׁים עֲלֵיכֶם
  choice: lalu mengangkat mereka menjadi kepala atas kalian
  rationale: נתן dengan objek dan pelengkap menyatakan pengangkatan ke suatu jabatan. “Mengangkat” menjelaskan tindakan administratif itu, sedangkan “kepala atas kalian” mempertahankan gambaran dan pengulangan dalam bahasa Ibrani.
- source_word: שָׂרֵי אֲלָפִים ... שָׂרֵי עֲשָׂרֹת
  choice: pemimpin atas seribu orang ... pemimpin atas sepuluh orang
  rationale: שַׂר adalah pejabat yang memiliki wewenang. “Pemimpin” tidak membatasi jabatan ini hanya pada ranah militer, dan pengulangan lengkap mempertahankan susunan bertingkat dalam teks sumber.
- source_word: וְשֹׁטְרִים לְשִׁבְטֵיכֶם
  choice: serta para petugas bagi suku-suku kalian
  rationale: שֹׁטֵר menunjuk kepada pejabat bawahan dengan fungsi administratif atau pelaksana. “Petugas” cukup luas untuk tidak menentukan fungsi yang tidak dijelaskan oleh ayat ini.
