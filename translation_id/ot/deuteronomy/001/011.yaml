base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/011.yaml
  text: May Yahweh[a], the God of your fathers, make you a thousand times as many as you are, and bless you[b], just as he has promised you.
translation:
  language: id
  text: Kiranya Yahweh, Allah nenek moyang kalian, menambah jumlah kalian seribu kali sebanyak jumlah kalian sekarang dan memberkati kalian, seperti yang telah difirmankan-Nya kepada kalian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: Allah nenek moyang kalian
  rationale: Ungkapan ini menunjuk kepada Allah yang disembah para leluhur Israel. 'Nenek moyang' merupakan ungkapan alami dalam bahasa Indonesia dan tetap mempertahankan hubungan historis-perjanjian.
- source_word: יֹסֵף עֲלֵיכֶם כָּכֶם אֶלֶף פְּעָמִים
  choice: membuat jumlah kalian seribu kali lipat dari sekarang
  rationale: Bentuk verba menyatakan harapan atau berkat agar jumlah umat bertambah. Rumusan ini menyampaikan perbandingan dengan jumlah mereka saat itu secara alami dan jelas.
- source_word: וִיבָרֵךְ אֶתְכֶם
  choice: dan memberkati kalian
  rationale: Konjungsi melanjutkan harapan yang diawali oleh 'Kiranya'; pengulangan 'kiranya' tidak diperlukan dalam bahasa Indonesia.
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: seperti yang telah difirmankan-Nya kepada kalian
  rationale: Mempertahankan arti dasar דבר, 'berbicara/berfirman', tanpa mempersempitnya menjadi 'berjanji'. Bentuk hormat '-Nya' wajar bagi rujukan kepada Allah.
theological_decisions:
- issue: Penerjemahan nama יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Cakupan אֲבֹתֵיכֶם
  choice: nenek moyang kalian
  alternative: bapa-bapa kalian; leluhur kalian
  rationale: Dalam konteks perjanjian, bentuk maskulin Ibrani merujuk kepada para pendahulu Israel, khususnya para bapa leluhur. 'Nenek moyang' adalah idiom Indonesia yang alami tanpa meniadakan kaitan itu.
- issue: Daya makna דִּבֶּר
  choice: telah difirmankan-Nya kepada kalian
  alternative: telah dijanjikan-Nya kepada kalian
  rationale: Konteks memungkinkan nuansa janji, tetapi verba Ibrani sendiri lebih luas, yakni 'berbicara'. Terjemahan mempertahankan keluasan dan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti jamak 'kalian' dipakai agar sasaran jamak tampak jelas; susunan kalimat dibuat alami bagi pembaca umum tanpa menghilangkan bentuk berkat dan perbandingan numeriknya.
