  text: How can I alone bear your trouble[a], your burden, and your disputes?
translation:
  language: id
  text: Bagaimana aku seorang diri dapat menanggung kesulitanmu, bebanmu, dan perselisihanmu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pertengkaranmu,” “sengketa-sengketamu,” atau “perkara-perkaramu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָה
  choice: Bagaimana ... dapat
  rationale: Menyampaikan pertanyaan retoris yang mengungkapkan beratnya atau ketidakmungkinan tugas itu dalam bahasa Indonesia yang alami.
- source_word: אֶשָּׂא
  choice: menanggung
  rationale: Kata נשׂא di sini berarti memikul tanggung jawab; 'menanggung' cocok dengan ketiga nomina abstrak yang menjadi objeknya.
- source_word: לְבַדִּי
  choice: aku seorang diri
  rationale: Mempertahankan penekanan bahwa Musa tidak sanggup menangani semuanya tanpa bantuan.
- source_word: טָרְחֲכֶם
  choice: jerih payahmu
  rationale: טֹרַח menunjuk pada kesusahan, kerepotan, atau kerja melelahkan yang harus ditanggung Musa; pilihan ini membedakannya dari מַשָּׂא yang berikut.
- source_word: מַשַּׂאֲכֶם
  choice: bebanmu
  rationale: מַשָּׂא secara langsung berarti muatan atau beban dan di sini digunakan secara abstrak.
- source_word: רִיבְכֶם
  choice: perselisihanmu
  rationale: רִיב dapat berarti pertikaian, sengketa, atau perkara hukum; 'perselisihan' cukup luas untuk mempertahankan dimensi antarpribadi dan yudisial.
