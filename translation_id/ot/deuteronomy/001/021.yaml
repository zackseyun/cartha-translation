id: DEU.1.21
reference: Deuteronomy 1:21
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: רְ֠אֵה נָתַ֨ן יְהוָ֧ה אֱלֹהֶ֛י/ךָ לְ/פָנֶ֖י/ךָ אֶת הָ/אָ֑רֶץ עֲלֵ֣ה רֵ֗שׁ כַּ/אֲשֶׁר֩ דִּבֶּ֨ר יְהוָ֜ה אֱלֹהֵ֤י אֲבֹתֶ֨י/ךָ֙ לָ֔/ךְ אַל תִּירָ֖א וְ/אַל תֵּחָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/021.yaml
  text: See[a], Yahweh your God has set the land before you. Go up, take possession, just as Yahweh, the God of your fathers, has spoken to you. Do not fear or be dismayed.
translation:
  language: id
  text: Lihatlah, Yahweh, Allahmu, telah menempatkan negeri itu di hadapanmu. Naiklah, ambillah negeri itu menjadi milikmu, sebagaimana yang telah Yahweh, Allah nenek moyangmu[a], katakan kepadamu. Jangan takut dan jangan gentar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Harfiah: “Allah para bapakmu.”'
    reason: Menandai bahwa bahasa Ibrani memakai “bapak-bapakmu” dalam formula perjanjian ini; “nenek moyangmu” dipakai dalam teks utama sebagai padanan Indonesia yang alami.
lexical_decisions:
- source_word: רְאֵה
  choice: Lihatlah
  rationale: Bentuk perintah yang berfungsi menarik perhatian; “Lihatlah” mempertahankan daya langsungnya dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk dengan akhiran orang kedua tunggal maskulin; sapaan tunggal kepada Israel dipertahankan secara alami.
- source_word: נָתַן ... לְפָנֶיךָ
  choice: telah menyerahkan ... kepadamu
  rationale: Ungkapan ini menyatakan bahwa negeri tersebut telah ditempatkan dalam jangkauan Israel sebagai pemberian yang siap dimasuki; “menyerahkan ... kepadamu” menyampaikan maknanya secara idiomatis.
- source_word: הָאָרֶץ
  choice: negeri itu
  rationale: Dalam konteks ini menunjuk pada negeri yang hendak dimasuki Israel; “negeri” lebih alami daripada “tanah” untuk suatu wilayah.
- source_word: עֲלֵה
  choice: Majulah
  rationale: Secara harfiah berarti “naiklah,” tetapi dalam konteks gerak memasuki wilayah pegunungan berfungsi sebagai perintah untuk bergerak maju; pilihan ini wajar dalam bahasa Indonesia.
- source_word: רֵשׁ
  choice: dudukilah
  rationale: Perintah dari ירשׁ mencakup mengambil alih dan menempati negeri. “Dudukilah” menyampaikan tindakan memasuki serta menguasainya tanpa menambahkan gagasan yang tidak dinyatakan.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: seperti yang telah difirmankan
  rationale: Mempertahankan verba “berfirman/berkata” dan tidak mengubahnya menjadi “menjanjikan,” walaupun konteksnya mengandung janji.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: Allah nenek moyangmu
  rationale: Ungkapan perjanjian ini merujuk kepada para leluhur Israel. Dalam bahasa Indonesia, “nenek moyang” adalah padanan umum yang mencakup garis leluhur tanpa mengaburkan rujukan historisnya.
- source_word: אַל תִּירָא
  choice: Jangan takut
  rationale: Padanan langsung dan alami bagi larangan dari ירא.
- source_word: וְאַל תֵּחָת
  choice: dan jangan gentar
  rationale: חתת menyatakan menjadi patah semangat, ciut, atau gentar. “Gentar” mempertahankan perbedaannya dari “takut” sambil membentuk pasangan ungkapan yang alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama perjanjian ilahi secara langsung; transliterasi “Yahweh” mempertahankan nama itu dan membedakannya dari gelar.
- issue: Ungkapan perjanjian אֱלֹהֵי אֲבֹתֶיךָ
  choice: Allah nenek moyangmu
  alternative: Allah para bapakmu; Allah leluhurmu
  rationale: “Nenek moyang” merupakan padanan Indonesia modern yang alami bagi אבות dalam formula ini dan tetap menunjuk kepada para pendahulu historis Israel, tanpa memasukkan penafsiran denominasi tertentu.
- issue: Hubungan pemberian ilahi dan tindakan Israel
  choice: telah menyerahkan negeri itu ... Majulah dan dudukilah
  alternative: telah menempatkan negeri itu di hadapanmu ... naiklah, ambillah menjadi milikmu
  rationale: Terjemahan mempertahankan ketegangan teks antara tindakan Allah yang sudah memberikan negeri dan perintah agar Israel secara aktif masuk serta mendudukinya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung dan bermartabat. Bentuk orang kedua tunggal dipertahankan melalui akhiran -mu karena teks Ibrani menyapa Israel secara kolektif sebagai satu pihak. Tidak diperlukan catatan kaki karena tidak ada alternatif penting yang harus ditampilkan agar ambiguitas sumber tetap terjaga.
