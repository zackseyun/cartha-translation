review_pass:
  verdict: revise
  source_fidelity: Draf secara umum mengikuti struktur dan isi ayat, tetapi “telah menyerahkan ... kepadamu” menggeser idiom נתן ... לפניך dari penempatan ‘di hadapanmu’ menjadi penyerahan langsung. Selain itu, “dudukilah” hanya menyatakan tinggal/mendiami dan kurang menyampaikan imperatif ירשׁ, yaitu mengambilnya menjadi milik.
  naturalness: Bahasa draf baku dan jelas. Revisi “Naiklah, ambillah negeri itu menjadi milikmu” tetap alami dalam register Alkitab modern serta mempertahankan dua imperatif Ibrani yang berbeda.
  terminology: “Yahweh” dan “Allahmu” sudah konsisten. “Allah nenek moyangmu” alami, tetapi אבותיך secara harfiah adalah “para bapakmu”; catatan kaki diperlukan agar bentuk formula sumber tidak dinetralkan tanpa penanda.
  issues:
  - severity: medium
    issue: Idiom נתן ... לפניך diterjemahkan “telah menyerahkan negeri itu kepadamu.”
    rationale: Teks menyatakan bahwa Yahweh telah menempatkan/memberikan negeri itu ‘di hadapan’ Israel. “Menyerahkan” dapat menyiratkan pengalihan atau penaklukan yang sudah tuntas dan tidak mempertahankan unsur spasial-presentatif לפניך.
  - severity: medium
    issue: רש diterjemahkan “dudukilah.”
    rationale: Dalam konteks ini ירשׁ berarti mengambil atau memperoleh negeri sebagai milik. “Dudukilah” dapat berarti semata-mata tinggal di sana dan melemahkan unsur pengambilan milik.
  - severity: low
    issue: Maskulinitas leksikal dalam אבותיך tidak ditandai.
    rationale: '“Nenek moyangmu” adalah padanan Indonesia yang wajar, tetapi mencakup leluhur secara umum. Catatan “harfiah: para bapakmu” menjaga transparansi terhadap formula Ibrani tanpa membuat teks utama tidak alami.'
  revised_text: Lihatlah, Yahweh, Allahmu, telah menempatkan negeri itu di hadapanmu. Naiklah, ambillah negeri itu menjadi milikmu, sebagaimana yang telah Yahweh, Allah nenek moyangmu[a], katakan kepadamu. Jangan takut dan jangan gentar.
  revised_footnotes:
  - marker: a
    text: 'Harfiah: “Allah para bapakmu.”'
    reason: Menandai bahwa bahasa Ibrani memakai “bapak-bapakmu” dalam formula perjanjian ini; “nenek moyangmu” dipakai dalam teks utama sebagai padanan Indonesia yang alami.
  revision_rationale: Revisi memulihkan unsur “di hadapanmu” dalam נתן ... לפניך dan daya aktif ירשׁ sebagai pengambilan negeri menjadi milik Israel. “Naiklah” mempertahankan arah gerak עֲלֵה. Catatan kaki memberikan transparansi atas אבותיך, sementara teks utama mempertahankan kelancaran bahasa Indonesia modern.
