revisions:
- from: Lihatlah, Yahweh, Allahmu, telah menyerahkan negeri itu kepadamu. Majulah dan dudukilah negeri itu, seperti yang telah difirmankan Yahweh, Allah nenek moyangmu, kepadamu. Jangan takut dan jangan gentar.
  to: Lihatlah, Yahweh, Allahmu, telah menempatkan negeri itu di hadapanmu. Naiklah, ambillah negeri itu menjadi milikmu, sebagaimana yang telah Yahweh, Allah nenek moyangmu[a], katakan kepadamu. Jangan takut dan jangan gentar.
  rationale: Revisi memulihkan unsur “di hadapanmu” dalam נתן ... לפניך dan daya aktif ירשׁ sebagai pengambilan negeri menjadi milik Israel. “Naiklah” mempertahankan arah gerak עֲלֵה. Catatan kaki memberikan transparansi atas אבותיך, sementara teks utama mempertahankan kelancaran bahasa Indonesia modern.
