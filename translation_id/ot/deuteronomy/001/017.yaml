  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לֹֽא תַכִּ֨ירוּ פָנִ֜ים בַּ/מִּשְׁפָּ֗ט כַּ/קָּטֹ֤ן כַּ/גָּדֹל֙ תִּשְׁמָע֔וּ/ן לֹ֤א תָג֨וּרוּ֙ מִ/פְּנֵי אִ֔ישׁ כִּ֥י הַ/מִּשְׁפָּ֖ט לֵ/אלֹהִ֣ים ה֑וּא וְ/הַ/דָּבָר֙ אֲשֶׁ֣ר יִקְשֶׁ֣ה מִ/כֶּ֔ם תַּקְרִב֥וּ/ן אֵלַ֖/י וּ/שְׁמַעְתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/017.yaml
  text: You shall not show partiality in judgment[a]; you shall hear the small and the great alike. You shall not be intimidated by any man, for the judgment belongs to God. And the matter that is too difficult for you, you shall bring to me[b], and I will hear it.
translation:
  language: id
  text: Dalam mengadili, jangan memihak[a]. Dengarkanlah baik orang kecil maupun orang besar. Jangan gentar terhadap siapa pun[b], sebab penghakiman itu milik Allah. Perkara yang terlalu sulit bagi kalian, bawalah kepadaku, dan aku akan mendengarnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mengenali wajah dalam pengadilan,” sebuah ungkapan Ibrani yang berarti memihak atau berlaku berat sebelah.
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Jangan takut terhadap seorang pun.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תַכִּירוּ פָנִים
  choice: memihak
  rationale: Ungkapan harfiahnya berarti 'mengenali wajah', tetapi dalam konteks peradilan merupakan idiom untuk memperlakukan orang secara berat sebelah. 'Memihak' ringkas, alami, dan mempertahankan daya etis-hukumnya.
- source_word: בַּמִּשְׁפָּט
  choice: dalam pengadilan
  rationale: Di sini מִשְׁפָּט menunjuk pada proses atau pelaksanaan keputusan hukum. 'Dalam pengadilan' memperjelas konteks yudisial tanpa menjadikannya sekadar gagasan abstrak tentang keadilan.
- source_word: כַּקָּטֹן כַּגָּדֹל
  choice: orang kecil maupun orang besar
  rationale: Pasangan ini membandingkan orang berkedudukan sosial rendah dan tinggi. Bentuk konkret Ibrani dipertahankan karena dapat dipahami dalam bahasa Indonesia dan tidak mempersempit maknanya.
- source_word: תִּשְׁמָעוּן
  choice: dengarkanlah
  rationale: Dalam konteks hukum, שׁמע berarti memberi kesempatan yang sama untuk didengar atau mendengarkan perkara. 'Dengarkanlah' mempertahankan citra verbal sumber dan tetap alami.
- source_word: תָגוּרוּ מִפְּנֵי אִישׁ
  choice: jangan gentar terhadap siapa pun
  rationale: Klausa ini melarang hakim mundur karena takut atau tekanan dari seseorang. 'Gentar' mempertahankan unsur rasa takut, sedangkan 'siapa pun' menyampaikan fungsi generik אִישׁ secara alami dalam bahasa Indonesia.
- source_word: כִּי הַמִּשְׁפָּט לֵאלֹהִים הוּא
  choice: sebab penghakiman adalah milik Allah
  rationale: Terjemahan ini mempertahankan pernyataan langsung bahwa keputusan atau kewenangan menghakimi berada pada Allah, tanpa menjelaskan lebih jauh dengan teori teologis tertentu.
- source_word: הַדָּבָר אֲשֶׁר יִקְשֶׁה מִכֶּם
  choice: perkara yang terlalu sulit bagi kalian
  rationale: דָּבָר dalam konteks ini adalah perkara hukum, dan konstruksi dengan קשה menyatakan perkara yang melampaui kemampuan para hakim untuk menanganinya.
- source_word: תַּקְרִבוּן אֵלַי
  choice: harus kalian bawa kepadaku
  rationale: Bentuk kausatif קרב berarti membawa mendekat atau mengajukan. 'Bawa kepadaku' alami dalam konteks pelimpahan perkara.
- source_word: וּשְׁמַעְתִּיו
  choice: dan aku akan mendengarnya
  rationale: Akhiran pronominal paling wajar merujuk kepada perkara tersebut. 'Mendengarnya' mempertahankan pengulangan שׁמע dan tidak menambahkan gagasan 'memutuskan' yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Dasar kewenangan pengadilan dalam כִּי הַמִּשְׁפָּט לֵאלֹהִים הוּא
  choice: penghakiman adalah milik Allah
  alternative: keadilan adalah kepunyaan Allah; keputusan hukum berasal dari Allah
  rationale: Bahasa sumber menyatakan kepemilikan atau kewenangan ilahi atas penghakiman. Terjemahan dibiarkan terbuka mengenai apakah penekanannya terletak pada mandat para hakim, hukum Allah, atau pertanggungjawaban mereka kepada-Nya.
- issue: Cakupan אִישׁ dalam larangan takut
  choice: siapa pun
  alternative: seorang laki-laki; seseorang
  rationale: Walaupun bentuk Ibraninya maskulin tunggal, dalam konteks ini daya acuannya generik. Bahasa Indonesia 'siapa pun' menyampaikan cakupan universal itu tanpa mengubah substansi perintah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang bermartabat. Bentuk jamak 'kalian' dipakai karena semua perintah ditujukan kepada para hakim. 'Orang kecil maupun orang besar' mempertahankan kontras sosial konkret dari teks Ibrani.
