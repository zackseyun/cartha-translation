  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י אֱמֹ֤ר לָ/הֶם֙ לֹ֤א תַֽעֲלוּ֙ וְ/לֹא תִלָּ֣חֲמ֔וּ כִּ֥י אֵינֶ֖/נִּי בְּ/קִרְבְּ/כֶ֑ם וְ/לֹא֙ תִּנָּֽגְפ֔וּ לִ/פְנֵ֖י אֹיְבֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/042.yaml
  text: 'And Yahweh said to me[a], ‘Tell them: Do not go up or fight, for I am not among you[b], lest you be struck down before your enemies.’'
translation:
  language: id
  text: 'Yahweh berfirman kepadaku, “Katakan kepada mereka: ‘Jangan naik dan jangan berperang, sebab Aku tidak ada di tengah-tengah kalian[a]; jangan sampai kalian dikalahkan di hadapan musuh-musuh kalian[b].’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di antara kalian.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “jangan sampai kalian dipukul kalah di hadapan musuh-musuh kalian.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: berfirman
  rationale: Dalam bahasa Indonesia, “berfirman” merupakan padanan yang wajar dan bermartabat untuk ujaran Allah dalam narasi, tanpa menambah isi pada verba Ibrani אמר.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama diri ilahi yang dinyatakan oleh bentuk Ibrani יהוה, alih-alih menggantinya dengan gelar.
- source_word: אֱמֹר לָהֶם
  choice: Katakanlah kepada mereka
  rationale: Menerjemahkan bentuk imperatif dan penerima ujaran secara langsung serta alami.
- source_word: לֹא תַעֲלוּ וְלֹא תִלָּחֲמוּ
  choice: Jangan maju untuk berperang
  rationale: Dalam konteks gerakan militer, עלה dapat menyatakan gerak maju atau naik untuk menyerang, sedangkan לחם berarti berperang. Ungkapan ini menyampaikan kedua unsur secara alami; arti harfiah “naik” dicatat dalam catatan kaki.
- source_word: כִּי אֵינֶנִּי בְּקִרְבְּכֶם
  choice: sebab Aku tidak ada di tengah-tengah kamu
  rationale: Menerjemahkan כי sebagai alasan dan בקרבכם secara dekat sebagai “di tengah-tengah kamu,” dengan tetap mempertahankan makna kehadiran ilahi.
- source_word: וְלֹא תִּנָּגְפוּ
  choice: supaya kamu tidak dikalahkan
  rationale: Nifal נגף menyatakan bahwa mereka akan dipukul kalah. Dalam rangkaian larangan ini, bahasa Indonesia memerlukan konstruksi tujuan atau akibat yang hendak dihindari agar klausa tersebut tidak keliru dipahami sebagai janji bahwa mereka pasti tidak akan kalah.
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: di hadapan musuh-musuhmu
  rationale: Mempertahankan idiom spasial Ibrani לפני dalam gambaran kekalahan militer; secara idiomatis hal ini juga dapat berarti “oleh musuh-musuhmu.”
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan fungsi nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Makna kehadiran Allah dalam בְּקִרְבְּכֶם
  choice: Aku tidak ada di tengah-tengah kamu
  alternative: Aku tidak menyertai kamu
  rationale: Pilihan utama mempertahankan citra spasial dan ketegangan ungkapan sumber, tanpa mempersempitnya menjadi penjelasan teologis tertentu tentang penyertaan.
- issue: Daya klausa וְלֹא תִּנָּגְפוּ
  choice: supaya kamu tidak dikalahkan
  alternative: jangan sampai kamu dikalahkan atau maka kamu tidak akan dikalahkan
  rationale: Konteks menunjukkan akibat buruk yang hendak dihindari dengan menaati larangan. Terjemahan masa depan negatif secara harfiah dapat disalahpahami sebagai janji perlindungan, berlawanan dengan peringatan dalam konteks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan jamak Ibrani diterjemahkan dengan “kamu” sesuai pemakaian baku modern; bentuk jamaknya tampak dari konteks “mereka” dan “musuh-musuhmu.” Tanda kutip bertingkat membedakan perkataan Yahweh kepada Musa dari pesan yang harus Musa sampaikan.
