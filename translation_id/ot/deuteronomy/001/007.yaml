source:
  edition: WLC
  text: פְּנ֣וּ וּ/סְע֣וּ לָ/כֶ֗ם וּ/בֹ֨אוּ הַ֥ר הָֽ/אֱמֹרִי֮ וְ/אֶל כָּל שְׁכֵנָי/ו֒ בָּ/עֲרָבָ֥ה בָ/הָ֛ר וּ/בַ/שְּׁפֵלָ֥ה וּ/בַ/נֶּ֖גֶב וּ/בְ/ח֣וֹף הַ/יָּ֑ם אֶ֤רֶץ הַֽ/כְּנַעֲנִי֙ וְ/הַ/לְּבָנ֔וֹן עַד הַ/נָּהָ֥ר הַ/גָּדֹ֖ל נְהַר פְּרָֽת׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/007.yaml
  text: Turn and set out for yourselves[a], and go to the hill country of the Amorites and to all their neighbors in the Arabah, in the hill country, in the lowland, in the Negev, and on the coast of the sea—the land of the Canaanites—and Lebanon, as far as the great river, the Euphrates River.
translation:
  language: id
  text: 'Berbaliklah dan berangkatlah, lalu pergilah ke daerah pegunungan orang Amori dan ke seluruh wilayah di sekitarnya: di Araba, di pegunungan, di dataran rendah[a], di Negeb, dan di pesisir laut—negeri orang Kanaan—serta ke Lebanon, sampai ke sungai besar, yaitu Sungai Efrat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di Syefela,” nama kawasan dataran rendah dan kaki bukit di sebelah barat.
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּנוּ
  choice: Berbaliklah
  rationale: Bentuk imperatif ini memerintahkan perubahan arah sebelum keberangkatan; 'berbaliklah' mempertahankan daya perintahnya.
- source_word: וּסְעוּ לָכֶם
  choice: dan berangkatlah
  rationale: Dalam konteks perjalanan, נסע berarti membongkar perkemahan dan mulai berjalan. 'Berangkatlah' alami dalam bahasa Indonesia; לָכֶם bersifat idiomatis dan tidak perlu diterjemahkan secara kaku sebagai 'bagi dirimu sendiri'.
- source_word: וּבֹאוּ
  choice: lalu pergilah
  rationale: בוא dapat berarti datang, masuk, atau pergi menuju. Dalam arahan kepada Israel mengenai tujuan perjalanan, 'pergilah' paling alami.
- source_word: הַר הָאֱמֹרִי
  choice: daerah pegunungan orang Amori
  rationale: הַר di sini menunjuk kawasan dataran tinggi, bukan satu gunung; bentuk gentilika dipahami secara kolektif.
- source_word: שְׁכֵנָיו
  choice: semua daerah di sekitarnya
  rationale: Secara harfiah berarti 'tetangga-tetangganya'. Karena antesedennya merupakan kawasan teritorial, ungkapan ini secara alami menunjuk wilayah-wilayah yang berdekatan tanpa memaksakan personifikasi.
- source_word: בָּעֲרָבָה
  choice: di Araba
  rationale: עֲרָבָה di sini adalah nama geografis bagi kawasan lembah retakan Yordan-Araba, sehingga ditransliterasikan.
- source_word: בָהָר
  choice: di pegunungan
  rationale: Menunjuk wilayah dataran tinggi atau kawasan bergunung dalam daftar zona geografis.
- source_word: וּבַשְּׁפֵלָה
  choice: di daerah perbukitan
  rationale: שְׁפֵלָה menunjuk kawasan rendah atau kaki bukit di sebelah barat; 'daerah perbukitan' mudah dipahami, sementara nama teknis 'Syefela' dipertahankan dalam catatan kaki.
- source_word: וּבַנֶּגֶב
  choice: di Negeb
  rationale: Dalam daftar kawasan geografis ini, נֶגֶב adalah nama wilayah selatan, bukan sekadar arah 'selatan'.
- source_word: וּבְחוֹף הַיָּם
  choice: di pesisir laut
  rationale: חוֹף berarti pantai atau pesisir; terjemahan ini ringkas dan alami.
- source_word: אֶרֶץ הַכְּנַעֲנִי
  choice: negeri orang Kanaan
  rationale: Bentuk gentilika tunggal dipakai secara kolektif untuk penduduk Kanaan; 'orang Kanaan' merupakan ungkapan Indonesia yang alami.
- source_word: וְהַלְּבָנוֹן
  choice: serta ke Lebanon
  rationale: Nama tempat dipertahankan; kata depan 'ke' diteruskan secara sintaktis dari perintah sebelumnya agar cakupan tujuan jelas.
- source_word: עַד הַנָּהָר הַגָּדֹל נְהַר פְּרָת
  choice: sampai ke sungai besar, yaitu Sungai Efrat
  rationale: Aposisi Ibrani dipertahankan dengan 'yaitu' agar Sungai Efrat jelas mengidentifikasi 'sungai besar'.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada perintah yang lugas dan bermartabat. Nama kawasan Araba, Negeb, Lebanon, dan Efrat dipertahankan, sedangkan istilah geografis dijelaskan secara alami. Penanda catatan kaki [a] ditempatkan langsung pada frasa yang bersangkutan.
