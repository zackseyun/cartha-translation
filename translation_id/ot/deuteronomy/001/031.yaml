  to: dan di padang belantara[a], tempat kamu menyaksikan bahwa Yahweh, Allahmu, telah membawamu seperti seorang laki-laki membawa putranya[b], sepanjang seluruh jalan yang telah kalian tempuh sampai kalian tiba di tempat ini.
