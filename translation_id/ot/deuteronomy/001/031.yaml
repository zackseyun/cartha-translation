source:
  edition: WLC
  text: וּ/בַ/מִּדְבָּר֙ אֲשֶׁ֣ר רָאִ֔יתָ אֲשֶׁ֤ר נְשָׂאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ כַּ/אֲשֶׁ֥ר יִשָּׂא אִ֖ישׁ אֶת בְּנ֑/וֹ בְּ/כָל הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר הֲלַכְתֶּ֔ם עַד בֹּאֲ/כֶ֖ם עַד הַ/מָּק֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/031.yaml
  text: and in the wilderness[a], where you saw that Yahweh your God carried you, just as a man carries his son[b], all along the way that you traveled until you came to this place.
translation:
  language: id
  text: dan di padang belantara[a], tempat kamu menyaksikan bahwa Yahweh, Allahmu, telah membawamu seperti seorang laki-laki membawa putranya[b], sepanjang seluruh jalan yang telah kalian tempuh sampai kalian tiba di tempat ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “padang gurun.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “seperti seorang laki-laki membawa putranya”; ungkapan ini juga dapat diterjemahkan lebih umum, “seperti seseorang membawa anaknya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַמִּדְבָּר
  choice: dan di padang belantara
  rationale: מִדְבָּר menunjuk pada daerah liar dan gersang; “padang belantara” alami dalam bahasa Indonesia dan tidak membatasi maknanya hanya pada gurun pasir.
- source_word: אֲשֶׁר רָאִיתָ
  choice: tempat kamu melihat bahwa
  rationale: Partikel relatif dikaitkan dengan lokasi sebelumnya, sedangkan “bahwa” mempertahankan isi yang dilihat secara lebih langsung daripada mengubahnya menjadi “bagaimana”.
- source_word: נְשָׂאֲךָ
  choice: menggendongmu
  rationale: נשא berarti membawa atau menanggung. Dalam perumpamaan dengan seorang laki-laki yang membawa anaknya, “menggendong” menyampaikan tindakan fisik sekaligus perhatian dengan wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” agar nama perjanjian dalam teks Ibrani tetap tampak dan tidak diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk dengan pronomina orang kedua tunggal diterjemahkan ringkas sebagai “Allahmu”, sebutan perjanjian yang langsung menyertai nama Yahweh.
- source_word: כַּאֲשֶׁר יִשָּׂא אִישׁ אֶת־בְּנוֹ
  choice: seperti seorang laki-laki menggendong anak laki-lakinya
  rationale: Terjemahan mempertahankan unsur maskulin eksplisit אִישׁ dan בְּנוֹ tanpa memperkuat אִישׁ menjadi “ayah” atau menetralkannya menjadi “orang tua”.
- source_word: בְּכָל־הַדֶּרֶךְ
  choice: di sepanjang jalan
  rationale: Ungkapan ini menyatakan bahwa tindakan tersebut berlangsung selama seluruh perjalanan; “di sepanjang jalan” merupakan padanan Indonesia yang alami.
- source_word: אֲשֶׁר הֲלַכְתֶּם
  choice: yang kamu tempuh
  rationale: הלך secara harfiah berarti berjalan atau pergi, tetapi dalam konteks perjalanan seluruh umat, “tempuh” menyampaikan maknanya secara idiomatis.
- source_word: עַד בֹּאֲכֶם עַד הַמָּקוֹם הַזֶּה
  choice: sampai kamu tiba di tempat ini
  rationale: Konstruksi infinitif temporal dan batas tujuan diterjemahkan sebagai klausa Indonesia yang jelas, dengan tetap mempertahankan acuan pada lokasi saat Musa berbicara.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama diri ilahi YHWH. Bentuk “Yahweh” mempertahankan nama itu, bukan menggantinya dengan gelar, tanpa mengklaim kepastian mutlak mengenai vokalisasi kunonya.
- issue: Citra kekeluargaan yang berjenis kelamin maskulin
  choice: seorang laki-laki menggendong anak laki-lakinya
  alternative: seseorang menggendong anaknya; seorang ayah menggendong anaknya
  rationale: Bahasa Ibrani menyebut אִישׁ, “laki-laki”, dan בְּנוֹ, “anak laki-lakinya/putranya”. Terjemahan mempertahankan citra maskulin tetapi tidak menambahkan hubungan “ayah” yang hanya tersirat, bukan dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “kamu” mengikuti sapaan tunggal dalam bagian awal ayat, sementara perjalanan yang disebut kemudian mencakup umat secara kolektif. “Menggendong” dipilih agar perumpamaan konkret dan hangat, tanpa menambahkan penafsiran teologis.
