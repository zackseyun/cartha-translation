base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/033.yaml
  text: who went before you on the way to search out a place for you to camp[a], in fire by night to show you the way in which you should go[b], and in the cloud by day.
translation:
  language: id
  text: yang berjalan di depan kalian sepanjang perjalanan untuk mencarikan kalian tempat untuk berkemah[a], dalam api pada malam hari untuk menunjukkan kepada kalian jalan yang harus kalian tempuh[b], dan dalam awan pada siang hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “untuk menyelidiki tempat untuk kalian berkemah.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “untuk menunjukkan kepada kalian jalan yang akan kalian tempuh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהֹלֵךְ
  choice: yang berjalan
  rationale: Partisipel Qal ini meneruskan gambaran tentang TUHAN pada ayat sebelumnya. Bentuk partisipial Indonesia alami dan tetap mempertahankan keterkaitan sintaksis dengan konteks.
- source_word: לִפְנֵיכֶם
  choice: di depanmu
  rationale: Ungkapan spasial ini menggambarkan Allah yang mendahului umat sebagai penuntun.
- source_word: בַּדֶּרֶךְ
  choice: dalam perjalanan
  rationale: Dalam konteks pengembaraan, דֶּרֶךְ menunjuk pada perjalanan atau jalur yang ditempuh; pilihan ini alami dalam bahasa Indonesia.
- source_word: לָתוּר
  choice: untuk mencari
  rationale: Kata תור menyatakan kegiatan menyelidiki atau mencari guna menemukan tempat yang sesuai. 'Mencari' jelas dan tidak menambahkan nuansa militer.
- source_word: מָקוֹם לַחֲנֹתְכֶם
  choice: tempat bagimu berkemah
  rationale: Frasa ini menyatakan tujuan pencarian, yaitu menemukan tempat bagi umat untuk mendirikan perkemahan.
- source_word: בָּאֵשׁ לַיְלָה
  choice: dalam api pada malam hari
  rationale: Terjemahan ini mempertahankan gambaran bahwa kehadiran dan tuntunan ilahi tampak dalam api pada malam hari.
- source_word: לַרְאֹתְכֶם
  choice: untuk menunjukkan kepadamu
  rationale: Bentuk Hifil dari ראה bersifat kausatif; dalam konteks tuntunan, padanan Indonesia yang wajar ialah 'menunjukkan kepadamu'.
- source_word: בַּדֶּרֶךְ אֲשֶׁר תֵּלְכוּ בָהּ
  choice: jalan yang harus kamu tempuh
  rationale: Klausa ini menunjuk pada rute yang diperlihatkan Allah. 'Harus kamu tempuh' menyampaikan arah yang ditetapkan tanpa menjadikannya semata-mata perintah moral.
- source_word: וּבֶעָנָן יוֹמָם
  choice: dan dalam awan pada siang hari
  rationale: Awan itu merupakan sarana kehadiran dan tuntunan ilahi yang dikenal dari konteks perjalanan di padang gurun.
theological_decisions:
- issue: Subjek klausa adalah TUHAN yang disebut pada ayat sebelumnya
  choice: Memulai dengan 'yang berjalan' tanpa mengulang 'TUHAN'
  alternative: Menambahkan 'TUHAN, yang berjalan' demi kejelasan
  rationale: Teks Ibrani bergantung secara sintaksis pada penyebutan TUHAN dalam ayat sebelumnya. Terjemahan mempertahankan hubungan antarayat itu tanpa menambahkan subjek yang tidak diulang dalam ayat ini.
- issue: Nuansa bentuk imperfek תֵּלְכוּ
  choice: jalan yang harus kamu tempuh
  alternative: jalan yang akan kamu tempuh
  rationale: Konteksnya adalah tuntunan Allah mengenai rute perjalanan. Pilihan 'harus' menyatakan rute yang semestinya diikuti, sedangkan catatan kaki mempertahankan kemungkinan terjemahan yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti tunggal 'kamu' dipakai secara kolektif untuk Israel, sesuai pemakaian orang kedua jamak dalam sumber, dan frasa pembuka sengaja dibiarkan bergantung pada ayat sebelumnya.
