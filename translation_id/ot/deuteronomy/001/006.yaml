  text: יְהוָ֧ה אֱלֹהֵ֛י/נוּ דִּבֶּ֥ר אֵלֵ֖י/נוּ בְּ/חֹרֵ֣ב לֵ/אמֹ֑ר רַב לָ/כֶ֥ם שֶׁ֖בֶת בָּ/הָ֥ר הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/006.yaml
  text: Yahweh our God spoke to us at Horeb[a], saying[b], “You have stayed at this mountain long enough.”
translation:
  language: id
  text: Yahweh, Allah kita, berfirman kepada kita di Horeb[a], “Sudah cukup lama kamu tinggal di gunung ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Horeb adalah nama yang dipakai di sini untuk gunung yang juga dikaitkan dengan Sinai.
    reason: cross_reference
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan mempertahankannya sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Bentuk ini mengacu secara tunggal kepada Allah Israel; ungkapan baku bahasa Indonesia ialah 'Allah kita'.
- source_word: דִּבֶּר אֵלֵינוּ
  choice: berfirman kepada kita
  rationale: Dalam konteks Allah sebagai penutur, 'berfirman kepada' merupakan padanan Indonesia yang alami dan bermartabat untuk tindakan berbicara kepada umat.
- source_word: בְּחֹרֵב
  choice: di Horeb
  rationale: Preposisi ב bersifat lokatif; 'di Horeb' alami dalam bahasa Indonesia dan mempertahankan nama tempat dalam teks Ibrani tanpa menyelaraskannya menjadi Sinai.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara tersendiri
  rationale: Rumus pengantar ujaran Ibrani ini secara alami diwakili oleh tanda koma dan kutipan langsung dalam bahasa Indonesia; menerjemahkannya sebagai 'dengan mengatakan' akan terasa kaku.
- source_word: רַב לָכֶם שֶׁבֶת
  choice: Sudah cukup lama kamu tinggal
  rationale: Ungkapan idiomatis ini menyatakan bahwa masa tinggal mereka telah mencukupi atau berlangsung lama; susunan ini alami dan tetap mempertahankan daya perintah tersirat dari konteks.
- source_word: בָּהָר הַזֶּה
  choice: di gunung ini
  rationale: הַר berarti 'gunung', sedangkan ב menunjukkan lokasi; 'di gunung ini' merupakan ungkapan Indonesia yang wajar untuk tempat mereka tinggal atau berkemah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa; TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar atau memilih vokalisasi alternatif.
- issue: Daya ungkapan רַב לָכֶם שֶׁבֶת
  choice: Sudah cukup lama kamu tinggal di gunung ini
  alternative: Cukuplah bagimu tinggal di gunung ini; jangan tinggal lebih lama lagi di gunung ini
  rationale: Bahasa Ibrani mengandung gagasan kecukupan dan, dalam konteks, dorongan untuk beranjak. Terjemahan utama menyampaikan makna idiomatis tanpa menambahkan larangan eksplisit yang tidak dinyatakan secara langsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti 'kamu' dipahami secara jamak karena sufiks dan bentuk Ibrani mengacu kepada seluruh Israel. Rumus לֵאמֹר dilebur ke dalam konstruksi kutipan langsung agar tidak kaku.
