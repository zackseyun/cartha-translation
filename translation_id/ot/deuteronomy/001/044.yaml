language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֵּצֵ֨א הָ/אֱמֹרִ֜י הַ/יֹּשֵׁ֨ב בָּ/הָ֤ר הַ/הוּא֙ לִ/קְרַאתְ/כֶ֔ם וַ/יִּרְדְּפ֣וּ אֶתְ/כֶ֔ם כַּ/אֲשֶׁ֥ר תַּעֲשֶׂ֖ינָה הַ/דְּבֹרִ֑ים וַֽ/יַּכְּת֥וּ אֶתְ/כֶ֛ם בְּ/שֵׂעִ֖יר עַד חָרְמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/044.yaml
  text: Then the Amorites who lived in that hill country came out to meet you and pursued you as bees do[b][a], and they struck you down in Seir as far as Hormah.
translation:
  language: id
  text: Lalu orang-orang Amori yang tinggal di daerah pegunungan itu keluar menghadapi kalian. Mereka mengejar kalian seperti lebah dan menghantam kalian di Seir sampai ke Horma.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: keluar
  rationale: Dalam narasi, יצא berarti keluar atau pergi keluar; konteks menunjukkan musuh keluar dari wilayahnya untuk menghadapi Israel.
- source_word: הָאֱמֹרִי
  choice: orang-orang Amori
  rationale: Bentuk Ibrani tunggal dipakai secara kolektif, sebagaimana ditegaskan oleh verba-verba jamak sesudahnya. Bentuk jamak alami dalam bahasa Indonesia.
- source_word: הַיֹּשֵׁב בָּהָר הַהוּא
  choice: yang tinggal di daerah pegunungan itu
  rationale: Partisipel menyatakan kediaman menetap; הַר di sini paling wajar dipahami secara regional sebagai daerah pegunungan, bukan satu gunung tertentu.
- source_word: לִקְרַאתְכֶם
  choice: menghadapi kalian
  rationale: Secara harfiah berarti datang untuk menemui, tetapi dalam konteks permusuhan mengandung arti menghadang atau menghadapi. Pilihan ini alami dan mempertahankan nuansa konfrontasi.
- source_word: וַיִּרְדְּפוּ אֶתְכֶם
  choice: Mereka mengejar kalian
  rationale: רדף adalah verba lazim untuk pengejaran, termasuk dalam konteks militer.
- source_word: כַּאֲשֶׁר תַּעֲשֶׂינָה הַדְּבֹרִים
  choice: seperti lebah
  rationale: Ungkapan perbandingan harfiahnya 'seperti yang dilakukan lebah-lebah'. Bahasa Indonesia secara idiomatis cukup memakai 'seperti lebah', sementara gambaran hidupnya tetap terpelihara.
- source_word: וַיַּכְּתוּ אֶתְכֶם
  choice: menghantam kalian
  rationale: Bentuk Hifil dari כתת menggambarkan pemukulan atau penghancuran hebat. 'Menghantam' menyampaikan kekerasan kekalahan tanpa menambahkan gagasan pembantaian yang tidak dinyatakan.
- source_word: בְּשֵׂעִיר
  choice: di Seir
  rationale: Preposisi ב paling langsung menyatakan lokasi; batas geografis selanjutnya dinyatakan oleh 'sampai ke Horma'.
- source_word: עַד חָרְמָה
  choice: sampai ke Horma
  rationale: עד menandai batas jangkauan pengejaran atau kekalahan dan wajar diterjemahkan 'sampai ke' untuk tempat geografis.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas dengan nada naratif yang bermartabat. Pronomina 'kalian' dipakai karena bentuk Ibrani orang kedua jamak merujuk kepada umat Israel. Tidak diperlukan catatan kaki karena bentuk kolektif dan makna regional dapat disampaikan langsung secara alami tanpa menghilangkan informasi penting.
