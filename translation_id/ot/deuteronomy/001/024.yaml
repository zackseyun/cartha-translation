  text: So they turned and went up into the hill country[a], and came as far as the Valley of Eshcol, and spied it out.
translation:
  language: id
  text: Kemudian mereka berbalik dan naik ke daerah perbukitan; mereka tiba di Lembah Eskol[a] dan mengintainya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Wadi Eskol” atau “Aliran Air Eskol”; istilah Ibrani ini dapat menunjuk pada lembah dengan aliran air musiman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: mereka berbalik
  rationale: Kata פנה dalam rangkaian narasi ini menyatakan perubahan arah; “berbalik” mempertahankan makna geraknya secara langsung.
- source_word: וַיַּעֲלוּ
  choice: naik
  rationale: Kata עלה menyatakan gerak ke tempat yang lebih tinggi; “naik” alami dalam bahasa Indonesia dan sesuai dengan medan yang dimaksud.
- source_word: הָהָרָה
  choice: ke daerah perbukitan
  rationale: Akhiran penunjuk arah menyatakan gerak menuju kawasan pegunungan atau perbukitan. “Daerah perbukitan” sesuai dengan topografi dan terdengar alami dalam bahasa Indonesia modern.
- source_word: וַיָּבֹאוּ עַד
  choice: sampai di
  rationale: Gabungan בוא dan עַד menunjukkan bahwa mereka tiba hingga suatu tempat; “sampai di” menyampaikan nuansa batas tujuan dengan wajar.
- source_word: נַחַל אֶשְׁכֹּל
  choice: Lembah Eskol
  rationale: נחל dapat berarti lembah, wadi, atau alur sungai musiman. “Lembah Eskol” jelas sebagai nama tempat, sedangkan kemungkinan unsur aliran air dipertahankan dalam catatan kaki.
- source_word: וַיְרַגְּלוּ
  choice: mengintai
  rationale: Bentuk piel dari רגל menunjuk pada kegiatan penyelidikan sebagai mata-mata atau pengintaian, bukan sekadar penjelajahan.
- source_word: אֹתָהּ
  choice: negeri itu
  rationale: Pronomina objek feminin tunggal merujuk pada negeri yang sedang dibicarakan dalam konteks. Penyebutan “negeri itu” menghindari rujukan pronomina yang kabur dalam bahasa Indonesia.
