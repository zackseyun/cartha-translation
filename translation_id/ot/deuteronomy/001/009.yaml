  yaml_path: translation/ot/deuteronomy/001/009.yaml
  text: And I said to you at that time, saying, ‘I am not able to bear you by myself.’
translation:
  language: id
  text: Dan pada waktu itu aku berkata kepada kalian, “Aku tidak sanggup menanggung kalian seorang diri.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִוא
  choice: Pada waktu itu
  rationale: Padanan alami dan tepat bagi frasa penunjuk waktu Ibrani.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara terpisah
  rationale: Dalam bahasa Ibrani, bentuk ini memperkenalkan kutipan langsung; dalam bahasa Indonesia modern, fungsi tersebut sudah dinyatakan secara alami oleh tanda kutip setelah verba berkata.
- source_word: לֹא אוּכַל
  choice: Aku tidak sanggup
  rationale: Menyatakan ketidakmampuan pembicara secara langsung dan wajar.
- source_word: לְבַדִּי
  choice: seorang diri
  rationale: Menekankan bahwa Musa tidak mampu menjalankan beban tersebut tanpa bantuan.
- source_word: שְׂאֵת אֶתְכֶם
  choice: menanggung kalian
  rationale: Mempertahankan metafora 'mengangkat/menanggung' yang dalam konteks menunjuk pada beban memimpin dan mengurus umat.
theological_decisions:
- issue: Hakikat beban Musa
  choice: Mempertahankan ungkapan metaforis 'menanggung kalian'
  alternative: memimpin kalian atau mengurus kalian
  rationale: Teks sumber memakai שׂא 'mengangkat/menanggung'; terjemahan tidak mempersempit maknanya hanya pada administrasi atau kepemimpinan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti jamak 'kalian' dipakai untuk memperjelas bahwa Musa berbicara kepada seluruh umat; 'aku' sesuai dengan tuturan langsung Musa.
