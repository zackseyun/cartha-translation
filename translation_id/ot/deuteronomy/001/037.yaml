  yaml_path: translation/ot/deuteronomy/001/037.yaml
  text: Yahweh was angry with me also because of you[a], saying[b], 'You also shall not enter there.'
translation:
  language: id
  text: Yahweh juga murka terhadapku karena kalian[a]. Dia berfirman[b], “Engkau juga tidak akan masuk ke sana.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yahweh murka kepadaku karena kalian.”
    reason: lexical_alternative
  - marker: b
    text: Bandingkan Bilangan 20:12, yang menghubungkan tidak masuknya Musa ke negeri itu dengan kegagalannya sendiri di Meriba; di sini Kitab Ulangan menekankan peran umat dalam perkara tersebut.
    reason: cross_reference
lexical_decisions:
- source_word: גַּם
  choice: juga
  rationale: Partikel ini menyatakan tambahan atau penegasan. Pemakaian “juga” pada kedua kemunculannya mempertahankan daya kumulatif teks secara wajar dalam bahasa Indonesia.
- source_word: בִּי
  choice: kepada saya
  rationale: Dengan הִתְאַנַּף, preposisi ב menandai sasaran kemurkaan. “Murka kepada saya” alami dan sesuai dengan konteks ujaran Musa.
- source_word: הִתְאַנַּף
  choice: murka
  rationale: Bentuk Hitpael dari אנף menyatakan menjadi atau berada dalam keadaan marah. “Murka” cukup kuat, bermartabat, dan lazim dipakai bagi kemarahan ilahi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: בִּגְלַלְכֶם
  choice: karena kalian
  rationale: Frasa ini menyatakan sebab atau alasan. “Karena kalian” langsung, alami, dan mempertahankan bentuk orang kedua jamak.
- source_word: לֵאמֹר
  choice: dengan berfirman
  rationale: Infinitif ini memperkenalkan isi perkataan ilahi. “Dengan berfirman” terdengar alami dalam konteks Yahweh sebagai pembicara dan tetap menghubungkan ujaran berikut dengan kemurkaan-Nya.
- source_word: אַתָּה
  choice: engkau
  rationale: Pronomina orang kedua maskulin tunggal menunjuk khusus kepada Musa. “Engkau” membedakannya dengan jelas dari “kalian” yang jamak.
- source_word: לֹא תָבֹא
  choice: tidak akan masuk
  rationale: Dalam konteks ini בוא mengacu pada memasuki negeri yang dibicarakan. Bentuk “tidak akan masuk” menyampaikan larangan atau kepastian negatif tanpa memaksakan nuansa modal tambahan.
- source_word: שָׁם
  choice: ke sana
  rationale: Adverbia ini menunjuk kepada negeri yang sedang dibicarakan. “Ke sana” mempertahankan daya deiktiknya dan selaras dengan verba gerak “masuk”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; transliterasi “Yahweh” mempertahankan nama pribadi itu alih-alih menggantinya dengan gelar.
- issue: Hubungan kausal antara tindakan umat dan tidak masuknya Musa
  choice: Teks utama menyatakan bahwa Yahweh murka kepada Musa karena umat, tanpa menyelesaikan ketegangan kanonis.
  alternative: Menempatkan seluruh kesalahan pada umat, atau memasukkan kegagalan Musa di Meriba ke dalam teks utama.
  rationale: Ulangan 1:37 menonjolkan peran umat, sedangkan Bilangan 20:12 menghubungkan tidak masuknya Musa dengan kegagalannya sendiri. Terjemahan mengikuti ayat ini dan membiarkan ketegangan tersebut tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Saya” dipakai dalam tuturan Musa kepada umat, sedangkan “kalian” mempertahankan bentuk jamak dan “Engkau” menandai sapaan tunggal Yahweh kepada Musa. Tanda catatan kaki ditempatkan langsung pada unsur yang dijelaskan.
