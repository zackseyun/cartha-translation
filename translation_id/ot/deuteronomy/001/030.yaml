  text: יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ הַ/הֹלֵ֣ךְ לִ/פְנֵי/כֶ֔ם ה֖וּא יִלָּחֵ֣ם לָ/כֶ֑ם כְּ֠/כֹל אֲשֶׁ֨ר עָשָׂ֧ה אִתְּ/כֶ֛ם בְּ/מִצְרַ֖יִם לְ/עֵינֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/030.yaml
  text: Yahweh your God[a], who goes before you, will himself fight for you, just as he did for you in Egypt before your eyes.
translation:
  language: id
  text: Yahweh, Allah kalian, yang berjalan di depan kalian, Dialah yang akan berperang bagi kalian, sama seperti yang telah Ia lakukan bagi kalian di Mesir di depan mata kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “yang Ia lakukan dengan kalian.” Dalam konteks ini, frasa tersebut merujuk pada apa yang Yahweh lakukan demi Israel di Mesir.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar, sehingga nama perjanjian dalam teks Ibrani tetap tampak.
- source_word: אֱלֹהֵיכֶם
  choice: Allah kalian
  rationale: Bentuk berakhiran orang kedua jamak merujuk kepada Allah Israel dalam arti tunggal; 'kalian' mempertahankan sapaan kepada seluruh umat.
- source_word: הַהֹלֵךְ לִפְנֵיכֶם
  choice: yang berjalan di depan kalian
  rationale: Partisip Ibrani menggambarkan tindakan yang sedang berlangsung atau menjadi ciri tindakan Yahweh sebagai pemimpin umat.
- source_word: הוּא
  choice: Dialah
  rationale: Pronomina mandiri bersifat emfatis; 'Dialah' menegaskan bahwa Yahweh sendiri yang akan bertindak.
- source_word: יִלָּחֵם לָכֶם
  choice: akan berperang bagi kalian
  rationale: Bentuk Niphal dari לחם di sini menyatakan bahwa Yahweh akan bertempur demi umat-Nya.
- source_word: כְּכֹל אֲשֶׁר
  choice: sama seperti
  rationale: Mengungkapkan perbandingan dengan tindakan Yahweh sebelumnya secara alami dalam bahasa Indonesia.
- source_word: עָשָׂה אִתְּכֶם
  choice: yang dilakukan-Nya bagi kalian
  rationale: Secara harfiah frasa ini berbunyi 'yang dilakukan-Nya dengan kalian', tetapi dalam konteks tindakan penyelamatan di Mesir, 'bagi kalian' menyampaikan maksud relasionalnya dengan wajar tanpa menyembunyikan bentuk harfiahnya, yang dicatat dalam catatan kaki.
- source_word: בְּמִצְרַיִם
  choice: di Mesir
  rationale: Padanan lokatif langsung dan alami.
- source_word: לְעֵינֵיכֶם
  choice: di depan mata kalian
  rationale: Mempertahankan idiom yang menekankan bahwa umat Israel menyaksikan sendiri tindakan tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama ilahi secara langsung; transliterasi 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Subjek emfatis dalam janji untuk berperang
  choice: Dialah yang akan berperang
  alternative: Dia akan berperang; Dia sendiri akan berperang
  rationale: Pilihan ini mempertahankan penekanan pronomina הוּא tanpa menambahkan penafsiran mengenai cara atau perantara tindakan ilahi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan jamak 'kalian' dipakai untuk mempertahankan bentuk orang kedua jamak Ibrani; pengulangan 'bagi kalian' dan ungkapan 'di depan mata kalian' menjaga penekanan serta citra teks sumber.
