  text: But as for you[a], turn yourselves around and set out for the wilderness by the way of the Red Sea.
translation:
  language: id
  text: Tetapi kamu, berbaliklah dan berangkatlah menuju padang gurun melalui jalan menuju Laut Teberau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara tradisional: “Laut Merah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: Tetapi kamu
  rationale: Kata penghubung bersama pronomina mandiri menandai pertentangan dan penekanan terhadap umat setelah keputusan dalam konteks sebelumnya.
- source_word: פְּנוּ לָכֶם
  choice: berbaliklah
  rationale: Gabungan imperatif dan לָכֶם menyatakan perubahan arah yang dilakukan para pendengar sendiri; bentuk refleksif tidak perlu dinyatakan terpisah dalam bahasa Indonesia.
- source_word: וּ/סְעוּ
  choice: dan berangkatlah
  rationale: נסע dalam konteks perjalanan lazim berarti membongkar perkemahan lalu mulai bergerak; 'berangkatlah' menyampaikan perintah itu secara alami.
- source_word: הַמִּדְבָּרָה
  choice: menuju padang gurun
  rationale: Akhiran penunjuk arah menyatakan gerak ke arah padang gurun tanpa harus memastikan bahwa mereka langsung memasukinya.
- source_word: דֶּרֶךְ
  choice: melalui jalan ke
  rationale: Kata ini menunjukkan rute perjalanan; rumusan tersebut mempertahankan unsur 'jalan' sekaligus alami dalam bahasa Indonesia.
- source_word: יַם סוּף
  choice: Laut Teberau
  rationale: Secara leksikal סוּף menunjuk pada teberau atau gelagah air. 'Laut Teberau' mempertahankan bentuk nama Ibrani lebih langsung daripada nama tradisional 'Laut Merah'.
