  text: Then I said to you, ‘Do not be terrified of them, and do not fear them.’
translation:
  language: id
  text: Lalu aku berkata kepadamu, “Jangan gentar dan jangan takut kepada mereka.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַעַרְצוּן
  choice: gentar
  rationale: Kata kerja ini menyatakan rasa ngeri atau gentar yang melumpuhkan; “gentar” alami dalam bahasa Indonesia dan membedakannya dari kata berikutnya.
- source_word: תִירְאוּן
  choice: takut
  rationale: Padanan langsung dan umum untuk ירא dalam konteks ancaman manusia.
- source_word: מֵהֶם
  choice: kepada mereka
  rationale: Dalam ungkapan bahasa Indonesia “takut kepada mereka”, preposisi ini menyampaikan sumber atau objek ketakutan secara alami.
theological_decisions:
- issue: Hubungan dua larangan yang bersinonim
  choice: 'Mempertahankan keduanya: “Jangan gentar dan jangan takut”'
  alternative: Meringkas menjadi satu larangan, misalnya “Jangan takut kepada mereka”
  rationale: Teks Ibrani memakai dua kata kerja berbeda yang dihubungkan dengan וְלֹא; pengulangan retorisnya perlu dipertahankan tanpa memaksakan perbedaan teologis yang terlalu tajam.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk orang pertama tunggal “aku” sesuai dengan tuturan Musa dalam konteks, sedangkan “kepadamu” mempertahankan objek jamak kolektif tanpa membuat kalimat kaku.
