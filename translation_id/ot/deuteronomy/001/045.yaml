  text: וַ/תָּשֻׁ֥בוּ וַ/תִּבְכּ֖וּ לִ/פְנֵ֣י יְהוָ֑ה וְ/לֹֽא שָׁמַ֤ע יְהוָה֙ בְּ/קֹ֣לְ/כֶ֔ם וְ/לֹ֥א הֶאֱזִ֖ין אֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/045.yaml
  text: Then you returned and wept before Yahweh[a], but Yahweh did not listen to your voice or pay attention to you.
translation:
  language: id
  text: Lalu kamu kembali dan menangis di hadapan Yahweh, tetapi Yahweh tidak mendengarkan suaramu ataupun menghiraukan kamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “tidak mendengar suaramu dan tidak memasang telinga kepadamu.” Bahasa Ibrani memakai dua kata kerja yang hampir sejajar untuk mendengar atau mendengarkan, dengan penekanan bahwa Yahweh tidak menanggapi permohonan mereka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּשֻׁבוּ
  choice: Lalu kamu kembali
  rationale: Kata שׁוּב berarti kembali atau berbalik. Dalam urutan narasi ini, “kembali” secara alami menunjukkan kepulangan mereka setelah serangan yang gagal, sedangkan “lalu” mencerminkan kelanjutan narasi.
- source_word: וַתִּבְכּוּ
  choice: dan menangis
  rationale: Kata בכה berarti menangis atau meratap. “Menangis” mempertahankan nada khidmat tanpa menambahkan kadar kepedihan yang tidak dinyatakan secara eksplisit.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Ungkapan לִפְנֵי berarti di hadapan atau dalam kehadiran. “Di hadapan Yahweh” alami dalam bahasa Indonesia dan mempertahankan latar relasional-perjanjian.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks sumber tetap terlihat.
- source_word: וְלֹא שָׁמַע יְהוָה בְּקֹלְכֶם
  choice: tetapi Yahweh tidak mendengarkan suaramu
  rationale: שׁמע dengan בְּקוֹל dapat berarti mendengar, mendengarkan, atau mengindahkan suara seseorang. “Tidak mendengarkan suaramu” mempertahankan gambaran konkret teks Ibrani sekaligus menyampaikan bahwa permohonan mereka tidak ditanggapi.
- source_word: וְלֹא הֶאֱזִין אֲלֵיכֶם
  choice: ataupun menghiraukan kamu
  rationale: האזין berarti memasang telinga atau mendengarkan dengan penuh perhatian. “Menghiraukan” menyampaikan unsur perhatian dalam bahasa Indonesia modern serta menghindari pengulangan yang kaku.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks menggunakan nama ilahi secara langsung. Bentuk “Yahweh” mempertahankan nama pribadi dalam teks sumber tanpa menggantinya dengan gelar.
- issue: Makna bahwa Yahweh tidak mendengar
  choice: Tidak mendengarkan atau menghiraukan permohonan mereka
  alternative: Secara harfiah tidak mampu mendengar suara mereka
  rationale: Dua verba pendengaran yang sejajar dalam konteks ini menyatakan bahwa Yahweh tidak menanggapi permohonan mereka, bukan bahwa Ia secara fisik tidak dapat mendengar.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Pronomina “kamu” mengikuti sapaan jamak Musa kepada umat; bentuknya tidak menandai jumlah dalam bahasa Indonesia. Paralelisme Ibrani dipertahankan secara alami melalui “tidak mendengarkan ... ataupun menghiraukan”.
