  terminology: “Yahweh” konsisten dengan kebijakan nama ilahi. “Perintah Yahweh” merupakan pengungkapan idiomatis yang tepat bagi אֶת־פִּי יְהוָה dalam konteks ini; catatan kaki dengan tepat mempertahankan bentuk harfiahnya. Catatan kaki sebaiknya tidak menyisipkan aspek lampau “telah,” karena bentuk idiom tersebut sendiri tidak menuntutnya.
