  text: וָ/אֲדַבֵּ֥ר אֲלֵי/כֶ֖ם וְ/לֹ֣א שְׁמַעְתֶּ֑ם וַ/תַּמְרוּ֙ אֶת פִּ֣י יְהוָ֔ה וַ/תָּזִ֖דוּ וַ/תַּעֲל֥וּ הָ/הָֽרָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/043.yaml
  text: So I spoke to you[a], but you did not listen; you rebelled against the mouth of Yahweh, acted presumptuously, and went up into the hill country.
translation:
  language: id
  text: Maka aku berbicara kepada kalian, tetapi kalian tidak mendengarkan. Kalian memberontak terhadap perintah Yahweh[a], bertindak lancang, dan naik ke daerah pegunungan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mulut Yahweh”; maksudnya, apa yang Yahweh perintahkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲדַבֵּר אֲלֵיכֶם
  choice: Maka aku berbicara kepada kalian
  rationale: וָאֲדַבֵּר berarti ‘aku berbicara’; ‘Maka’ menyampaikan alur naratif dari ayat sebelumnya, sedangkan ‘kalian’ memperjelas akhiran orang kedua jamak.
- source_word: וְלֹא שְׁמַעְתֶּם
  choice: tetapi kalian tidak mau mendengarkan
  rationale: שׁמע dapat berarti mendengar, mendengarkan, atau menaati. Dalam konteks ini, bentuk negatif menyatakan penolakan untuk mengindahkan perkataan Musa; ‘tidak mau mendengarkan’ alami dalam bahasa Indonesia tanpa menggantinya langsung dengan ‘tidak taat’.
- source_word: וַתַּמְרוּ אֶת־פִּי יְהוָה
  choice: Kalian menentang perintah Yahweh[a]
  rationale: מרה menyatakan pemberontakan atau penentangan terhadap otoritas. Ungkapan harfiah ‘mulut Yahweh’ secara idiomatis menunjuk pada apa yang Yahweh firmankan atau perintahkan; ‘perintah’ menyampaikan maksudnya dengan jelas, sementara catatan kaki mempertahankan bentuk Ibraninya.
- source_word: וַתָּזִדוּ
  choice: bertindak lancang
  rationale: זיד menggambarkan tindakan yang angkuh, nekat, atau dilakukan dengan mengabaikan wewenang. ‘Bertindak lancang’ menangkap nuansa kesombongan dan pembangkangan tanpa menambahkan unsur militer.
- source_word: וַתַּעֲלוּ הָהָרָה
  choice: naik ke daerah pegunungan
  rationale: עלה berarti ‘naik’, dan bentuk berakhiran lokatif pada הָהָרָה menunjukkan gerak menuju kawasan tinggi. Dalam konteks ini הָהָר menunjuk pada wilayah pegunungan, bukan semata-mata satu gunung.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi יְהוָה. Bentuk ‘Yahweh’ mempertahankan nama pribadi yang terdapat dalam sumber, bukan menggantinya dengan gelar.
- issue: Makna idiom אֶת־פִּי יְהוָה
  choice: perintah Yahweh
  alternative: mulut Yahweh
  rationale: Secara harfiah frasa itu berbunyi ‘mulut Yahweh’, tetapi dalam konteks pemberontakan maksudnya ialah apa yang Yahweh perintahkan. Terjemahan utama menyampaikan arti idiomatis, sedangkan catatan kaki menjaga bentuk dan citra bahasa sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ‘aku/kalian’ mengikuti tuturan langsung Musa kepada seluruh umat. Kalimat dipecah menjadi dua agar alami dan jelas, tanpa mengubah hubungan antarklausa dalam bahasa Ibrani.
