  text: And Yahweh heard the sound of your words[a], and he was angry and swore, saying,
translation:
  language: id
  text: 'Yahweh mendengar ucapanmu[a]. Ia menjadi murka dan bersumpah:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “suara perkataanmu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan mempertahankannya sebagai nama pribadi, bukan menggantinya dengan gelar.
- source_word: וַיִּשְׁמַע
  choice: mendengar
  rationale: Dalam rangkaian naratif ini, שׁמע secara langsung menyatakan bahwa Yahweh mendengar ucapan bangsa itu; pilihan ini tidak menambahkan nuansa ketaatan atau penerimaan.
- source_word: אֶת קוֹל דִּבְרֵיכֶם
  choice: perkataan-perkataanmu
  rationale: Ungkapan Ibrani harfiahnya adalah 'suara perkataan-perkataanmu'. Dalam bahasa Indonesia modern, 'mendengar perkataan-perkataanmu' menyampaikan maknanya secara alami, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וַיִּקְצֹף
  choice: murka
  rationale: קצף menyatakan kemarahan yang kuat. 'Murka' merupakan padanan yang ringkas, wajar, dan bermartabat dalam konteks kemarahan ilahi.
- source_word: וַיִּשָּׁבַע
  choice: bersumpah
  rationale: Bentuk Niphal dari שׁבע lazim berarti 'bersumpah'; isi sumpah menyusul dalam ayat berikutnya.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif ini memperkenalkan kutipan langsung. Karena isi ucapan terdapat pada ayat berikutnya, 'demikian:' menjadi penghubung Indonesia yang alami dan mempertahankan kesinambungan sintaksis.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Partikel 'pun' menandai kelanjutan tindakan secara alami. Tanda titik dua menunjukkan bahwa sumpah yang diperkenalkan di sini berlanjut pada ayat berikutnya.
