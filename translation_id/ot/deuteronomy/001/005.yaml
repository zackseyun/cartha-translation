base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/005.yaml
  text: 'Beyond the Jordan[a], in the land of Moab, Moses began to explain this law[b], saying:'
translation:
  language: id
  text: 'Di seberang Sungai Yordan[a], di tanah Moab, Musa mulai menjelaskan hukum ini[b], katanya:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “di seberang Yordan” atau “di sisi lain Sungai Yordan.” Ungkapan Ibrani ini bersifat relatif secara geografis dan bergantung pada sudut pandang pembicara atau penulis.
    reason: lexical_alternative
  - marker: b
    text: Atau “pengajaran ini.” Kata Ibrani torah dapat berarti “hukum” atau, secara lebih luas, “pengajaran.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: Di seberang Sungai Yordan
  rationale: Ungkapan ini menunjuk wilayah di seberang Yordan menurut sudut pandang geografis yang bersifat relatif. Dalam bahasa Indonesia, “di seberang Sungai Yordan” alami dan tetap mempertahankan kerelatifan tersebut.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: di tanah Moab
  rationale: אֶרֶץ dalam konteks geografis-politis ini secara wajar berarti “tanah”; frasa tersebut ringkas dan lazim dalam ragam Alkitab bahasa Indonesia.
- source_word: הוֹאִיל
  choice: mulai
  rationale: Dalam konstruksi ini, הוֹאִיל menandai dimulainya atau dilaksanakannya suatu tindakan. “Mulai” menyampaikan fungsi idiomatis itu dengan jelas dan alami.
- source_word: בֵּאֵר
  choice: menjelaskan
  rationale: Kata kerja באר menyatakan tindakan membuat sesuatu menjadi jelas atau menguraikannya. “Menjelaskan” merupakan padanan modern yang mudah dipahami tanpa kehilangan maknanya.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: hukum ini
  rationale: תּוֹרָה dapat berarti hukum maupun pengajaran. Dalam konteks perjanjian dan ketetapan di Ulangan, “hukum” mempertahankan bobot legal-perjanjiannya, sementara kemungkinan makna yang lebih luas dicatat dalam catatan kaki.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: לֵאמֹר memperkenalkan isi perkataan yang menyusul. “Demikian:” berfungsi alami sebagai penanda pengantar tuturan dalam bahasa Indonesia dan menghindari bentuk “dengan berkata” yang kurang luwes di sini.
theological_decisions:
- issue: Penerjemahan תּוֹרָה dalam konteks perjanjian
  choice: hukum ini
  alternative: pengajaran ini
  rationale: Konteks memperkenalkan uraian Musa mengenai ketetapan-ketetapan perjanjian, sehingga “hukum” mempertahankan dimensi legalnya. Namun, karena תּוֹרָה juga dapat mencakup pengajaran, kemungkinan tersebut tidak dihapus dan dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Sungai” ditambahkan agar nama geografis Yordan segera jelas bagi pembaca umum. Susunan kalimat mengikuti alur teks Ibrani tetapi tetap alami dalam bahasa Indonesia.
