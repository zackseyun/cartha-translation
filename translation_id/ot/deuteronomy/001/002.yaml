  yaml_path: translation/ot/deuteronomy/001/002.yaml
  text: It is eleven days from Horeb by the way of Mount Seir to Kadesh-barnea[a][b].
translation:
  language: id
  text: Perjalanan dari Horeb ke Kadesh-Barnea melalui jalur Gunung Seir memakan sebelas hari.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sebelas hari.” Dalam konteks ini, ungkapan Ibrani tersebut menyatakan lamanya perjalanan melalui rute itu.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani memakai nama Horeb, yang sering dikaitkan dengan Sinai.
    reason: alternative_reading
lexical_decisions:
- source_word: אַחַד עָשָׂר יוֹם
  choice: Sebelas hari perjalanan
  rationale: Frasa Ibrani ini secara harfiah menyebut 'sebelas hari' dan dalam konteks menyatakan lamanya perjalanan. Bentuk ini alami dalam bahasa Indonesia tanpa menambahkan verba yang tidak terdapat dalam klausa Ibrani.
- source_word: מֵחֹרֵב
  choice: dari Horeb
  rationale: חֹרֵב adalah nama tempat Horeb. Nama itu dipertahankan sesuai teks Ibrani dan tidak diganti dengan Sinai.
- source_word: דֶּרֶךְ הַר שֵׂעִיר
  choice: melalui jalan menuju Pegunungan Seir
  rationale: דֶּרֶךְ menunjuk jalan atau rute, sedangkan הַר dapat merujuk pada gunung maupun kawasan pegunungan. Dalam konstruksi ini, frasa tersebut paling wajar dipahami sebagai rute yang menuju atau melewati kawasan Seir.
- source_word: עַד
  choice: sampai ke
  rationale: Dalam konteks geografis, עַד menandai titik akhir perjalanan.
- source_word: קָדֵשׁ בַּרְנֵעַ
  choice: Kadesh-Barnea
  rationale: Nama tempat ini ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan ringkas. Struktur tanpa verba mempertahankan bentuk klausa Ibrani, sementara kata “perjalanan” memperjelas fungsi ungkapan waktu. “Pegunungan Seir” dipilih karena הַר dapat menunjuk kawasan pegunungan, dengan catatan bahwa frasa jalurnya tetap memiliki keluwesan geografis.
