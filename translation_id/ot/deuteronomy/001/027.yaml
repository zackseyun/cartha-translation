  text: וַ/תֵּרָגְנ֤וּ בְ/אָהֳלֵי/כֶם֙ וַ/תֹּ֣אמְר֔וּ בְּ/שִׂנְאַ֤ת יְהוָה֙ אֹתָ֔/נוּ הוֹצִיאָ֖/נוּ מֵ/אֶ֣רֶץ מִצְרָ֑יִם לָ/תֵ֥ת אֹתָ֛/נוּ בְּ/יַ֥ד הָ/אֱמֹרִ֖י לְ/הַשְׁמִידֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/027.yaml
  text: And you grumbled in your tents and said[a], ‘Because Yahweh hates us, he brought us out of the land of Egypt to give us into the hand of the Amorites[b], to destroy us.’
translation:
  language: id
  text: Kalian menggerutu di kemah-kemah kalian dan berkata, “Karena Yahweh membenci kita,[a] Ia membawa kita keluar dari negeri Mesir untuk menyerahkan kita ke dalam kuasa orang Amori[b] dan membinasakan kita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dalam kebencian Yahweh terhadap kita.” Ungkapan ini bermakna: “Karena Yahweh membenci kita.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “menyerahkan kita ke dalam tangan orang Amori”; secara harfiah demikian, yaitu ke dalam kuasa mereka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרָגְנוּ
  choice: Kalian menggerutu
  rationale: Kata kerja ini menyatakan keluhan yang dilontarkan dengan rasa tidak puas. ‘Menggerutu’ alami dalam bahasa Indonesia modern dan mempertahankan nuansa keluhan negatif.
- source_word: בְאָהֳלֵיכֶם
  choice: di dalam kemah
  rationale: Terjemahan lokatif yang langsung dan konkret; bentuk tunggal kolektif ‘kemah’ wajar dalam konteks masing-masing keluarga berada di kemahnya.
- source_word: בְּשִׂנְאַת יְהוָה אֹתָנוּ
  choice: Karena Yahweh membenci kita
  rationale: Preposisi ב dengan nomina abstrak ‘kebencian’ berfungsi kausal. Bentuk verbal ini menyampaikan tuduhan bangsa itu secara alami tanpa mengesahkannya sebagai fakta.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: הוֹצִיאָנוּ מֵאֶרֶץ מִצְרָיִם
  choice: Ia membawa kita keluar dari negeri Mesir
  rationale: Mencerminkan verba kausatif ‘membawa keluar’ serta menyertakan unsur eksplisit ‘negeri Mesir’.
- source_word: לָתֵת אֹתָנוּ בְּיַד הָאֱמֹרִי
  choice: untuk menyerahkan kita ke dalam kuasa orang Amori
  rationale: Ungkapan harfiah ‘memberikan ke dalam tangan’ merupakan idiom penyerahan ke bawah kuasa pihak lain. ‘Ke dalam kuasa’ jelas dan alami dalam bahasa Indonesia.
- source_word: הָאֱמֹרִי
  choice: orang Amori
  rationale: Walaupun secara morfologis tunggal, bentuk ini merujuk secara kolektif kepada kelompok bangsa Amori.
- source_word: לְהַשְׁמִידֵנוּ
  choice: dan membinasakan kita
  rationale: Bentuk Hifil menyatakan tindakan memusnahkan atau membinasakan. ‘Membinasakan’ kuat, bermartabat, dan tidak menambahkan rincian yang tidak ada dalam teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi; ‘Yahweh’ mempertahankan fungsi nama tersebut.
- issue: Status pernyataan bahwa Yahweh membenci Israel
  choice: Dipertahankan sebagai tuduhan langsung bangsa Israel dalam kutipan
  alternative: Menghaluskan menjadi ‘Yahweh tidak mengasihi kita’
  rationale: Teks memakai kata ‘kebencian’ dan menyajikannya sebagai perkataan bangsa itu, bukan sebagai penegasan narator. Terjemahan tidak boleh mengurangi ketegangan teologis tersebut.
- issue: Hubungan tujuan dalam לָתֵת ... לְהַשְׁמִידֵנוּ
  choice: untuk menyerahkan ... dan membinasakan
  alternative: untuk menyerahkan ... supaya membinasakan
  rationale: Kedua infinitif menyatakan tujuan yang dituduhkan kepada Yahweh. Koordinasi dengan ‘dan’ alami dalam bahasa Indonesia dan tidak menentukan secara berlebihan apakah orang Amori atau Yahweh dipandang sebagai pelaku langsung pembinasaan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. Pronomina ‘kalian’ menandai orang kedua jamak secara jelas, sedangkan ‘kita’ mempertahankan sudut pandang inklusif para penggerutu. Kapitalisasi ‘Ia’ dipakai untuk rujukan kepada Yahweh sesuai kebiasaan penerbitan Alkitab Indonesia.
