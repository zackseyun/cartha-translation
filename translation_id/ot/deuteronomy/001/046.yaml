  yaml_path: translation/ot/deuteronomy/001/046.yaml
  text: So you remained at Kadesh many days[a], according to the days that you remained there.
translation:
  language: id
  text: Demikianlah kamu tinggal di Kadesh berhari-hari lamanya, sesuai dengan lamanya kamu tinggal di sana.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “banyak hari, seperti hari-hari ketika kamu tinggal.” Frasa terakhir bersifat eliptis dan dapat dipahami sebagai “untuk waktu yang lama, selama waktu kamu tinggal di sana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּשְׁבוּ
  choice: Jadi, kamu tinggal
  rationale: Kata kerja ישׁב di sini menyatakan menetap atau tinggal untuk suatu waktu. “Tinggal” alami dalam bahasa Indonesia dan cocok dengan konteks perkemahan yang berkepanjangan; “Jadi” meneruskan alur dari ayat sebelumnya.
- source_word: בְקָדֵשׁ
  choice: di Kadesh
  rationale: Nama tempat dipertahankan melalui transliterasi, dan preposisi בְּ secara alami diterjemahkan “di” untuk lokasi.
- source_word: יָמִים רַבִּים
  choice: berhari-hari lamanya
  rationale: Ungkapan ini menyampaikan arti harfiah “banyak hari” dalam bentuk bahasa Indonesia yang wajar, tanpa mengubahnya menjadi penentuan waktu yang lebih spesifik.
- source_word: כַּיָּמִים אֲשֶׁר יְשַׁבְתֶּם
  choice: selama kamu tinggal di sana
  rationale: Frasa perbandingan ini eliptis. Terjemahan utama dibuat alami, sedangkan bentuk harfiah dan kemungkinan nuansanya dicatat dalam catatan kaki agar ambiguitas sumber tetap terlihat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada naratif. Pengulangan kata “tinggal” dipertahankan karena mencerminkan pengulangan ישׁב dalam teks Ibrani, sedangkan susunan frasa eliptis dijelaskan melalui catatan kaki.
