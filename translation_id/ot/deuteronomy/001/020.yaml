source:
  edition: WLC
  text: וָ/אֹמַ֖ר אֲלֵ/כֶ֑ם בָּאתֶם֙ עַד הַ֣ר הָ/אֱמֹרִ֔י אֲשֶׁר יְהוָ֥ה אֱלֹהֵ֖י/נוּ נֹתֵ֥ן לָֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/020.yaml
  text: And I said to you[a], “You have come to the hill country of the Amorites, which Yahweh our God is giving us.”
translation:
  language: id
  text: Lalu aku berkata kepada kalian, “Kalian telah sampai di pegunungan orang Amori,[a] yang Yahweh, Allah kita, sedang berikan kepada kita.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “gunung orang Amori.” Kata Ibrani yang dipakai dapat menunjuk pada satu gunung atau, secara lebih luas, kawasan pegunungan atau perbukitan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: Lalu aku berkata
  rationale: Bentuk wayyiqtol melanjutkan urutan cerita; “lalu” menyatakan perkembangan naratif secara alami.
- source_word: אֲלֵכֶם
  choice: kepada kalian
  rationale: Pronomina orang kedua jamak dinyatakan secara eksplisit dengan “kalian” agar jumlah jamaknya jelas dalam bahasa Indonesia.
- source_word: בָּאתֶם
  choice: Kalian telah sampai
  rationale: Qal perfektum orang kedua jamak menunjuk pada tindakan yang sudah selesai dan relevan dengan keadaan saat itu; “telah sampai” juga menyatakan tercapainya tujuan.
- source_word: עַד
  choice: di
  rationale: Sesudah verba gerak, kata ini menandai batas atau tujuan yang telah dicapai. Dalam ungkapan Indonesia “telah sampai di” paling alami.
- source_word: הַר הָאֱמֹרִי
  choice: pegunungan orang Amori
  rationale: הַר dalam konteks geografis dapat menunjuk pada kawasan bergunung atau perbukitan, sedangkan bentuk gentilisinya bersifat kolektif.
- source_word: אֲשֶׁר
  choice: yang
  rationale: Kata penghubung relatif ini menerangkan kawasan pegunungan tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Bentuk konstruk dengan sufiks orang pertama jamak diterjemahkan langsung dan wajar.
- source_word: נֹתֵן לָנוּ
  choice: sedang ... berikan kepada kita
  rationale: Partisipel menyatakan tindakan yang sedang berlangsung atau segera diwujudkan; susunan dengan subjek di antara penanda aspek dan verba tetap alami serta mempertahankan nuansa pemberian kepada Israel.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama diri ilahi secara langsung. “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Aspek נֹתֵן dalam pemberian negeri
  choice: yang sedang Yahweh, Allah kita, berikan kepada kita
  alternative: yang Yahweh, Allah kita, berikan kepada kita; yang telah Yahweh, Allah kita, berikan kepada kita
  rationale: Partisipel Ibrani membuka nuansa tindakan yang tengah berlangsung atau segera terlaksana. “Sedang ... berikan” mempertahankan ketegangan antara janji pemberian dan penguasaan negeri yang belum tuntas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk memperjelas bahwa sapaan Ibrani berbentuk jamak. “Pegunungan” dipilih sebagai padanan geografis utama, dengan kemungkinan “gunung” dipertahankan dalam catatan kaki.
