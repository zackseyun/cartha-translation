id: DEU.1.39
reference: Deuteronomy 1:39
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/טַפְּ/כֶם֩ אֲשֶׁ֨ר אֲמַרְתֶּ֜ם לָ/בַ֣ז יִהְיֶ֗ה וּ֠/בְנֵי/כֶם אֲשֶׁ֨ר לֹא יָדְע֤וּ הַ/יּוֹם֙ ט֣וֹב וָ/רָ֔ע הֵ֖מָּה יָבֹ֣אוּ שָׁ֑מָּ/ה וְ/לָ/הֶ֣ם אֶתְּנֶ֔/נָּה וְ/הֵ֖ם יִירָשֽׁוּ/הָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/039.yaml
  text: And your little ones[a], whom you said would become plunder, and your children, who today do not know good or evil—they shall go in there, and I will give it to them[c][b], and they shall possess it.
translation:
  language: id
  text: Dan anak-anak kecilmu, yang kamu katakan akan menjadi rampasan, serta anak-anakmu yang pada hari ini belum mengenal yang baik dan yang jahat[a]—merekalah yang akan masuk ke sana. Kepada merekalah Aku akan memberikan negeri itu, dan mereka akan memilikinya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '''Belum mengenal yang baik dan yang jahat'' adalah ungkapan Ibrani yang menunjukkan belum matangnya kemampuan untuk membedakan.'
    reason: cultural_note
  - marker: b
    text: Atau, “akan mewarisinya” atau “akan mengambilnya menjadi milik mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  choice: anak-anak kecilmu
  rationale: טַף menunjuk pada anak-anak kecil atau anggota keluarga yang masih bergantung; ungkapan ini mempertahankan kesan rentan dalam konteks.
- source_word: לָבַז יִהְיֶה
  choice: akan menjadi rampasan
  rationale: בַּז adalah jarahan atau rampasan yang direbut musuh; 'menjadi rampasan' alami dalam bahasa Indonesia dan sesuai dengan ketakutan Israel.
- source_word: בְנֵיכֶם
  choice: anak-anakmu
  rationale: Walaupun bentuk Ibraninya secara harfiah dapat berarti 'anak-anak lelakimu', dalam konteks ini acuannya adalah generasi keturunan mereka secara umum; 'anak-anakmu' menyampaikan cakupan itu secara wajar tanpa menghapus perbedaan dari טַף.
- source_word: לֹא יָדְעוּ הַיּוֹם טוֹב וָרָע
  choice: pada hari ini belum mengenal yang baik dan yang jahat
  rationale: Mempertahankan ungkapan Ibrani dan ambiguitasnya mengenai belum matangnya kemampuan membedakan, tanpa mengubahnya menjadi pernyataan doktrinal tentang kepolosan atau pertanggungjawaban.
- source_word: שָׁמָּה
  choice: masuk ke sana
  rationale: Akhiran arah pada שָׁמָּה dan verba 'datang/masuk' menunjuk pada gerakan memasuki negeri yang telah dibicarakan.
- source_word: אֶתְּנֶנָּה
  choice: Aku akan memberikan negeri itu
  rationale: Pronomina objek feminin mengacu pada negeri; menyebut 'negeri itu' menghindari ketidakjelasan pronomina dalam bahasa Indonesia.
- source_word: יִירָשׁוּהָ
  choice: mereka akan memilikinya
  rationale: ירשׁ dalam konteks ini mencakup menerima dan mengambil kepemilikan atas negeri; 'memilikinya' mempertahankan arti luas tanpa membatasi pada nuansa warisan saja.
theological_decisions:
- issue: Keadaan moral generasi berikutnya dalam frasa 'belum mengenal yang baik dan yang jahat'
  choice: Mempertahankan idiom sebagai gambaran belum matangnya daya pengertian moral.
  alternative: Menafsirkannya secara tegas sebagai ketidakbersalahan, tidak adanya tanggung jawab perjanjian, atau doktrin tentang usia pertanggungjawaban.
  rationale: Teks membedakan generasi dewasa yang dihukum dari anak-anak mereka, tetapi ungkapan Ibrani itu sendiri tidak menyelesaikan perdebatan teologis yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Struktur kalimat dibuat alami, sementara pengulangan emphatic הֵמָּה ... וְלָהֶם ... וְהֵם ditampilkan melalui 'merekalah' dan 'kepada merekalah'. Semua penanda catatan kaki muncul dalam teks utama.
