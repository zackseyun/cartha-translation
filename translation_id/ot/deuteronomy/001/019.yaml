  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/נִּסַּ֣ע מֵ/חֹרֵ֗ב וַ/נֵּ֡לֶךְ אֵ֣ת כָּל הַ/מִּדְבָּ֣ר הַ/גָּדוֹל֩ וְ/הַ/נּוֹרָ֨א הַ/ה֜וּא אֲשֶׁ֣ר רְאִיתֶ֗ם דֶּ֚רֶךְ הַ֣ר הָֽ/אֱמֹרִ֔י כַּ/אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵ֖י/נוּ אֹתָ֑/נוּ וַ/נָּבֹ֕א עַ֖ד קָדֵ֥שׁ בַּרְנֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/019.yaml
  text: Then we set out from Horeb and went through all that great and fearsome wilderness that you saw on the way to the hill country of the Amorites[a], just as Yahweh our God commanded us, and we came as far as Kadesh-barnea.
translation:
  language: id
  text: Kemudian kita berangkat dari Horeb dan menempuh seluruh padang gurun yang luas dan menakutkan[a] itu, yang kalian lihat, melalui jalan menuju daerah pegunungan orang Amori, sebagaimana Yahweh, Allah kita, perintahkan kepada kita. Lalu kita tiba di Kadesh-Barnea.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “luas dan dahsyat.” Kata Ibrani yang diterjemahkan “menakutkan” dapat menggambarkan sesuatu yang membangkitkan rasa takut, gentar, atau takjub.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּסַּע
  choice: kita berangkat
  rationale: Dalam konteks perjalanan, bentuk kata kerja נסע menyatakan tindakan membongkar perkemahan lalu mulai berangkat. “Berangkat” menyampaikan makna itu secara alami dalam bahasa Indonesia.
- source_word: וַנֵּלֶךְ אֵת כָּל הַמִּדְבָּר
  choice: berjalan melintasi seluruh padang gurun
  rationale: הלך dengan penanda objek אֵת di sini menggambarkan tindakan menempuh kawasan padang gurun tersebut. “Melintasi” membuat hubungan sintaksisnya jelas dan wajar dalam bahasa Indonesia.
- source_word: הַמִּדְבָּר
  choice: padang gurun
  rationale: מִדְבָּר menunjuk wilayah liar dan jarang dihuni, tidak selalu berupa gurun pasir. “Padang gurun” merupakan padanan baku yang sesuai dengan konteks perjalanan Israel.
- source_word: הַגָּדוֹל
  choice: luas
  rationale: Secara harfiah גָּדוֹל berarti “besar”. Ketika menerangkan wilayah, “luas” lebih alami dalam bahasa Indonesia dan menyampaikan besarnya kawasan itu.
- source_word: וְהַנּוֹרָא
  choice: dan menakutkan
  rationale: נוֹרָא menggambarkan sesuatu yang membangkitkan rasa takut, gentar, atau kedahsyatan. “Menakutkan” mempertahankan daya emosionalnya tanpa menentukan apakah rasa itu hanya takut atau juga takjub.
- source_word: אֲשֶׁר רְאִיתֶם
  choice: yang telah kalian lihat
  rationale: Klausa relatif ini mengingatkan para pendengar pada pengalaman mereka sendiri. “Kalian” membedakan orang banyak yang disapa dari “kita” yang mencakup Musa bersama Israel.
- source_word: דֶּרֶךְ הַר הָאֱמֹרִי
  choice: menuju pegunungan orang Amori
  rationale: דֶּרֶךְ dapat menunjukkan jalan atau arah perjalanan, sedangkan הַר di sini menunjuk daerah perbukitan atau pegunungan secara kolektif, bukan satu gunung tertentu.
- source_word: כַּאֲשֶׁר צִוָּה
  choice: tepat seperti yang diperintahkan
  rationale: כַּאֲשֶׁר menyatakan kesesuaian perjalanan itu dengan perintah ilahi. “Tepat seperti” mempertahankan penekanan tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap tampak dan tidak diganti dengan gelar.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Padanan langsung bagi bentuk dengan akhiran orang pertama jamak, yang menyatakan hubungan Allah dengan komunitas penutur.
- source_word: קָדֵשׁ בַּרְנֵעַ
  choice: Kadesh-Barnea
  rationale: Nama tempat ditransliterasikan dalam bentuk yang lazim digunakan dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani secara langsung memakai nama perjanjian YHWH. Bentuk “Yahweh” mempertahankannya sebagai nama pribadi tanpa menggantinya dengan gelar atau memilih vokalisasi alternatif.
- issue: Cakupan kata ganti dalam pidato Musa
  choice: “kita” untuk bentuk orang pertama jamak dan “kalian” untuk orang kedua jamak
  alternative: “kami” dan “kamu”
  rationale: “Kita” mencakup Musa dan umat dalam perjalanan bersama, sedangkan “kalian” dengan jelas menyapa umat secara jamak. Pilihan ini mempertahankan perbedaan peserta yang terdapat dalam bentuk-bentuk Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat, dengan susunan naratif yang mudah dipahami. Nama ilahi dan nama tempat ditransliterasikan. Istilah “pegunungan” dipakai secara kolektif untuk הַר, sementara “kalian” menandai sapaan jamak secara jelas.
