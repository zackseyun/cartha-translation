  naturalness: Bahasanya umumnya baku dan mudah dipahami. "Menempuh" lebih alami daripada "berjalan melintasi" untuk kawasan yang luas, sedangkan "sebagaimana Yahweh, Allah kita, perintahkan kepada kita" secara jelas mempertahankan subjek dan sasaran perintah.
  terminology: '"Yahweh", "Allah kita", "Horeb", "orang Amori", dan "Kadesh-Barnea" tepat. "Padang gurun" adalah padanan baku yang sesuai untuk מִדְבָּר. "Luas dan menakutkan" dapat dipertahankan; catatan kaki secara memadai menjelaskan cakupan makna נוֹרָא.'
