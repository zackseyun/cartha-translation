  yaml_path: translation/ot/deuteronomy/001/023.yaml
  text: And the matter seemed good in my eyes[a], so I took from among you twelve men, one man for each tribe.
translation:
  language: id
  text: Usul itu tampak baik bagiku[a], maka aku mengambil dari antara kalian dua belas laki-laki, satu laki-laki dari setiap suku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Usul itu menyenangkan hatiku.”'
    reason: Alternatif ini menyampaikan nuansa וַיִּיטַב בְּעֵינַי, yaitu bahwa usul tersebut berkenan atau menyenangkan bagi Musa.
lexical_decisions:
- source_word: וַיִּיטַב בְּעֵינַי
  choice: baik dalam pandanganku
  rationale: Ungkapan ini menyatakan penilaian dan persetujuan pribadi Musa. Bentuk 'dalam pandanganku' mempertahankan corak idiom Ibrani, sedangkan 'baik' menyampaikan makna penerimaan tanpa menambah tafsiran.
- source_word: הַדָּבָר
  choice: usul itu
  rationale: Dalam konteks, דָּבָר menunjuk pada usul yang baru diajukan umat. 'Usul itu' lebih alami dan tepat daripada terjemahan harfiah 'hal itu'.
- source_word: וָאֶקַּח
  choice: aku mengambil
  rationale: לקח secara dasar berarti 'mengambil'. Terjemahan ini mempertahankan bentuk sumber, walaupun dalam konteks tindakan tersebut juga mencakup pemilihan.
- source_word: מִכֶּם
  choice: dari antara kalian
  rationale: מן menunjukkan bahwa kedua belas orang itu diambil dari dalam kelompok yang disapa.
- source_word: שְׁנֵים עָשָׂר אֲנָשִׁים
  choice: dua belas orang
  rationale: Dalam bahasa Indonesia, 'orang' merupakan sebutan alami bagi individu manusia; konteks dan kelanjutan ayat menunjukkan bahwa mereka laki-laki tanpa perlu ungkapan kaku 'dua belas laki-laki'.
- source_word: אִישׁ אֶחָד לַשָּׁבֶט
  choice: satu orang dari setiap suku
  rationale: 'Ungkapan ini bersifat distributif: setiap suku menyumbangkan satu orang. ''Dari setiap suku'' juga memperjelas hubungan pemilihan dengan מִכֶּם.'
