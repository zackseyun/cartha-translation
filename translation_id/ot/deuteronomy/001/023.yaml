translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Kata ganti 'aku' dan 'kalian' sesuai dengan tuturan langsung Musa kepada umat. Idiom sumber dipertahankan dalam bentuk yang tetap mudah dipahami.
