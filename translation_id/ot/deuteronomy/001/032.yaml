  text: וּ/בַ/דָּבָ֖ר הַ/זֶּ֑ה אֵֽינְ/כֶם֙ מַאֲמִינִ֔ם בַּ/יהוָ֖ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/032.yaml
  text: Yet in this matter you did not believe in Yahweh your God[a].
translation:
  language: id
  text: Namun dalam hal ini kamu tidak percaya kepada TUHAN, Allahmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kamu tidak memercayai TUHAN, Allahmu”; dapat juga diterjemahkan “kamu tidak menaruh kepercayaan kepada TUHAN, Allahmu.”
    reason: Alternatif leksikal untuk אמן + ב, yang dapat menyatakan percaya kepada seseorang, memercayainya, atau menaruh kepercayaan kepadanya.
lexical_decisions:
- source_word: וּ/בַ/דָּבָר הַ/זֶּה
  choice: Namun dalam hal ini
  rationale: דָּבָר menunjuk pada perkara yang baru saja diceritakan, bukan sekadar sebuah perkataan. וּ dalam konteks teguran ini wajar diterjemahkan secara adversatif dengan “Namun”.
- source_word: אֵינְ/כֶם מַאֲמִינִם
  choice: kamu tidak percaya
  rationale: Partikel negatif dengan partisip Hifil אמן menggambarkan sikap tidak percaya yang sedang berlangsung dalam peristiwa tersebut. Bentuk Indonesia “tidak percaya” alami dan tidak memaksakan aspek yang lebih khusus.
- source_word: בַּ/יהוָה
  choice: kepada TUHAN
  rationale: Preposisi ב dengan אמן menandai pribadi yang menjadi sasaran kepercayaan. “Percaya kepada” merupakan ungkapan Indonesia yang alami dan tetap dapat mencakup menerima firman-Nya maupun menaruh kepercayaan kepada-Nya. Nama perjanjian יהוה ditampilkan menurut konvensi sebagai “TUHAN”.
- source_word: אֱלֹהֵי/כֶם
  choice: Allahmu
  rationale: Bentuk konstruksi dengan sufiks orang kedua jamak diterjemahkan langsung sebagai “Allahmu”; dalam bahasa Indonesia, “-mu” dapat menyapa kelompok secara kolektif sebagaimana konteks pidato Musa.
theological_decisions:
- issue: Makna אמן + ב ketika TUHAN menjadi objeknya
  choice: percaya kepada TUHAN, Allahmu
  alternative: memercayai TUHAN, Allahmu; percaya akan TUHAN, Allahmu; menaruh kepercayaan kepada TUHAN, Allahmu
  rationale: Konstruksi Ibrani dapat menyatakan percaya kepada atau memercayai seseorang. Konteks menyoroti penolakan Israel untuk menerima janji dan jaminan TUHAN, tetapi frasa sumber juga mengandung dimensi kepercayaan pribadi. “Percaya kepada” mempertahankan keluasan itu tanpa membatasi ayat pada persetujuan terhadap suatu pernyataan saja.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Namun” menyampaikan kontras dalam teguran Musa; “dalam hal ini” mengacu pada perkara yang baru diuraikan. Bentuk “Allahmu” mengikuti sapaan kolektif orang kedua jamak dalam konteks.
