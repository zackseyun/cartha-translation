  text: וַ/תִּקְרְב֣וּ/ן אֵלַ/י֮ כֻּלְּ/כֶם֒ וַ/תֹּאמְר֗וּ נִשְׁלְחָ֤ה אֲנָשִׁים֙ לְ/פָנֵ֔י/נוּ וְ/יַחְפְּרוּ לָ֖/נוּ אֶת הָ/אָ֑רֶץ וְ/יָשִׁ֤בוּ אֹתָ֨/נוּ֙ דָּבָ֔ר אֶת הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר נַעֲלֶה בָּ֔/הּ וְ/אֵת֙ הֶֽ/עָרִ֔ים אֲשֶׁ֥ר נָבֹ֖א אֲלֵי/הֶֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/022.yaml
  text: Then all of you came near to me and said[a], ‘Let us send men ahead of us, so that they may explore the land for us and bring us back word of the way by which we should go up into it[b], and of the cities into which we shall come.’
translation:
  language: id
  text: Lalu kamu semua mendekati aku dan berkata, “Mari kita mengutus beberapa orang mendahului kita untuk menyelidiki negeri itu bagi kita[a] dan membawa kembali kepada kita kabar tentang jalan yang harus kita tempuh untuk naik ke sana[b], serta tentang kota-kota yang akan kita datangi.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengintai negeri itu bagi kita.” Kata kerja Ibrani dapat berarti mencari tahu atau menyelidiki; “menyelidiki” dipilih sebagai ungkapan modern yang tidak secara khusus menyiratkan kegiatan rahasia.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “jalan yang harus kita lalui untuk naik ke sana.” “Naik” merupakan ungkapan yang lazim dalam Alkitab untuk perjalanan memasuki negeri itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרְבוּן אֵלַי כֻּלְּכֶם
  choice: Lalu kamu semua mendekati aku
  rationale: ‘Mendekati’ menyampaikan makna konkret קָרַב, sedangkan ‘kamu semua’ mempertahankan penegasan כֻּלְּכֶם.
- source_word: נִשְׁלְחָה אֲנָשִׁים
  choice: Mari kita mengutus beberapa orang
  rationale: Bentuk kohortatif נִשְׁלְחָה menyatakan ajakan. Dalam konteks ini אֲנָשִׁים menunjuk orang-orang yang dipilih; ‘beberapa orang’ alami dalam bahasa Indonesia tanpa menambahkan jumlah tertentu.
- source_word: לְפָנֵינוּ
  choice: mendahului kita
  rationale: Ungkapan ini secara idiomatis menyatakan bahwa mereka diutus lebih dahulu daripada rombongan utama.
- source_word: וְיַחְפְּרוּ לָנוּ אֶת הָאָרֶץ
  choice: untuk menyelidiki negeri itu bagi kita
  rationale: חָפַר di sini berarti mencari tahu atau memeriksa dengan saksama dalam konteks pengintaian. ‘Menyelidiki’ mempertahankan cakupan makna tanpa memastikan bahwa kegiatannya harus dilakukan secara rahasia.
- source_word: וְיָשִׁבוּ אֹתָנוּ דָּבָר
  choice: dan membawa kembali kepada kita kabar
  rationale: Terjemahan ini mempertahankan gambaran idiomatis Hifil שׁוּב dengan דָּבָר, yaitu membawa kembali sebuah laporan atau kabar.
- source_word: אֶת הַדֶּרֶךְ אֲשֶׁר נַעֲלֶה בָּהּ
  choice: tentang jalan yang harus kita tempuh untuk masuk ke sana
  rationale: דֶּרֶךְ diterjemahkan ‘jalan’, sementara עָלָה dalam konteks perjalanan menuju negeri itu dinaturalkan menjadi ‘masuk ke sana’; nuansa harfiah ‘naik’ dicatat dalam catatan kaki.
- source_word: וְאֵת הֶעָרִים אֲשֶׁר נָבֹא אֲלֵיהֶן
  choice: serta tentang kota-kota yang akan kita datangi
  rationale: Frasa ini meminta keterangan mengenai kota-kota tujuan. ‘Datangi’ alami dalam bahasa Indonesia dan tidak memaksakan apakah kota-kota itu sekadar dicapai atau dimasuki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan penegasan ‘kamu semua’, bentuk ajakan, tujuan penyelidikan, laporan mengenai rute, dan kota-kota tujuan.
