id: DEU.1.8
reference: Deuteronomy 1:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: רְאֵ֛ה נָתַ֥תִּי לִ/פְנֵי/כֶ֖ם אֶת הָ/אָ֑רֶץ בֹּ֚אוּ וּ/רְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁ֣ר נִשְׁבַּ֣ע יְ֠הוָה לַ/אֲבֹ֨תֵי/כֶ֜ם לְ/אַבְרָהָ֨ם לְ/יִצְחָ֤ק וּֽ/לְ/יַעֲקֹב֙ לָ/תֵ֣ת לָ/הֶ֔ם וּ/לְ/זַרְעָ֖/ם אַחֲרֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/008.yaml
  text: See[a], I have set the land before you. Go in and take possession of the land that Yahweh swore to your fathers—to Abraham, to Isaac[d][c][b], and to Jacob—to give to them and to their offspring after them.
translation:
  language: id
  text: Lihatlah,[a] Aku telah menempatkan negeri itu di hadapan kalian. Masuklah dan ambillah[b] negeri itu menjadi milik kalian, negeri yang Yahweh telah bersumpah kepada para bapa kalian—kepada Abraham, kepada Ishak, dan kepada Yakub—untuk memberikannya kepada mereka dan kepada keturunan mereka sesudah mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Perhatikanlah.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani ini dapat juga berarti “dudukilah,” “milikilah,” atau “warisilah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Lihatlah
  rationale: Imperatif tunggal yang mengarahkan perhatian dengan tegas; bentuk ini alami dan bermartabat dalam bahasa Indonesia.
- source_word: נָתַתִּי לִפְנֵיכֶם
  choice: Aku telah menempatkan ... di hadapan kalian
  rationale: Dalam konstruksi dengan לִפְנֵי, נתן menyatakan tindakan menaruh atau menyediakan sesuatu di hadapan orang; bentuk perfektum dipertahankan dengan 'telah'.
- source_word: הָאָרֶץ
  choice: negeri itu
  rationale: Dalam konteks ini אֶרֶץ menunjuk pada wilayah yang dijanjikan. 'Negeri' terdengar alami untuk wilayah tempat suatu bangsa akan tinggal, sedangkan 'itu' menandai rujukan yang sudah tertentu.
- source_word: בֹּאוּ
  choice: Masuklah
  rationale: Imperatif jamak yang memerintahkan umat memasuki negeri tersebut; bahasa Indonesia tidak perlu menambahkan arah 'pergi'.
- source_word: וּרְשׁוּ
  choice: dan dudukilah
  rationale: ירשׁ dalam konteks penaklukan dan pembagian negeri berarti mengambil serta memegangnya sebagai milik. 'Duduki' mempertahankan daya aktifnya tanpa membatasi makna pada pewarisan saja.
- source_word: נִשְׁבַּע יְהוָה
  choice: telah dijanjikan dengan sumpah oleh Yahweh
  rationale: נשבע secara harfiah berarti bersumpah. Rumusan pasif ini alami dalam klausa relatif Indonesia dan mempertahankan bahwa janji tersebut diteguhkan dengan sumpah.
- source_word: לַאֲבֹתֵיכֶם
  choice: kepada leluhur kalian
  rationale: Walaupun bentuk Ibraninya maskulin, nama Abraham, Ishak, dan Yakub langsung menjelaskan siapa yang dimaksud. 'Leluhur' merupakan istilah Indonesia modern yang wajar dan tidak mengaburkan rujukan khusus itu.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: kepada Abraham, kepada Ishak, dan kepada Yakub
  rationale: Pengulangan 'kepada' mencerminkan pengulangan preposisi Ibrani dan memberikan irama serta penekanan yang tetap alami.
- source_word: לָתֵת לָהֶם וּלְזַרְעָם אַחֲרֵיהֶם
  choice: untuk diberikan kepada mereka dan kepada keturunan mereka sesudah mereka
  rationale: זֶרַע adalah nomina kolektif tunggal; 'keturunan' mempertahankan makna kolektifnya dan lebih jelas daripada 'benih' dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memuat nama perjanjian YHWH secara langsung. 'Yahweh' menyajikan nama itu, bukan menggantinya dengan gelar.
- issue: Cakupan אֲבֹתֵיכֶם
  choice: leluhur kalian
  alternative: bapak-bapak kalian
  rationale: Abraham, Ishak, dan Yakub yang disebut sesudahnya memastikan rujukan kepada para bapa leluhur. Pilihan ini alami dalam bahasa Indonesia tanpa mengubah identitas tokoh yang dimaksud.
- issue: Relasi pemberian kepada para leluhur dan keturunan mereka
  choice: kepada mereka dan kepada keturunan mereka sesudah mereka
  alternative: kepada keturunan mereka setelah mereka
  rationale: Pronomina לָהֶם dipertahankan agar janji kepada para leluhur sendiri tidak dilebur ke dalam janji kepada keturunannya, sehingga ketegangan teologis teks tetap terjaga.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung dan khidmat. 'Kalian' dipakai karena bentuk Ibrani yang disapa bersifat jamak, sedangkan 'Lihatlah' mempertahankan imperatif tunggal kolektif pada רְאֵה. Semua penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan.
