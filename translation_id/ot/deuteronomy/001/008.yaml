revisions:
- from: Lihatlah,[a] Aku telah menempatkan negeri itu di hadapan kalian. Masuklah dan dudukilah[b] negeri yang telah dijanjikan dengan sumpah oleh Yahweh kepada leluhur kalian—kepada Abraham, kepada Ishak, dan kepada Yakub—untuk diberikan kepada mereka dan kepada keturunan mereka sesudah mereka.
  to: Lihatlah,[a] Aku telah menempatkan negeri itu di hadapan kalian. Masuklah dan ambillah[b] negeri itu menjadi milik kalian, negeri yang Yahweh telah bersumpah kepada para bapa kalian—kepada Abraham, kepada Ishak, dan kepada Yakub—untuk memberikannya kepada mereka dan kepada keturunan mereka sesudah mereka.
  rationale: Revisi mempertahankan imperatif pembuka, perfektum “telah menempatkan,” nama Yahweh, pengulangan “kepada” pada nama para patriark, serta janji kepada mereka dan keturunan mereka. Istilah “para bapa” dipakai untuk mencerminkan אֲבֹתֵיכֶם secara lebih akurat, dan susunan klausa sumpah dibuat lebih dekat dengan teks sumber tanpa mengorbankan kelancaran bahasa Indonesia.
