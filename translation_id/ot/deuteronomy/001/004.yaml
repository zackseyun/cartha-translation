  text: אַחֲרֵ֣י הַכֹּת֗/וֹ אֵ֚ת סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּ֑וֹן וְ/אֵ֗ת ע֚וֹג מֶ֣לֶךְ הַ/בָּשָׁ֔ן אֲשֶׁר יוֹשֵׁ֥ב בְּ/עַשְׁתָּרֹ֖ת בְּ/אֶדְרֶֽעִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/004.yaml
  text: after he had struck down Sihon king of the Amorites[a], who lived in Heshbon, and Og king of Bashan, who lived in Ashtaroth at Edrei.
translation:
  language: id
  text: setelah ia mengalahkan Sihon, raja orang Amori, yang tinggal di Hesbon, dan Og, raja Basan, yang tinggal di Asytarot, di Edrei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “yang tinggal di Asytarot dan Edrei.” Dalam bahasa Ibrani, kedua tempat itu masing-masing didahului kata “di”, dan hubungan tepat antara keduanya tidak dinyatakan sepenuhnya.
    reason: alternative_reading
lexical_decisions:
- source_word: אַחֲרֵי הַכֹּתוֹ
  choice: setelah ia menewaskan
  rationale: Gabungan preposisi temporal dan infinitif konstruk menyatakan tindakan yang terjadi sebelum Musa berbicara pada ayat 3. “Menewaskan” mempertahankan daya verba נכה dalam konteks kekalahan raja-raja itu, tanpa memperlemahnya menjadi sekadar “mengalahkan”.
- source_word: סִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: Sihon, raja orang Amori
  rationale: Nama diri ditransliterasikan, sedangkan rantai konstruk dan sebutan etnis diterjemahkan secara alami dan eksplisit.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: yang tinggal di Hesbon
  rationale: Dalam konteks tempat kediaman atau pusat pemerintahan, יָשַׁב secara wajar berarti “tinggal”; preposisi ב diterjemahkan “di”.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: Og, raja Basan
  rationale: Rantai konstruk diterjemahkan dengan bentuk Indonesia yang ringkas dan lazim; Basan adalah nama wilayah.
- source_word: אֲשֶׁר יוֹשֵׁב בְּעַשְׁתָּרֹת בְּאֶדְרֶעִי
  choice: yang tinggal di Asytarot, di Edrei
  rationale: Pengulangan preposisi ב dipertahankan sejauh mungkin dengan dua frasa “di”, agar hubungan tepat antara kedua nama tempat tidak ditentukan secara berlebihan.
theological_decisions:
- issue: Hubungan Asytarot dan Edrei dalam frasa dengan dua preposisi ב
  choice: yang tinggal di Asytarot, di Edrei
  alternative: yang tinggal di Asytarot dan Edrei
  rationale: Teks Ibrani menyebut kedua tempat dengan pengulangan ב tetapi tidak menjelaskan secara penuh hubungan sintaktis atau geografisnya. Teks utama mempertahankan kepadatan dan ambiguitas itu, sedangkan alternatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda koma membantu memperjelas aposisi gelar kerajaan serta mempertahankan dua keterangan tempat tanpa memaksakan hubungan yang tidak eksplisit dalam bahasa Ibrani.
