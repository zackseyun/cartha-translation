  text: וַ/יִּקְח֤וּ בְ/יָדָ/ם֙ מִ/פְּרִ֣י הָ/אָ֔רֶץ וַ/יּוֹרִ֖דוּ אֵלֵ֑י/נוּ וַ/יָּשִׁ֨בוּ אֹתָ֤/נוּ דָבָר֙ וַ/יֹּ֣אמְר֔וּ טוֹבָ֣ה הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵ֖י/נוּ נֹתֵ֥ן לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/025.yaml
  text: And they took in their hands some of the fruit of the land and brought it down to us[a], and they brought us back word and said, “The land that Yahweh our God is giving to us is good.”
translation:
  language: id
  text: Mereka mengambil dengan tangan mereka sebagian dari hasil tanah itu dan membawanya turun kepada kami. Lalu mereka menyampaikan laporan kepada kami dan berkata, “Tanah yang Yahweh, Allah kita, sedang berikan kepada kita itu baik.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְחוּ בְיָדָם
  choice: Mereka mengambil dengan tangan mereka
  rationale: Mempertahankan tindakan konkret mengambil dan membawa hasil tanah dengan tangan, sesuai ungkapan Ibrani.
- source_word: מִפְּרִי הָאָרֶץ
  choice: sebagian dari hasil tanah itu
  rationale: מִן bersifat partitif, sehingga yang diambil ialah sampel hasil tanah, bukan seluruh hasilnya. 'Hasil tanah' lebih alami dalam bahasa Indonesia daripada 'buah tanah' dan mencakup hasil bumi.
- source_word: וַיּוֹרִדוּ אֵלֵינוּ
  choice: membawanya turun kepada kami
  rationale: Bentuk Hifil dari ירד memuat arah turun; unsur ini dipertahankan, kemungkinan merujuk pada perjalanan dari wilayah perbukitan menuju perkemahan.
- source_word: וַיָּשִׁבוּ אֹתָנוּ דָבָר
  choice: mereka menyampaikan laporan kepada kami
  rationale: Ungkapan Ibrani berarti membawa kembali kabar atau laporan. Terjemahan ini menyampaikan maknanya secara alami; gagasan kembali tersirat dalam laporan para pengintai setelah perjalanan mereka.
- source_word: טוֹבָה הָאָרֶץ
  choice: Tanah ... itu baik
  rationale: טוֹבָה memberi penilaian positif yang luas; 'baik' merupakan padanan langsung dan wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks sumber, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Padanan baku dan alami bagi ungkapan perjanjian 'Allah kita'.
- source_word: נֹתֵן לָנוּ
  choice: yang diberikan ... kepada kita
  rationale: Partisip Ibrani menggambarkan tindakan pemberian yang sedang berlangsung atau dipandang pasti. Dalam klausa relatif bahasa Indonesia, 'diberikan ... kepada kita' alami dan mempertahankan penerima yang eksplisit.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian secara langsung; 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Aspek נֹתֵן dalam janji pemberian tanah
  choice: yang diberikan Yahweh ... kepada kita
  alternative: yang akan diberikan Yahweh ... kepada kita
  rationale: Bentuk partisip tidak harus dibatasi pada masa depan. Pilihan ini menjaga ketegangan antara proses pemberian yang sedang berlangsung dan kepastian pemberian itu, tanpa menambahkan penanda waktu yang tidak eksplisit.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat dipecah menjadi dua agar rangkaian narasi mudah dipahami. Ungkapan arah 'turun' dipertahankan karena eksplisit dalam bahasa Ibrani; idiom laporan diterjemahkan secara alami tanpa catatan kaki karena tidak menimbulkan ambiguitas penting dalam bahasa Indonesia.
