  text: זֽוּלָתִ֞י כָּלֵ֤ב בֶּן יְפֻנֶּה֙ ה֣וּא יִרְאֶ֔/נָּה וְ/לֽ/וֹ אֶתֵּ֧ן אֶת הָ/אָ֛רֶץ אֲשֶׁ֥ר דָּֽרַךְ בָּ֖/הּ וּ/לְ/בָנָ֑י/ו יַ֕עַן אֲשֶׁ֥ר מִלֵּ֖א אַחֲרֵ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/036.yaml
  text: except Caleb son of Jephunneh; he shall see it[a], and to him I will give the land on which he has walked, and to his sons, because he has fully followed Yahweh.
translation:
  language: id
  text: kecuali Kaleb anak Yefune. Dialah yang akan melihat negeri itu. Kepadanya akan Kuberikan negeri yang telah diinjaknya itu, juga kepada putra-putranya[a], karena ia sepenuhnya mengikuti Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anak-anaknya” atau “keturunannya”; secara harfiah, “putra-putranya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֽוּלָתִ֞י
  choice: kecuali
  rationale: Menandai Kaleb sebagai pengecualian dari hukuman yang dinyatakan sebelumnya; ini padanan Indonesia yang langsung dan alami.
- source_word: כָּלֵ֤ב בֶּן יְפֻנֶּה֙
  choice: Kaleb bin Yefune
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia; “bin” secara ringkas mempertahankan hubungan ayah-anak.
- source_word: ה֣וּא יִרְאֶ֔נָּה
  choice: Dialah yang akan melihat negeri itu
  rationale: Kata ganti הוּא bersifat menegaskan, sedangkan akhiran feminin pada verba merujuk kepada negeri; “Dialah” mempertahankan penekanan tersebut.
- source_word: וְלֽוֹ אֶתֵּ֧ן
  choice: Kepadanya ... akan Kuberikan
  rationale: Penempatan “kepadanya” di awal mempertahankan penekanan datif dalam bahasa Ibrani, sementara susunan kalimat tetap wajar dalam bahasa Indonesia.
- source_word: הָאָ֛רֶץ
  choice: negeri
  rationale: Dalam konteks Ulangan, kata ini menunjuk kepada wilayah yang dijanjikan. “Negeri” alami dalam bahasa Indonesia dan cocok untuk wilayah tempat suatu umat akan menetap.
- source_word: אֲשֶׁ֥ר דָּֽרַךְ בָּ֖הּ
  choice: yang telah diinjaknya itu
  rationale: Mempertahankan gambaran konkret verba דרך, yaitu menginjak atau menapaki tanah, tanpa memakai ungkapan yang terlalu kuno.
- source_word: וּלְבָנָ֑יו
  choice: dan kepada anak-anak lelakinya
  rationale: Kata Ibrani secara harfiah berarti “anak-anak lelakinya.” Bentuk ini dipertahankan dalam teks, sementara kemungkinan cakupan keturunan yang lebih luas dicatat dalam catatan kaki.
- source_word: יַ֕עַן אֲשֶׁ֥ר
  choice: karena
  rationale: Menyatakan alasan bagi janji kepada Kaleb secara ringkas dan alami.
- source_word: מִלֵּ֖א אַחֲרֵ֥י
  choice: mengikuti ... dengan sepenuh hati
  rationale: Ungkapan Ibrani harfiah “memenuhi di belakang” merupakan idiom untuk mengikuti dengan penuh atau setia; padanan ini menyampaikan daya idiomatiknya secara jelas.
- source_word: יְהוָֽה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi yang muncul langsung dalam teks Ibrani, alih-alih menggantinya dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama tersebut dan membedakannya dari gelar ilahi.
- issue: Cakupan בָּנָיו dalam konteks pemberian tanah
  choice: anak-anak lelakinya
  alternative: anak-anaknya atau keturunannya
  rationale: Bentuk Ibrani adalah nomina maskulin jamak dengan sufiks orang ketiga maskulin tunggal. Terjemahan utama mempertahankan bentuk eksplisit itu tanpa memastikan apakah konteks warisan memperluas acuannya kepada seluruh keturunan.
- issue: Makna idiom מִלֵּא אַחֲרֵי יְהוָה
  choice: mengikuti Yahweh dengan sepenuh hati
  alternative: mengikuti Yahweh sepenuhnya
  rationale: Pilihan ini menyampaikan kesetiaan menyeluruh yang dinyatakan idiom tersebut tanpa mengubahnya menjadi klaim tentang kesempurnaan moral Kaleb.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Dialah” mempertahankan penegasan Ibrani; “akan Kuberikan” menjaga suara langsung Allah. Catatan kaki ditempatkan pada frasa yang benar-benar diterangkannya, yaitu “anak-anak lelakinya.”
