base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/035.yaml
  text: Not one man among these men of this evil generation shall see the good land that I swore to give to your fathers—[a]
translation:
  language: id
  text: Tidak seorang pun dari antara orang-orang ini—angkatan yang jahat ini—akan melihat negeri yang baik yang telah Aku sumpahkan akan Kuberikan kepada nenek moyangmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “kepada bapak-bapakmu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Tidak seorang pun ... akan
  rationale: Dalam konteks sumpah penghukuman, אִם merupakan rumusan sumpah negatif, bukan syarat biasa. Ungkapan ini menyampaikan penyangkalan yang tegas dan alami dalam bahasa Indonesia.
- source_word: יִרְאֶה
  choice: akan melihat
  rationale: ראה secara langsung berarti 'melihat'. Dalam konteks ini, melihat negeri mencakup mengalami atau memasukinya, tetapi terjemahan mempertahankan ungkapan sumber tanpa mempersempit maknanya.
- source_word: אִישׁ בָּאֲנָשִׁים הָאֵלֶּה
  choice: seorang pun di antara orang-orang ini
  rationale: Bentuk tunggal אִישׁ dalam rumusan negatif bersifat distributif, sedangkan בָּאֲנָשִׁים partitif. Pilihan ini menyatakan bahwa tidak ada satu orang pun dari kelompok itu.
- source_word: הַדּוֹר הָרָע הַזֶּה
  choice: angkatan yang jahat ini
  rationale: דּוֹר berarti 'angkatan/generasi', dan רַע di sini bernilai moral. 'Angkatan' lazim dalam konteks kelompok sezaman dan 'jahat' mempertahankan bobot moralnya.
- source_word: אֶת הָאָרֶץ הַטּוֹבָה
  choice: negeri yang baik
  rationale: Terjemahan langsung yang mempertahankan penilaian positif atas negeri itu serta gema berkat perjanjian.
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי לָתֵת
  choice: yang telah Kujanjikan dengan sumpah untuk Kuberikan
  rationale: נִשְׁבַּעְתִּי berarti 'aku bersumpah'. Ungkapan Indonesia ini menjaga unsur janji sekaligus sifatnya sebagai sumpah, sedangkan נתן diterjemahkan langsung sebagai 'memberikan'.
- source_word: לַאֲבֹתֵיכֶם
  choice: kepada nenek moyangmu
  rationale: Secara harfiah berarti 'kepada bapak-bapakmu', tetapi dalam konteks ini menunjuk kepada para leluhur Israel. 'Nenek moyangmu' merupakan padanan Indonesia yang alami dan tidak menghilangkan rujukan leluhur; bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Cakupan לַאֲבֹתֵיכֶם
  choice: kepada nenek moyangmu
  alternative: kepada bapak-bapakmu
  rationale: Bentuk Ibrani secara gramatikal maskulin jamak, tetapi secara idiomatis merujuk kepada para leluhur, khususnya para bapa leluhur Israel. Teks utama memakai padanan Indonesia yang alami, sementara catatan kaki mempertahankan bentuk harfiahnya tanpa menetapkan identitas para leluhur lebih jauh daripada teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pengulangan 'orang-orang ini, yaitu angkatan yang jahat ini' dipertahankan untuk mencerminkan aposisi dan penekanan dalam bahasa Ibrani. Kapitalisasi enklitik pada 'Kujanjikan' dan 'Kuberikan' menandai bahwa pembicara adalah Allah sesuai konteks.
