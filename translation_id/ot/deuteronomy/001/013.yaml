  text: Choose for yourselves wise[a], discerning, and well-known men from your tribes[b], and I will appoint them as your heads.
translation:
  language: id
  text: Pilihlah bagi kalian sendiri laki-laki yang bijaksana, berpengertian, dan dikenal[a] dari suku-suku kalian. Aku akan mengangkat mereka menjadi pemimpin kalian[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “diakui” atau “terpandang”; kemungkinan menunjuk kepada laki-laki yang telah dikenal atau memiliki reputasi di kalangan suku-suku mereka.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “sebagai kepala-kepala kalian.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: Pilihlah
  rationale: Walaupun bentuk imperatif ini secara harfiah dapat berarti “berikanlah” atau “bawalah”, konteksnya meminta umat menentukan calon yang kemudian akan diangkat oleh Musa; “pilihlah” menyampaikan tindakan yang dimaksud secara alami.
- source_word: לָכֶם
  choice: bagi kalian sendiri
  rationale: Ungkapan ini menandakan bahwa umat memilih orang-orang itu bagi kepentingan mereka sendiri; unsur “sendiri” mempertahankan daya refleksif tanpa menjadikannya kaku.
- source_word: אֲנָשִׁים
  choice: orang-orang
  rationale: Dalam bahasa Indonesia, “orang-orang” merupakan padanan alami bagi bentuk jamak ini. Konteks tata kepemimpinan suku tetap menunjukkan bahwa yang dimaksud ialah para lelaki yang akan diangkat, tanpa perlu memakai ungkapan janggal “laki-laki” dalam daftar sifat.
- source_word: חֲכָמִים
  choice: bijaksana
  rationale: Dalam konteks pemilihan pemimpin dan hakim, kata ini menunjuk pada kebijaksanaan serta pertimbangan yang baik, bukan sekadar keterampilan teknis.
- source_word: וּנְבֹנִים
  choice: berpengertian
  rationale: Kata yang berasal dari בין ini menekankan kemampuan memahami dan menilai dengan tajam. “Berpengertian” mempertahankan pembedaan dari “bijaksana” dan terdengar wajar dalam daftar syarat pemimpin.
- source_word: וִידֻעִים
  choice: dikenal baik
  rationale: Bentuk pasif dari ידע kemungkinan menunjuk pada orang-orang yang dikenal atau diakui di kalangan suku mereka, yakni memiliki reputasi yang sudah terbukti. Catatan kaki mempertahankan kemungkinan nuansa “diakui”.
- source_word: לְשִׁבְטֵיכֶם
  choice: dari suku-suku kalian
  rationale: Dalam konteks pemilihan calon, frasa ini paling alami dipahami sebagai kelompok asal orang-orang yang dipilih, walaupun preposisi ל juga dapat memberi nuansa pengaturan menurut suku.
- source_word: וַאֲשִׂימֵם
  choice: Aku akan mengangkat mereka
  rationale: Dalam alur ujaran ini, tindakan Musa mengikuti pemilihan oleh umat. “Mengangkat” menyampaikan penetapan resmi ke dalam jabatan.
- source_word: בְּרָאשֵׁיכֶם
  choice: menjadi pemimpin atas kalian
  rationale: רֹאשׁ secara harfiah berarti “kepala”, tetapi di sini merupakan metafora bagi pemimpin. Padanan ini alami dalam bahasa Indonesia, sedangkan catatan kaki mempertahankan gambaran harfiahnya.
theological_decisions:
- issue: Rujukan maskulin dalam אֲנָשִׁים
  choice: orang-orang
  alternative: laki-laki
  rationale: אֲנָשִׁים berbentuk maskulin jamak dan dalam struktur kesukuan Israel merujuk kepada para lelaki yang dijadikan pemimpin. Namun, “orang-orang” adalah padanan lazim dan tidak ambigu secara gramatikal dalam bahasa Indonesia; konteks historis tidak diubah atau diperluas secara teologis.
- issue: Pembagian peran dalam pemilihan dan pengangkatan pemimpin
  choice: Umat memilih calon; Musa mengangkat mereka
  alternative: Musa sendiri memilih dan mengangkat mereka
  rationale: Urutan imperatif הָבוּ dan konsekuensi וַאֲשִׂימֵם membedakan tindakan umat dari tindakan Musa. Terjemahan mempertahankan ketegangan antara keterlibatan umat dan kewenangan Musa tanpa menyelaraskannya secara denominatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. “Kalian” dipakai karena Musa berbicara kepada umat secara jamak. Kalimat dibagi menjadi dua agar hubungan antara pemilihan oleh umat dan pengangkatan oleh Musa tetap jelas. Penanda catatan kaki ditempatkan pada unsur yang benar-benar dijelaskannya.
