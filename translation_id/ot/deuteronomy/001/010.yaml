  text: יְהוָ֥ה אֱלֹהֵי/כֶ֖ם הִרְבָּ֣ה אֶתְ/כֶ֑ם וְ/הִנְּ/כֶ֣ם הַ/יּ֔וֹם כְּ/כוֹכְבֵ֥י הַ/שָּׁמַ֖יִם לָ/רֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/010.yaml
  text: Yahweh your God has multiplied you[a], and behold, today you are as numerous as the stars of the heavens.
translation:
  language: id
  text: Yahweh, Allahmu, telah memperbanyak kamu. Lihatlah, hari ini kamu sebanyak bintang-bintang di langit[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “seperti bintang-bintang di langit, dalam jumlah besar.”'
    reason: Mempertahankan alternatif yang lebih dekat dengan susunan dan penegasan Ibrani כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Dalam konteks perjanjian, bentuk ini menunjuk kepada Allah yang disembah Israel; sufiks orang kedua jamak diterjemahkan secara alami dengan -mu yang merujuk kepada umat secara kolektif.
- source_word: הִרְבָּה אֶתְכֶם
  choice: telah membuat kamu menjadi banyak
  rationale: 'Bentuk Hifil dari רבה menyatakan sebab: Yahweh telah menjadikan umat itu banyak. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan peran Allah sebagai pelaku.'
- source_word: וְהִנְכֶם
  choice: Lihatlah
  rationale: Partikel deiktis ini menarik perhatian kepada keadaan umat saat itu; 'Lihatlah' mempertahankan daya retorisnya dalam bahasa Indonesia modern.
- source_word: הַיּוֹם
  choice: pada hari ini
  rationale: Menyampaikan acuan waktu kini dengan nada yang sedikit lebih khidmat daripada 'hari ini' saja.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב
  choice: jumlahmu sebanyak bintang-bintang di langit
  rationale: Menyampaikan perbandingan dan gagasan jumlah besar secara idiomatis. לָרֹב dipahami sebagai keterangan banyaknya jumlah, sedangkan הַשָּׁמַיִם secara alami diterjemahkan 'langit'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai nama perjanjian secara langsung. Transliterasi 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'kamu' dipakai untuk umat yang disapa secara jamak dan kolektif. Susunan kalimat dibuat alami tanpa menghilangkan penekanan retoris dari וְהִנְכֶם.
