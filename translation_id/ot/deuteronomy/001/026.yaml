base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/026.yaml
  text: But you were not willing to go up[a], and you rebelled against the command of Yahweh your God.
translation:
  language: id
  text: Namun, kamu tidak mau naik dan memberontak terhadap perintah[a] Yahweh, Allahmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani secara harfiah, “memberontak terhadap mulut Yahweh, Allahmu,” suatu ungkapan yang berarti menentang atau membangkang terhadap perintah-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Namun, ... tidak
  rationale: Konjungsi meneruskan kisah sekaligus menunjukkan pertentangan dengan ajakan sebelumnya; “Namun” menyatakannya secara alami dalam bahasa Indonesia.
- source_word: אֲבִיתֶם
  choice: kamu tidak mau
  rationale: Bentuk ini mempertahankan unsur kemauan dalam verba אבה dan terdengar lugas dalam bahasa Indonesia modern.
- source_word: לַעֲלֹת
  choice: naik
  rationale: Verba עלה menyatakan gerak naik; “naik” mempertahankan arah yang terdapat dalam teks Ibrani.
- source_word: וַתַּמְרוּ
  choice: dan memberontak
  rationale: Verba מרה menyatakan pemberontakan atau pembangkangan terhadap otoritas; “memberontak” merupakan padanan langsung dan jelas.
- source_word: אֶת־פִּי
  choice: terhadap titah
  rationale: Secara harfiah berarti “terhadap mulut”, tetapi dalam konstruksi ini merupakan idiom bagi perintah yang diucapkan. “Titah” menyampaikan perintah berotoritas secara ringkas dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Dengan nama Yahweh dan sufiks orang kedua jamak, bentuk ini menunjuk kepada Allah Israel dalam arti tunggal. Bahasa Indonesia memakai “-mu” tanpa membedakan tunggal dan jamak.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian יהוה secara langsung; “Yahweh” mempertahankannya sebagai nama pribadi tanpa menggantinya dengan gelar.
- issue: Ungkapan pemberontakan terhadap “mulut” Yahweh
  choice: memberontak terhadap titah Yahweh
  alternative: memberontak terhadap mulut Yahweh
  rationale: Ungkapan Ibrani menunjuk pada pembangkangan terhadap perintah yang keluar dari mulut Yahweh. Terjemahan idiomatis mengomunikasikan maknanya, sementara catatan kaki mempertahankan bentuk harfiahnya.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. “Tidak mau” mempertahankan nuansa kehendak; “titah” dipilih untuk menyatakan perintah berotoritas tanpa membuat kalimat terasa kaku. Penanda catatan kaki ditempatkan pada unsur idiomatis yang dijelaskannya.
