language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְהִי֙ בְּ/אַרְבָּעִ֣ים שָׁנָ֔ה בְּ/עַשְׁתֵּֽי עָשָׂ֥ר חֹ֖דֶשׁ בְּ/אֶחָ֣ד לַ/חֹ֑דֶשׁ דִּבֶּ֤ר מֹשֶׁה֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֹת֖/וֹ אֲלֵ/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/003.yaml
  text: And it happened in the fortieth year[a], in the eleventh month, on the first day of the month[b], that Moses spoke to the sons of Israel according to all that Yahweh had commanded him to them.
translation:
  language: id
  text: Pada tahun keempat puluh, pada bulan kesebelas, pada hari pertama bulan itu, Musa berbicara kepada orang Israel sesuai dengan segala yang Yahweh perintahkan kepadanya bagi mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “yang Yahweh perintahkan kepadanya kepada mereka”; frasa Ibrani itu juga dapat dipahami sebagai “yang Yahweh perintahkan kepadanya mengenai mereka.” Maksudnya, Musa berbicara kepada Israel sesuai dengan apa yang Yahweh perintahkan kepadanya bagi mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Pada
  rationale: Dalam formula penanggalan ini, wayyiqtol וַיְהִי memperkenalkan latar waktu. Bahasa Indonesia alami tidak memerlukan padanan eksplisit seperti 'terjadilah'.
- source_word: בְּאַרְבָּעִים שָׁנָה
  choice: pada tahun keempat puluh
  rationale: Ungkapan Ibrani ini menunjukkan nomor tahun, sehingga bentuk ordinal Indonesia paling tepat.
- source_word: בְּעַשְׁתֵּי עָשָׂר חֹדֶשׁ
  choice: pada bulan kesebelas
  rationale: Bilangan kardinal Ibrani berfungsi sebagai penanda urutan bulan.
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: pada hari pertama bulan itu
  rationale: Formula tanggal Ibrani diperjelas secara alami dengan kata 'hari'; 'bulan itu' merujuk kembali kepada bulan kesebelas.
- source_word: דִּבֶּר
  choice: menyampaikan
  rationale: Dalam konteks Musa mengucapkan seluruh amanat ilahi, 'menyampaikan' tetap mencakup tindakan berbicara sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: kepada orang Israel
  rationale: Secara harfiah 'kepada anak-anak lelaki Israel', tetapi ungkapan tersebut merupakan sebutan kolektif bagi bangsa Israel; 'orang Israel' alami, inklusif, dan tidak mengubah rujukan.
- source_word: כְּכֹל אֲשֶׁר
  choice: segala yang
  rationale: Konstruksi ini menyatakan kesesuaian dengan keseluruhan isi perintah. Dalam susunan Indonesia, verba 'menyampaikan' bersama 'segala yang diperintahkan' mengungkapkan hubungan itu dengan jelas.
- source_word: צִוָּה
  choice: diperintahkan
  rationale: Bentuk pasif relatif menghasilkan susunan Indonesia yang alami dan tetap menunjukkan bahwa perintah Yahweh mendahului penyampaian Musa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi dipertahankan sebagai nama diri, sesuai bentuk Tetragramaton dalam teks sumber.
- source_word: אֹתוֹ אֲלֵהֶם
  choice: kepadanya untuk mereka
  rationale: '''Kepadanya'' menyatakan Musa sebagai penerima perintah, sedangkan ''untuk mereka'' mengungkapkan sasaran amanat. Catatan kaki mempertahankan kemungkinan pembacaan lebih harfiah atau relasional dari אֲלֵהֶם.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung; transliterasi 'Yahweh' mempertahankan nama diri tanpa menggantinya dengan gelar.
- issue: Hubungan frasa אֹתוֹ אֲלֵהֶם dengan perintah dan Israel
  choice: kepadanya untuk mereka
  alternative: kepadanya kepada mereka; kepadanya mengenai mereka
  rationale: Bahasa Ibrani padat dan memungkinkan nuansa sasaran atau pokok pembicaraan. Teks utama menyatakan amanat yang dipercayakan kepada Musa bagi Israel, sementara catatan kaki menjaga ambiguitas konstruksinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Formula tanggal dibuat alami tanpa 'terjadilah', sementara urutan unsur dan nama Yahweh dipertahankan. 'Orang Israel' dipilih daripada ungkapan harfiah 'anak-anak lelaki Israel' karena berfungsi sebagai sebutan kolektif bangsa.
