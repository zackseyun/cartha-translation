revisions:
- from: Pada tahun keempat puluh, pada bulan kesebelas, pada hari pertama bulan itu, Musa menyampaikan kepada orang Israel segala yang diperintahkan Yahweh kepadanya untuk mereka.[a]
  to: Pada tahun keempat puluh, pada bulan kesebelas, pada hari pertama bulan itu, Musa berbicara kepada orang Israel sesuai dengan segala yang Yahweh perintahkan kepadanya bagi mereka.[a]
  rationale: Revisi memulihkan padanan eksplisit untuk כְּכֹל אֲשֶׁר melalui “sesuai dengan segala yang” dan memakai “berbicara” sebagai padanan langsung bagi דִּבֶּר. Catatan kaki tetap mempertahankan ambiguitas konstruksi אֹתוֹ אֲלֵהֶם tanpa menetapkan satu penafsiran doktrinal.
