source:
  edition: WLC
  text: וָ/אֲצַוֶּה֙ אֶת שֹׁ֣פְטֵי/כֶ֔ם בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹ֑ר שָׁמֹ֤עַ בֵּין אֲחֵי/כֶם֙ וּ/שְׁפַטְתֶּ֣ם צֶ֔דֶק בֵּֽין אִ֥ישׁ וּ/בֵין אָחִ֖י/ו וּ/בֵ֥ין גֵּרֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/016.yaml
  text: And at that time I commanded your judges[a], saying, ‘Hear the cases between your brothers[c][b], and judge righteously between a man and his brother or the resident foreigner with him.’
translation:
  language: id
  text: Pada waktu itu aku memerintahkan para hakimmu dengan berkata, “Dengarkanlah perkara di antara saudara-saudaramu, dan berilah keputusan dengan adil[a] antara seseorang dan saudaranya atau orang asing yang menetap bersamanya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berilah keputusan dengan benar.” Kata Ibrani צֶדֶק dapat mencakup kebenaran maupun keadilan, khususnya dalam konteks peradilan.
    reason: lexical_alternative
  - marker: b
    text: Atau “pendatang asing yang menetap bersamanya.” Istilah Ibrani גֵּר menunjuk kepada orang nonpribumi yang tinggal menetap di tengah masyarakat Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: aku memerintahkan
  rationale: Kata kerja צוה menyatakan pemberian perintah yang berwenang; bentuk ini langsung dan wajar dalam bahasa Indonesia.
- source_word: שֹׁפְטֵיכֶם
  choice: para hakimmu
  rationale: Bentuk nominal ini menunjuk kepada orang-orang yang ditetapkan untuk memutus perkara hukum.
- source_word: בָּעֵת הַהִוא
  choice: pada waktu itu
  rationale: Padanan idiomatis yang alami untuk masa yang sedang diceritakan.
- source_word: לֵאמֹר
  choice: demikian
  rationale: Memperkenalkan isi perintah secara alami tanpa harus mempertahankan formula harfiah 'dengan berkata'.
- source_word: שָׁמֹעַ בֵּין אֲחֵיכֶם
  choice: Dengarkanlah perkara-perkara di antara saudara-saudaramu
  rationale: שׁמע memiliki daya imperatif dan dalam konteks peradilan berarti mendengarkan perkara para pihak; 'saudara-saudaramu' mempertahankan bahasa kekerabatan komunitas perjanjian.
- source_word: וּשְׁפַטְתֶּם צֶדֶק
  choice: dan berilah keputusan dengan adil
  rationale: Dalam konteks hukum, צֶדֶק menerangkan mutu putusan sebagai benar dan adil. Ungkapan ini alami dalam bahasa Indonesia sekaligus mempertahankan nuansa peradilan.
- source_word: בֵּין אִישׁ וּבֵין אָחִיו
  choice: antara seseorang dan saudaranya
  rationale: Mempertahankan bentuk tunggal konkret dan citra kekerabatan dari teks Ibrani tanpa membatasi 'אִישׁ' pada laki-laki saja dalam penerapan hukum.
- source_word: גֵּרוֹ
  choice: pendatang yang tinggal bersamanya
  rationale: גֵּר menunjuk kepada orang nonpribumi yang menetap di tengah Israel, bukan sekadar pengunjung; sufiks orang ketiga dipertahankan melalui 'bersamanya'.
theological_decisions:
- issue: Bahasa kekerabatan komunitas perjanjian dalam אֲחֵיכֶם dan אָחִיו
  choice: saudara-saudaramu / saudaranya
  alternative: sesama orang Israel / sesamanya
  rationale: Pilihan ini mempertahankan metafora kekerabatan dalam sumber, sementara bentuk bahasa Indonesia dapat berfungsi secara representatif dalam konteks hukum.
- issue: Makna צֶדֶק dalam konteks peradilan
  choice: dengan adil
  alternative: dengan benar
  rationale: צֶדֶק mencakup kebenaran moral dan keadilan hukum. Konteks hakim mendukung 'adil', sedangkan kemungkinan nuansa 'benar' dicatat dalam catatan kaki.
- issue: Kedudukan גֵּר dalam perlindungan hukum
  choice: pendatang yang tinggal bersamanya
  alternative: orang asing yang menetap bersamanya
  rationale: Pilihan ini menyatakan bahwa גֵּר adalah warga pendatang yang menetap dan ikut berada di bawah proses hukum, tanpa memasukkan kategori kewarganegaraan modern.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'aku' mengikuti tuturan langsung Musa. Istilah hukum dibuat jelas bagi pembaca umum tanpa menghilangkan bahasa kekerabatan atau cakupan makna istilah Ibrani.
