  text: וַֽ/תַּעֲנ֣וּ וַ/תֹּאמְר֣וּ אֵלַ֗/י חָטָאנוּ֮ לַֽ/יהוָה֒ אֲנַ֤חְנוּ נַעֲלֶה֙ וְ/נִלְחַ֔מְנוּ כְּ/כֹ֥ל אֲשֶׁר צִוָּ֖/נוּ יְהוָ֣ה אֱלֹהֵ֑י/נוּ וַֽ/תַּחְגְּר֗וּ אִ֚ישׁ אֶת כְּלֵ֣י מִלְחַמְתּ֔/וֹ וַ/תָּהִ֖ינוּ לַ/עֲלֹ֥ת הָ/הָֽרָ/ה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/041.yaml
  text: Then you answered and said to me[a], ‘We have sinned against Yahweh. We ourselves will go up and fight, according to all that Yahweh our God commanded us.’ Then each man strapped on his weapons of war[b], and you presumptuously set out to go up into the hill country.
translation:
  language: id
  text: Lalu kamu menjawab dan berkata kepadaku, “Kami telah berdosa terhadap Yahweh. Kami sendiri akan maju dan berperang sesuai dengan segala yang diperintahkan Yahweh, Allah kami, kepada kami.” Kemudian masing-masing dari kamu mengenakan perlengkapan perangnya dan dengan lancang maju[a] ke daerah pegunungan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan gegabah maju” atau “dengan lancang maju.” Verba Ibrani ini langka dan menggambarkan tindakan yang terlalu percaya diri atau ceroboh.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “gunung”; dalam konteks ini kemungkinan yang dimaksud ialah kawasan pegunungan atau perbukitan secara lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲנוּ וַתֹּאמְרוּ אֵלַי
  choice: Lalu kamu menjawab dan berkata kepadaku
  rationale: Bentuk jamak menunjuk kepada umat yang menanggapi Musa; ungkapan ini mempertahankan kedua verba Ibrani dengan susunan Indonesia yang wajar.
- source_word: חָטָאנוּ לַיהוָה
  choice: Kami telah berdosa terhadap Yahweh
  rationale: Preposisi ל menandai pihak yang terhadapnya dosa dilakukan; “terhadap” merupakan padanan Indonesia yang alami. Nama ilahi dipertahankan sebagai Yahweh.
- source_word: אֲנַחְנוּ נַעֲלֶה וְנִלְחַמְנוּ
  choice: Kami sendiri akan maju dan berperang
  rationale: Pronomina eksplisit אֲנַחְנוּ diberi tekanan melalui “sendiri”; “maju” menyampaikan gerak naik menuju wilayah perbukitan secara alami dalam konteks militer.
- source_word: כְּכֹל אֲשֶׁר צִוָּנוּ
  choice: sesuai dengan segala yang diperintahkan ... kepada kami
  rationale: Terjemahan ini mempertahankan gagasan kesesuaian dengan keseluruhan perintah tanpa menyiratkan bahwa tindakan mereka saat itu benar-benar taat.
- source_word: וַתַּחְגְּרוּ אִישׁ אֶת כְּלֵי מִלְחַמְתּוֹ
  choice: masing-masing dari kamu menyandang perlengkapan perangnya
  rationale: אִישׁ berfungsi distributif. “Perlengkapan perang” mempertahankan keluasan כְּלֵי מִלְחָמָה, yang dapat mencakup senjata dan peralatan militer lain.
- source_word: וַתָּהִינוּ
  choice: dengan lancang bersiap untuk maju
  rationale: Verba langka ini dalam konteks ayat 43 bernuansa negatif, yaitu tindakan yang terlalu percaya diri atau gegabah. Pilihan ini menyampaikan sikap tersebut sekaligus kaitannya dengan tindakan maju, sementara alternatif leksikal dicatat dalam catatan kaki.
- source_word: לַעֲלֹת הָהָרָה
  choice: maju ke daerah pegunungan
  rationale: Akhiran lokatif menunjukkan gerak menuju הָהָר. Dalam konteks geografis ini, istilah tersebut kemungkinan menunjuk kawasan berbukit atau pegunungan, bukan hanya satu gunung.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; transliterasi “Yahweh” mempertahankan nama pribadi ilahi.
- issue: Nuansa moral וַתָּהִינוּ dalam tindakan Israel
  choice: dengan lancang bersiap untuk maju
  alternative: dengan gegabah maju; bertekad untuk maju; menganggap mudah untuk maju
  rationale: Konteks langsung menggambarkan tindakan Israel sebagai upaya yang terlalu percaya diri dan tetap melawan perintah Allah. Terjemahan utama mempertahankan penilaian negatif itu tanpa menutup ketidakpastian verba yang langka tersebut; alternatifnya dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Sapaan orang kedua jamak Ibrani diterjemahkan dengan “kamu” secara kolektif; bentuk distributif dijelaskan melalui “masing-masing dari kamu”. Istilah “perlengkapan perang” dipilih agar tidak mempersempit makna menjadi senjata saja.
