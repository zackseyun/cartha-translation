  text: אֵ֣לֶּה הַ/דְּבָרִ֗ים אֲשֶׁ֨ר דִּבֶּ֤ר מֹשֶׁה֙ אֶל כָּל יִשְׂרָאֵ֔ל בְּ/עֵ֖בֶר הַ/יַּרְדֵּ֑ן בַּ/מִּדְבָּ֡ר בָּֽ/עֲרָבָה֩ מ֨וֹל ס֜וּף בֵּֽין פָּארָ֧ן וּ/בֵֽין תֹּ֛פֶל וְ/לָבָ֥ן וַ/חֲצֵרֹ֖ת וְ/דִ֥י זָהָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/001.yaml
  text: These are the words that Moses spoke to all Israel beyond the Jordan[a], in the wilderness, in the Arabah opposite Suph, between Paran, Tophel, Laban, Hazeroth[d][c][b], and Dizahab.
translation:
  language: id
  text: Inilah kata-kata yang diucapkan Musa kepada seluruh Israel di seberang Sungai Yordan[a], di padang belantara, di Araba[b], berhadapan dengan Suf[c], di antara Paran, Tofel, Laban, Hazerot, dan Di-Zahab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini juga dapat diterjemahkan “di sisi lain Sungai Yordan” atau “melintasi Sungai Yordan”; sudut pandang geografisnya tidak dinyatakan secara tegas.
    reason: lexical_alternative
  - marker: b
    text: “Araba” adalah sebutan geografis untuk kawasan lembah retakan atau dataran; kata ini juga dapat diterjemahkan “dataran”.
    reason: cultural_note
  - marker: c
    text: Teks Ibrani berbunyi “Suf”. Sebagian orang memahaminya sebagai nama tempat, sedangkan yang lain menghubungkannya dengan “Laut Teberau”; namun, kata “laut” tidak terdapat dalam ayat ini.
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה הַדְּבָרִים
  choice: Inilah perkataan
  rationale: Bentuk ini mempertahankan fungsi penunjuk yang membuka kitab. Dalam konteks perkataan Musa, דְּבָרִים paling tepat dipahami sebagai ucapan atau perkataan; bentuk kolektif tunggal “perkataan” lebih alami dalam bahasa Indonesia daripada pengulangan “perkataan-perkataan”.
- source_word: אֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: yang disampaikan Musa
  rationale: Ungkapan ini menyatakan bahwa Musa mengucapkan wacana tersebut. “Disampaikan” terdengar alami dan bermartabat dalam pembukaan resmi tanpa mengubah Musa menjadi sekadar penulis.
- source_word: אֶל כָּל יִשְׂרָאֵל
  choice: kepada seluruh Israel
  rationale: כָּל mencakup keseluruhan umat Israel. “Seluruh Israel” alami dalam bahasa Indonesia dan mempertahankan cakupan kolektifnya.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: di seberang Sungai Yordan
  rationale: עֵבֶר menunjuk wilayah pada sisi lain. “Di seberang Sungai Yordan” merupakan ungkapan geografis Indonesia yang alami, sedangkan catatan kaki mempertahankan ketidakpastian sudut pandangnya.
- source_word: בַּמִּדְבָּר
  choice: di padang belantara
  rationale: מִדְבָּר adalah kawasan tandus dan jarang dihuni, tidak selalu gurun pasir. “Padang belantara” menghindari penyempitan makna menjadi gurun pasir.
- source_word: בָּעֲרָבָה
  choice: di Araba
  rationale: עֲרָבָה di sini dapat berfungsi sebagai sebutan geografis bagi wilayah lembah retakan atau dataran. Transliterasi “Araba” mempertahankan nilai nama geografisnya.
- source_word: מוֹל סוּף
  choice: berhadapan dengan Suf
  rationale: מוֹל berarti berada di hadapan atau berseberangan dengan. Karena teks hanya memuat סוּף tanpa kata “laut”, “Suf” dipertahankan sebagai nama yang tidak diperluas menjadi “Laut Teberau”.
- source_word: בֵּין פָּארָן וּבֵין תֹּפֶל וְלָבָן וַחֲצֵרֹת וְדִי זָהָב
  choice: di antara Paran, Tofel, Laban, Hazerot, dan Di-Zahab
  rationale: Daftar nama tempat disajikan dengan tanda koma dan konjungsi terakhir agar alami dalam bahasa Indonesia, sambil mempertahankan semua nama dan relasi “di antara” dari teks Ibrani.
- source_word: דִי זָהָב
  choice: Di-Zahab
  rationale: Bentuk ini diperlakukan sebagai nama tempat dan ditransliterasikan, bukan diterjemahkan berdasarkan kemungkinan arti unsur katanya.
