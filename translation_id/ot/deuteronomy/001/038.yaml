  terminology: Nama “Yosua bin Nun” mengikuti penggunaan Alkitab Indonesia yang lazim. “Israel,” “negeri itu,” dan “milik pusaka” dalam catatan kaki digunakan secara konsisten. Catatan kaki secara tepat mencatat rentang leksikal Hifil נחל, termasuk kemungkinan memberi sebagai warisan atau membagikan.
