  source_fidelity: 'Teks Indonesia menerjemahkan seluruh unsur Ibrani dengan setia: Yosua dan patronimiknya, frasa partisipial yang harfiah, penegasan subjek, gerak masuk ke negeri, imperatif kepada Musa, serta bentuk kausatif נחל. “Negeri itu” merupakan penjelasan wajar bagi sufiks feminin berdasarkan konteks dekat tanpa menambah makna.'
