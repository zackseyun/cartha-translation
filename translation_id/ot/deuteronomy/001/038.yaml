id: DEU.1.38
reference: Deuteronomy 1:38
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יְהוֹשֻׁ֤עַ בִּן נוּן֙ הָ/עֹמֵ֣ד לְ/פָנֶ֔י/ךָ ה֖וּא יָ֣בֹא שָׁ֑מָּ/ה אֹת֣/וֹ חַזֵּ֔ק כִּי ה֖וּא יַנְחִלֶ֥/נָּה אֶת יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/038.yaml
  text: Joshua son of Nun[a], who stands before you—he will go in there. Strengthen him, for he will cause Israel to inherit it.
translation:
  language: id
  text: Yosua bin Nun, yang berdiri di hadapanmu, dialah yang akan masuk ke sana. Kuatkanlah dia, sebab dialah yang akan membuat Israel mewarisi negeri itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memberikan negeri itu kepada Israel sebagai milik pusaka” atau “membagikan negeri itu kepada Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Yosua bin Nun
  rationale: Mengikuti bentuk nama yang lazim dalam Alkitab bahasa Indonesia; “bin Nun” menyampaikan patronimik Ibrani secara ringkas dan alami.
- source_word: הָעֹמֵד לְפָנֶיךָ
  choice: yang berdiri di hadapanmu
  rationale: Mempertahankan gambaran harfiah partisip Ibrani tanpa menafsirkan frasa itu secara lebih khusus sebagai “yang melayanimu”.
- source_word: הוּא יָבֹא שָׁמָּה
  choice: dialah yang akan masuk ke sana
  rationale: Kata “masuk” menangkap gerak menuju dan memasuki negeri yang telah disebut; “dialah” mencerminkan penekanan pada הוּא.
- source_word: אֹתוֹ חַזֵּק
  choice: Kuatkanlah dia
  rationale: Mempertahankan keluasan makna חזק, yang dapat mencakup pemberian kekuatan, keteguhan, dan semangat.
- source_word: כִּי
  choice: sebab
  rationale: Menandai alasan bagi perintah untuk menguatkan Yosua dalam ragam bahasa yang wajar dan bermartabat.
- source_word: הוּא יַנְחִלֶנָּה אֶת יִשְׂרָאֵל
  choice: dialah yang akan membuat Israel mewarisi negeri itu
  rationale: Bentuk Hifil יַנְחִל dapat berarti membuat seseorang mewarisi, memberikan sebagai milik pusaka, atau membagikan sebagai warisan. Terjemahan utama mempertahankan struktur kausatif, sedangkan objek feminin dijelaskan sebagai “negeri itu” berdasarkan konteks.
theological_decisions:
- issue: Acuan sufiks feminin dalam יַנְחִלֶנָּה
  choice: Sufiks itu diterjemahkan “negeri itu,” yakni negeri yang dijanjikan kepada Israel.
  alternative: Objek dapat dibiarkan kurang eksplisit, atau frasa dapat diterjemahkan “memberikannya kepada Israel sebagai milik pusaka.”
  rationale: Konteks langsung membahas masuk dan memiliki negeri tersebut. Menyebut “negeri itu” menjernihkan acuan pronomina tanpa menambahkan klaim teologis baru.
- issue: Cakupan makna kausatif נחל
  choice: membuat Israel mewarisi
  alternative: memberikannya kepada Israel sebagai milik pusaka; membagikannya kepada Israel
  rationale: Pilihan utama menjaga bentuk kausatif dan ketegangan antara tindakan Yosua memimpin Israel ke dalam warisan dan tindakan membagikan negeri itu; alternatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang lugas dan bermartabat. Penekanan ganda pada הוּא dipertahankan melalui “dialah.” Penanda catatan kaki ditempatkan pada frasa yang dijelaskannya.
