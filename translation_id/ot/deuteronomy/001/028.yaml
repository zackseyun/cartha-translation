source:
  edition: WLC
  text: אָנָ֣ה אֲנַ֣חְנוּ עֹלִ֗ים אַחֵי/נוּ֩ הֵמַ֨סּוּ אֶת לְבָבֵ֜/נוּ לֵ/אמֹ֗ר עַ֣ם גָּד֤וֹל וָ/רָם֙ מִמֶּ֔/נּוּ עָרִ֛ים גְּדֹלֹ֥ת וּ/בְצוּרֹ֖ת בַּ/שָּׁמָ֑יִם וְ/גַם בְּנֵ֥י עֲנָקִ֖ים רָאִ֥ינוּ שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/001/028.yaml
  text: Where are we going up? Our brothers have melted our hearts[a], saying, ‘The people are greater and taller than we are; the cities are great and fortified up to the heavens; and besides[c][b], we saw the sons of the Anakim there.’
translation:
  language: id
  text: 'Ke manakah kita akan naik? Saudara-saudara kita telah membuat hati kita ciut[a] dengan mengatakan: ‘Bangsa itu lebih besar dan lebih tinggi daripada kita. Kota-kotanya besar dan berbenteng sampai ke langit[b]. Selain itu, di sana kita melihat keturunan Enak[c].’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “telah mencairkan hati kita”; maksudnya, membuat kita kehilangan keberanian.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani berbunyi “kota-kota besar dan berbenteng di langit”, suatu hiperbola untuk kota-kota dengan benteng yang luar biasa tinggi.
    reason: cultural_note
  - marker: c
    text: Secara harfiah, “anak-anak Enak”; dapat juga diterjemahkan “orang Enak”.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנָה אֲנַחְנוּ עֹלִים
  choice: Ke manakah kita akan maju?
  rationale: אָנָה menanyakan tujuan, sedangkan עֹלִים secara harfiah berarti ‘naik’. Dalam konteks perjalanan memasuki negeri dan daerah perbukitan, ‘maju’ terdengar alami dalam bahasa Indonesia tanpa menghilangkan gagasan gerak menuju tujuan.
- source_word: אַחֵינוּ
  choice: Saudara-saudara kita
  rationale: Mempertahankan bentuk maskulin jamak dan daya retoris ungkapan Ibrani, yang dalam konteks merujuk kepada sesama orang Israel.
- source_word: הֵמַסּוּ אֶת לְבָבֵנוּ
  choice: telah membuat hati kita ciut
  rationale: Ungkapan Ibrani secara harfiah berbicara tentang ‘mencairkan hati’ dan berarti menghilangkan keberanian. ‘Membuat hati ciut’ mempertahankan citra hati sekaligus menyampaikan maknanya secara wajar dalam bahasa Indonesia.
- source_word: עַם גָּדוֹל וָרָם מִמֶּנּוּ
  choice: Bangsa itu lebih besar dan lebih tinggi daripada kita
  rationale: גָּדוֹל menyatakan kebesaran atau ukuran, sedangkan רָם dalam konteks ini menunjuk pada tinggi badan. Terjemahan ini mempertahankan kedua unsur perbandingan.
- source_word: עָרִים גְּדֹלֹת וּבְצוּרֹת בַּשָּׁמָיִם
  choice: Kota-kotanya besar dan berbenteng sampai ke langit
  rationale: Mempertahankan hiperbola Ibrani tentang benteng yang menjulang sangat tinggi, alih-alih meratakannya menjadi sekadar ‘sangat tinggi’.
- source_word: וְגַם
  choice: Bahkan
  rationale: Menandai tambahan rincian yang semakin menakutkan dalam laporan para pengintai.
- source_word: בְּנֵי עֲנָקִים
  choice: keturunan Enak
  rationale: Secara harfiah berarti ‘anak-anak/keturunan Enak’. Bentuk ‘keturunan Enak’ jelas bagi pembaca Indonesia dan mempertahankan rujukan kepada kelompok tersebut.
- source_word: רָאִינוּ שָׁם
  choice: di sana kita melihat
  rationale: Menyampaikan bentuk lampau naratif secara alami dalam bahasa Indonesia, dengan keterangan tempat tetap diberi tekanan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Ungkapan ‘hati ciut’ dipilih agar idiom sumber tetap terasa namun langsung dipahami. Nama עֲנָק ditransliterasikan ‘Enak’ mengikuti bentuk yang lazim dalam Alkitab bahasa Indonesia.
