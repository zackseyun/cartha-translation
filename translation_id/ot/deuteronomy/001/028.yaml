  to: 'Ke manakah kita akan naik? Saudara-saudara kita telah membuat hati kita ciut[a] dengan mengatakan: ‘Bangsa itu lebih besar dan lebih tinggi daripada kita. Kota-kotanya besar dan berbenteng sampai ke langit[b]. Selain itu, di sana kita melihat keturunan Enak[c].’'
