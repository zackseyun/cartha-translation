  yaml_path: translation/ot/deuteronomy/001/018.yaml
  text: And at that time I commanded you all the things that you should do[a].
translation:
  language: id
  text: Pada waktu itu aku memerintahkan kepadamu segala hal yang harus kamu lakukan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “segala perkataan” atau “segala perkara”; kata Ibrani דְּבָרִים dapat menunjuk kepada petunjuk yang diucapkan ataupun perkara atau tindakan yang harus dilaksanakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲצַוֶּה
  choice: aku memerintahkan
  rationale: Bentuk dari צוה menyatakan perintah atau instruksi yang berwibawa; “memerintahkan” mempertahankan daya perintahnya secara alami dalam bahasa Indonesia.
- source_word: אֶתְכֶם
  choice: kepadamu
  rationale: Pronomina orang kedua jamak. Bahasa Indonesia tidak membedakan bentuk tunggal dan jamak pada “kamu”; konteks menunjukkan bahwa yang disapa adalah seluruh Israel.
- source_word: בָּעֵת הַהִוא
  choice: Pada waktu itu
  rationale: Ungkapan temporal baku yang alami dan sesuai dengan latar penuturan kembali oleh Musa.
- source_word: אֵת כָּל הַדְּבָרִים
  choice: segala hal
  rationale: דְּבָרִים dapat berarti perkataan, perkara, atau hal. Dalam konteks ini, frasa tersebut menunjuk kepada segala sesuatu yang diperintahkan untuk dilaksanakan, tetapi keluasan maknanya tetap dicatat dalam catatan kaki.
- source_word: אֲשֶׁר תַּעֲשׂוּן
  choice: yang harus kamu lakukan
  rationale: Imperfek orang kedua jamak dari עשה berada dalam klausa relatif sesudah verba “memerintahkan” dan menyatakan kewajiban untuk melaksanakan perintah; “harus” menyampaikan daya direktif itu dengan jelas.
theological_decisions:
- issue: Kekuatan kewajiban dalam תַּעֲשׂוּן setelah “memerintahkan”
  choice: yang harus kamu lakukan
  alternative: yang hendaknya kamu lakukan; yang mesti kamu laksanakan
  rationale: Konteks sintaksisnya menyatakan tindakan yang diwajibkan oleh perintah, bukan sekadar anjuran atau prediksi. Pilihan ini tidak menambahkan muatan teologis di luar daya perintah teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Aku” mempertahankan tuturan langsung Musa, sedangkan “kamu” mengikuti sapaan kolektif kepada Israel. Susunan kalimat dibuat alami tanpa menghilangkan sifat perintah dalam teks Ibrani.
