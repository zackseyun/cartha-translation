id: DEU.6.13
reference: Deuteronomy 6:13
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ תִּירָ֖א וְ/אֹת֣/וֹ תַעֲבֹ֑ד וּ/בִ/שְׁמ֖/וֹ תִּשָּׁבֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/013.yaml
  text: You shall fear Yahweh your God[a], and him you shall serve[b], and by his name you shall swear.
translation:
  language: id
  text: Engkau harus takut akan Yahweh, Allahmu[a]; Dialah yang harus kaulayani[b], dan demi nama-Nya engkau harus bersumpah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "hormatilah Yahweh, Allahmu"; kata kerja Ibrani ini mencakup rasa takut yang disertai hormat, gentar, dan kekaguman, bukan sekadar kengerian.
    reason: lexical_alternative
  - marker: b
    text: Atau "sembahlah Dia"; kata Ibraninya lazim berarti "melayani" dan dalam konteks ini mencakup pelayanan yang bersifat penyembahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama pribadi, bukan menggantinya dengan gelar "TUHAN".
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk dengan sufiks orang kedua tunggal maskulin berarti "Allahmu" dan sesuai dengan sapaan perjanjian kepada Israel.
- source_word: תִּירָא
  choice: harus takut akan
  rationale: Kata kerja ירא mencakup rasa takut yang disertai hormat dan gentar; "takut akan" mempertahankan bobot semantiknya tanpa menyempitkannya menjadi sekadar rasa hormat.
- source_word: וְאֹתוֹ
  choice: Dialah yang
  rationale: Pronomina objek yang eksplisit dipertahankan secara alami dalam bahasa Indonesia untuk memberi penekanan; kata "hanya" tidak ditambahkan karena tidak dinyatakan secara eksplisit dalam ayat ini.
- source_word: תַעֲבֹד
  choice: kaulayani
  rationale: עבד pada dasarnya berarti "melayani" dan dalam konteks religius mencakup pelayanan yang bersifat penyembahan, tanpa dibatasi pada tindakan liturgis.
- source_word: וּבִשְׁמוֹ
  choice: demi nama-Nya
  rationale: Dalam konteks sumpah, preposisi ב menunjukkan nama yang diseru sebagai dasar atau penjamin sumpah; "demi nama-Nya" merupakan ungkapan Indonesia yang alami.
- source_word: תִּשָּׁבֵעַ
  choice: harus bersumpah
  rationale: Bentuk Niphal dari שׁבע berarti bersumpah atau mengucapkan sumpah.
- source_word: אֶת
  choice: tidak diterjemahkan secara terpisah
  rationale: Penanda objek langsung ini tidak memiliki padanan tersendiri dalam bahasa Indonesia; fungsinya tercermin dalam susunan kalimat.
theological_decisions:
- issue: Apakah תִּירָא diperhalus menjadi "hormatilah"
  choice: Memakai "takut akan" dalam teks utama
  alternative: '"hormatilah" atau "hendaklah engkau gentar dan hormat kepada"'
  rationale: Bahasa Ibrani memuat rasa takut, hormat, dan gentar di hadapan Allah. "Takut akan" menjaga ketegangan teologis itu, sedangkan "hormatilah" saja berisiko mempersempit maknanya.
- issue: Apakah תַעֲבֹד diterjemahkan "layani" atau "sembah"
  choice: Memakai "layani"
  alternative: '"sembah"'
  rationale: '"Layani" mempertahankan keluasan makna עבד, yaitu kesetiaan perjanjian yang diwujudkan dalam pelayanan dan juga mencakup penyembahan.'
- issue: Apakah unsur eksklusif "hanya" perlu ditambahkan
  choice: Tidak menambahkan "hanya"
  alternative: '"hanya Dialah yang harus kaulayani"'
  rationale: Konteks menuntut kesetiaan eksklusif kepada Yahweh, tetapi kata yang secara eksplisit berarti "hanya" tidak terdapat dalam ayat ini; penekanan pronominal dipertahankan tanpa menambahkannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk "engkau/Allahmu/kaulayani" mempertahankan sapaan orang kedua tunggal dari teks Ibrani. Kapitalisasi pada "Dia" dan sufiks "-Nya" dipakai sebagai konvensi penghormatan yang lazim dalam penerbitan Alkitab bahasa Indonesia.
