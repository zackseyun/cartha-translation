revisions:
- from: Ikatlah semuanya itu sebagai tanda pada tanganmu, dan hendaklah semuanya itu menjadi hiasan dahi[a] di antara kedua matamu.
  to: Ikatlah perkataan-perkataan itu sebagai tanda pada tanganmu, dan hendaklah itu menjadi hiasan di antara kedua matamu.[a]
  rationale: Revisi mempertahankan ambiguitas mengenai apakah perintah ini bersifat jasmani, simbolis, atau keduanya. Lokasi 'di antara kedua matamu' dipertahankan secara langsung, sementara identifikasi tradisional dengan tefilin dipindahkan dan dibatasi pada catatan kaki. Bentuk imperatif dan daya instruksional klausa kedua tetap terjaga.
