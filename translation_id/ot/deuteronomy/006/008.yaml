  yaml_path: translation/ot/deuteronomy/006/008.yaml
  text: And you shall bind them as a sign on your hand[a], and they shall be as frontlets between your eyes.
translation:
  language: id
  text: Ikatlah perkataan-perkataan itu sebagai tanda pada tanganmu, dan hendaklah itu menjadi hiasan di antara kedua matamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "tefilin" atau "filakteri", yang merujuk pada kotak-kotak kecil yang dipakai dalam praktik Yahudi pada masa kemudian. Istilah Ibrani ini langka dan secara lebih harfiah menunjuk pada hiasan atau pita pada bagian depan kepala.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּקְשַׁרְתָּם
  choice: Ikatlah semuanya itu
  rationale: Bentuk verba dalam rangkaian pengajaran menyatakan perintah. Akhiran orang ketiga jamak merujuk kembali kepada perkataan-perkataan dalam konteks sebelumnya; 'semuanya itu' membuat rujukan jamak tersebut jelas dan alami dalam bahasa Indonesia.
- source_word: לְאוֹת
  choice: sebagai tanda
  rationale: אוֹת berarti 'tanda' atau 'penanda'; 'sebagai tanda' mempertahankan fungsi simbolis tanpa menentukan apakah tindakan ini harfiah, simbolis, atau keduanya.
- source_word: עַל יָדֶךָ
  choice: pada tanganmu
  rationale: יָד secara dasar berarti 'tangan', walaupun kadang cakupannya dapat meluas ke lengan. Pilihan ini mengikuti ungkapan Ibrani tanpa mempersempit tafsir.
- source_word: וְהָיוּ
  choice: dan hendaklah semuanya itu menjadi
  rationale: Verba ini melanjutkan rangkaian instruksi. 'Hendaklah ... menjadi' menyampaikan daya perintah dan mempertahankan subjek jamak yang merujuk pada perkataan-perkataan sebelumnya.
- source_word: לְטֹטָפֹת
  choice: sebagai hiasan dahi
  rationale: טֹטָפֹת adalah istilah langka bagi sesuatu yang dikenakan di bagian depan kepala. 'Hiasan dahi' cukup alami dan konkret, tetapi tidak memasukkan bentuk tefilin dari praktik Yahudi pada masa kemudian ke dalam teks utama.
- source_word: בֵּין עֵינֶיךָ
  choice: di antara kedua matamu
  rationale: Ini mempertahankan idiom konkret Ibrani secara dekat. 'Kedua' wajar dalam bahasa Indonesia karena mata merupakan pasangan, tanpa mengganti ungkapan itu dengan tafsiran 'pada dahimu'.
theological_decisions:
- issue: Apakah perintah ini harus diterjemahkan sebagai praktik jasmani harfiah atau sebagai gambaran mengenai ingatan yang terus-menerus
  choice: Mempertahankan bahasa jasmani yang konkret tanpa menetapkan apakah perintah itu harfiah, simbolis, atau keduanya
  alternative: Menguraikannya sebagai kiasan untuk selalu mengingat, atau secara khusus menyebut tefilin dari praktik Yahudi kemudian
  rationale: Teks Ibrani memakai gambaran tubuh yang konkret dan tidak secara eksplisit menyelesaikan hubungan antara tindakan lahiriah dan makna simbolisnya. Terjemahan mempertahankan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'Ikatlah' dan 'hendaklah' mempertahankan nada instruksional; susunan konkret teks Ibrani dijaga tanpa memaksakan tafsir denominasi tertentu.
