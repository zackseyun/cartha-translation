  text: וּ/צְדָקָ֖ה תִּֽהְיֶה לָּ֑/נוּ כִּֽי נִשְׁמֹ֨ר לַ/עֲשׂ֜וֹת אֶת כָּל הַ/מִּצְוָ֣ה הַ/זֹּ֗את לִ/פְנֵ֛י יְהוָ֥ה אֱלֹהֵ֖י/נוּ כַּ/אֲשֶׁ֥ר צִוָּֽ/נוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/025.yaml
  text: And it will be righteousness for us if we are careful to do all this commandment before Yahweh our God[b][a], as he has commanded us.
translation:
  language: id
  text: Dan hal itu akan menjadi kebenaran[a] bagi kita jika kita dengan saksama menjalankan seluruh perintah ini[b] di hadapan Yahweh, Allah kita, seperti yang diperintahkan-Nya kepada kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keadilan”. Kata Ibrani צְדָקָה dapat menunjuk pada apa yang benar atau adil; “kebenaran” paling sesuai dengan konteks perjanjian ini.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “seluruh perintah yang ini”. Bentuk tunggal “perintah” tampaknya merujuk pada pengajaran itu sebagai satu kesatuan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְדָקָה
  choice: kebenaran
  rationale: צְדָקָה menunjuk pada keadaan atau tindakan yang benar dan adil. Dalam konteks perjanjian ini, “kebenaran” mempertahankan cakupan moral dan relasionalnya tanpa membatasinya pada keadilan sosial ataupun memasukkan rumusan teologis yang lebih kemudian.
- source_word: תִּהְיֶה לָּנוּ
  choice: hal itu akan menjadi ... bagi kita
  rationale: Ungkapan ini mempertahankan susunan predikatif Ibrani. “Hal itu” secara alami merujuk pada ketaatan yang disebut sesudahnya, tanpa menambahkan gagasan teknis seperti “diperhitungkan” yang tidak dinyatakan secara eksplisit.
- source_word: כִּי
  choice: apabila
  rationale: Di sini כִּי paling wajar dipahami sebagai pengantar syarat. “Apabila” menyampaikan hubungan itu secara alami dalam bahasa Indonesia.
- source_word: נִשְׁמֹר לַעֲשׂוֹת
  choice: dengan sungguh-sungguh melakukan
  rationale: שׁמר bersama infinitif לַעֲשׂוֹת menyatakan perhatian dan ketekunan dalam melaksanakan. Pilihan ini alami dalam bahasa Indonesia sekaligus mempertahankan nuansa ketaatan yang saksama.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: seluruh perintah ini
  rationale: Bentuk tunggal מִצְוָה dipertahankan. Dengan כָּל, ungkapan ini memandang perintah atau pengajaran tersebut sebagai satu kesatuan utuh.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: לִפְנֵי berarti berada di depan atau dalam kehadiran seseorang. “Di hadapan” mempertahankan nuansa hidup dan bertindak dalam pengawasan Allah.
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: Yahweh, Allah kita
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, sedangkan אֱלֹהֵינוּ diterjemahkan secara langsung sebagai “Allah kita” untuk mempertahankan hubungan perjanjian.
- source_word: כַּאֲשֶׁר צִוָּנוּ
  choice: seperti yang diperintahkan-Nya kepada kita
  rationale: Terjemahan ini merujuk secara alami pada perintah yang sebelumnya telah diberikan. Akhiran “-Nya” menjadikan pelaku ilahi jelas tanpa mengulang nama.
theological_decisions:
- issue: Makna “kebenaran” dalam konteks ketaatan pada perjanjian
  choice: Ayat ini menyatakan bahwa ketaatan tersebut akan menjadi “kebenaran bagi kita”, tanpa menjelaskan mekanismenya dengan kategori teologis yang lebih kemudian.
  alternative: Menerjemahkannya sebagai “keadilan bagi kita” atau “akan diperhitungkan sebagai kebenaran bagi kita”.
  rationale: Teks Ibrani menghubungkan ketaatan pada perjanjian dengan kebenaran secara nyata, tetapi tidak memakai kata kerja teknis “memperhitungkan”. Terjemahan ini mempertahankan pernyataan dan ketegangan teologis teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan bentuk tunggal “perintah”, nama ilahi “Yahweh”, serta ungkapan teologis “menjadi kebenaran bagi kita”.
