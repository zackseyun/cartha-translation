  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּן תִּשְׁכַּ֖ח אֶת יְהוָ֑ה אֲשֶׁ֧ר הוֹצִֽיאֲ/ךָ֛ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/012.yaml
  text: Be careful lest you forget Yahweh[a], who brought you out of the land of Egypt, out of the house of servants.
translation:
  language: id
  text: Berhati-hatilah, jangan sampai engkau melupakan Yahweh, yang telah membawa engkau keluar dari tanah Mesir, dari rumah perbudakan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari rumah budak-budak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Berhati-hatilah
  rationale: Bentuk perintah refleksif ini menyampaikan peringatan agar orang yang disapa menjaga dirinya. Ungkapan “berhati-hatilah” alami dalam bahasa Indonesia dan mempertahankan daya imperatifnya.
- source_word: פֶּן תִּשְׁכַּח
  choice: jangan sampai engkau melupakan
  rationale: פֶּן memperkenalkan bahaya yang harus dihindari. “Jangan sampai” merupakan padanan Indonesia yang alami, sedangkan “engkau” mempertahankan sapaan orang kedua tunggal dalam teks Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, agar nama perjanjian dalam teks sumber tetap tampak.
- source_word: הוֹצִיאֲךָ
  choice: telah membawa engkau keluar
  rationale: Bentuk Hifil dari יצא dalam konteks keluaran berarti “membawa keluar”. Kata “telah” menandai tindakan historis yang sudah terjadi.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: dari tanah Mesir
  rationale: Terjemahan ini mempertahankan kata אֶרֶץ, “tanah/negeri”, serta tetap alami dalam konteks geografis dan historis.
- source_word: מִבֵּית עֲבָדִים
  choice: dari rumah para budak
  rationale: 'Ungkapan ini mempertahankan citra konkret bahasa Ibrani: בֵּית berarti “rumah” dan עֲבָדִים adalah nomina jamak yang berarti “budak”. Alternatif idiomatis dijelaskan dalam catatan kaki.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama diri ilahi. “Yahweh” mempertahankan nama itu, sedangkan “TUHAN” menggantinya dengan gelar.
- issue: Penerjemahan עֲבָדִים dalam rumusan keluaran
  choice: para budak
  alternative: perbudakan
  rationale: Bentuk Ibrani adalah nomina konkret jamak, “budak-budak”, bukan nomina abstrak “perbudakan”. Terjemahan utama mempertahankan kekonkretan itu tanpa menyangkal bahwa keseluruhan frasa secara idiomatis menunjuk pada keadaan atau tempat perbudakan.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Sapaan “engkau” dipakai untuk mempertahankan bentuk orang kedua tunggal; susunan “jangan sampai” menghindari ungkapan yang terlalu kaku. Citra konkret “rumah para budak” dipertahankan dan dijelaskan lewat catatan kaki.
