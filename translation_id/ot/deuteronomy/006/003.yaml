base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/003.yaml
  text: So hear[a], Israel, and be careful to do it, that it may go well with you and that you may multiply greatly, just as Yahweh, the God of your fathers, has spoken to you[b], in a land flowing with milk and honey.
translation:
  language: id
  text: Dengarlah, hai Israel, dan berhati-hatilah untuk melakukannya, supaya keadaanmu baik dan jumlahmu bertambah sangat banyak, seperti yang telah Yahweh, Allah nenek moyangmu, katakan kepadamu, di negeri yang berlimpah susu dan madu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Susunan bahasa Ibrani pada bagian akhir ayat ini padat. Frasa “di negeri yang berlimpah susu dan madu” dapat dipahami sebagai keterangan tempat bagi keadaan baik dan pertambahan Israel; frasa itu juga dapat dipahami sebagai bagian dari apa yang telah Yahweh katakan atau janjikan kepada Israel.
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁמַעְתָּ
  choice: dengarlah
  rationale: Kata שׁמע dapat berarti mendengar, menyimak, atau menaati. “Dengarlah” mempertahankan bentuk Ibrani, sementara tuntutan ketaatan tampak dari frasa berikutnya tentang melakukan.
- source_word: וְשָׁמַרְתָּ לַעֲשׂוֹת
  choice: lakukanlah semuanya dengan sungguh-sungguh
  rationale: Gabungan שׁמר dan infinitif עשה menyatakan perhatian yang tekun hingga tindakan nyata. Ungkapan ini alami dalam bahasa Indonesia; “semuanya” merujuk pada ketetapan dan perintah dalam konteks sebelumnya.
- source_word: אֲשֶׁר יִיטַב לְךָ
  choice: supaya keadaanmu baik
  rationale: Ini mempertahankan idiom berkat dalam Ulangan dan menyatakan bahwa segala sesuatu akan berlangsung baik bagi Israel.
- source_word: וַאֲשֶׁר תִּרְבּוּן מְאֹד
  choice: dan jumlahmu bertambah sangat banyak
  rationale: רבה di sini menunjuk pada pertambahan jumlah penduduk, sedangkan מְאֹד dipertahankan dengan “sangat”.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: seperti yang telah dikatakan
  rationale: Terjemahan ini mempertahankan arti dasar “berkata” tanpa secara eksplisit mengubahnya menjadi “berjanji”, meskipun konteksnya mengandung unsur janji.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks sumber tetap terlihat.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: Allah nenek moyangmu
  rationale: “Nenek moyang” merupakan ungkapan Indonesia yang alami dan lazim untuk para leluhur terdahulu. Nomina Ibrani secara harfiah berbentuk “bapa-bapamu”, tetapi dalam konteks ini menunjuk pada leluhur Israel.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: negeri yang berlimpah susu dan madu
  rationale: Ungkapan ini menyampaikan gambaran Ibrani tentang negeri yang subur dan kaya secara alami dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi. “Yahweh” mempertahankan nama itu dan membedakannya dari sebuah gelar.
- issue: Hubungan sintaksis frasa “negeri yang berlimpah susu dan madu”
  choice: Dihubungkan dengan tempat Israel akan bertambah banyak
  alternative: Dipahami sebagai isi atau keterangan dari apa yang Yahweh katakan atau janjikan
  rationale: Susunan Ibraninya padat dan memungkinkan lebih dari satu hubungan sintaksis. Teks utama mengikuti pembacaan lokatif yang alami, sedangkan kemungkinan lain dicatat dalam catatan kaki.
- issue: Istilah kekerabatan אֲבֹתֶיךָ
  choice: nenek moyangmu
  alternative: bapa-bapamu
  rationale: Bahasa Ibrani memakai bentuk maskulin “bapa-bapamu”, tetapi ungkapan itu berfungsi sebagai sebutan bagi leluhur Israel. “Nenek moyangmu” adalah padanan Indonesia yang wajar tanpa mengubah rujukan historisnya.
translation_notes:
  register: Bahasa dibuat modern, jelas, dan tetap khidmat. Sapaan “hai Israel” mempertahankan vokatif sumber. Struktur akhir sengaja tidak diperjelas secara dogmatis; ambiguitas sintaksisnya dijelaskan dalam catatan kaki.
