base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/017.yaml
  text: You shall diligently keep the commandments of Yahweh your God[a], and his testimonies and his statutes[b], which he has commanded you.
translation:
  language: id
  text: Kalian harus sungguh-sungguh menaati[a] perintah-perintah Yahweh, Allah kalian, serta ketentuan-ketentuan[b] dan ketetapan-ketetapan-Nya yang telah diperintahkan-Nya kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “benar-benar memelihara” atau “menaati dengan saksama”; bahasa Ibrani memakai infinitif absolut yang diikuti verba finit dari akar kata yang sama untuk memberi penegasan.
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibrani ini juga dapat diterjemahkan “kesaksian-kesaksian” atau “ketentuan-ketentuan perjanjian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹר תִּשְׁמְרוּן
  choice: harus sungguh-sungguh menaati
  rationale: Gabungan infinitif absolut dan verba finit dari שׁמר menegaskan kewajiban tersebut. Ungkapan ini menyampaikan daya wajib sekaligus penekanannya secara alami dalam bahasa Indonesia.
- source_word: מִצְוֺת
  choice: perintah-perintah
  rationale: מִצְוֹת menunjuk pada kewajiban yang diperintahkan dalam konteks perjanjian; bentuk ulang mempertahankan makna jamaknya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allah kalian
  rationale: Bentuk pronominalnya jamak. 'Kalian' menyampaikan bahwa Israel sebagai umat sedang disapa dan menghindari hilangnya informasi jumlah yang terjadi pada 'kamu'.
- source_word: עֵדֹתָיו
  choice: ketentuan-ketentuan-Nya
  rationale: Dalam Ulangan, עֵדוֹת merujuk pada ketentuan perjanjian yang berfungsi sebagai kesaksian. 'Ketentuan' lebih mudah dipahami pembaca modern daripada terjemahan harfiah 'kesaksian', sambil tetap dibedakan dari חֻקִּים.
- source_word: חֻקָּיו
  choice: ketetapan-ketetapan-Nya
  rationale: חֹק/חֻקָּה menunjuk pada aturan yang ditetapkan; 'ketetapan' mempertahankan corak hukum dan membedakannya dari 'perintah' serta 'ketentuan'.
- source_word: אֲשֶׁר צִוָּךְ
  choice: yang telah diperintahkan-Nya kepada kalian
  rationale: Klausa relatif dipahami menerangkan seluruh rangkaian istilah hukum sebelumnya. Bentuk perfektif diterjemahkan 'telah diperintahkan' karena perintah yang sudah diberikan tetap berlaku.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung. 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Cakupan klausa אֲשֶׁר צִוָּךְ
  choice: menerangkan seluruh rangkaian perintah, ketentuan, dan ketetapan
  alternative: menerangkan hanya ketetapan-ketetapan yang tepat mendahuluinya
  rationale: Susunan kalimat paling wajar memperlakukan klausa relatif sebagai keterangan bagi ketiga kategori hukum, tanpa menghapus kemungkinan keterkaitan gramatikal terdekatnya dengan unsur terakhir.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipilih untuk menyatakan sapaan jamak dengan jelas; istilah hukum dibedakan tanpa memakai ungkapan yang terlalu teknis. Bentuk ulang dipakai untuk mempertahankan jamak eksplisit pada tiga kategori hukum.
