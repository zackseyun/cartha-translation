base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/021.yaml
  text: then you shall say to your son[a], ‘We were servants to Pharaoh in Egypt[b], and Yahweh brought us out from Egypt with a strong hand.’
translation:
  language: id
  text: Maka, engkau harus berkata kepada anak laki-lakimu, ‘Kami dahulu adalah budak Firaun di Mesir, dan Yahweh membawa kami keluar dari Mesir dengan tangan yang kuat[a].’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan tangan yang perkasa.” Ungkapan Ibrani ini menunjuk pada tindakan pembebasan Yahweh yang penuh kuasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: maka engkau harus berkata
  rationale: Konjungsi וְ melanjutkan urutan pengajaran dari ayat sebelumnya, sedangkan bentuk verba dalam konteks ini menyatakan kewajiban. ‘Maka’ memperjelas urutannya secara alami.
- source_word: לְבִנְךָ
  choice: kepada anakmu
  rationale: בֵּן berbentuk maskulin tunggal dan secara khusus berarti ‘anak laki-laki’; dalam bahasa Indonesia, ‘anakmu’ merupakan sapaan kekerabatan yang alami dan tidak meniadakan bahwa yang dimaksud dalam teks Ibrani adalah seorang anak laki-laki.
- source_word: עֲבָדִים הָיִינוּ לְפַרְעֹה
  choice: Dahulu kita adalah budak-budak Firaun
  rationale: עֲבָדִים dalam konteks keluaran menunjukkan perbudakan nyata, bukan sekadar pelayanan. Unsur ‘dahulu’ menyampaikan keadaan lampau הָיִינוּ secara alami, dan konstruksi dengan לְ menunjukkan ketundukan atau kepemilikan di bawah Firaun.
- source_word: בְּמִצְרָיִם
  choice: di Mesir
  rationale: Preposisi בְּ di sini bersifat lokatif.
- source_word: וַיּוֹצִיאֵנוּ
  choice: tetapi ... membawa kita keluar
  rationale: Bentuk hiphil dari יצא berarti menyebabkan keluar atau membawa keluar. ‘Tetapi’ menyatakan kontras wacana yang tersirat antara perbudakan dan pembebasan, sementara konjungsi Ibrani tetap dipertahankan secara fungsional.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: מִמִּצְרַיִם
  choice: dari Mesir
  rationale: Preposisi מִן menyatakan asal atau titik keberangkatan.
- source_word: בְּיָד חֲזָקָה
  choice: dengan tangan yang kuat
  rationale: Terjemahan ini dekat dengan unsur leksikal idiom Ibrani dan tetap mudah dipahami sebagai gambaran kuasa Yahweh dalam membebaskan Israel.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian secara langsung; ‘Yahweh’ mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Bobot status עֲבָדִים
  choice: budak-budak
  alternative: hamba-hamba
  rationale: Konteks Mesir menonjolkan perbudakan dan pembebasan dari penindasan. ‘Budak-budak’ mempertahankan bobot historis dan teologis tersebut.
- issue: Makna idiom בְּיָד חֲזָקָה
  choice: dengan tangan yang kuat
  alternative: dengan tangan yang perkasa
  rationale: Pilihan utama mempertahankan citra dan arti dasar חֲזָקָה; alternatif menonjolkan makna idiomatis berupa tindakan penyelamatan yang penuh kuasa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan langsung. Kata ganti ‘engkau’ mempertahankan orang kedua tunggal; ‘kita’ bersifat inklusif dalam pengakuan identitas bersama Israel. Bentuk ‘budak-budak’ dipilih agar predikat jamak terdengar wajar dan bobot perbudakan tidak dilunakkan.
