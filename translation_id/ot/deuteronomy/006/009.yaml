  text: You shall write them on the doorposts of your house and on your gates[a][b].
translation:
  language: id
  text: Tuliskanlah semuanya itu pada tiang-tiang pintu rumahmu[a] dan pada gerbang-gerbangmu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kusen-kusen pintu.” Istilah Ibraninya secara khusus menunjuk pada tiang-tiang di sisi sebuah pintu.
    reason: lexical_alternative
  - marker: b
    text: Atau, “di gerbang-gerbangmu.” Kata Ibrani ini dapat menunjuk pada gerbang atau kawasan pintu masuk.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְתַבְתָּם
  choice: Tuliskanlah semuanya itu
  rationale: Bentuk verba dalam rangkaian perintah ini berfungsi sebagai suruhan. Akhiran objek jamak dipertahankan secara eksplisit dan menunjuk kembali kepada perkataan-perkataan dalam konteks sebelumnya.
- source_word: עַל
  choice: pada
  rationale: Preposisi ini menunjukkan tempat tulisan dibubuhkan. 'Pada' alami dalam bahasa Indonesia dan mempertahankan makna lokatifnya.
- source_word: מְזוּזֹת
  choice: tiang-tiang pintu
  rationale: Nomina Ibrani ini secara khusus menunjuk pada tiang atau sisi tegak sebuah pintu. Pilihan ini lebih tepat daripada istilah yang mencakup seluruh kusen.
- source_word: בֵּיתֶךָ
  choice: rumahmu
  rationale: '''Rumahmu'' secara langsung mempertahankan acuan konkret kepada bangunan tempat tinggal sekaligus bentuk posesif orang kedua tunggal.'
- source_word: וּבִשְׁעָרֶיךָ
  choice: dan pada gerbang-gerbangmu
  rationale: שַׁעַר lazim menunjuk pada gerbang atau kawasan pintu masuk sebuah rumah, kompleks, atau permukiman. Bentuk jamak dan akhiran posesif dipertahankan; pengulangan 'pada' memperjelas kesejajaran lokasi penulisan.
