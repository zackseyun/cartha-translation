  text: You shall not go after other gods[a], the gods of the peoples who are around you.
translation:
  language: id
  text: Janganlah kalian mengikuti allah-allah lain[a], yaitu allah-allah bangsa-bangsa yang ada di sekeliling kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau secara lebih harfiah, “Janganlah kalian berjalan mengikuti allah-allah lain, dari antara allah-allah bangsa-bangsa di sekeliling kalian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תֵלְכוּן אַחֲרֵי
  choice: Janganlah kalian mengikuti
  rationale: Dalam konteks larangan, bentuk ini secara alami diterjemahkan dengan “janganlah.” Gabungan הלך dan אַחֲרֵי merupakan idiom yang berarti mengikuti atau memberikan kesetiaan, bukan sekadar berjalan secara fisik di belakang.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: allah-allah lain
  rationale: Menyatakan ilah-ilah selain TUHAN tanpa menambahkan nuansa “asing” yang tidak dinyatakan langsung oleh אֲחֵרִים. Huruf kecil membedakannya dari sebutan bagi Allah Israel.
- source_word: מֵאֱלֹהֵי הָעַמִּים
  choice: yaitu allah-allah bangsa-bangsa
  rationale: Prefiks מ dapat dipahami secara partitif, yakni bahwa allah-allah lain itu berasal dari antara ilah-ilah bangsa sekitar. Dalam bahasa Indonesia, “yaitu” menyampaikan hubungan penjelas tersebut secara wajar tanpa menghasilkan frasa kaku “dari allah-allah.”
- source_word: הָעַמִּים
  choice: bangsa-bangsa
  rationale: עַמִּים dapat berarti berbagai kelompok bangsa; “bangsa-bangsa” merupakan padanan Indonesia yang alami dalam konteks bangsa-bangsa tetangga Israel.
- source_word: אֲשֶׁר סְבִיבוֹתֵיכֶם
  choice: yang ada di sekeliling kalian
  rationale: Mempertahankan klausa relatif dan makna geografis bangsa-bangsa yang mengelilingi para pendengar.
theological_decisions:
- issue: Sifat larangan
  choice: Larangan perjanjian untuk mengikuti dan memberikan kesetiaan kepada ilah-ilah lain.
  alternative: Larangan yang hanya mengacu pada gerakan fisik menuju tempat pemujaan berhala.
  rationale: Idiom הלך אחרי dalam Ulangan lazim menyatakan tindakan mengikuti dalam arti kesetiaan dan ibadah. “Mengikuti” mempertahankan idiom itu tanpa mempersempitnya hanya menjadi gerakan fisik atau menggantinya dengan parafrasa khusus “menyembah.”
- issue: Hubungan frasa partitif מֵאֱלֹהֵי
  choice: 'Dinyatakan sebagai penjelasan: “yaitu allah-allah bangsa-bangsa.”'
  alternative: Diterjemahkan secara eksplisit “dari antara allah-allah bangsa-bangsa.”
  rationale: Bacaan partitif tetap tercakup, tetapi bentuk penjelas lebih alami dan jelas dalam bahasa Indonesia; catatan kaki mencatat alternatif yang lebih formal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk menandai sapaan orang kedua jamak dalam teks Ibrani. “Mengikuti” alami dalam bahasa Indonesia sekaligus mempertahankan makna kesetiaan religius dari idiom sumber.
