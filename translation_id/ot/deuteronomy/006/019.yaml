  text: to drive out all your enemies from before you[b][a], as Yahweh has spoken.
translation:
  language: id
  text: untuk menghalau semua musuhmu dari hadapanmu[b], seperti yang Yahweh telah katakan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “seperti yang Yahweh katakan”; verba Ibrani secara harfiah berarti “berkata” dan menunjuk pada perkataan ilahi sebelumnya yang tetap berlaku.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “dari hadapanmu,” ungkapan Ibrani untuk menyingkirkan musuh dari jalan atau keberadaan seseorang.
    reason: cultural_note
lexical_decisions:
- source_word: לַהֲדֹף
  choice: untuk menghalau
  rationale: Infinitif dengan prefiks ל menyatakan tujuan atau hasil yang melanjutkan ayat sebelumnya. Bentuk Hifil dari נדף berarti menyebabkan musuh tersingkir; “menghalau” alami dalam bahasa Indonesia dan sesuai dengan konteks militer.
- source_word: אֶת
  choice: '[penanda objek langsung, tidak diterjemahkan]'
  rationale: Penanda objek langsung Ibrani tidak memiliki padanan tersendiri dalam bahasa Indonesia.
- source_word: כָּל
  choice: semua
  rationale: Menyampaikan cakupan menyeluruh כָּל sebelum nomina jamak.
- source_word: אֹיְבֶיךָ
  choice: musuhmu
  rationale: Padanan langsung untuk אֹיֵב dengan sufiks orang kedua maskulin tunggal, mempertahankan sapaan tunggal kepada Israel.
- source_word: מִפָּנֶיךָ
  choice: dari hadapanmu
  rationale: Mempertahankan gambaran harfiah “dari wajah/hadapanmu” dan unsur מִן ‘dari’; dalam konteks ini ungkapan tersebut berarti menyingkirkan musuh dari jalan atau keberadaan Israel.
- source_word: כַּאֲשֶׁר
  choice: seperti yang
  rationale: Secara alami memperkenalkan kesesuaian tindakan itu dengan firman ilahi sebelumnya.
- source_word: דִּבֶּר
  choice: telah ... katakan
  rationale: Bentuk perfektif menunjuk pada perkataan ilahi sebelumnya. “Telah ... katakan” mempertahankan arti leksikal ‘berkata/berbicara’ tanpa mempersempitnya menjadi ‘berjanji’, sekaligus menyiratkan bahwa perkataan itu tetap berlaku.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה sebagai nama diri, bukan menggantinya dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri Allah; “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Daya makna דִּבֶּר dalam konteks perjanjian
  choice: seperti yang telah Yahweh katakan
  alternative: seperti yang Yahweh janjikan; seperti yang Yahweh firmankan
  rationale: Pilihan ini mempertahankan arti dasar ‘mengatakan’ dan membiarkan konteks menyampaikan bahwa perkataan tersebut berupa janji yang tetap berlaku. “Janjikan” lebih interpretatif, sedangkan “firmankan” memberi nuansa khusus yang tidak wajib terkandung dalam verba Ibrani.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang lugas dan bermartabat. Bentuk “musuhmu” mempertahankan sapaan tunggal Ibrani kepada Israel. Karena ayat ini merupakan lanjutan sintaksis dari ayat sebelumnya, terjemahan sengaja dimulai dengan “untuk” dan huruf kecil.
