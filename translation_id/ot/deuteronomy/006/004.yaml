  text: 'Dengarlah[a], hai Israel: Yahweh adalah Allah kita; Yahweh itu esa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dengarkanlah.” Bagian selanjutnya juga dapat diterjemahkan, “Yahweh adalah Allah kita; Yahweh saja”; atau, “Yahweh, Allah kita, adalah Yahweh yang esa.” Susunan bahasa Ibraninya padat dan memungkinkan lebih dari satu pembacaan sintaksis.
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁמַע
  choice: Dengarlah
  rationale: Bentuk perintah tunggal yang ditujukan kepada Israel sebagai satu umat. Dalam bahasa Indonesia, “Dengarlah” mempertahankan makna mendengar sekaligus seruan perjanjian untuk memperhatikan dan menaati.
- source_word: יִשְׂרָאֵל
  choice: Israel
  rationale: Nama diri umat perjanjian, dipertahankan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Walaupun bentuk אֱלֹהִים secara morfologis berciri jamak, dalam konteks ini kata tersebut berfungsi sebagai sebutan tunggal bagi Allah Israel; sufiksnya berarti “kita”.
- source_word: אֶחָד
  choice: esa
  rationale: “Esa” adalah padanan Indonesia yang alami dan bermartabat bagi “satu” ketika menyatakan keesaan Allah. Kata ini mempertahankan afirmasi numerik/keesaan tanpa memasukkan tafsiran “satu-satunya” ke dalam teks utama.
theological_decisions:
- issue: Sintaksis dan makna klausa-klausa tanpa kopula dalam Syema
  choice: “Yahweh adalah Allah kita; Yahweh itu esa”
  alternative: “Yahweh ialah Allah kita, hanya Yahweh”; atau “Yahweh, Allah kita, adalah satu Yahweh”
  rationale: Bahasa Ibrani yang padat dan tanpa verba penghubung memungkinkan beberapa pembagian sintaksis. Teks utama menyajikan pengakuan klasik tentang keesaan Yahweh dengan penambahan kopula Indonesia yang diperlukan agar kalimat alami, sedangkan pembacaan eksklusif dan konstruksi alternatif dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Partikel “hai” menandai sapaan langsung dengan jelas tanpa memakai bentuk yang terlalu arkais. Tanda titik koma membantu memperlihatkan dua klausa Ibrani yang padat sekaligus menjaga ambiguitas yang dijelaskan dalam catatan kaki.
