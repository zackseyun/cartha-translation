  text: כִּֽי יִשְׁאָלְ/ךָ֥ בִנְ/ךָ֛ מָחָ֖ר לֵ/אמֹ֑ר מָ֣ה הָ/עֵדֹ֗ת וְ/הַֽ/חֻקִּים֙ וְ/הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵ֖י/נוּ אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/020.yaml
  text: When your son asks you in time to come[a], saying[b], ‘What are the testimonies and the statutes and the judgments that Yahweh our God commanded you?’
translation:
  language: id
  text: Pada suatu waktu nanti[a], apabila anak laki-lakimu bertanya kepadamu, “Apa itu[b] kesaksian, ketetapan, dan hukum yang Yahweh, Allah kita, perintahkan kepada kalian?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “besok”; di sini kata itu dipakai secara idiomatis untuk waktu pada masa mendatang.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “Apa arti kesaksian, ketetapan, dan hukum ...?” Teks Ibrani secara langsung bertanya “Apa itu ...?”, tetapi dalam konteks ini pertanyaan tersebut meminta penjelasan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Apabila
  rationale: Kata ini memperkenalkan keadaan yang diperkirakan akan terjadi pada masa depan. “Apabila” mempertahankan corak pengajaran bersyarat tanpa membuatnya terdengar sekadar hipotetis.
- source_word: יִשְׁאָלְךָ
  choice: bertanya kepadamu
  rationale: Padanan alami bagi verba שאל dan mempertahankan objek orang kedua tunggal.
- source_word: בִנְךָ
  choice: anak laki-lakimu
  rationale: Teks Ibrani secara eksplisit memakai bentuk maskulin tunggal; padanan ini mempertahankan ketepatan gender.
- source_word: מָחָר
  choice: kelak
  rationale: Secara harfiah berarti “besok”, tetapi di sini dipakai secara idiomatis untuk suatu waktu pada masa mendatang.
- source_word: לֵאמֹר
  choice: (diungkapkan melalui kutipan langsung)
  rationale: Dalam bahasa Indonesia, isi pertanyaan dapat langsung mengikuti verba “bertanya” tanpa padanan tersendiri untuk formula Ibrani “dengan berkata”.
- source_word: מָה
  choice: Apa itu
  rationale: Padanan ini tetap dekat dengan pertanyaan langsung dalam bahasa Ibrani dan tidak memasukkan kata “arti” ke dalam teks utama, meskipun pertanyaan tersebut secara wajar meminta penjelasan.
- source_word: הָעֵדֹת
  choice: kesaksian-kesaksian
  rationale: Mempertahankan unsur kesaksian atau penegasan perjanjian dalam istilah Ibrani serta membedakannya dari dua kelompok hukum berikutnya.
- source_word: הַחֻקִּים
  choice: ketetapan-ketetapan
  rationale: Padanan hukum yang lazim bagi חֻקִּים dan tetap membedakannya dari kesaksian serta hukum.
- source_word: הַמִּשְׁפָּטִים
  choice: hukum-hukum
  rationale: Menyampaikan nuansa keputusan atau aturan hukum dari מִשְׁפָּטִים dalam bahasa Indonesia yang mudah dipahami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks sumber, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Mempertahankan bentuk posesif orang pertama jamak dan hubungan perjanjian yang diungkapkan teks.
- source_word: צִוָּה ... אֶתְכֶם
  choice: diperintahkan ... kepada kalian
  rationale: “Kalian” memperjelas bahwa sufiks objek Ibrani berbentuk orang kedua jamak, berbeda dari “-mu” tunggal sebelumnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung; “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Gender pada בִנְךָ
  choice: anak laki-lakimu
  alternative: anakmu
  rationale: Bentuk sumber adalah maskulin tunggal. Pilihan utama mempertahankan informasi tersebut tanpa menetralkannya.
- issue: Peralihan dari sapaan tunggal ke jamak
  choice: kepadamu ... kepada kalian
  alternative: kepadamu ... kepadamu
  rationale: Bahasa Ibrani mula-mula menyapa orang tua secara tunggal, lalu dalam perkataan sang anak memakai objek orang kedua jamak. Perbedaan ini dipertahankan karena dapat bermakna bagi hubungan antara anak, orang tua, dan umat.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kutipan langsung dibuat ringkas dengan menghilangkan formula kaku “dengan berkata”. Bentuk ulang dipakai pada tiga istilah hukum untuk menyatakan jamak secara jelas, sedangkan “kalian” mempertahankan perubahan penting dari orang kedua tunggal ke jamak.
