source:
  edition: WLC
  text: וְ/עָשִׂ֛יתָ הַ/יָּשָׁ֥ר וְ/הַ/טּ֖וֹב בְּ/עֵינֵ֣י יְהוָ֑ה לְמַ֨עַן֙ יִ֣יטַב לָ֔/ךְ וּ/בָ֗אתָ וְ/יָֽרַשְׁתָּ֙ אֶת הָ/אָ֣רֶץ הַ/טֹּבָ֔ה אֲשֶׁר נִשְׁבַּ֥ע יְהוָ֖ה לַ/אֲבֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/018.yaml
  text: And you shall do what is right and good in the eyes of Yahweh[a], so that it may go well for you, and you may go in and take possession of the good land that Yahweh swore to your fathers.
translation:
  language: id
  text: Lakukanlah apa yang benar dan baik di mata Yahweh, supaya engkau beroleh kebaikan dan dapat masuk serta menduduki[a] negeri yang baik, yang telah Yahweh janjikan dengan sumpah kepada bapa-bapa leluhurmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mewarisi.” Kata kerja Ibrani ini dapat berarti “mewarisi,” “memiliki,” atau “menduduki”; di sini kata itu merujuk pada Israel yang masuk dan menguasai negeri yang dijanjikan dengan sumpah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Lakukanlah
  rationale: Bentuk perfektif dengan waw dalam konteks pengajaran ini berdaya perintah untuk masa mendatang. Imperatif Indonesia menyampaikan tuntutan perjanjian secara alami.
- source_word: הַיָּשָׁר וְהַטּוֹב
  choice: apa yang benar dan baik
  rationale: Mempertahankan kedua unsur etis, yakni yang lurus atau benar dan yang baik, dalam ungkapan Indonesia yang wajar.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Mempertahankan metafora evaluatif Ibrani sekaligus memakai nama ilahi sebagaimana tertulis dalam teks sumber.
- source_word: לְמַעַן יִיטַב לָךְ
  choice: supaya keadaanmu baik
  rationale: Menyatakan tujuan atau hasil berupa kesejahteraan secara luas tanpa mempersempitnya menjadi kemakmuran materi.
- source_word: וּבָאתָ
  choice: dan engkau dapat masuk
  rationale: 'Dalam rangkaian klausa tujuan, bentuk ini menyatakan hasil yang diharapkan: Israel dapat masuk ke negeri itu.'
- source_word: וְיָרַשְׁתָּ
  choice: serta menduduki
  rationale: Dalam konteks memasuki negeri perjanjian, verba ini menunjuk pada tindakan memperoleh dan menguasai negeri tersebut; catatan kaki mempertahankan kemungkinan makna 'mewarisi'.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: negeri yang baik
  rationale: Terjemahan langsung yang mempertahankan penilaian positif teks tanpa mempersempitnya menjadi kesuburan atau keindahan.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה
  choice: yang telah Yahweh janjikan dengan sumpah
  rationale: Bahasa Indonesia membutuhkan pengungkapan yang lebih lengkap agar objek tersirat dari tindakan bersumpah jelas; frasa ini mempertahankan kekuatan sumpah perjanjian.
- source_word: לַאֲבֹתֶיךָ
  choice: kepada leluhurmu
  rationale: Dalam bahasa Indonesia modern, 'leluhur' secara alami menunjuk generasi pendahulu dan dalam konteks ini merujuk kepada para bapa leluhur Israel.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama pribadi dan tidak menggantinya dengan gelar.
- issue: Cakupan makna וְיָרַשְׁתָּ
  choice: menduduki
  alternative: mewarisi
  rationale: Konteks menekankan masuk dan memperoleh penguasaan atas negeri yang dijanjikan. Namun, nuansa warisan tetap mungkin dan dicatat tanpa meniadakan ketegangan leksikal.
- issue: Istilah kekerabatan לַאֲבֹתֶיךָ
  choice: leluhurmu
  alternative: bapa-bapa leluhurmu
  rationale: Rujukannya secara historis adalah para bapa leluhur Israel. 'Leluhurmu' merupakan padanan Indonesia modern yang wajar, sedangkan alternatif lebih eksplisit mengenai bentuk maskulin tetapi terasa kurang alami.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada perintah yang khidmat. Kata ganti tunggal 'engkau' mempertahankan sapaan tunggal Ibrani kepada Israel sebagai umat perjanjian. Metafora 'di mata Yahweh' dipertahankan karena jelas dan alami.
