  source_fidelity: 'Setia pada teks Ibrani: “Ia membawa kita keluar dari sana” menerjemahkan וְאֹתָנוּ הוֹצִיא מִשָּׁם, dan pasangan “membawa ... keluar/masuk” mempertahankan kontras verbal yang disengaja. “Untuk” menyatakan tujuan לְמַעַן secara wajar. “Yang telah dijanjikan-Nya dengan sumpah” secara idiomatis menyampaikan אֲשֶׁר נִשְׁבַּע tanpa mengurangi unsur sumpah.'
