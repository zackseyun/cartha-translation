id: DEU.6.23
reference: Deuteronomy 6:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אוֹתָ֖/נוּ הוֹצִ֣יא מִ/שָּׁ֑ם לְמַ֨עַן֙ הָבִ֣יא אֹתָ֔/נוּ לָ֤/תֶת לָ֨/נוּ֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/023.yaml
  text: And he brought us out from there[a], so that he might bring us in, to give us the land that he swore to our fathers.
translation:
  language: id
  text: Ia membawa kita keluar dari sana untuk membawa kita masuk dan memberikan kepada kita negeri yang telah dijanjikan-Nya dengan sumpah kepada nenek moyang kita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “kepada bapak-bapak kita.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוֹתָנוּ הוֹצִיא
  choice: Ia membawa kita keluar
  rationale: Objek yang dikedepankan dalam bahasa Ibrani disusun secara wajar dalam bahasa Indonesia. 'Membawa ... keluar' mempertahankan pola eksodus dan berpasangan dengan 'membawa ... masuk'.
- source_word: מִשָּׁם
  choice: dari sana
  rationale: Padanan lokatif yang langsung, alami, dan tepat.
- source_word: לְמַעַן
  choice: untuk
  rationale: Menyatakan tujuan secara ringkas dan alami; hubungan tujuan tetap jelas melalui rangkaian infinitif.
- source_word: הָבִיא אֹתָנוּ
  choice: membawa kita masuk
  rationale: Hifil dari בוא berarti menyebabkan masuk. Kata 'masuk' mempertahankan kontras dengan 'keluar' tanpa menambahkan tujuan yang tidak dinyatakan pada frasa ini.
- source_word: לָתֵת לָנוּ אֶת־הָאָרֶץ
  choice: memberikan kepada kita negeri
  rationale: '''Memberikan'' mempertahankan gagasan pemberian, sedangkan ''negeri'' merupakan padanan alami bagi הָאָרֶץ dalam konteks tanah yang dijanjikan.'
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: yang telah dijanjikan-Nya dengan sumpah
  rationale: Ungkapan ini menyampaikan arti verba 'bersumpah' secara idiomatis dalam bahasa Indonesia sekaligus mempertahankan bobot sumpah perjanjian.
- source_word: לַאֲבֹתֵינוּ
  choice: kepada nenek moyang kita
  rationale: '''Nenek moyang'' adalah padanan Indonesia yang alami untuk para leluhur Israel; bentuk harfiah ''bapak-bapak kita'' dapat disalahpahami sebagai ayah kandung langsung.'
theological_decisions:
- issue: Rujukan perjanjian dalam לַאֲבֹתֵינוּ
  choice: kepada nenek moyang kita
  alternative: kepada bapak-bapak kita
  rationale: Dalam konteks ini bentuk maskulin Ibrani menunjuk kepada leluhur Israel, khususnya para bapa leluhur. 'Nenek moyang' menyampaikan rujukan historis itu secara alami tanpa mengubah cakupannya.
- issue: Bahasa sumpah dalam נִשְׁבַּע
  choice: yang telah dijanjikan-Nya dengan sumpah
  alternative: yang telah disumpahkan-Nya
  rationale: Pilihan utama mempertahankan unsur sumpah ilahi dan terdengar lebih jelas serta alami dalam bahasa Indonesia modern daripada bentuk 'disumpahkan-Nya'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Paralel 'membawa ... keluar' dan 'membawa ... masuk' dipertahankan. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan umum penerbitan Alkitab Indonesia.
