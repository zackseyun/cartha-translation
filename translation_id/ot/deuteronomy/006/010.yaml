  terminology: “Yahweh,” “Allahmu,” “negeri,” serta nama Abraham, Ishak, dan Yakub sudah tepat dan konsisten. “Kota-kota besar dan baik” sengaja dipertahankan dekat dengan makna sumber tanpa menafsirkan “baik” sebagai makmur atau indah.
