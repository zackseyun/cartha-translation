  source_fidelity: 'Draf pada umumnya setia kepada struktur dan isi Ibrani: Yahweh sebagai pelaku, negeri sebagai objek sumpah, para patriark sebagai penerima sumpah, serta kota-kota yang tidak dibangun oleh pihak yang diajak bicara. Namun, frasa “bapak-bapak leluhurmu” menambahkan dan menumpuk dua istilah kekerabatan yang tidak diperlukan oleh teks sumber.'
