reference: Deuteronomy 6:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָיָ֞ה כִּ֥י יְבִיאֲ/ךָ֣ יְהוָ֣ה אֱלֹהֶ֗י/ךָ אֶל הָ/אָ֜רֶץ אֲשֶׁ֨ר נִשְׁבַּ֧ע לַ/אֲבֹתֶ֛י/ךָ לְ/אַבְרָהָ֛ם לְ/יִצְחָ֥ק וּֽ/לְ/יַעֲקֹ֖ב לָ֣/תֶת לָ֑/ךְ עָרִ֛ים גְּדֹלֹ֥ת וְ/טֹבֹ֖ת אֲשֶׁ֥ר לֹא בָנִֽיתָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/010.yaml
  text: And when Yahweh your God brings you into the land that he swore to your fathers—to Abraham[a], to Isaac, and to Jacob—to give you, with great and good cities that you did not build,
translation:
  language: id
  text: Ketika Yahweh, Allahmu, membawa engkau masuk ke negeri yang telah dijanjikan-Nya dengan sumpah kepada para leluhurmu[a]—kepada Abraham, Ishak, dan Yakub—untuk diberikan kepadamu, dengan kota-kota besar dan baik yang tidak kaubangun,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bapak-bapakmu”; yang dimaksud di sini ialah Abraham, Ishak, dan Yakub.
    reason: Menjelaskan bentuk harfiah istilah kekerabatan Ibrani serta acuannya yang khusus dalam konteks.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Ketika
  rationale: Konstruksi ini memperkenalkan keadaan yang akan terjadi. “Ketika” menyampaikan hubungan waktu secara alami tanpa ungkapan kaku seperti “maka akan terjadilah apabila”.
- source_word: יְבִיאֲךָ
  choice: membawa engkau masuk
  rationale: Bentuk Hifil dari בוא bersifat kausatif, yaitu membawa seseorang masuk. Pilihan ini mempertahankan unsur “masuk ke” yang tersirat oleh bentuk Ibraninya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: 'Bentuk dengan sufiks orang kedua tunggal menyatakan kepunyaan atau hubungan: “Allahmu”.'
- source_word: הָאָרֶץ
  choice: negeri
  rationale: Dalam konteks janji perjanjian, אֶרֶץ menunjuk pada negeri yang akan diberikan kepada Israel. “Negeri” alami dalam bahasa Indonesia dan tetap mempertahankan acuan teritorialnya.
- source_word: אֲשֶׁר נִשְׁבַּע ... לָתֶת לָךְ
  choice: yang telah dijanjikan-Nya dengan sumpah ... untuk diberikan kepadamu
  rationale: Ungkapan ini mempertahankan unsur sumpah dalam נִשְׁבַּע sekaligus mengungkapkan hubungan tujuan dari לָתֶת secara jelas dan alami dalam bahasa Indonesia.
- source_word: לַאֲבֹתֶיךָ
  choice: kepada bapak-bapak leluhurmu
  rationale: Pilihan ini mempertahankan bentuk maskulin “bapak-bapak” dan menjelaskan makna kekerabatan antargenerasi melalui “leluhur”, sesuai dengan nama Abraham, Ishak, dan Yakub yang langsung menyusul.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: kepada Abraham, Ishak, dan Yakub
  rationale: Nama-nama ditulis menurut bentuk baku bahasa Indonesia. Preposisi yang berulang dalam bahasa Ibrani cukup dinyatakan sekali karena ketiga nama merupakan satu rangkaian aposisional.
- source_word: עָרִים גְּדֹלֹת וְטֹבֹת
  choice: kota-kota besar dan baik
  rationale: “Besar” mempertahankan arti ukuran atau kebesaran, sedangkan “baik” menjaga keluasan makna טוֹב tanpa mempersempitnya menjadi “makmur”, “indah”, atau tafsiran lain.
- source_word: אֲשֶׁר לֹא בָנִיתָ
  choice: yang tidak kaubangun
  rationale: Klausa relatif negatif diterjemahkan langsung; bentuk “kaubangun” menyampaikan orang kedua tunggal secara ringkas dan wajar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks sumber memakai nama perjanjian ilahi secara langsung. “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Istilah kekerabatan maskulin לַאֲבֹתֶיךָ
  choice: bapak-bapak leluhurmu
  alternative: nenek moyangmu atau leluhurmu
  rationale: Nama Abraham, Ishak, dan Yakub secara khusus menjelaskan siapa yang dimaksud. Pilihan utama mempertahankan unsur maskulin teks sumber, sementara catatan menjelaskan bentuk harfiahnya.
- issue: Hubungan antara sumpah dan pemberian negeri
  choice: dijanjikan-Nya dengan sumpah ... untuk diberikan kepadamu
  alternative: yang tentangnya Ia bersumpah ... akan memberikannya kepadamu
  rationale: Pilihan utama mempertahankan baik tindakan bersumpah maupun tujuan pemberian tanpa menentukan lebih jauh isi teologis sumpah itu.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Kata ganti tunggal “engkau” dipakai karena semua bentuk orang kedua dalam ayat ini berbentuk tunggal. Tanda koma pada akhir ayat dipertahankan karena kalimat berlanjut ke ayat berikutnya.
