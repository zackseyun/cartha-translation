  text: וְ/אָ֣הַבְתָּ֔ אֵ֖ת יְהוָ֣ה אֱלֹהֶ֑י/ךָ בְּ/כָל לְבָבְ/ךָ֥ וּ/בְ/כָל נַפְשְׁ/ךָ֖ וּ/בְ/כָל מְאֹדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/005.yaml
  text: And you shall love Yahweh your God with all your heart and with all your soul and with all your might[a][b].
translation:
  language: id
  text: Kasihilah Yahweh, Allahmu, dengan segenap hatimu, dengan segenap jiwamu[a], dan dengan segenap kekuatanmu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “jiwa” juga dapat berarti “nyawa”, “hidup”, atau “diri”.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “kekuatan” secara harfiah berkaitan dengan gagasan “sangat” atau “banyak”; di sini dapat mencakup seluruh daya, kesungguhan, dan sumber daya seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָהַבְתָּ
  choice: Kasihilah
  rationale: Bentuk Qal perfek orang kedua tunggal dengan waw dalam konteks nasihat-perjanjian ini berfungsi sebagai perintah. Imperatif Indonesia menyampaikan daya perintah secara alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Dalam konteks ini bentuk tersebut menunjuk secara tunggal kepada Allah Israel; bentuk bersufiks diterjemahkan secara alami sebagai 'Allahmu'.
- source_word: בְּכָל
  choice: dengan segenap
  rationale: Ungkapan berulang ini menyatakan totalitas pengabdian. 'Dengan segenap' alami, bermartabat, dan mempertahankan penekanan anaforis teks Ibrani.
- source_word: לְבָבְךָ
  choice: hatimu
  rationale: לֵבָב mencakup batin, pikiran, dan kehendak, bukan hanya emosi. 'Hati' mempertahankan keluasan makna tanpa mempersempitnya menjadi 'pikiran'.
- source_word: נַפְשְׁךָ
  choice: jiwamu
  rationale: נֶפֶשׁ dapat berarti jiwa, nyawa, hidup, atau diri. 'Jiwa' mempertahankan istilah yang ringkas dan dikenal, sementara keluasan semantiknya dijelaskan dalam catatan kaki.
- source_word: מְאֹדֶךָ
  choice: kekuatanmu
  rationale: מְאֹד, secara harfiah berkaitan dengan 'sangat/banyak', dipakai secara substantival untuk seluruh daya, kapasitas, atau sumber daya seseorang. 'Kekuatan' merupakan padanan Indonesia yang jelas tanpa meniadakan keluasan maknanya, yang dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama perjanjian itu alih-alih menggantinya dengan gelar.
- issue: Istilah antropologis dalam perintah untuk mengasihi
  choice: hati ... jiwa ... kekuatan
  alternative: batin ... hidup ... segala milik; hati ... nyawa ... daya
  rationale: Ketiga istilah Ibrani saling bertumpang tindih dan bersama-sama menggambarkan pengabdian seluruh pribadi, bukan pembagian manusia menjadi fakultas-fakultas yang kaku. Terjemahan mempertahankan susunan dan ketegangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang lugas dan bermartabat. Imperatif 'Kasihilah' dipilih untuk daya perintah perjanjian. Pengulangan 'dengan segenap' dipertahankan demi ritme dan penekanan sumber. Semua penanda catatan kaki ditempatkan langsung setelah istilah terkait.
