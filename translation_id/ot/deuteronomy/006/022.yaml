  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן יְהוָ֡ה אוֹתֹ֣ת וּ֠/מֹפְתִים גְּדֹלִ֨ים וְ/רָעִ֧ים בְּ/מִצְרַ֛יִם בְּ/פַרְעֹ֥ה וּ/בְ/כָל בֵּית֖/וֹ לְ/עֵינֵֽי/נוּ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/022.yaml
  text: And Yahweh gave great and grievous signs and wonders in Egypt[a], against Pharaoh and against all his house[b], before our eyes.
translation:
  language: id
  text: Yahweh mengadakan tanda-tanda dan mukjizat-mukjizat yang besar dan mencelakakan di Mesir[a], terhadap Firaun dan seluruh rumah tangganya, di depan mata kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “terhadap Mesir”. Preposisi Ibrani dapat berarti “di Mesir”, tetapi dalam konteks ini juga dapat dipahami bahwa Mesir adalah sasaran tindakan penghukuman tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: mengadakan
  rationale: Secara dasar berarti ‘memberikan/menaruh’, tetapi dalam pasangan idiomatis dengan ‘tanda-tanda dan mukjizat-mukjizat’, ‘mengadakan’ menyampaikan tindakan Yahweh secara alami tanpa mempersempitnya menjadi sekadar pertunjukan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH dan mempertahankannya sebagai nama pribadi, bukan menggantinya dengan gelar.
- source_word: אוֹתֹת וּמֹפְתִים
  choice: tanda-tanda dan mukjizat-mukjizat
  rationale: 'Mempertahankan dua istilah Ibrani yang berpasangan: אות menekankan fungsi sebagai tanda, sedangkan מופת menunjuk pada perbuatan ajaib atau menakjubkan.'
- source_word: גְּדֹלִים וְרָעִים
  choice: yang besar serta dahsyat
  rationale: ‘Besar’ menyatakan kedahsyatan atau skala; רָעִים di sini menggambarkan dampak yang buruk dan mencelakakan bagi Mesir. ‘Dahsyat’ alami dalam bahasa Indonesia dan tidak menyiratkan bahwa tindakan Allah jahat secara moral.
- source_word: בְּמִצְרַיִם
  choice: di Mesir
  rationale: Mempertahankan arti lokatif paling langsung dari preposisi ב, sambil mencatat bahwa konteks memungkinkan nuansa tindakan yang diarahkan kepada Mesir.
- source_word: בְּפַרְעֹה וּבְכָל־בֵּיתוֹ
  choice: terhadap Firaun dan seluruh rumah tangganya
  rationale: Dalam konteks tulah, preposisi ב menandai pihak yang terkena tindakan. בֵּיתוֹ secara metonimis berarti rumah tangga atau seisi rumah Firaun.
- source_word: לְעֵינֵינוּ
  choice: di depan mata kami
  rationale: Ungkapan Indonesia yang alami dan dekat dengan idiom Ibrani, yang menyatakan bahwa para penutur menyaksikannya sendiri.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama perjanjian YHWH. ‘Yahweh’ mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Makna רָעִים ketika menerangkan tindakan ilahi
  choice: dahsyat
  alternative: mencelakakan; mengerikan; jahat
  rationale: Dalam konteks ini kata tersebut menyoroti akibat buruk dan berat bagi Mesir, bukan kejahatan moral pada diri Yahweh. ‘Dahsyat’ mempertahankan beratnya tindakan tanpa meniadakan sifat penghukumannya.
- issue: Fungsi preposisi ב pada Mesir, Firaun, dan rumah tangganya
  choice: di Mesir; terhadap Firaun dan seluruh rumah tangganya
  alternative: terhadap Mesir, Firaun, dan seluruh rumah tangganya
  rationale: Pada ‘Mesir’, arti lokatif tetap sangat wajar; pada frasa-frasa berikutnya, konteks menuntun kepada sasaran yang terkena tindakan. Catatan kaki mempertahankan kemungkinan bahwa rangkaian itu seluruhnya bersifat adversatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Bentuk ulang pada ‘tanda-tanda dan mukjizat-mukjizat’ mempertahankan bentuk jamak eksplisit. ‘Rumah tangga’ dipilih daripada ‘rumah’ agar metonimi Ibrani dipahami pembaca masa kini.
