base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/024.yaml
  text: And the LORD commanded us to do all these statutes, to fear the LORD our God, for our good always, to keep us alive as it is this day.
translation:
  language: id
  text: TUHAN memerintahkan kita untuk melakukan semua ketetapan ini dan untuk takut akan TUHAN, Allah kita, demi kebaikan kita sepanjang waktu dan agar kita tetap hidup, sebagaimana nyata pada hari ini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia untuk nama ilahi YHWH dan selaras dengan lapisan konsultasi POB.
- source_word: הַחֻקִּים
  choice: ketetapan
  rationale: Menyatakan peraturan yang ditetapkan secara berwenang; bentuk tunggal kolektif setelah 'segala' alami dalam bahasa Indonesia.
- source_word: לְיִרְאָה
  choice: takut akan
  rationale: Mempertahankan cakupan makna takut sekaligus hormat kepada Allah tanpa mempersempitnya menjadi sekadar rasa gentar atau rasa hormat.
- source_word: לְטוֹב לָנוּ כָּל הַיָּמִים
  choice: demi kebaikan kita senantiasa
  rationale: Menyampaikan tujuan ilahi dan nilai temporal 'sepanjang waktu/selalu' secara wajar.
- source_word: לְחַיֹּתֵנוּ
  choice: untuk memelihara hidup kita
  rationale: Bentuk kausatif menyatakan bahwa Allah menjaga atau mempertahankan mereka tetap hidup, bukan hanya memberi perintah agar mereka hidup.
- source_word: כְּהַיּוֹם הַזֶּה
  choice: seperti pada hari ini
  rationale: Mempertahankan ungkapan deiktis Ibrani yang menunjuk pada keadaan nyata saat tuturan berlangsung.
theological_decisions:
- issue: Hubungan antara melakukan ketetapan dan takut akan TUHAN
  choice: Keduanya dibiarkan sebagai unsur tujuan perintah tanpa menjelaskan hubungan dogmatis lebih lanjut.
  alternative: Menafsirkan melakukan ketetapan sebagai cara atau bukti tunggal takut kepada TUHAN.
  rationale: Susunan Ibrani memakai dua konstruksi tujuan dan tidak secara eksplisit menetapkan penjelasan teologis yang lebih sempit.
- issue: Tujuan 'memelihara hidup kita'
  choice: Diterjemahkan sebagai tujuan atau hasil yang dimaksudkan dari perintah Allah.
  alternative: Menafsirkannya secara khusus sebagai janji keselamatan kekal atau hanya kelangsungan hidup jasmani.
  rationale: Konteks perjanjian mendukung pemeliharaan hidup umat, tetapi ayat ini sendiri tidak membatasi atau memperluasnya ke rumusan doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dibuat mengalir bagi pembaca umum sambil mempertahankan urutan gagasan Ibrani. Tidak ada penanda catatan kaki karena tidak diperlukan.
