  text: וּ/בָ֨תִּ֜ים מְלֵאִ֣ים כָּל טוּב֮ אֲשֶׁ֣ר לֹא מִלֵּאתָ֒ וּ/בֹרֹ֤ת חֲצוּבִים֙ אֲשֶׁ֣ר לֹא חָצַ֔בְתָּ כְּרָמִ֥ים וְ/זֵיתִ֖ים אֲשֶׁ֣ר לֹא נָטָ֑עְתָּ וְ/אָכַלְתָּ֖ וְ/שָׂבָֽעְתָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/011.yaml
  text: and houses full of every good thing that you did not fill[a], and hewn cisterns that you did not hew[b], vineyards and olive trees that you did not plant—and you eat and are satisfied—
translation:
  language: id
  text: dan rumah-rumah yang penuh dengan segala yang baik, yang tidak kamu isi; tempat-tempat penampungan air yang dipahat, yang tidak kamu pahat; kebun-kebun anggur dan pohon-pohon zaitun yang tidak kamu tanam—dan kamu akan makan dan menjadi kenyang.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָתִּים
  choice: rumah-rumah
  rationale: Padanan konkret dan alami untuk bentuk jamak; sesuai dengan daftar sarana kehidupan yang diterima Israel.
- source_word: מְלֵאִים כָּל טוּב
  choice: penuh dengan segala yang baik
  rationale: Mempertahankan cakupan luas frasa Ibrani, yakni berbagai barang atau persediaan yang baik, tanpa membatasinya pada makna moral.
- source_word: בֹרֹת חֲצוּבִים
  choice: tempat-tempat penampungan air yang dipahat
  rationale: בֹרֹת dalam konteks ini kemungkinan menunjuk pada wadah penampung air yang dibuat dengan memahat batu; ungkapan deskriptif ini lebih mudah dipahami pembaca Indonesia daripada istilah teknis yang kurang umum.
- source_word: אֲשֶׁר לֹא חָצַבְתָּ
  choice: yang bukan kamu pahat
  rationale: Menjaga pengulangan akar חצב dan menekankan bahwa penerima tidak mengerjakan pembuatannya.
- source_word: כְּרָמִים
  choice: kebun-kebun anggur
  rationale: Menunjuk pada lahan budidaya anggur, bukan hanya tanaman anggur secara individual.
- source_word: זֵיתִים
  choice: pohon-pohon zaitun
  rationale: Dalam rangkaian hal yang ditanam, bentuk jamak ini paling jelas dipahami sebagai pohon zaitun.
- source_word: וְאָכַלְתָּ וְשָׂבָעְתָּ
  choice: Ketika kamu makan dan menjadi kenyang
  rationale: Bentuk-bentuk verbal ini meneruskan rangkaian keadaan yang akan dialami Israel. 'Ketika' secara alami menghubungkannya dengan peringatan pada ayat berikut, sementara 'menjadi kenyang' mempertahankan makna jasmani utama שׂבע.
theological_decisions:
- issue: Kelimpahan di negeri yang dijanjikan
  choice: Menyajikannya sebagai pemberian yang dinikmati Israel tanpa memasukkan peringatan ayat berikut ke dalam ayat ini
  alternative: Menambahkan penilaian bahwa harta itu diperoleh secara tidak sah atau langsung memparafrasakan peringatannya
  rationale: Ayat ini mencatat rumah, persediaan, penampungan air, dan tanaman yang tidak diusahakan Israel. Peringatan teologis dinyatakan sesudahnya dan tidak perlu disisipkan ke dalam daftar ini.
- issue: Sapaan orang kedua tunggal kepada Israel
  choice: Memakai 'kamu' secara konsisten
  alternative: Memakai 'kalian'
  rationale: Bahasa Ibrani menggunakan bentuk tunggal sebagai sapaan perjanjian kepada Israel secara kolektif; 'kamu' mempertahankan ciri itu dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Istilah deskriptif 'tempat-tempat penampungan air yang dipahat' dipilih agar gambaran penampungan air dalam batu jelas bagi pembaca umum. Tanda koma dan titik koma mempertahankan struktur daftar, sedangkan kalimat terakhir dibiarkan berlanjut secara maknawi menuju ayat berikutnya.
