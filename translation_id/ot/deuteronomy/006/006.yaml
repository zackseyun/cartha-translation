  text: And these words that I am commanding you today shall be on your heart[a].
translation:
  language: id
  text: Dan perkataan ini, yang kuperintahkan kepadamu hari ini, haruslah ada dalam hatimu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di atas hatimu.” Ini merupakan ungkapan Ibrani tentang menyimpan dan menghayati perkataan ini dalam kehidupan batin.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: harus tetap ada
  rationale: Dalam konteks perintah sebelumnya, bentuk ini menyatakan tuntutan yang berkelanjutan. Ungkapan ini alami dalam bahasa Indonesia dan menyampaikan bahwa perkataan tersebut harus terus tersimpan dalam batin.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: perkataan-perkataan
  rationale: Mempertahankan arti dasar דְּבָרִים sebagai 'perkataan' tanpa mempersempitnya menjadi 'perintah-perintah'.
- source_word: אֲשֶׁר
  choice: yang
  rationale: Penanda relatif bahasa Indonesia yang paling alami.
- source_word: אָנֹכִי
  choice: ku-
  rationale: Pronomina orang pertama diwujudkan secara alami sebagai awalan pada verba; penekanan ringan dari pronomina Ibrani tidak perlu diperkeras menjadi 'aku sendiri'.
- source_word: מְצַוְּךָ
  choice: kusampaikan kepadamu sebagai perintah
  rationale: Menyampaikan tindakan Musa yang sedang memerintahkan pendengar. Rumusan ini menghindari bentuk 'kuperintahkan kepadamu' yang kurang alami sambil tetap mempertahankan unsur perintah.
- source_word: הַיּוֹם
  choice: pada hari ini
  rationale: Padanan modern dan bermartabat yang mempertahankan kedekatan waktu dalam amanat Musa.
- source_word: עַל לְבָבֶךָ
  choice: dalam hatimu
  rationale: Dalam bahasa Indonesia, idiom yang alami untuk menyimpan dan menghayati perkataan secara batiniah memakai 'dalam hati'. Makna harfiah preposisi עַל dicatat dalam catatan kaki.
theological_decisions:
- issue: Ungkapan antropologis לְבָב
  choice: hati
  alternative: pikiran; batin
  rationale: '''Hati'' mempertahankan gambaran antropologis Ibrani yang meliputi pikiran, kehendak, dan perasaan, tanpa mempersempit maknanya pada kecerdasan atau emosi saja.'
- issue: Daya perintah וְהָיוּ
  choice: harus tetap ada
  alternative: akan ada; hendaklah ada
  rationale: Konteks amanat memberi bentuk ini daya normatif sekaligus berkelanjutan. Pilihan ini tidak menjadikannya sekadar prediksi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan mudah dipahami. Susunan kalimat dijaga ringkas dan bermartabat; idiom sumber dijelaskan melalui catatan kaki agar gambaran Ibraninya tetap tersedia.
