reference: Deuteronomy 6:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֣י אֵ֥ל קַנָּ֛א יְהוָ֥ה אֱלֹהֶ֖י/ךָ בְּ/קִרְבֶּ֑/ךָ פֶּן יֶ֠חֱרֶה אַף יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בָּ֔/ךְ וְ/הִשְׁמִ֣ידְ/ךָ֔ מֵ/עַ֖ל פְּנֵ֥י הָ/אֲדָמָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/015.yaml
  text: for Yahweh your God in your midst is a jealous God[b][a], lest the anger of Yahweh your God burn against you and he destroy you from the face of the earth.
translation:
  language: id
  text: Sebab Yahweh, Allahmu, yang ada di tengah-tengahmu, adalah Allah yang cemburu[a]. Jangan sampai murka Yahweh, Allahmu, menyala terhadapmu, lalu Ia memusnahkanmu dari muka bumi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani ini juga dapat dipahami sebagai “bersemangat menuntut pengabdian.” Yang ditekankan ialah tuntutan perjanjian Yahweh agar umat-Nya hanya mengabdi kepada-Nya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari atas permukaan tanah”; suatu ungkapan untuk disingkirkan sepenuhnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini menghubungkan ayat dengan larangan sebelumnya dan memperkenalkan alasan bagi larangan tersebut.
- source_word: אֵל קַנָּא
  choice: Allah yang cemburu
  rationale: Ungkapan ini menyatakan tuntutan perjanjian Yahweh atas pengabdian umat-Nya yang eksklusif serta penolakan-Nya terhadap penyembahan ilah lain. Pilihan ini mempertahankan ketegangan metaforis teks Ibrani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan agar nama perjanjian yang terdapat langsung dalam teks Ibrani tetap tampak, bukan diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk ini adalah konstruksi dengan sufiks orang kedua maskulin tunggal; bentuk terikat 'Allahmu' menyampaikan relasi itu dengan ringkas dan alami.
- source_word: בְּקִרְבֶּךָ
  choice: yang ada di tengah-tengahmu
  rationale: Frasa ini menunjuk kepada kehadiran Yahweh di tengah umat, bukan terutama di dalam batin individu.
- source_word: פֶּן
  choice: Jangan sampai
  rationale: Ungkapan ini secara alami memperkenalkan akibat yang diperingatkan dan mungkin terjadi.
- source_word: יֶחֱרֶה אַף
  choice: murka ... menyala
  rationale: Pilihan ini mempertahankan metafora Ibrani tentang amarah yang terbakar sambil tetap wajar dalam bahasa Indonesia.
- source_word: בָּךְ
  choice: terhadapmu
  rationale: Dalam konteks murka, preposisi ini menyatakan bahwa umat menjadi sasaran murka Yahweh.
- source_word: וְהִשְׁמִידְךָ
  choice: lalu Ia memusnahkanmu
  rationale: Bentuk kausatif verba ini menyatakan penghancuran atau pelenyapan yang tegas; 'memusnahkan' mempertahankan kekuatan ancamannya.
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: dari muka bumi
  rationale: Ini adalah padanan Indonesia yang alami bagi idiom Ibrani tentang disingkirkan sepenuhnya dari permukaan tanah atau bumi.
theological_decisions:
- issue: Kecemburuan ilahi
  choice: Allah yang cemburu
  alternative: Allah yang bersemangat menuntut pengabdian
  rationale: Teks menggambarkan tuntutan perjanjian Allah yang eksklusif, bukan iri hati yang berdosa. 'Cemburu' mempertahankan istilah dan ketegangan teologis teks, sedangkan catatan kaki mencegah salah pengertian.
- issue: Nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama pribadi perjanjian יהוה. Transliterasi 'Yahweh' mempertahankan pembedaan antara nama tersebut dan gelar umum.
- issue: Peralihan dari alasan ke peringatan
  choice: Kalimat baru pada 'Jangan sampai'
  alternative: Satu kalimat dengan anak kalimat 'supaya jangan'
  rationale: Pemisahan kalimat meningkatkan keterbacaan modern tanpa mengubah hubungan logis yang ditandai פֶּן.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat yang sesuai bagi peringatan perjanjian. Susunan kalimat dibuat alami bagi pembaca umum, sementara metafora 'murka ... menyala' dan 'muka bumi' dipertahankan. Pronomina terikat '-mu' mengikuti bentuk orang kedua tunggal dalam teks Ibrani, yang dalam konteks menyapa Israel secara kolektif.
