base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/016.yaml
  text: You shall not test Yahweh your God[b][a], as you tested him at Massah.
translation:
  language: id
  text: Janganlah kalian menguji[a] Yahweh, Allah kalian, seperti kalian menguji Dia di Masa.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mencobai” atau “menguji dengan menuntut bukti.”
    reason: lexical_alternative
  - marker: b
    text: Masa adalah tempat Israel menguji Yahweh di padang gurun (Kel. 17:1–7). Nama “Masa” berkaitan dengan kata yang berarti “menguji.”
    reason: cross_reference
lexical_decisions:
- source_word: לֹא תְנַסּוּ
  choice: Janganlah kalian menguji
  rationale: Larangan Ibrani memakai לֹא dengan bentuk orang kedua jamak. “Janganlah kalian” menyampaikan larangan dan jumlah jamak secara alami; “menguji” mempertahankan arti dasar נסה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allah kalian
  rationale: Bentuk ini memuat akhiran orang kedua jamak; “Allah kalian” menyatakannya secara jelas dalam bahasa Indonesia modern.
- source_word: כַּאֲשֶׁר
  choice: seperti
  rationale: Menandai perbandingan dengan tindakan Israel sebelumnya secara ringkas dan wajar.
- source_word: נִסִּיתֶם
  choice: kalian menguji
  rationale: Kata kerja yang sama, נסה, diterjemahkan secara konsisten untuk mempertahankan hubungan leksikal dalam ayat.
- source_word: בַּמַּסָּה
  choice: di Masa
  rationale: Nama tempat dipertahankan dan disesuaikan dengan ejaan Indonesia; unsur בְּ diterjemahkan “di.”
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks sumber menggunakan nama perjanjian secara langsung; transliterasi mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Apakah rujukan kepada Keluaran 17 dijelaskan dalam teks utama
  choice: Mempertahankan nama tempat “Masa” tanpa perluasan
  alternative: di Masa, tempat pengujian
  rationale: Teks Ibrani hanya menyebut nama tempat. Hubungan dengan peristiwa dan permainan makna namanya dijelaskan dalam catatan kaki agar teks utama tidak diparafrasakan secara berlebihan.
- issue: Rujukan pronominal kepada Yahweh
  choice: Dia
  alternative: Allah itu atau Yahweh sekali lagi
  rationale: Objek pada klausa kedua tersirat dalam bahasa Ibrani. Bahasa Indonesia memerlukan objek agar kalimat alami; “Dia” mempertahankan rujukan tanpa menambah penafsiran substantif.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Kalian” dipakai untuk menyatakan bentuk orang kedua jamak dalam teks Ibrani. Pengulangan “menguji” dipertahankan untuk mencerminkan pengulangan akar נסה.
