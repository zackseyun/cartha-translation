id: DEU.6.1
reference: Deuteronomy 6:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/זֹ֣את הַ/מִּצְוָ֗ה הַֽ/חֻקִּים֙ וְ/הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵי/כֶ֖ם לְ/לַמֵּ֣ד אֶתְ/כֶ֑ם לַ/עֲשׂ֣וֹת בָּ/אָ֔רֶץ אֲשֶׁ֥ר אַתֶּ֛ם עֹבְרִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/001.yaml
  text: This is the commandment—the statutes and the judgments—that Yahweh your God commanded to teach you[a], so that you may do them in the land into which you are crossing[c][b], to possess it.
translation:
  language: id
  text: Inilah[a] perintah—ketetapan-ketetapan dan peraturan-peraturan—yang diperintahkan Yahweh[b], Allah kalian, untuk diajarkan kepada kalian, supaya kalian melaksanakannya di negeri yang akan kalian masuki dengan menyeberang, untuk memilikinya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan inilah.” Kata penghubung pada awal ayat dapat dinyatakan secara eksplisit.
    reason: lexical_alternative
  - marker: b
    text: “Yahweh” adalah transliterasi nama ilahi YHWH; sebagian terjemahan menuliskannya sebagai “TUHAN.”
    reason: alternative_reading
  - marker: c
    text: Atau, “untuk mengambilnya sebagai milik” atau “untuk mewarisinya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: Inilah
  rationale: Bentuk ini secara alami memperkenalkan pokok baru dalam bahasa Indonesia. Unsur penghubung וְ tetap dapat dipahami dari konteks; terjemahan alternatif yang lebih eksplisit dicatat dalam catatan kaki.
- source_word: הַמִּצְוָה
  choice: perintah
  rationale: Nomina tunggal dipertahankan karena tampaknya berfungsi sebagai judul atau rangkuman kolektif bagi kategori-kategori hukum yang menyusul.
- source_word: הַחֻקִּים
  choice: ketetapan-ketetapan
  rationale: Istilah ini menunjuk pada ketentuan yang ditetapkan dan mempertahankan ragam bahasa hukum-perjanjian.
- source_word: וְהַמִּשְׁפָּטִים
  choice: dan peraturan-peraturan
  rationale: Pilihan ini wajar dalam bahasa Indonesia modern untuk keputusan atau ketentuan hukum, sekaligus membedakannya dari חֻקִּים.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks sumber ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allah kalian
  rationale: Akhiran orang kedua jamak dinyatakan dengan 'kalian' agar jumlahnya jelas dan bahasanya tetap mudah dipahami.
- source_word: לְלַמֵּד אֶתְכֶם
  choice: untuk diajarkan kepada kalian
  rationale: Bentuk pasif mempertahankan bahwa objek tersirat dari verba 'memerintahkan' tidak disebutkan dalam ayat ini, tanpa menyisipkan nama Musa ke dalam teks.
- source_word: לַעֲשׂוֹת
  choice: supaya kalian melaksanakannya
  rationale: Relasi tujuan dibuat jelas secara alami; akhiran '-nya' merujuk pada isi perintah, yaitu ketetapan dan peraturan.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים שָׁמָּה
  choice: yang kalian masuki dengan menyeberang ke sana
  rationale: Ungkapan ini mempertahankan gagasan gerak menyeberang menuju negeri tersebut, tetapi disusun secara wajar dalam bahasa Indonesia.
- source_word: לְרִשְׁתָּהּ
  choice: untuk mendudukinya
  rationale: Dalam konteks masuk ke negeri itu, ירשׁ menyatakan tindakan memperoleh dan menguasai negeri tersebut. Alternatif 'mengambilnya sebagai milik' dicatat tanpa mempersempit nuansanya menjadi penerimaan warisan yang pasif.
theological_decisions:
- issue: Hubungan antara bentuk tunggal 'perintah' dan bentuk jamak 'ketetapan-ketetapan dan peraturan-peraturan'
  choice: Mempertahankan bentuk tunggal sebagai rangkuman yang diikuti dua kategori jamak
  alternative: 'Meratakan semuanya menjadi bentuk jamak: ''perintah-perintah, ketetapan-ketetapan, dan peraturan-peraturan'''
  rationale: Teks Ibrani dengan sengaja memakai מִצְוָה dalam bentuk tunggal lalu dua nomina jamak. Tanda pisah mempertahankan ketegangan gramatikal dan kemungkinan hubungan rangkuman-penjabaran tanpa mengharmonisasikannya.
- issue: Penyebutan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama perjanjian sebagai nama diri. Transliterasi mempertahankan perbedaan antara nama tersebut dan gelar ilahi.
- issue: Pelaku yang diperintahkan untuk mengajar
  choice: Tidak menyebut Musa secara eksplisit
  alternative: yang Yahweh, Allah kalian, perintahkan kepadaku untuk kuajarkan kepada kalian
  rationale: Dalam konteks, Musa adalah pembicara dan pelaku yang dapat dipahami, tetapi unsur itu hanya tersirat dalam susunan ayat ini. Bentuk pasif menghindari penambahan yang tidak eksplisit sambil menghasilkan kalimat Indonesia yang dapat dipahami.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kalian' dipakai untuk menandai orang kedua jamak secara jelas. Ragam hukum dipertahankan melalui 'perintah', 'ketetapan-ketetapan', dan 'peraturan-peraturan', sedangkan tanda pisah menunjukkan bahwa dua kategori jamak menjabarkan nomina tunggal sebelumnya.
