  text: וְ/שִׁנַּנְתָּ֣/ם לְ/בָנֶ֔י/ךָ וְ/דִבַּרְתָּ֖ בָּ֑/ם בְּ/שִׁבְתְּ/ךָ֤ בְּ/בֵיתֶ֨/ךָ֙ וּ/בְ/לֶכְתְּ/ךָ֣ בַ/דֶּ֔רֶךְ וּֽ/בְ/שָׁכְבְּ/ךָ֖ וּ/בְ/קוּמֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/007.yaml
  text: You shall teach them diligently to your sons[a], and you shall speak of them when you sit in your house, and when you walk on the road, and when you lie down[b], and when you rise.
translation:
  language: id
  text: Ajarkanlah semuanya itu dengan tekun[a] kepada putra-putramu[b]. Bicarakanlah semuanya itu ketika engkau duduk di rumahmu, ketika engkau berjalan di jalan, ketika engkau berbaring, dan ketika engkau bangun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang digunakan secara harfiah berkaitan dengan “mengasah”; di sini maknanya adalah mengajarkan atau menanamkan dengan cermat dan berulang-ulang.
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “putra-putramu”; dalam konteks rumah tangga, ungkapan ini dapat mencakup anak-anak secara lebih luas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁנַּנְתָּם
  choice: Ajarkanlah semuanya itu dengan tekun
  rationale: Kata kerja שׁנן secara harfiah berkaitan dengan mengasah, tetapi di sini dipakai secara metaforis untuk pengajaran yang dilakukan dengan cermat dan berulang-ulang. Ungkapan ini mempertahankan daya intensifnya dalam bahasa Indonesia yang wajar.
- source_word: לְבָנֶיךָ
  choice: kepada putra-putramu
  rationale: בנים berbentuk jamak maskulin dan secara leksikal berarti 'putra-putra'. Pilihan ini mempertahankan bentuk bergender dari teks sumber; kemungkinan cakupan yang lebih luas dijelaskan dalam catatan kaki.
- source_word: וְדִבַּרְתָּ בָּם
  choice: Bicarakanlah semuanya itu
  rationale: Konstruksi דבר ב paling wajar menyatakan berbicara mengenai sesuatu. 'Bicarakanlah semuanya itu' alami dalam bahasa Indonesia dan tetap merujuk pada perkataan-perkataan dalam konteks sebelumnya.
- source_word: בְּשִׁבְתְּךָ בְּבֵיתֶךָ
  choice: ketika engkau duduk di rumahmu
  rationale: Infinitif dengan prefiks ב menyatakan keadaan waktu atau kebiasaan; terjemahan ini ringkas dan dekat dengan susunan Ibrani.
- source_word: וּבְלֶכְתְּךָ בַדֶּרֶךְ
  choice: ketika engkau berjalan di jalan
  rationale: דרך berarti jalan atau lintasan. Terjemahan ini mempertahankan gambaran konkret perjalanan sehari-hari tanpa mempersempitnya menjadi jenis perjalanan tertentu.
- source_word: וּבְשָׁכְבְּךָ
  choice: ketika engkau berbaring
  rationale: Ungkapan ini menunjuk pada saat berbaring, terutama untuk tidur, tetapi terjemahan tidak mempersempit makna yang masih umum dalam bahasa sumber.
- source_word: וּבְקוּמֶךָ
  choice: ketika engkau bangun
  rationale: קום berarti bangkit atau bangun. Dalam pasangan dengan 'berbaring', 'bangun' merupakan padanan Indonesia yang alami dan jelas.
theological_decisions:
- issue: Istilah keturunan bergender dalam pengajaran perjanjian
  choice: putra-putramu
  alternative: anak-anakmu
  rationale: Teks Ibrani memakai bentuk jamak maskulin בנים. Teks utama mempertahankan bentuk tersebut dan tidak diam-diam memperluasnya, sementara pemakaian yang dapat mewakili anak-anak dalam rumah tangga dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat tanpa menjadi kaku. Kata ganti 'engkau' mempertahankan sapaan orang kedua tunggal dalam bahasa Ibrani. Pengulangan 'ketika' menjaga irama rangkaian kegiatan sehari-hari dan membuat hubungan waktunya jelas.
