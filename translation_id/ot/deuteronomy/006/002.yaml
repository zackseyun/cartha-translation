base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/006/002.yaml
  text: so that you may fear Yahweh your God[a], by keeping all his statutes and his commandments that I am commanding you—you and your son and your grandson—all the days of your life[c][b], and so that your days may be prolonged.
translation:
  language: id
  text: supaya kamu takut kepada Yahweh, Allahmu, dengan menaati segala ketetapan dan perintah-Nya yang kuperintahkan kepadamu—kamu, anakmu, dan cucumu—seumur hidupmu, dan supaya hari-harimu panjang.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: 'Secara harfiah: “supaya hari-harimu menjadi panjang.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: supaya
  rationale: Mengungkapkan tujuan atau hasil secara alami dalam bahasa Indonesia modern.
- source_word: תִּירָא
  choice: takut
  rationale: Mempertahankan bobot leksikal dan teologis ירא, yang dalam hubungan dengan Allah mencakup rasa takut, hormat, dan gentar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks sumber, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Mencerminkan bentuk dengan sufiks orang kedua tunggal dan bahasa hubungan perjanjian.
- source_word: לִשְׁמֹר
  choice: dengan menaati
  rationale: Dalam konteks ketetapan dan perintah, שמר berarti memelihara dengan menjalankannya; frasa ini juga memperjelas cara takut kepada Yahweh diwujudkan.
- source_word: חֻקֹּתָיו
  choice: segala ketetapan-Nya
  rationale: Menyampaikan peraturan yang telah ditetapkan serta membedakannya dari perintah.
- source_word: מִצְוֺתָיו
  choice: perintah-Nya
  rationale: Padanan Indonesia yang wajar dan tetap membedakan מִצְוֹת dari חֻקּוֹת.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּךָ
  choice: yang kusampaikan kepadamu
  rationale: Dalam konteks Musa menyampaikan perintah ilahi, pilihan ini alami dan mempertahankan situasi tutur kini tanpa menambahkan 'hari ini'.
- source_word: אַתָּה וּבִנְךָ וּבֶן בִּנְךָ
  choice: kamu, anakmu, dan anak dari anakmu
  rationale: Mempertahankan penyebutan eksplisit tiga generasi dan bentuk harfiah generasi ketiga tanpa membatasi jenis kelaminnya secara tidak perlu dalam bahasa sasaran.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: seumur hidupmu
  rationale: Padanan Indonesia idiomatis untuk 'sepanjang segala hari hidupmu' dengan cakupan waktu yang sama.
- source_word: וּלְמַעַן יַאֲרִכֻן יָמֶיךָ
  choice: dan supaya lanjut umurmu
  rationale: Ungkapan Indonesia yang alami dan dekat dengan idiom Ibrani bahwa hari-hari seseorang menjadi panjang.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian secara langsung; transliterasi mempertahankan nama itu alih-alih menggantinya dengan gelar.
- issue: Makna takut kepada Allah
  choice: takut
  alternative: hormat kepada
  rationale: Kata 'takut' mempertahankan ketegangan makna yang mencakup rasa takut, hormat, dan gentar, serta tidak mempersempitnya menjadi penghormatan semata.
- issue: Hubungan takut kepada Yahweh dan ketaatan
  choice: dengan menaati
  alternative: untuk menaati
  rationale: Infinitif לִשְׁמֹר dapat menyatakan cara atau wujud takut kepada Allah; pilihan ini mempertahankan kaitan erat tersebut tanpa menyatakan bahwa keduanya identik sepenuhnya.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Bentuk sapaan tunggal dipertahankan dengan “kamu”; nama Yahweh ditransliterasikan; tanda pisah mempertahankan penekanan pada tiga generasi.
