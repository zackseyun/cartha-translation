base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/019.yaml
  text: When you reap your harvest in your field and forget a sheaf in the field[a], you shall not go back to take it. It shall be for the sojourner, the fatherless, and the widow[b], so that Yahweh your God may bless you in all the work of your hands.
translation:
  language: id
  text: Apabila kamu menuai hasil panen di ladangmu dan lupa akan seikat hasil panen di ladang itu, jangan kembali untuk mengambilnya. Ikatan itu harus diperuntukkan bagi pendatang[a], anak yatim[b], dan janda, supaya Yahweh, Allahmu, memberkati kamu dalam segala pekerjaan tanganmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang asing yang menetap” atau “perantau.” Istilah Ibrani ini menunjuk kepada orang nonpribumi yang tinggal di tengah masyarakat Israel.
    reason: lexical_alternative
  - marker: b
    text: Atau “anak tanpa ayah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Apabila
  rationale: Kata ini membuka kasus hukum yang bersifat situasional. “Apabila” alami dalam bahasa hukum Indonesia dan tetap mempertahankan nuansa bersyarat.
- source_word: תִקְצֹר קְצִירְךָ
  choice: kamu menuai hasil panen
  rationale: “Menuai” mempertahankan gambaran khusus tentang pemotongan tanaman biji-bijian, sedangkan “hasil panen” menyampaikan objek panen secara alami.
- source_word: עֹמֶר
  choice: seberkas gandum
  rationale: Dalam konteks ini kata tersebut berarti ikatan atau berkas tanaman biji-bijian yang telah dipotong, bukan satuan takaran omer. “Gandum” dipakai sebagai sebutan umum yang mudah dipahami untuk tanaman biji-bijian dalam konteks penuaian.
- source_word: לֹא תָשׁוּב לְקַחְתּוֹ
  choice: jangan kembali untuk mengambilnya
  rationale: Bentuk larangan dan unsur gerak kembali untuk mengambil berkas tersebut dipertahankan secara langsung.
- source_word: לַגֵּר
  choice: bagi pendatang
  rationale: גֵּר menunjuk kepada orang bukan pribumi yang menetap di tengah masyarakat Israel. “Pendatang” lebih alami daripada istilah teknis “orang asing yang menetap,” sementara catatan kaki menjelaskan cakupan sosial-hukumnya.
- source_word: לַיָּתוֹם
  choice: anak yatim
  rationale: “Anak yatim” adalah ungkapan Indonesia yang alami bagi anak yang kehilangan ayah atau orang tua dan sesuai dengan kelompok rentan yang dimaksud.
- source_word: יִהְיֶה
  choice: harus diperuntukkan bagi
  rationale: Pilihan ini menyampaikan bahwa berkas tersebut disediakan bagi kelompok-kelompok rentan tanpa menyatakan pemindahan hak milik secara lebih tegas daripada teks Ibrani.
- source_word: לְמַעַן
  choice: supaya
  rationale: Mengungkapkan tujuan atau hasil yang diharapkan dengan bahasa Indonesia yang lugas.
- source_word: בְּכֹל מַעֲשֵׂה יָדֶיךָ
  choice: dalam segala pekerjaan tanganmu
  rationale: Mempertahankan ungkapan konkret bahasa Ibrani sekaligus tetap dapat dipahami sebagai segala sesuatu yang dikerjakan seseorang.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu dan membedakannya dari gelar umum untuk Tuhan.
- issue: Kategori sosial-hukum גֵּר
  choice: pendatang
  alternative: orang asing; orang asing yang menetap; perantau
  rationale: Istilah ini menunjuk kepada orang non-Israel yang tinggal di tengah Israel, bukan sekadar pengunjung atau orang yang sama sekali berada di luar komunitas. Catatan kaki mempertahankan nuansa tersebut tanpa membebani teks utama.
- issue: Hubungan berkat dengan ketaatan sosial
  choice: supaya Yahweh, Allahmu, memberkati kamu
  alternative: agar Yahweh, Allahmu, dapat memberkati kamu
  rationale: Bentuk tujuan לְמַעַן dipertahankan tanpa menjelaskan secara berlebihan apakah berkat itu merupakan akibat otomatis, maksud hukum, atau tindakan bebas Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur hukum kasuistis dipertahankan dengan “Apabila” dan larangan langsung. Ungkapan “pekerjaan tanganmu” sengaja dipertahankan karena jelas dalam konteks dan menjaga citra konkret teks sumber.
