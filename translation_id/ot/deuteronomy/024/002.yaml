lexical_decisions:
- source_word: וְיָצְאָה מִבֵּיתוֹ
  choice: lalu ia meninggalkan rumah laki-laki itu
  rationale: Bentuk wayyiqtol melanjutkan urutan kasus hukum. Dalam bahasa Indonesia, “meninggalkan rumah” secara alami menyatakan gerak keluar dari rumah; “laki-laki itu” memperjelas akhiran pronominal maskulin tanpa memakai “rumahnya” yang dapat terasa kurang jelas.
- source_word: וְהָלְכָה
  choice: pergi
  rationale: הלך menandai tindakan berikutnya sesudah keluar. “Pergi” mempertahankan makna umum tanpa menambahkan cara atau tujuan perjalanan.
- source_word: וְהָיְתָה לְאִישׁ אַחֵר
  choice: dan menjadi istri laki-laki lain
  rationale: Konstruksi היה dengan ל menyatakan masuk ke dalam suatu keadaan atau hubungan. Dalam konteks perceraian dan perkawinan kembali, ungkapan ini merujuk pada menjadi istri laki-laki lain; kata “istri” dibuat eksplisit agar idiom Ibrani dipahami secara alami.
