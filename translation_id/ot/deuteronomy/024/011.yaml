  text: You shall stand outside[a], and the man to whom you are making the loan shall bring the pledge out to you.
translation:
  language: id
  text: Hendaklah engkau berdiri di luar, dan laki-laki yang engkau beri pinjaman[a] harus membawa barang jaminan itu keluar kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “laki-laki yang berutang kepadamu.” Ungkapan Ibrani ini dapat menekankan tindakan kreditur dalam memberi pinjaman atau keadaan debitur sebagai orang yang berutang.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחוּץ
  choice: di luar
  rationale: Frasa ini menunjuk tempat di luar rumah peminjam; “di luar” merupakan ungkapan Indonesia yang alami dan tepat dalam konteks hukum ini.
- source_word: תַּעֲמֹד
  choice: harus berdiri
  rationale: Kata עמד secara konkret berarti “berdiri”; dalam konteks ini juga tersirat bahwa pemberi pinjaman menunggu di luar, tetapi makna fisiknya dipertahankan.
- source_word: וְהָאִישׁ
  choice: dan orang
  rationale: איש merujuk kepada laki-laki dalam rumusan hukum kasus ini. Bahasa Indonesia lazim memakai “orang” dalam konstruksi relatif seperti ini tanpa mengubah pihak yang dimaksud oleh konteks.
- source_word: אֲשֶׁר אַתָּה נֹשֶׁה בוֹ
  choice: yang kepadanya engkau memberikan pinjaman
  rationale: Ungkapan ini dapat menyoroti tindakan pihak kreditur dalam memberi pinjaman ataupun keadaan pihak debitur yang berutang. Terjemahan utama mengikuti sudut pandang kreditur, sedangkan ambiguitas leksikalnya dicatat dalam catatan kaki.
- source_word: יוֹצִיא
  choice: harus membawa ... keluar
  rationale: Bentuk Hifil dari יצא berarti menyebabkan sesuatu keluar, sehingga “membawa ... keluar” menyatakan gerakan barang dari dalam rumah.
- source_word: אֵלֶיךָ
  choice: kepadamu
  rationale: Preposisi ini menyatakan arah menuju pemberi pinjaman.
- source_word: הָעֲבוֹט
  choice: barang jaminan itu
  rationale: עבוט adalah barang yang diserahkan sebagai jaminan pinjaman. “Barang jaminan” lebih jelas bagi pembaca Indonesia modern daripada hanya “jaminan”, yang juga dapat menunjuk konsep abstrak.
- source_word: הַחוּצָה
  choice: keluar
  rationale: Bentuk direktif ini berarti menuju ke luar; “keluar” secara alami melengkapi verba “membawa”.
