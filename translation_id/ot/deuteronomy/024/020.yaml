  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֤י תַחְבֹּט֙ זֵֽיתְ/ךָ֔ לֹ֥א תְפָאֵ֖ר אַחֲרֶ֑י/ךָ לַ/גֵּ֛ר לַ/יָּת֥וֹם וְ/לָ/אַלְמָנָ֖ה יִהְיֶֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/020.yaml
  text: When you beat your olive tree[a], you shall not go over it again; it shall be for the sojourner, for the fatherless[c][b], and for the widow.
translation:
  language: id
  text: Apabila engkau memukul-mukul pohon zaitunmu, janganlah engkau kembali mengambil buah yang tertinggal[a]; buah itu harus dibiarkan bagi pendatang[b], anak yatim[c], dan janda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “janganlah engkau memeriksa kembali dahan-dahannya,” yakni jangan melakukan pemetikan kedua untuk mengambil buah zaitun yang tertinggal setelah pemukulan pertama.
    reason: lexical_alternative
  - marker: b
    text: “Pendatang” menerjemahkan גֵּר, yaitu orang bukan asli yang tinggal di tengah masyarakat Israel; dapat juga diterjemahkan “orang asing yang menetap.”
    reason: cultural_note
  - marker: c
    text: Secara khusus, istilah Ibrani ini dapat berarti anak yang tidak berayah; dapat juga diterjemahkan “anak piatu” dalam pemakaian tertentu, tetapi “anak yatim” adalah istilah Indonesia yang lazim.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Apabila
  rationale: Dalam rumusan hukum ini, כִּי memperkenalkan keadaan yang berulang dan lebih alami diterjemahkan sebagai klausa waktu daripada syarat yang meragukan.
- source_word: תַחְבֹּט
  choice: engkau memukul-mukul
  rationale: חבט menunjuk pada tindakan memukul atau mengguncang dahan agar buah zaitun jatuh; bentuk ulang menyampaikan tindakan panen tersebut secara wajar dalam bahasa Indonesia.
- source_word: זֵיתְךָ
  choice: pohon zaitunmu
  rationale: זַיִת dapat berarti buah zaitun atau pohonnya, tetapi tindakan memukul menunjukkan bahwa yang dimaksud di sini ialah pohon zaitun.
- source_word: לֹא תְפָאֵר אַחֲרֶיךָ
  choice: janganlah engkau kembali mengambil buah yang tertinggal
  rationale: Ungkapan langka ini melarang pemilik melakukan penyisiran kedua untuk mengambil sisa buah setelah panen pertama. Terjemahan ini menyampaikan maksud pertanian dan hukum secara jelas tanpa memakai idiom Indonesia yang janggal.
- source_word: לַגֵּר
  choice: bagi pendatang
  rationale: גֵּר adalah orang bukan asli yang tinggal di tengah masyarakat Israel. 'Pendatang' ringkas dan mudah dipahami, sementara catatan kaki menjelaskan status menetapnya.
- source_word: לַיָּתוֹם
  choice: anak yatim
  rationale: יָתוֹם menunjuk pada anak yang kehilangan ayah dan karena itu rentan secara sosial; 'anak yatim' adalah padanan Indonesia yang lazim.
- source_word: וְלָאַלְמָנָה
  choice: dan janda
  rationale: Padanan baku dan alami bagi אַלְמָנָה dalam hukum perlindungan sosial.
- source_word: יִהְיֶה
  choice: buah itu harus dibiarkan
  rationale: Kata kerja 'menjadi/ada' di sini menyatakan peruntukan secara hukum. 'Harus dibiarkan' memperjelas bahwa sisa panen tidak boleh diambil pemilik, melainkan tersedia bagi kelompok yang disebutkan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan tunggal 'engkau' mempertahankan bentuk orang kedua tunggal dalam teks Ibrani. Susunan kalimat dibuat alami bagi pembaca umum, sementara metafora panen dan kelompok penerima tetap dipertahankan.
