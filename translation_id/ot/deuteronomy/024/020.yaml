  source_fidelity: 'Terjemahan menangkap dengan tepat struktur hukum kasuistis ayat ini: pemukulan pohon zaitun, larangan melakukan pengambilan kedua atas sisa buah, dan peruntukannya bagi tiga kelompok rentan. “Buah itu harus dibiarkan” secara sah menyatakan implikasi hukum dari יִהְיֶה (“itu akan menjadi/bagi”).'
