base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/010.yaml
  text: When you lend your neighbor anything[a], you shall not go into his house to take his pledge.
translation:
  language: id
  text: Apabila[a] engkau memberi pinjaman apa pun kepada sesamamu, janganlah engkau masuk ke rumahnya untuk mengambil barang jaminannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: Jika.'
    reason: כִּי dalam rumusan hukum ini dapat dipahami sebagai pengantar keadaan yang berarti “apabila/ketika” atau sebagai syarat, “jika”.
lexical_decisions:
- source_word: כִּי
  choice: Apabila
  rationale: Dalam rumusan hukum kasuistik ini, כִּי memperkenalkan suatu keadaan. “Apabila” terdengar alami dalam bahasa hukum Indonesia dan tetap dekat dengan kemungkinan makna “ketika” atau “jika”.
- source_word: תַשֶּׁה ... מַשַּׁאת מְאוּמָה
  choice: engkau memberi pinjaman apa pun
  rationale: Bentuk Hifil תַשֶּׁה menyatakan pemberian pinjaman atau kredit, sedangkan מַשַּׁאת מְאוּמָה memperluas cakupannya menjadi pinjaman dalam bentuk apa pun. Ungkapan ini alami dan ringkas dalam bahasa Indonesia.
- source_word: בְרֵעֲךָ
  choice: kepada sesamamu
  rationale: רֵעַ menunjuk kepada sesama atau rekan dalam komunitas. “Sesamamu” mempertahankan nuansa relasional tanpa membatasinya pada orang yang tinggal berdekatan.
- source_word: לֹא תָבֹא אֶל בֵּיתוֹ
  choice: janganlah engkau masuk ke rumahnya
  rationale: Imperfek dengan לֹא berfungsi sebagai larangan. “Janganlah” sesuai dengan ragam perintah hukum yang lugas dan bermartabat.
- source_word: לַעֲבֹט עֲבֹטוֹ
  choice: untuk mengambil barang jaminannya
  rationale: Akar עבט di sini berkaitan dengan pengambilan benda yang dijadikan jaminan utang. “Barang jaminan” lebih jelas bagi pembaca Indonesia modern daripada sekadar “jaminan” dan tidak menyiratkan penyitaan dengan kekerasan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, lugas, dan bermartabat dengan nuansa hukum yang tetap mudah dipahami. Pronomina “engkau” dipertahankan karena perintah ditujukan kepada orang kedua tunggal.
