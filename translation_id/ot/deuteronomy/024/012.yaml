  text: And if he is a poor man[a], you shall not sleep with his pledge.
translation:
  language: id
  text: Dan jika ia orang miskin, janganlah engkau tidur sementara barang jaminannya masih padamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “janganlah engkau berbaring dengan barang jaminannya,” yaitu jangan menahan semalaman barang yang diberikannya sebagai jaminan pinjaman.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Dan jika
  rationale: Mempertahankan daya penghubung ו sekaligus memperkenalkan syarat yang melanjutkan ketentuan pada ayat sebelumnya.
- source_word: אִישׁ עָנִי הוּא
  choice: ia seorang yang miskin
  rationale: Menyampaikan keadaan ekonomi orang laki-laki yang dimaksud tanpa menambahkan tafsiran di luar teks; הוּא memberi penegasan pada keadaannya.
- source_word: לֹא תִשְׁכַּב
  choice: janganlah engkau tidur
  rationale: Mempertahankan gambaran harfiah verba שׁכב, yaitu berbaring atau tidur, dalam larangan yang berkaitan dengan penahanan jaminan semalaman.
- source_word: בַּעֲבֹטוֹ
  choice: sementara barang jaminannya masih padamu
  rationale: עֲבוֹטוֹ adalah barang miliknya yang dijadikan jaminan. Dalam konteks hukum ini, preposisi ב menyatakan bahwa pemberi pinjaman tidak boleh bermalam sambil tetap menguasai barang tersebut; ungkapan Indonesia ini menyampaikan maksud itu secara wajar tanpa menghapus gambaran tidur.
theological_decisions:
- issue: Apakah larangan ini hanya menyangkut tidur secara harfiah bersama barang jaminan atau menahan jaminan itu semalaman
  choice: Teks utama menyatakan bahwa barang jaminan masih berada pada pemberi pinjaman ketika ia tidur.
  alternative: 'Terjemahan sangat harfiah: “janganlah engkau tidur dengan barang jaminannya.”'
  rationale: Konteks langsung ayat 13 menunjukkan kewajiban mengembalikan barang jaminan menjelang matahari terbenam. Namun, catatan kaki mempertahankan bentuk ungkapan Ibrani agar hubungan antara gambaran harfiah dan implikasi hukumnya tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum yang lugas. Kata ganti “engkau” mempertahankan sapaan tunggal dalam teks Ibrani; “barang jaminan” lebih mudah dipahami pembaca umum daripada istilah teknis “agunan” atau “kolateral”.
