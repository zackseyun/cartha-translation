source:
  edition: WLC
  text: זָכ֕וֹר אֵ֧ת אֲשֶׁר עָשָׂ֛ה יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/מִרְיָ֑ם בַּ/דֶּ֖רֶךְ בְּ/צֵאתְ/כֶ֥ם מִ/מִּצְרָֽיִם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/009.yaml
  text: Remember what Yahweh your God did to Miriam on the way when you were coming out of Egypt[a][b].
translation:
  language: id
  text: Ingatlah apa yang telah dilakukan Yahweh, Allahmu, terhadap Miryam dalam perjalanan ketika kalian keluar dari Mesir.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “apa yang Yahweh, Allahmu, lakukan terhadap Miryam.”
    reason: Alternatif ini menerjemahkan kata kerja Ibrani tanpa penanda aspek “telah”; konteksnya tetap menunjuk pada tindakan lampau.
  - marker: b
    text: Maksudnya, selama perjalanan Israel setelah keluar dari Mesir; lihat Bilangan 12:1–15.
    reason: Rujukan silang menjelaskan peristiwa mengenai Miryam yang disinggung secara ringkas dalam ayat ini.
lexical_decisions:
- source_word: זָכוֹר
  choice: Ingatlah
  rationale: Bentuk imperatif tunggal ini menyampaikan perintah langsung untuk mengingat, dengan daya peringatan perjanjian yang tetap terjaga.
- source_word: אֵת אֲשֶׁר עָשָׂה
  choice: apa yang telah dilakukan
  rationale: Ungkapan ini memperkenalkan isi yang harus diingat. Kata 'telah' secara alami menandai tindakan lampau yang sudah terjadi tanpa menentukan secara berlebihan hubungan waktunya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber dipertahankan.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk dengan akhiran orang kedua tunggal diterjemahkan secara langsung dan mempertahankan sapaan tunggal.
- source_word: לְמִרְיָם
  choice: terhadap Miryam
  rationale: Preposisi menandai Miryam sebagai orang yang terkena tindakan itu. 'Terhadap' mempertahankan keluasan nuansa tanpa menjelaskan tindakan tersebut secara eksplisit.
- source_word: בַּדֶּרֶךְ
  choice: dalam perjalanan
  rationale: Padanan ini alami dalam bahasa Indonesia dan merujuk pada perjalanan Israel sesudah keluar dari Mesir.
- source_word: בְּצֵאתְכֶם מִמִּצְרָיִם
  choice: ketika kalian keluar dari Mesir
  rationale: Konstruksi temporal ini memakai akhiran orang kedua jamak. 'Kalian' mempertahankan peralihan jumlah dari sapaan tunggal sebelumnya ke kelompok Israel.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung; transliterasi 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Tindakan Yahweh terhadap Miryam tidak dijabarkan dalam ayat ini
  choice: terhadap Miryam
  alternative: menghukum Miryam
  rationale: Teks hanya mengatakan apa yang Yahweh lakukan terhadap Miryam. Terjemahan tidak memasukkan penafsiran eksplisit tentang tindakan itu, sedangkan catatan silang mengarahkan pembaca kepada kisah terkait.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Bentuk 'Allahmu' mempertahankan sapaan tunggal dalam sumber, sedangkan 'kalian' mempertahankan bentuk jamak pada klausa keluarnya Israel dari Mesir. Nama 'Miryam' mengikuti bentuk yang dekat dengan nama Ibrani.
