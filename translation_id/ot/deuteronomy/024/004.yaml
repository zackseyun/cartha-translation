  text: לֹא יוּכַ֣ל בַּעְלָ֣/הּ הָ/רִאשׁ֣וֹן אֲשֶֽׁר שִׁ֠לְּחָ/הּ לָ/שׁ֨וּב לְ/קַחְתָּ֜/הּ לִ/הְי֧וֹת ל֣/וֹ לְ/אִשָּׁ֗ה אַחֲרֵי֙ אֲשֶׁ֣ר הֻטַּמָּ֔אָה כִּֽי תוֹעֵבָ֥ה הִ֖וא לִ/פְנֵ֣י יְהוָ֑ה וְ/לֹ֤א תַחֲטִיא֙ אֶת הָ/אָ֔רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/004.yaml
  text: her first husband[a], who sent her away, may not take her again to be his wife after she has been defiled, for that is an abomination before Yahweh; and you shall not bring sin upon the land that Yahweh your God is giving you as an inheritance.
translation:
  language: id
  text: Suaminya yang pertama, yang telah menyuruhnya pergi, tidak boleh mengambilnya kembali untuk menjadi istrinya setelah perempuan itu dinajiskan[a], sebab hal itu adalah kekejian di hadapan Yahweh. Janganlah engkau mendatangkan dosa atas tanah yang sedang diberikan Yahweh, Allahmu, kepadamu sebagai milik pusaka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setelah ia menjadi najis” atau “setelah ia dibuat najis.” Teks Ibrani mengatakan “setelah ia dinajiskan” tanpa menjelaskan secara khusus sifat kenajisan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעְלָהּ הָרִאשׁוֹן
  choice: suaminya yang pertama
  rationale: Dalam konteks perkawinan, בַּעַל berarti ‘suami’; הָרִאשׁוֹן menyatakan suami yang pertama dan membedakannya dari suami berikutnya.
- source_word: שִׁלְּחָהּ
  choice: telah menyuruhnya pergi
  rationale: Ungkapan ini mempertahankan arti dasar שׁלח, ‘menyuruh pergi’, sementara konteks hukum pada ayat-ayat sebelumnya sudah menunjukkan bahwa yang dimaksud ialah perceraian.
- source_word: לָשׁוּב לְקַחְתָּהּ
  choice: mengambilnya kembali
  rationale: Rangkaian infinitif ini menyatakan tindakan mengambil lagi; ‘mengambilnya kembali’ merupakan ungkapan Indonesia yang wajar dalam konteks menikahi kembali.
- source_word: לִהְיוֹת לוֹ לְאִשָּׁה
  choice: menjadi istrinya
  rationale: Ini adalah ungkapan perkawinan Ibrani yang secara alami diterjemahkan ‘menjadi istrinya’.
- source_word: אַחֲרֵי אֲשֶׁר הֻטַּמָּאָה
  choice: setelah perempuan itu dinajiskan
  rationale: Bentuk pasif dari טמא dipertahankan dengan ‘dinajiskan’ tanpa menentukan apakah kenajisan itu bersifat ritual, hukum, seksual, atau relasional.
- source_word: תוֹעֵבָה
  choice: kekejian
  rationale: ‘Kekejian’ mempertahankan bobot moral-perjanjian yang kuat dari תוֹעֵבָה dan tetap wajar dalam ragam bahasa Alkitab Indonesia.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי berarti ‘di hadapan’ atau ‘dalam pandangan’; nama perjanjian יְהוָה ditransliterasikan sebagai ‘Yahweh’.
- source_word: וְלֹא תַחֲטִיא אֶת הָאָרֶץ
  choice: Janganlah engkau mendatangkan dosa atas negeri
  rationale: Bentuk kausatif חטא dapat menyatakan menyebabkan berdosa atau mendatangkan kesalahan; pilihan ini mempertahankan negeri sebagai objek dan tidak menambahkan konsep pencemaran yang tidak dinyatakan secara eksplisit.
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: yang diberikan ... kepadamu sebagai milik pusaka
  rationale: נַחֲלָה menunjuk pada warisan atau milik pusaka; ‘milik pusaka’ mempertahankan nuansa tanah perjanjian dengan bahasa Indonesia yang dikenal dan bermartabat.
theological_decisions:
- issue: Makna ‘setelah perempuan itu dinajiskan’ dalam larangan menikah kembali
  choice: Mempertahankan istilah luas ‘dinajiskan’ tanpa menetapkan jenis kenajisannya.
  alternative: ‘setelah ia menjadi najis’, ‘setelah ia dibuat tidak tahir’, atau penafsiran khusus bahwa perkawinan kedua sendirilah yang menjadikannya tidak memenuhi syarat
  rationale: Bahasa Ibrani memakai bentuk pasif טמא tetapi tidak menjelaskan secara tegas sifat kenajisan tersebut. Terjemahan tidak menyelesaikan ketegangan hukum dan teologis yang tetap terbuka dalam teks.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian יְהוָה secara langsung; ‘Yahweh’ mempertahankannya sebagai nama diri.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang bermartabat dan mudah dipahami. Kata ‘engkau’ dipertahankan karena perintah ditujukan kepada Israel dalam bentuk tunggal, sedangkan ‘milik pusaka’ menjaga nuansa perjanjian. Penanda catatan kaki [a] ditempatkan langsung sesudah frasa yang dijelaskannya.
