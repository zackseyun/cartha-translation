  naturalness: 'Perbaikan kecil diperlukan agar bahasa Indonesia baku mengalir alami: “pergi bersama pasukan” lebih netral daripada “maju bersama pasukan”; “bebas dari kewajiban untuk mengurus rumah tangganya” menyampaikan fungsi domestik לְבֵיתוֹ secara jelas. “Istrinya yang telah dinikahinya” dapat diringankan menjadi “istrinya yang dinikahinya” tanpa kehilangan pengulangan semantis sumber.'
