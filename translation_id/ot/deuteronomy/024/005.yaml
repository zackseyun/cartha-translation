base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/005.yaml
  text: When a man takes a new wife[a], he shall not go out with the army, nor shall any duty be imposed on him. He shall be free for his household for one year[d][c][b], and he shall make his wife whom he has taken rejoice.
translation:
  language: id
  text: Apabila seorang laki-laki baru menikah, ia tidak boleh pergi bersama pasukan[a], dan kepadanya tidak boleh dibebankan tugas apa pun[b]. Selama satu tahun ia harus bebas dari kewajiban untuk mengurus rumah tangganya[c] dan menggembirakan istrinya yang dinikahinya[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pergi berperang.” Secara harfiah bahasa Ibrani berbunyi “keluar bersama pasukan,” yang dapat mencakup dinas militer secara lebih luas, bukan hanya pertempuran langsung.
    reason: lexical_alternative
  - marker: b
    text: Atau, “ia tidak boleh ditugasi untuk urusan apa pun” atau “kepadanya tidak boleh dikenakan kewajiban apa pun.” Ungkapan Ibrani ini lebih luas daripada tugas militer saja.
    reason: alternative_reading
  - marker: c
    text: Atau, “ia harus bebas dari kewajiban dan tinggal di rumah selama satu tahun.” Ungkapan Ibrani dapat menekankan kebebasannya bagi kehidupan rumah tangga atau keberadaannya bersama seisi rumahnya.
    reason: lexical_alternative
  - marker: d
    text: Atau, “membuat istrinya yang dinikahinya bersukacita.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Apabila
  rationale: Memperkenalkan keadaan dalam rumusan hukum kasuistik; “apabila” wajar dalam bahasa hukum Indonesia dan tetap dapat memuat nuansa ketika/jika.
- source_word: יִקַּח אִישׁ אִשָּׁה חֲדָשָׁה
  choice: seorang laki-laki baru menikah
  rationale: Ungkapan לָקַח אִשָּׁה merupakan idiom menikahi seorang perempuan. Susunan ini menyampaikan bahwa pernikahannya baru berlangsung, bukan bahwa istrinya disebut “baru” dalam arti pengganti.
- source_word: לֹא יֵצֵא בַּצָּבָא
  choice: ia tidak boleh maju bersama pasukan
  rationale: Mempertahankan gambaran harfiah ‘keluar/maju bersama pasukan’ dan tidak membatasi maknanya hanya pada pertempuran langsung.
- source_word: וְלֹא יַעֲבֹר עָלָיו לְכָל דָּבָר
  choice: kepadanya tidak boleh dibebankan tugas apa pun
  rationale: Menyampaikan daya hukum idiom Ibrani secara alami dan mempertahankan cakupan דָּבָר yang tidak secara eksplisit terbatas pada kewajiban militer.
- source_word: נָקִי יִהְיֶה לְבֵיתוֹ
  choice: ia harus bebas untuk rumah tangganya
  rationale: נָקִי di sini berarti bebas atau tidak dibebani kewajiban, sedangkan בַּיִת dapat menunjuk pada rumah tangga, bukan semata-mata bangunan atau lokasi.
- source_word: שָׁנָה אֶחָת
  choice: Selama satu tahun
  rationale: Menyatakan durasi ketentuan secara jelas dan idiomatis dalam bahasa Indonesia.
- source_word: וְשִׂמַּח אֶת אִשְׁתּוֹ
  choice: dan menggembirakan istrinya
  rationale: 'Bentuk piel bersifat kausatif: membuat istrinya bersukacita atau gembira; terjemahan ini mempertahankan arah tindakan kepada sang istri.'
- source_word: אֲשֶׁר לָקָח
  choice: yang telah dinikahinya
  rationale: Mengungkapkan idiom לָקַח אִשָּׁה secara alami. Pengulangan verba Ibrani dikorbankan agar bahasa Indonesia tidak menimbulkan kesan kepemilikan atau pengambilan secara fisik.
