  register: Bahasa Indonesia baku, modern, dan bernada hukum yang tetap mudah dipahami. “Maju bersama pasukan” menjaga citra sumber tanpa menjadi kaku; “rumah tangga” menangkap cakupan sosial בַּיִת. Penanda catatan kaki [a]–[d] semuanya ditempatkan pada bagian teks yang relevan.
