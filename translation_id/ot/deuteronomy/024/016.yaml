source:
  edition: WLC
  text: לֹֽא יוּמְת֤וּ אָבוֹת֙ עַל בָּנִ֔ים וּ/בָנִ֖ים לֹא יוּמְת֣וּ עַל אָב֑וֹת אִ֥יש בְּ/חֶטְא֖/וֹ יוּמָֽתוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/016.yaml
  text: Fathers shall not be put to death for sons[a], and sons shall not be put to death for fathers[b]; each man shall be put to death for his own sin.
translation:
  language: id
  text: Para ayah tidak boleh dihukum mati karena anak-anak laki-laki mereka, dan anak-anak laki-laki tidak boleh dihukum mati karena ayah mereka. Setiap orang harus dihukum mati karena dosanya sendiri.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יוּמְתוּ / יוּמָתוּ
  choice: dihukum mati
  rationale: Bentuk Hofal dari מות bersifat kausatif-pasif, yaitu ‘dibuat mati’. Dalam konteks hukum, ‘dihukum mati’ dengan tepat menunjukkan penjatuhan hukuman mati, bukan kematian biasa.
- source_word: אָבוֹת
  choice: para ayah
  rationale: Kata ini secara khusus berarti ‘ayah-ayah’. Bentuk ‘para ayah’ mempertahankan makna maskulin dan jamaknya secara wajar dalam bahasa Indonesia.
- source_word: בָּנִים
  choice: anak-anak
  rationale: Secara harfiah kata ini berarti ‘anak-anak lelaki’, tetapi dalam hubungan keluarga bentuk Ibrani ini juga dapat merujuk kepada anak-anak secara umum. ‘Anak-anak’ menghasilkan rumusan hukum yang alami dalam bahasa Indonesia, sementara arti harfiahnya dicatat dalam catatan kaki.
- source_word: עַל
  choice: karena
  rationale: Dalam konteks hukum ini, עַל menunjukkan dasar atau alasan seseorang dikenai hukuman. ‘Karena’ ringkas dan alami untuk menyatakan bahwa seseorang tidak boleh dihukum atas kesalahan anggota keluarganya.
- source_word: אִישׁ
  choice: setiap orang
  rationale: 'אִישׁ dipakai secara distributif: masing-masing individu bertanggung jawab atas dosanya sendiri. ‘Setiap orang’ mempertahankan daya distributif itu dalam bahasa Indonesia modern tanpa ungkapan yang kaku.'
- source_word: בְּחֶטְאוֹ
  choice: karena dosanya sendiri
  rationale: Dalam konteks peradilan, preposisi בְּ menyatakan dasar hukuman. Kata ‘sendiri’ memperjelas akhiran posesif dan menonjolkan pertentangan dengan penghukuman karena dosa ayah atau anak.
theological_decisions:
- issue: Tanggung jawab pribadi dalam penjatuhan hukuman mati
  choice: Ayat ini melarang penjatuhan hukuman mati kepada ayah karena dosa anaknya atau kepada anak karena dosa ayahnya; seseorang hanya boleh dihukum mati karena dosanya sendiri.
  alternative: Pernyataan umum tentang segala akibat dosa lintas generasi.
  rationale: Pengulangan bentuk Hofal dari מות menunjuk pada tindakan membuat seseorang mati, dan dalam konteks hukum berarti penjatuhan hukuman mati. Karena itu, terjemahan mempertahankan lingkup yudisial ayat ini dan tidak memperluasnya secara diam-diam menjadi pernyataan tentang semua akibat dosa.
translation_notes:
  register: Bahasa hukum yang lugas, bermartabat, dan mudah dipahami. Susunan paralel teks Ibrani dipertahankan, sedangkan ‘setiap orang’ dipakai untuk menyampaikan fungsi distributif אִישׁ secara alami dalam bahasa Indonesia modern.
