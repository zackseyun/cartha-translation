    rationale: '"Belakangan" umumnya bersifat adverbial dan tidak alami sebagai penanda nomina yang berkontras dalam konteks ini. "Laki-laki yang kemudian itu" menyatakan kontras temporal/urutan yang dimaksud oleh הָאַחֲרוֹן.'
  - severity: low
