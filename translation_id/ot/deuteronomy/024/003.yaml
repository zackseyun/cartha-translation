  source_fidelity: 'Terjemahan pada dasarnya setia pada rangkaian alternatif hukum dalam teks Ibrani: laki-laki yang kemudian membenci perempuan itu dan menceraikannya, atau laki-laki tersebut meninggal. Istilah "surat cerai" tepat bagi סֵפֶר כְּרִיתֻת. Revisi mempertahankan tindakan konkret pemberian dokumen "ke tangannya" dan idiom mengambil perempuan itu sebagai istri.'
