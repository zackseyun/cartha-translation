  terminology: '"Membencinya," "surat cerai," dan "mengambilnya sebagai istrinya" mempertahankan daya leksikal dan register hukum naratif. Catatan tentang "mulai membencinya" dibatasi agar tidak menyajikan perkembangan kebencian sebagai kepastian makna bentuk Ibrani.'
