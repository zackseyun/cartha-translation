  yaml_path: translation/ot/deuteronomy/024/003.yaml
  text: and the latter man hates her[a], and writes her a certificate of divorce, and puts it into her hand, and sends her out of his house, or if the latter man dies[c][b], who took her as his wife—
translation:
  language: id
  text: dan laki-laki yang kemudian itu membencinya[a], lalu menulis surat cerai baginya[b], memberikannya ke tangannya, dan menyuruhnya pergi dari rumahnya; atau jika laki-laki yang kemudian itu, yang mengambilnya sebagai istrinya[c], meninggal—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mulai membencinya.” Bentuk perfektum Ibrani dapat diterjemahkan sebagai tindakan dalam rangkaian kasus hukum.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dokumen pemutusan.” Yang dimaksud ialah dokumen resmi yang memutuskan ikatan perkawinan.
    reason: lexical_alternative
  - marker: c
    text: Ungkapan Ibrani “mengambilnya sebagai istri” berarti menikahinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׂנֵאָהּ
  choice: membencinya
  rationale: Kata kerja שׂנא secara langsung berarti 'membenci'. Bentuknya di sini melanjutkan rangkaian kasus hukum; pilihan ini mempertahankan kekuatan leksikal tanpa memperhalusnya menjadi sekadar 'tidak menyukai'.
- source_word: הָאִישׁ הָאַחֲרוֹן
  choice: laki-laki yang belakangan itu
  rationale: אַחֲרוֹן berarti 'yang terakhir/yang belakangan'. Ungkapan ini mempertahankan kontras dengan laki-laki pertama dalam konteks dan tidak mengganti nomina 'laki-laki' dengan 'suami'.
- source_word: וְכָתַב לָהּ סֵפֶר כְּרִיתֻת
  choice: menulis surat cerai baginya
  rationale: סֵפֶר menunjuk pada dokumen tertulis dan כְּרִיתֻת pada pemutusan ikatan. 'Surat cerai' merupakan istilah Indonesia modern yang jelas untuk dokumen resmi perceraian.
- source_word: וְנָתַן בְּיָדָהּ
  choice: menyerahkannya ke tangannya
  rationale: Terjemahan ini mempertahankan tindakan prosedural yang konkret, yakni dokumen itu diberikan langsung ke tangan perempuan tersebut, sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: וְשִׁלְּחָהּ מִבֵּיתוֹ
  choice: menyuruhnya pergi dari rumahnya
  rationale: Dalam konteks perceraian, שׁלח berarti menyuruh pergi atau melepaskan. Pilihan ini mempertahankan frasa ruang מִבֵּיתוֹ, 'dari rumahnya'.
- source_word: אוֹ כִי יָמוּת
  choice: atau jika ... meninggal
  rationale: Konstruksi ini memperkenalkan keadaan alternatif dalam kasus hukum. 'Atau jika' menyampaikan hubungan bersyarat tersebut secara alami.
- source_word: אֲשֶׁר לְקָחָהּ לוֹ לְאִשָּׁה
  choice: yang telah mengambilnya sebagai istri
  rationale: לקח + ל + אשה adalah ungkapan lazim untuk mengambil seorang perempuan dalam perkawinan. Terjemahan ini mempertahankan gambaran idiom Ibrani, sedangkan catatan kaki menjelaskan maknanya.
