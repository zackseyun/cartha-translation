  text: כִּי יִמָּצֵ֣א אִ֗ישׁ גֹּנֵ֨ב נֶ֤פֶשׁ מֵ/אֶחָי/ו֙ מִ/בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/הִתְעַמֶּר בּ֖/וֹ וּ/מְכָר֑/וֹ וּ/מֵת֙ הַ/גַּנָּ֣ב הַ/ה֔וּא וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/007.yaml
  text: If a man is found kidnapping one of his brothers from the sons of Israel[a], and he enslaves him and sells him, then that kidnapper shall die[c][b]. So you shall purge the evil from your midst.
translation:
  language: id
  text: Jika seorang laki-laki kedapatan menculik seorang dari antara saudara-saudaranya, yakni seorang Israel, lalu memperlakukannya sebagai budak dan menjualnya, penculik itu harus dihukum mati. Demikianlah kamu harus menyingkirkan kejahatan dari tengah-tengahmu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִמָּצֵא
  choice: kedapatan
  rationale: Bentuk Nifal menyatakan bahwa pelanggaran itu diketahui atau ditemukan; “kedapatan” alami dalam rumusan hukum bersyarat bahasa Indonesia.
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Mempertahankan bentuk maskulin tunggal Ibrani dalam konteks hukum tanpa mengubahnya menjadi sebutan yang netral gender.
- source_word: גֹּנֵב נֶפֶשׁ
  choice: menculik
  rationale: Secara harfiah berarti “mencuri seseorang/jiwa,” tetapi dalam konteks hukum ini menunjuk pada penculikan manusia; “menculik” adalah padanan modern yang jelas.
- source_word: מֵאֶחָיו מִבְּנֵי יִשְׂרָאֵל
  choice: salah seorang saudaranya dari antara orang Israel
  rationale: “Saudara” mempertahankan bahasa kekerabatan perjanjian, sedangkan “dari antara orang Israel” menjelaskan bahwa yang dimaksud ialah sesama anggota Israel, bukan hanya saudara kandung.
- source_word: וְהִתְעַמֶּר בּוֹ
  choice: memperlakukannya sebagai budak
  rationale: Kata kerja Hitpael ini menggambarkan perlakuan terhadap korban sebagai milik atau budak. Pilihan ini mempertahankan unsur eksploitasi tanpa menghilangkan kemungkinan nuansa memperalat atau mengambil keuntungan darinya.
- source_word: וּמְכָרוֹ
  choice: dan menjualnya
  rationale: Menerjemahkan secara langsung tindakan penjualan korban yang disebut secara eksplisit dalam teks.
- source_word: וּמֵת הַגַּנָּב הַהוּא
  choice: penculik itu harus dihukum mati
  rationale: Dalam rumusan hukum, “harus dihukum mati” menyampaikan tuntutan hukuman mati, sementara “penculik” memperjelas bahwa pelaku adalah pencuri manusia yang disebut sebelumnya.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: Demikianlah kamu harus menyingkirkan kejahatan dari tengah-tengahmu
  rationale: Mempertahankan formula hukum khas Ulangan mengenai pembersihan komunitas dari kejahatan dengan ungkapan Indonesia yang jelas dan bermartabat.
theological_decisions:
- issue: Bahasa kekerabatan perjanjian dalam hukum Israel
  choice: “salah seorang saudaranya dari antara orang Israel”
  alternative: “salah seorang sesama orang Israel”
  rationale: Pilihan utama mempertahankan metafora persaudaraan dalam teks Ibrani sekaligus menerangkan cakupan nasionalnya melalui frasa berikutnya.
- issue: Nuansa וְהִתְעַמֶּר בּוֹ
  choice: “memperlakukannya sebagai budak”
  alternative: “memperalatnya” atau “mengambil keuntungan darinya”
  rationale: Dalam rangkaian penculikan dan penjualan manusia, perlakuan sebagai budak paling jelas menyatakan reduksi korban menjadi komoditas, tetapi alternatif leksikal yang lebih umum tetap diakui karena kata ini jarang dan memiliki rentang makna yang diperdebatkan.
- issue: Daya hukum וּמֵת
  choice: “harus dihukum mati”
  alternative: “harus mati”
  rationale: Terjemahan utama menyatakan fungsi yudisial klausa tersebut dalam kumpulan hukum tanpa menentukan metode pelaksanaan yang tidak disebutkan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam hukum yang lugas dan bermartabat. Struktur kalimat mengikuti alur Ibrani, tetapi menghindari ungkapan harfiah yang janggal seperti “mencuri jiwa” dan “anak-anak Israel.” Tidak ada catatan kaki karena ambiguitas utama dapat dipertahankan dan dijelaskan dalam keputusan leksikal tanpa membebani teks publikasi.
