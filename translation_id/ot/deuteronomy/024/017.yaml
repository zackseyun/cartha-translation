review_pass:
  verdict: revise
  source_fidelity: Draf dengan tepat mempertahankan dua larangan, kelompok-kelompok rentan yang sejajar, dan arti חבל sebagai pengambilan barang jaminan. Namun, “pendatang” tidak dengan sendirinya menyatakan unsur penting גֵּר, yakni orang asing/non-Israel yang tinggal menetap dalam masyarakat Israel; kata ini juga lazim dipakai untuk perpindahan domestik atau orang yang baru datang. “Keadilan bagi” dapat dipahami, tetapi “keadilan yang menjadi hak” lebih jelas menyampaikan מִשְׁפָּט dalam konteks perlindungan hak hukum.
  naturalness: Struktur dan register draf sudah baik. “Memutarbalikkan keadilan yang menjadi hak” adalah ungkapan hukum yang lebih idiomatis daripada “menyimpangkan keadilan.” “Sebagai jaminan” alami dan cukup luas untuk חבל tanpa membatasi jenis pakaiannya.
  terminology: “Orang asing yang menetap” secara lebih akurat memelihara kategori גֵּר daripada “pendatang.” “Anak yatim,” “janda,” dan “pakaian” tepat. Catatan kaki sebaiknya menghindari “bukan pribumi,” yang dapat membawa asosiasi sosial-politik Indonesia modern dan kurang tepat untuk kategori hukum Israel kuno.
  issues:
  - severity: medium
    issue: Padanan utama גֵּר sebagai “pendatang” terlalu luas.
    rationale: Istilah ini tidak selalu berarti orang asing yang menjadi penduduk menetap, sedangkan nuansa tersebut penting dalam גֵּר dan konteks hukumnya.
  - severity: low
    issue: Frasa “menyimpangkan keadilan” kurang idiomatis dan belum secara eksplisit menandai hak hukum yang dilindungi.
    rationale: Dalam konteks מִשְׁפָּט bagi golongan rentan, “memutarbalikkan keadilan yang menjadi hak” lebih alami sekaligus menyampaikan hak atau keadilan yang semestinya mereka terima.
  - severity: low
    issue: Catatan kaki memakai “orang bukan pribumi.”
    rationale: Istilah “pribumi” berpotensi anakronistis dan bermuatan dalam pemakaian Indonesia; “bukan orang Israel” menjelaskan rujukan historis dengan lebih netral.
  revised_text: Janganlah engkau memutarbalikkan keadilan yang menjadi hak orang asing yang menetap[a] atau anak yatim, dan janganlah engkau mengambil pakaian seorang janda sebagai jaminan.
  revised_footnotes:
