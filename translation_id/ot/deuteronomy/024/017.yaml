  yaml_path: translation/ot/deuteronomy/024/017.yaml
  text: You shall not pervert the justice due to a sojourner or an orphan[a], nor take a widow’s garment as a pledge.
translation:
  language: id
  text: Janganlah engkau memutarbalikkan keadilan yang menjadi hak orang asing yang menetap[a] atau anak yatim, dan janganlah engkau mengambil pakaian seorang janda sebagai jaminan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pendatang” atau “orang asing.” Istilah Ibrani ini menunjuk pada orang yang bukan orang Israel dan tinggal menetap di tengah masyarakat Israel, di bawah perlindungan sosial dan hukum.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַטֶּה
  choice: menyimpangkan
  rationale: Bentuk Hifil dari נטה dalam konteks hukum berarti membelokkan atau menyelewengkan jalannya keadilan. “Menyimpangkan” alami dalam bahasa Indonesia dan mempertahankan gambaran dasar tindakan membelokkan.
- source_word: מִשְׁפַּט
  choice: keadilan bagi
  rationale: מִשְׁפַּט dapat menunjuk pada keadilan, putusan hukum, atau hak yang semestinya diterima. Frasa “keadilan bagi” menyampaikan bahwa golongan rentan ini tidak boleh dirugikan dalam proses hukum tanpa mempersempit maknanya menjadi satu jenis putusan.
- source_word: גֵּר
  choice: pendatang
  rationale: גֵּר menunjuk pada orang bukan pribumi yang menetap di tengah masyarakat Israel, bukan sekadar orang yang sedang lewat. “Pendatang” mudah dipahami dalam bahasa Indonesia; catatan kaki menjelaskan dimensi menetap serta perlindungan sosial-hukumnya.
- source_word: יָתוֹם
  choice: anak yatim
  rationale: יָתוֹם adalah anak yang kehilangan perlindungan ayah. “Anak yatim” merupakan padanan baku dan alami dalam bahasa Indonesia.
- source_word: תַחֲבֹל
  choice: mengambil ... sebagai gadai
  rationale: Dalam konteks hukum utang, חבל berarti mengambil suatu barang sebagai jaminan. Ungkapan ini jelas dan lazim dalam bahasa Indonesia modern.
- source_word: בֶּגֶד
  choice: pakaian
  rationale: בֶּגֶד adalah istilah umum untuk pakaian; teks tidak mengharuskan jenis tertentu seperti jubah atau pakaian luar.
- source_word: אַלְמָנָה
  choice: seorang janda
  rationale: Padanan langsung dan alami yang mempertahankan fokus hukum pada perempuan yang kehilangan suaminya dan rentan secara sosial.
theological_decisions:
- issue: Cakupan golongan sosial גֵּר
  choice: pendatang
  alternative: orang asing yang menetap; perantau; orang asing
  rationale: Istilah ini menggambarkan orang bukan pribumi yang tinggal di antara Israel dan berada dalam lingkup perlindungan sosial serta hukum masyarakat. “Pendatang” menjaga perbedaannya dari wisatawan atau orang asing yang sekadar lewat, sementara catatan kaki mempertahankan nuansa legalnya.
- issue: Hubungan sintaksis גֵּר יָתוֹם tanpa kata penghubung
  choice: pendatang atau anak yatim
  alternative: anak yatim dari kalangan pendatang
  rationale: Dalam rangkaian hukum Ibrani, kedua nomina paling wajar dibaca sebagai dua golongan rentan yang sejajar. Kata “atau” menyatakan bahwa larangan berlaku terhadap masing-masing golongan tanpa menganggap anak yatim sebagai penjelas bagi pendatang.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Bentuk “janganlah engkau” mempertahankan sapaan tunggal dalam teks Ibrani dan register hukum-perjanjian, sedangkan istilah hukum “keadilan” dan “gadai” tetap mudah dipahami pembaca umum.
