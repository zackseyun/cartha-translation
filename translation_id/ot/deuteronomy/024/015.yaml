  text: בְּ/יוֹמ/וֹ֩ תִתֵּ֨ן שְׂכָר֜/וֹ וְֽ/לֹא תָב֧וֹא עָלָ֣י/ו הַ/שֶּׁ֗מֶשׁ כִּ֤י עָנִי֙ ה֔וּא וְ/אֵלָ֕י/ו ה֥וּא נֹשֵׂ֖א אֶת נַפְשׁ֑/וֹ וְ/לֹֽא יִקְרָ֤א עָלֶ֨י/ךָ֙ אֶל יְהוָ֔ה וְ/הָיָ֥ה בְ/ךָ֖ חֵֽטְא־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/015.yaml
  text: You shall give him his wages on his day[a], and the sun shall not go down on it, because he is poor and sets his life on it, so that he does not cry out against you to Yahweh, and it becomes sin in you.
translation:
  language: id
  text: Berikanlah upahnya kepadanya pada hari itu juga, sebelum matahari terbenam, sebab ia miskin dan hidupnya bergantung pada upah itu.[a] Jangan sampai ia berseru kepada Yahweh menentang engkau, dan engkau berdosa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepada/pada upah itu ia mengangkat nyawanya,” suatu ungkapan yang menunjukkan bahwa hidupnya sangat bergantung pada upah itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיוֹמוֹ
  choice: Pada hari itu juga
  rationale: Secara harfiah berarti 'pada harinya'; dalam konteks hukum upah, ungkapan ini menuntut pembayaran pada hari yang sama. Bentuk Indonesia ini alami dan tetap menyampaikan batas waktunya.
- source_word: תִתֵּן שְׂכָרוֹ
  choice: haruslah engkau memberikan upahnya kepadanya
  rationale: Bentuk imperfek dalam ketentuan hukum menyatakan kewajiban. 'Upah' tepat untuk kompensasi yang telah diperoleh pekerja.
- source_word: וְלֹא תָבוֹא עָלָיו הַשֶּׁמֶשׁ
  choice: sebelum matahari terbenam
  rationale: Ungkapan Ibrani menetapkan bahwa upah harus dibayar sebelum matahari terbenam. Terjemahan ini menyampaikan batas waktu secara jelas dan alami tanpa mempertahankan pronomina yang acuannya dapat terasa kabur dalam bahasa Indonesia.
- source_word: כִּי עָנִי הוּא
  choice: sebab ia miskin
  rationale: עָנִי di sini menunjuk pada kerentanan ekonomi pekerja; 'miskin' merupakan padanan langsung dan lazim.
- source_word: וְאֵלָיו הוּא נֹשֵׂא אֶת נַפְשׁוֹ
  choice: dan hidupnya bergantung pada upah itu
  rationale: Secara harfiah, ia 'mengangkat/membawa nyawanya kepadanya'. Idiom tersebut menyatakan ketergantungan mendesak pada upah; terjemahan ini menyampaikan maknanya secara wajar sambil mencatat citra harfiahnya dalam catatan kaki.
- source_word: וְלֹא יִקְרָא עָלֶיךָ אֶל יְהוָה
  choice: Jangan sampai ia berseru kepada Yahweh menentang engkau
  rationale: וְלֹא setelah perintah ini menyatakan akibat yang harus dihindari. 'Berseru ... menentang engkau' mempertahankan gambaran permohonan orang tertindas kepada Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: וְהָיָה בְךָ חֵטְא
  choice: sehingga engkau berdosa
  rationale: Ungkapan harfiahnya adalah 'dan dosa akan ada padamu/dalammu'. Bentuk Indonesia ini alami serta mempertahankan akibat moral pribadi tanpa mempersempitnya menjadi istilah hukum teknis semata.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama pribadi itu melalui transliterasi.
- issue: Makna וְהָיָה בְךָ חֵטְא
  choice: sehingga engkau berdosa
  alternative: dan hal itu menjadi dosa padamu; sehingga engkau menanggung kesalahan
  rationale: Pilihan ini menyatakan akibat moral yang terdapat dalam teks tanpa mengubahnya menjadi rumusan doktrinal yang lebih teknis tentang kesalahan atau hukuman.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan tunggal 'engkau' mempertahankan bentuk orang kedua tunggal dalam teks Ibrani. Susunan kalimat dibuat jelas bagi pembaca umum, dengan metafora Ibrani yang sulit dijelaskan dalam catatan kaki.
