  naturalness: Bahasa draf umumnya baku, tetapi “Dalam perkara” terasa legalistis dan tidak alami untuk konteks ini. “Dalam hal penyakit kulit” lebih lancar dan tetap cukup luas untuk נֶגַע הַצָּרַעַת tanpa mengesankan diagnosis modern tertentu.
  terminology: “Penyakit kulit” dengan catatan tentang “kusta” tepat dan menghindari penyamaan צָרַעַת dengan penyakit Hansen. “Para imam Lewi” adalah padanan yang baik untuk הַכֹּהֲנִים הַלְוִיִּם. “Mematuhi dan melaksanakan segala yang diajarkan” mempertahankan dua unsur לִשְׁמֹר ... וְלַעֲשׂוֹת dan instruksi dari ירה.
