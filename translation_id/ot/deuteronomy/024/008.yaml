  to: Dalam hal penyakit kulit[a], berhati-hatilah untuk sungguh-sungguh mematuhi dan melaksanakan segala yang diajarkan para imam Lewi kepadamu. Sebagaimana aku telah memerintahkan mereka, demikianlah kamu harus berhati-hati melakukannya.
