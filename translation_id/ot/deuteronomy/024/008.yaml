  text: הִשָּׁ֧מֶר בְּ/נֶֽגַע הַ/צָּרַ֛עַת לִ/שְׁמֹ֥ר מְאֹ֖ד וְ/לַ/עֲשׂ֑וֹת כְּ/כֹל֩ אֲשֶׁר יוֹר֨וּ אֶתְ/כֶ֜ם הַ/כֹּהֲנִ֧ים הַ/לְוִיִּ֛ם כַּ/אֲשֶׁ֥ר צִוִּיתִ֖/ם תִּשְׁמְר֥וּ לַ/עֲשֽׂוֹת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/008.yaml
  text: Be careful in the case of an outbreak of skin disease[a], to observe very carefully and to do according to all that the Levitical priests instruct you; as I have commanded them, so you shall be careful to do.
translation:
  language: id
  text: Dalam hal penyakit kulit[a], berhati-hatilah untuk sungguh-sungguh mematuhi dan melaksanakan segala yang diajarkan para imam Lewi kepadamu. Sebagaimana aku telah memerintahkan mereka, demikianlah kamu harus berhati-hati melakukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara tradisional diterjemahkan “kusta”. Istilah Ibrani ini dalam Taurat mencakup beragam kondisi kulit dan tidak secara khusus menunjuk pada penyakit Hansen modern.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר
  choice: berhati-hatilah
  rationale: Bentuk imperatif Nifal dari שׁמר menyampaikan peringatan yang tegas. Pilihan ini alami dalam bahasa Indonesia modern dan mempertahankan daya imperatifnya.
- source_word: בְּנֶגַע הַצָּרַעַת
  choice: dalam perkara penyakit kulit
  rationale: נֶגַע menunjuk pada suatu serangan, tanda, atau keadaan yang diperiksa, sedangkan צָרַעַת dalam Taurat mencakup kondisi yang lebih luas daripada penyakit Hansen. 'Dalam perkara' cocok dengan konteks hukum dan tidak memaksakan diagnosis medis modern.
- source_word: לִשְׁמֹר מְאֹד וְלַעֲשׂוֹת
  choice: untuk menaati dengan sangat cermat dan melaksanakan
  rationale: Ungkapan ini mempertahankan unsur perhatian atau ketaatan yang sangat saksama serta tindakan nyata. 'Sangat cermat' mencerminkan daya penegas מְאֹד.
- source_word: כְּכֹל אֲשֶׁר יוֹרוּ אֶתְכֶם
  choice: segala petunjuk yang diberikan ... kepadamu
  rationale: Hifil dari ירה berarti mengajar, memberi petunjuk, atau mengarahkan. 'Memberikan petunjuk' sesuai dengan pengarahan hukum oleh para imam dan terdengar alami.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: para imam Lewi
  rationale: Ungkapan khas Ulangan ini dipahami sebagai para imam yang tergolong suku Lewi, bukan dua kelompok terpisah. 'Para imam Lewi' ringkas dan lazim dalam bahasa Indonesia.
- source_word: כַּאֲשֶׁר צִוִּיתִם
  choice: seperti yang telah kuperintahkan kepada mereka
  rationale: Kata kerja orang pertama tunggal dengan akhiran orang ketiga jamak merujuk pada perintah Musa kepada para imam. Bentuk 'telah kuperintahkan' menghubungkan perintah terdahulu dengan kewajiban saat ini.
- source_word: תִּשְׁמְרוּ לַעֲשׂוֹת
  choice: kamu harus berhati-hati melakukannya
  rationale: Pilihan ini mempertahankan pengulangan gagasan שׁמר dan עשׂה sekaligus menyampaikan kekuatan nasihat atau kewajiban dari bentuk imperfek.
theological_decisions:
- issue: Makna צָרַעַת
  choice: penyakit kulit
  alternative: kusta
  rationale: Dalam hukum Taurat, צָרַעַת mencakup berbagai keadaan yang tidak identik secara khusus dengan penyakit Hansen modern. Terjemahan ini menghindari anakronisme medis sambil mempertahankan konteks pemeriksaan ritual-hukum.
- issue: Identitas הַכֹּהֲנִים הַלְוִיִּם
  choice: para imam Lewi
  alternative: para imam, yaitu orang-orang Lewi
  rationale: Frasa ini diperlakukan sebagai sebutan khas Ulangan bagi para imam dari suku Lewi. Keputusan ini bersifat leksikal-sintaksis dan tidak memasukkan kekhasan denominasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan penegasan tentang ketaatan yang sangat cermat dan pelaksanaan petunjuk para imam.
