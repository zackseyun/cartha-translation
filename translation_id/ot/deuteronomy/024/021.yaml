review_pass:
  verdict: revise
  source_fidelity: 'Draf ini pada dasarnya mencerminkan struktur dan makna Ibrani dengan baik: panen anggur, larangan melakukan pemetikan susulan, serta peruntukan sisa hasil bagi ger, yatim, dan janda. Namun, frasa “di belakangmu” kurang alami dalam bahasa Indonesia untuk אַחֲרֶיךָ, dan “harus menjadi bagian orang asing” tidak gramatikal serta kurang jelas menyatakan peruntukan hukum.'
  naturalness: “Janganlah kembali memetik buah yang tertinggal di belakangmu” dapat dipahami, tetapi terdengar terlalu harfiah dan janggal. “Janganlah memetik sisa-sisanya lagi sesudah itu” adalah rumusan modern yang lebih lancar tanpa mengubah pelaku atau tindakan yang dilarang. “Harus disediakan bagi” secara idiomatis menyatakan bahwa sisa panen diperuntukkan bagi kelompok-kelompok tersebut.
  terminology: “Kebun anggur,” “anak yatim,” dan “janda” sudah tepat. “Pendatang yang menetap” lebih alami daripada “orang asing yang menetap” dan tetap membedakan גֵּר dari orang asing yang sekadar lewat. Catatan budaya mempertahankan nuansa sosial-hukum tanpa membebani teks utama.
