base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/021.yaml
  text: When you harvest the grapes of your vineyard[a], you shall not go over it again after yourself; it shall be for the sojourner, the fatherless[c][b], and the widow.
translation:
  language: id
  text: Apabila engkau memanen buah anggur di kebun anggurmu, janganlah memetik sisa-sisanya lagi sesudah itu[a]. Buah itu harus disediakan bagi pendatang yang menetap[b], anak yatim[c], dan janda.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “janganlah memungut sisa buah sesudah engkau memanennya” atau “janganlah memeriksanya lagi untuk mengambil buah yang tersisa.” Kata kerja Ibraninya menunjuk pada pemetikan susulan untuk mengumpulkan buah yang masih tertinggal.
    reason: lexical_alternative
  - marker: b
    text: Yang dimaksud ialah orang bukan pribumi yang tinggal di tengah masyarakat Israel; dapat juga diterjemahkan “orang asing yang menetap.”
    reason: cultural_note
  - marker: c
    text: Dapat juga diterjemahkan “yatim piatu.” Istilah Ibraninya sering secara harfiah menunjuk pada orang yang tidak berayah.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Apabila
  rationale: Dalam hukum kasuistik ini, כִּי memperkenalkan keadaan yang diperkirakan akan terjadi. “Apabila” menyampaikan nuansa waktu sekaligus syarat dengan wajar dalam bahasa Indonesia.
- source_word: תִבְצֹר
  choice: memanen buah anggur
  rationale: בצר secara khusus menunjuk pada pemetikan atau panen anggur. Objek yang tersirat dalam verba Ibrani dinyatakan agar kalimat Indonesia jelas dan alami.
- source_word: כַּרְמְךָ
  choice: di kebun anggurmu
  rationale: כֶּרֶם berarti kebun anggur; sufiks orang kedua tunggal diterjemahkan dengan “-mu.”
- source_word: לֹא תְעוֹלֵל אַחֲרֶיךָ
  choice: janganlah kembali memetik buah yang tertinggal di belakangmu
  rationale: Dalam konteks panen anggur, עולל menunjuk pada pengumpulan buah yang tersisa setelah pemetikan pertama, sedangkan אַחֲרֶיךָ secara harfiah berarti “di belakangmu/sesudahmu.” Rumusan ini menyampaikan larangan melakukan pemetikan susulan tanpa mengaburkan siapa pelakunya.
- source_word: לַגֵּר
  choice: bagi orang asing yang menetap
  rationale: גֵּר adalah orang bukan pribumi yang tinggal di tengah masyarakat Israel dan memiliki kedudukan sosial-hukum tertentu. Frasa ini lebih jelas dalam bahasa Indonesia modern daripada sekadar “orang asing” atau “pendatang.”
- source_word: לַיָּתוֹם
  choice: anak yatim
  rationale: יָתוֹם menunjuk pada orang yang kehilangan ayah atau orang tua. “Anak yatim” adalah padanan Indonesia yang lazim, meskipun cakupan istilah Ibraninya dapat dipahami sebagai “yatim piatu” dalam konteks tertentu.
- source_word: וְלָאַלְמָנָה
  choice: dan janda
  rationale: אַלְמָנָה secara langsung berarti perempuan yang suaminya telah meninggal, yaitu janda.
- source_word: יִהְיֶה
  choice: Buah itu harus menjadi bagian
  rationale: Bentuk imperfek dalam ketetapan hukum ini menyatakan peruntukan hasil yang tersisa. “Harus menjadi bagian” mempertahankan daya wajib dan hubungan penerima manfaat secara alami.
