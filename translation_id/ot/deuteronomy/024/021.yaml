    rationale: 'Dalam bahasa Indonesia, sesuatu menjadi “bagian” dari seseorang memerlukan konstruksi lain, misalnya “menjadi milik” atau “disediakan bagi.” Teks Ibrani menyatakan peruntukan: “itu akan menjadi bagi ...”; “harus disediakan bagi” menyampaikan fungsi hukum tersebut dengan jelas.'
