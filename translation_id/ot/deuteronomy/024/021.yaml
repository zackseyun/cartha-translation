translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Sapaan tunggal “engkau” dipertahankan untuk mencerminkan bentuk orang kedua tunggal dalam teks Ibrani. Susunan kalimat memperjelas tindakan panen susulan serta tiga kelompok rentan tanpa memasukkan istilah denominasi atau penafsiran teologis tambahan.
