  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/מִצְרַ֔יִם וַֽ/יִּפְדְּ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ מִ/שָּׁ֑ם עַל כֵּ֞ן אָנֹכִ֤י מְצַוְּ/ךָ֙ לַ/עֲשׂ֔וֹת אֶת הַ/דָּבָ֖ר הַ/זֶּֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/018.yaml
  text: And remember that you were a servant in Egypt, and Yahweh your God redeemed you from there; therefore I am commanding you to do this.
translation:
  language: id
  text: Ingatlah bahwa kamu adalah budak di Mesir, dan Yahweh, Allahmu, telah menebusmu dari sana. Karena itu, aku memerintahkanmu untuk melakukan hal ini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Ingatlah
  rationale: Bentuk perfek dengan waw berfungsi sebagai desakan atau perintah dalam konteks hukum. Imperatif Indonesia menyampaikan daya ujar itu secara alami; hubungan dengan ayat sebelumnya tetap jelas tanpa harus menambahkan kata sambung.
- source_word: כִּי
  choice: bahwa
  rationale: Kata ini memperkenalkan isi yang harus diingat, bukan terutama alasan bagi perintah untuk mengingat.
- source_word: עֶבֶד
  choice: budak
  rationale: Dalam konteks penindasan Israel di Mesir, istilah ini menunjuk status perbudakan; 'hamba' dapat memperlemah realitas keterikatan tersebut.
- source_word: בְּמִצְרַיִם
  choice: di Mesir
  rationale: Menerjemahkan ungkapan Ibrani secara langsung tanpa menambahkan 'tanah'.
- source_word: וַיִּפְדְּךָ
  choice: telah menebusmu
  rationale: פדה menyatakan pembebasan dengan nuansa penebusan. 'Menebus' mempertahankan keluasan makna historis dan teologisnya, sedangkan 'membebaskan' lebih sempit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Padanan langsung dan wajar bagi bentuk dengan akhiran orang kedua tunggal.
- source_word: מִשָּׁם
  choice: dari sana
  rationale: Merujuk kembali secara langsung kepada Mesir.
- source_word: עַל כֵּן
  choice: Karena itu
  rationale: Menandai kesimpulan etis yang ditarik dari pengalaman penebusan Israel secara alami dalam bahasa Indonesia.
- source_word: אָנֹכִי מְצַוְּךָ
  choice: aku memerintahkan kamu
  rationale: Pronomina eksplisit dan partisip menyampaikan penegasan pembicara serta daya perintah yang berlaku kini. Bentuk ini lebih alami daripada konstruksi progresif dalam bahasa Indonesia.
- source_word: לַעֲשׂוֹת
  choice: untuk melakukan
  rationale: Padanan luas dan idiomatis bagi עשה dalam kaitannya dengan ketentuan yang baru disebutkan.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: hal ini
  rationale: Merujuk kepada ketentuan hukum sebelumnya. 'Hal ini' mempertahankan rujukan tersebut dengan bahasa Indonesia modern yang alami tanpa mempersempitnya menjadi 'perintah ini'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Status Israel di Mesir dalam עֶבֶד
  choice: budak
  alternative: hamba
  rationale: Konteks keluaran dari Mesir menonjolkan keadaan perbudakan yang menjadi dasar tuntutan etis dalam hukum ini.
- issue: Nuansa penebusan dalam פדה
  choice: menebus
  alternative: membebaskan
  rationale: '''Menebus'' menjaga nuansa pelepasan atau pembebasan yang terkandung dalam verba itu tanpa menentukan mekanisme yang tidak dinyatakan ayat ini.'
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. Bentuk tunggal Ibrani diterjemahkan dengan 'kamu' karena bahasa Indonesia tidak membedakan jumlah pada pronomina tersebut. Koma mengapit 'Allahmu' sebagai aposisi bagi 'Yahweh'. Tidak diperlukan catatan kaki karena tidak ada ambiguitas tekstual yang perlu dijelaskan untuk ayat ini.
