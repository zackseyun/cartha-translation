  text: הָשֵׁב֩ תָּשִׁ֨יב ל֤/וֹ אֶֽת הַ/עֲבוֹט֙ כְּ/בֹ֣א הַ/שֶּׁ֔מֶשׁ וְ/שָׁכַ֥ב בְּ/שַׂלְמָת֖/וֹ וּ/בֵֽרֲכֶ֑/ךָּ וּ/לְ/ךָ֙ תִּהְיֶ֣ה צְדָקָ֔ה לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/013.yaml
  text: You must surely return the pledge to him at sunset[a], so that he may lie down in his cloak and bless you[b]; and it will be righteousness for you before Yahweh your God.
translation:
  language: id
  text: Engkau harus mengembalikan kepadanya barang jaminan itu[a] pada waktu matahari terbenam, supaya ia dapat berbaring dengan pakaiannya itu sebagai selimut dan memberkatimu; hal itu akan menjadi kebenaran bagimu di hadapan Yahweh, Allahmu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “barang yang diambil sebagai jaminan itu.”'
    reason: lexical_alternative
  - marker: b
    text: Frasa “menjadi kebenaran bagimu” juga dapat dipahami sebagai “menjadi suatu perbuatan benar bagimu” atau “diperhitungkan sebagai kebenaran bagimu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָשֵׁב תָּשִׁיב
  choice: Engkau harus mengembalikan
  rationale: Gabungan infinitif absolut dan verba finit dari שׁוב menegaskan kewajiban. Kata "harus" menyampaikan daya penegasannya secara wajar dalam bahasa Indonesia.
- source_word: הַעֲבוֹט
  choice: barang jaminan itu
  rationale: עֲבוֹט menunjuk pada benda yang diambil sebagai jaminan pinjaman. "Barang jaminan" lebih mudah dipahami daripada istilah teknis "agunan" dan tetap cocok dengan konteks hukum.
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  choice: pada saat matahari terbenam
  rationale: Ungkapan harfiahnya, "ketika matahari masuk/dat­ang", merupakan idiom untuk matahari terbenam.
- source_word: וְשָׁכַב בְּשַׂלְמָתוֹ
  choice: supaya ia dapat berbaring dengan berselimutkan pakaiannya itu
  rationale: Dalam konteks ini, bentuk tersebut menyatakan hasil atau tujuan pengembalian jaminan sebelum malam. שַׂלְמָה adalah pakaian luar yang di sini dipakai sebagai selimut; terjemahan ini menjelaskan fungsi praktisnya tanpa mengganti bendanya dengan "selimut".
- source_word: וּבֵרֲכֶךָּ
  choice: dan memberkatimu
  rationale: Subjek tersiratnya tetap orang miskin yang menerima kembali pakaiannya; ia akan memberkati pihak pemberi pinjaman.
- source_word: וּלְךָ תִּהְיֶה צְדָקָה
  choice: Hal itu akan menjadi kebenaran bagimu
  rationale: Terjemahan ini mempertahankan bentuk dan keluwesan makna צְדָקָה, yang dapat menunjuk pada kebenaran atau tindakan yang dinilai benar, tanpa menambahkan gagasan eksplisit "diperhitungkan" yang tidak dinyatakan oleh verba Ibrani.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: di hadapan Yahweh, Allahmu
  rationale: לִפְנֵי menyatakan keberadaan atau penilaian di hadapan Allah, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai "Yahweh".
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi יהוה secara langsung. "Yahweh" mempertahankan nama perjanjian itu dan selaras dengan lapisan konsultasi yang diberikan.
- issue: Makna צְדָקָה dalam konteks hukum dan relasi dengan Allah
  choice: kebenaran bagimu
  alternative: suatu perbuatan benar bagimu; akan diperhitungkan sebagai kebenaran bagimu
  rationale: Bahasa Ibrani menyatakan bahwa tindakan itu "akan menjadi צְדָקָה bagimu" di hadapan Yahweh. Rumusan utama menjaga ketegangan antara sifat benar dan tindakan benar, tanpa memastikan nuansa akuntansi yang hanya tersirat sebagai kemungkinan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan tunggal "engkau" dipertahankan untuk mencerminkan bentuk orang kedua tunggal dalam teks hukum. Ungkapan "berselimutkan pakaiannya itu" memperjelas bahwa pakaian luar yang dijaminkan juga berfungsi sebagai penutup saat tidur. Semua penanda catatan kaki muncul dalam teks utama.
