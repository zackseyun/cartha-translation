  yaml_path: translation/ot/deuteronomy/024/022.yaml
  text: And remember that you were a servant in the land of Egypt[a]; therefore I am commanding you to do this thing.
translation:
  language: id
  text: Ingatlah bahwa engkau dahulu adalah budak di tanah Mesir. Karena itu, Aku memerintahkan engkau untuk melakukan hal ini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perkara ini” atau “perintah ini.” Ungkapan Ibrani yang secara harfiah berarti “hal ini” merujuk pada ketentuan sebelumnya tentang membiarkan sebagian hasil panen bagi orang-orang yang rentan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Ingatlah
  rationale: Bentuk perfek dengan waw dalam konteks hukum ini berfungsi sebagai perintah atau ajakan. Bentuk imperatif Indonesia menyampaikan daya perintah secara alami; hubungan dengan ketentuan sebelumnya tetap tampak dari konteks.
- source_word: כִּי
  choice: bahwa
  rationale: Kata ini memperkenalkan isi yang harus diingat, sehingga 'bahwa' merupakan padanan Indonesia yang paling jelas.
- source_word: עֶבֶד
  choice: budak
  rationale: Dalam konteks Mesir, istilah ini menunjuk pada status perbudakan, bukan pelayanan biasa.
- source_word: הָיִיתָ
  choice: engkau dahulu adalah
  rationale: Menyatakan keadaan pada masa lampau; 'dahulu' memperjelas kontras antara pengalaman masa lalu dan kewajiban sekarang.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: di tanah Mesir
  rationale: Mempertahankan ungkapan konkret Ibrani dan irama hukumnya tanpa memadatkannya menjadi sekadar 'di Mesir'.
- source_word: עַל כֵּן
  choice: Karena itu
  rationale: Ungkapan ini menandai kesimpulan yang ditarik dari pengalaman Israel sebagai budak.
- source_word: אָנֹכִי
  choice: Aku
  rationale: Kata ganti mandiri memberi penekanan pada pembicara; kapitalisasi mengikuti kebiasaan bahasa Indonesia untuk rujukan ilahi tanpa menambahkan unsur yang tidak ada dalam sumber.
- source_word: מְצַוְּךָ
  choice: memerintahkan engkau
  rationale: Partisipel menyampaikan tindakan perintah yang sedang dinyatakan. Bentuk ini alami dan tetap mempertahankan objek tunggal orang kedua.
- source_word: לַעֲשׂוֹת
  choice: untuk melakukan
  rationale: Padanan luas dan langsung bagi עשה, tanpa mempersempit maknanya menjadi 'menaati' atau 'melaksanakan'.
- source_word: אֶת־הַדָּבָר הַזֶּה
  choice: hal ini
  rationale: '''Hal'' mempertahankan keluasan דָּבָר dan secara alami merujuk pada ketentuan sebelumnya, tanpa menyempitkannya secara eksplisit menjadi ''perintah''.'
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Engkau' mempertahankan sapaan tunggal dalam wacana perjanjian, sedangkan susunan kalimat dibuat alami bagi pembaca umum. Penanda catatan kaki ditempatkan sesudah frasa yang dijelaskannya.
