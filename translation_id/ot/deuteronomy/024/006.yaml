  text: לֹא יַחֲבֹ֥ל רֵחַ֖יִם וָ/רָ֑כֶב כִּי נֶ֖פֶשׁ ה֥וּא חֹבֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/006.yaml
  text: No one shall take a pair of millstones[a], or even the upper millstone, as a pledge, for he would be taking a life as a pledge.
translation:
  language: id
  text: Janganlah seorang pun mengambil sepasang batu kilangan, bahkan batu kilangan bagian atas, sebagai gadai, sebab ia mengambil nyawa sebagai gadai.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sebab ia mengambil sumber penghidupan orang sebagai gadai.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחֲבֹל / חֹבֵל
  choice: mengambil ... sebagai gadai
  rationale: Dalam konteks hukum ini, חבל berarti mengambil barang sebagai jaminan utang. Ungkapan yang sama diulang untuk mempertahankan pengulangan verba dalam teks Ibrani.
- source_word: רֵחַיִם
  choice: sepasang batu kilangan
  rationale: Bentuk dual menunjuk pada kedua batu kilangan sebagai satu pasangan.
- source_word: וָרָכֶב
  choice: bahkan batu kilangan yang atas
  rationale: רָכֶב menunjuk pada batu kilangan bagian atas; 'bahkan' menyampaikan daya hukum bahwa bukan hanya seluruh pasangan, melainkan satu bagian yang sangat diperlukan pun tidak boleh dijadikan gadai.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi larangan tersebut.
- source_word: נֶפֶשׁ
  choice: nyawa orang
  rationale: Di sini נֶפֶשׁ menunjuk pada hidup konkret yang terancam ketika alat untuk menyiapkan makanan sehari-hari dirampas, bukan secara khusus pada jiwa tak berwujud. Penambahan 'orang' membuat rujukannya alami dalam bahasa Indonesia.
- source_word: הוּא
  choice: dengan demikian ia
  rationale: Pronomina ini merujuk kepada orang yang mengambil gadai; susunan tersebut memperjelas bahwa tindakannya pada hakikatnya sama dengan mengambil nyawa sebagai gadai.
theological_decisions:
- issue: Makna נֶפֶשׁ dalam konteks hukum-sosial
  choice: nyawa atau kehidupan konkret
  alternative: mata pencaharian; jiwa; diri/orang
  rationale: Batu kilangan diperlukan untuk mengolah makanan pokok, sehingga menjadikannya gadai mengancam kelangsungan hidup si berutang. Terjemahan utama mempertahankan daya ungkap 'nyawa', sementara catatan memberi arti kontekstual 'sumber penghidupan' tanpa mengubahnya menjadi pernyataan antropologis doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum yang lugas. 'Batu kilangan' dipilih sebagai istilah yang dapat dipahami dan sesuai dengan alat penggiling tradisional; pengulangan 'mengambil ... sebagai gadai' mempertahankan struktur retoris sumber.
