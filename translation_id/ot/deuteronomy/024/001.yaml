id: DEU.24.1
reference: Deuteronomy 24:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי יִקַּ֥ח אִ֛ישׁ אִשָּׁ֖ה וּ/בְעָלָ֑/הּ וְ/הָיָ֞ה אִם לֹ֧א תִמְצָא חֵ֣ן בְּ/עֵינָ֗י/ו כִּי מָ֤צָא בָ/הּ֙ עֶרְוַ֣ת דָּבָ֔ר וְ/כָ֨תַב לָ֜/הּ סֵ֤פֶר כְּרִיתֻת֙ וְ/נָתַ֣ן בְּ/יָדָ֔/הּ וְ/שִׁלְּחָ֖/הּ מִ/בֵּיתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/001.yaml
  text: If a man takes a wife and marries her[a], and it happens that she does not find favor in his eyes because he has found in her some indecency, and he writes her a certificate of divorce, puts it into her hand, and sends her out of his house,
translation:
  language: id
  text: Apabila seorang laki-laki mengambil seorang perempuan sebagai istrinya dan menikahinya, lalu ternyata perempuan itu tidak mendapat perkenanan di mata laki-laki itu karena laki-laki itu mendapati padanya sesuatu yang tidak senonoh[a], kemudian ia menulis surat cerai baginya, menyerahkannya ke tangan perempuan itu, dan menyuruhnya pergi dari rumahnya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perkara yang tidak senonoh” atau “sesuatu yang memalukan.” Frasa Ibraninya memang tidak tegas dan telah dipahami dengan lebih dari satu cara.
    reason: Menampilkan alternatif leksikal dan mempertahankan ambiguitas asli עֶרְוַת דָּבָר.
lexical_decisions:
- source_word: כִּי
  choice: Apabila
  rationale: Kata ini membuka kasus hukum bersyarat. “Apabila” secara alami menandai protasis dan tidak membuat ayat ini terdengar sebagai perintah untuk bercerai.
- source_word: יִקַּח אִישׁ אִשָּׁה
  choice: seorang laki-laki mengambil seorang perempuan menjadi istrinya
  rationale: Terjemahan ini mempertahankan gambaran idiom Ibrani “mengambil istri” sambil menjelaskan maksud perkawinannya dalam bahasa Indonesia modern.
- source_word: וּבְעָלָהּ
  choice: dan menikahinya
  rationale: Dalam konteks ini verba בעל menunjuk pada masuknya laki-laki itu ke dalam hubungan perkawinan sebagai suami; “menikahinya” jelas dan tidak menimbulkan kesan kepemilikan.
- source_word: וְהָיָה אִם
  choice: lalu ternyata
  rationale: Ungkapan ini melanjutkan keadaan bersyarat dalam kasus hukum. “Lalu ternyata” menyampaikan perkembangan kasus tanpa kekakuan harfiah.
- source_word: לֹא תִמְצָא חֵן בְּעֵינָיו
  choice: perempuan itu tidak mendapat perkenanan di matanya
  rationale: Rumusan ini mempertahankan idiom sumber tentang memperoleh perkenanan “di mata” seseorang, tetapi tetap dapat dipahami pembaca Indonesia.
- source_word: כִּי מָצָא בָהּ
  choice: karena ia mendapati padanya
  rationale: “Karena” menyatakan alasan yang disebutkan dalam skenario hukum, sedangkan “mendapati padanya” mempertahankan bentuk konkret teks Ibrani.
- source_word: עֶרְוַת דָּבָר
  choice: suatu hal yang tidak senonoh
  rationale: Frasa Ibrani ini tidak menentukan secara tepat jenis pelanggaran atau aib yang dimaksud. Pilihan ini mempertahankan ketidakjelasan tersebut tanpa memakai ungkapan harfiah yang sulit dimengerti.
- source_word: וְכָתַב לָהּ סֵפֶר כְּרִיתֻת
  choice: ia menulis surat cerai baginya
  rationale: סֵפֶר כְּרִיתֻת adalah dokumen resmi pemutusan perkawinan. “Surat cerai” merupakan padanan Indonesia yang jelas dan lazim.
- source_word: וְנָתַן בְּיָדָהּ
  choice: menyerahkannya ke tangannya
  rationale: Terjemahan ini mempertahankan tindakan fisik dan prosedural berupa penyerahan dokumen itu langsung ke tangan perempuan tersebut.
- source_word: וְשִׁלְּחָהּ מִבֵּיתוֹ
  choice: menyuruhnya pergi dari rumahnya
  rationale: Pilihan ini menyampaikan tindakan mengirim atau melepaskan perempuan itu dari rumah sang suami, dengan tetap menjaga unsur ruang dalam teks sumber.
theological_decisions:
- issue: Apakah ayat ini merupakan perintah yang mengesahkan perceraian atau pembukaan suatu kasus hukum bersyarat
  choice: Diterjemahkan sebagai awal skenario hukum bersyarat, bukan sebagai perintah untuk menceraikan istri
  alternative: Menerjemahkan rangkaian tindakan itu sebagai ketentuan mandiri yang dapat terdengar seperti izin atau perintah untuk bercerai
  rationale: Struktur Ulangan 24:1–4 bersifat kasuistik. Ayat 1 memulai protasis yang berlanjut dalam ayat-ayat berikutnya, sedangkan larangan utama baru muncul kemudian. Karena itu, bentuk bersyarat dan tanda koma pada akhir ayat dipertahankan.
- issue: Cakupan makna עֶרְוַת דָּבָר
  choice: Dibiarkan tidak spesifik sebagai “suatu hal yang tidak senonoh”
  alternative: Menentukannya secara khusus sebagai perzinaan, ketelanjangan, atau pelanggaran tertentu
  rationale: Frasa Ibraninya memang sulit dan terbuka bagi lebih dari satu penafsiran. Terjemahan tidak boleh menyelesaikan ketegangan itu dengan memasukkan tafsiran teologis tertentu ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan corak hukum yang tetap mudah dipahami. Susunan bersyarat dipertahankan, dan ayat diakhiri dengan koma karena kalimat hukumnya berlanjut hingga ayat-ayat berikutnya.
