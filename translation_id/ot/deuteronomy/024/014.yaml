  text: לֹא תַעֲשֹׁ֥ק שָׂכִ֖יר עָנִ֣י וְ/אֶבְי֑וֹן מֵ/אַחֶ֕י/ךָ א֧וֹ מִ/גֵּרְ/ךָ֛ אֲשֶׁ֥ר בְּ/אַרְצְ/ךָ֖ בִּ/שְׁעָרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/024/014.yaml
  text: You shall not oppress a hired worker who is poor and needy[a], whether one of your brothers or one of your sojourners who is in your land[b], within your gates.
translation:
  language: id
  text: Jangan menindas[a] pekerja upahan yang miskin dan berkekurangan, baik ia salah seorang saudaramu maupun seorang pendatang yang tinggal di negerimu, di kota-kotamu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memeras” atau “mengeksploitasi” pekerja upahan; kata kerja Ibrani ini mencakup penindasan dalam bidang ekonomi.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di gerbang-gerbangmu”; ungkapan Ibrani ini menunjuk kepada kota-kota atau wilayah yang berada dalam yurisdiksi masyarakat.
    reason: cultural_note
lexical_decisions:
- source_word: תַעֲשֹׁק
  choice: menindas
  rationale: Kata kerja עָשַׁק mencakup penindasan, pemerasan, atau eksploitasi, khususnya dalam hubungan ekonomi. “Menindas” mempertahankan keluasan dan daya moral larangan itu; alternatif yang lebih khusus dicatat dalam catatan kaki.
- source_word: שָׂכִיר
  choice: pekerja upahan
  rationale: Istilah ini menunjuk kepada orang yang bekerja untuk menerima upah. “Pekerja upahan” jelas dalam bahasa Indonesia modern dan sesuai dengan konteks pembayaran upah pada ayat berikutnya.
- source_word: עָנִי וְאֶבְיוֹן
  choice: miskin dan berkekurangan
  rationale: Dua kata Ibrani ini bersama-sama menegaskan kerentanan ekonomi pekerja. Terjemahan mempertahankan kedua unsur tanpa menetapkan tingkat kemiskinan yang tidak dinyatakan teks.
- source_word: מֵאַחֶיךָ
  choice: salah seorang saudaramu
  rationale: Secara harfiah berarti “dari saudara-saudaramu” dan dalam hukum Ulangan menunjuk kepada sesama anggota Israel. Ungkapan kekerabatan dipertahankan, sementara “salah seorang” menyesuaikannya dengan pekerja tunggal yang dibicarakan.
- source_word: מִגֵּרְךָ
  choice: seorang pendatang
  rationale: גֵּר menunjuk kepada orang bukan pribumi yang menetap dalam masyarakat Israel. “Pendatang” mempertahankan status sosial tersebut tanpa memasukkan kategori hukum keimigrasian modern.
- source_word: אֲשֶׁר בְּאַרְצְךָ
  choice: yang tinggal di negerimu
  rationale: Klausa relatif tunggal ini paling wajar menerangkan pendatang tersebut. Kata “tinggal” memperjelas bahwa yang dimaksud bukan sekadar orang yang sedang lewat.
- source_word: בִּשְׁעָרֶיךָ
  choice: di kota-kotamu
  rationale: Secara harfiah, frasa ini berarti “di gerbang-gerbangmu,” tetapi merupakan ungkapan lazim bagi kota-kota yang berada dalam lingkungan hidup dan yurisdiksi masyarakat Israel. Terjemahan utama menyampaikan maksud idiom itu, sedangkan gambaran harfiahnya dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Istilah kekerabatan אַחֶיךָ dalam hukum perjanjian
  choice: saudaramu
  alternative: sesama orang Israel
  rationale: Teks memakai bahasa kekerabatan yang secara gramatikal maskulin dan berfungsi secara perjanjian. Terjemahan mempertahankan metafora keluarga tanpa mempersempit atau memperluas cakupan hukum secara tersirat.
- issue: Makna kategori sosial גֵּר
  choice: pendatang
  alternative: orang asing yang menetap
  rationale: Istilah ini menyebut warga bukan pribumi yang tinggal di tengah Israel dan mendapat perlindungan hukum. “Pendatang” alami dalam bahasa Indonesia dan tidak menyamakannya begitu saja dengan kategori kewarganegaraan atau imigrasi modern.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang tegas dan bermartabat. Kalimat dibuat alami bagi pembaca umum, sambil mempertahankan istilah kekerabatan dan kategori sosial penting dari teks Ibrani.
