lexical_decisions:
- source_word: הַחֲסִידָה
  choice: burung ranggung
  rationale: Istilah Ibrani ini paling umum dipahami sebagai stork. Dalam bahasa Indonesia, 'burung ranggung' merupakan nama baku yang cukup dikenal untuk kelompok burung tersebut; identifikasi zoologisnya tetap diberi catatan karena tidak sepenuhnya pasti.
- source_word: הָאֲנָפָה
  choice: bangau
  rationale: Identifikasi tepatnya tidak pasti, tetapi istilah ini lazim dipahami sebagai heron, yaitu burung air dari kelompok yang dalam pemakaian Indonesia umumnya disebut 'bangau'. Alternatif seperti ibis atau cerek dicatat dalam catatan kaki.
- source_word: לְמִינָהּ
  choice: menurut jenisnya
  rationale: Ungkapan formulaik ini menunjuk pada kelompok atau ragam sejenis, bukan hanya satu spesies secara sempit. 'Menurut jenisnya' alami dan tetap dekat dengan struktur Ibrani.
- source_word: הַדּוּכִיפַת
  choice: hudhud
  rationale: Kajian modern umumnya mengidentifikasinya sebagai hoopoe. 'Hudhud' adalah nama Indonesia yang baku dan lebih tepat daripada identifikasi tradisional sebagai lapwing.
- source_word: הָעֲטַלֵּף
  choice: kelelawar
  rationale: Kata Ibrani ini jelas menunjuk pada kelelawar. Pengelompokannya bersama makhluk terbang dipertahankan tanpa menyesuaikannya dengan taksonomi zoologi modern.
