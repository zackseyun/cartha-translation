  text: burung ranggung[a], bangau menurut jenisnya[b], hudhud[c], dan kelelawar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "bangau"; identifikasi tepat beberapa burung dalam ayat ini tidak pasti.
