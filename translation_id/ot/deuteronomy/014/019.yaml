  text: And every swarming thing of the birds is unclean for you[a]; they shall not be eaten.
translation:
  language: id
  text: Segala makhluk kecil yang bersayap dan berkerumun adalah najis bagimu[a]; semuanya tidak boleh dimakan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “segala makhluk berkerumun yang terbang” atau “segala makhluk berkerumun yang bersayap.” Ungkapan Ibrani menggabungkan שֶׁרֶץ (“makhluk yang berkerumun”) dengan עוֹף (“makhluk terbang; burung”) dan kemungkinan terutama menunjuk pada serangga terbang, bukan burung dalam arti biasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: Segala
  rationale: כֹל menyatakan cakupan menyeluruh. Hubungan dengan ayat sebelumnya tetap jelas dari kesinambungan wacana, sehingga וְ tidak perlu diterjemahkan secara kaku dengan “dan” pada awal kalimat Indonesia.
- source_word: שֶׁרֶץ הָ/עוֹף
  choice: binatang kecil berkerumun yang bersayap
  rationale: שֶׁרֶץ menunjuk pada makhluk kecil yang bergerak atau berkumpul dalam jumlah banyak, sedangkan עוֹף berkaitan dengan makhluk terbang atau bersayap. Gabungan ini kemungkinan terutama menunjuk pada serangga terbang, bukan burung dalam arti biasa.
- source_word: טָמֵא
  choice: najis
  rationale: “Najis” adalah istilah Indonesia yang lazim untuk kategori ketahiran ritual dan makanan dalam Taurat, bukan sekadar keadaan kotor secara fisik.
- source_word: הוּא לָ/כֶם
  choice: adalah najis bagimu
  rationale: Ungkapan ini mempertahankan orientasi peraturan kepada umat yang disapa dan menyampaikan predikasi Ibrani secara wajar.
- source_word: לֹא יֵאָכֵלוּ
  choice: binatang-binatang itu tidak boleh dimakan
  rationale: Bentuk pasif dipertahankan, dan frasa “binatang-binatang itu” mencerminkan verba Ibrani orang ketiga jamak tanpa menghasilkan konstruksi Indonesia yang janggal.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Binatang kecil berkerumun yang bersayap” dipilih agar kategori makhluknya mudah dipahami sambil mempertahankan ketidakpastian leksikal dalam catatan kaki. Ragam hukum disampaikan secara alami melalui “tidak boleh dimakan”.
