source:
  edition: WLC
  text: וְ/אֶת הַ֠/חֲזִיר כִּֽי מַפְרִ֨יס פַּרְסָ֥ה הוּא֙ וְ/לֹ֣א גֵרָ֔ה טָמֵ֥א ה֖וּא לָ/כֶ֑ם מִ/בְּשָׂרָ/ם֙ לֹ֣א תֹאכֵ֔לוּ וּ/בְ/נִבְלָתָ֖/ם לֹ֥א תִגָּֽעוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/008.yaml
  text: And the pig[a], because it has a split hoof but does not chew the cud, is unclean for you. You shall not eat any of its flesh[b], and you shall not touch its carcass.
translation:
  language: id
  text: Babi, karena berkuku belah tetapi tidak memamah biak, adalah najis bagimu. Jangan makan sedikit pun dagingnya dan jangan menyentuh bangkainya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bagian akhir berbunyi “daging mereka” dan “bangkai mereka”; bentuk jamak itu tampaknya merujuk secara kolektif kepada hewan-hewan yang dibicarakan dalam daftar ini.
    reason: grammatical_number
lexical_decisions:
- source_word: הַחֲזִיר
  choice: babi
  rationale: Istilah umum dan alami dalam bahasa Indonesia modern untuk hewan yang dimaksud.
- source_word: כִּי
  choice: karena
  rationale: Menandai alasan bagi penetapan babi sebagai najis.
- source_word: מַפְרִיס פַּרְסָה
  choice: berkuku belah
  rationale: Ungkapan ringkas dan lazim untuk kuku yang terbagi atau terbelah.
- source_word: וְלֹא גֵרָה
  choice: tetapi tidak memamah biak
  rationale: Memakai ungkapan Indonesia yang lazim untuk kriteria makanan ini; kata penghubung mempertahankan kontras dengan kuku belah.
- source_word: טָמֵא
  choice: najis
  rationale: Istilah mapan dalam konteks hukum ritual dan makanan Taurat, tanpa menyamakannya dengan kejahatan moral.
- source_word: לָכֶם
  choice: bagimu
  rationale: Mempertahankan penerapan ketentuan itu kepada komunitas perjanjian yang disapa secara jamak.
- source_word: מִבְּשָׂרָם
  choice: sedikit pun dagingnya
  rationale: ‘Sedikit pun’ menyampaikan daya partitif מִן dalam larangan; bentuk tunggal menghasilkan bahasa Indonesia yang alami, sedangkan bentuk jamak Ibrani dijelaskan dalam catatan.
- source_word: נִבְלָתָם
  choice: bangkainya
  rationale: ‘Bangkai’ tepat untuk tubuh hewan mati; bentuk tunggal mengikuti rujukan langsung kepada babi dalam bahasa Indonesia, dengan bentuk jamak sumber dicatat.
- source_word: תִגָּעוּ
  choice: menyentuh
  rationale: Padanan langsung yang mempertahankan kekuatan larangan tanpa memperluasnya menjadi ‘mendekati’ atau mempersempitnya menjadi ‘menangani’.
theological_decisions:
- issue: Sifat kenajisan dalam hukum makanan Taurat
  choice: Menerjemahkan טָמֵא sebagai ‘najis’ tanpa penjelasan doktrinal tambahan.
  alternative: cemar; tidak tahir
  rationale: Ayat menyatakan status dalam hukum makanan dan ritual, bukan bahwa hewan tersebut jahat secara moral.
- issue: Kekuatan larangan menyentuh bangkai
  choice: 'Mempertahankan larangan langsung: ‘jangan menyentuh’.'
  alternative: jangan menangani; jangan bersentuhan dengan
  rationale: Kata נגע secara langsung berarti ‘menyentuh’; terjemahan tidak memperluas ataupun mempersempit perintah.
- issue: Peralihan dari nomina tunggal ke sufiks jamak
  choice: Memakai bentuk tunggal yang alami dalam teks utama dan mengungkap bentuk jamak Ibrani dalam catatan.
  alternative: ‘daging mereka’ dan ‘bangkai mereka’
  rationale: Teks menyebut ‘babi’ dalam bentuk tunggal tetapi kemudian memakai dua sufiks jamak, yang dapat menunjuk secara kolektif kepada hewan-hewan dalam daftar. Catatan mempertahankan ketegangan gramatikal tanpa membuat teks utama terasa tidak beranteseden.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas dengan corak hukum yang bermartabat. ‘Berkuku belah’, ‘memamah biak’, ‘najis’, dan ‘bangkai’ mudah dipahami serta sesuai dengan konteks Taurat. Penanda catatan [a] ditempatkan setelah klausa yang dijelaskannya.
