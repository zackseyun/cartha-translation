  source_fidelity: 'Terjemahan setia pada Ibrani: babi disebut sebagai hewan berkuku belah tetapi tidak memamah biak, lalu dinyatakan najis bagi para penerima, dengan larangan memakan daging dan menyentuh bangkainya. Bentuk tunggal Indonesia pada ‘dagingnya’ dan ‘bangkainya’ dapat diterima karena anteseden langsungnya ‘babi’; catatan dengan tepat mencatat sufiks jamak Ibrani tanpa memaksakan bentuk yang tidak alami dalam bahasa Indonesia.'
  naturalness: Bahasanya baku, jelas, dan alami dalam bahasa Indonesia modern. Frasa ‘berkuku belah’, ‘memamah biak’, ‘sedikit pun’, dan ‘menyentuh bangkainya’ tepat serta lugas. Struktur dua larangan dengan ‘dan jangan’ juga mempertahankan gaya perintah hukum secara wajar.
  terminology: ‘Babi’, ‘najis’, ‘memamah biak’, dan ‘bangkai’ sesuai dengan penggunaan Indonesia yang lazim dalam konteks hukum makanan Taurat. ‘Najis’ mempertahankan kategori ritual tanpa menambahkan penilaian moral atau doktrinal.
