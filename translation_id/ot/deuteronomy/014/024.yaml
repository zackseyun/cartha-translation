source:
  edition: WLC
  text: וְ/כִֽי יִרְבֶּ֨ה מִמְּ/ךָ֜ הַ/דֶּ֗רֶךְ כִּ֣י לֹ֣א תוּכַ֘ל שְׂאֵת/וֹ֒ כִּֽי יִרְחַ֤ק מִמְּ/ךָ֙ הַ/מָּק֔וֹם אֲשֶׁ֤ר יִבְחַר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לָ/שׂ֥וּם שְׁמ֖/וֹ שָׁ֑ם כִּ֥י יְבָרֶכְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/024.yaml
  text: And if the journey is too long for you[a], so that you are not able to carry it, because the place that Yahweh your God will choose to put his name there is too far from you, when Yahweh your God blesses you,
translation:
  language: id
  text: Dan jika perjalanan itu terlalu jauh bagimu sehingga engkau tidak sanggup membawanya, karena tempat yang akan dipilih Yahweh, Allahmu, untuk menempatkan nama-Nya di sana terlalu jauh darimu, ketika Yahweh, Allahmu, memberkatimu,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “karena Yahweh, Allahmu, memberkatimu.” Kata penghubung Ibrani di sini dapat dipahami secara kausal maupun temporal.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Namun, jika
  rationale: Memperkenalkan kondisi lanjutan yang berlawanan secara praktis dengan perintah sebelumnya; bentuk ini mempertahankan daya penghubung waw dan fungsi kondisional כי secara alami dalam bahasa Indonesia.
- source_word: יִרְבֶּה מִמְּךָ הַדֶּרֶךְ
  choice: perjalanan itu terlalu jauh bagimu
  rationale: Ungkapan harfiahnya menyatakan bahwa jalan itu menjadi terlalu besar bagi seseorang; terjemahan ini menyampaikan bahwa jaraknya melampaui kemampuan orang tersebut.
- source_word: לֹא תוּכַל שְׂאֵתוֹ
  choice: engkau tidak sanggup membawanya
  rationale: Kata נשא di sini menunjuk pada tindakan membawa secara fisik hasil persepuluhan yang disebut dalam konteks.
- source_word: יִרְחַק מִמְּךָ הַמָּקוֹם
  choice: tempat ... terlalu jauh darimu
  rationale: Mempertahankan arti spasial רחק serta istilah penting 'tempat' dalam Ulangan.
- source_word: אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ
  choice: yang akan dipilih Yahweh, Allahmu
  rationale: Bentuk yiqtol dipahami berdaya masa depan dalam ketetapan hukum ini, merujuk pada tempat ibadah yang kelak ditetapkan Allah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi yang tertulis langsung dalam teks Ibrani.
- source_word: לָשׂוּם שְׁמוֹ שָׁם
  choice: untuk menempatkan nama-Nya di sana
  rationale: Mempertahankan rumusan khas Ulangan tentang lokasi ibadah pilihan Allah tanpa memperluas maknanya.
- source_word: כִּי יְבָרֶכְךָ יְהוָה אֱלֹהֶיךָ
  choice: ketika Yahweh, Allahmu, memberkatimu
  rationale: כִּי paling wajar menyatakan keadaan saat masalah pengangkutan timbul karena kelimpahan berkat, tetapi kemungkinan makna kausal tetap dicatat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Hubungan berkat Allah dengan kesulitan membawa persepuluhan
  choice: ketika Yahweh, Allahmu, memberkatimu
  alternative: karena Yahweh, Allahmu, memberkatimu
  rationale: כִּי dapat dibaca secara temporal atau kausal. Teks utama memakai hubungan temporal yang cocok dengan alur hukum, sedangkan kemungkinan kausal dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan bermartabat; pronomina tunggal 'engkau' mempertahankan sapaan hukum kepada setiap orang Israel. Kalimat sengaja dibiarkan berakhir dengan koma karena ayat ini merupakan anak kalimat yang berlanjut ke ayat 25.
