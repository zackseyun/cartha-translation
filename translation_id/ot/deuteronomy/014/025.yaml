  text: then you shall turn it into silver[a], bind the silver in your hand[b], and go to the place that Yahweh your God will choose.
translation:
  language: id
  text: maka tukarkanlah itu dengan perak[a], bungkuslah perak itu dan bawalah bersamamu[b], lalu pergilah ke tempat yang akan dipilih Yahweh, Allahmu.
