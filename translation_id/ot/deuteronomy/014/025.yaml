  footnotes:
  - marker: a
    text: Atau, “ubahlah itu menjadi uang.” Kata Ibrani yang dipakai secara harfiah berarti “perak,” yang dalam konteks ini berfungsi sebagai uang.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “ikatlah perak itu di tanganmu.” Maksudnya ialah mengemas dan mengamankan perak itu untuk perjalanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה בַּכָּסֶף
  choice: tukarkanlah itu dengan perak
  rationale: Ungkapan Ibrani ini dalam konteksnya menyatakan penukaran hasil persepuluhan dengan perak sebagai alat pembayaran. Pilihan ini mempertahankan kata konkret 'perak' sekaligus menyampaikan transaksi secara wajar dalam bahasa Indonesia.
- source_word: וְצַרְתָּ הַכֶּסֶף בְּיָדְךָ
  choice: bungkuslah perak itu dan bawalah di tanganmu
  rationale: Kata צָרַר dapat berarti mengikat atau membungkus. Terjemahan ini mempertahankan gambaran perak yang diamankan untuk perjalanan, sementara 'bawalah di tanganmu' mengungkapkan frasa konkret בְּיָדְךָ secara alami.
- source_word: וְהָלַכְתָּ אֶל הַמָּקוֹם
  choice: lalu pergilah ke tempat
  rationale: הלך adalah kata kerja umum untuk pergi. 'Pergilah ke tempat' langsung, alami, dan sesuai dengan bentuk instruksi hukum.
- source_word: אֲשֶׁר יִבְחַר
  choice: yang akan dipilih
  rationale: Bentuk imperfek paling wajar dipahami berorientasi ke masa depan dalam rumusan tentang tempat pusat ibadah yang akan Yahweh pilih.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi Tetragramaton dipertahankan sebagai nama pribadi 'Yahweh', bukan diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk ini merupakan sebutan perjanjian yang langsung dan alami dalam bahasa Indonesia, dengan akhiran orang kedua tunggal dipertahankan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar dan tanpa memaksakan vokalisasi alternatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk tunggal 'engkau' tersirat dalam verba imperatif dan tampak pada 'Allahmu'. Susunan kalimat mempertahankan rangkaian tindakan dalam teks Ibrani, sedangkan ungkapan tentang membungkus dan membawa perak dibuat cukup alami tanpa menghilangkan gambaran konkretnya.
