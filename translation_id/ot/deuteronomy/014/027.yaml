  text: וְ/הַ/לֵּוִ֥י אֲשֶׁר בִּ/שְׁעָרֶ֖י/ךָ לֹ֣א תַֽעַזְבֶ֑/נּוּ כִּ֣י אֵ֥ין ל֛/וֹ חֵ֥לֶק וְ/נַחֲלָ֖ה עִמָּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/027.yaml
  text: And you shall not neglect the Levite who is within your gates[c][b][a], because he has no portion or inheritance with you.
translation:
  language: id
  text: Janganlah mengabaikan orang Lewi yang tinggal di kota-kotamu,[a][b] sebab ia tidak mempunyai bagian maupun milik pusaka bersamamu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di dalam gerbang-gerbangmu”; ungkapan Ibrani ini berarti di kota-kota atau komunitas setempatmu.
    reason: cultural_note
  - marker: b
    text: 'Atau: “meninggalkan” atau “menelantarkan.”'
    reason: lexical_alternative
  - marker: c
    text: Maksudnya, orang Lewi tidak menerima jatah tanah kesukuan seperti suku-suku Israel lainnya.
    reason: cross_reference
lexical_decisions:
- source_word: וְהַלֵּוִי
  choice: orang Lewi
  rationale: Nomina tunggal tentu ini menunjuk kepada seorang Lewi sebagai wakil golongannya. “Orang Lewi” jelas dan tidak menyamakan semua orang Lewi dengan imam.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: yang tinggal di kota-kotamu
  rationale: Secara harfiah ungkapan ini berarti “yang di dalam gerbang-gerbangmu”, tetapi dalam bahasa hukum Ibrani “gerbang” mewakili kota atau komunitas setempat. Terjemahan ini menyampaikan makna idiom itu secara alami; citra harfiahnya dijelaskan dalam catatan kaki.
- source_word: לֹא תַעַזְבֶנּוּ
  choice: Janganlah mengabaikan
  rationale: Dalam konteks kewajiban memberi dukungan kepada orang Lewi, עזב menyatakan tindakan membiarkan atau tidak memedulikannya. “Mengabaikan” menyampaikan kegagalan praktis untuk memperhatikan kebutuhannya tanpa membatasi makna pada tindakan meninggalkan secara fisik.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi perintah sebelumnya. “Sebab” alami sekaligus sesuai dengan ragam bahasa hukum yang bermartabat.
- source_word: אֵין לוֹ
  choice: ia tidak mempunyai
  rationale: Ini merupakan padanan Indonesia yang idiomatis bagi konstruksi eksistensial Ibrani, secara harfiah “tidak ada baginya”.
- source_word: חֵלֶק וְנַחֲלָה
  choice: bagian maupun milik pusaka
  rationale: “Bagian” menyatakan jatah atau hak, sedangkan “milik pusaka” menunjuk pada kepemilikan warisan, terutama tanah. Dalam lingkup penyangkalan, “maupun” menyatakan bahwa orang Lewi tidak mempunyai keduanya dan tetap mencerminkan pasangan istilah Ibrani.
- source_word: עִמָּךְ
  choice: bersamamu
  rationale: Padanan langsung ini mempertahankan sapaan orang kedua tunggal kolektif dan menyatakan bahwa orang Lewi tidak menerima kepemilikan warisan bersama umat Israel lainnya.
theological_decisions:
- issue: Sifat ketiadaan bagian orang Lewi
  choice: Ayat ini menyatakan bahwa orang Lewi tidak mempunyai bagian dan milik pusaka tanah kesukuan seperti suku-suku Israel lainnya sehingga tidak boleh diabaikan oleh masyarakat.
  alternative: Ayat ini hanya berbicara secara umum tentang keterpinggiran sosial tanpa menunjuk secara khusus pada pembagian tanah.
  rationale: Pasangan חֵלֶק וְנַחֲלָה dalam konteks Ulangan menunjuk terutama pada ketiadaan jatah wilayah kesukuan bagi orang Lewi. Teks utama mempertahankan istilah tersebut tanpa memasukkan uraian teologis tambahan; konteks pertanahannya diterangkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam hukum-perjanjian yang tetap wajar dan bermartabat. Bentuk “Janganlah” mempertahankan daya perintah, sedangkan “kota-kotamu” mengomunikasikan idiom Ibrani secara langsung kepada pembaca masa kini. Pronomina tunggal “ia” dan akhiran “-mu” mempertahankan bentuk tunggal representatif dalam sumber.
