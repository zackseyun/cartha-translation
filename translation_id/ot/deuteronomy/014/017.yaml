  text: the pelican[a], the carrion vulture, and the cormorant[c][b],
translation:
  language: id
  text: burung pelikan[a], burung nasar[b], dan burung pecuk[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Identitas nama-nama burung Ibrani dalam ayat ini tidak pasti. “Burung pelikan” juga dapat diterjemahkan “burung hantu gurun” atau sekadar “burung hantu”.
    reason: lexical_alternative
  - marker: b
    text: Jenis burung nasar yang dimaksud tidak dapat dipastikan; istilah ini menunjuk kepada burung pemangsa atau pemakan bangkai.
    reason: lexical_alternative
  - marker: c
    text: Istilah Ibrani ini mungkin menunjuk kepada burung air lain, misalnya burung pelikan atau burung hantu pemakan ikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקָּאָת
  choice: burung pelikan
  rationale: Identitas jenis burung ini tidak pasti. “Burung pelikan” dipilih sebagai padanan tradisional yang dikenal luas dan sesuai dengan konteks daftar burung, sedangkan kemungkinan lain dicatat dalam catatan kaki.
- source_word: הָרָחָמָה
  choice: burung nasar
  rationale: Kata ini tampaknya menunjuk kepada burung pemangsa atau pemakan bangkai. “Burung nasar” merupakan istilah Indonesia yang alami dan mudah dipahami tanpa menetapkan spesies secara berlebihan.
- source_word: הַשָּׁלָךְ
  choice: burung pecuk
  rationale: Istilah Ibrani ini kemungkinan menunjuk kepada burung air pemakan ikan, tetapi spesiesnya tidak pasti. “Burung pecuk” adalah padanan modern yang sesuai, sementara alternatifnya dipertahankan dalam catatan kaki.
- source_word: וְ / וְאֶת
  choice: dan / tidak diterjemahkan secara tersendiri
  rationale: Konjungsi וְ diterjemahkan “dan”. Penanda objek langsung אֶת tidak mempunyai padanan tersendiri dalam bahasa Indonesia.
