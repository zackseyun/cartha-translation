translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan daftar yang ringkas dan bermartabat. Kata “burung” diulang agar setiap nama jenis mudah dikenali. Ketidakpastian zoologis dalam istilah Ibrani tidak dipaksakan menjadi identifikasi spesies yang pasti, melainkan dijelaskan melalui catatan kaki.
