  text: בָּנִ֣ים אַתֶּ֔ם לַֽ/יהוָ֖ה אֱלֹהֵי/כֶ֑ם לֹ֣א תִתְגֹּֽדְד֗וּ וְ/לֹֽא תָשִׂ֧ימוּ קָרְחָ֛ה בֵּ֥ין עֵינֵי/כֶ֖ם לָ/מֵֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/001.yaml
  text: You are sons of Yahweh your God[a]. Do not cut yourselves[b], and do not make a bald spot between your eyes for the dead.
translation:
  language: id
  text: Kalian adalah putra-putra Yahweh, Allah kalian.[a] Janganlah menoreh-noreh diri kalian atau membuat bagian botak di antara mata kalian[b] karena orang mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anak-anak Yahweh, Allah kalian.” Kata Ibraninya berbentuk jamak maskulin dan secara harfiah berarti “putra-putra”, tetapi dapat dipakai bagi umat secara kolektif.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibraninya secara harfiah berarti “di antara mata kalian”, yaitu pada bagian dahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנִים
  choice: anak-anak lelaki
  rationale: Nomina Ibrani ini berbentuk jamak maskulin dan secara harfiah berarti 'anak-anak lelaki'. Pilihan ini mempertahankan bentuk sumber dalam pernyataan identitas perjanjian, sementara kemungkinan makna kolektif dicatat dalam catatan kaki.
- source_word: לַיהוָה
  choice: Yahweh
  rationale: 'Preposisi ל menandai hubungan atau kepunyaan: mereka adalah anak-anak lelaki yang berelasi dengan atau menjadi milik Yahweh. Dalam susunan alami bahasa Indonesia, hubungan itu sudah dinyatakan langsung oleh frasa ''anak-anak lelaki Yahweh''.'
- source_word: אֱלֹהֵיכֶם
  choice: Allah kalian
  rationale: Bentuk konstruk dengan akhiran orang kedua jamak berarti 'Allah kalian' dan mempertahankan rumusan relasi perjanjian.
- source_word: תִתְגֹּדְדוּ
  choice: menoreh-noreh diri kalian
  rationale: Bentuk refleksif ini menunjuk pada tindakan melukai diri dengan torehan, khususnya sebagai praktik perkabungan. 'Menoreh-noreh diri' menyampaikan tindakan yang disengaja dan berulang tanpa menambahkan rincian yang tidak dinyatakan.
- source_word: תָשִׂימוּ קָרְחָה
  choice: mencukur gundul bagian
  rationale: Gabungan verba dan nomina ini berarti membuat bagian yang botak, rupanya dengan mencukurnya sebagai tanda perkabungan. Ungkapan ini lebih alami dalam bahasa Indonesia daripada terjemahan mekanis 'menaruh kebotakan'.
- source_word: בֵּין עֵינֵיכֶם
  choice: di antara mata kalian
  rationale: Terjemahan ini mempertahankan ungkapan tubuh dalam bahasa Ibrani; acuan anatomisnya pada bagian dahi dijelaskan dalam catatan kaki.
- source_word: לָמֵת
  choice: karena orang mati
  rationale: Preposisi ל di sini menyatakan alasan atau kaitan perkabungan dengan kematian. 'Karena orang mati' alami dalam bahasa Indonesia dan tidak menentukan apakah yang dimaksud satu orang mati atau orang mati secara umum.
theological_decisions:
- issue: Istilah identitas perjanjian yang bergender
  choice: anak-anak lelaki
  alternative: anak-anak
  rationale: Teks sumber memakai nomina jamak maskulin. Teks utama mempertahankan bentuk tersebut tanpa menyimpulkan bahwa komunitas perjanjian hanya mencakup laki-laki; alternatif kolektif yang lebih netral diberikan dalam catatan kaki.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memuat nama perjanjian יהוה. Bentuk 'Yahweh' mempertahankannya sebagai nama diri dan membedakannya dari gelar ilahi.
- issue: Hubungan larangan dengan perkabungan bagi orang mati
  choice: kedua tindakan dipahami sebagai praktik karena orang mati
  alternative: frasa 'karena orang mati' hanya menerangkan tindakan mencukur
  rationale: Secara sintaksis, frasa penutup dapat secara langsung melekat pada larangan kedua, tetapi konteks praktik perkabungan dan rangkaian larangan mendukung pemahaman bahwa kedua tindakan berkaitan dengan orang mati. Susunan Indonesia mempertahankan cakupan yang cukup terbuka dan tidak menambahkan penjelasan kultis.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Kalian' dipakai untuk memperjelas bahwa semua bentuk orang kedua dalam ayat ini adalah jamak. Paralel larangan dipertahankan dengan 'Janganlah ... atau ...', dan ungkapan tubuh Ibrani dipertahankan dalam teks utama dengan penjelasan singkat di catatan kaki.
