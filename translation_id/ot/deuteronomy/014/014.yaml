lexical_decisions:
- source_word: וְאֵת
  choice: dan
  rationale: וְ menghubungkan unsur ini dengan daftar burung terlarang sebelumnya. Penanda objek אֵת tidak memiliki padanan langsung dalam bahasa Indonesia dan tidak perlu dinyatakan tersendiri.
- source_word: כָּל
  choice: setiap
  rationale: Dengan nomina tunggal, כָּל bersifat distributif dan mencakup seluruh golongan tersebut.
- source_word: עֹרֵב
  choice: burung gagak
  rationale: עֹרֵב dapat menunjuk secara luas pada kelompok raven/crow. 'Burung gagak' merupakan padanan Indonesia yang alami dan cukup luas, tanpa memaksakan identifikasi spesies yang terlalu sempit.
- source_word: לְמִינוֹ
  choice: menurut jenisnya
  rationale: Ungkapan ini menyatakan penggolongan berdasarkan jenis; padanan tersebut alami dalam bahasa Indonesia dan mempertahankan bentuk klasifikatif teks Ibrani.
