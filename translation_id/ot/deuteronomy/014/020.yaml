lexical_decisions:
- source_word: כָּל
  choice: semua
  rationale: Kata ini mencakup seluruh anggota dalam kategori yang disebutkan; dalam bahasa Indonesia, “semua” secara alami menyampaikan cakupan itu.
- source_word: עוֹף
  choice: burung
  rationale: Walaupun kata Ibrani ini dapat merujuk lebih luas pada makhluk bersayap atau yang terbang, konteks langsung mengenai makanan menyebut jenis-jenis burung.
- source_word: טָהוֹר
  choice: tahir
  rationale: Dalam hukum makanan Israel, kata ini menunjuk pada kategori ritual yang diizinkan, bukan sekadar kebersihan fisik atau kemurnian moral. “Tahir” mempertahankan istilah teknis tersebut.
- source_word: תֹּאכֵלוּ
  choice: boleh kamu makan
  rationale: Bentuk verba orang kedua jamak ini, dalam pertentangan dengan larangan pada konteks sekitarnya, paling wajar dipahami sebagai pemberian izin.
