  text: לֹ֣א תֹאכְל֣וּ כָל נְ֠בֵלָה לַ/גֵּ֨ר אֲשֶׁר בִּ/שְׁעָרֶ֜י/ךָ תִּתְּנֶ֣נָּ/ה וַ/אֲכָלָ֗/הּ א֤וֹ מָכֹר֙ לְ/נָכְרִ֔י כִּ֣י עַ֤ם קָדוֹשׁ֙ אַתָּ֔ה לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ לֹֽא תְבַשֵּׁ֥ל גְּדִ֖י בַּ/חֲלֵ֥ב אִמּֽ/וֹ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/021.yaml
  text: You shall not eat any carcass[a]. You may give it to the sojourner who is within your gates, and he may eat it; or you may sell it to a foreigner. For you are a holy people to Yahweh your God[e][d][c][b]. You shall not boil a young goat in its mother's milk.
translation:
  language: id
  text: Janganlah kamu makan bangkai apa pun.[a] Kamu boleh memberikannya kepada pendatang[b] yang tinggal di kota-kotamu, dan ia boleh memakannya, atau kamu boleh menjualnya kepada orang asing. Sebab, kamu adalah umat yang kudus bagi Yahweh, Allahmu. Janganlah kamu merebus anak kambing dalam susu induknya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud ialah bangkai hewan yang mati dengan sendirinya atau tidak disembelih dengan cara yang diperbolehkan.
    reason: lexical_alternative
  - marker: b
    text: “Pendatang” menerjemahkan גֵּר, yaitu orang bukan Israel yang menetap di tengah masyarakat Israel. Istilah ini berbeda dari “orang asing” (נָכְרִי) pada bagian berikutnya. Secara harfiah, frasa ini berbunyi “yang ada di dalam gerbang-gerbangmu,” yaitu yang tinggal di kota-kota atau komunitasmu.
    reason: lexical_and_cultural_note
lexical_decisions:
- source_word: נְבֵלָה
  choice: bangkai
  rationale: Kata ini menunjuk pada bangkai hewan yang mati atau tidak disembelih dengan cara yang diperbolehkan. “Bangkai” ringkas, alami dalam bahasa Indonesia, dan sesuai dengan konteks hukum makanan.
- source_word: גֵּר
  choice: pendatang
  rationale: Menunjuk pada orang bukan Israel yang menetap di tengah masyarakat Israel dan memiliki status sosial tertentu. “Pendatang” cukup alami, sementara catatan kaki menjelaskan perbedaannya dari נָכְרִי.
- source_word: בִּשְׁעָרֶיךָ
  choice: yang tinggal di kota-kotamu
  rationale: Secara harfiah berarti “di dalam gerbang-gerbangmu,” suatu ungkapan Ibrani bagi orang yang tinggal dalam kota atau komunitas setempat. Terjemahan idiomatis lebih mudah dipahami pembaca Indonesia modern.
- source_word: תִּתְּנֶנָּה וַאֲכָלָהּ
  choice: Kamu boleh memberikannya ... supaya ia memakannya
  rationale: Dalam konteks hukum, bentuk-bentuk ini mengizinkan tindakan sebagai alternatif terhadap konsumsi oleh orang Israel, bukan mewajibkan pemberian bangkai tersebut.
- source_word: נָכְרִי
  choice: orang asing
  rationale: Menunjuk pada orang asing yang tidak memiliki status sebagai pendatang menetap seperti גֵּר. Pilihan ini mempertahankan perbedaan kedua istilah tersebut.
- source_word: עַם קָדוֹשׁ
  choice: umat yang kudus
  rationale: Mempertahankan bahasa perjanjian yang menyatakan bahwa Israel dikhususkan bagi Allah.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi menandai kepunyaan atau pengkhususan, sedangkan nama perjanjian יהוה ditransliterasikan sebagai “Yahweh.”
- source_word: גְּדִי
  choice: anak kambing
  rationale: Lebih jelas dan alami bagi pembaca Indonesia modern daripada istilah yang dapat dianggap kurang lazim.
- source_word: תְבַשֵּׁל
  choice: merebus
  rationale: Kata kerja ini secara khusus dapat menunjuk pada memasak dengan cairan; “merebus” mempertahankan ketepatan gambaran larangan.
- source_word: בַּחֲלֵב אִמּוֹ
  choice: dalam susu induknya
  rationale: Ungkapan alami dalam bahasa Indonesia yang mempertahankan gambaran konkret teks Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Daya hukum kata kerja mengenai pemberian atau penjualan bangkai
  choice: 'izin: “boleh memberikannya ... atau menjualnya”'
  alternative: 'perintah: “harus memberikannya ... atau menjualnya”'
  rationale: Pokok hukum ini adalah larangan bagi Israel untuk memakannya sambil mengizinkan bangkai itu diberikan atau dijual kepada non-Israel. Bentuk permisif menyampaikan fungsi tersebut secara alami tanpa menambahkan kewajiban.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan tunggal kolektif dalam teks Ibrani diterjemahkan dengan “kamu,” sesuai konteks Musa berbicara kepada Israel sebagai satu umat. Ungkapan “di dalam gerbang-gerbangmu” dialihkan secara idiomatis menjadi “yang tinggal di kota-kotamu” agar jelas tanpa kehilangan latar komunalnya.
