  to: Janganlah kamu makan bangkai apa pun.[a] Kamu boleh memberikannya kepada pendatang[b] yang tinggal di kota-kotamu, dan ia boleh memakannya, atau kamu boleh menjualnya kepada orang asing. Sebab, kamu adalah umat yang kudus bagi Yahweh, Allahmu. Janganlah kamu merebus anak kambing dalam susu induknya.
