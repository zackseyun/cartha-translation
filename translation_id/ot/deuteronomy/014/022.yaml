base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/022.yaml
  text: You shall surely tithe all the produce of your seed that comes out of the field[a], year by year.
translation:
  language: id
  text: Engkau harus benar-benar menyisihkan sepersepuluh dari seluruh hasil dari apa yang engkau taburkan, yang dihasilkan oleh ladang[a], tahun demi tahun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, secara lebih dinamis: “Setiap tahun, engkau harus menyisihkan sepersepuluh dari seluruh hasil ladangmu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַשֵּׂר תְּעַשֵּׂר
  choice: harus benar-benar menyisihkan sepersepuluh
  rationale: Gabungan infinitif absolut dan verba finit menegaskan perintah. Ungkapan ini mempertahankan daya wajib dan penekanannya, sedangkan “menyisihkan sepersepuluh” menyampaikan tindakan memberi persepuluhan tanpa menentukan penerimanya sebelum ayat berikutnya menjelaskannya.
- source_word: תְּבוּאַת
  choice: hasil
  rationale: Kata ini menunjuk pada hasil atau produksi pertanian secara luas. “Hasil” alami dalam bahasa Indonesia dan tidak membatasi maknanya pada jenis tanaman tertentu.
- source_word: זַרְעֶךָ
  choice: benihmu
  rationale: Terjemahan ini mempertahankan citra harfiah “benihmu”; dalam konteks pertanian, frasa lengkapnya menunjuk pada hasil dari apa yang ditabur.
- source_word: הַיֹּצֵא הַשָּׂדֶה
  choice: yang keluar dari ladang
  rationale: Pilihan ini mengikuti ungkapan Ibrani secara dekat dan tetap dapat dipahami, sambil mempertahankan gambaran hasil yang keluar dari ladang. Terjemahan lebih dinamis dicantumkan dalam catatan kaki.
- source_word: שָׁנָה שָׁנָה
  choice: tahun demi tahun
  rationale: Pengulangan kata Ibrani menyatakan keberulangan tahunan secara teratur; “tahun demi tahun” mempertahankan bentuk distributif dan penekanannya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “engkau” dipakai untuk sapaan tunggal sesuai bentuk Ibrani. Susunan utama cukup dekat dengan citra sumber, sedangkan catatan kaki menyediakan padanan yang lebih idiomatis.
