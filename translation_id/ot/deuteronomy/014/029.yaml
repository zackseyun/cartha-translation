revisions:
- from: Orang Lewi itu akan datang, sebab ia tidak mendapat bagian maupun milik pusaka bersamamu. Demikian juga pendatang[a], anak yatim, dan janda yang tinggal di kota-kotamu[b]. Mereka akan makan sampai kenyang, supaya Yahweh, Allahmu, memberkati engkau dalam segala pekerjaan tanganmu yang kaulakukan.
  to: Orang Lewi itu—karena ia tidak mempunyai bagian atau warisan bersamamu—dan pendatang[a], anak yatim, serta janda yang tinggal di kota-kotamu[b] akan datang dan makan sampai kenyang, supaya Yahweh, Allahmu, memberkatimu dalam segala pekerjaan yang kaulakukan dengan tanganmu.
  rationale: Revisi menyatukan semua kelompok yang disebut sebagai subjek dari tindakan jamak “akan datang dan makan sampai kenyang,” sehingga tidak ada fragmen kalimat dan urutan sumber tetap jelas. Istilah “bagian atau warisan” serta susunan akhir kalimat diperhalus untuk bahasa Indonesia modern tanpa mengubah makna, register, atau nuansa tujuan pada “supaya.”
