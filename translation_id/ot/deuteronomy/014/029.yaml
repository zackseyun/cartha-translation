  text: וּ/בָ֣א הַ/לֵּוִ֡י כִּ֣י אֵֽין ל/וֹ֩ חֵ֨לֶק וְ/נַחֲלָ֜ה עִמָּ֗/ךְ וְ֠/הַ/גֵּר וְ/הַ/יָּת֤וֹם וְ/הָֽ/אַלְמָנָה֙ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֔י/ךָ וְ/אָכְל֖וּ וְ/שָׂבֵ֑עוּ לְמַ֤עַן יְבָרֶכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָל מַעֲשֵׂ֥ה יָדְ/ךָ֖ אֲשֶׁ֥ר תַּעֲשֶֽׂה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/029.yaml
  text: And the Levite shall come[a], because he has no portion or inheritance with you, and the sojourner, the fatherless, and the widow who are within your gates, and they shall eat and be satisfied[b], so that Yahweh your God may bless you in all the work of your hands that you do.
translation:
  language: id
  text: Orang Lewi itu—karena ia tidak mempunyai bagian atau warisan bersamamu—dan pendatang[a], anak yatim, serta janda yang tinggal di kota-kotamu[b] akan datang dan makan sampai kenyang, supaya Yahweh, Allahmu, memberkatimu dalam segala pekerjaan yang kaulakukan dengan tanganmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang asing yang menetap”. Istilah Ibrani ini menunjuk orang bukan Israel yang tinggal di tengah masyarakat Israel.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “di dalam gerbang-gerbangmu”, sebuah ungkapan untuk orang yang tinggal di kota-kota atau komunitas setempat.
    reason: cultural_note
lexical_decisions:
- source_word: וּבָא הַלֵּוִי
  choice: Orang Lewi itu akan datang
  rationale: Bentuk verba dalam konteks ketetapan ini menyatakan tindakan yang diharapkan atau akan terjadi. “Orang Lewi” mempertahankan golongan yang disebut teks tanpa mempersempitnya menjadi imam.
- source_word: חֵלֶק וְנַחֲלָה
  choice: bagian maupun milik pusaka
  rationale: Kedua istilah mempertahankan nuansa bagian yang dialokasikan dan warisan tetap, khususnya tanah, tanpa meleburkannya menjadi satu konsep.
- source_word: הַגֵּר
  choice: pendatang
  rationale: Istilah ini menunjuk orang bukan pribumi yang menetap di tengah masyarakat Israel. “Pendatang” alami dalam bahasa Indonesia, sedangkan catatan kaki menjelaskan status menetapnya.
- source_word: הַיָּתוֹם
  choice: anak yatim
  rationale: Padanan Indonesia yang lazim untuk kategori sosial rentan yang dimaksud dalam rangkaian hukum ini.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: yang tinggal di kota-kotamu
  rationale: Secara harfiah ungkapan ini berarti “yang berada di dalam gerbang-gerbangmu”; gerbang berfungsi sebagai metonimia bagi kota atau komunitas setempat. Terjemahan utama menyampaikan maksud idiom secara alami.
- source_word: וְאָכְלוּ וְשָׂבֵעוּ
  choice: Mereka akan makan sampai kenyang
  rationale: Ungkapan ini menyatakan bahwa persediaan tersebut memungkinkan mereka makan hingga tercukupi. “Sampai kenyang” alami dan mempertahankan gagasan kecukupan.
- source_word: לְמַעַן יְבָרֶכְךָ
  choice: supaya ... memberkati engkau
  rationale: לְמַעַן menandai tujuan atau hasil yang dimaksud, bukan janji tanpa syarat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama pribadi sebagaimana terdapat dalam teks Ibrani, bukan diganti dengan gelar.
- source_word: בְּכָל מַעֲשֵׂה יָדְךָ אֲשֶׁר תַּעֲשֶׂה
  choice: dalam segala pekerjaan tanganmu yang kaulakukan
  rationale: “Pekerjaan tanganmu” mempertahankan ungkapan konkret sumber, dan klausa terakhir tetap diterjemahkan meskipun ada pengulangan yang disengaja.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Hubungan berkat dengan tindakan yang diperintahkan
  choice: supaya Yahweh ... memberkati engkau
  alternative: sehingga Yahweh ... akan memberkati engkau
  rationale: Bentuk dengan לְמַעַן menyatakan tujuan atau hasil yang diharapkan. Pilihan ini menghindari pengubahan ayat menjadi prediksi berkat yang mutlak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat dipecah agar pergantian dari verba tunggal yang mengacu pada orang Lewi ke tindakan jamak semua kelompok tetap jelas dan alami. Pronomina “engkau” mempertahankan sapaan perjanjian dalam bentuk tunggal.
