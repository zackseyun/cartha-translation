  yaml_path: translation/ot/deuteronomy/014/009.yaml
  text: 'You may eat this from all that are in the waters: everything that has fins and scales you may eat.'
translation:
  language: id
  text: 'Inilah yang boleh kamu makan dari segala yang ada di dalam air: semua yang bersirip dan bersisik boleh kamu makan.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִכֹּל אֲשֶׁר בַּמָּיִם
  choice: dari segala yang hidup di dalam air
  rationale: Secara harfiah frasa ini berarti 'dari semua yang di dalam air'. Penambahan implisit 'yang hidup' membuat rujukannya alami dan jelas dalam bahasa Indonesia tanpa mempersempit jenis makhluk yang dimaksud.
- source_word: סְנַפִּיר וְקַשְׂקֶשֶׂת
  choice: bersirip dan bersisik
  rationale: Bentuk adjektival ini alami dalam bahasa Indonesia dan mempertahankan kedua ciri yang disyaratkan secara bersamaan.
- source_word: תֹּאכְלוּ / תֹּאכֵלוּ
  choice: boleh kamu makan
  rationale: Dalam konteks hukum makanan, bentuk imperfek menyatakan apa yang diizinkan untuk dimakan, bukan perintah agar pembaca harus memakannya.
theological_decisions:
- issue: Daya ikat bentuk verbal dalam hukum makanan
  choice: boleh kamu makan
  alternative: harus kamu makan / kamu akan makan
  rationale: Konteks klasifikasi tahir dan tidak tahir menunjukkan izin, sehingga terjemahan tidak mengubah ketentuan ini menjadi kewajiban atau prediksi.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Urutan 'inilah yang boleh kamu makan' dipertahankan untuk mencerminkan penunjukan pembuka dalam bahasa Ibrani, sedangkan pengulangan penutup juga dipertahankan sebagai penegasan.
