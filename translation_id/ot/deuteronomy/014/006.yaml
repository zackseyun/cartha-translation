  text: You may eat any animal that has a split hoof[a], divided into two hoof-parts, and that chews the cud among the animals.
translation:
  language: id
  text: Kalian boleh memakan setiap hewan yang berkuku belah, yaitu yang kukunya terbagi menjadi dua, dan yang memamah biak.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Setiap hewan yang membelah kuku dan yang membelah belahan kukunya menjadi dua bagian, yang memamah biak di antara hewan-hewan—hewan itulah yang boleh kalian makan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל
  choice: setiap
  rationale: Dalam ketentuan izin ini, “setiap” menyampaikan cakupan distributif secara alami dan jelas dalam bahasa Indonesia.
- source_word: בְּהֵמָה
  choice: hewan
  rationale: Istilah ini menunjuk secara umum pada hewan darat dalam penggolongan makanan, sehingga “hewan” lebih tepat daripada istilah yang membatasinya pada ternak.
- source_word: מַפְרֶסֶת פַּרְסָה
  choice: berkuku belah
  rationale: Ungkapan ini merupakan padanan Indonesia yang ringkas dan lazim untuk ciri konkret berupa kuku yang terbelah.
- source_word: וְשֹׁסַעַת שֶׁסַע שְׁתֵּי פְרָסוֹת
  choice: yaitu yang kukunya terbagi menjadi dua
  rationale: Frasa ini mempertahankan penegasan Ibrani bahwa belahan itu menghasilkan dua bagian kuku, tanpa memakai susunan yang kaku.
- source_word: מַעֲלַת גֵּרָה
  choice: memamah biak
  rationale: Ini adalah istilah Indonesia yang baku dan mudah dipahami untuk tindakan menaikkan kembali makanan guna dikunyah.
- source_word: בַּבְּהֵמָה
  choice: tidak diterjemahkan secara tersendiri
  rationale: Keterangan “di antara hewan-hewan” bersifat redundan dalam bahasa Indonesia karena kelas hewan sudah dinyatakan pada awal kalimat; cakupannya tetap terpelihara.
- source_word: אֹתָהּ תֹּאכֵלוּ
  choice: Kalian boleh memakan
  rationale: Dalam konteks hukum makanan, bentuk ini menyatakan izin, bukan perintah untuk memakannya. “Kalian” mencerminkan sapaan jamak Ibrani, sedangkan objek tunggalnya terwakili oleh “setiap hewan”.
