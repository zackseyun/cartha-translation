  text: כִּ֣י עַ֤ם קָדוֹשׁ֙ אַתָּ֔ה לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ וּ/בְ/ךָ֞ בָּחַ֣ר יְהוָ֗ה לִֽ/הְי֥וֹת ל/וֹ֙ לְ/עַ֣ם סְגֻלָּ֔ה מִ/כֹּל֙ הָֽ/עַמִּ֔ים אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/002.yaml
  text: For you are a holy people to Yahweh your God[a], and Yahweh has chosen you to be a treasured people for himself out of all the peoples who are on the face of the earth.
translation:
  language: id
  text: Sebab engkau adalah umat yang kudus bagi Yahweh, Allahmu, dan Yahweh telah memilih engkau untuk menjadi umat kesayangan-Nya[a] dari antara segala bangsa yang ada di muka bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “umat yang menjadi milik-Nya yang berharga.” Kata Ibrani סְגֻלָּה menunjuk pada milik yang dinilai sangat berharga.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi larangan sebelumnya dan mempertahankan hubungan penjelas dalam konteks.
- source_word: עַם קָדוֹשׁ
  choice: umat yang kudus
  rationale: Ungkapan ini menggambarkan komunitas perjanjian yang dikhususkan bagi Allah; bentuk ini alami dan jelas dalam bahasa Indonesia.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: bagi Yahweh, Allahmu
  rationale: Preposisi ל menyatakan hubungan atau kepunyaan; “bagi” mempertahankan nuansa bahwa umat itu dikhususkan bagi Yahweh.
- source_word: וּבְךָ בָּחַר יְהוָה
  choice: dan Yahweh telah memilih engkau
  rationale: Dengan בחר, preposisi ב menandai orang yang dipilih. Bentuk “telah memilih” menyatakan tindakan yang sudah dilakukan dan tetap bermakna dalam hubungan perjanjian.
- source_word: לִהְיוֹת לוֹ
  choice: untuk menjadi ...-Nya
  rationale: Infinitif ini menyatakan tujuan atau hasil pemilihan, sedangkan akhiran posesif mengungkapkan bahwa umat tersebut menjadi milik-Nya.
- source_word: לְעַם סְגֻלָּה
  choice: umat kesayangan-Nya
  rationale: סְגֻלָּה menunjuk pada milik yang dinilai sangat berharga. “Umat kesayangan-Nya” mempertahankan kata עַם sekaligus menyampaikan nilai khusus dan hubungan kepunyaan.
- source_word: מִכֹּל הָעַמִּים
  choice: dari antara segala bangsa
  rationale: Preposisi מן di sini menunjukkan pemilihan dari suatu kelompok, bukan dengan sendirinya perbandingan tingkat atau keunggulan.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: yang ada di muka bumi
  rationale: Ini merupakan ungkapan Ibrani lazim bagi bangsa-bangsa yang mendiami bumi; “bumi” lebih tepat daripada “tanah” dalam cakupan ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama perjanjian dan dialihaksarakan dalam bentuk yang lazim.
theological_decisions:
- issue: Makna pemilihan Israel
  choice: Menyatakan pemilihan untuk menjadi milik Yahweh dan umat yang sangat dihargai-Nya, tanpa menambahkan gagasan keunggulan etnis.
  alternative: Menerjemahkan מִכֹּל sebagai “melebihi segala bangsa” atau memperluasnya menurut sistem teologis tertentu.
  rationale: Teks Ibrani menyatakan bahwa Yahweh memilih Israel dari antara segala bangsa untuk menjadi umat kesayangan-Nya. Terjemahan mempertahankan pilihan ilahi dan kepunyaan perjanjian tanpa melampaui pernyataan ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Kata ganti tunggal “engkau” mempertahankan sapaan kolektif tunggal dalam teks Ibrani; “umat” dan “bangsa” membedakan komunitas perjanjian dari bangsa-bangsa lain.
