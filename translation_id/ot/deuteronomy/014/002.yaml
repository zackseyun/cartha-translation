  terminology: “Yahweh,” “Allahmu,” “umat yang kudus,” dan “umat kesayangan-Nya” digunakan secara konsisten dan sesuai register. Catatan kaki secara memadai menjelaskan bahwa סְגֻלָּה menunjuk pada milik yang sangat berharga serta menyediakan alternatif yang lebih eksplisit mengenai kepunyaan.
