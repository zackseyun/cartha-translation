  source_fidelity: Terjemahan secara akurat menyampaikan alasan (כִּי), status Israel sebagai umat kudus bagi Yahweh, tindakan pemilihan ilahi, tujuan menjadi umat yang khusus bagi-Nya, serta cakupan “dari antara segala bangsa ... di muka bumi.” Frasa “dari antara” tepat mempertahankan makna seleksi מן tanpa menambahkan gagasan keunggulan komparatif.
