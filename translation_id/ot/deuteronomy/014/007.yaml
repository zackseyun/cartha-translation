  text: אַ֣ךְ אֶת זֶ֞ה לֹ֤א תֹֽאכְלוּ֙ מִ/מַּֽעֲלֵ֣י הַ/גֵּרָ֔ה וּ/מִ/מַּפְרִיסֵ֥י הַ/פַּרְסָ֖ה הַ/שְּׁסוּעָ֑ה אֶֽת הַ֠/גָּמָל וְ/אֶת הָ/אַרְנֶ֨בֶת וְ/אֶת הַ/שָּׁפָ֜ן כִּֽי מַעֲלֵ֧ה גֵרָ֣ה הֵ֗מָּה וּ/פַרְסָה֙ לֹ֣א הִפְרִ֔יסוּ טְמֵאִ֥ים הֵ֖ם לָ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/007.yaml
  text: 'However[a], these you shall not eat from among those that chew the cud or from among those that have a divided hoof: the camel, the hare, and the rock badger; because they chew the cud but do not divide the hoof[b]. They are unclean for you.'
translation:
  language: id
  text: 'Namun, dari antara hewan yang memamah biak atau yang berkuku belah, berikut ini tidak boleh kamu makan: unta, terwelu[a], dan hiraks batu[b]. Semuanya memamah biak, tetapi tidak berkuku belah. Hewan-hewan itu najis bagimu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani ini kemungkinan besar menunjuk pada terwelu, meskipun identifikasi tepatnya masih diperdebatkan; dapat juga diterjemahkan “kelinci.”
    reason: lexical_alternative
  - marker: b
    text: Hewan ini kadang disebut “kelinci batu.” Istilah tradisional “pelanduk” kurang tepat secara zoologis.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Namun
  rationale: Menandai pembatasan atau pengecualian terhadap ketentuan pada ayat sebelumnya dengan ungkapan Indonesia yang wajar.
- source_word: מִמַּעֲלֵי הַגֵּרָה
  choice: dari antara hewan yang memamah biak
  rationale: Ungkapan baku dan mudah dipahami untuk perilaku hewan yang digambarkan oleh idiom Ibrani ini.
- source_word: וּמִמַּפְרִיסֵי הַפַּרְסָה הַשְּׁסוּעָה
  choice: atau berkuku belah
  rationale: Dalam susunan bahasa Indonesia, 'atau' menjelaskan dua kelompok hewan yang menjadi cakupan pengecualian, sedangkan 'berkuku belah' menyampaikan gambaran kuku yang terbelah secara ringkas dan alami.
- source_word: הַגָּמָל
  choice: unta
  rationale: Padanan langsung dan baku.
- source_word: הָאַרְנֶבֶת
  choice: terwelu
  rationale: Merupakan identifikasi zoologis yang paling mungkin dan membedakannya dari kelinci, sambil mengakui ketidakpastian melalui catatan kaki.
- source_word: הַשָּׁפָן
  choice: hiraks batu
  rationale: Mengacu pada mamalia kecil penghuni daerah berbatu yang lazim diidentifikasi sebagai hyrax; padanan ini lebih tepat secara zoologis daripada 'pelanduk'.
- source_word: כִּי מַעֲלֵה גֵרָה הֵמָּה
  choice: Semuanya memamah biak
  rationale: Mempertahankan penggolongan yang dinyatakan teks tanpa menambahkan penjelasan zoologis modern.
- source_word: וּפַרְסָה לֹא הִפְרִיסוּ
  choice: tetapi tidak berkuku belah
  rationale: Menyatakan kontras dan mempertahankan istilah yang sama dengan klausa sebelumnya.
- source_word: טְמֵאִים הֵם לָכֶם
  choice: Hewan-hewan itu najis bagimu
  rationale: '''Najis'' adalah padanan Alkitabiah yang mapan dalam konteks hukum makanan; ''bagimu'' mempertahankan orientasi hukum-perjanjian dari teks.'
theological_decisions:
- issue: Sifat kenajisan dalam hukum makanan
  choice: najis
  alternative: najis secara ritual; najis secara seremonial
  rationale: Teks Ibrani memakai istilah umum טָמֵא. Terjemahan utama tidak mempersempit maknanya dengan tambahan penafsiran seperti 'ritual' atau 'seremonial'.
- issue: Penggolongan hewan sebagai pemamah biak
  choice: mempertahankan pernyataan teks
  alternative: menjelaskannya ulang menurut klasifikasi zoologi modern
  rationale: Terjemahan menyampaikan cara teks menggambarkan hewan-hewan tersebut tanpa menyelaraskan atau mempertentangkannya secara eksplisit dengan ilmu hewan modern.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk tunggal 'kamu' dipakai sesuai sapaan hukum Ibrani kepada Israel sebagai satu umat. Struktur kalimat ditata ulang secukupnya agar hubungan antara dua ciri hewan dan daftar pengecualiannya jelas, tanpa mengubah isi hukumnya.
