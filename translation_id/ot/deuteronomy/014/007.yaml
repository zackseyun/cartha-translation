  source_fidelity: 'Terjemahan pada dasarnya setia pada teks Ibrani: אַךְ diberi nuansa pembatasan melalui “Namun”; kedua kelompok hewan, daftar unta–terwelu–hiraks, alasan bahwa mereka memamah biak tetapi tidak memiliki kuku belah, serta status טְמֵאִים diterjemahkan tanpa penambahan penafsiran. “Najis bagimu” mempertahankan istilah hukum-keagamaan Ibrani tanpa mempersempitnya menjadi “ritual” atau “seremonial.”'
