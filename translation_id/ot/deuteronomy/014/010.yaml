  text: וְ/כֹ֨ל אֲשֶׁ֧ר אֵֽין ל֛/וֹ סְנַפִּ֥יר וְ/קַשְׂקֶ֖שֶׂת לֹ֣א תֹאכֵ֑לוּ טָמֵ֥א ה֖וּא לָ/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/010.yaml
  text: But anything that does not have fins and scales, you shall not eat; it is unclean for you.
translation:
  language: id
  text: Namun, segala yang tidak bersirip dan bersisik tidak boleh kamu makan; itu najis bagimu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כֹל
  choice: Namun, segala yang
  rationale: כֹל menyatakan cakupan menyeluruh, sedangkan וְ dalam konteks ini menandai pertentangan dengan izin pada ayat sebelumnya. 'Namun, segala yang' alami dalam bahasa Indonesia dan mempertahankan daya cakup tersebut.
- source_word: אֲשֶׁר אֵין לוֹ
  choice: yang tidak
  rationale: Konstruksi relatif אֲשֶׁר dengan אֵין dan sufiks menyatakan ketiadaan kepemilikan atau ciri. Karena objeknya berupa ciri tubuh, 'yang tidak bersirip dan bersisik' lebih alami daripada 'yang tidak memiliki...'.
- source_word: סְנַפִּיר
  choice: bersirip
  rationale: Nomina ini menunjuk pada sirip ikan. Bentuk 'bersirip' merupakan ungkapan klasifikatif yang ringkas dan lazim dalam bahasa Indonesia.
- source_word: וְ/קַשְׂקֶשֶׂת
  choice: dan bersisik
  rationale: Nomina ini menunjuk pada sisik ikan. 'Bersisik' sejajar secara alami dengan 'bersirip' dan menyampaikan ciri yang dimaksud.
- source_word: לֹא תֹאכֵלוּ
  choice: tidak boleh kamu makan
  rationale: Bentuk orang kedua jamak dengan negasi dalam konteks hukum menyatakan larangan. 'Tidak boleh kamu makan' mempertahankan nada hukum dengan bahasa Indonesia modern; 'kamu' dipahami sebagai sapaan kolektif kepada Israel.
- source_word: טָמֵא
  choice: najis
  rationale: Dalam konteks aturan kemurnian ritual, 'najis' adalah istilah Indonesia yang mapan dan membedakan kategori ritual dari sekadar kotor secara jasmani.
- source_word: הוּא לָכֶם
  choice: itu najis bagimu
  rationale: Pronomina dan לָכֶם menyatakan status makhluk tersebut dalam hubungannya dengan umat Israel. 'Itu najis bagimu' mempertahankan daya relasional itu secara alami.
theological_decisions:
- issue: Makna טָמֵא sebagai kategori hukum ritual
  choice: najis
  alternative: tidak tahir
  rationale: Konteks menetapkan status menurut hukum makanan bagi Israel, bukan menyatakan bahwa makhluk itu kotor secara fisik atau jahat pada dirinya. 'Najis' mempertahankan kategori ritual tanpa menambahkan penafsiran denominasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan kontras, cakupan menyeluruh, larangan hukum, dan status ritual dari teks Ibrani. Tidak diperlukan catatan kaki.
