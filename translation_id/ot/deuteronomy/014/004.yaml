translation:
  language: id
  text: Inilah hewan-hewan yang boleh kalian makan:[a] sapi, domba, dan kambing.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah dalam bahasa Ibrani, “Inilah hewan yang boleh kalian makan.” Bentuk tunggal dipakai secara kolektif untuk memperkenalkan kategori sebelum jenis-jenisnya disebutkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַבְּהֵמָה
  choice: Inilah hewan-hewan
  rationale: Bentuk Ibrani secara harfiah tunggal, ‘inilah hewan itu’, tetapi nomina tunggal tersebut berfungsi secara kolektif untuk membuka daftar jenis hewan. Bentuk jamak menghasilkan bahasa Indonesia yang alami; bentuk sumber dijelaskan dalam catatan kaki.
- source_word: אֲשֶׁר תֹּאכֵלוּ
  choice: yang boleh kalian makan
  rationale: Klausa ini menyatakan hewan yang diizinkan untuk dimakan, bukan perintah untuk memakannya. ‘Kalian’ mencerminkan bentuk orang kedua jamak dalam bahasa Ibrani.
- source_word: שׁוֹר
  choice: sapi
  rationale: Kata ini menunjuk pada hewan jenis sapi. ‘Sapi’ merupakan istilah kategori yang alami dalam bahasa Indonesia dan tidak membatasi makna pada jenis kelamin tertentu seperti ‘sapi jantan’.
- source_word: שֵׂה כְשָׂבִים
  choice: domba
  rationale: שֵׂה adalah seekor ternak kecil dari kawanan, lalu כְשָׂבִים menentukan bahwa yang dimaksud ialah jenis domba. ‘Domba’ mempertahankan kategori tanpa membatasi umur seperti ‘anak domba’.
- source_word: וְשֵׂה עִזִּים
  choice: dan kambing
  rationale: Ungkapan yang sejajar ini menentukan ternak kecil tersebut sebagai jenis kambing. ‘Kambing’ adalah padanan kategori yang alami dan tidak membatasi umur.
