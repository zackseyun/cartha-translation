  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak perempuan ya'anah”, sebuah ungkapan Ibrani yang dipakai sebagai nama jenis burung unta.
    reason: cultural_note
  - marker: b
    text: Identifikasi beberapa burung dalam ayat ini tidak pasti. Kata yang diterjemahkan “elang” juga dapat menunjuk pada burung hantu atau burung lain; “camar” pernah juga diterjemahkan “burung kukuk”; dan “alap-alap” juga dapat diterjemahkan “elang”.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּת הַיַּעֲנָה
  choice: burung unta
  rationale: Ungkapan Ibrani ini secara harfiah berarti “anak perempuan ya'anah”, tetapi dalam daftar hewan berfungsi sebagai nama jenis burung; “burung unta” merupakan padanan modern yang paling mungkin.
- source_word: הַתַּחְמָס
  choice: elang
  rationale: Identifikasi jenis burung ini tidak pasti. “Elang” dipilih sebagai nama umum burung pemangsa, sementara ketidakpastian dan kemungkinan lain dipertahankan dalam catatan kaki.
- source_word: הַשָּׁחַף
  choice: camar
  rationale: Istilah ini sulit diidentifikasi secara pasti, tetapi bukti leksikal modern umumnya mengaitkannya dengan burung camar atau burung laut sejenis.
- source_word: הַנֵּץ
  choice: alap-alap
  rationale: Kata ini menunjuk pada burung pemangsa dan dapat diterjemahkan “elang” atau “alap-alap”. “Alap-alap” dipilih untuk membedakannya dari תַּחְמָס dalam ayat yang sama.
- source_word: לְמִינֵהוּ
  choice: menurut jenisnya
  rationale: Ini adalah rumus klasifikasi Ibrani yang mencakup hewan tersebut beserta berbagai jenis yang berkerabat dengannya; padanan ini alami dan tetap dekat dengan bentuk sumber.
