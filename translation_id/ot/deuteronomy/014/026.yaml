source:
  edition: WLC
  text: וְ/נָתַתָּ֣ה הַ/כֶּ֡סֶף בְּ/כֹל֩ אֲשֶׁר תְּאַוֶּ֨ה נַפְשְׁ/ךָ֜ בַּ/בָּקָ֣ר וּ/בַ/צֹּ֗אן וּ/בַ/יַּ֨יִן֙ וּ/בַ/שֵּׁכָ֔ר וּ/בְ/כֹ֛ל אֲשֶׁ֥ר תִּֽשְׁאָלְ/ךָ֖ נַפְשֶׁ֑/ךָ וְ/אָכַ֣לְתָּ שָּׁ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/שָׂמַחְתָּ֖ אַתָּ֥ה וּ/בֵיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/026.yaml
  text: 'and spend the silver on whatever your appetite desires: cattle[a], sheep, wine, strong drink, or whatever your appetite asks for. And you shall eat there before Yahweh your God and rejoice[c][b], you and your household.'
translation:
  language: id
  text: Belanjakanlah uang itu[a] untuk apa saja yang diinginkan hatimu[b]—ternak sapi, kambing domba, anggur, minuman memabukkan[c], atau apa pun yang diminta hatimu. Makanlah di sana di hadapan Yahweh, Allahmu, dan bersukacitalah, kamu beserta seisi rumahmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “perak itu”; maksudnya uang.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “jiwamu”. Di sini kata itu menunjuk pada diri seseorang beserta keinginan atau seleranya.'
    reason: lexical_alternative
  - marker: c
    text: Minuman beralkohol yang dibedakan dari anggur; jenisnya tidak disebutkan secara khusus.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתָּה הַכֶּסֶף
  choice: Belanjakanlah uang itu
  rationale: Secara harfiah berarti ‘berikanlah perak itu’, tetapi dalam konteks pembelian bekal perayaan, ungkapan ini secara idiomatis berarti membelanjakan uang.
- source_word: תְּאַוֶּה נַפְשְׁךָ ... תִּשְׁאָלְךָ נַפְשֶׁךָ
  choice: yang diinginkan hatimu ... yang diminta hatimu
  rationale: נֶפֶשׁ di sini menunjuk pada diri beserta hasrat atau seleranya. ‘Hatimu’ mempertahankan ungkapan antropologis secara wajar dalam bahasa Indonesia tanpa menyiratkan doktrin tentang jiwa yang terpisah dari tubuh.
- source_word: בַּבָּקָר וּבַצֹּאן
  choice: ternak sapi, kambing domba
  rationale: בָּקָר adalah kelompok ternak bovina, sedangkan צֹאן mencakup ternak kecil, terutama domba dan kambing. Terjemahan ini mempertahankan keluasan kedua istilah.
- source_word: וּבַיַּיִן וּבַשֵּׁכָר
  choice: anggur, minuman memabukkan
  rationale: יַיִן berarti anggur, sedangkan שֵׁכָר adalah minuman beralkohol yang dibedakan dari anggur. ‘Minuman memabukkan’ tidak membatasi istilah itu pada minuman sulingan modern.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: di hadapan Yahweh, Allahmu
  rationale: ‘Di hadapan’ menerjemahkan ungkapan kehadiran לִפְנֵי, dan nama perjanjian יְהוָה ditransliterasikan sebagai ‘Yahweh’.
- source_word: וְשָׂמַחְתָּ אַתָּה וּבֵיתֶךָ
  choice: dan bersukacitalah, kamu beserta seisi rumahmu
  rationale: Bentuk ini mempertahankan nada perintah perayaan dan memakai ‘seisi rumahmu’ untuk rumah tangga atau keluarga yang dimaksud oleh בֵּיתֶךָ.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi secara langsung; transliterasi mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Penyebutan minuman beralkohol
  choice: anggur, minuman memabukkan
  alternative: anggur, minuman keras
  rationale: Teks dengan jelas menyebut anggur dan satu jenis minuman memabukkan lainnya. Terjemahan tidak mengaburkan rujukan tersebut, tetapi juga tidak memberi kesan khusus tentang minuman sulingan modern.
- issue: Makna נֶפֶשׁ dalam konteks keinginan makan dan minum
  choice: hatimu
  alternative: jiwamu
  rationale: Dalam konteks ini נֶפֶשׁ menyatakan diri yang berkeinginan atau berselera, bukan pernyataan metafisis mengenai jiwa. Catatan kaki mempertahankan bentuk harfiahnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan bentuk perintah yang jelas. ‘Hatimu’ dipilih agar ungkapan hasrat terdengar alami, sedangkan catatan kaki menjaga bentuk Ibrani yang lebih harfiah. ‘Kambing domba’ dipakai untuk istilah kolektif yang mencakup kedua jenis ternak kecil.
