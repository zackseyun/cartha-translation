  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Jenis-jenis burung yang dimaksud oleh nama-nama Ibrani ini tidak dapat dipastikan. Terjemahan tradisional dan modern berbeda-beda, tetapi sering menerjemahkannya sebagai berbagai jenis burung hantu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כּוֹס
  choice: burung hantu kecil
  rationale: Dalam daftar burung yang haram, istilah ini tampaknya menunjuk pada sejenis burung hantu. Terjemahan ini membedakannya dari dua nama berikut tanpa menyatakan kepastian spesies.
- source_word: יַנְשׁוּף
  choice: burung hantu besar
  rationale: Istilah ini secara tradisional dipahami sebagai burung malam, kemungkinan sejenis burung hantu. Pilihan ini mempertahankan pembedaan dalam daftar, meskipun identifikasi zoologisnya tidak pasti.
- source_word: תִּנְשָׁמֶת
  choice: burung hantu putih
  rationale: Dalam konteks daftar unggas ini, kata tersebut kemungkinan menunjuk pada sejenis burung hantu, walaupun bentuk Ibrani yang sama dapat merujuk pada makhluk lain dalam konteks lain. Terjemahan tradisional ini membedakannya dari dua istilah sebelumnya.
- source_word: אֶת
  choice: '[tidak diterjemahkan]'
  rationale: Penanda objek langsung dalam bahasa Ibrani yang tidak mempunyai padanan tersendiri dalam bahasa Indonesia.
- source_word: וְ
  choice: dan
  rationale: Kata penghubung baku yang mengaitkan unsur-unsur dalam daftar.
- source_word: הַ
  choice: '[tidak diterjemahkan secara tersendiri]'
  rationale: Kata sandang tentu Ibrani menandai setiap jenis burung dalam daftar; bahasa Indonesia tidak memerlukan padanan tersendiri di sini.
