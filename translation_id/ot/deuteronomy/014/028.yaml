id: DEU.14.28
reference: Deuteronomy 14:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִ/קְצֵ֣ה שָׁלֹ֣שׁ שָׁנִ֗ים תּוֹצִיא֙ אֶת כָּל מַעְשַׂר֙ תְּבוּאָ֣תְ/ךָ֔ בַּ/שָּׁנָ֖ה הַ/הִ֑וא וְ/הִנַּחְתָּ֖ בִּ/שְׁעָרֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/028.yaml
  text: At the end of every three years[b][a], you shall bring out all the tithe of your produce in that year and lay it up within your gates.
translation:
  language: id
  text: Pada akhir setiap tiga tahun[a], haruslah engkau mengeluarkan seluruh persepuluhan dari hasil tanahmu pada tahun itu dan menyimpannya di kota-kotamu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pada setiap tahun ketiga.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “di dalam gerbang-gerbangmu,” yaitu di kota atau permukiman setempat dalam wilayahmu.'
    reason: cultural_note
lexical_decisions:
- source_word: מִקְצֵה
  choice: Pada akhir
  rationale: Ungkapan ini menunjuk pada titik waktu ketika suatu masa berakhir; “pada akhir” mempertahankan bentuk temporal bahasa Ibrani secara wajar.
- source_word: שָׁלֹשׁ שָׁנִים
  choice: setiap tiga tahun
  rationale: Dalam konteksnya, ketentuan ini berlaku secara berulang dalam siklus tiga tahunan. Alternatif “setiap tahun ketiga” tetap dicatat karena juga mungkin.
- source_word: תּוֹצִיא
  choice: haruslah engkau mengeluarkan
  rationale: Bentuk kausatif dari יצא secara konkret berarti membuat keluar atau mengeluarkan, yakni membawa persepuluhan keluar untuk tujuan yang ditetapkan.
- source_word: כָּל מַעְשַׂר
  choice: seluruh persepuluhan
  rationale: כָּל menegaskan keseluruhan bagian sepersepuluh yang diwajibkan; “seluruh persepuluhan” alami dan menyeluruh dalam bahasa Indonesia.
- source_word: תְּבוּאָתְךָ
  choice: hasil tanahmu
  rationale: תְּבוּאָה merujuk pada hasil atau produksi pertanian. “Hasil tanah” mencakup panen tanpa membatasinya hanya pada biji-bijian.
- source_word: בַּשָּׁנָה הַהִוא
  choice: pada tahun itu
  rationale: Frasa ini menentukan tahun yang bersangkutan dan mempertahankan hubungan temporal yang lugas.
- source_word: וְהִנַּחְתָּ
  choice: dan menyimpannya
  rationale: Dalam konteks penempatan persepuluhan untuk keperluan setempat, נוח kausatif menyatakan menaruh atau menempatkan; “menyimpan” menyampaikan tindakan itu secara alami.
- source_word: בִּשְׁעָרֶיךָ
  choice: di kota-kotamu
  rationale: Secara harfiah berarti “di dalam gerbang-gerbangmu,” tetapi gerbang di sini merupakan ungkapan bagi kota atau permukiman setempat yang berada dalam wilayah seseorang. Makna idiomatis digunakan dalam teks, sedangkan gambaran harfiahnya dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Bentuk “engkau” mempertahankan sapaan orang kedua tunggal dalam teks Ibrani, sementara “haruslah” menyampaikan daya perintah. Idiom gerbang dialihkan menjadi “kota-kotamu” demi kejelasan, dengan bentuk harfiah dipertahankan dalam catatan kaki.
