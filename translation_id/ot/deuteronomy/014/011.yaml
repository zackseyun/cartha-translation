lexical_decisions:
- source_word: כָּל
  choice: segala jenis
  rationale: Kuantor ini mencakup seluruh kategori. Dalam bahasa Indonesia, “segala jenis” secara alami menyampaikan izin tanpa pembatasan bagi burung yang termasuk golongan tahir.
- source_word: צִפּוֹר
  choice: burung
  rationale: Dalam konteks ketentuan makanan ini, kata tersebut secara wajar menunjuk kepada burung.
- source_word: טְהֹרָה
  choice: yang tahir
  rationale: “Tahir” mempertahankan makna kategori ritual/legal dalam hukum makanan, bukan sekadar bersih secara jasmani.
- source_word: תֹּאכֵלוּ
  choice: kalian boleh makan
  rationale: Bentuk orang kedua jamak ini berfungsi menyatakan izin dalam rangkaian ketentuan makanan. “Kalian” membuat bentuk jamaknya jelas, sedangkan “boleh makan” menyampaikan daya permisifnya.
theological_decisions:
- issue: Makna kategori טָהוֹר dalam hukum makanan
  choice: tahir
  alternative: bersih; murni
  rationale: “Tahir” paling tepat menjaga pembedaan ritual/legal yang dimaksud tanpa mengubahnya menjadi kebersihan fisik atau kemurnian abstrak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. “Kalian” dipakai untuk menyatakan orang kedua jamak dalam teks Ibrani; “tahir” mempertahankan istilah hukum-ritual yang lazim dalam konteks Alkitab.
