  yaml_path: translation/ot/deuteronomy/014/013.yaml
  text: the glede[a], and the falcon, and the kite according to its kind,
translation:
  language: id
  text: elang merah[a], alap-alap, dan elang menurut jenisnya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Identifikasi tepat ketiga burung ini tidak pasti. Terjemahan tradisional dan modern beragam, antara lain “elang merah”, “elang”, dan “alap-alap”.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָאָה
  choice: elang merah
  rationale: Nama burung ini tidak dapat dipastikan. “Elang merah” merupakan padanan modern yang mungkin bagi sejenis burung pemangsa dalam kelompok kite, sementara ketidakpastiannya dinyatakan dalam catatan kaki.
- source_word: הָאַיָּה
  choice: alap-alap
  rationale: Istilah ini menunjuk pada burung pemangsa dan sering dipahami sebagai falcon. “Alap-alap” adalah sebutan Indonesia yang alami dan membedakannya dari kedua istilah di sekitarnya.
- source_word: הַדַּיָּה
  choice: elang
  rationale: Nama ini lazim dipahami sebagai sejenis kite. “Elang” dipilih sebagai padanan Indonesia yang mudah dimengerti, dengan catatan bahwa identifikasi zoologisnya tidak pasti.
- source_word: לְמִינָהּ
  choice: menurut jenisnya
  rationale: Ungkapan formulaik ini menyatakan pengelompokan menurut jenis dan mempertahankan bentuk tunggal feminin dari teks Ibrani.
- source_word: וְ / וְאֶת
  choice: dan
  rationale: Kata sambung Ibrani menghubungkan unsur-unsur dalam daftar; penanda objek אֶת tidak memerlukan padanan tersendiri dalam bahasa Indonesia.
