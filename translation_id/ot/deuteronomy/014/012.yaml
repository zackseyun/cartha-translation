id: DEU.14.12
reference: Deuteronomy 14:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/זֶ֕ה אֲשֶׁ֥ר לֹֽא תֹאכְל֖וּ מֵ/הֶ֑ם הַ/נֶּ֥שֶׁר וְ/הַ/פֶּ֖רֶס וְ/הָֽ/עָזְנִיָּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/012.yaml
  text: 'And these are the ones that you shall not eat from among them: the eagle[a], the bearded vulture, and the black vulture.'
translation:
  language: id
  text: 'Inilah yang tidak boleh kamu makan dari antara burung-burung itu: burung nasar[a], hering berjanggut, dan hering hitam.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Identifikasi nama-nama burung dalam bahasa Ibrani pada ayat ini tidak pasti. “Burung nasar” mungkin menunjuk kepada rajawali atau burung bangkai besar; “hering berjanggut” secara tradisional disebut burung pemecah tulang; dan “hering hitam” oleh sebagian penerjemah dipahami sebagai elang ikan atau elang laut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֶה
  choice: Inilah
  rationale: Bentuk Ibrani secara harfiah berarti “dan inilah/ini,” tetapi berfungsi memperkenalkan daftar. “Inilah” alami dalam bahasa Indonesia dan tidak perlu dibuat jamak.
- source_word: אֲשֶׁר לֹא תֹאכְלוּ מֵהֶם
  choice: yang tidak boleh kamu makan dari antara burung-burung itu
  rationale: Mempertahankan larangan langsung serta nuansa partitif מִן, sambil menyatakan acuan implisitnya kepada burung-burung dalam konteks agar jelas dalam bahasa Indonesia.
- source_word: הַנֶּשֶׁר
  choice: burung nasar
  rationale: נֶשֶׁר dapat menunjuk burung pemangsa besar, mungkin rajawali atau jenis burung bangkai besar. “Burung nasar” dipilih karena sesuai dengan kemungkinan zoologis dalam konteks ini, sementara ketidakpastiannya dicatat.
- source_word: הַפֶּרֶס
  choice: hering berjanggut
  rationale: Istilah ini umumnya dihubungkan dengan bearded vulture (Gypaetus barbatus), burung pemakan bangkai yang juga dikenal karena memecahkan tulang; nama Indonesia modern ini lebih jelas daripada istilah arkais.
- source_word: הָעָזְנִיָּה
  choice: hering hitam
  rationale: Identifikasi spesiesnya tidak pasti. “Hering hitam” mewakili salah satu identifikasi ilmiah modern, tanpa menyembunyikan alternatif yang dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Kata ganti “kamu” mempertahankan sapaan orang kedua jamak Ibrani secara kolektif kepada Israel; bentuk bahasa Indonesia tidak menandai jumlah. Nama burung dibuat mudah dipahami sejauh mungkin, dengan ketidakpastian zoologis asli dipertahankan melalui catatan kaki.
