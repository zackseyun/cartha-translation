    text: Dapat juga diterjemahkan, “agar nama-Nya berdiam di sana” atau “untuk menempatkan nama-Nya di sana.” Bahasa Ibrani mempertahankan ungkapan tentang Yahweh yang menempatkan nama-Nya di tempat kudus pilihan-Nya.
    reason: lexical_alternative
