reference: Deuteronomy 14:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אָכַלְתָּ֞ לִ/פְנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ בַּ/מָּק֣וֹם אֲשֶׁר יִבְחַר֮ לְ/שַׁכֵּ֣ן שְׁמ֣/וֹ שָׁם֒ מַעְשַׂ֤ר דְּגָֽנְ/ךָ֙ תִּֽירֹשְׁ/ךָ֣ וְ/יִצְהָרֶ֔/ךָ וּ/בְכֹרֹ֥ת בְּקָרְ/ךָ֖ וְ/צֹאנֶ֑/ךָ לְמַ֣עַן תִּלְמַ֗ד לְ/יִרְאָ֛ה אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ כָּל הַ/יָּמִֽים׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/014/023.yaml
  text: And you shall eat before Yahweh your God[a], in the place that he will choose for his name to dwell there, the tithe of your grain, your new wine, and your oil, and the firstborn of your herd and your flock, so that you may learn to fear Yahweh your God all your days.
translation:
  language: id
  text: Engkau harus memakan di hadapan Yahweh, Allahmu, di tempat yang akan dipilih-Nya untuk membuat nama-Nya berdiam di sana,[a] persepuluhan dari hasil biji-bijianmu, anggur barumu, dan minyakmu, serta anak-anak sulung dari ternak sapimu dan kambing dombamu, supaya engkau belajar takut akan Yahweh, Allahmu, seumur hidupmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “agar nama-Nya berdiam di sana” atau “untuk menempatkan nama-Nya di sana.” Bahasa Ibrani mempertahankan ungkapan tentang Yahweh yang menempatkan nama-Nya di tempat kudus pilihan-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: engkau harus memakan
  rationale: Bentuk perfek dengan waw dalam konteks hukum menyampaikan arahan yang mengikat; 'harus memakan' alami dalam bahasa Indonesia dan mempertahankan daya perintahnya.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: di hadapan Yahweh, Allahmu
  rationale: Mempertahankan makna harfiah 'di hadapan/dalam kehadiran' dan memakai nama ilahi sebagai nama diri.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר
  choice: di tempat yang akan dipilih-Nya
  rationale: Mencerminkan rumusan khas Ulangan yang berorientasi ke depan; sufiks kehormatan Indonesia memperjelas bahwa pemilihnya adalah Allah.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: untuk membuat nama-Nya berdiam di sana
  rationale: Menampilkan nilai kausatif Hifil sekaligus mempertahankan gambaran Ibrani tentang nama Allah yang berdiam di tempat pilihan-Nya.
- source_word: מַעְשַׂר דְּגָנְךָ תִּירֹשְׁךָ וְיִצְהָרֶךָ
  choice: persepuluhan dari gandummu, anggur barumu, dan minyakmu
  rationale: '''Persepuluhan'' adalah istilah baku; ''anggur baru'' mempertahankan kekhususan תירוש, sedangkan ''minyak'' cukup mewakili יצהר dalam rangkaian hasil pertanian ini.'
- source_word: וּבְכֹרֹת בְּקָרְךָ וְצֹאנֶךָ
  choice: serta anak-anak sulung dari kawanan sapi dan kambing dombamu
  rationale: '''Anak-anak sulung'' memperjelas bahwa yang dimaksud ialah keturunan ternak; ''kambing domba'' mencakup domba dan kambing dalam צאן tanpa membatasinya pada salah satu jenis.'
- source_word: לְמַעַן תִּלְמַד לְיִרְאָה
  choice: Dengan demikian, engkau belajar untuk takut akan
  rationale: Menyampaikan tujuan pedagogis perintah dengan bahasa Indonesia yang wajar, sedangkan 'takut akan' mempertahankan istilah teologis ירא tanpa mereduksinya menjadi sekadar hormat.
- source_word: כָּל הַיָּמִים
  choice: sepanjang hidupmu
  rationale: Ungkapan idiomatis Indonesia ini menyampaikan arti 'segenap hari' sebagai komitmen seumur hidup.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Menghadirkan Tetragramaton sebagai nama diri Allah dan selaras dengan lapisan konsultasi yang diberikan, tanpa menggantinya dengan gelar.
- issue: Rumusan tempat kudus לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: untuk membuat nama-Nya berdiam di sana
  alternative: agar nama-Nya berdiam di sana; untuk menempatkan nama-Nya di sana
  rationale: Pilihan ini mempertahankan bentuk kausatif dan ketegangan teologis antara kehadiran perjanjian Allah melalui nama-Nya dan kenyataan bahwa Allah tidak dibatasi secara fisik oleh tempat kudus.
- issue: Makna לְיִרְאָה אֶת־יְהוָה
  choice: takut akan Yahweh
  alternative: menghormati Yahweh
  rationale: '''Takut akan'' mempertahankan keluasan makna Ibrani—gentarnya manusia, ketaatan, dan hormat—tanpa menghapus unsur takut atau menyempitkannya menjadi ketakutan belaka.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina tunggal 'engkau' mempertahankan sapaan langsung kepada Israel sebagai satu umat; kapitalisasi -Nya dipakai bagi Allah menurut kebiasaan ejaan religius Indonesia. 'Kambing domba' dipilih untuk cakupan צאן, yaitu ternak kecil berupa domba dan kambing.
