revisions:
- from: Di hadapan Yahweh, Allahmu, di tempat yang akan dipilih-Nya untuk membuat nama-Nya berdiam di sana,[a] engkau harus memakan persepuluhan dari gandummu, anggur barumu, dan minyakmu, serta anak-anak sulung dari kawanan sapi dan kambing dombamu. Dengan demikian, engkau belajar untuk takut akan Yahweh, Allahmu, sepanjang hidupmu.
  to: Engkau harus memakan di hadapan Yahweh, Allahmu, di tempat yang akan dipilih-Nya untuk membuat nama-Nya berdiam di sana,[a] persepuluhan dari hasil biji-bijianmu, anggur barumu, dan minyakmu, serta anak-anak sulung dari ternak sapimu dan kambing dombamu, supaya engkau belajar takut akan Yahweh, Allahmu, seumur hidupmu.
  rationale: Revisi memulihkan klausa tujuan לְמַעַן dengan “supaya,” memperluas “gandum” menjadi “hasil biji-bijian” untuk mencerminkan דָּגָן, dan memperjelas pasangan ternak besar serta kambing-domba. Padanan nama ilahi dan idiom tempat pilihan dipertahankan, beserta jangkar catatan kaki yang valid.
