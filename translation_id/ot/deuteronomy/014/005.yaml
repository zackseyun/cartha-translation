  yaml_path: translation/ot/deuteronomy/014/005.yaml
  text: the deer[a], the gazelle, the roebuck, the wild goat, the ibex, the antelope, and the mountain sheep.
translation:
  language: id
  text: rusa[a], kijang, rusa roe, kambing liar, ibeks, antelop, dan domba gunung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beberapa nama hewan dalam ayat ini tidak dapat diidentifikasi dengan pasti. “Rusa roe” mungkin juga berarti “rusa bera” atau “rusa merah”; “kambing liar” mungkin “ibeks”; “ibeks” mungkin juga “adaks”; “antelop” mungkin “sapi liar” atau “aurochs”; dan “domba gunung” mungkin “kambing-gunung Eropa” atau “kambing gunung.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַיָּל
  choice: rusa
  rationale: Menunjuk pada rusa, mungkin rusa jantan; istilah umum “rusa” paling jelas dan tidak terlalu mempersempit makna.
- source_word: צְבִי
  choice: kijang
  rationale: Umumnya diidentifikasi sebagai gazel. Dalam bahasa Indonesia, “kijang” merupakan padanan yang alami dan mudah dipahami, meskipun identifikasi zoologis kunonya tidak sepenuhnya pasti.
- source_word: יַחְמוּר
  choice: rusa roe
  rationale: Nama hewan ini tidak pasti. “Rusa roe” mempertahankan identifikasi utama teks konsultasi tanpa menyamakannya dengan “kijang”; alternatif rusa bera atau rusa merah dicatat dalam catatan kaki.
- source_word: אַקּוֹ
  choice: kambing liar
  rationale: Kemungkinan menunjuk pada kaprida liar, sering diidentifikasi sebagai kambing liar atau ibeks. “Kambing liar” lebih transparan bagi pembaca umum.
- source_word: דִישֹׁן
  choice: ibeks
  rationale: Identifikasi tepatnya diperdebatkan. “Ibeks” adalah padanan zoologis yang ringkas dan masuk akal, sedangkan kemungkinan adaks tetap dicatat.
- source_word: תְאוֹ
  choice: antelop
  rationale: Hewan ini tidak dapat diidentifikasi dengan pasti. “Antelop” cocok dengan konteks daftar hewan liar yang halal, tetapi kemungkinan sapi liar atau aurochs dipertahankan dalam catatan.
- source_word: זָמֶר
  choice: domba gunung
  rationale: Spesiesnya tidak pasti. “Domba gunung” mudah dipahami dan menyampaikan jenis hewan yang mungkin dimaksud tanpa memakai nama teknis yang kurang dikenal.
