lexical_decisions:
- source_word: לֹא תֹאכַל
  choice: Janganlah kamu makan
  rationale: Partikel negasi dengan bentuk imperfek orang kedua tunggal maskulin menyatakan larangan langsung dalam konteks hukum. Bentuk “janganlah” mempertahankan daya normatifnya dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: כָּל
  choice: apa pun
  rationale: Dengan nomina tunggal di bawah negasi, “apa pun” menyampaikan cakupan larangan yang menyeluruh secara alami dalam bahasa Indonesia.
- source_word: תּוֹעֵבָה
  choice: yang menjijikkan
  rationale: Istilah ini menunjuk kepada sesuatu yang dipandang keji, menjijikkan, atau patut ditolak. Dalam konteks ini istilah tersebut mengantar daftar makanan yang dilarang, tanpa membatasinya pada rasa jijik secara estetis semata.
theological_decisions:
- issue: Daya larangan dalam hukum perjanjian
  choice: 'Larangan langsung: “Janganlah kamu makan apa pun yang menjijikkan.”'
  alternative: 'Pernyataan kebiasaan: “Kamu tidak makan apa pun yang menjijikkan.”'
  rationale: Bentuk imperfek Ibrani dengan לֹא dalam konteks hukum paling tepat dipahami sebagai larangan, selaras dengan peraturan makanan yang mengikutinya, tanpa menambahkan penafsiran teologis di luar teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang lugas dan bermartabat. Kata ganti “kamu” mempertahankan sapaan orang kedua tunggal dalam teks Ibrani, sedangkan “janganlah” memberi larangan yang jelas tanpa terdengar usang.
