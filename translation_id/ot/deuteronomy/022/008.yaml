  text: כִּ֤י תִבְנֶה֙ בַּ֣יִת חָדָ֔שׁ וְ/עָשִׂ֥יתָ מַעֲקֶ֖ה לְ/גַגֶּ֑/ךָ וְ/לֹֽא תָשִׂ֤ים דָּמִים֙ בְּ/בֵיתֶ֔/ךָ כִּֽי יִפֹּ֥ל הַ/נֹּפֵ֖ל מִמֶּֽ/נּוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/008.yaml
  text: When you build a new house[a], you shall make a parapet for your roof, so that you do not bring bloodguilt on your house if someone falls from it.
translation:
  language: id
  text: Apabila kamu membangun rumah baru, kamu harus membuat pagar pengaman di sekeliling atapmu[a], supaya kamu tidak mendatangkan utang darah atas rumahmu jika seseorang jatuh dari atap itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tembok pelindung” atau “pagar pembatas.” Kata Ibrani ini menunjuk pada pembatas pengaman yang dibangun di tepi atap datar.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Apabila
  rationale: Kata ini memperkenalkan suatu keadaan dalam hukum kasuistik, bukan alasan sebab-akibat. “Apabila” menyampaikan situasi hukum itu secara wajar dalam bahasa Indonesia.
- source_word: תִבְנֶה בַּיִת חָדָשׁ
  choice: kamu membangun rumah baru
  rationale: Terjemahan langsung dan alami dari verba, nomina, dan adjektiva dalam konteks konkret pembangunan rumah.
- source_word: וְעָשִׂיתָ
  choice: haruslah kamu membuat
  rationale: Bentuk ini memiliki daya perintah dalam konteks hukum. “Haruslah” mempertahankan nada preskriptif dengan bahasa Indonesia yang jelas dan bermartabat.
- source_word: מַעֲקֶה
  choice: pagar pengaman
  rationale: Kata Ibrani ini menunjuk pada pembatas pelindung di tepi atap datar. “Pagar pengaman” lebih mudah dipahami pembaca Indonesia daripada istilah teknis “parapet” atau “tembok sandaran”.
- source_word: לְגַגֶּךָ
  choice: di sekeliling atapmu
  rationale: Preposisi menghubungkan pembatas dengan atap sebagai tempat pemasangannya. “Di sekeliling” memperjelas fungsi pembatas tanpa mengubah maksud.
- source_word: וְלֹא תָשִׂים דָּמִים
  choice: supaya kamu tidak mendatangkan utang darah
  rationale: Ungkapan harfiah “menaruh darah” menyatakan tanggung jawab hukum dan moral atas kematian. “Mendatangkan utang darah” mempertahankan metafora darah sekaligus menyampaikan makna pertanggungjawaban.
- source_word: בְּבֵיתֶךָ
  choice: atas rumahmu
  rationale: Dalam konteks ini tanggung jawab melekat pada rumah atau properti yang tidak diamankan. “Atas rumahmu” mempertahankan gambaran bahwa pertanggungjawaban dibebankan kepadanya.
- source_word: כִּי יִפֹּל הַנֹּפֵל
  choice: jika seseorang jatuh
  rationale: Ungkapan partisipial Ibrani menunjuk secara umum kepada orang yang mungkin jatuh. Terjemahan ini alami dan mempertahankan sifat kondisionalnya.
- source_word: מִמֶּנּוּ
  choice: dari atap itu
  rationale: Pronomina paling wajar merujuk pada struktur atap yang baru disebut. Mengulangi “atap” menghindari ketidakjelasan pronomina dalam bahasa Indonesia.
theological_decisions:
- issue: Makna דָּמִים dalam konteks hukum
  choice: utang darah
  alternative: penumpahan darah; kesalahan karena darah
  rationale: Ayat ini membahas tanggung jawab hukum dan moral atas kematian yang sebenarnya dapat dicegah, bukan hanya darah secara fisik. “Utang darah” mempertahankan kekuatan metafora dan nuansa pertanggungjawaban tanpa memasukkan ajaran tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum. Bentuk orang kedua tunggal dipertahankan dengan “kamu,” sesuai sapaan langsung dalam teks Ibrani. Istilah “utang darah” sengaja mempertahankan ketegangan metaforis dan yuridis dari bentuk jamak דָּמִים.
