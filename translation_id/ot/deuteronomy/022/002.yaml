  text: וְ/אִם לֹ֨א קָר֥וֹב אָחִ֛י/ךָ אֵלֶ֖י/ךָ וְ/לֹ֣א יְדַעְתּ֑/וֹ וַ/אֲסַפְתּ/וֹ֙ אֶל תּ֣וֹךְ בֵּיתֶ֔/ךָ וְ/הָיָ֣ה עִמְּ/ךָ֗ עַ֣ד דְּרֹ֤שׁ אָחִ֨י/ךָ֙ אֹת֔/וֹ וַ/הֲשֵׁבֹת֖/וֹ לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/002.yaml
  text: But if your brother is not near you[a], and you do not know him, then you shall bring it into your house, and it shall remain with you until your brother seeks it[c][b]; then you shall restore it to him.
translation:
  language: id
  text: Namun, jika saudaramu tidak dekat denganmu[a] dan kamu tidak mengenalnya[b], bawalah barang itu ke dalam rumahmu. Biarlah barang itu tetap ada padamu sampai saudaramu mencarinya; sesudah itu, kembalikanlah barang itu kepadanya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam hukum Ulangan, “saudaramu” sering menunjuk kepada sesama anggota umat perjanjian, bukan hanya saudara kandung.
    reason: cultural_note
  - marker: b
    text: Maksudnya, kamu tidak mengetahui siapa pemiliknya; secara harfiah, “kamu tidak mengenalnya.”
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “serahkanlah kembali barang itu kepadanya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחִיךָ
  choice: saudaramu
  rationale: Mempertahankan bahasa kekerabatan Ibrani. Dalam hukum Ulangan, istilah ini lazim menunjuk lebih luas kepada sesama anggota umat perjanjian, bukan hanya saudara kandung.
- source_word: לֹא קָרוֹב ... אֵלֶיךָ
  choice: tidak tinggal dekat denganmu
  rationale: Ungkapan ini menyatakan ketidakdekatan secara fisik; dalam konteks menemukan barang hilang, 'tidak tinggal dekat' lebih alami daripada terjemahan harfiah 'tidak dekat kepadamu'.
- source_word: וְלֹא יְדַעְתּוֹ
  choice: atau kamu tidak mengenalnya
  rationale: Pronomina maskulin tunggal secara gramatikal merujuk kepada 'saudaramu'. Konteksnya menunjukkan bahwa orang yang menemukan barang itu tidak mengetahui atau mengenal pemiliknya. Konjungsi diterjemahkan 'atau' karena kedua keadaan berfungsi sebagai kemungkinan yang berkaitan, bukan syarat yang harus terjadi bersamaan.
- source_word: וַאֲסַפְתּוֹ אֶל תּוֹךְ בֵּיתֶךָ
  choice: bawalah barang itu ke dalam rumahmu
  rationale: Kata kerja berarti mengumpulkan atau membawa masuk. 'Barang itu' memperjelas referen pronomina berdasarkan ayat sebelumnya tanpa membatasi cakupannya pada hewan saja.
- source_word: וְהָיָה עִמְּךָ
  choice: Barang itu harus tetap padamu
  rationale: Menyampaikan keberadaan yang berkelanjutan dalam konteks kewajiban hukum dengan bahasa Indonesia yang wajar.
- source_word: עַד דְּרֹשׁ אָחִיךָ אֹתוֹ
  choice: sampai saudaramu mencarinya
  rationale: דרש di sini dapat berarti mencari, menanyakan, atau menuntut kembali barang yang hilang. 'Mencarinya' mempertahankan keluasan makna dasar.
- source_word: וַהֲשֵׁבֹתוֹ לוֹ
  choice: sesudah itu, kembalikanlah barang itu kepadanya
  rationale: Bentuk kausatif שוב berarti membuat kembali, yakni mengembalikan. Imperatif Indonesia menyampaikan daya wajib dari bentuk verbal dalam rangkaian hukum.
theological_decisions:
- issue: Cakupan sebutan 'saudaramu'
  choice: Mempertahankan 'saudaramu' dengan catatan bahwa cakupannya lebih luas dalam konteks hukum Ulangan.
  alternative: sesama orang Israel
  rationale: Pilihan ini menjaga metafora kekerabatan dan bentuk maskulin sumber, tanpa mempersempitnya menjadi saudara biologis atau menggantinya dengan istilah identitas yang lebih eksplisit daripada teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dibagi agar rangkaian kewajiban hukum mudah dipahami. 'Saudaramu' dipertahankan untuk mencerminkan bahasa kekerabatan sumber; 'barang itu' dipakai sebagai rujukan kontekstual yang mencakup hewan atau benda hilang dari ayat sebelumnya.
