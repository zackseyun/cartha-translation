  text: If a man takes a wife and goes in to her[a], and then hates her,
translation:
  language: id
  text: Jika seorang laki-laki mengambil seorang perempuan sebagai istrinya, lalu berhubungan intim dengannya[a] dan membencinya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara harfiah, “datang kepadanya.” Ungkapan Ibrani ini merupakan eufemisme untuk hubungan seksual dalam perkawinan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Jika
  rationale: Dalam rumusan hukum kasuistik, כִּי memperkenalkan suatu keadaan bersyarat; “Jika” paling jelas menandai protasis dalam bahasa Indonesia.
- source_word: יִקַּח אִישׁ אִשָּׁה
  choice: seorang laki-laki mengambil seorang perempuan menjadi istrinya
  rationale: Terjemahan ini mempertahankan gambaran dasar לקח, tetapi menjelaskan bahwa אִשָּׁה di sini adalah perempuan yang diambil sebagai istri. Bentuk ini lebih alami dan tidak serancu “mengambil seorang istri” dalam bahasa Indonesia modern.
- source_word: וּבָא אֵלֶיהָ
  choice: lalu menghampirinya
  rationale: Ungkapan Ibrani ini merupakan eufemisme bagi hubungan seksual dalam perkawinan. “Menghampirinya” menjaga kesantunan dan sifat tidak langsung ungkapan sumber; catatan kaki menjelaskan maknanya.
- source_word: וּשְׂנֵאָהּ
  choice: dan kemudian membencinya
  rationale: שׂנא berarti “membenci.” “Kemudian” menyampaikan urutan tindakan dalam rangkaian klausa tanpa mengubah makna dasarnya.
theological_decisions:
- issue: Sifat hubungan yang dimaksud oleh וּבָא אֵלֶיהָ
  choice: Dipertahankan sebagai eufemisme dalam teks utama dan dijelaskan di catatan kaki sebagai hubungan seksual dalam perkawinan.
  alternative: 'Menerjemahkan secara eksplisit: “berhubungan seksual dengannya.”'
  rationale: Pilihan ini mempertahankan tingkat kesantunan dan ketidaklangsungan teks Ibrani tanpa menyembunyikan maksud idiom tersebut dari pembaca modern.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kasus hukum dipertahankan dengan “Jika”; eufemisme seksual dibuat alami melalui “menghampirinya” dan diterangkan dalam catatan kaki.
