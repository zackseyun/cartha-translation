base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/007.yaml
  text: You must surely let the mother go[a], but you may take the young for yourself[c][b], so that it may go well for you and you may prolong your days.
translation:
  language: id
  text: Engkau harus benar-benar melepaskan induknya, tetapi anak-anaknya boleh kauambil untuk dirimu, supaya engkau hidup sejahtera dan panjang umur.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלֵּחַ תְּשַׁלַּח
  choice: harus melepaskan
  rationale: Gabungan infinitif absolut dan verba finit menegaskan perintah. Kata 'harus' menyampaikan daya wajib dan emfatis secara alami dalam bahasa Indonesia modern; 'melepaskan' sesuai dengan tindakan membiarkan induk burung pergi.
- source_word: הָאֵם
  choice: induknya
  rationale: Dalam konteks sarang burung, 'induknya' lebih alami daripada 'ibunya' dan tidak perlu menambahkan kata 'burung' yang sudah jelas dari konteks ayat sebelumnya.
- source_word: הַבָּנִים
  choice: anak-anaknya
  rationale: Secara harfiah berarti 'anak-anak'; dalam konteks ini menunjuk kepada anak burung. Pilihan ini mempertahankan ungkapan sumber tanpa mempersempitnya menjadi 'anak burung yang baru menetas', mengingat konteks sebelumnya juga menyebut telur.
- source_word: תִּקַּח לָךְ
  choice: boleh kauambil untuk dirimu
  rationale: Bentuk imperfek dalam rangkaian ini paling wajar dipahami sebagai izin setelah perintah melepaskan induk. 'Untuk dirimu' mempertahankan לָךְ.
- source_word: לְמַעַן יִיטַב לָךְ
  choice: supaya keadaanmu baik
  rationale: Menyampaikan rumusan tujuan/hasil perjanjian secara jelas dan alami tanpa menambahkan bentuk jaminan mekanis.
- source_word: וְהַאֲרַכְתָּ יָמִים
  choice: dan umurmu panjang
  rationale: Ungkapan Ibrani harfiahnya berkaitan dengan 'memanjangkan hari-hari'. Idiom Indonesia 'umurmu panjang' menyampaikan maknanya secara alami sambil tetap dekat dengan citra lamanya kehidupan.
theological_decisions:
- issue: Sifat hasil yang dijanjikan
  choice: 'Diterjemahkan sebagai berkat/hasil yang dikaitkan dengan ketaatan: ''supaya keadaanmu baik dan umurmu panjang''.'
  alternative: Menjadikannya jaminan mutlak bahwa setiap orang yang menaati perintah ini pasti berumur panjang.
  rationale: Rumusan tujuan/hasil dalam bahasa Ibrani menyatakan berkat yang menyertai ketaatan, tetapi terjemahan tidak boleh memperluasnya menjadi penjelasan mekanis atau jaminan individual yang melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'engkau/kau-' dipakai agar perintah kepada orang kedua tunggal tetap jelas dan mengalir alami. Struktur pertentangan antara kewajiban melepaskan induk dan izin mengambil anak-anaknya dipertahankan.
