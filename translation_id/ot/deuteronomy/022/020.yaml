  text: But if this matter is true[a], and evidence of virginity was not found for the young woman,
translation:
  language: id
  text: Tetapi jika perkara itu benar dan tidak ditemukan bukti keperawanan pada perempuan muda itu,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “tanda-tanda keperawanan tidak ditemukan bagi perempuan muda itu.” Dalam konteks kebiasaan hukum kuno ini, kata Ibrani בְּתוּלִים dapat berarti “keperawanan” atau tanda-tanda yang dianggap sebagai buktinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Gabungan kata penghubung dan partikel syarat mengontraskan kemungkinan ini dengan perkara pada ayat sebelumnya; bentuk ini alami dalam bahasa Indonesia.
- source_word: אֱמֶת הָיָה
  choice: perkara itu benar
  rationale: אֱמֶת berfungsi sebagai predikat dalam konstruksi yang menyatakan bahwa tuduhan atau perkara tersebut terbukti benar.
- source_word: הַדָּבָר הַזֶּה
  choice: perkara itu
  rationale: Dalam konteks hukum, דָּבָר menunjuk pada perkara atau tuduhan yang sedang diperiksa. 'Perkara' mempertahankan cakupannya tanpa mempersempitnya menjadi 'tuduhan' saja.
- source_word: לֹא נִמְצְאוּ
  choice: tidak ditemukan
  rationale: Bentuk pasif dipertahankan; bahasa Indonesia tidak perlu menandai persesuaian jumlah dengan nomina Ibrani yang berbentuk jamak.
- source_word: בְּתוּלִים
  choice: bukti keperawanan
  rationale: Dalam konteks kebiasaan hukum kuno ini, bentuk tersebut dapat menunjuk pada keperawanan atau tanda fisik yang dianggap sebagai buktinya. Terjemahan utama menyampaikan fungsi kontekstualnya, sedangkan catatan kaki mempertahankan kemungkinan yang lebih harfiah.
- source_word: לַנַּעֲרָ
  choice: pada perempuan muda itu
  rationale: נַעֲרָה adalah perempuan muda usia menikah. Preposisi ל dalam ungkapan ini diterjemahkan secara alami sebagai 'pada', yakni bukti yang tidak didapati berkenaan dengan dirinya.
