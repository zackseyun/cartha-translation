  text: כִּ֤י יִהְיֶה֙ נער בְתוּלָ֔ה מְאֹרָשָׂ֖ה לְ/אִ֑ישׁ וּ/מְצָאָ֥/הּ אִ֛ישׁ בָּ/עִ֖יר וְ/שָׁכַ֥ב עִמָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/023.yaml
  text: If there is a young woman[a], a virgin, pledged to a man, and another man finds her in the city and lies with her,
translation:
  language: id
  text: Apabila ada seorang perempuan muda yang masih perawan dan telah dipertunangkan dengan seorang laki-laki[a], lalu laki-laki lain mendapatinya di kota dan bersetubuh dengannya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pertunangan yang dimaksud adalah ikatan resmi yang berkekuatan hukum, bukan sekadar pertunangan informal seperti yang lazim dipahami sekarang.
    reason: Menjelaskan bobot hukum מְאֹרָשָׂה dan mencegah pembaca menyamakannya dengan pertunangan modern yang mudah dibatalkan.
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: Apabila ada
  rationale: Ungkapan ini membuka suatu kasus hukum hipotetis. “Apabila ada” terdengar alami dalam bahasa hukum Indonesia dan mempertahankan daya kondisionalnya.
- source_word: נַעֲרָ
  choice: seorang perempuan muda
  rationale: Mengacu kepada perempuan muda yang telah mencapai usia untuk menikah. Pilihan ini jelas dalam bahasa Indonesia modern tanpa menyiratkan usia terlalu dini seperti yang mungkin ditimbulkan oleh “gadis kecil”.
- source_word: בְתוּלָה
  choice: seorang perawan
  rationale: Istilah Ibrani menyatakan keperawanan secara khusus; unsur ini dipertahankan karena penting bagi konteks hukum perikop.
- source_word: מְאֹרָשָׂה לְאִישׁ
  choice: yang telah dipertunangkan dengan seorang laki-laki
  rationale: Bentuk pasif mencerminkan keadaan perempuan itu sebagai orang yang telah masuk ke dalam pertunangan formal. Catatan kaki menjelaskan bahwa ikatan ini lebih kuat daripada pertunangan informal masa kini.
- source_word: וּמְצָאָהּ אִישׁ
  choice: lalu laki-laki lain mendapatinya
  rationale: Teks Ibrani secara harfiah menyebut “seorang laki-laki”. Kata “lain” memperjelas bahwa orang ini berbeda dari laki-laki yang bertunangan dengannya, sesuai konteks tanpa mengubah makna.
- source_word: בָּעִיר
  choice: di kota
  rationale: Padanan langsung dan wajar; lokasi ini penting bagi kelanjutan kasus hukum pada ayat berikutnya.
- source_word: וְשָׁכַב עִמָּהּ
  choice: dan bersetubuh dengannya
  rationale: “Bersetubuh” menyampaikan hubungan seksual dengan jelas dalam ragam bahasa yang bermartabat dan sesuai bagi teks hukum, tanpa menambahkan unsur pemaksaan yang tidak dinyatakan secara leksikal dalam ayat ini.
theological_decisions:
- issue: Apakah tindakan seksual dalam ayat ini harus dinyatakan secara eksplisit sebagai pemerkosaan atau pemaksaan
  choice: Diterjemahkan secara netral sebagai “bersetubuh dengannya”
  alternative: “memerkosanya” atau “memaksanya bersetubuh”
  rationale: Ayat ini sendiri tidak memakai kata yang secara eksplisit menyatakan pemaksaan. Terjemahan mempertahankan rumusan teks dan ketegangan hukumnya, tanpa memasukkan kesimpulan dari ayat-ayat di sekitarnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kasus hukum dipertahankan dengan “Apabila”. Frasa “perempuan muda, seorang perawan” mempertahankan kedua unsur sumber tanpa meleburkannya. Kalimat dibiarkan berakhir dengan koma karena ayat ini merupakan anak kalimat yang berlanjut ke ketentuan pada ayat berikutnya.
