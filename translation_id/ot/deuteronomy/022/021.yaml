base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/021.yaml
  text: Then they shall bring out the young woman to the entrance of her father's house[a], and the men of her city shall stone her with stones, and she shall die, because she has committed an outrageous act in Israel by prostituting herself in her father's house[c][b]. So you shall purge the evil from your midst.
translation:
  language: id
  text: Lalu mereka harus membawa perempuan muda itu ke pintu masuk rumah ayahnya. Para lelaki di kotanya harus merajamnya dengan batu hingga ia mati, sebab dia telah melakukan perbuatan keji di Israel dengan berzina di rumah ayahnya. Demikianlah kamu harus menyingkirkan kejahatan dari tengah-tengahmu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנַּעַר
  choice: perempuan muda itu
  rationale: Dalam konteks hukum ini, bentuk Ibrani tersebut menunjuk kepada seorang perempuan muda. Pilihan ini alami dalam bahasa Indonesia dan tidak menyiratkan usia yang lebih spesifik daripada konteks.
- source_word: פֶּתַח בֵּית אָבִיהָ
  choice: pintu masuk rumah ayahnya
  rationale: פֶּתַח adalah bukaan atau pintu masuk. Terjemahan ini mempertahankan acuan konkret kepada rumah ayahnya.
- source_word: וּסְקָלוּהָ ... בָּאֲבָנִים וָמֵתָה
  choice: harus merajam dia dengan batu sampai mati
  rationale: Ungkapan ini mempertahankan penyebutan batu secara eksplisit dan menyampaikan bahwa kematian adalah akibat hukuman tersebut.
- source_word: אַנְשֵׁי עִירָהּ
  choice: para lelaki di kotanya
  rationale: Frasa Ibrani secara harfiah menyebut para lelaki kota itu; terjemahan tidak menetralkan unsur gender tersebut.
- source_word: נְבָלָה
  choice: perbuatan keji
  rationale: Dalam konteks moral-hukum, kata ini menyatakan tindakan memalukan dan sangat tercela, bukan sekadar kebodohan.
- source_word: לִזְנוֹת
  choice: dengan berzina
  rationale: Dalam konteks tuduhan pada ayat-ayat sebelumnya, verba זנה menunjuk pada hubungan seksual terlarang. 'Berzina' menyampaikan tuduhan itu secara alami tanpa memberi kesan bahwa ia melakukan prostitusi komersial.
- source_word: בֵּית אָבִיהָ
  choice: di rumah ayahnya
  rationale: Terjemahan lokatif langsung ini mempertahankan latar sosial dan konkret ungkapan Ibrani.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: Demikianlah kamu harus menyingkirkan kejahatan dari tengah-tengahmu
  rationale: Ini mempertahankan formula hukum khas Ulangan dan daya imperatifnya dalam bahasa Indonesia yang wajar.
theological_decisions:
- issue: Istilah hukum-seksual tanpa memperlunak atau mempersempit secara berlebihan
  choice: Menggunakan 'perbuatan keji' dan 'berzina'
  alternative: Menggunakan 'perbuatan mesum', 'melacurkan diri', atau 'melakukan percabulan'
  rationale: '''Perbuatan keji'' mempertahankan kerasnya penilaian נְבָלָה. Dalam konteks ini, ''berzina'' menyampaikan pelanggaran seksual yang dituduhkan tanpa mengimpor gagasan transaksi seksual yang tidak dinyatakan.'
- issue: Pelaku hukuman yang bergender
  choice: Mempertahankan 'para lelaki di kotanya'
  alternative: Menggunakan 'penduduk kotanya'
  rationale: Teks Ibrani memakai ungkapan maskulin 'orang-orang lelaki kotanya'; pilihan ini menjaga bentuk sumber tanpa menetralkannya.
- issue: Makna formula pembuangan kejahatan
  choice: Menjadikan 'kejahatan' sebagai hal yang disingkirkan dari tengah umat
  alternative: Menjadikan 'orang jahat' sebagai objek yang disingkirkan
  rationale: הָרָע dapat dipahami sebagai 'kejahatan' atau 'yang jahat'. Terjemahan utama mengikuti makna abstrak yang alami dalam formula ini, sementara alternatif dicatat agar ambiguitas leksikal tidak disembunyikan.
translation_notes:
  register: Bahasa hukum yang modern, lugas, dan bermartabat. Kekerasan hukuman tidak diperhalus, tetapi susunan dibuat alami bagi pembaca Indonesia. 'Kota' dipertahankan untuk עִיר, dan bentuk tunggal 'kamu' dalam formula penutup dipertahankan secara gramatikal meskipun ditujukan kepada Israel sebagai umat.
