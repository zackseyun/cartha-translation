review_pass:
  verdict: revise
  source_fidelity: Terjemahan pada umumnya setia kepada teks Ibrani. Namun, וָמֵתָה menyatakan hasil secara tersendiri, “dan ia akan mati”; susunan “merajam dia dengan batu sampai mati” sedikit meleburkan klausa hasil itu ke dalam tindakan. Revisi “hingga ia mati” mempertahankan hubungan tersebut dengan lebih jelas.
  naturalness: Bahasanya modern, lugas, dan sesuai register hukum. “Merajamnya” lebih alami daripada “merajam dia,” dan pemenggalan kalimat membantu keterbacaan tanpa mengurangi gaya formal.
  terminology: '“Perempuan muda,” “para lelaki di kotanya,” “perbuatan keji,” “berzina,” dan “menyingkirkan kejahatan” merupakan pilihan yang dapat dipertahankan. Catatan kaki yang ada harus dihapus: dalam formula ini הָרָע secara gramatikal dan idiomatis merujuk pada “kejahatan/yang jahat,” tetapi catatan tersebut tidak merupakan alternatif yang aman bagi frasa yang diterjemahkan “kejahatan” dan secara tidak tepat menggeser objek formula menjadi “orang yang jahat.”'
  issues:
  - severity: medium
    issue: Catatan kaki [a] memberi alternatif “orang yang jahat” untuk “kejahatan.”
    rationale: Catatan ini tidak selaras dengan fungsi formula Deuteronomis וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ dalam konteks ini dan dapat mengubah makna yang diterjemahkan. Ambiguitas nominal yang mungkin secara leksikal tidak cukup untuk mendukung penggantian itu di sini.
  - severity: low
    issue: “Sampai mati” meleburkan klausa “dan ia akan mati” ke dalam tindakan perajaman.
    rationale: “Hingga ia mati” mempertahankan hasil hukuman yang dinyatakan eksplisit oleh וָמֵתָה, sambil tetap alami dalam bahasa Indonesia.
  revised_text: Lalu mereka harus membawa perempuan muda itu ke pintu masuk rumah ayahnya. Para lelaki di kotanya harus merajamnya dengan batu hingga ia mati, sebab dia telah melakukan perbuatan keji di Israel dengan berzina di rumah ayahnya. Demikianlah kamu harus menyingkirkan kejahatan dari tengah-tengahmu.
