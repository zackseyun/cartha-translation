  to: Janganlah kamu menaburkan dua jenis benih di kebun anggurmu, supaya seluruh hasil—benih yang kamu taburkan dan hasil kebun anggur itu—tidak menjadi kudus[a].
  rationale: Revisi hanya memperbaiki kealamian susunan kalimat dan memindahkan jangkar catatan kaki ke kata yang memang dijelaskannya. Terjemahan “menjadi kudus” dipertahankan untuk mencerminkan arti dasar קדש dan menghindari penetapan tunggal atas konsekuensi hukum yang diperdebatkan.
