    rationale: Jangkar catatan harus ditempatkan pada istilah atau klausa yang dijelaskannya. Penempatan saat ini dapat membuat pembaca mengira catatan menerangkan כִּלְאָיִם, bukan תִּקְדַּשׁ.
  - severity: low
