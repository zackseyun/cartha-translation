  text: לֹא תִזְרַ֥ע כַּרְמְ/ךָ֖ כִּלְאָ֑יִם פֶּן תִּקְדַּ֗שׁ הַֽ/מְלֵאָ֤ה הַ/זֶּ֨רַע֙ אֲשֶׁ֣ר תִּזְרָ֔ע וּ/תְבוּאַ֖ת הַ/כָּֽרֶם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/009.yaml
  text: You shall not sow your vineyard with two kinds of seed[a], lest the whole yield be forfeited—the seed that you sow and the produce of the vineyard.
translation:
  language: id
  text: Janganlah kamu menaburkan dua jenis benih di kebun anggurmu, supaya seluruh hasil—benih yang kamu taburkan dan hasil kebun anggur itu—tidak menjadi kudus[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “supaya seluruh hasil ... menjadi kudus/dikhususkan,” yakni dipisahkan dan tidak lagi boleh digunakan seperti biasa.
    reason: Menjelaskan makna hukum yang mungkin dari תִּקְדַּשׁ sambil mempertahankan “menjadi kudus” dalam teks utama.
lexical_decisions:
- source_word: לֹא תִזְרַע
  choice: Janganlah kamu menaburi
  rationale: Larangan Ibrani diterjemahkan dengan bentuk larangan yang wajar dalam bahasa Indonesia; זרע secara khusus berarti menabur benih.
- source_word: כַּרְמְךָ
  choice: kebun anggurmu
  rationale: כֶּרֶם adalah istilah biasa untuk kebun anggur, dan akhiran orang kedua tunggal dipertahankan dengan -mu.
- source_word: כִּלְאָיִם
  choice: dua jenis benih
  rationale: Dalam konteks penaburan, bentuk dual ini menunjuk pada campuran jenis-jenis yang dilarang. Ungkapan ini jelas dan dekat dengan cakupan leksikal teks.
- source_word: פֶּן
  choice: supaya ... tidak
  rationale: פֶּן memperkenalkan akibat negatif yang hendak dihindari; konstruksi ini alami dalam bahasa Indonesia dan mempertahankan hubungan tujuan/peringatan.
- source_word: תִּקְדַּשׁ
  choice: menjadi kudus
  rationale: Terjemahan formal ini mempertahankan ketegangan leksikal verba קדש dan tidak secara diam-diam menetapkan akibat hukumnya sebagai 'disita' atau 'hangus'.
- source_word: הַמְלֵאָה
  choice: seluruh hasilnya
  rationale: Secara harfiah menunjuk pada kepenuhan atau hasil penuh; 'seluruh hasilnya' menyampaikan cakupan total secara alami.
- source_word: הַזֶּרַע אֲשֶׁר תִּזְרָע
  choice: benih yang kamu taburkan
  rationale: Klausa relatif sumber dipertahankan secara langsung dan alami.
- source_word: וּתְבוּאַת הַכָּרֶם
  choice: maupun hasil kebun anggur itu
  rationale: תְּבוּאָה berarti hasil atau panen. 'Maupun' memperjelas bahwa kedua unsur tercakup dalam akibat yang sama.
theological_decisions:
- issue: Makna תִּקְדַּשׁ dalam hukum tentang campuran tanaman
  choice: menjadi kudus
  alternative: menjadi terlarang untuk digunakan; disita; dikhususkan
  rationale: Makna harfiahnya adalah 'menjadi kudus/dikhususkan', sedangkan akibat hukum tepatnya diperdebatkan. Teks utama mempertahankan istilah sumber dan catatan menjelaskan kemungkinan nuansa larangan bagi penggunaan biasa tanpa mengunci satu mekanisme hukum tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk 'Janganlah' mempertahankan nada hukum. Istilah sulit תִּקְדַּשׁ diterjemahkan secara formal agar ambiguitas dan ketegangan teologis sumber tidak hilang.
