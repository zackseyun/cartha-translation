revisions:
- from: Namun, jika di padang seorang laki-laki mendapati perempuan muda yang sudah bertunangan itu, lalu laki-laki itu menangkapnya dengan paksa[a] dan bersetubuh dengannya, hanya laki-laki yang bersetubuh dengannya itu yang harus dihukum mati.
  to: Namun, jika di padang terbuka seorang laki-laki mendapati perempuan muda yang sudah bertunangan itu, lalu laki-laki itu mencengkeramnya[a] dan bersetubuh dengannya, maka hanya laki-laki yang bersetubuh dengannya yang harus dihukum mati.
  rationale: Revisi mengganti verba yang berpotensi berarti penangkapan/penahanan dengan "mencengkeramnya," yang lebih dekat dengan חזק ב dan dengan audit bahasa Inggris “seizes her.” "Di padang terbuka" mempertahankan arti medan terbuka yang relevan bagi pembedaan kasus dalam konteks langsung, sementara catatan kaki menaruh pembacaan yang lebih interpretatif di luar teks utama.
