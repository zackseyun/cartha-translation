source:
  edition: WLC
  text: וְֽ/אִם בַּ/שָּׂדֶ֞ה יִמְצָ֣א הָ/אִ֗ישׁ אֶת ה/נער הַ/מְאֹ֣רָשָׂ֔ה וְ/הֶחֱזִֽיק בָּ֥/הּ הָ/אִ֖ישׁ וְ/שָׁכַ֣ב עִמָּ֑/הּ וּ/מֵ֗ת הָ/אִ֛ישׁ אֲשֶׁר שָׁכַ֥ב עִמָּ֖/הּ לְ/בַדּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/025.yaml
  text: But if in the open field the man finds the young woman who is betrothed[a], and the man seizes her and lies with her, then only the man who lay with her shall die.
translation:
  language: id
  text: Namun, jika di padang terbuka seorang laki-laki mendapati perempuan muda yang sudah bertunangan itu, lalu laki-laki itu mencengkeramnya[a] dan bersetubuh dengannya, maka hanya laki-laki yang bersetubuh dengannya yang harus dihukum mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menundukkannya dengan paksa” atau “memerkosanya.” Secara harfiah, bahasa Ibrani menyatakan bahwa laki-laki itu “mencengkeramnya”; hukum di sekitarnya menunjukkan bahwa tindakan itu dilakukan tanpa persetujuan perempuan tersebut.
    reason: Menjelaskan alternatif makna untuk חזק serta sifat koersif yang ditunjukkan oleh konteks hukum.
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Menandai kasus bersyarat yang berlawanan dengan keadaan dalam ayat sebelumnya.
- source_word: בַּשָּׂדֶה
  choice: di padang
  rationale: Menerjemahkan שׂדה secara langsung sekaligus menyampaikan lokasi terbuka di luar permukiman yang penting dalam konteks hukum.
- source_word: יִמְצָא
  choice: mendapati
  rationale: Padanan alami bagi מצא dalam uraian kasus hukum; dapat berarti menemukan atau menjumpai.
- source_word: הַנַּעַר הַמְאֹרָשָׂה
  choice: perempuan muda yang sudah bertunangan itu
  rationale: Menunjukkan perempuan muda yang telah terikat pertunangan secara hukum; bentuk relatif terdengar alami dan tetap dekat dengan susunan sumber.
- source_word: וְהֶחֱזִיק בָּהּ
  choice: menangkapnya dengan paksa
  rationale: Bentuk kausatif חזק dengan ב menyatakan tindakan memegang atau menangkap secara kuat dan koersif. Frasa ini mempertahankan tindakan konkret tanpa menggantinya langsung dengan istilah interpretatif 'memerkosa'.
- source_word: וְשָׁכַב עִמָּהּ
  choice: bersetubuh dengannya
  rationale: Padanan modern, jelas, dan bermartabat bagi idiom Ibrani yang berarti melakukan hubungan seksual.
- source_word: וּמֵת
  choice: harus dihukum mati
  rationale: Dalam konteks hukum, bentuk ini menyatakan hukuman yang wajib dijatuhkan, bukan sekadar kematian yang terjadi.
- source_word: לְבַדּוֹ
  choice: hanya laki-laki ... itu
  rationale: 'Mengungkapkan eksklusivitas hukuman: laki-laki itu saja, bukan perempuan tersebut, yang dikenai hukuman mati.'
theological_decisions:
- issue: Apakah kekerasan seksual dinyatakan secara eksplisit dengan kata 'memerkosa' dalam teks utama
  choice: Memakai 'menangkapnya dengan paksa' dalam teks utama dan menjelaskan implikasi pemerkosaan dalam catatan kaki.
  alternative: Memakai 'memerkosanya' atau 'memaksanya' secara langsung.
  rationale: Konteks hukum dengan jelas menunjukkan tindakan tanpa persetujuan, tetapi verba חזק sendiri secara leksikal berarti memegang, menangkap, atau menguasai dengan kuat, bukan verba khusus untuk 'memerkosa'. Pilihan ini menjaga transparansi terhadap sumber sekaligus menyatakan unsur paksaan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam hukum yang lugas dan bermartabat. 'Bersetubuh' dipilih daripada ungkapan eufemistis yang dapat kabur; 'dihukum mati' memperjelas konsekuensi yudisial. Penanda catatan kaki [a] dicantumkan tepat setelah frasa yang dijelaskan.
