base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/022.yaml
  text: If a man is found lying with a woman married to a husband[a], then both of them shall die—the man who lay with the woman, and the woman[b]. So you shall purge the evil from Israel.
translation:
  language: id
  text: Jika seorang laki-laki kedapatan bersetubuh dengan seorang perempuan yang bersuami,[a] keduanya harus mati—laki-laki yang bersetubuh dengan perempuan itu dan perempuan itu.[b] Demikianlah kamu harus menyingkirkan kejahatan dari Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “seorang perempuan yang bersuami”; frasa Ibrani ini menegaskan statusnya sebagai perempuan dalam ikatan perkawinan dengan seorang suami.'
    reason: lexical_alternative
  - marker: b
    text: Ungkapan “harus mati” di sini menetapkan hukuman mati; dapat juga diterjemahkan, “harus dihukum mati.”
    reason: alternative_reading
lexical_decisions:
- source_word: יִמָּצֵא
  choice: kedapatan
  rationale: Bentuk Nifal menyatakan bahwa perbuatan itu ditemukan atau diketahui. Dalam bahasa hukum Indonesia, “kedapatan” menyampaikan nuansa penemuan pelanggaran secara ringkas tanpa harus berarti tertangkap basah.
- source_word: שֹׁכֵב עִם
  choice: bersetubuh dengan
  rationale: Ungkapan ini merupakan idiom bagi hubungan seksual. “Bersetubuh dengan” jelas, bermartabat, dan sesuai dengan laras hukum modern, sekalipun tidak mempertahankan metafora harfiah “berbaring dengan”.
- source_word: בְעֻלַת בַּעַל
  choice: seorang perempuan yang bersuami
  rationale: Frasa ini menandai perempuan yang terikat dalam perkawinan. Pilihan ini alami dalam bahasa Indonesia dan tidak memasukkan nuansa kepemilikan yang dapat ditimbulkan oleh terjemahan terlalu harfiah.
- source_word: וּמֵתוּ גַּם שְׁנֵיהֶם
  choice: keduanya harus mati
  rationale: Dalam konteks hukum, bentuk ini menetapkan hukuman mati. “Harus mati” tetap dekat dengan kata kerja Ibrani “mati” tanpa menambahkan bentuk kausatif pasif “dihukum mati” ke dalam teks utama.
- source_word: הָאִישׁ הַשֹּׁכֵב עִם הָאִשָּׁה
  choice: laki-laki yang bersetubuh dengan perempuan itu
  rationale: Klausa relatif mempertahankan identifikasi eksplisit terhadap pihak laki-laki dan terdengar alami dalam bahasa Indonesia.
- source_word: וְהָאִשָּׁה
  choice: dan perempuan itu
  rationale: Pengulangan sumber dipertahankan demi kejelasan hukum dan untuk menegaskan bahwa ketentuan tersebut menyebut kedua pihak.
- source_word: וּבִעַרְתָּ
  choice: Demikianlah kamu harus menyingkirkan
  rationale: Dalam rumusan hukum Ulangan, בער menunjuk pada pembuangan atau penyingkiran kejahatan dari umat. “Menyingkirkan” menyampaikan daya yuridis-moralnya secara alami dalam bahasa Indonesia.
- source_word: הָרָע
  choice: kejahatan
  rationale: Nomina abstrak tunggal ini diterjemahkan sebagai “kejahatan,” sejalan dengan rumusan berulang dalam konteks hukum dan perjanjian.
- source_word: מִיִּשְׂרָאֵל
  choice: dari Israel
  rationale: Preposisi menandai penyingkiran dari komunitas Israel; bentuk ringkas ini mengikuti susunan sumber.
theological_decisions:
- issue: Cara menerjemahkan status perkawinan dalam בְעֻלַת בַּעַל
  choice: seorang perempuan yang bersuami
  alternative: seorang perempuan yang terikat kepada seorang suami
  rationale: Pilihan utama menyatakan ikatan perkawinan dengan jelas dan alami tanpa menafsirkan frasa sebagai kepemilikan. Catatan kaki mempertahankan bentuk yang lebih dekat dengan susunan Ibrani.
- issue: Apakah hukuman yudisial harus dibuat eksplisit sebagai eksekusi
  choice: harus mati
  alternative: harus dihukum mati
  rationale: Konteks hukum menunjukkan hukuman mati, tetapi kata-kata sumber secara langsung mengatakan “mati,” bukan bentuk pasif “dihukum mati.” Teks utama mempertahankan bentuk itu, sedangkan catatan menjelaskan daya hukumnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan laras hukum yang jelas. “Bersetubuh” dipilih daripada ungkapan harfiah “berbaring” agar idiom seksual tidak kabur. Struktur pengulangan kedua pihak dipertahankan untuk mengikuti ketegasan hukum dalam teks Ibrani.
