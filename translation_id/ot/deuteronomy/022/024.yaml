    issue: Unsur "keluar" tidak diterjemahkan.
    rationale: Hifil יצא dalam וְהוֹצֵאתֶם menyatakan membawa kedua orang itu keluar. Tujuan "ke pintu gerbang" tidak sepenuhnya menggantikan unsur arah tersebut.
  - severity: low
    issue: '"Sampai mati" kurang secara eksplisit mempertahankan hasil "dan mereka mati".'
    rationale: וָמֵתוּ adalah kelanjutan hasil dari perajaman. "Hingga mereka mati" menyatakannya dengan lebih jelas tanpa mengubahnya menjadi tujuan.
  - severity: medium
    issue: '"Menodai" berpotensi menggeser arti עִנָּה.'
    rationale: Dalam konteks ini verba tersebut mencakup penghinaan atau pelanggaran seksual, tetapi "menodai" dalam bahasa Indonesia mudah dibaca sebagai kenajisan atau pencemaran moral/ritual. "Merendahkan" lebih dekat dengan rentang leksikal dan mempertahankan ambiguitas.
