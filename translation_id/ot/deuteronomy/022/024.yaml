source:
  edition: WLC
  text: וְ/הוֹצֵאתֶ֨ם אֶת שְׁנֵי/הֶ֜ם אֶל שַׁ֣עַר הָ/עִ֣יר הַ/הִ֗וא וּ/סְקַלְתֶּ֨ם אֹתָ֥/ם בָּ/אֲבָנִים֮ וָ/מֵתוּ֒ אֶת ה/נער עַל דְּבַר֙ אֲשֶׁ֣ר לֹא צָעֲקָ֣ה בָ/עִ֔יר וְ/אֶ֨ת הָ/אִ֔ישׁ עַל דְּבַ֥ר אֲשֶׁר עִנָּ֖ה אֶת אֵ֣שֶׁת רֵעֵ֑/הוּ וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׀־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/024.yaml
  text: 'then you shall bring both of them out to the gate of that city[a], and you shall stone them with stones, and they shall die: the young woman because she did not cry out in the city, and the man because he violated his neighbor’s wife[c][b]. So you shall purge the evil from your midst.'
translation:
  language: id
  text: 'Kemudian kamu harus membawa keduanya keluar ke pintu gerbang kota itu[a], lalu melempari mereka dengan batu hingga mereka mati: perempuan muda itu karena ia tidak berteriak di dalam kota, dan laki-laki itu karena ia telah merendahkan istri sesamanya[b]. Demikianlah kamu harus menyingkirkan kejahatan dari tengah-tengahmu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pintu gerbang kota merupakan tempat umum untuk persidangan dan penghakiman pada zaman Israel kuno.
    reason: cultural_note
  - marker: b
    text: Atau, “menodai” atau “menindas.” Kata Ibrani ini dalam konteks seksual dapat menunjuk pada pelanggaran yang sekaligus mendatangkan penghinaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתֶם
  choice: kamu harus membawa ... ke luar
  rationale: Bentuk kausatif verba ini menyatakan tindakan membawa kedua pihak ke luar menuju tempat penghakiman; dalam susunan bahasa Indonesia, tujuan ‘ke pintu gerbang’ sudah menyampaikan arah tersebut secara alami.
- source_word: שְׁנֵיהֶם
  choice: keduanya
  rationale: Menunjuk secara tegas kepada dua pihak yang disebut dalam perkara ini.
- source_word: שַׁעַר הָעִיר הַהִוא
  choice: pintu gerbang kota itu
  rationale: Mempertahankan ungkapan konkret Ibrani; pintu gerbang kota juga merupakan tempat umum untuk proses hukum pada masa itu.
- source_word: וּסְקַלְתֶּם אֹתָם בָּאֲבָנִים וָמֵתוּ
  choice: melempari mereka dengan batu sampai mati
  rationale: Menyampaikan tindakan dan akibatnya secara jelas dan alami, tanpa menafsirkan akibat tersebut sebagai tujuan yang terpisah.
- source_word: הנער
  choice: perempuan muda itu
  rationale: Walaupun bentuk konsonantalnya tidak memakai ejaan feminin lengkap, verba feminin sesudahnya memastikan bahwa yang dimaksud ialah seorang perempuan muda.
- source_word: עַל דְּבַר אֲשֶׁר לֹא צָעֲקָה בָעִיר
  choice: karena ia tidak berteriak di dalam kota
  rationale: Mempertahankan alasan hukum yang dinyatakan teks dan verba konkret ‘berteriak’, tanpa menambahkan kesimpulan etis di luar ayat.
- source_word: עִנָּה
  choice: menodai
  rationale: Dalam konteks hukum seksual, verba ini mengandung unsur pelanggaran dan penghinaan seksual. ‘Menodai’ mempertahankan keluasan maknanya tanpa menyamakannya secara pasti dengan satu istilah hukum modern.
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: istri sesamanya
  rationale: ‘Sesama’ secara alami mempertahankan kategori hubungan sosial רֵעַ dan menghindari penyempitan menjadi tetangga tempat tinggal.
- source_word: וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: Demikianlah kamu harus menyingkirkan kejahatan dari tengah-tengahmu
  rationale: Menyampaikan rumusan hukum berulang dalam Ulangan dengan bahasa Indonesia yang jelas dan tetap bernada yudisial.
theological_decisions:
- issue: Alasan hukum mengenai perempuan muda itu
  choice: karena ia tidak berteriak di dalam kota
  alternative: karena ia tidak berteriak meminta tolong di dalam kota
  rationale: Teks hanya menyebut bahwa ia tidak berteriak; tambahan ‘meminta tolong’ mungkin tersirat oleh konteks, tetapi tidak perlu dimasukkan ke teks utama.
- issue: Makna עִנָּה dalam konteks hukum seksual
  choice: menodai
  alternative: memperkosa; merendahkan; memperlakukan dengan kejam
  rationale: Verba tersebut menyatakan pelanggaran yang disertai perendahan, tetapi ayat ini tidak memakai istilah yang secara leksikal identik dengan satu kategori hukum modern. Pilihan ini menjaga bobot tindakan sekaligus ambiguitas sumber.
- issue: Hubungan tindakan rajam dengan kematian
  choice: melempari mereka dengan batu sampai mati
  alternative: melempari mereka dengan batu, dan mereka akan mati
  rationale: Susunan ini menyampaikan akibat nyata dari tindakan itu secara idiomatis tanpa mengubah ketetapan hukum atau memberi tafsiran doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang khidmat. Pronomina ‘kamu’ dipertahankan karena perintah ditujukan kepada umat secara kolektif, sedangkan bentuk ‘-mu’ pada akhir ayat mencerminkan orang kedua tunggal kolektif dalam teks Ibrani.
