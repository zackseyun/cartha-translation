- from: 'Kemudian kamu harus membawa keduanya ke pintu gerbang kota itu[a], lalu melempari mereka dengan batu sampai mati: perempuan muda itu karena ia tidak berteriak di dalam kota, dan laki-laki itu karena ia telah menodai istri sesamanya[b]. Demikianlah kamu harus menyingkirkan kejahatan dari tengah-tengahmu.'
