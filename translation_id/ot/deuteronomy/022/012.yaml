  text: גְּדִלִ֖ים תַּעֲשֶׂה לָּ֑/ךְ עַל אַרְבַּ֛ע כַּנְפ֥וֹת כְּסוּתְ/ךָ֖ אֲשֶׁ֥ר תְּכַסֶּה בָּֽ/הּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/012.yaml
  text: You shall make tassels for yourself on the four corners of your covering with which you cover yourself[a][b].
translation:
  language: id
  text: Buatlah jumbai-jumbai[a] pada keempat sudut kain penutupmu[b] yang kamu pakai untuk menutupi tubuhmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tali-tali pintal” atau “rumbai-rumbai.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “penutupmu”; dapat juga diterjemahkan “pakaianmu” atau “jubahmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: גְּדִלִים
  choice: jumbai-jumbai
  rationale: Dalam konteks pakaian, kata ini menunjuk pada untaian atau rumbai yang dipasang pada kain. “Jumbai-jumbai” alami dalam bahasa Indonesia dan tidak terlalu membatasi bentuknya; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: תַּעֲשֶׂה לָּךְ
  choice: Buatlah
  rationale: Bentuk imperfek dalam konteks hukum menyatakan perintah. Unsur לָּךְ dapat dipahami sebagai kepentingan diri sendiri, tetapi dalam bahasa Indonesia sudah tersirat oleh bentuk posesif “-mu” dan tidak perlu diungkapkan secara kaku sebagai “bagi dirimu sendiri”.
- source_word: עַל אַרְבַּע כַּנְפוֹת
  choice: pada keempat sudut
  rationale: כָּנָף secara dasar dapat berarti sayap atau ujung, tetapi untuk kain segi empat paling wajar berarti sudut-sudutnya.
- source_word: כְּסוּתְךָ
  choice: kain penutupmu
  rationale: Pilihan ini mempertahankan arti umum sesuatu yang dipakai sebagai penutup tanpa memastikan bahwa benda itu harus berupa jenis pakaian tertentu seperti jubah.
- source_word: אֲשֶׁר תְּכַסֶּה בָּהּ
  choice: yang kamu pakai untuk menutupi tubuhmu
  rationale: Klausa ini menjelaskan fungsi kain penutup. Penambahan “tubuhmu” membuat objek tersirat dari kata kerja refleksif itu jelas dan alami dalam bahasa Indonesia tanpa menentukan cara pemakaiannya secara lebih sempit.
theological_decisions: []
