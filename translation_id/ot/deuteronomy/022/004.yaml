  yaml_path: translation/ot/deuteronomy/022/004.yaml
  text: You shall not see your brother’s donkey or his ox fallen on the road and ignore them[a]; you must surely lift them up with him.
translation:
  language: id
  text: Janganlah engkau melihat keledai saudaramu atau lembunya yang terjatuh di jalan, lalu mengabaikannya; engkau harus sungguh-sungguh mengangkatnya bersama dia.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “engkau harus sungguh-sungguh mengangkatnya bersama dia.” Ungkapan ini menekankan bahwa engkau harus bekerja bersama pemiliknya, bukan membiarkannya tanpa pertolongan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָחִיךָ
  choice: saudaramu
  rationale: Mempertahankan ungkapan harfiah Ibrani dan nuansa kekeluargaan dalam komunitas perjanjian; dalam konteks ini yang dimaksud ialah sesama anggota umat.
- source_word: חֲמוֹר
  choice: keledai
  rationale: Padanan Indonesia modern yang umum dan tepat untuk hewan tersebut.
- source_word: שׁוֹרוֹ
  choice: lembunya
  rationale: Kata Indonesia 'lembu' sesuai untuk שׁוֹר dalam konteks hukum mengenai hewan ternak atau hewan pekerja tanpa mempersempitnya menjadi hanya lembu jantan.
- source_word: נֹפְלִים
  choice: terjatuh
  rationale: Menggambarkan hewan yang telah jatuh atau roboh di jalan, mungkin karena beban atau kelelahan, tanpa menambahkan penyebab yang tidak disebutkan.
- source_word: בַּדֶּרֶךְ
  choice: di jalan
  rationale: Ungkapan alami dalam bahasa Indonesia untuk lokasi kejadian.
- source_word: וְהִתְעַלַּמְתָּ מֵהֶם
  choice: lalu mengabaikannya
  rationale: Bentuk hitpael dari עלם secara idiomatis berarti sengaja tidak menghiraukan. Kata ganti tunggal kolektif dalam bahasa Indonesia merujuk pada keledai atau lembu yang terlihat.
- source_word: הָקֵם תָּקִים
  choice: engkau harus menolongnya berdiri
  rationale: Gabungan infinitif absolut dan verba finit menegaskan kewajiban. 'Menolongnya berdiri' menyampaikan tindakan mengangkat atau menegakkan hewan secara alami dalam bahasa Indonesia.
- source_word: עִמּוֹ
  choice: bersama-sama dengan dia
  rationale: Mempertahankan secara eksplisit gagasan tindakan bersama pemilik yang terdapat dalam teks Ibrani.
