  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'engkau' mempertahankan sapaan tunggal dalam hukum, sedangkan struktur kalimat dibuat alami tanpa menghilangkan penegasan perintah atau tindakan bersama pemilik.
