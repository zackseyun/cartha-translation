  text: וְ/עָנְשׁ֨וּ אֹת֜/וֹ מֵ֣אָה כֶ֗סֶף וְ/נָתְנוּ֙ לַ/אֲבִ֣י הַֽ/נַּעֲרָ֔ה כִּ֤י הוֹצִיא֙ שֵׁ֣ם רָ֔ע עַ֖ל בְּתוּלַ֣ת יִשְׂרָאֵ֑ל וְ/לֽ/וֹ תִהְיֶ֣ה לְ/אִשָּׁ֔ה לֹא יוּכַ֥ל לְ/שַּׁלְּחָ֖/הּ כָּל יָמָֽי/ו־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/019.yaml
  text: Then they shall fine him one hundred shekels of silver and give them to the father of the young woman[a], because he has brought a bad name upon a virgin of Israel. And she shall be his wife; he may not send her away all his days.
translation:
  language: id
  text: Lalu mereka harus mendenda laki-laki itu seratus syikal perak dan memberikannya kepada ayah perempuan muda itu, karena ia telah merusak nama baik seorang perawan Israel. Perempuan itu harus menjadi istrinya; ia tidak boleh mengusirnya sepanjang hidupnya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menceraikannya.” Ungkapan Ibrani secara harfiah berarti “mengusirnya” atau “menyuruhnya pergi” dan lazim digunakan untuk tindakan menceraikan dalam konteks hukum perkawinan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנְשׁוּ
  choice: mendenda
  rationale: Dalam konteks hukum ini, kata kerja tersebut menunjuk pada pengenaan hukuman berupa pembayaran uang, bukan hukuman secara umum.
- source_word: מֵאָה כֶסֶף
  choice: seratus syikal perak
  rationale: Teks Ibrani secara harfiah berbunyi 'seratus perak'; dalam konteks ekonomi-hukum, bilangan ini mengacu pada satuan berat perak. 'Syikal' dilengkapi agar jumlahnya jelas bagi pembaca.
- source_word: לַאֲבִי הַנַּעֲרָה
  choice: kepada ayah perempuan muda tersebut
  rationale: נַעֲרָה menunjuk pada perempuan muda yang telah mencapai usia menikah. Pilihan ini wajar dalam bahasa Indonesia modern dan tidak bernuansa arkais.
- source_word: כִּי הוֹצִיא שֵׁם רָע
  choice: karena ia telah mencemarkan nama
  rationale: Ungkapan Ibrani berarti mendatangkan nama atau reputasi buruk atas seseorang. 'Mencemarkan nama' menyampaikan gagasan pencemaran reputasi secara alami tanpa membatasi maknanya pada istilah hukum tertentu.
- source_word: עַל בְּתוּלַת יִשְׂרָאֵל
  choice: seorang perawan Israel
  rationale: בְּתוּלָה dalam konteks tuduhan hukum ini berarti perawan, sedangkan 'Israel' mempertahankan kaitannya dengan komunitas perjanjian.
- source_word: וְלוֹ תִהְיֶה לְאִשָּׁה
  choice: Perempuan itu harus menjadi istrinya
  rationale: Konstruksi ini menetapkan status perkawinan yang diwajibkan secara hukum. 'Harus menjadi istrinya' menyampaikan daya normatifnya tanpa menambahkan gagasan yang tidak dinyatakan.
- source_word: לֹא יוּכַל
  choice: tidak boleh
  rationale: Dalam bahan hukum, bentuk ini menyatakan larangan atau ketidakmampuan secara hukum, bukan sekadar ketidakmampuan fisik.
- source_word: לְשַׁלְּחָהּ
  choice: menyuruhnya pergi
  rationale: Kata kerja Ibrani secara harfiah berarti menyuruh atau mengirim pergi. Dalam hukum perkawinan ungkapan ini dapat berarti menceraikan, tetapi teks utama mempertahankan gambaran sumber dan mencatat arti hukumnya dalam catatan kaki.
- source_word: כָּל יָמָיו
  choice: sepanjang hidupnya
  rationale: Ungkapan harfiah 'seluruh hari-harinya' merupakan idiom Ibrani untuk jangka waktu seumur hidup; pilihan ini jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Ungkapan hukum untuk pembubaran perkawinan
  choice: menyuruhnya pergi
  alternative: menceraikannya
  rationale: Ungkapan Ibrani mempertahankan gambaran tindakan menyuruh istri pergi, tetapi dalam konteks hukum perkawinan dapat secara khusus menunjuk pada perceraian. Teks utama menjaga bentuk ungkapannya, sedangkan catatan kaki menyajikan arti hukum yang lebih eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan corak hukum yang jelas. Rujukan pronominal diperjelas seperlunya, dan satuan 'syikal' dilengkapi untuk menerangkan konstruksi eliptis dalam teks Ibrani. Penanda catatan kaki ditempatkan pada ungkapan yang benar-benar diterangkannya.
