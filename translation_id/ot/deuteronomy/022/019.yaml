revisions:
- from: Lalu mereka harus mendenda laki-laki itu seratus syikal perak dan memberikan uang itu kepada ayah perempuan muda tersebut, karena ia telah mencemarkan nama seorang perawan Israel. Perempuan itu harus menjadi istrinya; sepanjang hidupnya ia tidak boleh menyuruhnya pergi[a].
  to: Lalu mereka harus mendenda laki-laki itu seratus syikal perak dan memberikannya kepada ayah perempuan muda itu, karena ia telah merusak nama baik seorang perawan Israel. Perempuan itu harus menjadi istrinya; ia tidak boleh mengusirnya sepanjang hidupnya[a].
  rationale: Revisi memperjelas idiom Ibrani tentang reputasi dengan "merusak nama baik" dan memakai "mengusirnya" untuk bentuk yang lebih alami dalam larangan hukum perkawinan. Catatan kaki mempertahankan alternatif eksplisit "menceraikannya" serta makna harfiah ungkapan Ibrani.
