  text: וְ֠/נָתַן הָ/אִ֨ישׁ הַ/שֹּׁכֵ֥ב עִמָּ֛/הּ לַ/אֲבִ֥י ה/נער חֲמִשִּׁ֣ים כָּ֑סֶף וְ/לֽ/וֹ תִהְיֶ֣ה לְ/אִשָּׁ֗ה תַּ֚חַת אֲשֶׁ֣ר עִנָּ֔/הּ לֹא יוּכַ֥ל שַׁלְּחָ֖/ה כָּל יָמָֽי/ו־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/029.yaml
  text: Then the man who lay with her shall give fifty shekels of silver to the young woman's father[a], and she shall become his wife because he has violated her[b]. He may not send her away all his days.
translation:
  language: id
  text: Lalu laki-laki yang telah bersetubuh dengan perempuan itu harus memberikan lima puluh syikal perak kepada ayah perempuan muda itu. Perempuan itu harus menjadi istrinya karena laki-laki itu telah melakukan pelanggaran seksual terhadapnya.[a] Ia tidak boleh menceraikannya sepanjang hidupnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “telah merendahkan/menghinakannya.” Dalam konteks ini, verba Ibrani tersebut menunjuk pada perlakuan yang merendahkan dalam kaitan dengan hubungan seksual.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menyuruhnya pergi”; dalam konteks perkawinan, maksudnya menceraikan atau memberhentikannya sebagai istri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: Lalu ... harus memberikan
  rationale: Waw dengan bentuk perfektif dalam ketentuan hukum melanjutkan rangkaian keputusan. “Lalu” menyatakan urutan, sedangkan “harus” mempertahankan daya wajibnya.
- source_word: הָאִישׁ הַשֹּׁכֵב עִמָּהּ
  choice: laki-laki yang telah bersetubuh dengannya
  rationale: Partisipel itu mengenali laki-laki berdasarkan hubungan seksual yang telah dilakukan. “Bersetubuh” jelas, wajar, dan tidak sekasual ungkapan “tidur dengan” dalam bahasa Indonesia.
- source_word: לַאֲבִי הַנַּעֲרָ
  choice: kepada ayah perempuan muda itu
  rationale: נַעֲרָה menunjuk kepada seorang perempuan muda atau gadis pada usia menikah. “Perempuan muda” mempertahankan cakupan usia/status tanpa memberi kesan bahwa ia anak kecil.
- source_word: חֲמִשִּׁים כָּסֶף
  choice: lima puluh syikal perak
  rationale: Secara harfiah teks berbunyi “lima puluh perak”, tetapi dalam konteks ekonomi-hukum yang dimaksud ialah bobot perak; “syikal” melengkapi satuan yang tersirat.
- source_word: וְלוֹ תִהְיֶה לְאִשָּׁה
  choice: Perempuan itu harus menjadi istrinya
  rationale: Klausa ini menetapkan status perkawinan sebagai hasil ketentuan hukum. Rumusan ini alami dan tidak menambahkan gagasan kepemilikan.
- source_word: תַּחַת אֲשֶׁר
  choice: karena
  rationale: Dalam rumusan hukum ini frasa tersebut memperkenalkan alasan bagi ketentuan yang menyusul.
- source_word: עִנָּהּ
  choice: telah menistakannya
  rationale: Bentuk piel dari ענה di sini menyatakan perlakuan yang merendahkan dan melanggar perempuan itu dalam konteks seksual. “Menistakannya” mempertahankan bobot serius kata tersebut tanpa membuat verba ini lebih spesifik daripada bahasa Ibraninya.
- source_word: לֹא יוּכַל שַׁלְּחָהּ
  choice: Ia tidak boleh menceraikannya
  rationale: Secara harfiah frasa ini berarti bahwa ia tidak dapat atau tidak boleh “menyuruhnya pergi”. Dalam konteks hubungan suami-istri, tindakan itu berarti menceraikan atau mengusir istri; “menceraikannya” menyampaikan maksud hukum secara jelas.
- source_word: כָּל יָמָיו
  choice: sepanjang hidupnya
  rationale: Ungkapan Ibrani “seluruh hari-harinya” merupakan idiom untuk jangka waktu seumur hidup.
theological_decisions:
- issue: Cara menerjemahkan עִנָּהּ tanpa mengecilkan pelanggaran seksual atau menentukan secara berlebihan sifat tindakan itu
  choice: telah menistakannya
  alternative: telah merendahkannya; telah menghinakannya; telah memperkosanya
  rationale: Verba ענה menekankan tindakan merendahkan atau menistakan, dan konteksnya jelas bersifat seksual. “Menistakannya” menyampaikan keseriusan pelanggaran itu, sedangkan “memperkosanya” akan mengunci tingkat kekerasan yang tidak dinyatakan oleh verba ini sendiri, meskipun konteks ayat sebelumnya tetap harus diperhitungkan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah “bersetubuh” dipilih agar tindakan seksual dinyatakan dengan jelas tanpa nada vulgar; “menistakannya” mempertahankan ketegangan leksikal verba Ibrani dan dijelaskan melalui catatan kaki.
