  terminology: “Syikal perak,” “perempuan muda,” dan “menceraikannya” sesuai dengan register hukum-biblika modern. Catatan mengenai “menyuruhnya pergi” tepat untuk menjaga hubungan dengan ungkapan Ibrani dan makna perceraian dalam konteks ini.
