  yaml_path: translation/ot/deuteronomy/022/010.yaml
  text: You shall not plow with an ox and a donkey together[a].
translation:
  language: id
  text: Jangan membajak dengan lembu dan keledai bersama-sama.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Engkau tidak boleh membajak dengan lembu dan keledai bersama-sama.”
    reason: Alternatif ini mempertahankan corak larangan hukum yang lebih formal.
lexical_decisions:
- source_word: לֹא תַחֲרֹשׁ
  choice: Jangan membajak
  rationale: Negasi לֹא dengan bentuk imperfek orang kedua tunggal berfungsi sebagai larangan langsung. Bentuk imperatif negatif ini alami dalam bahasa Indonesia modern dan tetap mempertahankan daya hukum ayat.
- source_word: בְּשׁוֹר
  choice: dengan lembu
  rationale: שׁוֹר menunjuk pada hewan sapi yang digunakan untuk kerja; dalam konteks membajak, 'lembu' merupakan padanan Indonesia yang jelas dan lazim.
- source_word: וּבַחֲמֹר
  choice: dan keledai
  rationale: חֲמוֹר adalah istilah umum untuk keledai. Kata 'dan' mempertahankan penggabungan kedua jenis hewan dalam larangan ini.
- source_word: יַחְדָּו
  choice: bersama-sama
  rationale: Adverbia ini menyatakan bahwa kedua hewan dipakai secara bersamaan, yakni sebagai pasangan dalam pekerjaan membajak.
theological_decisions:
- issue: Daya larangan dalam hukum perjanjian
  choice: 'Diterjemahkan sebagai larangan langsung: ''Jangan membajak ...'''
  alternative: '''Engkau tidak boleh membajak ...'''
  rationale: Bahasa sumber menyampaikan larangan hukum kepada orang kedua tunggal. 'Jangan' paling alami dan tegas dalam bahasa Indonesia modern, sedangkan alternatifnya lebih menonjolkan corak formal. Tidak ada persoalan doktrinal yang diputuskan oleh pilihan ini.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk 'Jangan' dipilih agar larangan terdengar alami tanpa mengurangi ketegasan hukum. Penanda catatan kaki [a] dicantumkan dalam teks utama.
