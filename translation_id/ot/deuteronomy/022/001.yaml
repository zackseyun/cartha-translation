base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/001.yaml
  text: You shall not see your brother’s ox or his sheep driven away and ignore them; you must certainly return them to your brother.
translation:
  language: id
  text: Janganlah engkau melihat sapi atau ternak kecil[a] milik saudaramu yang tersesat lalu mengabaikannya. Engkau harus mengembalikannya kepada saudaramu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: domba atau kambing.'
    reason: Kata Ibrani שֵׂה mencakup seekor hewan dari kawanan domba atau kambing.
lexical_decisions:
- source_word: שׁוֹר
  choice: sapi
  rationale: Istilah ini menunjuk pada hewan jenis sapi; dalam konteks hukum tentang hewan yang hilang, kata umum “sapi” lebih alami daripada “lembu” dalam bahasa Indonesia modern.
- source_word: שֵׂה
  choice: ternak kecil
  rationale: Kata Ibrani ini dapat menunjuk pada domba atau kambing. “Ternak kecil” mempertahankan cakupan maknanya tanpa membatasi pada salah satu jenis.
- source_word: נִדָּחִים
  choice: tersesat
  rationale: Partisipel pasif ini menggambarkan hewan yang menyimpang, tercerai, atau terbawa menjauh. Dalam konteks kewajiban mengembalikan hewan milik sesama, “tersesat” menyampaikan keadaan hewan yang berada jauh dari pemiliknya tanpa menetapkan penyebabnya.
- source_word: וְהִתְעַלַּמְתָּ מֵהֶם
  choice: lalu mengabaikannya
  rationale: Ungkapan Ibrani secara harfiah berarti menyembunyikan diri atau berpaling dari hewan-hewan itu. “Mengabaikannya” menyampaikan tindakan sengaja tidak memedulikan yang dilarang.
- source_word: הָשֵׁב תְּשִׁיבֵם
  choice: Engkau harus mengembalikan
  rationale: Bentuk infinitif absolut diikuti verba seakar memberi penegasan pada kewajiban. “Harus” menyampaikan penegasan tersebut secara wajar dalam bahasa Indonesia.
- source_word: אָחִיךָ
  choice: saudaramu
  rationale: Padanan ini mempertahankan bahasa kekerabatan dalam teks dan dapat mencakup sesama anggota umat, bukan hanya saudara kandung.
theological_decisions:
- issue: Cakupan kata “saudara” dalam hukum perjanjian
  choice: Mempertahankan “saudaramu”
  alternative: “sesamamu” atau “rekan sebangsamu”
  rationale: Teks Ibrani memakai istilah kekerabatan אָח. Terjemahan “saudaramu” mempertahankan metafora perjanjian dan tidak mempersempit atau memperluas cakupannya secara interpretatif.
- issue: Penyebab hewan berada jauh dari pemiliknya
  choice: “tersesat”
  alternative: “dihalau pergi” atau “tercerai-berai”
  rationale: Bentuk Ibrani bersifat pasif dan dapat mencakup keadaan tersesat atau terusir. Konteks tidak menyebut pelaku yang menghalau; “tersesat” menjaga fokus pada keadaan hewan tanpa menambahkan penyebab tertentu.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bernada hukum. Bentuk “engkau” dipakai untuk mempertahankan sapaan tunggal dalam teks Ibrani serta gaya bermartabat. Pengulangan Ibrani yang menegaskan kewajiban disampaikan dengan kata “harus” agar alami.
