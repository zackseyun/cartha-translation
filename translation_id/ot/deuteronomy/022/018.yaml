  text: Then the elders of that city shall take the man and discipline him,[a]
translation:
  language: id
  text: Kemudian para tua-tua kota itu harus mengambil laki-laki itu dan menghukumnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mendisiplinkannya”, “menegurnya dengan keras”, atau mungkin “mencambuknya”. Kata kerja Ibrani ini memiliki makna luas untuk tindakan korektif atau penghukuman; kata kerja itu sendiri tidak menyebutkan bentuk hukumannya secara tepat, meskipun konteks hukum di sekitarnya membantu menjelaskan sifat tindakan tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: harus membawa
  rationale: Bentuk Qal dari לקח pada dasarnya berarti ‘mengambil’. Dalam konteks hukum ini, ‘membawa’ terdengar alami dalam bahasa Indonesia dan menyatakan bahwa orang itu dibawa ke bawah wewenang para tua-tua tanpa mempertegas adanya kekerasan seperti ‘menangkap’.
- source_word: זִקְנֵי
  choice: para tua-tua
  rationale: Dalam konteks hukum kemasyarakatan, זקנים menunjuk kepada para pemimpin masyarakat yang diakui, bukan sekadar laki-laki lanjut usia. ‘Para tua-tua’ mempertahankan sebutan kelembagaan yang lazim dalam bahasa Alkitab Indonesia.
- source_word: הָעִיר הַהִוא
  choice: kota itu
  rationale: עיר menunjuk kepada permukiman sekaligus wilayah hukum setempat, sedangkan הַהִוא mempertahankan penunjukan khusus ‘itu’.
- source_word: הָאִישׁ
  choice: laki-laki tersebut
  rationale: איש secara harfiah berarti ‘laki-laki’ dan dalam konteks ini mengacu kepada suami yang dituduh pada ayat-ayat sebelumnya. ‘Tersebut’ memperjelas rujukannya tanpa mengganti istilah sumber dengan ‘suami’.
- source_word: וְיִסְּרוּ אֹתוֹ
  choice: dan menghukumnya
  rationale: יסר mencakup tindakan mendisiplinkan, menghajar, mengoreksi, atau menghukum. Dalam konteks ketentuan hukum, ‘menghukumnya’ paling alami dan jelas bagi pembaca Indonesia, sementara catatan kaki mempertahankan keluasan makna serta ketidakpastian mengenai bentuk hukumannya.
theological_decisions:
- issue: Bentuk tindakan yang dinyatakan oleh יסר
  choice: Tidak menetapkan bahwa tindakan itu berupa hukuman fisik
  alternative: Menerjemahkannya sebagai ‘mencambuknya’ atau ‘menghajarnya’
  rationale: Kata kerja Ibrani itu sendiri mempunyai cakupan luas, sedangkan konteks hukum berikutnya menyebut denda tetapi tidak secara tegas menjelaskan bahwa verba ini berarti pencambukan. Terjemahan tidak boleh mempersempit ambiguitas tersebut.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. ‘Para tua-tua’ dipertahankan sebagai istilah kelembagaan yang dikenal dalam register Alkitab, sementara ‘membawa’ dan ‘menghukumnya’ dipilih agar ayat tetap alami bagi pembaca umum.
