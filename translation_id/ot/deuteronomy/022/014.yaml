  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/שָׂ֥ם לָ/הּ֙ עֲלִילֹ֣ת דְּבָרִ֔ים וְ/הוֹצִ֥יא עָלֶ֖י/הָ שֵׁ֣ם רָ֑ע וְ/אָמַ֗ר אֶת הָ/אִשָּׁ֤ה הַ/זֹּאת֙ לָקַ֔חְתִּי וָ/אֶקְרַ֣ב אֵלֶ֔י/הָ וְ/לֹא מָצָ֥אתִי לָ֖/הּ בְּתוּלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/014.yaml
  text: and he charges her with false accusations and brings a bad name upon her[a], saying, ‘I took this woman, and when I came near to her[d][c][b], I did not find evidence of virginity in her.’
translation:
  language: id
  text: lalu menuduhkan perbuatan tercela kepadanya[a] dan mencemarkan nama baiknya dengan berkata, “Aku telah memperistri perempuan ini, tetapi ketika aku menghampirinya[b], aku tidak mendapati padanya bukti keperawanan[c].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibraninya dapat juga diterjemahkan “mengajukan tuduhan-tuduhan terhadapnya.” Dalam konteks ini tuduhan tersebut merusak nama baik perempuan itu; kata “palsu” tersirat dari perkara yang sedang dibahas, tetapi tidak dinyatakan secara langsung dalam frasa ini.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mendekatinya”; sebuah ungkapan halus untuk hubungan seksual.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “tidak mendapati keperawanan padanya.” Dalam konteks ini yang dimaksud ialah bukti atau tanda keperawanan, seperti dijelaskan dalam ayat-ayat berikutnya.
    reason: cross_reference
lexical_decisions:
- source_word: וְשָׂם לָהּ עֲלִילֹת דְּבָרִים
  choice: lalu menuduhkan perbuatan tercela kepadanya
  rationale: Ungkapan Ibrani ini menunjuk pada tuduhan mengenai perilaku buruk. Terjemahan ini menyampaikan fungsi hukumnya secara alami tanpa memasukkan kata 'palsu' ke dalam teks utama, sebab kepalsuan tuduhan ditentukan oleh konteks perkara, bukan dinyatakan secara eksplisit dalam frasa ini.
- source_word: וְהוֹצִיא עָלֶיהָ שֵׁם רָע
  choice: dan mencemarkan nama baiknya
  rationale: Secara harfiah ungkapan ini berarti 'mengeluarkan nama buruk atasnya'; pilihan ini mempertahankan makna idiomatis berupa perusakan reputasi dalam bahasa Indonesia yang wajar.
- source_word: הָאִשָּׁה הַזֹּאת לָקַחְתִּי
  choice: Aku telah memperistri perempuan ini
  rationale: Dalam konteks perkawinan, לָקַחְתִּי berarti mengambil seorang perempuan sebagai istri. 'Memperistri' mengungkapkan maksud tersebut secara jelas, sedangkan 'perempuan ini' mempertahankan nada demonstratif dan berjarak dari teks sumber.
- source_word: וָאֶקְרַב אֵלֶיהָ
  choice: ketika aku menghampirinya
  rationale: Teks Ibrani memakai ungkapan halus yang secara harfiah berarti mendekati, tetapi dalam konteks ini mengacu pada hubungan seksual. 'Menghampirinya' mempertahankan gaya eufemistis sumber.
- source_word: וְלֹא מָצָאתִי לָהּ בְּתוּלִים
  choice: aku tidak mendapati padanya bukti keperawanan
  rationale: Bentuk jamak בְּתוּלִים dalam perkara hukum ini mengacu pada bukti atau tanda keperawanan, sebagaimana dijelaskan oleh ayat-ayat berikutnya. 'Bukti keperawanan' menyampaikan nuansa forensik tanpa menganggap tuduhan itu benar.
