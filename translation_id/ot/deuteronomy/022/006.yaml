base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/006.yaml
  text: If a bird’s nest happens to be before you on the way[a], in any tree or on the ground, with young ones or eggs, and the mother is sitting on the young ones or on the eggs[b], you shall not take the mother along with the young.
translation:
  language: id
  text: Jika dalam perjalanan kamu kebetulan menemukan sarang burung di pohon mana pun atau di tanah, yang berisi anak-anak burung atau telur, dan induknya sedang berada di atas anak-anak burung atau telur itu, janganlah mengambil induknya bersama anak-anaknya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “induk di atas anak-anak.” Dalam ungkapan ini, maksudnya adalah mengambil induk itu bersama keturunannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִקָּרֵא
  choice: Jika ... kebetulan menemukan
  rationale: כִּי memperkenalkan syarat hukum kasuistis, sedangkan bentuk Nifal יִקָּרֵא menunjukkan perjumpaan yang terjadi secara kebetulan, bukan pencarian yang disengaja.
- source_word: קַן צִפּוֹר
  choice: sarang burung
  rationale: Padanan Indonesia yang alami dan tepat bagi frasa konstruksi Ibrani.
- source_word: לְפָנֶיךָ בַּדֶּרֶךְ
  choice: dalam perjalanan kamu ... menemukan
  rationale: Mengungkapkan bahwa sarang itu dijumpai di jalur perjalanan seseorang; susunan diubah secara wajar dalam bahasa Indonesia tanpa menghilangkan gagasan perjumpaan.
- source_word: בְּכָל עֵץ אוֹ עַל הָאָרֶץ
  choice: di pohon mana pun atau di tanah
  rationale: הָאָרֶץ menunjuk secara konkret pada permukaan tanah, sedangkan בְּכָל עֵץ mencakup pohon mana pun.
- source_word: אֶפְרֹחִים
  choice: anak-anak burung
  rationale: Jelas bagi pembaca umum dan tidak mempersempit tahap perkembangan seperti 'piyik' atau 'anak burung yang baru menetas'.
- source_word: וְהָאֵם רֹבֶצֶת
  choice: induknya sedang mengerami
  rationale: Dalam konteks burung yang berada di atas anak atau telur, 'mengerami' merupakan ungkapan Indonesia yang alami; kata ini mencakup posisi induk pada sarang tanpa menentukan lebih jauh tujuan biologisnya.
- source_word: לֹא תִקַּח
  choice: janganlah mengambil
  rationale: Menyampaikan larangan hukum secara langsung dengan ragam yang bermartabat dan mudah dipahami.
- source_word: הָאֵם עַל הַבָּנִים
  choice: induk bersama anak-anaknya
  rationale: Dalam idiom ini עַל dipahami sebagai pengambilan induk beserta keturunannya, bukan sekadar posisi induk di atas mereka.
