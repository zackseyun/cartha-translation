id: DEU.22.28
reference: Deuteronomy 22:28
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי יִמְצָ֣א אִ֗ישׁ נער בְתוּלָה֙ אֲשֶׁ֣ר לֹא אֹרָ֔שָׂה וּ/תְפָשָׂ֖/הּ וְ/שָׁכַ֣ב עִמָּ֑/הּ וְ/נִמְצָֽאוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/028.yaml
  text: If a man finds a young woman[a], a virgin who is not engaged, and seizes her and lies with her, and they are discovered[b],
translation:
  language: id
  text: Apabila seorang laki-laki mendapati seorang perempuan muda, seorang perawan yang belum bertunangan[a], lalu menangkapnya[b] dan tidur dengannya, dan keduanya kedapatan,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “belum dipertunangkan.”'
    reason: lexical_alternative
  - marker: b
    text: Kata kerja Ibrani ini dapat berarti “menangkap”, “mencengkeram”, atau “memegang”. Sebagian orang memahami klausa ini sebagai tindakan pemerkosaan; yang lain menilai bahwa nuansa hukumnya harus disimpulkan dari konteks yang lebih luas, bukan dari kata kerja ini saja.
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Apabila
  rationale: Memperkenalkan ketentuan hukum kasuistis. “Apabila” terdengar alami dan bermartabat dalam bahasa hukum Indonesia serta tetap mencakup nuansa “jika/ketika”.
- source_word: יִמְצָא
  choice: mendapati
  rationale: Menyampaikan arti dasar “menemukan” dalam konteks seseorang menjumpai atau mendapati orang lain, tanpa menambahkan gagasan mencari dengan sengaja.
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Mempertahankan jenis kelamin dan bentuk tunggal yang dinyatakan oleh nomina Ibrani.
- source_word: נער בְתוּלָה
  choice: seorang perempuan muda, seorang perawan
  rationale: Mempertahankan kedua unsur dalam ungkapan Ibrani, yaitu usia muda dan status keperawanan, tanpa memakai diksi arkais.
- source_word: אֲשֶׁר לֹא אֹרָשָׂה
  choice: yang belum bertunangan
  rationale: Mengungkapkan bahwa perempuan itu belum terikat dalam pertunangan resmi. “Bertunangan” merupakan padanan modern yang mudah dimengerti; nuansa formal “dipertunangkan” dicatat dalam catatan kaki.
- source_word: וּתְפָשָׂהּ
  choice: lalu menangkapnya
  rationale: Kata תפשׂ menyatakan tindakan menangkap, mencengkeram, atau memegang. “Menangkapnya” mempertahankan unsur tindakan fisik tanpa langsung menggantinya dengan sebuah kesimpulan hukum yang lebih khusus.
- source_word: וְשָׁכַב עִמָּהּ
  choice: dan tidur dengannya
  rationale: Mempertahankan idiom Ibrani bagi hubungan seksual dengan ungkapan Indonesia yang lazim dan cukup jelas dalam konteks ini.
- source_word: וְנִמְצָאוּ
  choice: dan keduanya kedapatan
  rationale: Bentuk pasif jamak menunjukkan bahwa keduanya atau perbuatan mereka diketahui. “Keduanya kedapatan” mempertahankan bentuk pasif dan rujukan jamaknya.
theological_decisions:
- issue: Apakah tindakan itu harus disebut secara eksplisit sebagai pemerkosaan dalam teks utama
  choice: Mempertahankan susunan leksikal “menangkapnya dan tidur dengannya”
  alternative: “memerkosanya” atau “mengambilnya”
  rationale: Arti תפשׂ mencakup menangkap, mencengkeram, atau memegang, tetapi kata itu sendiri tidak menyatakan seluruh kesimpulan hukum dengan satu istilah teknis. Terjemahan utama mempertahankan tindakan fisik yang disebut teks dan tidak melunakkannya menjadi sekadar “mengambil”, tetapi juga tidak menutup perdebatan konteks dengan memasukkan istilah interpretatif yang lebih sempit.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Struktur kalimat mempertahankan bentuk ketentuan hukum serta rangkaian tindakan dalam teks Ibrani. Istilah arkais dihindari, sementara ambiguitas leksikal dan ketegangan penafsiran dipertahankan melalui catatan kaki.
