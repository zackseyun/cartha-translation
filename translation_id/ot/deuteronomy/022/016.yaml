  yaml_path: translation/ot/deuteronomy/022/016.yaml
  text: And the young woman’s father shall say to the elders[a], ‘I gave my daughter to this man as a wife, and he hates her.’
translation:
  language: id
  text: Lalu ayah perempuan muda itu akan berkata kepada para tua-tua, “Aku telah memberikan putriku kepada laki-laki ini untuk menjadi istrinya, dan laki-laki ini membencinya.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan ia mulai membencinya.” Kata kerja Ibrani itu pada dasarnya berarti “membenci”; dalam konteks ini, kata itu dapat dipahami sebagai keadaan sekarang atau sebagai sikap yang telah berkembang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: Lalu ... harus berkata
  rationale: Dalam konteks hukum kasuistik, bentuk verba ini melanjutkan prosedur yang harus dilakukan, bukan sekadar menceritakan peristiwa lampau.
- source_word: אֲבִי הַנער
  choice: ayah perempuan muda itu
  rationale: Istilah tersebut menunjuk kepada seorang muda yang sudah berada dalam konteks perkawinan; “perempuan muda” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: הַזְּקֵנִים
  choice: para tua-tua
  rationale: Dalam konteks ini, istilah tersebut menunjuk kepada para pemimpin masyarakat yang menjalankan fungsi hukum, bukan sekadar orang-orang lanjut usia.
- source_word: אֶת בִּתִּי
  choice: anak perempuanku
  rationale: Ungkapan ini secara langsung berarti “anak perempuanku”; penanda objek אֶת tidak diterjemahkan tersendiri.
- source_word: נָתַתִּי
  choice: Aku telah memberikan
  rationale: Dalam pengaturan perkawinan, נָתַן menyatakan tindakan memberikan anak perempuan untuk dinikahkan. Bentuk “telah memberikan” sesuai dengan tindakan yang sudah terjadi dan kini dikemukakan sebagai dasar perkara.
- source_word: לָאִישׁ הַזֶּה
  choice: kepada laki-laki ini
  rationale: Terjemahan ini mempertahankan arti dasar אִישׁ dan penunjuk “ini”; status perkawinannya dijelaskan oleh frasa berikutnya.
- source_word: לְאִשָּׁה
  choice: untuk menjadi istrinya
  rationale: Ini merupakan ungkapan perkawinan yang secara alami berarti memberikan seseorang untuk menjadi istri laki-laki tersebut.
- source_word: וַיִּשְׂנָאֶהָ
  choice: dan ia membencinya
  rationale: שׂנא secara langsung berarti “membenci”. Bentuk kini menyatakan sikap laki-laki itu dalam pengaduan sang ayah, tanpa menambahkan gagasan perkembangan sikap yang tidak dinyatakan secara eksplisit.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Para tua-tua” dipakai sebagai istilah kelembagaan dalam konteks peradilan masyarakat. Penanda catatan kaki ditempatkan sesudah klausa yang diterangkannya, yaitu “ia membencinya”.
