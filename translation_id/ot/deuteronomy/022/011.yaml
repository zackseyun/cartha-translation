  text: You shall not wear cloth made of wool and linen together[a].
translation:
  language: id
  text: Janganlah engkau mengenakan kain yang terbuat dari campuran wol dan linen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “syaatnez, wol dan linen bersama-sama.” Istilah Ibrani yang langka ini merujuk pada kain dari gabungan kedua bahan tersebut.'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִלְבַּשׁ
  choice: Janganlah engkau mengenakan
  rationale: Bentuk larangan orang kedua tunggal diterjemahkan secara langsung dan wajar dalam bahasa Indonesia, dengan tetap mempertahankan sapaan tunggal.
- source_word: שַׁעַטְנֵז
  choice: kain campuran
  rationale: Kata Ibrani yang langka ini menunjuk pada bahan campuran terlarang; frasa berikutnya menjelaskan bahwa campuran tersebut terdiri dari wol dan linen.
- source_word: צֶמֶר
  choice: wol
  rationale: Padanan baku dalam konteks bahan tekstil.
- source_word: וּפִשְׁתִּים
  choice: dan linen
  rationale: Walaupun nomina ini dapat merujuk pada rami, konteks pakaian menunjuk pada tekstil yang dihasilkannya, yaitu linen.
- source_word: יַחְדָּו
  choice: campuran dari
  rationale: Gagasan bahwa kedua bahan dipakai bersama dalam satu kain diungkapkan secara alami melalui konstruksi 'kain campuran dari wol dan linen'.
