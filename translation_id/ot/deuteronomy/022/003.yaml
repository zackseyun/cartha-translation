    issue: שִׂמְלָתוֹ diterjemahkan “pakaiannya.”
    rationale: Istilah Ibrani ini umumnya menunjuk pakaian luar/selubung atau jubah, bukan pakaian secara umum. “Pakaian luarnya” mempertahankan makna konkret tanpa menetapkan model pakaian tertentu secara berlebihan.
  - severity: low
    issue: Catatan kaki menyebut “secara lebih harfiah,” tetapi mempertahankan modal larangan idiomatis “tidak boleh.”
    rationale: Bentuk harfiah ungkapan itu adalah “engkau tidak dapat menyembunyikan diri,” walaupun konteks hukumnya memang berfungsi sebagai larangan. Catatan kaki dapat membedakan citra harfiah ini dengan parafrasa praktisnya.
