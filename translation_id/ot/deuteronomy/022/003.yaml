base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/003.yaml
  text: And so you shall do with his donkey[a], and so you shall do with his cloak, and so you shall do with any lost thing of your brother that is lost from him and you find it; you may not ignore it.
translation:
  language: id
  text: Demikian juga harus kaulakukan terhadap keledainya; demikian juga harus kaulakukan terhadap pakaian luarnya; dan demikian juga harus kaulakukan terhadap setiap barang milik saudaramu yang hilang darinya lalu kautemukan. Engkau tidak boleh mengabaikannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “engkau tidak dapat menyembunyikan diri”; yakni, “engkau tidak boleh berpura-pura tidak melihatnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֵן
  choice: demikian juga
  rationale: Menandai kelanjutan dari ayat sebelumnya dan mempertahankan pengulangan khas bahasa hukum Ibrani.
- source_word: תַּעֲשֶׂה
  choice: harus kaulakukan
  rationale: Bentuk imperfek dalam konteks hukum memiliki daya perintah; pilihan ini tegas dan wajar dalam bahasa Indonesia modern.
- source_word: לַחֲמֹרוֹ
  choice: terhadap keledainya
  rationale: Mengacu pada cara menangani keledai milik saudara yang tersesat atau hilang dalam konteks sebelumnya.
- source_word: לְשִׂמְלָתוֹ
  choice: terhadap pakaiannya
  rationale: שִׂמְלָה menunjuk pada pakaian, sering kali pakaian luar. 'Pakaian' menjaga keluasan makna tanpa menetapkan bentuk tertentu seperti jubah.
- source_word: לְכָל אֲבֵדַת
  choice: terhadap setiap barang milik ... yang hilang
  rationale: Frasa ini memperluas ketentuan dari benda-benda yang disebutkan secara khusus kepada barang apa pun yang hilang.
- source_word: אָחִיךָ
  choice: saudaramu
  rationale: Mempertahankan istilah kekerabatan maskulin tunggal dalam teks Ibrani serta nuansa hubungan dalam komunitas perjanjian.
- source_word: אֲשֶׁר תֹּאבַד מִמֶּנּוּ
  choice: yang hilang darinya
  rationale: Mempertahankan bentuk pasif atau intransitif teks sumber dan tidak mengubahnya menjadi tindakan aktif pemilik.
- source_word: וּמְצָאתָהּ
  choice: lalu kautemukan
  rationale: 'Mengungkapkan urutan tindakan dengan alami: barang itu hilang dari pemiliknya, kemudian ditemukan oleh orang yang disapa.'
- source_word: לֹא תוּכַל
  choice: engkau tidak boleh
  rationale: Dalam konteks hukum, ungkapan ini menyatakan larangan, bukan ketidakmampuan fisik.
- source_word: לְהִתְעַלֵּם
  choice: mengabaikannya
  rationale: Menyampaikan daya praktis verba hitpael ini dalam bahasa Indonesia alami, sedangkan gambaran harfiahnya dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Makna אָחִיךָ dalam konteks hukum perjanjian
  choice: saudaramu
  alternative: sesamamu orang Israel; kerabatmu
  rationale: Teks memakai istilah kekerabatan maskulin tunggal yang juga dapat berfungsi bagi anggota komunitas perjanjian. Terjemahan utama mempertahankan ungkapan sumber tanpa mempersempitnya menjadi kerabat sedarah atau menggantinya dengan penjelasan interpretatif.
- issue: Daya ungkapan לֹא תוּכַל לְהִתְעַלֵּם
  choice: engkau tidak boleh mengabaikannya
  alternative: engkau tidak dapat menyembunyikan diri; jangan berpura-pura tidak melihatnya
  rationale: Dalam ketentuan hukum ini ungkapan tersebut melarang seseorang menghindari tanggung jawab. Terjemahan utama menyampaikan larangan itu secara idiomatis, sementara citra harfiahnya dicatat.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pengulangan 'demikian juga harus kaulakukan' dipertahankan untuk mencerminkan gaya hukum sumber. Bentuk 'engkau' dan klitik 'kau-' dipakai secara konsisten sebagai sapaan tunggal.
