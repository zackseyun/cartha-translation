  text: וְ/הִנֵּה ה֡וּא שָׂם֩ עֲלִילֹ֨ת דְּבָרִ֜ים לֵ/אמֹ֗ר לֹֽא מָצָ֤אתִי לְ/בִתְּ/ךָ֙ בְּתוּלִ֔ים וְ/אֵ֖לֶּה בְּתוּלֵ֣י בִתִּ֑/י וּ/פָֽרְשׂוּ֙ הַ/שִּׂמְלָ֔ה לִ/פְנֵ֖י זִקְנֵ֥י הָ/עִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/017.yaml
  text: and look[a], he has charged her with slanderous words, saying, “I did not find your daughter a virgin.” But these are the proofs of my daughter’s virginity[c][b]. And they shall spread out the garment before the elders of the city.
translation:
  language: id
  text: Dan lihatlah, ia telah mengajukan tuduhan palsu terhadap anak perempuanku dengan berkata, ‘Aku tidak mendapati anak perempuanmu masih perawan.’ Namun, inilah bukti keperawanan anak perempuanku.[a] Lalu mereka akan membentangkan kain itu[b] di hadapan para tua-tua kota.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi “inilah keperawanan-keperawanan anak perempuanku”; dalam konteks ini, bentuk jamak itu menunjuk pada tanda atau bukti keperawanannya.
    reason: lexical_alternative
  - marker: b
    text: Kain ini dibentangkan sebagai barang bukti dalam perkara tersebut; teks tidak menjelaskan lebih lanjut jenis kainnya.
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: Dan lihatlah
  rationale: Mempertahankan penanda wacana yang menarik perhatian para tua-tua kepada tuduhan suami, dengan ungkapan Indonesia yang wajar dan bermartabat.
- source_word: שָׂם עֲלִילֹת דְּבָרִים
  choice: ia telah mengajukan tuduhan palsu terhadap anak perempuanku
  rationale: Ungkapan ini berada dalam konteks hukum dan menunjuk pada dakwaan atau dalih yang mencemarkan. 'Mengajukan tuduhan palsu' mempertahankan nuansa forensik serta penilaian sang ayah atas tuduhan itu; objek 'anak perempuanku' dijelaskan dari konteks.
- source_word: לֹא מָצָאתִי לְבִתְּךָ בְּתוּלִים
  choice: Aku tidak mendapati anak perempuanmu masih perawan
  rationale: Bahasa Ibrani secara harfiah memakai bentuk jamak 'keperawanan-keperawanan' bagi anak perempuan itu. Terjemahan ini menyampaikan idiom tersebut secara alami sebagai klaim bahwa ia bukan perawan.
- source_word: וְאֵלֶּה בְּתוּלֵי בִתִּי
  choice: Namun, inilah bukti keperawanan anak perempuanku
  rationale: Bentuk jamak בְּתוּלִים dalam konteks perkara ini menunjuk pada tanda atau bukti yang diajukan untuk mendukung keperawanan anak perempuan tersebut. 'Namun' menyatakan pertentangan kontekstual terhadap tuduhan sebelumnya tanpa mengubah isi klausa.
- source_word: וּפָרְשׂוּ הַשִּׂמְלָה
  choice: Lalu mereka harus membentangkan kain itu
  rationale: Bentuk verbal menyatakan langkah prosedural berikutnya. שִׂמְלָה dapat berarti pakaian atau kain; 'kain' paling alami karena benda itu dibentangkan sebagai barang bukti, tanpa menentukan jenisnya secara lebih sempit.
- source_word: לִפְנֵי זִקְנֵי הָעִיר
  choice: di hadapan para tua-tua kota
  rationale: Mempertahankan rumusan yudisial yang menunjukkan bahwa bukti disajikan kepada para pemimpin sipil kota.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Bentuk aku/-ku dan -mu dipertahankan dalam kutipan langsung untuk mencerminkan sapaan orang kedua tunggal dalam teks Ibrani. Istilah hukum dibuat jelas tanpa memperinci sifat kain atau mekanisme pembuktiannya melampaui teks.
