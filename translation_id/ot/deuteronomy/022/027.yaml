  yaml_path: translation/ot/deuteronomy/022/027.yaml
  text: For he found her in the field[a]; the betrothed young woman cried out[b], but there was no one to rescue her.
translation:
  language: id
  text: Sebab laki-laki itu menemukannya di ladang[a]; perempuan muda yang bertunangan itu berteriak, tetapi tidak ada seorang pun yang menolongnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di daerah terbuka.” Ungkapan Ibrani ini menunjuk pada tempat pedesaan yang terbuka dan terpencil.
    reason: lexical_alternative
  - marker: b
    text: Atau “menyelamatkannya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan bagi keputusan hukum pada ayat sebelumnya; “sebab” mempertahankan hubungan penjelas secara alami.
- source_word: בַשָּׂדֶה
  choice: di padang
  rationale: Menunjuk pada tempat terbuka di wilayah pedesaan, yang dalam logika hukum bagian ini berarti jauh dari pertolongan yang mungkin mendengar.
- source_word: מְצָאָהּ
  choice: laki-laki itu menemukannya
  rationale: מצא pada dasarnya berarti “menemukan”; subjek laki-laki dibuat eksplisit agar rujukannya jelas dalam bahasa Indonesia.
- source_word: צָעֲקָה
  choice: telah berteriak
  rationale: צעק menyatakan seruan dalam bahaya atau untuk meminta pertolongan. Bentuk ini tidak mempersempit makna menjadi volume suara tertentu, sementara aspek sudah berlangsung dibuat jelas dalam konteks penjelasan hukum.
- source_word: הנער
  choice: perempuan muda
  rationale: Walaupun bentuk konsonantalnya dapat tampak tidak bertanda feminin, konteks, sufiks, dan status pertunangan jelas menunjuk kepada seorang perempuan muda.
- source_word: הַמְאֹרָשָׂה
  choice: yang sudah bertunangan
  rationale: Partisip pasif ini menyatakan status resmi sebagai perempuan yang telah dijanjikan dalam perkawinan; “sudah bertunangan” alami dalam bahasa Indonesia modern, sedangkan catatan kaki menjelaskan bobot hukumnya.
- source_word: וְאֵין מוֹשִׁיעַ לָהּ
  choice: tetapi tidak ada seorang pun yang menolongnya
  rationale: Klausa ini menyatakan tidak adanya orang yang dapat memberikan pertolongan. “Menolong” alami dan tidak menimbulkan nuansa teologis yang tidak diperlukan; alternatif “menyelamatkannya” dicatat.
theological_decisions:
- issue: Status hukum הַמְאֹרָשָׂה
  choice: yang sudah bertunangan
  alternative: yang telah dijanjikan untuk dinikahkan
  rationale: Pilihan utama mudah dipahami pembaca modern, sementara catatan kaki mempertahankan fakta bahwa pertunangan dalam konteks Israel kuno merupakan ikatan hukum yang lebih kuat daripada pertunangan modern.
- issue: Identitas gender הַנַּעַר dalam konteks
  choice: perempuan muda
  alternative: gadis
  rationale: Konteks gramatikal dan hukum menunjukkan referen perempuan. “Perempuan muda” akurat tanpa menyiratkan usia kanak-kanak atau memakai gaya arkais.
- issue: Daya klausa צָעֲקָה ... וְאֵין מוֹשִׁיעַ לָהּ
  choice: telah berteriak, tetapi tidak ada seorang pun yang menolongnya
  alternative: berteriak minta tolong, tetapi tidak ada seorang pun yang menyelamatkannya
  rationale: Terjemahan utama mempertahankan pernyataan teks tanpa menambahkan objek seruan secara eksplisit, sekaligus menyampaikan kontras pragmatis antara teriakan dan ketiadaan penolong.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan dua kalimat memperjelas alasan hukum. Istilah “bertunangan” dipilih demi keterbacaan, dengan nuansa hukum kunonya dijelaskan dalam catatan kaki. Catatan kaki c harus ditandai dalam teks; karena marker wajib muncul, teks publikasi seharusnya dibaca “yang sudah bertunangan[c] itu”.
