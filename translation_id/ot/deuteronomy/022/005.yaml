  text: לֹא יִהְיֶ֤ה כְלִי גֶ֨בֶר֙ עַל אִשָּׁ֔ה וְ/לֹא יִלְבַּ֥שׁ גֶּ֖בֶר שִׂמְלַ֣ת אִשָּׁ֑ה כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ כָּל עֹ֥שֵׂה אֵֽלֶּה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/005.yaml
  text: A woman shall not wear a man's article[a], and a man shall not put on a woman's garment, for everyone who does these things is an abomination to Yahweh your God.
translation:
  language: id
  text: Seorang perempuan tidak boleh mengenakan perlengkapan laki-laki[a], dan seorang laki-laki tidak boleh mengenakan pakaian perempuan, sebab setiap orang yang melakukan hal-hal ini adalah kekejian bagi Yahweh, Allahmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "pakaian laki-laki"; kata Ibrani pada klausa pertama lebih luas daripada kata khusus untuk "pakaian" pada klausa kedua.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי גֶבֶר
  choice: perlengkapan laki-laki
  rationale: כְלִי lebih luas daripada pakaian dan dapat menunjuk pada barang, alat, atau perlengkapan. Pilihan ini mempertahankan perbedaannya dari שִׂמְלָה pada klausa kedua tanpa menentukan bahwa yang dimaksud pasti senjata atau jenis barang tertentu.
- source_word: עַל אִשָּׁה
  choice: dikenakan oleh seorang perempuan
  rationale: Ungkapan harfiah 'ada di atas seorang perempuan' secara idiomatis menyatakan bahwa barang itu dipakai atau dikenakan pada tubuh; bentuk larangan aktif lebih alami dalam bahasa Indonesia.
- source_word: יִלְבַּשׁ
  choice: mengenakan
  rationale: Kata kerja ini berarti memakai atau mengenakan pakaian. 'Mengenakan' jelas, wajar, dan sesuai dengan ragam bahasa yang bermartabat.
- source_word: שִׂמְלַת אִשָּׁה
  choice: pakaian perempuan
  rationale: שִׂמְלָה menunjuk pada pakaian atau kain pakaian, sering kali pakaian luar. 'Pakaian' tidak mempersempit maknanya menjadi jenis tertentu seperti jubah.
- source_word: גֶּבֶר
  choice: laki-laki
  rationale: Dalam konteks ini גֶּבֶר menunjuk pada laki-laki dan dikontraskan secara langsung dengan perempuan.
- source_word: אִשָּׁה
  choice: perempuan
  rationale: Dalam konteks ini אִשָּׁה menunjuk pada perempuan sebagai pasangan kontras dari גֶּבֶר.
- source_word: תוֹעֲבַת יְהוָה
  choice: kejijikan bagi Yahweh
  rationale: תּוֹעֵבָה merupakan istilah kuat untuk sesuatu yang menjijikkan atau sangat dibenci di hadapan Allah. 'Kejijikan' mempertahankan bobot ungkapannya, sedangkan nama יהוה ditransliterasikan sebagai 'Yahweh' sesuai lapisan konsultasi POB yang diberikan.
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: setiap orang yang melakukan hal-hal ini
  rationale: Konstruksi partisipial dengan כָּל menyatakan generalisasi distributif; terjemahan ini alami dan mempertahankan cakupan tersebut.
theological_decisions:
- issue: Cakupan larangan pertama (כְלִי גֶבֶר)
  choice: Diterjemahkan secara luas sebagai 'perlengkapan laki-laki'.
  alternative: pakaian laki-laki; senjata atau perlengkapan perang laki-laki
  rationale: Naskah Ibrani memakai kata yang lebih luas pada klausa pertama, tetapi kata khusus untuk pakaian pada klausa kedua. Terjemahan mempertahankan perbedaan itu dan tidak memastikan apakah larangan pertama hanya menyangkut pakaian atau juga barang/perlengkapan lain.
- issue: Penyebutan jenis kelamin
  choice: Memakai 'perempuan' dan 'laki-laki'.
  alternative: orang; seseorang
  rationale: Teks Ibrani secara eksplisit mempertentangkan אִשָּׁה dan גֶּבֶר, sehingga kontras tersebut perlu dipertahankan.
- issue: Daya predikatif תוֹעֲבַת יְהוָה
  choice: Menyatakan pelakunya sebagai 'kejijikan bagi Yahweh'.
  alternative: perbuatannya menjijikkan bagi Yahweh; pelakunya sangat dibenci Yahweh
  rationale: Secara gramatikal, 'setiap orang yang melakukan hal-hal ini' merupakan pihak yang disebut תוֹעֲבַת יְהוָה. Terjemahan mempertahankan formulasi tajam tersebut tanpa mengalihkannya hanya kepada tindakan atau memperluasnya menjadi pernyataan tentang kebencian ilahi terhadap pribadi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang lugas dan bermartabat. 'Perlengkapan' dipilih untuk menjaga keluasan leksikal כְלִי, sedangkan 'pakaian' menerjemahkan שִׂמְלָה. Susunan klausa dibuat alami tanpa menghilangkan kesejajaran dan kontras dalam bahasa Ibrani.
