translation:
  language: id
  text: maka ayah perempuan muda itu dan ibunya harus mengambil lalu membawa keluar bukti keperawanan perempuan muda itu kepada para tua-tua kota di pintu gerbang kota[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “keperawanan-keperawanan perempuan muda itu,” sebuah ungkapan untuk tanda atau bukti yang diajukan untuk membuktikan keperawanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: harus mengambil
  rationale: Bentuk Qal dalam rangkaian hukum menyatakan tindakan prosedural yang wajib dilakukan; “harus” menyampaikan daya hukum itu secara alami dalam bahasa Indonesia.
- source_word: אֲבִי הַנַּעַר וְאִמָּהּ
  choice: ayah dan ibu perempuan muda itu
  rationale: נַעֲרָה menunjuk perempuan muda yang sudah berada pada usia menikah; “perempuan muda” jelas, modern, dan tidak memberi kesan anak kecil.
- source_word: וְהוֹצִיאוּ
  choice: membawa
  rationale: Bentuk Hifil dari יצא di sini berarti membawa keluar untuk diperlihatkan atau diajukan kepada pihak berwenang; “membawa” alami dalam konteks ini.
- source_word: אֶת בְּתוּלֵי הַנַּעַר
  choice: bukti keperawanan perempuan muda itu
  rationale: Secara harfiah ungkapan ini berbentuk jamak, “keperawanan-keperawanan,” tetapi dalam perkara hukum ini merupakan idiom bagi tanda atau bukti fisik yang diajukan sebagai bukti keperawanan.
- source_word: אֶל זִקְנֵי הָעִיר
  choice: kepada para tua-tua kota
  rationale: אֶל menunjukkan arah kepada badan yang menangani perkara; “kepada” mempertahankan makna tersebut, sedangkan konteks memperlihatkan fungsi peradilan mereka.
- source_word: הַשַּׁעְרָה
  choice: di pintu gerbang
  rationale: Akhiran lokatif dapat menunjukkan gerak menuju pintu gerbang, tetapi pintu gerbang kota adalah tempat para tua-tua bersidang; “di pintu gerbang” menyatakan lokasi fungsionalnya secara wajar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku yang modern dan bermartabat, dengan gaya hukum yang jelas. “Para tua-tua kota” mempertahankan sebutan kelembagaan dalam latar Israel kuno, sedangkan “pintu gerbang” dibiarkan tanpa tambahan “kota” karena acuannya sudah jelas dari frasa sebelumnya.
