base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/022/026.yaml
  text: But to the young woman you shall do nothing[a]; the young woman has committed no sin deserving death[b]. For this case is like when a man rises against his neighbor and murders him.
translation:
  language: id
  text: Namun, terhadap perempuan muda itu jangan lakukan apa pun. Perempuan muda itu tidak melakukan dosa yang patut dihukum mati.[a] Sebab, perkara ini sama seperti ketika seorang laki-laki menyerang sesamanya dan membunuhnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “pada perempuan muda itu tidak ada dosa kematian”; maksudnya, tidak ada kesalahan yang membuatnya patut dihukum mati.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “demikianlah perkara ini.” Perkara tersebut dibandingkan dengan pembunuhan yang terjadi melalui penyerangan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַנַּעַר
  choice: Namun, ... terhadap perempuan muda itu
  rationale: Waw menandai kontras dengan hukuman bagi laki-laki pada ayat sebelumnya. Dalam konteks hukum ini, נַעַר menunjuk kepada perempuan muda yang telah disebutkan sebelumnya.
- source_word: לֹא תַעֲשֶׂה דָבָר
  choice: jangan lakukan apa pun terhadap ... itu
  rationale: Mengungkapkan larangan hukum secara mutlak dan alami dalam bahasa Indonesia, dengan objek yang dibuat eksplisit sesuai konstruksi Ibrani.
- source_word: אֵין לַנַּעַר חֵטְא מָוֶת
  choice: Perempuan muda itu tidak melakukan dosa yang patut dihukum mati
  rationale: Mempertahankan istilah חֵטְא sebagai 'dosa' sekaligus menyampaikan daya hukum idiom מָוֶת, yakni kesalahan yang mendatangkan hukuman mati.
- source_word: כַּאֲשֶׁר יָקוּם אִישׁ עַל רֵעֵהוּ
  choice: seperti ketika seseorang menyerang sesamanya
  rationale: Dalam konteks ini, idiom 'bangkit melawan' menyatakan serangan. 'Seseorang' dan 'sesamanya' terdengar alami serta tidak mempersempit רֵעַ menjadi tetangga tempat tinggal.
- source_word: וּרְצָחוֹ נֶפֶשׁ
  choice: dan membunuhnya
  rationale: רצח menunjuk pada pembunuhan melawan hukum; sufiks objek mengacu kepada sesamanya. נֶפֶשׁ berfungsi idiomatis dan tidak perlu diterjemahkan secara terpisah.
- source_word: כֵּן הַדָּבָר הַזֶּה
  choice: perkara ini sama seperti
  rationale: Menyampaikan perbandingan hukum secara alami dan mempertahankan דָּבָר dalam arti 'perkara'.
theological_decisions:
- issue: Sifat ketidakbersalahan perempuan muda itu dalam analogi hukum
  choice: Ayat menyatakan bahwa ia tidak melakukan dosa yang patut dihukum mati dalam perkara ini.
  alternative: Ayat menyatakan ketidakbersalahan moral sepenuhnya tanpa penekanan khusus pada pertanggungjawaban hukum.
  rationale: Ungkapan Ibrani berada dalam konteks hukum dan secara khusus menyangkal kesalahan yang mendatangkan hukuman mati. Terjemahan mempertahankan istilah 'dosa' dan daya yuridisnya tanpa memperluas klaim melampaui konteks.
- issue: Fungsi analogi dengan pembunuhan
  choice: Kasus serangan terhadap perempuan muda itu dibandingkan dengan seseorang yang diserang dan dibunuh.
  alternative: Analogi tersebut menyamakan semua aspek kasus ini dengan pembunuhan.
  rationale: כֵּן הַדָּבָר הַזֶּה menyatakan perbandingan perkara. Terjemahan mempertahankan analoginya tanpa menjelaskan secara berlebihan aspek-aspek yang tidak dirinci dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Istilah 'perempuan muda' mempertahankan nuansa usia tanpa terdengar merendahkan; 'perkara' sesuai dengan konteks hukum. Penanda catatan kaki [a] dan [b] ditempatkan langsung pada klausa yang dijelaskan.
