source:
  edition: WLC
  text: כִּ֤י אַתֶּם֙ עֹבְרִ֣ים אֶת הַ/יַּרְדֵּ֔ן לָ/בֹא֙ לָ/רֶ֣שֶׁת אֶת הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֵי/כֶ֖ם נֹתֵ֣ן לָ/כֶ֑ם וִֽ/ירִשְׁתֶּ֥ם אֹתָ֖/הּ וִֽ/ישַׁבְתֶּם בָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/031.yaml
  text: For you are crossing the Jordan to go in to take possession of the land that Yahweh your God is giving you[a], and you will take possession of it and live in it.
translation:
  language: id
  text: Sebab kamu akan menyeberangi Sungai Yordan untuk masuk dan menduduki negeri yang Yahweh[a], Allahmu, sedang berikan kepadamu. Kamu akan mendudukinya dan tinggal di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nama Ibrani: “YHWH”; secara tradisional diterjemahkan “TUHAN.”'
    reason: Menjelaskan bahwa “Yahweh” merepresentasikan nama ilahi dalam bahasa Ibrani dan mencatat padanan tradisionalnya.
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan atau dasar bagi nasihat sebelumnya dan mempertahankan hubungan antarkalimat secara alami.
- source_word: עֹבְרִים אֶת הַיַּרְדֵּן
  choice: akan menyeberangi Sungai Yordan
  rationale: Partisipel menyatakan tindakan yang segera berlangsung dalam konteks ini. Bentuk futur dengan 'akan' terdengar alami dalam bahasa Indonesia; 'Sungai' ditambahkan untuk memperjelas nama geografis.
- source_word: לָבֹא לָרֶשֶׁת
  choice: untuk masuk dan menduduki
  rationale: Mempertahankan urutan masuk ke negeri lalu mengambilnya sebagai milik. 'Menduduki' menyampaikan tindakan memperoleh dan menguasai negeri secara ringkas dan alami.
- source_word: הָאָרֶץ
  choice: negeri
  rationale: Dalam konteks Ulangan, kata ini menunjuk pada wilayah yang akan dihuni Israel; 'negeri' lebih wajar daripada 'tanah' untuk suatu kawasan tempat bangsa menetap.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Ungkapan perjanjian dengan sufiks orang kedua jamak. Bahasa Indonesia memakai bentuk 'mu' secara kolektif dalam sapaan kepada bangsa Israel.
- source_word: נֹתֵן לָכֶם
  choice: berikan kepadamu
  rationale: Konstruksi relatif Indonesia tidak wajib menandai waktu; bentuk ini mempertahankan tindakan pemberian ilahi sebagai kenyataan yang sedang berlaku tanpa memaksakan aspek tambahan.
- source_word: וִירִשְׁתֶּם אֹתָהּ
  choice: Kamu akan mendudukinya
  rationale: Melanjutkan rangkaian peristiwa yang akan terjadi dan memakai padanan yang konsisten bagi ירשׁ.
- source_word: וִישַׁבְתֶּם בָּהּ
  choice: tinggal di sana
  rationale: ישׁב di sini berarti menghuni atau menetap. 'Tinggal di sana' jelas, modern, dan tidak terlalu formal.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama pribadi YHWH. Bentuk 'Yahweh' mempertahankan nama tersebut, sedangkan 'TUHAN' adalah penggantian tradisional dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Kamu' dipakai sebagai sapaan kolektif kepada Israel; konteks menentukan bahwa acuannya jamak. Kalimat kedua dipisahkan agar rangkaian tindakan tetap jelas dan alami.
