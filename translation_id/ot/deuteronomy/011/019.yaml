  text: וְ/לִמַּדְתֶּ֥ם אֹתָ֛/ם אֶת בְּנֵי/כֶ֖ם לְ/דַבֵּ֣ר בָּ֑/ם בְּ/שִׁבְתְּ/ךָ֤ בְּ/בֵיתֶ֨/ךָ֙ וּ/בְ/לֶכְתְּ/ךָ֣ בַ/דֶּ֔רֶךְ וּֽ/בְ/שָׁכְבְּ/ךָ֖ וּ/בְ/קוּמֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/019.yaml
  text: You shall teach them to your children[a], speaking of them when you sit in your house, and when you walk on the road, and when you lie down, and when you rise up.
translation:
  language: id
  text: Kalian harus mengajarkannya kepada anak-anak kalian[a], dengan membicarakannya ketika kalian duduk di rumah, ketika kalian berjalan di jalan, ketika kalian berbaring, dan ketika kalian bangun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anak-anak lelakimu.” Bentuk jamak maskulin dalam bahasa Ibrani dapat dipakai secara representatif untuk anak-anak seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִמַּדְתֶּם
  choice: Kamu harus mengajarkan
  rationale: Bentuk piel dari למד berarti ‘mengajar’. Konjungsi pembuka diteruskan secara alami tanpa harus diterjemahkan sebagai ‘dan’ pada awal ayat.
- source_word: אֹתָם
  choice: -nya
  rationale: Pronomina objek maskulin jamak merujuk kembali kepada perkataan atau perintah dalam konteks sebelumnya. Bahasa Indonesia secara alami dapat mempertahankan rujukan itu dengan enklitik ‘-nya’ tanpa memperjelas anteseden secara berlebihan.
- source_word: אֶת־בְּנֵיכֶם
  choice: kepada anak-anakmu
  rationale: בנים dapat berarti ‘anak-anak lelaki’ secara khusus atau ‘anak-anak’ sebagai keturunan secara umum. Dalam konteks pengajaran perjanjian ini, ‘anak-anakmu’ menyampaikan cakupan representatifnya secara wajar.
- source_word: לְדַבֵּר בָּם
  choice: dengan membicarakannya
  rationale: Infinitif berawalan ל menerangkan cara yang menyertai tindakan mengajar. ‘Dengan membicarakannya’ alami dalam bahasa Indonesia dan mempertahankan rujukan kepada perkataan atau perintah tersebut.
- source_word: בְּשִׁבְתְּךָ בְּבֵיתֶךָ
  choice: ketika kamu duduk di rumahmu
  rationale: Preposisi ב dengan infinitif konstruktus menyatakan keadaan waktu, sedangkan בְּבֵיתֶךָ menyatakan tempat secara langsung.
- source_word: וּבְלֶכְתְּךָ בַדֶּרֶךְ
  choice: ketika kamu berjalan di jalan
  rationale: הלך adalah verba umum untuk ‘berjalan/pergi’. Ungkapan ini mempertahankan gambaran konkret teks Ibrani dengan bahasa Indonesia yang jelas.
- source_word: וּבְשָׁכְבְּךָ
  choice: ketika kamu berbaring
  rationale: Infinitif konstruktus שכב dengan ב menyatakan waktu. ‘Berbaring’ setia pada bentuk konkret teks dan membentuk pasangan alami dengan ‘bangun’.
- source_word: וּבְקוּמֶךָ
  choice: ketika kamu bangun
  rationale: קום di sini menunjuk pada bangun dari tidur atau istirahat. ‘Bangun’ merupakan padanan Indonesia modern yang alami dan jelas.
theological_decisions:
- issue: Cakupan gender בְּנֵיכֶם
  choice: anak-anakmu
  alternative: anak-anak lelakimu
  rationale: Bentuk maskulin jamak dapat berfungsi secara representatif bagi keturunan secara umum. ‘Anak-anakmu’ menyampaikan cakupan konteks pengajaran perjanjian tanpa menyatakan bahwa anak perempuan dikecualikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal ‘kamu’, sesuai bentuk orang kedua tunggal dalam rangkaian keadaan pada ayat ini. Susunan berulang ‘ketika’ mempertahankan irama dan cakupan keseharian teks Ibrani; ‘harus’ menyampaikan daya imperatif dalam konteks perintah.
