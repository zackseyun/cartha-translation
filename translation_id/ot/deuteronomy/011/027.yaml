base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/027.yaml
  text: the blessing[a], if you listen to the commandments of Yahweh your God[b], which I am commanding you today.
translation:
  language: id
  text: berkat[a], jika kamu mendengarkan[b] perintah-perintah Yahweh, Allahmu, yang kuperintahkan kepada kamu hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “berkat yang kamu terima apabila kamu menaati perintah-perintah Yahweh, Allahmu.” Kata penghubung Ibrani yang secara harfiah dapat berarti “yang” di sini berfungsi menyatakan syarat.
    reason: lexical_alternative
  - marker: b
    text: “Mendengarkan” juga dapat diterjemahkan “menaati”; dalam bahasa Ibrani, kata ini kerap berarti mendengar dengan tanggapan berupa ketaatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת הַבְּרָכָה
  choice: berkat
  rationale: Frasa ini meneruskan susunan eliptis dari ayat sebelumnya, tempat berkat dan kutuk diperhadapkan. Bahasa Indonesia dapat mempertahankan bentuk ringkas tanpa menambahkan kata yang tidak tersurat.
- source_word: אֲשֶׁר
  choice: jika
  rationale: Walaupun bentuknya adalah partikel relatif, dalam konteks ini partikel tersebut menyatakan syarat bagi berkat.
- source_word: תִּשְׁמְעוּ אֶל
  choice: kamu mendengarkan
  rationale: Kata שׁמע dengan אֶל berarti mendengarkan dengan sungguh-sungguh dan dalam konteks perjanjian menyiratkan tanggapan berupa ketaatan. Pilihan ini mempertahankan citra mendengar tanpa menghilangkan implikasinya.
- source_word: מִצְוֺת
  choice: perintah-perintah
  rationale: Bentuk jamak menunjuk kepada berbagai perintah ilahi; 'perintah-perintah' alami dan jelas dalam bahasa Indonesia modern.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Transliterasi nama ilahi mempertahankan nama pribadi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Kata ini adalah bentuk dengan akhiran orang kedua jamak. Bahasa Indonesia baku tidak membedakan tunggal dan jamak pada akhiran '-mu', sementara konteks menunjukkan bahwa Musa menyapa umat secara kolektif.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: yang kusampaikan kepadamu pada hari ini
  rationale: Partisipel מְצַוֶּה menggambarkan tindakan Musa yang sedang berlangsung dalam pidato ini. 'Kusampaikan' mengungkapkan pemberian perintah secara alami dan menghindari rangkaian 'perintah-perintah ... yang kuperintahkan' yang kaku.
theological_decisions:
- issue: Makna mendengar dalam konteks perjanjian
  choice: mendengarkan, dengan catatan bahwa ketaatan tersirat
  alternative: menaati
  rationale: Teks mempertahankan tindakan mendengar sambil menuntut respons. Terjemahan utama menjaga keluasan makna itu dan catatan kaki menjelaskan implikasi ketaatannya.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama perjanjian secara langsung; transliterasi mempertahankan pembedaan antara nama pribadi dan gelar.
- issue: Hubungan berkat dengan syarat
  choice: jika
  alternative: yang/ketika
  rationale: Dalam konteks kontras antara berkat dan kutuk, partikel relatif אֲשֶׁר memiliki daya kondisional. 'Jika' menyatakan hubungan tersebut tanpa menjadikan ketaatan sebagai dasar teologis yang lebih luas daripada yang dikatakan ayat.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk 'kamu' mengikuti sapaan orang kedua jamak kepada Israel secara kolektif. 'Pada hari ini' mempertahankan tekanan perjanjian dan nuansa formal הַיּוֹם.
