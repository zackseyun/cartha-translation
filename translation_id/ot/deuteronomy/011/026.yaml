base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/026.yaml
  text: See[a], today I am setting before you a blessing and a curse.
translation:
  language: id
  text: Lihatlah, hari ini aku menghadapkan kepada kalian berkat dan kutuk.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Lihatlah, hari ini aku memberikan kepada kalian berkat dan kutuk.” Kata Ibrani yang diterjemahkan “menghadapkan” juga dapat berarti “memberikan” atau “menaruh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Lihatlah
  rationale: Imperatif tunggal ini berfungsi menarik perhatian para pendengar. “Lihatlah” alami dan bermartabat dalam bahasa Indonesia serta mempertahankan daya perintahnya.
- source_word: אָנֹכִי
  choice: aku
  rationale: Pronomina mandiri memberi penekanan pada pembicara. “Aku” sesuai dengan tuturan langsung Musa tanpa perlu menambahkan “sendiri”, yang dapat melebihkan penekanan.
- source_word: נֹתֵן
  choice: menghadapkan
  rationale: Secara leksikal berarti memberi, menaruh, atau menempatkan. Bersama לִפְנֵיכֶם, “menghadapkan kepadamu” menyampaikan idiom tentang menyajikan dua pilihan di hadapan para pendengar.
- source_word: לִפְנֵיכֶם
  choice: kepadamu
  rationale: Dalam konstruksi dengan נֹתֵן, frasa ini berarti menempatkan atau menghadapkan sesuatu di hadapan para pendengar; “menghadapkan kepadamu” lebih wajar daripada “memberikan di hadapanmu”.
- source_word: הַיּוֹם
  choice: hari ini
  rationale: Padanan temporal langsung dan alami dalam bahasa Indonesia modern.
- source_word: בְּרָכָה
  choice: berkat
  rationale: Nomina tunggal ini merupakan salah satu dari dua kenyataan perjanjian yang diperhadapkan kepada Israel. Bahasa Indonesia tidak memerlukan penanda takrif seperti artikel bahasa Inggris.
- source_word: וּקְלָלָה
  choice: dan kutuk
  rationale: Mempertahankan pasangan antitetis dengan “berkat”. “Kutuk” dipilih sebagai nomina yang ringkas dan sejajar, tanpa mengubahnya menjadi tindakan “mengutuk”.
theological_decisions:
- issue: Sifat rumusan berkat dan kutuk
  choice: Menyajikannya sebagai dua alternatif perjanjian yang diperhadapkan kepada Israel tanpa penjelasan doktrinal tambahan.
  alternative: Menafsirkannya sebagai prinsip moral umum tentang pahala dan hukuman.
  rationale: Ayat ini memperkenalkan berkat dan kutuk dalam konteks perjanjian Ulangan. Terjemahan mempertahankan penyajian formal keduanya tanpa memperluas makna secara interpretatif.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk “Lihatlah” mempertahankan seruan pembuka; “aku” dan “kepadamu” mencerminkan bentuk tunggal pada pembicara dan bentuk jamak pada para pendengar sejauh yang dapat dinyatakan secara alami dalam bahasa Indonesia, meskipun “-mu” sendiri tidak menandai jumlah.
