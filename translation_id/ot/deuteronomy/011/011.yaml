base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/011.yaml
  text: But the land that you are crossing over to possess is a land of mountains and valleys[b][a]; it drinks water from the rain of heaven.
translation:
  language: id
  text: Namun, negeri yang akan kamu masuki untuk kamu miliki[a] adalah negeri dengan pegunungan dan lembah-lembah; negeri itu minum air hujan dari langit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk kamu warisi.” Kata kerja Ibrani ini dapat mengandung nuansa kepemilikan sekaligus warisan, khususnya dalam konteks perjanjian.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “langit” berbentuk jamak, suatu ungkapan yang lazim untuk langit atau ranah surgawi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאָרֶץ
  choice: Namun, negeri
  rationale: Waw menandai kontras dengan gambaran Mesir pada ayat sebelumnya. “Namun” menyampaikan fungsi wacana itu secara alami, sedangkan “negeri” menunjuk wilayah yang akan dimasuki Israel.
- source_word: עֹבְרִים שָׁמָּה
  choice: yang akan kamu seberangi
  rationale: Partisip Ibrani menyatakan tindakan yang segera berlangsung. Arah tujuan yang tersirat dalam שָׁמָּה dapat dipahami dari konteks tanpa harus diterjemahkan secara kaku sebagai “ke sana”.
- source_word: לְרִשְׁתָּהּ
  choice: untuk kamu miliki
  rationale: ירשׁ mencakup tindakan mengambil dan memegang kepemilikan, dengan nuansa warisan dalam konteks perjanjian. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan tindakan aktif Israel; alternatif “warisi” dicatat dalam catatan kaki.
- source_word: אֶרֶץ הָרִים וּבְקָעֹת
  choice: negeri yang bergunung-gunung dan berlembah-lembah
  rationale: Ungkapan ini menggambarkan bentuk wilayah. Bentuk berimbuhan tersebut alami dalam bahasa Indonesia dan mempertahankan kontras antara pegunungan dan lembah.
- source_word: לִמְטַר הַשָּׁמַיִם
  choice: air hujan dari langit
  rationale: Susunan ini menyampaikan hujan sebagai sumber air secara idiomatis dalam bahasa Indonesia. “Langit” merupakan padanan alami bagi bentuk Ibrani yang secara tata bahasa berbentuk jamak.
- source_word: תִּשְׁתֶּה מָּיִם
  choice: negeri itu minum air
  rationale: Metafora yang mempersonifikasikan negeri sebagai peminum air dipertahankan, bukan diratakan menjadi “diairi” atau “menerima air”.
theological_decisions:
- issue: Nuansa kepemilikan dan warisan dalam ירשׁ
  choice: untuk kamu miliki
  alternative: untuk kamu warisi
  rationale: Terjemahan utama mempertahankan unsur masuk dan mengambil kepemilikan secara aktif, sementara catatan kaki menjaga nuansa warisan perjanjian tanpa menetapkan hanya satu sisi makna.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Kamu” dipakai secara kolektif sesuai sapaan kepada Israel. Metafora negeri yang “minum” dipertahankan. Penanda catatan kaki ditempatkan langsung pada unsur yang dijelaskannya.
