  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לֹא יִתְיַצֵּ֥ב אִ֖ישׁ בִּ/פְנֵי/כֶ֑ם פַּחְדְּ/כֶ֨ם וּ/מֽוֹרַאֲ/כֶ֜ם יִתֵּ֣ן יְהוָ֣ה אֱלֹֽהֵי/כֶ֗ם עַל פְּנֵ֤י כָל הָ/אָ֨רֶץ֙ אֲשֶׁ֣ר תִּדְרְכוּ בָ֔/הּ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר לָ/כֶֽם־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/025.yaml
  text: No man will stand before you[a]. Yahweh your God will put the fear and dread of you on the face of all the land on which you tread[b], just as he spoke to you.
translation:
  language: id
  text: Tidak seorang pun akan dapat bertahan menghadapi kalian.[a] Yahweh, Allah kalian, akan membuat seluruh negeri yang kalian jejaki diliputi rasa takut dan gentar terhadap kalian,[b] seperti yang telah Ia firmankan kepada kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Tidak seorang pun akan berdiri di hadapan kalian.” Ungkapan Ibrani ini dapat berarti bahwa tidak seorang pun akan sanggup bertahan atau berhasil melawan kalian.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “akan menaruh rasa takut dan gentar terhadap kalian di atas muka seluruh negeri yang kalian jejaki.” Kata Ibrani yang diterjemahkan “negeri” juga dapat berarti “bumi”, tetapi konteks menunjuk pada wilayah yang akan dijejaki Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִתְיַצֵּב אִישׁ בִּפְנֵיכֶם
  choice: Tidak seorang pun akan dapat bertahan menghadapi kalian
  rationale: Ungkapan harfiah 'berdiri di hadapan kalian' dalam konteks ini berarti sanggup bertahan atau melawan. Terjemahan ini menyampaikan daya idiomatisnya secara alami, sementara catatan kaki mempertahankan citra Ibraninya.
- source_word: פַּחְדְּכֶם וּמוֹרַאֲכֶם
  choice: rasa takut dan gentar terhadap kalian
  rationale: Dua nomina yang bertumpang tindih tetapi tidak identik dipertahankan sebagai pasangan intensif. 'Terhadap kalian' menjelaskan bahwa bangsa Israel menjadi sumber atau sasaran rasa takut itu.
- source_word: יִתֵּן ... עַל־פְּנֵי
  choice: akan membuat ... diliputi
  rationale: נתן secara dasar berarti 'memberi/menaruh', tetapi konstruksi dengan rasa takut di atas permukaan wilayah paling alami dinyatakan dalam bahasa Indonesia sebagai membuat seluruh wilayah diliputi rasa takut.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh, Allah kalian
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'; אֱלֹהֵיכֶם diterjemahkan langsung sebagai 'Allah kalian'.
- source_word: עַל־פְּנֵי כָל־הָאָרֶץ
  choice: seluruh negeri
  rationale: הָאָרֶץ dapat berarti bumi atau negeri. Klausa berikutnya membatasi cakupan pada wilayah yang akan dijejaki Israel, sehingga 'negeri' paling sesuai dengan konteks. Idiom 'di atas muka' diungkapkan secara alami melalui 'diliputi', dengan bentuk harfiahnya dicatat.
- source_word: אֲשֶׁר תִּדְרְכוּ בָהּ
  choice: yang kalian jejaki
  rationale: דרך dalam Qal berarti menginjak atau menapaki. 'Jejaki' mempertahankan gambaran konkret perjalanan dan penguasaan wilayah.
- source_word: כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: seperti yang telah Ia firmankan kepada kalian
  rationale: דבר berarti berbicara atau berfirman, bukan secara khusus 'berjanji'. 'Firmankan' sesuai bagi ucapan ilahi tanpa mempersempit maknanya menjadi janji.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri ilahi. 'Yahweh' mempertahankan nama perjanjian itu secara langsung tanpa menggantinya dengan gelar.
- issue: אִישׁ sebagai bentuk maskulin representatif
  choice: seorang pun
  alternative: seorang laki-laki pun
  rationale: Dalam konstruksi negatif ini, אִישׁ berfungsi idiomatis dengan arti 'siapa pun/tidak seorang pun', bukan sebagai penegasan bahwa yang dimaksud hanya laki-laki. Karena itu terjemahan tidak menambahkan pembatasan gender yang tidak dituntut konteks.
- issue: Daya ujaran כַּאֲשֶׁר דִּבֶּר לָכֶם
  choice: seperti yang telah Ia firmankan
  alternative: seperti yang telah Ia janjikan
  rationale: Konteksnya bersifat menjanjikan, tetapi verba Ibrani hanya menyatakan bahwa Yahweh telah berbicara. Pilihan ini menjaga ketegangan antara arti leksikal dan fungsi kontekstual.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Pronomina jamak 'kalian' dipakai untuk membedakan sapaan kepada umat dari bentuk tunggal. Struktur Ibrani yang kaku dinaturalkan secukupnya, sedangkan idiom dan alternatif penting dipertahankan dalam catatan kaki.
