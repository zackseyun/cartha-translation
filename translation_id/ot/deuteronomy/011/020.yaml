  text: And you shall write them on the doorposts of your house and on your gates[a][b].
translation:
  language: id
  text: Tuliskanlah itu pada tiang-tiang pintu rumahmu dan pada gerbang-gerbangmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pada pintu-pintu gerbangmu.” Kata Ibrani ini dapat menunjuk pada gerbang itu sendiri maupun kawasan pintu masuk.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְתַבְתָּם
  choice: Tuliskanlah semuanya itu
  rationale: Bentuk verba ini melanjutkan rangkaian perintah perjanjian. Akhiran orang ketiga jamak merujuk pada perkataan yang disebut sebelumnya; “semuanya itu” menyampaikan rujukan tersebut secara alami dalam bahasa Indonesia.
- source_word: עַל
  choice: pada
  rationale: Preposisi ini menunjukkan tempat penulisan pada suatu permukaan; “pada” alami dan sesuai untuk tiang pintu maupun gerbang.
- source_word: מְזוּזוֹת
  choice: tiang-tiang pintu
  rationale: Kata benda ini menunjuk pada tiang atau sisi tegak sebuah pintu. Terjemahan ini mempertahankan arti konkretnya dan tidak mencampurkannya dengan istilah bagi benda ritual Yahudi yang berkembang kemudian.
- source_word: בֵּיתֶךָ
  choice: rumahmu
  rationale: בַּיִת secara langsung berarti “rumah”; bentuk posesif orang kedua tunggal diterjemahkan secara ringkas sebagai “rumahmu”.
- source_word: וּבִשְׁעָרֶיךָ
  choice: dan pada gerbang-gerbangmu
  rationale: שַׁעַר lazimnya berarti “gerbang” dan dapat pula mencakup kawasan pintu masuk. Bentuk jamaknya dipertahankan, dan preposisinya dinyatakan kembali demi kejelasan.
