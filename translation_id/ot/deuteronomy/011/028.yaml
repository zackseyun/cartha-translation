language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הַ/קְּלָלָ֗ה אִם לֹ֤א תִשְׁמְעוּ֙ אֶל מִצְוֺת֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/סַרְתֶּ֣ם מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם הַ/יּ֑וֹם לָ/לֶ֗כֶת אַחֲרֵ֛י אֱלֹהִ֥ים אֲחֵרִ֖ים אֲשֶׁ֥ר לֹֽא יְדַעְתֶּֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/028.yaml
  text: and the curse[a], if you do not listen to the commandments of Yahweh your God, and turn aside from the way that I am commanding you today, to go after other gods that you have not known.
translation:
  language: id
  text: dan kutukan, jika kamu tidak mendengarkan[a] perintah-perintah Yahweh, Allahmu, dan menyimpang dari jalan yang kuperintahkan kepadamu hari ini untuk mengikuti ilah-ilah lain yang tidak kamu kenal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menaati perintah-perintah Yahweh, Allahmu.” Kata Ibrani yang diterjemahkan “mendengarkan” dalam konteks perjanjian sering mengandung makna mendengar dengan taat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַקְּלָלָה
  choice: dan kutuk
  rationale: Nomina definit ini sejajar dengan berkat pada ayat sebelumnya. Dalam bahasa Indonesia, 'kutuk' alami sebagai lawan perjanjian dari 'berkat'; konjungsi 'dan' mempertahankan kesinambungan struktur Ibrani.
- source_word: אִם לֹא
  choice: jika ... tidak
  rationale: Mempertahankan konstruksi bersyarat yang menerangkan keadaan ketika kutuk berlaku.
- source_word: תִשְׁמְעוּ אֶל
  choice: mendengarkan
  rationale: שׁמע dengan אֶל secara leksikal berarti mendengarkan dan dalam konteks perjanjian menyiratkan ketaatan. Pilihan ini mempertahankan citra mendengar tanpa meniadakan nuansa menaati.
- source_word: מִצְוֺת
  choice: perintah-perintah
  rationale: Bentuk jamak מִצְוָה diterjemahkan secara jelas dan wajar, dengan bobot perjanjian tetap terpelihara.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh, Allahmu
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'; frasa dengan sufiks orang kedua jamak dialihkan secara idiomatis sebagai 'Allahmu', dengan 'kamu' dipahami sebagai jamak kolektif.
- source_word: וְסַרְתֶּם מִן הַדֶּרֶךְ
  choice: lalu menyimpang dari jalan
  rationale: סור menyatakan penyimpangan dari arah yang ditetapkan. 'Menyimpang dari jalan' mempertahankan metafora perjalanan dan hubungan akibat dalam kalimat.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: yang kuperintahkan kepadamu hari ini
  rationale: Partisip Ibrani menyatakan tindakan Musa dalam amanat saat ini. Bentuk Indonesia ini alami dan tetap mempertahankan penekanan pada 'hari ini'.
- source_word: לָלֶכֶת אַחֲרֵי
  choice: dengan mengikuti
  rationale: Infinitif ini menjelaskan bentuk atau akibat penyimpangan tersebut. 'Mengikuti' menyampaikan idiom gerak 'pergi di belakang' secara alami tanpa menghilangkan gagasan loyalitas.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ilah-ilah lain
  rationale: '''Ilah-ilah lain'' membedakan sebutan bagi dewa-dewa lain dari ''Allah'' sebagai sebutan bagi Yahweh, sekaligus mempertahankan bentuk jamak sumber.'
- source_word: אֲשֶׁר לֹא יְדַעְתֶּם
  choice: yang tidak kamu kenal
  rationale: Perfect Ibrani di sini menyatakan bahwa ilah-ilah itu tidak pernah dikenal dalam relasi atau pengalaman Israel. Bentuk kini bahasa Indonesia mencakup keadaan berkelanjutan itu secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menggunakan Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian dan membedakannya dari gelar.
- issue: Apakah שׁמע dibuat eksplisit sebagai 'menaati'
  choice: mendengarkan
  alternative: menaati
  rationale: Dalam konteks perjanjian, kata ini mencakup ketaatan, tetapi bentuk utamanya adalah mendengar atau mendengarkan. Terjemahan utama mempertahankan tekstur leksikal, sedangkan catatan menjelaskan implikasi ketaatannya.
- issue: Hubungan לָלֶכֶת אַחֲרֵי dengan penyimpangan dari jalan
  choice: dengan mengikuti
  alternative: untuk mengikuti
  rationale: Infinitif dapat dipahami sebagai penjelasan mengenai cara atau hasil penyimpangan. 'Dengan mengikuti' menghasilkan hubungan Indonesia yang alami tanpa mengubah tindakan mengikuti ilah lain menjadi tujuan yang sengaja dirumuskan secara lebih tegas daripada sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'kamu' mengikuti sapaan kolektif orang kedua jamak kepada Israel; sufiks '-mu' digunakan secara idiomatis. Tanda koma mengapit aposisi 'Allahmu'. Catatan [a] ditempatkan sesudah 'kutuk' dan juga menerangkan nuansa ketaatan pada 'mendengarkan'.
