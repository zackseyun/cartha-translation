reference: Deuteronomy 11:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וִֽ/ידַעְתֶּם֮ הַ/יּוֹם֒ כִּ֣י לֹ֣א אֶת בְּנֵי/כֶ֗ם אֲשֶׁ֤ר לֹֽא יָדְעוּ֙ וַ/אֲשֶׁ֣ר לֹא רָא֔וּ אֶת מוּסַ֖ר יְהוָ֣ה אֱלֹהֵי/כֶ֑ם אֶת גָּדְל֕/וֹ אֶת יָד/וֹ֙ הַ/חֲזָקָ֔ה וּ/זְרֹע֖/וֹ הַ/נְּטוּיָֽה׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/002.yaml
  text: And know today that that I am not speaking to your children, who have not known and who have not seen the discipline of Yahweh your God[a], his greatness, his strong hand[b], and his outstretched arm—
translation:
  language: id
  text: Ketahuilah hari ini bahwa aku tidak berbicara kepada anak-anak kalian, yang tidak mengenal dan tidak melihat didikan Yahweh, Allah kalian[a], kebesaran-Nya, tangan-Nya yang kuat[b], dan lengan-Nya yang terentang—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibrani di sini eliptis; secara harfiah, “sebab bukan anak-anak kalian yang tidak mengenal dan tidak melihat ...” Maksudnya, Musa berbicara kepada orang-orang yang sendiri menyaksikan tindakan Yahweh, bukan kepada generasi sesudah mereka.
    reason: alternative_reading
  - marker: b
    text: Atau “tangan-Nya yang perkasa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: Ketahuilah
  rationale: Bentuk Qal perfektif orang kedua jamak dengan waw berfungsi sebagai seruan atau ajakan untuk memperhatikan dalam konteks ini. Bentuk imperatif Indonesia menyampaikan daya ujar tersebut secara alami.
- source_word: הַיּוֹם
  choice: pada hari ini
  rationale: Menjaga penekanan waktu dalam pidato Musa dengan ungkapan Indonesia yang wajar dan khidmat.
- source_word: כִּי לֹא אֶת־בְּנֵיכֶם
  choice: bahwa aku tidak berbicara kepada anak-anakmu
  rationale: Teks Ibrani eliptis, secara harfiah hanya menyatakan 'sebab bukan anak-anakmu'. Penambahan verba berbicara memperjelas kontras wacana antara para pendengar Musa dan anak-anak mereka tanpa mengubah maksud konteks.
- source_word: אֲשֶׁר לֹא יָדְעוּ וַאֲשֶׁר לֹא רָאוּ
  choice: yang tidak mengenal dan tidak melihat
  rationale: Kedua klausa relatif dipertahankan sejajar. 'Mengenal' menyampaikan pengetahuan berdasarkan pengalaman, sedangkan 'melihat' mempertahankan kesaksian langsung.
- source_word: מוּסַר
  choice: didikan
  rationale: Kata ini mencakup pembentukan melalui pengajaran, koreksi, dan disiplin. 'Didikan' mempertahankan cakupan pedagogisnya dan tidak mempersempit makna menjadi hukuman semata.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Menerjemahkan ungkapan perjanjian dalam sapaan orang kedua jamak secara langsung dan alami.
- source_word: גָּדְלוֹ
  choice: kebesaran-Nya
  rationale: Padanan langsung yang menunjuk pada kebesaran Yahweh sebagaimana dinyatakan melalui tindakan-Nya.
- source_word: יָדוֹ הַחֲזָקָה
  choice: tangan-Nya yang kuat
  rationale: Mempertahankan citra dan arti dasar חזק, sekaligus tetap dapat dipahami sebagai ungkapan kuasa ilahi.
- source_word: וּזְרֹעוֹ הַנְּטוּיָה
  choice: lengan-Nya yang teracung
  rationale: Menggambarkan lengan yang direntangkan atau diangkat untuk bertindak; 'teracung' mempertahankan citra tindakan kuasa secara ringkas dan idiomatis.
theological_decisions:
- issue: Kontras eliptis dengan 'anak-anakmu'
  choice: Melengkapi elipsis dengan 'aku tidak berbicara kepada anak-anakmu'
  alternative: Mempertahankan bentuk lebih harfiah, 'sebab bukan anak-anakmu yang tidak mengenal dan tidak melihat ...'
  rationale: Bahasa Ibrani tidak menyebut verba pengendali sesudah frasa 'bukan anak-anakmu'. Konteks menunjukkan bahwa Musa membedakan para pendengar yang menyaksikan tindakan Yahweh dari anak-anak mereka. Pelengkapan ini membuat kalimat Indonesia koheren, sementara catatan kaki mempertahankan transparansi mengenai bentuk sumber.
- issue: Cakupan מוּסַר
  choice: didikan
  alternative: disiplin; teguran; hajaran
  rationale: '''Didikan'' menjaga ketegangan antara pengajaran dan koreksi tanpa menafsirkan tindakan Yahweh hanya sebagai hukuman.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pidato yang khidmat. Sapaan jamak Ibrani dinyatakan dengan bentuk Indonesia yang tidak menandai jumlah secara eksplisit. Tanda pisah penutup dipertahankan karena kalimat dan daftar berlanjut ke ayat-ayat berikutnya.
