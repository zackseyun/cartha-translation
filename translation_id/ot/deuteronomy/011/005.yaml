  text: וַ/אֲשֶׁ֥ר עָשָׂ֛ה לָ/כֶ֖ם בַּ/מִּדְבָּ֑ר עַד בֹּאֲ/כֶ֖ם עַד הַ/מָּק֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/005.yaml
  text: and what he did for you in the wilderness until you came to this place—
translation:
  language: id
  text: dan apa yang Ia lakukan bagi kamu di padang gurun sampai kamu tiba di tempat ini—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲשֶׁר
  choice: dan apa yang
  rationale: Konjungsi dan partikel relatif ini melanjutkan daftar mengenai segala sesuatu yang telah dilihat Israel. Ungkapan “dan apa yang” mempertahankan fungsi relatifnya secara alami tanpa menggeser makna menjadi cara atau manner.
- source_word: עָשָׂה
  choice: dilakukan-Nya
  rationale: עָשָׂה adalah verba umum yang berarti “melakukan/membuat”. Bentuk pasif berpelaku “dilakukan-Nya” alami dalam konstruksi Indonesia ini dan mempertahankan TUHAN sebagai subjek tersirat dari konteks.
- source_word: לָכֶם
  choice: bagi kamu
  rationale: Preposisi ל dalam konteks ini menunjukkan tindakan yang dilakukan untuk kepentingan Israel. “Bagi kamu” lebih tepat daripada “kepada kamu”, yang dapat menyiratkan tindakan yang langsung dikenakan kepada mereka.
- source_word: בַּמִּדְבָּר
  choice: di padang gurun
  rationale: מִדְבָּר menunjuk pada wilayah belantara tempat perjalanan Israel. “Padang gurun” merupakan padanan baku, jelas, dan tidak membatasi gambaran pada gurun pasir semata.
- source_word: עַד
  choice: sampai
  rationale: עַד pertama menyatakan batas waktu berlangsungnya tindakan-tindakan Allah selama perjalanan di padang gurun.
- source_word: בֹּאֲכֶם
  choice: kamu tiba
  rationale: Infinitif konstruk dari בוא dengan sufiks orang kedua jamak setelah עַד secara alami diterjemahkan sebagai klausa finit. “Tiba” sesuai dengan penyebutan tujuan berupa tempat, tanpa menambahkan gagasan memasuki wilayah berbatas.
- source_word: עַד הַמָּקוֹם הַזֶּה
  choice: di tempat ini
  rationale: עַד kedua menyatakan batas atau tujuan ruang. Dalam bahasa Indonesia, rangkaian “sampai kamu tiba di tempat ini” secara idiomatis menyampaikan perkembangan dari batas waktu menuju tempat tujuan, meskipun preposisi kedua tidak diterjemahkan secara terpisah.
theological_decisions:
- issue: Subjek tersirat dari עָשָׂה
  choice: Akhiran “-Nya” merujuk kepada TUHAN berdasarkan konteks sekitar.
  alternative: “yang Ia lakukan” atau penyebutan eksplisit “yang dilakukan TUHAN”
  rationale: Konteks kalimat yang lebih luas menyebut perbuatan-perbuatan TUHAN. Akhiran “-Nya” membawa anteseden itu tanpa mengulang nama ilahi atau menambahkan isi teologis.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pronomina “kamu” dipakai untuk orang kedua jamak sesuai konteks umat Israel; ketunggalan bentuk Indonesia dibiarkan ditentukan oleh konteks. Tanda pisah panjang dipertahankan karena ayat ini belum menutup rangkaian sintaksis yang berlanjut.
