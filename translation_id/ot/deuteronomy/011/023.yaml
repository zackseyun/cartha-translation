  text: וְ/הוֹרִ֧ישׁ יְהוָ֛ה אֶת כָּל הַ/גּוֹיִ֥ם הָ/אֵ֖לֶּה מִ/לִּ/פְנֵי/כֶ֑ם וִֽ/ירִשְׁתֶּ֣ם גּוֹיִ֔ם גְּדֹלִ֥ים וַ/עֲצֻמִ֖ים מִ/כֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/023.yaml
  text: then Yahweh will drive out all these nations before you, and you will dispossess nations greater and mightier than you.
translation:
  language: id
  text: maka Yahweh akan menghalau semua bangsa ini dari hadapanmu, dan kamu akan menaklukkan bangsa-bangsa yang lebih besar dan lebih kuat daripada kamu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהוֹרִישׁ
  choice: akan menghalau
  rationale: Bentuk Hifil dari ירשׁ menyatakan tindakan kausatif yang membuat bangsa-bangsa kehilangan tempat atau miliknya; “menghalau” alami dalam konteks penaklukan dan berbeda dari bentuk Qal berikutnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: כָּל הַגּוֹיִם הָאֵלֶּה
  choice: semua bangsa ini
  rationale: גּוֹיִם menunjuk kelompok-kelompok bangsa dalam konteks geopolitik tanah Kanaan.
- source_word: מִלִּפְנֵיכֶם
  choice: dari hadapanmu
  rationale: Mempertahankan citra harfiah “dari depan/hadapan kalian” dengan ungkapan Indonesia yang wajar.
- source_word: וִירִשְׁתֶּם
  choice: kamu akan merebut milik
  rationale: Qal ירשׁ dapat berarti memiliki, mewarisi, atau merampas hak milik. Karena objek langsungnya adalah bangsa-bangsa, “merebut milik bangsa-bangsa” menyampaikan bahwa mereka dicabut dari kepemilikannya tanpa memberi kesan bahwa bangsa-bangsa itu sendiri menjadi milik Israel.
- source_word: גּוֹיִם
  choice: bangsa-bangsa
  rationale: Menjaga konsistensi leksikal dan nuansa politik-etnis dari גּוֹיִם.
- source_word: גְּדֹלִים
  choice: lebih besar
  rationale: מִכֶּם memberi nilai komparatif; “lebih besar” dapat mencakup jumlah maupun kedudukan.
- source_word: וַעֲצֻמִים
  choice: lebih kuat
  rationale: עָצוּם menyatakan kekuatan atau keperkasaan; “lebih kuat” jelas dan alami dalam bahasa Indonesia modern.
- source_word: מִכֶּם
  choice: daripada kamu
  rationale: Merupakan pemakaian komparatif מן dengan sufiks orang kedua jamak; bahasa Indonesia memakai “daripada kamu”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Makna וִירִשְׁתֶּם dengan objek bangsa-bangsa
  choice: kamu akan merebut milik bangsa-bangsa
  alternative: kamu akan menduduki bangsa-bangsa; kamu akan menghalau bangsa-bangsa
  rationale: Ungkapan ini mempertahankan hubungan dengan gagasan kepemilikan dalam ירשׁ sekaligus menghindari tafsiran bahwa Israel memiliki atau mewarisi bangsa-bangsa sebagai manusia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “kamu” dipakai sebagai sapaan kolektif kepada Israel. Struktur dua klausa serta pengulangan “bangsa” dipertahankan; “maka” menghubungkan ayat ini dengan syarat dalam konteks sebelumnya.
