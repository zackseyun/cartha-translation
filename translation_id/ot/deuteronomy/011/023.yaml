  source_fidelity: 'Klausa pertama diterjemahkan dengan setia: וְהוֹרִישׁ dalam Hifil tepat dipahami sebagai tindakan Yahweh menghalau atau menyingkirkan bangsa-bangsa itu. Namun, וִירִשְׁתֶּם memiliki bangsa-bangsa sebagai objek langsung dan dalam konteks ini berarti menaklukkan/mengusir mereka dari milik atau wilayah mereka. Frasa "merebut milik bangsa-bangsa" mengalihkan objek teks dari bangsa-bangsa kepada harta atau milik mereka.'
