base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/013.yaml
  text: And if you indeed listen to my commandments that I am commanding you today[a], to love Yahweh your God and to serve him with all your heart and with all your soul[c][b],
translation:
  language: id
  text: Jika kamu sungguh-sungguh mendengarkan perintah-perintah-Ku yang Kuperintahkan kepadamu hari ini[a], dengan mengasihi Yahweh, Allahmu, dan melayani Dia dengan segenap hati dan jiwa kamu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jika kamu sungguh-sungguh mendengarkan”; dalam konteks ini, mendengarkan juga dapat mengandung arti menaati dengan saksama.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “jiwa” juga dapat berarti “hidup”, “diri”, atau “seluruh keberadaan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Jika
  rationale: Gabungan ini membuka syarat yang berlanjut ke ayat berikutnya. Dalam bahasa Indonesia, “Jika” menyampaikan fungsi kondisionalnya secara wajar tanpa ungkapan harfiah yang kaku.
- source_word: שָׁמֹעַ תִּשְׁמְעוּ
  choice: kamu sungguh-sungguh mendengarkan
  rationale: Infinitif absolut yang diikuti bentuk finit menegaskan tindakan mendengar. Pilihan ini mempertahankan citra mendengar sekaligus penekanannya; dalam konteks perjanjian, mendengar juga menyiratkan ketaatan.
- source_word: אֶל מִצְוֺתַי
  choice: perintah-perintah-Ku
  rationale: Bentuk jamak merujuk pada berbagai kewajiban yang diperintahkan dalam konteks perjanjian.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: yang Kusampaikan kepadamu hari ini
  rationale: Partisip Ibrani menunjukkan tindakan Musa yang sedang berlangsung dalam pidatonya. “Kusampaikan” menghindari pengulangan canggung “perintah-perintah ... yang Kuperintahkan” sambil tetap menunjukkan bahwa semuanya diperintahkan pada hari itu.
- source_word: לְאַהֲבָה אֶת יְהוָה אֱלֹהֵיכֶם
  choice: dengan mengasihi Yahweh, Allahmu
  rationale: Infinitif ini menjelaskan isi atau cara tanggapan yang diperintahkan. “Dengan mengasihi” menghubungkannya secara alami dengan syarat utama tanpa memaksakan relasi sintaksis yang lebih sempit.
- source_word: וּלְעָבְדוֹ
  choice: dan melayani Dia
  rationale: Kata עבד mencakup pengabdian, ketaatan, dan pelayanan yang bersifat ibadah. “Melayani” mempertahankan keluasan makna itu.
- source_word: בְּכָל לְבַבְכֶם
  choice: dengan segenap hatimu
  rationale: לֵבָב menunjuk batin yang mencakup kehendak, pikiran, dan perasaan. Ungkapan Indonesia ini alami dan mapan.
- source_word: וּבְכָל נַפְשְׁכֶם
  choice: dan segenap jiwamu
  rationale: נֶפֶשׁ dapat berarti jiwa, hidup, diri, atau seluruh keberadaan. “Jiwa” mempertahankan padanan tradisional, sedangkan keluasan maknanya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian YHWH. “Yahweh” mempertahankan nama diri itu, bukan menggantinya dengan gelar.
- issue: Daya makna שָׁמֹעַ תִּשְׁמְעוּ
  choice: sungguh-sungguh mendengarkan
  alternative: menaati dengan sungguh-sungguh
  rationale: Ungkapan Ibrani menegaskan tindakan mendengar, yang dalam konteks ini mencakup tanggapan taat. Teks utama mempertahankan unsur mendengar, sedangkan nuansa ketaatan dicatat tanpa menghapus ambiguitas leksikalnya.
- issue: Hubungan infinitif לְאַהֲבָה dan וּלְעָבְדוֹ dengan klausa utama
  choice: dengan mengasihi ... dan melayani
  alternative: untuk mengasihi ... dan melayani
  rationale: Infinitif tersebut dapat dipahami sebagai isi, tujuan, atau cara ketaatan. “Dengan” menghasilkan bahasa Indonesia yang alami sambil menjaga hubungan erat antara mendengarkan perintah dan pengabdian kepada Yahweh.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia. Ayat diakhiri koma karena kalimat bersyarat berlanjut ke ayat 14.
