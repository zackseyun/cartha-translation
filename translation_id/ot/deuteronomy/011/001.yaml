id: DEU.11.1
reference: Deuteronomy 11:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אָ֣הַבְתָּ֔ אֵ֖ת יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/שָׁמַרְתָּ֣ מִשְׁמַרְתּ֗/וֹ וְ/חֻקֹּתָ֧י/ו וּ/מִשְׁפָּטָ֛י/ו וּ/מִצְוֺתָ֖י/ו כָּל הַ/יָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/001.yaml
  text: Therefore you shall love Yahweh your God and keep his charge[a], his statutes, his judgments[b], and his commandments all your days.
translation:
  language: id
  text: Karena itu, kasihilah Yahweh, Allahmu, dan peliharalah kewajiban-Nya[a], ketetapan-ketetapan-Nya, peraturan-peraturan-Nya[b], dan perintah-perintah-Nya sepanjang hidupmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Dan kasihilah Yahweh, Allahmu.” Konjungsi Ibrani pada awal ayat dapat diterjemahkan sederhana sebagai “dan”; di sini dipahami sebagai kesimpulan dari konteks sebelumnya.'
    reason: alternative_reading
  - marker: b
    text: 'Atau: “keputusan-keputusan hukum-Nya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אָהַבְתָּ
  choice: Karena itu, kasihilah
  rationale: Kata אָהַב berarti 'mengasihi'. Konjungsi וְ secara dasar berarti 'dan', tetapi dalam konteks wacana ayat ini menerapkan kesimpulan dari uraian sebelumnya; 'karena itu' menyampaikan daya inferensial tersebut secara alami. Alternatif literal dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama pribadi 'Yahweh', bukan diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk konstruk dengan akhiran orang kedua maskulin tunggal berarti 'Allahmu' dan mempertahankan relasi perjanjian dalam bahasa Ibrani.
- source_word: וְ/שָׁמַרְתָּ
  choice: dan peliharalah
  rationale: שׁמר dapat berarti menjaga, memelihara, atau menaati. 'Peliharalah' sesuai dengan konteks ketaatan perjanjian dan berpasangan secara alami dengan frasa kewajiban yang harus dijalankan.
- source_word: מִשְׁמַרְתּוֹ
  choice: kewajiban yang ditetapkan-Nya
  rationale: מִשְׁמֶרֶת menunjuk pada tugas, tanggung jawab, atau hal yang wajib dipelihara. Ungkapan ini lebih jelas bagi pembaca Indonesia modern daripada terjemahan harfiah yang kaku seperti 'penjagaan-Nya', tanpa menghilangkan gagasan kewajiban yang dipercayakan atau ditetapkan oleh Allah.
- source_word: חֻקֹּתָיו
  choice: ketetapan-ketetapan-Nya
  rationale: חֻקּוֹת adalah bentuk jamak dan merupakan istilah hukum bagi ketetapan atau statuta. Pilihan ini membedakannya dari מִשְׁפָּט dan מִצְוָה.
- source_word: וּמִשְׁפָּטָיו
  choice: peraturan-peraturan-Nya
  rationale: מִשְׁפָּט dapat berarti keputusan hukum, hukum, atau peraturan. Dalam deretan ketentuan perjanjian ini, 'peraturan-peraturan' alami dalam bahasa Indonesia dan tetap berbeda dari 'ketetapan' serta 'perintah'; alternatif 'keputusan-keputusan hukum-Nya' dicatat.
- source_word: וּמִצְוֺתָיו
  choice: perintah-perintah-Nya
  rationale: מִצְוָה adalah istilah umum untuk perintah. Bentuk jamak Ibrani dipertahankan dalam bahasa Indonesia.
- source_word: כָּל הַיָּמִים
  choice: sepanjang hidupmu
  rationale: Secara harfiah berarti 'segenap hari-hari'. Karena seluruh verba ditujukan kepada orang kedua tunggal, 'sepanjang hidupmu' menyampaikan cakupan waktunya secara idiomatis dan tepat.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. Bentuk 'Yahweh' mempertahankan nama perjanjian sebagai nama pribadi dan tidak menggantinya dengan sebuah gelar.
- issue: Daya penghubung וְ pada awal ayat
  choice: Karena itu
  alternative: Dan
  rationale: Konteks sebelumnya mendukung hubungan kesimpulan atau penerapan, tetapi konjungsi Ibrani sendiri juga dapat diterjemahkan sederhana sebagai 'dan'. Ambiguitas ini dipertahankan melalui catatan kaki.
- issue: Nuansa מִשְׁפָּטָיו dalam rangkaian istilah hukum
  choice: peraturan-peraturan-Nya
  alternative: keputusan-keputusan hukum-Nya
  rationale: Pilihan utama mudah dipahami dan sesuai dengan konteks hukum perjanjian. Alternatif mempertahankan lebih jelas unsur keputusan atau putusan yang juga terkandung dalam מִשְׁפָּט, sehingga dicatat tanpa memaksakan satu nuansa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan bentuk imperatif yang wajar. Deretan istilah hukum Ibrani dibedakan sebagai 'kewajiban', 'ketetapan', 'peraturan', dan 'perintah'. Akhiran ilahi ditulis dengan huruf kapital menurut kaidah umum bahasa Indonesia.
