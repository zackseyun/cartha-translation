base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/012.yaml
  text: a land that Yahweh your God cares for; the eyes of Yahweh your God are continually on it[a], from the beginning of the year to the end of the year.
translation:
  language: id
  text: suatu negeri yang diperhatikan Yahweh, Allahmu; mata Yahweh, Allahmu, senantiasa tertuju kepadanya[a], dari awal tahun sampai akhir tahun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang dicari-Nya” atau “yang dipelihara-Nya.” Kata kerja Ibrani dapat berarti mencari, menanyakan, atau memperhatikan; di sini kata itu menyatakan perhatian aktif Yahweh terhadap negeri tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ
  choice: negeri
  rationale: Dalam konteks Ulangan, kata ini menunjuk pada wilayah yang dijanjikan kepada Israel; “negeri” lebih tepat daripada “bumi” dan alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang dinyatakan oleh Tetragramaton, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Mencerminkan bentuk dengan sufiks orang kedua tunggal maskulin dan sesuai dengan sapaan perjanjian kepada Israel.
- source_word: דֹּרֵשׁ אֹתָהּ
  choice: dipelihara
  rationale: דרש dapat berarti mencari, menanyakan, atau memperhatikan. Dengan negeri sebagai objek, bentuk ini menyatakan perhatian dan pengawasan aktif Yahweh; “dipelihara” menyampaikannya secara alami tanpa menghapus kemungkinan leksikal yang dicatat dalam catatan kaki.
- source_word: תָּמִיד
  choice: senantiasa
  rationale: Menyatakan perhatian yang berlangsung terus-menerus dan mempertahankan ragam bahasa yang wajar sekaligus bermartabat.
- source_word: עֵינֵי יְהוָה אֱלֹהֶיךָ בָּהּ
  choice: Mata Yahweh, Allahmu, senantiasa tertuju kepadanya
  rationale: Mempertahankan gambaran antropomorfis Ibrani. “Tertuju kepadanya” menyatakan perhatian penuh pengawasan secara alami dalam bahasa Indonesia.
- source_word: מֵרֵשִׁית הַשָּׁנָה וְעַד אַחֲרִית שָׁנָה
  choice: dari awal tahun sampai akhir tahun
  rationale: Menyampaikan keseluruhan rentang waktu tahunan dengan jelas dan ringkas.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama pribadi ilahi secara langsung; “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Gambaran mata Yahweh
  choice: mempertahankan ungkapan antropomorfis “Mata Yahweh ... tertuju kepadanya”
  alternative: memparafrasakannya sebagai “Yahweh selalu mengawasinya”
  rationale: Gambaran konkret dalam teks sumber dipertahankan, tanpa mengharuskan pembacaan jasmaniah dan tanpa mengurangi penekanan pada perhatian ilahi.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Struktur relatif dipertahankan sesuai konteks ayat sebelumnya, sedangkan tanda titik digunakan agar dua klausa utama terbaca jelas. Pronomina “kepadanya” merujuk pada negeri.
