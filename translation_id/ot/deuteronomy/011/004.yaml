source:
  edition: WLC
  text: וַ/אֲשֶׁ֣ר עָשָׂה֩ לְ/חֵ֨יל מִצְרַ֜יִם לְ/סוּסָ֣י/ו וּ/לְ/רִכְבּ֗/וֹ אֲשֶׁ֨ר הֵצִ֜יף אֶת מֵ֤י יַם סוּף֙ עַל פְּנֵי/הֶ֔ם בְּ/רָדְפָ֖/ם אַחֲרֵי/כֶ֑ם וַ/יְאַבְּדֵ֣/ם יְהוָ֔ה עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/004.yaml
  text: and what he did to the army of Egypt[a], to its horses and its chariots, when he made the waters of the Red Sea overflow over them as they pursued you, and Yahweh destroyed them to this day,
translation:
  language: id
  text: dan apa yang dilakukan-Nya terhadap pasukan Mesir, terhadap kuda-kuda dan kereta-keretanya, ketika Ia membuat air Laut Merah[a] membanjiri mereka saat mereka mengejar kalian, dan Yahweh membinasakan mereka sampai hari ini,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “Laut Gelagah.” Secara tradisional diterjemahkan “Laut Merah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵיל מִצְרַיִם
  choice: pasukan Mesir
  rationale: Dalam konteks kuda dan kereta perang, חֵיל menunjuk pada kekuatan militer atau pasukan Mesir, bukan kekayaan atau kekuatan secara umum.
- source_word: לְסוּסָיו וּלְרִכְבּוֹ
  choice: terhadap kuda-kuda dan kereta-keretanya
  rationale: Akhiran pronominal tunggal merujuk secara kolektif kepada Mesir. Bentuk ulang menyatakan jamak secara alami dalam bahasa Indonesia, sedangkan kereta dipahami sebagai kereta perang dari konteks.
- source_word: הֵצִיף
  choice: membuat ... meluap menutupi
  rationale: Bentuk kausatif dipertahankan dengan 'membuat', sementara 'meluap menutupi' menyampaikan bahwa air itu datang dan menggenangi mereka secara alami dalam bahasa Indonesia.
- source_word: מֵי יַם סוּף
  choice: air Laut Merah
  rationale: '''Laut Merah'' merupakan sebutan geografis tradisional yang mudah dikenali pembaca Indonesia; arti nama Ibraninya dicantumkan dalam catatan kaki.'
- source_word: עַל־פְּנֵיהֶם
  choice: menutupi mereka
  rationale: Ungkapan ini dalam konteks menggambarkan air datang ke atas mereka. Terjemahan harfiah 'di atas muka mereka' akan kaku dan dapat menyesatkan.
- source_word: בְּרָדְפָם אַחֲרֵיכֶם
  choice: saat mereka mengejar kalian
  rationale: Preposisi ב dengan infinitif menunjukkan tindakan yang berlangsung bersamaan. 'Kalian' memperjelas bahwa pronomina Ibraninya berbentuk jamak.
- source_word: וַיְאַבְּדֵם
  choice: membinasakan mereka
  rationale: Bentuk kausatif verba אבד menyatakan bahwa Yahweh menyebabkan mereka binasa; 'membinasakan' mempertahankan daya kausatif dan register yang bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Terjemahan ini mempertahankan ungkapan waktu Ibrani dan hasil kehancuran yang dipandang berlaku hingga masa penuturan, tanpa menambahkan penjelasan yang tidak terdapat dalam teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian YHWH secara langsung. 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Identifikasi יַם סוּף
  choice: Laut Merah dalam teks utama, dengan catatan arti Ibraninya
  alternative: Laut Gelagah atau Laut Teberau
  rationale: Sebutan tradisional dipertahankan demi keterkenalan, sementara kemungkinan leksikal yang nyata dalam bahasa Ibrani tidak disembunyikan dan dicatat di kaki halaman.
- issue: Cakupan frasa עַד הַיּוֹם הַזֶּה
  choice: membinasakan mereka sampai hari ini
  alternative: membinasakan mereka, dengan akibat yang bertahan sampai hari ini
  rationale: Susunan ringkas mempertahankan keterikatan dan ketegangan ungkapan Ibrani tanpa secara diam-diam menjadikannya penjelasan mengenai akibat yang bertahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. 'Kalian' dipakai untuk mempertahankan bentuk orang kedua jamak; 'Ia' mengacu kepada Allah dan mengikuti kelaziman ejaan religius Indonesia. Ayat dipertahankan sebagai bagian lanjutan dari kalimat yang dimulai pada ayat-ayat sebelumnya.
