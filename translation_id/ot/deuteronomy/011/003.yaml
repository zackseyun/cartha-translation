base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/003.yaml
  text: and his signs and his deeds that he did in the midst of Egypt[c][b][a], to Pharaoh king of Egypt and to all his land—
translation:
  language: id
  text: dan tanda-tanda-Nya[a] serta tindakan-tindakan-Nya yang Dia lakukan di tengah-tengah Mesir[b] terhadap Firaun, raja Mesir, dan seluruh negerinya[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “keajaiban-keajaiban-Nya.”
    reason: lexical_alternative
  - marker: b
    text: Atau “di Mesir”; bahasa Ibrani secara lebih harfiah berbunyi “di tengah-tengah Mesir.”
    reason: lexical_alternative
  - marker: c
    text: Atau “melawan Firaun ... dan melawan seluruh negerinya.” Preposisi Ibrani secara harfiah berarti “kepada,” tetapi dalam konteks ini menunjuk pada tindakan penghukuman yang diarahkan kepada mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹתֹתָיו
  choice: tanda-tanda-Nya
  rationale: אוֹת berarti tanda, penanda, atau pertanda. “Tanda-tanda” merupakan padanan langsung yang tetap cukup luas; “mukjizat-mukjizat” akan lebih interpretatif.
- source_word: מַעֲשָׂיו
  choice: perbuatan-perbuatan
  rationale: מַעֲשֶׂה menunjuk pada sesuatu yang dilakukan, yakni tindakan atau perbuatan. Bentuk jamak dipertahankan agar selaras dengan teks sumber.
- source_word: אֲשֶׁר עָשָׂה
  choice: yang dilakukan-Nya
  rationale: Klausa relatif ini menerangkan tanda-tanda dan perbuatan-perbuatan tersebut. Bentuk pasif berpelaku “-Nya” alami dalam bahasa Indonesia dan tidak menambah makna.
- source_word: בְּתוֹךְ מִצְרַיִם
  choice: di tengah-tengah Mesir
  rationale: בְּתוֹךְ secara harfiah berarti “di tengah-tengah/di dalam.” Padanan ini mempertahankan penekanan bahwa tindakan tersebut berlangsung di dalam wilayah Mesir.
- source_word: לְפַרְעֹה
  choice: terhadap Firaun
  rationale: Preposisi לְ menandai sasaran yang terkena tindakan. “Terhadap” lebih alami daripada “kepada” setelah “dilakukan” dan tetap tidak secara eksplisit menentukan apakah relasinya semata-mata arah atau permusuhan.
- source_word: מֶלֶךְ מִצְרַיִם
  choice: raja Mesir
  rationale: Ini adalah padanan baku bagi konstruksi nomina Ibrani tersebut.
- source_word: וּלְכָל אַרְצוֹ
  choice: dan seluruh negerinya
  rationale: אֶרֶץ dapat berarti tanah, negeri, atau wilayah. Dalam hubungan dengan seorang raja, “seluruh negerinya” alami dan mencakup wilayah kekuasaannya.
- source_word: וְאֶת ... וְאֶת
  choice: dan ... serta
  rationale: Penanda objek אֵת tidak diterjemahkan tersendiri, tetapi koordinasi kedua objek dipertahankan. Variasi “dan ... serta” menghindari rangkaian yang kaku tanpa mengubah hubungan sintaksis.
theological_decisions:
- issue: Arah tindakan Allah kepada Firaun dan negerinya
  choice: terhadap Firaun ... dan seluruh negerinya
  alternative: melawan Firaun ... dan seluruh negerinya
  rationale: Konteks menunjukkan tindakan penghukuman, tetapi preposisi Ibrani לְ sendiri lebih luas daripada “melawan.” Terjemahan utama mempertahankan keluasan itu, sedangkan kemungkinan makna yang lebih bermusuhan dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ayat dipertahankan sebagai lanjutan sintaksis dari ayat sebelumnya, sehingga diawali huruf kecil dan diakhiri tanda pisah. Kapitalisasi “-Nya” mengikuti kebiasaan bahasa Indonesia untuk rujukan kepada Allah.
