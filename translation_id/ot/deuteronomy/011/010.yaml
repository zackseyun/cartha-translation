  text: כִּ֣י הָ/אָ֗רֶץ אֲשֶׁ֨ר אַתָּ֤ה בָא שָׁ֨מָּ/ה֙ לְ/רִשְׁתָּ֔/הּ לֹ֣א כְ/אֶ֤רֶץ מִצְרַ֨יִם֙ הִ֔וא אֲשֶׁ֥ר יְצָאתֶ֖ם מִ/שָּׁ֑ם אֲשֶׁ֤ר תִּזְרַע֙ אֶֽת זַרְעֲ/ךָ֔ וְ/הִשְׁקִ֥יתָ בְ/רַגְלְ/ךָ֖ כְּ/גַ֥ן הַ/יָּרָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/010.yaml
  text: For the land that you are entering to possess is not like the land of Egypt[a], from which you came out, where you sowed your seed and watered it with your foot[b], like a vegetable garden.
translation:
  language: id
  text: Sebab negeri yang akan engkau masuki untuk kaududuki itu tidak seperti negeri Mesir[a], dari tempat kalian keluar. Di sana engkau menabur benihmu dan mengairinya dengan kakimu[b], seperti kebun sayur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk Ibrani ini juga dapat diterjemahkan, “tempat engkau biasa menabur benihmu dan mengairinya dengan kakimu,” yang menunjuk pada kebiasaan pengairan di Mesir.
    reason: lexical_alternative
  - marker: b
    text: “Dengan kakimu” mungkin merujuk pada alat pengairan yang digerakkan dengan kaki atau pada tindakan mengarahkan air melalui saluran-saluran dengan kaki.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menghubungkan ayat ini sebagai penjelasan bagi nasihat sebelumnya secara alami dalam bahasa Indonesia.
- source_word: הָאָרֶץ
  choice: negeri
  rationale: Dalam konteks geografis-perjanjian Ulangan, 'negeri' menunjuk wilayah yang akan diduduki dan terdengar alami dalam bahasa Indonesia.
- source_word: בָא שָׁמָּה
  choice: yang akan engkau masuki
  rationale: Partisip Ibrani menyatakan gerak yang segera terjadi; bentuk futuratif Indonesia menyampaikan konteks itu dengan wajar.
- source_word: לְרִשְׁתָּהּ
  choice: untuk kaududuki
  rationale: Kata ירשׁ di sini menyatakan mengambil dan memegang suatu wilayah; 'duduki' mempertahankan nuansa penguasaan tanah tanpa menambahkan gagasan warisan keluarga.
- source_word: לֹא כְאֶרֶץ מִצְרַיִם
  choice: tidak seperti negeri Mesir
  rationale: Menyampaikan perbandingan langsung dan kontras eksplisit antara negeri tujuan dan Mesir.
- source_word: אֲשֶׁר יְצָאתֶם מִשָּׁם
  choice: tempat kalian keluar
  rationale: Mempertahankan idiom 'keluar' yang menggemakan peristiwa eksodus serta bentuk orang kedua jamak pada kata kerja Ibrani.
- source_word: אֲשֶׁר תִּזְרַע אֶת זַרְעֲךָ
  choice: Di sana engkau menabur benihmu
  rationale: Bentuk kala Ibrani dapat menggambarkan kebiasaan pada masa lampau; bahasa Indonesia tanpa penanda kala tetap membiarkan nuansa habitual itu terbuka. 'Benihmu' mempertahankan ungkapan konkret sumber.
- source_word: וְהִשְׁקִיתָ
  choice: dan mengairinya
  rationale: '''Mengairi'' tepat untuk praktik irigasi pertanian; akhiran ''-nya'' memasok objek yang tersirat dari konteks.'
- source_word: בְרַגְלְךָ
  choice: dengan kakimu
  rationale: Terjemahan konkret ini mempertahankan citra teks dan bentuk tunggal, tanpa memastikan mekanisme irigasi yang tidak dijelaskan.
- source_word: כְּגַן הַיָּרָק
  choice: seperti kebun sayur
  rationale: Menggambarkan petak kebun kecil yang diairi secara intensif dengan ungkapan Indonesia yang jelas dan modern.
theological_decisions:
- issue: Idiom eksodus dalam konteks perjanjian
  choice: tempat kalian keluar
  alternative: yang kalian tinggalkan
  rationale: Kata 'keluar' mempertahankan gema peristiwa keluarnya Israel dari Mesir tanpa menambahkan tafsiran teologis di luar teks.
- issue: Pergantian orang kedua tunggal dan jamak
  choice: engkau ... kalian ... engkau
  alternative: kamu secara konsisten
  rationale: Teks Ibrani berganti dari sapaan tunggal kolektif ke bentuk jamak pada 'kalian keluar', lalu kembali ke tunggal. Terjemahan mempertahankan pergantian yang bermakna ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. 'Engkau' dipakai untuk sapaan tunggal kolektif dan 'kalian' untuk bentuk jamak yang eksplisit. Susunan kalimat dibuat alami tanpa menghapus ketidakpastian mengenai cara tepat pengairan 'dengan kaki'.
