  naturalness: Teks revisi tetap memakai bahasa Indonesia baku modern. Pemisahan menjadi dua kalimat dapat dipertahankan dan membuat rujukan ‘di sana’ jelas kepada Mesir; penambahan ‘dari’ menghasilkan konstruksi yang wajar.
  terminology: ‘Negeri’, ‘kaududuki’, ‘benihmu’, dan ‘kebun sayur’ sesuai konteks dan register. Pergantian engkau–kalian–engkau dipertahankan sesuai bentuk tunggal–jamak–tunggal dalam bahasa Ibrani.
