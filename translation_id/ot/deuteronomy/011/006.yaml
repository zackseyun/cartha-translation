  source_fidelity: 'Terjemahan dengan setia mencerminkan struktur dan unsur utama Ibrani: tindakan TUHAN terhadap Datan dan Abiram, silsilah mereka, personifikasi bumi yang membuka mulutnya, penelanan mereka bersama rumah/seisi rumah, kemah, serta segala yang berkaitan dengan mereka, di tengah seluruh Israel. Pilihan “segala yang menyertai mereka” tidak mempersempit cakupan הַיְקוּם dan dijelaskan oleh catatan kaki.'
