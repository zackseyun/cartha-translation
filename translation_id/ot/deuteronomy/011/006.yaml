source:
  edition: WLC
  text: וַ/אֲשֶׁ֨ר עָשָׂ֜ה לְ/דָתָ֣ן וְ/לַ/אֲבִירָ֗ם בְּנֵ֣י אֱלִיאָב֮ בֶּן רְאוּבֵן֒ אֲשֶׁ֨ר פָּצְתָ֤ה הָ/אָ֨רֶץ֙ אֶת פִּ֔י/הָ וַ/תִּבְלָעֵ֥/ם וְ/אֶת בָּתֵּי/הֶ֖ם וְ/אֶת אָהֳלֵי/הֶ֑ם וְ/אֵ֤ת כָּל הַ/יְקוּם֙ אֲשֶׁ֣ר בְּ/רַגְלֵי/הֶ֔ם בְּ/קֶ֖רֶב כָּל יִשְׂרָאֵֽל־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/006.yaml
  text: and what he did to Dathan and Abiram[a], sons of Eliab son of Reuben—how the earth opened its mouth and swallowed them, their households, their tents, and every living thing at their feet[b], in the midst of all Israel.
translation:
  language: id
  text: dan apa yang dilakukan-Nya terhadap Datan dan Abiram, anak-anak Eliab, anak Ruben—bagaimana bumi membuka mulutnya lalu menelan mereka, seisi rumah mereka[a], kemah-kemah mereka, dan segala yang menyertai mereka[b], di tengah-tengah seluruh Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rumah-rumah mereka.” Kata Ibrani ini dapat menunjuk tempat tinggal fisik ataupun, secara lebih luas, seisi rumah atau rumah tangga mereka.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “segala yang ada di kaki mereka.” Ungkapan Ibrani ini mungkin mencakup semua orang dan segala sesuatu yang menyertai atau menjadi milik mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָשָׂה
  choice: dilakukan-Nya
  rationale: Verba umum ‘melakukan/membuat’; bentuk ini alami dalam klausa kilas balik dan pronomina -Nya mempertahankan rujukan kepada Allah dari konteks.
- source_word: בְּנֵי אֱלִיאָב בֶּן רְאוּבֵן
  choice: anak-anak Eliab, anak Ruben
  rationale: Mempertahankan susunan silsilah Ibrani tanpa mengubah ‘anak Ruben’ menjadi label kesukuan yang lebih interpretatif.
- source_word: פָּצְתָה הָאָרֶץ אֶת־פִּיהָ
  choice: bumi membuka mulutnya
  rationale: Mempertahankan personifikasi dan gambaran konkret bahasa Ibrani.
- source_word: וַתִּבְלָעֵם
  choice: lalu menelan mereka
  rationale: בלע secara konkret berarti ‘menelan’; ‘lalu’ menyampaikan urutan naratif waw-konsekutif secara alami.
- source_word: בָּתֵּיהֶם
  choice: seisi rumah mereka
  rationale: בַּיִת dapat menunjuk rumah fisik maupun rumah tangga. Karena kemah disebut tersendiri, ‘seisi rumah’ secara alami menunjuk orang-orang dalam rumah tangga, sementara catatan kaki mempertahankan arti harfiahnya.
- source_word: אָהֳלֵיהֶם
  choice: kemah-kemah mereka
  rationale: Padanan harfiah dan jelas dalam latar perjalanan Israel di padang gurun.
- source_word: כָּל־הַיְקוּם אֲשֶׁר בְּרַגְלֵיהֶם
  choice: segala yang menyertai mereka
  rationale: הַיְקוּם dan ungkapan ‘di kaki mereka’ memiliki cakupan yang tidak sepenuhnya pasti, meliputi apa atau siapa yang berada bersama, mengikuti, atau menjadi milik mereka. Rumusan ini alami tetapi tidak membatasi rujukannya hanya pada makhluk hidup atau harta benda.
- source_word: בְּקֶרֶב כָּל־יִשְׂרָאֵל
  choice: di tengah-tengah seluruh Israel
  rationale: Mempertahankan nuansa spasial dan publik dari peristiwa yang terjadi di tengah umat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Personifikasi ‘bumi membuka mulutnya’ dipertahankan. Pilihan ‘seisi rumah’ dan ‘segala yang menyertai’ menjaga kelancaran sekaligus mempertahankan ambiguitas leksikal melalui catatan kaki.
