base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/014.yaml
  text: then I will give the rain for your land in its season[a], the early rain and the late rain, and you will gather in your grain, your new wine[c][b], and your oil.
translation:
  language: id
  text: maka Aku akan menurunkan hujan untuk negeri kalian pada waktunya, yaitu hujan awal dan hujan akhir,[a] dan engkau akan mengumpulkan biji-bijianmu, anggur barumu,[b] dan minyakmu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hujan pertama dan hujan terakhir.”
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, anggur yang baru dihasilkan; dapat juga diterjemahkan, “anggur.”
    reason: lexical_alternative
  - marker: c
    text: Maksudnya, minyak zaitun.
    reason: cultural_note
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: maka Aku akan menurunkan
  rationale: Dalam rangkaian bersyarat dari ayat sebelumnya, bentuk ini menyatakan akibat atau janji yang akan datang. Untuk hujan, bahasa Indonesia secara alami memakai 'menurunkan', meskipun secara harfiah verba Ibrani berarti 'memberikan'.
- source_word: מְטַר אַרְצְכֶם
  choice: hujan bagi negerimu
  rationale: מָטָר adalah hujan, sedangkan אֶרֶץ dalam konteks perjanjian dan pertanian menunjuk pada negeri atau wilayah tanah Israel, bukan negara dalam pengertian politik modern. Sufiks jamak 'kalian' pada 'negerimu' dipadukan dengan sapaan kolektif tunggal dalam bagian berikutnya, sebagaimana peralihan bentuk dalam teks Ibrani.
- source_word: בְּעִתּוֹ
  choice: pada musimnya
  rationale: Menunjukkan waktu atau musim yang tepat bagi turunnya hujan dan mempertahankan nuansa pertanian.
- source_word: יוֹרֶה וּמַלְקוֹשׁ
  choice: hujan awal dan hujan akhir
  rationale: Kedua istilah menunjuk pada hujan musiman pertama dan terakhir, umumnya pada musim gugur dan musim semi. Padanan temporal mempertahankan pasangan istilah Ibrani tanpa membatasi terjemahan utama pada penanggalan musim yang mungkin kurang akrab bagi pembaca Indonesia.
- source_word: וְאָסַפְתָּ
  choice: sehingga engkau dapat mengumpulkan
  rationale: Verba ini berarti mengumpulkan atau membawa masuk hasil bumi. 'Sehingga' menyatakan hasil yang wajar dari turunnya hujan, sementara 'dapat' menghasilkan ungkapan Indonesia yang alami tanpa mengubah janji menjadi perintah.
- source_word: דְגָנֶךָ
  choice: gandummu
  rationale: דָּגָן merupakan istilah umum bagi hasil biji-bijian. Dalam bahasa Indonesia Alkitabiah yang tetap mudah dipahami, 'gandum' dapat mewakili hasil serealia, meski 'biji-bijianmu' merupakan alternatif yang lebih luas.
- source_word: וְתִירֹשְׁךָ
  choice: anggur barumu
  rationale: תִּירוֹשׁ lazim menunjuk pada anggur yang baru dihasilkan atau sari anggur hasil panen, bukan sekadar buah anggur. 'Anggur baru' mempertahankan kekhususan istilah dan triad pertanian.
- source_word: וְיִצְהָרֶךָ
  choice: minyakmu
  rationale: Dalam rangkaian baku gandum, anggur, dan minyak, יִצְהָר menunjuk pada minyak zaitun. Bentuk singkat 'minyakmu' mempertahankan irama teks, dengan referennya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Bahasa berkat pertanian dalam konteks perjanjian
  choice: Menerjemahkannya sebagai janji konkret tentang hujan musiman dan hasil bumi bagi Israel di negerinya.
  alternative: Menafsirkan hujan terutama sebagai lambang berkat rohani, eskatologis, atau jaminan kemakmuran umum.
  rationale: Teks Ibrani secara langsung berbicara tentang berkat pertanian dalam hubungan perjanjian. Terjemahan tidak memasukkan penafsiran teologis lanjutan ke dalam teks utama.
- issue: Pergantian sapaan jamak dan tunggal
  choice: Memakai 'negerimu' dan 'engkau' sebagai sapaan kolektif kepada Israel, tanpa menghilangkan peralihan bentuk yang ada dalam bahasa Ibrani.
  alternative: Menyeragamkan seluruh sapaan menjadi bentuk jamak 'kalian' atau seluruhnya menjadi individual.
  rationale: אַרְצְכֶם memakai sufiks orang kedua jamak, sedangkan וְאָסַפְתָּ dan sufiks hasil bumi memakai orang kedua tunggal. Pergantian ini merupakan ciri nyata teks dan dapat mencerminkan Israel sebagai umat sekaligus satu kesatuan kolektif.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dibaca. 'Aku' mempertahankan tuturan ilahi orang pertama dari konteks. 'Engkau' dipakai sebagai sapaan kolektif yang khidmat, sementara penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
