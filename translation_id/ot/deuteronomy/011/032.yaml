  text: And you shall be careful to do all the statutes and the judgments that I am setting before you today[a].
translation:
  language: id
  text: Kalian harus dengan saksama menjalankan semua ketetapan dan peraturan yang Kuberikan di hadapan kalian hari ini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara harfiah, “yang Kuberikan di hadapan kalian hari ini”; ungkapan Ibrani ini dapat berarti “yang Kutaruh di hadapan kalian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁמַרְתֶּם לַ/עֲשׂוֹת
  choice: harus dengan saksama melakukan
  rationale: Gabungan שׁמר dengan infinitif עשה menyatakan kewajiban untuk berhati-hati atau bersungguh-sungguh dalam melaksanakan, bukan sekadar menyimpan atau menaati secara umum.
- source_word: כָּל הַֽ/חֻקִּים
  choice: semua ketetapan
  rationale: כָּל menegaskan keseluruhan, sedangkan חֻקִּים menunjuk pada ketentuan yang ditetapkan dalam konteks hukum perjanjian.
- source_word: וְ/אֶת הַ/מִּשְׁפָּטִים
  choice: dan peraturan
  rationale: מִשְׁפָּטִים dapat berarti keputusan hukum atau peraturan. 'Peraturan' terdengar alami dalam bahasa Indonesia modern dan tetap dibedakan dari 'ketetapan' untuk חֻקִּים.
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לִ/פְנֵי/כֶם
  choice: yang Kusampaikan kepadamu
  rationale: Secara harfiah berarti 'yang Aku berikan di hadapanmu', tetapi dalam konteks penyajian hukum idiom ini berarti menyampaikan atau menaruh di hadapan seseorang. 'Kusampaikan kepadamu' mengungkapkan maksudnya secara wajar.
- source_word: הַ/יּוֹם
  choice: hari ini
  rationale: Padanan langsung dan alami yang mempertahankan kemendesakan waktu dalam amanat perjanjian.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'Kamu' mengikuti sapaan jamak kepada umat secara kolektif; klitik ilahi 'Ku-' memakai huruf kapital. Susunan kalimat mempertahankan gaya pengarahan hukum perjanjian tanpa menjadi kaku.
