  text: כָּל הַ/מָּק֗וֹם אֲשֶׁ֨ר תִּדְרֹ֧ךְ כַּֽף רַגְלְ/כֶ֛ם בּ֖/וֹ לָ/כֶ֣ם יִהְיֶ֑ה מִן הַ/מִּדְבָּ֨ר וְ/הַ/לְּבָנ֜וֹן מִן הַ/נָּהָ֣ר נְהַר פְּרָ֗ת וְ/עַד֙ הַ/יָּ֣ם הָֽ/אַחֲר֔וֹן יִהְיֶ֖ה גְּבֻלְ/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/024.yaml
  text: Every place where the sole of your foot treads will be yours; from the wilderness and Lebanon[a], from the River, the Euphrates River, as far as the western sea, will be your border.
translation:
  language: id
  text: Setiap tempat yang kalian injak dengan telapak kaki kalian akan menjadi milik kalian; dari padang gurun dan Lebanon, dari Sungai, yaitu Sungai Efrat, sampai ke laut sebelah barat[a], akan menjadi batas kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “laut yang di belakang” atau “laut yang terakhir”; menurut orientasi geografis Ibrani, yang dimaksud ialah laut di sebelah barat, yang secara tradisional dipahami sebagai Laut Tengah.
    reason: Menjelaskan arti harfiah אַחֲרוֹן dan rujukan geografis ungkapan tersebut tanpa memasukkan identifikasi itu secara mutlak ke dalam teks utama.
lexical_decisions:
- source_word: כָּל הַמָּקוֹם
  choice: Setiap tempat
  rationale: Ungkapan distributif ini menunjuk pada tiap-tiap lokasi, sehingga “setiap tempat” alami dalam bahasa Indonesia dan mempertahankan cakupannya.
- source_word: אֲשֶׁר תִּדְרֹךְ כַּף רַגְלְכֶם בּוֹ
  choice: yang diinjak telapak kaki kalian
  rationale: כַּף רֶגֶל berarti telapak kaki, sedangkan דרך dalam konteks ini berarti menginjak atau menapaki. Bentuk “kalian” mempertahankan orang kedua jamak.
- source_word: לָכֶם יִהְיֶה
  choice: akan menjadi milik kalian
  rationale: Menyampaikan makna kepemilikan dalam rumusan janji secara ringkas dan wajar.
- source_word: מִן הַמִּדְבָּר
  choice: dari padang gurun
  rationale: מִדְבָּר dapat berarti daerah belantara atau gurun; “padang gurun” merupakan istilah geografis yang jelas dan lazim.
- source_word: וְהַלְּבָנוֹן
  choice: dan Lebanon
  rationale: Mempertahankan penghubung Ibrani dalam rangkaian penanda geografis tanpa mengubahnya menjadi tafsiran arah yang lebih tegas.
- source_word: מִן הַנָּהָר נְהַר פְּרָת
  choice: dari Sungai itu, yakni Sungai Efrat
  rationale: Mempertahankan struktur sumber yang mula-mula menyebut “Sungai itu” lalu mengidentifikasinya secara aposisional sebagai Sungai Efrat.
- source_word: וְעַד הַיָּם הָאַחֲרוֹן
  choice: sampai ke laut sebelah barat
  rationale: אַחֲרוֹן secara harfiah berarti “yang di belakang/terakhir”; dalam orientasi geografis Ibrani, ungkapan ini menunjuk pada laut di sebelah barat. Catatan kaki mempertahankan bentuk harfiahnya.
- source_word: יִהְיֶה גְּבֻלְכֶם
  choice: akan menjadi batas kalian
  rationale: גְּבוּל di sini menyatakan batas geografis; “batas kalian” mempertahankan rumusan sumber tanpa memperluasnya menjadi penafsiran tentang keseluruhan wilayah.
theological_decisions:
- issue: Bahasa janji geografis
  choice: Menerjemahkan ayat sebagai janji mengenai kepemilikan dan batas geografis tanpa menambahkan penafsiran tentang penggenapan atau tipologi.
  alternative: Menafsirkannya sebagai batas ideal atau sebagai kepemilikan kekal tanpa syarat.
  rationale: Ayat ini sendiri menyatakan luas wilayah yang dijanjikan dalam konteks perjanjian, tetapi tidak menyelesaikan perdebatan teologis yang lebih luas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk memperjelas bahwa pronomina Ibrani berbentuk jamak. Tanda titik koma menandai peralihan dari janji kepemilikan ke uraian batas wilayah, sementara susunan penanda geografis Ibrani tetap dipertahankan.
