  text: הֲ/לֹא הֵ֜מָּה בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֗ן אַֽחֲרֵי֙ דֶּ֚רֶךְ מְב֣וֹא הַ/שֶּׁ֔מֶשׁ בְּ/אֶ֨רֶץ֙ הַֽ/כְּנַעֲנִ֔י הַ/יֹּשֵׁ֖ב בָּ/עֲרָבָ֑ה מ֚וּל הַ/גִּלְגָּ֔ל אֵ֖צֶל אֵלוֹנֵ֥י מֹרֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/030.yaml
  text: Are they not beyond the Jordan[a], behind the way of the setting sun, in the land of the Canaanites who dwell in the Arabah, opposite Gilgal[c][b], beside the oaks of Moreh?
translation:
  language: id
  text: Bukankah keduanya terletak di seberang Sungai Yordan[a], di balik jalan menuju matahari terbenam[b], di negeri orang Kanaan yang tinggal di Araba, berhadapan dengan Gilgal, dekat pohon-pohon besar More[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di sisi lain Sungai Yordan”. Ungkapan Ibrani ini merupakan ungkapan geografis yang arah tepatnya bergantung pada sudut pandang pembicara.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di belakang jalan masuknya matahari”; maksud arahnya berkaitan dengan tempat matahari terbenam, yaitu barat.
    reason: lexical_alternative
  - marker: c
    text: Atau “pohon-pohon pasang More” atau “pohon-pohon tarbantin More”. Istilah Ibraninya dapat menunjuk kepada salah satu jenis pohon besar tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא הֵמָּה
  choice: Bukankah keduanya
  rationale: Pertanyaan retoris ini mengharapkan jawaban ya. Bentuk “keduanya” secara alami merujuk kepada dua gunung yang disebut dalam ayat sebelumnya tanpa mengganti pronomina Ibrani dengan nomina eksplisit.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: di seberang Sungai Yordan
  rationale: Ungkapan geografis ini dapat berarti “di seberang” atau “di sisi lain” menurut sudut pandang pembicara. “Sungai Yordan” merupakan bentuk Indonesia yang alami dan menjelaskan jenis unsur geografisnya.
- source_word: אַחֲרֵי דֶּרֶךְ מְבוֹא הַשֶּׁמֶשׁ
  choice: di balik jalan menuju matahari terbenam
  rationale: Terjemahan ini mempertahankan unsur “di balik”, “jalan”, dan gambaran matahari yang masuk atau terbenam, tanpa diam-diam menyederhanakan seluruh frasa menjadi arah mata angin “barat”.
- source_word: בְּאֶרֶץ הַכְּנַעֲנִי
  choice: di negeri orang Kanaan
  rationale: Etnonim tunggal Ibrani dipakai secara kolektif. “Orang Kanaan” adalah bentuk kolektif yang wajar dalam bahasa Indonesia.
- source_word: הַיֹּשֵׁב בָּעֲרָבָה
  choice: yang tinggal di Araba
  rationale: Partisip tunggal mengikuti kelompok kolektif “orang Kanaan”. Araba dipertahankan sebagai nama wilayah geografis, bukan digeneralisasi menjadi “dataran”.
- source_word: מוּל הַגִּלְגָּל
  choice: berhadapan dengan Gilgal
  rationale: “Berhadapan dengan” menyatakan hubungan letak secara jelas dan tetap dekat dengan makna spasial מוּל.
- source_word: אֵצֶל אֵלוֹנֵי מֹרֶה
  choice: dekat pohon-pohon besar More
  rationale: אֵצֶל menyatakan kedekatan. Karena אֵלוֹן dapat menunjuk kepada pasang atau tarbantin, terjemahan utama memakai istilah umum “pohon-pohon besar” dan mempertahankan kemungkinan jenis pohonnya dalam catatan kaki.
theological_decisions: []
