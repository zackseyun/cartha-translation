  text: Be careful lest your heart be deceived and you turn aside and serve other gods and bow down to them[a].
translation:
  language: id
  text: Berhati-hatilah agar hati kalian tidak terbujuk, lalu kalian berpaling, melayani ilah-ilah lain, dan bersujud kepada mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “agar hati kalian tidak tertipu.” Kata kerja Ibrani ini dapat berarti terbujuk, terpikat, atau tertipu.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: Jagalah dirimu
  rationale: Imperatif jamak dengan לָכֶם merupakan rumusan peringatan refleksif. Bentuk ini mempertahankan daya perintah dan makna menjaga diri dalam bahasa Indonesia yang wajar.
- source_word: פֶּן
  choice: agar ... jangan
  rationale: פֶּן membuka klausa peringatan negatif. Susunan 'agar ... jangan' mengungkapkan maksud peringatan dengan alami dan bermartabat dalam bahasa Indonesia.
- source_word: יִפְתֶּה
  choice: terbujuk
  rationale: Bentuk ini dapat berarti dipersuasi, dipikat, atau diperdaya. 'Terbujuk' mempertahankan unsur daya tarik yang menyesatkan tanpa menentukan adanya penipu tertentu.
- source_word: לְבַבְכֶם
  choice: hatimu
  rationale: לֵבָב menunjuk batin sebagai pusat kehendak dan pemahaman. 'Hati' merupakan padanan baku yang tetap mempertahankan gambaran Ibrani.
- source_word: וְסַרְתֶּם
  choice: lalu kamu menyimpang
  rationale: סור di sini berarti beralih dari jalan atau kesetiaan yang benar. 'Menyimpang' menyampaikan bahasa perjanjian itu secara alami.
- source_word: וַעֲבַדְתֶּם
  choice: beribadah kepada
  rationale: עבד ketika objeknya ilah berarti melayani dalam pengabdian religius. 'Beribadah kepada' lebih alami daripada 'melayani' dalam konteks Indonesia, sementara tindakan konkret pada verba berikutnya tetap dibedakan.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ilah-ilah lain
  rationale: Frasa ini secara langsung berarti ilah-ilah lain. 'Ilah' membedakan sebutan umum bagi objek penyembahan dari nama atau gelar Allah Israel.
- source_word: וְהִשְׁתַּחֲוִיתֶם לָהֶם
  choice: dan sujud menyembah mereka
  rationale: השתחוה menggambarkan tindakan membungkuk atau bersujud sebagai penghormatan dan penyembahan. 'Sujud menyembah' mempertahankan tindakan jasmani sekaligus makna religiusnya.
theological_decisions:
- issue: Sifat peringatan terhadap kemurtadan
  choice: Ayat ini mempertahankan urutan dari hati yang terbujuk, penyimpangan, pengabdian kepada ilah-ilah lain, hingga tindakan sujud menyembah.
  alternative: Merangkum seluruh urutan sebagai larangan terhadap penyembahan berhala.
  rationale: Urutan Ibrani menunjukkan gerak dari keadaan batin menuju peralihan kesetiaan dan tindakan ibadah. Terjemahan tidak meratakannya menjadi satu istilah teologis abstrak.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Pronomina tunggal kolektif 'dirimu/hatimu/kamu' mencerminkan bentuk Ibrani yang menyapa Israel sebagai umat secara kolektif; pengulangan 'dan' diringankan dengan 'lalu' agar alurnya alami tanpa menghilangkan urutan tindakan.
