revisions:
- from: Ketika Yahweh, Allahmu, membawa engkau masuk ke negeri yang akan engkau masuki untuk mendudukinya, engkau harus menetapkan[a] berkat itu di Gunung Gerizim dan kutuk itu di Gunung Ebal.
  to: Ketika Yahweh, Allahmu, membawa engkau masuk ke negeri yang akan engkau masuki untuk memilikinya, engkau akan menaruh[a] berkat itu di Gunung Gerizim dan kutuk itu di Gunung Ebal.
  rationale: Revisi memakai ‘memilikinya’ untuk cakupan ירשׁ, ‘engkau akan’ untuk bentuk verbal Ibrani dalam urutan instruksi masa depan, dan ‘menaruh’ untuk נתן. Catatan kaki mempertahankan alternatif ‘mengucapkan’ tanpa mengunci tindakan upacara yang tepat.
