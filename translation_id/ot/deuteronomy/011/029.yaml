  verdict: revise
  source_fidelity: 'Secara umum setia pada Ibrani: nama Yahweh, hubungan ''Allahmu'', masuk ke negeri untuk memilikinya, serta kesejajaran berkat dan kutuk pada kedua gunung dipertahankan. Namun ''menduduki'' dapat menyempitkan ירשׁ kepada pendudukan, sedangkan maknanya di sini ialah mengambil milik/memiliki. ''Menetapkan ... di'' juga kurang langsung mencerminkan נתן (''menaruh/memberikan'') dan terdengar abstrak dalam bahasa Indonesia.'
  naturalness: Kalimatnya dapat dipahami dan registernya baku, tetapi 'menetapkan berkat itu di Gunung Gerizim' kurang idiomatis. 'Engkau harus' juga memberi nuansa kewajiban yang lebih tegas daripada bentuk imperfect dalam rangkaian instruksi; 'engkau akan' lebih netral dan dekat.
  terminology: Yahweh, Allahmu, Gunung Gerizim, Gunung Ebal, berkat, dan kutuk sudah konsisten dan sesuai. 'Memiliki' lebih baik untuk ירשׁ daripada 'menduduki' dalam konteks ini.
  issues:
  - severity: medium
    issue: ‘Mendudukinya’ untuk לְרִשְׁתָּהּ
    rationale: Kata ini dapat terutama dipahami sebagai tinggal atau melakukan pendudukan di suatu wilayah. ירשׁ dalam konteks ini menyatakan mengambil milik/memiliki negeri; ‘untuk memilikinya’ mempertahankan cakupan itu tanpa konotasi tambahan.
  - severity: medium
    issue: ‘Menetapkan ... di’ untuk וְנָתַתָּה עַל
    rationale: ‘Menetapkan’ bersifat abstrak dan kolokasinya dengan lokasi gunung tidak alami. ‘Menaruh’ merepresentasikan makna dasar נתן dan tetap tidak menentukan tindakan seremonial secara berlebihan.
  - severity: low
    issue: ‘Engkau harus’
    rationale: Bentuk imperfect setelah klausa waktu dapat diterjemahkan secara netral sebagai tindakan yang akan dilakukan. ‘Engkau akan’ menghindari penambahan penekanan deontik yang tidak perlu.
