source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּ֤י יְבִֽיאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֶל הָ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּ֑/הּ וְ/נָתַתָּ֤ה אֶת הַ/בְּרָכָה֙ עַל הַ֣ר גְּרִזִ֔ים וְ/אֶת הַ/קְּלָלָ֖ה עַל הַ֥ר עֵיבָֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/029.yaml
  text: And when Yahweh your God brings you into the land that you are entering to possess[a], you shall set the blessing on Mount Gerizim and the curse on Mount Ebal.
translation:
  language: id
  text: Ketika Yahweh, Allahmu, membawa engkau masuk ke negeri yang akan engkau masuki untuk memilikinya, engkau akan menaruh[a] berkat itu di Gunung Gerizim dan kutuk itu di Gunung Ebal.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengucapkan”. Kata Ibrani secara harfiah berarti “memberi” atau “menaruh”; tindakan upacaranya dijelaskan lebih lanjut dalam konteks sekitarnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Ketika
  rationale: Ungkapan ini memperkenalkan keadaan yang akan terjadi. “Ketika” menyampaikan fungsi temporalnya secara alami tanpa mempertahankan bentuk Ibrani yang kaku.
- source_word: יְבִיאֲךָ
  choice: membawa engkau masuk
  rationale: Bentuk hifil dari בוא bersifat kausatif, yaitu “membawa masuk”. Pilihan ini mempertahankan tindakan Yahweh sebagai pihak yang membawa Israel ke negeri itu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks sumber tetap terlihat.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk dengan akhiran orang kedua tunggal maskulin diterjemahkan secara langsung dan wajar sebagai “Allahmu”.
- source_word: הָאָרֶץ
  choice: negeri
  rationale: Dalam konteks Ulangan, kata ini menunjuk kepada negeri yang akan dimasuki Israel. “Negeri” lebih alami daripada “tanah” untuk wilayah tempat suatu bangsa tinggal.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: yang akan engkau masuki
  rationale: Partisipel בָא dengan penunjuk arah שָׁמָּה menyatakan masuknya Israel yang sudah dekat. Bentuk “akan ... masuki” wajar dalam konteks janji dan perintah yang berorientasi ke masa depan.
- source_word: לְרִשְׁתָּהּ
  choice: untuk mendudukinya
  rationale: ירשׁ di sini berarti mengambil dan memegang negeri sebagai milik. “Mendudukinya” menyampaikan penguasaan atas negeri tanpa membatasi maknanya pada warisan legal.
- source_word: וְנָתַתָּה
  choice: engkau harus menetapkan
  rationale: נתן secara dasar berarti “memberi, menaruh, menempatkan”. Dalam upacara perjanjian ini, “menetapkan” mempertahankan gagasan penempatan atau pengaitan berkat dan kutuk dengan kedua gunung tanpa memastikan secara berlebihan bentuk tindakan seremonialnya.
- source_word: הַבְּרָכָה
  choice: berkat itu
  rationale: Nomina definit ini menunjuk kepada berkat perjanjian yang sudah disebut dalam konteks.
- source_word: עַל הַר גְּרִזִים
  choice: di Gunung Gerizim
  rationale: Dalam bahasa Indonesia, “di” merupakan ungkapan lokasi yang alami untuk tindakan seremonial yang dikaitkan dengan sebuah gunung.
- source_word: הַקְּלָלָה
  choice: kutuk itu
  rationale: “Kutuk” mempertahankan kesejajaran nominal dengan “berkat”; kata penunjuk “itu” menyampaikan sifat definitnya.
- source_word: עַל הַר עֵיבָל
  choice: di Gunung Ebal
  rationale: Diterjemahkan sejajar dengan frasa tentang Gunung Gerizim dan dengan bentuk geografis Indonesia yang lazim.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai nama diri ilahi. “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Bentuk tindakan terhadap berkat dan kutuk
  choice: menetapkan berkat itu di Gunung Gerizim dan kutuk itu di Gunung Ebal
  alternative: mengucapkan berkat itu di Gunung Gerizim dan kutuk itu di Gunung Ebal
  rationale: Kata נתן tidak secara khusus berarti “mengucapkan”, meskipun konteks upacara dapat mencakup pengucapan. Terjemahan utama mempertahankan keluasan kata Ibrani, sedangkan catatan kaki menyajikan kemungkinan seremonialnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Kata ganti “engkau” dipakai karena Musa menyapa Israel secara tunggal kolektif, sesuai bentuk orang kedua tunggal dalam teks Ibrani. Pengulangan “negeri yang akan engkau masuki” dipertahankan karena mencerminkan penekanan sumber tanpa menjadi tidak wajar.
