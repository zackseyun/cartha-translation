source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֙ אֶת כָּל הַ/מִּצְוָ֔ה אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לְמַ֣עַן תֶּחֶזְק֗וּ וּ/בָאתֶם֙ וִֽ/ירִשְׁתֶּ֣ם אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר אַתֶּ֛ם עֹבְרִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/008.yaml
  text: So keep every commandment that I am commanding you today[c][b][a], so that you may be strong and go in and possess the land that you are crossing over to possess.
translation:
  language: id
  text: Jadi, taatilah seluruh perintah yang Kuperintahkan kepadamu hari ini[a], supaya kamu menjadi kuat[b], masuk, dan menduduki[c] negeri yang akan kamu masuki untuk mendudukinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seluruh perintah” dalam bentuk tunggal; kata “perintah” di sini dipakai secara kolektif untuk keseluruhan perintah.
    reason: lexical_alternative
  - marker: b
    text: Atau “dikuatkan.” Kata Ibraninya dapat berarti menjadi kuat atau dibuat kuat dalam konteks ini.
    reason: lexical_alternative
  - marker: c
    text: Atau “mewarisi” atau “mengambil alih,” pada kedua pemakaian kata yang diterjemahkan “menduduki.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Jadi, taatilah
  rationale: Dalam konteks hukum perjanjian, שׁמר berarti menaati atau melakukan dengan setia. Kata penghubung diterjemahkan “Jadi” untuk menyatakan kesinambungan sekaligus kesimpulan dari konteks sebelumnya.
- source_word: כָּל הַמִּצְוָה
  choice: seluruh perintah
  rationale: Bentuk tunggal מִצְוָה berfungsi secara kolektif. “Seluruh perintah” mempertahankan bentuk kolektif dan menegaskan ketaatan yang menyeluruh.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: yang kusampaikan kepadamu hari ini
  rationale: Partisip Ibrani menyatakan tindakan Musa yang sedang berlangsung dalam wacana ini. “Kusampaikan” terdengar alami untuk pemberian perintah, sedangkan “kepadamu” membiarkan sapaan korporat Israel tetap tersirat.
- source_word: לְמַעַן
  choice: supaya
  rationale: Menandai maksud atau hasil dan diterjemahkan secara alami dengan “supaya”.
- source_word: תֶּחֶזְקוּ
  choice: kamu menjadi kuat
  rationale: Qal חזק di sini dapat menyatakan menjadi atau berada dalam keadaan kuat untuk tugas yang akan dihadapi, tanpa mempersempitnya hanya menjadi keberanian militer.
- source_word: וּבָאתֶם
  choice: lalu masuk
  rationale: בוא dalam konteks memasuki negeri berarti masuk. “Lalu” menyampaikan kelanjutan tindakan secara alami.
- source_word: וִירִשְׁתֶּם ... לְרִשְׁתָּהּ
  choice: menduduki ... untuk kamu duduki
  rationale: ירשׁ dapat berarti mewarisi, memiliki, atau mengambil alih. Dalam konteks masuk ke negeri, “menduduki” menyampaikan tindakan mengambil dan menguasai negeri serta mempertahankan pengulangan akar kata Ibraninya.
- source_word: הָאָרֶץ
  choice: negeri
  rationale: Dalam Ulangan, הָאָרֶץ menunjuk kepada negeri yang dijanjikan. “Negeri” cocok dengan pengertian geografis dan politis dalam konteks ini.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים שָׁמָּה
  choice: yang sedang kamu seberangi
  rationale: Frasa ini menggambarkan Israel menyeberang menuju negeri itu, dengan Sungai Yordan tersirat dari konteks. Unsur arah שָׁמָּה tidak diterjemahkan tersendiri karena sudah tersampaikan secara alami oleh konstruksi Indonesia.
theological_decisions:
- issue: Pergantian sapaan tunggal dan jamak kepada Israel
  choice: Menggunakan “kamu” tanpa menandai pergantian jumlah secara artifisial
  alternative: Menggunakan bentuk seperti “kalian” pada verba jamak dan “engkau” pada sufiks tunggal
  rationale: Teks Ibrani memadukan sufiks tunggal dalam “kepadamu” dengan verba-verba jamak karena Israel disapa sebagai satu umat sekaligus sebagai para anggotanya. Bahasa Indonesia “kamu” menjaga kelancaran dan tidak menghapus sifat korporat sapaan itu.
- issue: Nuansa ירשׁ dalam penguasaan negeri
  choice: menduduki
  alternative: mewarisi / mengambil alih / memiliki
  rationale: “Menduduki” menjaga dimensi aktif dari masuk dan menguasai negeri. Catatan kaki mempertahankan kemungkinan leksikal lain tanpa menetapkan tafsir teologis tertentu.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Bentuk “kusampaikan” menjaga tuturan langsung Musa tanpa terdengar kaku. Pengulangan “menduduki ... duduki” sengaja dipertahankan untuk mencerminkan pengulangan ירשׁ dalam sumber, meskipun sedikit repetitif.
