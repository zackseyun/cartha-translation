  yaml_path: translation/ot/deuteronomy/011/015.yaml
  text: And I will give grass in your field for your livestock[b][a], and you will eat and be satisfied.
translation:
  language: id
  text: Aku akan memberikan rumput[a] di ladangmu untuk ternakmu, dan engkau akan makan sampai kenyang.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tumbuh-tumbuhan” atau “tanaman hijau”; istilah Ibrani ini dapat menunjuk secara luas pada tumbuhan, tetapi dalam konteks ini kemungkinan besar berarti pakan ternak.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “dan menjadi kenyang”; kata kerja Ibrani ini menyatakan keadaan kenyang atau puas setelah makan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: Aku akan menumbuhkan
  rationale: Secara harfiah berarti “dan Aku akan memberikan.” Dalam hubungan dengan rumput di ladang, bahasa Indonesia secara alami menyatakan pemberian ilahi itu sebagai “menumbuhkan,” tanpa menambahkan gagasan di luar hasil yang dijanjikan.
- source_word: עֵשֶׂב
  choice: rumput
  rationale: Kata ini dapat menunjuk pada tumbuh-tumbuhan secara luas, tetapi frasa “untuk ternakmu” menunjukkan bahwa yang dimaksud di sini ialah tumbuhan pakan; “rumput” paling wajar dalam bahasa Indonesia.
- source_word: בְּשָׂדְךָ
  choice: di ladangmu
  rationale: Mempertahankan gambaran konkret pertanian dan bentuk tunggal dari kata Ibrani שָׂדֶה.
- source_word: לִבְהֶמְתֶּךָ
  choice: untuk ternakmu
  rationale: בְּהֵמָה dipakai secara kolektif bagi hewan piaraan; “ternak” menyampaikan makna tersebut secara ringkas dan alami.
- source_word: וְאָכַלְתָּ
  choice: dan engkau akan makan
  rationale: Mempertahankan sapaan orang kedua tunggal kepada Israel serta urutan janji dalam konteks berkat perjanjian.
- source_word: וְשָׂבָעְתָּ
  choice: sampai kenyang
  rationale: Ungkapan ini secara alami menyampaikan keadaan kenyang atau puas sesudah makan. Alternatif yang lebih harfiah ialah “dan menjadi kenyang.”
theological_decisions:
- issue: Sapaan tunggal representatif kepada Israel
  choice: Mempertahankan bentuk tunggal “ladangmu,” “ternakmu,” dan “engkau”
  alternative: Mengubahnya menjadi bentuk jamak, misalnya “ladang kalian ... kalian akan makan”
  rationale: Teks Ibrani konsisten memakai orang kedua maskulin tunggal dalam sapaan perjanjian kepada Israel. Bentuk tunggal dipertahankan agar daya retoris sumber tidak hilang.
- issue: Hakikat berkat yang dijanjikan
  choice: Menerjemahkannya sebagai penyediaan hasil pertanian oleh Allah tanpa perluasan makna
  alternative: Menafsirkannya secara eksplisit sebagai janji kemakmuran atau kelimpahan umum
  rationale: Ayat ini secara khusus menjanjikan tumbuhan bagi ternak serta makanan yang mengenyangkan; terjemahan tidak memasukkan ajaran kemakmuran yang tidak dinyatakan oleh teks.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. “Engkau” mempertahankan sapaan tunggal perjanjian; enklitik “-mu” menjaga kejelasan bentuk tunggal. Kalimat dibuat alami bagi pembaca umum sambil mempertahankan urutan janji dan latar pertanian.
