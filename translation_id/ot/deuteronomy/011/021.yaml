source:
  edition: WLC
  text: לְמַ֨עַן יִרְבּ֤וּ יְמֵי/כֶם֙ וִ/ימֵ֣י בְנֵי/כֶ֔ם עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתֵי/כֶ֖ם לָ/תֵ֣ת לָ/הֶ֑ם כִּ/ימֵ֥י הַ/שָּׁמַ֖יִם עַל הָ/אָֽרֶץ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/021.yaml
  text: so that your days and the days of your sons may be multiplied on the land that Yahweh swore to your fathers to give them[b][a], as the days of the heavens above the earth.
translation:
  language: id
  text: agar hari-harimu dan hari-hari anak-anak lelakimu[a] bertambah banyak di negeri yang Yahweh telah bersumpah kepada nenek moyangmu untuk memberikannya kepada mereka, seperti hari-hari langit di atas bumi.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anak-anakmu.” Kata Ibrani secara harfiah berarti “putra-putramu” atau “anak-anak lelakimu.”
    reason: lexical_alternative
  - marker: b
    text: Atau, sebagai ungkapan durasi, “selama langit berada di atas bumi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: agar
  rationale: Mengungkapkan tujuan atau hasil dari perintah-perintah sebelumnya secara alami dalam bahasa Indonesia.
- source_word: יִרְבּוּ יְמֵיכֶם וִימֵי בְנֵיכֶם
  choice: kamu dan anak-anak lelakimu panjang umur
  rationale: Idiom Ibrani tentang hari-hari yang menjadi banyak menyatakan lamanya hidup. Ungkapan 'panjang umur' menyampaikan maksud itu secara wajar tanpa mengubah subjek-subjeknya.
- source_word: בְנֵיכֶם
  choice: anak-anak lelakimu
  rationale: Mempertahankan bentuk maskulin jamak 'anak-anak lelaki/putra-putra'; kemungkinan pemakaian yang lebih luas dicatat dalam catatan kaki.
- source_word: עַל הָאֲדָמָה
  choice: di negeri
  rationale: Dalam konteks Ulangan, אֲדָמָה menunjuk pada negeri yang dijanjikan; 'di negeri' lebih alami daripada 'di atas tanah' dalam bahasa Indonesia.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתֵיכֶם
  choice: yang dengan sumpah dijanjikan Yahweh kepada leluhurmu
  rationale: Mempertahankan unsur sumpah perjanjian sekaligus menghasilkan susunan relatif yang alami. 'Leluhur' menyampaikan hubungan antargenerasi tanpa menyiratkan hanya ayah langsung.
- source_word: לָתֵת לָהֶם
  choice: untuk diberikan kepada mereka
  rationale: Mempertahankan penerima jamak yang dinyatakan eksplisit dalam bahasa Ibrani; yang diberikan dipahami dari 'negeri'.
- source_word: כִּימֵי הַשָּׁמַיִם עַל הָאָרֶץ
  choice: selama langit berada di atas bumi
  rationale: Menyampaikan fungsi idiomatis perbandingan itu sebagai jangka waktu yang amat panjang, sambil mempertahankan gambaran langit di atas bumi. Bentuk yang lebih harfiah dicatat dalam catatan kaki.
theological_decisions:
- issue: Nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה; transliterasi 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Cakupan בְנֵיכֶם
  choice: anak-anak lelakimu
  alternative: anak-anakmu
  rationale: Bentuk Ibraninya maskulin jamak. Terjemahan utama mempertahankan hal itu, sedangkan kemungkinan bahwa kata tersebut mencakup semua keturunan disediakan dalam catatan kaki.
- issue: Makna כִּימֵי הַשָּׁמַיִם עַל הָאָרֶץ
  choice: selama langit berada di atas bumi
  alternative: seperti hari-hari langit di atas bumi
  rationale: Frasa tersebut dapat dipahami sebagai ungkapan durasi, tetapi citra dan bentuk perbandingan Ibraninya tetap memiliki nilai puitis; alternatif harfiah dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Idiom 'panjang umur' dipilih untuk kealamian, sedangkan citra kosmis pada akhir ayat dipertahankan. Semua penanda catatan kaki ditempatkan langsung pada bagian teks yang dijelaskan.
