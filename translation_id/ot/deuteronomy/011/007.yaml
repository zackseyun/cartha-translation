source:
  edition: WLC
  text: כִּ֤י עֵֽינֵי/כֶם֙ הָֽ/רֹאֹ֔ת אֶת כָּל מַעֲשֵׂ֥ה יְהוָ֖ה הַ/גָּדֹ֑ל אֲשֶׁ֖ר עָשָֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/007.yaml
  text: For your own eyes have seen all the great work of Yahweh that he did[a].
translation:
  language: id
  text: Sebab mata kalian sendiri telah melihat seluruh perbuatan besar yang dilakukan Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi “mata kalian, yang melihat”—ungkapan tegas yang menunjukkan bahwa mereka adalah saksi mata.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mengantar alasan atau dasar bagi nasihat sebelumnya; “sebab” mempertahankan daya penjelas/kausal dalam alur wacana.
- source_word: עֵינֵיכֶם הָרֹאֹת
  choice: mata kalian sendiri telah melihat
  rationale: Ungkapan Ibrani secara harfiah menonjolkan “mata kalian, yang melihat”; bentuk Indonesia ini alami sekaligus mempertahankan tekanan bahwa para pendengar merupakan saksi mata.
- source_word: אֶת כָּל מַעֲשֵׂה
  choice: seluruh perbuatan
  rationale: Kata tunggal kolektif מַעֲשֵׂה dengan כָּל menunjuk pada keseluruhan karya atau tindakan; “seluruh perbuatan” menyampaikan cakupan totalnya secara wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap dipertahankan.
- source_word: הַגָּדֹל
  choice: besar
  rationale: Padanan langsung yang menerangkan besarnya perbuatan Yahweh tanpa menambahkan penafsiran tentang kuasa.
- source_word: אֲשֶׁר עָשָׂה
  choice: yang dilakukan
  rationale: Klausa relatif ini diterjemahkan secara alami dalam bahasa Indonesia; bentuk pasif menghindari pengulangan subjek tanpa mengubah pelaku yang jelas, yaitu Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Identitas para pendengar sebagai saksi mata
  choice: mata kalian sendiri telah melihat
  alternative: kalian telah melihat
  rationale: Penyebutan eksplisit “mata” dan konstruksi partisipial Ibrani bersifat menegaskan; terjemahan pilihan mempertahankan penekanan ini tanpa membuat susunan Indonesia menjadi kaku.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kalian” dipilih untuk menandai orang kedua jamak secara jelas, sedangkan susunan “mata kalian sendiri telah melihat” mempertahankan penekanan Ibrani dengan ungkapan yang tetap alami.
