  verdict: revise
  source_fidelity: 'Terjemahan mempertahankan unsur-unsur utama teks Ibrani: perkataan ilahi, hati dan jiwa, pengikatan sebagai tanda pada tangan, serta penempatan di antara mata. Sapaan jamak juga terpelihara. Namun, frasa "lambang dahi di antara mata kalian" mencampurkan penafsiran lokasi "dahi" dengan frasa harfiah "di antara mata", sehingga kurang setia pada keterbukaan istilah dan konstruksi sumber.'
  naturalness: Sebagian besar bahasanya baku dan jelas. "Lambang dahi di antara mata kalian" tidak alami dalam bahasa Indonesia karena "dahi" dan "di antara mata" saling bertumpuk. "Lambang di antara mata kalian" lebih lancar sambil membiarkan lokasi Ibrani tetap eksplisit.
  terminology: '"Perkataan-Ku", "hati dan jiwa", "tanda", dan "ikatlah" tepat serta bernada layak. Istilah langka טוֹטָפֹת sebaiknya tetap diterjemahkan secara umum sebagai "lambang" dan dijelaskan dalam catatan kaki, tanpa memasukkan "dahi" ke dalam terjemahan istilah itu sendiri.'
