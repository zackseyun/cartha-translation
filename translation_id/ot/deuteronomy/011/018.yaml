source:
  edition: WLC
  text: וְ/שַׂמְתֶּם֙ אֶת דְּבָרַ֣/י אֵ֔לֶּה עַל לְבַבְ/כֶ֖ם וְ/עַֽל נַפְשְׁ/כֶ֑ם וּ/קְשַׁרְתֶּ֨ם אֹתָ֤/ם לְ/אוֹת֙ עַל יֶדְ/כֶ֔ם וְ/הָי֥וּ לְ/טוֹטָפֹ֖ת בֵּ֥ין עֵינֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/018.yaml
  text: So you shall place these words of mine on your heart and on your soul[a], and you shall bind them as a sign on your hand, and they shall be as frontlets between your eyes.
translation:
  language: id
  text: Karena itu, taruhlah perkataan-Ku ini dalam hati dan jiwa kalian. Ikatlah semuanya sebagai tanda pada tangan kalian, dan hendaklah semuanya itu menjadi lambang di antara mata kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani yang diterjemahkan “lambang” ini jarang dipakai dan makna tepatnya tidak pasti. Istilah itu mungkin menunjuk pada ikat atau hiasan yang dikenakan di bagian depan kepala. Dalam praktik Yahudi kemudian, istilah ini dikaitkan dengan tefilin, yaitu wadah-wadah kecil berisi kutipan Kitab Suci yang dikenakan pada kepala dan lengan.
    reason: Menjelaskan istilah Ibrani yang langka, mempertahankan ketidakpastian maknanya, dan menyebut kaitannya dengan praktik Yahudi kemudian tanpa mengidentifikasikannya secara pasti dalam teks utama.
lexical_decisions:
- source_word: וְשַׂמְתֶּם
  choice: Karena itu, taruhlah
  rationale: Kata kerja שׂים berarti menaruh atau menempatkan. Bentuk perintah dipakai agar daya instruksinya jelas, sedangkan וְ diterjemahkan “Karena itu” untuk menunjukkan kesinambungan dengan konteks sebelumnya.
- source_word: דְּבָרַי אֵלֶּה
  choice: perkataan-Ku ini
  rationale: Ungkapan ini mempertahankan penunjukan “ini” dan akhiran milik orang pertama pada דְּבָרַי tanpa mempersempit דָּבָר menjadi istilah teknis tertentu.
- source_word: עַל לְבַבְכֶם וְעַל נַפְשְׁכֶם
  choice: dalam hati dan jiwa kalian
  rationale: “Dalam” merupakan ungkapan Indonesia yang alami untuk sesuatu yang disimpan dalam batin, sementara “hati dan jiwa” mempertahankan pasangan antropologis Ibrani dan “kalian” menandai sapaan jamak.
- source_word: וּקְשַׁרְתֶּם אֹתָם
  choice: Ikatlah semuanya
  rationale: “Ikatlah” mempertahankan gambaran konkret dari קשׁר. “Semuanya” merujuk kembali kepada seluruh perkataan tersebut dan menghindari ambiguitas pronomina Indonesia.
- source_word: לְאוֹת עַל יֶדְכֶם
  choice: sebagai tanda pada tangan kalian
  rationale: “Tanda” mencakup arti simbol, markah, atau token dari אוֹת; “tangan” mempertahankan arti lazim יָד tanpa memperluasnya menjadi lengan.
- source_word: לְטוֹטָפֹת
  choice: menjadi lambang dahi
  rationale: טוֹטָפֹת adalah istilah langka bagi sesuatu yang dikenakan di bagian depan kepala. “Lambang dahi” memberi pembaca gambaran dasar tanpa menyamakannya secara pasti dengan bentuk ritual Yahudi pada masa kemudian; ketidakpastian leksikal dijelaskan dalam catatan kaki.
- source_word: בֵּין עֵינֵיכֶם
  choice: di antara mata kalian
  rationale: Terjemahan ini mempertahankan ungkapan konkret Ibrani, bukan menggantinya dengan penafsiran “pada dahi”.
theological_decisions:
- issue: Apakah pengikatan pada tangan dan penempatan di antara mata harus dipahami secara harfiah, kiasan, atau keduanya
  choice: Mempertahankan gambaran fisik secara konkret tanpa memutuskan cara penerapannya
  alternative: Menafsirkannya hanya sebagai perintah kiasan untuk selalu mengingat dan melakukan firman, atau hanya sebagai ketentuan ritual harfiah
  rationale: Ayat memakai bahasa konkret, tetapi tidak dengan sendirinya menyelesaikan hubungan antara makna simbolis dan pelaksanaan fisik. Terjemahan karena itu membiarkan ketegangan tersebut tetap terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan sapaan jamak “kalian” agar jumlah gramatikal sumber terlihat. Bentuk imperatif membuat rangkaian perintah terasa alami. Ungkapan konkret mengenai tangan dan bagian di antara mata dipertahankan, sedangkan istilah yang langka dijelaskan melalui catatan kaki.
