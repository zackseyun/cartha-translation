  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/לְמַ֨עַן תַּאֲרִ֤יכוּ יָמִים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁר֩ נִשְׁבַּ֨ע יְהוָ֧ה לַ/אֲבֹתֵי/כֶ֛ם לָ/תֵ֥ת לָ/הֶ֖ם וּ/לְ/זַרְעָ֑/ם אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/009.yaml
  text: so that you may live long on the land that Yahweh swore to your fathers to give to them and to their offspring[b][a], a land flowing with milk and honey.
translation:
  language: id
  text: supaya kamu panjang umur di negeri yang telah Yahweh janjikan dengan sumpah kepada nenek moyangmu untuk diberikan kepada mereka dan keturunan mereka,[a] yaitu negeri yang berlimpah susu dan madu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “benih mereka.” Kata Ibrani ini dapat menunjuk secara kolektif kepada keturunan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְמַעַן
  choice: supaya
  rationale: Menyatakan tujuan atau hasil dan menghubungkan ayat ini dengan konteks sebelumnya secara alami.
- source_word: תַּאֲרִיכוּ יָמִים
  choice: kamu panjang umur
  rationale: Ungkapan Ibrani harfiah berarti 'memanjangkan hari-hari'; 'panjang umur' menyampaikan idiom tentang umur yang lama dalam bahasa Indonesia yang wajar.
- source_word: עַל הָאֲדָמָה
  choice: di tanah
  rationale: Dalam konteks Ulangan, אֲדָמָה menunjuk pada wilayah pemberian yang didiami, bukan sekadar tanah sebagai materi; 'di' lebih alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה
  choice: yang Yahweh sumpahkan
  rationale: Mempertahankan bentuk klausa relatif dan unsur sumpah perjanjian tanpa melemahkannya menjadi sekadar janji.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang secara langsung terdapat dalam teks sumber.
- source_word: לַאֲבֹתֵיכֶם
  choice: kepada nenek moyangmu
  rationale: Dalam konteks ini אָבוֹת menunjuk kepada para leluhur Israel. 'Nenek moyang' merupakan padanan Indonesia yang alami dan tidak membatasi rujukannya hanya kepada ayah biologis.
- source_word: לָתֵת לָהֶם וּלְזַרְעָם
  choice: untuk diberikan kepada mereka dan keturunan mereka
  rationale: זֶרַע adalah nomina kolektif yang dapat berarti benih atau keturunan; 'keturunan' alami dan mempertahankan cakupan kolektifnya.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: yaitu negeri yang berlimpah susu dan madu
  rationale: '''Yaitu negeri'' memperjelas aposisi dari אֶרֶץ, sedangkan ''berlimpah susu dan madu'' menyampaikan metafora kesuburan dan kelimpahan secara wajar tanpa membayangkan cairan mengalir secara harfiah.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian itu alih-alih menggantinya dengan gelar.
- issue: Penerima tanah dalam frasa לָהֶם וּלְזַרְעָם
  choice: kepada mereka dan keturunan mereka
  alternative: kepada mereka, yakni keturunan mereka
  rationale: Konjungsi וּ secara gramatikal membedakan para nenek moyang dan keturunan mereka. Terjemahan tidak menyamakan keduanya dan dengan demikian mempertahankan ketegangan bahwa sumpah itu mencakup para leluhur serta garis keturunan mereka.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Pronomina jamak Ibrani diterjemahkan dengan 'kamu' karena bentuk ini alami dan tidak secara keliru menandai tunggal; konteks menunjukkan bahwa seluruh umat disapa. Istilah 'tanah' dipakai untuk wilayah yang didiami, lalu aposisinya divariasikan menjadi 'negeri' agar alami. Penanda catatan kaki [a] ditempatkan tepat setelah frasa yang diterangkannya.
