base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/017.yaml
  text: Then Yahweh’s anger will burn against you[a], and he will shut up the heavens so that there will be no rain, and the ground will not yield its produce; and you will perish quickly from the good land that Yahweh is giving you.
translation:
  language: id
  text: Maka murka Yahweh akan menyala terhadap kalian,[a] dan Dia akan menutup langit sehingga tidak akan ada hujan. Tanah tidak akan memberikan hasilnya, dan kalian akan segera lenyap dari negeri yang baik yang Yahweh berikan kepada kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “hidung/murka Yahweh akan menyala terhadap kalian,” sebuah ungkapan Ibrani untuk murka yang hebat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָרָה אַף יְהוָה בָכֶם
  choice: Maka murka Yahweh akan menyala terhadap kalian
  rationale: Ungkapan חרה אף secara harfiah menggambarkan murka yang menyala. Terjemahan ini mempertahankan metafora Ibrani dengan bahasa Indonesia yang tetap jelas; “maka” menyatakan akibat dari peringatan pada konteks sebelumnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, untuk mempertahankan nama perjanjian dalam teks Ibrani.
- source_word: וְעָצַר אֶת הַשָּׁמַיִם
  choice: dan Dia akan menutup langit
  rationale: עצר dalam konteks ini berarti menahan hujan dengan gambaran menutup langit. “Langit” lebih wajar daripada bentuk jamak dalam bahasa Indonesia.
- source_word: וְלֹא יִהְיֶה מָטָר
  choice: sehingga tidak akan ada hujan
  rationale: 'Kata “sehingga” menyatakan hubungan hasil yang tersirat: penutupan langit mengakibatkan tidak adanya hujan.'
- source_word: וְהָאֲדָמָה
  choice: Tanah
  rationale: אדמה menunjuk pada tanah yang menghasilkan tanaman dan dibedakan dari הארץ, “negeri”, pada bagian akhir ayat.
- source_word: לֹא תִתֵּן אֶת יְבוּלָהּ
  choice: tidak akan memberikan hasilnya
  rationale: Terjemahan ini mempertahankan citra harfiah נתן, “memberikan”, serta arti יבול sebagai hasil tanah.
- source_word: וַאֲבַדְתֶּם מְהֵרָה
  choice: kalian akan segera binasa
  rationale: אבד menyampaikan kebinasaan atau lenyapnya umat dari negeri tanpa menentukan mekanismenya; “segera” menerjemahkan unsur kecepatan pada מְהֵרָה secara alami.
- source_word: מֵעַל הָאָרֶץ הַטֹּבָה
  choice: dari negeri yang baik
  rationale: מעל menyatakan tersingkirnya mereka dari negeri itu. Dalam bahasa Indonesia, “binasa dari negeri” mempertahankan hubungan dengan tempat tanpa bentuk kaku seperti “dari atas negeri”.
- source_word: אֲשֶׁר יְהוָה נֹתֵן לָכֶם
  choice: yang Yahweh berikan kepada kalian
  rationale: Partisip נֹתֵן dapat menyatakan tindakan kini atau yang sedang berlangsung. Bentuk Indonesia tanpa penanda waktu khusus tetap alami dan mempertahankan keluasan aspek sumber.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama ilahi secara langsung. “Yahweh” mempertahankannya sebagai nama pribadi tanpa menggantinya dengan gelar.
- issue: Ungkapan antropomorfis tentang murka
  choice: murka Yahweh akan menyala terhadap kalian
  alternative: Yahweh akan murka kepada kalian
  rationale: Pilihan utama mempertahankan metafora sumber bahwa murka “menyala”, tetapi tidak memperluasnya menjadi pernyataan teologis tentang sifat emosi ilahi.
- issue: Makna kebinasaan dari negeri
  choice: kalian akan segera binasa dari negeri yang baik
  alternative: kalian akan segera disingkirkan dari negeri yang baik
  rationale: אבד menyatakan kebinasaan dan dalam konteks ini juga berkaitan dengan hilangnya umat dari negeri. “Binasa” mempertahankan kedahsyatan dan ambiguitas verba tanpa membatasinya hanya pada pembuangan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. “Kalian” dipakai karena bentuk Ibrani adalah orang kedua jamak. Huruf kapital pada “Dia” dipakai sebagai konvensi penghormatan dalam teks Indonesia, tanpa mengubah makna sumber.
