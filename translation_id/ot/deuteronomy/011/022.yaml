  text: כִּי֩ אִם שָׁמֹ֨ר תִּשְׁמְר֜וּ/ן אֶת כָּל הַ/מִּצְוָ֣ה הַ/זֹּ֗את אֲשֶׁ֧ר אָנֹכִ֛י מְצַוֶּ֥ה אֶתְ/כֶ֖ם לַ/עֲשֹׂתָ֑/הּ לְ/אַהֲבָ֞ה אֶת יְהוָ֧ה אֱלֹהֵי/כֶ֛ם לָ/לֶ֥כֶת בְּ/כָל דְּרָכָ֖י/ו וּ/לְ/דָבְקָה בֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/011/022.yaml
  text: For if you carefully keep all this commandment that I am commanding you to do—to love Yahweh your God[a], to walk in all his ways[c][b], and to cling to him—
translation:
  language: id
  text: Sebab, jika kalian sungguh-sungguh menaati[a] seluruh perintah ini[b] yang kuperintahkan kepada kalian untuk dilakukan—mengasihi Yahweh, Allah kalian, mengikuti segala jalan-Nya, dan berpaut kepada-Nya[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, bentuk Ibraninya mengulang kata kerja untuk memberi penekanan: “menaati, benar-benar menaati”.'
    reason: Menjelaskan penegasan melalui infinitif absolut.
  - marker: b
    text: Bahasa Ibrani memakai bentuk tunggal, “seluruh perintah ini”, yang kemungkinan merujuk secara kolektif pada keseluruhan tuntutan perjanjian.
    reason: Menjelaskan bentuk tunggal kolektif yang dapat terdengar tidak biasa.
  - marker: c
    text: Atau “berpegang teguh kepada-Nya”.
    reason: Memberikan padanan lain bagi דבק yang mencakup keterikatan erat dan keteguhan.
lexical_decisions:
- source_word: כִּי אִם
  choice: Sebab, jika
  rationale: Mempertahankan hubungan dengan ayat sebelumnya sekaligus memperkenalkan syarat yang ditekankan.
- source_word: שָׁמֹר תִּשְׁמְרוּן
  choice: sungguh-sungguh menaati
  rationale: Konstruksi infinitif absolut dengan verba finit menguatkan tindakan. Ungkapan ini menyampaikan penekanan dan ketaatan yang cermat secara wajar dalam bahasa Indonesia.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: seluruh perintah ini
  rationale: Mempertahankan bentuk tunggal kolektif yang memandang tuntutan perjanjian sebagai satu kesatuan.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם לַעֲשֹׂתָהּ
  choice: yang kuperintahkan kepada kalian untuk dilakukan
  rationale: Mencerminkan tindakan Musa yang sedang menyampaikan perintah dan tetap mempertahankan gagasan konkret untuk melakukannya tanpa pengulangan pronomina yang janggal.
- source_word: לְאַהֲבָה אֶת יְהוָה אֱלֹהֵיכֶם
  choice: mengasihi Yahweh, Allah kalian
  rationale: Rangkaian infinitif dipertahankan sebagai isi nyata dari ketaatan, dan nama ilahi ditransliterasikan sebagai Yahweh.
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: menempuh segala jalan-Nya
  rationale: Mempertahankan citra perjalanan atau jalan sebagai metafora perilaku, tetapi dengan ungkapan Indonesia yang lebih alami daripada terjemahan harfiah 'berjalan dalam segala jalan-Nya'.
- source_word: וּלְדָבְקָה בוֹ
  choice: dan berpaut kepada-Nya
  rationale: Mengungkapkan keterikatan erat dan kesetiaan relasional tanpa mereduksinya menjadi penjelasan doktrinal tertentu.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian ilahi secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama pribadi dan bukan menggantinya dengan gelar.
- issue: Bahasa metaforis tentang jalan dan keterikatan perjanjian
  choice: Mempertahankan metafora melalui 'menempuh segala jalan-Nya' dan 'berpaut kepada-Nya'
  alternative: Menafsirkannya sebagai 'hidup sesuai kehendak-Nya' dan 'tetap setia kepada-Nya'
  rationale: Metafora Ibrani mengandung keluasan makna etis dan relasional. Mempertahankannya menghindari pembatasan pada satu tafsiran teologis.
- issue: Hubungan infinitif 'mengasihi, menempuh, berpaut' dengan perintah
  choice: Menyajikannya setelah tanda pisah sebagai uraian isi pelaksanaan perintah
  alternative: Menerjemahkannya secara eksplisit sebagai tujuan, misalnya 'supaya kalian mengasihi'
  rationale: Bentuk Ibrani dapat menyatakan tujuan maupun isi pelaksanaan. Susunan dengan tanda pisah mempertahankan keluwesan hubungan itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Bentuk 'kalian' dipakai untuk memperjelas bahwa semua pronomina orang kedua dalam bahasa Ibrani berbentuk jamak. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kebiasaan tulisan keagamaan Indonesia.
