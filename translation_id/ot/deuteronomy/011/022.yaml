  source_fidelity: 'Teks ini secara umum setia pada struktur dan makna Ibrani: konstruksi penegasan pada שָׁמֹר תִּשְׁמְרוּן, bentuk tunggal-kolektif הַמִּצְוָה, nama Yahweh, serta rangkaian infinitif dipertahankan. Namun, “menempuh segala jalan-Nya” dalam bahasa Indonesia terutama berarti melintasi rute atau jalan secara fisik dan kurang menyampaikan idiom Ibrani tentang mengikuti cara hidup atau jalan Allah.'
