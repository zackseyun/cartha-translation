  text: But you who hold fast to Yahweh your God are all alive today[a].
translation:
  language: id
  text: Tetapi kamu yang berpaut[a] kepada Yahweh, Allahmu, semuanya masih hidup pada hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melekat erat”; ungkapan ini menyatakan keterikatan yang dekat dan kesetiaan perjanjian kepada Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַתֶּם
  choice: Tetapi kamu
  rationale: Konjungsi dan pronomina mandiri menandai pertentangan dengan orang-orang yang binasa dalam ayat sebelumnya; “Tetapi kamu” menyampaikan daya adversatif itu secara alami.
- source_word: הַ/דְּבֵקִים
  choice: yang berpaut
  rationale: Partisipel dari דבק menggambarkan keterikatan erat dan berkelanjutan. “Berpaut” mempertahankan gambaran kedekatan sekaligus dapat menyatakan kesetiaan kepada Allah tanpa mempersempit maknanya.
- source_word: בַּ/יהוָה
  choice: kepada Yahweh
  rationale: Preposisi menyatakan arah keterikatan, sedangkan nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”.
- source_word: אֱלֹהֵי/כֶם
  choice: Allahmu
  rationale: Bentuk konstruksi dengan sufiks orang kedua jamak mengidentifikasi Yahweh sebagai Allah umat yang disapa. Bahasa Indonesia memakai bentuk “-mu” yang sama untuk tunggal dan jamak.
- source_word: חַיִּים
  choice: masih hidup
  rationale: Adjektiva predikatif menyatakan keadaan mereka pada waktu itu. “Masih hidup” secara alami menyampaikan keberlangsungan hidup mereka dalam pertentangan dengan orang-orang yang telah binasa.
- source_word: כֻּלְּ/כֶם
  choice: kamu semua
  rationale: Menjaga penekanan bahwa seluruh kelompok yang disapa termasuk di dalam pernyataan tersebut.
- source_word: הַ/יּוֹם
  choice: sampai hari ini
  rationale: “Hari ini” adalah nilai dasar frasa tersebut; “sampai” membuat hubungan temporal dengan “masih hidup” wajar dalam bahasa Indonesia dan menyampaikan keadaan yang berlangsung hingga saat ujaran.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Makna keterikatan dalam דבק
  choice: berpaut
  alternative: melekat erat; tetap setia
  rationale: “Berpaut” menjaga metafora keterikatan dan membuka cakupan relasional serta kesetiaan perjanjian, sedangkan “tetap setia” saja akan menafsirkan metafora secara lebih sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan “kamu semua” dipakai agar cakupan כֻּלְּכֶם jelas, sedangkan “berpaut” mempertahankan citra konkret bahasa Ibrani tanpa terdengar terlalu teknis.
