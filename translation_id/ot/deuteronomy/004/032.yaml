source:
  edition: WLC
  text: כִּ֣י שְׁאַל נָא֩ לְ/יָמִ֨ים רִֽאשֹׁנִ֜ים אֲשֶׁר הָי֣וּ לְ/פָנֶ֗י/ךָ לְ/מִן הַ/יּוֹם֙ אֲשֶׁר֩ בָּרָ֨א אֱלֹהִ֤ים אָדָם֙ עַל הָ/אָ֔רֶץ וּ/לְ/מִ/קְצֵ֥ה הַ/שָּׁמַ֖יִם וְ/עַד קְצֵ֣ה הַ/שָּׁמָ֑יִם הֲ/נִֽהְיָ֗ה כַּ/דָּבָ֤ר הַ/גָּדוֹל֙ הַ/זֶּ֔ה א֖וֹ הֲ/נִשְׁמַ֥ע כָּמֹֽ/הוּ־־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/032.yaml
  text: 'For ask now about the former days that were before you[a], from the day when God created man on the earth, and from one end of the heavens to the other end of the heavens: has anything happened like this great thing, or has anything been heard like it?'
translation:
  language: id
  text: 'Sebab, tanyakanlah sekarang tentang zaman dahulu yang telah ada sebelum engkau, sejak hari Allah menciptakan manusia[a] di bumi, dan dari ujung langit yang satu sampai ujung langit yang lain: pernahkah terjadi perkara besar seperti ini, atau pernahkah terdengar sesuatu yang semacam itu?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: ’adam; dalam konteks ini dapat merujuk kepada manusia atau umat manusia. Dalam konteks lain, kata ini juga dipakai sebagai nama “Adam”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאַל נָא
  choice: tanyakanlah sekarang
  rationale: Bentuk imperatif dengan partikel נָא menyampaikan desakan atau ajakan yang sungguh-sungguh. Ungkapan ini mempertahankan daya seruan teks dan tetap wajar dalam bahasa Indonesia.
- source_word: לְיָמִים רִאשֹׁנִים
  choice: tentang zaman dahulu
  rationale: Frasa ini menunjuk pada masa lampau yang sangat awal. “Zaman dahulu” alami, mudah dipahami, dan mempertahankan bobot historisnya.
- source_word: אֲשֶׁר הָיוּ לְפָנֶיךָ
  choice: yang ada sebelum engkau
  rationale: Terjemahan ini mempertahankan makna temporal, yaitu zaman yang mendahului orang atau generasi yang disapa. Bentuk tunggal “engkau” mengikuti teks Ibrani.
- source_word: לְמִן הַיּוֹם אֲשֶׁר בָּרָא
  choice: sejak hari ... menciptakan
  rationale: Menandai titik awal rentang sejarah yang harus diselidiki. “Sejak hari” lebih alami daripada susunan harfiah “dari hari” dalam konteks ini.
- source_word: אֱלֹהִים
  choice: Allah
  rationale: Padanan baku bahasa Indonesia untuk אֱלֹהִים ketika menunjuk kepada Sang Pencipta yang esa.
- source_word: אָדָם
  choice: manusia
  rationale: Dalam konteks penciptaan, אָדָם dapat menunjuk manusia secara representatif atau umat manusia, sekaligus tetap membuka kemungkinan kaitan dengan Adam sebagai pribadi. “Manusia” paling alami dalam bahasa Indonesia dan tidak memaksakan salah satu nuansa.
- source_word: עַל הָאָרֶץ
  choice: di bumi
  rationale: Padanan lokatif yang ringkas dan alami; “bumi” sesuai dengan konteks penciptaan dan cakupan kosmis ayat.
- source_word: וּלְמִקְצֵה הַשָּׁמַיִם וְעַד קְצֵה הַשָּׁמָיִם
  choice: dan dari ujung langit yang satu sampai ujung langit yang lain
  rationale: Ungkapan merism ini menyatakan jangkauan seluas-luasnya. Susunan tersebut mempertahankan pengulangan “ujung langit” sambil tetap jelas dalam bahasa Indonesia.
- source_word: הֲנִהְיָה כַּדָּבָר הַגָּדוֹל הַזֶּה
  choice: pernahkah terjadi perkara besar seperti ini
  rationale: Kata דָּבָר di sini menunjuk perkara atau peristiwa, bukan hanya perkataan. “Pernahkah” menangkap daya pertanyaan retoris mengenai seluruh sejarah sebelumnya.
- source_word: הֲנִשְׁמַע כָּמֹהוּ
  choice: atau pernahkah terdengar sesuatu yang semacam itu?
  rationale: Bentuk pasif שׁמע berarti sesuatu pernah didengar atau diberitakan. Penambahan “sesuatu” diperlukan agar kalimat Indonesia alami tanpa mempersempit maksud teks.
theological_decisions:
- issue: Makna אָדָם dalam konteks penciptaan
  choice: manusia
  alternative: Adam; umat manusia
  rationale: Bentuk Ibrani tunggal dapat berfungsi secara representatif bagi manusia, tetapi juga berhubungan dengan nama Adam. Teks utama memakai istilah Indonesia yang paling alami dan cukup luas, sedangkan catatan kaki mempertahankan kemungkinan leksikalnya tanpa menetapkan penafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “engkau” mempertahankan sapaan tunggal teks Ibrani dan cocok dengan register pidato perjanjian. Struktur kalimat yang panjang dipertahankan karena seluruh ayat merupakan satu seruan retoris, tetapi tanda titik dua membantu memperjelas peralihan menuju pertanyaan puncak.
