language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּגֵּ֨ד לָ/כֶ֜ם אֶת בְּרִית֗/וֹ אֲשֶׁ֨ר צִוָּ֤ה אֶתְ/כֶם֙ לַ/עֲשׂ֔וֹת עֲשֶׂ֖רֶת הַ/דְּבָרִ֑ים וַֽ/יִּכְתְּבֵ֔/ם עַל שְׁנֵ֖י לֻח֥וֹת אֲבָנִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/013.yaml
  text: And he declared to you his covenant[a], which he commanded you to do, the Ten Words; and he wrote them on two tablets of stone.
translation:
  language: id
  text: Ia menyatakan kepada kamu perjanjian-Nya yang diperintahkan-Nya untuk kamu lakukan, yaitu Kesepuluh Firman[a], lalu Ia menuliskannya pada dua loh batu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah dari bahasa Ibrani: “sepuluh firman”; secara tradisional: “Sepuluh Perintah Allah.”'
    reason: Menjelaskan bentuk harfiah ungkapan Ibrani dan mencantumkan sebutan tradisional yang umum dikenal.
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: menyatakan
  rationale: Bentuk Hifil dari נגד berarti membuat sesuatu diketahui atau menyatakannya. “Menyatakan” mempertahankan nada resmi dalam konteks perjanjian dan tetap wajar dalam bahasa Indonesia.
- source_word: בְּרִיתוֹ
  choice: perjanjian-Nya
  rationale: בְּרִית menunjuk pada ikatan yang resmi dan mengikat. “Perjanjian” merupakan padanan Indonesia yang paling luas dipahami tanpa membatasinya pada perjanjian politik semata.
- source_word: אֲשֶׁר צִוָּה אֶתְכֶם לַעֲשׂוֹת
  choice: yang diperintahkan-Nya untuk kamu lakukan
  rationale: Terjemahan ini mengikuti secara langsung unsur “memerintahkan” dan infinitif לַעֲשׂוֹת, “melakukan,” tanpa mengubahnya menjadi “menaati” atau “memelihara.”
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: Kesepuluh Firman
  rationale: Secara harfiah frasa ini berarti “sepuluh firman/perkataan.” “Kesepuluh Firman” mempertahankan sebutan yang dipakai teks sekaligus membentuk ungkapan yang wajar sebagai nama bagi keseluruhan firman tersebut.
- source_word: וַיִּכְתְּבֵם
  choice: lalu Ia menuliskannya
  rationale: כתב adalah verba umum “menulis.” Partikel “lalu” menyampaikan kesinambungan narasi secara alami; akhiran “-nya” merujuk pada Kesepuluh Firman.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: dua loh batu
  rationale: Frasa konstruksi ini berarti dua loh yang terbuat dari batu. “Loh batu” adalah ungkapan Indonesia yang ringkas, alami, dan tepat.
theological_decisions:
- issue: Penerjemahan עֲשֶׂרֶת הַדְּבָרִים
  choice: Kesepuluh Firman
  alternative: Sepuluh Perintah atau Sepuluh Perintah Allah
  rationale: Teks Ibrani sendiri menyebutnya “sepuluh firman/perkataan,” bukan memakai kata khusus untuk “perintah.” Terjemahan utama mempertahankan penamaan sumber, sedangkan sebutan tradisional yang dikenal pembaca dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “kamu” mempertahankan sapaan jamak kolektif kepada Israel; bahasa Indonesia tidak menandai jumlah pada pronomina ini. Pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan ejaan religius Indonesia. “Yaitu” memperjelas hubungan aposisional antara perjanjian itu dan Kesepuluh Firman tanpa menghapus ketegangan sintaksis sumber.
