language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בְּ/עֵ֨בֶר הַ/יַּרְדֵּ֜ן בַּ/גַּ֗יְא מ֚וּל בֵּ֣ית פְּע֔וֹר בְּ/אֶ֗רֶץ סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּ֑וֹן אֲשֶׁ֨ר הִכָּ֤ה מֹשֶׁה֙ וּ/בְנֵֽי יִשְׂרָאֵ֔ל בְּ/צֵאתָ֖/ם מִ/מִּצְרָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/046.yaml
  text: beyond the Jordan[a], in the valley opposite Beth-peor, in the land of Sihon king of the Amorites, who lived in Heshbon, whom Moses and the sons of Israel struck down when they came out from Egypt.
translation:
  language: id
  text: di seberang Sungai Yordan, di lembah yang berhadapan dengan Bet-Peor, di negeri Sihon, raja orang Amori, yang tinggal di Hesbon, yang dikalahkan Musa dan bani Israel[a] ketika mereka keluar dari Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Israel.” Secara harfiah, bahasa Ibrani berbunyi “anak-anak lelaki Israel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: di seberang Sungai Yordan
  rationale: Ungkapan ini menunjukkan wilayah di seberang batas geografis; penyebutan “Sungai Yordan” alami dan jelas dalam bahasa Indonesia.
- source_word: בַּגַּיְא
  choice: di lembah
  rationale: גַּיְא dapat berarti lembah atau jurang; “lembah” sesuai dengan gambaran topografis dan lebih alami dalam konteks ini.
- source_word: מוּל
  choice: yang berhadapan dengan
  rationale: מוּל menyatakan posisi spasial di hadapan atau berseberangan dengan suatu tempat.
- source_word: בֵּית פְּעוֹר
  choice: Bet-Peor
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia.
- source_word: בְּאֶרֶץ סִיחֹן
  choice: di negeri Sihon
  rationale: אֶרֶץ di sini menunjuk wilayah kekuasaan Sihon; “negeri” mempertahankan bentuk geografis-politis tanpa mempersempitnya menjadi sekadar daerah administratif.
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: raja orang Amori
  rationale: Rangkaian konstruksi ini mengidentifikasi Sihon sebagai raja bangsa Amori.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: yang tinggal di Hesbon
  rationale: Partisipel יוֹשֵׁב menyatakan tempat kediaman; “tinggal” merupakan padanan modern yang alami.
- source_word: אֲשֶׁר הִכָּה
  choice: yang dikalahkan
  rationale: Dalam konteks peperangan, נכה dapat menyatakan pemukulan yang menghasilkan kekalahan. Bentuk pasif Indonesia membuat acuan kepada Sihon jelas dan alami.
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: dan bani Israel
  rationale: “Bani Israel” mempertahankan unsur keturunan dalam בְּנֵי sekaligus berfungsi sebagai sebutan kolektif yang dikenal dalam bahasa Indonesia.
- source_word: בְּצֵאתָם מִמִּצְרָיִם
  choice: ketika mereka keluar dari Mesir
  rationale: Infinitif dengan בְּ menyatakan keadaan waktu; terjemahan ini alami dan mempertahankan rujukan kepada peristiwa keluaran.
theological_decisions:
- issue: Sebutan kolektif yang berunsur gender dalam וּבְנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: orang Israel
  rationale: Teks Ibrani secara harfiah memakai “anak-anak lelaki/keturunan Israel,” tetapi ungkapan itu juga merupakan etnonim kolektif. “Bani Israel” menjaga bentuk keturunan dan nuansa perjanjian, sedangkan alternatif idiomatis dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ayat dipertahankan sebagai lanjutan sintaksis dari konteks sebelumnya. Nama tempat memakai bentuk Bet-Peor dan Hesbon yang lazim dalam tradisi Alkitab Indonesia.
