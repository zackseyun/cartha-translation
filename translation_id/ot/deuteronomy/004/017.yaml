lexical_decisions:
- source_word: תַּבְנִית
  choice: rupa
  rationale: Dalam konteks larangan membuat patung untuk ibadah, kata ini menunjuk pada bentuk atau representasi yang tampak. “Rupa” alami dalam bahasa Indonesia dan mempertahankan pengulangan sumber.
- source_word: כָּל
  choice: segala
  rationale: Dengan nomina tunggal yang menyatakan suatu golongan, “segala” menyampaikan cakupan menyeluruh dan sesuai dengan gaya daftar larangan ini.
- source_word: בְּהֵמָה
  choice: binatang
  rationale: Di sini istilah tersebut mencakup binatang darat secara umum, bukan hanya ternak; “binatang” jelas dan lazim.
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: yang ada di bumi
  rationale: Terjemahan ini mempertahankan pembagian makhluk menurut ranahnya dan kontras dengan burung di langit serta makhluk air pada konteks berikutnya.
- source_word: צִפּוֹר כָּנָף
  choice: burung bersayap
  rationale: Frasa ini menerjemahkan kedua unsur secara jelas dan wajar, sekalipun sifat bersayap sudah melekat pada burung.
- source_word: תָּעוּף
  choice: yang terbang
  rationale: Klausa relatif ini menggambarkan ciri umum golongan burung dan terdengar alami dalam bahasa Indonesia.
- source_word: בַּשָּׁמַיִם
  choice: di langit
  rationale: Walaupun bentuk Ibraninya jamak, dalam konteks penerbangan burung kata tersebut menunjuk pada langit yang tampak; bahasa Indonesia baku lazim memakai bentuk tunggal “langit”.
