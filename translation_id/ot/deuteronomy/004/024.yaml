  yaml_path: translation/ot/deuteronomy/004/024.yaml
  text: For Yahweh your God is a consuming fire[a], a jealous God.
translation:
  language: id
  text: Sebab Yahweh, Allahmu, adalah api yang menghanguskan, Allah yang cemburu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Allah yang bersemangat membela hak-Nya.” Kata Ibrani ini menekankan hak perjanjian Yahweh yang eksklusif atas umat-Nya, khususnya dalam konteks penyembahan berhala.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan bagi peringatan sebelumnya dan mempertahankan hubungan penjelas antarkalimat secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar, sehingga nama pribadi Allah dalam teks Ibrani tetap tampak.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: 'Bentuk dengan sufiks orang kedua tunggal menyatakan relasi kepunyaan/perjanjian: ''Allahmu''; sapaan tunggal kepada Israel dipertahankan.'
- source_word: אֵשׁ אֹכְלָה
  choice: api yang menghanguskan
  rationale: Ungkapan nomina dan partisip ini menggambarkan api yang memakan atau membinasakan. 'Api yang menghanguskan' alami, jelas, dan mempertahankan metafora penghakiman tanpa mengubahnya menjadi uraian.
- source_word: הוּא
  choice: adalah
  rationale: Pronomina mandiri memberi penegasan pada predikasi. Dalam bahasa Indonesia, kopula 'adalah' menyampaikan struktur dan penekanan itu secara wajar.
- source_word: אֵל
  choice: Allah
  rationale: Di sini אֵל merupakan sebutan ilahi yang beraposisi dengan klausa sebelumnya; 'Allah' merupakan padanan baku dan sesuai konteks.
- source_word: קַנָּא
  choice: cemburu
  rationale: Menunjukkan tuntutan perjanjian Yahweh yang eksklusif serta penolakan-Nya terhadap penyembahan saingan. 'Cemburu' mempertahankan daya relasional dan ketegangan istilah Ibrani.
theological_decisions:
- issue: Pengungkapan kecemburuan ilahi
  choice: Allah yang cemburu
  alternative: Allah yang bersemangat membela hak-Nya
  rationale: '''Cemburu'' paling langsung mempertahankan klaim perjanjian Allah yang eksklusif dalam konteks larangan penyembahan berhala. Alternatif yang memakai ''bersemangat'' dapat melunakkan ketegangan relasional dalam teks.'
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan khidmat. Susunan predikatif Ibrani dipertahankan sejauh tetap alami. Istilah 'cemburu' sengaja tidak diperhalus dalam teks utama; catatan kaki menjelaskan makna perjanjiannya. Penanda catatan [a] ditempatkan setelah frasa yang dijelaskannya.
