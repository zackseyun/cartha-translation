  text: וְ/זֹ֖את הַ/תּוֹרָ֑ה אֲשֶׁר שָׂ֣ם מֹשֶׁ֔ה לִ/פְנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/044.yaml
  text: And this is the law that Moses set before the sons of Israel:[a]
translation:
  language: id
  text: Inilah hukum yang Musa sampaikan kepada bani Israel:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Israel”, “bangsa Israel”, atau secara harfiah “anak-anak lelaki Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: Inilah
  rationale: Gabungan waw dan kata penunjuk memperkenalkan bagian berikut. Dalam bahasa Indonesia, “Inilah” secara alami mempertahankan daya presentasional klausa; hubungan dengan konteks tetap tersirat.
- source_word: הַתּוֹרָה
  choice: hukum
  rationale: תּוֹרָה dapat berarti pengajaran atau petunjuk, tetapi sebagai judul bagian ini menunjuk pada hukum atau pengajaran perjanjian yang disampaikan Musa. “Hukum” merupakan padanan yang lazim dan sesuai konteks.
- source_word: אֲשֶׁר
  choice: yang
  rationale: Kata penghubung relatif ini secara langsung dan alami diterjemahkan “yang”.
- source_word: שָׂם ... לִפְנֵי
  choice: sampaikan kepada
  rationale: Secara harfiah ungkapan ini berarti “menaruh di hadapan”. Dalam konteks penyampaian hukum kepada suatu umat, “sampaikan kepada” mengungkapkan fungsi idiom tersebut dengan bahasa Indonesia modern tanpa mengubah maksudnya.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: Ungkapan Ibrani secara harfiah berarti “anak-anak lelaki Israel” dan berfungsi sebagai sebutan kolektif bagi bangsa itu. “Bani Israel” mempertahankan bentuk genealogis tradisional sekaligus tetap ringkas dan dikenal dalam bahasa Indonesia.
theological_decisions:
- issue: Sebutan nasional yang berbentuk maskulin בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: orang Israel; bangsa Israel; anak-anak Israel
  rationale: Frasa ini adalah sebutan kolektif nasional sekaligus perjanjian. “Bani Israel” menjaga latar genealogis dan jejak bentuk sumber tanpa menyiratkan bahwa hanya laki-laki yang menjadi pendengar; alternatif idiomatis dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Inilah” dipilih sebagai pembuka judul bagian, sedangkan “sampaikan kepada” menghindari kekakuan ungkapan harfiah “menaruh di hadapan”. Penanda catatan kaki ditempatkan setelah klausa lengkap.
