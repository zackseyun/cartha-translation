source:
  edition: WLC
  text: כִּֽי תוֹלִ֤יד בָּנִים֙ וּ/בְנֵ֣י בָנִ֔ים וְ/נוֹשַׁנְתֶּ֖ם בָּ/אָ֑רֶץ וְ/הִשְׁחַתֶּ֗ם וַ/עֲשִׂ֤יתֶם פֶּ֨סֶל֙ תְּמ֣וּנַת כֹּ֔ל וַ/עֲשִׂיתֶ֥ם הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֶ֖י/ךָ לְ/הַכְעִיסֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/025.yaml
  text: When you father children and grandchildren[a], and you have grown old in the land, and you act corruptly and make a carved image in the form of anything, and do what is evil in the eyes of Yahweh your God[c][b], provoking him to anger—
translation:
  language: id
  text: Apabila engkau mempunyai anak dan cucu[a], dan kalian telah lama menetap di negeri itu[b], lalu kalian bertindak merusak dan membuat patung pahatan dalam rupa apa pun[c], serta melakukan apa yang jahat di mata Yahweh, Allahmu, sehingga membangkitkan murka-Nya—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “anak-anak laki-laki dan anak-anak dari anak-anak laki-laki”; dalam konteks ini ungkapan itu mencakup keturunan lintas generasi.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “kalian telah menjadi tua di negeri itu.” Kata Ibraninya dapat menekankan usia ataupun lamanya menetap.
    reason: lexical_alternative
  - marker: c
    text: Atau, “menurut rupa apa pun” maupun “dalam bentuk apa pun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Apabila
  rationale: Dalam konteks peringatan ini, kata tersebut membuka keadaan yang diproyeksikan akan terjadi dan berlanjut menuju akibat pada ayat berikutnya; “apabila” mempertahankan nuansa waktu sekaligus kemungkinan.
- source_word: תוֹלִיד
  choice: engkau telah mempunyai
  rationale: Bentuk tunggal menyapa Israel secara korporat melalui pribadi wakil. Ungkapan ini alami dalam bahasa Indonesia dan tidak menyiratkan bahwa pendengar laki-laki secara harfiah melahirkan.
- source_word: בָּנִים וּבְנֵי בָנִים
  choice: anak dan cucu
  rationale: Istilah keturunan maskulin Ibrani di sini mencakup generasi penerus secara umum; “anak dan cucu” menyampaikan cakupan antargenerasi secara wajar.
- source_word: וְנוֹשַׁנְתֶּם בָּאָרֶץ
  choice: kalian telah lama menetap di negeri itu
  rationale: Kata kerja itu dapat menggambarkan menjadi tua ataupun sudah lama berada dan mapan. Dalam bahasa Indonesia, “lama menetap” menyampaikan durasi dan kemapanan tanpa mengharuskan arti usia biologis.
- source_word: וְהִשְׁחַתֶּם
  choice: kalian berlaku bejat
  rationale: Dalam konteks penyembahan berhala, bentuk ini menunjuk pada perilaku yang rusak secara moral dan perjanjian; “berlaku bejat” kuat, alami, dan tidak menambahkan unsur refleksif.
- source_word: פֶּסֶל
  choice: patung pahatan
  rationale: Istilah ini menunjuk pada gambar atau patung yang dibentuk dengan memahat; pilihan ini lebih konkret daripada istilah teologis umum “berhala”.
- source_word: תְּמוּנַת כֹּל
  choice: dalam rupa apa pun
  rationale: Frasa tersebut mencakup representasi dalam bentuk apa saja; “dalam rupa apa pun” ringkas dan mempertahankan keluasan larangan.
- source_word: הָרַע בְּעֵינֵי
  choice: apa yang jahat di mata
  rationale: Pilihan ini mempertahankan idiom evaluatif Ibrani yang juga dapat dipahami dengan mudah dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: לְהַכְעִיסוֹ
  choice: sehingga membangkitkan murka-Nya
  rationale: Infinitif dapat menyatakan tujuan atau hasil. “Sehingga” menjaga kemungkinan hubungan akibat dalam konteks ini, sedangkan “membangkitkan murka-Nya” mempertahankan daya kausatifnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton sebagai nama pribadi Allah; transliterasi “Yahweh” mempertahankan fungsinya sebagai nama perjanjian.
- issue: Cakupan gender בָּנִים וּבְנֵי בָנִים
  choice: anak dan cucu
  alternative: anak laki-laki dan cucu laki-laki
  rationale: Dalam peringatan perjanjian ini, istilah maskulin berfungsi secara generik bagi keturunan lintas generasi, bukan membatasi peringatan hanya pada keturunan laki-laki.
- issue: Peralihan dari sapaan tunggal ke jamak
  choice: engkau ... kalian ... Allahmu
  alternative: menyeragamkan seluruh sapaan menjadi “kalian” atau “engkau”
  rationale: Teks Ibrani sendiri beralih dari bentuk tunggal pada תוֹלִיד dan sufiks אֱלֹהֶיךָ ke bentuk jamak pada וְנוֹשַׁנְתֶּם, וְהִשְׁחַתֶּם, dan וַעֲשִׂיתֶם. Peralihan ini dipertahankan agar ketegangan gramatikal sumber tidak dihapus.
- issue: Hubungan makna לְהַכְעִיסוֹ
  choice: sehingga membangkitkan murka-Nya
  alternative: untuk membangkitkan murka-Nya
  rationale: Bentuk infinitif memungkinkan nuansa tujuan maupun akibat. Teks utama memilih akibat yang alami dalam konteks, tanpa menegaskan bahwa kemarahan Allah merupakan tujuan sadar pelaku.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Peralihan sapaan tunggal “engkau/Allahmu” dan jamak “kalian” sengaja dipertahankan karena terdapat dalam teks Ibrani. Tanda pisah akhir mempertahankan kalimat yang belum selesai dan berlanjut ke ayat 26.
