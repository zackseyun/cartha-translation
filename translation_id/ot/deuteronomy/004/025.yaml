review_pass:
  verdict: revise
  source_fidelity: Peralihan sapaan tunggal pada “engkau/Allahmu” ke jamak pada “kalian” telah dipertahankan dengan tepat. Unsur-unsur utama—keturunan, lamanya menetap di tanah itu, tindakan korup, pembuatan patung pahatan, kejahatan di mata Yahweh, dan tindakan yang membangkitkan murka-Nya—semuanya tercakup. Namun, “berlaku bejat” terlalu bernuansa tuduhan kebejatan tertentu dalam pemakaian Indonesia modern dan kurang langsung mencerminkan שׁחת dalam konteks ini.
  naturalness: Teks umumnya baku dan jelas. “Apabila engkau telah mempunyai” kurang luwes untuk kondisi masa depan; “Apabila engkau mempunyai” lebih idiomatis. “Bertindak merusak” lebih netral dan sesuai konteks perusakan moral-perjanjian daripada “berlaku bejat.”
  terminology: “Yahweh,” “Allahmu,” “patung pahatan,” dan “di mata” sudah tepat dan konsisten dengan register modern yang khidmat. Catatan c perlu diperbaiki karena “menurut kemiripan apa pun” tidak alami dalam bahasa Indonesia.
  issues:
  - severity: medium
    issue: “berlaku bejat”
    rationale: Pilihan ini dapat membawa konotasi modern yang lebih sempit atau lebih tajam daripada verba Ibrani שׁחת, yang di sini menunjuk pada tindakan yang merusak/korup dalam konteks pelanggaran perjanjian dan penyembahan patung.
  - severity: low
    issue: “Apabila engkau telah mempunyai”
    rationale: Bentuk perfektif “telah mempunyai” kurang alami sesudah “apabila” dalam peringatan mengenai keadaan masa depan. Bentuk “mempunyai” menyampaikan kontingensi waktu sumber dengan lebih lancar.
  - severity: low
    issue: Frasa alternatif dalam catatan c
    rationale: “menurut kemiripan apa pun” tidak idiomatis. “Menurut rupa apa pun” atau “dalam bentuk apa pun” menyampaikan alternatif leksikal secara lebih jelas.
