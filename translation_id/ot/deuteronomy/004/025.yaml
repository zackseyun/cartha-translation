revisions:
- from: Apabila engkau telah mempunyai anak dan cucu[a], dan kalian telah lama menetap di negeri itu[b], lalu kalian berlaku bejat dengan membuat patung pahatan dalam rupa apa pun[c], serta melakukan apa yang jahat di mata Yahweh, Allahmu, sehingga membangkitkan murka-Nya—
