  rationale: Revisi mempertahankan susunan dan ambiguitas hubungan hasil/tujuan pada infinitif terakhir, serta peralihan tunggal-jamak dalam teks Ibrani. Perubahan hanya meningkatkan keluwesan bahasa Indonesia dan menghindari konotasi yang terlalu sempit pada “bejat.”
