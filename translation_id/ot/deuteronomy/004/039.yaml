base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/039.yaml
  text: So know today[a], and take it to your heart, that Yahweh, he is God in the heavens above and on the earth beneath[b]; there is no other.
translation:
  language: id
  text: Jadi, ketahuilah pada hari ini dan camkanlah dalam hatimu[a] bahwa Yahweh, Dialah Allah di langit di atas dan di bumi di bawah; tidak ada yang lain[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “bawalah kembali kepada hatimu”; suatu ungkapan untuk mengakui dan meresapi kebenaran secara batin.
    reason: lexical_alternative
  - marker: b
    text: 'Atau, secara lebih harfiah, “tidak ada lagi.” Dalam konteks ini maksudnya: tidak ada Allah lain.'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיָדַעְתָּ הַיּוֹם
  choice: ketahuilah pada hari ini
  rationale: Bentuk perfektum dengan waw berfungsi sebagai seruan atau perintah dalam konteks. Frasa ini mempertahankan penekanan waktu הַיּוֹם dan terdengar wajar dalam bahasa Indonesia baku.
- source_word: וַהֲשֵׁבֹתָ אֶל־לְבָבֶךָ
  choice: camkanlah dalam hatimu
  rationale: Ungkapan Ibrani secara harfiah berarti membawa atau mengembalikan sesuatu kepada hati, yakni mengakui dan meresapi kebenaran secara batin. 'Camkanlah dalam hatimu' mempertahankan bahasa hati sekaligus menyampaikan daya idiomatisnya.
- source_word: כִּי
  choice: bahwa
  rationale: Kata ini memperkenalkan isi yang harus diketahui dan dicamkan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks sumber tetap terlihat.
- source_word: הוּא הָאֱלֹהִים
  choice: Dialah Allah
  rationale: Akhiran -lah mempertahankan penekanan pada pronomina הוּא dan menyatakan identifikasi tegas Yahweh sebagai Allah.
- source_word: בַּשָּׁמַיִם מִמַּעַל וְעַל־הָאָרֶץ מִתָּחַת
  choice: di langit di atas dan di bumi di bawah
  rationale: Mempertahankan pasangan merismik yang mencakup seluruh ranah kosmis. 'Langit' lazim dipakai dalam bahasa Indonesia meskipun bentuk Ibraninya secara morfologis plural.
- source_word: אֵין עוֹד
  choice: tidak ada yang lain
  rationale: Ungkapan ini menyampaikan eksklusivitas mutlak secara ringkas dan alami tanpa menambahkan rumusan teologis yang tidak tersurat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memuat Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama itu dan sesuai dengan bukti pelafalan yang umum diterima.
- issue: Penekanan dalam הוּא הָאֱלֹהִים
  choice: Dialah Allah
  alternative: adalah Allah
  rationale: Pronomina הוּא bersifat menegaskan. Bentuk 'Dialah' mempertahankan penekanan tersebut secara alami dalam bahasa Indonesia.
- issue: Klaim eksklusif אֵין עוֹד
  choice: tidak ada yang lain
  alternative: tidak ada lagi
  rationale: Pilihan ini mempertahankan pernyataan bahwa tidak ada Allah lain, tanpa memperluas ayat menjadi formulasi doktrinal yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'ketahuilah' dan 'camkanlah' mempertahankan daya seruan Musa; 'Dialah' menjaga penekanan Ibrani tanpa menghasilkan susunan yang kaku.
