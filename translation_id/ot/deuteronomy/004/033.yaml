  text: Has any people heard the voice of God speaking from the midst of the fire[a], as you have heard, and lived?
translation:
  language: id
  text: Pernahkah suatu bangsa mendengar suara Allah berbicara dari tengah-tengah api, seperti yang telah kaudengar, dan bangsa itu tetap hidup?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dan hidup.” Kata kerja Ibrani itu merujuk kepada bangsa yang mendengar; dalam konteksnya, bangsa itu tetap hidup setelah mendengar Allah berbicara dari api. Dapat juga diterjemahkan “dan selamat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/שָׁמַע
  choice: Pernahkah ... mendengar
  rationale: Partikel tanya dengan verba perfektif membentuk pertanyaan retoris tentang pengalaman yang pernah terjadi; “Pernahkah” menyampaikannya secara alami dalam bahasa Indonesia.
- source_word: עָם
  choice: suatu bangsa
  rationale: Kata ini menunjuk kepada suatu kelompok masyarakat sebagai kesatuan. Dalam perbandingan dengan Israel, “suatu bangsa” lebih alami daripada “suatu rakyat”.
- source_word: קוֹל אֱלֹהִים
  choice: suara Allah
  rationale: Karena suara itu digambarkan sedang berbicara, “suara” lebih tepat daripada “bunyi”; bentuk partisip tunggal dan konteks menuntut rujukan tunggal, yaitu Allah.
- source_word: מְדַבֵּר
  choice: berbicara
  rationale: Partisip ini menggambarkan tindakan yang sedang berlangsung dan secara wajar menerangkan suara Allah.
- source_word: מִ/תּוֹךְ הָ/אֵשׁ
  choice: dari tengah-tengah api
  rationale: Ungkapan ini mempertahankan gambaran ruang yang jelas dalam bahasa Ibrani, bukan sekadar menyatakan asal dari api.
- source_word: כַּ/אֲשֶׁר שָׁמַעְתָּ אַתָּה
  choice: seperti yang telah kaudengar
  rationale: Kata ganti mandiri memberi penekanan kepada Israel sebagai pihak yang sungguh mengalami peristiwa itu; bentuk “telah kaudengar” tetap alami dan mencerminkan tindakan yang sudah terjadi.
- source_word: וַ/יֶּחִי
  choice: lalu tetap hidup
  rationale: Makna dasarnya ialah “hidup.” Dalam bahasa Indonesia, “tetap hidup” secara alami menyampaikan bahwa bangsa itu tidak mati sesudah mendengar Allah, sedangkan “lalu” menghubungkan urutan peristiwa tanpa menambahkan pertentangan eksplisit.
theological_decisions:
- issue: Makna אֱלֹהִים dalam konteks penyataan ilahi langsung
  choice: Allah
  alternative: seorang ilah; ilah-ilah
  rationale: Partisip tunggal dan konteks perjanjian di Horeb menunjuk kepada Allah yang berbicara kepada Israel; terjemahan tunggal ini mengikuti tata bahasa dan konteks tanpa menambahkan uraian doktrinal.
- issue: Apakah kontras tersirat antara mendengar Allah dan kematian perlu dinyatakan secara eksplisit
  choice: lalu tetap hidup
  alternative: namun tetap hidup; lalu selamat
  rationale: Teks Ibrani menghubungkan kedua tindakan tanpa kata pertentangan. “Tetap hidup” membuat hasilnya wajar dalam bahasa Indonesia, tetapi tidak menambahkan “namun” yang akan memperkuat kontras melampaui bentuk sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “kaudengar” dipakai untuk kelancaran dan untuk mempertahankan sapaan tunggal kepada Israel. Pertanyaan retoris serta ketegangan antara mendengar suara Allah dan tetap hidup dipertahankan.
