  text: וַ/תִּקְרְב֥וּ/ן וַ/תַּֽעַמְד֖וּ/ן תַּ֣חַת הָ/הָ֑ר וְ/הָ/הָ֞ר בֹּעֵ֤ר בָּ/אֵשׁ֙ עַד לֵ֣ב הַ/שָּׁמַ֔יִם חֹ֖שֶׁךְ עָנָ֥ן וַ/עֲרָפֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/011.yaml
  text: And you came near and stood at the foot of the mountain[a], while the mountain was burning with fire up to the heart of the heavens—darkness, cloud[b], and thick gloom.
translation:
  language: id
  text: Kalian mendekat dan berdiri di kaki gunung itu, sementara gunung itu menyala dengan api sampai ke jantung langit[a]—kegelapan, awan, dan kelam pekat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sampai ke jantung langit”; ungkapan ini dapat berarti sampai ke tengah atau ke tempat tinggi di langit.
    reason: lexical_alternative
  - marker: b
    text: Atau “kegelapan pekat” atau “kelam yang tebal”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרְבוּן
  choice: Kamu mendekat
  rationale: Bentuk Qal wayyiqtol orang kedua jamak dari קרב menyatakan gerak mendekat. Bahasa Indonesia tidak membedakan tunggal dan jamak pada 'kamu', tetapi konteks menunjukkan seluruh umat.
- source_word: וַתַּעַמְדוּן
  choice: berdiri
  rationale: Bentuk Qal wayyiqtol orang kedua jamak dari עמד memiliki arti lugas 'berdiri' dan sesuai dengan urutan narasi.
- source_word: תַּחַת הָהָר
  choice: di kaki gunung itu
  rationale: Walaupun תַּחַת secara harfiah berarti 'di bawah', dalam konteks topografis ungkapan ini secara alami menunjuk ke bagian dasar atau kaki gunung.
- source_word: וְהָהָר
  choice: sementara gunung itu
  rationale: Kata penghubung memperkenalkan keadaan gunung ketika umat berdiri di sana; 'sementara' menyampaikan hubungan sirkumstansial itu secara alami.
- source_word: בֹּעֵר בָּאֵשׁ
  choice: menyala dengan api
  rationale: Partisipel בֹּעֵר menunjukkan keadaan atau tindakan yang sedang berlangsung. Pilihan ini mempertahankan gambaran hidup serta penyebutan api secara eksplisit.
- source_word: עַד לֵב הַשָּׁמַיִם
  choice: sampai ke jantung langit
  rationale: לֵב secara harfiah berarti 'jantung/hati' dan secara idiomatis menunjuk bagian tengah atau ketinggian. 'Jantung langit' mempertahankan metafora Ibrani yang konkret, dengan catatan untuk menjelaskan maknanya.
- source_word: חֹשֶׁךְ
  choice: kegelapan
  rationale: Padanan baku yang mempertahankan unsur pertama dalam rangkaian gambaran teofani.
- source_word: עָנָן
  choice: awan
  rationale: Padanan langsung; bentuk tunggal dapat berfungsi secara kolektif dan alami dalam bahasa Indonesia.
- source_word: וַעֲרָפֶל
  choice: kelam pekat
  rationale: עֲרָפֶל menunjuk pada kegelapan yang tebal dan mengaburkan. 'Kelam pekat' membedakannya dari חֹשֶׁךְ sebelumnya sambil mempertahankan nuansa berat dan mencekam.
theological_decisions:
- issue: Gambaran penampakan ilahi di Sinai
  choice: 'Mempertahankan gambaran konkret dan penuh kedahsyatan: api, kegelapan, awan, dan kelam pekat.'
  alternative: Mengungkapkan unsur-unsur terakhir secara umum sebagai keadaan cuaca.
  rationale: Teks menggambarkan penampakan ilahi, bukan sekadar laporan meteorologis. Terjemahan mempertahankan lapisan citranya tanpa menambahkan tafsiran doktrinal.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Metafora Ibrani 'jantung langit' dipertahankan agar citra sumber tidak diratakan, sedangkan ungkapan topografis תַּחַת הָהָר diterjemahkan secara idiomatis sebagai 'di kaki gunung'. Semua penanda catatan kaki dicantumkan dalam teks utama.
