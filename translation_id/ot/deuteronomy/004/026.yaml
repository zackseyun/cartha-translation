base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/026.yaml
  text: I call heaven and earth to witness against you today that you will surely perish quickly from the land that you are crossing the Jordan to possess[a]. You will not prolong your days on it[c][b], for you will surely be destroyed.
translation:
  language: id
  text: Hari ini aku memanggil langit dan bumi sebagai saksi terhadap kamu bahwa kamu pasti akan segera lenyap dari tanah yang akan kamu masuki setelah menyeberangi Sungai Yordan untuk memilikinya. Kamu tidak akan berumur panjang di tanah itu, sebab kamu pasti akan dimusnahkan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַעִידֹתִי בָכֶם
  choice: aku memanggil ... menjadi saksi terhadap kamu
  rationale: Bentuk Hifil dari עוּד dalam konteks hukum-perjanjian menyatakan pemanggilan saksi, sedangkan בָכֶם memberi nuansa kesaksian yang memberatkan pihak yang dituju.
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: langit dan bumi
  rationale: Ungkapan ini merupakan formula saksi perjanjian; bentuk idiomatis Indonesia tidak memerlukan artikel atau penandaan jamak pada 'langit'.
- source_word: אָבֹד תֹּאבֵדוּן
  choice: kamu pasti akan ... binasa
  rationale: Infinitif absolut yang diikuti verba finit menegaskan kepastian ancaman; 'pasti' menyampaikan penekanan itu secara wajar.
- source_word: מַהֵר מֵעַל הָאָרֶץ
  choice: akan segera binasa dari negeri
  rationale: '''Segera'' menerjemahkan מַהֵר, sedangkan ''dari negeri'' mempertahankan gagasan lenyap atau tersingkir dari atas tanah itu tanpa menambahkan cara penghukuman.'
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים אֶת הַיַּרְדֵּן שָׁמָּה לְרִשְׁתָּהּ
  choice: yang akan kamu masuki dengan menyeberangi Sungai Yordan untuk mendudukinya
  rationale: Terjemahan ini membuat arah tujuan yang dinyatakan שָׁמָּה jelas dalam bahasa Indonesia. 'Menduduki' menyampaikan ירשׁ dalam konteks penguasaan negeri.
- source_word: לֹא תַאֲרִיכֻן יָמִים עָלֶיהָ
  choice: Kamu tidak akan berumur panjang di negeri itu
  rationale: Idiom harfiah 'memperpanjang hari-hari' paling alami disampaikan sebagai 'berumur panjang'; rujukan pronominal diperjelas sebagai 'negeri itu'.
- source_word: הִשָּׁמֵד תִּשָּׁמֵדוּן
  choice: kamu pasti akan dimusnahkan
  rationale: Konstruksi infinitif absolut menegaskan kepastian, dan bentuk pasif Niphal dipertahankan dengan 'dimusnahkan' tanpa menentukan pelaku secara eksplisit.
theological_decisions:
- issue: Formula saksi perjanjian yang melibatkan langit dan bumi
  choice: Diterjemahkan sebagai pemanggilan langit dan bumi menjadi saksi terhadap Israel
  alternative: Aku memperingatkan kamu pada hari ini demi langit dan bumi
  rationale: Pilihan utama mempertahankan corak yuridis dari formula gugatan perjanjian dan tidak mereduksinya menjadi peringatan umum.
- issue: Cakupan ancaman kehancuran
  choice: Menggunakan 'dimusnahkan' tanpa memperluasnya menjadi pernyataan metafisik tentang kepunahan mutlak
  alternative: dilenyapkan sama sekali
  rationale: Bahasa Ibrani menegaskan kerasnya dan kepastian penghukuman, tetapi konteks ayat tidak mengharuskan terjemahan yang menyelesaikan seluruh pertanyaan teologis tentang cakupannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti jamak Ibrani diterjemahkan dengan 'kamu', yang dalam bahasa Indonesia dapat bersifat tunggal atau jamak; konteks menunjukkan umat Israel secara kolektif. 'Sungai Yordan' dipakai agar nama geografis langsung jelas bagi pembaca umum.
