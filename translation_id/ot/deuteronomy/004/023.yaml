  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הִשָּׁמְר֣וּ לָ/כֶ֗ם פֶּֽן תִּשְׁכְּחוּ֙ אֶת בְּרִ֤ית יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם אֲשֶׁ֥ר כָּרַ֖ת עִמָּ/כֶ֑ם וַ/עֲשִׂיתֶ֨ם לָ/כֶ֥ם פֶּ֨סֶל֙ תְּמ֣וּנַת כֹּ֔ל אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/023.yaml
  text: Watch yourselves[a], lest you forget the covenant of Yahweh your God that he made with you, and make for yourselves a carved image, the likeness of anything that Yahweh your God has commanded you not to make.
translation:
  language: id
  text: Jagalah diri kalian, jangan sampai kalian melupakan perjanjian Yahweh, Allah kalian, yang telah Dia adakan dengan kalian, dan membuat bagi diri kalian patung pahatan dalam bentuk apa pun yang Yahweh, Allahmu, perintahkan agar tidak kaubuat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “yang Yahweh, Allahmu, perintahkan kepadamu.” Unsur “agar tidak kaubuat” tersirat dari konteks; bandingkan Ulangan 4:16.'
    reason: Menjelaskan negasi kontekstual yang tidak dinyatakan secara eksplisit dalam teks Ibrani.
lexical_decisions:
- source_word: הִשָּׁמְרוּ לָכֶם
  choice: Jagalah diri kalian
  rationale: Bentuk perintah Nifal dengan לָכֶם merupakan peringatan refleksif agar umat menjaga diri atau tetap waspada. Pilihan ini mempertahankan daya refleksif bentuk Ibrani dan tetap wajar dalam bahasa Indonesia modern.
- source_word: פֶּן
  choice: jangan sampai
  rationale: פֶּן memperkenalkan kemungkinan negatif yang diperingatkan. 'Jangan sampai' alami dalam bahasa Indonesia serta sesuai dengan nada peringatan yang sungguh-sungguh.
- source_word: בְּרִית
  choice: perjanjian
  rationale: '''Perjanjian'' adalah padanan baku dan mudah dipahami untuk בְּרִית dalam hubungan Yahweh dengan Israel, tanpa mempersempitnya menjadi kontrak biasa.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan sebuah gelar.
- source_word: אֲשֶׁר כָּרַת עִמָּכֶם
  choice: yang telah ... adakan dengan kalian
  rationale: כרת ברית adalah idiom untuk mengadakan perjanjian. Terjemahan harfiah 'memotong perjanjian' tidak wajar dalam bahasa Indonesia.
- source_word: וַעֲשִׂיתֶם לָכֶם
  choice: lalu membuat bagi diri kalian
  rationale: '''Bagi diri kalian'' mempertahankan nuansa benefaktif-refleksif לָכֶם, sedangkan ''lalu'' menghubungkan pembuatan patung dengan akibat melupakan perjanjian tanpa mengubahnya menjadi perintah tersendiri.'
- source_word: פֶּסֶל
  choice: patung pahatan
  rationale: פֶּסֶל menunjuk pada representasi yang dibentuk atau dipahat. 'Patung pahatan' mempertahankan sifat konkretnya, sedangkan 'berhala' akan lebih dahulu menafsirkan fungsi religius benda itu.
- source_word: תְּמוּנַת כֹּל
  choice: yang menyerupai apa pun
  rationale: תְּמוּנָה menyatakan rupa, bentuk, atau kemiripan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan cakupan menyeluruh כֹּל.
- source_word: אֱלֹהֵיכֶם / אֱלֹהֶיךָ
  choice: Allah kalian / Allahmu
  rationale: Terjemahan mempertahankan peralihan bentuk Ibrani dari sapaan jamak pada awal ayat kepada sapaan tunggal dalam klausa terakhir.
- source_word: אֲשֶׁר צִוְּךָ יְהוָה אֱלֹהֶיךָ
  choice: yang Yahweh, Allahmu, perintahkan agar tidak kaubuat
  rationale: Teks Ibrani secara bentuk berbunyi 'yang ... perintahkan kepadamu', tetapi konteks langsung membuat larangannya tersirat. Unsur negatif ditampilkan agar bahasa Indonesia tidak memberikan kesan berlawanan bahwa Yahweh memerintahkan pembuatan patung.
theological_decisions:
- issue: Negasi tersirat dalam klausa relatif terakhir
  choice: 'Menampilkan larangan tersirat: ''perintahkan agar tidak kaubuat''.'
  alternative: 'Menerjemahkan secara formal: ''yang diperintahkan Yahweh, Allahmu, kepadamu'', tanpa menambahkan unsur negatif.'
  rationale: Teks Masoret tidak memuat partikel negatif dalam klausa terakhir, sehingga bentuk formalnya tetap dicatat dalam catatan kaki. Namun, konteks langsung—khususnya Ulangan 4:16—jelas melarang pembuatan rupa. Menampilkan negasi tersirat mencegah kesan keliru bahwa Yahweh justru memerintahkan pembuatan patung, tanpa menambahkan ajaran di luar alur teks.
- issue: Peralihan sapaan jamak ke tunggal
  choice: Mempertahankan 'kalian' lalu 'Allahmu/kaubuat'.
  alternative: Menyeragamkan seluruh ayat menjadi bentuk jamak demi kelancaran.
  rationale: Peralihan gramatikal ini terdapat dalam sumber Ibrani. Bahasa Indonesia memungkinkan peralihan tersebut dipertahankan secara cukup jelas, sehingga ciri teks tidak perlu dihapus.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. 'Kalian' dipakai untuk menandai sapaan jamak, sedangkan 'Allahmu' dan 'kaubuat' mempertahankan peralihan ke bentuk tunggal pada akhir ayat. Tanda catatan kaki ditempatkan pada klausa yang benar-benar dijelaskannya.
