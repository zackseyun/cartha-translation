base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/036.yaml
  text: From heaven he made you hear his voice to discipline you[a], and on earth he showed you his great fire[b], and you heard his words from the midst of the fire.
translation:
  language: id
  text: Dari langit Ia memperdengarkan suara-Nya kepadamu untuk mendisiplinkanmu[a], dan di bumi Ia memperlihatkan kepadamu api-Nya yang besar; engkau mendengar kata-kata-Nya dari tengah-tengah api itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk mengajar engkau”, “untuk menghajar engkau”, atau “untuk menegur engkau”; kata Ibrani ini dapat mencakup disiplin yang bersifat membentuk sekaligus mengoreksi.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשָּׁמַיִם
  choice: Dari langit
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan kontras ruang dengan 'di bumi'.
- source_word: הִשְׁמִיעֲךָ אֶת קֹלוֹ
  choice: Ia memperdengarkan suara-Nya kepadamu
  rationale: Bentuk kausatif הִשְׁמִיעֲךָ dipertahankan melalui 'memperdengarkan', sedangkan קֹלוֹ diterjemahkan secara konkret sebagai 'suara-Nya'.
- source_word: לְיַסְּרֶךָּ
  choice: untuk mendisiplinkan engkau
  rationale: Kata יסר mencakup pembentukan, pengajaran, teguran, dan koreksi. 'Mendisiplinkan' mempertahankan keluasan makna tersebut tanpa membatasinya pada hukuman.
- source_word: וְעַל הָאָרֶץ
  choice: dan di bumi
  rationale: Pilihan ini mempertahankan kontras kosmis dengan 'dari langit' dan lebih alami daripada 'di atas bumi' dalam konteks ini.
- source_word: הֶרְאֲךָ אֶת אִשּׁוֹ הַגְּדוֹלָה
  choice: Ia memperlihatkan api-Nya yang besar kepadamu
  rationale: '''Memperlihatkan'' menyampaikan daya kausatif bentuk Hifil, sementara ''api-Nya yang besar'' mempertahankan citraan konkret teks Ibrani.'
- source_word: וּדְבָרָיו שָׁמַעְתָּ
  choice: engkau mendengar firman-firman-Nya
  rationale: Bentuk jamak דְבָרָיו dipertahankan. 'Firman-firman-Nya' sesuai dengan konteks perkataan ilahi yang diartikulasikan.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: dari tengah-tengah api itu
  rationale: Terjemahan ini mempertahankan arti 'dari bagian dalam/tengah' dan memakai 'itu' agar rujukannya kepada api yang baru disebut tetap jelas.
theological_decisions:
- issue: Tujuan pedagogis ilahi dalam לְיַסְּרֶךָּ
  choice: untuk mendisiplinkan engkau
  alternative: untuk mengajar engkau; untuk menghajar engkau; untuk menegur engkau
  rationale: '''Mendisiplinkan'' mempertahankan ketegangan antara pembentukan dan koreksi, tanpa mempersempitnya menjadi pengajaran saja atau hukuman saja.'
- issue: Bahasa konkret tentang penyataan diri Allah
  choice: suara-Nya ... api-Nya yang besar ... firman-firman-Nya
  alternative: ungkapan yang lebih abstrak tentang penyataan ilahi
  rationale: Istilah konkret teks sumber dipertahankan tanpa dilunakkan atau dijelaskan secara doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina 'Ia' dan bentuk '-Nya' dipakai untuk rujukan kepada Allah. 'Engkau' mempertahankan sapaan tunggal dalam teks Ibrani. Susunan klausa dijaga dekat dengan teks sumber sambil tetap alami dalam bahasa Indonesia.
