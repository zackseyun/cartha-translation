  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Wadi' dipakai sebagai istilah geografis yang ringkas, dengan penjelasan dalam catatan kaki. Tanda pisah menampilkan keterangan identifikasi secara jelas; koma akhir dipertahankan karena ayat ini merupakan kelanjutan sintaksis dari ayat sebelumnya.
