  yaml_path: translation/ot/deuteronomy/004/048.yaml
  text: from Aroer[a], which is on the bank of the Arnon Valley, as far as Mount Sion (that is, Hermon)[b],
translation:
  language: id
  text: dari Aroer, yang terletak di tepi lembah Arnon[a], sampai Gunung Sion, yaitu Hermon[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Wadi Arnon” atau “Sungai Arnon”. Kata Ibrani נַחַל sering menunjuk pada dasar aliran atau lembah sungai yang tidak selalu berair sepanjang tahun.
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani berbunyi “Sion”; bandingkan Ulangan 3:9, yang menyebut gunung ini “Siryon” menurut sebutan orang Sidon. Dalam ayat ini, Sion secara langsung diidentifikasi sebagai Hermon.
    reason: cross_reference
lexical_decisions:
- source_word: מֵ/עֲרֹעֵר
  choice: dari Aroer
  rationale: Preposisi מִן menandai titik awal wilayah; Aroer dipertahankan sebagai nama tempat.
- source_word: אֲשֶׁר עַל שְׂפַת
  choice: yang terletak di tepi
  rationale: Ungkapan ini secara harfiah menunjuk pada sesuatu yang berada di bibir atau tepi; bentuk Indonesia ini alami dalam konteks geografis.
- source_word: נַחַל אַרְנֹן
  choice: Wadi Arnon
  rationale: נַחַל dapat berarti dasar aliran, lembah sungai, atau jurang yang tidak selalu berair sepanjang tahun. 'Wadi' mempertahankan ciri topografis itu tanpa menyiratkan sungai permanen.
- source_word: וְ/עַד
  choice: sampai ke
  rationale: Menandai batas akhir dalam rumusan rentang wilayah.
- source_word: הַר שִׂיאֹן
  choice: Gunung Sion
  rationale: הַר diterjemahkan secara idiomatis sebagai 'Gunung', sedangkan שִׂיאֹן ditransliterasikan sebagai Sion dan tidak disamakan dengan Zion.
- source_word: הוּא חֶרְמוֹן
  choice: yaitu Hermon
  rationale: הוּא berfungsi sebagai penjelasan aposisional yang mengidentifikasi Gunung Sion sebagai Hermon.
