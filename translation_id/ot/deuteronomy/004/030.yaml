base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/030.yaml
  text: When you are in distress[a], and all these things come upon you[b], in the latter days you will return to Yahweh your God and listen to his voice.
translation:
  language: id
  text: Ketika engkau berada dalam kesesakan dan semua hal ini menimpamu, pada hari-hari mendatang[a] engkau akan kembali kepada Yahweh, Allahmu, dan mendengarkan suara-Nya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di kemudian hari”. Ungkapan Ibrani “pada hari-hari mendatang” dapat menunjuk secara luas kepada suatu masa mendatang dan tidak harus dibatasi pada skema akhir zaman tertentu.
    reason: alternative_reading
  - marker: b
    text: “Mendengarkan suara-Nya” juga dapat diterjemahkan “menaati-Nya”, sebab ungkapan Ibrani ini sering mencakup arti mengindahkan dengan taat.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּצַּר לְךָ
  choice: ketika engkau berada dalam kesesakan
  rationale: Frasa ini menyatakan keadaan atau situasi. Bentuk temporal dengan “ketika” menghasilkan bahasa Indonesia yang alami tanpa menambah gagasan yang tidak tersurat.
- source_word: וּמְצָאוּךָ
  choice: menimpamu
  rationale: Secara harfiah berarti “menemukanmu”, tetapi ketika subjeknya ialah berbagai kejadian atau malapetaka, “menimpamu” merupakan ungkapan Indonesia yang idiomatis dan tepat.
- source_word: כֹּל הַדְּבָרִים הָאֵלֶּה
  choice: semua hal ini
  rationale: דְּבָרִים dapat berarti “perkataan”, “hal”, atau “perkara”. Dalam konteks ini, frasa tersebut menunjuk kepada kejadian-kejadian yang telah diperingatkan, sehingga “semua hal ini” paling jelas dan wajar.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: pada hari-hari kemudian
  rationale: Pilihan ini mempertahankan ungkapan waktu Ibrani beserta kemungkinan nuansa teologisnya, tetapi tidak membatasinya pada suatu skema akhir zaman tertentu.
- source_word: וְשַׁבְתָּ עַד
  choice: engkau akan kembali kepada
  rationale: שׁוּב dengan עַד menyatakan tindakan berbalik atau kembali kepada seseorang. “Kembali kepada” mempertahankan dimensi relasional dan perjanjian tanpa secara eksplisit menambahkan istilah teologis “bertobat”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk konstruk dengan akhiran orang kedua tunggal dipertahankan secara ringkas dan alami sebagai “Allahmu”.
- source_word: וְשָׁמַעְתָּ בְּקֹלוֹ
  choice: dan mendengarkan suara-Nya
  rationale: Ungkapan ini sering mengandung arti mengindahkan atau menaati. “Mendengarkan suara-Nya” mempertahankan metafora pendengaran dalam bahasa Ibrani, sementara catatan kaki menjelaskan nuansa ketaatan.
theological_decisions:
- issue: Makna waktu בְּאַחֲרִית הַיָּמִים dan risiko pembacaan eskatologis yang terlalu sempit
  choice: pada hari-hari kemudian
  alternative: pada masa yang akan datang; pada akhir zaman
  rationale: Ungkapan Ibrani ini dapat menunjuk secara luas kepada masa mendatang dan tidak dengan sendirinya menetapkan suatu skema akhir zaman tertentu. Terjemahan mempertahankan ambiguitas tersebut.
- issue: Bahasa kembali kepada Allah dalam וְשַׁבְתָּ עַד יְהוָה
  choice: engkau akan kembali kepada Yahweh, Allahmu
  alternative: engkau akan berbalik kembali kepada Yahweh, Allahmu; engkau akan bertobat dan kembali kepada Yahweh, Allahmu
  rationale: “Kembali” mempertahankan daya relasional dan perjanjian dari kata kerja Ibrani tanpa memasukkan rumusan pertobatan yang lebih terperinci daripada yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia modern yang wajar dan bermartabat digunakan dengan sapaan tunggal “engkau” untuk mempertahankan bentuk orang kedua tunggal dalam teks Ibrani. Nama ilahi dipertahankan sebagai “Yahweh”, dan pronomina yang merujuk kepada Allah ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab bahasa Indonesia.
