base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/007.yaml
  text: For what great nation is there that has gods so near to it as Yahweh our God is to us whenever we call on him?[a][b]
translation:
  language: id
  text: Sebab, bangsa besar manakah yang mempunyai ilah-ilah sedekat Yahweh, Allah kita, kepada kita setiap kali kita berseru kepada-Nya?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani memakai bentuk jamak: “ilah-ilah.” Ayat ini secara retoris membandingkan dewa-dewa bangsa-bangsa lain dengan Yahweh, Allah Israel.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “setiap kali kita memanggil kepada-Nya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan yang mendukung nasihat pada ayat sebelumnya dan mempertahankan daya argumentatif teks.
- source_word: מִי גוֹי גָּדוֹל
  choice: bangsa besar manakah
  rationale: Merupakan pertanyaan retoris; susunan ini alami dalam bahasa Indonesia dan tetap dekat dengan bentuk Ibrani.
- source_word: אֲשֶׁר לוֹ
  choice: yang mempunyai
  rationale: Mengungkapkan konstruksi kepemilikan atau keterkaitan dalam bahasa Indonesia yang wajar.
- source_word: אֱלֹהִים
  choice: ilah-ilah
  rationale: Adjektiva jamak קְרֹבִים dan perbandingan dengan Allah Israel mendukung arti jamak yang menunjuk pada dewa-dewa bangsa lain; 'ilah-ilah' mempertahankan nuansa religius tanpa menyamakannya dengan Yahweh.
- source_word: קְרֹבִים אֵלָיו
  choice: begitu dekat kepadanya
  rationale: Bentuk jamak menerangkan ilah-ilah, sedangkan pronomina tunggal merujuk kembali kepada bangsa itu; 'begitu' menyampaikan penekanan perbandingan retoris.
- source_word: כַּיהוָה אֱלֹהֵינוּ
  choice: seperti Yahweh, Allah kita
  rationale: כְּ menandai perbandingan, nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', dan אֱלֹהֵינוּ bermakna tunggal 'Allah kita'.
- source_word: בְּכָל קָרְאֵנוּ אֵלָיו
  choice: setiap kali kita berseru kepada-Nya
  rationale: Konstruksi בְּכָל dengan infinitif menyatakan keadaan yang berulang. 'Berseru kepada-Nya' merupakan ungkapan Indonesia yang alami untuk doa atau permohonan, sekaligus mempertahankan arah preposisi אֵל.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama perjanjian יהוה secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama diri, bukan menggantinya dengan gelar.
- issue: Rujukan אֱלֹהִים pada klausa pertama
  choice: ilah-ilah bangsa-bangsa lain
  alternative: Allah; makhluk-makhluk ilahi
  rationale: Adjektiva jamak קְרֹבִים dan struktur perbandingan dengan 'Yahweh, Allah kita' mendukung rujukan jamak kepada dewa-dewa yang disembah bangsa lain, tanpa menegaskan realitas ontologis mereka.
- issue: Sifat kedekatan Yahweh
  choice: kedekatan yang dialami setiap kali Israel berseru kepada-Nya
  alternative: kedekatan spasial semata
  rationale: Klausa penutup mengaitkan kedekatan Yahweh dengan tindakan umat berseru kepada-Nya; terjemahan mempertahankan hubungan itu tanpa merumuskan lebih jauh bagaimana jawaban ilahi diberikan.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Bentuk pertanyaan retoris dipertahankan. Pengulangan 'dekat' membuat unsur tersirat pada klausa perbandingan menjadi jelas dan alami dalam bahasa Indonesia. 'Kepada-Nya' memakai kapital penghormatan untuk rujukan kepada Yahweh.
