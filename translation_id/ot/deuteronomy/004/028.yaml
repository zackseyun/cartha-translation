  text: וַ/עֲבַדְתֶּם שָׁ֣ם אֱלֹהִ֔ים מַעֲשֵׂ֖ה יְדֵ֣י אָדָ֑ם עֵ֣ץ וָ/אֶ֔בֶן אֲשֶׁ֤ר לֹֽא יִרְאוּ/ן֙ וְ/לֹ֣א יִשְׁמְע֔וּ/ן וְ/לֹ֥א יֹֽאכְל֖וּ/ן וְ/לֹ֥א יְרִיחֻֽ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/028.yaml
  text: And there you will serve gods[a], the work of human hands, wood and stone, which neither see nor hear nor eat nor smell.
translation:
  language: id
  text: Di sana kamu akan beribadah kepada ilah-ilah, buatan tangan manusia dari kayu dan batu, yang tidak dapat melihat, mendengar, makan, ataupun mencium bau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “yang tidak melihat, tidak mendengar, tidak makan, dan tidak mencium bau.”'
    reason: Alternatif ini memperlihatkan pengulangan kata negatif לֹא dalam teks Ibrani, sementara teks utama mengungkapkan ketidakmampuan yang tersirat.
lexical_decisions:
- source_word: וַעֲבַדְתֶּם
  choice: kamu akan beribadah kepada
  rationale: Kata עבד di sini berarti melayani dalam arti religius atau menyembah. Dalam bahasa Indonesia, “beribadah kepada” menyampaikan konteks keagamaan secara alami, sedangkan bentuk mendatang sesuai dengan rangkaian peringatan Musa.
- source_word: שָׁם
  choice: di sana
  rationale: Keterangan tempat ini menunjuk kepada negeri-negeri tempat bangsa itu akan diserakkan dalam konteks ayat sebelumnya.
- source_word: אֱלֹהִים
  choice: ilah-ilah
  rationale: Bentuk ini mempertahankan makna leksikal jamak dan tidak langsung menggantinya dengan istilah interpretatif “berhala”; keterangan berikutnya memperjelas bahwa ilah-ilah itu adalah benda buatan manusia.
- source_word: מַעֲשֵׂה יְדֵי אָדָם
  choice: buatan tangan manusia
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan penekanan bahwa benda-benda tersebut dibuat oleh manusia.
- source_word: עֵץ וָאֶבֶן
  choice: dari kayu dan batu
  rationale: Dalam konteks ini עֵץ dan אֶבֶן menyatakan bahan pembuatannya, sehingga “kayu dan batu” lebih tepat daripada “pohon dan batu”.
- source_word: אֲשֶׁר לֹא יִרְאוּן וְלֹא יִשְׁמְעוּן וְלֹא יֹאכְלוּן וְלֹא יְרִיחֻן
  choice: yang tidak dapat melihat, mendengar, makan, ataupun mencium bau
  rationale: “Tidak dapat” mengungkapkan ketidakmampuan ilah-ilah buatan itu, sementara daftar empat tindakan indrawi dipertahankan secara ringkas dan berirama.
- source_word: יְרִיחֻן
  choice: mencium bau
  rationale: Bentuk ini berarti mencium atau membaui; “mencium bau” jelas dan alami bagi pembaca Indonesia.
theological_decisions:
- issue: Sebutan bagi אֱלֹהִים dalam konteks ilah palsu
  choice: ilah-ilah
  alternative: berhala-berhala
  rationale: “Ilah-ilah” mempertahankan sebutan dalam teks Ibrani tanpa terlebih dahulu menafsirkan nomina itu sebagai benda berhala; sifatnya sebagai hasil buatan manusia dinyatakan oleh aposisi yang menyusul.
- issue: Daya atau ketidakmampuan benda-benda buatan itu
  choice: tidak dapat melihat, mendengar, makan, ataupun mencium bau
  alternative: tidak melihat, tidak mendengar, tidak makan, dan tidak mencium bau
  rationale: Pilihan utama menyampaikan daya polemis klausa tersebut sebagai ketidakmampuan, sedangkan catatan kaki mempertahankan bentuk negasi berulang yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. “Kamu” dipakai sebagai sapaan kolektif sesuai konteks Israel sebagai umat yang diajak bicara. Susunan kalimat dibuat alami tanpa menghilangkan polemik teks terhadap ilah-ilah hasil buatan manusia.
