base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/012.yaml
  text: Then Yahweh spoke to you from the midst of the fire[a]. You heard the sound of words[c][b], but saw no form—only a voice.
translation:
  language: id
  text: Lalu Yahweh berbicara kepada kalian dari tengah-tengah api[a]. Kalian mendengar suara perkataan[b], tetapi tidak melihat bentuk apa pun[c]—hanya suara.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dari dalam api.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “suara perkataan”; dapat juga diterjemahkan “bunyi ujaran.”'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “rupa,” “bentuk,” atau “gambaran.” Kata Ibrani ini menekankan bahwa tidak ada bentuk atau representasi yang terlihat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama perjanjian ilahi sebagaimana terdapat dalam teks Ibrani dan mengikuti kebiasaan proyek.
- source_word: וַיְדַבֵּר
  choice: berbicara
  rationale: Kata kerja דבר lazim berarti ‘berbicara’; bentuk ini sesuai dengan narasi dan menjaga bobot ujaran ilahi.
- source_word: אֲלֵיכֶם
  choice: kepada kalian
  rationale: Akhiran pronomina Ibrani berbentuk jamak; ‘kalian’ menyatakannya secara jelas dalam bahasa Indonesia modern.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: dari tengah-tengah api
  rationale: Mengungkapkan secara alami bahwa suara itu berasal dari dalam api, bukan sekadar dari arah api.
- source_word: קוֹל דְּבָרִים
  choice: bunyi kata-kata
  rationale: Mempertahankan gabungan harfiah ‘bunyi/suara perkataan’ sekaligus menunjukkan bahwa yang terdengar ialah ujaran yang dapat dibedakan, bukan bunyi samar.
- source_word: שֹׁמְעִים
  choice: mendengar
  rationale: Partisip Ibrani berfungsi sebagai gambaran peristiwa lampau dalam konteks pidato; bentuk Indonesia ini alami setelah kerangka naratif ayat.
- source_word: תְמוּנָה
  choice: wujud
  rationale: Menunjuk pada bentuk atau representasi yang dapat dilihat. ‘Wujud’ ringkas dan mempertahankan kontras dengan suara tanpa menambahkan tafsiran doktrinal.
- source_word: אֵינְכֶם רֹאִים
  choice: tidak melihat ... apa pun
  rationale: Menyampaikan secara idiomatis ketiadaan bentuk yang terlihat dan mempertahankan subjek jamak.
- source_word: זוּלָתִי קוֹל
  choice: hanya suara
  rationale: 'זוּלָתִי menyatakan pengecualian: tidak ada wujud yang tampak; yang ada hanya suara.'
theological_decisions:
- issue: Bahasa antropomorfis atau representasional mengenai penyataan Allah
  choice: Mempertahankan kontras antara penyataan yang terdengar dan tidak adanya wujud yang terlihat.
  alternative: Kalian mendengar suara-Nya, tetapi tidak melihat gambaran yang kelihatan.
  rationale: Ayat ini menegaskan bahwa Israel sungguh mendengar perkataan ilahi tanpa melihat suatu bentuk. Terjemahan tidak memperluas pernyataan tersebut menjadi rumusan doktrinal mengenai gambar atau hakikat Allah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. ‘Kalian’ dipakai untuk memperjelas bentuk jamak dalam bahasa Ibrani. Struktur paralel antara mendengar dan melihat dipertahankan, dan tanda pisah menonjolkan pengecualian penutup tanpa menghilangkan ketegangan asli.
