base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/021.yaml
  text: And Yahweh was angry with me because of you[a], and he swore that I would not cross the Jordan and that I would not enter the good land that Yahweh your God is giving you as an inheritance.
translation:
  language: id
  text: Yahweh murka terhadap aku karena perkataan kalian[a], dan Ia bersumpah bahwa aku tidak akan menyeberangi Sungai Yordan dan tidak akan memasuki negeri yang baik itu, yang Yahweh, Allahmu, memberikan kepadamu sebagai warisan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “karena perkataan kalian”; ungkapan ini juga dapat dipahami secara lebih umum sebagai “karena kalian” atau “oleh karena kalian.”
    reason: Menjelaskan ungkapan Ibrani yang dapat diterjemahkan secara harfiah dengan menyebut “perkataan” atau secara idiomatis sebagai rujukan kepada umat itu sendiri.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: הִתְאַנֶּף בִּי
  choice: murka terhadap aku
  rationale: Bentuk verba menyatakan kemarahan yang kuat; frasa ini alami dalam ragam Indonesia yang khidmat dan mempertahankan arah kemarahan kepada Musa.
- source_word: עַל דִּבְרֵיכֶם
  choice: karena perkataan kalian
  rationale: Mempertahankan unsur eksplisit דִּבְרֵי, ‘perkataan’, dan bentuk jamak ‘kalian’, tanpa menyempitkan maksudnya pada ucapan tertentu.
- source_word: וַיִּשָּׁבַע
  choice: Ia bersumpah
  rationale: Padanan langsung dan wajar untuk tindakan mengikat diri dengan sumpah.
- source_word: לְבִלְתִּי עָבְרִי אֶת הַיַּרְדֵּן
  choice: bahwa aku tidak akan menyeberangi Sungai Yordan
  rationale: Menyampaikan isi sumpah dengan jelas; ‘Sungai Yordan’ merupakan bentuk alami dalam bahasa Indonesia.
- source_word: וּלְבִלְתִּי בֹא
  choice: ataupun memasuki
  rationale: Menghubungkan dua larangan sejajar di bawah satu konstruksi sumpah secara ringkas dan alami.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: negeri yang baik
  rationale: Mempertahankan penilaian sederhana טוֹבָה tanpa menafsirkannya secara lebih khusus sebagai subur atau menyenangkan.
- source_word: נֹתֵן לְךָ
  choice: berikan kepadamu
  rationale: Bentuk sekarang dalam bahasa Indonesia dapat menyatakan tindakan pemberian yang sedang berlaku atau dipastikan; bentuk tunggal Ibrani dipertahankan melalui ‘-mu’ dan ‘kepadamu’.
- source_word: נַחֲלָה
  choice: sebagai milik pusaka
  rationale: ‘Milik pusaka’ menyatakan tanah yang dianugerahkan sebagai bagian warisan tetap dan mempertahankan warna perjanjian.
theological_decisions:
- issue: Kaitan antara Israel dan murka Yahweh terhadap Musa
  choice: karena perkataan kalian
  alternative: karena kalian / oleh karena kalian
  rationale: Teks Ibrani secara eksplisit menyebut ‘perkataan kalian’. Terjemahan mempertahankannya dan tidak menyelesaikan ketegangan yang lebih luas mengenai tanggung jawab Musa dan Israel.
- issue: Peralihan dari sapaan jamak ke tunggal
  choice: kalian … Allahmu … kepadamu
  alternative: kalian … Allah kalian … kepada kalian
  rationale: Teks Ibrani beralih dari akhiran jamak pada ‘perkataan kalian’ ke akhiran tunggal pada ‘Allahmu’ dan ‘kepadamu’. Peralihan ini dipertahankan sebagai sapaan kepada umat secara kolektif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. ‘Ia’ dipakai untuk rujukan kepada Yahweh dalam narasi, sementara peralihan sapaan jamak ke tunggal dipertahankan sesuai teks Ibrani.
