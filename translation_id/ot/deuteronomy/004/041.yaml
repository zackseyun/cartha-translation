lexical_decisions:
- source_word: אָז
  choice: Kemudian
  rationale: Kata keterangan waktu ini melanjutkan urutan tindakan dalam narasi; “Kemudian” alami dan ringkas dalam bahasa Indonesia modern.
- source_word: יַבְדִּיל
  choice: mengkhususkan
  rationale: Bentuk Hifil dari בדל menyatakan tindakan memisahkan atau menetapkan sesuatu bagi tujuan tertentu. “Mengkhususkan” mencakup unsur pemisahan dan penetapan tanpa mendahului penjelasan ayat berikutnya.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: שָׁלֹשׁ עָרִים
  choice: tiga kota
  rationale: Padanan langsung dan alami untuk konstruksi bilangan dengan nomina.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: di seberang Sungai Yordan
  rationale: Ungkapan geografis Ibrani ini menunjuk wilayah di sisi lain Yordan. “Di seberang Sungai Yordan” alami dalam bahasa Indonesia sambil mempertahankan perspektif spasial yang dapat bergantung pada sudut pandang narasi.
- source_word: מִזְרְחָה שָׁמֶשׁ
  choice: ke arah matahari terbit
  rationale: Mempertahankan gambaran konkret ungkapan Ibrani, yang secara idiomatis berarti ke arah timur.
