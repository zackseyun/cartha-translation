source:
  edition: WLC
  text: וְ/שָׁמַרְתָּ֞ אֶת חֻקָּ֣י/ו וְ/אֶת מִצְוֺתָ֗י/ו אֲשֶׁ֨ר אָנֹכִ֤י מְצַוְּ/ךָ֙ הַ/יּ֔וֹם אֲשֶׁר֙ יִיטַ֣ב לְ/ךָ֔ וּ/לְ/בָנֶ֖י/ךָ אַחֲרֶ֑י/ךָ וּ/לְמַ֨עַן תַּאֲרִ֤יךְ יָמִים֙ עַל הַ֣/אֲדָמָ֔ה אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֶ֛י/ךָ נֹתֵ֥ן לְ/ךָ֖ כָּל הַ/יָּמִֽים־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/040.yaml
  text: So you shall keep his statutes and his commandments that I am commanding you today[a], so that it may go well with you and with your children after you[c][b], and so that you may prolong your days on the land that Yahweh your God is giving you for all your days.
translation:
  language: id
  text: Maka, taatilah ketetapan-ketetapan-Nya dan perintah-perintah-Nya yang Kuperintahkan kepadamu hari ini, supaya segala sesuatunya berjalan baik bagimu dan bagi anak-anakmu sesudahmu[a], dan supaya engkau hidup lama di tanah[b] yang Yahweh, Allahmu, sedang berikan kepadamu selama hidupmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “supaya keadaanmu baik, demikian juga keadaan anak-anakmu sesudahmu.” Ungkapan Ibrani ini menyatakan bahwa segala sesuatunya akan berjalan baik.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di atas tanah.” Dalam konteks ini, “tanah” adalah wilayah yang diberikan Allah kepada Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: Karena itu, taatilah
  rationale: Dalam konteks perjanjian, שׁמר berarti menaati atau mematuhi, bukan sekadar menjaga. Bentuk ini menyampaikan daya perintah dalam konteks, sedangkan “Karena itu” menghubungkannya dengan alasan pada ayat sebelumnya.
- source_word: חֻקָּיו וְאֶת מִצְוֺתָיו
  choice: ketetapan-ketetapan-Nya dan perintah-perintah-Nya
  rationale: Pilihan ini mempertahankan pembedaan antara חֻקִּים sebagai ketetapan yang ditetapkan dan מִצְוֹת sebagai perintah.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: yang kusampaikan kepadamu hari ini
  rationale: “Kusampaikan” membuat pengulangan dengan nomina “perintah-perintah” lebih wajar dalam bahasa Indonesia, sambil tetap menyatakan bahwa Musa sedang memberikan perintah itu pada hari tersebut.
- source_word: אֲשֶׁר יִיטַב לְךָ
  choice: supaya keadaanmu baik
  rationale: Ungkapan ייטב לְ menunjuk pada keadaan atau kehidupan yang berjalan baik; ungkapan Indonesia ini alami dan tidak mempersempitnya hanya pada kemakmuran materi.
- source_word: וּלְבָנֶיךָ אַחֲרֶיךָ
  choice: demikian juga keadaan anak-anakmu sesudah kamu
  rationale: בָּנִים dapat berarti anak laki-laki, anak-anak, atau keturunan. “Anak-anakmu” mempertahankan gambaran hubungan antargenerasi tanpa membatasinya pada laki-laki.
- source_word: וּלְמַעַן תַּאֲרִיךְ יָמִים
  choice: dan supaya panjang umurmu
  rationale: Ini adalah padanan Indonesia yang alami bagi idiom kausatif “memanjangkan hari-hari,” sekaligus mempertahankan makna hidup lama.
- source_word: עַל הָאֲדָמָה
  choice: di tanah
  rationale: אֲדָמָה di sini adalah tanah yang diberikan Allah sebagai tempat hidup Israel. Bahasa Indonesia lazim memakai “di” untuk lokasi, walaupun עַל secara harfiah berarti “di atas.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: נֹתֵן לְךָ
  choice: berikan kepadamu
  rationale: Partisip Ibrani dapat menyatakan tindakan yang sedang berlaku atau pemberian yang dipastikan. Bentuk kini bahasa Indonesia ini alami dalam klausa relatif.
- source_word: כָּל הַיָּמִים
  choice: sepanjang umurmu
  rationale: Secara harfiah frasa ini berarti “sepanjang hari-hari”; dalam konteks janji umur panjang, pilihan ini menyatakan durasi seluruh kehidupan secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi. “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Cakupan janji bahwa keadaan akan baik
  choice: keadaanmu baik, demikian juga keadaan anak-anakmu
  alternative: kamu dan anak-anakmu akan makmur
  rationale: Teks menjanjikan keadaan yang baik tanpa menentukan bahwa hal itu semata-mata berupa kemakmuran materi.
- issue: Durasi כָּל הַיָּמִים
  choice: sepanjang umurmu
  alternative: sepanjang masa
  rationale: Dalam kaitannya dengan panjang umur orang yang disapa, pilihan ini wajar dan dekat dengan pengertian “selama seluruh hari hidupmu,” tanpa mengubah janji menjadi pernyataan eksplisit tentang kepemilikan tanah yang kekal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada perjanjian yang khidmat namun mudah dipahami. “Taatilah” dipilih daripada “peliharalah” agar makna ketaatan konkret jelas. Bentuk sapaan tetap tunggal sesuai teks Ibrani. Kapitalisasi pronomina “-Nya” mengikuti kebiasaan hormat dalam penerbitan Alkitab Indonesia.
