id: DEU.4.9
reference: Deuteronomy 4:9
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: רַ֡ק הִשָּׁ֣מֶר לְ/ךָ֩ וּ/שְׁמֹ֨ר נַפְשְׁ/ךָ֜ מְאֹ֗ד פֶּן תִּשְׁכַּ֨ח אֶת הַ/דְּבָרִ֜ים אֲשֶׁר רָא֣וּ עֵינֶ֗י/ךָ וּ/פֶן יָס֨וּרוּ֙ מִ/לְּבָ֣בְ/ךָ֔ כֹּ֖ל יְמֵ֣י חַיֶּ֑י/ךָ וְ/הוֹדַעְתָּ֥/ם לְ/בָנֶ֖י/ךָ וְ/לִ/בְנֵ֥י בָנֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/009.yaml
  text: Only guard yourself carefully[a], and keep your soul very carefully, lest you forget the things that your eyes saw and lest they depart from your heart all the days of your life. Make them known to your children and to your children's children[b],
translation:
  language: id
  text: Namun, waspadalah dan jagalah dirimu dengan sungguh-sungguh, supaya jangan sampai engkau melupakan hal-hal yang telah dilihat oleh matamu dan supaya semua itu jangan lenyap dari hatimu[a] sepanjang hidupmu. Beritahukanlah semuanya itu kepada anak-anakmu dan kepada cucu-cucumu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, “hati” sering menunjuk kepada batin manusia, termasuk ingatan, pengertian, dan kehendak.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “anak-anakmu dan anak-anak dari anak-anakmu.” Istilah maskulin jamak dalam bahasa Ibrani dapat menunjuk secara khusus kepada anak laki-laki atau secara lebih luas kepada anak-anak dan keturunan, sesuai konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Hanya
  rationale: Menandai pembatasan sekaligus penekanan yang kuat tanpa menambahkan hubungan logis yang tidak dinyatakan secara eksplisit.
- source_word: הִשָּׁמֶר לְךָ
  choice: waspadalah
  rationale: Ungkapan dengan imperatif nifal menyuruh seseorang mengawasi dirinya sendiri; 'waspadalah' alami dalam bahasa Indonesia dan mempertahankan daya peringatannya.
- source_word: וּשְׁמֹר נַפְשְׁךָ מְאֹד
  choice: dan jagalah dirimu dengan sungguh-sungguh
  rationale: נֶפֶשׁ dalam konteks ini menunjuk kepada diri atau pribadi seutuhnya, bukan secara sempit kepada jiwa sebagai unsur tak berjasmani. Pengulangan akar שׁמר dipertahankan melalui pasangan 'waspadalah' dan 'jagalah'.
- source_word: פֶּן תִּשְׁכַּח
  choice: supaya jangan sampai engkau melupakan
  rationale: Menyampaikan peringatan negatif atau akibat yang harus dicegah dengan ungkapan Indonesia yang alami dan tegas.
- source_word: הַדְּבָרִים אֲשֶׁר רָאוּ עֵינֶיךָ
  choice: hal-hal yang telah dilihat oleh matamu
  rationale: דְּבָרִים berarti kata-kata, perkara, atau hal-hal; klausa tentang mata menunjukkan bahwa pengalaman atau peristiwa yang terlihatlah yang dimaksud. Bentuk ini mempertahankan penekanan Ibrani pada kesaksian langsung.
- source_word: וּפֶן יָסוּרוּ מִלְּבָבְךָ
  choice: dan supaya semua itu jangan lenyap dari hatimu
  rationale: Mempertahankan metafora 'hati' dan gagasan bahwa hal-hal itu dapat beranjak atau hilang dari batin, sambil menggunakan ungkapan Indonesia yang jelas.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: sepanjang hidupmu
  rationale: Padanan Indonesia yang alami bagi idiom harfiah 'segenap hari-hari hidupmu'.
- source_word: וְהוֹדַעְתָּם
  choice: Beritahukanlah semuanya itu
  rationale: Bentuk hifil dari ידע berarti membuat diketahui atau memberitahukan. Pilihan ini lebih tepat daripada secara langsung menafsirkannya sebagai 'ajarkanlah'.
- source_word: לְבָנֶיךָ וְלִבְנֵי בָנֶיךָ
  choice: kepada anak-anakmu dan kepada cucu-cucumu
  rationale: בָּנִים dapat menunjuk kepada anak atau keturunan secara representatif. 'Cucu-cucumu' menyampaikan secara alami ungkapan harfiah 'anak-anak dari anak-anakmu'.
theological_decisions:
- issue: Makna antropologis נֶפֶשׁ
  choice: dirimu
  alternative: jiwamu
  rationale: Dalam peringatan ini, נֶפֶשׁ menunjuk kepada pribadi secara utuh. 'Jiwamu' dapat menyiratkan dikotomi tubuh-jiwa yang tidak sedang ditegaskan oleh ayat ini.
- issue: Cakupan gender בָנֶיךָ
  choice: anak-anakmu
  alternative: anak-anak lelakimu
  rationale: Walaupun bentuk Ibraninya maskulin, konteks pewarisan ingatan perjanjian antargenerasi memungkinkan arti umum 'anak-anak' atau 'keturunan', bukan pembatasan hanya kepada anak laki-laki.
- issue: Makna לֵבָב dalam konteks ini
  choice: hati, dengan catatan bahwa yang dimaksud mencakup batin, ingatan, pengertian, dan kehendak
  alternative: pikiran
  rationale: Menerjemahkan sebagai 'hati' mempertahankan metafora dan antropologi Ibrani; menggantinya dengan 'pikiran' akan mempersempit cakupannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada peringatan yang khidmat. Pronomina tunggal 'engkau' dipertahankan karena semua bentuk orang kedua dalam teks Ibrani berbentuk tunggal. Susunan kalimat dibuat alami tanpa menghilangkan pengulangan perintah untuk berjaga-jaga.
