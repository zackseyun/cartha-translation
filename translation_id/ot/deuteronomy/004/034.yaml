    rationale: ‘Datang’ menetapkan arah menuju pusat deiktis yang tidak eksplisit dalam Ibrani. Dalam konteks tindakan memasuki/bertindak di Mesir, ‘pergi untuk mengambil’ lebih netral dan sejalan dengan audit bahasa Inggris.
  - severity: medium
    issue: ‘lengan yang teracung’ untuk זְרוֹעַ נְטוּיָה
    rationale: ‘Teracung’ lazimnya berarti diangkat atau diarahkan ke atas. נְטוּיָה dalam ungkapan keluaran menunjuk lengan yang diulurkan/terentang.
  - severity: low
    issue: ‘tindakan-tindakan besar yang menimbulkan kengerian’ terlalu eksplisit
    rationale: מוֹרָאִים dapat menunjuk pada hal-hal atau tindakan yang mengilhami takut dan kagum; formulasi draft membatasi rujukan pada ‘tindakan’ dan menekankan kengerian. Istilah yang lebih ringkas dengan catatan alternatif lebih menjaga keluasan makna.
