revisions:
- from: Atau, pernahkah ada ilah yang mencoba datang untuk mengambil bagi diri-Nya suatu bangsa dari tengah-tengah bangsa lain, dengan ujian-ujian, tanda-tanda, mukjizat-mukjizat, peperangan, tangan yang kuat, lengan yang teracung, dan tindakan-tindakan besar yang menimbulkan kengerian[a]—seperti semua yang telah Yahweh, Allah kalian, lakukan bagi kalian di Mesir, di depan mata kalian[b]?
  to: Atau, pernahkah suatu ilah berupaya pergi untuk mengambil bagi dirinya suatu bangsa dari tengah-tengah bangsa lain, dengan ujian-ujian, tanda-tanda, mukjizat-mukjizat, peperangan, tangan yang kuat, lengan yang terentang, dan kedahsyatan-kedahsyatan besar[a]—seperti semua yang Yahweh, Allah kalian, telah lakukan bagi kalian di Mesir di depan mata kalian[b]?
  rationale: Revisi mengganti arah gerak yang terlalu deiktis, memperbaiki metafora ‘lengan yang terentang’, dan memakai ungkapan yang lebih terbuka bagi מוֹרָאִים גְּדֹלִים. Catatan kaki a dan b tetap berjangkar pada unsur yang relevan dan mempertahankan alternatif leksikal serta perubahan jumlah dalam teks sumber.
