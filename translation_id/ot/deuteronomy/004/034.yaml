  text: א֣וֹ הֲ/נִסָּ֣ה אֱלֹהִ֗ים לָ֠/בוֹא לָ/קַ֨חַת ל֣/וֹ גוֹי֮ מִ/קֶּ֣רֶב גּוֹי֒ בְּ/מַסֹּת֩ בְּ/אֹתֹ֨ת וּ/בְ/מוֹפְתִ֜ים וּ/בְ/מִלְחָמָ֗ה וּ/בְ/יָ֤ד חֲזָקָה֙ וּ/בִ/זְר֣וֹעַ נְטוּיָ֔ה וּ/בְ/מוֹרָאִ֖ים גְּדֹלִ֑ים כְּ֠/כֹל אֲשֶׁר עָשָׂ֨ה לָ/כֶ֜ם יְהוָ֧ה אֱלֹהֵי/כֶ֛ם בְּ/מִצְרַ֖יִם לְ/עֵינֶֽי/ךָ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/034.yaml
  text: Or has any god ever attempted to go and take for himself a nation from the midst of another nation[a], by trials, by signs, and by wonders, and by war, and by a mighty hand, and by an outstretched arm, and by great terrors, according to all that Yahweh your God did for you in Egypt before your eyes?
translation:
  language: id
  text: Atau, pernahkah suatu ilah berupaya pergi untuk mengambil bagi dirinya suatu bangsa dari tengah-tengah bangsa lain, dengan ujian-ujian, tanda-tanda, mukjizat-mukjizat, peperangan, tangan yang kuat, lengan yang terentang, dan kedahsyatan-kedahsyatan besar[a]—seperti semua yang Yahweh, Allah kalian, telah lakukan bagi kalian di Mesir di depan mata kalian[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “perbuatan-perbuatan besar yang dahsyat” atau “hal-hal besar yang menggentarkan.” Ungkapan Ibrani menunjuk kepada hal atau tindakan yang menimbulkan takut dan takjub.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di depan matamu.” Setelah sebelumnya menyapa Israel dengan bentuk jamak, teks Ibrani di sini beralih ke bentuk tunggal dan memandang Israel sebagai satu kesatuan.
    reason: source_form
lexical_decisions:
- source_word: הֲנִסָּה
  choice: pernahkah ... mencoba
  rationale: Dalam konstruksi ini נסה berarti mencoba atau berupaya. Bentuk pertanyaan retoris menegaskan bahwa tindakan tersebut belum pernah dilakukan ilah mana pun, tanpa menyiratkan bahwa Yahweh mungkin gagal.
- source_word: אֱלֹהִים
  choice: ada ilah
  rationale: Nomina ini dipakai secara umum dalam perbandingan retoris dengan Yahweh. ‘Ilah’ mempertahankan acuan kepada dewa mana pun tanpa menyamakannya dengan Allah Israel.
- source_word: לָבוֹא לָקַחַת
  choice: datang untuk mengambil
  rationale: Rangkaian infinitif menyatakan gerak yang bertujuan, lalu tindakan mengambil. ‘Datang untuk mengambil’ dekat dengan bentuk Ibrani dan wajar dari sudut pandang umat yang didatangi dan dibebaskan.
- source_word: גּוֹי מִקֶּרֶב גּוֹי
  choice: suatu bangsa dari tengah-tengah bangsa lain
  rationale: Ungkapan ini mempertahankan gambaran mencolok tentang satu bangsa yang diambil dari dalam bangsa lain.
- source_word: בְּמַסֹּת
  choice: dengan ujian-ujian
  rationale: Bentuk jamak menunjuk kepada berbagai tindakan atau peristiwa pengujian dalam keluaran dari Mesir. ‘Ujian-ujian’ lebih tepat daripada ‘godaan-godaan’ dalam bahasa Indonesia modern.
- source_word: בְּאֹתֹת וּבְמוֹפְתִים
  choice: dengan ... tanda-tanda, mukjizat-mukjizat
  rationale: ‘Tanda-tanda’ menyampaikan fungsi penandanya, sedangkan ‘mukjizat-mukjizat’ menyampaikan sifat luar biasa dari מופתים dalam pasangan istilah ini.
- source_word: וּבְמִלְחָמָה
  choice: peperangan
  rationale: Nomina tunggal ini mempertahankan dimensi perang dalam pembebasan Israel dan kehancuran kekuatan Mesir.
- source_word: וּבְיָד חֲזָקָה
  choice: tangan yang kuat
  rationale: Terjemahan ini mempertahankan metafora keluaran yang tetap dan secara langsung mencerminkan חֲזָקָה.
- source_word: וּבִזְרוֹעַ נְטוּיָה
  choice: lengan yang teracung
  rationale: Ungkapan ini mempertahankan gambaran lengan yang dibentangkan untuk bertindak dengan kuasa. ‘Teracung’ alami dan kuat dalam bahasa Indonesia.
- source_word: וּבְמוֹרָאִים גְּדֹלִים
  choice: tindakan-tindakan besar yang menimbulkan kengerian
  rationale: מוֹרָאִים dapat menunjuk kepada hal atau tindakan yang menimbulkan takut dan gentar. Terjemahan ini menyatakan dampak tersebut tanpa mereduksinya menjadi perasaan batin saja.
- source_word: כְּכֹל אֲשֶׁר עָשָׂה
  choice: seperti semua yang telah ... lakukan
  rationale: Frasa ini menghubungkan pertanyaan retoris dengan keseluruhan tindakan Yahweh yang disaksikan Israel.
theological_decisions:
- issue: Acuan אֱלֹהִים dalam perbandingan retoris
  choice: ilah
  alternative: Allah
  rationale: Klausa pertama mempertanyakan apakah dewa mana pun pernah melakukan hal seperti Yahweh. ‘Ilah’ mempertahankan daya polemisnya dan tidak membuat pembaca mengira bahwa subjek klausa itu khusus Allah Israel.
- issue: Penerjemahan nama יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: ‘Yahweh’ menyajikan nama pribadi ilahi secara langsung dan membedakannya dari gelar ‘Allah’ yang menyusul.
- issue: Peralihan jumlah orang kedua pada akhir ayat
  choice: kalian ... mata kalian, dengan catatan bentuk harfiah
  alternative: kalian ... matamu
  rationale: Teks Ibrani mula-mula memakai bentuk jamak untuk ‘Allah kalian’ dan ‘bagi kalian’, lalu beralih ke bentuk tunggal ‘matamu’. Teks utama memakai bentuk jamak yang alami bagi pembaca Indonesia, sedangkan catatan kaki mempertahankan peralihan retoris kepada Israel sebagai satu kesatuan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan unsur ‘dengan’ dipadatkan menjadi satu rangkaian agar pertanyaan panjang tetap alami, sementara daftar sarana tindakan ilahi dan gambaran-gambaran utama teks Ibrani dipertahankan. Bentuk ‘kalian’ dipakai untuk menandai sapaan jamak secara jelas.
