base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/022.yaml
  text: For I am dying in this land[a]; I am not crossing the Jordan[b], but you are crossing over and will take possession of this good land.
translation:
  language: id
  text: Sebab aku akan mati di negeri ini[a]; aku tidak akan menyeberangi Sungai Yordan, tetapi kalian akan menyeberang dan akan memiliki[b] negeri yang baik ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “aku akan segera mati di negeri ini.” Bentuk partisip dalam bahasa Ibrani dapat menyatakan tindakan yang akan segera terjadi.
    reason: lexical_alternative
  - marker: b
    text: Atau, “mewarisi.” Kata Ibrani yang digunakan dapat berarti mengambil suatu negeri untuk dimiliki sebagai warisan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mempertahankan fungsi penjelas yang menghubungkan ayat ini dengan peringatan atau nasihat sebelumnya.
- source_word: אָנֹכִי
  choice: aku
  rationale: Pronomina mandiri memberi penekanan pada Musa; bentuk “aku” wajar dalam tuturan langsung dan kontras dengan “kalian”.
- source_word: מֵת
  choice: akan mati
  rationale: Partisip Ibrani di sini menunjuk pada kematian Musa yang sudah dekat. Bentuk ini lebih alami daripada “sedang mati” dalam bahasa Indonesia, sementara nuansa kesegeraannya dicatat dalam catatan kaki.
- source_word: בָּאָרֶץ הַזֹּאת
  choice: di negeri ini
  rationale: “Negeri” sesuai untuk wilayah tempat Musa berada dan mempertahankan penggunaan אֶרֶץ dalam konteks tanah perjanjian.
- source_word: אֵינֶנִּי עֹבֵר
  choice: aku tidak akan menyeberangi
  rationale: Konstruksi negatif dengan partisip menyatakan bahwa Musa tidak akan melakukan penyeberangan yang segera terjadi.
- source_word: אֶת הַיַּרְדֵּן
  choice: Sungai Yordan
  rationale: Penambahan “Sungai” membuat nama geografis ini langsung jelas bagi pembaca Indonesia modern.
- source_word: וְאַתֶּם עֹבְרִים
  choice: tetapi kalian akan menyeberang
  rationale: Kata penghubung menyatakan kontras antara nasib Musa dan umat Israel. “Kalian” membedakan bentuk jamak dari “engkau” tunggal.
- source_word: וִירִשְׁתֶּם
  choice: menduduki
  rationale: Dalam konteks tanah, ירשׁ menunjuk pada tindakan mengambil dan menguasai negeri sebagai milik; “menduduki” alami dan tidak menghilangkan nuansa kepemilikan, yang dijelaskan dalam catatan kaki.
- source_word: הָאָרֶץ הַטּוֹבָה הַזֹּאת
  choice: negeri yang baik ini
  rationale: Mempertahankan demonstratif dan penilaian umum טוֹב tanpa mempersempitnya menjadi hanya subur atau menyenangkan.
