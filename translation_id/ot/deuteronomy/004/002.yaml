  text: לֹ֣א תֹסִ֗פוּ עַל הַ/דָּבָר֙ אֲשֶׁ֤ר אָנֹכִי֙ מְצַוֶּ֣ה אֶתְ/כֶ֔ם וְ/לֹ֥א תִגְרְע֖וּ מִמֶּ֑/נּוּ לִ/שְׁמֹ֗ר אֶת מִצְוֺת֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁ֥ר אָנֹכִ֖י מְצַוֶּ֥ה אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/002.yaml
  text: You shall not add to the word that I am commanding you[a], nor shall you take away from it, so that you may keep the commandments of Yahweh your God that I am commanding you.
translation:
  language: id
  text: Janganlah kamu menambahkan pada apa yang kuperintahkan kepadamu dan janganlah kamu mengurangi darinya, supaya kamu menaati perintah-perintah Yahweh[a], Allahmu, yang kuperintahkan kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani YHWH, yang secara tradisional diterjemahkan “TUHAN”.
    reason: alternative_reading
lexical_decisions:
- source_word: תֹסִפוּ עַל
  choice: menambahkan apa pun pada
  rationale: Bentuk Hifil יסף dengan עַל berarti menambahkan sesuatu pada sesuatu yang sudah ada. Ungkapan ini alami dalam bahasa Indonesia dan menegaskan larangan menambah isi firman.
- source_word: הַדָּבָר
  choice: firman
  rationale: דבר dapat berarti perkataan, perkara, atau hal. Dalam konteks ini bentuk tunggalnya menunjuk secara kolektif kepada isi yang disampaikan Musa; “firman” mempertahankan nuansa perkataan yang berwibawa tanpa mempersempitnya menjadi satu perintah saja.
- source_word: מְצַוֶּה
  choice: kusampaikan
  rationale: Partisip Ibrani menggambarkan tindakan Musa yang sedang berlangsung dalam situasi tutur. “Kusampaikan” terdengar alami dan bermartabat dalam bahasa Indonesia, sementara konteks perintah tetap jelas dari bagian berikutnya.
- source_word: תִגְרְעוּ מִמֶּנּוּ
  choice: mengurangi apa pun darinya
  rationale: גרע berarti mengurangi atau mengambil sebagian. Pilihan ini membentuk pasangan lawan yang jelas dengan “menambahkan” dan mempertahankan rujukan tunggal pada firman.
- source_word: לִשְׁמֹר
  choice: supaya kamu menaati
  rationale: Infinitif dengan ל menyatakan tujuan atau hasil. Dalam konteks perintah ilahi, שמר tidak sekadar menyimpan, tetapi menjaga dengan melaksanakannya; “menaati” menyampaikan fungsi itu secara alami.
- source_word: מִצְוֺת
  choice: perintah-perintah
  rationale: Bentuk jamak מצות menunjuk kepada ketetapan-ketetapan perjanjian. “Perintah-perintah” jelas, wajar, dan mempertahankan bentuk jamaknya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks sumber dipertahankan, bukan diganti dengan gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Dalam formula perjanjian bersama יהוה, אֱלֹהִים bermakna tunggal. Bentuk “Allahmu” secara alami mewakili sufiks orang kedua jamak sebagai kepunyaan kolektif umat yang disapa.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani secara langsung memakai Tetragramaton. “Yahweh” mempertahankan nama pribadi itu, sedangkan “TUHAN” merupakan penggantian tradisional dengan gelar; catatan kaki memberi pembaca informasi tentang tradisi tersebut.
- issue: Hubungan tujuan pada לִשְׁמֹר
  choice: supaya kamu menaati
  alternative: untuk menaati
  rationale: Konstruksi tersebut dapat menyatakan tujuan atau hasil. “Supaya” mempertahankan hubungan itu tanpa menentukan secara berlebihan apakah nuansanya semata-mata tujuan atau juga akibat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan orang kedua jamak Ibrani diterjemahkan dengan “kamu”, bentuk yang tidak menandai jumlah dalam bahasa Indonesia; konteks menunjukkan bahwa seluruh umat disapa. Partikel “apa pun” dipakai untuk membuat cakupan larangan eksplisit secara alami tanpa mengubah maksud teks. Penanda catatan kaki ditempatkan sesudah penyebutan klausa yang memuat nama Yahweh.
