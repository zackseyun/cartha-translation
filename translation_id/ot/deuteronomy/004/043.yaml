  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֶת בֶּ֧צֶר בַּ/מִּדְבָּ֛ר בְּ/אֶ֥רֶץ הַ/מִּישֹׁ֖ר לָ/רֻֽאוּבֵנִ֑י וְ/אֶת רָאמֹ֤ת בַּ/גִּלְעָד֙ לַ/גָּדִ֔י וְ/אֶת גּוֹלָ֥ן בַּ/בָּשָׁ֖ן לַֽ/מְנַשִּֽׁי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/043.yaml
  text: Bezer in the wilderness[a], in the land of the tableland, for the Reubenite; and Ramoth in Gilead for the Gadite; and Golan in Bashan for the Manassite.
translation:
  language: id
  text: Bezer di padang belantara[a], di daerah dataran tinggi, bagi suku Ruben; Ramot di Gilead bagi suku Gad; dan Golan di Basan bagi suku Manasye.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di padang gurun”. Istilah Ibrani dapat menunjuk pada kawasan liar atau stepa terbuka, bukan hanya gurun pasir.
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּצֶר
  choice: Bezer
  rationale: Nama tempat ditransliterasikan dalam bentuk yang lazim dalam bahasa Indonesia.
- source_word: בַּמִּדְבָּר
  choice: di padang belantara
  rationale: מִדְבָּר menunjuk pada kawasan liar atau stepa terbuka; 'padang belantara' alami dalam bahasa Indonesia dan tidak mengharuskan gambaran gurun pasir.
- source_word: בְּאֶרֶץ הַמִּישֹׁר
  choice: di daerah dataran tinggi
  rationale: מִישֹׁר berarti tanah rata atau kawasan plato; dalam konteks wilayah timur Yordan, 'dataran tinggi' menyampaikan keadaan geografisnya lebih tepat daripada sekadar 'dataran'.
- source_word: לָרֻאוּבֵנִי
  choice: bagi suku Ruben
  rationale: Bentuk nisbah tunggal Ibrani dipakai secara kolektif untuk kelompok kesukuan; ungkapan ini paling jelas dan alami bagi pembaca Indonesia.
- source_word: רָאמֹת
  choice: Ramot
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam tradisi penamaan Alkitab bahasa Indonesia.
- source_word: בַּגִּלְעָד
  choice: di Gilead
  rationale: Nama wilayah ditransliterasikan tanpa menerjemahkan artikel Ibrani secara tersendiri.
- source_word: לַגָּדִי
  choice: bagi suku Gad
  rationale: Nisbah tunggal dipahami secara kolektif sebagai penanda suku, sejajar dengan Ruben dan Manasye.
- source_word: גּוֹלָן
  choice: Golan
  rationale: Nama tempat ditransliterasikan.
- source_word: בַּבָּשָׁן
  choice: di Basan
  rationale: Nama wilayah ditransliterasikan dalam bentuk Indonesia yang lazim.
- source_word: לַמְנַשִּׁי
  choice: bagi suku Manasye
  rationale: Nisbah tunggal Ibrani dipahami secara kolektif; 'suku Manasye' menjaga kesejajaran ketiga bagian ayat.
- source_word: אֶת ... וְאֶת ... וְאֶת
  choice: daftar langsung dengan tanda titik koma dan kata 'dan'
  rationale: Penanda objek langsung אֶת tidak memiliki padanan leksikal dalam bahasa Indonesia; susunan koordinatifnya dicerminkan melalui daftar tiga kota.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur tiga bagian dipertahankan, sementara bentuk nisbah tunggal Ibrani diterjemahkan secara kolektif sebagai 'suku' agar jelas dan alami.
