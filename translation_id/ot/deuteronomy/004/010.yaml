id: DEU.4.10
reference: Deuteronomy 4:10
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: י֗וֹם אֲשֶׁ֨ר עָמַ֜דְתָּ לִ/פְנֵ֨י יְהוָ֣ה אֱלֹהֶי/ךָ֮ בְּ/חֹרֵב֒ בֶּ/אֱמֹ֨ר יְהוָ֜ה אֵלַ֗/י הַקְהֶל לִ/י֙ אֶת הָ/עָ֔ם וְ/אַשְׁמִעֵ֖/ם אֶת דְּבָרָ֑/י אֲשֶׁ֨ר יִלְמְד֜וּ/ן לְ/יִרְאָ֣ה אֹתִ֗/י כָּל הַ/יָּמִים֙ אֲשֶׁ֨ר הֵ֤ם חַיִּים֙ עַל הָ֣/אֲדָמָ֔ה וְ/אֶת בְּנֵי/הֶ֖ם יְלַמֵּדֽוּ/ן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/010.yaml
  text: the day when you stood before Yahweh your God at Horeb[a], when Yahweh said to me, ‘Assemble the people to me, and I will let them hear my words, so that they may learn to fear me all the days that they live on the earth, and that they may teach their children.’
translation:
  language: id
  text: hari ketika kamu berdiri di hadapan Yahweh, Allahmu, di Horeb, saat Yahweh berfirman kepadaku, “Kumpulkanlah umat itu kepada-Ku, dan Aku akan memperdengarkan kepada mereka perkataan-Ku, supaya mereka belajar takut kepada-Ku sepanjang hidup mereka di atas bumi[a] dan mengajar anak-anak mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tanah.” Kata Ibrani אֲדָמָה dapat merujuk kepada bumi atau tanah secara umum, atau kepada negeri tertentu.
    reason: lexical_alternative
lexical_decisions:
- source_word: י֗וֹם אֲשֶׁר
  choice: hari ketika
  rationale: Mempertahankan konstruksi relatif temporal Ibrani dan kaitannya dengan konteks ayat sebelumnya tanpa menambahkan kata kerja baru.
- source_word: עָמַדְתָּ לִפְנֵי
  choice: kamu berdiri di hadapan
  rationale: Mempertahankan gambaran konkret tentang Israel yang berdiri di hadapan Allah dalam peristiwa perjanjian.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH sebagai nama pribadi, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk posesif yang alami dalam bahasa Indonesia dan tetap menyatakan hubungan perjanjian.
- source_word: בְּחֹרֵב
  choice: di Horeb
  rationale: Preposisi lokasi yang wajar dalam bahasa Indonesia untuk nama tempat.
- source_word: הַקְהֶל לִי אֶת הָעָם
  choice: Kumpulkanlah bangsa itu kepada-Ku
  rationale: Bentuk perintah kausatif קהל diterjemahkan dengan kata kerja aktif yang alami; kepada-Ku mempertahankan לִי.
- source_word: וְאַשְׁמִעֵם
  choice: dan Aku akan memperdengarkan ... kepada mereka
  rationale: Memperdengarkan menyampaikan bentuk kausatif dari שמע secara jelas dan alami.
- source_word: דְּבָרָי
  choice: firman-firman-Ku
  rationale: Mempertahankan bentuk jamak dan konteks perkataan ilahi; firman merupakan padanan Indonesia yang bermartabat bagi perkataan Allah.
- source_word: אֲשֶׁר יִלְמְדוּן לְיִרְאָה אֹתִי
  choice: supaya mereka belajar takut kepada-Ku
  rationale: Supaya menyatakan tujuan, sedangkan takut mempertahankan bobot serta ketegangan makna ירא yang mencakup rasa gentar, hormat, dan ketaatan.
- source_word: כָּל הַיָּמִים אֲשֶׁר הֵם חַיִּים
  choice: sepanjang hidup mereka
  rationale: Ungkapan Indonesia yang alami untuk idiom Ibrani tentang seluruh hari selama mereka hidup.
- source_word: עַל הָאֲדָמָה
  choice: di atas bumi
  rationale: אֲדָמָה dapat berarti bumi/tanah secara umum atau negeri tertentu. Bumi tidak mempersempit acuan secara prematur; alternatif dicatat dalam catatan kaki.
- source_word: וְאֶת בְּנֵיהֶם יְלַמֵּדוּן
  choice: dan mengajar anak-anak mereka
  rationale: Anak-anak menyampaikan keturunan tanpa membatasi secara tidak semestinya kepada anak laki-laki; susunan ini juga tidak menambahkan objek pengajaran yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; Yahweh mempertahankan nama perjanjian itu sebagai nama pribadi.
- issue: Makna ירא dalam konteks perjanjian
  choice: takut kepada-Ku
  alternative: menghormati-Ku
  rationale: Takut mempertahankan jangkauan teologis berupa kegentaran, rasa hormat, dan ketaatan, tanpa melunakkannya menjadi penghormatan saja.
- issue: Cakupan בָּנִים
  choice: anak-anak
  alternative: anak-anak lelaki
  rationale: Dalam konteks pewarisan pengajaran antargenerasi, bentuk maskulin Ibrani mengacu pada keturunan secara umum dan tidak harus terbatas pada laki-laki.
- issue: Acuan אֲדָמָה
  choice: bumi
  alternative: negeri
  rationale: Konteks memungkinkan pernyataan umum tentang masa hidup maupun acuan kepada negeri; teks utama memilih bumi dan mempertahankan alternatifnya dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Bentuk sapaan tunggal “kamu” dipertahankan karena teks Ibrani berbentuk tunggal kolektif. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti kelaziman penerbitan Alkitab bahasa Indonesia.
