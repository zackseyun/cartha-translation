  text: וַ/יִּֽירְשׁ֨וּ אֶת אַרְצ֜/וֹ וְ/אֶת אֶ֣רֶץ ע֣וֹג מֶֽלֶךְ הַ/בָּשָׁ֗ן שְׁנֵי֙ מַלְכֵ֣י הָֽ/אֱמֹרִ֔י אֲשֶׁ֖ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן מִזְרַ֖ח שָֽׁמֶשׁ־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/047.yaml
  text: and they took possession of his land[a], and the land of Og king of Bashan—the two kings of the Amorites who were beyond the Jordan[b], toward the sunrise.
translation:
  language: id
  text: dan mereka mengambil alih negerinya dan negeri Og, raja Basan—kedua raja orang Amori yang berada di seberang Sungai Yordan[a], ke arah matahari terbit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di sisi lain Sungai Yordan.” Ungkapan Ibrani ini merupakan ungkapan geografis baku; sudut pandangnya bergantung pada konteks narasi.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, ke arah timur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירְשׁוּ
  choice: mereka mengambil alih
  rationale: Dalam konteks penaklukan, ירשׁ berarti memperoleh dan menguasai suatu wilayah, sering kali dengan menyingkirkan penguasa sebelumnya. “Mengambil alih” menyampaikan perpindahan kekuasaan dan penguasaan wilayah secara wajar dalam bahasa Indonesia modern.
- source_word: אַרְצוֹ
  choice: negerinya
  rationale: Akhiran orang ketiga tunggal merujuk kepada Sihon dalam konteks sebelumnya. “Negerinya” cocok untuk wilayah kekuasaan seorang raja dan mempertahankan rujukan pronominal teks sumber.
- source_word: אֶרֶץ עוֹג מֶלֶךְ הַבָּשָׁן
  choice: negeri Og, raja Basan
  rationale: Rangkaian konstruksi Ibrani diterjemahkan secara langsung dan alami; “negeri” menandai wilayah politik yang dikuasai Og.
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: kedua raja orang Amori
  rationale: Ungkapan ini mengidentifikasi Sihon dan Og secara bersama-sama. Bentuk “raja orang Amori” dekat dengan konstruksi sumber dan mudah dipahami.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: di seberang Sungai Yordan
  rationale: Ini merupakan ungkapan geografis baku. “Di seberang” mempertahankan ketergantungan ungkapan tersebut pada sudut pandang naratif tanpa menentukan perspektif yang tidak dinyatakan.
- source_word: מִזְרַח שָׁמֶשׁ
  choice: ke arah matahari terbit
  rationale: Pilihan ini mempertahankan gambaran konkret dalam bahasa Ibrani sekaligus secara alami menunjukkan arah timur.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Negeri” dipilih daripada “tanah” karena konteksnya adalah wilayah kekuasaan para raja. Tanda pisah memperjelas bahwa Sihon dan Og adalah kedua raja orang Amori yang dimaksud.
