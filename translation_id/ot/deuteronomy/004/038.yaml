base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/038.yaml
  text: to drive out before you nations greater and mightier than you[a], to bring you in, to give you their land as an inheritance[b], as it is this day.
translation:
  language: id
  text: untuk menghalau dari hadapanmu bangsa-bangsa yang lebih besar dan lebih kuat daripada kamu[a], untuk membawa kamu masuk dan memberikan negeri mereka kepadamu sebagai milik pusaka, seperti yang nyata pada hari ini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk mengusir” atau “untuk membuat kamu mewarisi dengan menyingkirkan mereka.” Kata kerja Ibrani ini mencakup penyingkiran para penghuni sebelumnya agar pihak lain menerima negeri itu.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “seperti hari ini,” sebuah ungkapan yang berarti “seperti yang nyata hari ini” atau “seperti keadaannya hari ini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהוֹרִישׁ
  choice: untuk menghalau
  rationale: Dalam bentuk Hifil, ירשׁ di sini menyatakan penyingkiran para penghuni sebelumnya. Karena objeknya adalah bangsa-bangsa, “menghalau” menyampaikan tindakan mengusir dari negeri dengan jelas dan alami.
- source_word: גּוֹיִם
  choice: bangsa-bangsa
  rationale: Istilah ini menunjuk pada kelompok-kelompok bangsa dalam konteks geopolitik dan militer Ulangan.
- source_word: גְּדֹלִים וַעֲצֻמִים מִמְּךָ
  choice: yang lebih besar dan lebih kuat daripada kamu
  rationale: Frasa ini bersifat komparatif; ungkapan Indonesia ini menyampaikan keunggulan ukuran dan kekuatan bangsa-bangsa itu atas Israel.
- source_word: מִפָּנֶיךָ
  choice: dari hadapanmu
  rationale: Terjemahan ini mempertahankan gambaran spasial idiom Ibrani, yakni menyingkirkan mereka dari depan atau kehadiran Israel.
- source_word: לַהֲבִיאֲךָ
  choice: untuk membawa kamu masuk
  rationale: Bentuk kausatif בוא dalam konteks ini berarti membawa Israel masuk ke negeri tersebut; “masuk” dinyatakan agar maksudnya alami dalam bahasa Indonesia.
- source_word: לָתֶת לְךָ אֶת אַרְצָם
  choice: memberikan negeri mereka kepadamu
  rationale: Susunan ini menyampaikan secara langsung bahwa negeri itu adalah pemberian kepada Israel.
- source_word: נַחֲלָה
  choice: sebagai milik pusaka
  rationale: “Milik pusaka” mempertahankan gagasan tentang kepemilikan yang diterima sebagai warisan sekaligus cocok dengan terminologi tanah perjanjian dalam Ulangan.
- source_word: כַּיּוֹם הַזֶּה
  choice: seperti yang nyata pada hari ini
  rationale: Idiom ini menunjuk pada keadaan yang sedang terbukti atau dapat disaksikan pada saat itu. Terjemahan ini menyampaikan daya idiomatisnya tanpa memakai ungkapan Indonesia yang kaku.
theological_decisions:
- issue: Makna tanah perjanjian dalam נַחֲלָה
  choice: sebagai milik pusaka
  alternative: sebagai milik
  rationale: “Milik pusaka” mempertahankan nuansa tanah yang dianugerahkan dan diwariskan, sedangkan “milik” saja meratakan konsep penting dalam Ulangan.
- issue: Tahap penggenapan dalam כַּיּוֹם הַזֶּה
  choice: seperti yang nyata pada hari ini
  alternative: seperti pada hari ini
  rationale: Pilihan ini menyampaikan bahwa perkataan tersebut merujuk pada bukti yang sudah tampak pada masa itu, tanpa menyatakan bahwa seluruh perebutan negeri telah selesai.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina “kamu” dipertahankan karena sapaan Ibrani berbentuk tunggal kolektif kepada Israel. “Negeri” dipilih untuk אֶרֶץ dalam konteks wilayah bangsa-bangsa, sedangkan “milik pusaka” menjaga bobot istilah perjanjian tanpa menjadi teknis atau denominatif.
