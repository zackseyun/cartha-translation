  rationale: Revisi secara eksplisit mencerminkan tindakan menyeberang dalam teks Ibrani dan memilih 'memilikinya' sebagai padanan utama yang lebih luas bagi לְרִשְׁתָּהּ. Hubungan tujuan, istilah hukum, nama ilahi, dan pronomina tetap dipertahankan.
