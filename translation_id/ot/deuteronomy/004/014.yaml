  text: וְ/אֹתִ֞/י צִוָּ֤ה יְהוָה֙ בָּ/עֵ֣ת הַ/הִ֔וא לְ/לַמֵּ֣ד אֶתְ/כֶ֔ם חֻקִּ֖ים וּ/מִשְׁפָּטִ֑ים לַ/עֲשֹׂתְ/כֶ֣ם אֹתָ֔/ם בָּ/אָ֕רֶץ אֲשֶׁ֥ר אַתֶּ֛ם עֹבְרִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/014.yaml
  text: And at that time Yahweh commanded me to teach you statutes and judgments[b][a], so that you might do them in the land that you are crossing over to possess.
translation:
  language: id
  text: Pada waktu itu Yahweh memerintahkan aku untuk mengajarkan kepadamu ketetapan dan peraturan[a], supaya kamu melakukannya di negeri yang akan kamu masuki setelah menyeberang untuk memilikinya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketetapan dan keputusan hukum.”
    reason: lexical_alternative
  - marker: b
    text: Atau “untuk mewarisinya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama pribadi ilahi sebagaimana terdapat dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: צִוָּה
  choice: memerintahkan
  rationale: Menyampaikan kewibawaan perintah dalam konteks perjanjian dan hukum.
- source_word: לְלַמֵּד
  choice: untuk mengajarkan
  rationale: Menunjukkan penugasan kepada Musa untuk menyampaikan isi hukum kepada Israel.
- source_word: חֻקִּים וּמִשְׁפָּטִים
  choice: ketetapan dan peraturan
  rationale: Membedakan dua istilah hukum Ibrani secara wajar dalam bahasa Indonesia; 'ketetapan' menunjuk pada ketentuan yang ditetapkan dan 'peraturan' pada norma atau keputusan hukum.
- source_word: לַעֲשֹׂתְכֶם אֹתָם
  choice: supaya kamu melakukannya
  rationale: Mempertahankan ungkapan konkret 'melakukan' serta hubungan tujuan dalam konstruksi Ibrani.
- source_word: בָּאָרֶץ
  choice: di negeri
  rationale: Dalam konteks geografis masuknya Israel ke wilayah tertentu, 'negeri' terdengar alami dan tetap mempertahankan nuansa tanah perjanjian.
- source_word: עֹבְרִים שָׁמָּה
  choice: yang akan kamu masuki
  rationale: Partisip Ibrani menggambarkan penyeberangan yang segera terjadi; dalam bahasa Indonesia, 'masuki' menyampaikan gerak menuju negeri itu secara alami, sementara tindakan menyeberang tersirat oleh konteks.
- source_word: לְרִשְׁתָּהּ
  choice: untuk kamu duduki
  rationale: Menyampaikan pengambilan dan pemilikan negeri tanpa memaksakan hanya nuansa warisan; alternatif 'miliki sebagai pusaka' dicatat karena verba ini juga dapat membawa nuansa mewarisi.
- source_word: וְאֹתִי
  choice: Pada waktu itu ... memerintahkan aku
  rationale: Objek yang dikedepankan dalam bahasa Ibrani memberi sedikit penekanan pada Musa. Susunan Indonesia dibuat alami, dengan 'aku' tetap tampak sebagai penerima penugasan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Bentuk 'Yahweh' mempertahankan nama ilahi dalam teks sumber dan tidak menggantinya dengan gelar.
- issue: Nuansa לְרִשְׁתָּהּ sebagai menduduki atau mewarisi
  choice: untuk kamu duduki
  alternative: untuk kamu miliki sebagai pusaka
  rationale: Konteks langsung menekankan Israel memasuki dan mengambil tempat di negeri itu, tetapi kemungkinan nuansa negeri sebagai pemberian atau warisan tetap dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat mempertahankan hubungan perintah, pengajaran, dan pelaksanaan hukum, sambil menghindari ungkapan harfiah yang kaku. Pronomina tunggal 'aku' merujuk kepada Musa, sedangkan 'kamu' bersifat jamak sebagai Israel.
