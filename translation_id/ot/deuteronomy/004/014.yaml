    issue: Unsur penyeberangan dalam עֹבְרִים שָׁמָּה tidak dinyatakan.
    rationale: '''Masuki'' menyampaikan tujuan masuk, tetapi tidak secara cukup mencerminkan motif Deuteronomis ''menyeberang''. Menambahkan ''setelah menyeberang'' menjaga makna tanpa mengandaikan secara berlebihan sungai tertentu.'
  - severity: low
    issue: '''Duduki'' lebih sempit daripada לְרִשְׁתָּהּ.'
    rationale: Dalam bahasa Indonesia, 'menduduki' mudah menekankan penguasaan melalui pendudukan. 'Memilikinya' mempertahankan cakupan verba Ibrani, sementara alternatif 'mewarisinya' dapat dicatat dalam catatan kaki.
