id: DEU.4.37
reference: Deuteronomy 4:37
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/תַ֗חַת כִּ֤י אָהַב֙ אֶת אֲבֹתֶ֔י/ךָ וַ/יִּבְחַ֥ר בְּ/זַרְע֖/וֹ אַחֲרָ֑י/ו וַ/יּוֹצִֽאֲ/ךָ֧ בְּ/פָנָ֛י/ו בְּ/כֹח֥/וֹ הַ/גָּדֹ֖ל מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/037.yaml
  text: And because he loved your fathers and chose their offspring after them[a], he brought you out of Egypt by his presence[b], by his great power.
translation:
  language: id
  text: Dan karena Ia mengasihi nenek moyangmu dan memilih keturunan mereka sesudah mereka[a], Ia membawa engkau keluar dari Mesir dengan kehadiran-Nya[b], dengan kuasa-Nya yang besar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “keturunannya sesudahnya.” Bahasa Ibrani memakai akhiran tunggal, tampaknya dengan memandang “nenek moyangmu” sebagai satu kelompok.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dengan wajah-Nya” atau “di hadapan-Nya”; di sini ungkapan itu menyatakan kehadiran Allah sendiri ketika Ia membawa Israel keluar.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתַחַת כִּי
  choice: Dan karena
  rationale: Ungkapan ini menyatakan alasan bagi pernyataan sebelumnya; pilihan ini alami dalam bahasa Indonesia dan mempertahankan daya kausalnya.
- source_word: אָהַב
  choice: mengasihi
  rationale: Kata kerja ini secara langsung berarti mengasihi; bentuk ini sesuai dengan ragam Alkitab Indonesia yang modern dan bermartabat.
- source_word: אֲבֹתֶיךָ
  choice: nenek moyangmu
  rationale: Yang dimaksud ialah para leluhur Israel. 'Nenek moyangmu' menyampaikan rujukan leluhur dengan alami, tanpa membatasi maknanya pada ayah biologis.
- source_word: וַיִּבְחַר
  choice: memilih
  rationale: Ini padanan langsung dan jelas yang tidak memasukkan istilah teologis teknis tambahan.
- source_word: בְּזַרְעוֹ אַחֲרָיו
  choice: keturunan mereka sesudah mereka
  rationale: Teks Ibrani memakai akhiran tunggal, tetapi acuannya ialah 'nenek moyangmu' sebagai kelompok kolektif. Bentuk jamak alami dalam bahasa Indonesia, sedangkan catatan kaki mempertahankan bentuk harfiahnya.
- source_word: וַיּוֹצִאֲךָ
  choice: Ia membawa engkau keluar
  rationale: Bentuk kausatif יצא berarti menyebabkan keluar atau membawa keluar, dan merupakan ungkapan khas keluaran dari Mesir. 'Engkau' mempertahankan sapaan orang kedua tunggal kepada Israel sebagai umat kolektif.
- source_word: בְּפָנָיו
  choice: dengan kehadiran-Nya
  rationale: Secara harfiah berarti 'dengan/oleh wajah-Nya' atau 'di hadapan-Nya'; dalam konteks ini ungkapan tersebut menyampaikan kehadiran Allah sendiri dalam pembebasan Israel.
- source_word: בְּכֹחוֹ הַגָּדֹל
  choice: dengan kuasa-Nya yang besar
  rationale: Padanan ini mempertahankan makna instrumental preposisi serta arti langsung כח sebagai kuasa atau kekuatan.
- source_word: מִמִּצְרַיִם
  choice: keluar dari Mesir
  rationale: Bersama verba 'membawa keluar', susunan ini merupakan ungkapan Indonesia yang alami dan mempertahankan gambaran eksodus.
theological_decisions:
- issue: Akhiran tunggal kolektif dalam 'keturunannya sesudahnya'
  choice: keturunan mereka sesudah mereka
  alternative: keturunannya sesudahnya
  rationale: Bentuk Ibrani memang tunggal, tetapi mengikuti 'nenek moyangmu' yang berfungsi sebagai kelompok kolektif. Bentuk jamak memperjelas acuan dalam bahasa Indonesia tanpa meniadakan bentuk sumber, yang dicatat dalam catatan kaki.
- issue: Makna בְּפָנָיו
  choice: dengan kehadiran-Nya
  alternative: di hadapan-Nya; dengan wajah-Nya sendiri
  rationale: Pilihan ini mempertahankan gagasan bahwa Allah sendiri hadir dalam tindakan membawa Israel keluar, sambil menghindari ungkapan harfiah yang kabur dalam bahasa Indonesia. Ambiguitas harfiahnya tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam bermartabat. Sapaan 'engkau' dipertahankan karena teks Ibrani menyapa Israel secara kolektif dalam bentuk tunggal. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia.
