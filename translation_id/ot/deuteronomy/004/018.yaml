  text: the form of any creeping thing on the ground[b][a], the form of any fish that is in the waters under the earth.
translation:
  language: id
  text: rupa segala binatang melata di tanah, rupa segala ikan yang ada di dalam air di bawah bumi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “di bawah bumi” menggemakan rumusan Alkitab tentang air yang berada di bawah daratan; bandingkan larangan mengenai gambaran dalam Keluaran 20:4.
    reason: cross_reference
lexical_decisions:
- source_word: תַּבְנִית
  choice: rupa
  rationale: Dalam konteks larangan membuat representasi untuk penyembahan, kata ini menunjuk pada rupa atau bentuk yang tampak. “Rupa” alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi patung atau berhala.
- source_word: כָּל
  choice: segala
  rationale: “Segala” menyampaikan cakupan menyeluruh pada kedua golongan makhluk dan sesuai dengan gaya penggolongan dalam konteks.
- source_word: רֹמֵשׂ
  choice: binatang melata yang bergerak
  rationale: Partisip dari רמשׂ menunjuk pada makhluk yang bergerak dekat permukaan tanah. Frasa ini mempertahankan kategori “binatang melata” sambil menghindari kesan bahwa yang dimaksud hanya hewan yang merayap tanpa kaki.
- source_word: בָּאֲדָמָה
  choice: di tanah
  rationale: אֲדָמָה di sini adalah tanah atau daratan tempat makhluk tersebut bergerak; “di tanah” ringkas dan wajar dalam bahasa Indonesia.
- source_word: דָּגָה
  choice: ikan
  rationale: Nomina ini bersifat kolektif dan menunjuk pada golongan ikan; “segala ikan” menyampaikan fungsi kolektif itu secara alami.
- source_word: אֲשֶׁר בַּמַּיִם
  choice: yang ada di dalam air
  rationale: Klausa relatif dipertahankan. Bahasa Indonesia lazim memakai “air” sebagai nomina massa meskipun bentuk Ibraninya secara morfologis plural.
- source_word: מִתַּחַת לָאָרֶץ
  choice: di bawah bumi
  rationale: Pilihan ini mempertahankan ungkapan kosmologis dan gema rumusan larangan membuat patung dalam Keluaran 20:4 tanpa menjelaskannya secara berlebihan.
theological_decisions:
- issue: Istilah bagi representasi dalam konteks penyembahan berhala
  choice: rupa segala...
  alternative: bentuk segala...; gambaran segala...
  rationale: “Rupa” mempertahankan rujukan kepada wujud atau representasi yang tampak tanpa memasukkan istilah “berhala” atau menentukan media tertentu yang tidak dinyatakan oleh ayat ini.
- issue: Ungkapan kosmologis מִתַּחַת לָאָרֶץ
  choice: di bawah bumi
  alternative: di bawah daratan; lebih rendah daripada bumi
  rationale: Terjemahan harfiah yang alami ini menjaga ketegangan dan citra ungkapan sumber serta kaitannya dengan rumusan Dekalog, tanpa menggantinya dengan penjelasan kosmologi modern.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur berulang “rupa segala...” mengikuti paralelisme teks Ibrani. Penanda catatan kaki ditempatkan sesudah ungkapan yang dijelaskan.
