id: DEU.4.49
reference: Deuteronomy 4:49
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/כָל הָ֨/עֲרָבָ֜ה עֵ֤בֶר הַ/יַּרְדֵּן֙ מִזְרָ֔חָ/ה וְ/עַ֖ד יָ֣ם הָ/עֲרָבָ֑ה תַּ֖חַת אַשְׁדֹּ֥ת הַ/פִּסְגָּֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/049.yaml
  text: and all the Arabah beyond the Jordan eastward[a], as far as the Sea of the Arabah, below the slopes of Pisgah.
translation:
  language: id
  text: dan seluruh Araba di seberang Sungai Yordan ke arah timur, sampai ke Laut Araba[a], di bawah lereng-lereng Pisga.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Perairan yang umumnya dikenal sebagai Laut Mati.
    reason: cross_reference
lexical_decisions:
- source_word: הָעֲרָבָה
  choice: Araba
  rationale: Dipertahankan sebagai nama geografis bagi kawasan lembah retakan Yordan, bukan diterjemahkan secara umum sebagai 'dataran'.
- source_word: עֵבֶר הַיַּרְדֵּן
  choice: di seberang Sungai Yordan
  rationale: Ungkapan geografis relasional ini diterjemahkan secara alami dalam bahasa Indonesia; 'Sungai' ditambahkan untuk memperjelas nama Yordan bagi pembaca umum.
- source_word: מִזְרָחָה
  choice: ke arah timur
  rationale: Menyampaikan fungsi adverbial penunjuk arah secara jelas dan alami.
- source_word: יָם הָעֲרָבָה
  choice: Laut Araba
  rationale: Mengikuti sebutan geografis Ibrani secara langsung dan tidak menggantinya dalam teks utama dengan nama konvensional yang lebih kemudian.
- source_word: תַּחַת
  choice: di bawah
  rationale: Paling sesuai untuk hubungan topografis yang dimaksud.
- source_word: אַשְׁדֹּת
  choice: lereng-lereng
  rationale: Dalam konteks geografis, bentuk jamak ini menunjuk pada lereng atau turunan pegunungan.
- source_word: הַפִּסְגָּה
  choice: Pisga
  rationale: Nama tempat ditransliterasikan dalam bentuk yang lazim dan mudah dibaca dalam bahasa Indonesia.
- source_word: וְכָל
  choice: dan seluruh
  rationale: Mempertahankan kata penghubung dan cakupan menyeluruh dari wilayah yang disebutkan.
theological_decisions: []
