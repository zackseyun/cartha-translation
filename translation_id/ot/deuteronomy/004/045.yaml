  text: Inilah peringatan, ketetapan, dan peraturan yang Musa sampaikan kepada orang Israel ketika mereka keluar dari Mesir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: Inilah
  rationale: Menandai secara deiktis kategori-kategori hukum yang diperkenalkan; bentuk ini alami untuk klausa nominal bahasa Ibrani tanpa kopula.
- source_word: הָעֵדֹת
  choice: peringatan-peringatan
  rationale: Dalam konteks hukum perjanjian, עֵדוֹת menunjuk pada ketentuan yang menjadi kesaksian atau peringatan mengikat; 'peringatan-peringatan' mempertahankan istilah yang lazim dan dapat dipahami tanpa menyamakannya dengan kategori hukum berikutnya.
- source_word: הַחֻקִּים
  choice: ketetapan-ketetapan
  rationale: Padanan baku dan wajar bagi חֻקִּים sebagai ketentuan yang ditetapkan.
- source_word: הַמִּשְׁפָּטִים
  choice: peraturan-peraturan
  rationale: Menyampaikan arti keputusan atau aturan hukum dengan bahasa Indonesia yang alami, sekaligus membedakannya dari חֻקִּים.
- source_word: אֲשֶׁר דִּבֶּר
  choice: yang disampaikan Musa
  rationale: דבר secara harfiah berarti 'berbicara'; dalam konteks penyampaian hukum, 'disampaikan' alami dan tidak menambahkan gagasan pengumuman resmi yang tidak dinyatakan.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Ungkapan harfiah 'anak-anak lelaki Israel' berfungsi sebagai sebutan kolektif bagi bangsa Israel; 'orang Israel' tepat, inklusif secara referensial, dan alami dalam bahasa Indonesia.
- source_word: בְּצֵאתָם
  choice: setelah mereka keluar
  rationale: Preposisi ב pada infinitif konstruk memberi latar waktu. Dalam konteks retrospektif ini, 'setelah mereka keluar' mengungkapkan bahwa penyampaian berlangsung sesudah eksodus, meski terjemahan lebih formalnya dapat berbunyi 'ketika mereka keluar'.
- source_word: מִמִּצְרָיִם
  choice: dari Mesir
  rationale: Padanan geografis yang langsung dan alami untuk penanda asal מן.
