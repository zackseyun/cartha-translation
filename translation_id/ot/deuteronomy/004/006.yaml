  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּם֮ וַ/עֲשִׂיתֶם֒ כִּ֣י הִ֤וא חָכְמַתְ/כֶם֙ וּ/בִ֣ינַתְ/כֶ֔ם לְ/עֵינֵ֖י הָ/עַמִּ֑ים אֲשֶׁ֣ר יִשְׁמְע֗וּ/ן אֵ֚ת כָּל הַ/חֻקִּ֣ים הָ/אֵ֔לֶּה וְ/אָמְר֗וּ רַ֚ק עַם חָכָ֣ם וְ/נָב֔וֹן הַ/גּ֥וֹי הַ/גָּד֖וֹל הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/006.yaml
  text: So keep them and do them[a], for this is your wisdom and your understanding in the sight of the peoples, who will hear all these statutes and say[b], ‘Surely this great nation is a wise and understanding people.’
translation:
  language: id
  text: Maka, peliharalah dan lakukanlah ketetapan-ketetapan itu, sebab itulah hikmat dan pengertianmu di mata bangsa-bangsa yang akan mendengar semua ketetapan ini[a] dan berkata, “Sungguh,[b] bangsa besar ini adalah bangsa yang bijaksana dan berpengertian.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Ketetapan-ketetapan” menerjemahkan חֻקִּים, istilah hukum yang juga dapat diterjemahkan “peraturan” atau “ketentuan”.
    reason: lexical_alternative
  - marker: b
    text: “Sungguh” menerjemahkan רַק, yang secara lebih harfiah dapat berarti “hanya”. Dalam konteks ini kata tersebut juga dapat berfungsi sebagai seruan penegas.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: peliharalah
  rationale: Dalam konteks hukum perjanjian, שׁמר berarti menaati dengan sungguh-sungguh atau memelihara perintah. “Peliharalah” mempertahankan nuansa penjagaan dan ketaatan, serta berpasangan alami dengan “lakukanlah”.
- source_word: וַעֲשִׂיתֶם
  choice: lakukanlah
  rationale: 'עשה menekankan pelaksanaan nyata. Pilihan ini mempertahankan pasangan ringkas Ibrani: memelihara dan melakukan.'
- source_word: כִּי הִוא
  choice: sebab itulah
  rationale: Pronomina feminin tunggal merujuk secara kolektif kepada tindakan memelihara dan melakukan ketetapan-ketetapan tersebut. “Itulah” menyampaikan rujukan kolektif itu tanpa memaksakan penjelasan tambahan.
- source_word: חָכְמַתְכֶם וּבִינַתְכֶם
  choice: hikmat dan pengertianmu
  rationale: 'Dua istilah yang berdekatan tetapi tidak identik dipertahankan: חכמה sebagai hikmat praktis-moral dan בינה sebagai pengertian atau daya memahami.'
- source_word: לְעֵינֵי הָעַמִּים
  choice: di mata bangsa-bangsa
  rationale: Ungkapan ini dekat dengan bentuk harfiah Ibrani dan alami dalam bahasa Indonesia, dengan penekanan pada penilaian publik bangsa-bangsa lain.
- source_word: הָעַמִּים
  choice: bangsa-bangsa
  rationale: “Bangsa-bangsa” merupakan padanan Indonesia yang wajar untuk kelompok-kelompok manusia di luar Israel. Perbedaan dengan גוי selanjutnya tetap tercermin melalui bentuk jamak dan tunggal.
- source_word: אֲשֶׁר יִשְׁמְעוּן
  choice: ketika mereka mendengar
  rationale: Walaupun bentuknya dapat diterjemahkan sebagai klausa relatif, dalam bahasa Indonesia klausa temporal ini mengungkapkan keadaan yang memicu tanggapan bangsa-bangsa dengan lebih alami.
- source_word: כָּל הַחֻקִּים הָאֵלֶּה
  choice: segala ketetapan ini
  rationale: חֻקִּים adalah istilah hukum bagi ketentuan yang ditetapkan. “Ketetapan” mempertahankan daya hukumnya dan lazim dalam ragam Alkitab Indonesia.
- source_word: רַק
  choice: Sungguh
  rationale: רַק secara dasar dapat berarti “hanya”, tetapi dalam seruan ini kemungkinan berfungsi sebagai penegasan kesimpulan. “Sungguh” menyampaikan daya serunya secara alami.
- source_word: עַם חָכָם וְנָבוֹן
  choice: bangsa yang bijaksana dan berpengertian
  rationale: “Bijaksana” dan “berpengertian” menggemakan pasangan “hikmat dan pengertian” sebelumnya tanpa meleburkan kedua gagasan.
theological_decisions:
- issue: Hubungan antara ketaatan dan hikmat
  choice: Tindakan memelihara dan melakukan ketetapan dipresentasikan sebagai hikmat dan pengertian Israel yang tampak di hadapan bangsa-bangsa.
  alternative: Ketetapan-ketetapan itu sendiri, terlepas dari pelaksanaannya, adalah hikmat dan pengertian Israel.
  rationale: Konteks sintaksis menghubungkan perintah “peliharalah dan lakukanlah” dengan “itulah hikmat dan pengertianmu”. Terjemahan mempertahankan hubungan tersebut tanpa menambahkan gagasan tentang jasa atau keunggulan bangsa secara mutlak.
- issue: Daya ujar רַק dalam penilaian bangsa-bangsa
  choice: Diterjemahkan sebagai seruan penegas “Sungguh”.
  alternative: Diterjemahkan secara lebih leksikal sebagai “Hanya bangsa yang besar ini ...”.
  rationale: Dalam konteks ucapan kagum, fungsi penegas lebih alami, tetapi arti dasar “hanya” tetap dicatat sebagai kemungkinan agar ambiguitas leksikal tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur dibuat lancar bagi pembaca umum, sementara pasangan istilah hukum dan hikmat serta ambiguitas רַק tetap dipertahankan melalui catatan kaki.
