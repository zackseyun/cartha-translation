revisions:
- from: Karena itu, peliharalah dan lakukanlah semuanya itu,[a] sebab itulah hikmat dan pengertianmu di mata bangsa-bangsa. Ketika mereka mendengar segala ketetapan ini,[b] mereka akan berkata, “Sungguh, bangsa yang besar ini adalah bangsa yang bijaksana dan berpengertian.”
  to: Maka, peliharalah dan lakukanlah ketetapan-ketetapan itu, sebab itulah hikmat dan pengertianmu di mata bangsa-bangsa yang akan mendengar semua ketetapan ini[a] dan berkata, “Sungguh,[b] bangsa besar ini adalah bangsa yang bijaksana dan berpengertian.”
  rationale: Revisi menghapus tambahan “semuanya” dari objek perintah, menyatakan objek tersirat secara wajar sebagai “ketetapan-ketetapan itu,” dan mempertahankan fungsi klausa relatif bagi bangsa-bangsa. Istilah utama serta kemungkinan makna leksikal רַק dipertahankan melalui catatan kaki yang berjangkar tepat.
