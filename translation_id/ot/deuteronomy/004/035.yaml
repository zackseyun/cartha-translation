  source_fidelity: Terjemahan dengan tepat mempertahankan bentuk pasif Hofal ('telah diperlihatkan'), tujuan ('supaya engkau tahu'), nama Yahweh, penegasan pronomina, dan pernyataan eksklusif. Namun, 'semua itu' menambahkan cakupan total yang tidak dinyatakan oleh Ibrani; konteks memang mengandaikan hal-hal/peristiwa yang telah disaksikan, tetapi bukan kuantifier 'semua'.
  naturalness: Bahasa draf pada umumnya baku dan jelas. Menempatkan objek tersirat di depan ('Hal-hal itu telah diperlihatkan kepadamu') lebih lancar dalam bahasa Indonesia daripada konstruksi awal yang memakai 'Kepadamu', sekaligus menghindari penambahan 'semua'.
  terminology: '''Yahweh'' konsisten dengan kebijakan nama ilahi yang diberikan. ''Allah'', ''Dialah'', dan ''selain Dia'' merupakan padanan yang alami dan mempertahankan register khidmat tanpa memperluas klaim teologis.'
  issues:
