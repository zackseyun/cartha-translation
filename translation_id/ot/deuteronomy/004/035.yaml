  rationale: Revisi hanya mengganti 'semua itu' dengan 'hal-hal itu' untuk menyatakan objek kontekstual yang tersirat tanpa menambahkan gagasan totalitas. Unsur pasif, maksud, penegasan Yahweh sebagai Allah, dan eksklusivitas tetap dipertahankan.
