source:
  edition: WLC
  text: אַתָּה֙ הָרְאֵ֣תָ לָ/דַ֔עַת כִּ֥י יְהוָ֖ה ה֣וּא הָ/אֱלֹהִ֑ים אֵ֥ין ע֖וֹד מִ/לְ/בַדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/035.yaml
  text: You were shown these things so that you might know that Yahweh[a], he is God[b]; there is no other besides him.
translation:
  language: id
  text: Hal-hal itu telah diperlihatkan kepadamu supaya engkau tahu bahwa Yahweh—Dialah Allah; tidak ada yang lain selain Dia.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרְאֵתָ
  choice: kepadamu telah diperlihatkan
  rationale: 'Bentuk Hofal dari ראה bersifat pasif-kausatif: orang yang disapa dibuat melihat atau diberi kesempatan menyaksikan, bukan sekadar melihat atas prakarsanya sendiri. Susunan ini mempertahankan bentuk pasif dan cocok dengan sapaan tunggal.'
- source_word: לָדַעַת
  choice: supaya engkau tahu
  rationale: Infinitif dengan ל menyatakan tujuan atau hasil; 'supaya engkau tahu' alami dalam bahasa Indonesia dan mempertahankan daya purposifnya.
- source_word: כִּי
  choice: bahwa
  rationale: כִּי di sini memperkenalkan isi pengetahuan, bukan alasan kausal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan agar nama pribadi dalam teks Ibrani tetap tampil, bukan diganti dengan gelar.
- source_word: הוּא
  choice: Dialah
  rationale: Pronomina mandiri הוּא memberi penegasan. Bentuk 'Dialah' menyampaikan penekanan itu secara alami tanpa menambahkan gagasan 'satu-satunya', yang dinyatakan oleh klausa berikutnya.
- source_word: הָאֱלֹהִים
  choice: Allah
  rationale: Dalam predikat identifikasi ini, 'Allah' merupakan padanan Indonesia yang alami; artikelnya tidak perlu diterjemahkan secara mekanis.
- source_word: אֵין עוֹד
  choice: tidak ada yang lain
  rationale: Ungkapan ini meniadakan keberadaan ilah lain dan menyampaikan klaim eksklusif secara jelas tanpa perluasan filosofis.
- source_word: מִלְבַדּוֹ
  choice: selain Dia
  rationale: Frasa preposisional ini menyatakan pengecualian; 'selain Dia' ringkas, idiomatis, dan langsung.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. 'Yahweh' mempertahankan nama itu, bukan menggantinya dengan gelar.
- issue: Kekuatan penegasan הוּא
  choice: Yahweh—Dialah Allah
  alternative: Yahweh adalah Allah
  rationale: Pronomina eksplisit memberi tekanan pada identifikasi Yahweh sebagai Allah. Tanda pisah dan 'Dialah' mempertahankan penegasan tanpa menafsirkannya berlebihan.
- issue: Klaim eksklusivitas
  choice: tidak ada yang lain selain Dia
  alternative: tidak ada siapa pun selain Dia; tidak ada lagi di samping-Nya
  rationale: Pilihan ini mempertahankan penyangkalan tegas terhadap ilah lain, tetapi tidak menambahkan uraian metafisis yang tidak dinyatakan oleh ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. 'Engkau' mempertahankan sapaan orang kedua tunggal; kapitalisasi 'Dia' mengikuti kebiasaan hormat dalam teks keagamaan Indonesia. 'Semua itu' memasok objek tersirat dari konteks tanpa mengubah pokok pernyataan.
