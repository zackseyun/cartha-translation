revisions:
- from: Sebab Yahweh, Allahmu, adalah Allah yang penuh belas kasihan.[a] Ia tidak akan meninggalkan engkau,[b] tidak akan membinasakan engkau, dan tidak akan melupakan perjanjian dengan nenek moyangmu[c] yang telah diikrarkan-Nya dengan sumpah kepada mereka.
  to: Sebab Yahweh, Allahmu, adalah Allah yang penuh belas kasihan.[a] Ia tidak akan meninggalkan engkau,[b] tidak akan membinasakan engkau, dan tidak akan melupakan perjanjian bapa-bapamu, yang telah diikrarkan-Nya dengan sumpah kepada mereka.[c]
  rationale: Revisi mengganti “perjanjian dengan nenek moyangmu” dengan “perjanjian bapa-bapamu” agar hubungan yang dinyatakan oleh konstruksi Ibrani tetap terlihat dan rujukan kepada para bapa perjanjian tidak digeneralisasi. Klausa tentang sumpah tetap menyatakan bahwa Yahweh bersumpah kepada mereka.
