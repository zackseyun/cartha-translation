  verdict: revise
  source_fidelity: Revisi diperlukan untuk memperjelas hubungan genitif dalam בְּרִית אֲבֹתֶיךָ. Frasa draf “perjanjian dengan nenek moyangmu” terutama dapat dipahami sebagai perjanjian yang dibuat bersama nenek moyang, sedangkan Ibrani menyebut “perjanjian bapa-bapamu” dan kemudian menyatakan bahwa Yahweh telah bersumpah kepada mereka. Revisi mempertahankan kedua unsur tersebut.
  naturalness: Teks pada umumnya baku dan alami. “Bapa-bapamu” mempunyai nuansa alkitabiah tetapi tetap dapat dipahami dalam register yang bermartabat; catatan kaki menjelaskan rujukan historisnya.
  terminology: “Yahweh,” “Allahmu,” “belas kasihan,” “membinasakan,” dan “melupakan perjanjian” sesuai dengan teks Ibrani dan penggunaan Indonesia modern. “Diikrarkan-Nya dengan sumpah” menyampaikan נשבע secara memadai.
  issues:
