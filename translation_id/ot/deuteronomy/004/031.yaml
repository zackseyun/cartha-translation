base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/031.yaml
  text: For Yahweh your God is a compassionate God[c][b][a]; he will not abandon you or destroy you or forget the covenant of your fathers that he swore to them.
translation:
  language: id
  text: Sebab Yahweh, Allahmu, adalah Allah yang penuh belas kasihan.[a] Ia tidak akan meninggalkan engkau,[b] tidak akan membinasakan engkau, dan tidak akan melupakan perjanjian bapa-bapamu, yang telah diikrarkan-Nya dengan sumpah kepada mereka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Allah yang penyayang.”
    reason: lexical_alternative
  - marker: b
    text: Atau “tidak akan melepaskan engkau.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “bapa-bapamu,” yang merujuk kepada para leluhur perjanjian Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mempertahankan fungsi penjelas yang memberikan dasar bagi nasihat dan peringatan sebelumnya.
- source_word: אֵל רַחוּם
  choice: Allah yang penuh belas kasihan
  rationale: רַחוּם menyatakan sifat berbelas kasih atau penyayang; ungkapan ini alami, jelas, dan bermartabat dalam bahasa Indonesia modern.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan sebuah gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Mempertahankan sapaan perjanjian dalam bentuk orang kedua tunggal.
- source_word: לֹא יַרְפְּךָ
  choice: Ia tidak akan meninggalkan engkau
  rationale: Bentuk Hifil dari רפה dalam konteks ini berarti melepaskan, membiarkan, atau meninggalkan; pilihan ini jelas dalam bahasa Indonesia modern.
- source_word: וְלֹא יַשְׁחִיתֶךָ
  choice: tidak akan membinasakan engkau
  rationale: שׁחת dalam bentuk Hifil di sini menyatakan tindakan membinasakan atau menghancurkan.
- source_word: וְלֹא יִשְׁכַּח אֶת בְּרִית
  choice: dan tidak akan melupakan perjanjian
  rationale: Mempertahankan gambaran teologis penting bahwa Allah tidak melupakan perjanjian-Nya.
- source_word: אֲבֹתֶיךָ
  choice: nenek moyangmu
  rationale: Dalam bahasa Indonesia, 'nenek moyang' merupakan padanan alami bagi para leluhur Israel dan tidak menghilangkan rujukan historis kepada para bapa perjanjian; kekhususannya dijelaskan dalam catatan kaki.
- source_word: אֲשֶׁר נִשְׁבַּע לָהֶם
  choice: yang telah diikrarkan-Nya dengan sumpah kepada mereka
  rationale: Menampilkan secara eksplisit unsur sumpah dalam נשבע sambil menghasilkan susunan Indonesia yang alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menggunakan nama perjanjian ilahi secara langsung; transliterasi mempertahankannya sebagai nama diri.
- issue: Rujukan perjanjian אֲבֹתֶיךָ
  choice: nenek moyangmu
  alternative: bapa-bapamu
  rationale: Ungkapan Indonesia yang alami dipakai dalam teks utama, sementara catatan menjelaskan bahwa bahasa Ibrani secara harfiah menyebut 'bapa-bapamu' dan menunjuk kepada para leluhur perjanjian Israel.
- issue: Daya makna לֹא יַרְפְּךָ
  choice: tidak akan meninggalkan engkau
  alternative: tidak akan melepaskan engkau
  rationale: Konteks menekankan kesetiaan perjanjian Allah. 'Meninggalkan' menyampaikan makna itu tanpa meniadakan nuansa harfiah 'melepaskan', yang dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Bentuk 'engkau' dipertahankan karena sapaan Ibraninya tunggal dan bersifat langsung; 'Ia' merujuk kepada Yahweh. Koordinasi tiga tindakan negatif dibuat alami tanpa mengaburkan kesejajarannya.
