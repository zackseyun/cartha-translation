  text: וּ/פֶן תִּשָּׂ֨א עֵינֶ֜י/ךָ הַ/שָּׁמַ֗יְמָ/ה וְֽ֠/רָאִיתָ אֶת הַ/שֶּׁ֨מֶשׁ וְ/אֶת הַ/יָּרֵ֜חַ וְ/אֶת הַ/כּֽוֹכָבִ֗ים כֹּ֚ל צְבָ֣א הַ/שָּׁמַ֔יִם וְ/נִדַּחְתָּ֛ וְ/הִשְׁתַּחֲוִ֥יתָ לָ/הֶ֖ם וַ/עֲבַדְתָּ֑/ם אֲשֶׁ֨ר חָלַ֜ק יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֹתָ֔/ם לְ/כֹל֙ הָֽ/עַמִּ֔ים תַּ֖חַת כָּל הַ/שָּׁמָֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/019.yaml
  text: And beware lest you lift up your eyes to heaven[a], and when you see the sun and the moon and the stars—all the host of heaven—you be drawn away and bow down to them and serve them[b], which Yahweh your God has allotted to all the peoples under all the heavens.
translation:
  language: id
  text: Waspadalah, jangan sampai engkau menengadah ke langit lalu melihat matahari, bulan, dan bintang-bintang—seluruh bala tentara langit—dan engkau tersesat sehingga sujud kepada semuanya itu dan beribadah kepada semuanya itu. Semuanya itu telah Yahweh, Allahmu, bagikan kepada segala bangsa di bawah seluruh langit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di seluruh kolong langit.” Secara harfiah, “di bawah seluruh langit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפֶן
  choice: Waspadalah, jangan sampai
  rationale: Ungkapan ini memperkenalkan peringatan terhadap kemungkinan yang harus dihindari. Bentuk Indonesia ini menyampaikan daya larang dan peringatannya secara wajar.
- source_word: תִּשָּׂא עֵינֶיךָ הַשָּׁמַיְמָה
  choice: engkau menengadah ke langit
  rationale: Menengadah secara alami menyatakan tindakan mengangkat wajah atau pandangan ke atas tanpa membuat kalimat terlalu harfiah.
- source_word: הַשֶּׁמֶשׁ ... הַיָּרֵחַ ... הַכּוֹכָבִים
  choice: matahari, bulan, dan bintang-bintang
  rationale: Padanan langsung dan lazim bagi ketiga jenis benda langit yang disebutkan.
- source_word: כֹּל צְבָא הַשָּׁמַיִם
  choice: seluruh bala tentara langit
  rationale: Menjaga metafora צָבָא sebagai bala tentara atau kumpulan yang teratur. Dalam konteks ini frasa tersebut merujuk pada jajaran benda langit, bukan secara khusus pada makhluk malaikat.
- source_word: וְנִדַּחְתָּ
  choice: lalu terseret
  rationale: Bentuk pasif verba ini menggambarkan seseorang yang terbawa atau disesatkan menuju penyembahan berhala, tanpa harus menyiratkan paksaan mutlak.
- source_word: וְהִשְׁתַּחֲוִיתָ לָהֶם
  choice: sujud ... kepada semuanya
  rationale: Mempertahankan tindakan fisik merendahkan diri yang dinyatakan verba Ibrani; bersama verba berikutnya, tindakan itu jelas bersifat pemujaan.
- source_word: וַעֲבַדְתָּם
  choice: beribadah kepada semuanya
  rationale: Dalam konteks kultis, עבד berarti melayani dalam arti pemujaan. 'Beribadah' menyampaikan maksud tersebut dengan jelas dalam bahasa Indonesia.
- source_word: אֲשֶׁר חָלַק
  choice: telah membagikan
  rationale: חלק berarti membagi, mengalokasikan, atau menetapkan bagian. 'Membagikan' mempertahankan gambaran pembagian tanpa menambahkan bahwa penyembahan benda-benda itu diperkenankan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Padanan langsung yang mempertahankan sapaan perjanjian dalam bentuk orang kedua tunggal.
- source_word: לְכֹל הָעַמִּים
  choice: kepada segala bangsa
  rationale: עַמִּים menunjuk kelompok-kelompok bangsa secara kolektif. 'Segala bangsa' merupakan ungkapan Indonesia yang alami dan luas.
- source_word: תַּחַת כָּל הַשָּׁמָיִם
  choice: di seluruh kolong langit
  rationale: Ungkapan idiomatis Indonesia ini mempertahankan gambaran harfiah 'di bawah seluruh langit' sekaligus berarti seluruh dunia.
theological_decisions:
- issue: Makna pernyataan bahwa Yahweh membagikan benda-benda langit kepada segala bangsa
  choice: Pernyataan tentang pembagian dipertahankan tanpa menjelaskan bahwa Yahweh menyetujui pemujaan terhadap benda langit.
  alternative: Menafsirkannya secara eksplisit sebagai pemberian benda langit untuk kegunaan umum bangsa-bangsa, atau sebagai tindakan menyerahkan bangsa-bangsa kepada penyembahan benda langit.
  rationale: Verba חלק mendukung makna membagi atau mengalokasikan, sedangkan konteks langsung melarang penyembahan berhala. Terjemahan mempertahankan ketegangan ini dan tidak menambahkan tujuan pembagian yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan orang kedua tunggal 'engkau' dipakai sesuai konteks perjanjian. Nama Yahweh dipertahankan. Metafora 'bala tentara langit' dijaga, sementara struktur kalimat dipecah menjadi dua agar mudah dipahami.
