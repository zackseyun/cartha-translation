  source_fidelity: 'Draf pada umumnya setia pada teks Ibrani: tekanan kesaksian langsung, nama Yahweh, subjek maskulin tunggal distributif, tindakan pemusnahan, dan pengusiran dari dalam komunitas dipertahankan. Namun, "dalam perkara Baal-Peor" terlalu umum dan kurang langsung untuk בְּבַעַל־פְּעוֹר, yang paling wajar diterjemahkan "di Baal-Peor" sambil mencatat alternatif yang lebih situasional. Hubungan penjelas כִּי lebih baik dinyatakan dengan "sebab" daripada hanya dengan titik dua.'
  naturalness: '"Apa yang dilakukan Yahweh" bersifat pasif dan agak kurang langsung dibandingkan tindakan aktif dalam sumber. Susunan "membinasakan dari tengah-tengahmu setiap laki-laki" juga lebih lancar bila didahului "telah" dan dihubungkan dengan "sebab."'
  terminology: '"Yahweh," "Allahmu," "membinasakan," dan "setiap laki-laki" dapat dipertahankan. Kapitalisasi "Baal-Peor" konsisten. Catatan kaki pada Baal-Peor diperlukan untuk memelihara kemungkinan bahwa preposisi Ibrani itu dipahami secara situasional, bukan semata-mata lokatif.'
