  - severity: low
    issue: 'Klausa aktif sumber diterjemahkan secara pasif: "apa yang dilakukan Yahweh"'
    rationale: Walaupun maknanya masih dapat dipahami, "apa yang Yahweh lakukan" lebih langsung, alami, dan mencerminkan verba aktif עָשָׂה.
  - severity: low
    issue: Hubungan eksplanatoris כִּי hanya dinyatakan dengan titik dua
    rationale: Titik dua mungkin, tetapi "sebab" secara jelas menyampaikan hubungan alasan/penjelasan yang terdapat dalam teks Ibrani.
  revised_text: Kamu telah melihat dengan mata kepalamu sendiri apa yang Yahweh lakukan di Baal-Peor[a], sebab Yahweh, Allahmu, telah membinasakan dari tengah-tengahmu setiap laki-laki yang mengikuti Baal-Peor.
