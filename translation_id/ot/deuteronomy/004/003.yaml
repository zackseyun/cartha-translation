  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עֵֽינֵי/כֶם֙ הָֽ/רֹאֹ֔ת אֵ֛ת אֲשֶׁר עָשָׂ֥ה יְהוָ֖ה בְּ/בַ֣עַל פְּע֑וֹר כִּ֣י כָל הָ/אִ֗ישׁ אֲשֶׁ֤ר הָלַךְ֙ אַחֲרֵ֣י בַֽעַל פְּע֔וֹר הִשְׁמִיד֛/וֹ יְהוָ֥ה אֱלֹהֶ֖י/ךָ מִ/קִּרְבֶּֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/003.yaml
  text: Your own eyes have seen what Yahweh did at Baal-peor[a], for every man who went after Baal-peor, Yahweh your God destroyed from your midst.
translation:
  language: id
  text: Kamu telah melihat dengan mata kepalamu sendiri apa yang Yahweh lakukan di Baal-Peor[a], sebab Yahweh, Allahmu, telah membinasakan dari tengah-tengahmu setiap laki-laki yang mengikuti Baal-Peor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, "mengenai Baal-Peor." Secara harfiah, teks Ibrani berbunyi "di Baal-Peor."
    reason: Memelihara alternatif pemahaman preposisi בְּ tanpa mengubah terjemahan utama yang paling langsung.
lexical_decisions:
- source_word: עֵינֵיכֶם הָרֹאֹת
  choice: Kamu telah melihat dengan mata kepalamu sendiri
  rationale: Ungkapan ini menonjolkan kesaksian langsung para pendengar. Idiom Indonesia ini mempertahankan tekanan tersebut dengan wajar.
- source_word: עָשָׂה
  choice: dilakukan
  rationale: Dalam konteks ini kata tersebut menunjuk pada tindakan penghakiman Yahweh, bukan tindakan membuat sesuatu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan untuk mempertahankan nama pribadi yang terdapat dalam teks Ibrani.
- source_word: בְּבַעַל פְּעוֹר
  choice: dalam perkara Baal-Peor
  rationale: Preposisi ב menunjuk pada peristiwa atau perkara yang berkaitan dengan Baal-Peor; pilihan ini menghindari kesan bahwa Baal-Peor semata-mata nama tempat.
- source_word: כִּי
  choice: ':'
  rationale: Hubungan penjelasan dengan klausa sebelumnya disampaikan secara alami dalam bahasa Indonesia melalui tanda titik dua.
- source_word: כָּל הָאִישׁ
  choice: setiap laki-laki
  rationale: Bentuk Ibrani adalah maskulin tunggal distributif; terjemahan ini mempertahankan bentuk bergender sumber.
- source_word: הָלַךְ אַחֲרֵי
  choice: mengikuti
  rationale: Idiom ini menyatakan tindakan mengikuti atau memberikan kesetiaan, khususnya dalam penyembahan berhala. 'Mengikuti' alami dan jelas dalam bahasa Indonesia.
- source_word: הִשְׁמִידוֹ
  choice: membinasakan
  rationale: Bentuk Hifil menyatakan pemusnahan. Objek tunggal distributifnya dinyatakan kemudian sebagai 'setiap laki-laki' dalam susunan kalimat Indonesia.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk ini merupakan sebutan relasional yang beraposisi dengan nama Yahweh.
- source_word: מִקִּרְבֶּךָ
  choice: dari tengah-tengahmu
  rationale: Ungkapan ini mempertahankan gagasan bahwa orang-orang tersebut disingkirkan dari dalam komunitas Israel.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung; transliterasi mempertahankan pembedaan antara nama pribadi dan gelar.
- issue: Gender pada כָּל הָאִישׁ
  choice: setiap laki-laki
  alternative: setiap orang
  rationale: Bentuk sumber secara gramatikal maskulin tunggal dan dipakai secara distributif; pilihan ini mempertahankan informasi gender tanpa memperluas atau mempersempitnya secara diam-diam.
- issue: Makna בְּבַעַל פְּעוֹר
  choice: dalam perkara Baal-Peor
  alternative: di Baal-Peor
  rationale: Baal-Peor dapat dipahami sebagai nama dewa yang terkait dengan peristiwa di Peor, sedangkan preposisinya dapat bersifat situasional. Ungkapan ini mempertahankan kaitan dengan peristiwa tanpa memastikan bahwa nama tersebut hanya bersifat lokatif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk sapaan tunggal Ibrani diterjemahkan dengan 'kamu/-mu', sementara tekanan kesaksian langsung dipertahankan melalui idiom 'dengan mata kepalamu sendiri'. Tanda titik dua menghasilkan hubungan penjelasan yang alami tanpa konjungsi yang kaku.
