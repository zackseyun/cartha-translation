  text: וּ/בִקַּשְׁתֶּ֥ם מִ/שָּׁ֛ם אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ וּ/מָצָ֑אתָ כִּ֣י תִדְרְשֶׁ֔/נּוּ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/029.yaml
  text: But from there you will seek Yahweh your God[a], and you will find him[b], if you seek him with all your heart and with all your soul.
translation:
  language: id
  text: Namun, dari sana kamu akan mencari Yahweh, Allahmu, dan kamu akan menemukan-Nya[a], jika kamu mencari-Nya dengan segenap hatimu dan dengan segenap jiwamu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dan kamu akan menemukan”; teks Ibrani tidak mengulangi pronomina objek di sini. “-Nya” dipahami dari klausa sebelumnya dan dinyatakan demi kejelasan.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “jiwa” juga dapat berarti “nyawa”, “hidup”, atau “seluruh keberadaan”; di sini kata itu menunjuk pada seluruh diri yang hidup.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִקַּשְׁתֶּם
  choice: Namun ... kamu akan mencari
  rationale: Konjungsi yang diikuti bentuk perfektum melanjutkan wacana dengan makna mendatang atau akibat. “Namun” menyatakan kontras dengan peringatan sebelumnya, sedangkan “akan mencari” mempertahankan daya prediktifnya.
- source_word: מִשָּׁם
  choice: dari sana
  rationale: Gabungan preposisi מִן dan keterangan tempat שָׁם menunjukkan bahwa Israel, ketika tercerai-berai di antara bangsa-bangsa, akan mencari Allah dari tempat itu.
- source_word: אֶת יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Allahmu
  rationale: Nama perjanjian יְהוָה dialihaksarakan sebagai “Yahweh”. Bentuk “Allahmu” alami dalam bahasa Indonesia dan mempertahankan akhiran orang kedua pada teks Ibrani.
- source_word: וּמָצָאתָ
  choice: dan kamu akan menemukan-Nya
  rationale: Dalam konteks ini, objek yang tersirat adalah Yahweh dari klausa sebelumnya. Akhiran “-Nya” ditambahkan dalam bahasa Indonesia demi kejelasan, tanpa mengubah hubungan antarklausa.
- source_word: כִּי
  choice: jika
  rationale: כִּי di sini paling wajar memperkenalkan syarat untuk menemukan Yahweh. “Jika” menjaga sifat kondisionalnya; “ketika” dapat memberi kesan kepastian yang lebih kuat daripada teks.
- source_word: תִדְרְשֶׁנּוּ
  choice: kamu mencari-Nya
  rationale: Dalam konteks perjanjian dan keagamaan, דרש berarti mencari Allah dengan sungguh-sungguh. Pronomina objek dalam bahasa Ibrani dinyatakan secara eksplisit melalui “-Nya”.
- source_word: בְּכָל לְבָבְךָ
  choice: dengan segenap hatimu
  rationale: לֵבָב menunjuk pada batin manusia, termasuk pikiran, kehendak, dan perasaan. “Dengan segenap hatimu” merupakan ungkapan Indonesia yang alami dan tepat.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: dan dengan segenap jiwamu
  rationale: נֶפֶשׁ dapat berarti jiwa, nyawa, kehidupan, atau keseluruhan diri. “Jiwa” mempertahankan ungkapan perjanjian yang dikenal, sedangkan keluasan maknanya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Makna antropologis נֶפֶשׁ dalam rumusan pengabdian perjanjian
  choice: jiwa
  alternative: nyawa; hidup; seluruh keberadaan
  rationale: “Jiwa” mempertahankan resonansi sastra dan teologis rumusan Ulangan, tetapi catatan kaki tetap menunjukkan bahwa kata Ibraninya dapat merujuk pada seluruh diri yang hidup.
- issue: Peralihan bentuk orang kedua jamak ke tunggal dalam teks Ibrani
  choice: kamu
  alternative: kalian ... engkau
  rationale: Kata “kamu” dalam bahasa Indonesia dapat dipakai tanpa menandai jumlah secara tegas, sehingga peralihan gramatikal Ibrani tidak dipaksakan menjadi perbedaan sapaan yang terasa janggal dan tidak pula diselesaikan secara teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “kamu” dipilih karena alami dan sekaligus tidak mengharuskan pembedaan tunggal-jamak; ini berguna karena teks Ibrani beralih dari verba orang kedua jamak ke bentuk-bentuk orang kedua tunggal. Tanda koma pada “Yahweh, Allahmu” memperlakukan “Allahmu” sebagai aposisi yang jelas.
