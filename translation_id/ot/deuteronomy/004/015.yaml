  text: וְ/נִשְׁמַרְתֶּ֥ם מְאֹ֖ד לְ/נַפְשֹׁתֵי/כֶ֑ם כִּ֣י לֹ֤א רְאִיתֶם֙ כָּל תְּמוּנָ֔ה בְּ/י֗וֹם דִּבֶּ֨ר יְהוָ֧ה אֲלֵי/כֶ֛ם בְּ/חֹרֵ֖ב מִ/תּ֥וֹךְ הָ/אֵֽשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/015.yaml
  text: So watch yourselves very carefully[b][a], since you saw no form on the day Yahweh spoke to you at Horeb from the midst of the fire.
translation:
  language: id
  text: Karena itu, jagalah diri kalian baik-baik,[a] sebab kalian tidak melihat rupa apa pun[b] pada hari Yahweh berbicara kepada kalian di Horeb dari tengah-tengah api.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “jagalah diri kalian sungguh-sungguh demi nyawa kalian”; ini adalah ungkapan yang berarti agar kalian sangat berhati-hati.
    reason: lexical_alternative
  - marker: b
    text: Atau “wujud apa pun” atau “gambaran apa pun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִשְׁמַרְתֶּם מְאֹד לְנַפְשֹׁתֵיכֶם
  choice: jagalah dirimu dengan sangat hati-hati
  rationale: Ungkapan ini secara harfiah menyuruh umat menjaga diri mereka dengan sungguh-sungguh. Bentuk tunggal kolektif “dirimu” wajar dalam bahasa Indonesia ketika Musa menyapa Israel sebagai satu umat, sedangkan “dengan sangat hati-hati” menyampaikan daya intensif מְאֹד tanpa menjadikan נֶפֶשׁ pernyataan teknis tentang jiwa.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi peringatan sebelumnya; “sebab” mempertahankan hubungan kausal secara jelas dan bermartabat.
- source_word: לֹא רְאִיתֶם כָּל תְּמוּנָה
  choice: kamu tidak melihat wujud apa pun
  rationale: תְּמוּנָה dapat berarti wujud, rupa, atau gambaran. “Wujud” mempertahankan acuan pada bentuk yang tampak tanpa mempersempitnya menjadi patung atau gambar buatan.
- source_word: בְּיוֹם
  choice: pada hari
  rationale: Terjemahan ini mempertahankan ungkapan temporal Ibrani secara langsung dan tetap alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, untuk mempertahankan nama pribadi dalam teks sumber.
- source_word: דִּבֶּר ... אֲלֵיכֶם
  choice: berbicara kepadamu
  rationale: Preposisi אֶל mendukung makna “kepada”; bentuk ini alami dalam bahasa Indonesia.
- source_word: בְּחֹרֵב
  choice: di Horeb
  rationale: “Di Horeb” adalah ungkapan lokasi yang alami dalam bahasa Indonesia.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: dari tengah-tengah api
  rationale: Terjemahan ini mempertahankan kekhususan dan gambaran hidup dari מִתּוֹךְ, bukan sekadar “dari api”.
theological_decisions:
- issue: Nuansa antropologis נֶפֶשׁ dalam לְנַפְשֹׁתֵיכֶם
  choice: 'ungkapan refleksif: “jagalah dirimu”'
  alternative: “jagalah jiwamu”
  rationale: Dalam konstruksi ini, נֶפֶשׁ berfungsi idiomatis untuk diri atau kehidupan seseorang, bukan untuk menegaskan pemisahan doktrinal antara jiwa dan tubuh. Terjemahan refleksif menghindari impor antropologi yang tidak sedang menjadi pokok ayat.
- issue: Makna תְּמוּנָה dalam konteks penampakan di Horeb
  choice: “wujud”
  alternative: “rupa” atau “gambaran”
  rationale: Ayat menekankan bahwa Israel tidak melihat representasi visual Yahweh. “Wujud” menyatakan hal itu tanpa membatasi istilah pada berhala buatan, sementara alternatif leksikal dicatat agar keluasan makna sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia standar modern, lugas, dan bermartabat. Sapaan “kamu/dirimu” dipakai secara kolektif kepada Israel. Urutan penanda catatan kaki dibuat berurutan sesuai kemunculannya dalam teks.
