  text: so that a manslayer who kills his neighbor unintentionally[a], without knowledge, and was not hating him previously[b], may flee there to one of these cities and live.
translation:
  language: id
  text: supaya orang yang membunuh sesamanya tanpa disengaja dan sebelumnya tidak membencinya dapat melarikan diri ke salah satu kota ini dan tetap hidup.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָנֻס שָׁמָּה
  choice: supaya ... dapat melarikan diri ke sana
  rationale: Infinitif dengan ל menyatakan tujuan yang terkait dengan penetapan kota-kota pada ayat sebelumnya; klausa tujuan ini alami dalam bahasa Indonesia.
- source_word: רוֹצֵחַ אֲשֶׁר יִרְצַח
  choice: orang yang membunuh
  rationale: Dalam konteks kota perlindungan, istilah ini menunjuk kepada orang yang menyebabkan kematian tanpa dengan sendirinya menetapkan kesalahan sebagai pembunuh berencana.
- source_word: רֵעֵהוּ
  choice: sesamanya
  rationale: Menyampaikan hubungan antarmanusia yang dimaksud רֵעַ dengan lebih wajar dalam konteks hukum daripada 'tetangganya'.
- source_word: בִּבְלִי דַעַת
  choice: dengan tidak sengaja, tanpa sepengetahuannya
  rationale: Ungkapan ini secara harfiah berarti 'tanpa pengetahuan'; dalam konteks hukum, frasa tersebut menunjukkan tindakan yang tidak disadari atau tidak disengaja. Kedua segi dipertahankan dalam teks.
- source_word: וְהוּא לֹא שֹׂנֵא לוֹ
  choice: padahal ... ia tidak membenci orang itu
  rationale: Partisipel menggambarkan tidak adanya sikap permusuhan yang berkelanjutan; 'padahal' memperjelas hubungan keadaan tanpa mengubah isinya.
- source_word: מִתְּמוֹל שִׁלְשׁוֹם
  choice: sebelumnya
  rationale: Ini merupakan idiom waktu yang secara harfiah menyebut 'sejak kemarin atau hari sebelumnya' dan berarti dahulu atau sebelumnya.
- source_word: וְנָס אֶל אַחַת מִן הֶעָרִים הָאֵל
  choice: dapat melarikan diri ke sana, ke salah satu kota ini
  rationale: Bentuk verbal dipahami dalam lingkup tujuan ayat; demonstratif הָאֵל dipertahankan sebagai 'ini'.
- source_word: וָחָי
  choice: dan tetap hidup
  rationale: Menyatakan hasil bahwa pelarian ke kota perlindungan memungkinkan orang itu mempertahankan hidupnya.
