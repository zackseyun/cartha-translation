  text: וְ/אֶתְ/כֶם֙ לָקַ֣ח יְהוָ֔ה וַ/יּוֹצִ֥א אֶתְ/כֶ֛ם מִ/כּ֥וּר הַ/בַּרְזֶ֖ל מִ/מִּצְרָ֑יִם לִ/הְי֥וֹת ל֛/וֹ לְ/עַ֥ם נַחֲלָ֖ה כַּ/יּ֥וֹם הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/020.yaml
  text: But Yahweh took you and brought you out of the iron furnace[a], out of Egypt, to be for him a people of inheritance, as it is this day.
translation:
  language: id
  text: Namun, Yahweh mengambil kamu dan membawa kamu keluar dari tungku peleburan besi, dari Mesir, supaya kamu menjadi umat pusaka-Nya[a], sebagaimana halnya pada hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “umat milik-Nya sendiri” atau “umat kepunyaan-Nya.” Secara harfiah, bahasa Ibrani berbunyi “menjadi bagi-Nya umat pusaka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dan mempertahankan sifatnya sebagai nama perjanjian, selaras dengan lapisan konsultasi POB.
- source_word: לָקַח
  choice: mengambil
  rationale: Mempertahankan arti dasar verba Ibrani tanpa secara eksplisit menafsirkannya sebagai 'memilih' atau 'menjadikan milik-Nya'.
- source_word: וַיּוֹצִא
  choice: membawa ... keluar
  rationale: Bentuk Hifil menyatakan tindakan kausatif; ungkapan ini alami dalam konteks keluaran dari Mesir.
- source_word: מִכּוּר הַבַּרְזֶל
  choice: dari tungku peleburan besi
  rationale: Mempertahankan metafora tentang Mesir sebagai tempat penindasan berat, sekaligus menjelaskan bahwa כּוּר adalah tungku untuk melebur atau memurnikan logam.
- source_word: מִמִּצְרָיִם
  choice: dari Mesir
  rationale: Mempertahankan pengulangan preposisi sumber dalam bahasa Ibrani dan menempatkan Mesir sebagai keterangan bagi gambaran 'tungku peleburan besi'.
- source_word: לִהְיוֹת לוֹ לְעַם נַחֲלָה
  choice: supaya kamu menjadi umat pusaka bagi-Nya
  rationale: Mempertahankan unsur 'bagi-Nya', 'umat', dan 'pusaka/milik warisan' dengan susunan yang tetap dapat dipahami dalam bahasa Indonesia.
- source_word: כַּיּוֹם הַזֶּה
  choice: seperti kenyataannya pada hari ini
  rationale: Menyampaikan idiom yang menunjuk pada keadaan Israel yang nyata pada saat Musa berbicara, tanpa mempertahankan susunan yang kaku.
theological_decisions:
- issue: Bahasa kepemilikan perjanjian dalam לְעַם נַחֲלָה
  choice: umat pusaka bagi-Nya
  alternative: umat milik-Nya sendiri; umat kepunyaan-Nya
  rationale: Pilihan ini mempertahankan citra נַחֲלָה sebagai pusaka atau milik warisan serta datif לוֹ ('bagi-Nya'), tanpa mereduksinya menjadi pernyataan kepemilikan yang lebih umum.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kamu' dipertahankan sebagai sapaan kolektif kepada Israel. Susunan 'dari tungku peleburan besi, dari Mesir' sengaja mengikuti aposisi dan pengulangan bahasa Ibrani.
