id: DEU.4.8
reference: Deuteronomy 4:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/מִי֙ גּ֣וֹי גָּד֔וֹל אֲשֶׁר ל֛/וֹ חֻקִּ֥ים וּ/מִשְׁפָּטִ֖ים צַדִּיקִ֑ם כְּ/כֹל֙ הַ/תּוֹרָ֣ה הַ/זֹּ֔את אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לִ/פְנֵי/כֶ֖ם הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/008.yaml
  text: And what great nation is there that has statutes and judgments as righteous as all this law that I am setting before you today?[a]
translation:
  language: id
  text: Dan bangsa besar manakah yang memiliki ketetapan dan peraturan yang seadil seluruh hukum[a] yang kubentangkan di hadapan kalian pada hari ini?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “pengajaran” untuk “hukum” (Ibrani: torah), meskipun konteks di sini secara khusus bersifat hukum, yaitu “ketetapan dan peraturan”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי
  choice: Dan ... manakah
  rationale: Menyampaikan pertanyaan retoris Ibrani secara wajar dalam bahasa Indonesia dan mempertahankan kaitannya dengan ayat sebelumnya.
- source_word: גּוֹי גָּדוֹל
  choice: bangsa besar
  rationale: גּוֹי menunjuk pada suatu bangsa atau kelompok masyarakat; 'bangsa' paling sesuai dengan perbandingan antarsuku bangsa dalam konteks ini.
- source_word: חֻקִּים
  choice: ketetapan
  rationale: Mempertahankan nuansa ketentuan resmi yang ditetapkan dalam konteks hukum.
- source_word: וּמִשְׁפָּטִים
  choice: dan peraturan
  rationale: Membedakannya dari חֻקִּים sambil tetap menyampaikan ranah hukum; 'peraturan' lebih mudah dipahami pembaca umum daripada istilah teknis yang kaku.
- source_word: צַדִּיקִם
  choice: adil
  rationale: Dalam konteks ketetapan dan peraturan, 'adil' secara alami menyampaikan kesesuaian dengan apa yang benar tanpa menghilangkan dimensi moral-hukumnya.
- source_word: כְּכֹל הַתּוֹרָה הַזֹּאת
  choice: seadil seluruh hukum ini
  rationale: Mempertahankan bentuk perbandingan כְּ dan cakupan menyeluruh dari כֹּל; 'hukum' paling tepat dalam konteks legal langsung ini.
- source_word: נֹתֵן לִפְנֵיכֶם
  choice: kubentangkan di hadapan kalian
  rationale: Mengungkapkan idiom tindakan menyajikan hukum kepada umat secara alami, sekaligus mempertahankan unsur 'di hadapan kalian'.
- source_word: הַיּוֹם
  choice: pada hari ini
  rationale: Mempertahankan penekanan waktu dalam bentuk Indonesia yang jelas dan bermartabat.
theological_decisions:
- issue: Makna תּוֹרָה
  choice: hukum
  alternative: pengajaran
  rationale: Walaupun תּוֹרָה dapat berarti 'pengajaran', konteks langsung menyebut ketetapan dan peraturan sehingga 'hukum' paling sesuai. Kemungkinan makna yang lebih luas tetap dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'kalian' memperjelas bahwa sapaan Ibrani bersifat jamak, sedangkan 'kubentangkan' mempertahankan suara orang pertama Musa secara ringkas dan alami.
