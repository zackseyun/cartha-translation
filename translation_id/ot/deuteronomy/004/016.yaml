  yaml_path: translation/ot/deuteronomy/004/016.yaml
  text: so that you do not act corruptly and make for yourselves a carved image[a], in the form of any figure, the likeness of male or female—
translation:
  language: id
  text: agar kamu tidak berlaku bejat dan membuat bagi kalian sendiri patung pahatan dalam rupa sosok apa pun, yang menyerupai laki-laki atau perempuan—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פֶּן
  choice: supaya jangan
  rationale: Dalam konteks peringatan ini, פֶּן menyatakan hasil buruk yang harus dihindari; “supaya jangan” alami dalam bahasa Indonesia dan tetap mempertahankan daya peringatannya.
- source_word: תַּשְׁחִתוּן
  choice: kamu berlaku bejat
  rationale: Bentuk Hifil dari שׁחת di sini menunjuk pada tindakan yang rusak secara moral dalam ketidaktaatan perjanjian; “berlaku bejat” mempertahankan nuansa aktif tanpa memaksakan makna refleksif.
- source_word: וַעֲשִׂיתֶם לָכֶם
  choice: dan membuat bagi dirimu
  rationale: Frasa ini mempertahankan nuansa benefaktif-refleksif לָכֶם, yakni membuat sesuatu untuk kepentingan atau penggunaan mereka sendiri.
- source_word: פֶּסֶל
  choice: patung pahatan
  rationale: Istilah ini menunjuk pada benda representasional yang dibentuk atau dipahat; “patung pahatan” konkret, jelas, dan tidak sekuno “patung ukiran.”
- source_word: תְּמוּנַת כָּל סָמֶל
  choice: dalam rupa apa pun
  rationale: Gabungan istilah ini menggambarkan bentuk atau representasi apa pun. Terjemahan ini menjaga keluasan larangan tanpa mempersempit סָמֶל secara dini menjadi hanya “berhala.”
- source_word: תַּבְנִית
  choice: yang menyerupai
  rationale: Dalam konstruksi dengan “laki-laki atau perempuan,” bentuk verbal relatif ini menyampaikan gagasan pola atau kemiripan secara alami dalam bahasa Indonesia.
- source_word: זָכָר אֹו נְקֵבָה
  choice: laki-laki atau perempuan
  rationale: Keduanya merupakan istilah jenis kelamin. Dalam konteks rupa manusia, padanan ini lebih alami bagi pembaca umum daripada “jantan atau betina,” tanpa membatasi acuan kepada orang dewasa.
theological_decisions:
- issue: Istilah dalam larangan pembuatan representasi kultis
  choice: Menerjemahkan פֶּסֶל secara konkret sebagai “patung pahatan” dan membiarkan תְּמוּנַת כָּל סָמֶל sebagai “dalam rupa apa pun.”
  alternative: Menerjemahkan סָמֶל secara eksplisit sebagai “berhala.”
  rationale: Bahasa Ibrani menumpuk beberapa istilah representasional yang saling bertumpang tindih. “Rupa apa pun” mempertahankan cakupan luas dan ambiguitas leksikal סָמֶל, sedangkan konteks anti-penyembahan berhala tetap jelas dari “patung pahatan” dan konteks ayat-ayat sekitarnya.
- issue: Nilai refleksif תַּשְׁחִתוּן
  choice: “berlaku bejat”
  alternative: “merusak dirimu sendiri”
  rationale: Bentuk Ibrani dapat dipahami sebagai bertindak secara rusak atau mendatangkan kerusakan atas diri sendiri. Teks utama mempertahankan tekanan moral-aktif tanpa menyelesaikannya menjadi refleksif; kemungkinan refleksif dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada peringatan yang khidmat. Pronomina kolektif Ibrani orang kedua jamak diterjemahkan dengan “kamu,” sedangkan “dirimu” dipakai secara distributif. Tanda pisah dipertahankan karena kalimat berlanjut ke ayat berikutnya.
