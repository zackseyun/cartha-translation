  text: וְ/הֵפִ֧יץ יְהוָ֛ה אֶתְ/כֶ֖ם בָּ/עַמִּ֑ים וְ/נִשְׁאַרְתֶּם֙ מְתֵ֣י מִסְפָּ֔ר בַּ/גּוֹיִ֕ם אֲשֶׁ֨ר יְנַהֵ֧ג יְהוָ֛ה אֶתְ/כֶ֖ם שָֽׁמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/027.yaml
  text: And Yahweh will scatter you among the peoples[a], and you will be left few in number among the nations where Yahweh will drive you.
translation:
  language: id
  text: Yahweh akan mencerai-beraikan kamu di antara suku-suku bangsa, dan kamu akan tinggal sedikit jumlahnya di antara bangsa-bangsa tempat Yahweh menggiring kamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menuntun kamu.” Kata kerja Ibrani ini dapat berarti “menuntun” atau “menggiring”; “menggiring” dipilih di sini karena konteksnya adalah penghukuman dan pembuangan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵפִיץ
  choice: akan mencerai-beraikan
  rationale: Bentuk Hifil dari פוץ menyatakan tindakan menyebabkan orang tersebar. “Mencerai-beraikan” alami dalam konteks penghukuman dan mempertahankan daya ungkap verba kausatif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks sumber tetap terlihat.
- source_word: בָּעַמִּים
  choice: di antara suku-suku bangsa
  rationale: עַמִּים menunjuk pada kelompok-kelompok masyarakat atau etnis. Pilihan ini juga mempertahankan perbedaan leksikal dengan גּוֹיִם pada bagian berikutnya.
- source_word: וְנִשְׁאַרְתֶּם מְתֵי מִסְפָּר
  choice: hanya sedikit dari antara kamu yang akan tersisa
  rationale: Ungkapan מְתֵי מִסְפָּר berarti jumlah yang sangat sedikit, sedangkan bentuk Nifal וְנִשְׁאַרְתֶּם menyatakan keadaan tersisa sesudah penghukuman. Susunan ini alami dalam bahasa Indonesia.
- source_word: בַּגּוֹיִם
  choice: di antara bangsa-bangsa
  rationale: גּוֹיִם di sini merujuk secara umum kepada bangsa-bangsa asing, tanpa memasukkan nuansa teologis yang lebih kemudian dari istilah “bangsa-bangsa bukan Yahudi”.
- source_word: אֲשֶׁר יְנַהֵג ... שָׁמָּה
  choice: tempat ... menggiring kamu
  rationale: נהג dapat berarti “menuntun” atau “menggiring”. Dalam konteks penghukuman dan pembuangan paksa, “menggiring” paling tepat, sementara “tempat” sudah memuat fungsi lokatif שָׁמָּה.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama diri ilahi secara langsung. Transliterasi “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Nuansa tindakan נהג dalam pembuangan
  choice: menggiring
  alternative: menuntun
  rationale: Konteks ayat adalah penghukuman dan penyebaran di antara bangsa-bangsa, sehingga tindakan yang bersifat memaksa lebih menonjol. Namun, karena verba Ibrani juga dapat berarti “menuntun”, alternatif itu dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Suku-suku bangsa” dan “bangsa-bangsa” membedakan עַמִּים dari גּוֹיִם tanpa membuat kalimat terasa teknis. Penanda catatan kaki ditempatkan langsung sesudah frasa yang memiliki ambiguitas leksikal.
