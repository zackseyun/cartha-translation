review_pass:
  verdict: revise
  source_fidelity: Draf pada umumnya setia pada teks Ibrani, termasuk sapaan kepada Israel, pembedaan istilah hukum, dan makna ירשׁ dalam konteks tanah. Namun, bentuk partisip נֹתֵן menyatakan tindakan pemberian yang sedang berlangsung; “yang diberikan” terdengar sebagai pasif/peristiwa yang telah selesai dan mengaburkan subjek Yahweh.
  naturalness: Bahasanya baku dan jelas. “untuk kamu lakukan” lebih alami dan langsung daripada “untuk dilakukan,” serta memperjelas pelaku tanpa menambah makna. Penyusunan ulang klausa terakhir membuat hubungan Yahweh sebagai subjek “memberikan” lebih jelas.
  terminology: “Ketetapan-ketetapan” dan “peraturan-peraturan” mempertahankan pembedaan yang layak antara חֻקִּים dan מִשְׁפָּטִים. Nama ilahi “Yahweh” dipertahankan. “Allah nenek moyangmu” merupakan padanan yang alami untuk אֱלֹהֵי אֲבֹתֵיכֶם.
  issues:
  - severity: medium
    issue: Klausa pemberian tanah diterjemahkan sebagai “yang diberikan Yahweh ... kepadamu.”
    rationale: Ibrani memakai partisip aktif נֹתֵן, “yang [sedang] memberikan,” dengan Yahweh sebagai subjek. Terjemahan pasif dapat menyiratkan pemberian yang sudah selesai dan kurang tegas menyatakan tindakan Yahweh.
  - severity: low
    issue: “untuk dilakukan” kurang langsung dalam bahasa Indonesia.
    rationale: Frasa infinitif לַעֲשׂוֹת merujuk pada Israel sebagai pelaku pelaksanaan. “untuk kamu lakukan” mempertahankan hubungan ini dengan lebih alami.
  revised_text: Dan sekarang, hai Israel, dengarkanlah ketetapan-ketetapan dan peraturan-peraturan[a] yang sedang kuajarkan kepadamu untuk kamu lakukan, supaya kamu hidup dan memasuki serta menduduki tanah yang Yahweh, Allah nenek moyangmu, berikan kepadamu.[b]
  revised_footnotes:
