revisions:
- from: Dan sekarang, hai Israel, dengarkanlah ketetapan-ketetapan dan peraturan-peraturan yang sedang kuajarkan kepadamu untuk dilakukan, supaya kamu hidup, lalu masuk dan menduduki negeri yang diberikan Yahweh, Allah nenek moyangmu, kepadamu.[a][b]
  to: Dan sekarang, hai Israel, dengarkanlah ketetapan-ketetapan dan peraturan-peraturan[a] yang sedang kuajarkan kepadamu untuk kamu lakukan, supaya kamu hidup dan memasuki serta menduduki tanah yang Yahweh, Allah nenek moyangmu, berikan kepadamu.[b]
