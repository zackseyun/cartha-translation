id: DEU.4.1
reference: Deuteronomy 4:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֣ה יִשְׂרָאֵ֗ל שְׁמַ֤ע אֶל הַֽ/חֻקִּים֙ וְ/אֶל הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֧ר אָֽנֹכִ֛י מְלַמֵּ֥ד אֶתְ/כֶ֖ם לַ/עֲשׂ֑וֹת לְמַ֣עַן תִּֽחְי֗וּ וּ/בָאתֶם֙ וִֽ/ירִשְׁתֶּ֣ם אֶת הָ/אָ֔רֶץ אֲשֶׁ֧ר יְהוָ֛ה אֱלֹהֵ֥י אֲבֹתֵי/כֶ֖ם נֹתֵ֥ן לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/001.yaml
  text: And now[a], Israel, listen to the statutes and the judgments that I am teaching you to do, so that you may live and go in and take possession of the land that Yahweh, the God of your fathers[c][b], is giving to you.
translation:
  language: id
  text: Dan sekarang, hai Israel, dengarkanlah ketetapan-ketetapan dan peraturan-peraturan[a] yang sedang kuajarkan kepadamu untuk kamu lakukan, supaya kamu hidup dan memasuki serta menduduki tanah yang Yahweh, Allah nenek moyangmu, berikan kepadamu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ketetapan-ketetapan dan keputusan-keputusan hukum.”'
    reason: lexical_alternative
  - marker: b
    text: Kata yang diterjemahkan “menduduki” juga dapat berarti “memiliki” atau “mewarisi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Dan sekarang
  rationale: Mempertahankan peralihan wacana dan kaitannya dengan uraian sebelumnya secara alami dalam bahasa Indonesia.
- source_word: שְׁמַע אֶל
  choice: dengarkanlah
  rationale: Mengungkapkan tindakan mendengar dengan sungguh-sungguh tanpa langsung mempersempit maknanya menjadi 'taatilah'; unsur pelaksanaan dinyatakan oleh לַעֲשׂוֹת.
- source_word: הַחֻקִּים
  choice: ketetapan-ketetapan
  rationale: Padanan hukum yang cukup jelas dan tetap membedakannya dari מִשְׁפָּטִים.
- source_word: הַמִּשְׁפָּטִים
  choice: peraturan-peraturan
  rationale: Padanan alami dalam bahasa Indonesia untuk ketentuan hukum atau keputusan yang mengatur, serta tetap berbeda dari חֻקִּים.
- source_word: מְלַמֵּד
  choice: sedang kuajarkan
  rationale: Partisip Ibrani menunjukkan kegiatan pengajaran Musa yang sedang berlangsung.
- source_word: לַעֲשׂוֹת
  choice: untuk dilakukan
  rationale: Mempertahankan tekanan konkret pada pelaksanaan ketetapan dan peraturan.
- source_word: לְמַעַן תִּחְיוּ
  choice: supaya kamu hidup
  rationale: Menyatakan tujuan atau hasil yang dimaksud tanpa menjelaskan lebih jauh sifat kehidupan tersebut.
- source_word: וּבָאתֶם
  choice: lalu masuk
  rationale: Mengungkapkan gerak memasuki negeri dan menyajikan rangkaian akibat atau tujuan secara alami.
- source_word: וִירִשְׁתֶּם
  choice: menduduki
  rationale: Dalam konteks negeri, ירשׁ menunjuk pada mengambil dan memegang negeri sebagai milik; alternatif 'memiliki' dicatat karena cakupan katanya.
- source_word: הָאָרֶץ
  choice: negeri
  rationale: '''Negeri'' wajar untuk wilayah yang akan dimasuki dan diduduki, sambil tetap membawa konteks tanah perjanjian.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi yang tertulis dalam teks Ibrani.
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: Allah nenek moyangmu
  rationale: Mengungkapkan rumusan hubungan leluhur secara alami dan inklusif dalam bahasa Indonesia modern tanpa mengubah rujukan kolektifnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber secara langsung memakai Tetragramaton; 'Yahweh' mempertahankannya sebagai nama diri, sedangkan 'TUHAN' merupakan penggantian tradisional.
- issue: Hubungan antara mendengar dan menaati dalam שְׁמַע
  choice: dengarkanlah
  alternative: taatilah
  rationale: Konteks memang mengarah pada ketaatan, tetapi menerjemahkannya sebagai 'taatilah' akan menuntaskan implikasi yang oleh teks dilanjutkan melalui frasa 'untuk dilakukan'.
- issue: Nuansa tujuan atau akibat dalam לְמַעַן dan rangkaian verba berikutnya
  choice: supaya kamu hidup, lalu masuk dan menduduki
  alternative: supaya kamu hidup dan dapat masuk serta menduduki
  rationale: Pilihan utama mempertahankan rangkaian klausa Ibrani serta membiarkan hubungan tujuan dan akibat tetap sedikit terbuka.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan 'hai Israel' mempertahankan vokatif Ibrani; bentuk tunggal kolektif 'kamu' mengikuti Israel sebagai satu umat. Penempatan catatan kaki di akhir ayat menghindari gangguan pada alur, dengan kedua penanda tetap hadir dalam teks utama.
