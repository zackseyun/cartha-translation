  text: רְאֵ֣ה לִמַּ֣דְתִּי אֶתְ/כֶ֗ם חֻקִּים֙ וּ/מִשְׁפָּטִ֔ים כַּ/אֲשֶׁ֥ר צִוַּ֖/נִי יְהוָ֣ה אֱלֹהָ֑/י לַ/עֲשׂ֣וֹת כֵּ֔ן בְּ/קֶ֣רֶב הָ/אָ֔רֶץ אֲשֶׁ֥ר אַתֶּ֛ם בָּאִ֥ים שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/004/005.yaml
  text: See[a], I have taught you statutes and judgments, just as Yahweh my God commanded me[c][b], so that you may do so in the midst of the land that you are entering there to possess it.
translation:
  language: id
  text: Lihatlah, aku telah mengajarkan kepadamu ketetapan dan peraturan, tepat seperti yang Yahweh, Allahku, perintahkan kepadaku, supaya kamu melakukan demikian di tengah negeri yang kamu masuki itu untuk memilikinya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רְאֵה
  choice: Lihatlah
  rationale: Imperatif tunggal ini berfungsi menarik perhatian umat. “Lihatlah” mempertahankan daya langsung bentuk Ibrani dan tetap wajar dalam ragam Indonesia yang khidmat.
- source_word: לִמַּדְתִּי
  choice: aku telah mengajarkan
  rationale: Bentuk perfektif orang pertama tunggal menyatakan pengajaran Musa yang telah dilaksanakan dan tetap relevan bagi nasihat saat ini.
- source_word: חֻקִּים
  choice: ketetapan
  rationale: Istilah ini menunjuk pada ketentuan yang ditetapkan dan mempertahankan register hukum tanpa terdengar terlalu teknis.
- source_word: מִשְׁפָּטִים
  choice: peraturan
  rationale: Dalam pasangan hukum ini, kata tersebut mengacu pada aturan atau keputusan hukum. “Peraturan” alami bagi pembaca Indonesia, walaupun nuansa penghakiman atau keputusan hukum tetap melekat pada istilah Ibraninya.
- source_word: כַּאֲשֶׁר
  choice: tepat seperti
  rationale: Ungkapan ini menegaskan kesesuaian pengajaran Musa dengan perintah ilahi.
- source_word: יְהוָה אֱלֹהָי
  choice: Yahweh, Allahku
  rationale: Nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”, sedangkan אֱלֹהָי diterjemahkan “Allahku”.
- source_word: לַעֲשׂוֹת כֵּן
  choice: supaya kamu melakukannya
  rationale: Infinitif menyatakan tujuan pengajaran. Objek tersiratnya adalah ketetapan dan peraturan yang baru disebut; “melakukannya” menyampaikan rujukan itu secara alami dalam bahasa Indonesia.
- source_word: בְּקֶרֶב הָאָרֶץ
  choice: di tengah negeri
  rationale: Terjemahan ini mempertahankan gambaran harfiah בְּקֶרֶב, bukan menyederhanakannya menjadi hanya “di negeri”.
- source_word: בָּאִים שָׁמָּה
  choice: yang sedang kamu masuki
  rationale: Partisip menyatakan tindakan masuk yang segera atau sedang dituju. Unsur arah שָׁמָּה tersampaikan secara idiomatis dalam verba “masuki” tanpa penambahan “ke sana” yang kaku.
- source_word: לְרִשְׁתָּהּ
  choice: untuk kamu duduki
  rationale: ירשׁ dalam konteks tanah dapat berarti mengambil alih, menduduki, memiliki, atau mewarisi. “Duduki” cocok dengan masuknya Israel ke negeri itu tanpa menutup seluruh nuansa kepemilikan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri perjanjian יְהוָה. “Yahweh” mempertahankan nama tersebut secara langsung, sedangkan “TUHAN” merupakan penggantian tradisional berdasarkan kebiasaan pembacaan.
- issue: Nuansa ירשׁ dalam hubungan dengan negeri
  choice: menduduki negeri itu
  alternative: memiliki atau mewarisi negeri itu
  rationale: Konteks menekankan Israel memasuki negeri untuk mengambilnya sebagai tempat tinggal dan milik. “Duduki” alami dalam kalimat ini, sementara kemungkinan nuansa kepemilikan dan warisan tidak dijadikan lebih khusus daripada teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti tunggal “aku” mengikuti pembicara Musa, sedangkan “kamu” dapat merujuk secara kolektif kepada Israel. Susunan dibuat alami tanpa menghilangkan ungkapan khas “di tengah negeri”.
