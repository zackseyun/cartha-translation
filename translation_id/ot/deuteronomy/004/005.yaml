revisions:
- from: Lihatlah, aku telah mengajarkan kepadamu ketetapan dan peraturan, tepat seperti yang diperintahkan Yahweh, Allahku, kepadaku, supaya kamu melakukannya di tengah negeri yang sedang kamu masuki untuk kamu duduki.
  to: Lihatlah, aku telah mengajarkan kepadamu ketetapan dan peraturan, tepat seperti yang Yahweh, Allahku, perintahkan kepadaku, supaya kamu melakukan demikian di tengah negeri yang kamu masuki itu untuk memilikinya.
  rationale: Revisi memperjelas susunan klausa perintah, mempertahankan fungsi “demikian” untuk כֵּן, dan mengganti “duduki” dengan “miliki” agar cakupan ירשׁ tidak dipersempit. Kata “itu” secara idiomatis mempertahankan penunjukan arah/tempat dari שָׁמָּה tanpa memaksakan frasa “ke sana”.
