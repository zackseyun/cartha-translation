  text: But if it has a defect—being lame or blind[a], any bad defect—you shall not sacrifice it to Yahweh your God.
translation:
  language: id
  text: Namun, jika hewan itu memiliki cacat—pincang, buta, atau cacat apa pun yang buruk[a]—janganlah kamu mempersembahkannya sebagai kurban kepada Yahweh, Allahmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “setiap cacat yang buruk.” Dalam konteks ini, ungkapan itu menunjuk pada cacat fisik yang membuat hewan tidak layak dipersembahkan sebagai kurban.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Namun, jika
  rationale: Menandai syarat yang berlawanan dengan ketentuan sebelumnya tentang hewan sulung yang layak dipersembahkan.
- source_word: יִהְיֶה בוֹ מוּם
  choice: hewan itu memiliki cacat
  rationale: Secara harfiah berarti 'ada padanya cacat'; bentuk ini alami dalam bahasa Indonesia, dan 'hewan itu' memperjelas rujukan konteks.
- source_word: פִּסֵּחַ
  choice: pincang
  rationale: Padanan langsung untuk gangguan fisik yang menghambat kemampuan berjalan.
- source_word: עִוֵּר
  choice: buta
  rationale: Padanan langsung bagi keadaan tidak dapat melihat.
- source_word: כֹּל מוּם רָע
  choice: cacat buruk apa pun
  rationale: Mempertahankan ungkapan Ibrani yang tidak biasa dan daya semantis רָע ('buruk/jahat') tanpa diam-diam membatasinya menjadi hanya 'serius'.
- source_word: לֹא תִזְבָּחֶנּוּ
  choice: janganlah kamu mempersembahkannya sebagai kurban
  rationale: Dalam konteks hukum ibadah, זבח menunjuk pada penyembelihan atau pemberian sebagai kurban, bukan sekadar membunuh hewan.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: kepada Yahweh, Allahmu
  rationale: Mempertahankan nama perjanjian יהוה dan sapaan orang kedua tunggal dalam אֱלֹהֶיךָ.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber menyebut Tetragramaton secara langsung; transliterasi 'Yahweh' mempertahankan nama ilahi tanpa menggantinya dengan gelar.
- issue: Cakupan מוּם רָע
  choice: cacat buruk apa pun
  alternative: cacat serius apa pun
  rationale: Pilihan utama mempertahankan ketegangan leksikal ungkapan Ibrani. Dalam konteks, ungkapan itu menunjuk pada cacat fisik yang membuat hewan tidak dapat diterima sebagai kurban, tetapi terjemahan utama tidak menyisipkan penafsiran 'serius'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'janganlah kamu' mempertahankan nada hukum serta sapaan orang kedua tunggal; 'Allahmu' mempertahankan bentuk posesif langsung dari teks Ibrani.
