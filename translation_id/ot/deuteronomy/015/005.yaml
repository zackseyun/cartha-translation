  text: asalkan engkau sungguh-sungguh mendengarkan suara TUHAN, Allahmu, dengan menaati dan melakukan seluruh perintah ini yang kuperintahkan kepadamu hari ini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק אִם
  choice: asalkan
  rationale: Mengungkapkan syarat yang membatasi dan menghubungkan ayat ini dengan konteks sebelumnya secara alami.
- source_word: שָׁמוֹעַ תִּשְׁמַע
  choice: sungguh-sungguh mendengarkan
  rationale: Konstruksi infinitif absolut dengan verba finit menegaskan tindakan mendengarkan; pengulangan harfiah tidak alami dalam bahasa Indonesia.
- source_word: בְּקוֹל יְהוָה אֱלֹהֶיךָ
  choice: suara TUHAN, Allahmu
  rationale: Mempertahankan metafora 'suara' dan menerjemahkan nama ilahi menurut konvensi Indonesia dengan TUHAN.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: dengan menaati dan melakukan
  rationale: שׁמר dalam konteks perintah menyiratkan kepatuhan yang cermat, sedangkan עשׂה secara langsung berarti melakukan; keduanya dipertahankan.
- source_word: כָּל הַמִּצְוָה הַזֹּאת
  choice: seluruh perintah ini
  rationale: Nomina Ibrani berbentuk tunggal kolektif dan merujuk pada keseluruhan ketetapan yang sedang diperintahkan.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: yang kusampaikan kepadamu pada hari ini
  rationale: Dalam konteks pemberian hukum, 'kusampaikan' menyatakan tindakan memerintahkan dengan bahasa Indonesia yang lancar tanpa mengubah pelakunya.
theological_decisions:
- issue: Sifat bersyarat dari janji pada konteks sebelumnya
  choice: asalkan
  alternative: jika saja
  rationale: רַק אִם menyatakan syarat tegas, bukan semata-mata harapan emosional; 'asalkan' menjaga hubungan logis itu.
- issue: Relasi antara mendengar dan taat
  choice: mendengarkan ... dengan menaati dan melakukan
  alternative: mendengarkan ... dengan berhati-hati melakukan
  rationale: Teks mengaitkan mendengar suara Allah dengan menjaga dan melakukan perintah, tanpa menyamakan ketiga verba atau menghapus salah satunya.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk tunggal 'engkau/Allahmu/kepadamu' dipertahankan sesuai sapaan Ibrani kepada Israel sebagai kesatuan. Kapitalisasi TUHAN mengikuti konvensi penerjemahan nama ilahi.
