  terminology: '"Meminjamkan" tepat dan perlu dipertahankan, karena הַעֲבֵט menunjuk pada pemberian pinjaman, bukan sekadar pemberian cuma-cuma. "Kepadanya" dan "kekurangannya" sesuai. Sapaan "engkau" sesuai register Alkitab baku modern.'
