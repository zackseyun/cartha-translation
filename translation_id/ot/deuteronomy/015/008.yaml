  yaml_path: translation/ot/deuteronomy/015/008.yaml
  text: Instead[a], you must open your hand to him and surely lend him enough for whatever he lacks.
translation:
  language: id
  text: Sebaliknya, bukalah tanganmu lebar-lebar kepadanya dan benar-benar pinjamkan kepadanya cukup untuk kebutuhannya, yaitu apa yang kurang baginya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, bahasa Ibrani mengulang bentuk verbal: “membuka, engkau akan membuka ... meminjamkan, engkau akan meminjamkan kepadanya.” Pengulangan ini memberi penegasan kuat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebaliknya
  rationale: Dalam konteks ini, partikel tersebut menandai pertentangan dengan larangan mengeraskan hati dan menutup tangan pada ayat sebelumnya.
- source_word: פָתֹחַ תִּפְתַּח
  choice: engkau harus membuka ... lebar-lebar
  rationale: Gabungan infinitif absolut dan verba finit menegaskan perintah. Ungkapan ini mempertahankan gambaran tangan yang terbuka sekaligus menyampaikan penekanannya secara alami dalam bahasa Indonesia.
- source_word: יָדְךָ
  choice: tanganmu
  rationale: Terjemahan harfiah ini mempertahankan metafora konkret tentang kemurahan hati dan mudah dipahami dalam bahasa Indonesia.
- source_word: לוֹ
  choice: kepadanya
  rationale: Preposisi menandai orang miskin yang disebut sebelumnya sebagai penerima tindakan tersebut.
- source_word: וְהַעֲבֵט תַּעֲבִיטֶנּוּ
  choice: dan sungguh-sungguh meminjamkan kepadanya
  rationale: Bentuk kausatif dari עבט berarti meminjamkan, sedangkan susunan infinitif absolut dengan verba finit memberi penegasan kuat pada kewajiban itu tanpa mengubahnya menjadi pemberian.
- source_word: דֵּי
  choice: sebanyak yang ... perlukan
  rationale: Kata ini menyatakan kecukupan, yakni jumlah yang memadai untuk memenuhi kebutuhan.
- source_word: מַחְסֹרוֹ אֲשֶׁר יֶחְסַר לוֹ
  choice: untuk mencukupi kekurangannya
  rationale: Frasa Ibrani menekankan kebutuhan atau apa yang kurang padanya. Susunan Indonesia ini mempertahankan gagasan kecukupan dan kekurangan tanpa pengulangan yang kaku.
theological_decisions:
- issue: Apakah tindakan yang diperintahkan adalah memberi atau meminjamkan
  choice: meminjamkan
  alternative: memberikan
  rationale: Verba עבט dalam bentuk kausatif di sini secara leksikal menunjuk pada pemberian pinjaman. Terjemahan tidak mengubah kewajiban itu menjadi pemberian cuma-cuma, meskipun konteks menuntut kemurahan hati.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal “engkau” sesuai bentuk Ibrani. Nada perintah dijaga tegas dan bermartabat; idiom “membuka tangan” dipertahankan, dengan “lebar-lebar” untuk menyampaikan penegasan sumber.
