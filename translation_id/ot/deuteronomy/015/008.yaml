  source_fidelity: 'Terjemahan menangkap pertentangan kontekstual כִּי, idiom membuka tangan, dan makna kausatif עבט sebagai meminjamkan. Namun, frasa "sebanyak yang ia perlukan untuk mencukupi kekurangannya" menggeser struktur sumber: דֵּי secara langsung menyatakan kecukupan bagi "kekurangannya/keperluannya," sedangkan tambahan "untuk mencukupi" dapat terdengar seolah-olah tujuan atau hasil yang terpisah. Pengulangan penegas pada kedua verba sebaiknya tercermin tanpa membuatnya berlebihan.'
