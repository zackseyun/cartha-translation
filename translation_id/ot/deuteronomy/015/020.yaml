base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/020.yaml
  text: You and your household shall eat it before Yahweh your God year by year in the place that Yahweh will choose[a].
translation:
  language: id
  text: Engkau bersama seisi rumahmu harus memakannya tahun demi tahun di hadapan Yahweh, Allahmu, di tempat yang akan dipilih Yahweh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Ungkapan ini secara idiomatis berarti berada atau bertindak di hadapan seseorang; dalam konteks ibadah, frasa ini menyatakan bahwa perjamuan berlangsung dalam hadirat Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks Ibrani dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk dengan akhiran orang kedua tunggal berarti 'Allahmu' dan merupakan bagian dari rumusan perjanjian.
- source_word: תֹאכֲלֶנּוּ
  choice: harus memakannya
  rationale: Bentuk imperfek dalam konteks hukum menyampaikan kewajiban, sedangkan akhiran objek tunggal merujuk kepada hewan sulung yang dibicarakan sebelumnya.
- source_word: שָׁנָה בְּשָׁנָה
  choice: tahun demi tahun
  rationale: Ungkapan distributif ini menyatakan pelaksanaan yang berulang setiap tahun dan mempertahankan irama ungkapan Ibraninya.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה
  choice: di tempat yang akan dipilih Yahweh
  rationale: Terjemahan ini mempertahankan rumusan khas Ulangan mengenai tempat ibadah yang dipilih Yahweh dan nuansa prospektif verba Ibrani.
- source_word: אַתָּה וּבֵיתֶךָ
  choice: engkau bersama seisi rumahmu
  rationale: '''Seisi rumahmu'' mencakup seluruh anggota rumah tangga, bukan hanya keluarga inti atau bangunannya.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi secara langsung; bentuk 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Daya hukum bentuk תֹאכֲלֶנּוּ
  choice: harus memakannya
  alternative: akan memakannya
  rationale: Dalam konteks rangkaian ketetapan, imperfek ini berfungsi sebagai instruksi yang mengikat, bukan sekadar ramalan mengenai tindakan mendatang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat alami tanpa menghilangkan pengulangan nama Yahweh, pola tahunan, atau cakupan seluruh rumah tangga.
