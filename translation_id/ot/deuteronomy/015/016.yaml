base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/016.yaml
  text: And if he says to you[a], ‘I will not go out from you,’ because he loves you and your household, because it is good for him with you[b],
translation:
  language: id
  text: Jika ia berkata kepadamu[a], ‘Aku tidak akan pergi meninggalkanmu,’ karena ia mengasihimu dan seisi rumahmu, karena keadaannya baik bersamamu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Aku tidak akan keluar dari bersamamu.” Kata “keluar” dalam konteks ini mengacu pada pergi setelah dibebaskan dari masa pengabdian.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “karena baik baginya bersamamu.” Ungkapan ini menyatakan bahwa keadaannya atau kesejahteraannya baik bersamamu, tanpa membatasi alasannya pada kemakmuran materi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Jika
  rationale: Dalam rumusan hukum kasuistis, ungkapan ini secara alami memperkenalkan keadaan yang mungkin terjadi; ‘Jika’ mempertahankan fungsi kondisionalnya tanpa terjemahan harfiah yang kaku.
- source_word: יֹאמַר אֵלֶיךָ
  choice: ia berkata kepadamu
  rationale: Bentuk imperfek dalam konteks hukum menyatakan kasus potensial; bentuk kini Indonesia terdengar alami dan langsung.
- source_word: לֹא אֵצֵא מֵעִמָּךְ
  choice: Aku tidak mau meninggalkanmu
  rationale: Secara harfiah berarti ‘aku tidak akan keluar dari bersamamu’, tetapi dalam konteks pembebasan hamba menunjuk pada keengganannya berpisah atau pergi. ‘Tidak mau meninggalkanmu’ menyampaikan kehendak dan nuansa relasional secara alami.
- source_word: כִּי אֲהֵבְךָ
  choice: karena ia mengasihimu
  rationale: כִּי menyatakan alasan, sedangkan אָהֵב menunjuk pada kasih atau keterikatan pribadi.
- source_word: וְאֶת בֵּיתֶךָ
  choice: dan seisi rumahmu
  rationale: בַּיִת di sini mencakup orang-orang dalam rumah tangga, bukan hanya bangunannya; ‘seisi rumahmu’ merupakan ungkapan Indonesia yang alami.
- source_word: כִּי טוֹב לוֹ עִמָּךְ
  choice: dan karena hidupnya baik bersamamu
  rationale: Ungkapan Ibrani secara harfiah menyatakan bahwa keadaan itu baik baginya ketika bersama tuannya. Pilihan ini mempertahankan penilaian positif tanpa mempersempitnya hanya pada kemakmuran materi.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Seisi rumahmu’ dipilih untuk cakupan sosial בֵּיתֶךָ. Ayat dipertahankan sebagai klausa yang berlanjut ke ayat berikutnya, sehingga diakhiri dengan koma.
