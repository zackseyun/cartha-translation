  text: Only[a], you shall not eat its blood; you shall pour it out on the ground like water.
translation:
  language: id
  text: Hanya saja, janganlah engkau memakan darahnya; tuangkanlah darah itu ke tanah seperti air.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רַק
  choice: Hanya
  rationale: Menandai pembatasan terhadap izin pada ayat sebelumnya. Bentuk ini ringkas dan mempertahankan daya restriktif teks Ibrani.
- source_word: אֶת דָּמוֹ
  choice: darahnya
  rationale: Pronomina posesif merujuk kepada darah hewan yang dibicarakan. 'Darahnya' alami dalam bahasa Indonesia dan tidak menambahkan gagasan 'darah kehidupan' yang tidak dinyatakan di ayat ini.
- source_word: לֹא תֹאכֵל
  choice: janganlah engkau memakan
  rationale: Menyampaikan larangan hukum dengan nada yang tegas dan bermartabat; bentuk tunggal 'engkau' mempertahankan sapaan Ibrani.
- source_word: עַל הָאָרֶץ
  choice: ke tanah
  rationale: Dalam konteks konkret pembuangan darah, 'ke tanah' menyampaikan arah tindakan secara alami dalam bahasa Indonesia, meskipun preposisi Ibraninya secara harfiah dapat berarti 'di/atas tanah'.
- source_word: תִּשְׁפְּכֶנּוּ
  choice: tuangkanlah darah itu
  rationale: Kata kerja menyatakan tindakan menuangkan atau mencurahkan. Pengulangan 'darah itu' memperjelas rujukan objek dan lebih alami daripada pronomina benda 'itu' saja.
- source_word: כַּמָּיִם
  choice: seperti air
  rationale: Mempertahankan perbandingan langsung dalam bentuk Indonesia yang wajar.
theological_decisions:
- issue: Perlakuan terhadap darah dalam hukum makanan
  choice: Larangan diterjemahkan secara langsung sebagai perintah untuk tidak memakan darah hewan dan untuk menuangkannya ke tanah.
  alternative: Menggunakan 'darah kehidupannya' untuk menonjolkan hubungan darah dengan nyawa.
  rationale: Ayat ini sendiri memberikan perintah konkret tanpa menyatakan alasan teologisnya. Hubungan darah dengan nyawa terdapat dalam konteks Taurat yang lebih luas, tetapi tidak perlu ditambahkan ke dalam teks utama ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nada hukum dipertahankan melalui bentuk 'janganlah engkau' dan 'tuangkanlah'. Tidak diperlukan catatan kaki karena 'darahnya' sudah merupakan padanan langsung dan alami dari teks Ibrani.
