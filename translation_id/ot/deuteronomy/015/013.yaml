base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/013.yaml
  text: And when you send him away free from you[a], you shall not send him away empty-handed.
translation:
  language: id
  text: Dan apabila engkau melepaskannya sebagai orang bebas dari padamu[a], janganlah engkau melepaskannya dengan tangan kosong.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan jika engkau melepaskannya sebagai orang bebas dari padamu.” Gabungan konjungsi Ibrani dapat dipahami secara kondisional (“jika”) atau temporal (“apabila/ketika”).
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/כִֽי
  choice: Dan apabila
  rationale: Gabungan konjungsi ini dapat bersifat temporal atau kondisional. Dalam konteks hukum yang mengantisipasi pembebasan pada waktunya, “Dan apabila” terdengar alami dan tetap cukup terbuka terhadap nuansa “ketika/jika”.
- source_word: תְשַׁלְּחֶנּוּ
  choice: membebaskannya / menyuruhnya pergi
  rationale: Kata kerja שלח dalam konteks ini berarti menyuruh pergi atau melepaskan. Pada klausa pertama, “membebaskannya” secara alami menyampaikan konteks pengakhiran pengabdian bersama חָפְשִׁי; pada klausa kedua, “menyuruhnya pergi” mempertahankan gambaran tindakan melepas kepergian tanpa menghasilkan ungkapan Indonesia yang kaku.
- source_word: חָפְשִׁי
  choice: membebaskan
  rationale: Adjektiva “bebas” dialihkan secara idiomatis ke dalam verba “membebaskan” bersama שלח, dengan tetap menyampaikan perubahan status dari pengabdian menjadi bebas.
- source_word: מֵעִמָּךְ
  choice: dari tempatmu
  rationale: Secara harfiah berarti “dari bersamamu.” “Dari tempatmu” mempertahankan relasi keberangkatan dari pihak tuan tanpa menambahkan tafsiran khusus seperti “dari pelayananmu” atau “dari rumah tanggamu.”
- source_word: לֹא
  choice: janganlah
  rationale: Bentuk larangan ini alami dalam bahasa Indonesia baku dan mempertahankan daya hukum dari negasi Ibrani dengan bentuk imperfek.
- source_word: רֵיקָם
  choice: dengan tangan kosong
  rationale: Ungkapan Indonesia ini secara idiomatis menyampaikan arti adverbial “kosong/tanpa bekal” dalam konteks pemberian bekal pada saat pembebasan.
theological_decisions:
- issue: Hubungan temporal atau kondisional pada וְכִי
  choice: apabila
  alternative: jika; ketika
  rationale: “Apabila” sesuai dengan ketentuan hukum yang memandang keadaan itu sebagai peristiwa yang akan terjadi, tetapi catatan kaki mempertahankan kemungkinan pembacaan kondisional dari konjungsi Ibrani.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Sapaan tunggal “engkau” dipertahankan karena hukum ini ditujukan kepada orang Israel secara individual. Susunan dibuat idiomatis tanpa memasukkan rincian yang tidak dinyatakan, seperti “pelayanan” atau “rumah tangga”.
