revisions:
- from: Jika di antara kamu ada seorang miskin, salah seorang saudaramu, di salah satu kotamu[a], di negeri yang diberikan Yahweh, Allahmu, kepadamu, janganlah keraskan hatimu dan janganlah tutup tanganmu terhadap saudaramu yang miskin itu.[b]
  to: Jika ada seorang miskin di antaramu, salah seorang dari saudara-saudaramu[b], di salah satu kotamu[a] di negeri yang Yahweh, Allahmu, berikan kepadamu, janganlah engkau mengeraskan hatimu atau menutup tanganmu terhadap saudaramu yang miskin itu.
  rationale: Revisi memperjelas konstruksi aktif mengenai Yahweh sebagai pemberi negeri, memperhalus kelancaran sintaksis Indonesia, dan menempatkan jangkar catatan kekerabatan pada kemunculan awal istilah. Makna, citra tangan yang tertutup, dan ambiguitas cakupan representatif istilah kekerabatan tetap dipertahankan.
