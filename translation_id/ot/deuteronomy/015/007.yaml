language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי יִהְיֶה֩ בְ/ךָ֨ אֶבְי֜וֹן מֵ/אַחַ֤ד אַחֶ֨י/ךָ֙ בְּ/אַחַ֣ד שְׁעָרֶ֔י/ךָ בְּ/אַ֨רְצְ/ךָ֔ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ לֹ֧א תְאַמֵּ֣ץ אֶת לְבָבְ/ךָ֗ וְ/לֹ֤א תִקְפֹּץ֙ אֶת יָ֣דְ/ךָ֔ מֵ/אָחִ֖י/ךָ הָ/אֶבְיֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/007.yaml
  text: If there is a poor man among you[a], one of your brothers, within one of your gates in your land that Yahweh your God is giving you[b], you shall not harden your heart or shut your hand against your poor brother.
translation:
  language: id
  text: Jika ada seorang miskin di antaramu, salah seorang dari saudara-saudaramu[b], di salah satu kotamu[a] di negeri yang Yahweh, Allahmu, berikan kepadamu, janganlah engkau mengeraskan hatimu atau menutup tanganmu terhadap saudaramu yang miskin itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di salah satu gerbangmu”; gerbang di sini merujuk pada kota atau permukiman.
    reason: lexical_alternative
  - marker: b
    text: “Saudara-saudara” dan “saudaramu” di sini adalah bahasa kekeluargaan untuk sesama anggota komunitas perjanjian.
    reason: cultural_note
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: Jika ... ada
  rationale: Menyampaikan kondisi dalam rumusan hukum kasuistik secara alami; bentuk yiqtol dipahami sebagai keadaan umum, bukan semata-mata masa depan.
- source_word: אֶבְיוֹן
  choice: seorang miskin
  rationale: Menunjuk orang yang miskin atau berkekurangan. Bentuk tunggal dipertahankan tanpa menambahkan kata 'laki-laki', karena bahasa Indonesia tidak menandai gender pada nomina ini.
- source_word: מֵאַחַד אַחֶיךָ
  choice: salah seorang saudaramu
  rationale: Mempertahankan bahasa kekeluargaan perjanjian dan bentuk tunggal yang menjadi anggota dari kelompok 'saudara-saudaramu'.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: di salah satu kotamu
  rationale: Secara harfiah berarti 'di salah satu gerbangmu', tetapi 'gerbang' di sini merupakan metonimia bagi kota atau permukiman. Makna kontekstual ditempatkan dalam teks utama dan citra harfiahnya dicatat dalam catatan kaki.
- source_word: בְּאַרְצְךָ אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: di negeri yang diberikan Yahweh, Allahmu, kepadamu
  rationale: Mempertahankan bingkai negeri sebagai pemberian ilahi; bentuk partisip Ibrani dapat menyatakan tindakan pemberian yang sedang berlangsung atau berciri tetap.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi agar nama pribadi dalam teks sumber tetap tampak, alih-alih menggantinya dengan gelar.
- source_word: לֹא תְאַמֵּץ אֶת לְבָבְךָ
  choice: janganlah keraskan hatimu
  rationale: Ungkapan Indonesia yang alami dan dekat dengan citra Ibrani tentang menjadikan hati keras atau tidak berbelaskasihan.
- source_word: וְלֹא תִקְפֹּץ אֶת יָדְךָ
  choice: dan janganlah tutup tanganmu
  rationale: Mempertahankan gambaran konkret tentang tangan yang ditutup sehingga bantuan tidak diberikan.
- source_word: מֵאָחִיךָ הָאֶבְיוֹן
  choice: terhadap saudaramu yang miskin itu
  rationale: Kata depan menyatakan arah penolakan terhadap saudara yang miskin; 'terhadap' menyampaikan relasi etis itu secara alami.
theological_decisions:
- issue: Bahasa kekerabatan אַחֶיךָ / אָחִיךָ dalam komunitas perjanjian
  choice: saudaramu
  alternative: sesamamu / sesama orang Israel
  rationale: Kata 'saudara' mempertahankan gambaran kekeluargaan yang digunakan teks untuk kewajiban terhadap anggota komunitas perjanjian. Catatan menjelaskan cakupannya tanpa menghapus metafora sumber.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Nama ilahi dipertahankan sebagai nama pribadi sesuai bukti teks sumber, tanpa menyelesaikan tradisi pembacaan dengan menggantinya menjadi gelar.
- issue: Cakupan gender kata אֶבְיוֹן dan אָח
  choice: seorang miskin / saudaramu
  alternative: orang yang berkekurangan / sesamamu
  rationale: Bahasa Indonesia memungkinkan bentuk yang alami tanpa penandaan gender eksplisit. 'Saudara' mempertahankan bahasa relasional Ibrani, sedangkan catatan menerangkan bahwa hukum ini berbicara tentang anggota komunitas perjanjian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang tegas dan bermartabat. Bentuk larangan 'janganlah' dipakai untuk mempertahankan kekuatan normatif, sementara susunan kalimat dibuat wajar bagi pembaca umum.
