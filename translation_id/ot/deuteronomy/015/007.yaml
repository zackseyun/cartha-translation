review_pass:
  verdict: revise
  source_fidelity: 'Draf pada umumnya setia pada struktur dan makna Ibrani: kondisi hukum, orang miskin sebagai salah seorang dari saudara, metonimia gerbang/kota, serta dua larangan dipertahankan. Namun, bentuk pasif "yang diberikan Yahweh, Allahmu, kepadamu" kurang langsung mencerminkan partisip aktif נֹתֵן (''yang Yahweh ... berikan/sedang berikan kepadamu'') dan tanda komanya mengganggu hubungan sintaktis.'
  naturalness: Bahasa baku dan register hukum sudah sesuai. Susunan "Jika di antara kamu ada" dapat dibuat lebih luwes menjadi "Jika ada ... di antaramu". "Janganlah keraskan hatimu" dapat dipahami, tetapi "janganlah engkau mengeraskan hatimu" lebih alami dalam bahasa Indonesia modern. Pengulangan "dan janganlah" secara literal dapat diringkas dengan "atau" tanpa kehilangan daya larangan.
  terminology: '"Yahweh" mempertahankan nama ilahi; "Allahmu" tepat. "Saudara" mempertahankan bahasa kekerabatan sumber. "Kota" adalah pengungkapan metonimia yang wajar apabila catatan harfiah tentang gerbang dipertahankan.'
  issues:
  - severity: medium
    issue: Klausa tentang negeri memakai pasif dan tanda koma yang tidak wajar.
    rationale: Ibrani berbunyi 'negerimu yang Yahweh, Allahmu, memberikan kepadamu'; subjek aktif Yahweh dan sifat pemberian ilahi sebaiknya tampak langsung dalam bahasa Indonesia.
  - severity: low
    issue: Penempatan catatan tentang istilah kekerabatan hanya di akhir ayat kurang dekat dengan kemunculan pertama istilah tersebut.
    rationale: Catatan itu menjelaskan kedua pemakaian 'saudara'; jangkar pada kemunculan pertama memberi pembaca penjelasan saat istilah diperkenalkan.
  revised_text: Jika ada seorang miskin di antaramu, salah seorang dari saudara-saudaramu[b], di salah satu kotamu[a] di negeri yang Yahweh, Allahmu, berikan kepadamu, janganlah engkau mengeraskan hatimu atau menutup tanganmu terhadap saudaramu yang miskin itu.
  revised_footnotes:
