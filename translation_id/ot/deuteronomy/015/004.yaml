  text: אֶ֕פֶס כִּ֛י לֹ֥א יִֽהְיֶה בְּ/ךָ֖ אֶבְי֑וֹן כִּֽי בָרֵ֤ךְ יְבָֽרֶכְ/ךָ֙ יְהוָ֔ה בָּ/אָ֕רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹֽתֵן לְ/ךָ֥ נַחֲלָ֖ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/004.yaml
  text: However[a], there should be no poor among you, because Yahweh will surely bless you in the land that Yahweh your God is giving you as an inheritance to possess,
translation:
  language: id
  text: Namun[a], seharusnya tidak ada orang miskin di antara kamu, sebab Yahweh pasti akan memberkati kamu di negeri yang sedang Yahweh, Allahmu, berikan kepadamu sebagai milik pusaka untuk kamu miliki.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “Meskipun demikian” atau “Hanya saja”. Kata Ibrani אֶפֶס menandai pembatasan terhadap ketentuan sebelumnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפֶס
  choice: Namun
  rationale: Menandai pembatasan atau kualifikasi terhadap ketentuan penghapusan utang sebelumnya; “Namun” menyampaikan peralihan wacana secara alami tanpa memperkeras pertentangan.
- source_word: אֶבְיוֹן
  choice: orang miskin
  rationale: Mengacu pada orang yang miskin atau berkekurangan secara ekonomi; pilihan ini luas, alami, dan mudah dipahami.
- source_word: כִּי
  choice: sebab
  rationale: כִּי yang kedua memperkenalkan alasan bagi pernyataan sebelumnya, yaitu berkat Yahweh.
- source_word: בָרֵךְ יְבָרֶכְךָ
  choice: pasti akan memberkati kamu
  rationale: Gabungan infinitif absolut dan verba finit memberi penegasan; “pasti akan” mempertahankan daya emfatis tanpa menambahkan gagasan tentang besarnya berkat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: נֹתֵן
  choice: diberikan
  rationale: Partisip Ibrani menggambarkan pemberian negeri sebagai tindakan yang sedang berlangsung atau pasti segera terwujud; bentuk pasif ini menghasilkan susunan Indonesia yang alami sambil mempertahankan Yahweh sebagai pemberi.
- source_word: נַחֲלָה
  choice: milik pusaka
  rationale: Istilah baku yang mempertahankan nuansa tanah warisan yang dianugerahkan dan dialokasikan dalam kerangka perjanjian.
- source_word: לְרִשְׁתָּהּ
  choice: untuk kamu duduki
  rationale: Verba ירשׁ dalam konteks tanah menunjuk pada mengambil dan memegang kepemilikan. “Duduki” alami untuk negeri serta menghindari pengulangan langsung sesudah “milik pusaka”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Ayat memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama perjanjian sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Hubungan ketiadaan orang miskin dengan berkat ilahi
  choice: Mempertahankan pernyataan alasan sebagaimana teks tanpa menjadikannya janji tanpa syarat
  alternative: Mengungkapkannya sebagai jaminan mutlak yang terlepas dari konteks ketaatan
  rationale: כִּי menyatakan alasan, tetapi konteks lanjutan pasal ini mengaitkan berkat dengan ketaatan. Terjemahan ayat tidak menambahkan syarat ataupun menghapus ketegangan kontekstual tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Tidak boleh ada” dipilih untuk menyampaikan daya normatif לֹא יִהְיֶה secara alami; sapaan tunggal kolektif Ibrani diterjemahkan dengan “kamu”, sesuai konteks Israel sebagai umat.
