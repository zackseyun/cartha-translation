id: DEU.15.11
reference: Deuteronomy 15:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֛י לֹא יֶחְדַּ֥ל אֶבְי֖וֹן מִ/קֶּ֣רֶב הָ/אָ֑רֶץ עַל כֵּ֞ן אָנֹכִ֤י מְצַוְּ/ךָ֙ לֵ/אמֹ֔ר פָּ֠תֹחַ תִּפְתַּ֨ח אֶת יָדְ/ךָ֜ לְ/אָחִ֧י/ךָ לַ/עֲנִיֶּ֛/ךָ וּ/לְ/אֶבְיֹנְ/ךָ֖ בְּ/אַרְצֶֽ/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/011.yaml
  text: For the poor will never cease from the midst of the land[a]; therefore I am commanding you, saying, ‘You must surely open your hand to your brother, to your afflicted one[b], and to your poor one in your land.’
translation:
  language: id
  text: 'Sebab orang miskin tidak akan pernah lenyap dari tengah-tengah negeri itu. Karena itu, aku memerintahkan kepadamu: “Bukalah tanganmu lebar-lebar bagi saudaramu, bagi orang yang tertindas[a] dan orang miskin di negerimu.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani yang diterjemahkan “orang yang tertindas” juga dapat berarti “orang miskin” atau “orang yang rendah.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan bagi perintah sebelumnya dan terdengar alami dalam bahasa Indonesia.
- source_word: לֹא יֶחְדַּל אֶבְיוֹן
  choice: orang miskin tidak akan pernah lenyap
  rationale: Bentuk tunggal אֶבְיוֹן berfungsi secara generik atau kolektif; frasa ini menyatakan kenyataan yang terus berlangsung.
- source_word: מִקֶּרֶב הָאָרֶץ
  choice: dari tengah-tengah negeri itu
  rationale: Mempertahankan unsur קֶרֶב, sedangkan 'negeri itu' menunjuk pada tanah perjanjian dalam konteks Ulangan.
- source_word: עַל כֵּן
  choice: Karena itu
  rationale: Menandai kesimpulan praktis yang ditarik dari kenyataan pada klausa pertama.
- source_word: אָנֹכִי מְצַוְּךָ לֵאמֹר
  choice: 'aku memerintahkan kepadamu:'
  rationale: Menyampaikan perintah langsung masa kini; tanda titik dua mengungkapkan fungsi לֵאמֹר secara wajar dalam bahasa Indonesia.
- source_word: פָּתֹחַ תִּפְתַּח אֶת יָדְךָ
  choice: Bukalah tanganmu lebar-lebar
  rationale: Infinitif absolut bersama verba finit memberi penegasan kuat. Ungkapan tangan terbuka dipertahankan sebagai metafora kemurahan hati.
- source_word: לְאָחִיךָ
  choice: bagi saudaramu
  rationale: Mempertahankan bahasa kekerabatan perjanjian dan bentuk maskulin tunggal representatif dalam sumber Ibrani.
- source_word: לַעֲנִיֶּךָ
  choice: bagi orang yang tertindas
  rationale: עָנִי dapat menunjuk kepada orang miskin, rendah, atau tertindas. Pilihan ini membedakannya dari אֶבְיוֹן yang muncul sesudahnya.
- source_word: וּלְאֶבְיֹנְךָ
  choice: dan orang miskin
  rationale: Mengungkapkan makna sosioekonomis אֶבְיוֹן dengan bahasa Indonesia yang alami; preposisi 'bagi' berlaku bagi kedua unsur yang dikoordinasikan.
- source_word: בְּאַרְצֶךָ
  choice: di negerimu
  rationale: Merujuk pada negeri perjanjian milik komunitas yang disapa, bukan pada bumi secara umum.
theological_decisions:
- issue: Bahasa kekerabatan representatif
  choice: saudaramu
  alternative: sesama orang Israel; kerabatmu
  rationale: Ibrani memakai istilah saudara laki-laki dalam sapaan perjanjian. Terjemahan mempertahankan citra kekeluargaan tanpa mempersempitnya melalui tafsiran tambahan.
- issue: Cakupan הָאָרֶץ dan אַרְצֶךָ
  choice: negeri itu; negerimu
  alternative: bumi; tanahmu
  rationale: Konteks langsung Ulangan menunjuk pada negeri perjanjian. 'Negeri' mempertahankan konteks tersebut tanpa menjadikan pernyataannya terutama tentang seluruh planet.
- issue: Hubungan antara kemiskinan yang terus ada dan kewajiban memberi
  choice: mempertahankan hubungan sebab-akibat teks
  alternative: menafsirkan kemiskinan sebagai ketetapan normatif atau alasan untuk pasrah
  rationale: Ayat ini menjadikan keberadaan orang miskin sebagai alasan untuk kemurahan hati yang terus-menerus, tanpa menjelaskan secara sistematis asal atau tujuan kemiskinan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Bentuk 'aku' mengikuti ujaran langsung ilahi dan 'kepadamu/negerimu' mempertahankan sapaan tunggal. Pengulangan 'bagi' dan metafora tangan terbuka dijaga agar struktur serta tekanan sumber tetap terasa tanpa menjadi kaku.
