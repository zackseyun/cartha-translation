source:
  edition: WLC
  text: הִשָּׁ֣מֶר לְ/ךָ֡ פֶּן יִהְיֶ֣ה דָבָר֩ עִם לְבָבְ/ךָ֨ בְלִיַּ֜עַל לֵ/אמֹ֗ר קָֽרְבָ֣ה שְׁנַֽת הַ/שֶּׁבַע֮ שְׁנַ֣ת הַ/שְּׁמִטָּה֒ וְ/רָעָ֣ה עֵֽינְ/ךָ֗ בְּ/אָחִ֨י/ךָ֙ הָֽ/אֶבְי֔וֹן וְ/לֹ֥א תִתֵּ֖ן ל֑/וֹ וְ/קָרָ֤א עָלֶ֨י/ךָ֙ אֶל יְהוָ֔ה וְ/הָיָ֥ה בְ/ךָ֖ חֵֽטְא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/009.yaml
  text: Be careful lest there be in your heart a wicked thought[a], saying, ‘The seventh year, the year of release, is near,’ and your eye be evil toward your poor brother and you give him nothing; then he may cry out against you to Yahweh[c][b], and it will be sin in you.
translation:
  language: id
  text: Waspadalah, jangan sampai timbul dalam hatimu pikiran jahat dengan berkata, “Tahun ketujuh, tahun pembebasan, sudah dekat,”[a] lalu engkau menjadi kikir terhadap saudaramu yang miskin[b] dan tidak memberikan apa pun kepadanya.[c] Maka ia dapat berseru kepada Yahweh mengadukan engkau, dan hal itu akan menjadi dosa bagimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Tahun pembebasan” juga dapat diterjemahkan “tahun penghapusan utang.” Pada tahun ketujuh, utang dalam komunitas Israel harus dilepaskan menurut ketentuan bagian ini.
    reason: lexical_alternative
  - marker: b
    text: “Saudara” di sini menunjuk kepada sesama anggota umat perjanjian, tidak harus saudara kandung.
    reason: cultural_note
  - marker: c
    text: Secara harfiah, “matamu jahat terhadap saudaramu”—idiom Ibrani bagi sikap kikir atau enggan menolong orang yang berkekurangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Waspadalah
  rationale: Bentuk perintah ini merupakan peringatan agar seseorang menjaga dirinya sendiri. “Waspadalah” alami dalam bahasa Indonesia dan mempertahankan daya peringatannya.
- source_word: פֶּן יִהְיֶה דָבָר עִם לְבָבְךָ בְלִיַּעַל
  choice: agar jangan timbul dalam hatimu pikiran keji
  rationale: דָבָר dalam konteks batin dan diikuti לֵאמֹר menunjuk kepada pikiran atau niat. בְלִיַּעַל di sini merupakan penilaian moral, bukan nama diri; “keji” menyampaikan keburukan niat tersebut.
- source_word: קָרְבָה
  choice: sudah dekat
  rationale: Bentuk perfektif menyatakan kedekatan yang kini relevan dalam ucapan batin. “Sudah dekat” merupakan ungkapan Indonesia yang alami.
- source_word: שְׁנַת הַשֶּׁבַע שְׁנַת הַשְּׁמִטָּה
  choice: Tahun ketujuh, tahun pembebasan
  rationale: שְׁמִטָּה menunjuk pada pelepasan atau penghapusan kewajiban pada tahun ketujuh. “Pembebasan” mempertahankan cakupan istilah tanpa membatasi teks utama secara berlebihan; konteks utang dijelaskan dalam catatan kaki.
- source_word: וְרָעָה עֵינְךָ
  choice: engkau memandang ... dengan hati kikir
  rationale: Secara harfiah ungkapan ini mengatakan bahwa mata menjadi jahat, sebuah idiom Ibrani untuk sikap kikir atau enggan menolong. Terjemahan idiomatis dipakai dalam teks utama agar tidak disalahpahami sebagai ilmu gaib atau tatapan yang mencelakakan.
- source_word: בְּאָחִיךָ הָאֶבְיוֹן
  choice: saudaramu yang miskin
  rationale: אָח mempertahankan bahasa kekeluargaan dalam komunitas perjanjian, sedangkan אֶבְיוֹן menunjuk kepada orang miskin atau berkekurangan.
- source_word: וְלֹא תִתֵּן לוֹ
  choice: dan tidak memberikan apa pun kepadanya
  rationale: Negasi kata kerja “memberikan” dalam konteks ini menyatakan penolakan untuk memberi bantuan atau pinjaman. “Apa pun” mengungkapkan akibat praktisnya tanpa menentukan bentuk pemberian.
- source_word: וְקָרָא עָלֶיךָ אֶל יְהוָה
  choice: Jika ia berseru kepada Yahweh untuk mengadukan engkau
  rationale: קרא על ... אל mengandung nuansa seruan pengaduan terhadap seseorang kepada Allah. “Jika” secara alami menyampaikan akibat yang mungkin terjadi dalam peringatan ini, sementara “berseru” mempertahankan citra sumber.
- source_word: וְהָיָה בְךָ חֵטְא
  choice: hal itu akan menjadi dosa bagimu
  rationale: Terjemahan ini dekat dengan susunan Ibrani dan mempertahankan pernyataan bahwa penolakan tersebut diperhitungkan sebagai dosa bagi pelakunya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
theological_decisions:
- issue: Makna tahun שְׁמִטָּה
  choice: tahun pembebasan
  alternative: tahun penghapusan utang
  rationale: Istilah sumber dapat menekankan pelepasan atau penghapusan kewajiban. Karena konteks pasal ini menyangkut utang, alternatif yang lebih khusus dicatat, tetapi teks utama mempertahankan istilah yang lebih luas.
- issue: Idiom “mata jahat”
  choice: ditafsirkan secara idiomatis sebagai memandang dengan hati kikir
  alternative: matamu menjadi jahat terhadap saudaramu
  rationale: Ungkapan harfiah berisiko dipahami dalam bahasa Indonesia sebagai tatapan gaib atau niat mencelakakan. Terjemahan utama menyampaikan fungsi idiomnya, sedangkan bentuk harfiahnya dipertahankan dalam catatan kaki.
- issue: Cakupan אָחִיךָ
  choice: saudaramu
  alternative: sesama anggota umat perjanjian
  rationale: Kata maskulin tunggal dan bahasa kekeluargaan sumber dipertahankan. Catatan menjelaskan bahwa yang dimaksud dalam konteks hukum ini bukan hanya saudara kandung.
- issue: Nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama ilahi secara langsung; transliterasi mempertahankan pembedaan antara nama tersebut dan gelar umum bagi Tuhan.
- issue: Daya pernyataan וְהָיָה בְךָ חֵטְא
  choice: hal itu akan menjadi dosa bagimu
  alternative: engkau akan menanggung kesalahan
  rationale: Pilihan utama mempertahankan istilah חֵטְא sebagai “dosa” dan tidak mengubahnya semata-mata menjadi akibat hukum atau perasaan bersalah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-nasihat yang khidmat. Pronomina tunggal “engkau” mempertahankan sapaan langsung sumber. Struktur kalimat dipecah secukupnya agar mudah dibaca, tanpa menghilangkan urutan peringatan, pikiran batin, tindakan, pengaduan, dan akibat moral.
