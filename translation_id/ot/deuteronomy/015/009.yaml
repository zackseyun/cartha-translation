revisions:
- from: 'Waspadalah agar jangan timbul dalam hatimu pikiran keji: “Tahun ketujuh, tahun pembebasan, sudah dekat.”[a] Lalu engkau memandang saudaramu yang miskin[b] dengan hati kikir[c] dan tidak memberikan apa pun kepadanya. Jika ia berseru kepada Yahweh untuk mengadukan engkau, hal itu akan menjadi dosa bagimu.'
