  text: וְ/זֶה֮ דְּבַ֣ר הַ/שְּׁמִטָּה֒ שָׁמ֗וֹט כָּל בַּ֨עַל֙ מַשֵּׁ֣ה יָד֔/וֹ אֲשֶׁ֥ר יַשֶּׁ֖ה בְּ/רֵעֵ֑/הוּ לֹֽא יִגֹּ֤שׂ אֶת רֵעֵ֨/הוּ֙ וְ/אֶת אָחִ֔י/ו כִּֽי קָרָ֥א שְׁמִטָּ֖ה לַֽ/יהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/002.yaml
  text: 'And this is the matter of the release: every creditor shall release what his hand has lent to his neighbor[a]. He shall not press his neighbor or his brother[b], because a release to Yahweh has been proclaimed.'
translation:
  language: id
  text: '“Beginilah ketentuan tentang pembebasan utang[a]: setiap pemilik piutang harus melepaskan tuntutan atas apa yang dipinjamkannya kepada sesamanya. Ia tidak boleh menagih sesamanya dan saudaranya[b], karena pembebasan utang bagi Yahweh telah diumumkan.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani shemittah dapat juga diterjemahkan “pelepasan” atau “penghapusan”. Dalam konteks tahun sabat, istilah ini menunjuk pada pelepasan resmi tuntutan atas utang.
    reason: lexical_alternative
  - marker: b
    text: “Saudara” di sini menunjuk pada sesama anggota umat perjanjian; terjemahan yang lebih interpretatif dapat memakai “sesama orang Israel”.
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר
  choice: ketentuan
  rationale: Dalam frasa hukum ini, kata tersebut menunjuk pada aturan atau ketetapan yang kemudian dijelaskan, bukan sekadar ‘perkataan’.
- source_word: הַשְּׁמִטָּה / שְׁמִטָּה
  choice: pembebasan utang
  rationale: Nomina ini menunjuk pada pelepasan tuntutan utang pada tahun sabat. Penambahan ‘utang’ membuat konteks ekonominya jelas tanpa memastikan secara berlebihan apakah pokok utang dihapus selamanya atau tuntutan penagihannya dilepaskan.
- source_word: שָׁמוֹט
  choice: harus melepaskan tuntutan
  rationale: Infinitif absolut menegaskan kewajiban untuk melepaskan. Ungkapan ini alami dalam bahasa hukum Indonesia dan menjaga fokus pada pelepasan klaim kreditor.
- source_word: בַּעַל מַשֵּׁה יָדוֹ
  choice: setiap pemilik piutang
  rationale: Idiom Ibrani ini menunjuk pada orang yang memegang klaim karena telah memberi pinjaman. ‘Pemilik piutang’ menyampaikan peran hukumnya secara ringkas dan wajar.
- source_word: אֲשֶׁר יַשֶּׁה בְּרֵעֵהוּ
  choice: atas apa yang dipinjamkannya kepada sesamanya
  rationale: Bentuk Hifil menyatakan tindakan memberi pinjaman atau menjadikan seseorang berutang. Terjemahan ini jelas dan tetap dekat dengan susunan sumber.
- source_word: לֹא יִגֹּשׂ
  choice: tidak boleh menagih
  rationale: Verba ini berarti mendesak atau menuntut pembayaran dari seorang yang berutang. ‘Menagih’ merupakan padanan Indonesia yang alami dalam konteks utang.
- source_word: רֵעֵהוּ
  choice: sesamanya
  rationale: Padanan ini alami bagi rekan dalam lingkungan sosial-perjanjian dan tidak membatasi maknanya pada orang yang tinggal berdekatan.
- source_word: אָחִיו
  choice: saudaranya
  rationale: Terjemahan mempertahankan istilah kekerabatan maskulin tunggal dari teks Ibrani, sambil membiarkan konteks menunjukkan bahwa yang dimaksud adalah sesama anggota umat perjanjian.
- source_word: כִּי קָרָא
  choice: karena ... telah diumumkan
  rationale: Bentuk perfek tanpa subjek yang dinyatakan berfungsi secara impersonal; konstruksi pasif Indonesia menyampaikan adanya pengumuman resmi dengan alami.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi menandai hubungan pembebasan itu dengan Yahweh, baik sebagai sesuatu yang diperuntukkan bagi-Nya maupun diumumkan demi penghormatan kepada-Nya. ‘Bagi’ mempertahankan keluwesan hubungan tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. Bentuk ‘Yahweh’ mempertahankan nama perjanjian itu dan mengikuti kebijakan proyek tanpa menggantinya dengan gelar.
- issue: Cakupan pembebasan tahun sabat
  choice: melepaskan tuntutan atas piutang
  alternative: menghapus seluruh utang secara permanen; hanya menangguhkan penagihan selama setahun
  rationale: Kata שְׁמִטָּה dan perintah untuk tidak menagih jelas mengharuskan pelepasan klaim penagihan, tetapi ayat ini sendiri tidak menjelaskan seluruh rincian durasi atau akibat hukumnya. Terjemahan tidak memaksakan salah satu penafsiran tersebut.
- issue: Makna sosial אָחִיו
  choice: saudaranya
  alternative: sesama orang Israel; kerabatnya
  rationale: Istilah harfiah dipertahankan dalam teks utama; catatan menjelaskan daya cakup komunalnya tanpa mengganti kata sumber dengan tafsiran yang lebih khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum yang tetap mudah dipahami. ‘Beginilah ketentuan’ menyajikan rumusan aturan secara alami; ‘pemilik piutang’ dan ‘menagih’ mempertahankan konteks legal-ekonominya. Nama ilahi ditulis ‘Yahweh’.
