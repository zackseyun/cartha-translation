base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/014.yaml
  text: You shall surely furnish him from your flock[a], from your threshing floor, and from your winepress; from what Yahweh your God has blessed you with, you shall give to him.
translation:
  language: id
  text: Haruslah engkau membekali dia dengan berlimpah dari kawanan ternakmu,[a] dari tempat pengirikanmu, dan dari tempat pemerasan anggurmu. Dari segala yang telah Yahweh, Allahmu, limpahkan kepadamu, berikanlah kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Haruslah engkau sungguh-sungguh membekali dia.” Bentuk verbal Ibrani menegaskan perintah untuk menyediakan bekal secara berlimpah bagi orang yang dibebaskan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעֲנֵיק תַּעֲנִיק
  choice: Engkau harus membekali dia
  rationale: Bentuk infinitif absolut yang disertai verba finit menegaskan perintah. Kata 'harus' menyampaikan daya wajib dan penegasan secara wajar dalam bahasa Indonesia, sedangkan 'membekali' menunjukkan pemberian persediaan yang memadai ketika ia dibebaskan.
- source_word: מִצֹּאנְךָ
  choice: dari kawanan ternakmu
  rationale: צאן adalah sebutan kolektif bagi ternak kecil, terutama domba dan kambing. 'Kawanan ternak' mempertahankan gambaran agraris tanpa membatasi maknanya pada satu jenis hewan.
- source_word: וּמִגָּרְנְךָ
  choice: dari tempat pengirikanmu
  rationale: גֹּרֶן secara harfiah adalah tempat pengirikan dan secara metonimis menunjuk hasil biji-bijian. Terjemahan ini mempertahankan citra konkret dan rangkaian tiga sumber pemberian.
- source_word: וּמִיִּקְבֶךָ
  choice: dari tempat pemerasan anggurmu
  rationale: יֶקֶב menunjuk tempat pemerasan atau bak penampung anggur. Ungkapan ini jelas bagi pembaca Indonesia dan mempertahankan gambaran pertanian teks.
- source_word: אֲשֶׁר בֵּרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: Dari apa yang Yahweh, Allahmu, telah berikan kepadamu sebagai berkat
  rationale: Rumusan ini mempertahankan gagasan bahwa pemberian kepada orang yang dibebaskan berasal dari berkat Allah, sekaligus menghasilkan bahasa Indonesia yang alami. Klausa relatif Ibrani dapat mengandung nuansa sumber dan ukuran tanpa menetapkan jumlah tertentu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama perjanjian dalam teks sumber tetap tampak.
- source_word: תִּתֶּן לוֹ
  choice: haruslah engkau memberikan kepadanya
  rationale: Klausa penutup menegaskan kembali kewajiban memberi dan mempertahankan unsur 'kepadanya' dari לֹו.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memuat Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar atau memilih bentuk vokalisasi alternatif.
- issue: Kadar kelimpahan dalam perintah הַעֲנֵיק תַּעֲנִיק
  choice: menyampaikan penegasan melalui 'harus' tanpa menambahkan 'dengan murah hati' dalam teks utama
  alternative: Engkau harus membekali dia dengan limpahnya
  rationale: Konstruksi Ibrani jelas menegaskan kewajiban, sedangkan kadar kelimpahan yang tepat tidak dinyatakan secara terpisah. Pilihan utama menghindari penyelesaian berlebihan atas nuansa leksikal; alternatif dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti tunggal 'engkau' mempertahankan sapaan hukum kepada tiap anggota umat. Istilah pertanian konkret dipertahankan, sementara struktur kalimat dipecah menjadi dua agar alami dan mudah dipahami.
