  text: כִּֽי יִמָּכֵ֨ר לְ/ךָ֜ אָחִ֣י/ךָ הָֽ/עִבְרִ֗י א֚וֹ הָֽ/עִבְרִיָּ֔ה וַ/עֲבָֽדְ/ךָ֖ שֵׁ֣שׁ שָׁנִ֑ים וּ/בַ/שָּׁנָה֙ הַ/שְּׁבִיעִ֔ת תְּשַׁלְּחֶ֥/נּוּ חָפְשִׁ֖י מֵ/עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/012.yaml
  text: If your brother[a], a Hebrew man or a Hebrew woman, is sold to you and serves you six years, then in the seventh year you shall send him out free from you.
translation:
  language: id
  text: Apabila saudaramu, seorang laki-laki Ibrani atau perempuan Ibrani, dijual kepadamu dan melayanimu selama enam tahun, maka pada tahun ketujuh engkau harus menyuruh dia[a] pergi sebagai orang merdeka dari padamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sesudah menyebut “seorang laki-laki Ibrani atau perempuan Ibrani”, teks Ibrani memakai bentuk maskulin tunggal untuk orang yang disuruh pergi. Ketentuan ini berlaku bagi laki-laki maupun perempuan Ibrani.
    reason: Menjelaskan peralihan gramatikal ke bentuk maskulin tunggal yang tidak tampak dalam pronomina Indonesia “dia”.
lexical_decisions:
- source_word: יִמָּכֵר
  choice: dijual kepadamu
  rationale: Bentuk nifal dari מכר paling langsung menyatakan tindakan pasif, tanpa menentukan apakah orang itu menjual dirinya sendiri atau dijual melalui mekanisme lain.
- source_word: אָחִיךָ
  choice: saudaramu
  rationale: Mempertahankan bahasa kekeluargaan dan perjanjian dalam teks Ibrani; dalam bahasa Indonesia, “saudara” juga dapat mencakup laki-laki maupun perempuan menurut konteks.
- source_word: הָעִבְרִי ... הָעִבְרִיָּה
  choice: seorang laki-laki Ibrani atau perempuan Ibrani
  rationale: Mencerminkan bentuk maskulin dan feminin yang secara eksplisit menyebut orang Ibrani laki-laki maupun perempuan, tanpa menambahkan kata “budak” yang tidak terdapat dalam frasa ini.
- source_word: וַעֲבָדְךָ
  choice: dan melayanimu
  rationale: עבד di sini menyatakan kerja atau pelayanan yang diberikan kepada pihak yang disapa; “melayanimu” tetap luas dan sesuai dengan konteks hukum.
- source_word: שֵׁשׁ שָׁנִים
  choice: selama enam tahun
  rationale: Kata “selama” membuat durasi pelayanan jelas dan alami dalam bahasa Indonesia.
- source_word: וּבַשָּׁנָה הַשְּׁבִיעִת
  choice: maka pada tahun ketujuh
  rationale: Mengungkapkan urutan hukum setelah masa pelayanan enam tahun dengan jelas.
- source_word: תְּשַׁלְּחֶנּוּ
  choice: engkau harus melepas dia
  rationale: שלח secara dasar berarti mengirim atau menyuruh pergi; dalam konteks pembebasan dari pelayanan, “melepas” menyampaikan tindakan membiarkan orang itu pergi tanpa mengaburkan status bebasnya.
- source_word: חָפְשִׁי
  choice: sebagai orang merdeka
  rationale: Menunjukkan status bebas orang yang dilepas, bukan sekadar cara ia pergi.
- source_word: מֵעִמָּךְ
  choice: dari sisimu
  rationale: Mencerminkan ungkapan harfiah “dari bersama engkau” dan menyatakan bahwa orang itu meninggalkan lingkungan atau pelayanan pihak yang disapa.
theological_decisions:
- issue: Bentuk maskulin tunggal setelah penyebutan laki-laki dan perempuan Ibrani
  choice: Menggunakan pronomina Indonesia yang netral gender, “dia”, sambil menjelaskan bentuk Ibrani dalam catatan kaki.
  alternative: Mengulang “laki-laki atau perempuan itu” dalam teks utama.
  rationale: Teks Ibrani lebih dahulu menyebut laki-laki dan perempuan, lalu memakai akhiran pronomina dan kata sifat maskulin tunggal. Bahasa Indonesia tidak membedakan gender pada “dia”; catatan kaki mempertahankan informasi gramatikal sumber sekaligus menjelaskan bahwa ketentuan itu berlaku bagi keduanya.
translation_notes:
  register: Bahasa hukum yang lugas dan bermartabat, dengan sapaan tunggal “engkau” untuk mempertahankan bentuk orang kedua tunggal Ibrani. Ungkapan “sebagai orang merdeka” memperjelas status hukum חָפְשִׁי, sedangkan “dari sisimu” mempertahankan citra sumber tanpa menjadi janggal.
