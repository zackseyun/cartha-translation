id: DEU.15.15
reference: Deuteronomy 15:15
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם וַֽ/יִּפְדְּ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ עַל כֵּ֞ן אָנֹכִ֧י מְצַוְּ/ךָ֛ אֶת הַ/דָּבָ֥ר הַ/זֶּ֖ה הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/015.yaml
  text: And you shall remember that you were a servant in the land of Egypt[a], and Yahweh your God redeemed you[c][b]; therefore I am commanding you this today.
translation:
  language: id
  text: Ingatlah bahwa engkau dahulu seorang budak di tanah Mesir, dan Yahweh, Allahmu, telah menebus engkau[a]. Itulah sebabnya aku memerintahkan hal ini kepadamu pada hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membayar tebusan untuk membebaskan engkau.” Kata Ibrani ini mengandung gagasan menebus atau membebaskan dari perbudakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Ingatlah
  rationale: Dalam konteks hukum dan nasihat perjanjian, bentuk ini berfungsi sebagai perintah. Bentuk imperatif Indonesia paling alami dan tetap mempertahankan daya perintahnya.
- source_word: עֶבֶד
  choice: budak
  rationale: Dalam konteks perbudakan Israel di Mesir, istilah ini menunjuk status terikat dan tertindas, sehingga 'budak' lebih tepat daripada 'hamba' atau 'pelayan'.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: di tanah Mesir
  rationale: Mempertahankan ungkapan konkret Ibrani 'tanah Mesir' dan corak sejarah perjanjian.
- source_word: וַיִּפְדְּךָ
  choice: telah menebus engkau
  rationale: Kata פדה menyatakan pembebasan melalui penebusan atau pembayaran tebusan. 'Menebus' mempertahankan jangkauan makna dan resonansi teologisnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi secara langsung dan konsisten.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Mewakili bentuk dengan akhiran orang kedua tunggal secara ringkas dan wajar dalam bahasa Indonesia.
- source_word: עַל כֵּן
  choice: Itulah sebabnya
  rationale: Menandai hubungan sebab-akibat yang tegas antara pembebasan Israel dan perintah yang kini diberikan.
- source_word: אָנֹכִי מְצַוְּךָ
  choice: aku memerintahkan ... kepadamu
  rationale: Partisip dengan pronomina eksplisit menyatakan tindakan memerintah yang sedang berlaku; susunan Indonesia ini alami tanpa kehilangan penekanan pembicara.
- source_word: אֶת הַדָּבָר הַזֶּה
  choice: hal ini
  rationale: דבר luas maknanya dan di sini merujuk pada ketentuan yang sedang dibicarakan. 'Hal ini' lebih alami daripada 'perkara ini' dan tidak mempersempitnya menjadi satu perintah tertentu.
- source_word: הַיּוֹם
  choice: pada hari ini
  rationale: Mempertahankan keformalan dan kemendesakan waktu dalam seruan perjanjian.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian secara langsung; 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Status sosial עֶבֶד dalam ingatan akan Mesir
  choice: budak
  alternative: hamba
  rationale: Konteks Mesir menonjolkan keterikatan dan penindasan. 'Budak' menyampaikan bobot historis dan moralnya dengan lebih jelas.
- issue: Makna פדה
  choice: menebus
  alternative: membebaskan atau membayar tebusan bagi
  rationale: '''Menebus'' menjaga baik gagasan pembebasan dari perbudakan maupun nuansa tebusan, tanpa menetapkan mekanisme yang tidak dijelaskan ayat ini.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina tunggal 'engkau' mempertahankan sapaan individual dalam teks Ibrani; 'aku' mengikuti suara Musa sebagai pembicara. Susunan dibuat alami bagi pembaca umum sambil mempertahankan hubungan sebab-akibat dan istilah utama sumber.
