  yaml_path: translation/ot/deuteronomy/015/001.yaml
  text: At the end of every seven years you shall make a release[a].
translation:
  language: id
  text: Pada akhir setiap tujuh tahun, kamu harus mengadakan pembebasan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penghapusan” atau “pelepasan tagihan”; kata Ibrani שְׁמִטָּה menunjuk pada pembebasan yang diberlakukan dalam hukum utang tahun ketujuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֵּץ
  choice: Pada akhir
  rationale: Gabungan מִן dengan קֵץ menyatakan waktu pada penghujung suatu masa. “Pada akhir” alami dalam bahasa Indonesia dan tidak menentukan secara berlebihan titik pelaksanaannya.
- source_word: שֶׁבַע שָׁנִים
  choice: setiap tujuh tahun
  rationale: Secara harfiah berarti “tujuh tahun”; konteks hukum menunjukkan siklus yang berulang, sehingga “setiap tujuh tahun” menyampaikan maksudnya dengan jelas.
- source_word: תַּעֲשֶׂה
  choice: kamu harus mengadakan
  rationale: Kata עשה berarti “melakukan/membuat”. Dengan שְׁמִטָּה sebagai objek, “mengadakan” secara alami menyatakan pemberlakuan ketentuan hukum dan mempertahankan daya perintahnya.
- source_word: שְׁמִטָּה
  choice: pembebasan utang
  rationale: שְׁמִטָּה pada dasarnya berarti pelepasan atau pembiaran jatuh; konteks langsung menjelaskan bahwa yang dilepaskan ialah tagihan utang. “Pembebasan utang” jelas bagi pembaca modern, sedangkan catatan kaki mempertahankan alternatif leksikal.
theological_decisions:
- issue: Apakah שְׁמִטָּה berarti penangguhan penagihan atau penghapusan utang secara permanen
  choice: pembebasan utang
  alternative: penghapusan utang; pelepasan tagihan
  rationale: Ayat ini hanya menamai ketetapan tersebut, sementara rincian ayat-ayat berikutnya menentukan penerapannya. “Pembebasan utang” mempertahankan ruang bagi ketegangan penafsiran tentang sifat dan jangka waktunya tanpa menetapkan suatu sistem teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang lugas dan bermartabat. Pronomina “kamu” mempertahankan sapaan orang kedua tunggal kolektif dalam teks Ibrani.
