  text: then you shall take the awl and put it through his ear and into the door[a], and he shall be your servant permanently. And you shall do the same for your female servant.
translation:
  language: id
  text: maka ambillah sebuah alat penusuk dan tusukkanlah itu menembus telinganya hingga ke pintu, dan ia akan menjadi budakmu seumur hidup.[a] Lakukanlah hal yang sama terhadap budak perempuanmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “untuk selamanya”; dalam konteks hukum ini, ungkapan Ibrani tersebut dapat berarti “seumur hidup” atau “secara permanen”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּרְצֵעַ
  choice: sebuah penusuk
  rationale: מַרְצֵעַ adalah alat runcing untuk melubangi atau menusuk. “Penusuk” jelas dan wajar dalam bahasa Indonesia, sedangkan istilah teknis seperti “unting-unting” tidak umum dipahami.
- source_word: וְנָתַתָּה בְאָזְנוֹ וּבַדֶּלֶת
  choice: tusukkanlah itu menembus telinganya sampai ke pintu
  rationale: Ungkapan Ibrani secara harfiah menyebut menaruh alat itu pada telinga dan pada pintu. Dalam konteks alat penusuk, tindakan yang dimaksud adalah menusuk telinga hingga mengenai atau masuk ke pintu. Rumusan ini menjelaskan tindakan tanpa menambahkan rincian yang tidak terdapat dalam teks.
- source_word: עֶבֶד
  choice: budak
  rationale: Konteks hukum ini menegaskan status keterikatan yang resmi. “Budak” mempertahankan bobot sosial-hukum עֶבֶד dengan lebih tepat daripada “pelayan”.
- source_word: עוֹלָם
  choice: seumur hidup
  rationale: Dalam konteks hukum mengenai masa pengabdian manusia, עוֹלָם menunjuk pada status yang berlangsung tetap sepanjang hidup, bukan keabadian metafisis. Catatan kaki mempertahankan bentuk harfiahnya.
- source_word: אֲמָתְךָ
  choice: budak perempuanmu
  rationale: אָמָה menunjuk pada budak atau hamba perempuan. “Budak perempuanmu” mempertahankan status keterikatan dan selaras dengan penerjemahan עֶבֶד.
- source_word: וְאַף לַאֲמָתְךָ תַּעֲשֶׂה כֵּן
  choice: Lakukanlah hal yang sama terhadap budak perempuanmu
  rationale: Rumusan ini menyampaikan perluasan ketentuan yang sama kepada budak perempuan secara alami dan jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Istilah bagi status perbudakan dalam hukum Israel
  choice: budak / budak perempuan
  alternative: hamba / pelayan / hamba perempuan
  rationale: Ayat ini membahas status keterikatan hukum yang ditandai melalui suatu upacara. “Budak” mempertahankan daya sosial-hukum istilah sumber tanpa melunakkannya atau memasukkan kesimpulan doktrinal tambahan.
- issue: Cakupan waktu עוֹלָם
  choice: seumur hidup
  alternative: untuk selamanya / secara permanen
  rationale: Dalam ketentuan hukum mengenai seorang manusia, ungkapan ini paling wajar dipahami sebagai status sepanjang hidup. Karena bentuk Ibraninya juga dapat diterjemahkan secara lebih harfiah sebagai “untuk selamanya”, alternatif itu dicantumkan dalam catatan kaki agar keluasan maknanya tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Bentuk imperatif “ambillah”, “tusukkanlah”, dan “lakukanlah” mempertahankan corak ketentuan hukum. Istilah “budak” dipakai secara konsisten untuk menyatakan status sosial-hukum dalam teks sumber.
