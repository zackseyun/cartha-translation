base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/018.yaml
  text: It shall not seem hard to you when you send him away free from you[a], because for six years he has served you for double the wages of a hired worker; and Yahweh your God will bless you in all that you do.
translation:
  language: id
  text: Janganlah engkau menganggapnya berat ketika melepaskannya sebagai orang bebas darimu, sebab selama enam tahun ia telah bekerja bagimu dengan nilai yang setara dengan dua kali upah seorang pekerja upahan.[a] Yahweh, Allahmu, akan memberkati engkau dalam segala sesuatu yang kaulakukan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “sebab ia telah melayanimu enam tahun [dengan] dua kali upah seorang pekerja upahan.” Ungkapan Ibrani yang padat ini membandingkan nilai enam tahun pelayanannya dengan upah pekerja upahan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְשֶׁה בְעֵינֶיךָ
  choice: Janganlah engkau merasa berat
  rationale: Ungkapan Ibrani yang secara harfiah berarti ‘janganlah hal itu berat di matamu’ menyatakan bahwa sesuatu dipandang memberatkan atau menyusahkan. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan penilaian dari sudut pandang orang yang disapa.
- source_word: בְּשַׁלֵּחֲךָ אֹתוֹ חָפְשִׁי
  choice: ketika melepaskan dia sebagai orang merdeka
  rationale: Bentuk infinitif dengan preposisi menyatakan waktu atau keadaan, sedangkan חָפְשִׁי menegaskan status bebas, bukan sekadar menyuruh pergi.
- source_word: מֵעִמָּךְ
  choice: dari sisimu
  rationale: Terjemahan ini mempertahankan makna relasional-spasial frasa Ibrani tanpa mempersempitnya menjadi ‘dari pekerjaanmu’ atau ‘dari rumah tanggamu’.
- source_word: מִשְׁנֶה שְׂכַר שָׂכִיר
  choice: senilai dua kali upah seorang pekerja upahan
  rationale: מִשְׁנֶה menyatakan jumlah ganda, dan frasa tersebut membandingkan nilai enam tahun pelayanan dengan upah tenaga sewaan. ‘Senilai’ membuat hubungan maknanya jelas tanpa menutup kemungkinan sintaksis lain yang dicatat dalam catatan kaki.
- source_word: עֲבָדְךָ
  choice: ia telah bekerja bagimu
  rationale: Bentuk ini berfungsi sebagai verba, ‘ia telah melayani/bekerja bagimu’. Dalam konteks hukum ini statusnya sebagai hamba terikat sudah jelas, sedangkan klausa tersebut menyoroti pekerjaan yang diberikannya.
- source_word: שֵׁשׁ שָׁנִים
  choice: selama enam tahun
  rationale: Ungkapan waktu ini menunjukkan durasi dan diterjemahkan secara alami dalam bahasa Indonesia.
- source_word: וּבֵרַכְךָ יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Allahmu, akan memberkati engkau
  rationale: Dalam konteks ini bentuk verbal menyampaikan janji berkat pada masa mendatang. Nama perjanjian יְהוָה ditransliterasikan sebagai ‘Yahweh’.
- source_word: בְּכֹל אֲשֶׁר תַּעֲשֶׂה
  choice: dalam segala sesuatu yang kaulakukan
  rationale: Pilihan ini mempertahankan cakupan luas ungkapan Ibrani dan terdengar wajar dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Apakah status perhambaan perlu ditonjolkan dalam עֲבָדְךָ
  choice: ia telah bekerja bagimu
  alternative: hambamu telah melayani engkau
  rationale: Bentuk Ibraninya bersifat verbal dan menekankan nilai kerja yang diberikan. Status terikat orang tersebut sudah dinyatakan oleh konteks hukum pelepasan, sehingga tidak perlu disisipkan sebagai nomina dalam klausa ini.
- issue: Hubungan ‘dua kali’ dengan enam tahun pelayanan
  choice: nilai pelayanannya setara dengan dua kali upah pekerja upahan
  alternative: ia melayani selama dua kali masa kerja seorang pekerja upahan
  rationale: Frasa Ibrani dapat dipahami sebagai perbandingan nilai atau upah, dan konteks alasan untuk tidak merasa berat mendukung gagasan bahwa enam tahun kerja itu bernilai besar. Catatan kaki mempertahankan kemungkinan ungkapan yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang tetap wajar dan bermartabat. Pronomina ‘engkau’ dipakai untuk sapaan tunggal, dan bentuk ‘kaulakukan’ mengikuti ejaan baku. Istilah ‘pekerja upahan’ membedakan tenaga sewaan dari orang yang sedang dilepaskan dari perhambaan terikat.
