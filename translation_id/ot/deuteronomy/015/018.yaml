  to: Janganlah engkau menganggapnya berat ketika melepaskannya sebagai orang bebas darimu, sebab selama enam tahun ia telah bekerja bagimu dengan nilai yang setara dengan dua kali upah seorang pekerja upahan.[a] Yahweh, Allahmu, akan memberkati engkau dalam segala sesuatu yang kaulakukan.
