  text: נָת֤וֹן תִּתֵּן֙ ל֔/וֹ וְ/לֹא יֵרַ֥ע לְבָבְ/ךָ֖ בְּ/תִתְּ/ךָ֣ ל֑/וֹ כִּ֞י בִּ/גְלַ֣ל הַ/דָּבָ֣ר הַ/זֶּ֗ה יְבָרֶכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָֽל מַעֲשֶׂ֔/ךָ וּ/בְ/כֹ֖ל מִשְׁלַ֥ח יָדֶֽ/ךָ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/010.yaml
  text: You shall surely give to him[a], and your heart shall not be troubled when you give to him[c][b], because on account of this thing Yahweh your God will bless you in all your work and in every undertaking of your hand.
translation:
  language: id
  text: Engkau harus sungguh-sungguh memberi kepadanya, dan janganlah hatimu merasa berat ketika engkau memberi kepadanya, karena hal ini Yahweh, Allahmu, akan memberkati engkau dalam segala pekerjaanmu dan dalam setiap usaha yang kamu lakukan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dalam setiap penguluran tanganmu,” yaitu dalam setiap usaha atau pekerjaan yang engkau lakukan.
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתוֹן תִּתֵּן
  choice: harus sungguh-sungguh memberi
  rationale: Konstruksi infinitif absolut diikuti bentuk imperfek menegaskan perintah. Ungkapan ini mempertahankan daya tekan tanpa menambahkan gagasan 'dengan murah hati' yang tidak dinyatakan langsung.
- source_word: לּוֹ
  choice: kepadanya
  rationale: Sufiks pronominalnya maskulin tunggal dan merujuk kepada sesama Israel yang berkekurangan dalam konteks sebelumnya. Bentuk Indonesia ini tidak perlu menandai gender.
- source_word: וְלֹא יֵרַע לְבָבְךָ
  choice: janganlah hatimu merasa berat
  rationale: Ungkapan Ibrani menggambarkan sikap batin negatif, enggan, atau berkeberatan saat memberi. 'Merasa berat' alami dalam bahasa Indonesia dan mempertahankan citra hati tanpa membatasi maknanya hanya pada kesedihan atau kebencian.
- source_word: בְּתִתְּךָ לוֹ
  choice: ketika engkau memberi kepadanya
  rationale: Preposisi ב pada infinitif konstruk berfungsi temporal atau sirkumstansial; 'ketika' menyatakannya secara wajar.
- source_word: כִּי בִּגְלַל הַדָּבָר הַזֶּה
  choice: sebab karena hal ini
  rationale: בגלל menyatakan sebab, sedangkan הדבר הזה menunjuk pada tindakan memberi yang baru diperintahkan. 'Hal ini' dekat dengan bentuk sumber dan tetap alami.
- source_word: יְבָרֶכְךָ
  choice: akan memberkati engkau
  rationale: ברך adalah verba umum untuk 'memberkati'; tidak diperlukan perluasan makna.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai 'Yahweh', bukan diganti dengan sebuah gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Sebutan perjanjian ini secara langsung berarti 'Allahmu' dan mengikuti nama ilahi.
- source_word: בְּכָל מַעֲשֶׂךָ
  choice: dalam segala pekerjaanmu
  rationale: מַעֲשֶׂה mencakup apa yang dilakukan atau dihasilkan seseorang; 'pekerjaan' sesuai dengan konteks ekonomi dan alami dalam bahasa Indonesia.
- source_word: וּבְכֹל מִשְׁלַח יָדֶךָ
  choice: dalam segala sesuatu yang dikerjakan tanganmu
  rationale: Terjemahan ini mempertahankan citra tangan dalam idiom Ibrani sekaligus menyampaikan maksudnya secara jelas. Catatan kaki memberikan bentuk yang lebih harfiah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai nama pribadi YHWH. Bentuk 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar, sementara pelafalan kunonya tidak sepenuhnya pasti.
- issue: Pronomina penerima maskulin tunggal
  choice: kepadanya
  alternative: kepada orang itu atau kepada saudaramu yang berkekurangan
  rationale: Bahasa Ibrani memakai sufiks maskulin tunggal yang merujuk pada orang berkekurangan dalam konteks. 'Kepadanya' mempertahankan rujukan tunggal tanpa memasukkan kata penjelas ke dalam ayat.
- issue: Hubungan antara pemberian dan berkat ilahi
  choice: sebab karena hal ini ... akan memberkati engkau
  alternative: supaya ... memberkati engkau
  rationale: כִּי בִּגְלַל menyatakan alasan atau dasar, bukan tujuan. Terjemahan mempertahankan hubungan sebab yang dinyatakan teks tanpa menjelaskan mekanisme teologisnya lebih lanjut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan sapaan tunggal 'engkau'. Struktur dibuat dekat dengan teks Ibrani, tetapi idiom yang akan terasa kabur dialihkan secara wajar. Ungkapan 'hatimu merasa berat' mempertahankan nuansa keengganan batin tanpa secara sempit menentukan apakah yang dimaksud adalah sedih, kesal, atau enggan.
