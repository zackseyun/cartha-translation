- from: 'Setiap anak sulung jantan yang lahir di antara ternak besar dan ternak kecilmu[a] harus kamu kuduskan bagi Yahweh, Allahmu. Janganlah kamu menggunakan anak sulung sapimu untuk bekerja, dan janganlah kamu mencukur bulu anak sulung ternak kecilmu.


