base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/019.yaml
  text: Every firstborn male that is born among your herd and among your flock you shall consecrate to Yahweh your God[a]. You shall not work with the firstborn of your ox[b], nor shear the firstborn of your flock.
translation:
  language: id
  text: Setiap anak sulung jantan yang lahir dari ternak besar milikmu dan ternak kecil milikmu[a] harus kamu kuduskan bagi Yahweh, Allahmu. Janganlah kamu menggunakan anak sulung lembumu untuk bekerja, dan janganlah kamu mencukur bulu anak sulung ternak kecilmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani untuk “ternak kecil” mencakup kawanan domba dan kambing.
    reason: lexical_scope
lexical_decisions:
- source_word: כָּל הַבְּכוֹר
  choice: Setiap anak sulung
  rationale: כָּל dengan frasa tunggal ini bersifat distributif. “Setiap anak sulung” alami dalam bahasa Indonesia dan mempertahankan cakupan perintah.
- source_word: אֲשֶׁר יִוָּלֵד
  choice: yang lahir
  rationale: Bentuk Nifal dari ילד menyatakan bahwa hewan itu dilahirkan; “yang lahir” ringkas dan wajar.
- source_word: בִּבְקָרְךָ וּבְצֹאנְךָ
  choice: di antara ternak besar dan ternak kecilmu
  rationale: בקר menunjuk ternak besar, terutama sapi, sedangkan צאן menunjuk ternak kecil dalam kawanan, yaitu domba dan kambing. Pilihan ini mempertahankan pembedaan tanpa mempersempit cakupannya.
- source_word: הַזָּכָר
  choice: jantan
  rationale: Kata ini membatasi ketentuan pada anak sulung berkelamin jantan.
- source_word: תַּקְדִּישׁ
  choice: harus kamu kuduskan
  rationale: Bentuk Hifil dari קדש berarti menjadikan atau menetapkan sesuatu sebagai kudus. “Kuduskan” mempertahankan bobot kultisnya.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: bagi Yahweh, Allahmu
  rationale: ל menyatakan arah atau peruntukan pengudusan, sedangkan יהוה ditransliterasikan “Yahweh” sebagai nama ilahi.
- source_word: לֹא תַעֲבֹד בִּבְכֹר שׁוֹרֶךָ
  choice: Janganlah kamu menggunakan anak sulung sapimu untuk bekerja
  rationale: עבד dengan preposisi ב di sini melarang pemanfaatan hewan sulung untuk pekerjaan. Rumusan ini lebih jelas dalam bahasa Indonesia daripada terjemahan harfiah “bekerja dengan”.
- source_word: וְלֹא תָגֹז בְּכוֹר צֹאנֶךָ
  choice: dan janganlah kamu mencukur bulu anak sulung ternak kecilmu
  rationale: גזז berarti mencukur bulu hewan. “Ternak kecil” mempertahankan cakupan צאן, yang dapat meliputi domba dan kambing.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. Bentuk “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Makna pengudusan anak sulung
  choice: kuduskan bagi Yahweh
  alternative: persembahkan kepada Yahweh
  rationale: קדש menyatakan penetapan sebagai kudus dan tidak dengan sendirinya menguraikan seluruh tindakan ritual berikutnya. Karena itu, “kuduskan” mempertahankan keluasan dan ketegangan makna sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “janganlah kamu” mempertahankan nada hukum tanpa terdengar kuno berlebihan; istilah peternakan dibuat jelas bagi pembaca umum.
