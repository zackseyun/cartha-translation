review_pass:
  verdict: revise
  source_fidelity: 'Makna utama diterjemahkan dengan setia: perintah itu berlaku bagi setiap anak sulung jantan, pengudusan ditujukan kepada Yahweh, dan dua larangan berikutnya dipertahankan. Namun, "di antara ternak besar dan ternak kecilmu" dapat membuat kepemilikan tampak hanya melekat pada ternak kecil dan kurang langsung untuk יחס kelahiran. Selain itu, "sapimu" berpotensi terlalu spesifik atau mengarah kepada sapi betina, sedangkan שׁוֹר dalam konteks kerja menunjuk hewan bovin/lemu untuk kerja.'
  naturalness: Bahasa draft umumnya baku dan jelas. Revisi memakai "lahir dari ... milikmu" untuk relasi yang lebih idiomatis dan jelas, serta "lembumu" untuk padanan yang lebih alami bagi שׁוֹר dalam konteks agraris. "Janganlah kamu" tetap sesuai dengan register hukum yang khidmat dan modern.
  terminology: '"Yahweh, Allahmu" tepat untuk יהוה אֱלֹהֶיךָ. "Kuduskan" dengan baik mempertahankan daya kultis Hifil קדש tanpa menambahkan tindakan ritual yang tidak dinyatakan. "Ternak kecil" secara tepat tidak mempersempit צֹאן menjadi domba saja; catatan kaki yang menerangkan cakupan domba dan kambing dapat dipertahankan.'
  issues:
  - severity: medium
    issue: Kepemilikan dan relasi kelahiran dalam frasa ternak kurang eksplisit.
    rationale: Ibrani memiliki sufiks orang kedua pada kedua nomina, בִּבְקָרְךָ וּבְצֹאנְךָ. "Ternak besar dan ternak kecilmu" dalam bahasa Indonesia dapat dibaca seakan-akan hanya "ternak kecil" yang dimiliki pembaca. "Yang lahir dari ternak besar milikmu dan ternak kecil milikmu" menyatakan kedua unsur itu dengan jelas.
  - severity: medium
    issue: '"Sapimu" kurang tepat sebagai padanan שׁוֹר.'
    rationale: שׁוֹר adalah hewan bovin, khususnya dalam konteks hewan yang dipakai bekerja; "sapi" dalam pemakaian Indonesia dapat mengarah kepada sapi betina dan lebih sempit nuansanya. "Lembu" lebih netral dan lazim untuk hewan kerja dalam register Alkitab.
  revised_text: Setiap anak sulung jantan yang lahir dari ternak besar milikmu dan ternak kecil milikmu[a] harus kamu kuduskan bagi Yahweh, Allahmu. Janganlah kamu menggunakan anak sulung lembumu untuk bekerja, dan janganlah kamu mencukur bulu anak sulung ternak kecilmu.
