  to: Setiap anak sulung jantan yang lahir dari ternak besar milikmu dan ternak kecil milikmu[a] harus kamu kuduskan bagi Yahweh, Allahmu. Janganlah kamu menggunakan anak sulung lembumu untuk bekerja, dan janganlah kamu mencukur bulu anak sulung ternak kecilmu.
  rationale: Revisi memperjelas bahwa kedua kelompok ternak adalah milik pihak yang disapa dan bahwa anak sulung itu lahir dari kelompok-kelompok tersebut. "Lembu" menggantikan "sapi" agar lebih sesuai dengan שׁוֹר dalam larangan memakai hewan untuk kerja. Tidak ada perubahan pada cakupan perintah, nama ilahi, atau makna pengudusan.
