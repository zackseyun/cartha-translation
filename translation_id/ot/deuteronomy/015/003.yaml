  text: אֶת הַ/נָּכְרִ֖י תִּגֹּ֑שׂ וַ/אֲשֶׁ֨ר יִהְיֶ֥ה לְ/ךָ֛ אֶת אָחִ֖י/ךָ תַּשְׁמֵ֥ט יָדֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/003.yaml
  text: You may press a foreigner for payment[c][b][a], but whatever of yours is with your brother your hand shall release.
translation:
  language: id
  text: Engkau boleh menagih orang asing[a], tetapi engkau harus melepaskan hak tagihmu[c] atas segala sesuatu yang menjadi milikmu dan ada pada saudaramu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “menuntut pembayaran dari orang asing.” Kata kerja Ibrani ini berarti mendesak atau menuntut pelunasan dalam konteks utang.
    reason: lexical_alternative
  - marker: b
    text: “Saudaramu” di sini menunjuk kepada sesama anggota komunitas perjanjian Israel.
    reason: cultural_note
  - marker: c
    text: Secara harfiah, “tanganmu harus melepaskan.” Idiom ini berarti melepaskan atau menghapuskan tuntutan atas utang pada tahun penghapusan utang.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנָּכְרִי
  choice: orang asing
  rationale: נָכְרִי menunjuk kepada orang yang berada di luar komunitas perjanjian Israel dalam konteks hukum ini. “Orang asing” merupakan padanan Indonesia modern yang jelas dan tetap mempertahankan pembedaan sosial-hukumnya.
- source_word: תִּגֹּשׂ
  choice: boleh menagih
  rationale: Dalam konteks utang, נגשׂ berarti mendesak atau menuntut pembayaran. “Boleh menagih” menyampaikan tindakan penagihan sekaligus daya permisif bentuk hukum dalam konteks tahun penghapusan utang.
- source_word: וַאֲשֶׁר יִהְיֶה לְךָ
  choice: apa pun milikmu yang ada
  rationale: Ungkapan terbuka ini mencakup apa pun yang menjadi hak si pemberi pinjaman pada pihak lain. Susunan ini mempertahankan keluasan rumusan Ibrani tanpa membatasinya secara tidak perlu.
- source_word: אָחִיךָ
  choice: saudaramu
  rationale: Padanan harfiah ini mempertahankan metafora kekeluargaan perjanjian. Dalam hukum Ulangan, istilah tersebut menunjuk kepada sesama anggota umat Israel, yang dijelaskan dalam catatan kaki.
- source_word: תַּשְׁמֵט יָדֶךָ
  choice: engkau harus melepaskan hak tagihmu
  rationale: Secara harfiah idiom ini berbicara tentang melepaskan tangan, tetapi dalam konteks utang maksudnya ialah melepaskan tuntutan atau hak penagihan. Padanan ini alami dalam bahasa Indonesia dan tetap mempertahankan tindakan hukum yang dimaksud; gambaran harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Cakupan istilah “saudaramu” dalam hukum Ulangan
  choice: Mempertahankan istilah perjanjian yang harfiah, “saudaramu”, dalam teks utama.
  alternative: sesama orang Israel
  rationale: Ayat ini membedakan orang asing dari “saudara” dalam komunitas perjanjian Israel. Mempertahankan istilah sumber menjaga metafora teologis dan sosialnya tanpa menjadikan tafsiran cakupannya sebagai pengganti teks; cakupan historisnya dijelaskan dalam catatan kaki.
- issue: Makna idiom “melepaskan tangan” dalam tahun penghapusan utang
  choice: Menerjemahkan fungsinya sebagai “melepaskan hak tagihmu” dalam teks utama.
  alternative: melepaskan tanganmu
  rationale: Ungkapan harfiah dapat terdengar tidak jelas atau berarti tindakan jasmani dalam bahasa Indonesia. Terjemahan fungsional menyampaikan penghapusan tuntutan utang tanpa menentukan lebih jauh mekanisme hukumnya, sedangkan bentuk harfiahnya tetap tersedia dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal “engkau” yang bermartabat dan lazim dalam teks Alkitab. Ungkapan hukum dibuat jelas bagi pembaca umum, sementara istilah perjanjian “saudaramu” dan keluasan “apa pun milikmu” dipertahankan. Semua penanda catatan kaki ditempatkan pada bagian teks yang diterangkannya.
