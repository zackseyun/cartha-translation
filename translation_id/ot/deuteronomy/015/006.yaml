source:
  edition: WLC
  text: כִּֽי יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בֵּֽרַכְ/ךָ֔ כַּ/אֲשֶׁ֖ר דִּבֶּר לָ֑/ךְ וְ/הַֽעֲבַטְתָּ֞ גּוֹיִ֣ם רַבִּ֗ים וְ/אַתָּה֙ לֹ֣א תַעֲבֹ֔ט וּ/מָֽשַׁלְתָּ֙ בְּ/גוֹיִ֣ם רַבִּ֔ים וּ/בְ/ךָ֖ לֹ֥א יִמְשֹֽׁלוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/006.yaml
  text: For Yahweh your God has blessed you just as he promised you[a], and you will lend to many nations, but you will not borrow; and you will rule over many nations, but they will not rule over you.
translation:
  language: id
  text: Sebab Yahweh, Allahmu, telah memberkati engkau seperti yang telah dijanjikan-Nya kepadamu.[a] Engkau akan memberi pinjaman kepada banyak bangsa, tetapi engkau sendiri tidak akan meminjam. Engkau akan berkuasa atas banyak bangsa, tetapi mereka tidak akan berkuasa atasmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “seperti yang telah difirmankan-Nya kepadamu.” Dalam konteks perjanjian ini, firman tersebut mengandung makna janji.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama pribadi Allah dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: בֵּרַכְךָ
  choice: telah memberkati engkau
  rationale: Bentuk perfektif menyatakan berkat sebagai tindakan yang sudah pasti atau telah terlaksana dan menjadi dasar bagi akibat-akibat berikutnya.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: seperti yang telah dijanjikan-Nya kepadamu
  rationale: Secara harfiah berarti 'seperti yang telah difirmankan-Nya kepadamu', tetapi dalam konteks perjanjian perkataan tersebut berfungsi sebagai janji.
- source_word: וְהַעֲבַטְתָּ
  choice: Engkau akan memberi pinjaman
  rationale: Bentuk Hifil dari עבט berarti meminjamkan atau memberikan kredit; ungkapan ini alami dalam bahasa Indonesia.
- source_word: גּוֹיִם רַבִּים
  choice: banyak bangsa
  rationale: Konteks ekonomi dan politik menunjuk kepada bangsa-bangsa sebagai kelompok nasional.
- source_word: לֹא תַעֲבֹט
  choice: engkau sendiri tidak akan meminjam
  rationale: Bentuk Qal menjadi lawan langsung dari tindakan memberi pinjaman; 'sendiri' memperjelas kontras tanpa mengubah makna.
- source_word: וּמָשַׁלְתָּ
  choice: Engkau akan berkuasa atas
  rationale: מָשַׁל menyatakan pelaksanaan kekuasaan atau pemerintahan; 'berkuasa atas' sesuai dengan konteks antarbangsa.
- source_word: וּבְךָ לֹא יִמְשֹׁלוּ
  choice: mereka tidak akan berkuasa atasmu
  rationale: Subjek jamak secara alami merujuk kembali kepada banyak bangsa dan mempertahankan kesejajaran kalimat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama pribadi Allah; transliterasi 'Yahweh' mempertahankan fungsi nama itu.
- issue: Daya makna דִּבֶּר dalam konteks perjanjian
  choice: telah dijanjikan-Nya
  alternative: telah difirmankan-Nya; telah dikatakan-Nya
  rationale: Konteks menyajikan firman Allah sebagai janji, tetapi catatan kaki mempertahankan arti harfiahnya agar nuansa sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina tunggal 'engkau' mempertahankan sapaan Ibrani kepada Israel sebagai satu kesatuan. Pengulangan struktur pinjam-meminjam dan berkuasa mempertahankan antitesis serta kesejajaran teks sumber.
