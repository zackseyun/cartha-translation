base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/015/022.yaml
  text: You may eat it within your gates[a]; the unclean and the clean alike may eat it[b], as the gazelle and the deer.
translation:
  language: id
  text: Engkau boleh memakannya di kota-kotamu[a]. Orang yang najis dan orang yang tahir sama-sama boleh memakannya[b], sebagaimana engkau memakan kijang dan rusa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di dalam gerbang-gerbangmu”; ungkapan Ibrani ini berarti di kota-kotamu atau di lingkungan-lingkungan permukimanmu.
    reason: cultural_note
  - marker: b
    text: Maksudnya, baik orang yang secara ritual najis maupun orang yang secara ritual tahir boleh memakannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּשְׁעָרֶיךָ
  choice: di kota-kotamu
  rationale: Secara harfiah berarti “di dalam gerbang-gerbangmu”, tetapi dalam konteks ini merupakan ungkapan bagi kota atau lingkungan permukiman setempat. Terjemahan ini menyampaikan maknanya secara alami dalam bahasa Indonesia modern.
- source_word: תֹּאכֲלֶנּוּ
  choice: Engkau boleh memakannya
  rationale: Bentuk orang kedua tunggal dengan objek orang ketiga tunggal merujuk pada hewan atau daging dalam konteks sebelumnya. “Boleh” menyampaikan daya permisif dalam konteks ini.
- source_word: הַטָּמֵא
  choice: orang yang najis
  rationale: Kata ini menunjuk pada status kenajisan ritual, bukan kejahatan moral. Penyebutan “orang” dibuat eksplisit agar pasangan subjek manusia dalam kalimat ini jelas.
- source_word: וְהַטָּהוֹר
  choice: orang yang tahir
  rationale: Kata ini berpasangan dengan “orang yang najis” dan menunjuk pada status ritual. “Tahir” mempertahankan istilah baku dan ringkas dalam konteks hukum ibadah.
- source_word: יַחְדָּו
  choice: sama-sama
  rationale: Dalam konteks ini kata tersebut menyatakan bahwa kedua golongan itu sama-sama diizinkan makan, bukan bahwa mereka harus makan secara bersamaan.
- source_word: כַּצְּבִי
  choice: seperti kijang
  rationale: צְבִי lazim menunjuk pada gazel atau kijang. “Kijang” merupakan padanan alami dan mudah dipahami oleh pembaca Indonesia.
- source_word: וְכָאַיָּל
  choice: dan rusa
  rationale: אַיָּל menunjuk pada rusa, kadang khususnya rusa jantan. “Rusa” adalah padanan umum yang jelas dan berpasangan alami dengan “kijang”.
theological_decisions:
- issue: Makna pasangan הַטָּמֵא וְהַטָּהוֹר
  choice: orang yang najis dan orang yang tahir
  alternative: yang cemar dan yang murni
  rationale: Pasangan ini menyatakan status ritual, bukan penilaian moral. Istilah “najis” dan “tahir” mempertahankan kategori hukum ritual tanpa memasukkan gagasan denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “Engkau” mempertahankan sapaan tunggal Ibrani. Istilah hukum ritual “najis” dan “tahir” dipertahankan, sementara idiom gerbang dialihkan secara alami menjadi “kota-kotamu” dan dijelaskan dalam catatan kaki.
