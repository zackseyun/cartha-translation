base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/013.yaml
  text: He will love you[a], bless you, and multiply you. He will bless the fruit of your womb and the fruit of your ground—your grain, your new wine, and your oil, the offspring of your herds and the young of your flock—in the land that he swore to your fathers to give you.
translation:
  language: id
  text: Ia akan mengasihimu, memberkatimu, dan membuatmu bertambah banyak. Ia akan memberkati buah kandunganmu dan hasil tanahmu—biji-bijianmu, anggur barumu, dan minyakmu, serta keturunan ternak besarmu dan keturunan kambing dombamu—di negeri yang telah bersumpah untuk diberikan-Nya kepadamu kepada nenek moyangmu[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “bapa-bapamu.”'
    reason: Menunjukkan bentuk maskulin jamak dalam teks Ibrani yang diterjemahkan secara idiomatis sebagai “nenek moyangmu”.
lexical_decisions:
- source_word: וַאֲהֵבְךָ
  choice: Ia akan mengasihimu
  rationale: Konteks meneruskan rangkaian berkat perjanjian dengan daya futur; 'mengasihi' mempertahankan ungkapan langsung tentang kasih Allah.
- source_word: וְהִרְבֶּךָ
  choice: membuatmu bertambah banyak
  rationale: Mengungkapkan pertambahan jumlah umat dan keturunannya dengan bahasa Indonesia yang alami tanpa mempersempit maknanya.
- source_word: פְּרִי בִטְנְךָ
  choice: buah kandunganmu
  rationale: Mempertahankan metafora konkret Ibrani bagi keturunan dan kesuburan.
- source_word: פְּרִי אַדְמָתֶךָ
  choice: hasil tanahmu
  rationale: Dalam bahasa Indonesia, 'hasil tanah' lebih alami untuk panen, meski Ibrani secara harfiah mengulangi kata 'buah'.
- source_word: דְּגָנְךָ
  choice: biji-bijianmu
  rationale: Mencakup hasil tanaman serealia secara umum dan tidak membatasi makna pada gandum saja.
- source_word: תִירֹשְׁךָ
  choice: anggur barumu
  rationale: Menjaga pembedaan תירוש sebagai anggur baru atau hasil anggur yang baru diproduksi.
- source_word: יִצְהָרֶךָ
  choice: minyakmu
  rationale: Padanan ringkas dan alami; dalam konteks pertanian Israel, yang terutama dimaksud ialah minyak zaitun.
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: anak-anak ternak besarmu
  rationale: Menyampaikan keturunan kawanan sapi atau ternak besar tanpa memakai ungkapan harfiah yang kabur dalam bahasa Indonesia.
- source_word: עַשְׁתְּרֹת צֹאנֶךָ
  choice: anak-anak kawanan kambing dombamu
  rationale: Dalam kolokasi ini menunjuk pada keturunan ternak kecil; 'kambing domba' mencakup cakupan צאן tanpa mengimpor nama dewi Asytoret.
- source_word: עַל הָאֲדָמָה
  choice: di negeri
  rationale: Konteks menunjuk pada wilayah perjanjian yang akan diberikan, sehingga 'negeri' lebih tepat daripada 'tanah' sebagai bahan atau lahan.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: yang telah dijanjikan-Nya dengan sumpah kepada nenek moyangmu untuk diberikan kepadamu
  rationale: Mempertahankan unsur sumpah, penerima sumpah, dan pemberian negeri sambil memakai susunan Indonesia yang jelas.
theological_decisions:
- issue: Penerjemahan לַאֲבֹתֶיךָ
  choice: kepada nenek moyangmu
  alternative: kepada bapa-bapamu
  rationale: Ibrani secara harfiah berbentuk maskulin jamak, 'bapa-bapamu', tetapi dalam konteks formula perjanjian kata itu menunjuk kepada para leluhur Israel. 'Nenek moyangmu' merupakan ungkapan Indonesia modern yang alami; catatan kaki mempertahankan bentuk harfiahnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi ditulis dengan kapital sesuai kebiasaan umum penerbitan Alkitab Indonesia. Bentuk tunggal orang kedua dalam bahasa Ibrani diterjemahkan dengan akhiran -mu, yang dapat menyapa Israel sebagai satu umat.
