revisions:
- from: Ia akan mengasihimu, memberkatimu, dan membuatmu bertambah banyak. Ia akan memberkati buah kandunganmu dan hasil tanahmu—biji-bijianmu, anggur barumu, dan minyakmu—juga anak-anak ternak besarmu dan anak-anak kawanan kambing dombamu, di negeri yang telah dijanjikan-Nya dengan sumpah kepada nenek moyangmu[a] untuk diberikan kepadamu.
  to: Ia akan mengasihimu, memberkatimu, dan membuatmu bertambah banyak. Ia akan memberkati buah kandunganmu dan hasil tanahmu—biji-bijianmu, anggur barumu, dan minyakmu, serta keturunan ternak besarmu dan keturunan kambing dombamu—di negeri yang telah bersumpah untuk diberikan-Nya kepadamu kepada nenek moyangmu[a].
  rationale: Revisi mengelompokkan semua hasil pertanian dan ternak dalam satu sisipan yang sama, lalu mempertahankan negeri sebagai lokasi berkat. Catatan kaki dipertahankan karena secara tepat menandai alternatif harfiah untuk אֲבֹתֶיךָ. Namun, susunan klausa terakhir dalam teks revisi perlu tidak membalik penerima sumpah dan objek pemberian; bentuk yang benar seharusnya “di negeri yang telah bersumpah untuk diberikan-Nya kepada nenek moyangmu” tidak setia pada sumber, sehingga revisi teks final perlu menggunakan “di negeri yang telah dijanjikan-Nya dengan sumpah kepada nenek moyangmu untuk diberikan kepadamu” atau, lebih langsung, “di negeri yang telah Ia sumpahkan kepada nenek moyangmu untuk diberikan kepadamu.”
