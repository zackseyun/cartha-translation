source:
  edition: WLC
  text: כִּֽי יָסִ֤יר אֶת בִּנְ/ךָ֙ מֵֽ/אַחֲרַ֔/י וְ/עָבְד֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים וְ/חָרָ֤ה אַף יְהוָה֙ בָּ/כֶ֔ם וְ/הִשְׁמִידְ/ךָ֖ מַהֵֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/004.yaml
  text: For he will turn your son away from following me[a], and they will serve other gods; then the anger of Yahweh will burn against you[c][b], and he will quickly destroy you.
translation:
  language: id
  text: Sebab ia akan membuat putramu berpaling sehingga tidak lagi mengikuti Aku,[a] dan mereka akan beribadah kepada ilah-ilah lain.[b] Maka murka Yahweh[c] akan menyala terhadap kalian, dan Ia akan segera memusnahkanmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari setelah-Ku”; ini adalah ungkapan Ibrani yang berarti berhenti mengikuti Aku.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani beralih dari bentuk tunggal (“putramu”) ke bentuk jamak (“mereka akan beribadah”). Peralihan ini mungkin memperluas peringatan dari seorang putra kepada keluarga atau umat yang terdampak.
    reason: alternative_reading
  - marker: c
    text: “Yahweh” adalah transliterasi nama ilahi YHWH; dalam banyak terjemahan, nama ini ditampilkan sebagai “TUHAN.”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi larangan dalam ayat sebelumnya; “sebab” mempertahankan hubungan penjelas tersebut.
- source_word: יָסִיר
  choice: akan membuat ... berpaling
  rationale: Bentuk kausatif dari סור menunjukkan bahwa orang tersebut menyebabkan anak Israel berpaling; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya kausatifnya.
- source_word: בִּנְךָ
  choice: anakmu
  rationale: Nomina Ibrani berbentuk tunggal maskulin dan mengacu pada anak laki-laki dalam larangan perkawinan pada ayat sebelumnya. Dalam bahasa Indonesia, “anakmu” wajar dan tidak menambahkan cakupan jamak yang tidak terdapat dalam bentuk sumber.
- source_word: מֵאַחֲרַי
  choice: sehingga tidak lagi mengikuti Aku
  rationale: Secara harfiah ungkapan ini berarti “dari belakang-Ku,” tetapi merupakan idiom untuk berhenti mengikuti Yahweh. Pilihan ini menyampaikan makna idiomatis dan akibat tindakan kausatif secara alami.
- source_word: וְעָבְדוּ
  choice: dan mereka akan beribadah
  rationale: Verba Ibrani berbentuk jamak. “Mereka” mempertahankan peralihan yang nyata dari “anakmu” yang tunggal ke subjek jamak tanpa menyelaraskannya secara diam-diam.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ilah-ilah lain
  rationale: Terjemahan langsung ini mempertahankan bentuk jamak dan kontras dengan kesetiaan eksklusif kepada Yahweh.
- source_word: וְחָרָה אַף יְהוָה
  choice: Maka murka Yahweh akan menyala
  rationale: “Maka” menyatakan akibat, sedangkan “akan menyala” mempertahankan metafora Ibrani tentang murka yang berkobar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh,” bukan diganti dengan sebuah gelar, sehingga identitas nama dalam teks sumber tetap tampak.
- source_word: בָּכֶם
  choice: terhadap kalian
  rationale: Dengan ungkapan חרה אף, preposisi ini menandai pihak yang menjadi sasaran murka. Bentuk akhiran Ibraninya jamak, sehingga diterjemahkan “kalian.”
- source_word: וְהִשְׁמִידְךָ
  choice: dan Ia akan segera memusnahkanmu
  rationale: Bentuk kausatif שׁמד menyatakan penghancuran tuntas. “Memusnahkan” mempertahankan bobot ancaman, sementara “-mu” mencerminkan akhiran tunggal Ibrani.
- source_word: מַהֵר
  choice: segera
  rationale: Adverbia ini menandakan cepatnya pelaksanaan hukuman; “segera” alami dalam bahasa Indonesia dan mempertahankan desakan peringatan.
theological_decisions:
- issue: Peralihan jumlah dalam kata ganti dan verba
  choice: Mempertahankan “anakmu” yang tunggal, “mereka” dan “kalian” yang jamak, lalu “-mu” yang tunggal.
  alternative: Menyeragamkan seluruh ayat menjadi tunggal atau jamak.
  rationale: Teks Ibrani sendiri beralih dari tunggal ke jamak dan kembali ke tunggal. Peralihan itu mungkin memperluas akibat dari seorang anak kepada keluarga atau umat, tetapi teks tidak menjelaskannya secara tegas; karena itu ketegangannya dipertahankan.
- issue: Rujukan subjek pada “ia akan membuat ... berpaling”
  choice: Memakai “ia” tanpa menambahkan identitas yang tidak dinyatakan ulang dalam ayat ini.
  alternative: Menuliskan secara eksplisit “orang asing itu” atau “istri asing itu.”
  rationale: Subjek maskulin tunggal dipahami dari konteks sebelumnya, tetapi penambahan identitas atau jenis kelamin yang lebih spesifik dapat menutup ambiguitas rujukan dalam bentuk Ibrani.
- issue: Penyebutan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Transliterasi mempertahankan nama diri ilahi yang terdapat dalam teks sumber dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Metafora murka yang “menyala” dipertahankan. Peralihan tunggal–jamak dalam bahasa Ibrani sengaja terlihat melalui “anakmu,” “mereka,” “kalian,” dan “memusnahkanmu.” Kapitalisasi “Aku” dan “Ia” dipakai sebagai konvensi penghormatan bagi rujukan kepada Allah.
