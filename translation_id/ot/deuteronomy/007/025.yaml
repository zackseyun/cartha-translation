source:
  edition: WLC
  text: פְּסִילֵ֥י אֱלֹהֵי/הֶ֖ם תִּשְׂרְפ֣וּ/ן בָּ/אֵ֑שׁ לֹֽא תַחְמֹד֩ כֶּ֨סֶף וְ/זָהָ֤ב עֲלֵי/הֶם֙ וְ/לָקַחְתָּ֣ לָ֔/ךְ פֶּ֚ן תִּוָּקֵ֣שׁ בּ֔/וֹ כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/025.yaml
  text: You shall burn the carved images of their gods with fire[a]. You shall not covet the silver or gold that is on them and take it for yourself, lest you be ensnared by it[b], for it is an abomination to Yahweh your God.
translation:
  language: id
  text: Patung-patung dewa mereka yang dipahat harus kalian bakar dengan api.[a] Janganlah kamu mengingini perak dan emas yang ada pada patung-patung itu, dan jangan mengambilnya untuk dirimu sendiri, supaya kamu tidak terjerat olehnya.[b] Sebab itu adalah kekejian bagi Yahweh, Allahmu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam bahasa Ibrani, perintah pertama memakai bentuk jamak, “kalian”, lalu bagian berikutnya beralih ke bentuk tunggal, “kamu”. Keduanya menyapa Israel sebagai umat.
    reason: source_form
  - marker: b
    text: Atau “tertangkap olehnya”. Kata Ibrani memakai gambaran seseorang yang tertangkap dalam jerat.
    reason: lexical_alternative
  - marker: c
    text: Kata “itu” dapat menunjuk pada patung, logam yang diambil darinya, atau seluruh tindakan yang terkait dengannya. Bahasa Ibrani tidak mempersempit acuannya.
    reason: ambiguity
lexical_decisions:
- source_word: פְּסִילֵי אֱלֹהֵיהֶם
  choice: patung-patung pahatan dewa-dewa mereka
  rationale: פֶּסֶל menunjuk pada gambar atau patung yang dibuat dengan memahat. Pilihan ini mempertahankan gambaran konkret sumber tanpa langsung menggantinya dengan istilah yang lebih interpretatif, yaitu 'berhala'.
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: harus kalian bakar dengan api
  rationale: Ungkapan ini menyatakan perintah untuk membakar dan secara eksplisit menyebut api sebagai sarana. 'Harus' menyampaikan daya perintah dalam bahasa Indonesia yang wajar.
- source_word: לֹא תַחְמֹד
  choice: janganlah kamu mengingini
  rationale: חמד berarti menginginkan sesuatu yang menarik, dan dalam konteks larangan mengandung nuansa keinginan untuk memilikinya. 'Mengingini' mempertahankan nuansa etis itu dengan ragam bahasa Alkitab yang tetap mudah dipahami.
- source_word: כֶּסֶף וְזָהָב עֲלֵיהֶם
  choice: perak dan emas yang ada pada patung-patung itu
  rationale: Kata depan עַל menyatakan bahwa logam tersebut berada pada, melekat pada, atau melapisi patung. Terjemahan ini mempertahankan relasinya tanpa menentukan secara berlebihan bagaimana logam itu dipasang.
- source_word: וְלָקַחְתָּ לָךְ
  choice: lalu mengambilnya bagi dirimu sendiri
  rationale: לָךְ menyatakan pengambilan untuk kepentingan atau menjadi milik orang yang disapa. 'Lalu' menghubungkan tindakan mengambil dengan keinginan yang dilarang secara alami.
- source_word: פֶּן תִּוָּקֵשׁ בּוֹ
  choice: supaya kamu tidak terjerat olehnya
  rationale: Bentuk Niphal dari יקשׁ memakai gambaran tertangkap jerat. 'Terjerat' mempertahankan metafora sumber dan cocok dengan bahaya rohani serta moral dalam konteks.
- source_word: תּוֹעֲבַת
  choice: menjijikkan bagi
  rationale: תּוֹעֵבָה menyatakan sesuatu yang sangat dibenci atau dipandang keji. Bentuk predikatif 'menjijikkan bagi' kuat, alami, dan mudah dipahami dalam bahasa Indonesia modern.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', sehingga nama pribadi dalam teks Ibrani dipertahankan dan tidak diganti dengan gelar.
theological_decisions:
- issue: Acuan kata ganti terakhir הוּא
  choice: Diterjemahkan dengan kata netral 'itu' tanpa mempersempit acuannya.
  alternative: Menentukannya secara khusus sebagai patung pahatan, logam mulia, atau tindakan mengambil logam itu.
  rationale: Peringatan langsung membahas perak dan emas pada patung, tetapi seluruh benda yang terkait dengan penyembahan berhala tetap berada dalam cakupan. Kata 'itu' mempertahankan keluasan dan ketegangan acuan dalam bahasa Ibrani.
- issue: Pergantian jumlah orang yang disapa
  choice: Perintah pertama memakai 'kalian', lalu larangan berikutnya memakai 'kamu'.
  alternative: Menyeragamkan seluruh ayat menjadi 'kamu' atau 'kalian'.
  rationale: Teks Masoret mula-mula memakai bentuk orang kedua jamak, kemudian beralih ke bentuk tunggal. Pergantian ini dipertahankan sebagai cara teks menyapa Israel bersama-sama sekaligus sebagai satu umat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun langsung. Pergantian 'kalian' ke 'kamu' sengaja dipertahankan untuk mencerminkan perubahan bentuk dalam teks Ibrani. Istilah 'patung-patung pahatan' dipilih daripada 'patung ukiran' agar proses pembuatan dan sifat bendanya terdengar alami, sedangkan 'menjijikkan bagi' menghindari ungkapan nominal yang lebih kaku tanpa melemahkan bobot תּוֹעֵבָה.
