    issue: '"mendudukinya" untuk לְרִשְׁתָּהּ'
    rationale: Dalam pemakaian Indonesia modern, "menduduki" lazim mengarah pada okupasi atau penempatan di suatu wilayah. Kata ירשׁ terutama menyatakan memperoleh/memiliki (dan dapat pula berarti mewarisi); teks ini tidak perlu membatasi atau menjelaskan mekanisme penguasaan itu pada titik ini.
  revised_text: Ketika Yahweh, Allahmu, membawa engkau masuk ke negeri yang akan kaumasuki untuk memilikinya[a], dan menghalau banyak bangsa-bangsa dari hadapanmu—orang Het, orang Girgasi, orang Amori, orang Kanaan, orang Feris, orang Hewi, dan orang Yebus—tujuh bangsa yang lebih besar dan lebih kuat daripada engkau[b],
