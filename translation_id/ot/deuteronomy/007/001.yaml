  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֤י יְבִֽיאֲ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֶל הָ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּ֑/הּ וְ/נָשַׁ֣ל גּֽוֹיִם רַבִּ֣ים מִ/פָּנֶ֡י/ךָ הַֽ/חִתִּי֩ וְ/הַ/גִּרְגָּשִׁ֨י וְ/הָ/אֱמֹרִ֜י וְ/הַ/כְּנַעֲנִ֣י וְ/הַ/פְּרִזִּ֗י וְ/הַֽ/חִוִּי֙ וְ/הַ/יְבוּסִ֔י שִׁבְעָ֣ה גוֹיִ֔ם רַבִּ֥ים וַ/עֲצוּמִ֖ים מִמֶּֽ/ךָּ־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/001.yaml
  text: When Yahweh your God brings you into the land that you are entering to possess[a], and drives out before you many nations—the Hittites, the Girgashites, the Amorites, the Canaanites, the Perizzites, the Hivites, and the Jebusites—seven nations greater and mightier than you[b],
translation:
  language: id
  text: Ketika Yahweh, Allahmu, membawa engkau masuk ke negeri yang akan kaumasuki untuk memilikinya[a], dan menghalau banyak bangsa-bangsa dari hadapanmu—orang Het, orang Girgasi, orang Amori, orang Kanaan, orang Feris, orang Hewi, dan orang Yebus—tujuh bangsa yang lebih besar dan lebih kuat daripada engkau[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “untuk mewarisinya.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “lebih banyak dan lebih kuat daripada engkau.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ketika
  rationale: Dalam konteks ini, כִּי memperkenalkan keadaan yang mendahului perintah-perintah berikutnya; makna temporal paling sesuai dengan alur wacana.
- source_word: יְבִיאֲךָ
  choice: membawa engkau masuk
  rationale: Bentuk Hifil dari בוא menyatakan tindakan menyebabkan seseorang masuk; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan makna kausatif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, sesuai bentuk Tetragramaton dalam teks sumber.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk konstruksi dengan sufiks orang kedua tunggal diterjemahkan secara langsung dan ringkas.
- source_word: הָאָרֶץ
  choice: negeri
  rationale: Di sini kata tersebut menunjuk pada wilayah tertentu yang akan dimasuki Israel; 'negeri' alami dalam bahasa Indonesia tanpa menghilangkan pengertian teritorialnya.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: yang akan kaumasuki
  rationale: Frasa ini menggambarkan masuknya Israel yang segera terjadi. Bentuk Indonesia ini menyampaikan arah dan aspek prospektif secara wajar tanpa menerjemahkan שָׁמָּה secara kaku.
- source_word: לְרִשְׁתָּהּ
  choice: untuk mendudukinya
  rationale: ירשׁ dalam konteks ini berarti mengambil dan memegang negeri sebagai milik. 'Menduduki' menyampaikan tindakan mengambil penguasaan, sementara alternatif 'memiliki' dicatat karena cakupan katanya juga mencakup kepemilikan.
- source_word: וְנָשַׁל
  choice: menghalau
  rationale: Kata kerja ini menyatakan bahwa Yahweh menyingkirkan atau mencabut bangsa-bangsa dari tempat mereka; 'menghalau' alami dengan frasa 'dari hadapanmu'.
- source_word: גּוֹיִם רַבִּים
  choice: banyak bangsa
  rationale: גּוֹיִם menunjuk pada kelompok-kelompok bangsa yang berbeda di Kanaan.
- source_word: מִפָּנֶיךָ
  choice: dari hadapanmu
  rationale: Terjemahan ini mempertahankan idiom Ibrani tentang penyingkiran dari hadapan atau kehadiran seseorang dan tetap dapat dipahami dalam bahasa Indonesia.
- source_word: הַחִתִּי ... הַיְבוּסִי
  choice: orang Het, orang Girgasi, orang Amori, orang Kanaan, orang Feris, orang Hewi, dan orang Yebus
  rationale: Nama-nama bangsa ditransliterasikan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia; 'orang' menandai bahwa bentuk gentilik tunggal Ibrani dipakai secara kolektif.
- source_word: שִׁבְעָה גוֹיִם רַבִּים וַעֲצוּמִים מִמֶּךָּ
  choice: tujuh bangsa yang lebih besar dan lebih kuat daripada engkau
  rationale: Terjemahan ini mempertahankan dua unsur perbandingan, yakni kebesaran dan kekuatan, tanpa memastikan bahwa רַבִּים hanya berarti jumlah penduduk.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Cakupan makna ירשׁ dalam konteks masuk ke negeri
  choice: mendudukinya
  alternative: memilikinya / mewarisinya
  rationale: Konteks menonjolkan tindakan mengambil penguasaan atas negeri. Namun, kata Ibrani juga dapat mencakup gagasan memiliki atau mewarisi, sehingga alternatif tersebut dicatat tanpa memasukkan suatu skema teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan tunggal dipertahankan dengan 'engkau' dan bentuk terikat 'kaumasuki'. Struktur ayat sengaja berakhir dengan koma karena ayat ini merupakan anak kalimat yang berlanjut ke pernyataan berikutnya.
