  naturalness: Teks revisi memakai bahasa Indonesia baku modern. “Yang Yahweh, Allahmu, berikan kepadamu” lebih lancar dan jelas daripada susunan pasif sebelumnya, sementara sapaan tunggal “engkau” dipertahankan.
