  text: וְ/אָכַלְתָּ֣ אֶת כָּל הָֽ/עַמִּ֗ים אֲשֶׁ֨ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ נֹתֵ֣ן לָ֔/ךְ לֹא תָחֹ֥ס עֵֽינְ/ךָ֖ עֲלֵי/הֶ֑ם וְ/לֹ֤א תַעֲבֹד֙ אֶת אֱלֹ֣הֵי/הֶ֔ם כִּֽי מוֹקֵ֥שׁ ה֖וּא לָֽ/ךְ־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/016.yaml
  text: And you shall consume all the peoples whom Yahweh your God is giving to you[a]. Your eye shall not spare them, and you shall not serve their gods[c][b], for that would be a snare to you.
translation:
  language: id
  text: Engkau harus menghabisi semua bangsa yang Yahweh, Allahmu, berikan kepadamu.[a] Janganlah engkau merasa iba kepada mereka,[b] dan janganlah engkau mengabdi kepada ilah-ilah mereka, sebab hal itu akan menjadi jerat bagimu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memakan” atau “menelan habis”; dalam konteks ini merupakan ungkapan untuk mengalahkan atau membinasakan sampai tuntas.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “janganlah matamu menyayangkan mereka”; maksudnya, jangan merasa iba atau membiarkan mereka lolos.
    reason: lexical_alternative
  - marker: c
    text: Atau, “sebab itu adalah jerat bagimu.” Kata “itu” kemungkinan terutama menunjuk kepada tindakan mengabdi kepada ilah-ilah mereka, tetapi dapat juga menunjuk lebih luas kepada ilah-ilah itu atau keadaan penyembahan berhala tersebut.
    reason: alternative_reading
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: Engkau harus menghabisi
  rationale: Kata kerja אָכַל secara harfiah berarti ‘makan’, tetapi dalam konteks perang dipakai secara idiomatis untuk menelan habis atau membinasakan. ‘Menghabisi’ menyampaikan kekalahan menyeluruh secara wajar dalam bahasa Indonesia; metafora harfiahnya dicatat dalam catatan kaki.
- source_word: כָּל הָעַמִּים
  choice: semua bangsa
  rationale: Bentuk jamak עַמִּים menunjuk kepada kelompok-kelompok bangsa yang berbeda. ‘Semua bangsa’ merupakan ungkapan Indonesia yang alami dan tetap mempertahankan cakupan menyeluruhnya.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: yang diserahkan Yahweh, Allahmu, kepadamu
  rationale: Partisipel נֹתֵן menggambarkan tindakan yang sedang atau segera berlangsung. Dalam konteks penaklukan, ‘diserahkan ... kepadamu’ menyampaikan makna bahwa bangsa-bangsa itu diberikan ke dalam kuasa Israel tanpa menghilangkan pelaku ilahinya. Nama יהוה ditransliterasikan sebagai ‘Yahweh’.
- source_word: לֹא תָחֹס עֵינְךָ עֲלֵיהֶם
  choice: Janganlah engkau merasa iba kepada mereka
  rationale: Ungkapan Ibrani secara harfiah menyebut mata yang tidak menyayangkan. ‘Merasa iba’ menyampaikan fungsi idiom itu dalam bahasa Indonesia modern, sedangkan citra konkretnya dipertahankan dalam catatan kaki.
- source_word: וְלֹא תַעֲבֹד אֶת אֱלֹהֵיהֶם
  choice: dan janganlah engkau mengabdi kepada ilah-ilah mereka
  rationale: עבד berarti melayani atau mengabdi dan, bila objeknya ilah, mencakup kesetiaan serta ibadah religius. ‘Mengabdi kepada’ mempertahankan keluasan makna itu lebih baik daripada hanya ‘menyembah’.
- source_word: כִּי מוֹקֵשׁ הוּא לָךְ
  choice: sebab hal itu akan menjadi jerat bagimu
  rationale: מוֹקֵשׁ berarti jerat atau perangkap. ‘Hal itu’ secara alami menunjuk terutama kepada tindakan mengabdi kepada ilah-ilah tersebut, tetapi kemungkinan cakupan rujukan yang lebih luas dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Rujukan kata ganti הוּא dalam כִּי מוֹקֵשׁ הוּא לָךְ
  choice: Diterjemahkan ‘hal itu’, dengan rujukan terdekat kepada tindakan mengabdi kepada ilah-ilah mereka.
  alternative: Kata ganti itu dapat menunjuk kepada ilah-ilah tersebut atau secara lebih luas kepada keseluruhan keadaan penyembahan berhala.
  rationale: Larangan mengabdi kepada ilah-ilah mereka adalah anteseden terdekat, tetapi tata bahasa Ibraninya tidak mengharuskan rujukan yang sesempit itu. Teks utama dibuat alami, dan ambiguitas yang sungguh ada didokumentasikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada perintah yang tegas dan bermartabat. Bentuk ‘engkau’ dipakai untuk mempertahankan sapaan tunggal Ibrani. Istilah ‘ilah-ilah’ membedakan dewa-dewa bangsa lain dari sebutan ‘Allah’ bagi Allah Israel. Idiom yang akan terasa janggal bila diterjemahkan mentah dialihkan secara alami, sementara bentuk harfiah dan ambiguitas sumber dipertahankan melalui catatan kaki.
