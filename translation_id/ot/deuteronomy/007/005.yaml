  text: כִּֽי אִם כֹּ֤ה תַעֲשׂוּ֙ לָ/הֶ֔ם מִזְבְּחֹתֵי/הֶ֣ם תִּתֹּ֔צוּ וּ/מַצֵּבֹתָ֖/ם תְּשַׁבֵּ֑רוּ וַ/אֲשֵֽׁירֵ/הֶם֙ תְּגַדֵּע֔וּ/ן וּ/פְסִילֵי/הֶ֖ם תִּשְׂרְפ֥וּ/ן בָּ/אֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/005.yaml
  text: 'But this is what you shall do to them: you shall tear down their altars[a], shatter their pillars, cut down their Asherah poles[c][b], and burn their carved images with fire.'
translation:
  language: id
  text: 'Sebaliknya, beginilah yang harus kamu lakukan terhadap mereka: robohkanlah mazbah-mazbah mereka, hancurkanlah tugu-tugu suci mereka[a], tebanglah tiang-tiang Asyera mereka[b], dan bakarlah patung-patung pahatan mereka dengan api.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “batu-batu tegak mereka.” Yang dimaksud ialah tugu batu yang digunakan dalam pemujaan.'
    reason: lexical_alternative
  - marker: b
    text: 'Ibrani: Asyerim, yaitu benda-benda kultis—kemungkinan berupa tiang atau pohon kayu—yang berkaitan dengan dewi Asyera.'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי אִם כֹּה תַעֲשׂוּ לָהֶם
  choice: Sebaliknya, beginilah yang harus kamu lakukan terhadap mereka
  rationale: כִּי אִם menyatakan pertentangan tegas dengan larangan sebelumnya, sedangkan כֹּה menunjuk ke tindakan-tindakan yang segera dirinci. Bentuk 'harus kamu lakukan' menyampaikan daya perintah dalam bahasa Indonesia modern.
- source_word: מִזְבְּחֹתֵיהֶם תִּתֹּצוּ
  choice: robohkanlah mazbah-mazbah mereka
  rationale: נתץ berarti merobohkan atau membongkar bangunan. 'Mazbah' mempertahankan istilah konkret bagi tempat mempersembahkan kurban dan lazim dalam ragam Alkitab Indonesia.
- source_word: מַצֵּבֹתָם תְּשַׁבֵּרוּ
  choice: hancurkanlah tugu-tugu suci mereka
  rationale: מַצֵּבָה di sini menunjuk pada batu tegak atau tugu kultis, sementara bentuk intensif שׁבר menuntut verba yang kuat. 'Tugu-tugu suci' memperjelas fungsi kultisnya tanpa menjadikannya berhala secara generik.
- source_word: אֲשֵׁירֵיהֶם תְּגַדֵּעוּן
  choice: tebanglah tiang-tiang Asyera mereka
  rationale: אֲשֵׁרִים adalah benda-benda kultis yang terkait dengan Asyera dan kemungkinan terbuat dari kayu; גדע cocok diterjemahkan 'menebang'. 'Tiang-tiang Asyera' komunikatif, dengan ketidakpastian bentuk bendanya dijelaskan dalam catatan.
- source_word: פְסִילֵיהֶם
  choice: patung-patung pahatan mereka
  rationale: פֶּסֶל secara konkret adalah gambar atau patung yang dibuat dengan memahat. Pilihan ini lebih spesifik daripada 'berhala' dan tidak memakai ungkapan arkais.
- source_word: תִּשְׂרְפוּן בָּאֵשׁ
  choice: bakarlah ... dengan api
  rationale: Terjemahan ini mempertahankan penyebutan api secara eksplisit dalam bahasa Ibrani serta daya perintahnya.
theological_decisions:
- issue: Apakah אֲשֵׁרִים diterjemahkan sebagai benda kultis khusus atau berhala secara umum
  choice: tiang-tiang Asyera
  alternative: Asyerim; patung-patung Asyera; berhala-berhala
  rationale: Daftar ini membedakan beberapa jenis perlengkapan kultis Kanaan. Istilah khusus mempertahankan latar keagamaan-historis dan tidak meratakan אֲשֵׁרִים menjadi sebutan umum bagi berhala.
- issue: Kekuatan perintah untuk memusnahkan sarana ibadah bangsa-bangsa itu
  choice: 'Rangkaian imperatif langsung dengan verba kuat: robohkanlah, hancurkanlah, tebanglah, bakarlah'
  alternative: Parafrasa yang lebih lunak seperti 'singkirkanlah'
  rationale: Bahasa Ibrani memerintahkan tindakan konkret dan keras. Terjemahan mempertahankan kekuatan itu tanpa menambahkan pembenaran teologis yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sufiks -lah mempertahankan nada perintah tanpa terasa kaku. Bentuk jamak ulang digunakan pada benda-benda yang secara eksplisit jamak dalam teks. Istilah 'mazbah' dipilih karena ringkas dan mapan dalam ragam Alkitab Indonesia; istilah kultis yang kurang dikenal dijelaskan melalui catatan kaki.
