base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/024.yaml
  text: And he will give their kings into your hand[a], and you shall make their name perish from under heaven. No man will stand before you until you have destroyed them.
translation:
  language: id
  text: Ia akan menyerahkan raja-raja mereka ke dalam tanganmu, dan engkau akan melenyapkan nama mereka dari kolong langit. Tidak seorang pun akan sanggup bertahan di hadapanmu sampai engkau memusnahkan mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָתַן
  choice: Ia akan menyerahkan
  rationale: Bentuk perfektum dengan waw dalam rangkaian janji ini bernilai prediktif. Subjeknya merujuk kepada TUHAN dalam konteks sebelumnya; “menyerahkan” menyampaikan tindakan memberikan musuh ke dalam kuasa Israel.
- source_word: מַלְכֵיהֶם בְּיָדֶךָ
  choice: raja-raja mereka ke dalam tanganmu
  rationale: Mempertahankan bentuk jamak dan citra idiomatis Ibrani tentang penyerahan ke dalam kuasa seseorang; ungkapan ini tetap dapat dipahami dalam bahasa Indonesia.
- source_word: וְהַאֲבַדְתָּ אֶת־שְׁמָם
  choice: engkau akan melenyapkan nama mereka
  rationale: Bentuk Hifil אבד bersifat kausatif, sedangkan objeknya adalah “nama” kolektif mereka. “Melenyapkan nama” secara alami menyatakan penghapusan ingatan atau keberadaan mereka tanpa mengganti objek Ibraninya.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: dari kolong langit
  rationale: Ungkapan Ibrani ini menunjuk pada dunia di bawah langit. “Dari kolong langit” mempertahankan citranya sekaligus merupakan idiom Indonesia yang wajar dan bermartabat.
- source_word: לֹא יִתְיַצֵּב אִישׁ בְּפָנֶיךָ
  choice: Tidak seorang pun akan sanggup bertahan di hadapanmu
  rationale: אִישׁ dipakai sebagai bentuk tunggal representatif, sehingga “tidak seorang pun” menyampaikan cakupan generiknya dengan tepat. Bentuk Hitpael יצב dalam konteks peperangan berarti mengambil posisi dan bertahan melawan; tambahan “sanggup” membuat daya janji tersebut alami dalam bahasa Indonesia.
- source_word: עַד הִשְׁמִדְךָ אֹתָם
  choice: sampai engkau memusnahkan mereka
  rationale: Konstruksi infinitif setelah עַד menyatakan batas akhir tindakan. שׁמד dalam konteks peperangan Ulangan menyatakan penghancuran menyeluruh, yang tepat disampaikan dengan “memusnahkan”.
theological_decisions:
- issue: Cakupan אִישׁ sebagai tunggal maskulin representatif
  choice: Tidak seorang pun
  alternative: Tidak ada seorang laki-laki pun
  rationale: Dalam konstruksi negatif ini אִישׁ bersifat generik, bukan pembatasan khusus kepada laki-laki. Bahasa Indonesia “tidak seorang pun” menjaga cakupan universal tanpa menambahkan pembedaan gender yang tidak menjadi pokok pernyataan.
- issue: Kekuatan makna שׁמד dalam perang penaklukan
  choice: memusnahkan mereka
  alternative: mengalahkan mereka
  rationale: “Mengalahkan” akan memperlemah makna verba yang menunjuk pada penghancuran tuntas. Terjemahan mempertahankan ketegangan keras dalam teks tanpa menambah penjelasan atau pembenaran teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina “Ia” dipakai karena rujukannya kepada TUHAN jelas dari konteks, sedangkan “engkau” mempertahankan sapaan tunggal kepada Israel sebagai umat kolektif. Struktur kalimat mengikuti gerak teks Ibrani tetapi menghindari kekakuan yang tidak perlu.
