source:
  edition: WLC
  text: וְ/הֵסִ֧יר יְהוָ֛ה מִמְּ/ךָ֖ כָּל חֹ֑לִי וְ/כָל מַדְוֵי֩ מִצְרַ֨יִם הָ/רָעִ֜ים אֲשֶׁ֣ר יָדַ֗עְתָּ לֹ֤א יְשִׂימָ/ם֙ בָּ֔/ךְ וּ/נְתָנָ֖/ם בְּ/כָל שֹׂנְאֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/015.yaml
  text: And Yahweh will remove from you all sickness[a], and none of the evil diseases of Egypt that you have known[b] will he put on you; instead, he will put them on all who hate you.
translation:
  language: id
  text: Yahweh akan menjauhkan darimu segala penyakit. Ia tidak akan menimpakan kepadamu satu pun dari penyakit-penyakit Mesir yang parah[a], yang telah kamu kenal[b], tetapi akan menimpakannya kepada semua orang yang membencimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang buruk” atau “yang berbahaya”. Kata Ibrani itu dapat berarti buruk, jahat, berbahaya, atau parah.
    reason: lexical_alternative
  - marker: b
    text: Atau “yang telah kamu alami”. Kata Ibrani yang berarti “mengenal” di sini dapat menunjuk pada pengenalan melalui pengalaman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵסִיר
  choice: akan menjauhkan
  rationale: Bentuk Hifil dari סור menyatakan tindakan menyebabkan sesuatu pergi atau tersingkir. “Menjauhkan darimu” mempertahankan gambaran pemisahan yang juga dinyatakan oleh מִמְּךָ.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: כָּל חֹלִי
  choice: segala penyakit
  rationale: חֹלִי berarti sakit atau penyakit. Bentuk kolektif “segala penyakit” alami dalam bahasa Indonesia dan tetap luas.
- source_word: מַדְוֵי מִצְרַיִם הָרָעִים
  choice: penyakit-penyakit Mesir yang parah
  rationale: מַדְוֵי adalah bentuk jamak yang berarti penyakit, sedangkan הָרָעִים dapat berarti buruk, mencelakakan, atau parah. “Parah” menyampaikan dampak buruknya secara alami tanpa memberi penyakit itu kualitas moral.
- source_word: אֲשֶׁר יָדַעְתָּ
  choice: yang telah kamu kenal
  rationale: יָדַעְתָּ secara harfiah berarti “kamu telah mengenal” dan dalam konteks ini dapat mencakup pengalaman langsung. Terjemahan ini mempertahankan keluasan makna tersebut.
- source_word: לֹא יְשִׂימָם בָּךְ
  choice: Ia tidak akan menimpakan kepadamu satu pun
  rationale: שׂים dengan בְּ menggambarkan penempatan sesuatu pada seseorang. Dalam konteks penyakit, “menimpakan” merupakan ungkapan Indonesia yang alami; “satu pun” menyatakan penyangkalan terhadap seluruh kelompok penyakit itu.
- source_word: וּנְתָנָם בְּכָל שֹׂנְאֶיךָ
  choice: tetapi akan menimpakannya kepada semua orang yang membencimu
  rationale: נתן secara dasar berarti memberi atau menempatkan, tetapi bersama penyakit paling wajar diterjemahkan “menimpakan”. Partisip שֹׂנְאֶיךָ secara tepat berarti orang-orang yang membencimu, bukan sekadar musuh dalam arti umum.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian יהוה secara langsung. Transliterasi “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Cakupan janji tentang penyakit Mesir
  choice: Diterjemahkan sebagai janji konkret dalam konteks perjanjian kepada Israel tanpa diperluas menjadi jaminan kesehatan universal bagi setiap orang dalam segala keadaan.
  alternative: Memahaminya sebagai kekebalan mutlak dan universal dari semua penyakit, atau sebagai kiasan semata-mata untuk penderitaan nonfisik.
  rationale: Ayat ini secara nyata berbicara tentang penyakit dan penyakit-penyakit Mesir, tetapi konteks dan penerimanya tidak boleh diperluas oleh terjemahan melampaui pernyataan teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Kata ganti “kamu” berbentuk tunggal, sesuai dengan sufiks orang kedua tunggal dalam teks Ibrani yang menyapa Israel sebagai satu umat. Pengulangan verba “menimpakan” menjaga hubungan antarklausa dan terdengar alami dalam konteks penyakit.
