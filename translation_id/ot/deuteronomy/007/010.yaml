base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/010.yaml
  text: and repays those who hate him to their face[a], to destroy them. He does not delay with the one who hates him; he will repay him to his face.
translation:
  language: id
  text: dan membalas orang-orang yang membenci-Nya di hadapan mereka[a], untuk membinasakan mereka. Ia tidak menunda membalas orang yang membenci-Nya; Ia akan membalas orang itu di hadapannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke hadapannya”; ungkapan ini juga dapat dipahami sebagai “di hadapan dia” atau, dalam kaitannya dengan kelompok pembenci, “di hadapan mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמְשַׁלֵּם
  choice: dan membalas
  rationale: Bentuk piel dari שׁלם di sini menyatakan pemberian balasan setimpal. “Membalas” alami dalam bahasa Indonesia dan mempertahankan nuansa penghakiman.
- source_word: לְשֹׂנְאָיו
  choice: orang-orang yang membenci-Nya
  rationale: Partisip dari שׂנא menunjuk kepada mereka yang membenci Dia; terjemahan ini lebih tepat daripada istilah lebih luas seperti “musuh-musuh-Nya”.
- source_word: אֶל־פָּנָיו
  choice: langsung di hadapan mereka
  rationale: Ungkapan harfiahnya berkaitan dengan muka atau hadapan seseorang dan dalam konteks ini menekankan balasan yang langsung dan terbuka. Catatan kaki mempertahankan ambiguitas idiomatisnya.
- source_word: לְהַאֲבִידוֹ
  choice: dengan membinasakan mereka
  rationale: Infinitif hifil dari אבד menyatakan akibat atau sarana balasan itu. “Membinasakan” mempertahankan daya ungkap kehancuran yang disengaja oleh subjek ilahi.
- source_word: לֹא יְאַחֵר
  choice: Ia tidak menunda
  rationale: Piel dari אחר berarti menangguhkan atau menunda. Bentuk kini sesuai dengan pernyataan umum mengenai tindakan Allah.
- source_word: לְשֹׂנְאוֹ
  choice: terhadap orang yang membenci-Nya
  rationale: Preposisi ל menandai arah atau relasi tindakan terhadap pembenci itu. “Terhadap” mempertahankan hubungan tersebut secara alami.
- source_word: יְשַׁלֶּם לוֹ
  choice: Ia akan membalas orang itu
  rationale: Terjemahan ini mempertahankan pengulangan akar שׁלם dan fokus tunggal pada orang yang membenci-Nya dalam klausa kedua.
theological_decisions:
- issue: Bahasa penghakiman ilahi
  choice: Allah secara langsung membalas dan membinasakan orang-orang yang membenci-Nya
  alternative: Menjadikannya sekadar akibat impersonal dari tindakan mereka
  rationale: Teks Ibrani menampilkan Allah sebagai subjek langsung. Terjemahan tidak melunakkan tindakan pribadi-Nya menjadi konsekuensi yang impersonal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi pronomina ilahi dipakai menurut kebiasaan penerbitan Alkitab Indonesia. Pergeseran dari bentuk jamak pada klausa pertama ke bentuk tunggal pada klausa kedua dipertahankan.
