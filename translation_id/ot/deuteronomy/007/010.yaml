    rationale: Verba "menunda" dalam bahasa Indonesia lazim mengambil tindakan atau peristiwa sebagai pelengkap. Menyebut tindakan yang ditunda, yaitu pembalasan, membuat kalimat alami tanpa mengubah makna.
  - severity: low
    issue: Kata "langsung" pada kedua kemunculan "di hadapan" menambahkan penekanan yang tidak diperlukan.
