base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/011.yaml
  text: So you shall keep the commandment and the statutes and the judgments that I am commanding you today[b][a], to do them.
translation:
  language: id
  text: Jadi[a], taatilah perintah, ketetapan, dan peraturan[b] yang Kuperintahkan kepadamu hari ini untuk kamu lakukan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Dan taatilah” atau “Oleh karena itu, taatilah”; kata penghubung Ibrani dapat menyatakan hubungan biasa ataupun kesimpulan dari ayat-ayat sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: “Peraturan” juga dapat diterjemahkan “keputusan hukum” atau “ketentuan hukum”; istilah Ibrani ini dapat menunjuk pada keputusan atau ketetapan hukum.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: Jadi, taatilah
  rationale: Verba שׁמר dalam konteks hukum perjanjian berarti menaati atau memelihara. Bentuk Ibrani menyatakan kewajiban; imperatif Indonesia menyampaikannya secara alami. Kata penghubung diterjemahkan “Jadi” untuk menunjukkan kemungkinan hubungan kesimpulan dengan ayat-ayat sebelumnya, sementara alternatifnya dicatat dalam catatan kaki.
- source_word: הַמִּצְוָה
  choice: perintah
  rationale: Bentuk tunggal dipertahankan. “Perintah” merupakan padanan Indonesia modern yang wajar dan tetap dibedakan dari dua kategori hukum berikutnya.
- source_word: הַחֻקִּים
  choice: ketetapan
  rationale: “Ketetapan” mempertahankan nuansa ketentuan yang telah ditetapkan serta membedakannya dari מִשְׁפָּטִים.
- source_word: הַמִּשְׁפָּטִים
  choice: peraturan
  rationale: Dalam konteks ini מִשְׁפָּטִים menunjuk pada keputusan atau ketentuan hukum. “Peraturan” mudah dipahami dalam bahasa Indonesia modern; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: yang kusampaikan kepadamu hari ini
  rationale: Ungkapan ini menyatakan tindakan Musa yang sedang memberikan perintah pada hari itu. “Kusampaikan” menghindari pengulangan janggal “perintah yang kuperintahkan” tanpa menghilangkan fungsi tindakan memerintah.
- source_word: לַעֲשׂוֹתָם
  choice: untuk kamu lakukan
  rationale: Menerjemahkan secara konkret infinitif עשה dan akhiran jamak yang merujuk pada seluruh ketentuan tersebut.
theological_decisions:
- issue: Pembedaan tiga istilah hukum perjanjian
  choice: perintah, ketetapan, dan peraturan
  alternative: perintah, ketetapan, dan keputusan hukum
  rationale: Ketiga istilah yang saling bertumpang tindih tetap dibedakan demi mempertahankan daya retoris dan ragam hukum teks Ibrani, tanpa membebankan perbedaan teologis yang tidak dinyatakan teks.
- issue: Daya hubungan וְ dengan konteks sebelumnya
  choice: Jadi
  alternative: Dan; Oleh karena itu
  rationale: Konteks mendukung nuansa kesimpulan, tetapi konjungsi Ibrani juga dapat sekadar mengoordinasikan kalimat. Ambiguitas itu dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan daftar dibuat alami dalam bahasa Indonesia, sementara tiga istilah hukum tetap dibedakan. Penanda catatan kaki ditempatkan pada unsur yang dijelaskannya.
