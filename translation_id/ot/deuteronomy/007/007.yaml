  text: לֹ֣א מֵֽ/רֻבְּ/כֶ֞ם מִ/כָּל הָֽ/עַמִּ֗ים חָשַׁ֧ק יְהוָ֛ה בָּ/כֶ֖ם וַ/יִּבְחַ֣ר בָּ/כֶ֑ם כִּֽי אַתֶּ֥ם הַ/מְעַ֖ט מִ/כָּל הָ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/007.yaml
  text: It was not because you were more numerous than all the peoples that Yahweh set his affection on you and chose you[a], for you were the fewest of all the peoples.
translation:
  language: id
  text: Bukan karena kamu lebih banyak jumlahnya daripada semua bangsa Yahweh menaruh kasih-Nya kepadamu[a] dan memilih kamu, sebab kamulah yang paling sedikit jumlahnya di antara semua bangsa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengikatkan hati-Nya kepadamu.” Kata kerja Ibrani ini menyatakan keterikatan atau kasih sayang yang kuat.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֻבְּכֶם
  choice: karena kamu lebih banyak
  rationale: Dalam konstruksi penyangkalan ini, מִן dengan gagasan jumlah menyatakan perbandingan yang juga menjadi alasan yang disangkal; ungkapan ini alami dalam bahasa Indonesia.
- source_word: מִכָּל הָעַמִּים
  choice: daripada segala bangsa / di antara segala bangsa
  rationale: עַמִּים menunjuk pada kelompok-kelompok bangsa; dua bentuk Indonesia dipakai sesuai fungsi perbandingan masing-masing klausa.
- source_word: חָשַׁק
  choice: menaruh kasih-Nya kepada
  rationale: Kata ini menyatakan keterikatan atau kasih sayang yang kuat dan disengaja. Ungkapan tersebut mempertahankan aspek relasional tanpa mempersempitnya menjadi istilah doktrinal tertentu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: וַיִּבְחַר
  choice: dan memilih
  rationale: בחר secara langsung berarti memilih; terjemahan ini mempertahankan bahasa pemilihan dalam konteks perjanjian tanpa menambahkan penjelasan teologis.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan penjelasan yang menegaskan keadaan Israel yang berlawanan dengan alasan yang sebelumnya disangkal.
- source_word: הַמְעַט
  choice: yang paling sedikit
  rationale: Ungkapan ini bersifat predikatif dan menyatakan kecilnya jumlah Israel secara relatif dibandingkan dengan bangsa-bangsa lain.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama pribadi ilahi; bentuk Yahweh mempertahankan nama itu secara langsung.
- issue: Kemungkinan pembacaan doktrinal berlebihan atas pilihan ilahi
  choice: dan memilih kamu
  alternative: dan menetapkan kamu sebagai umat pilihan
  rationale: Terjemahan mempertahankan pernyataan eksplisit bahwa Yahweh memilih Israel, tetapi tidak menambahkan kategori atau akibat teologis yang tidak dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk tunggal kolektif “kamu” dipertahankan karena Musa menyapa Israel sebagai satu umat. Susunan “Bukan karena ... maka ...” membuat hubungan penyangkalan dan alasan terbaca alami.
