  text: כִּי֩ מֵֽ/אַהֲבַ֨ת יְהוָ֜ה אֶתְ/כֶ֗ם וּ/מִ/שָּׁמְר֤/וּ אֶת הַ/שְּׁבֻעָה֙ אֲשֶׁ֤ר נִשְׁבַּע֙ לַ/אֲבֹ֣תֵי/כֶ֔ם הוֹצִ֧יא יְהוָ֛ה אֶתְ/כֶ֖ם בְּ/יָ֣ד חֲזָקָ֑ה וַֽ/יִּפְדְּ/ךָ֙ מִ/בֵּ֣ית עֲבָדִ֔ים מִ/יַּ֖ד פַּרְעֹ֥ה מֶֽלֶךְ מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/008.yaml
  text: but because Yahweh loves you and because he is keeping the oath that he swore to your fathers[a], Yahweh brought you out with a mighty hand and redeemed you from the house of servants[b], from the hand of Pharaoh king of Egypt.
translation:
  language: id
  text: Namun, karena Yahweh mengasihi kalian dan menepati sumpah yang telah diikrarkan-Nya kepada leluhur kalian, Yahweh membawa kalian keluar dengan tangan yang kuat dan menebus kalian[a] dari rumah perbudakan[b], dari tangan Firaun, raja Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Pada kata “menebus kalian”, teks Ibrani beralih dari sapaan jamak menjadi sapaan tunggal, sehingga secara harfiah berbunyi “menebus engkau”. Israel dipandang sebagai satu umat.
    reason: source_form
  - marker: b
    text: Secara harfiah, “rumah para budak”; maksudnya adalah tempat atau ranah perbudakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי מֵאַהֲבַת יְהוָה אֶתְכֶם
  choice: Namun, karena Yahweh mengasihi kalian
  rationale: כִּי menerangkan sekaligus mengontraskan ayat ini dengan penyangkalan pada ayat 7. Bentuk nominal מֵאַהֲבַת dialihkan secara alami menjadi klausa sebab, tanpa mengubah maknanya.
- source_word: וּמִשָּׁמְרוֹ אֶת הַשְּׁבֻעָה
  choice: dan menepati sumpah
  rationale: שׁמר dalam konteks sumpah menyatakan bahwa Yahweh memelihara atau memenuhi komitmen-Nya. 'Menepati sumpah' alami dalam bahasa Indonesia dan mempertahankan sifat aktif konstruksi Ibrani.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֵיכֶם
  choice: yang telah diucapkan-Nya kepada leluhur kalian
  rationale: Kata אָבוֹת secara harfiah berarti 'bapa-bapa', tetapi dalam konteks sejarah perjanjian menunjuk kepada para leluhur Israel. 'Leluhur' jelas dan alami dalam bahasa Indonesia, sedangkan 'mengucapkan sumpah' menyampaikan tindakan נִשְׁבַּע.
- source_word: בְּיָד חֲזָקָה
  choice: dengan tangan yang kuat
  rationale: Terjemahan ini mempertahankan citra tangan dalam idiom Ibrani tentang tindakan penyelamatan yang penuh kuasa.
- source_word: וַיִּפְדְּךָ
  choice: dan menebus kalian
  rationale: פדה menyatakan pembebasan dari ikatan atau kekuasaan melalui tindakan penebusan. 'Menebus' menjaga bobot motif keluaran, sementara bentuk orang kedua tunggal kolektif dijelaskan dalam catatan kaki.
- source_word: מִבֵּית עֲבָדִים
  choice: dari rumah perbudakan
  rationale: Ungkapan idiomatis ini menggambarkan Mesir sebagai ranah perbudakan. 'Rumah perbudakan' alami dan bermartabat dalam bahasa Indonesia, dengan bentuk harfiahnya dicatat.
- source_word: מִיַּד פַּרְעֹה מֶלֶךְ מִצְרָיִם
  choice: dari tangan Firaun, raja Mesir
  rationale: Mempertahankan metafora 'tangan' sebagai kuasa atau kendali dan menyajikan gelar Firaun secara jelas.
theological_decisions:
- issue: Penyajian nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה, bukan gelar. Transliterasi 'Yahweh' mempertahankan nama pribadi yang ada dalam sumber.
- issue: Makna pemeliharaan sumpah
  choice: menepati sumpah
  alternative: memegang sumpah
  rationale: Pilihan ini menyatakan kesetiaan Yahweh kepada sumpah-Nya tanpa menambahkan kerangka teologis yang tidak dinyatakan teks.
- issue: Gambaran pembebasan dari Mesir
  choice: menebus
  alternative: membebaskan
  rationale: Kata פדה lebih khusus daripada tindakan penyelamatan umum dan mempertahankan gagasan penebusan dari perbudakan, tanpa menentukan mekanisme yang tidak disebutkan dalam ayat.
- issue: Peralihan jumlah gramatikal pada sapaan Israel
  choice: kalian dalam teks utama, dengan catatan tentang bentuk tunggal kolektif
  alternative: engkau pada klausa 'menebus engkau'
  rationale: Bahasa Ibrani beralih dari bentuk jamak kepada bentuk tunggal pada וַיִּפְדְּךָ. Bahasa Indonesia yang alami dapat mempertahankan acuan kolektif dengan 'kalian', sementara catatan kaki menjaga rincian bentuk sumber dan ketegangannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. 'Kalian' dipakai untuk membuat sapaan jamak jelas bagi pembaca masa kini. Metafora tangan dipertahankan pada kedua bagiannya, dan istilah 'rumah perbudakan' dipilih sebagai ungkapan yang alami tanpa menghilangkan citra sumber.
