  text: וְ/נָשַׁל֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ אֶת הַ/גּוֹיִ֥ם הָ/אֵ֛ל מִ/פָּנֶ֖י/ךָ מְעַ֣ט מְעָ֑ט לֹ֤א תוּכַל֙ כַּלֹּתָ֣/ם מַהֵ֔ר פֶּן תִּרְבֶּ֥ה עָלֶ֖י/ךָ חַיַּ֥ת הַ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/022.yaml
  text: And Yahweh your God will drive out these nations before you little by little[a]. You will not be able to finish them off quickly[b], lest the wild animals become too numerous against you.
translation:
  language: id
  text: Yahweh, Allahmu, akan menghalau bangsa-bangsa ini dari hadapanmu sedikit demi sedikit.[a] Engkau tidak akan sanggup melenyapkan mereka dengan cepat, supaya jangan binatang liar[b] menjadi terlalu banyak bagimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “akan menyingkirkan bangsa-bangsa ini dari hadapanmu sedikit demi sedikit.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “binatang di padang.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשַׁל
  choice: akan menghalau
  rationale: Dalam konteks penguasaan tanah, verba ini menyatakan tindakan menyingkirkan bangsa-bangsa dari hadapan Israel. “Menghalau” alami dalam bahasa Indonesia dan tetap memuat nuansa pemindahan paksa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: הַגּוֹיִם הָאֵל
  choice: bangsa-bangsa ini
  rationale: Pilihan ini mempertahankan makna jamak גּוֹיִם dan daya tunjuk הָאֵל.
- source_word: מִפָּנֶיךָ
  choice: dari hadapanmu
  rationale: Ungkapan ini mempertahankan citra spasial Ibrani tentang bangsa-bangsa yang disingkirkan dari hadapan Israel.
- source_word: מְעַט מְעָט
  choice: sedikit demi sedikit
  rationale: Pengulangan dalam bahasa sumber diterjemahkan dengan ungkapan Indonesia yang alami dan menegaskan proses bertahap.
- source_word: לֹא תוּכַל
  choice: Engkau tidak akan sanggup
  rationale: Bentuk ini menyampaikan ketidakmampuan dalam konteks yang berorientasi ke masa depan, tanpa mengubahnya menjadi larangan.
- source_word: כַּלֹּתָם
  choice: melenyapkan mereka
  rationale: Bentuk dari כלה di sini menunjuk pada tindakan membawa bangsa-bangsa itu sampai pada kesudahan. “Melenyapkan” jelas dan bermartabat, tanpa nada percakapan dari “menghabisi”.
- source_word: מַהֵר
  choice: dengan cepat
  rationale: Padanan adverbial Indonesia yang langsung dan alami.
- source_word: פֶּן
  choice: supaya jangan
  rationale: Ungkapan ini mempertahankan nuansa pencegahan atau akibat yang dikhawatirkan dari פֶּן.
- source_word: תִּרְבֶּה
  choice: bertambah banyak
  rationale: Verba ini berarti menjadi banyak atau meningkat jumlahnya; pilihan ini tidak menambahkan kadar yang tidak dinyatakan secara eksplisit.
- source_word: חַיַּת הַשָּׂדֶה
  choice: binatang-binatang liar
  rationale: Secara harfiah ungkapan ini adalah “binatang di padang”; dalam konteks tanah yang belum segera diduduki, yang dimaksud ialah satwa liar, bukan ternak.
- source_word: עָלֶיךָ
  choice: dan membahayakanmu
  rationale: Preposisi ini menyatakan pertambahan yang berakibat buruk bagi Israel. Terjemahan ini mengungkapkan daya adversatif konteks secara alami tanpa secara khusus menyatakan bahwa binatang itu pasti menyerang.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama perjanjian itu dan tidak menggantinya dengan sebuah gelar.
- issue: Sifat ketidakmampuan Israel untuk melenyapkan bangsa-bangsa dengan cepat
  choice: tidak akan sanggup
  alternative: tidak boleh
  rationale: לֹא תוּכַל secara gramatikal menyatakan ketidakmampuan, bukan larangan langsung. Terjemahan tidak menyelesaikan ketegangan antara janji penghalauan ilahi dan keterbatasan tindakan Israel.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti tunggal “engkau/-mu” mempertahankan sapaan langsung kepada Israel sebagai satu kesatuan. Susunan kalimat dibuat alami sambil mempertahankan urutan gagasan dan ketegangan teks Ibrani.
