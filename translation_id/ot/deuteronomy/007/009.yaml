language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/יָ֣דַעְתָּ֔ כִּֽי יְהוָ֥ה אֱלֹהֶ֖י/ךָ ה֣וּא הָֽ/אֱלֹהִ֑ים הָ/אֵל֙ הַֽ/נֶּאֱמָ֔ן שֹׁמֵ֧ר הַ/בְּרִ֣ית וְ/הַ/חֶ֗סֶד לְ/אֹהֲבָ֛י/ו וּ/לְ/שֹׁמְרֵ֥י מצות/ו לְ/אֶ֥לֶף דּֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/009.yaml
  text: Know[a], therefore, that Yahweh your God, he is God, the faithful God, keeping the covenant and the steadfast love for those who love him and for those who keep his commandments[d][c][b], to a thousand generations.
translation:
  language: id
  text: Jadi, ketahuilah[a] bahwa Yahweh, Allahmu, Dialah Allah, Allah yang setia, yang memelihara perjanjian dan kasih setia[b] bagi orang-orang yang mengasihi-Nya dan yang menaati perintah-perintah-Nya, hingga seribu generasi[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Dan ketahuilah” atau “Karena itu, ketahuilah”; kata penghubung Ibrani dapat menyatakan kelanjutan sederhana ataupun kesimpulan dari konteks sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: Ibrani חֶסֶד (khesed); mencakup nuansa kasih yang teguh, kesetiaan perjanjian, kemurahan, dan belas kasih.
    reason: lexical_alternative
  - marker: c
    text: Dapat juga dipahami, “bagi orang-orang yang mengasihi-Nya dan yang menaati perintah-perintah-Nya, selama seribu generasi.” Ungkapan ini menekankan kesetiaan perjanjian yang bertahan sangat lama.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: Jadi, ketahuilah
  rationale: Bentuk Qal perfektif orang kedua tunggal maskulin berfungsi sebagai desakan dalam konteks. Konjungsi וְ dipahami secara inferensial dari ayat-ayat sebelumnya dan diterjemahkan 'Jadi'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, sesuai bentuk Ibrani dan fungsi perjanjiannya.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk dengan sufiks orang kedua tunggal diterjemahkan secara langsung dan alami.
- source_word: הוּא הָאֱלֹהִים
  choice: Dialah Allah
  rationale: Kata ganti הוּא memberi penegasan; konstruksi Indonesia 'Dialah Allah' mempertahankan tekanan dan pengakuan eksklusif tersebut.
- source_word: הָאֵל הַנֶּאֱמָן
  choice: Allah yang setia
  rationale: אֵל digunakan secara aposisional, sedangkan נֶאֱמָן menyatakan keteguhan, keterandalan, dan kesetiaan, khususnya dalam konteks perjanjian.
- source_word: שֹׁמֵר הַבְּרִית
  choice: yang memegang teguh perjanjian
  rationale: Partisipel menggambarkan tindakan Allah yang terus berlangsung. 'Memegang teguh' alami dalam bahasa Indonesia dan menyampaikan pemeliharaan komitmen perjanjian.
- source_word: וְהַחֶסֶד
  choice: dan kasih setia
  rationale: חֶסֶד memadukan kasih, kemurahan, dan kesetiaan relasional atau perjanjian; 'kasih setia' merupakan padanan Indonesia yang ringkas dan mapan.
- source_word: לְאֹהֲבָיו
  choice: bagi orang-orang yang mengasihi-Nya
  rationale: Preposisi לְ menandai pihak yang menerima atau mengalami pemeliharaan perjanjian dan kasih setia Allah.
- source_word: וּלְשֹׁמְרֵי מִצְוֹתָו
  choice: dan menaati perintah-perintah-Nya
  rationale: Secara harfiah berarti 'dan bagi mereka yang memelihara perintah-perintah-Nya'. Dalam bahasa Indonesia, penggabungan dengan kelompok sebelumnya menghindari pengulangan yang kaku sambil tetap menyatakan bahwa orang yang sama mengasihi dan taat.
- source_word: לְאֶלֶף דּוֹר
  choice: sampai seribu generasi
  rationale: Ungkapan ini menyatakan jangkauan kesetiaan perjanjian yang sangat panjang. 'Sampai' membedakan fungsi temporal לְ dari fungsi benefaktifnya sebelumnya.
theological_decisions:
- issue: Hubungan kesetiaan perjanjian Allah dengan kasih dan ketaatan manusia
  choice: Allah memegang teguh perjanjian dan kasih setia bagi mereka yang mengasihi-Nya dan menaati perintah-perintah-Nya.
  alternative: Allah menunjukkan kasih setia kepada mereka yang mengasihi-Nya, tanpa menonjolkan unsur ketaatan sebagai pasangan yang sejajar.
  rationale: Teks Ibrani secara eksplisit menyejajarkan orang yang mengasihi Allah dengan orang yang memelihara perintah-Nya. Terjemahan mempertahankan ketegangan perjanjian ini tanpa memasukkan sistem teologis kemudian.
- issue: Cakupan frasa 'seribu generasi'
  choice: Frasa itu menerangkan lamanya Allah memegang teguh perjanjian dan kasih setia.
  alternative: 'Frasa itu dapat dilekatkan lebih dekat kepada kelompok orang yang mengasihi dan menaati Allah: ''bagi ... sampai seribu generasi''.'
  rationale: Susunan Ibrani memungkinkan keterkaitan sintaksis yang tidak sepenuhnya tegas. Teks utama memilih pembacaan duratif yang paling alami, sedangkan catatan kaki menjaga kemungkinan pelekatan alternatif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada luhur namun mudah dipahami. Kapitalisasi pronomina ilahi mengikuti kebiasaan religius Indonesia. 'Memegang teguh perjanjian' dipilih daripada bentuk yang lebih harfiah tetapi kurang alami, sedangkan 'kasih setia' mempertahankan bobot perjanjian חֶסֶד.
