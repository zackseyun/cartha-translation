  terminology: '"Yahweh", "Allah", "perjanjian", "kasih setia", dan "perintah-perintah" tepat dan konsisten. Kapitalisasi pronomina ilahi sesuai kebiasaan Indonesia. Tidak diperlukan penambahan penafsiran teologis.'
