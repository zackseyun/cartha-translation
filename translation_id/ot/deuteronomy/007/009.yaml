revisions:
- from: Jadi, ketahuilah[a] bahwa Yahweh, Allahmu, Dialah Allah, Allah yang setia, yang memegang teguh perjanjian dan kasih setia[b] bagi orang-orang yang mengasihi-Nya dan menaati perintah-perintah-Nya, sampai seribu generasi[c].
  to: Jadi, ketahuilah[a] bahwa Yahweh, Allahmu, Dialah Allah, Allah yang setia, yang memelihara perjanjian dan kasih setia[b] bagi orang-orang yang mengasihi-Nya dan yang menaati perintah-perintah-Nya, hingga seribu generasi[c].
  rationale: Revisi terbatas pada kejelasan paralelisme Ibrani dan kelancaran kolokasi Indonesia. Pilihan inferensial "Jadi" serta catatan kaki yang mempertahankan kemungkinan "Dan" atau "Karena itu" tetap dapat dipertahankan. Catatan mengenai kemungkinan cakupan frasa "seribu generasi" juga tetap diperlukan untuk menjaga ambiguitas sintaksis yang ada.
