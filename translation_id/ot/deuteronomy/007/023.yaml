base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/023.yaml
  text: But Yahweh your God will give them over to you and throw them into great confusion until they are destroyed[a][b].
translation:
  language: id
  text: Namun, Yahweh, Allahmu, akan menyerahkan mereka kepadamu[a] dan menimbulkan kekacauan besar di antara mereka[b] sampai mereka dimusnahkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di hadapanmu.” Dalam konteks ini, ungkapan tersebut berarti bahwa Yahweh menyerahkan musuh-musuh itu ke dalam kuasamu.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “kepanikan besar” atau “kegemparan besar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָם ... לְפָנֶיךָ
  choice: akan menyerahkan mereka kepadamu
  rationale: Dalam konteks peperangan, נָתַן dengan objek langsung dan לְפָנֶיךָ menyatakan penyerahan musuh ke dalam kuasa pihak lain. Ungkapan ini menyampaikan makna idiomatisnya secara wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk konstruk dengan akhiran orang kedua maskulin tunggal berarti ‘Allahmu’.
- source_word: וְהָמָם מְהוּמָה גְדֹלָה
  choice: dan membuat mereka dilanda kekacauan besar
  rationale: Kata kerja הָמַם bersifat kausatif dalam konteks ini dan menunjuk pada timbulnya kepanikan, kebingungan, atau kocar-kacir dalam pertempuran. Terjemahan ini mempertahankan daya kausatif tanpa pengulangan yang kaku.
- source_word: עַד הִשָּׁמְדָם
  choice: sampai mereka dimusnahkan
  rationale: 'עַד diikuti infinitif konstruk Nifal dengan akhiran jamak menyatakan batas akhir tindakan: sampai mereka mengalami pemusnahan.'
theological_decisions:
- issue: Penerjemahan nama ilahi YHWH
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai יהוה secara langsung. Bentuk ‘Yahweh’ mempertahankan nama perjanjian sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Pelaku pemusnahan dalam frasa penutup
  choice: 'bentuk pasif: ‘mereka dimusnahkan’'
  alternative: ‘kamu memusnahkan mereka’ atau ‘Yahweh memusnahkan mereka’
  rationale: Bentuk Ibrani menyatakan keadaan atau peristiwa pemusnahan tanpa menyebut pelakunya secara eksplisit. Bentuk pasif mempertahankan ketaktertentuan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Namun’ mempertahankan hubungan pertentangan dengan konteks sebelumnya; ‘dilanda kekacauan besar’ menyampaikan suasana kocar-kacir dalam pertempuran secara alami.
