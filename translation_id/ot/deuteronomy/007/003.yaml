base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/003.yaml
  text: 'And you shall not intermarry with them: you shall not give your daughter to his son[a], and you shall not take his daughter for your son.'
translation:
  language: id
  text: 'Janganlah kamu menjalin ikatan perkawinan dengan mereka: anak perempuanmu jangan kauberikan kepada anak laki-laki mereka, dan anak perempuan mereka jangan kauambil untuk anak laki-lakimu.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִתְחַתֵּן
  choice: kawin campur
  rationale: Bentuk Hitpael dari חתן menunjuk pada tindakan menjalin hubungan perkawinan dengan kelompok-kelompok yang disebut sebelumnya. 'Kawin campur' menyampaikan dimensi antarkelompok dan timbal balik secara ringkas dalam bahasa Indonesia.
- source_word: בָּם
  choice: dengan mereka
  rationale: Preposisi ב dengan sufiks orang ketiga jamak maskulin merujuk kepada bangsa-bangsa dalam konteks sebelumnya; 'dengan mereka' merupakan padanan alami dalam ungkapan ini.
- source_word: בִּתְּךָ
  choice: anak perempuanmu
  rationale: Padanan langsung bagi bentuk tunggal dengan sufiks orang kedua tunggal maskulin.
- source_word: תִתֵּן
  choice: kauberikan
  rationale: Mempertahankan arti dasar 'memberikan'. Konteks perkawinan sudah menjelaskan bahwa yang dimaksud ialah memberikan sebagai istri, sehingga tambahan 'untuk dinikahi' tidak diperlukan.
- source_word: לִבְנוֹ
  choice: kepada anak laki-laki mereka
  rationale: Lamed menandai penerima. Sufiks Ibrani berbentuk tunggal karena rumusan hukum membayangkan seorang anggota dari kelompok tersebut; bahasa Indonesia memakai 'mereka' agar rujukannya jelas dan tidak mengandaikan satu laki-laki tertentu.
- source_word: וּבִתּוֹ
  choice: anak perempuan mereka
  rationale: Menerjemahkan istilah kekerabatan yang bergender secara eksplisit. 'Mereka' mempertahankan rujukan kolektif kepada bangsa-bangsa yang disebut sebelumnya.
- source_word: תִקַּח
  choice: kauambil
  rationale: Mempertahankan verba dasar 'mengambil'; dalam konteks ini tindakannya adalah mengambil seorang perempuan untuk menjadi istri anak laki-laki.
- source_word: לִבְנֶךָ
  choice: untuk anak laki-lakimu
  rationale: Padanan alami bagi relasi yang ditandai lamed, sambil mempertahankan istilah kekerabatan tunggal dan bergender.
theological_decisions:
- issue: Cakupan larangan
  choice: Larangan kawin campur dengan bangsa-bangsa yang dirujuk oleh 'mereka' dalam konteks langsung.
  alternative: Menjadikannya larangan umum terhadap semua perkawinan dengan orang asing.
  rationale: Ayat ini sendiri merujuk kepada kelompok-kelompok tertentu yang telah disebutkan sebelumnya. Terjemahan tidak memperluas cakupan larangan dan tidak memasukkan alasan teologis dari ayat berikutnya.
- issue: Istilah kekerabatan bergender
  choice: Mempertahankan 'anak perempuan' dan 'anak laki-laki' sebagaimana rumusan Ibrani.
  alternative: Menetralkannya menjadi 'anak-anak'.
  rationale: Teks Ibrani memakai istilah tunggal yang spesifik gender dalam rumusan hukum yang representatif; bentuk itu perlu dipertahankan.
- issue: Sufiks tunggal pada pihak bangsa lain
  choice: Menerjemahkan pronomina sebagai 'mereka' untuk memperjelas rujukan kolektif dalam bahasa Indonesia.
  alternative: Menerjemahkan secara kaku sebagai 'anak laki-lakinya' dan 'anak perempuannya'.
  rationale: Sufiks Ibrani 3ms merujuk secara distributif kepada anggota bangsa-bangsa yang secara kolektif disebut 'mereka'. Bentuk Indonesia 'mereka' menghindari kesan adanya satu tokoh laki-laki tertentu tanpa mengubah cakupan rujukannya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Bentuk terikat 'kauberikan' dan 'kauambil' dipilih untuk menjaga ketegasan gaya hukum. 'Kawin campur' digunakan dalam arti perkawinan antarkelompok pada konteks ini, bukan sebagai generalisasi di luar bangsa-bangsa yang disebut sebelumnya.
