  yaml_path: translation/ot/deuteronomy/007/018.yaml
  text: You shall not fear them[a]; you shall surely remember what Yahweh your God did to Pharaoh and to all Egypt.
translation:
  language: id
  text: Janganlah takut kepada mereka. Ingatlah sungguh-sungguh[a] apa yang telah Yahweh, Allahmu, lakukan terhadap Firaun dan seluruh Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, bahasa Ibrani mengulang akar katanya: “mengingat, engkau harus mengingat.” Bentuk ini memberi penegasan, yakni “sungguh-sungguh mengingat” atau “mengingat baik-baik.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִירָא מֵהֶם
  choice: Jangan takut kepada mereka
  rationale: Bentuk imperfek dengan לֹא berfungsi sebagai larangan dalam konteks nasihat ini. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan mereka sebagai objek rasa takut.
- source_word: זָכֹר תִּזְכֹּר
  choice: Engkau harus sungguh-sungguh mengingat
  rationale: Gabungan infinitif absolut dan verba imperfek memberi penegasan kuat. 'Harus sungguh-sungguh mengingat' menyampaikan baik tuntutan maupun intensitas bentuk Ibraninya.
- source_word: אֵת אֲשֶׁר עָשָׂה
  choice: apa yang dilakukan
  rationale: Ungkapan relatif ini secara alami diterjemahkan 'apa yang dilakukan'; bentuk perfektif menunjuk kepada tindakan historis yang telah selesai.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama perjanjian dalam teks sumber tetap tampak.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Akhiran orang kedua tunggal dipertahankan dengan '-mu', sesuai dengan sapaan tunggal kepada Israel sebagai umat perjanjian.
- source_word: לְפַרְעֹה
  choice: terhadap Firaun
  rationale: Preposisi לְ setelah עשה menandai pihak yang dikenai tindakan. 'Terhadap Firaun' jelas dan wajar dalam konteks tindakan penghukuman.
- source_word: וּלְכָל מִצְרָיִם
  choice: dan seluruh Mesir
  rationale: Teks menyebut Mesir secara kolektif sebagai negeri/bangsa, bukan secara eksplisit 'orang-orang Mesir'; 'seluruh Mesir' mempertahankan cakupan itu.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama pribadi ilahi tanpa menggantinya dengan gelar.
- issue: Daya perintah dalam זָכֹר תִּזְכֹּר
  choice: Engkau harus sungguh-sungguh mengingat
  alternative: Ingatlah baik-baik atau engkau pasti akan mengingat
  rationale: Dalam konteks nasihat Musa, bentuk yang ditegaskan ini paling wajar dipahami sebagai desakan kuat untuk mengingat, sambil tetap mempertahankan tekanan gramatikalnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan tunggal 'Engkau' dipakai untuk mencerminkan bentuk orang kedua maskulin tunggal dalam bahasa Ibrani, sedangkan kalimat pertama memakai subjek tersirat agar tetap alami. Tanda catatan kaki ditempatkan tepat setelah frasa yang dijelaskannya.
