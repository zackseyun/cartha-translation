source:
  edition: WLC
  text: וְ/הָיָ֣ה עֵ֣קֶב תִּשְׁמְע֗וּ/ן אֵ֤ת הַ/מִּשְׁפָּטִים֙ הָ/אֵ֔לֶּה וּ/שְׁמַרְתֶּ֥ם וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם וְ/שָׁמַר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ לְ/ךָ֗ אֶֽת הַ/בְּרִית֙ וְ/אֶת הַ/חֶ֔סֶד אֲשֶׁ֥ר נִשְׁבַּ֖ע לַ/אֲבֹתֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/012.yaml
  text: And because you listen to these judgments[a], and keep and do them[c][b], Yahweh your God will keep for you the covenant and the steadfast love that he swore to your fathers.
translation:
  language: id
  text: Jika kamu mendengarkan ketentuan-ketentuan ini[a], memeliharanya dan melakukannya, maka Yahweh, Allahmu, akan memelihara bagi kamu perjanjian dan kasih setia[b] yang telah Dia sumpahkan kepada para bapa leluhurmu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “peraturan-peraturan ini”, “ketetapan-ketetapan ini”, atau “keputusan-keputusan hukum ini”.
    reason: lexical_alternative
  - marker: b
    text: “Kasih setia” menerjemahkan kata Ibrani khesed, yaitu kasih yang teguh dan loyal, khususnya dalam hubungan perjanjian; dapat juga diterjemahkan “kesetiaan pada perjanjian”.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “bapa-bapamu”; ungkapan ini merujuk kepada para bapa pendahulu Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה עֵקֶב
  choice: Apabila
  rationale: Ungkapan ini memperkenalkan akibat yang bergantung pada tindakan berikutnya. “Apabila” menyampaikan hubungan bersyarat-konsekuensial secara alami tanpa menganggap ketaatan itu sudah pasti terjadi.
- source_word: תִּשְׁמְעוּן
  choice: kamu mendengarkan
  rationale: Kata שׁמע mencakup mendengar dengan tanggapan taat. “Mendengarkan” mempertahankan unsur mendengar, sedangkan tindakan ketaatan dijabarkan oleh dua verba berikutnya.
- source_word: הַמִּשְׁפָּטִים הָאֵלֶּה
  choice: ketetapan-ketetapan hukum ini
  rationale: מִשְׁפָּטִים menunjuk pada keputusan atau ketentuan hukum. Pilihan ini jelas bagi pembaca modern dan tetap membedakannya dari istilah hukum Taurat lainnya.
- source_word: וּשְׁמַרְתֶּם וַעֲשִׂיתֶם אֹתָם
  choice: berpegang teguh padanya, dan melaksanakannya
  rationale: 'Dua verba Ibrani dipertahankan: yang pertama menyatakan pemeliharaan atau ketaatan yang sungguh-sungguh, dan yang kedua pelaksanaan nyata.'
- source_word: וְשָׁמַר
  choice: akan memegang teguh
  rationale: 'Pilihan ini mempertahankan hubungan verbal dengan tindakan Israel pada klausa sebelumnya: Israel berpegang teguh pada ketetapan, dan Yahweh memegang teguh perjanjian.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk posesif tunggal dipertahankan secara ringkas dan alami dalam bahasa Indonesia.
- source_word: לְךָ
  choice: bagimu
  rationale: Preposisi ini menandai penerima manfaat dari kesetiaan Yahweh terhadap perjanjian.
- source_word: הַבְּרִית
  choice: perjanjian
  rationale: Istilah baku bagi בְּרִית dan sesuai dengan konteks hubungan perjanjian.
- source_word: הַחֶסֶד
  choice: kasih setia
  rationale: חֶסֶד memadukan kasih, loyalitas, dan keteguhan dalam hubungan perjanjian; “kasih setia” mempertahankan keluasan itu secara alami.
- source_word: אֲשֶׁר נִשְׁבַּע
  choice: yang telah diikrarkan-Nya
  rationale: Verba ini menyatakan sumpah. “Diikrarkan-Nya” menyampaikan komitmen bersumpah secara ringkas dan bermartabat.
- source_word: לַאֲבֹתֶיךָ
  choice: kepada para leluhurmu
  rationale: Dalam konteks ini kata tersebut menunjuk kepada para bapa pendahulu Israel. “Para leluhurmu” alami dalam bahasa Indonesia; bentuk harfiahnya dijelaskan dalam catatan.
theological_decisions:
- issue: Makna חֶסֶד dalam konteks perjanjian
  choice: kasih setia
  alternative: kesetiaan pada perjanjian; kasih yang teguh; kemurahan
  rationale: “Kasih setia” menjaga ketegangan antara kasih yang penuh kemurahan dan loyalitas yang teguh, tanpa mempersempit istilah itu hanya menjadi kewajiban hukum atau perasaan.
- issue: Rujukan gender dalam לַאֲבֹתֶיךָ
  choice: para leluhurmu, dengan catatan harfiah
  alternative: bapa-bapamu; para bapa leluhurmu
  rationale: “Para leluhurmu” merupakan ungkapan modern yang alami, sedangkan catatan mempertahankan informasi bahwa teks Ibrani secara harfiah menyebut “bapa-bapamu.”
- issue: Hubungan antara ketaatan umat dan pemeliharaan perjanjian oleh Yahweh
  choice: Apabila ... akan
  alternative: Karena ... akan; Sebagai akibat karena ... akan
  rationale: Bentuk ini mempertahankan hubungan konsekuensial yang dinyatakan עֵקֶב tanpa menyimpulkan bahwa ketaatan umat sudah pasti ataupun menjelaskan secara sistematis sifat teologis hubungan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “kamu” mengikuti sapaan tunggal Ibrani yang mewakili Israel sebagai satu umat. Pengulangan “berpegang teguh” disengaja untuk mencerminkan pengulangan verba שׁמר pada tindakan umat dan tindakan Yahweh.
