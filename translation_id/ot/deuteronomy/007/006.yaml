  text: כִּ֣י עַ֤ם קָדוֹשׁ֙ אַתָּ֔ה לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ בְּ/ךָ֞ בָּחַ֣ר יְהוָ֣ה אֱלֹהֶ֗י/ךָ לִ/הְי֥וֹת ל/וֹ֙ לְ/עַ֣ם סְגֻלָּ֔ה מִ/כֹּל֙ הָֽ/עַמִּ֔ים אֲשֶׁ֖ר עַל פְּנֵ֥י הָ/אֲדָמָֽה׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/006.yaml
  text: For you are a holy people to Yahweh your God. Yahweh your God has chosen you to be a treasured people for himself[a], from all the peoples who are on the face of the earth.
translation:
  language: id
  text: Sebab engkau adalah umat yang kudus bagi Yahweh, Allahmu. Yahweh, Allahmu, telah memilih engkau untuk menjadi umat kesayangan-Nya, dari antara segala bangsa di muka bumi[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “umat milik-Nya yang berharga.” Frasa Ibrani itu secara harfiah memadukan gagasan tentang umat dan milik yang dinilai secara istimewa.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memberi alasan bagi perintah sebelumnya; “sebab” mempertahankan hubungan penjelasannya secara alami dalam bahasa Indonesia.
- source_word: עַם קָדוֹשׁ
  choice: umat yang kudus
  rationale: Frasa ini menunjuk kepada suatu umat yang dikhususkan sebagai kudus; bentuk ini alami dan tetap mempertahankan bobot perjanjiannya.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: bagi Yahweh, Allahmu
  rationale: Preposisi ל menyatakan relasi atau kepunyaan. “Bagi” mempertahankan bentuk Ibrani sambil menyampaikan bahwa umat itu dikhususkan untuk Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan, bukan diganti dengan gelar.
- source_word: בְּךָ בָּחַר
  choice: telah memilih engkau
  rationale: בחר menyatakan tindakan memilih; “telah memilih” menunjukkan tindakan lampau yang hasilnya tetap berlaku.
- source_word: לִהְיוֹת לוֹ לְעַם סְגֻלָּה
  choice: untuk menjadi umat kesayangan-Nya
  rationale: Ungkapan ini memadukan tujuan, kepunyaan, dan nilai khusus. “Umat kesayangan-Nya” mempertahankan עַם sekaligus menyampaikan makna סְגֻלָּה sebagai milik yang sangat dihargai.
- source_word: מִכֹּל הָעַמִּים
  choice: dari antara segala bangsa
  rationale: מן dengan כל menyatakan pemilihan dari dalam suatu kelompok yang lebih luas, tanpa menambahkan gagasan keunggulan intrinsik.
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: di muka bumi
  rationale: Ungkapan idiomatis Ibrani ini merujuk pada seluruh dunia yang dihuni; bentuk Indonesia ini alami dan mempertahankan citra sumber.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama diri perjanjian יהוה. “Yahweh” mempertahankan nama itu secara langsung tanpa menggantinya dengan gelar.
- issue: Makna pemilihan dalam מִכֹּל הָעַמִּים
  choice: dari antara segala bangsa
  alternative: melebihi segala bangsa
  rationale: Bahasa Ibrani menyatakan pemilihan dari antara bangsa-bangsa dan tidak dengan sendirinya menyatakan keunggulan hakiki; terjemahan ini menjaga batas pernyataan sumber.
- issue: Hubungan kepunyaan dalam לִהְיוֹת לוֹ לְעַם סְגֻלָּה
  choice: menjadi umat kesayangan-Nya
  alternative: menjadi milik-Nya yang berharga
  rationale: Pilihan utama mempertahankan kata עַם, sedangkan catatan kaki mencatat nuansa kepunyaan berharga yang terkandung dalam סְגֻלָּה.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Kata ganti tunggal “engkau” dipertahankan karena sapaan Ibrani berbentuk tunggal dan mewakili Israel secara kolektif; “bangsa” dipakai untuk עַמִּים karena lebih alami dalam konteks bangsa-bangsa di bumi.
