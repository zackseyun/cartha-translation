  terminology: “Yahweh, Allahmu” mempertahankan nama ilahi dan konstruksi posesif sumber. “Tabuhan” mempertahankan pembacaan leksikal utama, sementara catatan kaki secara tepat menjaga kemungkinan pemahaman figuratif tanpa memaksakannya.
