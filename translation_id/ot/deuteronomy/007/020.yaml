  source_fidelity: 'Terjemahan dengan tepat mencerminkan unsur-unsur Ibrani: וְגַם sebagai “Selain itu,” הַצִּרְעָה sebagai “tabuhan,” tindakan aktif Yahweh “akan mengirimkan,” יעד בָּם sebagai “ke tengah-tengah mereka,” serta hasil akhirnya “sampai ... binasa.” Kedua kelompok, “orang-orang yang masih tersisa” dan “yang bersembunyi,” dipertahankan, demikian pula idiom מִפָּנֶיךָ melalui “dari hadapanmu.”'
