id: DEU.7.20
reference: Deuteronomy 7:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/גַם֙ אֶת הַ/צִּרְעָ֔ה יְשַׁלַּ֛ח יְהוָ֥ה אֱלֹהֶ֖י/ךָ בָּ֑/ם עַד אֲבֹ֗ד הַ/נִּשְׁאָרִ֛ים וְ/הַ/נִּסְתָּרִ֖ים מִ/פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/020.yaml
  text: Moreover[b][a], Yahweh your God will send the hornet among them until even those who remain and those who hide themselves from before you perish.
translation:
  language: id
  text: Selain itu[b], Yahweh, Allahmu, akan mengirimkan tabuhan[a] ke tengah-tengah mereka sampai orang-orang yang masih tersisa dan yang bersembunyi dari hadapanmu binasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “kengerian” atau “kepanikan”; sebagian orang memahami “tabuhan” secara kiasan sebagai rasa takut yang dikirim Allah, bukan sebagai serangga harfiah.
    reason: lexical_alternative
  - marker: b
    text: Atau “Dan juga”.
    reason: previous_rendering
lexical_decisions:
- source_word: וְגַם
  choice: Selain itu
  rationale: Menyampaikan daya tambah dan penegasan ungkapan Ibrani secara alami serta menghubungkan tindakan ini dengan janji penaklukan sebelumnya.
- source_word: הַצִּרְעָה
  choice: tabuhan
  rationale: Makna leksikal dasarnya adalah serangga penyengat; bentuk tunggal berartikel dapat dipahami secara kolektif. Kemungkinan makna kiasan dipertahankan dalam catatan kaki.
- source_word: יְשַׁלַּח
  choice: akan mengirimkan
  rationale: Menyatakan bahwa Yahweh secara aktif mengirimkan sarana ini terhadap musuh-musuh Israel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Mempertahankan konstruksi milik orang kedua tunggal dalam sapaan perjanjian.
- source_word: בָּם
  choice: ke tengah-tengah mereka
  rationale: Mempertahankan gambaran spasial tentang tabuhan yang dikirim masuk ke lingkungan para musuh.
- source_word: עַד אֲבֹד
  choice: sampai ... binasa
  rationale: Menandai batas akhir tindakan tanpa merinci secara berlebihan cara kebinasaan itu terjadi.
- source_word: הַנִּשְׁאָרִים
  choice: orang-orang yang masih tersisa
  rationale: Menggambarkan mereka yang tertinggal setelah tindakan penghukuman sebelumnya tanpa memakai istilah teologis teknis.
- source_word: וְהַנִּסְתָּרִים
  choice: dan yang bersembunyi
  rationale: Dalam konteks ini bentuk partisip tersebut menunjuk kepada musuh yang menyembunyikan diri dari Israel.
- source_word: מִפָּנֶיךָ
  choice: dari hadapanmu
  rationale: Mempertahankan idiom Ibrani tentang muka atau kehadiran sekaligus menyampaikan bahwa mereka menghindari gerak maju Israel.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton secara langsung; bentuk Yahweh mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Apakah הַצִּרְעָה dipahami secara harfiah atau kiasan
  choice: tabuhan dalam teks utama
  alternative: kengerian atau kepanikan yang dikirim Allah
  rationale: Makna leksikal langsungnya adalah serangga penyengat, tetapi kemungkinan pemahaman kiasan tetap dicatat agar ambiguitas penafsiran tidak ditutup.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang alami dan bermartabat. Kata “tabuhan” dipilih sebagai nama umum serangga penyengat, sedangkan “dari hadapanmu” mempertahankan warna idiom Ibrani tanpa menjadi sukar dipahami.
