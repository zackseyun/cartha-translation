  text: If you say in your heart[a], ‘These nations are more numerous than I; how can I dispossess them?’
translation:
  language: id
  text: Jika dalam hatimu engkau berkata, “Bangsa-bangsa ini lebih banyak daripada aku. Bagaimana aku dapat menghalau mereka?[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mencabut kepemilikan mereka.” Kata kerja Ibrani ini dapat berarti menyebabkan mereka kehilangan kepemilikan, khususnya dalam konteks tanah.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Jika
  rationale: Dalam konteks ini כִּי memperkenalkan keadaan bersyarat yang akan dijawab dengan peneguhan pada ayat berikutnya.
- source_word: תֹאמַר בִּלְבָבְךָ
  choice: dalam hatimu engkau berkata
  rationale: Mempertahankan verba 'berkata' dan gambaran Ibrani tentang perkataan batin, dengan susunan yang wajar dan bermartabat dalam bahasa Indonesia.
- source_word: רַבִּים הַגּוֹיִם הָאֵלֶּה מִמֶּנִּי
  choice: Bangsa-bangsa ini lebih banyak daripada aku
  rationale: רַבִּים bersama מִמֶּנִּי menyatakan perbandingan jumlah. Bentuk orang kedua tunggal dalam konteks perjanjian kolektif dipertahankan melalui 'aku' dalam kutipan batin.
- source_word: אֵיכָה אוּכַל
  choice: Bagaimana aku dapat
  rationale: Mengungkapkan pertanyaan mengenai kemampuan secara alami tanpa menambahkan kepastian atau keraguan yang tidak dinyatakan.
- source_word: לְהוֹרִישָׁם
  choice: menghalau mereka dari negeri itu
  rationale: Hifil ירש dalam konteks perebutan tanah berarti menyebabkan pihak lain kehilangan atau meninggalkan kepemilikannya. 'Menghalau ... dari negeri itu' jelas bagi pembaca umum dan mempertahankan konteks tanah; nuansa 'mencabut hak milik' dicatat dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Idiom sumber 'dalam hatimu berkata' dipertahankan karena jelas dalam konteks, sedangkan verba penaklukan diterjemahkan secara komunikatif dan nuansa kepemilikan tanah dijelaskan dalam catatan kaki.
