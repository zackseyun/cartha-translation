base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/014.yaml
  text: You will be blessed above all peoples[a]; there will not be among you a barren man or woman[b], or among your livestock.
translation:
  language: id
  text: Engkau akan diberkati lebih daripada segala bangsa[a]. Di antaramu tidak akan ada orang mandul, baik laki-laki maupun perempuan[b], ataupun di antara ternakmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “diberkati melebihi segala bangsa.” Kata depan Ibrani di sini menyatakan perbandingan.
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani secara eksplisit memakai bentuk maskulin dan feminin: “laki-laki maupun perempuan yang mandul.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ תִּהְיֶה
  choice: Engkau akan diberkati
  rationale: Partisipel pasif בָּרוּךְ bersama bentuk imperfek היה menyatakan keadaan berkat yang akan dialami Israel. Bentuk tunggal “Engkau” mempertahankan sapaan korporatif kepada Israel.
- source_word: מִכָּל הָעַמִּים
  choice: lebih daripada segala bangsa
  rationale: Preposisi מִן berfungsi komparatif. “Lebih daripada” menyatakan perbandingan secara alami dalam bahasa Indonesia, sedangkan עַמִּים dalam konteks ini merujuk pada bangsa-bangsa.
- source_word: לֹא יִהְיֶה בְךָ
  choice: Di antaramu tidak akan ada
  rationale: Konstruksi eksistensial היה dengan בְּ menunjukkan bahwa hal tersebut tidak akan terdapat di tengah komunitas Israel.
- source_word: עָקָר וַעֲקָרָה
  choice: laki-laki atau perempuan yang mandul
  rationale: Bentuk maskulin dan feminin dalam bahasa Ibrani dipertahankan secara eksplisit. “Mandul” adalah istilah Indonesia yang lazim dan tidak terlalu bernuansa medis.
- source_word: וּבִבְהֶמְתֶּךָ
  choice: demikian juga di antara ternakmu
  rationale: בְּהֵמָה merupakan istilah kolektif bagi hewan peliharaan atau ternak. “Demikian juga” secara wajar meneruskan gagasan bahwa tidak akan ada kemandulan di antara ternak.
theological_decisions:
- issue: Istilah kemandulan bergender dalam konteks berkat perjanjian
  choice: Menyebut “laki-laki atau perempuan yang mandul” secara eksplisit
  alternative: Meratakan ungkapan menjadi “seorang pun yang mandul”
  rationale: Teks Ibrani sengaja memasangkan bentuk maskulin עָקָר dan feminin עֲקָרָה; pembedaan itu dipertahankan tanpa menambahkan penafsiran doktrinal.
- issue: Sapaan tunggal korporatif kepada Israel
  choice: Memakai “Engkau” dan “-mu” dalam bentuk tunggal
  alternative: Memakai bentuk jamak atau memperluasnya menjadi “kalian, umat Israel”
  rationale: Bahasa Ibrani menyapa Israel sebagai satu umat perjanjian dalam bentuk tunggal. Terjemahan mempertahankan bentuk sumber tanpa menyisipkan penjelasan ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Engkau” dipakai untuk mempertahankan sapaan tunggal korporatif; “segala bangsa” sesuai dengan ragam Alkitab yang tetap mudah dipahami. Semua penanda catatan kaki muncul dalam teks utama.
