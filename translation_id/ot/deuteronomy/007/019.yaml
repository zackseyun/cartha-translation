  text: הַ/מַּסֹּ֨ת הַ/גְּדֹלֹ֜ת אֲשֶׁר רָא֣וּ עֵינֶ֗י/ךָ וְ/הָ/אֹתֹ֤ת וְ/הַ/מֹּֽפְתִים֙ וְ/הַ/יָּ֤ד הַ/חֲזָקָה֙ וְ/הַ/זְּרֹ֣עַ הַ/נְּטוּיָ֔ה אֲשֶׁ֥ר הוֹצִֽאֲ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ כֵּֽן יַעֲשֶׂ֞ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לְ/כָל הָ֣/עַמִּ֔ים אֲשֶׁר אַתָּ֥ה יָרֵ֖א מִ/פְּנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/019.yaml
  text: the great trials that your eyes saw[a], and the signs, and the wonders, and the mighty hand[b], and the outstretched arm by which Yahweh your God brought you out—so Yahweh your God will do to all the peoples of whom you are afraid.
translation:
  language: id
  text: ujian-ujian besar yang kamu lihat dengan matamu sendiri[a], tanda-tanda, mukjizat-mukjizat, tangan yang kuat, dan lengan yang terentang, yang dengannya Yahweh, Allahmu, membawa kamu keluar. Demikianlah Yahweh, Allahmu, akan bertindak terhadap semua bangsa yang kamu takuti.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pencobaan-pencobaan besar.” Kata Ibrani yang digunakan dapat berarti ujian atau pencobaan berat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּסֹּת הַגְּדֹלֹת
  choice: ujian-ujian besar
  rationale: מַסּוֹת dapat menunjuk pada ujian atau pencobaan berat; dalam konteks tindakan Allah di Mesir, “ujian-ujian besar” mempertahankan makna luasnya tanpa menyiratkan godaan untuk berbuat dosa.
- source_word: רָאוּ עֵינֶיךָ
  choice: yang kamu lihat dengan matamu sendiri
  rationale: Ungkapan Ibrani secara eksplisit menyebut mata untuk menekankan pengalaman langsung; bentuk Indonesia ini alami dan mempertahankan penekanannya.
- source_word: הָאֹתֹת
  choice: tanda-tanda
  rationale: אוֹת lazim berarti tanda, khususnya tindakan ilahi yang memiliki makna dan membuktikan kuasa Allah.
- source_word: הַמֹּפְתִים
  choice: mukjizat-mukjizat
  rationale: מוֹפְתִים menunjuk pada perbuatan luar biasa yang menimbulkan kekaguman; “mukjizat-mukjizat” merupakan padanan Indonesia yang jelas dalam pasangan “tanda-tanda dan mukjizat-mukjizat.”
- source_word: הַיָּד הַחֲזָקָה
  choice: tangan yang kuat
  rationale: Terjemahan ini mempertahankan metafora Ibrani tentang kuasa ilahi sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: הַזְּרֹעַ הַנְּטוּיָה
  choice: lengan yang teracung
  rationale: Ungkapan ini menggambarkan kuasa Allah yang aktif dalam pembebasan dan penghakiman; “teracung” mempertahankan citra lengan yang dibentangkan untuk bertindak.
- source_word: אֲשֶׁר הוֹצִאֲךָ
  choice: yang dengannya ... membawa kamu keluar
  rationale: Klausa relatif mengaitkan sarana kuasa yang baru disebut dengan tindakan membawa Israel keluar dari Mesir.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap tampak dan tidak diganti dengan gelar.
- source_word: כֵּן יַעֲשֶׂה
  choice: Demikianlah akan dilakukan
  rationale: 'כֵּן menyatakan perbandingan: sebagaimana Allah bertindak di Mesir, demikian pula Ia akan bertindak terhadap bangsa-bangsa yang ditakuti Israel.'
- source_word: לְכָל הָעַמִּים
  choice: terhadap semua bangsa
  rationale: ל menandai pihak yang menjadi sasaran tindakan, sedangkan עַמִּים dapat diterjemahkan “bangsa-bangsa”; “terhadap” memperjelas arah tindakan tanpa menambah rincian.
- source_word: אֲשֶׁר אַתָּה יָרֵא מִפְּנֵיהֶם
  choice: yang kamu takuti
  rationale: Ungkapan harfiah “yang kamu takut dari hadapan mereka” merupakan idiom Ibrani; “yang kamu takuti” menyampaikan artinya secara alami dan tepat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memuat nama perjanjian יהוה, bukan sekadar gelar. “Yahweh” mempertahankan nama itu secara transparan tanpa memasukkan penafsiran denominasi tertentu.
- issue: Hubungan tindakan masa lampau dan masa depan
  choice: Mempertahankan perbandingan eksplisit dengan “Demikianlah”
  alternative: Mengungkapkannya sebagai janji umum bahwa Allah akan menolong
  rationale: כֵּן secara khusus menyamakan tindakan Allah yang akan datang dengan tindakan-Nya di Mesir; terjemahan tidak menggeneralisasi atau memperlunak hubungan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan tunggal Ibrani dipertahankan dengan “kamu”. Deretan nomina dipertahankan untuk menjaga irama retoris teks, sementara tanda baca disesuaikan agar kalimat mudah dipahami.
