  naturalness: Bahasa draf umumnya baku dan jelas. “Demikianlah akan dilakukan Yahweh” terdengar janggal dalam bahasa Indonesia modern; susunan aktif “Demikianlah Yahweh, Allahmu, akan bertindak ...” lebih alami dan mempertahankan subjek ilahi.
  terminology: “Tanda-tanda dan mukjizat-mukjizat,” “tangan yang kuat,” dan “Yahweh, Allahmu” sesuai register dan istilah yang lazim. “Lengan yang terentang” merupakan padanan yang lebih tepat bagi metafora Ibrani.
