    rationale: Teracung terutama menggambarkan lengan yang diangkat, sedangkan bentuk Ibrani נְטוּיָה dalam ungkapan tetap ini berarti dibentangkan atau diulurkan.
  - severity: medium
    issue: “Demikianlah akan dilakukan Yahweh”
    rationale: Verba Ibrani aktif dengan Yahweh sebagai subjek. Bentuk pasif Indonesia kurang alami dan mengaburkan hubungan langsung antara subjek dan tindakan, walaupun makna dasarnya masih dapat dipahami.
