    reason: lexical_alternative
lexical_decisions:
- source_word: תַעֲרֹץ
  choice: gentar
  rationale: Verba Qal ערץ menyatakan rasa gentar atau takut yang kuat. 'Gentar' alami dalam larangan bahasa Indonesia dan mempertahankan intensitasnya.
- source_word: מִפְּנֵיהֶם
  choice: terhadap mereka
  rationale: Secara harfiah berarti 'dari hadapan mereka', tetapi dalam konteks ini merupakan ungkapan tentang ketakutan ketika menghadapi lawan. 'Terhadap mereka' menyampaikan relasi itu secara alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Sebutan perjanjian beserta akhiran posesif orang kedua tunggal dipertahankan secara eksplisit.
- source_word: בְּקִרְבְּךָ
  choice: di tengah-tengahmu
  rationale: Frasa ini menunjukkan kehadiran Allah di tengah umat sebagai komunitas, bukan pengalaman batin individual.
- source_word: אֵל גָּדוֹל
  choice: Allah yang besar
  rationale: אֵל berfungsi sebagai sebutan ilahi dalam aposisi, sedangkan גָּדוֹל diterjemahkan langsung sebagai 'besar'.
- source_word: וְנוֹרָא
  choice: dan membangkitkan rasa takut
  rationale: Bentuk dari ירא menggambarkan Allah sebagai Pribadi yang menimbulkan rasa takut dan hormat. Ungkapan ini mempertahankan bobot makna tanpa membatasinya hanya pada teror.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian secara langsung; transliterasi mempertahankannya sebagai nama diri.
- issue: Nuansa וְנוֹרָא dalam penggambaran Allah
  choice: membangkitkan rasa takut
  alternative: dahsyat
  rationale: Pilihan utama mempertahankan kaitan leksikal dengan rasa takut sekaligus membiarkan cakupannya mencakup takut dan hormat, tanpa mereduksinya menjadi sekadar kekaguman.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk tunggal pada 'Allahmu' dan 'tengah-tengahmu' mengikuti sapaan Ibrani kepada Israel sebagai satu umat. Susunan aposisional ayat dipertahankan secara alami.
