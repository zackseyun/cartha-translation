  text: Do not dread them[a], for Yahweh your God is in your midst[c][b], a great and fearsome God.
translation:
  language: id
  text: Jangan gentar terhadap mereka,[a] sebab Yahweh, Allahmu, ada di tengah-tengahmu,[b] Allah yang besar dan dahsyat.[c]
  philosophy: optimal-equivalence
