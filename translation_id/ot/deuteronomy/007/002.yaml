  text: וּ/נְתָנָ֞/ם יְהוָ֧ה אֱלֹהֶ֛י/ךָ לְ/פָנֶ֖י/ךָ וְ/הִכִּיתָ֑/ם הַחֲרֵ֤ם תַּחֲרִים֙ אֹתָ֔/ם לֹא תִכְרֹ֥ת לָ/הֶ֛ם בְּרִ֖ית וְ/לֹ֥א תְחָנֵּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/002.yaml
  text: And when Yahweh your God gives them over to you before you[a], and you strike them down, you shall utterly devote them to destruction[b]. You shall make no covenant with them and show them no favor.
translation:
  language: id
  text: Apabila Yahweh, Allahmu, menyerahkan mereka kepadamu dan engkau mengalahkan mereka, engkau harus mengkhususkan mereka sepenuhnya untuk dimusnahkan[a]. Jangan mengadakan perjanjian dengan mereka dan jangan menunjukkan kemurahan kepada mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “engkau harus membinasakan mereka sama sekali,” atau, “engkau harus menempatkan mereka di bawah larangan.” Bahasa Ibrani memakai bentuk penegasan dari kata חרם, yang menyatakan pengkhususan total untuk dimusnahkan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “jangan menaruh belas kasihan kepada mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָם
  choice: menyerahkan mereka kepadamu
  rationale: Dalam konteks peperangan, נתן dengan objek dapat berarti menyerahkan pihak lawan ke dalam kuasa seseorang. Ungkapan ini mempertahankan tindakan ilahi tanpa menambahkan kata 'tangan' yang tidak terdapat dalam teks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: לְפָנֶיךָ
  choice: kepadamu
  rationale: Secara harfiah berarti 'di hadapanmu', tetapi bersama נתן dalam konteks militer, 'menyerahkan ... kepadamu' menyampaikan idiom Ibrani secara wajar dalam bahasa Indonesia.
- source_word: וְהִכִּיתָם
  choice: engkau mengalahkan mereka
  rationale: נכה dalam konteks peperangan berarti memukul atau mengalahkan. 'Mengalahkan' jelas dan alami, tanpa memakai ungkapan arkais.
- source_word: הַחֲרֵם תַּחֲרִים אֹתָם
  choice: engkau harus mengkhususkan mereka sepenuhnya untuk dimusnahkan
  rationale: Infinitif absolut yang diikuti verba seakar memberi penegasan kuat. Rumusan ini mempertahankan unsur pengkhususan total dalam חרם sekaligus hasilnya, yaitu pemusnahan, dan tidak meratakannya menjadi pembunuhan biasa.
- source_word: לֹא תִכְרֹת לָהֶם בְּרִית
  choice: Jangan mengadakan perjanjian dengan mereka
  rationale: כרת ברית adalah idiom baku untuk mengadakan perjanjian. 'Perjanjian' mempertahankan cakupan istilah lebih baik daripada 'perjanjian damai' atau 'traktat'.
- source_word: וְלֹא תְחָנֵּם
  choice: jangan menunjukkan kemurahan kepada mereka
  rationale: חנן berhubungan dengan pemberian kemurahan atau perkenanan. 'Kemurahan' mempertahankan makna leksikal itu, sedangkan kemungkinan kontekstual 'belas kasihan' dicatat dalam catatan kaki.
theological_decisions:
- issue: Makna חרם dalam konteks perang suci
  choice: mengkhususkan mereka sepenuhnya untuk dimusnahkan
  alternative: membinasakan mereka sama sekali; menempatkan mereka di bawah hukum pemusnahan
  rationale: Pilihan utama mempertahankan baik dimensi pengkhususan total maupun pemusnahan yang terkandung dalam חרם, tanpa mengurangi ungkapan itu menjadi kemenangan militer biasa.
- issue: Makna תְחָנֵּם
  choice: jangan menunjukkan kemurahan kepada mereka
  alternative: jangan menaruh belas kasihan kepada mereka
  rationale: Kata Ibrani terutama menunjuk pada pemberian kemurahan atau perkenanan, tetapi dalam konteks ini dapat pula dipahami sebagai belas kasihan; alternatif tersebut dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan langsung. Pronomina 'engkau' dipakai sesuai sapaan tunggal kepada Israel. Struktur kalimat dibuat alami tanpa menghilangkan tindakan Yahweh, kekerasan konteks militer, atau ketegangan teologis istilah חרם.
