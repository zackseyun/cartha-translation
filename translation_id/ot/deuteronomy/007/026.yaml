  text: וְ/לֹא תָבִ֤יא תֽוֹעֵבָה֙ אֶל בֵּיתֶ֔/ךָ וְ/הָיִ֥יתָ חֵ֖רֶם כָּמֹ֑/הוּ שַׁקֵּ֧ץ תְּשַׁקְּצֶ֛/נּוּ וְ/תַעֵ֥ב תְּֽתַעֲבֶ֖/נּוּ כִּי חֵ֥רֶם הֽוּא־־׀׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/007/026.yaml
  text: And you shall not bring an abomination into your house[a], or you will become devoted to destruction like it. You shall utterly detest it and utterly abhor it, for it is devoted to destruction.
translation:
  language: id
  text: Jangan membawa sesuatu yang keji ke dalam rumahmu, atau kamu akan menjadi sesuatu yang dikhususkan untuk dimusnahkan seperti benda itu. Kamu harus benar-benar menganggapnya menjijikkan dan benar-benar membencinya, sebab benda itu dikhususkan untuk dimusnahkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “berada di bawah larangan”; secara tradisional: “terkutuk.” Istilah Ibrani ini mengacu pada sesuatu yang dikhususkan untuk dimusnahkan di bawah penghakiman Allah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָבִיא
  choice: membawa ... ke dalam
  rationale: Bentuk Hifil dari בוא menyatakan menyebabkan sesuatu masuk; frasa ini alami dalam bahasa Indonesia dan mempertahankan arah geraknya.
- source_word: תּוֹעֵבָה
  choice: sesuatu yang menjijikkan
  rationale: Dalam konteks ini kata tersebut menunjuk kepada benda berhala yang dipandang sangat keji secara religius. Pilihan ini kuat tetapi lebih mudah dipahami pembaca modern daripada istilah abstrak 'kekejian'.
- source_word: בֵּיתֶךָ
  choice: rumahmu
  rationale: Terjemahan konkret ini sesuai dengan makna dasar dan konteks benda terlarang yang dibawa ke tempat tinggal.
- source_word: וְהָיִיתָ חֵרֶם כָּמֹהוּ
  choice: supaya kamu tidak menjadi sesuatu yang dikhususkan untuk dimusnahkan seperti benda itu
  rationale: Waw dipahami sebagai akibat yang diperingatkan setelah larangan. Ungkapan untuk חֵרֶם mempertahankan gagasan penetapan bagi pemusnahan di bawah penghakiman ilahi.
- source_word: שַׁקֵּץ תְּשַׁקְּצֶנּוּ
  choice: Kamu harus benar-benar merasa jijik ... terhadapnya
  rationale: Infinitif absolut yang diikuti verba finit memberi penegasan; 'benar-benar' menyampaikan penekanan itu tanpa menambah derajat yang tidak perlu.
- source_word: וְתַעֵב תְּתַעֲבֶנּוּ
  choice: dan muak terhadapnya
  rationale: Verba kedua dipertahankan sebagai pasangan semantis yang berbeda namun bertumpang tindih dengan 'merasa jijik'; penegasan 'benar-benar' berlaku secara alami bagi keduanya.
- source_word: כִּי חֵרֶם הוּא
  choice: sebab benda itu telah dikhususkan untuk dimusnahkan
  rationale: Klausa ini menyatakan alasan larangan dan mengulang padanan חֵרֶם secara konsisten.
theological_decisions:
- issue: Makna חֵרֶם dalam konteks penghakiman perjanjian
  choice: dikhususkan untuk dimusnahkan
  alternative: terkutuk; berada di bawah larangan pemusnahan
  rationale: Pilihan ini mempertahankan gagasan bahwa benda itu ditetapkan bagi pemusnahan di bawah penghakiman Allah, bukan sekadar terkena kutuk atau dianggap tabu.
- issue: Hubungan akibat dalam וְהָיִיתָ
  choice: supaya kamu tidak menjadi
  alternative: dan kamu akan menjadi; agar jangan kamu menjadi
  rationale: Dalam rangkaian setelah larangan, waw menyampaikan akibat yang harus dihindari. Bentuk Indonesia ini mempertahankan daya peringatannya tanpa memastikan secara berlebihan bagaimana akibat itu terjadi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Sesuatu yang menjijikkan' dipilih agar konkret dan mudah dipahami dalam konteks benda berhala; 'dikhususkan untuk dimusnahkan' sengaja diulang untuk menjaga kaitan leksikal חֵרֶם. Penanda catatan kaki ditempatkan setelah klausa terakhir yang menjelaskan istilah tersebut.
