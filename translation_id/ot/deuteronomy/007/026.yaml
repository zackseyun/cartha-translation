revisions:
- from: Janganlah membawa sesuatu yang menjijikkan ke dalam rumahmu, supaya kamu tidak menjadi sesuatu yang dikhususkan untuk dimusnahkan seperti benda itu. Kamu harus benar-benar merasa jijik dan muak terhadapnya, sebab benda itu telah dikhususkan untuk dimusnahkan.[a]
  to: Jangan membawa sesuatu yang keji ke dalam rumahmu, atau kamu akan menjadi sesuatu yang dikhususkan untuk dimusnahkan seperti benda itu. Kamu harus benar-benar menganggapnya menjijikkan dan benar-benar membencinya, sebab benda itu dikhususkan untuk dimusnahkan.[a]
  rationale: Revisi mempertahankan larangan, konsekuensi, pengulangan istilah חֵרֶם, serta penegasan pada kedua pasangan verba Ibrani. Kata "telah" dihapus agar tidak menambahkan aspek waktu yang tidak ada dalam teks sumber. Istilah "sesuatu yang keji" menyampaikan kekuatan teologis dan moral תּוֹעֵבָה dalam bahasa Indonesia modern tanpa menafsirkan objek secara lebih khusus daripada teks ayat ini.
