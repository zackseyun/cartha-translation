  source_fidelity: 'Revisi diperlukan untuk menghindari penambahan aspek pada kata חֵרֶם dalam klausa terakhir: "telah dikhususkan" menyiratkan tindakan yang telah selesai, sedangkan teks Ibrani hanya menyatakan statusnya. Hubungan peringatan dalam וְהָיִיתָ dapat disampaikan secara langsung dengan "atau kamu akan menjadi."'
  naturalness: Teks draf umumnya baku dan jelas. Namun, "supaya kamu tidak menjadi" lebih mudah terdengar sebagai tujuan daripada akibat peringatan. Selain itu, dua konstruksi penegasan Ibrani sebaiknya tampak pada kedua verba, bukan hanya secara implisit pada rangkaian "merasa jijik dan muak."
  terminology: '"Sesuatu yang keji" lebih sesuai dengan bobot religius-moral תּוֹעֵבָה daripada "sesuatu yang menjijikkan," yang dapat terdengar semata-mata sebagai reaksi selera. "Dikhususkan untuk dimusnahkan" dipertahankan secara konsisten untuk חֵרֶם. Catatan kaki diperhalus: "di bawah larangan" adalah alternatif tradisional yang lebih idiomatis daripada "di bawah larangan pemusnahan."'
