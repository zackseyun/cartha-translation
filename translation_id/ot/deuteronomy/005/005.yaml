base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/005.yaml
  text: I was standing between Yahweh and you at that time[a], to declare to you the word of Yahweh, because you were afraid because of the fire and did not go up the mountain, saying,
translation:
  language: id
  text: 'Pada waktu itu aku berdiri di antara Yahweh dan kalian untuk menyampaikan firman Yahweh kepada kalian, sebab kalian takut terhadap api itu dan tidak naik ke gunung, dengan berkata:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָנֹכִי עֹמֵד
  choice: aku berdiri
  rationale: Pronomina mandiri menonjolkan peran Musa, sedangkan partisip Qal dalam konteks lampau menggambarkan kedudukannya sebagai perantara pada saat itu. Bahasa Indonesia tidak memerlukan bentuk progresif tersendiri.
- source_word: בֵּין יְהוָה וּבֵינֵיכֶם
  choice: di antara Yahweh dan kalian
  rationale: Mempertahankan konstruksi yang menyatakan posisi Musa sebagai perantara antara dua pihak; nama ilahi diterjemahkan Yahweh.
- source_word: בָּעֵת הַהִוא
  choice: Pada waktu itu
  rationale: Ungkapan waktu yang alami dan secara tepat menunjuk pada peristiwa di Horeb.
- source_word: לְהַגִּיד לָכֶם אֶת דְּבַר יְהוָה
  choice: untuk menyampaikan firman Yahweh kepada kalian
  rationale: Bentuk Hifil dari נגד menyatakan tindakan memberitahukan atau menyampaikan; 'firman Yahweh' mempertahankan corak khidmat dari ungkapan Ibrani.
- source_word: כִּי יְרֵאתֶם מִפְּנֵי הָאֵשׁ
  choice: sebab kalian takut terhadap api itu
  rationale: כִּי bersifat kausal, sedangkan מִפְּנֵי dalam konteks ini menyatakan objek atau penyebab ketakutan. 'Takut terhadap api itu' alami dan tidak memerlukan pengulangan 'karena'.
- source_word: וְלֹא עֲלִיתֶם בָּהָר
  choice: dan tidak naik ke gunung
  rationale: Menerjemahkan gerak naik menuju gunung secara langsung dan wajar dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: Ia berfirman,
  rationale: Secara harfiah bentuk ini berarti 'dengan berkata' dan memperkenalkan tuturan langsung pada ayat berikutnya. Dalam sintaksis Indonesia, 'Ia berfirman' memperjelas bahwa yang diperkenalkan ialah firman Yahweh tanpa membebani kalimat dengan bentuk 'dengan berkata' yang janggal.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian dan mengikuti kebijakan proyek tanpa memasukkan tafsiran denominasi.
- issue: Subjek tersirat pada לֵאמֹר
  choice: Ia berfirman,
  alternative: dengan berkata,
  rationale: Bentuk Ibrani secara gramatikal tidak menyebut subjek baru, tetapi dalam konteksnya memperkenalkan perkataan Yahweh pada ayat berikutnya. Kapitalisasi 'Ia' dan verba 'berfirman' membuat hubungan itu alami dalam bahasa Indonesia; alternatif yang lebih formal mempertahankan ambiguitas sintaksis tetapi terdengar kurang wajar.
translation_notes:
  register: Bahasa Indonesia baku modern, khidmat, dan mudah dipahami. 'Aku' dan 'kalian' mempertahankan pembedaan orang pertama tunggal dan orang kedua jamak. Kalimat terakhir disusun agar dapat langsung bersambung dengan perkataan ilahi dalam ayat 6.
