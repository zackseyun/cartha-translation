source:
  edition: WLC
  text: אָֽנֹכִי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֲשֶׁ֧ר הוֹצֵאתִ֛י/ךָ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/006.yaml
  text: I am Yahweh your God[a], who brought you from the land of Egypt, from the house of servants.
translation:
  language: id
  text: Akulah Yahweh, Allahmu, yang membawa engkau keluar dari tanah Mesir, dari rumah perbudakan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “rumah para budak”; yakni tempat atau keadaan perbudakan.
    reason: Menjelaskan bentuk konkret jamak pada ungkapan Ibrani sambil mempertahankan terjemahan utama yang idiomatis dan jelas dalam bahasa Indonesia.
lexical_decisions:
- source_word: אָנֹכִי
  choice: Akulah
  rationale: Pronomina orang pertama yang berdiri sendiri dan tanpa kopula ini menyatakan identitas dengan penegasan. “Akulah” alami dalam bahasa Indonesia dan mempertahankan tekanan khidmat pada awal Dekalog.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks Ibrani tetap tampak.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Dalam konteks ini אֱלֹהִים menunjuk kepada Allah Israel, sedangkan akhiran orang kedua maskulin tunggal diterjemahkan dengan “-mu”.
- source_word: אֲשֶׁר
  choice: yang
  rationale: Kata penghubung relatif bahasa Indonesia “yang” secara alami memperkenalkan klausa yang menerangkan Yahweh.
- source_word: הוֹצֵאתִיךָ
  choice: membawa engkau keluar
  rationale: Bentuk Hifil dari יצא berarti menyebabkan seseorang keluar. Ungkapan ini mempertahankan makna kausatif sekaligus terdengar jelas dan wajar.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: dari tanah Mesir
  rationale: Preposisi מִן menyatakan asal, sementara אֶרֶץ dalam rumusan ini tepat diterjemahkan “tanah”; makna keluar sudah dinyatakan oleh verba sebelumnya.
- source_word: מִבֵּית עֲבָדִים
  choice: dari rumah para budak
  rationale: Terjemahan ini mempertahankan gambaran konkret bahasa Ibrani, secara harfiah “dari rumah budak-budak,” termasuk bentuk jamak עֲבָדִים. Kata “para” memperjelas bahwa yang dimaksud ialah orang-orang berstatus budak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama yang hadir dalam teks, sedangkan “TUHAN” menggantinya dengan gelar.
- issue: Penerjemahan עֲבָדִים dalam rumusan keluaran
  choice: para budak
  alternative: perbudakan
  rationale: Bentuk Ibrani adalah nomina jamak konkret, “budak-budak.” Terjemahan utama mempertahankan bentuk serta realitas sosial tersebut; catatan kaki mencantumkan padanan abstrak yang lebih idiomatis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Akulah” memberi penegasan yang sesuai dengan אָנֹכִי; “engkau” dipilih untuk sapaan tunggal yang luhur. Penanda catatan kaki ditempatkan langsung sesudah frasa yang dijelaskannya.
