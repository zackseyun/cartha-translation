source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֣ם לַ/עֲשׂ֔וֹת כַּ/אֲשֶׁ֥ר צִוָּ֛ה יְהוָ֥ה אֱלֹהֵי/כֶ֖ם אֶתְ/כֶ֑ם לֹ֥א תָסֻ֖רוּ יָמִ֥ין וּ/שְׂמֹֽאל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/032.yaml
  text: So be careful to do just as Yahweh your God has commanded you[a]; do not turn aside to the right or to the left.
translation:
  language: id
  text: Maka, berhati-hatilah untuk melakukan tepat seperti yang telah diperintahkan Yahweh, Allah kalian, kepada kalian; janganlah menyimpang ke kanan atau ke kiri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “jangan menyimpang ke kanan atau ke kiri” berarti tidak menyimpang ke arah mana pun dari apa yang Yahweh perintahkan.
    reason: cultural_note
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם לַעֲשׂוֹת
  choice: lakukanlah dengan saksama
  rationale: Gabungan שׁמר dengan infinitif עשה menekankan perhatian sungguh-sungguh yang diwujudkan dalam ketaatan. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan unsur pelaksanaan.
- source_word: כַּאֲשֶׁר
  choice: tepat seperti
  rationale: Menandai kesesuaian penuh dengan perintah ilahi, bukan sekadar kemiripan umum.
- source_word: צִוָּה
  choice: yang diperintahkan
  rationale: Bentuk perfektif Ibrani menunjuk pada perintah yang telah diberikan dan tetap mengikat; konstruksi pasif relatif ini terdengar alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Sufiks Ibrani berbentuk jamak karena umat disapa secara kolektif. Dalam bahasa Indonesia, bentuk tunggal “-mu” lazim dipakai untuk sapaan kolektif dan menjaga relasi perjanjian “Allah kalian” tanpa ungkapan yang kaku.
- source_word: לֹא תָסֻרוּ
  choice: jangan menyimpang
  rationale: 'סור di sini bersifat metaforis: meninggalkan jalan ketaatan. “Menyimpang” menyampaikan makna itu secara jelas sambil mempertahankan citra arah.'
- source_word: יָמִין וּשְׂמֹאל
  choice: ke kanan ataupun ke kiri
  rationale: Mempertahankan ungkapan arah Ibrani yang menyatakan larangan menyimpang ke arah mana pun.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi Allah. “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Sapaan jamak kepada Israel
  choice: Allahmu, kepadamu
  alternative: Allah kalian, kepada kalian
  rationale: Bahasa Indonesia baku dapat memakai “-mu” untuk menyapa umat sebagai satu kesatuan. Pilihan ini tidak mengubah fakta bahwa bentuk Ibraninya jamak dan menghasilkan gaya yang lebih luwes serta khidmat.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Bentuk imperatif “lakukanlah” mempertahankan nada nasihat yang tegas; “karena itu” menghubungkan ayat ini dengan perintah sebelumnya. Penanda catatan kaki ditempatkan sesudah ungkapan yang dijelaskannya.
