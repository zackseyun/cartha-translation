  source_fidelity: Makna pokok terjaga, termasuk nama Yahweh, lokasi, unsur-unsur teofani, suara keras, dan catatan atas וְלֹא יָסָף. Namun, konstruksi pembuka yang pasif ('Perkataan-perkataan ini disampaikan Yahweh') kurang langsung mencerminkan subjek aktif Ibrani, dan rujukan objek pada 'menuliskannya' kurang jelas.
  naturalness: 'Beberapa ungkapan dapat dibuat lebih alami dalam bahasa Indonesia baku modern: ''Yahweh menyampaikan perkataan-perkataan ini'' lebih jelas daripada inversi pasif, dan ''kegelapan yang pekat'' lebih idiomatis daripada ''kelam pekat''.'
  terminology: '''Yahweh'', ''jemaat'', dan ''loh batu'' dapat dipertahankan. ''Perkataan-perkataan'' secara leksikal sah, meskipun pengulangan eksplisit pada klausa penulisan diperlukan untuk menjernihkan anteseden objek jamak.'
