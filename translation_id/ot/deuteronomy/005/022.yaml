  to: Yahweh menyampaikan perkataan-perkataan ini kepada seluruh jemaatmu di gunung, dari tengah-tengah api, awan, dan kegelapan yang pekat, dengan suara lantang; Dia tidak menambahkan lagi.[a] Lalu Dia menuliskan perkataan-perkataan itu pada dua loh batu dan memberikannya kepadaku.
