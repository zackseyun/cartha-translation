    rationale: דִּבֶּר menampilkan Yahweh sebagai subjek yang berbicara. Susunan aktif 'Yahweh menyampaikan ...' lebih alami dan mempertahankan struktur semantis sumber.
  - severity: low
    issue: '''Kelam pekat'' kurang idiomatis sebagai padanan עֲרָפֶל.'
    rationale: '''Kegelapan yang pekat'' menyampaikan kegelapan padat/tebal secara lebih lazim dalam bahasa Indonesia modern.'
  - severity: low
