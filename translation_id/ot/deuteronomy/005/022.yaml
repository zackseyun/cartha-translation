id: DEU.5.22
reference: Deuteronomy 5:22
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֶֽת הַ/דְּבָרִ֣ים הָ/אֵ֡לֶּה דִּבֶּר֩ יְהוָ֨ה אֶל כָּל קְהַלְ/כֶ֜ם בָּ/הָ֗ר מִ/תּ֤וֹךְ הָ/אֵשׁ֙ הֶֽ/עָנָ֣ן וְ/הָֽ/עֲרָפֶ֔ל ק֥וֹל גָּד֖וֹל וְ/לֹ֣א יָסָ֑ף וַֽ/יִּכְתְּבֵ֗/ם עַל שְׁנֵי֙ לֻחֹ֣ת אֲבָנִ֔ים וַֽ/יִּתְּנֵ֖/ם אֵלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/022.yaml
  text: These words Yahweh spoke to all your assembly on the mountain[a], out of the midst of the fire, the cloud, and the thick darkness, with a loud voice, and he added no more. And he wrote them on two tablets of stone and gave them to me.
translation:
  language: id
  text: Yahweh menyampaikan perkataan-perkataan ini kepada seluruh jemaatmu di gunung, dari tengah-tengah api, awan, dan kegelapan yang pekat, dengan suara lantang; Dia tidak menambahkan lagi.[a] Lalu Dia menuliskan perkataan-perkataan itu pada dua loh batu dan memberikannya kepadaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dia tidak melanjutkan berbicara.” Frasa Ibrani ini dapat dipahami sebagai “Dia tidak menambahkan lagi” atau “Dia tidak melanjutkan berbicara.”
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani tetap tampak dan tidak diganti dengan gelar.
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: Perkataan-perkataan ini
  rationale: דְּבָרִים secara dasar berarti “perkataan-perkataan” atau “hal-hal”; konteksnya menunjuk pada ucapan perjanjian yang baru disampaikan, sehingga unsur verbal dan bentuk jamaknya dipertahankan tanpa mempersempitnya menjadi “perintah-perintah”.
- source_word: דִּבֶּר
  choice: disampaikan
  rationale: Bentuk ini mengungkapkan tindakan berbicara kepada sidang dengan wajar dalam bahasa Indonesia dan menghindari pengulangan canggung dengan “perkataan-perkataan”.
- source_word: כָּל קְהַלְכֶם
  choice: seluruh jemaatmu
  rationale: קָהָל menunjuk pada komunitas yang berhimpun; “seluruh jemaatmu” jelas, ringkas, dan mempertahankan makna korporatnya.
- source_word: בָּהָר
  choice: di gunung
  rationale: Preposisi ב dalam konteks lokasi peristiwa ini secara idiomatis diterjemahkan “di gunung” dalam bahasa Indonesia.
- source_word: מִתּוֹךְ הָאֵשׁ הֶעָנָן וְהָעֲרָפֶל
  choice: dari tengah-tengah api, awan, dan kelam pekat
  rationale: “Dari tengah-tengah” mempertahankan daya gambarnya, sedangkan עֲרָפֶל diterjemahkan “kelam pekat” untuk menyatakan kegelapan yang tebal dan mencekam.
- source_word: קוֹל גָּדוֹל
  choice: dengan suara lantang
  rationale: Secara harfiah berarti “suara yang besar”; “suara lantang” menyampaikan kekuatan bunyinya secara alami dalam bahasa Indonesia.
- source_word: וְלֹא יָסָף
  choice: Dia tidak menambahkan apa-apa lagi
  rationale: Ungkapan ini dapat berarti bahwa Yahweh tidak menambahkan ucapan lain. Terjemahan utama mempertahankan hubungan dengan “perkataan-perkataan ini”, sementara kemungkinan “tidak melanjutkan” dicatat dalam catatan kaki.
- source_word: וַיִּכְתְּבֵם
  choice: Lalu Dia menuliskannya
  rationale: “Lalu” menandai kemajuan narasi; akhiran objek jamak diwakili oleh “-nya”, dengan Yahweh tetap menjadi subjek.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: dua loh batu
  rationale: “Loh batu” merupakan padanan Indonesia yang tepat dan lazim untuk lempengan tempat tulisan itu dicatat.
- source_word: וַיִּתְּנֵם אֵלָי
  choice: dan memberikannya kepadaku
  rationale: Terjemahan ini mempertahankan kesinambungan subjek Yahweh serta penerima orang pertama tunggal, yaitu Musa.
theological_decisions:
- issue: Penerjemahan nama ilahi YHWH
  choice: Yahweh
  alternative: Yehuwa
  rationale: Transliterasi “Yahweh” mempertahankan nama pribadi ilahi dalam teks sumber tanpa menggantinya dengan gelar atau memasukkan ciri denominasi tertentu.
- issue: Makna וְלֹא יָסָף
  choice: Dia tidak menambahkan apa-apa lagi
  alternative: Dia tidak melanjutkan lagi
  rationale: Klausa Ibrani dapat dipahami sebagai tidak menambahkan ucapan lain atau tidak melanjutkan berbicara. Teks utama memilih makna yang paling sesuai dengan konteks perkataan yang kemudian dituliskan pada loh, tetapi alternatifnya dipertahankan dalam catatan kaki agar ambiguitas asli tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dibuat jelas bagi pembaca umum tanpa menghilangkan gambaran api, awan, dan kelam pekat. Kata ganti ilahi ditulis dengan huruf kapital secara konsisten dalam ayat ini.
