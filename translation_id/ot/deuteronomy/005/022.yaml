    rationale: Teks Ibrani memakai sufiks objek jamak yang merujuk kepada 'perkataan-perkataan ini'. Pengulangan nomina tersebut membuat rujukannya jelas tanpa mengubah makna.
  - severity: low
    issue: Rumusan alternatif catatan kaki 'Dia tidak melanjutkan lagi' tidak lengkap secara idiomatis.
