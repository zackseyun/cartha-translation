  text: And you shall not commit adultery[a].
translation:
  language: id
  text: Dan jangan berzina.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih ringkas, “Jangan berzina.” Bahasa Ibrani memakai kata penghubung “dan” yang mengaitkan perintah ini dengan perintah-perintah di sekitarnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹא
  choice: Dan jangan
  rationale: Konjungsi וְ dipertahankan sebagai “Dan” untuk mencerminkan kaitan berurutan dengan perintah-perintah di sekitarnya, sedangkan לֹא bersama bentuk verba orang kedua menyatakan larangan tegas dan wajar diterjemahkan “jangan” dalam bahasa Indonesia.
- source_word: תִּנְאָף
  choice: berzina
  rationale: Bentuk Qal imperfek orang kedua tunggal maskulin dari נאף di sini melarang perzinaan. “Berzina” merupakan padanan Indonesia yang ringkas, lazim, dan tepat bagi pelanggaran seksual terhadap ikatan perkawinan.
theological_decisions:
- issue: Bentuk larangan orang kedua tunggal dalam hukum perjanjian
  choice: Dan jangan berzina.
  alternative: Jangan berzina.
  rationale: Bahasa Indonesia tidak membedakan gender pada bentuk orang kedua, dan subjek tersirat dalam “jangan berzina” secara alami mempertahankan sapaan langsung kepada tiap anggota umat. “Dan” dipertahankan karena konjungsi Ibrani hadir dan menghubungkan perintah ini dengan rangkaian perintah di sekitarnya.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan khidmat. Bentuk “jangan” lebih alami daripada konstruksi futur legalistik, tanpa mengurangi ketegasan larangan. Tanda petik ayat mempertahankan konjungsi sumber dan penanda catatan kaki.
