revisions:
- from: Jangan sujud kepada mereka atau beribadah kepada mereka,[a] sebab Aku, Yahweh, Allahmu, adalah Allah yang cemburu. Aku memperhitungkan[b] kesalahan para ayah kepada anak-anak mereka, sampai keturunan yang ketiga dan yang keempat,[c] yaitu mereka yang membenci-Ku.
  to: Jangan sujud kepada mereka atau beribadah kepada mereka,[a] sebab Aku, Yahweh, Allahmu, adalah Allah yang cemburu, yang memperhitungkan[b] kesalahan para ayah kepada anak-anak mereka, kepada generasi ketiga dan keempat, dari orang-orang yang membenci-Ku.[c]
  rationale: Revisi menyambungkan tindakan yudisial sebagai klausa relatif yang menerangkan “Allah yang cemburu,” mengganti “sampai keturunan” dengan deret “kepada ... kepada ...” yang lebih setia kepada konstruksi Ibrani, dan merumuskan frasa penutup tanpa aposisi “yaitu” agar ambiguitas sintaktisnya tetap terjaga.
