source:
  edition: WLC
  text: לֹא תִשְׁתַּחֲוֶ֥ה לָ/הֶ֖ם וְ/לֹ֣א תָעָבְדֵ֑/ם כִּ֣י אָנֹכִ֞י יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ אֵ֣ל קַנָּ֔א פֹּ֠קֵד עֲוֺ֨ן אָב֧וֹת עַל בָּנִ֛ים וְ/עַל שִׁלֵּשִׁ֥ים וְ/עַל רִבֵּעִ֖ים לְ/שֹׂנְאָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/009.yaml
  text: You shall not bow down to them or serve them[a], for I, Yahweh your God, am a jealous God, visiting the iniquity of fathers on children, and on the third and on the fourth generations of those who hate me[c][b],
translation:
  language: id
  text: Jangan sujud kepada mereka atau beribadah kepada mereka,[a] sebab Aku, Yahweh, Allahmu, adalah Allah yang cemburu, yang memperhitungkan[b] kesalahan para ayah kepada anak-anak mereka, kepada generasi ketiga dan keempat, dari orang-orang yang membenci-Ku.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “merebahkan diri di hadapan mereka atau melayani mereka.” Kata kerja pertama menunjuk pada tindakan fisik membungkuk atau merebahkan diri dengan hormat; kata kerja kedua, dalam konteks ini, berarti memberikan pelayanan ibadah.
    reason: lexical_alternative
  - marker: b
    text: Atau “menuntut pertanggungjawaban atas” atau “menghukum karena.” Kata Ibrani secara harfiah dapat diterjemahkan “mengunjungi” dan di sini merupakan istilah yudisial yang dapat mencakup perhitungan maupun penghukuman.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “kepada yang ketiga dan kepada yang keempat”; kata “generasi” ditambahkan agar maksud generasionalnya jelas.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׁתַּחֲוֶה
  choice: sujud
  rationale: Mempertahankan tindakan konkret membungkuk atau merebahkan diri sebagai penghormatan, dan tidak meleburkannya dengan kata kerja berikutnya.
- source_word: תָעָבְדֵם
  choice: beribadah kepada mereka
  rationale: Dalam konteks larangan terhadap ilah atau patung, עבד menunjuk pada pelayanan kultis. 'Beribadah' menyampaikan maksud itu secara alami dalam bahasa Indonesia sambil tetap berbeda dari 'sujud'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan sebuah gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Padanan langsung dan alami bagi sebutan perjanjian dengan sufiks orang kedua tunggal.
- source_word: אֵל קַנָּא
  choice: Allah yang cemburu
  rationale: Menyatakan tuntutan perjanjian yang eksklusif dan penolakan terhadap penyembahan saingan; 'cemburu' mempertahankan ketegangan ungkapan sumber.
- source_word: פֹּקֵד
  choice: memperhitungkan
  rationale: Mencerminkan tindakan yudisial meminta pertanggungjawaban tanpa mempersempit maknanya hanya menjadi pelaksanaan hukuman.
- source_word: עֲוֺן
  choice: kesalahan
  rationale: Cukup luas untuk mencakup perbuatan bengkok, kesalahan, dan tanggungannya tanpa menentukan secara berlebihan apakah fokusnya tindakan atau akibat hukum.
- source_word: אָבוֹת
  choice: para ayah
  rationale: Mempertahankan bentuk maskulin spesifik dari bahasa Ibrani, bukan menetralkannya menjadi 'orang tua' atau memperluasnya menjadi 'leluhur'.
- source_word: עַל בָּנִים
  choice: kepada anak-anak mereka
  rationale: Dalam konteks antargenerasi, בנים dapat merujuk secara umum kepada anak-anak atau keturunan; pronomina 'mereka' menjernihkan hubungan dengan para ayah.
- source_word: שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: sampai keturunan yang ketiga dan yang keempat
  rationale: Kata 'keturunan' disediakan agar idiom generasional Ibrani dapat dipahami secara alami; catatan kaki mempertahankan bentuk harfiahnya.
- source_word: לְשֹׂנְאָי
  choice: yaitu mereka yang membenci-Ku
  rationale: Menjaga frasa penutup sebagai pembatas terhadap pihak yang menjadi sasaran perhitungan, tanpa menghapus kemungkinan hubungan antargenerasi yang tetap dinyatakan teks.
theological_decisions:
- issue: Cara menerjemahkan kecemburuan ilahi
  choice: Allah yang cemburu
  alternative: Allah yang bersemangat menuntut kesetiaan
  rationale: Konteksnya ialah hak eksklusif Yahweh atas ibadah Israel. 'Cemburu' mempertahankan daya relasional dan perjanjian dari קַנָּא tanpa melunakkan klaim teks.
- issue: Apakah ayat ini menyatakan hukuman antargenerasi secara otomatis tanpa memperhatikan sikap keturunan
  choice: Frasa 'mereka yang membenci-Ku' dibiarkan membatasi kelompok yang berada dalam lingkup perhitungan ilahi.
  alternative: Kesalahan para ayah ditimpakan kepada semua keturunan secara otomatis, apa pun sikap mereka sendiri.
  rationale: Frasa לְשֹׂנְאָי berada pada akhir klausa dan secara wajar menerangkan pihak yang terkena tindakan yudisial. Terjemahan tidak meniadakan konsekuensi antargenerasi, tetapi juga tidak mengimpor doktrin hukuman warisan yang deterministis.
- issue: Hubungan עֲוֺן para ayah dengan anak-anak
  choice: memperhitungkan kesalahan para ayah kepada anak-anak mereka
  alternative: menghukum anak-anak karena kesalahan para ayah
  rationale: Ungkapan sumber mengandung ketegangan mengenai tindakan yudisial dan dampak lintas generasi. 'Memperhitungkan' mempertahankan keluasan פקד dan menghindari penjelasan teologis yang lebih sempit daripada teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Sapaan tunggal dipertahankan melalui bentuk terikat 'Allahmu'. Kapitalisasi pada Aku dan -Ku mengikuti kebiasaan penerbitan Alkitab Indonesia untuk rujukan ilahi. Nama Yahweh dipertahankan sebagai nama pribadi. Tanda baca memisahkan pernyataan identitas Allah dari tindakan yudisial agar kalimat tetap jelas tanpa mengubah hubungan logis sumber.
