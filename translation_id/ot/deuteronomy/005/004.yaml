  text: Yahweh spoke with you face to face on the mountain[a], from the midst of the fire.
translation:
  language: id
  text: Yahweh berbicara dengan kamu secara langsung[a] di gunung itu, dari tengah-tengah api.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Harfiah, “muka dengan muka,” suatu ungkapan untuk sapaan langsung dan pribadi; bandingkan Ulangan 4:12, yang menyatakan bahwa Israel mendengar suara, tetapi tidak melihat wujud apa pun.
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּנִים בְּפָנִים
  choice: muka dengan muka
  rationale: Mempertahankan ungkapan Ibrani secara idiomatis dan daya retorisnya sebagai komunikasi langsung dan pribadi, tanpa menyatakan bahwa Israel melihat suatu wujud.
- source_word: דִּבֶּר
  choice: berbicara
  rationale: Menerjemahkan makna dasar verba Ibrani secara wajar; bersama עִמָּכֶם membentuk frasa 'berbicara dengan kamu'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: עִמָּכֶם
  choice: dengan kamu
  rationale: Mencerminkan arti lazim preposisi עִם dan kedekatan relasional dalam peristiwa tersebut. Bentuk 'kamu' juga mempertahankan sapaan jamak secara alami dalam bahasa Indonesia.
- source_word: בָּהָר
  choice: di gunung itu
  rationale: Preposisi ב bersifat lokatif. 'Di gunung itu' alami dalam bahasa Indonesia dan konteksnya menunjuk kepada gunung yang sudah dikenal dalam wacana.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: dari tengah-tengah api
  rationale: Mempertahankan kekhususan מִתּוֹךְ, yaitu berasal dari bagian tengah atau dalam api, serta gambaran teofanisnya.
theological_decisions:
- issue: Ungkapan antropomorfis 'muka dengan muka' dalam kaitannya dengan penampakan di Sinai
  choice: Mempertahankan ungkapan 'muka dengan muka' sebagai gambaran sapaan perjanjian yang langsung, tanpa menetapkannya sebagai penglihatan harfiah.
  alternative: Menerjemahkannya secara lebih interpretatif sebagai 'secara langsung' atau 'secara pribadi'.
  rationale: Konteks yang lebih luas menyatakan bahwa Israel mendengar suara dari api tetapi tidak melihat suatu wujud (Ul. 4:12, 15). Ungkapan asli tetap dipertahankan agar ketegangan teks tidak dihapus atau diselesaikan secara doktrinal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mengikuti gerak teks Ibrani sambil tetap alami; ungkapan 'muka dengan muka' dipertahankan dan dijelaskan dalam catatan kaki untuk mencegah salah pengertian.
