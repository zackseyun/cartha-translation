id: DEU.5.26
reference: Deuteronomy 5:26
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֣י מִ֣י כָל בָּשָׂ֡ר אֲשֶׁ֣ר שָׁמַ֣ע קוֹל֩ אֱלֹהִ֨ים חַיִּ֜ים מְדַבֵּ֧ר מִ/תּוֹךְ הָ/אֵ֛שׁ כָּמֹ֖/נוּ וַ/יֶּֽחִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/026.yaml
  text: For who of all flesh has heard the voice of the living God speaking from the midst of the fire[a], as we have, and lived?
translation:
  language: id
  text: Sebab, siapakah di antara semua manusia fana[a] yang pernah mendengar suara Allah yang hidup berbicara dari tengah-tengah api seperti kita, lalu tetap hidup?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “segala daging,” sebuah ungkapan Ibrani bagi umat manusia yang fana.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan bagi ketakutan dan permohonan bangsa itu dalam konteks sekitar.
- source_word: מִי כָל בָּשָׂר
  choice: siapakah di antara semua manusia fana
  rationale: Mengungkapkan pertanyaan retoris secara alami. Ungkapan harfiah 'segala daging' menunjuk kepada umat manusia dalam kefanaan mereka; 'manusia fana' mempertahankan nuansa itu tanpa terdengar janggal dalam bahasa Indonesia modern.
- source_word: שָׁמַע קוֹל
  choice: pernah mendengar suara
  rationale: '''Suara'' sesuai karena subjeknya sedang berbicara, sedangkan ''pernah mendengar'' menyampaikan pengalaman lampau yang menjadi dasar pertanyaan retoris.'
- source_word: אֱלֹהִים חַיִּים
  choice: Allah yang hidup
  rationale: Walaupun bentuk Ibraninya secara morfologis jamak, dalam konteks ini ungkapan tersebut merupakan sebutan tunggal bagi Allah Israel.
- source_word: מְדַבֵּר
  choice: berbicara
  rationale: Partisip ini menerangkan Allah sebagai Dia yang berbicara; bentuk Indonesia ini alami dan tetap dekat dengan struktur sumber.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: dari tengah-tengah api
  rationale: Mempertahankan gambaran bahwa suara itu berasal dari dalam api, bukan sekadar dari dekat api.
- source_word: כָּמֹנוּ
  choice: seperti kita
  rationale: Membandingkan pengalaman orang lain dengan pengalaman Israel sendiri, dengan tetap membiarkan unsur predikat dipahami dari klausa sebelumnya.
- source_word: וַיֶּחִי
  choice: lalu tetap hidup
  rationale: '''Tetap hidup'' menyampaikan keheranan bahwa seseorang dapat mendengar Allah dan tidak mati, tanpa mempersempitnya menjadi sekadar ''selamat''.'
theological_decisions:
- issue: Ungkapan antropologis כָל בָּשָׂר
  choice: semua manusia fana
  alternative: segala daging; siapa pun di antara manusia
  rationale: Pilihan ini mempertahankan penekanan Ibrani pada kefanaan dan keterbatasan makhluk, tetapi menghindari idiom 'segala daging' yang kurang alami dan berpotensi kabur bagi pembaca Indonesia modern.
- issue: Bilangan dan makna אֱלֹהִים חַיִּים
  choice: Allah yang hidup
  alternative: allah-allah yang hidup
  rationale: Konteks dan pemakaian Ibrani menunjukkan bahwa ungkapan ini merujuk kepada satu Allah Israel; terjemahan jamak akan menyesatkan.
- issue: Makna וַיֶּחִי setelah perjumpaan ilahi
  choice: lalu tetap hidup
  alternative: dan hidup; dan selamat
  rationale: 'Terjemahan ini mempertahankan arti dasar ''hidup'' sekaligus menyatakan ketegangan dalam pertanyaan: manusia mendengar suara Allah dari api, namun tidak mati.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan pertanyaan retoris dipertahankan; 'dari tengah-tengah api' menjaga gambaran sumber, sedangkan 'manusia fana' menerangkan idiom Ibrani secara alami.
