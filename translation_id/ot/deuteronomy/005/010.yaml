base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/010.yaml
  text: but showing steadfast love to thousands[a], to those who love me and keep my commandments.
translation:
  language: id
  text: tetapi menunjukkan kasih setia kepada beribu-ribu[a], kepada mereka yang mengasihi Aku dan menaati perintah-perintahnya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepada beribu-ribu”; bahasa Ibrani tidak menyebutkan apakah yang dimaksud adalah orang, keturunan, atau generasi.
    reason: lexical_ambiguity
  - marker: b
    text: Teks Ibrani yang diberikan berbunyi “perintah-perintahnya”. Sebagian naskah dan terjemahan berbunyi “perintah-perintah-Ku”, yang sesuai dengan ujaran orang pertama dalam konteks ini.
    reason: textual_variant
lexical_decisions:
- source_word: וְעֹשֶׂה
  choice: tetapi menunjukkan
  rationale: Partisipel ini melanjutkan kontras dengan hukuman dalam ayat sebelumnya. Dalam konteks ini, “tetapi” menyampaikan daya adversatif, sedangkan “menunjukkan” mengungkapkan tindakan kasih yang nyata dan berkelanjutan.
- source_word: חֶסֶד
  choice: kasih setia
  rationale: Istilah חֶסֶד mencakup kasih yang teguh dan kesetiaan dalam hubungan perjanjian; “kasih setia” alami dalam bahasa Indonesia dan mempertahankan kedua unsur tersebut.
- source_word: לַאֲלָפִים
  choice: kepada beribu-ribu
  rationale: Teks Ibrani secara harfiah menyebut “beribu-ribu” tanpa menyatakan nomina seperti “orang” atau “keturunan/generasi”. Bentuk eliptis dipertahankan agar cakupannya tidak dipersempit.
- source_word: לְאֹהֲבַי
  choice: kepada mereka yang mengasihi Aku
  rationale: Partisipel dengan sufiks orang pertama paling alami dialihkan menjadi klausa relatif, sambil mempertahankan relasi yang berlangsung.
- source_word: וּלְשֹׁמְרֵי
  choice: dan menaati
  rationale: Dalam hubungan dengan perintah, שׁמר berarti memelihara atau menaatinya. “Menaati” merupakan ungkapan Indonesia yang jelas dan wajar.
- source_word: מצות/ו
  choice: perintah-perintahnya
  rationale: Bentuk yang disediakan memuat sufiks orang ketiga tunggal maskulin, “-nya”. Terjemahan mengikuti bentuk itu dan tidak diam-diam menyelaraskannya dengan ujaran orang pertama di sekitarnya.
theological_decisions:
- issue: Pronomina pada frasa “perintah-perintahnya”
  choice: perintah-perintahnya
  alternative: perintah-perintah-Ku
  rationale: Teks Ibrani yang disediakan memakai sufiks orang ketiga tunggal, walaupun konteks ujaran ilahi orang pertama dan sejumlah saksi tekstual mendukung “perintah-perintah-Ku”. Ketegangan ini dipertahankan dalam teks dan diterangkan dalam catatan kaki.
- issue: Cakupan “beribu-ribu”
  choice: membiarkan nomina tersirat
  alternative: beribu-ribu orang / seribu generasi
  rationale: Bahasa Ibrani tidak menyebut “orang” ataupun “generasi” secara eksplisit. Terjemahan tidak memasukkan salah satunya ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kapital pada “Aku” menandai pembicara ilahi sesuai kebiasaan penerbitan Alkitab Indonesia. Bentuk “-nya” dibiarkan tanpa kapital untuk mempertahankan peralihan gramatikal ke orang ketiga dalam teks sumber dan tidak secara tipografis menetapkan rujukannya.
