lexical_decisions:
- source_word: וְ/לֹא
  choice: Dan jangan
  rationale: Konjungsi וְ menghubungkan larangan ini dengan perintah-perintah sebelumnya, sedangkan לֹא bersama bentuk verba orang kedua menyatakan larangan langsung. “Dan jangan” mempertahankan hubungan antarkalimat sekaligus terdengar wajar dalam bahasa Indonesia modern.
- source_word: תִּגְנֹב
  choice: mencuri
  rationale: Verba גנב dalam bentuk Qal imperfek orang kedua tunggal maskulin berfungsi sebagai larangan. Karena ayat ini tidak menyebut objek tertentu, “mencuri” mempertahankan cakupan umumnya; makna yang lebih khusus, seperti menculik atau mencuri orang, dimungkinkan dalam konteks lain tetapi tidak perlu dimasukkan ke dalam teks utama.
theological_decisions: []
