  source_fidelity: Teks Indonesia secara cermat mencerminkan larangan Ibrani לֹא תַעֲשֶׂה לְךָ, termasuk unsur 'bagimu'. 'Patung pahatan' mempertahankan arti konkret פֶסֶל, dan 'rupa apa pun' secara memadai menyampaikan כָּל־תְּמוּנָה tanpa menambahkan unsur penyembahan dari ayat berikutnya. Tiga ranah—langit di atas, bumi di bawah, dan air di bawah bumi—terpelihara, termasuk gambaran kosmologis kuno pada frasa terakhir.
