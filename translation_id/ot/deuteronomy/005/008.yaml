  terminology: '''Patung pahatan'' dan ''rupa'' merupakan padanan modern yang tepat dan tidak mengimpor penafsiran ''berhala'' ke dalam teks utama. Catatan kaki a dan b menawarkan alternatif leksikal yang relevan, dengan jangkar yang ditempatkan tepat setelah istilah yang diterangkan.'
