id: DEU.5.8
reference: Deuteronomy 5:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לֹֽ֣א תַעֲשֶׂ֥ה לְ/ךָ֥ פֶ֨סֶל֙ כָּל תְּמוּנָ֔ה אֲשֶׁ֤ר בַּ/שָּׁמַ֨יִם֙ מִ/מַּ֔עַל וַ/אֲשֶׁ֥ר בָּ/אָ֖רֶץ מִ/תָּ֑חַת וַ/אֲשֶׁ֥ר בַּ/מַּ֖יִם מִ/תַּ֥חַת לָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/008.yaml
  text: You shall not make for yourself a carved image[a], or any likeness of what is in the heavens above, or on the earth beneath[b], or in the waters under the earth.
translation:
  language: id
  text: Jangan membuat bagimu patung pahatan[a] atau rupa apa pun[b] dari yang ada di langit di atas, di bumi di bawah, atau di dalam air di bawah bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berhala”. Kata Ibrani ini sering menunjuk pada patung yang digunakan dalam penyembahan berhala, tetapi terjemahan utama mempertahankan arti konkretnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “bentuk apa pun” atau “gambaran apa pun”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶסֶל
  choice: patung pahatan
  rationale: Istilah ini menunjuk pada patung atau gambar yang dibentuk dengan memahat, sering dalam konteks penyembahan berhala. Pilihan konkret ini tidak terlebih dahulu menafsirkan benda tersebut sebagai berhala.
- source_word: תְּמוּנָה
  choice: rupa
  rationale: Kata ini berarti bentuk atau keserupaan. 'Rupa' alami dalam bahasa Indonesia dan mempertahankan keluasan cakupan larangan.
- source_word: לֹא תַעֲשֶׂה לְךָ
  choice: Jangan membuat bagimu
  rationale: Bentuk larangan perjanjian diterjemahkan secara langsung dengan 'Jangan'. 'Bagimu' mempertahankan unsur לְךָ, yang menunjukkan pembuatan bagi kepunyaan atau penggunaan pihak yang disapa.
- source_word: כָּל תְּמוּנָה
  choice: rupa apa pun
  rationale: Dalam konteks negatif, כָּל menyatakan cakupan menyeluruh dan secara alami diterjemahkan 'apa pun'.
- source_word: אֲשֶׁר בַּשָּׁמַיִם מִמַּעַל
  choice: dari yang ada di langit di atas
  rationale: '''Langit'' merupakan padanan Indonesia yang wajar bagi bentuk Ibrani שָׁמַיִם, sedangkan susunan ini mempertahankan acuan kepada segala yang berada dalam ranah tersebut.'
- source_word: בָּאָרֶץ מִתָּחַת
  choice: di bumi di bawah
  rationale: Terjemahan ini mempertahankan kesejajaran vertikal dengan 'di langit di atas' dan tidak mempersempit bumi menjadi hanya permukaannya.
- source_word: בַּמַּיִם מִתַּחַת לָאָרֶץ
  choice: di dalam air di bawah bumi
  rationale: Ungkapan ini mempertahankan secara langsung gambaran kosmologis kuno tentang air yang berada di bawah bumi.
theological_decisions:
- issue: Cakupan larangan terhadap gambar
  choice: Menerjemahkan ayat sebagai larangan membuat patung pahatan atau rupa tanpa menambahkan tujuan penyembahan.
  alternative: Menerjemahkan secara interpretatif sebagai larangan membuat berhala untuk disembah.
  rationale: Ayat 8 menyatakan larangan membuat, sedangkan ayat 9 secara eksplisit menyebut sujud dan beribadah kepadanya. Pemisahan ini mempertahankan perkembangan teks dan tidak memasukkan penjelasan dari ayat berikutnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-perjanjian yang lugas dan bermartabat. 'Jangan' lebih alami daripada rumusan futuristik dalam bahasa Indonesia; 'bagimu' dipertahankan untuk mencerminkan לְךָ. Kesejajaran 'di langit di atas, di bumi di bawah, ... di bawah bumi' dipertahankan.
