  text: לֹא יִהְיֶ֥ה לְ/ךָ֛ אֱלֹהִ֥ים אֲחֵרִ֖ים עַל פָּנָֽ/יַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/007.yaml
  text: You shall have no other gods before me[a].
translation:
  language: id
  text: Jangan ada padamu ilah-ilah lain di hadapan-Ku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “selain Aku.” Secara harfiah, ungkapan Ibrani ini berarti “di hadapan wajah-Ku” dan dapat menyatakan baik kehadiran maupun eksklusivitas.
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא
  choice: jangan
  rationale: Negasi ini mengawali larangan. Dalam bahasa Indonesia, “jangan ada” menyampaikan daya larangan secara wajar.
- source_word: יִהְיֶה לְךָ
  choice: ada padamu
  rationale: Gabungan verba “ada/menjadi” dengan preposisi berakhiran orang kedua tunggal menyatakan keberadaan dalam hubungan dengan pihak yang disapa. “Ada padamu” mempertahankan bentuk Ibrani sekaligus tetap alami dalam ragam kitab suci Indonesia.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ilah-ilah lain
  rationale: Nomina jamak yang diterangkan oleh “lain” menunjuk kepada dewa-dewa tandingan. “Ilah-ilah” mempertahankan pembedaan dari Allah tanpa menambahkan nuansa “asing” yang tidak dinyatakan langsung.
- source_word: עַל פָּנָי
  choice: di hadapan-Ku
  rationale: Ungkapan ini secara harfiah berkaitan dengan “di depan/di hadapan wajah-Ku” dan dapat menyatakan kehadiran maupun, dalam konteks larangan ini, eksklusivitas. “Di hadapan-Ku” mempertahankan citra dan ambiguitas sumber.
theological_decisions:
- issue: Makna frasa penutup עַל פָּנָי
  choice: di hadapan-Ku
  alternative: selain Aku
  rationale: Frasa Ibrani dapat menyatakan kehadiran di hadapan TUHAN dan, secara implikatif, larangan terhadap ilah lain selain Dia. Teks utama mempertahankan ungkapan yang lebih dekat dengan bentuk sumber, sedangkan catatan kaki memuat pembacaan eksklusif yang sah.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, dan bermartabat. Sapaan orang kedua tunggal dipertahankan secara kolektif melalui “padamu”; kapitalisasi “-Ku” menandai pembicara ilahi.
