    issue: Frasa 'dengan menguduskannya' mengubah relasi לְ + infinitif.
    rationale: 'Konstruksi לְקַדְּשׁוֹ paling wajar menyatakan tujuan: hari Sabat harus dipelihara ''untuk menguduskannya''. ''Dengan'' cenderung menyatakan sarana/cara dan karena itu mengaburkan hubungan gramatikal sumber.'
  - severity: low
    issue: Penempatan 'kepada' dalam klausa pasif kurang lancar.
    rationale: '''Seperti yang diperintahkan Yahweh, Allahmu, kepadamu'' dapat dipahami, tetapi penempatan adverbial dan koma membuat penutup kalimat agak tersendat. Klausa aktif ''sebagaimana Yahweh, Allahmu, telah memerintahkan kepadamu'' lebih idiomatis.'
