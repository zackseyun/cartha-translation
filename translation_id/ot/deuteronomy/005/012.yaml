  text: שָׁמ֛וֹר אֶת י֥וֹם הַ/שַׁבָּ֖ת לְ/קַדְּשׁ֑/וֹ כַּ/אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/012.yaml
  text: Observe the Sabbath day[a], to keep it holy, as Yahweh your God commanded you.
translation:
  language: id
  text: Peliharalah hari Sabat[a] untuk menguduskannya, sebagaimana Yahweh, Allahmu, telah memerintahkan kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Jagalah hari Sabat” atau “Peganglah hari Sabat.” Kata kerja Ibrani ini menekankan pemeliharaan yang saksama.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹר
  choice: Peliharalah
  rationale: Infinitif absolut Qal ini berfungsi sebagai perintah. “Peliharalah” menyampaikan perhatian dan ketaatan yang sungguh-sungguh serta mempertahankan perbedaannya dari “Ingatlah” dalam Keluaran 20:8.
- source_word: יוֹם הַשַׁבָּת
  choice: hari Sabat
  rationale: Ungkapan baku dan alami dalam bahasa Indonesia untuk hari khusus yang dimaksud.
- source_word: לְקַדְּשׁוֹ
  choice: dengan menguduskannya
  rationale: Infinitif berprefiks לְ menyatakan tujuan atau maksud; “menguduskannya” berarti memperlakukan atau mengkhususkan hari itu sebagai kudus, tanpa menambahkan penjelasan ke dalam teks utama.
- source_word: כַּאֲשֶׁר
  choice: seperti yang
  rationale: Secara alami memperkenalkan kesesuaian dengan perintah ilahi yang telah diberikan.
- source_word: צִוְּךָ
  choice: diperintahkan ... kepadamu
  rationale: צוה menyatakan perintah yang berwenang; bentuk Indonesia ini jelas dan alami dalam konstruksi klausa tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Mencerminkan sebutan perjanjian dengan sufiks orang kedua tunggal secara ringkas dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama ilahi YHWH; “Yahweh” mempertahankannya sebagai nama pribadi dan mengikuti bukti sumber tanpa menggantinya dengan gelar.
- issue: Makna menguduskan hari Sabat
  choice: menguduskannya
  alternative: menjadikannya kudus atau menjaganya tetap kudus
  rationale: Terjemahan ini mempertahankan cakupan לְקַדְּשׁוֹ tanpa memutuskan secara berlebihan apakah tekanannya pada menetapkan, mengkhususkan, atau memperlakukan hari itu sebagai kudus.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Bentuk tunggal pada perintah dan sapaan dipertahankan melalui “-lah” dan “Allahmu”; susunan kalimat dibuat alami tanpa menghilangkan hubungan tujuan dalam teks Ibrani.
