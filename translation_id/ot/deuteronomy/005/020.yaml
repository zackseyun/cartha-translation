  yaml_path: translation/ot/deuteronomy/005/020.yaml
  text: You shall not bear false witness against your neighbor[a].
translation:
  language: id
  text: Jangan memberi kesaksian palsu terhadap sesamamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jangan bersaksi dusta terhadap sesamamu.”
    reason: Alternatif ini memakai verba langsung “bersaksi” dan “dusta” untuk שָׁוְא, sambil mempertahankan makna yudisial ayat.
lexical_decisions:
- source_word: לֹא
  choice: jangan
  rationale: Negasi לֹא dalam larangan langsung paling alami dinyatakan dengan “jangan” dalam bahasa Indonesia.
- source_word: תַעֲנֶה
  choice: memberikan kesaksian
  rationale: Walaupun ענה pada dasarnya dapat berarti “menjawab”, dalam konstruksi hukum bersama עֵד kata ini menunjuk pada tindakan bersaksi; “memberikan kesaksian” menyampaikan fungsi yudisialnya secara jelas.
- source_word: בְרֵעֲךָ
  choice: terhadap sesamamu
  rationale: רֵעַ berarti sesama, rekan, atau orang lain dalam lingkungan sosial. Dalam konteks kesaksian hukum, preposisi בְ paling wajar diterjemahkan “terhadap”; bentuk “-mu” mempertahankan sapaan orang kedua tunggal.
- source_word: עֵד
  choice: kesaksian
  rationale: עֵד dapat menunjuk kepada saksi atau kesaksian. Karena bahasa Indonesia lazim memakai ungkapan “memberikan kesaksian”, pilihan ini mempertahankan makna hukum dari konstruksi Ibrani tanpa kekakuan.
- source_word: שָׁוְא
  choice: palsu
  rationale: Dalam konteks hukum, שָׁוְא menyatakan kepalsuan atau kebohongan; “palsu” merupakan padanan modern dan tepat untuk menerangkan kesaksian.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. “Sesamamu” mempertahankan bentuk tunggal serta cakupan sosial רֵעַ, sedangkan “memberikan kesaksian palsu” terdengar alami dalam konteks hukum.
