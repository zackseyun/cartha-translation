base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/027.yaml
  text: You go near and hear all that the LORD our God says, and you shall tell us all that the LORD our God speaks to you; and we will hear and do it.
translation:
  language: id
  text: Engkau, mendekatlah dan dengarkanlah segala yang akan dikatakan TUHAN, Allah kita. Kemudian sampaikanlah kepada kami segala yang akan difirmankan TUHAN, Allah kita, kepadamu. Kami akan mendengarkan dan melakukannya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קְרַב אַתָּה
  choice: Mendekatlah engkau
  rationale: Bentuk imperatif dengan pronomina yang ditegaskan diterjemahkan secara eksplisit; dalam konteks ini Musa diminta mendekati hadirat TUHAN sebagai wakil umat.
- source_word: יֹאמַר / יְדַבֵּר
  choice: difirmankan
  rationale: Kedua verba berarti ‘mengatakan/berbicara’. ‘Difirmankan’ mempertahankan ragam bahasa yang wajar dan bermartabat untuk perkataan Allah tanpa memaksakan perbedaan makna yang tidak jelas antara kedua verba.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia untuk menyatakan nama ilahi YHWH dengan huruf kapital.
- source_word: וְשָׁמַעְנוּ וְעָשִׂינוּ
  choice: Kami akan mendengarkan dan melakukannya
  rationale: Menjaga urutan harfiah ‘mendengar lalu melakukan’; ‘mendengarkan’ di sini juga menyiratkan penerimaan, sedangkan ‘melakukannya’ menyatakan ketaatan praktis.
theological_decisions:
- issue: Perantaraan Musa antara umat dan TUHAN
  choice: Mempertahankan permintaan langsung agar Musa mendekat, mendengar, lalu menyampaikan firman kepada umat
  alternative: Menjelaskan Musa sebagai imam atau mediator dalam istilah teologis tambahan
  rationale: Teks menggambarkan fungsi perantaraan Musa secara naratif tetapi tidak memakai gelar teologis tersebut; terjemahan tidak menambahkannya.
- issue: Makna שׁמע dalam penutup
  choice: mendengarkan
  alternative: menaati
  rationale: ‘Mendengarkan’ mempertahankan citra dan urutan sumber, sementara frasa berikutnya, ‘melakukannya’, sudah mengungkapkan unsur ketaatan.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pengulangan ‘TUHAN, Allah kita’ dipertahankan karena hadir dua kali dalam teks Ibrani. Kalimat dibagi menjadi tiga untuk keterbacaan tanpa mengubah hubungan antarklausa.
