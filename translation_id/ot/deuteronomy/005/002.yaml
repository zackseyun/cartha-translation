  text: יְהוָ֣ה אֱלֹהֵ֗י/נוּ כָּרַ֥ת עִמָּ֛/נוּ בְּרִ֖ית בְּ/חֹרֵֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/002.yaml
  text: Yahweh our God made a covenant with us at Horeb[a].
translation:
  language: id
  text: Yahweh, Allah kita, mengikat perjanjian dengan kita di Horeb.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memotong perjanjian dengan kita di Horeb.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH sebagai “Yahweh”, bukan menggantinya dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Bentuk אֱלֹהִים dengan akhiran orang pertama jamak berarti “Allah kita” dan mempertahankan hubungan perjanjian yang dinyatakan dalam ayat ini.
- source_word: כָּרַת ... בְּרִית
  choice: mengikat perjanjian
  rationale: Secara harfiah idiom Ibrani ini berarti “memotong perjanjian”. Ungkapan Indonesia “mengikat perjanjian” menyampaikan tindakan menetapkan perjanjian secara alami, sedangkan gambaran harfiahnya dicatat dalam catatan kaki.
- source_word: עִמָּנוּ
  choice: dengan kita
  rationale: Menerjemahkan preposisi dan akhiran orang pertama jamak secara langsung serta mempertahankan penekanan bahwa Musa memasukkan dirinya bersama umat yang disapa.
- source_word: בְּחֹרֵב
  choice: di Horeb
  rationale: Preposisi בְּ bersifat lokatif dalam konteks ini; “di Horeb” merupakan bentuk Indonesia yang alami, dan nama tempat חֹרֵב ditransliterasikan sebagai “Horeb”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama itu secara langsung tanpa menggantinya dengan gelar atau memilih bentuk tradisional alternatif.
- issue: Cakupan “kita” dalam pernyataan perjanjian
  choice: Mempertahankan “kita” tanpa penjelasan tambahan
  alternative: Menjelaskannya sebagai hanya generasi tertentu atau seluruh Israel lintas generasi
  rationale: Ayat ini sendiri menyatakan perjanjian dibuat “dengan kita”. Terjemahan tidak menyelesaikan secara sepihak ketegangan dengan konteks sejarah dan ayat-ayat berikutnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Mengikat perjanjian” dipilih sebagai padanan idiomatis yang wajar bagi כָּרַת בְּרִית, dengan bentuk harfiah dipertahankan dalam catatan kaki.
