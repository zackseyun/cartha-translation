  text: וַ/תֹּאמְר֗וּ הֵ֣ן הֶרְאָ֜/נוּ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ אֶת כְּבֹד֣/וֹ וְ/אֶת גָּדְל֔/וֹ וְ/אֶת קֹל֥/וֹ שָׁמַ֖עְנוּ מִ/תּ֣וֹךְ הָ/אֵ֑שׁ הַ/יּ֤וֹם הַ/זֶּה֙ רָאִ֔ינוּ כִּֽי יְדַבֵּ֧ר אֱלֹהִ֛ים אֶת הָֽ/אָדָ֖ם וָ/חָֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/024.yaml
  text: And you said, ‘Look, the LORD our God has shown us his glory and his greatness, and we have heard his voice from the midst of the fire. This day we have seen that God may speak with man, and he still lives.’
translation:
  language: id
  text: Kamu berkata, “Lihatlah, TUHAN, Allah kita, telah memperlihatkan kepada kita kemuliaan dan kebesaran-Nya, dan kita telah mendengar suara-Nya dari tengah-tengah api. Hari ini kita telah melihat bahwa Allah dapat berbicara dengan manusia, dan manusia itu tetap hidup.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵן
  choice: Lihatlah
  rationale: Partikel penunjuk ini menyoroti kesimpulan para pendengar; “Lihatlah” mempertahankan penekanan tersebut dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Nama ilahi ditampilkan menurut konvensi penerjemahan Alkitab Indonesia yang luas dikenal, dengan huruf kapital untuk membedakannya dari gelar biasa.
- source_word: כְּבֹדוֹ וְאֶת־גָּדְלוֹ
  choice: kemuliaan dan kebesaran-Nya
  rationale: Menerjemahkan kedua nomina secara langsung sambil mempertahankan kesejajaran dan akhiran posesifnya.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: dari tengah-tengah api
  rationale: Mewakili ungkapan ruang sumber secara jelas dan alami.
- source_word: יְדַבֵּר אֱלֹהִים אֶת־הָאָדָם
  choice: Allah dapat berbicara dengan manusia
  rationale: Bentuk imperfek dalam klausa setelah כִּי menyatakan kenyataan/kemungkinan yang baru mereka saksikan; “dapat berbicara” menangkap daya modal dalam konteks tanpa menyatakan bahwa tindakan itu selalu terjadi.
- source_word: וָחָי
  choice: dan manusia itu tetap hidup
  rationale: Subjek tersiratnya adalah manusia yang diajak bicara; penyebutan ulang menghindari ambiguitas pronomina Indonesia, sedangkan “tetap hidup” menyampaikan kontras bahwa ia tidak mati setelah mendengar Allah.
theological_decisions:
- issue: Kemungkinan manusia tetap hidup ketika Allah berbicara kepadanya
  choice: Allah dapat berbicara dengan manusia, dan manusia itu tetap hidup
  alternative: Allah berbicara dengan manusia, lalu manusia itu hidup
  rationale: 'Pilihan utama mempertahankan kesimpulan penuh keheranan dari peristiwa yang baru dialami: komunikasi ilahi dengan manusia ternyata mungkin tanpa menyebabkan kematian. Ini tidak mengubahnya menjadi kaidah universal atau menghapus ketegangan teologis konteks.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti orang kedua jamak Ibrani diterjemahkan dengan “kamu,” yang dalam bahasa Indonesia dapat bersifat tunggal atau jamak secara kontekstual. Susunan kalimat dijaga dekat dengan sumber tanpa menghasilkan ungkapan yang kaku.
