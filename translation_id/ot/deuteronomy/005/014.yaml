review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan untuk memperjelas seluruh unsur daftar Ibrani dan menghindari tambahan implisit dalam “ternakmu yang lain.” Frasa כָל־בְּהֶמְתֶּךָ mencakup “segala ternakmu,” meskipun lembu dan keledai telah disebut secara khusus. Susunan revisi juga mempertahankan tujuan לְמַעַן serta perbandingan “seperti engkau.”
  naturalness: Teks draf pada dasarnya baku, tetapi konstruksi “baik engkau ... maupun pendatang” kurang selaras karena unsur-unsurnya berupa daftar panjang yang dipisahkan koma. Daftar langsung dengan “atau” pada unsur terakhir lebih alami dan jelas. Bentuk “budak laki-lakimu/budak perempuanmu” juga lebih idiomatis daripada “budakmu laki-laki/perempuan.”
  terminology: “Hari Sabat,” “Yahweh,” “pekerjaan,” “lembu,” dan “keledai” sudah tepat. “Budak laki-laki/budak perempuan” dengan sufiks posesif mempertahankan pembedaan עבד/אמה tanpa eufemisme. “Pendatang yang tinggal di kotamu” adalah pengungkapan idiomatis yang dapat dipertahankan dengan catatan untuk גֵּר dan “di dalam gerbang-gerbangmu.”
  issues:
  - severity: medium
    issue: “ternakmu yang lain”
    rationale: Kata “yang lain” tidak ada dalam כָל־בְּהֶמְתֶּךָ dan dapat menyiratkan bahwa ternak umum yang dimaksud hanya ternak selain lembu dan keledai. “Segala ternakmu” mempertahankan cakupan total teks sumber.
  - severity: low
    issue: Konstruksi daftar “baik ... maupun”
    rationale: Konstruksi tersebut kurang mulus untuk daftar larangan yang panjang dan berisiko membuat cakupan sintaktis kurang jelas. Daftar langsung lebih alami dalam bahasa Indonesia baku.
  - severity: low
    issue: Frasa “budakmu laki-laki/perempuan”
    rationale: Bentuk “budak laki-lakimu” dan “budak perempuanmu” lebih idiomatis sambil tetap menyatakan jenis kelamin dan kepemilikan/keanggotaan rumah tangga sebagaimana dalam teks.
  - severity: low
    issue: Keterangan catatan memakai “bukan pribumi”
    rationale: Istilah ini kurang netral dan kurang tepat sebagai definisi leksikal umum bagi גֵּר. “Orang asing yang menetap” menyampaikan status penduduk nonasli tanpa muatan istilah modern yang tidak diperlukan.
