  text: וְ/י֨וֹם֙ הַ/שְּׁבִיעִ֔י שַׁבָּ֖ת לַ/יהוָ֣ה אֱלֹהֶ֑י/ךָ לֹ֣א תַעֲשֶׂ֣ה כָל מְלָאכָ֡ה אַתָּ֣ה וּ/בִנְ/ךָֽ וּ/בִתֶּ֣/ךָ וְ/עַבְדְּ/ךָֽ וַ֠/אֲמָתֶ/ךָ וְ/שׁוֹרְ/ךָ֨ וַ/חֲמֹֽרְ/ךָ֜ וְ/כָל בְּהֶמְתֶּ֗/ךָ וְ/גֵֽרְ/ךָ֙ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֔י/ךָ לְמַ֗עַן יָנ֛וּחַ עַבְדְּ/ךָ֥ וַ/אֲמָתְ/ךָ֖ כָּמֽוֹ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/014.yaml
  text: But the seventh day is a Sabbath to Yahweh your God[a]. You shall not do any work—you, or your son, or your daughter, or your male servant, or your female servant, or your ox, or your donkey, or any of your livestock[b], or the sojourner who is within your gates—so that your male servant and your female servant may rest as you do.
translation:
  language: id
  text: Namun, hari ketujuh adalah hari Sabat bagi Yahweh, Allahmu. Janganlah engkau melakukan pekerjaan apa pun—engkau sendiri, anakmu laki-laki, anakmu perempuan, budak laki-lakimu, budak perempuanmu, lembumu, keledaimu, segala ternakmu, atau pendatang yang tinggal di kotamu[a]—supaya budak laki-lakimu dan budak perempuanmu dapat beristirahat seperti engkau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pendatangmu yang ada di dalam gerbang-gerbangmu.” Kata Ibrani גֵּר menunjuk pada orang asing yang menetap dalam komunitas. Ungkapan “di dalam gerbang-gerbangmu” merupakan idiom untuk kota atau wilayah komunitasmu.
    reason: Menjelaskan istilah sosial dan idiom setempat dalam teks Ibrani.
lexical_decisions:
- source_word: שַׁבָּת
  choice: hari Sabat
  rationale: Menunjuk pada hari perhentian khusus dalam ketetapan perjanjian, bukan sekadar istirahat pada umumnya.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menyatakan bahwa hari itu diperuntukkan atau dikhususkan bagi Yahweh; ‘bagi’ menyampaikan makna ini secara alami dalam bahasa Indonesia.
- source_word: מְלָאכָה
  choice: pekerjaan
  rationale: Istilah umum yang tidak mempersempit jenis kegiatan yang dilarang dalam ketetapan Sabat.
- source_word: עַבְדְּךָ / אֲמָתֶךָ
  choice: budakmu laki-laki / budakmu perempuan
  rationale: Kedua istilah membedakan jenis kelamin dan menunjuk pada anggota rumah tangga yang berada dalam status perbudakan; ‘budak’ mempertahankan kenyataan sosial tersebut.
- source_word: שׁוֹרְךָ
  choice: lembumu
  rationale: Dalam konteks hukum rumah tangga, kata ini menunjuk pada lembu peliharaan, khususnya hewan yang dapat digunakan untuk bekerja.
- source_word: חֲמֹרְךָ
  choice: keledaimu
  rationale: Padanan modern dan langsung bagi hewan peliharaan yang disebut dalam teks.
- source_word: כָל־בְּהֶמְתֶּךָ
  choice: ternakmu yang lain
  rationale: Karena lembu dan keledai telah disebut secara khusus, frasa ini secara alami menyertakan semua ternak selebihnya tanpa menghilangkan cakupan כָל.
- source_word: גֵּרְךָ
  choice: pendatang
  rationale: Menunjuk pada orang bukan pribumi yang menetap di tengah komunitas, bukan sekadar pelancong atau tamu sementara.
- source_word: בִּשְׁעָרֶיךָ
  choice: yang tinggal di kotamu
  rationale: Ungkapan harfiah ‘di dalam gerbang-gerbangmu’ merupakan idiom bagi orang yang tinggal dalam kota atau wilayah komunitas; maknanya disampaikan secara alami dalam bahasa Indonesia.
- source_word: לְמַעַן יָנוּחַ
  choice: supaya ... dapat beristirahat
  rationale: Menyatakan tujuan ketetapan tersebut dan mempertahankan fokus pada kesempatan beristirahat bagi para budak.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian יהוה secara langsung; ‘Yahweh’ mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Status sosial עבד dan אמה
  choice: budak laki-laki dan budak perempuan
  alternative: hamba laki-laki dan hamba perempuan
  rationale: Dalam ketetapan ini, status terikat anggota rumah tangga penting karena hukum secara tegas menjamin istirahat mereka; ‘budak’ menyatakan kenyataan sosial itu dengan lebih jelas daripada ‘hamba’.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan ‘baik ... maupun ...’ menjaga daftar larangan tetap jelas, sedangkan ‘budak’ dipakai secara sadar untuk mempertahankan status sosial yang dinyatakan teks sumber.
