revisions:
- from: Namun, hari ketujuh adalah hari Sabat bagi Yahweh, Allahmu. Jangan melakukan pekerjaan apa pun—baik engkau, anakmu laki-laki atau perempuan, budakmu laki-laki atau perempuan, lembumu, keledaimu, ternakmu yang lain, maupun pendatang yang tinggal di kotamu[a]—supaya budakmu laki-laki dan perempuan dapat beristirahat seperti engkau.
  to: Namun, hari ketujuh adalah hari Sabat bagi Yahweh, Allahmu. Janganlah engkau melakukan pekerjaan apa pun—engkau sendiri, anakmu laki-laki, anakmu perempuan, budak laki-lakimu, budak perempuanmu, lembumu, keledaimu, segala ternakmu, atau pendatang yang tinggal di kotamu[a]—supaya budak laki-lakimu dan budak perempuanmu dapat beristirahat seperti engkau.
  rationale: Revisi membetulkan cakupan “segala ternakmu,” merapikan struktur daftar, dan memakai bentuk posesif yang lebih alami untuk budak laki-laki dan perempuan. Catatan kaki tetap tertambat pada “pendatang yang tinggal di kotamu” dan menjelaskan kedua unsur Ibrani yang diungkapkan secara idiomatis.
