language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אַתָּ֗ה פֹּה֮ עֲמֹ֣ד עִמָּדִ/י֒ וַ/אֲדַבְּרָ֣ה אֵלֶ֗י/ךָ אֵ֧ת כָּל הַ/מִּצְוָ֛ה וְ/הַ/חֻקִּ֥ים וְ/הַ/מִּשְׁפָּטִ֖ים אֲשֶׁ֣ר תְּלַמְּדֵ֑/ם וְ/עָשׂ֣וּ בָ/אָ֔רֶץ אֲשֶׁ֧ר אָנֹכִ֛י נֹתֵ֥ן לָ/הֶ֖ם לְ/רִשְׁתָּֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/031.yaml
  text: But you[a], stand here with me, and I will speak to you all the commandment and the statutes and the judgments that you shall teach them[b], so that they may do them in the land that I am giving them to possess.
translation:
  language: id
  text: Namun engkau, berdirilah di sini bersama-Ku; Aku akan berbicara kepadamu tentang seluruh perintah itu[a], ketetapan, dan peraturan yang harus kauajarkan kepada mereka, supaya mereka melakukannya di negeri yang Kuberikan kepada mereka untuk mereka miliki.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “seluruh perintah itu.” Kata Ibrani yang diterjemahkan “perintah” berbentuk tunggal, lalu diikuti kata-kata jamak “ketetapan” dan “peraturan”.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “untuk mereka warisi” atau “untuk mereka duduki”.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֹּה עֲמֹד עִמָּדִי
  choice: berdirilah di sini bersama-Ku
  rationale: Mempertahankan arti konkret עָמַד, yaitu ‘berdiri’, sekaligus menyampaikan perintah agar Musa tetap berada di hadirat Allah.
- source_word: וַאֲדַבְּרָה אֵלֶיךָ
  choice: Aku akan menyampaikan kepadamu
  rationale: Bentuk kohortatif sesudah imperatif menyatakan tindakan ilahi yang menyusul. ‘Menyampaikan’ terdengar alami dalam konteks pemberian pengajaran tanpa menghilangkan gagasan berbicara kepada Musa.
- source_word: אֵת כָּל הַמִּצְוָה
  choice: seluruh perintah
  rationale: Menjaga bentuk tunggal מִצְוָה dan cakupan menyeluruh כָּל. Dalam bahasa Indonesia, ‘seluruh perintah’ dapat dipahami secara kolektif tanpa diubah menjadi bentuk jamak.
- source_word: הַחֻקִּים
  choice: ketetapan
  rationale: ‘Ketetapan’ merupakan padanan baku dan jelas untuk חֻקִּים dalam konteks hukum perjanjian serta tetap dibedakan dari מִשְׁפָּטִים.
- source_word: הַמִּשְׁפָּטִים
  choice: peraturan
  rationale: Dalam konteks ini מִשְׁפָּטִים menunjuk pada aturan atau ketentuan hukum. ‘Peraturan’ lebih mudah dipahami pembaca Indonesia modern daripada ‘keputusan hukum’, namun tetap mempertahankan unsur legalnya.
- source_word: אֲשֶׁר תְּלַמְּדֵם
  choice: yang harus kauajarkan kepada mereka
  rationale: Imperfek ini menyatakan penugasan kepada Musa. ‘Harus kauajarkan’ mengungkapkan daya instruksionalnya secara wajar dan tegas dalam bahasa Indonesia.
- source_word: וְעָשׂוּ
  choice: supaya mereka melakukannya
  rationale: Menyatakan tujuan atau hasil dari pengajaran Musa, yakni ketaatan nyata terhadap perintah, ketetapan, dan peraturan tersebut.
- source_word: אֲשֶׁר אָנֹכִי נֹתֵן לָהֶם
  choice: yang Kuberikan kepada mereka
  rationale: Partisipel נֹתֵן menggambarkan pemberian ilahi yang sedang berlangsung atau sudah pasti. Bentuk kini ‘Kuberikan’ paling alami dalam bahasa Indonesia.
- source_word: לְרִשְׁתָּהּ
  choice: untuk mereka miliki
  rationale: יָרַשׁ di sini berarti memperoleh atau mengambil tanah itu sebagai milik. Padanan ini ringkas dan alami, sementara kemungkinan ‘mewarisi’ dicatat dalam catatan kaki.
theological_decisions:
- issue: Tiga istilah hukum מִצְוָה / חֻקִּים / מִשְׁפָּטִים
  choice: 'Mempertahankan tiga istilah berbeda: ‘perintah, ketetapan, dan peraturan’.'
  alternative: Merangkumnya sebagai ‘segala hukum dan aturan’.
  rationale: Pembedaan istilah mempertahankan tekstur hukum perjanjian dalam teks Ibrani dan tidak meratakan ketiganya menjadi satu kategori umum.
- issue: Bentuk tunggal מִצְוָה
  choice: Menggunakan bentuk tunggal kolektif ‘seluruh perintah’.
  alternative: ‘Semua perintah’ atau ‘seluruh hukum’.
  rationale: Teks Ibrani memakai nomina tunggal, yang mungkin bersifat kolektif. Bentuk itu dipertahankan agar ambiguitas dan penekanannya tidak hilang.
- issue: Hubungan וְעָשׂוּ dengan pengajaran Musa
  choice: 'Menerjemahkannya sebagai tujuan: ‘supaya mereka melakukannya’.'
  alternative: ‘dan mereka harus melakukannya’.
  rationale: 'Konteks mendukung hubungan tujuan atau hasil, tetapi tidak mengubah isi teologisnya: pengajaran diberikan agar Israel menaati ketetapan Allah.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti ‘engkau’ mempertahankan sapaan tunggal kepada Musa; bentuk terikat ‘-Ku’ menandai ucapan Allah. Kalimat dipecah setelah perintah langsung agar mudah dibaca tanpa mengubah urutan gagasan sumber.
