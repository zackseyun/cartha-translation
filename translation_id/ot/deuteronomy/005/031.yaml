  source_fidelity: 'Teks pada dasarnya setia pada Ibrani: perintah kepada Musa untuk berdiri bersama Allah, pengajaran tentang perintah (tunggal), ketetapan, dan hukum-hukum, tujuan agar bangsa itu melakukannya, serta pemberian negeri untuk dimiliki, semuanya terwakili. Saya mempertahankan bentuk tunggal kolektif מִצְוָה dan hubungan tujuan pada וְעָשׂוּ. Saya mengganti ''menyampaikan'' dengan ''berbicara ... tentang'' agar hubungan langsung dengan וַאֲדַבְּרָה lebih terlihat, tanpa mengubah cakupan isi yang akan disampaikan.'
