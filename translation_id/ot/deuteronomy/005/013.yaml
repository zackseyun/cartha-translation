  text: Six days you shall labor and do all your work,[a]
translation:
  language: id
  text: Enam hari lamanya engkau harus bekerja dan melakukan segala pekerjaanmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Enam hari lamanya engkau boleh bekerja dan melakukan segala pekerjaanmu.” Bentuk imperfek Ibrani dalam konteks hukum ini dapat dipahami sebagai instruksi atau sebagai pemberian izin.
    reason: alternative_reading
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Enam hari lamanya
  rationale: Frasa bilangan konstruktus dengan nomina jamak menyatakan durasi. Tambahan idiomatis "lamanya" membuat fungsi duratifnya jelas dan alami dalam bahasa Indonesia tanpa mengubah makna.
- source_word: תַּעֲבֹד
  choice: engkau harus bekerja
  rationale: Kata עבד di sini menunjuk pada kegiatan kerja biasa. Bentuk imperfek dalam konteks hukum memiliki daya instruksional; "harus" menyampaikan daya tersebut, sedangkan "bekerja" merupakan padanan Indonesia yang wajar.
- source_word: וְעָשִׂיתָ
  choice: dan melakukan
  rationale: Kata עשה memiliki cakupan luas dan bersama objek berikutnya secara alami berarti melaksanakan atau melakukan pekerjaan. "Melakukan" mempertahankan koordinasi kedua verba tanpa menyamakannya sepenuhnya.
- source_word: כָּל
  choice: segala
  rationale: Kata כָּל menyatakan keseluruhan. "Segala" berpadu secara alami dengan "pekerjaanmu" dan mempertahankan cakupan totalnya.
- source_word: מְלַאכְתֶּךָ
  choice: pekerjaanmu
  rationale: Kata מְלָאכָה dalam konteks Sabat berarti pekerjaan, tugas, atau kegiatan yang dilakukan. "Pekerjaanmu" adalah padanan modern yang ringkas dan tepat.
theological_decisions:
- issue: Daya modal verba imperfek dalam hukum Sabat
  choice: engkau harus bekerja dan melakukan segala pekerjaanmu
  alternative: engkau boleh bekerja dan melakukan segala pekerjaanmu
  rationale: Dalam rangkaian perintah perjanjian, kedua verba dapat dipahami sebagai instruksi mengenai enam hari kerja. Namun, bentuk imperfek Ibrani juga dapat dibaca sebagai pemberian izin; karena itu, kemungkinan tersebut dipertahankan dalam catatan kaki dan tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina "engkau" dipakai untuk sapaan orang kedua tunggal dalam teks hukum perjanjian. Susunan kalimat dibuat alami sambil mempertahankan dua verba Ibrani dan ambiguitas modalnya melalui catatan kaki.
