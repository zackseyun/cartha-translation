base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/003.yaml
  text: It was not with our fathers that Yahweh made this covenant[a], but with us—with us[c][b] who are all here alive today.
translation:
  language: id
  text: Bukan dengan nenek moyang kita[a] Yahweh mengadakan perjanjian ini[b], melainkan dengan kita—dengan kita[c] semua yang ada di sini hari ini dan hidup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bapak-bapak kita”; maksudnya dapat dipahami sebagai para leluhur.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani secara harfiah berbunyi “memotong perjanjian ini”, sebuah ungkapan untuk mengadakan perjanjian.
    reason: lexical_alternative
  - marker: c
    text: 'Sebagian orang memahami kontras ini secara retoris: bukan dengan nenek moyang kita saja, melainkan terutama dengan kita yang hidup dan hadir hari ini.'
    reason: alternative_reading
lexical_decisions:
- source_word: לֹא אֶת אֲבֹתֵינוּ
  choice: Bukan dengan nenek moyang kita
  rationale: Ungkapan ini mempertahankan penyangkalan dan sasaran perjanjian. Dalam bahasa Indonesia modern, “nenek moyang” menyampaikan אֲבוֹת secara alami sebagai generasi terdahulu; arti harfiahnya dicatat dalam catatan kaki.
- source_word: כָּרַת ... אֶת הַבְּרִית הַזֹּאת
  choice: mengikat perjanjian ini
  rationale: כרת ברית secara harfiah berarti “memotong perjanjian”, tetapi “mengikat perjanjian” adalah ungkapan Indonesia yang alami dan tetap mempertahankan citra ikatan perjanjian. Kata “ini” menerjemahkan הַזֹּאת.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dialihaksarakan sebagai “Yahweh”, bukan diganti dengan suatu gelar.
- source_word: כִּי אִתָּנוּ
  choice: melainkan dengan kita
  rationale: Dalam susunan ini כִּי memperkenalkan kontras sesudah penyangkalan; “melainkan” menyatakan daya adversatif itu dengan jelas.
- source_word: אֲנַחְנוּ אֵלֶּה
  choice: ya, dengan kita semua
  rationale: Bahasa Ibrani memakai aposisi yang menegaskan kelompok yang hadir. Pengulangan “dengan kita” dan partikel “ya” menyampaikan penekanan itu secara alami dalam bahasa Indonesia.
- source_word: פֹה הַיּוֹם כֻּלָּנוּ חַיִּים
  choice: yang ada di sini dan hidup hari ini
  rationale: Terjemahan ini mempertahankan unsur tempat, waktu, totalitas kelompok melalui “kita semua”, dan keadaan mereka sebagai orang-orang yang hidup.
theological_decisions:
- issue: Apakah ayat ini menyangkal secara mutlak bahwa perjanjian itu dibuat dengan para leluhur, atau secara retoris menekankan penerapannya kepada generasi yang sedang hadir
  choice: 'Teks utama mempertahankan kontras langsung: bukan dengan nenek moyang, melainkan dengan generasi yang hadir dan hidup.'
  alternative: Kontras dapat dipahami secara retoris sebagai “bukan hanya dengan nenek moyang kita”, sehingga menekankan pembaruan atau penerapan perjanjian tanpa meniadakan keterlibatan para leluhur.
  rationale: Teks Ibrani tidak memuat kata “hanya”. Karena itu, terjemahan utama tidak menambah pembatas tersebut, sedangkan kemungkinan pembacaan retoris dicatat tanpa menyelesaikan ketegangan teologis secara sepihak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kontras dipertahankan dengan “bukan ... melainkan”, sedangkan pengulangan “dengan kita” menjaga penekanan teks Ibrani tanpa membuat kalimat terlalu kaku.
