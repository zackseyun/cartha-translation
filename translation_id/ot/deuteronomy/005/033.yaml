  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בְּ/כָל הַ/דֶּ֗רֶךְ אֲשֶׁ֨ר צִוָּ֜ה יְהוָ֧ה אֱלֹהֵי/כֶ֛ם אֶתְ/כֶ֖ם תֵּלֵ֑כוּ לְמַ֤עַן תִּֽחְיוּ/ן֙ וְ/ט֣וֹב לָ/כֶ֔ם וְ/הַאֲרַכְתֶּ֣ם יָמִ֔ים בָּ/אָ֖רֶץ אֲשֶׁ֥ר תִּֽירָשֽׁוּ/ן־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/033.yaml
  text: You shall walk in all the way that Yahweh your God has commanded you[a], so that you may live, and that it may go well with you, and that you may prolong your days in the land that you will possess.
translation:
  language: id
  text: Kalian harus menempuh seluruh jalan yang telah diperintahkan Yahweh, Allah kalian, kepada kalian, supaya kalian hidup, supaya keadaan kalian baik, dan supaya kalian panjang umur di negeri yang akan kalian miliki[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “negeri yang akan kalian warisi.” Kata kerja Ibrani dapat mengandung arti memiliki maupun mewarisi.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכָל הַדֶּרֶךְ
  choice: menempuh seluruh jalan
  rationale: Mempertahankan bentuk tunggal dan metafora jalan sebagai pola hidup yang ditetapkan Allah, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: צִוָּה
  choice: yang diperintahkan ... kepadamu
  rationale: Menyatakan perintah yang telah diberikan dan tetap mengikat dalam konteks nasihat perjanjian.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Ungkapan perjanjian ini disajikan secara wajar dalam bahasa Indonesia; akhiran Ibrani menunjuk kepada umat secara jamak, sedangkan bentuk Indonesia dapat merujuk kepada kelompok yang disapa.
- source_word: תֵּלֵכוּ
  choice: Kamu harus menempuh
  rationale: Kata 'menempuh' mempertahankan gambaran berjalan di suatu jalan, sementara 'harus' menyampaikan daya tuntutan dari bentuk verbal dalam konteks hukum dan nasihat.
- source_word: לְמַעַן
  choice: supaya
  rationale: Mengungkapkan tujuan atau hasil yang dimaksud secara jelas dan alami.
- source_word: תִּחְיוּן
  choice: kamu hidup
  rationale: Terjemahan langsung yang sesuai dengan konteks berkat kehidupan.
- source_word: וְטוֹב לָכֶם
  choice: supaya keadaanmu baik
  rationale: Menyampaikan makna kesejahteraan atau keadaan yang baik tanpa mempersempitnya menjadi kemakmuran materi.
- source_word: וְהַאֲרַכְתֶּם יָמִים
  choice: supaya kamu berumur panjang
  rationale: Padanan idiomatis bahasa Indonesia untuk ungkapan Ibrani 'memanjangkan hari-hari', dengan makna umur panjang tetap terjaga.
- source_word: בָּאָרֶץ
  choice: di negeri
  rationale: Dalam konteks wilayah perjanjian yang akan didiami Israel, 'negeri' merupakan padanan Indonesia yang alami.
- source_word: תִּירָשׁוּן
  choice: yang akan kamu miliki
  rationale: Kata kerja ירשׁ di sini menunjuk pada memperoleh dan menguasai negeri; 'miliki' mempertahankan arti kepemilikan tanpa meniadakan kemungkinan nuansa warisan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama perjanjian ilahi secara langsung; transliterasi mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Bahasa kepemilikan negeri
  choice: negeri yang akan kamu miliki
  alternative: negeri yang akan kamu warisi
  rationale: Kata ירשׁ dapat menyatakan memiliki, mengambil alih, atau mewarisi. Teks utama memakai makna kepemilikan wilayah, sementara nuansa warisan dicatat tanpa menghapus ambiguitas leksikal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora jalan dipertahankan melalui 'menempuh seluruh jalan'; pengulangan 'supaya' memperjelas rangkaian tujuan atau hasil. Penanda catatan kaki ditempatkan sesudah frasa yang benar-benar dijelaskannya.
