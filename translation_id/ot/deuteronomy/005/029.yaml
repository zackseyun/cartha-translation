language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: מִֽי יִתֵּ֡ן וְ/הָיָה֩ לְבָבָ֨/ם זֶ֜ה לָ/הֶ֗ם לְ/יִרְאָ֥ה אֹתִ֛/י וְ/לִ/שְׁמֹ֥ר אֶת כָּל מִצְוֺתַ֖/י כָּל הַ/יָּמִ֑ים לְמַ֨עַן יִיטַ֥ב לָ/הֶ֛ם וְ/לִ/בְנֵי/הֶ֖ם לְ/עֹלָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/029.yaml
  text: Oh[a], that they had such a heart as this always—to fear me and to keep all my commandments all their days—so that it might go well with them and with their children forever!
translation:
  language: id
  text: Ah, seandainya mereka memiliki hati seperti ini, sehingga mereka takut kepada-Ku dan menaati segala perintah-Ku sepanjang hidup mereka, supaya mereka dan anak-anak mereka sejahtera untuk selama-lamanya!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: Ah, seandainya
  rationale: Ungkapan harapan atau kerinduan, bukan pertanyaan harfiah tentang siapa yang akan memberi. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan daya emosionalnya.
- source_word: וְהָיָה לְבָבָם זֶה לָהֶם
  choice: hati mereka selalu demikian
  rationale: Merangkum konstruksi kepemilikan secara idiomatis, sementara 'demikian' mempertahankan sifat kualitatif demonstratif זֶה.
- source_word: לְבָבָם
  choice: hati mereka
  rationale: '''Hati'' mempertahankan gambaran antropologis Ibrani tentang pusat kehendak, pikiran, dan watak batin.'
- source_word: לְיִרְאָה אֹתִי
  choice: takut kepada-Ku
  rationale: Mempertahankan istilah perjanjian yang mencakup rasa gentar, hormat, dan ketaatan kepada Allah tanpa mempersempitnya menjadi sekadar 'menghormati'.
- source_word: וְלִשְׁמֹר אֶת כָּל מִצְוֺתַי
  choice: dan menaati segala perintah-Ku
  rationale: Dalam hubungan dengan perintah, שׁמר berarti memelihara dengan menjalankannya. 'Menaati' paling jelas dan alami bagi pembaca Indonesia modern.
- source_word: כָּל הַיָּמִים
  choice: sepanjang hidup mereka
  rationale: Secara harfiah 'sepanjang hari-hari'; dalam konteks berarti selama seluruh masa hidup mereka.
- source_word: לְמַעַן יִיטַב לָהֶם
  choice: supaya mereka ... senantiasa sejahtera
  rationale: Menjaga hubungan tujuan/hasil dan menerjemahkan formula kesejahteraan secara alami tanpa membatasinya pada kemakmuran materi.
- source_word: וְלִבְנֵיהֶם
  choice: dan anak-anak mereka
  rationale: בנים di sini menunjuk keturunan secara umum, bukan hanya anak laki-laki.
- source_word: לְעֹלָם
  choice: senantiasa
  rationale: Dalam konteks kesejahteraan antargenerasi, menyatakan keberlangsungan yang tetap; 'senantiasa' alami dan tidak memaksakan pengertian metafisis yang tidak diperlukan.
theological_decisions:
- issue: Bahasa antropologis לְבָבָם
  choice: hati mereka
  alternative: batin mereka; pikiran mereka
  rationale: '''Hati'' menjaga kategori antropologis Alkitab dan tidak mereduksi sikap moral-rohani menjadi kegiatan kognitif saja.'
- issue: Makna takut kepada Allah dalam לְיִרְאָה אֹתִי
  choice: takut kepada-Ku
  alternative: menghormati Aku
  rationale: '''Takut'' mempertahankan ketegangan antara rasa gentar, hormat, dan ketaatan dalam relasi perjanjian; ''menghormati'' terlalu memperhalusnya.'
- issue: Cakupan וְלִבְנֵיהֶם
  choice: anak-anak mereka
  alternative: anak-anak lelaki mereka; keturunan mereka
  rationale: Bentuk maskulin berfungsi secara generik dalam konteks ini. 'Anak-anak' akurat terhadap cakupan dan tetap dekat dengan hubungan keluarga dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern, khidmat tetapi mudah dipahami. Seruan 'Ah, seandainya' menyampaikan kerinduan ilahi secara alami. Struktur kalimat dipertahankan sebagai satu seruan dengan alur harapan, isi ketaatan, lalu tujuannya.
