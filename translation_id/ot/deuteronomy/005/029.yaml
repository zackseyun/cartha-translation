  source_fidelity: Revisi diperlukan karena 'selalu' dalam 'hati mereka selalu demikian' memindahkan כָּל־הַיָּמִים dari tindakan takut dan menaati kepada keadaan hati. Dalam teks Ibrani, frasa itu mencakup takut kepada Allah dan memelihara seluruh perintah-Nya. לְעֹלָם lebih tepat dinyatakan secara eksplisit sebagai 'untuk selama-lamanya' daripada 'senantiasa'.
  naturalness: Susunan revisi tetap baku, khidmat, dan alami dalam bahasa Indonesia modern. 'Ah, seandainya' dengan baik menyampaikan idiom harapan מִי יִתֵּן tanpa menjadikannya pertanyaan.
  terminology: '''Hati'', ''takut kepada-Ku'', ''menaati segala perintah-Ku'', dan ''anak-anak mereka'' akurat serta sesuai register Alkitab. ''Menaati'' secara idiomatis menyampaikan שׁמר dalam kaitannya dengan perintah.'
