  timestamp: '2026-07-18T17:10:16Z'
review_pass:
  verdict: revise
  source_fidelity: 'Draf menyampaikan semua unsur utama ayat: perintah untuk menghormati kedua orang tua, dasar perintah dari Yahweh, serta dua tujuan berupa umur panjang dan kesejahteraan di tanah pemberian Allah. Namun, konstruksi pasif "tanah yang diberikan" kurang mempertahankan Yahweh sebagai pelaku eksplisit dan aspek partisipel sumber.'
  naturalness: Frasa "supaya panjang umurmu" tidak lazim dalam bahasa Indonesia baku; "supaya umurmu panjang" lebih alami. Susunan "seperti yang diperintahkan Yahweh, Allahmu, kepadamu" juga kurang luwes. "Supaya keadaanmu baik" dapat dipahami, tetapi "supaya engkau sejahtera" lebih idiomatis dan mencakup kesejahteraan yang dimaksud idiom Ibrani.
  terminology: '"Hormatilah," "ayahmu dan ibumu," "Yahweh," dan "Allahmu" tepat serta konsisten dengan sumber dan kebijakan nama ilahi. "Tanah" sesuai untuk אֲדָמָה dalam konteks wilayah yang diberikan.'
  issues:
  - severity: medium
    issue: Konstruksi tujuan pertama tidak idiomatis
    rationale: '"Supaya panjang umurmu" bukan susunan baku yang alami. Subjek dan predikat perlu ditata menjadi "supaya umurmu panjang," sambil tetap mempertahankan metafora sumber tentang hari/umur yang panjang.'
  - severity: low
    issue: Susunan klausa perintah Yahweh kurang alami
    rationale: Dalam bahasa Indonesia, "seperti yang Yahweh, Allahmu, perintahkan kepadamu" lebih jelas daripada pemisahan "diperintahkan Yahweh ... kepadamu."
  - severity: medium
    issue: Pelaku pemberian tanah dibuat kurang eksplisit
    rationale: 'Sumber memakai partisipel aktif dengan Yahweh sebagai subjek: "Yahweh, Allahmu, [yang] memberi/berikan kepadamu." Revisi mempertahankan Yahweh sebagai pelaku langsung, bukan hanya tersirat dalam bentuk pasif.'
  revised_text: Hormatilah ayahmu dan ibumu, seperti yang Yahweh, Allahmu, perintahkan kepadamu, supaya umurmu panjang dan supaya engkau sejahtera di tanah yang Yahweh, Allahmu, berikan kepadamu.
