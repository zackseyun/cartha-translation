  text: כַּבֵּ֤ד אֶת אָבִ֨י/ךָ֙ וְ/אֶת אִמֶּ֔/ךָ כַּ/אֲשֶׁ֥ר צִוְּ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ לְמַ֣עַן יַאֲרִיכֻ֣/ן יָמֶ֗י/ךָ וּ/לְמַ֨עַן֙ יִ֣יטַב לָ֔/ךְ עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/016.yaml
  text: Honor your father and your mother[a], as Yahweh your God commanded you[b], so that your days may be long and so that it may go well for you on the land that Yahweh your God is giving you.
translation:
  language: id
  text: Hormatilah ayahmu dan ibumu, seperti yang Yahweh, Allahmu, perintahkan kepadamu, supaya umurmu panjang dan supaya engkau sejahtera di tanah yang Yahweh, Allahmu, berikan kepadamu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּבֵּד
  choice: Hormatilah
  rationale: Bentuk imperatif Piel dari כבד dalam hubungan keluarga berarti menghormati atau memperlakukan sebagai sosok yang berbobot. “Hormatilah” alami, tepat, dan mempertahankan daya etis perintah.
- source_word: אָבִיךָ ... אִמֶּךָ
  choice: ayahmu dan ibumu
  rationale: Pengulangan penanda objek אֶת pada kedua nomina memberi keseimbangan kepada ayah dan ibu; bentuk ini mempertahankan kesejajaran tersebut dalam bahasa Indonesia.
- source_word: כַּאֲשֶׁר צִוְּךָ
  choice: seperti yang diperintahkan ... kepadamu
  rationale: כַּאֲשֶׁר mengaitkan perintah ini dengan perintah ilahi sebelumnya. Susunan ini jelas dan wajar dalam bahasa Indonesia tanpa menambahkan nuansa yang tidak dinyatakan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks sumber tetap tampak.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk dengan sufiks orang kedua tunggal menyatakan hubungan posesif-perjanjian secara langsung.
- source_word: לְמַעַן
  choice: supaya
  rationale: לְמַעַן menandai tujuan atau hasil; “supaya” alami dalam bahasa Indonesia dan mempertahankan hubungan itu.
- source_word: יַאֲרִיכֻן יָמֶיךָ
  choice: panjang umurmu
  rationale: Ungkapan ini mempertahankan gagasan harfiah bahwa hari-hari menjadi panjang, tetapi menyatakannya dengan idiom bahasa Indonesia yang alami.
- source_word: וּלְמַעַן יִיטַב לָךְ
  choice: dan supaya keadaanmu baik
  rationale: Idiوم ייטב לך menyatakan kesejahteraan atau bahwa segala sesuatu berjalan baik bagi seseorang. “Keadaanmu baik” cukup luas untuk tidak mempersempitnya menjadi kemakmuran material semata.
- source_word: עַל הָאֲדָמָה
  choice: di tanah
  rationale: אֲדָמָה dalam konteks ini menunjuk pada wilayah yang Allah berikan, bukan sekadar tanah sebagai bahan. Bahasa Indonesia secara alami memakai “di” untuk keberadaan dalam wilayah tersebut.
- source_word: נֹתֵן לָךְ
  choice: diberikan ... kepadamu
  rationale: Partisipel Ibrani menggambarkan pemberian yang sedang berlangsung atau pasti. Bentuk pasif Indonesia ini alami dan tetap menunjukkan Yahweh sebagai pemberi tanpa memaksakan waktu yang terlalu sempit.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi secara langsung. “Yahweh” mempertahankan nama perjanjian itu dan mengikuti transliterasi yang ditetapkan.
- issue: Sifat janji yang menyertai penghormatan kepada orang tua
  choice: Mempertahankan janji umur panjang dan keadaan baik di tanah tanpa menjadikannya jaminan mutlak bagi setiap individu atau hanya prinsip kolektif
  alternative: Jaminan universal umur panjang bagi setiap individu; atau janji yang semata-mata nasional dan kolektif
  rationale: Bahasa Ibrani menyatakan janji perjanjian yang nyata, tetapi ayat ini sendiri tidak menyelesaikan hubungan antara dimensi individual dan kolektif. Terjemahan mempertahankan ketegangan itu.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Bentuk “ayahmu dan ibumu” mempertahankan keseimbangan sumber, sedangkan “di tanah” lebih alami daripada “di atas tanah” dalam konteks wilayah perjanjian.
