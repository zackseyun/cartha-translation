revisions:
- from: Hormatilah ayahmu dan ibumu, seperti yang diperintahkan Yahweh, Allahmu, kepadamu, supaya panjang umurmu dan supaya keadaanmu baik di tanah yang diberikan Yahweh, Allahmu, kepadamu.
  to: Hormatilah ayahmu dan ibumu, seperti yang Yahweh, Allahmu, perintahkan kepadamu, supaya umurmu panjang dan supaya engkau sejahtera di tanah yang Yahweh, Allahmu, berikan kepadamu.
  rationale: Revisi memperbaiki kelancaran dan tata bahasa Indonesia tanpa mengubah cakupan janji perjanjian dalam teks sumber. "Umurmu panjang" menyampaikan יַאֲרִיכֻן יָמֶיךָ secara idiomatis; "engkau sejahtera" mempertahankan keluasan יִיטַב לָךְ tanpa membatasi maknanya pada kemakmuran material. Bentuk aktif terakhir mempertahankan Yahweh sebagai pemberi tanah.
