reference: Deuteronomy 5:25
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּה֙ לָ֣/מָּה נָמ֔וּת כִּ֣י תֹֽאכְלֵ֔/נוּ הָ/אֵ֥שׁ הַ/גְּדֹלָ֖ה הַ/זֹּ֑את אִם יֹסְפִ֣ים אֲנַ֗חְנוּ לִ֠/שְׁמֹעַ אֶת ק֨וֹל יְהוָ֧ה אֱלֹהֵ֛י/נוּ ע֖וֹד וָ/מָֽתְנוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/025.yaml
  text: And now[a], why should we die? For this great fire will consume us. If we continue to hear the voice of Yahweh our God any longer, we will die.
translation:
  language: id
  text: Dan sekarang, mengapa kami harus mati? Sebab api besar ini akan menghanguskan kami. Jika kami terus mendengar suara Yahweh[a], Allah kami, lebih lama lagi, kami akan mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH, nama ilahi yang di sini ditulis “Yahweh”. Sebagian terjemahan memakai “TUHAN”.'
    reason: Menjelaskan bentuk nama ilahi dan padanan tradisionalnya.
lexical_decisions:
- source_word: וְעַתָּה
  choice: Dan sekarang
  rationale: Mempertahankan daya penghubung וְ sekaligus penanda waktu עַתָּה, yang memperkenalkan kesimpulan langsung umat setelah pengalaman teofani.
- source_word: לָמָּה נָמוּת
  choice: mengapa kami harus mati?
  rationale: Pertanyaan retoris ini mengungkapkan akibat yang mereka takutkan; kata 'harus' menyampaikan nuansa prospektif-deliberatif tanpa menjadikannya pernyataan masa depan yang datar.
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan bagi pertanyaan sebelumnya secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: תֹאכְלֵנוּ
  choice: akan menghanguskan kami
  rationale: Secara harfiah verba ini berarti 'memakan', tetapi dengan api sebagai subjek, 'menghanguskan' menyampaikan gambaran penghancuran secara idiomatis tanpa kehilangan kekuatannya.
- source_word: הָאֵשׁ הַגְּדֹלָה הַזֹּאת
  choice: api besar ini
  rationale: Mengikuti susunan frasa nominal Indonesia yang alami sambil mempertahankan nomina, adjektiva, dan demonstrativa Ibrani.
- source_word: אִם יֹסְפִים אֲנַחְנוּ לִשְׁמֹעַ
  choice: Jika kami terus mendengar
  rationale: Konstruksi יסף dengan infinitif berarti meneruskan atau melakukan lagi; 'terus mendengar' jelas dan alami dalam konteks ini.
- source_word: קוֹל
  choice: suara
  rationale: Dalam konteks perkataan ilahi, 'suara' lebih tepat daripada 'bunyi'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֵינוּ
  choice: Allah kami
  rationale: Mempertahankan konstruksi posesif dan bahasa hubungan perjanjian dalam bentuk Indonesia yang wajar.
- source_word: עוֹד וָמָתְנוּ
  choice: kami akan mati
  rationale: Dalam klausa bersyarat ini, עוֹד menyatakan kelanjutan yang sudah tercakup oleh 'terus', sedangkan akibat akhirnya dinyatakan secara alami sebagai 'kami akan mati'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama tersebut dan menghindari penggantiannya secara diam-diam dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Struktur sebab-akibat serta pertanyaan retoris sumber dipertahankan; pengulangan gagasan kelanjutan tidak dibuat kaku.
