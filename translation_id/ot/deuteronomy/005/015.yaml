  text: וְ/זָכַרְתָּ֗ כִּ֣י עֶ֤בֶד הָיִ֨יתָ֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם וַ/יֹּצִ֨אֲ/ךָ֜ יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מִ/שָּׁ֔ם בְּ/יָ֥ד חֲזָקָ֖ה וּ/בִ/זְרֹ֣עַ נְטוּיָ֑ה עַל כֵּ֗ן צִוְּ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לַ/עֲשׂ֖וֹת אֶת י֥וֹם הַ/שַׁבָּֽת־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/015.yaml
  text: And remember that you were a servant in the land of Egypt[a], and Yahweh your God brought you out from there with a strong hand and an outstretched arm[b]; therefore Yahweh your God commanded you to observe the Sabbath day.
translation:
  language: id
  text: Ingatlah bahwa engkau dahulu seorang budak di tanah Mesir, dan Yahweh, Allahmu, membawa engkau keluar dari sana dengan tangan yang kuat[a] dan lengan yang terentang. Oleh sebab itu, Yahweh, Allahmu, memerintahkan engkau untuk memelihara hari Sabat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan tangan yang perkasa.” Ungkapan Ibrani ini menekankan tindakan pembebasan Yahweh yang penuh kuasa.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “melakukan hari Sabat”; ungkapan Ibrani ini berarti menjalankan atau memeliharanya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Ingatlah
  rationale: Bentuk ini menyampaikan daya perintah dalam konteks sekaligus mengaitkan ayat dengan perintah sebelumnya secara wajar dalam bahasa Indonesia.
- source_word: עֶבֶד
  choice: budak
  rationale: Konteks Mesir menunjuk pada keadaan perbudakan, bukan sekadar pelayanan sukarela; 'budak' mempertahankan beratnya keadaan tersebut.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: di tanah Mesir
  rationale: Mempertahankan ungkapan konkret bahasa Ibrani dengan bentuk yang alami dan lazim dalam ragam Alkitab Indonesia.
- source_word: וַיֹּצִאֲךָ
  choice: membawa engkau keluar
  rationale: Menyatakan bentuk kausatif יצא secara jelas dan mempertahankan gambaran eksodus dari Mesir.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang hadir langsung dalam teks sumber tanpa menggantinya dengan gelar.
- source_word: בְּיָד חֲזָקָה
  choice: dengan tangan yang kuat
  rationale: Terjemahan langsung yang tetap dapat dipahami sebagai ungkapan kuasa Allah; alternatif idiomatis dijelaskan dalam catatan kaki.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: dan lengan yang teracung
  rationale: Mempertahankan gambaran lengan yang direntangkan untuk bertindak dengan kuasa; preposisi 'dengan' secara alami berlaku untuk kedua unsur yang sejajar.
- source_word: עַל כֵּן
  choice: Oleh sebab itu
  rationale: Menandai hubungan kesimpulan antara pembebasan dari perbudakan dan perintah Sabat.
- source_word: לַעֲשׂוֹת אֶת יוֹם הַשַׁבָּת
  choice: untuk memelihara hari Sabat
  rationale: '''Memelihara'' mengungkapkan makna idiomatis menjalankan atau menaati ketentuan hari Sabat tanpa menerjemahkan עשה secara kaku sebagai ''membuat''.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian secara langsung; bentuk 'Yahweh' mempertahankan nama itu dan membedakannya dari gelar.
- issue: Status Israel di Mesir dalam kata עֶבֶד
  choice: budak
  alternative: hamba
  rationale: Dalam konteks penindasan dan pembebasan dari Mesir, 'budak' lebih jelas menyatakan status terikat yang menjadi dasar etis perintah Sabat.
- issue: Makna לַעֲשׂוֹת mengenai hari Sabat
  choice: memelihara hari Sabat
  alternative: menjalankan hari Sabat
  rationale: Ungkapan sumber secara harfiah berarti 'melakukan hari Sabat', tetapi secara idiomatis menunjuk pada menaati atau merayakannya. 'Memelihara' mempertahankan register yang bermartabat tanpa menentukan rincian pelaksanaan yang tidak disebutkan ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal 'engkau' untuk mempertahankan bentuk orang kedua tunggal dalam teks Ibrani. Susunan kalimat dibuat khidmat tetapi tetap mudah dipahami; pengulangan 'Yahweh, Allahmu' dipertahankan karena merupakan penekanan penting dalam sumber.
