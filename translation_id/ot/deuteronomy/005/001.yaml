revisions:
- from: Lalu Musa memanggil seluruh Israel dan berkata kepada mereka, “Dengarlah, hai Israel, ketetapan dan peraturan yang kusampaikan kepadamu pada hari ini. Pelajarilah semuanya dan lakukanlah dengan setia.[a]”
  to: Lalu Musa memanggil seluruh Israel dan berkata kepada mereka, “Dengarlah, hai Israel, ketetapan dan peraturan yang sedang kusampaikan kepadamu hari ini. Pelajarilah semuanya itu, taatilah, dan lakukanlah.”
  rationale: Revisi memulihkan tiga unsur perintah pada penutup ayat—belajar, menjaga/menaati, dan melakukan—tanpa menambahkan gagasan “dengan setia” yang tidak eksplisit dalam bahasa Ibrani. “Taatilah” adalah padanan Indonesia yang alami dalam konteks ketetapan hukum untuk שׁמר, sementara “lakukanlah” mempertahankan penekanan final לַעֲשֹׂתָם. Catatan kaki dihapus karena hanya diperlukan untuk menutup kekurangan dalam teks utama dan tidak lagi menambahkan informasi tekstual yang penting.
