  text: וַ/יִּקְרָ֣א מֹשֶׁה֮ אֶל כָּל יִשְׂרָאֵל֒ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם שְׁמַ֤ע יִשְׂרָאֵל֙ אֶת הַ/חֻקִּ֣ים וְ/אֶת הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֧ר אָנֹכִ֛י דֹּבֵ֥ר בְּ/אָזְנֵי/כֶ֖ם הַ/יּ֑וֹם וּ/לְמַדְתֶּ֣ם אֹתָ֔/ם וּ/שְׁמַרְתֶּ֖ם לַ/עֲשֹׂתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/001.yaml
  text: And Moses called all Israel and said to them[a], “Hear, Israel, the statutes and the judgments that I am speaking in your hearing today; learn them and keep them[b], to do them.”
translation:
  language: id
  text: Lalu Musa memanggil seluruh Israel dan berkata kepada mereka, “Dengarlah, hai Israel, ketetapan dan peraturan yang sedang kusampaikan kepadamu hari ini. Pelajarilah semuanya itu, taatilah, dan lakukanlah.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: memanggil
  rationale: Dalam konteks naratif ini, קרא berarti memanggil atau menghimpun orang untuk mendengarkan; ‘memanggil’ alami dan tidak mempersempitnya menjadi pemanggilan resmi.
- source_word: כָּל יִשְׂרָאֵל
  choice: seluruh Israel
  rationale: Mempertahankan sebutan kolektif bagi umat Israel sebagai satu kesatuan.
- source_word: שְׁמַע יִשְׂרָאֵל
  choice: Dengarlah, hai Israel
  rationale: שׁמע menuntut perhatian yang mengarah pada ketaatan; ‘dengarlah’ mempertahankan gema seruan perjanjian, sedangkan ‘hai’ membuat sapaan langsung alami dalam bahasa Indonesia.
- source_word: הַחֻקִּים
  choice: ketetapan
  rationale: חקים menunjuk pada ketentuan yang telah ditetapkan dan mempertahankan laras hukum-perjanjian.
- source_word: הַמִּשְׁפָּטִים
  choice: peraturan
  rationale: משפטים di sini menunjuk pada norma atau keputusan hukum; ‘peraturan’ jelas bagi pembaca modern sekaligus membedakannya dari ‘ketetapan’.
- source_word: דֹּבֵר בְּאָזְנֵיכֶם הַיּוֹם
  choice: kusampaikan kepadamu pada hari ini
  rationale: Ungkapan harfiah ‘berbicara di telingamu’ merupakan idiom untuk penyampaian langsung yang dapat didengar; ‘kusampaikan kepadamu’ mengungkapkan maknanya secara alami.
- source_word: וּלְמַדְתֶּם אֹתָם
  choice: Pelajarilah semuanya
  rationale: למד memerintahkan Israel untuk mempelajari dan menguasai ketentuan tersebut; ‘semuanya’ memiliki anteseden yang jelas dalam bahasa Indonesia.
- source_word: וּשְׁמַרְתֶּם לַעֲשֹׂתָם
  choice: lakukanlah dengan setia
  rationale: Rangkaian ‘menjaga untuk melakukan’ menyatakan ketaatan yang teliti dan nyata. Ungkapan ini menghindari konstruksi Indonesia yang kaku tanpa menghilangkan unsur kesungguhan dari שׁמר.
theological_decisions:
- issue: Pembedaan pasangan istilah hukum חקים / משפטים
  choice: ketetapan dan peraturan
  alternative: ketetapan dan keputusan hukum
  rationale: Kedua istilah dipertahankan sebagai dua kategori yang berkaitan namun berbeda, tanpa memasukkan klasifikasi teologis yang tidak dinyatakan teks.
- issue: Daya tuntut שׁמע dalam seruan perjanjian
  choice: Dengarlah, hai Israel
  alternative: Perhatikanlah, hai Israel
  rationale: ‘Dengarlah’ mempertahankan citra mendengar dan bobot sastra seruan tersebut; konteks serta perintah berikutnya menunjukkan bahwa yang dituntut bukan sekadar penerimaan bunyi, melainkan perhatian yang menghasilkan ketaatan.
- issue: Hubungan וּשְׁמַרְתֶּם dengan לַעֲשֹׂתָם
  choice: lakukanlah dengan setia
  alternative: peliharalah semuanya untuk melakukannya
  rationale: Terjemahan pilihan menyampaikan tujuan praktis dan ketekunan dalam menaati hukum secara alami, sementara catatan kaki mencatat bentuk Ibrani yang lebih harfiah.
translation_notes:
  register: Bahasa Indonesia baku modern dengan laras khidmat tetapi mudah dipahami. Bentuk terikat ‘kusampaikan’ menjaga kelancaran ucapan langsung. Penanda catatan kaki [a] ditempatkan tepat setelah klausa yang dijelaskannya.
