base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/011.yaml
  text: You shall not take the name of Yahweh your God in vain[b][a], for Yahweh will not leave unpunished the one who takes his name in vain.
translation:
  language: id
  text: Jangan menggunakan nama Yahweh, Allahmu, secara sia-sia[a], sebab Yahweh tidak akan membiarkan orang yang menggunakan nama-Nya secara sia-sia bebas dari hukuman[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk kepalsuan”, “secara tidak patut”, atau “untuk hal yang kosong”. Kata Ibrani ini dapat mencakup penggunaan nama Yahweh secara palsu maupun kosong, bukan hanya satu jenis penyalahgunaan tertentu.
    reason: lexical_alternative
  - marker: b
    text: Atau “tidak akan menganggapnya tidak bersalah” atau “tidak akan membebaskannya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשָּׂא / יִשָּׂא (נשא)
  choice: menggunakan
  rationale: Secara harfiah verba ini dapat berarti ‘mengangkat’, ‘membawa’, atau ‘menanggung’. Dalam konstruksi dengan ‘nama’, ‘menggunakan’ menghasilkan bahasa Indonesia yang alami tanpa membatasi larangan hanya pada pengucapan atau sumpah palsu.
- source_word: שֵׁם
  choice: nama
  rationale: Padanan langsung yang mempertahankan istilah sumber; dalam konteks Ibrani, nama juga dapat berkaitan dengan identitas, kewibawaan, dan reputasi, tetapi nuansa itu tidak dimasukkan ke dalam parafrasa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Mempertahankan sapaan perjanjian dalam bentuk orang kedua tunggal secara ringkas dan alami.
- source_word: לַשָּׁוְא
  choice: untuk hal yang sia-sia
  rationale: שָׁוְא mencakup kesia-siaan, kehampaan, kepalsuan, atau sesuatu yang tidak bernilai. Ungkapan ini cukup luas untuk tidak membatasi larangan pada satu bentuk penyalahgunaan saja.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi larangan dengan hubungan sebab yang jelas.
- source_word: יְנַקֶּה (נקה)
  choice: tidak akan membebaskan dari hukuman
  rationale: Bentuk piel di sini menyampaikan gagasan tidak membiarkan bebas dari kesalahan atau akibat hukuman. Pilihan ini jelas dalam bahasa Indonesia modern dan mempertahankan daya yudisialnya.
- source_word: אֲשֶׁר
  choice: orang yang
  rationale: Menyatakan pelaku secara umum dengan konstruksi Indonesia yang wajar.
- source_word: שְׁמוֹ
  choice: nama-Nya
  rationale: Merujuk kembali kepada nama Yahweh; kapitalisasi pronomina mengikuti register religius Indonesia yang lazim.
theological_decisions:
- issue: Penerjemahan nama ilahi YHWH
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks sumber memakai Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama perjanjian itu dan tidak menggantinya dengan sebuah gelar.
- issue: Cakupan larangan
  choice: menggunakan nama ... untuk hal yang sia-sia
  alternative: menyebut nama ... dengan sembarangan; membawa nama ... untuk kepalsuan; menyalahgunakan nama
  rationale: Bahasa Ibrani dapat mencakup pemakaian palsu, kosong, atau tidak patut, termasuk tetapi tidak terbatas pada sumpah palsu. Rumusan utama dibiarkan cukup luas, sedangkan ragam maknanya dijelaskan dalam catatan kaki.
- issue: Daya yudisial נקה
  choice: tidak akan membebaskan dari hukuman
  alternative: tidak akan menganggap tidak bersalah; tidak akan membebaskan dari kesalahan
  rationale: Pilihan utama menyatakan bahwa pelaku tidak akan dibiarkan bebas dari konsekuensi, tanpa menentukan bentuk hukumannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk larangan dibuat langsung dan mudah dipahami. Rumusan ‘menggunakan nama’ dipilih daripada terjemahan harfiah ‘mengangkat/membawa nama’ agar idiomnya alami, tetapi keluasan makna לַשָּׁוְא tetap dipertahankan melalui teks utama dan catatan kaki.
