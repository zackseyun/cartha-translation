  text: וְ/לֹ֥א תַחְמֹ֖ד אֵ֣שֶׁת רֵעֶ֑/ךָ וְ/לֹ֨א תִתְאַוֶּ֜ה בֵּ֣ית רֵעֶ֗/ךָ שָׂדֵ֜/הוּ וְ/עַבְדּ֤/וֹ וַ/אֲמָת/וֹ֙ שׁוֹר֣/וֹ וַ/חֲמֹר֔/וֹ וְ/כֹ֖ל אֲשֶׁ֥ר לְ/רֵעֶֽ/ךָס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/021.yaml
  text: And you shall not covet your neighbor’s wife[a], and you shall not desire your neighbor’s house, his field, his male servant, his female servant, his ox, his donkey[b], or anything that belongs to your neighbor.
translation:
  language: id
  text: Jangan mengingini istri sesamamu, dan jangan menginginkan rumah sesamamu[a], ladangnya, budak laki-lakinya, budak perempuannya, lembunya, keledainya, ataupun apa pun yang menjadi milik sesamamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “rumah” juga dapat berarti “rumah tangga” atau keseluruhan harta keluarga.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַחְמֹד
  choice: mengingini
  rationale: Dalam larangan ini, חמד menunjuk pada keinginan yang tertuju kepada milik orang lain dan karena itu bernilai salah. “Mengingini” alami dalam bahasa Indonesia serta mempertahankan daya etis perintah tersebut.
- source_word: אֵשֶׁת רֵעֶךָ
  choice: istri sesamamu
  rationale: Frasa konstruksi ini secara langsung berarti istri dari sesama; bentuk ini ringkas dan alami dalam bahasa Indonesia.
- source_word: תִתְאַוֶּה
  choice: menghasratkan
  rationale: Bentuk hitpael dari אוה berdekatan makna dengan חמד, tetapi merupakan verba yang berbeda. “Menghasratkan” mempertahankan variasi leksikal dan menyatakan hasrat yang diarahkan kepada kepunyaan sesama.
- source_word: בֵּית רֵעֶךָ
  choice: rumah sesamamu
  rationale: בַּיִת dapat berarti bangunan rumah, rumah tangga, atau harta keluarga. Daftar milik yang menyusul mendukung arti rumah atau keseluruhan harta milik, tanpa menutup ambiguitas tersebut.
- source_word: שָׂדֵהוּ
  choice: ladangnya
  rationale: שָׂדֶה paling langsung berarti ladang dan disebut secara eksplisit dalam bentuk perintah di Ulangan.
- source_word: עַבְדּוֹ
  choice: budak laki-lakinya
  rationale: Dalam konteks daftar milik rumah tangga, status keterikatan atau kepemilikan orang tersebut menonjol. “Budak laki-laki” menyatakannya secara terbuka dan mempertahankan pembedaan gender.
- source_word: אֲמָתוֹ
  choice: budak perempuannya
  rationale: אָמָה menunjuk kepada budak perempuan. Pilihan ini jelas bagi pembaca modern dan berpasangan dengan “budak laki-laki”.
- source_word: שׁוֹרוֹ
  choice: lembunya
  rationale: שׁוֹר menunjuk pada hewan jenis sapi, khususnya yang digunakan sebagai ternak atau hewan kerja. “Lembu” merupakan padanan Indonesia yang ringkas dan sesuai dengan konteks hukum kuno.
- source_word: חֲמֹרוֹ
  choice: keledainya
  rationale: “Keledai” adalah padanan modern yang langsung dan umum bagi חֲמוֹר.
- source_word: וְכֹל אֲשֶׁר לְרֵעֶךָ
  choice: ataupun apa pun yang menjadi milik sesamamu
  rationale: Ungkapan ini merangkum larangan secara menyeluruh; “menjadi milik” membuat hubungan kepunyaan eksplisit dalam bahasa Indonesia yang alami.
- source_word: רֵעֶךָ
  choice: sesamamu
  rationale: רֵעַ menunjuk kepada orang lain dalam hubungan sosial komunitas. “Sesama” mapan dalam bahasa Indonesia dan lebih tepat daripada membatasinya pada orang yang tinggal berdekatan.
theological_decisions:
- issue: Pembedaan dua verba larangan dalam perintah ini
  choice: Menerjemahkan חמד sebagai “mengingini” dan אוה sebagai “menghasratkan”
  alternative: Menerjemahkan keduanya dengan “mengingini” demi kesederhanaan atau keakraban tradisional
  rationale: Teks Ibrani memakai dua verba yang berdekatan tetapi berbeda. Mempertahankan pembedaan itu mencerminkan susunan retoris Ulangan dan tidak meratakan nuansa sumber.
- issue: Penerjemahan istilah perbudakan
  choice: Menggunakan “budak laki-laki” dan “budak perempuan”
  alternative: Menggunakan “hamba laki-laki” dan “hamba perempuan” atau “pelayan”
  rationale: Konteks daftar kepunyaan rumah tangga membuat status keterikatan mereka menonjol. “Budak” menyampaikan kenyataan sosial teks secara lugas tanpa memperhalusnya, sedangkan penanda gender mempertahankan pasangan istilah Ibrani.
- issue: Cakupan בֵּית dalam daftar milik
  choice: Memakai “rumah” dalam teks dan mencatat kemungkinan arti lebih luas
  alternative: Menerjemahkan langsung sebagai “rumah tangga” atau “harta keluarga”
  rationale: “Rumah” adalah arti konkret yang wajar, tetapi kata Ibrani juga dapat mencakup rumah tangga atau harta keluarga. Catatan mempertahankan keluasan semantis tanpa menentukan satu tafsiran secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur larangan dipertahankan, dengan dua verba berbeda untuk mencerminkan teks Ibrani. Tanda pisah memperjelas bahwa unsur-unsur berikutnya menguraikan kepunyaan sesama. Istilah “budak” dipakai secara lugas sesuai konteks sosial-ekonomi teks.
