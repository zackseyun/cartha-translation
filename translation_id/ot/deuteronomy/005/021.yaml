  terminology: “Istri sesamamu,” “rumah sesamamu,” “ladangnya,” “budak laki-lakinya,” “budak perempuannya,” “lembunya,” dan “keledainya” sesuai dengan konteks serta register modern. Catatan tentang kemungkinan cakupan “rumah” sah, tetapi penandanya harus ditempatkan langsung pada kata yang dijelaskan.
