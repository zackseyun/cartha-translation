  yaml_path: translation/ot/deuteronomy/005/030.yaml
  text: Go[a], say to them, ‘Return to your tents.’
translation:
  language: id
  text: Pergilah, katakan kepada mereka, ‘Kembalilah ke kemah kalian masing-masing.’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ
  choice: Pergilah
  rationale: Bentuk imperatif tunggal dari הלך memberi perintah langsung kepada Musa untuk pergi; ‘Pergilah’ alami dan tetap mempertahankan bentuk perintah.
- source_word: אֱמֹר
  choice: katakan
  rationale: Bentuk imperatif dari אמר memperkenalkan isi pesan yang harus disampaikan. ‘Katakan’ merupakan padanan langsung dan wajar dalam bahasa Indonesia.
- source_word: לָהֶם
  choice: kepada mereka
  rationale: Preposisi ל dengan sufiks orang ketiga jamak maskulin menandai pihak yang menerima perkataan.
- source_word: שׁוּבוּ
  choice: Kembalilah
  rationale: Bentuk imperatif jamak dari שוב menyatakan gerak kembali ke tempat semula setelah umat menghadap TUHAN; ‘Kembalilah’ ringkas dan tepat.
- source_word: לָכֶם
  choice: masing-masing
  rationale: Dalam gabungan שׁוּבוּ לָכֶם לְאָהֳלֵיכֶם, pronomina jamak menegaskan kembalinya para pendengar ke tempat mereka sendiri. ‘Masing-masing’ mengungkapkan fungsi idiomatis ini secara alami tanpa padanan datif yang kaku.
- source_word: לְאָהֳלֵיכֶם
  choice: ke kemahmu
  rationale: Kata ini secara harfiah berarti ‘ke kemah-kemah kalian’. ‘Kemah’ mempertahankan latar konkret Israel, sedangkan bentuk ‘-mu’ dapat merujuk kepada kelompok yang disapa dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Konjungsi ‘dan’ membuat rangkaian dua imperatif Ibrani terdengar alami. Ungkapan ‘kemahmu masing-masing’ menyampaikan kepemilikan distributif dalam sapaan jamak tanpa bentuk yang kaku.
