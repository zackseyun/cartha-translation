source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע יְהוָה֙ אֶת ק֣וֹל דִּבְרֵי/כֶ֔ם בְּ/דַבֶּרְ/כֶ֖ם אֵלָ֑/י וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י שָׁ֠מַעְתִּי אֶת ק֨וֹל דִּבְרֵ֜י הָ/עָ֤ם הַ/זֶּה֙ אֲשֶׁ֣ר דִּבְּר֣וּ אֵלֶ֔י/ךָ הֵיטִ֖יבוּ כָּל אֲשֶׁ֥ר דִּבֵּֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/028.yaml
  text: And Yahweh heard the sound of your words when you spoke to me[a], and Yahweh said to me, “I have heard the sound of the words of this people, which they have spoken to you[b]; they have spoken well in all that they have said.”
translation:
  language: id
  text: Yahweh mendengar perkataan kalian ketika kalian berbicara kepadaku.[a] Lalu Yahweh berfirman kepadaku, “Aku telah mendengar perkataan bangsa ini yang mereka sampaikan kepadamu. Mereka telah berkata dengan baik dalam segala yang mereka katakan.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “suara perkataan kalian.” Ungkapan Ibrani yang sama juga muncul dalam kalimat berikutnya.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “Mereka telah berbuat baik dalam semua yang mereka katakan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi secara langsung dan mempertahankan fungsi nama perjanjian dalam teks Ibrani.
- source_word: וַיִּשְׁמַע / שָׁמַעְתִּי
  choice: mendengar / telah mendengar
  rationale: Kata kerja שׁמע di sini menunjuk pada tindakan mendengar ucapan; bentuk kedua diterjemahkan dengan aspek selesai yang tetap relevan dalam tuturan langsung.
- source_word: קוֹל דִּבְרֵיכֶם / קוֹל דִּבְרֵי
  choice: perkataan kalian / perkataan
  rationale: Ungkapan harfiah 'suara perkataan' terasa janggal dalam bahasa Indonesia. 'Mendengar perkataan' menyampaikan makna auditori secara alami, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: בְּדַבֶּרְכֶם אֵלַי
  choice: ketika kalian berbicara kepadaku
  rationale: Preposisi ב dengan infinitif menyatakan tindakan yang berlangsung pada saat yang sama; 'ketika' menyampaikan hubungan waktunya secara alami.
- source_word: הָעָם הַזֶּה
  choice: bangsa ini
  rationale: עָם adalah kelompok kolektif yang di sini merujuk kepada Israel; 'bangsa ini' alami dan tetap dekat dengan bentuk tunggal Ibrani.
- source_word: אֲשֶׁר דִּבְּרוּ אֵלֶיךָ
  choice: yang mereka sampaikan kepadamu
  rationale: '''Sampaikan'' mengungkapkan bahwa perkataan bangsa itu ditujukan kepada Musa tanpa pengulangan kata ''berbicara'' yang kaku.'
- source_word: הֵיטִיבוּ כָּל אֲשֶׁר דִּבֵּרוּ
  choice: Semua yang mereka katakan itu baik
  rationale: Dalam konteks ini הֵיטִיבוּ menilai baik atau tepatnya seluruh ucapan mereka. Susunan ini alami dalam bahasa Indonesia, sambil mempertahankan kemungkinan arti yang lebih harfiah dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks sumber memakai Tetragramaton sebagai nama ilahi. 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Sifat persetujuan ilahi terhadap perkataan bangsa itu
  choice: Semua yang mereka katakan itu baik
  alternative: Mereka telah berbuat baik dalam semua yang mereka katakan
  rationale: Terjemahan utama mengaitkan penilaian itu dengan isi ucapan, sesuai konteks langsung, tetapi catatan kaki mempertahankan kemungkinan bahwa bentuk הֵיטִיבוּ menilai tindakan mereka ketika berkata demikian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang lugas dan bermartabat. Kata ganti jamak 'kalian' membedakan bangsa yang diajak bicara dari Musa sebagai orang pertama tunggal; 'berfirman' dipakai secara idiomatis untuk tuturan Allah.
