lexical_decisions:
- source_word: לֹא
  choice: Jangan
  rationale: Partikel negasi לֹא dengan bentuk verba orang kedua menyatakan larangan tegas; dalam bahasa Indonesia modern, “Jangan” merupakan padanan langsung dan alami.
- source_word: תִּרְצָח
  choice: membunuh
  rationale: Verba רָצַח menunjuk terutama pada pembunuhan manusia yang melawan hukum atau bersalah. Dalam rumusan singkat hukum ini, “membunuh” mempertahankan bentuk tradisional yang lugas, sementara catatan kaki memperjelas bahwa yang dimaksud bukan segala tindakan membunuh tanpa pembedaan.
theological_decisions:
- issue: Cakupan larangan dalam perintah ini
  choice: Teks utama memakai “Jangan membunuh,” dengan penjelasan bahwa verba Ibraninya terutama menunjuk pada pembunuhan manusia yang melawan hukum atau bersalah.
  alternative: Jangan melakukan pembunuhan.
  rationale: Bahasa Ibrani memakai רָצַח, bukan verba umum untuk segala jenis tindakan membunuh. Namun, padanan Indonesia “pembunuhan” dapat terdengar janggal atau berpotensi mempersempit makna secara yuridis modern; karena itu, bentuk alami “membunuh” dipertahankan dan cakupan leksikalnya dijelaskan dalam catatan kaki.
translation_notes:
  register: Rumusan sangat ringkas, tegas, dan bermartabat, sesuai gaya perintah dalam Dasa Titah. Bahasa Indonesia yang dipakai modern dan mudah dipahami; penanda [a] dicantumkan dalam teks utama.
