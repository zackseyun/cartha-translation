  text: Jangan melakukan pembunuhan[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jangan membunuh.” Kata kerja Ibrani di sini terutama merujuk pada pembunuhan manusia yang tidak sah, bukan pada segala tindakan membunuh tanpa pembedaan.
