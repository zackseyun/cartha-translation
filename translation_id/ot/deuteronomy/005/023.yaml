base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/005/023.yaml
  text: And when you heard the voice from the midst of the darkness[a], while the mountain was burning with fire, you came near to me—all the heads of your tribes and your elders—
translation:
  language: id
  text: Ketika kamu mendengar suara itu dari tengah kegelapan[a], sementara gunung itu sedang menyala dengan api, kamu mendekati aku—semua kepala suku kalian dan para tetua kalian—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bunyi itu”. Kata Ibrani qol dapat berarti “suara” atau “bunyi”; dalam konteks ini, “suara” paling sesuai karena Allah sedang berbicara dari dalam kegelapan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּשָׁמְעֲכֶם
  choice: Ketika kamu mendengar
  rationale: Konstruksi ini memperkenalkan keadaan waktu bagi peristiwa berikutnya. Dalam bahasa Indonesia, “Ketika kamu mendengar” menyampaikan urutan naratif secara alami tanpa ungkapan kaku “terjadilah ketika”.
- source_word: הַקּוֹל
  choice: suara itu
  rationale: קוֹל dapat berarti “suara” atau “bunyi”. Konteks Horeb adalah Allah berbicara, sehingga “suara” paling sesuai, sedangkan alternatif leksikalnya dipertahankan dalam catatan kaki.
- source_word: מִתּוֹךְ הַחֹשֶׁךְ
  choice: dari tengah-tengah kegelapan
  rationale: Terjemahan ini mempertahankan gambaran תּוֹךְ, yaitu bagian tengah atau lingkungan di dalam kegelapan, sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: וְהָהָר בֹּעֵר בָּאֵשׁ
  choice: sementara gunung itu menyala dengan api
  rationale: Waw dipahami secara sirkumstansial dan partisip בֹּעֵר menggambarkan keadaan yang sedang berlangsung bersamaan dengan terdengarnya suara.
- source_word: וַתִּקְרְבוּן אֵלַי
  choice: kamu datang mendekati aku
  rationale: קרב menyatakan gerak mendekat kepada Musa. Ungkapan ini jelas dan alami, serta mempertahankan unsur gerak dalam bentuk Ibrani.
- source_word: כָּל רָאשֵׁי שִׁבְטֵיכֶם
  choice: semua kepala sukumu
  rationale: “Kepala” mempertahankan metafora Ibrani untuk para pemimpin atau wakil utama suku, dan “sukumu” mengikuti sapaan jamak kolektif kepada Israel.
- source_word: וְזִקְנֵיכֶם
  choice: dan para tetuamu
  rationale: זָקֵן di sini menunjuk kepada pejabat atau tokoh masyarakat yang diakui, bukan semata-mata orang berusia lanjut. “Para tetua” merupakan padanan Indonesia yang tepat.
