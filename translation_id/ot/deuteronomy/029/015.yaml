  text: For you know how we lived in the land of Egypt[a], and how we passed through the midst of the nations through which you passed.
translation:
  language: id
  text: Sebab kamu tahu bagaimana kita hidup di tanah Mesir dan bagaimana kita melalui tengah-tengah bangsa-bangsa yang kamu lalui.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, secara lebih harfiah: “dan apa yang kita lalui di tengah bangsa-bangsa yang kamu lalui.” Konstruksi Ibraninya dapat menunjuk pada apa yang dialami ataupun pada bagaimana perjalanan itu berlangsung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memberikan alasan atau dasar penjelasan bagi pernyataan sebelumnya; “Sebab” mempertahankan hubungan tersebut secara alami.
- source_word: יְדַעְתֶּם
  choice: kamu tahu
  rationale: Bentuk perfektum menunjuk pada pengetahuan yang kini dimiliki para pendengar berdasarkan pengalaman lampau.
- source_word: אֵת אֲשֶׁר יָשַׁבְנוּ
  choice: bagaimana kita tinggal
  rationale: Konstruksi dengan penanda objek dan klausa relatif dapat menunjuk pada keadaan atau pengalaman yang diketahui. “Bagaimana kita tinggal” menyampaikan maknanya secara wajar tanpa memperinci pengalaman yang tidak dinyatakan.
- source_word: יָשַׁבְנוּ
  choice: kita tinggal
  rationale: ישׁב berarti tinggal atau menetap. “Kita” adalah bentuk inklusif yang wajar dalam seruan kepada generasi Israel sebagai satu umat, meskipun peralihan orang dalam teks tetap terasa pada “kamu”.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: di tanah Mesir
  rationale: Mempertahankan ungkapan Ibrani “tanah Mesir” dalam bahasa Indonesia yang alami dan bernada Kitab Suci.
- source_word: וְאֵת אֲשֶׁר עָבַרְנוּ
  choice: dan bagaimana kita melintasi
  rationale: Ungkapan ini sejajar dengan klausa pertama dan menunjuk pada keadaan perjalanan yang diketahui pendengar. “Melintasi” mempertahankan makna gerak dari עבר tanpa menafsirkannya sebagai kesusahan.
- source_word: בְּקֶרֶב הַגּוֹיִם
  choice: tengah-tengah bangsa-bangsa
  rationale: בקרב berarti “di tengah” atau “di antara”; bersama verba gerak, “melintasi tengah-tengah” mempertahankan gambaran perjalanan melalui lingkungan bangsa-bangsa itu.
- source_word: הַגּוֹיִם
  choice: bangsa-bangsa
  rationale: גוים di sini menunjuk pada bangsa-bangsa atau kelompok-kelompok bangsa; pilihan ini menghindari muatan makna dari istilah yang lebih khusus seperti “orang kafir.”
- source_word: אֲשֶׁר עֲבַרְתֶּם
  choice: yang kamu lalui
  rationale: Klausa relatif ini menerangkan bangsa-bangsa tersebut dan mempertahankan sapaan orang kedua serta pengulangan verba עבר dalam teks Ibrani.
theological_decisions:
- issue: Rujukan kata ganti orang pertama jamak dalam ingatan kolektif Israel
  choice: kita
  alternative: kami
  rationale: Bahasa Ibrani tidak membedakan bentuk inklusif dan eksklusif. Dalam konteks Musa berbicara kepada Israel tentang pengalaman umat secara kolektif, “kita” terdengar paling alami, tetapi tidak dimaksudkan untuk menyelesaikan secara dogmatis persoalan generasi mana yang hadir secara langsung.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Pengulangan “melintasi/lalui” dipertahankan untuk mencerminkan pengulangan akar עבר dalam bahasa Ibrani. Penanda catatan kaki ditempatkan setelah klausa yang dijelaskannya.
