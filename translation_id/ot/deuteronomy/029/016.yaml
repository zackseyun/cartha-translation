  yaml_path: translation/ot/deuteronomy/029/016.yaml
  text: and you saw their detestable things and their idols[a], wood and stone, silver and gold[c][b], that were among them—
translation:
  language: id
  text: dan kamu telah melihat benda-benda mereka yang menjijikkan[a] serta berhala-berhala mereka[b], dari kayu dan batu, dari perak dan emas, yang ada di antara mereka[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “kekejian-kekejian mereka”. Kata Ibrani ini merupakan istilah kuat yang mengungkapkan rasa jijik dan sering dipakai untuk benda-benda pemujaan berhala.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “berhala-berhala” bernada sangat menghina dan mungkin mengandung gambaran kasar yang berkaitan dengan tahi.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “yang bersama mereka”. Kata “mereka” mengacu kepada bangsa-bangsa yang wilayahnya dilalui Israel.
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּרְאוּ
  choice: dan kamu melihat
  rationale: Bentuk Qal wayyiqtol orang kedua jamak melanjutkan sapaan Musa kepada seluruh umat. Bentuk lampau dipahami dari konteks pengisahan, sedangkan 'dan' mempertahankan kesinambungan dengan ayat sebelumnya.
- source_word: שִׁקּוּצֵיהֶם
  choice: benda-benda mereka yang menjijikkan
  rationale: שִׁקּוּץ menyatakan sesuatu yang sangat menjijikkan atau patut dibenci, khususnya benda pemujaan berhala. Ungkapan ini mempertahankan daya evaluatifnya dalam bahasa Indonesia yang wajar.
- source_word: גִּלֻּלֵיהֶם
  choice: berhala-berhala mereka
  rationale: גִּלּוּלִים adalah sebutan bernada sangat menghina bagi berhala. 'Berhala-berhala' menyatakan acuannya dengan jelas, sedangkan nuansa kasarnya dijelaskan dalam catatan kaki.
- source_word: עֵץ וָאֶבֶן כֶּסֶף וְזָהָב
  choice: dari kayu dan batu, dari perak dan emas
  rationale: Deretan nomina ini paling wajar dipahami sebagai bahan benda-benda pemujaan tersebut. Pengulangan 'dari' membuat hubungan itu jelas dan alami dalam bahasa Indonesia tanpa mengubah daftar empat bahannya.
- source_word: אֲשֶׁר עִמָּהֶם
  choice: yang ada di tengah-tengah mereka
  rationale: Frasa עִם secara harfiah berarti 'dengan'; dalam konteks ini frasa tersebut menunjukkan bahwa benda-benda itu berada di antara bangsa-bangsa yang disebut pada ayat sebelumnya. Terjemahan ini tidak menyiratkan bahwa Israel memilikinya.
theological_decisions:
- issue: Dua istilah Ibrani yang merendahkan benda-benda berhala
  choice: 'Mempertahankan dua ungkapan berbeda: ''benda-benda mereka yang menjijikkan'' dan ''berhala-berhala mereka'''
  alternative: '''kekejian-kekejian mereka'' dan ''berhala-berhala najis mereka'''
  rationale: Teks Ibrani memakai dua kata berbeda dan sama-sama bernada merendahkan. Terjemahan utama mempertahankan pembedaan itu tanpa menambahkan penafsiran teologis, sementara catatan kaki menjelaskan nuansa yang sukar diungkapkan secara alami.
- issue: Acuan frasa אֲשֶׁר עִמָּהֶם
  choice: Benda-benda itu berada di tengah-tengah bangsa-bangsa yang telah dilalui Israel
  alternative: '''yang bersama mereka'' atau ''yang menjadi milik mereka'''
  rationale: Konteks ayat sebelumnya menunjuk kepada bangsa-bangsa yang dilalui Israel. Rumusan terpilih mempertahankan makna keberadaan atau penyertaan tanpa memastikan hubungan kepemilikan yang tidak dinyatakan secara tegas oleh frasa Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'kamu' dibaca sebagai jamak karena Musa menyapa seluruh umat. Tanda pisah mempertahankan sifat kalimat yang berlanjut ke ayat berikutnya sekaligus menandai daftar bahan sebagai keterangan sisipan.
