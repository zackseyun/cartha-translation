  text: וְ/הָיָ֡ה בְּ/שָׁמְע/וֹ֩ אֶת דִּבְרֵ֨י הָֽ/אָלָ֜ה הַ/זֹּ֗את וְ/הִתְבָּרֵ֨ךְ בִּ/לְבָב֤/וֹ לֵ/אמֹר֙ שָׁל֣וֹם יִֽהְיֶה לִּ֔/י כִּ֛י בִּ/שְׁרִר֥וּת לִבִּ֖/י אֵלֵ֑ךְ לְמַ֛עַן סְפ֥וֹת הָ/רָוָ֖ה אֶת הַ/צְּמֵאָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/018.yaml
  text: and when he hears the words of this oath[a], he blesses himself in his heart, saying, ‘I will have peace[b], though I walk in the stubbornness of my heart’—so as to sweep away the well-watered with the thirsty.
translation:
  language: id
  text: Ketika ia mendengar perkataan sumpah ini[a], ia memberkati dirinya dalam hatinya dengan berkata, “Kesejahteraan akan menjadi milikku, sekalipun aku berjalan menurut kedegilan hatiku,” dengan maksud melenyapkan yang berlimpah air bersama yang kehausan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kutuk ini.” Kata Ibrani yang dipakai dapat menunjuk pada sumpah yang mengandung kutuk.
    reason: alternative_reading
  - marker: b
    text: Atau mungkin, “melenyapkan tanah yang diairi bersama tanah yang kering,” yaitu membinasakan semuanya tanpa membeda-bedakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָלָה
  choice: sumpah
  rationale: Kata אָלָה dapat menunjuk pada sumpah yang disertai sanksi atau kutuk. Dalam frasa ini, “sumpah” mempertahankan bentuk pernyataan perjanjian yang didengar, sedangkan unsur kutuk dijelaskan dalam catatan kaki.
- source_word: וְהִתְבָּרֵךְ בִּלְבָבוֹ
  choice: ia memberkati dirinya dalam hati
  rationale: Bentuk refleksif verba ברך menyatakan bahwa orang itu secara batin menyatakan berkat atas dirinya sendiri. Ungkapan ini juga mempertahankan ironi dari keyakinannya yang lancang.
- source_word: שָׁלוֹם יִהְיֶה לִּי
  choice: Aku akan tetap sejahtera
  rationale: שָׁלוֹם mencakup kesejahteraan, kedamaian, dan keamanan. “Tetap sejahtera” menyampaikan anggapan bahwa ia tidak akan terkena akibat buruk meskipun terus membangkang.
- source_word: שְׁרִרוּת לִבִּי
  choice: kekerasan hatiku
  rationale: שְׁרִרוּת menunjuk pada sikap keras kepala atau kemauan yang tegar melawan. “Kekerasan hati” merupakan ungkapan Indonesia yang alami dan sesuai dengan konteks peringatan perjanjian.
- source_word: לְמַעַן
  choice: sehingga
  rationale: לְמַעַן dapat menandai tujuan atau hasil. “Sehingga” mempertahankan hubungan akibat tanpa secara berlebihan menyatakan bahwa pembinasaan berikutnya merupakan tujuan sadar orang tersebut.
- source_word: סְפוֹת
  choice: tersapu habis
  rationale: Dalam konteks penghukuman ini, ספה paling mungkin berarti menyapu habis atau membinasakan. Bentuk pasif dalam bahasa Indonesia menghasilkan kalimat yang lebih alami tanpa menetapkan pelaku yang tidak disebutkan secara eksplisit dalam klausa.
- source_word: הָרָוָה אֶת־הַצְּמֵאָה
  choice: yang kenyang air ... bersama yang kehausan
  rationale: Ungkapan Ibrani ini sulit dan secara harfiah mempertentangkan yang jenuh atau kenyang air dengan yang haus. Terjemahan ini mempertahankan citra dan ambiguitasnya; tafsiran yang mengacu pada tanah dicantumkan dalam catatan kaki.
theological_decisions:
- issue: Makna bahasa perjanjian pada הָאָלָה
  choice: sumpah
  alternative: kutuk
  rationale: Kata Ibrani tersebut dapat berarti sumpah yang mengandung kutuk. Teks utama memakai “sumpah” sesuai bentuk pernyataan perjanjian, sementara dimensi sanksinya tetap terbuka melalui catatan kaki.
- issue: Penafsiran ungkapan הָרָוָה אֶת־הַצְּמֵאָה
  choice: Mempertahankan metafora “yang kenyang air ... bersama yang kehausan”
  alternative: tanah yang diairi ... bersama tanah yang kering
  rationale: Ungkapan ini benar-benar sulit dan mungkin bersifat pepatah. Teks utama tidak memaksakan satu tafsiran tertentu, sedangkan kemungkinan rujukan kepada tanah diberikan dalam catatan kaki.
- issue: Hubungan logis לְמַעַן dengan klausa sebelumnya
  choice: sehingga
  alternative: dengan maksud untuk
  rationale: לְמַעַן dapat menyatakan tujuan maupun hasil. “Sehingga” menghindari kesimpulan teologis bahwa orang yang membangkang itu secara sadar bermaksud membinasakan semua pihak, sambil tetap mempertahankan hubungan erat antarklausa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Susunan kalimat mempertahankan ironi keyakinan diri orang yang keras hati serta citra Ibrani yang sengaja tidak ditafsirkan secara sempit.
