revisions:
- from: Ketika ia mendengar perkataan sumpah ini[a], ia memberkati dirinya dalam hati dengan berkata, “Aku akan tetap sejahtera, sekalipun aku berjalan dalam kekerasan hatiku,” sehingga yang kenyang air tersapu habis bersama yang kehausan.[b]
  to: Ketika ia mendengar perkataan sumpah ini[a], ia memberkati dirinya dalam hatinya dengan berkata, “Kesejahteraan akan menjadi milikku, sekalipun aku berjalan menurut kedegilan hatiku,” dengan maksud melenyapkan yang berlimpah air bersama yang kehausan.[b]
  rationale: Revisi menghilangkan penambahan makna “tetap,” memakai “kedegilan” untuk ketegaran membangkang yang terkandung dalam שְׁרִרוּת, dan mengembalikan nuansa purposif/hasil dari לְמַעַן. Metafora sulit pada penutup tetap dipertahankan dalam teks utama; catatan kaki menyediakan pembacaan yang berhubungan dengan tanah tanpa menjadikannya satu-satunya makna.
  reviewer_model: gpt-5.6-terra
