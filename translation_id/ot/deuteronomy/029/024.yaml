  text: וְ/אָ֣מְר֔וּ עַ֚ל אֲשֶׁ֣ר עָֽזְב֔וּ אֶת בְּרִ֥ית יְהוָ֖ה אֱלֹהֵ֣י אֲבֹתָ֑/ם אֲשֶׁר֙ כָּרַ֣ת עִמָּ֔/ם בְּ/הוֹצִיא֥/וֹ אֹתָ֖/ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/024.yaml
  text: Then they will say[a], ‘Because they forsook the covenant of Yahweh, the God of their fathers, which he made with them when he brought them out of the land of Egypt.’
translation:
  language: id
  text: Lalu mereka akan berkata, “Karena mereka meninggalkan perjanjian Yahweh, Allah nenek moyang mereka,[a] yang telah Dia buat dengan mereka ketika Dia membawa mereka keluar dari tanah Mesir.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Allah mereka, nenek moyang mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Lalu mereka akan berkata
  rationale: Bentuk ini melanjutkan tanggapan dalam konteks sebelumnya; “lalu” menyatakan perkembangan wacana, sedangkan “akan berkata” mempertahankan acuan masa depan.
- source_word: עַל אֲשֶׁר
  choice: Karena
  rationale: Gabungan preposisi dan kata relatif ini memperkenalkan alasan bagi kehancuran negeri tersebut.
- source_word: עָזְבוּ
  choice: meninggalkan
  rationale: Dalam konteks perjanjian, kata ini menyatakan tindakan berpaling dan tidak setia, bukan sekadar perpindahan tempat; “meninggalkan” alami dalam bahasa Indonesia dan tetap membawa bobot itu.
- source_word: בְּרִית
  choice: perjanjian
  rationale: Istilah ini mempertahankan makna hubungan mengikat antara Yahweh dan umat-Nya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: אֱלֹהֵי אֲבֹתָם
  choice: Allah nenek moyang mereka
  rationale: Frasa ini secara alami menyatakan hubungan Allah dengan garis leluhur mereka dalam bahasa Indonesia; catatan kaki mencatat kemungkinan susunan alternatif.
- source_word: אֲשֶׁר כָּרַת עִמָּם
  choice: yang telah Dia buat dengan mereka
  rationale: Ungkapan Ibrani harfiahnya “memotong perjanjian”; bahasa Indonesia lazim memakai “membuat perjanjian.” “Telah” memperjelas tindakan yang sudah terjadi.
- source_word: בְּהוֹצִיאוֹ אֹתָם
  choice: ketika Dia membawa mereka keluar
  rationale: Infinitif dengan prefiks bet berfungsi temporal di sini.
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: dari tanah Mesir
  rationale: Terjemahan ini mempertahankan unsur lengkap “tanah Mesir” dan bunyi eksodus dalam teks sumber.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama pribadi; “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Ungkapan leluhur אֱלֹהֵי אֲבֹתָם
  choice: Allah nenek moyang mereka
  alternative: Allah para leluhur mereka
  rationale: Bahasa Indonesia tidak menandai gender gramatikal pada “nenek moyang”; pilihan ini idiomatis dan tidak menambahkan pembatasan yang tidak dinyatakan secara alami dalam bahasa sasaran.
- issue: Acuan pronomina pada אֲשֶׁר כָּרַת
  choice: Dia, yakni Yahweh
  alternative: yang dibuat-Nya
  rationale: Subjek verba tunggal secara kontekstual adalah Yahweh. Kapitalisasi membantu menunjukkan rujukan kepada Allah tanpa menambahkan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat mengikuti hubungan sebab dan waktu dalam bahasa Ibrani tanpa mempertahankan idiom yang akan terdengar janggal dalam bahasa Indonesia.
