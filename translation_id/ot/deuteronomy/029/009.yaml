source:
  edition: WLC
  text: אַתֶּ֨ם נִצָּבִ֤ים הַ/יּוֹם֙ כֻּלְּ/כֶ֔ם לִ/פְנֵ֖י יְהוָ֣ה אֱלֹהֵי/כֶ֑ם רָאשֵׁי/כֶ֣ם שִׁבְטֵי/כֶ֗ם זִקְנֵי/כֶם֙ וְ/שֹׁ֣טְרֵי/כֶ֔ם כֹּ֖ל אִ֥ישׁ יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/009.yaml
  text: 'You are standing today[a], all of you, before Yahweh your God: your heads, your tribes, your elders[b], and your officers—all the men of Israel.'
translation:
  language: id
  text: 'Hari ini kamu semua berdiri di hadapan Yahweh, Allahmu: para pemimpinmu[a], suku-sukumu, para tetuamu, dan para pejabatmu—setiap laki-laki Israel.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "para kepala sukumu"; secara harfiah, rangkaian Ibraninya dapat dibaca "kepala-kepalamu, suku-sukumu".
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, "setiap laki-laki Israel"; ungkapan tunggal ini dipakai secara distributif.
    reason: lexical_clarification
lexical_decisions:
- source_word: נִצָּבִים
  choice: berdiri
  rationale: Partisipel nifal ini menggambarkan umat yang sedang berdiri sebagai perhimpunan perjanjian; bentuk Indonesia yang alami dalam konstruksi dengan 'hari ini' adalah 'berdiri'.
- source_word: הַיּוֹם
  choice: hari ini
  rationale: Padanan modern dan langsung yang mempertahankan penekanan waktu.
- source_word: כֻּלְּכֶם
  choice: kamu semua
  rationale: Menyatakan cakupan kolektif orang kedua jamak secara jelas dan alami.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Mengungkapkan keberadaan dalam hadirat Allah dan cocok dengan suasana resmi perjanjian.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama diri ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Menerjemahkan nomina dengan sufiks orang kedua jamak secara ringkas; bahasa Indonesia tidak membedakan jumlah pada sufiks '-mu'.
- source_word: רָאשֵׁיכֶם
  choice: para pemimpinmu
  rationale: Secara harfiah berarti 'kepala-kepalamu', tetapi dalam konteks sosial-politik kata ini merupakan metafora bagi para pemimpin. Padanan idiomatis dipakai dalam teks utama, sementara bentuk alternatif dicatat.
- source_word: שִׁבְטֵיכֶם
  choice: suku-sukumu
  rationale: Mengikuti arti leksikal biasa dan aksentuasi Masoret yang memungkinkan unsur ini dibaca sebagai bagian tersendiri dalam daftar.
- source_word: זִקְנֵיכֶם
  choice: para tua-tuamu
  rationale: Istilah baku bagi para tua-tua yang menjalankan peranan kepemimpinan komunal di Israel.
- source_word: שֹׁטְרֵיכֶם
  choice: para pejabatmu
  rationale: Dalam konteks administratif Ulangan, kata ini menunjuk para petugas atau pejabat tanpa menjelaskan fungsi mereka secara lebih khusus.
- source_word: כֹּל אִישׁ יִשְׂרָאֵל
  choice: setiap laki-laki Israel
  rationale: Mempertahankan bentuk distributif 'setiap laki-laki' dan penyebutan maskulin yang eksplisit dalam sumber.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama perjanjian ilahi secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Cakupan gender dalam כֹּל אִישׁ יִשְׂרָאֵל
  choice: setiap laki-laki Israel
  alternative: semua orang Israel; seluruh Israel
  rationale: Kata אִישׁ secara eksplisit berarti laki-laki dan dipakai secara distributif. Terjemahan tidak menetralkan unsur tersebut, sekalipun konteks lanjutan menyebut kelompok lain dalam perhimpunan.
- issue: Hubungan רָאשֵׁיכֶם dengan שִׁבְטֵיכֶם
  choice: para pemimpinmu, suku-sukumu
  alternative: para kepala sukumu
  rationale: Aksentuasi Masoret mendukung pembacaan sebagai dua unsur dalam daftar, tetapi konstruksinya juga dapat dipahami erat sebagai 'para kepala sukumu'. Ambiguitas itu dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'kamu' mengikuti sapaan orang kedua jamak dalam teks, sedangkan 'para' memperjelas jamak pada jabatan. Tanda pisah menampilkan klausa terakhir sebagai penjelas distributif atas perhimpunan.
