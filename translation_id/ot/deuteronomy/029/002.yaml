lexical_decisions:
- source_word: הַמַּסּוֹת הַגְּדֹלֹת
  choice: ujian-ujian besar
  rationale: מַסּוֹת menunjuk pada peristiwa-peristiwa pengujian atau pembuktian, bukan godaan untuk berbuat dosa. Bentuk ulang mempertahankan jamak Ibrani, sedangkan 'besar' menyampaikan skala dan bobot peristiwa tersebut.
- source_word: אֲשֶׁר רָאוּ עֵינֶיךָ
  choice: yang disaksikan oleh matamu
  rationale: Ungkapan ini mempertahankan penyebutan eksplisit 'matamu' dan menekankan pengalaman langsung sebagai saksi mata, dengan susunan yang tetap wajar dalam bahasa Indonesia.
- source_word: הָאֹתֹת
  choice: tanda-tanda
  rationale: אוֹת dalam konteks ini adalah tanda ilahi; 'tanda-tanda' merupakan padanan Indonesia yang jelas dan lazim.
- source_word: וְהַמֹּפְתִים
  choice: dan mukjizat-mukjizat
  rationale: מוֹפְתִים menunjuk pada perbuatan luar biasa yang menimbulkan kekaguman dan lazim berpasangan dengan 'tanda-tanda'. 'Mukjizat-mukjizat' alami dan mudah dipahami dalam konteks ini.
- source_word: הַגְּדֹלִים הָהֵם
  choice: besar itu
  rationale: '''Besar'' menyampaikan keagungan atau kedahsyatan tanda dan mukjizat tersebut, sedangkan ''itu'' mempertahankan daya tunjuk demonstratif הָהֵם.'
