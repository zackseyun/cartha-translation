  text: וְ/הִבְדִּיל֤/וֹ יְהוָה֙ לְ/רָעָ֔ה מִ/כֹּ֖ל שִׁבְטֵ֣י יִשְׂרָאֵ֑ל כְּ/כֹל֙ אָל֣וֹת הַ/בְּרִ֔ית הַ/כְּתוּבָ֕ה בְּ/סֵ֥פֶר הַ/תּוֹרָ֖ה הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/020.yaml
  text: And Yahweh will single him out from all the tribes of Israel for disaster[a], according to all the curses of the covenant written in this book of the law.
translation:
  language: id
  text: Yahweh akan memisahkan orang itu dari semua suku Israel untuk mengalami malapetaka, sesuai dengan semua kutuk perjanjian[a] yang tertulis dalam kitab hukum ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “kutuk perjanjian yang diucapkan dengan sumpah.” Istilah Ibrani ini dapat secara khusus menunjuk pada kutuk perjanjian yang dikaitkan dengan sumpah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדִּילוֹ
  choice: akan memisahkan orang itu
  rationale: Bentuk Hifil dari בדל dengan akhiran orang ketiga tunggal laki-laki menyatakan tindakan memisahkan seseorang dari kelompoknya. Ungkapan ini mempertahankan citra dasar Ibrani dan, bersama frasa penghukuman sesudahnya, jelas bernuansa hukuman.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai Yahweh untuk mempertahankan nama perjanjian yang muncul langsung dalam teks.
- source_word: לְרָעָה
  choice: untuk ditimpa malapetaka
  rationale: רָעָה di sini menunjuk pada akibat buruk berupa hukuman perjanjian, bukan kejahatan moral. Bentuk 'ditimpa malapetaka' alami dalam bahasa Indonesia dan menunjukkan nasib buruk yang dikenakan kepada orang itu.
- source_word: מִכֹּל שִׁבְטֵי יִשְׂרָאֵל
  choice: dari semua suku Israel
  rationale: Preposisi מִן menandai pemisahan orang tersebut dari keseluruhan komunitas suku-suku Israel.
- source_word: כְּכֹל
  choice: sesuai dengan segala
  rationale: כְּ menyatakan kesesuaian antara hukuman yang dijatuhkan dan sanksi yang tertulis.
- source_word: אָלֹות הַבְּרִית
  choice: kutuk perjanjian
  rationale: אָלָה dalam konteks perjanjian menunjuk pada kutuk sanksi yang terkait dengan sumpah. 'Kutuk perjanjian' ringkas dan jelas, sedangkan nuansa sumpah dijelaskan dalam catatan kaki.
- source_word: הַכְּתוּבָה
  choice: yang tertulis
  rationale: Partisip pasif feminin tunggal secara gramatikal bersesuaian dengan אָלָה sebagai nomina kolektif; dalam bahasa Indonesia, klausa relatif ini secara alami menerangkan segala kutuk perjanjian.
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֶּה
  choice: dalam kitab hukum ini
  rationale: סֵפֶר dapat berarti kitab atau gulungan, sedangkan תּוֹרָה dalam konteks ini adalah kumpulan hukum perjanjian. 'Kitab hukum ini' alami dan mempertahankan penunjuk 'ini'.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama ilahi tanpa menggantinya dengan gelar.
- issue: Makna penghukuman dalam לְרָעָה
  choice: untuk ditimpa malapetaka
  alternative: untuk kejahatan; untuk celaka; untuk mendatangkan bencana
  rationale: Konteksnya adalah hukuman berupa sanksi perjanjian, bukan pernyataan bahwa Yahweh mengarahkan orang itu kepada kejahatan moral.
- issue: Nuansa sumpah dalam אָלוֹת
  choice: kutuk perjanjian dalam teks utama, dengan penjelasan nuansa sumpah dalam catatan kaki
  alternative: kutuk sumpah perjanjian
  rationale: Istilah Ibrani dapat menyebut kutuk yang diberlakukan melalui sumpah. Pilihan utama tetap mudah dipahami tanpa menghapus nuansa khusus tersebut, yang dipertahankan dalam catatan kaki.
translation_notes:
  register: 'Bahasa Indonesia baku modern dengan nada khidmat dan lugas. Susunan klausa mengikuti gerak teks Ibrani: orang itu dipisahkan dari suku-suku Israel, lalu ditetapkan untuk mengalami malapetaka sesuai sanksi perjanjian. Penanda catatan kaki [a] ditempatkan langsung setelah frasa yang dijelaskannya.'
