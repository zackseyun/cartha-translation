base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/004.yaml
  text: And I led you forty years in the wilderness; your clothes did not wear out on you[a], and your sandal did not wear out on your foot.
translation:
  language: id
  text: Aku telah memimpin kalian selama empat puluh tahun di padang gurun. Pakaian kalian tidak menjadi usang di badan kalian, dan sandalmu tidak menjadi usang di kakimu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dalam bahasa Ibrani, sapaan beralih dari bentuk jamak ke bentuk tunggal pada klausa terakhir. Secara harfiah: “sandalmu tidak menjadi usang dari atas kakimu.” Bentuk tunggal ini mungkin menyapa Israel sebagai satu kesatuan atau berlaku bagi setiap orang secara distributif.'
    reason: Menjelaskan peralihan jumlah gramatikal dan ungkapan Ibrani yang tidak dapat dipertahankan secara harfiah dalam bahasa Indonesia yang alami.
lexical_decisions:
- source_word: וָאוֹלֵךְ
  choice: Aku memimpin
  rationale: Bentuk kausatif dari הלך menyatakan bahwa TUHAN membawa atau menuntun Israel berjalan; “memimpin” alami dalam bahasa Indonesia dan sesuai dengan konteks perjalanan di padang gurun.
- source_word: אַרְבָּעִים שָׁנָה
  choice: selama empat puluh tahun
  rationale: Frasa durasi diterjemahkan langsung; “selama” memperjelas fungsi waktunya secara alami.
- source_word: בַמִּדְבָּר
  choice: di padang gurun
  rationale: מִדְבָּר menunjuk wilayah liar atau tandus; “padang gurun” merupakan ungkapan Indonesia yang lazim dalam konteks perjalanan Israel.
- source_word: שַׂלְמֹתֵיכֶם
  choice: pakaian kalian
  rationale: Kata jamak ini menunjuk pakaian secara umum. “Pakaian” lebih wajar dan bermartabat daripada padanan yang terlalu sempit.
- source_word: לֹא בָלוּ / לֹא בָלְתָה
  choice: tidak menjadi usang
  rationale: בלה menggambarkan pakaian atau alas kaki yang rusak karena pemakaian. “Menjadi usang” tepat untuk kedua benda dan terdengar alami.
- source_word: מֵעֲלֵיכֶם
  choice: pada tubuh kalian
  rationale: Secara harfiah berarti “dari atas kalian.” Dalam konteks pakaian yang sedang dikenakan, “pada tubuh kalian” menyampaikan gambarnya dengan jelas tanpa mempertahankan susunan yang kaku.
- source_word: נַעַלְךָ
  choice: sandalmu
  rationale: נַעַל adalah alas kaki yang sesuai diterjemahkan “sandal”; akhiran orang kedua tunggal dipertahankan untuk mencerminkan peralihan jumlah dalam bahasa Ibrani.
- source_word: מֵעַל רַגְלֶךָ
  choice: pada kakimu
  rationale: Secara harfiah “dari atas kakimu,” tetapi bersama verba “menjadi usang,” bahasa Indonesia yang alami ialah “pada kakimu.” Bentuk tunggal dipertahankan.
theological_decisions:
- issue: Peralihan sapaan dari jamak pada “kalian/pakaian kalian” ke tunggal pada “sandalmu/kakimu”
  choice: Mempertahankan bentuk tunggal dalam klausa terakhir dan menjelaskannya dalam catatan kaki
  alternative: Menjamakkan klausa terakhir menjadi “sandal kalian ... kaki kalian” demi kelancaran
  rationale: Teks Ibrani benar-benar beralih dari bentuk jamak ke tunggal. Bentuk tunggal dapat menyapa Israel sebagai satu kesatuan atau berfungsi secara distributif. Mempertahankannya menjaga ciri sumber tanpa menetapkan salah satu penafsiran.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Kalian” dipakai untuk membedakan sapaan jamak dari “-mu” yang tunggal sehingga peralihan jumlah dalam teks Ibrani tetap terlihat. Ejaan sumber וָאוֹלֵךְ dipahami sebagai bentuk yang lazim divokalisasi וָאוֹלֵךְ dalam WLC pada ayat ini.
