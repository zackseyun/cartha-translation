  text: לְ/עָבְרְ/ךָ֗ בִּ/בְרִ֛ית יְהוָ֥ה אֱלֹהֶ֖י/ךָ וּ/בְ/אָלָת֑/וֹ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ כֹּרֵ֥ת עִמְּ/ךָ֖ הַ/יּֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/011.yaml
  text: so that you may enter into the covenant of Yahweh your God[a], and into his oath[b], which Yahweh your God is making with you today.
translation:
  language: id
  text: supaya engkau masuk ke dalam perjanjian Yahweh, Allahmu, dan ke dalam sumpah-Nya[a], yang Yahweh, Allahmu, sedang adakan[b] denganmu pada hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sumpah-Nya yang disertai kutuk.” Istilah Ibrani ini dapat menunjuk kepada sumpah yang mencakup sanksi atau kutuk perjanjian.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “sedang memotong denganmu pada hari ini.” “Memotong perjanjian” adalah ungkapan Ibrani untuk mengadakan perjanjian.
    reason: cultural_note
lexical_decisions:
- source_word: לְעָבְרְךָ
  choice: supaya engkau masuk
  rationale: Infinitif konstruk dengan prefiks לְ menyatakan tujuan atau hasil. Bersama בְּרִית, kata עבר merupakan ungkapan untuk memasuki ikatan dan kewajiban perjanjian, bukan gerakan fisik secara harfiah.
- source_word: בִּבְרִית
  choice: ke dalam perjanjian
  rationale: Preposisi בְּ di sini sesuai dengan idiom bahasa Indonesia ‘masuk ke dalam’, sedangkan בְּרִית berarti ‘perjanjian’.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’ agar nama pribadi dalam teks Ibrani tetap tampak dan tidak diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk konstruk dengan sufiks orang kedua maskulin tunggal berarti ‘Allahmu’.
- source_word: וּבְאָלָתוֹ
  choice: dan ke dalam sumpah-Nya
  rationale: אָלָה dapat berarti sumpah yang mengikat dan dapat mencakup kutuk atau sanksi perjanjian. ‘Sumpah’ merupakan padanan utama yang alami, sementara nuansa kutuk dipertahankan dalam catatan kaki.
- source_word: כֹּרֵת
  choice: adakan
  rationale: Secara harfiah verba ini berarti ‘memotong’, tetapi dalam ungkapan כרת ברית maknanya ialah mengadakan atau membuat perjanjian. ‘Adakan’ alami dalam bahasa Indonesia dan sesuai dengan tindakan perjanjian yang sedang berlangsung.
- source_word: עִמְּךָ
  choice: denganmu
  rationale: Padanan langsung untuk preposisi עִם dengan sufiks orang kedua maskulin tunggal.
- source_word: הַיּוֹם
  choice: pada hari ini
  rationale: Ungkapan ini mempertahankan penekanan waktu dalam upacara perjanjian dengan ragam yang wajar dan bermartabat.
theological_decisions:
- issue: Penyajian nama perjanjian יהוה
  choice: Yahweh, Allahmu
  alternative: TUHAN, Allahmu
  rationale: Teks sumber secara langsung memakai nama יהוה. Transliterasi ‘Yahweh’ mempertahankan nama pribadi itu tanpa menggantinya dengan sebuah gelar.
- issue: Apakah אָלָה harus diterjemahkan dengan bahasa kutuk secara eksplisit
  choice: sumpah-Nya dalam teks utama, dengan catatan tentang sanksi atau kutuk
  alternative: kutuk-Nya; sumpah yang disertai kutuk
  rationale: Istilah ini dapat menunjuk kepada sumpah yang mengandung sanksi perjanjian. ‘Sumpah’ tidak mempersempit makna secara berlebihan, sedangkan catatan kaki mempertahankan nuansa kutuk yang penting.
- issue: Cakupan klausa relatif אֲשֶׁר ... כֹּרֵת
  choice: dibiarkan mengikuti rangkaian ‘perjanjian ... dan sumpah-Nya’
  alternative: dibatasi hanya pada ‘perjanjian’ atau hanya pada ‘sumpah’
  rationale: Susunan Ibrani memungkinkan klausa relatif berkaitan dengan keseluruhan tindakan perjanjian. Terjemahan tidak menambahkan unsur yang akan menutup ambiguitas sintaksis itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi tetap mudah dipahami. Kata ganti tunggal ‘engkau’ mempertahankan bentuk orang kedua tunggal dalam teks Ibrani. Tanda koma mengapit aposisi ‘Allahmu’ agar hubungan dengan nama Yahweh jelas.
