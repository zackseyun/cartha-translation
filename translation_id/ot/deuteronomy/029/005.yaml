  variant: modern standard Indonesian
source:
  edition: WLC
  text: לֶ֚חֶם לֹ֣א אֲכַלְתֶּ֔ם וְ/יַ֥יִן וְ/שֵׁכָ֖ר לֹ֣א שְׁתִיתֶ֑ם לְמַ֨עַן֙ תֵּֽדְע֔וּ כִּ֛י אֲנִ֥י יְהוָ֖ה אֱלֹהֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/005.yaml
  text: You did not eat bread[a], and you did not drink wine or strong drink, so that you might know that I am Yahweh your God.
translation:
  language: id
  text: Kalian tidak makan roti dan tidak minum anggur ataupun minuman keras[a], supaya kalian mengetahui bahwa Akulah Yahweh, Allah kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “minuman yang memabukkan”. Istilah Ibrani ini secara luas merujuk pada minuman fermentasi yang memabukkan, bukan selalu pada satu jenis minuman tertentu.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֶחֶם
  choice: roti
  rationale: Makna dasarnya adalah “roti”. Pilihan konkret ini mempertahankan susunan Ibrani dan cocok dengan konteks pemeliharaan di padang gurun, meskipun kata tersebut kadang dapat berarti makanan secara umum.
- source_word: אֲכַלְתֶּם
  choice: kamu tidak makan
  rationale: Bentuk perfektum Ibrani merangkum pengalaman Israel pada masa lampau; bentuk lampau dipahami secara alami dari konteks dalam bahasa Indonesia.
- source_word: יַיִן
  choice: anggur
  rationale: Ini adalah makna leksikal lazim dan tidak perlu diperluas dalam konteks ini.
- source_word: שֵׁכָר
  choice: minuman keras
  rationale: Istilah Ibrani menunjuk secara luas pada minuman fermentasi yang memabukkan selain anggur, bukan semata-mata satu jenis minuman. “Minuman keras” ringkas dan lazim, dengan catatan kaki untuk mencegah pengertian yang terlalu sempit sebagai minuman sulingan modern.
- source_word: שְׁתִיתֶם
  choice: kamu tidak minum
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan selaras dengan tinjauan kembali atas pengalaman Israel.
- source_word: לְמַעַן
  choice: supaya
  rationale: Menyatakan tujuan atau hasil yang dimaksud dengan jelas dan alami tanpa menghapus keluwesan hubungan tersebut.
- source_word: תֵּדְעוּ
  choice: kamu tahu
  rationale: Sesudah “supaya”, bentuk ini secara alami menyatakan tujuan atau hasil yang dimaksud dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” dan tidak diganti dengan sebuah gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allah kalian
  rationale: Bentuk akhiran Ibrani adalah orang kedua jamak. “Allah kalian” mempertahankan bahwa Musa berbicara kepada umat secara kolektif dengan jelas dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian secara langsung; “Yahweh” mempertahankannya sebagai nama pribadi, bukan menggantinya dengan gelar.
- issue: Hubungan tujuan atau hasil dalam לְמַעַן תֵּדְעוּ
  choice: supaya kamu tahu
  alternative: agar kamu dapat mengetahui
  rationale: “Supaya” mempertahankan maksud klausa tanpa memutuskan secara berlebihan apakah tekanannya semata-mata pada tujuan atau juga pada hasil.
- issue: Penegasan identitas dalam כִּי אֲנִי יְהוָה
  choice: bahwa Akulah Yahweh
  alternative: bahwa Aku adalah Yahweh
  rationale: “Akulah” menyampaikan penegasan pada pronomina אֲנִי secara alami dan tetap mempertahankan pernyataan identitas ilahi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kamu” dipakai untuk sapaan orang kedua jamak yang dapat dipahami dari konteks, sedangkan “Allah kalian” menyatakan bentuk jamak Ibrani secara eksplisit. Penanda catatan kaki ditempatkan setelah “minuman keras”, yaitu istilah yang diterangkannya.
