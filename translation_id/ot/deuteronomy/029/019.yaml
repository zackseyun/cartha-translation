reference: Deuteronomy 29:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לֹא יֹאבֶ֣ה יְהוָה֮ סְלֹ֣חַֽ ל/וֹ֒ כִּ֣י אָ֠ז יֶעְשַׁ֨ן אַף יְהוָ֤ה וְ/קִנְאָת/וֹ֙ בָּ/אִ֣ישׁ הַ/ה֔וּא וְ/רָ֤בְצָה בּ/וֹ֙ כָּל הָ֣/אָלָ֔ה הַ/כְּתוּבָ֖ה בַּ/סֵּ֣פֶר הַ/זֶּ֑ה וּ/מָחָ֤ה יְהוָה֙ אֶת שְׁמ֔/וֹ מִ/תַּ֖חַת הַ/שָּׁמָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/019.yaml
  text: Yahweh will not be willing to forgive him[a], for then the anger of Yahweh and his jealousy will burn against that man, and every curse written in this book will settle on him, and Yahweh will blot out his name from under heaven.
translation:
  language: id
  text: Yahweh tidak akan bersedia mengampuninya, sebab pada waktu itu kemarahan Yahweh dan kecemburuan-Nya akan berkobar terhadap orang itu. Setiap kutuk[a] yang tertulis dalam kitab ini akan menimpa dan tetap melekat padanya, dan Yahweh akan menghapus namanya dari bawah langit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “setiap kutuk sumpah.” Kata Ibrani ini dapat menunjuk kepada kutuk yang diucapkan dalam konteks sumpah perjanjian, bukan hanya kutuk secara umum.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יֹאבֶה ... סְלֹחַ לוֹ
  choice: tidak akan bersedia mengampuninya
  rationale: אבה menyatakan kemauan atau kesediaan, bukan kemampuan. Ungkapan ini mempertahankan daya volisionalnya dan tetap alami dalam bahasa Indonesia.
- source_word: כִּי אָז
  choice: sebab pada waktu itu
  rationale: Mengungkapkan hubungan penjelasan sekaligus waktu secara jelas dalam bahasa Indonesia.
- source_word: יֶעְשַׁן אַף יְהוָה
  choice: kemarahan Yahweh ... akan berkobar
  rationale: Secara harfiah idiom Ibrani menggambarkan murka yang berasap. 'Berkobar' merupakan ungkapan Indonesia yang alami untuk kemarahan yang menyala tanpa mereduksinya menjadi pernyataan umum tentang murka.
- source_word: קִנְאָתוֹ
  choice: kecemburuan-Nya
  rationale: Mempertahankan arti langsung קנאה dalam konteks kesetiaan perjanjian, tanpa mengubahnya menjadi istilah teologis yang lebih khusus.
- source_word: בָּאִישׁ הַהוּא
  choice: terhadap orang itu
  rationale: Preposisi ב dalam konteks kemarahan dapat diungkapkan sebagai 'terhadap'. 'Orang itu' mempertahankan rujukan individual tanpa membuat bahasa Indonesia terasa kaku.
- source_word: וְרָבְצָה בוֹ
  choice: akan menimpa dan tetap melekat padanya
  rationale: רבץ secara harfiah berarti berbaring atau mendekam. Gabungan ini menyampaikan bahwa kutuk itu datang ke atas orang tersebut lalu menetap padanya.
- source_word: כָּל הָאָלָה
  choice: setiap kutuk
  rationale: אָלָה menunjuk kepada kutuk, khususnya kutuk yang terkait sumpah perjanjian. Teks utama dibuat lugas, sedangkan nuansa sumpah dijelaskan dalam catatan kaki.
- source_word: הַכְּתוּבָה בַּסֵּפֶר הַזֶּה
  choice: yang tertulis dalam kitab ini
  rationale: סֵפֶר dapat berarti kitab atau gulungan; 'kitab' alami dalam konteks ini dan mempertahankan rujukan tekstualnya.
- source_word: וּמָחָה ... אֶת שְׁמוֹ
  choice: akan menghapus namanya
  rationale: Mempertahankan idiom Ibrani tentang peniadaan nama, ingatan, atau keberlanjutan seseorang.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: dari bawah langit
  rationale: Mempertahankan ungkapan baku Ibrani mengenai pemusnahan dari muka bumi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
theological_decisions:
- issue: Gambaran antropomorfis tentang penghakiman
  choice: Menerjemahkan kemarahan dan kecemburuan Yahweh sebagai 'akan berkobar'.
  alternative: 'Secara lebih harfiah: ''akan berasap''.'
  rationale: Pilihan ini mempertahankan citra murka yang menyala dalam bentuk yang wajar bagi pembaca Indonesia, tanpa membuat klaim spekulatif mengenai emosi ilahi.
- issue: Rujukan tunggal bergender
  choice: Menggunakan 'orang itu'.
  alternative: Menggunakan 'laki-laki itu'.
  rationale: הָאִישׁ הַהוּא menunjuk individu pelanggar perjanjian. Dalam bahasa Indonesia, 'orang itu' adalah padanan alami dan tidak mengubah jumlah atau sifat individual rujukannya; konteks tidak mengharuskan penegasan jenis kelamin biologis.
- issue: Istilah kutuk perjanjian
  choice: Menggunakan 'setiap kutuk' dalam teks utama dengan catatan tentang kutuk sumpah.
  alternative: Menggunakan 'seluruh kutuk sumpah' dalam teks utama.
  rationale: '''Kutuk'' jelas dan alami, sedangkan catatan mempertahankan kemungkinan nuansa teknis אָלָה dalam konteks sumpah perjanjian.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan lugas. Struktur kalimat dibagi dua agar mudah dipahami, sementara urutan ancaman penghakiman dan citra perjanjian tetap dipertahankan.
