  text: גָּפְרִ֣ית וָ/מֶלַח֮ שְׂרֵפָ֣ה כָל אַרְצָ/הּ֒ לֹ֤א תִזָּרַע֙ וְ/לֹ֣א תַצְמִ֔חַ וְ/לֹֽא יַעֲלֶ֥ה בָ֖/הּ כָּל עֵ֑שֶׂב כְּֽ/מַהְפֵּכַ֞ת סְדֹ֤ם וַ/עֲמֹרָה֙ אַדְמָ֣ה ו/צביים אֲשֶׁר֙ הָפַ֣ךְ יְהוָ֔ה בְּ/אַפּ֖/וֹ וּ/בַ/חֲמָתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/022.yaml
  text: Sulfur and salt[a], a burning waste, are all its land; it is not sown, and it does not sprout, and no grass grows in it, like the overthrow of Sodom and Gomorrah, Admah and Zeboiim, which Yahweh overthrew in his anger and in his wrath.
translation:
  language: id
  text: Seluruh tanahnya diliputi belerang dan garam, menjadi tanah yang hangus terbakar[a]. Tanah itu tidak ditaburi benih dan tidak menumbuhkan apa pun; tidak ada tumbuhan yang tumbuh di sana. Keadaannya seperti kehancuran Sodom dan Gomora, Adma dan Zeboim, yang dihancurkan Yahweh dalam kemarahan dan murka-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, susunannya dapat diterjemahkan, “Belerang dan garam, suatu pembakaran, seluruh tanahnya.”
    reason: Susunan klausa tanpa verba dan fungsi שְׂרֵפָה memungkinkan beberapa cara pengungkapan; catatan ini mempertahankan bentuk dan ambiguitas sumber.
lexical_decisions:
- source_word: גָּפְרִית וָמֶלַח
  choice: belerang dan garam
  rationale: Padanan langsung dan lazim dalam bahasa Indonesia; pasangan ini menggambarkan tanah yang tandus dan hancur.
- source_word: שְׂרֵפָה כָל אַרְצָהּ
  choice: seluruh tanahnya ... suatu tempat yang hangus terbakar
  rationale: Klausa Ibrani tidak memakai verba dan susunan tepatnya padat. Ungkapan ini menyampaikan bahwa seluruh negeri berada dalam keadaan terbakar dan rusak, sambil mempertahankan citra api.
- source_word: לֹא תִזָּרַע
  choice: tidak ditaburi benih
  rationale: Mempertahankan bentuk pasif Ibrani dan menggambarkan keadaan tanah tersebut tanpa menambahkan gagasan bahwa tanah itu mustahil ditaburi.
- source_word: וְלֹא תַצְמִחַ
  choice: tidak menumbuhkan apa pun
  rationale: Bentuk kausatif menunjukkan bahwa tanah itu tidak menghasilkan pertumbuhan. 'Apa pun' membuat objek tersiratnya jelas secara alami dalam bahasa Indonesia.
- source_word: וְלֹא יַעֲלֶה בָהּ כָּל עֵשֶׂב
  choice: tidak ada tumbuhan yang tumbuh di sana
  rationale: עֵשֶׂב dapat menunjuk rumput, tanaman, atau tumbuh-tumbuhan. 'Tumbuhan' sesuai dengan konteks kemandulan total dan tidak mempersempit maknanya.
- source_word: כְּמַהְפֵּכַת ... אֲשֶׁר הָפַךְ
  choice: seperti kehancuran ... yang dihancurkan
  rationale: Pengulangan 'kehancuran/dihancurkan' mempertahankan hubungan antara nomina dan verba serumpun dalam bahasa Ibrani, dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: סְדֹם וַעֲמֹרָה אַדְמָה וּצְבֹיִים
  choice: Sodom dan Gomora, Adma dan Zeboim
  rationale: Mengikuti bentuk nama tempat yang lazim dan mudah dikenali dalam bahasa Indonesia.
- source_word: בְּאַפּוֹ וּבַחֲמָתוֹ
  choice: dalam kemarahan dan murka-Nya
  rationale: Mempertahankan dua istilah Ibrani yang berpasangan dan intensitas penghakiman ilahi tanpa menerjemahkan idiom antropomorfis secara kaku.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama diri ilahi YHWH. 'Yahweh' mempertahankan nama itu, bukan menggantinya dengan gelar, dan tidak menambahkan penafsiran denominatif.
- issue: Sifat tindakan ilahi terhadap kota-kota tersebut
  choice: yang dihancurkan Yahweh dalam kemarahan dan murka-Nya
  alternative: yang dijungkirbalikkan Yahweh dalam kemarahan dan murka-Nya
  rationale: '''Dihancurkan'' menyampaikan hasil katastrofis dari הפך secara alami, sedangkan alternatif lebih dekat pada citra harfiah ''membalikkan''. Teks tetap secara langsung menghubungkan kehancuran itu dengan kemarahan ilahi.'
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Pengulangan seperlunya dipertahankan untuk menampilkan urutan tandusnya tanah, sementara klausa pembuka ditata ulang agar alami. Huruf kapital pada pronomina '-Nya' mengikuti konvensi Indonesia ketika merujuk kepada Allah.
