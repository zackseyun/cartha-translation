  text: וְ/לֹֽא נָתַן֩ יְהוָ֨ה לָ/כֶ֥ם לֵב֙ לָ/דַ֔עַת וְ/עֵינַ֥יִם לִ/רְא֖וֹת וְ/אָזְנַ֣יִם לִ/שְׁמֹ֑עַ עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/003.yaml
  text: But Yahweh has not given you a heart to know[a], or eyes to see, or ears to hear, to this day.
translation:
  language: id
  text: Namun, sampai hari ini Yahweh belum memberi kalian hati untuk mengetahui, mata untuk melihat, dan telinga untuk mendengar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלֹא
  choice: Namun ... belum
  rationale: Kata penghubung וְ dalam konteks ini mengontraskan ayat tersebut dengan apa yang telah Israel saksikan sebelumnya. “Namun” menyatakan kontras itu secara alami, sedangkan “belum” sesuai dengan keadaan yang berlangsung sampai hari yang disebutkan.
- source_word: נָתַן
  choice: memberi
  rationale: Makna dasar נָתַן dipertahankan tanpa menambahkan nuansa khusus seperti “mengaruniakan”. Bersama “belum” dan frasa “sampai hari ini”, bentuk ini menyatakan tindakan yang belum terjadi hingga saat tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: לָכֶם
  choice: kalian
  rationale: Pronomina orang kedua jamak dalam bahasa Ibrani dinyatakan secara eksplisit dengan “kalian”, karena Musa sedang berbicara kepada umat secara kolektif.
- source_word: לֵב לָדַעַת
  choice: hati untuk mengetahui
  rationale: “Hati” mempertahankan gambaran antropologis Ibrani yang mencakup pengertian dan sikap batin; “mengetahui” mempertahankan arti langsung ידע tanpa mempersempitnya menjadi sekadar pemahaman intelektual.
- source_word: וְעֵינַיִם לִרְאוֹת וְאָזְנַיִם לִשְׁמֹעַ
  choice: mata untuk melihat, dan telinga untuk mendengar
  rationale: Susunan sejajar dan kata penghubung Ibrani dipertahankan dalam ungkapan Indonesia yang alami.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Padanan ini menyatakan bahwa keadaan tersebut berlanjut hingga titik waktu yang sedang dibicarakan. Penempatannya di awal membuat cakupan waktunya atas seluruh pernyataan jelas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Tindakan ilahi dalam ketiadaan pengertian Israel
  choice: Yahweh dinyatakan belum memberi hati, mata, dan telinga yang diperlukan untuk mengetahui, melihat, dan mendengar secara batiniah.
  alternative: Menafsirkan pernyataan itu hanya sebagai kegagalan manusia, atau melunakkannya menjadi bahwa Yahweh sekadar membiarkan keadaan tersebut.
  rationale: Teks Ibrani secara langsung menjadikan Yahweh subjek dari “memberi” yang dinegasikan. Terjemahan mempertahankan pernyataan dan ketegangan teologis itu tanpa menjelaskan lebih jauh hubungan antara tindakan ilahi dan tanggung jawab manusia.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kalian” dipakai untuk menandai bentuk jamak sumber dengan jelas; struktur konkret “hati ... mata ... telinga” dipertahankan.
