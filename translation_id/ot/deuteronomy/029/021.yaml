  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/אָמַ֞ר הַ/דּ֣וֹר הָֽ/אַחֲר֗וֹן בְּנֵי/כֶם֙ אֲשֶׁ֤ר יָק֨וּמוּ֙ מֵ/אַ֣חֲרֵי/כֶ֔ם וְ/הַ֨/נָּכְרִ֔י אֲשֶׁ֥ר יָבֹ֖א מֵ/אֶ֣רֶץ רְחוֹקָ֑ה וְ֠/רָאוּ אֶת מַכּ֞וֹת הָ/אָ֤רֶץ הַ/הִוא֙ וְ/אֶת תַּ֣חֲלֻאֶ֔י/הָ אֲשֶׁר חִלָּ֥ה יְהוָ֖ה בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/021.yaml
  text: 'And the generation to come—your children who rise up after you—and the foreigner who comes from a distant land will say[c][b][a], when they see the plagues of that land and its sicknesses with which Yahweh has afflicted it:'
translation:
  language: id
  text: 'Generasi yang akan datang[a]—anak-anakmu yang hidup sesudah kamu—dan orang asing yang datang dari negeri yang jauh akan berkata ketika mereka melihat tulah-tulah yang menimpa negeri itu dan penyakit-penyakitnya yang Yahweh timpakan atasnya[b][c]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “generasi kemudian”. Ungkapan Ibrani ini menunjuk pada suatu generasi sesudah generasi yang sedang diajak bicara, tidak harus generasi terakhir dalam sejarah.
    reason: lexical_alternative
  - marker: b
    text: Atau “penyakit-penyakitnya” dapat diterjemahkan “wabah-wabahnya” atau “penderitaan-penderitaannya”.
    reason: lexical_alternative
  - marker: c
    text: Secara lebih harfiah, “yang Yahweh telah membuat sakit di dalamnya” atau “yang Yahweh telah timpakan di atasnya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: akan berkata
  rationale: Bentuk Ibrani ini secara morfologis tunggal dan mendahului subjek gabungan, yaitu generasi mendatang dan orang asing. Bahasa Indonesia tidak menandai jumlah pada verba, sehingga bentuk ini mempertahankan susunan dan cakupan sumber secara alami.
- source_word: הַדּוֹר הָאַחֲרוֹן
  choice: generasi yang akan datang
  rationale: Dalam konteks ini, ungkapan tersebut menunjuk pada generasi sesudah para pendengar sekarang, bukan dengan pasti pada generasi terakhir dalam sejarah.
- source_word: בְּנֵיכֶם אֲשֶׁר יָקֻמוּ מֵאַחֲרֵיכֶם
  choice: anak-anakmu yang muncul sesudah kamu
  rationale: בָּנִים dapat berarti anak-anak atau keturunan. Pilihan ini mempertahankan gambaran hubungan antargenerasi tanpa membatasi rujukannya hanya pada laki-laki.
- source_word: וְהַנָּכְרִי
  choice: dan orang asing
  rationale: נָכְרִי menunjuk pada seseorang dari luar Israel; 'orang asing' merupakan padanan Indonesia modern yang jelas.
- source_word: מֵאֶרֶץ רְחוֹקָה
  choice: dari negeri yang jauh
  rationale: Padanan ini alami dan mempertahankan gagasan jarak geografis.
- source_word: וְרָאוּ
  choice: ketika mereka melihat
  rationale: Waw dengan bentuk perfektum di sini menyatakan keadaan atau urutan yang mendahului perkataan mereka. Klausa temporal membuat hubungan itu jelas dalam bahasa Indonesia.
- source_word: מַכּוֹת
  choice: tulah-tulah
  rationale: מַכּוֹת dapat berarti pukulan atau bencana hukuman. Dalam konteks kutuk perjanjian dan kehancuran negeri, 'tulah-tulah' menyampaikan bencana yang menimpa sebagai hukuman.
- source_word: תַּחֲלֻאֶיהָ
  choice: penyakit-penyakitnya
  rationale: Bentuk jamak ini berarti penyakit atau keadaan sakit. Bentuk jamak dipertahankan dan sufiksnya merujuk kepada negeri itu.
- source_word: חִלָּה
  choice: ditimpakan
  rationale: Bentuk piel dari חלה dapat berarti membuat sakit atau menimpakan penderitaan. 'Ditimpakan' alami dalam konteks tulah dan penyakit, sedangkan gambaran harfiahnya dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks sumber dipertahankan sebagai nama diri, bukan diganti dengan sebuah gelar.
- source_word: בָּהּ
  choice: kepadanya
  rationale: Pronomina feminin tunggal merujuk kembali kepada negeri itu. 'Kepadanya' mempertahankan rujukan tersebut dengan susunan Indonesia yang alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. Bentuk 'Yahweh' mempertahankan nama itu, sedangkan 'TUHAN' merupakan penggantian tradisional dengan gelar.
- issue: Cakupan בְּנֵיכֶם
  choice: anak-anakmu
  alternative: anak-anak lelakimu; keturunanmu
  rationale: Bentuk maskulin jamak Ibrani dapat menunjuk secara kolektif pada anak atau keturunan. 'Anak-anakmu' menjaga hubungan kekeluargaan tanpa mempersempitnya hanya kepada laki-laki; 'keturunanmu' juga mungkin, tetapi kurang mempertahankan ungkapan konkret sumber.
- issue: Makna הַדּוֹר הָאַחֲרוֹן
  choice: generasi yang akan datang
  alternative: generasi kemudian; generasi terakhir
  rationale: Konteks menuntut generasi yang hidup setelah generasi sekarang, tetapi tidak menetapkan bahwa itu adalah generasi paling akhir secara eskatologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Tanda pisah mempertahankan aposisi yang menjelaskan siapa generasi mendatang itu. Bentuk ulang pada 'tulah-tulah' dan 'penyakit-penyakit' mempertahankan jamak Ibrani, sedangkan titik dua menjaga kesinambungan dengan pertanyaan atau ucapan pada ayat berikutnya.
