  text: וְ/לֹ֥א אִתְּ/כֶ֖ם לְ/בַדְּ/כֶ֑ם אָנֹכִ֗י כֹּרֵת֙ אֶת הַ/בְּרִ֣ית הַ/זֹּ֔את וְ/אֶת הָ/אָלָ֖ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/013.yaml
  text: And it is not with you alone that I am making this covenant and this oath[b][a],
translation:
  language: id
  text: Bukan hanya dengan kalian aku mengikat perjanjian ini dan sumpah ini.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani berbunyi “memotong perjanjian ini”; “mengikat perjanjian ini” menerjemahkan idiom Ibrani tersebut secara alami dalam bahasa Indonesia.
    reason: lexical_alternative
  - marker: b
    text: Atau “dan kutuk ini.” Istilah Ibrani ini dapat menunjuk pada sumpah itu sendiri atau pada kutuk sebagai sanksi yang melekat pada sumpah tersebut.
    reason: alternative_reading
lexical_decisions:
- source_word: וְלֹא אִתְּכֶם לְבַדְּכֶם
  choice: Bukan hanya dengan kalian
  rationale: 'Susunan ini secara alami menyatakan penyangkalan terhadap pembatasan: perjanjian itu tidak dibuat hanya dengan orang-orang yang hadir. Kata ganti jamak "kalian" mempertahankan bentuk orang kedua jamak.'
- source_word: אָנֹכִי
  choice: aku
  rationale: Kata ganti mandiri menyatakan subjek secara eksplisit dan dapat mengandung penekanan. "Aku" mempertahankan gaya tuturan langsung tanpa menambahkan penegasan yang berlebihan.
- source_word: כֹּרֵת אֶת הַבְּרִית הַזֹּאת
  choice: aku mengikat perjanjian ini
  rationale: Secara harfiah idiom Ibrani memakai kata "memotong" untuk pembentukan perjanjian. Dalam bahasa Indonesia, "mengikat perjanjian" merupakan padanan idiomatis yang alami dan tetap mempertahankan nuansa ikatan resmi.
- source_word: וְאֶת הָאָלָה הַזֹּאת
  choice: dan sumpah ini
  rationale: אָלָה dapat menunjuk pada sumpah yang mengandung sanksi kutuk. "Sumpah" paling jelas dalam teks utama, sedangkan kemungkinan arti "kutuk" dicatat agar cakupan katanya tidak dipersempit.
theological_decisions:
- issue: Makna אָלָה dalam konteks perjanjian
  choice: sumpah
  alternative: kutuk
  rationale: Istilah ini dapat menyatakan sumpah perjanjian sekaligus kutuk yang menjadi sanksinya. Teks utama memakai "sumpah" untuk tindakan pengesahan, sementara catatan kaki mempertahankan dimensi kutuk tanpa memutuskan ketegangan semantisnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang lugas dan bermartabat. "Kalian" dipakai untuk memperlihatkan bahwa sapaan Ibraninya berbentuk jamak; "mengikat perjanjian" dipilih sebagai idiom Indonesia yang alami.
