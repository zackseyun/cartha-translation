  text: וַ/יִּתְּשֵׁ֤/ם יְהוָה֙ מֵ/עַ֣ל אַדְמָתָ֔/ם בְּ/אַ֥ף וּ/בְ/חֵמָ֖ה וּ/בְ/קֶ֣צֶף גָּד֑וֹל וַ/יַּשְׁלִכֵ֛/ם אֶל אֶ֥רֶץ אַחֶ֖רֶת כַּ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/027.yaml
  text: So Yahweh uprooted them from their land in anger[a], fury, and great wrath, and cast them into another land[b], as it is this day.
translation:
  language: id
  text: Maka Yahweh mencabut[a] mereka dari negeri mereka dalam kemarahan, kegeraman, dan murka yang besar, lalu melemparkan mereka ke negeri lain, seperti pada hari ini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “merenggut” atau “mencabut sampai lepas.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “seperti hari ini”; suatu ungkapan yang merujuk pada keadaan yang nyata pada waktu itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּשֵׁם
  choice: mencabut mereka
  rationale: Kata kerja נתשׁ menggambarkan tindakan mencabut atau merenggut hingga lepas, sering kali memakai gambaran tumbuhan. “Mencabut” mempertahankan gambaran keras tentang umat yang disingkirkan dari tanahnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama perjanjian itu tetap tampil sebagai nama diri, bukan diganti dengan gelar.
- source_word: מֵעַל אַדְמָתָם
  choice: dari tanah mereka
  rationale: Dalam konteks kehilangan wilayah dan pembuangan, אֲדָמָה paling wajar diterjemahkan “tanah”; frasa ini juga mempertahankan kaitannya dengan gambaran mencabut.
- source_word: בְּאַף וּבְחֵמָה וּבְקֶצֶף גָּדוֹל
  choice: dalam kemarahan, kemurkaan, dan kegusaran yang besar
  rationale: Tiga istilah yang berdekatan maknanya dipertahankan sebagai rangkaian untuk menyampaikan penumpukan retoris dan intensitas penghakiman dalam bahasa Ibrani.
- source_word: וַיַּשְׁלִכֵם
  choice: lalu melemparkan mereka
  rationale: Kata שלך berarti melemparkan atau mencampakkan. “Melemparkan” mempertahankan daya tindakan tersebut sekaligus tetap wajar dalam bahasa Indonesia.
- source_word: אֶל אֶרֶץ אַחֶרֶת
  choice: ke negeri lain
  rationale: “Negeri” secara alami menunjuk wilayah asing yang menjadi tujuan pembuangan, sedangkan “ke” menyatakan perpindahan ke sana.
- source_word: כַּיּוֹם הַזֶּה
  choice: seperti keadaannya pada hari ini
  rationale: Ungkapan Ibrani ini menunjuk pada keadaan yang masih nyata pada waktu penuturan. Terjemahan ini menyampaikan maksud idiomatisnya tanpa menghapus rujukan kepada “hari ini”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan sebuah gelar.
- issue: Rangkaian istilah murka ilahi
  choice: kemarahan, kemurkaan, dan kegusaran yang besar
  alternative: meringkas rangkaian itu menjadi satu istilah, seperti “murka yang sangat besar”
  rationale: Bahasa Ibrani sengaja menumpuk tiga istilah yang tumpang tindih maknanya. Terjemahan mempertahankan ketiganya agar intensitas dan tekanan teologis teks tidak diratakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan tiga istilah kemarahan sengaja dipertahankan untuk meniru penumpukan retoris teks Ibrani; gambaran “mencabut” dan “melemparkan” juga dipertahankan karena merupakan unsur penting dalam penggambaran penghakiman dan pembuangan.
