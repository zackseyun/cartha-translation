revisions:
- from: Maka Yahweh mencabut[a] mereka dari tanah mereka dalam kemarahan, kemurkaan, dan kegusaran yang besar, lalu melemparkan mereka ke negeri lain, seperti keadaannya pada hari ini.[b]
  to: Maka Yahweh mencabut[a] mereka dari negeri mereka dalam kemarahan, kegeraman, dan murka yang besar, lalu melemparkan mereka ke negeri lain, seperti pada hari ini.[b]
  rationale: Revisi memperjelas bahwa objek kehilangan adalah negeri/wilayah mereka dalam konteks pembuangan, mempertahankan tiga istilah amarah dengan diksi Indonesia modern yang lebih lazim, dan mengembalikan formula penutup lebih dekat kepada bentuk Ibrani. Catatan kaki b memelihara penjelasan idiomatis tanpa memasukkannya ke dalam teks utama.
