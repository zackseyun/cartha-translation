revisions:
- from: Musa memanggil seluruh Israel dan berkata kepada mereka, “Kalian telah melihat segala yang dilakukan Yahweh di depan mata kalian di tanah Mesir terhadap Firaun, semua hambanya, dan seluruh negerinya[a].”
  to: Musa memanggil seluruh Israel dan berkata kepada mereka, “Kalian telah melihat segala yang telah dilakukan Yahweh di depan mata kalian di tanah Mesir kepada Firaun, kepada semua hamba-hambanya, dan kepada seluruh negerinya[a].”
  rationale: Revisi mempertahankan keluasan makna kata depan לְ dalam teks utama melalui “kepada,” sambil menaruh pembacaan kontekstual yang adversatif di catatan kaki. Catatan kaki diperbaiki agar alternatif Indonesianya menyatakan relasi yang dimaksud tanpa mengubahnya menjadi ungkapan tujuan. Pengulangan “kepada” mencerminkan pengulangan kata depan Ibrani dan meningkatkan kejelasan struktur.
