  text: וַ/יִּקְרָ֥א מֹשֶׁ֛ה אֶל כָּל יִשְׂרָאֵ֖ל וַ/יֹּ֣אמֶר אֲלֵ/הֶ֑ם אַתֶּ֣ם רְאִיתֶ֗ם אֵ֣ת כָּל אֲשֶׁר֩ עָשָׂ֨ה יְהוָ֤ה לְ/עֵֽינֵי/כֶם֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם לְ/פַרְעֹ֥ה וּ/לְ/כָל עֲבָדָ֖י/ו וּ/לְ/כָל אַרְצֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/001.yaml
  text: And Moses called all Israel and said to them[a], “You have seen all that Yahweh did before your eyes in the land of Egypt, to Pharaoh and to all his servants and to all his land.”
translation:
  language: id
  text: Musa memanggil seluruh Israel dan berkata kepada mereka, “Kalian telah melihat segala yang telah dilakukan Yahweh di depan mata kalian di tanah Mesir kepada Firaun, kepada semua hamba-hambanya, dan kepada seluruh negerinya[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “terhadap Firaun, semua hamba-hambanya, dan seluruh negerinya.” Dalam konteks ini, kata depan Ibrani dapat dipahami secara lebih interpretatif untuk menunjukkan bahwa tindakan Yahweh adalah penghakiman atas mereka.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: memanggil
  rationale: Dalam konteks ini קרא berarti memanggil atau menghimpun orang untuk mendengarkan. “Memanggil” alami dalam bahasa Indonesia dan tidak menambahkan tingkat keformalan yang tidak dinyatakan.
- source_word: כָּל יִשְׂרָאֵל
  choice: seluruh Israel
  rationale: Ungkapan ini menunjuk secara kolektif kepada umat perjanjian. “Seluruh Israel” ringkas, alami, dan mempertahankan cakupan כָּל.
- source_word: רְאִיתֶם
  choice: kalian telah melihat
  rationale: Bentuk perfek merujuk pada pengalaman yang telah disaksikan para pendengar dan masih relevan bagi mereka. “Kalian” juga menyatakan dengan jelas bahwa kata ganti Ibrani berbentuk jamak.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: לְעֵינֵיכֶם
  choice: di depan mata kalian
  rationale: Ungkapan ini menekankan bahwa peristiwa tersebut terlihat langsung oleh para pendengar. Padanan Indonesia ini mempertahankan gambaran konkret bahasa Ibrani.
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: di tanah Mesir
  rationale: Terjemahan ini mempertahankan unsur אֶרֶץ, “tanah/negeri”, dan tetap terdengar wajar dalam bahasa Indonesia.
- source_word: לְפַרְעֹה וּלְכָל עֲבָדָיו וּלְכָל אַרְצוֹ
  choice: terhadap Firaun, semua hambanya, dan seluruh negerinya
  rationale: Kata depan לְ menandai pihak-pihak yang dikenai tindakan Yahweh. “Terhadap” cukup alami dan relatif netral, sedangkan kemungkinan nuansa permusuhan atau penghukuman dijaga dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama perjanjian ilahi secara langsung. “Yahweh” mempertahankan nama itu alih-alih menggantinya dengan sebuah gelar.
- issue: Arah tindakan Yahweh kepada Firaun dan Mesir
  choice: terhadap Firaun, semua hambanya, dan seluruh negerinya
  alternative: untuk melawan atau menghukum Firaun, semua hambanya, dan seluruh negerinya
  rationale: Konteks menunjukkan tindakan penghakiman, tetapi kata depan לְ sendiri tidak harus secara eksplisit berarti “melawan”. Teks utama mempertahankan keluasan maknanya, sementara catatan kaki menyampaikan pembacaan kontekstual yang mungkin.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Kalian” dipakai untuk memperjelas bentuk jamak orang kedua; “hamba” mempertahankan hubungan pelayanan atau ketundukan kepada Firaun tanpa membatasi istilah itu hanya pada pejabat.
