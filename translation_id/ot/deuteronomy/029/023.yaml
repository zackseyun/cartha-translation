  text: וְ/אָֽמְרוּ֙ כָּל הַ/גּוֹיִ֔ם עַל מֶ֨ה עָשָׂ֧ה יְהוָ֛ה כָּ֖כָה לָ/אָ֣רֶץ הַ/זֹּ֑את מֶ֥ה חֳרִ֛י הָ/אַ֥ף הַ/גָּד֖וֹל הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/023.yaml
  text: And all the nations will say[a], ‘Why has Yahweh done thus to this land? Why this great burning anger?’
translation:
  language: id
  text: Semua bangsa akan berkata[a], “Mengapa Yahweh berbuat demikian terhadap negeri ini? Mengapa murka besar ini membara?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “Mengapa Yahweh berbuat demikian terhadap negeri ini? Mengapa panas murka besar ini?”
    reason: Mempertahankan bentuk pertanyaan sebab dalam bahasa Ibrani serta metafora ‘panas’ untuk murka, meskipun susunan ini kurang alami dalam bahasa Indonesia.
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: akan berkata
  rationale: Bentuk perfektum dengan waw dalam konteks nubuat-perjanjian ini menunjuk pada tanggapan bangsa-bangsa yang akan terjadi; bentuk futur alami dalam bahasa Indonesia.
- source_word: כָּל הַגּוֹיִם
  choice: semua bangsa
  rationale: גּוֹיִם di sini menunjuk pada bangsa-bangsa asing yang menyaksikan kehancuran negeri Israel; frasa ini mempertahankan cakupan kolektifnya.
- source_word: עַל מֶה
  choice: mengapa
  rationale: Ungkapan Ibrani ini menanyakan sebab; “mengapa” merupakan padanan Indonesia yang alami dan tepat.
- source_word: עָשָׂה ... כָּכָה
  choice: berbuat demikian
  rationale: Padanan ini mempertahankan arti harfiah ‘berbuat seperti itu/demikian’ sekaligus terdengar wajar dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: לָאָרֶץ הַזֹּאת
  choice: terhadap negeri ini
  rationale: אָרֶץ dalam konteks ini adalah negeri perjanjian yang terkena penghukuman; “negeri” lebih alami daripada “tanah” ketika dipandang sebagai wilayah suatu bangsa.
- source_word: חֳרִי הָאַף הַגָּדוֹל הַזֶּה
  choice: murka yang begitu besar ini menyala
  rationale: חֳרִי membawa citra panas atau nyala, sedangkan אַף secara idiomatis berarti murka. Susunan Indonesia ini mempertahankan metafora nyala dan besarnya murka tanpa menerjemahkan אַף secara harfiah sebagai ‘hidung’.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan fungsi nama perjanjian dan tidak menggantinya dengan sebuah gelar.
- issue: Hubungan murka dengan Yahweh pada pertanyaan kedua
  choice: Tidak menambahkan kata ganti “-Nya”
  alternative: murka-Nya menyala begitu hebat
  rationale: Konteks jelas menghubungkan murka itu dengan Yahweh, tetapi teks Ibrani tidak memuat kata ganti kepunyaan. Terjemahan mempertahankan hubungan kontekstual tanpa membuatnya lebih eksplisit daripada sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Berbuat demikian” mempertahankan nada formal teks, sedangkan pertanyaan kedua disusun secara alami tanpa menghilangkan metafora murka yang menyala.
