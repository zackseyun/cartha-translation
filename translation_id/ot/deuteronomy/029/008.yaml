  text: So keep the words of this covenant and do them[a], so that you may act wisely in all that you do.
translation:
  language: id
  text: Jadi, peliharalah perkataan-perkataan perjanjian ini dan lakukanlah semuanya, supaya kamu bertindak bijaksana dalam segala yang kamu lakukan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “berhasil” dalam segala yang kamu lakukan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: Jadi, peganglah
  rationale: Dalam konteks perjanjian, שׁמר berarti memegang atau menaati kewajiban. Bentuk ini mempertahankan daya ungkap perjanjian dan kaitan inferensial dengan konteks sebelumnya.
- source_word: דִּבְרֵי הַבְּרִית הַזֹּאת
  choice: perkataan-perkataan perjanjian ini
  rationale: Terjemahan ini dekat dengan bentuk Ibrani dan mempertahankan acuan jamak yang kemudian dirujuk oleh אֹתָם.
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: dan lakukanlah semuanya
  rationale: אֹתָם berbentuk jamak dan merujuk pada perkataan-perkataan perjanjian. 'Semuanya' terdengar lebih alami dalam bahasa Indonesia daripada 'lakukanlah itu semua' sambil mempertahankan cakupan jamaknya.
- source_word: לְמַעַן
  choice: supaya
  rationale: Menandai tujuan atau hasil secara alami dalam bahasa Indonesia modern.
- source_word: תַּשְׂכִּילוּ
  choice: kamu bertindak bijaksana
  rationale: Hifil dari שׂכל dapat berarti bertindak dengan bijaksana, berhasil, atau beruntung. Pilihan utama mempertahankan unsur tindakan bijaksana tanpa menutup kemungkinan nuansa keberhasilan.
- source_word: אֵת כָּל אֲשֶׁר תַּעֲשׂוּן
  choice: dalam segala yang kamu lakukan
  rationale: Ungkapan ini menyatakan lingkup menyeluruh dari tindakan Israel dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Nuansa hikmat dan keberhasilan dalam תַּשְׂכִּילוּ
  choice: bertindak bijaksana
  alternative: berhasil atau beruntung
  rationale: Kata Ibrani dapat menunjuk pada tindakan yang bijaksana maupun keberhasilan yang menyertainya. Teks utama memilih nuansa tindakan, sedangkan catatan kaki mempertahankan kemungkinan nuansa hasil, tanpa mengimpor gagasan teologi kemakmuran.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk jamak 'perkataan-perkataan' dipertahankan agar hubungan dengan pronomina jamak dalam bahasa Ibrani tetap terlihat; 'lakukanlah semuanya' menghindari kekakuan yang berlebihan.
