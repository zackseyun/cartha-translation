  - severity: low
    issue: “Peganglah perkataan-perkataan” kurang alami
    rationale: Dalam konteks kewajiban perjanjian, “peliharalah” lebih idiomatis daripada “peganglah” dan tetap mencakup gagasan menaati/mematuhi tanpa membuatnya terlalu interpretatif.
