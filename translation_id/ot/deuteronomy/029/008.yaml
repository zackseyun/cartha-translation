  rationale: Revisi terbatas pada pilihan yang lebih idiomatis untuk שׁמר dalam konteks perjanjian dan pada penghapusan alternatif “beruntung” yang menimbulkan nuansa keberuntungan acak. Ambiguitas semantis שׂכל antara tindakan bijaksana dan keberhasilan tetap dipelihara melalui teks utama dan catatan kaki.
