  text: לְמַ֣עַן הָקִֽים אֹתְ/ךָ֩ הַ/יּ֨וֹם ל֜/וֹ לְ/עָ֗ם וְ/ה֤וּא יִֽהְיֶה לְּ/ךָ֙ לֵֽ/אלֹהִ֔ים כַּ/אֲשֶׁ֖ר דִּבֶּר לָ֑/ךְ וְ/כַ/אֲשֶׁ֤ר נִשְׁבַּע֙ לַ/אֲבֹתֶ֔י/ךָ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹֽב־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/012.yaml
  text: so that today he may establish you as a people for himself[a], and he himself may be your God, just as he spoke to you and as he swore to your fathers, to Abraham, to Isaac[b], and to Jacob.
translation:
  language: id
  text: supaya hari ini Dia menetapkan engkau sebagai umat bagi diri-Nya sendiri[a], dan Dia akan menjadi Allahmu, seperti yang telah Dia katakan kepadamu dan seperti Dia telah bersumpah kepada nenek moyangmu, yaitu kepada Abraham, Ishak, dan Yakub.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “menetapkan engkau bagi-Nya sebagai suatu umat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַעַן
  choice: supaya
  rationale: Menandai tujuan atau hasil; “supaya” alami dalam bahasa Indonesia dan mempertahankan daya purposifnya.
- source_word: הָקִים אֹתְךָ הַיּוֹם
  choice: hari ini Dia menetapkan engkau
  rationale: Bentuk Hifil dari קום menyatakan tindakan menegakkan atau menetapkan dalam kedudukan perjanjian. “Engkau” mempertahankan sapaan tunggal yang secara kolektif ditujukan kepada Israel.
- source_word: לוֹ לְעָם
  choice: sebagai umat bagi diri-Nya sendiri
  rationale: Mencerminkan susunan Ibrani yang menekankan bahwa umat itu menjadi milik Allah, tanpa mereduksinya menjadi sekadar identitas sosial.
- source_word: וְהוּא יִהְיֶה לְךָ לֵאלֹהִים
  choice: dan Dia menjadi Allahmu
  rationale: Ungkapan Indonesia yang alami bagi rumusan perjanjian “Dia akan menjadi Allah bagimu”; subjek “Dia” tetap dinyatakan untuk mempertahankan penekanan Ibrani.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: seperti yang telah dikatakan-Nya kepadamu
  rationale: Mempertahankan arti dasar דבר, “berkata/berbicara,” dan tidak menyamakannya dengan tindakan bersumpah yang disebut sesudahnya.
- source_word: וְכַאֲשֶׁר נִשְׁבַּע
  choice: dan seperti yang telah disumpahkan-Nya
  rationale: נשבע secara khusus menunjuk pada pengucapan sumpah; bentuk ini ringkas dan jelas dalam konteks janji perjanjian.
- source_word: לַאֲבֹתֶיךָ
  choice: kepada nenek moyangmu
  rationale: Ungkapan Indonesia yang alami untuk para leluhur laki-laki yang langsung disebutkan sebagai Abraham, Ishak, dan Yakub.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: yaitu kepada Abraham, Ishak, dan Yakub
  rationale: “Yaitu” memperjelas bahwa ketiga nama itu menjabarkan “nenek moyangmu”; preposisi “kepada” dipertahankan sebelum rangkaian nama secara alami.
theological_decisions:
- issue: Rumusan hubungan perjanjian
  choice: umat bagi diri-Nya sendiri ... Allahmu
  alternative: umat-Nya ... menjadi Allah bagimu
  rationale: Pilihan ini mempertahankan kedua sisi hubungan perjanjian serta penekanan kepemilikan dalam לוֹ, tanpa menjelaskan lebih jauh sifat teologis hubungan tersebut.
- issue: Nilai waktu יִהְיֶה dalam klausa tujuan
  choice: Dia menjadi Allahmu
  alternative: Dia akan menjadi Allahmu
  rationale: Dalam rangkaian yang diawali “supaya,” bahasa Indonesia secara alami memakai “menjadi”; pilihan ini tidak memaksakan apakah bentuk Ibrani terutama menonjolkan masa depan, hasil, atau peneguhan status perjanjian.
- issue: Sapaan tunggal kolektif
  choice: engkau ... -mu
  alternative: kalian ... kalian
  rationale: Bentuk tunggal Ibrani dipertahankan untuk menampilkan Israel sebagai satu umat yang disapa secara kolektif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina tunggal “engkau” dipakai untuk mengikuti sapaan kolektif Ibrani. Huruf kapital pada pronomina ilahi digunakan secara konsisten dalam ayat ini.
