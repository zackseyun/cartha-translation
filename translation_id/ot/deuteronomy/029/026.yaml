translation:
  language: id
  text: Maka murka Yahweh menyala terhadap negeri itu untuk mendatangkan ke atasnya segala kutuk yang tertulis dalam kitab ini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: murka ... menyala
  rationale: Ungkapan Ibrani ini secara harfiah menggambarkan amarah yang menyala. Pilihan ini mempertahankan citra kuat teks sumber dan tetap wajar serta bermartabat dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks Ibrani tetap tampak.
- source_word: בָּאָרֶץ הַהִוא
  choice: terhadap negeri itu
  rationale: Preposisi ב dalam konstruksi dengan חרה אף menandai sasaran murka. “Terhadap negeri itu” menyampaikan arah permusuhan atau penghukuman dengan jelas.
- source_word: לְהָבִיא
  choice: sehingga Ia mendatangkan
  rationale: Infinitif ini dapat menyatakan tujuan atau akibat. “Sehingga” mempertahankan hubungan akibat tanpa menutup sepenuhnya nuansa tujuan, sedangkan subjek “Ia” diperjelas secara alami dalam bahasa Indonesia.
- source_word: עָלֶיהָ
  choice: ke atasnya
  rationale: Akhiran pronominal merujuk kepada negeri itu. “Ke atasnya” mempertahankan gambaran kutuk yang didatangkan menimpa negeri tersebut.
- source_word: כָּל הַקְּלָלָה
  choice: setiap kutuk
  rationale: Walaupun bentuk Ibraninya tunggal, frasa ini memiliki cakupan menyeluruh. “Setiap kutuk” alami dalam bahasa Indonesia dan mempertahankan makna totalitas.
- source_word: הַכְּתוּבָה
  choice: yang tertulis
  rationale: Partisipel pasif berarti “yang tertulis”; bentuk ini mempertahankan daya tekstual dan yuridis ungkapan sumber.
- source_word: בַּסֵּפֶר הַזֶּה
  choice: dalam kitab ini
  rationale: סֵפֶר dapat berarti kitab, gulungan, atau dokumen. “Kitab” paling sesuai dengan konteks hukum perjanjian dan register Alkitab bahasa Indonesia tanpa menentukan bahan fisiknya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama ilahi YHWH secara langsung. Bentuk “Yahweh” mempertahankan nama pribadi dalam teks sumber tanpa menggantinya dengan gelar.
- issue: Hubungan לְהָבִיא dengan murka Yahweh
  choice: sehingga Ia mendatangkan
  alternative: untuk mendatangkan
  rationale: Infinitif ל dapat memuat nuansa tujuan maupun akibat. Dalam konteks ini, “sehingga” mengalir alami dan menampilkan kutuk sebagai konsekuensi murka, sambil tidak menyangkal unsur kesengajaan ilahi.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Citra Ibrani “murka ... menyala” dipertahankan; “negeri” dipilih karena rujukannya adalah wilayah yang terkena hukuman, dan “kitab” sesuai dengan konteks perjanjian tertulis.
