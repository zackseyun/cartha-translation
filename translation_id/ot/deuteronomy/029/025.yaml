  terminology: “Ilah-ilah lain” merupakan padanan yang baik untuk אֱלֹהִים אֲחֵרִים dalam kontras dengan Allah. Kapitalisasi “Dia” dapat dipertahankan karena pembacaan subjek ilahi diberi penjelasan dan alternatifnya tetap dicatat.
