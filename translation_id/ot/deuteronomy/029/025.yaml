base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/025.yaml
  text: and they went and served other gods and bowed down to them[a], gods whom they had not known and whom he had not allotted to them.
translation:
  language: id
  text: Mereka pergi dan melayani ilah-ilah lain serta bersujud kepada mereka, yaitu ilah-ilah yang tidak mereka kenal dan yang tidak Dia tetapkan menjadi bagian mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan yang tidak ditetapkan menjadi bagian mereka.” Dalam bahasa Ibrani, subjek verba tunggal ini tidak dinyatakan; kemungkinan besar subjeknya adalah Allah.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: Mereka pergi
  rationale: Mempertahankan arti dasar הלך dan urutan tindakan dalam ungkapan Ibrani tanpa mempersempitnya menjadi sekadar tindakan kiasan.
- source_word: וַיַּעַבְדוּ
  choice: melayani
  rationale: עבד berarti melayani atau mengabdi. Pilihan ini membedakannya dari tindakan sujud menyembah yang dinyatakan oleh verba berikutnya.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ilah-ilah lain
  rationale: Menyampaikan arti langsung אֲחֵרִים dan memakai 'ilah' untuk para dewa yang dipertentangkan dengan Allah dalam konteks ini.
- source_word: וַיִּשְׁתַּחֲווּ לָהֶם
  choice: sujud menyembah kepada mereka
  rationale: שׁחה menggambarkan tindakan membungkuk atau bersujud. Ungkapan ini mempertahankan gambaran fisik sekaligus makna kultisnya dalam bahasa Indonesia yang alami.
- source_word: אֱלֹהִים אֲשֶׁר לֹא יְדָעוּם
  choice: ilah-ilah yang tidak mereka kenal
  rationale: ידע dapat mencakup pengenalan relasional, bukan sekadar mengetahui keberadaan. 'Tidak mereka kenal' mempertahankan keluasan itu secara alami.
- source_word: וְלֹא חָלַק לָהֶם
  choice: dan yang tidak Dia berikan sebagai bagian kepada mereka
  rationale: חלק dalam bentuk Qal berarti membagi atau memberikan sebagai bagian. Huruf kapital pada 'Dia' menunjukkan subjek tunggal tersirat yang kemungkinan besar merujuk kepada Allah, sedangkan catatan kaki mempertahankan ambiguitas gramatikal.
theological_decisions:
- issue: Subjek tersirat dari verba tunggal חָלַק
  choice: 'Memahami subjek tersirat sebagai Allah: ''yang tidak Dia berikan sebagai bagian kepada mereka.'''
  alternative: 'Memahami klausa secara pasif: ''yang tidak diberikan sebagai bagian kepada mereka.'''
  rationale: Teks Ibrani memakai verba orang ketiga maskulin tunggal tanpa subjek eksplisit. Dalam konteks bahasa pembagian ilahi di Ulangan, Allah paling mungkin menjadi pelakunya, tetapi catatan kaki mempertahankan kemungkinan terjemahan pasif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Melayani' dan 'sujud menyembah' dipertahankan sebagai dua tindakan berbeda. Penanda catatan kaki ditempatkan sesudah klausa yang diterangkannya.
