  source_fidelity: 'Draf ini pada dasarnya setia kepada rangkaian verba Ibrani: mereka pergi, melayani ilah-ilah lain, dan bersujud kepada mereka. Klausa terakhir juga tepat memahami חָלַק sebagai tindakan pembagian/penetapan dengan subjek tunggal tersirat yang paling mungkin Allah. Namun, “berikan sebagai bagian” kurang idiomatis dalam bahasa Indonesia untuk pengalokasian ilah sebagai bagian yang ditetapkan.'
