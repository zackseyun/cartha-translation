id: DEU.29.17
reference: Deuteronomy 29:17
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: פֶּן יֵ֣שׁ בָּ֠/כֶם אִ֣ישׁ אוֹ אִשָּׁ֞ה א֧וֹ מִשְׁפָּחָ֣ה אוֹ שֵׁ֗בֶט אֲשֶׁר֩ לְבָב֨/וֹ פֹנֶ֤ה הַ/יּוֹם֙ מֵ/עִם֙ יְהוָ֣ה אֱלֹהֵ֔י/נוּ לָ/לֶ֣כֶת לַ/עֲבֹ֔ד אֶת אֱלֹהֵ֖י הַ/גּוֹיִ֣ם הָ/הֵ֑ם פֶּן יֵ֣שׁ בָּ/כֶ֗ם שֹׁ֛רֶשׁ פֹּרֶ֥ה רֹ֖אשׁ וְ/לַעֲנָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/017.yaml
  text: lest there be among you a man or a woman[a], or a clan or a tribe, whose heart is turning away today from Yahweh our God to go and serve the gods of those nations; lest there be among you a root bearing poisonous fruit and wormwood.
translation:
  language: id
  text: Jangan sampai di antara kalian ada laki-laki atau perempuan, kaum keluarga atau suku, yang hatinya pada hari ini sedang berpaling dari Yahweh, Allah kita, untuk pergi beribadah kepada dewa-dewa bangsa-bangsa itu. Jangan sampai di antara kalian ada akar yang menghasilkan buah beracun dan apsintus.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akar yang menghasilkan empedu dan apsintus.” Kata Ibrani yang diterjemahkan “buah beracun” dapat menunjuk pada racun atau, menurut terjemahan tradisional, empedu. Apsintus adalah tanaman yang terkenal sangat pahit.
    reason: Menjelaskan dua istilah tumbuhan/zat yang sukar dipastikan padanannya serta mempertahankan alternatif tradisional bagi רֹאשׁ.
lexical_decisions:
- source_word: פֶּן
  choice: jangan sampai
  rationale: Mengungkapkan peringatan terhadap kemungkinan bahaya secara alami dalam bahasa Indonesia dan mempertahankan daya cegah partikel Ibrani.
- source_word: יֵשׁ בָּכֶם
  choice: di antara kalian ada
  rationale: Mempertahankan konstruksi eksistensial serta acuan jamak kepada umat yang sedang disapa.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: laki-laki atau perempuan
  rationale: Mempertahankan pasangan gender yang disebut secara eksplisit dalam bahasa Ibrani.
- source_word: מִשְׁפָּחָה
  choice: kaum
  rationale: Dalam konteks sosial-perjanjian ini, istilah tersebut menunjuk pada kelompok kekerabatan yang lebih luas daripada keluarga inti.
- source_word: שֵׁבֶט
  choice: suku
  rationale: Merujuk pada satuan suku di Israel.
- source_word: לְבָבוֹ פֹנֶה
  choice: yang hatinya ... sedang berpaling
  rationale: Bentuk partisip Ibrani menyiratkan proses atau kecenderungan yang sedang berlangsung; ungkapan ini mempertahankan gambaran hati yang beralih kesetiaan.
- source_word: הַיּוֹם
  choice: pada hari ini
  rationale: Mempertahankan kedekatan waktu dan suasana perjanjian yang mendesak.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang dinyatakan langsung dalam teks Ibrani.
- source_word: לָלֶכֶת לַעֲבֹד
  choice: untuk pergi beribadah kepada
  rationale: Menyampaikan gerak yang bertujuan dan makna pelayanan kultis kepada dewa-dewa dengan bahasa Indonesia yang alami.
- source_word: אֱלֹהֵי הַגּוֹיִם הָהֵם
  choice: dewa-dewa bangsa-bangsa itu
  rationale: Membedakan ilah-ilah bangsa lain dari Yahweh dan mempertahankan acuan kepada bangsa-bangsa tersebut.
- source_word: שֹׁרֶשׁ פֹּרֶה רֹאשׁ וְלַעֲנָה
  choice: akar yang menghasilkan buah beracun dan apsintus
  rationale: Mempertahankan metafora akar dan dua unsur hasilnya; 'buah' membuat daya produktif פֹּרֶה alami dalam bahasa Indonesia, sedangkan 'apsintus' mempertahankan citra tanaman yang sangat pahit.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung; bentuk 'Yahweh' mempertahankannya sebagai nama, bukan menggantinya dengan gelar.
- issue: Makna berpalingnya hati
  choice: sedang berpaling
  alternative: telah berpaling
  rationale: Partisip פֹנֶה dapat menggambarkan proses atau kecenderungan yang berlangsung. Terjemahan ini tidak menetapkan bahwa kemurtadan sudah selesai.
- issue: Gambaran רֹאשׁ וְלַעֲנָה
  choice: buah beracun dan apsintus
  alternative: empedu dan apsintus
  rationale: רֹאשׁ dapat menunjuk pada zat atau hasil yang beracun maupun, secara tradisional, 'empedu'. Dalam metafora akar yang menghasilkan sesuatu, 'buah beracun' menyampaikan hasil mematikan tanpa meniadakan alternatif tradisional; לַעֲנָה dipertahankan sebagai tanaman pahit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Sapaan jamak diterjemahkan 'kalian' agar bentuk בָּכֶם jelas; 'kaum' dipakai untuk kelompok kekerabatan yang lebih luas daripada keluarga inti. Pengulangan 'Jangan sampai di antara kalian ada' dipertahankan untuk mencerminkan struktur dan tekanan retoris teks Ibrani.
