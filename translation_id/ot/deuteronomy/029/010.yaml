base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/010.yaml
  text: your little ones[a], your wives, and the sojourner who is in the midst of your camp, from the one who chops your wood to the one who draws your water[b],
translation:
  language: id
  text: anak-anakmu yang masih kecil[a], istri-istrimu, dan orang asing yang tinggal di tengah perkemahanmu[b], dari orang yang membelah kayumu sampai orang yang menimba airmu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “anak-anakmu.” Kata Ibrani טַף terutama menunjuk kepada anak-anak kecil dan dapat juga menyoroti mereka yang masih menjadi tanggungan.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, orang asing yang menetap di tengah masyarakat Israel. Kata Ibrani גֵּר bukan sekadar menunjuk kepada orang yang sedang berkunjung atau lewat.
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  choice: anak-anakmu yang masih kecil
  rationale: טַף terutama menunjuk kepada anak-anak kecil sebagai kelompok, dan dalam konteks tertentu dapat mencakup anggota keluarga yang masih menjadi tanggungan. Ungkapan ini mempertahankan arti konkret tanpa memperluasnya menjadi semua keturunan.
- source_word: נְשֵׁיכֶם
  choice: istri-istrimu
  rationale: Dalam daftar keluarga yang hadir dalam pertemuan perjanjian ini, bentuk jamak נָשִׁים dengan akhiran posesif paling wajar berarti para istri.
- source_word: וְגֵרְךָ
  choice: dan pendatang
  rationale: גֵּר menunjuk kepada orang asing yang menetap di tengah masyarakat, bukan sekadar orang yang sedang lewat. 'Pendatang' merupakan istilah Indonesia yang alami; keterangan berikutnya memperjelas bahwa ia tinggal dalam perkemahan.
- source_word: אֲשֶׁר בְּקֶרֶב מַחֲנֶיךָ
  choice: yang tinggal di tengah perkemahanmu
  rationale: Klausa relatif אֲשֶׁר dan ungkapan בְּקֶרֶב dilukiskan secara eksplisit. Kata 'tinggal' menyampaikan keadaan pendatang yang berada dan bermukim di lingkungan perkemahan, sedangkan 'di tengah' mempertahankan gambaran ruang sumber.
- source_word: מֵחֹטֵב עֵצֶיךָ
  choice: dari orang yang membelah kayumu
  rationale: Partisip חֹטֵב menggambarkan orang yang melakukan pekerjaan memotong atau membelah kayu. Bentuk verbal 'orang yang membelah' mempertahankan daya partisip dan menghindari kesan bahwa yang dimaksud harus sebuah jabatan resmi.
- source_word: עַד שֹׁאֵב מֵימֶיךָ
  choice: sampai orang yang menimba airmu
  rationale: שֹׁאֵב adalah partisip yang berarti mengambil atau menimba air. Pasangan 'dari ... sampai ...' mencerminkan rentang מִן ... עַד dan mempertahankan kesejajaran dengan pekerjaan membelah kayu.
theological_decisions:
- issue: Cakupan sosial pertemuan perjanjian
  choice: Daftar ini mencakup anak-anak kecil, para istri, pendatang yang menetap, dan orang-orang yang melakukan pekerjaan pelayanan sehari-hari.
  alternative: Membatasi daftar itu hanya kepada orang Israel secara etnis atau menganggap para pekerja sebagai golongan kiasan.
  rationale: Arti lugas teks menyebut berbagai unsur nyata dalam masyarakat yang hadir. Terjemahan mempertahankan keluasan sosial ini tanpa menambahkan kesimpulan doktrinal di luar ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk ulang 'anak-anakmu' dan 'istri-istrimu' menyampaikan kelompok jamak, sedangkan akhiran '-mu' mempertahankan sapaan orang kedua tanpa dapat atau perlu membedakan peralihan bentuk jamak ke tunggal kolektif dalam bahasa Ibrani. Teks dipertahankan sebagai fragmen daftar yang berlanjut dari ayat sebelumnya.
