base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/006.yaml
  text: When you came to this place[a], Sihon king of Heshbon and Og king of Bashan came out to meet us in battle[b], and we struck them down.
translation:
  language: id
  text: Ketika kamu tiba di tempat ini,[a] Sihon, raja Hesbon, dan Og, raja Basan, keluar menemui kita untuk berperang, lalu kita mengalahkan mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Lalu kamu tiba di tempat ini.” Bentuk naratif Ibrani dapat dipahami sebagai urutan sederhana atau sebagai latar waktu bagi tindakan berikutnya.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “kita memukul mereka.” Dalam konteks peperangan, kata Ibrani ini sering berarti mengalahkan pihak lawan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹאוּ
  choice: Ketika kamu tiba
  rationale: Bentuk wayyiqtol orang kedua jamak dari בוא menceritakan peristiwa lampau. Hubungan temporal dengan tindakan berikutnya disampaikan secara alami dengan 'ketika', sementara alternatif koordinatif dicatat dalam catatan kaki.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: di tempat ini
  rationale: מָקוֹם berarti 'tempat'. Dengan verba 'tiba', bahasa Indonesia secara alami memakai 'di tempat ini', yang tetap menyampaikan tujuan gerak dari אֶל.
- source_word: וַיֵּצֵא
  choice: keluar
  rationale: Qal wayyiqtol dari יצא berarti 'keluar'. Pilihan ini mempertahankan gambaran konkret tanpa menambahkan gagasan 'berbaris' yang tidak dinyatakan.
- source_word: סִיחֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: Sihon, raja Hesbon
  rationale: Nama diri ditransliterasikan menurut bentuk Indonesia yang lazim, sedangkan gelar kerajaan diterjemahkan langsung.
- source_word: וְעוֹג מֶלֶךְ הַבָּשָׁן
  choice: dan Og, raja Basan
  rationale: Struktur aposisi dipertahankan sejajar dengan gelar Sihon; nama tempat memakai bentuk Indonesia yang lazim.
- source_word: לִקְרָאתֵנוּ לַמִּלְחָמָה
  choice: menghadapi kita untuk berperang
  rationale: לִקְרָאתֵנוּ secara leksikal menunjuk gerak untuk menemui kita, tetapi konteks militer yang dijelaskan oleh לַמִּלְחָמָה membuat 'menghadapi kita untuk berperang' alami dan tepat dalam bahasa Indonesia.
- source_word: וַנַּכֵּם
  choice: lalu kita mengalahkan mereka
  rationale: Hifil wayyiqtol orang pertama jamak dari נכה dengan sufiks orang ketiga jamak secara harfiah berarti 'kita memukul mereka' dan dalam konteks perang lazim menyatakan kekalahan yang ditimpakan. 'Mengalahkan' menyampaikan fungsi idiomatisnya tanpa janggal.
