translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang wajar dan bermartabat. Pronomina 'kamu' dan 'kita' mempertahankan orang kedua jamak yang disapa Musa serta orang pertama jamak yang mencakup penutur dan umat, tanpa memaksakan penanda jamak yang tidak alami.
