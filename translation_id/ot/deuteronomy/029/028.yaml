  source_fidelity: 'Terjemahan dengan setia mempertahankan paralelisme partisip pasif Ibrani: "hal-hal yang tersembunyi" berbanding "hal-hal yang dinyatakan." Relasi kepunyaan yang diungkapkan oleh לְ diterjemahkan jelas dalam kedua klausa. "Anak-anak kita" secara wajar mencakup keturunan dalam konteks perjanjian, dan "supaya kita melakukan" menyampaikan fungsi tujuan dari לַעֲשׂוֹת tanpa mempersempit cakupan hal-hal tersembunyi atau yang dinyatakan.'
