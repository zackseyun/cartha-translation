  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: הַ֨/נִּסְתָּרֹ֔ת לַ/יהוָ֖ה אֱלֹהֵ֑י/נוּ וְ/הַ/נִּגְלֹ֞ת לָ֤ׄ/נׄוּׄ וּׄ/לְׄ/בָׄנֵׄ֨יׄ/נׄוּׄ֙ עַד עוֹלָ֔ם לַ/עֲשׂ֕וֹת אֶת כָּל דִּבְרֵ֖י הַ/תּוֹרָ֥ה הַ/זֹּֽאת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/028.yaml
  text: The hidden things belong to Yahweh our God[a], but the revealed things belong to us and to our children forever[b], so that we may do all the words of this law.
translation:
  language: id
  text: Hal-hal yang tersembunyi adalah milik TUHAN, Allah kita, tetapi hal-hal yang dinyatakan adalah milik kita dan anak-anak kita untuk selama-lamanya, supaya kita melakukan segala perkataan hukum ini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hukum ini” juga dapat diterjemahkan “pengajaran ini”; dalam kitab Ulangan, istilah tersebut menunjuk pada pengajaran perjanjian yang disampaikan Musa kepada Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּסְתָּרֹת
  choice: hal-hal yang tersembunyi
  rationale: Partisip pasif yang dipakai sebagai nomina jamak; ungkapan ini mempertahankan arti perkara-perkara yang tersembunyi dari pengetahuan manusia tanpa menyiratkan misteri esoteris.
- source_word: לַיהוָה אֱלֹהֵינוּ
  choice: adalah milik TUHAN, Allah kita
  rationale: Preposisi לְ menyatakan kepunyaan. Nama ilahi יהוה diterjemahkan menurut konvensi Indonesia yang umum dan bermartabat sebagai “TUHAN”, disertai sebutan perjanjian “Allah kita”.
- source_word: וְהַנִּגְלֹת
  choice: tetapi hal-hal yang dinyatakan
  rationale: Partisip pasif dari גלה sejajar dengan “hal-hal yang tersembunyi”. Kata sambung diterjemahkan secara adversatif karena terdapat kontras yang jelas.
- source_word: לָנוּ וּלְבָנֵינוּ
  choice: adalah milik kita dan anak-anak kita
  rationale: Kata “milik” tersirat dari klausa pertama dan diulangi agar hubungan antarklausa jelas dalam bahasa Indonesia. בנים di sini mencakup keturunan, bukan hanya anak laki-laki.
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Padanan alami dan bermartabat bagi ungkapan yang menyatakan keberlakuan terus-menerus.
- source_word: לַעֲשׂוֹת
  choice: supaya kita melakukan
  rationale: 'Infinitif dengan לְ menyatakan tujuan: hal-hal yang dinyatakan diberikan agar umat menaatinya.'
- source_word: אֵת כָּל דִּבְרֵי
  choice: segala perkataan
  rationale: Mempertahankan דְּבָרִים sebagai “perkataan” untuk menjaga penekanan tekstual pada seluruh ketetapan yang diucapkan.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: hukum ini
  rationale: Dalam konteks perjanjian kitab Ulangan, תּוֹרָה menunjuk pada pengajaran atau hukum yang disampaikan Musa. “Hukum” merupakan padanan yang dikenal, sedangkan keluasan makna “pengajaran” dicatat dalam catatan kaki.
theological_decisions:
- issue: Cakupan hal-hal yang tersembunyi dan yang dinyatakan
  choice: Ayat ini membedakan perkara yang tetap menjadi milik Allah dari penyataan perjanjian yang diberikan kepada Israel untuk ditaati, tanpa merinci kategori-kategorinya.
  alternative: Ayat ini dapat dibaca sebagai prinsip epistemologis yang sangat luas mengenai semua misteri ilahi, atau secara sempit hanya mengenai berkat dan kutuk perjanjian dalam konteks terdekat.
  rationale: Terjemahan mempertahankan kontras umum dalam teks Ibrani dan tidak menentukan lebih jauh apa saja yang termasuk dalam masing-masing kelompok.
- issue: Hubungan penyataan dengan ketaatan
  choice: “Supaya” menyatakan tujuan penyataan itu, yaitu pelaksanaan seluruh perkataan hukum.
  alternative: Infinitif dapat diterjemahkan lebih formal sebagai “untuk melakukan”.
  rationale: Bentuk tujuan dibuat eksplisit secara alami dalam bahasa Indonesia tanpa menambahkan gagasan teologis yang tidak terdapat dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Paralelisme “hal-hal yang tersembunyi” dan “hal-hal yang dinyatakan” dipertahankan. “TUHAN” digunakan sebagai padanan konvensional untuk nama ilahi יהוה.
