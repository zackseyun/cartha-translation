  text: and we took their land and gave it as an inheritance to the Reubenites[a], the Gadites, and the half-tribe of the Manassites.
translation:
  language: id
  text: Kemudian kita mengambil negeri mereka dan memberikannya sebagai milik pusaka kepada orang Ruben, orang Gad, dan setengah suku Manasye.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנִּקַּח
  choice: dan kita mengambil
  rationale: Bentuk wayyiqtol orang pertama jamak dari לקח menyatakan tindakan naratif ‘mengambil’. ‘Mengambil’ mempertahankan arti dasar tanpa memperkuatnya menjadi ‘merebut’, meskipun konteksnya adalah kemenangan militer.
- source_word: אַרְצָם
  choice: negeri mereka
  rationale: אֶרֶץ dengan akhiran orang ketiga jamak menunjuk pada wilayah para raja yang telah dikalahkan. ‘Negeri’ alami dalam bahasa Indonesia untuk wilayah yang dikuasai suatu bangsa atau kerajaan.
- source_word: וַנִּתְּנָהּ
  choice: serta memberikannya
  rationale: נתן berarti ‘memberikan’, dan akhiran feminin tunggal mengacu kembali kepada אֶרֶץ. ‘Memberikannya’ mempertahankan hubungan pronominal tersebut.
- source_word: לְנַחֲלָה
  choice: sebagai milik pusaka
  rationale: נַחֲלָה menunjuk pada warisan atau bagian tanah yang menjadi milik tetap. ‘Milik pusaka’ mempertahankan nuansa pembagian tanah warisan dan lazim dipahami dalam ragam Alkitab Indonesia.
- source_word: לָרֽאוּבֵנִי וְלַגָּדִי
  choice: kepada orang Ruben, orang Gad
  rationale: Bentuk nisbah tunggal dipakai secara kolektif bagi kelompok suku. ‘Orang Ruben’ dan ‘orang Gad’ menyampaikan makna kolektif itu secara alami tanpa mengubahnya menjadi nama leluhur saja.
- source_word: וְלַחֲצִי שֵׁבֶט הַמְנַשִּׁי
  choice: dan setengah suku Manasye
  rationale: חֲצִי שֵׁבֶט berarti ‘setengah suku’, sedangkan bentuk nisbah הַמְנַשִּׁי secara idiomatis dinyatakan dengan nama suku ‘Manasye’ dalam bahasa Indonesia.
