  source_fidelity: 'Makna pokok diterjemahkan dengan setia: tindakan kolektif orang pertama jamak, negeri milik pihak yang disebut sebelumnya, pemberian sebagai נחלה, serta tiga penerima alokasi tanah semuanya terjaga. "Kita" tepat secara kontekstual karena Musa berbicara kepada Israel sebagai kelompok yang turut mengalami peristiwa itu. "Setengah suku Manasye" merupakan padanan idiomatis yang baik untuk חֲצִי שֵׁבֶט הַמְנַשִּׁי.'
