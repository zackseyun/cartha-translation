id: DEU.29.14
reference: Deuteronomy 29:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּי֩ אֶת אֲשֶׁ֨ר יֶשְׁנ֜/וֹ פֹּ֗ה עִמָּ֨/נוּ֙ עֹמֵ֣ד הַ/יּ֔וֹם לִ/פְנֵ֖י יְהוָ֣ה אֱלֹהֵ֑י/נוּ וְ/אֵ֨ת אֲשֶׁ֥ר אֵינֶ֛/נּוּ פֹּ֖ה עִמָּ֥/נוּ הַ/יּֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/029/014.yaml
  text: but with whoever is standing here with us today before Yahweh our God[a], and with whoever is not here with us today.
translation:
  language: id
  text: melainkan dengan setiap orang yang berdiri di sini bersama kita hari ini di hadapan Yahweh, Allah kita, dan dengan setiap orang yang tidak berada di sini bersama kita hari ini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mereka yang tidak berada di sini dapat merujuk kepada orang Israel yang tidak hadir dalam perhimpunan ini, generasi mendatang, atau keduanya.
    reason: Menjelaskan kemungkinan cakupan rujukan tanpa menetapkan salah satunya sebagai satu-satunya tafsiran.
lexical_decisions:
- source_word: כִּי
  choice: melainkan
  rationale: Dalam konteks, partikel ini melanjutkan kontras dengan penyangkalan pada ayat sebelumnya, sehingga penghubung adversatif paling sesuai.
- source_word: אֶת אֲשֶׁר
  choice: dengan setiap orang yang
  rationale: Penanda objek dan klausa relatif menunjuk kepada orang-orang yang disertakan dalam perjanjian dan sumpah; kata depan 'dengan' dipasok secara wajar dari rumusan pada ayat sebelumnya.
- source_word: יֶשְׁנוֹ פֹּה עִמָּנוּ
  choice: di sini bersama kita
  rationale: Ungkapan ini menyatakan keberadaan atau kehadiran dalam perhimpunan, dengan tetap mempertahankan nuansa relasional עִם.
- source_word: עֹמֵד
  choice: berdiri
  rationale: Mempertahankan gambaran konkret tentang orang yang berdiri dalam perhimpunan perjanjian di hadapan Allah.
- source_word: הַיּוֹם
  choice: hari ini
  rationale: Padanan Indonesia modern dan alami; pengulangannya dipertahankan dalam kedua klausa.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Padanan lazim yang menyampaikan makna ruang sekaligus suasana perjanjian.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi sebagaimana terdapat dalam teks sumber.
- source_word: אֱלֹהֵינוּ
  choice: Allah kita
  rationale: Padanan langsung bagi bentuk dengan pronomina orang pertama jamak.
- source_word: וְאֵת אֲשֶׁר אֵינֶנּוּ
  choice: dan dengan setiap orang yang tidak berada
  rationale: Mencerminkan susunan klausa pertama dan mempertahankan negasi keberadaan tanpa menafsirkan jenis ketidakhadiran tersebut.
theological_decisions:
- issue: Cakupan peserta perjanjian yang 'tidak berada di sini bersama kita hari ini'
  choice: Membiarkan rujukannya terbuka, tanpa menentukan apakah mereka orang Israel yang sedang tidak hadir, generasi mendatang, atau keduanya.
  alternative: Menetapkannya secara khusus sebagai generasi yang belum lahir atau hanya orang sezaman yang tidak hadir.
  rationale: Bahasa Ibrani tidak mempersempit rujukan itu; terjemahan sebaiknya mempertahankan keluasan dan ketegangan penafsirannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Setiap orang yang' dipilih agar alami sekaligus mempertahankan nuansa distributif bentuk Ibrani; struktur paralel kedua klausa dijaga.
