id: DEU.33.11
reference: Deuteronomy 33:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בָּרֵ֤ךְ יְהוָה֙ חֵיל֔/וֹ וּ/פֹ֥עַל יָדָ֖י/ו תִּרְצֶ֑ה מְחַ֨ץ מָתְנַ֧יִם קָמָ֛י/ו וּ/מְשַׂנְאָ֖י/ו מִן יְקוּמֽוּ/ן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/011.yaml
  text: Bless[a], O Yahweh, his strength, and accept the work of his hands. Crush the loins of those who rise against him, and of those who hate him[b], so that they do not rise again.
translation:
  language: id
  text: Berkatilah, ya Yahweh, kekuatannya[a], dan terimalah pekerjaan tangannya. Remukkanlah pinggang[b] orang-orang yang bangkit melawannya dan orang-orang yang membencinya, supaya mereka tidak bangkit lagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kekayaannya” atau “bala tentaranya”; kata Ibrani ini dapat berarti kekuatan, sumber daya, kekayaan, atau kekuatan militer.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “pinggang.” Dalam gambaran Ibrani, pinggang dapat melambangkan pusat kekuatan seseorang.
    reason: cultural_note
lexical_decisions:
- source_word: בָּרֵךְ
  choice: Berkatilah
  rationale: Bentuk imperatif yang ditujukan kepada Yahweh; terjemahan langsung ini mempertahankan bentuk permohonan berkat tanpa mempersempitnya menjadi sekadar kemakmuran.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: חֵילוֹ
  choice: kekuatannya
  rationale: חַיִל dapat menunjuk pada kekuatan, sumber daya, kekayaan, atau kekuatan militer. 'Kekuatannya' paling baik mempertahankan keluasan makna dalam teks utama; alternatif penting dicatat dalam catatan kaki.
- source_word: וּפֹעַל יָדָיו
  choice: pekerjaan tangannya
  rationale: Mempertahankan ungkapan konkret Ibrani tentang perbuatan atau hasil kerja seseorang dan tetap wajar dalam bahasa Indonesia.
- source_word: תִּרְצֶה
  choice: terimalah
  rationale: Dalam konteks pelayanan Lewi, verba ini menyampaikan permohonan agar Yahweh menerima dengan perkenan pekerjaan tersebut. 'Terimalah' ringkas dan tidak terlalu menafsirkan.
- source_word: מְחַץ
  choice: Remukkanlah
  rationale: Mempertahankan daya kekerasan verba Ibrani yang berarti menghancurkan atau meremukkan, sekaligus bentuk imperatifnya.
- source_word: מָתְנַיִם
  choice: pinggang
  rationale: Padanan Indonesia yang alami bagi gambaran tubuh Ibrani; metafora kekuatan dipertahankan dan dijelaskan dalam catatan kaki.
- source_word: קָמָיו
  choice: orang-orang yang bangkit melawannya
  rationale: Mempertahankan gambaran verbal dari קום, bukan meratakannya menjadi kata abstrak seperti 'lawan'.
- source_word: וּמְשַׂנְאָיו
  choice: orang-orang yang membencinya
  rationale: Menerjemahkan partisip secara langsung dan mempertahankan unsur kebencian pribadi.
- source_word: מִן יְקוּמוּן
  choice: supaya mereka tidak bangkit lagi
  rationale: Ungkapan Ibrani bersifat eliptis. Terjemahan ini menyatakan hasil yang tersirat—musuh dibuat tidak mampu bangkit kembali—tanpa mengubah arah maknanya.
theological_decisions:
- issue: Acuan pronomina orang ketiga tunggal pada 'kekuatannya', 'tangannya', dan 'melawannya'
  choice: Pronomina dipertahankan dalam bentuk tunggal dan dipahami mengacu kepada Lewi dalam konteks langsung.
  alternative: Pronomina dapat dipahami lebih umum sebagai mengacu kepada pelayan keimaman atau wakil pelayanan Lewi.
  rationale: Ayat 8–11 merupakan berkat Musa atas Lewi. Bentuk tunggal dalam bahasa Ibrani dipertahankan tanpa memasukkan perluasan penafsiran ke dalam teks utama.
- issue: Makna permohonan penghancuran 'pinggang' para lawan
  choice: Metafora tubuh dipertahankan sebagai gambaran pelumpuhan kekuatan lawan.
  alternative: Metafora dapat dinyatakan langsung sebagai 'hancurkan kekuatan para lawannya'.
  rationale: Mempertahankan metafora sumber menjaga ketegangan dan kekuatan puisi Ibrani; arti budayanya dijelaskan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa berkat yang khidmat dan puitis. Bentuk imperatif bersufiks -lah mempertahankan permohonan langsung kepada Yahweh. Struktur dibuat jelas bagi pembaca umum tanpa menghilangkan metafora Ibrani atau ambiguitas leksikal utama.
