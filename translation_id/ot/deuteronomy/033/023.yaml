  text: וּ/לְ/נַפְתָּלִ֣י אָמַ֔ר נַפְתָּלִי֙ שְׂבַ֣ע רָצ֔וֹן וּ/מָלֵ֖א בִּרְכַּ֣ת יְהוָ֑ה יָ֥ם וְ/דָר֖וֹם יְרָֽשָׁ/ה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/023.yaml
  text: 'And of Naphtali he said: “Naphtali[a], satisfied with favor and full of the blessing of Yahweh, possess the sea and the south.”'
translation:
  language: id
  text: "Tentang Naftali ia berkata:\n“Naftali, puas dengan perkenanan\n dan penuh dengan berkat Yahweh,\nkuasailah laut[a] dan selatan.”"
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin “barat”, sebab dalam bahasa Ibrani kata “laut” juga dapat dipakai sebagai penunjuk arah barat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְנַפְתָּלִי אָמַר
  choice: Tentang Naftali ia berkata
  rationale: Prefiks ל dalam rumus berkat ini memperkenalkan suku yang menjadi pokok atau penerima ucapan; ‘Tentang Naftali’ alami dalam bahasa Indonesia dan mempertahankan struktur pengantar.
- source_word: שְׂבַע רָצוֹן
  choice: yang dipuaskan dengan perkenanan
  rationale: שְׂבַע menyatakan keadaan kenyang atau puas, sedangkan רָצוֹן di sini paling mungkin berarti perkenanan yang diterima. Bentuk pasif mempertahankan nuansa keadaan tanpa menentukan secara eksplisit pelakunya.
- source_word: וּמָלֵא בִּרְכַּת יְהוָה
  choice: dan dipenuhi berkat Yahweh
  rationale: מָלֵא sejajar dengan שְׂבַע dan menyatakan keadaan penuh. Ungkapan Indonesia ini ringkas, wajar, dan mempertahankan konstruksi ‘berkat Yahweh’.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks Ibrani tetap tampak.
- source_word: יָם
  choice: laut
  rationale: Arti leksikal langsungnya ialah ‘laut’; kemungkinan fungsi arah ‘barat’ dipertahankan dalam catatan kaki karena konteksnya menyangkut wilayah.
- source_word: וְדָרוֹם
  choice: dan wilayah selatan
  rationale: דָרוֹם dapat menunjuk arah selatan atau kawasan selatan. ‘Wilayah selatan’ lebih jelas sebagai objek penguasaan tanah dan tetap menjaga cakupan maknanya.
- source_word: יְרָשָׁה
  choice: kuasailah
  rationale: Bentuk ini berfungsi sebagai imperatif feminin tunggal yang mengacu kepada Naftali sebagai suku dan menyatakan pengambilan atau pemilikan wilayah. ‘Kuasailah’ menyampaikan daya perintah tersebut secara alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. ‘Yahweh’ mempertahankan nama pribadi ilahi tanpa menggantinya dengan gelar.
- issue: Daya ujar יְרָשָׁה dalam konteks berkat
  choice: kuasailah
  alternative: semoga engkau menguasai atau warisilah
  rationale: Bentuk Ibrani adalah imperatif, tetapi berada dalam ucapan berkat. Terjemahan mempertahankan bentuk perintah puitis tanpa menghapus nuansa berkat atau mengubahnya menjadi pernyataan biasa.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat dengan susunan puitis. Partisipel/adjektiva Ibrani diterjemahkan sebagai klausa relatif agar alami. Ambiguitas ‘laut/barat’ tidak diselesaikan secara diam-diam, melainkan dicatat.
