  yaml_path: translation/ot/deuteronomy/033/018.yaml
  text: And of Zebulun he said[a], “Rejoice, Zebulun, in your going out, and Issachar, in your tents.”
translation:
  language: id
  text: Tentang Zebulon ia berkata, “Bersukacitalah, hai Zebulon, ketika engkau pergi[a], dan hai Isakhar, di kemah-kemahmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam kepergianmu.” Ungkapan Ibrani ini dapat menunjuk pada saat Zebulon pergi atau pada lingkup kegiatan dan keberhasilannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/זְבוּלֻן
  choice: Tentang Zebulon
  rationale: Preposisi ל memperkenalkan berkat yang ditujukan kepada atau mengenai suku Zebulon. “Tentang Zebulon” merupakan ungkapan Indonesia yang alami dan tidak memaksakan salah satu nuansa itu.
- source_word: אָמַר
  choice: ia berkata
  rationale: Padanan langsung dan alami untuk verba אמר dalam pengantar ujaran.
- source_word: שְׂמַח
  choice: Bersukacitalah
  rationale: Mempertahankan bentuk imperatif dan nada luhur berkat, serta secara eliptis juga mencakup Isakhar pada baris sejajar berikutnya.
- source_word: בְּ/צֵאתֶךָ
  choice: dalam kepergianmu
  rationale: Mempertahankan gambaran harfiah dan kesejajaran dengan “di kemah-kemahmu.” Ungkapan Ibrani dapat menunjuk pada saat keluar maupun lingkup kegiatan atau usaha Zebulon, sehingga alternatif dijelaskan dalam catatan kaki.
- source_word: וְ/יִשָּׂשכָר
  choice: dan hai Isakhar
  rationale: Partikel vokatif “hai” memperjelas bahwa Isakhar juga disapa langsung, sebagaimana ditunjukkan oleh akhiran orang kedua pada frasa berikutnya.
- source_word: בְּ/אֹהָלֶיךָ
  choice: di kemah-kemahmu
  rationale: Mempertahankan bentuk jamak dan gambaran konkret dalam teks Ibrani tanpa mengubahnya menjadi tafsiran seperti “di rumah.”
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan puitis serta kesejajaran antara “kepergianmu” dan “kemah-kemahmu” dipertahankan; elipsis pada sapaan kepada Isakhar tidak diisi dengan pengulangan imperatif agar struktur sumber tetap tampak.
