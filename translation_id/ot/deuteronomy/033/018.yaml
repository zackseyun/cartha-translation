    issue: Frasa ‘dalam kepergianmu’ kurang idiomatis dalam bahasa Indonesia modern.
    rationale: Walaupun dekat secara bentuk dengan ‘in your going out’, nomina ‘kepergian’ biasanya mengacu pada keberangkatan atau fakta seseorang telah pergi, bukan keadaan ‘saat pergi’. Ini dapat mengaburkan makna Ibrani. ‘Ketika engkau pergi’ mempertahankan ambiguitas temporal/sirkumstansial secara lebih alami.
  revised_text: Tentang Zebulon ia berkata, “Bersukacitalah, hai Zebulon, ketika engkau pergi[a], dan hai Isakhar, di kemah-kemahmu.”
