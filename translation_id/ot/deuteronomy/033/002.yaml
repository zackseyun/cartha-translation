  text: וַ/יֹּאמַ֗ר יְהוָ֞ה מִ/סִּינַ֥י בָּא֙ וְ/זָרַ֤ח מִ/שֵּׂעִיר֙ לָ֔/מוֹ הוֹפִ֨יעַ֙ מֵ/הַ֣ר פָּארָ֔ן וְ/אָתָ֖ה מֵ/רִבְבֹ֣ת קֹ֑דֶשׁ מִֽ/ימִינ֕/וֹ אשדת לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/002.yaml
  text: 'And he said: “Yahweh came from Sinai and dawned from Seir upon them[a]; he shone forth from Mount Paran, and came from myriads of holiness[b]; from his right hand came a fiery law for them.”'
translation:
  language: id
  text: "Ia berkata,\n\n“Yahweh datang dari Sinai\n  dan terbit dari Seir menyinari mereka;\nIa memancarkan sinar dari Gunung Paran\n  dan datang dari puluhan ribu yang kudus.[a]\nDari tangan kanan-Nya datang\n  hukum yang berapi bagi mereka.”[b]"
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, frasa Ibrani ini dapat dibaca “puluhan ribu kekudusan”; kemungkinan besar yang dimaksud ialah puluhan ribu makhluk atau pengiring yang kudus.
    reason: alternative_reading
  - marker: b
    text: Kata Ibrani yang diterjemahkan “hukum yang berapi” sulit dan maknanya tidak pasti. Kata itu juga mungkin menunjuk pada api yang memancar atau kilatan-kilatan api dari tangan kanan-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar seperti “TUHAN”.
- source_word: וְזָרַח מִשֵּׂעִיר לָמוֹ
  choice: dan terbit dari Seir menyinari mereka
  rationale: Kata זרח menggambarkan terbit atau bersinarnya cahaya, terutama seperti matahari. Ungkapan “menyinari mereka” menyampaikan fungsi לָמוֹ secara alami dalam citra teofani ini.
- source_word: הוֹפִיעַ מֵהַר פָּארָן
  choice: Ia memancarkan sinar dari Gunung Paran
  rationale: Bentuk kausatif יפע menyatakan tampil atau bersinar dengan cemerlang; “memancarkan sinar” mempertahankan citra puitisnya.
- source_word: וְאָתָה מֵרִבְבֹת קֹדֶשׁ
  choice: dan datang dari antara puluhan ribu yang kudus
  rationale: אתה berarti datang atau mendekat. Frasa berikutnya paling wajar dipahami sebagai kumpulan besar pribadi-pribadi kudus, tetapi bentuk Ibraninya tidak sepenuhnya tegas; ketidakpastian itu dicatat dalam catatan kaki.
- source_word: מִימִינוֹ
  choice: dari tangan kanan-Nya
  rationale: Preposisi מִן secara alami menyatakan asal, yakni sesuatu yang datang dari tangan kanan Yahweh.
- source_word: אשדת לָמוֹ
  choice: hukum yang berapi bagi mereka
  rationale: Bentuk אשדת sangat sulit. Terjemahan tradisional yang menghubungkannya dengan “api” dan “hukum” dipertahankan dalam teks utama karena sesuai dengan konteks Sinai, sementara ketidakpastian leksikal dan alternatif yang berhubungan dengan api dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Identitas subjek ilahi dalam teofani puitis
  choice: Menyebut subjek dengan nama “Yahweh” sesuai teks Ibrani.
  alternative: Menafsirkan kedatangan ini secara eksplisit sebagai penampakan kristologis.
  rationale: Ayat ini menggambarkan kedatangan teofanik Allah perjanjian dalam konteks berkat Musa. Terjemahan tidak memasukkan penafsiran teologis yang lebih kemudian ke dalam teks.
- issue: Makna מֵרִבְבֹת קֹדֶשׁ
  choice: puluhan ribu yang kudus
  alternative: puluhan ribu kekudusan
  rationale: Ungkapan Ibrani dapat menunjuk para pengiring surgawi yang kudus, sedangkan bentuk קֹדֶשׁ sendiri secara harfiah berarti “kekudusan” atau “yang kudus”. Teks utama dibuat wajar dalam bahasa Indonesia dan ambiguitas bentuk sumber dijaga melalui catatan kaki.
- issue: Makna אשדת
  choice: hukum yang berapi
  alternative: api yang memancar atau kilatan-kilatan api
  rationale: Bentuk Ibrani tidak pasti. Bacaan tradisional tetap layak dalam konteks Sinai, tetapi alternatif berbasis citra api perlu dinyatakan agar ketidakpastian teks tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan puitis yang tetap mudah dipahami. Citra cahaya dalam tiga verba kedatangan ilahi dipertahankan, dan istilah yang sangat tidak pasti tidak dijelaskan secara berlebihan di dalam teks utama.
