source:
  edition: WLC
  text: וּ/מִ/מֶּ֗גֶד אֶ֚רֶץ וּ/מְלֹאָ֔/הּ וּ/רְצ֥וֹן שֹׁכְנִ֖י סְנֶ֑ה תָּב֨וֹאתָ/ה֙ לְ/רֹ֣אשׁ יוֹסֵ֔ף וּ/לְ/קָדְקֹ֖ד נְזִ֥יר אֶחָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/016.yaml
  text: and with the choicest things of the earth and its fullness[a], and the favor of the one who dwelt in the bush—may it come on the head of Joseph[b], and on the crown of the head of the one set apart from his brothers.
translation:
  language: id
  text: 'dan dengan hasil-hasil terbaik dari bumi serta segala isinya,


    dan dengan perkenanan Dia yang tinggal dalam semak duri.[a]


    Kiranya semuanya itu datang menimpa kepala Yusuf,


    menimpa ubun-ubun orang yang dikhususkan di antara saudara-saudaranya.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan ini mengacu kepada Allah yang menyatakan diri kepada Musa dari dalam semak yang menyala (Keluaran 3). Kata “menyala” tidak terdapat dalam ayat ini.
    reason: historical_allusion
  - marker: b
    text: Kata Ibrani yang diterjemahkan “dikhususkan” juga dapat dipahami sebagai “yang terpisah dari saudara-saudaranya”, “yang ditahbiskan di antara saudara-saudaranya”, atau, dengan menekankan kedudukannya, “pemimpin di antara saudara-saudaranya”.
    reason: alternative_reading
lexical_decisions:
- source_word: מִמֶּגֶד אֶרֶץ
  choice: dengan hasil-hasil terbaik dari bumi
  rationale: מֶגֶד menunjuk pada sesuatu yang berharga atau pilihan, khususnya hasil bumi dalam konteks berkat. Kata depan מִן meneruskan rangkaian sarana atau isi berkat dari ayat-ayat sebelumnya, sehingga 'dengan' lebih alami daripada 'dari' dalam bahasa Indonesia.
- source_word: וּמְלֹאָהּ
  choice: serta segala isinya
  rationale: Ungkapan ini berarti segala sesuatu yang memenuhi atau terkandung di dalam bumi. Pilihan ini lebih mudah dipahami daripada terjemahan harfiah 'kepenuhannya' dan tetap ringkas serta puitis.
- source_word: וּרְצוֹן
  choice: dan dengan perkenanan
  rationale: רָצוֹן dalam konteks ini menyatakan kemurahan, kerelaan baik, atau perkenanan ilahi. 'Perkenanan' mempertahankan nuansa berkat tanpa mempersempitnya menjadi sekadar perasaan manusiawi.
- source_word: שֹׁכְנִי סְנֶה
  choice: Dia yang tinggal dalam semak duri
  rationale: Bentuk partisipial diterjemahkan sebagai sebutan deskriptif bagi Allah dan mempertahankan acuan kepada penampakan ilahi dalam semak pada Keluaran 3. 'Semak duri' mencerminkan סְנֶה tanpa menambahkan kata 'menyala', yang tidak terdapat dalam ayat ini.
- source_word: תָּבוֹאתָה
  choice: Kiranya semuanya itu turun
  rationale: Bentuk verba feminin tunggal membawa daya harapan atau berkat dan merujuk secara kolektif kepada seluruh kelimpahan serta perkenanan yang baru disebutkan. 'Semuanya itu' membuat rujukan kolektif tersebut jelas, sedangkan 'turun ke atas' menyampaikan gambaran berkat yang datang menimpa kepala.
- source_word: לְרֹאשׁ יוֹסֵף
  choice: ke atas kepala Yusuf
  rationale: Ini mempertahankan ungkapan berkat yang konkret dan paralel dengan baris berikutnya.
- source_word: וּלְקָדְקֹד
  choice: ke atas ubun-ubun
  rationale: קָדְקֹד menunjuk pada bagian paling atas kepala. 'Ubun-ubun' alami dalam bahasa Indonesia dan mempertahankan paralelisme tanpa mengulang kata 'kepala' secara kaku.
- source_word: נְזִיר אֶחָיו
  choice: orang yang dikhususkan di antara saudara-saudaranya
  rationale: נְזִיר pada dasarnya menunjuk pada seseorang yang dipisahkan atau dikhususkan, tetapi dalam konteks Yusuf dapat sekaligus menyiratkan kedudukan istimewa. Frasa ini menjaga makna inti tanpa menetapkan bahwa kata tersebut pasti berarti 'pemimpin'.
theological_decisions:
- issue: Identitas 'Dia yang tinggal dalam semak duri'
  choice: Sebutan ilahi yang mengacu kepada Allah sebagaimana Ia menyatakan diri kepada Musa di semak duri
  alternative: Rujukan yang lebih umum kepada penampakan ilahi yang berkaitan dengan Horeb atau Sinai
  rationale: Frasa itu kuat menggemakan Keluaran 3 dan berfungsi sebagai sebutan hormat bagi Allah. Terjemahan deskriptif mempertahankan gema tersebut tanpa menambahkan rumusan doktrinal yang tidak dinyatakan dalam teks.
- issue: Makna נְזִיר dalam hubungan Yusuf dengan saudara-saudaranya
  choice: orang yang dikhususkan di antara saudara-saudaranya
  alternative: orang yang terpisah dari saudara-saudaranya; pemimpin di antara saudara-saudaranya; orang yang ditahbiskan di antara saudara-saudaranya
  rationale: Kata itu dapat menonjolkan pemisahan atau pengkhususan dan, dalam konteks berkat bagi Yusuf, mungkin juga menyiratkan keunggulan. Teks utama mempertahankan inti leksikalnya, sementara catatan kaki menyajikan kemungkinan nuansa lain.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan puitis yang sesuai bagi berkat Musa. Diksi 'perkenanan', 'semak duri', dan 'ubun-ubun' dipilih agar bermartabat tetapi tetap mudah dimengerti. Pemenggalan baris mempertahankan paralelisme puisi Ibrani.
