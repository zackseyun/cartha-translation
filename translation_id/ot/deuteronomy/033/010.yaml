source:
  edition: WLC
  text: יוֹר֤וּ מִשְׁפָּטֶ֨י/ךָ֙ לְ/יַעֲקֹ֔ב וְ/תוֹרָתְ/ךָ֖ לְ/יִשְׂרָאֵ֑ל יָשִׂ֤ימוּ קְטוֹרָה֙ בְּ/אַפֶּ֔/ךָ וְ/כָלִ֖יל עַֽל מִזְבְּחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/010.yaml
  text: They will teach your judgments to Jacob and your law to Israel[b][a]; they will place incense before you and whole burnt offerings on your altar.
translation:
  language: id
  text: Mereka akan mengajarkan ketetapan-ketetapan-Mu kepada Yakub dan hukum-Mu[a] kepada Israel. Mereka akan mempersembahkan dupa di hadapan-Mu[b] dan kurban bakaran yang seluruhnya dibakar di atas mazbah-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pengajaran-Mu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “pada hidung-Mu,” suatu ungkapan antropomorfis untuk dupa yang dipersembahkan di hadapan Allah.'
    reason: cultural_note
lexical_decisions:
- source_word: יוֹרוּ
  choice: mereka akan mengajarkan
  rationale: Bentuk Hifil dari ירה berarti mengajar atau memberi petunjuk, khususnya dalam konteks tugas keimaman dan hukum.
- source_word: מִשְׁפָּטֶיךָ
  choice: ketetapan-ketetapan-Mu
  rationale: מִשְׁפָּט dapat berarti keputusan hukum, peraturan, atau ketetapan. 'Ketetapan-ketetapan' wajar dalam bahasa Indonesia dan mempertahankan nuansa hukum perjanjian.
- source_word: וְתוֹרָתְךָ
  choice: dan hukum-Mu
  rationale: תּוֹרָה mencakup hukum maupun pengajaran. Dalam kesejajaran dengan מִשְׁפָּט dan konteks kewajiban perjanjian, 'hukum-Mu' tepat, sedangkan 'pengajaran-Mu' dicatat sebagai alternatif.
- source_word: קְטוֹרָה
  choice: dupa
  rationale: Nomina ini menunjuk pada dupa yang dipersembahkan dalam ibadah.
- source_word: בְּאַפֶּךָ
  choice: di hadapan-Mu
  rationale: Secara harfiah frasa ini berarti 'pada hidung-Mu', tetapi dalam konteks persembahan dupa merupakan ungkapan antropomorfis. 'Di hadapan-Mu' menyampaikan fungsinya secara alami tanpa menafsirkan אַף sebagai murka.
- source_word: וְכָלִיל
  choice: dan kurban bakaran yang seluruhnya dibakar
  rationale: כָּלִיל menunjuk pada persembahan yang dihabiskan seluruhnya oleh api. Rumusan ini jelas bagi pembaca modern dan mempertahankan ciri utama persembahan tersebut.
- source_word: עַל מִזְבְּחֶךָ
  choice: di atas mazbah-Mu
  rationale: Terjemahan langsung dan wajar untuk frasa yang menyatakan lokasi persembahan.
theological_decisions:
- issue: Makna תּוֹרָה dalam konteks perjanjian
  choice: hukum-Mu
  alternative: pengajaran-Mu
  rationale: '''Hukum'' mempertahankan daya hukum-perjanjian dalam kesejajaran dengan ''ketetapan-ketetapan'', tetapi catatan kaki menjaga keluasan makna ''pengajaran''.'
- issue: Ungkapan antropomorfis בְּאַפֶּךָ
  choice: di hadapan-Mu
  alternative: pada hidung-Mu
  rationale: Terjemahan harfiah akan terasa janggal dan berpotensi disalahpahami dalam bahasa Indonesia. Terjemahan utama menyampaikan dupa sebagai persembahan yang dibawa ke hadapan Allah, sedangkan bentuk harfiahnya dicatat.
- issue: Bilangan dan sifat kolektif כָלִיל
  choice: kurban bakaran yang seluruhnya dibakar
  alternative: kurban-kurban bakaran yang seluruhnya dibakar
  rationale: Bahasa Ibrani memakai nomina tunggal tanpa penanda tak tentu dan dapat menyebut jenis persembahan secara kolektif. Bahasa Indonesia tidak memerlukan pemaksaan bentuk tunggal atau jamak; rumusan generik mempertahankan keluwesan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Mazbah' dipertahankan sebagai istilah ibadah yang ringkas dan dikenal dalam ragam Alkitab, sementara struktur kalimat dibuat langsung dan mudah dipahami. Penanda catatan kaki ditempatkan tepat sesudah unsur yang dijelaskan.
