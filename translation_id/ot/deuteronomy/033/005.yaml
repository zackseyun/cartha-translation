  yaml_path: translation/ot/deuteronomy/033/005.yaml
  text: And he was king in Jeshurun[a], when the heads of the people gathered together[c][b], the tribes of Israel as one.
translation:
  language: id
  text: Ia adalah raja di Yesyurun[a] ketika para pemimpin umat berkumpul bersama dengan suku-suku Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yesyurun adalah nama puitis bagi Israel. Teks Ibrani tidak menyebutkan secara eksplisit siapa yang menjadi raja. Dapat dipahami, “TUHAN adalah raja di Yesyurun”; sebagian orang memahaminya sebagai, “Ia [Musa] adalah raja di Yesyurun.”
    reason: cultural_note_and_alternative_reading
  - marker: b
    text: Atau, “ketika para pemimpin umat berkumpul, suku-suku Israel bersama-sama.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: Ia menjadi
  rationale: Bentuk וַיְהִי dapat menyatakan keadaan atau peralihan menjadi suatu keadaan. Dalam konstruksi dengan predikat מֶלֶךְ, “menjadi” secara wajar menyampaikan tampil atau terwujudnya kedudukan sebagai raja, sementara subjeknya tetap tidak disebutkan.
- source_word: בִישֻׁרוּן
  choice: di Yesyurun
  rationale: Yesyurun dipertahankan sebagai nama puitis bagi Israel. Preposisi ב diterjemahkan “di” dalam arti lokatif-korporat.
- source_word: מֶלֶךְ
  choice: raja
  rationale: Padanan langsung bagi kata benda Ibrani ini; tidak ditambahkan penjelasan tentang siapa rajanya karena sumber tidak menyebutkan subjek secara eksplisit.
- source_word: בְּהִתְאַסֵּף
  choice: ketika ... berkumpul
  rationale: Infinitif konstruk dengan prefiks ב di sini paling wajar dipahami sebagai anak kalimat temporal.
- source_word: רָאשֵׁי עָם
  choice: para pemimpin umat
  rationale: Secara harfiah berarti “kepala-kepala umat,” yakni para pemimpin. Padanan idiomatis ini lebih alami dan jelas dalam bahasa Indonesia modern.
- source_word: יַחַד
  choice: bersatu
  rationale: Kata ini menyatakan kebersamaan atau kesatuan. “Bersatu” menonjolkan kesatuan suku-suku Israel tanpa menentukan bentuk politik atau liturgis pertemuan tersebut.
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: suku-suku Israel
  rationale: Padanan langsung dan lazim. Frasa ini dipahami sebagai aposisi yang menjelaskan umat yang berkumpul.
theological_decisions:
- issue: Subjek yang menjadi raja
  choice: Memakai kata ganti “Ia” tanpa mengidentifikasi rujukannya
  alternative: TUHAN menjadi raja di Yesyurun; atau Musa menjadi raja di Yesyurun
  rationale: Teks Ibrani tidak menyatakan subjek secara eksplisit. Pemakaian kata ganti mempertahankan ambiguitas asli antara rujukan kepada TUHAN dan rujukan kepada Musa.
- issue: Kesatuan Israel dalam pertemuan
  choice: Menerjemahkan pertemuan itu sebagai berkumpulnya para pemimpin dan suku-suku Israel dalam kesatuan
  alternative: Menafsirkannya secara khusus sebagai upacara penobatan atau sidang perjanjian
  rationale: Ayat ini menyatakan pertemuan dan kesatuan Israel, tetapi tidak menetapkan secara eksplisit sifat politik atau liturgis peristiwa itu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. “Umat” dipakai untuk עָם dalam konteks Israel, sedangkan “para pemimpin” menerjemahkan idiom harfiah “kepala-kepala” secara alami. Tanda pisah membantu menampilkan “suku-suku Israel” sebagai penjelas aposisional tanpa menghapus kepadatan sintaksis Ibrani.
