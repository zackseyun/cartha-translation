  terminology: “Yahweh” konsisten dengan nama ilahi dalam sumber. “Diselamatkan,” “perisai,” “pedang,” “kemegahan,” dan “tempat-tempat tinggi” sesuai dengan istilah serta citra teks sumber. Catatan kaki mempertahankan alternatif leksikal penting tanpa memaksakan satu penafsiran atas bāmôt.
