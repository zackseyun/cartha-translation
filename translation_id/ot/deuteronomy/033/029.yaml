  variant: modern standard Indonesian
source:
  edition: WLC
  text: אַשְׁרֶ֨י/ךָ יִשְׂרָאֵ֜ל מִ֣י כָמ֗וֹ/ךָ עַ֚ם נוֹשַׁ֣ע בַּֽ/יהוָ֔ה מָגֵ֣ן עֶזְרֶ֔/ךָ וַ/אֲשֶׁר חֶ֖רֶב גַּאֲוָתֶ֑/ךָ וְ/יִכָּֽחֲשׁ֤וּ אֹיְבֶ֨י/ךָ֙ לָ֔/ךְ וְ/אַתָּ֖ה עַל בָּמוֹתֵ֥י/מוֹ תִדְרֹֽךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/029.yaml
  text: Blessed are you[a], Israel! Who is like you, a people saved by Yahweh, the shield of your help and the sword of your majesty? Your enemies will come cringing to you[b], and you will tread on their high places.
translation:
  language: id
  text: Berbahagialah engkau, hai Israel! Siapakah yang seperti engkau, bangsa yang diselamatkan oleh Yahweh? Dialah perisai pertolonganmu dan pedang kemegahanmu. Musuh-musuhmu akan tunduk di hadapanmu[a], dan engkau akan menginjak tempat-tempat tinggi mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “akan berpura-pura tunduk kepadamu”; kata kerja Ibrani dapat menyiratkan ketundukan yang terpaksa atau tidak tulus.
    reason: lexical_alternative
  - marker: b
    text: Atau, “akan menginjak ketinggian-ketinggian mereka” atau “benteng-benteng mereka.” Sebagian penafsir memahami ungkapan ini sebagai “punggung mereka,” tetapi “tempat-tempat tinggi” adalah padanan yang lebih langsung bagi kata benda Ibraninya.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁרֶיךָ
  choice: Berbahagialah engkau
  rationale: Ungkapan seruan אַשְׁרֵי menyatakan keadaan yang patut disebut bahagia atau diberkati. Bentuk ini alami dalam bahasa Indonesia, tetap luhur, dan tidak mengharuskan pembaca memahami bahwa kata tersebut adalah formula pemberkatan langsung.
- source_word: מִי כָמוֹךָ
  choice: Siapakah yang seperti engkau
  rationale: Terjemahan langsung ini mempertahankan pertanyaan retoris yang menegaskan bahwa Israel tidak tertandingi.
- source_word: עַם נוֹשַׁע בַּיהוָה
  choice: bangsa yang diselamatkan oleh Yahweh
  rationale: Partisipel Nifal נוֹשַׁע menggambarkan Israel sebagai bangsa yang menerima tindakan penyelamatan atau pembebasan dari Yahweh. 'Diselamatkan' mempertahankan cakupan makna yang luas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama perjanjian dalam teks Ibrani tetap terlihat.
- source_word: מָגֵן עֶזְרֶךָ
  choice: perisai pertolonganmu
  rationale: Frasa ini mempertahankan susunan padat konstruksi Ibrani dan menyatakan Yahweh sebagai perlindungan yang menjadi sumber pertolongan Israel.
- source_word: וַאֲשֶׁר חֶרֶב גַּאֲוָתֶךָ
  choice: dan pedang kemegahanmu
  rationale: Klausa nominal eliptis ini sejajar dengan gambaran sebelumnya tentang Yahweh. 'Kemegahan' menyampaikan arti positif גַּאֲוָה sebagai keluhuran atau kehormatan tanpa nuansa moral negatif yang mudah melekat pada 'kesombongan'.
- source_word: וְיִכָּחֲשׁוּ אֹיְבֶיךָ לָךְ
  choice: Musuh-musuhmu akan tunduk gemetar kepadamu
  rationale: Dalam konteks penaklukan, כחשׁ dapat menunjuk pada ketundukan yang terpaksa, merendah, atau pura-pura. Terjemahan utama menyampaikan sikap takluk dan gentar, sedangkan kemungkinan kepura-puraan dicatat dalam catatan kaki.
- source_word: עַל בָּמוֹתֵימוֹ תִדְרֹךְ
  choice: engkau akan menginjak tempat-tempat tinggi mereka
  rationale: בָּמוֹת secara langsung berarti tempat-tempat tinggi atau ketinggian. Gambaran puitis militernya dipertahankan tanpa langsung membatasinya menjadi benteng atau punggung musuh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama diri ilahi. Bentuk 'Yahweh' mempertahankan nama perjanjian itu dan membedakannya dari gelar umum.
- issue: Hubungan Yahweh dengan gambaran perisai dan pedang
  choice: Dialah perisai pertolonganmu dan pedang kemegahanmu
  alternative: perisai yang menolongmu dan pedang kebanggaanmu
  rationale: Kata 'Dialah' memperjelas hubungan sintaksis eliptis yang sudah tersirat dalam bahasa Ibrani tanpa mengubah kedua metafora menjadi sekadar benda yang diberikan Yahweh.
- issue: Nuansa גַּאֲוָתֶךָ
  choice: kemegahanmu
  alternative: kebanggaanmu, keluhuranmu, atau kejayaanmu
  rationale: Konteks berkat menuntut arti positif, tetapi istilah sumber tetap mengandung gagasan keagungan atau hal yang dibanggakan. 'Kemegahan' menjaga nada perayaan tanpa memasukkan penilaian tentang kesombongan berdosa.
- issue: Sifat ketundukan musuh
  choice: tunduk gemetar, dengan alternatif ketundukan pura-pura dalam catatan kaki
  alternative: berpura-pura tunduk kepadamu
  rationale: Verba Ibrani dapat memuat ketegangan antara ketakutan, keterpaksaan, dan kepura-puraan. Teks utama tidak menutup seluruh rentang itu, dan catatan kaki mempertahankan alternatif penting.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Sapaan 'hai Israel' mempertahankan seruan langsung; metafora perisai, pedang, dan tempat-tempat tinggi dipertahankan. Penambahan 'Dialah' hanya memperjelas predikasi nominal-eliptis dalam bahasa Indonesia. Semua penanda catatan kaki ditempatkan pada klausa yang benar-benar dijelaskan.
