  yaml_path: translation/ot/deuteronomy/033/026.yaml
  text: There is none like God[a], O Jeshurun, who rides on the heavens to help you[c][b], and in his majesty on the skies.
translation:
  language: id
  text: Tidak ada yang seperti Allah, hai Yesyurun[a], yang mengendarai langit untuk menolongmu[b] dan, dalam keagungan-Nya, mengendarai angkasa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yesyurun adalah nama puitis bagi Israel.
    reason: cultural_note
  - marker: b
    text: Atau, “untuk pertolonganmu.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “awan-awan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵין כָּאֵל
  choice: Tidak ada yang seperti Allah
  rationale: Ungkapan penyangkalan eksistensial ini menyatakan perbandingan mutlak. אֵל dipahami sebagai sebutan umum bagi Allah, bukan nama diri yang perlu ditransliterasikan.
- source_word: יְשֻׁרוּן
  choice: Yesyurun
  rationale: Nama puitis bagi Israel ini dipertahankan sebagai nama diri dan ditransliterasikan menurut kebiasaan ejaan bahasa Indonesia.
- source_word: רֹכֵב
  choice: yang mengendarai
  rationale: Partisipel ini melukiskan tindakan khas Allah. Klausa relatif mempertahankan hubungan sintaksisnya sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: שָׁמַיִם
  choice: langit
  rationale: Dalam konteks puitis, bentuk Ibrani ini menunjuk pada bentangan langit; 'langit' merupakan padanan Indonesia yang alami dan agung.
- source_word: בְעֶזְרֶךָ
  choice: untuk menolongmu
  rationale: Preposisi בְּ di sini paling wajar dipahami menyatakan tujuan atau manfaat. Terjemahan ini lebih jelas daripada bentuk harfiah 'demi pertolonganmu' tanpa menghilangkan maknanya.
- source_word: וּבְגַאֲוָתוֹ
  choice: dan, dalam keagungan-Nya
  rationale: Ketika dikenakan kepada Allah, גַּאֲוָה menyatakan keluhuran atau keagungan, bukan kesombongan bernilai negatif.
- source_word: שְׁחָקִים
  choice: angkasa
  rationale: Istilah puitis ini dapat menunjuk pada langit tinggi atau awan-awan. 'Angkasa' menjaga kesejajaran puitis dengan 'langit' tanpa membatasi maknanya hanya pada awan.
theological_decisions:
- issue: Referen dan fungsi אֵל dalam perbandingan puitis
  choice: Sebutan ilahi umum yang diterjemahkan 'Allah'
  alternative: Nama diri 'El' atau gelar 'Yang Mahakuat'
  rationale: Ayat ini memuji Allah Israel sebagai yang tiada banding. 'Allah' menyampaikan makna istilah tersebut secara alami dalam bahasa Indonesia tanpa menyiratkan adanya dewa lain bernama El.
- issue: Hubungan tindakan רֹכֵב dengan שְׁחָקִים
  choice: Tindakan mengendarai diteruskan secara eliptis sebagai 'melintasi angkasa'
  alternative: 'Mempertahankan elipsis secara harfiah: ''dan dalam keagungan-Nya di angkasa'''
  rationale: Bahasa Ibrani puitis membiarkan kata kerja pertama berlaku juga pada baris kedua. Pengulangan makna secara implisit dalam bahasa Indonesia memperjelas gambaran tanpa mengubah klaim teologisnya.
translation_notes:
  register: Bahasa puitis, agung, dan mudah dipahami. Sapaan 'hai' menandai bentuk vokatif. Kapital pada akhiran pronominal '-Nya' mengikuti konvensi bahasa Indonesia untuk rujukan kepada Allah.
