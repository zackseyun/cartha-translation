  - severity: low
    issue: Rumusan alternatif catatan b
    rationale: “Demi pertolonganmu” dapat dipahami, tetapi “untuk pertolonganmu” lebih langsung mencerminkan alternatif leksikal ‘for your help’ dan lebih lazim dalam bahasa Indonesia modern.
