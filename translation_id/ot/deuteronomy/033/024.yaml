  text: וּ/לְ/אָשֵׁ֣ר אָמַ֔ר בָּר֥וּךְ מִ/בָּנִ֖ים אָשֵׁ֑ר יְהִ֤י רְצוּי֙ אֶחָ֔י/ו וְ/טֹבֵ֥ל בַּ/שֶּׁ֖מֶן רַגְלֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/024.yaml
  text: 'And of Asher he said: “Most blessed of sons is Asher[a]; may he be favored by his brothers[c][b], and may he dip his foot in oil.”'
translation:
  language: id
  text: 'Tentang Asyer ia berkata: “Di antara anak-anak lelaki, Asyer paling diberkati[a]; kiranya ia diperkenan oleh saudara-saudaranya[b], dan mencelupkan kakinya ke dalam minyak[c].”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Asyer diberkati melebihi anak-anak lelaki.” Bentuk perbandingan dalam bahasa Ibrani dapat dipahami sebagai komparatif atau superlatif.
    reason: lexical_alternative
  - marker: b
    text: “Saudara-saudaranya” kemungkinan merujuk pada suku-suku Israel lainnya.
    reason: cultural_note
  - marker: c
    text: Gambaran “mencelupkan kakinya ke dalam minyak” kemungkinan menyatakan kelimpahan atau kemakmuran, tetapi bahasa Ibrani dibiarkan tetap harfiah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאָשֵׁר אָמַר
  choice: Tentang Asyer ia berkata
  rationale: Preposisi לְ memperkenalkan berkat bagi atau mengenai Asyer. “Tentang Asyer” alami dalam bahasa Indonesia dan mempertahankan fungsi wacana rumus ini.
- source_word: בָּרוּךְ מִבָּנִים אָשֵׁר
  choice: Kiranya Asyer menjadi yang paling diberkati di antara anak-anak lelaki
  rationale: Konstruksi dengan מִן dapat menyatakan perbandingan atau superlatif. Bentuk ini menyampaikan daya superlatif dalam konteks berkat, sedangkan kemungkinan komparatif dicatat dalam catatan kaki.
- source_word: יְהִי רְצוּי אֶחָיו
  choice: kiranya ia disenangi oleh saudara-saudaranya
  rationale: יְהִי bernuansa yusif dalam ucapan berkat. רְצוּי menunjuk pada keadaan diterima dengan perkenanan; “disenangi” alami dalam hubungan antarsaudara tanpa menambahkan gagasan kuasa atau status.
- source_word: וְטֹבֵל בַּשֶּׁמֶן רַגְלוֹ
  choice: dan kiranya ia mencelupkan kakinya ke dalam minyak
  rationale: Partisipel טֹבֵל dipahami sejajar dengan harapan sebelumnya. Metafora konkret, bentuk tunggal “kakinya,” dan kata umum “minyak” dipertahankan tanpa mempersempitnya menjadi minyak zaitun.
theological_decisions:
- issue: Makna gambaran mencelupkan kaki ke dalam minyak
  choice: Mempertahankan metafora harfiah dalam teks utama
  alternative: Menafsirkannya langsung sebagai kelimpahan hasil zaitun, kemakmuran, kemewahan, atau keamanan
  rationale: Gambaran Ibrani menyiratkan kelimpahan, tetapi rujukan tepatnya tidak dinyatakan. Terjemahan tidak seharusnya menutup ketegangan puitis ini.
- issue: Daya perbandingan בָּרוּךְ מִבָּנִים
  choice: yang paling diberkati di antara anak-anak lelaki
  alternative: lebih diberkati daripada anak-anak lelaki
  rationale: Konteks berkat suku mendukung pembacaan superlatif, tetapi struktur Ibrani juga dapat dipahami secara komparatif; alternatif itu dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan irama berkat yang khidmat. “Kiranya” mempertahankan nuansa harapan atau doa; metafora puitis dan ambiguitas perbandingan dijaga.
