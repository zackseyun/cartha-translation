  text: וּ/מֵ/רֹ֖אשׁ הַרְרֵי קֶ֑דֶם וּ/מִ/מֶּ֖גֶד גִּבְע֥וֹת עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/015.yaml
  text: and from the choicest things of the ancient mountains[a], and from the abundance of the everlasting hills[b],
translation:
  language: id
  text: 'dan dari hasil terbaik dari pegunungan purba[a],

    dan dari hasil berharga dari bukit-bukit yang kekal[b],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dari puncak pegunungan purba.” Frasa Ibrani ini dapat dipahami secara spasial (“puncak”) atau secara kualitatif (“bagian yang terutama” atau “yang terbaik”).
    reason: lexical_alternative
  - marker: b
    text: Atau, “dari kelimpahan bukit-bukit yang kekal.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֹאשׁ
  choice: dari hasil terbaik
  rationale: רֹאשׁ secara harfiah berarti 'kepala' atau 'puncak', tetapi dalam konteks berkat dapat menunjuk pada bagian yang terutama atau terbaik. Paralelismenya dengan מִמֶּגֶד mendukung pengertian kualitatif, sementara kemungkinan spasial dipertahankan dalam catatan kaki.
- source_word: הַרְרֵי
  choice: pegunungan
  rationale: Bentuk jamak konstruksi dari הַר, dibedakan dari גִּבְעוֹת, 'bukit-bukit', pada baris berikutnya.
- source_word: קֶדֶם
  choice: purba
  rationale: Dalam kesejajaran puitis dengan עוֹלָם, makna temporal 'dahulu kala/purba' lebih wajar daripada makna arah 'timur'.
- source_word: מִמֶּגֶד
  choice: dari hasil berharga
  rationale: מֶגֶד menunjuk pada hasil atau pemberian yang bernilai dan baik. 'Hasil berharga' alami dalam konteks berkat atas kesuburan serta tidak membatasi acuannya secara berlebihan.
- source_word: גִּבְעוֹת
  choice: bukit-bukit
  rationale: Padanan baku yang mempertahankan perbedaannya dari הַרְרֵי, 'pegunungan'.
- source_word: עוֹלָם
  choice: yang kekal
  rationale: Ungkapan ini mempertahankan daya puitis עוֹלָם sebagai keberlangsungan tanpa batas atau sejak zaman lampau, tanpa menyamakannya begitu saja dengan קֶדֶם.
