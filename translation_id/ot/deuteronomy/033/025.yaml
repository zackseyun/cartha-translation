  yaml_path: translation/ot/deuteronomy/033/025.yaml
  text: Your bars shall be iron and bronze[a], and as your days[b], so shall your strength be.
translation:
  language: id
  text: Palangmu akan terbuat dari besi dan perunggu[a]; dan seperti hari-harimu, demikianlah kekuatanmu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Alas kakimu akan terbuat dari besi dan perunggu.” Kata Ibrani ini dapat berarti alas kaki, tetapi banyak penafsir memahaminya di sini sebagai palang atau pengunci mengingat gambaran logam dan konteks keamanan.
    reason: lexical_alternative
  - marker: b
    text: Atau, “demikianlah ketenanganmu” atau “demikianlah keamananmu.” Kata Ibrani terakhir sangat jarang dan maknanya tidak pasti; “kekuatan” merupakan terjemahan tradisional yang sesuai dengan konteks berkat.
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּרְזֶל
  choice: besi
  rationale: Makna baku bagi logam ini dan merupakan pasangan material dengan נְחֹשֶׁת.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Kata ini dapat menunjuk pada tembaga atau perunggu secara luas; dalam pasangan dengan besi, 'perunggu' alami dalam bahasa Indonesia dan sesuai dengan gambaran logam pada ayat ini.
- source_word: מִנְעָלֶיךָ
  choice: palang-palangmu
  rationale: Walaupun nomina ini dapat berarti alas kaki atau kasut, logam dan konteks berkat tentang keamanan mendukung pengertian palang atau pengunci. Ketidakpastian leksikalnya dipertahankan dalam catatan kaki.
- source_word: וּכְיָמֶיךָ
  choice: dan seperti hari-harimu
  rationale: Prefiks כ menyatakan perbandingan atau kesepadanan. Ungkapan Ibrani yang ringkas ini dipertahankan tanpa membatasi 'hari-hari' hanya pada usia atau keadaan sehari-hari.
- source_word: דָּבְאֶךָ
  choice: kekuatanmu
  rationale: Istilah yang sangat jarang dan tidak pasti ini secara tradisional dipahami sebagai kekuatan atau daya yang menopang, dan pengertian itu sesuai dengan konteks berkat. Kemungkinan makna lain dicatat dalam catatan kaki.
theological_decisions:
- issue: Gambaran dan janji dalam berkat
  choice: Ayat ini menggambarkan keamanan yang kokoh dan kekuatan yang menyertai sepanjang hari-hari pihak yang disapa.
  alternative: Ayat ini dapat menggambarkan alas kaki yang kuat untuk medan berat; klausa terakhir juga mungkin menjanjikan ketenteraman atau keamanan sepanjang hari-harinya.
  rationale: Teks Ibrani mengandung dua istilah yang maknanya diperdebatkan. Teks utama mengikuti pembacaan yang koheren dalam konteks berkat, sedangkan alternatif yang sungguh mungkin dipertahankan dalam catatan kaki agar ketegangan penafsirannya tidak dihilangkan.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Susunan paralel 'seperti ... demikianlah ...' mempertahankan bentuk perbandingan Ibrani, sementara pengulangan 'palang-palang' menyampaikan kemungkinan bentuk jamak atau kolektif secara alami.
