source:
  edition: WLC
  text: לְ/בִנְיָמִ֣ן אָמַ֔ר יְדִ֣יד יְהֹוָ֔ה יִשְׁכֹּ֥ן לָ/בֶ֖טַח עָלָ֑י/ו חֹפֵ֤ף עָלָי/ו֙ כָּל הַ/יּ֔וֹם וּ/בֵ֥ין כְּתֵיפָ֖י/ו שָׁכֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/012.yaml
  text: 'And of Benjamin he said: “The beloved of Yahweh dwells in safety by him[a]; he shields him all the day[b], and he dwells between his shoulders.”'
translation:
  language: id
  text: 'Tentang Benyamin ia berkata,

    “Kekasih Yahweh tinggal dengan aman di dekatnya[a];

    ia menaunginya sepanjang hari,

    dan ia tinggal di antara bahunya.”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “tinggal dengan aman di sisinya,” “di bawahnya,” atau “di atasnya.” Preposisi Ibraninya ringkas dan dapat menyatakan kedekatan atau naungan yang melindungi.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “di antara bahunya.” Ada yang memahaminya sebagai gambaran kedekatan dan perlindungan; yang lain memahaminya secara topografis sebagai daerah perbukitan Benyamin atau tempat suci yang berada di wilayah Benyamin. Rujukan kata ganti dalam baris ini juga tidak sepenuhnya pasti.
    reason: alternative_reading
lexical_decisions:
- source_word: לְבִנְיָמִן
  choice: Tentang Benyamin
  rationale: Dalam rangkaian berkat bagi suku-suku Israel, frasa ini berfungsi sebagai judul yang memperkenalkan perkataan mengenai Benyamin. ‘Tentang Benyamin’ alami dalam bahasa Indonesia dan tetap mencakup nuansa ‘kepada/bagi Benyamin’.
- source_word: יְדִיד יְהוָה
  choice: Kekasih Yahweh
  rationale: יְדִיד menunjuk kepada orang yang dikasihi. ‘Kekasih Yahweh’ ringkas, hangat, dan mempertahankan nama ilahi יהוה sebagai Yahweh.
- source_word: יִשְׁכֹּן לָבֶטַח
  choice: tinggal dengan aman
  rationale: שׁכן berarti tinggal atau menetap, sedangkan לָבֶטַח menyatakan keadaan aman. Ungkapan ini jelas dan wajar dalam bahasa Indonesia.
- source_word: עָלָיו
  choice: di dekatnya
  rationale: Preposisi עַל dalam baris puitis ini padat dan dapat menyatakan kedekatan maupun posisi perlindungan. ‘Di dekatnya’ menyampaikan kedekatan tanpa menetapkan gambaran ruang secara terlalu sempit; kemungkinan lain dicatat dalam catatan kaki.
- source_word: חֹפֵף עָלָיו
  choice: ia menaunginya
  rationale: Partisip חֹפֵף menggambarkan tindakan menutupi atau menaungi sebagai perlindungan. ‘Menaunginya’ mempertahankan citra puitis sekaligus menyampaikan makna perlindungan.
- source_word: כָּל הַיּוֹם
  choice: sepanjang hari
  rationale: Ungkapan ini merupakan padanan Indonesia yang alami bagi ‘seluruh hari’ dan tetap sesuai dengan ragam puisi yang bermartabat.
- source_word: וּבֵין כְּתֵיפָיו שָׁכֵן
  choice: dan ia tinggal di antara bahunya
  rationale: Terjemahan ini mempertahankan citra harfiah ‘di antara bahu-bahunya’ serta pengulangan akar שׁכן. Kata ganti dibiarkan tanpa kapitalisasi agar ketidakjelasan rujukannya dalam bahasa Ibrani tidak diselesaikan secara diam-diam.
theological_decisions:
- issue: Rujukan kata-kata ganti dalam ayat
  choice: 'Teks utama mempertahankan kata ganti ‘ia/-nya’ tanpa kapitalisasi, sehingga susunan puitisnya tetap terbuka: Benyamin, sang kekasih, tinggal aman dekat Yahweh dan dinaungi-Nya, sementara rujukan klausa terakhir tidak dipastikan secara eksplisit.'
  alternative: Yahweh tinggal di atas Benyamin dan di antara bahu Benyamin; atau Benyamin tinggal di antara bahu Yahweh.
  rationale: Bentuk-bentuk pronominal Ibrani dan susunan puisi yang ringkas memungkinkan lebih dari satu pemahaman. Menetapkan semua rujukan melalui kapitalisasi akan menyelesaikan ketegangan yang tidak diselesaikan oleh teks sumber.
- issue: Makna gambaran ‘di antara bahunya’
  choice: Mempertahankan gambaran tubuh secara harfiah dalam teks utama.
  alternative: Menafsirkannya secara topografis sebagai lereng-lereng pegunungan Benyamin atau sebagai acuan kepada tempat suci di wilayah Benyamin.
  rationale: Arti dasar כָּתֵף adalah ‘bahu/sisi’. Terjemahan harfiah menjaga metafora dan tidak menjadikan salah satu penafsiran historis-topografis sebagai bagian dari teks utama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan puitis yang ringkas dan bermartabat. Nama ilahi diterjemahkan ‘Yahweh’. Kata ganti ilahi tidak dikapitalisasi dalam ayat ini agar ambiguitas rujukan dalam teks Ibrani tetap terpelihara. Setiap penanda catatan kaki ditempatkan langsung pada bagian teks yang dijelaskannya.
