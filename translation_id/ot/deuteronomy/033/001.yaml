  yaml_path: translation/ot/deuteronomy/033/001.yaml
  text: 'This is the blessing with which Moses[a], the man of God, blessed the sons of Israel before his death:'
translation:
  language: id
  text: 'Inilah berkat yang diberikan Musa, abdi Allah, kepada Bani Israel sebelum kematiannya:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזֹאת
  choice: Inilah
  rationale: Gabungan kata sambung dan penunjuk ini memperkenalkan bagian baru. “Inilah” alami dalam bahasa Indonesia dan menonjolkan berkat yang segera disampaikan tanpa menambahkan keterangan waktu.
- source_word: הַבְּרָכָה
  choice: berkat
  rationale: Kata ini menunjuk pada berkat atau pernyataan berkat resmi. Bentuk definitnya tercakup secara alami dalam konstruksi “Inilah berkat”.
- source_word: אֲשֶׁר בֵּרַךְ
  choice: yang diucapkan ... atas
  rationale: Ungkapan ini secara harfiah menyatakan bahwa Musa memberkati Israel dengan berkat tersebut. “Berkat yang diucapkan ... atas” menyampaikan fungsi deklaratif dan relasi sasarannya dengan bahasa Indonesia yang wajar.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk nama yang baku dalam bahasa Indonesia.
- source_word: אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  rationale: Ini adalah gelar yang dikenal bagi seorang yang ditugaskan Allah. “Abdi Allah” merupakan padanan Indonesia yang alami, ringkas, dan bermartabat.
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: atas keturunan Israel
  rationale: Secara harfiah frasa ini berarti “anak-anak lelaki Israel”, tetapi di sini berfungsi sebagai sebutan kolektif bagi umat yang berasal dari Israel. “Keturunan Israel” mempertahankan unsur kekerabatan tanpa memberi kesan bahwa hanya laki-laki yang dimaksud.
- source_word: לִפְנֵי מוֹתוֹ
  choice: sebelum kematiannya
  rationale: Padanan langsung yang mempertahankan konstruksi nominal dan ragam khidmat sumber.
theological_decisions:
- issue: Cakupan kolektif בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak lelaki Israel; bani Israel; orang Israel
  rationale: Bentuk Ibraninya maskulin dan secara harfiah berarti “anak-anak lelaki Israel”, tetapi merupakan ungkapan kolektif baku bagi seluruh umat Israel. “Keturunan Israel” menjaga citra hubungan keluarga sekaligus menyampaikan cakupan kolektifnya; catatan kaki mempertahankan bentuk harfiahnya.
- issue: Gelar אִישׁ הָאֱלֹהִים
  choice: abdi Allah
  alternative: orang Allah; manusia milik Allah
  rationale: Frasa ini adalah gelar bagi seorang utusan atau pelayan Allah, bukan pernyataan mengenai hakikat Musa. Padanan “abdi Allah” mempertahankan fungsi gelarnya tanpa memasukkan penafsiran denominasi tertentu.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Susunan “berkat yang diucapkan ... atas” dipilih agar deklarasi berkat terdengar alami, sedangkan tanda titik dua dipertahankan karena ayat ini memperkenalkan berkat-berkat berikutnya.
