  text: וּ/לְ/גָ֣ד אָמַ֔ר בָּר֖וּךְ מַרְחִ֣יב גָּ֑ד כְּ/לָבִ֣יא שָׁכֵ֔ן וְ/טָרַ֥ף זְר֖וֹעַ אַף קָדְקֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/020.yaml
  text: 'And of Gad he said: “Blessed is he who enlarges Gad[a]. He dwells like a lioness, and tears off arm[c][b], even scalp.”'
translation:
  language: id
  text: 'Tentang Gad ia berkata:


    “Diberkatilah dia yang memberi kelapangan kepada Gad.[a]

    Ia berdiam seperti singa[b]

    dan mencabik lengan, bahkan ubun-ubun.[c]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Diberkatilah dia yang memperluas Gad.” Pelakunya mungkin dipahami sebagai Allah, tetapi teks Ibrani tidak menyebutkannya secara eksplisit.
    reason: alternative_reading
  - marker: b
    text: Kata Ibrani ini dapat menunjuk pada singa yang kuat dan juga dapat diterjemahkan “singa betina”.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “lengan, bahkan puncak kepala”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְגָד
  choice: Tentang Gad
  rationale: Rumus ini memperkenalkan ucapan berkat mengenai suku Gad; bentuk ini alami dalam bahasa Indonesia.
- source_word: בָּרוּךְ
  choice: Diberkatilah
  rationale: Mempertahankan bentuk seruan berkat tanpa mengubahnya menjadi pernyataan biasa.
- source_word: מַרְחִיב
  choice: dia yang memperluas wilayah
  rationale: Partisipel Hifil menyatakan tindakan membuat luas atau memberi ruang. Kata 'wilayah' membuat maksud teritorialnya wajar dalam bahasa Indonesia, sedangkan pelakunya tetap tidak disebutkan secara eksplisit.
- source_word: כְּלָבִיא
  choice: seperti singa
  rationale: Istilah Ibrani menunjuk pada singa yang kuat dan dapat dipahami sebagai singa jantan atau betina; 'singa' mempertahankan ketidakpastian itu secara alami.
- source_word: שָׁכֵן
  choice: Ia berdiam
  rationale: Kata kerja ini dapat berarti tinggal, menetap, atau berbaring. 'Berdiam' sesuai dengan gambaran suku di wilayahnya sekaligus tetap cocok dengan perumpamaan singa.
- source_word: וְטָרַף
  choice: dan mencabik
  rationale: Mengungkapkan tindakan pemangsa yang merobek mangsanya dan mempertahankan kekerasan gambaran puitis.
- source_word: זְרוֹעַ
  choice: lengan
  rationale: Makna anggota tubuh dipertahankan dalam kesejajaran dengan bagian kepala.
- source_word: אַף קָדְקֹד
  choice: bahkan ubun-ubun
  rationale: אַף berfungsi menambahkan atau menguatkan, sedangkan קָדְקֹד menunjuk pada bagian paling atas kepala.
theological_decisions:
- issue: Pelaku yang memperluas wilayah Gad
  choice: Tidak menyebut Allah secara eksplisit; memakai 'dia yang memperluas wilayah Gad'.
  alternative: Menyatakan secara langsung bahwa Allah memperluas wilayah Gad.
  rationale: Bahasa Ibrani tidak menyebut pelakunya. Allah mungkin dipahami sebagai pelaku tersirat, tetapi terjemahan mempertahankan keterbukaan rujukan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan larik puitis yang ringkas. Diksi 'Diberkatilah' mempertahankan nada berkat yang khidmat; istilah 'singa' menghindari penentuan gender yang tidak diwajibkan oleh konteks.
