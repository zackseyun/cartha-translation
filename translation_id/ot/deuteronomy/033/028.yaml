  text: וַ/יִּשְׁכֹּן֩ יִשְׂרָאֵ֨ל בֶּ֤טַח בָּדָד֙ עֵ֣ין יַעֲקֹ֔ב אֶל אֶ֖רֶץ דָּגָ֣ן וְ/תִיר֑וֹשׁ אַף שָׁמָ֖י/ו יַֽעַרְפוּ טָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/028.yaml
  text: So Israel lived in safety[a], alone; Jacob's fountain in a land of grain and new wine[b]; even his heavens dripped dew.
translation:
  language: id
  text: Maka Israel tinggal dengan aman, tersendiri; mata air[a] Yakub berada di negeri gandum dan anggur baru;[b] bahkan langit di atasnya menitikkan embun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “mata air” juga dapat berarti “mata”; karena itu frasa ini dapat diterjemahkan “mata Yakub”.
    reason: lexical_alternative
  - marker: b
    text: Susunan puisi Ibrani ini padat dan dapat juga dipahami, “Israel tinggal dengan aman, seorang diri—mata air Yakub—di negeri gandum dan anggur baru.” Kata yang diterjemahkan “di” secara harfiah dapat berarti “ke” atau “menuju”.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁכֹּן
  choice: tinggal
  rationale: Kata kerja שׁכן berarti tinggal atau menetap. “Tinggal” alami dalam bahasa Indonesia modern dan tetap menyatakan kediaman yang mantap.
- source_word: בֶּטַח
  choice: dengan aman
  rationale: Di sini בֶּטַח berfungsi adverbial dan menggambarkan keadaan Israel yang tenteram serta terlindung.
- source_word: בָּדָד
  choice: tersendiri
  rationale: בָּדָד menyatakan keterpisahan atau keadaan sendiri. “Tersendiri” menghindari kesan kesepian atau ditinggalkan yang tidak dituntut oleh konteks berkat.
- source_word: עֵין יַעֲקֹב
  choice: mata air Yakub
  rationale: עֵין dapat berarti “mata” atau “mata air”. Gambaran negeri subur, gandum, anggur baru, dan embun mendukung arti “mata air”, sementara alternatif harfiahnya dicatat dalam catatan kaki.
- source_word: אֶל אֶרֶץ
  choice: berada di negeri
  rationale: Walaupun אֶל biasanya berarti “ke/menuju”, dalam baris puitis ini relasinya dapat dipahami secara lokatif. Kopula “berada” ditambahkan demi kalimat Indonesia yang wajar tanpa menambah pelaku atau tindakan baru.
- source_word: דָּגָן
  choice: gandum
  rationale: דָּגָן adalah hasil biji-bijian secara umum. “Gandum” merupakan ungkapan Alkitab Indonesia yang mudah dipahami, meski cakupan kata Ibraninya lebih luas.
- source_word: תִירוֹשׁ
  choice: anggur baru
  rationale: תִירוֹשׁ menunjuk hasil anggur yang baru atau segar dan merupakan bagian dari gambaran kelimpahan pertanian.
- source_word: אַף
  choice: bahkan
  rationale: 'אַף memberi penekanan klimaks: bukan hanya tanah, bahkan langit turut menyediakan berkat.'
- source_word: שָׁמָיו
  choice: langit di atasnya
  rationale: Akhiran orang ketiga tunggal dipertahankan secara idiomatis; yang dimaksud ialah langit milik atau yang membentang di atas Israel/Yakub.
- source_word: יַעַרְפוּ
  choice: menitikkan
  rationale: Bentuk kata kerja ini menggambarkan cairan yang menetes atau menitik. “Menitikkan” cocok dengan embun dan tetap puitis.
- source_word: טָל
  choice: embun
  rationale: Padanan langsung yang mempertahankan gambaran kesuburan dan berkat.
theological_decisions:
- issue: Makna עֵין יַעֲקֹב
  choice: Diterjemahkan “mata air Yakub”.
  alternative: “mata Yakub”
  rationale: Konteks kesuburan mendukung arti “mata air”, tetapi polisemi asli tetap diakui dalam catatan kaki dan tidak diberi penafsiran doktrinal tambahan.
- issue: Hubungan בָּדָד dengan unsur-unsur dalam baris
  choice: “Tersendiri” dibaca sebagai keterangan keadaan Israel yang tinggal dengan aman.
  alternative: Frasa itu dapat dihubungkan lebih erat dengan “mata air Yakub”, atau diterjemahkan “seorang diri/terpisah”.
  rationale: Urutan kata memungkinkan lebih dari satu pengelompokan puitis. Teks utama memilih pembacaan yang paling wajar dalam bahasa Indonesia, sedangkan alternatif sintaksis dicatat.
- issue: Relasi אֶל אֶרֶץ
  choice: 'Dinyatakan secara lokatif: “berada di negeri”.'
  alternative: “menuju negeri” atau “ke negeri”
  rationale: Pembacaan lokatif sesuai dengan gambaran Israel yang menetap dan menikmati hasil negeri, tetapi arti arah dari preposisi Ibrani tetap diberitahukan.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan puitis tanpa bentuk arkais. Tanda titik koma mempertahankan gerak baris puisi Ibrani. “Berlimpah” mengungkapkan hubungan idiomatis “negeri gandum dan anggur baru”; catatan kaki menjaga keterbukaan terhadap susunan yang lebih harfiah.
