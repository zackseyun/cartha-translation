  yaml_path: translation/ot/deuteronomy/033/006.yaml
  text: May Reuben live and not die[a], and may his men be few.
translation:
  language: id
  text: Kiranya Ruben hidup dan jangan mati, dan kiranya orang-orangnya berjumlah sedikit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dan kiranya orang-orangnya terhitung.” Klausa akhir ayat ini sulit dalam bahasa Ibrani dan juga dapat dipahami sebagai doa agar Ruben tidak menjadi tidak penting atau tidak dikeluarkan dari hitungan suku-suku.
    reason: alternative_reading
lexical_decisions:
- source_word: יְחִי
  choice: Kiranya ... hidup
  rationale: Bentuk jussif Qal dari חיה menyatakan harapan atau berkat. “Kiranya ... hidup” mempertahankan daya volitifnya dalam bahasa Indonesia yang wajar dan bermartabat.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Nama pribadi sekaligus nama suku ditransliterasikan menurut bentuk baku yang lazim dalam Alkitab bahasa Indonesia.
- source_word: וְאַל יָמֹת
  choice: dan tidak mati
  rationale: אַל dengan bentuk jussif menyatakan harapan negatif. Ungkapan ini mempertahankan kesejajaran ringkas dengan klausa sebelumnya dan menerjemahkan מות dengan arti dasarnya, “mati”.
- source_word: וִיהִי
  choice: dan kiranya ...
  rationale: Bentuk jussif kedua memperkenalkan harapan atau berkat berikutnya; “dan kiranya” mempertahankan kesejajaran struktur tersebut.
- source_word: מְתָיו
  choice: orang-orangnya
  rationale: Kata yang sulit ini dalam konteks berkat suku paling mungkin menunjuk kepada orang-orang atau anggota suku Ruben. “Orang-orangnya” lebih alami dan tidak terlalu bercorak militer dibandingkan “para prajuritnya” atau “kaum laki-lakinya”.
- source_word: מִסְפָּר
  choice: sedikit jumlahnya
  rationale: Secara harfiah berarti “jumlah/bilangan”. Bersama היה, ungkapan ini paling mungkin berarti dapat dihitung atau sedikit jumlahnya. Bahasa Indonesia memerlukan perumusan idiomatis; ketaksaan teks Ibrani tetap dicatat dalam catatan kaki.
theological_decisions:
- issue: Penafsiran klausa akhir וִיהִי מְתָיו מִסְפָּר
  choice: “dan kiranya orang-orangnya sedikit jumlahnya,” yakni doa agar Ruben tetap hidup meskipun kecil jumlahnya
  alternative: “dan kiranya orang-orangnya tetap terhitung,” yakni tidak dikeluarkan dari hitungan atau daftar suku
  rationale: Teks Masoretik singkat dan sulit. Pembacaan “sedikit jumlahnya” paling langsung berdasarkan מִסְפָּר dengan היה, sedangkan pembacaan yang lebih positif bergantung pada pemahaman idiom yang kurang pasti atau usulan perubahan teks. Catatan kaki mempertahankan alternatif utama tanpa menghapus ketegangan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Kiranya” dipakai untuk menyampaikan bentuk doa atau berkat, sedangkan susunan kalimat dijaga ringkas sesuai dengan puisi Ibrani. Penanda catatan kaki ditempatkan setelah klausa yang dipersoalkan.
