source:
  edition: WLC
  text: עַמִּים֙ הַר יִקְרָ֔אוּ שָׁ֖ם יִזְבְּח֣וּ זִבְחֵי צֶ֑דֶק כִּ֣י שֶׁ֤פַע יַמִּים֙ יִינָ֔קוּ וּ/שְׂפוּנֵ֖י טְמ֥וּנֵי חֽוֹל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/019.yaml
  text: They will call peoples to the mountain[a]; there they will sacrifice righteous sacrifices[c][b], for they will draw from the abundance of the seas and from the hidden treasures of the sand.
translation:
  language: id
  text: Mereka akan memanggil bangsa-bangsa ke gunung[a]; di sana mereka akan mempersembahkan kurban yang benar[b]. Sebab, mereka akan menimba kelimpahan dari laut[c] dan harta terpendam di dalam pasir[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ke sebuah gunung”. Teks Ibrani tidak menyebutkan gunung mana yang dimaksud.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “kurban-kurban kebenaran”; dapat berarti kurban yang benar atau tepat secara kultis, atau kurban yang dipersembahkan dengan benar.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “mengisap kelimpahan laut”, yaitu gambaran tentang memperoleh nafkah atau kekayaan dari laut.
    reason: lexical_alternative
  - marker: d
    text: Atau “hal-hal tersembunyi di dalam pasir”; mungkin menunjuk kepada sumber daya di pantai atau daerah berpasir.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמִּים
  choice: bangsa-bangsa
  rationale: Bentuk jamak עַם menunjuk kepada sejumlah kelompok masyarakat. “Bangsa-bangsa” mempertahankan makna kolektifnya tanpa menjadikannya sekadar orang-orang perorangan.
- source_word: הַר
  choice: gunung
  rationale: Bahasa Ibrani tidak memakai kata sandang dan tidak menyebut identitas gunung tersebut. Bentuk Indonesia tanpa “itu” atau “sebuah” secara wajar mempertahankan ketidakpastian ini.
- source_word: יִקְרָאוּ
  choice: akan memanggil
  rationale: קרא dapat berarti memanggil, mengundang, atau menghimpun. “Memanggil” menjaga keluasan makna itu.
- source_word: יִזְבְּחוּ
  choice: akan mempersembahkan kurban-kurban
  rationale: זבח berkaitan khusus dengan penyembelihan atau persembahan kurban. Ungkapan ini menyampaikan tindakan peribadatan secara alami dalam bahasa Indonesia.
- source_word: זִבְחֵי צֶדֶק
  choice: kurban-kurban yang benar
  rationale: Frasa konstruksi ini secara harfiah adalah “kurban-kurban kebenaran”. “Yang benar” mempertahankan kemungkinan bahwa kurban itu tepat, adil, atau dipersembahkan dengan benar tanpa mempersempitnya menjadi satu tafsiran.
- source_word: שֶׁפַע יַמִּים
  choice: kelimpahan laut
  rationale: שׁפע berarti kelimpahan atau hasil berlimpah. Bentuk ini cukup luas untuk mencakup hasil, sumber daya, dan kekayaan yang berasal dari laut.
- source_word: יִינָקוּ
  choice: akan menimba
  rationale: Arti harfiahnya ialah “mengisap”. “Menimba” menyampaikan gambaran memperoleh nafkah atau kekayaan dari laut dengan lebih alami, sementara metafora sumber dipertahankan dan arti literal dicatat.
- source_word: וּשְׂפוּנֵי טְמוּנֵי חוֹל
  choice: dan harta terpendam di dalam pasir
  rationale: Rangkaian kata ini menekankan sesuatu yang tersembunyi atau tersimpan dalam pasir. “Harta terpendam” menjaga gaya puitis tanpa menentukan jenis sumber dayanya.
theological_decisions:
- issue: Makna זִבְחֵי צֶדֶק
  choice: kurban-kurban yang benar
  alternative: kurban-kurban kebenaran; kurban yang dipersembahkan dalam kebenaran; kurban yang berkenan
  rationale: Teks dapat menunjuk kepada kurban yang tepat secara kultis, kurban yang dipersembahkan dengan benar, atau kurban yang bercirikan kebenaran. Terjemahan tidak memasukkan kategori teologis yang lebih kemudian.
- issue: Identitas הַר
  choice: gunung, tanpa identifikasi khusus
  alternative: Gunung Sion; sebuah gunung; kawasan pegunungan mereka
  rationale: Teks Ibrani tidak menyebut Sion, Sinai, atau tempat suci tertentu. Karena itu, identitas gunung dibiarkan terbuka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Struktur paralel ayat dipertahankan, sedangkan ungkapan yang terlalu harfiah dijelaskan melalui catatan kaki. Istilah “kurban” dipakai menurut ejaan baku modern.
