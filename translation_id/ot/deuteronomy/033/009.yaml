  text: הָ/אֹמֵ֞ר לְ/אָבִ֤י/ו וּ/לְ/אִמּ/וֹ֙ לֹ֣א רְאִיתִ֔י/ו וְ/אֶת אֶחָי/ו֙ לֹ֣א הִכִּ֔יר וְ/אֶת בנ/ו לֹ֣א יָדָ֑ע כִּ֤י שָֽׁמְרוּ֙ אִמְרָתֶ֔/ךָ וּ/בְרִֽיתְ/ךָ֖ יִנְצֹֽרוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/009.yaml
  text: who said of his father and his mother[a], ‘I have not seen him,’ and did not acknowledge his brothers or know his sons; for they kept your word and guarded your covenant.
translation:
  language: id
  text: yang berkata tentang ayah dan ibunya, “Aku tidak mengindahkannya,”[a] dan tidak mengakui saudara-saudara laki-lakinya atau mengenal anak-anak lelakinya; sebab mereka memegang teguh firman-Mu dan menjaga perjanjian-Mu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Aku tidak melihatnya.” Dalam konteks ini, ungkapan tersebut tampaknya berarti tidak menghiraukannya atau tidak memberikan pengakuan khusus kepadanya ketika kesetiaan pada perjanjian bertentangan dengan tuntutan keluarga.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאֹמֵר
  choice: yang berkata
  rationale: Partisipel substantival ini meneruskan acuan kepada Lewi dan paling wajar dinyatakan sebagai klausa relatif.
- source_word: לְאָבִיו וּלְאִמּוֹ
  choice: tentang ayah dan ibunya
  rationale: Preposisi ל dengan אמר dapat menunjuk kepada orang yang dibicarakan atau disapa. Dalam konteks penolakan tuntutan kekerabatan, “tentang” menyampaikan hubungannya dengan klausa berikut tanpa menentukan bahwa ucapan itu langsung ditujukan kepada mereka.
- source_word: לֹא רְאִיתִיו
  choice: Aku tidak mengindahkannya
  rationale: Secara harfiah verba ראה berarti “melihat”, tetapi dalam konteks kesetiaan perjanjian yang didahulukan daripada ikatan keluarga, ungkapan ini bermakna tidak menghiraukan atau tidak memberi perhatian khusus. Akhiran tunggal -nya dipertahankan sebagaimana bentuk Ibrani.
- source_word: הִכִּיר
  choice: mengakui
  rationale: Bentuk Hifil di sini menyatakan pengenalan atau pengakuan relasional, bukan sekadar kemampuan mengenali wajah.
- source_word: אֶחָיו
  choice: saudara-saudara laki-lakinya
  rationale: Nomina Ibrani berbentuk maskulin jamak dan secara khusus menunjuk saudara laki-laki.
- source_word: בָּנָיו
  choice: anak-anak lelakinya
  rationale: Teks Ibrani secara khusus menyebut para anak laki-laki; bentuk ini mempertahankan ketepatan gender tanpa memakai istilah yang terlalu tinggi.
- source_word: יָדָע
  choice: mengenal
  rationale: Arti dasar ידע dipertahankan, sementara konteks paralelnya menunjukkan pengenalan relasional.
- source_word: כִּי
  choice: sebab
  rationale: Konjungsi ini memperkenalkan alasan bagi tindakan yang disebut sebelumnya.
- source_word: שָׁמְרוּ
  choice: memegang teguh
  rationale: שׁמר berarti menjaga atau menaati. “Memegang teguh” wajar dipasangkan dengan firman dan mempertahankan nuansa kesetiaan.
- source_word: אִמְרָתֶךָ
  choice: firman-Mu
  rationale: אמרה berarti perkataan atau ucapan. Dalam sapaan kepada Allah, “firman-Mu” alami dan tidak mempersempit maknanya menjadi satu perintah tertentu.
- source_word: בְּרִיתְךָ
  choice: perjanjian-Mu
  rationale: Padanan baku dan jelas bagi ברית dalam konteks hubungan perjanjian dengan Allah.
- source_word: יִנְצֹרוּ
  choice: menjaga
  rationale: נצר mengandung nuansa menjaga atau melindungi. Pilihan ini membedakannya dari שׁמר dan mempertahankan variasi leksikal dalam paralelisme.
theological_decisions:
- issue: Peralihan dari bentuk tunggal ke bentuk jamak
  choice: Bentuk tunggal dalam uraian tentang Lewi dan bentuk jamak dalam alasannya dipertahankan.
  alternative: Menyeragamkan seluruh ayat sebagai tunggal atau jamak.
  rationale: Teks Ibrani berbicara tentang Lewi secara representatif dengan bentuk tunggal, lalu beralih kepada bentuk jamak “mereka” untuk kaum Lewi. Menyeragamkannya akan menghapus ketegangan gramatikal dan sifat korporat yang ada dalam sumber.
- issue: Kesetiaan perjanjian dan ikatan keluarga
  choice: Ungkapan tentang tidak mengindahkan keluarga diterjemahkan secara relasional tanpa menambahkan penilaian doktrinal.
  alternative: Menjelaskannya sebagai penolakan mutlak terhadap keluarga atau sebagai rujukan eksplisit kepada satu peristiwa sejarah tertentu.
  rationale: Ayat menonjolkan prioritas kesetiaan kepada firman dan perjanjian Allah, tetapi tidak menjabarkan semua implikasi etis atau menentukan peristiwa tertentu dalam teks ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Diksi “mengindahkan”, “memegang teguh”, dan “perjanjian” mempertahankan bobot puitis ucapan berkat tanpa menjadi arkais. Bentuk tunggal “-nya” dan peralihan kemudian kepada “mereka” sengaja dipertahankan sesuai struktur Ibrani.
