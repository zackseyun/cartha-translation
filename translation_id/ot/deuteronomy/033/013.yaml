base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/013.yaml
  text: And of Joseph he said[a], “Blessed by Yahweh be his land, with the choicest things of heaven, with dew[b], and from the deep lying beneath,”
translation:
  language: id
  text: 'Tentang Yusuf ia berkata,


    “Kiranya negerinya diberkati oleh Yahweh


    dengan yang terbaik dari langit, dengan embun,


    dan dari kedalaman[a] yang terhampar di bawah;”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Kedalaman” kemungkinan menunjuk pada perairan dalam di bawah tanah.
    reason: cultural_note
lexical_decisions:
- source_word: וּלְיוֹסֵף
  choice: Tentang Yusuf
  rationale: Dalam rangkaian berkat bagi suku-suku, לְ dengan nama Yusuf secara alami memperkenalkan pihak yang dibicarakan; 'Tentang Yusuf' jelas dan wajar dalam bahasa Indonesia.
- source_word: מְבֹרֶכֶת יְהוָה אַרְצוֹ
  choice: Kiranya negerinya diberkati Yahweh
  rationale: Partisip pasif dalam rumusan berkat dipertahankan sebagai ungkapan harapan. 'Negeri' menunjuk wilayah yang diberikan kepada keturunan Yusuf.
- source_word: מִמֶּגֶד שָׁמַיִם מִטָּל
  choice: dengan yang terbaik dari langit, dengan embun
  rationale: מֶגֶד menyatakan sesuatu yang unggul, berharga, atau hasil pilihan. Susunan Ibrani membiarkan hubungan antara 'langit' dan 'embun' agak renggang, sehingga keduanya tidak dilebur menjadi satu frasa penjelas.
- source_word: וּמִתְּהוֹם
  choice: dan dari samudra raya
  rationale: תְּהוֹם menunjuk kedalaman air purba atau massa air yang dalam; 'samudra raya' mempertahankan citra puitis tanpa mengubahnya langsung menjadi penjelasan geologis.
- source_word: רֹבֶצֶת תָּחַת
  choice: yang berbaring di bawah
  rationale: Terjemahan ini mempertahankan personifikasi hidup dari verba רָבַץ, yang secara harfiah menggambarkan tindakan berbaring atau mendekam.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memuat nama diri ilahi YHWH; bentuk 'Yahweh' mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Sifat ujaran berkat מְבֹרֶכֶת
  choice: Kiranya ... diberkati
  alternative: '... diberkati'
  rationale: Konteks berkat Musa mendukung nuansa permohonan atau pengharapan, tetapi bentuk partisip Ibrani juga dapat dipahami sebagai pernyataan keadaan diberkati. Terjemahan utama menyuarakan fungsi berkat tanpa menjadikannya perintah.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan puitis. Paralelisme sumber dipertahankan, termasuk peralihan preposisi 'dengan' dan 'dari'. Penanda catatan kaki [a] ditempatkan langsung sesudah istilah yang dijelaskan.
