revisions:
- from: 'Tentang Yusuf ia berkata,

    “Kiranya negerinya diberkati Yahweh

    dengan yang terbaik dari langit, dengan embun,

    dan dari samudra raya[a] yang berbaring di bawah;”'
  to: 'Tentang Yusuf ia berkata,


    “Kiranya negerinya diberkati oleh Yahweh


    dengan yang terbaik dari langit, dengan embun,


    dan dari kedalaman[a] yang terhampar di bawah;”'
  rationale: Revisi mengganti “samudra raya” dengan “kedalaman” agar lebih setia pada תְּהוֹם dan konteks “di bawah,” tanpa menghilangkan ambiguitas puitis istilah Ibrani. Frasa penutup dibuat lebih idiomatis, dan “oleh” memperjelas hubungan dengan Yahweh dalam konstruksi berkat.
