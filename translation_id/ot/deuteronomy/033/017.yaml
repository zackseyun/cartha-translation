source:
  edition: WLC
  text: בְּכ֨וֹר שׁוֹר֜/וֹ הָדָ֣ר ל֗/וֹ וְ/קַרְנֵ֤י רְאֵם֙ קַרְנָ֔י/ו בָּ/הֶ֗ם עַמִּ֛ים יְנַגַּ֥ח יַחְדָּ֖ו אַפְסֵי אָ֑רֶץ וְ/הֵם֙ רִבְב֣וֹת אֶפְרַ֔יִם וְ/הֵ֖ם אַלְפֵ֥י מְנַשֶּֽׁה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/017.yaml
  text: His firstborn bull has majesty[a], and his horns are the horns of a wild ox; with them he will gore peoples together to the ends of the earth. These are the myriads of Ephraim[b], and these are the thousands of Manasseh.
translation:
  language: id
  text: 'Sapi jantan sulungnya memiliki keagungan;

    tanduknya bagaikan tanduk lembu liar.[a]

    Dengan tanduk itu ia akan menanduk bangsa-bangsa,

    semuanya sekaligus, sampai ke ujung-ujung bumi.

    Itulah puluhan ribu Efraim,[b]

    dan itulah ribuan Manasye.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani רְאֵם mungkin menunjuk kepada sejenis bovina liar yang besar dan kuat, sering diidentifikasi sebagai aurochs. Terjemahan lama kadang memakai “unicorn”; identifikasi tepat hewan ini tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: Atau, “berlaksa-laksa Efraim.” Kata Ibrani רִבְבוֹת dapat berarti kelipatan sepuluh ribu atau, lebih umum, jumlah yang amat besar; di sini dikontraskan dengan “ribuan Manasye.”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכוֹר שׁוֹרוֹ
  choice: lembu jantannya yang sulung
  rationale: בְּכוֹר berarti anak atau hewan yang lahir pertama, sedangkan שׁוֹר menunjuk pada sapi jantan atau lembu. Susunan ini mempertahankan citra hewan jantan sulung sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: הָדָר לוֹ
  choice: tampak megah
  rationale: Klausa nominal ini menyatakan kemegahan atau keagungan yang dimilikinya. 'Tampak megah' menyampaikan daya visual citra puitis tanpa menambahkan penafsiran tentang siapa yang dirujuk.
- source_word: קַרְנֵי רְאֵם קַרְנָיו
  choice: tanduknya seperti tanduk lembu liar
  rationale: רְאֵם kemungkinan besar adalah bovina liar yang kuat, bukan hewan bertanduk satu. Kata 'seperti' menyatakan hubungan perbandingan yang tersirat dalam klausa nominal Ibrani dan menghasilkan ungkapan Indonesia yang alami.
- source_word: בָּהֶם ... יְנַגַּח
  choice: dengan tanduk-tanduk itu ia akan menanduk
  rationale: Pronomina jamak merujuk pada tanduk, dan נָגַח menggambarkan serangan hewan bertanduk. 'Menanduk' mempertahankan citra konkret tersebut.
- source_word: עַמִּים
  choice: bangsa-bangsa
  rationale: Bentuk jamak ini menunjuk pada berbagai kelompok bangsa. 'Bangsa-bangsa' lebih lazim daripada 'kaum-kaum' dalam konteks cakupan geografis dan konflik puitis ini.
- source_word: יַחְדָּו
  choice: semuanya sekaligus
  rationale: Adverbia ini dapat berarti bersama-sama atau serentak. Dalam konteks bangsa-bangsa sebagai objek serangan, 'semuanya sekaligus' secara alami mempertahankan gagasan kolektif tanpa menentukan strategi militer tertentu.
- source_word: אַפְסֵי אָרֶץ
  choice: sampai ke ujung-ujung bumi
  rationale: Ungkapan idiomatis ini menunjuk pada jangkauan terjauh. 'Bumi' mempertahankan cakupan puitis yang luas, alih-alih membatasinya pada suatu negeri.
- source_word: רִבְבוֹת
  choice: puluhan ribu
  rationale: רְבָבָה secara numerik berarti sepuluh ribu dan bentuk jamaknya dapat menyatakan puluhan ribu atau jumlah amat besar. Pilihan ini mempertahankan kontras bertingkat dengan 'ribuan' pada baris berikutnya.
- source_word: אַלְפֵי
  choice: ribuan
  rationale: Walaupun אֶלֶף kadang dapat berarti kelompok kekerabatan atau satuan pasukan, paralelnya dengan רִבְבוֹת di sini paling wajar dipahami secara numerik.
- source_word: אֶפְרַיִם / מְנַשֶּׁה
  choice: Efraim / Manasye
  rationale: Bentuk ini mengikuti ejaan baku nama-nama Alkitab yang telah dikenal luas dalam bahasa Indonesia.
theological_decisions:
- issue: Rujukan citra lembu jantan sulung dalam berkat atas Yusuf
  choice: Teks mempertahankan pronomina orang ketiga dan citra lembu tanpa secara eksplisit menyamakannya hanya dengan Yusuf atau Efraim.
  alternative: Menafsirkan 'lembu jantan sulung' secara khusus sebagai Efraim, keturunan Yusuf yang memperoleh keutamaan.
  rationale: Berkat ini ditujukan kepada Yusuf, sedangkan penutup ayat menghubungkan kekuatan tanduk dengan Efraim dan Manasye. Terjemahan tidak menyelesaikan ketegangan rujukan yang dibiarkan terbuka oleh teks Ibrani.
- issue: Makna angka bagi Efraim dan Manasye
  choice: Angka diterjemahkan secara numerik sebagai 'puluhan ribu' dan 'ribuan'.
  alternative: Memahaminya sebagai pasukan, kelompok suku, atau jumlah besar secara umum.
  rationale: Paralelisme antara רִבְבוֹת dan אַלְפֵי mendukung nilai numerik, tetapi teks tidak menyebut kata 'orang' atau 'pasukan'; karena itu elipsis tersebut dipertahankan.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Paralelisme antarbait dipertahankan, citra tanduk tidak diperhalus, dan unsur yang tidak dinyatakan dalam bahasa Ibrani—seperti 'orang' atau 'pasukan'—tidak ditambahkan. 'Lembu liar' dipilih sebagai istilah umum yang mudah dipahami, sementara catatan kaki menjelaskan identifikasi zoologis yang tidak pasti.
