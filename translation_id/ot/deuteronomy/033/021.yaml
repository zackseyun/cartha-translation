language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֤רְא רֵאשִׁית֙ ל֔/וֹ כִּי שָׁ֛ם חֶלְקַ֥ת מְחֹקֵ֖ק סָפ֑וּן וַ/יֵּתֵא֙ רָ֣אשֵׁי עָ֔ם צִדְקַ֤ת יְהוָה֙ עָשָׂ֔ה וּ/מִשְׁפָּטָ֖י/ו עִם יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/021.yaml
  text: He chose the best land for himself[a], because there the portion of the ruler was reserved. He came with the heads of the people; he carried out the righteousness of Yahweh[b], and his judgments with Israel.
translation:
  language: id
  text: Ia memilih tanah yang terbaik bagi dirinya, sebab di sanalah bagian seorang penguasa[a] telah disediakan. Ia datang bersama para pemimpin bangsa itu; ia menegakkan keadilan Yahweh[b] dan ketetapan-ketetapan-Nya bersama Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bagian seorang pemberi hukum”. Istilah Ibrani ini dapat berarti “penguasa” atau “pemberi hukum”; sebagian orang memahaminya sebagai sebutan bagi Musa.
    reason: alternative_reading
  - marker: b
    text: Atau “kebenaran Yahweh” atau “tindakan-tindakan benar Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: memilih
  rationale: Secara harfiah berarti “melihat”, tetapi konstruksi “melihat bagi dirinya” dalam konteks ini menyatakan pemilihan suatu bagian.
- source_word: רֵאשִׁית
  choice: tanah yang terbaik
  rationale: Dalam konteks pembagian wilayah kepada Gad, kata ini menunjuk pada bagian yang utama atau paling baik, bukan terutama pada awal secara kronologis.
- source_word: חֶלְקַת
  choice: bagian
  rationale: Menunjuk pada bagian atau jatah wilayah yang dialokasikan.
- source_word: מְחֹקֵק
  choice: penguasa
  rationale: Kata ini dapat berarti penguasa, pemberi hukum, atau pemimpin. “Penguasa” sesuai dengan konteks kepemimpinan tanpa menentukan bahwa tokohnya adalah Musa.
- source_word: סָפוּן
  choice: telah disediakan
  rationale: Bentuk ini menyampaikan gagasan bahwa bagian tersebut disimpan, dikhususkan, atau dicadangkan.
- source_word: וַיֵּתֵא
  choice: Ia datang
  rationale: Kata kerjanya menyatakan gerak datang atau keluar; “datang” alami dalam hubungan dengan para pemimpin bangsa.
- source_word: רָאשֵׁי עָם
  choice: para pemimpin bangsa itu
  rationale: Secara harfiah “kepala-kepala bangsa”; padanan Indonesia yang alami untuk para kepala atau pemimpin masyarakat ialah “para pemimpin”.
- source_word: צִדְקַת יְהוָה
  choice: kebenaran Yahweh
  rationale: Frasa ini dapat menunjuk pada kebenaran, keadilan, atau tindakan-tindakan benar Yahweh. Pilihan ini mempertahankan keluasan makna frasa Ibrani.
- source_word: וּמִשְׁפָּטָיו
  choice: ketetapan-ketetapan-Nya
  rationale: Bentuk jamak ini menunjuk pada keputusan hukum, penghakiman, atau ketetapan Yahweh; “ketetapan-ketetapan” jelas dan wajar dalam konteks perjanjian.
- source_word: עִם יִשְׂרָאֵל
  choice: bersama Israel
  rationale: Menerjemahkan preposisi secara langsung dan mempertahankan gagasan bahwa Gad bertindak bersama umat Israel.
theological_decisions:
- issue: Identitas dan arti מְחֹקֵק dalam frasa חֶלְקַת מְחֹקֵק סָפוּן
  choice: Diterjemahkan secara umum sebagai “penguasa”.
  alternative: “pemberi hukum” (yang oleh sebagian orang dipahami sebagai Musa) atau “pemimpin”.
  rationale: Frasa Ibraninya padat dan diperdebatkan. Teks tidak mengharuskan identifikasi khusus dengan Musa, sehingga terjemahan umum menjaga ambiguitas asli tanpa menghilangkan unsur kewibawaan.
- issue: Cakupan makna צִדְקַת יְהוָה
  choice: “kebenaran Yahweh”
  alternative: “keadilan Yahweh” atau “tindakan-tindakan benar Yahweh”.
  rationale: Bentuk tunggal konstruksi ini dapat menyatakan sifat kebenaran/keadilan maupun perwujudannya dalam tindakan. Terjemahan utama mempertahankan ketegangan tersebut, sedangkan pilihan lain dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. “Para pemimpin” dipilih daripada ungkapan harfiah “kepala-kepala” agar alami bagi pembaca umum. Nama perjanjian “Yahweh” dipertahankan, dan akhiran ilahi pada “ketetapan-ketetapan-Nya” ditulis dengan huruf kapital.
