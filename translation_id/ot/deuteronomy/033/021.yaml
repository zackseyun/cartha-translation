  to: Ia memilih tanah yang terbaik bagi dirinya, sebab di sanalah bagian seorang penguasa[a] telah disediakan. Ia datang bersama para pemimpin bangsa itu; ia menegakkan keadilan Yahweh[b] dan ketetapan-ketetapan-Nya bersama Israel.
