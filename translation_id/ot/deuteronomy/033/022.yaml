  yaml_path: translation/ot/deuteronomy/033/022.yaml
  text: 'And of Dan he said: “Dan is a lion’s cub[a]; he leaps out from Bashan.”'
translation:
  language: id
  text: 'Tentang Dan ia berkata:

    “Dan adalah anak singa;

    ia melompat keluar dari Basan.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּלְדָן
  choice: Tentang Dan
  rationale: Preposisi לְ dalam rumusan berkat suku memperkenalkan pihak yang dibicarakan; “Tentang Dan” alami dalam bahasa Indonesia dan mempertahankan arti ‘mengenai Dan’.
- source_word: אָמַר
  choice: ia berkata
  rationale: Padanan langsung dan wajar untuk verba pelaporan ujaran אָמַר.
- source_word: דָּן
  choice: Dan
  rationale: Nama diri dan nama suku dipertahankan dalam bentuk baku Indonesia.
- source_word: גּוּר אַרְיֵה
  choice: anak singa
  rationale: Frasa konstruksi ini menunjuk kepada singa yang masih muda; “anak singa” jelas, alami, dan mempertahankan citra serta nuansa usia.
- source_word: יְזַנֵּק
  choice: ia melompat keluar
  rationale: Verba ini menggambarkan gerakan melompat atau menerjang secara mendadak. “Melompat keluar” hidup tetapi tidak menambahkan sasaran serangan yang tidak dinyatakan teks.
- source_word: מִן הַבָּשָׁן
  choice: dari Basan
  rationale: מִן menandai sumber atau asal; “dari Basan” merupakan padanan langsung, sedangkan Basan mengikuti ejaan nama tempat yang lazim dalam Alkitab bahasa Indonesia.
