  text: וְ/זֹ֣את לִֽ/יהוּדָה֮ וַ/יֹּאמַר֒ שְׁמַ֤ע יְהוָה֙ ק֣וֹל יְהוּדָ֔ה וְ/אֶל עַמּ֖/וֹ תְּבִיאֶ֑/נּוּ יָדָי/ו֙ רָ֣ב ל֔/וֹ וְ/עֵ֥זֶר מִ/צָּרָ֖י/ו תִּהְיֶֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/007.yaml
  text: 'And this he said for Judah: “Hear[a], Yahweh, the voice of Judah, and bring him to his people. Let his hands strive for him, and be a help against his adversaries.”'
translation:
  language: id
  text: 'Dan inilah yang dikatakannya tentang Yehuda:


    “Dengarlah, ya Yahweh, suara Yehuda,

    dan bawalah dia kepada bangsanya.

    Biarlah tangannya berjuang baginya,[a]

    dan jadilah penolongnya melawan lawan-lawannya.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Semoga tangannya cukup baginya.” Klausa Ibrani ini sulit dan telah dipahami dengan lebih dari satu cara.
    reason: alternative_reading
lexical_decisions:
- source_word: וְזֹאת לִיהוּדָה וַיֹּאמַר
  choice: Tentang Yehuda, Musa berkata
  rationale: Formula peralihan ini memperkenalkan berkat bagi Yehuda. Nama Musa dibuat eksplisit secara wajar dalam bahasa Indonesia untuk memperjelas subjek yang tersirat dari konteks tanpa mengubah rujukannya.
- source_word: שְׁמַע יְהוָה
  choice: Dengarlah, ya Yahweh
  rationale: Imperatif שְׁמַע merupakan permohonan langsung kepada nama ilahi; partikel vokatif 'ya' menghasilkan sapaan Indonesia yang alami dan khidmat.
- source_word: קוֹל יְהוּדָה
  choice: suara Yehuda
  rationale: Terjemahan ini mempertahankan citra harfiah קוֹל dan tidak mempersempitnya menjadi 'seruan' atau 'doa'.
- source_word: וְאֶל עַמּוֹ תְּבִיאֶנּוּ
  choice: dan bawalah dia kepada bangsanya
  rationale: Bentuk Hifil תְּבִיאֶנּוּ berarti membawa dia; terjemahan ini membiarkan terbuka apakah yang dimaksud adalah kepulangan dari pertempuran atau penyatuan dengan umatnya.
- source_word: יָדָיו רָב לוֹ
  choice: Biarlah tangannya berjuang baginya
  rationale: Klausa Ibrani ini sulit. Pilihan ini memahami רָב dalam arti berjuang atau bertarung dan sesuai dengan konteks pertolongan terhadap musuh, sementara alternatif penting dicatat dalam catatan kaki.
- source_word: וְעֵזֶר מִצָּרָיו תִּהְיֶה
  choice: dan jadilah penolongnya melawan lawan-lawannya
  rationale: מִן dipahami secara adversatif, yakni pertolongan melawan para lawan. Sufiks '-nya' memperjelas bahwa pertolongan itu diberikan kepada Yehuda.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Nama perjanjian dalam teks Ibrani dipertahankan sebagai nama diri, tanpa menggantinya dengan gelar.
- issue: Makna klausa sulit יָדָיו רָב לוֹ
  choice: Biarlah tangannya berjuang baginya
  alternative: Semoga tangannya cukup baginya
  rationale: Bacaan utama mempertahankan kemungkinan makna perjuangan yang cocok dengan konteks militer dan paralel dengan permohonan pertolongan terhadap lawan. Karena susunan Ibraninya padat dan ambigu, pembacaan 'cukup' tetap disajikan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada doa yang khidmat. Larik puitis dipertahankan, sapaan 'ya Yahweh' dibuat alami, dan ambiguitas utama teks Ibrani tidak dihapus.
