base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/003.yaml
  text: Indeed[a], he loves the peoples; all his holy ones are in your hand, and they sit down at your feet[b]; each receives your words.
translation:
  language: id
  text: Sungguh, Ia mengasihi bangsa-bangsa; semua orang kudus-Nya ada dalam tangan-Mu. Mereka duduk di kaki-Mu[a]; masing-masing menerima perkataan-Mu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “duduk” tidak pasti; kata itu juga dipahami sebagai “berkumpul”, “merunduk”, atau bahkan “dipukul jatuh”.
    reason: alternative_reading
  - marker: b
    text: Atau “masing-masing mengangkat sebagian dari perkataan-Mu” atau “membawa ucapan-Mu”; ungkapan Ibraninya langka dan sulit.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: Sungguh
  rationale: Partikel ini menegaskan pernyataan yang menyusul; “sungguh” menyampaikan daya penegasnya secara wajar tanpa menjadikannya sekadar penambahan “juga”.
- source_word: חֹבֵב
  choice: mengasihi
  rationale: Bentuk partisip menyatakan sikap yang berlangsung. “Mengasihi” mempertahankan makna relasionalnya dalam ragam bahasa yang bermartabat.
- source_word: עַמִּים
  choice: bangsa-bangsa
  rationale: Bentuk jamak ini menunjuk kepada kelompok-kelompok umat atau bangsa. Pilihan ini mempertahankan cakupan jamaknya tanpa menentukan secara sempit siapa yang dimaksud.
- source_word: כָּל קְדֹשָׁיו
  choice: semua orang kudus-Nya
  rationale: Ungkapan ini menunjuk kepada mereka yang kudus atau dikhususkan bagi-Nya, tanpa menetapkan apakah yang dimaksud adalah manusia, malaikat, atau kelompok tertentu.
- source_word: בְּיָדֶךָ
  choice: ada dalam tangan-Mu
  rationale: Terjemahan dekat ini mempertahankan citra Ibrani tentang tangan, yang dapat menyiratkan perlindungan atau kuasa, sekaligus menjaga peralihan pronomina dalam puisi.
- source_word: תֻּכּוּ
  choice: duduk
  rationale: Bentuk Ibrani ini sangat tidak pasti. Dalam konteks “di kaki-Mu” dan penerimaan firman, “duduk” menghasilkan gambaran para pendengar di hadapan pengajar, tetapi ketidakpastian dan alternatifnya dicatat dalam catatan kaki.
- source_word: לְרַגְלֶךָ
  choice: di kaki-Mu
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran kedekatan, ketundukan, serta sikap mendengarkan.
- source_word: יִשָּׂא
  choice: menerima
  rationale: Makna dasar verba ini ialah mengangkat atau membawa. Dalam hubungannya dengan firman, “menerima” menyampaikan kemungkinan makna idiomatisnya secara jelas; alternatif harfiahnya tetap dicatat.
- source_word: מִדַּבְּרֹתֶיךָ
  choice: firman-Mu
  rationale: Nomina langka ini berkaitan dengan perkataan atau ucapan. “Firman-Mu” sesuai dengan konteks ucapan ilahi, sedangkan unsur מִן dan kelangkaan bentuknya diterangkan dalam catatan kaki.
theological_decisions:
- issue: Peralihan rujukan dan pronomina dalam puisi
  choice: Mempertahankan peralihan “Ia ... -Nya ... tangan-Mu ... kaki-Mu ... firman-Mu”.
  alternative: Menyeragamkan semua rujukan menjadi orang ketiga atau semuanya menjadi orang kedua.
  rationale: Teks Ibrani beralih dari orang ketiga ke orang kedua. Menyeragamkannya akan menghapus ketegangan puitis yang sungguh terdapat dalam sumber.
- issue: Identitas “orang kudus-Nya”
  choice: Tidak menentukan identitas mereka lebih lanjut.
  alternative: Menafsirkannya secara khusus sebagai malaikat, Israel, atau umat saleh tertentu.
  rationale: Istilah Ibrani tidak dengan sendirinya memaksa salah satu identifikasi tersebut, sehingga terjemahan mempertahankan keterbukaannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Huruf kapital pada pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Susunan pronomina sengaja tidak diperhalus agar peralihan dalam puisi Ibrani tetap tampak.
