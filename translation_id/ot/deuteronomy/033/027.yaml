base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/027.yaml
  text: The God of old is a dwelling place[a], and underneath are everlasting arms. He drove out the enemy before you, and said, ‘Destroy!’
translation:
  language: id
  text: 'Allah sejak dahulu kala adalah tempat kediaman[a],

    dan di bawah ada lengan-lengan yang kekal.

    Ia menghalau musuh dari hadapanmu

    serta berkata, “Musnahkan!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Allah yang kekal adalah tempat perlindunganmu.” Bahasa Ibraninya secara lebih langsung berbunyi “Allah sejak dahulu kala adalah tempat kediaman,” tetapi ungkapan itu secara tradisional juga dipahami dalam arti alternatif ini.
    reason: alternative_reading
lexical_decisions:
- source_word: מְעֹנָה
  choice: tempat kediaman
  rationale: Nomina ini menunjuk pada tempat tinggal atau tempat berlindung. “Tempat kediaman” mempertahankan gambaran dasarnya tanpa langsung mengubahnya menjadi metafora “tempat perlindungan,” meskipun nuansa perlindungan hadir dalam konteks.
- source_word: אֱלֹהֵי קֶדֶם
  choice: Allah dari zaman dahulu
  rationale: קֶדֶם di sini paling wajar menunjuk pada masa lampau atau zaman purba. Ungkapan ini lebih langsung daripada “Allah yang kekal,” tetapi tetap alami dan bermartabat dalam bahasa Indonesia.
- source_word: וּמִתַּחַת
  choice: dan di bawah
  rationale: Frasa ini bersifat spasial dan dalam teks Ibrani tidak menyebutkan objek secara eksplisit. Terjemahan ini mempertahankan kepadatan serta ketaktertentuan puisi aslinya.
- source_word: זְרֹעֹת עוֹלָם
  choice: lengan-lengan yang kekal
  rationale: “Lengan-lengan” mempertahankan metafora jamak untuk kekuatan dan penopangan, sedangkan עוֹלָם di sini menyatakan keberlangsungan tanpa akhir.
- source_word: וַיְגָרֶשׁ
  choice: Ia menghalau
  rationale: Kata kerja גרש berarti mengusir atau menghalau. “Menghalau” jelas, kuat, dan cocok dengan konteks penaklukan.
- source_word: מִפָּנֶיךָ
  choice: dari hadapanmu
  rationale: Terjemahan ini mempertahankan gambaran harfiah “dari hadapan/wajahmu” dan tetap idiomatis dalam bahasa Indonesia.
- source_word: אוֹיֵב
  choice: musuh
  rationale: Bentuk Ibraninya tunggal, tetapi dapat bermakna kolektif. “Musuh” mempertahankan bentuk tersebut tanpa memaksakan jumlah.
- source_word: וַיֹּאמֶר
  choice: serta berkata
  rationale: Ini menerjemahkan kelanjutan naratif secara sederhana. Subjeknya dipahami sebagai Allah dari klausa sebelumnya.
- source_word: הַשְׁמֵד
  choice: Musnahkan!
  rationale: Bentuk imperatif Hifil ini memerintahkan penghancuran tuntas. “Musnahkan!” kuat dan ringkas tanpa menambahkan objek yang tidak dinyatakan dalam teks.
theological_decisions:
- issue: Apakah קֶדֶם dalam אֱלֹהֵי קֶדֶם harus diterjemahkan sebagai rujukan kepada zaman dahulu atau sebagai pernyataan tentang kekekalan Allah
  choice: Allah dari zaman dahulu
  alternative: Allah yang kekal
  rationale: Makna langsung קֶדֶם berkaitan dengan masa purba atau zaman dahulu. Tafsiran tradisional “Allah yang kekal” tetap mungkin dan penting, sehingga dicantumkan dalam catatan kaki tanpa menggantikan ungkapan yang lebih dekat dengan teks Ibrani.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Susunan baris mempertahankan paralelisme ayat. Ungkapan “dan di bawah” sengaja tidak diberi objek tambahan karena teks Ibrani juga membiarkannya tersirat; catatan kaki mempertahankan pembacaan tradisional yang lebih interpretatif.
