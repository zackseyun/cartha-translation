base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/033/008.yaml
  text: 'And of Levi he said: “Your Thummim and your Urim belong to your faithful one[a], whom you tested at Massah[b], with whom you contended at the waters of Meribah.”'
translation:
  language: id
  text: Tentang Lewi ia berkata, “Tumim-Mu dan Urim-Mu adalah untuk orang yang setia kepada-Mu,[a] yang Engkau uji di Masa,[b] yang dengan dia Engkau berbantah di perairan Meriba.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “untuk orang saleh-Mu” atau “untuk orang yang loyal kepada-Mu.” Ungkapan Ibrani ini dapat menunjuk pada orang yang menunjukkan kesetiaan dalam ikatan perjanjian.
    reason: lexical_alternative
  - marker: b
    text: Masa berarti “pengujian,” sedangkan Meriba berkaitan dengan “pertengkaran” atau “perbantahan” (lihat Kel. 17:1–7; Bil. 20:1–13).
    reason: cross_reference
lexical_decisions:
- source_word: וּלְלֵוִי אָמַר
  choice: Tentang Lewi ia berkata
  rationale: Konstruksi לְ dengan nama suku memperkenalkan pokok berkat. 'Tentang Lewi' alami dalam bahasa Indonesia dan tidak memaksakan bahwa perkataan itu ditujukan langsung kepada Lewi.
- source_word: תֻּמֶּיךָ וְאוּרֶיךָ
  choice: Tumim-Mu dan Urim-Mu
  rationale: Keduanya merupakan istilah teknis keimaman yang fungsi dan bentuk persisnya tidak sepenuhnya pasti; transliterasi mempertahankan kekhususan historisnya. Sufiks orang kedua tunggal dipertahankan.
- source_word: לְאִישׁ חֲסִידֶךָ
  choice: adalah untuk orang yang setia kepada-Mu
  rationale: Klausa Ibrani tidak memiliki verba; 'adalah' ditambahkan agar wajar dalam bahasa Indonesia. חָסִיד menunjuk pada orang yang bercirikan kesetiaan, khususnya kesetiaan dalam relasi perjanjian. Rumusan ini mempertahankan bentuk tunggal tanpa menentukan identitasnya.
- source_word: אֲשֶׁר נִסִּיתוֹ
  choice: yang telah Kauuji
  rationale: נסה dalam bentuk piel berarti menguji atau mencoba. Bentuk ini juga mempertahankan Allah sebagai pelaku dan tokoh tunggal tersebut sebagai objek.
- source_word: בְּמַסָּה
  choice: di Masa
  rationale: מַסָּה diperlakukan sebagai nama tempat dan ditransliterasikan; makna namanya dijelaskan dalam catatan.
- source_word: תְּרִיבֵהוּ
  choice: yang dengannya Engkau berbantah
  rationale: ריב menyatakan pertengkaran, perselisihan, atau perbantahan. 'Berbantah' mempertahankan relasi langsung antara subjek ilahi dan tokoh tunggal tanpa memperhalus ketegangan teks.
- source_word: עַל מֵי מְרִיבָה
  choice: di dekat mata air Meriba
  rationale: מֵי secara harfiah berarti 'air', tetapi dalam nama lokasi dapat merujuk pada sumber atau mata air. 'Di dekat' menyampaikan fungsi lokatif עַל dalam konteks ini, sedangkan Meriba dipertahankan sebagai nama tempat.
theological_decisions:
- issue: Identitas 'orang yang setia kepada-Mu' dalam berkat Lewi
  choice: Mempertahankan sebutan tunggal tanpa mengidentifikasikannya lebih lanjut
  alternative: Menafsirkannya secara khusus sebagai Harun, Lewi sebagai leluhur, atau suku Lewi secara kolektif
  rationale: Bahasa Ibrani berbentuk tunggal dan memungkinkan beberapa rujukan. Terjemahan tidak menyelesaikan ambiguitas yang tidak diselesaikan oleh ayat itu sendiri.
- issue: Ketegangan dalam tindakan Allah terhadap tokoh Lewi
  choice: Menerjemahkan bahwa Allah menguji dan berbantah dengannya
  alternative: Mengubah pelaku atau memperlunak 'berbantah' menjadi sekadar 'menguji'
  rationale: Pronomina dan bentuk verbal Ibrani menempatkan Allah sebagai pelaku. Ketegangan dengan kisah Masa dan Meriba harus dipertahankan, bukan diselaraskan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang khidmat tetapi mudah dipahami. Nama teknis keimaman dan nama tempat ditransliterasikan menurut bentuk Indonesia. Kapital pada enklitik pronominal dalam 'Tumim-Mu', 'Urim-Mu', 'kepada-Mu', dan 'Kauuji' menandai rujukan kepada Allah.
