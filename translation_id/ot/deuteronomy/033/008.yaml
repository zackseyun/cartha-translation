  naturalness: Susunan kalimat umumnya baku dan bernada khidmat. "Yang dengannya Engkau berbantah" kurang alami dalam bahasa Indonesia; "dengan dia Engkau berbantah" lebih jelas dan tetap mempertahankan anteseden tunggal.
  terminology: '"Tumim", "Urim", "Masa", dan "Meriba" konsisten sebagai transliterasi istilah/nama Ibrani. "Perairan Meriba" lebih setia kepada bentuk jamak מֵי ("air-air/waters") dan tidak menambahkan unsur "dekat".'
