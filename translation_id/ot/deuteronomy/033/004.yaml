translation:
  language: id
  text: Musa memerintahkan hukum bagi kita[a], suatu warisan bagi jemaah Yakub.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Hukum” juga dapat diterjemahkan “pengajaran.”
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibraninya padat; “warisan” dapat dipahami dalam aposisi dekat dengan “hukum”: “Musa memerintahkan hukum bagi kita, warisan jemaah Yakub.” “Warisan” juga dapat diterjemahkan “milik pusaka.”'
    reason: alternative_reading
lexical_decisions:
- source_word: תּוֹרָה
  choice: hukum
  rationale: Dalam konteks perjanjian ini, kata tersebut menunjuk pada pengajaran yang berwibawa dan mengikat yang disampaikan melalui Musa. “Hukum” paling jelas menyampaikan makna publik dan perjanjiannya; alternatif “pengajaran” dicatat karena cakupan katanya dapat lebih luas.
- source_word: צִוָּה
  choice: memerintahkan
  rationale: Mempertahankan daya verba Ibrani yang menyatakan tindakan memerintah, bukan sekadar memberi atau menyampaikan.
- source_word: לָנוּ
  choice: kepada kita
  rationale: Preposisi ל di sini secara alami menandai penerima perintah. “Kepada kita” mempertahankan hubungan langsung antara Musa, hukum, dan umat yang menerimanya.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk nama baku dalam bahasa Indonesia.
- source_word: מוֹרָשָׁה
  choice: suatu warisan
  rationale: Menunjuk pada sesuatu yang diterima dan dimiliki sebagai hak turun-temurun. “Warisan” mempertahankan nuansa pemberian perjanjian dan hubungan dekatnya dengan “hukum.”
- source_word: קְהִלַּת
  choice: umat
  rationale: Dalam konteks ini kata tersebut menunjuk pada komunitas Israel yang berhimpun. “Umat” alami dalam bahasa Indonesia dan tidak terlalu mengaitkannya dengan bentuk lembaga keagamaan tertentu, meskipun “jemaah” atau “himpunan” juga mungkin.
- source_word: יַעֲקֹב
  choice: Yakub
  rationale: Mempertahankan nama yang secara eksplisit terdapat dalam teks Ibrani, tanpa menggantinya dengan penafsiran “Israel.”
theological_decisions:
- issue: Hubungan sintaksis antara תּוֹרָה dan מוֹרָשָׁה
  choice: 'Menerjemahkan kedua frasa sebagai dua unsur puitis yang berdekatan: Musa memerintahkan hukum itu, lalu hukum tersebut digambarkan sebagai warisan bagi umat Yakub.'
  alternative: “Musa memerintahkan kepada kita suatu hukum, yaitu warisan umat Yakub” atau “Hukum yang Musa perintahkan kepada kita adalah warisan bagi umat Yakub.”
  rationale: Sintaksis Ibrani ringkas dan bagian kedua tidak memiliki verba tersurat. Tanda koma mempertahankan kemungkinan bahwa “suatu warisan” merupakan aposisi bagi “suatu hukum,” tanpa menambahkan kata penjelas seperti “yaitu” atau “adalah” yang akan menetapkan hubungan sintaksis secara lebih tegas daripada teks sumber.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan puitis yang padat dipertahankan melalui dua frasa nominal yang dipisahkan koma. “Kepada kita” dipilih agar konstruksi verba “memerintahkan” alami, sedangkan “umat Yakub” menyampaikan komunitas perjanjian tanpa nuansa kelembagaan yang terlalu khusus.
