id: DEU.10.8
reference: Deuteronomy 10:8
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בָּ/עֵ֣ת הַ/הִ֗וא הִבְדִּ֤יל יְהוָה֙ אֶת שֵׁ֣בֶט הַ/לֵּוִ֔י לָ/שֵׂ֖את אֶת אֲר֣וֹן בְּרִית יְהוָ֑ה לַ/עֲמֹד֩ לִ/פְנֵ֨י יְהוָ֤ה לְ/שָֽׁרְת/וֹ֙ וּ/לְ/בָרֵ֣ךְ בִּ/שְׁמ֔/וֹ עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/008.yaml
  text: At that time Yahweh set apart the tribe of Levi to carry the ark of the covenant of Yahweh, to stand before Yahweh to minister to him, and to bless in his name, to this day.
translation:
  language: id
  text: Pada waktu itu Yahweh mengkhususkan suku Lewi untuk mengusung tabut perjanjian Yahweh, untuk berdiri di hadapan Yahweh, untuk melayani-Nya, dan untuk memberkati dalam nama-Nya, sampai hari ini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִוא
  choice: Pada waktu itu
  rationale: Padanan idiomatis dan langsung untuk penanda waktu dalam bahasa Indonesia modern.
- source_word: הִבְדִּיל
  choice: mengkhususkan
  rationale: Kata ini menyampaikan tindakan memisahkan bagi tugas tertentu, bukan sekadar memisahkan secara netral.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri sesuai bentuk Tetragramaton, bukan diganti dengan gelar.
- source_word: שֵׁבֶט הַלֵּוִי
  choice: suku Lewi
  rationale: Terjemahan alami dari frasa konstruksi Ibrani yang mempertahankan Lewi sebagai nama suku.
- source_word: לָשֵׂאת
  choice: untuk mengusung
  rationale: Dalam konteks pemindahan tabut, 'mengusung' menyatakan membawa dengan penuh tanggung jawab dan lebih tepat daripada kata umum 'membawa'.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: tabut perjanjian Yahweh
  rationale: Rangkaian konstruksi dipertahankan secara ringkas dan jelas, dengan 'perjanjian' tetap eksplisit.
- source_word: לַעֲמֹד לִפְנֵי יְהוָה
  choice: untuk berdiri di hadapan Yahweh
  rationale: Ungkapan ini mempertahankan idiom pelayanan kultis tanpa menafsirkannya lebih jauh.
- source_word: לְשָׁרְתוֹ
  choice: melayani-Nya
  rationale: '''Melayani'' mencakup pelayanan kudus dalam konteks ini, sementara akhiran pronominal maskulin tunggal tetap dinyatakan.'
- source_word: וּלְבָרֵךְ בִּשְׁמוֹ
  choice: dan memberkati dalam nama-Nya
  rationale: Terjemahan ini mempertahankan verba tanpa objek yang disebutkan serta gagasan bahwa berkat disampaikan dengan kewenangan nama Yahweh.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: sampai hari ini
  rationale: Padanan Indonesia yang alami untuk keberlanjutan sampai masa penutur atau narator.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama ilahi secara langsung. Bentuk 'Yahweh' mempertahankan nama perjanjian dan tidak menggantinya dengan sebuah gelar.
- issue: Peran kultis suku Lewi dalam לַעֲמֹד ... לְשָׁרְתוֹ
  choice: berdiri di hadapan Yahweh, melayani-Nya
  alternative: hadir di hadapan Yahweh untuk beribadah kepada-Nya
  rationale: Pilihan ini dekat dengan struktur sumber dan menyampaikan pelayanan kudus tanpa memasukkan struktur jabatan keagamaan yang tidak dinyatakan oleh ayat.
- issue: Objek berkat dalam וּלְבָרֵךְ בִּשְׁמוֹ
  choice: memberkati dalam nama-Nya
  alternative: mengucapkan berkat dalam nama-Nya; memberkati umat dalam nama-Nya
  rationale: Teks tidak menyebut objek berkat. Terjemahan mempertahankan ketaktertentuan itu dan tidak menambahkan 'umat' secara tersirat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Pengulangan nama Yahweh dipertahankan karena muncul tiga kali dalam sumber. Bentuk pronomina ilahi ditulis dengan huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia.
