language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֚וּא אֱלֹהֵ֣י הָֽ/אֱלֹהִ֔ים וַ/אֲדֹנֵ֖י הָ/אֲדֹנִ֑ים הָ/אֵ֨ל הַ/גָּדֹ֤ל הַ/גִּבֹּר֙ וְ/הַ/נּוֹרָ֔א אֲשֶׁר֙ לֹא יִשָּׂ֣א פָנִ֔ים וְ/לֹ֥א יִקַּ֖ח שֹֽׁחַד־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/017.yaml
  text: For Yahweh your God is God of gods and Lord of lords[a], the great, mighty, and awesome God, who shows no partiality and takes no bribe.
translation:
  language: id
  text: Sebab Yahweh, Allahmu, adalah Allah segala allah dan Tuhan segala tuhan, Allah yang besar, perkasa, dan dahsyat[a], yang tidak memihak dan tidak menerima suap.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menakutkan” atau “membangkitkan rasa takjub”; kata Ibrani ini menunjuk kepada Dia yang menimbulkan rasa gentar dan hormat.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan bagi nasihat sebelumnya dan mempertahankan daya kausal ayat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Bentuk dengan akhiran orang kedua jamak menunjuk kepada Allah Israel; bahasa Indonesia memakai bentuk ringkas yang wajar untuk sapaan kolektif.
- source_word: אֱלֹהֵי הָאֱלֹהִים
  choice: Allah segala allah
  rationale: Mempertahankan rantai konstruksi Ibrani sebagai rumusan supremasi tanpa menentukan hakikat 'allah-allah' yang disebut.
- source_word: וַאֲדֹנֵי הָאֲדֹנִים
  choice: dan Tuhan segala tuhan
  rationale: Menjaga kesejajaran retoris dengan 'Allah segala allah' serta menyatakan kedaulatan tertinggi.
- source_word: הָאֵל הַגָּדֹל הַגִּבֹּר וְהַנּוֹרָא
  choice: Allah yang besar, perkasa, dan dahsyat
  rationale: Menghasilkan rangkaian gelar yang alami dan bermartabat; 'dahsyat' mencakup daya yang menimbulkan gentar dan kekaguman.
- source_word: אֲשֶׁר לֹא יִשָּׂא פָנִים
  choice: yang tidak memihak
  rationale: Menerjemahkan idiom harfiah 'tidak mengangkat wajah' menurut makna yudisialnya, yaitu tidak berlaku berat sebelah.
- source_word: וְלֹא יִקַּח שֹׁחַד
  choice: dan tidak menerima suap
  rationale: Ungkapan Indonesia yang langsung dan alami serta mempertahankan tekanan hukum-etis klausa.
theological_decisions:
- issue: Rumusan 'Allah segala allah dan Tuhan segala tuhan' dapat dipahami dalam lebih dari satu kerangka mengenai sebutan 'allah'.
  choice: Mempertahankan rumusan supremasi secara formal.
  alternative: Allah yang mengatasi semua yang disebut allah dan tuhan.
  rationale: Teks Ibrani menegaskan keunggulan Yahweh tanpa menjelaskan ontologi pihak-pihak yang disebut 'allah' dan 'tuhan'; terjemahan tidak seharusnya menyelesaikan ketegangan itu lewat parafrasa.
- issue: Penyajian יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Nama pribadi ilahi dipertahankan melalui transliterasi yang lazim dan dekat dengan bukti bahasa sumber.
- issue: Nuansa וְהַנּוֹרָא
  choice: dahsyat
  alternative: menakutkan atau membangkitkan rasa takjub
  rationale: '''Dahsyat'' memungkinkan unsur gentar sekaligus kekaguman, tanpa membatasi istilah hanya pada rasa takut negatif.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan irama luhur namun tetap mudah dipahami. Pengulangan 'Allah ... allah' dan 'Tuhan ... tuhan' dipertahankan demi kesejajaran dan kekuatan retoris teks Ibrani.
