source:
  edition: WLC
  text: וּ/בְנֵ֣י יִשְׂרָאֵ֗ל נָֽסְע֛וּ מִ/בְּאֵרֹ֥ת בְּנֵי יַעֲקָ֖ן מוֹסֵרָ֑ה שָׁ֣ם מֵ֤ת אַהֲרֹן֙ וַ/יִּקָּבֵ֣ר שָׁ֔ם וַ/יְכַהֵ֛ן אֶלְעָזָ֥ר בְּנ֖/וֹ תַּחְתָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/006.yaml
  text: The sons of Israel journeyed from Beeroth Bene-jaakan to Moserah[a]. There Aaron died, and there he was buried[b]; and Eleazar his son served as priest in his place.
translation:
  language: id
  text: Orang Israel berangkat dari Beerot Bene-Yaakan menuju Mosera[a]. Di sana Harun meninggal, dan di sana ia dikuburkan; lalu Eleazar, anaknya, melayani sebagai imam menggantikan dia[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beerot Bene-Yaakan secara harfiah dapat dipahami sebagai “sumur-sumur keturunan Yaakan”, tetapi di sini ditransliterasikan sebagai nama tempat.
    reason: lexical_alternative
  - marker: b
    text: Atau “melayani sebagai imam sesudah dia”. Ungkapan Ibraninya secara harfiah berarti “di tempatnya” dan menunjukkan pergantian jabatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: Orang Israel
  rationale: Ungkapan harfiah ‘anak-anak Israel’ berfungsi sebagai sebutan kebangsaan. ‘Orang Israel’ lebih alami dalam bahasa Indonesia modern, sementara waw pembuka tidak perlu selalu dinyatakan karena ayat ini merupakan peralihan naratif.
- source_word: נָסְעוּ
  choice: berangkat
  rationale: Dalam kisah perjalanan di padang gurun, נסע menunjuk pada tindakan membongkar perkemahan dan bergerak ke tempat berikutnya; ‘berangkat’ menyampaikan gerak tersebut secara wajar.
- source_word: מִבְּאֵרֹת בְּנֵי יַעֲקָן
  choice: dari Beerot Bene-Yaakan
  rationale: Frasa ini diperlakukan sebagai nama tempat dan ditransliterasikan, bukan diterjemahkan, sedangkan prefiks מִן dinyatakan dengan ‘dari’.
- source_word: מוֹסֵרָה
  choice: menuju Mosera
  rationale: Walaupun tidak ada preposisi tujuan yang tersurat, pola perjalanan ‘berangkat dari ...’ menuntut tujuan secara idiomatis; ‘menuju’ memasok hubungan yang tersirat itu tanpa mengubah nama tempat.
- source_word: שָׁם ... שָׁם
  choice: Di sana ... dan di sana
  rationale: Pengulangan keterangan tempat dalam bahasa Ibrani dipertahankan untuk menjaga penekanan lokasi.
- source_word: וַיִּקָּבֵר
  choice: ia dikuburkan
  rationale: Bentuk Nifal menyatakan makna pasif; terjemahan ini tidak menambahkan pelaku yang tidak disebutkan.
- source_word: וַיְכַהֵן
  choice: melayani sebagai imam
  rationale: Verba כהן berarti menjalankan atau melayani dalam jabatan imam, bukan sekadar mulai menyandang jabatan itu.
- source_word: תַּחְתָּיו
  choice: menggantikan dia
  rationale: Ungkapan ini secara harfiah berarti ‘di tempatnya’ dan dalam konteks menyatakan pergantian atau suksesi jabatan imam.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama tempat ditransliterasikan dalam bentuk yang mudah dibaca oleh pembaca Indonesia. Susunan kalimat mempertahankan pengulangan ‘di sana’ dari teks Ibrani, sedangkan idiom kebangsaan dan perjalanan dibuat alami bagi pembaca masa kini.
