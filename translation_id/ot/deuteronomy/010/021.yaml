base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/021.yaml
  text: He is your praise[a], and he is your God[b], who has done for you these great and awe-inspiring things that your eyes have seen.
translation:
  language: id
  text: Dialah pujianmu[a], dan Dialah Allahmu, yang telah melakukan bagimu hal-hal besar dan dahsyat[b] ini, yang telah kaulihat dengan matamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Dialah yang kaupuji” atau “Dialah kebanggaanmu.” Secara harfiah bahasa Ibrani berbunyi, “Dialah pujianmu.”
    reason: lexical_alternative
  - marker: b
    text: Atau “menggentarkan” atau “menakutkan.” Istilah Ibrani ini menunjuk pada perbuatan yang membangkitkan rasa gentar dan takjub.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְהִלָּתְךָ
  choice: pujianmu
  rationale: Mempertahankan ungkapan predikatif Ibrani yang padat, sehingga Allah tetap dipahami sebagai objek sekaligus dasar pujian umat-Nya.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Padanan baku bagi sapaan perjanjian dalam bentuk tunggal yang ditujukan kepada Israel secara kolektif.
- source_word: עָשָׂה אִתְּךָ
  choice: telah melakukan bagimu
  rationale: Menyampaikan makna benefaktif bahwa perbuatan-perbuatan itu dilakukan demi Israel, sambil tetap dekat dengan susunan sumber.
- source_word: הַגְּדֹלֹת
  choice: perkara besar
  rationale: Adjektiva ini dipakai secara substantival; 'perkara besar' mempertahankan cakupan maknanya tanpa membatasinya hanya pada kuasa.
- source_word: הַנּוֹרָאוֹת
  choice: dahsyat
  rationale: '''Dahsyat'' dapat menyatakan sesuatu yang membangkitkan rasa gentar dan takjub, tanpa menguranginya menjadi kekaguman ringan atau membatasinya pada teror.'
- source_word: הָאֵלֶּה
  choice: ini
  rationale: Mempertahankan penunjukan langsung kepada perbuatan-perbuatan yang baru disebut.
- source_word: רָאוּ עֵינֶיךָ
  choice: yang telah dilihat oleh matamu sendiri
  rationale: Mempertahankan gambaran konkret tentang mata dan menegaskan pengalaman sebagai saksi langsung.
- source_word: הוּא ... וְהוּא
  choice: Dialah ... dan Dialah ...
  rationale: Pengulangan 'Dialah' mencerminkan tekanan dari dua pronomina Ibrani tanpa menambahkan gagasan eksklusivitas yang tidak dinyatakan secara eksplisit.
theological_decisions:
- issue: Makna ungkapan predikatif הוּא תְהִלָּתְךָ
  choice: Dialah pujianmu
  alternative: Dialah yang kaupuji; Dialah kebanggaanmu
  rationale: 'Pilihan ini mempertahankan kepadatan dan ketegangan teologis teks: Allah adalah pribadi yang dipuji sekaligus dasar bagi pujian Israel.'
- issue: Nuansa הַנּוֹרָאוֹת
  choice: dahsyat
  alternative: menakjubkan; menggentarkan; menakutkan
  rationale: '''Dahsyat'' mempertahankan perpaduan rasa gentar dan takjub yang ditimbulkan oleh perbuatan Allah, tanpa menafsirkannya sebagai teror semata.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk tunggal '-mu' dipertahankan karena teks menyapa Israel secara kolektif sebagai satu pihak dalam perjanjian. 'Perkara' dipilih untuk menjaga nada luhur tanpa menjadi arkais.
