id: DEU.10.4
reference: Deuteronomy 10:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּכְתֹּ֨ב עַֽל הַ/לֻּחֹ֜ת כַּ/מִּכְתָּ֣ב הָ/רִאשׁ֗וֹן אֵ֚ת עֲשֶׂ֣רֶת הַ/דְּבָרִ֔ים אֲשֶׁ֣ר דִּבֶּר֩ יְהוָ֨ה אֲלֵי/כֶ֥ם בָּ/הָ֛ר מִ/תּ֥וֹךְ הָ/אֵ֖שׁ בְּ/י֣וֹם הַ/קָּהָ֑ל וַ/יִּתְּנֵ֥/ם יְהוָ֖ה אֵלָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/004.yaml
  text: And he wrote on the tablets[a], like the first writing, the Ten Words that Yahweh had spoken to you on the mountain from the midst of the fire on the day of the assembly; and Yahweh gave them to me.
translation:
  language: id
  text: Ia menulis pada loh-loh itu, seperti tulisan yang pertama, Sepuluh Firman[a] yang telah Yahweh sampaikan kepada kalian di gunung, dari tengah-tengah api, pada hari perhimpunan itu. Lalu Yahweh memberikan loh-loh itu kepadaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau, menurut sebutan tradisional, “Sepuluh Perintah.” Secara harfiah dalam bahasa Ibrani: “sepuluh perkataan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: Ia menulis
  rationale: Bentuk wayyiqtol orang ketiga tunggal maskulin dari כתב menyatakan tindakan lampau dalam alur narasi. 'Menulis' mempertahankan kaitannya dengan מִכְתָּב, 'tulisan', dalam frasa berikutnya.
- source_word: הַלֻּחֹת
  choice: loh-loh itu
  rationale: לֻחוֹת menunjuk kepada loh perjanjian yang sudah dikenal dari konteks. 'Loh' merupakan padanan Indonesia yang lazim; bahan batu tidak ditambahkan karena tidak dinyatakan dalam ayat ini.
- source_word: כַּמִּכְתָּב הָרִאשׁוֹן
  choice: seperti tulisan yang pertama
  rationale: Prefiks כ menyatakan perbandingan, 'seperti', sedangkan מִכְתָּב berarti tulisan atau inskripsi. Terjemahan ini mempertahankan bentuk perbandingan tanpa memperjelasnya secara berlebihan.
- source_word: עֲשֶׂרֶת הַדְּבָרִים
  choice: Sepuluh Firman
  rationale: Secara leksikal ungkapan ini berarti 'sepuluh perkataan/firman'. 'Sepuluh Firman' mempertahankan bentuk sumber sekaligus berfungsi wajar sebagai nama ketetapan perjanjian; padanan tradisional dicatat dalam catatan kaki.
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֲלֵיכֶם
  choice: yang telah Yahweh sampaikan kepada kalian
  rationale: Klausa relatif ini menerangkan Sepuluh Firman. 'Telah ... sampaikan' menunjukkan bahwa penyampaian itu mendahului penulisan, sedangkan 'kalian' membedakan bentuk jamak אֲלֵיכֶם dari 'kepadamu' tunggal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian יהוה dialihaksarakan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap terlihat.
- source_word: בָּהָר
  choice: di gunung
  rationale: Dalam bahasa Indonesia, 'di gunung' merupakan ungkapan tempat yang alami dan cukup untuk konteks pewahyuan di Horeb/Sinai tanpa menambahkan nama yang tidak terdapat dalam ayat.
- source_word: מִתּוֹךְ הָאֵשׁ
  choice: dari tengah-tengah api
  rationale: Ungkapan ini menggambarkan firman yang keluar dari dalam api. 'Dari tengah-tengah api' mempertahankan citra spasial bahasa Ibrani.
- source_word: בְּיוֹם הַקָּהָל
  choice: pada hari perhimpunan itu
  rationale: קָהָל mengacu pada perhimpunan umat Israel. 'Hari perhimpunan itu' menyampaikan sifat peristiwa tertentu yang sudah dikenal dalam konteks.
- source_word: וַיִּתְּנֵם יְהוָה אֵלָי
  choice: Lalu Yahweh memberikannya kepadaku
  rationale: נתן berarti 'memberikan'. Sufiks objek -ם merujuk kepada loh-loh sebagai satu perangkat dalam pemakaian Indonesia, sehingga pronomina alami 'memberikannya' dipakai tanpa menentukan ulang rujukannya.
theological_decisions:
- issue: Penerjemahan nama perjanjian יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama ilahi יהוה secara langsung. 'Yahweh' mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Penerjemahan עֲשֶׂרֶת הַדְּבָרִים
  choice: Sepuluh Firman
  alternative: Sepuluh Perintah
  rationale: Ungkapan Ibrani secara harfiah menyebut 'sepuluh perkataan'. Bentuk yang dekat dengan sumber dipertahankan dalam teks utama, sementara istilah tradisional yang menonjolkan fungsi perintah dicantumkan sebagai alternatif dalam catatan kaki.
- issue: Subjek וַיִּכְתֹּב
  choice: Ia
  alternative: Yahweh
  rationale: Bentuk verba hanya menyatakan subjek orang ketiga tunggal maskulin; konteks mengacu kepada Yahweh, tetapi nama itu tidak diulang sampai klausa terakhir. Pronomina mempertahankan struktur dan tingkat keeksplisitan teks sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat tanpa menjadi arkais. 'Kalian' dipakai untuk menandai bentuk jamak orang kedua dengan jelas; 'kepadaku' tetap tunggal. Tanda [a] ditempatkan langsung sesudah istilah yang diterangkan.
