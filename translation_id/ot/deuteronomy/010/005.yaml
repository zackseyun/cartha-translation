  variant: modern standard Indonesian
source:
  edition: WLC
  text: וָ/אֵ֗פֶן וָֽ/אֵרֵד֙ מִן הָ/הָ֔ר וָֽ/אָשִׂם֙ אֶת הַ/לֻּחֹ֔ת בָּ/אָר֖וֹן אֲשֶׁ֣ר עָשִׂ֑יתִי וַ/יִּ֣הְיוּ שָׁ֔ם כַּ/אֲשֶׁ֥ר צִוַּ֖/נִי יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/005.yaml
  text: Then I turned and came down from the mountain[a], and I put the tablets in the ark that I had made; and they are there, just as Yahweh commanded me.
translation:
  language: id
  text: Lalu aku berbalik dan turun dari gunung itu. Aku menaruh loh-loh itu di dalam tabut yang telah kubuat, dan loh-loh itu ada di sana[a], seperti yang diperintahkan Yahweh kepadaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dan loh-loh itu berada di sana”; ungkapan ini juga dapat menyiratkan bahwa loh-loh itu tetap berada di sana sampai saat Musa berbicara.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵפֶן
  choice: Lalu aku berbalik
  rationale: Kata פנה berarti ‘berbalik’ atau ‘berpaling’. ‘Lalu’ menyampaikan urutan narasi dari bentuk wayyiqtol secara wajar dalam bahasa Indonesia.
- source_word: וָאֵרֵד מִן הָהָר
  choice: dan turun dari gunung itu
  rationale: Kata ירד berarti ‘turun’. Frasa ‘gunung itu’ mencerminkan kata sandang tertentu dalam bahasa Ibrani dan mengacu pada gunung yang sudah dikenal dari konteks.
- source_word: וָאָשִׂם
  choice: Aku menaruh
  rationale: Kata שׂים berarti ‘menaruh, menempatkan’. ‘Menaruh’ merupakan pilihan yang alami dan jelas dalam bahasa Indonesia modern.
- source_word: הַלֻּחֹת
  choice: loh-loh itu
  rationale: Bentuk jamak לֻחוֹת menunjuk pada loh-loh perjanjian yang telah disebutkan. Unsur ‘batu’ tidak ditambahkan karena tidak terdapat dalam klausa ini.
- source_word: בָּאָרוֹן
  choice: di dalam tabut
  rationale: Kata אָרוֹן dapat berarti peti atau tabut; dalam konteks perjanjian ini, ‘tabut’ adalah padanan yang tepat. ‘Di dalam’ menyatakan lokasi sekaligus wajar setelah tindakan menaruh.
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: yang telah kubuat
  rationale: Klausa relatif ini menerangkan tabut. Kata ‘telah’ menjelaskan bahwa pembuatan tabut mendahului penempatan loh-loh tanpa mengubah urutan peristiwa.
- source_word: וַיִּהְיוּ שָׁם
  choice: dan loh-loh itu ada di sana
  rationale: Ungkapan ini menyatakan keberadaan loh-loh di sana dan dapat pula menyiratkan bahwa loh-loh itu tetap berada di sana hingga waktu penuturan. Pengulangan ‘loh-loh itu’ menghindari kata ganti benda yang tidak alami dalam bahasa Indonesia.
- source_word: כַּאֲשֶׁר צִוַּנִי יְהוָה
  choice: seperti yang diperintahkan Yahweh kepadaku
  rationale: כַּאֲשֶׁר menyatakan kesesuaian, yaitu ‘seperti’. Bentuk צִוַּנִי berarti ‘memerintahkan aku/kepadaku’, dan nama ilahi יְהוָה ditransliterasikan sebagai ‘Yahweh’.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung. ‘Yahweh’ mempertahankan nama pribadi ilahi, bukan menggantinya dengan gelar.
- issue: Keberadaan loh-loh dalam tabut pada וַיִּהְיוּ שָׁם
  choice: ada di sana, dengan catatan tentang kemungkinan makna berkelanjutan
  alternative: tetap berada di sana; berada di sana
  rationale: Bentuk Ibrani menyatakan bahwa loh-loh itu berada di sana, tetapi dalam konteksnya dapat juga dipahami bahwa keberadaan itu berlanjut sampai saat Musa berbicara. Teks utama tidak mempertegas salah satu kemungkinan secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur narasi dibuat alami tanpa menghilangkan urutan tindakan. Istilah ‘loh-loh’ dan ‘tabut’ dipertahankan karena sudah dikenal dalam ragam Alkitabiah Indonesia, sedangkan susunan kalimat tetap mudah dipahami pembaca umum.
