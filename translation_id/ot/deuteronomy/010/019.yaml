base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/019.yaml
  text: So love the foreigner[a], because you were foreigners in the land of Egypt.
translation:
  language: id
  text: Karena itu, kasihilah pendatang[a], sebab kamu dahulu pendatang di tanah Mesir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang asing,” “penduduk asing,” atau “perantau.” Kata Ibrani ger mengacu pada orang dari bangsa lain yang tinggal di tengah-tengah Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/אֲהַבְתֶּם
  choice: Karena itu, kasihilah
  rationale: Bentuk dari אהב menyatakan perintah dalam konteks ini, sedangkan waw menghubungkannya dengan ayat sebelumnya, yakni kasih Allah kepada pendatang. “Karena itu” menyampaikan hubungan kesimpulan itu secara alami dalam bahasa Indonesia.
- source_word: הַ/גֵּר
  choice: pendatang
  rationale: גֵּר menunjuk kepada orang bukan pribumi yang tinggal di tengah Israel dan memiliki kedudukan sosial yang rentan, bukan sekadar pelancong. “Pendatang” cukup alami dan menghindari kesan istilah hukum modern yang mungkin timbul dari “orang asing yang menetap”.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan bagi perintah tersebut. “Sebab” jelas dan sesuai dengan ragam bahasa yang bermartabat.
- source_word: גֵרִים
  choice: pendatang
  rationale: Bentuk jamak גֵּר diterjemahkan dengan istilah yang sama untuk mempertahankan pengulangan leksikal. Bahasa Indonesia tidak harus menandai jamak secara morfologis setelah subjek “kamu”.
- source_word: הֱיִיתֶם
  choice: dahulu kamu pun pendatang
  rationale: היה di sini menyatakan keadaan pada masa lampau. “Dahulu” memperjelas waktu, sedangkan “pun” menonjolkan dasar analogis perintah tanpa menambah gagasan baru.
- source_word: בְּ/אֶרֶץ מִצְרָיִם
  choice: di tanah Mesir
  rationale: Mempertahankan אֶרֶץ sebagai “tanah” dan sekaligus menghasilkan ungkapan Indonesia yang ringkas serta wajar.
theological_decisions:
- issue: Identitas sosial yang dinyatakan oleh גֵּר dalam hukum perjanjian
  choice: pendatang
  alternative: orang asing; penduduk asing; perantau
  rationale: Ayat ini mendasarkan kewajiban Israel untuk mengasihi pada pengalaman mereka sendiri sebagai orang luar yang tinggal di negeri lain. “Pendatang” menyampaikan status bukan pribumi yang menetap tanpa membatasi istilah itu pada kategori hukum modern atau menyiratkan bahwa orang tersebut hanya sedang lewat.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk “kasihilah” mempertahankan daya perintah; “karena itu” dan “sebab” membedakan hubungan kesimpulan dari ayat sebelumnya dan alasan historis di dalam ayat ini. Penanda catatan kaki [a] dicantumkan langsung setelah istilah yang dijelaskan.
