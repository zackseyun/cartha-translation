source:
  edition: WLC
  text: רַ֧ק בַּ/אֲבֹתֶ֛י/ךָ חָשַׁ֥ק יְהוָ֖ה לְ/אַהֲבָ֣ה אוֹתָ֑/ם וַ/יִּבְחַ֞ר בְּ/זַרְעָ֣/ם אַחֲרֵי/הֶ֗ם בָּ/כֶ֛ם מִ/כָּל הָ/עַמִּ֖ים כַּ/יּ֥וֹם הַ/זֶּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/015.yaml
  text: Yet Yahweh set his affection on your fathers[a], to love them, and he chose their offspring after them—you—from all the peoples, as it is this day.
translation:
  language: id
  text: Namun Yahweh menambatkan hati-Nya kepada nenek moyangmu[a] untuk mengasihi mereka. Ia memilih keturunan mereka sesudah mereka—yaitu kamu—dari antara segala bangsa, sebagaimana nyata pada hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Hanya kepada nenek moyangmu Yahweh menambatkan hati-Nya untuk mengasihi mereka.”'
    reason: רַק dapat dipahami terutama sebagai penanda pembatasan (“hanya”) atau sebagai penanda kontras yang kuat (“namun”) dalam konteks ini.
lexical_decisions:
- source_word: רַק
  choice: Namun
  rationale: Dalam konteks ini רַק menandai kontras yang menakjubkan antara kekuasaan Yahweh atas seluruh ciptaan dan kasih khusus-Nya kepada nenek moyang Israel. “Namun” menyampaikan daya adversatifnya dengan wajar; nuansa restriktif “hanya” dicatat dalam catatan kaki.
- source_word: בַּאֲבֹתֶיךָ חָשַׁק
  choice: menambatkan hati-Nya kepada nenek moyangmu
  rationale: חָשַׁק menyatakan keterikatan atau kasih sayang yang kuat dan terarah, sedangkan ב menandai sasaran keterikatan itu. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan unsur relasional serta kehendak.
- source_word: לְאַהֲבָה אֹתָם
  choice: untuk mengasihi mereka
  rationale: Infinitif ini menyatakan tujuan atau hasil yang erat terkait dengan חָשַׁק. Terjemahan langsung ini mempertahankan kosakata kasih dalam teks Ibrani.
- source_word: וַיִּבְחַר
  choice: Ia memilih
  rationale: בחר adalah verba lazim untuk tindakan memilih, termasuk pemilihan ilahi. “Memilih” jelas dan tidak menambahkan sistem teologis tertentu.
- source_word: בְּזַרְעָם אַחֲרֵיהֶם
  choice: keturunan mereka sesudah mereka
  rationale: זֶרַע di sini bersifat kolektif dan merujuk kepada generasi penerus. “Keturunan” wajar dalam bahasa Indonesia, sementara “sesudah mereka” mempertahankan urutan antargenerasi yang eksplisit.
- source_word: בָּכֶם
  choice: yaitu kamu
  rationale: Kata ini menjelaskan secara aposisional bahwa keturunan yang dipilih itu adalah para pendengar saat itu. Tanda pisah memperjelas hubungan tersebut tanpa mengubah makna.
- source_word: מִכָּל הָעַמִּים
  choice: dari antara segala bangsa
  rationale: מן menyatakan pemilihan dari antara suatu kelompok, dan עַמִּים menunjuk kepada kelompok-kelompok bangsa. Rumusan ini jelas dan alami dalam bahasa Indonesia.
- source_word: כַּיּוֹם הַזֶּה
  choice: seperti yang nyata pada hari ini
  rationale: Ungkapan idiomatis ini menunjuk kepada keadaan kini yang dapat dilihat sebagai peneguhan pernyataan sebelumnya. Terjemahan ini menyampaikan fungsi idiom tersebut dengan bahasa Indonesia yang alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
theological_decisions:
- issue: Bahasa pemilihan ilahi
  choice: Mempertahankan pernyataan eksplisit tentang kasih dan pilihan Yahweh
  alternative: Mengurangi pemilihan menjadi sekadar preferensi historis, atau memperluasnya menjadi rumusan sistem teologis tertentu
  rationale: Teks menyatakan keterikatan kasih Yahweh kepada para leluhur dan pilihan-Nya atas keturunan mereka. Terjemahan mempertahankan ketegangan dan kekuatan pernyataan itu tanpa melemahkan atau mensistematisasikannya.
- issue: Hubungan antara חָשַׁק dan אָהַב
  choice: Membedakan “menambatkan hati” dari “mengasihi”
  alternative: Menerjemahkan keduanya dengan kata “mengasihi”
  rationale: 'Pembedaan ini mempertahankan dua unsur leksikal dalam bahasa sumber: keterikatan atau hasrat yang terarah dan tindakan mengasihi.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Nenek moyang” dipilih karena lebih mudah dipahami daripada “bapa-bapa leluhur”; “menambatkan hati-Nya” mempertahankan gambaran keterikatan kasih tanpa terdengar teknis. Kapitalisasi pronomina ilahi mengikuti register Alkitab Indonesia yang umum.
