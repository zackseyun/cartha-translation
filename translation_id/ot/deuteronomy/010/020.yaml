source:
  edition: WLC
  text: אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ תִּירָ֖א אֹת֣/וֹ תַעֲבֹ֑ד וּ/ב֣/וֹ תִדְבָּ֔ק וּ/בִ/שְׁמ֖/וֹ תִּשָּׁבֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/020.yaml
  text: You shall fear Yahweh your God[a]; him you shall serve, to him you shall cling[b], and by his name you shall swear.
translation:
  language: id
  text: Engkau harus takut kepada Yahweh, Allahmu[a]; Dialah yang harus kaulayani, kepada-Nya engkau harus berpaut[b], dan demi nama-Nya engkau harus bersumpah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hormatilah Yahweh, Allahmu dengan penuh rasa gentar”; dalam konteks perjanjian, kata Ibrani untuk “takut” juga mencakup rasa hormat yang mendalam.
    reason: lexical_alternative
  - marker: b
    text: Atau, “berpegang teguh kepada-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama diri, bukan menggantinya dengan gelar seperti TUHAN.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk dengan akhiran orang kedua maskulin tunggal menyatakan hubungan perjanjian secara langsung dan wajar dalam bahasa Indonesia.
- source_word: תִּירָא
  choice: harus takut
  rationale: Kata ירא mencakup rasa takut yang disertai hormat dalam konteks perjanjian. 'Takut' mempertahankan bobot leksikalnya, sedangkan 'harus' menyampaikan fungsi perintah dari bentuk imperfek Ibrani.
- source_word: אֹתוֹ תַעֲבֹד
  choice: Dialah yang harus kaulayani
  rationale: Pronomina objek yang didahulukan memberi penekanan pada Dia. Konstruksi 'Dialah' mempertahankan fokus itu, sementara 'layani' menjaga arti dasar עבד tanpa mempersempitnya hanya pada ibadah ritual.
- source_word: וּבוֹ תִדְבָּק
  choice: kepada-Nya engkau harus berpaut
  rationale: Dengan דבק, preposisi ב menyatakan keterikatan erat kepada seseorang. 'Berpaut kepada' menyampaikan kesetiaan dan kedekatan relasional tanpa menghilangkan metafora melekat.
- source_word: וּבִשְׁמוֹ תִּשָּׁבֵעַ
  choice: demi nama-Nya engkau harus bersumpah
  rationale: Ungkapan Ibrani berarti menjadikan nama-Nya dasar atau penjamin sumpah. 'Bersumpah demi nama-Nya' merupakan padanan idiomatis yang jelas dalam bahasa Indonesia.
theological_decisions:
- issue: Daya perintah bentuk imperfek dalam nasihat perjanjian
  choice: Menggunakan 'harus' pada setiap kewajiban
  alternative: 'Menggunakan rangkaian imperatif langsung: ''Takutlah ... layanilah ... berpautlah ... bersumpahlah'''
  rationale: Dalam konteks hukum dan nasihat perjanjian, bentuk-bentuk imperfek ini berfungsi sebagai perintah. 'Harus' mempertahankan nuansa kewajiban perjanjian sekaligus menghasilkan susunan Indonesia yang alami dan khidmat.
- issue: Penekanan pada objek pelayanan
  choice: Menerjemahkan אֹתוֹ yang didahulukan dengan 'Dialah'
  alternative: 'Menerjemahkan tanpa penekanan: ''engkau harus melayani Dia'''
  rationale: Pilihan ini mempertahankan penonjolan sintaksis teks Ibrani tanpa menambahkan kata 'hanya', yang dapat membuat eksklusivitas lebih eksplisit daripada bentuk aslinya.
- issue: Makna takut dalam hubungan perjanjian
  choice: Mempertahankan 'takut' dan menjelaskan cakupan rasa hormat dalam catatan kaki
  alternative: Menerjemahkan langsung sebagai 'hormatlah' atau 'takutlah dengan penuh hormat'
  rationale: Teks memakai kata yang benar-benar dapat berarti takut, tetapi dalam konteks ini juga mencakup rasa hormat kepada Allah. Catatan kaki mempertahankan kedua sisi tanpa menghaluskan ketegangan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina tunggal 'engkau' sesuai dengan sapaan maskulin tunggal dalam teks Ibrani. Kapitalisasi pada bentuk rujukan kepada Allah dipakai secara konsisten. Susunan klausa mempertahankan irama perjanjian dan penekanan pada Dia sebagai objek pelayanan.
