  variant: modern standard Indonesian
source:
  edition: WLC
  text: עַל כֵּ֞ן לֹֽא הָיָ֧ה לְ/לֵוִ֛י חֵ֥לֶק וְ/נַחֲלָ֖ה עִם אֶחָ֑י/ו יְהוָה֙ ה֣וּא נַחֲלָת֔/וֹ כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/009.yaml
  text: Therefore Levi has no portion or inheritance with his brothers[a]; Yahweh is his inheritance[b], just as Yahweh your God spoke to him.
translation:
  language: id
  text: Karena itu, Lewi tidak mempunyai bagian dan warisan bersama saudara-saudaranya[a]; Yahweh adalah warisannya[b], sebagaimana Yahweh, Allahmu, telah berfirman kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bersama saudara-saudaranya.” Nama tunggal “Lewi” mewakili suku Lewi, sedangkan “saudara-saudaranya” menunjuk pada suku-suku Israel lainnya.
    reason: cultural_note
  - marker: b
    text: Atau, “Yahweh adalah bagiannya.” Bahasa Ibrani mengulangi istilah “warisan” untuk menegaskan bahwa bagian warisan Lewi bukanlah tanah, melainkan Yahweh sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: Karena itu
  rationale: Ungkapan ini menarik kesimpulan dari konteks sebelumnya; “Karena itu” alami dalam bahasa Indonesia dan mempertahankan daya simpulannya.
- source_word: לְלֵוִי
  choice: Lewi
  rationale: Nama tunggal Lewi mewakili sukunya. Bentuk sumber dipertahankan, sedangkan makna perwakilan dijelaskan dalam catatan kaki.
- source_word: חֵלֶק
  choice: bagian
  rationale: Kata ini menunjuk pada jatah atau bagian dalam pembagian tanah dan tetap dibedakan dari “warisan”.
- source_word: נַחֲלָה
  choice: warisan
  rationale: Dalam konteks Ulangan, kata ini lazim menunjuk pada hak milik turun-temurun, khususnya tanah yang diwariskan.
- source_word: עִם אֶחָיו
  choice: bersama saudara-saudaranya
  rationale: Terjemahan ini mempertahankan istilah kekerabatan maskulin dalam bahasa Ibrani serta gambaran Lewi sebagai saudara bagi suku-suku Israel lainnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama pribadi “Yahweh”, bukan diganti dengan gelar.
- source_word: הוּא נַחֲלָתוֹ
  choice: adalah warisannya
  rationale: Pengulangan “warisan” mempertahankan kaitan leksikal dan kontras antara warisan berupa tanah dengan Yahweh sendiri sebagai warisan Lewi.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: seperti yang difirmankan
  rationale: Kata kerja sumber berarti berbicara atau berfirman dan tidak secara eksplisit berarti berjanji.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk orang kedua tunggal dipertahankan sesuai sapaan Musa kepada Israel sebagai satu umat.
- source_word: לוֹ
  choice: kepadanya
  rationale: Pronomina tunggal merujuk kembali kepada Lewi sebagai wakil sukunya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankannya sebagai nama perjanjian, bukan menggantinya dengan sebuah gelar.
- issue: Lewi sebagai nama tunggal yang mewakili suku
  choice: Lewi tidak mempunyai bagian ataupun warisan
  alternative: Suku Lewi tidak mempunyai bagian ataupun warisan
  rationale: Bentuk tunggal dalam sumber dipertahankan tanpa mengaburkan bahwa Lewi di sini mewakili seluruh sukunya.
- issue: Istilah kekerabatan אֶחָיו
  choice: saudara-saudaranya
  alternative: sesama orang Israel
  rationale: Pilihan ini mempertahankan metafora persaudaraan dan bentuk maskulin sumber, sementara cakupan kesukuannya diterangkan dalam catatan.
- issue: Yahweh sebagai warisan Lewi
  choice: Yahweh adalah warisannya
  alternative: Yahweh adalah bagiannya
  rationale: “Warisan” mengulang kata נַחֲלָה dan mempertahankan ketegangan teologis bahwa Lewi tidak menerima warisan tanah karena Yahweh sendiri adalah warisannya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan struktur yang mudah dipahami. “Tidak mempunyai” menyatakan keadaan yang berlanjut, sesuai fungsi bentuk verba Ibrani dalam konteks ini. “Bagian ataupun warisan” mempertahankan kedua nomina tanpa terdengar kaku; “difirmankan” merupakan ungkapan Indonesia yang wajar untuk tuturan ilahi tanpa mengubahnya menjadi janji eksplisit.
