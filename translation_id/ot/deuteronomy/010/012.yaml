reference: Deuteronomy 10:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּה֙ יִשְׂרָאֵ֔ל מָ֚ה יְהוָ֣ה אֱלֹהֶ֔י/ךָ שֹׁאֵ֖ל מֵ/עִמָּ֑/ךְ כִּ֣י אִם לְ֠/יִרְאָה אֶת יְהוָ֨ה אֱלֹהֶ֜י/ךָ לָ/לֶ֤כֶת בְּ/כָל דְּרָכָי/ו֙ וּ/לְ/אַהֲבָ֣ה אֹת֔/וֹ וְ/לַֽ/עֲבֹד֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/012.yaml
  text: And now[a], Israel, what does Yahweh your God ask of you, except to fear Yahweh your God, to walk in all his ways, to love him[c][b], and to serve Yahweh your God with all your heart and with all your soul?
translation:
  language: id
  text: Maka sekarang, hai Israel, apa yang Yahweh, Allahmu, minta darimu,[a] selain takut akan Yahweh, Allahmu,[b] hidup menurut segala jalan-Nya, mengasihi Dia, dan melayani Yahweh, Allahmu, dengan segenap hatimu dan segenap jiwamu?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau 'tuntut darimu'; verba Ibrani ini dapat berarti meminta dengan nuansa kewajiban.
    reason: lexical_alternative
  - marker: b
    text: '''Takut'' di sini mencakup rasa gentar dan hormat yang disertai ketaatan serta pengabdian kepada Yahweh.'
    reason: lexical_alternative
  - marker: c
    text: Atau 'dengan segenap hidupmu' atau 'dengan seluruh dirimu'; kata Ibrani nefesy dapat berarti jiwa, hidup, atau diri, sesuai konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Jadi sekarang
  rationale: Mempertahankan daya penghubung וְ sekaligus menandai peralihan menuju kesimpulan dan nasihat Musa; ungkapan ini alami dalam bahasa Indonesia.
- source_word: מָה ... שֹׁאֵל מֵעִמָּךְ
  choice: apakah yang diminta ... darimu
  rationale: שׁאל dengan מֵעִם dapat berarti meminta sesuatu dari seseorang dan dalam konteks ini mengandung tuntutan; 'diminta ... darimu' mempertahankan bentuk pertanyaan retoris.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Mewakili bentuk dengan sufiks orang kedua tunggal yang menyapa Israel secara kolektif.
- source_word: כִּי אִם
  choice: selain
  rationale: 'Dalam pertanyaan retoris ini, frasa tersebut memperkenalkan isi yang diminta dengan daya pembatas: ''selain/kalau bukan''.'
- source_word: לְיִרְאָה
  choice: takut akan
  rationale: Menjaga bobot dasar ירא dan ketegangan maknanya yang mencakup rasa gentar, hormat, dan pengabdian taat.
- source_word: לָלֶכֶת בְּכָל דְּרָכָיו
  choice: hidup menurut segala jalan-Nya
  rationale: Metafora Ibrani 'berjalan' menyatakan cara hidup. Dalam bahasa Indonesia, 'hidup menurut' lebih alami dan tetap mempertahankan 'jalan-Nya' sebagai gambaran etis.
- source_word: וּלְאַהֲבָה אֹתוֹ
  choice: mengasihi Dia
  rationale: Menerjemahkan langsung tindakan kasih dengan pronomina yang merujuk kepada Yahweh.
- source_word: וְלַעֲבֹד
  choice: melayani
  rationale: עבד mencakup pelayanan, ketaatan, dan ibadah kepada Allah; 'melayani' mempertahankan keluasan ini tanpa membatasinya pada kegiatan ritual.
- source_word: בְּכָל לְבָבְךָ
  choice: dengan segenap hatimu
  rationale: Ungkapan Indonesia yang alami untuk totalitas batin, kehendak, dan pikiran yang dicakup לֵבָב.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: dengan segenap jiwamu
  rationale: נפשׁ dapat berarti jiwa, nyawa, diri, atau kehidupan; 'jiwa' mempertahankan ungkapan pasangan tradisional dengan 'hati' tanpa menutup alternatif maknanya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi Allah. 'Yahweh' mempertahankan nama itu dan merupakan transliterasi ilmiah yang umum.
- issue: Daya makna ירא dalam nasihat perjanjian
  choice: takut akan
  alternative: menghormati atau gentar kepada
  rationale: '''Takut akan'' mempertahankan ketegangan teologis antara rasa gentar, hormat, dan ketaatan, sedangkan ''menghormati'' saja terlalu mempersempit dan memperlembut maknanya.'
- issue: Cakupan נפשׁ dalam tuntutan pengabdian menyeluruh
  choice: jiwamu
  alternative: hidupmu atau seluruh dirimu
  rationale: '''Jiwa'' merupakan padanan yang dikenal, tetapi catatan kaki mengakui bahwa kata Ibrani dapat menunjuk pada hidup atau diri seseorang secara utuh.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Sapaan 'hai Israel' mempertahankan alamat langsung yang bersifat retoris. Israel disapa dengan bentuk tunggal kolektif, sebagaimana sufiks orang kedua tunggal dalam teks Ibrani. Ejaan 'Nya' digunakan untuk pronomina ilahi sesuai konvensi bahasa Indonesia.
