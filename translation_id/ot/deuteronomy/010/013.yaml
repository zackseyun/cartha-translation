  text: לִ/שְׁמֹ֞ר אֶת מִצְוֺ֤ת יְהוָה֙ וְ/אֶת חֻקֹּתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם לְ/ט֖וֹב לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/013.yaml
  text: to keep the commandments of Yahweh and his statutes that I am commanding you today for your good?[a]
translation:
  language: id
  text: untuk menaati perintah-perintah Yahweh dan ketetapan-ketetapan-Nya yang Aku perintahkan kepadamu hari ini demi kebaikanmu?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk memelihara” atau “untuk menjaga” perintah-perintah Yahweh.
    reason: Alternatif leksikal bagi לִשְׁמֹר, yang dapat menekankan ketaatan, pemeliharaan, atau penjagaan.
lexical_decisions:
- source_word: לִשְׁמֹר
  choice: untuk menaati
  rationale: Infinitif dengan ל melanjutkan isi yang dituntut dalam ayat sebelumnya. Dalam konteks perintah perjanjian, “menaati” mengungkapkan pelaksanaan yang setia secara alami dalam bahasa Indonesia; nuansa harfiah “menjaga” dicatat dalam catatan kaki.
- source_word: מִצְוֺת
  choice: perintah-perintah
  rationale: Bentuk jamak ini menunjuk pada kewajiban yang diperintahkan Yahweh. “Perintah-perintah” jelas, alami, dan mempertahankan ragam hukum-perjanjian.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks Ibrani tetap terlihat.
- source_word: חֻקֹּתָיו
  choice: ketetapan-ketetapan-Nya
  rationale: Istilah ini merujuk pada ketentuan yang ditetapkan dan berpasangan dengan “perintah-perintah”; “ketetapan” mempertahankan nuansa hukum tanpa terdengar usang.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: yang kuperintahkan kepadamu hari ini
  rationale: Klausa relatif secara alami menerangkan gabungan “perintah-perintah” dan “ketetapan-ketetapan”. Bentuk “kuperintahkan” menyampaikan tindakan ujaran yang berlaku pada hari itu tanpa perlu progresif yang kurang alami dalam bahasa Indonesia.
- source_word: לְטוֹב לָךְ
  choice: demi kebaikanmu
  rationale: Ungkapan ini menyatakan tujuan atau manfaat bagi umat. “Demi kebaikanmu” ringkas dan alami serta mempertahankan kaitan langsung tanpa koma.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama ilahi dalam teks sumber dan tidak menggantinya dengan gelar.
- issue: Hubungan לְטוֹב לָךְ dengan perintah sebelumnya
  choice: demi kebaikanmu
  alternative: agar keadaanmu baik; untuk keuntunganmu
  rationale: Frasa Ibrani dapat menyatakan manfaat atau tujuan. Terjemahan ini menjaga keluasan makna tersebut tanpa menentukan secara sempit apakah yang dimaksud hanya kesejahteraan materi atau hasil tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang khidmat tetapi mudah dipahami. Bentuk pronominal “-Nya” merujuk kepada Yahweh, sedangkan “ku-” mempertahankan pergantian penutur pada konteks sebelumnya. Tanda tanya dipertahankan karena ayat ini menutup pertanyaan yang dimulai pada ayat sebelumnya.
