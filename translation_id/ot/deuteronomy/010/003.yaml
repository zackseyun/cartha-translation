base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/003.yaml
  text: So I made an ark of acacia wood and cut two stone tablets like the first ones[a], and I went up the mountain with the two tablets in my hand.
translation:
  language: id
  text: Lalu aku membuat sebuah tabut dari kayu akasia dan memahat dua loh batu seperti yang pertama[a]. Setelah itu aku naik ke gunung dengan kedua loh itu di tanganku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “memahat dua loh dari batu seperti loh-loh yang pertama.”'
    reason: Alternatif ini menyatakan susunan frasa Ibrani secara lebih eksplisit dan memperjelas bahwa perbandingan itu merujuk kepada loh-loh terdahulu.
lexical_decisions:
- source_word: אֲרוֹן
  choice: tabut
  rationale: Dalam konteks perjanjian, 'tabut' adalah padanan Indonesia yang lazim dan tepat bagi peti suci tempat loh-loh disimpan.
- source_word: עֲצֵי שִׁטִּים
  choice: kayu akasia
  rationale: Padanan alami dalam bahasa Indonesia modern yang mempertahankan jenis kayunya.
- source_word: וָאֶפְסֹל
  choice: memahat
  rationale: Kata kerja פסל di sini menyatakan pembentukan batu dengan memotong atau menatah; 'memahat' jelas dan wajar untuk pembuatan loh batu.
- source_word: לֻחֹת אֲבָנִים
  choice: loh batu
  rationale: '''Loh batu'' merupakan ungkapan Alkitabiah yang tetap dipahami dan secara ringkas menyatakan loh yang terbuat dari batu.'
- source_word: כָּרִאשֹׁנִים
  choice: seperti yang semula
  rationale: Menjaga perbandingan dengan dua loh terdahulu tanpa menambahkan keterangan yang tidak dinyatakan.
- source_word: וָאַעַל הָהָרָה
  choice: aku naik ke gunung
  rationale: Bentuk arah pada הָהָרָה bersama עלה menunjukkan gerakan mendaki atau naik ke gunung.
- source_word: בְּיָדִי
  choice: di tanganku
  rationale: Mempertahankan bentuk tunggal sumber; dalam bahasa Indonesia ungkapan ini juga wajar untuk sesuatu yang dibawa.
- source_word: וָאַעַשׂ
  choice: aku membuat
  rationale: Padanan langsung dan alami bagi kata kerja umum עשה dalam konteks pembuatan tabut.
theological_decisions:
- issue: Sebutan bagi wadah suci loh-loh perjanjian
  choice: tabut
  alternative: peti
  rationale: '''Tabut'' mempertahankan makna kontekstual dan asosiasi perjanjian yang melekat pada אֲרוֹן di bagian ini tanpa menambahkan klaim teologis di luar teks.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kata 'loh' dan 'tabut' dipertahankan karena sudah mapan serta tetap mudah dipahami dalam konteks Alkitab. Penghubung naratif dibuat alami tanpa mengubah urutan tindakan.
