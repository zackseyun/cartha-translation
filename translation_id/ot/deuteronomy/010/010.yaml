source:
  edition: WLC
  text: וְ/אָנֹכִ֞י עָמַ֣דְתִּי בָ/הָ֗ר כַּ/יָּמִים֙ הָ/רִ֣אשֹׁנִ֔ים אַרְבָּעִ֣ים י֔וֹם וְ/אַרְבָּעִ֖ים לָ֑יְלָה וַ/יִּשְׁמַ֨ע יְהוָ֜ה אֵלַ֗/י גַּ֚ם בַּ/פַּ֣עַם הַ/הִ֔וא לֹא אָבָ֥ה יְהוָ֖ה הַשְׁחִיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/010.yaml
  text: As for me[a], I stood on the mountain as at the first time, forty days and forty nights, and Yahweh listened to me that time also; Yahweh was not willing to destroy you.
translation:
  language: id
  text: Adapun aku tetap berada di gunung seperti pada hari-hari yang pertama, selama empat puluh hari dan empat puluh malam. Yahweh juga mendengarkan aku pada waktu itu.[a] Yahweh tidak bersedia memusnahkanmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Yahweh mendengar aku.” Kata kerja Ibrani ini dapat berarti mendengar maupun mendengarkan dengan tanggapan yang baik.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: Adapun aku, aku
  rationale: Konjungsi dan pronomina mandiri memberi penekanan topikal ringan; bentuk ini mempertahankan penekanan itu secara wajar dalam bahasa Indonesia.
- source_word: עָמַדְתִּי
  choice: tetap berada
  rationale: Secara harfiah verba ini dapat berarti 'berdiri', tetapi dalam konteks keberadaan selama empat puluh hari di gunung, makna idiomatis 'tetap berada' lebih tepat dan tidak menyiratkan postur tubuh terus-menerus.
- source_word: בָהָר
  choice: di gunung
  rationale: Ini merupakan ungkapan lokasi yang alami dalam bahasa Indonesia untuk keberadaan Musa di Gunung Sinai/Horeb.
- source_word: כַיָּמִים הָרִאשֹׁנִים
  choice: seperti pada kesempatan pertama
  rationale: Frasa ini membandingkan masa tersebut dengan periode empat puluh hari yang terdahulu; 'kesempatan pertama' menyampaikan rujukan pada peristiwa sebelumnya secara alami.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לָיְלָה
  choice: empat puluh hari dan empat puluh malam
  rationale: Terjemahan langsung dan lazim bagi rumusan durasi ini.
- source_word: וַיִּשְׁמַע יְהוָה אֵלַי
  choice: Yahweh mendengarkan aku
  rationale: שׁמע dengan אֶל dapat berarti mendengar atau mendengarkan dengan tanggapan yang baik. 'Mendengarkan aku' mempertahankan nuansa tanggapan tanpa menambahkan objek seperti 'permohonanku' yang tidak dinyatakan.
- source_word: גַּם בַּפַּעַם הַהִוא
  choice: juga pada waktu itu
  rationale: Urutan ini dengan jelas menyatakan bahwa Yahweh kembali mendengarkan Musa pada peristiwa tersebut.
- source_word: לֹא אָבָה
  choice: tidak bersedia
  rationale: Pilihan ini mempertahankan unsur kehendak atau kesediaan dalam verba Ibrani, bukan sekadar menyatakan bahwa tindakan itu tidak terjadi.
- source_word: הַשְׁחִיתֶךָ
  choice: memusnahkan kalian
  rationale: Bentuk kausatif ini menyatakan penghancuran Israel dalam konteks hukuman perjanjian. 'Kalian' memperjelas bahwa sufiks orang kedua tunggal merujuk secara kolektif kepada umat Israel.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai nama ilahi secara langsung. Transliterasi 'Yahweh' mempertahankan nama pribadi itu tanpa menggantinya dengan gelar.
- issue: Nuansa tanggapan ilahi dalam וַיִּשְׁמַע יְהוָה אֵלַי
  choice: Yahweh mendengarkan aku
  alternative: Yahweh mendengar aku
  rationale: Konteksnya adalah perantaraan Musa. 'Mendengarkan' dapat menyiratkan penerimaan atau tanggapan yang baik, tetapi catatan kaki mempertahankan kemungkinan terjemahan yang lebih netral, 'mendengar'.
- issue: Referen orang kedua tunggal dalam הַשְׁחִיתֶךָ
  choice: kalian
  alternative: engkau
  rationale: Bentuk Ibrani adalah tunggal, tetapi yang disapa adalah Israel sebagai satu umat. Bahasa Indonesia modern lebih mudah dipahami dengan bentuk jamak 'kalian', tanpa mengubah referen kolektifnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur dipecah menjadi dua kalimat untuk keterbacaan, sementara pengulangan nama Yahweh dan ketegangan antara doa Musa serta kehendak ilahi dipertahankan.
