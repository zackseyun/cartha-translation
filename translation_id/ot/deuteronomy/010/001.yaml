id: DEU.10.1
reference: Deuteronomy 10:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: בָּ/עֵ֨ת הַ/הִ֜וא אָמַ֧ר יְהוָ֣ה אֵלַ֗/י פְּסָל לְ/ךָ֞ שְׁנֵֽי לֻוחֹ֤ת אֲבָנִים֙ כָּ/רִ֣אשֹׁנִ֔ים וַ/עֲלֵ֥ה אֵלַ֖/י הָ/הָ֑רָ/ה וְ/עָשִׂ֥יתָ לְּ/ךָ֖ אֲר֥וֹן עֵֽץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/001.yaml
  text: At that time Yahweh said to me[a], ‘Carve for yourself two stone tablets like the first ones, and come up to me on the mountain[b], and make for yourself a wooden ark.’
translation:
  language: id
  text: Pada waktu itu Yahweh berkata kepadaku, “Pahatlah bagimu dua loh batu seperti yang pertama, lalu naiklah kepada-Ku ke gunung itu, dan buatlah bagimu sebuah tabut dari kayu.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּעֵת הַהִוא
  choice: Pada waktu itu
  rationale: Ungkapan waktu ini memperkenalkan latar narasi dan mempertahankan daya tunjuk הַהִוא dalam bahasa Indonesia yang alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: פְּסָל
  choice: Pahatlah
  rationale: Bentuk imperatif dari פסל menunjuk pada tindakan membentuk loh batu; 'pahatlah' tepat, jelas, dan wajar dalam bahasa Indonesia.
- source_word: לְךָ
  choice: bagimu
  rationale: Mempertahankan nuansa benefaktif/refleksif tanpa membuat kalimat terlalu berat dengan pengulangan 'untukmu sendiri'.
- source_word: שְׁנֵי לֻחֹת אֲבָנִים
  choice: dua loh batu
  rationale: '''Loh batu'' merupakan padanan Indonesia yang mapan untuk lempengan batu perjanjian dan tetap dekat dengan susunan Ibrani.'
- source_word: כָּרִאשֹׁנִים
  choice: seperti yang pertama
  rationale: Mempertahankan perbandingan dengan kedua loh terdahulu tanpa menambahkan penjelasan yang tidak dinyatakan.
- source_word: וַעֲלֵה אֵלַי הָהָרָה
  choice: lalu naiklah kepada-Ku ke gunung itu
  rationale: Mencerminkan gerak naik, arah kepada Allah, dan tujuan ke gunung sebagaimana dinyatakan oleh אֵלַי dan akhiran direktif pada הָהָרָה.
- source_word: וְעָשִׂיתָ לְּךָ אֲרוֹן עֵץ
  choice: dan buatlah bagimu sebuah tabut dari kayu
  rationale: '''Tabut'' sesuai dengan konteks wadah kudus bagi loh, sedangkan ''dari kayu'' menerjemahkan hubungan bahan secara alami.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama perjanjian יהוה secara langsung; 'Yahweh' mempertahankannya sebagai nama diri dan tidak menggantinya dengan sebuah gelar.
- issue: Makna אֲרוֹן dalam konteks perjanjian
  choice: tabut
  alternative: peti
  rationale: '''Tabut'' mempertahankan rujukan pada wadah kudus bagi loh-loh perjanjian, sedangkan ''peti'' terlalu umum untuk konteks ini.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'berkata' dipilih agar dekat dengan אָמַר tanpa menambah nuansa leksikal khusus; kapitalisasi '-Ku' mengikuti kebiasaan penulisan rujukan ilahi dalam bahasa Indonesia.
