  text: בְּ/שִׁבְעִ֣ים נֶ֔פֶשׁ יָרְד֥וּ אֲבֹתֶ֖י/ךָ מִצְרָ֑יְמָ/הּ וְ/עַתָּ֗ה שָֽׂמְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ כְּ/כוֹכְבֵ֥י הַ/שָּׁמַ֖יִם לָ/רֹֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/022.yaml
  text: Your fathers went down to Egypt with seventy persons[c][b][a], and now Yahweh your God has made you as numerous as the stars of the heavens.
translation:
  language: id
  text: Bapa-bapamu turun ke Mesir dengan tujuh puluh orang[a]. Sekarang Yahweh, Allahmu, telah membuatmu menjadi sebanyak bintang-bintang di langit[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dengan tujuh puluh jiwa”; kata Ibrani untuk “jiwa” di sini dipakai untuk menghitung orang.
    reason: lexical_alternative
  - marker: c
    text: Atau, “sebanyak bintang-bintang di langit”; maksudnya ialah jumlah yang sangat banyak.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּשִׁבְעִים נֶפֶשׁ
  choice: dengan tujuh puluh orang
  rationale: נֶפֶשׁ di sini merupakan ungkapan untuk menghitung orang, bukan rujukan khusus kepada jiwa sebagai bagian nonjasmani manusia. Preposisi בְּ diterjemahkan secara wajar sebagai 'dengan'.
- source_word: יָרְדוּ
  choice: pergi ke
  rationale: Secara harfiah ירד berarti 'turun', tetapi dalam bahasa Indonesia perjalanan menuju Mesir paling alami dinyatakan 'pergi ke'. Nuansa harfiahnya dicatat dalam catatan kaki.
- source_word: אֲבֹתֶיךָ
  choice: nenek moyangmu
  rationale: Kata Ibrani berbentuk maskulin jamak dan secara harfiah berarti 'bapa-bapamu'; dalam konteks ini yang dimaksud ialah para leluhur Israel. 'Nenek moyangmu' menyampaikan rujukannya secara alami tanpa mengubah identitas leluhur yang dimaksud.
- source_word: מִצְרָיְמָה
  choice: ke Mesir
  rationale: Akhiran arah menyatakan gerak menuju Mesir; 'ke Mesir' adalah padanan Indonesia yang langsung dan alami.
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Ungkapan ini mengontraskan jumlah kecil pada masa leluhur dengan jumlah Israel saat ini. Pemisahan menjadi kalimat baru mempertahankan hubungan itu secara alami.
- source_word: שָׂמְךָ
  choice: telah membuatmu
  rationale: Walau arti dasar שׂים ialah 'menaruh/menempatkan', dalam konteks keadaan yang dihasilkan, 'telah membuatmu' menyampaikan makna idiomatisnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk konstruksi dengan akhiran orang kedua tunggal diterjemahkan secara langsung dan lazim sebagai 'Allahmu'.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב
  choice: sebanyak bintang-bintang di langit
  rationale: Gabungan perbandingan dan לָרֹב menyatakan banyaknya jumlah. 'Sebanyak' membuat maksud numeriknya jelas sambil mempertahankan gambaran bintang di langit.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai nama perjanjian ilahi secara langsung; transliterasi 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Istilah leluhur אֲבֹתֶיךָ
  choice: nenek moyangmu, dengan catatan harfiah 'bapa-bapamu'
  alternative: bapa-bapamu
  rationale: Bentuk maskulin teks sumber diakui dalam catatan, sedangkan 'nenek moyangmu' dalam teks utama menyampaikan rujukan historisnya secara jelas dan alami dalam bahasa Indonesia.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang jelas dan bermartabat. Susunan dibagi menjadi dua kalimat agar kontras waktu terbaca alami. Semua penanda catatan kaki muncul dalam teks utama.
