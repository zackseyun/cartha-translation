translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya naratif yang ringkas dan bermartabat. Nama tempat ditransliterasikan sebagai Gudgodah dan Yotbata; bentuk terakhir mengikuti pelafalan yang lebih alami dalam bahasa Indonesia. Penanda arah pada bentuk Ibrani dinyatakan secara sintaksis dengan “ke”.
