base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/007.yaml
  text: From there they set out for Gudgodah[a], and from Gudgodah to Jotbathah, a land of streams of water.
translation:
  language: id
  text: Dari sana mereka berangkat ke Gudgodah, dan dari Gudgodah ke Yotbata, suatu daerah dengan alur-alur air.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “suatu daerah dengan sungai-sungai berair” atau “suatu daerah dengan wadi-wadi berair.” Frasa Ibrani נַחֲלֵי מָיִם menunjuk pada alur air, sungai, atau wadi yang berisi air.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם
  choice: Dari sana
  rationale: Gabungan preposisi dan kata keterangan ini menunjukkan titik keberangkatan dari tempat sebelumnya; “dari sana” alami dan mempertahankan urutan geografis.
- source_word: נָסְעוּ
  choice: mereka berangkat
  rationale: Dalam konteks perjalanan di padang gurun, נסע lazim berarti membongkar perkemahan lalu berangkat; “berangkat” menyampaikan nuansa gerak dari suatu tempat secara wajar.
- source_word: הַגֻּדְגֹּדָה
  choice: ke Gudgodah
  rationale: Akhiran -ָה pada nama tempat berfungsi sebagai penanda arah; nama tempat ditransliterasikan, sedangkan arah dinyatakan dengan “ke”.
- source_word: וּמִן
  choice: lalu dari
  rationale: Gabungan konjungsi dan preposisi melanjutkan rute perjalanan. “Lalu dari” membuat urutan perjalanan jelas tanpa mengubah isinya.
- source_word: יָטְבָתָה
  choice: ke Yotbata
  rationale: Nama tempat ditransliterasikan menurut kebiasaan bahasa Indonesia, dengan akhiran Ibrani penanda arah diungkapkan melalui “ke”.
- source_word: אֶרֶץ
  choice: suatu daerah
  rationale: Di sini אֶרֶץ menerangkan Yotbata, bukan negara politis. “Suatu daerah” lebih alami dalam bahasa Indonesia dan mempertahankan fungsi deskriptifnya.
- source_word: נַחֲלֵי מָיִם
  choice: yang dialiri sungai-sungai
  rationale: Frasa konstruksi ini menunjuk pada alur-alur air, sungai, atau wadi berair. Pilihan ini alami bagi pembaca modern dan mempertahankan gambaran daerah yang memiliki aliran air.
