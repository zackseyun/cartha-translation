  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֵלַ֔/י ק֛וּם לֵ֥ךְ לְ/מַסַּ֖ע לִ/פְנֵ֣י הָ/עָ֑ם וְ/יָבֹ֨אוּ֙ וְ/יִֽרְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁר נִשְׁבַּ֥עְתִּי לַ/אֲבֹתָ֖/ם לָ/תֵ֥ת לָ/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/011.yaml
  text: And Yahweh said to me[a], “Arise, go before the people for the journey[c][b], so that they may go in and take possession of the land that I swore to their fathers to give to them.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepadaku, “Bangunlah, berangkatlah memimpin bangsa itu dalam perjalanan mereka,[a] supaya mereka masuk dan mengambil negeri itu menjadi milik mereka,[b] negeri yang telah Kujanjikan dengan sumpah kepada leluhur mereka[c] untuk Kuberikan kepada mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “berangkatlah untuk perjalanan di depan bangsa itu.”'
    reason: lexical_alternative
  - marker: b
    text: Atau “menguasai negeri itu.”
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “bapak-bapak mereka,” yaitu para bapa leluhur mereka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: וַיֹּאמֶר
  choice: berfirman
  rationale: Dalam bahasa Indonesia Alkitabiah modern, “berfirman” merupakan padanan wajar dan bermartabat bagi ujaran langsung Allah, tanpa menambah isi pada verba tersebut.
- source_word: קוּם לֵךְ
  choice: Bangunlah, berangkatlah
  rationale: Rangkaian imperatif ini menuntut tindakan segera. “Berangkatlah” secara alami menyampaikan gerak perjalanan yang diperjelas oleh frasa berikutnya.
- source_word: לְמַסַּע לִפְנֵי הָעָם
  choice: memimpin bangsa itu dalam perjalanan mereka
  rationale: Ungkapan ini secara harfiah berkaitan dengan pergi dalam perjalanan di depan bangsa itu. Padanan yang dipilih menyampaikan fungsi Musa di depan rombongan secara alami, sedangkan bentuk spasial yang lebih harfiah dicatat dalam catatan kaki.
- source_word: וְיָבֹאוּ
  choice: supaya mereka masuk
  rationale: 'Bentuk verba sesudah perintah dipahami sebagai tujuan atau hasil: bangsa itu akan masuk ke negeri tersebut.'
- source_word: וְיִרְשׁוּ
  choice: menduduki
  rationale: ירשׁ di sini menyatakan memperoleh dan menguasai negeri. “Menduduki” mempertahankan unsur pengambilan kepemilikan secara aktif; alternatif yang lebih eksplisit dicatat dalam catatan kaki.
- source_word: הָאָרֶץ
  choice: negeri
  rationale: Dalam konteks ini, הָאָרֶץ menunjuk pada wilayah yang dijanjikan kepada Israel; “negeri” paling alami dalam bahasa Indonesia.
- source_word: נִשְׁבַּעְתִּי
  choice: telah Kujanjikan dengan sumpah
  rationale: Padanan ini mempertahankan unsur sumpah ilahi sekaligus menghasilkan susunan Indonesia yang alami dengan klausa pemberian yang mengikutinya.
- source_word: לַאֲבֹתָם
  choice: kepada leluhur mereka
  rationale: Dalam konteks perjanjian, bentuk jamak “bapak-bapak mereka” menunjuk pada para leluhur Israel. “Leluhur” alami dan tepat dalam bahasa Indonesia; bentuk harfiahnya dicatat.
- source_word: לָתֵת לָהֶם
  choice: untuk Kuberikan kepada mereka
  rationale: Subjek ilahi dan penerima pemberian dipertahankan secara eksplisit, sesuai dengan konstruksi infinitif Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Transliterasi “Yahweh” mempertahankan nama ilahi yang terdapat dalam teks sumber tanpa menggantinya dengan sebuah gelar.
- issue: Makna לִפְנֵי הָעָם dalam kaitannya dengan kepemimpinan Musa
  choice: memimpin bangsa itu dalam perjalanan mereka
  alternative: berjalanlah di depan bangsa itu untuk perjalanan
  rationale: Teks memungkinkan nuansa spasial dan kepemimpinan sekaligus. Teks utama memakai ungkapan Indonesia yang alami, sementara catatan kaki mempertahankan bentuk spasial yang lebih harfiah.
- issue: Penerjemahan לַאֲבֹתָם
  choice: leluhur mereka
  alternative: bapak-bapak mereka
  rationale: Rujukannya secara historis adalah para bapa leluhur Israel. “Leluhur” tidak mengubah identitas rujukan, dan bentuk maskulin harfiah tetap diberitahukan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Imperatif dibuat tegas tetapi tidak arkais. Pronomina ilahi ditulis dengan huruf kapital mengikuti kebiasaan umum penerbitan Alkitab berbahasa Indonesia. Semua catatan kaki ditempatkan tepat sesudah ungkapan yang dijelaskan.
