  text: So circumcise the foreskin of your heart[c][b][a], and do not stiffen your neck any longer.
translation:
  language: id
  text: Karena itu, sunatlah kulit khatan hatimu[a][b], dan jangan lagi menegarkan tengkukmu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan sunatlah kulit khatan hatimu.” Kata penghubung Ibrani dapat dipahami sebagai penghubung biasa, meskipun konteks juga mendukung arti kesimpulan, “Karena itu.”
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani mempertahankan metafora harfiah “kulit khatan hatimu,” yaitu gambaran tentang menyingkirkan penolakan batin terhadap Allah.
    reason: cultural_note
  - marker: c
    text: Atau, “jangan lagi menjadikan tengkukmu keras” atau “jangan lagi tegar tengkuk.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְתֶּם
  choice: Karena itu, sunatlah
  rationale: Bentuk perfektum Qal orang kedua jamak dengan waw berfungsi sebagai desakan dalam konteks ini. “Karena itu” menyampaikan hubungan kesimpulan dengan ayat-ayat sebelumnya, sedangkan bentuk perintah “sunatlah” wajar dalam bahasa Indonesia.
- source_word: עָרְלַת לְבַבְכֶם
  choice: kulit khatan hatimu
  rationale: Mempertahankan konstruksi konkret dan metafora perjanjian dalam bahasa Ibrani, tanpa mereduksinya menjadi parafrasa seperti “hapuslah kedegilan hatimu”.
- source_word: לְבַבְכֶם
  choice: hatimu
  rationale: “Hati” merupakan padanan lazim bagi לֵבָב dan dalam konteks Ibrani mencakup kehendak, pikiran, serta batin manusia.
- source_word: וְעָרְפְּכֶם
  choice: tengkukmu
  rationale: עֹרֶף menunjuk pada tengkuk atau bagian belakang leher. “Tengkuk” mempertahankan gambaran tubuh dan sesuai dengan ungkapan Indonesia tentang sikap keras kepala.
- source_word: לֹא תַקְשׁוּ עוֹד
  choice: jangan lagi keraskan
  rationale: Hifil קשׁה berarti membuat keras atau kaku. Bersama objek “tengkuk,” susunan ini mempertahankan idiom Ibrani; עוֹד secara alami diterjemahkan “lagi” dalam larangan.
theological_decisions:
- issue: Bahasa metaforis perjanjian tentang sunat batin
  choice: 'Mempertahankan metafora secara eksplisit: “sunatlah kulit khatan hatimu”'
  alternative: “Sucikanlah hatimu” atau “buanglah kedegilan hatimu”
  rationale: Teks memakai gambaran sunat sebagai tanda perjanjian untuk menyerukan tanggapan batin. Metafora dipertahankan agar hubungan antara tanda lahiriah dan ketaatan batin tidak disederhanakan atau diberi penafsiran doktrinal yang terlalu sempit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Metafora Ibrani dipertahankan meskipun tidak lazim dalam percakapan sehari-hari karena penting bagi citra perjanjian. Bentuk tunggal “-mu” dipakai secara kolektif untuk sapaan orang kedua jamak, sesuai kelaziman bahasa Indonesia.
