  text: הֵ֚ן לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ הַ/שָּׁמַ֖יִם וּ/שְׁמֵ֣י הַ/שָּׁמָ֑יִם הָ/אָ֖רֶץ וְ/כָל אֲשֶׁר בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/014.yaml
  text: Behold[a], to Yahweh your God belong the heavens, even the highest heavens, the earth, and all that is in it.
translation:
  language: id
  text: Sesungguhnya, langit, bahkan langit yang tertinggi,[a] bumi, dan segala yang ada di dalamnya adalah milik Yahweh, Allahmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “langit dan langit dari langit.”
    reason: Ungkapan Ibrani yang lebih harfiah dicatat untuk memperlihatkan konstruksi intensif yang mendasari terjemahan “langit yang tertinggi.”
lexical_decisions:
- source_word: הֵן
  choice: Sesungguhnya
  rationale: Partikel wacana ini menarik perhatian sekaligus memberi penegasan. “Sesungguhnya” mempertahankan nada khidmat dan deklaratif dalam bahasa Indonesia modern.
- source_word: לַיהוָה
  choice: milik Yahweh
  rationale: Prefiks ל menyatakan hubungan kepemilikan; bentuk “milik Yahweh” mengungkapkannya secara alami tanpa menambahkan kata kerja yang tidak dinyatakan.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk dengan sufiks orang kedua maskulin tunggal berarti “Allahmu” dan mempertahankan sapaan perjanjian kepada Israel.
- source_word: הַשָּׁמַיִם
  choice: langit
  rationale: Dalam bahasa Indonesia, “langit” secara alami dapat mencakup ranah surgawi yang luas; bentuk “langit-langit” akan menimbulkan arti yang keliru.
- source_word: וּשְׁמֵי הַשָּׁמָיִם
  choice: bahkan langit yang tertinggi
  rationale: Ungkapan harfiah “langit dari segala langit” berfungsi sebagai intensifikasi atau superlatif. “Bahkan langit yang tertinggi” menyampaikan maknanya dengan jelas, sedangkan bentuk harfiahnya dipertahankan dalam catatan kaki.
- source_word: הָאָרֶץ
  choice: bumi
  rationale: Paralel dengan langit dan diikuti segala yang ada di dalamnya menunjukkan cakupan kosmis, bukan wilayah tanah tertentu.
- source_word: וְכָל אֲשֶׁר בָּהּ
  choice: dan segala yang ada di dalamnya
  rationale: Terjemahan ini mengikuti klausa relatif Ibrani dan mempertahankan cakupan menyeluruh dari isi bumi.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks menyebut nama perjanjian יְהוָה secara langsung. “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan “milik Yahweh” mempertahankan penekanan awal pada kepemilikan ilahi; koma sebelum penanda catatan kaki dihindari agar penanda melekat pada frasa yang dijelaskan.
