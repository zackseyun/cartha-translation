id: DEU.10.18
reference: Deuteronomy 10:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עֹשֶׂ֛ה מִשְׁפַּ֥ט יָת֖וֹם וְ/אַלְמָנָ֑ה וְ/אֹהֵ֣ב גֵּ֔ר לָ֥/תֶת ל֖/וֹ לֶ֥חֶם וְ/שִׂמְלָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/018.yaml
  text: He executes justice for the fatherless and the widow[a], and loves the sojourner[c][b], giving him food and clothing.
translation:
  language: id
  text: Dia menegakkan keadilan bagi anak yatim[a] dan janda, serta mengasihi orang asing yang menetap[b] dengan memberinya makanan[c] dan pakaian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani ini menunjuk kepada orang yang kehilangan ayah.
    reason: lexical_alternative
  - marker: b
    text: Atau “pendatang yang menetap”. Yang dimaksud ialah orang bukan pribumi yang tinggal di tengah masyarakat Israel, bukan sekadar orang yang lewat.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “roti”. Di sini kata itu mengacu pada makanan atau kebutuhan pangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹשֶׂה מִשְׁפַּט
  choice: menegakkan keadilan
  rationale: Gabungan kata ini berarti melaksanakan atau mewujudkan keadilan bagi pihak yang rentan, bukan sekadar melakukan sesuatu atau menjatuhkan putusan.
- source_word: יָתוֹם
  choice: anak yatim
  rationale: Dalam pemakaian Ibrani, kata ini menunjuk kepada orang yang kehilangan ayah. 'Anak yatim' adalah padanan Indonesia yang alami dan mempertahankan nuansa sosial-hukumnya.
- source_word: אַלְמָנָה
  choice: janda
  rationale: Padanan langsung dan lazim untuk golongan rentan yang disebutkan dalam teks.
- source_word: אֹהֵב
  choice: mengasihi
  rationale: Menerjemahkan secara langsung sikap aktif Allah terhadap orang asing yang tinggal di tengah umat Israel.
- source_word: גֵּר
  choice: orang asing yang menetap
  rationale: Kata ini menunjuk kepada orang bukan pribumi yang tinggal di tengah masyarakat Israel, bukan sekadar musafir atau orang yang lewat.
- source_word: לָתֶת לוֹ
  choice: dengan memberinya
  rationale: Infinitif ini menjelaskan wujud konkret dari kasih tersebut. Bentuk tunggal 'memberinya' mengikuti kata ganti tunggal dalam bahasa Ibrani.
- source_word: לֶחֶם
  choice: makanan
  rationale: Secara harfiah berarti 'roti', tetapi dalam pasangan dengan pakaian kata ini mewakili kebutuhan pangan secara umum.
- source_word: שִׂמְלָה
  choice: pakaian
  rationale: Padanan umum dan alami bagi pakaian atau kain sandang sebagai kebutuhan dasar.
theological_decisions:
- issue: Kepedulian Allah terhadap golongan rentan
  choice: Ayat diterjemahkan sebagai tindakan Allah yang menegakkan keadilan sekaligus menunjukkan kasih melalui pemenuhan kebutuhan nyata.
  alternative: Menonjolkan hanya pembelaan hukum atau hanya rasa belas kasih.
  rationale: 'Teks Ibrani mempertahankan kedua sisi itu: tindakan yudisial dalam ''menegakkan keadilan'' dan kasih yang diwujudkan dengan memberi makanan serta pakaian.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Menegakkan keadilan' mempertahankan daya yudisial ungkapan Ibrani, sedangkan 'orang asing yang menetap' menjelaskan status sosial גֵּר secara lebih tepat daripada sekadar 'orang asing' atau 'pendatang'.
