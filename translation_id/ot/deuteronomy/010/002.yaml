  text: וְ/אֶכְתֹּב֙ עַל הַ/לֻּחֹ֔ת אֶת הַ/דְּבָרִ֔ים אֲשֶׁ֥ר הָי֛וּ עַל הַ/לֻּחֹ֥ת הָ/רִאשֹׁנִ֖ים אֲשֶׁ֣ר שִׁבַּ֑רְתָּ וְ/שַׂמְתָּ֖/ם בָּ/אָרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/010/002.yaml
  text: And I will write on the tablets the words that were on the first tablets[a], which you broke, and you shall put them in the ark.
translation:
  language: id
  text: Aku akan menuliskan pada loh-loh itu kata-kata[a] yang ada pada loh-loh pertama, yang telah kaupecahkan; kemudian engkau harus menaruh loh-loh itu di dalam tabut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “perintah-perintah”; Ibrani: “kata-kata.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶכְתֹּב
  choice: Aku akan menuliskan
  rationale: Bentuk Qal imperfek orang pertama tunggal dengan waw menyatakan tindakan yang akan dilakukan TUHAN; 'menuliskan' secara alami menunjukkan tindakan menulis pada permukaan loh.
- source_word: הַלֻּחֹת
  choice: loh-loh itu
  rationale: לוח dalam konteks ini berarti loh atau lempeng untuk tulisan. Unsur 'batu' tidak ditambahkan karena tidak disebut ulang dalam ayat ini, meski jelas dari konteks ayat 1.
- source_word: הַדְּבָרִים
  choice: perkataan-perkataan
  rationale: דבר secara harfiah berarti 'perkataan' dan di sini menunjuk pada isi perjanjian yang dituliskan. Pilihan ini mempertahankan keluasan istilah Ibrani tanpa langsung menafsirkannya sebagai 'perintah-perintah'.
- source_word: אֲשֶׁר הָיוּ
  choice: yang ada
  rationale: Klausa relatif dengan היה menerangkan bahwa perkataan-perkataan tersebut terdapat pada loh pertama; 'yang ada' lebih wajar dalam bahasa Indonesia daripada 'yang dahulu berada'.
- source_word: הָרִאשֹׁנִים
  choice: yang pertama
  rationale: Kata sifat ini membedakan perangkat loh terdahulu dari loh penggantinya; 'yang pertama' jelas dan idiomatis.
- source_word: שִׁבַּרְתָּ
  choice: yang telah kaupecahkan
  rationale: Bentuk Piel perfekt orang kedua maskulin tunggal dari שבר menunjukkan tindakan memecahkan loh yang sudah terjadi. 'Kaupecahkan' tepat tanpa melebihkan nuansa menjadi 'kauremukkan'.
- source_word: וְשַׂמְתָּם
  choice: lalu engkau harus menaruh loh-loh itu
  rationale: Bentuk perfekt dengan waw dalam rangkaian instruksi menyampaikan kewajiban berikutnya. Objek pronominal diperjelas sebagai 'loh-loh itu' agar rujukan fisiknya alami dan tidak kabur dalam bahasa Indonesia.
- source_word: בָּאָרוֹן
  choice: di dalam tabut
  rationale: ארון di sini adalah peti suci yang diperintahkan dalam konteks dekat. 'Tabut' merupakan padanan Indonesia yang mapan; preposisi ב־ secara langsung mendukung 'di dalam'.
theological_decisions:
- issue: Rujukan sufiks pronominal dalam וְשַׂמְתָּם
  choice: Sufiks tersebut dipahami merujuk pada loh-loh.
  alternative: Sufiks itu secara gramatikal dapat dipahami merujuk pada perkataan-perkataan atau perintah-perintah.
  rationale: Baik 'loh-loh' maupun 'perkataan-perkataan' berjenis maskulin jamak dalam bahasa Ibrani, tetapi tindakan menaruh benda di dalam tabut dan konteks Ulangan 10:1-5 paling kuat menunjuk kepada loh-loh. Karena bahasa Indonesia memerlukan rujukan yang lebih jelas, nomina tersebut diulang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina ilahi 'Aku' dipertahankan dari tuturan langsung. Bentuk 'kaupecahkan' ringkas dan alami, sedangkan 'engkau harus' menyampaikan daya instruktif klausa akhir. Pengulangan 'loh-loh itu' menghindari ambiguitas pronominal yang terasa janggal dalam bahasa Indonesia.
