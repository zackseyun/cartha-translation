base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/021.yaml
  text: Yahweh will make the plague cling to you until he has wiped you out from the land that you are entering to possess[a][b].
translation:
  language: id
  text: Yahweh akan membuat wabah itu melekat padamu sampai dia melenyapkanmu dari negeri yang kaumasuki untuk memilikinya[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sampar.” Istilah Ibrani ini dapat menunjuk pada wabah penyakit mematikan yang datang sebagai hukuman.
    reason: lexical_alternative
  - marker: b
    text: Atau, “sampai wabah itu melenyapkanmu,” jika “wabah itu” dipahami sebagai subjek tersirat dalam anak kalimat ini.
    reason: alternative_reading
lexical_decisions:
- source_word: יַדְבֵּק
  choice: akan membuat ... melekat
  rationale: Bentuk Hifil dari דבק bersifat kausatif, yaitu “membuat melekat.” Ungkapan ini mempertahankan gambaran hidup tentang wabah yang terus menimpa dan tidak melepaskan korbannya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh,” bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: בְּךָ
  choice: padamu
  rationale: Dengan דבק, preposisi ב menandai keterikatan erat; “melekat padamu” alami dalam bahasa Indonesia dan sesuai dengan gambaran sumber.
- source_word: הַדָּבֶר
  choice: wabah
  rationale: Dalam konteks kutuk perjanjian, דֶּבֶר menunjuk pada penyakit menular mematikan. “Wabah” jelas dan mudah dipahami dalam bahasa Indonesia modern, tanpa mempersempitnya pada satu penyakit tertentu.
- source_word: עַד כַּלֹּתוֹ אֹתְךָ
  choice: sampai dia melenyapkanmu
  rationale: כלה dalam konstruksi ini berarti membawa kepada kesudahan atau menghabisi. “Melenyapkanmu” menyampaikan akibat menyeluruh dengan ragam yang wajar dan bermartabat. Subjek tersirat dipahami sebagai Yahweh, sesuai subjek klausa utama, sementara kemungkinan bahwa wabah adalah subjek dicatat dalam catatan kaki.
- source_word: מֵעַל הָאֲדָמָה
  choice: dari negeri
  rationale: Walaupun אֲדָמָה dapat berarti tanah atau permukaan tanah, konteks masuk dan menduduki wilayah menjadikan “negeri” padanan yang paling sesuai.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה
  choice: yang kaumasuki
  rationale: בוא dengan שמה secara idiomatis berarti masuk ke sana. “Yang kaumasuki” ringkas, alami, dan mempertahankan arah gerak menuju negeri itu.
- source_word: לְרִשְׁתָּהּ
  choice: untuk kaududuki
  rationale: ירש dalam Ulangan kerap berarti mengambil dan mempertahankan kepemilikan atas negeri. “Menduduki” cocok dengan konteks wilayah dan lebih alami daripada ungkapan yang terlalu panjang.
theological_decisions:
- issue: Makna istilah penyakit dalam kutuk perjanjian דֶּבֶר
  choice: wabah
  alternative: sampar; penyakit menular
  rationale: “Wabah” menyampaikan penyakit menular yang berat sebagai sarana penghukuman dalam konteks ini, tetapi tidak menentukan jenis penyakit lebih jauh daripada teks Ibrani.
- issue: Subjek כַּלֹּתוֹ dalam hubungannya dengan klausa sebelumnya
  choice: 'Yahweh sebagai subjek tersirat: “sampai dia melenyapkanmu”'
  alternative: 'Wabah sebagai subjek: “sampai wabah itu melenyapkanmu”'
  rationale: Subjek klausa utama, Yahweh, paling alami diteruskan sebagai subjek tindakan berikutnya. Namun, bentuk Ibrani juga memungkinkan wabah dipahami sebagai pelaku langsung; karena itu ketegangan tersebut dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk terikat “kaumasuki” dan “kaududuki” mengikuti ejaan baku serta menjaga kalimat tetap ringkas. Pronomina “dia” tidak dikapitalisasi sesuai ejaan umum modern; rujukannya kepada Yahweh ditentukan oleh konteks, bukan oleh kapitalisasi teologis.
