- from: Yahweh akan membuat wabah melekat padamu sampai dia melenyapkanmu dari negeri yang kaumasuki untuk kaududuki.[a][b]
  to: Yahweh akan membuat wabah itu melekat padamu sampai dia melenyapkanmu dari negeri yang kaumasuki untuk memilikinya[a][b].
