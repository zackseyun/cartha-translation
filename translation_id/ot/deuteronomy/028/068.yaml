base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/068.yaml
  text: And Yahweh will bring you back to Egypt in ships[a], by the way of which I said to you, ‘You shall never see it again.’ And there you will offer yourselves for sale to your enemies as male servants and female servants, but there will be no buyer.
translation:
  language: id
  text: Yahweh akan membawa kamu kembali ke Mesir dengan kapal-kapal, melalui jalan yang pernah kukatakan kepadamu, “Kamu tidak akan pernah melihatnya lagi.” Di sana kamu akan menawarkan diri untuk dijual[a] kepada musuh-musuhmu sebagai budak laki-laki dan perempuan, tetapi tidak akan ada yang membeli.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “di sana kamu akan dijual kepada musuh-musuhmu sebagai budak laki-laki dan perempuan.” Kata kerja Ibraninya dapat dipahami secara refleksif (“menjual diri”) atau secara lebih umum sebagai masuk ke dalam perbudakan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהֱשִׁיבְךָ
  choice: akan membawa kamu kembali
  rationale: 'Bentuk Hifil dari שׁוב bersifat kausatif: Yahweh menyebabkan umat itu kembali. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nuansa kausatif.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan secara langsung sebagai Yahweh, bukan diganti dengan gelar.
- source_word: בָּאֳנִיּוֹת
  choice: dengan kapal-kapal
  rationale: Preposisi ב menyatakan sarana perjalanan; bentuk jamak kapal dipertahankan.
- source_word: בַּדֶּרֶךְ
  choice: melalui jalan
  rationale: דֶּרֶךְ di sini menunjuk pada jalan atau rute kembalinya mereka; pilihan ini mempertahankan gambaran rute tanpa mempersempitnya secara berlebihan.
- source_word: לֹא תֹסִיף עוֹד לִרְאֹתָהּ
  choice: Kamu tidak akan pernah melihatnya lagi
  rationale: Gabungan יסף dan עוד menegaskan bahwa tindakan itu tidak akan terulang; 'tidak akan pernah ... lagi' menyampaikan daya ungkap idiom tersebut secara alami.
- source_word: וְהִתְמַכַּרְתֶּם
  choice: kamu akan menawarkan diri untuk dijual
  rationale: Bentuk Hitpael dapat dipahami secara refleksif atau medial. Pilihan ini mempertahankan unsur keterlibatan subjek sekaligus tidak menyiratkan bahwa penjualan berhasil, sesuai klausa berikutnya bahwa tidak ada pembeli.
- source_word: לַעֲבָדִים וְלִשְׁפָחוֹת
  choice: sebagai budak laki-laki dan perempuan
  rationale: Pasangan nomina Ibrani membedakan budak laki-laki dan perempuan. Terjemahan ini jelas, mutakhir, dan tidak memperhalus kenyataan perbudakan.
- source_word: וְאֵין קֹנֶה
  choice: tetapi tidak akan ada yang membeli
  rationale: Secara harfiah berarti 'dan tidak ada pembeli'. Bentuk verbal ini lebih alami dalam bahasa Indonesia serta mempertahankan ironi bahwa bahkan tawaran menjadi budak tidak memperoleh pembeli.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama pribadi Allah. Bentuk 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Pelaku ujaran dalam אֲשֶׁר אָמַרְתִּי לְךָ
  choice: aku katakan kepadamu
  alternative: Aku katakan kepadamu, dengan kapitalisasi sebagai ujaran ilahi
  rationale: Teks Ibrani hanya memakai kata ganti orang pertama dan dalam wacana Ulangan dapat dibaca sebagai suara Musa yang menyampaikan firman. Huruf kecil mempertahankan ketegangan naratif dan tidak memutuskan identitas penutur secara tipografis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti jamak 'kamu' dipakai karena bentuk tunggal Ibrani mewakili Israel secara kolektif dan konteks berikutnya beralih ke bentuk jamak. Istilah 'budak' dipertahankan agar kerasnya hukuman dalam teks tidak diperhalus.
