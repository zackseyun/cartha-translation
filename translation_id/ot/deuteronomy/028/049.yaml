  text: יִשָּׂ֣א יְהוָה֩ עָלֶ֨י/ךָ גּ֤וֹי מֵ/רָחוֹק֙ מִ/קְצֵ֣ה הָ/אָ֔רֶץ כַּ/אֲשֶׁ֥ר יִדְאֶ֖ה הַ/נָּ֑שֶׁר גּ֕וֹי אֲשֶׁ֥ר לֹא תִשְׁמַ֖ע לְשֹׁנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/049.yaml
  text: Yahweh will raise up against you a nation from far away[a], from the end of the earth[b], as the eagle swoops down—a nation whose language you will not understand.
translation:
  language: id
  text: Yahweh akan mendatangkan suatu bangsa dari jauh melawanmu, dari ujung bumi, seperti rajawali yang terbang melesat[a]—suatu bangsa yang bahasanya tidak kaumengerti.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang menukik” atau “yang melesat”. Kata kerja Ibrani menekankan gerakan yang cepat.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “yang lidahnya tidak kaudengar”; maksudnya, yang bahasanya tidak kaumengerti.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא ... עָלֶיךָ
  choice: akan mendatangkan ... untuk menyerangmu
  rationale: Secara harfiah נשׂא berarti ‘mengangkat’ atau ‘membawa’, tetapi bersama עַל dalam konteks kutuk berupa serbuan bangsa asing, ungkapan ini menyatakan bahwa Yahweh menyebabkan suatu bangsa datang melawan Israel. Pilihan ini mempertahankan tindakan aktif Allah sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks Ibrani dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: גּוֹי
  choice: suatu bangsa
  rationale: Dalam konteks ini גוי menunjuk kepada kesatuan bangsa asing yang menjadi penyerbu, bukan sekadar kelompok etnis.
- source_word: מֵרָחוֹק
  choice: dari jauh
  rationale: Ungkapan ringkas dan alami ini mempertahankan penekanan pada jauhnya asal bangsa tersebut.
- source_word: מִקְצֵה הָאָרֶץ
  choice: dari ujung bumi
  rationale: Terjemahan ini mempertahankan gambaran Ibrani tentang tempat yang amat jauh. ‘Bumi’ lebih sesuai daripada ‘negeri’ karena frasa tersebut menekankan asal dari kawasan dunia yang jauh.
- source_word: כַּאֲשֶׁר יִדְאֶה הַנָּשֶׁר
  choice: seperti rajawali yang menukik
  rationale: Kata kerja ידאה menggambarkan gerak terbang yang cepat; ‘menukik’ menyampaikan kecepatan dan ancaman dalam perumpamaan. נשר dapat merujuk pada rajawali atau burung nasar, tetapi ‘rajawali’ merupakan padanan yang wajar dalam konteks ini.
- source_word: לֹא תִשְׁמַע לְשֹׁנוֹ
  choice: yang bahasanya tidak kaumengerti
  rationale: Secara harfiah frasa ini berbunyi ‘yang lidahnya tidak kaudengar’, tetapi שמע bersama ‘lidah’ di sini bermakna memahami bahasa atau tuturannya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri Allah. Bentuk ‘Yahweh’ mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar atau memakai vokalisasi tradisional yang lebih belakangan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang lugas dan bermartabat. Bentuk ‘kaumengerti’ menjaga sapaan orang kedua tunggal dalam teks Ibrani. Tanda pisah mempertahankan aposisi yang menjelaskan bangsa penyerbu.
