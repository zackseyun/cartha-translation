revisions:
- from: Yahweh akan mendatangkan suatu bangsa dari jauh untuk menyerangmu, dari ujung bumi, seperti rajawali yang menukik[a]—suatu bangsa yang bahasanya tidak kaumengerti.[b]
  to: Yahweh akan mendatangkan suatu bangsa dari jauh melawanmu, dari ujung bumi, seperti rajawali yang terbang melesat[a]—suatu bangsa yang bahasanya tidak kaumengerti.[b]
  rationale: Revisi mengganti ungkapan bertujuan “untuk menyerangmu” dengan “melawanmu” agar lebih dekat dengan konstruksi Ibrani, dan memakai “terbang melesat” untuk tidak membatasi gerak rajawali pada arah menukik. Jangkar catatan kaki tetap ditempatkan pada unsur yang dijelaskannya.
