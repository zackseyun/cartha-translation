  - severity: low
    issue: “rajawali yang menukik”
    rationale: ידאה dapat mencakup gerak cepat atau melesat, tetapi tidak harus secara khusus menukik ke bawah. “Rajawali yang terbang melesat” mempertahankan citra gerak cepat dengan lebih sedikit spesifikasi tambahan.
