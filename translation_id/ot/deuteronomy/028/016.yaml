  text: Cursed are you in the city[a], and cursed are you in the field.
translation:
  language: id
  text: Engkau terkutuk di kota, dan engkau terkutuk di ladang.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Engkau berada di bawah kutuk.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: terkutuklah
  rationale: Partisipel pasif ini berfungsi sebagai predikat dalam rumusan sanksi perjanjian. “Terkutuklah” menyampaikan pernyataan kutuk yang ringkas, tegas, dan lazim dalam bahasa Indonesia Alkitabiah tanpa mengubahnya menjadi sekadar ramalan masa depan.
- source_word: אַתָּה
  choice: engkau
  rationale: Pronomina orang kedua tunggal maskulin dinyatakan secara eksplisit. “Engkau” mempertahankan sapaan tunggal yang langsung dan sesuai dengan ragam bahasa yang bermartabat.
- source_word: בָּעִיר
  choice: di kota
  rationale: Preposisi ב menyatakan lokasi, sedangkan עִיר berarti kota. Pilihan ini mempertahankan lingkungan perkotaan sebagai pasangan kontras bagi ladang.
- source_word: וְ
  choice: dan
  rationale: Konjungsi sederhana ini menghubungkan kedua klausa sejajar dan mempertahankan daya kumulatif rumusan kutuk.
- source_word: בַּשָּׂדֶה
  choice: di ladang
  rationale: שָׂדֶה menunjuk pada ladang atau lahan terbuka untuk kegiatan agraris. “Di ladang” merupakan padanan konkret dan alami bagi “di kota” serta mempertahankan cakupan menyeluruh kedua ranah kehidupan.
theological_decisions:
- issue: Rumusan kutuk perjanjian dan cakupannya
  choice: Mempertahankan pernyataan langsung “Terkutuklah engkau” dalam kedua klausa.
  alternative: “Engkau akan terkutuk” atau “Semoga engkau terkutuk.”
  rationale: Bahasa Ibrani memakai konstruksi predikatif tanpa verba dengan pengulangan partisipel dan pronomina, bukan bentuk futur atau ungkapan harapan. Bentuk Indonesia ini mempertahankan kekuatan deklaratif dan yuridis dari sanksi perjanjian.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Bentuk “terkutuklah” mempertahankan susunan predikat yang didahulukan dan penekanan rumusan Ibrani; pengulangan penuh menjaga kesejajaran kedua klausa.
