  naturalness: Terjemahan yang direvisi tetap baku, modern, dan wajar. “Mengikat perjanjian” adalah idiom Indonesia yang alami untuk כרת ברית dan memungkinkan catatan harfiah yang jelas.
  terminology: “Yahweh,” “bani Israel,” “tanah Moab,” dan “Horeb” dipertahankan. “Kata-kata perjanjian” lebih dekat pada diksi sumber dan tetap dapat berfungsi sebagai rumusan penutup/penanda bagian.
