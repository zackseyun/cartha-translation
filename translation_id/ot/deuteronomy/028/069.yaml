  text: אֵלֶּה֩ דִבְרֵ֨י הַ/בְּרִ֜ית אֲֽשֶׁר צִוָּ֧ה יְהוָ֣ה אֶת מֹשֶׁ֗ה לִ/כְרֹ֛ת אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בְּ/אֶ֣רֶץ מוֹאָ֑ב מִ/לְּ/בַ֣ד הַ/בְּרִ֔ית אֲשֶׁר כָּרַ֥ת אִתָּ֖/ם בְּ/חֹרֵֽב־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/069.yaml
  text: These are the words of the covenant that Yahweh commanded Moses to make with the sons of Israel in the land of Moab[a], besides the covenant that he made with them at Horeb.
translation:
  language: id
  text: Inilah kata-kata perjanjian yang Yahweh perintahkan kepada Musa untuk diikat[a] dengan bani Israel di tanah Moab, selain perjanjian yang Dia ikat dengan mereka di Horeb.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memotong perjanjian”; ungkapan yang sama dipakai juga pada bagian akhir ayat ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה דִבְרֵי הַבְּרִית
  choice: Inilah ketentuan-ketentuan perjanjian
  rationale: דִבְרֵי secara harfiah berarti ‘perkataan-perkataan’ atau ‘hal-hal’, tetapi dalam konteks hukum perjanjian menunjuk pada isi atau ketentuannya. ‘Ketentuan-ketentuan’ alami dalam bahasa Indonesia dan mempertahankan nuansa legal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: צִוָּה
  choice: perintahkan
  rationale: Bentuk verba ini menyatakan perintah yang tegas dari Yahweh kepada Musa.
- source_word: לִכְרֹת ... הַבְּרִית / כָּרַת
  choice: mengadakan perjanjian
  rationale: Secara harfiah berarti ‘memotong perjanjian’, tetapi ‘mengadakan perjanjian’ menyampaikan idiom Ibrani secara wajar dalam bahasa Indonesia; bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  rationale: Ungkapan Indonesia ini mempertahankan bentuk kolektif ‘anak-anak/keturunan Israel’ sekaligus merujuk secara alami kepada umat Israel.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: di tanah Moab
  rationale: Mempertahankan penyebutan geografis lengkap dalam teks sumber.
- source_word: מִלְּבַד
  choice: selain
  rationale: Menandai bahwa perjanjian di Moab dibedakan dari perjanjian sebelumnya di Horeb, tanpa menentukan lebih jauh hubungan teologis keduanya.
- source_word: בְּחֹרֵב
  choice: di Horeb
  rationale: Nama tempat Horeb dipertahankan dan tidak diselaraskan menjadi Sinai.
theological_decisions:
- issue: Hubungan antara perjanjian di Moab dan perjanjian di Horeb
  choice: selain perjanjian
  alternative: di samping perjanjian / sebagai tambahan pada perjanjian
  rationale: מִלְּבַד membedakan kedua perjanjian, tetapi ayat ini sendiri tidak menjelaskan apakah perjanjian di Moab merupakan pembaruan, tambahan, atau perjanjian yang sepenuhnya terpisah. Terjemahan tidak menyelesaikan ketegangan itu.
- issue: Penyebutan kelompok בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: orang Israel / umat Israel / anak-anak Israel
  rationale: ‘Bani Israel’ mempertahankan bentuk keturunan kolektif dari bahasa Ibrani tanpa membatasi rujukannya hanya kepada laki-laki.
- issue: Nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN / Yehuwa
  rationale: Nama pribadi dalam teks sumber dipertahankan dalam bentuk transliterasi yang lazim.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Ketentuan-ketentuan perjanjian’ dipilih daripada ‘perkataan-perkataan perjanjian’ agar alami bagi pembaca umum sambil mempertahankan konteks hukum. Kapitalisasi ‘Dia’ dipakai sebagai rujukan jelas kepada Yahweh.
