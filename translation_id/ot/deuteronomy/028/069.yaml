revisions:
- from: Inilah ketentuan-ketentuan perjanjian yang Yahweh perintahkan kepada Musa untuk diadakan[a] dengan bani Israel di tanah Moab, selain perjanjian yang telah Dia adakan dengan mereka di Horeb.
  to: Inilah kata-kata perjanjian yang Yahweh perintahkan kepada Musa untuk diikat[a] dengan bani Israel di tanah Moab, selain perjanjian yang Dia ikat dengan mereka di Horeb.
  rationale: Revisi mengganti “ketentuan-ketentuan” dengan “kata-kata” untuk mempertahankan cakupan leksikal דִבְרֵי tanpa menafsirkan isinya secara sempit sebagai ketentuan hukum. “Mengikat perjanjian” merupakan idiom Indonesia yang alami bagi כרת ברית; bentuk harfiahnya dipertahankan dalam catatan kaki. Kata “telah” dihapus agar tidak menambahkan penandaan aspek yang tidak perlu.
