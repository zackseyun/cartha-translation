base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/054.yaml
  text: The man who is tender among you and very delicate—his eye will be hostile toward his brother[a], toward the wife of his bosom[b], and toward the rest of his children whom he has left.
translation:
  language: id
  text: Laki-laki di antara kamu yang lembut dan sangat dimanjakan akan memandang saudaranya dengan permusuhan[a], terhadap istrinya yang dipeluknya, dan terhadap anak-anaknya yang masih ia sisakan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “matanya akan menjadi jahat terhadap”; ini adalah idiom Ibrani yang dapat menyatakan permusuhan, kekikiran, atau keengganan untuk berbagi.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “yang masih tinggal baginya.” Kata kerjanya dapat berarti “menyisakan” atau “membiarkan tetap ada.”
    reason: alternative_reading
lexical_decisions:
- source_word: הָאִישׁ
  choice: Laki-laki
  rationale: Bentuknya tunggal maskulin dan secara khusus menunjuk kepada seorang laki-laki, berpasangan dengan gambaran tentang perempuan pada ayat berikutnya.
- source_word: הָרַךְ
  choice: yang lemah lembut
  rationale: Kata sifat ini menyatakan kelembutan atau keadaan tidak terbiasa menghadapi kesukaran; padanan ini mempertahankan kontras dengan kekejaman yang muncul selama pengepungan.
- source_word: וְהֶעָנֹג מְאֹד
  choice: dan sangat terbiasa hidup nyaman
  rationale: Ungkapan ini menggambarkan kehidupan yang halus, nyaman, dan tidak mengenal kesukaran. Terjemahan ini lebih alami dalam bahasa Indonesia daripada padanan harfiah yang dapat disalahpahami sebagai sifat sopan.
- source_word: תֵּרַע עֵינוֹ
  choice: akan memandang ... dengan dengki
  rationale: Idiom harfiahnya ialah 'matanya akan menjadi jahat terhadap'. Dalam konteks ini, ungkapan tersebut menyiratkan sikap bermusuhan sekaligus keengganan untuk berbagi; 'memandang dengan dengki' mempertahankan citra pandangan dan makna idiomatisnya.
- source_word: בְאָחִיו
  choice: saudaranya
  rationale: Makna biasa אָח adalah saudara; konteks tidak mengharuskan perluasan menjadi kerabat.
- source_word: אֵשֶׁת חֵיקוֹ
  choice: istri yang dipeluknya
  rationale: Secara harfiah, ungkapan ini berarti 'istri di dadanya/pangkuannya' dan menunjukkan keintiman serta kasih sayang. Padanan ini mempertahankan metafora secara alami.
- source_word: יֶתֶר בָּנָיו
  choice: anak-anaknya yang masih tersisa
  rationale: בנים dapat mencakup anak-anak, bukan hanya anak laki-laki, sedangkan יֶתֶר menunjuk kepada mereka yang masih tinggal atau tersisa.
- source_word: אֲשֶׁר יוֹתִיר
  choice: yang masih tersisa
  rationale: Verba ini berarti meninggalkan atau menyisakan. Dalam konteks kutuk yang akan terjadi, frasa tersebut menunjuk kepada anak-anak yang masih ada baginya tanpa memutuskan bahwa ia sengaja membiarkan mereka hidup.
