  terminology: “Laki-laki” tepat untuk הָאִישׁ. “Lembut dan sangat dimanjakan” menyampaikan keadaan rapuh/terbiasa hidup nyaman tanpa menjadikan “lemah lembut” sebagai sifat moral. “Permusuhan” adalah padanan utama yang lebih tepat daripada “dengki”; catatan kaki mempertahankan rentang makna idiom tersebut.
