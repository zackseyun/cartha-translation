  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/נִשְׁאַרְתֶּם֙ בִּ/מְתֵ֣י מְעָ֔ט תַּ֚חַת אֲשֶׁ֣ר הֱיִיתֶ֔ם כְּ/כוֹכְבֵ֥י הַ/שָּׁמַ֖יִם לָ/רֹ֑ב כִּי לֹ֣א שָׁמַ֔עְתָּ בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/062.yaml
  text: And you will be left few in number[a], though you had become as numerous as the stars of the heavens[c][b], because you did not listen to the voice of Yahweh your God.
translation:
  language: id
  text: Kalian akan tersisa dalam jumlah yang sedikit[a], walaupun dahulu kalian telah menjadi sebanyak bintang-bintang di langit[b], karena engkau tidak mendengarkan suara Yahweh, Allahmu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang-orang dalam jumlah sedikit”; ini adalah ungkapan yang berarti jumlahnya sangat sedikit.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “sedangkan dahulu kalian sebanyak bintang-bintang di langit.”
    reason: alternative_reading
  - marker: c
    text: Ayat ini beralih dari sapaan jamak “kalian” kepada sapaan tunggal “engkau,” karena Israel dipandang sebagai satu umat. Ungkapan “mendengarkan suara” juga menyiratkan mengindahkan atau menaati.
    reason: grammatical_and_lexical_clarification
lexical_decisions:
- source_word: וְנִשְׁאַרְתֶּם
  choice: kalian akan tinggal
  rationale: Bentuk Nifal menyatakan keadaan tersisa sesudah kehilangan atau penghukuman; 'akan tinggal' alami dalam bahasa Indonesia dan mempertahankan makna resultatifnya.
- source_word: בִּמְתֵי מְעָט
  choice: jumlah kalian ... sedikit
  rationale: Ungkapan ini berarti jumlah yang sangat kecil, bukan khusus beberapa laki-laki; susunan ini menyampaikan makna numeriknya dengan alami.
- source_word: תַּחַת אֲשֶׁר
  choice: padahal dahulu
  rationale: Dalam konteks ini ungkapan tersebut menandai kontras antara keadaan Israel yang pernah sangat banyak dan keadaannya kelak yang tinggal sedikit.
- source_word: הֱיִיתֶם
  choice: kalian sudah menjadi
  rationale: Mengungkapkan keadaan banyak yang telah dicapai Israel sebelum pengurangan yang dinubuatkan.
- source_word: כְּכוֹכְבֵי הַשָּׁמַיִם לָרֹב
  choice: sebanyak bintang-bintang di langit
  rationale: Menjaga gambaran perjanjian tentang bintang-bintang sekaligus menyampaikan penekanan kuantitatif לָרֹב secara idiomatis.
- source_word: כִּי לֹא שָׁמַעְתָּ בְּקוֹל
  choice: karena engkau tidak mendengarkan suara
  rationale: Mempertahankan citra leksikal dan rumusan perjanjian Ibrani; dalam konteks ini mendengarkan juga mengandung arti mengindahkan atau menaati.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Padanan Indonesia yang wajar bagi ungkapan perjanjian 'Allahmu' dan mempertahankan bentuk orang kedua tunggal.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai nama perjanjian ilahi secara langsung; 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Peralihan dari sapaan jamak ke tunggal pada כִּי לֹא שָׁמַעְתָּ dan אֱלֹהֶיךָ
  choice: kalian ... engkau ... Allahmu
  alternative: Menyeragamkan seluruh ayat menjadi bentuk jamak
  rationale: Bahasa Ibrani beralih dari bentuk jamak kepada tunggal kolektif untuk Israel. Peralihan itu dipertahankan agar ciri teks dan ketegangan gramatikalnya tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam bermartabat dan mudah dipahami. 'Kalian' membedakan sapaan jamak dari 'engkau' tunggal kolektif. Bentuk 'Allahmu' dipakai secara alami, dan nama Yahweh dipertahankan.
