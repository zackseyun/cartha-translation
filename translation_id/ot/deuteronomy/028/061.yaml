reference: Deuteronomy 28:61
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: גַּ֤ם כָּל חֳלִי֙ וְ/כָל מַכָּ֔ה אֲשֶׁר֙ לֹ֣א כָת֔וּב בְּ/סֵ֖פֶר הַ/תּוֹרָ֣ה הַ/זֹּ֑את יַעְלֵ֤/ם יְהוָה֙ עָלֶ֔י/ךָ עַ֖ד הִשָּׁמְדָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/061.yaml
  text: Also every sickness and every affliction that is not written in the book of this law[a], Yahweh will bring upon you until you are destroyed.
translation:
  language: id
  text: Juga, segala penyakit dan segala malapetaka[a] yang tidak tertulis dalam kitab hukum ini akan Yahweh datangkan atasmu sampai engkau dimusnahkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “segala tulah.” Kata Ibrani ini dapat berarti pukulan, tulah, atau bencana yang menghantam.
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: Juga
  rationale: Mempertahankan fungsi aditif yang menambahkan hukuman lain pada rangkaian kutuk sebelumnya.
- source_word: כָּל חֳלִי
  choice: segala penyakit
  rationale: חֳלִי menunjuk secara luas pada penyakit atau keadaan sakit; “segala penyakit” alami dan mudah dipahami dalam bahasa Indonesia.
- source_word: וְכָל מַכָּה
  choice: dan segala malapetaka
  rationale: מַכָּה dapat berarti pukulan, luka, tulah, atau bencana yang menghantam. “Malapetaka” mempertahankan cakupan yang lebih luas daripada penyakit menular atau tulah saja.
- source_word: אֲשֶׁר לֹא כָתוּב
  choice: yang tidak tertulis
  rationale: Menerjemahkan klausa relatif dan bentuk pasif secara langsung serta wajar.
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֹּאת
  choice: dalam kitab hukum ini
  rationale: סֵפֶר berarti kitab atau gulungan, sedangkan הַתּוֹרָה הַזֹּאת merujuk pada hukum/pengajaran perjanjian ini. Pilihan ini mempertahankan acuan pada dokumen hukum tersebut tanpa bahasa arkais.
- source_word: יַעְלֵם
  choice: akan ... datangkan
  rationale: Bentuk Hifil dari עלה dengan akhiran objek berarti menyebabkan semuanya datang atau mendatangkannya; susunan ini idiomatis dalam konteks hukuman yang ditimpakan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: עָלֶיךָ
  choice: atasmu
  rationale: Bersama verba “datangkan”, preposisi ini menyatakan bahwa hukuman ditimpakan kepada orang yang disapa.
- source_word: עַד הִשָּׁמְדָךְ
  choice: sampai engkau dimusnahkan
  rationale: Infinitif pasif dengan akhiran orang kedua menyatakan batas akhir tindakan, yakni sampai orang yang disapa mengalami kemusnahan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri Allah; “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan sebuah gelar.
- issue: Kadar kekuatan עַד הִשָּׁמְדָךְ
  choice: sampai engkau dimusnahkan
  alternative: sampai engkau binasa
  rationale: Pilihan pasif mempertahankan bentuk sumber dan kerasnya ancaman tanpa menentukan lebih jauh sifat atau cakupan teologis kemusnahan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan lugas. Susunan kalimat dijaga dekat dengan teks Ibrani, tetapi tetap terbaca alami; koma setelah “Juga” menandai tambahan pada rangkaian kutuk sebelumnya.
