base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/060.yaml
  text: And he will bring back upon you all the diseases of Egypt that you dreaded[c][b][a], and they will cling to you.
translation:
  language: id
  text: TUHAN akan mendatangkan kembali kepadamu segala penyakit Mesir yang kautakuti, dan semuanya itu akan melekat padamu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵשִׁיב
  choice: akan mendatangkan kembali
  rationale: Bentuk Hifil dari שוב menyatakan tindakan menyebabkan sesuatu kembali; dalam konteks kutuk perjanjian, frasa ini secara alami berarti mendatangkan kembali penyakit-penyakit tersebut.
- source_word: בְּךָ
  choice: kepadamu
  rationale: Preposisi ב di sini menandai pihak yang dikenai penyakit; 'kepadamu' alami dalam bahasa Indonesia bersama 'mendatangkan kembali'.
- source_word: כָּל מַדְוֵה מִצְרַיִם
  choice: segala penyakit Mesir
  rationale: מַדְוֶה berarti penyakit atau keadaan sakit. 'Segala penyakit Mesir' langsung, jelas, dan tidak mempersempit rujukannya.
- source_word: אֲשֶׁר יָגֹרְתָּ מִפְּנֵיהֶם
  choice: yang kautakuti
  rationale: יגר menyatakan rasa takut atau gentar. 'Kautakuti' mempertahankan makna dasar dan menghasilkan ungkapan Indonesia yang ringkas serta alami.
- source_word: וְדָבְקוּ בָּךְ
  choice: dan semuanya itu akan melekat padamu
  rationale: דבק menggambarkan keterlekatan yang erat dan menetap. 'Melekat padamu' mempertahankan citra konkret serta kesan penyakit yang tidak kunjung lepas.
theological_decisions:
- issue: Subjek tersirat dari וְהֵשִׁיב
  choice: TUHAN
  alternative: Ia
  rationale: Kata kerja Ibrani hanya menyatakan subjek maskulin tunggal yang ditentukan oleh konteks dekat sebagai TUHAN. Menyebut 'TUHAN' membuat ayat mandiri lebih jelas tanpa mengubah pelaku ilahinya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan khidmat. Bentuk 'kautakuti' dipilih sebagai pronomina terikat yang wajar dalam ragam Alkitab modern; 'semuanya itu' memperjelas bahwa subjek jamak verba terakhir merujuk kepada segala penyakit tadi.
