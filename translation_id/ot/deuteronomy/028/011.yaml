language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הוֹתִֽרְ/ךָ֤ יְהוָה֙ לְ/טוֹבָ֔ה בִּ/פְרִ֧י בִטְנְ/ךָ֛ וּ/בִ/פְרִ֥י בְהַמְתְּ/ךָ֖ וּ/בִ/פְרִ֣י אַדְמָתֶ֑/ךָ עַ֚ל הָ/אֲדָמָ֔ה אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתֶ֖י/ךָ לָ֥/תֶת לָֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/011.yaml
  text: And Yahweh will make you abound in prosperity[a], in the fruit of your womb, in the fruit of your livestock, and in the fruit of your ground[c][b], on the land that Yahweh swore to your fathers to give you.
translation:
  language: id
  text: Yahweh akan melimpahkan kepadamu kebaikan[a] dalam buah kandunganmu[b], dalam anak ternakmu, dan dalam hasil tanahmu[c], di negeri yang telah Yahweh janjikan dengan sumpah kepada nenek moyangmu untuk diberikan kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “untuk kebaikanmu,” “demi kesejahteraanmu,” atau “dalam kemakmuran.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah “buah kandunganmu,” yaitu anak-anak atau keturunanmu.
    reason: idiom_explanation
  - marker: c
    text: Secara harfiah “buah tanahmu”; dapat juga diterjemahkan “hasil tanahmu” atau “panen dari tanahmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹתִרְךָ
  choice: akan membuatmu berkelimpahan
  rationale: 'Bentuk Hifil dari יתר menyatakan tindakan kausatif: Yahweh menyebabkan umat memiliki kelimpahan atau kelebihan. Ungkapan ini mempertahankan daya kausatif tersebut dalam bahasa Indonesia yang wajar.'
- source_word: לְטוֹבָה
  choice: dalam kebaikan
  rationale: Secara harfiah berarti 'untuk kebaikan'. Dalam konteks berkat ini, ungkapan tersebut menunjuk pada kelimpahan yang membawa keadaan baik atau kesejahteraan; terjemahan utama mempertahankan keluasan maknanya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan sebuah gelar.
- source_word: בִּפְרִי בִטְנְךָ
  choice: dalam buah kandunganmu
  rationale: Mempertahankan idiom Ibrani untuk anak atau keturunan serta citra kesuburan dalam rangkaian berkat.
- source_word: וּבִפְרִי בְהַמְתְּךָ
  choice: anak ternakmu
  rationale: Secara harfiah 'buah ternakmu'. 'Anak ternakmu' menyampaikan pertambahan hewan peliharaan secara alami dalam bahasa Indonesia tanpa mengaburkan maksud.
- source_word: וּבִפְרִי אַדְמָתֶךָ
  choice: hasil tanahmu
  rationale: אֲדָמָה di sini menunjuk pada tanah yang menghasilkan tanaman. 'Hasil tanah' merupakan padanan alami untuk panen atau produksi tanah pertanian.
- source_word: עַל הָאֲדָמָה
  choice: di negeri
  rationale: Dalam klausa ini אֲדָמָה menunjuk pada wilayah yang dijanjikan sebagai tempat berkat itu dialami. 'Di negeri' lebih alami dalam bahasa Indonesia daripada 'di atas tanah'.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה לַאֲבֹתֶיךָ לָתֶת לָךְ
  choice: yang telah Yahweh janjikan dengan sumpah kepada nenek moyangmu untuk diberikan kepadamu
  rationale: Terjemahan ini mempertahankan sumpah kepada para leluhur dan pemberian negeri itu kepada orang Israel yang sedang disapa.
theological_decisions:
- issue: Penerjemahan nama perjanjian יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama ilahi יהוה secara langsung; transliterasi mempertahankan nama pribadi itu tanpa menggantinya dengan gelar.
- issue: Apakah idiom 'buah kandungan' harus dijelaskan langsung sebagai 'anak-anak'
  choice: Mempertahankan 'buah kandunganmu' dalam teks utama
  alternative: anak-anakmu atau keturunanmu
  rationale: Idiom tersebut dapat dipahami dengan bantuan catatan kaki dan mempertahankan citra kesuburan yang menghubungkan manusia, ternak, dan tanah. Catatan kaki mencegah ungkapan itu disalahpahami.
- issue: Makna לְטוֹבָה dalam rumusan berkat
  choice: dalam kebaikan
  alternative: dalam kemakmuran atau demi kesejahteraan
  rationale: Pilihan utama mempertahankan keluasan kata טוֹבָה dan tidak membatasinya hanya pada kekayaan, sementara konteks konkret menjelaskan bahwa berkat itu mencakup keturunan, ternak, dan hasil tanah.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Tanda pisah mengapit tiga bidang konkret dari kelimpahan tersebut. Bentuk tunggal orang kedua dipertahankan dengan akhiran -mu sesuai sapaan Ibrani kepada Israel sebagai satu umat.
