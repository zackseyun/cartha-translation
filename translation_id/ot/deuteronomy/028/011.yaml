revisions:
- from: Yahweh akan membuatmu berkelimpahan dalam kebaikan[a]—dalam buah kandunganmu[b], anak ternakmu, dan hasil tanahmu[c]—di negeri yang telah Yahweh janjikan dengan sumpah kepada nenek moyangmu untuk diberikan kepadamu.
  to: Yahweh akan melimpahkan kepadamu kebaikan[a] dalam buah kandunganmu[b], dalam anak ternakmu, dan dalam hasil tanahmu[c], di negeri yang telah Yahweh janjikan dengan sumpah kepada nenek moyangmu untuk diberikan kepadamu.
  rationale: Revisi mengganti ungkapan yang tidak alami dengan padanan Indonesia yang lazim bagi berkat kelimpahan, tanpa mempersempit makna לְטוֹבָה menjadi kekayaan semata. Tiga bidang berkat dan hubungan negeri itu dengan sumpah Yahweh kepada para leluhur tetap dipertahankan.
