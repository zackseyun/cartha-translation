id: DEU.28.31
reference: Deuteronomy 28:31
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שׁוֹרְ/ךָ֞ טָב֣וּחַ לְ/עֵינֶ֗י/ךָ וְ/לֹ֣א תֹאכַל֮ מִמֶּ/נּוּ֒ חֲמֹֽרְ/ךָ֙ גָּז֣וּל מִ/לְּ/פָנֶ֔י/ךָ וְ/לֹ֥א יָשׁ֖וּב לָ֑/ךְ צֹֽאנְ/ךָ֙ נְתֻנ֣וֹת לְ/אֹיְבֶ֔י/ךָ וְ/אֵ֥ין לְ/ךָ֖ מוֹשִֽׁיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/031.yaml
  text: Your ox will be slaughtered before your eyes[a], but you will not eat any of it; your donkey will be seized from before you and will not be returned to you; your flock will be given to your enemies[b], and there will be no one to save you.
translation:
  language: id
  text: Lembumu akan disembelih di depan matamu, tetapi engkau tidak akan memakan sedikit pun darinya; keledaimu akan dirampas dari hadapanmu[a] dan tidak akan kembali kepadamu; kawanan ternakmu akan diserahkan kepada musuh-musuhmu, dan tidak akan ada seorang pun yang menyelamatkanmu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dicuri”; kata Ibrani menunjukkan pengambilan dengan paksa atau perampokan.
    reason: lexical_alternative
  - marker: b
    text: Atau “tidak akan ada penolong bagimu” atau “engkau tidak akan mempunyai pembebas.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹרְךָ
  choice: lembumu
  rationale: שׁוֹר menunjuk pada seekor sapi besar, sering kali hewan pekerja. “Lembu” mempertahankan bentuk tunggal dan sesuai dengan latar kehilangan ternak dalam kutuk perjanjian tanpa mempersempitnya menjadi sapi jantan semata.
- source_word: טָבוּחַ
  choice: akan disembelih
  rationale: Partisip pasif dari טבח menyatakan penyembelihan hewan, khususnya untuk dipotong atau dimakan, bukan sekadar pembunuhan. Bentuk “akan” menyampaikan daya futur rangkaian kutuk Ibrani yang tidak memakai verba finit di sini.
- source_word: לְעֵינֶיךָ
  choice: di depan matamu
  rationale: Ungkapan ini menyatakan bahwa kejadian tersebut berlangsung terbuka dalam penglihatan orang yang disapa dan menajamkan unsur ketidakberdayaan.
- source_word: מִמֶּנּוּ
  choice: sedikit pun darinya
  rationale: Secara harfiah berarti “darinya.” Dengan negasi pada kata “memakan,” ungkapan ini secara alami menegaskan bahwa pemilik tidak akan menikmati bagian apa pun dari lembu itu.
- source_word: חֲמֹרְךָ
  choice: keledaimu
  rationale: Padanan modern dan langsung untuk חֲמוֹר.
- source_word: גָּזוּל
  choice: akan dirampas
  rationale: Partisip pasif dari גזל menunjuk pada pengambilan dengan paksa atau perampokan. “Dirampas” mempertahankan unsur kekerasan yang dapat hilang jika hanya diterjemahkan “dicuri.”
- source_word: מִלְּפָנֶיךָ
  choice: dari hadapanmu
  rationale: Terjemahan ini mempertahankan gambaran harfiah bahwa keledai itu diambil dari depan wajah atau dari kehadiran pemiliknya.
- source_word: יָשׁוּב לָךְ
  choice: tidak akan kembali kepadamu
  rationale: Bentuk aktif verba שׁוב dipertahankan. Dalam konteks ini maknanya ialah keledai tersebut tidak akan pulang atau dipulihkan kepada pemiliknya.
- source_word: צֹאנְךָ
  choice: kawanan ternakmu
  rationale: צֹאן dapat mencakup domba dan kambing. “Kawanan ternak” menjaga keluasan kategori itu tanpa membatasinya pada domba saja.
- source_word: נְתֻנוֹת
  choice: akan diserahkan
  rationale: Partisip pasif dari נתן secara dasar berarti “diberikan.” Dalam konteks pemberian kepada musuh, “diserahkan” menyampaikan perpindahan kuasa secara alami tanpa menambahkan gagasan yang tidak terdapat dalam teks.
- source_word: לְאֹיְבֶיךָ
  choice: kepada musuh-musuhmu
  rationale: Padanan langsung dan lazim bagi bentuk jamak אֹיֵב dalam konteks kutuk perjanjian.
- source_word: וְאֵין לְךָ מוֹשִׁיעַ
  choice: dan tidak akan ada seorang pun yang menyelamatkanmu
  rationale: מוֹשִׁיעַ ialah pelaku yang menyelamatkan atau melepaskan. Susunan ini alami dalam bahasa Indonesia modern dan mempertahankan ketiadaan pribadi yang dapat memberikan pertolongan.
theological_decisions:
- issue: Bahasa keselamatan dalam klausa penutup
  choice: tidak akan ada seorang pun yang menyelamatkanmu
  alternative: tidak akan ada penolong bagimu; engkau tidak akan mempunyai pembebas
  rationale: מוֹשִׁיעַ berasal dari akar ישׁע, “menyelamatkan/melepaskan.” Dalam konteks kutuk perjanjian, yang dimaksud terutama ialah penyelamatan dari perampasan dan musuh, bukan pernyataan khusus tentang keselamatan kekal. Namun, padanan “menyelamatkan” tetap mempertahankan hubungan leksikal tanpa mempersempit maknanya menjadi pertolongan biasa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk sapaan tunggal dipertahankan melalui akhiran -mu dan “engkau.” Struktur tiga bagian teks Ibrani dijaga dengan titik koma. “Dari hadapanmu” sengaja mempertahankan gambaran konkret sumber, sedangkan “kawanan ternak” menghindari pembatasan צֹאן hanya pada domba.
