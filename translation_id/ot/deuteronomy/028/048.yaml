source:
  edition: WLC
  text: וְ/עָבַדְתָּ֣ אֶת אֹיְבֶ֗י/ךָ אֲשֶׁ֨ר יְשַׁלְּחֶ֤/נּוּ יְהוָה֙ בָּ֔/ךְ בְּ/רָעָ֧ב וּ/בְ/צָמָ֛א וּ/בְ/עֵירֹ֖ם וּ/בְ/חֹ֣סֶר כֹּ֑ל וְ/נָתַ֞ן עֹ֤ל בַּרְזֶל֙ עַל צַוָּארֶ֔/ךָ עַ֥ד הִשְׁמִיד֖/וֹ אֹתָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/048.yaml
  text: And you shall serve your enemies[a], whom Yahweh will send against you, in hunger and in thirst and in nakedness and in lack of everything[b]; and he will put an iron yoke on your neck until he has destroyed you.
translation:
  language: id
  text: Engkau akan melayani musuh-musuhmu, yang akan Yahweh kirim untuk melawanmu, dalam kelaparan, kehausan, ketelanjangan, dan kekurangan segala sesuatu. Ia akan memasang kuk besi pada tengkukmu sampai Ia memusnahkanmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bahasa Ibrani juga dapat dipahami dengan musuh sebagai subjek: “Musuh itu akan memasang kuk besi pada tengkukmu sampai ia memusnahkanmu.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַדְתָּ
  choice: Engkau akan melayani
  rationale: Dalam konteks kutuk perjanjian, עבד menunjuk pada pelayanan paksa atau perbudakan kepada musuh, bukan ibadah. Bentuk mendatang diterjemahkan secara alami sebagai prediksi.
- source_word: אֹיְבֶיךָ
  choice: musuh-musuhmu
  rationale: Padanan langsung dan alami bagi אֹיְבִים dalam konteks serangan dan penaklukan.
- source_word: אֲשֶׁר יְשַׁלְּחֶנּוּ יְהוָה בָּךְ
  choice: yang akan Yahweh kirim untuk menyerangmu
  rationale: Ungkapan בָּךְ menyatakan tindakan bermusuhan terhadap Israel; 'untuk menyerangmu' menyampaikan arahnya dengan jelas dan wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi dalam teks Ibrani dipertahankan sebagai nama diri.
- source_word: בְּרָעָב וּבְצָמָא וּבְעֵירֹם וּבְחֹסֶר כֹּל
  choice: dalam kelaparan, kehausan, ketelanjangan, dan kekurangan segala sesuatu
  rationale: Rangkaian keadaan serba kekurangan dipertahankan secara lugas dan berirama; עֵירֹם menyatakan ketiadaan pakaian, sedangkan חֹסֶר כֹּל menyatakan kekurangan yang menyeluruh.
- source_word: וְנָתַן
  choice: Ia akan memasang
  rationale: Subjek diambil tetap Yahweh, yaitu subjek eksplisit terdekat. 'Memasang' merupakan kolokasi Indonesia yang alami untuk kuk pada tengkuk.
- source_word: עֹל בַּרְזֶל
  choice: kuk besi
  rationale: Mempertahankan metafora konkret tentang penaklukan dan perbudakan yang sangat keras.
- source_word: עַל צַוָּארֶךָ
  choice: pada tengkukmu
  rationale: '''Tengkuk'' sesuai dengan gambaran kuk yang diletakkan di belakang leher dan merupakan ungkapan Indonesia yang alami.'
- source_word: עַד הִשְׁמִידוֹ אֹתָךְ
  choice: sampai Ia memusnahkanmu
  rationale: Hifil שׁמד menyatakan tindakan membinasakan atau memusnahkan. 'Memusnahkan' mempertahankan kerasnya ancaman tanpa menambahkan rincian yang tidak ada dalam teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri; 'Yahweh' mempertahankan nama tersebut secara eksplisit.
- issue: Subjek וְנָתַן dan הִשְׁמִידוֹ
  choice: 'Yahweh tetap menjadi subjek: ''Ia akan memasang ... sampai Ia memusnahkanmu.'''
  alternative: 'Musuh menjadi subjek: ''Musuh itu akan memasang ... sampai ia memusnahkanmu.'''
  rationale: Yahweh adalah subjek tunggal eksplisit yang paling dekat, sehingga rangkaian verba tunggal secara alami dapat diteruskan dengan-Nya sebagai subjek. Namun, bahasa Ibrani tidak menyebut ulang subjek sehingga musuh juga mungkin dipahami sebagai pelaku; ambiguitas ini dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam khidmat namun mudah dipahami. Pronomina tunggal 'engkau/-mu' mempertahankan sapaan orang kedua tunggal kolektif dalam teks Ibrani. Pengulangan preposisi Ibrani dipadatkan secukupnya agar alami tanpa menghilangkan deretan penderitaan.
