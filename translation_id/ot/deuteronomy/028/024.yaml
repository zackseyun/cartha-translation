  text: יִתֵּ֧ן יְהוָ֛ה אֶת מְטַ֥ר אַרְצְ/ךָ֖ אָבָ֣ק וְ/עָפָ֑ר מִן הַ/שָּׁמַ֨יִם֙ יֵרֵ֣ד עָלֶ֔י/ךָ עַ֖ד הִשָּׁמְדָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/024.yaml
  text: Yahweh will make the rain of your land dust and powder[a]; from the heavens it will come down on you until you are destroyed.
translation:
  language: id
  text: Yahweh akan menjadikan hujan bagi negerimu debu dan tanah[a]; dari langit debu dan tanah itu akan turun menimpamu sampai engkau binasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “debu dan tanah kering.” Bahasa Ibrani memasangkan dua istilah yang berdekatan maknanya untuk debu dan tanah (אָבָק, עָפָר), sehingga memperkuat gambaran hujan yang berubah menjadi kekeringan dan kehancuran.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֵּן
  choice: akan membuat ... menjadi
  rationale: Secara harfiah berarti 'akan memberikan', tetapi dalam konteks kutuk ini konstruksi tersebut menyatakan bahwa Yahweh menjadikan hujan yang semestinya turun bagi negeri itu sebagai debu dan serbuk tanah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: מְטַר אַרְצְךָ
  choice: hujan bagi negerimu
  rationale: Relasi konstruksi Ibrani dapat menyatakan hujan yang diperuntukkan bagi atau semestinya mengairi negeri itu; ungkapan ini alami dalam bahasa Indonesia dan memperjelas gambaran kutuk kekeringan.
- source_word: אָבָק וְעָפָר
  choice: debu dan serbuk tanah
  rationale: Dua istilah berdekatan untuk materi kering dan halus tetap dibedakan. 'Debu dan serbuk tanah' mempertahankan penggandaan intensif tanpa memakai ungkapan yang terlalu sehari-hari.
- source_word: מִן הַשָּׁמַיִם
  choice: dari langit
  rationale: Walaupun bentuk Ibraninya secara morfologis jamak, 'dari langit' merupakan padanan Indonesia yang paling alami dan tetap mempertahankan arah datangnya malapetaka.
- source_word: יֵרֵד עָלֶיךָ
  choice: semuanya itu akan turun menimpamu
  rationale: Kata kerja tunggal merujuk pada gambaran gabungan debu dan serbuk tanah. 'Menimpamu' menyampaikan baik gerak turun maupun sifat malapetakanya secara alami.
- source_word: עַד הִשָּׁמְדָךְ
  choice: sampai engkau binasa
  rationale: Infinitif dengan sufiks menyatakan batas akhir kutuk. Padanan ini tidak memaksakan pelaku eksplisit yang tidak dinyatakan dalam frasa Ibrani.
theological_decisions:
- issue: Penerjemahan nama perjanjian יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Bentuk 'Yahweh' mempertahankan nama pribadi dalam teks sumber dan tidak menggantinya dengan sebuah gelar.
- issue: Pelaku dalam עַד הִשָּׁמְדָךְ
  choice: sampai engkau binasa
  alternative: sampai Ia memusnahkanmu
  rationale: Bentuk Ibrani menyatakan hasil atau keadaan kehancuran secara ringkas tanpa menyebut pelaku dalam frasa itu; terjemahan tidak menambahkan subjek yang tersirat tetapi tidak eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. Kata ganti tunggal 'engkau' mempertahankan sapaan orang kedua tunggal dalam bahasa Ibrani. Penanda catatan kaki [a] ditempatkan langsung setelah frasa terkait.
