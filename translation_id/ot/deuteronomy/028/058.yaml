  text: אִם לֹ֨א תִשְׁמֹ֜ר לַ/עֲשׂ֗וֹת אֶת כָּל דִּבְרֵי֙ הַ/תּוֹרָ֣ה הַ/זֹּ֔את הַ/כְּתוּבִ֖ים בַּ/סֵּ֣פֶר הַ/זֶּ֑ה לְ֠/יִרְאָה אֶת הַ/שֵּׁ֞ם הַ/נִּכְבָּ֤ד וְ/הַ/נּוֹרָא֙ הַ/זֶּ֔ה אֵ֖ת יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/058.yaml
  text: If you are not careful to do all the words of this law that are written in this book[c][b][a], to fear this glorious and awesome name—Yahweh your God—
translation:
  language: id
  text: Jika kamu tidak sungguh-sungguh menaati segala perkataan hukum ini yang tertulis dalam kitab ini[a], untuk takut[b] akan nama ini yang mulia dan dahsyat, yaitu Yahweh[c], Allahmu—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “gulungan ini.”'
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani ini mencakup rasa takut, gentar, dan hormat.
    reason: lexical_alternative
  - marker: c
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN.”'
    reason: alternative_reading
lexical_decisions:
- source_word: תִשְׁמֹר לַעֲשׂוֹת
  choice: tidak dengan sungguh-sungguh melakukan
  rationale: Ungkapan שׁמר + infinitif עשׂה menyatakan perhatian yang tekun untuk melaksanakan. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan unsur kesungguhan serta ketaatan praktis.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: segala perkataan hukum
  rationale: דִּבְרֵי secara harfiah berarti 'perkataan-perkataan', sedangkan תּוֹרָה dalam konteks ini menunjuk pada hukum perjanjian. Bentuk ini mempertahankan kekonkretan teks sumber.
- source_word: הַכְּתוּבִים בַּסֵּפֶר הַזֶּה
  choice: yang tertulis dalam kitab ini
  rationale: Partisip pasif menunjukkan ketentuan yang telah dituliskan. 'Kitab' sesuai dengan ragam Alkitab Indonesia yang bermartabat; 'gulungan' tetap dicatat sebagai kemungkinan historis.
- source_word: לְיִרְאָה
  choice: dengan takut
  rationale: Infinitif ini menunjukkan tujuan atau hasil yang terkait dengan ketaatan. 'Takut' mempertahankan cakupan ירא yang meliputi rasa gentar sekaligus hormat, tanpa melunakkannya menjadi penghormatan saja.
- source_word: הַשֵּׁם
  choice: nama
  rationale: Teks menyebut 'nama' sebagai pengungkapan identitas dan kemasyhuran ilahi; ungkapan ini dipertahankan dan tidak diparafrasakan.
- source_word: הַנִּכְבָּד וְהַנּוֹרָא
  choice: yang mulia dan dahsyat
  rationale: נכבד menyatakan kemuliaan atau kehormatan, sedangkan נורא menyatakan sesuatu yang membangkitkan rasa gentar. 'Mulia dan dahsyat' alami dan berbobot dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama yang terdapat dalam teks Ibrani tetap terlihat.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Akhiran orang kedua tunggal maskulin diterjemahkan langsung. Bentuk 'Allahmu' menyatakan hubungan perjanjian secara ringkas dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Cakupan makna ירא
  choice: takut
  alternative: hormat atau takut dan hormat
  rationale: Kata 'takut' mempertahankan ketegangan antara rasa hormat dan kegentaran yang terkandung dalam istilah perjanjian ini. Catatan kaki menjelaskan cakupannya tanpa menyelesaikan ambiguitas di dalam teks utama.
- issue: Hubungan sintaksis לְיִרְאָה dengan perintah sebelumnya
  choice: dengan takut akan
  alternative: supaya kamu takut akan
  rationale: Infinitif berpreposisi dapat menyatakan tujuan atau hasil. Bentuk 'dengan takut akan' menghubungkan ketaatan dan takut akan nama Allah tanpa memaksakan pembedaan yang terlalu tegas.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur ayat dibiarkan berakhir dengan tanda pisah karena ayat ini merupakan protasis yang berlanjut ke akibat dalam ayat berikutnya. Penanda catatan kaki ditempatkan tepat sesudah unsur yang dijelaskan.
