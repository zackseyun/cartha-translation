review_pass:
  verdict: revise
  source_fidelity: Draf dengan tepat mempertahankan struktur syarat, metafora 'kepala/ekor' serta 'atas/bawah', nama Yahweh, dan nuansa 'mendengarkan' yang mencakup ketaatan. Namun, 'selalu di atas' mengubah penegasan eksklusif רַק ('hanya') menjadi keterangan durasi. Selain itu, 'kusampaikan' lebih lemah daripada מְצַוְּךָ, 'kuperintahkan', dan 'dengan' kurang langsung mencerminkan infinitif tujuan לִשְׁמֹר וְלַעֲשׂוֹת.
  naturalness: Revisi tetap menggunakan Bahasa Indonesia baku dan modern. 'Hanya akan berada di atas' menyampaikan kontras retoris secara idiomatis, sementara 'yang kuperintahkan kepadamu hari ini' dan 'untuk memelihara dan melakukannya' jelas dan alami.
  terminology: '''Yahweh'', ''Allahmu'', ''perintah-perintah'', serta metafora ''kepala dan bukan ekor'' dipertahankan. Catatan kaki tetap menjelaskan alternatif leksikal ''menaati'' tanpa menggantikannya dalam teks utama.'
  issues:
  - severity: medium
    issue: '''Selalu di atas'' untuk רַק לְמַעְלָה'
    rationale: רַק berarti 'hanya/saja' dan menandai eksklusivitas status, bukan terutama keberlangsungan waktu. 'Selalu' menambahkan makna temporal yang tidak dinyatakan.
  - severity: medium
    issue: '''Kusampaikan'' untuk מְצַוְּךָ'
    rationale: Partisip dari צוה berarti 'memerintahkan'; 'menyampaikan' dapat merujuk pada komunikasi umum dan melemahkan daya normatif verba sumber.
  - severity: low
    issue: Letak jangkar catatan kaki dan hubungan infinitif penutup
    rationale: Catatan leksikal mengenai 'mendengarkan' sebaiknya ditempatkan langsung sesudah kata itu. 'Untuk memelihara dan melakukannya' lebih dekat dengan fungsi infinitif Ibrani daripada 'dengan memelihara dan melakukannya'.
  revised_text: Yahweh akan menjadikan engkau kepala dan bukan ekor. Engkau hanya akan berada di atas dan tidak akan berada di bawah, jika engkau mendengarkan[a] perintah-perintah Yahweh, Allahmu, yang kuperintahkan kepadamu hari ini, untuk memelihara dan melakukannya.
  revised_footnotes:
