  text: וּ/נְתָֽנְ/ךָ֨ יְהוָ֤ה לְ/רֹאשׁ֙ וְ/לֹ֣א לְ/זָנָ֔ב וְ/הָיִ֨יתָ֙ רַ֣ק לְ/מַ֔עְלָ/ה וְ/לֹ֥א תִהְיֶ֖ה לְ/מָ֑טָּה כִּֽי תִשְׁמַ֞ע אֶל מִצְוֺ֣ת יְהוָ֣ה אֱלֹהֶ֗י/ךָ אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּ/ךָ֛ הַ/יּ֖וֹם לִ/שְׁמֹ֥ר וְ/לַ/עֲשֽׂוֹת־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/013.yaml
  text: And Yahweh will make you the head and not the tail[a], and you will be only above, and you will not be beneath, if you listen to the commandments of Yahweh your God that I am commanding you today, to keep and to do them.
translation:
  language: id
  text: Yahweh akan menjadikan engkau kepala dan bukan ekor. Engkau hanya akan berada di atas dan tidak akan berada di bawah, jika engkau mendengarkan[a] perintah-perintah Yahweh, Allahmu, yang kuperintahkan kepadamu hari ini, untuk memelihara dan melakukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “mendengarkan” di sini juga dapat diterjemahkan “menaati”; dalam konteks perjanjian, mendengar mencakup tanggapan berupa ketaatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנְךָ יְהוָה
  choice: Yahweh akan menjadikan engkau
  rationale: נתן secara harfiah berarti memberi, menaruh, atau menetapkan, tetapi dengan pelengkap predikatif 'kepala dan bukan ekor' ungkapan ini bersifat kausatif. 'Menjadikan' alami dalam bahasa Indonesia dan mempertahankan daya ungkapnya.
- source_word: לְרֹאשׁ וְלֹא לְזָנָב
  choice: kepala dan bukan ekor
  rationale: Terjemahan ini mempertahankan metafora Ibrani tentang kedudukan utama yang dikontraskan dengan kedudukan rendah atau pengikut.
- source_word: וְהָיִיתָ רַק לְמַעְלָה וְלֹא תִהְיֶה לְמָטָּה
  choice: engkau akan selalu di atas dan tidak akan di bawah
  rationale: Pasangan 'di atas/di bawah' mempertahankan metafora ruang untuk status. Dalam konteks polaritas ini, רַק menegaskan bahwa Israel akan berada di atas saja; 'selalu di atas' mengungkapkannya secara alami tanpa mengubah metafora.
- source_word: כִּי תִשְׁמַע אֶל
  choice: jika engkau mendengarkan
  rationale: כִּי memperkenalkan syarat berkat, sedangkan שמע אל secara leksikal berarti mendengarkan tetapi dalam konteks perjanjian mencakup ketaatan. Terjemahan utama mempertahankan citra mendengar; catatan kaki menjelaskan nuansanya.
- source_word: מִצְוֺת
  choice: perintah-perintah
  rationale: Bentuk jamak ini menunjuk kepada ketetapan perjanjian. 'Perintah-perintah' jelas, wajar, dan tetap memiliki bobot normatif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: 'Ungkapan ini secara langsung menyatakan hubungan perjanjian: Yahweh adalah Allah Israel.'
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: yang kusampaikan kepadamu pada hari ini
  rationale: Partisip Ibrani menyatakan tindakan Musa yang sedang berlangsung dalam pidatonya. 'Kusampaikan' alami sebagai penyampaian perintah, sedangkan 'pada hari ini' mempertahankan penekanan khas Ulangan.
- source_word: לִשְׁמֹר וְלַעֲשׂוֹת
  choice: dengan memelihara dan melakukannya
  rationale: 'Kedua verba dipertahankan secara terpisah: yang pertama menandakan penjagaan atau ketaatan saksama, dan yang kedua pelaksanaan nyata. ''Dengan'' mengungkapkan fungsi infinitif sebagai penjelasan tentang cara mendengarkan dengan taat.'
theological_decisions:
- issue: Fungsi כִּי dalam hubungan antara berkat dan ketaatan
  choice: jika engkau mendengarkan
  alternative: karena engkau mendengarkan
  rationale: Dalam rangkaian berkat Ulangan 28, כִּי paling wajar memperkenalkan syarat. 'Jika' mempertahankan logika perjanjian tanpa menambahkan gagasan tentang jasa yang tidak dinyatakan teks.
- issue: Makna ketaatan dalam שמע אל
  choice: mendengarkan, dengan memelihara dan melakukannya
  alternative: menaati
  rationale: Terjemahan ini mempertahankan metafora pendengaran dalam bahasa Ibrani sekaligus membiarkan klausa penutup menjelaskan bahwa pendengaran yang dimaksud berujung pada pemeliharaan dan pelaksanaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina tunggal 'engkau' mempertahankan sapaan tunggal kolektif kepada Israel. Metafora kepala/ekor dan atas/bawah dipertahankan agar daya retoris teks Ibrani tidak diratakan.
