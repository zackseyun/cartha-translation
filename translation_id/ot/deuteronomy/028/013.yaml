- from: Yahweh akan menjadikan engkau kepala dan bukan ekor; engkau akan selalu di atas dan tidak akan di bawah, jika engkau mendengarkan perintah-perintah Yahweh, Allahmu, yang kusampaikan kepadamu pada hari ini, dengan memelihara dan melakukannya.[a]
  to: Yahweh akan menjadikan engkau kepala dan bukan ekor. Engkau hanya akan berada di atas dan tidak akan berada di bawah, jika engkau mendengarkan[a] perintah-perintah Yahweh, Allahmu, yang kuperintahkan kepadamu hari ini, untuk memelihara dan melakukannya.
  rationale: Revisi mengganti keterangan durasi 'selalu' dengan penegasan eksklusif 'hanya', memulihkan makna perintah dalam מְצַוְּךָ, dan membuat relasi klausa infinitif penutup lebih transparan. Tidak ada perubahan pada makna perjanjian, metafora, atau register.
