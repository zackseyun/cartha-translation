  text: The cricket shall take possession of all your trees and the fruit of your ground[a].
translation:
  language: id
  text: Semua pohonmu serta seluruh hasil tanahmu akan dikuasai oleh jangkrik[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “belalang” atau, secara lebih umum, “serangga yang berdengung”; jenis serangga yang dimaksud oleh kata Ibrani צְלָצַל tidak dapat dipastikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל עֵצְךָ
  choice: segala pohonmu
  rationale: כָּל mencakup keseluruhan, sedangkan עֵץ dalam konteks pertanian berarti pohon; bentuk kolektif Ibrani diterjemahkan secara alami sebagai jamak dalam bahasa Indonesia.
- source_word: וּפְרִי אַדְמָתֶךָ
  choice: dan hasil tanahmu
  rationale: פְּרִי dapat berarti buah atau hasil, dan אַדָמָה berarti tanah; 'hasil tanahmu' alami dalam bahasa Indonesia serta mencakup panenan yang dimaksud.
- source_word: יְיָרֵשׁ
  choice: akan dikuasai oleh
  rationale: Verba ירשׁ berinti makna mengambil atau menduduki sebagai milik. Bentuk pasif ini mempertahankan gambaran bahwa hama mengambil alih seluruh pohon dan hasil tanah, tanpa mempersempit maknanya menjadi sekadar 'memakan'.
- source_word: הַצְּלָצַל
  choice: serangga pengerik
  rationale: Identitas zoologis צְלָצַל tidak pasti dan mungkin berkaitan dengan bunyi berdenging atau mengerik. 'Serangga pengerik' mempertahankan unsur bunyi tanpa memastikan spesies tertentu.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan yang ringkas dan bermartabat. 'Segala' menjaga cakupan menyeluruh; konstruksi pasif 'akan dikuasai oleh' terdengar lebih alami daripada memaksakan serangga sebagai pelaku yang 'mewarisi', sekaligus mempertahankan metafora pengambilalihan dalam verba Ibrani.
