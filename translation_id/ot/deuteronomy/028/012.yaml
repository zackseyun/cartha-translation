id: DEU.28.12
reference: Deuteronomy 28:12
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יִפְתַּ֣ח יְהוָ֣ה לְ֠/ךָ אֶת אוֹצָר֨/וֹ הַ/טּ֜וֹב אֶת הַ/שָּׁמַ֗יִם לָ/תֵ֤ת מְטַֽר אַרְצְ/ךָ֙ בְּ/עִתּ֔/וֹ וּ/לְ/בָרֵ֕ךְ אֵ֖ת כָּל מַעֲשֵׂ֣ה יָדֶ֑/ךָ וְ/הִלְוִ֨יתָ֙ גּוֹיִ֣ם רַבִּ֔ים וְ/אַתָּ֖ה לֹ֥א תִלְוֶֽה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/012.yaml
  text: Yahweh will open to you his good storehouse[a], the heavens, to give the rain of your land in its season and to bless all the work of your hand. You will lend to many nations, but you will not borrow.
translation:
  language: id
  text: Yahweh akan membuka bagimu perbendaharaan-Nya yang baik[a], yaitu langit, untuk menurunkan hujan bagi negerimu pada musimnya dan memberkati segala pekerjaan tanganmu. Engkau akan memberi pinjaman kepada banyak bangsa, tetapi engkau sendiri tidak akan meminjam.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tempat penyimpanan-Nya yang baik.” Kata Ibrani ini dapat menunjuk pada tempat penyimpanan atau perbendaharaan; dalam konteks hujan dan hasil tanah, gambaran tempat penyimpanan sangat mungkin dimaksudkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama perjanjian ilahi yang terdapat langsung dalam teks Ibrani.
- source_word: יִפְתַּח
  choice: akan membuka
  rationale: Bentuk imperfek Qal memiliki daya futur dalam konteks berkat dan mempertahankan metafora konkret.
- source_word: אוֹצָרוֹ הַטּוֹב
  choice: perbendaharaan-Nya yang baik
  rationale: אוֹצָר dapat berarti tempat penyimpanan atau perbendaharaan; 'perbendaharaan' terdengar alami dan bermartabat dalam bahasa Indonesia, sementara 'yang baik' mempertahankan adjektiva Ibrani.
- source_word: הַשָּׁמַיִם
  choice: yaitu langit
  rationale: Frasa ini menjelaskan perbendaharaan yang dimaksud. 'Langit' merupakan padanan Indonesia yang alami untuk bentuk Ibrani tersebut dalam konteks turunnya hujan.
- source_word: לָתֵת מְטַר אַרְצְךָ
  choice: untuk menurunkan hujan bagi negerimu
  rationale: Secara idiomatis menyampaikan tujuan pembukaan langit tanpa menghasilkan frasa Indonesia yang kaku; 'negeri' mempertahankan cakupan tanah/wilayah Israel.
- source_word: בְּעִתּוֹ
  choice: pada musimnya
  rationale: Akhiran pronominal paling wajar merujuk kepada hujan, dengan penekanan pada waktu musiman yang tepat.
- source_word: כָּל מַעֲשֵׂה יָדֶךָ
  choice: segala pekerjaan tanganmu
  rationale: Mempertahankan idiom Ibrani dan bentuk tunggal 'tangan', tetapi tetap mudah dipahami dalam bahasa Indonesia.
- source_word: וְהִלְוִיתָ גּוֹיִם רַבִּים
  choice: Engkau akan memberi pinjaman kepada banyak bangsa
  rationale: Bentuk Hifil dari לוה berarti memberi pinjaman; גּוֹיִם diterjemahkan 'bangsa' dalam konteks nasional-perjanjian.
- source_word: וְאַתָּה לֹא תִלְוֶה
  choice: tetapi engkau sendiri tidak akan meminjam
  rationale: Bentuk Qal berarti meminjam. 'Tetapi' menyatakan kontras, sedangkan 'sendiri' mencerminkan penekanan pada וְאַתָּה.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Hubungan 'perbendaharaan' dengan 'langit'
  choice: '''yaitu langit'' sebagai aposisi penjelas'
  alternative: '''perbendaharaan-Nya yang baik di langit'''
  rationale: Susunan Ibrani paling alami membuat הַשָּׁמַיִם menjelaskan identitas perbendaharaan itu, bukan sekadar lokasinya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Pronomina tunggal 'engkau' dipertahankan karena berkat ini menyapa Israel secara kolektif sebagai satu kesatuan. Kapitalisasi '-Nya' menandai rujukan kepada Yahweh menurut kebiasaan penerbitan Indonesia.
