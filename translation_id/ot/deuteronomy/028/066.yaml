  yaml_path: translation/ot/deuteronomy/028/066.yaml
  text: Your life will hang in doubt before you[a]; you will fear night and day[b], and you will have no assurance of your life.
translation:
  language: id
  text: Hidupmu akan tergantung dalam ketidakpastian di hadapanmu[a]; engkau akan takut malam dan siang, dan engkau tidak akan memiliki kepastian tentang hidupmu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau secara lebih harfiah, “Hidupmu akan tergantung di hadapanmu.” Gambaran Ibraninya ialah hidup yang tergantung secara genting, sehingga kelangsungan hidup terus tidak pasti.
    reason: lexical_alternative
  - marker: b
    text: Atau, “engkau tidak akan yakin akan hidupmu” atau “engkau tidak akan memercayai hidupmu.” Maksudnya, engkau tidak akan merasa pasti bahwa engkau akan tetap hidup.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיֶּיךָ
  choice: hidupmu
  rationale: Bentuk Ibrani secara morfologis jamak, tetapi di sini merupakan ungkapan yang menunjuk pada hidup atau kelangsungan hidup seseorang; bentuk tunggal alami dalam bahasa Indonesia.
- source_word: תְּלֻאִים
  choice: akan tergantung
  rationale: Mempertahankan gambaran konkret dari akar תלה, yaitu hidup yang tergantung secara genting, tanpa menghapus ambiguitas metaforisnya.
- source_word: לְךָ מִנֶּגֶד
  choice: di hadapanmu
  rationale: Mencerminkan ungkapan spasial Ibrani secara wajar dan bermartabat; ancaman terhadap hidup seolah-olah terus terpampang di depan orang itu.
- source_word: וּפָחַדְתָּ
  choice: engkau akan ketakutan
  rationale: פחד menyatakan rasa takut atau gentar yang kuat; 'ketakutan' sesuai dengan konteks ancaman terus-menerus.
- source_word: לַיְלָה וְיוֹמָם
  choice: siang dan malam
  rationale: Ungkapan Indonesia yang paling alami untuk ketakutan yang berlangsung terus-menerus. Urutan unsur disesuaikan demi kelaziman bahasa sasaran tanpa mengubah makna.
- source_word: לֹא תַאֲמִין בְּחַיֶּיךָ
  choice: engkau tidak akan yakin bahwa hidupmu aman
  rationale: Hifil אמן dengan objek 'hidupmu' di sini menyatakan tidak adanya keyakinan akan kelangsungan atau keamanan hidup, bukan tindakan percaya dalam arti teologis.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'engkau' dipakai sesuai register Alkitab yang langsung. Citra 'tergantung' dipertahankan, sedangkan klausa terakhir dibuat idiomatis tanpa menambahkan kepastian teologis yang tidak terdapat dalam teks sumber.
