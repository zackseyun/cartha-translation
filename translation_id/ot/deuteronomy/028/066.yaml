- from: Hidupmu akan tergantung di hadapanmu[a]; engkau akan ketakutan siang dan malam, dan engkau tidak akan yakin bahwa hidupmu aman.[b]
  to: Hidupmu akan tergantung dalam ketidakpastian di hadapanmu[a]; engkau akan takut malam dan siang, dan engkau tidak akan memiliki kepastian tentang hidupmu.[b]
  rationale: Revisi memperjelas metafora yang secara harfiah janggal dalam bahasa Indonesia (‘hidup tergantung’) dengan ‘dalam ketidakpastian,’ sambil mempertahankan unsur spasial ‘di hadapanmu.’ Klausa tentang takut dibuat idiomatis dan urutan temporal sumber dipulihkan. Klausa akhir tidak lagi menyamakan hidup dengan keamanan, melainkan menyatakan ketiadaan kepastian tentang hidup sebagaimana ditunjukkan oleh teks Ibrani dan audit bahasa Inggris.
