  terminology: “Yahweh” konsisten dengan kebijakan nama ilahi yang diberikan. “Engkau,” “musuh-musuhmu,” dan “kerajaan di bumi” tepat dan konsisten. Catatan kaki leksikal relevan, tetapi penandanya harus ditempatkan pada kata yang dijelaskannya.
