  variant: modern standard Indonesian
source:
  edition: WLC
  text: יִתֶּנְ/ךָ֨ יְהוָ֥ה נִגָּף֮ לִ/פְנֵ֣י אֹיְבֶי/ךָ֒ בְּ/דֶ֤רֶךְ אֶחָד֙ תֵּצֵ֣א אֵלָ֔י/ו וּ/בְ/שִׁבְעָ֥ה דְרָכִ֖ים תָּנ֣וּס לְ/פָנָ֑י/ו וְ/הָיִ֣יתָ לְ/זַעֲוָ֔ה לְ/כֹ֖ל מַמְלְכ֥וֹת הָ/אָֽרֶץ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/025.yaml
  text: Yahweh will give you over as defeated before your enemies. You will go out against them by one way[a], and by seven ways you will flee before them, and you will become a horror to all the kingdoms of the earth.
translation:
  language: id
  text: Yahweh akan menyerahkan engkau untuk dikalahkan di hadapan musuh-musuhmu. Melalui satu jalan engkau akan maju melawan mereka, tetapi melalui tujuh jalan engkau akan melarikan diri dari hadapan mereka. Engkau akan menjadi kengerian[a] bagi semua kerajaan di bumi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjadi sesuatu yang mengerikan.” Istilah Ibrani dapat menunjuk pada kengerian atau pada sesuatu yang menimbulkan rasa ngeri dan gentar.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתֶּנְךָ ... נִגָּף
  choice: akan menyerahkan engkau untuk dikalahkan
  rationale: Konstruksi נתן dengan נִגָּף dalam konteks kutuk peperangan menyatakan bahwa Israel diserahkan kepada keadaan kalah. Rumusan ini mempertahankan daya verba 'menyerahkan' sekaligus menyampaikan hasil militernya dengan wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, agar nama perjanjian dalam teks Ibrani tetap tampak.
- source_word: לִפְנֵי אֹיְבֶיךָ
  choice: di hadapan musuh-musuhmu
  rationale: Terjemahan ini mempertahankan citra harfiah 'di hadapan' dan tetap dapat dipahami sebagai kekalahan di medan perang.
- source_word: בְּדֶרֶךְ אֶחָד ... וּבְשִׁבְעָה דְרָכִים
  choice: melalui satu jalan ... melalui tujuh jalan
  rationale: Paralelisme angka satu dan tujuh serta gambaran gerak maju yang terpadu lalu tercerai-berai dipertahankan.
- source_word: תֵּצֵא אֵלָיו
  choice: engkau akan maju melawan mereka
  rationale: יצא + אל dalam konteks militer berarti keluar atau maju untuk bertempur. Kata ganti jamak alami dalam bahasa Indonesia mengacu kepada 'musuh-musuhmu', meskipun sufiks Ibraninya berbentuk tunggal kolektif.
- source_word: תָּנוּס לְפָנָיו
  choice: engkau akan melarikan diri dari hadapan mereka
  rationale: Rumusan ini mempertahankan verba 'melarikan diri' dan unsur spasial לְפָנָיו, sambil memakai acuan jamak yang jelas dan alami.
- source_word: וְהָיִיתָ לְזַעֲוָה
  choice: engkau akan menjadi kengerian
  rationale: זַעֲוָה dapat menunjuk pada kengerian atau pada sesuatu yang menimbulkan rasa ngeri. 'Menjadi kengerian' mempertahankan kepadatan dan ambiguitas ungkapan sumber.
- source_word: לְכֹל מַמְלְכוֹת הָאָרֶץ
  choice: bagi semua kerajaan di bumi
  rationale: Dalam konteks cakupan internasional kutuk perjanjian ini, הָאָרֶץ paling wajar dipahami secara luas sebagai 'bumi', bukan hanya suatu negeri tertentu.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama pribadi ilahi secara langsung; transliterasi mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Daya gambaran kutuk dalam לְזַעֲוָה
  choice: menjadi kengerian
  alternative: menjadi sesuatu yang mengerikan
  rationale: Pilihan utama tidak menentukan secara berlebihan apakah Israel sendiri disebut 'kengerian' atau menjadi objek yang menimbulkan kengerian; alternatif semantis dicatat dalam catatan kaki.
- issue: Sufiks tunggal pada אֵלָיו dan לְפָנָיו setelah אֹיְבֶיךָ
  choice: mereka
  alternative: dia
  rationale: Bentuk tunggal Ibrani dapat berfungsi kolektif dengan anteseden 'musuh-musuhmu'. Bahasa Indonesia memakai 'mereka' agar acuannya jelas tanpa mengubah makna kolektif.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan langsung. Pronomina 'engkau' dipakai untuk sapaan tunggal kolektif kepada Israel. Pengulangan 'melalui satu jalan ... melalui tujuh jalan' sengaja dipertahankan untuk menjaga paralelisme dan citra tercerai-berainya pasukan.
