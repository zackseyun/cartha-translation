  text: וְ/הָיִ֜יתָ מְמַשֵּׁ֣שׁ בַּֽ/צָּהֳרַ֗יִם כַּ/אֲשֶׁ֨ר יְמַשֵּׁ֤שׁ הָ/עִוֵּר֙ בָּ/אֲפֵלָ֔ה וְ/לֹ֥א תַצְלִ֖יחַ אֶת דְּרָכֶ֑י/ךָ וְ/הָיִ֜יתָ אַ֣ךְ עָשׁ֧וּק וְ/גָז֛וּל כָּל הַ/יָּמִ֖ים וְ/אֵ֥ין מוֹשִֽׁיעַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/029.yaml
  text: And you will grope at noon as the blind gropes in the darkness[a], and you will not prosper in your ways; and you will be only oppressed and robbed all the days[c][b], with no one to save you.
translation:
  language: id
  text: Engkau akan meraba-raba pada tengah hari seperti orang buta meraba-raba dalam kegelapan,[a] dan engkau tidak akan berhasil dalam jalan-jalanmu.[b] Engkau hanya akan ditindas dan dirampok sepanjang masa, dan tidak ada seorang pun yang akan menyelamatkanmu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mencari-cari dengan meraba”; kata Ibrani ini menggambarkan mencari jalan dengan sentuhan karena tidak dapat melihat.
    reason: lexical_alternative
  - marker: b
    text: Atau “engkau tidak akan menjadi makmur dalam jalan-jalanmu.”
    reason: lexical_alternative
  - marker: c
    text: Atau “tanpa seorang pun yang menolongmu” atau “tanpa seorang pembebas pun.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְמַשֵּׁשׁ / יְמַשֵּׁשׁ
  choice: meraba-raba
  rationale: Kata kerja ini menggambarkan mencari jalan dengan sentuhan karena tidak dapat melihat. 'Meraba-raba' alami dalam bahasa Indonesia dan mempertahankan gambaran fisik sekaligus ketidakberdayaan dalam perumpamaan.
- source_word: בַּצָּהֳרַיִם
  choice: pada tengah hari
  rationale: Menunjuk pada bagian hari yang paling terang; pilihan ini mempertajam ironi bahwa dalam terang penuh pun orang itu tidak berdaya seperti orang buta dalam kegelapan.
- source_word: הָעִוֵּר
  choice: orang buta
  rationale: Adjektiva Ibrani maskulin tunggal dipakai secara substantival. 'Orang buta' adalah padanan Indonesia yang wajar tanpa menambahkan jenis kelamin yang tidak perlu dinyatakan dalam bahasa sasaran.
- source_word: בָּאֲפֵלָה
  choice: dalam kegelapan
  rationale: Mempertahankan pertentangan yang jelas dengan 'tengah hari' dan mencakup arti gelap atau kelam.
- source_word: תַצְלִיחַ
  choice: berhasil
  rationale: Bentuk Hifil dapat berarti berhasil atau makmur. Dalam konstruksi dengan 'jalan', 'berhasil' paling alami dan tetap mencakup kegagalan dalam berbagai usaha.
- source_word: אֶת דְּרָכֶיךָ
  choice: dalam segala jalanmu
  rationale: Secara harfiah berarti 'jalan-jalanmu' dan dalam konteks menunjuk pada arah hidup serta berbagai usaha. 'Segala' mengungkapkan bentuk jamak secara alami tanpa mengganti metafora jalan.
- source_word: אַךְ
  choice: terus-menerus
  rationale: Partikel ini membatasi keadaan orang itu pada penindasan dan perampokan saja. Bersama frasa duratif berikutnya, 'terus-menerus' menyampaikan keadaan tanpa henti secara alami.
- source_word: עָשׁוּק
  choice: ditindas
  rationale: Partisip pasif ini menunjuk pada keadaan mengalami penindasan, pemerasan, atau perlakuan sewenang-wenang; 'ditindas' merupakan padanan luas dan mapan.
- source_word: גָזוּל
  choice: dirampok
  rationale: Partisip pasif ini menyatakan bahwa milik seseorang dirampas melalui pencurian atau perebutan. 'Dirampok' jelas dan berpasangan alami dengan 'ditindas'.
- source_word: כָּל הַיָּמִים
  choice: terus-menerus
  rationale: Secara harfiah 'sepanjang hari-hari' dan secara idiomatis menyatakan keadaan yang berlangsung senantiasa. Padanan ini lebih alami dalam bahasa Indonesia daripada 'sepanjang hari-hari'.
- source_word: וְאֵין מוֹשִׁיעַ
  choice: tanpa seorang pun yang menyelamatkanmu
  rationale: Klausa ini menyatakan tidak adanya penolong yang membebaskan. Bentuk Indonesia ini alami, personal, dan tidak menjadikan partisip tersebut gelar khusus.
theological_decisions:
- issue: Pemaknaan מוֹשִׁיעַ dalam konteks kutuk perjanjian yang tidak secara khusus mesianik
  choice: menyelamatkan
  alternative: menolong atau membebaskan
  rationale: Akar יָשַׁע dapat menunjuk pada penyelamatan atau pembebasan secara umum. 'Menyelamatkan' dipakai dalam arti biasa dan tidak mengimpor makna gelar atau klaim mesianik yang tidak dinyatakan oleh konteks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan langsung. Pengulangan 'meraba-raba' mempertahankan gaya Ibrani. Susunan klausa dibuat alami dalam bahasa Indonesia, sedangkan metafora 'jalan' dan ketegangan leksikal antara berhasil/makmur serta menyelamatkan/membebaskan dipertahankan melalui catatan kaki.
