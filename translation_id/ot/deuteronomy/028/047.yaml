  text: תַּ֗חַת אֲשֶׁ֤ר לֹא עָבַ֨דְתָּ֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/שִׂמְחָ֖ה וּ/בְ/ט֣וּב לֵבָ֑ב מֵ/רֹ֖ב כֹּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/047.yaml
  text: because you did not serve Yahweh your God with joy and with gladness of heart[a], because of the abundance of all things[b],
translation:
  language: id
  text: karena engkau tidak melayani Yahweh, Allahmu, dengan sukacita dan hati yang gembira[a] di tengah kelimpahan segala sesuatu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dengan kebaikan hati”; ungkapan Ibraninya dapat menunjuk pada hati yang senang atau gembira.
    reason: lexical_alternative
  - marker: b
    text: Atau “karena kelimpahan segala sesuatu” atau “ketika engkau memiliki segala sesuatu dengan berlimpah.” Maksudnya, engkau tidak melayani Yahweh meskipun menikmati persediaan yang berlimpah.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחַת אֲשֶׁר
  choice: karena
  rationale: Dalam konteks ini, ungkapan tersebut memperkenalkan alasan bagi kutuk perjanjian; 'karena' menyampaikan fungsi kausalnya secara alami.
- source_word: עָבַדְתָּ
  choice: melayani
  rationale: Dengan Allah sebagai objek, kata ini mencakup pengabdian, ibadah, dan ketaatan dalam perjanjian; 'melayani' mempertahankan keluasan makna itu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh' agar nama pribadi dalam teks Ibrani tetap terlihat, bukan diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Akhiran pronominalnya adalah orang kedua maskulin tunggal; 'Allahmu' menyampaikan sapaan perjanjian kepada Israel sebagai satu kesatuan.
- source_word: בְּשִׂמְחָה
  choice: dengan sukacita
  rationale: Frasa berpreposisi ini menerangkan cara melayani dan diterjemahkan secara langsung serta wajar dalam bahasa Indonesia.
- source_word: וּבְטוּב לֵבָב
  choice: dan hati yang gembira
  rationale: Secara harfiah frasa ini berbicara tentang 'kebaikan hati', tetapi secara idiomatis menunjuk pada keadaan batin yang baik atau gembira. Pilihan ini alami dalam bahasa Indonesia tanpa menghapus nuansa harfiahnya, yang dicatat dalam catatan kaki.
- source_word: מֵרֹב כֹּל
  choice: di tengah kelimpahan segala sesuatu
  rationale: Frasa ini paling wajar dipahami sebagai keadaan ketika Israel menerima persediaan berlimpah. 'Di tengah' menghindari kesan bahwa kelimpahan itu sendiri secara mekanis menyebabkan kegagalan mereka melayani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi Allah. 'Yahweh' mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Cakupan pelayanan perjanjian dalam עבד
  choice: melayani
  alternative: beribadah kepada
  rationale: '''Melayani'' mempertahankan cakupan pengabdian dan ketaatan kepada Allah, sedangkan ''beribadah'' dapat terdengar lebih terbatas pada kegiatan ritual.'
- issue: Hubungan מֵרֹב כֹּל dengan kegagalan Israel
  choice: 'keadaan yang memperberat kesalahan: di tengah kelimpahan'
  alternative: kelimpahan sebagai penyebab langsung
  rationale: Konteks berkat dan kutuk menunjukkan bahwa Israel gagal melayani Allah meskipun menikmati persediaan berlimpah; terjemahan tidak seharusnya menyatakan bahwa kelimpahan secara langsung menyebabkan ketidaktaatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk tunggal 'engkau/Allahmu' dipertahankan untuk mencerminkan sapaan Ibrani kepada Israel sebagai satu kesatuan. Ayat dibiarkan sebagai klausa berlanjut dengan koma karena kalimat dan akibatnya diteruskan dalam ayat berikutnya.
