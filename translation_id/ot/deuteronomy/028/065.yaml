  source_fidelity: 'Terjemahan pada umumnya mengikuti teks Ibrani dengan baik: kedua ungkapan tentang tidak adanya istirahat dipertahankan, penekanan lokasi pada “Di sana” tersampaikan, dan rangkaian tiga penderitaan batiniah tetap utuh. Namun, “mata yang meredup” terutama mengacu pada berkurangnya cahaya atau ketajaman, sedangkan כִּלְיוֹן menyatakan kelayuan, penyusutan, atau keadaan yang habis/melemah. “Mata yang layu” lebih dekat dengan citra dan cakupan istilah Ibrani tanpa menjadikannya diagnosis khusus.'
