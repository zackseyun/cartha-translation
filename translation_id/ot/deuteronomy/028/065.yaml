  text: וּ/בַ/גּוֹיִ֤ם הָ/הֵם֙ לֹ֣א תַרְגִּ֔יעַ וְ/לֹא יִהְיֶ֥ה מָנ֖וֹחַ לְ/כַף רַגְלֶ֑/ךָ וְ/נָתַן֩ יְהוָ֨ה לְ/ךָ֥ שָׁם֙ לֵ֣ב רַגָּ֔ז וְ/כִלְי֥וֹן עֵינַ֖יִם וְ/דַֽאֲב֥וֹן נָֽפֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/065.yaml
  text: And among those nations you will find no rest[a], and there will be no resting place for the sole of your foot; and there Yahweh will give you a trembling heart, failing eyes[c][b], and anguish of soul.
translation:
  language: id
  text: Di antara bangsa-bangsa itu engkau tidak akan mendapat ketenangan[a], dan tidak akan ada tempat beristirahat bagi telapak kakimu. Di sana Yahweh akan memberimu hati yang gemetar, mata yang layu[b], dan kepedihan jiwa[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “engkau tidak akan merasa tenteram.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “kelayuan” atau “penghabisan mata”; dapat juga diterjemahkan “mata yang melemah.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “dukacita jiwa” atau “penderitaan jiwa.”
    reason: lexical_alternative
lexical_decisions:
- source_word: תַרְגִּיעַ
  choice: mendapat ketenangan
  rationale: Bentuk Hifil dari רגע dalam konteks ini menyatakan keadaan menjadi tenang atau memperoleh ketenteraman. Frasa ini alami dalam bahasa Indonesia dan tetap membuka nuansa ‘merasa tenteram’.
- source_word: מָנוֹחַ
  choice: tempat beristirahat
  rationale: Nomina ini dapat menunjuk pada keadaan ataupun tempat perhentian. Hubungannya dengan telapak kaki mendukung makna konkret ‘tempat beristirahat’.
- source_word: לְכַף רַגְלֶךָ
  choice: bagi telapak kakimu
  rationale: כַּף bersama רֶגֶל secara khusus menunjuk pada bagian bawah kaki. Terjemahan ini mempertahankan gambaran jasmani dalam teks Ibrani.
- source_word: וְנָתַן יְהוָה לְךָ שָׁם
  choice: Di sana Yahweh akan memberimu
  rationale: Penempatan ‘Di sana’ di awal klausa mempertahankan penekanan lokasi dalam susunan Ibrani sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks sumber tetap tampak.
- source_word: לֵב רַגָּז
  choice: hati yang gemetar
  rationale: רַגָּז mencakup kegentaran, kegelisahan, dan gejolak batin. ‘Hati yang gemetar’ mempertahankan gambaran konkret sekaligus daya emosionalnya.
- source_word: כִּלְיוֹן עֵינַיִם
  choice: mata yang meredup
  rationale: כִּלְיוֹן menyatakan kemerosotan, penghabisan, atau keadaan yang makin gagal. ‘Mata yang meredup’ merupakan ungkapan Indonesia yang alami tanpa membatasi maknanya hanya pada gangguan penglihatan.
- source_word: דַּאֲבוֹן נָפֶשׁ
  choice: kepedihan jiwa
  rationale: דַּאֲבוֹן dapat berarti rasa sakit, dukacita, atau derita mendalam. ‘Kepedihan jiwa’ mempertahankan intensitas ungkapan dan menerjemahkan נֶפֶשׁ sebagai ‘jiwa’.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks Ibrani secara langsung memakai Tetragramaton. Bentuk ‘Yahweh’ mempertahankan nama pribadi ilahi dan tidak menggantinya dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Pronomina tunggal ‘engkau’ dipertahankan karena semua bentuk orang kedua dalam ayat ini berbentuk tunggal. Paralelisme tiga penderitaan pada akhir ayat dijaga tanpa menyelesaikan secara berlebihan keluasan makna istilah-istilah emosional Ibraninya.
