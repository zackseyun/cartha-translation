  terminology: “Yahweh” secara konsisten merepresentasikan יהוה. “Hati yang gemetar” tepat untuk לֵב רַגָּז, sedangkan “kepedihan jiwa” merupakan padanan yang baik bagi דַּאֲבוֹן נָפֶשׁ dan tidak mempersempit maknanya menjadi satu emosi tertentu. Catatan untuk כִּלְיוֹן עֵינַיִם perlu diselaraskan dengan makna ‘kelayuan/penghabisan’, bukan “kemerosotan.”
