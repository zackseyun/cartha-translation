source:
  edition: WLC
  text: וְ/רָאוּ֙ כָּל עַמֵּ֣י הָ/אָ֔רֶץ כִּ֛י שֵׁ֥ם יְהוָ֖ה נִקְרָ֣א עָלֶ֑י/ךָ וְ/יָֽרְא֖וּ מִמֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/010.yaml
  text: Then all the peoples of the earth will see that the name of Yahweh is called upon you[a], and they will fear you.
translation:
  language: id
  text: Lalu semua bangsa di bumi akan melihat bahwa nama Yahweh diserukan atasmu[a], dan mereka akan takut kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bahwa engkau disebut dengan nama Yahweh.” Secara harfiah, ungkapan Ibrani mengatakan bahwa nama Yahweh “diserukan atasmu,” yang menyatakan identitas perjanjian dan kepunyaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאוּ
  choice: Lalu ... akan melihat
  rationale: Bentuk perfektum dengan waw dalam rangkaian berkat menyatakan akibat yang akan datang; “lalu” menyampaikan alur konsekuensial secara alami.
- source_word: כָּל עַמֵּי הָאָרֶץ
  choice: semua bangsa di bumi
  rationale: Ungkapan ini menunjuk kepada berbagai bangsa secara luas; dalam konteks pengakuan internasional, הָאָרֶץ lebih tepat dipahami sebagai “bumi” daripada “negeri”.
- source_word: כִּי
  choice: bahwa
  rationale: Partikel ini memperkenalkan isi yang akan dilihat oleh bangsa-bangsa.
- source_word: שֵׁם יְהוָה
  choice: nama Yahweh
  rationale: Mempertahankan konstruksi Ibrani dan menghadirkan nama perjanjian ilahi secara langsung.
- source_word: נִקְרָא עָלֶיךָ
  choice: diserukan atasmu
  rationale: Terjemahan ini mempertahankan bentuk pasif dan gambaran nama ilahi yang disebut atau diserukan atas seseorang, yang menyatakan identitas dan kepunyaan.
- source_word: וְיָרְאוּ מִמֶּךָּ
  choice: dan mereka akan takut kepadamu
  rationale: Dalam konteks ini ירא menyatakan rasa takut terhadap Israel karena berkat dan kuasa Yahweh tampak menyertainya; “takut kepadamu” alami dalam bahasa Indonesia tanpa mempersempit nuansanya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama perjanjian yang dinyatakan dalam teks sumber.
- issue: Makna idiom נִקְרָא עָלֶיךָ
  choice: nama Yahweh diserukan atasmu
  alternative: engkau disebut dengan nama Yahweh; engkau adalah milik Yahweh
  rationale: Pilihan ini mempertahankan gambaran dan ambiguitas idiom Ibrani, sekaligus memungkinkan makna identifikasi publik dan kepunyaan perjanjian tanpa mengubahnya menjadi parafrasa tunggal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kalimat dibuat jelas bagi pembaca umum sambil mempertahankan idiom utama teks Ibrani dan nuansa rasa takut yang tidak dibatasi hanya pada kengerian atau kekaguman.
