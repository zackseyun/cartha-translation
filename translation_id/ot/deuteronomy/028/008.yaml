  text: יְצַ֨ו יְהוָ֤ה אִתְּ/ךָ֙ אֶת הַ/בְּרָכָ֔ה בַּ/אֲסָמֶ֕י/ךָ וּ/בְ/כֹ֖ל מִשְׁלַ֣ח יָדֶ֑/ךָ וּ/בֵ֣רַכְ/ךָ֔ בָּ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/008.yaml
  text: Yahweh will command the blessing on you in your storehouses and in all the work of your hand[c][b][a], and he will bless you in the land that Yahweh your God is giving you.
translation:
  language: id
  text: Yahweh akan memerintahkan berkat untuk menyertaimu di lumbung-lumbungmu[a] dan dalam segala pekerjaan tanganmu[b]. Ia akan memberkatimu di negeri yang Yahweh, Allahmu, sedang memberikan kepadamu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di gudang-gudangmu” atau “di lumbung-lumbung gandummu.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dalam segala uluran tanganmu,” suatu ungkapan Ibrani bagi segala pekerjaan atau usahamu.
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan “memberikan” atau “akan memberikan.” Partisipel Ibrani di sini dapat dipahami dengan lebih dari satu nuansa waktu.
    reason: alternative_reading
lexical_decisions:
- source_word: יְצַו יְהוָה אִתְּךָ אֶת הַבְּרָכָה
  choice: Yahweh akan memerintahkan berkat untuk menyertaimu
  rationale: Terjemahan ini mempertahankan gambaran kuat dari verba Piel צוה, ‘memerintahkan’, sambil mengungkapkan hubungan אִתְּךָ (‘bersamamu’) secara wajar dalam bahasa Indonesia. Berkat itu digambarkan berada di bawah perintah Yahweh dan menyertai umat-Nya.
- source_word: בַּאֲסָמֶיךָ
  choice: di lumbung-lumbungmu
  rationale: אָסָם menunjuk tempat penyimpanan hasil pertanian, khususnya lumbung atau gudang gandum. ‘Lumbung’ alami dalam konteks berkat agraris ayat ini; alternatif yang lebih umum dicatat dalam catatan kaki.
- source_word: וּבְכֹל מִשְׁלַח יָדֶךָ
  choice: dan dalam segala pekerjaan tanganmu
  rationale: Ungkapan harfiah ‘segala yang tanganmu ulurkan/kerjakan’ merupakan idiom bagi pekerjaan atau usaha. Pilihan ini mempertahankan citra tangan sekaligus mudah dipahami.
- source_word: וּבֵרַכְךָ
  choice: Ia akan memberkatimu
  rationale: Bentuk ini melanjutkan arah waktu mendatang dari verba sebelumnya. Pronomina ‘Ia’ memperjelas bahwa Yahweh tetap menjadi pelakunya.
- source_word: בָּאָרֶץ
  choice: di negeri
  rationale: Dalam bahasa Indonesia, ‘negeri’ cocok untuk wilayah yang akan didiami Israel dan tetap membawa nuansa tanah pemberian perjanjian, tanpa menambahkan sebutan ‘Tanah Perjanjian’ yang tidak eksplisit.
- source_word: נֹתֵן לָךְ
  choice: berikan kepadamu
  rationale: Partisipel נֹתֵן dapat menyatakan tindakan yang sedang berlangsung, bersifat tetap, atau segera terjadi. Bentuk kini ‘berikan’ alami dalam klausa relatif Indonesia dan tidak memaksakan kala secara berlebihan; kemungkinan lain dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga identitas pribadi Allah perjanjian tetap tampak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Transliterasi ‘Yahweh’ mempertahankan nama pribadi dalam teks Ibrani dan menghindari penggantian nama itu dengan sebuah gelar.
- issue: Daya teologis tindakan ‘memerintahkan berkat’
  choice: mempertahankan verba ‘memerintahkan’
  alternative: mengaruniakan atau melimpahkan berkat
  rationale: Teks menggambarkan berkat tunduk pada perintah Yahweh. Pilihan ini mempertahankan gambaran tersebut tanpa menjelaskan mekanismenya atau mengubahnya menjadi rumusan doktrinal.
- issue: Nuansa tanah pemberian perjanjian
  choice: di negeri
  alternative: di tanah atau di negara
  rationale: ‘Negeri’ menyampaikan wilayah tempat Israel akan hidup sebagai pemberian Yahweh, tetapi tidak menambahkan istilah teologis yang tidak terdapat secara eksplisit dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi tetap mudah dipahami. Struktur paralel ayat dipertahankan. ‘Lumbung-lumbungmu’ mempertahankan latar agraris, sedangkan ‘pekerjaan tanganmu’ menjaga citra konkret idiom Ibrani.
