  source_fidelity: 'Teks Indonesia dengan setia mempertahankan urutan dan kontras teks Ibrani: banyak benih dibawa ke ladang, sedikit yang dikumpulkan, lalu alasan kausalnya, yaitu belalang menghabiskannya. “Membawa banyak benih ke ladang” mencerminkan היטב bentuk Hifil תּוֹצִיא tanpa menafsirkan secara berlebihan sebagai “menabur”; “mengumpulkan” mempertahankan א־סף dalam konteks panen; dan “melahapnya” menyampaikan daya verba חסל dengan baik.'
