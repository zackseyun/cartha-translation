  yaml_path: translation/ot/deuteronomy/028/038.yaml
  text: You will carry much seed out to the field[a], but you will gather in little, because the locust will consume it.
translation:
  language: id
  text: Kamu akan membawa banyak benih ke ladang[a], tetapi hanya sedikit yang akan kamu kumpulkan, sebab belalang akan melahapnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kamu akan menabur banyak benih di ladang, tetapi hanya menuai sedikit.” Secara lebih harfiah, teks Ibrani berbunyi “membawa banyak benih ke ladang” dan “mengumpulkan sedikit.”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע רַב
  choice: banyak benih
  rationale: זֶרַע berarti benih, khususnya benih untuk ditabur, dan רַב menunjukkan jumlah yang besar. Ungkapan ini mempertahankan gambaran konkret pertanian dan kontras dengan hasil yang sedikit.
- source_word: תּוֹצִיא
  choice: akan membawa ... ke
  rationale: Bentuk Hifil dari יצא secara harfiah berarti membawa atau mengeluarkan. Dalam konteks ini, benih dibawa ke ladang untuk ditabur; terjemahan utama mempertahankan gambaran Ibrani tanpa langsung menggantinya dengan tindakan 'menabur'.
- source_word: הַשָּׂדֶה
  choice: ladang
  rationale: שׂדה adalah istilah umum untuk ladang atau tanah garapan. 'Ladang' merupakan padanan Indonesia yang langsung dan alami.
- source_word: וּמְעַט תֶּאֱסֹף
  choice: tetapi hanya sedikit yang akan kamu kumpulkan
  rationale: אָסַף berarti mengumpulkan, dan dalam konteks pertanian mengacu pada pengumpulan hasil panen. 'Hanya sedikit' memperjelas kontras kuantitatif dengan 'banyak benih' tanpa mengubah verba Ibraninya menjadi 'menuai' dalam teks utama.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan mengapa hasil yang dikumpulkan sedikit. 'Sebab' adalah penghubung kausal yang jelas dan sesuai dengan ragam bahasa yang bermartabat.
- source_word: יַחְסְלֶנּוּ
  choice: akan melahapnya
  rationale: חסל menyatakan tindakan menghabiskan atau memusnahkan dengan tuntas. 'Melahapnya' alami untuk tindakan belalang dan mempertahankan daya ungkap verba tersebut.
- source_word: הָאַרְבֶּה
  choice: belalang
  rationale: אַרְבֶּה adalah istilah lazim bagi belalang perusak atau belalang dalam kawanan. Bentuk tunggal dengan kata sandang dapat bermakna kolektif; bahasa Indonesia juga dapat memakai 'belalang' secara generik dan kolektif.
