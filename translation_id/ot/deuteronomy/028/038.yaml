  register: Bahasa Indonesia baku, modern, dan mudah dipahami digunakan dengan sapaan orang kedua tunggal 'kamu'. Susunan kalimat mempertahankan kontras antara banyaknya benih yang dibawa dan sedikitnya hasil yang dikumpulkan, sambil tetap terdengar alami.
