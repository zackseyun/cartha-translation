base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/006.yaml
  text: Blessed shall you be when you come in[b][a], and blessed shall you be when you go out.
translation:
  language: id
  text: Diberkatilah engkau ketika masuk[a][b], dan diberkatilah engkau ketika keluar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata “engkau” dalam bahasa Ibrani berbentuk tunggal; Israel disapa sebagai satu umat secara kolektif.
    reason: cultural_note
  - marker: b
    text: Secara lebih harfiah, “pada waktu engkau masuk ... pada waktu engkau keluar”; pasangan ungkapan ini kemungkinan mencakup seluruh perjalanan hidup dan kegiatan sehari-hari.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Diberkatilah
  rationale: Partisipel pasif dari ברך dipakai secara predikatif dalam rangkaian berkat perjanjian. Bentuk ini mempertahankan nada pernyataan berkat sekaligus daya futuratifnya dalam konteks akibat perjanjian.
- source_word: אַתָּה
  choice: engkau
  rationale: Pronomina orang kedua maskulin tunggal yang menyapa Israel sebagai umat secara kolektif. 'Engkau' mempertahankan bentuk tunggal dan sesuai dengan ragam bahasa Alkitab yang modern serta bermartabat.
- source_word: בְּבֹאֶךָ
  choice: ketika masuk
  rationale: Preposisi ב dengan infinitif konstruk בוא dan sufiks orang kedua tunggal menyatakan keadaan atau waktu saat masuk. Ungkapan ringkas ini alami dalam bahasa Indonesia dan mempertahankan makna harfiahnya.
- source_word: וּבָרוּךְ
  choice: dan diberkatilah engkau
  rationale: Konjungsi diikuti pengulangan rumus berkat. Klausa lengkap diulang untuk mempertahankan paralelisme dan keseimbangan retoris bahasa Ibrani.
- source_word: בְּצֵאתֶךָ
  choice: ketika keluar
  rationale: Preposisi ב dengan infinitif konstruk יצא dan sufiks orang kedua tunggal menyatakan keadaan atau waktu saat keluar. Pasangan 'masuk/keluar' mempertahankan gerak harfiah sekaligus kemungkinan fungsi merismenya.
theological_decisions:
- issue: Sapaan tunggal yang mewakili Israel
  choice: Memakai 'engkau' dalam bentuk tunggal tanpa mengembangkannya menjadi bentuk jamak atau parafrasa.
  alternative: 'Kalian akan diberkati ketika masuk dan ketika keluar; atau: Israel akan diberkati dalam segala kegiatannya.'
  rationale: Bahasa Ibrani memakai orang kedua maskulin tunggal sebagai cara perjanjian menyapa Israel secara kolektif. Bentuk tunggal dipertahankan agar tafsiran itu tidak diperluas secara diam-diam.
- issue: Cakupan pasangan 'masuk dan keluar'
  choice: Mempertahankan ungkapan gerak secara harfiah dalam teks utama.
  alternative: Dalam seluruh kehidupan dan kegiatanmu.
  rationale: Pasangan ini kemungkinan merupakan merisme bagi keseluruhan kegiatan hidup, tetapi makna harfiahnya tetap nyata. Terjemahan utama mempertahankan keduanya dan catatan menjelaskan kemungkinan cakupan idiomatisnya.
translation_notes:
  register: Bahasa Indonesia baku, alami, dan bermartabat. Bentuk 'diberkatilah engkau' dipilih untuk mempertahankan irama rumus berkat dan paralelisme Ibrani. Elipsis subjek pada 'ketika masuk/keluar' wajar dalam bahasa Indonesia dan jelas merujuk kepada 'engkau'.
