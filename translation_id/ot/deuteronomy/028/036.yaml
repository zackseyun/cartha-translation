revisions:
- from: Yahweh akan membawa engkau dan raja yang kauangkat atas dirimu kepada suatu bangsa yang tidak dikenal olehmu maupun oleh nenek moyangmu. Di sana engkau akan mengabdi kepada ilah-ilah lain[a], kayu dan batu.
  to: Yahweh akan membawa engkau dan raja yang kauangkat menjadi penguasamu kepada suatu bangsa yang tidak pernah kaukenal, baik engkau maupun bapa-bapamu. Di sana engkau akan mengabdi kepada ilah-ilah lain yang terbuat dari kayu dan batu.[a]
  rationale: Revisi mengganti ungkapan yang tidak lazim tentang pengangkatan raja, memulihkan padanan maskulin plural untuk אֲבֹתֶיךָ, dan menjadikan aposisi bahan ilah-ilah jelas dalam bahasa Indonesia. Makna kutuk, ketidakakraban dengan bangsa itu, serta verba עבד tetap dipertahankan.
  reviewer_model: gpt-5.6-terra
