  text: יוֹלֵ֨ךְ יְהוָ֜ה אֹֽתְ/ךָ֗ וְ/אֶֽת מַלְכְּ/ךָ֙ אֲשֶׁ֣ר תָּקִ֣ים עָלֶ֔י/ךָ אֶל גּ֕וֹי אֲשֶׁ֥ר לֹא יָדַ֖עְתָּ אַתָּ֣ה וַ/אֲבֹתֶ֑י/ךָ וְ/עָבַ֥דְתָּ שָּׁ֛ם אֱלֹהִ֥ים אֲחֵרִ֖ים עֵ֥ץ וָ/אָֽבֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/036.yaml
  text: Yahweh will bring you and the king whom you set over yourself to a nation that neither you nor your fathers have known[a], and there you will serve other gods[b], wood and stone.
translation:
  language: id
  text: Yahweh akan membawa engkau dan raja yang kauangkat menjadi penguasamu kepada suatu bangsa yang tidak pernah kaukenal, baik engkau maupun bapa-bapamu. Di sana engkau akan mengabdi kepada ilah-ilah lain yang terbuat dari kayu dan batu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyembah ilah-ilah lain”; verba Ibrani itu secara harfiah berarti “mengabdi” atau “melayani”.
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹלֵךְ
  choice: akan membawa
  rationale: Bentuk Hifil dari הלך bersifat kausatif, yakni menyebabkan seseorang pergi. Dalam konteks kutuk perjanjian ini, “akan membawa” alami dalam bahasa Indonesia tanpa menambahkan gagasan pembuangan yang tidak dinyatakan secara eksplisit.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan dengan transliterasi “Yahweh”, bukan diganti dengan gelar.
- source_word: מַלְכְּךָ אֲשֶׁר תָּקִים עָלֶיךָ
  choice: raja yang kauangkat atas dirimu
  rationale: Hifil קום di sini berarti mengangkat atau menetapkan seorang penguasa. Ungkapan ini mempertahankan konstruksi עָלֶיךָ sekaligus tetap jelas dalam bahasa Indonesia.
- source_word: גּוֹי
  choice: suatu bangsa
  rationale: גוי lazim menunjuk kepada suatu bangsa atau kelompok bangsa; “bangsa” paling sesuai dalam konteks dibawa ke negeri asing.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: yang tidak dikenal olehmu maupun oleh nenek moyangmu
  rationale: Bentuk pasif alami dalam bahasa Indonesia menyampaikan bahwa bangsa itu tidak dikenal baik oleh angkatan kini maupun generasi terdahulu. “Nenek moyang” merupakan padanan idiomatis bagi אבות dalam ungkapan historis kolektif ini.
- source_word: וְעָבַדְתָּ שָׁם
  choice: Di sana engkau akan mengabdi
  rationale: עבד secara leksikal berarti melayani atau mengabdi dan, bila objeknya ilah, mencakup ibadah. “Mengabdi” mempertahankan nuansa pelayanan religius tanpa menyempitkannya menjadi tindakan ritual saja.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ilah-ilah lain
  rationale: Padanan langsung bagi frasa perjanjian yang baku ini; “ilah” membedakan ilah yang disembah dari nama Allah Israel tanpa menambahkan kata “asing”.
- source_word: עֵץ וָאָבֶן
  choice: kayu dan batu
  rationale: Frasa aposisional ini dipertahankan secara ringkas dan tajam, menggambarkan bahan dari ilah-ilah tersebut tanpa menambahkan kata yang tidak eksplisit dalam teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה; transliterasi mempertahankan nama pribadi tersebut dan tidak menggantinya dengan gelar.
- issue: Makna religius עבד saat objeknya ilah
  choice: mengabdi
  alternative: menyembah
  rationale: “Mengabdi” menjaga arti dasar “melayani” serta implikasi ibadahnya. Alternatif “menyembah” lebih eksplisit secara religius, tetapi lebih sempit daripada verba Ibrani.
- issue: Hubungan עֵץ וָאָבֶן dengan אֱלֹהִים אֲחֵרִים
  choice: 'aposisi: “ilah-ilah lain, kayu dan batu”'
  alternative: “ilah-ilah lain yang terbuat dari kayu dan batu”
  rationale: Aposisi mengikuti bentuk teks Ibrani dan mempertahankan daya retorisnya; alternatif menjelaskan hubungan bahan secara lebih eksplisit, tetapi menambahkan unsur verbal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina tunggal “engkau” dipakai karena bentuk Ibraninya tunggal. Bentuk ringkas “kauangkat” dipilih agar alami tanpa kehilangan hubungan langsung dengan orang yang disapa.
