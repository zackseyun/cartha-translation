  yaml_path: translation/ot/deuteronomy/028/005.yaml
  text: Blessed shall be your basket and your kneading bowl[a].
translation:
  language: id
  text: Diberkatilah keranjangmu dan wadah pengadonanmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mangkuk adonanmu.” Istilah Ibrani ini menunjuk pada wadah yang digunakan untuk menyiapkan adonan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Diberkatilah
  rationale: Partisip pasif בָּרוּךְ berfungsi secara predikatif dalam rangkaian berkat perjanjian. Bentuk ini menyampaikan pernyataan berkat dengan wajar dalam bahasa Indonesia, bukan sekadar doa atau harapan.
- source_word: טַנְאֲךָ
  choice: keranjangmu
  rationale: טֶנֶא berarti keranjang, khususnya yang dapat dipakai membawa hasil bumi. 'Keranjang' setia pada tingkat kekhususan teks Ibrani tanpa menambahkan bahan atau isi yang tidak dinyatakan.
- source_word: וּמִשְׁאַרְתֶּךָ
  choice: dan wadah pengadonanmu
  rationale: מִשְׁאֶרֶת menunjuk pada wadah yang dipakai dalam menyiapkan atau mengadon adonan. 'Wadah pengadonan' jelas bagi pembaca modern sekaligus tidak memaksakan bentuk khusus seperti mangkuk atau palung.
