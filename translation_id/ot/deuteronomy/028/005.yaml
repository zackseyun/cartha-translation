  source_fidelity: 'Teks Indonesia dengan tepat mempertahankan predikasi berkat dari בָּרוּךְ serta dua nomina bersufiks orang kedua tunggal: טַנְאֲךָ, "keranjangmu," dan מִשְׁאַרְתֶּךָ, "wadah pengadonanmu." Terjemahan tidak menambahkan rincian mengenai isi keranjang atau bentuk/bahan wadah.'
