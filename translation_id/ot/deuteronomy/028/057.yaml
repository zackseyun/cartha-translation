  text: וּֽ/בְ/שִׁלְיָתָ֞/הּ הַ/יּוֹצֵ֣ת מִ/בֵּ֣ין רַגְלֶ֗י/הָ וּ/בְ/בָנֶ֨י/הָ֙ אֲשֶׁ֣ר תֵּלֵ֔ד כִּֽי תֹאכְלֵ֥/ם בְּ/חֹֽסֶר כֹּ֖ל בַּ/סָּ֑תֶר בְּ/מָצוֹר֙ וּ/בְ/מָצ֔וֹק אֲשֶׁ֨ר יָצִ֥יק לְ/ךָ֛ אֹיִבְ/ךָ֖ בִּ/שְׁעָרֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/057.yaml
  text: and toward her afterbirth that comes out from between her legs[a], and toward her children whom she bears, because she will eat them secretly, in the lack of everything[c][b], during the siege and distress with which your enemy will oppress you within your gates.
translation:
  language: id
  text: bahkan terhadap ari-arinya yang keluar dari antara kedua kakinya[a] dan terhadap anak-anak yang dilahirkannya, sebab ia akan memakan semuanya secara diam-diam karena kekurangan segala sesuatu[b], dalam pengepungan dan kesesakan yang ditimpakan musuhmu kepadamu di kota-kotamu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “plasentanya.” Istilah Ibrani ini menunjuk pada ari-ari yang keluar dalam proses persalinan.
    reason: lexical_alternative
  - marker: b
    text: Maksudnya, karena mengalami kekurangan yang menyeluruh dalam keadaan terkepung.
    reason: lexical_clarification
  - marker: c
    text: Secara harfiah, “di gerbang-gerbangmu.” Dalam ungkapan Ibrani, gerbang dapat mewakili kota atau permukiman bertembok, bukan hanya bangunan gerbangnya.
    reason: cultural_note
lexical_decisions:
- source_word: שִׁלְיָתָהּ
  choice: ari-arinya
  rationale: Dalam bahasa Indonesia umum, “ari-ari” secara alami menunjuk pada plasenta atau jaringan yang keluar sesudah bayi lahir. Istilah ini mempertahankan kekonkretan dan kengerian konteks tanpa terdengar terlalu klinis.
- source_word: הַיּוֹצֵת מִבֵּין רַגְלֶיהָ
  choice: yang keluar dari antara kedua kakinya
  rationale: Frasa ini menerangkan ari-ari dengan gambaran persalinan yang langsung. “Kaki” tetap dekat dengan רַגְלַיִם, sedangkan “kedua” membuat ungkapan Indonesia lebih wajar.
- source_word: וּבְבָנֶיהָ אֲשֶׁר תֵּלֵד
  choice: dan terhadap anak-anak yang dilahirkannya
  rationale: בָּנִים dalam konteks ini mencakup keturunan secara umum, sehingga “anak-anak” lebih tepat daripada “anak-anak lelaki.” Bentuk ini juga mempertahankan kaitan dengan proses melahirkan.
- source_word: כִּי תֹאכְלֵם
  choice: sebab ia akan memakan semuanya
  rationale: כִּי menyatakan alasan, dan אכל adalah verba biasa “makan.” “Semuanya” merujuk secara alami kepada ari-ari dan anak-anak sekaligus, tanpa mengganti kekonkretan yang mengejutkan dari teks.
- source_word: בְּחֹסֶר כֹּל
  choice: karena kekurangan segala sesuatu
  rationale: Ungkapan ini menyatakan kekurangan total. “Karena kekurangan segala sesuatu” wajar dalam bahasa Indonesia dan mempertahankan cakupan luas כֹּל tanpa membatasinya hanya pada makanan.
- source_word: בַּסָּתֶר
  choice: secara diam-diam
  rationale: Bentuk ini menyampaikan tindakan yang dilakukan secara tersembunyi dan terbaca alami dalam bahasa Indonesia modern.
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: dalam pengepungan dan kesesakan
  rationale: “Pengepungan” menerjemahkan מָצוֹר secara langsung, sedangkan “kesesakan” mempertahankan gagasan tekanan dan keadaan yang menghimpit dalam מָצוֹק.
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיִבְךָ
  choice: yang ditimpakan musuhmu kepadamu
  rationale: Konstruksi ini menyatakan bahwa musuh menyebabkan tekanan pengepungan tersebut. “Ditimpakan” menangkap tindakan bermusuhan tanpa mempersempit maknanya menjadi satu jenis penindasan tertentu.
- source_word: בִּשְׁעָרֶיךָ
  choice: di kota-kotamu
  rationale: Secara harfiah frasa ini menyebut “gerbang-gerbangmu,” tetapi dalam pemakaian Ibrani gerbang mewakili kota bertembok yang sedang dikepung. “Di kota-kotamu” menyampaikan rujukan sebenarnya dengan jelas; citra harfiahnya dipertahankan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Kekonkretan mengerikan dari kutuk ini dipertahankan tanpa eufemisme. “Ari-ari” dipilih karena umum dipahami, sedangkan istilah klinis “plasenta” dicatat sebagai alternatif. Ayat ini merupakan kelanjutan sintaksis dari ayat sebelumnya, sehingga dibuka dengan “bahkan terhadap.”
