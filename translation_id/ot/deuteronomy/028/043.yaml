  yaml_path: translation/ot/deuteronomy/028/043.yaml
  text: The foreigner who is among you will rise higher and higher above you[a], and you will go down lower and lower.
translation:
  language: id
  text: Pendatang yang ada di tengah-tengahmu[a] akan naik semakin tinggi di atasmu, sedangkan engkau akan turun semakin rendah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “orang asing yang tinggal di tengah-tengahmu.” Kata Ibrani גֵּר menunjuk pada seorang pendatang dari luar komunitas Israel yang tinggal di tengah mereka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגֵּר
  choice: orang asing yang tinggal
  rationale: גֵּר menunjuk pada orang bukan pribumi yang menetap di tengah Israel. Frasa ini alami dalam bahasa Indonesia dan membedakannya dari orang asing yang sekadar berkunjung.
- source_word: אֲשֶׁר בְּקִרְבְּךָ
  choice: yang tinggal di tengah-tengahmu
  rationale: Frasa relatif ini menegaskan keberadaan גֵּר di dalam komunitas Israel; unsur 'tinggal' melengkapi makna leksikal גֵּר, sedangkan 'di tengah-tengahmu' menerjemahkan בְּקִרְבְּךָ.
- source_word: יַעֲלֶה עָלֶיךָ
  choice: akan naik ... di atasmu
  rationale: Gambaran naik di atas seseorang menyatakan pembalikan kedudukan tanpa membatasinya hanya pada bidang ekonomi, sosial, atau politik.
- source_word: מַעְלָה מָּעְלָה
  choice: semakin tinggi
  rationale: Pengulangan adverbia Ibrani menyatakan gerak naik yang terus meningkat; 'semakin tinggi' mengungkapkan intensifikasi itu secara wajar dalam bahasa Indonesia.
- source_word: וְאַתָּה
  choice: sedangkan engkau
  rationale: Waw secara bentuk berarti 'dan', tetapi dalam konteks ini menghubungkan dua gerak yang berlawanan. 'Sedangkan' menyampaikan kontras tersebut tanpa menambah hubungan kausal.
- source_word: תֵרֵד
  choice: akan turun
  rationale: Terjemahan ini mempertahankan antonimi langsung dengan 'naik' dan gambaran umum tentang kemerosotan.
- source_word: מַטָּה מָּטָּה
  choice: semakin rendah
  rationale: Ungkapan ini mempertahankan kesejajaran dengan 'semakin tinggi' serta menyampaikan kemerosotan yang berkelanjutan.
theological_decisions:
- issue: Pembalikan kedudukan sosial dalam konteks kutuk perjanjian
  choice: Mempertahankan gambaran umum bahwa pendatang naik di atas Israel sementara Israel turun semakin rendah.
  alternative: Menafsirkannya secara lebih sempit sebagai kemajuan ekonomi saja atau dominasi politik saja.
  rationale: Teks Ibrani tidak menentukan satu bidang tertentu. Gambaran naik dan turun sengaja luas, sehingga terjemahan tidak mempersempit cakupannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk tunggal 'engkau' dipertahankan karena teks Ibrani menyapa Israel secara kolektif sebagai satu kesatuan. Kesejajaran 'semakin tinggi—semakin rendah' menjaga struktur retoris ayat.
