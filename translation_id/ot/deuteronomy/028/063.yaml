revisions:
- from: 'Dan akan terjadi bahwa, sebagaimana Yahweh bersukacita atas kamu dengan berbuat baik kepadamu dan membuatmu bertambah banyak, demikian pula Yahweh akan bersukacita atas kamu dengan membinasakan dan memusnahkan kamu. Kamu akan dicabut dari tanah yang sedang kaumasuki untuk mendudukinya.[a][b]


    [a] Atau “direnggut dari tanah itu.”

    [b] Dalam frasa “yang sedang kaumasuki untuk mendudukinya”, kata “kamu” dalam bahasa Ibrani berbentuk tunggal; Israel disapa sebagai satu bangsa.'
  to: 'Dan akan terjadi bahwa, sebagaimana Yahweh bersukacita atas kamu untuk berbuat baik kepada kamu dan membuat kamu menjadi banyak, demikian pula Yahweh akan bersukacita atas kamu untuk membinasakan kamu dan memusnahkan kamu. Kamu akan dicabut dari tanah itu[a] yang kaumasuki di sana untuk memilikinya.[b]


    [a] Atau “direnggut dari tanah itu.”


    [b] Dalam frasa “yang kaumasuki di sana untuk memilikinya”, kata “kamu” dalam bahasa Ibrani berbentuk tunggal; Israel disapa sebagai satu bangsa.'
  rationale: Revisi memulihkan “di sana” dan objek “-nya” yang dinyatakan dalam teks Ibrani, memperjelas relasi infinitif tanpa melunakkan pernyataan tentang sukacita Yahweh dalam penghukuman, serta menempatkan setiap penanda catatan kaki pada unsur yang dijelaskannya. Tidak ada keputusan doktrinal tambahan yang diterapkan.
