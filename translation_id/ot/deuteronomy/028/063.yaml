  text: וְ֠/הָיָה כַּ/אֲשֶׁר שָׂ֨שׂ יְהוָ֜ה עֲלֵי/כֶ֗ם לְ/הֵיטִ֣יב אֶתְ/כֶם֮ וּ/לְ/הַרְבּ֣וֹת אֶתְ/כֶם֒ כֵּ֣ן יָשִׂ֤ישׂ יְהוָה֙ עֲלֵי/כֶ֔ם לְ/הַאֲבִ֥יד אֶתְ/כֶ֖ם וּ/לְ/הַשְׁמִ֣יד אֶתְ/כֶ֑ם וְ/נִסַּחְתֶּם֙ מֵ/עַ֣ל הָֽ/אֲדָמָ֔ה אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/063.yaml
  text: And it shall be that[a], just as Yahweh rejoiced over you to do you good and to multiply you, so Yahweh will rejoice over you to destroy you and to wipe you out[b]; and you will be torn away from upon the land that you are entering there to possess it.
translation:
  language: id
  text: 'Dan akan terjadi bahwa, sebagaimana Yahweh bersukacita atas kamu untuk berbuat baik kepada kamu dan membuat kamu menjadi banyak, demikian pula Yahweh akan bersukacita atas kamu untuk membinasakan kamu dan memusnahkan kamu. Kamu akan dicabut dari tanah itu[a] yang kaumasuki di sana untuk memilikinya.[b]


    [a] Atau “direnggut dari tanah itu.”


    [b] Dalam frasa “yang kaumasuki di sana untuk memilikinya”, kata “kamu” dalam bahasa Ibrani berbentuk tunggal; Israel disapa sebagai satu bangsa.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “direnggut dari tanah itu.”
    reason: lexical_alternative
  - marker: b
    text: Dalam frasa “yang kaumasuki di sana untuk memilikinya”, kata “kamu” dalam bahasa Ibrani berbentuk tunggal; Israel disapa sebagai satu bangsa.
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: Dan akan terjadi bahwa
  rationale: Menandai akibat yang akan datang dan mempertahankan fungsi formula Ibrani dengan ungkapan Indonesia yang wajar.
- source_word: שָׂשׂ / יָשִׂישׂ
  choice: bersukacita / akan bersukacita
  rationale: Akar kata Indonesia yang sama dipakai untuk mempertahankan kesejajaran retoris antara berkat dan penghukuman.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi sesuai kebijakan proyek.
- source_word: לְהֵיטִיב אֶתְכֶם
  choice: dengan berbuat baik kepadamu
  rationale: Mempertahankan makna luas tindakan yang mendatangkan kebaikan tanpa mempersempitnya menjadi kemakmuran materi.
- source_word: וּלְהַרְבּוֹת אֶתְכֶם
  choice: dan membuatmu bertambah banyak
  rationale: Menyampaikan bentuk kausatif dan gema bahasa berkat perjanjian secara alami dalam bahasa Indonesia.
- source_word: לְהַאֲבִיד אֶתְכֶם
  choice: dengan membinasakan ... kamu
  rationale: Padanan kuat dan baku bagi bentuk kausatif אבד dalam konteks kutuk perjanjian.
- source_word: וּלְהַשְׁמִיד אֶתְכֶם
  choice: dan memusnahkan kamu
  rationale: Membedakannya dari verba sebelumnya sambil mempertahankan kerasnya penghukuman.
- source_word: וְנִסַּחְתֶּם מֵעַל הָאֲדָמָה
  choice: Kamu akan dicabut dari tanah
  rationale: Metafora pencabutan menyampaikan pengusiran paksa dari atas tanah dengan bahasa Indonesia yang alami; alternatif yang lebih umum dicatat dalam catatan kaki.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: yang sedang kaumasuki untuk mendudukinya
  rationale: Menyampaikan gerak memasuki tanah dan tujuan untuk mengambilnya sebagai milik; bentuk sapaan tunggal kolektif dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Yahweh bersukacita dalam penghukuman
  choice: Mempertahankan pernyataan eksplisit bahwa Yahweh akan bersukacita atas Israel dengan membinasakan dan memusnahkannya.
  alternative: Melunakkan menjadi bahwa Yahweh sekadar akan membinasakan atau mengizinkan kebinasaan.
  rationale: Teks Ibrani dengan sengaja mencerminkan sukacita dalam memberi kebaikan dengan sukacita dalam menjatuhkan penghukuman. Ketegangan teologis ini tidak diselesaikan atau dilunakkan oleh terjemahan.
- issue: Nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Mengikuti kebijakan proyek untuk menampilkan nama perjanjian ilahi sebagai Yahweh.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kesejajaran antara berkat dan penghukuman dipertahankan, sedangkan konstruksi yang terlalu harfiah seperti “dari atas tanah” diungkapkan melalui metafora alami “dicabut dari tanah”.
