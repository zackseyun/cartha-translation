  source_fidelity: Terjemahan mempertahankan subjek Yahweh, tindakan עתיד Hifil 'memukul', serta tiga akibat yang diperkenalkan dengan בְּ. 'Kegilaan,' 'kebutaan,' dan 'kebingungan hati' secara memadai mencerminkan שִׁגָּעוֹן, עִוָּרוֹן, dan תִּמְהוֹן לֵבָב. Tidak perlu menafsirkan 'kebutaan' sebagai kebutaan mental.
  naturalness: '''Memukul engkau'' dapat dipahami, tetapi ''memukulmu'' lebih wajar dalam bahasa Indonesia modern tanpa mengubah register lugas atau acuannya. Frasa ''kebingungan hati'' tetap dapat dipertahankan sebagai bentuk harfiah yang idiomatis dalam register Alkitab.'
  terminology: Yahweh tepat untuk יְהוָה sesuai kebijakan yang diberikan. 'Hati' mempertahankan metafora Ibrani לֵבָב. Catatan kaki perlu menghindari 'kegemparan hati', karena 'kegemparan' terutama menunjuk keributan atau kehebohan publik, bukan ketertegunan/ketakutan batin yang dicakup תִּמְהוֹן.
