  text: Yahweh will strike you with madness and blindness and confusion of heart[a].
translation:
  language: id
  text: Yahweh akan memukulmu dengan kegilaan, kebutaan, dan kebingungan hati.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kebingungan batin” atau “ketertegunan hati.”
    reason: Alternatif leksikal untuk תִּמְהוֹן לֵבָב, yang dapat menyatakan kebingungan atau ketertegunan dalam batin.
lexical_decisions:
- source_word: יַכְּכָה
  choice: akan memukul engkau
  rationale: Bentuk hifil dari נכה menyatakan tindakan memukul atau menimpakan pukulan/bencana. Pilihan ini mempertahankan daya bahasa kutuk perjanjian dan tetap wajar dalam bahasa Indonesia modern.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בְּשִׁגָּעוֹן
  choice: dengan kegilaan
  rationale: שִׁגָּעוֹן menunjuk pada kegilaan atau kekacauan mental; 'kegilaan' merupakan padanan langsung dan mudah dipahami.
- source_word: וּבְעִוָּרוֹן
  choice: kebutaan
  rationale: עִוָּרוֹן secara langsung berarti kebutaan. Tidak ditambahkan penafsiran seperti 'kebutaan pikiran' karena teks tidak menyatakannya.
- source_word: וּבְתִמְהוֹן לֵבָב
  choice: dan kebingungan hati
  rationale: תִמְהוֹן dapat menyatakan kebingungan, ketercengangan, atau kegemparan batin; לֵבָב secara harfiah 'hati' dan dapat mencakup pikiran serta batin. Terjemahan ini menjaga citra Ibrani dan ambiguitas cakupannya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai tetragramaton sebagai nama pribadi Allah; bentuk 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Cakupan makna לֵבָב
  choice: hati
  alternative: pikiran; batin
  rationale: '''Hati'' mempertahankan ungkapan antropologis Ibrani dan tidak membatasi maknanya hanya pada kemampuan berpikir atau perasaan.'
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina 'engkau' dipakai untuk mempertahankan sapaan orang kedua tunggal dalam konteks perjanjian; deretan nomina tetap dekat dengan susunan Ibrani.
