source:
  edition: WLC
  text: יַכְּ/כָ֨ה יְהוָ֜ה בִּ/שְׁחִ֣ין רָ֗ע עַל הַ/בִּרְכַּ֨יִם֙ וְ/עַל הַ/שֹּׁקַ֔יִם אֲשֶׁ֥ר לֹא תוּכַ֖ל לְ/הֵרָפֵ֑א מִ/כַּ֥ף רַגְלְ/ךָ֖ וְ/עַ֥ד קָדְקֳדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/035.yaml
  text: Yahweh will strike you with severe boils on the knees and on the legs[a], from which you cannot be healed, from the sole of your foot to the crown of your head.
translation:
  language: id
  text: Yahweh akan menghantam engkau dengan bisul-bisul parah pada lutut dan tungkai bawahmu[a], yang tidak dapat disembuhkan, dari telapak kakimu sampai ke ubun-ubunmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tungkai”; kata Ibrani ini lebih khusus menunjuk bagian tungkai bawah.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְּכָה
  choice: akan menghantam engkau
  rationale: Bentuk hiphil dari נכה menyatakan tindakan memukul atau menghantam. Pilihan ini mempertahankan gambaran tindakan ilahi yang langsung dan kuat tanpa memakai ungkapan usang.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai Yahweh, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: בִּשְׁחִין רָע
  choice: dengan bisul-bisul parah
  rationale: שְׁחִין menunjuk pada bisul atau radang kulit dan bentuk tunggalnya dapat bermakna kolektif; רָע menyatakan keadaan yang berat atau buruk.
- source_word: עַל הַבִּרְכַּיִם
  choice: pada lutut
  rationale: Padanan anatomis langsung dan alami dalam bahasa Indonesia.
- source_word: וְעַל הַשֹּׁקַיִם
  choice: dan tungkai bawahmu
  rationale: שׁוֹק lebih khusus menunjuk bagian kaki antara lutut dan pergelangan kaki. 'Tungkai bawah' lebih tepat daripada 'kaki' yang terlalu luas, sementara alternatif umum dipertahankan dalam catatan kaki.
- source_word: אֲשֶׁר לֹא תוּכַל לְהֵרָפֵא
  choice: yang tidak dapat disembuhkan
  rationale: Bentuk pasif mempertahankan fokus pada penyakit yang tidak dapat dipulihkan serta ambiguitas mengenai pelaku penyembuhan.
- source_word: מִכַּף רַגְלְךָ
  choice: dari telapak kakimu
  rationale: כַּף dalam hubungan dengan רֶגֶל secara idiomatis berarti telapak kaki.
- source_word: וְעַד קָדְקֳדֶךָ
  choice: sampai ke ubun-ubunmu
  rationale: קָדְקֹד menunjuk bagian paling atas kepala; 'ubun-ubun' menyampaikan sapuan seluruh tubuh secara ringkas dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Transliterasi 'Yahweh' mempertahankan nama pribadi yang terdapat dalam teks sumber tanpa menggantinya dengan gelar atau memilih pelafalan alternatif.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pronomina 'engkau' dipakai untuk sapaan tunggal dalam konteks perjanjian. Struktur sapuan tubuh dari telapak kaki hingga ubun-ubun dipertahankan, demikian juga nada kutukan yang kuat.
source_grounding:
  english_pob_role: consult_only
