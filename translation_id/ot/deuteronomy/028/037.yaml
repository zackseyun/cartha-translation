base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/037.yaml
  text: And you shall become an object of horror[a], a proverb[c][b], and a taunt among all the peoples where Yahweh will drive you.
translation:
  language: id
  text: Engkau akan menjadi sesuatu yang mengerikan[a], peribahasa, dan bahan ejekan[b] di antara segala bangsa ke mana Yahweh akan menggiringmu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “sesuatu yang mencengangkan.” Istilah Ibrani ini dapat menunjuk pada sesuatu yang begitu mengerikan atau mencengangkan sehingga menimbulkan kengerian atau keterkejutan.'
    reason: lexical_alternative
  - marker: b
    text: 'Kedua istilah Ibrani yang diterjemahkan “peribahasa” dan “bahan ejekan” berkaitan dengan ucapan umum yang merendahkan, tetapi keduanya tetap berbeda: yang satu adalah peribahasa atau buah bibir, sedangkan yang lain adalah sindiran atau ejekan tajam.'
    reason: lexical_distinction
  - marker: c
    text: 'Atau: “ke mana Yahweh akan memimpinmu.” Kata kerjanya dapat berarti “memimpin” atau “menggiring”; “menggiring” sesuai dengan nuansa pemindahan paksa dalam konteks kutuk pembuangan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִיתָ
  choice: Engkau akan menjadi
  rationale: Bentuk perfektum Qal dengan waw dalam rangkaian kutuk menyatakan hasil yang akan terjadi; 'akan menjadi' alami dalam bahasa Indonesia dan mempertahankan daya resultatifnya.
- source_word: לְשַׁמָּה
  choice: sesuatu yang mengerikan
  rationale: Dalam konteks penghukuman, שַׁמָּה menunjuk pada sesuatu yang begitu memilukan atau dahsyat sehingga menimbulkan kengerian atau keterkejutan. Ungkapan ini menyatakan bahwa Israel sendiri menjadi hal yang dipandang demikian.
- source_word: לְמָשָׁל
  choice: peribahasa
  rationale: מָשָׁל secara langsung dapat berarti 'peribahasa'; nuansa buruknya tampak dari konteks kutuk dan unsur ejekan yang mengikutinya.
- source_word: וְלִשְׁנִינָה
  choice: bahan ejekan
  rationale: שְׁנִינָה adalah ucapan tajam atau sindiran yang menghina. 'Bahan ejekan' alami dalam bahasa Indonesia dan membedakannya dari מָשָׁל.
- source_word: בְּכֹל הָעַמִּים
  choice: di antara segala bangsa
  rationale: עַמִּים menunjuk pada kelompok-kelompok bangsa. 'Segala bangsa' merupakan padanan Indonesia yang alami dan mencakup jamak kolektif tersebut.
- source_word: אֲשֶׁר יְנַהֶגְךָ
  choice: ke mana Yahweh akan menggiringmu
  rationale: נהג dapat berarti memimpin atau menggiring. Dalam konteks pembuangan sebagai kutuk, 'menggiring' mempertahankan nuansa pemindahan paksa tanpa berlebihan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber dipertahankan.
- source_word: שָׁמָּה
  choice: ke mana
  rationale: Adverbia 'ke sana' terserap secara alami dalam klausa relatif tujuan 'ke mana'; pengulangan 'ke sana' sesudahnya tidak diperlukan dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama ilahi dan merupakan transliterasi akademis yang luas diterima.
- issue: Daya kata kerja נהג dalam konteks kutuk pembuangan
  choice: menggiringmu
  alternative: memimpinmu
  rationale: Konteks kutuk dan penyebaran menunjukkan tindakan yang bersifat memaksa. Namun, karena verba itu sendiri juga dapat berarti 'memimpin', alternatif tersebut dicatat agar keluasan maknanya tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal 'engkau', sesuai bentuk orang kedua tunggal maskulin dalam teks Ibrani. Diksi dijaga khidmat tetapi mudah dipahami. 'Bahan ejekan' dipilih sebagai ungkapan Indonesia yang wajar, sedangkan nama 'Yahweh' dipertahankan.
