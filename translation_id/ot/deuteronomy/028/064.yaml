  text: וֶ/הֱפִֽיצְ/ךָ֤ יְהוָה֙ בְּ/כָל הָ֣/עַמִּ֔ים מִ/קְצֵ֥ה הָ/אָ֖רֶץ וְ/עַד קְצֵ֣ה הָ/אָ֑רֶץ וְ/עָבַ֨דְתָּ שָּׁ֜ם אֱלֹהִ֣ים אֲחֵרִ֗ים אֲשֶׁ֧ר לֹא יָדַ֛עְתָּ אַתָּ֥ה וַ/אֲבֹתֶ֖י/ךָ עֵ֥ץ וָ/אָֽבֶן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/064.yaml
  text: And Yahweh will scatter you among all the peoples[a], from one end of the earth to the other end of the earth[b], and there you will serve other gods that neither you nor your fathers have known—wood and stone.
translation:
  language: id
  text: Yahweh akan menyerakkan engkau di antara segala bangsa, dari ujung bumi yang satu sampai ke ujung bumi yang lain.[a] Di sana engkau akan beribadah kepada ilah-ilah lain yang tidak pernah engkau maupun nenek moyangmu kenal—kayu dan batu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dari ujung negeri yang satu sampai ke ujung negeri yang lain.” Kata Ibrani אֶרֶץ dapat berarti “bumi” atau “negeri”; “bumi” dipilih di sini karena konteksnya adalah penyerakan di antara segala bangsa.'
    reason: lexical_alternative
  - marker: b
    text: “Kayu dan batu” merujuk kepada berhala yang dibuat dari bahan-bahan tersebut.
    reason: cultural_note
lexical_decisions:
- source_word: וֶהֱפִיצְךָ
  choice: akan menyerakkan engkau
  rationale: Bentuk Hifil dari פוץ menyatakan tindakan menyebabkan seseorang tercerai-berai. 'Menyerakkan' mempertahankan daya ungkap kutuk perjanjian dan cukup wajar dalam ragam Alkitab Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: בְּכָל הָעַמִּים
  choice: ke antara segala bangsa
  rationale: עַמִּים menunjuk kelompok-kelompok bangsa atau suku bangsa. Dalam konteks penyebaran geografis, 'segala bangsa' alami dan mudah dipahami.
- source_word: מִקְצֵה הָאָרֶץ וְעַד קְצֵה הָאָרֶץ
  choice: dari ujung bumi yang satu sampai ke ujung bumi yang lain
  rationale: Terjemahan ini mempertahankan pengulangan Ibrani dan cakupan geografis menyeluruh; kemungkinan arti 'negeri' tetap dicatat.
- source_word: וְעָבַדְתָּ
  choice: engkau akan beribadah kepada
  rationale: Dalam konstruksi dengan ilah sebagai objek, עבד menyatakan pelayanan religius. 'Beribadah kepada' menyampaikan maksud itu secara alami tanpa menyamarkannya sebagai pelayanan biasa.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ilah-ilah lain
  rationale: '''Ilah-ilah lain'' secara langsung mempertahankan ungkapan perjanjian bagi dewa-dewa selain Yahweh.'
- source_word: אֲשֶׁר לֹא יָדַעְתָּ אַתָּה וַאֲבֹתֶיךָ
  choice: yang tidak dikenal olehmu maupun oleh nenek moyangmu
  rationale: Bentuk pasif ini alami dalam bahasa Indonesia dan mencakup kedua subjek yang ditegaskan dalam teks Ibrani tanpa mempersempit makna ידע.
- source_word: עֵץ וָאָבֶן
  choice: kayu dan batu
  rationale: Pasangan nominal ini dipertahankan secara harfiah sebagai aposisi yang menunjukkan bahan berhala.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama diri ilahi secara langsung; transliterasi 'Yahweh' mempertahankan fungsi nama perjanjian itu.
- issue: Cakupan הָאָרֶץ dalam rumusan penyerakan
  choice: bumi
  alternative: negeri
  rationale: Penyebaran 'ke antara segala bangsa' mendukung cakupan luas, tetapi polisemi אֶרֶץ dijaga dalam catatan kaki.
- issue: Makna וְעָבַדְתָּ ketika objeknya ilah-ilah lain
  choice: beribadah kepada
  alternative: melayani
  rationale: Konteks religius membuat 'beribadah kepada' lebih jelas bagi pembaca modern, sementara gagasan ketundukan kepada dewa-dewa asing tetap terpelihara.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti tunggal 'engkau' mempertahankan sapaan orang kedua tunggal dalam bahasa Ibrani. Struktur dua kalimat dipakai agar alur hukuman dan akibat religiusnya jelas, tanpa menghilangkan hubungan antarklausa.
