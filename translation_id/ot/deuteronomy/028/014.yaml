  text: וְ/לֹ֣א תָס֗וּר מִ/כָּל הַ/דְּבָרִים֙ אֲשֶׁ֨ר אָנֹכִ֜י מְצַוֶּ֥ה אֶתְ/כֶ֛ם הַ/יּ֖וֹם יָמִ֣ין וּ/שְׂמֹ֑אול לָ/לֶ֗כֶת אַחֲרֵ֛י אֱלֹהִ֥ים אֲחֵרִ֖ים לְ/עָבְדָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/014.yaml
  text: And do not turn aside from any of the words that I am commanding you today[a], to the right or to the left[b], to go after other gods to serve them.
translation:
  language: id
  text: Janganlah kamu menyimpang sedikit pun dari semua perkataan yang sedang kuperintahkan kepadamu hari ini, ke kanan ataupun ke kiri, untuk mengikuti[a] ilah-ilah lain dan mengabdi kepada mereka[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “berjalan mengikuti.” Ungkapan Ibrani ini dapat berarti mengikuti atau berpihak kepada.
    reason: lexical_alternative
  - marker: b
    text: Atau “beribadah kepada mereka.” Kata Ibrani yang dipakai dapat berarti melayani atau mengabdi dan, dalam hubungannya dengan ilah, mengandung makna ibadah.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָסוּר
  choice: menyimpang
  rationale: Kata סור berarti berbelok, menjauh, atau menyimpang. Dalam konteks ini, “menyimpang” secara alami menyatakan pelanggaran terhadap jalan yang diperintahkan sambil mempertahankan gambaran arah yang dilanjutkan oleh frasa “ke kanan ataupun ke kiri”.
- source_word: מִכָּל הַדְּבָרִים
  choice: dari satu pun perkataan
  rationale: Dalam konstruksi negatif, מִכָּל menekankan bahwa tidak satu bagian pun boleh ditinggalkan. “Perkataan” mempertahankan arti dasar דְּבָרִים, sedangkan anak kalimat berikutnya menjelaskan bahwa perkataan itu diperintahkan.
- source_word: מְצַוֶּה אֶתְכֶם
  choice: yang kuperintahkan kepadamu
  rationale: Bentuk partisip menyampaikan tindakan Musa yang sedang berlangsung dalam amanatnya. Bentuk Indonesia ini alami dan mempertahankan kedekatan perintah tersebut, sementara “kamu” dapat merujuk kepada umat secara kolektif.
- source_word: הַיּוֹם
  choice: hari ini
  rationale: Padanan modern dan langsung yang mempertahankan suasana pembaruan perjanjian pada saat Musa berbicara.
- source_word: יָמִין וּשְׂמֹאול
  choice: ke kanan ataupun ke kiri
  rationale: Ungkapan ini menggambarkan penyimpangan ke arah mana pun. “Ataupun” menegaskan kedua kemungkinan tanpa menghilangkan metafora ruangnya.
- source_word: לָלֶכֶת אַחֲרֵי
  choice: untuk mengikuti
  rationale: Secara harfiah ungkapan ini berarti “berjalan di belakang,” tetapi secara idiomatis berarti mengikuti atau berpihak kepada. “Mengikuti” alami dalam bahasa Indonesia dan tetap mempertahankan gagasan kesetiaan kepada pihak lain.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: allah-allah lain
  rationale: Ini adalah padanan langsung yang mempertahankan ungkapan khas peringatan Ulangan. Huruf kecil membedakannya dari nama atau sebutan bagi Allah Israel tanpa menambahkan penjelasan ontologis yang tidak diberikan ayat ini.
- source_word: לְעָבְדָם
  choice: mengabdi kepada mereka
  rationale: עבד berarti melayani dan, bila objeknya dewa, mencakup ibadah serta kesetiaan keagamaan. “Mengabdi” mempertahankan cakupan pelayanan dan loyalitas, sedangkan kemungkinan “beribadah” dicatat dalam catatan kaki.
theological_decisions:
- issue: Penyebutan ilah-ilah lain dalam peringatan perjanjian
  choice: allah-allah lain
  alternative: dewa-dewa asing
  rationale: Teks Ibrani menyebut “allah-allah lain” dan tidak menjelaskan status ontologis mereka dalam ayat ini. Terjemahan mempertahankan retorika perjanjian tersebut tanpa memasukkan penjelasan teologis tambahan.
- issue: Makna pelayanan kepada ilah lain
  choice: mengabdi kepada mereka
  alternative: beribadah kepada mereka
  rationale: Pilihan utama mempertahankan makna luas עבד berupa pelayanan, ketundukan, dan kesetiaan, sementara konteks ilahi juga memungkinkan arti khusus “beribadah.” Ketegangan leksikal ini dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “Janganlah” sesuai untuk larangan yang tegas tetapi tidak arkais; “kamu” dipakai sebagai sapaan kolektif kepada Israel. Susunan kalimat mempertahankan hubungan antara penyimpangan dari perintah dan tindakan mengikuti serta mengabdi kepada allah-allah lain.
