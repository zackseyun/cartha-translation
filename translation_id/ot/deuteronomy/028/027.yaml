base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/027.yaml
  text: Yahweh will strike you with the boils of Egypt[a], and with tumors, and with scabs, and with itch, from which you cannot be healed.
translation:
  language: id
  text: Yahweh akan menghantam engkau dengan bisul-bisul Mesir, dengan benjolan-benjolan[a], kudis, dan penyakit gatal, yang darinya engkau tidak dapat disembuhkan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “wasir”; istilah Ibraninya tidak pasti dan mungkin secara lebih khusus menunjuk pada pembengkakan di sekitar dubur.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכְּכָה
  choice: akan menghantam engkau
  rationale: Bentuk Hifil dari נכה menyatakan tindakan memukul atau menimpakan penyakit secara langsung. “Menghantam” mempertahankan daya ungkapnya dalam bahasa Indonesia modern.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Dalam tradisi penerjemahan Alkitab bahasa Indonesia, bentuk kapital “TUHAN” secara lazim menandai nama ilahi YHWH, bukan sekadar gelar biasa.
- source_word: בִּשְׁחִין מִצְרַיִם
  choice: dengan bisul-bisul Mesir
  rationale: שְׁחִין menunjuk pada bisul atau radang kulit. Bentuk ulang alami untuk kategori penyakit dalam bahasa Indonesia, sedangkan “Mesir” mempertahankan hubungan genitif dan kemungkinan gema tulah Mesir.
- source_word: וּבְעפלים
  choice: dengan benjolan-benjolan
  rationale: Istilah Ibrani ini tidak pasti dan menunjuk pada pembengkakan atau benjolan; padanan umum menghindari diagnosis yang terlalu spesifik. Kemungkinan “wasir” dicatat dalam catatan kaki.
- source_word: וּבַגָּרָב
  choice: kudis
  rationale: גָּרָב menunjuk pada penyakit kulit berkeropeng; “kudis” merupakan padanan konkret dan mudah dipahami tanpa mengandaikan diagnosis modern yang presisi.
- source_word: וּבֶחָרֶס
  choice: penyakit gatal
  rationale: חֶרֶס dalam konteks ini menunjuk pada gangguan kulit yang menimbulkan gatal. Frasa ini jelas dalam bahasa Indonesia dan tidak terlalu mempersempit diagnosis.
- source_word: אֲשֶׁר לֹא תוּכַל לְהֵרָפֵא
  choice: yang tidak dapat engkau sembuhkan
  rationale: Nifal לְהֵרָפֵא secara harfiah berarti “disembuhkan.” Dalam susunan Indonesia ini, “yang tidak dapat engkau sembuhkan” mengungkapkan ketidakmampuan orang yang terkena untuk memperoleh kesembuhan, sambil tetap mempertahankan gagasan bahwa penyakit itu tak tersembuhkan.
theological_decisions:
- issue: Penerjemahan nama ilahi YHWH
  choice: TUHAN
  alternative: Yahweh
  rationale: “TUHAN” dengan huruf kapital adalah konvensi Indonesia yang dikenal luas untuk menandai tetragramaton. Pilihan ini tetap membedakannya dari gelar “Tuhan,” meskipun transliterasi “Yahweh” lebih langsung mempertahankan bentuk nama pribadi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan tunggal “engkau” mempertahankan acuan orang kedua tunggal. Daftar penyakit dibuat konkret dan mudah dipahami, sementara ketidakpastian istilah עפלים dipertahankan melalui catatan kaki.
