  register: Bahasa Indonesia baku modern dengan nada luhur tetapi mudah dipahami. Tanda pisah di akhir dipertahankan karena kalimat berlanjut ke ayat berikutnya. Penanda catatan kaki [a] dan [b] dicantumkan dalam teks utama.
