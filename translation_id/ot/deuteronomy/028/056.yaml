base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/056.yaml
  text: The tender and delicate woman among you[a], who has not ventured to set the sole of her foot on the ground because of delicacy and tenderness, her eye will be evil toward the husband of her embrace[b], and toward her son and her daughter—
translation:
  language: id
  text: Perempuan lembut dan manja di antaramu—yang karena kemanjaan dan kelembutannya tidak pernah berani menginjakkan telapak kakinya di tanah—akan memandang dengan niat jahat terhadap[a] suami dalam pelukannya[b], juga terhadap anak laki-laki dan anak perempuannya—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “matanya akan menjadi jahat terhadap.” Ungkapan Ibrani ini dapat berarti memandang dengan sikap bermusuhan atau dengan keengganan untuk berbagi.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “laki-laki di dadanya” atau “laki-laki dalam pelukannya,” yaitu suaminya.
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרַכָּה
  choice: yang paling lembut
  rationale: Bentuk feminin רַכָּה menggambarkan kelembutan; dalam konteks ini ungkapan tersebut menyoroti seorang perempuan yang sangat halus dan tidak terbiasa dengan kesukaran.
- source_word: וְהָעֲנֻגָּה
  choice: dan terbiasa hidup nyaman
  rationale: Bentuk pasif dari ענג dapat menunjuk pada keadaan halus, dimanjakan, atau hidup nyaman. Frasa ini menyampaikan latar kehidupan yang serba nyaman tanpa memberi kesan moral tambahan yang tidak pasti.
- source_word: אֲשֶׁר לֹא נִסְּתָה כַף רַגְלָהּ הַצֵּג עַל הָאָרֶץ
  choice: yang ... tidak pernah mencoba menapakkan telapak kakinya ke tanah
  rationale: נִסְּתָה secara formal berarti 'mencoba'. Susunan Indonesia ini mempertahankan gambaran hiperbolis tentang kehalusan hidupnya dengan bahasa yang alami.
- source_word: מֵהִתְעַנֵּג וּמֵרֹךְ
  choice: karena kelembutan dan kenyamanannya
  rationale: Dua frasa berpreposisi ini menjelaskan sebab ia tidak mencoba menapak ke tanah. Pilihan ini mempertahankan pasangan gagasan kelembutan dan hidup nyaman.
- source_word: תֵּרַע עֵינָהּ
  choice: akan memandang dengan dengki
  rationale: Secara harfiah, matanya 'menjadi jahat' terhadap mereka. Terjemahan idiomatis ini menyampaikan sikap bermusuhan atau enggan berbagi, sementara catatan kaki menjaga citra harfiahnya dan ambiguitas nuansanya.
- source_word: בְּאִישׁ חֵיקָהּ
  choice: suami yang dipeluknya
  rationale: Secara harfiah, 'laki-laki di dadanya/pangkuannya'. Pilihan ini mempertahankan keintiman ungkapan tersebut sekaligus jelas menunjuk kepada suaminya.
- source_word: וּבִבְנָהּ וּבְבִתָּהּ
  choice: juga anak laki-laki dan anak perempuannya
  rationale: Teks Ibrani menyebut anak laki-laki dan anak perempuan secara terpisah; kekhususan itu dipertahankan.
