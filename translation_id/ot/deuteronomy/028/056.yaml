  rationale: Revisi menghapus superlatif yang tidak ada dalam sumber dan mengganti “dengki” dengan ungkapan yang lebih luas dan setia pada idiom Ibrani. Ungkapan intim bagi suami, penyebutan anak laki-laki dan perempuan secara terpisah, serta tanda pisah penanda kelanjutan kalimat dipertahankan.
