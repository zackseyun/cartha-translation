  text: Blessed shall you be in the city[a], and blessed shall you be in the field.
translation:
  language: id
  text: Engkau akan diberkati di kota[a] dan akan diberkati di ladang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Diberkatilah engkau di kota dan diberkatilah engkau di ladang.”'
    reason: Alternatif ini mempertahankan sifat klausa Ibrani yang tidak memiliki verba waktu eksplisit dan dapat dibaca sebagai pernyataan berkat langsung.
lexical_decisions:
- source_word: בָּרוּךְ
  choice: akan diberkati
  rationale: Partisipel pasif dari ברך dalam rangkaian berkat perjanjian. Bentuk ini mempertahankan makna bahwa berkat diberikan kepada pihak yang disapa, sedangkan kata “akan” menyampaikan daya janji dari konteks ayat 1–14.
- source_word: אַתָּה
  choice: engkau
  rationale: Pronomina orang kedua maskulin tunggal yang menyapa Israel secara kolektif sebagai pihak dalam perjanjian. “Engkau” mempertahankan bentuk tunggal dan sesuai dengan ragam kitab suci yang tetap mudah dipahami.
- source_word: בָּעִיר
  choice: di kota
  rationale: Gabungan preposisi ב dengan עִיר menunjukkan lokasi. “Di kota” merupakan padanan langsung dan alami serta mempertahankan kontras dengan ladang.
- source_word: וּבָרוּךְ
  choice: dan akan diberkati
  rationale: Konjungsi dan predikat yang diulang dipertahankan untuk mencerminkan kesejajaran retoris bahasa Ibrani antara dua ranah kehidupan.
- source_word: בַּשָּׂדֶה
  choice: di ladang
  rationale: שׂדה menunjuk pada ladang, tanah pertanian, atau wilayah terbuka. “Di ladang” mempertahankan gambaran konkret dan kontras perkotaan-pertanian dalam teks.
theological_decisions:
- issue: Pemaknaan formula berkat tanpa verba eksplisit
  choice: Engkau akan diberkati ... dan akan diberkati ...
  alternative: Diberkatilah engkau ... dan diberkatilah engkau ...
  rationale: Teks Ibrani merupakan klausa nominal tanpa verba waktu yang eksplisit. Dalam konteks janji berkat Ulangan 28:1–14, “akan diberkati” menyampaikan daya promissorisnya secara alami, sementara catatan kaki mempertahankan kemungkinan pembacaan deklaratif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina “engkau” dipakai untuk mempertahankan sapaan tunggal kepada Israel. Pengulangan predikat dipertahankan demi kesejajaran teks sumber.
