translation_notes:
  register: Bahasa modern, lugas, dan bermartabat. Sapaan “engkau” mempertahankan orang kedua tunggal dalam teks Ibrani; bentuk “kaulihat” digunakan untuk kelancaran. Catatan kaki menyimpan struktur Ibrani yang lebih formal dan pengulangan melihat yang terasa janggal bila dipertahankan sepenuhnya dalam teks utama.
