lexical_decisions:
- source_word: וְהָיִיתָ
  choice: Engkau akan menjadi
  rationale: Bentuk ini dalam rangkaian kutuk menyatakan keadaan atau akibat pada masa mendatang; “akan menjadi” alami dalam bahasa Indonesia dan tetap memperlihatkan perubahan menuju keadaan tersebut.
- source_word: מְשֻׁגָּע
  choice: gila
  rationale: Partisip pasif dari שׁגע menunjuk pada keadaan kehilangan kewarasan. Dalam susunan “menjadi gila karena,” bahasa Indonesia sudah menyampaikan akibat kausal secara alami tanpa perlu menambahkan kata yang tidak eksplisit.
- source_word: מִמַּרְאֵה
  choice: karena apa yang kaulihat
  rationale: Preposisi מִן di sini paling wajar dipahami sebagai penyebab. Ungkapan ini menyampaikan bahwa pemandangan yang disaksikan menyebabkan kegilaan.
- source_word: עֵינֶיךָ
  choice: dengan matamu
  rationale: Penyebutan mata dipertahankan agar penekanan konkret dan pengulangan unsur melihat dalam bahasa Ibrani tidak hilang.
- source_word: אֲשֶׁר תִּרְאֶה
  choice: yang kaulihat
  rationale: Klausa relatif menerangkan pemandangan tersebut. Bentuk ini alami, langsung, dan mempertahankan sapaan orang kedua tunggal.
