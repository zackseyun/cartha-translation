base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/055.yaml
  text: so that he will not give to any of them any of the flesh of his sons that he is eating[a], because he has nothing left[b], in the siege and in the distress with which your enemy will oppress you within all your gates.
translation:
  language: id
  text: tanpa memberikan kepada seorang pun dari mereka sedikit pun dari daging putra-putranya[a] yang sedang dimakannya, sebab tidak ada apa pun yang tersisa baginya, dalam pengepungan dan kesesakan yang ditimpakan musuhmu kepadamu di semua gerbangmu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “putra-putranya”; teks di sini secara khusus memakai bentuk maskulin, bukan istilah umum “anak-anak.”'
    reason: lexical_alternative
  - marker: b
    text: Atau “di semua kotamu”; dalam bahasa Ibrani, “gerbang” dapat dipakai untuk menyebut kota atau tempat penduduk bermukim.
    reason: cultural_note
lexical_decisions:
- source_word: מִתֵּת לְאַחַד מֵהֶם
  choice: sehingga ia tidak mau memberikan kepada seorang pun dari mereka
  rationale: Bentuk מִן dengan infinitif נתן menyatakan tindakan menahan atau keengganan memberi dalam kelanjutan kalimat dari ayat sebelumnya. Ungkapan 'kepada seorang pun dari mereka' menyampaikan daya distributif frasa harfiah 'kepada satu dari mereka' secara alami.
- source_word: מִבְּשַׂר בָּנָיו
  choice: sedikit pun dari daging anak-anak lelakinya
  rationale: בָּשָׂר dipertahankan secara konkret sebagai 'daging', sedangkan bentuk jamak maskulin בָּנָיו diterjemahkan khusus sebagai 'anak-anak lelakinya'. 'Sedikit pun' menyampaikan nilai partitif מִן dan penolakan total dalam konteks.
- source_word: אֲשֶׁר יֹאכֵל
  choice: yang sedang dimakannya
  rationale: Bentuk imperfek menggambarkan tindakan dalam skenario pengepungan secara hidup; aspek progresif Indonesia menyampaikan tindakan yang sedang berlangsung tanpa mengubahnya menjadi pernyataan kebiasaan.
- source_word: מִבְּלִי הִשְׁאִיר לוֹ כֹּל
  choice: sebab tidak ada apa pun yang tersisa baginya
  rationale: Frasa ini menerangkan kelangkaan mutlak yang melatarbelakangi keengganannya berbagi. Rumusan ini alami dalam bahasa Indonesia dan mempertahankan gagasan bahwa tidak ada sesuatu pun yang tersisa baginya.
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: dalam pengepungan dan kesesakan
  rationale: מָצוֹר menunjuk pada pengepungan, sedangkan מָצוֹק menyatakan keadaan terjepit atau kesesakan berat. Pasangan ini mempertahankan dua unsur sumber tanpa meleburkannya.
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיִבְךָ
  choice: yang ditimpakan musuhmu kepadamu
  rationale: Bentuk kausatif צוּק menggambarkan musuh sebagai penyebab tekanan atau kesesakan. 'Ditimpakan ... kepadamu' terdengar wajar dan tetap menyatakan tindakan bermusuhan tersebut.
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: di semua gerbangmu
  rationale: Terjemahan mempertahankan citra harfiah 'gerbang-gerbangmu', yang secara metonimis dapat menunjuk pada kota-kota tempat orang bermukim; makna budaya ini dijelaskan dalam catatan kaki.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan lugas. Kengerian konkret teks dipertahankan tanpa diperhalus, sementara susunan kalimat dibuat alami sebagai kelanjutan ayat sebelumnya. Citra 'gerbang' dipertahankan dalam teks utama dan dijelaskan melalui catatan kaki.
