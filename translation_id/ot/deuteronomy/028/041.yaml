  source_fidelity: 'Teks Indonesia dengan setia menyampaikan unsur-unsur utama Ibrani: pasangan eksplisit “anak-anak lelaki dan perempuan,” tindakan aktif “akan pergi,” dan יעד/keadaan “sebagai tawanan.” “Engkau akan mempunyai” adalah padanan Indonesia modern yang wajar bagi bentuk Hifil maskulin tunggal, tanpa secara tidak semestinya mengubahnya menjadi pasif. “Tidak akan menjadi milikmu” secara konteks mengungkapkan kehilangan anak-anak itu, sambil mempertahankan keluwesan ungkapan Ibrani וְלֹא יִהְיוּ לָךְ.'
