  yaml_path: translation/ot/deuteronomy/028/041.yaml
  text: You will father sons and daughters[a], but they will not remain yours[b], because they will go into captivity.
translation:
  language: id
  text: Engkau akan mempunyai anak-anak lelaki dan perempuan, tetapi mereka tidak akan menjadi milikmu,[a] sebab mereka akan pergi sebagai tawanan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “mereka tidak akan ada bagimu” atau “mereka tidak akan menjadi kepunyaanmu.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “mereka akan pergi ke dalam penawanan.” Konteksnya mencakup pembuangan, tetapi kata Ibraninya secara khusus menunjuk pada penawanan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנִים וּבָנוֹת
  choice: anak-anak lelaki dan perempuan
  rationale: Ungkapan Ibrani secara eksplisit menyebut keturunan laki-laki dan perempuan. Terjemahan ini mempertahankan pasangan tersebut tanpa meringkasnya menjadi istilah umum "anak-anak".
- source_word: תּוֹלִיד
  choice: Engkau akan mempunyai
  rationale: Bentuk Hifil orang kedua tunggal maskulin dari ילד menyatakan bahwa orang yang disapa akan menghasilkan keturunan. "Akan mempunyai" menyampaikan maknanya secara alami dalam bahasa Indonesia modern; pilihan yang lebih harfiah seperti "memperanakkan" terasa kaku dan biasanya memerlukan objek atau pelengkap tambahan.
- source_word: וְלֹא יִהְיוּ לָךְ
  choice: tetapi mereka tidak akan menjadi milikmu
  rationale: Secara harfiah ungkapan ini berarti "dan mereka tidak akan ada bagimu/menjadi kepunyaanmu." Terjemahan ini mempertahankan keterbukaan ungkapan Ibrani mengenai hilangnya hubungan atau penguasaan karena anak-anak itu menjadi tawanan, tanpa menambahkan kata "tetap" ke dalam teks utama.
- source_word: כִּי
  choice: sebab
  rationale: Di sini כִּי memperkenalkan alasan mengapa anak-anak itu tidak akan menjadi milik orang yang disapa. "Sebab" merupakan penghubung kausal yang jelas dan bermartabat.
- source_word: יֵלְכוּ
  choice: mereka akan pergi
  rationale: Kata kerja Qal dari הלך bersifat aktif dan berarti "pergi." Terjemahan aktif dipertahankan agar tidak memasukkan bentuk pasif "akan dibawa," meskipun konteksnya jelas menunjuk pada deportasi paksa.
- source_word: בַּשֶּׁבִי
  choice: sebagai tawanan
  rationale: שֶׁבִי menunjuk pada keadaan ditawan atau penawanan, khususnya dalam perang dan deportasi. Sesudah kata "pergi," frasa "sebagai tawanan" lebih alami dalam bahasa Indonesia daripada ungkapan harfiah "ke dalam penawanan," sambil tetap mempertahankan unsur penawanan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti "Engkau" mempertahankan sapaan orang kedua tunggal yang bersifat representatif dalam rangkaian kutuk perjanjian. Susunan kalimat dibuat alami tanpa menghilangkan bentuk aktif dan ketegangan ungkapan Ibrani.
