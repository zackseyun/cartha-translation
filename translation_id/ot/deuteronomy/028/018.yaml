  terminology: '“Terkutuklah,” “buah kandunganmu,” dan istilah ternak yang dipakai sesuai register Alkitabiah Indonesia dan tidak menambahkan penafsiran teologis. “Kambing domba” secara kolektif memadai untuk צֹאן, yang mencakup kambing dan domba. Penanda catatan kaki ditempatkan secara tepat: [a] pada “buah tanahmu” untuk alternatif leksikalnya, dan [b] pada kelompok ternak.'
