  verdict: approve
  source_fidelity: 'Terjemahan dengan tepat mencerminkan struktur dan makna Ibrani: formula kutuk אָרוּר, kesejajaran “buah kandunganmu” dan “buah tanahmu,” serta dua kelompok hasil ternak, yaitu ternak sapi dan kambing-domba. Metafora “buah” dipertahankan tanpa mengaburkan arti keturunan dan hasil tanah.'
