  text: אָר֥וּר פְּרִֽי בִטְנְ/ךָ֖ וּ/פְרִ֣י אַדְמָתֶ֑/ךָ שְׁגַ֥ר אֲלָפֶ֖י/ךָ וְ/עַשְׁתְּר֥וֹת צֹאנֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/018.yaml
  text: Cursed shall be the fruit of your womb[a], and the fruit of your ground[b], the offspring of your herds and the young of your flocks.
translation:
  language: id
  text: Terkutuklah buah kandunganmu dan buah tanahmu[a], anak-anak sapimu dan anak-anak kambing dombamu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hasil tanahmu.” Secara harfiah, bahasa Ibrani berbunyi “buah tanahmu,” sejajar dengan “buah kandunganmu.”
    reason: lexical_alternative
  - marker: b
    text: 'Ungkapan-ungkapan Ibrani di sini secara khusus menunjuk pada anak atau pertambahan ternak: sapi serta kambing dan domba.'
    reason: cultural_note
lexical_decisions:
- source_word: אָרוּר
  choice: Terkutuklah
  rationale: Bentuk ini menyampaikan rumusan kutuk yang deklaratif dan mempertahankan irama khidmat konteks kutuk perjanjian.
- source_word: פְּרִי בִטְנְךָ
  choice: buah kandunganmu
  rationale: Ungkapan ini merupakan idiom Ibrani bagi keturunan atau anak-anak. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan metafora buah.
- source_word: וּפְרִי אַדְמָתֶךָ
  choice: dan buah tanahmu
  rationale: אָדָמָה menunjuk pada tanah atau lahan yang diusahakan. Terjemahan ini mempertahankan pengulangan kata 'buah' dan kesejajaran dengan 'buah kandunganmu'; maknanya sebagai hasil tanah dijelaskan dalam catatan kaki.
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: anak-anak sapimu
  rationale: שְׁגַר menunjuk pada anak atau hasil perkembangbiakan ternak besar, sedangkan אֲלָפֶיךָ dalam konteks ini menunjuk pada sapi. Ungkapan ini jelas dan wajar bagi pembaca modern.
- source_word: וְעַשְׁתְּרֹת צֹאנֶךָ
  choice: dan anak-anak kambing dombamu
  rationale: Ungkapan ini menunjuk pada anak atau pertambahan ternak kecil; צֹאן mencakup domba dan kambing. 'Kambing domba' mempertahankan cakupan kolektif tersebut tanpa mengaitkan עַשְׁתְּרֹת dengan nama dewi Astoret.
