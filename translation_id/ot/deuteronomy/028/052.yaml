base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/052.yaml
  text: And he will besiege you in all your gates until your high and fortified walls, in which you trust, come down throughout all your land; and he will besiege you in all your gates throughout all your land that Yahweh your God has given you.
translation:
  language: id
  text: Ia akan mengepungmu di semua gerbangmu sampai tembok-tembokmu yang tinggi dan diperkuat, yang engkau andalkan itu, runtuh di seluruh negerimu. Ia akan mengepungmu di semua gerbangmu, di seluruh negerimu yang telah diberikan Yahweh, Allahmu, kepadamu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵצַר
  choice: Ia akan mengepung
  rationale: Bentuk Hifil dari צור dalam konteks gerbang dan tembok menyatakan tindakan militer mengepung atau menghimpit sebuah kota. Pengulangan frasa diterjemahkan secara konsisten.
- source_word: שְׁעָרֶיךָ
  choice: di semua gerbangmu
  rationale: Secara harfiah berarti “gerbang-gerbangmu” dan secara metonimis dapat menunjuk pada kota-kota. “Gerbangmu” dipertahankan agar gambaran konkret pengepungan tidak hilang.
- source_word: עַד רֶדֶת
  choice: sampai ... runtuh
  rationale: Secara harfiah berarti “sampai ... turun”. Dalam hubungan dengan tembok yang dikepung, “runtuh” menyampaikan maksud kontekstualnya dengan wajar dalam bahasa Indonesia.
- source_word: חֹמֹתֶיךָ הַגְּבֹהוֹת וְהַבְּצֻרוֹת
  choice: tembok-tembokmu yang tinggi dan berkubu
  rationale: Kedua sifat tembok dipertahankan. “Berkubu” menyatakan bahwa tembok itu diperkuat sebagai pertahanan.
- source_word: אֲשֶׁר אַתָּה בֹּטֵחַ בָּהֵן
  choice: yang kauandalkan itu
  rationale: בטח dengan preposisi ב menyatakan kepercayaan atau ketergantungan. “Kauandalkan” paling alami untuk keyakinan pada pertahanan kota.
- source_word: בְּכָל אַרְצֶךָ
  choice: di seluruh negerimu
  rationale: Ungkapan ini menyatakan cakupan menyeluruh dan diterjemahkan secara idiomatis dalam bahasa Indonesia.
- source_word: אֲשֶׁר נָתַן יְהוָה אֱלֹהֶיךָ לָךְ
  choice: yang diberikan Yahweh, Allahmu, kepadamu
  rationale: Bentuk perfektif Ibrani menyajikan negeri itu sebagai pemberian Yahweh. Susunan Indonesia ini tetap alami dan mempertahankan hubungan posesif “Allahmu”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, untuk mempertahankan nama perjanjian dalam teks sumber.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; “Yahweh” mempertahankannya sebagai nama pribadi tanpa menggantinya dengan gelar.
- issue: Metonimia “gerbang” bagi permukiman berkota
  choice: Mempertahankan “gerbangmu”
  alternative: kota-kotamu
  rationale: Kata Ibrani secara konkret berarti “gerbang”, walaupun dalam konteks dapat mewakili kota. Mempertahankan citra gerbang menjaga hubungan erat dengan pengepungan dan tembok tanpa menutup kemungkinan makna metonimisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti “engkau” mempertahankan sapaan tunggal dan sesuai dengan ragam Alkitab yang bermartabat; bentuk terikat “kauandalkan” menjaga kelancaran. Pengulangan klausa dari teks Ibrani dipertahankan.
