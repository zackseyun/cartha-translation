  text: וּ/בָ֨אוּ עָלֶ֜י/ךָ כָּל הַ/קְּלָל֣וֹת הָ/אֵ֗לֶּה וּ/רְדָפ֨וּ/ךָ֙ וְ/הִשִּׂיג֔וּ/ךָ עַ֖ד הִשָּֽׁמְדָ֑/ךְ כִּי לֹ֣א שָׁמַ֗עְתָּ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֛ר מִצְוֺתָ֥י/ו וְ/חֻקֹּתָ֖י/ו אֲשֶׁ֥ר צִוָּֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/045.yaml
  text: And all these curses will come upon you and pursue you and overtake you[a], until you are destroyed, because you did not listen to the voice of Yahweh your God, to keep his commandments and his statutes that he commanded you.
translation:
  language: id
  text: Semua kutuk ini akan menimpa kamu, mengejar kamu, dan menyusul kamu sampai kamu dibinasakan, karena kamu tidak mendengarkan suara Yahweh, Allahmu, dengan menaati perintah-perintah dan ketetapan-ketetapan yang diperintahkan-Nya kepadamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “karena kamu tidak menaati Yahweh, Allahmu, dengan melakukan perintah-perintah dan ketetapan-ketetapan-Nya yang diperintahkan-Nya kepadamu.” Secara harfiah, bahasa Ibrani berbunyi “tidak mendengarkan suara.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ עָלֶיךָ
  choice: akan menimpa kamu
  rationale: Dalam konteks ancaman perjanjian, bentuk perfektum berfungsi futur; 'menimpa' secara alami menyampaikan datangnya kutuk atas seseorang.
- source_word: כָּל הַקְּלָלוֹת הָאֵלֶּה
  choice: semua kutuk ini
  rationale: '''Kutuk'' merupakan padanan lazim dan sesuai bagi קְלָלוֹת dalam bagian berkat dan kutuk.'
- source_word: וּרְדָפוּךָ וְהִשִּׂיגוּךָ
  choice: mengejar kamu, dan menyusul kamu
  rationale: '''Mengejar'' mempertahankan gambaran רדף, sedangkan ''menyusul'' menyampaikan bahwa kutuk itu berhasil mencapai orang yang dikejar.'
- source_word: עַד הִשָּׁמְדָךְ
  choice: sampai kamu dibinasakan
  rationale: Ungkapan ini menyatakan titik akhir berupa kebinasaan dan mempertahankan nuansa pasif tanpa menambahkan pelaku secara eksplisit.
- source_word: כִּי לֹא שָׁמַעְתָּ בְּקוֹל
  choice: karena kamu tidak mendengarkan suara
  rationale: Padanan ini mempertahankan metafora auditori Ibrani, sementara kelanjutan ayat menjelaskan bahwa mendengarkan berarti menaati.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Allahmu
  rationale: Nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh'; aposisi 'Allahmu' dibuat jelas dengan tanda koma dalam bahasa Indonesia.
- source_word: לִשְׁמֹר מִצְוֺתָיו וְחֻקֹּתָיו
  choice: dengan menaati perintah-perintah dan ketetapan-ketetapan
  rationale: Dalam konstruksi ini, infinitif menjelaskan isi atau wujud mendengarkan suara Yahweh. 'Dengan menaati' alami dalam bahasa Indonesia dan membuat kaitan tersebut jelas.
- source_word: אֲשֶׁר צִוָּךְ
  choice: yang diperintahkan-Nya kepadamu
  rationale: Klausa relatif ini mempertahankan sumber ilahi dari perintah dan ketetapan tersebut, dengan bentuk hormat '-Nya' sesuai kelaziman bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri perjanjian secara langsung; 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Makna שׁמע בקול antara 'mendengarkan suara' dan 'menaati'
  choice: mempertahankan 'mendengarkan suara', lalu menjelaskan wujudnya dengan 'dengan menaati'
  alternative: tidak menaati Yahweh, Allahmu
  rationale: Pilihan ini menjaga metafora dan tekstur teologis bahasa Ibrani tanpa mengaburkan implikasi ketaatannya.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Pengulangan 'kamu' dipertahankan untuk daya retoris, sedangkan 'menimpa—mengejar—menyusul' menjaga gerak bertahap dalam teks Ibrani.
