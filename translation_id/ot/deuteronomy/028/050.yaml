lexical_decisions:
- source_word: גּוֹי
  choice: bangsa
  rationale: Dalam konteks kutuk perjanjian ini, גּוֹי menunjuk pada suatu bangsa asing yang menyerbu; “bangsa” jelas dan alami dalam bahasa Indonesia.
- source_word: עַז פָּנִים
  choice: berwajah garang
  rationale: Ungkapan harfiahnya adalah “kuat/garang wajahnya.” Pilihan ini mempertahankan citra wajah sekaligus menyampaikan kekerasan dan keganasan sikap secara alami.
- source_word: אֲשֶׁר
  choice: yang
  rationale: Kata penghubung relatif ini memperkenalkan sifat bangsa tersebut dan paling alami diterjemahkan “yang.”
- source_word: לֹא יִשָּׂא פָנִים לְזָקֵן
  choice: tidak menghormati orang tua
  rationale: Idiom נָשָׂא פָּנִים, secara harfiah “mengangkat wajah,” dapat berarti menunjukkan penghargaan atau perkenanan. Dalam kaitannya dengan orang yang lanjut usia, “tidak menghormati” menyampaikan maksudnya dengan jelas.
- source_word: זָקֵן
  choice: orang tua
  rationale: Bentuk tunggal ini berfungsi generik untuk orang yang telah lanjut usia. “Orang tua” alami dalam bahasa Indonesia, meski dapat pula dipahami sebagai orang tua kandung; catatan kaki memperjelas maknanya.
- source_word: וְנַעַר
  choice: orang muda
  rationale: נַעַר memiliki rentang arti dari anak hingga pemuda. Karena dipertentangkan dengan זָקֵן, “orang muda” mempertahankan pasangan kategori usia tanpa mempersempit artinya.
- source_word: לֹא יָחֹן
  choice: tidak mengasihani
  rationale: Akar חנן berarti menunjukkan kemurahan, belas kasih, atau perkenanan. Dalam konteks bangsa penyerbu yang kejam terhadap kaum muda, “tidak mengasihani” menyampaikan daya ungkapnya dengan wajar sambil mempertahankan kemungkinan nuansa belas kasih.
