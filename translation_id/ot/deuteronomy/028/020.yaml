revisions:
- from: Yahweh akan mendatangkan atasmu kutuk, kekacauan, dan hardikan dalam segala usaha yang kaulakukan.[a] Ia akan melakukannya sampai engkau dibinasakan dan segera lenyap, karena jahatnya perbuatanmu, yaitu karena engkau telah meninggalkan Aku.
  to: Yahweh akan mendatangkan atasmu kutuk, kekacauan, dan hardikan dalam segala usaha yang kaulakukan,[a] sampai engkau dibinasakan dan lenyap dengan segera, karena jahatnya perbuatanmu, yang dengannya engkau telah meninggalkan Aku.
  rationale: Revisi menghapus bahan yang tidak terdapat dalam teks sumber, mempertahankan urutan dan hubungan antarklausa Ibrani, serta menyatakan hubungan relatif-instrumental pada bagian akhir tanpa memaksakan satu penafsiran kausal. Penanda catatan kaki tetap ditempatkan pada idiom “segala usaha yang kaulakukan.”
