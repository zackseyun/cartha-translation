review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan karena kalimat tambahan “Ia akan melakukannya” tidak ada dalam bahasa Ibrani dan rujukannya tidak jelas. Selain itu, “yaitu karena engkau telah meninggalkan Aku” mengubah hubungan klausa relatif אֲשֶׁר עֲזַבְתָּנִי menjadi penjelasan kausal yang lebih tegas daripada teks sumber. Revisi mempertahankan kaitan instrumental dengan “perbuatanmu.”
  naturalness: Teks revisi tetap memakai bahasa Indonesia modern dan lugas. Rangkaian penghukuman dipertahankan dalam satu kalimat sebagaimana struktur sumber, tanpa pengulangan subjek atau verba yang tidak diperlukan.
  terminology: “Yahweh,” “kutuk,” “kekacauan,” dan “hardikan” dapat dipertahankan. “Segala usaha yang kaulakukan” menyampaikan idiom Ibrani מִשְׁלַח יָד secara alami; catatan kaki memberi gambaran harfiahnya.
  issues:
  - severity: medium
    issue: Penambahan “Ia akan melakukannya.”
    rationale: Bahasa Ibrani tidak memiliki kalimat atau verba tambahan setelah daftar penghukuman. Tambahan ini juga tidak jelas apakah menunjuk pada tindakan mengirim, membinasakan, atau melenyapkan.
  - severity: medium
    issue: “Yaitu karena engkau telah meninggalkan Aku” menafsirkan klausa relatif terlalu sempit.
    rationale: אֲשֶׁר עֲזַבְתָּנִי secara harfiah mengaitkan tindakan meninggalkan Yahweh dengan “perbuatanmu”; seperti audit bahasa Inggris, hubungan itu dapat dipahami secara instrumental. Terjemahan perlu menghindari pengubahan menjadi sebab tambahan yang eksplisit.
  - severity: low
    issue: Catatan kaki dapat dibuat lebih tepat dan lebih alami.
    rationale: “Uluran tanganmu yang kaulakukan” tidak idiomatis dalam bahasa Indonesia. Catatan dapat menjelaskan bahwa ungkapan itu secara harfiah merujuk pada “setiap uluran tanganmu” dan bermakna semua yang dikerjakan.
  revised_text: Yahweh akan mendatangkan atasmu kutuk, kekacauan, dan hardikan dalam segala usaha yang kaulakukan,[a] sampai engkau dibinasakan dan lenyap dengan segera, karena jahatnya perbuatanmu, yang dengannya engkau telah meninggalkan Aku.
  revised_footnotes:
  - marker: a
    text: 'Secara harfiah: “dalam setiap uluran tanganmu,” yaitu dalam segala sesuatu yang kaulakukan atau yang kauusahakan.'
    reason: Ungkapan Ibrani “uluran tangan” merupakan idiom untuk segala pekerjaan atau usaha yang dilakukan seseorang.
  revision_rationale: Revisi menghapus bahan yang tidak terdapat dalam teks sumber, mempertahankan urutan dan hubungan antarklausa Ibrani, serta menyatakan hubungan relatif-instrumental pada bagian akhir tanpa memaksakan satu penafsiran kausal. Penanda catatan kaki tetap ditempatkan pada idiom “segala usaha yang kaulakukan.”
