source:
  edition: WLC
  text: יְשַׁלַּ֣ח יְהוָ֣ה בְּ֠/ךָ אֶת הַ/מְּאֵרָ֤ה אֶת הַ/מְּהוּמָה֙ וְ/אֶת הַ/מִּגְעֶ֔רֶת בְּ/כָל מִשְׁלַ֥ח יָדְ/ךָ֖ אֲשֶׁ֣ר תַּעֲשֶׂ֑ה עַ֣ד הִשָּֽׁמֶדְ/ךָ֤ וְ/עַד אֲבָדְ/ךָ֙ מַהֵ֔ר מִ/פְּנֵ֛י רֹ֥עַ מַֽעֲלָלֶ֖י/ךָ אֲשֶׁ֥ר עֲזַבְתָּֽ/נִי׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/020.yaml
  text: Yahweh will send on you the curse[a], the confusion, and the rebuke in every undertaking of your hand that you do, until you are destroyed and until you perish quickly, because of the evil of your deeds by which you have forsaken me.
translation:
  language: id
  text: Yahweh akan mendatangkan atasmu kutuk, kekacauan, dan hardikan dalam segala usaha yang kaulakukan,[a] sampai engkau dibinasakan dan lenyap dengan segera, karena jahatnya perbuatanmu, yang dengannya engkau telah meninggalkan Aku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dalam setiap uluran tanganmu,” yaitu dalam segala sesuatu yang kaulakukan atau yang kauusahakan.'
    reason: Ungkapan Ibrani “uluran tangan” merupakan idiom untuk segala pekerjaan atau usaha yang dilakukan seseorang.
lexical_decisions:
- source_word: יְשַׁלַּח
  choice: akan mendatangkan
  rationale: Bentuk piel menyatakan tindakan aktif Yahweh mengirimkan atau menyebabkan sanksi perjanjian menimpa umat. Dalam bahasa Indonesia, “mendatangkan atasmu” lebih alami daripada “mengirimkan atasmu” untuk kutuk, kekacauan, dan hardikan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: הַמְּאֵרָה
  choice: kutuk
  rationale: Nomina ini menunjuk pada kutuk sebagai sanksi perjanjian. “Kutuk” ringkas, wajar, dan mempertahankan bentuk tunggalnya.
- source_word: הַמְּהוּמָה
  choice: kekacauan
  rationale: Kata ini dapat mencakup kekacauan, kegemparan, atau kepanikan. “Kekacauan” mempertahankan cakupan makna yang luas dalam konteks terganggunya setiap usaha.
- source_word: הַמִּגְעֶרֶת
  choice: hardikan
  rationale: Nomina dari גער menyatakan teguran keras, khususnya tindakan ilahi yang kuat. “Hardikan” lebih tegas daripada “teguran” dan sesuai dengan konteks penghukuman.
- source_word: בְּכָל מִשְׁלַח יָדְךָ אֲשֶׁר תַּעֲשֶׂה
  choice: dalam segala usaha yang kaulakukan
  rationale: Ungkapan harfiahnya berbicara tentang segala sesuatu yang kepadanya seseorang mengulurkan tangannya. Terjemahan ini menyampaikan idiom tersebut secara alami, sedangkan gambaran tangan dicatat dalam catatan kaki.
- source_word: עַד הִשָּׁמֶדְךָ
  choice: sampai engkau dibinasakan
  rationale: Infinitif nifal menyatakan batas akhir berupa kebinasaan yang menimpa orang kedua tunggal. Bentuk pasif mempertahankan nuansa sumber.
- source_word: וְעַד אֲבָדְךָ מַהֵר
  choice: dan segera lenyap
  rationale: אבד menyatakan lenyap atau binasa. “Lenyap” membedakannya dari השמד yang sudah diterjemahkan “dibinasakan”, sementara “segera” menyampaikan מַהֵר secara alami.
- source_word: מִפְּנֵי רֹעַ מַעֲלָלֶיךָ
  choice: karena jahatnya perbuatanmu
  rationale: מִפְּנֵי bersifat kausal di sini, sedangkan רֹעַ menunjuk pada sifat jahat dari perbuatan orang yang disapa.
- source_word: אֲשֶׁר עֲזַבְתָּנִי
  choice: yaitu karena engkau telah meninggalkan Aku
  rationale: Klausa ini menjelaskan kejahatan yang mendatangkan hukuman. “Yaitu karena” menghubungkannya dengan frasa sebelumnya tanpa mengaburkan tindakan meninggalkan Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. Transliterasi “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Pelaku penghukuman perjanjian
  choice: Yahweh secara aktif mendatangkan kutuk, kekacauan, dan hardikan
  alternative: Kutuk itu datang secara impersonal
  rationale: יְהוָה adalah subjek eksplisit dari יְשַׁלַּח. Terjemahan tidak melunakkan atau menghapus tindakan langsung Yahweh dalam penghukuman ini.
- issue: Hubungan frasa “engkau telah meninggalkan Aku” dengan perbuatan jahat
  choice: Dipahami sebagai penjelasan atas kejahatan perbuatan mereka
  alternative: 'Dipahami sebagai klausa relatif instrumental: “yang dengannya engkau telah meninggalkan Aku”'
  rationale: אֲשֶׁר dapat menghubungkan tindakan meninggalkan Yahweh dengan “perbuatanmu” dalam lebih dari satu cara. “Yaitu karena” menghasilkan bahasa Indonesia alami sambil mempertahankan bahwa meninggalkan Yahweh merupakan inti alasan penghukuman.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Bentuk terikat “kaulakukan” dipakai agar alirannya alami. Kata “Aku” diawali huruf kapital karena merupakan ucapan Yahweh dalam wacana perjanjian. Kalimat kedua menambahkan subjek eksplisit “Ia” untuk menghindari rangkaian klausa yang terlalu berat dalam bahasa Indonesia tanpa mengubah pelaku tindakan.
