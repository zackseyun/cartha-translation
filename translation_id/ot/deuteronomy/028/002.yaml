source:
  edition: WLC
  text: וּ/בָ֧אוּ עָלֶ֛י/ךָ כָּל הַ/בְּרָכ֥וֹת הָ/אֵ֖לֶּה וְ/הִשִּׂיגֻ֑/ךָ כִּ֣י תִשְׁמַ֔ע בְּ/ק֖וֹל יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/002.yaml
  text: And all these blessings will come upon you and overtake you[a], if you obey the voice of Yahweh your God.
translation:
  language: id
  text: Segala berkat ini akan datang atasmu dan menyusulmu, jika engkau mendengarkan suara Yahweh, Allahmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani “mendengarkan suara” juga dapat diterjemahkan “menaati suara”; dalam konteks ini, mendengarkan mencakup mengindahkan dan menaati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ עָלֶיךָ
  choice: akan datang atasmu
  rationale: Bentuk verba menyatakan akibat yang akan terjadi dalam konteks berkat bersyarat, sedangkan עַל mempertahankan gambaran berkat yang datang ‘atas’ orang yang disapa.
- source_word: כָּל הַבְּרָכוֹת הָאֵלֶּה
  choice: segala berkat ini
  rationale: Padanan langsung dan alami untuk frasa yang mencakup seluruh berkat yang disebutkan.
- source_word: וְהִשִּׂיגֻךָ
  choice: dan menyusulmu
  rationale: Hifil dari נשׂג menggambarkan sesuatu yang mengejar lalu mencapai sasaran; ‘menyusulmu’ mempertahankan citra hidup tersebut dalam bahasa Indonesia.
- source_word: כִּי
  choice: jika
  rationale: Dalam konteks berkat perjanjian ini, partikel tersebut memperkenalkan syarat bagi datangnya berkat.
- source_word: תִשְׁמַע בְּקוֹל
  choice: mendengarkan suara
  rationale: Terjemahan ini mempertahankan ungkapan Ibrani dan ketegangannya antara mendengar, mengindahkan, dan menaati; catatan kaki menjelaskan daya idiomatisnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan agar nama perjanjian dalam teks sumber tetap tampak, bukan diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: 'Bentuk bersufiks orang kedua tunggal menyatakan hubungan langsung: ‘Allahmu’.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks menggunakan nama ilahi secara langsung; ‘Yahweh’ mempertahankan nama itu dan membedakannya dari sebuah gelar.
- issue: Daya ungkapan שׁמע בְּקוֹל dalam konteks perjanjian
  choice: mendengarkan suara
  alternative: menaati
  rationale: Ungkapan ini mencakup mendengar dengan tanggapan taat. Teks utama mempertahankan citra dan keluasan makna bahasa Ibrani, sementara catatan kaki menjelaskan implikasi ketaatannya.
- issue: Hubungan כִּי dengan klausa berkat
  choice: jika
  alternative: karena
  rationale: Konteks langsung menyajikan ketaatan sebagai syarat bagi berkat, sehingga ‘jika’ paling jelas menyampaikan hubungan tersebut tanpa menjadikannya alasan yang sudah terpenuhi.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan khidmat. Kata ganti tunggal ‘engkau’ mempertahankan sapaan orang kedua tunggal dalam bahasa Ibrani. Frasa ‘datang atasmu dan menyusulmu’ sengaja mempertahankan citra puitis berkat yang bergerak menuju dan mencapai orang yang taat.
