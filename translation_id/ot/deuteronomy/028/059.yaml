base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/059.yaml
  text: then Yahweh will make your plagues and the plagues of your offspring extraordinary—great and lasting plagues[b][a], and severe and lasting sicknesses.
translation:
  language: id
  text: maka Yahweh akan menjadikan tulah-tulahmu dan tulah-tulah keturunanmu luar biasa[a]—tulah-tulah besar dan berkepanjangan[b], serta penyakit-penyakit parah dan berkepanjangan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mencengangkan.” Kata kerja Ibrani ini dapat berarti membuat sesuatu menjadi luar biasa atau menakjubkan; di sini kata itu menggambarkan kedahsyatan penghakiman yang tidak biasa.
    reason: lexical_alternative
  - marker: b
    text: “Berkepanjangan” menerjemahkan kata Ibrani yang berarti teguh, bertahan, atau terus menetap. Kata yang sama dipakai untuk tulah-tulah dan penyakit-penyakit.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִפְלָא
  choice: akan menjadikan ... luar biasa
  rationale: Bentuk Hifil dari פלא menyatakan bahwa tulah-tulah itu dibuat menjadi luar biasa atau mencengangkan. Dalam konteks kutuk, frasa ini menunjukkan kedahsyatan yang tidak biasa, bukan sesuatu yang mengagumkan dalam arti positif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: מַכֹּתְךָ / מַכּוֹת
  choice: tulah-tulahmu / tulah-tulah
  rationale: מכה dapat berarti pukulan, hantaman, atau tulah. Dalam konteks kutuk perjanjian dan paralelnya dengan penyakit, 'tulah' menyampaikan malapetaka yang ditimpakan dengan tepat.
- source_word: זַרְעֶךָ
  choice: keturunanmu
  rationale: Kata ini merupakan nomina kolektif untuk anak cucu atau keturunan; 'keturunanmu' alami dalam bahasa Indonesia modern.
- source_word: גְּדֹלוֹת
  choice: besar
  rationale: Mempertahankan arti dasar 'besar' dan dalam konteks ini menunjukkan besarnya atau beratnya tulah.
- source_word: נֶאֱמָנוֹת / נֶאֱמָנִים
  choice: berkepanjangan
  rationale: Bentuk dari אמן di sini menyatakan sesuatu yang teguh, bertahan, atau terus menetap. 'Berkepanjangan' sesuai untuk tulah dan penyakit serta mempertahankan pengulangan kata Ibrani yang sama.
- source_word: חֳלָיִם
  choice: penyakit-penyakit
  rationale: Nomina jamak ini merujuk pada berbagai penyakit; bentuk ulang mempertahankan makna jamaknya secara jelas.
- source_word: רָעִים
  choice: parah
  rationale: Walaupun arti dasarnya 'buruk/jahat', ketika menerangkan penyakit kata ini secara kontekstual berarti berat atau parah.
theological_decisions:
- issue: Penerjemahan nama perjanjian יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Bentuk 'Yahweh' mempertahankan fungsi teks sebagai nama pribadi Allah dan menghindari penggantian nama itu dengan sebuah gelar.
- issue: Daya ungkap פלא dalam konteks penghakiman
  choice: menjadikan ... luar biasa
  alternative: menjadikan ... mencengangkan
  rationale: Pilihan ini mempertahankan gagasan bahwa tulah-tulah tersebut bersifat luar biasa tanpa mengubahnya menjadi ungkapan positif. Catatan kaki menjelaskan nuansa kedahsyatannya.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. 'Tulah' dipilih karena sesuai dengan konteks kutuk ilahi, sedangkan 'berkepanjangan' terdengar alami untuk tulah maupun penyakit dan mempertahankan pengulangan sumber.
