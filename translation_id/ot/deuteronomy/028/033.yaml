base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/033.yaml
  text: A people whom you have not known will eat the fruit of your land and all your labor[b][a], and you will be only oppressed and crushed all your days.
translation:
  language: id
  text: Bangsa yang tidak kaukenal akan memakan hasil tanahmu[a] dan segala hasil jerih payahmu[b]. Engkau hanya akan ditindas dan diremukkan sepanjang hidupmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “buah tanahmu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “segala jerih payahmu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּרִי אַדְמָתְךָ
  choice: hasil tanahmu
  rationale: Secara harfiah berarti 'buah tanahmu', tetapi dalam konteks pertanian frasa ini menunjuk pada hasil bumi. 'Hasil tanahmu' alami dalam bahasa Indonesia dan tetap mempertahankan gambaran agraris.
- source_word: יְגִיעֲךָ
  choice: hasil jerih payahmu
  rationale: Nomina ini dapat menunjuk pada jerih payah maupun hasil yang diperoleh darinya. Karena menjadi objek kata 'memakan', 'hasil jerih payahmu' menyampaikan maksudnya secara wajar tanpa menghilangkan nuansa kerja keras.
- source_word: יֹאכַל
  choice: akan memakan
  rationale: Mempertahankan verba konkret Ibrani biasa untuk makan atau menghabiskan hasil bumi, tanpa menambahkan intensitas seperti 'melahap'.
- source_word: עַם אֲשֶׁר לֹא יָדָעְתָּ
  choice: bangsa yang tidak kaukenal
  rationale: עַם adalah kelompok kolektif dan ידע dalam konteks ini menyatakan ketidakkenalan dengan bangsa asing tersebut. Bentuk ini ringkas dan alami.
- source_word: רַק עָשׁוּק וְרָצוּץ
  choice: akan terus ditindas dan diremukkan
  rationale: רַק menekankan keadaan yang tidak kunjung lepas, sedangkan kedua bentuk pasif menyatakan penindasan dan penghancuran. 'Terus' bersama keterangan durasi mengungkapkan tekanan eksklusifnya secara alami.
- source_word: כָּל הַיָּמִים
  choice: sepanjang hidupmu
  rationale: Ungkapan harfiah 'sepanjang hari-hari' secara idiomatis berarti terus-menerus atau selama hidup. Pilihan ini jelas dan mempertahankan sapaan tunggal.
