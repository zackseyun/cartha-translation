translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal 'engkau' dan bentuk enklitik '-mu'/'kau-' yang sesuai dengan wacana perjanjian. Susunan kalimat dibuat alami dan bermartabat; kalimat kedua menonjolkan durasi penindasan yang berkelanjutan.
