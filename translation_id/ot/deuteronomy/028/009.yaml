  text: יְקִֽימְ/ךָ֨ יְהוָ֥ה ל/וֹ֙ לְ/עַ֣ם קָד֔וֹשׁ כַּ/אֲשֶׁ֖ר נִֽשְׁבַּֽע לָ֑/ךְ כִּ֣י תִשְׁמֹ֗ר אֶת מִצְוֺת֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הָלַכְתָּ֖ בִּ/דְרָכָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/009.yaml
  text: Yahweh will establish you for himself as a holy people[a], just as he swore to you, if you keep the commandments of Yahweh your God and walk in his ways.
translation:
  language: id
  text: Yahweh akan menetapkan engkau bagi diri-Nya sendiri sebagai umat yang kudus, seperti yang telah dijanjikan-Nya dengan sumpah kepadamu, jika[a] engkau menaati perintah-perintah Yahweh, Allahmu, dan hidup menurut jalan-jalan-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “karena engkau menaati perintah-perintah Yahweh, Allahmu.” Kata penghubung Ibrani yang diterjemahkan “jika” juga dapat bermakna kausal, meskipun konteks di sini lebih mendukung arti bersyarat.'
    reason: alternative_reading
lexical_decisions:
- source_word: יְקִימְךָ
  choice: akan menetapkan engkau
  rationale: Bentuk Hifil dari קום di sini berarti membuat berdiri atau menetapkan dalam kedudukan perjanjian, bukan mengangkat secara fisik.
- source_word: לּוֹ
  choice: bagi diri-Nya sendiri
  rationale: 'Ungkapan ini mempertahankan nuansa relasi dan kepemilikan: Israel ditetapkan sebagai umat yang menjadi milik Yahweh.'
- source_word: לְעַם קָדוֹשׁ
  choice: sebagai umat yang kudus
  rationale: Frasa ini menyatakan status yang dihasilkan dan mempertahankan bahasa identitas perjanjian.
- source_word: כַּאֲשֶׁר נִשְׁבַּע לָךְ
  choice: seperti yang telah dijanjikan-Nya dengan sumpah kepadamu
  rationale: Terjemahan ini menyampaikan bahwa janji tersebut diteguhkan dengan sumpah, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: כִּי
  choice: jika
  rationale: Dalam kerangka berkat dan kutuk di Ulangan 28, konjungsi ini paling wajar memperkenalkan syarat, meskipun makna kausal tetap mungkin.
- source_word: תִשְׁמֹר אֶת מִצְוֺת
  choice: menaati perintah-perintah
  rationale: שׁמר dengan objek berupa perintah berarti memelihara atau menaatinya; 'menaati' paling jelas bagi pembaca Indonesia modern.
- source_word: וְהָלַכְתָּ בִּדְרָכָיו
  choice: dan hidup menurut jalan-jalan-Nya
  rationale: Pilihan ini mempertahankan gambaran 'jalan' sambil menjelaskan bahwa ungkapan tersebut berbicara tentang pola hidup dan perilaku.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan untuk mempertahankan nama pribadi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: 'Bentuk bersufiks ini menyatakan relasi perjanjian secara langsung: ''Allahmu''.'
theological_decisions:
- issue: Daya kondisional klausa ketaatan
  choice: jika engkau menaati ... dan hidup
  alternative: karena engkau menaati ... dan hidup
  rationale: Konteks berkat-kutuk dan susunan ayat mendukung pembacaan kondisional, tetapi kemungkinan kausal dari כִּי dicatat agar ambiguitas bahasa sumber tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ilahi ditulis dengan huruf kapital menurut kebiasaan ejaan religius Indonesia. Bentuk tunggal 'engkau' dipertahankan karena sufiks dan verba Ibrani mengacu kepada Israel secara kolektif sebagai satu umat.
