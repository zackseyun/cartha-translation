id: DEU.28.1
reference: Deuteronomy 28:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם שָׁמ֤וֹעַ תִּשְׁמַע֙ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ אֶת כָּל מִצְוֺתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם וּ/נְתָ֨נְ/ךָ֜ יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ עֶלְי֔וֹן עַ֖ל כָּל גּוֹיֵ֥י הָ/אָֽרֶץ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/001.yaml
  text: And it shall be[a], if you diligently obey the voice of Yahweh your God, being careful to do all his commandments that I am commanding you today, then Yahweh your God will set you high above all the nations of the earth.
translation:
  language: id
  text: Jika kamu sungguh-sungguh mendengarkan suara Yahweh, Allahmu, dan dengan saksama menaati serta melakukan segala perintah-Nya yang kuperintahkan kepadamu hari ini, Yahweh, Allahmu, akan menempatkanmu tinggi di atas segala bangsa di bumi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bagian awal ayat ini berbunyi, “jika dengan sungguh-sungguh kamu mendengarkan suara Yahweh, Allahmu.” Pengulangan kata kerja Ibrani menegaskan tindakan itu; dalam konteks ini, “mendengarkan suara” mencakup mendengarkan dengan penuh perhatian dan taat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: akan
  rationale: Dalam susunan syarat-akibat ayat ini, bentuk tersebut mengantar hasil yang akan terjadi; bahasa Indonesia alami tidak memerlukan padanan harfiah tersendiri seperti 'dan akan terjadi'.
- source_word: אִם שָׁמוֹעַ תִּשְׁמַע בְּקוֹל
  choice: Jika kamu sungguh-sungguh mendengarkan suara ... dengan menaati-Nya
  rationale: Infinitif absolut bersama verba finit menegaskan tindakan mendengar. Ungkapan ini mencakup perhatian sekaligus ketaatan; formulasi ini mempertahankan citra 'suara' dan menjelaskan daya idiomatisnya tanpa mereduksinya menjadi pendengaran belaka.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi yang tertulis langsung dalam teks Ibrani.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Mempertahankan bentuk kepunyaan tunggal dan sebutan perjanjian secara ringkas serta alami dalam bahasa Indonesia.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: serta dengan saksama melakukan
  rationale: לשמר menyatakan menjaga atau mengindahkan dengan teliti, sedangkan לעשות menuntut pelaksanaan nyata; frasa Indonesia ini menyampaikan keduanya secara alami.
- source_word: כָּל מִצְוֺתָיו
  choice: segala perintah-Nya
  rationale: Menyampaikan keseluruhan tuntutan perjanjian dengan register hukum-keagamaan yang wajar dalam bahasa Indonesia modern.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: yang kusampaikan kepadamu hari ini
  rationale: Partisip Ibrani menggambarkan tindakan Musa dalam amanat yang sedang berlangsung. 'Kusampaikan' menghindari pengulangan janggal 'perintah ... yang kuperintahkan' tanpa menghilangkan makna pemberian perintah.
- source_word: וּנְתָנְךָ
  choice: akan menempatkanmu
  rationale: Dalam konstruksi dengan predikat עֶלְיוֹן, נתן berarti menempatkan atau menetapkan seseorang dalam kedudukan tertentu.
- source_word: עֶלְיוֹן עַל כָּל גּוֹיֵי הָאָרֶץ
  choice: tinggi di atas segala bangsa di bumi
  rationale: Mempertahankan gambaran kedudukan yang ditinggikan dan cakupan perbandingan dengan semua bangsa.
theological_decisions:
- issue: Penerjemahan nama יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi YHWH; 'Yahweh' mempertahankan perbedaannya dari gelar אֲדֹנָי tanpa menambahkan penafsiran denominasi.
- issue: Hubungan mendengar dan menaati dalam שָׁמוֹעַ תִּשְׁמַע בְּקוֹל
  choice: mendengarkan suara ... dengan menaati-Nya
  alternative: menaati Yahweh dengan sungguh-sungguh
  rationale: Pilihan utama mempertahankan unsur leksikal 'mendengar suara' sekaligus menyatakan daya perjanjiannya sebagai pendengaran yang taat.
- issue: Sifat berkat dalam anak kalimat hasil
  choice: Yahweh ... akan menempatkanmu tinggi
  alternative: Yahweh ... akan menjadikanmu yang tertinggi
  rationale: עֶלְיוֹן dapat menyatakan kedudukan tinggi tanpa harus dipaksa menjadi superlatif mutlak; 'tinggi di atas' mempertahankan konstruksi komparatif terhadap bangsa-bangsa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada perjanjian yang khidmat tetapi mudah dipahami. Bentuk tunggal 'kamu/-mu' dipertahankan karena sapaan Ibraninya tunggal kolektif kepada Israel. Penanda catatan kaki [a] ditempatkan setelah keseluruhan kalimat agar tidak mengganggu alur syarat-akibat.
