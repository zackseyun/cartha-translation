revisions:
- from: Jika kamu sungguh-sungguh mendengarkan suara Yahweh, Allahmu, dengan menaati-Nya, serta dengan saksama melakukan segala perintah-Nya yang kusampaikan kepadamu hari ini, Yahweh, Allahmu, akan menempatkanmu tinggi di atas segala bangsa di bumi.[a]
  to: Jika kamu sungguh-sungguh mendengarkan suara Yahweh, Allahmu, dan dengan saksama menaati serta melakukan segala perintah-Nya yang kuperintahkan kepadamu hari ini, Yahweh, Allahmu, akan menempatkanmu tinggi di atas segala bangsa di bumi.[a]
  rationale: Revisi mengganti padanan yang terlalu umum bagi ‘memerintahkan’ dan merapikan rangkaian tindakan agar idiom Ibrani tentang mendengarkan dengan taat serta pasangan ‘menaati/menjaga dan melakukan’ tetap tampak dalam bahasa Indonesia modern. Penanda catatan kaki tetap ditempatkan secara sah pada akhir kalimat dan catatannya kini menjelaskan pengulangan Ibrani tanpa mengubah arti teks.
