lexical_decisions:
- source_word: אָרוּר
  choice: Terkutuklah
  rationale: Partisip pasif ini menyatakan kutuk dalam rumusan perjanjian. Bentuk “Terkutuklah” alami dan berwibawa dalam bahasa Indonesia serta mempertahankan daya deklaratif ungkapan Ibrani yang tanpa verba eksplisit.
- source_word: טַנְאֲךָ
  choice: keranjangmu
  rationale: טֶנֶא menunjuk pada keranjang, kerap sebagai tempat hasil panen. “Keranjang” mempertahankan cakupan maknanya tanpa menentukan isi yang tidak disebutkan dalam ayat.
- source_word: וּמִשְׁאַרְתֶּךָ
  choice: dan wadah adonanmu
  rationale: מִשְׁאֶרֶת ialah wadah yang dipakai untuk menguleni atau menyiapkan adonan. “Wadah adonan” jelas bagi pembaca modern dan tidak mengharuskan bentuk tertentu seperti mangkuk atau palung.
