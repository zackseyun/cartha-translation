  text: וְ/אָכַלְתָּ֣ פְרִֽי בִטְנְ/ךָ֗ בְּשַׂ֤ר בָּנֶ֨י/ךָ֙ וּ/בְנֹתֶ֔י/ךָ אֲשֶׁ֥ר נָֽתַן לְ/ךָ֖ יְהוָ֣ה אֱלֹהֶ֑י/ךָ בְּ/מָצוֹר֙ וּ/בְ/מָצ֔וֹק אֲשֶׁר יָצִ֥יק לְ/ךָ֖ אֹיְבֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/053.yaml
  text: And you will eat the fruit of your womb[a], the flesh of your sons and daughters whom Yahweh your God has given you[b], in the siege and in the distress with which your enemy will oppress you.
translation:
  language: id
  text: Engkau akan memakan buah kandunganmu[a], yaitu daging putra-putrimu yang telah diberikan Yahweh, Allahmu, kepadamu, selama pengepungan dan kesesakan yang ditimpakan musuhmu kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “keturunanmu.” Secara harfiah, “buah perutmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַלְתָּ
  choice: Engkau akan memakan
  rationale: Bentuk perfektum dengan waw dalam konteks kutuk ini menyatakan akibat yang akan terjadi; bentuk futuratif ini alami dalam bahasa Indonesia.
- source_word: פְרִי בִטְנְךָ
  choice: buah kandunganmu
  rationale: Mempertahankan metafora Ibrani bagi keturunan dengan ungkapan Indonesia yang wajar dan khidmat.
- source_word: בְּשַׂר בָּנֶיךָ וּבְנֹתֶיךָ
  choice: daging anak-anakmu lelaki dan perempuan
  rationale: בָּשָׂר menunjuk secara gamblang pada daging manusia, sedangkan penyebutan anak lelaki dan perempuan dipertahankan tanpa meratakan keduanya menjadi sekadar 'anak-anak'.
- source_word: אֲשֶׁר נָתַן לְךָ יְהוָה אֱלֹהֶיךָ
  choice: yang telah diberikan Yahweh, Allahmu, kepadamu
  rationale: Klausa relatif dipertahankan untuk menegaskan bahwa anak-anak itu adalah pemberian Allah, sehingga memperkuat kengerian kutuk tersebut.
- source_word: בְּמָצוֹר וּבְמָצוֹק
  choice: dalam pengepungan dan kesesakan
  rationale: Kedua nomina keadaan diterjemahkan secara sejajar; 'kesesakan' mencakup tekanan, penderitaan, dan keadaan terjepit tanpa membatasi maknanya pada emosi semata.
- source_word: אֲשֶׁר יָצִיק לְךָ אֹיְבֶךָ
  choice: yang ditimpakan musuhmu kepadamu
  rationale: Hifil יציק menyatakan bahwa musuh menyebabkan tekanan atau kesesakan itu. Bentuk ini menjaga hubungan klausa relatif dengan 'pengepungan dan kesesakan'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Kengerian kutuk berupa kanibalisme terhadap anak sendiri
  choice: Diterjemahkan secara gamblang sebagai memakan daging anak-anak sendiri
  alternative: Memperhalusnya menjadi penderitaan atau kehilangan anak
  rationale: Teks sumber secara eksplisit menyebut tindakan memakan dan daging anak lelaki serta perempuan; penghalusan akan menghilangkan isi dan bobot teologis peringatan itu.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan langsung. Kata ganti tunggal 'engkau' mempertahankan sapaan 2ms Ibrani. Metafora 'buah kandungan' dipertahankan, sedangkan catatan kaki menjelaskan bentuk harfiahnya. Susunan kalimat menjaga tekanan mengerikan teks tanpa sensasionalisme.
