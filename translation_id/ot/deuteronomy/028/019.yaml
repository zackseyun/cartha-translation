  yaml_path: translation/ot/deuteronomy/028/019.yaml
  text: Cursed shall you be when you come in[a], and cursed shall you be when you go out.
translation:
  language: id
  text: Terkutuklah engkau ketika masuk[a], dan terkutuklah engkau ketika keluar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dalam masukmu ... dalam keluarmu.” Ini adalah ungkapan Ibrani yang mencakup seluruh aktivitas kehidupan sehari-hari.
    reason: cultural_note
lexical_decisions:
- source_word: אָרוּר
  choice: Terkutuklah
  rationale: Bentuk partisipial/adjektival pasif ini berarti ‘terkutuk’. Penempatan di awal klausa dan partikel -lah mempertahankan penekanan serta nada khidmat rumusan kutuk perjanjian.
- source_word: אַתָּה
  choice: engkau
  rationale: Pronomina orang kedua maskulin tunggal. ‘Engkau’ mempertahankan sapaan tunggal dan sesuai dengan ragam Alkitab yang modern serta bermartabat.
- source_word: בְּבֹאֶךָ
  choice: ketika masuk
  rationale: Secara harfiah, ‘dalam masukmu’. Ungkapan ‘ketika masuk’ alami dalam bahasa Indonesia dan mempertahankan kesejajaran dengan ‘ketika keluar’.
- source_word: וְ
  choice: dan
  rationale: Konjungsi sederhana yang menghubungkan kedua klausa sejajar.
- source_word: בְּצֵאתֶךָ
  choice: ketika keluar
  rationale: Secara harfiah, ‘dalam keluarmu’. Ungkapan ini alami dan mempertahankan pasangan idiomatis masuk–keluar.
theological_decisions:
- issue: Mempertahankan bentuk khidmat rumusan kutuk perjanjian tanpa mengaburkan penekanan Ibrani
  choice: Terkutuklah engkau ketika masuk, dan terkutuklah engkau ketika keluar.
  alternative: Engkau akan terkutuk ketika masuk, dan engkau akan terkutuk ketika keluar.
  rationale: Teks Ibrani menempatkan ‘terkutuk’ di depan pada kedua klausa. ‘Terkutuklah engkau’ mempertahankan penekanan dan irama formal itu, sedangkan bentuk alternatif lebih datar dan dapat terdengar hanya sebagai prediksi masa depan.
translation_notes:
  register: Bahasa Indonesia baku, ringkas, khidmat, dan mudah dipahami. Sapaan ‘engkau’ dipakai untuk mempertahankan bentuk tunggal serta nada langsung dalam konteks perjanjian; pasangan ‘masuk–keluar’ dipertahankan sebagai merisme Ibrani.
