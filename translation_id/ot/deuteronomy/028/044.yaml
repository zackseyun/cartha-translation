  text: ה֣וּא יַלְוְ/ךָ֔ וְ/אַתָּ֖ה לֹ֣א תַלְוֶ֑/נּוּ ה֚וּא יִהְיֶ֣ה לְ/רֹ֔אשׁ וְ/אַתָּ֖ה תִּֽהְיֶ֥ה לְ/זָנָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/044.yaml
  text: He will lend to you[a], but you will not lend to him; he will be the head[b], and you will be the tail.
translation:
  language: id
  text: Ia akan memberi pinjaman kepadamu[a], tetapi engkau tidak akan memberi pinjaman kepadanya. Ia akan menjadi kepala, dan engkau akan menjadi ekor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yang dimaksud ialah pendatang yang disebut dalam ayat sebelumnya.
    reason: cross_reference
lexical_decisions:
- source_word: יַלְוְךָ / תַלְוֶנּוּ (לוה, Hiphil)
  choice: memberi pinjaman kepadamu / memberi pinjaman kepadanya
  rationale: Bentuk Hiphil dari לוה di sini berarti memberi pinjaman. Ungkapan ini mempertahankan kontras antara pihak pemberi pinjaman dan pihak yang bergantung secara ekonomi.
- source_word: הוּא
  choice: ia
  rationale: Kata ganti tunggal maskulin ini merujuk kembali kepada pendatang yang disebut pada ayat sebelumnya. 'Ia' mempertahankan bentuk tunggal tanpa menambahkan nomina ke dalam teks utama.
- source_word: לְרֹאשׁ
  choice: menjadi kepala
  rationale: Terjemahan ini mempertahankan metafora Ibrani tentang kedudukan utama atau dominan serta menggemakan kontras kepala-ekor dalam pasal ini.
- source_word: לְזָנָב
  choice: menjadi ekor
  rationale: Terjemahan langsung ini mempertahankan metafora yang jelas tentang kedudukan rendah atau ketergantungan.
- source_word: יִהְיֶה / תִּהְיֶה
  choice: akan menjadi
  rationale: Dalam konteks kutuk perjanjian, היה menyatakan status yang akan terjadi. 'Akan menjadi' terdengar alami dan menonjolkan pembalikan keadaan.
- source_word: וְאַתָּה
  choice: tetapi engkau / dan engkau
  rationale: Kata ganti yang diulang menegaskan kontras. 'Tetapi' menyatakan pertentangan pada klausa pertama, sedangkan 'dan' mempertahankan kesejajaran pada klausa kedua.
theological_decisions:
- issue: Rujukan tunggal bergender
  choice: Memakai bentuk tunggal 'ia' dan 'engkau'
  alternative: Memakai bentuk jamak 'mereka' atau mengulang 'pendatang' dalam teks utama
  rationale: Bahasa Ibrani memakai bentuk tunggal maskulin yang secara representatif merujuk kepada pendatang pada ayat sebelumnya. Bentuk tunggal dipertahankan agar gaya pronominal dan rujukan sumber tidak diubah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Engkau' dipakai untuk mempertahankan sapaan tunggal yang khas dalam wacana perjanjian. Metafora 'kepala' dan 'ekor' dipertahankan secara langsung. Catatan alternatif tentang makna verba pinjam-meminjam tidak ditambahkan karena teks Ibrani dalam konteks ini cukup jelas menunjuk tindakan memberi pinjaman; catatan kaki difokuskan pada rujukan kata ganti.
