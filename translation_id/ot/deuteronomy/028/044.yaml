  source_fidelity: 'Teks Indonesia dengan setia menerjemahkan dua klausa Hifil לוה sebagai tindakan memberi pinjaman: pendatang memberi pinjaman kepada Israel, sedangkan Israel tidak memberi pinjaman kepadanya. Bentuk tunggal pada “ia” dan “engkau” mempertahankan rujukan dan gaya sumber. Metafora status לְרֹאשׁ dan לְזָנָב diterjemahkan langsung sebagai “kepala” dan “ekor” tanpa penafsiran berlebihan.'
