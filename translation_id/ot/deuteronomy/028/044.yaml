  terminology: “Pendatang” dalam catatan kaki merupakan penjelasan yang memadai bagi rujukan “ia” kepada ger pada ayat sebelumnya. “Engkau” sesuai dengan bentuk tunggal sumber dan register perjanjian. Istilah “kepala” dan “ekor” mempertahankan metafora Ibrani yang juga penting dalam konteks pasal ini.
