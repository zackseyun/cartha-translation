base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/051.yaml
  text: It will consume the offspring of your livestock and the produce of your land until you are destroyed; it will leave you no grain[a], new wine, or oil, no calves of your herd or lambs of your flock, until it has destroyed you.
translation:
  language: id
  text: Bangsa itu akan memakan habis keturunan ternakmu dan hasil tanahmu sampai engkau dibinasakan. Bangsa itu tidak akan menyisakan bagimu biji-bijian, anggur baru, atau minyak, juga anak-anak lembumu maupun keturunan kawanan domba dan kambingmu[a], sampai bangsa itu membinasakanmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: hasil kawanan domba dan kambingmu. Makna tepat kata Ibrani עַשְׁתְּרֹת tidak pasti; dalam konteks ini, ungkapan tersebut menunjuk kepada keturunan atau pertambahan kawanan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַל
  choice: akan memakan habis
  rationale: Kata kerja אכל secara harfiah berarti “makan”; dalam konteks kutuk dan penyerbuan, “memakan habis” menyampaikan penghabisan sumber daya secara alami sekaligus mempertahankan gambaran Ibraninya.
- source_word: פְּרִי בְהֶמְתְּךָ
  choice: anak-anak ternakmu
  rationale: פְּרִי berarti “buah/hasil”, tetapi bila dipakai untuk hewan menunjuk kepada keturunannya; בְהֵמָה mencakup ternak secara umum.
- source_word: וּפְרִי אַדְמָתְךָ
  choice: hasil tanahmu
  rationale: Ungkapan ini menunjuk kepada hasil pertanian dari tanah dan diterjemahkan dengan bentuk Indonesia yang ringkas dan wajar.
- source_word: עַד הִשָּׁמְדָךְ
  choice: sampai engkau binasa
  rationale: Bentuk infinitif dengan akhiran pronominal menyatakan batas akhir tindakan; “binasa” mempertahankan bobot kutuk tanpa secara tak perlu mempersempitnya menjadi pemusnahan mutlak.
- source_word: אֲשֶׁר לֹא יַשְׁאִיר לְךָ
  choice: Bangsa itu tidak akan menyisakan bagimu
  rationale: Subjek tersirat meneruskan bangsa penyerbu dari konteks sebelumnya. Pengulangan “Bangsa itu” membuat rujukan jelas dalam bahasa Indonesia tanpa mengubah pelakunya.
- source_word: דָּגָן
  choice: gandum
  rationale: דָּגָן dapat menunjuk biji-bijian secara umum. “Gandum” merupakan padanan Alkitabiah yang lazim dalam rangkaian hasil pokok ini, meski cakupan istilah Ibrani lebih luas.
- source_word: תִּירוֹשׁ
  choice: anggur baru
  rationale: תִּירוֹשׁ menunjuk anggur hasil panen yang baru atau sari anggur yang sedang/baru diolah; “anggur baru” mempertahankan pembedaan leksikalnya.
- source_word: יִצְהָר
  choice: minyak
  rationale: Dalam rangkaian gandum, anggur baru, dan minyak, istilah ini mengacu pada minyak hasil pertanian, biasanya minyak zaitun; bentuk singkat tidak menambahkan unsur yang tidak dinyatakan.
- source_word: שְׁגַר אֲלָפֶיךָ
  choice: anak-anak lembumu
  rationale: שְׁגַר menunjuk hasil kelahiran atau keturunan ternak besar. “Anak-anak lembumu” jelas dan tidak membatasi jenis kelamin atau usia lebih jauh daripada teks.
- source_word: וְעַשְׁתְּרֹת צֹאנֶךָ
  choice: anak-anak kawanan kambing dombamu[a]
  rationale: Dalam pasangan dengan keturunan lembu, ungkapan yang langka ini paling mungkin menunjuk hasil perkembangbiakan kawanan ternak kecil. Kata צֹאן dapat mencakup domba dan kambing; ketidakpastian istilah עַשְׁתְּרֹת dicatat dalam catatan kaki.
- source_word: עַד הַאֲבִידוֹ אֹתָךְ
  choice: sampai bangsa itu membinasakanmu
  rationale: Bentuk Hifil אבד bersifat kausatif, “menyebabkan binasa/membinasakan”. Pengulangan subjek memperjelas bahwa bangsa penyerbu adalah pelakunya.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada kutuk perjanjian yang tegas. “Memakan habis” mempertahankan metafora sumber, sedangkan penyebutan “Bangsa itu” menghindari pronomina yang kabur. Istilah צֹאן diterjemahkan “kambing domba” agar cakupan ternak kecil dalam bahasa Ibrani tidak dipersempit hanya menjadi domba.
