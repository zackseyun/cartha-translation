  source_fidelity: 'Terjemahan mempertahankan urutan dan cakupan daftar Ibrani: penyakit yang menguruskan tubuh, demam, radang, panas yang membakar, pedang, hawar, dan penyakit kuning pada tanaman. Klausa penutup dengan tepat mempertahankan kata kerja jamak dan sapaan orang kedua tunggal: "semuanya itu akan mengejarmu sampai engkau binasa." Nama ilahi יהוה diterjemahkan konsisten sebagai "Yahweh."'
  naturalness: Bahasa Indonesia modern, jelas, dan cukup khidmat. "Menghantammu" menyampaikan daya langsung dari bentuk Hifil tanpa menjadi tidak wajar. "Semuanya itu" merupakan cara alami untuk menyatakan subjek jamak yang merangkum deretan bencana.
