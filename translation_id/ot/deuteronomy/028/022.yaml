  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: יַכְּ/כָ֣ה יְ֠הוָה בַּ/שַּׁחֶ֨פֶת וּ/בַ/קַּדַּ֜חַת וּ/בַ/דַּלֶּ֗קֶת וּ/בַֽ/חַרְחֻר֙ וּ/בַ/חֶ֔רֶב וּ/בַ/שִּׁדָּפ֖וֹן וּ/בַ/יֵּרָק֑וֹן וּ/רְדָפ֖וּ/ךָ עַ֥ד אָבְדֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/022.yaml
  text: Yahweh will strike you with wasting disease[a], with fever, with inflammation, with burning heat, with the sword, with blight, and with mildew[b]; and they will pursue you until you perish.
translation:
  language: id
  text: Yahweh akan menghantammu dengan penyakit yang menguruskan tubuh[a], demam, radang, panas yang membakar, pedang, hawar, dan penyakit kuning pada tanaman; semuanya itu[b] akan mengejarmu sampai engkau binasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “penyakit yang membuat tubuh merana.” Istilah Ibrani ini menunjuk pada penyakit melemahkan yang menguruskan tubuh, tetapi tidak menyebut diagnosis tertentu.'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “mereka akan mengejarmu.” Kata kerja Ibraninya berbentuk jamak dan merujuk kepada berbagai penyakit serta malapetaka yang baru disebutkan.
    reason: grammar_clarification
lexical_decisions:
- source_word: יַכְּכָה
  choice: akan menghantammu
  rationale: Bentuk Hifil dari נכה menyatakan tindakan memukul atau menghantam. Pilihan ini mempertahankan daya hukuman yang langsung dan sapaan orang kedua tunggal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: שַׁחֶפֶת
  choice: penyakit yang menguruskan tubuh
  rationale: Istilah ini menunjuk pada penyakit melemahkan yang membuat tubuh merana; terjemahan ini menghindari diagnosis modern yang terlalu spesifik.
- source_word: קַּדַּחַת
  choice: demam
  rationale: Padanan modern yang jelas bagi penyakit dengan panas tubuh.
- source_word: דַּלֶּקֶת
  choice: radang
  rationale: Menjaga makna peradangan atau rasa terbakar serta membedakannya dari demam dan panas berikutnya.
- source_word: חַרְחֻר
  choice: panas yang membakar
  rationale: Istilah langka ini tampaknya menunjuk pada panas menyengat atau demam membakar; ungkapan ini mempertahankan ketidakpastian tanpa menjadi terlalu teknis.
- source_word: חֶרֶב
  choice: pedang
  rationale: Arti dasar katanya adalah pedang, yang dalam konteks kutuk dapat juga mewakili peperangan atau kematian karena kekerasan.
- source_word: שִׁדָּפוֹן
  choice: hawar
  rationale: Menggambarkan bencana yang merusak tanaman, khususnya akibat kondisi panas atau menghanguskan; 'hawar' merupakan istilah pertanian Indonesia yang ringkas.
- source_word: יֵרָקוֹן
  choice: penyakit kuning pada tanaman
  rationale: Dalam konteks pertanian, istilah ini menunjuk pada menguning atau memucatnya tanaman; pilihan ini lebih transparan daripada menetapkannya sebagai jenis jamur tertentu.
- source_word: וּרְדָפוּךָ
  choice: semuanya itu akan mengejarmu
  rationale: Kata kerja Ibrani berbentuk jamak dan kembali kepada rangkaian penyakit serta malapetaka sebelumnya. 'Semuanya itu' membuat rujukan jamak tersebut alami dalam bahasa Indonesia.
- source_word: עַד אָבְדֶךָ
  choice: sampai engkau binasa
  rationale: Mempertahankan arti datang kepada kebinasaan serta bentuk sapaan tunggal yang langsung.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri Allah. Bentuk 'Yahweh' mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Pelaku pengejaran dalam klausa terakhir
  choice: semuanya itu, yakni berbagai kutuk yang disebutkan
  alternative: satu kutuk atau Yahweh sebagai pelaku tersirat
  rationale: Kata kerja וּרְדָפוּךָ berbentuk jamak, sehingga secara gramatikal paling wajar merujuk kembali kepada berbagai penyakit dan bencana. Terjemahan tidak mengubahnya menjadi subjek tunggal.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Sapaan tunggal 'engkau' mempertahankan bentuk orang kedua tunggal dalam bahasa Ibrani. Istilah pertanian dijelaskan secukupnya agar dapat dipahami pembaca umum tanpa memaksakan identifikasi ilmiah modern.
