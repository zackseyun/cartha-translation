  text: בָּנֶ֨י/ךָ וּ/בְנֹתֶ֜י/ךָ נְתֻנִ֨ים לְ/עַ֤ם אַחֵר֙ וְ/עֵינֶ֣י/ךָ רֹא֔וֹת וְ/כָל֥וֹת אֲלֵי/הֶ֖ם כָּל הַ/יּ֑וֹם וְ/אֵ֥ין לְ/אֵ֖ל יָדֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/032.yaml
  text: Your sons and your daughters will be given to another people[a], while your eyes look on and fail with longing for them all day long, but your hand will be powerless.
translation:
  language: id
  text: Anak-anakmu, baik laki-laki maupun perempuan, akan diserahkan kepada bangsa lain. Matamu akan menyaksikannya, dan engkau akan merana karena merindukan mereka sepanjang hari, tetapi tanganmu tidak akan berdaya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tetapi hal itu tidak akan berada dalam kuasamu.” Ungkapan Ibrani secara harfiah menyatakan bahwa tidak ada daya pada tanganmu.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּנֶיךָ וּבְנֹתֶיךָ
  choice: Anak-anakmu laki-laki dan perempuan
  rationale: Ibrani menyebut anak laki-laki dan anak perempuan secara eksplisit. Susunan ini mempertahankan cakupan tersebut dengan bahasa Indonesia yang alami.
- source_word: נְתֻנִים
  choice: akan diserahkan
  rationale: Partisip pasif ini berfungsi predikatif dalam rangkaian kutuk yang berorientasi ke masa depan. 'Diserahkan' menyampaikan tindakan memberikan ke dalam kuasa pihak lain tanpa menentukan pelaku yang tidak disebutkan.
- source_word: לְעַם אַחֵר
  choice: kepada bangsa lain
  rationale: עַם menunjuk suatu kelompok masyarakat atau bangsa. Dalam konteks pemindahan anak-anak kepada kelompok asing, 'bangsa lain' merupakan padanan Indonesia yang jelas tanpa memperkuatnya menjadi istilah politik tertentu.
- source_word: וְעֵינֶיךָ רֹאוֹת
  choice: matamu akan terus memandang
  rationale: Ungkapan ini menggambarkan orang tua yang menyaksikan keadaan itu tanpa mampu bertindak. 'Terus memandang' juga menghubungkan penglihatan tersebut dengan durasi 'sepanjang hari'.
- source_word: וְכָלוֹת אֲלֵיהֶם
  choice: dan merana karena merindukan mereka
  rationale: כלה menggambarkan menjadi habis, lemah, atau merana; אֲלֵיהֶם mengarahkan kerinduan kepada anak-anak itu. Terjemahan ini mempertahankan unsur kehabisan daya sekaligus muatan emosional konteksnya.
- source_word: כָּל הַיּוֹם
  choice: sepanjang hari
  rationale: Padanan alami yang mempertahankan makna duratif frasa Ibrani.
- source_word: וְאֵין לְאֵל יָדֶךָ
  choice: tetapi tanganmu tidak akan berdaya
  rationale: Ungkapan Ibrani secara harfiah mengaitkan ketiadaan daya dengan tangan. Terjemahan ini mempertahankan citra tangan sambil menyampaikan makna ketidakmampuan secara jelas.
theological_decisions:
- issue: Makna ungkapan וְאֵין לְאֵל יָדֶךָ
  choice: tetapi tanganmu tidak akan berdaya
  alternative: dan hal itu tidak akan berada dalam kuasamu
  rationale: אֵל di sini berfungsi dalam idiom tentang daya atau kemampuan tangan, bukan sebagai pernyataan mengenai Allah atau suatu ilah. Pilihan ini menghindari salah pengertian teologis sambil mempertahankan metafora sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan langsung. Bentuk tunggal orang kedua dipertahankan melalui akhiran -mu. 'Merana karena merindukan' dipakai untuk mengungkapkan kehabisan daya emosional tanpa menghilangkan citra penderitaan dalam teks Ibrani.
