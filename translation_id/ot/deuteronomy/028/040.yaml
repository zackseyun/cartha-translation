  text: You will have olive trees throughout all your territory[a], but you will not anoint yourself with oil, because your olives will fall off.
translation:
  language: id
  text: Di seluruh wilayahmu akan ada pohon-pohon zaitun, tetapi engkau tidak akan mengolesi tubuhmu dengan minyak, sebab buah zaitunmu[a] akan berguguran.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “zaitunmu akan berguguran,” “hasil zaitunmu akan berguguran,” atau “pohon zaitunmu akan menggugurkan buahnya.” Dalam bahasa Ibrani, kata “zaitunmu” berbentuk tunggal dengan makna kolektif.'
    reason: lexical_alternative
lexical_decisions:
- source_word: זֵיתִים
  choice: pohon-pohon zaitun
  rationale: Dalam konteks keberadaan di seluruh wilayah, bentuk jamak ini paling wajar menunjuk pada pohon zaitun, bukan buah yang telah dipanen.
- source_word: יִהְיוּ לְךָ
  choice: akan ada
  rationale: Ungkapan kepunyaan Ibrani ini diterjemahkan secara alami bersama keterangan tempat; makna bahwa pohon-pohon itu terdapat di wilayah milik penerima tetap terjaga.
- source_word: בְּכָל גְּבוּלֶךָ
  choice: di seluruh wilayahmu
  rationale: גְּבוּל dapat berarti batas atau wilayah; konteks ini menunjuk pada seluruh kawasan negeri.
- source_word: וְשֶׁמֶן
  choice: dengan minyak
  rationale: Teks hanya menyebut 'minyak'; konteks pohon zaitun sudah memperjelas bahwa yang dimaksud ialah minyak zaitun.
- source_word: לֹא תָסוּךְ
  choice: engkau tidak akan mengurapi dirimu
  rationale: סוך menunjuk pada tindakan mengoleskan minyak pada tubuh. 'Mengurapi dirimu' mempertahankan citra dan bentuk refleksif teks sumber.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan mengapa minyak tidak dapat dipakai.
- source_word: יִשַּׁל
  choice: akan berguguran
  rationale: Bentuk verba ini menggambarkan buah yang luruh atau jatuh dari pohon; 'berguguran' alami dalam bahasa Indonesia dan cocok untuk buah secara kolektif.
- source_word: זֵיתֶךָ
  choice: buah zaitunmu
  rationale: Bentuk tunggal kolektif ini dapat menunjuk pada buah atau hasil zaitun. Penambahan 'buah' memperjelas apa yang berguguran tanpa menghilangkan sifat kolektifnya.
