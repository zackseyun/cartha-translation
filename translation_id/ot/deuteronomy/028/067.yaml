    rationale: Teks sumber berbicara tentang ketakutan/kengerian yang berkaitan dengan hati dan yang akan ditakuti; tidak ada verba ‘memenuhi’. Revisi menghapus tambahan tersebut dan mempertahankan hubungan relatif yang sulit tetapi penting.
