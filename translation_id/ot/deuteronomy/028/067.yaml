base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/067.yaml
  text: In the morning you will say[a], “If only it were evening!” and in the evening you will say, “If only it were morning!” because of the dread of your heart that you will dread[b], and because of the sight your eyes will see.
translation:
  language: id
  text: Pada pagi hari engkau akan berkata[a], “Seandainya hari sudah petang!” dan pada petang hari engkau akan berkata, “Seandainya hari sudah pagi!” karena ketakutan dalam hatimu yang akan engkau takuti[b], dan karena pemandangan yang akan dilihat oleh matamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Siapa yang akan memberi petang?” dan “Siapa yang akan memberi pagi?” Ini adalah ungkapan Ibrani yang menyatakan kerinduan kuat.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau secara lebih harfiah: “karena ketakutan hatimu yang akan engkau takuti, dan karena pemandangan matamu yang akan engkau lihat.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבֹּקֶר
  choice: Pada pagi hari
  rationale: Frasa waktu definit; bentuk ini alami dan jelas dalam bahasa Indonesia.
- source_word: תֹּאמַר
  choice: engkau akan berkata
  rationale: Bentuk imperfek orang kedua tunggal dalam konteks kutuk menyatakan kejadian yang akan dialami, bukan perintah.
- source_word: מִי יִתֵּן
  choice: Ah, seandainya sekarang sudah
  rationale: Ungkapan harapan ini secara harfiah berbunyi 'Siapa yang akan memberikan ...?' tetapi berfungsi menyatakan kerinduan kuat agar waktu yang lain segera tiba.
- source_word: עֶרֶב / בֹּקֶר
  choice: petang / pagi
  rationale: Mempertahankan pertentangan waktu yang membentuk kesejajaran ayat.
- source_word: מִפַּחַד לְבָבְךָ אֲשֶׁר תִּפְחָד
  choice: karena kedahsyatan yang akan memenuhi hatimu
  rationale: Menyampaikan rasa takut yang sangat kuat dan hubungan hati dengan pengalaman takut dalam bahasa Indonesia yang wajar; pengulangan akar Ibrani diterangkan dalam catatan.
- source_word: וּמִמַּרְאֵה עֵינֶיךָ אֲשֶׁר תִּרְאֶה
  choice: dan karena apa yang akan dilihat oleh matamu
  rationale: Mַרְאֶה menunjuk pada pemandangan atau hal yang disaksikan; penyebutan mata dipertahankan demi kejelasan dan daya gambar ungkapan Ibrani.
