  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Kata ganti 'engkau' mempertahankan sapaan orang kedua tunggal. 'Petang' dipilih untuk kesejajaran yang ringkas dengan 'pagi', sedangkan 'Ah, seandainya' menyampaikan daya emosional idiom harapan Ibrani.
