  text: וְ/הָיְתָ֤ה נִבְלָֽתְ/ךָ֙ לְ/מַאֲכָ֔ל לְ/כָל ע֥וֹף הַ/שָּׁמַ֖יִם וּ/לְ/בֶהֱמַ֣ת הָ/אָ֑רֶץ וְ/אֵ֖ין מַחֲרִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/026.yaml
  text: Your carcass will become food for every bird of the sky and for the beasts of the earth[c][b][a], and there will be no one to frighten them away.
translation:
  language: id
  text: Mayatmu[a] akan menjadi makanan bagi segala burung di langit dan segala binatang di bumi,[b] dan tidak akan ada seorang pun yang menghalau mereka.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “bangkaimu” atau “tubuhmu yang mati.” Istilah Ibrani ini bernuansa merendahkan dalam konteks penghukuman ini.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “burung di langit” dan “binatang di bumi.” Pasangan langit–bumi ini menekankan bahwa mayat itu sama sekali tidak terlindungi dan dipermalukan.
    reason: cultural_note
  - marker: c
    text: Maksudnya, tidak ada seorang pun yang akan menakut-nakuti dan mengusir burung serta binatang yang memakan mayat itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה
  choice: akan menjadi
  rationale: Bentuk ini dalam rangkaian kutuk menyatakan akibat pada masa mendatang; konstruksi predikatif dengan לְמַאֲכָל paling alami diterjemahkan “akan menjadi makanan”.
- source_word: נִבְלָתְךָ
  choice: mayatmu
  rationale: נְבֵלָה menunjuk pada tubuh yang sudah mati dan dalam konteks penghukuman bernuansa hina. “Mayatmu” jelas dan wajar dalam bahasa Indonesia, sementara catatan kaki mempertahankan kemungkinan padanan yang lebih keras, “bangkaimu”.
- source_word: לְמַאֲכָל
  choice: menjadi makanan
  rationale: Kata benda ini berarti makanan atau sesuatu yang dimakan; bersama preposisi לְ dan kata kerja sebelumnya, hasilnya dinyatakan secara alami sebagai “menjadi makanan”.
- source_word: לְכָל עוֹף הַשָּׁמַיִם
  choice: bagi segala burung di langit
  rationale: עוֹף dipakai secara kolektif bagi makhluk terbang, dan dalam konteks ini “segala burung” merupakan padanan Indonesia yang alami. “Di langit” mempertahankan gambaran ranah langit tanpa menyiratkan tempat ilahi.
- source_word: וּלְבֶהֱמַת הָאָרֶץ
  choice: dan segala binatang di bumi
  rationale: בְּהֵמָה di sini bersifat kolektif dan menunjuk pada binatang darat. “Binatang di bumi” mempertahankan pasangan cakupan langit–bumi dalam bahasa Indonesia yang wajar.
- source_word: וְאֵין מַחֲרִיד
  choice: dan tidak akan ada seorang pun yang menghalau mereka
  rationale: Partisipel Hifil dari חרד secara harfiah berkaitan dengan membuat takut atau gemetar. Dalam konteks, maksudnya ialah tidak ada orang yang menakut-nakuti burung dan binatang itu agar menjauh; “menghalau mereka” menyampaikan tindakan tersebut secara ringkas dan alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan khidmat. Susunan kalimat mempertahankan kekerasan gambaran kutuk tanpa menjadi kaku. “Mayatmu” dipilih untuk kejelasan umum, sedangkan nuansa penghinaan istilah Ibrani dijelaskan dalam catatan kaki; “menghalau” menyatakan implikasi kontekstual dari tindakan membuat pemakan bangkai itu ketakutan lalu pergi.
