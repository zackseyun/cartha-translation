base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/004.yaml
  text: Blessed shall be the fruit of your womb[a], and the fruit of your ground, and the fruit of your livestock—the offspring of your herds and the young of your flocks.
translation:
  language: id
  text: Diberkatilah buah kandunganmu, hasil tanahmu, dan keturunan ternakmu—anak-anak sapimu dan anak-anak kambing dan dombamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “pertambahan sapi-sapimu dan keturunan kambing dan dombamu.” Ungkapan Ibrani שְׁגַר אֲלָפֶיךָ dan עַשְׁתְּרֹת צֹאנֶךָ adalah istilah peternakan tradisional untuk hasil perkembangbiakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: Diberkatilah
  rationale: Adjektiva predikatif dalam rumusan berkat. Bentuk ini mempertahankan irama deklaratif dan cakupan berkat dalam konteks perjanjian.
- source_word: פְּרִי
  choice: buah / hasil / keturunan
  rationale: 'Kata Ibrani yang sama dipakai tiga kali, tetapi padanan idiomatis Indonesia berbeda menurut ranahnya: manusia, tanah, dan ternak. Variasi ini menyampaikan kesatuan makna berupa produktivitas tanpa menghasilkan ungkapan yang janggal.'
- source_word: בִטְנְךָ
  choice: kandunganmu
  rationale: Dalam konteks berkat keturunan, בטן menunjuk pada rahim atau kandungan sebagai tempat anak dikandung. 'Buah kandunganmu' merupakan ungkapan Indonesia yang alami dan bermartabat.
- source_word: אַדְמָתְךָ
  choice: tanahmu
  rationale: Menunjuk pada tanah sebagai sumber hasil pertanian, bukan terutama wilayah politis. 'Hasil tanahmu' adalah padanan idiomatis.
- source_word: בְהֶמְתֶּךָ
  choice: ternakmu
  rationale: Istilah luas bagi hewan peliharaan. 'Ternak' ringkas, alami, dan mencakup kawanan besar maupun kecil.
- source_word: שְׁגַר
  choice: anak-anak
  rationale: Dalam konstruksi dengan sapi, istilah ini menunjuk pada hasil reproduksi atau hewan yang dilahirkan.
- source_word: אֲלָפֶיךָ
  choice: kawanan sapimu
  rationale: Kata ini menunjuk pada sapi atau lembu. 'Kawanan sapimu' membentuk pasangan alami dengan kawanan kambing domba.
- source_word: עַשְׁתְּרֹת
  choice: anak-anak
  rationale: Istilah ternak tradisional yang dalam konstruksi ini menunjuk pada pertambahan atau anak-anak kawanan.
- source_word: צֹאנֶךָ
  choice: kawanan kambing dombamu
  rationale: Nomina kolektif ini mencakup ternak kecil, terutama domba dan kambing. Bentuk gabungan menghindari penyempitan hanya kepada domba.
