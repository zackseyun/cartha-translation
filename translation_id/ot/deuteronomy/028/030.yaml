id: DEU.28.30
reference: Deuteronomy 28:30
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִשָּׁ֣ה תְאָרֵ֗שׂ וְ/אִ֤ישׁ אַחֵר֙ ישגל/נה בַּ֥יִת תִּבְנֶ֖ה וְ/לֹא תֵשֵׁ֣ב בּ֑/וֹ כֶּ֥רֶם תִּטַּ֖ע וְ/לֹ֥א תְחַלְּלֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/030.yaml
  text: You will become engaged to a wife[a], but another man will lie with her; you will build a house, but you will not live in it; you will plant a vineyard[c][b], but you will not begin to use its fruit.
translation:
  language: id
  text: Engkau akan bertunangan dengan seorang perempuan[a], tetapi laki-laki lain akan bersetubuh dengannya[b]. Engkau akan membangun rumah, tetapi tidak akan menempatinya. Engkau akan menanam kebun anggur, tetapi tidak akan mulai memanfaatkan hasilnya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih formal, “mengikat pertunangan dengan seorang perempuan.”
    reason: lexical_alternative
  - marker: b
    text: Bentuk tertulis dalam teks Ibrani memakai istilah seksual yang kasar. Istilah itu kadang diterjemahkan dengan kata-kata yang menyiratkan pelanggaran atau kekerasan, tetapi bentuk ini sendiri tidak secara eksplisit menyatakan adanya pemaksaan.
    reason: textual_and_lexical_clarification
  - marker: c
    text: Secara harfiah, “tidak akan menjadikannya biasa.” Ini adalah ungkapan untuk mulai memakai hasil kebun anggur bagi konsumsi biasa.
    reason: lexical_alternative
lexical_decisions:
- source_word: תְאָרֵשׂ
  choice: akan bertunangan dengan
  rationale: Kata kerja ini menunjuk pada pertunangan yang mengikat secara hukum. Ungkapan ini alami dalam bahasa Indonesia modern dan tidak mengaburkannya menjadi sekadar pernikahan.
- source_word: אִשָּׁה
  choice: seorang perempuan
  rationale: Dalam konstruksi dengan kata kerja 'bertunangan', perempuan itu jelas merupakan calon istri; pilihan ini tetap dekat dengan bentuk leksikal Ibrani dan alami dalam bahasa Indonesia.
- source_word: אִישׁ אַחֵר
  choice: laki-laki lain
  rationale: Terjemahan langsung yang mempertahankan kontras dengan orang yang disapa.
- source_word: ישגלנה
  choice: akan bersetubuh dengannya
  rationale: Bentuk tertulis memakai istilah seksual yang kasar. 'Bersetubuh dengannya' menyatakan tindakan seksual secara jelas tanpa menambahkan unsur pemaksaan yang tidak dinyatakan secara eksplisit oleh bentuk kata itu sendiri.
- source_word: תֵשֵׁב בּוֹ
  choice: akan menempatinya
  rationale: Dalam kaitannya dengan rumah, ישב berarti tinggal atau berdiam. 'Menempatinya' ringkas dan alami.
- source_word: כֶּרֶם
  choice: kebun anggur
  rationale: Padanan baku dan mudah dipahami untuk כרם.
- source_word: תְחַלְּלֶנּוּ
  choice: tidak akan mulai memanfaatkan hasilnya
  rationale: Dalam konteks kebun anggur, bentuk piel חלל menunjuk pada dimulainya penggunaan biasa atas hasil kebun. Terjemahan ini menyampaikan arti teknis tersebut tanpa mempertahankan idiom 'menjadikannya biasa' secara kaku.
