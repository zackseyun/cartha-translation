  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם לֹ֤א תִשְׁמַע֙ בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֤ר לַ/עֲשׂוֹת֙ אֶת כָּל מִצְוֺתָ֣י/ו וְ/חֻקֹּתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם וּ/בָ֧אוּ עָלֶ֛י/ךָ כָּל הַ/קְּלָל֥וֹת הָ/אֵ֖לֶּה וְ/הִשִּׂיגֽוּ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/015.yaml
  text: But if you do not listen to the voice of Yahweh your God[a], to keep and to do all his commandments and his statutes that I am commanding you today[b], then all these curses will come upon you and overtake you.
translation:
  language: id
  text: Namun, jika kamu tidak mendengarkan suara Yahweh, Allahmu,[a] untuk memelihara dan melakukan segala perintah serta ketetapan-Nya yang kuperintahkan kepadamu hari ini,[b] maka semua kutuk ini akan datang menimpamu dan menyusulmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mendengarkan suara Yahweh.” Ungkapan Ibrani ini mencakup mendengar dengan taat; dapat juga diterjemahkan “menaati Yahweh, Allahmu.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “dengan memelihara dan melakukan segala perintah serta ketetapan-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם לֹא
  choice: Namun, jika ... maka
  rationale: Rangkaian ini memperkenalkan syarat yang berlawanan dengan bagian berkat sebelumnya; bentuk 'Namun, jika ... maka' alami dalam bahasa Indonesia dan mempertahankan hubungan kontras-kondisional.
- source_word: תִשְׁמַע בְּקוֹל
  choice: mendengarkan suara
  rationale: Mempertahankan citra pendengaran dalam idiom Ibrani, yang dalam konteks perjanjian juga mencakup ketaatan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Padanan Indonesia yang lugas bagi ungkapan perjanjian dengan sufiks orang kedua tunggal.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: dengan berpegang pada dan melakukan
  rationale: 'Mempertahankan kedua infinitif Ibrani: menjaga atau menaati dengan teguh, lalu melaksanakannya; menghindari penambahan kata ''dengan cermat'' yang tidak eksplisit.'
- source_word: כָּל מִצְוֺתָיו וְחֻקֹּתָיו
  choice: segala perintah serta ketetapan-Nya
  rationale: Mempertahankan pembedaan kosakata hukum antara מִצְוָה dan חֹק dalam bahasa Indonesia yang wajar.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: yang kusampaikan kepadamu hari ini
  rationale: Dalam konteks pidato Musa, 'kusampaikan' mengungkapkan tindakan memerintahkan secara alami tanpa mengaburkan bahwa isinya adalah perintah Yahweh.
- source_word: וּבָאוּ עָלֶיךָ
  choice: akan datang menimpamu
  rationale: Padanan idiomatis bagi datangnya kutuk atas seseorang.
- source_word: כָּל הַקְּלָלוֹת הָאֵלֶּה
  choice: semua kutuk ini
  rationale: '''Kutuk'' mempertahankan makna hukuman perjanjian dan berfungsi alami sebagai nomina kolektif dalam bahasa Indonesia.'
- source_word: וְהִשִּׂיגוּךָ
  choice: dan menyusulmu
  rationale: Mempertahankan gambaran hidup tentang kutuk yang mengejar lalu mencapai orang yang dituju.
theological_decisions:
- issue: Penerjemahan nama perjanjian יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi secara langsung; 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Kadar eksplisit dalam idiom ketaatan
  choice: mendengarkan suara Yahweh ... dengan berpegang pada dan melakukan
  alternative: menaati Yahweh ... dengan melakukan
  rationale: Pilihan utama mempertahankan unsur mendengar serta dua tindakan dalam bahasa Ibrani, sehingga tekstur perjanjian tidak diringkas menjadi satu verba abstrak.
- issue: Rujukan orang pertama dalam 'yang kusampaikan'
  choice: Musa sebagai pembicara yang menyampaikan perintah Yahweh
  alternative: mengubahnya menjadi 'yang diperintahkan-Nya kepadamu'
  rationale: Orang pertama tunggal terdapat dalam teks dan harus dipertahankan; konteks pidato Musa menjelaskan relasinya dengan perintah-perintah Yahweh.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam khidmat tetapi mudah dipahami. Bentuk tunggal 'kamu' dipertahankan karena semua sufiks orang kedua dalam ayat ini berbentuk maskulin tunggal. Ejaan pronomina ilahi memakai huruf kapital sesuai kebiasaan penerbitan Alkitab Indonesia.
