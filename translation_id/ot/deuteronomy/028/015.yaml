  naturalness: Teks revisi tetap baku dan bernada khidmat, tetapi hubungan sintaksisnya lebih jelas dalam bahasa Indonesia. “Memelihara dan melakukan” merupakan pasangan yang lazim dan dapat dipahami dalam register hukum-perjanjian Alkitab.
  terminology: “Yahweh, Allahmu,” “perintah,” “ketetapan,” dan “kutuk” sesuai dengan istilah sumber serta konsisten dalam ragam Alkitab Indonesia. Kapitalisasi pronomina ilahi dipertahankan. Catatan b direvisi agar benar-benar memberi alternatif sintaktis, bukan mengulangi teks utama.
