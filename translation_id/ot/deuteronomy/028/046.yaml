  text: And they will be on you and on your offspring as a sign and a wonder forever[a][b].
translation:
  language: id
  text: Semua itu akan menimpa engkau dan keturunanmu[a] sebagai tanda dan keajaiban untuk selama-lamanya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “benihmu”; kata Ibrani ini dapat secara kolektif berarti anak cucu atau keturunan.
    reason: lexical_alternative
  - marker: b
    text: “Semua itu” mengacu kepada kutuk-kutuk yang dijabarkan dalam konteks sebelumnya.
    reason: cross_reference
lexical_decisions:
- source_word: וְהָיוּ
  choice: Semua itu akan tetap
  rationale: Bentuk verba melanjutkan akibat pada masa depan dari kutuk-kutuk sebelumnya. Frasa “semua itu” secara alami mewakili subjek jamak yang tersirat dalam bahasa Indonesia, sedangkan “tetap” membantu menyampaikan keberlangsungan bersama עַד עוֹלָם tanpa mengubahnya menjadi klaim filosofis.
- source_word: בְךָ
  choice: menimpa engkau
  rationale: Preposisi ב dalam konteks kutuk menyatakan sesuatu yang melekat atau tertanggung atas orang yang disapa. “Menimpa” merupakan ungkapan Indonesia yang alami untuk hukuman atau malapetaka yang datang atas seseorang.
- source_word: לְאוֹת
  choice: sebagai tanda
  rationale: אוֹת berarti tanda atau penanda; “sebagai tanda” menyampaikan fungsi indikatifnya dengan jelas dan alami.
- source_word: וּלְמוֹפֵת
  choice: dan keajaiban
  rationale: מוֹפֵת dapat berarti keajaiban, peristiwa ajaib, atau pertanda. “Keajaiban” mempertahankan pasangan tradisional “tanda dan keajaiban” tanpa mempersempit maknanya menjadi pertanda buruk.
- source_word: וּבְזַרְעֲךָ
  choice: dan keturunanmu
  rationale: זֶרַע secara kolektif menunjuk kepada anak cucu atau keturunan. “Keturunanmu” alami dalam bahasa Indonesia dan tetap memelihara cakupan kolektif.
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan jangka waktu yang terus berlangsung. “Untuk selama-lamanya” adalah padanan Indonesia yang baku, tanpa menambahkan penjelasan metafisis yang tidak dinyatakan ayat.
theological_decisions:
- issue: Acuan subjek jamak pada וְהָיוּ
  choice: “Semua itu” mengacu secara kontekstual kepada kutuk-kutuk yang dijabarkan sebelumnya, tanpa menyebutkannya secara eksplisit dalam teks utama.
  alternative: Menerjemahkannya secara eksplisit sebagai “kutuk-kutuk itu”.
  rationale: Bahasa Ibrani memakai verba jamak tanpa subjek yang dinyatakan dalam ayat ini. Konteks mendukung acuan kepada kutuk-kutuk, tetapi formulasi “semua itu” mempertahankan ketidaklangsungan acuan tersebut dan terdengar alami dalam bahasa Indonesia.
- issue: Daya makna עַד עוֹלָם
  choice: “untuk selama-lamanya” tanpa menetapkan bahwa frasa itu harus berarti ketakterhinggaan metafisis.
  alternative: “sepanjang segala generasi” atau “terus-menerus”.
  rationale: Dalam wacana perjanjian, ungkapan Ibrani ini menandakan keberlangsungan yang sangat panjang atau tetap. Padanan baku dipertahankan tanpa mengimpor kesimpulan doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. “Engkau” dipakai untuk sapaan tunggal yang sejalan dengan bentuk Ibrani. Susunan kalimat dibuat alami sambil mempertahankan pasangan “tanda dan keajaiban” serta ambiguitas terbatas pada subjek jamak.
