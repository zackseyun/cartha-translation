  text: And the heavens above your head shall be bronze[a], and the earth beneath you iron.
translation:
  language: id
  text: Langit di atas kepalamu akan menjadi perunggu[a], dan tanah di bawahmu menjadi besi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: tembaga.'
    reason: נְחֹשֶׁת dapat menunjuk pada tembaga maupun perunggu; konteks tidak menghapus seluruh ambiguitas leksikal tersebut.
lexical_decisions:
- source_word: וְהָיוּ
  choice: akan menjadi
  rationale: Bentuk perfektum Qal dengan waw dalam konteks kutuk ini berfungsi secara futur; ‘akan menjadi’ menyampaikan akibat yang akan berlaku secara alami dalam bahasa Indonesia.
- source_word: שָׁמֶיךָ אֲשֶׁר עַל רֹאשְׁךָ
  choice: langit di atas kepalamu
  rationale: שָׁמַיִם di sini menunjuk pada langit atau kawasan cuaca. Ungkapan ini mempertahankan gambaran vertikal Ibrani dengan susunan Indonesia yang wajar.
- source_word: נְחֹשֶׁת
  choice: perunggu
  rationale: Kata ini dapat berarti tembaga atau perunggu. ‘Perunggu’ cocok dengan gambaran logam yang keras dan pasangan paralelnya, yaitu besi, sementara alternatif leksikal dipertahankan dalam catatan kaki.
- source_word: וְהָאָרֶץ אֲשֶׁר תַּחְתֶּיךָ
  choice: dan tanah di bawahmu
  rationale: אֶרֶץ dapat berarti bumi, negeri, atau tanah. Dalam gambaran kekeringan yang membuat permukaan di bawah manusia keras dan tidak menghasilkan, ‘tanah’ paling langsung dan alami, sekaligus tetap berkontras dengan langit.
- source_word: בַּרְזֶל
  choice: besi
  rationale: Padanan baku untuk istilah logam ini dan unsur yang melengkapi gambaran tanah yang keras serta tidak menghasilkan.
theological_decisions:
- issue: Daya metaforis gambaran kutuk
  choice: Mempertahankan gambaran harfiah logam, yaitu ‘perunggu’ dan ‘besi’, tanpa menjelaskan kekeringan serta ketandusan dalam teks utama.
  alternative: Memparafrasakan langit dan tanah sebagai kering, keras, dan tidak menghasilkan.
  rationale: Teks Ibrani menyampaikan kutuk perjanjian melalui metafora yang tajam. Mempertahankan citranya menghindari penambahan penafsiran ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Paralelisme ‘di atas kepalamu’ dan ‘di bawahmu’ dipertahankan, demikian pula citra logam yang padat tanpa parafrasa penjelas.
