base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/039.yaml
  text: You will plant vineyards and cultivate them[a], but you will not drink the wine or gather it, because the worm will eat it.
translation:
  language: id
  text: Engkau akan menanam anggur dan menggarap kebun-kebun itu, tetapi engkau tidak akan minum anggurnya ataupun mengumpulkannya[a], sebab ulat akan memakannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menyimpannya.” Kata Ibrani ini dapat berarti mengumpulkan, menghimpun, atau menyimpan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּרָמִים
  choice: kebun-kebun anggur
  rationale: Bentuk jamak ini menunjuk pada lahan yang ditanami tanaman anggur; padanan ini baku dan alami dalam bahasa Indonesia.
- source_word: תִּטַּע
  choice: engkau akan menanami
  rationale: Bentuk imperfek orang kedua tunggal berfungsi sebagai pernyataan tentang hal yang akan terjadi dalam rangkaian kutuk perjanjian. 'Menanami kebun-kebun anggur' lebih alami daripada 'menanam kebun-kebun anggur'.
- source_word: וְעָבָדְתָּ
  choice: dan menggarapnya
  rationale: Dalam konteks pertanian, עבד berarti mengerjakan atau mengolah lahan. Akhiran '-nya' menyatakan objek yang tersirat, yaitu kebun-kebun anggur.
- source_word: יַיִן
  choice: anggurnya
  rationale: Kata ini berarti minuman anggur, yakni hasil kebun-kebun anggur yang baru disebut. Bentuk '-nya' memperjelas hubungan itu secara alami.
- source_word: לֹא תִשְׁתֶּה
  choice: engkau tidak akan minum
  rationale: Negasi dan bentuk imperfek diterjemahkan sebagai akibat yang akan terjadi dalam rangkaian kutuk.
- source_word: וְלֹא תֶאֱגֹר
  choice: ataupun mengumpulkannya
  rationale: אגר dapat berarti mengumpulkan, menghimpun, atau menyimpan. 'Mengumpulkannya' mempertahankan makna luas verba itu, sedangkan alternatif 'menyimpannya' dicatat dalam catatan kaki.
- source_word: כִּי
  choice: sebab
  rationale: Konjungsi ini memperkenalkan alasan hasil kebun tidak akan dinikmati.
- source_word: תֹאכְלֶנּוּ
  choice: akan memakannya
  rationale: Terjemahan langsung dari verba 'makan' dengan akhiran objek tunggal maskulin; dalam konteks ini objeknya adalah hasil kebun atau anggur yang disebut sebelumnya.
- source_word: הַתֹּלָעַת
  choice: ulat
  rationale: Nomina ini menunjuk secara umum pada makhluk kecil sejenis cacing atau larva yang merusak tanaman. 'Ulat' paling alami dalam konteks kebun tanpa menentukan spesies secara berlebihan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Pronomina 'engkau' mempertahankan sapaan orang kedua tunggal dalam teks Ibrani. Pengulangan 'engkau' pada klausa kedua dipertahankan demi kejelasan, sedangkan objek tersirat pada 'menggarapnya' dibuat eksplisit secara alami.
