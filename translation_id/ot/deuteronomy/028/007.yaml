source:
  edition: WLC
  text: יִתֵּ֨ן יְהוָ֤ה אֶת אֹיְבֶ֨י/ךָ֙ הַ/קָּמִ֣ים עָלֶ֔י/ךָ נִגָּפִ֖ים לְ/פָנֶ֑י/ךָ בְּ/דֶ֤רֶךְ אֶחָד֙ יֵצְא֣וּ אֵלֶ֔י/ךָ וּ/בְ/שִׁבְעָ֥ה דְרָכִ֖ים יָנ֥וּסוּ לְ/פָנֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/028/007.yaml
  text: Yahweh will give your enemies who rise up against you defeated before you[a]. By one way they will come out against you[b], and by seven ways they will flee before you.
translation:
  language: id
  text: Yahweh akan menyerahkan musuh-musuhmu yang bangkit melawanmu dalam keadaan kalah di hadapanmu.[a] Mereka akan maju menyerangmu melalui satu jalan, tetapi akan melarikan diri dari hadapanmu melalui tujuh jalan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Yahweh akan membuat musuh-musuhmu yang bangkit melawanmu terpukul kalah di hadapanmu.”'
    reason: Alternatif ini mempertahankan nuansa נִגָּפִים sebagai 'dipukul' atau 'dikalahkan' serta kemungkinan menerjemahkan יִתֵּן secara lebih umum sebagai 'membuat'.
  - marker: b
    text: Gambaran “satu jalan ... tujuh jalan” menunjukkan bahwa mereka datang sebagai pasukan yang bersatu, tetapi tercerai-berai ketika melarikan diri.
    reason: Menjelaskan citra militer dalam ungkapan Ibrani tanpa mengganti citra tersebut di dalam teks utama.
lexical_decisions:
- source_word: יִתֵּן
  choice: akan menyerahkan
  rationale: Dalam konteks militer, נתן dapat berarti menyerahkan seseorang ke dalam kuasa pihak lain. Pilihan ini lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'akan memberikan', sekaligus tetap mempertahankan konstruksi bahwa musuh diserahkan dalam keadaan kalah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֹיְבֶיךָ
  choice: musuh-musuhmu
  rationale: Padanan langsung dan alami bagi bentuk jamak dengan akhiran orang kedua tunggal.
- source_word: הַקָּמִים עָלֶיךָ
  choice: yang bangkit melawanmu
  rationale: Mempertahankan ungkapan Ibrani tentang tindakan bermusuhan tanpa mempersempitnya menjadi bentuk serangan tertentu.
- source_word: נִגָּפִים
  choice: dalam keadaan kalah
  rationale: Partisipel Nifal ini menyatakan keadaan dipukul atau dikalahkan. Ungkapan ini menyampaikan nilai resultatifnya secara alami setelah 'menyerahkan'.
- source_word: לְפָנֶיךָ
  choice: di hadapanmu / dari hadapanmu
  rationale: Mengikuti idiom spasial-relasional Ibrani; preposisi Indonesia disesuaikan dengan verba pada masing-masing kemunculan.
- source_word: בְּדֶרֶךְ אֶחָד
  choice: melalui satu jalan
  rationale: Menjaga citra dan kesejajaran harfiah dengan 'tujuh jalan', sambil tetap wajar dalam bahasa Indonesia.
- source_word: יֵצְאוּ אֵלֶיךָ
  choice: akan maju menyerangmu
  rationale: Dalam konteks peperangan, יצא אל menggambarkan keluar atau maju menghadapi lawan. 'Maju menyerang' menyampaikan daya idiomatisnya dengan jelas.
- source_word: וּבְשִׁבְעָה דְרָכִים
  choice: tetapi ... melalui tujuh jalan
  rationale: Kata sambung diterjemahkan secara adversatif karena pertentangan satu lawan tujuh nyata dalam konteks. Citra jalan tetap dipertahankan.
- source_word: יָנוּסוּ
  choice: akan melarikan diri
  rationale: Padanan alami yang mempertahankan makna pelarian akibat kekalahan, bukan sekadar mundur secara teratur.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks sumber memakai nama perjanjian secara langsung; transliterasi 'Yahweh' mempertahankan statusnya sebagai nama pribadi tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk pronomina terikat '-mu' mempertahankan sapaan tunggal dalam teks Ibrani. Susunan dua kalimat menjaga gerak retoris dari janji kemenangan menuju gambaran pasukan musuh yang tercerai-berai.
