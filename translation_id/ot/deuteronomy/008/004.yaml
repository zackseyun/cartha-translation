  text: שִׂמְלָ֨תְ/ךָ֜ לֹ֤א בָֽלְתָה֙ מֵֽ/עָלֶ֔י/ךָ וְ/רַגְלְ/ךָ֖ לֹ֣א בָצֵ֑קָה זֶ֖ה אַרְבָּעִ֥ים שָׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/004.yaml
  text: Your clothing did not wear out on you[a], and your foot did not swell[b], these forty years.
translation:
  language: id
  text: Pakaianmu tidak menjadi usang di tubuhmu[a], dan kakimu tidak membengkak[b] selama empat puluh tahun ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “jubahmu tidak menjadi usang di tubuhmu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “kakimu tidak menjadi bengkak”; sebagian orang memahami kata kerja ini secara lebih khusus sebagai “melepuh.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְלָתְךָ
  choice: pakaianmu
  rationale: Kata שִׂמְלָה dapat menunjuk pada sehelai pakaian atau pakaian luar. Bentuk kolektif “pakaianmu” wajar dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi jenis pakaian tertentu.
- source_word: בָלְתָה
  choice: tidak menjadi usang
  rationale: Bentuk dari בלה menyatakan menjadi tua, lapuk, atau usang. “Tidak menjadi usang” tepat dan alami ketika dikenakan pada pakaian.
- source_word: מֵעָלֶיךָ
  choice: di tubuhmu
  rationale: Secara harfiah berarti “dari atasmu.” Dalam konteks pakaian, “di tubuhmu” menyampaikan bahwa pakaian itu tidak menjadi usang ketika dikenakan, tanpa mempertahankan susunan yang kaku.
- source_word: וְרַגְלְךָ
  choice: dan kakimu
  rationale: Teks Ibrani memakai bentuk tunggal. Bahasa Indonesia dapat mempertahankannya secara alami dengan “kakimu.”
- source_word: בָצֵקָה
  choice: tidak membengkak
  rationale: Kata kerja ini secara tradisional dipahami sebagai membengkak atau menjadi bengkak. Kemungkinan makna yang lebih khusus, yakni melepuh, tetap dicatat dalam catatan kaki karena kepastian leksikalnya lebih rendah.
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: selama empat puluh tahun ini
  rationale: Ungkapan durasi Ibrani memuat זֶה, “ini.” Terjemahan ini alami dalam bahasa Indonesia sekaligus mempertahankan unsur penunjuk tersebut.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada lugas dan bermartabat. Bentuk orang kedua tunggal dipertahankan karena Israel disapa secara kolektif dalam bentuk tunggal. Ambiguitas pada שִׂמְלָה dan בָצֵקָה dipertahankan melalui catatan kaki.
