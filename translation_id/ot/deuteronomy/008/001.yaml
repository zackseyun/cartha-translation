  naturalness: Teks revisi memakai bahasa Indonesia baku dan alami. “Hendaklah kamu” sesuai dengan nada parenetis/perintah dalam konteks ini, sedangkan “janjikan dengan sumpah” jelas dan idiomatis untuk נִשְׁבַּע.
  terminology: “Yahweh” dipertahankan untuk יהוה. “Bapa-bapamu” dipilih sebagai padanan yang lebih dekat untuk אֲבֹתֵיכֶם, yang secara eksplisit maskulin, tanpa meniadakan penjelasan bahwa yang dimaksud ialah leluhur perjanjian Israel. Catatan kaki dipertahankan pada jangkar yang tepat.
