  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כָּל הַ/מִּצְוָ֗ה אֲשֶׁ֨ר אָנֹכִ֧י מְצַוְּ/ךָ֛ הַ/יּ֖וֹם תִּשְׁמְר֣וּ/ן לַ/עֲשׂ֑וֹת לְמַ֨עַן תִּֽחְי֜וּ/ן וּ/רְבִיתֶ֗ם וּ/בָאתֶם֙ וִֽ/ירִשְׁתֶּ֣ם אֶת הָ/אָ֔רֶץ אֲשֶׁר נִשְׁבַּ֥ע יְהוָ֖ה לַ/אֲבֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/001.yaml
  text: You shall carefully keep every commandment that I am commanding you today[c][b][a], so that you may live and multiply and enter and possess the land that Yahweh swore to your fathers.
translation:
  language: id
  text: Hendaklah kamu sungguh-sungguh menaati seluruh perintah[a] yang kuperintahkan kepadamu hari ini, supaya kamu hidup dan bertambah banyak, serta masuk dan memiliki[b] negeri yang telah Yahweh janjikan dengan sumpah kepada bapa-bapamu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “setiap perintah.” Bahasa Ibrani memakai bentuk tunggal kolektif, secara harfiah “seluruh perintah itu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “mewarisi” atau “mengambil milik.” Kata Ibrani dapat menyatakan menerima sebagai warisan maupun mengambil dan menguasai, bergantung pada konteks.'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “bapa-bapamu,” yaitu para leluhur Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַמִּצְוָה
  choice: seluruh perintah
  rationale: Bentuk tunggal kolektif dipertahankan secara alami dalam bahasa Indonesia. Ungkapan ini menunjuk pada keseluruhan perintah yang disampaikan Musa, tanpa mengubahnya menjadi bentuk jamak.
- source_word: מְצַוְּךָ
  choice: yang kusampaikan kepadamu
  rationale: Partisip Ibrani menyatakan tindakan Musa yang sedang berlangsung dalam penyampaian perintah. 'Kusampaikan' terdengar alami dalam konteks pidato dan tetap memuat makna memerintahkan melalui nomina 'perintah'.
- source_word: תִּשְׁמְרוּן לַעֲשׂוֹת
  choice: harus dengan sungguh-sungguh menaati
  rationale: Gabungan 'menjaga' dan 'melakukan' menunjuk pada perhatian yang menghasilkan pelaksanaan. 'Dengan sungguh-sungguh menaati' menyampaikan kedua unsur itu dengan bahasa Indonesia yang wajar.
- source_word: לְמַעַן
  choice: supaya
  rationale: '''Supaya'' secara jelas dan alami menandai tujuan atau hasil yang dimaksud.'
- source_word: תִּחְיוּן
  choice: kamu hidup
  rationale: Terjemahan langsung yang mempertahankan cakupan makna hidup atau tetap hidup dalam konteks perjanjian.
- source_word: וּרְבִיתֶם
  choice: bertambah banyak
  rationale: Dalam konteks umat Israel, verba ini berarti menjadi semakin banyak jumlahnya. Pilihan ini lebih jelas dalam bahasa Indonesia modern daripada sekadar 'bertambah'.
- source_word: וּבָאתֶם
  choice: masuk
  rationale: Konteksnya adalah masuk ke negeri yang dijanjikan; 'masuk' merupakan padanan langsung dan alami.
- source_word: וִירִשְׁתֶּם
  choice: memiliki
  rationale: Verba ירשׁ dapat berarti mewarisi, mengambil alih, atau memiliki. 'Memiliki' menyatakan hasil penguasaan negeri tanpa secara tidak perlu mempersempitnya menjadi pewarisan.
- source_word: הָאָרֶץ
  choice: negeri
  rationale: Dalam konteks Ulangan, kata ini menunjuk pada negeri yang dijanjikan kepada Israel. 'Negeri' lebih alami daripada 'tanah' untuk suatu wilayah tempat bangsa akan menetap.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri 'Yahweh', bukan diganti dengan sebuah gelar.
- source_word: נִשְׁבַּע
  choice: telah ... janjikan dengan sumpah
  rationale: Nifal שׁבע berarti bersumpah. Rumusan ini mempertahankan kekuatan sumpah sekaligus menghasilkan hubungan kalimat yang jelas dengan negeri sebagai objek janji.
- source_word: אֲבֹתֵיכֶם
  choice: nenek moyangmu
  rationale: Dalam konteks ini, bentuk maskulin jamak menunjuk kepada para leluhur Israel yang menerima janji perjanjian. 'Nenek moyang' adalah ungkapan Indonesia yang alami; catatan kaki menjelaskan unsur harfiahnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks sumber memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan fungsi nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Bentuk tunggal kolektif הַמִּצְוָה
  choice: seluruh perintah
  alternative: setiap perintah
  rationale: Bentuk tunggal sumber dipertahankan agar pembaca dapat menangkap perintah sebagai satu keseluruhan, sementara alternatif distributif tetap dicatat.
- issue: Makna וִירִשְׁתֶּם dalam kaitannya dengan negeri
  choice: memiliki
  alternative: mewarisi atau mengambil alih
  rationale: Kata sumber memiliki rentang makna yang mencakup pewarisan dan penguasaan. Terjemahan utama tidak menentukan secara berlebihan mekanisme kepemilikan tersebut.
- issue: Istilah kekerabatan אֲבֹתֵיכֶם
  choice: nenek moyangmu
  alternative: bapa-bapamu
  rationale: Rujukannya ialah para leluhur perjanjian Israel. Bahasa Indonesia alami memakai 'nenek moyang', sedangkan bentuk maskulin harfiah dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pidato perjanjian yang khidmat tetapi mudah dipahami. Bentuk 'kamu' dibiarkan tanpa penandaan jumlah seperti dalam bahasa Indonesia; sumber beralih dari sapaan tunggal pada 'kepadamu' kepada verba-verba jamak bagi Israel sebagai umat. Urutan hidup, bertambah banyak, masuk, dan memiliki dipertahankan.
