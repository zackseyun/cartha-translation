source:
  edition: WLC
  text: הַ/מַּֽאֲכִ֨לְ/ךָ֥ מָן֙ בַּ/מִּדְבָּ֔ר אֲשֶׁ֥ר לֹא יָדְע֖וּ/ן אֲבֹתֶ֑י/ךָ לְמַ֣עַן עַנֹּֽתְ/ךָ֗ וּ/לְמַ֨עַן֙ נַסֹּתֶ֔/ךָ לְ/הֵיטִֽבְ/ךָ֖ בְּ/אַחֲרִיתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/016.yaml
  text: who fed you manna in the wilderness[a], which your fathers had not known, in order to humble you and in order to test you[b], to do you good in the end.
translation:
  language: id
  text: yang memberi kamu makan manna di padang gurun, yang belum dikenal oleh nenek moyangmu, untuk merendahkan kamu dan untuk menguji kamu, untuk berbuat baik kepadamu pada akhirnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk berbuat baik kepadamu pada masa kemudian” atau “pada kesudahanmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּאֲכִלְךָ
  choice: yang memberi kamu makan
  rationale: Partisipel kausatif (Hifil) dari אכל dengan akhiran orang kedua tunggal maskulin melanjutkan gambaran tentang TUHAN dari ayat sebelumnya; ungkapan ini alami dan mempertahankan arti kausatif.
- source_word: מָן
  choice: manna
  rationale: Bentuk baku dalam bahasa Indonesia untuk makanan di padang gurun yang disebut oleh nomina Ibrani ini.
- source_word: בַּמִּדְבָּר
  choice: di padang gurun
  rationale: מִדְבָּר menunjuk pada daerah liar atau gurun; 'padang gurun' merupakan ungkapan Indonesia yang lazim dalam konteks perjalanan Israel.
- source_word: אֲשֶׁר לֹא יָדְעוּן אֲבֹתֶיךָ
  choice: yang tidak dikenal oleh nenek moyangmu
  rationale: Klausa ini menerangkan manna dan menyatakan bahwa makanan itu belum dikenal oleh generasi-generasi terdahulu; bentuk pasif menghasilkan bahasa Indonesia yang jelas dan alami.
- source_word: אֲבֹתֶיךָ
  choice: nenek moyangmu
  rationale: Walaupun secara harfiah berarti 'ayah-ayahmu', dalam konteks antargenerasi bentuk jamak ini secara alami berarti para leluhur; 'nenek moyangmu' mempertahankan rujukan tersebut tanpa memberi kesan hanya ayah kandung.
- source_word: לְמַעַן עַנֹּתְךָ
  choice: untuk merendahkan hatimu
  rationale: לְמַעַן menandai tujuan, sedangkan Piel ענה dapat berarti merendahkan atau menindas. Dalam konteks didikan di Ulangan 8, 'merendahkan hati' menyampaikan pembentukan kerendahan hati sambil tetap mengakui pengalaman yang berat.
- source_word: וּלְמַעַן נַסֹּתֶךָ
  choice: dan menguji kamu
  rationale: נסה berarti menguji atau mencoba untuk menyingkapkan keadaan seseorang; 'menguji' adalah padanan Indonesia modern yang paling langsung.
- source_word: לְהֵיטִבְךָ
  choice: supaya ... Ia berbuat baik kepadamu
  rationale: Hifil יטב berarti berbuat baik kepada atau mendatangkan kebaikan bagi seseorang. Klausa tujuan dengan subjek ilahi tersirat dibuat jelas secara alami tanpa mengubah pelakunya.
- source_word: בְּאַחֲרִיתֶךָ
  choice: pada akhirnya
  rationale: אַחֲרִית dengan akhiran orang kedua dapat menunjuk pada kesudahan, hasil akhir, atau masa kemudian bagi Israel. 'Pada akhirnya' alami dalam bahasa Indonesia, sedangkan catatan kaki mempertahankan keluasan maknanya.
theological_decisions:
- issue: Tujuan kesukaran di padang gurun
  choice: Pemberian makan, perendahan hati, dan pengujian dipaparkan sebagai tindakan yang bertujuan dan pada akhirnya mendatangkan kebaikan bagi Israel.
  alternative: Perendahan dan pengujian dapat dipahami semata-mata sebagai hukuman.
  rationale: Dua klausa tujuan berpuncak pada לְהֵיטִבְךָ בְּאַחֲרִיתֶךָ. Terjemahan mempertahankan ketegangan antara pengalaman berat ('merendahkan', 'menguji') dan maksud baik Allah tanpa menghapus salah satunya.
- issue: Cakupan בְּאַחֲרִיתֶךָ
  choice: pada akhirnya
  alternative: pada masa kemudian bagimu; pada kesudahanmu
  rationale: Frasa Ibrani dapat menyatakan hasil akhir atau masa depan yang menyangkut Israel. Teks utama memakai ungkapan Indonesia yang alami, sementara catatan kaki menjaga kemungkinan nuansa lainnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan tunggal Ibrani dipertahankan dengan 'kamu' dan '-mu', sesuai cara Musa menyapa Israel sebagai satu umat. Penanda catatan kaki [a] ditempatkan tepat sesudah frasa yang dijelaskannya.
