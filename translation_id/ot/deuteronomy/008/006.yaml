id: DEU.8.6
reference: Deuteronomy 8:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/שָׁ֣מַרְתָּ֔ אֶת מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֶ֑י/ךָ לָ/לֶ֥כֶת בִּ/דְרָכָ֖י/ו וּ/לְ/יִרְאָ֥ה אֹתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/006.yaml
  text: So you shall keep the commandments of Yahweh your God[b][a], by walking in his ways and by fearing him.
translation:
  language: id
  text: Karena itu,[a] kamu harus menaati perintah-perintah Yahweh, Allahmu, dengan hidup menurut jalan-jalan-Nya dan takut kepada-Nya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Dan kamu harus menaati”; kata penghubung Ibrani dapat menyatakan hubungan koordinatif sederhana, meskipun dalam konteks ini kemungkinan besar menyatakan kesimpulan dari perkataan sebelumnya.
    reason: lexical_alternative
  - marker: b
    text: “Takut kepada-Nya” di sini mencakup rasa takut yang penuh hormat di hadapan Allah; dapat juga diterjemahkan “hormat kepada-Nya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַרְתָּ
  choice: Karena itu, kamu harus menaati
  rationale: Kata kerja שׁמר dalam konteks perjanjian berarti menaati atau memelihara perintah. Konjungsi וְ dipahami secara inferensial berdasarkan konteks sebelumnya, tetapi kemungkinan arti koordinatif tetap dicatat dalam catatan kaki.
- source_word: מִצְוֺת
  choice: perintah-perintah
  rationale: Bentuk jamak ini menunjuk pada berbagai ketetapan yang diperintahkan Allah. Ungkapan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai Yahweh agar nama pribadi dalam teks Ibrani tetap terlihat, bukan diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: 'Bentuk konstruk dengan akhiran orang kedua tunggal maskulin menyatakan kepunyaan: ''Allahmu''.'
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: dengan hidup menurut jalan-jalan-Nya
  rationale: Secara harfiah ungkapan ini berarti 'berjalan di jalan-jalan-Nya'. Dalam idiom Ibrani, berjalan menggambarkan pola hidup; terjemahan ini mempertahankan metafora 'jalan' sekaligus memperjelas maknanya bagi pembaca Indonesia.
- source_word: וּלְיִרְאָה אֹתוֹ
  choice: dan takut kepada-Nya
  rationale: Kata ירא tetap diterjemahkan dengan unsur leksikal 'takut', tanpa dilunakkan menjadi sekadar menghormati. Dalam konteks ini rasa takut tersebut bersifat hormat dan tunduk kepada Allah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai nama perjanjian YHWH secara langsung. Bentuk 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Makna takut kepada Allah
  choice: takut kepada-Nya
  alternative: hormat kepada-Nya atau mengagungkan-Nya
  rationale: Terjemahan utama mempertahankan kekuatan dan ketegangan makna ירא. Konteks perjanjian menunjukkan rasa takut yang penuh hormat, tetapi tidak membenarkan penghilangan unsur 'takut' dari teks utama.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Sapaan orang kedua tunggal dipertahankan dengan 'kamu'. Ungkapan 'hidup menurut jalan-jalan-Nya' menjelaskan idiom berjalan sebagai pola hidup sambil mempertahankan citra jalan dari bahasa Ibrani.
