  text: וְ/זָֽכַרְתָּ֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ כִּ֣י ה֗וּא הַ/נֹּתֵ֥ן לְ/ךָ֛ כֹּ֖חַ לַ/עֲשׂ֣וֹת חָ֑יִל לְמַ֨עַן הָקִ֧ים אֶת בְּרִית֛/וֹ אֲשֶׁר נִשְׁבַּ֥ע לַ/אֲבֹתֶ֖י/ךָ כַּ/יּ֥וֹם הַ/זֶּֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/018.yaml
  text: But you shall remember Yahweh your God[a], for it is he who gives you power to gain wealth, so that he may establish his covenant that he swore to your fathers[c][b], as it is this day.
translation:
  language: id
  text: 'Namun, ingatlah Yahweh, Allahmu, sebab Dialah yang memberimu kekuatan untuk memperoleh kekayaan[a], supaya Ia menegakkan perjanjian-Nya yang telah diikrarkan-Nya dengan sumpah kepada leluhurmu[b], seperti yang nyata pada hari ini.[c]


    [a] Ungkapan Ibrani ini juga dapat diterjemahkan “menghasilkan kekayaan” atau, dalam arti yang lebih luas, “mencapai keberhasilan.”

    [b] Secara harfiah, “bapak-bapakmu”; yang dimaksud ialah para leluhur penerima janji perjanjian.

    [c] Secara harfiah, “seperti hari ini,” yaitu seperti yang terbukti atau tampak dalam keadaan mereka saat itu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini juga dapat diterjemahkan “menghasilkan kekayaan” atau, dalam arti yang lebih luas, “mencapai keberhasilan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bapak-bapakmu”; yang dimaksud ialah para leluhur penerima janji perjanjian.
    reason: cultural_note
  - marker: c
    text: Secara harfiah, “seperti hari ini,” yaitu seperti yang terbukti atau tampak dalam keadaan mereka saat itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Namun, ingatlah
  rationale: Bentuk perfektum dengan waw dalam wacana pengajaran berfungsi sebagai perintah kuat. “Namun” menyatakan pertentangan dengan sikap mengandalkan kekuatan sendiri pada ayat sebelumnya.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Allahmu
  rationale: Nama ilahi dipertahankan sebagai “Yahweh,” sedangkan bentuk bersufiks diterjemahkan “Allahmu” untuk menjaga bahasa relasi perjanjian.
- source_word: כִּי הוּא הַנֹּתֵן לְךָ
  choice: sebab Dialah yang memberimu
  rationale: “Sebab” memperkenalkan alasan untuk mengingat, dan “Dialah” mempertahankan penekanan pada pronomina הוּא.
- source_word: כֹּחַ
  choice: kekuatan
  rationale: Kata ini menunjuk pada daya, kemampuan, atau kuasa. “Kekuatan” wajar dalam bahasa Indonesia dan mempertahankan kaitannya dengan klaim manusia dalam konteks sebelumnya.
- source_word: לַעֲשׂוֹת חָיִל
  choice: untuk memperoleh kekayaan
  rationale: Dalam konteks Ulangan 8:17–18, חָיִל terutama menunjuk pada kekayaan atau kemakmuran yang diperoleh; kemungkinan arti yang lebih luas dipertahankan dalam catatan kaki.
- source_word: לְמַעַן הָקִים אֶת־בְּרִיתוֹ
  choice: supaya Ia menegakkan perjanjian-Nya
  rationale: לְמַעַן menyatakan tujuan, sedangkan bentuk hifil הָקִים dapat berarti membuat perjanjian itu berdiri, berlaku, atau terlaksana. “Menegakkan” mempertahankan cakupan ini tanpa menyiratkan bahwa perjanjian baru pertama kali dibuat.
- source_word: אֲשֶׁר נִשְׁבַּע לַאֲבֹתֶיךָ
  choice: yang telah diikrarkan-Nya dengan sumpah kepada leluhurmu
  rationale: נִשְׁבַּע menyatakan tindakan bersumpah. “Leluhurmu” alami dalam bahasa Indonesia modern, sementara makna harfiahnya dan rujukan khusus kepada para leluhur perjanjian dijelaskan dalam catatan.
- source_word: כַּיּוֹם הַזֶּה
  choice: seperti yang nyata pada hari ini
  rationale: Idiom ini menunjuk pada kenyataan yang dapat disaksikan pada saat itu. Terjemahan utama menyampaikan maknanya, sementara bentuk harfiahnya dicatat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian יהוה; transliterasi “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Cakupan makna חָיִל dalam konteks ekonomi
  choice: kekayaan
  alternative: keberhasilan atau kemakmuran
  rationale: Ayat 17 membicarakan kekayaan yang dianggap diperoleh dengan kekuatan sendiri, sehingga “kekayaan” paling sesuai dengan alur langsung. Arti yang lebih luas tetap dicatat.
- issue: Makna הָקִים bagi perjanjian
  choice: menegakkan
  alternative: meneguhkan atau melaksanakan
  rationale: Kata ini dapat mencakup peneguhan dan pelaksanaan perjanjian. “Menegakkan” menjaga ketegangan itu tanpa menentukan satu sistem teologis tentang waktu atau cara pemenuhan perjanjian.
- issue: Rujukan אֲבֹתֶיךָ
  choice: leluhurmu
  alternative: bapak-bapakmu
  rationale: Rujukannya ialah para leluhur penerima janji perjanjian. “Leluhur” merupakan ungkapan Indonesia modern yang jelas, sedangkan bentuk maskulin harfiahnya dipertahankan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. “Dialah” mempertahankan penekanan sumber Ibrani; “diikrarkan-Nya dengan sumpah” menghindari ungkapan yang kaku; dan catatan kaki ditempatkan tepat sesudah unsur yang diterangkannya.
