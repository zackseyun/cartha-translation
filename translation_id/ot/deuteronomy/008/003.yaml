base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/003.yaml
  text: And he humbled you and let you hunger and fed you the manna[a], which you had not known, nor had your fathers known, so that he might make you know that man does not live by bread alone[b], but man lives by every word that comes from the mouth of Yahweh.
translation:
  language: id
  text: Ia merendahkan engkau, membiarkan engkau lapar, lalu memberi engkau makan manna yang tidak kaukenal dan tidak dikenal oleh nenek moyangmu. Ia melakukan itu supaya engkau mengerti bahwa manusia hidup bukan dari roti saja, melainkan manusia hidup dari segala sesuatu yang keluar dari mulut Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dari setiap yang keluar dari mulut Yahweh.” Ungkapan Ibrani ini lebih luas daripada “firman” saja dan dapat mencakup segala sesuatu yang keluar dari mulut-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְעַנְּךָ
  choice: Ia merendahkan engkau
  rationale: Bentuk piel dari ענה dapat berarti merendahkan atau menindas. Dalam konteks didikan dan ujian di padang gurun, “merendahkan” mempertahankan maksud pendisiplinan tanpa melebih-lebihkan penderitaan fisik.
- source_word: וַיַּרְעִבֶךָ
  choice: membiarkan engkau lapar
  rationale: Bentuk hiphil menyatakan penyebab. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan keterlibatan ilahi dalam ujian tersebut.
- source_word: וַיַּאֲכִלְךָ אֶת־הַמָּן
  choice: lalu memberi engkau makan manna
  rationale: Terjemahan alami bagi bentuk kausatif אכל. “Manna” dipertahankan sebagai nama yang sudah dikenal untuk makanan di padang gurun.
- source_word: אֲשֶׁר לֹא יָדַעְתָּ וְלֹא יָדְעוּן אֲבֹתֶיךָ
  choice: yang tidak kaukenal dan tidak dikenal oleh nenek moyangmu
  rationale: ידע di sini menunjuk pada pengenalan melalui pengalaman, bukan sekadar pengetahuan intelektual. Susunan ini mempertahankan perbedaan antara engkau dan nenek moyangmu.
- source_word: לְמַעַן הוֹדִעֲךָ
  choice: supaya engkau mengerti
  rationale: Secara harfiah bentuk kausatifnya berarti “supaya Ia membuat engkau tahu.” “Supaya engkau mengerti” menyampaikan tujuan pengajaran secara wajar dalam bahasa Indonesia.
- source_word: הָאָדָם
  choice: manusia
  rationale: Dalam pernyataan umum ini, אָדָם merujuk kepada umat manusia, bukan hanya laki-laki. “Manusia” tepat, alami, dan tidak mempersempit cakupannya.
- source_word: הַלֶּחֶם לְבַדּוֹ
  choice: roti saja
  rationale: Padanan ringkas dan alami yang mempertahankan kontras antara makanan jasmani dan sumber kehidupan yang dinyatakan pada klausa berikutnya.
- source_word: כָּל־מוֹצָא פִי יְהוָה
  choice: segala sesuatu yang keluar dari mulut Yahweh
  rationale: מוֹצָא berarti apa yang keluar atau berasal. Terjemahan ini mempertahankan keluasan ungkapan Ibrani dan tidak membatasinya secara diam-diam menjadi “setiap firman,” meskipun firman atau ucapan ilahi jelas termasuk di dalamnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar.
theological_decisions:
- issue: Cakupan אָדָם dalam pernyataan tentang kehidupan
  choice: manusia
  alternative: orang laki-laki; manusia pada umumnya
  rationale: Kata tersebut berbentuk tunggal dan berfungsi secara representatif untuk umat manusia. “Manusia” mempertahankan sifat umum pernyataan itu tanpa memasukkan pembatasan gender yang tidak dimaksudkan sumber.
- issue: Makna מוֹצָא פִי יְהוָה
  choice: segala sesuatu yang keluar dari mulut Yahweh
  alternative: setiap firman yang keluar dari mulut Yahweh
  rationale: Ungkapan Ibrani secara leksikal lebih luas daripada “firman” saja. Terjemahan utama mempertahankan keluasan itu, sedangkan catatan kaki menjelaskan bahwa firman atau ucapan merupakan kemungkinan pemahaman kontekstual.
- issue: Pengulangan יִחְיֶה הָאָדָם dalam bahasa Ibrani
  choice: klausa kedua tidak mengulang kata “manusia hidup” secara penuh
  alternative: melainkan manusia hidup dari segala sesuatu yang keluar dari mulut Yahweh
  rationale: Bahasa Ibrani mengulang “manusia hidup” untuk keseimbangan retoris. Dalam bahasa Indonesia, pelesapan pada klausa kedua tetap jelas, lebih alami, dan tidak mengubah kontras atau isinya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. Kata ganti “engkau” mempertahankan sapaan tunggal Ibrani kepada Israel sebagai kesatuan. Kalimat dipecah menjadi dua agar hubungan tujuan lebih jelas tanpa mengubah alur pemikiran.
