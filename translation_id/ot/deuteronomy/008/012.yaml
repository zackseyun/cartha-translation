  text: lest[a], when you have eaten and are satisfied, and have built good houses and lived in them,
translation:
  language: id
  text: jangan sampai, ketika engkau sudah makan dan kenyang[a], serta sudah membangun rumah-rumah yang bagus dan mendiaminya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “puas.” Kata kerja Ibrani ini dapat menekankan keadaan kenyang secara jasmani atau keadaan benar-benar terpuaskan.
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: jangan sampai
  rationale: Ungkapan ini secara alami menyampaikan peringatan dan tetap menunjukkan bahwa klausa ini bergantung pada konteks ayat sebelumnya.
- source_word: תֹּאכַל
  choice: setelah engkau makan
  rationale: Bentuk imperfek orang kedua tunggal maskulin berada dalam rangkaian peringatan yang berorientasi ke masa depan; 'setelah engkau makan' mengungkapkan hubungan waktunya secara wajar dalam bahasa Indonesia.
- source_word: וְשָׂבָעְתָּ
  choice: dan kenyang
  rationale: Kata kerja שׂבע berarti menjadi kenyang atau terpuaskan. 'Kenyang' mempertahankan gambaran jasmani yang langsung dalam konteks makanan.
- source_word: וּבָתִּים טוֹבִים
  choice: rumah-rumah yang bagus
  rationale: Dalam konteks kemakmuran, טוֹבִים menerangkan kualitas rumah. 'Bagus' lebih alami daripada 'baik' untuk bangunan tanpa melebih-lebihkan kemewahannya.
- source_word: תִּבְנֶה
  choice: engkau membangun
  rationale: Terjemahan ini mempertahankan orang kedua tunggal dan menggambarkan tindakan dalam skenario peringatan yang sama.
- source_word: וְיָשָׁבְתָּ
  choice: dan mendiaminya
  rationale: ישׁב di sini berarti tinggal atau menetap di rumah-rumah tersebut. Akhiran '-nya' secara alami menyatakan acuan kepada rumah-rumah, yang tersirat dalam bahasa Ibrani.
