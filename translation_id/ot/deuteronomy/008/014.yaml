  text: וְ/רָ֖ם לְבָבֶ֑/ךָ וְ/שָֽׁכַחְתָּ֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ הַ/מּוֹצִיאֲ/ךָ֛ מֵ/אֶ֥רֶץ מִצְרַ֖יִם מִ/בֵּ֥ית עֲבָדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/014.yaml
  text: then your heart is lifted up[a], and you forget Yahweh your God, who brought you from the land of Egypt, from the house of servants.
translation:
  language: id
  text: maka hatimu meninggi dan engkau melupakan Yahweh, Allahmu, yang membawa engkau keluar dari tanah Mesir, dari rumah para budak[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dari rumah perbudakan.” Secara harfiah, bahasa Ibraninya berbunyi “dari rumah para budak.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָם לְבָבֶךָ
  choice: hatimu meninggi
  rationale: Ungkapan ini mempertahankan metafora Ibrani tentang hati yang menjadi tinggi, yakni menjadi sombong, sekaligus tetap ringkas dan dapat dipahami dalam bahasa Indonesia.
- source_word: וְשָׁכַחְתָּ
  choice: dan engkau melupakan
  rationale: Bentuk ini melanjutkan rangkaian akibat atau peringatan dari konteks sebelumnya; bentuk kini dalam bahasa Indonesia tidak memaksakan pembacaan lampau atau masa depan.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Allahmu
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, sedangkan אֱלֹהֶיךָ diterjemahkan secara langsung sebagai “Allahmu”. Tanda koma memperjelas aposisi secara alami.
- source_word: הַמּוֹצִיאֲךָ
  choice: yang membawa engkau keluar
  rationale: Partisip berartikel mengidentifikasi Yahweh melalui tindakan pembebasan-Nya. Klausa relatif ini alami dalam bahasa Indonesia dan mempertahankan gagasan keluar dari Mesir.
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: dari tanah Mesir
  rationale: Terjemahan ini mengikuti bentuk lengkap ungkapan Ibrani dan mempertahankan irama formula keluaran.
- source_word: מִבֵּית עֲבָדִים
  choice: dari rumah para budak
  rationale: Terjemahan konkret ini mencerminkan bentuk jamak עֲבָדִים, “budak-budak”, dan tidak mengabstraksikannya menjadi “perbudakan”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama ilahi secara langsung. “Yahweh” mempertahankan nama perjanjian, bukan menggantinya dengan gelar.
- issue: Makna metaforis וְרָם לְבָבֶךָ
  choice: hatimu meninggi
  alternative: engkau menjadi sombong
  rationale: Pilihan ini mempertahankan metafora sumber dan tidak menghapus hubungan antara “hati” dan keangkuhan, sementara maknanya tetap terbaca dalam konteks peringatan.
- issue: Penerjemahan מִבֵּית עֲבָדִים
  choice: dari rumah para budak
  alternative: dari rumah perbudakan
  rationale: Bentuk konkret dipilih karena teks Ibrani memakai nomina jamak “budak-budak”. Alternatif abstrak tetap dicatat karena lebih idiomatis dalam sebagian tradisi penerjemahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Engkau” dipakai untuk mempertahankan sapaan tunggal dalam teks Ibrani. Penanda catatan kaki ditempatkan pada frasa yang dijelaskannya, yaitu “rumah para budak”.
