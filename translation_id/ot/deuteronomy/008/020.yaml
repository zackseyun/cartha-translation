base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/020.yaml
  text: Like the nations that Yahweh is destroying before you[a], so you will perish, because you did not listen to the voice of Yahweh your God.
translation:
  language: id
  text: Seperti bangsa-bangsa yang sedang dibinasakan oleh Yahweh dari hadapan kalian, demikian juga kalian akan binasa, karena kalian tidak mendengarkan suara Yahweh, Allah kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak menaati Yahweh, Allah kalian.” Idiom Ibraninya secara harfiah berarti “tidak mendengarkan suara Yahweh, Allah kalian” dan sering mengandung arti ketaatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּגּוֹיִם
  choice: Seperti bangsa-bangsa
  rationale: Kata depan כְּ menyatakan perbandingan, sedangkan גּוֹיִם dalam konteks ini menunjuk kepada bangsa-bangsa di negeri itu.
- source_word: מַאֲבִיד
  choice: sedang ... binasakan
  rationale: Partisipel Hifil dari אבד menyatakan tindakan kausatif yang sedang berlangsung atau segera terjadi. Bentuk ini juga menjaga kaitan leksikal dengan תֹאבֵדוּן, 'kalian akan binasa'.
- source_word: מִפְּנֵיכֶם
  choice: dari hadapan kalian
  rationale: Ungkapan ini mempertahankan unsur מִן, yaitu disingkirkannya bangsa-bangsa itu dari hadapan Israel.
- source_word: כֵּן תֹאבֵדוּן
  choice: demikian juga kalian akan binasa
  rationale: כֵּן berkorelasi dengan כְּ pada awal ayat, sedangkan bentuk Qal תֹאבֵדוּן menyatakan bahwa Israel sendiri akan binasa.
- source_word: עֵקֶב
  choice: karena
  rationale: Dalam konteks ancaman ini, עֵקֶב memperkenalkan alasan atau dasar bagi akibat yang dinyatakan sebelumnya.
- source_word: לֹא תִשְׁמְעוּן בְּקוֹל
  choice: kalian tidak mendengarkan suara
  rationale: Terjemahan ini mempertahankan citra harfiah tentang mendengarkan suara, tanpa menghilangkan nuansa ketaatan yang terkandung dalam idiom Ibrani.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh, Allah kalian
  rationale: Nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh'; אֱלֹהֵיכֶם merujuk secara tunggal kepada Allah Israel dan memiliki akhiran orang kedua jamak.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung. Transliterasi 'Yahweh' mempertahankannya sebagai nama pribadi, bukan menggantinya dengan gelar.
- issue: Makna idiom שׁמע בקול
  choice: mendengarkan suara
  alternative: menaati
  rationale: Idiom ini mencakup tindakan mendengar sekaligus menaati. Teks utama mempertahankan bentuk konkret bahasa Ibrani, sementara catatan kaki menjelaskan nuansa ketaatannya.
- issue: Nilai waktu לֹא תִשְׁמְעוּן
  choice: tidak mendengarkan
  alternative: tidak mau mendengarkan atau tidak menaati
  rationale: Bentuk imperfek dalam konteks peringatan dapat menggambarkan sikap yang berlaku atau berkelanjutan. Bentuk Indonesia tanpa penandaan waktu yang lebih sempit mempertahankan keluwesan itu dan tidak menambahkan unsur kemauan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada peringatan yang khidmat. 'Kalian' dipakai untuk memperjelas bentuk orang kedua jamak dalam bahasa Ibrani. Struktur perbandingan 'Seperti ..., demikian juga ...' mempertahankan kesejajaran retoris ayat.
