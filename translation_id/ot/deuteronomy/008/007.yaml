  text: כִּ֚י יְהוָ֣ה אֱלֹהֶ֔י/ךָ מְבִֽיאֲ/ךָ֖ אֶל אֶ֣רֶץ טוֹבָ֑ה אֶ֚רֶץ נַ֣חֲלֵי מָ֔יִם עֲיָנֹת֙ וּ/תְהֹמֹ֔ת יֹצְאִ֥ים בַּ/בִּקְעָ֖ה וּ/בָ/הָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/007.yaml
  text: For Yahweh your God is bringing you into a good land[a], a land of streams of water, springs[c][b], and depths flowing out in the valley and in the hill country.
translation:
  language: id
  text: Sebab Yahweh, Allahmu, sedang membawa engkau masuk ke negeri yang baik, negeri yang memiliki aliran air[a], mata-mata air, dan air dari kedalaman[b] yang muncul di lembah dan di daerah pegunungan[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “alur-alur sungai” atau “wadi-wadi”; istilah Ibraninya dapat menunjuk aliran tetap, aliran deras, atau dasar sungai yang kadang kering.
    reason: lexical_alternative
  - marker: b
    text: Atau “air-air dalam”; istilah Ibraninya dapat menunjuk air bawah tanah atau kedalaman berair.
    reason: lexical_alternative
  - marker: c
    text: Atau “di dataran dan di gunung-gunung.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan atau penjelasan bagi nasihat sebelumnya dan mempertahankan hubungan antarkalimat secara alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Ungkapan perjanjian dengan sufiks orang kedua tunggal; bentuk ini baku dan wajar dalam bahasa Indonesia.
- source_word: מְבִיאֲךָ
  choice: sedang membawa engkau masuk
  rationale: Partisip Ibrani menggambarkan tindakan yang sedang berlangsung atau segera terjadi; 'masuk' menyatakan gerak menuju bagian dalam negeri itu.
- source_word: אֶל־אֶרֶץ טוֹבָה
  choice: ke negeri yang baik
  rationale: Terjemahan langsung dan alami tanpa memperluas penilaian 'baik' melampaui teks.
- source_word: אֶרֶץ נַחֲלֵי מָיִם
  choice: negeri dengan aliran-aliran air
  rationale: נַחֲלִים dapat menunjuk sungai kecil, aliran deras musiman, atau wadi; 'aliran-aliran air' jelas dan tidak terlalu teknis.
- source_word: עֲיָנֹת
  choice: mata-mata air
  rationale: Menunjuk sumber air alami; pengulangan nomina menandai bentuk jamak secara wajar.
- source_word: וּתְהֹמֹת
  choice: dan air dari kedalaman
  rationale: Menyampaikan gambaran air dalam atau air bawah tanah tanpa memaksakan uraian hidrologis yang lebih khusus.
- source_word: יֹצְאִים
  choice: yang mengalir keluar
  rationale: Dalam konteks air, ungkapan ini secara alami menggambarkan air yang keluar atau muncul dari sumbernya.
- source_word: בַּבִּקְעָה וּבָהָר
  choice: di lembah dan di daerah pegunungan
  rationale: Mempertahankan pasangan topografis antara kawasan rendah dan kawasan tinggi; bentuk tunggal Ibrani dapat dipahami secara kolektif.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian ilahi secara langsung. 'Yahweh' mempertahankan nama itu sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Cakupan gambaran sumber air
  choice: Mempertahankan 'mata-mata air' dan 'air dari kedalaman' sebagai unsur yang berkaitan dengan tindakan mengalir keluar
  alternative: Membatasi 'yang mengalir keluar' hanya pada air dari kedalaman
  rationale: Partisip jamak יֹצְאִים memungkinkan mata air dan air kedalaman dipahami bersama sebagai air yang muncul; susunan Indonesia tetap membiarkan sedikit kelonggaran sintaksis asli.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina 'engkau' dipertahankan karena Musa menyapa Israel sebagai pihak kedua tunggal secara kolektif. Tanda kaki ditempatkan langsung setelah unsur yang diterangkannya.
