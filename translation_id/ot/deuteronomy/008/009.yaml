  source_fidelity: 'Draf pada umumnya setia kepada Ibrani: roti dipertahankan, kecukupan total dalam לֹא תֶחְסַר כֹּל tersampaikan, citra harfiah batu-batu sebagai besi dipertahankan, dan נְחֹשֶׁת tepat diterjemahkan “tembaga” dalam konteks bahan alam. Namun, “makan roti bukan dalam kemiskinan” bukan susunan Indonesia yang alami dan dapat diperjelas tanpa mengurangi unsur “roti” atau keadaan kemiskinan.'
  naturalness: “Bukan dalam kemiskinan” setelah “makan roti” terasa sebagai kalkus. “Tanpa harus hidup dalam kemiskinan” merupakan Bahasa Indonesia baku yang jelas dan tetap menghubungkan kemiskinan dengan tindakan makan roti. “Menggali tembaga” lebih dekat dengan tindakan menguari/mengambil dari bukit daripada istilah umum “menambang,” sambil tetap alami.
  terminology: “Negeri,” “engkau,” “roti,” “besi,” dan “tembaga” sesuai register baku-modern serta istilah kunci sumber. Catatan untuk נְחֹשֶׁת dengan tepat mempertahankan alternatif “perunggu” dan alasan kontekstual bagi “tembaga.”
