  text: a land in which you will not eat bread in poverty[a], in which you will lack nothing; a land whose stones are iron[b], and from whose hills you will quarry copper.
translation:
  language: id
  text: suatu negeri tempat engkau akan makan roti tanpa harus hidup dalam kemiskinan[a], dan engkau tidak akan kekurangan apa pun di sana; suatu negeri yang batu-batunya adalah besi, dan dari bukit-bukitnya engkau akan menggali tembaga[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dalam kekurangan” atau “dalam keadaan melarat.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani neḥosyet dapat berarti “tembaga” atau “perunggu”; di sini “tembaga” dipilih karena ayat ini berbicara tentang bahan yang digali dari bukit.
    reason: lexical_alternative
lexical_decisions:
- source_word: בְמִסְכֵּנֻת
  choice: dalam kemiskinan
  rationale: Nomina ini menunjukkan kemiskinan, kekurangan, atau keadaan melarat. Frasa ini mempertahankan gambaran bahwa roti tidak akan dimakan dalam keadaan serba kekurangan, tanpa mengulang secara longgar klausa berikutnya.
- source_word: לֶחֶם
  choice: roti
  rationale: Makna dasarnya adalah 'roti'. Istilah konkret dipertahankan, sementara konteks memberi implikasi yang lebih luas mengenai makanan.
- source_word: תֶחְסַר כֹּל
  choice: engkau tidak akan kekurangan apa pun
  rationale: Ungkapan ini menyatakan kecukupan sepenuhnya. Rumusan Indonesia ini alami dan mempertahankan daya menyeluruh כֹּל.
- source_word: אֲבָנֶיהָ בַרְזֶל
  choice: yang batu-batunya adalah besi
  rationale: Bahasa Ibrani singkat dan bersifat aposisional, secara harfiah 'batu-batunya [adalah] besi'. Bentuk ini mempertahankan citra kuat teks dan tidak secara diam-diam mengubahnya menjadi penjelasan tentang kandungan bijih besi.
- source_word: תַּחְצֹב
  choice: menambang
  rationale: Verba ini berarti memahat, menggali, atau mengambil dari batu. Dalam bahasa Indonesia modern, 'menambang' paling jelas untuk pengambilan bahan mineral dari bukit.
- source_word: נְחֹשֶׁת
  choice: tembaga
  rationale: Istilah ini dapat berarti tembaga atau perunggu. Karena konteksnya adalah bahan alami yang diambil dari bukit, 'tembaga' lebih tepat; perunggu merupakan logam campuran.
