base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/015.yaml
  text: who led you through the great and fearsome wilderness[a], with fiery serpents and scorpions and thirsty ground where there was no water; who brought out water for you from the flinty rock[b],
translation:
  language: id
  text: yang menuntunmu melalui padang gurun yang luas dan menakutkan, tempat terdapat ular berbisa[a], kalajengking, dan daerah yang kering kerontang[b], tempat tidak ada air; yang mengeluarkan air bagimu dari batu cadas yang keras seperti batu api,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ular-ular berapi-api.” Ungkapan Ibrani ini mungkin menunjuk pada ular berbisa yang gigitannya menimbulkan rasa terbakar.
    reason: lexical_alternative
  - marker: b
    text: Atau “kehausan” atau “kekeringan.” Kata Ibrani ini menunjuk pada keadaan kering atau tandus di tempat yang tidak memiliki air.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמּוֹלִיכֲךָ
  choice: yang menuntunmu
  rationale: Partisipel Hifil dengan akhiran orang kedua tunggal berfungsi sebagai keterangan bagi TUHAN dalam kalimat yang lebih besar. Klausa relatif ini alami dalam bahasa Indonesia dan tetap mencerminkan tindakan penuntunan.
- source_word: בַּמִּדְבָּר הַגָּדֹל וְהַנּוֹרָא
  choice: melintasi padang gurun yang luas dan menakutkan
  rationale: מִדְבָּר menunjuk kawasan liar atau gurun, bukan semata-mata gurun berpasir. 'Melintasi' sesuai dengan tindakan menuntun melalui kawasan itu; 'luas dan menakutkan' menyampaikan besarnya wilayah serta rasa gentar yang ditimbulkannya.
- source_word: נָחָשׁ שָׂרָף
  choice: ular-ular berbisa
  rationale: Ungkapan ini secara harfiah berkaitan dengan ular yang 'membakar' dan kemungkinan menunjuk pada bisa atau gigitan yang menimbulkan rasa terbakar. Bentuk jamak Indonesia wajar untuk nomina kolektif dalam daftar bahaya.
- source_word: וְעַקְרָב
  choice: dan kalajengking
  rationale: Padanan langsung dan lazim; dalam bahasa Indonesia bentuk nomina ini dapat menyatakan jenis atau kelompok tanpa penanda jamak.
- source_word: וְצִמָּאוֹן אֲשֶׁר אֵין מָיִם
  choice: serta tanah gersang yang tidak berair
  rationale: צִמָּאוֹן dapat berarti kehausan atau kegersangan. Dalam daftar kondisi padang gurun, 'tanah gersang' menyampaikan keadaan lingkungan secara alami, sedangkan klausa berikutnya menegaskan tidak adanya air.
- source_word: הַמּוֹצִיא לְךָ מַיִם
  choice: yang mengeluarkan air bagimu
  rationale: Partisipel Hifil dari יצא menyatakan tindakan menyebabkan air keluar. Terjemahan ini mempertahankan gambaran konkret mukjizat tersebut.
- source_word: מִצּוּר הַחַלָּמִישׁ
  choice: dari batu cadas yang keras seperti batu api
  rationale: צוּר berarti batu besar, cadas, atau tebing batu, sedangkan חַלָּמִישׁ menunjuk batu api atau batu yang sangat keras. Frasa ini mempertahankan kedua unsur dan menonjolkan kerasnya sumber batu tersebut.
theological_decisions:
- issue: Sifat bahaya-bahaya di padang gurun
  choice: Daftar diterjemahkan sebagai bahaya nyata dalam perjalanan Israel tanpa dialegorikan.
  alternative: Menafsirkan ular yang 'membakar' secara metaforis atau merangkum semuanya sebagai bahaya umum.
  rationale: Konteks mengingatkan tindakan historis TUHAN ketika memimpin dan memelihara Israel. Teks Ibrani menyebut bahaya-bahaya konkret, sehingga terjemahan mempertahankan gambaran itu tanpa memasukkan tafsiran simbolis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur awal dan tanda koma akhir dipertahankan karena ayat ini merupakan bagian dari kalimat yang lebih panjang. Penanda catatan kaki ditempatkan langsung sesudah frasa yang diterangkan.
