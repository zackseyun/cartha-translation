  text: וְ/אָכַלְתָּ֖ וְ/שָׂבָ֑עְתָּ וּ/בֵֽרַכְתָּ֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ עַל הָ/אָ֥רֶץ הַ/טֹּבָ֖ה אֲשֶׁ֥ר נָֽתַן לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/010.yaml
  text: And you shall eat and be satisfied[a], and you shall bless Yahweh your God for the good land that he has given you.
translation:
  language: id
  text: Engkau akan makan sampai kenyang, lalu engkau akan memberkati Yahweh, Allahmu,[a] karena negeri yang baik yang telah diberikan-Nya kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mengucap syukur kepada” atau “memuji” Yahweh, Allahmu. Secara harfiah teks Ibrani mengatakan “memberkati”, suatu ungkapan Alkitab untuk berkata baik tentang Allah dengan penuh syukur.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָכַלְתָּ וְשָׂבָעְתָּ
  choice: Engkau akan makan sampai kenyang
  rationale: Rangkaian bentuk perfektum dengan waw dalam konteks nasihat perjanjian menyatakan hasil yang akan dialami. Ungkapan “makan sampai kenyang” alami dalam bahasa Indonesia dan mencakup makna makan hingga puas.
- source_word: וּבֵרַכְתָּ
  choice: engkau akan memberkati
  rationale: Terjemahan ini mempertahankan idiom Ibrani ברך ketika Allah menjadi objeknya. Dalam konteks ini maknanya mencakup mengucap syukur, memuji, dan berkata baik tentang Allah tanpa mempersempitnya menjadi salah satu unsur saja.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” agar nama perjanjian dalam teks sumber dipertahankan dan tidak diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk dengan akhiran orang kedua tunggal menyatakan hubungan kepunyaan atau perjanjian secara langsung.
- source_word: עַל
  choice: karena
  rationale: Dalam konstruksi ini עַל memperkenalkan alasan untuk memberkati Yahweh, yaitu pemberian negeri yang baik.
- source_word: הָאָרֶץ הַטֹּבָה
  choice: negeri yang baik
  rationale: Padanan langsung ini mempertahankan motif negeri perjanjian dan tidak membatasi kebaikannya hanya pada kesuburan atau keindahan.
- source_word: אֲשֶׁר נָתַן לָךְ
  choice: yang telah diberikan-Nya kepadamu
  rationale: Bentuk perfektum menggambarkan negeri itu sebagai pemberian Allah yang sudah diberikan dan tetap relevan bagi penerimanya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama ilahi secara langsung; “Yahweh” mempertahankan nama pribadi perjanjian alih-alih menggantinya dengan gelar.
- issue: Makna ברך ketika diarahkan kepada Allah
  choice: memberkati
  alternative: mengucap syukur atau memuji
  rationale: “Memberkati” mempertahankan idiom dan keluasan makna teks Ibrani. Catatan kaki menjelaskan pilihan-pilihan alami dalam bahasa Indonesia tanpa meniadakan ketegangan ungkapan bahwa manusia ‘memberkati’ Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Engkau” mempertahankan sapaan orang kedua tunggal kepada Israel, sedangkan “makan sampai kenyang” dipilih sebagai ungkapan alami. Penanda catatan kaki ditempatkan setelah frasa yang benar-benar dijelaskannya, yaitu “memberkati Yahweh, Allahmu”.
