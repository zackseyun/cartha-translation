  text: and your herds and your flocks multiply[a], and silver and gold increase for you[b], and all that is yours increases—
translation:
  language: id
  text: dan ternak sapimu serta kambing dombamu bertambah banyak, perak dan emasmu bertambah, dan segala milikmu bertambah—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְקָרְךָ
  choice: dan ternak sapimu
  rationale: בקר menunjuk secara kolektif pada ternak jenis sapi. Ungkapan ini mempertahankan jenis hewan dan kepemilikan orang kedua tunggal.
- source_word: וְצֹאנְךָ
  choice: serta kawanan kambing dombamu
  rationale: צאן adalah istilah kolektif bagi ternak kecil, khususnya kambing dan domba. 'Kawanan kambing domba' menyampaikan cakupan itu secara alami tanpa membatasinya hanya pada salah satu jenis.
- source_word: יִרְבְּיוּן
  choice: bertambah banyak
  rationale: Bentuk verba dari רבה menyatakan pertambahan jumlah dan berpredikat pada dua kelompok ternak.
- source_word: וְכֶסֶף וְזָהָב
  choice: perak dan emas
  rationale: Teks Ibrani menyebut kedua logam tanpa penanda milik langsung; hubungan dengan penerima dinyatakan oleh לָךְ sesudah verba.
- source_word: יִרְבֶּה לָךְ
  choice: bertambah bagimu
  rationale: Terjemahan ini mempertahankan unsur datif לָךְ dan menyatakan bahwa kekayaan itu bertambah bagi orang yang disapa, tanpa menambahkan penanda milik langsung pada 'perak dan emas'.
- source_word: וְכֹל אֲשֶׁר לְךָ
  choice: dan segala milikmu
  rationale: Konstruksi harfiah 'segala yang ada padamu/bagimu' merangkum seluruh kepunyaan; 'segala milikmu' ringkas dan wajar dalam bahasa Indonesia.
- source_word: יִרְבֶּה
  choice: bertambah
  rationale: Dalam rangkuman mengenai seluruh milik, 'bertambah' lebih alami daripada 'berlipat ganda' dan tetap mencerminkan רבה.
