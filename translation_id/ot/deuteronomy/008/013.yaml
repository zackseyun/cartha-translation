translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Konjungsi pembuka serta tanda pisah akhir dipertahankan karena ayat ini merupakan bagian dari rangkaian kalimat yang berlanjut. Pengulangan 'bertambah' mengikuti pola retoris teks Ibrani.
