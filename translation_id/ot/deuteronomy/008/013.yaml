  naturalness: '''Perak dan emas bertambah bagimu'' terdengar kaku dan tidak lazim dalam bahasa Indonesia modern. ''Perak dan emasmu bertambah'' adalah ungkapan baku yang jelas. ''Kawanan kambing dombamu'' dapat dipahami, tetapi ''kambing dombamu'' sendiri sudah merupakan ungkapan kolektif yang alami untuk צֹאן dan menghindari penambahan nomina ''kawanan'' yang tidak diperlukan.'
  terminology: '''Ternak sapimu'' secara memadai menyatakan בָּקָר sebagai ternak sapi. ''Kambing dombamu'' mencakup cakupan kolektif צֹאן tanpa membatasi salah satu spesies. Istilah kepemilikan dan pertambahan dipertahankan secara konsisten.'
