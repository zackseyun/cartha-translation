source:
  edition: WLC
  text: וְ/הָיָ֗ה אִם שָׁכֹ֤חַ תִּשְׁכַּח֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הָֽלַכְתָּ֗ אַחֲרֵי֙ אֱלֹהִ֣ים אֲחֵרִ֔ים וַ/עֲבַדְתָּ֖/ם וְ/הִשְׁתַּחֲוִ֣יתָ לָ/הֶ֑ם הַעִדֹ֤תִי בָ/כֶם֙ הַ/יּ֔וֹם כִּ֥י אָבֹ֖ד תֹּאבֵדֽוּ/ן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/019.yaml
  text: And if you indeed forget Yahweh your God and go after other gods and serve them and bow down to them[a], I testify against you today that you will surely perish.
translation:
  language: id
  text: Jika engkau benar-benar[a] melupakan Yahweh, Allahmu, dan mengikuti allah-allah lain, mengabdi kepada mereka, serta bersujud kepada mereka, aku bersaksi melawan kamu hari ini bahwa kamu pasti akan binasa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah, bahasa Ibrani memakai bentuk penegasan: “melupakan, engkau melupakan,” yang berarti “benar-benar melupakan” atau “sungguh melupakan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Jika
  rationale: Membuka peringatan bersyarat secara alami dalam bahasa Indonesia; unsur penghubung waw dapat tersirat tanpa kehilangan alur.
- source_word: שָׁכֹחַ תִּשְׁכַּח
  choice: engkau benar-benar melupakan
  rationale: Infinitif absolut yang disertai verba finit menegaskan tindakan. 'Benar-benar' menyampaikan penekanan tanpa menentukan bahwa kelupaan itu mutlak atau total.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama perjanjian ilahi sebagaimana terdapat langsung dalam teks Ibrani.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Mencerminkan bentuk tunggal dengan sufiks orang kedua maskulin tunggal dan relasi perjanjian dalam sapaan kepada Israel.
- source_word: וְהָלַכְתָּ אַחֲרֵי
  choice: lalu mengikuti
  rationale: Ungkapan idiomatis ini menunjuk pada tindakan mengikuti atau memberikan kesetiaan; 'mengikuti' alami dan jelas dalam bahasa Indonesia.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: allah-allah lain
  rationale: Menerjemahkan secara langsung nomina jamak dan adjektiva 'lain', tanpa menambahkan gagasan 'asing' yang tidak dinyatakan secara eksplisit.
- source_word: וַעֲבַדְתָּם
  choice: mengabdi kepada mereka
  rationale: Mempertahankan makna dasar עבד, yaitu melayani atau mengabdi, serta membedakannya dari tindakan sujud pada klausa berikutnya.
- source_word: וְהִשְׁתַּחֲוִיתָ לָהֶם
  choice: dan sujud kepada mereka
  rationale: Menjaga gambaran fisik sekaligus makna kultis berupa membungkuk atau merebahkan diri sebagai penghormatan.
- source_word: הַעִדֹתִי בָכֶם הַיּוֹם
  choice: pada hari ini aku bersaksi terhadap kamu
  rationale: Mempertahankan daya hukum dari bentuk Hifil עוד dan arah kesaksian yang memberatkan, tanpa memperluasnya menjadi formula pemanggilan saksi yang tidak ada dalam ayat.
- source_word: כִּי אָבֹד תֹּאבֵדוּן
  choice: bahwa kamu pasti akan binasa
  rationale: Infinitif absolut bersama verba imperfek menyatakan kepastian yang kuat; 'pasti akan binasa' mempertahankan penekanan dan nuansa hasil/intransitif.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian dan tidak menggantinya dengan gelar.
- issue: Makna hukuman אָבֹד תֹּאבֵדוּן
  choice: kamu pasti akan binasa
  alternative: kamu pasti akan dimusnahkan
  rationale: Bentuk Ibrani dapat menyoroti kebinasaan sebagai hasil tanpa menyebut pelaku secara eksplisit. Pilihan ini mempertahankan ketegangan itu dan tidak secara diam-diam mengubahnya menjadi bentuk pasif dengan pelaku tersirat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan langsung. Kata ganti tunggal 'engkau' dipertahankan pada bagian pertama karena Israel disapa sebagai satu kesatuan; bentuk 'kamu' pada kesaksian dan ancaman mengikuti peralihan bentuk Ibrani ke jamak. Istilah 'mengabdi' dan 'sujud' dibedakan agar dua verba kultis tidak diratakan menjadi satu makna umum.
