  yaml_path: translation/ot/deuteronomy/008/017.yaml
  text: and you say in your heart[a], ‘My power and the strength of my hand have gotten me this wealth,’
translation:
  language: id
  text: dan engkau berkata dalam hatimu, “Kekuatanku dan keperkasaan tangankulah yang menghasilkan kekayaan ini bagiku[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kemakmuran ini.” Kata Ibrani חַיִל dapat berarti kekayaan, sumber daya, kekuatan, atau kemampuan, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Jangan sampai engkau berkata
  rationale: Dalam rangkaian peringatan ayat 11–17, bentuk ini menyatakan hal yang harus diwaspadai, bukan sekadar tindakan berurutan. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya peringatannya.
- source_word: בִּלְבָבֶךָ
  choice: dalam hatimu
  rationale: Mempertahankan metafora Ibrani tentang pikiran batin atau perkataan kepada diri sendiri, sekaligus tetap mudah dipahami.
- source_word: כֹּחִי
  choice: kekuatanku
  rationale: כֹּחַ menunjuk pada kekuatan, daya, atau kemampuan pribadi. 'Kekuatan' merupakan padanan Indonesia yang langsung dan wajar.
- source_word: וְעֹצֶם יָדִי
  choice: dan keperkasaan tanganku
  rationale: עֹצֶם menyatakan kekuatan atau kehebatan, sedangkan 'tangan' mempertahankan gambaran konkret Ibrani mengenai daya dan kemampuan pribadi.
- source_word: עָשָׂה לִי
  choice: yang menghasilkan ... bagiku
  rationale: Secara harfiah berarti 'membuat bagiku', tetapi dalam konteks perolehan harta bermakna menghasilkan atau memperoleh. Bentuk tunggal 'yang menghasilkan' secara alami merangkum dua unsur sebagai gabungan kemampuan diri.
- source_word: הַחַיִל הַזֶּה
  choice: kekayaan ini
  rationale: Dalam konteks kelimpahan materi di Ulangan 8, חַיִל paling tepat menunjuk pada kekayaan atau kemakmuran, meskipun cakupan katanya lebih luas.
theological_decisions:
- issue: Makna חַיִל dalam peringatan perjanjian
  choice: kekayaan
  alternative: kemakmuran; kemampuan; kekuatan
  rationale: Konteks langsung berbicara tentang hasil bumi, ternak, perak, emas, dan harta yang bertambah. 'Kekayaan' mempertahankan fokus pada keberhasilan materi yang secara keliru dianggap berasal dari kemampuan sendiri, tanpa membatasi kemungkinan leksikal kata Ibraninya dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada peringatan yang lugas dan bermartabat. Pronomina 'engkau' dipakai untuk mempertahankan sapaan tunggal langsung. Metafora 'dalam hati' dan 'tangan' dipertahankan karena alami dan bermakna dalam bahasa Indonesia.
