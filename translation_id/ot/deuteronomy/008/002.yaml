id: DEU.8.2
reference: Deuteronomy 8:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/זָכַרְתָּ֣ אֶת כָּל הַ/דֶּ֗רֶךְ אֲשֶׁ֨ר הֹלִֽיכֲ/ךָ֜ יְהוָ֧ה אֱלֹהֶ֛י/ךָ זֶ֛ה אַרְבָּעִ֥ים שָׁנָ֖ה בַּ/מִּדְבָּ֑ר לְמַ֨עַן עַנֹּֽתְ/ךָ֜ לְ/נַסֹּֽתְ/ךָ֗ לָ/דַ֜עַת אֶת אֲשֶׁ֧ר בִּֽ/לְבָבְ/ךָ֛ הֲ/תִשְׁמֹ֥ר מצות/ו אִם לֹֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/002.yaml
  text: And you shall remember all the way that Yahweh your God has led you these forty years in the wilderness[a], in order to humble you, to test you, to know what was in your heart, whether you would keep his commandments or not.
translation:
  language: id
  text: Ingatlah seluruh perjalanan yang kaulalui ketika Yahweh, Allahmu, menuntunmu selama empat puluh tahun ini di padang belantara. Ia melakukannya untuk merendahkanmu, mengujimu, dan mengetahui apa yang ada dalam hatimu[a]—apakah engkau akan menaati perintah-perintah-Nya atau tidak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menyingkapkan apa yang ada dalam hatimu.” Secara harfiah, teks Ibrani berbunyi “mengetahui apa yang ada dalam hatimu”, sebagaimana dipertahankan dalam teks utama.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Ingatlah
  rationale: Bentuk ini berfungsi sebagai seruan dalam wacana pengajaran. Imperatif Indonesia menyampaikan tuntutan perjanjian secara wajar dan tegas.
- source_word: כָּל הַדֶּרֶךְ
  choice: seluruh perjalanan yang kaulalui
  rationale: דֶּרֶךְ di sini menunjuk pada keseluruhan pengalaman perjalanan Israel, bukan sekadar jalan fisik. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan cakupan כָּל.
- source_word: הֹלִיכֲךָ
  choice: menuntunmu
  rationale: Bentuk Hifil dari הלך bersifat kausatif. 'Menuntunmu' secara alami menyatakan tindakan Yahweh membawa dan memimpin Israel sepanjang perjalanan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk posesif mempertahankan bahasa hubungan perjanjian dan sesuai dengan pemakaian baku bahasa Indonesia.
- source_word: זֶה אַרְבָּעִים שָׁנָה
  choice: selama empat puluh tahun ini
  rationale: Menyatakan durasi tindakan penuntunan secara idiomatis sambil mempertahankan unsur deiktis זֶה.
- source_word: בַּמִּדְבָּר
  choice: di padang belantara
  rationale: מִדְבָּר menunjuk pada wilayah liar dan gersang tempat Israel mengembara; 'padang belantara' lebih luas daripada 'gurun' dan sesuai dengan konteks.
- source_word: לְמַעַן
  choice: Ia melakukannya untuk
  rationale: Menyatakan tujuan dengan jelas. Kalimat baru dan rujukan 'Ia melakukannya' menghindari rangkaian anak kalimat yang berat tanpa mengubah hubungan logis teks Ibrani.
- source_word: עַנֹּתְךָ
  choice: merendahkanmu
  rationale: Dalam konteks ini ענה berarti membawa seseorang ke keadaan rendah melalui kesukaran; pilihan ini juga selaras dengan konteks langsung Ulangan 8:3.
- source_word: לְנַסֹּתְךָ
  choice: mengujimu
  rationale: נסה menyatakan pengujian atau pembuktian; 'menguji' merupakan padanan modern yang langsung dan jelas.
- source_word: לָדַעַת
  choice: mengetahui
  rationale: Padanan langsung infinitif ידע ini mempertahankan ungkapan antropomorfis dan tidak menyelesaikan ketegangan teologis yang ada dalam teks.
- source_word: אֶת אֲשֶׁר בִּלְבָבְךָ
  choice: apa yang ada dalam hatimu
  rationale: לֵבָב mencakup pikiran, kehendak, dan batin. 'Hati' merupakan padanan Indonesia yang mapan dan sesuai dengan konteks ketaatan.
- source_word: הֲתִשְׁמֹר מצותו אִם־לֹא
  choice: apakah engkau akan menaati perintah-perintah-Nya atau tidak
  rationale: שמר dalam konteks perintah berarti memelihara dengan cara menaatinya. Bentuk pertanyaan tidak langsung serta alternatif 'atau tidak' dipertahankan.
theological_decisions:
- issue: Bahasa antropomorfis dalam frasa 'mengetahui apa yang ada dalam hatimu'
  choice: Mempertahankan kata 'mengetahui' secara langsung
  alternative: untuk menyingkapkan apa yang ada dalam hatimu
  rationale: Teks Ibrani menggunakan ידע, 'mengetahui'. Terjemahan utama mempertahankan bahasa perjanjian yang antropomorfis itu dan tidak menyelesaikan pertanyaan tentang kemahatahuan Allah secara tersirat.
translation_notes:
  register: Bahasa modern, lugas, dan bermartabat. Pronomina tunggal 'engkau/-mu' mempertahankan sapaan Ibrani kepada Israel sebagai satu umat. Kalimat Ibrani yang panjang dibagi menjadi dua agar mudah dipahami, sementara hubungan tujuan tetap dinyatakan dengan jelas.
