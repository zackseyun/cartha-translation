  text: הִשָּׁ֣מֶר לְ/ךָ֔ פֶּן תִּשְׁכַּ֖ח אֶת יְהוָ֣ה אֱלֹהֶ֑י/ךָ לְ/בִלְתִּ֨י שְׁמֹ֤ר מִצְוֺתָי/ו֙ וּ/מִשְׁפָּטָ֣י/ו וְ/חֻקֹּתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/011.yaml
  text: Be careful lest you forget Yahweh your God by failing to keep his commandments and his judgments and his statutes[b][a], which I am commanding you today.
translation:
  language: id
  text: Berhati-hatilah agar kamu tidak melupakan Yahweh, Allahmu, dengan tidak menaati perintah-perintah-Nya, hukum-hukum-Nya, dan ketetapan-ketetapan-Nya yang kuperintahkan kepadamu hari ini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִשָּׁמֶר לְךָ
  choice: Berhati-hatilah
  rationale: Ungkapan peringatan dengan imperatif Nifal; bentuk ini alami dalam bahasa Indonesia dan mempertahankan daya desaknya.
- source_word: פֶּן תִּשְׁכַּח
  choice: supaya kamu tidak melupakan
  rationale: פֶּן memperkenalkan bahaya yang harus dihindari. Ungkapan ini lebih alami daripada bentuk harfiah yang kaku, tanpa menghilangkan nuansa peringatan.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Allahmu
  rationale: Nama ilahi יְהוָה ditransliterasikan sebagai Yahweh, sedangkan אֱלֹהֶיךָ diterjemahkan sebagai sebutan perjanjian yang langsung.
- source_word: לְבִלְתִּי שְׁמֹר
  choice: dengan tidak menaati
  rationale: Konstruksi infinitif ini menjelaskan wujud atau cara melupakan Yahweh, yaitu tidak memelihara perintah-Nya. 'Menaati' merupakan padanan Indonesia yang alami dalam konteks hukum ilahi.
- source_word: מִצְוֺתָיו
  choice: perintah-perintah-Nya
  rationale: Mempertahankan makna perintah yang berwenang dan corak perjanjian dalam kitab Ulangan.
- source_word: מִשְׁפָּטָיו
  choice: ketetapan-ketetapan hukum-Nya
  rationale: Membedakan מִשְׁפָּט dari dua istilah hukum lain dalam rangkaian ini serta mempertahankan nuansa yuridisnya.
- source_word: חֻקֹּתָיו
  choice: ketetapan-ketetapan-Nya
  rationale: Padanan formal dan lazim bagi ketentuan yang ditetapkan, dengan pembedaan secukupnya dari מִשְׁפָּט.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: yang kusampaikan kepadamu hari ini
  rationale: Dalam konteks Musa menyampaikan perintah-perintah ilahi, 'kusampaikan' menghindari kesan bahwa hukum itu berasal dari Musa sendiri, sambil mempertahankan immediacy 'hari ini'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian secara langsung; transliterasi mempertahankan statusnya sebagai nama diri.
- issue: Hubungan לְבִלְתִּי שְׁמֹר dengan tindakan melupakan
  choice: dengan tidak menaati
  alternative: sehingga tidak menaati
  rationale: Dipertahankan sebagai cara atau wujud konkret dari melupakan Yahweh, tetapi kemungkinan nuansa akibat atau penjelasan tetap dicatat karena fungsi konstruksi tersebut dapat dipahami lebih dari satu cara.
- issue: Pelaku yang menyampaikan perintah
  choice: yang kusampaikan kepadamu
  alternative: yang kuperintahkan kepadamu
  rationale: Pembicara langsung adalah Musa, sementara perintah itu milik Yahweh. Pilihan ini menjaga perantaraan Musa tanpa menyiratkan bahwa Musa adalah sumber hukum tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Sapaan orang kedua tunggal Ibrani diterjemahkan dengan 'kamu' agar jelas dan mudah dipahami. Tiga istilah hukum dipertahankan sebagai tiga unsur berbeda, meskipun pengulangannya sedikit formal.
