id: DEU.8.5
reference: Deuteronomy 8:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/יָדַעְתָּ֖ עִם לְבָבֶ֑/ךָ כִּ֗י כַּ/אֲשֶׁ֨ר יְיַסֵּ֥ר אִישׁ֙ אֶת בְּנ֔/וֹ יְהוָ֥ה אֱלֹהֶ֖י/ךָ מְיַסְּרֶֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/008/005.yaml
  text: So know in your heart that[a], just as a man disciplines his son, Yahweh your God disciplines you.
translation:
  language: id
  text: Maka ketahuilah dalam hatimu bahwa sebagaimana seorang laki-laki mendisiplinkan[a] putranya, demikianlah Yahweh, Allahmu, mendisiplinkan engkau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menghajar” atau “mengoreksi”; kata kerja Ibrani ini dapat mencakup hukuman yang memperbaiki maupun didikan yang membentuk.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: Maka ketahuilah
  rationale: Bentuk Qal perfek orang kedua tunggal dengan waw meneruskan alur ayat sebelumnya dan di sini memiliki daya nasihat atau kesimpulan. Bentuk ini menyampaikan dorongan tersebut secara alami dalam bahasa Indonesia.
- source_word: עִם לְבָבֶךָ
  choice: dalam hatimu
  rationale: Ungkapan Ibrani ini menunjuk pada pengakuan atau pemahaman batin; 'dalam hatimu' merupakan padanan idiomatis yang wajar.
- source_word: כִּי
  choice: bahwa
  rationale: Kata ini memperkenalkan isi yang harus diketahui, bukan terutama alasan sebab-akibat.
- source_word: כַּאֲשֶׁר
  choice: sebagaimana ... demikianlah
  rationale: Konstruksi ini menandai perbandingan. Pasangan 'sebagaimana ... demikianlah' membuat hubungan perbandingan jelas dan alami dalam bahasa Indonesia tanpa mengubah isinya.
- source_word: יְיַסֵּר / מְיַסְּרֶךָּ
  choice: mendisiplinkan
  rationale: Akar יסר mencakup koreksi, hukuman yang memperbaiki, dan didikan yang membentuk. 'Mendisiplinkan' mempertahankan keluasan makna itu, dan pengulangan padanan yang sama mencerminkan pengulangan Ibrani.
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Teks secara eksplisit menyebut seorang laki-laki, bukan secara langsung 'seorang ayah'; hubungan kebapakan tersirat dari 'putranya'.
- source_word: בְּנוֹ
  choice: putranya
  rationale: Nomina Ibrani secara khusus berarti anak laki-laki atau putra. 'Putranya' mempertahankan jenis kelamin dan hubungan keluarga dalam perbandingan tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama perjanjian itu dipertahankan.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Ini adalah sebutan perjanjian yang langsung menyapa Israel dalam bentuk orang kedua tunggal; 'Allahmu' mempertahankan bentuk tersebut.
theological_decisions:
- issue: Sifat tindakan disiplin ilahi
  choice: mendisiplinkan
  alternative: menghajar; mengoreksi; mendidik
  rationale: Pilihan ini mempertahankan baik dimensi korektif maupun pembentukan, tanpa membatasi tindakan itu pada hukuman saja atau melemahkannya menjadi pengajaran semata.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama YHWH secara langsung. 'Yahweh' mempertahankan nama pribadi ilahi, bukan menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan tunggal dipertahankan dengan 'hatimu', 'Allahmu', dan 'engkau'. 'Putranya' dipilih daripada 'anaknya' agar kekhususan בְּנוֹ sebagai anak laki-laki tetap tampak.
