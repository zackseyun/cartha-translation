revisions:
- from: Janganlah engkau makan roti beragi bersama kurban itu. Selama tujuh hari engkau harus makan roti tidak beragi bersamanya, yaitu roti penderitaan[a], sebab engkau keluar dengan tergesa-gesa dari tanah Mesir. Dengan demikian, engkau akan mengingat hari ketika engkau keluar dari tanah Mesir sepanjang hidupmu.
  to: Janganlah engkau makan roti beragi bersama kurban itu. Selama tujuh hari, makanlah roti tidak beragi bersamanya, yaitu roti penderitaan[a], karena engkau keluar dari negeri Mesir dengan tergesa-gesa, supaya engkau mengingat hari ketika engkau keluar dari negeri Mesir sepanjang hidupmu.
  rationale: Revisi memulihkan fungsi tujuan dari לְמַעַן dengan “supaya engkau mengingat,” memakai bentuk perintah yang lebih langsung, dan mengganti “tanah Mesir” dengan “negeri Mesir” demi kelaziman. Makna, ambiguitas leksikal pada “roti penderitaan,” serta acuan kontekstual kepada kurban tetap dipertahankan.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T17:12:49Z'
