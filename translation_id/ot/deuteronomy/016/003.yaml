  text: לֹא תֹאכַ֤ל עָלָי/ו֙ חָמֵ֔ץ שִׁבְעַ֥ת יָמִ֛ים תֹּֽאכַל עָלָ֥י/ו מַצּ֖וֹת לֶ֣חֶם עֹ֑נִי כִּ֣י בְ/חִפָּז֗וֹן יָצָ֨אתָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם לְמַ֣עַן תִּזְכֹּר֔ אֶת י֤וֹם צֵֽאתְ/ךָ֙ מֵ/אֶ֣רֶץ מִצְרַ֔יִם כֹּ֖ל יְמֵ֥י חַיֶּֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/003.yaml
  text: You shall not eat leavened bread with it. Seven days you shall eat with it unleavened bread[a], the bread of affliction, because you came out from the land of Egypt in haste, so that you may remember the day of your coming out from the land of Egypt all the days of your life.
translation:
  language: id
  text: Janganlah engkau makan roti beragi bersama kurban itu. Selama tujuh hari, makanlah roti tidak beragi bersamanya, yaitu roti penderitaan[a], karena engkau keluar dari negeri Mesir dengan tergesa-gesa, supaya engkau mengingat hari ketika engkau keluar dari negeri Mesir sepanjang hidupmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “roti kemiskinan” atau “roti kesengsaraan.” Ungkapan Ibrani ini dapat menekankan kesukaran, kekurangan, atau penderitaan yang berkaitan dengan keluarnya Israel dari Mesir.
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלָיו
  choice: bersama kurban itu / bersamanya
  rationale: Dalam konteks perjamuan Paskah, עַל menyatakan makanan yang disantap bersama kurban. Penyebutan 'kurban itu' memperjelas acuan pronomina bagi pembaca modern tanpa mengubah maksud.
- source_word: חָמֵץ
  choice: roti beragi
  rationale: Dalam konteks makan, kata ini menunjuk pada makanan beragi, khususnya roti, bukan sekadar bahan ragi.
- source_word: מַצּוֹת
  choice: roti tidak beragi
  rationale: Padanan Indonesia yang jelas dan lazim bagi roti perayaan yang dibuat tanpa ragi.
- source_word: לֶחֶם עֹנִי
  choice: roti penderitaan
  rationale: Mempertahankan bobot kesukaran, kekurangan, dan kesengsaraan yang terkandung dalam עֹנִי tanpa membatasinya hanya pada kemiskinan ekonomi.
- source_word: בְחִפָּזוֹן
  choice: dengan tergesa-gesa
  rationale: Mengungkapkan keadaan keberangkatan yang mendesak tanpa menambahkan gagasan ketakutan atau pelarian yang tidak dinyatakan secara eksplisit.
- source_word: לְמַעַן תִּזְכֹּר
  choice: Dengan demikian, engkau akan mengingat
  rationale: Menyampaikan hubungan tujuan atau hasil secara alami dalam bahasa Indonesia; bentuk ini tidak memaksakan perbedaan tajam antara tujuan dan hasil.
- source_word: יוֹם צֵאתְךָ
  choice: hari ketika engkau keluar
  rationale: Ungkapan Indonesia yang alami dan tetap mempertahankan fokus pada hari keluarnya Israel.
- source_word: כֹּל יְמֵי חַיֶּיךָ
  choice: sepanjang hidupmu
  rationale: Padanan idiomatis yang menyatakan ingatan terus-menerus selama seluruh masa hidup.
theological_decisions:
- issue: Makna לֶחֶם עֹנִי sebagai tanda peringatan keluaran
  choice: roti penderitaan
  alternative: roti kemiskinan; roti kesengsaraan
  rationale: Pilihan ini menjaga kaitan roti tersebut dengan kesukaran Israel dan pembebasan mereka, sambil mempertahankan keluasan makna frasa Ibrani.
- issue: Hubungan לְמַעַן dengan tindakan mengingat
  choice: Dengan demikian, engkau akan mengingat
  alternative: supaya engkau mengingat
  rationale: Bahasa sumber dapat menyatakan tujuan dengan nuansa hasil. Terjemahan ini alami dan tidak menutup sepenuhnya kedua nuansa tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina tunggal 'engkau' mempertahankan bentuk orang kedua tunggal dalam teks Ibrani. 'Kurban itu' dipakai pada penyebutan pertama untuk memperjelas acuan עָלָיו kepada kurban Paskah dalam konteks dekat.
