  verdict: revise
  source_fidelity: Draf secara umum mencerminkan larangan memakan yang beragi, kewajiban tujuh hari, roti tidak beragi, keluarnya dari Mesir dengan tergesa-gesa, dan ingatan seumur hidup. Namun, לְמַעַן תִּזְכֹּר menyatakan tujuan; “Dengan demikian, engkau akan mengingat” terutama menyatakan hasil dan melemahkan hubungan tujuan tersebut. “Supaya engkau mengingat” lebih langsung dan tetap alami.
  naturalness: Bahasa draf umumnya baku dan jelas. “Makanlah” lebih alami dan lebih dekat pada daya perintah imperfect Ibrani daripada “engkau harus makan.” “Negeri Mesir” lebih idiomatis dalam bahasa Indonesia Alkitabiah-modern daripada “tanah Mesir.”
  terminology: “Roti beragi,” “roti tidak beragi,” dan “roti penderitaan” merupakan padanan yang jelas dan setia. Penjelasan “kurban itu” dapat dipertahankan karena acuan עָלָיו adalah kurban Paskah dari konteks langsung, bukan tambahan makna. Catatan kaki mempertahankan alternatif leksikal yang sah bagi לֶחֶם עֹנִי.
  issues:
