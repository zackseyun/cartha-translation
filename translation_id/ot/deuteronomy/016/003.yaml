    issue: Hubungan tujuan לְמַעַן תִּזְכֹּר diterjemahkan sebagai hasil.
    rationale: '“Dengan demikian, engkau akan mengingat” menyatakan konsekuensi/prediksi, sedangkan konstruksi Ibrani menandai tujuan: makan roti itu dilakukan supaya orang Israel mengingat hari keluarnya dari Mesir.'
  - severity: low
    issue: Bentuk “engkau harus makan” kurang langsung sebagai terjemahan perintah.
    rationale: Imperfect dalam rangkaian hukum ini berfungsi imperatif. “Makanlah” mempertahankan daya perintah dengan bahasa Indonesia yang lebih lancar.
  revised_text: Janganlah engkau makan roti beragi bersama kurban itu. Selama tujuh hari, makanlah roti tidak beragi bersamanya, yaitu roti penderitaan[a], karena engkau keluar dari negeri Mesir dengan tergesa-gesa, supaya engkau mengingat hari ketika engkau keluar dari negeri Mesir sepanjang hidupmu.
