base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/013.yaml
  text: You shall keep the Feast of Booths for seven days[a], when you gather in from your threshing floor and from your winepress.
translation:
  language: id
  text: Rayakanlah Hari Raya Pondok[a] selama tujuh hari, ketika kamu mengumpulkan hasil panen dari tempat pengirikanmu dan dari tempat pemerasan anggurmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "Hari Raya Pondok Daun." Secara harfiah, "Hari Raya Pondok-pondok"; yang dimaksud ialah pondok atau tempat berteduh sementara.
    reason: lexical_alternative
lexical_decisions:
- source_word: חַג הַסֻּכֹּת
  choice: Hari Raya Pondok Daun
  rationale: חַג menunjuk pada perayaan keagamaan, sedangkan סֻכּוֹת berarti pondok-pondok atau tempat berteduh sementara. Istilah Indonesia yang lazim dan mudah dipahami adalah “Hari Raya Pondok Daun”; catatan kaki mempertahankan arti harfiahnya.
- source_word: תַּעֲשֶׂה לְךָ
  choice: Rayakanlah
  rationale: Dalam konteks hari raya, עשה berarti menyelenggarakan atau merayakan, bukan sekadar “membuat”. Bentuk perintah mempertahankan daya wajib dari ketentuan ini.
- source_word: שִׁבְעַת יָמִים
  choice: selama tujuh hari
  rationale: Ungkapan ini menyatakan jangka waktu dan diterjemahkan secara wajar dalam bahasa Indonesia.
- source_word: בְּאָסְפְּךָ
  choice: ketika kamu mengumpulkan hasil
  rationale: Preposisi ב dengan infinitif dapat menyatakan waktu. Kata “hasil” melengkapi ungkapan Indonesia secara alami tanpa membatasi hasil itu pada satu jenis panen.
- source_word: מִגָּרְנְךָ
  choice: dari tempat pengirikanmu
  rationale: גֹּרֶן adalah tempat pengirikan dan secara metonimis menunjuk pada hasil biji-bijian yang dikumpulkan dari sana. Gambaran konkretnya dipertahankan.
- source_word: וּמִיִּקְבֶךָ
  choice: dan tempat pemerasan anggurmu
  rationale: יֶקֶב menunjuk pada tempat pemerasan atau penampungan hasil perasan anggur. “Tempat pemerasan anggur” jelas bagi pembaca Indonesia modern.
