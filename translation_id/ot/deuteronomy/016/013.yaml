  register: Bahasa Indonesia baku, modern, dan bernada hukum yang tetap wajar. Kata ganti orang kedua tunggal dipertahankan dengan “kamu”, sesuai bentuk Ibrani dan sapaan perjanjian kepada umat sebagai satu kesatuan.
