  text: וְ/זָבַ֥חְתָּ פֶּ֛סַח לַ/יהוָ֥ה אֱלֹהֶ֖י/ךָ צֹ֣אן וּ/בָקָ֑ר בַּ/מָּקוֹם֙ אֲשֶׁר יִבְחַ֣ר יְהוָ֔ה לְ/שַׁכֵּ֥ן שְׁמ֖/וֹ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/002.yaml
  text: And you shall sacrifice the Passover to Yahweh your God[a], from the flock and the herd, at the place that Yahweh will choose to make his name dwell there.
translation:
  language: id
  text: Engkau harus mempersembahkan korban Paskah[a] kepada Yahweh, Allahmu, dari kawanan kambing dan domba serta kawanan sapi, di tempat yang akan dipilih Yahweh untuk membuat nama-Nya berdiam di sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Di sini “Paskah” disandingkan dengan “dari kawanan kambing dan domba serta kawanan sapi.” Sebagian orang memahami ungkapan ini sebagai mencakup bukan hanya hewan korban Paskah itu sendiri, tetapi juga korban-korban perayaan yang berkaitan dengan Paskah dan Hari Raya Roti Tidak Beragi.
    reason: alternative_reading
lexical_decisions:
- source_word: וְזָבַחְתָּ
  choice: Engkau harus mempersembahkan kurban
  rationale: Kata זבח menunjuk pada penyembelihan sebagai kurban. Ungkapan ini menyampaikan tindakan ibadah sekaligus daya perintah dalam konteks hukum.
- source_word: פֶּסַח
  choice: Paskah
  rationale: Istilah ini dapat menunjuk pada perayaan, ritus, atau kurban Paskah. Karena menjadi objek tindakan mempersembahkan kurban, bentuk ringkas ini mempertahankan keluasan makna Ibraninya.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: kepada Yahweh, Allahmu
  rationale: Preposisi ל menyatakan arah atau peruntukan kurban. Nama perjanjian יהוה ditransliterasikan sebagai Yahweh.
- source_word: צֹאן וּבָקָר
  choice: dari kawanan kambing domba dan kawanan sapi
  rationale: Kedua nomina kolektif menunjuk pada ternak kecil dan ternak besar. Kata 'dari' menyatakan hubungan sumber yang tersirat tanpa membatasi pada satu spesies ternak kecil.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה
  choice: di tempat yang akan dipilih Yahweh
  rationale: Bentuk imperfek dalam cakrawala pidato Musa secara alami menyatakan pemilihan yang akan dilakukan Yahweh.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: untuk membuat nama-Nya berdiam di sana
  rationale: Bentuk kausatif שכן dipertahankan, demikian pula ungkapan teologis 'nama-Nya', tanpa mereduksinya sekadar menjadi penempatan nama.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian itu.
- issue: Cakupan 'Paskah' sehubungan dengan kawanan kambing domba dan kawanan sapi
  choice: Mempertahankan susunan luas teks Ibrani dan menjelaskan persoalannya dalam catatan kaki
  alternative: Menafsirkan langsung sebagai 'kurban Paskah dan kurban-kurban perayaan'
  rationale: Penyebutan kedua golongan ternak lebih luas daripada hewan Paskah yang biasa disebutkan. Teks utama tidak menyelesaikan ketegangan itu secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Engkau harus' menyampaikan daya perintah dengan jelas; istilah peternakan dibuat mudah dipahami sambil mempertahankan sifat kolektif teks sumber.
