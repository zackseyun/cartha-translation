base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/020.yaml
  text: Justice[a], justice you shall pursue[b], so that you may live and possess the land that Yahweh your God is giving you.
translation:
  language: id
  text: Keadilan, keadilanlah[a] yang harus kaukejar, supaya engkau hidup dan memiliki[b] negeri yang Yahweh, Allahmu, sedang berikan kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Kebenaran, kebenaranlah yang harus kaukejar.” Kata Ibrani צֶדֶק dapat berarti keadilan maupun kebenaran; dalam konteks hukum ini, “keadilan” paling sesuai.
    reason: lexical_alternative
  - marker: b
    text: Atau, “mewarisi negeri.” Kata kerja Ibrani ini dapat berarti mewarisi maupun memiliki.
    reason: lexical_alternative
lexical_decisions:
- source_word: צֶדֶק צֶדֶק
  choice: Keadilan, keadilanlah
  rationale: Dalam konteks pengadilan, hakim, dan larangan menerima suap, צֶדֶק terutama menunjuk pada keadilan. Pengulangan Ibrani dipertahankan untuk menyampaikan penekanan.
- source_word: תִּרְדֹּף
  choice: yang harus kaukejar
  rationale: Kata רדף secara harfiah berarti mengejar. Susunan ini mempertahankan daya perintahnya dan terdengar alami dalam bahasa Indonesia.
- source_word: לְמַעַן
  choice: supaya
  rationale: Menandai tujuan atau hasil dan menghubungkan perintah dengan akibat perjanjian secara jelas.
- source_word: תִּחְיֶה
  choice: engkau hidup
  rationale: Menerjemahkan חיה secara langsung tanpa mempersempit maknanya menjadi sekadar kemakmuran.
- source_word: וְיָרַשְׁתָּ
  choice: dan memiliki
  rationale: ירשׁ dapat berarti memiliki, mengambil alih, atau mewarisi. 'Memiliki' sesuai dengan konteks negeri pemberian Allah dan tidak menambahkan cara pemerolehannya.
- source_word: הָאָרֶץ
  choice: negeri
  rationale: '''Negeri'' secara alami menunjuk pada wilayah perjanjian yang akan didiami Israel, bukan sekadar tanah sebagai materi.'
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri Yahweh, bukan diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Mempertahankan sapaan perjanjian dalam bentuk orang kedua tunggal.
- source_word: נֹתֵן לָךְ
  choice: berikan kepadamu
  rationale: Bentuk partisip Ibrani menyatakan pemberian yang sedang berlangsung atau dipandang sebagai tindakan khas/pasti; bentuk kini bahasa Indonesia ini alami dan tidak menambahkan keterangan waktu.
theological_decisions:
- issue: Makna צֶדֶק dalam konteks hukum
  choice: keadilan
  alternative: kebenaran
  rationale: Konteks langsung membahas hakim, sikap tidak memihak, dan suap, sehingga makna hukum-publik 'keadilan' paling menonjol. Alternatif dicatat karena צֶדֶק juga mencakup kebenaran atau kelurusan moral.
- issue: Penerjemahan nama יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה; 'Yahweh' mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Nuansa וְיָרַשְׁתָּ dalam janji tentang negeri
  choice: memiliki negeri
  alternative: mewarisi negeri
  rationale: Kata kerja ירשׁ memungkinkan gagasan memiliki maupun mewarisi. Teks utama memakai ungkapan Indonesia yang luas, sementara nuansa warisan dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Bentuk tunggal 'engkau/Allahmu/kepadamu' mempertahankan sapaan Ibrani kepada Israel sebagai satu kesatuan. Pengulangan retoris sumber dipertahankan, dan partikel '-lah' menegaskan tuntutan tanpa menjadikannya kaku.
