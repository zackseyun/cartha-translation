source:
  edition: WLC
  text: כִּ֠י אִֽם אֶל הַ/מָּק֞וֹם אֲשֶׁר יִבְחַ֨ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לְ/שַׁכֵּ֣ן שְׁמ֔/וֹ שָׁ֛ם תִּזְבַּ֥ח אֶת הַ/פֶּ֖סַח בָּ/עָ֑רֶב כְּ/ב֣וֹא הַ/שֶּׁ֔מֶשׁ מוֹעֵ֖ד צֵֽאתְ/ךָ֥ מִ/מִּצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/006.yaml
  text: but only at the place that Yahweh your God will choose for his name to dwell—there you shall sacrifice the Passover in the evening[a], at sunset[c][b], at the appointed time of your departure from Egypt.
translation:
  language: id
  text: melainkan hanya di tempat yang akan dipilih Yahweh, Allahmu, untuk membuat nama-Nya berdiam di sana.[a] Di sanalah engkau harus mempersembahkan kurban Paskah pada petang hari, saat matahari terbenam, pada waktu yang telah ditetapkan bagi keluarmu dari Mesir.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk menempatkan nama-Nya di sana.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “pada waktu yang ditetapkan bagi keluarmu dari Mesir.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אִם
  choice: melainkan hanya
  rationale: Ungkapan ini membatasi tempat persembahan secara tegas dan mengontraskannya dengan larangan dalam ayat sebelumnya.
- source_word: הַמָּקוֹם
  choice: tempat
  rationale: Padanan Indonesia yang biasa dan tepat; dalam konteks Ulangan menunjuk pada tempat ibadah yang dipilih Allah.
- source_word: יִבְחַר
  choice: akan dipilih
  rationale: Bentuk imperfek memiliki arti prospektif dalam ketentuan hukum ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama pribadi, bukan menggantinya dengan gelar.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: untuk membuat nama-Nya berdiam di sana
  rationale: Mencerminkan bentuk kausatif dan mempertahankan ungkapan teologis khas Ulangan tanpa menjelaskannya secara berlebihan.
- source_word: תִּזְבַּח
  choice: mempersembahkan kurban
  rationale: Konteks ritual menuntut makna pengurbanan, bukan sekadar penyembelihan; alternatif harfiahnya dicatat dalam catatan kaki.
- source_word: הַפֶּסַח
  choice: kurban Paskah
  rationale: Sebagai objek verba זבח, istilah ini di sini menunjuk pada persembahan Paskah; penyebutan 'kurban' memperjelas rujukannya secara alami.
- source_word: בָּעָרֶב
  choice: pada petang hari
  rationale: Padanan temporal yang alami dan bermartabat dalam bahasa Indonesia modern.
- source_word: כְּבֹא הַשֶּׁמֶשׁ
  choice: saat matahari terbenam
  rationale: Ungkapan Ibrani secara idiomatis menunjuk pada terbenamnya matahari.
- source_word: מוֹעֵד
  choice: pada waktu yang ditetapkan
  rationale: Mempertahankan gagasan tentang waktu tertentu yang telah ditentukan.
- source_word: צֵאתְךָ מִמִּצְרָיִם
  choice: ketika engkau keluar dari Mesir
  rationale: Mengungkapkan hubungan waktu secara alami sambil tetap dekat dengan makna harfiah keluarnya Israel dari Mesir.
theological_decisions:
- issue: Ungkapan nama ilahi yang berdiam di tempat pilihan
  choice: untuk membuat nama-Nya berdiam di sana
  alternative: untuk menempatkan nama-Nya di sana
  rationale: Pilihan ini mempertahankan bentuk kausatif dan ketegangan antara transendensi Allah dan kehadiran perjanjian-Nya, tanpa menyamakan 'nama' secara eksplisit dengan hakikat atau lokasi fisik Allah.
- issue: Makna הַפֶּסַח sebagai objek tindakan ritual
  choice: kurban Paskah
  alternative: Paskah
  rationale: Konteks pengurbanan menunjukkan bahwa yang dimaksud ialah persembahan Paskah, tetapi terjemahan tidak mempersempitnya menjadi 'anak domba Paskah' karena jenis hewan tidak dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam Alkitab yang bermartabat. Pronomina tunggal 'engkau' dipertahankan karena teks Ibrani menyapa Israel secara tunggal. Struktur kalimat dibuat alami tanpa menghilangkan pembatasan tempat, urutan waktu, atau ungkapan khas tentang nama Yahweh.
