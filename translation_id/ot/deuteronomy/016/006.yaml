  terminology: '"Yahweh," "Allahmu," dan "kurban Paskah" konsisten serta sesuai konteks. "Kurban Paskah" menyampaikan daya sakrificial dari זבח tanpa menambahkan jenis hewan. Catatan kaki a dan b memiliki jangkar yang tepat dan relevan.'
