  source_fidelity: 'Terjemahan secara umum setia pada Ibrani: pembatasan tempat, pemilihan oleh Yahweh, idiom nama-Nya yang dibuat berdiam, tindakan pengurbanan Paskah, dan penanda waktu semuanya dipertahankan. Namun, frasa terakhir "ketika engkau keluar dari Mesir" mengubah konstruksi nominal Ibrani צֵאתְךָ מִמִּצְרַיִם (''keluarmu dari Mesir'') menjadi anak kalimat temporal. Pembacaan yang lebih dekat dan tetap alami ialah "bagi keluarmu dari Mesir."'
