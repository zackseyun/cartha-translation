source:
  edition: WLC
  text: שָׁמוֹר֙ אֶת חֹ֣דֶשׁ הָ/אָבִ֔יב וְ/עָשִׂ֣יתָ פֶּ֔סַח לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ כִּ֞י בְּ/חֹ֣דֶשׁ הָֽ/אָבִ֗יב הוֹצִ֨יאֲ/ךָ֜ יְהוָ֧ה אֱלֹהֶ֛י/ךָ מִ/מִּצְרַ֖יִם לָֽיְלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/001.yaml
  text: Observe the month of Abib[a], and keep the Passover to Yahweh your God, because in the month of Abib Yahweh your God brought you out from Egypt by night.
translation:
  language: id
  text: Perhatikanlah bulan Abib[a] dan rayakanlah Paskah bagi Yahweh, Allahmu, sebab pada bulan Abib Yahweh, Allahmu, membawa engkau keluar dari Mesir pada malam hari.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Abib adalah nama bulan yang berkaitan dengan bulir atau bijian yang mulai masak; dapat juga diterjemahkan “bulan musim semi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמוֹר
  choice: Perhatikanlah
  rationale: Bentuk perintah ini menuntut ketaatan yang cermat terhadap ketentuan kalender. 'Perhatikanlah' alami dalam konteks hukum dan lebih kuat daripada sekadar 'ingatlah'.
- source_word: חֹדֶשׁ הָאָבִיב
  choice: bulan Abib
  rationale: Dalam konteks perayaan ini, ungkapan tersebut berfungsi sebagai penanda bulan dalam kalender Israel. Nama 'Abib' dipertahankan, sementara kaitannya dengan bulir gandum yang mulai masak dijelaskan dalam catatan kaki.
- source_word: וְעָשִׂיתָ פֶּסַח
  choice: dan rayakanlah Paskah
  rationale: Secara harfiah berarti 'melakukan/mengadakan Paskah'. 'Rayakanlah Paskah' merupakan ungkapan Indonesia yang wajar untuk pelaksanaan perayaan itu dan tetap mempertahankan daya perintahnya.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menandai bahwa perayaan tersebut ditujukan atau dipersembahkan kepada Yahweh. 'Bagi' menyampaikan orientasi itu secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama perjanjian dalam teks Ibrani tetap terlihat.
- source_word: הוֹצִיאֲךָ
  choice: membawa engkau keluar
  rationale: Ini adalah padanan alami bagi bentuk kausatif יצא dan mempertahankan rumusan keluaran dari Mesir.
- source_word: מִמִּצְרַיִם
  choice: dari Mesir
  rationale: Dengan verba 'membawa ... keluar', frasa 'dari Mesir' jelas dan idiomatis tanpa pengulangan yang janggal.
- source_word: לָיְלָה
  choice: pada malam hari
  rationale: Kata ini menyatakan waktu keluarnya Israel. 'Pada malam hari' merupakan padanan Indonesia yang alami dan tidak menambahkan rincian waktu yang tidak ada dalam teks.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi secara langsung. Bentuk 'Yahweh' mempertahankan nama pribadi itu dan tidak menggantinya dengan sebuah gelar.
- issue: Apakah אָבִיב diterjemahkan sebagai musim atau nama bulan
  choice: Abib sebagai penanda kalender
  alternative: musim semi atau bulan bulir gandum yang mulai masak
  rationale: Dalam konteks hukum perayaan, frasa ini menunjuk bulan tertentu yang terkait dengan Paskah dan keluaran. Menerjemahkannya hanya sebagai musim akan mengaburkan kekhususan kalender tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-keagamaan yang bermartabat. Kata ganti tunggal 'engkau' mempertahankan sapaan orang kedua tunggal dalam teks Ibrani, sedangkan 'rayakanlah' dipilih sebagai ungkapan alami untuk menjalankan perayaan Paskah.
