  yaml_path: translation/ot/deuteronomy/016/017.yaml
  text: Each man shall give according to the gift of his hand[a], according to the blessing of Yahweh your God that he has given you.
translation:
  language: id
  text: Setiap laki-laki harus memberi sesuai dengan pemberian tangannya[a], sesuai dengan berkat yang telah Yahweh, Allahmu, berikan kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “pemberian tangannya,” yaitu apa yang tersedia atau sanggup ia berikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: Setiap laki-laki
  rationale: Nomina tunggal ini dipakai secara distributif. Terjemahan ini mempertahankan rujukan maskulin teks sumber dan menyatakan bahwa kewajiban tersebut berlaku bagi masing-masing laki-laki.
- source_word: כְּמַתְּנַת יָדוֹ
  choice: sesuai dengan pemberian tangannya
  rationale: Prefiks כְּ menyatakan ukuran atau proporsi, sedangkan frasa harfiah 'pemberian tangannya' menunjuk pada apa yang tersedia atau mampu diberikan seseorang. Citra tangan dipertahankan dan dijelaskan dalam catatan kaki.
- source_word: כְּבִרְכַּת
  choice: sesuai dengan berkat
  rationale: Prefiks כְּ kembali menyatakan kesesuaian atau proporsi. 'Berkat' merujuk pada karunia atau penyediaan yang berasal dari Allah, tanpa membatasinya secara eksplisit hanya pada materi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan dengan transliterasi 'Yahweh', bukan diganti dengan gelar, agar nama pribadi dalam teks Ibrani tetap tampak.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk dengan sufiks orang kedua tunggal diterjemahkan secara langsung dan alami sebagai 'Allahmu'.
- source_word: אֲשֶׁר נָתַן לָךְ
  choice: yang telah diberikan ... kepadamu
  rationale: Klausa relatif dipahami menerangkan 'berkat'. Bentuk 'telah diberikan' menyampaikan tindakan lampau yang hasilnya tetap relevan pada saat pemberian persembahan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. 'Yahweh' mempertahankan fungsi nama tersebut tanpa menggantinya dengan gelar.
- issue: Cakupan 'berkat'
  choice: Mempertahankan istilah umum 'berkat'
  alternative: Menafsirkannya secara eksplisit sebagai kekayaan atau hasil materi
  rationale: Konteks berkaitan dengan kemampuan memberi, tetapi kata Ibraninya tetap lebih luas. Terjemahan tidak mempersempit maknanya secara tidak perlu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan klausa dibuat alami tanpa menghilangkan pengulangan proporsional 'sesuai dengan ... sesuai dengan ...' dalam bahasa Ibrani. Citra idiomatis 'tangan' dipertahankan dengan bantuan catatan kaki.
