  text: וְ/שָׂמַחְתָּ֞ לִ/פְנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ אַתָּ֨ה וּ/בִנְ/ךָ֣ וּ/בִתֶּ/ךָ֮ וְ/עַבְדְּ/ךָ֣ וַ/אֲמָתֶ/ךָ֒ וְ/הַ/לֵּוִי֙ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֔י/ךָ וְ/הַ/גֵּ֛ר וְ/הַ/יָּת֥וֹם וְ/הָ/אַלְמָנָ֖ה אֲשֶׁ֣ר בְּ/קִרְבֶּ֑/ךָ בַּ/מָּק֗וֹם אֲשֶׁ֤ר יִבְחַר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לְ/שַׁכֵּ֥ן שְׁמ֖/וֹ שָֽׁם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/011.yaml
  text: And you shall rejoice before Yahweh your God—you[a], your son, your daughter, your male servant, your female servant, the Levite who is within your gates, and the sojourner, the fatherless[c][b], and the widow who are among you—at the place that Yahweh your God will choose for his name to dwell there.
translation:
  language: id
  text: Bersukacitalah di hadapan Yahweh, Allahmu—engkau, anakmu laki-laki, anakmu perempuan, budakmu laki-laki, budakmu perempuan, orang Lewi yang ada di kota-kotamu, orang asing yang menetap[a], anak yatim[b], dan janda yang ada di tengah-tengahmu—di tempat yang akan dipilih Yahweh, Allahmu, untuk menempatkan nama-Nya di sana.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “pendatang.” Yang dimaksud ialah orang bukan Israel yang menetap di tengah masyarakat Israel dan hidup di bawah tatanan sosialnya.'
    reason: lexical_alternative
  - marker: b
    text: Istilah Ibraninya secara khusus dapat berarti anak yang tidak berayah; dalam pemakaian umum juga diterjemahkan “yatim piatu.”
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “untuk menyebabkan nama-Nya berdiam di sana.”'
    reason: source_form
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: Bersukacitalah
  rationale: Bentuk ini menyampaikan perintah untuk bergembira dalam suasana perayaan ibadah, sesuai fungsi bentuk verba Ibrani dalam konteks hukum perayaan.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Ungkapan ini secara alami menyatakan keberadaan dalam hadirat Allah tanpa memperluas maknanya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: וְעַבְדְּךָ וַאֲמָתֶךָ
  choice: budakmu laki-laki dan perempuan
  rationale: Pilihan ini mempertahankan status sosial terikat serta pembedaan gender dalam pasangan istilah Ibrani, tanpa melunakkannya menjadi pekerja atau pelayan biasa.
- source_word: בִּשְׁעָרֶיךָ
  choice: di kota-kotamu
  rationale: Secara harfiah berarti 'di gerbang-gerbangmu', tetapi dalam pemakaian hukum Ulangan ungkapan itu menunjuk pada permukiman atau kota setempat; padanan ini lebih alami dalam bahasa Indonesia.
- source_word: וְהַגֵּר
  choice: orang asing yang menetap
  rationale: גֵּר menunjuk pada orang bukan pribumi yang tinggal di tengah masyarakat Israel dan berada dalam tatanan sosialnya, bukan sekadar pengunjung.
- source_word: וְהַיָּתוֹם
  choice: anak yatim
  rationale: Istilah Indonesia yang lazim untuk anak yang kehilangan ayah atau orang tua dan berada dalam keadaan rentan.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: untuk membuat nama-Nya berdiam di sana
  rationale: Terjemahan ini mempertahankan nuansa kausatif verba Ibrani dan rumusan teologis khas Ulangan tentang nama Allah yang berdiam di tempat pilihan-Nya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian secara langsung; transliterasi mempertahankannya sebagai nama diri.
- issue: Status עבד dan אמה
  choice: budak laki-laki dan perempuan
  alternative: hamba laki-laki dan perempuan
  rationale: Dalam daftar anggota rumah tangga ini, status keterikatan sosial relevan. 'Budak' menyatakannya lebih jelas daripada 'hamba', yang dalam bahasa Indonesia juga dapat berarti pelayan secara umum.
- issue: Rumusan tempat kudus לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: untuk membuat nama-Nya berdiam di sana
  alternative: agar nama-Nya berdiam di sana
  rationale: Pilihan utama mempertahankan bentuk kausatif sekaligus menjaga ketegangan teologis antara kehadiran Allah dan berdiamnya nama-Nya, tanpa menyamakan tempat itu dengan pembatasan keberadaan Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur daftar dipertahankan, sedangkan idiom 'di gerbang-gerbangmu' diterjemahkan secara semantis menjadi 'di kota-kotamu' agar mudah dipahami. Semua penanda catatan kaki ditempatkan pada unsur yang diterangkannya.
