  terminology: “Yahweh,” “Allahmu,” “orang Lewi,” “orang asing yang menetap,” “anak yatim,” dan “janda” sesuai. “Budak” tepat mempertahankan status sosial עבד/אמה. “Kota-kotamu” adalah pengalihan idiomatis yang dapat dipertahankan untuk בִּשְׁעָרֶיךָ.
