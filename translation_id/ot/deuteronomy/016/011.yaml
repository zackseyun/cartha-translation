  source_fidelity: 'Terjemahan pada dasarnya setia pada teks Ibrani: perintah bersukacita, daftar anggota rumah tangga dan kelompok rentan, serta tempat yang dipilih Yahweh semuanya terwakili. Namun, dua pasangan nomina tunggal dalam daftar Ibrani lebih baik dinyatakan secara terpisah dalam bahasa Indonesia agar pembedaan anak laki-laki/anak perempuan dan budak laki-laki/budak perempuan tetap jelas.'
