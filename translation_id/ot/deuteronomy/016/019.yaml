id: DEU.16.19
reference: Deuteronomy 16:19
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לֹא תַטֶּ֣ה מִשְׁפָּ֔ט לֹ֥א תַכִּ֖יר פָּנִ֑ים וְ/לֹא תִקַּ֣ח שֹׁ֔חַד כִּ֣י הַ/שֹּׁ֗חַד יְעַוֵּר֙ עֵינֵ֣י חֲכָמִ֔ים וִֽ/יסַלֵּ֖ף דִּבְרֵ֥י צַדִּיקִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/019.yaml
  text: You shall not pervert justice[a]; you shall not show partiality; and you shall not take a bribe[b], for the bribe blinds the eyes of the wise and twists the words of the righteous.
translation:
  language: id
  text: Janganlah kamu memutarbalikkan keadilan; janganlah kamu memihak[a]; dan janganlah kamu menerima suap, sebab suap membutakan mata orang bijaksana dan memutarbalikkan perkataan orang-orang benar.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mengenali wajah,” sebuah ungkapan Ibrani yang berarti bersikap berat sebelah atau pilih kasih.
    reason: lexical_alternative
  - marker: b
    text: Atau “memutarbalikkan perkara orang-orang benar.” Dalam konteks hukum, kata Ibrani yang diterjemahkan “perkataan” juga dapat merujuk pada perkara atau pembelaan mereka.
    reason: alternative_reading
lexical_decisions:
- source_word: תַטֶּה מִשְׁפָּט
  choice: memutarbalikkan keadilan
  rationale: Bentuk Hifil dari נטה bersama מִשְׁפָּט menyatakan tindakan membelokkan keputusan yang adil. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan daya hukum serta moral teks.
- source_word: תַכִּיר פָּנִים
  choice: memihak
  rationale: Secara harfiah berarti 'mengenali wajah', tetapi dalam konteks peradilan merupakan idiom untuk memperlakukan seseorang secara istimewa atau berat sebelah. 'Memihak' menyampaikan maksudnya dengan ringkas dan jelas.
- source_word: שֹׁחַד
  choice: suap
  rationale: Dalam konteks hukum, kata ini menunjuk pada pemberian yang dimaksudkan untuk memengaruhi keputusan. 'Suap' lebih tepat daripada istilah netral seperti 'pemberian'.
- source_word: יְעַוֵּר עֵינֵי חֲכָמִים
  choice: membutakan mata orang bijaksana
  rationale: Terjemahan ini mempertahankan metafora Ibrani yang jelas dan hidup, sekaligus memakai bentuk generik yang tidak membatasi rujukan pada laki-laki.
- source_word: וִיסַלֵּף דִּבְרֵי צַדִּיקִם
  choice: memutarbalikkan perkataan orang-orang benar
  rationale: סלף berarti memutarbalikkan atau menyimpangkan, sedangkan דִּבְרֵי secara langsung berarti 'perkataan/perkara'. Terjemahan utama mengikuti arti paling dekat sambil mencatat kemungkinan hukum dalam catatan kaki.
- source_word: צַדִּיקִם
  choice: orang-orang benar
  rationale: Istilah ini dapat menunjuk pada mereka yang benar secara moral maupun yang berada di pihak yang benar secara hukum. 'Orang-orang benar' mempertahankan keluasan tersebut tanpa mempersempitnya menjadi 'orang tidak bersalah'.
theological_decisions:
- issue: Cakupan דִּבְרֵי צַדִּיקִם dalam konteks hukum
  choice: perkataan orang-orang benar
  alternative: perkara orang-orang benar
  rationale: Makna harfiah 'perkataan' dipertahankan dalam teks utama, sementara kemungkinan bahwa istilah itu menunjuk pada perkara atau pembelaan hukum mereka dicatat agar ambiguitas sumber tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'janganlah kamu' mempertahankan sapaan orang kedua tunggal secara wajar dalam nasihat hukum, sedangkan susunan paralel dan metafora sumber dipertahankan.
