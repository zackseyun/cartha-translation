  source_fidelity: 'Teks Indonesia secara akurat mencerminkan tiga larangan Ibrani: menyelewengkan keadilan (נטה משפט), menunjukkan keberpihakan (הכיר פנים), dan menerima suap (שחד). Klausa sebab-akibat serta metafora bahwa suap membutakan mata orang bijaksana dan memutarbalikkan perkataan orang-orang benar juga dipertahankan. Ambiguitas דִּבְרֵי, antara “perkataan” dan perkara hukum, ditangani dengan tepat melalui catatan kaki.'
