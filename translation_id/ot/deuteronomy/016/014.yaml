  text: וְ/שָׂמַחְתָּ֖ בְּ/חַגֶּ֑/ךָ אַתָּ֨ה וּ/בִנְ/ךָ֤ וּ/בִתֶּ֨/ךָ֙ וְ/עַבְדְּ/ךָ֣ וַ/אֲמָתֶ֔/ךָ וְ/הַ/לֵּוִ֗י וְ/הַ/גֵּ֛ר וְ/הַ/יָּת֥וֹם וְ/הָ/אַלְמָנָ֖ה אֲשֶׁ֥ר בִּ/שְׁעָרֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/014.yaml
  text: And you shall rejoice in your festival—you and your son and your daughter[a], and your male servant and your female servant, and the Levite, and the sojourner, and the fatherless, and the widow[d][c][b], who are within your gates.
translation:
  language: id
  text: Bersukacitalah pada hari rayamu[a]—engkau, anak laki-lakimu dan anak perempuanmu, budak laki-lakimu dan budak perempuanmu, serta orang Lewi, pendatang[b], anak yatim[c], dan janda yang ada di kota-kotamu.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dalam perayaanmu.” Kata Ibrani חַג dapat menunjuk pada hari raya maupun perayaan hari raya itu.
    reason: lexical_alternative
  - marker: b
    text: “Pendatang” ialah orang bukan Israel yang menetap di tengah masyarakat Israel; dapat juga diterjemahkan “orang asing yang menetap.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “anak yang tidak berayah.” Istilah Ibrani ini menyoroti keadaan rentan akibat tidak adanya perlindungan seorang ayah.
    reason: lexical_alternative
  - marker: d
    text: Secara harfiah, “di dalam gerbang-gerbangmu,” sebuah ungkapan Ibrani bagi orang-orang yang tinggal di kota-kota atau lingkungan masyarakatmu.
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: Bersukacitalah
  rationale: Bentuk perfektum dengan waw dalam konteks hukum berfungsi sebagai perintah; bentuk imperatif Indonesia menyampaikan daya perintahnya secara alami.
- source_word: בְּחַגֶּךָ
  choice: pada hari rayamu
  rationale: חַג menunjuk pada perayaan keagamaan, khususnya hari raya ziarah. “Hari raya” merupakan ungkapan Indonesia yang alami dan tetap mempertahankan suasana perayaan ibadah.
- source_word: אַתָּה
  choice: engkau
  rationale: Kata ganti mandiri ini memberi penekanan dan dipertahankan sebagai unsur pertama dalam daftar peserta.
- source_word: וּבִנְךָ וּבִתֶּךָ
  choice: anak laki-lakimu dan anak perempuanmu
  rationale: Menerjemahkan kedua istilah kekerabatan secara langsung dan mempertahankan bentuk sapaan orang kedua tunggal.
- source_word: וְעַבְדְּךָ וַאֲמָתֶךָ
  choice: budak laki-lakimu dan budak perempuanmu
  rationale: Dalam daftar sosial rumah tangga ini, kedua istilah menunjuk pada orang yang berstatus terikat, bukan sekadar pekerja atau pelayan; “budak” tidak memperhalus realitas sosial teks.
- source_word: וְהַלֵּוִי
  choice: orang Lewi
  rationale: Ungkapan Indonesia yang lazim untuk anggota suku Lewi yang memiliki kaitan khusus dengan pelayanan ibadah.
- source_word: וְהַגֵּר
  choice: pendatang
  rationale: גֵּר adalah orang bukan pribumi yang menetap di tengah masyarakat Israel. “Pendatang” cukup alami dalam bahasa Indonesia, dengan nuansa hukumnya dijelaskan dalam catatan kaki.
- source_word: וְהַיָּתוֹם
  choice: anak yatim
  rationale: Padanan Indonesia yang lazim bagi יָתוֹם; catatan kaki mempertahankan penekanan Ibrani pada ketiadaan ayah dan kerentanan sosial.
- source_word: וְהָאַלְמָנָה
  choice: janda
  rationale: Padanan langsung dan lazim bagi kategori sosial rentan yang disebutkan.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: yang tinggal di kota-kotamu
  rationale: “Di dalam gerbang-gerbangmu” adalah idiom Ibrani bagi permukiman atau kota yang berada dalam lingkungan masyarakat yang disapa; maknanya disampaikan secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Status sosial עֶבֶד dan אָמָה
  choice: budak laki-laki / budak perempuan
  alternative: hamba laki-laki / hamba perempuan; pelayan laki-laki / pelayan perempuan
  rationale: Pilihan “budak” mempertahankan status keterikatan yang nyata dalam tatanan rumah tangga kuno dan tidak melunakkannya menjadi pelayanan biasa. Ayat ini memasukkan mereka ke dalam sukacita hari raya tanpa menghapus ketegangan sosial teks.
- issue: Identitas sosial גֵּר
  choice: pendatang
  alternative: orang asing; warga asing yang menetap
  rationale: “Pendatang” mengungkapkan bahwa orang tersebut bukan anggota asli Israel tetapi hidup menetap di tengah komunitas. Catatan kaki mencegah istilah ini dibaca sebagai pengunjung sementara atau sebagai kategori imigrasi modern.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Imperatif “Bersukacitalah” mempertahankan nada perintah perjanjian. Istilah sosial dibuat jelas bagi pembaca umum, sementara idiom tempat dialihkan secara alami dan bentuk harfiahnya dicatat.
