revisions:
- from: Haruslah kamu mengangkat hakim-hakim dan para petugas bagi dirimu di setiap gerbangmu[a] yang Yahweh, Allahmu, berikan kepadamu, menurut suku-sukumu. Mereka harus menghakimi rakyat dengan penghakiman yang adil.[b]
  to: Kamu harus mengangkat para hakim dan petugas di setiap gerbangmu[a] yang Yahweh, Allahmu, berikan kepadamu menurut suku-sukumu; mereka harus mengadili rakyat dengan keputusan yang adil.[b]
  rationale: Revisi membuang “bagi dirimu” yang berlebihan dalam bahasa sasaran, memakai bentuk jamak yang lebih wajar, dan mengganti “penghakiman” dengan “keputusan” untuk menyatakan מִשְׁפַּט secara alami dalam konteks hukum. Susunan “yang Yahweh ... berikan kepadamu menurut suku-sukumu” mempertahankan hubungan frasa yang tidak sepenuhnya bebas dari perdebatan sintaktis tanpa menambahkan penafsiran sektarian.
  reviewer_model: gpt-5.6-terra
