source:
  edition: WLC
  text: שֹׁפְטִ֣ים וְ/שֹֽׁטְרִ֗ים תִּֽתֶּן לְ/ךָ֙ בְּ/כָל שְׁעָרֶ֔י/ךָ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֶ֛י/ךָ נֹתֵ֥ן לְ/ךָ֖ לִ/שְׁבָטֶ֑י/ךָ וְ/שָׁפְט֥וּ אֶת הָ/עָ֖ם מִשְׁפַּט צֶֽדֶק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/018.yaml
  text: You shall appoint judges and officers for yourself in all your gates that Yahweh your God is giving you[a], according to your tribes[b], and they shall judge the people with righteous judgment.
translation:
  language: id
  text: Kamu harus mengangkat para hakim dan petugas di setiap gerbangmu[a] yang Yahweh, Allahmu, berikan kepadamu menurut suku-sukumu; mereka harus mengadili rakyat dengan keputusan yang adil.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “di setiap kotamu.” Secara harfiah, “di setiap gerbangmu”; kawasan gerbang kota berfungsi sebagai pusat kegiatan sipil dan peradilan.
    reason: cultural_note
  - marker: b
    text: Atau, “dengan keadilan yang benar.”
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפְטִים
  choice: hakim-hakim
  rationale: Kata benda ini menunjuk kepada orang-orang yang memberi keputusan hukum; bentuk ulang menyatakan jamak secara jelas dan wajar dalam bahasa Indonesia.
- source_word: שֹׁטְרִים
  choice: para petugas
  rationale: Istilah ini menunjuk kepada pejabat pelaksana atau administratif yang terkait dengan tata hukum. 'Para petugas' mempertahankan sifat kelembagaannya tanpa menetapkan tugas khusus yang tidak dijelaskan teks.
- source_word: תִּתֶּן
  choice: mengangkat
  rationale: Secara harfiah berarti 'memberikan/menempatkan', tetapi dalam konteks penetapan orang pada jabatan, 'mengangkat' menyampaikan daya idiomatisnya dengan alami.
- source_word: בְּכָל שְׁעָרֶיךָ
  choice: di setiap gerbangmu
  rationale: Terjemahan ini mempertahankan gambaran harfiah tentang gerbang, yang pada masa itu juga menjadi pusat kegiatan sipil dan peradilan; penjelasan budaya diberikan dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi empat huruf ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: לִשְׁבָטֶיךָ
  choice: menurut suku-sukumu
  rationale: Frasa ini paling wajar menyatakan pengaturan atau pembagian pengangkatan berdasarkan suku, sambil mempertahankan kemungkinan hubungan sintaksisnya dalam urutan Ibrani.
- source_word: וְשָׁפְטוּ אֶת־הָעָם
  choice: Mereka harus menghakimi rakyat
  rationale: Kata kerja ini digunakan dalam arti yudisial yang sesuai dengan konteks para hakim dan petugas.
- source_word: מִשְׁפַּט צֶדֶק
  choice: dengan penghakiman yang adil
  rationale: Ungkapan ini memadukan keputusan hukum dengan kelurusan moral. 'Penghakiman yang adil' mempertahankan kedua unsur tersebut dan juga pengulangan akar kata yang terasa dalam teks sumber.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai nama ilahi secara langsung. Bentuk 'Yahweh' mempertahankannya sebagai nama pribadi tanpa menggantinya dengan gelar.
- issue: Hubungan frasa לִשְׁבָטֶיךָ dalam kalimat
  choice: menempatkan 'menurut suku-sukumu' setelah klausa pemberian wilayah tanpa penjelasan tambahan
  alternative: mengaitkannya secara tegas hanya dengan pengangkatan para pejabat atau hanya dengan pemberian kota-kota
  rationale: Urutan teks Ibrani memungkinkan frasa itu dipahami sebagai pengaturan jabatan menurut suku-suku, tetapi struktur kalimat tidak perlu dipersempit secara dogmatis. Susunan Indonesia mempertahankan ketegangan sintaksis tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang khidmat tetapi mudah dipahami. Bentuk 'Haruslah kamu' mempertahankan kekuatan perintah kepada Israel sebagai pihak tunggal kolektif. Pengulangan 'hakim-hakim ... menghakimi ... penghakiman' sengaja dipertahankan karena mencerminkan jejaring leksikal teks Ibrani.
