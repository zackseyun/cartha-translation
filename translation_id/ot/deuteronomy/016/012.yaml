  yaml_path: translation/ot/deuteronomy/016/012.yaml
  text: Remember that you were a servant in Egypt[a], and keep and do these statutes.
translation:
  language: id
  text: Ingatlah bahwa engkau dahulu seorang budak di Mesir, dan peliharalah serta lakukanlah ketetapan-ketetapan ini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְזָכַרְתָּ
  choice: Ingatlah
  rationale: Bentuk perfektum Qal dengan waw dalam konteks pengajaran berfungsi sebagai perintah; bentuk ini alami dan tegas dalam bahasa Indonesia.
- source_word: כִּי
  choice: bahwa
  rationale: Kata ini memperkenalkan isi yang harus diingat, bukan terutama alasan.
- source_word: עֶבֶד
  choice: budak
  rationale: Dalam konteks penindasan Israel di Mesir, istilah ini menunjuk pada status perbudakan yang dipaksakan, bukan sekadar pelayanan biasa.
- source_word: הָיִיתָ
  choice: engkau dahulu seorang
  rationale: Menyatakan keadaan pada masa lampau; 'dahulu' memperjelas kontras waktu secara alami tanpa menambah gagasan baru.
- source_word: בְּמִצְרָיִם
  choice: di Mesir
  rationale: Padanan langsung dan wajar untuk frasa preposisional tersebut.
- source_word: וְשָׁמַרְתָּ
  choice: peliharalah
  rationale: Dalam konteks hukum perjanjian, שׁמר berarti menaati dengan cermat atau memelihara ketetapan.
- source_word: וְעָשִׂיתָ
  choice: lakukanlah
  rationale: Menekankan pelaksanaan nyata dan mempertahankan pasangan makna 'memelihara dan melakukan'.
- source_word: הַחֻקִּים
  choice: ketetapan-ketetapan
  rationale: חֻקִּים merujuk pada ketentuan yang ditetapkan; padanan ini baku dan sesuai bagi teks hukum.
- source_word: הָאֵלֶּה
  choice: ini
  rationale: Padanan langsung bagi kata penunjuk yang menerangkan ketetapan-ketetapan.
theological_decisions:
- issue: Makna עֶבֶד dalam konteks perbudakan Israel di Mesir
  choice: budak
  alternative: hamba
  rationale: Konteksnya adalah kerja paksa dan keterikatan yang menindas di Mesir. 'Budak' menyampaikan kenyataan sosial itu dengan lebih tepat, tanpa menghapus jangkauan leksikal umum עֶבֶד.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Kata ganti tunggal 'engkau' mempertahankan bentuk orang kedua tunggal Ibrani yang menyapa Israel secara korporat. Pasangan 'peliharalah serta lakukanlah' mempertahankan dua verba sumber tanpa terdengar terlalu kaku.
