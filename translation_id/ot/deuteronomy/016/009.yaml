  text: You shall count seven weeks for yourself; from the time the sickle begins to be put to the standing grain[a], you shall begin to count seven weeks.
translation:
  language: id
  text: Hitunglah tujuh minggu[a] bagimu. Sejak sabit mulai digunakan untuk menuai tanaman biji-bijian yang masih berdiri, mulailah menghitung tujuh minggu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tujuh kali tujuh”; dalam konteks ini ungkapan Ibrani ini berarti tujuh minggu.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁבְעָה שָׁבֻעֹת / שִׁבְעָה שָׁבֻעוֹת
  choice: tujuh minggu
  rationale: שָׁבוּעַ adalah istilah Ibrani biasa untuk satu masa tujuh hari, yaitu satu minggu. Dalam konteks penanggalan hari raya, “tujuh minggu” menyampaikan idiom Ibrani secara jelas sambil mempertahankan pengulangan dalam ayat.
- source_word: תִּסְפָּר לָךְ
  choice: Hitunglah ... untukmu sendiri
  rationale: Bentuk verba menyatakan perintah, sehingga “Hitunglah” alami dalam bahasa Indonesia. Frasa “untukmu sendiri” mempertahankan datif לָךְ, meskipun dalam bahasa Indonesia unsur ini dapat saja ditiadakan.
- source_word: מֵהָחֵל
  choice: Sejak ... mulai
  rationale: Preposisi מִן dengan bentuk infinitif menandai titik awal waktu; “sejak ... mulai” merupakan padanan Indonesia yang alami dan tepat.
- source_word: חֶרְמֵשׁ
  choice: sabit
  rationale: חֶרְמֵשׁ menunjuk pada alat pemanen berupa sabit.
- source_word: בַּקָּמָה
  choice: pada tanaman biji-bijian yang masih tegak
  rationale: קָמָה menunjuk pada tanaman atau bulir yang masih berdiri di ladang dan belum dituai. Rumusan ini mempertahankan gambaran panen tanpa membatasi istilahnya pada jenis serealia tertentu.
- source_word: תָּחֵל לִסְפֹּר
  choice: mulailah menghitung
  rationale: Gabungan verba kausatif “mulai” dengan infinitif “menghitung” menyatakan dimulainya tindakan menghitung dan diterjemahkan langsung secara alami.
