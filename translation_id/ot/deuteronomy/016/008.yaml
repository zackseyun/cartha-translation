  text: שֵׁ֥שֶׁת יָמִ֖ים תֹּאכַ֣ל מַצּ֑וֹת וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֗י עֲצֶ֨רֶת֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ לֹ֥א תַעֲשֶׂ֖ה מְלָאכָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/008.yaml
  text: For six days you shall eat unleavened bread[a], and on the seventh day there shall be a solemn assembly to Yahweh your God; you shall do no work.
translation:
  language: id
  text: Selama enam hari engkau harus makan roti tidak beragi, dan pada hari ketujuh harus ada pertemuan khidmat[a] bagi Yahweh, Allahmu. Janganlah engkau melakukan pekerjaan apa pun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pertemuan kudus” atau “pertemuan penutup.” Istilah Ibrani ini menunjuk pada pertemuan resmi dalam suatu perayaan, kemungkinan dengan nuansa sebagai pertemuan penutup.
    reason: lexical_alternative
lexical_decisions:
- source_word: שֵׁשֶׁת יָמִים
  choice: Selama enam hari
  rationale: Frasa konstruktus ini menyatakan jangka waktu; bentuk ini alami dalam bahasa Indonesia dan mempertahankan daya temporalnya.
- source_word: תֹּאכַל
  choice: engkau harus makan
  rationale: Bentuk imperfek berfungsi sebagai perintah dalam konteks hukum, sehingga 'harus' menyampaikan daya preskriptifnya.
- source_word: מַצּוֹת
  choice: roti tidak beragi
  rationale: Ini adalah arti lazim nomina jamak tersebut dalam konteks Paskah dan mudah dipahami pembaca modern.
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: dan pada hari ketujuh
  rationale: Waw diterjemahkan secara sederhana sebagai 'dan'; teks Ibrani tidak mengharuskan hubungan pertentangan.
- source_word: עֲצֶרֶת
  choice: pertemuan raya
  rationale: Istilah ini menunjuk pada pertemuan resmi dalam rangka perayaan keagamaan, mungkin sebagai pertemuan penutup. 'Pertemuan raya' menyampaikan sifat resmi dan meriahnya tanpa membatasi makna pada penutupan saja.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: bagi Yahweh, Allahmu
  rationale: Preposisi ל menyatakan peruntukan atau pengabdian, sedangkan nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh'.
- source_word: לֹא תַעֲשֶׂה מְלָאכָה
  choice: Janganlah engkau melakukan pekerjaan apa pun
  rationale: Larangan ini mencakup pekerjaan secara umum; 'apa pun' secara alami menyampaikan cakupan bentuk Ibrani tak tentu.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian dan mengikuti lapisan konsultasi yang telah diperbarui tanpa menggantinya dengan gelar.
- issue: Nuansa עֲצֶרֶת dalam perayaan
  choice: pertemuan raya
  alternative: pertemuan kudus; pertemuan penutup
  rationale: Kata itu dapat menunjuk pada pertemuan perayaan yang resmi dan mungkin bersifat penutup. Teks utama tidak memastikan bahwa nuansa penutup merupakan satu-satunya makna, sehingga ambiguitas dijaga melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang dignified dan mudah dipahami. Kata ganti tunggal 'engkau' mempertahankan sapaan orang kedua tunggal dalam teks Ibrani. Struktur dua klausa dijaga, tetapi larangan akhir dijadikan kalimat tersendiri agar alami dan tegas.
