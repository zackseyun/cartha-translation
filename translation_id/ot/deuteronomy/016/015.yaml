  text: שִׁבְעַ֣ת יָמִ֗ים תָּחֹג֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ בַּ/מָּק֖וֹם אֲשֶׁר יִבְחַ֣ר יְהוָ֑ה כִּ֣י יְבָרֶכְ/ךָ֞ יְהוָ֣ה אֱלֹהֶ֗י/ךָ בְּ/כֹ֤ל תְּבוּאָֽתְ/ךָ֙ וּ/בְ/כֹל֙ מַעֲשֵׂ֣ה יָדֶ֔י/ךָ וְ/הָיִ֖יתָ אַ֥ךְ שָׂמֵֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/015.yaml
  text: For seven days you shall celebrate a feast to Yahweh your God in the place that Yahweh will choose[a], because Yahweh your God will bless you in all your produce and in all the work of your hands, and you shall be altogether joyful.
translation:
  language: id
  text: Selama tujuh hari engkau harus merayakan hari raya untuk Yahweh, Allahmu, di tempat yang akan dipilih Yahweh, sebab Yahweh, Allahmu, akan memberkatimu dalam segala hasil tanahmu dan dalam segala pekerjaan tanganmu. Engkau pun akan benar-benar bersukacita.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “engkau akan hanya bersukacita” atau “engkau pasti bersukacita.” Ungkapan Ibrani ini menekankan sukacita yang penuh dan sungguh-sungguh.
    reason: Alternatif leksikal bagi אַךְ שָׂמֵחַ dipertahankan karena אַךְ dapat dipahami secara membatasi atau menegaskan.
lexical_decisions:
- source_word: תָּחֹג
  choice: harus merayakan hari raya
  rationale: Kata kerja חָגַג menunjuk pada perayaan hari raya ziarah, bukan sekadar kegembiraan umum. Ungkapan ini mempertahankan unsur perayaan khusus dalam bahasa Indonesia yang alami.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Preposisi ל menandai bahwa perayaan itu diarahkan atau dipersembahkan kepada Yahweh; 'bagi' menyampaikan orientasi tersebut secara wajar.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap terlihat.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה
  choice: di tempat yang akan dipilih Yahweh
  rationale: Terjemahan ini mengikuti konstruksi ב + מָקוֹם dan mempertahankan rujukan kepada tempat ibadah yang dipilih oleh Yahweh.
- source_word: כִּי
  choice: sebab
  rationale: Di sini כִּי memperkenalkan alasan bagi perintah untuk merayakan; 'sebab' menyatakan hubungan kausal dengan jelas dan bermartabat.
- source_word: יְבָרֶכְךָ
  choice: akan memberkatimu
  rationale: Kata ברך merupakan bahasa baku mengenai berkat ilahi dan mempertahankan resonansi perjanjian dalam konteks ini.
- source_word: תְּבוּאָתְךָ
  choice: hasil tanahmu
  rationale: תְּבוּאָה mencakup hasil atau produksi pertanian secara luas. 'Hasil tanah' alami dalam konteks agraris dan tidak membatasinya hanya pada panen biji-bijian.
- source_word: מַעֲשֵׂה יָדֶיךָ
  choice: pekerjaan tanganmu
  rationale: Terjemahan ini mempertahankan idiom Ibrani tentang jerih payah seseorang beserta hasilnya dan tetap mudah dipahami.
- source_word: וְהָיִיתָ
  choice: Engkau pun akan
  rationale: Bentuk ini meneruskan akibat dari berkat ilahi. 'Pun' menghubungkan klausa penutup secara alami tanpa menetapkan hubungan tujuan yang tidak dinyatakan secara eksplisit.
- source_word: אַךְ שָׂמֵחַ
  choice: benar-benar bersukacita
  rationale: אַךְ memberi penekanan pada keadaan sukacita. 'Benar-benar bersukacita' menyampaikan intensitasnya sambil mempertahankan kemungkinan nuansa alternatif dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian sebagai nama pribadi, bukan menggantinya dengan sebuah gelar.
- issue: Daya ungkap וְהָיִיתָ אַךְ שָׂמֵחַ
  choice: Engkau pun akan benar-benar bersukacita
  alternative: engkau akan hanya bersukacita; engkau akan sepenuhnya bergembira
  rationale: אַךְ dapat terdengar membatasi ('hanya') atau menegaskan kepenuhan sukacita. Dalam konteks berkat dan perayaan, teks utama memakai ungkapan penegasan yang alami, sedangkan ambiguitas leksikalnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal 'engkau', sesuai bentuk orang kedua maskulin tunggal dalam teks Ibrani. Struktur dibuat alami dan bermartabat; idiom 'pekerjaan tanganmu' dipertahankan karena jelas bagi pembaca umum.
