  yaml_path: translation/ot/deuteronomy/016/005.yaml
  text: You may not sacrifice the Passover in any one of your gates that Yahweh your God is giving you[b][a],
translation:
  language: id
  text: Engkau tidak boleh mempersembahkan kurban Paskah[a] di salah satu kotamu[b] yang Yahweh, Allahmu, berikan kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Paskah”; dalam konteks ini istilah tersebut menunjuk pada kurban atau persembahan Paskah.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “gerbang-gerbangmu”; dalam Ulangan, “gerbang” sering dipakai untuk menyebut kota atau permukiman.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא תוּכַל
  choice: Kamu tidak boleh
  rationale: Gabungan יכל dengan infinitif dalam konteks hukum menyatakan larangan, bukan sekadar ketidakmampuan. Bentuk ini juga mempertahankan sapaan orang kedua tunggal.
- source_word: לִזְבֹּחַ
  choice: mempersembahkan kurban
  rationale: Dalam konteks ibadah, זבח menunjuk pada tindakan menyembelih atau mempersembahkan kurban. Pilihan ini menyampaikan fungsi ritualnya dengan jelas dalam bahasa Indonesia.
- source_word: הַפָּסַח
  choice: kurban Paskah
  rationale: Di sini פֶּסַח menjadi objek tindakan pengurbanan sehingga kemungkinan besar menunjuk pada kurban Paskah, bukan hanya perayaannya. Catatan kaki mempertahankan keluasan makna istilah Ibrani.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: di salah satu kotamu
  rationale: Secara harfiah שְׁעָרֶיךָ berarti 'gerbang-gerbangmu', tetapi dalam Ulangan kata itu lazim dipakai secara metonimis untuk kota atau permukiman yang memiliki gerbang. 'Kotamu' menyampaikan maksudnya secara alami.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: yang diberikan Yahweh, Allahmu, kepadamu
  rationale: Partisipel נֹתֵן menggambarkan pemberian yang sedang berlangsung atau menjadi ciri tetap. Bentuk pasif Indonesia menghubungkan klausa relatif dengan 'kotamu' secara alami tanpa mengubah pelakunya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה secara langsung; 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Cakupan makna הַפָּסַח
  choice: kurban Paskah
  alternative: Paskah
  rationale: Kata kerja pengurbanan mengarahkan makna pada hewan atau persembahan Paskah, tetapi istilah Ibraninya tetap dapat menunjuk lebih luas pada Paskah; ketegangan leksikal ini dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Larangan disampaikan secara langsung dengan 'tidak boleh'; metonimi Ibrani dijelaskan dalam catatan kaki agar teks utama mudah dipahami.
