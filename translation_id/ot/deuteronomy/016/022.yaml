  text: וְ/לֹֽא תָקִ֥ים לְ/ךָ֖ מַצֵּבָ֑ה אֲשֶׁ֥ר שָׂנֵ֖א יְהוָ֥ה אֱלֹהֶֽי/ךָ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/022.yaml
  text: And you shall not set up for yourself a pillar[a], which Yahweh your God hates.
translation:
  language: id
  text: Janganlah juga engkau mendirikan untuk dirimu sendiri tugu batu[a] yang dibenci Yahweh, Allahmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “batu tegak” atau “tugu pemujaan.” Istilah Ibrani ini merujuk pada batu yang didirikan dan berkaitan dengan ibadah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Janganlah juga
  rationale: Konjungsi וְ menghubungkan larangan ini dengan larangan sebelumnya; “juga” menyampaikan hubungan tambahan itu secara alami dalam bahasa Indonesia.
- source_word: תָקִים
  choice: mendirikan
  rationale: Bentuk Hifil dari קום berarti membuat sesuatu berdiri. “Mendirikan” tepat dan alami untuk sebuah tugu atau batu tegak.
- source_word: לְךָ
  choice: untuk dirimu sendiri
  rationale: Ungkapan ini mempertahankan keterlibatan pribadi atau nuansa refleksif dari datif pronominal Ibrani.
- source_word: מַצֵּבָה
  choice: tugu batu
  rationale: Istilah ini menunjuk pada batu yang didirikan sebagai monumen dan dalam konteks ini berkaitan dengan ibadah. “Tugu batu” menyampaikan wujud bendanya tanpa memasukkan kata “suci” yang tidak dinyatakan secara eksplisit; nuansa kultis dijelaskan dalam catatan kaki.
- source_word: אֲשֶׁר שָׂנֵא
  choice: yang dibenci
  rationale: Klausa relatif pasif ini alami dalam bahasa Indonesia dan mempertahankan hubungan langsung antara tugu batu dan kebencian Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks sumber tetap tampak.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk ini mempertahankan sufiks orang kedua tunggal dan ungkapan relasional “Allahmu” secara ringkas dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi secara langsung. “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Nuansa kultis מַצֵּבָה
  choice: tugu batu, dengan catatan kaki
  alternative: tugu suci atau tugu pemujaan
  rationale: Konteks menunjukkan benda yang berhubungan dengan ibadah, tetapi kata Ibraninya sendiri terutama menyebut batu atau tugu yang ditegakkan. Terjemahan utama tidak menambahkan sifat “suci”, sedangkan catatan kaki menjaga nuansa kultis dan pilihan leksikal lain.
- issue: Ruang lingkup kebencian Yahweh
  choice: yang dibenci Yahweh, Allahmu
  alternative: sebab Yahweh, Allahmu, membencinya
  rationale: 'Klausa relatif mempertahankan bentuk dan ketegangan teks sumber: tugu batu itulah yang dinyatakan dibenci, tanpa memperluas larangan menjadi pernyataan tentang semua monumen batu.'
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Kata ganti “engkau” mempertahankan sapaan orang kedua tunggal, sedangkan susunan kalimat dibuat alami tanpa menghilangkan larangan tegas atau klausa relatif dari teks Ibrani.
