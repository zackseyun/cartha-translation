  source_fidelity: Terjemahan dengan tepat menyampaikan larangan וְלֹא, tindakan kausatif תָקִים melalui “mendirikan,” datif לְךָ melalui “untuk dirimu sendiri,” objek מַצֵּבָה sebagai “tugu batu,” serta klausa relatif bahwa benda itu dibenci oleh Yahweh, Allah Israel. “Juga” merupakan cara yang wajar untuk menyatakan hubungan waw dengan larangan sebelumnya dan tidak mengubah isi larangan.
