base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/021.yaml
  text: You shall not plant for yourself an Asherah of any kind of tree beside the altar of Yahweh your God that you make for yourself[a].
translation:
  language: id
  text: Janganlah engkau menanam bagi dirimu suatu Asyera dari pohon apa pun di samping mazbah Yahweh, Allahmu, yang engkau buat bagi dirimu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebuah tiang Asyera”; kata Ibrani אֲשֵׁרָה dapat menunjuk kepada benda kultis yang berkaitan dengan dewi Asyera, bukan hanya kepada sang dewi sendiri.
    reason: alternative_reading
lexical_decisions:
- source_word: תִטַּע
  choice: menanam
  rationale: Kata kerja נטע pada dasarnya berarti “menanam”. Pilihan ini mempertahankan gambaran sumber, meskipun objeknya bersifat kultis dan dapat berupa pohon hidup atau benda kayu.
- source_word: אֲשֵׁרָה
  choice: Asyera
  rationale: Transliterasi Indonesia mempertahankan kemungkinan bahwa istilah ini menunjuk kepada dewi Asyera ataupun benda kultis yang berkaitan dengannya, tanpa mempersempitnya menjadi “tiang” dalam teks utama.
- source_word: כָּל עֵץ
  choice: dari jenis pohon apa pun
  rationale: Secara harfiah berarti “setiap/segala pohon”. Ungkapan ini alami dalam bahasa Indonesia dan menghubungkan bahan atau bentuk pohon dengan Asyera tanpa menentukan secara berlebihan hakikat bendanya.
- source_word: אֵצֶל
  choice: di samping
  rationale: Menyatakan kedekatan ruang secara konkret dan sesuai dengan larangan ini.
- source_word: מִזְבַּח
  choice: mazbah
  rationale: Istilah baku dan bermartabat dalam bahasa Indonesia untuk altar persembahan dalam konteks Alkitab.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama diri, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Mencerminkan konstruksi dengan akhiran orang kedua tunggal dan sapaan perjanjian secara ringkas serta alami.
- source_word: אֲשֶׁר תַּעֲשֶׂה לָּךְ
  choice: yang kamu buat bagi dirimu
  rationale: Mempertahankan makna luas עשה, “membuat”, dan unsur לָּךְ, “bagi dirimu”, tanpa mempersempitnya menjadi “membangun”.
theological_decisions:
- issue: Apakah אֲשֵׁרָה menunjuk kepada nama dewi atau benda kultis
  choice: Memakai transliterasi “Asyera” dalam teks utama dan menjelaskan cakupan maknanya dalam catatan kaki.
  alternative: “tiang Asyera” atau “patung kayu Asyera”
  rationale: Istilah Ibrani dapat menunjuk kepada dewi Asyera atau benda kultis yang berhubungan dengannya. Transliterasi menjaga ambiguitas asli dan tidak memaksakan satu penafsiran.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada hukum yang lugas dan bermartabat. Bentuk “janganlah kamu” mempertahankan sapaan orang kedua tunggal secara alami; pengulangan “bagi dirimu” mengikuti penekanan teks Ibrani. Istilah “Asyera” dipakai sebagai transliterasi Indonesia, sedangkan “mazbah” dipilih karena merupakan istilah Alkitab yang mapan dan mudah dikenali.
