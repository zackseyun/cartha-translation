  text: וְ/לֹֽא יֵרָאֶ֨ה לְ/ךָ֥ שְׂאֹ֛ר בְּ/כָל גְּבֻלְ/ךָ֖ שִׁבְעַ֣ת יָמִ֑ים וְ/לֹא יָלִ֣ין מִן הַ/בָּשָׂ֗ר אֲשֶׁ֨ר תִּזְבַּ֥ח בָּ/עֶ֛רֶב בַּ/יּ֥וֹם הָ/רִאשׁ֖וֹן לַ/בֹּֽקֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/004.yaml
  text: No leaven is to be seen with you within all your territory for seven days[b][a], and none of the flesh that you sacrifice in the evening on the first day shall remain overnight until morning.
translation:
  language: id
  text: Selama tujuh hari, jangan ada ragi yang terlihat di seluruh wilayahmu. Jangan biarkan sedikit pun dari daging[a] yang kaukorbankan pada petang hari pertama[b] tersisa semalaman sampai pagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “daging”; dalam konteks kurban, kata Ibrani ini dapat menunjuk daging kurban.
    reason: lexical_alternative
  - marker: b
    text: “Hari pertama” mungkin secara khusus menunjuk waktu kurban Paskah pada awal perayaan, tetapi teks Ibrani di sini tidak secara eksplisit menyebut “anak domba Paskah.”
    reason: alternative_reading
lexical_decisions:
- source_word: יֵרָאֶה
  choice: terlihat
  rationale: Bentuk Nifal bersifat pasif; ‘terlihat’ mempertahankan bentuk larangan secara wajar dalam bahasa Indonesia.
- source_word: שְׂאֹר
  choice: ragi
  rationale: Dalam konteks hukum Paskah, kata ini menunjuk bahan pengembang atau adonan beragi; ‘ragi’ adalah padanan modern yang paling mudah dipahami.
- source_word: בְּכָל גְּבֻלְךָ
  choice: di seluruh wilayahmu
  rationale: גְּבוּל di sini menyatakan cakupan wilayah, bukan sekadar garis perbatasan.
- source_word: שִׁבְעַת יָמִים
  choice: selama tujuh hari
  rationale: Preposisi ‘selama’ menyampaikan durasi yang tersirat secara alami.
- source_word: יָלִין
  choice: tersisa semalaman
  rationale: Dalam konteks makanan kurban, kata ini melarang daging dibiarkan melewati malam hingga pagi.
- source_word: מִן הַבָּשָׂר
  choice: sedikit pun dari daging
  rationale: מִן bersifat partitif dan בָּשָׂר berarti ‘daging’ atau secara harfiah ‘tubuh jasmani’; ungkapan ini menyampaikan bahwa tidak boleh ada bagian yang tersisa.
- source_word: אֲשֶׁר תִּזְבַּח
  choice: yang kaukorbankan
  rationale: זבח dalam konteks ritual berarti menyembelih atau mempersembahkan sebagai kurban; ‘kaukorbankan’ ringkas dan jelas.
- source_word: בָּעֶרֶב
  choice: pada petang hari
  rationale: Padanan temporal yang alami dan bermartabat dalam bahasa Indonesia.
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: hari pertama
  rationale: Teks Ibrani hanya menyebut ‘hari pertama’; terjemahan tidak menambahkan ‘perayaan’ atau ‘Paskah’ ke dalam teks utama.
- source_word: לַבֹּקֶר
  choice: sampai pagi
  rationale: Dalam larangan ini, לַבֹּקֶר menandai batas waktu.
theological_decisions:
- issue: Rujukan daging yang dikorbankan pada hari pertama
  choice: Diterjemahkan secara umum sebagai daging kurban tanpa menyebut ‘anak domba Paskah’ dalam teks utama.
  alternative: Menafsirkannya secara khusus sebagai kurban Paskah, atau secara lebih luas sebagai kurban-kurban perayaan pada awal perayaan.
  rationale: Bahasa Ibrani hanya mengatakan ‘daging yang kaukorbankan pada petang hari pertama’. Terjemahan mempertahankan ketidakjelasan rujukannya dan tidak menyelesaikan perbedaan tafsir.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk sapaan tunggal dipertahankan melalui ‘-mu’ dan ‘kau-’. Susunan kalimat dipecah menjadi dua larangan agar alami tanpa mengubah hubungan makna.
