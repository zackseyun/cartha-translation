  yaml_path: translation/ot/deuteronomy/016/007.yaml
  text: And you shall cook it and eat it in the place that the LORD your God will choose for it, and in the morning you shall turn and go to your tents.
translation:
  language: id
  text: Masaklah kurban itu dan makanlah di tempat yang akan dipilih TUHAN, Allahmu, lalu pada pagi hari pulanglah ke kemah-kemahmu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבִשַּׁלְתָּ
  choice: Masaklah
  rationale: Kata kerja ini berarti memasak atau mengolah dengan panas; konteks kurban Paskah tidak mengharuskan arti yang lebih sempit seperti 'merebus'.
- source_word: וְאָכַלְתָּ
  choice: dan makanlah
  rationale: Menerjemahkan secara langsung tindakan kedua yang diperintahkan.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ
  choice: di tempat yang akan dipilih TUHAN, Allahmu
  rationale: Frasa בּוֹ dipahami secara idiomatis bersama 'tempat yang akan dipilih'; kata 'untuknya' tidak ditambahkan karena terasa janggal dan tidak diperlukan dalam bahasa Indonesia.
- source_word: וּפָנִיתָ בַבֹּקֶר וְהָלַכְתָּ לְאֹהָלֶיךָ
  choice: lalu pada pagi hari pulanglah ke kemahmu
  rationale: Secara harfiah berarti 'berbaliklah ... dan pergilah ke kemah-kemahmu'; 'pulanglah' menyampaikan gerak kembali dengan wajar, sedangkan bentuk kolektif Ibrani dapat dinyatakan dengan bentuk generik tunggal Indonesia.
theological_decisions:
- issue: Identitas objek yang dimasak dan dimakan
  choice: kurban itu
  alternative: itu
  rationale: Objek tersirat berasal dari konteks kurban Paskah pada ayat sebelumnya. Penambahan 'kurban' memperjelas rujukan tanpa menentukan secara sempit apakah yang dimaksud hanya anak domba atau juga persembahan lain.
- issue: Pengungkapan nama ilahi יהוה
  choice: TUHAN
  alternative: YHWH/Yahweh
  rationale: Mengikuti konvensi Alkitab bahasa Indonesia yang luas dikenal, tanpa menambahkan tafsiran denominasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Bentuk imperatif dipakai untuk menyampaikan nilai perintah dari konstruksi Ibrani. Tidak ada penanda catatan kaki karena tidak diperlukan.
