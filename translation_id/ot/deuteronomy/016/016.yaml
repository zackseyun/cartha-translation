  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: שָׁל֣וֹשׁ פְּעָמִ֣ים בַּ/שָּׁנָ֡ה יֵרָאֶ֨ה כָל זְכוּרְ/ךָ֜ אֶת פְּנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ בַּ/מָּקוֹם֙ אֲשֶׁ֣ר יִבְחָ֔ר בְּ/חַ֧ג הַ/מַּצּ֛וֹת וּ/בְ/חַ֥ג הַ/שָּׁבֻע֖וֹת וּ/בְ/חַ֣ג הַ/סֻּכּ֑וֹת וְ/לֹ֧א יֵרָאֶ֛ה אֶת פְּנֵ֥י יְהוָ֖ה רֵיקָֽם׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/016.yaml
  text: 'Three times a year all your males shall appear before Yahweh your God in the place that he will choose: at the Feast of Unleavened Bread[a], at the Feast of Weeks, and at the Feast of Booths[c][b]. No one shall appear before Yahweh empty-handed.'
translation:
  language: id
  text: 'Tiga kali setahun, setiap laki-laki di antara kamu harus menghadap Yahweh, Allahmu,[a] di tempat yang akan dipilih-Nya: pada Hari Raya Roti Tidak Beragi, Hari Raya Tujuh Minggu, dan Hari Raya Pondok Daun.[b] Tidak seorang pun boleh menghadap Yahweh dengan tangan kosong.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, "harus terlihat di hadapan"; bentuk Ibrani ini dalam konteks perayaan ziarah berarti datang menghadap atau menampilkan diri di hadapan Allah.
    reason: lexical_alternative
  - marker: b
    text: Hari Raya Pondok Daun secara tradisional juga disebut Hari Raya Tabernakel; "pondok" merujuk pada tempat tinggal sementara.
    reason: alternative_reading
  - marker: c
    text: '"Dengan tangan kosong" berarti datang tanpa pemberian atau persembahan yang diwajibkan.'
    reason: cultural_note
lexical_decisions:
- source_word: יֵרָאֶה
  choice: harus menghadap
  rationale: Bentuk Nifal dari ראה secara harfiah dapat berarti “terlihat”, tetapi dalam konteks perayaan ziarah merupakan ungkapan untuk datang dan menampilkan diri di hadapan Allah. “Menghadap” alami dalam bahasa Indonesia dan sesuai dengan pemakaian kultisnya.
- source_word: כָל זְכוּרְךָ
  choice: setiap laki-laki di antara kamu
  rationale: Frasa Ibrani ini secara khusus menunjuk kepada semua orang berjenis kelamin laki-laki yang terkena kewajiban hukum tersebut; terjemahan ini mempertahankan cakupan maskulin teks sumber.
- source_word: פְּנֵי יְהוָה אֱלֹהֶיךָ
  choice: menghadap Yahweh, Allahmu
  rationale: Ungkapan “wajah Yahweh” secara idiomatis berarti berada atau tampil di hadapan-Nya. “Menghadap Yahweh” menyampaikan idiom itu secara wajar tanpa menghilangkan nama ilahi dan hubungan perjanjian dalam “Allahmu”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחָר
  choice: di tempat yang akan dipilih-Nya
  rationale: Bentuk imperfek mempertahankan arah ke depan dalam konteks Ulangan dan menegaskan bahwa Allah sendiri menentukan tempat ibadah.
- source_word: חַג הַמַּצּוֹת
  choice: Hari Raya Roti Tidak Beragi
  rationale: Ini adalah nama perayaan yang baku, jelas, dan langsung mencerminkan unsur-unsur istilah Ibrani.
- source_word: חַג הַשָּׁבֻעוֹת
  choice: Hari Raya Tujuh Minggu
  rationale: שָׁבֻעוֹת berarti “minggu-minggu”. Penambahan “Tujuh” membuat nama perayaan lebih alami dan mudah dikenali dalam bahasa Indonesia berdasarkan penghitungan tujuh minggu dalam konteks dekat, tanpa memakai nama Yunani yang lebih kemudian, “Pentakosta”.
- source_word: חַג הַסֻּכּוֹת
  choice: Hari Raya Pondok Daun
  rationale: “Pondok Daun” merupakan nama Indonesia yang transparan bagi סֻכּוֹת, yaitu tempat-tempat tinggal sementara atau pondok-pondok.
- source_word: וְלֹא יֵרָאֶה אֶת־פְּנֵי יְהוָה רֵיקָם
  choice: Jangan seorang pun menghadap Yahweh dengan tangan kosong
  rationale: רֵיקָם secara harfiah berarti “kosong”; dalam konteks ibadah ini, “dengan tangan kosong” secara idiomatis menyatakan datang tanpa pemberian atau persembahan yang diwajibkan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama perjanjian itu dan tidak menggantinya dengan sebuah gelar.
- issue: Cakupan kewajiban berdasarkan כָל זְכוּרְךָ
  choice: setiap laki-laki di antara kamu
  alternative: semua orang di antara kamu
  rationale: Teks sumber secara eksplisit menetapkan kewajiban ini bagi laki-laki. Terjemahan tidak menetralkan rujukan gender maupun memperluas cakupan hukum secara diam-diam.
- issue: Nuansa bentuk יֵרָאֶה
  choice: harus menghadap
  alternative: harus terlihat di hadapan
  rationale: Bentuk Ibraninya secara formal dapat dipahami sebagai pasif/refleksif, tetapi berfungsi sebagai ungkapan kehadiran kultis. Teks utama memakai bahasa Indonesia yang alami, sedangkan alternatif harfiah dicatat dalam catatan kaki agar ambiguitas bentuk tetap terlihat.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Struktur ayat dipertahankan dengan daftar tiga perayaan yang jelas. “Harus menghadap” dipilih daripada bentuk sangat harfiah “harus terlihat” agar idiom Ibrani dipahami pembaca umum. Semua penanda catatan kaki muncul dalam teks utama.
