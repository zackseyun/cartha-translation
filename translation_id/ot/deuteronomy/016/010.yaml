  text: וְ/עָשִׂ֜יתָ חַ֤ג שָׁבֻעוֹת֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ מִסַּ֛ת נִדְבַ֥ת יָדְ/ךָ֖ אֲשֶׁ֣ר תִּתֵּ֑ן כַּ/אֲשֶׁ֥ר יְבָרֶכְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/016/010.yaml
  text: Then you shall celebrate the Feast of Weeks to Yahweh your God with a tribute of a freewill offering from your hand[a], which you shall give according to how Yahweh your God blesses you.
translation:
  language: id
  text: Kemudian, rayakanlah Hari Raya Tujuh Minggu bagi Yahweh, Allahmu, dengan sejumlah persembahan sukarela dari tanganmu,[a] yang kauberikan sesuai dengan berkat yang Yahweh, Allahmu, berikan kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sesuai ukuran persembahan sukarela dari tanganmu.” Ungkapan Ibrani menekankan bahwa pemberian itu sukarela dan jumlahnya sepadan dengan berkat yang diterima dari Allah.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Kemudian rayakanlah
  rationale: Dalam konteks hari raya, עשה berarti merayakan atau menjalankan perayaan, bukan secara harfiah ‘membuat’. ‘Kemudian’ menyampaikan urutan dalam konteks.
- source_word: חַג שָׁבֻעוֹת
  choice: Hari Raya Tujuh Minggu
  rationale: Nama perayaan ini berkaitan dengan penghitungan tujuh minggu dalam ayat sebelumnya. Bentuk ini jelas dan alami dalam bahasa Indonesia.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: bagi Yahweh Allahmu
  rationale: Preposisi ל menyatakan bahwa perayaan itu ditujukan atau dipersembahkan bagi Yahweh.
- source_word: מִסַּת נִדְבַת יָדְךָ
  choice: persembahan sukarela menurut kemampuanmu
  rationale: מִסַּת menyatakan ukuran, jumlah, atau kadar, sedangkan נִדְבָה menandai pemberian sukarela. Ungkapan ‘tanganmu’ merupakan idiom mengenai kemampuan atau sumber daya si pemberi; makna idiomatis dipakai dalam teks dan bentuk Ibraninya dicatat dalam catatan kaki.
- source_word: אֲשֶׁר תִּתֵּן
  choice: dengan memberikan
  rationale: Klausa relatif Ibrani diungkapkan sebagai konstruksi verbal yang alami dalam bahasa Indonesia tanpa menghilangkan tindakan memberi.
- source_word: כַּאֲשֶׁר יְבָרֶכְךָ
  choice: sebanding dengan berkat yang diberikan ... kepadamu
  rationale: Frasa ini menetapkan berkat ilahi sebagai dasar proporsional bagi jumlah persembahan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung. ‘Yahweh’ mempertahankannya sebagai nama diri, sedangkan ‘TUHAN’ merupakan penggantian tradisional berdasarkan kebiasaan pembacaan.
- issue: Sifat dan ukuran persembahan
  choice: sukarela dan sebanding dengan berkat yang diterima
  alternative: jumlah upeti yang ditetapkan
  rationale: נִדְבָה secara nyata menyatakan kesukarelaan, sementara מִסַּת dan כַּאֲשֶׁר menunjukkan ukuran atau proporsi. Terjemahan tidak mengubahnya menjadi tarif wajib yang seragam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum-keagamaan yang tetap mudah dipahami. Bentuk tunggal ‘-mu’ dipertahankan sesuai sapaan Ibrani kepada setiap anggota umat. ‘Hari Raya Tujuh Minggu’ dipilih untuk memperlihatkan kaitannya dengan tujuh minggu yang dihitung dalam konteks dekat.
