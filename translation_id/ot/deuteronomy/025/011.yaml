  text: כִּֽי יִנָּצ֨וּ אֲנָשִׁ֤ים יַחְדָּו֙ אִ֣ישׁ וְ/אָחִ֔י/ו וְ/קָֽרְבָה֙ אֵ֣שֶׁת הָֽ/אֶחָ֔ד לְ/הַצִּ֥יל אֶת אִישָׁ֖/הּ מִ/יַּ֣ד מַכֵּ֑ה/וּ וְ/שָׁלְחָ֣ה יָדָ֔/הּ וְ/הֶחֱזִ֖יקָה בִּ/מְבֻשָֽׁי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/011.yaml
  text: If men are fighting together[a], a man and his brother, and the wife of one comes near to rescue her husband from the hand of the one striking him, and she reaches out her hand and seizes his genitals[d][c][b],
translation:
  language: id
  text: Apabila[a] dua orang laki-laki berkelahi, seorang laki-laki dengan saudaranya,[b] lalu istri salah seorang dari mereka mendekat untuk menyelamatkan suaminya dari tangan orang yang memukul suaminya,[c] dan ia mengulurkan tangannya serta mencengkeram kemaluan penyerang itu,[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “Ketika.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “seorang dan saudaranya.” Di sini “saudara” dapat berarti sesama laki-laki atau rekan sebangsa, bukan selalu saudara kandung.
    reason: cultural_note
  - marker: c
    text: Dapat juga diterjemahkan, “dari tangan penyerangnya.”
    reason: lexical_alternative
  - marker: d
    text: Kata Ibrani ini menunjuk pada bagian kelamin laki-laki, dengan ungkapan yang berkaitan dengan rasa malu.
    reason: lexical_note
lexical_decisions:
- source_word: כִּי
  choice: Apabila
  rationale: Memperkenalkan kasus hukum dengan nuansa bersyarat; “apabila” terdengar wajar dan bermartabat dalam bahasa hukum Indonesia, sambil tetap memungkinkan nuansa waktu.
- source_word: יִנָּצוּ אֲנָשִׁים יַחְדָּו
  choice: dua orang laki-laki berkelahi satu sama lain
  rationale: Bentuk verba menggambarkan perkelahian timbal balik, dan אֲנָשִׁים dalam konteks ini merujuk khusus kepada laki-laki.
- source_word: אִישׁ וְאָחִיו
  choice: seorang dengan saudaranya
  rationale: Mempertahankan ungkapan harfiah “seorang dan saudaranya”; catatan kaki menjelaskan bahwa “saudara” tidak harus berarti saudara kandung.
- source_word: וְקָרְבָה אֵשֶׁת הָאֶחָד
  choice: lalu istri salah seorang dari mereka mendekat
  rationale: Menyampaikan gerak mendekat dan memperjelas bahwa perempuan tersebut adalah istri salah satu dari kedua laki-laki itu.
- source_word: לְהַצִּיל אֶת אִישָׁהּ
  choice: untuk menyelamatkan suaminya
  rationale: Dalam konteks perkawinan, אִישָׁהּ secara alami berarti “suaminya,” sedangkan לְהַצִּיל menyatakan tindakan melepaskan dari bahaya.
- source_word: מִיַּד מַכֵּהוּ
  choice: dari tangan orang yang memukulnya
  rationale: Mempertahankan gambaran konkret “dari tangan” dan bentuk partisipial “orang yang memukulnya,” tanpa mereduksinya menjadi istilah yang lebih abstrak.
- source_word: וְשָׁלְחָה יָדָהּ
  choice: ia mengulurkan tangannya
  rationale: Padanan Indonesia yang alami bagi idiom Ibrani tentang menjangkau atau mengulurkan tangan.
- source_word: וְהֶחֱזִיקָה
  choice: lalu mencengkeram
  rationale: Menyatakan tindakan memegang dengan kuat dan sengaja sebagaimana tersirat dalam bentuk Hifil.
- source_word: בִּמְבֻשָׁיו
  choice: kemaluan orang itu
  rationale: Menunjuk pada bagian kelamin laki-laki; “orang itu” memperjelas bahwa pronomina merujuk kepada lawan suaminya tanpa menghilangkan isi sumber.
