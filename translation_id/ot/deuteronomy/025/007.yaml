  source_fidelity: 'Sebagian besar setia pada Ibrani. Namun, “Ipar saya” dalam ujaran perempuan itu terlalu kabur dalam bahasa Indonesia: dapat merujuk kepada beberapa hubungan kekerabatan dan tidak secara eksplisit menyatakan bahwa yang dimaksud ialah saudara laki-laki almarhum suaminya. Selain itu, “janda saudaranya itu” dapat dirapikan tanpa mengubah makna.'
