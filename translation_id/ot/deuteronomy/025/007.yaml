  terminology: “Janda saudaranya,” “para tua-tua,” dan “menegakkan nama” sesuai konteks. Catatan kaki perlu menghindari kesan bahwa idiom itu semata-mata berarti garis keluarga; idiom tersebut secara langsung berkaitan dengan kelangsungan nama almarhum dalam Israel.
