  to: Namun, jika laki-laki itu tidak mau mengambil janda saudaranya, janda itu harus pergi ke pintu gerbang menemui para tua-tua dan berkata, “Saudara ipar saya menolak menegakkan nama saudaranya di Israel.[a] Ia tidak bersedia menjalankan kewajiban sebagai saudara ipar terhadap saya.”[b]
