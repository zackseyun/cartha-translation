base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/007.yaml
  text: But if the man does not want to take his brother’s widow[a], then his brother’s widow shall go up to the gate, to the elders, and say, ‘My brother-in-law refuses to raise up a name for his brother in Israel[b]; he is not willing to perform the duty of a brother-in-law to me.’
translation:
  language: id
  text: Namun, jika laki-laki itu tidak mau mengambil janda saudaranya, janda itu harus pergi ke pintu gerbang menemui para tua-tua dan berkata, “Saudara ipar saya menolak menegakkan nama saudaranya di Israel.[a] Ia tidak bersedia menjalankan kewajiban sebagai saudara ipar terhadap saya.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “menegakkan nama saudaranya di Israel” berarti melestarikan nama saudara yang telah meninggal melalui kelangsungan keluarganya di Israel.
    reason: lexical_alternative
  - marker: b
    text: Bahasa Ibrani memakai kata kerja khusus untuk menjalankan kewajiban perkawinan ipar, yaitu menikahi janda saudara yang telah meninggal.
    reason: cultural_note
lexical_decisions:
- source_word: יַחְפֹּץ
  choice: tidak mau
  rationale: Mengungkapkan kehendak atau kesediaan dalam konteks hukum secara alami dan langsung.
- source_word: לָקַחַת אֶת יְבִמְתּוֹ
  choice: mengambil janda saudaranya itu
  rationale: Mempertahankan verba harfiah 'mengambil', sementara 'janda saudaranya' memperjelas hubungan khusus dalam perkawinan ipar.
- source_word: וְעָלְתָה ... הַשַּׁעְרָה אֶל הַזְּקֵנִים
  choice: harus pergi ke pintu gerbang menemui para tua-tua
  rationale: Dalam konteks ini pintu gerbang merupakan tempat para tua-tua mengadili; 'pergi' lebih alami daripada menyalin unsur arah 'naik' yang tidak penting dalam bahasa Indonesia.
- source_word: מֵאֵין
  choice: menolak
  rationale: Menyampaikan penolakan resmi dalam pengaduan hukum.
- source_word: לְהָקִים ... שֵׁם
  choice: menegakkan nama
  rationale: Mempertahankan citra idiom Ibrani tanpa menafsirkan seluruh maknanya di dalam teks utama.
- source_word: לֹא אָבָה
  choice: tidak bersedia
  rationale: Mempertahankan unsur kemauan dan membedakannya dari kata 'menolak' sebelumnya.
- source_word: יַבְּמִי
  choice: menjalankan kewajiban sebagai ipar terhadap saya
  rationale: Verba teknis ini menunjuk pada pelaksanaan kewajiban perkawinan ipar; terjemahan menjelaskan fungsinya tanpa memakai jargon akademis.
theological_decisions:
- issue: Istilah perkawinan ipar
  choice: 'Gunakan bahasa relasional-hukum yang jelas: ''janda saudaranya'', ''ipar'', dan ''menjalankan kewajiban sebagai ipar''.'
  alternative: Memakai istilah teknis 'perkawinan levirat' atau menerjemahkan sekadar 'saudara ipar'.
  rationale: Pilihan ini menjelaskan hubungan khusus yang dimaksud teks tanpa memasukkan ajaran denominasi atau membuat istilah Ibrani menjadi kabur.
- issue: Makna idiom menegakkan nama
  choice: Pertahankan idiom 'menegakkan nama' dalam teks dan jelaskan cakupannya dalam catatan kaki.
  alternative: Terjemahkan secara interpretatif sebagai 'melanjutkan garis keturunan'.
  rationale: Idiom mencakup kelangsungan garis keluarga serta nama dan kedudukan orang yang meninggal; mempertahankannya menjaga keluasan makna sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak hukum yang tetap mudah dipahami. 'Para tua-tua' dipakai untuk pejabat masyarakat setempat, dan 'ipar saya' dipilih agar ucapan perempuan itu alami serta tidak bertele-tele.
