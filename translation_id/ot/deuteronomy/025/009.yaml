  to: Maka janda saudara laki-lakinya harus mendekatinya di hadapan para tua-tua, menanggalkan sandal laki-laki itu dari kakinya, meludahi wajahnya[a], lalu menjawab dan berkata, “Beginilah akan dilakukan terhadap laki-laki yang tidak mau membangun keluarga saudaranya[b].”
