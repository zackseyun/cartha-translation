  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/נִגְּשָׁ֨ה יְבִמְתּ֣/וֹ אֵלָי/ו֮ לְ/עֵינֵ֣י הַ/זְּקֵנִים֒ וְ/חָלְצָ֤ה נַעֲל/וֹ֙ מֵ/עַ֣ל רַגְל֔/וֹ וְ/יָרְקָ֖ה בְּ/פָנָ֑י/ו וְ/עָֽנְתָה֙ וְ/אָ֣מְרָ֔ה כָּ֚כָה יֵעָשֶׂ֣ה לָ/אִ֔ישׁ אֲשֶׁ֥ר לֹא יִבְנֶ֖ה אֶת בֵּ֥ית אָחִֽי/ו־־
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/009.yaml
  text: then his brother’s widow shall come near to him in the sight of the elders[a], remove his sandal from on his foot, spit in his face, and answer and say[b], ‘This is what shall be done to the man who will not build up his brother’s house.’
translation:
  language: id
  text: Maka janda saudara laki-lakinya harus mendekatinya di hadapan para tua-tua, menanggalkan sandal laki-laki itu dari kakinya, meludahi wajahnya[a], lalu menjawab dan berkata, “Beginilah akan dilakukan terhadap laki-laki yang tidak mau membangun keluarga saudaranya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “meludah di hadapannya.” Sebagian penafsir memahami ungkapan Ibrani ini sebagai tindakan meludah di depan laki-laki itu, bukan langsung pada wajahnya.
    reason: lexical_alternative
  - marker: b
    text: “Membangun keluarga saudaranya” berarti menegakkan atau meneruskan garis keluarga dan rumah tangga saudaranya melalui perkawinan levirat, yaitu perkawinan dengan janda saudara yang telah meninggal.
    reason: cultural_note
lexical_decisions:
- source_word: יְבִמְתּוֹ
  choice: janda saudara laki-lakinya
  rationale: Dalam konteks hukum perkawinan levirat, istilah ini menunjuk secara khusus kepada janda dari saudara laki-laki orang itu, bukan sekadar ipar perempuan.
- source_word: לְעֵינֵי הַזְּקֵנִים
  choice: di hadapan para tua-tua
  rationale: Ungkapan harfiah 'di mata para tua-tua' menekankan bahwa tindakan itu dilakukan secara terbuka dan disaksikan oleh para pemimpin masyarakat.
- source_word: וְחָלְצָה נַעֲלוֹ מֵעַל רַגְלוֹ
  choice: menanggalkan kasut dari kakinya
  rationale: Kata kerja חָלַץ di sini berarti melepaskan alas kaki. Bentuk tunggal נַעֲלוֹ dipertahankan dengan 'kasut', istilah yang wajar dalam laras Alkitabiah Indonesia.
- source_word: וְיָרְקָה בְּפָנָיו
  choice: meludahi wajahnya
  rationale: Ini mengikuti makna langsung ungkapan Ibrani dan mempertahankan sifat penghinaan pribadi dalam ritus tersebut; kemungkinan arti 'meludah di hadapannya' dicatat dalam catatan kaki.
- source_word: וְעָנְתָה וְאָמְרָה
  choice: menjawab dengan berkata
  rationale: Terjemahan ini mempertahankan kedua unsur formula hukum-naratif Ibrani tanpa memakai susunan 'menjawab dan berkata' yang lebih kaku dalam bahasa Indonesia.
- source_word: כָּכָה יֵעָשֶׂה
  choice: Beginilah akan dilakukan
  rationale: Bentuk ini mempertahankan daya deklaratif dan bentuk pasif dari formula Ibrani.
- source_word: לָאִישׁ
  choice: terhadap orang
  rationale: Dalam bahasa Indonesia, 'orang' merupakan sebutan alami bagi pihak yang dikenai tindakan; konteks dan klausa sebelumnya sudah menunjukkan bahwa orang tersebut adalah laki-laki.
- source_word: לֹא יִבְנֶה אֶת בֵּית אָחִיו
  choice: tidak mau membangun keluarga saudaranya
  rationale: יִבְנֶה dalam konteks ini menyatakan keengganan, bukan sekadar fakta bahwa tindakan tidak dilakukan. 'Membangun keluarga' mempertahankan metafora pembangunan sekaligus menyampaikan maksud meneruskan garis keluarga saudara yang meninggal.
theological_decisions:
- issue: Apakah בְּפָנָיו menyatakan bahwa ludah diarahkan pada wajahnya atau hanya dilakukan di hadapannya
  choice: meludahi wajahnya
  alternative: meludah di hadapannya
  rationale: Makna langsung konstruksi Ibrani mendukung tindakan yang diarahkan kepada wajah orang itu. Karena alternatif yang lebih lunak tetap mungkin dalam penafsiran ungkapan tersebut, alternatif itu dicantumkan dalam catatan kaki tanpa mengubah teks utama.
- issue: Makna metaforis 'membangun keluarga saudaranya'
  choice: mempertahankan metafora pembangunan dengan penjelasan budaya
  alternative: meneruskan garis keturunan saudaranya
  rationale: Teks Ibrani memakai gambaran membangun 'rumah' saudara. Terjemahan utama mempertahankan gambaran itu dalam ungkapan Indonesia yang dapat dipahami, sedangkan catatan menjelaskan fungsi perkawinan levirat tanpa memasukkan kesimpulan doktrinal.
translation_notes:
  register: Bahasa Indonesia modern dengan laras hukum yang khidmat. Istilah 'para tua-tua' dan 'kasut' mempertahankan warna budaya kuno yang lazim dipahami dalam teks Alkitab, sedangkan struktur kalimat dibuat tetap alami. Penanda catatan kaki ditempatkan tepat setelah frasa yang dijelaskannya.
