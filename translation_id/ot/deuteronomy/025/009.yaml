    issue: Istilah "kasut" kurang sesuai untuk bahasa Indonesia modern standar.
    rationale: '"Sandal" adalah padanan modern yang lazim untuk נַעַל dalam konteks ini dan tetap mempertahankan bentuk tunggal.'
  - severity: medium
    issue: Frasa "menanggalkan kasut dari kakinya" dapat mengaburkan bahwa alas kaki itu milik laki-laki yang menolak.
    rationale: Subjek kalimat adalah sang janda, sehingga dua pronomina -nya berpotensi dibaca merujuk kepadanya. Teks Ibrani secara jelas menyatakan sandal dan kaki laki-laki itu.
  - severity: low
    issue: '"Orang" tidak menyatakan unsur maskulin dari אִישׁ.'
    rationale: Walaupun konteksnya menunjukkan laki-laki, "laki-laki" lebih tepat dan tetap alami dalam ketentuan hukum ini.
