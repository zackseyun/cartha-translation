  source_fidelity: 'Draf pada dasarnya setia kepada teks Ibrani: tindakan itu berlangsung di hadapan para tua-tua, alas kaki tunggal milik laki-laki itu dilepaskan, tindakan meludah diterjemahkan secara langsung, dan ungkapan metaforis tentang membangun rumah/keluarga saudara dipertahankan. Namun, "orang" menghilangkan rujukan eksplisit kepada laki-laki (אִישׁ), dan "kasut" kurang lazim dalam bahasa Indonesia modern. Selain itu, kepemilikan sandal perlu dibuat tegas agar tidak terbaca sebagai sandal sang janda.'
  naturalness: Kalimat revisi tetap bercorak hukum yang khidmat, tetapi memakai "sandal" yang lebih umum dalam bahasa Indonesia modern. Frasa "sandal laki-laki itu dari kakinya" menghilangkan ambiguitas rujukan milik dalam rangkaian pronomina -nya.
  terminology: '"Janda saudara laki-lakinya", "para tua-tua", dan "perkawinan levirat" sesuai konteks hukum kuno. "Laki-laki" mempertahankan maskulin singular dalam אִישׁ. "Membangun keluarga saudaranya" mempertahankan metafora teks sambil catatan kaki menjelaskan idiom "rumah" sebagai garis keluarga/rumah tangga.'
  issues:
