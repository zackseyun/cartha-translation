  register: Bahasa hukum yang ringkas, modern, dan bermartabat. 'Memberangus mulut' dipilih agar tindakan menutup mulut hewan tergambar jelas; 'mengirik' mempertahankan istilah pertanian yang tepat. Penanda catatan kaki [a] ditempatkan langsung dalam teks utama.
