lexical_decisions:
- source_word: לֹא תַחְסֹם
  choice: Jangan memberangus mulut
  rationale: Bentuk larangan Ibrani diterjemahkan secara langsung dan wajar dalam bahasa Indonesia. Kata חָסַם berarti menutup atau mengikat mulut hewan agar tidak dapat makan; frasa ini mempertahankan gambaran konkret tersebut.
- source_word: שׁוֹר
  choice: lembu
  rationale: Kata שׁוֹר menunjuk pada hewan bovina, khususnya hewan pekerja dalam konteks pertanian. 'Lembu' merupakan padanan Indonesia yang alami dan sesuai dengan kegiatan mengirik.
- source_word: בְּדִישׁוֹ
  choice: ketika sedang mengirik
  rationale: Secara harfiah berarti 'dalam/pada pengirikannya'. Ungkapan temporal ini menyampaikan bahwa larangan berlaku sewaktu lembu melakukan pekerjaan mengirik, tanpa menambahkan objek yang tidak dinyatakan dalam teks Ibrani.
