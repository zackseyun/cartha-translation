  text: זָכ֕וֹר אֵ֛ת אֲשֶׁר עָשָׂ֥ה לְ/ךָ֖ עֲמָלֵ֑ק בַּ/דֶּ֖רֶךְ בְּ/צֵאתְ/כֶ֥ם מִ/מִּצְרָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/017.yaml
  text: Remember what Amalek did to you on the way when you came out from Egypt:[a]
translation:
  language: id
  text: Ingatlah apa yang dilakukan Amalek terhadapmu di jalan ketika kalian keluar dari Mesir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זָכוֹר
  choice: Ingatlah
  rationale: Imperatif Qal tunggal dari זכר. Bentuk “Ingatlah” merupakan perintah langsung yang alami dan bermartabat dalam bahasa Indonesia serta mempertahankan daya perintahnya.
- source_word: אֵת אֲשֶׁר
  choice: apa yang
  rationale: Penanda objek dan partikel relatif ini memperkenalkan isi yang harus diingat; “apa yang” adalah padanan Indonesia yang wajar.
- source_word: עָשָׂה לְךָ
  choice: dilakukan ... terhadapmu
  rationale: עשה dengan ל menunjukkan tindakan yang diarahkan kepada Israel. Dalam konteks permusuhan Amalek, “terhadapmu” menyampaikan arah tindakan secara jelas tanpa menambahkan rincian dari ayat berikutnya.
- source_word: עֲמָלֵק
  choice: Amalek
  rationale: Nama diri ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: בַּדֶּרֶךְ
  choice: di jalan
  rationale: דרך dengan prefiks ב menunjuk pada jalan atau konteks perjalanan. “Di jalan” ringkas dan mempertahankan gambaran sumber.
- source_word: בְּצֵאתְכֶם
  choice: ketika kalian keluar
  rationale: Infinitif konstruk יצא dengan ב menyatakan keadaan temporal. Sufiks orang kedua jamak dipertahankan secara eksplisit dengan “kalian”, berbeda dari bentuk tunggal “-mu” sebelumnya.
- source_word: מִמִּצְרָיִם
  choice: dari Mesir
  rationale: Preposisi מן menyatakan asal. “Keluar dari Mesir” adalah ungkapan baku dan alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Peralihan sumber dari sapaan tunggal pada לְךָ (“terhadapmu”) ke jamak pada בְּצֵאתְכֶם (“kalian keluar”) sengaja dipertahankan. Tanda titik dipakai karena tanda akhir Masoret tidak menuntut titik dua dalam terjemahan.
