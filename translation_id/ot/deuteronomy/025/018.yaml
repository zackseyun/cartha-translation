  text: how he met you on the way and attacked all the stragglers behind you, when you were weary and worn out; and he did not fear God.
translation:
  language: id
  text: bagaimana ia menjumpai engkau di jalan dan menyerang semua orang yang tertinggal di belakangmu ketika engkau letih dan lesu; ia tidak takut kepada Allah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קָרְךָ
  choice: menghadang engkau
  rationale: Dalam konteks serangan Amalek, bentuk ini menyatakan bahwa ia menjumpai atau mendatangi Israel secara bermusuhan; “menghadang” menyampaikan pertemuan yang bersifat menyerang tanpa menambahkan rincian yang tidak ada dalam teks.
- source_word: וַיְזַנֵּב
  choice: menyerang
  rationale: Secara harfiah berkaitan dengan tindakan terhadap bagian ekor atau barisan paling belakang. Karena objek berikutnya sudah menjelaskan orang-orang yang tertinggal di belakang, “menyerang” menghindari ungkapan Indonesia yang janggal sambil mempertahankan tindakan bermusuhan tanpa memastikan bahwa semuanya dibunuh.
- source_word: הַנֶּחֱשָׁלִים
  choice: orang yang tertinggal
  rationale: Menunjuk kepada mereka yang berada atau berjalan paling belakang, kemungkinan karena lemah atau lamban. Pilihan ini mempertahankan fokus posisi mereka tanpa menambahkan alasan yang tidak dinyatakan secara eksplisit.
- source_word: עָיֵף וְיָגֵעַ
  choice: letih dan lesu
  rationale: Dua istilah yang berdekatan tetap dibedakan dengan pasangan alami dalam bahasa Indonesia untuk menyampaikan kelelahan dan kondisi terkuras.
- source_word: וְלֹא יָרֵא אֱלֹהִים
  choice: ia tidak takut kepada Allah
  rationale: Mempertahankan ungkapan teologis Ibrani tentang tidak adanya rasa gentar atau hormat kepada Allah, serta subjek tunggal yang paling wajar merujuk kepada Amalek.
theological_decisions:
- issue: Subjek frasa “tidak takut kepada Allah”
  choice: ia, yaitu Amalek
  alternative: engkau/Israel tidak takut kepada Allah
  rationale: Subjek tersirat paling alami meneruskan subjek tunggal dari verba sebelumnya, yakni Amalek. Namun bahasa Ibrani tidak mengulang nomina subjek; terjemahan tidak menambahkan nama agar struktur teks tetap terjaga.
- issue: Cakupan tindakan terhadap barisan belakang
  choice: menyerang
  alternative: menewaskan atau memusnahkan
  rationale: Verba menggambarkan penyerangan terhadap bagian belakang rombongan, tetapi ayat ini sendiri tidak secara tegas menyatakan hasil berupa kematian semua korbannya.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina “engkau” dipertahankan karena Musa sedang menyapa Israel sebagai satu umat. Struktur klausa mengikuti kesinambungan ayat sebelumnya, sehingga teks dimulai dengan “bagaimana” dan bukan sebagai kalimat mandiri.
