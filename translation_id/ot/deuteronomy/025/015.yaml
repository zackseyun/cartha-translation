review_pass:
  verdict: revise
  source_fidelity: 'Makna pokok diterjemahkan dengan setia: ayat ini menuntut bobot dan takaran yang lengkap serta adil, dan mengaitkannya dengan panjang umur di tanah yang Yahweh, Allah Israel, berikan. Namun, frasa pasif "yang sedang diberikan Yahweh, Allahmu, kepadamu" tidak tepat secara sintaksis dan mengaburkan subjek aktif Ibrani נֹתֵן לָךְ, "yang memberikan kepadamu."'
  naturalness: '"Harus ada padamu" dapat dipahami, tetapi terasa kaku dalam bahasa Indonesia modern. "Hendaklah engkau memiliki" lebih alami sekaligus mempertahankan daya perintah dan pengulangan paralel. "Panjang umurmu" juga kurang idiomatis sebagai predikat; "agar engkau panjang umur" menyampaikan idiom Ibrani secara wajar.'
  terminology: '"Anak timbangan" tepat untuk אֶבֶן dalam konteks niaga, dengan catatan harfiah "batu." "Efa" tepat sebagai transliterasi satuan takaran kering. Untuk צֶדֶק, "adil" lebih jelas daripada "benar" bagi bobot dan takaran, sambil tetap mempertahankan dimensi etis. "Yahweh, Allahmu" benar dan alami.'
  issues:
  - severity: medium
    issue: Klausa relatif terakhir berbentuk pasif dan tidak gramatikal/alamiah.
    rationale: 'Ibrani memakai partisipel aktif נֹתֵן dengan Yahweh sebagai subjek: "yang memberikan kepadamu," bukan "yang sedang diberikan Yahweh ... kepadamu." Revisi memulihkan relasi subjek-objek tanpa memaksakan aspek progresif.'
  - severity: low
    issue: '"Utuh dan benar" kurang idiomatis untuk standar niaga.'
    rationale: שְׁלֵמָה וָצֶדֶק menyatakan bobot/takaran lengkap dan adil. "Lengkap dan adil" lebih lazim serta jelas dalam konteks transaksi.
  - severity: low
    issue: '"Panjang umurmu" canggung sebagai akibat dari "supaya."'
    rationale: Idiom יַאֲרִיכוּ יָמֶיךָ secara alami dapat diterjemahkan "agar engkau panjang umur," tanpa mengurangi makna harfiahnya.
  revised_text: Hendaklah engkau memiliki anak timbangan[a] yang lengkap dan adil; hendaklah engkau memiliki efa[b] yang lengkap dan adil, agar engkau panjang umur di tanah yang diberikan Yahweh, Allahmu, kepadamu.
