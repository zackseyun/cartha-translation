revisions:
- from: Harus ada padamu anak timbangan[a] yang utuh dan benar. Harus ada padamu efa[b] yang utuh dan benar, supaya panjang umurmu di tanah yang sedang diberikan Yahweh, Allahmu, kepadamu.
  to: Hendaklah engkau memiliki anak timbangan[a] yang lengkap dan adil; hendaklah engkau memiliki efa[b] yang lengkap dan adil, agar engkau panjang umur di tanah yang diberikan Yahweh, Allahmu, kepadamu.
  rationale: Revisi memperbaiki klausa akhir agar Yahweh tetap menjadi subjek aktif yang memberikan tanah kepada umat, dan memperhalus diksi hukum-niaga menjadi bahasa Indonesia baku yang lebih alami. Pengulangan perintah, istilah anak timbangan dan efa, nama Yahweh, serta hubungan tujuan/hasil tetap dipertahankan. Catatan kaki pada kedua istilah yang memerlukan penjelasan tetap berjangkar tepat.
