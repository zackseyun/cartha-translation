  variant: modern standard Indonesian
source:
  edition: WLC
  text: אֶ֣בֶן שְׁלֵמָ֤ה וָ/צֶ֨דֶק֙ יִֽהְיֶה לָּ֔/ךְ אֵיפָ֧ה שְׁלֵמָ֛ה וָ/צֶ֖דֶק יִֽהְיֶה לָּ֑/ךְ לְמַ֨עַן֙ יַאֲרִ֣יכוּ יָמֶ֔י/ךָ עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֥ן לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/015.yaml
  text: You shall have a full and just weight; you shall have a full and just ephah[a], so that your days may be long on the land that Yahweh your God is giving you.
translation:
  language: id
  text: Hendaklah engkau memiliki anak timbangan[a] yang lengkap dan adil; hendaklah engkau memiliki efa[b] yang lengkap dan adil, agar engkau panjang umur di tanah yang diberikan Yahweh, Allahmu, kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “batu”, yaitu batu berbobot baku yang digunakan sebagai anak timbangan dalam perdagangan.'
    reason: Menjelaskan citra konkret kata Ibrani אֶבֶן dan fungsi bendanya dalam konteks.
  - marker: b
    text: Efa adalah satuan takaran kering kuno.
    reason: Menjelaskan satuan ukur kuno yang ditransliterasikan.
lexical_decisions:
- source_word: אֶבֶן
  choice: anak timbangan
  rationale: Secara harfiah berarti “batu”, tetapi dalam konteks perdagangan menunjuk pada batu berbobot baku yang dipakai untuk menimbang. “Anak timbangan” menyampaikan fungsi benda itu secara alami dalam bahasa Indonesia, sementara citra konkretnya dicatat dalam catatan kaki.
- source_word: שְׁלֵמָה
  choice: utuh
  rationale: Kata ini menyatakan kelengkapan atau keutuhan. Dalam konteks ukuran, “utuh” menunjukkan bahwa bobot atau takaran itu tidak dikurangi.
- source_word: וָצֶדֶק
  choice: dan benar
  rationale: צֶדֶק mencakup kesesuaian dengan yang benar dan adil. “Benar” cocok untuk standar ukuran sekaligus mempertahankan dimensi moralnya.
- source_word: יִהְיֶה לָּךְ
  choice: harus ada padamu
  rationale: Ungkapan harfiahnya “akan ada bagimu/padamu”, tetapi dalam konteks hukum berfungsi sebagai kewajiban. Bentuk ini mempertahankan susunan Ibrani sambil menyatakan daya wajibnya dengan jelas.
- source_word: אֵיפָה
  choice: efa
  rationale: Efa adalah satuan takaran kering tertentu pada zaman kuno. Transliterasi mempertahankan kekhususan satuan itu; penjelasan diberikan dalam catatan kaki.
- source_word: לְמַעַן
  choice: supaya
  rationale: Kata ini memperkenalkan tujuan atau hasil, yakni hubungan antara ketaatan dan panjang umur di tanah pemberian Allah.
- source_word: יַאֲרִיכוּ יָמֶיךָ
  choice: panjang umurmu
  rationale: Secara harfiah, “hari-harimu menjadi panjang”. Ungkapan Indonesia “panjang umurmu” menyampaikan idiom itu secara alami tanpa mengubah maksudnya.
- source_word: עַל הָאֲדָמָה
  choice: di tanah
  rationale: Dalam konteks Ulangan, אֲדָמָה menunjuk pada tanah tempat Israel akan hidup. “Di tanah” lebih alami dalam bahasa Indonesia daripada padanan kaku “di atas tanah”.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: נֹתֵן לָךְ
  choice: yang sedang diberikan ... kepadamu
  rationale: Partisipel Ibrani menggambarkan pemberian tanah itu sebagai tindakan yang sedang berlangsung atau segera diwujudkan. Bentuk ini mempertahankan nuansa aspek tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama diri perjanjian tanpa menggantinya dengan gelar.
- issue: Hubungan antara ketaatan dan panjang umur
  choice: supaya panjang umurmu
  alternative: maka engkau akan panjang umur
  rationale: לְמַעַן dapat menyatakan tujuan atau hasil. “Supaya” mempertahankan bentuk tujuan/hasil teks tanpa mengubahnya menjadi jaminan mekanis atau menghapus kaitan berkat perjanjian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pengulangan “Harus ada padamu” dipertahankan untuk mencerminkan paralelisme dan tekanan hukum dalam teks Ibrani. Istilah “utuh dan benar” menjaga sekaligus gagasan ukuran yang tidak dikurangi dan tuntutan moral akan kejujuran.
