revisions:
- from: Jika saudara-saudara laki-laki tinggal bersama, lalu salah seorang dari mereka meninggal tanpa mempunyai anak laki-laki,[a] istri orang yang meninggal itu tidak boleh menikah dengan laki-laki di luar keluarga.[b] Saudara laki-laki mendiang suaminya harus menghampirinya sebagai suami,[c] mengambilnya menjadi istrinya, dan menjalankan kewajiban sebagai saudara laki-laki suaminya terhadap dia.[d]
  to: Jika saudara-saudara laki-laki tinggal bersama, lalu salah seorang dari mereka meninggal tanpa mempunyai anak laki-laki,[a] istri orang yang meninggal itu tidak boleh menikah dengan laki-laki di luar keluarga.[b] Saudara laki-laki mendiang suaminya harus mendatangi dia,[c] mengambilnya menjadi istrinya, dan menunaikan kewajiban seorang ipar terhadapnya.[d]
  rationale: Revisi mempertahankan seluruh unsur hukum dan ambiguitas teks sumber, sambil menghapus tambahan “sebagai suami,” memperbaiki kelancaran frasa kewajiban ipar, dan menata ulang catatan agar penjelasan literal serta kulturalnya akurat dan alami.
