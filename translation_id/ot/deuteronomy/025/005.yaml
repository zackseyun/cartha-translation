base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/005.yaml
  text: If brothers dwell together[a], and one of them dies and has no son, the wife of the dead man shall not be married outside the family to a stranger[d][c][b]. Her husband's brother shall go in to her and take her as his wife and perform the duty of a brother-in-law to her.
translation:
  language: id
  text: Jika saudara-saudara laki-laki tinggal bersama, lalu salah seorang dari mereka meninggal tanpa mempunyai anak laki-laki,[a] istri orang yang meninggal itu tidak boleh menikah dengan laki-laki di luar keluarga.[b] Saudara laki-laki mendiang suaminya harus mendatangi dia,[c] mengambilnya menjadi istrinya, dan menunaikan kewajiban seorang ipar terhadapnya.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih luas, “tidak mempunyai anak”; teks Ibrani secara khusus mengatakan “anak laki-laki.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tidak boleh ke luar kepada seorang laki-laki asing.” Maksudnya, ia tidak boleh menikah dengan laki-laki di luar kewajiban keluarga ini. “Asing” di sini tidak harus berarti dari bangsa lain.
    reason: lexical_alternative
  - marker: c
    text: Ungkapan Ibrani “datang kepada dia” merupakan ungkapan halus untuk hubungan seksual dalam perkawinan.
    reason: lexical_alternative
  - marker: d
    text: Kewajiban ini secara tradisional disebut perkawinan ipar atau perkawinan levirat, yaitu kewajiban saudara laki-laki mendiang suami untuk menikahi jandanya.
    reason: cultural_note
lexical_decisions:
- source_word: אַחִים יַחְדָּו
  choice: saudara-saudara laki-laki tinggal bersama
  rationale: אַחִים secara biasa berarti saudara laki-laki, dan konteks hukum ini menuntut peran seorang saudara laki-laki dari orang yang meninggal. יַחְדָּו dipertahankan secara wajar sebagai 'bersama' tanpa menentukan bentuk rumah tangga secara berlebihan.
- source_word: וּבֵן אֵין לוֹ
  choice: tanpa mempunyai anak laki-laki
  rationale: Teks Ibrani secara khusus memakai בֵּן, 'anak laki-laki', bukan istilah umum untuk anak. Terjemahan mempertahankan kekhususan itu dan tidak menyelesaikan cakupan hukum secara interpretatif.
- source_word: אֵשֶׁת הַמֵּת
  choice: istri orang yang meninggal itu
  rationale: Pilihan ini mengikuti konstruksi Ibrani secara dekat. 'Janda' benar secara implisit, tetapi bukan bentuk leksikal yang dipakai dalam sumber.
- source_word: הַחוּצָה לְאִישׁ זָר
  choice: menikah dengan laki-laki di luar keluarga
  rationale: Secara harfiah terdapat gagasan 'ke luar' kepada seorang laki-laki luar. Dalam konteks ini זָר menunjuk orang di luar kewajiban keluarga, bukan orang asing secara etnis. Rumusan Indonesia ini menyampaikan larangan hukum dengan alami.
- source_word: יְבָמָהּ
  choice: saudara laki-laki mendiang suaminya
  rationale: Nomina ini secara khusus menunjuk saudara laki-laki dari suami yang meninggal dalam lembaga perkawinan ini. Bentuk lengkap menghindari ambiguitas istilah 'ipar' dalam bahasa Indonesia.
- source_word: יָבֹא עָלֶיהָ
  choice: menghampirinya sebagai suami
  rationale: Ungkapan Ibrani ini adalah eufemisme bagi hubungan seksual dalam perkawinan. Terjemahan mempertahankan kesantunan dan memperjelas konteks perkawinan tanpa menjadi terlalu eksplisit.
- source_word: וּלְקָחָהּ לוֹ לְאִשָּׁה
  choice: mengambilnya menjadi istrinya
  rationale: Rumusan ini dekat dengan arti harfiah 'mengambil dia bagi dirinya sebagai istri' sekaligus tetap alami dalam bahasa Indonesia.
- source_word: וְיִבְּמָהּ
  choice: menjalankan kewajiban sebagai saudara laki-laki suaminya terhadap dia
  rationale: Verba khusus ini menyatakan pelaksanaan kewajiban perkawinan ipar. Bahasa relasional dipakai dalam teks utama agar dapat dipahami tanpa istilah teknis.
theological_decisions:
- issue: Cakupan syarat וּבֵן אֵין לוֹ
  choice: Mempertahankan 'anak laki-laki' dalam teks utama.
  alternative: Menerjemahkannya secara lebih umum sebagai 'anak' atau 'keturunan'.
  rationale: בֵּן secara leksikal berarti 'anak laki-laki'. Mempertahankan bentuk yang lebih sempit itu menjaga ambiguitas mengenai cakupan hukum dan tidak memasukkan penafsiran yang lebih luas ke dalam teks.
- issue: Penyajian istilah perkawinan ipar
  choice: Menggunakan bahasa relasional dan kewajiban yang mudah dipahami dalam teks utama.
  alternative: Memakai istilah teknis 'perkawinan levirat' dalam teks utama.
  rationale: Bahasa biasa mempertahankan daya hukum ayat bagi pembaca modern, sementara istilah teknis dapat dijelaskan dalam catatan tanpa membebani teks.
- issue: Makna ungkapan יָבֹא עָלֶיהָ
  choice: Menerjemahkan secara santun sebagai 'menghampirinya sebagai suami'.
  alternative: Menerjemahkan secara harfiah 'datang kepada dia' atau secara eksplisit 'bersetubuh dengan dia'.
  rationale: Ungkapan sumber merupakan eufemisme seksual dalam konteks perkawinan. Pilihan ini menjaga kesantunan sumber serta memberi cukup kejelasan tanpa menghapus nuansa idiomatisnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang wajar, bermartabat, dan mudah dipahami. 'Saudara laki-laki mendiang suaminya' dipilih daripada 'iparnya' agar hubungan yang dimaksud tidak ambigu. Istilah teknis 'levirat' ditempatkan dalam catatan kaki, bukan teks utama.
