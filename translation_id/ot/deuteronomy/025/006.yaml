  yaml_path: translation/ot/deuteronomy/025/006.yaml
  text: And it shall be that the firstborn whom she bears shall rise up in the name of his dead brother[a], so that his name may not be blotted out from Israel.
translation:
  language: id
  text: Anak sulung yang dilahirkannya harus meneruskan nama saudara laki-laki suaminya yang telah meninggal[a], supaya nama orang yang meninggal itu tidak terhapus dari Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “harus berdiri di atas nama saudara laki-laki suaminya yang telah meninggal”; maksudnya, ia akan melanjutkan garis keturunan dan kedudukan saudaranya itu di tengah Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבְּכוֹר
  choice: anak sulung
  rationale: Ungkapan ini mempertahankan kedudukan hukum dan kekeluargaan anak laki-laki pertama dalam konteks perkawinan levirat; konteks ayat menunjukkan bahwa yang dimaksud ialah anak yang meneruskan garis keturunan.
- source_word: אֲשֶׁר תֵּלֵד
  choice: yang dilahirkannya
  rationale: Akhiran -nya secara alami merujuk kepada janda yang disebut dalam konteks sebelumnya dan mempertahankan subjek feminin dari verba Ibrani.
- source_word: יָקוּם עַל שֵׁם
  choice: harus meneruskan nama
  rationale: Idiom hukum ini menyatakan kelanjutan nama, garis keturunan, dan kedudukan saudara yang meninggal, bukan semata-mata pemberian nama pribadi yang sama. Kata 'harus' sesuai dengan daya normatif bentuk verbal dalam ketentuan hukum ini.
- source_word: אָחִיו הַמֵּת
  choice: saudara laki-lakinya yang telah meninggal
  rationale: Terjemahan ini jelas dan wajar dalam bahasa Indonesia serta mempertahankan hubungan persaudaraan laki-laki yang ditandai konteks.
- source_word: יִמָּחֶה
  choice: terhapus
  rationale: Bentuk pasif verba מחה menggambarkan nama yang dihapus atau dilenyapkan dari ingatan dan keberadaan komunal; 'terhapus' mempertahankan citra tersebut dengan bahasa yang alami.
- source_word: מִיִּשְׂרָאֵל
  choice: dari Israel
  rationale: Preposisi מן menandai penyingkiran dari umat atau komunitas Israel; 'dari Israel' merupakan padanan langsung dan idiomatis.
theological_decisions:
- issue: Makna rumusan levirat יָקוּם עַל שֵׁם אָחִיו הַמֵּת
  choice: Anak itu meneruskan nama dan garis saudara yang meninggal.
  alternative: Anak itu secara harfiah diberi nama pribadi saudara yang meninggal.
  rationale: Dalam konteks hukum ini, idiom tersebut berhubungan dengan pelestarian garis keturunan, kedudukan keluarga, dan kenangan orang yang meninggal di tengah Israel. Terjemahan tidak membatasi maknanya pada pemberian nama pribadi yang sama.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang bermartabat. Susunan kalimat dibuat jelas bagi pembaca umum, sementara catatan kaki mempertahankan bentuk harfiah idiom Ibrani dan ambiguitas cakupan maknanya.
