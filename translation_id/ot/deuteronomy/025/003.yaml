base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/003.yaml
  text: He may strike him forty times[a], but no more[b], lest he go on to strike him with many more blows than these and your brother be degraded before your eyes.
translation:
  language: id
  text: Ia boleh memukulnya empat puluh kali[a], tetapi tidak lebih. Jangan sampai ia terus memukulnya lebih dari itu secara berlebihan, sehingga saudaramu menjadi hina di depan matamu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “empat puluh cambukan” atau “empat puluh pukulan”. Teks Ibrani menyebut angka empat puluh, tetapi di sini tidak menyebut alat atau bentuk tepat setiap pukulan.
    reason: lexical_alternative
  - marker: b
    text: “Saudaramu” di sini berarti sesama anggota komunitas perjanjian. Hukum ini membatasi hukuman agar orang itu tidak diperlakukan sebagai orang yang hina.
    reason: cultural_note
lexical_decisions:
- source_word: אַרְבָּעִים יַכֶּנּוּ
  choice: Ia boleh memukulnya empat puluh kali
  rationale: Angka empat puluh dipertahankan sebagai batas hukuman jasmani. Kata "kali" menghitung tindakan memukul tanpa menentukan alat atau bentuk pukulannya, sedangkan "boleh" menyatakan tindakan yudisial yang diizinkan sekaligus dibatasi oleh konteks hukum.
- source_word: לֹא יֹסִיף
  choice: tetapi tidak lebih
  rationale: Secara harfiah berarti "tidak menambah"; ungkapan ini secara alami dan jelas melarang pelampauan batas empat puluh.
- source_word: פֶּן יֹסִיף לְהַכֹּתוֹ
  choice: Jangan sampai ia terus memukulnya
  rationale: פֶּן menyatakan akibat yang harus dicegah, sedangkan יסף dengan infinitif menyatakan penambahan atau kelanjutan tindakan.
- source_word: עַל אֵלֶּה מַכָּה רַבָּה
  choice: melampaui jumlah itu dengan banyak pukulan
  rationale: עַל אֵלֶּה menunjuk pada jumlah yang baru disebutkan. מַכָּה רַבָּה berbentuk tunggal kolektif dan dalam konteks ini menggambarkan pemukulan berlebihan; terjemahan ini mempertahankan kaitannya dengan pelampauan jumlah.
- source_word: וְנִקְלָה
  choice: menjadi hina
  rationale: Bentuk Nifal dari קלה menyatakan bahwa orang itu direndahkan atau dipandang hina. Pilihan ini mempertahankan perhatian teks terhadap martabatnya tanpa membatasinya pada perasaan malu batiniah.
- source_word: אָחִיךָ
  choice: saudaramu
  rationale: 'Terjemahan harfiah ini mempertahankan bahasa kekerabatan perjanjian dan daya etisnya: orang yang dihukum tetap seorang saudara dalam komunitas.'
- source_word: לְעֵינֶיךָ
  choice: di depan matamu
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan gambaran bahwa penghinaan tersebut berlangsung secara terbuka dalam pandangan umat.
theological_decisions:
- issue: Istilah kekerabatan perjanjian dalam konteks hukum
  choice: saudaramu
  alternative: sesama orang Israel; sesamamu
  rationale: Teks Ibrani menyebut pelanggar itu "saudaramu", sehingga status dan martabatnya sebagai anggota komunitas tetap berlaku meskipun ia dihukum. Istilah kekeluargaan dipertahankan dan tidak dinetralkan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang lugas dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan angka, peringatan, serta istilah kekerabatan dalam teks Ibrani.
