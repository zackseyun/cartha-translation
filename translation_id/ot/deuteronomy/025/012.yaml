translation:
  language: id
  text: Engkau harus memotong tangannya[a]. Matamu jangan merasa iba[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “telapak tangannya.” Kata Ibrani ini dapat secara khusus menunjuk pada telapak tangan, tetapi juga dapat berarti tangan.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Matamu jangan mengasihani.” Ungkapan Ibrani ini secara harfiah menyebut mata untuk menyatakan larangan merasa iba atau menahan hukuman karena belas kasihan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקַצֹּתָה
  choice: maka haruslah engkau memotong
  rationale: Bentuk dari קצץ menyatakan tindakan tegas untuk memotong hingga terpisah. Frasa ini mempertahankan kekonkretan dan daya hukum perintah Ibrani tanpa memperhalusnya.
- source_word: אֶת
  choice: '[penanda objek langsung, tidak diterjemahkan]'
  rationale: Penanda objek langsung bahasa Ibrani tidak memiliki padanan tersendiri dalam bahasa Indonesia.
- source_word: כַּפָּהּ
  choice: tangannya
  rationale: כַּף dapat berarti telapak tangan atau tangan. Dalam konteks tindakan memotong sebagai hukuman, 'tangan' merupakan ungkapan Indonesia yang lebih wajar, sementara alternatif leksikalnya tetap dicatat.
- source_word: לֹא
  choice: janganlah
  rationale: Negasi ini bersama bentuk verbal berikutnya berfungsi sebagai larangan langsung.
- source_word: תָחוֹס
  choice: merasa iba
  rationale: חוס dapat berarti merasa iba, mengasihani, atau menyayangkan sehingga menahan tindakan. 'Merasa iba' cocok dengan subjek harfiah 'matamu' dan mempertahankan citra idiom Ibrani.
- source_word: עֵינֶךָ
  choice: matamu
  rationale: Terjemahan mempertahankan penyebutan mata secara harfiah sebagai bagian dari rumusan hukum khas dalam kitab Ulangan, alih-alih meratakannya menjadi 'engkau'.
theological_decisions:
- issue: Keharﬁahan rumusan hukuman
  choice: Mempertahankan perintah konkret 'memotong tangannya' dan idiom 'Janganlah matamu merasa iba.'
  alternative: Menerjemahkan secara lebih dinamis sebagai 'potonglah tangannya dan jangan kasihan kepadanya.'
  rationale: Teks sumber menyampaikan ketentuan hukum secara langsung dan memakai citra mata dalam larangan berbelas kasihan. Terjemahan mempertahankan ketegasan serta bentuk ungkapan itu tanpa menambahkan penafsiran atau melunakkan hukum.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'haruslah engkau' mempertahankan nada hukum yang tegas; 'matamu merasa iba' sengaja mempertahankan idiom sumber meskipun sedikit lebih formal daripada percakapan sehari-hari. Penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
