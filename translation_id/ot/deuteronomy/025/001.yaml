  text: כִּֽי יִהְיֶ֥ה רִיב֙ בֵּ֣ין אֲנָשִׁ֔ים וְ/נִגְּשׁ֥וּ אֶל הַ/מִּשְׁפָּ֖ט וּ/שְׁפָט֑וּ/ם וְ/הִצְדִּ֨יקוּ֙ אֶת הַ/צַּדִּ֔יק וְ/הִרְשִׁ֖יעוּ אֶת הָ/רָשָֽׁע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/001.yaml
  text: If there is a dispute between men[a], and they come to court, and the judges decide between them, then they shall acquit the righteous and condemn the wicked[c][b],
translation:
  language: id
  text: Jika terjadi perselisihan antara beberapa laki-laki[a], dan mereka datang ke pengadilan[b], lalu para hakim mengadili perkara mereka, para hakim harus membebaskan orang yang benar dan menyatakan orang yang bersalah bersalah[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ketika terjadi perselisihan antara beberapa laki-laki.”
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “kepada penghakiman”; maksudnya, kepada proses peradilan atau ke pengadilan.
    reason: lexical_alternative
  - marker: c
    text: 'Ungkapan Ibrani memakai istilah putusan pengadilan: secara harfiah, “menyatakan benar orang yang benar dan menyatakan bersalah orang yang bersalah.” Dalam konteks ini, istilah-istilah tersebut menunjuk pada putusan dalam perkara, bukan pada perubahan moral seseorang.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִהְיֶה
  choice: Jika terjadi
  rationale: Dalam rumusan hukum kasuistik, frasa ini memperkenalkan suatu keadaan bersyarat. “Jika terjadi” alami dalam bahasa hukum Indonesia, sedangkan “ketika terjadi” juga mungkin.
- source_word: רִיב
  choice: perselisihan
  rationale: Dalam konteks hukum, kata ini menunjuk pada sengketa atau perkara antara pihak-pihak. “Perselisihan” jelas dan tidak terlalu teknis.
- source_word: בֵּין אֲנָשִׁים
  choice: antara beberapa laki-laki
  rationale: Bentuk Ibrani adalah jamak maskulin dan dalam konteks ini menunjuk kepada para pihak laki-laki. “Beberapa” menghindari penambahan jumlah tepat yang tidak dinyatakan teks.
- source_word: וְנִגְּשׁוּ אֶל הַמִּשְׁפָּט
  choice: lalu mereka datang ke pengadilan
  rationale: Secara harfiah mereka mendekat “kepada penghakiman”; dalam konteks ini maksudnya memasuki proses peradilan atau datang ke pengadilan.
- source_word: וּשְׁפָטוּם
  choice: dan para hakim mengadili perkara mereka
  rationale: Bentuk Ibrani secara harfiah berarti “dan mereka mengadili mereka.” Subjek tersirat dipahami sebagai para hakim; “mengadili perkara mereka” merupakan ungkapan Indonesia yang alami dan menghindari ambiguitas pronomina.
- source_word: וְהִצְדִּיקוּ אֶת הַצַּדִּיק
  choice: para hakim harus menyatakan pihak yang benar tidak bersalah
  rationale: Dalam konteks peradilan, bentuk kausatif צדק berarti memberikan putusan bahwa seseorang berada di pihak yang benar atau tidak bersalah, bukan menjadikannya benar secara moral.
- source_word: וְהִרְשִׁיעוּ אֶת הָרָשָׁע
  choice: dan pihak yang bersalah bersalah
  rationale: Bentuk kausatif רשע berarti menyatakan bersalah. Pengulangan “bersalah” mempertahankan hubungan antara karakterisasi pihak dan putusan pengadilan, meskipun dijelaskan dalam catatan kaki agar nuansa yudisialnya terang.
theological_decisions:
- issue: Makna forensik atau moral dari צדק dan רשע dalam konteks hukum
  choice: 'Putusan yudisial: menyatakan pihak yang benar tidak bersalah dan pihak yang bersalah bersalah'
  alternative: Gambaran moral umum tentang orang benar dan orang fasik
  rationale: Konteks langsungnya adalah proses pengadilan dan tindakan para hakim. Karena itu, kata-kata tersebut terutama menyatakan kedudukan para pihak dalam perkara ini, tanpa meniadakan resonansi moral istilah Ibraninya atau memasukkan kategori doktrinal yang lebih kemudian.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Istilah “pengadilan”, “mengadili perkara”, dan “menyatakan ... tidak bersalah/bersalah” menjaga latar yudisial. Pengulangan subjek “para hakim” dipakai untuk kejernihan. Semua penanda catatan kaki ditempatkan dalam teks utama.
