base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/008.yaml
  text: Then the elders of his city shall call him and speak to him[a], and if he stands and says, “I do not desire to take her,”
translation:
  language: id
  text: Kemudian para tua-tua kotanya harus memanggilnya dan berbicara kepadanya. Jika ia tetap pada pendiriannya dan berkata, “Aku tidak mau mengambilnya,”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mengambilnya.” Dalam konteks ini, ungkapan Ibrani tersebut lazim berarti mengambil seorang perempuan dalam pernikahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרְאוּ
  choice: harus memanggil
  rationale: Dalam konteks hukum, bentuk ini menyatakan tahap prosedural yang wajib dilakukan; “harus memanggil” alami dan jelas dalam bahasa Indonesia.
- source_word: זִקְנֵי עִירוֹ
  choice: para tua-tua kotanya
  rationale: Istilah ini menunjuk para pemimpin sipil masyarakat. “Para tua-tua” mempertahankan istilah kelembagaan Alkitab yang sudah dikenal, sedangkan “kotanya” menerjemahkan hubungan posesif secara ringkas.
- source_word: וְדִבְּרוּ אֵלָיו
  choice: dan berbicara kepadanya
  rationale: Menerjemahkan tindakan berbicara yang ditujukan langsung kepada orang itu tanpa menambahkan isi atau tujuan yang tidak dinyatakan.
- source_word: וְעָמַד
  choice: Jika ia tetap pada pendiriannya
  rationale: Secara harfiah berarti “dan ia berdiri,” tetapi dalam prosedur hukum ini tampaknya menyatakan bahwa ia bertahan dalam penolakannya sesudah ditegur para tua-tua. Ungkapan Indonesia ini menyampaikan fungsi idiomatisnya secara alami.
- source_word: וְאָמַר
  choice: dan berkata
  rationale: Padanan langsung dan wajar untuk verba ujaran sederhana dalam rangkaian tindakan.
- source_word: לֹא חָפַצְתִּי
  choice: Aku tidak mau
  rationale: חפץ dapat menyatakan keinginan atau kesediaan. Dalam ujaran penolakan ini, “tidak mau” merupakan bahasa Indonesia alami tanpa membatasi maknanya pada perasaan senang saja.
- source_word: לְקַחְתָּהּ
  choice: mengambil perempuan itu sebagai istri
  rationale: לקח dengan objek seorang perempuan lazim berfungsi sebagai idiom perkawinan. Padanan eksplisit ini menghindari kesan mengambil secara fisik dan menjelaskan acuan pronomina feminin secara alami.
theological_decisions:
- issue: Makna tindakan laki-laki itu terhadap janda saudara lelakinya
  choice: mengambil perempuan itu sebagai istri
  alternative: mengambil dia
  rationale: Konteks hukum perkawinan ipar menunjukkan bahwa tindakan yang dimaksud ialah menikahinya. Ini merupakan penjelasan idiom Ibrani, bukan penambahan ajaran denominasi.
translation_notes:
  register: Bahasa hukum-naratif yang modern, jelas, dan bermartabat. “Para tua-tua” dipertahankan sebagai sebutan kelembagaan. Kalimat langsung memakai ragam alami “Aku tidak mau.”
