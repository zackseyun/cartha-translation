review_pass:
  verdict: revise
  source_fidelity: Draf pada dasarnya mengikuti struktur dan makna Ibrani dengan baik, termasuk nama Yahweh, cakupan musuh, citra “dari kolong langit,” dan larangan penutup yang singkat. Namun, “yang diberikan” menggeser partisip Ibrani נֹתֵן (“yang memberikan/memberi”) menjadi bentuk pasif yang lebih selesai, dan “untuk kamu duduki” dapat lebih sempit atau bernuansa pendudukan daripada ירשׁ, “memiliki/menguasai sebagai milik.”
  naturalness: Bahasanya umumnya modern dan khidmat. “Memberimu” lebih alami daripada “memberi kamu,” sedangkan “untuk kamu miliki” menyampaikan maksud kepemilikan tanah tanpa konotasi yang mungkin timbul dari “duduki.”
  terminology: “Yahweh,” “Allahmu,” “milik pusaka,” “Amalek,” dan “kolong langit” tepat serta konsisten dengan register terjemahan. Catatan kaki perlu dibatasi pada alternatif leksikal yang benar-benar didukung audit bahasa Inggris; penjelasan mengenai “nama atau peninggalan” melampaui alternatif yang disediakan dan berpotensi terlalu menafsirkan זֵכֶר.
  issues:
  - severity: medium
    issue: Aspek pemberian tanah dan arti ירשׁ perlu diperjelas.
    rationale: “Yang diberikan” menyajikan pemberian sebagai tindakan pasif/selesai, sedangkan נֹתֵן adalah partisip aktif. “Duduki” dapat menyiratkan sekadar tinggal atau pendudukan; dalam konteks ini ירשׁ terutama menyatakan memperoleh atau memiliki tanah.
  - severity: low
    issue: Catatan kaki memperluas alternatif leksikal secara spekulatif.
    rationale: Audit sumber hanya menyediakan alternatif “memory of Amalek.” Tambahan “nama atau peninggalan” bukan diperlukan untuk menerjemahkan ayat dan dapat mengarahkan pembaca kepada penafsiran tertentu.
  revised_text: Ketika Yahweh, Allahmu, memberimu ketenteraman dari semua musuh di sekelilingmu, di negeri yang Yahweh, Allahmu, berikan kepadamu sebagai milik pusaka untuk kamu miliki, kamu harus menghapus kenangan akan Amalek[a] dari kolong langit. Jangan lupa.
  revised_footnotes:
