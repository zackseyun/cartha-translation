- from: Ketika Yahweh, Allahmu, memberi kamu ketenteraman dari semua musuh di sekelilingmu, di negeri yang diberikan Yahweh, Allahmu, kepadamu sebagai milik pusaka untuk kamu duduki, kamu harus menghapus kenangan tentang Amalek[a] dari kolong langit. Jangan lupa.
  to: Ketika Yahweh, Allahmu, memberimu ketenteraman dari semua musuh di sekelilingmu, di negeri yang Yahweh, Allahmu, berikan kepadamu sebagai milik pusaka untuk kamu miliki, kamu harus menghapus kenangan akan Amalek[a] dari kolong langit. Jangan lupa.
  rationale: Revisi mempertahankan susunan temporal dan perintah dalam teks Ibrani, memakai bentuk aktif yang lebih dekat dengan נֹתֵן, dan menerjemahkan לְרִשְׁתָּהּ dengan ungkapan kepemilikan yang lebih tepat. Catatan kaki dipersempit menjadi alternatif leksikal yang aman dan selaras dengan audit sumber.
