  text: וְ/הָיָ֡ה בְּ/הָנִ֣יחַ יְהוָ֣ה אֱלֹהֶ֣י/ךָ לְ֠/ךָ מִ/כָּל אֹ֨יְבֶ֜י/ךָ מִ/סָּבִ֗יב בָּ/אָ֨רֶץ֙ אֲשֶׁ֣ר יְהוָֽה אֱ֠לֹהֶי/ךָ נֹתֵ֨ן לְ/ךָ֤ נַחֲלָה֙ לְ/רִשְׁתָּ֔/הּ תִּמְחֶה֙ אֶת זֵ֣כֶר עֲמָלֵ֔ק מִ/תַּ֖חַת הַ/שָּׁמָ֑יִם לֹ֖א תִּשְׁכָּֽח׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/019.yaml
  text: And when Yahweh your God gives you rest from all your enemies around you[a], in the land that Yahweh your God is giving you as an inheritance to possess, you shall blot out the remembrance of Amalek from under heaven. Do not forget.
translation:
  language: id
  text: Ketika Yahweh, Allahmu, memberimu ketenteraman dari semua musuh di sekelilingmu, di negeri yang Yahweh, Allahmu, berikan kepadamu sebagai milik pusaka untuk kamu miliki, kamu harus menghapus kenangan akan Amalek[a] dari kolong langit. Jangan lupa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ingatan akan Amalek.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Ketika
  rationale: Ungkapan ini memperkenalkan keadaan pada masa mendatang yang menjadi latar bagi perintah; “ketika” menyampaikan fungsi temporalnya secara alami.
- source_word: בְּהָנִיחַ
  choice: memberi kamu ketenteraman
  rationale: Bentuk kausatif dari נוח menyatakan bahwa Yahweh membuat Israel mengalami keadaan tenteram atau bebas dari ancaman musuh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: מִכָּל אֹיְבֶיךָ מִסָּבִיב
  choice: dari semua musuh di sekelilingmu
  rationale: Terjemahan ini mempertahankan cakupan “semua” dan unsur ruang “di sekelilingmu”.
- source_word: בָּאָרֶץ אֲשֶׁר ... נֹתֵן לְךָ
  choice: di negeri yang diberikan ... kepadamu
  rationale: Partisip נֹתֵן menggambarkan tindakan pemberian yang sedang berlangsung atau pasti dalam rencana Yahweh; bentuk Indonesia ini tetap alami dalam konteks masa depan.
- source_word: נַחֲלָה
  choice: sebagai milik pusaka
  rationale: “Milik pusaka” mempertahankan nuansa tanah perjanjian yang diberikan sebagai warisan tetap kepada Israel.
- source_word: לְרִשְׁתָּהּ
  choice: untuk kamu duduki
  rationale: Dalam konteks tanah, ירשׁ menunjuk pada mengambil dan menetap dalam kepemilikan; “duduki” ringkas dan wajar.
- source_word: תִּמְחֶה
  choice: kamu harus menghapus
  rationale: מחה berarti menghapus atau melenyapkan. “Harus” menyampaikan daya perintah tanpa membuat kalimat kaku.
- source_word: זֵכֶר
  choice: kenangan
  rationale: Kata ini menunjuk pada ingatan, kenangan, atau sesuatu yang membuat nama seseorang tetap dikenang; “kenangan” mempertahankan keluasan makna dasarnya.
- source_word: עֲמָלֵק
  choice: Amalek
  rationale: Nama diri ditransliterasikan secara lazim.
- source_word: מִתַּחַת הַשָּׁמָיִם
  choice: dari kolong langit
  rationale: Ungkapan ini mempertahankan citra idiom Ibrani dan cakupan menyeluruhnya.
- source_word: לֹא תִּשְׁכָּח
  choice: Jangan lupa
  rationale: Larangan langsung ini singkat, tegas, dan mempertahankan permainan gagasan antara menghapus kenangan Amalek dan kewajiban Israel untuk tidak lupa.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian ilahi secara langsung; transliterasi “Yahweh” mempertahankannya sebagai nama diri.
- issue: Ketegangan antara menghapus kenangan Amalek dan perintah untuk tidak lupa
  choice: Mempertahankan kedua pernyataan secara langsung tanpa menjelaskan objek “jangan lupa” di dalam teks
  alternative: Menambahkan “jangan lupa melakukan hal ini”
  rationale: Teks Ibrani sengaja singkat dan tidak menyatakan objek eksplisit bagi “jangan lupa”; penambahan objek akan mempersempit ambiguitas retorisnya.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Sapaan orang kedua tunggal dipertahankan melalui bentuk “-mu” dan “kamu”, sesuai teks Ibrani yang berbicara kepada Israel sebagai satu kesatuan.
