  yaml_path: translation/ot/deuteronomy/025/014.yaml
  text: You shall not have in your house an ephah and an ephah[a], a large and a small.
translation:
  language: id
  text: Di rumahmu jangan ada dua efa[a], yang satu besar dan yang lain kecil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Efa adalah satuan takaran kuno orang Ibrani untuk bahan kering.
    reason: cultural_note
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: jangan ada
  rationale: Konstruksi harfiah 'tidak boleh ada bagimu' menyatakan larangan memiliki; 'jangan ada' alami dalam bahasa hukum Indonesia dan tetap mempertahankan daya larang.
- source_word: בְּבֵיתְךָ
  choice: di rumahmu
  rationale: בַּיִת di sini menunjuk tempat fisik penyimpanan alat takar, sehingga 'rumahmu' lebih tepat daripada 'rumah tanggamu'.
- source_word: אֵיפָה וְאֵיפָה
  choice: dua efa
  rationale: Pengulangan Ibrani berarti dua takaran efa yang berbeda. 'Dua efa' menyampaikan maksud itu secara wajar sambil mempertahankan nama satuan kuno; catatan kaki menjelaskannya.
- source_word: גְּדוֹלָה וּקְטַנָּה
  choice: yang satu besar dan yang lain kecil
  rationale: Rumusan ini menjelaskan bahwa kedua takaran efa tersebut berbeda ukurannya dan menyampaikan kontras ringkas dalam teks Ibrani secara alami.
