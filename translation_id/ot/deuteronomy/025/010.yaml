  text: And his name shall be called in Israel[a], ‘The house of him whose sandal was removed.’
translation:
  language: id
  text: Dan namanya akan disebut di Israel, “Keluarga orang yang sandalnya ditanggalkan.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “Rumah sandal yang ditanggalkan.” Bahasa Ibrani memakai julukan ritual yang sangat padat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקְרָא
  choice: ia akan disebut
  rationale: Bentuk Nifal dari קרא menyatakan penamaan secara pasif. Ungkapan ini alami dalam bahasa Indonesia dan tetap mempertahankan corak ketetapan hukum.
- source_word: שְׁמוֹ
  choice: ia akan disebut
  rationale: Secara harfiah berarti 'namanya akan disebut', tetapi dalam bahasa Indonesia formula penamaan lebih wajar diungkapkan 'ia akan disebut' tanpa mengubah maknanya.
- source_word: בְּיִשְׂרָאֵל
  choice: di Israel
  rationale: Preposisi ב menunjukkan lingkungan sosial tempat sebutan tersebut berlaku; 'di Israel' merupakan padanan yang alami dan tepat.
- source_word: בֵּית
  choice: Keluarga
  rationale: Dalam nama celaan ini, בֵּית menunjuk pada rumah tangga atau garis keluarga, bukan semata-mata bangunan. 'Keluarga' menyampaikan maksud itu dengan jelas dalam bahasa Indonesia modern.
- source_word: חֲלוּץ הַנָּעַל
  choice: orang yang sandalnya ditanggalkan
  rationale: Frasa ini secara padat menunjuk kepada orang yang dikenai tindakan pelepasan sandal dalam upacara penolakan perkawinan ipar. Terjemahan ini mempertahankan bentuk pasif dan kaitannya dengan ritual tersebut.
