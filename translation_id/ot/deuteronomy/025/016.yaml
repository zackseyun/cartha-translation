  rationale: Memperkenalkan alasan bagi larangan sebelumnya dan mempertahankan hubungan penjelas antarayat.
- source_word: תוֹעֲבַת
  choice: sesuatu yang menjijikkan
  rationale: Menyampaikan penolakan moral yang sangat kuat di hadapan Allah dengan bahasa Indonesia yang alami dan jelas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Mewakili nomina dengan sufiks orang kedua maskulin tunggal secara ringkas dan alami.
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: setiap orang yang melakukan semuanya ini
  rationale: Mempertahankan daya distributif כָּל dan konstruksi partisipial yang menunjuk pada suatu golongan umum.
- source_word: כֹּל עֹשֵׂה עָוֶל
  choice: setiap orang yang berbuat tidak adil
  rationale: Mempertahankan pengulangan 'setiap orang yang berbuat/melakukan' serta cakupan etis עָוֶל, tanpa membatasinya hanya pada satu bentuk kecurangan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung; bentuk 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Kekuatan moral תוֹעֵבָה
  choice: sesuatu yang menjijikkan bagi Yahweh
  alternative: kekejian bagi Yahweh
  rationale: Pilihan ini mempertahankan kuatnya penolakan ilahi tanpa memakai ungkapan Indonesia yang terasa kaku atau kurang umum.
