  yaml_path: translation/ot/deuteronomy/025/013.yaml
  text: You shall not have in your bag differing weights[a], a large and a small.
translation:
  language: id
  text: Jangan ada dalam kantongmu dua macam batu timbangan[a], yang besar dan yang kecil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “sebuah batu dan sebuah batu,” yaitu batu berbobot tertentu yang digunakan sebagai standar untuk menimbang dalam perdagangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא יִהְיֶה לְךָ
  choice: Jangan ada ... padamu (diungkapkan secara alami sebagai “Jangan ada dalam kantongmu”)
  rationale: Konstruksi harfiahnya berarti “tidak boleh ada bagimu,” tetapi dalam bahasa Indonesia larangan kepemilikan ini paling alami dinyatakan dengan “Jangan ada dalam kantongmu.”
- source_word: בְּכִיסְךָ
  choice: dalam kantongmu
  rationale: כִּיס adalah kantong atau pundi tempat membawa uang atau batu timbangan. “Kantong” jelas, modern, dan sesuai dengan konteks perdagangan.
- source_word: אֶבֶן וָאָבֶן
  choice: dua macam batu timbangan
  rationale: Secara harfiah ungkapan ini berbunyi “sebuah batu dan sebuah batu,” tetapi yang dimaksud ialah batu-batu berbobot berbeda yang dipakai sebagai standar timbangan. “Dua macam batu timbangan” menyampaikan idiom perdagangan itu tanpa menghilangkan bentuk pasangannya.
- source_word: גְּדוֹלָה וּקְטַנָּה
  choice: yang besar dan yang kecil
  rationale: Kedua kata sifat feminin ini menerangkan pasangan batu timbangan yang tersirat dan mempertahankan kontras langsung dalam teks Ibrani.
