base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/025/002.yaml
  text: then[a], if the wicked man deserves to be beaten, the judge shall make him lie down and have him beaten before him, according to his wickedness, by number.
translation:
  language: id
  text: maka, jika orang yang bersalah itu patut dipukul, hakim harus menyuruhnya berbaring dan memerintahkan agar ia dipukul di hadapannya, menurut kesalahannya, dengan jumlah pukulan yang dihitung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menurut kesalahannya, dengan hitungan”; yakni, pukulan diberikan dalam jumlah yang dihitung dan sebanding dengan pelanggaran.
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּן הַכּוֹת
  choice: patut dipukul
  rationale: Ungkapan harfiah 'anak pukulan' merupakan idiom hukum bagi orang yang layak atau wajib menerima hukuman pukulan. 'Patut dipukul' menyampaikan makna itu secara alami dan ringkas.
- source_word: הָרָשָׁע
  choice: orang yang bersalah
  rationale: Dalam konteks pengadilan, bentuk substantival ini menunjuk kepada pihak yang telah dinyatakan bersalah. Pilihan ini mempertahankan daya hukum istilah tanpa menambahkan penilaian karakter yang lebih luas daripada konteksnya.
- source_word: וְהִפִּילוֹ
  choice: harus menyuruhnya berbaring
  rationale: Bentuk kausatif dari נפל di sini berarti membuat terhukum mengambil posisi berbaring untuk menerima hukuman.
- source_word: הַשֹּׁפֵט
  choice: hakim
  rationale: Padanan baku bagi pejabat pengadilan dalam konteks ini.
- source_word: וְהִכָּהוּ
  choice: menyuruh orang memukulnya
  rationale: Secara leksikal berarti 'memukul dia', tetapi rangkaian prosedural menempatkan hakim sebagai pengawas atau pemberi perintah. Rumusan ini menghindari kesan yang tidak pasti bahwa hakim sendiri wajib melaksanakan pukulan.
- source_word: לְפָנָיו
  choice: di hadapannya
  rationale: Padanan dekat dan alami yang menunjukkan bahwa hukuman berlangsung di depan hakim, di bawah pengawasannya.
- source_word: כְּדֵי רִשְׁעָתוֹ
  choice: sebanding dengan kesalahannya
  rationale: כְּדֵי menyatakan ukuran atau kecukupan, sedangkan רִשְׁעָתוֹ dalam konteks hukum menunjuk pada kesalahannya. Rumusan ini menampilkan asas kesebandingan hukuman dengan pelanggaran.
- source_word: בְּמִסְפָּר
  choice: jumlah pukulan itu
  rationale: Frasa Ibrani yang ringkas menuntut pukulan yang dihitung. Dalam bahasa Indonesia, penyebutan eksplisit 'jumlah pukulan' memperjelas acuan tanpa melampaui konteks ayat berikutnya.
theological_decisions:
- issue: Makna הָרָשָׁע dalam konteks yudisial
  choice: orang yang bersalah
  alternative: orang fasik
  rationale: Konteks persidangan menekankan status hukum pihak yang kalah atau dinyatakan bersalah. 'Orang yang bersalah' tidak meniadakan nuansa moral, tetapi menghindari perluasan menjadi label watak menyeluruh.
- issue: Pelaksana hukuman dalam וְהִכָּהוּ
  choice: hakim menyuruh orang memukulnya
  alternative: hakim memukulnya
  rationale: Subjek gramatikal tetap hakim, tetapi konstruksi prosedural dapat menyatakan tindakan yang diperintahkan olehnya. Terjemahan tidak menetapkan bahwa hakim harus memukul dengan tangannya sendiri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur dipecah menjadi dua kalimat agar ketentuan hukum mudah dipahami, sambil mempertahankan urutan tindakan dan gagasan bahwa hukuman diberikan di hadapan hakim.
