  text: עֲלֵ֣ה רֹ֣אשׁ הַ/פִּסְגָּ֗ה וְ/שָׂ֥א עֵינֶ֛י/ךָ יָ֧מָּ/ה וְ/צָפֹ֛נָ/ה וְ/תֵימָ֥נָ/ה וּ/מִזְרָ֖חָ/ה וּ/רְאֵ֣ה בְ/עֵינֶ֑י/ךָ כִּי לֹ֥א תַעֲבֹ֖ר אֶת הַ/יַּרְדֵּ֥ן הַ/זֶּֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/027.yaml
  text: Go up to the top of Pisgah[a], and lift up your eyes westward and northward and southward and eastward, and see with your eyes[b]; for you shall not cross this Jordan.
translation:
  language: id
  text: Naiklah ke puncak Pisga. Arahkan pandanganmu ke barat,[a] ke utara, ke selatan, dan ke timur, lalu lihatlah dengan matamu, sebab engkau tidak akan menyeberangi Yordan ini.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ke arah laut,” ungkapan lazim dalam bahasa Ibrani untuk arah barat.
    reason: cultural_note
  - marker: b
    text: Atau, “Sungai Yordan ini.” Dalam bahasa Ibrani hanya disebut “Yordan ini.”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵה
  choice: Naiklah
  rationale: Imperatif Qal dari עלה menyatakan perintah untuk bergerak naik; “Naiklah” alami dan langsung dalam bahasa Indonesia.
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: puncak Pisga
  rationale: רֹאשׁ secara harfiah berarti “kepala” tetapi di sini menunjuk bagian teratas; “puncak Pisga” merupakan ungkapan geografis yang alami.
- source_word: וְשָׂא עֵינֶיךָ
  choice: Arahkan pandanganmu
  rationale: Idiom Ibrani ini berarti mengangkat atau mengarahkan mata untuk memandang. Pilihan ini alami dalam bahasa Indonesia sambil mempertahankan tindakan yang disengaja.
- source_word: יָמָּה
  choice: ke barat
  rationale: Bentuk berarah dari יָם, secara harfiah “ke arah laut,” lazim dipakai untuk arah barat dalam geografi Israel.
- source_word: וְצָפֹנָה ... וְתֵימָנָה ... וּמִזְרָחָה
  choice: ke utara, ke selatan, dan ke timur
  rationale: Ketiga bentuk berarah ini menyatakan mata angin; susunan dan kesejajarannya dipertahankan secara alami.
- source_word: וּרְאֵה בְעֵינֶיךָ
  choice: dan lihatlah dengan matamu sendiri
  rationale: Pengulangan unsur “mata” dalam bahasa Ibrani bersifat menegaskan. Kata “sendiri” menyampaikan penekanan idiomatis tanpa menghapus gambaran sumber.
- source_word: כִּי לֹא תַעֲבֹר
  choice: sebab engkau tidak akan menyeberangi
  rationale: כִּי memberi alasan bagi perintah sebelumnya, dan עבר dalam konteks sungai paling alami diterjemahkan “menyeberangi.”
- source_word: אֶת הַיַּרְדֵּן הַזֶּה
  choice: Sungai Yordan ini
  rationale: “Sungai” memperjelas referen geografis bagi pembaca Indonesia, sedangkan “ini” mempertahankan demonstratif הַזֶּה.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk sapaan tunggal “engkau” sesuai dengan ujaran kepada Musa. Empat arah mata angin serta penegasan bahwa Musa hanya dapat melihat negeri itu dengan matanya sendiri dipertahankan.
