  source_fidelity: 'Teks Indonesia secara setia menerjemahkan seluruh unsur Ibrani: waw dengan kontras kontekstual ringan melalui “Tetapi,” כָּל sebagai “semua,” בְּהֵמָה sebagai “ternak,” שְׁלַל sebagai “jarahan,” verba בָּזַז sebagai “kami rampas,” dan לָנוּ sebagai “bagi diri kami sendiri.” Frasa “dari kota-kota itu” merupakan pengungkapan Indonesia yang wajar bagi relasi konstruksi “jarahan kota-kota.”'
