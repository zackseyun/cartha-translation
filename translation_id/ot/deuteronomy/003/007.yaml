  text: וְ/כָל הַ/בְּהֵמָ֛ה וּ/שְׁלַ֥ל הֶ/עָרִ֖ים בַּזּ֥וֹנוּ לָֽ/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/007.yaml
  text: But all the livestock and the spoil of the cities we took as plunder for ourselves[a].
translation:
  language: id
  text: Tetapi semua ternak dan jarahan dari kota-kota itu kami rampas bagi diri kami sendiri.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Dan semua ternak serta jarahan dari kota-kota itu kami jarah bagi diri kami sendiri.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: Tetapi semua
  rationale: Waw menghubungkan ayat ini dengan pemusnahan penduduk pada ayat sebelumnya sekaligus memberi kontras ringan terhadap apa yang dibiarkan; 'Tetapi semua' menyampaikan hubungan itu dan mempertahankan cakupan כָּל.
- source_word: הַ/בְּהֵמָה
  choice: ternak
  rationale: Dalam konteks ini בְּהֵמָה menunjuk pada hewan piaraan milik penduduk kota; 'ternak' merupakan padanan Indonesia modern yang alami dan tepat.
- source_word: וּ/שְׁלַל הֶ/עָרִים
  choice: dan jarahan dari kota-kota itu
  rationale: שָׁלָל adalah barang yang dirampas dalam perang. Relasi konstruksi dengan הֶעָרִים secara alami diungkapkan dalam bahasa Indonesia sebagai asal jarahan, yaitu 'dari kota-kota itu'.
- source_word: בַּזּוֹנוּ
  choice: kami rampas
  rationale: Bentuk dari בזז menyatakan tindakan menjarah atau merampas barang perang; 'kami rampas' jelas dan wajar, sementara nomina 'jarahan' mempertahankan nuansa militernya.
- source_word: לָֽ/נוּ
  choice: bagi diri kami sendiri
  rationale: Preposisi dengan pronomina orang pertama jamak menyatakan pihak yang memperoleh manfaat; bentuk refleksif ini menegaskan bahwa jarahan tersebut diambil menjadi milik Israel.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Jarahan' mempertahankan konteks perang tanpa terdengar terlalu arkais; 'rampas' menghindari pengulangan akar kata dalam teks utama. Penanda catatan kaki ditempatkan sesudah kalimat.
