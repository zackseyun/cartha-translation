  yaml_path: translation/ot/deuteronomy/003/023.yaml
  text: And I pleaded with Yahweh at that time[a], saying,
translation:
  language: id
  text: 'Pada waktu itu aku memohon dengan sungguh-sungguh kepada Yahweh[a] sebagai berikut:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH. Secara tradisional diterjemahkan “TUHAN”; di sini ditransliterasikan “Yahweh”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶתְחַנַּן
  choice: aku memohon dengan sungguh-sungguh
  rationale: Bentuk hitpael dari חנן menyatakan permohonan yang sungguh-sungguh untuk memperoleh belas kasihan atau kemurahan. Ungkapan ini alami dalam bahasa Indonesia modern dan mempertahankan intensitasnya.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi ini menunjukkan arah permohonan kepada Yahweh; 'memohon ... kepada' merupakan susunan idiomatis dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: בָּעֵת הַהִוא
  choice: Pada waktu itu
  rationale: Padanan idiomatis yang mempertahankan latar waktu naratif tanpa mempersempitnya menjadi satu momen tertentu.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Formula Ibrani ini mengantar perkataan langsung yang berlanjut pada ayat berikutnya. 'Demikian:' lebih alami daripada 'dengan berkata' dalam konteks ini.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. Transliterasi 'Yahweh' mempertahankan nama itu, sedangkan catatan kaki memberitahukan kebiasaan tradisional menerjemahkannya sebagai 'TUHAN'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti 'aku' mengikuti tuturan Musa dalam konteks sekitarnya. Intensitas verba Ibrani dinyatakan dengan 'memohon dengan sungguh-sungguh', sementara titik dua menandai bahwa isi permohonan menyusul pada ayat berikutnya.
