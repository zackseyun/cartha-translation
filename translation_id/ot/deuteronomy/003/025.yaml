base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/025.yaml
  text: Please let me cross over and see the good land that is beyond the Jordan[a], this good hill country and Lebanon.
translation:
  language: id
  text: Aku mohon, izinkanlah aku menyeberang dan melihat tanah yang baik di seberang Sungai Yordan, pegunungan yang baik ini[a] dan Lebanon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “gunung yang baik ini.” Kata Ibrani yang dipakai dapat menunjuk pada sebuah gunung tertentu atau pada daerah pegunungan di sebelah barat Sungai Yordan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶעְבְּרָה נָּא
  choice: Izinkanlah aku menyeberang
  rationale: Bentuk kohortatif dengan partikel permohonan menyatakan permintaan Musa. Ungkapan ini mempertahankan nada memohon secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: וְאֶרְאֶה
  choice: dan melihat
  rationale: Kohortatif kedua berkoordinasi dengan verba pertama dan menyatakan hal yang ingin dilakukan Musa setelah menyeberang.
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: negeri yang baik
  rationale: Dalam konteks wilayah yang dijanjikan, אֶרֶץ menunjuk pada suatu negeri atau wilayah; pilihan ini alami dalam bahasa Indonesia dan mempertahankan ungkapan khas Ulangan.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: di seberang Sungai Yordan
  rationale: Frasa ini menunjuk wilayah di sisi lain Yordan dari posisi Musa di sebelah timur. Penambahan 'Sungai' memperjelas nama geografis secara alami tanpa mengubah acuannya.
- source_word: הָהָר הַטּוֹב הַזֶּה
  choice: pegunungan yang baik ini
  rationale: Kata הָר dalam bentuk tunggal dapat menunjuk secara kolektif pada daerah bergunung-gunung. Konteks uraian wilayah mendukung arti regional, tetapi arti gunung tunggal tetap dicatat dalam catatan kaki.
- source_word: וְהַלְּבָנוֹן
  choice: dan Lebanon
  rationale: Nama tempat dipertahankan sebagai Lebanon, menunjuk kawasan pegunungan di bagian utara negeri itu.
theological_decisions:
- issue: 'Cakupan geografis הָהָר: satu gunung atau daerah pegunungan'
  choice: Diterjemahkan 'pegunungan yang baik ini' sebagai sebutan regional.
  alternative: '''gunung yang baik ini'''
  rationale: Bentuk tunggal Ibrani dapat digunakan secara kolektif untuk kawasan pegunungan. Konteks permohonan Musa untuk melihat seluruh negeri dan penyebutan Lebanon mendukung arti regional, tetapi teks Ibrani tetap memungkinkan acuan kepada sebuah gunung tertentu; karena itu ambiguitas tersebut dipertahankan melalui catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada permohonan yang hormat. 'Izinkanlah' menyampaikan nuansa kohortatif dan partikel permohonan tanpa diksi arkais. Susunan dengan 'yaitu' memperjelas bahwa pegunungan dan Lebanon menerangkan negeri yang ingin dilihat Musa.
