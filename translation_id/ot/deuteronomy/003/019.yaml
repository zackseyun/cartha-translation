  text: Only your wives[a], your little ones, and your livestock—I know that you have much livestock—shall remain in your towns that I have given you[b],
translation:
  language: id
  text: Hanya istri kalian,[a] anak-anak kalian, dan ternak kalian—aku tahu bahwa kalian memiliki banyak ternak—harus tetap tinggal di kota-kota yang telah kuberikan kepada kalian.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Istilah Ibrani yang diterjemahkan “anak-anak” dapat merujuk pada anak-anak kecil atau para tanggungan.
    reason: lexical_alternative
  - marker: b
    text: Atau “permukiman-permukiman.” Kata Ibrani ini dapat merujuk pada permukiman dengan ukuran yang beragam.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Hanya
  rationale: Menandai pengecualian terhadap perintah sebelumnya dengan ringkas dan mempertahankan daya pembatasnya.
- source_word: נְשֵׁיכֶם
  choice: istri-istri kalian
  rationale: Dalam konteks anggota rumah tangga yang ditinggalkan, makna khusus 'istri-istri' lebih tepat daripada 'perempuan-perempuan'.
- source_word: טַפְּכֶם
  choice: anak-anak kalian
  rationale: טַף mengacu pada anak-anak kecil atau tanggungan; 'anak-anak' merupakan padanan Indonesia yang alami, sedangkan cakupan lebih luas dijelaskan dalam catatan kaki.
- source_word: מִקְנֵיכֶם / מִקְנֶה רַב
  choice: ternak kalian / ternak kalian banyak
  rationale: מִקְנֶה mencakup berbagai hewan peliharaan, bukan hanya sapi. Pengulangan 'ternak' mengikuti pengulangan dalam bahasa Ibrani.
- source_word: יָדַעְתִּי כִּי
  choice: aku tahu bahwa
  rationale: Mempertahankan pernyataan orang pertama secara langsung; tanda pisah menampilkan klausa penjelas tanpa menambahkan penghubung yang tidak dinyatakan.
- source_word: יֵשְׁבוּ
  choice: harus tetap tinggal
  rationale: Secara harfiah berarti duduk atau tinggal, tetapi dalam konteks ini menunjuk pada mereka yang tetap berada di belakang sementara para pria menyeberang untuk berperang.
- source_word: בְּעָרֵיכֶם
  choice: di kota-kota kalian
  rationale: עִיר dapat menunjuk permukiman dengan ukuran beragam. 'Kota-kota' alami dalam bahasa Indonesia, sementara kemungkinan 'kota-kota kecil' dicatat.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם
  choice: yang telah kuberikan kepada kalian
  rationale: Bentuk perfektif menunjukkan tindakan pemberian yang telah selesai dan tetap relevan bagi para penerimanya.
