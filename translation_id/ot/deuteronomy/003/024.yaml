  source_fidelity: 'Terjemahan secara umum setia pada teks Ibrani: bentuk perfek ''telah mulai'', objek ''hamba-Mu'', ''kebesaran-Mu'', metafora ''tangan-Mu yang kuat'', serta daya retoris pertanyaan perbandingan telah terwakili. Namun, bagian akhir lebih dekat pada bentuk dan paralelisme sumber bila ''melakukan ... seperti'' dipertahankan, alih-alih diringkas menjadi ''menyamai''.'
  naturalness: Bahasa draft sudah baku dan khidmat. 'Ilah manakah' lebih alami dan lazim dalam pertanyaan retoris formal daripada 'ilah mana'. 'Menunjukkan' juga lebih langsung dan idiomatis daripada 'memperlihatkan' dalam konstruksi ini.
