  text: אֲדֹנָ֣/י יְהוִ֗ה אַתָּ֤ה הַֽחִלּ֨וֹתָ֙ לְ/הַרְא֣וֹת אֶֽת עַבְדְּ/ךָ֔ אֶ֨ת גָּדְלְ/ךָ֔ וְ/אֶת יָדְ/ךָ֖ הַ/חֲזָקָ֑ה אֲשֶׁ֤ר מִי אֵל֙ בַּ/שָּׁמַ֣יִם וּ/בָ/אָ֔רֶץ אֲשֶׁר יַעֲשֶׂ֥ה כְ/מַעֲשֶׂ֖י/ךָ וְ/כִ/גְבוּרֹתֶֽ/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/024.yaml
  text: O Lord Yahweh[a], you have begun to show your servant your greatness and your strong hand. For what god is there in heaven or on earth who can do deeds like your deeds and mighty acts like yours?
translation:
  language: id
  text: Ya Tuhan Yahweh,[a] Engkau telah mulai menunjukkan kepada hamba-Mu kebesaran-Mu dan tangan-Mu yang kuat. Sebab, ilah manakah di langit atau di bumi yang dapat melakukan perbuatan seperti perbuatan-Mu dan tindakan perkasa seperti tindakan-Mu?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: Adonai YHWH, gabungan gelar “Tuhan” dan nama ilahi “Yahweh.” Dalam sejumlah terjemahan, gabungan ini ditulis “Tuhan ALLAH.”'
    reason: Menjelaskan dua sebutan ilahi dalam teks sumber dan alternatif tradisional untuk menerjemahkan nama YHWH.
lexical_decisions:
- source_word: אֲדֹנָי יְהוִה
  choice: Ya Tuhan Yahweh
  rationale: אֲדֹנָי diterjemahkan sebagai sapaan hormat “Tuhan,” sedangkan nama ilahi יהוה dialihaksarakan “Yahweh.” Bentuk ini mempertahankan kedua unsur Ibrani tanpa menghasilkan pengulangan “Tuhan TUHAN” yang janggal dalam bahasa Indonesia.
- source_word: הַחִלּוֹתָ לְהַרְאוֹת
  choice: Engkau telah mulai memperlihatkan
  rationale: Bentuk perfek hifil הַחִלּוֹתָ menyatakan tindakan yang sudah dimulai, sedangkan infinitif hifil לְהַרְאוֹת berarti “memperlihatkan.” Kata “telah” mempertahankan relevansi tindakan itu bagi saat Musa berdoa.
- source_word: עַבְדְּךָ
  choice: hamba-Mu
  rationale: Dalam doa kepada Allah, עֶבֶד menunjuk pada bawahan yang mengabdi; “hamba” merupakan padanan Indonesia yang alami dan sesuai dengan konteks perjanjian.
- source_word: גָּדְלְךָ
  choice: kebesaran-Mu
  rationale: Padanan langsung untuk nomina yang menyatakan kebesaran atau keagungan, tanpa mempersempitnya hanya pada kuasa.
- source_word: יָדְךָ הַחֲזָקָה
  choice: tangan-Mu yang kuat
  rationale: Mempertahankan metafora Ibrani tentang kuasa ilahi yang bekerja sekaligus menerjemahkan חֲזָקָה secara langsung sebagai “kuat.”
- source_word: מִי אֵל
  choice: ilah mana
  rationale: Pertanyaan retoris ini membandingkan Yahweh dengan setiap ilah yang mungkin dianggap ada. “Ilah” dengan huruf kecil menandai sebutan umum, bukan nama diri.
- source_word: בַּשָּׁמַיִם וּבָאָרֶץ
  choice: di langit atau di bumi
  rationale: 'Walaupun teks Ibrani memakai penghubung “dan,” dalam pertanyaan retoris bahasa Indonesia, “atau” secara alami menyampaikan cakupan menyeluruh: tidak ada di salah satu ranah pun.'
- source_word: יַעֲשֶׂה כְמַעֲשֶׂיךָ וְכִגְבוּרֹתֶיךָ
  choice: yang dapat menyamai perbuatan-Mu dan tindakan-Mu yang perkasa
  rationale: Imperfek dalam pertanyaan retoris menyiratkan kemampuan. “Menyamai” menyampaikan perbandingan כְּ secara alami, sedangkan dua ungkapan sejajar tetap dibedakan sebagai “perbuatan” dan “tindakan ... yang perkasa.”
theological_decisions:
- issue: Penerjemahan nama ilahi dalam gabungan אֲדֹנָי יְהוִה
  choice: Ya Tuhan Yahweh
  alternative: Ya Tuhan ALLAH; Ya Tuhan TUHAN
  rationale: Teks menyandingkan gelar אֲדֹנָי dengan nama perjanjian יהוה. “Yahweh” mempertahankan nama ilahi itu secara terbuka, sementara “Tuhan” menerjemahkan gelarnya; catatan kaki menjelaskan bentuk sumber tanpa menetapkan ajaran denominasi tertentu.
- issue: Pertanyaan tentang ilah-ilah lain
  choice: ilah mana ... yang dapat menyamai
  alternative: siapakah Allah ... yang dapat melakukan
  rationale: Ungkapan מִי אֵל bersifat retoris dan menegaskan bahwa tidak ada yang sebanding dengan Yahweh. Terjemahan tidak mengubah pertanyaan itu menjadi pernyataan metafisis eksplisit, sehingga bentuk dan ketegangan retoris sumber tetap terjaga.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “Engkau” serta akhiran pronominal “-Mu” dipakai secara konsisten untuk Allah. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan metafora “tangan yang kuat” dan bentuk pertanyaan retoris.
