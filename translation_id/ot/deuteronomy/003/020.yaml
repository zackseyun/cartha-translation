  source_fidelity: 'Terjemahan pada dasarnya setia pada teks Ibrani: Yahweh memberi ketenteraman kepada saudara-saudara Israel, mereka mengambil milik negeri di seberang Yordan, lalu pihak yang disapa kembali ke bagian yang Musa telah berikan. Namun, bentuk pasif "yang diberikan Yahweh" kurang menyampaikan partisip aktif נֹתֵן ("yang Yahweh berikan/sedang berikan") dan dapat terdengar seolah-olah pemberinya tidak ditekankan.'
