reference: Deuteronomy 3:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עַ֠ד אֲשֶׁר יָנִ֨יחַ יְהוָ֥ה לַֽ/אֲחֵי/כֶם֮ כָּ/כֶם֒ וְ/יָרְשׁ֣וּ גַם הֵ֔ם אֶת הָ/אָ֕רֶץ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֵי/כֶ֛ם נֹתֵ֥ן לָ/הֶ֖ם בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן וְ/שַׁבְתֶּ֗ם אִ֚ישׁ לִֽ/ירֻשָּׁת֔/וֹ אֲשֶׁ֥ר נָתַ֖תִּי לָ/כֶֽם־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/020.yaml
  text: until Yahweh gives rest to your brothers as to you[a], and they also take possession of the land that Yahweh your God is giving them beyond the Jordan[c][b]. Then each of you may return to his possession that I have given you.
translation:
  language: id
  text: sampai Yahweh memberikan ketenteraman kepada saudara-saudaramu seperti kepadamu,[a] dan mereka juga menduduki negeri yang Yahweh, Allahmu, berikan kepada mereka di seberang Sungai Yordan.[b] Sesudah itu, kamu masing-masing boleh kembali ke tanah miliknya[c] yang telah kuberikan kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kepada sesama orang Israel seperti kepadamu.” Teks Ibrani memakai kata “saudara-saudaramu,” yaitu istilah kekerabatan maskulin bagi sesama anggota Israel.
    reason: lexical_alternative
  - marker: b
    text: Atau, “di sisi lain Sungai Yordan.” Ungkapan ini ditentukan oleh posisi pembicara, yang berada di sebelah timur sungai.
    reason: lexical_alternative
  - marker: c
    text: Atau, “ke tanah warisannya masing-masing.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יָנִיחַ
  choice: memberikan ketenteraman
  rationale: Bentuk hifil dari נוח berarti membuat beristirahat atau memberi keadaan aman dan tenteram. Pilihan ini mempertahankan tema ketenteraman yang menetap di negeri itu, bukan sekadar istirahat jasmani.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: לַאֲחֵיכֶם
  choice: kepada saudara-saudaramu
  rationale: Kata אָח dalam bentuk jamak memakai istilah kekerabatan maskulin untuk sesama anggota Israel. Bahasa Indonesia memungkinkan bentuk ini tetap alami tanpa memperluasnya secara eksplisit.
- source_word: כָכֶם
  choice: seperti kepadamu
  rationale: Ungkapan perbandingan dalam bahasa Ibrani bersifat eliptis. Terjemahan ini mempertahankan kehematan dan perbandingan sumber tanpa menambahkan kata kerja yang tidak dinyatakan.
- source_word: וְיָרְשׁוּ
  choice: menduduki
  rationale: Dalam konteks pembagian tanah, ירשׁ menunjuk pada tindakan mengambil dan menguasai negeri. 'Menduduki' menyampaikan tindakan konkret itu dengan wajar.
- source_word: גַם הֵם
  choice: mereka juga
  rationale: Mempertahankan penekanan bahwa suku-suku di sebelah barat pun akan memperoleh negeri mereka.
- source_word: נֹתֵן
  choice: yang diberikan
  rationale: Partisip Ibrani menggambarkan pemberian Yahweh sebagai tindakan yang sedang berlangsung dan pasti. Dalam konstruksi relatif bahasa Indonesia, 'yang diberikan' terasa alami dan tidak mengurangi kepastian itu.
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: di seberang Sungai Yordan
  rationale: Ungkapan ini bersifat relatif terhadap posisi pembicara di sebelah timur sungai. Penambahan 'Sungai' memperjelas nama geografis dalam bahasa Indonesia.
- source_word: וְשַׁבְתֶּם
  choice: Sesudah itu ... boleh kembali
  rationale: Urutan wacana menunjukkan bahwa kepulangan berlangsung setelah kewajiban membantu penaklukan dipenuhi. 'Boleh' menyampaikan nuansa izin yang sesuai konteks.
- source_word: אִישׁ
  choice: kamu masing-masing
  rationale: אִישׁ berfungsi distributif. Ungkapan ini menyampaikan bahwa setiap orang yang disapa dapat kembali ke bagiannya sendiri.
- source_word: לִירֻשָּׁתוֹ
  choice: ke tanah milikmu
  rationale: יְרֻשָּׁה ialah milik atau bagian warisan, khususnya tanah yang dialokasikan. 'Tanah milikmu' konkret dan sesuai konteks kepulangan.
- source_word: נָתַתִּי לָכֶם
  choice: yang telah kuberikan kepadamu
  rationale: Bentuk perfektif menunjuk pada pemberian atau penetapan yang sudah dilakukan dan tetap berlaku. Bentuk 'telah kuberikan' mempertahankan relevansi kini.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama perjanjian Allah. Transliterasi 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Bahasa bergender dalam לַאֲחֵיכֶם dan אִישׁ
  choice: Mempertahankan 'saudara-saudaramu' dan menerjemahkan אִישׁ secara distributif sebagai 'kamu masing-masing'
  alternative: sesama orang Israel; setiap laki-laki
  rationale: Bentuk sumber bersifat maskulin dan menunjuk kepada sesama anggota Israel serta para pejuang yang disapa. Terjemahan utama mempertahankan citra kekerabatan, sementara fungsi distributif אִישׁ diungkapkan secara idiomatis tanpa menambahkan cakupan baru.
- issue: Identitas pembicara dalam נָתַתִּי
  choice: kuberi- dengan huruf kecil
  alternative: Kuberikan dengan huruf besar sebagai rujukan langsung kepada Allah
  rationale: Subjek orang pertama dalam konteks adalah Musa, yang sebelumnya menetapkan tanah di sebelah timur Yordan bagi suku-suku tersebut. Huruf kecil mencegah pembaca mengira Yahweh sedang berbicara langsung.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan kalimat yang mudah dipahami. 'Ketenteraman' mempertahankan tema teologis tentang keamanan yang Yahweh karuniakan di negeri itu. Tanda koma sebelum catatan [a] mengikuti batas klausa, dan setiap penanda catatan kaki muncul tepat pada unsur yang dijelaskannya.
