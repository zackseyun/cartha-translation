  text: צִידֹנִ֛ים יִקְרְא֥וּ לְ/חֶרְמ֖וֹן שִׂרְיֹ֑ן וְ/הָ֣/אֱמֹרִ֔י יִקְרְאוּ ל֖/וֹ שְׂנִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/009.yaml
  text: The Sidonians call Hermon Sirion[b][a], and the Amorites call it Senir—
translation:
  language: id
  text: Orang Sidon menyebut Hermon Siryon, dan orang Amori menyebutnya Senir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צִידֹנִים
  choice: Orang Sidon
  rationale: Bentuk nisbah jamak ini menunjuk kepada penduduk atau bangsa dari Sidon; ungkapan “orang Sidon” alami dan baku dalam bahasa Indonesia.
- source_word: יִקְרְאוּ
  choice: menyebut
  rationale: Dalam konstruksi dengan ל, verba קרא menyatakan pemberian atau penggunaan nama. “Menyebut” secara alami menyampaikan makna itu dalam konteks ini.
- source_word: לְחֶרְמוֹן
  choice: Hermon
  rationale: Nama tempat ini ditampilkan tanpa tambahan “Gunung” karena teks Ibrani ayat ini hanya memuat nama Hermon.
- source_word: שִׂרְיֹן
  choice: Siryon
  rationale: Nama yang digunakan orang Sidon untuk Hermon ditransliterasikan, bukan diterjemahkan; “Siryon” mencerminkan konsonan dan vokalisasi Masoret secara wajar dalam ejaan Indonesia.
- source_word: וְהָאֱמֹרִי
  choice: sedangkan orang Amori
  rationale: Walaupun bentuk nisbahnya tunggal secara morfologis, pemakaiannya bersifat kolektif, sejajar dengan “orang Sidon” dan verba jamak. “Sedangkan” memperjelas perbandingan dua sebutan tanpa mengubah isinya.
- source_word: יִקְרְאוּ לוֹ
  choice: menyebutnya
  rationale: Pronomina merujuk kembali kepada Hermon; bentuk terikat “-nya” menghasilkan bahasa Indonesia yang ringkas dan alami.
- source_word: שְׂנִיר
  choice: Senir
  rationale: Nama yang digunakan orang Amori untuk Hermon dipertahankan sebagai nama diri dengan transliterasi yang lazim.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur paralel kedua kelompok dipertahankan. Tidak ditambahkan kata “Gunung” karena tidak eksplisit dalam teks Ibrani ayat ini; bentuk kolektif “orang Amori” tetap dapat menyatakan kelompok dalam bahasa Indonesia tanpa perlu catatan kaki.
