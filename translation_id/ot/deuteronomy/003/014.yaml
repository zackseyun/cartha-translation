  to: Yair, anak Manasye, mengambil seluruh wilayah Argob sampai ke perbatasan orang Gesur dan orang Maakha. Ia menamai tempat-tempat itu menurut namanya sendiri—yakni Basan—Hawot-Yair, dan nama itu tetap dipakai sampai hari ini.
