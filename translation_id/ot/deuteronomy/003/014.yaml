base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/014.yaml
  text: Jair son of Manasseh took all the region of Argob[a], as far as the border of the Geshurites and the Maacathites, and he called them, that is, Bashan, Havvoth-jair[b], to this day.
translation:
  language: id
  text: Yair, anak Manasye, mengambil seluruh wilayah Argob sampai ke perbatasan orang Gesur dan orang Maakha. Ia menamai tempat-tempat itu menurut namanya sendiri—yakni Basan—Hawot-Yair, dan nama itu tetap dipakai sampai hari ini.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֶבֶל
  choice: wilayah
  rationale: Dalam konteks geografis ini, kata tersebut menunjuk pada suatu kawasan atau bentang tanah tertentu; “wilayah” alami dan jelas dalam bahasa Indonesia modern.
- source_word: אַרְגֹּב
  choice: Argob
  rationale: Nama tempat ditransliterasikan sesuai bentuk yang lazim dan dekat dengan sumber Ibrani.
- source_word: עַד גְּבוּל הַגְּשׁוּרִי וְהַמַּעֲכָתִי
  choice: sampai ke perbatasan orang Gesur dan orang Maakha
  rationale: גְּבוּל berarti batas atau perbatasan, sedangkan bentuk gentilika diterjemahkan sebagai kelompok penduduk.
- source_word: וַיִּקְרָא אֹתָם
  choice: Ia menamai tempat-tempat itu
  rationale: Akhiran objek Ibrani berbentuk jamak. Penambahan “tempat-tempat” membuat acuannya wajar dalam bahasa Indonesia tanpa mengubah jumlah gramatikal.
- source_word: עַל שְׁמוֹ
  choice: menurut namanya sendiri
  rationale: Ungkapan ini menyatakan bahwa tempat-tempat tersebut dinamai dengan nama Yair sendiri.
- source_word: אֶת הַבָּשָׁן
  choice: yakni Basan
  rationale: Sintaks Ibrani padat dan sulit. “Yakni” mempertahankan kemungkinan fungsi aposisional Basan tanpa menjadikannya keterangan lokasi secara pasti.
- source_word: חַוֹּת יָאִיר
  choice: Hawot-Yair
  rationale: Frasa ini berfungsi sebagai nama tempat; transliterasi dipertahankan dalam teks utama, sementara arti unsur pertamanya dijelaskan dalam catatan kaki.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: nama itu tetap dipakai sampai hari ini
  rationale: Terjemahan idiomatis menyatakan bahwa nama tersebut masih berlaku pada masa narator; “nama itu tetap dipakai” memperjelas hubungan ungkapan waktu dengan tindakan penamaan.
