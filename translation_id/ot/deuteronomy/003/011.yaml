id: DEU.3.11
reference: Deuteronomy 3:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֣י רַק ע֞וֹג מֶ֣לֶךְ הַ/בָּשָׁ֗ן נִשְׁאַר֮ מִ/יֶּ֣תֶר הָ/רְפָאִים֒ הִנֵּ֤ה עַרְשׂ/וֹ֙ עֶ֣רֶשׂ בַּרְזֶ֔ל הֲ/לֹ֣ה הִ֔וא בְּ/רַבַּ֖ת בְּנֵ֣י עַמּ֑וֹן תֵּ֧שַׁע אַמּ֣וֹת אָרְכָּ֗/הּ וְ/אַרְבַּ֥ע אַמּ֛וֹת רָחְבָּ֖/הּ בְּ/אַמַּת אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/011.yaml
  text: For only Og king of Bashan was left of the remnant of the Rephaim[a]. Look, his bed was a bed of iron. Is it not in Rabbah of the Ammonites? Its length was nine cubits and its width four cubits[b], by the cubit of a man.
translation:
  language: id
  text: Sebab hanya Og, raja Basan, yang masih tersisa dari sisa orang Refaim.[a] Lihatlah, tempat tidurnya adalah tempat tidur dari besi. Bukankah tempat tidur itu ada di Raba, kota orang Amon? Panjangnya sembilan hasta dan lebarnya empat hasta, menurut hasta manusia.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “kaum raksasa.” Refaim tampaknya merupakan nama suatu kelompok kuno yang dikaitkan dengan ukuran tubuh yang luar biasa.
    reason: alternative_reading
  - marker: b
    text: Ungkapan Ibraninya secara harfiah berarti “menurut hasta seorang manusia”; mungkin maksudnya “menurut hasta biasa” atau “menurut ukuran hasta yang umum.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: hanya
  rationale: 'Menandai kekhususan: Og seorang saja yang masih tersisa dari kelompok yang disebutkan.'
- source_word: נִשְׁאַר מִיֶּתֶר
  choice: masih tersisa dari sisa
  rationale: Mempertahankan unsur verba pasif dan frasa yang menunjuk pada sisa kelompok, meskipun pengulangannya sedikit terasa dalam bahasa Indonesia.
- source_word: הָרְפָאִים
  choice: orang Refaim
  rationale: Mempertahankan nama kelompok dalam bahasa Ibrani, bukan langsung menafsirkannya sebagai 'raksasa'.
- source_word: הִנֵּה
  choice: Lihatlah
  rationale: Ungkapan modern dan bermartabat yang tetap menarik perhatian pembaca kepada benda yang menjadi bukti.
- source_word: עַרְשׂוֹ ... עֶרֶשׂ
  choice: tempat tidurnya adalah tempat tidur
  rationale: Mempertahankan pengulangan nomina dalam teks Ibrani dan memilih arti umum yang paling wajar dalam konteks ukuran tubuh Og.
- source_word: בַּרְזֶל
  choice: besi
  rationale: Padanan langsung bagi bahan yang disebutkan.
- source_word: הֲלֹה הִוא
  choice: Bukankah tempat tidur itu
  rationale: Mempertahankan bentuk pertanyaan retoris; nomina diulang agar rujukan pronomina jelas dalam bahasa Indonesia.
- source_word: בְּרַבַּת בְּנֵי עַמּוֹן
  choice: di Raba, kota orang Amon
  rationale: Raba dipertahankan sebagai nama tempat, sedangkan tambahan 'kota' memperjelas hubungan tempat itu dengan orang Amon secara alami.
- source_word: תֵּשַׁע אַמּוֹת ... וְאַרְבַּע אַמּוֹת
  choice: sembilan hasta ... empat hasta
  rationale: Mempertahankan satuan kuno tanpa konversi yang dapat menimbulkan kesan ketepatan modern yang tidak ada dalam teks.
- source_word: בְּאַמַּת אִישׁ
  choice: menurut hasta manusia
  rationale: Terjemahan dekat secara bentuk yang mempertahankan ketidaklaziman dan kemungkinan makna ungkapan Ibrani.
theological_decisions:
- issue: Apakah הָרְפָאִים diterjemahkan secara interpretatif sebagai 'raksasa' atau dipertahankan sebagai nama kelompok
  choice: orang Refaim
  alternative: raksasa
  rationale: Istilah Ibrani dapat menunjuk kepada suatu kelompok kuno yang dikaitkan dengan tubuh besar. Transliterasi menghindari penetapan tafsir sebagai arti tunggal, sementara alternatif dijelaskan dalam catatan.
- issue: Apakah עֶרֶשׂ berarti tempat tidur atau peti jenazah/sarkofagus
  choice: tempat tidur
  alternative: peti jenazah atau sarkofagus
  rationale: Arti umum 'tempat tidur' paling alami dalam konteks ukuran benda yang menonjolkan besarnya Og, tetapi kemungkinan arti khusus tidak dipaksakan ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang bermartabat. Nama Basan, Refaim, Raba, dan Amon mengikuti bentuk yang lazim dalam tradisi Alkitab Indonesia. Pengulangan 'tempat tidur' dan ungkapan 'hasta manusia' dipertahankan untuk mencerminkan bentuk serta ketegangan leksikal teks Ibrani.
