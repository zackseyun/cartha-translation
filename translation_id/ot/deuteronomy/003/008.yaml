  text: וַ/נִּקַּ֞ח בָּ/עֵ֤ת הַ/הִוא֙ אֶת הָ/אָ֔רֶץ מִ/יַּ֗ד שְׁנֵי֙ מַלְכֵ֣י הָ/אֱמֹרִ֔י אֲשֶׁ֖ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֑ן מִ/נַּ֥חַל אַרְנֹ֖ן עַד הַ֥ר חֶרְמֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/008.yaml
  text: And at that time we took the land from the hand of the two kings of the Amorites who were beyond the Jordan[a], from the Wadi Arnon as far as Mount Hermon.
translation:
  language: id
  text: Pada waktu itu kami mengambil wilayah itu dari tangan kedua raja orang Amori yang berada di seberang Sungai Yordan, mulai dari Wadi Arnon[a] sampai Gunung Hermon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Lembah Arnon” atau “Sungai Arnon”; kata Ibrani נַחַל dapat merujuk pada wadi, dasar aliran, lembah, atau aliran air.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּקַּח
  choice: kita merebut
  rationale: Bentuk Qal wayyiqtol orang pertama jamak dari לקח menyatakan tindakan Israel mengambil wilayah dari para raja. Dalam konteks penaklukan, “merebut” terdengar alami dalam bahasa Indonesia tanpa memperluas makna menjadi pemusnahan atau penghancuran.
- source_word: בָּעֵת הַהִוא
  choice: pada waktu itu
  rationale: Ungkapan waktu yang baku dan alami dalam bahasa Indonesia modern.
- source_word: הָאָרֶץ
  choice: negeri itu
  rationale: אֶרֶץ di sini menunjuk pada wilayah tertentu yang dikuasai kedua raja Amori. “Negeri itu” mempertahankan rujukan definit dan lebih wajar daripada “tanah itu” dalam konteks wilayah kerajaan.
- source_word: מִיַּד
  choice: dari tangan
  rationale: Mempertahankan idiom Ibrani yang berarti dari kekuasaan atau penguasaan seseorang; ungkapan ini tetap jelas dan bermartabat dalam bahasa Indonesia.
- source_word: שְׁנֵי מַלְכֵי הָאֱמֹרִי
  choice: kedua raja orang Amori
  rationale: Mengikuti hubungan konstruksi Ibrani dan dengan jelas menyatakan bahwa kedua raja itu memerintah orang Amori.
- source_word: אֲשֶׁר בְּעֵבֶר הַיַּרְדֵּן
  choice: yang berada di seberang Sungai Yordan
  rationale: Menyampaikan ungkapan geografis secara ringkas sambil mempertahankan perspektif relatif “di seberang”; “Sungai” memperjelas jenis unsur geografis bagi pembaca Indonesia.
- source_word: מִנַּחַל אַרְנֹן
  choice: mulai dari Wadi Arnon
  rationale: נַחַל dapat berarti wadi, dasar aliran, lembah, atau aliran air. “Wadi” paling baik mempertahankan ciri geografis kawasan itu tanpa menyiratkan sungai yang selalu berair; “mulai dari” menandai batas awal wilayah secara alami.
- source_word: עַד הַר חֶרְמוֹן
  choice: sampai Gunung Hermon
  rationale: עַד menandai batas terjauh wilayah, sedangkan הַר diterjemahkan sebagai “Gunung” dan nama חֶרְמוֹן ditransliterasikan sebagai “Hermon”.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan gerak narasi serta batas geografis teks Ibrani tanpa menjelaskan perspektif “di seberang Yordan” secara berlebihan. Penanda catatan kaki ditempatkan sesudah “Wadi Arnon”, istilah yang diterangkan oleh catatan tersebut.
