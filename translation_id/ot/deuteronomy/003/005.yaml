  text: All these were fortified cities with a high wall, double doors, and bars, besides a great many rural towns.
translation:
  language: id
  text: Semua kota itu adalah kota-kota berbenteng dengan tembok tinggi, pintu gerbang berdaun dua, dan palang-palang, belum termasuk sangat banyak kota di daerah terbuka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “desa-desa di daerah terbuka” atau “kota-kota yang tidak bertembok”. Bahasa Ibrani membedakan permukiman-permukiman ini dari kota-kota berbenteng yang baru disebutkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אֵלֶּה עָרִים
  choice: Semua itu adalah kota
  rationale: Susunan ini mempertahankan penekanan pada keseluruhan kota yang baru disebut, sekaligus terdengar alami dalam bahasa Indonesia.
- source_word: בְּצֻרוֹת
  choice: berbenteng
  rationale: Kata ini menggambarkan kota yang diperkuat untuk menghadapi serangan; 'berbenteng' merupakan padanan Indonesia yang ringkas dan tepat dalam konteks militer-geografis.
- source_word: חוֹמָה גְבֹהָה
  choice: dengan tembok yang tinggi
  rationale: Bentuk tunggal Ibrani dipertahankan. Dalam konteks ini, 'tembok' dapat dipahami secara kolektif sebagai tembok pertahanan kota.
- source_word: דְּלָתַיִם
  choice: pintu gerbang berdaun dua
  rationale: Bentuk dual menunjuk pada sepasang daun pintu. Karena konteksnya adalah pertahanan kota dan palang disebut sesudahnya, ungkapan ini menyampaikan pintu gerbang kota dengan dua daun secara jelas dan alami.
- source_word: וּבְרִיחַ
  choice: dan palang-palang
  rationale: Walaupun bentuk Ibraninya tunggal, kata ini dapat dipakai secara kolektif dalam daftar perlengkapan pertahanan. Bentuk jamak alami karena kota-kota dan pintu-pintu gerbang yang dimaksud berjumlah banyak.
- source_word: לְבַד
  choice: belum termasuk
  rationale: Ungkapan ini menyatakan tambahan di luar kota-kota berbenteng yang telah dihitung dan terdengar wajar dalam bahasa Indonesia modern.
- source_word: מֵעָרֵי הַפְּרָזִי
  choice: kota di daerah terbuka
  rationale: Frasa ini menunjuk pada permukiman di wilayah terbuka yang tidak memiliki pertahanan seperti kota-kota sebelumnya. Terjemahan utama mempertahankan gambaran geografis, sedangkan makna 'tidak bertembok' dijelaskan dalam catatan kaki.
- source_word: הַרְבֵּה מְאֹד
  choice: sangat banyak
  rationale: Padanan ini secara langsung mempertahankan penegasan kuat mengenai banyaknya permukiman tersebut.
