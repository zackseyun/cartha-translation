  text: וַ/נֵּ֣פֶן וַ/נַּ֔עַל דֶּ֖רֶךְ הַ/בָּשָׁ֑ן וַ/יֵּצֵ֣א עוֹג֩ מֶֽלֶךְ הַ/בָּשָׁ֨ן לִ/קְרָאתֵ֜/נוּ ה֧וּא וְ/כָל עַמּ֛/וֹ לַ/מִּלְחָמָ֖ה אֶדְרֶֽעִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/001.yaml
  text: Then we turned and went up by the way of Bashan[a], and Og king of Bashan came out to meet us, he and all his people, for battle at Edrei.
translation:
  language: id
  text: Kemudian kami berbalik dan berjalan naik melalui jalan Basan.[a] Og, raja Basan, keluar untuk menghadapi kami, ia dan seluruh rakyatnya, untuk berperang di Edrei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “jalan Basan.” Ungkapan ini dapat dipahami sebagai jalan menuju atau melalui Basan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנֵּפֶן
  choice: Kemudian kami berbalik
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi, sedangkan פנה berarti berbalik atau berpaling. 'Kemudian' menyampaikan urutan itu secara alami.
- source_word: וַנַּעַל
  choice: dan maju
  rationale: עלה secara harfiah berarti naik atau pergi naik. Dalam perjalanan menuju suatu wilayah, 'maju' terdengar alami dalam bahasa Indonesia tanpa menghilangkan gerak perjalanan; nuansa mendaki tidak ditekankan oleh konteks dekat.
- source_word: דֶּרֶךְ הַבָּשָׁן
  choice: melalui jalan menuju Basan
  rationale: Ungkapan harfiah 'jalan Basan' dapat menunjuk rute ke atau melalui wilayah tersebut. Terjemahan ini alami sekaligus mempertahankan acuan pada jalan; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: וַיֵּצֵא
  choice: keluar
  rationale: יצא berarti keluar. Konteks berikutnya sudah menjelaskan tujuan militernya, sehingga tidak perlu menambahkan gagasan 'bergerak maju' atau 'berbaris'.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: Og, raja Basan
  rationale: Rantai konstruksi Ibrani dinyatakan secara alami sebagai aposisi dalam bahasa Indonesia.
- source_word: לִקְרָאתֵנוּ
  choice: menghadapi kami
  rationale: לקראתנו secara dasar berarti menyongsong atau menemui kami. Dalam konteks pertempuran, 'menghadapi kami' alami dan tetap tidak mengulang frasa tujuan 'untuk berperang'.
- source_word: הוּא וְכָל־עַמּוֹ
  choice: bersama seluruh rakyatnya
  rationale: עם berarti rakyat atau bangsa, bukan secara eksplisit tentara. 'Rakyatnya' mempertahankan keluasan istilah sumber meskipun konteksnya militer.
- source_word: לַמִּלְחָמָה
  choice: untuk berperang
  rationale: מלחמה dapat berarti perang atau pertempuran. Bentuk verbal ini paling alami untuk menyatakan tujuan dalam bahasa Indonesia.
- source_word: אֶדְרֶעִי
  choice: di Edrei
  rationale: Nama tempat pada akhir kalimat berfungsi secara adverbial sebagai lokasi pertemuan untuk berperang, meskipun teks Ibrani tidak memakai preposisi eksplisit.
