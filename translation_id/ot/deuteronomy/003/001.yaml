translation_notes:
  register: Bahasa Indonesia baku, modern, dan naratif. Nama Basan, Og, dan Edrei mengikuti bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia. Susunan kalimat menjaga alur narasi Ibrani tanpa mengulang kata penghubung secara kaku.
