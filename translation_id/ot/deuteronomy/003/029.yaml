base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/029.yaml
  text: So we stayed in the valley opposite Beth-peor[a].
translation:
  language: id
  text: Lalu kami tinggal di lembah yang berhadapan dengan Bet-Peor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Lalu kami menetap di lembah di seberang Bet-Peor.”
    reason: Alternatif ini mempertahankan kemungkinan bahwa יָשַׁב berarti “menetap” dan bahwa מוּל menyatakan posisi “di seberang” tempat tersebut.
lexical_decisions:
- source_word: וַנֵּשֶׁב
  choice: Lalu kami tinggal
  rationale: Bentuk wayyiqtol orang pertama jamak dari יָשַׁב melanjutkan narasi dan menyatakan bahwa mereka menetap atau tetap berada di suatu tempat. “Lalu kami tinggal” alami dalam bahasa Indonesia dan tidak menentukan apakah keberadaan itu sementara atau menetap.
- source_word: בַּגָּיְא
  choice: di lembah
  rationale: גַּיְא dapat berarti lembah, jurang, atau ngarai. “Lembah” mempertahankan makna topografis yang luas tanpa merinci bentuk medan melebihi sumber.
- source_word: מוּל
  choice: yang berhadapan dengan
  rationale: מוּל menunjukkan posisi di depan atau berseberangan dengan sesuatu. “Berhadapan dengan” jelas dan wajar untuk hubungan spasial antara lembah dan sebuah tempat.
- source_word: בֵּית פְּעוֹר
  choice: Bet-Peor
  rationale: Nama tempat ini ditransliterasikan, bukan diterjemahkan. Bentuk “Bet-Peor” mengikuti pelafalan Ibrani dengan ejaan yang mudah dibaca dalam bahasa Indonesia.
theological_decisions: []
