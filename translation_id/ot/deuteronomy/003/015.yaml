  text: And to Machir I gave Gilead[a].
translation:
  language: id
  text: Dan kepada Makhir, kuberikan Gilead.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, bahasa Ibrani memakai bentuk “Gilead itu,” dengan kata sandang; dalam bahasa Indonesia nama tempat ini secara alami cukup disebut “Gilead.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מָכִיר
  choice: Kepada Makhir
  rationale: Preposisi לְ paling alami diterjemahkan “kepada,” sedangkan מָכִיר ditransliterasikan sebagai nama orang “Makhir.” Konjungsi וּ tidak dinyatakan tersendiri karena dalam bahasa Indonesia hubungan dengan konteks tetap alami tanpa “dan” pada awal kalimat.
- source_word: נָתַתִּי
  choice: kuberikan
  rationale: Bentuk Qal perfektum orang pertama tunggal dari נתן menyatakan tindakan pemberian dalam kisah lampau; bentuk “kuberikan” ringkas, alami, dan mempertahankan pelaku orang pertama.
- source_word: אֶת
  choice: '[penanda objek langsung tidak diterjemahkan]'
  rationale: Partikel ini menandai objek langsung tentu dan tidak memiliki padanan leksikal tersendiri dalam bahasa Indonesia.
- source_word: הַגִּלְעָד
  choice: Gilead
  rationale: Nama tempat ini lazim ditransliterasikan “Gilead.” Artikel Ibrani הַ tidak perlu dinyatakan sebelum nama tempat dalam bahasa Indonesia.
