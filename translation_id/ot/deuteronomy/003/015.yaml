  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Bentuk pronominal “kuberikan” mempertahankan orang pertama Musa tanpa menambahkan subjek yang tidak dinyatakan secara terpisah dalam teks Ibrani.
