  text: וַ/נִּלְכֹּ֤ד אֶת כָּל עָרָי/ו֙ בָּ/עֵ֣ת הַ/הִ֔וא לֹ֤א הָֽיְתָה֙ קִרְיָ֔ה אֲשֶׁ֥ר לֹא לָקַ֖חְנוּ מֵֽ/אִתָּ֑/ם שִׁשִּׁ֥ים עִיר֙ כָּל חֶ֣בֶל אַרְגֹּ֔ב מַמְלֶ֥כֶת ע֖וֹג בַּ/בָּשָֽׁן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/004.yaml
  text: 'And we captured all his cities at that time; there was not a city that we did not take from them: sixty cities[a], all the region of Argob, the kingdom of Og in Bashan.'
translation:
  language: id
  text: Pada waktu itu kami merebut semua kotanya. Tidak ada satu kota pun yang tidak kami rebut dari mereka[a]—enam puluh kota, seluruh wilayah Argob, kerajaan Og di Basan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani yang diterjemahkan “mereka” berbentuk jamak dan tampaknya merujuk kepada rakyat atau pasukan Og, bukan hanya kepada Og sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּלְכֹּד
  choice: kami merebut
  rationale: Kata kerja לכד dalam konteks peperangan berarti merebut atau menaklukkan; “merebut” mempertahankan nuansa pengambilalihan kota secara militer.
- source_word: כָּל עָרָיו
  choice: semua kotanya
  rationale: עִיר dapat berarti kota atau permukiman; “kota” merupakan padanan baku dan akhiran tunggalnya dipertahankan dengan “-nya,” yang merujuk kepada Og.
- source_word: בָּעֵת הַהִוא
  choice: Pada waktu itu
  rationale: Padanan alami dalam bahasa Indonesia modern untuk ungkapan waktu Ibrani ini.
- source_word: לֹא הָיְתָה קִרְיָה אֲשֶׁר לֹא לָקַחְנוּ מֵאִתָּם
  choice: Tidak ada satu kota pun yang tidak kami rebut dari mereka
  rationale: Susunan ini mempertahankan penyangkalan ganda yang menegaskan bahwa semua kota berhasil direbut, sekaligus mempertahankan bentuk jamak “mereka” dalam teks Ibrani.
- source_word: מֵאִתָּם
  choice: dari mereka
  rationale: Akhiran pronomina Ibrani berbentuk jamak. Terjemahan ini tidak mengubahnya menjadi bentuk tunggal yang hanya menunjuk kepada Og.
- source_word: שִׁשִּׁים עִיר
  choice: enam puluh kota
  rationale: Terjemahan langsung dari konstruksi bilangan dan nomina, serta konsisten dengan penggunaan “kota” sebelumnya.
- source_word: כָּל חֶבֶל אַרְגֹּב
  choice: seluruh wilayah Argob
  rationale: חֶבֶל di sini menunjuk pada suatu daerah atau distrik; “wilayah” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: מַמְלֶכֶת עוֹג בַּבָּשָׁן
  choice: kerajaan Og di Basan
  rationale: Mempertahankan rangkaian nomina yang mengidentifikasi kerajaan milik Og dan lokasinya di Basan.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Penyangkalan ganda dipertahankan dalam bentuk idiomatis “Tidak ada satu kota pun yang tidak ...” untuk menjaga penekanan teks Ibrani. Tanda pisah memperkenalkan perincian enam puluh kota tanpa menambahkan hubungan yang tidak dinyatakan secara eksplisit.
