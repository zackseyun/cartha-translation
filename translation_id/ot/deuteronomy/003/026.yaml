source:
  edition: WLC
  text: וַ/יִּתְעַבֵּ֨ר יְהוָ֥ה בִּ/י֙ לְמַ֣עַנְ/כֶ֔ם וְ/לֹ֥א שָׁמַ֖ע אֵלָ֑/י וַ/יֹּ֨אמֶר יְהוָ֤ה אֵלַ/י֙ רַב לָ֔/ךְ אַל תּ֗וֹסֶף דַּבֵּ֥ר אֵלַ֛/י ע֖וֹד בַּ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/026.yaml
  text: But Yahweh was angry with me because of you and did not listen to me[a], and Yahweh said to me, “Enough from you[b]; do not speak to me again about this matter.”
translation:
  language: id
  text: Namun, karena kamu, Yahweh murka terhadap aku[a] dan tidak mendengarkan aku. Yahweh berkata kepadaku, “Cukup![b] Jangan lagi berbicara kepada-Ku tentang perkara ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “oleh karena kamu”; ungkapan Ibraninya juga dapat diterjemahkan secara harfiah “demi kamu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “Cukup bagimu,” sebuah ungkapan untuk menghentikan pembicaraan dengan tegas.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְעַבֵּר
  choice: murka
  rationale: Bentuk hitpael dari עבר dalam ungkapan ini menyatakan kemarahan yang kuat. “Murka” wajar ketika subjeknya Allah, bermartabat, dan tidak melebih-lebihkan makna.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan secara langsung agar nama perjanjian dalam teks Ibrani tetap terlihat, bukan diganti dengan gelar.
- source_word: בִּי
  choice: terhadap aku
  rationale: Preposisi ini melengkapi ungkapan kemarahan dan secara alami menunjukkan sasaran murka Yahweh.
- source_word: לְמַעַנְכֶם
  choice: karena kamu
  rationale: Dalam konteks ini frasa tersebut menyatakan alasan atau kaitan kausal. Terjemahan ini mempertahankan tudingan Musa kepada umat tanpa memperinci lebih jauh sifat kausalitasnya.
- source_word: וְלֹא שָׁמַע אֵלָי
  choice: dan tidak mendengarkan aku
  rationale: שׁמע dengan אֶל berarti mendengarkan atau mengindahkan seseorang; konteksnya adalah Yahweh tidak mengabulkan permohonan Musa.
- source_word: רַב לָךְ
  choice: Cukup!
  rationale: Ungkapan Ibrani harfiahnya “cukup bagimu” dan berfungsi sebagai penghentian yang tegas. “Cukup!” menyampaikan daya tuturnya secara alami dalam bahasa Indonesia.
- source_word: אַל תּוֹסֶף דַּבֵּר ... עוֹד
  choice: Jangan lagi berbicara
  rationale: Konstruksi יסף dengan infinitif dan עוֹד menyatakan larangan meneruskan atau mengulangi tindakan.
- source_word: בַּדָּבָר הַזֶּה
  choice: tentang perkara ini
  rationale: דבר di sini menunjuk pada pokok permohonan Musa; “perkara” sesuai dengan ragam bahasa yang bermartabat dan mudah dipahami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama ilahi itu dan tidak menggantinya dengan sebuah gelar.
- issue: Hubungan לְמַעַנְכֶם dengan murka Yahweh terhadap Musa
  choice: karena kamu
  alternative: demi kamu / oleh karena kamu
  rationale: Frasa tersebut dapat bernuansa “karena kamu,” “oleh karena kamu,” atau secara formal “demi kamu.” Konteks mendukung kaitan sebab, tetapi catatan mempertahankan keluasan ungkapan Ibraninya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Kalimat langsung dibuat ringkas untuk mempertahankan ketegasan jawaban Yahweh. Bentuk “kepada-Ku” mengikuti kaidah penulisan pronomina yang merujuk kepada Allah.
