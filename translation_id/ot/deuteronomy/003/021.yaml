  text: וְ/אֶת יְהוֹשׁ֣וּעַ צִוֵּ֔יתִי בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹ֑ר עֵינֶ֣י/ךָ הָ/רֹאֹ֗ת אֵת֩ כָּל אֲשֶׁ֨ר עָשָׂ֜ה יְהוָ֤ה אֱלֹהֵי/כֶם֙ לִ/שְׁנֵי֙ הַ/מְּלָכִ֣ים הָ/אֵ֔לֶּה כֵּֽן יַעֲשֶׂ֤ה יְהוָה֙ לְ/כָל הַ/מַּמְלָכ֔וֹת אֲשֶׁ֥ר אַתָּ֖ה עֹבֵ֥ר שָֽׁמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/021.yaml
  text: And I commanded Joshua at that time[a], saying, ‘Your eyes have seen all that Yahweh your God did to these two kings; so Yahweh will do to all the kingdoms through which you are passing.’
translation:
  language: id
  text: 'Pada waktu itu aku memerintahkan Yosua dengan berkata: “Matamu sendiri telah melihat segala yang dilakukan Yahweh, Allah kalian, terhadap kedua raja itu. Demikianlah Yahweh akan bertindak terhadap semua kerajaan yang akan kaudatangi dengan menyeberang ke sana.”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶת יְהוֹשׁ֣וּעַ צִוֵּ֔יתִי
  choice: aku memerintahkan Yosua
  rationale: צוה menyatakan perintah atau amanat yang berwenang; “memerintahkan” langsung, alami, dan sesuai dengan hubungan Musa sebagai pemimpin terhadap Yosua.
- source_word: בָּעֵת הַהִוא
  choice: Pada waktu itu
  rationale: Ungkapan temporal baku yang diterjemahkan secara alami dalam bahasa Indonesia modern.
- source_word: לֵאמֹר
  choice: demikian
  rationale: Mempertahankan fungsi formula pengantar ucapan tanpa menghasilkan bentuk “dengan berkata” yang kaku.
- source_word: עֵינֶיךָ הָרֹאֹת
  choice: Matamu sendiri telah melihat
  rationale: Konstruksi ini menekankan kesaksian langsung Yosua. “Sendiri” menyampaikan penekanan tersebut, sedangkan citra “mata” tetap dipertahankan.
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה
  choice: segala yang dilakukan
  rationale: Menyampaikan cakupan menyeluruh dari כָּל dan tindakan lampau dengan bentuk Indonesia yang ringkas.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh, Allah kalian
  rationale: Nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”. Sufiks pada אֱלֹהֵיכֶם berpersona kedua jamak, sehingga “kalian” mempertahankan peralihan dari Yosua sebagai orang tunggal kepada komunitas Israel.
- source_word: לִשְׁנֵי הַמְּלָכִים הָאֵלֶּה
  choice: terhadap kedua raja itu
  rationale: Preposisi ל menandai pihak yang dikenai tindakan; “terhadap” alami dan tidak menambahkan secara eksplisit nuansa permusuhan yang hanya tersirat oleh konteks.
- source_word: כֵּן יַעֲשֶׂה יְהוָה
  choice: Demikianlah Yahweh akan bertindak
  rationale: כֵּן menunjukkan kesepadanan pola tindakan. “Demikianlah” mempertahankan kaitan komparatif dengan kalimat sebelumnya.
- source_word: לְכָל הַמַּמְלָכוֹת
  choice: terhadap semua kerajaan
  rationale: “Terhadap” menunjukkan bahwa kerajaan-kerajaan itu menjadi sasaran tindakan Yahweh, tanpa menentukan lebih jauh bentuk tindakannya.
- source_word: אֲשֶׁר אַתָּה עֹבֵר שָׁמָּה
  choice: yang akan kaudatangi dengan menyeberang ke sana
  rationale: Mempertahankan persona kedua tunggal אַתָּה, motif penyeberangan dalam עבר, dan arah tujuan pada שָׁמָּה. Unsur “akan” wajar karena penyeberangan yang dimaksud masih berada di depan dalam konteks naratif.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri perjanjian secara langsung; “Yahweh” mempertahankan nama tersebut dan membedakannya dari gelar ilahi.
- issue: Peralihan jumlah pada sapaan
  choice: “Allah kalian” tetapi “kaudatangi”
  alternative: Menyeragamkan semuanya menjadi tunggal atau jamak
  rationale: אֱלֹהֵיכֶם memiliki sufiks jamak yang merujuk kepada Israel, sedangkan עֵינֶיךָ dan אַתָּה berbentuk tunggal yang menyapa Yosua. Peralihan asli dipertahankan karena bermakna secara wacana.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “aku” mengikuti tuturan langsung Musa; “kau-” dipakai untuk sapaan tunggal kepada Yosua, sedangkan “kalian” mempertahankan rujukan jamak kepada Israel. Susunan akhir dibuat cukup alami sambil tetap memperdengarkan motif menyeberang dan unsur arah “ke sana” dari bahasa Ibrani.
