  text: also the Arabah[a], with the Jordan as its border, from Kinnereth as far as the Sea of the Arabah, the Salt Sea[b], below the slopes of Pisgah on the east.
translation:
  language: id
  text: juga Araba, dengan Sungai Yordan sebagai batasnya, dari Kineret[a] sampai Laut Araba, yaitu Laut Garam[b], di bawah lereng-lereng Pisga di sebelah timur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Khineret”; nama tempat Ibrani ini lazim ditransliterasikan dengan beberapa cara.
    reason: lexical_alternative
  - marker: b
    text: Yaitu Laut Mati.
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֲרָבָה
  choice: Araba
  rationale: Dipertahankan sebagai nama geografis bagi kawasan lembah retakan Yordan, bukan diterjemahkan secara umum sebagai “dataran”.
- source_word: הַיַּרְדֵּן
  choice: Sungai Yordan
  rationale: Nama baku dalam bahasa Indonesia; penambahan “Sungai” memperjelas rujukan geografis secara alami.
- source_word: גְבֻל
  choice: sebagai batasnya
  rationale: Menjelaskan konstruksi Ibrani yang eliptis tanpa menambahkan hubungan yang tidak tersurat.
- source_word: מִכִּנֶּרֶת
  choice: mulai dari Kineret
  rationale: Nama tempat ditransliterasikan tanpa mempersempitnya secara tidak pasti menjadi danau atau wilayah tertentu.
- source_word: יָם הָעֲרָבָה
  choice: Laut Araba
  rationale: Mempertahankan sebutan geografis Ibrani secara ringkas dan alami dalam bahasa Indonesia.
- source_word: יָם הַמֶּלַח
  choice: Laut Garam
  rationale: Menerjemahkan ungkapan Ibrani secara langsung; nama modern “Laut Mati” diberikan dalam catatan kaki.
- source_word: תַּחַת
  choice: di bawah
  rationale: Menyampaikan hubungan topografis tanpa menafsirkannya sebagai arah mata angin tertentu.
- source_word: אַשְׁדֹּת
  choice: lereng-lereng
  rationale: Dalam konteks topografi, kata ini paling wajar merujuk pada lereng atau bagian menurun dari pegunungan.
- source_word: הַפִּסְגָּה
  choice: Pisga
  rationale: Diperlakukan sebagai nama tempat dan ditransliterasikan dalam bentuk yang wajar bagi pembaca Indonesia.
- source_word: מִזְרָחָה
  choice: di sebelah timur
  rationale: Mempertahankan keterangan arah Ibrani dengan ungkapan Indonesia yang alami.
