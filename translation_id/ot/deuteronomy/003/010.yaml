  text: כֹּ֣ל עָרֵ֣י הַ/מִּישֹׁ֗ר וְ/כָל הַ/גִּלְעָד֙ וְ/כָל הַ/בָּשָׁ֔ן עַד סַלְכָ֖ה וְ/אֶדְרֶ֑עִי עָרֵ֛י מַמְלֶ֥כֶת ע֖וֹג בַּ/בָּשָֽׁן׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/010.yaml
  text: all the cities of the tableland[a], and all Gilead, and all Bashan, as far as Salecah and Edrei[b], the cities of the kingdom of Og in Bashan.
translation:
  language: id
  text: semua kota di dataran tinggi[a], seluruh Gilead, dan seluruh Basan, sampai ke Salka dan Edrei, yaitu kota-kota kerajaan Og di Basan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dataran” atau “tanah datar”. Istilah Ibrani ini menunjuk wilayah datar yang tinggi di sebelah timur Sungai Yordan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל עָרֵי הַמִּישֹׁר
  choice: semua kota di dataran tinggi
  rationale: מִישׁוֹר di sini menunjuk wilayah datar yang tinggi di sebelah timur Sungai Yordan; 'dataran tinggi' menyampaikan keadaan topografinya dengan wajar dalam bahasa Indonesia.
- source_word: וְכָל הַגִּלְעָד
  choice: seluruh Gilead
  rationale: כֹּל yang meliputi suatu wilayah lebih alami diterjemahkan 'seluruh'; Gilead dipertahankan sebagai nama tempat.
- source_word: וְכָל הַבָּשָׁן
  choice: dan seluruh Basan
  rationale: Kuantor wilayah diterjemahkan 'seluruh', sedangkan nama בָּשָׁן ditransliterasikan dalam bentuk Indonesia yang lazim, 'Basan'.
- source_word: עַד סַלְכָה וְאֶדְרֶעִי
  choice: sampai ke Salka dan Edrei
  rationale: עַד menyatakan batas geografis; 'sampai ke' alami dalam bahasa Indonesia. Nama-nama tempat ditransliterasikan langsung dari bentuk Ibrani.
- source_word: עָרֵי מַמְלֶכֶת עוֹג
  choice: yaitu kota-kota kerajaan Og
  rationale: Frasa ini merupakan aposisi yang menjelaskan kota-kota yang baru disebut. 'Yaitu' membuat hubungan itu jelas tanpa mengubah isinya.
- source_word: בַּבָּשָׁן
  choice: di Basan
  rationale: Preposisi בְּ menyatakan lokasi kerajaan Og.
theological_decisions: []
