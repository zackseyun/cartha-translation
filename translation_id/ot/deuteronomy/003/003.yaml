id: DEU.3.3
reference: Deuteronomy 3:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יִּתֵּן֩ יְהוָ֨ה אֱלֹהֵ֜י/נוּ בְּ/יָדֵ֗/נוּ גַּ֛ם אֶת ע֥וֹג מֶֽלֶךְ הַ/בָּשָׁ֖ן וְ/אֶת כָּל עַמּ֑/וֹ וַ/נַּכֵּ֕/הוּ עַד בִּלְתִּ֥י הִשְׁאִֽיר ל֖/וֹ שָׂרִֽיד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/003.yaml
  text: So Yahweh our God also gave into our hand Og king of Bashan[a], and all his people, and we struck him down until he had no survivor left.
translation:
  language: id
  text: Maka Yahweh, Allah kita, juga menyerahkan Og, raja Basan, beserta seluruh rakyatnya ke dalam tangan kita. Kita mengalahkannya sampai tidak seorang pun dari pihaknya tersisa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “sampai tidak tersisa baginya seorang pun yang selamat.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, untuk mempertahankan nama pribadi dalam teks Ibrani.
- source_word: וַיִּתֵּן ... בְּיָדֵנוּ
  choice: menyerahkan ... ke dalam tangan kita
  rationale: “Menyerahkan” menyampaikan נתן secara wajar dalam konteks peperangan, sedangkan “ke dalam tangan kita” mempertahankan ungkapan Ibrani tentang kuasa atau kendali.
- source_word: גַּם
  choice: juga
  rationale: Kata ini menghubungkan penaklukan Og dengan kemenangan sebelumnya atas Sihon dan mempertahankan daya tambahannya.
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: Og, raja Basan
  rationale: Nama orang, gelar, dan nama wilayah dialihkan dalam bentuk baku dan alami dalam bahasa Indonesia.
- source_word: כָּל עַמּוֹ
  choice: seluruh rakyatnya
  rationale: עַם berarti “rakyat/bangsa” dan lebih luas daripada “pasukan”; pilihan ini tidak mempersempit rujukannya hanya kepada tentara.
- source_word: וַנַּכֵּהוּ
  choice: Kita mengalahkannya
  rationale: Dalam konteks pertempuran, נכה dapat menyatakan tindakan memukul hingga kalah. Bentuk objek tunggal dipertahankan dengan “-nya”, yang merujuk kepada Og secara representatif dalam konteks Og beserta rakyatnya.
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: sampai tidak seorang pun dari pihaknya tersisa
  rationale: Rumusan ini menyampaikan kehancuran menyeluruh secara alami tanpa menetapkan subjek tersurat bagi הִשְׁאִיר, yang konstruksinya ringkas dan idiomatis.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa atau TUHAN
  rationale: Transliterasi mempertahankan nama ilahi dalam teks sumber dan tidak menggantinya dengan gelar.
- issue: Cakupan bahasa kekalahan total
  choice: sampai tidak seorang pun dari pihaknya tersisa
  alternative: sampai kami tidak menyisakan seorang pun baginya
  rationale: Pilihan utama mempertahankan beratnya pernyataan tentang kekalahan menyeluruh, tetapi tidak menambahkan subjek eksplisit yang tidak dinyatakan secara langsung dalam klausa Ibrani.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Maka” menjaga kesinambungan naratif; “beserta” menghubungkan Og dengan seluruh rakyatnya secara alami. Ungkapan “ke dalam tangan kita” sengaja dipertahankan sebagai idiom sumber yang masih mudah dipahami.
