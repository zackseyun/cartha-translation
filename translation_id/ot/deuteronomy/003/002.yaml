  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֵלַ/י֙ אַל תִּירָ֣א אֹת֔/וֹ כִּ֣י בְ/יָדְ/ךָ֞ נָתַ֧תִּי אֹת֛/וֹ וְ/אֶת כָּל עַמּ֖/וֹ וְ/אֶת אַרְצ֑/וֹ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֣ר עָשִׂ֗יתָ לְ/סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/002.yaml
  text: And Yahweh said to me, “Do not fear him, for I have given him, all his people, and his land into your hand; and you shall do to him just as you did to Sihon king of the Amorites, who lived in Heshbon.”
translation:
  language: id
  text: Lalu Yahweh berfirman kepadaku, “Jangan takut kepadanya, sebab Aku telah menyerahkan dia, seluruh rakyatnya, dan negerinya ke dalam tanganmu. Perlakukanlah dia sebagaimana yang telah kaulakukan terhadap Sihon, raja orang Amori, yang tinggal di Hesbon.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani dan mempertahankan fungsinya sebagai nama perjanjian.
- source_word: אַל תִּירָא אֹתוֹ
  choice: Jangan takut kepadanya
  rationale: Menyampaikan larangan secara langsung dan alami, sekaligus mempertahankan objek orang ketiga yang eksplisit dalam bahasa Ibrani.
- source_word: בְיָדְךָ נָתַתִּי
  choice: Aku telah menyerahkan ... ke dalam tanganmu
  rationale: Bentuk perfektif diterjemahkan sebagai tindakan yang telah dipastikan atau diselesaikan dari sudut pandang Allah; ungkapan 'ke dalam tanganmu' mempertahankan citra idiom Ibrani tentang penyerahan ke bawah kuasa seseorang.
- source_word: וְאֶת כָּל עַמּוֹ וְאֶת אַרְצוֹ
  choice: seluruh rakyatnya, dan negerinya
  rationale: עַם tidak dipersempit menjadi 'pasukan', sedangkan אֶרֶץ dalam konteks kerajaan paling alami diterjemahkan 'negeri'.
- source_word: וְעָשִׂיתָ לּוֹ כַּאֲשֶׁר עָשִׂיתָ
  choice: Perlakukanlah dia seperti engkau memperlakukan
  rationale: Terjemahan ini mempertahankan keluasan makna עשה dalam konstruksi 'berbuat kepada' tanpa merinci tindakan melebihi teks, tetapi terdengar lebih alami daripada 'lakukanlah kepadanya' dalam bahasa Indonesia.
- source_word: לְסִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: Sihon, raja orang Amori
  rationale: Mempertahankan hubungan aposisional dan menerjemahkan sebutan gentilik kolektif secara wajar dalam bahasa Indonesia.
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: yang tinggal di Hesbon
  rationale: Partisipel יֹשֵׁב menyatakan tempat kediaman; 'tinggal' merupakan ungkapan modern dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks sumber memakai Tetragramaton sebagai nama diri. Bentuk 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar atau memilih bentuk alternatif yang kurang dekat dengan rekonstruksi lazim.
- issue: Kepastian penyerahan sebelum pertempuran
  choice: Aku telah menyerahkan
  alternative: Aku menyerahkan; Aku akan menyerahkan
  rationale: Perfek Ibrani menyajikan penyerahan sebagai kenyataan yang sudah ditetapkan atau diselesaikan dari sudut pandang Allah. Terjemahan ini mempertahankan ketegangan antara pernyataan ilahi yang sudah pasti dan pelaksanaannya yang masih akan dilakukan Israel.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Berfirman' dipakai secara idiomatis untuk ujaran Allah. Pronomina yang merujuk kepada Allah ditulis dengan huruf kapital menurut kebiasaan luas dalam penerbitan Alkitab Indonesia. Kalimat perintah kedua dibuat alami tanpa memperjelas bentuk penghukuman yang hanya tersirat oleh konteks.
