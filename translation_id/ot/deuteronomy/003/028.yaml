  text: וְ/צַ֥ו אֶת יְהוֹשֻׁ֖עַ וְ/חַזְּקֵ֣/הוּ וְ/אַמְּצֵ֑/הוּ כִּי ה֣וּא יַעֲבֹ֗ר לִ/פְנֵי֙ הָ/עָ֣ם הַ/זֶּ֔ה וְ/הוּא֙ יַנְחִ֣יל אוֹתָ֔/ם אֶת הָ/אָ֖רֶץ אֲשֶׁ֥ר תִּרְאֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/028.yaml
  text: But commission Joshua[a], and strengthen him and encourage him, for he will cross over before this people[c][b], and he will cause them to inherit the land that you will see.
translation:
  language: id
  text: Namun, berilah amanat kepada Yosua[a], kuatkanlah dia dan teguhkanlah hatinya[b], sebab ia akan menyeberang di depan bangsa ini, dan ia akan membuat mereka memperoleh negeri yang akan kaulihat sebagai warisan.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "berilah perintah kepada Yosua" atau "tugaskanlah Yosua." Kata Ibrani ini dapat menunjuk pada pemberian amanat resmi.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, "kuatkanlah dia dan buatlah dia berani." Kedua kata kerja ini bersama-sama menekankan kekuatan dan keberanian.
    reason: lexical_alternative
  - marker: c
    text: 'Atau "ia akan memberikan negeri itu kepada mereka sebagai warisan." Bentuk kata kerja Ibraninya bersifat kausatif: Yosua akan menjadi perantara yang membawa bangsa itu memperoleh warisan mereka.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצַו אֶת־יְהוֹשֻׁעַ
  choice: berilah Yosua tugas resmi
  rationale: Bentuk piel imperatif dari צוה dalam konteks ini menyatakan pemberian amanat atau tanggung jawab kepemimpinan secara resmi, bukan sekadar suatu perintah biasa.
- source_word: וְחַזְּקֵהוּ
  choice: kuatkanlah
  rationale: Piel חזק berarti menguatkan atau membuat teguh; pilihan ini mempertahankan daya imperatif dan terdengar alami dalam bahasa Indonesia.
- source_word: וְאַמְּצֵהוּ
  choice: teguhkanlah hatinya
  rationale: Dalam pasangan dengan חזק, אמץ menunjuk pada peneguhan keberanian atau keteguhan batin. Ungkapan ini membedakan nuansanya dari 'kuatkanlah' tanpa menjadi kaku.
- source_word: כִּי הוּא יַעֲבֹר לִפְנֵי הָעָם הַזֶּה
  choice: sebab dialah yang akan menyeberang di depan bangsa ini
  rationale: עבר sesuai dengan konteks penyeberangan Sungai Yordan, sedangkan לִפְנֵי mempertahankan gambaran posisi di depan sekaligus menyiratkan peran kepemimpinan. Bentuk 'dialah' mencerminkan penekanan pada kata ganti הוּא.
- source_word: וְהוּא יַנְחִיל אוֹתָם
  choice: dan dialah yang akan membuat mereka mewarisi
  rationale: 'Bentuk hiphil dari נחל bersifat kausatif: Yosua menjadi perantara yang membuat umat memperoleh negeri sebagai warisan. Rumusan ini mempertahankan bentuk kausatif dan penekanan pada הוּא.'
- source_word: הָאָרֶץ אֲשֶׁר תִּרְאֶה
  choice: negeri yang akan kaulihat
  rationale: הָאָרֶץ merujuk pada negeri yang dijanjikan, dan bentuk imperfek תִּרְאֶה paling wajar dipahami sebagai tindakan yang akan terjadi dalam konteks ini.
theological_decisions:
- issue: Peran Yosua dalam pemberian warisan
  choice: membuat mereka mewarisi negeri
  alternative: memberikan negeri itu kepada mereka sebagai warisan
  rationale: Teks Ibrani memakai bentuk kausatif dan menggambarkan Yosua sebagai pelaksana yang membawa umat kepada kepemilikan warisan, tanpa menyamakan perannya dengan Allah sebagai pemberi utama negeri itu.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk imperatif dengan enklitik -lah mempertahankan nada amanat ilahi. 'Bangsa ini' dipilih untuk הָעָם הַזֶּה, sedangkan 'negeri' membedakan wilayah yang dijanjikan dari tanah sebagai bahan atau permukaan.
