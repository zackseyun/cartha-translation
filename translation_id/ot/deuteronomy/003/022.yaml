  text: לֹ֖א תְִּירָא֑וּ/ם כִּ֚י יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם ה֖וּא הַ/נִּלְחָ֥ם לָ/כֶֽם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/022.yaml
  text: Do not fear them[a], for Yahweh your God is the one who fights for you.
translation:
  language: id
  text: Jangan takut kepada mereka,[a] sebab Yahweh, Allah kalian, Dialah yang berperang bagi kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Jangan gentar terhadap mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תִּירָאוּם
  choice: Jangan takut kepada mereka
  rationale: Negasi לֹא dengan bentuk imperfek menyatakan larangan. Kata ירא berarti ‘takut’ atau ‘merasa gentar’, sedangkan akhiran objek orang ketiga jamak dipertahankan sebagai ‘mereka’.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan bagi larangan sebelumnya; ‘sebab’ mempertahankan hubungan penjelas secara wajar dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: אֱלֹהִים merujuk secara tunggal kepada Allah Israel, dan akhiran orang kedua jamak berarti ‘Allah kalian’. Dalam bahasa Indonesia, bentuk ‘-mu’ dapat menyapa umat secara kolektif dengan alami.
- source_word: הוּא
  choice: Dialah
  rationale: Pronomina mandiri ini bersifat menegaskan. ‘Dialah’ menyampaikan penekanan tersebut secara ringkas dan alami.
- source_word: הַנִּלְחָם
  choice: yang berperang
  rationale: Partisipel nifal dari לחם menggambarkan Yahweh sebagai Dia yang berperang; konstruksi ‘yang berperang’ mempertahankan sifat partisipial tanpa menentukan secara berlebihan aspek waktunya.
- source_word: לָכֶם
  choice: untukmu
  rationale: 'Preposisi ל menyatakan kepentingan atau keberpihakan: Yahweh berperang demi umat-Nya. Bentuk tunggal kolektif ‘-mu’ selaras dengan sapaan kepada Israel sebagai satu umat.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi. ‘Yahweh’ mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Penekanan pada הוּא
  choice: Dialah yang berperang
  alternative: Ia berperang
  rationale: Pronomina הוּא menambahkan penekanan pada identitas pelaku. ‘Dialah’ mempertahankan penekanan itu tanpa menambahkan tafsiran teologis.
- issue: Bilangan dalam sapaan אֱלֹהֵיכֶם ... לָכֶם
  choice: Allahmu ... untukmu
  alternative: Allah kalian ... untuk kalian
  rationale: Bentuk Ibrani menyapa kelompok secara jamak. Bahasa Indonesia dapat memakai ‘-mu’ untuk sapaan kolektif kepada Israel; alternatif ‘kalian’ lebih eksplisit jamak tetapi kurang sesuai dengan register Alkitab yang bermartabat.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Struktur penegasan ‘Dialah’ mempertahankan tekanan teks Ibrani, sedangkan ‘berperang untukmu’ tetap alami bagi pembaca umum. Tanda [a] ditempatkan langsung sesudah klausa yang dijelaskannya.
