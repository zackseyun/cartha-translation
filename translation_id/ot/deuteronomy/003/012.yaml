source:
  edition: WLC
  text: וְ/אֶת הָ/אָ֧רֶץ הַ/זֹּ֛את יָרַ֖שְׁנוּ בָּ/עֵ֣ת הַ/הִ֑וא מֵ/עֲרֹעֵ֞ר אֲשֶׁר עַל נַ֣חַל אַרְנֹ֗ן וַ/חֲצִ֤י הַֽר הַ/גִּלְעָד֙ וְ/עָרָ֔י/ו נָתַ֕תִּי לָ/רֻֽאוּבֵנִ֖י וְ/לַ/גָּדִֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/012.yaml
  text: And we took possession of this land at that time[a], from Aroer, which is on the Valley of the Arnon, and half the hill country of Gilead with its cities[b]; I gave it to the Reubenites and the Gadites.
translation:
  language: id
  text: Pada waktu itu kami mengambil alih negeri ini, yaitu dari Aroer yang terletak di tepi Lembah Arnon,[a] dan setengah wilayah pegunungan Gilead beserta kota-kotanya.[b] Daerah itu kuberikan kepada suku Ruben dan suku Gad.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di tepi Wadi Arnon.” Kata Ibrani נַחַל dapat berarti wadi, jurang, atau lembah sungai.
    reason: lexical_alternative
  - marker: b
    text: Atau “setengah Gunung Gilead.” Dalam uraian wilayah, kata Ibrani הַר dapat menunjuk sebuah kawasan pegunungan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָרַשְׁנוּ
  choice: kami menduduki
  rationale: Dalam konteks penaklukan dan pembagian wilayah, ירשׁ menyatakan tindakan mengambil lalu menguasai suatu daerah. 'Menduduki' menyampaikan penguasaan aktif secara wajar dalam bahasa Indonesia.
- source_word: הָאָרֶץ הַזֹּאת
  choice: negeri ini
  rationale: '''Negeri'' secara alami menunjuk wilayah yang telah dikuasai; pilihan ini tidak menyiratkan negara modern.'
- source_word: בָּעֵת הַהִוא
  choice: pada waktu itu
  rationale: Ungkapan temporal baku yang mengikuti arti langsung bahasa Ibrani.
- source_word: מֵעֲרֹעֵר אֲשֶׁר עַל נַחַל אַרְנֹן
  choice: mulai dari Aroer yang terletak di tepi Wadi Arnon
  rationale: מִן menandai batas awal wilayah. עַל dalam keterangan lokasi paling alami diterjemahkan 'di tepi', sedangkan 'Wadi' mempertahankan ciri geografis נחל sebagai lembah sungai yang dapat bersifat musiman.
- source_word: וַחֲצִי הַר הַגִּלְעָד
  choice: serta setengah wilayah pegunungan Gilead
  rationale: הַר dapat menunjuk kawasan pegunungan, bukan hanya satu gunung. Konteks wilayah beserta kota-kotanya mendukung pengertian regional ini.
- source_word: וְעָרָיו
  choice: beserta kota-kotanya
  rationale: Akhiran pronominal merujuk kepada kawasan Gilead yang disebut sebelumnya. 'Beserta' membentuk uraian wilayah yang alami.
- source_word: נָתַתִּי
  choice: Daerah itu kuberikan
  rationale: Peralihan dari orang pertama jamak ke orang pertama tunggal dipertahankan. 'Daerah itu' memperjelas objek tersirat tanpa mengubah rujukannya.
- source_word: לָרֻאוּבֵנִי וְלַגָּדִי
  choice: kepada suku Ruben dan suku Gad
  rationale: Bentuk nisbah tunggal dalam bahasa Ibrani berfungsi secara kolektif bagi kedua kelompok suku. Penyebutan 'suku' paling jelas dan alami dalam bahasa Indonesia.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Nama suku dinyatakan secara kolektif dengan 'suku Ruben dan suku Gad'. Istilah geografis 'wadi' dipertahankan karena cukup tepat, dengan alternatif yang lebih umum dijelaskan dalam catatan kaki.
