base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/016.yaml
  text: And to the Reubenites and to the Gadites I gave from Gilead as far as the Arnon Valley[a], the middle of the valley as a border, and as far as the Jabbok Valley[b], the border of the sons of Ammon.
translation:
  language: id
  text: Kuberikan kepada suku Ruben dan suku Gad daerah mulai dari Gilead sampai ke Wadi Arnon[a], dengan bagian tengah wadi itu sebagai batas, sampai ke Wadi Yabok, yaitu perbatasan orang Amon[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wadi ialah lembah atau alur sungai yang dapat berair hanya pada musim tertentu. Kata Ibrani נַחַל dapat menunjuk pada aliran air, wadi, atau lembah yang terkait dengannya.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak-anak Amon”; maksudnya ialah orang Amon.
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרֻאוּבֵנִי
  choice: kepada orang Ruben
  rationale: Bentuk gentilika menunjuk kepada kelompok suku Ruben, bukan hanya leluhur mereka; ungkapan ini alami dalam bahasa Indonesia.
- source_word: לַגָּדִי
  choice: kepada orang Gad
  rationale: Bentuk gentilika menunjuk kepada kelompok suku Gad yang menerima wilayah.
- source_word: נָתַתִּי
  choice: kuberikan
  rationale: Menerjemahkan verba נתן secara langsung sambil mempertahankan orang pertama tunggal dan konteks pembagian wilayah.
- source_word: מִן הַגִּלְעָד
  choice: wilayah dari Gilead
  rationale: Kata 'wilayah' diperjelas dari konteks pembagian tanah agar rangkaian batas terbaca alami; מִן menandai titik awal cakupan.
- source_word: נַחַל
  choice: wadi
  rationale: Istilah ini mempertahankan keluasan makna alur air dan lembah terkait tanpa menyiratkan sungai yang selalu berair; konteks menyebut bagian tengahnya sebagai garis batas.
- source_word: תּוֹךְ הַנַּחַל וּגְבֻל
  choice: dengan bagian tengah wadi itu sebagai batas
  rationale: Menyatakan hubungan penjelas antara bagian tengah wadi dan fungsinya sebagai batas secara alami dalam bahasa Indonesia.
- source_word: גְּבוּל בְּנֵי עַמּוֹן
  choice: perbatasan bani Amon
  rationale: '''Bani Amon'' mempertahankan ungkapan kekerabatan Ibrani, sedangkan ''perbatasan'' sesuai dengan konteks geografis.'
