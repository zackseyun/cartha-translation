source:
  edition: WLC
  text: וָ/אֲצַ֣ו אֶתְ/כֶ֔ם בָּ/עֵ֥ת הַ/הִ֖וא לֵ/אמֹ֑ר יְהוָ֣ה אֱלֹהֵי/כֶ֗ם נָתַ֨ן לָ/כֶ֜ם אֶת הָ/אָ֤רֶץ הַ/זֹּאת֙ לְ/רִשְׁתָּ֔/הּ חֲלוּצִ֣ים תַּֽעַבְר֗וּ לִ/פְנֵ֛י אֲחֵי/כֶ֥ם בְּנֵֽי יִשְׂרָאֵ֖ל כָּל בְּנֵי חָֽיִל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/018.yaml
  text: And I commanded you at that time[a], saying, ‘Yahweh your God has given you this land to possess. You shall cross over armed before your brothers[c][b], the sons of Israel—all the men of valor.’
translation:
  language: id
  text: 'Pada waktu itu aku memerintahkan kalian: “Yahweh, Allah kalian, telah memberikan tanah ini kepada kalian untuk memilikinya. Semua laki-laki di antara kalian yang siap berperang harus menyeberang dalam keadaan bersenjata di depan saudara-saudara kalian, yaitu orang Israel.[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “saudara-saudara kalian, putra-putra Israel.” Ungkapan ini merujuk kepada sesama orang Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֲצַו אֶתְכֶם
  choice: aku memerintahkan kalian
  rationale: צוה menyatakan pemberian perintah; bentuk orang kedua jamak diterjemahkan jelas dengan 'kalian'.
- source_word: בָּעֵת הַהִוא
  choice: Pada waktu itu
  rationale: Ungkapan waktu baku yang alami dalam narasi bahasa Indonesia.
- source_word: לֵאמֹר
  choice: tanda titik dua
  rationale: Dalam bahasa Indonesia modern, fungsi pengantar kutipan langsung ini paling alami diungkapkan secara tipografis, tanpa 'dengan berkata' yang kaku.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh, Allah kalian
  rationale: Nama ilahi dipertahankan sebagai Yahweh, sedangkan אֱלֹהֵיכֶם diterjemahkan sesuai bentuk berkepunyaan orang kedua jamak.
- source_word: נָתַן לָכֶם
  choice: telah memberikan ... kepada kalian
  rationale: Bentuk perfektif menunjukkan tindakan yang sudah terlaksana dan tetap relevan bagi para pendengar.
- source_word: הָאָרֶץ הַזֹּאת
  choice: negeri ini
  rationale: Dalam konteks wilayah yang diberikan untuk diduduki, 'negeri' terdengar alami dan lebih tepat daripada 'tanah' sebagai bahan atau sebidang lahan.
- source_word: לְרִשְׁתָּהּ
  choice: untuk kalian miliki
  rationale: ירשׁ di sini menyatakan memperoleh dan memegang wilayah sebagai milik; pilihan ini menjaga tujuan pemberian tanpa menambahkan rincian yang tidak tersurat.
- source_word: חֲלוּצִים
  choice: dengan bersenjata
  rationale: Istilah ini menggambarkan pasukan yang diperlengkapi dan siap untuk tindakan militer.
- source_word: תַּעַבְרוּ
  choice: harus menyeberang
  rationale: Dalam konteks perintah langsung, bentuk imperfek memiliki daya wajib yang alami dinyatakan dengan 'harus'.
- source_word: לִפְנֵי
  choice: di depan
  rationale: Menunjukkan gerak mendahului kelompok Israel lainnya dalam susunan militer.
- source_word: אֲחֵיכֶם בְּנֵי יִשְׂרָאֵל
  choice: saudara-saudara kalian, yaitu orang Israel
  rationale: Mempertahankan metafora kekerabatan dan menjelaskan hubungan aposisional בְּנֵי יִשְׂרָאֵל secara alami.
- source_word: כָּל בְּנֵי חָיִל
  choice: semua laki-laki yang siap berperang
  rationale: Dalam konteks ini frasa tersebut menunjuk para laki-laki yang cakap dan tersedia untuk tugas tempur, bukan sekadar orang yang berani secara batiniah.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri perjanjian; transliterasi mempertahankan perbedaannya dari gelar אֱלֹהִים.
- issue: Cakupan gender dalam כָּל בְּנֵי חָיִל
  choice: semua laki-laki yang siap berperang
  alternative: semua pejuang
  rationale: Konteks mobilisasi militer dan bentuk maskulin mendukung rujukan khusus kepada laki-laki yang mampu bertempur; terjemahan netral dapat mengaburkan ciri ini.
- issue: Relasi sintaksis כָּל בְּנֵי חָיִל
  choice: ditempatkan sebagai sapaan yang menjelaskan kelompok 'kalian'
  alternative: dihubungkan dengan 'orang Israel'
  rationale: Frasa penutup paling masuk akal membatasi orang-orang dari suku-suku Transyordan yang wajib menyeberang, bukan menyatakan bahwa seluruh Israel berjalan di belakang mereka.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. 'Kalian' dipakai konsisten untuk bentuk orang kedua jamak. Susunan kalimat memperjelas bahwa semua laki-laki yang siap berperang dari kelompok yang disapa harus menyeberang dalam keadaan bersenjata, sambil mempertahankan metafora 'saudara-saudara' dari teks Ibrani.
