revisions:
- from: 'Pada waktu itu aku memerintahkan kalian: “Yahweh, Allah kalian, telah memberikan negeri ini kepada kalian untuk kalian miliki. Kalian, semua laki-laki yang siap berperang, harus menyeberang dengan bersenjata di depan saudara-saudara kalian, yaitu orang Israel.[a]”'
  to: 'Pada waktu itu aku memerintahkan kalian: “Yahweh, Allah kalian, telah memberikan tanah ini kepada kalian untuk memilikinya. Semua laki-laki di antara kalian yang siap berperang harus menyeberang dalam keadaan bersenjata di depan saudara-saudara kalian, yaitu orang Israel.[a]”'
  rationale: 'Revisi terbatas pada perbaikan tata bahasa dan keluwesan bahasa Indonesia, serta pada pengungkapan objek "tanah ini" yang lebih jelas. Terjemahan tetap mempertahankan urutan dan relasi pokok teks Ibrani: para laki-laki yang siap berperang dari kelompok yang disapa harus maju bersenjata mendahului saudara-saudara mereka, yakni orang Israel. Catatan kaki tetap tertambat pada rujukan "orang Israel" dan menjelaskan ungkapan kekerabatan Ibrani.'
