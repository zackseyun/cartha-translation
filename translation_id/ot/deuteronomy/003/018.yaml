  source_fidelity: 'Makna pokok diterjemahkan dengan baik: perintah Musa, pemberian tanah oleh Yahweh, tujuan untuk memilikinya, kewajiban mendahului sesama Israel, dan pembatasan kepada laki-laki yang layak berperang. Namun, frasa "dengan bersenjata" tidak gramatikal dalam bahasa Indonesia baku.'
  naturalness: Bahasa umumnya modern dan jelas. "Dalam keadaan bersenjata" merupakan pengganti yang alami dan tetap dekat dengan fungsi adverbial חֲלוּצִים. Susunan ulang juga menghindari sisipan aposisional yang agak berat tanpa mengubah cakupan "semua laki-laki yang siap berperang."
  terminology: '"Yahweh" dan "Allah kalian" tepat membedakan nama ilahi dan sebutan ilahi. "Tanah ini" lebih lazim bagi אֶרֶץ dalam konteks pemberian wilayah, sedangkan "memilikinya" secara alami merepresentasikan akhiran objek pada לְרִשְׁתָּהּ. "Laki-laki yang siap berperang" cukup menyampaikan בני חיל dalam konteks militer.'
