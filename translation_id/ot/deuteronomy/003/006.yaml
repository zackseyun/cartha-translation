  text: וַ/נַּחֲרֵ֣ם אוֹתָ֔/ם כַּ/אֲשֶׁ֣ר עָשִׂ֔ינוּ לְ/סִיחֹ֖ן מֶ֣לֶךְ חֶשְׁבּ֑וֹן הַחֲרֵם֙ כָּל עִ֣יר מְתִ֔ם הַ/נָּשִׁ֖ים וְ/הַ/טָּֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/006.yaml
  text: And we devoted them to destruction[a], just as we had done to Sihon king of Heshbon, utterly destroying every city—men, women, and little ones.
translation:
  language: id
  text: Kami menumpas mereka sampai habis[a], seperti yang telah kami lakukan terhadap Sihon, raja Hesbon, dengan menumpas sampai habis setiap kota beserta laki-laki, perempuan, dan anak-anak.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mengkhususkan mereka untuk dimusnahkan.” Kata kerja Ibrani ḥaram merupakan istilah khusus untuk menempatkan seseorang atau sesuatu di bawah ḥerem, yaitu menyerahkannya kepada kebinasaan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנַּחֲרֵם
  choice: Kami menumpas mereka sampai habis
  rationale: Bentuk hifil dari חרם menyatakan tindakan menempatkan orang atau benda di bawah ḥerem sehingga dimusnahkan. Ungkapan ini menyampaikan hasil tindakan dan sifat totalnya secara wajar dalam bahasa Indonesia; makna teknisnya dijelaskan dalam catatan kaki.
- source_word: כַּאֲשֶׁר עָשִׂינוּ
  choice: seperti yang telah kami lakukan
  rationale: Klausa perbandingan ini merujuk kembali kepada tindakan yang sudah dilakukan sebelumnya; kata 'telah' memperjelas urutan naratif tanpa menambah makna.
- source_word: לְסִיחֹן מֶלֶךְ חֶשְׁבּוֹן
  choice: terhadap Sihon, raja Hesbon
  rationale: Preposisi ל menandai pihak yang dikenai tindakan. 'Terhadap' merupakan padanan Indonesia yang alami dalam konstruksi ini.
- source_word: הַחֲרֵם
  choice: Kami menumpas sampai habis
  rationale: Infinitif absolut dari akar yang sama menegaskan dan menguraikan tindakan ḥerem. Pengulangan 'menumpas sampai habis' mempertahankan penekanan serta kekerasan makna Ibraninya.
- source_word: כָּל עִיר מְתִם הַנָּשִׁים וְהַטָּף
  choice: setiap kota beserta laki-laki, perempuan, dan anak-anak
  rationale: 'Susunan Ibrani menyebut setiap kota lalu merinci manusia yang dimusnahkan: kaum laki-laki, perempuan, dan anak-anak kecil. ''Beserta'' menghasilkan kalimat Indonesia yang alami tanpa mengaburkan cakupan total daftar tersebut.'
theological_decisions:
- issue: Bahasa חרם dalam konteks perang dan penghukuman
  choice: Menumpas ... sampai habis dalam teks utama, dengan makna teknis ḥerem dijelaskan dalam catatan kaki
  alternative: Mengkhususkan mereka untuk dimusnahkan; menempatkan mereka di bawah larangan
  rationale: Terjemahan utama tidak melunakkan pemusnahan total yang dinyatakan ayat ini, tetapi juga tidak memakai ungkapan teknis yang sukar dipahami pembaca umum. Catatan kaki mempertahankan dimensi bahwa חרם bukan sekadar kata umum untuk membunuh atau menghancurkan, melainkan istilah khusus untuk penyerahan kepada kebinasaan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. 'Menumpas sampai habis' dipilih agar berat dan cakupan total tindakan tetap nyata. Bentuk 'anak-anak' lebih alami daripada 'anak-anak kecil' dalam rangkaian ini, walaupun טף terutama menunjuk kepada anak-anak yang masih kecil.
