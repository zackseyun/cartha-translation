  terminology: Basan, Og, Manasye, Argob, dan Refaim konsisten dengan bentuk Indonesia yang lazim. Refaim tetap diperlakukan sebagai nama kelompok dalam teks utama; alternatif interpretatif “para raksasa” dibatasi pada catatan kaki.
