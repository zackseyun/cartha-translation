language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/יֶ֨תֶר הַ/גִּלְעָ֤ד וְ/כָל הַ/בָּשָׁן֙ מַמְלֶ֣כֶת ע֔וֹג נָתַ֕תִּי לַ/חֲצִ֖י שֵׁ֣בֶט הַֽ/מְנַשֶּׁ֑ה כֹּ֣ל חֶ֤בֶל הָֽ/אַרְגֹּב֙ לְ/כָל הַ/בָּשָׁ֔ן הַ/ה֥וּא יִקָּרֵ֖א אֶ֥רֶץ רְפָאִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/003/013.yaml
  text: And the rest of Gilead[a], and all Bashan, the kingdom of Og, I gave to the half-tribe of Manasseh—all the region of Argob, that is, all Bashan. That is called the land of the Rephaim.
translation:
  language: id
  text: Sisa wilayah Gilead dan seluruh Basan, yaitu kerajaan Og, kuberikan kepada setengah suku Manasye—seluruh wilayah Argob, yaitu seluruh Basan. Daerah itu disebut tanah orang Refaim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, menurut terjemahan tradisional, “tanah para raksasa”. “Refaim” adalah nama Ibrani bagi suatu bangsa kuno yang dikaitkan dengan wilayah ini.
    reason: Mencatat padanan interpretatif tradisional tanpa menggantikannya dengan nama kelompok dalam teks utama.
lexical_decisions:
- source_word: יֶתֶר הַגִּלְעָד
  choice: selebihnya dari Gilead
  rationale: Menunjukkan bagian Gilead yang masih tersisa setelah pembagian sebelumnya, dengan ungkapan Indonesia yang alami.
- source_word: כָל הַבָּשָׁן
  choice: seluruh Basan
  rationale: Mempertahankan daya cakup כֹּל dan memakai bentuk baku nama tempat Basan.
- source_word: מַמְלֶכֶת עוֹג
  choice: kerajaan Og
  rationale: Menerjemahkan konstruksi kepemilikan secara langsung dan mempertahankan sebutan politis wilayah tersebut.
- source_word: נָתַתִּי
  choice: kuberikan
  rationale: Mempertahankan verba umum 'memberikan' serta sudut pandang orang pertama tunggal dalam tuturan Musa.
- source_word: לַחֲצִי שֵׁבֶט הַמְנַשֶּׁה
  choice: kepada setengah suku Manasye
  rationale: Ungkapan ini jelas merujuk pada separuh suku Manasye yang menerima wilayah di seberang Yordan.
- source_word: כֹּל חֶבֶל הָאַרְגֹּב
  choice: seluruh wilayah Argob
  rationale: חֶבֶל di sini berarti kawasan atau distrik, bukan tali secara harfiah; 'wilayah' alami dan tepat.
- source_word: לְכָל הַבָּשָׁן
  choice: yaitu seluruh Basan
  rationale: Merender relasi frasa ini sebagai keterangan penjelas sesuai konteks, sambil tidak menambahkan rincian geografis yang tidak dinyatakan.
- source_word: הַהוּא
  choice: daerah itu
  rationale: Demonstrativa merujuk kembali pada wilayah yang baru disebut; nomina 'daerah' ditambahkan agar rujukannya jelas dalam bahasa Indonesia.
- source_word: יִקָּרֵא
  choice: disebut
  rationale: Bentuk pasif menyatakan penamaan yang berlaku; bentuk tanpa penanda waktu eksplisit alami dalam bahasa Indonesia dan tidak memaksakan kala lampau atau kini.
- source_word: אֶרֶץ רְפָאִים
  choice: negeri orang Refaim
  rationale: Mempertahankan Refaim sebagai nama kelompok bangsa dan tidak langsung menafsirkannya sebagai 'raksasa'.
theological_decisions:
- issue: Apakah רְפָאִים diterjemahkan sebagai nama suatu kelompok atau ditafsirkan sebagai 'raksasa'
  choice: negeri orang Refaim
  alternative: negeri para raksasa
  rationale: Dalam ayat ini רְפָאִים berfungsi sebagai nama kelompok yang dikaitkan dengan wilayah tersebut. Transliterasi menjaga keterbukaan leksikal, sedangkan pengertian tradisional dicantumkan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'kuberikan' mempertahankan tuturan orang pertama dengan ringkas; nama-nama tempat dan suku mengikuti bentuk Indonesia yang lazim. Tanda pisah membantu memperlihatkan penjelasan mengenai cakupan wilayah.
