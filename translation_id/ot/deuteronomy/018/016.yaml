revisions:
- from: Hal itu sesuai dengan segala yang kauminta kepada TUHAN[a], Allahmu, di Horeb pada hari perhimpunan itu. Engkau berkata, ‘Jangan biarkan aku terus mendengar suara TUHAN, Allahku, atau melihat lagi api yang besar ini, supaya aku tidak mati.’
  to: Seperti segala yang kauminta dari TUHAN[a], Allahmu, di Horeb pada hari perhimpunan itu, ketika engkau berkata, ‘Janganlah aku lagi mendengar suara TUHAN, Allahku, atau melihat lagi api besar ini, supaya aku tidak mati.’
  rationale: Revisi mengganti pembukaan dengan padanan komparatif yang lebih dekat dengan כְּכֹל dan memperbaiki bagian kutipan agar tidak menambahkan gagasan bahwa Allah secara aktif "membiarkan" atau menghalangi pembicara. "Ketika engkau berkata" dengan jelas menghubungkan לֵאמֹר dengan kutipan, sedangkan "supaya aku tidak mati" tetap menyampaikan hasil yang hendak dihindari.
