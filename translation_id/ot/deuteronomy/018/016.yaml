source:
  edition: WLC
  text: כְּ/כֹ֨ל אֲשֶׁר שָׁאַ֜לְתָּ מֵ/עִ֨ם יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ בְּ/חֹרֵ֔ב בְּ/י֥וֹם הַ/קָּהָ֖ל לֵ/אמֹ֑ר לֹ֣א אֹסֵ֗ף לִ/שְׁמֹ֨עַ֙ אֶת קוֹל֙ יְהוָ֣ה אֱלֹהָ֔/י וְ/אֶת הָ/אֵ֨שׁ הַ/גְּדֹלָ֥ה הַ/זֹּ֛את לֹֽא אֶרְאֶ֥ה ע֖וֹד וְ/לֹ֥א אָמֽוּת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/016.yaml
  text: just as you asked from the LORD your God at Horeb on the day of the assembly, saying, ‘Let me not continue to hear the voice of the LORD my God, and let me not see this great fire anymore, lest I die.’
translation:
  language: id
  text: Seperti segala yang kauminta dari TUHAN[a], Allahmu, di Horeb pada hari perhimpunan itu, ketika engkau berkata, ‘Janganlah aku lagi mendengar suara TUHAN, Allahku, atau melihat lagi api besar ini, supaya aku tidak mati.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'TUHAN: teks Ibrani memakai nama ilahi YHWH.'
    reason: Menjelaskan dasar teks bagi konvensi tipografis "TUHAN".
lexical_decisions:
- source_word: כְּכֹל אֲשֶׁר שָׁאַלְתָּ
  choice: sesuai dengan segala yang kauminta
  rationale: Menyampaikan makna kesesuaian dari כְּכֹל dan tetap mempertahankan bentuk orang kedua tunggal pada שָׁאַלְתָּ.
- source_word: מֵעִם יְהוָה אֱלֹהֶיךָ
  choice: kepada TUHAN, Allahmu
  rationale: מֵעִם dalam konteks tindakan meminta secara alami diterjemahkan 'kepada'; bentuk pronominal tunggal dipertahankan dalam 'Allahmu'.
- source_word: בְּיוֹם הַקָּהָל
  choice: pada hari perhimpunan itu
  rationale: הַקָּהָל menunjuk pada perhimpunan umat di Horeb; 'perhimpunan' mempertahankan unsur berkumpul tanpa menambahkan istilah kelembagaan.
- source_word: לֹא אֹסֵף לִשְׁמֹעַ
  choice: Jangan biarkan aku terus mendengar
  rationale: אֹסֵף dengan infinitif berarti melanjutkan atau melakukan lagi; bentuk permohonan dalam konteks שָׁאַלְתָּ disampaikan secara alami dengan 'Jangan biarkan aku'.
- source_word: וְאֶת הָאֵשׁ הַגְּדֹלָה הַזֹּאת לֹא אֶרְאֶה עוֹד
  choice: atau melihat lagi api yang besar ini
  rationale: Dalam rangkaian negatif bahasa Indonesia, 'atau' lebih alami daripada 'dan' dan tidak mengubah bahwa kedua pengalaman itu sama-sama ditolak; עוֹד diterjemahkan 'lagi'.
- source_word: וְלֹא אָמוּת
  choice: supaya aku tidak mati
  rationale: Dalam konteks permohonan, waw diikuti negasi menyatakan akibat atau tujuan yang hendak dihindari; 'supaya' menyampaikan hubungan itu tanpa memastikan bahwa kematian pasti terjadi.
theological_decisions:
- issue: Penyajian nama ilahi יהוה
  choice: TUHAN dengan huruf kapital kecil penuh dan catatan kaki
  alternative: YHWH atau Yahweh
  rationale: Mengikuti kebiasaan luas Alkitab bahasa Indonesia sambil menjelaskan bentuk nama dalam teks Ibrani; pilihan ini tidak memasukkan penafsiran denominasi tertentu.
- issue: Hubungan antara melihat api dan kematian
  choice: supaya aku tidak mati
  alternative: dan aku tidak akan mati
  rationale: Konteks permintaan menunjukkan bahwa kematian adalah akibat yang hendak dihindari. Terjemahan tujuan mempertahankan ketegangan tanpa menyatakan janji mutlak bahwa si pembicara tidak akan mati.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti 'engkau' mempertahankan sapaan orang kedua tunggal dalam teks Ibrani, sedangkan kutipan memakai 'aku' sesuai bentuk orang pertama tunggal kolektif. Susunan kalimat dipecah menjadi dua agar hubungan dengan ayat sebelumnya dan kutipan langsung mudah dipahami.
