  source_fidelity: Revisi diperlukan karena waw sebelum וְנַחֲלָתוֹ secara dasar berarti “dan.” Terjemahan “yaitu” memilih hubungan aposisional yang mungkin, tetapi tidak mempertahankan ambiguitas sintaksis Ibrani dalam teks utama. Modalitas “harus makan” juga lebih mudah dibaca sebagai kewajiban daripada ketetapan mengenai sumber penghidupan/hak mereka.
  naturalness: Teksnya umumnya jelas dan modern. “Tidak akan mendapat” dan “mereka akan makan” lebih alami untuk ketetapan hukum dan tidak menambahkan nuansa kewajiban. Bentuk “milik pusakanya” dapat dipertahankan dengan huruf kecil untuk membiarkan acuan akhiran tunggal tetap terbuka.
  terminology: “Para imam Lewi,” “seluruh suku Lewi,” “bagian,” “milik pusaka,” dan “Yahweh” sesuai register dan istilah kunci. “Persembahan api bagi Yahweh” mencerminkan istilah kultis אִשֵּׁי יְהוָה tanpa menyatakan bahwa seluruh persembahan itu sendiri dibakar habis.
