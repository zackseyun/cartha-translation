  text: לֹֽא יִ֠הְיֶה לַ/כֹּהֲנִ֨ים הַ/לְוִיִּ֜ם כָּל שֵׁ֧בֶט לֵוִ֛י חֵ֥לֶק וְ/נַחֲלָ֖ה עִם יִשְׂרָאֵ֑ל אִשֵּׁ֧י יְהוָ֛ה וְ/נַחֲלָת֖/וֹ יֹאכֵלֽוּ/ן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/001.yaml
  text: The Levitical priests—all the tribe of Levi—shall have no portion or inheritance with Israel[a]; they shall eat the food offerings of Yahweh, that is[b], his inheritance.
translation:
  language: id
  text: Para imam Lewi—seluruh suku Lewi—tidak akan mendapat bagian atau milik pusaka bersama orang Israel. Mereka akan makan persembahan api bagi Yahweh[a] dan milik pusakanya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “persembahan-persembahan api Yahweh,” yaitu persembahan yang dipersembahkan kepada Yahweh dengan api.
    reason: lexical_alternative
  - marker: b
    text: Akhiran Ibrani berbentuk tunggal. Akar katanya dapat mengacu kepada Lewi sebagai satu kesatuan; bandingkan ayat 2, yang menyatakan bahwa Yahweh adalah milik pusaka mereka. Kata “dan” dalam Ibrani juga dapat dipahami secara penjelas, “yaitu milik pusakanya.”
    reason: ambiguity_and_cross_reference
lexical_decisions:
- source_word: לַכֹּהֲנִים הַלְוִיִּם
  choice: Para imam Lewi
  rationale: Frasa ini merupakan aposisi yang mengidentifikasi para imam sebagai orang Lewi. Bentuk ini ringkas dan wajar dalam bahasa Indonesia tanpa menjadikan imam dan orang Lewi dua kelompok terpisah.
- source_word: כָּל שֵׁבֶט לֵוִי
  choice: seluruh suku Lewi
  rationale: כָּל menegaskan bahwa cakupannya adalah segenap suku Lewi, bukan hanya para imam dalam arti sempit.
- source_word: חֵלֶק וְנַחֲלָה
  choice: bagian atau milik pusaka
  rationale: Pasangan istilah ini menunjuk pada jatah dan hak warisan, khususnya tanah. Kata 'atau' menyampaikan penyangkalan menyeluruh dengan bahasa Indonesia yang alami.
- source_word: עִם יִשְׂרָאֵל
  choice: bersama orang Israel
  rationale: Ungkapan ini menyatakan bahwa suku Lewi tidak memperoleh jatah milik bersama suku-suku Israel lainnya.
- source_word: אִשֵּׁי יְהוָה
  choice: persembahan yang dibakar bagi Yahweh
  rationale: אִשִּׁים berkaitan dengan persembahan yang dipersembahkan melalui api. Terjemahan ini mempertahankan citra kultis teks Ibrani, sedangkan catatan menjelaskan bahwa bagian tertentu menjadi makanan para imam.
- source_word: וְנַחֲלָתוֹ
  choice: yaitu milik pusakanya
  rationale: Akhiran orang ketiga tunggal dipertahankan melalui '-nya'. Kata 'yaitu' mencerminkan kemungkinan hubungan penjelas dengan persembahan sebelumnya, sementara catatan mempertahankan kemungkinan bahwa acuannya ialah Lewi secara kolektif.
- source_word: יֹאכֵלוּן
  choice: Mereka harus makan
  rationale: Bentuk imperfek dalam konteks hukum menyatakan ketetapan atau hak yang berlaku. 'Harus makan' sesuai dengan gaya perundangan dan subjek jamaknya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
theological_decisions:
- issue: Acuan akhiran tunggal dalam וְנַחֲלָתוֹ
  choice: Mempertahankan bentuk tunggal yang tidak ditentukan secara eksplisit melalui 'milik pusakanya'
  alternative: milik pusaka mereka; milik pusaka Yahweh
  rationale: Bentuk Ibrani memakai akhiran maskulin tunggal. Acuannya dapat dipahami sebagai Lewi secara kolektif, sejalan dengan Ulangan 18:2, tetapi terjemahan utama tidak mengubahnya menjadi jamak ataupun secara tegas mengacu kepada Yahweh.
- issue: Hubungan וְנַחֲלָתוֹ dengan אִשֵּׁי יְהוָה
  choice: yaitu milik pusakanya
  alternative: dan milik pusakanya
  rationale: 'Konteks mendukung pembacaan penjelas: persembahan bagi Yahweh merupakan milik pusaka yang menopang orang Lewi. Namun karena waw secara bentuk dapat berarti ''dan'', kemungkinan itu dicatat agar ketegangan sintaksis tidak dihapus.'
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama ilahi secara langsung; 'Yahweh' mempertahankan nama perjanjian itu dalam bentuk yang lazim secara akademis dan mudah dibaca.
translation_notes:
  register: Bahasa Indonesia modern, resmi, dan mudah dipahami. Tanda pisah mempertahankan aposisi yang memperluas cakupan dari para imam Lewi kepada seluruh suku Lewi. Istilah 'milik pusaka' dipilih untuk konteks pembagian warisan tanah dan untuk menjaga kaitannya dengan ayat berikutnya.
