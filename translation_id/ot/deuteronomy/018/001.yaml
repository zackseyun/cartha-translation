  - severity: low
    issue: “Mereka harus makan” dapat mengesankan perintah atau kewajiban.
    rationale: Imperfek dalam perundangan ini menyatakan ketetapan/penyediaan bagi orang Lewi. “Mereka akan makan” menyampaikan fungsi itu tanpa nuansa deontik tambahan.
