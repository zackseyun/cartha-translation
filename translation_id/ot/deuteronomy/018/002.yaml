  text: וְ/נַחֲלָ֥ה לֹא יִֽהְיֶה לּ֖/וֹ בְּ/קֶ֣רֶב אֶחָ֑י/ו יְהוָה֙ ה֣וּא נַחֲלָת֔/וֹ כַּ/אֲשֶׁ֖ר דִּבֶּר לֽ/וֹ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/002.yaml
  text: He shall have no inheritance among his brothers[a]; Yahweh is his inheritance[b], as he spoke to him.
translation:
  language: id
  text: Ia tidak akan mendapat warisan di antara saudara-saudaranya[a]; Yahweh adalah warisannya, sebagaimana Ia telah berfirman kepadanya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kaum kerabatnya.” Secara harfiah, teks Ibrani berbunyi “saudara-saudaranya,” yang dalam konteks menunjuk kepada sesama orang Israel, khususnya suku-suku lainnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “sebagaimana Ia telah berkata kepadanya.” Kata kerja Ibrani yang dipakai adalah kata umum untuk “berbicara” atau “berkata”; menerjemahkannya “menjanjikan” dimungkinkan oleh konteks, tetapi lebih bersifat tafsiran.
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחֲלָה / נַחֲלָתוֹ
  choice: warisan / warisannya
  rationale: Dalam konteks pembagian tanah di Ulangan, נַחֲלָה menunjuk pada warisan atau bagian turun-temurun yang dialokasikan. Pengulangan istilah yang sama dipertahankan agar makna harfiah pada klausa pertama dan makna metaforis-kovenantal pada klausa kedua tetap saling terkait.
- source_word: בְּקֶרֶב
  choice: di antara
  rationale: Ungkapan בְּקֶרֶב אֶחָיו secara idiomatis berarti 'di antara saudara-saudaranya'; bentuk ini alami dalam bahasa Indonesia modern.
- source_word: אֶחָיו
  choice: saudara-saudaranya
  rationale: Bentuk Ibraninya secara harfiah berarti 'saudara-saudaranya'. Dalam konteks, yang dimaksud ialah sesama orang Israel, khususnya suku-suku Israel lainnya; teks utama mempertahankan bentuk sumber tanpa mempersempitnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: הוּא
  choice: adalah
  rationale: Pronomina mandiri הוּא memberi penekanan, tetapi dalam bahasa Indonesia penekanan tersebut cukup terwakili oleh struktur langsung 'Yahweh adalah warisannya' tanpa menambahkan ungkapan yang kaku.
- source_word: כַּאֲשֶׁר דִּבֶּר לוֹ
  choice: sebagaimana Ia telah berfirman kepadanya
  rationale: דִּבֶּר adalah verba umum untuk berbicara atau berkata. 'Berfirman' merupakan padanan Indonesia yang wajar ketika subjeknya Allah dan tidak menambahkan gagasan eksplisit tentang janji. Aspek perfektif diterjemahkan dengan 'telah'.
theological_decisions:
- issue: Acuan pronomina tunggal ('ia', '-nya')
  choice: Bentuk tunggal dipertahankan sebagai rujukan kolektif atau representatif kepada orang Lewi/imam Lewi.
  alternative: Pronomina dapat dipahami menunjuk khusus kepada Lewi sebagai leluhur suku atau secara distributif kepada setiap imam.
  rationale: Konteks langsung membahas para imam Lewi dan suku Lewi, sedangkan bahasa Ibrani lazim memakai bentuk tunggal untuk rujukan kolektif atau representatif. Terjemahan tidak memaksakan salah satu kemungkinan yang lebih sempit.
- issue: Makna 'Yahweh adalah warisannya'
  choice: Pernyataan metaforis-kovenantal dipertahankan tanpa uraian tambahan.
  alternative: Menjelaskannya sebagai 'Yahweh adalah bagian yang diberikan kepadanya sebagai pengganti tanah'.
  rationale: Teks Ibrani menyatakan secara padat bahwa Yahweh sendiri adalah warisannya. Mempertahankan ungkapan itu menjaga kekayaan dan ketegangan teologis sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Ia' dipakai untuk pronomina manusia tunggal, sedangkan 'Ia' pada klausa terakhir merujuk kepada Yahweh; kapitalisasi membantu membedakan rujukan tanpa menambah penjelasan ke dalam teks. Istilah 'warisan' diulang untuk mencerminkan pengulangan נַחֲלָה dalam bahasa Ibrani.
