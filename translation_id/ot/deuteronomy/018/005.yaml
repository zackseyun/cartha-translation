base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/005.yaml
  text: For Yahweh your God has chosen him from all your tribes to stand and minister in the name of Yahweh[a], he and his sons all the days.
translation:
  language: id
  text: Sebab Yahweh, Allahmu, telah memilih dia dari antara semua sukumu untuk berdiri dan melayani dalam nama Yahweh—dia dan putra-putranya—sepanjang masa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “sepanjang hari-hari”; ungkapan Ibrani ini menunjuk pada pelayanan yang berlangsung terus-menerus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mempertahankan fungsi kausal yang memberikan alasan bagi ketentuan pada ayat sebelumnya.
- source_word: בּוֹ בָּחַר
  choice: dialah yang telah dipilih
  rationale: Dengan verba בחר, preposisi ב menandai orang yang dipilih. Bentuk pasif berfokus pada orang Lewi yang sedang dibicarakan dan terdengar alami dalam bahasa Indonesia.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Allahmu
  rationale: Nama ilahi יְהוָה ditransliterasikan sebagai Yahweh, sedangkan bentuk bersufiks אֱלֹהֶיךָ diterjemahkan secara wajar sebagai 'Allahmu'.
- source_word: מִכָּל שְׁבָטֶיךָ
  choice: dari antara semua sukumu
  rationale: '''Dari antara'' menjelaskan bahwa pemilihan dilakukan dari kumpulan seluruh suku Israel.'
- source_word: לַעֲמֹד לְשָׁרֵת
  choice: untuk berdiri dan melayani
  rationale: Mempertahankan gambaran konkret 'berdiri' sekaligus fungsi pelayanan keimaman, tanpa mereduksinya menjadi ungkapan fungsional semata.
- source_word: בְּשֵׁם יְהוָה
  choice: dalam nama Yahweh
  rationale: Mempertahankan ungkapan sumber yang dapat mencakup pelayanan di bawah kewenangan nama Yahweh maupun pelayanan yang berkaitan dengan penyebutan nama-Nya.
- source_word: הוּא וּבָנָיו
  choice: dia dan anak-anak lelakinya
  rationale: בָּנָיו secara khusus berarti anak-anak lelaki dan dalam konteks ini menunjuk pada kesinambungan pelayanan keimaman melalui garis keturunan laki-laki.
- source_word: כָּל הַיָּמִים
  choice: sepanjang masa
  rationale: Ungkapan idiomatis Indonesia ini menyampaikan keberlangsungan yang terus-menerus, sementara bentuk harfiahnya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian sebagai nama diri.
- issue: Bahasa pewarisan pelayanan imam yang bergender
  choice: anak-anak lelakinya
  alternative: anak-anaknya atau keturunannya
  rationale: Teks Ibrani secara eksplisit memakai bentuk maskulin 'anak-anak lelakinya', dan konteksnya menyangkut kesinambungan pelayanan imam Lewi.
- issue: Durasi pelayanan imam
  choice: sepanjang masa
  alternative: sepanjang hari-hari
  rationale: Ungkapan Ibrani mempertahankan ketegangan antara bentuk harfiah 'seluruh hari' dan makna idiomatis keberlangsungan. Teks utama memakai bahasa Indonesia yang alami tanpa menentukan lebih jauh sifat metafisis durasinya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Tanda pisah mengapit subjek gabungan untuk memperjelas bahwa baik orang Lewi tersebut maupun anak-anak lelakinya termasuk dalam pelayanan yang berkelanjutan. Ungkapan 'dalam nama Yahweh' sengaja dipertahankan agar cakupan makna Ibraninya tidak dipersempit menjadi sekadar perwakilan resmi.
