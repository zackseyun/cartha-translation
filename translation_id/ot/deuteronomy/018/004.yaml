base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/004.yaml
  text: You shall give him the firstfruits of your grain[a], your new wine, and your oil[c][b], and the first of the fleece of your flock.
translation:
  language: id
  text: Berikanlah kepadanya hasil pertama dari biji-bijianmu[a], anggur barumu[b], dan minyakmu, serta hasil pertama dari pencukuran bulu kawanan ternakmu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bagian pertama dari biji-bijianmu, anggurmu, dan minyakmu.”
    reason: lexical_alternative
  - marker: b
    text: “Anggur baru” menerjemahkan istilah Ibrani yang sering digunakan untuk anggur yang baru dihasilkan.
    reason: cultural_note
  - marker: c
    text: Atau, “bulu pertama dari kawanan ternakmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  choice: hasil pertama
  rationale: Kata ini menunjuk pada bagian awal atau yang pertama. Pilihan 'hasil pertama' wajar untuk hasil pertanian dan tetap dapat dipakai bagi hasil pencukuran tanpa memaksakan gagasan 'yang terbaik' yang tidak dinyatakan secara eksplisit.
- source_word: דָּגָן
  choice: gandum
  rationale: Istilah ini mencakup biji-bijian atau hasil serealia secara umum. 'Gandum' mudah dipahami dalam bahasa Indonesia, meskipun dalam konteks ini dapat mewakili hasil biji-bijian secara lebih luas.
- source_word: תִּירוֹשׁ
  choice: anggur baru
  rationale: Istilah ini lazim menunjuk pada anggur yang baru dihasilkan. 'Anggur baru' mempertahankan pembedaan leksikalnya dari istilah umum untuk anggur.
- source_word: יִצְהָר
  choice: minyak
  rationale: Kata ini menunjuk pada minyak segar, biasanya minyak zaitun dalam konteks Israel kuno. 'Minyak' mengikuti keluasan ungkapan Ibrani tanpa mempersempitnya secara tidak perlu.
- source_word: גֵּז
  choice: hasil pencukuran
  rationale: Kata ini dapat berarti bulu yang dicukur ataupun hasil/tindakan pencukuran. 'Hasil pencukuran' menyampaikan barang yang diberikan dan mempertahankan kemungkinan nuansa frasa Ibraninya.
- source_word: צֹאן
  choice: kawanan ternak
  rationale: Istilah kolektif ini dapat mencakup ternak kecil, terutama domba dan kambing. 'Kawanan ternak' lebih luas daripada 'domba' dan alami dalam konstruksi ini.
- source_word: תִּתֶּן לּוֹ
  choice: Berikanlah kepadanya
  rationale: Bentuk verba berfungsi sebagai ketetapan hukum. Imperatif sopan-tegas 'Berikanlah' alami dalam bahasa Indonesia dan mempertahankan daya preskriptifnya; 'kepadanya' menjaga pronomina tunggal Ibrani.
theological_decisions:
- issue: Rujukan pronomina לוֹ ('kepadanya')
  choice: Mempertahankan bentuk tunggal 'kepadanya'
  alternative: Menyebut secara eksplisit 'kepada imam' atau memahami golongan imam secara kolektif
  rationale: Konteks langsung menunjukkan penerima dari kalangan imam, tetapi ayat ini sendiri memakai pronomina tunggal. Terjemahan mempertahankan bentuk gramatikal itu tanpa menambahkan penentuan yang lebih khusus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk hukum disampaikan dengan imperatif 'Berikanlah'. Penanda catatan kaki ditempatkan tepat pada unsur yang dijelaskan, dan urutannya dinormalkan menjadi [a], [b], [c].
