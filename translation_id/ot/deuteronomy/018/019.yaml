  text: וְ/הָיָ֗ה הָ/אִישׁ֙ אֲשֶׁ֤ר לֹֽא יִשְׁמַע֙ אֶל דְּבָרַ֔/י אֲשֶׁ֥ר יְדַבֵּ֖ר בִּ/שְׁמִ֑/י אָנֹכִ֖י אֶדְרֹ֥שׁ מֵ/עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/019.yaml
  text: And the man who does not listen to my words that he speaks in my name—I myself will require it from him[a].
translation:
  language: id
  text: Dan orang yang tidak mendengarkan perkataan-Ku yang akan diucapkannya dalam nama-Ku, Aku sendiri akan meminta pertanggungjawaban darinya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Aku sendiri akan menuntutnya dari dia,” yaitu Allah akan meminta pertanggungjawaban atas penolakan terhadap perkataan yang disampaikan nabi itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Dan
  rationale: Bentuk ini mengantar akibat dari janji pada ayat sebelumnya. Dalam bahasa Indonesia, “Dan” mempertahankan kesinambungan wacana tanpa ungkapan kaku seperti “Dan akan terjadi”.
- source_word: הָאִישׁ
  choice: orang
  rationale: Nomina Ibrani berbentuk tunggal maskulin, tetapi di sini berfungsi secara umum untuk siapa pun yang menolak mendengarkan. “Orang” alami dalam bahasa Indonesia dan tidak mengubah jumlah tunggalnya.
- source_word: לֹא יִשְׁמַע אֶל
  choice: tidak mendengarkan
  rationale: Konstruksi שׁמע dengan אֶל mencakup tindakan mendengar dengan implikasi mengindahkan. “Tidak mendengarkan” mempertahankan kedua nuansa itu tanpa mempersempitnya menjadi “tidak menaati”.
- source_word: דְּבָרַי
  choice: perkataan-Ku
  rationale: Bentuk Ibrani adalah jamak dengan akhiran orang pertama. “Perkataan-Ku” menyampaikan ucapan Allah secara alami dan bermartabat dalam bahasa Indonesia.
- source_word: אֲשֶׁר יְדַבֵּר
  choice: yang akan diucapkannya
  rationale: Klausa relatif ini menunjuk kepada perkataan yang akan diucapkan nabi yang dijanjikan dalam ayat sebelumnya. Bentuk “akan” mempertahankan daya prospektif verba Ibrani.
- source_word: בִּשְׁמִי
  choice: dalam nama-Ku
  rationale: Ungkapan harfiah ini jelas dalam bahasa Indonesia dan mempertahankan bobot teologis tindakan berbicara sebagai wakil yang membawa wewenang Allah.
- source_word: אָנֹכִי
  choice: Aku sendiri
  rationale: Pronomina mandiri memberi penekanan pada Allah sebagai pihak yang secara pribadi menuntut pertanggungjawaban.
- source_word: אֶדְרֹשׁ מֵעִמּוֹ
  choice: akan meminta pertanggungjawaban darinya
  rationale: Dalam konteks ini, דרשׁ dengan מעם menyatakan bahwa Allah menuntut jawaban atau pertanggungjawaban. Pilihan ini alami dalam bahasa Indonesia dan tidak menentukan bentuk hukuman yang tidak dijelaskan teks.
theological_decisions:
- issue: Sifat tindakan Allah terhadap orang yang menolak perkataan nabi
  choice: Aku sendiri akan meminta pertanggungjawaban darinya
  alternative: Aku sendiri akan menuntutnya dari dia
  rationale: Teks menyatakan pertanggungjawaban dan penghakiman ilahi tanpa menjelaskan bentuk hukumannya. Terjemahan utama menyampaikan makna yudisial tersebut, sedangkan catatan kaki mempertahankan bentuk harfiah dan ketegangan teks.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan khidmat. Huruf kapital pada bentuk terikat “-Ku” mengikuti konvensi penghormatan bagi rujukan kepada Allah. Pronomina “-nya” dibiarkan mengikuti bentuk sumber dan konteks ayat sebelumnya tanpa memasukkan nama atau gelar tambahan ke dalam teks.
