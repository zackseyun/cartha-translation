  yaml_path: translation/ot/deuteronomy/018/008.yaml
  text: They shall eat equal portions[a], besides what comes from the sale of his patrimony.
translation:
  language: id
  text: Mereka akan menerima bagian yang sama untuk dimakan,[a] selain hasil penjualan harta warisan keluarganya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Mereka akan makan bagian yang sama.” Frasa Ibrani pada bagian akhir ayat ini sulit; mungkin artinya “selain apa yang diterimanya dari penjualan milik keluarga,” atau, lebih umum, pendapatan yang berkaitan dengan keluarga leluhurnya.
    reason: alternative_reading
lexical_decisions:
- source_word: חֵלֶק כְּחֵלֶק
  choice: bagian makanan yang sama besar
  rationale: Ungkapan harfiah “bagian seperti bagian” menyatakan kesetaraan pembagian. Penambahan “makanan” sesuai dengan verba “makan” dan memperjelas konteks tunjangan imam tanpa mengubah acuannya.
- source_word: יֹאכֵלוּ
  choice: harus mendapat ... makanan
  rationale: Secara harfiah berarti “mereka akan makan”. Dalam konteks pembagian tunjangan untuk pelayanan, ungkapan Indonesia ini mempertahankan gambaran makanan sekaligus menyampaikan bahwa mereka berhak atas bagian tersebut.
- source_word: לְבַד
  choice: di samping
  rationale: Menandai sesuatu yang terpisah dan merupakan tambahan terhadap bagian yang sama.
- source_word: מִמְכָּרָיו
  choice: hasil penjualan
  rationale: Bentuk ini dapat menunjuk pada barang yang dijual atau hasil penjualannya. “Hasil penjualan” alami dalam bahasa Indonesia dan cocok dengan gagasan sumber pendapatan tersendiri.
- source_word: עַל הָאָבוֹת
  choice: harta warisan keluarganya
  rationale: Frasa harfiah “atas para leluhur/bapa” bersifat eliptis dan sulit. Pilihan ini menyampaikan kemungkinan rujukan pada milik atau hak yang berkaitan dengan keluarga leluhur, sedangkan ketidakpastiannya dicatat dalam catatan kaki.
theological_decisions:
- issue: Penafsiran frasa akhir מִמְכָּרָיו עַל הָאָבוֹת
  choice: Pendapatan dari penjualan harta warisan keluarga merupakan tambahan di luar bagian pelayanan yang sama.
  alternative: Di samping apa yang diterimanya dari penjualan milik keluarga; atau, di samping pendapatan lain yang berkaitan dengan keluarga leluhurnya.
  rationale: Bahasa Ibrani sangat padat dan hubungan sintaksisnya tidak pasti. Teks utama memakai pembacaan yang koheren dengan konteks hak orang Lewi, tetapi catatan kaki mempertahankan kemungkinan cakupan yang lebih umum dan tidak menjadikannya dasar bagi klaim doktrinal tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. “Bagian makanan” dipilih agar idiom konkret יֹאכֵלוּ tetap terasa, sementara “harus mendapat” terdengar lebih alami daripada konstruksi harfiah yang kaku. Ketidakpastian frasa akhir dipertahankan melalui catatan kaki.
