  terminology: “Bagian” cocok untuk חֵלֶק. “Harta warisan keluarga” merupakan penafsiran yang masuk akal atas עַל הָאָבוֹת, tetapi tidak boleh disajikan seolah-olah pasti; catatan kaki mempertahankan alternatif yang lebih luas. Tidak ada istilah teologis atau nama yang perlu disesuaikan.
