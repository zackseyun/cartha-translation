  text: כִּ֣י הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה אֲשֶׁ֤ר אַתָּה֙ יוֹרֵ֣שׁ אוֹתָ֔/ם אֶל מְעֹנְנִ֥ים וְ/אֶל קֹסְמִ֖ים יִשְׁמָ֑עוּ וְ/אַתָּ֕ה לֹ֣א כֵ֔ן נָ֛תַן לְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/014.yaml
  text: For these nations[a], which you are dispossessing, listen to soothsayers and diviners; but as for you[c][b], Yahweh your God has not allowed you to do this.
translation:
  language: id
  text: Sebab bangsa-bangsa yang akan kaududuki itu mendengarkan para penafsir pertanda dan juru ramal. Namun, Yahweh, Allahmu, tidak memberikan yang demikian itu kepadamu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “tetapi engkau, tidak demikian yang telah Yahweh, Allahmu, berikan kepadamu.” Objek dari “memberikan” tidak disebutkan; dalam konteks, kalimat ini juga dapat dipahami sebagai, “Yahweh, Allahmu, tidak mengizinkanmu berbuat demikian.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau penjelasan bagi larangan-larangan dalam konteks sebelumnya.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: bangsa-bangsa ... itu
  rationale: Ungkapan ini menunjuk kepada bangsa-bangsa non-Israel yang mendiami negeri yang akan dimasuki Israel.
- source_word: אֲשֶׁר אַתָּה יוֹרֵשׁ אֹתָם
  choice: yang negerinya akan kaududuki
  rationale: Dalam konteks Ulangan, ירשׁ mencakup mengambil alih kepemilikan dengan menyingkirkan penduduk sebelumnya. Penyebutan 'negerinya' membuat ungkapan ini wajar dalam bahasa Indonesia, sementara catatan kaki mempertahankan keluasan maknanya.
- source_word: אֶל מְעֹנְנִים
  choice: kepada para penafsir pertanda
  rationale: Istilah ini menunjuk kepada orang yang membaca atau menafsirkan pertanda; terjemahan ini jelas bagi pembaca modern tanpa menetapkan secara pasti teknik ramalannya.
- source_word: וְאֶל קֹסְמִים
  choice: dan juru tenung
  rationale: קֹסְמִים adalah para pelaku tenung atau ramalan. 'Juru tenung' membedakannya dari penafsir pertanda sambil mempertahankan nuansa religio-magis.
- source_word: יִשְׁמָעוּ
  choice: mendengarkan
  rationale: Terjemahan ini mempertahankan arti dasar שׁמע dan dalam konteks menyiratkan bahwa bangsa-bangsa itu mengindahkan petunjuk para praktisi tersebut.
- source_word: וְאַתָּה לֹא כֵן נָתַן לְךָ
  choice: Namun, ... tidak memberikan hal yang demikian kepadamu
  rationale: Bahasa Ibrani bersifat eliptis, secara harfiah kira-kira 'tetapi engkau, tidak demikian telah diberikan kepadamu'. 'Hal yang demikian' melengkapi kalimat Indonesia tanpa mempersempit rujukannya secara berlebihan.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Allahmu
  rationale: Nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh', sedangkan אֱלֹהֶיךָ diterjemahkan 'Allahmu'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama pribadi ilahi secara langsung; 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Objek tersirat dari נָתַן לְךָ
  choice: tidak memberikan hal yang demikian kepadamu
  alternative: tidak mengizinkanmu berbuat demikian
  rationale: Teks Ibrani memakai verba 'memberikan' dan tidak menyatakan objeknya. Terjemahan utama mempertahankan metafora pemberian serta ketaktertentuan objek, sedangkan tafsiran izin dijelaskan sebagai kemungkinan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Bentuk terikat 'kau-' dipakai secara konsisten untuk sapaan tunggal. Istilah 'penafsir pertanda' dipilih demi kejelasan modern, sedangkan 'juru tenung' mempertahankan pembedaan antara kedua kelompok praktisi.
