id: DEU.18.6
reference: Deuteronomy 18:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/כִֽי יָבֹ֨א הַ/לֵּוִ֜י מֵ/אַחַ֤ד שְׁעָרֶ֨י/ךָ֙ מִ/כָּל יִשְׂרָאֵ֔ל אֲשֶׁר ה֖וּא גָּ֣ר שָׁ֑ם וּ/בָא֙ בְּ/כָל אַוַּ֣ת נַפְשׁ֔/וֹ אֶל הַ/מָּק֖וֹם אֲשֶׁר יִבְחַ֥ר יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/006.yaml
  text: And if the Levite comes from one of your gates out of all Israel[a], where he is residing, and comes with all the desire of his soul to the place that Yahweh will choose[b],
translation:
  language: id
  text: Jika seorang Lewi datang dari salah satu kotamu, dari mana pun di Israel[a], tempat ia tinggal sebagai pendatang, lalu datang dengan segenap keinginan hatinya ke tempat yang akan dipilih Yahweh[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “dari salah satu gerbangmu.” Di sini “gerbang” secara metonimis menunjuk pada kota atau permukiman.
    reason: cultural_note
  - marker: b
    text: Atau, “dengan segenap hasratnya” atau “dengan segala kerinduan jiwanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Jika
  rationale: Dalam konteks hukum kasuistik, bentuk ini memperkenalkan syarat yang berkaitan dengan ketentuan sebelumnya. Bahasa Indonesia tidak memerlukan padanan tersendiri untuk waw agar hubungan itu tetap jelas.
- source_word: הַלֵּוִי
  choice: seorang Lewi
  rationale: Artikel Ibrani berfungsi secara generik dalam kasus hukum; bahasa Indonesia secara alami menyatakannya dengan 'seorang Lewi'.
- source_word: מֵאַחַד שְׁעָרֶיךָ
  choice: dari salah satu kotamu
  rationale: Secara harfiah berarti 'dari salah satu gerbangmu', tetapi 'gerbang' di sini merupakan metonimia bagi kota atau permukiman; maknanya disampaikan dalam teks dan bentuk harfiahnya dicatat.
- source_word: מִכָּל יִשְׂרָאֵל
  choice: di seluruh Israel
  rationale: Dalam rangkaian dengan 'salah satu kotamu', frasa ini menunjukkan bahwa kota asal itu dapat berada di mana saja di wilayah Israel.
- source_word: אֲשֶׁר הוּא גָּר שָׁם
  choice: tempat ia tinggal sebagai pendatang
  rationale: גור bukan sekadar 'tinggal', melainkan menetap sebagai orang yang tidak memiliki kedudukan tanah warisan setempat; 'sebagai pendatang' mempertahankan nuansa tersebut tanpa menyebutnya orang asing.
- source_word: וּבָא
  choice: lalu ... datang
  rationale: Pengulangan verba בוא dipertahankan, sedangkan 'lalu' menyatakan urutan secara alami dalam bahasa Indonesia.
- source_word: בְּכָל אַוַּת נַפְשׁוֹ
  choice: dengan segenap kerinduan jiwanya
  rationale: Ungkapan ini menyatakan hasrat pribadi yang penuh. 'Kerinduan jiwa' dekat dengan unsur אַוָּה dan נֶפֶשׁ serta tetap wajar dan bermartabat.
- source_word: אֶל הַמָּקוֹם
  choice: ke tempat
  rationale: Teks hanya mengatakan 'tempat'; terjemahan tidak menambahkan 'tempat ibadah' atau 'tempat suci', meskipun konteks menunjuk ke pusat ibadah.
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: yang akan dipilih Yahweh
  rationale: Bentuk imperfek paling tepat dinyatakan dengan masa depan dalam rumusan berulang Kitab Ulangan, dan nama ilahi ditransliterasikan sebagai Yahweh.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian dan sejalan dengan lapisan konsultasi yang telah diaudit tanpa menggantinya dengan gelar.
- issue: Status orang Lewi yang tinggal di kota
  choice: tinggal sebagai pendatang
  alternative: tinggal atau menetap
  rationale: Pilihan ini mempertahankan nuansa verba גור, tetapi tidak mengartikan orang Lewi sebagai orang asing non-Israel; ketegangan status sosialnya dibiarkan tampak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam Alkitab yang wajar dan bermartabat. Susunan kalimat mempertahankan dua kali verba 'datang', sedangkan metonimia 'gerbang' dijelaskan dalam catatan agar teks utama mudah dipahami. Koma akhir dipertahankan karena ayat ini secara sintaksis berlanjut ke ayat berikutnya.
