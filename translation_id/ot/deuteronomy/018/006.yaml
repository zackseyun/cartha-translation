revisions:
- from: Jika seorang Lewi datang dari salah satu kotamu di seluruh Israel[a], tempat ia tinggal sebagai pendatang, lalu dengan segenap kerinduan jiwanya datang ke tempat yang akan dipilih Yahweh[b],
  to: Jika seorang Lewi datang dari salah satu kotamu, dari mana pun di Israel[a], tempat ia tinggal sebagai pendatang, lalu datang dengan segenap keinginan hatinya ke tempat yang akan dipilih Yahweh[b],
  rationale: Revisi memperjelas bahwa asal orang Lewi dapat berada di mana pun di Israel dan memakai idiom Indonesia yang lebih luas untuk hasrat penuh, sambil mempertahankan nuansa status tinggalnya, pengulangan “datang,” nama Yahweh, serta koma akhir yang menunjukkan kelanjutan sintaksis ke ayat berikutnya.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T17:51:26Z'
review_pass:
  verdict: revise
  source_fidelity: 'Terjemahan pada dasarnya mengikuti struktur dan unsur utama Ibrani: kasus bersyarat, orang Lewi, asal dari salah satu kota di Israel, status tinggalnya, kedatangan ke tempat pilihan Yahweh, dan hasrat penuh untuk datang. Namun, “di seluruh Israel” kurang tepat sebagai pelengkap langsung bagi “salah satu kotamu”; frasa itu lebih jelas dan idiomatis bila menyatakan cakupan asal, “dari mana pun di Israel.”'
  naturalness: Ragamnya baku dan sesuai untuk teks Alkitab. “Dengan segenap kerinduan jiwanya” dapat dipahami, tetapi “kerinduan” dapat menyempitkan אַוַּת kepada rasa rindu, sedangkan istilahnya lebih luas, yakni keinginan atau hasrat. “Dengan segenap keinginan hatinya” lebih alami dalam bahasa Indonesia dan menyampaikan intensitas ungkapan tersebut.
  terminology: '“Lewi,” “Yahweh,” dan “kota” (dengan catatan tentang metonimia “gerbang”) tepat. “Tinggal sebagai pendatang” layak dipertahankan: ini menunjukkan nuansa גור tanpa menjadikan orang Lewi sebagai orang asing non-Israel. Catatan b perlu disesuaikan supaya alternatifnya tidak mengulang terjemahan utama dan tetap mencerminkan unsur “jiwa.”'
  issues:
  - severity: medium
    issue: Cakupan frasa מִכָּל־יִשְׂרָאֵל kurang jelas dalam “di seluruh Israel.”
    rationale: Dalam konstruksi ini, frasa tersebut menyatakan bahwa orang Lewi itu dapat datang dari mana pun dalam Israel, bukan bahwa sebuah kota berada “di seluruh” Israel. “Dari mana pun di Israel” menyampaikan cakupan distributifnya secara jelas.
  - severity: low
    issue: “Kerinduan” lebih sempit daripada makna dasar אַוַּת.
    rationale: Kata itu dapat berarti keinginan, kehendak, atau hasrat yang kuat; “kerinduan” terutama menyiratkan longing. “Keinginan hati” adalah padanan Indonesia yang alami untuk seluruh ungkapan tanpa mengunci satu nuansa emosional.
  revised_text: Jika seorang Lewi datang dari salah satu kotamu, dari mana pun di Israel[a], tempat ia tinggal sebagai pendatang, lalu datang dengan segenap keinginan hatinya ke tempat yang akan dipilih Yahweh[b],
