  text: נָבִ֨יא אָקִ֥ים לָ/הֶ֛ם מִ/קֶּ֥רֶב אֲחֵי/הֶ֖ם כָּמ֑וֹ/ךָ וְ/נָתַתִּ֤י דְבָרַ/י֙ בְּ/פִ֔י/ו וְ/דִבֶּ֣ר אֲלֵי/הֶ֔ם אֵ֖ת כָּל אֲשֶׁ֥ר אֲצַוֶּֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/018.yaml
  text: I will raise up for them a prophet like you from among their brothers[a], and I will put my words in his mouth, and he will speak to them all that I command him.
translation:
  language: id
  text: Aku akan membangkitkan bagi mereka seorang nabi dari antara saudara-saudara mereka, seperti engkau[a]. Aku akan menaruh firman-Ku ke dalam mulutnya, dan ia akan berbicara kepada mereka segala yang Kuperintahkan kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “kaum kerabat mereka” atau “sesama orang Israel”; secara harfiah: “saudara-saudara mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: נָבִיא
  choice: seorang nabi
  rationale: Padanan baku bagi orang yang berbicara atas nama Allah; kata “seorang” wajar dalam konteks janji tentang sosok yang akan dibangkitkan.
- source_word: אָקִים לָהֶם
  choice: Aku akan membangkitkan bagi mereka
  rationale: Bentuk kausatif dari קום menyatakan bahwa Allah akan membuat nabi itu tampil atau mengangkatnya; “membangkitkan” mempertahankan gambaran sumber tanpa membatasi maknanya pada pengangkatan jabatan.
- source_word: מִקֶּרֶב אֲחֵיהֶם
  choice: dari antara saudara-saudara mereka
  rationale: מִקֶּרֶב berarti “dari tengah-tengah/dari antara,” sedangkan אֲחֵיהֶם secara harfiah berarti “saudara-saudara mereka.” Bentuk kekeluargaan dipertahankan, dengan catatan kaki untuk menjelaskan cakupan komunalnya.
- source_word: כָּמוֹךָ
  choice: seperti engkau
  rationale: Mempertahankan perbandingan langsung dengan Musa dan memakai ragam bahasa yang khidmat.
- source_word: וְנָתַתִּי דְבָרַי בְּפִיו
  choice: Aku akan menaruh firman-Ku dalam mulutnya
  rationale: Mempertahankan metafora konkret tentang perkataan ilahi yang diberikan kepada nabi. “Firman-Ku” sesuai dengan konteks ucapan Allah dan ragam Alkitabiah Indonesia.
- source_word: וְדִבֶּר אֲלֵיהֶם
  choice: ia akan menyampaikan kepada mereka
  rationale: Dalam konteks nabi yang menerima firman untuk diucapkan, “menyampaikan” mengungkapkan tindakan berbicara kepada umat secara alami dalam bahasa Indonesia tanpa mengubah isi amanat.
- source_word: אֵת כָּל אֲשֶׁר אֲצַוֶּנּוּ
  choice: segala yang Kuperintahkan kepadanya
  rationale: Mewakili cakupan menyeluruh dari כָּל אֲשֶׁר dan mempertahankan Allah sebagai pemberi perintah serta nabi sebagai penerimanya.
theological_decisions:
- issue: Apakah nabi yang dijanjikan secara khusus adalah Mesias
  choice: Teks utama hanya menyebut “seorang nabi seperti engkau” tanpa mengidentifikasi sosoknya lebih lanjut.
  alternative: Memahaminya sebagai rangkaian para nabi atau sebagai seorang nabi eskatologis yang digenapi dalam Mesias.
  rationale: Ayat Ibrani berbentuk tunggal dan membandingkan nabi itu dengan Musa, tetapi tidak secara eksplisit menetapkan identitas atau waktu penggenapannya. Terjemahan mempertahankan ketegangan tersebut.
- issue: Cakupan אֲחֵיהֶם
  choice: saudara-saudara mereka
  alternative: kaum kerabat mereka; sesama orang Israel
  rationale: Padanan utama mempertahankan metafora kekerabatan maskulin dalam bahasa sumber, sedangkan catatan kaki menjelaskan bahwa dalam konteks ini ungkapan tersebut dapat menunjuk pada saudara sebangsa atau sesama anggota Israel.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “engkau” sesuai karena Allah sedang berbicara langsung kepada Musa. Pronomina yang merujuk kepada Allah ditulis dengan huruf kapital menurut kebiasaan penerbitan Alkitab berbahasa Indonesia; pronomina untuk nabi tetap huruf kecil agar identitasnya tidak ditentukan secara teologis oleh tipografi.
