  text: כִּ֤י אַתָּה֙ בָּ֣א אֶל הָ/אָ֔רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ לֹֽא תִלְמַ֣ד לַ/עֲשׂ֔וֹת כְּ/תוֹעֲבֹ֖ת הַ/גּוֹיִ֥ם הָ/הֵֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/009.yaml
  text: When you come into the land that Yahweh your God is giving you[a], you shall not learn to do according to the abominations of those nations.
translation:
  language: id
  text: Ketika engkau memasuki negeri yang Yahweh, Allahmu, sedang memberikan kepadamu, janganlah engkau belajar melakukan berbagai kekejian seperti kekejian bangsa-bangsa itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sesuai dengan berbagai kekejian bangsa-bangsa itu.” Preposisi Ibrani dapat menyatakan perbandingan atau kesesuaian.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Ketika
  rationale: Dalam konteks ini כִּי memperkenalkan keadaan waktu bagi larangan berikutnya, yakni saat Israel memasuki negeri itu.
- source_word: בָּא אֶל הָאָרֶץ
  choice: memasuki negeri
  rationale: Ungkapan ini menyatakan gerak masuk. “Memasuki negeri” alami dalam bahasa Indonesia dan mempertahankan acuan geografis-perjanjian הָאָרֶץ.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Allahmu
  rationale: Nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh”, sedangkan bentuk bersufiks אֱלֹהֶיךָ diterjemahkan “Allahmu”.
- source_word: נֹתֵן לָךְ
  choice: berikan kepadamu
  rationale: Partisip Ibrani menyatakan tindakan yang sedang berlangsung atau segera terwujud. Dalam klausa relatif bahasa Indonesia, bentuk ini alami dan tetap membiarkan aspek waktunya ditentukan oleh konteks.
- source_word: לֹא תִלְמַד לַעֲשׂוֹת
  choice: janganlah engkau belajar melakukan
  rationale: Imperfek dengan לֹא berfungsi sebagai larangan. Infinitif לַעֲשׂוֹת dipertahankan secara langsung sebagai pelengkap “melakukan”.
- source_word: כְּתוֹעֲבֹת
  choice: berbagai kekejian seperti
  rationale: תּוֹעֵבָה mempertahankan daya kecaman moral-keagamaan yang kuat melalui “kekejian”. Preposisi כְּ diterjemahkan sebagai perbandingan atau kesesuaian melalui “seperti”; bentuk jamak dinyatakan dengan “berbagai” agar alami.
- source_word: הַגּוֹיִם הָהֵם
  choice: bangsa-bangsa itu
  rationale: גּוֹיִם merujuk pada bangsa-bangsa lain yang mendiami negeri itu, dan הָהֵם adalah penunjuk jauh, sehingga “bangsa-bangsa itu” tepat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama perjanjian יְהוָה secara langsung. Transliterasi “Yahweh” mempertahankan nama pribadi itu dan tidak menggantinya dengan gelar.
- issue: Kekuatan istilah תּוֹעֵבָה
  choice: kekejian
  alternative: perbuatan-perbuatan menjijikkan; praktik-praktik keji
  rationale: “Kekejian” mempertahankan kecaman moral dan keagamaan yang kuat tanpa lebih dahulu mempersempit istilah kepada praktik tertentu yang baru dirinci dalam ayat-ayat berikutnya.
- issue: Hubungan yang dinyatakan oleh preposisi כְּ
  choice: seperti bangsa-bangsa itu melakukannya
  alternative: sesuai dengan kekejian bangsa-bangsa itu
  rationale: Preposisi כְּ dapat menyatakan perbandingan ataupun kesesuaian. Teks utama memakai susunan Indonesia yang alami, sementara catatan kaki mempertahankan kemungkinan nuansa kesesuaian.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti tunggal “engkau” mempertahankan sapaan orang kedua tunggal Ibrani serta nada hukum-perjanjian. Susunan kalimat dibuat alami tanpa melunakkan istilah teologis utama.
