revisions:
- from: Ketika engkau memasuki negeri yang Yahweh, Allahmu, berikan kepadamu, janganlah engkau belajar melakukan berbagai kekejian seperti bangsa-bangsa itu melakukannya.[a]
  to: Ketika engkau memasuki negeri yang Yahweh, Allahmu, sedang memberikan kepadamu, janganlah engkau belajar melakukan berbagai kekejian seperti kekejian bangsa-bangsa itu.[a]
  rationale: Revisi menghapus klausa tambahan yang tidak tersurat dalam teks Ibrani dan mempertahankan ambiguitas כְּ, yakni perbandingan (“seperti”) atau kesesuaian (“sesuai dengan”), melalui catatan kaki. “Sedang memberikan” mencerminkan bentuk partisip sumber dengan lebih jelas, tanpa mengubah makna prospektif konteksnya.
