review_pass:
  verdict: revise
  source_fidelity: 'Draf menambahkan unsur yang tidak ada dalam bahasa Ibrani: “melakukannya” setelah “bangsa-bangsa itu.” Teks sumber menyatakan larangan belajar melakukan “seperti/menurut kekejian bangsa-bangsa itu,” bukan klausa eksplisit tentang bangsa-bangsa yang melakukan kekejian tersebut. Selain itu, “berikan” kurang tepat untuk partisip נֹתֵן dalam konteks prospektif; “sedang memberikan” atau “akan memberikan” lebih setia. Terjemahan “ketika,” “memasuki negeri,” “Yahweh, Allahmu,” larangan “janganlah,” dan “kekejian” pada dasarnya baik.'
  naturalness: Bahasa draf umumnya baku dan jelas. Namun, “berbagai kekejian seperti bangsa-bangsa itu melakukannya” agak janggal secara idiomatis karena “kekejian” tidak menjadi objek yang lazim bagi “melakukannya” dalam susunan ini. “Seperti kekejian bangsa-bangsa itu” alami, padat, dan lebih dekat dengan sumber.
  terminology: “Yahweh” konsisten dengan keputusan nama ilahi yang diberikan. “Allahmu,” “negeri,” “kekejian,” dan “bangsa-bangsa itu” tepat dalam register Alkitab modern baku. Bentuk jamak “berbagai kekejian” dapat dipertahankan untuk mencerminkan jamak תּוֹעֲבֹת, tanpa menyatakan jenis praktik tertentu.
  issues:
  - severity: medium
    issue: Penambahan klausa “melakukannya”
    rationale: Klausa tersebut tidak memiliki padanan eksplisit dalam כְּתוֹעֲבֹת הַגּוֹיִם הָהֵם dan berisiko menggeser konstruksi preposisional yang ambigu menjadi pernyataan verbal tambahan.
  - severity: low
    issue: Aspek verba “berikan”
    rationale: נֹתֵן adalah partisip yang dalam konteks ini menunjuk pemberian yang sedang/akan terjadi. “Sedang memberikan kepadamu” lebih transparan daripada bentuk “berikan,” yang dapat terbaca sebagai bentuk imperatif atau bentuk tidak baku dalam klausa relatif.
  revised_text: Ketika engkau memasuki negeri yang Yahweh, Allahmu, sedang memberikan kepadamu, janganlah engkau belajar melakukan berbagai kekejian seperti kekejian bangsa-bangsa itu.[a]
  revised_footnotes:
  - marker: a
    text: Atau, “sesuai dengan berbagai kekejian bangsa-bangsa itu.” Preposisi Ibrani dapat menyatakan perbandingan atau kesesuaian.
    reason: lexical_alternative
