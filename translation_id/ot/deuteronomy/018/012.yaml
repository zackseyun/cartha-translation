  text: כִּֽי תוֹעֲבַ֥ת יְהוָ֖ה כָּל עֹ֣שֵׂה אֵ֑לֶּה וּ/בִ/גְלַל֙ הַ/תּוֹעֵבֹ֣ת הָ/אֵ֔לֶּה יְהוָ֣ה אֱלֹהֶ֔י/ךָ מוֹרִ֥ישׁ אוֹתָ֖/ם מִ/פָּנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/012.yaml
  text: For everyone who does these things is an abomination to Yahweh[a], and because of these abominations Yahweh your God is driving them out before you.
translation:
  language: id
  text: Sebab setiap orang yang melakukan hal-hal ini adalah kekejian bagi Yahweh, dan karena kekejian-kekejian ini Yahweh, Allahmu, mengusir[a] mereka dari hadapanmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membuat mereka kehilangan tanah milik mereka”; kata kerja Ibrani dapat menekankan bahwa bangsa-bangsa itu kehilangan penguasaan atas tanah, selain bahwa mereka diusir.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan bagi larangan sebelumnya; “Sebab” mempertahankan fungsi penjelasannya secara alami dalam bahasa Indonesia.
- source_word: תוֹעֲבַת יְהוָה
  choice: merupakan kekejian bagi Yahweh
  rationale: Ungkapan konstruksi ini menyatakan sesuatu yang sangat menjijikkan atau tidak berkenan dalam pandangan Yahweh. “Kekejian” mempertahankan daya moral dan perjanjian dari תוֹעֵבָה.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri, sesuai bentuk Tetragramaton dalam teks sumber.
- source_word: כָּל עֹשֵׂה אֵלֶּה
  choice: setiap orang yang melakukan hal-hal ini
  rationale: כָּל dengan partisip menyatakan cakupan universal tak tentu, yakni siapa pun yang mempraktikkan perbuatan-perbuatan tersebut.
- source_word: וּבִגְלַל
  choice: Karena
  rationale: Menandai sebab bagi penghukuman berikutnya. Pemisahan menjadi kalimat baru menghasilkan bahasa Indonesia yang lebih wajar tanpa mengubah hubungan logisnya.
- source_word: הַתּוֹעֵבֹת הָאֵלֶּה
  choice: kekejian-kekejian ini
  rationale: Bentuk jamak merujuk kembali kepada praktik-praktik terlarang dalam ayat-ayat sebelumnya dan mempertahankan kesinambungan leksikal dengan bentuk tunggal sebelumnya.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Akhiran orang kedua tunggal dipertahankan sehingga sapaan langsung kepada Israel tetap terlihat.
- source_word: מוֹרִישׁ אֹתָם
  choice: menghalau mereka
  rationale: Bentuk Hifil dari ירש dalam konteks ini berarti membuat bangsa-bangsa kehilangan kepemilikan atas negeri itu atau mengusir mereka. “Menghalau” alami dalam konteks penyingkiran dari suatu wilayah.
- source_word: מִפָּנֶיךָ
  choice: dari hadapanmu
  rationale: Terjemahan ini mempertahankan unsur מִן, “dari”, dan ungkapan idiomatis “hadapanmu”, yang menggambarkan bangsa-bangsa itu disingkirkan di depan Israel.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung; “Yahweh” mempertahankannya sebagai nama perjanjian tanpa menggantinya dengan gelar.
- issue: Sifat kecaman dalam תוֹעֲבַת יְהוָה
  choice: merupakan kekejian bagi Yahweh
  alternative: dipandang keji oleh Yahweh
  rationale: Pilihan bentuk nomina mempertahankan kekuatan istilah תוֹעֵבָה dan kesinambungannya dengan bentuk jamak pada klausa berikutnya, tanpa menambahkan penjelasan teologis.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. Struktur ayat dibagi menjadi dua kalimat agar hubungan sebab-akibat terbaca jelas. Pengulangan “kekejian” sengaja dipertahankan untuk mencerminkan pengulangan leksikal dalam bahasa Ibrani.
