revisions:
- from: Sebab setiap orang yang melakukan hal-hal ini merupakan kekejian bagi Yahweh. Karena kekejian-kekejian ini, Yahweh, Allahmu, menghalau[a] mereka dari hadapanmu.
  to: Sebab setiap orang yang melakukan hal-hal ini adalah kekejian bagi Yahweh, dan karena kekejian-kekejian ini Yahweh, Allahmu, mengusir[a] mereka dari hadapanmu.
  rationale: Revisi ini mempertahankan seluruh unsur makna utama teks Ibrani dan audit bahasa Inggris, tetapi memakai padanan Indonesia yang lebih langsung untuk tindakan Yahweh terhadap bangsa-bangsa itu. Hubungan kausal kedua klausa tetap eksplisit melalui “dan karena,” dan catatan kaki kini menyampaikan alternatif leksikal tanpa menambahkan kategori hukum yang tidak diperlukan.
