  yaml_path: translation/ot/deuteronomy/018/021.yaml
  text: And if you say in your heart[a], ‘How shall we know the word that Yahweh has not spoken?’
translation:
  language: id
  text: Dan jika dalam hatimu engkau berkata, “Bagaimana kita dapat mengetahui firman[a] yang tidak disampaikan oleh Yahweh?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perkataan”, “pesan”, atau “perkara”. Kata Ibrani davar memiliki cakupan makna yang luas; dalam konteks nubuat ini, “firman” paling sesuai.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Dan jika
  rationale: Mempertahankan hubungan dengan konteks sebelumnya sekaligus nuansa syarat atau kemungkinan yang diperkenalkan oleh gabungan konjungsi dan partikel ini.
- source_word: תֹאמַר
  choice: engkau berkata
  rationale: Bentuk orang kedua tunggal mempertahankan sapaan langsung kepada Israel; bentuk kini wajar dalam klausa bersyarat bahasa Indonesia.
- source_word: בִּלְבָבֶךָ
  choice: dalam hatimu
  rationale: Mempertahankan gambaran Ibrani tentang hati sebagai pusat pikiran dan pertimbangan, tanpa meratakannya menjadi sekadar 'dalam pikiranmu' atau 'kepada dirimu sendiri'.
- source_word: אֵיכָה נֵדַע
  choice: Bagaimana kita dapat mengetahui
  rationale: Mengungkapkan pertanyaan mengenai cara atau sarana untuk mengetahui. Kata 'dapat' menghasilkan bahasa Indonesia yang alami tanpa mengubah pertanyaan menjadi kepastian masa depan.
- source_word: הַדָּבָר
  choice: firman
  rationale: Dalam konteks nubuat, davar menunjuk pada perkataan atau pesan yang diklaim berasal dari Allah. 'Firman' paling sesuai dengan konteks, sementara keluasan maknanya dicatat dalam catatan kaki.
- source_word: אֲשֶׁר לֹא דִבְּרוֹ
  choice: yang tidak disampaikan
  rationale: Mempertahankan klausa relatif yang menerangkan 'firman'. 'Disampaikan' terdengar alami untuk suatu pesan nubuat dan tetap berfokus pada apakah Yahweh merupakan sumbernya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi sebagai nama diri, bukan menggantinya dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks menyebut nama perjanjian Allah Israel. Bentuk 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Apakah דָּבָר harus dipersempit menjadi istilah teknis teologis
  choice: firman, dengan catatan alternatif leksikal
  alternative: perkataan, pesan, atau perkara
  rationale: Konteks kenabian mendukung 'firman', tetapi catatan kaki mempertahankan keluasan semantis kata Ibrani dan tidak menyatakan bahwa setiap pemakaiannya merupakan istilah teknis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina 'engkau' mempertahankan sapaan tunggal dan laras Alkitab yang tetap mudah dipahami. Penanda catatan kaki ditempatkan sesudah kata yang diterangkannya, yaitu 'firman'.
