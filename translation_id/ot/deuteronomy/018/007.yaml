  text: וְ/שֵׁרֵ֕ת בְּ/שֵׁ֖ם יְהוָ֣ה אֱלֹהָ֑י/ו כְּ/כָל אֶחָי/ו֙ הַ/לְוִיִּ֔ם הָ/עֹמְדִ֥ים שָׁ֖ם לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/007.yaml
  text: then he may minister in the name of Yahweh his God[c][b][a], like all his brothers the Levites who stand there before Yahweh.
translation:
  language: id
  text: maka ia boleh melayani[a] dalam nama Yahweh, Allahnya, seperti semua saudaranya, orang-orang Lewi,[b] yang berdiri di sana di hadapan Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “maka ia akan melayani.” Bentuk imperfek Ibrani dapat menyatakan izin atau tindakan mendatang secara lebih langsung dalam konteks hukum ini.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “saudara-saudaranya,” yakni sesama orang Lewi.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁרֵת
  choice: maka ia boleh melayani
  rationale: Bentuk piel dari שׁרת menunjuk pada pelayanan keagamaan. Dalam kesinambungan hukum dari ayat sebelumnya, bentuk imperfek wajar dipahami sebagai izin; 'maka' menyatakan akibat secara alami.
- source_word: בְּשֵׁם
  choice: dalam nama
  rationale: Ungkapan ini menunjukkan tindakan yang dilakukan dengan membawa nama, kewenangan, atau pemanggilan nama tersebut; 'dalam nama' merupakan padanan Indonesia yang alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהָיו
  choice: Allahnya
  rationale: Bentuk bersufiks orang ketiga tunggal secara langsung berarti 'Allahnya'.
- source_word: כְּכָל אֶחָיו הַלְוִיִּם
  choice: seperti semua saudaranya, orang-orang Lewi
  rationale: Mempertahankan istilah kekerabatan maskulin 'saudara' dan aposisi yang menjelaskan bahwa mereka adalah sesama orang Lewi.
- source_word: הָעֹמְדִים שָׁם
  choice: yang berdiri di sana
  rationale: Mempertahankan arti konkret עמד, 'berdiri', tanpa mengubahnya secara diam-diam menjadi 'melayani'.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: Padanan langsung dan alami bagi ungkapan kehadiran di hadapan Allah dalam konteks ibadah.
theological_decisions:
- issue: Daya modal bentuk imperfek וְשֵׁרֵת dalam konteks hukum
  choice: boleh melayani
  alternative: akan melayani / harus melayani
  rationale: Ayat sebelumnya memberi hak kepada orang Lewi untuk datang dan melayani; karena itu nuansa izin paling sesuai, tetapi bentuk Ibrani juga dapat dibaca lebih langsung sebagai pernyataan tindakan mendatang.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi YHWH; transliterasi mempertahankan nama tersebut, sedangkan 'TUHAN' adalah penggantian tradisional dengan gelar.
- issue: Istilah kekerabatan אֶחָיו
  choice: saudaranya
  alternative: sesama orang Lewi
  rationale: Pilihan utama mempertahankan bentuk maskulin dan metafora kekerabatan dalam bahasa Ibrani, sementara aposisi berikutnya menjelaskan rujukannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur ayat dibuat alami tanpa menghilangkan pengulangan nama Yahweh, istilah kekerabatan, atau gambaran berdiri di hadapan-Nya.
