  yaml_path: translation/ot/deuteronomy/018/017.yaml
  text: And Yahweh said to me[a], ‘They have spoken well.’
translation:
  language: id
  text: Lalu Yahweh berkata kepadaku, “Mereka telah berkata dengan baik.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Mereka telah berbuat baik dalam apa yang mereka katakan.”
    reason: Ungkapan Ibrani memakai verba “berbuat baik”; dalam konteks, ungkapan itu menilai perkataan mereka.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Lalu ... berkata
  rationale: Bentuk wayyiqtol dari אמר melanjutkan urutan narasi. “Lalu ... berkata” menyatakan perkembangan peristiwa secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dipertahankan sebagai nama diri “Yahweh”, bukan diganti dengan suatu gelar.
- source_word: אֵלָי
  choice: kepadaku
  rationale: Preposisi אֶל dengan akhiran orang pertama tunggal berarti “kepadaku” dan wajar digunakan dengan verba “berkata”.
- source_word: הֵיטִיבוּ אֲשֶׁר דִּבֵּרוּ
  choice: Apa yang mereka katakan itu baik
  rationale: Secara harfiah konstruksi ini menyatakan bahwa mereka “berbuat baik” dalam apa yang mereka katakan. Dalam konteks, הֵיטִיבוּ menilai perkataan mereka; susunan ini menyampaikan penilaian tersebut dengan jelas dan alami tanpa mengubah isinya.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. Bentuk “Yahweh” mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Lingkup penilaian הֵיטִיבוּ
  choice: Penilaian ditujukan kepada apa yang mereka katakan
  alternative: Penilaian terutama terhadap tindakan mereka karena telah berbicara
  rationale: Ungkapan אֲשֶׁר דִּבֵּרוּ menghubungkan הֵיטִיבוּ langsung dengan perkataan mereka. Terjemahan utama memakai idiom Indonesia yang alami, sedangkan bentuk ungkapan Ibraninya dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan bermartabat. Tanda petik menandai perkataan langsung, sedangkan nama Yahweh dipertahankan sebagai nama diri.
