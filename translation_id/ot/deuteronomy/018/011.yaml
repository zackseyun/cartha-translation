  text: or one who binds a spell[a], or one who consults a medium or a spiritist[d][c][b], or one who seeks the dead.
translation:
  language: id
  text: atau orang yang mengucapkan mantra[a], atau orang yang meminta petunjuk kepada arwah[b] atau kepada pemanggil roh[c], atau orang yang meminta petunjuk kepada orang mati[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “orang yang mengikat suatu ikatan”; ini merupakan ungkapan untuk merangkai atau mengucapkan mantra.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang yang meminta petunjuk kepada perantara arwah”; kata Ibrani ini dapat menunjuk pada arwah ataupun perantaranya.
    reason: lexical_alternative
  - marker: c
    text: Istilah Ibrani menunjuk pada pelaku praktik gaib yang mencari pengetahuan melalui roh; arti tepatnya tidak pasti.
    reason: lexical_alternative
  - marker: d
    text: Atau “orang yang mencari orang mati”; maksudnya ialah meminta keterangan atau petunjuk dari orang mati.
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹבֵר חָבֶר
  choice: orang yang mengucapkan mantra
  rationale: Ungkapan Ibrani ini secara harfiah memakai pengulangan dari akar yang berarti 'mengikat', tetapi dalam daftar praktik gaib menunjuk pada pelafalan atau perangkaian mantra. Pilihan ini menyampaikan praktiknya secara jelas dalam bahasa Indonesia modern tanpa mempertahankan idiom yang kabur.
- source_word: שֹׁאֵל אוֹב
  choice: orang yang meminta petunjuk kepada arwah
  rationale: אוֹב dapat menunjuk pada roh orang mati atau pada perantara yang berhubungan dengannya. Konstruksi שֹׁאֵל אוֹב paling langsung dapat dipahami sebagai meminta keterangan atau petunjuk kepada arwah; ambiguitas mengenai arwah atau mediumnya dicatat dalam catatan kaki.
- source_word: יִדְּעֹנִי
  choice: pemanggil roh
  rationale: Istilah ini menunjuk pada pelaku praktik gaib yang mencari pengetahuan melalui roh dan lazim dipasangkan dengan אוֹב. 'Pemanggil roh' lebih mudah dipahami daripada transliterasi atau istilah folkloris seperti 'dukun sihir', meski cakupan istilah Ibraninya tidak sepenuhnya pasti.
- source_word: דֹרֵשׁ אֶל הַמֵּתִים
  choice: orang yang meminta petunjuk kepada orang mati
  rationale: דָּרַשׁ dengan אֶל di sini berarti mencari atau meminta keterangan dari orang mati dalam praktik nekromansi. Pilihan ini lebih alami dan lebih eksplisit daripada terjemahan harfiah 'mencari orang mati'.
- source_word: וְ
  choice: atau
  rationale: Dalam rangkaian larangan hukum yang berlanjut dari ayat sebelumnya, waw paling wajar dinyatakan secara disjungtif sebagai 'atau' dalam bahasa Indonesia.
theological_decisions:
- issue: Istilah praktik gaib tanpa memasukkan gambaran folklor atau sistem okultisme yang lebih kemudian
  choice: 'Menggunakan istilah modern yang deskriptif: ''mengucapkan mantra'', ''meminta petunjuk kepada arwah'', dan ''pemanggil roh''.'
  alternative: Memakai istilah tradisional seperti 'pawang', 'dukun', atau 'ahli sihir'.
  rationale: Teks menyusun daftar praktik ramalan dan konsultasi dengan roh atau orang mati. Istilah deskriptif menjaga fokus pada tindakan yang dilarang dan menghindari konotasi budaya atau fantasi yang tidak niscaya terdapat dalam istilah Ibrani.
- issue: Ambiguitas אוֹב sebagai roh orang mati atau perantara roh
  choice: Menampilkan 'arwah' dalam teks utama dan mencatat kemungkinan 'perantara arwah' dalam catatan kaki.
  alternative: Menerjemahkan langsung sebagai 'medium/perantara arwah' dalam teks utama.
  rationale: Objek langsung שֹׁאֵל mendukung pengertian meminta petunjuk kepada arwah, tetapi pemakaian אוֹב juga dapat beralih menunjuk kepada pelaku perantara. Catatan kaki mempertahankan ketidakpastian leksikal tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk paralel 'orang yang ...' mempertahankan struktur daftar hukum. 'Arwah' dipilih untuk roh orang yang telah mati, sedangkan 'orang mati' mempertahankan bentuk jamak kolektif הַמֵּתִים. Semua penanda catatan kaki ditempatkan langsung setelah unsur terkait.
