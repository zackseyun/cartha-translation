  text: You shall be blameless with Yahweh your God[a].
translation:
  language: id
  text: Hendaklah engkau hidup tanpa cela bersama Yahweh, Allahmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “utuh” atau “lengkap” bersama Yahweh, Allahmu. Kata Ibrani ini juga dapat berarti “tidak bercela.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּמִים
  choice: dengan sepenuh hati
  rationale: Kata ini menunjuk pada keutuhan, kelengkapan, atau integritas. Dalam konteks penolakan terhadap tenung dan praktik gaib (Ul. 18:9–14), ungkapan ini secara alami menyampaikan kesetiaan yang tidak terbagi kepada Yahweh, tanpa menyiratkan kesempurnaan tanpa dosa.
- source_word: תִּהְיֶה
  choice: hendaklah engkau hidup
  rationale: Bentuk imperfek orang kedua tunggal berfungsi sebagai perintah. Penambahan 'hidup' membuat konstruksi dengan keterangan 'dengan sepenuh hati' alami dalam bahasa Indonesia sambil menyampaikan tuntutan keadaan dan cara hidup yang berkelanjutan.
- source_word: עִם
  choice: bersama
  rationale: Padanan langsung ini mempertahankan nuansa relasional dari preposisi Ibrani dan tidak mempersempitnya menjadi sekadar 'di hadapan' atau 'terhadap'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Dalam rujukan perjanjian kepada Yahweh, bentuk ini jelas bermakna tunggal dan akhiran orang kedua tunggal dinyatakan secara alami dengan '-mu'.
theological_decisions:
- issue: Makna תָּמִים dalam seruan perjanjian
  choice: kesetiaan yang utuh dan tidak terbagi kepada Allah
  alternative: tidak bercela; utuh; sempurna
  rationale: Konteks langsung membedakan Israel dari praktik tenung bangsa-bangsa. 'Dengan sepenuh hati' mengungkapkan pengabdian yang utuh tanpa menetapkan bahwa ayat ini menuntut kesempurnaan moral tanpa dosa; catatan kaki mempertahankan rentang makna katanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Pronomina tunggal 'engkau' mencerminkan bentuk Ibrani orang kedua tunggal; 'Yahweh' mempertahankan nama ilahi. Terjemahan utama mengutamakan kealamian sekaligus mempertahankan gagasan keutuhan melalui catatan kaki.
