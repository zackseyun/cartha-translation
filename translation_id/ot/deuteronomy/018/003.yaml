  text: וְ/זֶ֡ה יִהְיֶה֩ מִשְׁפַּ֨ט הַ/כֹּהֲנִ֜ים מֵ/אֵ֣ת הָ/עָ֗ם מֵ/אֵ֛ת זֹבְחֵ֥י הַ/זֶּ֖בַח אִם שׁ֣וֹר אִם שֶׂ֑ה וְ/נָתַן֙ לַ/כֹּהֵ֔ן הַ/זְּרֹ֥עַ וְ/הַ/לְּחָיַ֖יִם וְ/הַ/קֵּבָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/003.yaml
  text: 'And this shall be the priests’ due from the people[a], from those who sacrifice a sacrifice, whether an ox or a sheep: he shall give to the priest the shoulder, the two cheeks[d][c][b], and the stomach.'
translation:
  language: id
  text: 'Inilah bagian yang menjadi hak para imam dari umat itu, yaitu dari orang yang mempersembahkan kurban, baik sapi maupun domba: ia harus memberikan kepada imam bahu[a], kedua rahang[b], dan lambung[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “lengan”; dalam konteks hewan, kata ini menunjuk kaki depan atau bagian bahu.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “kedua pipi.” Bentuk Ibraninya adalah bentuk dual.
    reason: lexical_alternative
  - marker: c
    text: Secara tradisional juga diterjemahkan “perut besar”; kata Ibraninya menunjuk lambung hewan.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפַּט
  choice: bagian yang menjadi hak
  rationale: Dalam konteks hukum peribadatan ini, kata tersebut menunjuk pada bagian yang ditetapkan sebagai hak para imam, bukan pada 'penghakiman' secara abstrak.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: Bentuk jamak dipertahankan dan ditempatkan dalam konstruksi alami bahasa Indonesia, 'hak para imam'.
- source_word: מֵאֵת הָעָם
  choice: dari umat itu
  rationale: Menerjemahkan הָעָם secara langsung tanpa mempersempitnya secara eksplisit menjadi 'orang Israel'; 'umat' sesuai dengan konteks komunitas perjanjian.
- source_word: מֵאֵת זֹבְחֵי הַזֶּבַח
  choice: yaitu dari orang yang mempersembahkan kurban
  rationale: Frasa ini menjelaskan kelompok dalam umat yang wajib memberi bagian tersebut. Pengulangan akar זבח tidak dipaksakan karena akan terdengar janggal dalam bahasa Indonesia.
- source_word: אִם שׁוֹר אִם שֶׂה
  choice: baik sapi maupun domba
  rationale: Menyampaikan pasangan alternatif dalam bentuk idiomatis. שׁוֹר dapat menunjuk hewan sapi, sedangkan שֶׂה di sini secara wajar diterjemahkan 'domba'.
- source_word: וְנָתַן
  choice: ia harus memberikan
  rationale: Bentuk tunggal dipertahankan secara distributif untuk setiap orang yang mempersembahkan kurban, sementara nuansa ketentuan hukum dinyatakan dengan 'harus'.
- source_word: לַכֹּהֵן
  choice: kepada imam
  rationale: Menunjuk imam penerima dalam kapasitas resminya; bahasa Indonesia tidak memakai artikel tertentu.
- source_word: הַזְּרֹעַ
  choice: paha depan
  rationale: Secara harfiah berarti 'lengan', tetapi pada anatomi hewan menunjuk bagian tungkai depan; 'paha depan' mudah dipahami sebagai potongan daging, dengan alternatif dijelaskan dalam catatan.
- source_word: הַלְּחָיַיִם
  choice: kedua rahang
  rationale: Bentuk dual Ibrani ditampilkan secara eksplisit melalui 'kedua'; 'rahang' lebih tepat untuk bagian anatomi hewan daripada 'pipi'.
- source_word: הַקֵּבָה
  choice: lambung
  rationale: Istilah ini menunjuk organ lambung hewan. 'Lambung' merupakan istilah Indonesia modern yang lebih tepat daripada 'perut' dan tidak searkais 'tembolok'.
theological_decisions: []
translation_notes:
  register: Bahasa hukum yang lugas dan bermartabat dipadukan dengan kosakata anatomi yang dapat dimengerti pembaca modern. Struktur ayat mempertahankan hubungan antara seluruh umat dan kelompok khusus yang mempersembahkan kurban.
