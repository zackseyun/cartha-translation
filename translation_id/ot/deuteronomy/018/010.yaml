base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/010.yaml
  text: There must not be found among you anyone who makes his son or his daughter pass through the fire[a], one who practices divination, tells fortunes, interprets omens[d][c][b], or practices sorcery.
translation:
  language: id
  text: Jangan sampai didapati di antaramu seorang pun yang membuat anak laki-laki atau anak perempuannya melewati api[a], yang melakukan tenung, meramal[b], membaca pertanda[c], atau melakukan sihir[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membakar anak laki-laki atau anak perempuannya dalam api” atau “mempersembahkan anak laki-laki atau anak perempuannya dalam api.” Secara harfiah, bahasa Ibrani berbunyi “membuat anak laki-laki atau anak perempuannya melewati api.”
    reason: alternative_reading
  - marker: b
    text: Istilah Ibrani ini sulit; dapat juga dipahami sebagai “menentukan waktu yang dianggap mujur” atau “menjadi juru ramal.”
    reason: lexical_alternative
  - marker: c
    text: Atau “melakukan penenungan berdasarkan pertanda.”
    reason: lexical_alternative
  - marker: d
    text: Atau “mempraktikkan ilmu gaib.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמָּצֵא בְךָ
  choice: Jangan didapati di antaramu
  rationale: Bentuk Nifal imperfek dengan negasi berfungsi sebagai larangan mengenai apa yang tidak boleh ada dalam komunitas perjanjian. Ungkapan “di antaramu” menyampaikan בְךָ secara alami dalam konteks hukum komunal.
- source_word: מַעֲבִיר בְּנוֹ וּבִתּוֹ בָּאֵשׁ
  choice: yang menyuruh anaknya laki-laki atau perempuan melewati api
  rationale: Partisipel Hifil dari עבר secara harfiah menyatakan tindakan menyebabkan seseorang lewat. Terjemahan ini mempertahankan ungkapan Ibrani dan tidak menentukan secara berlebihan bentuk persis ritual terlarang yang melibatkan anak dan api.
- source_word: קֹסֵם קְסָמִים
  choice: yang melakukan tenung
  rationale: Partisipel dengan objek serumpun menunjuk pada praktik divinasi. “Melakukan tenung” merupakan ungkapan Indonesia yang ringkas dan cukup teknis, serta tetap dapat dibedakan dari pembacaan pertanda pada istilah berikutnya.
- source_word: מְעוֹנֵן
  choice: meramal
  rationale: Istilah Ibrani ini sulit dan pernah dipahami sebagai penentu waktu, peramal, atau pelaku praktik gaib sejenis. “Meramal” jelas bagi pembaca modern tanpa mengunci etimologi atau metode yang tidak pasti.
- source_word: מְנַחֵשׁ
  choice: membaca pertanda
  rationale: Kata ini berkaitan dengan mencari petunjuk gaib melalui tanda atau pertanda. “Membaca pertanda” menyampaikan kemungkinan maknanya secara alami dan membedakannya dari tenung yang lebih umum.
- source_word: מְכַשֵּׁף
  choice: melakukan sihir
  rationale: Partisipel Piel menunjuk pada keterlibatan dalam praktik magis. “Melakukan sihir” alami dalam rangkaian tindakan dan tidak memasukkan gambaran budaya yang terlalu khusus.
theological_decisions:
- issue: Sifat larangan ritual anak dan api
  choice: Mempertahankan ungkapan bahwa seseorang menyuruh anaknya melewati api.
  alternative: Membakar atau mempersembahkan anaknya dalam api.
  rationale: Ayat ini jelas mengecam ritual terlarang yang melibatkan anak dan api, tetapi ungkapan Ibraninya sendiri secara harfiah menyatakan tindakan menyebabkan anak melewati api. Terjemahan utama mempertahankan ketegangan itu tanpa memastikan rincian ritual yang tidak dinyatakan secara eksplisit dalam klausa ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan larangan dipertahankan sebagai daftar tindakan paralel. Istilah “tenung,” “meramal,” “membaca pertanda,” dan “sihir” dipilih agar perbedaan leksikal antarkegiatan tetap tampak sejauh mungkin, sedangkan ketidakpastian istilah מְעוֹנֵן dan rincian ritual api dijelaskan dalam catatan kaki.
