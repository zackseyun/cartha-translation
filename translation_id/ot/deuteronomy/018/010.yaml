revisions:
- from: Jangan didapati di antaramu seorang pun yang menyuruh anaknya laki-laki atau perempuan melewati api[a], yang melakukan tenung, meramal[b], membaca pertanda[c], atau melakukan sihir[d].
  to: Jangan sampai didapati di antaramu seorang pun yang membuat anak laki-laki atau anak perempuannya melewati api[a], yang melakukan tenung, meramal[b], membaca pertanda[c], atau melakukan sihir[d].
  rationale: Revisi terbatas pada ungkapan untuk putra atau putri serta verba kausatif pada ritual api. Perubahan ini meningkatkan kealamian bahasa Indonesia dan ketepatan terhadap bentuk kausatif Ibrani, sambil mempertahankan ambiguitas historis mengenai sifat ritual tersebut. Istilah daftar praktik dan seluruh jangkar catatan kaki dipertahankan.
