base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/020.yaml
  text: But the prophet who presumptuously speaks a word in my name that I have not commanded him to speak[b][a], or who speaks in the name of other gods—that prophet shall die.
translation:
  language: id
  text: Namun, nabi yang dengan lancang mengucapkan suatu perkataan dalam nama-Ku yang tidak Kuperintahkan kepadanya untuk diucapkan,[a] atau yang berbicara dalam nama ilah-ilah lain—nabi itu harus mati.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dengan sombong” atau “bertindak lancang.” Kata Ibrani ini menunjuk pada tindakan sengaja yang melampaui wewenang dengan sikap angkuh.
    reason: lexical_alternative
  - marker: b
    text: Atau, “harus dihukum mati.” Bahasa Ibraninya menyatakan hukuman mati secara singkat tanpa menyebutkan secara eksplisit cara pelaksanaannya.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: Namun
  rationale: Menandai pertentangan tegas dengan nabi yang sah dalam konteks sebelumnya dan terdengar wajar dalam bahasa Indonesia modern.
- source_word: יָזִיד
  choice: dengan lancang
  rationale: Mengungkap tindakan sengaja yang melampaui wewenang dengan nuansa kesombongan atau kenekatan, sesuai bentuk Hifil dari זיד.
- source_word: לְדַבֵּר דָּבָר
  choice: menyampaikan perkataan
  rationale: Mempertahankan unsur ‘berbicara/perkataan’ dari konstruksi Ibrani sambil mengungkap fungsi perkataan itu sebagai pesan kenabian secara alami.
- source_word: בִּשְׁמִי
  choice: demi nama-Ku
  rationale: Dalam konteks ini berarti mengatasnamakan Allah atau mengklaim wewenang-Nya; ‘demi nama-Ku’ mempertahankan idiom nama dan lebih jelas daripada sekadar lokasi metaforis.
- source_word: אֵת אֲשֶׁר לֹא צִוִּיתִיו לְדַבֵּר
  choice: yaitu perkataan yang tidak Kuperintahkan kepadanya untuk disampaikan
  rationale: Mempertahankan klausa relatif, objek yang tidak diperintahkan, dan bahasa perintah ilahi tanpa menambah isi.
- source_word: וַאֲשֶׁר יְדַבֵּר
  choice: atau yang berbicara
  rationale: 'Waw menghubungkan pelanggaran kedua yang bersifat alternatif: berbicara tanpa perintah atas nama Allah atau berbicara atas nama ilah lain.'
- source_word: בְּשֵׁם אֱלֹהִים אֲחֵרִים
  choice: demi nama ilah-ilah lain
  rationale: Mempertahankan bentuk jamak dan gagasan bahwa nama ilah lain dijadikan dasar kewenangan.
- source_word: וּמֵת הַנָּבִיא הַהוּא
  choice: nabi itu harus mati
  rationale: Menyampaikan rumusan hukuman secara ringkas dan tegas tanpa memperjelas mekanisme kematian yang tidak dinyatakan secara eksplisit oleh bentuk Ibrani.
theological_decisions:
- issue: Rujukan nama ilahi dalam ujaran orang pertama
  choice: nama-Ku
  alternative: nama TUHAN
  rationale: Teks Ibrani merupakan ujaran langsung Allah dalam orang pertama. Mempertahankan pronomina orang pertama menghindari penambahan sebutan ilahi yang tidak terdapat dalam ayat ini.
- issue: Rumusan hukuman mati
  choice: harus mati
  alternative: harus dihukum mati
  rationale: Bentuk וּמֵת menyatakan konsekuensi hukum secara ringkas. ‘Harus mati’ mempertahankan ketegasan itu tanpa menambahkan kausatif atau pelaksana hukuman yang tidak disebutkan secara eksplisit.
- issue: Sifat pelanggaran nabi
  choice: dengan lancang
  alternative: dengan sombong / bertindak lancang
  rationale: Pilihan ini mempertahankan unsur kesengajaan dan pelampauan wewenang dalam יָזִיד tanpa membatasi maknanya hanya pada keadaan batin berupa kesombongan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur hukum ayat dipertahankan, tetapi susunan klausa dibuat alami. Kapitalisasi pada ‘nama-Ku’ menandai rujukan pronominal kepada Allah sesuai kebiasaan penerbitan Alkitab bahasa Indonesia.
