base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/015.yaml
  text: Yahweh your God will raise up for you a prophet like me from among you[a], from your brothers[b]; you must listen to him.
translation:
  language: id
  text: TUHAN, Allahmu, akan membangkitkan bagimu seorang nabi dari tengah-tengahmu, dari antara saudara-saudaramu, seperti aku[b]. Kalian harus mendengarkannya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dari tengah-tengahmu, dari sesama orang Israel.” Ungkapan Ibrani yang secara harfiah berarti “dari saudara-saudaramu” di sini merujuk kepada anggota umat Israel secara umum.
    reason: lexical_alternative
  - marker: b
    text: Ayat ini kemudian diterapkan kepada Mesias dalam Perjanjian Baru. Namun, teks Ibrani di sini hanya berbunyi “seorang nabi seperti aku.”
    reason: cross_reference
lexical_decisions:
- source_word: נָבִיא
  choice: seorang nabi
  rationale: Nomina tunggal tanpa artikel ini paling wajar diterjemahkan secara tak tentu. Pilihan ini mempertahankan bentuk tunggal tanpa menetapkan identitas nabi itu secara eksplisit.
- source_word: מִקִּרְבְּךָ
  choice: dari tengah-tengahmu
  rationale: Terjemahan ini dekat dengan ungkapan Ibrani dan menyatakan bahwa nabi tersebut muncul dari dalam umat Israel.
- source_word: מֵאַחֶיךָ
  choice: dari antara saudara-saudaramu
  rationale: Istilah kekerabatan jamak ini merujuk kepada sesama anggota Israel. 'Saudara-saudaramu' mempertahankan gambaran kekerabatan dan tetap alami dalam bahasa Indonesia.
- source_word: כָּמֹנִי
  choice: seperti aku
  rationale: Perbandingan langsung dengan Musa dipertahankan secara sederhana tanpa menambahkan penafsiran mengenai identitas nabi tersebut.
- source_word: יָקִים לְךָ
  choice: akan membangkitkan bagimu
  rationale: Bentuk kausatif dari קום dapat berarti menghadirkan atau mengangkat seseorang untuk suatu tugas. 'Membangkitkan' mempertahankan citra verbal sumber, sedangkan 'bagimu' mempertahankan nuansa benefaktif.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: TUHAN, Allahmu
  rationale: Nama ilahi יהוה diterjemahkan dengan bentuk konvensional 'TUHAN', dan aposisi 'Allahmu' mempertahankan ungkapan perjanjian dalam teks sumber.
- source_word: אֵלָיו
  choice: dia
  rationale: Objek yang dituju oleh tindakan mendengarkan tetap dinyatakan secara eksplisit, sesuai dengan preposisi Ibrani.
- source_word: תִּשְׁמָעוּן
  choice: Kalian harus mendengarkan
  rationale: Bentuk orang kedua jamak diberi penanda 'kalian', sehingga peralihan dari sapaan kolektif tunggal sebelumnya tetap terlihat. 'Harus mendengarkan' menyampaikan daya perintah tanpa mempersempit makna שׁמע menjadi 'menaati' saja.
theological_decisions:
- issue: Kemungkinan kekhususan mesianik dari ungkapan 'seorang nabi seperti aku'
  choice: Teks utama mempertahankan ungkapan tak tentu 'seorang nabi seperti aku'.
  alternative: Menerjemahkannya secara eksplisit sebagai gelar mesianik, misalnya 'Nabi itu'.
  rationale: Teks Ibrani sendiri tidak memakai artikel tertentu atau gelar mesianik eksplisit. Penerapannya dalam Perjanjian Baru dicatat dalam catatan kaki, bukan dimasukkan ke dalam terjemahan ayat.
- issue: Cakupan istilah kekerabatan אַח dalam bentuk jamak
  choice: Menggunakan 'saudara-saudaramu' dan menjelaskan rujukan komunalnya dalam catatan kaki.
  alternative: Menggunakan parafrasa langsung 'sesama orang Israel'.
  rationale: Pilihan utama mempertahankan metafora kekerabatan dari bahasa Ibrani, sementara catatan kaki menjelaskan bahwa yang dimaksud ialah anggota umat Israel secara umum.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat tetapi mudah dipahami. 'TUHAN' mengikuti konvensi penerjemahan nama ilahi. Pemakaian 'kalian' pada klausa terakhir sengaja menandai bentuk orang kedua jamak dalam bahasa Ibrani, sedangkan bentuk berakhiran '-mu' sebelumnya mempertahankan sapaan kolektif tunggal kepada Israel.
