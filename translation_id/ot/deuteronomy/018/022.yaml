source:
  edition: WLC
  text: אֲשֶׁר֩ יְדַבֵּ֨ר הַ/נָּבִ֜יא בְּ/שֵׁ֣ם יְהוָ֗ה וְ/לֹֽא יִהְיֶ֤ה הַ/דָּבָר֙ וְ/לֹ֣א יָב֔וֹא ה֣וּא הַ/דָּבָ֔ר אֲשֶׁ֥ר לֹא דִבְּר֖/וֹ יְהוָ֑ה בְּ/זָדוֹן֙ דִּבְּר֣/וֹ הַ/נָּבִ֔יא לֹ֥א תָג֖וּר מִמֶּֽ/נּוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/018/022.yaml
  text: When the prophet speaks in the name of Yahweh[a], and the matter does not happen or come about, that is the matter that Yahweh has not spoken. The prophet has spoken it presumptuously[c][b]; you shall not fear him.
translation:
  language: id
  text: Apabila seorang nabi berbicara atas nama Yahweh dan apa yang dikatakannya[a] tidak terjadi atau tidak menjadi kenyataan, itulah perkataan yang tidak difirmankan oleh Yahweh. Nabi itu telah mengucapkannya dengan lancang[b]; jangan takut kepadanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani דָּבָר dapat berarti “perkataan”, “perkara”, atau “hal”; di sini kata itu mencakup pesan yang diucapkan dan peristiwa yang dinubuatkan.
    reason: lexical_alternative
  - marker: b
    text: “Dengan lancang” berarti nabi itu dengan angkuh dan atas kehendaknya sendiri berbicara tanpa wewenang Yahweh.
    reason: cultural_note
lexical_decisions:
- source_word: אֲשֶׁר יְדַבֵּר הַנָּבִיא
  choice: Apabila seorang nabi berbicara
  rationale: Bentuk imperfek dalam konteks hukum menyatakan kasus umum. Walaupun Ibrani memakai kata sandang tertentu, bahasa Indonesia secara alami memakai “seorang nabi” untuk menyatakan pelaku generik.
- source_word: בְּשֵׁם יְהוָה
  choice: atas nama Yahweh
  rationale: “Atas nama” merupakan ungkapan Indonesia yang wajar untuk klaim berbicara dengan wewenang pihak lain; nama ilahi יהוה ditransliterasikan sebagai “Yahweh”.
- source_word: הַדָּבָר
  choice: perkataan
  rationale: דָּבָר di sini mencakup pesan yang diucapkan sekaligus perkara atau peristiwa yang dinubuatkan. “Perkataan” mempertahankan fokus pada ucapan nubuat dan dapat merujuk pada isi nubuat yang harus terbukti.
- source_word: וְלֹא יִהְיֶה הַדָּבָר וְלֹא יָבוֹא
  choice: tetapi perkataan itu tidak terjadi dan tidak menjadi kenyataan
  rationale: Dua verba Ibrani dipertahankan dengan dua ungkapan Indonesia. “Menjadi kenyataan” dengan jelas menyatakan tidak terpenuhinya nubuat, sedangkan “terjadi” mempertahankan ungkapan pertama.
- source_word: הוּא הַדָּבָר אֲשֶׁר לֹא דִבְּרוֹ יְהוָה
  choice: itulah perkataan yang tidak difirmankan oleh Yahweh
  rationale: “Itulah” mempertahankan penegasan identifikasi הוּא. “Difirmankan” merupakan ungkapan Indonesia yang wajar bagi tindakan Yahweh menyampaikan firman tanpa menambahkan klaim di luar teks.
- source_word: בְּזָדוֹן דִּבְּרוֹ הַנָּבִיא
  choice: Nabi itu telah mengucapkannya dengan lancang
  rationale: “Dengan lancang” menyampaikan keberanian yang angkuh dan tanpa wewenang dalam זָדוֹן. Akhiran objek pada דִּבְּרוֹ dipertahankan melalui “-nya”.
- source_word: לֹא תָגוּר מִמֶּנּוּ
  choice: jangan takut kepadanya
  rationale: Larangan langsung ini mempertahankan arti dasar takut atau merasa gentar terhadap nabi tersebut dan terdengar jelas dalam bahasa Indonesia modern.
theological_decisions:
- issue: Penulisan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama diri perjanjian יהוה. Transliterasi “Yahweh” mempertahankan nama tersebut alih-alih menggantinya dengan gelar.
- issue: Cakupan pengujian nabi
  choice: Menerjemahkan ayat sebagai pengujian terhadap klaim nubuat berdasarkan apakah perkataan itu menjadi kenyataan
  alternative: Memperluasnya menjadi rumusan lengkap tentang segala bentuk nubuat
  rationale: Ayat ini sendiri berfokus pada perkataan yang diklaim berasal dari Yahweh tetapi tidak terjadi. Terjemahan tidak menambahkan ketentuan teologis yang tidak dinyatakan dalam ayat.
- issue: Nuansa בְּזָדוֹן
  choice: dengan lancang
  alternative: dengan sombong; dengan gegabah
  rationale: Kata itu menunjukkan tindakan angkuh dan disengaja yang melampaui wewenang, bukan sekadar kekeliruan tanpa sengaja.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-keagamaan yang bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sambil mempertahankan pengulangan דָּבָר, dua ungkapan tentang tidak terpenuhinya nubuat, dan larangan penutup yang langsung.
