  text: וּ/מָ֨ל יְהוָ֧ה אֱלֹהֶ֛י/ךָ אֶת לְבָבְ/ךָ֖ וְ/אֶת לְבַ֣ב זַרְעֶ֑/ךָ לְ/אַהֲבָ֞ה אֶת יְהוָ֧ה אֱלֹהֶ֛י/ךָ בְּ/כָל לְבָבְ/ךָ֥ וּ/בְ/כָל נַפְשְׁ/ךָ֖ לְמַ֥עַן חַיֶּֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/006.yaml
  text: And Yahweh your God will circumcise your heart and the heart of your offspring[a], so that you may love Yahweh your God with all your heart and with all your soul[c][b], so that you may live.
translation:
  language: id
  text: Yahweh, Allahmu, akan menyunat hatimu dan hati keturunanmu[a], supaya engkau mengasihi Yahweh, Allahmu, dengan segenap hatimu dan dengan segenap jiwamu[b], supaya engkau hidup.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “hati para keturunanmu.”'
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “jiwa” juga dapat berarti “hidup” atau “seluruh diri.”
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah, “demi kehidupanmu”; ungkapan ini menyatakan tujuan: “supaya engkau hidup.”'
    reason: source_form_and_ambiguity
lexical_decisions:
- source_word: וּמָל
  choice: akan menyunat
  rationale: Kata kerja מול secara harfiah berarti menyunat. Karena objeknya adalah hati, ungkapan ini bersifat metaforis, tetapi citra perjanjian yang penting tetap dipertahankan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai Yahweh, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk dengan akhiran orang kedua tunggal diterjemahkan secara alami sebagai Allahmu dalam sapaan perjanjian.
- source_word: לְבָבְךָ
  choice: hatimu
  rationale: לֵבָב menunjuk pada batin manusia, termasuk kehendak dan kasih; 'hati' merupakan padanan Indonesia yang alami dan cukup luas.
- source_word: לְבַב זַרְעֶךָ
  choice: hati keturunanmu
  rationale: זֶרַע dapat berarti benih, keturunan, atau para keturunan. 'Keturunanmu' alami dalam bahasa Indonesia dan mempertahankan makna kolektifnya.
- source_word: לְאַהֲבָה
  choice: supaya engkau mengasihi
  rationale: Infinitif dengan ל menyatakan tujuan atau hasil; 'supaya' menyampaikan daya purposif tersebut secara alami.
- source_word: בְּכָל לְבָבְךָ
  choice: dengan segenap hatimu
  rationale: Ungkapan ini menyatakan pengabdian yang utuh dan merupakan rumusan Indonesia yang wajar serta bermartabat.
- source_word: וּבְכָל נַפְשְׁךָ
  choice: dan dengan segenap jiwamu
  rationale: נֶפֶשׁ dapat menunjuk pada jiwa, nyawa, kehidupan, atau seluruh diri. 'Jiwa' mempertahankan rumusan perjanjian yang dikenal tanpa menutup nuansa seluruh diri, yang dijelaskan dalam catatan.
- source_word: לְמַעַן חַיֶּיךָ
  choice: sehingga engkau hidup
  rationale: לְמַעַן dapat menandai tujuan atau hasil. 'Sehingga engkau hidup' alami dalam bahasa Indonesia dan tetap menyisakan hubungan tujuan-hasil yang terdapat dalam teks.
theological_decisions:
- issue: Metafora perjanjian tentang sunat hati
  choice: Metafora 'menyunat hatimu' dipertahankan dalam teks utama.
  alternative: mengubah hatimu; menyucikan hatimu
  rationale: Teks memakai tanda perjanjian sebagai citra perubahan batin oleh Allah. Mempertahankan metafora menjaga hubungan teologis itu tanpa memasukkan rumusan doktrinal yang tidak dinyatakan ayat.
- issue: Makna נֶפֶשׁ dalam rumusan perintah mengasihi
  choice: Diterjemahkan sebagai 'jiwa' dalam teks utama, dengan catatan mengenai nuansa 'seluruh diri' atau 'hidup'.
  alternative: seluruh dirimu; segenap hidupmu
  rationale: Istilah ini dapat mencakup seluruh pribadi yang hidup. 'Jiwa' menjaga rumusan yang akrab, sedangkan catatan mencegah pembaca memahaminya secara terlalu sempit.
- issue: Hubungan semantis לְמַעַן pada klausa terakhir
  choice: Diterjemahkan 'sehingga engkau hidup'.
  alternative: supaya engkau hidup
  rationale: Konstruksi ini dapat menyatakan tujuan maupun hasil. 'Sehingga' membantu membedakannya dari klausa tujuan sebelumnya sambil tetap mempertahankan ketegangan tujuan-hasil.
translation_notes:
  register: Bahasa Indonesia baku modern dengan gaya yang bermartabat dan mudah dipahami. Pronomina tunggal 'engkau' mempertahankan sapaan orang kedua tunggal dalam teks Ibrani. Metafora 'menyunat hati' sengaja dipertahankan dan tidak diperhalus menjadi parafrasa.
