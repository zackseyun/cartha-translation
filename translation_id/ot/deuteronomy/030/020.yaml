  text: לְ/אַֽהֲבָה֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֥עַ בְּ/קֹל֖/וֹ וּ/לְ/דָבְקָה ב֑/וֹ כִּ֣י ה֤וּא חַיֶּ֨י/ךָ֙ וְ/אֹ֣רֶךְ יָמֶ֔י/ךָ לָ/שֶׁ֣בֶת עַל הָ/אֲדָמָ֗ה אֲשֶׁר֩ נִשְׁבַּ֨ע יְהוָ֧ה לַ/אֲבֹתֶ֛י/ךָ לְ/אַבְרָהָ֛ם לְ/יִצְחָ֥ק וּֽ/לְ/יַעֲקֹ֖ב לָ/תֵ֥ת לָ/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/020.yaml
  text: by loving Yahweh your God[a], by listening to his voice, and by holding fast to him; for he is your life and the length of your days, that you may dwell on the land that Yahweh swore to your fathers, to Abraham, to Isaac, and to Jacob[c][b], to give to them.
translation:
  language: id
  text: dengan mengasihi Yahweh, Allahmu, mendengarkan suara-Nya[a], dan berpaut kepada-Nya[b]. Sebab Dialah hidupmu dan panjang umurmu, supaya engkau tinggal di tanah yang Yahweh telah bersumpah kepada nenek moyangmu[c]—kepada Abraham, Ishak, dan Yakub—untuk memberikannya kepada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “menaati-Nya.” Ungkapan Ibrani “mendengarkan suara-Nya” sering mencakup arti mengindahkan atau menaati.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “melekat erat kepada-Nya.”
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “bapa-bapamu”; yang dimaksud di sini ialah Abraham, Ishak, dan Yakub.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאַהֲבָה
  choice: dengan mengasihi
  rationale: Infinitif dengan לְ meneruskan penjelasan tentang cara menjalankan perintah untuk memilih hidup dalam ayat sebelumnya; bentuk instrumental ini alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri untuk menjaga ciri perjanjian dalam teks Ibrani.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Padanan langsung bagi bentuk dengan akhiran orang kedua tunggal dan alami sebagai aposisi sesudah nama Yahweh.
- source_word: לִשְׁמֹעַ בְּקֹלוֹ
  choice: mendengarkan suara-Nya
  rationale: Mempertahankan ungkapan konkret Ibrani, sementara nuansa menaati atau mengindahkan dijelaskan dalam catatan kaki.
- source_word: וּלְדָבְקָה בוֹ
  choice: dan berpaut kepada-Nya
  rationale: דבק menyatakan keterikatan yang erat dan kesetiaan; 'berpaut' alami, ringkas, dan tidak searkais 'melekat teguh'.
- source_word: כִּי הוּא חַיֶּיךָ
  choice: Sebab Dialah hidupmu
  rationale: Kata ganti paling wajar menunjuk kepada Yahweh sendiri. 'Dialah' mempertahankan penekanan personal pada klausa Ibrani.
- source_word: וְאֹרֶךְ יָמֶיךָ
  choice: dan panjang umurmu
  rationale: Ungkapan ringkas ini mempertahankan gambaran Ibrani tentang panjangnya hari-hari tanpa menambah gagasan 'sumber' yang tidak dinyatakan.
- source_word: לָשֶׁבֶת עַל הָאֲדָמָה
  choice: supaya engkau tinggal di tanah
  rationale: Infinitif dipahami sebagai tujuan atau hasil. 'Tanah' menjaga kaitan dengan wilayah yang dijanjikan.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה
  choice: yang Yahweh janjikan dengan sumpah
  rationale: נשבע secara harfiah berarti bersumpah; rumusan ini menyampaikan bahwa pemberian tanah dijamin oleh sumpah Yahweh secara jelas dan alami.
- source_word: לַאֲבֹתֶיךָ
  choice: kepada nenek moyangmu
  rationale: Dalam bahasa Indonesia, 'nenek moyang' adalah padanan alami bagi leluhur laki-laki; nama Abraham, Ishak, dan Yakub segera memperjelas rujukannya.
- source_word: לָתֵת לָהֶם
  choice: untuk diberikan kepada mereka
  rationale: Mempertahankan tujuan sumpah dan objek tidak langsung 'kepada mereka' yang dinyatakan secara eksplisit dalam bahasa Ibrani.
theological_decisions:
- issue: Rujukan kata ganti הוּא dalam 'sebab Dialah hidupmu'
  choice: Kata ganti itu menunjuk kepada Yahweh sendiri.
  alternative: Kata ganti itu dapat dipahami secara konseptual sebagai menunjuk kepada jalan ketaatan perjanjian yang baru disebutkan.
  rationale: Anteseden personal yang paling dekat dan menonjol ialah Yahweh, Allahmu. Namun hubungan konseptual antara hidup dan ketaatan tetap tampak dari keseluruhan kalimat tanpa perlu memasukkannya ke dalam terjemahan.
- issue: Hubungan sumpah dengan pemberian tanah
  choice: Yahweh bersumpah kepada para leluhur bahwa tanah itu akan diberikan kepada mereka.
  alternative: 'Ungkapan dapat diterjemahkan lebih harfiah tetapi kurang alami: ''tanah yang Yahweh bersumpah kepada nenek moyangmu ... untuk memberikan kepada mereka.'''
  rationale: Susunan Indonesia diperjelas tanpa mengubah pihak yang bersumpah, penerima sumpah, atau isi sumpah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk orang kedua tunggal 'engkau' dipertahankan karena teks Ibrani menyapa Israel secara korporat dalam bentuk tunggal. Tanda pisah mengapit nama ketiga leluhur agar hubungan aposisionalnya jelas. Semua penanda catatan kaki ditempatkan langsung sesudah frasa yang dijelaskannya.
