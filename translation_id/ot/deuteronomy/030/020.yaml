  to: dengan mengasihi Yahweh, Allahmu, mendengarkan suara-Nya[a], dan berpaut kepada-Nya[b]. Sebab Dialah hidupmu dan panjang umurmu, supaya engkau tinggal di tanah yang Yahweh telah bersumpah kepada nenek moyangmu[c]—kepada Abraham, Ishak, dan Yakub—untuk memberikannya kepada mereka.
