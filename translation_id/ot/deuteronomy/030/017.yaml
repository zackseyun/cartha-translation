  source_fidelity: 'Terjemahan mempertahankan susunan kondisional dan urutan tindakan dalam teks Ibrani: hati berpaling, tidak mendengarkan, terseret/teralihkan, bersujud kepada ilah-ilah lain, lalu mengabdi kepada mereka. Namun, “terbawa menyimpang” tidak lazim dalam bahasa Indonesia dan kurang jelas sebagai padanan Niphal נִדַּחְתָּ, yang menyatakan bahwa subjek disesatkan atau didorong menjauh dari kesetiaan yang semestinya.'
  naturalness: “Kamu disesatkan” adalah ungkapan baku dan jelas dalam bahasa Indonesia modern untuk tindakan pasif yang membawa seseorang ke jalan yang salah. Pengulangan “dan” lebih mencerminkan rangkaian waw Ibrani daripada “lalu,” tanpa mengubah perkembangan tindakan yang tersirat.
  terminology: “Ilah-ilah lain,” “bersujud,” dan “mengabdi kepada mereka” layak dipertahankan. Ketiganya membedakan dewa-dewa saingan dari Allah dan mempertahankan perbedaan leksikal antara tindakan bersujud (השתחוה) dan pelayanan/pengabdian kultis (עבד). Catatan untuk “mendengarkan” tepat, tetapi jangkar catatan bagi נִדַּחְתָּ perlu mengikuti padanan yang direvisi.
