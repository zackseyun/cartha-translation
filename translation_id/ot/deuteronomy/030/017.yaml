base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/017.yaml
  text: But if your heart turns away[a], and you do not listen, and you are drawn away and bow down to other gods and serve them[b],
translation:
  language: id
  text: Namun, jika hatimu berpaling dan kamu tidak mendengarkan[a], dan kamu disesatkan[b] lalu bersujud kepada ilah-ilah lain dan mengabdi kepada mereka,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam konteks perjanjian, “mendengarkan” juga dapat berarti “menaati,” yaitu mengindahkan apa yang diperintahkan.
    reason: lexical_alternative
  - marker: b
    text: Atau “kamu terseret” atau “kamu didorong menjauh.” Kata Ibrani ini dapat menggambarkan seseorang yang dibawa menjauh dari arah dan kesetiaan yang semestinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: Namun, jika
  rationale: Kata penghubung membuka syarat yang berlawanan dengan ajakan positif sebelumnya; “Namun, jika” menyampaikan fungsi pertentangan itu secara wajar.
- source_word: יִפְנֶה לְבָבְךָ
  choice: hatimu berpaling
  rationale: Ungkapan ini menggambarkan perubahan arah batin dan kesetiaan; “berpaling” mempertahankan metafora geraknya tanpa memperluas makna.
- source_word: וְלֹא תִשְׁמָע
  choice: kamu tidak mendengarkan
  rationale: שׁמע dapat berarti mendengar, mendengarkan, atau menaati. “Mendengarkan” mempertahankan citra pendengaran sambil tetap memungkinkan nuansa ketaatan dalam konteks perjanjian.
- source_word: וְנִדַּחְתָּ
  choice: kamu terbawa menyimpang
  rationale: Bentuk pasif/refleksif verba נדח menyatakan bahwa seseorang terbawa, terdorong, atau disimpangkan dari arah dan kesetiaan yang benar. Pilihan ini menjaga unsur pergerakan pasif tanpa menentukan pelakunya.
- source_word: וְהִשְׁתַּחֲוִיתָ
  choice: bersujud
  rationale: Verba ini secara konkret menunjuk tindakan membungkuk atau merebahkan diri; “bersujud” mempertahankan tindakan jasmani yang dalam konteks ini merupakan penyembahan.
- source_word: לֵאלֹהִים אֲחֵרִים
  choice: kepada ilah-ilah lain
  rationale: Ini merupakan padanan langsung bagi ungkapan baku tentang dewa-dewa saingan, tanpa menyiratkan bahwa mereka benar-benar ilahi.
- source_word: וַעֲבַדְתָּם
  choice: mengabdi kepada mereka
  rationale: עבד menunjuk pelayanan atau pengabdian, dan di sini bermakna pelayanan kultis kepada ilah-ilah lain. “Mengabdi” mempertahankan gagasan pelayanan serta nuansa keagamaannya.
theological_decisions:
- issue: Rangkaian kemurtadan dalam ayat
  choice: 'Mempertahankan urutan: hati berpaling, tidak mendengarkan, terbawa menyimpang, bersujud kepada ilah-ilah lain, dan mengabdi kepada mereka.'
  alternative: Menerjemahkan שׁמע langsung sebagai “menaati” atau menjadikan וְנִדַּחְתָּ lebih aktif, seperti “membiarkan dirimu disesatkan.”
  rationale: Teks Ibrani menyajikan rangkaian ketidaksetiaan perjanjian tanpa menjelaskan pelaku yang menyebabkan penyimpangan. Terjemahan mempertahankan perkembangan dan ketegangan itu tanpa menambahkan kesimpulan teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan tunggal dipertahankan dengan “kamu/hatimu.” “Ilah-ilah” dipilih untuk membedakan dewa-dewa lain dari Allah, sedangkan “bersujud” dan “mengabdi” menjaga pembedaan leksikal antara השתחוה dan עבד.
