  source_fidelity: Terjemahan dengan tepat mempertahankan pemanggilan langit dan bumi sebagai saksi yang bersifat forensik terhadap pihak yang disapa, pasangan kehidupan–kematian dan berkat–kutuk, serta tujuan agar pihak yang disapa dan keturunannya hidup. Tidak ada tambahan inferensial seperti “maka” yang dipaksakan dari waw.
  naturalness: “Memperhadapkan kepadamu” dapat dipahami, tetapi kurang lazim untuk tindakan Allah menaruh pilihan di depan seseorang. “Menempatkan di hadapanmu” lebih idiomatis dalam bahasa Indonesia baku dan mempertahankan citra spasial לְפָנֶיךָ.
  terminology: “Berkat dan kutuk,” “kehidupan dan kematian,” serta “keturunanmu” sesuai register Alkitab bahasa Indonesia modern. “Terhadapmu” lebih padu daripada “terhadap kamu” dalam konstruksi ini.
