  variant: modern standard Indonesian
source:
  edition: WLC
  text: הַעִידֹ֨תִי בָ/כֶ֣ם הַ/יּוֹם֮ אֶת הַ/שָּׁמַ֣יִם וְ/אֶת הָ/אָרֶץ֒ הַ/חַיִּ֤ים וְ/הַ/מָּ֨וֶת֙ נָתַ֣תִּי לְ/פָנֶ֔י/ךָ הַ/בְּרָכָ֖ה וְ/הַ/קְּלָלָ֑ה וּ/בָֽחַרְתָּ֙ בַּֽ/חַיִּ֔ים לְמַ֥עַן תִּחְיֶ֖ה אַתָּ֥ה וְ/זַרְעֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/019.yaml
  text: 'I call heaven and earth to witness against you today: I have set before you life and death[a], blessing and curse. Choose life, so that you and your offspring may live[c][b],'
translation:
  language: id
  text: 'Pada hari ini aku memanggil langit dan bumi sebagai saksi terhadapmu[a]: Aku telah menempatkan di hadapanmu kehidupan dan kematian, berkat dan kutuk. Pilihlah kehidupan supaya kamu dan keturunanmu[b] hidup.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ungkapan ini memakai bahasa hukum perjanjian: langit dan bumi dipanggil sebagai saksi terhadap Israel.'
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “benihmu”; maksudnya keturunanmu.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעִידֹתִי בָכֶם
  choice: aku memanggil ... sebagai saksi terhadap kamu
  rationale: 'Bentuk Hifil dari עוּד bersama בָכֶם bernuansa hukum-perjanjian: Musa menghadirkan saksi terhadap pihak yang sedang disapa, bukan sekadar memberi peringatan.'
- source_word: הַיּוֹם
  choice: pada hari ini
  rationale: Ungkapan ini alami dalam bahasa Indonesia modern dan mempertahankan penekanan waktu dalam teks Ibrani.
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: langit dan bumi
  rationale: Pasangan baku ini merangkum seluruh ciptaan dan berfungsi sebagai rumusan pemanggilan saksi perjanjian.
- source_word: הַחַיִּים וְהַמָּוֶת
  choice: kehidupan dan kematian
  rationale: Terjemahan langsung yang mempertahankan pertentangan antara dua hasil perjanjian.
- source_word: נָתַתִּי לְפָנֶיךָ
  choice: Aku telah memperhadapkan kepadamu
  rationale: Dalam konteks pilihan, נָתַן לִפְנֵי berarti menempatkan atau menyajikan sesuatu di hadapan seseorang. 'Memperhadapkan kepadamu' ringkas, wajar, dan mempertahankan gambaran tersebut.
- source_word: הַבְּרָכָה וְהַקְּלָלָה
  choice: berkat dan kutuk
  rationale: Mempertahankan bentuk tunggal dan pertentangan ringkas dalam bahasa sumber; 'kutuk' sesuai dengan register Alkitab yang tetap dapat dipahami pembaca modern.
- source_word: וּבָחַרְתָּ בַּחַיִּים
  choice: Pilihlah kehidupan
  rationale: Waw membuka desakan lanjutan, tetapi tidak perlu diterjemahkan dengan penghubung sebab-akibat yang lebih tegas seperti 'karena itu'. Bentuk perintah menyampaikan daya nasihat dalam konteks.
- source_word: לְמַעַן תִּחְיֶה
  choice: supaya ... hidup
  rationale: Menyampaikan tujuan atau hasil yang terkandung dalam לְמַעַן tanpa menentukan secara berlebihan hubungan di antara keduanya.
- source_word: אַתָּה וְזַרְעֶךָ
  choice: kamu dan keturunanmu
  rationale: זֶרַע secara harfiah berarti 'benih' dan secara kolektif menunjuk pada keturunan. 'Keturunanmu' merupakan padanan Indonesia yang alami serta mencakup kesinambungan antargenerasi.
theological_decisions:
- issue: Kerangka hukum dan saksi perjanjian
  choice: Mempertahankan pemanggilan langit dan bumi sebagai saksi terhadap pihak perjanjian.
  alternative: Aku memperingatkan kamu pada hari ini dengan langit dan bumi sebagai saksi.
  rationale: Susunan Ibrani bersifat forensik dan perjanjian. Terjemahan utama mempertahankan bobot hukum itu tanpa menambahkan kesimpulan doktrinal di luar ayat.
- issue: Kata ganti orang kedua tunggal yang mewakili Israel
  choice: Menggunakan 'kamu' dan bentuk terikat tunggal '-mu'.
  alternative: kalian / kamu semua
  rationale: Semua bentuk orang kedua dalam bahasa Ibrani di ayat ini adalah maskulin tunggal dan menyapa Israel sebagai satu pihak perjanjian. Bahasa Indonesia memungkinkan bentuk tunggal itu dipertahankan.
- issue: Hubungan waw sebelum perintah memilih
  choice: Tidak menambahkan 'karena itu' atau 'maka'.
  alternative: Maka pilihlah kehidupan.
  rationale: Waw dapat menghubungkan nasihat dengan pilihan yang baru dikemukakan, tetapi teks tidak secara eksplisit memakai penanda inferensial. Bentuk 'Pilihlah' mempertahankan desakan tanpa mempersempit hubungan wacananya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Aku' tidak dikapitalisasi karena penutur langsung dalam ayat ini adalah Musa. Tanda baca menampilkan pernyataan saksi dan seruan memilih secara jelas tanpa menambahkan hubungan logis yang tidak dinyatakan secara eksplisit.
