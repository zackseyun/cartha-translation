base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/011.yaml
  text: For this commandment that I am commanding you today is not too difficult for you[a], nor is it far away.
translation:
  language: id
  text: Sebab perintah ini, yang kuperintahkan kepadamu hari ini, tidaklah terlalu sukar bagimu[a] dan tidak pula jauh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak berada di luar jangkauanmu” atau “tidak tersembunyi darimu.” Kata kerja Ibrani yang digunakan dapat berarti luar biasa, tidak terjangkau, atau melampaui pemahaman seseorang.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau penjelasan bagi ajakan sebelumnya; “Sebab” mempertahankan alur wacana dengan wajar.
- source_word: הַמִּצְוָה הַזֹּאת
  choice: perintah
  rationale: מִצְוָה berarti perintah atau ketetapan. “Perintah” alami dalam bahasa Indonesia modern dan tetap mempertahankan corak hukum-perjanjian kitab Ulangan.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: yang kusampaikan kepadamu hari ini
  rationale: Ungkapan ini menyatakan perintah yang sedang Musa berikan pada hari itu. “Kusampaikan” menghindari pengulangan kaku “perintah yang kuperintahkan” tanpa menghilangkan daya perintahnya.
- source_word: לֹא נִפְלֵאת הִוא מִמְּךָ
  choice: tidaklah terlalu sukar bagimu
  rationale: Dalam konteks ini, פלא menunjuk pada sesuatu yang luar biasa, tak terjangkau, atau melampaui kemampuan untuk dipahami dan dijalankan. Pilihan ini menyampaikan keterjangkauan praktis tanpa membuat klaim doktrinal yang lebih luas.
- source_word: וְלֹא רְחֹקָה הִוא
  choice: dan tidak pula jauh
  rationale: רָחוֹק menyatakan jarak harfiah atau kiasan. “Tidak pula jauh” mempertahankan metafora keterjangkauan yang dikembangkan dalam ayat-ayat berikutnya.
theological_decisions:
- issue: Makna נִפְלֵאת dalam kaitannya dengan kemampuan manusia dan ketaatan pada perjanjian
  choice: tidaklah terlalu sukar bagimu
  alternative: tidak berada di luar jangkauanmu; tidak tersembunyi bagimu
  rationale: Ayat ini menekankan bahwa perintah Allah tidak tak terjangkau dalam konteks perjanjian yang langsung. Terjemahan ini tidak menyelesaikan perdebatan teologis tentang kemampuan moral manusia tanpa pertolongan Allah.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Bentuk terikat “kusampaikan” mempertahankan tutur orang pertama Musa kepada Israel. Penanda catatan kaki [a] dicantumkan tepat setelah frasa yang diterangkannya.
