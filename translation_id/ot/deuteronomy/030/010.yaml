  text: כִּ֣י תִשְׁמַ֗ע בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לִ/שְׁמֹ֤ר מִצְוֺתָי/ו֙ וְ/חֻקֹּתָ֔י/ו הַ/כְּתוּבָ֕ה בְּ/סֵ֥פֶר הַ/תּוֹרָ֖ה הַ/זֶּ֑ה כִּ֤י תָשׁוּב֙ אֶל יְהוָ֣ה אֱלֹהֶ֔י/ךָ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/010.yaml
  text: if you obey the voice of Yahweh your God[a], keeping his commandments and his statutes that are written in this book of the law[b], if you return to Yahweh your God with all your heart and with all your soul.
translation:
  language: id
  text: jika engkau menaati perkataan Yahweh, Allahmu[a] dengan memelihara perintah-perintah dan ketetapan-ketetapan-Nya yang tertulis dalam kitab Taurat ini, jika engkau kembali kepada Yahweh, Allahmu[b] dengan segenap hatimu dan dengan segenap jiwamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mendengarkan suara Yahweh, Allahmu”; ungkapan ini berarti mengindahkan dan menaati apa yang dikatakan-Nya.
    reason: lexical_alternative
  - marker: b
    text: Atau “berbalik kepada” atau “bertobat kepada”.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: jika
  rationale: Dalam kedua kemunculannya, kata ini menyatakan syarat yang berkaitan dengan janji pada ayat sebelumnya; “jika” paling sesuai dengan alur dan sintaksisnya.
- source_word: תִשְׁמַע בְּקוֹל
  choice: engkau menaati perkataan
  rationale: Ungkapan Ibrani ini secara harfiah berarti “mendengarkan suara”, tetapi secara idiomatis berarti mengindahkan dan menaati apa yang dikatakan. Pilihan ini menyampaikan maknanya secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: לִשְׁמֹר
  choice: dengan berpegang pada
  rationale: Infinitif ini menjelaskan cara atau isi ketaatan. “Berpegang pada” alami dalam konteks perjanjian dan tidak mengulang kata “menaati”.
- source_word: מִצְוֺתָיו וְחֻקֹּתָיו
  choice: perintah-perintah dan ketetapan-ketetapan-Nya
  rationale: 'Kedua istilah hukum dibedakan: מִצְוֹת sebagai perintah dan חֻקּוֹת sebagai ketetapan.'
- source_word: בְּסֵפֶר הַתּוֹרָה הַזֶּה
  choice: dalam kitab Taurat ini
  rationale: “Kitab Taurat” merupakan ungkapan Indonesia yang jelas dan lazim untuk dokumen hukum atau pengajaran perjanjian yang dimaksud.
- source_word: תָשׁוּב אֶל
  choice: engkau kembali kepada
  rationale: שׁוּב pada dasarnya berarti berbalik atau kembali. “Kembali kepada” mempertahankan gambaran relasional dan nuansa pertobatan tanpa menggantinya dengan istilah teologis yang lebih interpretatif.
- source_word: בְּכָל לְבָבְךָ וּבְכָל נַפְשֶׁךָ
  choice: dengan segenap hatimu dan dengan segenap jiwamu
  rationale: Terjemahan ini mempertahankan pasangan antropologis Ibrani dan penekanan yang diulang pada keseluruhan diri.
theological_decisions:
- issue: Makna perjanjian dari שׁוּב dalam konteks pertobatan
  choice: kembali
  alternative: berbalik; bertobat
  rationale: “Kembali” mempertahankan arti dasar dan metafora Ibrani sekaligus membiarkan nuansa pertobatan muncul dari konteks, tanpa menyelesaikan ketegangan teologis secara berlebihan.
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Transliterasi ini mempertahankan nama pribadi yang terdapat dalam teks sumber dan membedakannya dari sebuah gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “engkau” dipakai karena sapaan Ibrani berbentuk tunggal. Kalimat sengaja diawali huruf kecil karena ayat ini meneruskan struktur bersyarat dari ayat sebelumnya. Penanda catatan kaki ditempatkan tepat pada frasa yang dijelaskannya.
