source:
  edition: WLC
  text: אֲשֶׁ֨ר אָנֹכִ֣י מְצַוְּ/ךָ֮ הַ/יּוֹם֒ לְ/אַהֲבָ֞ה אֶת יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לָ/לֶ֣כֶת בִּ/דְרָכָ֔י/ו וְ/לִ/שְׁמֹ֛ר מִצְוֺתָ֥י/ו וְ/חֻקֹּתָ֖י/ו וּ/מִשְׁפָּטָ֑י/ו וְ/חָיִ֣יתָ וְ/רָבִ֔יתָ וּ/בֵֽרַכְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בָּ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/016.yaml
  text: 'which I am commanding you today: to love Yahweh your God[a], to walk in his ways, and to keep his commandments, his statutes, and his judgments, so that you may live and multiply[d][c][b], and Yahweh your God may bless you in the land that you are entering there to possess it.'
translation:
  language: id
  text: 'yang pada hari ini kuperintahkan kepadamu: untuk mengasihi Yahweh, Allahmu, berjalan di jalan-jalan-Nya, dan menaati perintah-perintah-Nya, ketetapan-ketetapan-Nya, dan hukum-hukum-Nya.[a] Maka engkau akan hidup dan bertambah banyak,[b] dan Yahweh, Allahmu, akan memberkatimu di negeri yang sedang kaumasuki untuk memilikinya.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata yang diterjemahkan “hukum-hukum” juga dapat diterjemahkan “peraturan-peraturan” atau “keputusan-keputusan hukum”.
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “supaya engkau hidup dan bertambah banyak, dan Yahweh, Allahmu, memberkatimu.” Rangkaian kata kerja Ibrani dapat dipahami sebagai akibat atau janji, maupun sebagai tujuan.'
    reason: alternative_reading
  - marker: c
    text: 'Atau: “untuk mewarisinya.” Dalam konteks janji mengenai tanah, kata Ibrani ini dapat berarti memperoleh atau menduduki sebagai milik, dan juga dapat bernuansa menerima sebagai warisan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: yang kuperintahkan kepadamu hari ini
  rationale: Mempertahankan hubungan relatif dengan kalimat sebelumnya serta penekanan waktu הַיּוֹם. Bentuk Indonesia dibuat wajar tanpa menghilangkan sifat ayat ini sebagai kelanjutan sintaksis.
- source_word: לְאַהֲבָה
  choice: kasihilah
  rationale: Infinitif Ibrani menyatakan isi atau tujuan perintah. Bentuk imperatif Indonesia menyampaikan daya perintah secara alami dalam rangkaian dengan dua tindakan berikutnya.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Allahmu
  rationale: Nama diri ilahi יְהוָה ditransliterasikan sebagai Yahweh, sedangkan אֱלֹהֶיךָ diterjemahkan dengan bentuk posesif orang kedua tunggal.
- source_word: לָלֶכֶת בִּדְרָכָיו
  choice: berjalanlah di jalan-jalan-Nya
  rationale: Mempertahankan metafora Ibrani tentang perilaku hidup dan bentuk jamak דְּרָכָיו, sekalipun ungkapan Indonesia 'hidup menurut jalan-Nya' lebih bebas.
- source_word: לִשְׁמֹר
  choice: taatilah
  rationale: Dalam konteks perjanjian dan hukum, שׁמר berarti menjalankan dengan setia. 'Taatilah' lebih alami dan jelas bagi pembaca Indonesia modern daripada terjemahan harfiah 'peliharalah'.
- source_word: מִצְוֺתָיו וְחֻקֹּתָיו וּמִשְׁפָּטָיו
  choice: perintah-perintah, ketetapan-ketetapan, serta hukum-hukum-Nya
  rationale: Membedakan tiga istilah hukum Ibrani sambil mempertahankan register perjanjian yang resmi. Kepunyaan ilahi yang secara morfologis melekat pada tiap unsur dinyatakan sekali pada akhir daftar sesuai kebiasaan bahasa Indonesia.
- source_word: וְחָיִיתָ וְרָבִיתָ
  choice: engkau akan hidup dan bertambah banyak
  rationale: Bentuk verbal berurutan paling langsung dibaca sebagai akibat atau janji. 'Bertambah banyak' mencakup pertumbuhan jumlah penduduk, bukan sekadar kemakmuran.
- source_word: בָּאָרֶץ אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: di negeri yang kaumasuki untuk mendudukinya
  rationale: Pronomina feminin pada לְרִשְׁתָּהּ dipertahankan melalui '-nya'. שָׁמָּה tidak diterjemahkan tersendiri karena arah 'ke sana' sudah terkandung secara alami dalam 'memasuki' negeri tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama perjanjian empat huruf secara langsung. Transliterasi 'Yahweh' mempertahankan fungsi nama diri tanpa menggantinya dengan gelar.
- issue: Hubungan ketaatan dengan hidup, pertambahan, dan berkat
  choice: Dinyatakan sebagai akibat atau janji dengan 'Dengan demikian ... akan'
  alternative: 'Dapat dinyatakan sebagai tujuan: ''supaya engkau hidup dan bertambah banyak, dan supaya ... memberkatimu'''
  rationale: Urutan bentuk verbal Ibrani memungkinkan nuansa hasil maupun janji. Terjemahan utama tidak menjadikannya rumusan jasa teologis, sedangkan catatan mempertahankan kemungkinan sintaksis tujuan.
- issue: Makna לְרִשְׁתָּהּ dalam konteks tanah
  choice: untuk mendudukinya
  alternative: untuk mewarisinya
  rationale: Akar ירש dapat berarti mengambil milik atau menduduki, dan dalam konteks janji tanah juga dapat bernuansa menerima warisan. Terjemahan utama mempertahankan tindakan memasuki dan mengambil milik tanpa meniadakan alternatif tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan orang kedua tunggal 'engkau' mempertahankan bentuk tunggal Ibrani. Metafora 'berjalan di jalan-jalan-Nya' sengaja dipertahankan, sedangkan שׁמר diterjemahkan secara idiomatis sebagai 'menaati'. Ayat dibiarkan diawali dengan klausa relatif karena teks sumber merupakan kelanjutan langsung dari ayat sebelumnya.
