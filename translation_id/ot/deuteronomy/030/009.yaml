source:
  edition: WLC
  text: וְ/הוֹתִֽירְ/ךָ֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ בְּ/כֹ֣ל מַעֲשֵׂ֣ה יָדֶ֗/ךָ בִּ/פְרִ֨י בִטְנְ/ךָ֜ וּ/בִ/פְרִ֧י בְהֶמְתְּ/ךָ֛ וּ/בִ/פְרִ֥י אַדְמָתְ/ךָ֖ לְ/טוֹבָ֑ה כִּ֣י יָשׁ֣וּב יְהוָ֗ה לָ/שׂ֤וּשׂ עָלֶ֨י/ךָ֙ לְ/ט֔וֹב כַּ/אֲשֶׁר שָׂ֖שׂ עַל אֲבֹתֶֽי/ךָ׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/009.yaml
  text: And Yahweh your God will make you abound in all the work of your hand[a], in the fruit of your womb, in the fruit of your livestock, and in the fruit of your ground, for good; for Yahweh will again rejoice over you for good[b], just as he rejoiced over your fathers.
translation:
  language: id
  text: Yahweh, Allahmu, akan membuatmu berlimpah[a] dalam segala pekerjaan tanganmu, dalam buah kandunganmu, dalam hasil ternakmu, dan dalam hasil tanahmu, untuk kebaikanmu. Sebab Yahweh akan kembali bersukacita atasmu untuk kebaikanmu, sebagaimana Ia bersukacita atas nenek moyangmu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “akan memberimu kelimpahan” atau “akan membuatmu makmur.” Kata kerja Ibrani menyatakan bahwa Yahweh menyebabkan seseorang memiliki kelimpahan atau kelebihan.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “bapa-bapamu,” yaitu para leluhur Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹתִירְךָ
  choice: akan membuatmu berkelimpahan
  rationale: Bentuk Hifil dari יתר menyatakan tindakan menyebabkan seseorang memiliki kelimpahan atau kelebihan; pilihan ini mempertahankan daya kausatif dan cocok dengan daftar berkat konkret sesudahnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai Yahweh, bukan diganti dengan gelar.
- source_word: בְּכֹל מַעֲשֵׂה יָדֶךָ
  choice: dalam segala hasil pekerjaan tanganmu
  rationale: Ungkapan ini menunjuk pada kerja dan usaha seseorang. Penambahan 'hasil' membuat hubungan dengan kelimpahan terdengar alami dalam bahasa Indonesia sambil mempertahankan citra tangan.
- source_word: בִּפְרִי בִטְנְךָ
  choice: dalam buah kandunganmu
  rationale: Metafora Ibrani bagi anak atau keturunan dipertahankan karena dapat dipahami dan memiliki gema rumusan berkat perjanjian.
- source_word: בְהֶמְתְּךָ
  choice: ternakmu
  rationale: Istilah ini secara luas menunjuk pada hewan peliharaan dalam konteks pertanian; 'ternak' alami dan tidak sesempit 'lembu'.
- source_word: אַדְמָתְךָ
  choice: tanahmu
  rationale: Kata ini menunjuk pada tanah yang menghasilkan tanaman; 'tanah' mempertahankan kekonkretan agraris.
- source_word: לְטוֹבָה
  choice: demi kebaikanmu
  rationale: Frasa ini menyatakan hasil yang bermanfaat bagi orang yang disapa. Unsur 'mu' tersirat jelas dari konteks dan membuat bahasa Indonesia alami.
- source_word: יָשׁוּב
  choice: akan kembali
  rationale: Dengan infinitif berikutnya, verba 'kembali' menandai dimulainya lagi tindakan yang pernah dilakukan; pilihan ini mempertahankan citra verbal sumber.
- source_word: לָשׂוּשׂ עָלֶיךָ לְטוֹב
  choice: bersukacita atasmu untuk mendatangkan kebaikan
  rationale: Menerjemahkan sukacita Yahweh terhadap Israel dan tujuan atau akibat baiknya tanpa menghilangkan susunan teologis yang agak tidak biasa.
- source_word: אֲבֹתֶיךָ
  choice: nenek moyangmu
  rationale: Dalam konteks ini bentuk jamak 'bapa-bapamu' merujuk kepada para leluhur Israel. 'Nenek moyang' merupakan padanan Indonesia yang alami tanpa menghapus rujukan historis kolektif.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai nama perjanjian YHWH secara langsung; transliterasi mempertahankannya sebagai nama pribadi, bukan menggantinya dengan gelar.
- issue: Hubungan לְטוֹב dengan sukacita Yahweh
  choice: untuk mendatangkan kebaikan
  alternative: demi kebaikanmu atau dalam kebaikan
  rationale: Frasa Ibrani dapat menyatakan tujuan atau hasil baik dari sukacita Yahweh. Terjemahan ini menjaga kaitannya dengan tindakan ilahi tanpa mengartikannya sebagai emosi abstrak semata.
- issue: Cakupan אֲבֹתֶיךָ
  choice: nenek moyangmu
  alternative: bapa-bapamu
  rationale: Walaupun bentuk Ibraninya maskulin dan harfiahnya 'bapa-bapamu', konteks menunjuk kepada para leluhur Israel secara kolektif. Catatan kaki mempertahankan bentuk harfiahnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Citra agraris dan metafora Ibrani utama dipertahankan, tetapi susunan disesuaikan agar alami bagi pembaca umum.
