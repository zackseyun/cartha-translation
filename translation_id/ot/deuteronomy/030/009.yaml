revisions:
- from: Yahweh, Allahmu, akan membuatmu berkelimpahan[a] dalam segala hasil pekerjaan tanganmu, dalam buah kandunganmu, dalam hasil ternakmu, dan dalam hasil tanahmu, demi kebaikanmu. Sebab Yahweh akan kembali bersukacita atasmu untuk mendatangkan kebaikan, seperti dahulu Ia bersukacita atas nenek moyangmu.[b]
  to: Yahweh, Allahmu, akan membuatmu berlimpah[a] dalam segala pekerjaan tanganmu, dalam buah kandunganmu, dalam hasil ternakmu, dan dalam hasil tanahmu, untuk kebaikanmu. Sebab Yahweh akan kembali bersukacita atasmu untuk kebaikanmu, sebagaimana Ia bersukacita atas nenek moyangmu.[b]
  rationale: Revisi membetulkan fungsi frasa לְטוֹב pada klausa kedua agar tidak menjadi tujuan kausatif yang tidak dinyatakan teks. Frasa itu diterjemahkan sejajar pada kedua kemunculannya sebagai "untuk kebaikanmu". Diksi untuk pekerjaan tangan juga dibuat lebih langsung dan idiomatis, sementara metafora kandungan, daftar berkat agraris, nama ilahi, serta catatan kaki dipertahankan.
