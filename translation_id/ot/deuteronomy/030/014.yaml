  source_fidelity: Teks sumber menyatakan bahwa הַדָּבָר, “perkataan/hal itu,” sangat dekat, berada di mulut dan hati pihak yang disapa, untuk dilakukan. “Sebab,” “sangat dekat denganmu,” citra mulut–hati, dan klausa tujuan dalam draf pada dasarnya setia. Namun, “firman itu” dalam bahasa Indonesia cenderung lebih khusus, yakni firman ilahi, sedangkan דָּבָר di sini sengaja tetap lebih luas meskipun konteksnya berkaitan dengan perintah.
  naturalness: “Di dalam mulutmu dan di dalam hatimu” dapat dipahami, tetapi “di mulutmu dan di hatimu” lebih alami dan tetap mempertahankan citra Ibrani. Susunan selebihnya baku, jelas, dan sesuai register khidmat modern.
  terminology: “Perkataan itu” lebih baik mempertahankan keluasan הַדָּבָר daripada “firman itu,” tanpa menafsirkan istilah tersebut secara sempit sebagai “perintah.” Catatan kaki dipertahankan dengan alternatif yang selaras, dan penandanya dipindahkan ke istilah yang dijelaskan.
