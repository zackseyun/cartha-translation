  text: For the word is very near you[a], in your mouth and in your heart, so that you may do it.
translation:
  language: id
  text: Sebab perkataan itu[a] sangat dekat denganmu, di mulutmu dan di hatimu, supaya engkau melakukannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perkara itu” atau “perintah itu.” Kata Ibrani דָּבָר dapat berarti perkataan, perkara, atau perintah, sesuai konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini menjelaskan dan mendasari pernyataan sebelumnya; “Sebab” mempertahankan hubungan logis tersebut secara wajar dalam bahasa Indonesia.
- source_word: קָרוֹב אֵלֶיךָ
  choice: dekat denganmu
  rationale: Ungkapan ini menyatakan kedekatan atau keterjangkauan. “Dekat denganmu” langsung dan alami.
- source_word: הַדָּבָר
  choice: firman itu
  rationale: דָּבָר dapat berarti firman, perkara, atau perintah. “Firman itu” mempertahankan keluasan istilah Ibrani sekaligus menunjuk kembali pada ketetapan yang sedang dibicarakan.
- source_word: מְאֹד
  choice: sangat
  rationale: Adverbia ini memperkuat tingkat kedekatan dan diterjemahkan secara langsung.
- source_word: בְּפִיךָ
  choice: di dalam mulutmu
  rationale: Terjemahan ini mempertahankan gambaran konkret tentang mulut dan kesejajarannya dengan hati.
- source_word: וּבִלְבָבְךָ
  choice: dan di dalam hatimu
  rationale: לֵבָב menunjuk pada batin, termasuk pikiran dan kehendak. “Hati” mempertahankan citra sumber dan kesejajaran mulut-hati.
- source_word: לַעֲשֹׂתוֹ
  choice: supaya engkau melakukannya
  rationale: Infinitif berprefiks ל menyatakan tujuan atau hasil; frasa ini mengungkapkan kaitan antara kedekatan firman dan pelaksanaannya.
theological_decisions:
- issue: Rujukan הַדָּבָר
  choice: firman itu
  alternative: perintah itu; perkara itu
  rationale: Konteks langsung berbicara tentang perintah Allah, tetapi kata Ibrani yang dipakai lebih luas. Teks utama mempertahankan keluasan itu tanpa mempersempit maknanya.
- issue: Nuansa לַעֲשֹׂתוֹ
  choice: supaya engkau melakukannya
  alternative: untuk melakukannya
  rationale: Bentuk Ibrani dapat menyampaikan tujuan atau hasil. Pilihan ini menyatakan tujuan secara alami tanpa menentukan lebih jauh hubungan teologis antara firman dalam hati dan ketaatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Kata ganti tunggal “engkau” dipakai untuk mencerminkan sapaan maskulin tunggal dalam teks Ibrani dan gaya wacana perjanjian. Citra “mulut” dan “hati” dipertahankan.
