language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָיָה֩ כִֽי יָבֹ֨אוּ עָלֶ֜י/ךָ כָּל הַ/דְּבָרִ֣ים הָ/אֵ֗לֶּה הַ/בְּרָכָה֙ וְ/הַ/קְּלָלָ֔ה אֲשֶׁ֥ר נָתַ֖תִּי לְ/פָנֶ֑י/ךָ וַ/הֲשֵׁבֹתָ֙ אֶל לְבָבֶ֔/ךָ בְּ/כָל הַ/גּוֹיִ֔ם אֲשֶׁ֧ר הִדִּיחֲ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ שָֽׁמָּ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/001.yaml
  text: And when all these things come upon you—the blessing and the curse that I have set before you—and you take them to heart among all the nations where Yahweh your God has driven you,[a]
translation:
  language: id
  text: Apabila segala hal ini menimpa kamu—berkat dan kutuk yang telah Kutaruh di hadapanmu—dan kamu merenungkannya kembali[a] di antara segala bangsa ke mana Yahweh, Allahmu, telah menghalau kamu,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kamu mengembalikan semuanya ke dalam hatimu”; dapat juga diterjemahkan, “kamu mengingatnya” atau “kamu memasukkannya ke dalam hati.”
    reason: Ungkapan Ibrani mempertahankan gambaran mengembalikan hal-hal itu kepada hati dan dapat menekankan ingatan maupun perenungan batin.
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Apabila
  rationale: Memperkenalkan keadaan yang akan terjadi pada masa depan secara alami dalam bahasa Indonesia tanpa mempertahankan formula Ibrani secara kaku.
- source_word: יָבֹאוּ עָלֶיךָ
  choice: menimpa kamu
  rationale: Ungkapan ini menyatakan bahwa berbagai hal tersebut dialami atau terjadi atas Israel; 'menimpa' alami dan mempertahankan daya ungkap Ibraninya.
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: semua hal ini
  rationale: דברים di sini mengacu pada seluruh hasil perjanjian yang disebut berikutnya, bukan hanya kata-kata yang diucapkan.
- source_word: הַבְּרָכָה וְהַקְּלָלָה
  choice: berkat dan kutuk
  rationale: Keduanya merupakan akibat perjanjian yang dikontraskan; bentuk nomina singkat ini lazim dan bermartabat dalam bahasa Indonesia Alkitabiah modern.
- source_word: אֲשֶׁר נָתַתִּי לְפָנֶיךָ
  choice: yang telah kuperhadapkan kepadamu
  rationale: נתן dengan לְפָנֶיךָ bermakna menaruh atau menyajikan di hadapan seseorang. 'Kuperhadapkan kepadamu' mempertahankan gambaran pilihan yang diletakkan di hadapan Israel.
- source_word: וַהֲשֵׁבֹתָ אֶל לְבָבֶךָ
  choice: dan kamu merenungkannya kembali
  rationale: Secara harfiah ungkapan ini berarti 'membawanya kembali ke hatimu'. Pilihan ini menyampaikan tindakan mengingat sekaligus mempertimbangkan secara batin, sementara unsur 'kembali' mempertahankan שוב.
- source_word: בְּכָל הַגּוֹיִם
  choice: di tengah segala bangsa
  rationale: בְּ dapat berarti 'di' atau 'di tengah'; konteksnya adalah Israel yang berada di antara bangsa-bangsa akibat pembuangan.
- source_word: הִדִּיחֲךָ
  choice: menghalau kamu
  rationale: Bentuk Hifil ini menyatakan tindakan mendorong atau mengusir ke tempat lain; 'menghalau' mempertahankan kekuatan verba tersebut.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Allahmu
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh', sedangkan אֱלֹהֶיךָ diterjemahkan 'Allahmu'.
- source_word: שָׁמָּה
  choice: tempat
  rationale: Dalam konstruksi Indonesia, adverbia tujuan 'ke sana' secara alami dinyatakan melalui klausa relatif 'tempat ... menghalau kamu'.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks sumber secara langsung memakai Tetragramaton. 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Cakupan makna לְבָבֶךָ
  choice: dituangkan melalui verba 'merenungkan', bukan nomina 'hati'
  alternative: kamu membawanya kembali ke dalam hatimu; kamu mengingatnya
  rationale: Dalam antropologi Ibrani, לֵבָב mencakup pikiran, ingatan, kehendak, dan batin. 'Merenungkan' menyampaikan tindakan batin dalam konteks ini tanpa membatasinya hanya pada emosi atau ingatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan tunggal Ibrani diterjemahkan dengan 'kamu' karena Musa menyapa Israel secara kolektif sebagai satu kesatuan. Tanda koma akhir dipertahankan karena ayat ini merupakan anak kalimat yang berlanjut ke ayat 2.
