base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/003.yaml
  text: then Yahweh your God will restore your fortunes and have compassion on you[c][b][a], and he will gather you again from all the peoples where Yahweh your God has scattered you.
translation:
  language: id
  text: maka Yahweh, Allahmu, akan memulihkan keadaanmu dan menaruh belas kasihan kepadamu. Ia akan mengumpulkanmu lagi[a] dari segala bangsa[b] ke mana Yahweh, Allahmu, telah mencerai-beraikanmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia akan kembali dan mengumpulkanmu.”
    reason: alternative_reading
  - marker: b
    text: Atau, “segala kaum.”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama perjanjian ilahi sebagaimana tertulis dalam teks Ibrani dan sesuai dengan kebijakan proyek.
- source_word: וְשָׁב ... אֶת שְׁבוּתְךָ
  choice: akan memulihkan keadaanmu
  rationale: Ungkapan Ibrani ini menunjuk pada pembalikan keadaan buruk atau pemulihan, bukan semata-mata tindakan membawa pulang para tawanan.
- source_word: וְרִחֲמֶךָ
  choice: dan berbelaskasihan kepadamu
  rationale: Mengungkapkan belas kasih yang mendalam dengan bahasa Indonesia modern dan bermartabat.
- source_word: וְשָׁב וְקִבֶּצְךָ
  choice: Ia akan kembali mengumpulkanmu
  rationale: Mempertahankan bentuk kedua שָׁב sebagai verba tersendiri, sambil membiarkan nuansanya berdekatan dengan arti 'lagi'; ambiguitas ini dijelaskan dalam catatan kaki.
- source_word: מִכָּל הָעַמִּים
  choice: dari antara segala bangsa
  rationale: Dalam konteks diaspora, עַמִּים merujuk pada berbagai kelompok bangsa; 'segala bangsa' alami dan mudah dipahami dalam bahasa Indonesia.
- source_word: הֱפִיצְךָ
  choice: telah mencerai-beraikanmu
  rationale: Menyampaikan tindakan penyebaran secara kuat dan sesuai dengan konteks pembuangan.
- source_word: שָׁמָּה
  choice: tempat
  rationale: Mengalihkan adverbia lokatif 'ke sana/di sana' menjadi penghubung relatif yang alami dalam bahasa Indonesia.
theological_decisions:
- issue: Makna idiom שׁוּב אֶת־שְׁבוּת
  choice: memulihkan keadaanmu
  alternative: mengembalikan ketertawananmu; membawa kembali para tawananmu
  rationale: Pilihan ini menangkap makna idiom pemulihan tanpa menyempitkannya menjadi kepulangan tawanan saja; pengumpulan dari pembuangan disebut secara tersendiri dalam klausa berikutnya.
- issue: Fungsi וְשָׁב yang kedua
  choice: Ia akan kembali mengumpulkanmu
  alternative: Ia akan mengumpulkanmu lagi
  rationale: Teks Ibrani dapat dipahami sebagai verba tersendiri, 'kembali lalu mengumpulkan', atau secara adverbial, 'mengumpulkan lagi'. Teks utama mempertahankan bentuk verbal, sedangkan alternatif dicatat agar ambiguitas asli tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk tunggal orang kedua dipertahankan melalui akhiran -mu. Tanda baca membagi dua rangkaian klausa panjang agar mudah dibaca tanpa mengubah hubungan maknanya.
