  text: See[a], I have set before you today life and good[b], and death and evil.
translation:
  language: id
  text: Lihatlah,[a] hari ini Aku telah menghadapkan kepadamu kehidupan dan kebaikan, serta kematian dan kejahatan.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Perhatikanlah.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “kejahatan” juga dapat berarti “keburukan,” “bahaya,” atau “malapetaka” dalam konteks tertentu; di sini kata itu dipertentangkan langsung dengan “kebaikan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה
  choice: Lihatlah
  rationale: Bentuk imperatif tunggal yang berfungsi menarik perhatian. 'Lihatlah' mempertahankan seruan langsung dan tetap wajar dalam ragam Indonesia yang bermartabat.
- source_word: נָתַתִּי
  choice: Aku menghadapkan
  rationale: נתן berarti memberi, menaruh, atau menempatkan. Bersama לְפָנֶיךָ, ungkapan ini menyatakan bahwa pilihan-pilihan disajikan di hadapan seseorang; 'menghadapkan' menyampaikan idiom itu secara alami.
- source_word: לְפָנֶיךָ
  choice: kepadamu
  rationale: Dalam konstruksi dengan 'menghadapkan', 'kepadamu' merupakan padanan idiomatis bagi 'di hadapanmu' dan menunjukkan bahwa pilihan tersebut diperhadapkan kepada pendengar tunggal.
- source_word: הַיּוֹם
  choice: pada hari ini
  rationale: Padanan temporal yang jelas dan alami, serta mempertahankan penekanan pada saat keputusan itu diperhadapkan.
- source_word: הַחַיִּים
  choice: kehidupan
  rationale: Walaupun bentuk Ibraninya secara morfologis jamak, חַיִּים lazim berfungsi sebagai nomina abstrak 'kehidupan'.
- source_word: הַטּוֹב
  choice: kebaikan
  rationale: Mempertahankan cakupan umum טוֹב serta kesejajarannya dengan 'kehidupan', tanpa mempersempitnya menjadi kemakmuran atau kesejahteraan.
- source_word: הַמָּוֶת
  choice: kematian
  rationale: Padanan langsung yang mempertahankan pertentangan dengan 'kehidupan'.
- source_word: הָרָע
  choice: kejahatan
  rationale: רַע dapat menunjuk pada kejahatan, keburukan, bahaya, atau malapetaka. 'Kejahatan' mempertahankan bobot moral dalam pertentangan perjanjian ini tanpa meniadakan cakupan akibat buruk yang dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Makna הָרָע dalam pertentangan perjanjian
  choice: kejahatan
  alternative: keburukan, bahaya, atau malapetaka
  rationale: Ayat ini memasangkan kehidupan/kebaikan dengan kematian/kejahatan. 'Kejahatan' mempertahankan daya moral-teologis pertentangan itu, sedangkan catatan kaki mengakui bahwa istilah Ibraninya juga dapat mencakup keadaan buruk dan akibat yang mencelakakan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada langsung dan bermartabat. Paralelisme ringkas teks Ibrani dipertahankan; kata sambung kedua sebelum 'kematian' tidak ditambahkan karena tanda baca alami bahasa Indonesia sudah menyatakan dua pasangan yang berlawanan.
