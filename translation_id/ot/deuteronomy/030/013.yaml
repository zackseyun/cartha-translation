  source_fidelity: 'Draf pada umumnya merepresentasikan unsur-unsur Ibrani dengan baik: acuan feminin kepada perintah, lokasi di seberang laut, pertanyaan retoris, pengulangan ''bagi kita'', bentuk kausatif ''memperdengarkan'', dan tujuan untuk melakukan perintah. Namun, ''sehingga engkau berkata'' tanpa negasi eksplisit dapat terbaca seolah-olah lokasi perintah yang tidak jauh justru menyebabkan orang itu harus berkata demikian. Konstruksi Ibrani meniadakan kebutuhan untuk mengajukan keberatan itu.'
