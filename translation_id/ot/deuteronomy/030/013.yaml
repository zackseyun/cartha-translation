  text: וְ/לֹֽא מֵ/עֵ֥בֶר לַ/יָּ֖ם הִ֑וא לֵ/אמֹ֗ר מִ֣י יַעֲבָר לָ֜/נוּ אֶל עֵ֤בֶר הַ/יָּם֙ וְ/יִקָּחֶ֣/הָ לָּ֔/נוּ וְ/יַשְׁמִעֵ֥/נוּ אֹתָ֖/הּ וְ/נַעֲשֶֽׂ/נָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/013.yaml
  text: And it is not beyond the sea[a], that you should say, ‘Who will cross over to the other side of the sea for us and get it for us and make us hear it[c][b], so that we may do it?’
translation:
  language: id
  text: Perintah itu tidak berada di seberang laut[a], sehingga engkau tidak perlu berkata, “Siapakah yang akan menyeberang ke seberang laut bagi kita, mengambilnya bagi kita[b], dan memperdengarkannya kepada kita[c], supaya kita melakukannya?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “di balik laut” atau “di sisi lain laut.”
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “membawanya kepada kita.” Kata Ibraninya secara harfiah berarti “mengambil,” tetapi dalam konteks ini dapat menyiratkan memperolehnya dan membawanya kepada kita.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “membuat kita mendengarnya”; bentuk kausatif ini dapat berarti menyampaikan atau menjelaskannya kepada kita.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֵבֶר לַיָּם
  choice: di seberang laut
  rationale: Ungkapan ini menunjukkan tempat di sisi jauh laut. “Di seberang laut” alami dalam bahasa Indonesia dan mempertahankan gambaran ruangnya.
- source_word: הִוא
  choice: Perintah itu
  rationale: Pronomina feminin ini merujuk kembali kepada הַמִּצְוָה, “perintah,” dalam ayat 11. Penyebutan kembali acuannya menghasilkan kalimat Indonesia yang jelas.
- source_word: לֵאמֹר
  choice: sehingga engkau berkata
  rationale: Bentuk ini memperkenalkan keberatan hipotetis. “Sehingga engkau berkata” menyampaikan hubungan akibat yang tersirat dalam konstruksi larangan tersebut.
- source_word: יַעֲבָר לָנוּ אֶל עֵבֶר הַיָּם
  choice: akan menyeberang ke seberang laut bagi kita
  rationale: Pilihan ini mempertahankan verba “menyeberang,” tujuan “ke seberang laut,” dan nuansa pelayanan atau kepentingan pada לָנוּ.
- source_word: וְיִקָּחֶהָ לָּנוּ
  choice: mengambilnya bagi kita
  rationale: Terjemahan ini mempertahankan arti dasar לקח, “mengambil,” beserta לָנוּ, tanpa menutup kemungkinan pragmatis bahwa orang itu mengambil lalu membawanya agar dapat dijangkau.
- source_word: וְיַשְׁמִעֵנוּ אֹתָהּ
  choice: memperdengarkannya kepada kita
  rationale: Bentuk Hifil dari שׁמע bersifat kausatif. “Memperdengarkan” secara alami menyatakan tindakan membuat orang lain mendengar tanpa harus menentukannya sebagai sekadar pembacaan, pemberitaan, atau penjelasan.
- source_word: וְנַעֲשֶׂנָּה
  choice: supaya kita melakukannya
  rationale: “Supaya” menyatakan tujuan atau hasil dari memperoleh dan mendengar perintah itu, sedangkan “melakukannya” mempertahankan penekanan pada ketaatan praktis.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti tunggal “engkau” mengikuti sapaan tunggal Ibrani, sedangkan “kita” mempertahankan bentuk inklusif dalam pertanyaan. Susunan retoris serta pengulangan “bagi kita” dipertahankan demi kedekatan dengan sumber.
