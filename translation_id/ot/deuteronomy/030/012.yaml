  text: לֹ֥א בַ/שָּׁמַ֖יִם הִ֑וא לֵ/אמֹ֗ר מִ֣י יַעֲלֶה לָּ֤/נוּ הַ/שָּׁמַ֨יְמָ/ה֙ וְ/יִקָּחֶ֣/הָ לָּ֔/נוּ וְ/יַשְׁמִעֵ֥/נוּ אֹתָ֖/הּ וְ/נַעֲשֶֽׂ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/012.yaml
  text: It is not in heaven[a], that you should say, ‘Who will go up to heaven for us and get it for us and make us hear it, so that we may do it?’
translation:
  language: id
  text: Perintah itu tidak ada di langit sehingga engkau perlu berkata, “Siapakah yang akan naik ke langit bagi kita, mengambilnya bagi kita, dan memperdengarkannya kepada kita supaya kita melakukannya?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַשָּׁמַיִם
  choice: di langit
  rationale: Ungkapan ini menunjuk pada ranah surgawi yang tampak tidak terjangkau; “di langit” alami dalam bahasa Indonesia dan cocok dengan kontras konteks antara yang jauh dan yang dekat.
- source_word: הִוא
  choice: Perintah itu
  rationale: Pronomina feminin tunggal merujuk kembali pada הַמִּצְוָה, “perintah,” dalam ayat 11. Penyebutan nomina secara eksplisit membuat rujukannya jelas dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: sehingga engkau perlu berkata
  rationale: Infinitif ini memperkenalkan keberatan hipotetis. “Sehingga engkau perlu berkata” menyampaikan bahwa keadaan tersebut tidak mengharuskan orang Israel mengajukan pertanyaan berikutnya.
- source_word: מִי יַעֲלֶה לָּנוּ
  choice: Siapakah yang akan naik ... bagi kita
  rationale: “Naik” mempertahankan gerak ke atas dari עלה, sedangkan “bagi kita” mempertahankan nuansa benefaktif לָנוּ.
- source_word: הַשָּׁמַיְמָה
  choice: ke langit
  rationale: Akhiran direktif pada bentuk Ibrani menunjukkan gerak menuju langit.
- source_word: וְיִקָּחֶהָ לָּנוּ
  choice: mengambilnya bagi kita
  rationale: “Mengambil” mempertahankan arti dasar לקח dan, dalam konteks ini, menyiratkan membawa atau memperoleh perintah itu untuk umat.
- source_word: וְיַשְׁמִעֵנוּ אֹתָהּ
  choice: memperdengarkannya kepada kita
  rationale: Bentuk Hifil dari שמע bersifat kausatif, yakni membuat atau menyebabkan umat mendengarnya. “Memperdengarkan” mempertahankan unsur itu tanpa mempersempit maknanya menjadi sekadar “memberitakan.”
- source_word: וְנַעֲשֶׂנָּה
  choice: supaya kita dapat melakukannya
  rationale: Ungkapan ini menyatakan tujuan, yaitu agar umat dapat melakukan atau menaati perintah tersebut; “melakukannya” mempertahankan verba umum עשה.
theological_decisions:
- issue: Rujukan pronomina feminin הִוא
  choice: Dinyatakan sebagai “Perintah itu,” merujuk pada perintah dalam ayat 11.
  alternative: Memakai pronomina “itu” tanpa menyebut referennya.
  rationale: Bahasa Ibrani menandai gender yang menghubungkan pronomina dengan “perintah,” sedangkan bahasa Indonesia tidak. Penyebutan referen mencegah ketidakjelasan tanpa menambahkan penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Engkau” mempertahankan sapaan orang kedua tunggal dalam teks Ibrani, sementara “kita” mengikuti bentuk jamak yang dipakai dalam pertanyaan langsung. Struktur retoris dan pengulangan “bagi kita” dipertahankan sejauh tetap alami.
