  text: הִגַּ֤דְתִּי לָ/כֶם֙ הַ/יּ֔וֹם כִּ֥י אָבֹ֖ד תֹּאבֵד֑וּ/ן לֹא תַאֲרִיכֻ֤/ן יָמִים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר אַתָּ֤ה עֹבֵר֙ אֶת הַ/יַּרְדֵּ֔ן לָ/בֹ֥א שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/018.yaml
  text: I declare to you today that you will surely perish[c][b][a]; you will not prolong your days on the land that you are crossing the Jordan to enter there and possess it.
translation:
  language: id
  text: 'Pada hari ini aku menyatakan kepadamu: kamu pasti akan binasa[a] dan tidak akan panjang umur[b] di negeri yang akan kamu masuki dengan menyeberangi Sungai Yordan untuk menduduki negeri itu.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “binasa, kamu akan binasa,” suatu bentuk penegasan Ibrani yang berarti “kamu pasti akan binasa.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “tidak akan memperpanjang hari-hari.”
    reason: lexical_alternative
  - marker: c
    text: Dalam bahasa Ibrani, “kepadamu” dan kata kerja pada bagian awal ayat ini berbentuk jamak. Dalam anak kalimat tentang menyeberangi Yordan, bentuk “kamu” menjadi tunggal, yang memandang Israel sebagai satu umat.
    reason: cultural_note
lexical_decisions:
- source_word: הִגַּדְתִּי לָכֶם הַיּוֹם
  choice: Pada hari ini aku menyatakan kepadamu
  rationale: Bentuk Hifil dari נגד menyatakan tindakan memberitahukan atau menyatakan secara resmi. Susunan ini mempertahankan nada peringatan yang khidmat; bentuk Ibrani לָכֶם adalah jamak, tetapi bahasa Indonesia tidak menandai jumlah pada “kepadamu”.
- source_word: אָבֹד תֹּאבֵדוּן
  choice: kamu pasti akan binasa
  rationale: Infinitif absolut yang diikuti verba seakar menegaskan kepastian kebinasaan. “Pasti akan binasa” menyampaikan tekanan itu secara alami dalam bahasa Indonesia.
- source_word: לֹא תַאֲרִיכֻן יָמִים
  choice: tidak akan panjang umur
  rationale: Ungkapan harfiah “tidak akan memperpanjang hari-hari” merupakan idiom tentang lamanya hidup. “Tidak akan panjang umur” jelas dan alami tanpa mengurangi daya ancamannya.
- source_word: עַל הָאֲדָמָה
  choice: di negeri
  rationale: Dalam konteks perjanjian Ulangan, אֲדָמָה menunjuk pada wilayah yang dijanjikan, bukan tanah atau permukaan bumi secara umum.
- source_word: אֲשֶׁר אַתָּה עֹבֵר אֶת הַיַּרְדֵּן לָבֹא שָׁמָּה
  choice: yang akan kamu masuki dengan menyeberangi Sungai Yordan
  rationale: Partisipel עֹבֵר dalam konteks ini mengarah pada tindakan yang segera akan dilakukan. Rumusan Indonesia menata ulang sintaksis agar alami, sambil mempertahankan gerak menyeberangi Yordan dan masuk ke tempat itu.
- source_word: לְרִשְׁתָּהּ
  choice: untuk menduduki negeri itu
  rationale: ירש dalam konteks tanah perjanjian berarti mengambil alih atau menduduki sebagai milik. Sufiks feminin tunggal merujuk kembali kepada negeri tersebut.
theological_decisions:
- issue: Sapaan kepada Israel sebagai satu umat
  choice: Memakai “kamu” dalam teks dan menjelaskan nuansa jumlah dalam catatan
  alternative: Memakai “kalian” atau “kamu sekalian”
  rationale: Bahasa Ibrani beralih dari bentuk jamak pada bagian awal ayat kepada bentuk tunggal ketika menggambarkan Israel sebagai satu umat. Karena “kamu” dalam bahasa Indonesia dapat tunggal maupun jamak, nuansa retoris ini perlu dijelaskan tanpa membuat teks terasa kaku.
- issue: Istilah negeri perjanjian
  choice: Menerjemahkan הָאֲדָמָה sebagai “negeri”
  alternative: “tanah”
  rationale: Konteksnya adalah wilayah di seberang Yordan yang akan dimasuki dan diduduki Israel, sehingga “negeri” menyampaikan rujukan geografis dan perjanjiannya dengan lebih tepat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan langsung. “Panjang umur” dipilih sebagai idiom Indonesia yang alami, sedangkan “menduduki negeri itu” mempertahankan makna pengambilalihan wilayah tanpa memasukkan penafsiran denominasi.
