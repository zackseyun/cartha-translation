  text: וֶ/הֱבִֽיאֲ/ךָ֞ יְהוָ֣ה אֱלֹהֶ֗י/ךָ אֶל הָ/אָ֛רֶץ אֲשֶׁר יָרְשׁ֥וּ אֲבֹתֶ֖י/ךָ וִֽ/ירִשְׁתָּ֑/הּ וְ/הֵיטִֽבְ/ךָ֥ וְ/הִרְבְּ/ךָ֖ מֵ/אֲבֹתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/005.yaml
  text: And Yahweh your God will bring you into the land that your fathers possessed[a], and you will possess it[b]; and he will prosper you and multiply you more than your fathers.
translation:
  language: id
  text: Yahweh, Allahmu, akan membawa engkau ke negeri yang dimiliki nenek moyangmu[a], dan engkau akan memilikinya. Ia akan berbuat baik kepadamu[b] dan menjadikan jumlahmu lebih banyak daripada nenek moyangmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang diwarisi nenek moyangmu” atau “yang diambil alih nenek moyangmu.” Kata Ibrani ini dapat mengandung nuansa mewarisi, memiliki, dan mengambil alih sebagai milik.
    reason: lexical_alternative
  - marker: b
    text: Atau “akan membuatmu makmur.” Secara harfiah, ungkapan Ibraninya berarti “akan berbuat baik kepadamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וֶהֱבִיאֲךָ
  choice: akan membawa engkau
  rationale: Bentuk Hifil dari בוא berarti membawa atau menyebabkan masuk. Kata “kembali” tersirat oleh konteks pemulihan, tetapi tidak dinyatakan dalam verba ini, sehingga tidak ditambahkan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה dan mempertahankannya sebagai nama pribadi, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk konstruksi dengan sufiks orang kedua tunggal maskulin berarti “Allahmu” dan mengidentifikasi Yahweh sebagai Allah umat yang disapa.
- source_word: הָאָרֶץ
  choice: negeri
  rationale: Dalam konteks Ulangan, kata ini menunjuk kepada negeri yang dijanjikan. “Negeri” alami dalam bahasa Indonesia dan mempertahankan makna geografis-politisnya.
- source_word: אֲשֶׁר יָרְשׁוּ אֲבֹתֶיךָ
  choice: yang dahulu dimiliki nenek moyangmu
  rationale: ירשׁ dapat berarti mewarisi, memiliki, atau mengambil alih. Di sini negeri itu telah dikuasai para leluhur; “dimiliki” jelas dan tetap membuka nuansa kepemilikan, sedangkan “dahulu” memperjelas hubungan waktunya tanpa mengubah isi.
- source_word: אֲבֹתֶיךָ
  choice: nenek moyangmu
  rationale: Walaupun bentuk Ibraninya secara harfiah berarti “bapak-bapakmu,” dalam konteks ini ungkapan tersebut menunjuk kepada para leluhur Israel. “Nenek moyangmu” adalah padanan Indonesia yang alami dan tidak mengaburkan rujukan antargenerasi.
- source_word: וִירִשְׁתָּהּ
  choice: dan engkau akan memilikinya
  rationale: Bentuk Qal ירשׁ dengan sufiks objek feminin tunggal menunjuk kembali kepada negeri itu dan berarti memiliki atau mengambilnya sebagai milik.
- source_word: וְהֵיטִבְךָ
  choice: Ia akan berbuat baik kepadamu
  rationale: Hifil יטב dengan sufiks objek secara langsung berarti berbuat baik kepada seseorang. Pilihan ini lebih dekat dengan cakupan leksikal sumber daripada mempersempitnya menjadi kemakmuran materi.
- source_word: וְהִרְבְּךָ
  choice: dan membuatmu lebih banyak
  rationale: Hifil רבה berarti membuat banyak atau menjadikan lebih besar jumlahnya. Bentuk “engkau” dipahami secara kolektif sebagai umat Israel.
- source_word: מֵאֲבֹתֶיךָ
  choice: daripada nenek moyangmu
  rationale: 'מן berfungsi sebagai penanda perbandingan: jumlah umat itu akan melampaui jumlah generasi leluhur mereka.'
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama perjanjian itu dan tidak menggantinya dengan gelar.
- issue: Cakupan berkat dalam וְהֵיטִבְךָ
  choice: berbuat baik kepadamu
  alternative: membuatmu makmur
  rationale: Ungkapan Ibrani memiliki arti luas, yaitu memperlakukan dengan baik atau mendatangkan kebaikan. Terjemahan utama tidak membatasi kebaikan tersebut hanya pada kemakmuran materi.
- issue: Sapaan tunggal dengan makna kolektif
  choice: engkau ... membuatmu lebih banyak
  alternative: kalian ... membuat jumlah kalian bertambah
  rationale: Sufiks dan verba Ibrani berbentuk tunggal maskulin, tetapi menyapa Israel sebagai satu umat. Bentuk tunggal dipertahankan agar ciri retoris dan teologis kolektif itu tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Engkau” dipakai untuk mempertahankan sapaan tunggal kepada Israel sebagai satu umat. Struktur kalimat dibagi menjadi dua agar jelas dibaca, tanpa mengubah hubungan antarklausa dalam sumber.
