  text: וְ/אַתָּ֣ה תָשׁ֔וּב וְ/שָׁמַעְתָּ֖ בְּ/ק֣וֹל יְהוָ֑ה וְ/עָשִׂ֨יתָ֙ אֶת כָּל מִצְוֺתָ֔י/ו אֲשֶׁ֛ר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּֽוֹם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/008.yaml
  text: And you shall return and obey the voice of Yahweh[b][a], and you shall do all his commandments that I am commanding you today.
translation:
  language: id
  text: Dan engkau akan kembali[a] dan mendengarkan suara Yahweh[b], serta melakukan semua perintah-Nya yang kuperintahkan kepadamu hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berbalik”; dalam konteks ini, kata tersebut juga dapat mengandung arti kembali kepada kesetiaan perjanjian atau bertobat.
    reason: lexical_alternative
  - marker: b
    text: Ungkapan Ibrani secara harfiah berarti “mendengarkan suara Yahweh” dan biasanya menyiratkan ketaatan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תָשׁוּב
  choice: akan kembali
  rationale: Kata שׁוּב berarti kembali atau berbalik. Dalam konteks pemulihan ini, 'kembali' mempertahankan kemungkinan makna tempat sekaligus makna kembali kepada kesetiaan perjanjian tanpa mempersempitnya menjadi pertobatan saja.
- source_word: וְשָׁמַעְתָּ בְּקוֹל יְהוָה
  choice: mendengarkan suara Yahweh
  rationale: Ungkapan שׁמע בְּקוֹל secara harfiah berarti mendengarkan suara dan dalam konteks perjanjian menyiratkan ketaatan. Bentuk ini mempertahankan gambaran Ibrani, sedangkan klausa berikutnya menjelaskan tindakan taat itu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh' agar nama pribadi dalam teks sumber dipertahankan dan tidak diganti dengan gelar.
- source_word: וְעָשִׂיתָ
  choice: melakukan
  rationale: Kata עָשָׂה berarti melakukan atau mengerjakan. Dengan 'semua perintah-Nya' sebagai objek, 'melakukan' dekat dengan bentuk Ibrani dan alami dalam bahasa Indonesia.
- source_word: כָּל מִצְוֺתָיו
  choice: semua perintah-Nya
  rationale: '''Perintah'' merupakan padanan Indonesia yang alami bagi מִצְוָה dan tetap mempertahankan corak perjanjian serta hukum. Akhiran orang ketiga tunggal merujuk kepada Yahweh.'
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: yang kusampaikan kepadamu pada hari ini
  rationale: Dalam konteks perintah, מְצַוְּךָ bermakna memerintahkan atau menyampaikan perintah. Pilihan ini menghindari ungkapan Indonesia yang kaku dan tetap mempertahankan Musa sebagai penutur serta penekanan deuteronomis pada 'hari ini'.
- source_word: וְאַתָּה
  choice: Dan engkau
  rationale: Pronomina eksplisit menonjolkan subjek. 'Dan engkau' mempertahankan hubungan dengan ayat sebelumnya serta penekanan tersebut; 'engkau' sesuai dengan register tunggal yang khidmat.
theological_decisions:
- issue: Apakah שׁוּב harus diterjemahkan secara eksplisit sebagai pertobatan
  choice: akan kembali
  alternative: akan bertobat; akan berbalik kembali
  rationale: '''Kembali'' mempertahankan ketegangan antara pemulihan, kembali kepada perjanjian, dan pertobatan tanpa menetapkan hanya satu nuansa.'
- issue: Apakah שׁמע בְּקוֹל harus langsung diterjemahkan sebagai 'menaati'
  choice: mendengarkan suara Yahweh
  alternative: menaati Yahweh; menaati suara Yahweh
  rationale: Idiom ini memang menyiratkan ketaatan, tetapi klausa berikutnya sudah menyatakan pelaksanaan semua perintah. Terjemahan yang lebih transparan mempertahankan dua ungkapan yang berkaitan tetapi tidak identik.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk tunggal 'engkau' dipakai karena sapaan Ibrani berbentuk tunggal. Struktur dibuat alami tanpa menghilangkan pengulangan dan ketegangan makna dalam teks Ibrani.
