id: DEU.30.4
reference: Deuteronomy 30:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: אִם יִהְיֶ֥ה נִֽדַּחֲ/ךָ֖ בִּ/קְצֵ֣ה הַ/שָּׁמָ֑יִם מִ/שָּׁ֗ם יְקַבֶּצְ/ךָ֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וּ/מִ/שָּׁ֖ם יִקָּחֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/004.yaml
  text: If your outcasts are at the end of the heavens[a], from there Yahweh your God will gather you[c][b], and from there he will take you.
translation:
  language: id
  text: Jika orang-orangmu yang terbuang[a] berada di ujung langit[b], dari sanalah Yahweh, Allahmu, akan mengumpulkanmu, dan dari sanalah Dia akan mengambilmu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “orang-orangmu yang dihalau” atau “orang-orangmu yang tercerai-berai.” Kata Ibraninya menunjuk kepada mereka yang disingkirkan atau diserakkan.
    reason: lexical_alternative
  - marker: b
    text: “Di ujung langit” adalah ungkapan Ibrani untuk tempat yang sejauh-jauhnya.
    reason: cultural_note
  - marker: c
    text: Atau “membawamu.” Kata kerja Ibraninya secara lebih harfiah berarti “mengambilmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: Jika
  rationale: Menandai klausa bersyarat secara langsung tanpa menambahkan penegasan ‘bahkan’ yang tidak dinyatakan secara eksplisit.
- source_word: נִדַּחֲךָ
  choice: orang-orangmu yang terbuang
  rationale: Mengungkapkan orang-orang Israel yang telah dihalau atau diserakkan, sekaligus membuat daya kolektif bentuk Ibrani dapat dipahami secara alami dalam bahasa Indonesia.
- source_word: בִּקְצֵה הַשָּׁמָיִם
  choice: di ujung langit
  rationale: Mempertahankan gambaran ruang dalam idiom Ibrani, dengan catatan bahwa ungkapan itu menunjuk tempat yang paling jauh.
- source_word: מִשָּׁם
  choice: dari sanalah
  rationale: Partikel ‘-lah’ secara alami menampilkan penekanan; pengulangan frasa Ibrani tetap dipertahankan.
- source_word: יְקַבֶּצְךָ
  choice: akan mengumpulkanmu
  rationale: Menerjemahkan verba Piel קבץ secara langsung tanpa menambahkan gagasan ‘kembali’ yang hanya tersirat oleh konteks.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi yang tertulis dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Menyampaikan sebutan perjanjian yang mengikuti nama Yahweh dan mempertahankan sapaan orang kedua tunggal kolektif.
- source_word: וּמִשָּׁם יִקָּחֶךָ
  choice: dan dari sanalah Dia akan mengambilmu
  rationale: Mempertahankan arti dasar לקח, ‘mengambil’, tanpa terlebih dahulu menentukan arah gerak sebagai ‘membawa pulang’.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks menggunakan nama perjanjian secara langsung; transliterasi ‘Yahweh’ mempertahankannya sebagai nama diri.
- issue: Sapaan tunggal dengan makna kolektif kepada Israel
  choice: Akhiran orang kedua tunggal dipertahankan dalam ‘-mu’, sementara נִדַּחֲךָ diungkapkan sebagai ‘orang-orangmu yang terbuang’
  alternative: Mengubah seluruh sapaan menjadi bentuk jamak eksplisit
  rationale: Pilihan ini menjaga Israel sebagai satu umat yang disapa secara tunggal, tetapi tetap memperjelas bahwa yang tersebar adalah para anggotanya.
- issue: Arah tindakan dalam יִקָּחֶךָ
  choice: mengambilmu
  alternative: membawamu atau menjemputmu
  rationale: Ayat ini sendiri memakai verba luas ‘mengambil’; arah tujuan baru dijelaskan lebih lanjut oleh konteks berikutnya, sehingga ambiguitasnya dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk ‘-mu’ mempertahankan sapaan perjanjian kepada Israel sebagai satu umat; ‘Dia’ dikapitalisasi sesuai kebiasaan umum penulisan rujukan kepada Allah dalam bahasa Indonesia.
