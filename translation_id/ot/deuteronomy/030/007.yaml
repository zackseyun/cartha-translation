  text: וְ/נָתַן֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ אֵ֥ת כָּל הָ/אָל֖וֹת הָ/אֵ֑לֶּה עַל אֹיְבֶ֥י/ךָ וְ/עַל שֹׂנְאֶ֖י/ךָ אֲשֶׁ֥ר רְדָפֽוּ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/007.yaml
  text: And Yahweh your God will put all these curses on your enemies and on those who hate you[a], who pursued you.
translation:
  language: id
  text: Yahweh, Allahmu, akan menimpakan semua kutuk ini[a] kepada musuh-musuhmu dan kepada orang-orang yang membencimu, yang telah mengejarmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “semua sumpah ini”; dalam kitab Ulangan, istilah ini biasanya mengacu pada kutuk atau sanksi perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: akan menimpakan
  rationale: Dalam konstruksi dengan kutuk sebagai objek dan sasaran yang diperkenalkan oleh עַל, נתן menyatakan tindakan mengenakan atau menjatuhkan kutuk. 'Menimpakan' alami dalam bahasa Indonesia dan mempertahankan gambaran bahwa kutuk itu beralih kepada para musuh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi, bukan menggantinya dengan gelar, sesuai dengan bentuk Ibrani.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: 'Bentuk dengan akhiran orang kedua tunggal maskulin menyatakan kepunyaan atau hubungan: ''Allahmu''.'
- source_word: כָּל הָאָלות הָאֵלֶּה
  choice: semua kutuk ini
  rationale: Dalam konteks perjanjian Ulangan, אָלָה menunjuk pada kutuk atau sanksi perjanjian; kemungkinan leksikal 'sumpah' dicatat dalam catatan kaki.
- source_word: עַל אֹיְבֶיךָ
  choice: kepada musuh-musuhmu
  rationale: עַל menandai pihak yang menjadi sasaran kutuk. Dengan verba 'menimpakan', 'kepada' merupakan padanan Indonesia yang wajar.
- source_word: וְעַל שֹׂנְאֶיךָ
  choice: dan kepada orang-orang yang membencimu
  rationale: Ungkapan relatif ini menyampaikan daya partisip Ibrani secara alami tanpa memakai bentuk kaku seperti 'para pembencimu'.
- source_word: אֲשֶׁר רְדָפוּךָ
  choice: yang telah mengejarmu
  rationale: רדף berarti mengejar atau memburu. 'Mengejar' mempertahankan keluasan makna sumber tanpa mempersempitnya menjadi 'menganiaya'; 'telah' mencerminkan tindakan lampau bentuk perfek.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks menyebut nama perjanjian secara langsung. 'Yahweh' mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Makna אָלוֹת dalam konteks perjanjian
  choice: kutuk
  alternative: sumpah
  rationale: Konteks dekat Ulangan 30 merujuk pada sanksi perjanjian yang telah dinyatakan. Namun, keluasan leksikal yang memungkinkan arti 'sumpah' tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mengikuti relasi sintaksis Ibrani, tetapi memakai kolokasi Indonesia yang alami, khususnya 'menimpakan ... kepada'. Penanda catatan kaki ditempatkan setelah klausa yang memuat istilah terkait agar tidak memutus frasa 'semua kutuk ini'.
