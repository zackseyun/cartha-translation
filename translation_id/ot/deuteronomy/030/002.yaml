  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/שַׁבְתָּ֞ עַד יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ וְ/שָׁמַעְתָּ֣ בְ/קֹל֔/וֹ כְּ/כֹ֛ל אֲשֶׁר אָנֹכִ֥י מְצַוְּ/ךָ֖ הַ/יּ֑וֹם אַתָּ֣ה וּ/בָנֶ֔י/ךָ בְּ/כָל לְבָבְ/ךָ֖ וּ/בְ/כָל נַפְשֶֽׁ/ךָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/030/002.yaml
  text: and you return to Yahweh your God and obey his voice[a], according to all that I am commanding you today, you and your children, with all your heart and with all your soul[c][b],
translation:
  language: id
  text: dan engkau kembali kepada Yahweh, Allahmu, dan menaati suara-Nya[a], sesuai dengan segala yang kuperintahkan kepadamu hari ini—engkau dan anak-anakmu[b]—dengan segenap hatimu dan dengan segenap jiwamu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mendengarkan suara-Nya.” Dalam ungkapan Ibrani ini, mendengarkan biasanya mencakup mengindahkan atau menaati.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak-anak lelakimu”; dalam konteks ini istilah Ibraninya dapat dipakai secara umum untuk anak-anak atau keturunan.
    reason: lexical_alternative
  - marker: c
    text: Atau, “dengan segenap nyawamu” atau “dengan seluruh dirimu.” Kata Ibrani yang diterjemahkan “jiwa” juga dapat berarti nyawa, diri, atau keseluruhan hidup.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׁבְתָּ
  choice: lalu engkau berbalik
  rationale: Kata שׁוּב pada dasarnya berarti kembali atau berbalik. Dalam konteks perjanjian, kata ini menyiratkan pertobatan, tetapi 'berbalik' mempertahankan gambaran konkret Ibrani tanpa mempersempitnya menjadi istilah teologis tertentu.
- source_word: עַד יְהוָה אֱלֹהֶיךָ
  choice: kepada Yahweh, Allahmu
  rationale: Dengan kata kerja שׁוּב, עַד menunjukkan arah kembali kepada seseorang. Nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh', sedangkan אֱלֹהֶיךָ berarti 'Allahmu'.
- source_word: וְשָׁמַעְתָּ בְקֹלוֹ
  choice: dan menaati suara-Nya
  rationale: Ungkapan שׁמע בְּקוֹל berarti mendengarkan dengan mengindahkan, sehingga biasanya mengandung arti menaati. 'Menaati suara-Nya' mempertahankan baik daya idiomatis maupun citra suara dalam teks Ibrani.
- source_word: כְּכֹל אֲשֶׁר אָנֹכִי מְצַוְּךָ הַיּוֹם
  choice: sesuai dengan segala yang kuperintahkan kepadamu pada hari ini
  rationale: Frasa ini menyatakan kesesuaian dengan seluruh perintah Musa. Bentuk partisipel מְצַוְּךָ dapat diungkapkan secara wajar sebagai 'kuperintahkan', sementara 'pada hari ini' mempertahankan penekanan temporal.
- source_word: אַתָּה וּבָנֶיךָ
  choice: engkau dan anak-anakmu
  rationale: בָּנִים secara harfiah dapat berarti 'anak-anak lelaki', tetapi dalam konteks keluarga dan perjanjian dapat menunjuk keturunan secara umum. 'Anak-anakmu' menghindari pembatasan yang tidak dituntut konteks.
- source_word: בְּכָל לְבָבְךָ
  choice: dengan segenap hatimu
  rationale: Ini adalah padanan Indonesia yang alami bagi ungkapan tentang seluruh hati, termasuk kehendak dan batin.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: dan dengan segenap jiwamu
  rationale: נֶפֶשׁ dapat berarti jiwa, nyawa, diri, atau keseluruhan hidup. 'Jiwamu' mempertahankan pasangan ungkapan tradisional dengan 'hatimu', sedangkan keluasan maknanya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama perjanjian יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks memakai nama ilahi secara langsung. 'Yahweh' mempertahankannya sebagai nama pribadi, bukan menggantinya dengan gelar.
- issue: Daya makna שׁוּב dalam konteks perjanjian
  choice: berbalik kepada
  alternative: bertobat kepada; kembali kepada
  rationale: '''Berbalik kepada'' mempertahankan gerak relasional dalam bahasa Ibrani dan tetap membiarkan implikasi pertobatan muncul dari konteks tanpa memasukkan istilah yang lebih sempit.'
- issue: Cakupan בָנֶיךָ
  choice: anak-anakmu
  alternative: anak-anak lelakimu
  rationale: Bentuk maskulin jamak dapat berfungsi secara generik bagi keturunan. Konteks tidak mengharuskan pembatasan hanya kepada anak lelaki.
- issue: Makna antropologis נֶפֶשׁ
  choice: jiwamu
  alternative: nyawamu; seluruh dirimu
  rationale: Kata ini memiliki rentang makna yang luas. Terjemahan utama mempertahankan rumusan 'hati' dan 'jiwa', sementara catatan kaki menjaga alternatif yang sah dan mencegah pemaknaan yang terlalu sempit.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam khidmat tetapi mudah dipahami. Pronomina 'engkau' mempertahankan sapaan tunggal dan cocok dengan register perjanjian. Bentuk 'kuperintahkan' merujuk kepada Musa sebagai penutur, bukan kepada Yahweh. Tanda pisah menandai frasa sisipan 'engkau dan anak-anakmu' agar alur kalimat panjang tetap jelas.
