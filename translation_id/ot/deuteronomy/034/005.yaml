id: DEU.34.5
reference: Deuteronomy 34:5
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יָּ֨מָת שָׁ֜ם מֹשֶׁ֧ה עֶֽבֶד יְהוָ֛ה בְּ/אֶ֥רֶץ מוֹאָ֖ב עַל פִּ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/005.yaml
  text: So Moses the servant of Yahweh died there in the land of Moab[a], according to the word of Yahweh.
translation:
  language: id
  text: Lalu Musa, hamba Yahweh, meninggal di sana, di tanah Moab, sesuai dengan firman Yahweh.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menurut mulut Yahweh”; ungkapan ini juga dapat diterjemahkan “atas perintah Yahweh”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: Lalu ... meninggal
  rationale: Bentuk wayyiqtol melanjutkan rangkaian narasi. “Lalu” menyatakan urutan peristiwa secara wajar, sedangkan “meninggal” menyampaikan makna מות dengan bahasa Indonesia yang alami dan pantas dalam konteks kematian Musa.
- source_word: שָׁם
  choice: di sana
  rationale: Keterangan tempat ini menunjuk kembali kepada lokasi yang baru disebutkan dan dipertahankan secara eksplisit.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk nama yang baku dan umum dalam bahasa Indonesia.
- source_word: עֶבֶד יְהוָה
  choice: hamba Yahweh
  rationale: Walaupun עֶבֶד dapat berarti budak atau hamba, di sini ungkapan tersebut merupakan gelar kehormatan bagi Musa yang menonjolkan pengabdian dan tugasnya dalam hubungan dengan Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri “Yahweh”, bukan diganti dengan gelar, sehingga bentuk khusus dalam teks Ibrani tetap terpelihara.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: di tanah Moab
  rationale: Terjemahan ini mempertahankan unsur אֶרֶץ, “tanah/negeri”, beserta penekanan geografisnya. “Tanah Moab” wajar dan mudah dipahami dalam bahasa Indonesia.
- source_word: עַל פִּי יְהוָה
  choice: sesuai dengan firman Yahweh
  rationale: Secara harfiah ungkapan ini berarti “menurut mulut Yahweh”, tetapi merupakan idiom yang menunjuk kepada firman atau perintah Yahweh. Pilihan ini mempertahankan unsur perkataan tanpa menghilangkan makna idiomatisnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Nuansa עֶבֶד dalam gelar Musa
  choice: hamba
  alternative: budak
  rationale: Dalam konteks ini עֶבֶד berfungsi sebagai gelar terhormat yang menyatakan pengabdian dan kedudukan Musa sebagai pelayan yang diutus Yahweh. “Budak” akan terlalu menonjolkan status keterikatan.
- issue: Makna עַל פִּי יְהוָה
  choice: sesuai dengan firman Yahweh
  alternative: atas perintah Yahweh; menurut mulut Yahweh
  rationale: Ungkapan Ibrani dapat menyatakan bahwa kematian Musa terjadi menurut firman atau perintah Yahweh. Terjemahan utama menjaga kaitan dengan “firman”, sementara bentuk harfiah dan alternatif “perintah” dicatat agar ketegangan leksikal tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan aposisi “Musa, hamba Yahweh,” memperjelas gelar Musa; pengulangan “di sana, di tanah Moab” mempertahankan penunjukan tempat dalam teks Ibrani tanpa terasa kaku.
