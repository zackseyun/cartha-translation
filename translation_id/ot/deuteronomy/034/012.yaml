base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/012.yaml
  text: and for all the mighty hand and for all the great awe that Moses did before the eyes of all Israel[a][b][c][d].
translation:
  language: id
  text: serta karena segala tindakan penuh kuasa[a] dan segala kedahsyatan besar[b] yang dilakukan Musa di depan mata seluruh Israel.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tangan yang kuat”; dapat juga diterjemahkan “tangan yang perkasa”.
    reason: lexical_alternative
  - marker: b
    text: Atau “kengerian besar” atau “perbuatan-perbuatan yang menimbulkan rasa gentar”.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “di depan mata seluruh Israel”, yaitu secara terbuka dan disaksikan oleh seluruh bangsa itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְכֹל
  choice: serta dalam segala
  rationale: Frasa ini melanjutkan rangkaian pujian pada ayat sebelumnya. Kata 'segala' mempertahankan cakupan כֹל, sedangkan 'dalam' mengungkapkan fungsi ל secara wajar dalam bahasa Indonesia.
- source_word: הַיָּד הַחֲזָקָה
  choice: tindakan penuh kuasa
  rationale: Secara harfiah berarti 'tangan yang kuat'. Dalam konteks ini, 'tangan' merupakan metonimia bagi kuasa yang diwujudkan dalam tindakan; pilihan ini juga memungkinkan frasa tersebut menjadi objek yang alami dari kata kerja 'melakukan'.
- source_word: הַמּוֹרָא הַגָּדוֹל
  choice: segala perbuatan dahsyat
  rationale: מוֹרָא dapat menunjuk pada kedahsyatan, kengerian, atau sesuatu yang membangkitkan rasa takut dan takjub. Dalam konteks tindakan Musa, frasa ini diterjemahkan secara konkret tanpa membatasi maknanya pada rasa takut batin saja.
- source_word: אֲשֶׁר עָשָׂה
  choice: yang dilakukan
  rationale: Terjemahan langsung dan alami dari עָשָׂה ketika frasa sebelumnya diungkapkan sebagai tindakan dan perbuatan.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk baku nama tokoh ini dalam bahasa Indonesia.
- source_word: לְעֵינֵי
  choice: di depan mata
  rationale: Mempertahankan gambaran konkret ungkapan Ibrani dan menyatakan bahwa tindakan itu berlangsung secara terbuka serta disaksikan.
- source_word: כָּל יִשְׂרָאֵל
  choice: seluruh Israel
  rationale: Mempertahankan pengertian kolektif bangsa Israel dan cakupan menyeluruh dari כָּל.
theological_decisions:
- issue: Sifat tindakan Musa dalam pujian penutup
  choice: Ayat diterjemahkan sebagai rangkuman tindakan Musa yang penuh kuasa dan membangkitkan kedahsyatan, yang dilakukan secara terbuka di hadapan Israel.
  alternative: Menerjemahkan secara lebih harfiah sebagai 'tangan yang kuat' dan 'kedahsyatan yang besar'.
  rationale: Pilihan utama menyampaikan kemegahan pujian dalam bahasa Indonesia yang alami, tanpa menentukan sumber kuasa itu secara eksplisit atau memasukkan tafsiran teologis yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan ini tetap terasa sebagai kelanjutan ayat sebelumnya, mempertahankan gambaran konkret pada penutup ayat, dan menghindari ungkapan tidak alami seperti 'melakukan tangan yang kuat'.
