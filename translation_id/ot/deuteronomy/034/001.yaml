id: DEU.34.1
reference: Deuteronomy 34:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יַּ֨עַל מֹשֶׁ֜ה מֵֽ/עַרְבֹ֤ת מוֹאָב֙ אֶל הַ֣ר נְב֔וֹ רֹ֚אשׁ הַ/פִּסְגָּ֔ה אֲשֶׁ֖ר עַל פְּנֵ֣י יְרֵח֑וֹ וַ/יַּרְאֵ֨/הוּ יְהוָ֧ה אֶת כָּל הָ/אָ֛רֶץ אֶת הַ/גִּלְעָ֖ד עַד דָּֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/001.yaml
  text: 'Then Moses went up from the plains of Moab to Mount Nebo[a], to the top of Pisgah, which is opposite Jericho. And Yahweh showed him all the land: Gilead as far as Dan.'
translation:
  language: id
  text: 'Kemudian Musa naik dari dataran Moab ke Gunung Nebo, ke puncak Pisga yang berhadapan dengan Yerikho. Lalu Yahweh memperlihatkan kepadanya[a] seluruh negeri itu: Gilead sampai ke Dan.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: membuatnya melihat.'
    reason: Alternatif ini menampilkan bentuk kausatif verba Ibrani secara lebih harfiah.
lexical_decisions:
- source_word: וַיַּעַל
  choice: naik
  rationale: Kata עלה menyatakan gerak ke tempat yang lebih tinggi. 'Naik' alami dalam bahasa Indonesia dan mempertahankan arah geraknya.
- source_word: מֵעַרְבֹת מוֹאָב
  choice: dari dataran Moab
  rationale: עַרְבוֹת menunjuk pada daerah datar atau stepa. 'Dataran Moab' merupakan ungkapan geografis yang jelas dan wajar.
- source_word: הַר נְבוֹ
  choice: Gunung Nebo
  rationale: Konstruksi הַר dengan nama tempat secara alami diterjemahkan sebagai 'Gunung' diikuti nama diri.
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: puncak Pisga
  rationale: רֹאשׁ secara harfiah berarti 'kepala', tetapi dalam konteks gunung bermakna 'puncak'. Bentuk ini ringkas dan alami.
- source_word: אֲשֶׁר עַל־פְּנֵי יְרֵחוֹ
  choice: yang berhadapan dengan Yerikho
  rationale: Dalam keterangan geografis, עַל־פְּנֵי dapat berarti berada di depan, menghadap, atau berhadapan dengan suatu tempat. Pilihan ini mempertahankan hubungan spasial tanpa menentukannya secara berlebihan.
- source_word: וַיַּרְאֵהוּ יְהוָה
  choice: Lalu Yahweh memperlihatkan kepadanya
  rationale: Bentuk kausatif dari ראה berarti 'membuat melihat' atau secara idiomatis 'memperlihatkan'. Pilihan ini alami serta tetap mempertahankan Yahweh sebagai pelaku.
- source_word: כָּל הָאָרֶץ
  choice: seluruh negeri itu
  rationale: הָאָרֶץ di sini menunjuk pada negeri tertentu yang sedang diperlihatkan, bukan seluruh bumi. Kata 'itu' menandai rujukan kontekstual tersebut.
- source_word: אֶת־הַגִּלְעָד עַד־דָּן
  choice: Gilead sampai ke Dan
  rationale: Frasa ini mulai merinci wilayah yang dilihat Musa. 'Sampai ke' mempertahankan penanda batas עַד.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Nuansa kausatif וַיַּרְאֵהוּ
  choice: Yahweh memperlihatkan kepadanya
  alternative: Yahweh membuatnya melihat
  rationale: Keduanya mencerminkan bentuk kausatif verba ראה. Terjemahan utama memakai ungkapan Indonesia yang lebih alami, sedangkan alternatif yang lebih bentuk-harfiah dicatat dalam catatan kaki.
translation_notes:
  register: 'Bahasa Indonesia modern, lugas, dan bermartabat. Nama-nama geografis memakai bentuk yang lazim dalam tradisi Alkitab bahasa Indonesia: Nebo, Pisga, Yerikho, Gilead, dan Dan. Tanda titik dua mempertahankan hubungan antara ''seluruh negeri itu'' dan rincian wilayah yang mengikutinya.'
