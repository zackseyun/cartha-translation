  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלָ֗י/ו זֹ֤את הָ/אָ֨רֶץ֙ אֲשֶׁ֣ר נִ֠שְׁבַּעְתִּי לְ/אַבְרָהָ֨ם לְ/יִצְחָ֤ק וּֽ/לְ/יַעֲקֹב֙ לֵ/אמֹ֔ר לְ/זַרְעֲ/ךָ֖ אֶתְּנֶ֑נָּ/ה הֶרְאִיתִ֣י/ךָ בְ/עֵינֶ֔י/ךָ וְ/שָׁ֖מָּ/ה לֹ֥א תַעֲבֹֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/004.yaml
  text: And Yahweh said to him[a], “This is the land that I swore to Abraham, to Isaac, and to Jacob, saying, ‘I will give it to your offspring.’ I have let you see it with your own eyes, but you will not cross over there.”
translation:
  language: id
  text: 'Lalu Yahweh berkata kepadanya, “Inilah negeri yang telah Kujanjikan dengan sumpah kepada Abraham, Ishak, dan Yakub: ‘Aku akan memberikannya kepada keturunanmu[a].’ Aku telah memperlihatkannya kepadamu dengan matamu sendiri, tetapi engkau tidak akan menyeberang ke sana.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “benihmu.” Kata Ibrani yang dipakai berbentuk tunggal, tetapi dapat bermakna kolektif.
    reason: Menjelaskan bentuk tunggal dan keluasan makna זֶרַע tanpa membebani teks utama dengan ungkapan yang kurang alami.
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama perjanjian ilahi yang tertulis secara langsung dalam teks Ibrani.
- source_word: זֹאת הָאָרֶץ
  choice: Inilah negeri
  rationale: Dalam konteks janji kepada para leluhur, הָאָרֶץ menunjuk pada negeri yang dijanjikan; bentuk “Inilah” wajar untuk pernyataan penunjukan dalam bahasa Indonesia.
- source_word: נִשְׁבַּעְתִּי
  choice: Kujanjikan dengan sumpah
  rationale: Mengungkapkan unsur sumpah secara eksplisit sekaligus menghasilkan kalimat Indonesia yang alami dalam konteks janji perjanjian.
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: kepada Abraham, Ishak, dan Yakub
  rationale: Menyebut ketiga leluhur secara lengkap dan mempertahankan urutan teks Ibrani tanpa pengulangan preposisi yang tidak diperlukan dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: dengan berkata
  rationale: Mempertahankan fungsi kata ini sebagai pengantar isi sumpah.
- source_word: לְזַרְעֲךָ
  choice: kepada keturunanmu
  rationale: זֶרַע berbentuk tunggal tetapi digunakan secara kolektif. “Keturunan” alami dalam bahasa Indonesia dan tidak memaksakan jumlah tertentu.
- source_word: אֶתְּנֶנָּה
  choice: Aku akan memberikannya
  rationale: Menyampaikan isi janji secara langsung; pronomina “-nya” merujuk kepada negeri tersebut.
- source_word: הֶרְאִיתִיךָ
  choice: Aku telah memperlihatkannya kepadamu
  rationale: Mempertahankan nuansa kausatif bentuk Hifil dari ראה dengan ungkapan Indonesia yang idiomatis.
- source_word: בְּעֵינֶיךָ
  choice: dengan matamu sendiri
  rationale: Menyampaikan penekanan idiom Ibrani bahwa Musa melihat negeri itu secara langsung.
- source_word: וְשָׁמָּה לֹא תַעֲבֹר
  choice: tetapi engkau tidak akan menyeberang ke sana
  rationale: “Menyeberang” mempertahankan gambaran ruang dari עבר, sedangkan “tetapi” menyatakan kontras antara melihat negeri itu dan tidak memasukinya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks sumber memakai Tetragramaton secara langsung; “Yahweh” mempertahankan nama ilahi tanpa menggantinya dengan gelar.
- issue: Makna kolektif זֶרַע dalam janji kepada para leluhur
  choice: keturunanmu
  alternative: benihmu atau anak cucumu
  rationale: “Keturunanmu” mempertahankan kemungkinan makna kolektif tanpa menentukan secara berlebihan apakah acuannya tunggal atau jamak; bentuk harfiahnya dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina orang kedua “engkau” sesuai untuk sapaan langsung kepada Musa; kapitalisasi pada bentuk terikat “Ku-” mengikuti konvensi ketika merujuk kepada Allah. Susunan kalimat mempertahankan isi sumpah, penglihatan langsung Musa, dan kontras bahwa ia tidak akan menyeberang ke negeri itu.
