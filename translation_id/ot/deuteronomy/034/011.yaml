base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/011.yaml
  text: for all the signs and the wonders that Yahweh sent him to do in the land of Egypt[a], to Pharaoh and to all his servants and to all his land,
translation:
  language: id
  text: dalam segala tanda dan mukjizat yang Yahweh mengutusnya untuk melakukan semua itu di tanah Mesir, kepada Firaun, kepada semua pegawainya, dan kepada seluruh negerinya,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “terhadap seluruh negerinya” atau “di seluruh negerinya.” Kata depan Ibrani di sini dapat dipahami dalam beberapa hubungan yang berbeda.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָל הָאֹתוֹת וְהַמּוֹפְתִים
  choice: dalam segala tanda dan mukjizat
  rationale: Awalan לְ melanjutkan hubungan sintaksis dengan ayat sebelumnya dan menunjukkan bidang yang memperlihatkan keunikan Musa. “Tanda dan mukjizat” merupakan pasangan yang alami dalam bahasa Indonesia serta mempertahankan pembedaan antara אוֹת dan מוֹפֵת.
- source_word: אֲשֶׁר שְׁלָחוֹ יְהוָה לַעֲשׂוֹת
  choice: yang Yahweh mengutusnya untuk melakukannya
  rationale: Terjemahan ini mempertahankan Yahweh sebagai subjek tindakan mengutus, Musa sebagai orang yang diutus, dan tanda-tanda serta mukjizat sebagai hal yang harus dilakukannya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: בְּאֶרֶץ מִצְרָיִם
  choice: di tanah Mesir
  rationale: “Tanah Mesir” mencerminkan unsur אֶרֶץ dan tetap wajar dalam ragam naratif yang bermartabat.
- source_word: לְפַרְעֹה
  choice: kepada Firaun
  rationale: Kata depan לְ dibiarkan dalam arti relasional yang luas; “kepada” tidak mempersempitnya secara tidak perlu menjadi hanya “terhadap” atau “di hadapan”.
- source_word: וּלְכָל עֲבָדָיו
  choice: kepada semua pegawainya
  rationale: Dalam konteks istana, עֲבָדִים dapat menunjuk para pelayan atau pejabat Firaun. “Pegawai” mudah dipahami dan mencakup orang-orang yang melayani pemerintahannya tanpa membatasi mereka pada pelayan rumah tangga.
- source_word: וּלְכָל אַרְצוֹ
  choice: dan kepada seluruh negerinya
  rationale: Terjemahan utama mengikuti susunan dan kata depan Ibrani sedekat mungkin. Karena לְ dapat menyatakan sasaran, dampak, atau lingkup, kemungkinan lain dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. “Yahweh” mempertahankan nama itu secara langsung tanpa menggantinya dengan gelar.
- issue: Arah atau lingkup tanda-tanda terhadap negeri Firaun
  choice: kepada seluruh negerinya
  alternative: terhadap seluruh negerinya atau di seluruh negerinya
  rationale: Kata depan לְ memiliki rentang relasional yang memungkinkan tanda-tanda dipahami sebagai diarahkan terhadap negeri itu atau terjadi di seluruh wilayahnya. Teks utama mempertahankan bentuk yang dekat dengan sumber, sedangkan ambiguitasnya dijelaskan dalam catatan.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Ayat dipertahankan sebagai kelanjutan sintaksis dari ayat sebelumnya, sehingga dimulai dengan huruf kecil dan berakhir dengan koma. Pengulangan “-nya” pada klausa pengutusan dipertahankan demi kejelasan hubungan dengan bentuk Ibrani.
