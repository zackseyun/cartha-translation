  text: And the sons of Israel wept for Moses in the plains of Moab thirty days; then the days of weeping[a] for the mourning of Moses were completed.
translation:
  language: id
  text: Orang Israel menangisi Musa di dataran Moab selama tiga puluh hari. Lalu berakhirlah hari-hari tangisan dan perkabungan atas Musa.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּבְכּוּ
  choice: menangisi
  rationale: Kata בכה menunjuk pada tindakan menangis. Dengan objek orang yang telah meninggal, bentuk Indonesia “menangisi Musa” secara alami menyatakan bahwa tangisan itu ditujukan kepada Musa sebagai orang yang diratapi.
- source_word: בְנֵי יִשְׂרָאֵל
  choice: Orang Israel
  rationale: Secara harfiah ungkapan ini berarti “anak-anak lelaki Israel,” tetapi di sini menunjuk pada umat Israel secara kolektif. “Orang Israel” akurat, inklusif, dan wajar dalam bahasa Indonesia modern.
- source_word: בְּעַרְבֹת מוֹאָב
  choice: di dataran Moab
  rationale: עַרְבוֹת mengacu pada wilayah datar atau padang terbuka. “Dataran Moab” mempertahankan makna geografis dan merupakan ungkapan Indonesia yang jelas.
- source_word: שְׁלֹשִׁים יוֹם
  choice: selama tiga puluh hari
  rationale: Preposisi “selama” membuat fungsi frasa waktu ini alami dan jelas dalam bahasa Indonesia.
- source_word: וַיִּתְּמוּ
  choice: berakhirlah
  rationale: Kata תם menyatakan bahwa suatu masa telah mencapai akhirnya atau selesai. “Berakhirlah” mempertahankan nuansa resultatif sekaligus terdengar alami.
- source_word: יְמֵי בְכִי
  choice: masa mereka menangis
  rationale: Rangkaian konstruksi ini secara harfiah berarti “hari-hari tangisan.” “Masa mereka menangis” menyampaikan periode yang dicirikan oleh tangisan tanpa kekakuan yang tidak perlu.
- source_word: אֵבֶל מֹשֶׁה
  choice: berkabung karena Musa
  rationale: Konstruksi ini menyatakan perkabungan yang berkaitan dengan Musa, yakni perkabungan atas kematiannya. “Karena Musa” alami dalam konteks Indonesia dan tidak menimbulkan kesan bahwa Musalah yang sedang berkabung.
