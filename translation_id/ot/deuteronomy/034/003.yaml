  text: וְ/אֶת הַ/נֶּ֗גֶב וְֽ/אֶת הַ/כִּכָּ֞ר בִּקְעַ֧ת יְרֵח֛וֹ עִ֥יר הַ/תְּמָרִ֖ים עַד צֹֽעַר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/003.yaml
  text: and the Negev[a], and the plain, the valley of Jericho, the city of palm trees[b], as far as Zoar.
translation:
  language: id
  text: dan Tanah Negeb[a] dan dataran itu, lembah Yerikho, kota pohon-pohon kurma, sampai ke Zoar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “wilayah selatan.” Kata Ibrani ini dapat berfungsi sebagai nama kawasan ataupun sebagai keterangan arah atau wilayah geografis.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנֶּגֶב
  choice: Tanah Negeb
  rationale: Dalam daftar wilayah ini, istilah tersebut berfungsi sebagai nama kawasan di bagian selatan; 'Tanah Negeb' mempertahankan nilai nama tempat sekaligus jelas bagi pembaca Indonesia.
- source_word: הַכִּכָּר
  choice: Lembah Yordan
  rationale: Dalam pemakaian geografis, istilah ini menunjuk kawasan dataran rendah di sekitar Yordan. Penyebutan 'Yordan' memperjelas acuan geografis yang tersirat tanpa memakai arti harfiah 'bundaran' yang tidak alami.
- source_word: בִּקְעַת יְרֵחוֹ
  choice: lembah luas Yerikho
  rationale: בִּקְעָה menunjuk lembah atau dataran yang lebar. 'Lembah luas' membedakannya dari הַכִּכָּר sambil mempertahankan ciri topografinya.
- source_word: עִיר הַתְּמָרִים
  choice: kota pohon-pohon kurma
  rationale: Terjemahan langsung dari julukan Yerikho ini mempertahankan gambaran konkret teks Ibrani.
- source_word: עַד צֹעַר
  choice: sampai ke Zoar
  rationale: עַד menandai batas jangkauan; frasa Indonesia ini menyampaikan batas geografis dengan alami.
- source_word: וְאֶת ... וְאֶת
  choice: juga ... dan
  rationale: Rangkaian konjungsi dan penanda objek melanjutkan daftar dari ayat sebelumnya. 'Juga ... dan' terdengar alami sebagai fragmen yang bergantung pada konteks sambil mempertahankan sifat kumulatif daftar.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ayat dipertahankan sebagai kelanjutan sintaksis dari ayat sebelumnya. Struktur penjelas antara Lembah Yordan dan lembah luas Yerikho dinyatakan dengan 'yaitu' agar hubungan geografisnya jelas tanpa tanda pisah yang berat.
