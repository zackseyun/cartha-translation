  text: וּ/מֹשֶׁ֗ה בֶּן מֵאָ֧ה וְ/עֶשְׂרִ֛ים שָׁנָ֖ה בְּ/מֹת֑/וֹ לֹֽא כָהֲתָ֥ה עֵינ֖/וֹ וְ/לֹא נָ֥ס לֵחֹֽ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/007.yaml
  text: Moses was one hundred twenty years old when he died[a]; his eye had not grown dim[b], and his vigor had not fled.
translation:
  language: id
  text: Musa berumur seratus dua puluh tahun ketika ia meninggal; matanya tidak menjadi kabur[a], dan kekuatannya tidak surut[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “penglihatannya tidak melemah.” Secara harfiah bahasa Ibrani berbunyi “matanya tidak menjadi kabur.”
    reason: lexical_alternative
  - marker: b
    text: Atau “kekuatan jasmaninya tidak berkurang” atau “kesegaran tubuhnya tidak hilang.” Ungkapan Ibrani ini menggambarkan kesegaran atau vigor jasmani yang tetap ada.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֹשֶׁה
  choice: Musa
  rationale: Nama tokoh diterjemahkan dengan bentuk baku bahasa Indonesia. Konjungsi pembuka וּ tidak perlu dinyatakan secara kaku karena kesinambungan narasi sudah jelas dari konteks.
- source_word: בֶּן מֵאָה וְעֶשְׂרִים שָׁנָה
  choice: berumur seratus dua puluh tahun
  rationale: Ungkapan Ibrani harfiah 'anak laki-laki dari seratus dua puluh tahun' merupakan idiom untuk menyatakan usia; bentuk ini alami dan tepat dalam bahasa Indonesia.
- source_word: בְּמֹתוֹ
  choice: ketika ia meninggal
  rationale: Preposisi בְּ dengan bentuk nomina 'kematiannya' menyatakan waktu. Klausa ini menyampaikan maknanya secara wajar dalam bahasa Indonesia.
- source_word: לֹא כָהֲתָה עֵינוֹ
  choice: Matanya belum menjadi kabur
  rationale: כָהָה menyatakan menjadi redup, kabur, atau lemah. Bentuk tunggal 'matanya' dipertahankan dari bahasa Ibrani dan secara idiomatis mengacu pada daya penglihatan.
- source_word: וְלֹא נָס לֵחֹה
  choice: dan kebugarannya belum hilang
  rationale: לֵחֹה menunjuk pada kesegaran atau kekuatan jasmani, sedangkan נָס secara harfiah berarti 'lari/lenyap'. 'Kebugarannya belum hilang' menyampaikan keadaan fisik yang tetap prima sambil mempertahankan gambaran bahwa kebugaran itu tidak lenyap.
