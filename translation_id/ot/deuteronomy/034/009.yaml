- from: Yosua anak Nun penuh dengan roh hikmat[a], sebab Musa telah menumpangkan kedua tangannya ke atasnya. Maka orang Israel mendengarkan dia dan melakukan seperti yang diperintahkan Yahweh kepada Musa.
  to: Yosua anak Nun penuh dengan roh hikmat[a], sebab Musa telah menumpangkan kedua tangannya ke atas Yosua. Maka orang Israel mendengarkannya dan melakukan seperti yang diperintahkan Yahweh kepada Musa.
  rationale: Revisi hanya memperbaiki kelancaran dan kejelasan rujukan dalam bahasa Indonesia serta menyelaraskan catatan kaki dengan rentang makna frasa Ibrani. Kapitalisasi "Roh" dalam alternatif dicatat sebagai pembacaan yang lebih spesifik, sedangkan teks utama tetap memakai "roh" untuk mempertahankan ambiguitas sumber.
