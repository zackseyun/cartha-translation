  text: וִֽ/יהוֹשֻׁ֣עַ בִּן נ֗וּן מָלֵא֙ ר֣וּחַ חָכְמָ֔ה כִּֽי סָמַ֥ךְ מֹשֶׁ֛ה אֶת יָדָ֖י/ו עָלָ֑י/ו וַ/יִּשְׁמְע֨וּ אֵלָ֤י/ו בְּנֵֽי יִשְׂרָאֵל֙ וַֽ/יַּעֲשׂ֔וּ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/009.yaml
  text: And Joshua son of Nun was full of the spirit of wisdom[a], because Moses had laid his hands on him[b]. So the sons of Israel listened to him and did as Yahweh had commanded Moses.
translation:
  language: id
  text: Yosua anak Nun penuh dengan roh hikmat[a], sebab Musa telah menumpangkan kedua tangannya ke atas Yosua. Maka orang Israel mendengarkannya dan melakukan seperti yang diperintahkan Yahweh kepada Musa.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “dipenuhi dengan Roh hikmat.” Frasa Ibrani ini dapat dipahami secara lebih umum sebagai roh hikmat atau, secara lebih khusus, sebagai pemberdayaan ilahi.
    reason: alternative_reading
lexical_decisions:
- source_word: מָלֵא רוּחַ חָכְמָה
  choice: penuh dengan roh hikmat
  rationale: Mempertahankan konstruksi Ibrani dan kemungkinan makna berupa kecakapan batin maupun pemberdayaan ilahi tanpa menentukannya secara berlebihan.
- source_word: רוּחַ
  choice: roh
  rationale: Dalam konteks ini menunjuk pada daya atau pemberian yang berkaitan dengan hikmat. Huruf kecil mempertahankan ketidakjelasan apakah yang dimaksud secara khusus adalah Roh Allah.
- source_word: סָמַךְ ... אֶת יָדָיו עָלָיו
  choice: menumpangkan kedua tangannya ke atasnya
  rationale: Ungkapan ini menggambarkan tindakan resmi penumpangan tangan. Bentuk dual יָדָיו dinyatakan secara alami sebagai 'kedua tangannya'.
- source_word: וַיִּשְׁמְעוּ אֵלָיו
  choice: mendengarkan dia
  rationale: Kata שׁמע dengan אֶל menyatakan mendengarkan dengan perhatian dan dapat menyiratkan ketaatan; klausa berikutnya menyatakan ketaatan itu secara jelas.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: orang Israel
  rationale: Dalam bahasa Indonesia modern, ungkapan ini secara alami merujuk kepada umat Israel secara kolektif; bentuk harfiah 'anak-anak lelaki Israel' akan memberi kesan biologis dan gender yang tidak diperlukan oleh fungsi idiomatis ungkapan tersebut di sini.
- source_word: וַיַּעֲשׂוּ כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: melakukan seperti yang diperintahkan Yahweh kepada Musa
  rationale: Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan bahwa tindakan Israel sesuai dengan perintah yang telah diberikan Yahweh kepada Musa.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dengan bentuk yang lazim dan dapat dipahami dalam bahasa Indonesia.
theological_decisions:
- issue: Apakah רוּחַ dalam 'roh hikmat' harus dinyatakan secara eksplisit sebagai Roh Allah
  choice: roh hikmat
  alternative: Roh hikmat
  rationale: Teks menyatakan adanya pemberdayaan yang terkait dengan penumpangan tangan Musa, tetapi frasa Ibrani tidak secara eksplisit mengharuskan identifikasi langsung dengan Roh Kudus. Huruf kecil mempertahankan ketegangan teologis tersebut.
- issue: Cara memahami hubungan sebab-akibat antara hikmat Yosua dan penumpangan tangan Musa
  choice: sebab Musa telah menumpangkan kedua tangannya ke atasnya
  alternative: karena Musa menumpangkan kedua tangannya ke atasnya
  rationale: כִּי menyatakan alasan bagi keadaan Yosua. Bentuk lampau 'telah menumpangkan' menjelaskan bahwa tindakan Musa mendahului keadaan dan kepemimpinan Yosua tanpa memperluas mekanismenya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Maka' mempertahankan alur naratif tanpa terasa kuno secara berlebihan; 'orang Israel' dipilih sebagai padanan kolektif yang alami. Semua penanda catatan kaki yang disertakan muncul dalam teks utama.
