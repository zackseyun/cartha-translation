  text: וַ/יִּקְבֹּ֨ר אֹת֤/וֹ בַ/גַּיְ֙ בְּ/אֶ֣רֶץ מוֹאָ֔ב מ֖וּל בֵּ֣ית פְּע֑וֹר וְ/לֹֽא יָדַ֥ע אִישׁ֙ אֶת קְבֻ֣רָת֔/וֹ עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/006.yaml
  text: And he buried him in the valley in the land of Moab[a], opposite Beth-peor[b], and no one knows his burial place to this day.
translation:
  language: id
  text: Lalu ia[a] menguburkan Musa di lembah, di tanah Moab, di seberang Bet-Peor, dan tidak seorang pun mengetahui tempat pemakamannya sampai hari ini.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani tidak menyebut nama subjek yang menguburkan Musa dalam ayat ini; konteks ayat sebelumnya menunjuk kepada TUHAN.
    reason: Menjelaskan subjek tersirat tanpa mengidentifikasikannya dalam teks utama.
lexical_decisions:
- source_word: וַיִּקְבֹּר אֹתוֹ
  choice: Lalu Ia menguburkan Musa
  rationale: Bentuk Qal 3ms aktif dipertahankan. Subjek tersirat paling wajar merujuk kepada TUHAN dalam ayat sebelumnya; huruf kapital pada “Ia” menyatakan rujukan kontekstual itu. Nama “Musa” dipakai untuk objek pronominal agar hubungan antarklausa jelas dan alami dalam bahasa Indonesia.
- source_word: בַגַּיְ
  choice: di lembah
  rationale: גַּיְ dapat berarti lembah atau jurang; “lembah” merupakan padanan yang tepat, umum, dan sesuai dengan konteks geografis.
- source_word: בְּאֶרֶץ מוֹאָב
  choice: di tanah Moab
  rationale: Mempertahankan ungkapan konkret Ibrani secara alami, tanpa memadatkannya menjadi sekadar “di Moab”.
- source_word: מוּל
  choice: di seberang
  rationale: Dalam keterangan lokasi, “di seberang” secara alami menyampaikan posisi berhadapan atau berlawanan dengan suatu tempat, walaupun tidak menentukan jarak maupun bentang geografis di antaranya.
- source_word: בֵּית פְּעוֹר
  choice: Bet-Peor
  rationale: Nama tempat ditransliterasikan menurut bentuk yang lazim dalam bahasa Indonesia.
- source_word: וְלֹא יָדַע אִישׁ
  choice: tidak seorang pun mengetahui
  rationale: אִישׁ bersifat generik di sini. “Tidak seorang pun” menyampaikan cakupan universalnya dengan bahasa Indonesia modern dan alami tanpa membatasi makna hanya pada laki-laki.
- source_word: קְבֻרָתוֹ
  choice: tempat pemakamannya
  rationale: Dalam konteks ini nomina tersebut menunjuk pada lokasi penguburan Musa. “Tempat pemakamannya” lebih jelas daripada “pemakamannya” dan lebih dekat pada nuansa tindakan penguburan daripada “kuburnya”.
- source_word: עַד הַיּוֹם הַזֶּה
  choice: Sampai hari ini
  rationale: Padanan idiomatis yang mempertahankan sudut pandang waktu sang narator dan daya berlakunya yang berkelanjutan.
theological_decisions:
- issue: Identitas subjek verba “menguburkan”
  choice: Merujukkan subjek tersirat kepada TUHAN melalui “Ia”, sambil menjelaskan dalam catatan bahwa nama-Nya tidak disebut dalam ayat ini.
  alternative: Memakai “ia” tanpa kapital untuk mempertahankan ketidakjelasan formal, atau bentuk pasif “Musa dikuburkan”.
  rationale: Ayat 5 menempatkan TUHAN sebagai rujukan gramatikal dan kontekstual terdekat, sehingga bahasa Indonesia membutuhkan subjek yang paling alami itu. Namun, catatan mempertahankan fakta penting bahwa ayat 6 sendiri hanya memiliki bentuk verba orang ketiga maskulin tunggal dan tidak menyebut subjek secara eksplisit.
- issue: Makna generik אִישׁ
  choice: tidak seorang pun
  alternative: tidak ada seorang laki-laki pun
  rationale: Walaupun bentuk leksikalnya maskulin tunggal, dalam konstruksi negatif ini אִישׁ berfungsi generik, sehingga padanan universal “tidak seorang pun” menyampaikan maknanya secara akurat dan alami.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibagi menjadi dua agar lancar dibaca. “Ia” dipakai bagi TUHAN sesuai rujukan kontekstual; “Bet-Peor” mengikuti transliterasi Indonesia yang lazim.
