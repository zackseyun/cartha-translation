base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/010.yaml
  text: And no prophet has arisen again in Israel like Moses[a], whom Yahweh knew face to face.
translation:
  language: id
  text: Dan tidak pernah lagi[a] muncul seorang nabi di Israel seperti Musa, yang dikenal oleh Yahweh dengan berhadapan muka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hingga saat itu belum pernah”; kata Ibrani yang diterjemahkan “lagi” dapat menyatakan bahwa sesudah Musa, sampai pada masa penuturan ayat ini, belum muncul nabi seperti dia di Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: Dan tidak pernah
  rationale: Konjungsi waw melanjutkan penutup narasi, sedangkan negasi bersama konteks temporal paling wajar diungkapkan dengan “Dan tidak pernah” tanpa menambahkan pertentangan yang tidak tersurat.
- source_word: קָם
  choice: muncul
  rationale: Bentuk Qal dari קום di sini menunjuk pada tampil atau munculnya seorang nabi. “Muncul” alami dalam bahasa Indonesia dan sesuai dengan tinjauan retrospektif ayat ini.
- source_word: נָבִיא
  choice: seorang nabi
  rationale: “Nabi” adalah padanan baku; kata “seorang” diperlukan agar konstruksi Indonesia terdengar alami.
- source_word: עוֹד
  choice: lagi
  rationale: Dalam konteks ini עוֹד menyatakan bahwa sesudah Musa tidak ada nabi sebanding yang muncul. “Lagi” menyampaikan daya temporal itu secara ringkas, sementara kemungkinan nuansa “hingga saat itu” dicatat dalam catatan kaki.
- source_word: בְּיִשְׂרָאֵל
  choice: di Israel
  rationale: Preposisi ב menunjuk pada lingkup tempat atau komunitas tempat nabi itu muncul; “di Israel” merupakan ungkapan Indonesia yang langsung dan alami.
- source_word: כְּמֹשֶׁה
  choice: seperti Musa
  rationale: Preposisi perbandingan כ diterjemahkan secara langsung dengan “seperti”.
- source_word: אֲשֶׁר יְדָעוֹ יְהוָה
  choice: yang dikenal Yahweh
  rationale: Klausa relatif ini menjadikan Musa objek dari tindakan “mengenal” oleh Yahweh. Bentuk pasif Indonesia menjaga hubungan gramatikal itu secara alami tanpa mengubah makna dasar ידע.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton dipertahankan sebagai nama pribadi “Yahweh”, bukan diganti dengan gelar.
- source_word: פָּנִים אֶל פָּנִים
  choice: muka dengan muka
  rationale: Ungkapan konkret Ibrani dipertahankan untuk menyatakan perjumpaan atau komunikasi langsung, sekaligus menjaga citra dan gaung antarteksnya.
theological_decisions:
- issue: Bahasa antropomorfis tentang hubungan Yahweh dengan Musa
  choice: Mempertahankan ungkapan “muka dengan muka”
  alternative: “secara pribadi” atau “secara langsung”
  rationale: Teks Ibrani memakai gambaran relasional yang konkret. Terjemahan tidak mereduksinya menjadi abstraksi dan tidak menentukan secara berlebihan implikasinya mengenai hakikat Allah.
- issue: Makna teologis ידע dalam klausa tentang Musa
  choice: “dikenal Yahweh”
  alternative: “diakui Yahweh” atau “dipilih Yahweh”
  rationale: Padanan “dikenal” mempertahankan keluasan makna relasional ידע dan tidak menyempitkannya menjadi pengakuan resmi atau pemilihan semata.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. Susunan kalimat dibuat alami bagi pembaca umum, sementara nama Yahweh dan ungkapan “muka dengan muka” dipertahankan untuk ketepatan sumber dan bobot teologisnya.
