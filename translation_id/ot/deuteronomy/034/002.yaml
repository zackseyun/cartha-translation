  text: וְ/אֵת֙ כָּל נַפְתָּלִ֔י וְ/אֶת אֶ֥רֶץ אֶפְרַ֖יִם וּ/מְנַשֶּׁ֑ה וְ/אֵת֙ כָּל אֶ֣רֶץ יְהוּדָ֔ה עַ֖ד הַ/יָּ֥ם הָ/אַחֲרֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/034/002.yaml
  text: and all Naphtali[a], and the land of Ephraim and Manasseh, and all the land of Judah as far as the western sea,
translation:
  language: id
  text: seluruh wilayah Naftali, tanah Efraim dan Manasye, serta seluruh tanah Yehuda sampai ke laut di sebelah barat[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “laut terakhir” atau “laut belakang”, ungkapan Ibrani untuk laut di sebelah barat, yaitu Laut Tengah.
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל נַפְתָּלִי
  choice: seluruh wilayah Naftali
  rationale: Nama suku dipakai secara geografis dalam rangkaian wilayah yang terlihat. Penambahan “wilayah” membuat maksud teritorialnya jelas dan wajar dalam bahasa Indonesia tanpa mengubah cakupan כָּל.
- source_word: אֶרֶץ אֶפְרַיִם וּמְנַשֶּׁה
  choice: tanah Efraim dan Manasye
  rationale: אֶרֶץ menunjuk pada tanah atau daerah yang dikaitkan dengan kedua suku. Satu kata “tanah” secara alami menaungi kedua nama yang dikoordinasikan.
- source_word: כָּל אֶרֶץ יְהוּדָה
  choice: seluruh tanah Yehuda
  rationale: Terjemahan ini mempertahankan unsur אֶרֶץ dan penekanan כָּל pada keseluruhan bentang wilayah.
- source_word: עַד
  choice: sampai ke
  rationale: Dalam uraian bentang geografis, עַד menyatakan batas jangkauan pandangan; “sampai ke” merupakan ungkapan Indonesia yang alami.
- source_word: הַיָּם הָאַחֲרוֹן
  choice: laut di sebelah barat
  rationale: Ungkapan Ibrani harfiah “laut terakhir/belakang” merupakan sebutan arah bagi laut di barat. Terjemahan ini menyampaikan arah secara jelas tanpa memasukkan nama geografis “Laut Tengah” ke dalam teks utama.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ayat dipertahankan sebagai kelanjutan sintaksis dari ayat sebelumnya, sehingga dimulai tanpa huruf kapital dan diakhiri koma. “Wilayah” dipakai hanya pada Naftali untuk memperjelas fungsi geografis nama suku dalam bahasa Indonesia.
