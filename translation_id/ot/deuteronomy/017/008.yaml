language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּ֣י יִפָּלֵא֩ מִמְּ/ךָ֨ דָבָ֜ר לַ/מִּשְׁפָּ֗ט בֵּֽין דָּ֨ם לְ/דָ֜ם בֵּֽין דִּ֣ין לְ/דִ֗ין וּ/בֵ֥ין נֶ֨גַע֙ לָ/נֶ֔גַע דִּבְרֵ֥י רִיבֹ֖ת בִּ/שְׁעָרֶ֑י/ךָ וְ/קַמְתָּ֣ וְ/עָלִ֔יתָ אֶל הַ/מָּק֔וֹם אֲשֶׁ֥ר יִבְחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ בּֽ/וֹ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/008.yaml
  text: If a matter for judgment is too difficult for you—between bloodshed and bloodshed[a], between one legal claim and another, and between one injury and another[d][c][b], matters of dispute within your gates—then you shall arise and go up to the place that Yahweh your God will choose.
translation:
  language: id
  text: Jika suatu perkara terlalu sulit bagimu untuk diputuskan—antara kasus penumpahan darah yang satu dan yang lain[a], antara tuntutan hukum yang satu dan yang lain[b], atau antara luka yang satu dan yang lain[c]—yakni perkara-perkara sengketa di gerbang kotamu[d], maka engkau harus bangkit dan pergi ke tempat yang akan dipilih Yahweh, Allahmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “antara darah dan darah”; maksudnya membedakan satu kasus yang menyangkut penumpahan darah atau utang darah dari kasus lainnya.
    reason: lexical_alternative
  - marker: b
    text: Atau “antara perkara hukum yang satu dan yang lain” atau “antara putusan yang satu dan yang lain.”
    reason: lexical_alternative
  - marker: c
    text: Kata Ibrani yang diterjemahkan “luka” juga dapat berarti “pukulan”, “penderitaan”, “penyakit”, atau “tulah”.
    reason: lexical_alternative
  - marker: d
    text: Gerbang kota merupakan tempat yang lazim dipakai untuk persidangan dan pengambilan keputusan oleh para tua-tua atau hakim setempat.
    reason: cultural_note
lexical_decisions:
- source_word: יִפָּלֵא
  choice: terlalu sulit bagimu
  rationale: Bentuk Niphal dari פלא dalam konteks peradilan menyatakan perkara yang melampaui kemampuan hakim setempat untuk memutuskannya.
- source_word: דָבָר לַמִּשְׁפָּט
  choice: suatu perkara ... untuk diputuskan
  rationale: Gabungan ini menunjuk kepada perkara hukum yang memerlukan putusan; susunan Indonesia ini alami dan mempertahankan konteks yudisial.
- source_word: בֵּין דָּם לְדָם
  choice: antara kasus penumpahan darah yang satu dan yang lain
  rationale: Ungkapan harfiahnya 'antara darah dan darah'; pilihan ini mempertahankan citra darah sambil memperjelas bahwa yang dibandingkan ialah kasus hukum.
- source_word: בֵּין דִּין לְדִין
  choice: antara tuntutan hukum yang satu dan yang lain
  rationale: דִּין dapat berarti tuntutan, perkara, atau putusan hukum. 'Tuntutan hukum' cocok dengan konteks forensik tanpa menutup seluruh rentang maknanya, yang dicatat dalam catatan kaki.
- source_word: וּבֵין נֶגַע לָנֶגַע
  choice: antara luka yang satu dan yang lain
  rationale: נֶגַע dapat menunjuk luka, pukulan, penyakit, atau bala. Dalam daftar perkara pengadilan, 'luka' paling langsung dipahami, sementara ambiguitas leksikal dipertahankan dalam catatan kaki.
- source_word: דִּבְרֵי רִיבֹת
  choice: perkara-perkara sengketa
  rationale: Ungkapan ini menyatakan perkara yang diperselisihkan; bentuk ini ringkas, wajar, dan bernuansa hukum.
- source_word: בִּשְׁעָרֶיךָ
  choice: di gerbang kotamu
  rationale: Gerbang kota merupakan tempat lazim berlangsungnya pengadilan setempat. Terjemahan mempertahankan citra budaya sumber dan memperjelas acuannya.
- source_word: וְקַמְתָּ וְעָלִיתָ
  choice: engkau harus bangkit dan pergi
  rationale: Dua verba menandai tindakan tegas. עָלָה secara harfiah berarti 'naik', tetapi dalam bahasa Indonesia 'pergi' lebih alami di sini; nuansa arah tidak menentukan isi perintah.
- source_word: הַמָּקוֹם אֲשֶׁר יִבְחַר
  choice: tempat yang akan dipilih
  rationale: Bentuk yiqtol bersifat prospektif dan sesuai dengan rumusan Ulangan tentang tempat yang kelak Yahweh tetapkan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai nama diri perjanjian YHWH. Bentuk 'Yahweh' mempertahankannya sebagai nama dan merupakan transliterasi modern yang lazim.
- issue: Cakupan נֶגַע dalam daftar perkara hukum
  choice: luka, dengan alternatif dicatat
  alternative: penyakit, tulah, atau pukulan
  rationale: Konteks pengadilan mendukung 'luka', tetapi kata Ibrani tetap dapat mencakup penderitaan atau penyakit; catatan kaki mencegah kepastian yang berlebihan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang khidmat tetapi mudah dipahami. Sapaan tunggal dipertahankan melalui 'bagimu', 'kotamu', dan 'Allahmu'. Tanda pisah menata daftar kasus tanpa menghilangkan hubungan sintaksisnya.
