  text: וְ/הָיָ֣ה כְ/שִׁבְתּ֔/וֹ עַ֖ל כִּסֵּ֣א מַמְלַכְתּ֑/וֹ וְ/כָ֨תַב ל֜/וֹ אֶת מִשְׁנֵ֨ה הַ/תּוֹרָ֤ה הַ/זֹּאת֙ עַל סֵ֔פֶר מִ/לִּ/פְנֵ֥י הַ/כֹּהֲנִ֖ים הַ/לְוִיִּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/018.yaml
  text: And when he sits on the throne of his kingdom[a], he shall write for himself in a book a copy of this law[b], from before the Levitical priests.
translation:
  language: id
  text: Ketika ia duduk di atas takhta kerajaannya, ia harus menulis bagi dirinya sendiri sebuah salinan hukum ini dalam sebuah kitab, dari hadapan[a] para imam Lewi[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani secara harfiah berarti “dari hadapan”. Kemungkinan maksudnya ialah bahwa salinan itu dibuat berdasarkan naskah acuan yang berada di hadapan atau dalam penjagaan para imam Lewi; dapat juga dipahami “di hadapan para imam Lewi”.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “para imam, orang-orang Lewi”; secara tradisional juga diterjemahkan “imam-imam Lewi”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְשִׁבְתּוֹ
  choice: Ketika ia duduk
  rationale: Gabungan ini memperkenalkan keadaan waktu dalam ketetapan hukum. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan arti temporal ‘ketika ia duduk’.
- source_word: עַל כִּסֵּא מַמְלַכְתּוֹ
  choice: di atas takhta kerajaannya
  rationale: Mempertahankan gambaran konkret ‘takhta’ dan bentuk kepunyaan ‘kerajaannya’, tanpa meringkasnya menjadi ‘takhta kerajaan’.
- source_word: וְכָתַב לוֹ
  choice: ia harus menulis bagi dirinya sendiri
  rationale: 'Dalam konteks hukum, bentuk verba menyatakan kewajiban. לּוֹ dipahami sebagai datif keuntungan/refleksif: raja membuat salinan itu untuk dipakainya sendiri.'
- source_word: מִשְׁנֵה
  choice: suatu salinan
  rationale: Dalam konteks ini menunjuk pada salinan atau duplikat, bukan sekadar pengulangan atau ‘yang kedua’ secara abstrak.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: hukum ini
  rationale: Dalam konteks peraturan kerajaan, תּוֹרָה menunjuk pada hukum atau pengajaran perjanjian yang sedang dibicarakan. ‘Hukum ini’ jelas tanpa memperluas cakupannya melampaui konteks.
- source_word: עַל סֵפֶר
  choice: dalam sebuah kitab
  rationale: Secara harfiah berarti menuliskannya pada kitab/dokumen; benda yang dimaksud kemungkinan berupa gulungan. ‘Dalam sebuah kitab’ mudah dipahami sekaligus mempertahankan istilah umum bagi media tertulis.
- source_word: מִלִּפְנֵי
  choice: dari hadapan
  rationale: Mempertahankan ungkapan Ibrani yang secara harfiah berarti ‘dari hadapan/dari hadirat’. Kemungkinan maksudnya ialah menyalin dari naskah acuan yang berada dalam penjagaan para imam, tetapi rincian itu tidak dinyatakan secara eksplisit dalam teks.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: para imam Lewi
  rationale: Ungkapan ini dapat dipahami sebagai ‘imam-imam Lewi’ atau, secara lebih formal, ‘para imam, yakni orang-orang Lewi’. ‘Para imam Lewi’ alami dan ringkas dalam bahasa Indonesia.
theological_decisions:
- issue: Cakupan תּוֹרָה dalam ketetapan bagi raja
  choice: hukum ini
  alternative: pengajaran ini; Taurat ini
  rationale: Pilihan ‘hukum ini’ paling sesuai dengan konteks hukum langsung dan tidak memaksakan klaim tentang cakupan kanonis yang tidak dijelaskan oleh ayat ini.
- issue: Makna hubungan raja dengan naskah di hadapan para imam
  choice: Mempertahankan ungkapan ‘dari hadapan’ dalam teks utama
  alternative: berdasarkan naskah yang disimpan oleh para imam Lewi; di hadapan para imam Lewi
  rationale: Bahasa Ibrani kemungkinan menunjuk pada naskah acuan resmi yang berada dalam penjagaan imam, tetapi dapat pula terdengar sebagai tindakan yang dilakukan di hadapan mereka. Terjemahan utama mempertahankan ketegangan itu, sedangkan catatan kaki menjelaskan kemungkinan yang kuat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. ‘Ia harus’ menyampaikan kewajiban hukum secara wajar. Susunan ‘dari hadapan’ sengaja agak formal untuk menjaga ambiguitas sumber, dengan penjelasan dalam catatan kaki.
