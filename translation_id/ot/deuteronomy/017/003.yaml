  text: and goes and serves other gods and bows down to them[a], or to the sun or to the moon or to all the host of heaven, which I have not commanded[b],
translation:
  language: id
  text: pergi dan beribadah kepada ilah-ilah lain serta sujud kepada mereka, atau kepada matahari, bulan, maupun seluruh bala tentara langit[a], yang tidak Kuperintahkan[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “bala tentara langit” dapat menunjuk pada kumpulan benda-benda langit dan, dalam konteks tertentu, juga dapat membangkitkan gagasan tentang makhluk-makhluk surgawi.
    reason: lexical_alternative
  - marker: b
    text: Klausa “yang tidak Kuperintahkan” dapat mengacu secara khusus pada “seluruh bala tentara langit” atau secara lebih luas pada seluruh tindakan beribadah yang baru disebutkan.
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: lalu pergi
  rationale: Bentuk wayyiqtol melanjutkan rangkaian tindakan dalam anak kalimat persyaratan hukum dari ayat sebelumnya; “lalu pergi” alami dalam bahasa Indonesia tanpa memaksakan waktu lampau.
- source_word: וַיַּעֲבֹד
  choice: beribadah kepada
  rationale: Dengan ilah sebagai objek, עבד menunjuk pada pelayanan kultis. “Beribadah kepada” menyampaikan makna itu dengan wajar, sedangkan tindakan fisik penyembahan tetap dinyatakan oleh kata kerja berikutnya.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ilah-ilah lain
  rationale: Menerjemahkan arti lugas tanpa menambahkan nuansa etnis yang akan timbul dari “ilah-ilah asing”.
- source_word: וַיִּשְׁתַּחוּ לָהֶם
  choice: sujud kepada mereka
  rationale: Kata kerja ini menggambarkan tindakan membungkuk atau merebahkan diri sebagai penghormatan; “sujud” ringkas, jelas, dan mempertahankan unsur fisiknya.
- source_word: וְלַשֶּׁמֶשׁ א֣וֹ לַיָּרֵחַ א֛וֹ לְכָל צְבָא הַשָּׁמַיִם
  choice: atau kepada matahari, bulan, maupun seluruh bala tentara langit
  rationale: Rangkaian disjungtif diterjemahkan secara alami dalam bahasa Indonesia. “Bala tentara langit” mempertahankan citra kolektif צבא dan tidak mempersempit acuannya hanya kepada bintang atau makhluk surgawi.
- source_word: אֲשֶׁר לֹא צִוִּיתִי
  choice: yang tidak Kuperintahkan
  rationale: Terjemahan dekat ini menyatakan tidak adanya perintah ilahi, bukan menggantinya dengan kata “Kularang”, dan tetap membiarkan cakupan klausa relatifnya terbuka.
theological_decisions:
- issue: Cakupan klausa אֲשֶׁר לֹא צִוִּיתִי
  choice: Dipertahankan sebagai “yang tidak Kuperintahkan” sesudah seluruh daftar.
  alternative: Klausa itu dapat menerangkan secara khusus “seluruh bala tentara langit”, atau merangkum seluruh tindakan beribadah dan sujud kepada ilah-ilah lain.
  rationale: Secara tata bahasa klausa itu paling dekat dengan “seluruh bala tentara langit”, tetapi dalam konteks dapat berfungsi lebih luas sebagai penolakan ilahi terhadap penyembahan berhala yang baru disebutkan. Teks utama dan catatan kaki tidak memaksakan salah satu cakupan.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan bermartabat. “Ilah-ilah” dan “bala tentara langit” dipakai sebagai istilah religius yang tetap dapat dipahami pembaca umum. Kapitalisasi enklitik pada “Kuperintahkan” menandai pembicara ilahi sesuai kebiasaan penerbitan Alkitab bahasa Indonesia. Tanda koma akhir dipertahankan karena ayat ini merupakan bagian dari kalimat hukum yang berlanjut.
