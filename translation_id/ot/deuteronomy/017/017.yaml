base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/017.yaml
  text: And he shall not multiply wives for himself[a], lest his heart turn away; and he shall not greatly multiply silver and gold for himself.
translation:
  language: id
  text: Janganlah ia mengambil banyak istri bagi dirinya sendiri,[a] jangan sampai hatinya menyimpang. Janganlah pula ia mengumpulkan sangat banyak perak dan emas bagi dirinya sendiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bagi dirinya sendiri, dan hatinya jangan menyimpang.” Bahasa Ibrani dapat dipahami sebagai larangan sejajar, bukan sebagai klausa yang menyatakan akibat yang hendak dicegah.
    reason: alternative_reading
lexical_decisions:
- source_word: יַרְבֶּה
  choice: mengambil banyak / mengumpulkan sangat banyak
  rationale: 'Dalam bentuk Hifil, רבה menyatakan membuat menjadi banyak atau menimbun secara berlebihan. Objeknya menuntut ungkapan Indonesia yang berbeda agar alami: seorang raja ''mengambil banyak istri'', tetapi ''mengumpulkan sangat banyak perak dan emas''.'
- source_word: נָשִׁים
  choice: istri
  rationale: Dalam peraturan tentang raja ini, bentuk jamak אִשָּׁה menunjuk kepada pasangan dalam perkawinan, bukan perempuan secara umum.
- source_word: יָסוּר
  choice: menyimpang
  rationale: סור berarti berbelok atau menyimpang. Pilihan ini mempertahankan gambaran tentang hati yang beralih dari jalan kesetiaan tanpa menambahkan objek yang tidak disebutkan dalam teks.
- source_word: לְבָבוֹ
  choice: hatinya
  rationale: '''Hati'' merupakan padanan lazim bagi pusat kehendak, pikiran, dan keinginan dalam antropologi Ibrani serta mempertahankan citra sumber.'
- source_word: כֶסֶף וְזָהָב
  choice: perak dan emas
  rationale: Padanan konkret ini mempertahankan pasangan istilah dalam bahasa Ibrani dan gaya paralelnya.
- source_word: מְאֹד
  choice: sangat banyak
  rationale: מְאֹד memperkuat larangan menimbun perak dan emas; 'sangat banyak' alami dalam bahasa Indonesia dan menyatakan jumlah berlebihan.
- source_word: וְלֹא ... וְלֹא ... לֹא
  choice: Janganlah ... supaya ... tidak ... Janganlah pula
  rationale: Rangkaian ini mempertahankan nada hukum. Klausa tengah dibaca sebagai tujuan atau akibat yang hendak dicegah, sementara larangan terakhir disampaikan sebagai kalimat tersendiri agar jelas dan alami.
theological_decisions:
- issue: Hubungan antara mengambil banyak istri dan penyimpangan hati
  choice: 'Klausa tengah diterjemahkan sebagai tujuan atau akibat yang hendak dicegah: ''supaya hatinya tidak menyimpang''.'
  alternative: '''dan hatinya jangan menyimpang'' sebagai larangan sejajar'
  rationale: Susunan Ibrani memungkinkan kedua pembacaan. Dalam alur peraturan bagi raja, klausa itu paling wajar menjelaskan bahaya dari mengambil banyak istri. Catatan kaki mempertahankan kemungkinan bahwa klausa tersebut merupakan larangan yang sejajar, dan terjemahan tidak menambahkan tujuan penyimpangan yang tidak dinyatakan dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk 'janganlah' mempertahankan nada hukum tanpa terdengar usang. Repetisi 'bagi dirinya sendiri' dipertahankan karena terdapat pada kedua larangan dalam teks Ibrani.
