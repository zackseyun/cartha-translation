id: DEU.17.14
reference: Deuteronomy 17:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי תָבֹ֣א אֶל הָ/אָ֗רֶץ אֲשֶׁ֨ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ נֹתֵ֣ן לָ֔/ךְ וִֽ/ירִשְׁתָּ֖/הּ וְ/יָשַׁ֣בְתָּה בָּ֑/הּ וְ/אָמַרְתָּ֗ אָשִׂ֤ימָה עָלַ/י֙ מֶ֔לֶךְ כְּ/כָל הַ/גּוֹיִ֖ם אֲשֶׁ֥ר סְבִיבֹתָֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/014.yaml
  text: When you come into the land that Yahweh your God is giving you[a], and you take possession of it and live in it, and you say, “I will set a king over myself, like all the nations that are around me,”
translation:
  language: id
  text: Ketika engkau memasuki negeri yang Yahweh, Allahmu, akan berikan kepadamu, mengambilnya menjadi milikmu dan tinggal di sana, lalu engkau berkata, “Aku akan mengangkat seorang raja untuk memerintahku[a], seperti semua bangsa di sekelilingku,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dapat juga diterjemahkan, “Aku akan menetapkan seorang raja atasku.” Secara harfiah: “Aku akan menempatkan seorang raja atas diriku.”'
    reason: Menjelaskan alternatif untuk שׂים serta mempertahankan susunan harfiah ungkapan עָלַי, sementara teks utama memakai padanan Indonesia yang idiomatis.
lexical_decisions:
- source_word: כִּי תָבֹא
  choice: Apabila engkau memasuki
  rationale: כִּי memperkenalkan keadaan yang diharapkan terjadi pada masa depan, sedangkan בוא dengan אֶל הָאָרֶץ berarti memasuki negeri itu. “Apabila” mempertahankan nuansa waktu sekaligus keadaan tanpa menyiratkan keraguan yang kuat.
- source_word: הָאָרֶץ
  choice: negeri
  rationale: Dalam konteks Ulangan, kata ini menunjuk pada negeri yang diberikan kepada Israel. “Negeri” alami dalam bahasa Indonesia dan lebih tepat daripada “tanah” untuk wilayah tempat suatu bangsa tinggal.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Allahmu
  rationale: Nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh,” sedangkan bentuk bersufiks אֱלֹהֶיךָ diterjemahkan “Allahmu,” dengan sapaan orang kedua tunggal dipertahankan.
- source_word: נֹתֵן לָךְ
  choice: berikan kepadamu
  rationale: Partisipel Ibrani menggambarkan tindakan Yahweh yang sedang atau secara pasti dilakukan dalam cakrawala ujaran. Bentuk “berikan kepadamu” setelah klausa relatif terdengar alami dan mempertahankan Allah sebagai pelaku.
- source_word: וִירִשְׁתָּהּ
  choice: lalu menguasainya
  rationale: ירשׁ dalam konteks negeri berarti mengambil dan memegang kepemilikan atasnya. “Menguasainya” menyampaikan perolehan nyata atas negeri itu tanpa membatasi makna pada warisan pasif.
- source_word: וְיָשַׁבְתָּה בָּהּ
  choice: dan tinggal di sana
  rationale: ישׁב di sini menunjuk pada kediaman yang menetap. “Tinggal di sana” merupakan ungkapan Indonesia modern yang wajar.
- source_word: וְאָמַרְתָּ
  choice: dan engkau berkata
  rationale: Bentuk berawalan waw melanjutkan urutan tindakan dalam skenario hukum ini. Terjemahan mempertahankan hubungan koordinatif teks sumber.
- source_word: אָשִׂימָה עָלַי מֶלֶךְ
  choice: Aku akan mengangkat seorang raja atas diriku
  rationale: שׂים dapat berarti menempatkan atau mengangkat, dan עָלַי secara harfiah berarti “atas diriku.” “Mengangkat” alami untuk penetapan raja, sementara “atas diriku” mempertahankan perspektif refleksif serta otoritas raja atas penutur.
- source_word: כְּכָל הַגּוֹיִם אֲשֶׁר סְבִיבֹתָי
  choice: seperti semua bangsa di sekelilingku
  rationale: גּוֹיִם di sini berarti bangsa-bangsa sekitar, bukan istilah teologis khusus. Terjemahan mempertahankan perbandingan dan sudut pandang orang pertama dalam kutipan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks sumber memakai nama perjanjian ilahi secara langsung. Transliterasi “Yahweh” mempertahankannya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Sikap ayat terhadap permintaan akan raja
  choice: Mempertahankan pernyataan bersyarat tanpa menambahkan penilaian
  alternative: Menerjemahkannya dengan bahasa yang secara eksplisit menyetujui atau mengecam kerajaan
  rationale: Ayat ini sendiri menggambarkan perkataan Israel ketika meminta raja seperti bangsa-bangsa sekitar; penilaian dan ketentuan lebih lanjut muncul dalam konteks berikutnya. Terjemahan tidak menyelesaikan ketegangan itu secara dini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti tunggal “engkau” mempertahankan sapaan orang kedua tunggal dalam bahasa Ibrani. Struktur berantai ayat dipertahankan agar alur hukum-retoris sumber tetap terasa, tetapi pilihan kata dibuat wajar bagi pembaca masa kini.
