revisions:
- from: Apabila engkau memasuki negeri yang Yahweh, Allahmu, berikan kepadamu, lalu menguasainya dan tinggal di sana, dan engkau berkata, “Aku akan mengangkat seorang raja atas diriku[a], seperti semua bangsa di sekelilingku,”
  to: Ketika engkau memasuki negeri yang Yahweh, Allahmu, akan berikan kepadamu, mengambilnya menjadi milikmu dan tinggal di sana, lalu engkau berkata, “Aku akan mengangkat seorang raja untuk memerintahku[a], seperti semua bangsa di sekelilingku,”
  rationale: Revisi ini memperbaiki tata bahasa Indonesia, menyesuaikan penanda temporal dengan fungsi כִּי, dan memperjelas makna ירשׁ sebagai mengambil negeri menjadi milik. Makna dasar permintaan untuk menempatkan/menetapkan raja atas penutur tetap dipertahankan, dengan bentuk literal tersedia pada catatan kaki.
