base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/005.yaml
  text: then you shall bring out to your gates that man or that woman who did this evil thing[a], that man or that woman, and you shall stone them with stones[b], and they shall die.
translation:
  language: id
  text: maka bawalah ke gerbang-gerbang kotamu laki-laki itu atau perempuan itu yang telah melakukan perbuatan jahat ini[a]—laki-laki itu atau perempuan itu—lalu rajamlah mereka dengan batu, dan mereka harus mati.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perkara jahat ini”. Kata Ibrani דָּבָר dapat berarti “hal” atau “perkara”, khususnya dalam konteks hukum.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצֵאתָ
  choice: maka engkau harus membawa keluar
  rationale: Bentuk waw + perfektum dalam rangkaian hukum menyatakan langkah prosedural berikutnya. “Maka ... harus membawa keluar” mempertahankan urutan, daya wajib, dan unsur ‘keluar’ dalam verba Ibrani.
- source_word: הָאִישׁ ... הָאִשָּׁה
  choice: laki-laki atau perempuan ... laki-laki itu ataupun perempuan itu
  rationale: Bahasa Ibrani secara eksplisit menyebut kedua jenis kelamin dan mengulang pasangan itu. Terjemahan mempertahankan kekhususan serta pengulangan tersebut.
- source_word: אֲשֶׁר עָשׂוּ
  choice: yang telah melakukan
  rationale: Ungkapan ini merupakan klausa relatif sederhana. “Telah melakukan” wajar dalam konteks putusan hukum dan menunjukkan tindakan yang sudah diperiksa.
- source_word: הַדָּבָר הָרָע הַזֶּה
  choice: perkara jahat ini
  rationale: דָּבָר dapat berarti ‘hal’, ‘perkara’, atau ‘perkataan’. Dalam konteks pengadilan, “perkara” alami dan tetap mempertahankan kemungkinan nuansa hukum.
- source_word: אֶל שְׁעָרֶיךָ
  choice: ke pintu gerbang kotamu
  rationale: Secara harfiah frasa ini berarti ‘ke gerbang-gerbangmu’. Dalam pemakaian Ulangan, gerbang adalah gerbang kota dan tempat umum untuk proses hukum; “pintu gerbang kotamu” membuat rujukan itu jelas tanpa mengganti citra konkret sumber.
- source_word: וּסְקַלְתָּם בָּאֲבָנִים
  choice: lalu engkau harus merajam mereka dengan batu
  rationale: Terjemahan mempertahankan objek jamak dalam bahasa Ibrani serta penyebutan alat hukuman secara eksplisit, ‘dengan batu’.
- source_word: וָמֵתוּ
  choice: hingga mereka mati
  rationale: Klausa ini menyatakan hasil akhir pelaksanaan hukuman. “Hingga mereka mati” mengungkapkan hasil tersebut secara alami dalam bahasa Indonesia tanpa menambahkan gagasan teologis.
theological_decisions:
- issue: Rumusan hukum yang menyebut jenis kelamin
  choice: laki-laki atau perempuan
  alternative: orang itu
  rationale: Teks Ibrani sengaja menyebut laki-laki dan perempuan secara terpisah. Terjemahan tidak menetralkan rumusan yang eksplisit ini.
- issue: Lokasi pengadilan dan pelaksanaan hukuman
  choice: ke pintu gerbang kotamu
  alternative: ke tempat pengadilan umum
  rationale: Citra konkret gerbang dipertahankan, sedangkan fungsi sosial dan hukumnya dijelaskan dalam catatan kaki agar terjemahan utama tidak menjadi parafrasa.
- issue: Acuan pronomina jamak setelah pasangan alternatif
  choice: mereka
  alternative: dia
  rationale: Bahasa Ibrani memakai akhiran objek dan verba dalam bentuk jamak, walaupun pelakunya dirumuskan sebagai laki-laki atau perempuan. Bentuk jamak dipertahankan sebagai rumusan hukum yang mencakup kedua kategori, tanpa menyiratkan bahwa keduanya selalu dihukum bersama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat digunakan dengan sapaan hukum tunggal “engkau”. Pengulangan “laki-laki ... perempuan” dipertahankan karena menonjol dalam teks Ibrani. Urutan penanda catatan mengikuti letak istilah yang dijelaskan dalam teks Indonesia.
