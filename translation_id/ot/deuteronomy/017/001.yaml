id: DEU.17.1
reference: Deuteronomy 17:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לֹא תִזְבַּח֩ לַ/יהוָ֨ה אֱלֹהֶ֜י/ךָ שׁ֣וֹר וָ/שֶׂ֗ה אֲשֶׁ֨ר יִהְיֶ֥ה ב/וֹ֙ מ֔וּם כֹּ֖ל דָּבָ֣ר רָ֑ע כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ הֽוּא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/001.yaml
  text: You shall not sacrifice to Yahweh your God an ox or a sheep that has in it a blemish[a], any bad thing, for that is an abomination to Yahweh your God.
translation:
  language: id
  text: Janganlah engkau mengorbankan kepada Yahweh, Allahmu, seekor lembu atau seekor domba[a] yang memiliki cacat, yaitu sesuatu apa pun yang buruk, sebab itu adalah kekejian bagi Yahweh, Allahmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani שֶׂה adalah istilah umum untuk ternak kecil dan dapat merujuk pada domba ataupun kambing.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִזְבַּח
  choice: mempersembahkan
  rationale: Dalam konteks korban, verba זבח menunjuk pada penyembelihan atau pemberian hewan sebagai korban; 'mempersembahkan' menyampaikan fungsi ritualnya secara alami dalam bahasa Indonesia.
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Preposisi ל menyatakan pihak yang menerima persembahan, sedangkan nama ilahi יְהוָה ditransliterasikan sebagai 'Yahweh'.
- source_word: שׁוֹר
  choice: seekor sapi
  rationale: שׁוֹר adalah hewan dari jenis sapi; pilihan ini tidak mempersempit makna kepada jenis kelamin tertentu seperti 'lembu jantan'.
- source_word: שֶׂה
  choice: seekor domba
  rationale: Dalam bahasa Indonesia, 'domba' merupakan padanan yang wajar dalam daftar hewan korban, sementara keluasan istilah Ibrani yang juga dapat mencakup kambing dijelaskan dalam catatan kaki.
- source_word: מוּם
  choice: cacat
  rationale: '''Cacat'' secara tepat menyatakan ketidaksempurnaan fisik yang membuat hewan tidak layak dipersembahkan.'
- source_word: כֹּל דָּבָר רָע
  choice: yakni sesuatu yang buruk
  rationale: Frasa ini secara harfiah berarti 'setiap/segala hal yang buruk' dan menjelaskan lebih lanjut 'cacat'; 'yakni' membuat hubungan aposisional itu jelas tanpa menyempitkannya menjadi hanya 'cacat berat'.
- source_word: תוֹעֲבַת
  choice: kekejian
  rationale: '''Kekejian'' mempertahankan bobot kuat תוֹעֵבָה sebagai sesuatu yang sangat menjijikkan atau tidak berkenan di hadapan Allah.'
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יְהוָה secara langsung; transliterasi 'Yahweh' mempertahankan nama itu dan membedakannya dari gelar ilahi.
- issue: Cakupan כֹּל דָּבָר רָע setelah מוּם
  choice: yakni sesuatu yang buruk
  alternative: cacat apa pun yang parah
  rationale: Pilihan ini mempertahankan keluasan dan ketegangan ungkapan Ibrani tanpa menambahkan batasan 'parah' yang tidak dinyatakan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk tunggal 'engkau' mempertahankan sapaan langsung hukum Ibrani. Pengulangan 'Yahweh, Allahmu' dipertahankan sesuai struktur sumber.
