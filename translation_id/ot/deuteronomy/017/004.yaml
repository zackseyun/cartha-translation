  terminology: '"Kekejian" tepat untuk הַתּוֹעֵבָה. "Perkara" tepat dalam konteks hukum. "Benar dan terbukti" menyampaikan kedua unsur אֱמֶת dan נָכוֹן dengan idiom Indonesia yang jelas.'
