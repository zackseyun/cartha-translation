base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/004.yaml
  text: and it is reported to you[a], and you hear of it, and you investigate thoroughly, and behold, it is true and certain that this abomination has been done in Israel,
translation:
  language: id
  text: Hal itu diberitahukan kepadamu dan kamu mendengarnya, lalu kamu menyelidikinya dengan saksama. Ternyata perkara itu benar dan terbukti bahwa kekejian ini telah dilakukan di Israel,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֻגַּד לְךָ
  choice: lalu hal itu diberitahukan kepadamu
  rationale: Bentuk Hofal dari נגד menyatakan laporan yang disampaikan kepada pihak yang disapa. Bentuk pasif dipertahankan secara wajar dalam bahasa Indonesia.
- source_word: וְשָׁמָעְתָּ
  choice: dan kamu mendengarnya
  rationale: שׁמע berarti 'mendengar'; pronomina -nya menyatakan objek tersirat dari klausa sebelumnya tanpa menambah isi baru.
- source_word: וְדָרַשְׁתָּ הֵיטֵב
  choice: Kamu harus menyelidikinya dengan saksama
  rationale: Dalam konteks hukum, דרש berarti menyelidiki atau memeriksa, sedangkan הֵיטֵב menegaskan ketelitian penyelidikan. Modal 'harus' mengungkapkan daya instruktif rangkaian hukum dalam bahasa Indonesia.
- source_word: וְהִנֵּה
  choice: Jika ternyata
  rationale: Dalam alur ketentuan hukum ini, הִנֵּה menarik perhatian pada hasil penyelidikan yang didapati. 'Ternyata' alami dalam bahasa Indonesia, sementara 'jika' mempertahankan hubungan kondisional dengan ayat berikutnya.
- source_word: אֱמֶת
  choice: benar
  rationale: Kata ini berfungsi secara predikatif untuk menyatakan bahwa laporan tersebut sesuai dengan fakta.
- source_word: נָכוֹן
  choice: telah dipastikan
  rationale: נָכוֹן menyampaikan makna teguh, terbukti, atau terkonfirmasi; 'telah dipastikan' sesuai dengan konteks pemeriksaan hukum.
- source_word: הַדָּבָר
  choice: perkara itu
  rationale: דָּבָר menunjuk kepada laporan atau kasus yang sedang diperiksa. 'Perkara' cocok dengan konteks yudisial.
- source_word: נֶעֶשְׂתָה
  choice: telah dilakukan
  rationale: Bentuk pasif עשה menyatakan bahwa tindakan tersebut sungguh telah dikerjakan; bentuk pasif dan aspek selesai dipertahankan.
- source_word: הַתּוֹעֵבָה הַזֹּאת
  choice: kekejian ini
  rationale: Istilah 'kekejian' mempertahankan bobot moral-perjanjian yang kuat dari תּוֹעֵבָה tanpa mempersempit jenis pelanggarannya.
- source_word: בְּיִשְׂרָאֵל
  choice: di Israel
  rationale: Frasa ini menempatkan pelanggaran tersebut di tengah komunitas Israel dan diterjemahkan dengan ungkapan Indonesia yang baku.
theological_decisions:
- issue: Rumus peneguhan hukum אֱמֶת נָכוֹן הַדָּבָר
  choice: benar dan perkara itu telah dipastikan
  alternative: perkara itu benar dan terbukti
  rationale: Terjemahan mempertahankan dua unsur Ibrani—kebenaran laporan dan kepastian hasil pemeriksaan—tanpa meleburkannya atau memasukkan tafsiran teologis tambahan.
- issue: Makna evaluatif תּוֹעֵבָה
  choice: kekejian
  alternative: perbuatan yang menjijikkan
  rationale: '''Kekejian'' mempertahankan kecaman moral yang kuat dalam pemakaian kitab Ulangan dan tidak melunakkan penilaian teks.'
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Kalimat dipecah agar rangkaian prosedur hukum mudah dipahami, tetapi urutan laporan, pendengaran, penyelidikan, konfirmasi, dan pelanggaran tetap dipertahankan. Tanda koma penutup mencerminkan bahwa ayat ini berlanjut secara sintaksis ke ayat berikutnya.
