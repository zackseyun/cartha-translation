base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/009.yaml
  text: And you shall come to the Levitical priests and to the judge who is in office in those days[a], and you shall inquire, and they shall declare to you the decision in the case.
translation:
  language: id
  text: Datanglah kepada para imam dari suku Lewi dan kepada hakim yang bertugas pada waktu itu. Tanyakanlah kepada mereka, lalu mereka akan menyampaikan kepadamu putusan atas perkara itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “perkataan/hal penghakiman.” Ungkapan Ibrani ini menunjuk pada putusan hukum yang berwenang.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ
  choice: Datanglah
  rationale: Bentuk perfektum dengan waw dalam rangkaian ketentuan hukum memiliki daya perintah. Bentuk imperatif Indonesia menyampaikan fungsi itu secara alami.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: para imam dari suku Lewi
  rationale: Ungkapan ini mengidentifikasi para imam tersebut sebagai orang Lewi tanpa menyiratkan bahwa semua orang Lewi adalah imam.
- source_word: הַשֹּׁפֵט
  choice: hakim
  rationale: Padanan langsung bagi pejabat yang menjalankan fungsi peradilan dalam konteks hukum ini.
- source_word: אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: yang bertugas pada waktu itu
  rationale: Klausa ini menunjuk kepada pemegang jabatan yang sedang menjalankan tugas pada masa yang bersangkutan, bukan kepada seorang tokoh tertentu.
- source_word: וְדָרַשְׁתָּ
  choice: Tanyakanlah kepada mereka
  rationale: Dalam konteks pengadilan, verba ini berarti meminta keterangan atau putusan dari pihak yang berwenang. Objek 'kepada mereka' dibuat eksplisit secara wajar dari konteks.
- source_word: וְהִגִּידוּ לְךָ
  choice: lalu mereka akan menyampaikan kepadamu
  rationale: Bentuk Hifil dari נגד menunjuk pada pemberitahuan resmi; 'menyampaikan' mempertahankan nuansa formal tanpa terdengar kaku.
- source_word: דְּבַר הַמִּשְׁפָּט
  choice: putusan atas perkara itu
  rationale: Secara harfiah berarti 'perkataan/hal dari penghakiman', tetapi dalam konteks ini menunjuk pada keputusan hukum yang berwenang mengenai perkara yang diajukan.
