  text: And all the people shall hear and fear[a], and shall not act presumptuously again.
translation:
  language: id
  text: Seluruh rakyat akan mendengar dan menjadi takut,[a] dan mereka tidak akan bertindak lancang lagi.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “merasa gentar”.
    reason: Alternatif leksikal untuk וְיִרָאוּ yang mempertahankan rasa takut tanpa menentukan objeknya.
lexical_decisions:
- source_word: וְכָל הָעָם
  choice: Seluruh rakyat
  rationale: Frasa ini secara eksplisit berarti seluruh rakyat. Konjungsi Ibrani dapat diungkapkan secara alami melalui alur kalimat Indonesia tanpa harus diawali 'Dan'.
- source_word: יִשְׁמְעוּ
  choice: akan mendengarnya
  rationale: Kata kerja שמע berarti 'mendengar'. Akhiran '-nya' membuat bahasa Indonesia alami dengan merujuk pada peristiwa atau putusan dalam konteks sebelumnya, tanpa menambahkan objek tertentu yang tidak dinyatakan dalam ayat.
- source_word: וְיִרָאוּ
  choice: dan menjadi takut
  rationale: Kata ירא menyatakan rasa takut yang timbul setelah rakyat mendengar. Terjemahan ini tidak menentukan apakah objek ketakutan itu Allah, hukuman, atau keduanya.
- source_word: וְלֹא יְזִידוּן
  choice: dan mereka tidak akan bertindak lancang
  rationale: Bentuk kata זיד di sini menunjuk pada tindakan yang disengaja, angkuh, dan menentang. 'Bertindak lancang' menyampaikan perilaku pembangkangan yang kurang ajar, bukan sekadar rasa bangga di dalam hati.
- source_word: עוֹד
  choice: lagi
  rationale: Kata ini menyatakan bahwa tindakan serupa tidak akan dilakukan kembali atau berlanjut.
theological_decisions:
- issue: Objek dan sifat rasa takut yang dihasilkan oleh pelaksanaan hukuman
  choice: menjadi takut, tanpa menyebut objeknya
  alternative: takut kepada TUHAN; takut terhadap hukuman pengadilan
  rationale: Teks Ibrani hanya mengatakan 'dan takut' tanpa objek eksplisit. Terjemahan mempertahankan ketaksaan antara takut kepada Allah, takut terhadap hukuman, atau keduanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang ringkas dan bermartabat. 'Rakyat' dipilih untuk הָעָם dalam konteks komunitas Israel, sedangkan 'bertindak lancang' mempertahankan unsur kesengajaan, keangkuhan, dan pembangkangan.
