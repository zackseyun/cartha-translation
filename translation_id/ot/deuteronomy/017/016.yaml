id: DEU.17.16
reference: Deuteronomy 17:16
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: רַק֮ לֹא יַרְבֶּה לּ֣/וֹ סוּסִים֒ וְ/לֹֽא יָשִׁ֤יב אֶת הָ/עָם֙ מִצְרַ֔יְמָ/ה לְמַ֖עַן הַרְבּ֣וֹת ס֑וּס וַֽ/יהוָה֙ אָמַ֣ר לָ/כֶ֔ם לֹ֣א תֹסִפ֗וּ/ן לָ/שׁ֛וּב בַּ/דֶּ֥רֶךְ הַ/זֶּ֖ה עֽוֹד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/016.yaml
  text: Only[a], he must not multiply horses for himself, nor cause the people to return to Egypt in order to multiply horses, since Yahweh has said to you[c][b], ‘You must never return again by this way.’
translation:
  language: id
  text: Namun, ia tidak boleh memperbanyak kuda bagi dirinya sendiri[a] dan tidak boleh membawa rakyat kembali ke Mesir[b] untuk memperbanyak kuda, sebab Yahweh telah berfirman kepada kalian, “Kalian tidak boleh kembali lagi melalui jalan ini.”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “mengumpulkan banyak kuda bagi dirinya sendiri.” Kata kerja Ibrani berarti membuat menjadi banyak atau menambah jumlah.
    reason: lexical_alternative
  - marker: b
    text: 'Secara lebih harfiah, “menyebabkan rakyat kembali ke Mesir.” Bentuk kata kerjanya bersifat kausatif: raja dilarang menyebabkan mereka kembali.'
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “Kalian tidak boleh menambah untuk kembali lagi melalui jalan ini,” sebuah ungkapan Ibrani yang berarti bahwa mereka tidak boleh kembali lagi melalui jalan tersebut.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Namun
  rationale: Dalam konteks ketentuan yang membatasi raja, רַק memperkenalkan pembatasan yang berlawanan dengan hak atau tindakan yang mungkin diambil; “Namun” menyampaikan fungsi wacananya secara alami dalam bahasa Indonesia.
- source_word: יַרְבֶּה לּוֹ סוּסִים
  choice: tidak boleh memperbanyak kuda bagi dirinya sendiri
  rationale: Bentuk Hifil dari רבה menyatakan membuat menjadi banyak atau menambah jumlah. Ungkapan ini mempertahankan hubungan leksikal dengan הַרְבּוֹת סוּס kemudian dalam ayat serta nuansa kepentingan diri pada לּוֹ.
- source_word: וְלֹא יָשִׁיב אֶת הָעָם מִצְרַיְמָה
  choice: dan tidak boleh membawa rakyat kembali ke Mesir
  rationale: Bentuk Hifil dari שוב bersifat kausatif. “Membawa ... kembali” merupakan padanan Indonesia yang alami dan tetap menunjukkan bahwa raja menyebabkan kepulangan rakyat.
- source_word: לְמַעַן הַרְבּוֹת סוּס
  choice: untuk memperbanyak kuda
  rationale: לְמַעַן menandai tujuan, sedangkan pengulangan “memperbanyak kuda” mempertahankan kaitan leksikal dengan larangan sebelumnya.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”, sesuai bukti teks sumber dan keputusan istilah ilahi yang diberikan.
- source_word: לֹא תֹסִפוּן לָשׁוּב
  choice: Kalian tidak boleh kembali lagi
  rationale: Konstruksi יסף dengan infinitif menyatakan penambahan atau pengulangan tindakan; dalam konteks larangan, padanan alami ialah “tidak boleh kembali lagi”.
- source_word: בַּדֶּרֶךְ הַזֶּה
  choice: melalui jalan ini
  rationale: דֶּרֶךְ dapat berarti jalan atau rute. “Melalui jalan ini” dekat dengan bentuk Ibrani dan wajar dalam bahasa Indonesia.
- source_word: עוֹד
  choice: lagi
  rationale: Kata ini menegaskan bahwa tindakan kembali tidak boleh diulangi.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama diri ilahi tanpa menggantinya dengan gelar.
- issue: Cakupan larangan kembali ke Mesir
  choice: Mempertahankan bentuk sapaan jamak “kalian” dan tidak mempersempit larangan hanya kepada raja
  alternative: Menjadikan larangan itu hanya berlaku kepada raja
  rationale: Kata kerja תֹסִפוּן berbentuk orang kedua jamak, sehingga perkataan Yahweh dialamatkan kepada umat secara jamak; terjemahan tidak menyelesaikan lebih jauh bagaimana larangan umum ini diterapkan dalam konteks ketentuan bagi raja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Ia” merujuk kepada raja dari konteks sebelumnya; “rakyat” mempertahankan הָעָם sebagai kelompok Israel. Sapaan “kalian” dipakai untuk bentuk orang kedua jamak לָכֶם dan תֹסִפוּן. Struktur pengulangan “memperbanyak kuda” dipertahankan demi kohesi leksikal.
