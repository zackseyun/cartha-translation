  text: לְ/בִלְתִּ֤י רוּם לְבָב/וֹ֙ מֵֽ/אֶחָ֔י/ו וּ/לְ/בִלְתִּ֛י ס֥וּר מִן הַ/מִּצְוָ֖ה יָמִ֣ין וּ/שְׂמֹ֑אול לְמַעַן֩ יַאֲרִ֨יךְ יָמִ֧ים עַל מַמְלַכְתּ֛/וֹ ה֥וּא וּ/בָנָ֖י/ו בְּ/קֶ֥רֶב יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/020.yaml
  text: so that his heart may not be lifted up above his brothers[a], and so that he may not turn aside from the commandment to the right or to the left, in order that he may prolong his days in his kingdom, he and his sons, in the midst of Israel.
translation:
  language: id
  text: supaya hatinya tidak menjadi angkuh melebihi saudara-saudaranya[a] dan supaya ia tidak menyimpang dari perintah itu ke kanan atau ke kiri, agar ia dan putra-putranya lama memerintah atas kerajaannya di tengah-tengah Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "sesama orang Israel." Teks Ibrani berbunyi "saudara-saudaranya," dengan memakai bahasa kekerabatan perjanjian.
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבִלְתִּי רוּם לְבָבוֹ
  choice: supaya hatinya tidak meninggikan diri
  rationale: Mengungkapkan tujuan pencegahan secara wajar dalam bahasa Indonesia sekaligus mempertahankan idiom Ibrani tentang hati dan makna kesombongan.
- source_word: מֵאֶחָיו
  choice: di atas saudara-saudaranya
  rationale: Mempertahankan bahasa kekerabatan perjanjian dan gagasan meninggikan diri melebihi sesama; cakupan sebagai sesama orang Israel dijelaskan dalam catatan kaki.
- source_word: סוּר מִן הַמִּצְוָה
  choice: menyimpang dari perintah itu
  rationale: Kata 'menyimpang' secara alami menyampaikan tindakan meninggalkan jalan ketaatan, sedangkan bentuk tertentu pada nomina ditampilkan sebagai 'perintah itu' dalam konteks hukum raja.
- source_word: יָמִין וּשְׂמֹאול
  choice: baik ke kanan maupun ke kiri
  rationale: Mempertahankan metafora Ibrani tentang penyimpangan ke salah satu dari dua arah dengan ungkapan Indonesia yang alami.
- source_word: לְמַעַן
  choice: sehingga
  rationale: Dalam konteks ini menandai hasil atau tujuan yang diharapkan dari ketaatan tanpa memaksakan pembedaan yang tidak dinyatakan tegas.
- source_word: יַאֲרִיךְ יָמִים עַל מַמְלַכְתּוֹ
  choice: dapat memerintah untuk waktu yang lama
  rationale: Menyampaikan secara alami idiom 'memperpanjang hari-hari' dalam kaitannya dengan masa pemerintahan; frasa עַל מַמְלַכְתּוֹ menunjuk pada keberlangsungan kedudukannya sebagai raja.
- source_word: הוּא וּבָנָיו
  choice: ia dan anak-anaknya
  rationale: Dalam konteks suksesi dinasti, בָּנִים dapat merujuk pada anak-anak laki-laki atau penerus keturunan; 'anak-anaknya' alami dalam bahasa Indonesia dan tidak menghapus fokus dinasti.
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: di tengah-tengah Israel
  rationale: Mempertahankan idiom ruang Ibrani dan latar komunitas perjanjian.
theological_decisions:
- issue: Bahasa kekerabatan dalam hukum tentang raja
  choice: saudara-saudaranya
  alternative: sesama orang Israel
  rationale: Teks Ibrani secara harfiah memakai 'saudara-saudaranya' sebagai bahasa kekerabatan perjanjian. Bentuk itu dipertahankan dalam teks, sementara cakupannya dijelaskan dalam catatan kaki.
- issue: Ungkapan janji dinasti
  choice: ia dan anak-anaknya
  alternative: ia dan anak-anak lelakinya
  rationale: Kata Ibrani secara bentuk berarti 'anak-anak laki-lakinya', tetapi dalam konteks ini menunjuk pada kelanjutan garis kerajaan. Bahasa Indonesia 'anak-anaknya' menyampaikan keturunan langsung secara alami tanpa memperluasnya secara eksplisit menjadi semua keturunan.
- issue: Hubungan tujuan dan hasil pada לְמַעַן
  choice: sehingga
  alternative: supaya
  rationale: Partikel tersebut dapat menyatakan tujuan atau hasil yang dimaksud. 'Sehingga' mempertahankan keluwesan itu dan menghindari penegasan kausal-teologis yang melampaui teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Struktur ganda 'supaya ... dan supaya ...' mengikuti alur Ibrani, sedangkan idiom tentang panjangnya hari dalam kerajaan dialihkan secara alami menjadi lamanya memerintah.
