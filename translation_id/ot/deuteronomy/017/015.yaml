  terminology: “Yahweh, Allahmu,” “raja,” dan bahasa kekerabatan “saudara-saudaramu/saudaramu” tepat. “Orang asing” mempertahankan kontras dengan anggota umat tanpa memasukkan penafsiran denominatif.
