source:
  edition: WLC
  text: שׂ֣וֹם תָּשִׂ֤ים עָלֶ֨י/ךָ֙ מֶ֔לֶךְ אֲשֶׁ֥ר יִבְחַ֛ר יְהוָ֥ה אֱלֹהֶ֖י/ךָ בּ֑/וֹ מִ/קֶּ֣רֶב אַחֶ֗י/ךָ תָּשִׂ֤ים עָלֶ֨י/ךָ֙ מֶ֔לֶךְ לֹ֣א תוּכַ֗ל לָ/תֵ֤ת עָלֶ֨י/ךָ֙ אִ֣ישׁ נָכְרִ֔י אֲשֶׁ֥ר לֹֽא אָחִ֖י/ךָ הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/015.yaml
  text: You shall surely set over yourself a king whom Yahweh your God chooses[a]. From among your brothers you shall set a king over yourself; you may not put over yourself a foreigner[b], one who is not your brother.
translation:
  language: id
  text: Engkau harus mengangkat seorang raja untuk memerintah atasmu, yaitu raja yang dipilih Yahweh, Allahmu.[a] Dari antara saudara-saudaramu engkau harus mengangkat seorang raja untuk memerintah atasmu. Engkau tidak boleh mengangkat orang asing untuk memerintah atasmu,[b] yaitu orang yang bukan saudaramu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani dapat juga diterjemahkan, “yang akan dipilih Yahweh, Allahmu.”
    reason: alternative_reading
  - marker: b
    text: “Orang asing” berarti orang yang bukan bagian dari umat Israel, sebagaimana dijelaskan oleh frasa berikutnya, “yang bukan saudaramu.”
    reason: lexical_clarification
lexical_decisions:
- source_word: שׂוֹם תָּשִׂים
  choice: harus mengangkat
  rationale: Gabungan infinitif absolut dan bentuk verba finit menegaskan perintah. Dalam bahasa Indonesia hukum yang alami, penegasan itu disampaikan dengan “harus”, sedangkan “mengangkat” sesuai dengan tindakan menetapkan seseorang sebagai raja.
- source_word: עָלֶיךָ
  choice: atasmu
  rationale: Mempertahankan gambaran pemerintahan “atas” umat serta sapaan tunggal kolektif kepada Israel.
- source_word: מֶלֶךְ
  choice: raja
  rationale: Padanan langsung dan lazim untuk jabatan laki-laki yang dimaksud dalam konteks ini.
- source_word: אֲשֶׁר יִבְחַר יְהוָה אֱלֹהֶיךָ בּוֹ
  choice: yaitu orang yang dipilih Yahweh, Allahmu
  rationale: Klausa relatif mengidentifikasi calon raja berdasarkan pilihan Yahweh. Bentuk Indonesia ini alami dan tidak memaksakan apakah tindakan memilih dipandang kini atau kelak.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH, bukan menggantinya dengan gelar.
- source_word: מִקֶּרֶב אַחֶיךָ
  choice: Dari antara saudara-saudaramu
  rationale: Mempertahankan bahasa kekerabatan Ibrani sambil memakai bentuk jamak Indonesia yang alami; dalam konteks perjanjian, ungkapan ini menunjuk sesama anggota Israel.
- source_word: לֹא תוּכַל לָתֵת
  choice: Engkau tidak boleh mengangkat
  rationale: Secara harfiah berarti “engkau tidak dapat menempatkan”, tetapi dalam konteks hukum menyatakan larangan; “tidak boleh” menyampaikan daya hukumnya secara idiomatis.
- source_word: אִישׁ נָכְרִי
  choice: seorang asing
  rationale: Menunjuk seorang laki-laki dari luar umat. “Seorang asing” alami dalam bahasa Indonesia, sementara konteks jabatan raja dan klausa berikutnya mempertahankan referen personalnya.
- source_word: אֲשֶׁר לֹא אָחִיךָ הוּא
  choice: yang bukan saudaramu
  rationale: Mempertahankan penjelasan sumber dalam bahasa kekerabatan dan kontras dengan “saudara-saudaramu” sebelumnya.
theological_decisions:
- issue: Penerjemahan nama perjanjian יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama pribadi ilahi YHWH; transliterasi mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Bahasa kekerabatan אַחֶיךָ / אָחִיךָ
  choice: saudara-saudaramu / saudaramu
  alternative: sesama orang Israel / sebangsamu
  rationale: Pilihan utama mempertahankan metafora kekerabatan dan ketegangan antara anggota umat dan orang asing. Catatan menjelaskan cakupan kolektifnya.
- issue: Hubungan pilihan ilahi dan pengangkatan manusia
  choice: mempertahankan kedua tindakan secara berurutan
  alternative: menggabungkannya sebagai pengangkatan langsung oleh Allah
  rationale: Ayat ini menyandingkan pilihan Yahweh dengan kewajiban umat mengangkat raja; terjemahan tidak menyamakan atau menghapus salah satu tindakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “engkau” dipertahankan karena bentuk tunggal Ibrani menyapa Israel sebagai satu umat. Pengulangan “mengangkat seorang raja atasmu” sengaja dipertahankan untuk mencerminkan penekanan dan struktur sumber.
