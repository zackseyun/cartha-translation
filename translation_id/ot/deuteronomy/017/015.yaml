revisions:
- from: Engkau harus mengangkat seorang raja atasmu, yaitu orang yang dipilih Yahweh, Allahmu.[a] Dari antara saudara-saudaramu haruslah engkau mengangkat seorang raja atasmu. Engkau tidak boleh mengangkat atasmu seorang asing,[b] yang bukan saudaramu.
  to: Engkau harus mengangkat seorang raja untuk memerintah atasmu, yaitu raja yang dipilih Yahweh, Allahmu.[a] Dari antara saudara-saudaramu engkau harus mengangkat seorang raja untuk memerintah atasmu. Engkau tidak boleh mengangkat orang asing untuk memerintah atasmu,[b] yaitu orang yang bukan saudaramu.
  rationale: Revisi ini memperbaiki kelancaran bahasa Indonesia dengan memakai “untuk memerintah atasmu” bagi penempatan raja atas Israel. Semua unsur utama sumber—pilihan Yahweh, asal dari antara saudara, larangan terhadap orang asing, serta penjelasan “bukan saudaramu”—dipertahankan. Catatan kaki tetap berjangkar pada unsur yang relevan dan mempertahankan kemungkinan bentuk masa depan pada klausa pilihan Yahweh.
