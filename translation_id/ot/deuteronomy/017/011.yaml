id: DEU.17.11
reference: Deuteronomy 17:11
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עַל פִּ֨י הַ/תּוֹרָ֜ה אֲשֶׁ֣ר יוֹר֗וּ/ךָ וְ/עַל הַ/מִּשְׁפָּ֛ט אֲשֶׁר יֹאמְר֥וּ לְ/ךָ֖ תַּעֲשֶׂ֑ה לֹ֣א תָס֗וּר מִן הַ/דָּבָ֛ר אֲשֶׁר יַגִּ֥ידֽוּ לְ/ךָ֖ יָמִ֥ין וּ/שְׂמֹֽאל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/011.yaml
  text: According to the instruction that they give you[a], and according to the judgment that they tell you, you shall do; you shall not turn aside from the word that they declare to you[b], to the right or to the left.
translation:
  language: id
  text: Hendaklah kamu bertindak sesuai dengan pengajaran yang mereka berikan kepadamu[a] dan sesuai dengan keputusan yang mereka sampaikan kepadamu. Jangan menyimpang dari perkataan yang mereka nyatakan kepadamu[b], baik ke kanan maupun ke kiri.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau “hukum” atau “ajaran” (Ibrani: torah).'
    reason: lexical_alternative
  - marker: b
    text: Atau “hal” atau “putusan” untuk “perkataan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  choice: sesuai dengan
  rationale: Ungkapan idiomatis ini berarti bertindak menurut atau selaras dengan sesuatu; 'sesuai dengan' alami dalam bahasa hukum Indonesia.
- source_word: הַתּוֹרָה
  choice: pengajaran
  rationale: Dalam konteks pengadilan ini, torah menunjuk pada arahan berwenang yang diberikan dalam perkara tersebut. 'Pengajaran' mempertahankan cakupan makna tanpa membatasinya pada undang-undang tertulis.
- source_word: אֲשֶׁר יוֹרוּךָ
  choice: yang mereka berikan kepadamu
  rationale: Bentuk Hifil dari ירה berarti mengajar atau memberi arahan. Bersama 'pengajaran', frasa ini menghasilkan bahasa Indonesia yang alami tanpa pengulangan akar kata.
- source_word: הַמִּשְׁפָּט
  choice: keputusan
  rationale: Dalam konteks yudisial, mishpat adalah keputusan atau putusan hukum. 'Keputusan' jelas bagi pembaca modern dan tetap formal.
- source_word: אֲשֶׁר יֹאמְרוּ לְךָ
  choice: yang mereka sampaikan kepadamu
  rationale: '''Sampaikan'' mengungkapkan tindakan memberitahukan keputusan secara resmi dan alami dalam bahasa Indonesia.'
- source_word: תַּעֲשֶׂה
  choice: Hendaklah kamu bertindak
  rationale: Bentuk imperfek berfungsi sebagai kewajiban. 'Hendaklah' mempertahankan nada perintah hukum, sedangkan 'bertindak' secara alami merangkum pelaksanaan pengajaran dan keputusan.
- source_word: לֹא תָסוּר
  choice: Jangan menyimpang
  rationale: Larangan ini menuntut agar orang tidak beralih atau menyimpang; pilihan ini jelas dan cocok dengan gambaran arah yang menyusul.
- source_word: הַדָּבָר
  choice: perkataan
  rationale: Davar dapat berarti perkataan, hal, atau perkara. 'Perkataan' mempertahankan bentuk tunggal dan sifat verbal dari pernyataan berwenang itu tanpa menutup alternatif kontekstual.
- source_word: אֲשֶׁר יַגִּידוּ לְךָ
  choice: yang mereka nyatakan kepadamu
  rationale: Bentuk Hifil dari נגד berarti menyatakan atau memberitahukan. 'Nyatakan' mempertahankan nuansa resmi konteks pengadilan.
- source_word: יָמִין וּשְׂמֹאל
  choice: baik ke kanan maupun ke kiri
  rationale: Ini adalah ungkapan tetap untuk penyimpangan ke arah mana pun; bentuk Indonesia ini alami dan mempertahankan metaforanya.
theological_decisions:
- issue: Cakupan ketaatan kepada kewenangan imam dan hakim
  choice: Ayat diterjemahkan sebagai perintah untuk menaati pengajaran dan keputusan hukum berwenang dalam perkara yang sedang ditangani.
  alternative: Membacanya sebagai pemberian kewenangan mutlak atau ketidakmungkinan salah kepada lembaga keagamaan pada masa kemudian.
  rationale: Konteksnya adalah tata peradilan perjanjian Israel. Terjemahan mempertahankan tuntutan ketaatan yang kuat tanpa memasukkan klaim kelembagaan yang tidak dinyatakan oleh teks Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Hendaklah' mempertahankan nada hukum tanpa terdengar kuno; istilah 'pengajaran', 'keputusan', dan 'menyimpang' mudah dipahami pembaca umum. Semua penanda catatan kaki dicantumkan dalam teks utama.
