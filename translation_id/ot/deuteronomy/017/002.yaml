  text: כִּֽי יִמָּצֵ֤א בְ/קִרְבְּ/ךָ֙ בְּ/אַחַ֣ד שְׁעָרֶ֔י/ךָ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ אִ֣ישׁ אוֹ אִשָּׁ֗ה אֲשֶׁ֨ר יַעֲשֶׂ֧ה אֶת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָֽה אֱלֹהֶ֖י/ךָ לַ/עֲבֹ֥ר בְּרִיתֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/002.yaml
  text: If there is found among you[a], within one of your gates that Yahweh your God is giving you, a man or a woman who does what is evil in the eyes of Yahweh your God by transgressing his covenant[b],
translation:
  language: id
  text: Jika di tengah-tengahmu, di salah satu kota[a] yang Yahweh, Allahmu, berikan kepadamu, didapati seorang laki-laki atau perempuan yang melakukan apa yang jahat di mata Yahweh, Allahmu, dengan melanggar perjanjian-Nya[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “di salah satu gerbangmu.” “Gerbang” di sini dapat merujuk kepada salah satu kota atau permukimanmu.'
    reason: lexical_alternative
  - marker: b
    text: 'Dapat juga diterjemahkan: “dengan melanggar perjanjian-Nya” atau “untuk melanggar perjanjian-Nya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יִמָּצֵא
  choice: Jika ... didapati
  rationale: Mencerminkan rumusan syarat dalam hukum kasuistik serta bentuk pasif Niphal, dengan susunan yang wajar dalam bahasa Indonesia.
- source_word: בְקִרְבְּךָ
  choice: di antara kamu
  rationale: Mengungkapkan keberadaan dalam lingkungan komunitas perjanjian secara alami.
- source_word: בְאַחַד שְׁעָרֶיךָ
  choice: di salah satu kota
  rationale: Secara harfiah berarti 'di salah satu gerbangmu', tetapi dalam konteks Ulangan, 'gerbang' berfungsi secara metonimis untuk kota atau wilayah komunitas yang berpusat pada gerbangnya.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: yang diberikan Yahweh, Allahmu, kepadamu
  rationale: Partisipel Ibrani dapat menyatakan tindakan yang sedang atau secara karakteristik dilakukan; bentuk Indonesia ini alami dan tetap mempertahankan formula pemberian tanah/kota oleh Yahweh.
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: seorang laki-laki atau perempuan
  rationale: Mempertahankan pasangan gender yang disebut secara eksplisit dalam teks sumber.
- source_word: אֲשֶׁר יַעֲשֶׂה אֶת הָרַע
  choice: yang melakukan apa yang jahat
  rationale: Mengalihkan idiom Ibrani 'melakukan yang jahat' ke dalam ungkapan Indonesia yang jelas tanpa mengurangi bobot moralnya.
- source_word: בְעֵינֵי יְהוָה אֱלֹהֶיךָ
  choice: di mata Yahweh, Allahmu
  rationale: Mempertahankan metafora evaluatif Ibrani yang juga alami dalam bahasa Indonesia.
- source_word: לַעֲבֹר בְּרִיתוֹ
  choice: dengan melanggar perjanjian-Nya
  rationale: Infinitif ini menjelaskan cara atau wujud perbuatan jahat tersebut. 'Melanggar' mempertahankan gagasan pelanggaran perjanjian tanpa menentukan ketentuan tertentu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi sesuai bentuk nama diri dalam teks sumber.
theological_decisions:
- issue: Cakupan pelanggaran perjanjian
  choice: dengan melanggar perjanjian-Nya
  alternative: sehingga mengingkari perjanjian-Nya; untuk melanggar perjanjian-Nya
  rationale: Ayat ini menyatakan pelanggaran perjanjian secara umum, sementara pelanggaran konkretnya dijelaskan pada ayat berikutnya. Terjemahan tidak mempersempitnya berdasarkan sistem teologis tertentu.
- issue: Hubungan sintaksis infinitif לַעֲבֹר
  choice: 'Dipahami sebagai penjelasan cara atau wujud perbuatan jahat: ''dengan melanggar''.'
  alternative: 'Dipahami sebagai tujuan atau akibat: ''untuk melanggar'' atau ''sehingga melanggar''.'
  rationale: Konstruksi Ibrani memungkinkan nuansa yang berdekatan. Pilihan utama paling alami dalam konteks hukum Indonesia, sedangkan alternatif dicatat agar ambiguitas fungsi infinitif tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat mempertahankan bentuk syarat hukum dan ketegangan menuju kelanjutan pada ayat berikutnya. Koma setelah 'Yahweh' menandai aposisi 'Allahmu'. Semua penanda catatan kaki hadir dalam teks utama.
