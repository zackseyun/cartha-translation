  text: וְ/הָיְתָ֣ה עִמּ֔/וֹ וְ/קָ֥רָא ב֖/וֹ כָּל יְמֵ֣י חַיָּ֑י/ו לְמַ֣עַן יִלְמַ֗ד לְ/יִרְאָה֙ אֶת יְהוָ֣ה אֱלֹהָ֔י/ו לִ֠/שְׁמֹר אֶֽת כָּל דִּבְרֵ֞י הַ/תּוֹרָ֥ה הַ/זֹּ֛את וְ/אֶת הַ/חֻקִּ֥ים הָ/אֵ֖לֶּה לַ/עֲשֹׂתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/019.yaml
  text: And it shall be with him[a], and he shall read in it all the days of his life, so that he may learn to fear Yahweh his God, to keep all the words of this law and these statutes[c][b], to do them.
translation:
  language: id
  text: Kitab itu harus ada padanya, dan ia harus membacanya seumur hidupnya, supaya ia belajar takut akan Yahweh, Allahnya,[a] memegang teguh segala perkataan hukum ini dan ketetapan-ketetapan ini, serta melaksanakannya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menghormati Yahweh, Allahnya.” Ungkapan Ibrani juga mencakup rasa gentar, hormat, dan ketundukan yang taat.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “membaca di dalamnya”; yang dimaksud ialah kitab atau salinan hukum itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיְתָה עִמּוֹ
  choice: Kitab itu harus tetap ada padanya
  rationale: Bentuk feminin merujuk kembali kepada salinan hukum pada ayat sebelumnya. Ungkapan ini menyatakan bahwa salinan tersebut terus berada dalam kepemilikan atau jangkauan raja; 'tetap ada padanya' alami dalam bahasa Indonesia dan mempertahankan gagasan keberlanjutan.
- source_word: וְקָרָא בוֹ
  choice: ia harus membacanya
  rationale: Secara harfiah, preposisi בּוֹ berarti 'di dalamnya', tetapi dalam idiom membaca bahasa Indonesia, 'membacanya' paling alami dan tetap menyampaikan bahwa raja membaca isi salinan itu.
- source_word: כָּל יְמֵי חַיָּיו
  choice: seumur hidupnya
  rationale: Ungkapan Indonesia ini secara tepat dan alami menyatakan durasi sepanjang seluruh hidup.
- source_word: לְמַעַן יִלְמַד
  choice: supaya ia belajar
  rationale: Menyampaikan hubungan tujuan yang dinyatakan oleh לְמַעַן tanpa menambah makna.
- source_word: לְיִרְאָה אֶת יְהוָה אֱלֹהָיו
  choice: takut akan Yahweh, Allahnya
  rationale: '''Takut akan'' mempertahankan keluasan ירא yang mencakup gentar, hormat, dan ketundukan dalam konteks perjanjian. Nama ilahi ditransliterasikan sebagai ''Yahweh''.'
- source_word: לִשְׁמֹר
  choice: dengan menaati
  rationale: Dalam konteks hukum perjanjian, שׁמר berarti memelihara atau menaati. 'Dengan menaati' menghubungkan rasa takut akan Yahweh dengan tindakan konkret secara alami dalam bahasa Indonesia.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: segala perkataan hukum ini
  rationale: תּוֹרָה di sini menunjuk pada hukum atau pengajaran tertulis yang harus disalin dan dibaca oleh raja. 'Hukum' transparan bagi pembaca umum, sedangkan 'segala perkataan' mempertahankan bentuk jamak דִּבְרֵי.
- source_word: הַחֻקִּים הָאֵלֶּה
  choice: ketetapan-ketetapan ini
  rationale: Padanan legal yang lazim dan jelas untuk חֻקִּים, tanpa menyamakan seluruhnya dengan istilah תּוֹרָה.
- source_word: לַעֲשֹׂתָם
  choice: serta melakukannya
  rationale: Mempertahankan makna konkret verba עשה, 'melakukan', dan menghindari penghilangan penekanan terakhir pada pelaksanaan hukum.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian YHWH. 'Yahweh' mempertahankan nama tersebut secara langsung, sedangkan 'TUHAN' adalah penggantian tradisional.
- issue: Nuansa ירא dalam konteks perjanjian
  choice: takut akan
  alternative: hormat kepada
  rationale: '''Takut akan'' mempertahankan ketegangan makna antara rasa gentar, hormat, dan ketundukan yang taat; ''hormat'' saja dapat mempersempit daya ungkap teks.'
- issue: Hubungan antara לִשְׁמֹר dan לַעֲשֹׂתָם
  choice: dengan menaati ... serta melakukannya
  alternative: untuk memelihara ... untuk melakukannya
  rationale: 'Terjemahan ini mempertahankan kedua unsur: menjaga atau menaati ketentuan dan benar-benar melaksanakannya, tanpa melebur keduanya menjadi satu gagasan.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat. Struktur tujuan dan pengulangan legal dipertahankan, tetapi idiom Ibrani disesuaikan secukupnya agar jelas bagi pembaca umum.
