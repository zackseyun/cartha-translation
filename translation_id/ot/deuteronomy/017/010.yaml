  text: וְ/עָשִׂ֗יתָ עַל פִּ֤י הַ/דָּבָר֙ אֲשֶׁ֣ר יַגִּ֣ידֽוּ לְ/ךָ֔ מִן הַ/מָּק֣וֹם הַ/ה֔וּא אֲשֶׁ֖ר יִבְחַ֣ר יְהוָ֑ה וְ/שָׁמַרְתָּ֣ לַ/עֲשׂ֔וֹת כְּ/כֹ֖ל אֲשֶׁ֥ר יוֹרֽוּ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/010.yaml
  text: You shall act according to the word that they declare to you from that place which Yahweh will choose[a], and you shall be careful to do according to all that they instruct you.
translation:
  language: id
  text: Kamu harus bertindak sesuai dengan keputusan yang mereka sampaikan kepadamu dari tempat yang akan dipilih Yahweh,[a] dan kamu harus berhati-hati untuk melakukan sesuai dengan segala yang mereka ajarkan kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sesuai dengan perkataan yang mereka sampaikan kepadamu.” Kata Ibrani דָּבָר dapat berarti “perkataan”, “perkara”, atau “keputusan” dalam konteks pengadilan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ
  choice: Kamu harus bertindak
  rationale: Kata עשה bermakna luas, ‘melakukan, membuat, bertindak’. Dalam konteks hukum dan bersama עַל־פִּי הַדָּבָר, ‘bertindak’ menghasilkan bahasa Indonesia yang alami serta mempertahankan daya wajibnya.
- source_word: עַל פִּי הַדָּבָר
  choice: sesuai dengan keputusan
  rationale: Ungkapan עַל־פִּי berarti ‘menurut/sesuai dengan’ atau ‘berdasarkan wewenang’. דָּבָר dapat berarti ‘perkataan, perkara, keputusan’; konteks pengadilan mendukung ‘keputusan’ sebagai pernyataan resmi yang berwenang.
- source_word: יַגִּידוּ לְךָ
  choice: yang mereka sampaikan kepadamu
  rationale: Bentuk Hifil dari נגד berarti ‘memberitahukan, menyatakan’. ‘Sampaikan’ jelas dan wajar dalam bahasa Indonesia, sekaligus sesuai dengan penyampaian keputusan resmi.
- source_word: מִן הַמָּקוֹם הַהוּא אֲשֶׁר יִבְחַר יְהוָה
  choice: dari tempat yang akan dipilih Yahweh
  rationale: Terjemahan ini mempertahankan acuan pada tempat pusat yang akan dipilih Allah. Bentuk יִבְחַר secara wajar bernuansa masa depan dalam konteks Ulangan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan dengan transliterasi ‘Yahweh’, bukan diganti dengan suatu gelar.
- source_word: וְשָׁמַרְתָּ לַעֲשׂוֹת
  choice: kamu harus dengan saksama melakukan
  rationale: Konstruksi שׁמר dengan infinitif menyatakan ketaatan yang dijaga dengan penuh perhatian. ‘Dengan saksama melakukan’ menyampaikan unsur ketelitian tanpa menjadi kaku.
- source_word: כְּכֹל אֲשֶׁר
  choice: segala yang
  rationale: Frasa ini menandai kesesuaian menyeluruh dengan petunjuk yang diberikan. ‘Segala yang’ ringkas dan alami dalam konstruksi Indonesia ini.
- source_word: יוֹרוּךָ
  choice: mereka arahkan kepadamu
  rationale: Bentuk Hifil dari ירה dapat berarti ‘mengajar, memberi petunjuk, mengarahkan’, khususnya dalam ranah hukum. ‘Arahkan’ mempertahankan sifat praktis dan berwenang dari petunjuk tersebut.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama ilahi secara langsung. ‘Yahweh’ mempertahankan nama pribadi perjanjian tanpa menggantinya dengan gelar.
- issue: Cakupan wewenang keputusan para imam dan hakim
  choice: Menerjemahkan tuntutan untuk menaati seluruh arahan tanpa menambahkan batasan atau klaim kelembagaan
  alternative: Memperluas ayat menjadi dukungan eksplisit bagi suatu lembaga keagamaan tertentu
  rationale: Ayat dalam konteksnya menuntut ketaatan pada keputusan pengadilan pusat yang ditetapkan dalam perikop, tetapi tidak menyebut lembaga denominasi atau penerus historis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina ‘kamu’ mempertahankan sapaan orang kedua tunggal kepada Israel sebagai pihak perjanjian. Istilah ‘keputusan’ dipilih demi kejelasan konteks hukum, sementara alternatif yang lebih harfiah dicatat dalam catatan kaki.
