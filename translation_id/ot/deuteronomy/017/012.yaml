  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָ/אִ֞ישׁ אֲשֶׁר יַעֲשֶׂ֣ה בְ/זָד֗וֹן לְ/בִלְתִּ֨י שְׁמֹ֤עַ אֶל הַ/כֹּהֵן֙ הָ/עֹמֵ֞ד לְ/שָׁ֤רֶת שָׁם֙ אֶת יְהוָ֣ה אֱלֹהֶ֔י/ךָ א֖וֹ אֶל הַ/שֹּׁפֵ֑ט וּ/מֵת֙ הָ/אִ֣ישׁ הַ/ה֔וּא וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/יִּשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/012.yaml
  text: But the man who acts presumptuously by not listening to the priest who stands there to minister before Yahweh your God[a], or to the judge—that man shall die[c][b]. So you shall purge the evil from Israel.
translation:
  language: id
  text: Namun, orang yang dengan lancang[a] tidak mau mendengarkan[b] imam yang berdiri di sana untuk melayani Yahweh[c], Allahmu, atau hakim, orang itu harus mati. Dengan demikian, kamu harus menyingkirkan kejahatan dari Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bertindak dengan kelancangan”; dapat juga diterjemahkan “bertindak dengan angkuh” atau “bertindak dengan sengaja dan menantang.”
    reason: lexical_alternative
  - marker: b
    text: Atau “tidak mau mengindahkan” atau “tidak mau menaati.” Kata Ibrani yang berarti “mendengarkan” dalam konteks hukum sering mencakup pengertian mengindahkan dan menaati.
    reason: lexical_alternative
  - marker: c
    text: “Yahweh” adalah transliterasi nama ilahi יהוה (YHWH), yang secara tradisional sering diterjemahkan “TUHAN.”
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָאִישׁ
  choice: Namun, orang
  rationale: Kata penghubung וְ melanjutkan ketentuan sebelumnya dengan nuansa kontras terhadap kewajiban menaati keputusan. אִישׁ menunjuk seorang pelanggar, tetapi dalam bahasa Indonesia 'orang' lebih alami dan tidak menghapus ketunggalannya.
- source_word: יַעֲשֶׂה בְזָדוֹן
  choice: dengan lancang
  rationale: Ungkapan ini menggambarkan tindakan yang disengaja, angkuh, dan menantang kewenangan, bukan kekeliruan yang tidak disengaja.
- source_word: לְבִלְתִּי שְׁמֹעַ
  choice: tidak mau mendengarkan
  rationale: שׁמע secara harfiah berkaitan dengan mendengar, tetapi dalam konteks hukum juga menyiratkan mengindahkan dan menaati. 'Tidak mau' menyampaikan unsur penolakan sengaja dalam konstruksi ini tanpa mengganti metafora mendengar.
- source_word: הָעֹמֵד לְשָׁרֶת שָׁם
  choice: yang berdiri di sana untuk melayani
  rationale: Terjemahan ini mempertahankan partisipel 'berdiri', keterangan 'di sana', dan fungsi resmi imam dalam pelayanan kudus.
- source_word: אֶת יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Allahmu
  rationale: Dengan kata kerja שׁרת, penanda objek אֶת memperkenalkan pihak yang dilayani. Nama ilahi ditransliterasikan sebagai 'Yahweh', sedangkan אֱלֹהֶיךָ dipertahankan sebagai sapaan perjanjian tunggal 'Allahmu'.
- source_word: אוֹ אֶל הַשֹּׁפֵט
  choice: atau hakim
  rationale: שֹׁפֵט menunjuk pejabat yang berwenang memberi keputusan hukum; 'hakim' adalah padanan langsung dan alami.
- source_word: וּמֵת הָאִישׁ הַהוּא
  choice: orang itu harus mati
  rationale: Dalam konteks ketentuan hukum, bentuk ini menyatakan konsekuensi hukuman yang wajib berlaku. 'Harus mati' lebih alami dalam bahasa Indonesia daripada bentuk futur dan tidak menentukan secara lebih khusus cara pelaksanaannya.
- source_word: וּבִעַרְתָּ הָרָע מִיִּשְׂרָאֵל
  choice: Dengan demikian, kamu harus menyingkirkan kejahatan dari Israel
  rationale: בער dalam rumusan hukum khas Ulangan berarti membuang atau membersihkan sesuatu dari komunitas. 'Menyingkirkan kejahatan' mempertahankan rumusan moral-hukum tanpa mempersempit הָרָע hanya kepada pelaku atau hanya kepada perbuatannya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian YHWH. Transliterasi 'Yahweh' mempertahankan nama pribadi tersebut, sementara catatan menjelaskan bentuk Ibraninya.
- issue: Cakupan gender אִישׁ dalam ketentuan hukum
  choice: orang
  alternative: laki-laki itu
  rationale: אִישׁ berbentuk maskulin tunggal, tetapi di sini berfungsi menunjuk individu yang melanggar ketentuan hukum. Bahasa Indonesia tidak menandai gender pada 'orang'; pilihan ini mempertahankan ketunggalan dan tidak menambahkan penegasan jenis kelamin yang tidak diperlukan oleh konteks.
- issue: Objek rumusan וּבִעַרְתָּ הָרָע
  choice: kejahatan
  alternative: orang jahat itu
  rationale: הָרָע dapat dipahami sebagai 'kejahatan' atau, secara substantival, 'yang jahat'. Terjemahan 'kejahatan' mempertahankan rumusan hukum yang luas dan tidak menutup ambiguitas antara pelaku serta kejahatan yang diwakilinya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang tegas dan bermartabat. Susunan kalimat dijaga dekat dengan alur Ibrani, tetapi dibuat alami bagi pembaca umum. Istilah 'dengan lancang', 'harus mati', dan 'menyingkirkan kejahatan' mempertahankan bobot moral-hukum teks tanpa menambahkan rincian pelaksanaan hukuman.
