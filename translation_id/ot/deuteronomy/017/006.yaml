id: DEU.17.6
reference: Deuteronomy 17:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עַל פִּ֣י שְׁנַ֣יִם עֵדִ֗ים א֛וֹ שְׁלֹשָׁ֥ה עֵדִ֖ים יוּמַ֣ת הַ/מֵּ֑ת לֹ֣א יוּמַ֔ת עַל פִּ֖י עֵ֥ד אֶחָֽד־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/006.yaml
  text: On the testimony of two witnesses or three witnesses[a], the one to die shall be put to death[b]; he shall not be put to death on the testimony of one witness.
translation:
  language: id
  text: Berdasarkan kesaksian dua orang saksi atau tiga orang saksi[a], orang yang harus mati itu harus dihukum mati[b]. Ia tidak boleh dihukum mati berdasarkan kesaksian seorang saksi saja.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “atas mulut dua orang saksi atau tiga orang saksi.” Ungkapan Ibrani ini berarti berdasarkan kesaksian atau bukti dalam perkara hukum.
    reason: lexical_alternative
  - marker: b
    text: Atau, “orang yang harus dihukum mati”; maksudnya, orang yang terkena hukuman mati.
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל־פִּי
  choice: berdasarkan kesaksian
  rationale: Secara harfiah berarti 'atas mulut', tetapi dalam konteks hukum merupakan idiom untuk kesaksian atau bukti. Pilihan ini menyampaikan makna yuridis secara alami dalam bahasa Indonesia.
- source_word: שְׁנַיִם עֵדִים ... שְׁלֹשָׁה עֵדִים
  choice: dua orang saksi atau tiga orang saksi
  rationale: Pengulangan kata 'saksi' dipertahankan untuk mencerminkan gaya hukum formal dan penekanan teks Ibrani.
- source_word: יוּמַת
  choice: harus dihukum mati
  rationale: Bentuk Hofal dari מות bersifat kausatif-pasif dan menunjuk pada pelaksanaan hukuman mati, bukan sekadar kematian. 'Harus dihukum mati' alami dalam bahasa hukum Indonesia.
- source_word: הַמֵּת
  choice: orang yang harus mati itu
  rationale: Ungkapan partisipial berartikel ini eliptis dan menunjuk kepada orang yang menurut perkara tersebut terkena hukuman mati, bukan kepada orang yang sudah mati. Terjemahan ini mempertahankan ketegangan ungkapan sumber tanpa menambahkan status 'terpidana' secara eksplisit.
- source_word: לֹא יוּמַת
  choice: Ia tidak boleh dihukum mati
  rationale: Larangan hukum dinyatakan secara wajar dengan 'tidak boleh', sambil mempertahankan verba penghukuman mati yang sama seperti pada klausa sebelumnya.
- source_word: עֵד אֶחָד
  choice: seorang saksi saja
  rationale: Kata 'saja' memperjelas pembatasan pada satu saksi dan menghasilkan bahasa Indonesia yang alami tanpa mengubah standar pembuktian dalam teks.
theological_decisions:
- issue: Rujukan dan daya ungkap הַמֵּת dalam konteks hukum pidana mati
  choice: orang yang harus mati itu
  alternative: orang yang dijatuhi hukuman mati; orang mati itu
  rationale: Konteks mengatur jumlah saksi yang diperlukan untuk menjatuhkan hukuman mati. Terjemahan 'orang mati itu' keliru mengesankan bahwa orang tersebut telah meninggal, sedangkan 'orang yang dijatuhi hukuman mati' memasukkan kesimpulan pengadilan dengan lebih tegas daripada teks Ibrani. Pilihan ini menjaga sifat eliptis dan bobot hukumnya.
translation_notes:
  register: Bahasa hukum yang formal, bermartabat, dan tetap mudah dipahami. Pengulangan 'saksi' dipertahankan sesuai bentuk sumber, sedangkan 'seorang saksi saja' memakai idiom Indonesia yang alami untuk menegaskan ketidakcukupan satu saksi.
