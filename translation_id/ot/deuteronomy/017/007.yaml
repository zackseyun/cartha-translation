    rationale: Frasa Ibrani וְיַד כָּל־הָעָם בָּאַחֲרֹנָה secara eliptis melanjutkan tindakan 'tangan' terhadap terhukum sesudah para saksi. 'Kemudian seluruh rakyat' hanya menyebut pelaku dan urutan, tetapi tidak menyatakan bahwa mereka turut bertindak.
