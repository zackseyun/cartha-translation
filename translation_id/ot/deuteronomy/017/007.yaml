revisions:
- from: Para saksi harus menjadi yang pertama bertindak terhadap dia untuk menghukum mati dia, kemudian seluruh rakyat.[a] Demikianlah engkau harus menyingkirkan kejahatan dari tengah-tengahmu.[b]
  to: Para saksi harus menjadi yang pertama bertindak[a] terhadapnya untuk menghukum mati orang itu, dan sesudah itu seluruh rakyat harus turut bertindak. Demikianlah engkau harus menyingkirkan kejahatan dari tengah-tengahmu.[b]
  rationale: Revisi melengkapi klausa kedua dengan 'harus turut bertindak' untuk menyampaikan partisipasi seluruh rakyat yang tersirat dalam pengulangan 'tangan' pada teks Ibrani. Catatan idiom dipindahkan ke kata 'bertindak,' tempat idiom itu diterjemahkan, sedangkan alternatif untuk מִקִּרְבֶּךָ tetap ditambatkan pada frasa yang relevan. Tidak ada perubahan pada arti hukum atau pada keluasan 'kejahatan.'
