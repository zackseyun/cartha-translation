  text: יַ֣ד הָ/עֵדִ֞ים תִּֽהְיֶה בּ֤/וֹ בָ/רִאשֹׁנָה֙ לַ/הֲמִית֔/וֹ וְ/יַ֥ד כָּל הָ/עָ֖ם בָּ/אַחֲרֹנָ֑ה וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּֽ/ךָ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/017/007.yaml
  text: The hand of the witnesses shall be first against him to put him to death[a], and afterward the hand of all the people[b]. So you shall purge the evil from your midst.
translation:
  language: id
  text: Para saksi harus menjadi yang pertama bertindak[a] terhadapnya untuk menghukum mati orang itu, dan sesudah itu seluruh rakyat harus turut bertindak. Demikianlah engkau harus menyingkirkan kejahatan dari tengah-tengahmu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “Tangan para saksi harus menjadi yang pertama terhadap dia ... kemudian tangan seluruh rakyat.” Ini adalah ungkapan hukum yang menetapkan bahwa para saksi bertanggung jawab memulai pelaksanaan hukuman.'
    reason: cultural_note
  - marker: b
    text: 'Atau: “dari antaramu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַד הָעֵדִים
  choice: para saksi ... bertindak
  rationale: Secara harfiah berarti “tangan para saksi,” tetapi dalam konteks hukum ungkapan ini menyatakan pelaku atau pihak yang bertanggung jawab memulai pelaksanaan hukuman. Terjemahan ini menyampaikan fungsi idiom tersebut secara alami dalam bahasa Indonesia.
- source_word: הָעֵדִים
  choice: para saksi
  rationale: Kata ini menunjuk kepada saksi dalam proses hukum, bukan sekadar penuduh.
- source_word: בּוֹ
  choice: terhadap dia
  rationale: Preposisi ini, bersama ungkapan tentang tangan dalam konteks penghukuman, menyatakan tindakan yang diarahkan terhadap orang yang dijatuhi hukuman.
- source_word: בָרִאשֹׁנָה
  choice: yang pertama
  rationale: 'Bentuk adverbial ini menandai urutan tindakan: para saksi wajib memulai pelaksanaan hukuman.'
- source_word: לַהֲמִיתוֹ
  choice: untuk menghukum mati dia
  rationale: Bentuk Hifil dari מות berarti menyebabkan seseorang mati. “Menghukum mati” mempertahankan konteks putusan hukum dan lebih tepat daripada kata umum “membunuh.”
- source_word: וְיַד כָּל הָעָם בָּאַחֲרֹנָה
  choice: kemudian seluruh rakyat
  rationale: Klausa ini menyatakan bahwa seluruh komunitas ikut melaksanakan hukuman setelah para saksi. Pengulangan kata “tangan” dipahami sebagai idiom tentang peran atau tindakan dan dijelaskan dalam catatan kaki.
- source_word: וּבִעַרְתָּ
  choice: engkau harus menyingkirkan
  rationale: Dalam rumusan hukum khas Ulangan, בער berarti membuang atau meniadakan kejahatan dari komunitas, bukan membakarnya secara harfiah.
- source_word: הָרָע
  choice: kejahatan
  rationale: Nomina dengan artikel ini mempertahankan rumusan luas mengenai kejahatan sebagai sesuatu yang harus disingkirkan, tanpa mempersempitnya hanya menjadi “orang jahat.”
- source_word: מִקִּרְבֶּךָ
  choice: dari tengah-tengahmu
  rationale: Ungkapan ini menunjuk kepada lingkungan komunitas perjanjian. Bentuk tunggal “-mu” dipertahankan karena Israel disapa secara kolektif.
theological_decisions:
- issue: Makna rumusan hukum וּבִעַרְתָּ הָרָע מִקִּרְבֶּךָ
  choice: Demikianlah engkau harus menyingkirkan kejahatan dari tengah-tengahmu
  alternative: Demikianlah engkau harus menyingkirkan orang jahat dari antaramu
  rationale: Teks Ibrani secara harfiah menyebut “kejahatan,” bukan secara eksplisit “orang jahat.” Pilihan ini mempertahankan keluasan rumusan teologis-hukum tersebut dan tidak membatasi acuannya hanya kepada pelaku.
- issue: Tanggung jawab para saksi dalam pelaksanaan hukuman
  choice: Para saksi harus menjadi yang pertama bertindak
  alternative: Tangan para saksi harus menjadi yang pertama terhadap dia
  rationale: Ungkapan “tangan para saksi” merupakan idiom hukum yang memberikan tanggung jawab pertama kepada para saksi. Terjemahan utama menyatakan fungsi itu secara wajar, sedangkan bentuk harfiahnya dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Menghukum mati” menjaga nuansa yudisial; “seluruh rakyat” menyampaikan partisipasi komunitas. Sapaan tunggal “engkau” dipertahankan karena teks menyapa Israel sebagai satu komunitas.
