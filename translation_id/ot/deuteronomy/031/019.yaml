  text: וְ/עַתָּ֗ה כִּתְב֤וּ לָ/כֶם֙ אֶת הַ/שִּׁירָ֣ה הַ/זֹּ֔את וְ/לַמְּדָ֥/הּ אֶת בְּנֵי יִשְׂרָאֵ֖ל שִׂימָ֣/הּ בְּ/פִי/הֶ֑ם לְמַ֨עַן תִּהְיֶה לִּ֜/י הַ/שִּׁירָ֥ה הַ/זֹּ֛את לְ/עֵ֖ד בִּ/בְנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/019.yaml
  text: And now[a], write this song for yourselves, and teach it to the sons of Israel; put it in their mouths[b], so that this song may be a witness for me against the sons of Israel.
translation:
  language: id
  text: Maka sekarang, tuliskanlah nyanyian ini untuk kalian sendiri, ajarkanlah nyanyian itu kepada orang Israel[a], dan taruhlah nyanyian itu ke dalam mulut mereka, supaya nyanyian ini menjadi saksi bagi-Ku terhadap orang Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “putra-putra Israel” (juga dua kali dalam ayat ini); yaitu orang-orang Israel.
    reason: lexical_alternative
  - marker: b
    text: Atau “di antara orang Israel.” Dalam konteks ini, nyanyian itu tampaknya berfungsi sebagai saksi yang memberatkan mereka.
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: Sekarang
  rationale: Menandai peralihan yang mendesak secara alami dalam bahasa Indonesia; hubungan dengan perkataan sebelumnya tetap tersirat dari konteks.
- source_word: כִּתְבוּ לָכֶם
  choice: hendaklah kalian menuliskan ... bagi kalian sendiri
  rationale: Bentuk perintah jamak dipertahankan melalui “kalian,” sedangkan לָכֶם dinyatakan sebagai “bagi kalian sendiri.” “Menuliskan” sesuai dengan tindakan menghasilkan teks tanpa menambah gagasan asing.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: nyanyian ini
  rationale: שִׁירָה secara langsung berarti nyanyian atau lagu; “nyanyian” cocok dengan karya puitis yang dimaksud dan bernada lebih khidmat daripada “lagu.”
- source_word: וְלַמְּדָהּ
  choice: Ajarkanlah nyanyian itu
  rationale: Akhiran feminin merujuk kepada nyanyian. Nomina diulangi agar rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Ungkapan ini mempertahankan gagasan hubungan keturunan dalam בני tanpa memberi kesan bahwa yang dimaksud hanya anak laki-laki atau anak-anak berusia muda.
- source_word: שִׂימָהּ בְּפִיהֶם
  choice: taruhlah itu dalam mulut mereka
  rationale: Mempertahankan gambaran konkret Ibrani tentang menempatkan nyanyian dalam mulut mereka, yang menyiratkan penghafalan dan pelafalan tanpa menjabarkan idiom secara berlebihan.
- source_word: לְמַעַן
  choice: supaya
  rationale: Menyatakan tujuan dengan ringkas dan alami.
- source_word: תִּהְיֶה לִּי לְעֵד
  choice: menjadi saksi bagi-Ku
  rationale: Mempertahankan fungsi nyanyian sebagai saksi yang melayani maksud Allah tanpa mengubahnya menjadi sekadar “kesaksian.”
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: terhadap keturunan Israel
  rationale: Dalam latar perjanjian dan pengadilan, ב dapat menyatakan arah kesaksian yang memberatkan Israel. “Terhadap” menjaga nuansa itu tanpa sekeras parafrasa “untuk mendakwa.”
theological_decisions:
- issue: Cakupan ungkapan בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak Israel; orang Israel; umat Israel
  rationale: “Keturunan Israel” cukup dekat dengan bentuk Ibrani tetapi dalam bahasa Indonesia tidak membatasi kelompok itu pada laki-laki atau anak-anak. Alternatif yang lebih idiomatis dicatat dalam catatan kaki.
- issue: Arti preposisi בְּ dalam בִּבְנֵי יִשְׂרָאֵל setelah לְעֵד
  choice: terhadap keturunan Israel
  alternative: di antara keturunan Israel
  rationale: Konteks pelanggaran perjanjian mendukung fungsi nyanyian sebagai saksi yang memberatkan Israel. Namun, karena preposisi itu juga dapat dibaca secara lokatif, kemungkinan “di antara” dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk “kalian” dipakai untuk menunjukkan perintah pertama yang berbentuk jamak. Perintah-perintah berikutnya tidak menyebut pronomina subjek, sehingga tetap alami dalam bahasa Indonesia dan tidak memaksakan penyelesaian atas peralihan bentuk dari jamak ke tunggal dalam bahasa Ibrani. Gambaran “dalam mulut mereka” sengaja dipertahankan.
