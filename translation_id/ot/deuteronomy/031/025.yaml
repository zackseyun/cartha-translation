  text: Moses commanded the Levites who carried the ark of the covenant of Yahweh[a], saying,
translation:
  language: id
  text: Musa memerintahkan orang-orang Lewi, para pembawa tabut perjanjian Yahweh, katanya,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: memerintahkan
  rationale: Bentuk verba dari צוה menyatakan tindakan memberi perintah; padanan ini langsung dan wajar dalam bahasa Indonesia.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Padanan baku dan mudah dipahami untuk sebutan kelompok הַלְוִיִּם.
- source_word: נֹשְׂאֵי
  choice: yang mengangkat
  rationale: Partisipel נשׂא menerangkan orang-orang Lewi sebagai para pengangkat atau pembawa tabut; 'yang mengangkat' mempertahankan fungsi atributif dan sesuai dengan tugas mereka.
- source_word: אֲרוֹן
  choice: tabut
  rationale: Dalam konteks ibadah dan perjanjian Israel, 'tabut' merupakan padanan baku bagi peti suci ini.
- source_word: בְּרִית
  choice: perjanjian
  rationale: Hubungan konstruksi dengan אֲרוֹן menghasilkan ungkapan baku 'tabut perjanjian'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi tetragramaton ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Formula ini memperkenalkan ucapan langsung pada ayat berikutnya; 'katanya' alami dalam narasi Indonesia dan tetap memperlihatkan fungsi pengantarnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama ilahi secara langsung; 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Susunan kalimat mempertahankan kesinambungan dengan ucapan langsung pada ayat berikutnya. Partisipel diterjemahkan sebagai klausa relatif agar alami; tidak diperlukan catatan kaki karena alternatif yang lebih formal tidak menimbulkan perbedaan makna penting.
