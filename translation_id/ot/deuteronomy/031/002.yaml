id: DEU.31.2
reference: Deuteronomy 31:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵ/הֶ֗ם בֶּן מֵאָה֩ וְ/עֶשְׂרִ֨ים שָׁנָ֤ה אָנֹכִי֙ הַ/יּ֔וֹם לֹא אוּכַ֥ל ע֖וֹד לָ/צֵ֣את וְ/לָ/ב֑וֹא וַֽ/יהוָה֙ אָמַ֣ר אֵלַ֔/י לֹ֥א תַעֲבֹ֖ר אֶת הַ/יַּרְדֵּ֥ן הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/002.yaml
  text: And he said to them[a], “I am one hundred twenty years old today. I can no longer go out and come in, and Yahweh has said to me, ‘You shall not cross this Jordan.’”
translation:
  language: id
  text: Ia berkata kepada mereka, “Hari ini umurku seratus dua puluh tahun. Aku tidak sanggup lagi keluar dan masuk[a], dan Yahweh telah berfirman kepadaku, ‘Engkau tidak akan menyeberangi Sungai Yordan ini.’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “keluar dan masuk”; ungkapan Ibrani ini dapat mengacu pada kegiatan sehari-hari atau pada tindakan memimpin umat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵהֶם
  choice: Ia berkata kepada mereka
  rationale: Bentuk wayyiqtol meneruskan alur narasi. Bahasa Indonesia tidak memerlukan kata penghubung eksplisit di sini; “Ia berkata kepada mereka” alami dan tetap setia.
- source_word: בֶּן מֵאָה וְעֶשְׂרִים שָׁנָה אָנֹכִי הַיּוֹם
  choice: Hari ini umurku seratus dua puluh tahun
  rationale: Ungkapan usia Ibrani secara harfiah memakai pola “anak dari ... tahun”; terjemahan ini menyampaikan maknanya secara wajar sambil mempertahankan penekanan temporal הַיּוֹם, “hari ini”.
- source_word: לֹא אוּכַל עוֹד
  choice: Aku tidak sanggup lagi
  rationale: יכל menyatakan kemampuan dan עוֹד dalam konstruksi negatif berarti “lagi/tidak lagi”. “Tidak sanggup lagi” mempertahankan pernyataan ketidakmampuan tanpa menjelaskan penyebabnya.
- source_word: לָצֵאת וְלָבוֹא
  choice: keluar dan masuk
  rationale: Terjemahan dekat dengan idiom Ibrani ini mempertahankan kemungkinan makna kegiatan biasa maupun pelaksanaan kepemimpinan, tanpa mempersempitnya dalam teks utama.
- source_word: וַיהוָה אָמַר אֵלַי
  choice: dan Yahweh telah berfirman kepadaku
  rationale: Nama perjanjian יהוה ditransliterasikan sebagai “Yahweh”. Bentuk qatal menyebut firman yang telah disampaikan dan masih menentukan keadaan kini; “telah berfirman” sesuai dengan konteks ilahi dan relevansi berkelanjutannya.
- source_word: לֹא תַעֲבֹר
  choice: Engkau tidak akan menyeberangi
  rationale: Bentuk negatif ini dapat berfungsi sebagai pernyataan tegas atau larangan. “Tidak akan” mempertahankan ketetapan ilahi tanpa menambahkan modal izin yang tidak dinyatakan.
- source_word: אֶת הַיַּרְדֵּן הַזֶּה
  choice: Sungai Yordan ini
  rationale: “Yordan” adalah nama sungai, dan penambahan penjelas kategori “Sungai” menghasilkan bahasa Indonesia yang alami. “Ini” mempertahankan unsur penunjuk הַזֶּה.
theological_decisions:
- issue: Penyajian nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber secara langsung memakai Tetragramaton. “Yahweh” mempertahankan nama pribadi perjanjian dan mengikuti lapisan konsultasi teologis terbaru tanpa menggantinya dengan gelar.
- issue: Hubungan antara usia Musa, kemampuannya, dan ketetapan Allah
  choice: Pernyataan ketidaksanggupan dan firman Yahweh dibiarkan berdampingan
  alternative: Menafsirkan bahwa Musa semata-mata terlalu lemah karena usia atau semata-mata tidak diizinkan memimpin
  rationale: Ayat ini menyebut keduanya tanpa menguraikan secara tegas bagaimana keduanya berhubungan. Terjemahan tidak boleh menyelesaikan ketegangan itu secara sepihak.
- issue: Daya ungkap לֹא תַעֲבֹר
  choice: Engkau tidak akan menyeberangi
  alternative: Engkau tidak boleh menyeberangi
  rationale: Ungkapan tersebut dapat dipahami sebagai ketetapan atau larangan ilahi. Pilihan “tidak akan” cocok sebagai deklarasi tegas dalam konteks ini, tetapi tidak meniadakan daya normatif firman Allah.
translation_notes:
  register: Bahasa Indonesia baku modern, lugas, dan bermartabat. Kata ganti “aku/engkau” dipakai dalam tuturan langsung sesuai register Alkitab Indonesia yang umum. Idiom sumber dipertahankan dalam teks dan dijelaskan melalui catatan kaki agar ambiguitas aslinya tidak hilang.
