  yaml_path: translation/ot/deuteronomy/031/005.yaml
  text: And the LORD will give them over to you, and you shall do to them according to all the commandment that I have commanded you.
translation:
  language: id
  text: TUHAN akan menyerahkan mereka kepadamu, dan kamu harus bertindak terhadap mereka sesuai dengan seluruh perintah yang telah kuperintahkan kepadamu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּנְתָנָם יְהוָה לִפְנֵיכֶם
  choice: TUHAN akan menyerahkan mereka kepadamu
  rationale: Ungkapan נתן לפני secara harfiah berarti 'memberikan/menempatkan di hadapan', tetapi dalam konteks penaklukan menyatakan penyerahan musuh ke dalam kuasa Israel. 'Kepadamu' alami dalam bahasa Indonesia dan sesuai dengan makna kontekstual; nama ilahi ditampilkan sebagai TUHAN menurut konvensi terjemahan Indonesia.
- source_word: וַעֲשִׂיתֶם לָהֶם
  choice: kamu harus memperlakukan mereka
  rationale: Secara harfiah 'kamu akan berbuat kepada mereka'. Bentuk Indonesia ini menyampaikan tindakan yang diperintahkan terhadap bangsa-bangsa tersebut tanpa terdengar janggal.
- source_word: כְּכָל הַמִּצְוָה
  choice: sesuai dengan seluruh perintah
  rationale: Kata tunggal kolektif הַמִּצְוָה dipertahankan sebagai 'perintah', sementara כְּכָל diterjemahkan 'sesuai dengan seluruh' untuk menegaskan cakupannya.
- source_word: אֲשֶׁר צִוִּיתִי אֶתְכֶם
  choice: yang telah kusampaikan kepadamu
  rationale: צוה berarti 'memerintahkan'. Dalam konstruksi Indonesia, 'perintah yang telah kusampaikan' menghindari pengulangan kaku 'perintah yang telah kuperintahkan' sambil mempertahankan daya perintahnya.
theological_decisions:
- issue: Agen ilahi dan penyerahan bangsa-bangsa ke dalam kuasa Israel
  choice: TUHAN akan menyerahkan mereka kepadamu
  alternative: TUHAN akan memberikan mereka di hadapanmu
  rationale: Pilihan utama menyatakan idiom peperangan Ibrani secara jelas tanpa menghapus bahwa TUHAN adalah agen tindakan tersebut.
- issue: Isi tindakan Israel terhadap bangsa-bangsa itu
  choice: sesuai dengan seluruh perintah yang telah kusampaikan kepadamu
  alternative: sesuai dengan segala perintah yang telah Kuperintahkan kepadamu
  rationale: Ayat ini tetap merujuk pada perintah yang sudah diberikan tanpa menambahkan, mengurangi, atau menafsirkan rincian tindakannya di dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti jamak Ibrani diterjemahkan dengan 'kamu' yang dalam bahasa Indonesia dapat bersifat tunggal atau jamak; konteks menunjukkan umat Israel secara kolektif. Kapitalisasi TUHAN mengikuti konvensi umum untuk Tetragramaton.
