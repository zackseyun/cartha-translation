  text: חִזְק֣וּ וְ/אִמְצ֔וּ אַל תִּֽירְא֥וּ וְ/אַל תַּעַרְצ֖וּ מִ/פְּנֵי/הֶ֑ם כִּ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ ה֚וּא הַ/הֹלֵ֣ךְ עִמָּ֔/ךְ לֹ֥א יַרְפְּ/ךָ֖ וְ/לֹ֥א יַעַזְבֶֽ/ךָּ־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/006.yaml
  text: Be strong and courageous[a]. Do not fear or be terrified because of them, for Yahweh your God is the one who goes with you[b]; he will not fail you or forsake you.
translation:
  language: id
  text: Jadilah kuat dan berani.[a] Jangan takut dan jangan gentar terhadap mereka, sebab Yahweh, Allahmu, Dialah yang berjalan bersamamu. Ia tidak akan melepaskanmu[b] ataupun meninggalkanmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kedua perintah ini berbentuk jamak dalam bahasa Ibrani. Kata kedua dapat juga diterjemahkan “teguh” atau “tabah”; ungkapan ini menyerukan kekuatan dan keberanian.
    reason: grammatical_and_lexical_clarification
  - marker: b
    text: Atau “tidak akan membiarkanmu terlepas” atau “tidak akan menjatuhkanmu”; gambaran dasarnya ialah Yahweh tidak akan mengendurkan pegangan-Nya atasmu.
    reason: lexical_alternative
lexical_decisions:
- source_word: חִזְקוּ וְאִמְצוּ
  choice: Kuatkan dan teguhkanlah hatimu
  rationale: Dua imperatif jamak ini membentuk seruan idiomatis untuk bersikap kuat, berani, dan teguh. Ungkapan Indonesia ini alami dan berwibawa, tanpa menghilangkan daya ganda pasangan Ibrani.
- source_word: אַל תִּירְאוּ וְאַל תַּעַרְצוּ
  choice: Jangan takut atau gentar
  rationale: Kata kedua lebih kuat daripada ירא dan menyatakan kengerian atau ketakutan yang mengguncangkan; 'gentar' mempertahankan peningkatan makna itu secara ringkas.
- source_word: מִפְּנֵיהֶם
  choice: terhadap mereka
  rationale: Secara harfiah berkaitan dengan berada 'di hadapan mereka'; dalam konteks larangan takut, 'terhadap mereka' merupakan ungkapan Indonesia yang alami.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Padanan langsung dan alami untuk ungkapan perjanjian 'Allahmu'.
- source_word: הוּא הַהֹלֵךְ עִמָּךְ
  choice: Dialah yang berjalan menyertaimu
  rationale: Konstruksi pronomina dan partisip menekankan bahwa Yahweh sendiri menyertai umat; 'Dialah' mempertahankan penekanan tersebut.
- source_word: לֹא יַרְפְּךָ
  choice: Ia tidak akan melepaskanmu
  rationale: רפה dalam bentuk ini menggambarkan mengendurkan pegangan atau membiarkan terlepas. 'Melepaskanmu' mempertahankan citra sumber dan membedakannya dari עזב.
- source_word: וְלֹא יַעַזְבֶךָ
  choice: ataupun meninggalkanmu
  rationale: עזב berarti meninggalkan atau menelantarkan. 'Meninggalkanmu' jelas, alami, dan tetap berbeda dari 'melepaskanmu'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama perjanjian secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Pembedaan dua verba jaminan יַרְפְּךָ dan יַעַזְבֶךָ
  choice: Ia tidak akan melepaskanmu ataupun meninggalkanmu
  alternative: Ia tidak akan mengecewakanmu ataupun meninggalkanmu
  rationale: Pilihan ini mempertahankan citra konkret verba pertama—tidak mengendurkan pegangan atau membiarkan jatuh—serta membedakannya dari tindakan meninggalkan pada verba kedua, tanpa memperluas klaim teologis teks.
- issue: Jumlah gramatikal sapaan
  choice: bentuk Indonesia yang tidak menandai tunggal/jamak secara eksplisit
  alternative: kalian; kamu sekalian
  rationale: Imperatif ditujukan kepada Israel secara jamak, sedangkan sufiks pada 'Allahmu' dan 'menyertaimu' berbentuk tunggal kolektif. Bentuk '-mu' dalam bahasa Indonesia memungkinkan ketegangan kolektif ini tetap terbuka tanpa penjelasan berlebih.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan khidmat. Paralelisme Ibrani dipertahankan, nama Yahweh ditransliterasikan, dan perbedaan antara rasa takut biasa, kegentaran, melepaskan, serta meninggalkan dijaga.
