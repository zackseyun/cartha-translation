  terminology: ‘Yahweh’ dan ‘Allahmu’ sudah tepat. ‘Berani’ menyampaikan אמץ dengan lebih langsung daripada ‘teguh’ dalam pasangan idiomatis ini. ‘Melepaskanmu’ dan ‘meninggalkanmu’ tetap membedakan kedua verba jaminan.
