base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/014.yaml
  text: And Yahweh said to Moses[a], “Behold, your days are drawing near for you to die. Call Joshua, and present yourselves in the tent of meeting, that I may command him.” So Moses and Joshua went and presented themselves in the tent of meeting.
translation:
  language: id
  text: Yahweh berfirman kepada Musa, “Sesungguhnya, hari-harimu untuk mati sudah mendekat. Panggillah Yosua, lalu kamu berdua menghadap di Kemah Pertemuan, agar Aku memberi perintah kepadanya.” Maka Musa dan Yosua pergi dan menghadap di Kemah Pertemuan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: הֵן
  choice: Ketahuilah
  rationale: Mengungkapkan partikel penarik perhatian dengan bahasa Indonesia modern dan bermartabat tanpa memakai bentuk arkais.
- source_word: קָרְבוּ יָמֶיךָ לָמוּת
  choice: waktu kematianmu sudah dekat
  rationale: Menyampaikan idiom Ibrani tentang hari-hari Musa yang mendekat untuk mati secara alami dan jelas dalam bahasa Indonesia.
- source_word: קְרָא אֶת־יְהוֹשֻׁעַ
  choice: Panggillah Yosua
  rationale: Mempertahankan bentuk perintah yang langsung dan sederhana.
- source_word: וְהִתְיַצְּבוּ / וַיִּתְיַצְּבוּ
  choice: menghadaplah kalian / menghadap
  rationale: Bentuk hitpael ini menyatakan tampil atau mengambil tempat di hadapan seseorang; 'menghadap' sesuai dengan suasana resmi di hadapan Yahweh dan mempertahankan bentuk jamak pada perintah.
- source_word: בְּאֹהֶל מוֹעֵד
  choice: di Kemah Pertemuan
  rationale: Mempertahankan sebutan khusus bagi tempat kudus, dengan preposisi Indonesia yang wajar dan tidak memaksakan apakah tindakan berlangsung tepat di dalam atau di lokasi kemah.
- source_word: וַאֲצַוֶּנּוּ
  choice: Di sana Aku akan memberi tugas kepadanya
  rationale: Dalam konteks peralihan kepemimpinan kepada Yosua, verba ini menunjuk pada pemberian perintah atau amanat resmi. Pilihan ini terdengar alami sekaligus tidak membatasi maknanya pada satu nuansa saja.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian יהוה secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Nuansa צוה dalam penetapan Yosua
  choice: memberi tugas kepadanya
  alternative: memerintahkannya; memberikan amanat kepadanya; menugaskan dia
  rationale: Konteksnya adalah pemberian tugas resmi kepada Yosua menjelang kematian Musa. Teks utama mempertahankan unsur tugas atau perintah, sedangkan catatan kaki menunjukkan keluasan makna verba itu tanpa memasukkan konsep penahbisan tertentu.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk 'kalian' diperlukan untuk memperlihatkan bahwa perintah menghadap ditujukan kepada Musa dan Yosua. 'Kemah Pertemuan' diperlakukan sebagai sebutan khusus. Kalimat Ibrani yang sangat padat dibagi menjadi dua kalimat dalam ucapan langsung agar alami, sementara urutan tindakan dan hubungan maknanya tetap dipertahankan.
