revisions:
- from: Yahweh berfirman kepada Musa, “Ketahuilah, waktu kematianmu sudah dekat. Panggillah Yosua, lalu menghadaplah kalian di Kemah Pertemuan. Di sana Aku akan memberi tugas kepadanya.[a]” Maka Musa dan Yosua pergi dan menghadap di Kemah Pertemuan.
  to: Yahweh berfirman kepada Musa, “Sesungguhnya, hari-harimu untuk mati sudah mendekat. Panggillah Yosua, lalu kamu berdua menghadap di Kemah Pertemuan, agar Aku memberi perintah kepadanya.” Maka Musa dan Yosua pergi dan menghadap di Kemah Pertemuan.
  rationale: Revisi menghapus keterangan yang tidak ada dalam sumber, mempertahankan konstruksi tujuan pada verba Ibrani, dan memakai padanan utama yang netral untuk צוה. Bentuk “kamu berdua” menyatakan jamak tanpa kekakuan “menghadaplah kalian,” sedangkan idiom “hari-harimu” dipulihkan untuk kedekatan dengan teks Ibrani. Catatan kaki tetap menampung nuansa amanat atau penugasan tanpa menjadikannya tafsiran utama.
