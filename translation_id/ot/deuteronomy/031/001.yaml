translation:
  language: id
  text: Lalu Musa pergi dan mengucapkan kata-kata ini kepada seluruh Israel.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan Musa pergi dan mengucapkan kata-kata ini kepada seluruh Israel.” Kata penghubung pembuka dapat diterjemahkan secara lebih formal sebagai “dan”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: pergi
  rationale: Bentuk wayyiqtol dari הלך pada dasarnya berarti “pergi” atau “berjalan”. Karena tujuan perginya tidak disebutkan, terjemahan “pergi” mempertahankan makna verbal yang lugas tanpa menafsirkannya secara idiomatis sebagai “melanjutkan”.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk nama yang baku dan umum dalam bahasa Indonesia.
- source_word: וַיְדַבֵּר
  choice: menyampaikan
  rationale: דבר dalam piel berarti “berbicara”. Dengan objek langsung “perkataan-perkataan ini” dan penerima “seluruh Israel”, “menyampaikan” terdengar alami dalam bahasa Indonesia sekaligus mempertahankan tindakan komunikasi yang disengaja.
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: perkataan-perkataan ini
  rationale: Ungkapan ini secara harfiah menunjuk kepada “perkataan-perkataan ini”. Bentuk tersebut mempertahankan acuan kepada wacana tertentu, bukan menggeneralisasikannya menjadi “hal-hal ini” atau “pesan ini”.
- source_word: אֶל
  choice: kepada
  rationale: Preposisi אֶל menandai pihak yang dituju oleh perkataan Musa; “kepada” merupakan padanan Indonesia yang alami.
- source_word: כָּל יִשְׂרָאֵל
  choice: seluruh Israel
  rationale: Terjemahan ini mempertahankan Israel sebagai kesatuan bangsa dan komunitas perjanjian, tanpa mengubahnya menjadi bentuk individual “semua orang Israel”.
- source_word: וַ
  choice: Kemudian
  rationale: Waw pada awal narasi melanjutkan urutan peristiwa. “Kemudian” menyatakan daya sekuensial itu secara wajar dalam bahasa Indonesia; padanan yang lebih formal adalah “Lalu” atau “Dan”.
