  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הִנְּ/ךָ֥ שֹׁכֵ֖ב עִם אֲבֹתֶ֑י/ךָ וְ/קָם֩ הָ/עָ֨ם הַ/זֶּ֜ה וְ/זָנָ֣ה אַחֲרֵ֣י אֱלֹהֵ֣י נֵֽכַר הָ/אָ֗רֶץ אֲשֶׁ֨ר ה֤וּא בָא שָׁ֨מָּ/ה֙ בְּ/קִרְבּ֔/וֹ וַ/עֲזָבַ֕/נִי וְ/הֵפֵר֙ אֶת בְּרִיתִ֔/י אֲשֶׁ֥ר כָּרַ֖תִּי אִתּֽ/וֹ־־׀׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/016.yaml
  text: And Yahweh said to Moses[a], “Behold, you are about to lie down with your fathers. Then this people will rise up and prostitute themselves after the foreign gods of the land into whose midst they are entering[b]. They will forsake me and break my covenant that I made with them.”
translation:
  language: id
  text: Yahweh berfirman kepada Musa, “Sesungguhnya, engkau akan segera berbaring bersama nenek moyangmu. Kemudian bangsa ini akan bangkit dan berzina, mengikuti ilah-ilah asing negeri yang akan mereka masuki. Mereka akan meninggalkan Aku dan melanggar perjanjian-Ku yang telah Kuikat dengan mereka[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Bahasa Ibrani memakai bentuk tunggal dalam ungkapan “ia masuk” dan “dengannya”. Keduanya merujuk secara kolektif kepada bangsa Israel; terjemahan memakai bentuk jamak agar rujukannya jelas.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, agar nama pribadi dalam teks Ibrani tetap tampak.
- source_word: הִנְּךָ שֹׁכֵב עִם אֲבֹתֶיךָ
  choice: Ketahuilah, engkau akan segera berbaring bersama nenek moyangmu
  rationale: “Ketahuilah” menyampaikan daya penanda wacana הִנֵּה secara alami, sedangkan ungkapan kematian “berbaring bersama nenek moyang” dipertahankan dan bentuk partisipnya diterjemahkan sebagai peristiwa yang segera terjadi.
- source_word: וְקָם
  choice: akan bangkit
  rationale: Bentuk ini dipahami dalam rangkaian nubuat tentang masa depan. “Bangkit” mempertahankan verba sumber tanpa menambahkan secara eksplisit gagasan pemberontakan yang baru dijelaskan oleh klausa berikutnya.
- source_word: וְזָנָה
  choice: berzina
  rationale: Kata ini mempertahankan metafora seksual yang tajam bagi ketidaksetiaan perjanjian melalui penyembahan berhala; menerjemahkannya hanya sebagai “tidak setia” akan melemahkan citraan sumber.
- source_word: אַחֲרֵי אֱלֹהֵי נֵכַר הָאָרֶץ
  choice: dengan mengikuti ilah-ilah asing di negeri
  rationale: אַחֲרֵי dalam konteks ini menyatakan mengikuti atau berpaling kepada objek ibadah. “Ilah-ilah asing” menyampaikan kontras dengan Yahweh, dan “di negeri” menghubungkan ilah-ilah itu dengan negeri yang dimasuki Israel tanpa menghasilkan susunan Indonesia yang kaku.
- source_word: אֲשֶׁר הוּא בָא שָׁמָּה בְּקִרְבּוֹ
  choice: yang akan mereka masuki
  rationale: Bentuk tunggal Ibrani merujuk secara kolektif kepada bangsa Israel. Bentuk jamak Indonesia menjernihkan rujukannya, sedangkan gagasan masuk ke dalam negeri disampaikan secara idiomatis.
- source_word: וַעֲזָבַנִי
  choice: Mereka akan meninggalkan Aku
  rationale: “Meninggalkan” merupakan padanan Indonesia yang jelas dan berbobot dalam konteks pengabaian hubungan perjanjian.
- source_word: וְהֵפֵר אֶת בְּרִיתִי
  choice: dan melanggar perjanjian-Ku
  rationale: Dalam konteks perjanjian, הֵפֵר berarti merusak, membatalkan, atau melanggar kewajiban perjanjian. “Melanggar” adalah ungkapan Indonesia yang alami tanpa menentukan lebih jauh akibat yuridisnya.
- source_word: אֲשֶׁר כָּרַתִּי אִתּוֹ
  choice: yang telah Kuikat dengan mereka
  rationale: כרת ברית adalah idiom membuat atau mengikat perjanjian. “Kuikat” mempertahankan kolokasi Indonesia yang lazim bagi perjanjian, sementara “mereka” menjelaskan bahwa bentuk tunggal Ibrani merujuk secara kolektif kepada bangsa itu.
theological_decisions:
- issue: Penyembahan berhala digambarkan dengan metafora seksual
  choice: Metafora dipertahankan dengan kata “berzina”.
  alternative: “berlaku tidak setia” atau “melakukan perzinaan rohani”
  rationale: Teks Ibrani sengaja memakai bahasa seksual yang keras untuk ketidaksetiaan perjanjian. “Berlaku tidak setia” terlalu melembutkan, sedangkan “perzinaan rohani” menambahkan penjelasan teologis yang tidak dinyatakan secara eksplisit dalam ayat.
- issue: Bentuk tunggal kolektif bagi Israel
  choice: Rujukan kolektif diterjemahkan dengan bentuk jamak “mereka” bila diperlukan demi kejelasan.
  alternative: 'Mempertahankan bentuk tunggal: “ia ... dengannya”.'
  rationale: Subjeknya adalah “bangsa ini” sebagai satu kesatuan, tetapi yang dimaksud adalah orang-orang Israel. Bentuk jamak alami dalam bahasa Indonesia dan tidak mengubah rujukan teologisnya.
- issue: Ungkapan kematian Musa
  choice: Idiom “berbaring bersama nenek moyangmu” dipertahankan.
  alternative: “meninggal” atau “dikumpulkan kepada nenek moyangmu”
  rationale: Pilihan ini menjaga citraan asli dan ketegangan mengenai hubungan dengan para leluhur tanpa menjabarkannya menjadi ajaran tertentu tentang keadaan sesudah mati.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan “engkau” sesuai dengan tuturan langsung ilahi kepada Musa. Kapitalisasi pronomina yang merujuk kepada Allah mengikuti konvensi penerbitan Alkitab Indonesia. Metafora dan idiom utama dipertahankan, dengan catatan kaki untuk mencegah salah pengertian.
