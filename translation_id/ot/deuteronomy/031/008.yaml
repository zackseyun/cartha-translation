  naturalness: Bahasa Indonesia modern dan registernya baik. “Yahweh sendiri berjalan di depanmu” dan “Ia sendiri akan menyertaimu” alami. Untuk paralelisme dan kesinambungan makna, “tidak akan melepaskanmu” lebih tepat dan tetap idiomatis daripada “tidak akan membiarkanmu jatuh.”
  terminology: “Yahweh” konsisten dengan keputusan nama ilahi. “Meninggalkanmu,” “Jangan takut,” dan “jangan gentar” sesuai register dan makna. Kapitalisasi “Ia” dapat dipertahankan sebagai konvensi penghormatan Indonesia, meskipun tidak dituntut oleh bahasa sumber.
