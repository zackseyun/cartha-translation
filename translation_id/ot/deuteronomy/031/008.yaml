  text: וַֽ/יהוָ֞ה ה֣וּא הַ/הֹלֵ֣ךְ לְ/פָנֶ֗י/ךָ ה֚וּא יִהְיֶ֣ה עִמָּ֔/ךְ לֹ֥א יַרְפְּ/ךָ֖ וְ/לֹ֣א יַֽעַזְבֶ֑/ךָּ לֹ֥א תִירָ֖א וְ/לֹ֥א תֵחָֽת׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/008.yaml
  text: And Yahweh himself is the one going before you[a]. He himself will be with you; he will not fail you or forsake you. Do not fear or be dismayed.
translation:
  language: id
  text: Yahweh sendiri berjalan di depanmu. Ia sendiri akan menyertaimu; Ia tidak akan melepaskanmu[a] ataupun meninggalkanmu. Jangan takut dan jangan gentar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “tidak akan membiarkanmu terlepas” atau “tidak akan gagal menopangmu.”
    reason: Alternatif untuk יַרְפְּךָ (Hifil רפה), yang dapat berarti tidak melepaskan atau tidak gagal menopang; bentuk sumber tidak menentukan gambaran khusus “jatuh.”
lexical_decisions:
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi yang terdapat langsung dalam teks Ibrani; waw pembuka tidak diterjemahkan karena ayat ini tetap mengalir alami sebagai kalimat baru dalam bahasa Indonesia.
- source_word: הוּא הַהֹלֵךְ לְפָנֶיךָ
  choice: sendiri berjalan di depanmu
  rationale: Kata ganti mandiri הוּא memberi penekanan, sedangkan bentuk partisip הַהֹלֵךְ menggambarkan tindakan yang sedang atau terus berlangsung. Ungkapan 'berjalan di depanmu' mempertahankan citra Ibrani tentang mendahului untuk memimpin dan melindungi.
- source_word: הוּא יִהְיֶה עִמָּךְ
  choice: Ia sendiri akan menyertaimu
  rationale: הוּא kembali bersifat emfatis. 'Menyertaimu' merupakan ungkapan Indonesia yang alami untuk kehadiran aktif tanpa menambahkan gagasan yang tidak ada dalam teks.
- source_word: לֹא יַרְפְּךָ
  choice: tidak akan membiarkanmu jatuh
  rationale: Bentuk Hifil dari רפה dapat berarti membiarkan terlepas, merosot, atau gagal menopang. Pilihan ini mempertahankan citra tidak membiarkan seseorang jatuh dan membedakannya dari עזב, sambil mencatat alternatif yang lebih harfiah.
- source_word: וְלֹא יַעַזְבֶךָּ
  choice: ataupun meninggalkanmu
  rationale: עזב berarti meninggalkan atau menelantarkan. 'Meninggalkanmu' jelas, bermartabat, dan tidak terlalu bertumpang tindih dengan verba sebelumnya.
- source_word: לֹא תִירָא
  choice: Jangan takut
  rationale: Bentuk imperfek di sini berfungsi sebagai larangan atau dorongan negatif; terjemahan ini langsung dan alami.
- source_word: וְלֹא תֵחָת
  choice: dan jangan gentar
  rationale: Nifal חתת dapat menyatakan menjadi remuk, ciut, atau gentar. 'Jangan gentar' menyampaikan hilangnya keberanian di hadapan ancaman dalam bahasa Indonesia yang wajar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan nama perjanjian tersebut dan membedakannya dari gelar umum untuk Tuhan.
- issue: Penekanan ganda pada הוּא
  choice: sendiri ... Ia sendiri
  alternative: Ia ... Ia
  rationale: Pengulangan kata ganti mandiri dalam bahasa Ibrani menekankan bahwa Yahweh sendirilah yang mendahului dan menyertai Yosua; penekanan ini dipertahankan tanpa menambah subjek lain.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Bentuk pronomina tunggal '-mu' mempertahankan sapaan kepada Yosua tanpa membuat jenis kelaminnya eksplisit. Paralelisme dan penekanan Ibrani dipertahankan dengan pengulangan 'sendiri'.
