  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בְנֵי/הֶ֞ם אֲשֶׁ֣ר לֹֽא יָדְע֗וּ יִשְׁמְעוּ֙ וְ/לָ֣מְד֔וּ לְ/יִרְאָ֖ה אֶת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם כָּל הַ/יָּמִ֗ים אֲשֶׁ֨ר אַתֶּ֤ם חַיִּים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת הַ/יַּרְדֵּ֛ן שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/013.yaml
  text: And their children[a], who have not known[c][b], shall hear and learn to fear Yahweh your God all the days that you live on the land that you are crossing the Jordan to possess.
translation:
  language: id
  text: Dan anak-anak mereka[a], yang belum mengetahuinya, akan mendengar dan belajar takut akan Yahweh, Allah kalian, selama kalian hidup di tanah yang akan kalian masuki setelah menyeberangi Sungai Yordan untuk mendudukinya.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “anak-anak laki-laki mereka.” Kata Ibrani ini dapat berarti anak laki-laki secara khusus atau anak-anak dan keturunan secara umum.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “untuk mengambilnya menjadi milik kalian” atau “untuk mewarisinya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵיהֶם
  choice: Dan anak-anak mereka
  rationale: בנים dapat berarti anak laki-laki secara khusus atau anak-anak/keturunan secara umum. Dalam konteks pengajaran perjanjian kepada generasi berikutnya, bentuk umum paling tepat.
- source_word: אֲשֶׁר לֹא יָדְעוּ
  choice: yang belum mengenal
  rationale: Bentuk perfektif ידע menunjukkan bahwa mereka belum memiliki pengetahuan atau pengalaman sebelumnya; 'belum mengenal' mempertahankan keluasan makna itu.
- source_word: יִשְׁמְעוּ וְלָמְדוּ
  choice: harus mendengarnya dan belajar
  rationale: Rangkaian verba menyatakan tujuan atau hasil yang diharapkan dari pembacaan Taurat. 'Harus' sesuai dengan daya imperatif kontekstual, sedangkan akhiran '-nya' secara alami merujuk kepada Taurat yang dibacakan dalam ayat sebelumnya.
- source_word: לְיִרְאָה
  choice: takut akan
  rationale: ירא dalam Ulangan mencakup rasa takut, hormat, dan ketaatan perjanjian. Ungkapan baku 'takut akan' mempertahankan bobot teologis tanpa mempersempitnya menjadi sekadar menghormati.
- source_word: יְהוָה אֱלֹהֵיכֶם
  choice: Yahweh, Allahmu
  rationale: Nama ilahi ditransliterasikan sebagai 'Yahweh'. Sufiks orang kedua jamak pada אֱלֹהֵיכֶם diterjemahkan dengan bentuk Indonesia yang wajar; cakupan jamaknya dijelaskan dalam catatan.
- source_word: כָּל הַיָּמִים אֲשֶׁר אַתֶּם חַיִּים
  choice: selama kamu hidup
  rationale: Ungkapan idiomatis ini menyatakan seluruh masa hidup. Terjemahan alami ini menyampaikan durasi penuh tanpa kekakuan 'sepanjang segala hari'.
- source_word: עַל הָאֲדָמָה
  choice: di tanah
  rationale: אֲדָמָה di sini menunjuk wilayah tempat Israel akan hidup, bukan tanah atau debu dalam arti sempit.
- source_word: אֲשֶׁר אַתֶּם עֹבְרִים אֶת הַיַּרְדֵּן שָׁמָּה לְרִשְׁתָּהּ
  choice: yang akan kamu duduki setelah menyeberangi Sungai Yordan
  rationale: Susunan Indonesia ini memperjelas bahwa penyeberangan Yordan menuju tanah tersebut dan bahwa ירשׁ berarti mengambil lalu menduduki tanah itu, sambil tetap mempertahankan urutan gagasan sumber.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian YHWH secara langsung. 'Yahweh' mempertahankannya sebagai nama pribadi, bukan menggantinya dengan gelar.
- issue: Cakupan בנים dalam pengajaran perjanjian
  choice: anak-anak
  alternative: anak-anak laki-laki
  rationale: Konteks menunjuk generasi berikutnya secara luas; menerjemahkannya hanya sebagai anak laki-laki akan mempersempit cakupan yang wajar.
- issue: Makna לְיִרְאָה
  choice: takut akan
  alternative: menghormati
  rationale: '''Takut akan'' mempertahankan ketegangan makna antara gentar, hormat, dan kesetiaan kepada Allah; ''menghormati'' saja terlalu melunakkan istilah sumber.'
- issue: Nuansa ירשׁ mengenai tanah
  choice: menduduki
  alternative: mewarisi
  rationale: Dalam konteks Ulangan, ירשׁ dapat mencakup memperoleh, mengambil alih, dan memiliki tanah. 'Menduduki' menjaga unsur masuk dan menguasai, sedangkan 'mewarisi' dapat menonjolkan hanya satu sisi maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Kamu' dipakai sebagai sapaan kolektif kepada Israel, dengan catatan untuk bentuk jamak pada frasa yang berpotensi disalahpahami. Struktur dibuat alami dalam bahasa Indonesia tanpa menghilangkan urutan mendengar, belajar, dan takut akan Yahweh.
