source:
  edition: WLC
  text: כִּ֣י יָדַ֗עְתִּי אַחֲרֵ֤י מוֹתִ/י֙ כִּֽי הַשְׁחֵ֣ת תַּשְׁחִת֔וּ/ן וְ/סַרְתֶּ֣ם מִן הַ/דֶּ֔רֶךְ אֲשֶׁ֥ר צִוִּ֖יתִי אֶתְ/כֶ֑ם וְ/קָרָ֨את אֶתְ/כֶ֤ם הָֽ/רָעָה֙ בְּ/אַחֲרִ֣ית הַ/יָּמִ֔ים כִּֽי תַעֲשׂ֤וּ אֶת הָ/רַע֙ בְּ/עֵינֵ֣י יְהוָ֔ה לְ/הַכְעִיס֖/וֹ בְּ/מַעֲשֵׂ֥ה יְדֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/029.yaml
  text: For I know that after my death you will surely act corruptly and turn aside from the way that I commanded you[a], and evil will befall you in the latter days, because you will do what is evil in the eyes of Yahweh[c][b], provoking him to anger by the work of your hands.
translation:
  language: id
  text: Sebab aku tahu bahwa sesudah aku mati, kamu pasti akan menjadi rusak[a] dan menyimpang dari jalan yang telah kuperintahkan kepadamu. Malapetaka[b] akan menimpa kamu pada hari-hari mendatang[c], karena kamu akan melakukan apa yang jahat di mata Yahweh dan membangkitkan murka-Nya dengan hasil perbuatan tanganmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “kamu pasti akan merusak dirimu sendiri” atau “kamu pasti akan menjadi bobrok.” Bahasa Ibrani menegaskan kata kerja “rusak” dan di sini dapat dipahami secara refleksif atau intransitif.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “malapetaka” juga dapat berarti “kejahatan” atau “bencana,” bergantung pada konteks.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “pada akhir hari-hari.” Ungkapan ini dapat berarti “pada hari-hari terakhir” atau, secara lebih umum, “pada masa yang akan datang.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי יָדַעְתִּי
  choice: Sebab aku tahu
  rationale: כִּי menjelaskan dasar bagi pernyataan sebelumnya, sedangkan bentuk perfektum יָדַעְתִּי dalam konteks ini menyatakan pengetahuan Musa yang pasti.
- source_word: אַחֲרֵי מוֹתִי
  choice: sesudah aku mati
  rationale: Ungkapan verbal ini lebih alami dalam bahasa Indonesia modern daripada bentuk nominal 'sesudah kematianku', tanpa mengubah makna.
- source_word: הַשְׁחֵת תַּשְׁחִתוּן
  choice: kamu pasti akan bertindak bejat
  rationale: Infinitif absolut bersama verba finit menegaskan kepastian atau intensitas. 'Bertindak bejat' menyampaikan kebobrokan moral tanpa menambahkan objek yang tidak ada dalam bahasa Ibrani.
- source_word: וְסַרְתֶּם מִן־הַדֶּרֶךְ
  choice: dan menyimpang dari jalan
  rationale: Mempertahankan metafora perjanjian tentang meninggalkan pola hidup yang diperintahkan.
- source_word: אֲשֶׁר צִוִּיתִי אֶתְכֶם
  choice: yang telah kuperintahkan kepadamu
  rationale: Menyatakan Musa sebagai pemberi perintah dan memakai bentuk Indonesia yang alami bagi tindakan yang sudah dilakukan.
- source_word: וְקָרָאת אֶתְכֶם הָרָעָה
  choice: Malapetaka akan menimpa kamu
  rationale: Dalam konstruksi ini קרא berarti datang atau menimpa, dan רָעָה menunjuk pada keadaan buruk atau bencana; 'malapetaka' paling jelas menyampaikan akibat buruk yang dialami.
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: pada kemudian hari
  rationale: Ungkapan ini berorientasi pada masa depan dan dalam konteks dapat, tetapi tidak harus, bermakna eskatologis. Pilihan ini menjaga keluasan maknanya.
- source_word: כִּי תַעֲשׂוּ אֶת־הָרַע
  choice: karena kamu akan melakukan apa yang jahat
  rationale: Menerjemahkan penilaian moral bahasa Ibrani secara langsung dan wajar dalam bahasa Indonesia.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Mempertahankan idiom Ibrani tentang penilaian Yahweh serta nama ilahi yang terdapat dalam teks.
- source_word: לְהַכְעִיסוֹ
  choice: membangkitkan murka-Nya
  rationale: 'Menyampaikan bentuk kausatif: tindakan umat menyebabkan Yahweh murka.'
- source_word: בְּמַעֲשֵׂה יְדֵיכֶם
  choice: dengan perbuatan tanganmu
  rationale: Mempertahankan ungkapan konkret bahasa Ibrani, yang dalam konteks dapat mencakup hasil karya seperti berhala tanpa mempersempit makna secara eksplisit.
theological_decisions:
- issue: Makna הַשְׁחֵת תַּשְׁחִתוּן
  choice: bertindak bejat
  alternative: merusak dirimu sendiri / menjadi bobrok
  rationale: Bentuk Hifil dapat dipahami secara refleksif atau intransitif dalam konteks ini. Teks utama tidak menentukan objek dan catatan kaki mempertahankan alternatifnya.
- issue: Cakupan temporal בְּאַחֲרִית הַיָּמִים
  choice: pada kemudian hari
  alternative: pada akhir zaman / pada hari-hari terakhir
  rationale: Ungkapan tersebut dapat mengandung bobot eskatologis, tetapi konteks tidak mewajibkan skema akhir zaman tertentu.
- issue: Penerjemahan יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Nama pribadi ilahi ditransliterasikan agar identitas nama perjanjian dalam teks sumber tetap tampak, tanpa menggantinya dengan gelar.
- issue: Perbuatan tangan sebagai kemungkinan rujukan kepada berhala
  choice: perbuatan tanganmu
  alternative: berhala buatan tanganmu
  rationale: Walaupun ungkapan ini dapat menyiratkan berhala, teks tidak menyebutkannya secara eksplisit; terjemahan mempertahankan keluasan referensinya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan mudah dipahami. Pronomina 'kamu' mengikuti sapaan jamak kolektif kepada Israel; kapitalisasi '-Nya' mengikuti kebiasaan ejaan religius Indonesia. Struktur kalimat dibagi dua untuk keterbacaan tanpa mengubah hubungan logis antarklausa.
