  text: בְּ/ב֣וֹא כָל יִשְׂרָאֵ֗ל לֵ/רָאוֹת֙ אֶת פְּנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ בַּ/מָּק֖וֹם אֲשֶׁ֣ר יִבְחָ֑ר תִּקְרָ֞א אֶת הַ/תּוֹרָ֥ה הַ/זֹּ֛את נֶ֥גֶד כָּל יִשְׂרָאֵ֖ל בְּ/אָזְנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/011.yaml
  text: when all Israel comes to appear before Yahweh your God at the place that he will choose[a], you shall read this law before all Israel in their hearing.
translation:
  language: id
  text: ketika seluruh Israel datang untuk menghadap Yahweh, Allahmu[a], di tempat yang akan dipilih-Nya, engkau harus membacakan hukum ini di hadapan seluruh Israel supaya mereka mendengarnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “untuk melihat wajah Yahweh, Allahmu,” sebuah ungkapan yang berarti datang menghadap atau hadir di hadapan-Nya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּבוֹא כָל־יִשְׂרָאֵל
  choice: ketika seluruh Israel datang
  rationale: ב dengan infinitif konstruktus membentuk klausa waktu; 'ketika ... datang' alami dalam bahasa Indonesia, sedangkan 'seluruh Israel' mempertahankan ungkapan kolektif.
- source_word: לֵרָאוֹת אֶת־פְּנֵי
  choice: untuk menghadap
  rationale: Dalam konteks ziarah dan ibadah, ungkapan harfiah 'melihat wajah' berarti hadir di hadapan seseorang; 'menghadap' menyampaikan maknanya secara alami tanpa menyiratkan bahwa umat melihat wajah Allah secara kasatmata.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Menerjemahkan אֱלֹהִים dan akhiran orang kedua tunggal secara langsung, sesuai sapaan perjanjian kepada Israel sebagai satu kesatuan.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחָר
  choice: di tempat yang akan dipilih-Nya
  rationale: Mempertahankan tema khas Ulangan tentang tempat ibadah pilihan Allah serta nuansa futur dari bentuk verba.
- source_word: תִּקְרָא
  choice: engkau harus membacakan
  rationale: Dengan 'hukum ini' sebagai objek dan seluruh Israel sebagai pendengar, קרא menunjuk pada pembacaan publik dengan suara nyaring; 'membacakan' lebih tepat daripada sekadar 'membaca'.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: hukum ini
  rationale: Dalam konteks Ulangan, frasa ini menunjuk pada hukum atau pengajaran perjanjian; 'hukum ini' jelas dan mudah dipahami.
- source_word: נֶגֶד כָּל־יִשְׂרָאֵל
  choice: di hadapan seluruh Israel
  rationale: נֶגֶד menunjukkan pembacaan publik di depan atau dalam kehadiran umat yang berhimpun.
- source_word: בְּאָזְנֵיהֶם
  choice: supaya mereka mendengarnya
  rationale: Ungkapan harfiah 'di telinga mereka' menyatakan bahwa bacaan itu harus terdengar oleh mereka; bentuk tujuan ini alami dalam bahasa Indonesia dan mempertahankan daya pragmatisnya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama perjanjian YHWH secara langsung; transliterasi 'Yahweh' mempertahankannya sebagai nama diri.
- issue: Ungkapan melihat wajah Allah
  choice: menghadap Yahweh
  alternative: melihat wajah Yahweh
  rationale: Konteksnya adalah umat datang ke hadirat Allah untuk ibadah, bukan penegasan bahwa mereka melihat wajah-Nya secara jasmani. Catatan kaki mempertahankan bentuk harfiahnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'engkau' mempertahankan sapaan orang kedua tunggal kepada Israel sebagai satu kesatuan. 'Membacakan' dan 'supaya mereka mendengarnya' membuat konteks pembacaan publik jelas tanpa mengubah isinya.
