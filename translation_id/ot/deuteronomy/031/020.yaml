reference: Deuteronomy 31:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי אֲבִיאֶ֜/נּוּ אֶֽל הָ/אֲדָמָ֣ה אֲשֶׁר נִשְׁבַּ֣עְתִּי לַ/אֲבֹתָ֗י/ו זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ וְ/אָכַ֥ל וְ/שָׂבַ֖ע וְ/דָשֵׁ֑ן וּ/פָנָ֞ה אֶל אֱלֹהִ֤ים אֲחֵרִים֙ וַ/עֲבָד֔וּ/ם וְ/נִ֣אֲצ֔וּ/נִי וְ/הֵפֵ֖ר אֶת בְּרִיתִֽ/י־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/020.yaml
  text: For when I bring him into the land that I swore to his fathers[a], a land flowing with milk and honey, and he eats and is satisfied and grows fat, then he will turn to other gods and serve them[b], and spurn me and break my covenant.
translation:
  language: id
  text: Sebab, ketika Aku membawa dia ke negeri yang dengan sumpah telah Kujanjikan kepada leluhurnya—negeri yang berlimpah susu dan madu—ia akan makan hingga kenyang dan menjadi gemuk. Lalu ia akan berpaling kepada allah-allah lain; mereka akan mengabdi kepada allah-allah itu dan menghina Aku, lalu ia akan melanggar perjanjian-Ku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Teks Ibrani menggambarkan Israel secara bergantian sebagai satu umat dan sebagai banyak orang: mula-mula “dia/ia”, kemudian “mereka” pada tindakan mengabdi dan menghina, lalu kembali menjadi “ia” pada tindakan melanggar perjanjian.'
    reason: Menjelaskan pergantian tunggal–jamak–tunggal yang nyata dalam teks Ibrani dan sengaja dipertahankan dalam terjemahan.
lexical_decisions:
- source_word: כִּי
  choice: Sebab, ketika
  rationale: Mengungkapkan sekaligus fungsi penjelas/kausal dan nuansa waktu yang mengawali rangkaian peristiwa mendatang.
- source_word: אֲבִיאֶנּוּ
  choice: Aku membawa dia
  rationale: Bentuk kausatif orang pertama dengan objek tunggal maskulin; 'dia' mempertahankan penggambaran Israel sebagai satu umat secara kolektif.
- source_word: הָאֲדָמָה
  choice: negeri
  rationale: Dalam konteks geografis dan perjanjian ini, kata tersebut menunjuk pada negeri yang dijanjikan, bukan sekadar tanah atau permukaan bumi.
- source_word: נִשְׁבַּעְתִּי לַאֲבֹתָיו
  choice: yang dengan sumpah telah Kujanjikan kepada leluhurnya
  rationale: Menghasilkan bahasa Indonesia alami sambil mempertahankan unsur sumpah dan akhiran tunggal kolektif pada 'leluhurnya'.
- source_word: זָבַת חָלָב וּדְבַשׁ
  choice: negeri yang berlimpah susu dan madu
  rationale: Ungkapan Indonesia yang alami untuk metafora kelimpahan; tidak mengubahnya menjadi penjelasan abstrak seperti 'sangat makmur'.
- source_word: וְאָכַל וְשָׂבַע וְדָשֵׁן
  choice: ia akan makan hingga kenyang dan menjadi gemuk
  rationale: Mempertahankan gambaran konkret tentang makan, kepuasan, dan kegemukan yang menandai kelimpahan sekaligus bahaya rasa aman diri.
- source_word: וּפָנָה אֶל אֱלֹהִים אֲחֵרִים
  choice: ia akan berpaling kepada allah-allah lain
  rationale: Menerjemahkan tindakan beralih arah dan objek jamaknya tanpa menambahkan label teologis seperti 'murtad' atau 'melakukan penyembahan berhala'.
- source_word: וַעֲבָדוּם
  choice: mereka akan mengabdi kepada allah-allah itu
  rationale: Bentuk Ibrani memiliki subjek jamak dan objek jamak. 'Mengabdi' mempertahankan cakupan עבד sebagai pelayanan dan kesetiaan religius; objek diulang agar rujukannya jelas dalam bahasa Indonesia.
- source_word: וְנִאֲצוּנִי
  choice: dan menghina Aku
  rationale: Kata kerja ini menyatakan perlakuan penuh penghinaan atau peremehan. 'Menghina' alami dan mempertahankan daya kecamnya.
- source_word: וְהֵפֵר אֶת בְּרִיתִי
  choice: lalu ia akan melanggar perjanjian-Ku
  rationale: Kata kerja kembali ke bentuk tunggal dan menyatakan pembatalan atau pelanggaran terhadap perjanjian; 'melanggar' merupakan padanan perjanjian yang jelas dan wajar.
theological_decisions:
- issue: Pergantian jumlah gramatikal dalam penggambaran Israel
  choice: Mempertahankan pola tunggal pada 'dia/ia', beralih ke jamak pada 'mereka akan mengabdi ... dan menghina', lalu kembali ke tunggal pada 'ia akan melanggar'.
  alternative: Menyeragamkan seluruh ayat menjadi tunggal atau seluruhnya menjadi jamak.
  rationale: Teks Masoret secara nyata bergerak dari bentuk tunggal pada אֲבִיאֶנּוּ dan rangkaian וְאָכַל ... וּפָנָה, ke bentuk jamak pada וַעֲבָדוּם dan וְנִאֲצוּנִי, kemudian kembali ke bentuk tunggal pada וְהֵפֵר. Pergantian itu memperlihatkan Israel sekaligus sebagai satu umat dan sebagai banyak orang, sehingga tidak boleh diratakan.
- issue: Bahasa ketidaksetiaan terhadap perjanjian
  choice: Menerjemahkan tindakan konkret sebagai 'berpaling', 'mengabdi', 'menghina', dan 'melanggar perjanjian'.
  alternative: Merangkum semuanya dengan istilah tafsiran seperti 'murtad' atau 'melakukan penyembahan berhala'.
  rationale: Teks menyebutkan tindakan-tindakannya secara langsung. Terjemahan mempertahankan bahasa sumber tanpa memasukkan rumusan doktrinal tambahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Negeri', 'leluhur', dan 'perjanjian' mudah dipahami sekaligus sesuai dengan konteks perjanjian. Tanda pisah mengapit keterangan aposisional tentang negeri; titik koma membantu pembaca mengikuti pergantian subjek dari tunggal ke jamak.
