  text: And Moses commanded them[a], saying, “At the end of every seven years, at the appointed time of the year of release[c][b], at the Feast of Booths,”
translation:
  language: id
  text: Musa memerintahkan mereka dengan berkata, “Pada akhir setiap tujuh tahun[a], pada waktu yang telah ditetapkan dalam tahun pembebasan[b], pada Hari Raya Pondok Daun[c],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “pada akhir tujuh tahun.” Konteks siklus tahun ketujuh yang berulang mendukung terjemahan “setiap tujuh tahun.”
    reason: lexical_alternative
  - marker: b
    text: “Tahun pembebasan” menerjemahkan istilah Ibrani untuk pelepasan pada tahun ketujuh; secara tradisional disebut “tahun sabat.”
    reason: lexical_alternative
  - marker: c
    text: Secara tradisional, “Hari Raya Tabernakel.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: memerintahkan
  rationale: Kata kerja צוה menyatakan pemberian perintah atau amanat; “memerintahkan” mempertahankan daya direktifnya secara alami dalam bahasa Indonesia.
- source_word: אוֹתָם
  choice: mereka
  rationale: Pronomina objek maskulin jamak ini merujuk kepada pihak-pihak yang disebut dalam konteks ayat sebelumnya.
- source_word: לֵאמֹר
  choice: katanya
  rationale: Bentuk ini memperkenalkan ujaran langsung. “Katanya” merupakan padanan Indonesia yang ringkas dan wajar.
- source_word: מִקֵּץ שֶׁבַע שָׁנִים
  choice: pada akhir setiap tujuh tahun
  rationale: מִקֵּץ berarti “pada akhir.” Kata “setiap” menyatakan siklus tujuh tahunan yang berulang dalam konteks hukum ini tanpa mengubah titik waktunya.
- source_word: בְּמוֹעֵד
  choice: pada waktu yang telah ditetapkan
  rationale: מוֹעֵד menunjuk kepada waktu atau kesempatan yang ditentukan, dengan nuansa kalender perayaan dalam konteks ini.
- source_word: שְׁנַת הַשְּׁמִטָּה
  choice: tahun pembebasan
  rationale: שְׁמִטָּה menunjuk kepada pelepasan atau pembebasan pada tahun ketujuh. Pilihan ini menerjemahkan makna dasarnya tanpa membatasi istilah itu hanya pada penghapusan utang.
- source_word: בְּחַג הַסֻּכּוֹת
  choice: pada Hari Raya Pondok Daun
  rationale: חַג berarti hari raya atau perayaan, sedangkan סֻכּוֹת berarti pondok-pondok. “Hari Raya Pondok Daun” adalah ungkapan Indonesia yang mudah dikenali dan tetap mempertahankan gambaran Ibraninya.
