translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur kutipan dibiarkan belum selesai karena kalimat berlanjut ke ayat berikutnya. Istilah “tahun pembebasan” mempertahankan keluasan makna שְׁמִטָּה, sedangkan “Hari Raya Pondok Daun” memakai nama yang lazim dan mudah dipahami.
