source:
  edition: WLC
  text: הַקְהֵ֣ל אֶת הָ/עָ֗ם הָֽ/אֲנָשִׁ֤ים וְ/הַ/נָּשִׁים֙ וְ/הַ/טַּ֔ף וְ/גֵרְ/ךָ֖ אֲשֶׁ֣ר בִּ/שְׁעָרֶ֑י/ךָ לְמַ֨עַן יִשְׁמְע֜וּ וּ/לְמַ֣עַן יִלְמְד֗וּ וְ/יָֽרְאוּ֙ אֶת יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/שָֽׁמְר֣וּ לַ/עֲשׂ֔וֹת אֶת כָּל דִּבְרֵ֖י הַ/תּוֹרָ֥ה הַ/זֹּֽאת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/012.yaml
  text: Assemble the people—the men[a], the women, the little children, and the sojourner within your gates—so that they may hear, and so that they may learn and fear Yahweh your God[d][c][b], and be careful to do all the words of this law.
translation:
  language: id
  text: Kumpulkanlah umat itu—laki-laki, perempuan, anak-anak kecil, dan pendatang[a] yang ada di kota-kota kalian[b]—agar mereka mendengar, belajar, dan takut[c] akan Yahweh, Allah kalian, serta dengan saksama melaksanakan segala perkataan hukum ini.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau «warga pendatang». Istilah Ibrani ini menunjuk kepada orang dari luar Israel yang menetap di tengah Israel.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, «yang ada di dalam gerbang-gerbang kalian», sebuah ungkapan yang menunjuk kepada orang-orang yang tinggal di kota-kota atau komunitas kalian.
    reason: cultural_note
  - marker: c
    text: Atau «hormat dan gentar kepada». Kata Ibrani ini mencakup rasa takut yang penuh hormat dan mendorong ketaatan.
    reason: lexical_alternative
  - marker: d
    text: Atau «pengajaran ini» atau «petunjuk ini». Kata Ibrani torah dapat berarti pengajaran atau petunjuk, selain hukum; dalam konteks perjanjian ini, «hukum» paling sesuai.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְהֵל
  choice: Kumpulkanlah
  rationale: Bentuk imperatif Hifil dari קהל memerintahkan agar umat dihimpun menjadi satu pertemuan. “Kumpulkanlah” alami dalam bahasa Indonesia dan mempertahankan daya perintah teks.
- source_word: הָעָם
  choice: umat itu
  rationale: עָם menunjuk kepada komunitas perjanjian Israel secara keseluruhan. “Umat” sesuai dengan konteks keagamaan-perjanjian tanpa mengubahnya menjadi istilah kelembagaan.
- source_word: הָאֲנָשִׁים וְהַנָּשִׁים וְהַטַּף
  choice: laki-laki, perempuan, anak-anak kecil
  rationale: Teks Ibrani menyebut kelompok-kelompok ini secara eksplisit. טַף terutama menunjuk kepada anak-anak kecil atau tanggungan, sehingga nuansa itu dipertahankan.
- source_word: וְגֵרְךָ
  choice: pendatang
  rationale: גֵּר adalah orang bukan pribumi yang menetap di tengah Israel dan memiliki kedudukan sosial-hukum tertentu. “Pendatang” lebih alami daripada “orang asing” dan tidak menyiratkan bahwa ia hanya singgah sebentar.
- source_word: אֲשֶׁר בִּשְׁעָרֶיךָ
  choice: yang tinggal di kota-kota kalian
  rationale: Secara harfiah frasa ini berarti “yang ada di dalam gerbang-gerbang kalian,” tetapi dalam Ulangan “gerbang” lazim menjadi metonimia bagi kota atau permukiman. Terjemahan utama menyampaikan maksud idiom itu, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: לְמַעַן יִשְׁמְעוּ וּלְמַעַן יִלְמְדוּ
  choice: supaya mereka mendengar dan belajar
  rationale: 'Terjemahan ini mempertahankan rangkaian tujuan: umat dihimpun agar mendengar pembacaan hukum dan belajar darinya, tanpa menambahkan objek yang tidak dinyatakan dalam teks.'
- source_word: וְיָרְאוּ אֶת יְהוָה אֱלֹהֵיכֶם
  choice: takut akan Yahweh, Allah kalian
  rationale: ירא dalam konteks perjanjian mencakup rasa takut, hormat, dan ketundukan. “Takut akan” mempertahankan ungkapan utama teks, sementara catatan menjelaskan cakupan maknanya. Bentuk jamak אֱלֹהֵיכֶם diterjemahkan dengan “Allah kalian.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh” agar nama perjanjian yang terdapat langsung dalam teks tetap tampak, bukan diganti dengan suatu gelar.
- source_word: וְשָׁמְרוּ לַעֲשׂוֹת
  choice: dengan saksama melaksanakan
  rationale: Gabungan שמר dengan infinitif menyatakan pemeliharaan atau perhatian cermat yang diwujudkan dalam tindakan. “Dengan saksama melaksanakan” alami dalam bahasa Indonesia dan mempertahankan unsur ketelitian serta ketaatan.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: semua perkataan hukum ini
  rationale: דִּבְרֵי secara khusus berarti “perkataan-perkataan,” sedangkan תּוֹרָה di sini berada dalam konteks dokumen perjanjian dan tepat diterjemahkan “hukum.”
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama pribadi perjanjian יהוה. “Yahweh” mempertahankan nama itu secara langsung dan membedakannya dari gelar ilahi.
- issue: Makna takut kepada Allah
  choice: takut akan Yahweh
  alternative: menghormati Yahweh
  rationale: Kata ירא sungguh memuat rasa hormat dan kekaguman yang taat, tetapi unsur “takut” tidak boleh dihapus. Catatan kaki mempertahankan keluasan maknanya tanpa mereduksi ketegangan teologis tersebut.
- issue: Penyebutan kelompok-kelompok dalam pertemuan umat
  choice: laki-laki, perempuan, anak-anak kecil, dan pendatang
  alternative: seluruh orang Israel
  rationale: Teks sengaja merinci kelompok-kelompok yang harus hadir. Perincian itu dipertahankan agar cakupan perintah, termasuk anak kecil dan penduduk pendatang, tidak diratakan menjadi sebutan umum.
- issue: Cakupan תּוֹרָה
  choice: hukum
  alternative: pengajaran atau petunjuk
  rationale: תּוֹרָה dapat berarti pengajaran atau petunjuk, tetapi dalam konteks pembacaan dokumen perjanjian di Ulangan, “hukum” paling sesuai. Alternatif semantisnya tetap dicatat.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. Bentuk “kalian” dipakai karena sufiks Ibrani untuk “Allah kalian” dan “kota-kota kalian” berbentuk jamak. Idiom “di dalam gerbang-gerbang kalian” dinaturalkan menjadi “di kota-kota kalian,” dengan bentuk harfiahnya dipertahankan dalam catatan kaki. Tanda pisah menandai perincian aposisional kelompok-kelompok umat.
