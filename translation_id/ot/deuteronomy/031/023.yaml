id: DEU.31.23
reference: Deuteronomy 31:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וַ/יְצַ֞ו אֶת יְהוֹשֻׁ֣עַ בִּן נ֗וּן וַ/יֹּאמֶר֮ חֲזַ֣ק וֶֽ/אֱמָץ֒ כִּ֣י אַתָּ֗ה תָּבִיא֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל הָ/אָ֖רֶץ אֲשֶׁר נִשְׁבַּ֣עְתִּי לָ/הֶ֑ם וְ/אָנֹכִ֖י אֶֽהְיֶ֥ה עִמָּֽ/ךְ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/023.yaml
  text: And he commanded Joshua son of Nun and said[a], “Be strong and courageous, for you will bring the sons of Israel into the land that I swore to them, and I will be with you.”
translation:
  language: id
  text: Ia memberi perintah kepada Yosua bin Nun dan berkata, “Hendaklah engkau kuat dan berani, sebab engkau akan membawa anak-anak Israel[a] masuk ke negeri yang telah Kujanjikan dengan sumpah kepada mereka. Aku sendiri akan menyertai engkau.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang Israel” atau “umat Israel”. Secara harfiah, bahasa Ibrani berbunyi “anak-anak Israel”.
    reason: Menjelaskan bahwa ungkapan kekeluargaan Ibrani berfungsi sebagai sebutan kolektif bagi umat Israel dan mencegah pembacaan yang terbatas pada anak-anak menurut usia.
lexical_decisions:
- source_word: וַיְצַו
  choice: Ia memberi perintah
  rationale: Bentuk piel dari צוה menyatakan tindakan memerintah atau memberi amanat. Ungkapan ini wajar dalam bahasa Indonesia dan mempertahankan bobot penugasan resmi dalam konteks ini.
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: Yosua bin Nun
  rationale: Nama-nama dialihaksarakan menurut bentuk yang lazim dalam bahasa Indonesia; 'bin Nun' mempertahankan patronimik secara ringkas dan alami.
- source_word: חֲזַק וֶאֱמָץ
  choice: Hendaklah engkau kuat dan berani
  rationale: Pasangan perintah ini menyerukan kekuatan dan keberanian atau keteguhan. Pilihan ini dekat dengan unsur-unsur Ibrani tanpa menambahkan kata 'hati' yang tidak dinyatakan dalam teks.
- source_word: כִּי
  choice: sebab
  rationale: Di sini כִּי memperkenalkan dasar bagi seruan sebelumnya. 'Sebab' menyatakan hubungan kausal dengan jelas dan sesuai dengan ragam bahasa yang bermartabat.
- source_word: תָּבִיא
  choice: engkau akan membawa ... masuk
  rationale: Bentuk hifil dari בוא bersifat kausatif, yaitu membawa masuk. Terjemahan ini mempertahankan unsur gerak masuk yang terdapat dalam bentuk Ibraninya.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  rationale: Ungkapan ini mempertahankan citra kekerabatan dalam bentuk Ibrani secara transparan. Karena dalam konteks ini ungkapan tersebut menunjuk kepada umat Israel secara kolektif, padanan yang lebih idiomatis dicantumkan dalam catatan kaki.
- source_word: הָאָרֶץ
  choice: negeri
  rationale: Dalam konteks janji perjanjian, הָאָרֶץ menunjuk kepada wilayah yang akan dimasuki Israel. 'Negeri' merupakan padanan Indonesia yang alami dan tidak membatasi maknanya menjadi sekadar tanah fisik.
- source_word: אֲשֶׁר נִשְׁבַּעְתִּי לָהֶם
  choice: yang telah Kujanjikan dengan sumpah kepada mereka
  rationale: Kata kerja נשבע menyatakan bersumpah. Rumusan Indonesia ini mempertahankan unsur sumpah dan mengungkapkan secara alami bahwa negeri itulah pokok janji bersumpah tersebut, tanpa menambahkan secara eksplisit kata 'memberikan'.
- source_word: וְאָנֹכִי אֶהְיֶה עִמָּךְ
  choice: Aku sendiri akan menyertai engkau
  rationale: Kata ganti mandiri אָנֹכִי memberi penekanan, yang ditampilkan melalui 'Aku sendiri'. 'Menyertai engkau' merupakan ungkapan Indonesia yang alami bagi formula kehadiran ilahi ini.
theological_decisions:
- issue: Subjek tersirat pada וַיְצַו dan וַיֹּאמֶר
  choice: Ia memberi perintah ... dan berkata
  alternative: TUHAN memberi perintah ... dan berfirman
  rationale: Teks ayat ini memakai subjek orang ketiga tunggal yang tersirat. 'Ia' mempertahankan alur Ibrani dan menghindari penyisipan nama ilahi yang tidak tertulis dalam ayat ini; konteks sebelumnya mengidentifikasi pembicaranya.
- issue: Cakupan בְּנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  alternative: orang Israel; umat Israel
  rationale: Terjemahan utama mempertahankan bentuk kekeluargaan dan bentuk maskulin gramatikal teks Ibrani, sementara catatan menjelaskan fungsi kolektifnya agar tidak disalahpahami sebagai hanya anak-anak dalam arti usia muda.
- issue: Penekanan pada אָנֹכִי
  choice: Aku sendiri akan menyertai engkau
  alternative: Aku akan menyertai engkau
  rationale: Kata ganti mandiri memberi tekanan pada pribadi pembicara. 'Aku sendiri' mengungkapkan penekanan itu tanpa mengembangkan janji tersebut melampaui teks.
translation_notes:
  register: Bahasa yang dipakai modern, langsung, dan bermartabat. Bentuk 'engkau' dipertahankan untuk sapaan tunggal kepada Yosua. Kata ganti ilahi dalam kutipan ditulis dengan huruf kapital menurut kebiasaan ejaan Alkitab bahasa Indonesia, sedangkan subjek naratif tetap 'Ia' karena nama pembicara tidak disebutkan secara eksplisit dalam ayat ini.
