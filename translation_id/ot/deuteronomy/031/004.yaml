id: DEU.31.4
reference: Deuteronomy 31:4
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עָשָׂ֤ה יְהוָה֙ לָ/הֶ֔ם כַּ/אֲשֶׁ֣ר עָשָׂ֗ה לְ/סִיח֥וֹן וּ/לְ/ע֛וֹג מַלְכֵ֥י הָ/אֱמֹרִ֖י וּ/לְ/אַרְצָ֑/ם אֲשֶׁ֥ר הִשְׁמִ֖יד אֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/004.yaml
  text: And the LORD will do to them just as he did to Sihon and Og, the kings of the Amorites, and to their land, when he destroyed them.
translation:
  language: id
  text: TUHAN akan memperlakukan mereka seperti Dia memperlakukan Sihon dan Og, raja-raja orang Amori, beserta negeri mereka, ketika Dia memusnahkan mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשָׂה ... לָהֶם
  choice: akan memperlakukan mereka
  rationale: Secara idiomatis menyampaikan tindakan TUHAN terhadap pihak yang dimaksud; lebih alami dalam bahasa Indonesia daripada terjemahan harfiah 'akan berbuat kepada mereka'.
- source_word: יְהוָה
  choice: TUHAN
  rationale: Mengikuti konvensi terjemahan Alkitab bahasa Indonesia untuk Tetragramaton, dengan huruf kapital.
- source_word: מַלְכֵי הָאֱמֹרִי
  choice: raja-raja orang Amori
  rationale: Bentuk jamak konstruk merujuk kepada Sihon dan Og sebagai raja-raja Amori.
- source_word: וּלְאַרְצָם
  choice: beserta negeri mereka
  rationale: Mempertahankan negeri sebagai objek tambahan dari tindakan TUHAN, dalam susunan Indonesia yang alami.
- source_word: הִשְׁמִיד
  choice: memusnahkan
  rationale: 'Mencerminkan makna kausatif verba Hifil yang kuat: menyebabkan binasa atau menghancurkan sampai tuntas.'
theological_decisions:
- issue: Rujukan pronomina pada אֹתָם
  choice: '''mereka'' dipertahankan tanpa mempersempit rujukannya'
  alternative: mengganti dengan 'raja-raja itu' atau 'mereka beserta negeri mereka'
  rationale: Bentuk Ibrani bersifat maskulin jamak dan konteksnya dapat mencakup Sihon dan Og serta pihak yang terkait dengan mereka; terjemahan tidak seharusnya menyelesaikan rujukan secara lebih sempit daripada teks.
- issue: Hubungan klausa אֲשֶׁר הִשְׁמִיד אֹתָם
  choice: 'diterjemahkan temporal: ''ketika Dia memusnahkan mereka'''
  alternative: 'klausa relatif: ''yang telah Dia musnahkan'''
  rationale: אֲשֶׁר lazimnya relatif, tetapi dalam konstruksi ini terjemahan temporal menghasilkan hubungan yang wajar dan sesuai konteks tanpa mengubah pokok peristiwa; pilihan ini juga mempertahankan pembacaan yang tercermin dalam lapisan konsultasi yang diaudit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kapitalisasi pronomina ilahi ('Dia') digunakan sesuai kebiasaan umum penerbitan Alkitab Indonesia. Tidak diperlukan catatan kaki karena tidak ada varian atau ambiguitas yang perlu dijelaskan kepada pembaca pada ayat ini.
