  text: לָקֹ֗חַ אֵ֣ת סֵ֤פֶר הַ/תּוֹרָה֙ הַ/זֶּ֔ה וְ/שַׂמְתֶּ֣ם אֹת֔/וֹ מִ/צַּ֛ד אֲר֥וֹן בְּרִית יְהוָ֖ה אֱלֹהֵי/כֶ֑ם וְ/הָֽיָה שָׁ֥ם בְּ/ךָ֖ לְ/עֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/026.yaml
  text: Take this Book of the Law and place it beside the ark of the covenant of Yahweh your God[b][a], and let it remain there as a witness against you.
translation:
  language: id
  text: “Ambillah kitab hukum ini[a] dan letakkanlah di samping tabut perjanjian Yahweh, Allah kalian, dan kitab itu akan tetap di sana sebagai saksi terhadap kalian.[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “gulungan hukum ini.” Kata Ibrani סֵפֶר dapat berarti gulungan atau dokumen tertulis.
    reason: lexical_alternative
  - marker: b
    text: Artinya, kitab itu menjadi kesaksian terhadap Israel apabila mereka melanggar perjanjian.
    reason: cultural_note
lexical_decisions:
- source_word: לָקֹחַ
  choice: Ambillah
  rationale: Infinitif Qal ini dipakai dengan daya imperatif. Bentuk “Ambillah” menyampaikan perintah langsung secara wajar dan bermartabat.
- source_word: סֵפֶר הַתּוֹרָה הַזֶּה
  choice: kitab hukum ini
  rationale: סֵפֶר menunjuk pada dokumen tertulis, yang pada masa itu dapat berbentuk gulungan; תּוֹרָה dalam konteks ini adalah hukum atau pengajaran perjanjian. “Kitab hukum” jelas dan lazim dalam bahasa Indonesia.
- source_word: וְשַׂמְתֶּם אֹתוֹ
  choice: dan letakkanlah
  rationale: שׂוּם berarti menaruh atau menempatkan. “Letakkanlah” mempertahankan tindakan konkret dan daya perintah dalam konteks.
- source_word: מִצַּד
  choice: di samping
  rationale: Frasa ini menyatakan lokasi pada sisi tabut, bukan di dalamnya.
- source_word: אֲרוֹן בְּרִית
  choice: tabut perjanjian
  rationale: Padanan baku dan alami bagi rangkaian konstruksi Ibrani ini.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Akhiran Ibrani secara bentuk adalah jamak, tetapi bahasa Indonesia memakai “-mu” baik untuk sapaan tunggal maupun kolektif; dalam konteks ini Israel disapa sebagai satu kesatuan.
- source_word: וְהָיָה שָׁם
  choice: Biarlah kitab itu tetap di sana
  rationale: Secara harfiah berarti “dan itu akan ada di sana.” Pilihan ini menyampaikan keadaan berkelanjutan yang dimaksud setelah kitab tersebut diletakkan.
- source_word: בְּךָ לְעֵד
  choice: sebagai saksi yang memberatkan engkau
  rationale: Dalam konteks perjanjian, לְעֵד בְּךָ memiliki nuansa kesaksian yang merugikan atau menuduh pihak yang melanggar. Ungkapan ini mempertahankan daya yuridisnya tanpa menyiratkan bahwa kitab itu sendiri adalah pelaku manusia.
theological_decisions:
- issue: Fungsi kesaksian kitab hukum
  choice: Kitab itu menjadi saksi yang memberatkan Israel dalam kerangka perjanjian.
  alternative: Kitab itu sekadar menjadi pengingat atau saksi yang netral.
  rationale: Ungkapan לְעֵד בְּךָ dan konteks Ulangan 31 menunjukkan fungsi kesaksian yang dapat menuduh Israel ketika perjanjian dilanggar. Catatan kaki menjelaskan implikasi ini tanpa menambahkan sistem teologis tertentu.
translation_notes:
  register: Bahasa Indonesia standar modern dengan ragam yang wajar, jelas, dan bermartabat. Sapaan “engkau/Allahmu” mempertahankan bentuk tunggal kolektif dalam teks Ibrani. Penanda catatan kaki ditempatkan pada unsur yang diterangkannya.
