  yaml_path: translation/ot/deuteronomy/031/030.yaml
  text: Then Moses spoke the words of this song in the hearing of all the assembly of Israel[a], until they were finished.
translation:
  language: id
  text: Lalu Musa menyampaikan kata-kata nyanyian ini kepada seluruh umat Israel, hingga kata-kata itu selesai diucapkan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sampai ia selesai mengucapkannya”—yakni, sampai Musa selesai mengucapkan kata-kata nyanyian itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu Musa menyampaikan
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi. “Lalu” menyatakan urutan secara alami, sedangkan “menyampaikan” cocok untuk perkataan yang diucapkan kepada suatu kumpulan pendengar.
- source_word: בְּאָזְנֵי
  choice: kepada
  rationale: Secara harfiah berarti “di telinga,” yaitu idiom untuk berbicara agar didengar. Dalam bahasa Indonesia, “menyampaikan ... kepada” mengungkapkan fungsi idiom itu secara wajar tanpa terjemahan harfiah yang kaku.
- source_word: כָּל קְהַל יִשְׂרָאֵל
  choice: seluruh umat Israel
  rationale: קָהָל menunjuk kepada komunitas yang berhimpun. “Seluruh umat Israel” jelas dan alami dalam bahasa Indonesia serta mempertahankan cakupan כָּל, tanpa memberi warna kelembagaan keagamaan yang tidak perlu.
- source_word: אֶת דִּבְרֵי הַשִּׁירָה הַזֹּאת
  choice: kata-kata nyanyian ini
  rationale: Terjemahan ini mempertahankan unsur eksplisit דִּבְרֵי, “kata-kata,” dan menunjuk kepada komposisi puitis yang menyusul.
- source_word: עַד תֻּמָּם
  choice: sampai semuanya selesai
  rationale: Akhiran orang ketiga jamak paling alami merujuk kepada “kata-kata” nyanyian itu. “Semuanya” mempertahankan rujukan jamak secara alami, sementara catatan kaki menjaga kemungkinan pemahaman aktif bahwa Musa menyelesaikan penyampaiannya.
theological_decisions:
- issue: Rujukan dan diatesis dalam עַד תֻּמָּם
  choice: sampai semuanya selesai
  alternative: sampai ia selesai menyampaikannya
  rationale: Bentuk Ibrani memakai akhiran jamak yang secara alami merujuk pada kata-kata nyanyian tersebut, tetapi konstruksinya dapat dipahami secara idiomatis sebagai selesainya tindakan Musa. Ambiguitas ini dipertahankan melalui teks utama dan catatan kaki, tanpa dampak doktrinal yang dipaksakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dibuat alami bagi pembaca umum; idiom Ibrani “di telinga” diterjemahkan menurut fungsinya. Penanda catatan kaki ditempatkan setelah kalimat yang dijelaskannya.
