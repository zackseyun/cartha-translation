  text: יְהוָ֨ה אֱלֹהֶ֜י/ךָ ה֣וּא עֹבֵ֣ר לְ/פָנֶ֗י/ךָ הֽוּא יַשְׁמִ֞יד אֶת הַ/גּוֹיִ֥ם הָ/אֵ֛לֶּה מִ/לְּ/פָנֶ֖י/ךָ וִֽ/ירִשְׁתָּ֑/ם יְהוֹשֻׁ֗עַ ה֚וּא עֹבֵ֣ר לְ/פָנֶ֔י/ךָ כַּ/אֲשֶׁ֖ר דִּבֶּ֥ר יְהוָֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/003.yaml
  text: Yahweh your God himself is crossing over before you[a]. He himself will destroy these nations from before you, and you will dispossess them. Joshua himself is crossing over before you[b], just as Yahweh has spoken.
translation:
  language: id
  text: Yahweh, Allahmu, Dialah yang akan menyeberang di depanmu.[a] Dialah yang akan memusnahkan bangsa-bangsa ini dari hadapanmu, dan engkau akan mengambil alih negeri mereka.[b] Yosualah yang akan menyeberang di depanmu, seperti yang telah difirmankan Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “sedang menyeberang di depanmu” atau “berjalan mendahuluimu.” Partisip Ibrani dapat menyatakan tindakan yang sedang berlangsung, segera terjadi, atau pasti terjadi.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “engkau akan memiliki mereka.” Verba Ibrani ini sering menyatakan pengambilalihan kepemilikan, khususnya negeri atau wilayah, dengan menyingkirkan penghuninya yang terdahulu.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam Tetragramaton, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk dengan akhiran orang kedua tunggal maskulin; “Allahmu” merupakan sapaan perjanjian yang alami dalam bahasa Indonesia.
- source_word: הוּא
  choice: Dia sendiri / sendiri
  rationale: Kata ganti mandiri ini bersifat menegaskan. Ungkapan “Dia sendiri” untuk Yahweh dan “Yosua sendiri” mempertahankan penekanan retoris Ibrani.
- source_word: עֹבֵר לְפָנֶיךָ
  choice: akan menyeberang di depanmu
  rationale: Partisip Ibrani menyatakan tindakan yang segera atau pasti terjadi; “akan menyeberang” sesuai dengan konteks penyeberangan menuju negeri itu, sedangkan “di depanmu” mempertahankan gambaran bahwa subjek berjalan mendahului Israel.
- source_word: יַשְׁמִיד
  choice: akan memusnahkan
  rationale: Bentuk Hifil dari שׁמד menyatakan tindakan menyebabkan kebinasaan. “Memusnahkan” mempertahankan kekuatan verba sumber tanpa menambahkan perincian yang tidak dinyatakan.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: bangsa-bangsa ini
  rationale: Dalam konteks Ulangan, גּוֹיִם menunjuk kepada kelompok-kelompok etnis-politis di Kanaan; “bangsa-bangsa” adalah padanan Indonesia yang wajar.
- source_word: מִלְּפָנֶיךָ
  choice: dari hadapanmu
  rationale: Mempertahankan arti spasial gabungan מִן dan לִפְנֵי, yaitu disingkirkan dari hadapan atau jalan Israel.
- source_word: וִירִשְׁתָּם
  choice: engkau akan merebut milik mereka
  rationale: Dalam konteks penaklukan, ירשׁ berarti mengambil kepunyaan dengan menyingkirkan pemilik sebelumnya. Pilihan ini mempertahankan objek pronominal “mereka” secara alami dalam bahasa Indonesia tanpa menyiratkan bahwa bangsa-bangsa itu sendiri menjadi milik Israel.
- source_word: יְהוֹשֻׁעַ
  choice: Yosua
  rationale: Menggunakan bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: כַּאֲשֶׁר דִּבֶּר יְהוָה
  choice: seperti yang telah difirmankan Yahweh
  rationale: “Telah difirmankan” mempertahankan tindakan berbicara yang sudah terjadi dan bobot ujaran ilahi, tanpa mempersempitnya menjadi “dijanjikan”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks secara langsung memakai Tetragramaton. “Yahweh” mempertahankan nama perjanjian itu alih-alih menggantinya dengan gelar.
- issue: Penekanan pada pelaku ilahi dan manusia
  choice: Mempertahankan unsur penegasan bagi Yahweh dan Yosua
  alternative: Menggunakan “Dia” dan “Yosua” tanpa “sendiri”
  rationale: Pengulangan הוּא menekankan bahwa Yahweh sendiri mendahului Israel dan Yosua sendiri juga mendahului mereka berdasarkan firman-Nya. Terjemahan mempertahankan kedua sisi itu tanpa mengaburkan ataupun mempertentangkan peranan ilahi dan manusia.
- issue: Objek tindakan ירשׁ
  choice: “merebut milik mereka”
  alternative: “menghalau mereka” atau “menduduki negeri mereka”
  rationale: Teks memakai akhiran objek “mereka”, tetapi secara semantis verba itu dalam konteks ini mencakup pengambilalihan kepunyaan atau wilayah melalui penyingkiran penghuni sebelumnya. Pilihan utama menjaga ketegangan tersebut tanpa menjadikan orang-orang itu objek kepemilikan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan orang kedua tunggal “engkau” dipertahankan karena teks Ibrani menyapa Israel sebagai satu kesatuan. Susunan kalimat dibuat alami, sambil mempertahankan pengulangan dan penekanan retoris teks sumber.
