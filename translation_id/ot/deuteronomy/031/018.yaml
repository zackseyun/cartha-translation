  text: וְ/אָנֹכִ֗י הַסְתֵּ֨ר אַסְתִּ֤יר פָּנַ/י֙ בַּ/יּ֣וֹם הַ/ה֔וּא עַ֥ל כָּל הָ/רָעָ֖ה אֲשֶׁ֣ר עָשָׂ֑ה כִּ֣י פָנָ֔ה אֶל אֱלֹהִ֖ים אֲחֵרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/018.yaml
  text: And I myself will surely hide my face on that day because of all the evil that he has done[a], because he has turned to other gods.
translation:
  language: id
  text: Dan Aku sendiri benar-benar akan menyembunyikan wajah-Ku[a] pada hari itu karena segala kejahatan yang telah dilakukannya, sebab ia telah berpaling kepada ilah-ilah lain.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “hadirat-Ku”; secara harfiah bahasa Ibrani berbunyi “wajah-Ku”, suatu ungkapan yang dapat menggambarkan ditariknya perkenanan atau kehadiran ilahi.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָנֹכִי
  choice: Dan Aku sendiri
  rationale: Kata ganti אָנֹכִי bersifat tegas; “Aku sendiri” mempertahankan penekanannya, sedangkan וְ diterjemahkan sebagai penghubung “Dan”.
- source_word: הַסְתֵּר אַסְתִּיר
  choice: benar-benar akan menyembunyikan
  rationale: Gabungan infinitif absolut dan verba finit menegaskan kepastian atau intensitas tindakan. Ungkapan “benar-benar akan” menyampaikan penekanan itu secara alami dalam bahasa Indonesia.
- source_word: פָּנַי
  choice: wajah-Ku
  rationale: Secara harfiah berarti “wajah-Ku”. Ungkapan konkret ini dipertahankan agar makna kiasannya—penarikan perkenanan atau kehadiran ilahi—tidak dipersempit di dalam teks utama.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu
  rationale: Ini merupakan ungkapan waktu yang baku dan mempertahankan unsur penunjuk “itu”.
- source_word: עַל כָּל הָרָעָה
  choice: karena segala kejahatan
  rationale: עַל menyatakan sebab atau dasar, sementara הָרָעָה dalam konteks ini menunjuk pada kejahatan moral, bukan sekadar malapetaka.
- source_word: אֲשֶׁר עָשָׂה
  choice: yang telah dilakukannya
  rationale: Verba Ibrani berbentuk orang ketiga tunggal maskulin. Bentuk “-nya” mempertahankan penggambaran Israel secara kolektif sebagai satu pribadi tanpa memaksakan gender dalam bahasa Indonesia.
- source_word: כִּי
  choice: sebab
  rationale: כִּי memperkenalkan alasan. “Sebab” menghindari pengulangan langsung kata “karena” dan tetap menyatakan hubungan kausal dengan jelas.
- source_word: פָנָה אֶל
  choice: telah berpaling kepada
  rationale: Ungkapan ini menunjukkan beralihnya arah kesetiaan atau pengabdian. “Berpaling kepada” mempertahankan citra geraknya tanpa menjabarkan implikasinya secara berlebihan.
- source_word: אֱלֹהִים אֲחֵרִים
  choice: ilah-ilah lain
  rationale: Frasa ini menunjuk pada dewa-dewa selain TUHAN. “Ilah-ilah lain” langsung, jelas, dan menghindari kerancuan dengan nama diri Allah dalam pemakaian bahasa Indonesia.
theological_decisions:
- issue: Ungkapan antropomorfis tentang penarikan diri ilahi
  choice: Mempertahankan “menyembunyikan wajah-Ku” dalam teks utama
  alternative: “menarik hadirat-Ku” atau “memalingkan diri dari mereka”
  rationale: Teks Ibrani memakai gambaran konkret “menyembunyikan wajah”. Mempertahankannya menjaga ketegangan antara arti harfiah dan makna kiasan tentang perkenanan atau kehadiran Allah.
- issue: Rujukan tunggal kepada Israel
  choice: Memakai bentuk tunggal “dilakukannya” dan “ia”
  alternative: “mereka lakukan” dan “mereka”
  rationale: Verba Ibrani berbentuk tunggal karena Israel dipersonifikasikan sebagai satu kesatuan. Bentuk tunggal dipertahankan agar ciri sumber tidak diratakan menjadi jamak.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Penekanan Ibrani dipertahankan dengan “Aku sendiri” dan “benar-benar”, sedangkan personifikasi Israel tetap berbentuk tunggal. Istilah “ilah-ilah lain” dipilih untuk kejelasan semantis.
