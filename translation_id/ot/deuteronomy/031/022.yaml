  text: So Moses wrote this song on that day and taught it to the sons of Israel[a].
translation:
  language: id
  text: Lalu Musa menulis nyanyian ini pada hari itu dan mengajarkannya kepada anak-anak lelaki Israel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak lelaki Israel”; ungkapan Ibrani ini lazim dipakai sebagai sebutan kolektif bagi bangsa Israel.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: menulis
  rationale: Bentuk Qal wayyiqtol dari כתב menyatakan tindakan naratif berurutan; “menulis” merupakan padanan langsung dan alami.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: nyanyian ini
  rationale: שִׁירָה menunjuk pada nyanyian atau syair yang dinyanyikan; “nyanyian” mempertahankan sebutan sastra dalam konteks pasal ini.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu
  rationale: Ungkapan temporal ini diterjemahkan secara lugas tanpa mempertegasnya menjadi “pada hari yang sama,” yang mungkin menyempitkan ambiguitas sumber.
- source_word: וַיְלַמְּדָהּ
  choice: mengajarkannya
  rationale: Bentuk Piel dari למד dengan sufiks feminin tunggal merujuk kembali kepada “nyanyian”; akhiran “-nya” mempertahankan objek tersebut secara alami.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  rationale: Secara harfiah ungkapan ini berarti “anak-anak lelaki Israel,” tetapi berfungsi sebagai sebutan kolektif baku bagi umat Israel. “Keturunan Israel” mempertahankan hubungan asal-usul tanpa memberi kesan bahwa hanya laki-laki yang diajar.
theological_decisions:
- issue: Cakupan ungkapan kolektif בְּנֵי יִשְׂרָאֵל
  choice: keturunan Israel
  alternative: anak-anak lelaki Israel; orang Israel; umat Israel
  rationale: Bentuk Ibrani secara gramatikal maskulin, tetapi dalam konteks perjanjian menunjuk secara kolektif kepada bangsa Israel. Padanan “keturunan Israel” menjaga kaitan dengan Israel sebagai leluhur sekaligus tidak membatasi rujukan pada laki-laki saja.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Jadi” mempertahankan kesinambungan naratif וַ tanpa membuat hubungan sebab-akibat terlalu kuat; “nyanyian” sesuai dengan konteks sastra Ulangan 31–32.
