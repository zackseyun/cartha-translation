  text: וְ/חָרָ֣ה אַפִּ֣/י ב֣/וֹ בַ/יּוֹם הַ֠/הוּא וַ/עֲזַבְתִּ֞י/ם וְ/הִסְתַּרְתִּ֨י פָנַ֤/י מֵ/הֶם֙ וְ/הָיָ֣ה לֶֽ/אֱכֹ֔ל וּ/מְצָאֻ֛/הוּ רָע֥וֹת רַבּ֖וֹת וְ/צָר֑וֹת וְ/אָמַר֙ בַּ/יּ֣וֹם הַ/ה֔וּא הֲ/לֹ֗א עַ֣ל כִּֽי אֵ֤ין אֱלֹהַ/י֙ בְּ/קִרְבִּ֔/י מְצָא֖וּ/נִי הָ/רָע֥וֹת הָ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/017.yaml
  text: Then my anger will burn against them on that day[a], and I will forsake them and hide my face from them, and they will be devoured, and many evils and troubles will find them. And he will say on that day[b], ‘Is it not because my God is not among me that these evils have found me?’
translation:
  language: id
  text: Pada hari itu murka-Ku akan menyala terhadap mereka. Aku akan meninggalkan mereka dan menyembunyikan wajah-Ku dari mereka. Mereka akan menjadi santapan[a], dan banyak malapetaka serta kesesakan akan menimpa mereka. Pada hari itu ia akan berkata, “Bukankah malapetaka-malapetaka ini menimpaku karena Allahku tidak ada di tengah-tengahku?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menjadi untuk dimakan.” Ungkapan Ibrani ini padat dan dapat menyatakan bahwa mereka akan dilahap atau menjadi mangsa.
    reason: lexical_alternative
  - marker: b
    text: 'Bahasa Ibrani memakai bentuk tunggal: “Allahku tidak ada di tengah-tengahku.” Israel dipersonifikasikan sebagai satu orang yang berbicara.'
    reason: collective_singular
lexical_decisions:
- source_word: וְחָרָה אַפִּי
  choice: murka-Ku akan menyala
  rationale: Mempertahankan metafora panas dalam idiom Ibrani sambil memakai ungkapan Indonesia yang alami dan khidmat.
- source_word: בּוֹ
  choice: terhadap mereka
  rationale: Bentuk Ibraninya tunggal kolektif, tetapi acuannya ialah Israel sebagai umat; bentuk jamak lebih alami dalam narasi Indonesia.
- source_word: וַעֲזַבְתִּים
  choice: Aku akan meninggalkan mereka
  rationale: Menyampaikan penarikan relasional dalam konteks perjanjian tanpa menambahkan tafsiran yang tidak dinyatakan.
- source_word: וְהִסְתַּרְתִּי פָנַי מֵהֶם
  choice: menyembunyikan wajah-Ku dari mereka
  rationale: Mempertahankan gambaran teologis penting dari bahasa sumber, bukan memparafrasakannya sebagai sekadar ketidakhadiran atau ketidaksenangan.
- source_word: וְהָיָה לֶאֱכֹל
  choice: mereka akan menjadi santapan
  rationale: Ungkapan Ibrani yang padat secara harfiah berarti menjadi untuk dimakan; pilihan ini mempertahankan citra konsumsi dan keadaan rentan tanpa menentukan pelakunya.
- source_word: וּמְצָאֻהוּ
  choice: akan menimpa mereka
  rationale: Dalam konteks malapetaka, 'menimpa' merupakan padanan Indonesia alami bagi tindakan menemukan atau mendatangi korban.
- source_word: רָעוֹת רַבּוֹת וְצָרוֹת
  choice: banyak malapetaka serta kesesakan
  rationale: רָעוֹת dalam konteks ini menunjuk pada bencana atau kemalangan, sedangkan צָרוֹת menunjuk pada kesesakan atau penderitaan; terjemahan menjaga pembedaan keduanya.
- source_word: וְאָמַר
  choice: ia akan berkata
  rationale: Mempertahankan bentuk tunggal yang mempersonifikasikan Israel sebagai satu umat.
- source_word: הֲלֹא עַל כִּי
  choice: Bukankah ... karena
  rationale: Menjaga bentuk pertanyaan retoris kausal dalam bahasa Indonesia yang wajar.
- source_word: אֵין אֱלֹהַי בְּקִרְבִּי
  choice: Allahku tidak ada di tengah-tengahku
  rationale: Menjaga orang pertama tunggal dan ungkapan spasial sumber yang mempersonifikasikan Israel, meski konstruksinya sengaja terasa tidak biasa.
- source_word: מְצָאוּנִי
  choice: menimpaku
  rationale: Mengungkapkan datangnya malapetaka atas sang penutur kolektif secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Israel sebagai tunggal kolektif atau jamak
  choice: 'Memakai bentuk jamak dalam tindakan Allah terhadap Israel, tetapi mempertahankan bentuk tunggal dalam pengakuan Israel: ''ia ... Allahku ... tengah-tengahku ... menimpaku''.'
  alternative: Memakai bentuk tunggal seluruhnya atau bentuk jamak seluruhnya.
  rationale: Cara ini membuat narasi alami dalam bahasa Indonesia sekaligus mempertahankan personifikasi Israel yang menonjol dalam ucapan langsung.
- issue: Makna Allah menyembunyikan wajah
  choice: Mempertahankan idiom 'menyembunyikan wajah-Ku'.
  alternative: Menerjemahkannya sebagai 'berpaling', 'menarik kehadiran-Ku', atau 'tidak lagi berkenan'.
  rationale: Idiom sumber memuat ketegangan antara penghakiman, relasi, dan kehadiran ilahi; parafrasa dapat mempersempit maknanya.
- issue: Pengakuan bahwa Allah tidak ada di tengah Israel
  choice: Mempertahankannya sebagai kesimpulan yang diucapkan Israel tanpa menilai apakah pengakuan itu lengkap atau tepat secara teologis.
  alternative: Menjelaskannya sebagai akibat Allah meninggalkan Israel atau sebagai persepsi Israel semata.
  rationale: Teks menyajikan ucapan tersebut dalam pertanyaan retoris; terjemahan tidak boleh menyelesaikan ketegangan yang dibiarkan terbuka oleh sumber.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Kapitalisasi pronomina ilahi mengikuti konvensi penerbitan Alkitab Indonesia. 'Malapetaka' dipilih daripada 'kejahatan' karena konteksnya adalah bencana yang menimpa umat; 'kesesakan' mempertahankan nuansa tekanan dan penderitaan. Semua penanda catatan kaki muncul dalam teks utama.
