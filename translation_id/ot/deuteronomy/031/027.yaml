  text: כִּ֣י אָנֹכִ֤י יָדַ֨עְתִּי֙ אֶֽת מֶרְיְ/ךָ֔ וְ/אֶֽת עָרְפְּ/ךָ֖ הַ/קָּשֶׁ֑ה הֵ֣ן בְּ/עוֹדֶ/נִּי֩ חַ֨י עִמָּ/כֶ֜ם הַ/יּ֗וֹם מַמְרִ֤ים הֱיִתֶם֙ עִם יְהֹוָ֔ה וְ/אַ֖ף כִּי אַחֲרֵ֥י מוֹתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/027.yaml
  text: For I know your rebellion and your stiff neck[a]. Look, while I am still alive with you today, you have been rebellious against Yahweh[b]; and how much more after my death!
translation:
  language: id
  text: Sebab aku tahu pemberontakanmu dan tengkukmu yang keras[a]. Lihatlah, sementara aku masih hidup bersama kalian pada hari ini, kalian telah memberontak terhadap Yahweh[b]. Terlebih lagi sesudah aku mati!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tengkukmu yang keras”, sebuah ungkapan Ibrani untuk sikap keras kepala atau degil.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “terhadap” biasanya berarti “dengan”; di sini konteks pemberontakan menunjukkan perlawanan terhadap Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶרְיְךָ
  choice: pemberontakanmu
  rationale: Nomina מֶרִי menyatakan pemberontakan atau pembangkangan, khususnya perlawanan umat dalam hubungan perjanjian. Bentuk nomina dipertahankan secara ringkas.
- source_word: עָרְפְּךָ הַקָּשֶׁה
  choice: tengkukmu yang keras
  rationale: Terjemahan ini mempertahankan metafora Ibrani tentang sikap keras kepala, dengan catatan kaki agar idiomnya jelas bagi pembaca modern.
- source_word: הֵן
  choice: Ketahuilah
  rationale: Partikel ini menarik perhatian dan memberi penekanan. “Ketahuilah” terdengar wajar dan bermartabat dalam konteks pidato Musa.
- source_word: בְּעוֹדֶנִּי חַי
  choice: selama aku masih hidup
  rationale: Mengungkapkan keadaan yang berlangsung hingga saat berbicara dan mempertahankan unsur “masih hidup” dalam bahasa Ibrani.
- source_word: מַמְרִים הֱיִתֶם
  choice: kalian telah memberontak
  rationale: Partisipel dengan הָיָה menggambarkan perilaku yang telah berlangsung atau menjadi ciri mereka. Bentuk perfektif bahasa Indonesia menyampaikan keadaan berkelanjutan dari masa sebelumnya sampai kini.
- source_word: עִם יְהוָה
  choice: terhadap Yahweh
  rationale: Walaupun עִם biasanya berarti “dengan”, bersama verba pemberontakan frasa ini menyatakan arah perlawanan. “Terhadap” menyampaikan relasi permusuhan tanpa melebihkan maknanya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: וְאַף כִּי
  choice: Apalagi
  rationale: 'Ungkapan ini menandai peningkatan retoris: jika mereka memberontak ketika Musa masih hidup, terlebih lagi setelah kematiannya.'
- source_word: אַחֲרֵי מוֹתִי
  choice: sesudah aku mati
  rationale: Ungkapan temporal ini diterjemahkan secara alami dalam bahasa Indonesia tanpa mengubah maknanya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan fungsi nama pribadi tersebut dan mengikuti bentuk transliterasi yang lazim dalam kajian modern.
- issue: Arah pemberontakan dalam עִם יְהוָה
  choice: terhadap Yahweh
  alternative: dengan Yahweh
  rationale: Preposisi עִם secara harfiah dapat berarti “dengan”, tetapi dalam konstruksi dengan ממרים konteksnya menunjukkan perlawanan. Catatan kaki mempertahankan transparansi terhadap bentuk Ibraninya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada pidato yang tegas dan bermartabat. Pergeseran dari akhiran orang kedua tunggal kolektif pada “pemberontakanmu” dan “tengkukmu” ke bentuk jamak “kalian” dipertahankan karena terdapat dalam teks Ibrani. Metafora “tengkuk yang keras” dipertahankan dan dijelaskan melalui catatan kaki.
