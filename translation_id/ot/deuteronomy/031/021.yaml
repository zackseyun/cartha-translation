  text: וְ֠/הָיָה כִּֽי תִמְצֶ֨אןָ אֹת֜/וֹ רָע֣וֹת רַבּוֹת֮ וְ/צָרוֹת֒ וְ֠/עָנְתָה הַ/שִּׁירָ֨ה הַ/זֹּ֤את לְ/פָנָי/ו֙ לְ/עֵ֔ד כִּ֛י לֹ֥א תִשָּׁכַ֖ח מִ/פִּ֣י זַרְע֑/וֹ כִּ֧י יָדַ֣עְתִּי אֶת יִצְר֗/וֹ אֲשֶׁ֨ר ה֤וּא עֹשֶׂה֙ הַ/יּ֔וֹם בְּ/טֶ֣רֶם אֲבִיאֶ֔/נּוּ אֶל הָ/אָ֖רֶץ אֲשֶׁ֥ר נִשְׁבָּֽעְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/021.yaml
  text: And when many evils and troubles come upon him[a], this song will answer before him as a witness, for it will not be forgotten from the mouth of his offspring; for I know his inclination, what he is doing today[d][c][b], before I bring him into the land that I swore to give.
translation:
  language: id
  text: Ketika banyak malapetaka dan kesusahan menimpa mereka,[a] nyanyian ini akan menjawab di hadapan mereka sebagai saksi, sebab nyanyian itu tidak akan terlupakan dari mulut keturunan mereka. Sebab Aku mengetahui kecenderungan mereka, apa yang mereka lakukan hari ini, sebelum Aku membawa mereka masuk ke negeri yang telah Kujanjikan dengan sumpah.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menemukan dia”; dapat pula dipahami “mendatangi dia” atau “menyusul dia.” Kata ganti tunggal menunjuk kepada Israel sebagai satu bangsa.
    reason: lexical_alternative
  - marker: c
    text: Ibrani hanya berbunyi “negeri yang telah Aku sumpahkan.” Ungkapan ini dipahami sebagai janji yang diteguhkan dengan sumpah; “untuk diberikan” tersirat dari konteks.
    reason: textual_clarity
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Ketika
  rationale: Ungkapan Ibrani ini membuka keadaan pada masa mendatang. 'Ketika' menyampaikannya secara alami dalam bahasa Indonesia tanpa kekakuan yang tidak perlu.
- source_word: תִמְצֶאןָ אֹתוֹ
  choice: menimpa mereka
  rationale: Dengan malapetaka dan kesusahan sebagai subjek, מצא menyatakan bahwa berbagai kesusahan mendatangi atau menimpa Israel. Kata ganti kolektif Ibrani berbentuk tunggal, tetapi 'mereka' lebih alami dalam bahasa Indonesia untuk bangsa Israel.
- source_word: רָעוֹת רַבּוֹת וְצָרוֹת
  choice: banyak malapetaka dan kesusahan
  rationale: רָעוֹת di sini menunjuk pada kejadian buruk atau bencana, bukan terutama kejahatan moral; 'malapetaka' menghindari kesalahpahaman itu. צָרוֹת diterjemahkan 'kesusahan'.
- source_word: וְעָנְתָה
  choice: akan menjawab
  rationale: Mempertahankan gambaran verbal harfiah ענה, 'menjawab/menanggapi'; peran yudisial nyanyian tersebut dinyatakan oleh frasa berikutnya, 'sebagai saksi'.
- source_word: לְפָנָיו לְעֵד
  choice: di hadapan mereka sebagai saksi
  rationale: '''Di hadapan'' mempertahankan arti dasar לְפָנָיו tanpa langsung mempersempitnya menjadi ''melawan''; לְעֵד menyatakan fungsi nyanyian sebagai saksi.'
- source_word: לֹא תִשָּׁכַח מִפִּי זַרְעוֹ
  choice: nyanyian itu tidak akan terlupakan dari mulut keturunan mereka
  rationale: Subjek feminin tunggalnya adalah nyanyian. 'Dari mulut' mempertahankan gambaran pewarisan dan pelafalan lisan, sedangkan זרע kolektif diterjemahkan 'keturunan'.
- source_word: יִצְרוֹ
  choice: kecenderungan hati mereka
  rationale: יֵצֶר menunjuk pada bentukan, dorongan, atau kecenderungan batin. Penambahan 'hati' membuat maksud batiniah jelas dalam bahasa Indonesia tanpa menjadikannya istilah doktrinal teknis.
- source_word: אֲשֶׁר הוּא עֹשֶׂה הַיּוֹם
  choice: yakni apa yang mereka lakukan pada hari ini
  rationale: Klausa ini menjelaskan kecenderungan Israel melalui perilakunya saat itu. 'Yakni' memperjelas hubungan sintaksis tanpa mengubah isinya.
- source_word: אֲשֶׁר נִשְׁבָּעְתִּי
  choice: yang telah Kujanjikan dengan sumpah
  rationale: Teks Masoret berakhir secara eliptis dengan 'yang telah Aku sumpahkan'. Dalam bahasa Indonesia, 'Kujanjikan dengan sumpah' menyampaikan idiom perjanjian itu tanpa menambahkan objek eksplisit seperti 'untuk diberikan'.
theological_decisions:
- issue: Kata ganti tunggal kolektif bagi Israel
  choice: mereka
  alternative: dia
  rationale: Ibrani memperlakukan Israel sebagai pribadi kolektif tunggal. Bahasa Indonesia lebih alami memakai 'mereka' untuk bangsa beserta keturunannya; sifat kolektifnya tetap terpelihara oleh konteks.
- issue: Fungsi nyanyian sebagai saksi dalam לְפָנָיו לְעֵד
  choice: di hadapan mereka sebagai saksi
  alternative: sebagai saksi yang melawan mereka
  rationale: '''Melawan'' sesuai dengan daya tuduhan dalam konteks, tetapi tidak dinyatakan secara eksplisit oleh לְפָנָיו. Teks utama mempertahankan keluasan ungkapan sumber.'
- issue: Makna antropologis יִצְרוֹ
  choice: kecenderungan hati mereka
  alternative: niat mereka / angan-angan mereka
  rationale: Pilihan ini mempertahankan gagasan tentang arah atau dorongan batin Israel tanpa memasukkan rumusan doktrinal belakangan atau membatasi kata itu hanya pada daya imajinasi.
- issue: Elipsis pada אֲשֶׁר נִשְׁבָּעְתִּי
  choice: yang telah Kujanjikan dengan sumpah
  alternative: yang telah Kujanjikan dengan sumpah untuk diberikan kepada mereka
  rationale: Bahasa sumber hanya berbunyi 'yang telah Aku sumpahkan'. Terjemahan utama mempertahankan elipsis objek pemberian sejauh mungkin sambil menghasilkan kalimat Indonesia yang utuh dan wajar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Malapetaka' dipilih agar רָעוֹת dipahami sebagai kejadian buruk, bukan kejahatan moral. Pergeseran dari kata ganti tunggal kolektif Ibrani ke bentuk jamak Indonesia membuat rujukan kepada bangsa Israel alami dan jelas. Kapitalisasi Aku dan bentuk terikat Ku- dipakai untuk pembicara ilahi sesuai kebiasaan penerbitan Alkitab Indonesia.
