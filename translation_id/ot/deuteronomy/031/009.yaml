  text: וַ/יִּכְתֹּ֣ב מֹשֶׁה֮ אֶת הַ/תּוֹרָ֣ה הַ/זֹּאת֒ וַֽ/יִּתְּנָ֗/הּ אֶל הַ/כֹּהֲנִים֙ בְּנֵ֣י לֵוִ֔י הַ/נֹּ֣שְׂאִ֔ים אֶת אֲר֖וֹן בְּרִ֣ית יְהוָ֑ה וְ/אֶל כָּל זִקְנֵ֖י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/009.yaml
  text: So Moses wrote this law and gave it to the priests[a], the sons of Levi, who carry the ark of the covenant of Yahweh[c][b], and to all the elders of Israel.
translation:
  language: id
  text: Musa menuliskan hukum ini[a] lalu memberikannya kepada para imam, keturunan Lewi[b], yang membawa tabut perjanjian Yahweh[c], dan kepada semua tua-tua Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ajaran ini,” “petunjuk ini,” atau “Taurat ini.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak-anak lelaki Lewi”; dapat juga diterjemahkan “orang-orang Lewi.”
    reason: lexical_alternative
  - marker: c
    text: Ibrani YHWH; secara tradisional diterjemahkan “TUHAN.”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: menuliskan
  rationale: Bentuk kata kerja כתב secara langsung menyatakan tindakan menulis; 'menuliskan' alami dalam narasi Indonesia dan sesuai dengan adanya objek berupa hukum.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: hukum ini
  rationale: Dalam konteks Ulangan, frasa ini menunjuk pada ketetapan perjanjian yang dituliskan Musa. 'Hukum' paling alami, sementara kemungkinan makna 'ajaran/petunjuk' dicatat dalam catatan kaki.
- source_word: וַיִּתְּנָהּ
  choice: memberikannya
  rationale: Akhiran pronominal feminin merujuk kembali kepada תּוֹרָה. Pilihan ini mempertahankan tindakan naratif yang sederhana.
- source_word: הַכֹּהֲנִים
  choice: para imam
  rationale: כהנים adalah istilah baku untuk para imam.
- source_word: בְּנֵי לֵוִי
  choice: keturunan Lewi
  rationale: Secara harfiah berarti 'anak-anak lelaki Lewi', tetapi dalam idiom silsilah menunjuk pada keturunan atau kaum Lewi. 'Keturunan Lewi' alami dan tetap transparan terhadap bentuk Ibrani.
- source_word: הַנֹּשְׂאִים
  choice: yang mengangkut
  rationale: Partisipel נשׂא menggambarkan mereka sebagai pihak yang membawa tabut. 'Mengangkut' menyampaikan tindakan membawa benda tersebut dengan jelas dalam bahasa Indonesia modern.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: tabut perjanjian Yahweh
  rationale: Rangkaian konstruksi Ibrani dipertahankan secara padat dan alami sebagai 'tabut perjanjian Yahweh', tanpa mengubah hubungan gramatikalnya menjadi penjelasan yang lebih interpretatif.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai 'Yahweh'; tradisi yang menggantinya dengan gelar 'TUHAN' dicatat sebagai alternatif.
- source_word: כָּל זִקְנֵי יִשְׂרָאֵל
  choice: semua tua-tua Israel
  rationale: זקנים dalam konteks ini menunjuk pada para pemimpin tua Israel. 'Tua-tua' merupakan padanan Alkitabiah Indonesia yang dikenal dan mempertahankan bentuk jamaknya.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri YHWH. 'Yahweh' mempertahankan nama tersebut, sedangkan 'TUHAN' merupakan penggantian tradisional dengan gelar dan dicatat dalam catatan kaki.
- issue: Cakupan makna תּוֹרָה dalam konteks ini
  choice: hukum
  alternative: ajaran; petunjuk; Taurat
  rationale: Konteksnya adalah korpus ketetapan perjanjian yang ditulis dan diserahkan Musa. 'Hukum' sesuai dengan fungsi tersebut, tetapi keluasan leksikal תּוֹרָה tetap diakui dalam catatan kaki.
- issue: Identitas para imam sebagai בְּנֵי לֵוִי
  choice: para imam, keturunan Lewi
  alternative: para imam Lewi; para imam, anak-anak Lewi
  rationale: Apposisi Ibrani dipertahankan sehingga teks menyebut mereka sebagai imam sekaligus keturunan Lewi, tanpa memperluas pernyataan menjadi klaim bahwa semua orang Lewi adalah imam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur kalimat mengikuti alur narasi Ibrani, tetapi memakai ungkapan alami. Semua penanda catatan kaki ditempatkan langsung setelah unsur yang dijelaskan.
