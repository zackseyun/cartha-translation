source:
  edition: WLC
  text: וַ/יִּקְרָ֨א מֹשֶׁ֜ה לִֽ/יהוֹשֻׁ֗עַ וַ/יֹּ֨אמֶר אֵלָ֜י/ו לְ/עֵינֵ֣י כָל יִשְׂרָאֵ֘ל חֲזַ֣ק וֶ/אֱמָץ֒ כִּ֣י אַתָּ֗ה תָּבוֹא֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה אֶל הָ/אָ֕רֶץ אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתָ֖/ם לָ/תֵ֣ת לָ/הֶ֑ם וְ/אַתָּ֖ה תַּנְחִילֶ֥/נָּה אוֹתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/007.yaml
  text: Then Moses called Joshua and said to him in the sight of all Israel[a], “Be strong and courageous, because you will go with this people into the land that Yahweh swore to their fathers to give them[b], and you will give it to them as an inheritance.”
translation:
  language: id
  text: Lalu Musa memanggil Yosua dan berkata kepadanya di hadapan seluruh Israel, “Kuat dan beranilah, sebab engkau akan masuk bersama bangsa ini[a] ke negeri yang Yahweh telah bersumpah akan memberikan kepada nenek moyang mereka[b]. Engkau akan memberikan negeri itu kepada mereka sebagai milik pusaka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “engkau akan membawa bangsa ini masuk.” Bahasa Ibrani dapat dipahami sebagai Yosua masuk bersama bangsa itu atau memimpin mereka masuk.
    reason: alternative_reading
  - marker: b
    text: 'Secara harfiah: “bapak-bapak mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: memanggil
  rationale: Dalam konteks narasi ini, קרא berarti memanggil seseorang untuk berbicara kepadanya; “memanggil” alami dan tidak menambahkan nuansa resmi yang tidak perlu.
- source_word: לִיהוֹשֻׁעַ
  choice: Yosua
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: לְעֵינֵי כָל יִשְׂרָאֵל
  choice: di hadapan seluruh Israel
  rationale: Ungkapan harfiahnya “di mata seluruh Israel”; “di hadapan” menyampaikan bahwa perkataan itu disampaikan secara terbuka dan disaksikan oleh seluruh Israel.
- source_word: חֲזַק וֶאֱמָץ
  choice: Kuat dan beranilah
  rationale: Pasangan kata ini merupakan seruan agar Yosua memiliki kekuatan dan keberanian untuk menjalankan kepemimpinannya. Bentuk ini ringkas, wajar, dan tidak menambahkan kata “hati” yang tidak terdapat dalam sumber.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi perintah sebelumnya; “sebab” sesuai dengan ragam bahasa Indonesia yang modern dan bermartabat.
- source_word: תָּבוֹא אֶת הָעָם הַזֶּה
  choice: engkau akan masuk bersama bangsa ini
  rationale: Konstruksi בוא dengan אֶת־הָעָם dapat dipahami sebagai Yosua masuk bersama bangsa itu. Pilihan ini mempertahankan perbedaan ungkapan dengan klausa berikutnya, yang memberikan peranan aktif kepada Yosua dalam menjadikan negeri itu milik pusaka mereka.
- source_word: הָאָרֶץ
  choice: negeri
  rationale: “Negeri” merupakan padanan Indonesia yang alami bagi wilayah yang dijanjikan dan tetap mempertahankan kesinambungan tema negeri perjanjian.
- source_word: נִשְׁבַּע יְהוָה
  choice: telah Yahweh janjikan dengan sumpah
  rationale: Bentuk Niphal שׁבע menyatakan sumpah. Ungkapan ini menyampaikan baik isi janji maupun sifatnya yang diteguhkan dengan sumpah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri “Yahweh”, bukan diganti dengan gelar.
- source_word: לַאֲבֹתָם
  choice: kepada nenek moyang mereka
  rationale: Dalam bahasa Indonesia, “nenek moyang” merupakan ungkapan kolektif yang paling alami untuk para bapak leluhur suatu bangsa; catatan kaki mempertahankan bentuk harfiah maskulin sumber.
- source_word: לָתֵת לָהֶם
  choice: untuk diberikan kepada mereka
  rationale: Infinitif ini menyatakan isi sumpah Yahweh, yakni memberikan negeri itu kepada keturunan para leluhur tersebut.
- source_word: תַּנְחִילֶנָּה אוֹתָם
  choice: Engkau akan memberikan negeri itu kepada mereka sebagai milik pusaka
  rationale: Bentuk Hiphil נחל berarti menyebabkan orang menerima warisan atau memberikan sesuatu sebagai warisan. Rumusan ini alami dalam bahasa Indonesia dan mempertahankan gagasan milik pusaka.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan fungsi nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Apakah תָּבוֹא אֶת הָעָם berarti Yosua masuk bersama bangsa itu atau membawa mereka masuk
  choice: engkau akan masuk bersama bangsa ini
  alternative: engkau akan membawa bangsa ini masuk
  rationale: Susunan Ibrani memungkinkan kedua pemahaman. Bacaan utama mempertahankan nuansa bahwa Yosua masuk bersama umat, sedangkan klausa berikutnya secara jelas memberinya peranan aktif dalam pemberian negeri sebagai milik pusaka. Ambiguitas yang asli dicatat dalam catatan kaki.
- issue: Penerjemahan אֲבֹתָם
  choice: nenek moyang mereka
  alternative: bapak-bapak mereka atau bapak leluhur mereka
  rationale: “Nenek moyang” adalah bentuk kolektif yang alami dalam bahasa Indonesia, sedangkan bentuk harfiah maskulin sumber dicantumkan dalam catatan kaki agar rincian leksikalnya tidak hilang.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti “engkau” dipakai untuk sapaan langsung dalam konteks kitab suci. Susunan kalimat dijaga agar mudah dipahami tanpa menghilangkan ambiguitas sintaksis bahasa Ibrani.
