  terminology: “Yahweh,” “Yosua,” “Israel,” “negeri,” dan “milik pusaka” konsisten serta tepat. “Nenek moyang mereka” adalah ungkapan Indonesia yang alami; catatan kaki dengan tepat mencatat bentuk harfiah maskulin “bapak-bapak mereka.”
