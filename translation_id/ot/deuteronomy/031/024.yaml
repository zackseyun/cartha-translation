translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Ayat ini merupakan anak kalimat yang berlanjut ke ayat berikutnya, sehingga tanda koma pada akhir dipertahankan. Pengulangan “perkataan-perkataan” dipilih untuk mewakili bentuk jamak dan acuan sufiks pada frasa penutup.
