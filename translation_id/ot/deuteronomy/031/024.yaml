  text: And when Moses had finished writing the words of this law in a book[a], until they were complete,
translation:
  language: id
  text: Ketika Musa selesai menuliskan seluruh perkataan hukum ini dalam sebuah kitab[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pada sebuah gulungan.” Kata Ibrani סֵפֶר dapat merujuk pada dokumen tertulis atau gulungan, bukan harus pada buku berjilid dalam pengertian modern.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת
  choice: Ketika ... selesai
  rationale: Konstruksi וַיְהִי dengan כְּ dan infinitif menyatakan peralihan naratif sekaligus waktu. Dalam bahasa Indonesia, “Ketika ... selesai” menyampaikan fungsi itu secara alami tanpa ungkapan kaku “terjadilah ketika”.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Mengikuti bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: לִכְתֹּב
  choice: menuliskan
  rationale: Infinitif ini melengkapi verba “selesai.” “Selesai menuliskan” alami dalam bahasa Indonesia dan menegaskan tindakan mencatat teks secara tertulis.
- source_word: דִּבְרֵי
  choice: perkataan-perkataan
  rationale: דָּבָר dapat berarti perkataan, perkara, atau hal. Dalam konteks isi hukum yang ditulis, “perkataan-perkataan” mempertahankan acuan konkret pada rumusan teks.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: hukum ini
  rationale: תּוֹרָה dapat berarti pengajaran atau hukum. Dalam konteks perjanjian dan perundangan kitab Ulangan, “hukum ini” jelas, alami, dan tetap mempertahankan penunjuk “ini.”
- source_word: עַל סֵפֶר
  choice: dalam sebuah kitab
  rationale: Secara harfiah עַל berarti “di atas,” sedangkan סֵפֶר menunjuk dokumen tertulis yang pada masa itu dapat berupa gulungan. “Dalam sebuah kitab” adalah idiom Indonesia yang alami untuk kandungan tertulis; catatan kaki menjaga latar budaya bendanya.
- source_word: עַד תֻּמָּם
  choice: sampai semuanya lengkap
  rationale: עַד menyatakan batas atau jangkauan, sedangkan תֻּמָּם dengan sufiks jamak merujuk kembali pada perkataan-perkataan tersebut. Terjemahan ini menyampaikan bahwa seluruh teks dituliskan sampai tuntas tanpa menghasilkan frasa Indonesia yang kaku.
