  naturalness: '''Perkataan-perkataan'' dan terutama ''sampai semuanya lengkap'' terdengar kaku dalam ragam Indonesia baku. ''Seluruh perkataan hukum ini'' lebih alami dan tetap formal; anak kalimat beserta koma akhir dipertahankan karena ayat berlanjut.'
