  text: וַ/יֵּרָ֧א יְהוָ֛ה בָּ/אֹ֖הֶל בְּ/עַמּ֣וּד עָנָ֑ן וַ/יַּעֲמֹ֛ד עַמּ֥וּד הֶ/עָנָ֖ן עַל פֶּ֥תַח הָ/אֹֽהֶל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/015.yaml
  text: And Yahweh appeared in the tent in a pillar of cloud[b][a], and the pillar of cloud stood at the entrance of the tent.
translation:
  language: id
  text: Yahweh menampakkan diri di dalam kemah itu[a], dalam sebuah tiang awan, dan tiang awan itu berdiri di pintu masuk kemah itu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kemah yang dimaksud kemungkinan adalah Kemah Pertemuan berdasarkan konteks; teks Ibrani di sini hanya mengatakan “kemah itu”.
    reason: lexical_alternative
  - marker: b
    text: Atau “di atas pintu masuk kemah itu”; kata depan Ibrani juga dapat berarti “di atas”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרָא
  choice: menampakkan diri
  rationale: Bentuk Niphal dari ראה di sini menyatakan penampakan yang dapat dilihat. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan konteks teofani tanpa menjelaskan lebih jauh cara penampakan itu terjadi.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: בָּאֹהֶל
  choice: di dalam kemah itu
  rationale: אֹהֶל berarti 'kemah'. Artikel Ibrani dinyatakan dengan 'itu'; konteks menunjuk kepada Kemah Pertemuan, tetapi terjemahan utama tidak menambahkan sebutan yang tidak terdapat dalam frasa ini.
- source_word: בְּעַמּוּד עָנָן
  choice: dalam sebuah tiang awan
  rationale: Preposisi בְּ dipertahankan sebagai 'dalam', sedangkan konstruksi tanpa artikel diterjemahkan dengan 'sebuah'. Ungkapan ini menggambarkan sarana atau bentuk penampakan tanpa menguraikan misterinya.
- source_word: וַיַּעֲמֹד
  choice: berdiri
  rationale: עמד secara konkret berarti 'berdiri' dan sesuai dengan gambaran tiang awan yang menetap pada suatu tempat.
- source_word: עַמּוּד הֶעָנָן
  choice: tiang awan itu
  rationale: Artikel pada הֶעָנָן merujuk kembali kepada tiang awan yang baru disebut; 'itu' menyatakan rujukan tersebut secara alami dalam bahasa Indonesia.
- source_word: עַל פֶּתַח הָאֹהֶל
  choice: di pintu masuk kemah itu
  rationale: Dalam konteks letak, עַל dengan פֶּתַח dapat menyatakan posisi pada atau di dekat pintu masuk. 'Di pintu masuk' paling alami dalam bahasa Indonesia, sementara arti lebih harfiah 'di atas' dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: Yehuwa
  rationale: Nama perjanjian Allah dipertahankan sebagai nama pribadi 'Yahweh', tanpa menggantinya dengan gelar dan tanpa mengurangi daya teofanis ayat ini.
- issue: Gambaran teofani
  choice: menampakkan diri di dalam kemah itu, dalam sebuah tiang awan
  alternative: tampak di kemah itu melalui sebuah tiang awan
  rationale: Rumusan ini mempertahankan dua frasa berpreposisi dalam bahasa Ibrani serta gambaran konkret tentang penampakan ilahi, tanpa menentukan secara dogmatis hubungan tepat antara Yahweh dan tiang awan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat mempertahankan pengulangan 'tiang awan' dari teks Ibrani. Penanda catatan kaki ditempatkan tepat setelah frasa yang diterangkannya.
