    rationale: Teks utama sudah berbunyi "memanggil langit dan bumi menjadi saksi terhadap mereka"; catatan "memanggil ... sebagai saksi" hanya mengulang makna yang sama. Jejak audit Inggris menandai alternatif jumlah Ibrani "heavens".
