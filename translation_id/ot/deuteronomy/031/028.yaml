revisions:
- from: Kumpulkanlah kepadaku semua tua-tua suku kalian dan para pejabat kalian, supaya aku dapat memperdengarkan perkataan-perkataan ini kepada mereka dan memanggil langit dan bumi[a] menjadi saksi terhadap mereka.
  to: Kumpulkanlah kepadaku semua para tua-tua dari suku-suku kalian dan para pejabat kalian, agar aku dapat mengucapkan perkataan-perkataan ini di hadapan mereka dan memanggil langit dan bumi[a] sebagai saksi terhadap mereka.
  rationale: Revisi memulihkan tindakan kohortatif Musa sebagai "mengucapkan" dan menerjemahkan idiom "di telinga mereka" secara alami sebagai "di hadapan mereka". Frasa saksi dipadatkan menjadi bentuk Indonesia yang baku. Catatan kaki diganti dengan alternatif yang benar-benar mencerminkan bentuk jamak Ibrani untuk "langit", sambil mempertahankan idiom Indonesia "langit dan bumi" dalam teks utama.
