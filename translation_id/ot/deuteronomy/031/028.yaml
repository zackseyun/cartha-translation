base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/031/028.yaml
  text: Gather to me all the elders of your tribes and your officers[a], that I may speak these words in their hearing and call heaven and earth to witness against them.
translation:
  language: id
  text: Kumpulkanlah kepadaku semua para tua-tua dari suku-suku kalian dan para pejabat kalian, agar aku dapat mengucapkan perkataan-perkataan ini di hadapan mereka dan memanggil langit dan bumi[a] sebagai saksi terhadap mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “langit-langit dan bumi.”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְהִילוּ
  choice: Kumpulkanlah
  rationale: Bentuk imperatif jamak kausatif dari קהל memerintahkan para pendengar agar menghimpunkan para pemimpin; bentuk ini alami sekaligus mempertahankan daya perintahnya.
- source_word: אֵלַי
  choice: kepadaku
  rationale: Mencerminkan langsung preposisi אֶל dengan akhiran orang pertama tanpa mengubahnya menjadi ungkapan yang lebih longgar seperti 'di hadapanku'.
- source_word: זִקְנֵי שִׁבְטֵיכֶם
  choice: semua tua-tua suku kalian
  rationale: Mempertahankan rantai konstruksi yang menunjuk kepada para tetua dari suku-suku para pendengar; 'tua-tua' merupakan istilah Indonesia yang dikenal untuk jabatan kepemimpinan ini.
- source_word: שֹׁטְרֵיכֶם
  choice: para pejabat kalian
  rationale: Dalam konteks administratif Ulangan, שֹׁטְרִים menunjuk kepada pejabat atau petugas bawahan; 'pejabat' cukup luas dan tidak mempersempit maknanya menjadi 'juru tulis'.
- source_word: וַאֲדַבְּרָה
  choice: supaya aku dapat memperdengarkan
  rationale: Bentuk kohortatif menyatakan tindakan yang dimaksudkan setelah mereka dikumpulkan; 'supaya aku dapat' menyampaikan relasi tujuan secara alami.
- source_word: בְּאָזְנֵיהֶם
  choice: kepada mereka
  rationale: Bersama verba 'memperdengarkan', frasa ini menyampaikan idiom harfiah 'di telinga mereka' dengan jelas dan alami, sekaligus menegaskan bahwa mereka sendiri mendengarnya.
- source_word: אֵת הַדְּבָרִים הָאֵלֶּה
  choice: perkataan-perkataan ini
  rationale: דְּבָרִים dalam konteks ini mengacu pada kata-kata yang akan diucapkan, bukan sekadar perkara abstrak.
- source_word: וְאָעִידָה בָּם
  choice: dan memanggil ... menjadi saksi terhadap mereka
  rationale: 'Hifil dari עוּד dalam konteks perjanjian memiliki corak hukum: menghadirkan saksi atau memberikan kesaksian khidmat; ungkapan ini mempertahankan fungsi saksi dan arah tuduhannya.'
- source_word: אֶת הַשָּׁמַיִם וְאֶת הָאָרֶץ
  choice: langit dan bumi
  rationale: Ini merupakan rumusan saksi perjanjian yang tetap dalam Ulangan; 'langit dan bumi' adalah ungkapan Indonesia yang alami dan khidmat.
theological_decisions:
- issue: Rumusan saksi perjanjian
  choice: memanggil langit dan bumi menjadi saksi terhadap mereka
  alternative: bersaksi terhadap mereka dengan langit dan bumi
  rationale: Pilihan utama mempertahankan gambaran gugatan perjanjian dalam Ulangan, dengan langit dan bumi berfungsi sebagai saksi atas pertanggungjawaban Israel, tanpa menjelaskan lebih jauh daripada teks.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Kata ganti jamak 'kalian' dipakai agar rujukan orang kedua jamak tetap jelas; 'tua-tua' mempertahankan istilah kelembagaan kuno, sedangkan 'pejabat' menghindari penyempitan makna menjadi juru tulis.
