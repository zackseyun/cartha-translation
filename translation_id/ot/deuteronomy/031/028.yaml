  naturalness: '"Kumpulkanlah kepadaku" dapat dipahami dan mempertahankan arah "kepadaku", tetapi konstruksi berikutnya lebih jelas dengan "para tua-tua dari suku-suku kalian". "Mengucapkan ... di hadapan mereka" merupakan ungkapan baku yang alami bagi idiom Ibrani "di telinga mereka".'
  terminology: '"Para tua-tua", "para pejabat", dan "langit dan bumi" sesuai dengan register modern-baku dan konteks administratif-perjanjian. "Sebagai saksi terhadap mereka" menyampaikan daya forensik tanpa menambahkan penafsiran.'
