  - severity: low
    issue: “Bagian dua kali lipat” dapat kurang presisi dalam konteks pembagian warisan.
    rationale: פִּי שְׁנַיִם adalah idiom untuk dua bagian atau bagian ganda dibandingkan bagian ahli waris lain. “Dua bagian” menyampaikan idiom itu secara jelas tanpa kemungkinan mengartikan dua kali seluruh harta.
  - severity: low
