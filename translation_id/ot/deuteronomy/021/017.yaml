base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/017.yaml
  text: But he shall acknowledge the firstborn[a], the son of the unloved wife, by giving him a double portion of all that is found to belong to him, for he is the firstfruits of his vigor[c][b]; the right of the firstborn belongs to him.
translation:
  language: id
  text: Namun, ia harus mengakui anak sulung itu, yakni anak dari istri yang tidak dicintainya,[a] dengan memberikan kepadanya dua bagian[b] dari seluruh harta miliknya. Sebab, anak itu adalah yang pertama dari kekuatannya;[c] hak kesulungan adalah milik anak itu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “istri yang dibencinya.” Dalam konteks ini, ungkapan tersebut dapat berarti istri yang kurang dicintai atau tidak disukai dibandingkan istri yang lain.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “mulut dua,” sebuah idiom yang berarti dua bagian, yaitu bagian ganda dalam pembagian warisan.'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “yang pertama dari kekuatannya.” Ungkapan Ibrani ini merujuk kepada anak pertama sebagai perwujudan awal daya generatif sang ayah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַכִּיר
  choice: harus mengakui
  rationale: Bentuk Hifil ini dalam konteks hukum waris menunjuk pada pengakuan resmi atas kedudukan anak sulung, bukan sekadar mengenalinya.
- source_word: הַבְּכֹר
  choice: anak sulung
  rationale: Istilah baku dan alami dalam bahasa Indonesia untuk anak yang memiliki kedudukan serta hak kesulungan.
- source_word: בֶּן הַשְּׂנוּאָה
  choice: anak dari istri yang tidak dicintainya
  rationale: שְׂנוּאָה secara harfiah dapat berarti 'dibenci', tetapi dalam pertentangan dengan istri yang dicintai istilah ini dapat menyatakan istri yang tidak dicintai atau kurang disukai. Pilihan ini mempertahankan kontras tanpa melebihkan kadar permusuhan.
- source_word: לָתֶת לוֹ פִּי שְׁנַיִם
  choice: dengan memberikan kepadanya bagian dua kali lipat
  rationale: Ungkapan harfiah 'mulut dua' merupakan idiom hukum waris yang berarti dua bagian dibandingkan bagian masing-masing ahli waris lain.
- source_word: בְּכֹל אֲשֶׁר יִמָּצֵא לוֹ
  choice: dari segala miliknya
  rationale: Ungkapan ini mengacu pada segala sesuatu yang terdapat dalam kepunyaan sang ayah, yaitu harta peninggalannya. Terjemahan ini alami dan jelas dalam konteks warisan.
- source_word: רֵאשִׁית אֹנוֹ
  choice: buah pertama dari kekuatannya
  rationale: Pilihan ini mempertahankan unsur 'yang pertama' dan metafora daya atau kekuatan sang ayah, yang dalam konteks ini mencakup daya untuk memperanakkan.
- source_word: מִשְׁפַּט הַבְּכֹרָה
  choice: hak kesulungan
  rationale: Frasa ini menunjuk pada hak hukum yang melekat pada status anak sulung.
- source_word: כִּי ... כִּי
  choice: Namun ... Sebab
  rationale: כִּי pertama bersifat adversatif terhadap larangan pada ayat sebelumnya, sedangkan yang kedua memberikan alasan bagi ketentuan tersebut.
theological_decisions:
- issue: Makna שְׂנוּאָה dalam konteks hukum perkawinan dan warisan
  choice: istri yang tidak dicintainya
  alternative: istri yang dibencinya; istri yang kurang dicintainya
  rationale: Bahasa Ibrani memungkinkan arti kuat 'dibenci', tetapi dalam pasangan kontras dicintai/tidak dicintai dapat menyatakan perbedaan kasih atau keberpihakan. Teks utama memakai ungkapan alami yang tidak memperkeras makna, sedangkan arti harfiah dipertahankan dalam catatan.
- issue: Makna רֵאשִׁית אֹנוֹ
  choice: buah pertama dari kekuatannya
  alternative: yang pertama dari kekuatannya; buah pertama dari daya kejantanannya
  rationale: Terjemahan ini mempertahankan metafora dan kaitan dengan anak pertama tanpa mereduksinya menjadi pernyataan biologis yang terlalu eksplisit; catatan menjelaskan kemungkinan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur hukum ayat dipertahankan dengan 'harus mengakui' dan 'hak kesulungan', sementara idiom Ibrani dijelaskan melalui catatan kaki agar teks utama tetap mudah dipahami.
