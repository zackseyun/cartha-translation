id: DEU.21.14
reference: Deuteronomy 21:14
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָיָ֞ה אִם לֹ֧א חָפַ֣צְתָּ בָּ֗/הּ וְ/שִׁלַּחְתָּ/הּ֙ לְ/נַפְשָׁ֔/הּ וּ/מָכֹ֥ר לֹא תִמְכְּרֶ֖/נָּה בַּ/כָּ֑סֶף לֹא תִתְעַמֵּ֣ר בָּ֔/הּ תַּ֖חַת אֲשֶׁ֥ר עִנִּיתָֽ/הּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/014.yaml
  text: But if it happens that you do not delight in her[a], then you shall let her go where she wishes; you must certainly not sell her for money. You must not treat her as merchandise[c][b], because you have humiliated her.
translation:
  language: id
  text: Tetapi, jika engkau tidak menginginkannya, engkau harus membiarkannya pergi dengan bebas[a]. Engkau sama sekali tidak boleh menjualnya dengan imbalan uang ataupun memperlakukannya sebagai barang dagangan[b], karena engkau telah merendahkannya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “engkau harus melepaskannya”; secara harfiah, “engkau harus menyuruhnya pergi bagi dirinya sendiri.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “memanfaatkannya demi keuntungan.” Kata kerja Ibrani ini jarang digunakan dan tampaknya menunjuk pada perlakuan eksploitatif atau penguasaan terhadap seseorang, khususnya dalam kaitan dengan pemanfaatan ekonomi.
    reason: lexical_alternative
  - marker: c
    text: Atau, “karena engkau telah menindasnya” atau “melanggarnya secara seksual.” Kata Ibrani ini dapat berarti menindas, merendahkan, atau melanggar secara seksual, bergantung pada konteks.
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה אִם
  choice: Namun, jika
  rationale: Menyampaikan perkembangan bersyarat yang berlawanan dengan keadaan sebelumnya secara alami dalam bahasa Indonesia.
- source_word: לֹא חָפַצְתָּ בָּהּ
  choice: engkau tidak lagi menyukainya
  rationale: חפץ menyatakan kesukaan, hasrat, atau kesenangan terhadap seseorang. Kata 'lagi' dipahami dari perkembangan situasi setelah ia mengambil perempuan itu, meski tidak dinyatakan secara leksikal; pilihan ini paling alami dalam konteks, sementara nuansanya dicatat dalam keputusan teologis.
- source_word: וְשִׁלַּחְתָּהּ לְנַפְשָׁהּ
  choice: engkau harus membiarkannya pergi dengan bebas
  rationale: Ungkapan harfiahnya, 'menyuruhnya pergi bagi dirinya sendiri,' berarti melepaskannya agar bebas menentukan hidupnya sendiri.
- source_word: וּמָכֹר לֹא תִמְכְּרֶנָּה בַּכָּסֶף
  choice: Engkau sama sekali tidak boleh menjualnya demi uang
  rationale: Gabungan infinitif absolut dan verba finit menegaskan larangan; 'sama sekali tidak boleh' mempertahankan penekanan itu. בַּכָּסֶף diterjemahkan dengan istilah modern 'demi uang'.
- source_word: לֹא תִתְעַמֵּר בָּהּ
  choice: ataupun memperlakukannya sebagai barang dagangan
  rationale: Verba langka ini dalam konteks larangan menjual menunjuk pada pemanfaatan yang bersifat menguasai atau ekonomis. Pilihan ini mempertahankan gagasan objektifikasi tanpa mempersempitnya menjadi perbudakan.
- source_word: תַּחַת אֲשֶׁר
  choice: karena
  rationale: Konstruksi ini menyatakan alasan bagi larangan sebelumnya.
- source_word: עִנִּיתָהּ
  choice: engkau telah merendahkannya
  rationale: Bentuk piel dari ענה dapat berarti menindas, merendahkan, atau melanggar secara seksual. 'Merendahkan' menjaga keluasan makna dan bobot moralnya, sedangkan kemungkinan yang lebih tajam dipertahankan dalam catatan kaki.
theological_decisions:
- issue: Daya etis hukum mengenai perempuan tawanan
  choice: 'Ayat diterjemahkan sebagai pembatasan tegas atas kuasa laki-laki: perempuan itu harus dilepaskan dan tidak boleh dijual atau dijadikan objek ekonomi.'
  alternative: Menyiratkan perceraian yang sepenuhnya berdasarkan persetujuan, atau secara eksplisit menyebut tindakan sebelumnya sebagai pemerkosaan dalam teks utama.
  rationale: Teks Ibrani menyoroti pelepasan perempuan tersebut dan melarang komodifikasinya karena ia telah direndahkan atau dilanggar. Terjemahan tidak melunakkan latar yang bersifat koersif, tetapi juga tidak mempersempit kata Ibrani melampaui yang dinyatakannya.
- issue: Nuansa waktu dalam לֹא חָפַצְתָּ בָּהּ
  choice: Memakai 'tidak lagi menyukainya' sesuai perkembangan naratif setelah perempuan itu diambil menjadi istri.
  alternative: Memakai 'tidak menyukainya' tanpa kata 'lagi'.
  rationale: Bahasa Ibrani tidak memiliki kata tersendiri untuk 'lagi', tetapi urutan hukum secara pragmatis menunjukkan perubahan sikap. Penambahan ini membuat bahasa Indonesia alami tanpa mengubah pokok ketentuan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'engkau' mempertahankan sapaan hukum orang kedua tunggal. Susunan larangan dibuat tegas dan mudah dipahami, sementara istilah yang berpotensi mempersempit ambiguitas Ibrani dijelaskan dalam catatan kaki.
