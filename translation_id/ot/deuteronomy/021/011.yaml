  yaml_path: translation/ot/deuteronomy/021/011.yaml
  text: and you see among the captives a woman beautiful in form[a], and you desire her and take her for yourself as a wife[b],
translation:
  language: id
  text: dan engkau melihat di antara para tawanan seorang perempuan yang elok rupanya[a], lalu engkau menginginkannya dan mengambilnya sebagai istrimu[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “seorang perempuan yang cantik perawakannya.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “mengambilnya bagi dirimu menjadi istri”; ungkapan Ibrani ini berarti memperistrinya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתָ בַּשִּׁבְיָה
  choice: dan engkau melihat di antara para tawanan
  rationale: Dalam rangkaian hukum yang dimulai pada konteks sebelumnya, bentuk perfektum ini memiliki daya kondisional/temporal. Ungkapan ini mempertahankan kesinambungan dengan konteks serta arti lokatif bahwa perempuan itu berada di antara orang-orang yang ditawan.
- source_word: אֵשֶׁת יְפַת תֹּאַר
  choice: seorang perempuan yang elok rupanya
  rationale: Frasa ini menunjuk pada keelokan bentuk atau penampilan lahiriah. 'Elok rupanya' alami dan bermartabat dalam bahasa Indonesia serta tetap mempertahankan penekanan Ibrani pada penampilan.
- source_word: וְחָשַׁקְתָּ בָהּ
  choice: lalu engkau menginginkannya
  rationale: Kata kerja חָשַׁק menyatakan hasrat atau keterikatan yang kuat. 'Menginginkannya' menyampaikan daya itu tanpa melunakkannya menjadi sekadar tertarik.
- source_word: וְלָקַחְתָּ לְךָ לְאִשָּׁה
  choice: dan mengambilnya sebagai istrimu
  rationale: Ungkapan Ibrani harfiahnya berarti mengambil dia bagi diri sendiri menjadi istri dan merupakan idiom perkawinan. Pilihan ini mempertahankan kata 'mengambil' sekaligus mengungkapkan fungsi לְךָ secara alami melalui 'istrimu'.
theological_decisions:
- issue: Mengungkapkan ketegangan etis dalam hukum mengenai perempuan tawanan tanpa memperhalus atau menambahkan penilaian
  choice: Mempertahankan gambaran langsung tentang keinginan dan tindakan mengambilnya sebagai istri
  alternative: Menerjemahkan secara lebih lunak sebagai 'memilihnya untuk menjadi istrimu' atau menambahkan keterangan tentang paksaan maupun persetujuan
  rationale: Ayat ini sendiri menggambarkan situasi hukum masa perang tanpa memberikan penilaian eksplisit pada setiap unsur dalam klausa tersebut. Terjemahan tidak menyamarkan tindakan laki-laki itu, tetapi juga tidak memasukkan penilaian atau rincian yang tidak dinyatakan dalam teks.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan bermartabat. Pronomina 'engkau' dipakai agar sesuai dengan sapaan hukum tunggal maskulin dalam bahasa Ibrani. 'Elok rupanya' menjaga nuansa penampilan fisik tanpa terdengar klinis, sedangkan 'mengambilnya sebagai istrimu' mempertahankan bentuk idiom Ibrani dan ketegangan etis teks.
