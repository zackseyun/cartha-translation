source:
  edition: WLC
  text: כִּי יִמָּצֵ֣א חָלָ֗ל בָּ/אֲדָמָה֙ אֲשֶׁר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ נֹתֵ֤ן לְ/ךָ֙ לְ/רִשְׁתָּ֔/הּ נֹפֵ֖ל בַּ/שָּׂדֶ֑ה לֹ֥א נוֹדַ֖ע מִ֥י הִכָּֽה/וּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/001.yaml
  text: If a slain man is found in the land that Yahweh your God is giving you to possess[a], lying in the open field, and it is not known who struck him,
translation:
  language: id
  text: Apabila seorang laki-laki yang terbunuh[a] ditemukan tergeletak di padang, di negeri yang diberikan Yahweh, Allahmu, kepadamu untuk kamu miliki, dan tidak diketahui siapa yang memukulnya,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ibrani memakai bentuk maskulin tunggal, “seorang laki-laki yang terbunuh”; dalam ketentuan hukum, bentuk maskulin dapat juga dipakai secara generik.
    reason: Menjelaskan bentuk gramatikal sumber sambil tidak membatasi cakupan prinsip hukum secara tidak semestinya.
lexical_decisions:
- source_word: כִּי
  choice: Apabila
  rationale: Memperkenalkan syarat dalam hukum kasuistik. “Apabila” alami dalam bahasa hukum Indonesia dan tetap memungkinkan arti “jika/ketika” sesuai konteks.
- source_word: יִמָּצֵא
  choice: ditemukan
  rationale: Bentuk nifal dari מצא paling langsung dinyatakan dengan bentuk pasif Indonesia.
- source_word: חָלָל
  choice: seseorang yang terbunuh
  rationale: Kata ini menunjuk pada korban kematian akibat kekerasan, bukan sekadar mayat. Pilihan ini alami dalam bahasa Indonesia dan tidak menetapkan jenis kelamin semantis hanya berdasarkan bentuk gramatikal maskulin.
- source_word: בָּאֲדָמָה
  choice: di negeri
  rationale: Klausa relatif berikutnya menunjukkan bahwa אֲדָמָה di sini adalah wilayah yang diberikan kepada Israel, bukan sekadar tanah atau permukaan bumi.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לְךָ לְרִשְׁתָּהּ
  choice: yang Yahweh, Allahmu, berikan kepadamu untuk kamu miliki
  rationale: Mempertahankan nama ilahi dan gagasan pemberian negeri untuk menjadi milik Israel, dengan susunan Indonesia yang wajar.
- source_word: נֹפֵל
  choice: tergeletak
  rationale: Secara harfiah berarti “jatuh/terjatuh”, tetapi dalam konteks ini menggambarkan keadaan tubuh korban; “tergeletak” menyampaikan keadaan itu secara alami.
- source_word: בַּשָּׂדֶה
  choice: di padang
  rationale: “Padang” menyampaikan kawasan terbuka di luar permukiman tanpa menambahkan kepastian bahwa tanah itu ditanami atau tidak ditanami.
- source_word: לֹא נוֹדַע
  choice: tidak diketahui
  rationale: Ungkapan pasif impersonal ini merupakan padanan langsung dan alami bagi bentuk nifal Ibrani.
- source_word: מִי הִכָּהוּ
  choice: siapa yang menewaskannya
  rationale: נכה secara leksikal berarti memukul atau menghantam, tetapi dalam konteks seorang korban yang terbunuh, bahasa Indonesia secara alami menyatakan akibat fatalnya dengan “menewaskan”. “Memukulnya” dapat disalahpahami sebagai tindakan yang tidak menyebabkan kematian.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks memakai Tetragramaton sebagai nama diri Allah. “Yahweh” mempertahankan nama perjanjian itu dan mengikuti kebijakan proyek.
- issue: Jenis kelamin pada חָלָל
  choice: seseorang yang terbunuh
  alternative: seorang laki-laki yang terbunuh
  rationale: Bentuk Ibrani adalah maskulin tunggal, tetapi kata benda maskulin dapat dipakai tanpa menegaskan bahwa prinsip hukum hanya berlaku bagi korban laki-laki. Catatan kaki mempertahankan informasi bentuk sumber tanpa mempersempit cakupan hukum secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum yang khidmat. “Apabila” serta konstruksi pasif mempertahankan corak hukum kasuistik. Tanda koma akhir dipertahankan karena ayat ini merupakan anak kalimat yang berlanjut ke ayat berikutnya.
