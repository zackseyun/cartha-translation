source:
  edition: WLC
  text: לֹא תָלִ֨ין נִבְלָת֜/וֹ עַל הָ/עֵ֗ץ כִּֽי קָב֤וֹר תִּקְבְּרֶ֨/נּוּ֙ בַּ/יּ֣וֹם הַ/ה֔וּא כִּֽי קִלְלַ֥ת אֱלֹהִ֖ים תָּל֑וּי וְ/לֹ֤א תְטַמֵּא֙ אֶת אַדְמָ֣תְ/ךָ֔ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/023.yaml
  text: His corpse shall not remain all night on the tree[a], but you shall surely bury him that same day, for a hanged man is under God's curse; and you shall not defile your land that Yahweh your God is giving you as an inheritance.
translation:
  language: id
  text: Mayatnya tidak boleh dibiarkan semalaman di pohon, tetapi kamu harus menguburkannya pada hari itu juga, sebab orang yang digantung berada di bawah kutuk Allah[a]; janganlah kamu menajiskan tanahmu yang Yahweh, Allahmu, berikan kepadamu sebagai warisan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “orang yang digantung dikutuk oleh Allah”; kemungkinan lain, “penggantungan itu merupakan penghinaan terhadap Allah.” Frasa Ibraninya ringkas dan dapat dipahami dengan lebih dari satu cara.
    reason: alternative_reading
lexical_decisions:
- source_word: תָלִין
  choice: dibiarkan semalaman
  rationale: Bentuk verba dari לון menyatakan tinggal atau dibiarkan melewati malam; bentuk pasif ini alami dalam bahasa Indonesia dan mempertahankan daya larangan.
- source_word: נִבְלָתוֹ
  choice: mayatnya
  rationale: נְבֵלָה menunjuk pada tubuh yang telah mati; 'mayat' tepat dan mudah dipahami.
- source_word: עַל הָעֵץ
  choice: pada pohon
  rationale: עֵץ dapat berarti pohon atau kayu. 'Pohon' mempertahankan ungkapan konkret teks serta gaungnya dalam tradisi Alkitab selanjutnya.
- source_word: קָבוֹר תִּקְבְּרֶנּוּ
  choice: harus menguburkannya
  rationale: Infinitif absolut yang diikuti bentuk finit menegaskan perintah. 'Harus' menyampaikan penegasan itu secara alami dalam bahasa Indonesia.
- source_word: בַּיּוֹם הַהוּא
  choice: pada hari itu juga
  rationale: '''Itu juga'' mengungkapkan tuntutan agar penguburan dilaksanakan sebelum hari tersebut berakhir.'
- source_word: קִלְלַת אֱלֹהִים
  choice: kutuk Allah
  rationale: Frasa konstruksi ini ringkas dan dapat ditafsirkan dengan beberapa cara. 'Kutuk Allah' mempertahankan hubungan genitif tanpa menjelaskan secara berlebihan.
- source_word: תָּלוּי
  choice: orang yang digantung
  rationale: Partisip pasif ini berarti orang yang digantung atau digantungkan; pilihan ini jelas dan tidak menentukan apakah penggantungan merupakan cara eksekusi atau pemajangan mayat.
- source_word: תְטַמֵּא
  choice: menajiskan
  rationale: טמא dalam konteks kesucian tanah mencakup pencemaran ritual dan moral; 'menajiskan' mempertahankan kedua nuansa tersebut.
- source_word: אַדְמָתְךָ
  choice: tanahmu
  rationale: אֲדָמָה dapat berarti tanah, lahan, atau negeri. 'Tanahmu' cocok dengan konteks tanah pemberian dan tetap dekat dengan citra sumber.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan suatu gelar.
- source_word: נַחֲלָה
  choice: sebagai warisan
  rationale: נַחֲלָה menunjuk pada milik yang diterima sebagai pusaka; 'sebagai warisan' alami bagi pembaca modern dan mempertahankan gagasan tanah pemberian.
theological_decisions:
- issue: Makna כִּי קִלְלַת אֱלֹהִים תָּלוּי
  choice: orang yang digantung berada di bawah kutuk Allah
  alternative: orang yang digantung dikutuk oleh Allah; atau penggantungan itu merupakan penghinaan terhadap Allah
  rationale: Susunan Ibraninya padat dan hubungan antara 'kutuk', 'Allah', dan 'orang yang digantung' dapat dipahami dengan lebih dari satu cara. Teks utama menyatakan bahwa orang itu berada di bawah kutuk Allah tanpa menetapkan lebih jauh sifat genitifnya, sedangkan kemungkinan lain dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang tegas dan bermartabat. Kata 'harus' menyampaikan penegasan konstruksi Ibrani secara lebih alami daripada pengulangan harfiah. Ambiguitas teologis utama dipertahankan melalui rumusan teks dan catatan kaki.
