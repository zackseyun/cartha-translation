  source_fidelity: Terjemahan secara akurat menyampaikan urutan ketentuan hukum dari waw konsekutif, tindakan membawa perempuan itu ke dalam rumah, mencukur kepala, dan tindakan terhadap kuku. “Harus” wajar untuk daya normatif konteks hukum. “Ke dalam rumahmu” dengan tepat menyatakan arah masuk dari אֶל־תּוֹךְ בֵּיתֶךָ tanpa keharusan menerjemahkan תּוֹךְ secara kaku sebagai ‘tengah’.
