  yaml_path: translation/ot/deuteronomy/021/012.yaml
  text: then you shall bring her into your house[a], and she shall shave her head and trim her nails.
translation:
  language: id
  text: lalu engkau harus membawa perempuan itu ke dalam rumahmu, dan ia harus mencukur kepalanya serta memotong kukunya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “membiarkan kukunya tumbuh panjang.” Secara harfiah, bahasa Ibraninya berbunyi “melakukan kukunya”; ungkapan ini bersifat idiomatis dan maknanya diperdebatkan.
    reason: alternative_reading
lexical_decisions:
- source_word: וַהֲבֵאתָהּ
  choice: lalu engkau harus membawa perempuan itu
  rationale: Bentuk Hifil dengan waw melanjutkan urutan ketentuan hukum. 'Lalu' menyatakan urutan, sedangkan 'harus membawa' menyampaikan kewajiban tanpa mengaburkankan pelakunya.
- source_word: אֶל תּוֹךְ בֵּיתֶךָ
  choice: ke dalam rumahmu
  rationale: Ungkapan ini menunjuk masuk ke bagian dalam rumah. 'Ke dalam rumahmu' alami dalam bahasa Indonesia dan tetap mempertahankan arah masuk yang dinyatakan teks Ibrani.
- source_word: וְגִלְּחָה אֶת רֹאשָׁהּ
  choice: dan ia harus mencukur kepalanya
  rationale: גלח berarti 'mencukur'; dengan kepala sebagai objek, ungkapan Indonesia yang wajar ialah 'mencukur kepalanya' tanpa menambahkan bahwa rambut dicukur sampai habis.
- source_word: וְעָשְׂתָה אֶת צִפָּרְנֶיהָ
  choice: serta memotong kukunya
  rationale: Secara harfiah frasa ini berarti 'melakukan/mengurus kukunya' dan maknanya diperdebatkan. 'Memotong kukunya' merupakan pemaknaan idiomatis yang jelas untuk teks utama, sementara kemungkinan 'membiarkan kukunya tumbuh panjang' dicatat dalam catatan kaki.
theological_decisions:
- issue: Ambiguitas frasa וְעָשְׂתָה אֶת צִפָּרְנֶיהָ
  choice: Perempuan itu harus memotong kukunya.
  alternative: Perempuan itu harus membiarkan kukunya tumbuh panjang.
  rationale: Bahasa Ibraninya hanya mengatakan bahwa ia 'melakukan/mengurus kukunya', sehingga tindakan persisnya tidak dinyatakan secara eksplisit. Teks utama memakai pemaknaan idiomatis yang lazim, tetapi alternatif utama dipertahankan dalam catatan kaki agar ambiguitas asli tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam hukum yang lugas dan bermartabat. Pronomina 'engkau' mempertahankan sapaan orang kedua tunggal dalam konteks ketentuan Taurat; 'perempuan itu' memperjelas objek feminin yang dalam bahasa Ibrani dinyatakan melalui sufiks.
