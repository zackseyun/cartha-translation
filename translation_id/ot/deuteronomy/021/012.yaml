  terminology: “Mencukur kepalanya” tepat untuk וְגִלְּחָה אֶת־רֹאשָׁהּ. “Memotong kukunya” adalah pembacaan idiomatis yang dapat dipertahankan dalam teks utama, sementara catatan kaki dengan tepat melestarikan alternatif penting ‘membiarkan kukunya tumbuh panjang’ dan menjelaskan bahwa ungkapan Ibrani diperdebatkan. Penanda [a] ditempatkan pada akhir kalimat yang memuat frasa terkait dan dapat diterima.
