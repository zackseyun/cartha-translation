translation:
  language: id
  text: maka para tetuamu dan para hakimmu harus keluar dan mengukur jarak dari orang yang terbunuh itu ke kota-kota di sekitarnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “mengukur ke kota-kota yang ada di sekitar orang yang terbunuh itu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצְאוּ
  choice: maka ... harus keluar
  rationale: Waw dengan bentuk qatal melanjutkan urutan prosedur hukum. “Maka” menyatakan kelanjutan itu secara alami, sedangkan “harus” menyampaikan daya normatif konteks hukum.
- source_word: זְקֵנֶיךָ
  choice: para tua-tuamu
  rationale: Mempertahankan sebutan bagi para pemimpin tua masyarakat serta akhiran orang kedua tunggal yang menyapa Israel secara kolektif.
- source_word: וְשֹׁפְטֶיךָ
  choice: dan para hakimmu
  rationale: Bentuk dari שׁפט menunjuk kepada orang-orang yang menjalankan wewenang peradilan; “hakim” merupakan padanan langsung dalam konteks hukum ini.
- source_word: וּמָדְדוּ
  choice: dan mengukur jarak
  rationale: Verba itu berarti “mengukur”; penambahan “jarak” menyatakan secara wajar dalam bahasa Indonesia apa yang diukur tanpa mengubah tindakan yang diperintahkan.
- source_word: אֶל הֶעָרִים
  choice: ke kota-kota
  rationale: Preposisi אֶל menandai kota-kota sebagai titik tujuan pengukuran.
- source_word: אֲשֶׁר סְבִיבֹת
  choice: di sekitarnya
  rationale: Ungkapan relatif ini mengidentifikasi kota-kota yang berada di sekitar lokasi orang yang terbunuh; bentuk ini ringkas dan alami dalam bahasa Indonesia.
- source_word: הֶחָלָל
  choice: orang yang terbunuh itu
  rationale: חָלָל menunjuk kepada orang yang mati karena dibunuh atau ditewaskan. Pilihan ini mempertahankan unsur kematian akibat kekerasan tanpa menetapkan rincian hukum lebih jauh.
