  text: וּ֠/רְגָמֻ/הוּ כָּל אַנְשֵׁ֨י עִיר֤/וֹ בָֽ/אֲבָנִים֙ וָ/מֵ֔ת וּ/בִֽעַרְתָּ֥ הָ/רָ֖ע מִ/קִּרְבֶּ֑/ךָ וְ/כָל יִשְׂרָאֵ֖ל יִשְׁמְע֥וּ וְ/יִרָֽאוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/021.yaml
  text: Then all the men of his city shall stone him with stones[a], and he shall die. So you shall purge the evil from your midst, and all Israel shall hear and fear.
translation:
  language: id
  text: Kemudian semua laki-laki di kotanya[a] harus merajamnya dengan batu, dan ia akan mati. Demikianlah kamu harus menyingkirkan kejahatan dari tengah-tengahmu. Seluruh Israel akan mendengar dan menjadi takut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “semua penduduk kotanya”; bahasa Ibrani secara harfiah, “semua laki-laki kotanya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְגָמֻהוּ
  choice: harus merajamnya
  rationale: Dalam konteks hukum, רגם menunjuk secara khusus pada pelaksanaan hukuman mati dengan pelemparan batu. Kata “merajam” merupakan padanan Indonesia yang ringkas dan tepat.
- source_word: כָּל אַנְשֵׁי עִירוֹ
  choice: semua laki-laki di kotanya
  rationale: Frasa Ibrani secara harfiah berarti “semua laki-laki kotanya” dan menunjuk kepada kaum laki-laki kota itu yang bertindak secara bersama dalam pelaksanaan keputusan hukum. Bentuk maskulin dipertahankan tanpa menarik kesimpulan yang melampaui teks.
- source_word: בָאֲבָנִים
  choice: dengan batu
  rationale: Frasa ini menyatakan sarana pelaksanaan hukuman dan mempertahankan gambaran konkret dari teks Ibrani.
- source_word: וָמֵת
  choice: dan ia akan mati
  rationale: Klausa ini menyatakan hasil rajam sebagai langkah berikutnya, tanpa mengubahnya menjadi klausa tujuan.
- source_word: וּבִעַרְתָּ
  choice: kamu harus menyingkirkan
  rationale: Dalam rumusan hukum yang berulang di Ulangan, בער berarti membuang atau menyingkirkan kejahatan dari komunitas, bukan membakarnya secara harfiah. “Menyingkirkan” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: הָרָע
  choice: kejahatan
  rationale: Nomina abstrak tunggal ini menyatakan kategori moral-hukum dan paling alami diterjemahkan sebagai “kejahatan”.
- source_word: מִקִּרְבֶּךָ
  choice: dari tengah-tengahmu
  rationale: Pilihan ini mempertahankan ungkapan komunitas perjanjian dan bentuk orang kedua tunggal dalam bahasa sumber.
- source_word: יִשְׁמְעוּ
  choice: akan mendengar
  rationale: Terjemahan ini mempertahankan verba sederhana “mendengar” tanpa menambahkan objek yang tidak dinyatakan secara eksplisit.
- source_word: וְיִרָאוּ
  choice: dan menjadi takut
  rationale: Dalam konteks ini ירא menggambarkan rasa takut yang timbul karena peringatan hukuman; pilihan ini mempertahankan daya emosional dan fungsi pencegahannya.
theological_decisions:
- issue: Istilah kewargaan yang bergender dalam konteks hukum
  choice: semua laki-laki di kotanya
  alternative: semua penduduk kotanya
  rationale: Teks Ibrani memakai bentuk maskulin yang secara harfiah berarti “laki-laki.” Terjemahan mempertahankannya demi ketepatan gender tanpa menjadikannya dasar bagi klaim doktrinal yang lebih luas.
- issue: Rumusan penyingkiran dalam hukum Ulangan
  choice: menyingkirkan kejahatan dari tengah-tengahmu
  alternative: membersihkan kejahatan dari antaramu
  rationale: Pilihan ini mempertahankan gagasan bahwa kejahatan harus dikeluarkan dari komunitas dan tetap jelas bagi pembaca Indonesia modern. Kata “menyingkirkan” juga menghindari kesan pembakaran harfiah yang tidak dimaksudkan di sini.
- issue: Daya pencegah hukuman bagi seluruh Israel
  choice: akan mendengar dan menjadi takut
  alternative: akan mendengar lalu merasa gentar
  rationale: Terjemahan langsung ini menjaga hubungan antara kabar tentang keputusan hukum dan rasa takut yang dihasilkannya, tanpa mempersempit rasa takut itu menjadi sekadar keterkejutan atau menafsirkannya secara khusus sebagai kesalehan.
translation_notes:
  register: Bahasa hukum dibuat khidmat tetapi tetap alami dalam bahasa Indonesia modern. Bentuk “harus” menyampaikan tuntutan hukum, sedangkan “merajamnya dengan batu” mempertahankan tindakan dan sarana yang disebutkan secara eksplisit. Pronomina orang kedua tunggal dipertahankan dalam “kamu” dan “-mu”.
