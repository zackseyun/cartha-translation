base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/022.yaml
  text: And if in a man there is a sin deserving death[a], and he is put to death, and you hang him on a tree[b],
translation:
  language: id
  text: Jika seorang laki-laki melakukan dosa yang patut dihukum mati[a], dan ia dihukum mati, lalu engkau menggantungnya pada pohon[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “yang layak mati” atau “yang dijatuhi hukuman mati.” Ungkapan Ibraninya secara harfiah adalah “dosa/penghakiman kematian.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “pada sebuah tiang.” Kata Ibraninya secara harfiah berarti “pohon” atau “kayu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִי
  choice: Jika
  rationale: Membuka kasus hukum bersyarat secara alami dalam bahasa Indonesia; waw Ibrani tidak perlu diterjemahkan tersendiri pada awal kalimat.
- source_word: יִהְיֶה בְ/אִישׁ
  choice: pada seorang laki-laki terdapat
  rationale: Mempertahankan gagasan keberadaan dalam idiom Ibrani dan subjek maskulin tunggal אישׁ, sambil tetap wajar dalam bahasa Indonesia.
- source_word: חֵטְא
  choice: dosa
  rationale: Mempertahankan dimensi moral sekaligus hukum tanpa mempersempitnya menjadi sekadar pelanggaran sipil atau kejahatan.
- source_word: מִשְׁפַּט מָוֶת
  choice: yang patut dihukum mati
  rationale: Menyampaikan ungkapan padat yang secara harfiah berkaitan dengan 'penghakiman/hukuman mati', tanpa memastikan secara berlebihan apakah frasa itu menunjuk kelayakan menerima hukuman atau vonis yang telah dijatuhkan.
- source_word: וְ/הוּמָת
  choice: lalu ia dihukum mati
  rationale: Bentuk Hofal menyatakan tindakan pasif-kausatif; pilihan ini sesuai dengan konteks hukum dan lebih tepat daripada 'dibunuh'.
- source_word: וְ/תָלִיתָ אֹת/וֹ
  choice: dan engkau menggantungnya
  rationale: Menjaga bentuk orang kedua tunggal dan arti dasar תלה, yaitu menggantung atau menggantungkan.
- source_word: עַל עֵץ
  choice: pada sebatang pohon
  rationale: Mempertahankan arti dasar עֵץ dan gema antarteks Alkitab; 'tiang' tetap dicatat sebagai kemungkinan kontekstual.
theological_decisions:
- issue: Subjek hukum yang bergender
  choice: seorang laki-laki
  alternative: seseorang; seorang
  rationale: אישׁ berbentuk maskulin tunggal dan dalam kasus hukum ini menunjuk seorang laki-laki; terjemahan tidak menetralkan unsur tersebut.
- issue: Makna מִשְׁפַּט מָוֶת
  choice: yang patut dihukum mati
  alternative: yang layak mati; yang dijatuhi hukuman mati
  rationale: Pilihan utama alami dalam bahasa Indonesia dan mempertahankan hubungan dosa dengan hukuman mati, sedangkan catatan kaki menjaga kemungkinan bahwa ungkapan itu menunjuk vonis atau hukuman mati.
- issue: Bentuk benda pada עַל עֵץ
  choice: pada sebatang pohon
  alternative: pada sebuah tiang
  rationale: Terjemahan literal menjaga bahasa sumber dan signifikansi antarteks tanpa menetapkan secara sempit bentuk sarana penggantungan.
translation_notes:
  register: Bahasa hukum yang modern, lugas, dan bermartabat. Bentuk 'engkau' dipakai untuk mempertahankan orang kedua tunggal dalam ketetapan, dan susunan kalimat dibiarkan berlanjut dengan koma karena ayat berikutnya menyelesaikan ketentuan hukum ini.
