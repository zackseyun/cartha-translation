base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/009.yaml
  text: So you shall purge the innocent blood from your midst[a], because you shall do what is right in the eyes of Yahweh.
translation:
  language: id
  text: Dengan demikian, engkau harus menyingkirkan darah orang yang tidak bersalah dari tengah-tengahmu[a], sebab engkau harus melakukan apa yang benar di mata Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “menyingkirkan darah orang yang tidak bersalah dari antaramu.” Ungkapan Ibrani “darah orang yang tidak bersalah” juga dapat menyiratkan tanggungan umat atas penumpahan darah yang belum dituntaskan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: Dengan demikian, engkau
  rationale: Konjungsi dan pronomina mandiri membentuk peralihan kesimpulan yang tegas. “Dengan demikian” menyampaikan daya simpulannya, sedangkan “engkau” mempertahankan sapaan orang kedua tunggal kepada Israel sebagai satu umat.
- source_word: תְּבַעֵר
  choice: harus menyingkirkan
  rationale: Dalam konteks hukum Ulangan, bentuk Piel dari בער berarti membuang atau membersihkan sesuatu yang mencemarkan umat. “Menyingkirkan” alami dalam bahasa Indonesia dan tetap mempertahankan tuntutan untuk menghapusnya dari komunitas.
- source_word: הַדָּם הַנָּקִי
  choice: darah orang yang tidak bersalah
  rationale: Ungkapan Ibrani secara harfiah berarti “darah yang tidak bersalah”, yakni darah yang ditumpahkan dari orang yang tidak bersalah. Rumusan ini mempertahankan gambaran darah sekaligus jelas bagi pembaca Indonesia.
- source_word: מִקִּרְבֶּךָ
  choice: dari tengah-tengahmu
  rationale: Ungkapan ini mempertahankan dimensi komunal dan bentuk orang kedua tunggal dari teks sumber.
- source_word: כִּי
  choice: sebab
  rationale: Di sini כִּי dibaca sebagai penanda alasan bagi pernyataan sebelumnya. “Sebab” mempertahankan hubungan kausal tanpa membuat kalimat terasa kaku.
- source_word: תַעֲשֶׂה
  choice: engkau harus melakukan
  rationale: Bentuk imperfek dalam konteks hukum memiliki daya preskriptif. “Harus” menyatakan kewajiban dengan jelas dalam bahasa Indonesia modern.
- source_word: הַיָּשָׁר
  choice: apa yang benar
  rationale: Adjektiva ini berfungsi sebagai nomina dan menunjuk kepada tindakan yang benar secara moral.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Terjemahan ini mempertahankan metafora penilaian ilahi dalam bahasa Ibrani dan menggunakan nama perjanjian Yahweh.
theological_decisions:
- issue: Makna “darah orang yang tidak bersalah”
  choice: Mempertahankan gambaran konkret tentang darah, dengan catatan mengenai kemungkinan tanggungan komunal
  alternative: tanggungan atas penumpahan darah orang yang tidak bersalah
  rationale: Teks menyebut darah secara langsung, tetapi dalam konteks hukum ungkapan itu dapat mencakup tanggungan umat akibat pembunuhan yang belum dibereskan. Terjemahan utama tidak mempersempit ambiguitas tersebut.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks sumber memakai nama ilahi יהוה; bentuk “Yahweh” mempertahankannya sebagai nama diri.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan “engkau” dipakai untuk mempertahankan orang kedua tunggal yang mengacu kepada Israel secara kolektif. Struktur kalimat menjaga corak hukum-perjanjian tanpa menjadi terlalu harfiah.
