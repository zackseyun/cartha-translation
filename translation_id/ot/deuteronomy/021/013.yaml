  text: וְ/הֵסִ֩ירָה֩ אֶת שִׂמְלַ֨ת שִׁבְיָ֜/הּ מֵ/עָלֶ֗י/הָ וְ/יָֽשְׁבָה֙ בְּ/בֵיתֶ֔/ךָ וּ/בָֽכְתָ֛ה אֶת אָבִ֥י/הָ וְ/אֶת אִמָּ֖/הּ יֶ֣רַח יָמִ֑ים וְ/אַ֨חַר כֵּ֜ן תָּב֤וֹא אֵלֶ֨י/הָ֙ וּ/בְעַלְתָּ֔/הּ וְ/הָיְתָ֥ה לְ/ךָ֖ לְ/אִשָּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/013.yaml
  text: She shall remove the clothing of her captivity from herself and remain in your house[a], and mourn her father and her mother for a month of days. After that you may go in to her and be her husband, and she shall be your wife.
translation:
  language: id
  text: Ia harus menanggalkan pakaian yang dikenakannya sebagai tawanan[a], lalu tinggal di rumahmu dan menangisi ayah serta ibunya selama sebulan penuh. Sesudah itu, engkau boleh menggaulinya dan menjadi suaminya, dan ia akan menjadi istrimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “pakaian penawanannya”; dapat juga berarti “pakaian yang berkaitan dengan keadaannya sebagai tawanan” atau “pakaian yang dikenakannya ketika ditawan.”'
    reason: Frasa שִׂמְלַת שִׁבְיָהּ merupakan genitif yang makna tepatnya diperdebatkan. Catatan ini mempertahankan alternatif tanpa membatasi teks utama pada saat penangkapan.
lexical_decisions:
- source_word: וְהֵסִירָה ... שִׂמְלַת שִׁבְיָהּ מֵעָלֶיהָ
  choice: Ia harus menanggalkan pakaian yang dikenakannya ketika ditawan
  rationale: Bentuk Hifil dari סור menyatakan tindakan melepaskan atau menanggalkan. Frasa genitif Ibrani secara harfiah berarti 'pakaian penawanannya'; pilihan ini menyampaikan makna yang mungkin dimaksud tanpa menjadikannya istilah teknis yang tidak wajar dalam bahasa Indonesia, sementara alternatif harfiah dicatat dalam catatan kaki.
- source_word: וְיָשְׁבָה בְּבֵיתֶךָ
  choice: lalu tinggal di rumahmu
  rationale: ישב dalam konteks ini berarti tinggal atau menetap. 'Tinggal' alami dan tetap mempertahankan urutan ketentuan hukum.
- source_word: וּבָכְתָה אֶת־אָבִיהָ וְאֶת־אִמָּהּ
  choice: dan menangisi ayah serta ibunya
  rationale: בכה pada dasarnya berarti menangis atau meratap. 'Menangisi' mempertahankan gambaran tangisan dan secara alami menyatakan dukacita atas ayah dan ibunya.
- source_word: יֶרַח יָמִים
  choice: selama sebulan penuh
  rationale: Ungkapan harfiahnya 'sebulan hari-hari' dan menunjuk pada jangka waktu satu bulan lengkap. 'Sebulan penuh' mempertahankan tekanannya dalam bahasa Indonesia yang wajar.
- source_word: וְאַחַר כֵּן
  choice: Sesudah itu
  rationale: Penanda urutan waktu yang langsung dan alami.
- source_word: תָּבוֹא אֵלֶיהָ
  choice: engkau boleh menghampirinya
  rationale: Secara harfiah, idiom ini berarti 'masuk/mendatangi dia' dan dalam konteks perkawinan mengacu pada hubungan seksual. 'Menghampirinya' mempertahankan ungkapan halus sumber, sedangkan daya izin hukum dinyatakan dengan 'boleh'.
- source_word: וּבְעַלְתָּהּ
  choice: dan menjadi suaminya
  rationale: Dalam bentuk dan konteks ini, בעל menyatakan mengambil peran sebagai suami. Pilihan ini mempertahankan unsur perkawinan tanpa memasukkan nuansa kepemilikan yang menyesatkan.
- source_word: וְהָיְתָה לְךָ לְאִשָּׁה
  choice: dan ia akan menjadi istrimu
  rationale: Rumusan status perkawinan diterjemahkan secara alami serta tetap dibedakan dari tindakan mendahuluinya.
theological_decisions:
- issue: Ungkapan seksual dan status perkawinan dalam hukum mengenai perempuan tawanan
  choice: 'Mempertahankan dua unsur yang dibedakan teks: menghampiri perempuan itu dan menjadi suaminya, lalu statusnya sebagai istri.'
  alternative: Meringkas seluruh rangkaian sebagai 'menikahinya', atau memperjelasnya secara gamblang sebagai 'bersetubuh dengannya'.
  rationale: Bahasa Ibrani membedakan tindakan mendatangi perempuan itu, peran laki-laki sebagai suami, dan status perempuan sebagai istri. Terjemahan ini tidak melunakkan semuanya menjadi romansa, tetapi juga tidak membuatnya lebih gamblang atau lebih keras daripada teks sumber.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang bermartabat. Sapaan tunggal dipertahankan melalui 'engkau' dan bentuk posesif '-mu'. Ungkapan sulit tidak dibuat lebih romantis ataupun lebih gamblang daripada bahasa Ibrani.
