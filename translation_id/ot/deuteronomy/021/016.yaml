  text: וְ/הָיָ֗ה בְּ/יוֹם֙ הַנְחִיל֣/וֹ אֶת בָּנָ֔י/ו אֵ֥ת אֲשֶׁר יִהְיֶ֖ה ל֑/וֹ לֹ֣א יוּכַ֗ל לְ/בַכֵּר֙ אֶת בֶּן הָ֣/אֲהוּבָ֔ה עַל פְּנֵ֥י בֶן הַ/שְּׂנוּאָ֖ה הַ/בְּכֹֽר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/016.yaml
  text: And on the day he gives his sons as an inheritance what belongs to him[a], he may not treat the son of the loved wife as firstborn over the son of the hated wife, who is the firstborn.
translation:
  language: id
  text: Pada hari ia membagikan sebagai warisan kepada putra-putranya apa yang menjadi miliknya, ia tidak boleh mengutamakan putra istri yang dicintainya sebagai anak sulung daripada putra istri yang dibencinya[a], yang adalah anak sulung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “istri yang tidak dicintainya” atau “istri yang kurang dicintainya.” Secara harfiah, bahasa Ibrani mengontraskan “dicintai” dengan “dibenci”, tetapi dalam konteks hukum keluarga, kata yang terakhir dapat menunjuk kepada istri yang relatif kurang disayangi, bukan yang secara aktif dibenci.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בְּיוֹם
  choice: Pada waktu
  rationale: Ungkapan ini membuka suatu keadaan hukum. 'Pada waktu' menyampaikan kerangka temporal secara alami tanpa mengharuskan arti satu hari tertentu.
- source_word: הַנְחִילוֹ אֶת־בָּנָיו אֵת אֲשֶׁר יִהְיֶה לוֹ
  choice: ia membagikan kepada anak-anaknya sebagai warisan apa yang menjadi miliknya
  rationale: Mempertahankan unsur kausatif נחל dan objek harta milik sang ayah, tetapi menyusunnya secara wajar dalam bahasa Indonesia.
- source_word: לֹא יוּכַל
  choice: ia tidak boleh
  rationale: Dalam konteks hukum, frasa ini menyatakan larangan atau ketiadaan hak, bukan sekadar ketidakmampuan.
- source_word: לְבַכֵּר
  choice: memperlakukan ... sebagai anak sulung
  rationale: Piel בכר menunjuk pada pemberian kedudukan atau hak anak sulung, bukan perubahan urutan kelahiran secara harfiah.
- source_word: בֶּן הָאֲהוּבָה
  choice: anak dari istri yang dicintainya
  rationale: Partisip pasif berarti 'yang dicintai'; 'istri' dinyatakan secara eksplisit berdasarkan konteks hukum sebelumnya.
- source_word: עַל־פְּנֵי
  choice: dengan mengutamakannya daripada
  rationale: Dalam perbandingan hukum ini, ungkapan tersebut menandai preferensi atau keutamaan atas pihak lain.
- source_word: בֶן הַשְּׂנוּאָה
  choice: anak dari istri yang dibencinya
  rationale: Terjemahan utama mempertahankan kontras kuat harfiah antara 'dicintai' dan 'dibenci', sedangkan kemungkinan nuansa komparatif dijelaskan dalam catatan kaki.
- source_word: הַבְּכֹר
  choice: yang memang adalah anak sulung
  rationale: Frasa relatif memperjelas bahwa anak dari istri yang dibenci itu adalah anak sulung yang sebenarnya; 'memang' menegaskan kontras tanpa menambah status baru.
theological_decisions:
- issue: Kontras hubungan dalam rumah tangga beristri lebih dari satu
  choice: Mempertahankan 'istri yang dicintainya' dan 'istri yang dibencinya' dalam teks utama
  alternative: '''istri yang kurang dicintainya'' atau ''istri yang tidak dicintainya'''
  rationale: Teks Ibrani memakai pasangan antonim yang kuat. Terjemahan utama tidak melunakkannya, tetapi catatan kaki menjaga kemungkinan bahwa dalam konteks keluarga dan hukum istilah kedua menyatakan kasih yang lebih sedikit, bukan kebencian aktif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum yang bermartabat. Susunan kalimat menjaga pembedaan antara tindakan membagikan warisan, perlakuan sebagai anak sulung, dan fakta bahwa anak dari istri yang dibenci adalah anak sulung sebenarnya.
