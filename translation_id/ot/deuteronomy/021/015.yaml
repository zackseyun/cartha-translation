base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/015.yaml
  text: If a man has two wives[a], one loved and the other unloved, and both the loved and the unloved have borne him sons, and the firstborn son belongs to the unloved wife,
translation:
  language: id
  text: Jika seorang laki-laki mempunyai dua istri, yang satu dicintai dan yang lain tidak dicintai[a], dan baik istri yang dicintai maupun yang tidak dicintai melahirkan anak-anak laki-laki baginya, dan anak laki-laki yang sulung adalah anak dari istri yang tidak dicintai,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “dibenci”. Kata Ibrani ini dapat memiliki arti yang lebih kuat, tetapi di sini kemungkinan menunjuk kepada istri yang tidak dikasihi atau tidak diutamakan, sebagai lawan dari istri yang dicintai.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Jika
  rationale: Memperkenalkan suatu kasus hukum secara bersyarat; “Jika” wajar dalam rumusan hukum bahasa Indonesia.
- source_word: תִהְיֶיןָ לְאִישׁ
  choice: seorang laki-laki mempunyai
  rationale: Mengungkapkan konstruksi eksistensial-kepunyaan Ibrani dengan idiom Indonesia yang alami.
- source_word: שְׁתֵּי נָשִׁים
  choice: dua istri
  rationale: Dalam konteks perkawinan dan warisan ini, נָשִׁים berarti para istri, bukan sekadar perempuan.
- source_word: הָאַחַת אֲהוּבָה
  choice: yang satu dicintai
  rationale: Mempertahankan arti langsung bentuk pasif אֲהוּבָה tanpa menggantinya dengan tafsiran “lebih disukai”.
- source_word: וְהָאַחַת שְׂנוּאָה
  choice: yang lain tidak dicintai
  rationale: Menjaga pertentangan relasional dengan “dicintai” tanpa memastikan bahwa yang dimaksud adalah kebencian aktif; arti yang lebih kuat dicatat dalam catatan kaki.
- source_word: וְיָלְדוּ לוֹ בָנִים
  choice: melahirkan anak-anak lelaki baginya
  rationale: בָנִים secara khusus berarti anak-anak lelaki, sesuai dengan hukum mengenai hak anak sulung.
- source_word: הָאֲהוּבָה וְהַשְּׂנוּאָה
  choice: baik istri yang dicintai maupun yang tidak dicintai
  rationale: Menegaskan bahwa kedua istri tersebut melahirkan anak-anak lelaki, sebagaimana struktur Ibrani menunjukkan.
- source_word: וְהָיָה הַבֵּן הַבְּכוֹר
  choice: tetapi anak lelaki yang sulung adalah
  rationale: Konstruksi keadaan ini mengarahkan kasus kepada fakta hukum yang relevan. “Tetapi” menyatakan kontras implisit secara alami dengan status istri yang dicintai, sementara “anak lelaki yang sulung” mempertahankan penandaan gender dalam teks.
- source_word: לַשְּׂנִיאָה
  choice: anak dari istri yang tidak dicintai
  rationale: Lamed menyatakan hubungan; dalam konteks ini hubungan yang dimaksud ialah bahwa istri yang tidak dicintai merupakan ibu anak sulung tersebut.
theological_decisions:
- issue: Makna שְׂנוּאָה dalam konteks hukum keluarga
  choice: tidak dicintai
  alternative: dibenci; kurang dicintai
  rationale: Leksem Ibrani dapat berarti “dibenci”, tetapi dalam pertentangan status perkawinan dapat menunjuk kepada istri yang tidak dikasihi atau tidak diutamakan. Terjemahan utama mempertahankan kontras dengan “dicintai” tanpa melebihkan kadar permusuhan; kemungkinan arti yang lebih kuat tetap dinyatakan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang jelas dan bermartabat. Pengulangan “dicintai/tidak dicintai” dipertahankan untuk mencerminkan kontras dan struktur sumber. Ayat dibiarkan berakhir dengan koma karena kalimat hukum berlanjut ke ayat berikutnya.
