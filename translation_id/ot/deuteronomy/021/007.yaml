base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/007.yaml
  text: Then they shall answer and say[a], ‘Our hands did not shed this blood[b], and our eyes did not see it.’
translation:
  language: id
  text: Lalu mereka harus menjawab dan berkata, “Tangan kami tidak menumpahkan darah ini[a], dan mata kami tidak melihatnya[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “darah ini.” Ungkapan ini merupakan bahasa hukum yang menyangkal tanggung jawab atas pembunuhan tersebut.
    reason: lexical_alternative
  - marker: b
    text: Atau, “tidak menyaksikannya.” Ungkapan konkret “mata kami tidak melihat” menyangkal bahwa mereka mengetahui kejadian itu sebagai saksi mata.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנוּ וְאָמְרוּ
  choice: Lalu mereka harus menjawab dan berkata
  rationale: Kedua verba dalam rumusan pernyataan resmi ini dipertahankan. “Lalu” menyampaikan urutan prosedural dari waw, sedangkan “harus” sesuai dengan konteks ketentuan hukum.
- source_word: יָדֵינוּ
  choice: Tangan kami
  rationale: Bahasa konkret mengenai anggota tubuh dipertahankan; “tangan” menyatakan perbuatan atau tanggung jawab langsung.
- source_word: לֹא שָׁפְכָה אֶת־הַדָּם הַזֶּה
  choice: tidak menumpahkan darah ini
  rationale: Ungkapan Ibrani harfiah “menumpahkan darah” merupakan idiom lazim untuk membunuh. “Darah ini” dipertahankan tanpa mempersempit acuannya menjadi “darah orang ini” atau menggantinya dengan “pembunuhan ini”.
- source_word: וְעֵינֵינוּ לֹא רָאוּ
  choice: dan mata kami tidak melihatnya
  rationale: Bahasa konkret “mata kami” dipertahankan. Akhiran “-nya” melengkapi ungkapan secara wajar dalam bahasa Indonesia dan mengacu pada tindakan yang sedang disangkal, tanpa mengubah verba “melihat” menjadi tafsiran yang lebih sempit, “menyaksikan”.
