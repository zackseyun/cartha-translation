  source_fidelity: Teks Indonesia dengan setia mempertahankan rumusan deklaratif Ibrani וענו ואמרו, subjek konkret “tangan kami” dan “mata kami,” penyangkalan “tidak menumpahkan darah ini,” serta “tidak melihatnya.” “Harus” sesuai dengan bingkai ketentuan hukum dan tidak mengubah isi deklarasi.
