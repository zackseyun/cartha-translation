  text: וְ/הוֹרִ֡דוּ זִקְנֵי֩ הָ/עִ֨יר הַ/הִ֤וא אֶת הָֽ/עֶגְלָה֙ אֶל נַ֣חַל אֵיתָ֔ן אֲשֶׁ֛ר לֹא יֵעָבֵ֥ד בּ֖/וֹ וְ/לֹ֣א יִזָּרֵ֑עַ וְ/עָֽרְפוּ שָׁ֥ם אֶת הָ/עֶגְלָ֖ה בַּ/נָּֽחַל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/004.yaml
  text: Then the elders of that city shall bring the heifer down to a perennial wadi[a], which is neither worked nor sown, and there in the wadi they shall break the heifer’s neck.
translation:
  language: id
  text: Para tua-tua kota itu harus membawa turun sapi betina muda tersebut ke sebuah lembah sungai yang beraliran tetap[a], yang tidak diolah ataupun ditaburi benih. Di sana, di lembah sungai itu, mereka harus mematahkan leher sapi betina muda tersebut.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ke sebuah wadi yang berair sepanjang tahun”; mungkin juga: “ke sebuah lembah yang terjal.” Makna ungkapan Ibrani נַחַל אֵיתָן tidak sepenuhnya pasti.'
    reason: Menjaga ambiguitas leksikal נחל איתן, yang dapat dipahami sebagai lembah atau alur sungai dengan aliran tetap, tetapi secara tradisional juga ditafsirkan sebagai lembah yang terjal atau tanah yang keras.
lexical_decisions:
- source_word: וְהוֹרִדוּ
  choice: harus membawa turun
  rationale: Bentuk Hifil dari ירד menyatakan tindakan menyebabkan sesuatu turun; frasa ini mempertahankan makna kausatif sekaligus terdengar wajar dalam bahasa Indonesia.
- source_word: זִקְנֵי הָעִיר הַהִוא
  choice: para tua-tua kota itu
  rationale: Ungkapan baku dan bermartabat untuk para pemimpin senior kota dalam konteks hukum Israel kuno.
- source_word: הָעֶגְלָה
  choice: sapi betina muda tersebut
  rationale: עגלה menunjuk pada sapi muda berjenis kelamin betina. Bentuk ini lebih mudah dipahami pembaca umum daripada istilah teknis peternakan.
- source_word: אֶל נַחַל אֵיתָן
  choice: ke sebuah lembah sungai yang alirannya tetap
  rationale: נחל dapat berarti lembah sungai, alur sungai, atau wadi, sedangkan איתן di sini kemungkinan menggambarkan sifat yang tetap atau terus berlangsung. Terjemahan ini menyampaikan ciri geografis dan keberlanjutan aliran tanpa menyatakan lebih dari yang dipastikan teks.
- source_word: אֲשֶׁר לֹא יֵעָבֵד בּוֹ וְלֹא יִזָּרֵעַ
  choice: yang tidak pernah diolah ataupun ditaburi benih
  rationale: Kedua verba berbentuk pasif dan berhubungan dengan pengerjaan lahan serta penaburan benih. 'Tidak pernah' menyatakan keadaan tempat itu yang belum digunakan demikian dalam konteks ketentuan ini.
- source_word: וְעָרְפוּ
  choice: mereka harus mematahkan leher
  rationale: ערף dalam ritus ini menunjuk pada pematahan leher, bukan istilah umum untuk menyembelih. Terjemahan eksplisit mempertahankan tindakan khas yang diperintahkan.
- source_word: בַּנָּחַל
  choice: di lembah sungai itu
  rationale: Pengulangan istilah yang sama mempertahankan penegasan lokasi tindakan dalam teks Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam hukum-naratif yang jelas dan bermartabat. Istilah geografis dijelaskan dengan 'lembah sungai' dalam teks utama; istilah 'wadi' dan alternatif leksikal ditempatkan dalam catatan kaki. Penanda catatan kaki [a] dicantumkan dalam teks utama.
