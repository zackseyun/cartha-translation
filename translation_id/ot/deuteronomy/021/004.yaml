  naturalness: Bahasa Indonesia baku, jelas, dan register hukum-naratifnya sesuai. “Lembah sungai yang alirannya tetap” dapat dipahami, tetapi “lembah sungai yang beraliran tetap” lebih ringkas dan lebih alami.
  terminology: “Para tua-tua kota itu,” “sapi betina muda,” dan “mematahkan leher” merupakan padanan yang baik. Catatan kaki secara tepat mempertahankan ketidakpastian leksikal pada נחל איתן tanpa memaksakan satu tafsiran.
