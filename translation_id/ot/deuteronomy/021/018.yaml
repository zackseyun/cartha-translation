base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/018.yaml
  text: If a man has a stubborn and rebellious son who does not listen to the voice of his father or to the voice of his mother[a], and though they discipline him, he does not listen to them[d][c][b],
translation:
  language: id
  text: Jika seorang laki-laki mempunyai anak laki-laki yang keras kepala dan memberontak, yang tidak mengindahkan perkataan ayahnya maupun perkataan ibunya,[a] meskipun mereka mendisiplinkannya, ia tetap tidak mengindahkan mereka,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “suara ayahnya dan suara ibunya.” Dalam ungkapan Ibrani ini, “suara” berarti perkataan atau arahan yang harus diindahkan.'
    reason: lexical_alternative
  - marker: b
    text: 'Ungkapan ini juga dapat diterjemahkan: “dan mereka mendisiplinkannya, tetapi ia tidak mengindahkan mereka.” Kata penghubung Ibrani secara harfiah berarti “dan”; konteks memungkinkan nuansa konsesif, “meskipun.”'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: Jika
  rationale: Memperkenalkan syarat dalam rumusan hukum kasuistis. 'Jika' paling alami dalam bahasa hukum Indonesia, meskipun 'apabila/ketika' juga mungkin.
- source_word: יִהְיֶה לְאִישׁ
  choice: seorang laki-laki mempunyai
  rationale: Konstruksi Ibrani memakai verba 'ada' dengan datif untuk menyatakan kepunyaan; bentuk ini merupakan padanan Indonesia yang jelas dan alami.
- source_word: בֵּן
  choice: anak laki-laki
  rationale: Nomina Ibrani secara khusus berarti anak laki-laki atau putra, bukan anak tanpa penandaan gender.
- source_word: סוֹרֵר וּמוֹרֶה
  choice: keras kepala dan memberontak
  rationale: Pasangan kata ini menggambarkan penolakan yang menetap dan perlawanan aktif; terjemahan mempertahankan dua unsur yang saling menguatkan.
- source_word: אֵינֶנּוּ שֹׁמֵעַ
  choice: tidak mengindahkan
  rationale: שׁמע di sini bukan sekadar mendengar bunyi, melainkan mendengarkan dengan maksud menaati. 'Mengindahkan' menyampaikan implikasi kepatuhan tanpa menghilangkan nuansa mendengarkan.
- source_word: בְּקוֹל אָבִיו וּבְקוֹל אִמּוֹ
  choice: perkataan ayahnya maupun perkataan ibunya
  rationale: Secara harfiah 'suara ayahnya dan suara ibunya'; dalam konteks ini 'suara' merupakan idiom bagi perkataan atau arahan yang berwenang. 'Maupun' alami dalam konstruksi negatif Indonesia dan tetap mencakup kedua orang tua.
- source_word: וְיִסְּרוּ אֹתוֹ
  choice: dan sekalipun mereka mendisiplinkannya
  rationale: 'יסר menunjuk pada didikan atau koreksi disipliner. Konteks mendukung hubungan konsesif: disiplin telah diberikan, tetapi anak itu tetap tidak mengindahkan mereka; kata ''dan'' dipertahankan bersama ''sekalipun'' agar hubungan dengan waw tetap tampak.'
- source_word: וְלֹא יִשְׁמַע אֲלֵיהֶם
  choice: ia tetap tidak mengindahkan mereka
  rationale: Mengulang padanan akar שׁמע untuk mempertahankan pengulangan sumber. 'Tetap' memperjelas keberlanjutan penolakan setelah disiplin.
theological_decisions:
- issue: Sifat pelanggaran anak
  choice: Mempertahankan gambaran penolakan menetap terhadap wewenang kedua orang tua tanpa menambahkan batas usia atau rincian perilaku.
  alternative: Menafsirkan 'anak laki-laki' sebagai anak kecil, remaja, atau putra dewasa tertentu.
  rationale: Ayat ini sendiri tidak menentukan usia; terjemahan tidak boleh menyelesaikan hal yang dibiarkan terbuka oleh teks.
- issue: Arti tindakan orang tua
  choice: mendisiplinkannya
  alternative: menghukumnya atau memukulnya
  rationale: Verba יסר mencakup koreksi dan disiplin, tetapi ayat ini tidak menentukan bentuk atau tingkat tindakan tersebut. Pilihan netral menghindari penambahan kekerasan yang tidak dinyatakan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Anak laki-laki' dipilih daripada 'putra' agar mudah dipahami dan tetap tepat gender. 'Mengindahkan' menjaga kaitan antara mendengar dan menaati, sedangkan 'mendisiplinkan' menghindari penafsiran berlebihan tentang bentuk koreksi. Tanda koma akhir dipertahankan karena ayat ini merupakan klausa pembuka yang berlanjut ke ayat berikutnya.
