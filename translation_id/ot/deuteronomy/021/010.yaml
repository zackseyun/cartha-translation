base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/010.yaml
  text: When you go out to war against your enemies[a], and Yahweh your God gives them into your hand, and you take them captive[b],
translation:
  language: id
  text: Apabila engkau maju berperang melawan musuh-musuhmu, lalu Yahweh, Allahmu, menyerahkan mereka ke dalam tanganmu[a] dan engkau menawan tawanan dari antara mereka[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “menyerahkannya ke dalam tanganmu.” Akhiran tunggal dalam bahasa Ibrani tampaknya merujuk secara kolektif kepada pasukan musuh.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “engkau menawan tawanannya.” Bahasa Ibrani memakai kata kerja dan kata benda yang seakar untuk tindakan menawan orang.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Apabila
  rationale: Dalam rumusan hukum kasuistis ini, כִּי memperkenalkan keadaan yang mungkin terjadi. “Apabila” alami dalam bahasa hukum Indonesia dan tidak menyiratkan bahwa peristiwa itu pasti terjadi.
- source_word: תֵצֵא לַמִּלְחָמָה
  choice: engkau maju berperang
  rationale: Ungkapan ini secara harfiah berarti pergi keluar menuju perang; “maju berperang” menyampaikan idiom militernya secara alami sekaligus mempertahankan gagasan bergerak menghadapi musuh.
- source_word: עַל אֹיְבֶיךָ
  choice: melawan musuh-musuhmu
  rationale: Dalam konteks tindakan bermusuhan, עַל berarti “melawan”; bentuk jamak dan akhiran orang kedua tunggal dipertahankan.
- source_word: וּנְתָנוֹ
  choice: menyerahkan mereka
  rationale: נתן pada idiom ini bermakna memberikan atau menyerahkan ke dalam kuasa seseorang. Akhiran Ibrani berbentuk tunggal, tetapi secara kolektif merujuk kepada pasukan musuh yang disebut dalam bentuk jamak.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Allahmu
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, sedangkan אֱלֹהֶיךָ diterjemahkan langsung sebagai “Allahmu”.
- source_word: בְּיָדֶךָ
  choice: ke dalam tanganmu
  rationale: Terjemahan ini mempertahankan citra idiom Ibrani tentang penyerahan ke dalam kuasa atau kendali seseorang dan tetap mudah dipahami dalam bahasa Indonesia.
- source_word: וְשָׁבִיתָ שִׁבְיוֹ
  choice: dan engkau menawan tawanan dari antara mereka
  rationale: Bahasa Ibrani memakai verba dan nomina seakar, yakni ungkapan harfiah yang berarti menawan tawanan. Frasa “dari antara mereka” menjelaskan bahwa akhiran tunggal kolektif merujuk kepada pihak musuh tanpa menyamakan seluruh musuh dengan para tawanan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks sumber memakai nama perjanjian יְהוָה. Transliterasi “Yahweh” mempertahankan nama diri itu dan tidak menggantinya dengan gelar.
- issue: Pelaku kemenangan dalam perang
  choice: Yahweh menyerahkan musuh ke dalam tangan Israel
  alternative: Israel mengalahkan musuh dengan kekuatannya sendiri
  rationale: Susunan ayat secara eksplisit menempatkan Yahweh sebagai pelaku yang menyerahkan pihak musuh; terjemahan mempertahankan penekanan teologis ini tanpa menambah penafsiran.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Kata ganti tunggal “engkau” mempertahankan sapaan orang kedua tunggal dalam teks Ibrani. “Maju berperang” dipilih sebagai idiom alami, sedangkan “ke dalam tanganmu” mempertahankan citra sumber. Ayat dibiarkan berakhir dengan koma karena kalimat hukumnya berlanjut ke ayat berikutnya.
