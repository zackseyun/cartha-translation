base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/003.yaml
  text: And it shall be that the city nearest to the slain man[c][b][a], the elders of that city shall take a heifer from the herd that has not been worked with and has not pulled in a yoke.
translation:
  language: id
  text: Maka para tua-tua kota yang paling dekat dengan orang yang terbunuh itu[a] harus mengambil seekor sapi betina muda dari kawanan sapi[b], yang belum pernah digunakan untuk bekerja dan belum pernah menarik dengan kuk[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang yang dibunuh itu” atau “mayat itu.” Kata Ibrani yang dipakai menunjuk kepada seseorang yang mati karena dibunuh.
    reason: lexical_alternative
  - marker: b
    text: Atau “seekor sapi betina muda.” Frasa Ibraninya secara lebih lengkap menyebut sapi betina muda dari kawanan sapi.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “menarik dengan kuk,” yaitu belum pernah digunakan sebagai hewan penarik.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: Maka
  rationale: Dalam konteks hukum ini, formula Ibrani tersebut memperkenalkan langkah prosedural berikutnya; “Maka” menyampaikannya secara wajar dan ringkas dalam bahasa Indonesia.
- source_word: הָעִיר הַקְּרֹבָה
  choice: kota yang paling dekat
  rationale: Konteks perbandingan jarak menuntut makna superlatif, yaitu kota yang terdekat dari tempat ditemukannya orang yang terbunuh.
- source_word: אֶל הֶחָלָל
  choice: dengan orang yang terbunuh itu
  rationale: חָלָל menunjuk kepada seseorang yang mati karena dibunuh. Ungkapan ini mempertahankan acuan personal dan hubungan jarak yang idiomatis dalam bahasa Indonesia.
- source_word: וְלָקְחוּ זִקְנֵי הָעִיר הַהִוא
  choice: para tua-tua kota ... harus mengambil
  rationale: “Para tua-tua” mempertahankan sebutan bagi para pemimpin resmi masyarakat, sedangkan “harus” menyatakan daya perintah bentuk hukum tersebut. Susunan kalimat dirapikan agar alami tanpa menghilangkan identitas kota yang dimaksud.
- source_word: עֶגְלַת בָּקָר
  choice: seekor sapi betina muda dari kawanan sapi
  rationale: עֶגְלָה adalah sapi betina muda, sementara בָּקָר menegaskan bahwa hewan itu berasal dari kawanan sapi.
- source_word: אֲשֶׁר לֹא עֻבַּד בָּהּ
  choice: yang belum pernah digunakan untuk bekerja
  rationale: Bentuk pasif ini menyatakan bahwa hewan tersebut belum pernah dimanfaatkan sebagai tenaga kerja; terjemahan ini menyampaikan fungsi instrumentalnya secara jelas.
- source_word: אֲשֶׁר לֹא מָשְׁכָה בְּעֹל
  choice: dan belum pernah menarik kuk
  rationale: מָשְׁכָה berarti “menarik,” dan frasa ini menjelaskan bahwa hewan tersebut belum pernah dipakai sebagai hewan penarik dengan kuk.
theological_decisions: []
