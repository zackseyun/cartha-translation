  text: then his father and his mother shall seize him and bring him out to the elders of his city and to the gate of his place[a][b].
translation:
  language: id
  text: maka ayah dan ibunya harus menangkapnya dan membawanya keluar kepada para tua-tua kotanya, ke gerbang tempatnya[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gerbang kota adalah tempat umum di mana para tua-tua setempat menangani perkara hukum.
    reason: cultural_note
  - marker: b
    text: Atau “gerbang kotanya”. Secara harfiah, bahasa Ibrani berbunyi “gerbang tempatnya”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָפְשׂוּ בוֹ
  choice: harus memegang dia
  rationale: Kata תפשׂ dengan ב menyatakan tindakan memegang secara fisik. “Memegang dia” alami dalam bahasa Indonesia dan mempertahankan tindakan nyata tanpa menambahkan nuansa kekerasan yang tidak harus terkandung dalam teks.
- source_word: אָבִיו וְאִמּוֹ
  choice: ayah dan ibunya
  rationale: Ungkapan ini menyebut kedua orang tua sebagai pelaku bersama. Bentuk Indonesia ini ringkas, alami, dan tetap menyatakan ayah serta ibu.
- source_word: וְהוֹצִיאוּ אֹתוֹ
  choice: membawanya keluar
  rationale: Bentuk Hifil dari יצא berarti menyebabkan keluar atau membawa keluar. Pilihan ini mempertahankan arah gerak dari lingkungan rumah menuju forum hukum publik.
- source_word: אֶל זִקְנֵי עִירוֹ
  choice: menghadap para tua-tua kotanya
  rationale: Para tua-tua adalah pemimpin setempat yang menangani perkara masyarakat. “Menghadap” menyampaikan tujuan membawa anak itu ke hadapan mereka, sedangkan “para tua-tua” mempertahankan istilah kelembagaan Ibrani.
- source_word: וְאֶל שַׁעַר מְקֹמוֹ
  choice: ke gerbang tempat tinggalnya
  rationale: שׁער menunjuk gerbang kota sebagai ruang publik dan tempat perkara hukum diperiksa, sedangkan מקום secara harfiah berarti “tempat”. “Tempat tinggalnya” terdengar alami sambil tidak diam-diam mengganti kata itu dengan “kota”.
