base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/006.yaml
  text: And all the elders of that city nearest to the slain man shall wash their hands over the heifer whose neck was broken in the wadi[a][b].
translation:
  language: id
  text: Lalu semua para tua-tua yang paling dekat dengan orang yang terbunuh itu, dari kota itu, harus membasuh tangan mereka di atas anak sapi betina yang tengkuknya telah dipatahkan di lembah sungai[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “di lembah” atau “di alur sungai.” Kata Ibrani ini menunjuk lembah atau jurang yang berkaitan dengan aliran air, yang dapat bersifat musiman.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: Lalu semua
  rationale: Kata sambung melanjutkan tata cara hukum; “lalu” alami dalam urutan prosedural, dan “semua” mempertahankan cakupan כֹל.
- source_word: זִקְנֵי הָעִיר הַהִוא
  choice: tua-tua dari kota itu
  rationale: זִקְנֵי menunjuk para pemimpin masyarakat. “Tua-tua” merupakan istilah Alkitab bahasa Indonesia yang ringkas dan tetap dapat dipahami, sedangkan “kota itu” mempertahankan kekhususan demonstratif.
- source_word: הַקְּרֹבִים אֶל הֶחָלָל
  choice: yang terdekat dengan orang yang terbunuh
  rationale: Bentuk jamak קְרֹבִים dengan אֶל menyatakan kedekatan; חָלָל adalah orang yang mati terbunuh atau mayat korban pembunuhan. Terjemahan ini mempertahankan konteks pembunuhan tanpa hanya menyebut mayat secara umum.
- source_word: יִרְחֲצוּ אֶת יְדֵיהֶם
  choice: harus membasuh tangan mereka
  rationale: Bentuk imperfek berfungsi sebagai ketentuan prosedural. “Harus” menyampaikan daya preskriptif secara alami dalam bahasa Indonesia modern.
- source_word: עַל
  choice: di atas
  rationale: Dalam tindakan ritual ini עַל paling wajar menyatakan posisi tangan di atas anak sapi itu, tanpa memastikan apakah air jatuh langsung mengenai bangkainya.
- source_word: הָעֶגְלָה
  choice: anak sapi betina
  rationale: עֶגְלָה menunjuk sapi betina muda; ungkapan ini lebih mudah dipahami pembaca umum daripada istilah teknis “dara” atau “heifer”.
- source_word: הָעֲרוּפָה
  choice: yang tengkuknya telah dipatahkan
  rationale: Bentuk pasif dari ערף dalam ritual ini menunjuk pematahan tengkuk, bukan penyembelihan biasa atau pemenggalan dengan senjata.
- source_word: בַנָּחַל
  choice: di lembah sungai
  rationale: נַחַל dapat berarti lembah atau alur sungai, termasuk aliran musiman. “Lembah sungai” cukup alami dan mempertahankan kedua unsur topografis tersebut.
