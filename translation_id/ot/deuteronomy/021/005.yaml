  to: Kemudian para imam, keturunan Lewi, harus datang mendekat, sebab Yahweh, Allahmu, telah memilih mereka untuk melayani Dia dan mengucapkan berkat dalam nama Yahweh. Berdasarkan perkataan merekalah setiap perselisihan dan setiap cedera[a] harus diselesaikan.
  rationale: 'Revisi terbatas pada kejelasan dan keluwesan bahasa sasaran: “keturunan Lewi” menggantikan ungkapan yang berpotensi ambigu, dan “datang mendekat” menerjemahkan kata kerja Ibrani dengan lebih tepat. “Mengucapkan berkat” merupakan ungkapan Indonesia yang alami untuk tindakan memberkati secara imamiah. Makna hukum dan ambiguitas leksikal נגע tetap dipertahankan, termasuk melalui catatan kaki.'
