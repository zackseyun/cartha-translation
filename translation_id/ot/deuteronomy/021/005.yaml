  text: וְ/נִגְּשׁ֣וּ הַ/כֹּהֲנִים֮ בְּנֵ֣י לֵוִי֒ כִּ֣י בָ֗/ם בָּחַ֞ר יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לְ/שָׁ֣רְת֔/וֹ וּ/לְ/בָרֵ֖ךְ בְּ/שֵׁ֣ם יְהוָ֑ה וְ/עַל פִּי/הֶ֥ם יִהְיֶ֖ה כָּל רִ֥יב וְ/כָל נָֽגַע־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/005.yaml
  text: And the priests[a], the sons of Levi, shall come forward, for Yahweh your God has chosen them to minister to him and to bless in the name of Yahweh, and by their word every dispute and every injury shall be settled.
translation:
  language: id
  text: Kemudian para imam, keturunan Lewi, harus datang mendekat, sebab Yahweh, Allahmu, telah memilih mereka untuk melayani Dia dan mengucapkan berkat dalam nama Yahweh. Berdasarkan perkataan merekalah setiap perselisihan dan setiap cedera[a] harus diselesaikan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “setiap luka,” “setiap pukulan,” atau “setiap penderitaan.” Istilah Ibrani ini luas; dalam konteks hukum ini kemungkinan besar menunjuk pada perkara yang menyangkut cedera jasmani.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִגְּשׁוּ
  choice: harus maju
  rationale: Bentuk Niphal ini menunjukkan para imam tampil untuk menjalankan peran resmi dalam tata cara hukum-ritual; 'maju' alami dalam bahasa Indonesia dan mempertahankan gagasan mendekat untuk bertindak.
- source_word: הַכֹּהֲנִים בְּנֵי לֵוִי
  choice: para imam, anak-anak Lewi
  rationale: Mempertahankan hubungan aposisional teks Ibrani tanpa meleburkannya menjadi istilah yang lebih interpretatif seperti 'imam-imam Lewi'.
- source_word: כִּי בָם בָּחַר
  choice: sebab ... telah memilih mereka
  rationale: כִּי menyatakan alasan bagi peran resmi para imam, sedangkan bentuk perfektif menunjuk pada pilihan ilahi yang telah terjadi dan tetap berlaku.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Allahmu
  rationale: Nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh', dan bentuk pronominal tunggal dipertahankan dalam 'Allahmu'.
- source_word: לְשָׁרְתוֹ
  choice: untuk melayani Dia
  rationale: שרת dalam konteks keimaman menunjuk pada pelayanan resmi atau ibadah kepada Allah; 'melayani' jelas dan alami dalam bahasa Indonesia.
- source_word: וּלְבָרֵךְ בְּשֵׁם יְהוָה
  choice: dan untuk memberkati dalam nama Yahweh
  rationale: Terjemahan ini mempertahankan ungkapan sumber tentang pemberkatan yang dilakukan dengan nama dan kewenangan ilahi.
- source_word: וְעַל פִּיהֶם
  choice: berdasarkan perkataan merekalah
  rationale: Secara harfiah berarti 'menurut mulut mereka' dan merupakan idiom bagi keputusan atau pernyataan berwenang; pilihan ini mempertahankan unsur ujaran sekaligus menyatakan daya hukumnya.
- source_word: יִהְיֶה
  choice: harus diselesaikan
  rationale: Kata kerja 'akan ada/menjadi' memerlukan pelengkap tersirat dalam bahasa sasaran; konteks hukum menunjukkan bahwa perkara ditetapkan atau diselesaikan melalui putusan para imam.
- source_word: כָּל רִיב
  choice: setiap perselisihan
  rationale: רִיב mencakup pertikaian atau sengketa, sering dalam ranah hukum; 'perselisihan' cukup luas dan mudah dipahami.
- source_word: וְכָל נָגַע
  choice: setiap cedera
  rationale: נֶגַע dapat berarti pukulan, luka, cedera, atau penderitaan. Dalam konteks hukum ini 'cedera' menyampaikan kemungkinan perkara mengenai kerugian jasmani tanpa mempersempitnya menjadi tindakan pidana tertentu.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama ilahi secara langsung; 'Yahweh' mempertahankan nama perjanjian itu dan sesuai dengan lapisan konsultasi yang telah diselaraskan.
- issue: Lingkup kewenangan para imam dalam frasa וְעַל פִּיהֶם יִהְיֶה
  choice: setiap perkara harus diselesaikan berdasarkan perkataan mereka
  alternative: setiap perkara akan ada menurut mulut mereka
  rationale: Konteksnya memberi perkataan para imam fungsi penetapan hukum, tetapi terjemahan tidak menambahkan penjelasan mengenai bentuk atau batas kewenangan tersebut.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur aposisional 'para imam, anak-anak Lewi' dipertahankan untuk kedekatan dengan sumber, sedangkan idiom hukum diterjemahkan secara wajar agar mudah dipahami.
