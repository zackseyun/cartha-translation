  text: כַּפֵּר֩ לְ/עַמְּ/ךָ֨ יִשְׂרָאֵ֤ל אֲשֶׁר פָּדִ֨יתָ֙ יְהוָ֔ה וְ/אַל תִּתֵּן֙ דָּ֣ם נָקִ֔י בְּ/קֶ֖רֶב עַמְּ/ךָ֣ יִשְׂרָאֵ֑ל וְ/נִכַּפֵּ֥ר לָ/הֶ֖ם הַ/דָּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/008.yaml
  text: Make atonement for your people Israel[a], whom you redeemed, O Yahweh, and do not let innocent blood remain among your people Israel. Then the bloodguilt will be atoned for them.
translation:
  language: id
  text: “Adakanlah pendamaian bagi umat-Mu Israel, yang telah Kautebus, ya Yahweh. Jangan biarkan darah orang yang tidak bersalah tetap ada di tengah umat-Mu Israel. Dengan demikian, tanggungan darah itu akan dihapuskan bagi mereka.[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “darah itu akan didamaikan bagi mereka.” Dalam konteks hukum ini, “darah” dapat menunjuk pada tanggungan kesalahan yang timbul karena penumpahan darah.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּפֵּר
  choice: Adakanlah pendamaian
  rationale: Bentuk imperatif dari כפר dalam konteks ritual sekaligus hukum menyatakan tindakan pendamaian atau penghapusan tanggungan kesalahan. Ungkapan ini mempertahankan cakupan istilah sumber tanpa mempersempitnya menjadi sekadar ‘ampunilah’.
- source_word: לְעַמְּךָ יִשְׂרָאֵל
  choice: bagi umat-Mu Israel
  rationale: Preposisi ל menandai pihak yang menerima manfaat pendamaian; bentuk ini alami dalam bahasa Indonesia dan mempertahankan identitas perjanjian Israel sebagai umat Yahweh.
- source_word: אֲשֶׁר פָּדִיתָ
  choice: yang telah Kautebus
  rationale: פדה menunjuk pada tindakan menebus atau membebaskan dengan nuansa penebusan. ‘Kautebus’ ringkas, wajar, dan mempertahankan bahasa penebusan dalam Pentateukh.
- source_word: יְהוָה
  choice: ya Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai ‘Yahweh’; partikel ‘ya’ menandai sapaan langsung secara alami dan khidmat.
- source_word: וְאַל תִּתֵּן דָּם נָקִי
  choice: Jangan biarkan darah orang yang tidak bersalah tetap ada
  rationale: Secara harfiah נתן berarti ‘memberikan/menaruh’, tetapi dalam konteks ini permohonan tersebut menyangkut agar akibat atau tanggungan penumpahan darah orang tak bersalah tidak dibiarkan berada pada umat. Rumusan ini tetap dekat dengan citra Ibrani tanpa memakai ungkapan Indonesia yang kaku.
- source_word: בְּקֶרֶב עַמְּךָ יִשְׂרָאֵל
  choice: di tengah umat-Mu Israel
  rationale: בקרב secara langsung berarti ‘di tengah’; ungkapan ini tetap alami dalam bahasa Indonesia dan mempertahankan dimensi komunalnya.
- source_word: וְנִכַּפֵּר לָהֶם הַדָּם
  choice: Dengan demikian, kesalahan karena penumpahan darah itu akan didamaikan bagi mereka
  rationale: Bentuk Nifal נִכַּפֵּר bersifat pasif atau resultatif. הַדָּם secara harfiah adalah ‘darah’, tetapi dalam konteks hukum berfungsi sebagai ungkapan bagi tanggungan akibat penumpahan darah. ‘Dengan demikian’ menyatakan hubungan hasil yang tersirat oleh klausa penutup.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Transliterasi ‘Yahweh’ mempertahankan nama pribadi ilahi dalam teks sumber, bukan menggantinya dengan gelar.
- issue: Makna hukum הַדָּם dalam klausa terakhir
  choice: kesalahan karena penumpahan darah
  alternative: darah
  rationale: Konteksnya adalah tanggungan komunal akibat pembunuhan yang pelakunya tidak diketahui. Terjemahan utama menjelaskan fungsi hukum ungkapan tersebut, sedangkan arti harfiahnya dipertahankan dalam catatan kaki agar ambiguitas citra sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan ilahi memakai ‘ya Yahweh’; kapitalisasi pronomina ilahi dipertahankan. Klausa terakhir dibuat cukup jelas bagi pembaca umum, sementara bentuk harfiahnya dicatat untuk menjaga citra dan ketegangan hukum dalam bahasa Ibrani.
