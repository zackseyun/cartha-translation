base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/021/020.yaml
  text: Then they shall say to the elders of his city[a], ‘This son of ours is stubborn and rebellious; he does not listen to our voice; he is a glutton and a drunkard.’
translation:
  language: id
  text: Kemudian mereka harus berkata kepada para tetua kotanya, “Anak kami ini keras kepala dan memberontak. Ia tidak mendengarkan suara kami[a]; ia pelahap dan pemabuk.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Ia tidak menaati kami.” Ungkapan Ibraninya secara harfiah berbunyi “ia tidak mendengarkan suara kami”; dalam ungkapan ini, mendengarkan dapat mencakup arti mengindahkan atau menaati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמְרוּ
  choice: Kemudian mereka harus berkata
  rationale: Bentuk ini melanjutkan urutan prosedur hukum. “Kemudian” menyatakan tahap berikutnya, sedangkan “harus berkata” mempertahankan daya preskriptif konteks hukum.
- source_word: זִקְנֵי עִירוֹ
  choice: para tetua kotanya
  rationale: זִקְנֵי menunjuk kepada para tua-tua yang menjalankan fungsi kepemimpinan dan peradilan. “Tetua” merupakan padanan Indonesia modern yang ringkas, sedangkan “kotanya” mempertahankan sufiks orang ketiga pada עִירוֹ.
- source_word: בְּנֵנוּ זֶה
  choice: Anak kami ini
  rationale: Susunan ini alami dalam bahasa Indonesia dan tetap mempertahankan penunjukan tegas terhadap anak yang sedang didakwa.
- source_word: סוֹרֵר וּמֹרֶה
  choice: keras kepala dan memberontak
  rationale: 'Kedua partisip ini menggambarkan sikap melawan yang menetap: yang pertama menekankan ketegaran atau penyimpangan, dan yang kedua pemberontakan aktif. Pasangan ini mempertahankan peningkatan maknanya tanpa istilah teknis yang sukar.'
- source_word: אֵינֶנּוּ שֹׁמֵעַ בְּקֹלֵנוּ
  choice: Dia tidak mau mendengarkan perkataan kami
  rationale: Ungkapan ini mempertahankan citra Ibrani tentang mendengarkan suara atau perkataan, sekaligus menyampaikan penolakan yang disengaja. Nuansa menaati tetap dicatat sebagai alternatif dalam catatan kaki.
- source_word: זוֹלֵל
  choice: pelahap
  rationale: Dalam pasangan dengan סֹבֵא, kata ini menunjuk kepada orang yang terbiasa makan secara rakus atau berlebihan. Nomina “pelahap” mempertahankan karakterisasi habitual dalam dakwaan.
- source_word: וְסֹבֵא
  choice: dan pemabuk
  rationale: Partisip ini menunjuk kepada orang yang gemar minum sampai mabuk. “Pemabuk” merupakan padanan Indonesia yang jelas dan mempertahankan sifat kebiasaan tersebut.
