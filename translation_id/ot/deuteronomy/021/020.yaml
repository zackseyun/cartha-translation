  register: Bahasa Indonesia baku, modern, dan bermartabat digunakan dalam bentuk prosedur hukum. “Tetua” dipilih daripada “tua-tua” agar lebih alami bagi pembaca masa kini tanpa menghilangkan fungsi badan kepemimpinan kota. Tanda catatan kaki ditempatkan tepat sesudah ungkapan yang dijelaskannya.
