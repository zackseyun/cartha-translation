  variant: modern standard Indonesian
source:
  edition: WLC
  text: עַל דְּבַ֞ר אֲשֶׁ֨ר לֹא קִדְּמ֤וּ אֶתְ/כֶם֙ בַּ/לֶּ֣חֶם וּ/בַ/מַּ֔יִם בַּ/דֶּ֖רֶךְ בְּ/צֵאתְ/כֶ֣ם מִ/מִּצְרָ֑יִם וַ/אֲשֶׁר֩ שָׂכַ֨ר עָלֶ֜י/ךָ אֶת בִּלְעָ֣ם בֶּן בְּע֗וֹר מִ/פְּת֛וֹר אֲרַ֥ם נַהֲרַ֖יִם לְ/קַֽלְלֶֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/005.yaml
  text: because they did not meet you with bread and water on the way when you came out from Egypt[a], and because he hired Balaam son of Beor from Pethor of Aram-naharaim against you to curse you.
translation:
  language: id
  text: karena mereka tidak datang menemui kalian dengan roti dan air di jalan ketika kalian keluar dari Mesir, dan karena ia mengupah Bileam anak Beor dari Petor di Aram-Naharaim[a] untuk mengutuk engkau.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aram-Naharaim secara harfiah berarti “Aram Dua Sungai” dan secara tradisional diidentifikasi dengan Mesopotamia.
    reason: cultural_note
  - marker: b
    text: Teks Ibrani memakai bentuk jamak “kalian” pada bagian pertama ayat ini, lalu beralih ke bentuk tunggal “engkau” pada bagian kedua.
    reason: textual_feature
lexical_decisions:
- source_word: עַל דְּבַר
  choice: karena
  rationale: Ungkapan ini menyatakan alasan bagi larangan pada ayat sebelumnya; “karena” alami dalam bahasa Indonesia dan mempertahankan daya kausalnya.
- source_word: קִדְּמוּ אֶתְכֶם
  choice: tidak menyongsong kalian
  rationale: Dalam konteks ini, קדמ berarti pergi menemui seseorang, khususnya dengan membawa bekal. “Menyongsong” mempertahankan unsur gerak untuk menemui tanpa menambahkan gagasan penerimaan ramah yang lebih kuat.
- source_word: בַּלֶּחֶם וּבַמַּיִם
  choice: dengan roti dan air
  rationale: Pilihan ini mempertahankan kedua nomina konkret Ibrani dan terdengar alami dalam bahasa Indonesia.
- source_word: בַּדֶּרֶךְ
  choice: di jalan
  rationale: Padanan lokatif yang ringkas dan alami untuk konteks perjalanan.
- source_word: בְּצֵאתְכֶם מִמִּצְרָיִם
  choice: ketika kalian keluar dari Mesir
  rationale: Konstruksi infinitif berpreposisi menyatakan waktu; terjemahan ini mempertahankan rujukan kepada keluarnya Israel dari Mesir.
- source_word: וַאֲשֶׁר
  choice: dan karena
  rationale: Frasa ini memperkenalkan alasan kedua yang sejajar dengan alasan pertama.
- source_word: שָׂכַר עָלֶיךָ
  choice: ia mengupah ... untuk melawan engkau
  rationale: שׂכר berarti mengupah, sedangkan עַל di sini menunjukkan arah permusuhan. Susunan Indonesia ini mempertahankan subjek tunggal dan makna bermusuhan.
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: Bileam anak Beor
  rationale: Nama-nama dialihaksarakan menurut bentuk yang lazim dalam Alkitab bahasa Indonesia; “anak Beor” mempertahankan patronimik Ibrani.
- source_word: מִפְּתֹר אֲרַם נַהֲרַיִם
  choice: dari Petor di Aram-Naharaim
  rationale: Petor dipahami sebagai tempat yang berada di wilayah Aram-Naharaim. Nama wilayah dipertahankan alih-alih langsung diganti dengan padanan tradisional “Mesopotamia”.
- source_word: לְקַלְלֶךָּ
  choice: dengan mengutuk engkau
  rationale: Infinitif ini menyatakan tujuan tindakan mengupah. Dalam susunan “untuk melawan engkau dengan mengutuk engkau,” fungsi tujuan dan sifat permusuhannya tetap jelas.
theological_decisions:
- issue: Pergantian dari sapaan jamak ke sapaan tunggal
  choice: “kalian” pada bagian pertama dan “engkau” pada bagian kedua
  alternative: Memakai “kamu” secara seragam sehingga jumlahnya tidak tegas
  rationale: Teks Ibrani beralih dari bentuk jamak אֶתְכֶם/בְּצֵאתְכֶם kepada bentuk tunggal עָלֶיךָ/לְקַלְלֶךָּ. Terjemahan mempertahankan pergantian gramatikal ini tanpa mencoba menjelaskan makna teologisnya.
- issue: Identitas subjek tunggal pada “ia mengupah”
  choice: Mempertahankan pronomina tunggal “ia”
  alternative: Mengganti dengan “mereka” atau menyebut Moab secara eksplisit
  rationale: Bentuk שָׂכַר adalah tunggal. Menamai subjek secara eksplisit atau menjamakkannya akan menafsirkan lebih jauh daripada yang dinyatakan ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam yang bermartabat dan mudah dipahami. “Menyongsong” dipilih untuk mempertahankan arti pergi menemui dengan bekal. Bentuk “engkau” digunakan agar kontras jumlah dalam teks Ibrani terlihat, meskipun pergantian dari “kalian” terdengar menonjol dalam bahasa Indonesia.
