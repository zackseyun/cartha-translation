  text: You shall not seek their peace or their prosperity all your days forever[a].
translation:
  language: id
  text: Janganlah engkau mengupayakan kedamaian maupun kesejahteraan mereka sepanjang hidupmu, untuk selama-lamanya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “ketenteraman maupun kebaikan mereka.” Kedua istilah Ibrani itu lebih luas daripada sekadar kedamaian politik atau kemakmuran ekonomi.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִדְרֹשׁ
  choice: mengupayakan
  rationale: Dalam konstruksi dengan objek abstrak, verba דרש menyatakan usaha aktif untuk mencari atau memajukan keadaan tersebut. “Mengupayakan” alami dalam bahasa Indonesia dan mempertahankan daya larangannya.
- source_word: שְׁלֹמָם
  choice: kedamaian mereka
  rationale: שָׁלוֹם mencakup kedamaian, keselamatan, dan keadaan sejahtera. “Kedamaian” mempertahankan unsur dasarnya sekaligus membedakannya dari טֹבָתָם.
- source_word: טֹבָתָם
  choice: kesejahteraan mereka
  rationale: טוֹבָה menunjuk pada kebaikan, manfaat, atau keadaan yang baik. “Kesejahteraan” sesuai dengan konteks kemajuan suatu bangsa tanpa membatasinya hanya pada kemakmuran ekonomi.
- source_word: כָּל יָמֶיךָ
  choice: sepanjang hidupmu
  rationale: Ungkapan idiomatis Indonesia ini menyampaikan seluruh masa hidup orang kedua tunggal dengan jelas.
- source_word: לְעוֹלָם
  choice: untuk selama-lamanya
  rationale: Terjemahan ini mempertahankan penegasan durasi yang ditambahkan sesudah כָּל יָמֶיךָ.
theological_decisions:
- issue: Penumpukan ungkapan durasi “sepanjang hidupmu” dan “untuk selama-lamanya”
  choice: Mempertahankan kedua ungkapan
  alternative: Meringkasnya menjadi “seumur hidupmu” saja
  rationale: Teks Ibrani sengaja menempatkan כָּל יָמֶיךָ dan לְעוֹלָם secara berurutan untuk memberi penekanan. Keduanya dipertahankan agar kekuatan dan ketegangan ungkapan sumber tidak dihilangkan.
- issue: Hubungan dua objek dalam larangan
  choice: “kedamaian maupun kesejahteraan mereka”
  alternative: “kedamaian dan kesejahteraan mereka”
  rationale: Dalam kalimat negatif bahasa Indonesia, “maupun” secara alami menunjukkan bahwa larangan berlaku pada masing-masing dari kedua objek tanpa mengubah waw Ibrani menjadi pilihan eksklusif.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “engkau” mempertahankan sapaan orang kedua tunggal. Koma sebelum “untuk selama-lamanya” membantu pembaca menangkap penegasan durasi kedua tanpa meleburkannya dengan ungkapan sebelumnya.
