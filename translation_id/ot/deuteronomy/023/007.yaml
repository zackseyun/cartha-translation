  source_fidelity: 'Teks Indonesia dengan setia menerjemahkan larangan terhadap תִדְרֹשׁ sebagai usaha aktif (“mengupayakan”) dan mempertahankan dua objek yang berbeda: שְׁלֹמָם (“kedamaian mereka”) serta טֹבָתָם (“kesejahteraan mereka”). Kedua penanda durasi, כָּל־יָמֶיךָ dan לְעוֹלָם, juga diterjemahkan secara eksplisit. Penggabungan “sepanjang hidupmu, untuk selama-lamanya” memang sengaja menampilkan penumpukan yang ada dalam bahasa Ibrani, tanpa menghapus ketegangan retorisnya.'
