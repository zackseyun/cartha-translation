  text: בָּנִ֛ים אֲשֶׁר יִוָּלְד֥וּ לָ/הֶ֖ם דּ֣וֹר שְׁלִישִׁ֑י יָבֹ֥א לָ/הֶ֖ם בִּ/קְהַ֥ל יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/009.yaml
  text: Children born to them in the third generation may enter the assembly of Yahweh[a][b].
translation:
  language: id
  text: Anak-anak mereka pada generasi ketiga boleh masuk[b] ke dalam jemaah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Atau “akan masuk.” Bahasa Ibrani dapat diterjemahkan lebih formal demikian, tetapi dalam konteks ini maksudnya ialah bahwa mereka diizinkan masuk mulai generasi ketiga.
    reason: alternative_reading
lexical_decisions:
- source_word: בָּנִים
  choice: Anak-anak
  rationale: Secara harfiah berarti “anak-anak lelaki,” tetapi dalam konteks hukum dan silsilah ini istilah tersebut dapat merujuk lebih luas kepada anak atau keturunan.
- source_word: אֲשֶׁר יִוָּלְדוּ לָהֶם
  choice: yang lahir bagi mereka
  rationale: Bentuk pasif ילד dengan ל dan pronomina secara alami menyatakan bahwa anak-anak itu dilahirkan bagi atau menjadi keturunan mereka.
- source_word: דּוֹר שְׁלִישִׁי
  choice: pada generasi ketiga
  rationale: Ungkapan ini menunjukkan batas generasi ketika penerimaan ke dalam jemaah mulai berlaku, sambil tetap dekat dengan bentuk Ibrani.
- source_word: יָבֹא
  choice: boleh masuk
  rationale: Makna dasar verba ini ialah “datang/masuk.” Dalam ketentuan hukum ini, “boleh masuk” menyampaikan izin untuk diterima dan tidak terdengar semata-mata sebagai ramalan.
- source_word: בִּקְהַל יְהוָה
  choice: ke dalam jemaah Yahweh
  rationale: קהל menunjuk kepada komunitas yang berhimpun dalam kerangka perjanjian atau hukum; “jemaah” merupakan padanan Indonesia yang wajar dan bermartabat. Nama ilahi dipertahankan sebagai Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi Tetragramaton ditransliterasikan sebagai “Yahweh,” bukan diganti dengan gelar.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama ilahi secara langsung; “Yahweh” mempertahankan nama pribadi itu tanpa menggantinya dengan gelar.
- issue: Cakupan בָּנִים dalam konteks hukum-silsilah
  choice: Anak-anak
  alternative: Anak-anak lelaki atau keturunan
  rationale: Bentuk Ibraninya maskulin jamak, tetapi dalam ketentuan mengenai garis keturunan dapat berfungsi secara representatif bagi anak atau keturunan secara lebih luas.
- issue: Daya hukum bentuk יָבֹא
  choice: boleh masuk
  alternative: akan masuk
  rationale: Konteksnya menetapkan kelayakan untuk diterima. Namun, bentuk Ibrani itu sendiri secara formal dapat dibaca sebagai “akan masuk,” sehingga alternatif tersebut dicatat dan tidak disembunyikan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam bermartabat dan mudah dipahami. “Jemaah” dipilih untuk komunitas perjanjian yang berhimpun; susunan kalimat mempertahankan hubungan generasional dan nuansa hukum sumber.
