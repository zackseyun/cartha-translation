base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/008.yaml
  text: You shall not abhor an Edomite[a], for he is your brother. You shall not abhor an Egyptian[c][b], for you were a sojourner in his land.
translation:
  language: id
  text: Janganlah menganggap jijik orang Edom, sebab ia saudaramu[a]. Janganlah menganggap jijik orang Mesir, sebab dahulu engkau adalah pendatang[b] di negerinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sebutan “saudaramu” menunjuk pada hubungan kekerabatan Israel dengan Edom melalui Esau.
    reason: cross_reference
  - marker: b
    text: 'Atau: “orang asing yang menetap.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: תְתַעֵב
  choice: menganggap jijik
  rationale: Bentuk Piel menyatakan memandang atau memperlakukan seseorang sebagai sesuatu yang menjijikkan. Ungkapan ini mempertahankan daya kuat kata Ibrani sekaligus tetap alami dalam larangan bahasa Indonesia; pengulangannya dipertahankan dalam kedua klausa.
- source_word: אֲדֹמִי
  choice: orang Edom
  rationale: Padanan modern dan lazim untuk bentuk gentiliks tunggal, serta mempertahankan pemakaian representatif seorang anggota bangsa Edom.
- source_word: אָחִיךָ
  choice: saudaramu
  rationale: Mempertahankan istilah kekerabatan harfiah dan hubungan historis Israel dengan Edom tanpa mempersempitnya melalui tafsiran tambahan.
- source_word: מִצְרִי
  choice: orang Mesir
  rationale: Padanan baku bahasa Indonesia bagi gentiliks tunggal, dengan fungsi representatif bagi anggota bangsa Mesir.
- source_word: גֵר
  choice: pendatang
  rationale: Menunjukkan orang yang tinggal di luar tanah atau kelompok asalnya. 'Pendatang' mudah dipahami dan cukup mempertahankan nuansa menetap sebagai orang luar; kemungkinan nuansa sosial-hukumnya dicatat dalam catatan kaki.
- source_word: בְאַרְצוֹ
  choice: di negerinya
  rationale: Mempertahankan akhiran tunggal Ibrani yang merujuk secara representatif kepada orang Mesir atau Mesir sebagai bangsanya.
- source_word: כִּי
  choice: sebab
  rationale: Menyatakan alasan bagi masing-masing larangan dengan gaya hukum yang alami dan bermartabat dalam bahasa Indonesia.
theological_decisions:
- issue: Bentuk tunggal representatif bagi kelompok bangsa
  choice: 'Mempertahankan bentuk tunggal: ''orang Edom'', ''orang Mesir'', ''ia'', dan ''-nya'''
  alternative: Menjamakkan menjadi 'orang-orang Edom ... orang-orang Mesir ... negeri mereka'
  rationale: Teks Ibrani memakai bentuk gentiliks tunggal dalam hukum untuk mewakili anggota suatu bangsa. Bentuk tunggal mempertahankan bentuk sumber dan daya personal perintah tersebut.
- issue: Bahasa kekerabatan mengenai Edom
  choice: Menerjemahkan אָחִיךָ secara harfiah sebagai 'saudaramu'
  alternative: Menafsirkan sebagai 'kerabatmu'
  rationale: Teks sendiri mendasarkan larangan pada hubungan persaudaraan Israel dan Edom. 'Saudaramu' mempertahankan bahasa dan ketegangan teologis-historis sumber tanpa menghaluskannya.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. Paralelisme kedua larangan serta bentuk tunggal representatif dipertahankan. 'Menganggap jijik' dipilih daripada 'membenci' karena lebih dekat dengan gagasan memperlakukan seseorang sebagai sesuatu yang keji atau menjijikkan.
