  source_fidelity: Draf tepat menerjemahkan larangan terhadap pihak yang mengenakan bunga, dan ‘saudaramu,’ ‘uang,’ serta ‘makanan’ sesuai dengan teks Ibrani. Namun, נֶשֶׁךְ yang diulang sebelum ‘makanan’ tidak tampak dalam teks Indonesia. Selain itu, ‘yang dapat dikenai bunga’ menambahkan nuansa kemungkinan/modalitas yang tidak dinyatakan secara eksplisit dalam klausa relatif Ibrani.
  naturalness: Bahasa draf umumnya modern dan jelas. ‘Mengenakan bunga’ sedikit lebih lazim daripada ‘membebankan bunga’ dalam larangan hukum-ekonomi. Pengulangan ‘bunga atas’ diperlukan demi kesetiaan pada struktur sumber dan tetap alami dalam daftar hukum.
  terminology: ‘Bunga’ adalah padanan modern yang tepat untuk נֶשֶׁךְ dan tidak membawa penyempitan makna yang dapat timbul dari ‘riba.’ ‘Saudaramu’ mempertahankan istilah kekerabatan sumber; catatan kaki secara tepat memberi cakupan kontekstual tanpa menggantikan teks utama.
  issues:
