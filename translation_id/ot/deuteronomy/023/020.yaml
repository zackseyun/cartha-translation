  text: You shall not charge your brother interest on money[a], interest on food[c][b], or interest on anything that is lent at interest.
translation:
  language: id
  text: 'Janganlah engkau mengenakan bunga kepada saudaramu[a]: bunga atas uang[b], bunga atas makanan, atau bunga atas segala sesuatu yang dikenai bunga.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “saudaramu”; dalam konteks ini dapat berarti sesama orang Israel atau anggota umat perjanjian.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “perak,” yang di sini berarti uang.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַשִּׁיךְ
  choice: membebankan bunga
  rationale: Bentuk Hifil dari נשׁך dalam konteks hukum ini berarti mengenakan atau menuntut bunga dari peminjam. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan fokus larangan pada pihak pemberi pinjaman.
- source_word: לְאָחִיךָ
  choice: kepada saudaramu
  rationale: Secara harfiah berarti 'kepada saudaramu' dan dalam konteks perjanjian merujuk pada sesama anggota umat Israel. Terjemahan utama mempertahankan gambaran kekeluargaan sumber, sedangkan cakupan kontekstual dijelaskan dalam catatan kaki.
- source_word: נֶשֶׁךְ
  choice: bunga
  rationale: Kata ini menunjuk pada bunga pinjaman secara umum, bukan hanya bunga yang terlalu tinggi. 'Bunga' adalah istilah ekonomi modern yang tepat dan tidak mempersempit makna menjadi riba yang eksploitatif saja.
- source_word: כֶּסֶף
  choice: uang
  rationale: Makna harfiahnya 'perak', tetapi dalam konteks hukum-ekonomi kata ini lazim berfungsi sebagai sebutan untuk uang.
- source_word: אֹכֶל
  choice: makanan
  rationale: Kata ini secara luas berarti makanan atau bahan pangan. 'Makanan' jelas, wajar, dan sesuai dengan kategori barang pinjaman yang disebutkan.
- source_word: כָּל דָּבָר
  choice: apa pun
  rationale: Ungkapan ini memperluas larangan secara menyeluruh melampaui uang dan makanan.
- source_word: אֲשֶׁר יִשָּׁךְ
  choice: yang dapat dikenai bunga
  rationale: Klausa relatif ini menerangkan segala sesuatu yang menjadi objek pengenaan bunga. Bentuk 'dapat dikenai bunga' mempertahankan keluasan ungkapan Ibrani tanpa membatasi referensinya hanya pada satu jenis praktik peminjaman.
theological_decisions:
- issue: Cakupan larangan terhadap 'saudaramu'
  choice: Mempertahankan 'saudaramu' dalam teks utama
  alternative: sesama orang Israel; kerabatmu
  rationale: Bahasa kekeluargaan-kovenantal dalam teks Ibrani perlu dipertahankan, sementara cakupan historisnya bagi sesama anggota umat Israel dapat dijelaskan tanpa mengganti metafora sumber.
- issue: Arti נֶשֶׁךְ
  choice: bunga
  alternative: riba
  rationale: '''Riba'' dalam pemakaian modern dapat dipahami sebagai bunga yang terlarang, berlebihan, atau sebagai istilah teknis dalam tradisi agama tertentu. Teks Ibrani di sini melarang pengenaan bunga dalam kategori yang disebutkan tanpa memakai istilah yang hanya berarti bunga berlebihan.'
translation_notes:
  register: Bahasa hukum berbentuk larangan langsung, dengan diksi Indonesia modern yang tetap khidmat. Pengulangan kata נֶשֶׁךְ dipertahankan sebagian melalui pola 'baik bunga atas ...' agar struktur daftar tetap terdengar tanpa menjadi kaku. Semua penanda catatan kaki muncul dalam teks utama.
