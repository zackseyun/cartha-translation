  - severity: low
    issue: ‘yang dapat dikenai bunga’ memasukkan modalitas ‘dapat’.
    rationale: Klausa אֲשֶׁר יִשָּׁךְ menerangkan sesuatu yang dikenai/dibebani bunga. Bentuk tanpa ‘dapat’ lebih dekat pada sumber tanpa mengubah cakupannya.
