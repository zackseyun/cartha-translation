id: DEU.23.6
reference: Deuteronomy 23:6
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לֹֽא אָבָ֞ה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ לִ/שְׁמֹ֣עַ אֶל בִּלְעָ֔ם וַ/יַּהֲפֹךְ֩ יְהוָ֨ה אֱלֹהֶ֧י/ךָ לְּ/ךָ֛ אֶת הַ/קְּלָלָ֖ה לִ/בְרָכָ֑ה כִּ֥י אֲהֵֽבְ/ךָ֖ יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/006.yaml
  text: But Yahweh your God was not willing to listen to Balaam, and Yahweh your God turned the curse into a blessing for you, because Yahweh your God loved you.
translation:
  language: id
  text: Namun Yahweh, Allahmu, tidak mau mendengarkan Bileam. Yahweh, Allahmu, mengubah kutuk itu menjadi berkat bagimu, karena Yahweh, Allahmu, mengasihimu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָבָה
  choice: tidak mau
  rationale: Kata ini menyatakan ketidakbersediaan atau penolakan, bukan ketidakmampuan. Ungkapan “tidak mau” mempertahankan nuansa kehendak dan terdengar alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk konstruksi dengan akhiran orang kedua maskulin tunggal berarti “Allahmu” dan merujuk kepada Israel secara kolektif.
- source_word: לִשְׁמֹעַ אֶל
  choice: mendengarkan
  rationale: Ungkapan ini dapat berarti mendengar, mendengarkan, atau mengindahkan. “Mendengarkan” mempertahankan keluasan maknanya tanpa mempertegas tafsiran menjadi “menuruti”.
- source_word: בִּלְעָם
  choice: Bileam
  rationale: Mengikuti bentuk nama yang sudah lazim dalam tradisi Alkitab bahasa Indonesia.
- source_word: וַיַּהֲפֹךְ
  choice: mengubah
  rationale: Dalam konstruksi ini, verba tersebut menyatakan perubahan kutuk menjadi berkat. “Mengubah” jelas dan wajar dalam bahasa Indonesia modern.
- source_word: הַקְּלָלָה
  choice: kutuk itu
  rationale: Nomina tertentu ini menunjuk kepada kutuk yang dimaksud dalam konteks. “Kutuk itu” menyampaikan ketertentuan tersebut secara alami.
- source_word: לִבְרָכָה
  choice: menjadi berkat
  rationale: Preposisi lamed menandai hasil perubahan; konstruksi Indonesia yang alami ialah “mengubah ... menjadi ...”.
- source_word: כִּי
  choice: karena
  rationale: Partikel ini memperkenalkan alasan bagi tindakan Yahweh.
- source_word: אֲהֵבְךָ
  choice: mengasihimu
  rationale: Verba ini secara langsung berarti mengasihi. Bentuk kini “mengasihimu” dalam anak kalimat kausal menyatakan kasih Yahweh yang melandasi tindakan-Nya, tanpa mengurangi acuan pada tindakan lampau.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. “Yahweh” mempertahankan nama itu alih-alih menggantinya dengan gelar, tanpa memasukkan penafsiran denominasi tertentu.
- issue: Nuansa לִשְׁמֹעַ אֶל dalam hubungan dengan Bileam
  choice: mendengarkan Bileam
  alternative: mengindahkan Bileam atau menuruti Bileam
  rationale: “Mendengarkan” mempertahankan ambiguitas idiom Ibrani antara memberi perhatian dan memenuhi maksud atau permintaan Bileam; alternatif lain lebih tegas secara interpretatif.
- issue: Aspek kasih Yahweh dalam אֲהֵבְךָ
  choice: mengasihimu
  alternative: telah mengasihimu
  rationale: Bentuk sempurna Ibrani berada dalam penjelasan kausal dan dapat menunjuk pada kasih yang nyata dalam tindakan tersebut, tanpa harus dibatasi sebagai keadaan yang telah berakhir. Bahasa Indonesia tidak wajib menandai kala lampau.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat, dengan sapaan tunggal kolektif “-mu” sesuai bentuk Ibrani. Dua kalimat dipakai agar alurnya jelas bagi pembaca umum. Tidak diperlukan catatan kaki karena tidak ada varian atau ambiguitas yang harus dijelaskan di luar teks.
