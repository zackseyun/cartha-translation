translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk “engkau” dipakai untuk orang kedua tunggal, sesuai teks Ibrani. Rumusan mempertahankan sedikit pengulangan arah/lokasi dalam teks sumber.
