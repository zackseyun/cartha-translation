  yaml_path: translation/ot/deuteronomy/023/013.yaml
  text: And you shall have a place outside the camp[a], and you shall go out there, outside.
translation:
  language: id
  text: Hendaklah ada bagimu sebuah tempat di luar perkemahan[a], dan engkau harus keluar ke sana.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tangan” (yad); di sini agaknya merupakan ungkapan untuk tempat atau lokasi yang ditentukan. Ada terjemahan yang memahaminya secara lebih konkret sebagai alat atau pasak berdasarkan ayat berikutnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָד
  choice: tempat
  rationale: Makna dasarnya ialah “tangan”, tetapi dalam konteks ini kata tersebut paling mungkin dipakai secara idiomatis untuk tempat atau lokasi yang ditentukan di luar perkemahan. Pilihan “tempat” juga selaras dengan שָׁמָּה, “ke sana”.
- source_word: תִּהְיֶה לְךָ
  choice: harus ada bagimu
  rationale: Konstruksi היה + לְ menyatakan sesuatu yang tersedia atau ditetapkan bagi seseorang. “Harus ada bagimu” mempertahankan bentuk eksistensial sekaligus daya perintahnya.
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: di luar perkemahan
  rationale: Frasa ini menunjukkan lokasi di luar batas perkemahan secara langsung dan jelas.
- source_word: וְיָצָאתָ
  choice: dan engkau harus pergi ke luar
  rationale: Bentuk ini menyampaikan tindakan keluar dengan daya instruktif. “Harus pergi ke luar” alami dalam bahasa Indonesia dan tidak bersifat arkais.
- source_word: שָׁמָּה חוּץ
  choice: ke luar ke sana
  rationale: שָׁמָּה bersifat direktif, “ke sana”, sedangkan חוּץ menegaskan gerakan ke luar. Susunan “ke luar ke sana” mempertahankan kedua unsur tanpa menambahkan “perkemahan” yang tidak diulang dalam teks Ibrani.
