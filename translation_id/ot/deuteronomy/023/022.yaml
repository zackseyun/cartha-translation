  naturalness: Bahasa draf umumnya baku, modern, dan sesuai register khidmat. “Mengucapkan nazar” dan “memenuhinya” wajar. “Hal itu akan menjadi dosa bagimu” tetap alami serta lebih dekat dengan konstruksi Ibrani daripada “menanggung dosa.”
  terminology: “Nazar,” “Yahweh,” dan “Allahmu” konsisten dan tepat. Nama ilahi dipertahankan sebagai “Yahweh” sesuai keputusan proyek. Catatan kaki perlu diselaraskan dengan teks revisi dan tidak perlu menambahkan frasa “karena dosa,” yang bersifat repetitif.
