base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/022.yaml
  text: But if you make a vow to Yahweh your God[a], you shall not delay in paying it, for Yahweh your God will surely require it from you, and it will be sin in you.
translation:
  language: id
  text: Tetapi jika engkau mengucapkan nazar kepada Yahweh, Allahmu, jangan menunda untuk memenuhinya, sebab Yahweh, Allahmu, pasti akan menuntutnya darimu, dan hal itu akan menjadi dosa bagimu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “dan itu akan menjadi dosa padamu.” Dapat juga diterjemahkan: “dan engkau akan bersalah.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Tetapi jika
  rationale: 'Dalam kaitan dengan ayat sebelumnya, partikel ini memperkenalkan keadaan bersyarat sekaligus kontras ringan: tidak bernazar bukanlah dosa, tetapi jika seseorang bernazar, kewajiban berikut berlaku.'
- source_word: תִדֹּר נֶדֶר
  choice: engkau mengucapkan nazar
  rationale: Konstruksi verba dengan objek serumpun diterjemahkan secara idiomatis. 'Mengucapkan nazar' alami dalam bahasa Indonesia dan tetap menunjukkan tindakan membuat janji khidmat.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: kepada Yahweh, Allahmu
  rationale: Preposisi menandai pihak yang menerima nazar. Nama perjanjian יהוה ditransliterasikan sebagai 'Yahweh', sedangkan אֱלֹהֶיךָ diterjemahkan 'Allahmu'.
- source_word: לֹא תְאַחֵר לְשַׁלְּמוֹ
  choice: jangan menunda untuk memenuhinya
  rationale: Larangan legal diterjemahkan dengan imperatif negatif yang wajar. Dalam konteks nazar, שלם mencakup pelaksanaan atau pembayaran hal yang dinazarkan; 'memenuhi' paling luas dan alami.
- source_word: דָּרֹשׁ יִדְרְשֶׁנּוּ
  choice: pasti akan menuntutnya
  rationale: Infinitif absolut diikuti verba finit memberi penegasan. 'Pasti' mempertahankan intensitas itu, dan 'menuntut' sesuai dengan konteks kewajiban perjanjian.
- source_word: מֵעִמָּךְ
  choice: darimu
  rationale: Ungkapan ini menunjukkan bahwa pemenuhan nazar akan dituntut dari orang yang mengucapkannya.
- source_word: וְהָיָה בְךָ חֵטְא
  choice: dan engkau akan menanggung dosa
  rationale: Ungkapan Ibrani harfiahnya 'dan itu akan menjadi dosa padamu/dalam dirimu'. Pilihan ini menyampaikan timbulnya kesalahan atau tanggungan dosa secara alami tanpa menentukan hukuman tertentu.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama ilahi יהוה secara langsung. 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Makna וְהָיָה בְךָ חֵטְא
  choice: engkau akan menanggung dosa
  alternative: itu akan menjadi dosa padamu; engkau akan bersalah karena dosa
  rationale: Konstruksi tersebut menyatakan bahwa kegagalan memenuhi nazar membuat dosa melekat atau diperhitungkan kepada pelakunya. Terjemahan utama dibuat idiomatis, sementara bentuk harfiahnya dicatat agar citra dan ambiguitas sumber tetap terlihat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti tunggal 'engkau' mempertahankan sapaan orang kedua tunggal dalam teks Ibrani. Istilah 'nazar' dipertahankan karena lazim dalam bahasa keagamaan Indonesia; 'memenuhi' dipilih agar mencakup pembayaran, persembahan, atau pelaksanaan yang dijanjikan.
