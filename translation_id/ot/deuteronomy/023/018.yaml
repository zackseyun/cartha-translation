id: DEU.23.18
reference: Deuteronomy 23:18
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לֹא תִהְיֶ֥ה קְדֵשָׁ֖ה מִ/בְּנ֣וֹת יִשְׂרָאֵ֑ל וְ/לֹֽא יִהְיֶ֥ה קָדֵ֖שׁ מִ/בְּנֵ֥י יִשְׂרָאֵל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/018.yaml
  text: There shall not be a cult prostitute from the daughters of Israel[a], and there shall not be a cult prostitute from the sons of Israel.
translation:
  language: id
  text: Tidak boleh ada pelacur ritual dari antara anak-anak perempuan Israel[a], dan tidak boleh ada pelacur ritual dari antara anak-anak lelaki Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pelacur kuil”. Kata-kata Ibrani itu secara lebih harfiah berarti perempuan dan laki-laki yang “dikhususkan”. Secara tradisional istilah-istilah ini dipahami sebagai sebutan bagi orang yang terlibat dalam kegiatan seksual yang berkaitan dengan ibadah terlarang, meskipun fungsi persis mereka diperdebatkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: קְדֵשָׁה
  choice: pelacur ritual
  rationale: Istilah feminin ini menunjuk kepada seorang perempuan yang dikaitkan dengan praktik keagamaan terlarang. “Pelacur ritual” menyatakan unsur seksual dan kultis tanpa mempersempit tempatnya secara khusus menjadi kuil.
- source_word: קָדֵשׁ
  choice: pelacur ritual
  rationale: Istilah maskulin ini dibuat sejajar dengan bentuk feminin; jenis kelaminnya dinyatakan oleh frasa “anak-anak lelaki Israel”. Pilihan yang sama mempertahankan kesejajaran Ibrani dan menghindari istilah Indonesia yang kuno atau terlalu kasar.
- source_word: לֹא תִהְיֶה / וְלֹא יִהְיֶה
  choice: Tidak boleh ada ... dan tidak boleh ada
  rationale: Ungkapan ini menyampaikan larangan hukum dengan jelas dan wajar dalam bahasa Indonesia modern, sekaligus mempertahankan bentuk eksistensial kedua klausa.
- source_word: מִבְּנוֹת יִשְׂרָאֵל
  choice: dari antara anak-anak perempuan Israel
  rationale: “Dari antara” mencerminkan מִן dalam arti partitif, sedangkan “anak-anak perempuan Israel” mempertahankan ungkapan kekeluargaan-kebangsaan dan kesejajarannya dengan klausa berikut.
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: dari antara anak-anak lelaki Israel
  rationale: Pilihan ini mempertahankan kesejajaran yang disengaja antara anak-anak perempuan dan anak-anak lelaki Israel.
theological_decisions:
- issue: Makna קָדֵשׁ dan קְדֵשָׁה dalam larangan ini
  choice: Istilah tersebut diterjemahkan sebagai pelacur ritual perempuan dan laki-laki yang terkait dengan ibadah terlarang.
  alternative: Petugas kultus yang dikhususkan, tanpa memastikan bahwa perannya selalu melibatkan pelacuran.
  rationale: Dalam konteks hukum ini, istilah tersebut bukan sebutan positif bagi orang kudus. Terjemahan utama mengikuti pemahaman leksikal tradisional tentang kegiatan seksual kultis, sedangkan catatan kaki mengakui arti harfiah dan ketidakpastian mengenai fungsi persis mereka agar ambiguitas bukti sumber tidak disembunyikan.
translation_notes:
  register: Bahasa hukum yang lugas, modern, dan bermartabat. “Pelacur ritual” dipilih agar dapat dipahami pembaca umum dan agar unsur keagamaan tetap terlihat; “dari antara” mempertahankan nuansa partitif Ibrani. Jenis kelamin dibedakan melalui frasa paralel “anak-anak perempuan” dan “anak-anak lelaki”.
