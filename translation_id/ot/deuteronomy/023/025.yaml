base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/025.yaml
  text: When you enter your neighbor’s vineyard[a], you may eat grapes as your appetite desires, until you are satisfied[c][b], but you shall not put any into your container.
translation:
  language: id
  text: Apabila engkau memasuki kebun anggur milik sesamamu[a], engkau boleh makan buah anggur sebanyak yang kauinginkan, sampai kenyang[b], tetapi jangan memasukkan apa pun ke dalam wadahmu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Jika engkau memasuki kebun anggur milik sesamamu.” Partikel Ibrani ini dapat memperkenalkan keadaan waktu maupun syarat.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menurut keinginanmu, sampai kenyang.” Kata yang sering diterjemahkan “jiwa” di sini menunjuk pada keinginan atau selera makan.
    reason: lexical_alternative
  - marker: c
    text: Atau “bejanamu.” Istilah Ibraninya bersifat umum dan tidak menentukan jenis wadah tertentu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Apabila
  rationale: Partikel ini memperkenalkan keadaan dalam rumusan hukum dan dapat bernuansa waktu atau syarat. “Apabila” alami dalam bahasa hukum Indonesia serta mempertahankan keluwesan tersebut.
- source_word: תָבֹא בְּכֶרֶם
  choice: engkau memasuki kebun anggur
  rationale: Kata kerja בוא dengan preposisi בְּ di sini menyatakan masuk ke suatu tempat; “memasuki” merupakan padanan Indonesia yang wajar.
- source_word: רֵעֶךָ
  choice: sesamamu
  rationale: רֵעַ menunjuk kepada orang lain dalam hubungan sosial, seperti sesama atau tetangga. “Sesamamu” tidak membatasi pemilik kebun pada orang yang tinggal berdekatan.
- source_word: וְאָכַלְתָּ עֲנָבִים
  choice: engkau boleh makan buah anggur
  rationale: Dalam konteks hukum ini bentuk verba menyatakan tindakan yang diizinkan, bukan perintah untuk makan.
- source_word: כְּנַפְשְׁךָ שָׂבְעֶךָ
  choice: sepuas keinginanmu
  rationale: Ungkapan harfiahnya menggabungkan keinginan atau selera pribadi dengan rasa kenyang. Padanan idiomatis ini menyampaikan izin makan menurut keinginan sampai puas tanpa memakai “jiwa” secara tidak alami.
- source_word: וְאֶל כֶּלְיְךָ לֹא תִתֵּן
  choice: tetapi jangan memasukkan apa pun ke dalam wadahmu
  rationale: נתן berarti memberi, menaruh, atau menempatkan; bersama אֶל כֶּלְיְךָ, “memasukkan ... ke dalam wadahmu” alami. “Apa pun” menyatakan objek buah anggur yang tersirat, sedangkan “wadah” mempertahankan keluasan makna כְּלִי.
