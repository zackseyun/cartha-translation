  text: But if you refrain from making a vow[a], there will be no sin in you.
translation:
  language: id
  text: Namun, jika engkau tidak bernazar, engkau tidak berdosa.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “tidak ada kesalahan yang ditanggungkan kepadamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: Namun, jika
  rationale: Gabungan ini memperkenalkan syarat yang berlawanan dengan kewajiban memenuhi nazar pada ayat sebelumnya. “Namun, jika” menyampaikan hubungan kontras dan bersyarat secara wajar.
- source_word: תֶחְדַּל לִנְדֹּר
  choice: engkau tidak bernazar
  rationale: Secara harfiah berarti menahan diri atau tidak melakukan tindakan bernazar. Dalam bahasa Indonesia, bentuk negatif sederhana ini paling alami dan tetap menyampaikan bahwa seseorang memilih untuk tidak mengucapkan nazar.
- source_word: לֹא יִהְיֶה בְךָ חֵטְא
  choice: engkau tidak berdosa
  rationale: Ungkapan eksistensial Ibrani secara harfiah menyatakan bahwa tidak akan ada dosa pada diri orang itu. Bentuk ini menyampaikan hasil moral-hukumnya dengan jelas dan alami tanpa menghilangkan nuansa alternatif berupa kesalahan atau tanggungan.
theological_decisions:
- issue: Status moral orang yang tidak mengucapkan nazar
  choice: Tidak mengucapkan nazar bukanlah dosa.
  alternative: Tidak ada kesalahan atau tanggungan hukum atas orang yang tidak mengucapkan nazar.
  rationale: חֵטְא dapat menunjuk pada dosa maupun kesalahan atau keadaan bersalah. Dalam konteksnya, kesalahan timbul ketika nazar yang telah diucapkan tidak dipenuhi, bukan ketika seseorang memilih untuk tidak bernazar.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, dan bermartabat. Kata ganti “engkau” mempertahankan sapaan orang kedua tunggal dalam teks Ibrani; “bernazar” merupakan istilah yang lazim dan tepat untuk tindakan mengucapkan janji khidmat kepada Allah.
