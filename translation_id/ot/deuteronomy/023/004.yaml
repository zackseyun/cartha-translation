source:
  edition: WLC
  text: לֹֽא יָבֹ֧א עַמּוֹנִ֛י וּ/מוֹאָבִ֖י בִּ/קְהַ֣ל יְהוָ֑ה גַּ֚ם דּ֣וֹר עֲשִׂירִ֔י לֹא יָבֹ֥א לָ/הֶ֛ם בִּ/קְהַ֥ל יְהוָ֖ה עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/004.yaml
  text: No Ammonite or Moabite may enter the assembly of Yahweh[a]; even to the tenth generation[b], none of them may enter the assembly of Yahweh forever.
translation:
  language: id
  text: Tidak seorang Amon atau Moab pun boleh masuk ke dalam jemaah Yahweh[a]. Bahkan sampai generasi kesepuluh[b], seorang pun dari mereka tidak boleh masuk ke dalam jemaah Yahweh untuk selama-lamanya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “perkumpulan Yahweh.”'
    reason: lexical_alternative
  - marker: b
    text: Teks Ibrani menyebut baik “sampai generasi kesepuluh” maupun “untuk selama-lamanya”; kedua ungkapan itu dipertahankan tanpa meleburkan yang satu ke dalam yang lain.
    reason: cultural_note
lexical_decisions:
- source_word: יָבֹא
  choice: boleh masuk
  rationale: Dalam rumusan hukum, bentuk imperfek dengan לֹא menyatakan larangan atau tidak adanya hak untuk diterima; 'boleh masuk' menyampaikannya secara wajar dalam bahasa Indonesia.
- source_word: עַמּוֹנִי וּמוֹאָבִי
  choice: seorang Amon atau Moab
  rationale: Istilah nisbah ini menunjuk orang dari bangsa Amon dan Moab. Bentuk 'seorang Amon atau Moab' alami dan jelas dalam bahasa Indonesia.
- source_word: קְהַל יְהוָה
  choice: jemaah Yahweh
  rationale: '''Jemaah'' menyatakan himpunan umat dalam arti resmi dan komunal, sedangkan ''Yahweh'' mempertahankan nama ilahi dalam teks Ibrani.'
- source_word: גַּם דּוֹר עֲשִׂירִי
  choice: bahkan sampai keturunan kesepuluh
  rationale: Terjemahan ini mempertahankan daya penegasan גַּם dan formula generasional tanpa menjadikannya sekadar sinonim bagi 'selamanya'.
- source_word: לָהֶם
  choice: seorang pun dari mereka
  rationale: Dalam konstruksi larangan yang diulang, ungkapan ini secara alami menyatakan bahwa tidak ada seorang pun yang berasal dari kelompok tersebut yang boleh masuk.
- source_word: עַד עוֹלָם
  choice: untuk selama-lamanya
  rationale: Ungkapan ini menyatakan durasi yang terus berlaku dan diterjemahkan tanpa menghapus penyebutan keturunan kesepuluh sebelumnya.
theological_decisions:
- issue: Hubungan antara 'sampai keturunan kesepuluh' dan 'untuk selama-lamanya'
  choice: Kedua ungkapan dipertahankan dalam teks utama.
  alternative: Menafsirkan 'keturunan kesepuluh' hanya sebagai idiom untuk 'tidak pernah', atau melemahkan 'untuk selama-lamanya' sebagai penjelasan tambahan.
  rationale: Teks Ibrani memuat kedua ungkapan waktu tersebut. Mempertahankan keduanya menjaga ketegangan dan daya hukum teks tanpa menyelaraskannya secara diam-diam.
- issue: Cakupan istilah קהל יהוה
  choice: jemaah Yahweh
  alternative: perkumpulan Yahweh; umat Yahweh
  rationale: '''Jemaah'' menjaga nuansa komunitas umat yang berhimpun secara resmi tanpa menentukan secara berlebihan apakah yang dimaksud adalah ibadah, kewargaan, atau status perkawinan.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan dua kalimat mempertahankan pengulangan hukum dalam bahasa Ibrani, sementara 'seorang pun dari mereka' dibuat idiomatis dan jelas. Semua penanda catatan kaki tercantum dalam teks utama.
