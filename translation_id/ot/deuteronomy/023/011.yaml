  text: כִּֽי יִהְיֶ֤ה בְ/ךָ֙ אִ֔ישׁ אֲשֶׁ֛ר לֹא יִהְיֶ֥ה טָה֖וֹר מִ/קְּרֵה לָ֑יְלָה וְ/יָצָא֙ אֶל מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה לֹ֥א יָבֹ֖א אֶל תּ֥וֹךְ הַֽ/מַּחֲנֶֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/011.yaml
  text: If there is among you a man who is not clean because of a nocturnal emission[a], he shall go outside the camp; he shall not come into the midst of the camp.
translation:
  language: id
  text: Jika di antaramu ada seorang laki-laki yang tidak tahir karena keluarnya mani pada malam hari[a], ia harus pergi ke luar perkemahan dan tidak boleh masuk ke tengah perkemahan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “kejadian pada malam hari,” sebuah ungkapan Ibrani untuk keluarnya mani pada malam hari.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Jika
  rationale: Dalam konteks hukum kasuistis, kata ini memperkenalkan suatu keadaan bersyarat.
- source_word: יִהְיֶה בְךָ אִישׁ
  choice: di antaramu ada seorang laki-laki
  rationale: Mempertahankan konstruksi eksistensial, lingkup komunitas, dan rujukan khusus kepada laki-laki.
- source_word: אֲשֶׁר לֹא יִהְיֶה טָהוֹר
  choice: yang tidak tahir
  rationale: Istilah 'tahir' secara jelas menyatakan status ritual, tanpa menyiratkan kesalahan moral.
- source_word: מִקְּרֵה לָיְלָה
  choice: karena keluarnya mani pada malam hari
  rationale: Mengungkapkan secara wajar maksud idiom Ibrani dalam konteks kenajisan jasmani; catatan kaki mempertahankan bentuk harfiahnya.
- source_word: וְיָצָא אֶל מִחוּץ לַמַּחֲנֶה
  choice: ia harus pergi ke luar perkemahan
  rationale: Menyampaikan kelanjutan ketentuan hukum dan gerak meninggalkan batas perkemahan dalam bahasa Indonesia alami.
- source_word: לֹא יָבֹא אֶל תּוֹךְ הַמַּחֲנֶה
  choice: tidak boleh masuk ke tengah perkemahan
  rationale: Mempertahankan nuansa תּוֹךְ sebagai bagian dalam atau tengah perkemahan, bukan sekadar melintasi batas.
theological_decisions:
- issue: Sifat ketidaktahiran dalam ayat ini
  choice: Dipahami dan diterjemahkan sebagai ketidaktahiran ritual akibat pengeluaran tubuh.
  alternative: Memahaminya sebagai kenajisan atau kesalahan moral.
  rationale: Konteksnya mengatur kekudusan perkemahan dan status ritual akibat fungsi tubuh, bukan menyatakan bahwa orang itu melakukan dosa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Tidak tahir' mempertahankan kategori ritual yang penting, sedangkan 'keluarnya mani pada malam hari' lebih mudah dipahami pembaca umum daripada istilah medis atau ungkapan yang terlalu samar.
