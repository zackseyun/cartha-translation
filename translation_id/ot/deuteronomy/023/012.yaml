  text: וְ/הָיָ֥ה לִ/פְנֽוֹת עֶ֖רֶב יִרְחַ֣ץ בַּ/מָּ֑יִם וּ/כְ/בֹ֣א הַ/שֶּׁ֔מֶשׁ יָבֹ֖א אֶל תּ֥וֹךְ הַֽ/מַּחֲנֶה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/012.yaml
  text: And toward evening he shall wash himself with water[b][a], and when the sun sets he may come into the midst of the camp.
translation:
  language: id
  text: Menjelang petang, ia harus membasuh tubuhnya dengan air. Ketika matahari terbenam[a], ia boleh masuk ke tengah perkemahan[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “ketika matahari masuk”; ini adalah ungkapan Ibrani untuk matahari terbenam.
    reason: lexical_alternative
  - marker: b
    text: Atau “ke dalam perkemahan”; teks Ibrani secara lebih khusus mengatakan “ke tengah perkemahan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה לִפְנוֹת עֶרֶב
  choice: Menjelang petang
  rationale: Ungkapan ini meneruskan ketentuan sebelumnya dan menunjukkan saat hari beralih menuju petang. Bentuk Indonesia ini alami tanpa kehilangan urutan waktunya.
- source_word: יִרְחַץ בַּמָּיִם
  choice: ia harus membasuh tubuhnya dengan air
  rationale: Dalam konteks kenajisan ritual, רחץ menunjuk pada pembasuhan tubuh. Penambahan 'tubuhnya' memperjelas objek yang tersirat, sedangkan 'harus' menyampaikan daya perintah bentuk verbalnya.
- source_word: וּכְבֹא הַשֶּׁמֶשׁ
  choice: Ketika matahari terbenam
  rationale: Secara idiomatis ungkapan Ibrani ini berarti matahari terbenam. Terjemahan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: יָבֹא
  choice: ia boleh masuk
  rationale: Dalam konteks hukum ini, bentuk tersebut menyatakan bahwa orang itu diizinkan memasuki perkemahan sesudah membasuh diri dan setelah matahari terbenam, bukan sekadar memberitakan tindakan masa depan.
- source_word: אֶל תּוֹךְ הַמַּחֲנֶה
  choice: ke tengah perkemahan
  rationale: Kata תּוֹךְ menekankan bagian dalam perkemahan. 'Ke tengah perkemahan' mempertahankan nuansa itu tanpa menyiratkan bahwa ia hanya mendekati batas perkemahan.
theological_decisions:
- issue: Daya modal יָבֹא dalam ketentuan pentahiran
  choice: ia boleh masuk
  alternative: ia harus masuk
  rationale: Konteksnya menetapkan kapan orang yang sebelumnya berada di luar perkemahan diizinkan masuk lagi. Terjemahan ini tidak menjadikan masuknya orang itu sebagai kewajiban tambahan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam hukum yang lugas dan bermartabat. 'Membasuh tubuhnya' dipilih agar tindakan pembasuhan jasmani jelas; 'perkemahan' mempertahankan latar Israel di padang gurun.
