base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/024.yaml
  text: You shall keep what has gone out from your lips and do it[a], according to what you vowed to Yahweh your God as a freewill offering[b], which you spoke with your mouth.
translation:
  language: id
  text: Apa yang keluar dari bibirmu[a] hendaklah kamu pelihara dan laksanakan, sesuai dengan yang telah kamu nazarkan kepada Yahweh Allahmu sebagai persembahan sukarela,[b] yang telah kamu ucapkan dengan mulutmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “ucapan bibirmu” atau “apa yang keluar dari bibirmu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “persembahan sukarela.” Istilah Ibrani ini menunjuk pada persembahan yang diberikan dengan sukarela, bukan karena paksaan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹצָא שְׂפָתֶיךָ
  choice: apa yang telah keluar dari bibirmu
  rationale: Mempertahankan gambaran konkret idiom Ibrani tentang perkataan yang keluar dari bibir, sambil tetap dapat dipahami dalam bahasa Indonesia modern; dalam konteks ini yang dimaksud ialah nazar yang diucapkan.
- source_word: תִּשְׁמֹר וְעָשִׂיתָ
  choice: harus kamu pegang dan lakukan
  rationale: שׁמר menyatakan kewajiban memegang atau menaati komitmen, sedangkan עשה menuntut pelaksanaannya. Pasangan ini mempertahankan dua tindakan dalam teks sumber.
- source_word: כַּאֲשֶׁר נָדַרְתָּ
  choice: sesuai dengan yang telah kamu nazarkan
  rationale: Menunjukkan bahwa pelaksanaan harus sesuai dengan isi nazar yang telah dibuat, tanpa menambahkan penafsiran di luar teks.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: kepada Yahweh, Allahmu
  rationale: Menerjemahkan nama perjanjian יהוה secara langsung sebagai Yahweh dan mempertahankan hubungan posesif dalam אֱלֹהֶיךָ.
- source_word: נְדָבָה
  choice: sebagai persembahan sukarela
  rationale: Istilah ini menunjuk pada pemberian atau persembahan yang diberikan dengan sukarela. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan nuansa kultis yang mungkin ada.
- source_word: אֲשֶׁר דִּבַּרְתָּ בְּפִיךָ
  choice: yakni apa yang telah kamu ucapkan dengan mulutmu
  rationale: Kata 'yakni' membuat hubungan klausa relatif lebih jelas dalam bahasa Indonesia, sedangkan 'dengan mulutmu' mempertahankan penegasan konkret dan pengulangan tentang ucapan lisan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. Bentuk 'Yahweh' mempertahankan nama perjanjian itu secara langsung tanpa menggantinya dengan gelar.
- issue: Hubungan נְדָבָה dengan nazar
  choice: sebagai persembahan sukarela
  alternative: sebagai pemberian sukarela; dengan sukarela
  rationale: Tata bahasa memungkinkan נְדָבָה dipahami sebagai persembahan sukarela yang dinazarkan. Terjemahan ini mempertahankan kemungkinan konteks persembahan tanpa menyatakan lebih jauh jenis korbannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Idiom sumber dipertahankan sejauh tetap jelas; bentuk tunggal orang kedua diterjemahkan dengan 'kamu' sesuai sapaan langsung kepada seorang anggota umat.
