revisions:
- from: Apa yang telah keluar dari bibirmu harus kamu pegang dan lakukan,[a] sesuai dengan yang telah kamu nazarkan kepada Yahweh, Allahmu, sebagai persembahan sukarela,[b] yakni apa yang telah kamu ucapkan dengan mulutmu.
  to: Apa yang keluar dari bibirmu[a] hendaklah kamu pelihara dan laksanakan, sesuai dengan yang telah kamu nazarkan kepada Yahweh Allahmu sebagai persembahan sukarela,[b] yang telah kamu ucapkan dengan mulutmu.
  rationale: Revisi memperbaiki kealamian bahasa Indonesia dan menyelaraskan jangkar serta isi catatan kaki dengan frasa sumber yang relevan. Struktur perintah ganda, isi nazar, nama ilahi, kemungkinan makna kultis נְדָבָה, dan penegasan lisan tetap dipertahankan. Bentuk “Apa yang keluar dari bibirmu” menjaga citra konkret Ibrani tanpa aspek perfektif Indonesia yang tidak diperlukan.
