translation:
  language: id
  text: Janganlah seorang laki-laki mengambil istri ayahnya[a] atau menyingkapkan ujung jubah ayahnya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “menikahi istri ayahnya.”'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “menyingkapkan ujung jubah ayahnya.” Ungkapan ini merupakan eufemisme seksual dan dapat dipahami sebagai melanggar hubungan perkawinan ayahnya.
    reason: alternative_reading
lexical_decisions:
- source_word: יִקַּח
  choice: mengambil
  rationale: Dengan objek 'istri', verba לָקַח dapat berarti mengambil sebagai istri atau menikahi. 'Mengambil' mempertahankan ungkapan Ibrani, sementara arti perkawinannya dijelaskan dalam catatan.
- source_word: אִישׁ
  choice: seorang laki-laki
  rationale: Nomina maskulin tunggal diterjemahkan secara tepat dan wajar dalam rumusan larangan bahasa Indonesia.
- source_word: אֵשֶׁת אָבִיו
  choice: istri ayahnya
  rationale: Terjemahan ini mempertahankan hubungan hukum yang dinyatakan teks tanpa mempersempitnya menjadi 'ibu tiri'.
- source_word: יְגַלֶּה
  choice: menyingkapkan
  rationale: Verba גלה berarti menyingkapkan atau membuka; pilihan ini mempertahankan metafora dan sifat eufemistis ungkapan sumber.
- source_word: כְּנַף
  choice: punca kain
  rationale: כָּנָף dapat berarti ujung, tepi, atau bagian bawah pakaian. 'Punca kain' mempertahankan gambaran pakaian tanpa mengubahnya langsung menjadi tafsiran seksual.
theological_decisions:
- issue: Apakah eufemisme seksual dibuat eksplisit dalam teks utama
  choice: Mempertahankan metafora 'menyingkapkan punca kain ayahnya'
  alternative: menyingkapkan aurat ayahnya; mencemari ranjang perkawinan ayahnya
  rationale: Teks Ibrani memakai כְּנַף, bukan istilah biasa untuk 'aurat'. Mempertahankan metafora menjaga perbedaan itu dan tidak menetapkan secara berlebihan satu penafsiran idiomatis.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada hukum. Susunan larangan dibuat alami; metafora sumber dipertahankan dalam teks utama dan diterangkan melalui catatan kaki.
