  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לֹא תָבִיא֩ אֶתְנַ֨ן זוֹנָ֜ה וּ/מְחִ֣יר כֶּ֗לֶב בֵּ֛ית יְהוָ֥ה אֱלֹהֶ֖י/ךָ לְ/כָל נֶ֑דֶר כִּ֧י תוֹעֲבַ֛ת יְהוָ֥ה אֱלֹהֶ֖י/ךָ גַּם שְׁנֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/019.yaml
  text: You shall not bring the wages of a prostitute or the price of a dog into the house of Yahweh your God for any vow[a], because both of them are an abomination to Yahweh your God.
translation:
  language: id
  text: Janganlah engkau membawa upah seorang pelacur atau harga seekor anjing[a] ke rumah Yahweh, Allahmu, untuk nazar apa pun, sebab keduanya merupakan kekejian bagi Yahweh, Allahmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “harga seorang pelacur laki-laki,” jika “anjing” di sini dipahami sebagai sebutan menghina bagi pelacur laki-laki dalam kultus.
    reason: alternative_reading
lexical_decisions:
- source_word: תָבִיא
  choice: membawa
  rationale: Bentuk Hifil dari בוא menyatakan membawa sesuatu masuk ke suatu tempat. “Membawa” alami dalam bahasa Indonesia dan mempertahankan sifat konkret larangan ini.
- source_word: אֶתְנַן זוֹנָה
  choice: upah seorang pelacur
  rationale: אֶתְנַן berarti upah atau bayaran, sedangkan זוֹנָה berarti pelacur. Pilihan ini jelas, lugas, dan mempertahankan hubungan konstruksi Ibraninya.
- source_word: מְחִיר כֶּלֶב
  choice: harga seekor anjing
  rationale: מְחִיר lazimnya berarti harga atau nilai pembayaran, dan כֶּלֶב secara harfiah berarti anjing. Terjemahan utama mempertahankan bentuk leksikal Ibrani karena makna kiasannya masih diperdebatkan.
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: rumah Yahweh, Allahmu
  rationale: בֵּית secara harfiah berarti rumah. “Rumah” dipertahankan agar tidak memasukkan pengertian “Bait Allah” yang lebih khusus, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai “Yahweh”.
- source_word: לְכָל נֶדֶר
  choice: untuk nazar apa pun
  rationale: Frasa ini menyatakan tujuan atau kaitan dengan nazar. Terjemahan ringkas ini tidak menambahkan gagasan tentang tata cara pemenuhan atau persembahan yang tidak dinyatakan secara eksplisit.
- source_word: תוֹעֲבַת
  choice: merupakan kekejian
  rationale: תוֹעֵבָה adalah istilah kuat bagi sesuatu yang sangat menjijikkan atau tidak berkenan di hadapan Allah. “Kekejian” mempertahankan bobot istilah hukum-keagamaan tersebut.
- source_word: גַּם שְׁנֵיהֶם
  choice: keduanya
  rationale: Ungkapan ini menegaskan bahwa kedua hal yang baru disebut termasuk dalam penilaian dan larangan tersebut. “Keduanya” menyampaikan cakupan itu secara alami.
theological_decisions:
- issue: Makna כֶּלֶב dalam מְחִיר כֶּלֶב
  choice: Menerjemahkan secara harfiah sebagai “anjing” dalam teks utama.
  alternative: Memahaminya sebagai sebutan menghina bagi seorang pelacur laki-laki, mungkin dalam konteks kultus.
  rationale: Leksem Ibraninya secara langsung berarti “anjing”, sedangkan makna kiasan sebagai pelacur laki-laki tidak pasti. Teks utama mempertahankan ambiguitas sumber, dan kemungkinan penafsiran lain dicatat dalam catatan kaki.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. “Yahweh” mempertahankan nama ilahi sebagai nama diri tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal “engkau”, sesuai bentuk orang kedua tunggal dalam bahasa Ibrani. Diksi dibuat lugas dan bermartabat; “rumah” serta “kekejian” dipertahankan untuk menjaga bentuk dan bobot teks sumber.
