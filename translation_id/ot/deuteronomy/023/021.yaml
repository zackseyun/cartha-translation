  variant: modern standard Indonesian
source:
  edition: WLC
  text: לַ/נָּכְרִ֣י תַשִּׁ֔יךְ וּ/לְ/אָחִ֖י/ךָ לֹ֣א תַשִּׁ֑יךְ לְמַ֨עַן יְבָרֶכְ/ךָ֜ יְהוָ֣ה אֱלֹהֶ֗י/ךָ בְּ/כֹל֙ מִשְׁלַ֣ח יָדֶ֔/ךָ עַל הָ/אָ֕רֶץ אֲשֶׁר אַתָּ֥ה בָא שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/021.yaml
  text: You may charge interest to a foreigner[a], but to your brother you shall not charge interest[b], so that Yahweh your God may bless you in all the work of your hand in the land that you are entering to possess.
translation:
  language: id
  text: Kepada orang asing engkau boleh mengenakan bunga[a], tetapi kepada saudaramu engkau tidak boleh mengenakan bunga[b], supaya Yahweh, Allahmu, memberkatimu dalam segala pekerjaan tanganmu di negeri yang engkau masuki untuk memilikinya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “meminjamkan dengan bunga” atau “menagih bunga.”
    reason: lexical_alternative
  - marker: b
    text: “Saudaramu” di sini berarti sesama anggota Israel; bahasa Ibrani tetap memakai istilah kekeluargaan.
    reason: cultural_note
lexical_decisions:
- source_word: לַנָּכְרִי
  choice: kepada orang asing
  rationale: נָכְרִי menunjuk kepada orang asing atau pihak luar, berbeda dengan sesama anggota Israel; pilihan ini jelas dan alami dalam bahasa Indonesia modern.
- source_word: תַשִּׁיךְ / לֹא תַשִּׁיךְ
  choice: boleh mengenakan bunga / tidak boleh mengenakan bunga
  rationale: Bentuk Hifil dari נשׁך dalam konteks hukum pinjaman berarti membebankan bunga. 'Mengenakan bunga' merupakan ungkapan Indonesia yang lazim dan tidak memasukkan penilaian tambahan yang dapat terkandung dalam istilah 'riba'.
- source_word: אָחִיךָ
  choice: saudaramu
  rationale: Mempertahankan istilah kekeluargaan harfiah bahasa Ibrani sekaligus mencerminkan ikatan perjanjian; dalam konteks ini istilah tersebut merujuk kepada sesama anggota Israel.
- source_word: לְמַעַן
  choice: supaya
  rationale: Menyampaikan nuansa tujuan atau hasil secara alami dan ringkas.
- source_word: יְבָרֶכְךָ יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Allahmu, memberkati engkau
  rationale: Nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh'; bentuk verbal dalam klausa tujuan diterjemahkan secara alami sesudah 'supaya'.
- source_word: בְּכֹל מִשְׁלַח יָדֶךָ
  choice: dalam segala pekerjaan tanganmu
  rationale: Mempertahankan gambaran tangan dalam idiom Ibrani sambil tetap mudah dipahami sebagai seluruh pekerjaan atau usaha seseorang.
- source_word: עַל הָאָרֶץ
  choice: di negeri
  rationale: Walaupun עַל secara dasar berarti 'di atas', konteks tempat menuntut ungkapan Indonesia alami 'di negeri'.
- source_word: אֲשֶׁר אַתָּה בָא שָׁמָּה לְרִשְׁתָּהּ
  choice: yang akan engkau masuki untuk menjadi milikmu
  rationale: Mengungkapkan masuknya Israel yang segera terjadi dan tujuan mengambil negeri itu sebagai milik, tanpa membuat susunan Indonesia menjadi kaku.
theological_decisions:
- issue: Penerjemahan nama perjanjian יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama ilahi sebagai nama diri dan mengikuti keputusan proyek yang diberikan.
- issue: Cakupan אָחִיךָ dalam hukum perjanjian
  choice: saudaramu, dengan penjelasan bahwa yang dimaksud ialah sesama anggota Israel
  alternative: sesama orang Israel
  rationale: Istilah kekeluargaan dalam teks dipertahankan, sedangkan cakupan sosial-perjanjiannya dijelaskan dalam catatan agar tidak disalahpahami hanya sebagai saudara kandung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina 'engkau' mempertahankan sapaan tunggal teks Ibrani. Istilah 'bunga' dipilih daripada 'riba' agar tidak menambahkan penilaian moral atau pengertian teknis yang tidak dinyatakan oleh leksem itu sendiri.
