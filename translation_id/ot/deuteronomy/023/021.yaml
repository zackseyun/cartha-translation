  to: Kepada orang asing engkau boleh mengenakan bunga[a], tetapi kepada saudaramu engkau tidak boleh mengenakan bunga[b], supaya Yahweh, Allahmu, memberkatimu dalam segala pekerjaan tanganmu di negeri yang engkau masuki untuk memilikinya.
  rationale: Revisi hanya memperjelas bahwa negeri yang dimasuki adalah objek yang akan dimiliki, sebagaimana ditandai oleh akhiran objek dalam bahasa Ibrani. Bentuk “memberkatimu” juga dipakai demi kelancaran bahasa Indonesia modern. Makna, register, dan kedua jangkar catatan kaki dipertahankan.
