    issue: Objek pada klausa tujuan terakhir tidak jelas dalam “untuk menjadi milikmu.”
    rationale: 'Akhiran feminin tunggal pada לְרִשְׁתָּהּ merujuk kepada “negeri/tanah”: mereka masuk ke negeri itu untuk memilikinya. Revisi eksplisit mengembalikan objek tersebut dan menghindari ambiguitas sintaksis Indonesia.'
