  to: Hendaklah ia tinggal bersamamu[a], di tengah-tengahmu, di salah satu kotamu[b], di tempat yang baik menurut penilaiannya. Janganlah engkau menindasnya.
  rationale: Revisi mengganti “Ia harus tinggal” dengan “Hendaklah ia tinggal” untuk mencerminkan fungsi normatif ketentuan ini tanpa menyiratkan kewajiban yang khusus dibebankan kepada orang tersebut. Susunan lokasi diperhalus, dan “yang baik baginya” diungkapkan sebagai “yang baik menurut penilaiannya,” yang mempertahankan sudut pandang subjek dari בַּטּוֹב לוֹ. Catatan kaki dipertahankan dan diselaraskan dengan teks revisi.
