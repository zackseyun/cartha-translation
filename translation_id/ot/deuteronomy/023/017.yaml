base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/017.yaml
  text: He shall live with you[a], in your midst, in the place that he chooses within one of your gates, wherever it is good for him[b]; you shall not oppress him.
translation:
  language: id
  text: Hendaklah ia tinggal bersamamu[a], di tengah-tengahmu, di salah satu kotamu[b], di tempat yang baik menurut penilaiannya. Janganlah engkau menindasnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Hendaklah ia menetap bersamamu.”'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “di salah satu gerbangmu.” Dalam bahasa Ibrani, “gerbang” dapat merujuk pada kota atau komunitas tempat gerbang itu berada.'
    reason: cultural_note
lexical_decisions:
- source_word: יֵשֵׁב
  choice: harus tinggal
  rationale: Kata kerja ישב dapat berarti duduk, menetap, atau tinggal. Dalam ketentuan mengenai tempat tinggal seseorang, “tinggal” menyampaikan keadaan menetap secara alami dan jelas.
- source_word: עִמְּךָ
  choice: bersamamu
  rationale: Preposisi עם dengan akhiran orang kedua tunggal secara langsung berarti “bersamamu”; frasa berikutnya memperjelas bahwa ia diterima di dalam komunitas.
- source_word: בְּקִרְבְּךָ
  choice: di tengah-tengahmu
  rationale: Ungkapan ini menunjuk pada keberadaan di dalam lingkungan umat dan mempertahankan gambaran konkret bahasa Ibrani.
- source_word: בַּמָּקוֹם אֲשֶׁר יִבְחַר
  choice: di tempat yang dipilihnya
  rationale: Subjek kata יבחר adalah orang yang sedang dibicarakan, yakni hamba yang melarikan diri dalam ayat sebelumnya. Terjemahan ini mempertahankan haknya untuk memilih tempat tinggal.
- source_word: בְּאַחַד שְׁעָרֶיךָ
  choice: di salah satu kotamu
  rationale: Secara harfiah berarti “di salah satu gerbangmu”, tetapi שׁער lazim dipakai secara metonimis untuk kota atau permukiman yang memiliki gerbang. “Kota” menyampaikan maksud idiom itu dengan wajar dalam bahasa Indonesia.
- source_word: בַּטּוֹב לוֹ
  choice: di tempat yang baik baginya
  rationale: Secara dekat berarti “dalam yang baik baginya”. Rumusan ini mempertahankan penilaian dari sudut pandang orang tersebut tanpa mempersempitnya menjadi sekadar kesenangan subjektif.
- source_word: לֹא תּוֹנֶנּוּ
  choice: janganlah engkau menindasnya
  rationale: Dalam konteks hukum, bentuk ini menyatakan larangan menekan, mengeksploitasi, atau memperlakukan secara sewenang-wenang. “Menindas” mempertahankan kekuatan sosial dan moral larangan tersebut.
theological_decisions:
- issue: Rujukan bentuk maskulin tunggal
  choice: Menggunakan “ia/-nya” bagi individu yang dibicarakan dan “engkau/-mu” bagi Israel sebagai pihak yang disapa secara kolektif.
  alternative: Menggunakan bentuk jamak atau ungkapan netral yang mengaburkan bentuk tunggal teks sumber.
  rationale: Bahasa Ibrani memakai bentuk maskulin tunggal bagi orang yang melarikan diri dan bentuk orang kedua tunggal bagi umat yang disapa. Bahasa Indonesia memungkinkan bentuk tunggal tanpa menambahkan penandaan gender yang tidak diperlukan.
- issue: Pihak yang memilih tempat tinggal
  choice: Orang yang melarikan diri itulah yang memilih tempatnya.
  alternative: Israel atau TUHAN menentukan tempat baginya.
  rationale: Bentuk יִבְחַר secara gramatikal meneruskan subjek maskulin tunggal dari יֵשֵׁב; tidak ada pergantian subjek yang ditandai dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak hukum yang khidmat tetapi mudah dipahami. “Janganlah” mempertahankan nada larangan tegas, sedangkan “tinggal” dan “kota” dipilih agar idiom sumber terbaca alami tanpa kehilangan maknanya.
