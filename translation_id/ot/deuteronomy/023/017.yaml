  naturalness: Teks revisi memakai bahasa Indonesia baku modern dan bernada hukum yang wajar. “Hendaklah” sesuai untuk ketetapan normatif, sedangkan “di salah satu kotamu, di tempat yang baik menurut penilaiannya” jelas dan tidak bertele-tele.
  terminology: “Kota” merupakan pengungkapan alami bagi idiom Ibrani “gerbang-gerbangmu,” dengan catatan yang tetap menyebut bentuk harfiahnya. “Menindas” secara tepat menyampaikan larangan ינה dalam konteks perlindungan terhadap pihak rentan.
