language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/יָתֵ֛ד תִּהְיֶ֥ה לְ/ךָ֖ עַל אֲזֵנֶ֑/ךָ וְ/הָיָה֙ בְּ/שִׁבְתְּ/ךָ֣ ח֔וּץ וְ/חָפַרְתָּ֣ה בָ֔/הּ וְ/שַׁבְתָּ֖ וְ/כִסִּ֥יתָ אֶת צֵאָתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/014.yaml
  text: And you shall have a peg among your equipment[a], and when you sit down outside[c][b], you shall dig with it and turn back and cover your excrement.
translation:
  language: id
  text: Harus ada pasak di antara perlengkapanmu[a][b]. Ketika engkau duduk di luar[c], galilah dengan pasak itu, lalu berbaliklah dan tutuplah kotoranmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “pancang”; sebagian orang memahami benda ini berdasarkan fungsinya sebagai alat penggali atau sekop kecil.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “pada telingamu.” Ungkapan Ibrani ini kemungkinan menunjuk pada perlengkapan yang dibawa seseorang.
    reason: lexical_alternative
  - marker: c
    text: Bahasa Ibrani berbunyi “ketika engkau duduk di luar,” suatu ungkapan halus untuk buang air.
    reason: cultural_note
lexical_decisions:
- source_word: יָתֵד
  choice: pasak
  rationale: Nomina ini lazim berarti pasak atau pancang. 'Pasak' mempertahankan gambaran leksikal Ibrani, sementara klausa berikutnya menjelaskan bahwa benda itu dipakai untuk menggali.
- source_word: עַל אֲזֵנֶךָ
  choice: di antara perlengkapanmu
  rationale: Secara harfiah frasa ini berbunyi 'pada telingamu', tetapi dalam konteks peraturan perkemahan kemungkinan menunjuk pada perlengkapan yang dibawa. Terjemahan ini menyampaikan makna kontekstual tanpa menghasilkan ungkapan yang tidak masuk akal dalam bahasa Indonesia.
- source_word: בְּשִׁבְתְּךָ חוּץ
  choice: ketika engkau duduk di luar
  rationale: Terjemahan ini mempertahankan ungkapan halus dalam bahasa Ibrani untuk buang air, tanpa menjelaskannya secara berlebihan di dalam teks.
- source_word: וְחָפַרְתָּה בָהּ
  choice: galilah dengan pasak itu
  rationale: Pronomina feminin merujuk kembali kepada יָתֵד. Lubang memang tersirat, tetapi tidak disebutkan secara eksplisit dalam bahasa Ibrani.
- source_word: וְשַׁבְתָּ
  choice: lalu berbaliklah
  rationale: Dalam urutan tindakan ini, verba שׁוב paling wajar dipahami sebagai berbalik sesudah menggali untuk kemudian menutupi kotoran.
- source_word: צֵאָתֶךָ
  choice: kotoranmu
  rationale: Istilah ini secara tepat menunjuk pada tinja manusia. 'Kotoran' lebih alami dan mudah dipahami dalam bahasa Indonesia modern daripada istilah medis, namun tetap pantas untuk ragam hukum yang bermartabat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk tunggal 'engkau' dipertahankan untuk mencerminkan sufiks orang kedua tunggal dalam teks Ibrani. Susunan kalimat dibuat alami, sementara metafora 'pasak' dan eufemisme 'duduk di luar' tetap dipertahankan.
