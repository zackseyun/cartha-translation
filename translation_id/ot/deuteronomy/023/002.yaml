  text: No man with crushed testicles or a severed penis may enter the assembly of Yahweh[a][b].
translation:
  language: id
  text: Laki-laki yang testisnya remuk atau penisnya terputus tidak boleh masuk ke dalam perhimpunan Yahweh[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, dengan susunan yang lebih formal, “Tidak seorang pun yang testisnya remuk atau penisnya terputus boleh masuk ke dalam perhimpunan Yahweh.”
    reason: lexical_alternative
  - marker: b
    text: “Perhimpunan Yahweh” dapat menunjuk pada keikutsertaan resmi dalam komunitas perjanjian Israel; cakupan tepat pengecualian ini diperdebatkan.
    reason: alternative_reading
lexical_decisions:
- source_word: יָבֹא
  choice: masuk
  rationale: Kata kerja בוא berarti datang atau masuk. Dalam larangan hukum ini, frasa “tidak boleh masuk” menyampaikan larangan secara alami dalam bahasa Indonesia tanpa memperluas maknanya.
- source_word: פְצוּעַ דַּכָּא
  choice: yang buah pelirnya remuk
  rationale: Gabungan kata ini menunjuk pada cedera akibat penghancuran pada alat kelamin laki-laki, khususnya buah pelir. Pilihan ini jelas secara anatomis dan lebih tepat daripada istilah umum “kemaluan”.
- source_word: וּכְרוּת שָׁפְכָה
  choice: atau penisnya terpotong
  rationale: Ungkapan ini menunjuk pada organ kelamin laki-laki yang dipotong. “Penis” merupakan istilah Indonesia modern yang langsung dan tepat; “atau” mempertahankan hubungan alternatif antara kedua kondisi.
- source_word: בִּקְהַל
  choice: ke dalam perhimpunan
  rationale: קהל menunjuk pada komunitas yang berhimpun. “Perhimpunan” mempertahankan nuansa komunal dan resmi tanpa menyamakan istilah ini dengan gereja atau menetapkan ruang lingkup hukumnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
- source_word: לֹא
  choice: tidak boleh
  rationale: Dalam konteks hukum, “tidak boleh” menyampaikan daya larangan Ibrani secara wajar dalam bahasa Indonesia.
- source_word: implicit male referent of the participial phrases
  choice: laki-laki
  rationale: Kedua kondisi yang disebutkan secara khusus menyangkut anatomi laki-laki, sehingga referennya dinyatakan secara eksplisit dan akurat.
theological_decisions:
- issue: Sifat pengecualian dari קְהַל יְהוָה (“perhimpunan Yahweh”)
  choice: Frasa diterjemahkan secara langsung tanpa menentukan lebih lanjut jenis keanggotaan atau akibat teologis pengecualian tersebut.
  alternative: Menafsirkannya secara khusus sebagai larangan mengikuti ibadah resmi, larangan memperoleh keanggotaan sipil atau menikah dalam Israel, atau pengecualian kultis yang lebih luas.
  rationale: Ayat ini menyatakan larangan masuk ke dalam “perhimpunan Yahweh”, tetapi tidak mendefinisikan seluruh cakupan hukum dan teologisnya. Terjemahan mempertahankan ketegangan itu dan tidak memasukkan kesimpulan doktrinal kemudian.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. Istilah anatomi dibuat eksplisit karena teks Ibrani sendiri bersifat spesifik. “Perhimpunan” dipilih untuk menghindari konotasi gerejawi yang terlalu sempit pada “jemaat”.
