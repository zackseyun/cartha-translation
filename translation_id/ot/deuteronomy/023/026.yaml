base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/026.yaml
  text: When you come into your neighbor’s standing grain[a], you may pluck heads with your hand[b], but you shall not put a sickle to your neighbor’s standing grain.
translation:
  language: id
  text: Apabila engkau masuk ke antara tanaman biji-bijian sesamamu yang masih berdiri[a], engkau boleh memetik bulir-bulirnya dengan tanganmu, tetapi janganlah engkau menggunakan sabit pada tanaman biji-bijian sesamamu itu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “tanaman biji-bijian sesamamu yang berdiri”; maksudnya ialah tanaman biji-bijian yang masih tumbuh dan belum dituai.
    reason: lexical_alternative
  - marker: b
    text: Atau, “janganlah engkau mengayunkan sabit pada tanaman biji-bijian sesamamu itu.” Kata Ibraninya dapat menggambarkan tindakan mengayunkan atau menerapkan sabit untuk menuai.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי תָבֹא
  choice: Apabila engkau masuk
  rationale: כִּי memperkenalkan keadaan ketika hukum ini berlaku, dan בוא berarti masuk atau datang. “Apabila engkau masuk” menyampaikan bentuk hukum kasuistik secara wajar dalam bahasa Indonesia.
- source_word: בְּקָמַת רֵעֶךָ
  choice: ke antara tanaman gandum sesamamu yang masih berdiri
  rationale: קָמָה menunjuk pada tanaman biji-bijian yang masih berdiri dan belum dituai. Ungkapan ini mempertahankan gambaran tanaman yang belum dipanen tanpa menyempitkannya menjadi sekadar hasil panen.
- source_word: וְקָטַפְתָּ
  choice: engkau boleh memetik
  rationale: Dalam konteks hukum ini, bentuk verba tersebut menyatakan tindakan yang diizinkan, bukan perintah untuk memetik. “Boleh” membuat daya permisif itu jelas.
- source_word: מְלִילֹת
  choice: bulir-bulirnya
  rationale: מְלִילֹת merujuk pada bulir atau kepala biji-bijian yang dapat dipetik dengan tangan. “Bulir-bulir” merupakan istilah pertanian yang alami dan tepat dalam bahasa Indonesia.
- source_word: בְּיָדֶךָ
  choice: dengan tanganmu
  rationale: 'Frasa ini menandai batas izin: hanya memetik dengan tangan, bukan menuai dengan alat.'
- source_word: וְחֶרְמֵשׁ לֹא תָנִיף
  choice: tetapi janganlah engkau mengayunkan sabit
  rationale: Konjungsi menyatakan pertentangan antara pemetikan yang diizinkan dan penuaian yang dilarang. Hifil נוּף dapat menggambarkan mengayunkan atau menggerakkan alat; “mengayunkan sabit” mempertahankan citra konkret tersebut.
- source_word: עַל קָמַת רֵעֶךָ
  choice: pada tanaman gandum sesamamu itu
  rationale: עַל menandai sasaran penerapan sabit. Kata “itu” merujuk kembali kepada tanaman gandum yang masih berdiri dan menghindari pengulangan yang berat.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal “engkau,” sesuai gaya hukum perjanjian yang langsung namun tetap bermartabat. Struktur kontras antara izin memetik dengan tangan dan larangan menuai memakai sabit dipertahankan dengan jelas.
