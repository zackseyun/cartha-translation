review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the conditional legal setting, the permission to pluck grain heads by hand, and the prohibition on harvesting with a sickle. However, קָמָה denotes standing grain/cereal crops generally, not specifically wheat; rendering it as “tanaman gandum” narrows the Hebrew without support. The first footnote repeats that unsupported specificity.
  naturalness: The sentence is clear and suitably formal in modern standard Indonesian. “Tanaman biji-bijian ... yang masih berdiri” is a natural enough way to retain the agricultural specificity without identifying a particular cereal. “Menggunakan sabit pada” communicates the prohibited harvesting action idiomatically.
  terminology: “Sesamamu,” “bulir-bulir,” “tanganmu,” and “sabit” fit the legal register. “Tanaman biji-bijian” is preferable to “tanaman gandum,” since the source does not identify the crop as wheat.
  issues:
  - severity: medium
    issue: “Tanaman gandum” specifies wheat.
    rationale: The Hebrew קָמָה refers to standing grain/cereal crops and does not name wheat. The Indonesian should preserve this broader reference.
  - severity: low
    issue: Footnote a calls the phrase “gandum sesamamu yang berdiri.”
    rationale: This purported literal explanation incorrectly retains the unwarranted identification of the crop as wheat.
  - severity: low
    issue: Footnote b offers the revised main-text wording as its alternative.
    rationale: Once “menggunakan sabit” is used in the main text, the note should instead present the more literal image of swinging/wielding the sickle.
  revised_text: Apabila engkau masuk ke antara tanaman biji-bijian sesamamu yang masih berdiri[a], engkau boleh memetik bulir-bulirnya dengan tanganmu, tetapi janganlah engkau menggunakan sabit pada tanaman biji-bijian sesamamu itu.[b]
