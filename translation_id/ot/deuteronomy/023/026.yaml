revisions:
- from: Apabila engkau masuk ke antara tanaman gandum sesamamu yang masih berdiri[a], engkau boleh memetik bulir-bulirnya dengan tanganmu, tetapi janganlah engkau mengayunkan sabit pada tanaman gandum sesamamu itu.[b]
  to: Apabila engkau masuk ke antara tanaman biji-bijian sesamamu yang masih berdiri[a], engkau boleh memetik bulir-bulirnya dengan tanganmu, tetapi janganlah engkau menggunakan sabit pada tanaman biji-bijian sesamamu itu.[b]
  rationale: The revision removes the unsupported restriction to wheat while retaining the source’s reference to unharvested standing cereal crops. It also aligns both footnotes with the revised wording and preserves the Hebrew verb’s concrete sickle imagery as an alternative.
