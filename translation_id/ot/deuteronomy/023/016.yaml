  yaml_path: translation/ot/deuteronomy/023/016.yaml
  text: You shall not hand over to his master a servant who has escaped from his master to you[a].
translation:
  language: id
  text: Janganlah kamu menyerahkan kepada tuannya seorang budak[a] yang melarikan diri dari tuannya dan datang kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “hamba.” Kata Ibrani yang dipakai dapat berarti hamba atau budak; di sini “budak” digunakan karena ketundukan orang itu kepada seorang tuan merupakan pokok hukum ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: תַסְגִּיר
  choice: menyerahkan
  rationale: Bentuk Hifil dari סגר di sini berarti menyerahkan seseorang ke dalam kuasa pihak lain. “Menyerahkan” alami dalam konteks hukum dan mempertahankan daya perintah ayat ini.
- source_word: עֶבֶד
  choice: budak
  rationale: Dalam hukum ini, ketundukan orang tersebut kepada seorang tuan dan pelariannya dari hubungan itu merupakan pokok persoalan. “Budak” menyatakan status terikat tersebut dengan lebih jelas daripada “hamba” atau “pelayan”.
- source_word: אֶל אֲדֹנָיו
  choice: kepada tuannya
  rationale: Dalam konteks sosial-hukum ini, אָדוֹן menunjuk kepada tuan dari budak itu, bukan gelar ilahi.
- source_word: אֲשֶׁר יִנָּצֵל
  choice: yang melarikan diri
  rationale: Bentuk Nifal dari נצל dapat berarti dilepaskan atau lolos. Dalam konteks orang yang meninggalkan tuannya, “melarikan diri” menyampaikan makna kontekstualnya tanpa mengubah klausa relatif menjadi klausa waktu.
- source_word: אֵלֶיךָ
  choice: dan datang kepadamu
  rationale: Kata depan אֶל menyatakan gerak menuju pihak yang disapa. Penambahan verba “datang” yang tersirat diperlukan agar arah gerak itu dinyatakan secara alami dalam bahasa Indonesia.
- source_word: מֵעִם אֲדֹנָיו
  choice: dari tuannya
  rationale: מֵעִם menyatakan pemisahan dari keberadaan bersama sang tuan; “dari tuannya” adalah padanan Indonesia yang alami.
theological_decisions:
- issue: Status sosial yang dinyatakan oleh עֶבֶד
  choice: budak
  alternative: hamba
  rationale: Ayat ini membicarakan seseorang yang berada di bawah kuasa seorang tuan, melarikan diri, dan tidak boleh diserahkan kembali. Karena status terikatnya menjadi inti hukum ini, “budak” lebih tepat, sementara alternatif leksikal “hamba” dicatat dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Bentuk “Janganlah kamu” mempertahankan larangan langsung kepada Israel secara kolektif, sedangkan susunan klausa dibuat alami tanpa menghilangkan arah pelarian menuju pihak yang disapa.
