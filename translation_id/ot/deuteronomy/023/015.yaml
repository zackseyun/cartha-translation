  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ מִתְהַלֵּ֣ךְ בְּ/קֶ֣רֶב מַחֲנֶ֗/ךָ לְ/הַצִּֽילְ/ךָ֙ וְ/לָ/תֵ֤ת אֹיְבֶ֨י/ךָ֙ לְ/פָנֶ֔י/ךָ וְ/הָיָ֥ה מַחֲנֶ֖י/ךָ קָד֑וֹשׁ וְ/לֹֽא יִרְאֶ֤ה בְ/ךָ֙ עֶרְוַ֣ת דָּבָ֔ר וְ/שָׁ֖ב מֵ/אַחֲרֶֽי/ךָ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/015.yaml
  text: For Yahweh your God walks in the midst of your camp to deliver you and to give your enemies before you[a]. Therefore your camp must be holy[c][b], so that he may not see in you anything indecent and turn away from you.
translation:
  language: id
  text: Sebab Yahweh, Allahmu, berjalan di tengah-tengah perkemahanmu untuk menyelamatkanmu dan menyerahkan musuh-musuhmu kepadamu. Karena itu, perkemahanmu harus kudus, supaya Ia tidak melihat sesuatu yang tidak senonoh di tengah-tengahmu[a] lalu berbalik meninggalkanmu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “ketelanjangan suatu perkara.” Ungkapan Ibrani ini dapat menunjuk pada sesuatu yang tidak senonoh, memalukan, atau menajiskan perkemahan.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “berbalik dari belakangmu,” yaitu tidak lagi menyertai perkemahan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi perjanjian secara langsung, selaras dengan kebijakan proyek.
- source_word: מִתְהַלֵּךְ
  choice: berjalan
  rationale: Mempertahankan gambaran konkret dan antropomorfis tentang kehadiran aktif Yahweh di dalam perkemahan.
- source_word: בְּקֶרֶב מַחֲנֶךָ
  choice: di tengah-tengah perkemahanmu
  rationale: Mencerminkan makna spasial בְּקֶרֶב dan menekankan kehadiran ilahi di tengah umat.
- source_word: לְהַצִּילְךָ
  choice: untuk menyelamatkanmu
  rationale: Dalam konteks militer, bentuk ini menyatakan tindakan membebaskan atau menyelamatkan Israel dari musuh.
- source_word: וְלָתֵת אֹיְבֶיךָ לְפָנֶיךָ
  choice: dan menyerahkan musuh-musuhmu kepadamu
  rationale: 'Mengungkapkan idiom Ibrani secara alami dalam bahasa Indonesia: musuh diserahkan ke dalam kuasa Israel.'
- source_word: וְהָיָה מַחֲנֶיךָ קָדוֹשׁ
  choice: Karena itu, perkemahanmu harus kudus
  rationale: Konteks memberi klausa ini daya konsekuensial sekaligus preskriptif karena Yahweh hadir di perkemahan.
- source_word: עֶרְוַת דָּבָר
  choice: sesuatu yang tidak senonoh
  rationale: Ungkapan ini cukup luas untuk hal memalukan atau tidak pantas; tidak dibatasi secara diam-diam hanya pada ketelanjangan harfiah.
- source_word: וְלֹא יִרְאֶה בְךָ
  choice: supaya Ia tidak melihat ... di tengah-tengahmu
  rationale: Menyampaikan tujuan atau akibat yang dimaksud sambil memahami pronomina tunggal sebagai Israel secara kolektif.
- source_word: וְשָׁב מֵאַחֲרֶיךָ
  choice: lalu berbalik meninggalkanmu
  rationale: Bahasa ini mempertahankan gambaran Yahweh yang berbalik dari posisi-Nya menyertai perkemahan tanpa menambahkan gagasan bahwa Ia secara khusus 'mengikuti' Israel.
theological_decisions:
- issue: Gambaran antropomorfis tentang kehadiran Yahweh
  choice: Mempertahankan kata konkret “berjalan”
  alternative: “hadir” atau “bergerak di tengah-tengah”
  rationale: Teks Ibrani sengaja memakai gambaran gerak yang konkret untuk menghubungkan kedekatan Yahweh dengan tuntutan kekudusan perkemahan; terjemahan tidak perlu mengabstrakkannya.
- issue: Daya klausa tentang kekudusan perkemahan
  choice: “perkemahanmu harus kudus”
  alternative: “perkemahanmu akan kudus”
  rationale: Dalam konteks hukum, bentuk tersebut menyatakan kewajiban yang timbul dari kehadiran Yahweh, bukan sekadar ramalan.
- issue: Makna akibat jika ditemukan ketidaksenonohan
  choice: “berbalik meninggalkanmu”
  alternative: “berbalik dari belakangmu” atau “berhenti menyertaimu”
  rationale: Pilihan ini mempertahankan ancaman ditariknya penyertaan ilahi tanpa mempersempit atau memperluas gambaran sumber secara doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. Bentuk sapaan tunggal dipertahankan melalui akhiran -mu karena teks menyapa Israel sebagai satu kesatuan. Nama “Yahweh” dipertahankan menurut kebijakan proyek.
