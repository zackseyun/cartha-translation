  text: When you go out as an army against your enemies[a], then keep yourself from every evil thing.
translation:
  language: id
  text: Apabila engkau berangkat bersama pasukan untuk melawan musuh-musuhmu, jagalah dirimu dari segala hal yang jahat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “segala hal yang najis” atau “apa pun yang tidak patut”. Ungkapan Ibrani ini luas dan dalam konteks ini dapat mencakup kenajisan ritual, tetapi tidak terbatas pada hal itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Apabila
  rationale: Dalam konteks hukum-pengajaran ini, כִּי membuka keadaan yang menjadi latar bagi perintah berikutnya. “Apabila” menyampaikan hubungan situasional itu secara alami tanpa menjadikannya syarat yang meragukan.
- source_word: תֵצֵא
  choice: engkau berangkat
  rationale: Bentuk ini secara harfiah berarti “engkau keluar”. Dalam konteks gerakan militer, “berangkat” lebih alami dalam bahasa Indonesia tanpa mempersempit maknanya menjadi tindakan tempur tertentu.
- source_word: מַחֲנֶה
  choice: sebagai pasukan
  rationale: מַחֲנֶה dapat berarti “perkemahan” atau suatu pasukan yang berkemah. Dalam susunan ini dan dengan keterangan “melawan musuh-musuhmu”, kata tersebut menunjuk secara metonimis kepada pasukan.
- source_word: עַל
  choice: untuk melawan
  rationale: Dalam konteks militer, עַל menyatakan arah permusuhan dan paling jelas diterjemahkan “melawan”.
- source_word: אֹיְבֶיךָ
  choice: musuh-musuhmu
  rationale: Padanan langsung dan alami bagi bentuk jamak “musuh” dengan akhiran orang kedua tunggal.
- source_word: וְנִשְׁמַרְתָּ
  choice: jagalah dirimu
  rationale: 'Bentuk Nifal dari שׁמר di sini memiliki nuansa refleksif dalam sebuah perintah: menjaga atau mengawasi diri sendiri.'
- source_word: מִכֹּל
  choice: dari segala
  rationale: Gabungan מן dan כֹּל setelah שׁמר menyatakan hal-hal yang harus dihindari; “dari segala” mempertahankan cakupannya yang menyeluruh.
- source_word: דָּבָר
  choice: hal
  rationale: דָּבָר memiliki arti luas, termasuk “perkataan”, “perkara”, atau “hal”. Di sini “hal” paling alami dan tidak membatasi acuannya pada ucapan.
- source_word: רָע
  choice: yang jahat
  rationale: רָע mencakup apa yang buruk atau tercela. “Jahat” mempertahankan keluasan ungkapan Ibrani, sementara konteks selanjutnya memungkinkan—tetapi tidak mewajibkan—cakupan kenajisan ritual.
theological_decisions:
- issue: Cakupan דָּבָר רָע dalam ketentuan tentang kekudusan perkemahan
  choice: segala hal yang jahat
  alternative: segala hal yang najis; apa pun yang tidak patut
  rationale: Konteks langsung selanjutnya membahas kenajisan, tetapi ungkapan Ibraninya sendiri lebih luas. Terjemahan utama tidak membatasinya hanya pada kenajisan ritual, sedangkan catatan kaki mempertahankan kemungkinan kontekstual tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan tunggal “engkau”, sesuai laras Kitab Suci yang langsung dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum sambil mempertahankan bentuk situasional dan daya perintah teks Ibrani.
