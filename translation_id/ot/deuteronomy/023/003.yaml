id: DEU.23.3
reference: Deuteronomy 23:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לֹא יָבֹ֥א מַמְזֵ֖ר בִּ/קְהַ֣ל יְהוָ֑ה גַּ֚ם דּ֣וֹר עֲשִׂירִ֔י לֹא יָ֥בֹא ל֖/וֹ בִּ/קְהַ֥ל יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/023/003.yaml
  text: No one of illegitimate birth may enter the assembly of Yahweh; even to the tenth generation[a], none of his descendants may enter the assembly of Yahweh.
translation:
  language: id
  text: Orang yang lahir dari hubungan terlarang[a] tidak boleh masuk ke dalam jemaah Yahweh. Bahkan hingga generasi kesepuluh, tidak seorang pun dari keturunannya boleh masuk ke dalam jemaah Yahweh.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: מַמְזֵר (mamzer), istilah bagi orang dengan status kelahiran yang tidak sah atau terlarang; arti dan cakupan tepatnya tidak pasti. Secara tradisional diterjemahkan “anak haram,” tetapi ungkapan itu kini bernada menghina dan dapat memberi kesan yang lebih sempit daripada istilah Ibraninya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַמְזֵר
  choice: orang yang lahir dari hubungan terlarang
  rationale: Istilah Ibrani ini menunjuk pada status kelahiran yang dianggap tidak sah atau terlarang dalam tatanan umat, tetapi cakupan tepatnya diperdebatkan. Ungkapan ini lebih jelas dan kurang menghina daripada sebutan tradisional “anak haram”; ketidakpastian leksikalnya dipertahankan dalam catatan kaki.
- source_word: יָבֹא
  choice: boleh masuk
  rationale: Secara harfiah berarti “datang/masuk”; dalam konteks hukum dengan לֹא, “tidak boleh masuk” menyampaikan larangan keanggotaan atau penerimaan secara alami dalam bahasa Indonesia.
- source_word: קְהַל יְהוָה
  choice: jemaah Yahweh
  rationale: קָהָל menunjuk pada perhimpunan umat perjanjian. “Jemaah” merupakan padanan modern yang wajar, sedangkan nama ilahi יְהוָה ditransliterasikan sebagai “Yahweh” sesuai kebijakan proyek.
- source_word: גַּם דּוֹר עֲשִׂירִי
  choice: bahkan hingga generasi kesepuluh
  rationale: Padanan ini mempertahankan penekanan גַּם dan jangkauan rumusan hukum antargenerasi tersebut.
- source_word: לֹא יָבֹא לוֹ
  choice: tidak seorang pun dari keturunannya boleh masuk
  rationale: Dalam konteks penyebutan generasi, unsur pronominal לוֹ dipahami menunjuk kepada orang-orang dari garis keturunannya. Rumusan Indonesia ini mengungkapkan implikasi idiom hukum Ibrani tanpa mengulang subjek secara membingungkan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה secara langsung. “Yahweh” mempertahankan nama tersebut sebagai nama diri dan mengikuti kebijakan proyek.
- issue: Makna “masuk ke dalam jemaah Yahweh”
  choice: Dipertahankan tanpa menjelaskan bentuk partisipasi tertentu
  alternative: Menafsirkannya secara khusus sebagai menghadiri ibadah, menikah dalam umat, atau memegang jabatan
  rationale: Ungkapan Ibrani tidak merinci di ayat ini bentuk hak atau partisipasi yang dimaksud. Terjemahan tidak mengunci pembaca pada satu penafsiran denominasi atau sosial tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Struktur larangan hukum dipertahankan dengan “tidak boleh,” sedangkan istilah yang berpotensi menghina dihindari dalam teks utama. Pengulangan “masuk ke dalam jemaah Yahweh” mengikuti penekanan teks Ibrani.
