  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: רַ֗ק מֵ/עָרֵ֤י הָֽ/עַמִּים֙ הָ/אֵ֔לֶּה אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָ֑ה לֹ֥א תְחַיֶּ֖ה כָּל נְשָׁמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/016.yaml
  text: But from the cities of these peoples that Yahweh your God is giving you as an inheritance[a], you shall not let any living thing remain alive.
translation:
  language: id
  text: Namun, dari kota-kota bangsa-bangsa ini yang Yahweh, Allahmu, berikan kepadamu sebagai milik pusaka, jangan biarkan satu pun yang bernapas[a] tetap hidup.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “setiap yang bernapas”; dapat juga diterjemahkan “setiap makhluk yang bernapas”.'
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Namun
  rationale: Dalam konteks ini רַק menandai pengecualian yang berlawanan dengan ketentuan sebelumnya mengenai kota-kota yang jauh; “Namun” menyatakan peralihan kontras itu secara alami.
- source_word: מֵעָרֵי הָעַמִּים הָאֵלֶּה
  choice: di kota-kota bangsa-bangsa ini
  rationale: Walaupun מִן secara harfiah dapat berarti “dari”, dalam susunan ini frasa tersebut menunjuk lingkup kota-kota yang dikecualikan dari aturan sebelumnya. “Di kota-kota” lebih alami dalam bahasa Indonesia dan tidak mengubah cakupannya.
- source_word: הָעַמִּים
  choice: bangsa-bangsa
  rationale: עַמִּים menunjuk kelompok-kelompok etnis atau bangsa; “bangsa-bangsa” merupakan padanan Indonesia yang lazim tanpa harus menyiratkan negara modern.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, untuk mempertahankan nama pribadi yang terdapat dalam teks Ibrani.
- source_word: נֹתֵן לְךָ נַחֲלָה
  choice: berikan kepadamu sebagai milik pusaka
  rationale: Bentuk partisip נֹתֵן menyatakan tindakan pemberian yang sedang berlangsung dalam konteks ini. “Milik pusaka” mempertahankan nuansa tanah warisan perjanjian dalam נַחֲלָה.
- source_word: לֹא תְחַיֶּה
  choice: jangan biarkan ... tetap hidup
  rationale: Bentuk Piel dari חיה di sini bersifat kausatif, yakni membiarkan atau mempertahankan hidup; rumusan ini menyampaikan daya verbal tersebut secara jelas.
- source_word: כָּל נְשָׁמָה
  choice: apa pun yang bernapas
  rationale: Secara konkret frasa ini berarti setiap yang bernapas. Pilihan ini mempertahankan citra napas dalam bahasa Ibrani dan menghindari “jiwa”, yang dapat memberi kesan teologis yang tidak dimaksudkan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian יהוה secara langsung; transliterasi mempertahankan nama itu dan tidak menggantinya dengan sebuah gelar.
- issue: Istilah tanah perjanjian נַחֲלָה
  choice: milik pusaka
  alternative: milik
  rationale: “Milik pusaka” mempertahankan dimensi warisan dalam pemberian tanah kepada Israel, sedangkan “milik” saja akan meratakan nuansa tersebut.
- issue: Cakupan כָּל נְשָׁמָה dalam konteks perang
  choice: apa pun yang bernapas
  alternative: setiap orang
  rationale: Bahasa Ibrani menggunakan ungkapan yang lebih luas dan konkret daripada kata khusus untuk “orang”. Terjemahan tidak mempersempit cakupan yang dibiarkan dalam ungkapan sumber.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. “Milik pusaka” dipakai sebagai istilah Alkitabiah yang masih mudah dipahami, sedangkan susunan “jangan biarkan ... tetap hidup” mempertahankan ketegasan perintah Ibrani tanpa memperhalus atau memperluasnya.
