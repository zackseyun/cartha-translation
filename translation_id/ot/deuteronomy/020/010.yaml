  text: When you draw near to a city to fight against it[a], you shall call out to it for peace.
translation:
  language: id
  text: Apabila engkau mendekati sebuah kota untuk berperang melawannya, tawarkanlah perdamaian kepada kota itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “serukanlah kepadanya mengenai perdamaian”; dapat juga berarti “ajukanlah syarat-syarat perdamaian kepada kota itu.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Apabila
  rationale: Memperkenalkan keadaan yang menjadi dasar prosedur hukum; “apabila” terdengar wajar dan tetap dapat mencakup nuansa temporal-kondisional.
- source_word: תִקְרַב
  choice: engkau mendekati
  rationale: Menyampaikan arti Qal dari קרב secara langsung dan alami dalam bahasa Indonesia.
- source_word: עִיר
  choice: sebuah kota
  rationale: Nomina tunggal tak tentu dalam konteks ketentuan umum.
- source_word: לְהִלָּחֵם עָלֶיהָ
  choice: untuk berperang melawannya
  rationale: Menerjemahkan ungkapan peperangan secara jelas; akhiran feminin merujuk kepada kota dan secara idiomatis dinyatakan dengan “-nya”.
- source_word: וְקָרָאתָ אֵלֶיהָ לְשָׁלוֹם
  choice: tawarkanlah perdamaian kepadanya
  rationale: Dalam konteks sebelum penyerangan, ungkapan ini secara idiomatis berarti menyampaikan tawaran atau syarat perdamaian kepada kota itu; bentuk imperatif Indonesia mencerminkan daya perintah dari konstruksi Ibrani.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kata ganti tunggal “engkau” mempertahankan sapaan orang kedua tunggal dalam teks Ibrani. Terjemahan utama memakai ungkapan idiomatis “tawarkanlah perdamaian,” sedangkan bentuk yang lebih harfiah dan kemungkinan nuansa syarat perdamaian dicatat dalam catatan kaki.
