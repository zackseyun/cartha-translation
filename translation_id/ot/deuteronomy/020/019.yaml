language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: כִּֽי תָצ֣וּר אֶל עִיר֩ יָמִ֨ים רַבִּ֜ים לְֽ/הִלָּחֵ֧ם עָלֶ֣י/הָ לְ/תָפְשָׂ֗/הּ לֹֽא תַשְׁחִ֤ית אֶת עֵצָ/הּ֙ לִ/נְדֹּ֤חַ עָלָי/ו֙ גַּרְזֶ֔ן כִּ֚י מִמֶּ֣/נּוּ תֹאכֵ֔ל וְ/אֹת֖/וֹ לֹ֣א תִכְרֹ֑ת כִּ֤י הָֽ/אָדָם֙ עֵ֣ץ הַ/שָּׂדֶ֔ה לָ/בֹ֥א מִ/פָּנֶ֖י/ךָ בַּ/מָּצֽוֹר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/019.yaml
  text: When you besiege a city for many days[a], fighting against it to capture it, you shall not destroy its trees by swinging an axe against them, for you may eat from them, and you shall not cut them down. For is the tree of the field a man, that it should come before you in the siege?
translation:
  language: id
  text: Apabila kamu mengepung sebuah kota selama berhari-hari untuk memeranginya dan merebutnya, janganlah kamu merusak pohon-pohonnya dengan mengayunkan kapak ke arah pohon-pohon itu. Sebab, kamu dapat makan darinya; janganlah kamu menebangnya. Sebab, apakah pohon di ladang itu manusia, sehingga ia datang menghadapi kamu dalam pengepungan?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “sebab manusia adalah pohon di ladang,” atau, “sebab pohon di ladang adalah makanan manusia.” Klausa terakhir dalam bahasa Ibrani sulit ditafsirkan. Teks utama memahaminya sebagai pertanyaan retoris yang membedakan pohon dari musuh manusia.
    reason: alternative_reading
lexical_decisions:
- source_word: תָצוּר
  choice: mengepung
  rationale: Kata ini dalam konteks peperangan berarti melakukan pengepungan terhadap sebuah kota; 'mengepung' ringkas dan alami dalam bahasa Indonesia.
- source_word: יָמִים רַבִּים
  choice: selama berhari-hari
  rationale: Ungkapan ini secara harfiah berarti 'banyak hari' dan dalam konteks menunjukkan pengepungan yang berlangsung lama.
- source_word: לְהִלָּחֵם עָלֶיהָ לְתָפְשָׂהּ
  choice: untuk memeranginya dan merebutnya
  rationale: Terjemahan ini mempertahankan tujuan tindakan militer, yaitu berperang melawan kota itu untuk menguasainya.
- source_word: לֹא תַשְׁחִית אֶת עֵצָהּ
  choice: janganlah kamu merusak pohon-pohonnya
  rationale: Bentuk Hifil dari שׁחת menyatakan tindakan merusak atau membinasakan; 'merusak' sesuai dengan tindakan menggunakan kapak yang kemudian dijelaskan.
- source_word: לִנְדֹּחַ עָלָיו גַּרְזֶן
  choice: dengan mengayunkan kapak terhadapnya
  rationale: Ungkapan Ibrani menggambarkan penggunaan kapak terhadap pohon. Bentuk tunggal 'terhadapnya' mempertahankan peralihan sumber dari kelompok pohon kepada pohon sebagai satu jenis atau satu objek representatif.
- source_word: כִּי מִמֶּנּוּ תֹאכֵל
  choice: Kamu boleh memakan buahnya
  rationale: Objek yang dimakan dari pohon secara wajar dinyatakan sebagai buahnya dalam bahasa Indonesia; 'boleh' cocok dengan alasan praktis untuk membiarkan pohon itu tetap hidup.
- source_word: וְאֹתוֹ לֹא תִכְרֹת
  choice: tetapi jangan menebangnya
  rationale: כרת adalah verba lazim untuk menebang pohon. Konjungsi diterjemahkan 'tetapi' untuk menyampaikan pertentangan alami antara memakan hasil pohon dan menebang pohon tersebut.
- source_word: הָאָדָם עֵץ הַשָּׂדֶה
  choice: apakah pohon di ladang itu manusia
  rationale: Susunan ini dipahami sebagai pertanyaan retoris yang membedakan pohon dari lawan manusia, sambil mempertahankan ambiguitas teks melalui catatan kaki.
- source_word: לָבֹא מִפָּנֶיךָ בַּמָּצוֹר
  choice: sehingga harus menghadapi kamu dalam pengepungan
  rationale: '''Menghadapi kamu'' menyampaikan gagasan datang atau tampil di hadapan pasukan pengepung tanpa menambahkan bahwa pohon itu bertempur secara eksplisit.'
theological_decisions:
- issue: Penafsiran klausa sulit כִּי הָאָדָם עֵץ הַשָּׂדֶה לָבֹא מִפָּנֶיךָ בַּמָּצוֹר
  choice: Pertanyaan retoris yang membedakan pohon di ladang dari musuh manusia.
  alternative: Pernyataan 'sebab manusia adalah pohon di ladang' atau penafsiran bahwa pohon di ladang merupakan makanan manusia.
  rationale: Sintaksis Ibrani memungkinkan lebih dari satu pemahaman. Pertanyaan retoris cocok dengan konteks pengepungan dan larangan menghancurkan pohon, tetapi alternatif yang sungguh-sungguh ada tetap dicatat agar ketegangan teks tidak diselesaikan secara diam-diam.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang bermartabat. Bentuk 'janganlah' mempertahankan daya larangan, sedangkan struktur kalimat dibuat alami bagi pembaca umum. Penanda catatan kaki [a] ditempatkan sesudah seluruh klausa sulit yang dijelaskannya.
