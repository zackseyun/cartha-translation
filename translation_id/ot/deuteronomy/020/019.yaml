revisions:
- from: Apabila kamu mengepung sebuah kota selama berhari-hari untuk memeranginya dan merebutnya, janganlah kamu merusak pohon-pohonnya dengan mengayunkan kapak terhadapnya. Kamu boleh memakan buahnya, tetapi jangan menebangnya. Sebab, apakah pohon di ladang itu manusia sehingga harus menghadapi kamu dalam pengepungan?[a]
  to: Apabila kamu mengepung sebuah kota selama berhari-hari untuk memeranginya dan merebutnya, janganlah kamu merusak pohon-pohonnya dengan mengayunkan kapak ke arah pohon-pohon itu. Sebab, kamu dapat makan darinya; janganlah kamu menebangnya. Sebab, apakah pohon di ladang itu manusia, sehingga ia datang menghadapi kamu dalam pengepungan?[a]
  rationale: Revisi menghapus penambahan “buah” dan modalitas “harus,” memperjelas rujukan kepada pohon-pohon, serta mempertahankan ambiguitas sintaktis klausa akhir melalui catatan kaki. Pembacaan retoris utama dan makna keseluruhan tetap tidak berubah.
