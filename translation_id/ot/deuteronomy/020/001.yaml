base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/001.yaml
  text: When you go out to battle against your enemies and see horses and chariots[a], a people more numerous than you, do not fear them, for Yahweh your God is with you[c][b], who brought you up from the land of Egypt.
translation:
  language: id
  text: Ketika engkau maju berperang melawan musuh-musuhmu dan melihat kuda serta kereta perang[a], dan suatu bangsa yang jumlahnya lebih banyak daripada engkau[b], janganlah takut kepada mereka, sebab Yahweh, Allahmu, menyertai engkau—Dialah yang membawa engkau keluar dari tanah Mesir.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kuda dan kereta”; bentuk tunggal dalam bahasa Ibrani kemungkinan dipakai secara kolektif untuk kekuatan militer.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “suatu bangsa yang lebih besar daripada engkau”; dalam konteks ini, ungkapan tersebut kemungkinan menekankan jumlah mereka yang lebih banyak.
    reason: lexical_alternative
  - marker: c
    text: Secara harfiah, “yang membawa engkau naik dari tanah Mesir.” Ungkapan ini menggemakan peristiwa keluaran sebagai dasar keyakinan Israel.
    reason: cross_reference
lexical_decisions:
- source_word: כִּי תֵצֵא לַמִּלְחָמָה
  choice: Apabila engkau maju berperang
  rationale: כִּי memperkenalkan keadaan yang diperkirakan akan terjadi, sedangkan idiom יצא למלחמה berarti maju atau pergi untuk berperang. “Apabila” dan “maju berperang” menyampaikan fungsi itu secara alami.
- source_word: עַל אֹיְבֶיךָ
  choice: melawan musuh-musuhmu
  rationale: עַל dalam konteks tindakan bermusuhan berarti “melawan”; bentuk jamak dan sufiks orang kedua tunggal dipertahankan.
- source_word: סוּס וָרֶכֶב
  choice: kuda serta kereta perang
  rationale: Kedua nomina Ibrani berbentuk tunggal tetapi kemungkinan besar bersifat kolektif. “Kereta perang” memperjelas arti רֶכֶב dalam konteks militer tanpa mempersempit “kuda” menjadi pasukan berkuda saja.
- source_word: עַם רַב מִמְּךָ
  choice: suatu bangsa yang lebih besar jumlahnya daripada engkau
  rationale: רַב dengan perbandingan מִן terutama menunjukkan keunggulan jumlah. Ungkapan ini tetap menyebut “bangsa”, bukan menafsirkannya langsung sebagai “pasukan”.
- source_word: לֹא תִירָא מֵהֶם
  choice: janganlah takut kepada mereka
  rationale: Bentuk imperfek dalam wacana petunjuk berfungsi sebagai larangan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: אֱלֹהֶיךָ עִמָּךְ
  choice: Allahmu, menyertai engkau
  rationale: Terjemahan ini menyampaikan kehadiran Allah bersama umat-Nya dan mempertahankan sapaan orang kedua tunggal.
- source_word: הַמַּעַלְךָ מֵאֶרֶץ מִצְרָיִם
  choice: Dialah yang membawa engkau naik dari negeri Mesir
  rationale: Partisip berartikel menunjuk kepada Yahweh sebagai pelaku. “Membawa ... naik” mempertahankan verba עָלָה dan gema peristiwa keluaran.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian secara langsung; bentuk “Yahweh” mempertahankannya sebagai nama pribadi tanpa menggantinya dengan gelar.
- issue: Dasar keberanian Israel
  choice: Kehadiran Yahweh dan tindakan-Nya membawa Israel naik dari Mesir dinyatakan tanpa tambahan penafsiran
  alternative: Menguraikannya sebagai jaminan kemenangan mutlak dalam setiap perang
  rationale: Ayat mendasarkan larangan takut pada kehadiran Yahweh dan peristiwa keluaran, tetapi tidak perlu diperluas dengan kesimpulan teologis yang tidak dinyatakan dalam ayat ini.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti “engkau” mempertahankan bentuk orang kedua tunggal Ibrani yang menyapa Israel secara kolektif. Kalimat kedua dipisahkan demi kejelasan hubungan antara kehadiran Yahweh dan karya-Nya dalam peristiwa keluaran.
