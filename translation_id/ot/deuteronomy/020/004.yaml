base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/004.yaml
  text: For Yahweh your God is the one who goes with you to fight for you against your enemies[a], to save you.
translation:
  language: id
  text: Sebab Yahweh, Allah kalian, adalah Dia yang menyertai kalian untuk berperang demi kalian melawan musuh-musuh kalian dan menyelamatkan kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “melepaskan kalian” atau “memberi kalian kemenangan.” Kata kerja Ibrani ini dapat berarti menyelamatkan atau melepaskan, dan di sini dipakai dalam konteks peperangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan dasar bagi dorongan pada ayat sebelumnya; “Sebab” mempertahankan fungsi penjelasannya secara alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi YHWH ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: אֱלֹהֵיכֶם
  choice: Allahmu
  rationale: Bentuk konstruksi dengan sufiks orang kedua jamak; dalam sapaan kepada Israel, bentuk Indonesia “Allahmu” dapat merujuk kepada umat secara kolektif.
- source_word: הַהֹלֵךְ
  choice: Dialah yang berjalan
  rationale: Partisipel memberi nuansa deskriptif atau berkelanjutan. Susunan ini mempertahankan penekanan bahwa Yahweh adalah Dia yang menyertai umat dalam perjalanan menuju pertempuran.
- source_word: עִמָּכֶם
  choice: menyertai kamu
  rationale: Secara harfiah berarti “dengan kamu”; “menyertai kamu” mengungkapkan kehadiran dan pendampingan ilahi dengan wajar.
- source_word: לְהִלָּחֵם
  choice: untuk berperang
  rationale: Dalam konteks perang, verba ini berarti bertempur atau berperang; “berperang” sesuai dengan situasi militer ayat ini.
- source_word: לָכֶם
  choice: bagimu
  rationale: Datif keuntungan menunjukkan bahwa Yahweh berperang demi atau untuk kepentingan Israel.
- source_word: עִם אֹיְבֵיכֶם
  choice: melawan musuh-musuhmu
  rationale: Walaupun עִם biasanya berarti “dengan”, sesudah verba berperang frasa ini menyatakan pihak lawan.
- source_word: לְהוֹשִׁיעַ
  choice: menyelamatkan
  rationale: Bentuk Hifil dari ישׁע mencakup menyelamatkan atau melepaskan; dalam konteks ini juga dapat menyiratkan pemberian kemenangan.
- source_word: אֶתְכֶם
  choice: kamu
  rationale: Penanda objek langsung dengan sufiks orang kedua jamak, diterjemahkan sebagai objek “kamu”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai nama perjanjian YHWH secara langsung; transliterasi “Yahweh” mempertahankan nama pribadi itu tanpa menggantinya dengan gelar.
- issue: Cakupan לְהוֹשִׁיעַ dalam konteks peperangan
  choice: menyelamatkan kamu
  alternative: melepaskan kamu; memberi kamu kemenangan
  rationale: “Menyelamatkan” mempertahankan jangkauan semantis dan resonansi teologis verba tersebut, sedangkan konteks perang tetap memungkinkan nuansa pelepasan atau kemenangan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Dialah yang berjalan menyertai kamu” mempertahankan penekanan partisipel Ibrani tanpa terdengar terlalu harfiah. Bentuk tunggal “-mu” memperlakukan Israel sebagai umat kolektif, sedangkan “kamu” tetap dapat dibaca secara jamak dari konteks.
