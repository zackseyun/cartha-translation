base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/005.yaml
  text: Then the officers shall speak to the people[a], saying, ‘Who is the man who has built a new house and has not dedicated it? Let him go and return to his house, lest he die in the battle and another man dedicate it.’
translation:
  language: id
  text: Kemudian para petugas harus berkata kepada rakyat, “Laki-laki manakah yang telah membangun rumah baru tetapi belum meresmikannya[a]? Biarlah ia pergi dan pulang ke rumahnya, agar ia tidak mati dalam pertempuran dan rumah itu diresmikan oleh laki-laki lain.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “mulai menggunakannya secara resmi.” Kata Ibrani ini menunjuk pada permulaan resmi penggunaan rumah baru dan sering kali bernuansa peresmian.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֹּׁטְרִים
  choice: para petugas
  rationale: Dalam konteks administratif dan militer Ulangan, kata ini menunjuk kepada pejabat pelaksana yang ditunjuk. “Para petugas” alami dalam bahasa Indonesia dan tidak mempersempit jabatan mereka secara berlebihan.
- source_word: הָעָם
  choice: rakyat
  rationale: Secara harfiah berarti “rakyat/bangsa itu.” Dalam konteks ini mereka adalah orang-orang yang berkumpul untuk berperang, tetapi “rakyat” mempertahankan cakupan istilah Ibrani tanpa mengubahnya menjadi “pasukan.”
- source_word: מִי הָאִישׁ
  choice: Siapakah di antara kalian
  rationale: Rumusan ini menyampaikan pertanyaan kepada kelompok yang hadir secara alami dalam bahasa Indonesia. Konteks ayat secara jelas membatasi orang yang dimaksud pada laki-laki yang wajib berperang, sehingga tidak perlu menambahkan kata “laki-laki” secara kaku.
- source_word: בָּנָה בַיִת חָדָשׁ
  choice: telah membangun rumah baru
  rationale: “Rumah” merupakan padanan langsung בַּיִת, sedangkan aspek perfektif tindakan diterjemahkan dengan “telah membangun.”
- source_word: וְלֹא חֲנָכוֹ
  choice: tetapi belum meresmikannya
  rationale: Dalam konteks rumah, חנך menunjuk pada peresmian atau permulaan resmi pemakaiannya. “Meresmikan” lebih alami dan netral daripada “menahbiskan,” yang dalam bahasa Indonesia dapat memberi kesan ritual keagamaan khusus.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: Biarlah ia pergi dan pulang ke rumahnya
  rationale: Bentuk imperfek di sini mempunyai daya instruksional atau yusif. “Biarlah” mempertahankan nuansa perintah yang mengizinkan orang itu meninggalkan barisan.
- source_word: פֶּן
  choice: supaya jangan
  rationale: Ungkapan ini secara alami menyampaikan nuansa pencegahan dari פֶּן dalam bahasa Indonesia modern.
- source_word: יָמוּת בַּמִּלְחָמָה
  choice: ia mati dalam pertempuran
  rationale: “Pertempuran” mempertahankan situasi militer konkret dan artikel tertentu pada frasa Ibrani sesuai konteks.
- source_word: וְאִישׁ אַחֵר
  choice: orang lain
  rationale: Bahasa Indonesia lazim memakai “orang lain” untuk kontras individual ini. Konteks wajib militer tetap menunjukkan bahwa orang yang dimaksud adalah laki-laki tanpa memerlukan frasa yang kaku.
- source_word: יַחְנְכֶנּוּ
  choice: meresmikan rumah itu
  rationale: Pengulangan “meresmikan” mempertahankan pengulangan akar חנך. “Rumah itu” dipakai menggantikan pronomina agar rujukannya jelas dan alami.
