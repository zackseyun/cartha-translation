revisions:
- from: Kemudian para petugas harus berbicara kepada rakyat, dengan berkata, “Siapakah di antara kalian yang telah membangun rumah baru, tetapi belum meresmikannya[a]? Biarlah ia pergi dan pulang ke rumahnya, supaya jangan ia mati dalam pertempuran lalu orang lain meresmikan rumah itu.”
  to: Kemudian para petugas harus berkata kepada rakyat, “Laki-laki manakah yang telah membangun rumah baru tetapi belum meresmikannya[a]? Biarlah ia pergi dan pulang ke rumahnya, agar ia tidak mati dalam pertempuran dan rumah itu diresmikan oleh laki-laki lain.”
  rationale: Revisi memulihkan rujukan eksplisit kepada laki-laki pada מִי הָאִישׁ dan אִישׁ אַחֵר, menghindari tambahan sapaan “kalian,” serta memperjelas bahwa kematian dan peresmian oleh orang lain merupakan hasil yang hendak dicegah. Istilah “meresmikan” dan pengulangannya dipertahankan untuk mencerminkan akar Ibrani yang sama.
