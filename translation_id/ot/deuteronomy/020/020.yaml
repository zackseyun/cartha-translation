  text: רַ֞ק עֵ֣ץ אֲשֶׁר תֵּדַ֗ע כִּֽי לֹא עֵ֤ץ מַאֲכָל֙ ה֔וּא אֹת֥/וֹ תַשְׁחִ֖ית וְ/כָרָ֑תָּ וּ/בָנִ֣יתָ מָצ֗וֹר עַל הָ/עִיר֙ אֲשֶׁר הִ֨וא עֹשָׂ֧ה עִמְּ/ךָ֛ מִלְחָמָ֖ה עַ֥ד רִדְתָּֽ/הּ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/020.yaml
  text: Only the trees that you know are not trees for food[a], those you may destroy and cut down, and build siegeworks against the city that is making war with you[b], until you bring it down.
translation:
  language: id
  text: Hanya pohon yang kamu ketahui tidak menghasilkan makanan boleh kamu hancurkan dan tebang, dan membangun sarana pengepungan[a] terhadap kota yang berperang melawanmu, hingga kamu menjatuhkan kota itu[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “membangun kubu pengepungan” atau “membangun tanggul pengepungan.” Kata Ibrani מָצוֹר dapat menunjuk secara luas pada sarana atau bangunan pengepungan, bukan hanya satu jenis struktur.
    reason: lexical_alternative
  - marker: b
    text: Atau “hingga kamu membuatnya jatuh.” Kata Ibrani memakai verba yang secara harfiah menggambarkan tindakan menyebabkan kota itu turun atau jatuh.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Hanya
  rationale: Mempertahankan daya pembatas yang menandai pengecualian terhadap larangan menebang pohon penghasil makanan pada ayat sebelumnya.
- source_word: עֵץ ... עֵץ מַאֲכָל
  choice: pohon ... pohon penghasil makanan
  rationale: Dalam konteks ini עֵץ menunjuk pada pohon hidup, sedangkan עֵץ מַאֲכָל berarti pohon yang menghasilkan bahan makanan. Ungkapan ini jelas dan wajar dalam bahasa Indonesia.
- source_word: אֲשֶׁר תֵּדַע כִּי לֹא ... הוּא
  choice: yang kamu ketahui bukan
  rationale: Menyampaikan bahwa status pohon tersebut diketahui atau dipastikan, sambil mengikuti pemakaian bentuk tunggal Ibrani secara distributif.
- source_word: אֹתוֹ תַשְׁחִית וְכָרָתָּ
  choice: boleh kamu rusak dan tebang
  rationale: Bentuk hukum dalam konteks ini memberikan izin, bukan perintah untuk menebang setiap pohon yang tidak menghasilkan makanan. Kedua verba dipertahankan.
- source_word: וּבָנִיתָ מָצוֹר
  choice: membangun sarana pengepungan
  rationale: מָצוֹר dapat menunjuk secara luas pada bangunan atau perlengkapan untuk mengepung kota; 'sarana pengepungan' tidak membatasi maknanya pada satu jenis struktur tertentu.
- source_word: עַל הָעִיר
  choice: terhadap kota
  rationale: Mengungkapkan arah tindakan militer secara alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר הִוא עֹשָׂה עִמְּךָ מִלְחָמָה
  choice: yang berperang melawanmu
  rationale: Merupakan padanan idiomatis dan jelas bagi ungkapan Ibrani 'melakukan perang denganmu', serta mempertahankan aspek tindakan yang sedang berlangsung.
- source_word: עַד רִדְתָּהּ
  choice: sampai kota itu jatuh
  rationale: Secara harfiah frasa ini menggambarkan 'turunnya' kota, yakni kejatuhannya dalam pengepungan. Terjemahan ini mempertahankan citra dasar tanpa menambahkan gagasan teologis atau militer yang lebih khusus.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Kalimat dipecah menjadi dua agar mudah dipahami. Pengulangan 'pohon-pohon itu' memperjelas bahwa kayu dari pohon yang diizinkan untuk ditebang digunakan bagi sarana pengepungan. Semua penanda catatan kaki muncul pada bagian teks yang tepat.
