base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/017.yaml
  text: Instead[a], you must utterly destroy them—the Hittites, the Amorites, the Canaanites, the Perizzites, the Hivites, and the Jebusites—as Yahweh your God has commanded you.
translation:
  language: id
  text: Sebaliknya, kamu harus menumpas mereka sama sekali[a]—orang Het, orang Amori, orang Kanaan, orang Feris, orang Hewi, dan orang Yebus—sebagaimana diperintahkan Yahweh, Allahmu, kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Teks Ibrani memakai bentuk penegas yang secara harfiah berarti, “kamu harus sungguh-sungguh mengkhususkan mereka untuk dimusnahkan.” Istilah teknis herem menunjuk pada penyerahan sepenuhnya kepada pemusnahan berdasarkan perintah Allah.
    reason: Menjelaskan daya penegas konstruksi הַחֲרֵם תַּחֲרִימֵם serta nuansa teknis חרם tanpa menyajikan parafrasa yang tidak tepat sebagai terjemahan harfiah.
lexical_decisions:
- source_word: כִּי
  choice: Sebaliknya
  rationale: Dalam konteks, konjungsi ini mempertentangkan perintah tersebut dengan ketentuan pada ayat sebelumnya untuk membiarkan hidup penduduk kota-kota yang jauh.
- source_word: הַחֲרֵם תַּחֲרִימֵם
  choice: kamu harus menumpas mereka sama sekali
  rationale: Gabungan infinitif absolut dan verba finit menegaskan totalitas perintah. 'Menumpas ... sama sekali' merupakan ungkapan Indonesia yang alami dan kuat, sedangkan nuansa teknis חרם dijelaskan dalam catatan kaki.
- source_word: הַחִתִּי וְהָאֱמֹרִי הַכְּנַעֲנִי וְהַפְּרִזִּי הַחִוִּי וְהַיְבוּסִי
  choice: orang Het, orang Amori, orang Kanaan, orang Feris, orang Hewi, dan orang Yebus
  rationale: Nama-nama bangsa memakai bentuk Indonesia yang lazim dalam tradisi penerjemahan Alkitab; bentuk tunggal kolektif Ibrani diungkapkan secara alami dengan 'orang'.
- source_word: כַּאֲשֶׁר צִוְּךָ
  choice: seperti yang diperintahkan ... kepadamu
  rationale: Menyampaikan hubungan komparatif dan perintah ilahi sebelumnya yang tetap mengikat, dengan susunan Indonesia yang alami.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Allahmu
  rationale: Nama ilahi dipertahankan sebagai Yahweh, dan ungkapan perjanjian 'Allahmu' diterjemahkan langsung.
theological_decisions:
- issue: Makna חרם dalam perintah perang
  choice: menumpas mereka sama sekali
  alternative: mengkhususkan mereka sepenuhnya untuk dimusnahkan; menempatkan mereka di bawah larangan pemusnahan
  rationale: Teks utama menyampaikan tindakan pemusnahan total secara jelas dan alami. Catatan kaki mempertahankan dimensi teknis-religius חרם, yakni penyerahan di bawah ketetapan khusus untuk dimusnahkan, tanpa memperlunak perintah.
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Transliterasi mempertahankan nama pribadi ilahi dalam sumber Ibrani dan tidak menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, lugas, dan bermartabat. 'Menumpas ... sama sekali' dipilih agar perintah keras dalam teks tidak diperhalus, sementara tanda pisah membantu memperjelas daftar bangsa.
