base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/011.yaml
  text: And if it answers you with peace and opens to you[b][a], then all the people found in it shall become forced labor for you and shall serve you.
translation:
  language: id
  text: Jika kota itu menjawabmu dengan damai[a] dan membuka diri kepadamu, semua orang yang terdapat di dalamnya akan menjadi pekerja paksa bagimu[b] dan melayanimu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menjawabmu dengan menyetujui syarat-syarat damai.”
    reason: lexical_alternative
  - marker: b
    text: Atau, frasa ini dapat dipahami sebagai “akan membayar upeti kepadamu.” Kata Ibrani מַס dapat berarti pungutan, upeti, atau kerja wajib/kerja paksa; dalam konteks ini, karena diikuti “dan melayanimu,” makna kerja paksa paling sesuai.
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: dengan damai
  rationale: Kata benda ini berarti ‘damai’ atau ‘kesejahteraan’. Dalam konteks tawaran sebelum penyerangan, frasa ini menyatakan tanggapan damai tanpa menghilangkan istilah Ibraninya.
- source_word: תַּעַנְךָ
  choice: menjawabmu
  rationale: Kata kerja ענה berarti ‘menjawab’ atau ‘menanggapi’. Subjek feminin tunggalnya mengacu pada kota; ‘kota itu’ dinyatakan agar rujukannya jelas dan alami dalam bahasa Indonesia.
- source_word: וּפָתְחָה לָךְ
  choice: membuka diri bagimu
  rationale: Teks Ibrani hanya menyebut ‘membuka’, tanpa menyatakan ‘pintu gerbang’. ‘Membuka diri bagimu’ mempertahankan ketidakspesifikan itu dalam ungkapan Indonesia yang wajar.
- source_word: הָעָם הַנִּמְצָא בָהּ
  choice: seluruh rakyat yang terdapat di dalamnya
  rationale: נמצא secara harfiah berarti ‘didapati/terdapat’. Pilihan ini mempertahankan bentuk partisipialnya dan mencakup semua penduduk yang berada di kota tersebut.
- source_word: לָמַס
  choice: menjadi pekerja paksa bagimu
  rationale: מַס dapat menunjuk pada pungutan, upeti, kerja rodi, atau tenaga kerja wajib. Dalam kaitannya dengan klausa berikutnya, konteks mendukung kewajiban kerja paksa, tetapi kemungkinan makna upeti tetap dicatat.
- source_word: וַעֲבָדוּךָ
  choice: dan melayanimu
  rationale: עבד berarti ‘bekerja’ atau ‘melayani’. ‘Melayanimu’ mempertahankan hubungan ketundukan tanpa menentukan lembaga sosial yang lebih khusus daripada teks.
theological_decisions:
- issue: Bahasa penaklukan dalam hukum perang
  choice: 'Mempertahankan arti lugas berupa kerja yang dipaksakan: ‘menjadi pekerja paksa bagimu dan melayanimu’.'
  alternative: ‘harus membayar upeti kepadamu dan melayanimu’ atau ‘harus tunduk kepadamu sebagai tenaga kerja wajib’
  rationale: Ayat ini menyatakan akibat bagi kota yang menerima tawaran damai dalam konteks hukum perang kuno. Terjemahan tidak melunakkan unsur pemaksaan dalam מַס, tetapi juga tidak mempersempitnya menjadi bentuk perbudakan tertentu yang tidak disebutkan secara eksplisit.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Pronomina terikat ‘-mu’ dipakai agar langsung dan ringkas. ‘Pekerja paksa’ dipilih karena mudah dipahami pembaca umum; ‘kerja rodi’ dicantumkan hanya dalam catatan kaki karena lebih bersifat historis.
