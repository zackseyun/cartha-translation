  terminology: “Pekerja paksa” secara jelas menyampaikan daya paksa מַס dan “melayanimu” cocok untuk עבד. Catatan kaki tentang alternatif upeti perlu dibatasi pada frasa yang ditandai dan tidak mengubahnya menjadi gabungan “membayar upeti dan bekerja,” sebab klausa pelayanan sudah hadir secara terpisah dalam teks.
