  text: לְמַ֗עַן אֲשֶׁ֨ר לֹֽא יְלַמְּד֤וּ אֶתְ/כֶם֙ לַ/עֲשׂ֔וֹת כְּ/כֹל֙ תּֽוֹעֲבֹתָ֔/ם אֲשֶׁ֥ר עָשׂ֖וּ לֵֽ/אלֹהֵי/הֶ֑ם וַ/חֲטָאתֶ֖ם לַ/יהוָ֥ה אֱלֹהֵי/כֶֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/018.yaml
  text: so that they may not teach you to do according to all their abominations that they have done for their gods[a], and you would sin against Yahweh your God.
translation:
  language: id
  text: supaya mereka tidak mengajari kalian melakukan segala perbuatan keji yang mereka lakukan bagi ilah-ilah mereka,[a] sehingga kalian berdosa terhadap Yahweh, Allah kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kepada ilah-ilah mereka.”
    reason: Preposisi ל dapat diterjemahkan sebagai tindakan yang dilakukan “bagi” para ilah atau diarahkan “kepada” mereka.
lexical_decisions:
- source_word: לְמַעַן אֲשֶׁר
  choice: supaya
  rationale: Menandai tujuan atau hasil yang hendak dicegah; “supaya” alami dalam bahasa Indonesia dan mempertahankan daya purposif klausa.
- source_word: לֹא יְלַמְּדוּ אֶתְכֶם
  choice: mereka tidak mengajari kalian
  rationale: Bentuk intensif למד dengan negasi menyatakan tindakan mengajar yang hendak dicegah. “Kalian” menyatakan orang kedua jamak secara jelas.
- source_word: לַעֲשׂוֹת כְּכֹל תּוֹעֲבֹתָם
  choice: melakukan segala perbuatan keji
  rationale: עשה berarti melakukan, sedangkan תועבה adalah istilah moral-keagamaan yang kuat. “Segala perbuatan keji” menyampaikan keseluruhan praktik yang dipandang menjijikkan tanpa terdengar terlalu arkais.
- source_word: אֲשֶׁר עָשׂוּ
  choice: yang mereka lakukan
  rationale: Klausa relatif ini menjelaskan perbuatan keji tersebut secara langsung dan wajar dalam bahasa Indonesia.
- source_word: לֵאלֹהֵיהֶם
  choice: bagi ilah-ilah mereka
  rationale: Preposisi ל dapat menunjukkan arah atau pihak yang menjadi sasaran tindakan ibadah. “Bagi” sesuai untuk tindakan kultis yang dilakukan demi penghormatan kepada ilah-ilah itu; “kepada” tetap mungkin.
- source_word: וַחֲטָאתֶם
  choice: dan kalian pun berdosa
  rationale: Waw dengan bentuk perfektum melanjutkan akibat yang hendak dicegah. Partikel “pun” membuat hubungan akibat terasa alami tanpa mengubahnya menjadi pernyataan kepastian yang terlepas dari klausa tujuan.
- source_word: לַיהוָה אֱלֹהֵיכֶם
  choice: terhadap Yahweh, Allah kalian
  rationale: Dengan חטא, ל menunjuk pihak yang terhadap-Nya dosa dilakukan. Nama perjanjian יהוה ditransliterasikan “Yahweh”, sedangkan אֱלֹהֵיכֶם menjadi “Allah kalian” sebagai aposisi.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri perjanjian יהוה. “Yahweh” mempertahankannya sebagai nama dan tidak menggantinya dengan gelar.
- issue: Hubungan klausa terakhir dengan tujuan larangan
  choice: dan kalian pun berdosa
  alternative: sehingga kalian berdosa
  rationale: Pilihan utama mempertahankan penghubung Ibrani yang sederhana sekaligus membiarkan nuansa akibat tetap terasa; alternatif menjadikan hubungan hasil lebih eksplisit daripada bentuk sumber.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kalian” dipakai untuk menandai sapaan jamak Ibrani; “ilah-ilah” membedakan dewa-dewa bangsa-bangsa dari sebutan “Allah” bagi Yahweh. Istilah “perbuatan keji” dipilih sebagai ungkapan yang kuat tetapi tetap mudah dipahami.
