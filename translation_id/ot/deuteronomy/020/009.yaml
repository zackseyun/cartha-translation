  text: And when the officers have finished speaking to the people[a], they shall appoint commanders of armies at the head of the people.
translation:
  language: id
  text: Setelah para petugas selesai berbicara kepada rakyat, mereka harus mengangkat para panglima pasukan sebagai pemimpin rakyat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “mereka harus mengerahkan para panglima pasukan sebagai pemimpin rakyat.” Kata kerja Ibraninya dapat berarti mengangkat, mengerahkan, atau menempatkan seseorang sebagai pemimpin, bergantung pada konteks.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כְּכַלֹּת
  choice: Setelah ... selesai
  rationale: Rangkaian וְהָיָה dengan כְּ dan infinitif menyatakan waktu sesudah suatu tindakan selesai; bentuk ini alami dalam bahasa Indonesia dan tetap menunjukkan bahwa tindakan berikutnya terjadi setelah para petugas selesai berbicara.
- source_word: הַשֹּׁטְרִים
  choice: para petugas
  rationale: Dalam konteks Ulangan, istilah ini menunjuk para pejabat pelaksana yang mengatur dan menyampaikan ketentuan kepada rakyat. 'Petugas' mudah dipahami dan tidak mempersempit maknanya menjadi juru tulis.
- source_word: לְדַבֵּר אֶל־הָעָם
  choice: berbicara kepada rakyat
  rationale: Terjemahan langsung ini mempertahankan עָם sebagai 'rakyat' dan tidak mempersempitnya menjadi 'pasukan', meskipun konteksnya bersifat militer.
- source_word: וּפָקְדוּ
  choice: mereka harus mengangkat
  rationale: Dalam konstruksi ini פקד paling mungkin berarti menunjuk atau menetapkan seseorang dalam jabatan. 'Mengangkat' wajar dalam bahasa Indonesia untuk penetapan pemimpin, sementara kemungkinan nuansa 'mengatur/mengerahkan' dicatat dalam catatan kaki.
- source_word: שָׂרֵי צְבָאוֹת
  choice: para panglima pasukan
  rationale: שָׂרֵי menunjuk para pemimpin atau panglima, sedangkan צְבָאוֹת menunjuk pasukan-pasukan militer. Frasa ini ringkas, jelas, dan sesuai konteks.
- source_word: בְּרֹאשׁ הָעָם
  choice: untuk memimpin rakyat
  rationale: Secara harfiah frasa ini berarti 'di kepala rakyat'; sebagai idiom, frasa itu menyatakan kedudukan di depan atau sebagai pemimpin. Terjemahan ini menyampaikan fungsi idiom secara alami.
