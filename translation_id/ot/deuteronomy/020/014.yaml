source:
  edition: WLC
  text: רַ֣ק הַ֠/נָּשִׁים וְ/הַ/טַּ֨ף וְ/הַ/בְּהֵמָ֜ה וְ/כֹל֩ אֲשֶׁ֨ר יִהְיֶ֥ה בָ/עִ֛יר כָּל שְׁלָלָ֖/הּ תָּבֹ֣ז לָ֑/ךְ וְ/אָֽכַלְתָּ֙ אֶת שְׁלַ֣ל אֹיְבֶ֔י/ךָ אֲשֶׁ֥ר נָתַ֛ן יְהוָ֥ה אֱלֹהֶ֖י/ךָ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/014.yaml
  text: Only the women[a], the little children, the livestock, and everything that is in the city—all its spoil—you may take as plunder for yourself; and you may eat the spoil of your enemies, which Yahweh your God has given you.
translation:
  language: id
  text: Hanya perempuan, anak-anak kecil, ternak, dan segala sesuatu yang ada di kota itu—seluruh hasil jarahannya—boleh kaurampas untuk dirimu; dan kamu boleh memakan hasil jarahan dari musuh-musuhmu[a] yang telah diberikan Yahweh, Allahmu, kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “memakan hasil jarahan dari musuh-musuhmu.” Kata Ibrani yang dipakai berarti “makan”, tetapi dalam konteks ini dapat pula mencakup memakai atau memanfaatkan apa yang dirampas.
    reason: lexical_alternative
lexical_decisions:
- source_word: רַק
  choice: Hanya saja
  rationale: Menandai pengecualian terhadap perintah sebelumnya sambil mempertahankan daya pembatasnya dalam bahasa Indonesia yang alami.
- source_word: הַנָּשִׁים
  choice: perempuan
  rationale: Padanan langsung untuk bentuk jamak yang secara khusus merujuk kepada kaum perempuan.
- source_word: הַטַּף
  choice: anak-anak kecil
  rationale: טַף lazimnya menunjuk kepada anak-anak yang masih kecil atau anggota keluarga yang menjadi tanggungan; pilihan ini mempertahankan unsur usia muda.
- source_word: הַבְּהֵמָה
  choice: ternak
  rationale: Dalam konteks rampasan perang, istilah ini paling tepat menunjuk kepada hewan peliharaan yang dimiliki manusia.
- source_word: וְכֹל אֲשֶׁר יִהְיֶה בָעִיר
  choice: dan segala sesuatu yang ada di kota itu
  rationale: Mempertahankan cakupan menyeluruh frasa Ibrani dengan susunan Indonesia yang jelas.
- source_word: כָּל שְׁלָלָהּ
  choice: seluruh hasil jarahannya
  rationale: שָׁלָל menunjuk kepada barang atau hasil yang dirampas dalam perang; akhiran posesifnya merujuk kepada kota itu.
- source_word: תָּבֹז לָךְ
  choice: boleh kaurampas untuk dirimu
  rationale: Dalam konteks hukum ini, bentuk verba memberi kewenangan untuk merampas, bukan semata-mata meramalkan tindakan pada masa depan.
- source_word: וְאָכַלְתָּ אֶת שְׁלַל אֹיְבֶיךָ
  choice: Kamu boleh menikmati hasil jarahan dari musuh-musuhmu[a]
  rationale: אָכַל secara harfiah berarti 'makan', tetapi di sini dapat meluas kepada memakai atau memperoleh manfaat dari barang rampasan. 'Menikmati' menyampaikan makna kontekstual itu, sementara catatan kaki mempertahankan arti harfiahnya.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi yang terdapat langsung dalam teks Ibrani.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Padanan baku untuk ungkapan perjanjian dengan akhiran orang kedua tunggal.
- source_word: אֲשֶׁר נָתַן יְהוָה אֱלֹהֶיךָ לָךְ
  choice: yang telah diberikan Yahweh, Allahmu, kepadamu
  rationale: Bentuk perfek Ibrani dipahami sebagai pemberian ilahi yang sudah berlaku dalam hubungannya dengan izin untuk mengambil jarahan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama pribadi perjanjian tanpa menggantinya dengan gelar.
- issue: Daya verba orang kedua dalam petunjuk hukum
  choice: boleh
  alternative: harus atau akan
  rationale: Konteksnya menyatakan tindakan yang diizinkan atas rampasan perang. 'Boleh' mempertahankan nuansa pemberian wewenang tanpa mengubahnya menjadi kewajiban mutlak atau ramalan sederhana.
- issue: Cakupan metaforis אָכַל, 'makan'
  choice: menikmati, dengan arti harfiah dicatat
  alternative: memakan atau memanfaatkan
  rationale: Objeknya adalah seluruh hasil jarahan, bukan hanya makanan. 'Menikmati' memungkinkan arti memperoleh manfaat, sedangkan catatan kaki menjaga ketegangan dengan arti harfiah Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk terikat “kaurampas” menjaga sapaan orang kedua tunggal dalam teks Ibrani; kalimat berikutnya memakai “Kamu” agar tetap jelas dan alami. Tanda pisah menandai aposisi penjelas “seluruh hasil jarahannya”.
