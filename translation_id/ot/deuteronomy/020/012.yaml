  text: וְ/אִם לֹ֤א תַשְׁלִים֙ עִמָּ֔/ךְ וְ/עָשְׂתָ֥ה עִמְּ/ךָ֖ מִלְחָמָ֑ה וְ/צַרְתָּ֖ עָלֶֽי/הָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/012.yaml
  text: But if it does not make peace with you[a], but makes war against you[b], then you shall besiege it.
translation:
  language: id
  text: Tetapi jika kota itu tidak berdamai denganmu, melainkan berperang melawanmu, engkau harus mengepungnya.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם לֹא
  choice: Tetapi jika ... tidak
  rationale: Kata penghubung ini menandai pertentangan dengan hasil damai pada ayat sebelumnya; bentuk ini wajar dalam bahasa Indonesia.
- source_word: תַשְׁלִים עִמָּךְ
  choice: berdamai denganmu
  rationale: Bentuk Hifil dari שׁלם di sini berarti menjalin atau menyepakati hubungan damai. 'Berdamai denganmu' jelas, alami, dan mempertahankan unsur timbal balik yang ditandai עִם.
- source_word: וְעָשְׂתָה עִמְּךָ מִלְחָמָה
  choice: melainkan berperang melawanmu
  rationale: Ungkapan עשה מלחמה berarti melakukan atau melancarkan perang. 'Berperang melawanmu' merupakan padanan Indonesia yang alami; 'melainkan' menyatakan kontras dengan penolakan untuk berdamai.
- source_word: וְצַרְתָּ עָלֶיהָ
  choice: engkau harus mengepungnya
  rationale: צור dengan על berarti mengepung sebuah kota. Dalam konteks hukum-instruksional, 'harus' menyampaikan daya perintah bentuk verba tersebut secara alami.
theological_decisions:
- issue: Rujukan subjek feminin tunggal pada תַשְׁלִים dan וְעָשְׂתָה
  choice: kota itu
  alternative: ia
  rationale: Subjek tersirat merujuk pada kota dalam ayat sebelumnya. Menyebut 'kota itu' menghindari ketidakjelasan dalam bahasa Indonesia tanpa menambahkan penafsiran teologis.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam bermartabat dan lugas. Bentuk 'engkau' dipakai untuk sapaan orang kedua tunggal kolektif kepada Israel, sedangkan enklitik '-mu' menjaga alur kalimat tetap alami.
