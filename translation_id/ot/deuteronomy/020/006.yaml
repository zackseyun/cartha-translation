  text: וּ/מִֽי הָ/אִ֞ישׁ אֲשֶׁר נָטַ֥ע כֶּ֨רֶם֙ וְ/לֹ֣א חִלְּל֔/וֹ יֵלֵ֖ךְ וְ/יָשֹׁ֣ב לְ/בֵית֑/וֹ פֶּן יָמוּת֙ בַּ/מִּלְחָמָ֔ה וְ/אִ֥ישׁ אַחֵ֖ר יְחַלְּלֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/006.yaml
  text: And who is the man who has planted a vineyard and has not yet enjoyed its fruit? Let him go and return to his house[a], lest he die in the battle and another man enjoy its fruit.
translation:
  language: id
  text: Dan siapakah orang yang telah menanam kebun anggur, tetapi belum menikmati hasilnya?[a] Hendaklah ia pergi dan pulang ke rumahnya, agar ia tidak mati dalam pertempuran dan orang lain menikmati hasilnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, lebih harfiah, “belum mulai menggunakannya” atau “belum menggunakannya untuk pertama kali.” Kata kerja Ibrani di sini menunjuk pada mulai menggunakan kebun anggur secara biasa, kemungkinan dengan menikmati hasilnya sesudah tahun-tahun awal ketika buahnya belum boleh dimakan (bandingkan Imamat 19:23–25).
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי הָאִישׁ
  choice: Dan siapakah orang
  rationale: Mempertahankan kata sambung dan rumusan interogatif yang memperkenalkan pengecualian berikutnya bagi seorang laki-laki yang wajib berperang.
- source_word: נָטַע כֶּרֶם
  choice: telah menanam kebun anggur
  rationale: Menyampaikan tindakan yang sudah selesai tetapi masih relevan dengan keadaan orang tersebut; ungkapan ini juga dapat berarti mendirikan atau mulai mengusahakan kebun anggur.
- source_word: וְלֹא חִלְּלוֹ
  choice: tetapi belum menikmati hasilnya
  rationale: Dalam konteks kebun anggur, חלל menunjuk pada mulai memakai atau memperoleh manfaat biasa darinya, kemungkinan dengan menikmati hasil panennya sesudah tahun-tahun pembatasan dalam Imamat 19:23–25. Terjemahan ini alami dalam bahasa Indonesia, sedangkan catatan kaki mempertahankan cakupan leksikal yang lebih harfiah.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: Biarlah ia pergi dan pulang ke rumahnya
  rationale: Bentuk yiqtol berfungsi sebagai arahan atau izin dalam ketentuan militer ini; “Biarlah” menyampaikan daya jussifnya.
- source_word: פֶּן יָמוּת בַּמִּלְחָמָה
  choice: supaya jangan ia mati dalam pertempuran
  rationale: Menerjemahkan פן sebagai peringatan yang menyatakan hal yang hendak dicegah, serta mempertahankan acuan pada pertempuran yang akan dihadapi.
- source_word: וְאִישׁ אַחֵר יְחַלְּלֶנּוּ
  choice: dan orang lain menikmati hasilnya
  rationale: Mempertahankan kesejajaran dengan pemakaian חלל sebelumnya dan menyatakan bahwa orang lainlah yang akan memperoleh manfaat pertama dari kebun itu.
