  text: And when you draw near to the battle[a], the priest shall come forward and speak to the people[b],
translation:
  language: id
  text: Ketika kamu mendekati pertempuran[a], imam akan maju dan berbicara kepada rakyat[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “perang.” Kata Ibrani מִלְחָמָה dapat menunjuk pada perang secara umum atau suatu pertempuran tertentu; konteks mendekati bentrokan langsung mendukung “pertempuran.”
    reason: lexical_alternative
  - marker: b
    text: “Rakyat” di sini merujuk kepada orang Israel yang terhimpun untuk berperang. Namun, teks Ibrani memakai istilah yang lebih luas, “rakyat,” bukan istilah militer yang lebih sempit seperti “pasukan.”
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה
  choice: Ketika
  rationale: Konstruksi וְהָיָה yang diikuti klausa temporal memperkenalkan keadaan yang akan terjadi; dalam bahasa Indonesia, “Ketika” menyampaikan fungsinya secara alami tanpa terjemahan harfiah yang kaku.
- source_word: כְּקָרָבְכֶם
  choice: kamu mendekati
  rationale: Infinitif konstruk dari קרב dengan akhiran orang kedua maskulin jamak menyatakan waktu terjadinya tindakan dan secara alami diterjemahkan sebagai klausa “ketika kamu mendekati.” Kata ganti “kamu” dapat merujuk kepada kelompok dalam bahasa Indonesia.
- source_word: אֶל הַמִּלְחָמָה
  choice: pertempuran
  rationale: מִלְחָמָה dapat berarti perang secara umum atau pertempuran tertentu. Konteks mendekati pertempuran langsung mendukung “pertempuran,” sambil mencatat alternatifnya dalam catatan kaki.
- source_word: וְנִגַּשׁ
  choice: harus maju
  rationale: נגשׁ berarti mendekat atau tampil ke depan. “Maju” secara alami menggambarkan imam yang tampil untuk berbicara kepada rakyat; “harus” menyampaikan daya instruktif bentuk perfek konsekutif dalam konteks hukum.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Nomina tunggal definit ini berarti “imam”; bahasa Indonesia tidak memerlukan artikel tertentu tersendiri.
- source_word: וְדִבֶּר
  choice: dan berbicara
  rationale: Bentuk piel dari דבר lazim berarti “berbicara.” Pilihan ini mempertahankan ungkapan umum sumber tanpa mempersempitnya menjadi “berpidato” atau “memberi amanat.”
- source_word: אֶל הָעָם
  choice: kepada rakyat
  rationale: הָעָם secara harfiah berarti “rakyat/bangsa.” Dalam konteks ini yang dimaksud ialah orang Israel yang terhimpun untuk berperang, tetapi istilah luas sumber dipertahankan dan tidak dipersempit menjadi “pasukan.”
