  source_fidelity: 'Revisi diperlukan karena klausa penutup Ibrani menyatakan akibat yang ditimbulkan oleh orang yang takut itu: ia dapat membuat hati saudara-saudaranya ‘mencair’. Draf mengubahnya menjadi pernyataan nonkausatif, ‘hati ... tidak menjadi gentar,’ sehingga pelaku dan hubungan kausatifnya hilang. Terjemahan revisi memulihkan hubungan itu dengan idiom Indonesia yang wajar.'
  naturalness: Sebagian besar draf menggunakan bahasa Indonesia baku dan jelas. ‘Para pengatur pasukan’ dapat dipertahankan dalam konteks ini, karena menghindari pengertian modern ‘polisi’ dan menyatakan fungsi administratif-militer. ‘Harus terus berbicara’ lebih alami daripada ‘harus melanjutkan berbicara.’
  terminology: ‘Takut dan tawar hati’ merupakan padanan alami untuk יָרֵא וְרַךְ הַלֵּבָב. ‘Saudara-saudaranya’ mempertahankan istilah kekerabatan kolektif dalam teks sumber; catatan menjelaskan rujukan kontekstualnya. ‘Menjadi tawar’ menyampaikan metafora hilangnya keberanian tanpa memakai ungkapan harfiah ‘mencairkan hati’ yang tidak lazim dalam bahasa Indonesia.
  issues:
