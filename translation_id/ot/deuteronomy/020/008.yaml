  to: Kemudian para pengatur pasukan harus terus berbicara kepada bangsa itu dan berkata, “Siapakah orang yang takut dan tawar hati?[a] Biarlah ia pergi dan pulang ke rumahnya, agar ia tidak membuat hati saudara-saudaranya menjadi tawar seperti hatinya sendiri.”[b]
