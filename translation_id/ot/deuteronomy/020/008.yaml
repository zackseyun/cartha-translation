base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/008.yaml
  text: Then the officers shall continue to speak to the people and say[a], ‘Who is the man who is fearful and fainthearted? Let him go and return to his house[b], lest he melt the heart of his brothers like his own heart.’
translation:
  language: id
  text: Kemudian para pengatur pasukan harus terus berbicara kepada bangsa itu dan berkata, “Siapakah orang yang takut dan tawar hati?[a] Biarlah ia pergi dan pulang ke rumahnya, agar ia tidak membuat hati saudara-saudaranya menjadi tawar seperti hatinya sendiri.”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “takut dan lembut/lunak hati,” yaitu tidak memiliki keberanian untuk bertempur.
    reason: lexical_alternative
  - marker: b
    text: “Saudara-saudaranya” di sini berarti sesama orang Israel atau sesama prajuritnya. Secara harfiah, bagian akhir ayat ini berbicara tentang ia membuat hati mereka “mencair” seperti hatinya sendiri.
    reason: cultural_and_lexical_note
lexical_decisions:
- source_word: וְיָסְפוּ
  choice: harus melanjutkan
  rationale: Dalam idiom dengan infinitif, יסף berarti melanjutkan atau berbicara lebih lanjut, bukan sekadar ‘menambah’.
- source_word: הַשֹּׁטְרִים
  choice: para pengatur pasukan
  rationale: Dalam konteks pengerahan militer ayat ini, istilah tersebut menunjuk para pejabat yang mengatur dan memberi arahan kepada pasukan, bukan polisi dalam pengertian modern.
- source_word: מִי הָאִישׁ
  choice: Siapakah orang
  rationale: ‘Orang’ wajar dalam bahasa Indonesia dan, dalam konteks ini, tetap merujuk kepada seorang laki-laki yang menjadi prajurit.
- source_word: הַיָּרֵא וְרַךְ הַלֵּבָב
  choice: takut dan tawar hati
  rationale: ‘Takut’ menerjemahkan ירא secara langsung, sedangkan ‘tawar hati’ merupakan ungkapan Indonesia alami bagi harfiah ‘lembut/lunak hati’, yakni kehilangan keberanian.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: Biarlah ia pergi dan pulang ke rumahnya
  rationale: Bentuk imperfek di sini memiliki daya perintah atau izin; ‘biarlah’ mempertahankan nuansa tersebut.
- source_word: וְלֹא יִמַּס אֶת־לְבַב אֶחָיו
  choice: supaya hati saudara-saudaranya tidak menjadi gentar
  rationale: Metafora harfiah ‘hati ... mencair’ menyatakan hilangnya keberanian. Susunan Indonesia ini menyampaikan akibat yang hendak dicegah tanpa menganggap orang itu secara gramatikal sebagai pelaku eksplisit.
- source_word: כִּלְבָבוֹ
  choice: seperti hatinya sendiri
  rationale: Mempertahankan perbandingan langsung dan pengulangan kata ‘hati’ dalam teks Ibrani.
theological_decisions:
- issue: Bahasa maskulin dalam konteks militer
  choice: Memakai ‘orang’ dalam pertanyaan dan ‘saudara-saudaranya’ bagi sesama anggota bangsa/pasukan
  alternative: ‘laki-laki’ dan ‘rekan-rekan seperjuangannya’
  rationale: Konteks menunjukkan seorang prajurit laki-laki, tetapi ‘orang’ adalah padanan Indonesia yang alami bagi אִישׁ di dalam konstruksi ini. ‘Saudara-saudara’ mempertahankan bahasa kekerabatan Ibrani dan cakupan sosialnya dijelaskan dalam catatan.
- issue: Metafora mencairnya hati
  choice: Menjadikan ‘hati ... tidak menjadi gentar’ dalam teks utama
  alternative: ‘jangan sampai ia mencairkan hati saudara-saudaranya’
  rationale: Bahasa Indonesia tidak lazim memakai ‘mencairkan hati’ untuk hilangnya keberanian. Pilihan utama mempertahankan maksud metafora tanpa menentukan lebih jauh mekanisme pengaruh ketakutan itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. ‘Para pengatur pasukan’ dipilih untuk membedakan pejabat pengerahan ini dari polisi modern. Ungkapan ‘tawar hati’ mempertahankan idiom hati sekaligus mudah dipahami.
