  - severity: low
    issue: ‘Harus melanjutkan berbicara’ kurang luwes dalam bahasa Indonesia modern.
    rationale: Idiom Ibrani ‘menambahkan untuk berbicara’ berarti berbicara terus atau berbicara lagi. ‘Harus terus berbicara’ menyampaikan makna tersebut secara lebih alami.
