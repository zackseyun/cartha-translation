  yaml_path: translation/ot/deuteronomy/020/013.yaml
  text: And Yahweh your God will give it into your hand[a], and you shall strike down all its males with the edge of the sword.
translation:
  language: id
  text: Dan Yahweh, Allahmu, akan menyerahkannya ke dalam tanganmu, dan engkau harus menewaskan semua laki-laki di dalamnya[a] dengan mata pedang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “semua laki-lakinya” (yakni laki-laki kota itu). Istilah Ibrani tersebut menandai jenis kelamin laki-laki dan tidak dengan sendirinya membatasi kelompok itu hanya pada laki-laki dewasa.'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְתָנָהּ
  choice: akan menyerahkannya
  rationale: Bentuk נתן dengan akhiran objek feminin tunggal mengacu kepada kota itu. Kata penghubung וּ diterjemahkan sebagai “dan” untuk mempertahankan urutan tindakan dalam teks Ibrani, sedangkan “-nya” secara alami merujuk kepada kota tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan suatu gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk konstruk dengan akhiran orang kedua maskulin tunggal diterjemahkan secara langsung dan wajar sebagai “Allahmu”.
- source_word: בְּיָדֶךָ
  choice: ke dalam tanganmu
  rationale: Ungkapan ini menyatakan penyerahan ke bawah kuasa seseorang. Terjemahan mempertahankan citra tangan yang terdapat dalam bahasa Ibrani dan tetap dapat dipahami dalam bahasa Indonesia.
- source_word: וְהִכִּיתָ
  choice: dan engkau harus menewaskan
  rationale: Bentuk hifil dari נכה dalam konteks peperangan menyatakan tindakan memukul hingga tewas. “Menewaskan” menyampaikan akibat mematikan secara jelas tanpa memperhalus perintah tersebut.
- source_word: כָּל
  choice: semua
  rationale: Pilihan ini mempertahankan cakupan menyeluruh dari kata Ibrani.
- source_word: זְכוּרָהּ
  choice: semua laki-laki di dalamnya
  rationale: Kata זָכוּר menunjuk kepada yang berjenis kelamin laki-laki, dengan akhiran feminin tunggal yang mengacu kepada kota. Ungkapan utama dibuat alami dalam bahasa Indonesia, sementara catatan kaki menjaga ketepatan cakupan leksikalnya.
- source_word: לְפִי חָרֶב
  choice: dengan mata pedang
  rationale: Secara harfiah ungkapan ini berarti “menurut mulut pedang”; “dengan mata pedang” adalah padanan idiomatis bahasa Indonesia yang mempertahankan gambaran sisi tajam pedang.
theological_decisions:
- issue: Menerjemahkan perintah peperangan yang dikaitkan dengan tindakan ilahi tanpa memperhalus atau menambah penjelasan
  choice: 'Perintah diterjemahkan secara langsung: “engkau harus menewaskan semua laki-laki di dalamnya dengan mata pedang.”'
  alternative: Menggunakan kata yang lebih lunak seperti “mengalahkan”, atau menambahkan penjelasan mengenai penghukuman atau perang suci.
  rationale: Teks Ibrani secara eksplisit menyatakan bahwa Yahweh menyerahkan kota itu ke dalam tangan Israel dan memerintahkan tindakan mematikan terhadap semua yang laki-laki. Terjemahan mempertahankan bobot pernyataan itu tanpa eufemisme dan tanpa memasukkan penafsiran teologis yang tidak dinyatakan dalam ayat.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan bermartabat. Kata ganti “engkau” mempertahankan sapaan tunggal dalam teks Ibrani. Susunan kalimat menjaga rangkaian tindakan sumber, sedangkan istilah “menewaskan” menyatakan kekerasan mematikan secara terang tanpa tambahan interpretatif.
