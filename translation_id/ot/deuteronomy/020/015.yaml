base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/015.yaml
  text: Thus you shall do to all the cities that are very far from you[b][a], which are not among the cities of these nations.
translation:
  language: id
  text: Demikianlah harus kamu lakukan terhadap semua kota yang sangat jauh darimu, yang tidak termasuk di antara kota-kota bangsa-bangsa ini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “yang bukan dari antara kota-kota bangsa-bangsa ini”; maksudnya, kota-kota itu bukan milik bangsa-bangsa yang baru disebutkan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: Demikianlah
  rationale: Menunjukkan cara bertindak yang baru saja diuraikan dalam konteks sebelumnya; bentuk ini alami dan tetap bernada resmi dalam ketentuan hukum.
- source_word: תַּעֲשֶׂה
  choice: harus kamu lakukan
  rationale: Bentuk imperfek Qal orang kedua tunggal maskulin berdaya perintah dalam konteks hukum. Susunan ini menyampaikan kewajiban dengan jelas dalam bahasa Indonesia modern.
- source_word: לְכָל הֶעָרִים
  choice: terhadap semua kota
  rationale: Preposisi ל menandai pihak atau objek yang dikenai tindakan; 'terhadap' lebih wajar daripada 'kepada' untuk perlakuan atas kota-kota.
- source_word: הָרְחֹקֹת מִמְּךָ מְאֹד
  choice: yang sangat jauh darimu
  rationale: Mempertahankan makna jarak, acuan orang kedua tunggal, dan penegasan מְאֹד.
- source_word: אֲשֶׁר לֹא מֵעָרֵי
  choice: yang tidak termasuk kota-kota
  rationale: 'Menangkap fungsi partitif מִן: kota-kota tersebut bukan bagian dari kelompok kota milik bangsa-bangsa yang disebutkan.'
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: bangsa-bangsa ini
  rationale: Dalam konteks geopolitik Ulangan, גּוֹיִם paling tepat diterjemahkan 'bangsa-bangsa', tanpa memasukkan konotasi Perjanjian Baru dari istilah 'orang bukan Yahudi'.
- source_word: הֵנָּה
  choice: tercakup dalam 'bangsa-bangsa ini'
  rationale: Kata ganti demonstratif feminin jamak menegaskan bangsa-bangsa yang sedang ditunjuk. Dalam bahasa Indonesia, dayanya terserap secara alami oleh kata 'ini'.
theological_decisions:
- issue: Pembedaan cakupan antara kota-kota yang jauh dan kota-kota bangsa yang disebutkan dalam konteks sekitar
  choice: 'Ayat diterjemahkan sebagai batas cakupan hukum: perlakuan sebelumnya berlaku terhadap kota-kota yang jauh dan tidak termasuk kota-kota bangsa-bangsa ini.'
  alternative: Menambahkan penjelasan tentang ketentuan pengepungan sebelumnya atau memperlunak pembedaan itu menjadi pernyataan umum tentang kota-kota asing.
  rationale: Teks Ibrani membedakan dua kelompok kota tanpa mengulangi rincian perlakuannya. Terjemahan mempertahankan kekuatan hukum-militernya tanpa memperluas atau memperlunaknya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Demikianlah harus kamu lakukan' mempertahankan nada instruktif hukum, sedangkan 'tidak termasuk' menyampaikan hubungan partitif secara alami. Penanda catatan kaki [a] ditempatkan sesudah klausa yang dijelaskannya.
