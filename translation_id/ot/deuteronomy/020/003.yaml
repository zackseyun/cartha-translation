translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. “Kalian” dipakai untuk menandai orang kedua jamak yang eksplisit dalam bahasa Ibrani. Seruan “Dengarlah, hai Israel!” mempertahankan corak khas kitab Ulangan. Tanda catatan kaki ditempatkan pada ungkapan yang benar-benar dijelaskannya.
