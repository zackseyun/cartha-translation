  text: וְ/אָמַ֤ר אֲלֵ/הֶם֙ שְׁמַ֣ע יִשְׂרָאֵ֔ל אַתֶּ֨ם קְרֵבִ֥ים הַ/יּ֛וֹם לַ/מִּלְחָמָ֖ה עַל אֹיְבֵי/כֶ֑ם אַל יֵרַ֣ךְ לְבַבְ/כֶ֗ם אַל תִּֽירְא֧וּ וְ/אַֽל תַּחְפְּז֛וּ וְ/אַל תַּֽעַרְצ֖וּ מִ/פְּנֵי/הֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/003.yaml
  text: 'and say to them[a], ‘Hear, Israel: today you are drawing near to battle against your enemies. Do not let your heart grow faint. Do not fear, or panic[b], or be terrified because of them.’'
translation:
  language: id
  text: Ia harus berkata kepada mereka, “Dengarlah, hai Israel! Hari ini kalian maju untuk berperang melawan musuh-musuh kalian. Jangan tawar hati[a]. Jangan takut, jangan panik[b], dan jangan gentar menghadapi mereka.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Jangan biarkan hati kalian menjadi lemah/lunak,” yaitu jangan kehilangan keberanian.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan, “Jangan takut, jangan menjadi kacau karena ketakutan, dan jangan diliputi kengerian di hadapan mereka.” Ketiga larangan ini memperkuat perintah agar Israel tidak dikuasai ketakutan dalam pertempuran.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַר
  choice: dan berkata
  rationale: 'Bentuk perfek dengan waw meneruskan rangkaian petunjuk dari ayat sebelumnya. Karena subjeknya, yaitu imam, sudah disebut dalam konteks, bentuk ini wajar diterjemahkan sebagai kelanjutan tindakan: “dan berkata”.'
- source_word: שְׁמַע יִשְׂרָאֵל
  choice: Dengarlah, hai Israel!
  rationale: Mempertahankan rumusan seruan perjanjian yang khas dalam Ulangan. “Dengarlah” mencakup tindakan mendengar sekaligus memperhatikan dan menaati; partikel “hai” membuat sapaan langsung kepada Israel jelas dan bermartabat.
- source_word: קְרֵבִים הַיּוֹם לַמִּלְחָמָה
  choice: Hari ini kalian maju untuk berperang
  rationale: Partisip קְרֵבִים menyatakan gerak mendekat atau keterlibatan yang segera terjadi. “Maju untuk berperang” menyampaikan keadaan yang sudah di ambang pertempuran dalam bahasa Indonesia yang alami tanpa menambahkan lokasi yang tidak disebutkan.
- source_word: עַל אֹיְבֵיכֶם
  choice: melawan musuh-musuh kalian
  rationale: Dalam konteks peperangan, עַל menyatakan permusuhan atau perlawanan dan paling alami diterjemahkan “melawan”. Bentuk “kalian” memperjelas bahwa sufiks Ibrani itu jamak.
- source_word: אַל יֵרַךְ לְבַבְכֶם
  choice: Jangan tawar hati
  rationale: Ungkapan Ibrani secara harfiah menggambarkan hati yang menjadi lemah atau lunak, yakni runtuhnya keberanian. Idiom Indonesia “tawar hati” menyampaikan makna itu secara ringkas dan alami, sementara metafora sumber dijelaskan dalam catatan kaki.
- source_word: אַל תִּירְאוּ
  choice: Jangan takut
  rationale: Padanan langsung dan alami bagi larangan dari akar ירא, serta mempertahankan urutan tiga larangan mengenai rasa takut.
- source_word: וְאַל תַּחְפְּזוּ
  choice: jangan panik
  rationale: Dalam konteks militer, verba ini menunjuk pada reaksi kacau atau terguncang karena ketakutan, bukan sekadar bertindak tergesa-gesa. “Panik” menyampaikan daya emosionalnya dalam bahasa Indonesia modern.
- source_word: וְאַל תַּעַרְצוּ
  choice: jangan gentar
  rationale: Verba ini menggambarkan diliputi kengerian atau dibuat takut oleh lawan. “Gentar” alami dalam seruan menjelang perang dan menjaga peningkatan tekanan bersama dua larangan sebelumnya.
- source_word: מִפְּנֵיהֶם
  choice: menghadapi mereka
  rationale: Ungkapan ini secara harfiah berarti “di hadapan mereka/dari hadapan mereka”. Dalam konteks berhadapan dengan musuh, “menghadapi mereka” mempertahankan gambaran kehadiran lawan dan terdengar alami dalam bahasa Indonesia.
