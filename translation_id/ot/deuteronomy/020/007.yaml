translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Memperistri' dipilih sebagai ungkapan ringkas dan jelas bagi idiom perkawinan Ibrani, sedangkan catatan kaki mempertahankan bentuk harfiahnya. Susunan pertanyaan dan instruksi dijaga agar terdengar sebagai bagian dari pengumuman resmi kepada pasukan.
