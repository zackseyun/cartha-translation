base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/020/007.yaml
  text: And who is the man who has become engaged to a woman and has not taken her? Let him go and return to his house[c][b][a], lest he die in the battle and another man take her.
translation:
  language: id
  text: Dan siapakah laki-laki yang telah bertunangan dengan seorang perempuan[a], tetapi belum memperistrinya[b]? Hendaklah ia pergi dan pulang ke rumahnya, agar ia tidak mati dalam pertempuran itu dan laki-laki lain memperistri perempuan itu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih formal, “telah mengikat pertunangan dengan seorang perempuan.”
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “belum mengambilnya”; maksudnya, belum menyelesaikan perkawinan dengan mengambil perempuan itu sebagai istri.
    reason: cultural_note
  - marker: c
    text: Secara harfiah, “mengambilnya”; dalam konteks ini artinya menikahi atau memperistri perempuan itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִי הָאִישׁ
  choice: Dan siapakah orang
  rationale: Mempertahankan kata penghubung yang melanjutkan daftar pengecualian serta bentuk pertanyaan retoris dalam konteks pengerahan laki-laki untuk berperang.
- source_word: אֵרַשׂ אִשָּׁה
  choice: telah bertunangan dengan seorang perempuan
  rationale: אֵרַשׂ menunjuk pada ikatan pertunangan resmi yang belum dilanjutkan dengan pengambilan perempuan itu sebagai istri. Ungkapan ini alami dalam bahasa Indonesia modern dan mempertahankan pembedaan tahap perkawinan tersebut.
- source_word: וְלֹא לְקָחָהּ
  choice: tetapi belum memperistrinya
  rationale: Secara harfiah berarti 'dan belum mengambilnya', tetapi dalam konstruksi ini לָקַח menunjuk pada mengambil seorang perempuan sebagai istri. 'Memperistrinya' menyampaikan makna perkawinan tanpa kesan bahwa perempuan diperlakukan sebagai benda.
- source_word: יֵלֵךְ וְיָשֹׁב לְבֵיתוֹ
  choice: Hendaklah ia pergi dan pulang ke rumahnya
  rationale: Menyampaikan daya direktif bentuk verbal dalam konteks pengecualian dari tugas perang sambil mempertahankan dua verba Ibrani, 'pergi' dan 'pulang'.
- source_word: פֶּן יָמוּת בַּמִּלְחָמָה
  choice: supaya jangan ia mati dalam pertempuran itu
  rationale: פֶּן memperkenalkan akibat yang hendak dihindari. 'Pertempuran itu' mengacu pada kampanye militer yang sedang dibicarakan.
- source_word: וְאִישׁ אַחֵר יִקָּחֶנָּה
  choice: dan laki-laki lain memperistri perempuan tersebut
  rationale: Pengulangan לָקַח tetap dipahami dalam arti perkawinan. 'Laki-laki lain' mempertahankan bentuk maskulin eksplisit dan kontras dengan laki-laki pertama.
