  - severity: low
    issue: “pendatang” untuk גֵּר
    rationale: Tanpa penjelas, “pendatang” dapat mencakup pengunjung atau orang yang baru tiba. “Orang asing yang menetap” lebih tepat bagi penduduk asing yang berdiam di tengah Israel.
