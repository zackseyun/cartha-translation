  source_fidelity: Revisi diperlukan karena “mempersembahkan” dapat menyiratkan tindakan mempersembahkan secara kultis, sedangkan לַעְשֵׂר terutama menunjuk tindakan mengeluarkan/menunaikan persepuluhan. “Mengeluarkan” menjaga makna tindakan itu tanpa menambahkan nuansa persembahan. “Orang asing yang menetap” lebih jelas mencerminkan גֵּר sebagai penduduk non-Israel yang tinggal di tengah masyarakat setempat.
  naturalness: Teks revisi tetap baku dan alami. “Ketika ... maka ...” dengan jelas menyampaikan urutan waktu dan instruksi. “Di kota-kotamu” adalah pengungkapan idiomatis yang wajar untuk בִשְׁעָרֶיךָ, dengan bentuk harfiahnya dipertahankan dalam catatan.
  terminology: “Persepuluhan,” “orang Lewi,” “anak yatim,” dan “janda” dipertahankan. “Tahun persepuluhan” secara setia menerjemahkan שְׁנַת הַמַּעֲשֵׂר.
