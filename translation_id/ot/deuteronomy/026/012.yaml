  text: כִּ֣י תְכַלֶּ֞ה לַ֠/עְשֵׂר אֶת כָּל מַעְשַׂ֧ר תְּבוּאָתְ/ךָ֛ בַּ/שָּׁנָ֥ה הַ/שְּׁלִישִׁ֖ת שְׁנַ֣ת הַֽ/מַּעֲשֵׂ֑ר וְ/נָתַתָּ֣ה לַ/לֵּוִ֗י לַ/גֵּר֙ לַ/יָּת֣וֹם וְ/לָֽ/אַלְמָנָ֔ה וְ/אָכְל֥וּ בִ/שְׁעָרֶ֖י/ךָ וְ/שָׂבֵֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/012.yaml
  text: When you have finished tithing all the tithe of your produce in the third year[a], the year of the tithe, then you shall give it to the Levite, the sojourner, the fatherless, and the widow, and they shall eat within your gates and be satisfied.
translation:
  language: id
  text: Ketika kamu telah selesai mengeluarkan seluruh persepuluhan dari hasil tanahmu pada tahun ketiga, yaitu tahun persepuluhan, maka berikanlah itu kepada orang Lewi, orang asing yang menetap, anak yatim, dan janda. Mereka akan makan di kota-kotamu[a] sampai kenyang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “di dalam gerbang-gerbangmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Apabila
  rationale: Dalam konteks ini כִּי memperkenalkan keadaan waktu yang mendahului perintah berikutnya; “apabila” menyampaikan urutan prosedural itu secara alami.
- source_word: תְכַלֶּה לַעְשֵׂר
  choice: telah selesai mempersembahkan ... persepuluhan
  rationale: Bentuk Piel כלה menyatakan penyelesaian tindakan, sedangkan עשר merujuk pada tindakan memberikan atau mengkhususkan sepersepuluh. Ungkapan ini menjaga kaitannya dengan מַעְשַׂר tanpa menghasilkan pengulangan yang terlalu kaku.
- source_word: כָּל מַעְשַׂר תְּבוּאָתְךָ
  choice: seluruh persepuluhan dari hasil tanahmu
  rationale: מַעְשַׂר diterjemahkan dengan istilah baku “persepuluhan”; תְּבוּאָה mencakup hasil atau produksi tanah secara umum.
- source_word: בַּשָּׁנָה הַשְּׁלִישִׁת שְׁנַת הַמַּעֲשֵׂר
  choice: pada tahun ketiga, yaitu tahun persepuluhan
  rationale: Mempertahankan penjelasan aposisional teks Ibrani dan hubungan tahun ketiga dengan siklus persepuluhan.
- source_word: וְנָתַתָּה
  choice: berikanlah itu
  rationale: Waw melanjutkan urutan instruksi; bentuk imperatif Indonesia menyampaikan daya perintahnya, sedangkan “itu” merujuk pada persepuluhan yang baru disebut.
- source_word: לַלֵּוִי לַגֵּר לַיָּתוֹם וְלָאַלְמָנָה
  choice: kepada orang Lewi, pendatang, anak yatim, dan janda
  rationale: Kategori penerima dipertahankan secara konkret. גֵּר adalah orang nonpribumi yang tinggal di tengah Israel, sehingga “pendatang” lebih tepat daripada “orang asing” yang terlalu umum; יָתוֹם secara idiomatis wajar diterjemahkan “anak yatim”.
- source_word: בִשְׁעָרֶיךָ
  choice: di kota-kotamu[a]
  rationale: Secara harfiah berarti “di dalam gerbang-gerbangmu”, tetapi dalam hukum Ulangan merupakan metonimia bagi permukiman atau kota setempat. Terjemahan makna idiomatis dipakai dalam teks utama dan bentuk harfiahnya dicatat.
- source_word: וְאָכְלוּ ... וְשָׂבֵעוּ
  choice: Mereka akan makan ... sampai kenyang
  rationale: Kedua bentuk verbal menyatakan hasil yang diharapkan setelah pemberian itu; “sampai kenyang” menyampaikan keadaan puas karena kebutuhan makan tercukupi.
theological_decisions:
- issue: Kategori kelompok rentan dalam hukum perjanjian
  choice: Mempertahankan kategori konkret “orang Lewi, pendatang, anak yatim, dan janda”.
  alternative: Memparafrasakannya sebagai pekerja agama, imigran, yatim piatu, dan janda, atau secara umum sebagai orang yang membutuhkan.
  rationale: Teks menyebut para penerima tertentu dalam tatanan sosial-perjanjian Israel. Mempertahankan daftar itu menghindari pemasukan kategori sosial modern yang tidak identik dengan istilah sumber.
- issue: Makna idiom בִשְׁעָרֶיךָ
  choice: Menerjemahkan maknanya sebagai “di kota-kotamu” dan mencatat bentuk harfiahnya.
  alternative: Memakai “di dalam gerbang-gerbangmu” dalam teks utama.
  rationale: “Gerbang” di sini mewakili wilayah permukiman setempat, bukan semata-mata bangunan gerbang. Pilihan utama dibuat jelas bagi pembaca Indonesia sambil mempertahankan citra Ibraninya dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami bagi pembaca umum, sementara istilah hukum penting “persepuluhan” dan daftar penerima tetap dipertahankan.
