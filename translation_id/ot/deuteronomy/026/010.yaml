  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּ֤ה הֵבֵ֨אתִי֙ אֶת רֵאשִׁית֙ פְּרִ֣י הָ/אֲדָמָ֔ה אֲשֶׁר נָתַ֥תָּה לִּ֖/י יְהוָ֑ה וְ/הִנַּחְתּ֗/וֹ לִ/פְנֵי֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/הִֽשְׁתַּחֲוִ֔יתָ לִ/פְנֵ֖י יְהוָ֥ה אֱלֹהֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/010.yaml
  text: And now[a], behold, I have brought the firstfruits of the ground that you, O Yahweh, have given me[b]. Then you shall set it down before Yahweh your God and bow down before Yahweh your God.
translation:
  language: id
  text: “Dan sekarang, lihatlah, aku telah membawa hasil pertama[a] dari tanah yang telah Kauberikan kepadaku, ya Yahweh.” Lalu engkau harus meletakkannya di hadapan Yahweh, Allahmu, dan bersujud[b] di hadapan Yahweh, Allahmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “buah sulung dari tanah” atau “bagian pertama dari hasil tanah.”
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani ini secara khusus menunjuk pada tindakan merendahkan atau membungkukkan tubuh; “menyembah” merupakan terjemahan yang lebih luas dan interpretatif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: Dan sekarang
  rationale: Mempertahankan hubungan dengan pengakuan yang mendahuluinya sekaligus menandai peralihan kepada tindakan persembahan saat ini.
- source_word: הִנֵּה
  choice: lihatlah
  rationale: Partikel penunjuk ini mengarahkan perhatian kepada persembahan; “lihatlah” alami dalam bahasa Indonesia modern dan tetap mempertahankan daya demonstratifnya.
- source_word: הֵבֵאתִי
  choice: aku telah membawa
  rationale: Bentuk perfektif orang pertama menunjuk pada tindakan membawa yang sudah dilakukan dalam konteks pernyataan ritual.
- source_word: רֵאשִׁית פְּרִי הָאֲדָמָה
  choice: hasil pertama dari tanah
  rationale: Menyampaikan hubungan konstruksi Ibrani secara jelas dan alami. Ungkapan ini tidak memaksakan apakah yang dimaksud adalah bagian hasil panen yang pertama atau buah sulung sebagai istilah teknis.
- source_word: אֲשֶׁר נָתַתָּה לִּי
  choice: yang telah Kauberikan kepadaku
  rationale: Mempertahankan klausa relatif dan pengakuan langsung bahwa hasil tanah itu merupakan pemberian Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi yang muncul tiga kali dalam ayat ini.
- source_word: וְהִנַּחְתּוֹ
  choice: Lalu engkau harus meletakkannya
  rationale: Dalam konteks petunjuk ritual, bentuk ini menyatakan tindakan yang harus dilakukan sesudah pengakuan; pronomina “-nya” merujuk pada hasil pertama yang dibawa.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Menyatakan penempatan dan tindakan dalam hadirat Yahweh dengan ungkapan Indonesia yang wajar bagi konteks ibadah.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Mempertahankan sebutan perjanjian dalam bentuk orang kedua tunggal pada kedua kemunculannya.
- source_word: וְהִשְׁתַּחֲוִיתָ
  choice: dan bersujud
  rationale: Mengungkapkan tindakan jasmani merendahkan diri di hadapan Yahweh tanpa menggantinya dengan istilah lebih luas “menyembah”.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani menggunakan nama ilahi secara langsung; “Yahweh” mempertahankan nama tersebut tanpa menggantinya dengan gelar.
- issue: Makna וְהִשְׁתַּחֲוִיתָ dalam tindakan ibadah
  choice: bersujud
  alternative: menyembah
  rationale: Kata kerja Ibrani secara khusus menggambarkan tindakan membungkukkan atau merendahkan tubuh. Konteksnya memang ibadah, tetapi “bersujud” mempertahankan tindakan jasmani yang dinyatakan teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Tanda kutip menandai kelanjutan pengakuan ritual dari ayat sebelumnya, sedangkan kalimat berikutnya kembali kepada petunjuk bagi orang yang mempersembahkan. Bentuk “engkau” dipertahankan karena seluruh petunjuk ditujukan kepada orang kedua tunggal.
