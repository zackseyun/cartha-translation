  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּֽ/לְ/תִתְּ/ךָ֣ עֶלְי֗וֹן עַ֤ל כָּל הַ/גּוֹיִם֙ אֲשֶׁ֣ר עָשָׂ֔ה לִ/תְהִלָּ֖ה וּ/לְ/שֵׁ֣ם וּ/לְ/תִפְאָ֑רֶת וְ/לִֽ/הְיֹתְ/ךָ֧ עַם קָדֹ֛שׁ לַ/יהוָ֥ה אֱלֹהֶ֖י/ךָ כַּ/אֲשֶׁ֥ר דִּבֵּֽר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/019.yaml
  text: and to set you high above all the nations that he has made[a], for praise and for name and for beauty, and for you to be a holy people to Yahweh your God[c][b], as he has spoken.
translation:
  language: id
  text: dan untuk mengangkat engkau tinggi di atas segala bangsa yang telah dijadikan-Nya, sehingga engkau mendapat pujian, kemasyhuran[a], dan kemuliaan[b], serta menjadi umat yang kudus bagi TUHAN, Allahmu, seperti yang telah difirmankan-Nya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “nama”; maksudnya dapat berupa nama baik, reputasi, atau kemasyhuran.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani ini juga dapat berarti “keindahan”, “semarak”, atau “kehormatan”.
    reason: lexical_alternative
  - marker: c
    text: Atau, “seperti yang telah dijanjikan-Nya”; secara harfiah, “seperti yang telah difirmankan-Nya”.
    reason: alternative_reading
lexical_decisions:
- source_word: וּלְתִתְּךָ עֶלְיוֹן עַל כָּל הַגּוֹיִם
  choice: dan untuk mengangkat engkau tinggi di atas segala bangsa
  rationale: Ungkapan ini melanjutkan rangkaian tujuan dari ayat sebelumnya. 'Mengangkat engkau tinggi di atas' menyampaikan fungsi predikatif עֶלְיוֹן dan perbandingan yang ditandai עַל secara alami dalam bahasa Indonesia.
- source_word: אֲשֶׁר עָשָׂה
  choice: yang telah dijadikan-Nya
  rationale: Bentuk pasif berakhiran -Nya mempertahankan Allah sebagai pelaku tanpa menimbulkan kesan janggal bahwa bangsa-bangsa adalah benda yang 'dibuat'; verba עשה tidak perlu diperkuat menjadi 'diciptakan'.
- source_word: לִתְהִלָּה
  choice: sehingga engkau mendapat pujian
  rationale: Konstruksi ל dapat menyatakan tujuan atau hasil. Rumusan ini alami dalam bahasa Indonesia dan mengaitkan ketiga nomina berikut dengan pengangkatan Israel.
- source_word: וּלְשֵׁם
  choice: kemasyhuran
  rationale: שֵׁם secara harfiah berarti 'nama', tetapi dalam konteks ini menyatakan nama baik, reputasi, atau kemasyhuran. Pilihan idiomatis ditempatkan dalam teks dan arti harfiahnya dicatat.
- source_word: וּלְתִפְאָרֶת
  choice: kemuliaan
  rationale: תִפְאָרֶת mencakup keindahan, semarak, kehormatan, dan kemuliaan. 'Kemuliaan' paling wajar dalam rangkaian ini, sementara keluasan maknanya dipertahankan dalam catatan.
- source_word: וְלִהְיֹתְךָ עַם קָדוֹשׁ לַיהוָה אֱלֹהֶיךָ
  choice: serta menjadi umat yang kudus bagi TUHAN, Allahmu
  rationale: '''Serta menjadi'' meneruskan rangkaian tujuan tanpa konstruksi yang kaku. ''Bagi'' menyampaikan relasi dan kepunyaan yang ditandai ל, sedangkan יהוה ditampilkan menurut konvensi Indonesia sebagai TUHAN.'
- source_word: כַּאֲשֶׁר דִּבֵּר
  choice: seperti yang telah difirmankan-Nya
  rationale: Pilihan ini tetap dekat dengan arti dasar דבר, yaitu berkata atau berfirman, tanpa mengubahnya secara eksplisit menjadi 'berjanji'.
theological_decisions:
- issue: Apakah klausa terakhir harus dibuat eksplisit sebagai janji
  choice: seperti yang telah difirmankan-Nya
  alternative: seperti yang telah dijanjikan-Nya
  rationale: Konteks perjanjian memungkinkan nuansa janji, tetapi verba Ibrani hanya menyatakan bahwa Allah telah berfirman. Teks utama mempertahankan keluasan itu.
- issue: Penerjemahan nama ilahi יהוה
  choice: TUHAN
  alternative: Yahweh
  rationale: TUHAN adalah bentuk konvensional dan bermartabat dalam Alkitab bahasa Indonesia untuk Tetragramaton, serta membedakannya dari gelar biasa melalui huruf kapital.
- issue: Hubungan tiga nomina dengan pengangkatan Israel
  choice: sehingga engkau mendapat pujian, kemasyhuran, dan kemuliaan
  alternative: untuk pujian, nama, dan keindahan
  rationale: Rangkaian ל dapat dibaca sebagai tujuan atau hasil. Rumusan Indonesia ini tidak menentukan secara berlebihan sumber pujian tersebut, tetapi menghindari susunan nominal yang tidak alami.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat. Pronomina 'engkau' dipertahankan karena seluruh ayat menyapa Israel secara kolektif dan tunggal. Struktur tujuan dari konteks sebelumnya dijaga, tetapi rangkaian nominal Ibrani diungkapkan secara idiomatis.
