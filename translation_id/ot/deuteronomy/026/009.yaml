base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/009.yaml
  text: And he brought us to this place and gave us this land[b][a], a land flowing with milk and honey.
translation:
  language: id
  text: Ia membawa kami ke tempat ini dan memberikan kepada kami negeri ini, negeri yang berlimpah susu dan madu[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “negeri yang mengalirkan susu dan madu”; ungkapan Ibrani ini menggambarkan kesuburan dan kelimpahan.
    reason: lexical_alternative
  - marker: b
    text: Dalam konteks tertentu, kata yang diterjemahkan “madu” dapat juga mencakup sari buah kental, misalnya sari kurma, bukan hanya madu lebah.
    reason: cultural_note
lexical_decisions:
- source_word: וַיְבִאֵנוּ
  choice: Ia membawa kami
  rationale: Bentuk Hifil dari בוא dengan akhiran orang pertama jamak menyatakan gerak kausatif. “Membawa kami” alami dalam bahasa Indonesia dan mempertahankan makna tersebut.
- source_word: אֶל הַמָּקוֹם הַזֶּה
  choice: ke tempat ini
  rationale: אֶל menandai arah menuju tujuan, sedangkan הַמָּקוֹם הַזֶּה berarti “tempat ini.” Frasa ini lugas dan alami.
- source_word: וַיִּתֶּן לָנוּ
  choice: dan memberikan kepada kami
  rationale: נתן dengan ל menandai pemberian kepada penerima. Bentuk ini mempertahankan unsur penerima secara jelas dan sesuai dengan ragam bahasa Indonesia yang bermartabat.
- source_word: אֶת הָאָרֶץ הַזֹּאת
  choice: negeri ini
  rationale: Dalam konteks ini אֶרֶץ menunjuk pada wilayah yang diberikan kepada Israel. “Negeri” terdengar alami untuk wilayah tempat suatu bangsa hidup, tanpa mengartikannya sebagai negara modern.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: negeri yang berlimpah susu dan madu
  rationale: Ungkapan Ibrani secara harfiah menggambarkan negeri yang “mengalirkan” susu dan madu. “Berlimpah” menyampaikan fungsi idiomatisnya—kesuburan dan kelimpahan—dengan bahasa Indonesia yang alami; citra harfiahnya dicatat dalam catatan kaki.
- source_word: דְבָשׁ
  choice: madu
  rationale: דְבָשׁ lazim berarti madu, walaupun dalam konteks tertentu dapat mencakup sari buah kental, misalnya sari kurma. “Madu” mempertahankan bentuk idiom yang dikenal, sedangkan cakupan maknanya dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Subjek ilahi dalam pengakuan sejarah orang pertama
  choice: Memakai kata ganti “Ia” tanpa menggantinya dengan nama TUHAN
  alternative: TUHAN membawa kami ke tempat ini
  rationale: Teks Ibrani ayat ini memakai verba orang ketiga tunggal tanpa menyebutkan subjek secara eksplisit, dengan subjek yang diteruskan dari konteks sebelumnya. Kata ganti mempertahankan kesinambungan itu dan tidak menambahkan nama ilahi yang tidak muncul dalam ayat ini.
- issue: Cakupan kata ganti orang pertama jamak
  choice: kami
  alternative: kita
  rationale: Pengakuan ini merupakan bagian dari tuturan yang ditujukan kepada TUHAN; “kami” secara wajar mencakup penutur dan umatnya tetapi tidak mencakup pihak yang disapa. Pilihan ini menyampaikan orang pertama jamak Ibrani sesuai konteks percakapan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Ia” mempertahankan rujukan pronominal kepada Allah tanpa menyisipkan nama ilahi. “Negeri” dipilih untuk wilayah yang diberikan kepada Israel, dan idiom Ibrani disampaikan secara alami dengan citra harfiahnya tetap tersedia dalam catatan kaki.
