source:
  edition: WLC
  text: וַֽ/יהוָ֞ה הֶאֱמִֽירְ/ךָ֣ הַ/יּ֗וֹם לִ/הְי֥וֹת ל/וֹ֙ לְ/עַ֣ם סְגֻלָּ֔ה כַּ/אֲשֶׁ֖ר דִּבֶּר לָ֑/ךְ וְ/לִ/שְׁמֹ֖ר כָּל מִצְוֺתָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/018.yaml
  text: And Yahweh has declared today that you are to be his treasured people[a], as he promised you[b], and that you are to keep all his commandments.
translation:
  language: id
  text: Dan Yahweh telah menyatakan pada hari ini bahwa engkau harus menjadi umat milik-Nya yang berharga[a], sebagaimana telah dikatakan-Nya kepadamu[b], dan bahwa engkau harus menaati segala perintah-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “umat kesayangan-Nya.” Secara lebih harfiah, “suatu umat, milik-Nya yang berharga.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “sebagaimana telah dijanjikan-Nya kepadamu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” agar identitas nama dalam teks Ibrani tetap tampak dan selaras dengan lapisan konsultasi POB.
- source_word: הֶאֱמִירְךָ
  choice: telah menyatakan bahwa engkau akan menjadi
  rationale: Bentuk Hifil yang langka dari אמר dalam konteks perjanjian ini menyampaikan tindakan pernyataan resmi. Pilihan ini mempertahankan daya performatifnya tanpa menambahkan gagasan “memilih” yang tidak dinyatakan secara langsung.
- source_word: הַיּוֹם
  choice: pada hari ini
  rationale: Ungkapan ini mempertahankan kesegeraan momen peneguhan perjanjian dan terdengar wajar dalam bahasa Indonesia.
- source_word: לְעַם סְגֻלָּה
  choice: umat milik-Nya yang berharga
  rationale: עַם menyatakan identitas kolektif sebagai umat, sedangkan סְגֻלָּה menunjuk kepada milik atau harta yang bernilai khusus. Frasa ini mempertahankan kedua unsur tersebut.
- source_word: כַּאֲשֶׁר דִּבֶּר לָךְ
  choice: seperti yang telah dikatakan-Nya kepadamu
  rationale: Pilihan ini menerjemahkan דִּבֶּר secara langsung dan tidak secara diam-diam mengubahnya menjadi “menjanjikan,” meskipun nuansa janji dimungkinkan oleh konteks perjanjian.
- source_word: וְלִשְׁמֹר
  choice: dan bahwa engkau harus menaati
  rationale: שׁמר ketika berobjek perintah berarti menjaga dengan menjalankannya. “Menaati” menyampaikan maksud tersebut secara alami, sementara pengulangan “bahwa engkau” memperjelas hubungan sintaksis infinitif ini dengan pernyataan sebelumnya.
- source_word: כָּל מִצְוֺתָיו
  choice: segala perintah-Nya
  rationale: Terjemahan ini mempertahankan cakupan menyeluruh כָּל dan register hukum-perjanjian dari מִצְוָה.
theological_decisions:
- issue: Daya perjanjian dari kata kerja langka הֶאֱמִיר
  choice: pernyataan ilahi resmi mengenai status Israel sebagai umat milik Yahweh
  alternative: bahasa pemilihan yang lebih eksplisit, seperti “telah memilih engkau,” atau rumusan peneguhan timbal balik
  rationale: Konteks mendukung tindakan deklaratif dalam perjanjian, tetapi kata-katanya tidak mengharuskan penerjemah memasukkan istilah teologis “memilih.” Terjemahan mempertahankan daya perjanjian tanpa menyelesaikan ketegangan itu secara berlebihan.
- issue: Hubungan וְלִשְׁמֹר dengan status Israel sebagai umat berharga
  choice: ditampilkan sebagai kewajiban Israel untuk menaati semua perintah Yahweh
  alternative: 'membiarkan infinitif sebagai rangkaian yang lebih longgar: “dan untuk menaati”'
  rationale: Subjek tersirat paling alami adalah orang kedua tunggal kolektif, yaitu Israel. Rumusan “bahwa engkau harus” memperjelasnya dalam bahasa Indonesia tanpa menjadikan ketaatan sebagai dasar eksplisit bagi status tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. “Engkau” mempertahankan sapaan orang kedua tunggal kepada Israel sebagai satu umat; kapitalisasi pada akhiran pronominal yang merujuk kepada Yahweh mengikuti kebiasaan ejaan religius Indonesia.
