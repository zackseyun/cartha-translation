  - severity: low
    issue: Catatan a kurang jelas dalam merepresentasikan susunan leksikal Ibrani.
    rationale: Ibrani memuat unsur 'umat' dan 'milik/harta berharga'. Catatan yang direvisi menyatakan alternatif yang idiomatis serta parafrasa harfiah yang mempertahankan kedua unsur itu.
