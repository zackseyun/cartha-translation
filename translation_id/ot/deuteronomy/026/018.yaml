  verdict: revise
  source_fidelity: Terjemahan pada dasarnya mengikuti struktur Ibrani dan dengan tepat tidak memasukkan gagasan 'memilih' ke dalam הֶאֱמִירְךָ. Namun, 'akan menjadi' terutama menyatakan masa depan, sedangkan konstruksi לִהְיוֹת di sini menyatakan penetapan/keharusan dalam deklarasi perjanjian. Perlu dipertahankan sebagai 'harus menjadi', sejajar dengan kewajiban menaati perintah-perintah-Nya.
  naturalness: Bahasa draf umumnya baku dan jelas. Menempatkan 'pada hari ini' setelah verba utama lebih alami dan menegaskan bahwa deklarasi itu berlangsung pada hari tersebut. 'Umat milik-Nya yang berharga' dapat dipertahankan sebagai ungkapan modern yang cukup dekat dengan עַם סְגֻלָּה.
  terminology: '''Yahweh'', ''umat'', dan ''perintah-Nya'' konsisten dengan register religius modern. ''Menaati segala perintah-Nya'' secara idiomatis menyampaikan שׁמר dengan objek ''perintah''. Catatan a perlu memperjelas bahwa alternatif tersebut adalah ''umat kesayangan-Nya'', bukan mengaburkan unsur ''umat'' dalam Ibrani.'
