reference: Deuteronomy 26:3
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בָאתָ֙ אֶל הַ/כֹּהֵ֔ן אֲשֶׁ֥ר יִהְיֶ֖ה בַּ/יָּמִ֣ים הָ/הֵ֑ם וְ/אָמַרְתָּ֣ אֵלָ֗י/ו הִגַּ֤דְתִּי הַ/יּוֹם֙ לַ/יהוָ֣ה אֱלֹהֶ֔י/ךָ כִּי בָ֨אתִי֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֨ר נִשְׁבַּ֧ע יְהוָ֛ה לַ/אֲבֹתֵ֖י/נוּ לָ֥/תֶת לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/003.yaml
  text: And you shall go to the priest who is in office in those days and say to him[c][b][a], ‘Today I declare to Yahweh your God that I have come into the land that Yahweh swore to our fathers to give to us.’
translation:
  language: id
  text: Pergilah kepada imam yang menjabat pada waktu itu[a] dan katakanlah kepadanya, “Hari ini aku menyatakan[b] kepada Yahweh, Allahmu, bahwa aku telah masuk ke negeri yang Yahweh telah sumpahkan kepada para bapa leluhur kami[c] untuk diberikan-Nya kepada kami.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “imam yang akan ada pada hari-hari itu,” yaitu imam yang sedang bertugas atau menjabat pada waktu tersebut.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “Hari ini aku telah menyatakan.” Bentuk Ibraninya kemungkinan bersifat performatif: orang itu membuat pernyataan tersebut dengan mengucapkannya.'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “bapa-bapa kami.” Dalam konteks ini ungkapan tersebut kemungkinan secara khusus menunjuk kepada para bapa leluhur Israel; dapat juga diterjemahkan “nenek moyang kami.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאתָ
  choice: Kemudian datanglah
  rationale: Kata בוא dapat berarti datang, pergi, atau masuk menurut sudut pandang. Dalam rangkaian petunjuk ini, bentuk perintah bahasa Indonesia menyampaikan daya instruksionalnya secara alami.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Padanan baku כֹּהֵן dalam konteks ibadah dan hukum Israel.
- source_word: אֲשֶׁר יִהְיֶה בַּיָּמִים הָהֵם
  choice: yang menjabat pada waktu itu
  rationale: Secara harfiah, 'yang akan ada pada hari-hari itu'; konteks menunjuk kepada imam yang sedang memegang jabatan pada saat persembahan dibawa.
- source_word: וְאָמַרְתָּ אֵלָיו
  choice: dan katakan kepadanya
  rationale: Mempertahankan rangkaian instruksi dan pengantar ujaran langsung.
- source_word: הִגַּדְתִּי הַיּוֹם
  choice: Hari ini aku menyatakan
  rationale: 'Bentuk perfektif Ibrani kemungkinan bersifat performatif: orang itu membuat pernyataan tersebut dengan mengucapkannya.'
- source_word: לַיהוָה
  choice: kepada Yahweh
  rationale: Mempertahankan nama perjanjian יְהוָה sebagai Yahweh.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Mempertahankan akhiran orang kedua tunggal; orang yang beribadah berbicara kepada imam dan mengatakan 'Allahmu', bukan meratakannya menjadi 'Allah kita'.
- source_word: כִּי בָאתִי אֶל הָאָרֶץ
  choice: bahwa aku telah masuk ke negeri
  rationale: Konteksnya adalah telah memasuki negeri yang dijanjikan; 'telah masuk' mempertahankan relevansi keadaan kini dari tindakan itu.
- source_word: אֲשֶׁר נִשְׁבַּע יְהוָה
  choice: yang Yahweh janjikan dengan sumpah
  rationale: Mengungkapkan bahasa sumpah perjanjian secara alami tanpa mengurangi kekuatan kata נִשְׁבַּע.
- source_word: לַאֲבֹתֵינוּ
  choice: kepada para leluhur kita
  rationale: Ungkapan Indonesia yang alami bagi para pendahulu dalam konteks janji perjanjian; nuansa harfiahnya yang maskulin dijelaskan dalam catatan.
- source_word: לָתֶת לָנוּ
  choice: untuk diberikan kepada kita
  rationale: Mempertahankan gagasan bahwa negeri itu merupakan pemberian kepada umat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankan nama perjanjian dan membedakannya dari gelar.
- issue: Rujukan אֲבֹתֵינוּ
  choice: para leluhur kita
  alternative: bapa-bapa kita
  rationale: Dalam konteks Ulangan, istilah ini kemungkinan terutama menunjuk kepada para bapa leluhur Israel. Pilihan utama dibuat alami dalam bahasa Indonesia, sementara bentuk maskulin teks sumber tidak disembunyikan dan dicatat.
- issue: Nilai waktu dan fungsi הִגַּדְתִּי
  choice: aku menyatakan
  alternative: aku telah menyatakan
  rationale: Perfektif itu sangat mungkin bersifat performatif, tetapi bentuk lampau tetap merupakan kemungkinan gramatikal yang sah dan dicantumkan dalam catatan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat namun mudah dipahami. Bentuk perintah dipakai untuk rangkaian petunjuk hukum. 'Menjabat' memperjelas fungsi imam tanpa memperluas makna secara berlebihan, dan nama Yahweh dipertahankan.
