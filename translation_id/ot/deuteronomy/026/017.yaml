  text: אֶת יְהוָ֥ה הֶאֱמַ֖רְתָּ הַ/יּ֑וֹם לִ/הְיוֹת֩ לְ/ךָ֨ לֵֽ/אלֹהִ֜ים וְ/לָ/לֶ֣כֶת בִּ/דְרָכָ֗י/ו וְ/לִ/שְׁמֹ֨ר חֻקָּ֧י/ו וּ/מִצְוֺתָ֛י/ו וּ/מִשְׁפָּטָ֖י/ו וְ/לִ/שְׁמֹ֥עַ בְּ/קֹלֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/017.yaml
  text: Today you have declared Yahweh to be your God[a], and that you will walk in his ways, keep his statutes, his commandments, and his judgments[c][b], and obey his voice.
translation:
  language: id
  text: Hari ini engkau telah menyatakan bahwa Yahweh adalah Allahmu dan bahwa engkau akan berjalan di jalan-jalan-Nya, menaati ketetapan-ketetapan-Nya, perintah-perintah-Nya, dan ketetapan-ketetapan hukum-Nya, serta mendengarkan suara-Nya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan “mendengarkan suara-Nya” juga berarti mengindahkan dan menaati-Nya.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama pribadi, bukan menggantinya dengan gelar.
- source_word: הֶאֱמַרְתָּ
  choice: telah menyatakan
  rationale: Bentuk Hifil yang langka ini dalam konteks perjanjian menunjuk pada pernyataan atau pengakuan resmi; pilihan ini jelas dan wajar dalam bahasa Indonesia modern.
- source_word: הַיּוֹם
  choice: Hari ini
  rationale: Menyampaikan penekanan waktu secara langsung dan alami.
- source_word: לִהְיוֹת לְךָ לֵאלֹהִים
  choice: bahwa Yahweh adalah Allahmu
  rationale: Mengungkapkan hubungan perjanjian secara alami; secara harfiah konstruksinya berarti 'menjadi Allah bagimu'.
- source_word: וְלָלֶכֶת בִּדְרָכָיו
  choice: hidup menurut jalan-jalan-Nya
  rationale: Kata kerja harfiah 'berjalan' merupakan idiom tentang cara hidup. 'Hidup menurut' menyampaikan maknanya dengan jelas sambil mempertahankan unsur 'jalan-jalan-Nya'.
- source_word: חֻקָּיו
  choice: ketetapan-ketetapan-Nya
  rationale: Membedakan istilah hukum ini dari perintah dan hukum, serta mempertahankan register perjanjian.
- source_word: מִצְוֺתָיו
  choice: perintah-perintah-Nya
  rationale: Padanan baku dan jelas bagi ketentuan yang diperintahkan.
- source_word: מִשְׁפָּטָיו
  choice: hukum-hukum-Nya
  rationale: Mencerminkan ketentuan atau keputusan hukum tanpa meleburkannya dengan istilah legal lain dalam ayat ini.
- source_word: וְלִשְׁמֹעַ בְּקֹלוֹ
  choice: mendengarkan suara-Nya
  rationale: Mempertahankan gambaran harfiah 'mendengarkan suara' sekaligus membiarkan konteks perjanjian menyampaikan nuansa ketaatan.
theological_decisions:
- issue: Rumus pernyataan perjanjian dan komitmen Israel
  choice: Ayat ini disajikan sebagai pernyataan resmi Israel bahwa Yahweh adalah Allah mereka, disertai komitmen untuk hidup menurut jalan-Nya dan menaati ketentuan-Nya.
  alternative: Rangkaian infinitif dapat diterjemahkan lebih harfiah sebagai 'untuk menjadi Allahmu, dan untuk berjalan ... dan untuk memelihara ...' tanpa menjelaskan hubungan sintaksisnya.
  rationale: Susunan Ibrani menghubungkan verba pernyataan yang bersifat resmi dengan rangkaian infinitif komitmen perjanjian. Terjemahan memperjelas hubungan itu tanpa menambahkan isi teologis.
- issue: Nuansa שׁמע בקול
  choice: mendengarkan suara-Nya
  alternative: menaati suara-Nya / mematuhi-Nya
  rationale: Ungkapan ini mengandung nuansa mendengar dengan taat. Pilihan utama mempertahankan bentuk metaforis sumber dan ambiguitas antara mendengar serta menaati; catatan kaki menjelaskan nuansanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan tunggal 'engkau' dipertahankan karena bentuk Ibrani tunggal menyapa Israel secara kolektif. Huruf kapital pada pronomina ilahi mengikuti kebiasaan umum bahasa Indonesia religius tanpa menambah makna pada teks sumber.
