revisions:
- from: Hari ini engkau telah menyatakan bahwa Yahweh adalah Allahmu dan bahwa engkau akan hidup menurut jalan-jalan-Nya, menaati ketetapan-ketetapan-Nya, perintah-perintah-Nya, dan hukum-hukum-Nya, serta mendengarkan suara-Nya.[a]
  to: Hari ini engkau telah menyatakan bahwa Yahweh adalah Allahmu dan bahwa engkau akan berjalan di jalan-jalan-Nya, menaati ketetapan-ketetapan-Nya, perintah-perintah-Nya, dan ketetapan-ketetapan hukum-Nya, serta mendengarkan suara-Nya.[a]
  rationale: Revisi terbatas pada pemeliharaan metafora “berjalan di jalan-jalan-Nya” dan pembedaan yang lebih tepat bagi מִשְׁפָּטָיו. Catatan kaki tetap diperlukan karena שׁמע בקול secara harfiah berarti mendengarkan suara, tetapi dalam konteks ini berkonotasi ketaatan.
