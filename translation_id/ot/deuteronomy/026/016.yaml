base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/016.yaml
  text: This day Yahweh your God commands you to do these statutes and judgments[c][b][a]; and you shall keep and do them with all your heart and with all your soul.
translation:
  language: id
  text: Pada hari ini Yahweh, Allahmu, memerintahkan engkau untuk melakukan ketetapan dan peraturan ini.[a] Dan engkau harus menaati serta melakukannya dengan segenap hatimu dan dengan segenap jiwamu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata yang diterjemahkan “peraturan” juga dapat berarti “keputusan-keputusan hukum” atau “ketentuan-ketentuan hukum”.
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “jiwa” juga dapat berarti “nyawa”, “diri”, atau keseluruhan pribadi.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַיּוֹם הַזֶּה
  choice: Pada hari ini
  rationale: Ungkapan penunjuk waktu ini diberi bentuk yang wajar sekaligus khidmat dalam bahasa Indonesia dan mempertahankan penekanan perjanjian khas kitab Ulangan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama perjanjian ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Bentuk dengan akhiran orang kedua tunggal dipertahankan secara ringkas dan langsung.
- source_word: מְצַוְּךָ
  choice: memerintahkan engkau
  rationale: Partisip Ibrani menyatakan tindakan yang berlaku pada saat ini; bentuk kini bahasa Indonesia bersama keterangan 'Pada hari ini' menyampaikan daya tersebut secara alami.
- source_word: לַעֲשׂוֹת
  choice: untuk melakukan
  rationale: Mempertahankan arti dasar עשה dan kaitannya dengan pengulangan kata kerja yang sama kemudian dalam ayat.
- source_word: הַחֻקִּים
  choice: ketetapan-ketetapan
  rationale: Istilah ini lazim untuk ketentuan hukum atau perjanjian yang ditetapkan dan tetap dibedakan dari מִשְׁפָּטִים.
- source_word: הַמִּשְׁפָּטִים
  choice: peraturan-peraturan
  rationale: Pilihan ini alami bagi pembaca modern dan menyampaikan ketentuan hukum; catatan kaki mempertahankan kemungkinan nuansa keputusan hukum.
- source_word: וְשָׁמַרְתָּ
  choice: Dan engkau harus menaati
  rationale: Dalam konteks perjanjian, שמר berarti menjaga dengan cara mengindahkan atau menaati. 'Harus' menyampaikan daya perintah tanpa menambahkan alasan kausal.
- source_word: וְעָשִׂיתָ אֹתָם
  choice: serta melakukannya
  rationale: Pengulangan עשה dipertahankan agar pasangan tindakan menaati dan melakukan tetap tampak.
- source_word: בְּכָל לְבָבְךָ
  choice: dengan segenap hatimu
  rationale: Ungkapan ini mencakup pikiran, kehendak, dan perasaan batin serta sudah wajar dalam bahasa Indonesia yang khidmat.
- source_word: וּבְכָל נַפְשֶׁךָ
  choice: dan dengan segenap jiwamu
  rationale: Terjemahan ini mempertahankan pasangan formulaik dengan 'hati', sedangkan keluasan makna נֶפֶשׁ dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama perjanjian יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama diri ilahi; transliterasi mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Sapaan orang kedua tunggal kepada Israel
  choice: engkau/Allahmu/hatimu/jiwamu
  alternative: kamu/kalian atau penambahan 'Israel'
  rationale: Bentuk tunggal kolektif dalam bahasa Ibrani dipertahankan untuk menjaga kelangsungan sapaan perjanjian tanpa menambahkan subjek yang tidak tersurat.
- issue: Hubungan antarklausa sesudah perintah
  choice: Dan engkau harus
  alternative: Karena itu, engkau harus
  rationale: Kata penghubung Ibrani וְ tidak secara eksplisit menandai hubungan sebab-akibat. Terjemahan tidak menambahkan daya inferensial yang mungkin ada dalam konteks tetapi tidak dinyatakan secara leksikal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Engkau' dipakai untuk mempertahankan sapaan orang kedua tunggal dalam konteks perjanjian. Pengulangan 'melakukan' sengaja dipertahankan karena mencerminkan pengulangan עשה dalam sumber, sementara 'menaati' menyampaikan fungsi perjanjian dari שמר secara alami.
