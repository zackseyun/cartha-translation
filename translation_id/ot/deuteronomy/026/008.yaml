  terminology: “Yahweh,” “tangan yang kuat,” “lengan yang terulur,” dan “tanda-tanda” tepat serta konsisten dengan metafora dan register sumber. “Keajaiban-keajaiban” mempertahankan pasangan lazim “tanda-tanda dan keajaiban-keajaiban” tanpa menambahkan gagasan “berbagai.” Catatan kaki perlu menghindari “penampakan,” yang bukan padanan paling jelas bagi מוֹרָא dalam konteks ini.
