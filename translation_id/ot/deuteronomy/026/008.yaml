  rationale: Revisi ini mempertahankan seluruh unsur dan ambiguitas leksikal teks Ibrani, sambil memperbaiki keluwesan bahasa Indonesia. Penggantian “berbagai keajaiban” dengan “keajaiban-keajaiban” mencerminkan bentuk jamak tanpa menambah nuansa distributif, dan catatan kaki diperjelas agar tetap berada dalam rentang makna מוֹרָא.
