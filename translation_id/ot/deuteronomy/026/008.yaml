  text: וַ/יּוֹצִאֵ֤/נוּ יְהוָה֙ מִ/מִּצְרַ֔יִם בְּ/יָ֤ד חֲזָקָה֙ וּ/בִ/זְרֹ֣עַ נְטוּיָ֔ה וּ/בְ/מֹרָ֖א גָּדֹ֑ל וּ/בְ/אֹת֖וֹת וּ/בְ/מֹפְתִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/008.yaml
  text: And Yahweh brought us out of Egypt with a strong hand and an outstretched arm[a], and with great terror, and with signs and wonders.
translation:
  language: id
  text: Yahweh membawa kami keluar dari Mesir dengan tangan yang kuat dan lengan yang terulur, dengan kedahsyatan besar[a], serta dengan tanda-tanda dan keajaiban-keajaiban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kengerian yang besar” atau “perbuatan-perbuatan yang sangat dahsyat.” Istilah Ibrani ini dapat berarti rasa takut atau gentar, maupun tindakan yang menimbulkan rasa takut dan takjub.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִאֵנוּ
  choice: membawa kami keluar
  rationale: Bentuk Hifil dari יצא berarti menyebabkan keluar atau membawa keluar. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan motif keluaran.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi יהוה sebagai nama pribadi, bukan menggantinya dengan gelar.
- source_word: מִמִּצְרַיִם
  choice: dari Mesir
  rationale: Bersama frasa 'membawa kami keluar', bentuk ini secara alami menyatakan gerakan keluar dari Mesir.
- source_word: בְּיָד חֲזָקָה
  choice: dengan tangan yang kuat
  rationale: Mempertahankan gambaran Ibrani mengenai tindakan yang penuh kuasa tanpa mengubah metaforanya.
- source_word: וּבִזְרֹעַ נְטוּיָה
  choice: dan lengan yang terulur
  rationale: Padanan langsung dan jelas bagi gambaran tindakan ilahi yang berkuasa.
- source_word: וּבְמֹרָא גָּדֹל
  choice: dengan kedahsyatan yang besar
  rationale: מוֹרָא dapat menunjuk pada kengerian, rasa gentar, atau penampakan maupun tindakan yang membangkitkan rasa takut dan takjub. 'Kedahsyatan' menjaga keluasan nuansa tersebut, sedangkan catatan kaki menyajikan kemungkinan yang lebih spesifik.
- source_word: וּבְאֹתוֹת
  choice: dengan tanda-tanda
  rationale: אוֹתוֹת berarti tanda-tanda; konteksnya sudah menunjukkan sifat luar biasa tanpa perlu menambahkan kata 'mukjizat' di sini.
- source_word: וּבְמֹפְתִים
  choice: dan berbagai keajaiban
  rationale: מוֹפְתִים menunjuk pada keajaiban atau perbuatan ajaib dan lazim berpasangan dengan 'tanda-tanda'. Kata 'berbagai' membuat bentuk jamaknya wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton secara langsung; 'Yahweh' mempertahankannya sebagai nama perjanjian dan tidak menggantinya dengan gelar.
- issue: Nuansa מוֹרָא dalam rumusan keluaran
  choice: kedahsyatan yang besar
  alternative: kengerian besar atau perbuatan-perbuatan yang sangat dahsyat
  rationale: Istilah ini dapat menyatakan rasa takut atau sesuatu yang menimbulkan rasa takut dan takjub. Terjemahan utama tidak membatasi rujukannya hanya pada emosi manusia ataupun hanya pada tindakan tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan jelas. Metafora Ibrani 'tangan yang kuat' dan 'lengan yang terulur' dipertahankan, sedangkan pengulangan preposisi disusun secara alami tanpa menghilangkan rangkaian sarana tindakan ilahi.
