    issue: Penanda catatan b berada pada akhir kalimat, bukan pada frasa yang dijelaskannya.
    rationale: Catatan b menjelaskan לְשַׁכֵּן שְׁמוֹ שָׁם, sehingga jangkar perlu mengikuti "berdiam di sana" agar rujukannya tidak rancu.
  - severity: low
    issue: Frasa "hasil pertama segala hasil tanah" kurang alami.
    rationale: Penambahan "dari" dan penggunaan istilah "hasil sulung" menghasilkan konstruksi Indonesia yang lebih lancar serta mempertahankan arti sebagian dari hasil pertama.
  - severity: low
    issue: Catatan b menambahkan penjelasan "pusat kehadiran-Nya dalam ibadah".
    rationale: Penjelasan tersebut lebih interpretatif daripada yang diperlukan oleh idiom Ibrani. Alternatif yang lebih netral menjaga ambiguitas dan fungsi catatan leksikal.
