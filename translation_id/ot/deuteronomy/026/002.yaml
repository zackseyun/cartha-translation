review_pass:
  verdict: revise
  source_fidelity: 'Makna dasar diterjemahkan dengan setia: pengambilan sebagian hasil sulung, asal hasil dari negeri pemberian Yahweh, penempatan dalam wadah, dan perjalanan ke tempat pilihan Yahweh. Namun, frasa utama dapat dibuat lebih idiomatis tanpa mengurangi cakupan ''segala hasil tanah'', dan penanda catatan b perlu ditempatkan langsung pada idiom yang dijelaskannya.'
  naturalness: '"Sebagian dari hasil pertama segala hasil tanah" terasa bertumpuk dalam bahasa Indonesia modern. "Sebagian dari hasil sulung dari segala hasil tanah" lebih jelas dan tetap mencakup seluruh jenis hasil bumi, bukan hanya buah pohon. "Keranjang" lebih umum dan baku-modern daripada "bakul" dalam konteks ini.'
  terminology: Yahweh dipertahankan untuk יהוה. "Hasil sulung" merupakan istilah Indonesia yang lazim dan akurat untuk מֵרֵאשִׁית dalam konteks persembahan hasil pertama. Idiom "membuat nama-Nya berdiam" dipertahankan; catatannya dibatasi pada alternatif terjemahan dan tidak menambahkan penafsiran tentang pusat kehadiran ilahi.
  issues:
