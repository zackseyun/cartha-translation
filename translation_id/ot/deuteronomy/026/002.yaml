id: DEU.26.2
reference: Deuteronomy 26:2
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/לָקַחְתָּ֞ מֵ/רֵאשִׁ֣ית כָּל פְּרִ֣י הָ/אֲדָמָ֗ה אֲשֶׁ֨ר תָּבִ֧יא מֵֽ/אַרְצְ/ךָ֛ אֲשֶׁ֨ר יְהוָ֧ה אֱלֹהֶ֛י/ךָ נֹתֵ֥ן לָ֖/ךְ וְ/שַׂמְתָּ֣ בַ/טֶּ֑נֶא וְ/הָֽלַכְתָּ֙ אֶל הַ/מָּק֔וֹם אֲשֶׁ֤ר יִבְחַר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ לְ/שַׁכֵּ֥ן שְׁמ֖/וֹ שָֽׁם׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/002.yaml
  text: you shall take some of the firstfruits of all the fruit of the ground that you bring in from your land[a], which Yahweh your God is giving you, and put it in a basket[b], and go to the place that Yahweh your God will choose to make his name dwell there.
translation:
  language: id
  text: Ambillah sebagian dari hasil sulung dari segala hasil tanah[a] yang kaubawa dari negerimu, yang Yahweh, Allahmu, berikan kepadamu. Letakkanlah hasil itu dalam sebuah keranjang, lalu pergilah ke tempat yang akan dipilih Yahweh, Allahmu, untuk membuat nama-Nya berdiam di sana.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, menurut ungkapan tradisional, “buah sulung dari segala hasil tanah.”
    reason: lexical_alternative
  - marker: b
    text: Atau, “untuk menempatkan nama-Nya di sana.” Ini adalah ungkapan khas kitab Ulangan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: Ambillah
  rationale: Bentuk perfektum dengan waw dalam rangkaian hukum berfungsi sebagai perintah. Bentuk imperatif Indonesia menyampaikan daya instruksinya secara alami.
- source_word: מֵרֵאשִׁית כָּל פְּרִי הָאֲדָמָה
  choice: sebagian dari hasil pertama segala hasil tanah
  rationale: Preposisi מִן menunjukkan pengambilan sebagian dari bagian awal atau hasil pertama, bukan seluruh hasil pertama. Ungkapan ini mempertahankan hubungan dengan semua jenis hasil tanah tanpa membatasinya pada buah pohon.
- source_word: אֲשֶׁר תָּבִיא מֵאַרְצְךָ
  choice: yang kaubawa masuk dari negerimu
  rationale: Bentuk Hifil dari בוא mempertahankan gagasan membawa masuk hasil dari negeri itu; 'panen' akan lebih interpretatif.
- source_word: אֲשֶׁר יְהוָה אֱלֹהֶיךָ נֹתֵן לָךְ
  choice: yang diberikan Yahweh, Allahmu, kepadamu
  rationale: Partisipel נֹתֵן menggambarkan pemberian yang berlangsung atau menjadi ciri tetap. Bentuk pasif Indonesia menjaga hubungan klausa dengan 'negerimu' dan tetap menekankan negeri itu sebagai pemberian Yahweh.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama pribadi, bukan diganti dengan gelar.
- source_word: וְשַׂמְתָּ בַטֶּנֶא
  choice: Taruhlah hasil itu dalam sebuah bakul
  rationale: טֶנֶא adalah wadah anyaman untuk membawa hasil bumi. 'Hasil itu' memperjelas objek kolektif yang dalam bahasa Ibrani dibiarkan tersirat.
- source_word: וְהָלַכְתָּ אֶל הַמָּקוֹם
  choice: lalu pergilah ke tempat
  rationale: Menyampaikan urutan tindakan secara wajar sekaligus mempertahankan istilah 'tempat' yang penting dalam rumusan tempat ibadah di Ulangan.
- source_word: אֲשֶׁר יִבְחַר
  choice: yang akan dipilih
  rationale: Bentuk imperfek bersifat mendatang dari sudut pidato Musa.
- source_word: לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: untuk membuat nama-Nya berdiam di sana
  rationale: Mempertahankan bentuk kausatif dan ungkapan khas Ulangan tentang nama Allah yang berdiam di tempat pilihan-Nya, tanpa meratakannya menjadi sekadar kepemilikan atau penetapan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama pribadi. 'Yahweh' mempertahankan nama perjanjian itu tanpa menggantinya dengan gelar.
- issue: Rumusan tempat kudus לְשַׁכֵּן שְׁמוֹ שָׁם
  choice: untuk membuat nama-Nya berdiam di sana
  alternative: untuk menempatkan nama-Nya di sana
  rationale: Pilihan ini mempertahankan citra kausatif 'membuat berdiam' dan ketegangan teologis bahwa nama Allah berdiam di tempat pilihan-Nya, tanpa menyatakan bahwa Allah sendiri dibatasi secara ruang.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum yang khidmat tetapi mudah dipahami. Pronomina terikat seperti 'kaubawa' dipakai secara baku; 'bakul' dipilih sebagai istilah konkret untuk keranjang hasil bumi. Kapitalisasi 'nama-Nya' mengikuti kebiasaan penerbitan Alkitab Indonesia.
