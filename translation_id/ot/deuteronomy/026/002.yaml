revisions:
- from: Ambillah sebagian dari hasil pertama segala hasil tanah[a] yang kaubawa masuk dari negerimu, yang diberikan Yahweh, Allahmu, kepadamu. Taruhlah hasil itu dalam sebuah bakul, lalu pergilah ke tempat yang akan dipilih Yahweh, Allahmu, untuk membuat nama-Nya berdiam di sana.[b]
  to: Ambillah sebagian dari hasil sulung dari segala hasil tanah[a] yang kaubawa dari negerimu, yang Yahweh, Allahmu, berikan kepadamu. Letakkanlah hasil itu dalam sebuah keranjang, lalu pergilah ke tempat yang akan dipilih Yahweh, Allahmu, untuk membuat nama-Nya berdiam di sana.[b]
  rationale: Revisi memperbaiki kelancaran frasa hasil pertama, memakai "keranjang" sebagai istilah baku-modern, memindahkan jangkar b ke idiom Ibrani yang relevan, dan menetralkan catatan b agar tidak melampaui makna tekstual. Urutan perintah, nama ilahi, rujukan kepada negeri sebagai pemberian Yahweh, serta ungkapan kausatif tentang nama-Nya tetap dipertahankan.
