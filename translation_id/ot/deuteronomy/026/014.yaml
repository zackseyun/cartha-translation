  text: לֹא אָכַ֨לְתִּי בְ/אֹנִ֜י מִמֶּ֗/נּוּ וְ/לֹא בִעַ֤רְתִּי מִמֶּ֨/נּוּ֙ בְּ/טָמֵ֔א וְ/לֹא נָתַ֥תִּי מִמֶּ֖/נּוּ לְ/מֵ֑ת שָׁמַ֗עְתִּי בְּ/קוֹל֙ יְהוָ֣ה אֱלֹהָ֔/י עָשִׂ֕יתִי כְּ/כֹ֖ל אֲשֶׁ֥ר צִוִּיתָֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/014.yaml
  text: I have not eaten any of it while in mourning[a], and I have not removed any of it while unclean, and I have not given any of it for the dead. I have obeyed the voice of Yahweh my God[c][b]; I have done according to all that you commanded me.
translation:
  language: id
  text: Aku tidak memakan sedikit pun darinya ketika berkabung[a], tidak menyingkirkan sedikit pun darinya dalam keadaan tidak tahir[b], dan tidak memberikan sedikit pun darinya untuk orang mati[c]. Aku telah menaati suara Yahweh, Allahku; aku telah melakukan sesuai dengan segala yang Kauperintahkan kepadaku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “dalam masa perkabunganku”, “dalam dukacitaku”, atau “dalam penderitaan”.
    reason: lexical_alternative
  - marker: b
    text: Dapat juga diterjemahkan “membakar sedikit pun darinya” atau “menyingkirkan sedikit pun darinya”. Kata kerja Ibrani yang dipakai dapat berarti membakar atau menyingkirkan.
    reason: lexical_alternative
  - marker: c
    text: Dapat juga diterjemahkan “kepada orang mati” atau “berkaitan dengan orang mati”; penggunaan terlarang yang tepat tidak dijelaskan.
    reason: alternative_reading
lexical_decisions:
- source_word: בְּאֹנִי
  choice: ketika berkabung
  rationale: Kata אֹנִי dapat menunjuk pada dukacita, perkabungan, atau penderitaan. Dalam konteks ketahiran ritual ini, “ketika berkabung” menyampaikan keadaan si pembicara tanpa mempersempit maknanya secara berlebihan.
- source_word: בִעַרְתִּי מִמֶּנּוּ
  choice: menyingkirkan sedikit pun darinya
  rationale: Dalam bentuk Piel, בער dapat berarti membakar, menghabiskan, atau menyingkirkan. “Menyingkirkan” mempertahankan cakupan makna yang luas; kemungkinan arti “membakar” dicatat dalam catatan kaki.
- source_word: בְּטָמֵא
  choice: dalam keadaan najis
  rationale: Ungkapan ini menyatakan keadaan kenajisan ritual ketika bagian persembahan itu ditangani atau disingkirkan.
- source_word: לְמֵת
  choice: untuk orang mati
  rationale: Bahasa Ibrani tidak menjelaskan apakah yang dimaksud ialah pemberian kepada orang mati, pemakaian dalam ritus kematian, atau kaitan lain dengan kematian. Terjemahan ini sengaja mempertahankan keluasan tersebut.
- source_word: שָׁמַעְתִּי בְּקוֹל
  choice: Aku telah menaati suara
  rationale: Idiom שמע בקול menyatakan bukan sekadar mendengar, melainkan menanggapi dengan taat. Bentuk “menaati suara” juga mempertahankan gambaran bahasa sumber.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar.
- source_word: כְּכֹל אֲשֶׁר צִוִּיתָנִי
  choice: segala sesuatu yang Kauperintahkan kepadaku
  rationale: Frasa ini menegaskan ketaatan menyeluruh terhadap semua yang diperintahkan Allah dan disampaikan secara wajar dalam bahasa Indonesia.
theological_decisions:
- issue: Sifat penggunaan terlarang yang dinyatakan dengan לְמֵת
  choice: untuk orang mati
  alternative: untuk upacara kematian; kepada orang mati; berkaitan dengan jenazah
  rationale: Teks Ibrani sangat ringkas dan tidak menentukan praktik khusus yang dimaksud. Rumusan yang luas mempertahankan ambiguitas asli dan tidak memasukkan penjelasan ritual tertentu ke dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kata ganti orang pertama tunggal “Aku” sesuai dengan pernyataan liturgis pribadi; “Kau-” ditulis dengan huruf kapital karena merujuk kepada Allah. Pengulangan “sedikit pun darinya” mempertahankan tekanan tiga kali pada מִמֶּנּוּ dalam teks Ibrani.
