  text: וְ/לָקַ֧ח הַ/כֹּהֵ֛ן הַ/טֶּ֖נֶא מִ/יָּדֶ֑/ךָ וְ/הִ֨נִּיח֔/וֹ לִ/פְנֵ֕י מִזְבַּ֖ח יְהוָ֥ה אֱלֹהֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/004.yaml
  text: Then the priest shall take the basket from your hand and set it before the altar of Yahweh your God[a].
translation:
  language: id
  text: Lalu imam harus mengambil keranjang itu dari tanganmu dan meletakkannya di hadapan mezbah Yahweh, Allahmu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “YHWH”; secara tradisional diterjemahkan “TUHAN.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְלָקַח
  choice: Lalu ... harus mengambil
  rationale: Bentuk perfektum Qal dengan waw dalam rangkaian tata cara menyatakan langkah ritual berikutnya; “lalu” dan “harus mengambil” menyampaikan urutan serta kewajibannya secara wajar dalam bahasa Indonesia.
- source_word: הַכֹּהֵן
  choice: imam
  rationale: Nomina tunggal definit yang menunjuk kepada imam yang bertugas dalam ritual ini; kedefinitannya sudah jelas dalam konteks Indonesia.
- source_word: הַטֶּנֶא
  choice: keranjang itu
  rationale: טֶנֶא berarti keranjang, yaitu wadah hasil pertama yang telah disebut dalam konteks; “itu” menandai rujukan definit secara alami.
- source_word: מִיָּדֶךָ
  choice: dari tanganmu
  rationale: Mempertahankan gambaran konkret perpindahan keranjang dari tangan orang yang mempersembahkannya.
- source_word: וְהִנִּיחוֹ
  choice: dan meletakkannya
  rationale: Hifil נוח di sini berarti menempatkan atau meletakkan; akhiran objek merujuk kepada keranjang. Pilihan ini tidak menambahkan nuansa arah yang tidak dinyatakan.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Mengungkapkan relasi ruang dan nuansa kultis di depan mezbah dengan bahasa Indonesia yang alami dan bermartabat.
- source_word: מִזְבַּח
  choice: mazbah
  rationale: Istilah Indonesia yang mapan untuk tempat persembahan kurban dan membedakannya dari altar dalam penggunaan umum lain.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH dan mempertahankannya sebagai nama pribadi, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Mempertahankan akhiran orang kedua tunggal dan sapaan perjanjian yang langsung.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama YHWH secara langsung. “Yahweh” mempertahankan nama ilahi, sedangkan “TUHAN” merupakan penggantian tradisional dengan gelar; catatan kaki memberi tahu pembaca tentang bentuk Ibraninya dan tradisi tersebut.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur prosedural dipertahankan tanpa kekakuan yang tidak perlu; bentuk orang kedua tunggal diterjemahkan dengan akhiran -mu.
