  text: וְ/שָׂמַחְתָּ֣ בְ/כָל הַ/טּ֗וֹב אֲשֶׁ֧ר נָֽתַן לְ/ךָ֛ יְהוָ֥ה אֱלֹהֶ֖י/ךָ וּ/לְ/בֵיתֶ֑/ךָ אַתָּה֙ וְ/הַ/לֵּוִ֔י וְ/הַ/גֵּ֖ר אֲשֶׁ֥ר בְּ/קִרְבֶּֽ/ךָ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/011.yaml
  text: And you shall rejoice in all the good that Yahweh your God has given to you and to your household—you[a], and the Levite, and the sojourner who is among you.
translation:
  language: id
  text: Bersukacitalah atas segala kebaikan yang telah Yahweh, Allahmu, berikan kepadamu dan seisi rumahmu—engkau, orang Lewi, dan penduduk asing[a] yang ada di antaramu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “orang asing yang menetap.” Kata Ibrani גֵּר menunjuk pada orang bukan Israel yang tinggal di tengah bangsa Israel di bawah perlindungan komunitasnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׂמַחְתָּ
  choice: Bersukacitalah
  rationale: Bentuk perfek Qal dengan waw dalam konteks petunjuk ini berfungsi sebagai perintah. Bentuk ini menyampaikan kegembiraan sekaligus suasana perayaan perjanjian.
- source_word: בְכָל הַטּוֹב
  choice: atas segala kebaikan
  rationale: Preposisi בְּ di sini menyatakan hal atau alasan yang menjadi dasar sukacita. Ungkapan ini alami dalam bahasa Indonesia dan tidak membatasi הַטּוֹב hanya pada benda-benda materi.
- source_word: אֲשֶׁר נָתַן לְךָ
  choice: yang telah diberikan ... kepadamu
  rationale: Klausa relatif dan tindakan pemberian yang telah terjadi diterjemahkan secara langsung, dengan hasilnya yang masih dinikmati tersirat melalui bentuk 'telah diberikan'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai nama diri, bukan diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Ungkapan perjanjian dan sufiks orang kedua tunggal dipertahankan secara ringkas dan alami.
- source_word: וּלְבֵיתֶךָ
  choice: dan seisi rumahmu
  rationale: בַּיִת dalam konteks ini menunjuk pada rumah tangga atau seluruh anggota rumah, bukan semata-mata bangunannya.
- source_word: אַתָּה
  choice: engkau
  rationale: Pronomina yang dinyatakan secara eksplisit dalam bahasa Ibrani dipertahankan untuk penekanan dan sebagai unsur pertama dalam daftar orang yang bersukacita.
- source_word: הַלֵּוִי
  choice: orang Lewi
  rationale: Sebutan ini secara tepat menunjuk pada anggota suku Lewi dan merupakan bentuk yang lazim dalam bahasa Indonesia.
- source_word: הַגֵּר
  choice: pendatang
  rationale: Istilah ini menunjuk pada orang bukan pribumi yang menetap di tengah Israel dan berada dalam perlindungan komunitas. 'Pendatang' mudah dipahami, sementara catatan kaki menjelaskan status menetapnya.
- source_word: אֲשֶׁר בְּקִרְבֶּךָ
  choice: yang tinggal di tengah-tengahmu
  rationale: Tambahan 'tinggal' mengungkapkan secara alami hubungan menetap yang terkandung dalam konteks גֵּר, sedangkan 'di tengah-tengahmu' mempertahankan gambaran komunal teks Ibrani.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai Tetragramaton sebagai nama diri Allah. Bentuk 'Yahweh' mempertahankan fungsi nama perjanjian tanpa menggantinya dengan gelar.
- issue: Cakupan orang yang ikut bersukacita
  choice: engkau, orang Lewi, dan pendatang
  alternative: memahami daftar itu hanya sebagai penerima pemberian
  rationale: Susunan Ibrani menempatkan daftar setelah pemberian kepada 'engkau dan rumahmu', sehingga paling wajar daftar tersebut menyebut pihak-pihak yang ikut bersukacita. Tanda pisah mempertahankan hubungan ini tanpa mengubahnya menjadi klausa penjelas yang terlalu tegas.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan mudah dipahami. 'Bersukacitalah' mempertahankan corak ibadah-perayaan, sedangkan 'seisi rumahmu' dan 'pendatang' menghindari ungkapan yang kaku. Penanda catatan kaki ditempatkan langsung sesudah istilah yang dijelaskannya.
