  text: וְ/אָמַרְתָּ֡ לִ/פְנֵי֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ בִּעַ֧רְתִּי הַ/קֹּ֣דֶשׁ מִן הַ/בַּ֗יִת וְ/גַ֨ם נְתַתִּ֤י/ו לַ/לֵּוִי֙ וְ/לַ/גֵּר֙ לַ/יָּת֣וֹם וְ/לָ/אַלְמָנָ֔ה כְּ/כָל מִצְוָתְ/ךָ֖ אֲשֶׁ֣ר צִוִּיתָ֑/נִי לֹֽא עָבַ֥רְתִּי מִ/מִּצְוֺתֶ֖י/ךָ וְ/לֹ֥א שָׁכָֽחְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/013.yaml
  text: Then you shall say before Yahweh your God[a], ‘I have removed the holy portion from the house, and I have also given it to the Levite, the sojourner, the fatherless, and the widow, according to all your commandment that you commanded me. I have not transgressed your commandments[c][b], nor have I forgotten them.’
translation:
  language: id
  text: Kemudian engkau harus berkata di hadapan Yahweh, Allahmu, “Aku telah mengeluarkan bagian yang kudus[a] dari rumah dan juga telah memberikannya kepada orang Lewi, pendatang[b], anak yatim, dan janda, sesuai dengan segala perintah yang Kauperintahkan kepadaku. Aku tidak melanggar perintah-perintah-Mu dan tidak melupakannya.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bagian yang disucikan” atau “barang yang kudus”; ungkapan Ibrani ini menunjuk pada persepuluhan atau hasil yang telah dikhususkan untuk dibagikan.
    reason: lexical_alternative
  - marker: b
    text: Atau “orang asing yang menetap”.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ
  choice: Kemudian engkau harus berkata
  rationale: Konjungsi dengan bentuk verbal ini melanjutkan urutan tata cara. 'Kemudian' menyatakan perkembangan urutan secara alami, sedangkan 'harus' mempertahankan daya perintahnya.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: di hadapan Yahweh, Allahmu
  rationale: לִפְנֵי berarti 'di hadapan/dalam kehadiran'. Nama perjanjian יְהוָה ditransliterasikan sebagai 'Yahweh'.
- source_word: בִּעַרְתִּי
  choice: Aku telah mengeluarkan
  rationale: Dalam konteks ini verba tersebut berarti menyingkirkan atau mengeluarkan persembahan persepuluhan yang dikhususkan dari rumah, bukan membakarnya.
- source_word: הַקֹּדֶשׁ
  choice: bagian yang kudus
  rationale: Secara harfiah berarti 'yang kudus', tetapi dalam konteks menunjuk pada hasil atau persepuluhan yang dikhususkan untuk dibagikan. 'Bagian yang kudus' cukup jelas tanpa terlalu menjelaskan.
- source_word: מִן הַבַּיִת
  choice: dari rumah
  rationale: Mempertahankan bentuk definit sumber tanpa menambahkan 'rumahku', meskipun kepemilikan pembicara tersirat oleh konteks.
- source_word: וְגַם נְתַתִּיו
  choice: dan memberikannya
  rationale: Akhiran pronominal menunjuk kembali kepada bagian kudus. Kata 'juga' tidak dinyatakan secara terpisah karena dalam bahasa Indonesia penambahan tindakan telah tersampaikan secara alami oleh 'dan', tanpa mengubah isinya.
- source_word: לַלֵּוִי
  choice: kepada orang Lewi
  rationale: Teks menyebut orang Lewi, bukan secara khusus imam Lewi.
- source_word: לַגֵּר
  choice: pendatang
  rationale: גֵּר menunjuk orang luar yang menetap di tengah Israel. 'Pendatang' merupakan istilah Indonesia yang alami; catatan memberi alternatif yang lebih eksplisit.
- source_word: לַיָּתוֹם
  choice: anak yatim
  rationale: Istilah ini menyatakan kelompok rentan yang kehilangan ayah. 'Anak yatim' adalah padanan Indonesia yang lazim dan tepat.
- source_word: וְלָאַלְמָנָה
  choice: dan janda
  rationale: Padanan langsung dan alami bagi kelompok sosial yang disebut.
- source_word: כְּכָל מִצְוָתְךָ אֲשֶׁר צִוִּיתָנִי
  choice: sesuai dengan segala perintah yang Kauperintahkan kepadaku
  rationale: Bentuk tunggal מִצְוָה dapat bersifat kolektif. Pengulangan 'perintah/Kauperintahkan' dipertahankan untuk mencerminkan penekanan Ibrani.
- source_word: לֹא עָבַרְתִּי מִמִּצְוֺתֶיךָ
  choice: Aku tidak melanggar perintah-perintah-Mu
  rationale: עבר מן dalam konteks hukum berarti melewati batas atau melanggar. Bentuk jamak objek dipertahankan.
- source_word: וְלֹא שָׁכָחְתִּי
  choice: dan tidak melupakannya
  rationale: Objek tersirat mengacu pada perintah-perintah Yahweh; sufiks '-nya' menyampaikannya secara alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani menggunakan Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Cakupan pengakuan ketaatan
  choice: Aku tidak melanggar perintah-perintah-Mu dan tidak melupakannya
  alternative: Aku tidak melanggar satu pun perintah-Mu dan tidak melupakannya
  rationale: Teks menyatakan bentuk jamak tanpa kata eksplisit yang berarti 'satu pun'. Terjemahan mempertahankan cakupan yang ada tanpa menambah penegasan universal.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina orang kedua tunggal dipertahankan melalui 'engkau' dalam pengantar dan bentuk terikat hormat '-Mu/Kau-' dalam doa pengakuan. Struktur deklaratif dan pengulangan sumber dijaga, sementara susunan daftar dibuat alami bagi pembaca Indonesia.
