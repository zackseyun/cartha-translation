  text: הַשְׁקִיפָ/ה֩ מִ/מְּע֨וֹן קָדְשְׁ/ךָ֜ מִן הַ/שָּׁמַ֗יִם וּ/בָרֵ֤ךְ אֶֽת עַמְּ/ךָ֙ אֶת יִשְׂרָאֵ֔ל וְ/אֵת֙ הָ/אֲדָמָ֔ה אֲשֶׁ֥ר נָתַ֖תָּה לָ֑/נוּ כַּ/אֲשֶׁ֤ר נִשְׁבַּ֨עְתָּ֙ לַ/אֲבֹתֵ֔י/נוּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/015.yaml
  text: Look down from your holy dwelling[a], from heaven, and bless your people Israel and the land that you have given us, as you swore to our fathers, a land flowing with milk and honey.
translation:
  language: id
  text: Pandanglah dari tempat kediaman-Mu yang kudus di surga dan berkatilah umat-Mu Israel serta tanah yang telah Kauberikan kepada kami, sebagaimana yang telah Kauikrarkan dengan sumpah kepada para bapa leluhur kami[a], negeri yang berlimpah dengan susu dan madu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “bapa-bapa kami.” Ungkapan ini dalam rumusan perjanjian terutama merujuk kepada para patriark Israel; dapat juga diterjemahkan “leluhur kami.”
    reason: Menjelaskan bentuk maskulin Ibrani dan alternatif idiomatis tanpa menghilangkan rujukan sumber dalam teks utama.
lexical_decisions:
- source_word: הַשְׁקִיפָה
  choice: Pandanglah ke bawah
  rationale: Bentuk perintah ini meminta Allah mengarahkan pandangan dari tempat yang tinggi; frasa ini mempertahankan unsur melihat dan sudut pandang dari surga.
- source_word: מִמְּעוֹן קָדְשְׁךָ
  choice: dari tempat kediaman-Mu yang kudus
  rationale: מָעוֹן berarti tempat tinggal atau kediaman; ungkapan ini alami dalam bahasa Indonesia dan mempertahankan sifat kudus tempat itu.
- source_word: מִן הַשָּׁמַיִם
  choice: dari surga
  rationale: Walaupun bentuk Ibraninya secara morfologis jamak, dalam ungkapan lokasi ini maknanya wajar disampaikan dengan bentuk tunggal 'surga' dalam bahasa Indonesia.
- source_word: וּבָרֵךְ
  choice: dan berkatilah
  rationale: Padanan langsung dan lazim bagi bentuk perintah dari akar ברך.
- source_word: עַמְּךָ אֶת יִשְׂרָאֵל
  choice: umat-Mu Israel
  rationale: Susunan aposisional Ibrani mengidentifikasi umat milik Allah itu sebagai Israel.
- source_word: הָאֲדָמָה
  choice: tanah
  rationale: אֲדָמָה dapat menunjuk tanah yang dihuni atau diolah. 'Tanah' sesuai konteks hasil pertama dan sekaligus mempertahankan perbedaan leksikal dengan אֶרֶץ, yang kemudian diterjemahkan 'negeri'.
- source_word: אֲשֶׁר נָתַתָּה לָנוּ
  choice: yang telah Kauberikan kepada kami
  rationale: Bentuk perfektif menyatakan pemberian yang sudah dilakukan dan tetap relevan bagi para pendoa.
- source_word: כַּאֲשֶׁר נִשְׁבַּעְתָּ לַאֲבֹתֵינוּ
  choice: seperti yang telah Kaujanjikan dengan sumpah kepada para leluhur kami
  rationale: Ungkapan ini menyampaikan tindakan bersumpah secara alami dalam bahasa Indonesia. 'Para leluhur' mudah dipahami, sedangkan bentuk maskulin harfiahnya dijelaskan dalam catatan kaki.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: negeri yang berlimpah susu dan madu
  rationale: Ungkapan Ibrani menggambarkan kesuburan dan kelimpahan. 'Berlimpah' menyampaikan idiom 'mengalir' secara alami tanpa menghilangkan maksudnya.
theological_decisions:
- issue: Makna לַאֲבֹתֵינוּ dalam rumusan perjanjian
  choice: para leluhur kami
  alternative: bapak-bapak kami
  rationale: Kata Ibrani berbentuk maskulin dan dalam konteks ini terutama mengacu kepada para bapa leluhur Israel. Teks utama memakai ungkapan Indonesia yang alami, sementara catatan kaki mempertahankan informasi bentuk harfiah dan rujukan perjanjiannya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Perbedaan antara אֲדָמָה ('tanah') dan אֶרֶץ ('negeri') dipertahankan.
