  text: And the Egyptians treated us badly and afflicted us[c][b][a], and laid hard labor on us.
translation:
  language: id
  text: Orang Mesir memperlakukan kami dengan buruk[a], menindas kami[b], dan membebani kami dengan kerja berat[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “berbuat jahat terhadap kami” atau “memperlakukan kami dengan kejam.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “menyengsarakan kami.”'
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “menimpakan pekerjaan berat kepada kami.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֵעוּ אֹתָנוּ
  choice: memperlakukan kami dengan buruk
  rationale: Bentuk Hifil dari רעע menyatakan tindakan mencelakakan atau memperlakukan seseorang dengan buruk. Ungkapan ini alami dalam bahasa Indonesia dan tidak mempersempit maknanya menjadi jenis kekerasan tertentu.
- source_word: הַמִּצְרִים
  choice: Orang Mesir
  rationale: Sebutan definit bagi bangsa atau penduduk Mesir sebagai kelompok yang menindas Israel.
- source_word: וַיְעַנּוּנוּ
  choice: menindas kami
  rationale: Bentuk Piel dari ענה dapat berarti menindas, menyengsarakan, atau merendahkan. 'Menindas' jelas dan wajar dalam konteks ini serta tetap dibedakan dari verba sebelumnya.
- source_word: וַיִּתְּנוּ עָלֵינוּ
  choice: membebani kami dengan
  rationale: Idiom נתן על menyatakan menaruh atau mengenakan sesuatu atas seseorang. Dalam bahasa Indonesia, 'membebani ... dengan' mempertahankan citra beban sekaligus terdengar alami.
- source_word: עֲבֹדָה קָשָׁה
  choice: kerja berat
  rationale: עֲבֹדָה berarti kerja, pelayanan, atau pengabdian, sedangkan קָשָׁה berarti berat atau keras. 'Kerja berat' menyampaikan kerja paksa yang membebani tanpa menambahkan unsur yang tidak dinyatakan langsung.
theological_decisions:
- issue: Pembedaan rangkaian ungkapan penindasan
  choice: 'Memakai tiga ungkapan berbeda: ''memperlakukan kami dengan buruk'', ''menindas kami'', dan ''membebani kami dengan kerja berat''.'
  alternative: Melebur dua verba pertama menjadi satu gagasan penindasan, atau memakai istilah perbudakan yang lebih kuat dalam setiap klausa.
  rationale: Teks Ibrani memakai rangkaian verba yang berkaitan tetapi tidak sama. Mempertahankan perbedaannya menjaga perkembangan retoris teks tanpa menambahkan penafsiran historis atau doktrinal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan naratif yang lugas dan bermartabat. Pengulangan 'kami' dipertahankan untuk mencerminkan objek jamak orang pertama pada rangkaian verba Ibrani; struktur klausa dibuat alami bagi pembaca umum.
