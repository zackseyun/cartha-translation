base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/007.yaml
  text: Then we cried out to Yahweh[a], the God of our fathers, and Yahweh heard our voice and saw our affliction, our labor[b], and our oppression.
translation:
  language: id
  text: Lalu kami berseru kepada Yahweh[a], Allah nenek moyang kami, dan Yahweh mendengar suara kami[b] serta melihat kesengsaraan kami, jerih payah kami, dan penindasan kami.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Yahweh adalah nama ilahi yang dalam banyak terjemahan ditulis “TUHAN”.
    reason: Menjelaskan transliterasi nama יהוה.
  - marker: b
    text: Ungkapan harfiahnya “mendengar suara kami”; dalam konteks ini maksudnya mendengar seruan mereka.
    reason: Menjelaskan idiom Ibrani tanpa menghilangkan bentuk ungkapannya dari teks utama.
lexical_decisions:
- source_word: וַנִּצְעַק
  choice: kami berseru
  rationale: Kata kerja צעק menyatakan seruan mendesak untuk meminta pertolongan; “berseru” alami dalam bahasa Indonesia dan mempertahankan kesungguhan seruan itu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: אֱלֹהֵי אֲבֹתֵינוּ
  choice: Allah leluhur kami
  rationale: Ungkapan ini menunjuk kepada Allah yang disembah para pendahulu Israel dan mengingatkan pada hubungan perjanjian; “leluhur” merupakan padanan Indonesia yang alami tanpa mengubah rujukan kolektifnya.
- source_word: וַיִּשְׁמַע ... אֶת קֹלֵנוּ
  choice: mendengar suara kami
  rationale: Terjemahan ini mempertahankan ungkapan konkret bahasa Ibrani; dalam konteksnya, artinya Yahweh mendengar seruan mereka.
- source_word: עָנְיֵנוּ
  choice: kesengsaraan kami
  rationale: עֳנִי menunjuk pada keadaan menderita, sengsara, atau tertindas; “kesengsaraan” sesuai dengan konteks perbudakan di Mesir.
- source_word: עֲמָלֵנוּ
  choice: jerih payah kami
  rationale: עָמָל dapat berarti kerja berat, jerih payah, atau kesusahan. “Jerih payah” mempertahankan unsur kerja yang membebani dan membedakannya dari kesengsaraan serta penindasan.
- source_word: לַחֲצֵנוּ
  choice: penindasan kami
  rationale: לַחַץ menggambarkan tekanan atau penindasan oleh pihak lain; “penindasan” paling tepat dalam konteks Mesir.
theological_decisions:
- issue: Penerjemahan nama perjanjian יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks memakai nama diri ilahi יהוה. Bentuk “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Identitas Allah sebagai אֱלֹהֵי אֲבֹתֵינוּ
  choice: Allah leluhur kami
  alternative: Allah nenek moyang kami; Allah para bapak kami
  rationale: “Allah leluhur kami” mempertahankan hubungan historis dan perjanjian dengan para pendahulu Israel, sekaligus terdengar wajar dalam bahasa Indonesia modern.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan tiga penderitaan dipertahankan agar perbedaan antara kesengsaraan, jerih payah, dan penindasan tetap terdengar.
