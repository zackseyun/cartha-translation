- from: Kemudian, di hadapan Yahweh, Allahmu, engkau harus menjawab dan berkata, “Bapakku adalah seorang Aram yang hampir binasa.[a] Ia pergi ke Mesir dan tinggal di sana sebagai pendatang bersama sejumlah kecil orang. Di sana ia menjadi bangsa yang besar, kuat, dan banyak jumlahnya.”
  to: Hendaklah engkau menjawab dan berkata di hadapan Yahweh, Allahmu, “Bapakku adalah seorang Aram yang sedang binasa.[a] Ia turun ke Mesir dan tinggal di sana sebagai pendatang bersama sedikit orang. Di sana ia menjadi sebuah bangsa yang besar, kuat, dan banyak.”
