  verdict: revise
  source_fidelity: Revisi diperlukan untuk menghilangkan tambahan makna yang tidak jelas dalam teks sumber (“Kemudian” dan terutama nuansa ‘hampir’), memulihkan ‘turun ke Mesir’, dan mempertahankan nuansa גּוּר sebagai tinggal sebagai pendatang. Bacaan utama tetap memakai salah satu arti leksikal yang mungkin bagi אֹבֵד, sementara alternatif ‘mengembara’ dipertahankan dalam catatan kaki.
  naturalness: Teks hasil revisi tetap memakai bahasa Indonesia modern yang khidmat. ‘Hendaklah engkau menjawab dan berkata’ cocok untuk rumusan liturgis, sedangkan ‘turun ke Mesir’ lazim dan dapat dipahami dalam gaya Alkitab.
  terminology: ‘Yahweh’, ‘Allahmu’, ‘Aram’, dan ‘bangsa yang besar, kuat, dan banyak’ sesuai dengan istilah sumber dan register proyek. ‘Seorang Aram yang sedang binasa’ menerjemahkan partisip אֹבֵד tanpa menambahkan penanda kedekatan (‘hampir’) yang tidak dinyatakan secara eksplisit.
  issues:
