  text: וְ/עָנִ֨יתָ וְ/אָמַרְתָּ֜ לִ/פְנֵ֣י יְהוָ֣ה אֱלֹהֶ֗י/ךָ אֲרַמִּי֙ אֹבֵ֣ד אָבִ֔/י וַ/יֵּ֣רֶד מִצְרַ֔יְמָ/ה וַ/יָּ֥גָר שָׁ֖ם בִּ/מְתֵ֣י מְעָ֑ט וַֽ/יְהִי שָׁ֕ם לְ/ג֥וֹי גָּד֖וֹל עָצ֥וּם וָ/רָֽב׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/005.yaml
  text: And you shall answer and say before Yahweh your God[a], ‘My father was a perishing Aramean, and he went down to Egypt and sojourned there, few in number; and there he became a great, mighty, and numerous nation.’
translation:
  language: id
  text: Hendaklah engkau menjawab dan berkata di hadapan Yahweh, Allahmu, “Bapakku adalah seorang Aram yang sedang binasa.[a] Ia turun ke Mesir dan tinggal di sana sebagai pendatang bersama sedikit orang. Di sana ia menjadi sebuah bangsa yang besar, kuat, dan banyak.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “yang mengembara.” Partisip Ibrani yang dipakai dapat berarti “sedang binasa” maupun “mengembara.”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָנִיתָ וְאָמַרְתָּ
  choice: engkau harus menjawab dan berkata
  rationale: Mempertahankan rumusan Ibrani berpasangan yang memperkenalkan pengakuan liturgis, sekalipun ungkapan ini agak formal dalam bahasa Indonesia.
- source_word: לִפְנֵי יְהוָה אֱלֹהֶיךָ
  choice: di hadapan Yahweh, Allahmu
  rationale: “Di hadapan” menyampaikan makna kehadiran resmi dalam upacara, sedangkan nama ilahi יהוה ditransliterasikan sebagai “Yahweh” sesuai kebijakan proyek.
- source_word: אֲרַמִּי
  choice: seorang Aram
  rationale: Menunjukkan identitas etnis secara tepat tanpa memakai istilah geografis modern “orang Suriah”.
- source_word: אֹבֵד
  choice: yang hampir binasa
  rationale: Partisip aktif dari אבד dapat menggambarkan seseorang yang sedang menuju kebinasaan atau dalam keadaan terancam. Kata “hampir” membuat nuansa progresif itu wajar dalam bahasa Indonesia; kemungkinan “mengembara” tetap dicatat dalam catatan kaki.
- source_word: אָבִי
  choice: Bapakku
  rationale: Mempertahankan bentuk tunggal dan ungkapan konkret teks Ibrani, yang menunjuk kepada leluhur Israel secara representatif.
- source_word: וַיֵּרֶד מִצְרַיְמָה
  choice: Ia pergi ke Mesir
  rationale: Bahasa Indonesia tidak lazim memakai arah “turun” untuk perjalanan ke Mesir tanpa konteks geografis tambahan; “pergi” menyampaikan tindakan secara alami.
- source_word: וַיָּגָר שָׁם
  choice: tinggal di sana sebagai pendatang
  rationale: גור berarti menetap sebagai orang asing atau pendatang, bukan sekadar tinggal biasa.
- source_word: בִּמְתֵי מְעָט
  choice: bersama sejumlah kecil orang
  rationale: Menyampaikan bahwa rombongan yang menyertainya sedikit, serta menghindari kesan tidak gramatikal bahwa satu orang sendiri “sedikit jumlahnya”.
- source_word: וַיְהִי שָׁם לְגוֹי
  choice: Di sana ia menjadi bangsa
  rationale: 'Mempertahankan subjek tunggal representatif: sang leluhur menjadi suatu bangsa melalui keturunannya.'
- source_word: גָּדוֹל עָצוּם וָרָב
  choice: besar, kuat, dan banyak jumlahnya
  rationale: Menjaga tiga unsur bertumpuk yang menekankan kebesaran, kekuatan, dan banyaknya penduduk bangsa itu.
theological_decisions:
- issue: Makna אֲרַמִּי אֹבֵד אָבִי
  choice: Bapakku adalah seorang Aram yang hampir binasa
  alternative: Bapakku adalah seorang Aram yang mengembara
  rationale: Susunan dan vokalisasi Masoret paling langsung menjadikan “bapakku” subjek, sedangkan אֹבֵד dapat dipahami sebagai “hampir binasa” atau, menurut pemahaman tradisional lain, “mengembara”. Bacaan utama menonjolkan keadaan leluhur yang terancam sebelum berkembang menjadi bangsa besar; catatan kaki mempertahankan ambiguitas leksikal yang nyata. Tafsiran “seorang Aram berusaha membinasakan bapakku” tidak dipilih karena memerlukan penataan sintaksis yang lebih interpretatif.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan mudah dipahami. Bentuk “engkau” dipakai untuk sapaan tunggal sesuai teks. Ungkapan formal “menjawab dan berkata” sengaja dipertahankan karena merupakan rumusan pengakuan liturgis.
