    issue: ‘Kemudian’ ditambahkan pada awal kalimat.
    rationale: Kata ini dapat memberi urutan temporal yang lebih tegas daripada formula waw pembuka dalam konteks instruksi liturgis. Tidak diperlukan untuk bahasa Indonesia yang alami.
  - severity: medium
    issue: ‘Hampir binasa’ menambahkan nuansa ‘nyaris’ yang tidak eksplisit dalam אֹבֵד.
    rationale: Partisip itu dapat berarti ‘binasa/sedang binasa’ atau, menurut pembacaan lain, ‘mengembara’. ‘Hampir’ mempersempitnya menjadi keadaan yang nyaris terjadi.
  - severity: low
    issue: ‘Pergi ke Mesir’ tidak mencerminkan arah dalam וַיֵּרֶד.
    rationale: ‘Turun ke Mesir’ dapat dipakai secara alami dalam gaya Alkitab Indonesia dan mempertahankan verba sumber.
  - severity: low
    issue: Catatan kaki memasukkan ‘tersesat’, yang tidak diperlukan oleh alternatif yang didukung jejak audit.
    rationale: Alternatif yang perlu dijaga adalah ‘mengembara’; penambahan ‘tersesat’ memperluas pilihan makna dan dapat mengaburkan ambiguitas yang dimaksud.
