id: DEU.26.1
reference: Deuteronomy 26:1
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/הָיָה֙ כִּֽי תָב֣וֹא אֶל הָ/אָ֔רֶץ אֲשֶׁר֙ יְהוָ֣ה אֱלֹהֶ֔י/ךָ נֹתֵ֥ן לְ/ךָ֖ נַחֲלָ֑ה וִֽ/ירִשְׁתָּ֖/הּ וְ/יָשַׁ֥בְתָּ בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/026/001.yaml
  text: And when you come into the land that Yahweh your God is giving you as an inheritance[a], and you take possession of it and live in it[b],
translation:
  language: id
  text: Ketika engkau memasuki tanah yang Yahweh, Allahmu, berikan kepadamu sebagai warisan[a], lalu engkau mengambilnya menjadi milikmu dan tinggal di sana[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sebagai milik pusaka.” Kata Ibrani ini dapat menunjuk pada warisan atau bagian milik yang tetap.
    reason: lexical_alternative
  - marker: b
    text: Atau “menetap di sana” atau “berdiam di sana.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: Apabila
  rationale: Formula temporal Ibrani ini memperkenalkan keadaan yang akan datang. 'Apabila' alami dalam bahasa Indonesia dan mempertahankan sifat temporalnya tanpa terjemahan harfiah yang kaku.
- source_word: תָבֹוא אֶל הָאָרֶץ
  choice: engkau memasuki negeri
  rationale: בוא dengan אֶל menyatakan masuk ke suatu wilayah. 'Memasuki negeri' lebih alami daripada 'datang ke dalam negeri' dan mempertahankan sapaan orang kedua tunggal.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Mencerminkan bentuk dengan akhiran orang kedua tunggal dan mempertahankan sapaan perjanjian kepada Israel sebagai satu kesatuan.
- source_word: נֹתֵן לְךָ
  choice: diberikan ... kepadamu
  rationale: Partisipel Ibrani menggambarkan tindakan pemberian yang sedang atau segera diwujudkan. Bentuk ini idiomatis dalam anak kalimat bahasa Indonesia dan tidak mengubahnya menjadi janji masa depan yang terlalu tegas.
- source_word: נַחֲלָה
  choice: sebagai milik pusaka
  rationale: '''Milik pusaka'' menyampaikan tanah yang dianugerahkan sebagai bagian warisan atau jatah tetap, sekaligus menghindari kesan bahwa yang dimaksud hanya harta warisan keluarga biasa.'
- source_word: וִירִשְׁתָּהּ
  choice: lalu engkau mengambilnya menjadi milikmu
  rationale: Dalam konteks tanah, ירשׁ menunjuk pada tindakan mengambil dan menguasai sebagai milik. Ungkapan ini membedakannya dari נַחֲלָה dan mempertahankan unsur aktifnya.
- source_word: וְיָשַׁבְתָּ בָּהּ
  choice: dan tinggal di sana
  rationale: ישׁב di sini berarti menetap atau berdiam di negeri itu. 'Tinggal di sana' merupakan ungkapan Indonesia modern yang alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama diri ilahi. 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar atau memilih bentuk transliterasi alternatif.
- issue: Hubungan antara karunia Allah dan penguasaan Israel
  choice: Membedakan tindakan Yahweh memberikan negeri itu dari tindakan Israel mengambilnya menjadi milik dan tinggal di sana
  alternative: Meringkas seluruh rangkaian sebagai Israel menerima negeri itu
  rationale: 'Urutan Ibrani mempertahankan bersama-sama prakarsa ilahi dan tindakan manusia: masuk, menerima negeri sebagai pemberian, mengambilnya menjadi milik, lalu tinggal di sana.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'Engkau' mempertahankan sapaan orang kedua tunggal dalam teks Ibrani. Kalimat dibiarkan berakhir dengan koma karena ayat ini merupakan anak kalimat yang berlanjut ke ayat berikutnya.
