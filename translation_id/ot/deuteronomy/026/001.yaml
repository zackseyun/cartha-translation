  source_fidelity: 'Draf ini pada dasarnya mempertahankan urutan dan unsur-unsur Ibrani: memasuki tanah, pemberian oleh Yahweh, pengambilan milik, dan tinggal di dalamnya. Namun, “Apabila” dapat dibaca lebih kondisional daripada formula temporal וְהָיָה כִּי; “Ketika” menyatakan waktunya dengan lebih langsung. Menjadikan Yahweh subjek eksplisit dalam anak relatif juga lebih jelas daripada bentuk pasif “yang diberikan Yahweh.”'
  naturalness: 'Bahasa draf sudah baku dan mengalir. Revisi kecil membuat hubungan sintaksis lebih lugas dalam bahasa Indonesia modern: “tanah yang Yahweh, Allahmu, berikan kepadamu.” “Tanah” juga lebih langsung untuk הָאָרֶץ dalam konteks tanah perjanjian.'
  terminology: “Yahweh” tepat untuk יְהוָה, dan “Allahmu” mempertahankan akhiran orang kedua tunggal. “Warisan” adalah padanan modern yang jelas bagi נַחֲלָה; catatan kaki mempertahankan “milik pusaka” sebagai alternatif. “Mengambilnya menjadi milikmu” secara wajar menyampaikan וִירִשְׁתָּהּ tanpa menghapus pembedaan antara pemberian ilahi dan tindakan mengambil milik.
