- from: Apabila engkau memasuki negeri yang diberikan Yahweh, Allahmu, kepadamu sebagai milik pusaka[a], lalu engkau mengambilnya menjadi milikmu dan tinggal di sana[b],
  to: Ketika engkau memasuki tanah yang Yahweh, Allahmu, berikan kepadamu sebagai warisan[a], lalu engkau mengambilnya menjadi milikmu dan tinggal di sana[b],
  rationale: Revisi mempertajam fungsi temporal pembuka kalimat, menyatakan Yahweh secara eksplisit sebagai pelaku pemberian, dan memakai “tanah” serta “warisan” sebagai padanan modern yang langsung. Urutan tindakan dalam teks Ibrani tetap dipertahankan, termasuk koma akhir yang menandai kelanjutan ke ayat berikutnya.
