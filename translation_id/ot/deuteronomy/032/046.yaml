base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/046.yaml
  text: And he said to them[a], “Set your heart on all the words that I am testifying to you today, which you shall command your sons to keep[b], to do all the words of this law.”
translation:
  language: id
  text: Lalu ia berkata kepada mereka, “Camkanlah segala perkataan yang pada hari ini kusampaikan sebagai kesaksian kepada kalian[a], yang harus kalian perintahkan kepada putra-putra kalian[b] untuk memelihara dan melakukan segala perkataan hukum ini.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang pada hari ini kuperingatkan kepada kalian” atau “yang pada hari ini kusaksikan terhadap kalian.” Kata kerja Ibrani ini dapat mengandung makna kesaksian, peringatan, atau daya forensik dalam konteks perjanjian.
    reason: alternative_reading
  - marker: b
    text: Secara harfiah, “putra-putra kalian”; ungkapan ini dapat mewakili generasi berikutnya secara lebih luas.
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂימוּ לְבַבְכֶם
  choice: Camkanlah
  rationale: Ungkapan Ibrani secara harfiah menyuruh mereka menaruh hati pada perkataan itu. “Camkanlah” secara alami menyampaikan perhatian batin, kesungguhan, dan tekad, bukan sekadar kegiatan intelektual.
- source_word: הַדְּבָרִים / דִּבְרֵי
  choice: perkataan / segala perkataan
  rationale: Dalam konteks ini דָּבָר menunjuk pada perkataan atau ketetapan perjanjian yang diucapkan. Pengulangan “perkataan” mempertahankan kaitan verbal di dalam ayat.
- source_word: מֵעִיד בָּכֶם הַיּוֹם
  choice: yang kusaksikan kepada kalian hari ini
  rationale: Bentuk kausatif עוּד memiliki daya kesaksian resmi dan dapat pula bernuansa peringatan atau perkara hukum. Teks utama memakai “kusaksikan kepada kalian” tanpa mempertegas makna “melawan kalian”; nuansa lain dipertahankan dalam catatan kaki.
- source_word: אֲשֶׁר תְּצַוֻּם אֶת בְּנֵיכֶם
  choice: yang harus kalian perintahkan kepada anak-anak lelaki kalian
  rationale: Klausa relatif Ibrani dipertahankan, sementara “harus” menyampaikan tuntutan yang terkandung dalam bentuk imperfek pada konteks perintah ini. “Anak-anak lelaki” mempertahankan bentuk maskulin eksplisit בָּנִים.
- source_word: לִשְׁמֹר לַעֲשׂוֹת
  choice: untuk mereka pegang teguh dan lakukan
  rationale: Dua infinitif mempertahankan penekanan ganda pada pemeliharaan yang saksama dan pelaksanaan nyata. Kata ganti “mereka” memperjelas subjek dalam bahasa Indonesia.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: hukum ini
  rationale: תּוֹרָה dapat berarti ajaran atau petunjuk, tetapi dalam konteks perjanjian kitab Ulangan, “hukum” merupakan padanan yang jelas dan mapan tanpa meniadakan sifat instruksionalnya.
theological_decisions:
- issue: Nuansa kesaksian dan peringatan dalam מֵעִיד בָּכֶם
  choice: kusaksikan kepada kalian
  alternative: kuperingatkan kepada kalian; kujadikan saksi terhadap kalian
  rationale: Teks utama mempertahankan unsur kesaksian resmi tanpa menentukan bahwa kesaksian itu semata-mata bersifat menuduh. Catatan kaki memelihara nuansa peringatan dan forensik yang mungkin terkandung dalam konteks perjanjian.
- issue: Rujukan bergender dalam בְּנֵיכֶם
  choice: anak-anak lelaki kalian
  alternative: anak-anak kalian; generasi penerus kalian
  rationale: Nomina Ibrani berbentuk maskulin jamak dan karena itu diterjemahkan secara eksplisit. Kemungkinan pemakaiannya secara representatif bagi generasi berikutnya dijelaskan dalam catatan kaki, bukan dimasukkan diam-diam ke dalam teks utama.
- issue: Hubungan antara memegang teguh dan melakukan
  choice: pegang teguh dan lakukan
  alternative: taati dengan melakukannya
  rationale: Dua unsur dalam bahasa Ibrani dibiarkan berdampingan agar tekanan teologis pada pemeliharaan dan pelaksanaan hukum tidak dilebur menjadi satu gagasan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan langsung. “Kalian” dipakai untuk menandai bentuk jamak orang kedua secara jelas; “Camkanlah” menyampaikan idiom hati secara alami. Tanda pisah sebelum pengulangan terakhir menegaskan bahwa yang harus dipegang teguh dan dilakukan ialah seluruh perkataan hukum ini.
