base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/006.yaml
  text: Is this how you repay Yahweh[a], O foolish and unwise people? Is he not your Father, who created you? He made you and established you.
translation:
  language: id
  text: Beginikah kamu membalas Yahweh, hai bangsa yang bebal dan tidak bijaksana? Bukankah Dia Bapamu, yang memperoleh engkau?[a] Dialah yang menjadikan dan meneguhkan engkau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “yang menciptakan engkau” atau “yang membeli engkau.” Kata kerja Ibrani dapat berarti memperoleh, memiliki, membeli, atau, dalam konteks tertentu, menciptakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְמְלוּ
  choice: membalas
  rationale: Kata kerja גמל di sini menyatakan tindakan memberikan kembali sesuai dengan apa yang telah diterima. Dalam pertanyaan retoris yang menegur ini, “membalas” menyampaikan ironi bahwa perilaku Israel merupakan balasan yang tidak patut kepada Yahweh.
- source_word: זֹאת
  choice: beginikah
  rationale: Kata penunjuk ini menunjuk kepada cara Israel bertindak sebagaimana diuraikan sebelumnya. Bentuk “beginikah” alami dalam bahasa Indonesia dan mempertahankan daya pertanyaan retorisnya.
- source_word: עַם נָבָל וְלֹא חָכָם
  choice: hai bangsa yang bebal dan tidak bijaksana
  rationale: נָבָל mengandung makna kebodohan moral dan kehinaan, bukan sekadar kurang cerdas; “bebal” mempertahankan nuansa itu. לֹא חָכָם diterjemahkan secara langsung sebagai “tidak bijaksana,” sedangkan “hai” menandai sapaan langsung.
- source_word: הֲלוֹא
  choice: bukankah
  rationale: Partikel ini membuka pertanyaan retoris yang mengharapkan jawaban setuju. “Bukankah” mempertahankan bentuk dan tekanannya secara alami.
- source_word: אָבִיךָ
  choice: Bapamu
  rationale: Sebutan ini secara langsung menyatakan hubungan Yahweh dengan Israel. Huruf kapital menandai bahwa sebutan tersebut mengacu kepada Allah tanpa menambahkan gagasan di luar teks.
- source_word: קָּנֶךָ
  choice: yang memperoleh engkau
  rationale: קנה memiliki rentang arti memperoleh, memiliki, membeli, dan dalam konteks tertentu menciptakan. “Memperoleh” mempertahankan keluasan dasar kata serta membedakannya dari עשה, “menjadikan,” pada klausa berikutnya; kemungkinan lain dicatat dalam catatan kaki.
- source_word: עָשְׂךָ
  choice: menjadikan engkau
  rationale: Dalam konteks ini עשה menunjuk pada tindakan Yahweh menjadikan Israel. “Menjadikan” langsung, wajar, dan sesuai dengan objek personal-kolektifnya.
- source_word: וַיְכֹנְנֶךָ
  choice: meneguhkan engkau
  rationale: Bentuk dari כון ini menyampaikan tindakan menetapkan, mengokohkan, atau memberi kemantapan. “Meneguhkan” mempertahankan gagasan tersebut dan tidak mengulang makna “menjadikan.”
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh,” bukan diganti dengan suatu gelar, sehingga nama pribadi dalam teks Ibrani tetap tampak.
theological_decisions:
- issue: Makna קנה dalam hubungan Yahweh dengan Israel
  choice: yang memperoleh engkau
  alternative: yang menciptakan engkau; yang membeli engkau
  rationale: Kata Ibrani tersebut memungkinkan beberapa arti. Karena klausa berikutnya memakai kata tersendiri untuk “menjadikan” dan “meneguhkan,” “memperoleh” menjaga pembedaan leksikal dan tidak menutup kemungkinan nuansa kepemilikan atau penebusan. Alternatif penting dipertahankan dalam catatan kaki.
- issue: Bahasa kebapaan ilahi
  choice: Bapamu
  alternative: bapamu
  rationale: Teks secara eksplisit menyebut Yahweh sebagai Bapa Israel. Kapitalisasi hanya memperjelas acuan ilahi dalam kebiasaan penulisan Indonesia dan tidak memperluas pernyataan teologis teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Hai” mempertahankan sapaan puitis langsung dalam Nyanyian Musa. Kata ganti “kamu/engkau” dipakai bagi Israel sebagai bangsa kolektif; bentuk Ibrani sendiri beralih dari verba jamak ke akhiran tunggal kolektif. “Dialah” memberi penekanan yang sepadan dengan pengulangan kata ganti הוּא.
