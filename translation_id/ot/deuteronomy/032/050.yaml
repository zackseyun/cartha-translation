  text: וּ/מֻ֗ת בָּ/הָר֙ אֲשֶׁ֤ר אַתָּה֙ עֹלֶ֣ה שָׁ֔מָּ/ה וְ/הֵאָסֵ֖ף אֶל עַמֶּ֑י/ךָ כַּֽ/אֲשֶׁר מֵ֞ת אַהֲרֹ֤ן אָחִ֨י/ךָ֙ בְּ/הֹ֣ר הָ/הָ֔ר וַ/יֵּאָ֖סֶף אֶל עַמָּֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/050.yaml
  text: and die on the mountain that you are ascending[a], and be gathered to your people, just as Aaron your brother died on Mount Hor and was gathered to his people.
translation:
  language: id
  text: dan matilah di gunung yang sedang kaudaki itu, dan engkau akan dikumpulkan kepada kaummu,[a] sebagaimana Harun, saudaramu, mati di Gunung Hor dan dikumpulkan kepada kaumnya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dikumpulkan kepada leluhurmu.” Ungkapan Ibrani ini secara harfiah berbunyi “dikumpulkan kepada kaummu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֻת
  choice: dan matilah
  rationale: Bentuk imperatif Qal dari מות ditujukan langsung kepada Musa. Partikel -lah mempertahankan daya perintahnya secara wajar dalam bahasa Indonesia.
- source_word: בָּהָר
  choice: di gunung
  rationale: Preposisi ב di sini bersifat lokatif, sedangkan הַר berarti 'gunung'.
- source_word: אֲשֶׁר אַתָּה עֹלֶה שָׁמָּה
  choice: yang sedang kaudaki itu
  rationale: עלה menyatakan gerak naik, dan שָׁמָּה menunjuk ke tempat tujuan. Ungkapan 'kaudaki itu' menyampaikan keduanya secara alami tanpa frasa kaku 'naik ke sana'.
- source_word: וְהֵאָסֵף
  choice: lalu dikumpulkanlah engkau
  rationale: Imperatif Nifal dari אסף dipertahankan sebagai bentuk pasif dan sebagai bagian dari ungkapan khas tentang kematian; 'lalu' menghubungkan urutan tindakan dengan alami.
- source_word: אֶל עַמֶּיךָ
  choice: kepada kaummu
  rationale: עם secara harfiah berarti 'kaum/bangsa'. 'Kaummu' mempertahankan idiom Ibrani tanpa mempersempit maknanya menjadi 'leluhurmu'.
- source_word: כַּאֲשֶׁר
  choice: sama seperti
  rationale: Menyatakan perbandingan langsung antara kematian Musa dan kematian Harun.
- source_word: מֵת
  choice: mati
  rationale: Bentuk perfektif Qal dari מות merujuk pada peristiwa lampau dalam perbandingan ini; bahasa Indonesia tidak memerlukan penandaan kala khusus.
- source_word: אַהֲרֹן אָחִיךָ
  choice: Harun, saudaramu
  rationale: Urutan nama lalu keterangan hubungan mengikuti bahasa sumber dan tetap alami dengan aposisi dalam bahasa Indonesia.
- source_word: בְּהֹר הָהָר
  choice: di Gunung Hor
  rationale: הֹר adalah nama tempat dan הָהָר menjelaskannya sebagai gunung; bentuk Indonesia yang lazim ialah 'Gunung Hor'.
- source_word: וַיֵּאָסֶף אֶל עַמָּיו
  choice: dan dikumpulkan kepada kaumnya
  rationale: Ungkapan kematian yang sama diterjemahkan secara konsisten untuk Harun dan Musa.
theological_decisions:
- issue: Ungkapan kematian אסף אל־עמיו
  choice: Mempertahankan ungkapan 'dikumpulkan kepada kaummu/kaumnya' dalam teks utama
  alternative: '''dikumpulkan kepada leluhurmu/leluhurnya'' atau ''bergabung dengan sanak keluarganya dalam kematian'''
  rationale: Ungkapan Ibrani ini berkaitan dengan kematian, tetapi dapat menyiratkan lebih daripada penguburan atau hubungan dengan leluhur saja. Terjemahan harfiah yang tetap dapat dipahami mempertahankan keluasan dan ketegangan teologisnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Bentuk 'kaudaki' dipilih sebagai bentuk pronominal baku yang ringkas; pengulangan idiom 'dikumpulkan kepada kaum' sengaja dipertahankan untuk menjaga koherensi leksikal teks sumber.
