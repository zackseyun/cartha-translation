  naturalness: '"Dan engkau akan dikumpulkan kepada kaummu" lebih idiomatis dan jelas daripada pasif-imperatif "dikumpulkanlah engkau," sambil tetap mencerminkan fungsi perintah-ilahi yang sekaligus bernuansa kepastian dalam konteks ini. "Sebagaimana" juga lebih lancar daripada "sama seperti" dalam kalimat bertingkat ini.'
  terminology: '"Kaummu/kaumnya" secara sengaja mempertahankan idiom Ibrani tanpa mengidentifikasikannya secara definitif dengan leluhur atau penguburan. Nama "Harun" dan "Gunung Hor" sudah tepat. Catatan kaki tetap perlu mempertahankan alternatif "leluhurmu" dan penjelasan literalnya.'
