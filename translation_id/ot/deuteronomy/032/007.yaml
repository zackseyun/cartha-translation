  text: זְכֹר֙ יְמ֣וֹת עוֹלָ֔ם בִּ֖ינוּ שְׁנ֣וֹת דּוֹר וָ/ד֑וֹר שְׁאַ֤ל אָבִ֨י/ךָ֙ וְ/יַגֵּ֔דְ/ךָ זְקֵנֶ֖י/ךָ וְ/יֹ֥אמְרוּ לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/007.yaml
  text: Remember the days of old[a]; consider the years of generation after generation. Ask your father, and he will tell you, your elders[b], and they will say to you.
translation:
  language: id
  text: Ingatlah hari-hari zaman dahulu; perhatikanlah tahun-tahun generasi demi generasi.[a] Bertanyalah kepada ayahmu, dan ia akan memberitahumu; kepada para sesepuhmu, dan mereka akan berkata kepadamu.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “tahun-tahun generasi dan generasi,” suatu ungkapan bagi generasi-generasi yang silih berganti.'
    reason: lexical_alternative
  - marker: b
    text: Atau “leluhurmu”, jika kata ini dipahami lebih luas daripada ayah sendiri.
    reason: lexical_alternative
lexical_decisions:
- source_word: זְכֹר
  choice: Ingatlah
  rationale: Imperatif Qal ini memerintahkan pendengar untuk mengingat atau menghadirkan kembali dalam pikiran; “ingatlah” merupakan padanan Indonesia yang langsung dan wajar.
- source_word: יְמוֹת עוֹלָם
  choice: hari-hari dahulu
  rationale: Frasa konstruksi ini menunjuk pada masa lampau yang jauh. Pilihan ini mempertahankan gambaran harfiah “hari-hari” dan tetap mudah dipahami.
- source_word: בִּינוּ
  choice: perhatikanlah
  rationale: Imperatif dari בין dapat berarti memahami, mencermati, atau mempertimbangkan. Dalam paralel dengan “ingatlah”, “perhatikanlah” menyampaikan ajakan untuk menelaah sejarah dengan saksama tanpa menyatakan bahwa pemahaman penuh sudah tercapai.
- source_word: שְׁנוֹת דּוֹר וָדֹר
  choice: tahun-tahun dari generasi ke generasi
  rationale: Ungkapan harfiahnya adalah “tahun-tahun generasi dan generasi”; bentuk Indonesia ini mempertahankan unsur “tahun-tahun” serta menyampaikan rangkaian generasi secara alami.
- source_word: שְׁאַל
  choice: Tanyakanlah
  rationale: Imperatif sederhana yang paling wajar diterjemahkan sebagai perintah langsung untuk bertanya.
- source_word: אָבִיךָ
  choice: ayahmu
  rationale: Makna leksikal paling langsung dari bentuk tunggal dengan sufiks orang kedua ini ialah ayah seseorang; kemungkinan arti representatif yang lebih luas dicatat dalam catatan kaki.
- source_word: וְיַגֵּדְךָ
  choice: maka ia akan memberitahukannya kepadamu
  rationale: Bentuk Hifil dari נגד menyatakan tindakan memberitahukan atau menyatakan sesuatu. Pronomina “ia” mempertahankan subjek tunggal yang merujuk kepada ayah.
- source_word: זְקֵנֶיךָ
  choice: para sesepuhmu
  rationale: Kata ini menunjuk kepada orang-orang tua yang memiliki kedudukan dan otoritas dalam komunitas, bukan hanya laki-laki lanjut usia. “Para sesepuh” menyampaikan fungsi sosial tersebut tanpa istilah jabatan gerejawi tertentu.
- source_word: וְיֹאמְרוּ לָךְ
  choice: maka mereka akan mengatakannya kepadamu
  rationale: Padanan ini mempertahankan verba umum אמר, “mengatakan”, serta subjek jamak yang merujuk kepada para sesepuh.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku yang modern, lugas, dan bermartabat. Paralelisme puitis Ibrani dipertahankan melalui rangkaian perintah dan pasangan verba “memberitahukan”/“mengatakan”. Pergeseran bentuk imperatif Ibrani dari tunggal pada זְכֹר ke jamak pada בִּינוּ tidak dapat ditampilkan secara alami dalam bahasa Indonesia tanpa menambahkan kata ganti yang tidak ada dalam teks.
