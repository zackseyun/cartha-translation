  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: רְא֣וּ עַתָּ֗ה כִּ֣י אֲנִ֤י אֲנִי֙ ה֔וּא וְ/אֵ֥ין אֱלֹהִ֖ים עִמָּ/דִ֑י אֲנִ֧י אָמִ֣ית וַ/אֲחַיֶּ֗ה מָחַ֨צְתִּי֙ וַ/אֲנִ֣י אֶרְפָּ֔א וְ/אֵ֥ין מִ/יָּדִ֖/י מַצִּֽיל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/039.yaml
  text: See now that I[a], even I, am he, and there is no god beside me. I put to death and I make alive; I have wounded, and I will heal[e][d][c][b]; and there is no one who can deliver from my hand.
translation:
  language: id
  text: Lihatlah sekarang bahwa Aku, ya Aku, adalah Dia,[a] dan tidak ada ilah selain Aku.[b] Akulah yang mematikan dan yang menghidupkan; Aku telah melukai, dan Aku akan menyembuhkan; tidak ada yang dapat menyelamatkan dari tangan-Ku.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara lebih harfiah: “Aku, Aku adalah Dia.”'
    reason: Bentuk Ibrani mengulang kata ganti untuk penegasan; teks utama memakai ungkapan Indonesia yang lebih alami.
  - marker: b
    text: 'Atau: “dan tidak ada Allah bersama-Ku.” Kata depan Ibrani secara harfiah berarti “bersama,” tetapi dalam konteks ini kemungkinan menyatakan bahwa tidak ada ilah lain di samping atau sejajar dengan-Nya.'
    reason: Mencatat alternatif leksikal yang sungguh mungkin sekaligus menjelaskan daya eksklusif konteks.
  - marker: c
    text: “Dari tangan-Ku” merupakan ungkapan bagi lepas dari kuasa atau kendali seseorang. Kata yang diterjemahkan “melukai” juga dapat berarti “meremukkan.”
    reason: Menjelaskan idiom budaya dan mempertahankan jangkauan makna verba מָחַץ.
lexical_decisions:
- source_word: רְאוּ עַתָּה
  choice: Lihatlah sekarang
  rationale: Imperatif jamak dan keterangan waktu dipertahankan sebagai seruan langsung agar para pendengar mengakui kenyataan yang dinyatakan.
- source_word: כִּי אֲנִי אֲנִי הוּא
  choice: bahwa Aku, ya Aku, adalah Dia
  rationale: Pengulangan אֲנִי menyatakan penegasan. Bentuk 'Aku, ya Aku' terdengar alami dalam bahasa Indonesia sekaligus mempertahankan tekanannya; הוּא diterjemahkan tanpa menambahkan tafsiran seperti 'satu-satunya'.
- source_word: וְאֵין אֱלֹהִים עִמָּדִי
  choice: dan tidak ada ilah selain Aku
  rationale: Dalam konteks ini עִמָּדִי menyatakan bahwa tidak ada ilah yang berada bersama atau sejajar dengan sang pembicara. 'Selain Aku' menyampaikan daya eksklusif ungkapan itu secara alami, sementara 'ilah' menunjukkan sebutan umum bagi dewa, bukan nama diri.
- source_word: אֲנִי אָמִית וַאֲחַיֶּה
  choice: Akulah yang mematikan dan yang menghidupkan
  rationale: Bentuk kausatif 'mematikan' dan bentuk intensif/kausatif 'menghidupkan' dipertahankan dengan kesejajaran puitis. Partikel '-lah' meneruskan penegasan אֲנִי.
- source_word: מָחַצְתִּי וַאֲנִי אֶרְפָּא
  choice: Aku telah melukai, dan Aku akan menyembuhkan
  rationale: מָחַץ dapat berarti melukai, meremukkan, atau menghancurkan. 'Melukai' membentuk antitesis yang jelas dengan 'menyembuhkan' tanpa meniadakan kemungkinan nuansa yang lebih keras, yang dicatat dalam catatan kaki.
- source_word: וְאֵין מִיָּדִי מַצִּיל
  choice: tidak ada seorang pun yang dapat melepaskan dari tangan-Ku
  rationale: Partisipel מַצִּיל menyatakan orang yang menyelamatkan atau melepaskan. Penambahan 'dapat' mengungkapkan ketidakmungkinan yang tersirat, sedangkan 'tangan-Ku' mempertahankan idiom sumber mengenai kuasa dan kendali.
theological_decisions:
- issue: Eksklusivitas ilahi terhadap ilah-ilah lain
  choice: tidak ada ilah selain Aku
  alternative: tidak ada Allah bersama-Ku
  rationale: Konteks mendukung pernyataan eksklusif yang kuat, bukan sekadar penolakan terhadap rekan atau sekutu ilahi. Namun, alternatif yang lebih harfiah dicatat karena עִם secara dasar berarti 'dengan/bersama'.
- issue: Bobot teologis ungkapan אֲנִי אֲנִי הוּא
  choice: Aku, ya Aku, adalah Dia
  alternative: Akulah Dia
  rationale: Pengulangan pronomina dipertahankan sebagai penegasan tanpa mengembangkannya menjadi rumusan doktrinal atau menyisipkan kata 'satu-satunya' yang tidak dinyatakan secara eksplisit dalam frasa tersebut.
- issue: Kedaulatan ilahi atas kematian, kehidupan, luka, dan pemulihan
  choice: Mempertahankan semua tindakan sebagai tindakan langsung sang pembicara
  alternative: Melemahkan kausalitas menjadi sekadar mengizinkan kematian atau luka
  rationale: Bentuk-bentuk verba Ibrani secara langsung mengaitkan tindakan itu dengan sang pembicara. Terjemahan tidak melunakkan ketegangan teologis tersebut dengan menambahkan gagasan izin yang tidak terdapat dalam teks.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Paralelisme puitis dipertahankan dengan susunan klausa yang ringkas. Huruf kapital pada kata ganti ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia; 'ilah' ditulis dengan huruf kecil karena menunjuk pada kategori dewa saingan, bukan nama atau gelar khusus Allah Israel.
