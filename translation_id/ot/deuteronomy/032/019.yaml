revisions:
- from: Ketika Yahweh melihatnya, Ia menolak mereka karena amarah yang dibangkitkan oleh anak-anak-Nya, baik laki-laki maupun perempuan.[a]
  to: Yahweh melihat dan menolak mereka karena provokasi anak-anak-Nya, laki-laki maupun perempuan.[a]
  rationale: Revisi menghapus objek yang tidak terdapat pada verba “melihat,” mengganti hubungan temporal yang tidak diperlukan dengan koordinasi naratif, dan menerjemahkan מִכַּעַס sebagai sebab berupa provokasi. Pasangan anak laki-laki dan anak perempuan tetap dinyatakan secara eksplisit, sedangkan objek tersirat dari “menolak” tetap disediakan sebagai “mereka,” sesuai konteks dan kebutuhan bahasa Indonesia.
