  text: וַ/יַּ֥רְא יְהוָ֖ה וַ/יִּנְאָ֑ץ מִ/כַּ֥עַס בָּנָ֖י/ו וּ/בְנֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/019.yaml
  text: And Yahweh saw and rejected them, provoked to anger by his sons and daughters[a].
translation:
  language: id
  text: Yahweh melihat dan menolak mereka karena provokasi anak-anak-Nya, laki-laki maupun perempuan.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Ia mencampakkan mereka” atau “Ia memandang rendah mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama perjanjian ilahi dalam bentuk yang lazim dan langsung dalam bahasa Indonesia.
- source_word: וַיַּרְא
  choice: ketika ... melihatnya
  rationale: ראה dalam qal berarti 'melihat'; hubungan dengan tindakan berikutnya disampaikan secara alami sebagai urutan keadaan dan respons. Akhiran '-nya' merujuk pada keadaan atau perbuatan yang baru digambarkan dalam konteks.
- source_word: וַיִּנְאָץ
  choice: Ia menolak mereka
  rationale: נאץ menyatakan penolakan yang mengandung penghinaan atau penistaan. 'Menolak' jelas dan wajar, sedangkan nuansa yang lebih kuat dipertahankan dalam catatan kaki. Objek 'mereka' tersirat dalam bahasa Ibrani dan dijelaskan dari konteks.
- source_word: מִכַּעַס
  choice: karena amarah yang dibangkitkan oleh
  rationale: כעס dapat menunjuk pada kejengkelan, provokasi, atau amarah yang timbul; מִן dipahami secara kausal. Ungkapan ini mempertahankan kaitan sebab tanpa menjadikan 'diprovokasi' seolah-olah mengurangi tanggung jawab ilahi.
- source_word: בָּנָיו וּבְנֹתָיו
  choice: anak-anak-Nya, baik laki-laki maupun perempuan
  rationale: Menyampaikan secara alami bahwa teks Ibrani secara eksplisit menyebut anak laki-laki dan anak perempuan, sekaligus mempertahankan hubungan kepunyaan dengan Yahweh.
theological_decisions:
- issue: Objek tersirat dari וַיִּנְאָץ
  choice: Menambahkan 'mereka', yang merujuk kepada umat Israel dalam konteks.
  alternative: 'Membiarkan objek tidak dinyatakan: ''Ia melihat lalu menolak.'''
  rationale: Bahasa Indonesia lebih alami dengan objek eksplisit, dan konteks dengan jelas menyediakan rujukannya tanpa menambahkan klaim teologis baru.
- issue: Makna מִכַּעַס dan sumber amarah ilahi
  choice: 'Menerjemahkannya sebagai sebab: ''karena amarah yang dibangkitkan oleh''.'
  alternative: Karena provokasi anak-anak-Nya; dengan murka terhadap anak-anak-Nya.
  rationale: Pilihan ini mempertahankan ambiguitas leksikal כעס antara provokasi dan amarah/kejengkelan, sambil mengikuti konstruksi kausal Ibrani dan tidak melunakkan penghakiman ilahi.
- issue: Hubungan 'anak-anak-Nya' dengan umat yang ditolak
  choice: Mempertahankan sebutan relasional 'anak-anak-Nya' sekalipun mereka ditolak.
  alternative: Mengganti dengan 'umat-Nya' atau 'orang Israel'.
  rationale: Teks sengaja mempertahankan ketegangan antara hubungan sebagai anak dan tindakan penolakan; terjemahan tidak boleh menyelesaikan ketegangan itu secara diam-diam.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Kapitalisasi pronomina ilahi mengikuti gaya Alkitab Indonesia yang lazim. Frasa 'baik laki-laki maupun perempuan' dipakai agar pasangan eksplisit בנים/בנות tidak hilang dalam kata umum 'anak-anak'.
