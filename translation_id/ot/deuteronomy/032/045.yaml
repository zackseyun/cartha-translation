lexical_decisions:
- source_word: וַיְכַל מֹשֶׁה לְדַבֵּר
  choice: Setelah Musa selesai menyampaikan
  rationale: Bentuk wayyiqtol dari כלה dengan infinitif דבר menyatakan bahwa tindakan berbicara telah diselesaikan. Susunan subordinatif “Setelah ... selesai” alami dalam bahasa Indonesia dan sesuai dengan ayat yang berlanjut ke tindakan berikutnya.
- source_word: אֶת כָּל הַדְּבָרִים הָאֵלֶּה
  choice: semua perkataan ini
  rationale: דברים dalam konteks ini menunjuk pada perkataan yang baru saja disampaikan. “Perkataan” mempertahankan acuan verbal teks tanpa memperluasnya menjadi “hal-hal”.
- source_word: אֶל כָּל יִשְׂרָאֵל
  choice: kepada seluruh Israel
  rationale: Israel dipertahankan sebagai sebutan kolektif umat perjanjian. “Seluruh Israel” terdengar alami dan menyampaikan cakupan כָּל tanpa menafsirkannya menjadi “semua orang Israel”.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Mengikuti bentuk nama yang baku dan luas dikenal dalam bahasa Indonesia.
