source:
  edition: WLC
  text: הֲ/לֹא ה֖וּא כָּמֻ֣ס עִמָּ/דִ֑י חָתֻ֖ם בְּ/אוֹצְרֹתָֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/034.yaml
  text: Is it not laid up with me[b][a], sealed in my storehouses?
translation:
  language: id
  text: Bukankah hal itu tersimpan pada-Ku[a], termeterai dalam perbendaharaan-Ku[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tersembunyi pada-Ku.”'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “di dalam gudang-gudang penyimpanan-Ku.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: Bukankah
  rationale: Mempertahankan bentuk pertanyaan retoris yang mengharapkan jawaban ya dan terdengar wajar dalam bahasa Indonesia modern.
- source_word: הוּא
  choice: hal itu
  rationale: Pronomina Ibrani berbentuk maskulin tunggal, tetapi dalam konteks merujuk secara impersonal pada perkara yang telah disebutkan. 'Hal itu' mempertahankan ketidakjelasan tepatnya apa yang dirujuk tanpa mempersonifikasikannya.
- source_word: כָּמֻס
  choice: tersimpan
  rationale: Partisip pasif ini dapat berarti tersembunyi atau disimpan. 'Tersimpan' sesuai dengan gambaran perbendaharaan dan sesuatu yang dijaga untuk kemudian.
- source_word: עִמָּדִי
  choice: pada-Ku
  rationale: Menyatakan bahwa hal itu berada dalam penguasaan atau penjagaan Allah. Bentuk ini lebih alami daripada 'bersama-Ku' untuk benda atau perkara yang disimpan.
- source_word: חָתֻם
  choice: termeterai
  rationale: Menyampaikan keadaan telah diberi meterai, yakni diamankan dan dijaga, sambil mempertahankan citra konkret teks sumber.
- source_word: בְּאוֹצְרֹתָי
  choice: dalam perbendaharaan-Ku
  rationale: Kata bendanya berbentuk jamak dan menunjuk tempat penyimpanan atau perbendaharaan. Dalam bahasa Indonesia, 'perbendaharaan' dapat berfungsi secara kolektif dan mempertahankan gaya yang dignified tanpa membatasi maknanya pada uang.
theological_decisions:
- issue: Rujukan sesuatu yang tersimpan dan termeterai
  choice: '''hal itu'' sebagai rujukan impersonal pada perkara sebelumnya, mungkin catatan kesalahan atau penghukuman yang disediakan'
  alternative: '''dia'' jika dipahami sebagai bangsa musuh atau subjek yang dipersonifikasikan; ''semua ini'' sebagai rangkuman deiktis atas ancaman sebelumnya'
  rationale: Bentuk Ibraninya maskulin tunggal, tetapi antesedennya tidak dinyatakan secara tegas dalam ayat ini. 'Hal itu' mempertahankan ambiguitas rujukan tanpa menetapkan tafsiran teologis tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapital pada enklitik -Ku mengikuti rujukan kepada Allah. Susunan dua partisip pasif dipertahankan untuk mencerminkan paralelisme Ibrani.
