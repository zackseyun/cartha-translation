  text: יִזְבְּח֗וּ לַ/שֵּׁדִים֙ לֹ֣א אֱלֹ֔הַ אֱלֹהִ֖ים לֹ֣א יְדָע֑וּ/ם חֲדָשִׁים֙ מִ/קָּרֹ֣ב בָּ֔אוּ לֹ֥א שְׂעָר֖וּ/ם אֲבֹתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/017.yaml
  text: They sacrificed to demons[a], not God, to gods they had not known, new ones that had recently come[c][b], whom your fathers had not feared.
translation:
  language: id
  text: Mereka mempersembahkan kurban kepada roh-roh jahat, bukan kepada Allah[a], kepada ilah-ilah yang tidak mereka kenal, ilah-ilah baru yang datang belum lama ini[b], yang tidak ditakuti nenek moyangmu[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bukan suatu ilah.” Teks Ibrani dapat dipahami sebagai penyangkalan bahwa makhluk-makhluk itu benar-benar ilahi, meskipun konteksnya juga mengontraskan mereka dengan Allah Israel.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “yang baru, dari dekat mereka datang,” yaitu ilah-ilah yang baru muncul atau belum lama diperkenalkan.
    reason: lexical_alternative
  - marker: c
    text: Atau, “yang di hadapan mereka nenek moyangmu tidak gemetar.” Kata Ibrani yang dipakai di sini dapat menggambarkan rasa gentar atau gemetar.
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזְבְּחוּ
  choice: Mereka mempersembahkan kurban
  rationale: Bentuk Qal dari זבח menyatakan tindakan mempersembahkan atau menyembelih kurban. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan nuansa peribadatan.
- source_word: לַשֵּׁדִים
  choice: kepada roh-roh jahat
  rationale: שֵׁדִים menunjuk kepada makhluk adikodrati jahat. 'Roh-roh jahat' lebih jelas dan alami bagi pembaca Indonesia daripada transliterasi, serta menghindari penyamaan langsung dengan tokoh Setan.
- source_word: לֹא אֱלֹהַ
  choice: bukan kepada Allah
  rationale: Dalam konteks ini bentuk tunggal אֱלֹהַ mengontraskan penerima kurban yang palsu dengan Allah Israel. Kata depan 'kepada' diulangi dalam bahasa Indonesia agar hubungan sintaksisnya jelas.
- source_word: אֱלֹהִים
  choice: ilah-ilah
  rationale: Bentuk jamak ini menyebut objek-objek sembahan yang baru dikenal Israel. 'Ilah-ilah' mempertahankan klaim para penyembah tanpa mengakui bahwa mereka sungguh-sungguh Allah.
- source_word: לֹא יְדָעוּם
  choice: yang tidak mereka kenal
  rationale: ידע dengan akhiran objek berarti 'mengenal'. Bentuk lampau tidak perlu ditandai secara khusus dalam bahasa Indonesia karena urutan wacana sudah menjelaskannya.
- source_word: חֲדָשִׁים
  choice: ilah-ilah baru
  rationale: Kata sifat ini dipakai secara substantival dan merujuk kembali kepada 'ilah-ilah'. Pengulangan nomina membuat rujukannya jelas dalam bahasa Indonesia.
- source_word: מִקָּרֹב בָּאוּ
  choice: yang datang belum lama ini
  rationale: Ungkapan ini paling wajar dipahami secara temporal sebagai kedatangan atau kemunculan baru-baru ini, bukan sebagai gerak mendekat secara ruang.
- source_word: לֹא שְׂעָרוּם
  choice: yang di hadapannya ... tidak pernah gemetar
  rationale: Kata kerja yang langka ini menyampaikan kegentaran atau rasa takut yang mendalam. 'Gemetar di hadapan' mempertahankan citra kuatnya tanpa mereduksinya menjadi sekadar rasa hormat.
- source_word: אֲבֹתֵיכֶם
  choice: nenek moyangmu
  rationale: Ungkapan ini menunjuk kepada para leluhur Israel. 'Nenek moyang' adalah padanan Indonesia yang alami dan mencakup makna kolektifnya; '-mu' dapat menyapa umat secara kolektif.
theological_decisions:
- issue: Hubungan antara roh-roh jahat dan ilah-ilah
  choice: 'Mempertahankan kedua sebutan secara berurutan: ''roh-roh jahat ... ilah-ilah''.'
  alternative: Melebur keduanya menjadi satu sebutan demi kelancaran.
  rationale: Teks Ibrani sengaja menumpuk שֵׁדִים dan אֱלֹהִים. Mempertahankan keduanya menyampaikan bahwa objek sembahan itu disebut ilah oleh para penyembah, tetapi diidentifikasi secara polemis sebagai roh-roh jahat.
- issue: Makna לֹא אֱלֹהַ dalam kontras dengan penyembahan palsu
  choice: Menerjemahkan 'bukan kepada Allah'.
  alternative: Menerjemahkan 'bukan kepada suatu ilah' atau 'kepada yang bukan ilah'.
  rationale: Konteks Kidung Musa mengontraskan objek kurban tersebut dengan Allah Israel. Namun, kemungkinan pembacaan tak tentu tetap dicatat dalam catatan kaki agar ambiguitas bentuk Ibraninya tidak dihapus.
- issue: Sifat rasa takut dalam לֹא שְׂעָרוּם
  choice: Menerjemahkan dengan citra 'tidak pernah gemetar'.
  alternative: Menerjemahkan 'tidak mereka takuti'.
  rationale: Pilihan ini mempertahankan kekuatan kata Ibrani yang langka dan tidak menentukan apakah kegentaran itu merupakan ibadah, ketakutan biasa, atau keduanya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Struktur pengulangan teks Ibrani dipertahankan sejauh tetap alami. Istilah 'roh-roh jahat' dipilih daripada 'setan-setan' untuk menghindari kesan bahwa שֵׁדִים adalah bentuk jamak dari nama diri Setan.
