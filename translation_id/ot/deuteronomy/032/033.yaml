translation:
  language: id
  text: Anggur mereka adalah bisa ular[a], dan racun kejam ular tedung[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani ini juga dapat diterjemahkan "naga" atau "makhluk laut" dalam konteks lain; kesejajarannya dengan ular berbisa di sini mendukung pengertian ular.
    reason: lexical_alternative
  - marker: b
    text: Atau "ular berbisa"; kata Ibrani ini menamai sejenis ular berbisa yang secara tradisional diterjemahkan "asp" atau "beludak".
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲמַת
  choice: bisa
  rationale: Dalam konstruksi dengan תַּנִּינִם dan sejajar dengan רֹאשׁ, kata ini menunjuk pada zat berbisa, bukan murka atau panas. "Bisa" adalah istilah Indonesia yang tepat untuk racun alami ular.
- source_word: תַּנִּינִם
  choice: ular naga
  rationale: Kata ini dapat menunjuk pada makhluk besar menyerupai ular, naga, atau monster laut. Konteks bisa dan kesejajarannya dengan ular berbisa mendukung gambaran makhluk mirip ular, tetapi unsur leksikal yang lebih luas dipertahankan melalui "ular naga".
- source_word: יֵינָם
  choice: anggur mereka
  rationale: Bentuk ini secara langsung berarti "anggur mereka" dan meneruskan metafora hasil kaum fasik sebagai zat mematikan.
- source_word: וְרֹאשׁ
  choice: dan racun
  rationale: Dalam konteks ini רֹאשׁ berarti zat pahit atau beracun, bukan "kepala". "Racun" jelas dan menghindari pengulangan kata "bisa".
- source_word: פְּתָנִים
  choice: ular tedung
  rationale: Kata Ibrani ini menamai sejenis ular berbisa yang identifikasi zoologisnya tidak pasti. "Ular tedung" merupakan padanan modern yang wajar, sementara ketidakpastiannya dicatat dalam catatan kaki.
- source_word: אַכְזָר
  choice: kejam
  rationale: Kata sifat ini menggambarkan racun sebagai kejam atau tanpa belas kasihan dalam daya mematikannya, dengan mempertahankan personifikasi puitis teks.
