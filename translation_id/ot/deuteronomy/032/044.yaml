  naturalness: Bahasa draf umumnya jelas, tetapi “sehingga didengar oleh bangsa itu, dia bersama Hosea bin Nun” terasa janggal dan hubungan sintaksisnya tidak langsung terbaca. Susunan revisi mempertahankan Musa dan Hosea sebagai pelaku tanpa konstruksi pronominal yang canggung.
  terminology: “Nyanyian,” “Hosea,” dan “bin Nun” sesuai. “Bangsa itu” dapat dipertahankan sebagai rujukan kepada הָעָם dalam konteks Israel.
