  yaml_path: translation/ot/deuteronomy/032/044.yaml
  text: Then Moses came and spoke all the words of this song in the hearing of the people[a], he and Hoshea son of Nun.
translation:
  language: id
  text: Lalu Musa sendiri, bersama Hosea bin Nun, datang dan menyampaikan seluruh perkataan nyanyian ini kepada bangsa itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “Hosea”; tokoh ini di bagian lain umumnya disebut Yosua (lihat Bilangan 13:16).'
    reason: Menjelaskan bahwa bentuk nama dalam teks sumber berbeda dari nama tokoh yang lebih dikenal, tanpa mengganti bacaan Ibrani.
lexical_decisions:
- source_word: וַיָּבֹא
  choice: datang
  rationale: Kata kerja בוא dalam bentuk naratif ini secara wajar berarti “datang”; pilihan ini mempertahankan peralihan adegan tanpa menentukan arah secara berlebihan.
- source_word: וַיְדַבֵּר
  choice: menyampaikan
  rationale: Bentuk piel דבר berarti berbicara atau menyampaikan. Dalam konteks pembacaan seluruh nyanyian di hadapan bangsa itu, “menyampaikan” terdengar alami dan tetap berfokus pada tindakan lisan.
- source_word: אֶת כָּל דִּבְרֵי
  choice: seluruh perkataan
  rationale: Ungkapan ini menyatakan kelengkapan isi yang diucapkan; “seluruh perkataan” mempertahankan unsur kata-per-kata dan cakupan totalnya.
- source_word: הַשִּׁירָה הַזֹּאת
  choice: nyanyian ini
  rationale: שירה menunjuk pada nyanyian Musa dalam konteks langsung. “Nyanyian” lebih tepat secara kontekstual daripada “puisi”.
- source_word: בְּאָזְנֵי הָעָם
  choice: sehingga didengar oleh bangsa itu
  rationale: Idiom harfiahnya “di telinga bangsa itu.” Rumusan ini menyampaikan makna pembacaan lisan di hadapan mereka tanpa memakai ungkapan Indonesia yang kaku.
- source_word: הָעָם
  choice: bangsa itu
  rationale: עם di sini menunjuk kepada umat Israel sebagai satu komunitas. “Bangsa itu” alami dalam konteks naratif dan tidak mengubahnya menjadi istilah kelembagaan seperti “jemaah.”
- source_word: הוּא
  choice: dia
  rationale: Pronomina mandiri dipertahankan karena teks Ibrani menyebutkannya secara eksplisit sebelum menyandingkan Musa dengan Hosea.
- source_word: וְהוֹשֵׁעַ
  choice: Hosea
  rationale: Teks Ibrani memakai bentuk nama הוֹשֵׁעַ, bukan יְהוֹשֻׁעַ. Bentuk Indonesia “Hosea” mengikuti nama yang benar-benar terdapat dalam ayat ini.
- source_word: בִּן נוּן
  choice: bin Nun
  rationale: “Bin Nun” merupakan bentuk patronimik yang ringkas, mapan, dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: 'Nama rekan Musa: Hosea atau Yosua'
  choice: Hosea
  alternative: Yosua
  rationale: Teks Masoret secara eksplisit berbunyi הוֹשֵׁעַ. Karena itu, nama dalam ayat diterjemahkan sebagai “Hosea” dan tidak diselaraskan secara diam-diam dengan nama “Yosua” yang lebih dikenal. Catatan kaki menjelaskan identitas tokoh tersebut.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Struktur “dia bersama Hosea” mempertahankan pronomina eksplisit dalam bahasa Ibrani, meskipun sedikit lebih bertanda daripada susunan Indonesia yang sepenuhnya dilancarkan. Penanda catatan kaki ditempatkan sesudah nama yang dijelaskan.
