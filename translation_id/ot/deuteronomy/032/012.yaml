source:
  edition: WLC
  text: יְהוָ֖ה בָּדָ֣ד יַנְחֶ֑/נּוּ וְ/אֵ֥ין עִמּ֖/וֹ אֵ֥ל נֵכָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/012.yaml
  text: Yahweh alone led him[a], and no foreign god was with him.
translation:
  language: id
  text: Yahweh sendiri menuntun dia[a], dan tidak ada dewa asing bersama dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “memimpin dia.” Kata kerja Ibrani ini dapat berarti memimpin atau menuntun.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan sebagai “Yahweh” agar nama pribadi dalam teks Ibrani dipertahankan, bukan diganti dengan gelar.
- source_word: בָּדָד
  choice: sendiri
  rationale: Dalam pemakaian adverbial ini, kata tersebut menegaskan bahwa Yahweh bertindak tanpa pendamping atau bantuan.
- source_word: יַנְחֶנּוּ
  choice: menuntun dia
  rationale: Bentuk Hifil dari נחה di sini menyatakan tindakan memimpin atau menuntun. “Menuntun” alami dalam konteks perjalanan dan pemeliharaan di padang belantara; pronomina tunggal maskulin dipertahankan sebagai “dia” dan merujuk secara kolektif kepada Israel/Yakub.
- source_word: וְאֵין
  choice: dan tidak ada
  rationale: Negasi eksistensial diterjemahkan secara alami dan jelas dalam bahasa Indonesia.
- source_word: עִמּוֹ
  choice: bersama dia
  rationale: Preposisi עם dengan akhiran orang ketiga tunggal maskulin menyatakan penyertaan; bentuk tunggal sumber dipertahankan.
- source_word: אֵל נֵכָר
  choice: dewa asing
  rationale: Frasa ini menunjuk kepada ilah yang asing bagi Israel. “Dewa asing” jelas dalam bahasa Indonesia modern dan mempertahankan daya polemis terhadap penyembahan berhala.
theological_decisions:
- issue: Acuan pronomina tunggal dalam “menuntun dia” dan “bersama dia”
  choice: Pronomina tunggal dipertahankan sebagai “dia”, dengan Israel/Yakub sebagai acuan kolektif dalam konteks terdekat.
  alternative: Menggunakan “mereka” untuk menyatakan bangsa Israel sebagai kelompok.
  rationale: Teks Ibrani memakai akhiran tunggal maskulin, sementara konteks nyanyian memperlakukan Israel/Yakub sebagai satu pribadi kolektif. Mempertahankan bentuk tunggal menjaga gambaran dan gramatika sumber tanpa mengubahnya menjadi jamak.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan bermartabat. Susunan kalimat dibuat ringkas untuk mempertahankan kesejajaran dua klausa Ibrani; “bersama dia” dipilih alih-alih bentuk posesif agar acuan pronomina tetap jelas.
