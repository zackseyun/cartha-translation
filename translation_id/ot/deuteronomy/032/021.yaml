  yaml_path: translation/ot/deuteronomy/032/021.yaml
  text: They made me jealous with what is not a god[a]; they provoked me to anger with their idols. So I will make them jealous with those who are not a people[c][b]; I will provoke them to anger with a foolish nation.
translation:
  language: id
  text: Mereka membuat Aku cemburu dengan sesuatu yang bukan ilah; mereka membangkitkan murka-Ku dengan berhala-berhala mereka.[a] Maka Aku pun akan membuat mereka cemburu dengan bangsa yang bukan umat[b]; Aku akan membangkitkan murka mereka dengan bangsa yang bebal.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan kesia-siaan mereka” atau “dengan hal-hal mereka yang tidak berharga”; istilah Ibrani dapat berarti kehampaan dan, dalam konteks ini, menunjuk kepada berhala.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “dengan bukan-umat”; ungkapan Ibrani ini sengaja sejajar dengan “sesuatu yang bukan ilah”.
    reason: lexical_alternative
  - marker: c
    text: “Bebal” di sini menyatakan kebodohan dalam arti moral dan rohani, bukan sekadar kurang cerdas.
    reason: cultural_note
lexical_decisions:
- source_word: קִנְאוּנִי
  choice: membuat Aku cemburu
  rationale: Mengungkapkan makna kausatif verba קנא secara alami serta mempertahankan kesejajaran dengan אַקְנִיאֵם pada bagian kedua ayat.
- source_word: בְּלֹא אֵל
  choice: dengan sesuatu yang bukan ilah
  rationale: Mempertahankan kontras polemis dengan Allah yang sejati. Kata umum “ilah” menghindari penyamaan ungkapan ini dengan nama atau sebutan khusus bagi Allah.
- source_word: כִּעֲסוּנִי
  choice: membangkitkan murka-Ku
  rationale: Mempertahankan daya kausatif verba כעס dan memakai ungkapan Indonesia yang wajar serta bermartabat.
- source_word: בְּהַבְלֵיהֶם
  choice: dengan berhala-berhala mereka
  rationale: הֶבֶל secara harfiah berkaitan dengan uap, kehampaan, atau kesia-siaan, tetapi dalam konteks ini secara metonimis menunjuk kepada berhala; nuansa harfiahnya dipertahankan dalam catatan kaki.
- source_word: אַקְנִיאֵם
  choice: membuat mereka cemburu
  rationale: Mempertahankan pembalikan yang disengaja terhadap tindakan Israel pada awal ayat.
- source_word: בְּלֹא עָם
  choice: dengan mereka yang bukan umat
  rationale: Menjaga paralel retoris dengan “sesuatu yang bukan ilah” tanpa menentukan identitas historis kelompok tersebut.
- source_word: בְּגוֹי נָבָל
  choice: dengan bangsa yang bebal
  rationale: “Bebal” menyampaikan kebodohan moral dan rohani yang terkandung dalam נָבָל, bukan sekadar kekurangan kecerdasan.
- source_word: אַכְעִיסֵם
  choice: membangkitkan murka mereka
  rationale: Mengulang secara konsisten ungkapan kausatif pada bagian pertama dan mempertahankan simetri hukuman dalam ayat ini.
theological_decisions:
- issue: Identitas “mereka yang bukan umat” dan “bangsa yang bebal”
  choice: Dibiarkan umum tanpa menunjuk bangsa tertentu.
  alternative: Menafsirkannya sebagai satu bangsa non-Israel tertentu atau bangsa-bangsa lain secara kolektif.
  rationale: Teks Ibrani tidak menyebut identitas bangsa itu. Terjemahan umum mempertahankan ketegangan retoris dan teologis tanpa memasukkan identifikasi dari penafsiran kemudian.
- issue: Kecemburuan Allah
  choice: Diterjemahkan langsung sebagai “membuat Aku cemburu”.
  alternative: “Membangkitkan gairah-Ku” atau “membangkitkan kecemburuan-Ku”.
  rationale: Pilihan langsung ini mempertahankan bahasa relasional dan pembalasan yang simetris dalam teks tanpa melunakkan atau menjelaskan sifat kecemburuan tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan bermartabat. Pengulangan “membuat ... cemburu” dan “membangkitkan murka” dipertahankan untuk mencerminkan simetri retoris Ibrani. Partikel “pun” menandai tindakan balasan tanpa menentukan lebih jauh cara penggenapannya.
