source:
  edition: WLC
  text: אֵיכָ֞ה יִרְדֹּ֤ף אֶחָד֙ אֶ֔לֶף וּ/שְׁנַ֖יִם יָנִ֣יסוּ רְבָבָ֑ה אִם לֹא֙ כִּי צוּרָ֣/ם מְכָרָ֔/ם וַֽ/יהוָ֖ה הִסְגִּירָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/030.yaml
  text: How could one pursue a thousand[a], and two put ten thousand to flight, unless their Rock had sold them, and Yahweh had given them up?
translation:
  language: id
  text: 'Bagaimana mungkin satu orang mengejar seribu orang,

    dan dua orang membuat sepuluh ribu orang melarikan diri,

    kalau bukan karena Batu Karang mereka telah menjual mereka,

    dan Yahweh telah menyerahkan mereka[a]?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “telah menyerahkan mereka.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵיכָה
  choice: Bagaimana mungkin
  rationale: Mengungkapkan pertanyaan retoris yang bernada heran dan tidak percaya secara alami dalam bahasa Indonesia.
- source_word: יִרְדֹּף
  choice: mengejar
  rationale: Mempertahankan arti umum רדף dan sesuai dengan konteks pertempuran.
- source_word: אֶחָד אֶלֶף
  choice: satu orang mengejar seribu orang
  rationale: Mempertahankan ketimpangan jumlah pasukan dalam teks Ibrani, sambil memperjelas bahwa yang dihitung adalah orang.
- source_word: וּשְׁנַיִם
  choice: dan dua orang
  rationale: Meneruskan kesejajaran numerik secara langsung dan wajar dalam bahasa Indonesia.
- source_word: יָנִיסוּ
  choice: membuat ... melarikan diri
  rationale: Bentuk Hifil bersifat kausatif; pilihan ini mempertahankan arti menyebabkan pihak lain lari.
- source_word: רְבָבָה
  choice: sepuluh ribu orang
  rationale: Menyampaikan nilai bilangan secara jelas bagi pembaca modern.
- source_word: אִם לֹא כִּי
  choice: kalau bukan karena
  rationale: Secara alami memperkenalkan satu-satunya penjelasan bagi pembalikan keadaan yang tampaknya mustahil.
- source_word: צוּרָם
  choice: Gunung Batu mereka
  rationale: צוּר berfungsi sebagai metafora sekaligus sebutan bagi Allah dalam Nyanyian Musa; huruf kapital menandai fungsi sebutan tersebut tanpa menghilangkan metaforanya.
- source_word: מְכָרָם
  choice: telah menjual mereka
  rationale: Mempertahankan metafora langsung dari מכר dalam konteks penghukuman perjanjian, yaitu menyerahkan umat ke dalam kuasa musuh.
- source_word: וַיהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian יהוה, bukan menggantinya dengan gelar.
- source_word: הִסְגִּירָם
  choice: telah menyerahkan mereka
  rationale: Dalam konteks ini bentuk Hifil dari סגר berarti menyerahkan seseorang ke dalam kuasa pihak lain; ungkapan ini alami dan tidak menambahkan objek yang tidak dinyatakan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton secara langsung; bentuk “Yahweh” mempertahankan nama perjanjian yang dinyatakan dalam sumber.
- issue: Fungsi צוּר sebagai sebutan ilahi
  choice: Gunung Batu mereka
  alternative: gunung batu mereka
  rationale: Dalam konteks Nyanyian Musa, metafora ini menunjuk kepada Allah Israel. Huruf kapital membantu pembaca mengenali fungsi sebutannya, sementara bentuk metaforis teks tetap dipertahankan.
- issue: Metafora penghakiman dalam מְכָרָם
  choice: telah menjual mereka
  alternative: telah menyerahkan mereka kepada musuh
  rationale: Pilihan utama mempertahankan metafora tajam dari teks Ibrani dan ketegangan teologis bahwa Allah sendiri membiarkan umat-Nya dikuasai musuh sebagai penghakiman.
translation_notes:
  register: Bahasa Indonesia baku modern dengan susunan puitis sejajar. Diksi dibuat lugas dan bermartabat; pengulangan “orang” memperjelas perbandingan jumlah, sedangkan metafora “menjual” dan sebutan “Gunung Batu” dipertahankan dari teks sumber.
