base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/042.yaml
  text: I will make my arrows drunk with blood[a], and my sword will devour flesh— with the blood of the slain and the captives, from the heads of the enemy leaders.
translation:
  language: id
  text: 'Aku akan memabukkan anak-anak panah-Ku dengan darah,

    dan pedang-Ku akan melahap daging—

    dengan darah orang-orang yang terbunuh dan darah para tawanan,

    dari kepala para pemimpin musuh.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “dari kepala-kepala musuh yang berambut terurai,” atau “dari kepala para pejuang musuh.” Ungkapan Ibrani ini sulit, terutama karena kata פַּרְעוֹת jarang digunakan dan maknanya diperdebatkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אַשְׁכִּיר
  choice: Aku akan memabukkan
  rationale: Bentuk hifil dari שׁכר secara harfiah berarti ‘membuat mabuk’. Metafora puitis yang kuat ini dipertahankan karena cocok dengan konteks nyanyian perang.
- source_word: חִצַּי
  choice: anak-anak panah-Ku
  rationale: Padanan Indonesia yang baku dan alami bagi bentuk jamak חֵץ dengan akhiran orang pertama tunggal.
- source_word: מִדָּם
  choice: dengan darah
  rationale: Preposisi מן sesudah ‘memabukkan’ menyatakan sarana atau bahan yang membuat anak-anak panah itu seolah-olah mabuk; ‘dengan’ paling alami dalam bahasa Indonesia.
- source_word: וְחַרְבִּי
  choice: dan pedang-Ku
  rationale: Menerjemahkan konstruksi posesif secara langsung dan mempertahankan gambaran peperangan.
- source_word: תֹּאכַל בָּשָׂר
  choice: akan melahap daging
  rationale: ‘Melahap’ mempertahankan personifikasi pedang yang ‘memakan’ daging sekaligus menyampaikan daya kekerasan ungkapan Ibrani dengan wajar.
- source_word: מִדַּם חָלָל
  choice: dengan darah orang-orang yang terbunuh
  rationale: חָלָל lazim menunjuk kepada orang yang tewas, khususnya dalam pertempuran. Bentuk jamak Indonesia menyampaikan makna kolektifnya.
- source_word: וְשִׁבְיָה
  choice: dan para tawanan
  rationale: Dalam konteks ini nomina tersebut dipahami secara personal sebagai orang-orang yang ditawan, sejajar dengan orang-orang yang terbunuh, meskipun secara leksikal dapat juga menunjuk pada penawanan.
- source_word: מֵרֹאשׁ
  choice: dari kepala
  rationale: Makna konkret ‘kepala’ dipertahankan dalam frasa yang sulit ini, tanpa mengubahnya secara diam-diam menjadi makna abstrak ‘yang terutama’.
- source_word: פַּרְעוֹת
  choice: para pemimpin
  rationale: Kata langka ini diperdebatkan dan dapat berkaitan dengan rambut terurai atau merujuk kepada tokoh-tokoh utama/prajurit. ‘Para pemimpin’ menghasilkan bacaan utama yang dapat dipahami, sementara kemungkinan harfiahnya dicatat dalam catatan kaki.
- source_word: אוֹיֵב
  choice: musuh
  rationale: Nomina tunggal ini bersifat kolektif; ‘musuh’ mempertahankan bentuk ringkas dan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Penafsiran frasa sulit מֵרֹאשׁ פַּרְעוֹת אוֹיֵב
  choice: dari kepala para pemimpin musuh
  alternative: dari kepala musuh yang berambut terurai; dari kepala para pejuang musuh
  rationale: Kesulitannya terutama bersifat leksikal dan sintaksis, bukan doktrinal. Teks utama dibuat terbaca tanpa menghapus gambaran konkret ‘kepala’, sedangkan ketidakpastian arti פַּרְעוֹת dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang puitis dan bermartabat. Metafora ‘memabukkan’ dan ‘melahap’ dipertahankan; susunan baris mengikuti paralelisme puisi Ibrani. Akhiran posesif ilahi ditulis dengan huruf kapital sesuai kebiasaan ejaan teks keagamaan Indonesia.
