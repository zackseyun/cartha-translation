  text: For they are a nation devoid of counsel, and there is no understanding in them.
translation:
  language: id
  text: Sebab mereka adalah bangsa yang tidak mempunyai pertimbangan, dan tidak ada pengertian dalam diri mereka.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan alasan atau penjelasan bagi pernyataan sebelumnya dan mempertahankan alur wacana Ibrani.
- source_word: גּוֹי
  choice: bangsa
  rationale: Nomina kolektif tunggal ini menunjuk kepada suatu kelompok bangsa; padanan ini alami dan sesuai konteks.
- source_word: אֹבַד עֵצוֹת
  choice: kehilangan nasihat
  rationale: Ungkapan ini menggambarkan bangsa yang tidak lagi memiliki nasihat atau pertimbangan yang dapat menuntunnya. Terjemahan ini mempertahankan citra kehilangan tanpa menghasilkan ungkapan Indonesia yang terlalu kaku.
- source_word: הֵמָּה
  choice: mereka adalah
  rationale: Pronomina mandiri memberi penegasan dan berfungsi dalam klausa nominal; kopula dinyatakan agar kalimat Indonesia jelas dan alami.
- source_word: וְאֵין
  choice: dan tidak ada
  rationale: Mempertahankan negasi eksistensial serta hubungan koordinatif antarklausa.
- source_word: בָּהֶם
  choice: dalam diri mereka
  rationale: Menunjukkan bahwa pengertian merupakan kualitas batin yang tidak terdapat pada bangsa tersebut; bentuk ini lebih alami daripada sekadar 'di dalam mereka'.
- source_word: תְּבוּנָה
  choice: pengertian
  rationale: Menyatakan kemampuan memahami atau membedakan dengan tepat dan mempertahankan kosakata hikmat dalam bahasa yang mudah dipahami.
