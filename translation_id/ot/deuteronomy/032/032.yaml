  text: כִּֽי מִ/גֶּ֤פֶן סְדֹם֙ גַּפְנָ֔/ם וּ/מִ/שַּׁדְמֹ֖ת עֲמֹרָ֑ה עֲנָבֵ֨/מוֹ֙ עִנְּבֵי ר֔וֹשׁ אַשְׁכְּלֹ֥ת מְרֹרֹ֖ת לָֽ/מוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/032.yaml
  text: For their vine is from the vine of Sodom, and from the fields of Gomorrah; their grapes are grapes of poison, their clusters are bitter to them.
translation:
  language: id
  text: 'Sebab pohon anggur mereka berasal dari pohon anggur Sodom,

    dan dari ladang-ladang Gomora.

    Buah anggur mereka adalah buah anggur beracun;

    tandan-tandannya pahit bagi mereka.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִגֶּפֶן סְדֹם
  choice: berasal dari pohon anggur Sodom
  rationale: Preposisi מִן menyatakan asal atau sumber; pengulangan גֶּפֶן dipertahankan untuk menjaga gambaran puitis teks.
- source_word: שַׁדְמוֹת
  choice: ladang-ladang
  rationale: Menunjuk pada tanah atau ladang yang dibudidayakan; bentuk jamaknya dipertahankan secara alami dalam bahasa Indonesia.
- source_word: עִנְּבֵי רוֹשׁ
  choice: buah anggur beracun
  rationale: רֹאשׁ di sini menunjuk pada tumbuhan atau zat beracun, bukan bagian tubuh 'kepala'; pilihan ini mempertahankan metafora hasil anggur yang mematikan.
- source_word: אַשְׁכְּלֹת מְרֹרֹת
  choice: tandan-tandannya pahit
  rationale: Menerjemahkan citra konkret tandan buah dan sifat feminin jamak 'pahit' secara idiomatis.
- source_word: לָמוֹ
  choice: bagi mereka
  rationale: Pronomina puitis ini dipertahankan karena hadir secara eksplisit dalam teks Masoret dan dapat menyatakan bahwa kepahitan itu menjadi bagian atau akibat bagi mereka.
theological_decisions:
- issue: Rujukan pronomina jamak dalam gambaran pohon anggur
  choice: mempertahankan 'mereka' tanpa menentukan kelompoknya di dalam ayat
  alternative: menyebut Israel atau musuh-musuh Israel secara eksplisit
  rationale: Teks ayat hanya memakai sufiks pronominal; identitas rujukannya bergantung pada konteks syair dan tidak boleh dipersempit secara doktrinal dalam terjemahan.
- issue: Makna לָמוֹ pada akhir ayat
  choice: bagi mereka
  alternative: menghilangkannya atau menerjemahkan hanya 'tandan-tandannya pahit'
  rationale: Unsur tersebut nyata dalam sumber Ibrani dan dipertahankan untuk menjaga ketegangan makna antara kepemilikan, pengalaman, dan akibat.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Paralelisme Ibrani dipertahankan melalui susunan empat baris, dengan istilah konkret yang mudah dipahami pembaca umum.
