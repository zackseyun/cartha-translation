  source_fidelity: 'Terjemahan dengan setia mengikuti struktur dan unsur utama Ibrani: asal metaforis dari Sodom dan ladang-ladang Gomora, buah anggur yang berupa רֹאשׁ (zat/tumbuhan beracun), serta tandan yang pahit bagi mereka. Unsur לָמוֹ di akhir ayat dipertahankan tanpa mempersempit fungsi atau rujukan puitisnya.'
