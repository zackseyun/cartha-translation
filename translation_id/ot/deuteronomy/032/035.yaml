revisions:
- from: Pembalasan adalah hak-Ku, demikian juga pembalasan setimpal,[a] pada saat kaki mereka tergelincir;[b] sebab hari bencana mereka sudah dekat, dan apa yang disiapkan bagi mereka segera datang.[c][d]
  to: Pembalasan dan ganjaran adalah milik-Ku,[a] pada waktu kaki mereka tergelincir;[b] sebab hari bencana mereka sudah dekat, dan apa yang telah disiapkan bagi mereka segera tiba.[c][d]
  rationale: Revisi membedakan dua istilah utama dalam paralelisme Ibrani, memakai “milik-Ku” untuk menyatakan kepunyaan/prerogatif tanpa parafrasa tambahan, dan memperbaiki alternatif catatan kaki untuk metafora kaki yang goyah atau tergelincir. Ketakterincian frasa terakhir tetap dipertahankan.
