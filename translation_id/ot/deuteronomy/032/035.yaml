source:
  edition: WLC
  text: לִ֤/י נָקָם֙ וְ/שִׁלֵּ֔ם לְ/עֵ֖ת תָּמ֣וּט רַגְלָ֑/ם כִּ֤י קָרוֹב֙ י֣וֹם אֵידָ֔/ם וְ/חָ֖שׁ עֲתִדֹ֥ת לָֽ/מוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/035.yaml
  text: Vengeance is mine[a], and recompense, at the time when their foot slips; for the day of their disaster is near[d][c][b], and what is prepared for them hastens.
translation:
  language: id
  text: Pembalasan dan ganjaran adalah milik-Ku,[a] pada waktu kaki mereka tergelincir;[b] sebab hari bencana mereka sudah dekat, dan apa yang telah disiapkan bagi mereka segera tiba.[c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “balasan” atau “pembalasan yang setimpal.”
    reason: lexical_alternative
  - marker: b
    text: Atau “kaki mereka goyah” atau “kaki mereka kehilangan pijakan.”
    reason: lexical_alternative
  - marker: c
    text: Atau “hal-hal yang ditentukan bagi mereka segera tiba”; ungkapan Ibraninya padat.
    reason: lexical_alternative
  - marker: d
    text: Bagian awal ayat ini dikutip dalam Roma 12:19 dan digemakan dalam Ibrani 10:30.
    reason: cross_reference
lexical_decisions:
- source_word: לִי נָקָם
  choice: Pembalasan adalah hak-Ku
  rationale: Ungkapan ini mempertahankan kepemilikan atau hak prerogatif ilahi yang dinyatakan oleh לִי, sekaligus menyampaikan נָקָם sebagai pembalasan yudisial, bukan dendam pribadi.
- source_word: וְשִׁלֵּם
  choice: demikian juga pembalasan setimpal
  rationale: Bentuk ini berfungsi secara nominal sejajar dengan נָקָם dan menunjuk pada balasan yang sepadan atau ganjaran yang patut.
- source_word: לְעֵת תָּמוּט רַגְלָם
  choice: pada saat kaki mereka tergelincir
  rationale: Mempertahankan gambaran puitis kaki tunggal kolektif serta gagasan keruntuhan yang segera terjadi.
- source_word: כִּי קָרוֹב יוֹם אֵידָם
  choice: sebab hari bencana mereka sudah dekat
  rationale: כִּי dipahami secara kausal; אֵיד diterjemahkan sebagai bencana untuk menyatakan malapetaka atau keruntuhan tanpa mempersempitnya lebih jauh.
- source_word: וְחָשׁ עֲתִדֹת לָמוֹ
  choice: dan apa yang disiapkan bagi mereka segera datang
  rationale: 'Frasa Ibrani yang padat dipertahankan secara konkret dan cukup terbuka: sesuatu telah tersedia atau ditentukan bagi mereka dan sedang mendekat dengan cepat.'
theological_decisions:
- issue: Hak prerogatif Allah dalam pembalasan
  choice: Pembalasan adalah hak-Ku
  alternative: Aku akan membalas dendam
  rationale: Pilihan utama mempertahankan pernyataan tentang hak ilahi untuk menjatuhkan balasan tanpa memberi kesan dendam pribadi yang picik.
- issue: Makna עֲתִדֹת לָמוֹ
  choice: apa yang disiapkan bagi mereka
  alternative: kebinasaan yang ditentukan bagi mereka
  rationale: Terjemahan konkret ini mempertahankan kepadatan dan ketakterincian teks Ibrani, tanpa menentukan bahwa yang dimaksud hanya satu bentuk hukuman tertentu.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada puitis dan khidmat. Struktur paralel Ibrani dipertahankan sejauh tetap alami, dan ambiguitas pada klausa terakhir tidak dipersempit.
