  verdict: revise
  source_fidelity: Revisi diperlukan terutama untuk membedakan נָקָם dari וְשִׁלֵּם. Draf mengulang “pembalasan” untuk keduanya, sedangkan unsur kedua menyatakan ganjaran/balasan yang diberikan. “Milik-Ku” secara langsung menyampaikan לִי tanpa menambahkan nuansa legal “hak.” Klausa terakhir dengan “segera tiba” mempertahankan subjek yang agak terbuka, yaitu hal-hal yang telah disiapkan bagi mereka.
  naturalness: Teks revisi tetap baku, puitis, dan mudah dipahami. “Pembalasan dan ganjaran adalah milik-Ku” lebih lancar daripada pengulangan “pembalasan ... pembalasan setimpal.”
  terminology: “Pembalasan” cocok bagi נָקָם dalam konteks penghakiman; “ganjaran” membedakan וְשִׁלֵּם tanpa mengarahkannya secara denominatif. “Bencana” cocok untuk אֵיד.
