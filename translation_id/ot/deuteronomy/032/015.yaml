  text: וַ/יִּשְׁמַ֤ן יְשֻׁרוּן֙ וַ/יִּבְעָ֔ט שָׁמַ֖נְתָּ עָבִ֣יתָ כָּשִׂ֑יתָ וַ/יִּטֹּשׁ֙ אֱל֣וֹהַ עָשָׂ֔/הוּ וַ/יְנַבֵּ֖ל צ֥וּר יְשֻׁעָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/015.yaml
  text: But Jeshurun grew fat and kicked; you grew fat[a], thick, and sleek. Then he forsook God who made him and treated with contempt the Rock of his salvation.
translation:
  language: id
  text: Namun Yesyurun menjadi gemuk lalu menendang; engkau menjadi gemuk, tambun, dan penuh lemak[a]. Ia meninggalkan Allah yang menjadikannya dan memandang rendah Gunung Batu keselamatannya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau mungkin, “tertutup lemak” atau “menjadi bengkak.” Kata Ibraninya langka dan nuansa tepatnya tidak pasti, tetapi gambaran tentang kegemukan akibat kelimpahan tetap jelas.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשֻׁרוּן
  choice: Yesyurun
  rationale: Nama atau gelar puitis bagi Israel ditransliterasikan agar daya puisinya dan kemungkinan makna gelarnya tetap terpelihara.
- source_word: וַיִּשְׁמַן
  choice: menjadi gemuk
  rationale: Mempertahankan gambaran konkret tentang kemakmuran yang menghasilkan kepuasan diri, bukan meratakannya menjadi sekadar 'makmur'.
- source_word: וַיִּבְעָט
  choice: menendang
  rationale: Mempertahankan metafora hidup tentang hewan kenyang yang menjadi liar atau membangkang.
- source_word: שָׁמַנְתָּ
  choice: engkau menjadi gemuk
  rationale: Bentuk orang kedua tunggal dipertahankan untuk menjaga peralihan retoris dari narasi ke teguran langsung.
- source_word: עָבִיתָ
  choice: tambun
  rationale: Kata ini memperkuat gambaran tubuh yang membesar karena kelimpahan; 'tambun' alami dan jelas dalam bahasa Indonesia.
- source_word: כָּשִׂיתָ
  choice: berlemak
  rationale: Bentuk Ibrani ini langka dan makna persisnya tidak pasti, tetapi jelas meneruskan citra kegemukan berlebihan; alternatif dijelaskan dalam catatan kaki.
- source_word: וַיִּטֹּשׁ
  choice: meninggalkan
  rationale: Menyampaikan tindakan berpaling dan ketidaksetiaan dengan bahasa Indonesia modern tanpa nada arkais.
- source_word: אֱלוֹהַ עָשָׂהוּ
  choice: Allah yang menjadikannya
  rationale: Mempertahankan struktur klausa relatif dan menggambarkan Allah sebagai pembentuk atau pencipta Israel.
- source_word: וַיְנַבֵּל
  choice: menghina
  rationale: Secara ringkas menyampaikan tindakan memperlakukan sebagai hina atau menunjukkan sikap meremehkan.
- source_word: צוּר
  choice: Gunung Batu
  rationale: Metafora ilahi yang berulang dalam Nyanyian Musa dipertahankan sebagai sebutan bagi Allah; kapitalisasi menandai fungsi titularnya.
- source_word: יְשׁוּעָתוֹ
  choice: keselamatannya
  rationale: Mempertahankan cakupan teologis istilah yang menunjuk pada penyelamatan atau kelepasan dari Allah.
theological_decisions:
- issue: Peralihan dari orang ketiga ke orang kedua lalu kembali ke orang ketiga
  choice: 'Dipertahankan: ''Yesyurun ... engkau ... Ia'''
  alternative: Menyeragamkan seluruh ayat menjadi orang ketiga
  rationale: Peralihan persona terdapat dalam teks Ibrani dan memberi tekanan berupa tuduhan langsung; menyeragamkannya akan menghilangkan ketegangan puitis.
- issue: Metafora ilahi צוּר
  choice: Gunung Batu sebagai sebutan ilahi
  alternative: gunung batu tanpa kapitalisasi atau Pelindung
  rationale: Nyanyian Musa memakai metafora ini berulang kali bagi Allah. Mempertahankan metaforanya lebih setia daripada menggantinya dengan tafsiran fungsional.
- issue: Subjek tersirat sesudah teguran langsung
  choice: Ia, merujuk kembali kepada Yesyurun/Israel
  alternative: Engkau, dengan meneruskan sapaan langsung
  rationale: Bentuk verba Ibrani kembali kepada orang ketiga tunggal, sehingga perubahan tersebut dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Metafora kegemukan serta tendangan dipertahankan, demikian juga perubahan persona yang disengaja. 'Yesyurun' mengikuti bentuk transliterasi Indonesia; 'Gunung Batu' dipakai sebagai metafora ilahi yang sudah alami dalam tradisi bahasa Indonesia.
