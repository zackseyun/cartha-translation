  text: I will heap disasters upon them[b][a]; I will use up my arrows against them.
translation:
  language: id
  text: Aku akan menimbunkan malapetaka[a] atas mereka; anak-anak panah-Ku akan Kuhabiskan untuk melawan mereka.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “bencana”; secara harfiah, “hal-hal buruk” atau “kejahatan-kejahatan”, di sini dalam arti malapetaka yang mendatangkan celaka, bukan kejahatan moral.
    reason: lexical_alternative
  - marker: b
    text: Atau “Aku akan menggunakan habis anak-anak panah-Ku terhadap mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַסְפֶּה
  choice: Aku akan menimbunkan
  rationale: Bentuk Hifil imperfek orang pertama tunggal dari אסף di sini menyatakan tindakan membuat berbagai malapetaka bertumpuk atau datang bertubi-tubi atas sasaran. 'Menimbunkan' mempertahankan gambaran akumulasi dan corak puitis.
- source_word: עָלֵימוֹ
  choice: ke atas mereka
  rationale: Preposisi עַל dengan sufiks orang ketiga jamak menunjukkan arah datangnya malapetaka atas mereka; ungkapan ini mempertahankan metafora spasial Ibrani secara wajar dalam bahasa Indonesia.
- source_word: רָעוֹת
  choice: malapetaka
  rationale: Dalam konteks penghukuman ini, bentuk jamak רָעוֹת menunjuk kepada kejadian buruk atau bencana yang menimpa, bukan kejahatan moral. 'Malapetaka' menyampaikan beratnya hukuman tanpa menghapus keluasan makna dasarnya.
- source_word: חִצַּי
  choice: anak-anak panah-Ku
  rationale: Terjemahan harfiah mempertahankan metafora perang dalam syair tersebut.
- source_word: אֲכַלֶּה
  choice: akan Kuhabiskan
  rationale: Bentuk Piel imperfek orang pertama tunggal dari כלה menyatakan menghabiskan sepenuhnya. Dengan anak panah sebagai objek, 'Kuhabiskan' menyampaikan penggunaan sampai persediaannya habis.
- source_word: בָּם
  choice: untuk menyerang mereka
  rationale: Preposisi ב di sini menandai sasaran penggunaan anak-anak panah. Rumusan ini alami dalam bahasa Indonesia dan tetap mempertahankan arah permusuhan dalam metafora perang.
theological_decisions:
- issue: Pemaknaan רָעוֹת dalam konteks penghukuman ilahi
  choice: malapetaka
  alternative: kejahatan; bencana
  rationale: Kata Ibrani ini secara luas dapat berarti hal-hal buruk, tetapi dalam konteks ini menunjuk kepada malapetaka sebagai hukuman. Pilihan tersebut tidak menyiratkan bahwa Allah melakukan kejahatan moral, sekaligus tetap mempertahankan kerasnya penghakiman dalam teks.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan bermartabat, dengan paralelisme serta citra puitis nyanyian dipertahankan. Kapitalisasi pada enklitik ilahi mengikuti kebiasaan ortografis teks Alkitab bahasa Indonesia.
