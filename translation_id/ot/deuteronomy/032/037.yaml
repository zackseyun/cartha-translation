  text: וְ/אָמַ֖ר אֵ֣י אֱלֹהֵ֑י/מוֹ צ֖וּר חָסָ֥יוּ בֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/037.yaml
  text: And he will say[a], ‘Where are their gods, the rock in which they took refuge?’
translation:
  language: id
  text: Dan ia akan berkata,[a] “Di manakah allah-allah mereka, gunung batu tempat mereka berlindung?”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bentuk Ibrani juga dapat diterjemahkan, “Dan ia berkata.” Dalam konteks ini, daya futur dipandang paling sesuai.
    reason: Kemungkinan aspek/waktu verba dalam puisi Ibrani.
  - marker: b
    text: 'Lebih harfiah: “gunung batu yang padanya mereka berlindung.” Kata “gunung batu” berbentuk tunggal dan menjelaskan “allah-allah mereka.”'
    reason: Menjelaskan konstruksi aposisional serta pronomina tunggal בּוֹ.
lexical_decisions:
- source_word: וְאָמַר
  choice: Dan ia akan berkata
  rationale: Konjungsi וְ dipertahankan sebagai “Dan”. Bentuk verba puitis ini, dalam alur Ulangan 32:36–38, paling wajar dipahami berdaya futur, tetapi kemungkinan pembacaan lampau dicatat dalam catatan kaki.
- source_word: אֵי
  choice: Di manakah
  rationale: Partikel tanya lokasi diterjemahkan secara langsung dan wajar dalam bahasa Indonesia; jumlah gramatikal tampak pada frasa nominal sesudahnya.
- source_word: אֱלֹהֵימוֹ
  choice: allah-allah mereka
  rationale: Bentuk jamak dengan akhiran orang ketiga jamak menunjuk kepada dewa-dewa yang menjadi tempat kepercayaan mereka. Huruf kecil membedakannya dari sebutan bagi Allah Israel.
- source_word: צוּר
  choice: gunung batu
  rationale: Metafora konkret צוּר dipertahankan. Dalam ayat ini istilah tersebut menjelaskan “allah-allah mereka”, bukan menjadi gelar bagi TUHAN, sehingga ditulis dengan huruf kecil.
- source_word: חָסָיוּ
  choice: mereka berlindung
  rationale: Verba חסה berarti mencari atau mendapat perlindungan; “berlindung” mempertahankan gambaran perlindungan lebih tepat daripada sekadar “percaya”.
- source_word: בּוֹ
  choice: tempat
  rationale: Ungkapan relatif “tempat mereka berlindung” alami dalam bahasa Indonesia dan menghubungkan tindakan berlindung dengan “gunung batu”; bentuk tunggal maskulin dalam bahasa sumber dijelaskan dalam catatan kaki.
theological_decisions:
- issue: Identitas pembicara dan daya waktu verba
  choice: 'Dipahami sebagai kelanjutan perkataan TUHAN dengan daya futur: “ia akan berkata”'
  alternative: “ia berkata” atau “lalu orang akan berkata”
  rationale: Konteks Ulangan 32:36–38 paling kuat mendukung TUHAN sebagai pembicara dan tindakan yang akan terjadi, tetapi bentuk puitis Ibrani memungkinkan pembacaan aspek/waktu yang berbeda; karena itu alternatif dicatat tanpa mengubah teks utama.
- issue: Status metafora צוּר
  choice: “gunung batu” dengan huruf kecil sebagai aposisi bagi allah-allah mereka
  alternative: “Gunung Batu” sebagai gelar ilahi
  rationale: Rujukan terdekat ialah “allah-allah mereka”. Huruf kecil mempertahankan ironi polemis dan mencegah metafora itu disalahpahami sebagai gelar bagi TUHAN dalam ayat ini.
- issue: Ketegangan antara nomina jamak dan aposisi tunggal
  choice: Mempertahankan “allah-allah mereka” diikuti “gunung batu” tunggal
  alternative: Menjamakkan metafora menjadi “gunung-gunung batu”
  rationale: Bahasa Ibrani dengan sengaja menempatkan צוּר tunggal sesudah אֱלֹהֵימוֹ yang bermakna jamak. Ketegangan gramatikal dan retoris itu tidak diratakan dalam terjemahan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Gunung batu” mempertahankan metafora konkret tanpa memberi kapitalisasi gelar ilahi. Susunan pertanyaan dibuat alami, sementara ketegangan antara “allah-allah” yang jamak dan “gunung batu” yang tunggal tetap dipertahankan.
