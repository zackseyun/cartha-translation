  text: For I lift up my hand to heaven and say[a], ‘As I live forever,’
translation:
  language: id
  text: Sebab Aku mengangkat tangan-Ku ke langit dan berkata[a], “Demi Aku yang hidup selama-lamanya,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih harfiah, “Aku mengangkat tangan-Ku ke langit dan berkata, ‘Aku hidup selama-lamanya.’” Teks utama menampilkan daya ungkapan Ibrani sebagai sumpah.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Memperkenalkan dasar khidmat bagi pernyataan sebelumnya dan mempertahankan hubungan wacana tanpa menjadikannya temporal.
- source_word: אֶשָּׂא
  choice: Aku mengangkat
  rationale: Mempertahankan tindakan konkret mengangkat tangan sebagai gestur sumpah; bentuk kini cocok dengan daya performatif dalam konteks.
- source_word: אֶל שָׁמַיִם
  choice: ke langit
  rationale: Ungkapan Indonesia yang alami untuk arah gerakan tangan; bentuk tunggal kolektif 'langit' sesuai idiom Indonesia.
- source_word: יָדִי
  choice: tangan-Ku
  rationale: Mempertahankan nomina tunggal dan kepemilikan orang pertama; kapitalisasi mengikuti rujukan ilahi.
- source_word: וְאָמַרְתִּי
  choice: dan berfirman
  rationale: Dalam konteks ucapan langsung Allah, 'berfirman' merupakan padanan Indonesia yang wajar dan bermartabat bagi tindakan berkata, tanpa menambahkan isi.
- source_word: חַי אָנֹכִי
  choice: Demi Aku yang hidup
  rationale: Menyampaikan daya idiomatis formula sumpah ilahi, bukan sekadar pernyataan bahwa Allah hidup.
- source_word: לְעֹלָם
  choice: selama-lamanya
  rationale: Menyatakan durasi yang tidak berakhir dalam bahasa Indonesia yang alami dan khidmat.
theological_decisions:
- issue: Daya formula sumpah diri ilahi
  choice: Demi Aku yang hidup selama-lamanya
  alternative: Aku hidup selama-lamanya
  rationale: Konteks mengangkat tangan menunjukkan sumpah. 'Demi Aku yang hidup' menyampaikan fungsi sumpah itu, sedangkan alternatif lebih formal tetapi dapat terbaca hanya sebagai pernyataan keberadaan. Terjemahan tidak menambahkan objek sumpah di luar diri Allah sendiri.
- issue: Cakupan לְעֹלָם dalam formula
  choice: 'Mengaitkannya dengan ''yang hidup'': ''yang hidup selama-lamanya'''
  alternative: Memisahkannya sebagai keterangan atas seluruh ujaran
  rationale: Susunan Ibrani paling alami menautkan 'selama-lamanya' dengan hidupnya Sang Pembicara, sambil tetap mempertahankan fungsi seluruh frasa sebagai sumpah.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. Kata ganti serta akhiran posesif yang merujuk kepada Allah dikapitalisasi. 'Berfirman' dipakai karena penuturnya adalah Allah; catatan kaki menyediakan bentuk yang lebih harfiah dan mempertahankan ambiguitas antara pernyataan langsung dan formula sumpah.
