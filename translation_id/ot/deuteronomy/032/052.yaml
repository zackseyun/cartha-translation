base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/052.yaml
  text: For you shall see the land from a distance[a], but you shall not go there[b], into the land that I am giving to the sons of Israel.
translation:
  language: id
  text: Sebab engkau akan melihat negeri itu dari kejauhan,[a] tetapi engkau tidak akan masuk ke sana, ke negeri yang Kuberikan kepada anak-anak Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “dari seberangnya” atau “dari jauh”; ungkapan Ibrani menunjukkan bahwa Musa akan melihat negeri itu tanpa memasukinya.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan alasan atau penjelasan bagi pernyataan sebelumnya; “Sebab” mempertahankan hubungan wacana tersebut secara alami dan bermartabat.
- source_word: מִנֶּגֶד
  choice: dari kejauhan
  rationale: Ungkapan ini menunjukkan bahwa Musa melihat negeri itu dari seberang atau dari jarak tertentu tanpa memasukinya; “dari kejauhan” paling alami dalam bahasa Indonesia modern, sementara alternatif harfiah dicatat dalam catatan kaki.
- source_word: תִּרְאֶה
  choice: engkau akan melihat
  rationale: Bentuk imperfek orang kedua tunggal maskulin bersifat prediktif dalam konteks keputusan ilahi ini. “Akan melihat” menyampaikan makna masa depan dengan wajar.
- source_word: הָאָרֶץ
  choice: negeri itu
  rationale: Dalam konteks ini אֶרֶץ menunjuk pada negeri yang dijanjikan kepada Israel. “Negeri” sesuai untuk wilayah atau tanah air, dan “itu” menandai acuannya yang sudah dikenal.
- source_word: וְשָׁמָּה לֹא תָבֹא
  choice: tetapi engkau tidak akan masuk ke sana
  rationale: בוא dapat berarti datang, pergi, atau masuk. Karena larangannya menyangkut tidak memasuki negeri tersebut, “masuk ke sana” menyampaikan maksud konteks secara jelas; waw dapat bernuansa kontras dan diterjemahkan “tetapi”.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: yang Kuberikan
  rationale: Partisipel נֹתֵן menggambarkan pemberian ilahi sebagai tindakan yang sedang berlaku atau segera diwujudkan. Bentuk Indonesia “Kuberikan” alami dan tidak memaksakan pembedaan aspek yang kaku.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: kepada anak-anak Israel
  rationale: Ungkapan konvensional ini secara harfiah memakai bentuk jamak maskulin “anak-anak lelaki,” tetapi merujuk kepada umat Israel secara kolektif. “Anak-anak Israel” mempertahankan bentuk kekerabatan tanpa menyiratkan bahwa hanya laki-laki yang dimaksud.
theological_decisions:
- issue: Cakupan sebutan perjanjian בְנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  alternative: putra-putra Israel; orang Israel; umat Israel
  rationale: Bentuk Ibrani secara gramatikal maskulin, tetapi merupakan sebutan nasional konvensional bagi seluruh umat. “Anak-anak Israel” mempertahankan metafora keturunan dan tidak mempersempit acuannya hanya kepada laki-laki.
- issue: Sifat pemberian negeri dalam אֲנִי נֹתֵן
  choice: yang Kuberikan
  alternative: yang sedang Kuberikan; yang akan Kuberikan
  rationale: Partisipel Ibrani memungkinkan nuansa tindakan yang berlangsung atau segera terwujud. Bentuk kini bahasa Indonesia mempertahankan ketegangan tersebut tanpa mengubahnya menjadi semata-mata janji masa depan.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan bermartabat. Pronomina “engkau” mempertahankan sapaan tunggal kepada Musa, sedangkan bentuk terikat “Kuberikan” menandai bahwa Allah adalah pembicara. Tanda koma sebelum [a] ditempatkan setelah frasa yang dijelaskan.
