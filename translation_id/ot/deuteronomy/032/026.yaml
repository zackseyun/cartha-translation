  text: אָמַ֖רְתִּי אַפְאֵי/הֶ֑ם אַשְׁבִּ֥יתָה מֵ/אֱנ֖וֹשׁ זִכְרָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/026.yaml
  text: I said[a], ‘I would scatter them[b]; I would make their memory cease from mankind,’
translation:
  language: id
  text: Aku berkata, “Aku hendak mencerai-beraikan mereka[a]; Aku hendak melenyapkan kenangan tentang mereka dari antara manusia[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menghamburkan mereka,” “menghalau mereka,” atau “menyebarkan mereka ke berbagai penjuru.” Kata kerja Ibraninya langka dan sulit dipastikan; sebagian orang memahaminya sebagai menghalau mereka ke sudut-sudut atau menyingkirkan mereka dari pandangan.
    reason: lexical_alternative
  - marker: b
    text: Secara lebih harfiah, “dari manusia” atau “dari insan fana.” Bahasa Ibrani memakai kata berbentuk tunggal dengan arti kolektif bagi manusia.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: Aku berkata
  rationale: Bentuk Qal perfektif orang pertama tunggal dari אמר secara langsung memperkenalkan maksud yang dinyatakan oleh TUHAN dalam wacana puitis.
- source_word: אַפְאֵיהֶם
  choice: mencerai-beraikan mereka
  rationale: Bentuk Ibrani ini langka dan sulit. Makna tradisionalnya berkisar pada menyebarkan, menghamburkan, atau menghalau ke berbagai penjuru. Pilihan ini jelas dalam bahasa Indonesia tanpa menutup kemungkinan nuansa lain.
- source_word: אַשְׁבִּיתָה
  choice: melenyapkan
  rationale: Bentuk Hifil dari שבת menyatakan tindakan menyebabkan sesuatu berhenti atau tidak ada lagi. Dengan 'kenangan' sebagai objek, 'melenyapkan' menyampaikan hasil yang dimaksud secara alami.
- source_word: מֵאֱנוֹשׁ
  choice: dari antara manusia
  rationale: אֱנוֹשׁ merupakan sebutan kolektif tunggal bagi manusia dan dapat menonjolkan kefanaan mereka. 'Dari antara manusia' mempertahankan cakupan kolektifnya dalam bahasa Indonesia.
- source_word: זִכְרָם
  choice: kenangan tentang mereka
  rationale: זֵכֶר menunjuk pada kenangan atau hal yang membuat seseorang tetap diingat. Ungkapan ini alami dan mempertahankan gagasan bahwa mereka tidak lagi dikenang.
theological_decisions:
- issue: Firman ilahi dan ancaman penghukuman dalam puisi
  choice: Memakai 'hendak' untuk menyatakan maksud ilahi yang telah diucapkan
  alternative: 'Memakai bentuk masa depan tegas: ''Aku akan mencerai-beraikan mereka; Aku akan melenyapkan ...'''
  rationale: '''Hendak'' menyampaikan niat yang tegas namun tetap memungkinkan ayat berikutnya menjelaskan mengapa penghukuman itu tidak dijalankan sepenuhnya. Dengan demikian, ketegangan dalam konteks dipertahankan dan tidak diselesaikan secara diam-diam.'
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Pengulangan 'Aku hendak' mempertahankan kesejajaran dua klausa Ibrani, sedangkan 'mencerai-beraikan' dan 'melenyapkan kenangan' tetap mudah dipahami oleh pembaca umum.
