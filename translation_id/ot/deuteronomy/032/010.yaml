base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/010.yaml
  text: He found him in a desert land[a], and in the howling waste of the wilderness; he surrounded him, he cared for him[b], he guarded him like the pupil of his eye.
translation:
  language: id
  text: Ia menemukannya di tanah gurun, di padang tandus yang mengaung; Ia mengelilinginya, memperhatikannya[a], dan menjaganya seperti pupil mata-Nya[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani ini juga dapat diterjemahkan “memberinya pengertian” atau “memahaminya.”
    reason: alternative_reading
  - marker: b
    text: 'Secara tradisional: “seperti biji mata-Nya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יִמְצָאֵהוּ
  choice: Ia menemukan dia
  rationale: Kata kerja מצא pada bentuk ini berarti ‘menemukan’. Pronomina tunggal dipertahankan karena syair menggambarkan Israel/Yakub sebagai satu pribadi.
- source_word: בְּאֶרֶץ מִדְבָּר
  choice: di negeri padang gurun
  rationale: Ungkapan ini mempertahankan unsur אֶרֶץ (‘negeri/tanah’) dan מִדְבָּר (‘padang gurun’) dalam susunan Indonesia yang wajar.
- source_word: וּבְתֹהוּ יְלֵל יְשִׁמֹן
  choice: di tengah ketandusan gurun yang mengaung
  rationale: תֹהוּ menyatakan kehampaan atau ketandusan, יְשִׁמֹן adalah gurun tandus, dan יְלֵל menghadirkan bunyi mengaung. Terjemahan ini mempertahankan gambaran puitis tempat yang sunyi dan tidak ramah tanpa memasukkan makna kosmologis ‘kekacauan’.
- source_word: יְסֹבְבֶנְהוּ
  choice: Ia mengelilinginya
  rationale: סבב secara konkret berarti ‘mengelilingi’. Bentuk ini mempertahankan citra sumber dan membiarkan fungsi perlindungannya tampil dari konteks.
- source_word: יְבֹונְנֵהוּ
  choice: memperhatikannya
  rationale: Kata kerja dari בין/בונן dapat menyatakan memahami, memberi pengertian, mempertimbangkan, atau memberikan perhatian. ‘Memperhatikannya’ cocok dengan rangkaian tindakan pemeliharaan sekaligus tidak menutup ambiguitas leksikal, yang dicatat dalam catatan kaki.
- source_word: יִצְּרֶנְהוּ
  choice: menjaganya
  rationale: נצר berarti menjaga, melindungi, atau memelihara. ‘Menjaganya’ alami dalam bahasa Indonesia dan selaras dengan perumpamaan mengenai mata.
- source_word: כְּאִישׁוֹן עֵינוֹ
  choice: seperti pupil mata-Nya
  rationale: אִישׁוֹן menunjuk pada pupil mata. ‘Pupil mata’ transparan bagi pembaca modern dan lebih langsung daripada ungkapan idiomatis tradisional ‘biji mata’, yang diberikan dalam catatan kaki.
theological_decisions:
- issue: Acuan pronomina maskulin tunggal
  choice: Pronomina tunggal dipertahankan untuk Israel/Yakub yang dipersonifikasikan secara kolektif.
  alternative: Mengubahnya menjadi bentuk jamak yang secara eksplisit menunjuk kepada bangsa Israel.
  rationale: Konteks Kidung Musa menyebut Yakub/Israel secara kolektif dengan bentuk tunggal. Terjemahan tidak meratakan personifikasi puitis itu menjadi bentuk jamak.
- issue: Nuansa tindakan ilahi dalam יְבֹונְנֵהוּ
  choice: memperhatikannya
  alternative: memberinya pengertian; mengajarinya; memeliharanya
  rationale: Bentuk Ibrani dapat menunjuk pada pemberian pengertian ataupun perhatian yang penuh pertimbangan. Dalam rangkaian ‘mengelilingi’ dan ‘menjaga’, makna perhatian cocok secara kontekstual, sedangkan catatan kaki mempertahankan kemungkinan makna intelektual.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang tetap mudah dipahami. Kapitalisasi pada pronomina ‘Ia’ dan akhiran ‘-Nya’ menandai bahwa pelakunya adalah TUHAN menurut konteks, sementara bentuk tunggal bagi Israel/Yakub dipertahankan. Klausa Ibrani yang padat tentang gurun disusun secara alami tanpa menghilangkan gambaran ketandusan dan suara mengaung.
