  text: For their rock is not like our Rock[a], and our enemies are judges.
translation:
  language: id
  text: Sebab batu karang mereka tidak seperti Batu Karang kita, dan musuh-musuh kita adalah para hakim.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, kata Ibrani yang diterjemahkan “para hakim” juga dapat berarti “para penengah.” Ungkapan ini bernuansa pengadilan, tetapi tidak menyebutkan secara langsung putusan yang diberikan oleh musuh-musuh Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini memperkenalkan dasar atau penjelasan bagi pernyataan sebelumnya dalam Nyanyian Musa.
- source_word: כְצוּרֵנוּ
  choice: seperti Batu Karang kita
  rationale: Metafora batu karang dipertahankan karena menunjuk kepada Allah Israel dan sengaja dikontraskan dengan objek kepercayaan bangsa-bangsa. Huruf kapital menandai pemakaiannya sebagai sebutan ilahi tanpa mengganti metaforanya dengan tafsiran.
- source_word: צוּרָם
  choice: batu karang mereka
  rationale: Nomina yang sama dipertahankan untuk menjaga permainan kata dan kontras dengan Allah Israel; huruf kecil membedakan objek kepercayaan mereka dari Batu Karang Israel.
- source_word: וְאֹיְבֵינוּ
  choice: dan musuh-musuh kita sendiri
  rationale: Konjungsi diterjemahkan secara langsung, sedangkan 'sendiri' menyampaikan daya retoris bahwa bahkan pihak lawan berada dalam kedudukan untuk memberi penilaian.
- source_word: פְּלִילִים
  choice: hakim-hakim
  rationale: Bentuk jamak ini secara harfiah berarti para hakim atau penengah. Terjemahan nominal mempertahankan citra yudisial dan tidak memperjelas secara berlebihan putusan yang mereka berikan.
theological_decisions:
- issue: Apakah צוּר perlu ditafsirkan dengan gelar penjelas atau dipertahankan sebagai metafora
  choice: Mempertahankan 'Batu Karang' sebagai metafora dan sebutan bagi Allah Israel
  alternative: pelindung; tempat perlindungan; kekuatan
  rationale: Teks Ibrani memakai nomina yang sama bagi Allah Israel dan bagi sandaran bangsa-bangsa. Mempertahankan metafora menjaga kontras sastra dan teologisnya.
- issue: Apakah פְּלִילִים harus diubah menjadi tindakan bersaksi atau menjatuhkan putusan tertentu
  choice: Menerjemahkannya secara nominal sebagai 'hakim-hakim'
  alternative: menghakimi; memutuskan; menjadi saksi
  rationale: Bahasa Ibrani menyebut musuh sebagai hakim atau penengah, tetapi tidak menyatakan secara eksplisit isi putusan mereka. Terjemahan nominal mempertahankan ketegangan dan nuansa forensiknya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. 'Batu Karang' dipilih sebagai metafora yang mudah dipahami serta mempertahankan pengulangan kata Ibrani; kapitalisasi membedakan sebutan bagi Allah Israel dari batu karang bangsa-bangsa.
