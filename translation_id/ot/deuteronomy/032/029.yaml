  text: If only they were wise[a], they would understand this; they would discern their end.
translation:
  language: id
  text: Ah, sekiranya mereka bijaksana, tentu mereka akan memahami hal ini; mereka akan mengerti kesudahan mereka.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “masa depan mereka” atau “apa yang kelak terjadi atas mereka.” Kata Ibrani ini dapat menunjuk pada hasil akhir seseorang atau pada apa yang terjadi kemudian.
    reason: lexical_alternative
lexical_decisions:
- source_word: ל֥וּ
  choice: Sekiranya
  rationale: Partikel ini menyatakan harapan atau ratapan, bukan sekadar syarat biasa. “Sekiranya” menyampaikan daya optatif itu secara wajar dan bermartabat dalam bahasa Indonesia.
- source_word: חָכְמ֖וּ
  choice: mereka bijaksana
  rationale: Bentuk dari חכם menunjuk pada memiliki atau menjalankan hikmat; ungkapan ini alami setelah “Sekiranya”.
- source_word: יַשְׂכִּ֣ילוּ
  choice: mereka akan memahami
  rationale: Bentuk hifil dari שׂכל dapat berarti memperoleh pengertian atau bertindak dengan bijaksana. Dalam paralelisme ini, “memahami” mempertahankan penekanan kognitif.
- source_word: זֹ֑את
  choice: hal ini
  rationale: Demonstrativa tunggal ini menunjuk pada kenyataan atau pelajaran yang baru disebutkan; “hal ini” lebih alami daripada “ini” yang berdiri sendiri.
- source_word: יָבִ֖ינוּ
  choice: mereka akan mengerti
  rationale: בין berarti menangkap, membedakan, atau mengerti. Pilihan ini tetap membedakannya secara halus dari “memahami” sambil menjaga paralelisme puitis.
- source_word: לְאַחֲרִיתָם
  choice: kesudahan mereka
  rationale: אַחֲרִית dapat menunjuk pada hasil akhir, masa kemudian, atau masa depan. “Kesudahan mereka” ringkas serta mempertahankan bobot peringatan dalam konteks.
theological_decisions:
- issue: Makna אַחֲרִיתָם dalam konteks
  choice: kesudahan mereka
  alternative: masa depan mereka; apa yang kelak terjadi atas mereka
  rationale: Konteksnya mendorong mereka menyadari hasil akhir yang menanti. “Kesudahan mereka” menjaga daya moral dan penghakiman dalam nyanyian ini tanpa mempersempit maknanya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puitis yang ringkas dan bermartabat. Susunan dua klausa paralel dipertahankan, sedangkan kosakata dipilih agar mudah dipahami pembaca umum.
