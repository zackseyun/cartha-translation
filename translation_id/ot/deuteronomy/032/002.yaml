base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/002.yaml
  text: May my teaching fall like the rain[a]; may my speech drip like the dew, like showers upon the tender grass[b], and like abundant rain upon the green plants.
translation:
  language: id
  text: Biarlah ajaranku menetes seperti hujan[a], dan perkataanku menetes seperti embun, seperti hujan rintik di atas rumput muda[b], dan seperti hujan lebat di atas tanaman hijau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “turun” atau “tercurah”; kata kerja Ibraninya menggambarkan ajaran yang turun seperti hujan.
    reason: lexical_alternative
  - marker: b
    text: “Hujan rintik” menerjemahkan istilah Ibrani langka yang mungkin berarti hujan ringan atau titik-titik hujan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יַעֲרֹף
  choice: menetes
  rationale: Kata kerja ini menggambarkan sesuatu yang turun dalam tetesan, khususnya seperti hujan. “Menetes” mempertahankan citra puitis itu tanpa memakai istilah teknis atau kuno.
- source_word: לִקְחִי
  choice: ajaranku
  rationale: לֶקַח menunjuk pada ajaran atau pengajaran yang diberikan atau diterima; “ajaranku” alami dalam konteks perkataan Musa.
- source_word: תִּזַּל
  choice: mengalir
  rationale: Kata kerja נזל dapat berarti mengalir atau menitik. “Mengalir” cocok dengan embun dan menghindari pengulangan “menetes” pada baris sebelumnya.
- source_word: אִמְרָתִי
  choice: perkataanku
  rationale: אִמְרָה berarti perkataan atau tuturan. Bentuk ini mempertahankan kesejajaran dengan “ajaranku” dan tidak membatasinya pada satu kata saja.
- source_word: שְׂעִירִם
  choice: hujan rintik
  rationale: Istilah langka ini dalam konteksnya menunjuk pada hujan ringan atau titik-titik hujan. “Hujan rintik” jelas dan alami, sambil mempertahankan kelembutan citranya.
- source_word: דֶשֶׁא
  choice: rumput muda
  rationale: דֶשֶׁא menunjuk pada tumbuhan yang baru bertunas atau rerumputan segar; “rumput muda” menyampaikan pertumbuhan yang masih muda tanpa menjadi terlalu teknis.
- source_word: רְבִיבִים
  choice: hujan lebat
  rationale: רְבִיבִים menunjuk pada curahan hujan yang banyak atau deras. “Hujan lebat” membentuk perkembangan alami dari hujan rintik menuju curahan yang lebih kuat.
- source_word: עֵשֶׂב
  choice: tanaman hijau
  rationale: עֵשֶׂב lebih luas daripada rumput dan mencakup tumbuh-tumbuhan. “Tanaman hijau” mudah dipahami serta membedakannya dari דֶשֶׁא pada baris sebelumnya.
