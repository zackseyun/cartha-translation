base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/051.yaml
  text: because you acted unfaithfully against me among the sons of Israel at the waters of Meribath-kadesh[a], in the wilderness of Zin[c][b], because you did not treat me as holy among the sons of Israel.
translation:
  language: id
  text: karena kalian berlaku tidak setia kepada-Ku di tengah-tengah bani Israel, di perairan Meriba-Kades[a] di padang gurun Zin, karena kalian tidak memperlakukan Aku sebagai kudus[b] di tengah-tengah bani Israel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Meriba-Kades” juga dapat diterjemahkan “Meriba di Kades” atau, secara lebih harfiah, “perairan pertengkaran di Kades.”
    reason: lexical_alternative
  - marker: b
    text: Atau “tidak menguduskan Aku” atau “tidak menyatakan kekudusan-Ku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעַלְתֶּם בִּי
  choice: kalian berlaku tidak setia kepada-Ku
  rationale: Kata kerja מעל menyatakan pelanggaran kesetiaan, sering dengan nuansa hubungan perjanjian. Bentuk orang kedua jamak dinyatakan dengan “kalian,” sedangkan ב menandai pihak yang menjadi sasaran ketidaksetiaan dan secara alami diterjemahkan “kepada-Ku.”
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: di tengah-tengah bani Israel
  rationale: Ungkapan ini dipertahankan secara konsisten pada kedua kemunculannya. “Bani Israel” merupakan ungkapan baku dan bermartabat dalam bahasa Indonesia serta tetap dekat dengan bentuk Ibrani “anak-anak Israel.”
- source_word: בְּמֵי מְרִיבַת קָדֵשׁ
  choice: di mata air Meriba-Kades
  rationale: Ungkapan ini menunjuk tempat dan peristiwa yang dikenal. “Meriba-Kades” mempertahankan daya nama tempat, sedangkan “mata air” menyampaikan מֵי secara alami dalam konteks lokasi tersebut.
- source_word: מִדְבַּר צִן
  choice: di padang gurun Zin
  rationale: “Padang gurun Zin” adalah padanan geografis yang alami dan sesuai dengan ragam bahasa Alkitab Indonesia.
- source_word: לֹא קִדַּשְׁתֶּם אֹתִי
  choice: kalian tidak memperlakukan Aku sebagai kudus
  rationale: Bentuk piel קדשׁ di sini menyatakan kegagalan untuk mengakui, menghormati, atau menampilkan Allah sebagai kudus di hadapan umat. Pilihan ini mempertahankan Allah sebagai objek langsung tanpa memberi kesan bahwa kekudusan hakiki-Nya dapat ditambah oleh manusia.
theological_decisions:
- issue: Makna kegagalan Musa dan Harun dalam לֹא קִדַּשְׁתֶּם אֹתִי
  choice: kalian tidak memperlakukan Aku sebagai kudus
  alternative: kalian tidak menguduskan Aku; kalian tidak menyatakan kekudusan-Ku
  rationale: Terjemahan utama mempertahankan ketegangan ungkapan Ibrani sekaligus menjelaskan bahwa yang gagal ialah pengakuan dan perlakuan publik terhadap kekudusan Allah, bukan kekudusan hakiki Allah sendiri.
- issue: Identitas kolektif בְּנֵי יִשְׂרָאֵל
  choice: bani Israel
  alternative: orang Israel; anak-anak Israel
  rationale: “Bani Israel” adalah etnonim Indonesia yang lazim, mencakup umat sebagai kelompok, dan tetap mencerminkan bentuk sumber tanpa membatasi rujukannya hanya kepada laki-laki.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. “Kalian” memperjelas bahwa bentuk Ibrani menjamak dan ditujukan kepada Musa serta Harun. Pengulangan “di tengah-tengah bani Israel” dan dua klausa “karena” dipertahankan untuk mencerminkan penekanan serta struktur sumber.
