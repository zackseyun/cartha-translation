  text: יַקְנִאֻ֖/הוּ בְּ/זָרִ֑ים בְּ/תוֹעֵבֹ֖ת יַכְעִיסֻֽ/הוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/016.yaml
  text: They made him jealous with strangers[a]; with abominations they provoked him to anger.
translation:
  language: id
  text: Mereka membuat-Nya cemburu dengan yang asing[a]; dengan hal-hal yang menjijikkan mereka membangkitkan murka-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “allah-allah asing” atau “dewa-dewa asing”; teks Ibrani secara harfiah mengatakan “yang asing.”
    reason: alternative_reading
lexical_decisions:
- source_word: יַקְנִאֻהוּ
  choice: membuat-Nya cemburu
  rationale: Bentuk Hifil dari קנא dengan objek orang ketiga maskulin tunggal menyatakan bahwa mereka menimbulkan kecemburuan pada-Nya. Ungkapan ini alami dalam bahasa Indonesia dan mempertahankan bahasa perjanjian yang antropopatik.
- source_word: בְּזָרִים
  choice: dengan yang asing
  rationale: זָרִים secara harfiah berarti orang-orang atau hal-hal yang asing. Karena kata 'allah' tidak dinyatakan dalam ayat ini, teks utama mempertahankan ketidakjelasan referennya, sedangkan konteks penyembahan berhala dijelaskan sebagai kemungkinan dalam catatan kaki.
- source_word: בְּתוֹעֵבֹת
  choice: dengan hal-hal yang menjijikkan
  rationale: תּוֹעֵבָה menunjuk pada sesuatu yang dipandang keji atau menjijikkan, khususnya dalam konteks penyembahan berhala. Pilihan ini jelas bagi pembaca modern tanpa mengurangi kerasnya kecaman.
- source_word: יַכְעִיסֻהוּ
  choice: mereka membangkitkan murka-Nya
  rationale: Bentuk Hifil dari כעס berarti menyebabkan marah atau membangkitkan murka. Pilihan ini mempertahankan daya kausatif sekaligus membentuk paralelisme yang wajar dengan klausa pertama.
theological_decisions:
- issue: Apakah objek penyembahan berhala yang tersirat dalam זָרִים perlu dinyatakan secara eksplisit
  choice: Mempertahankan ungkapan harfiah 'yang asing' dalam teks utama
  alternative: '''allah-allah asing'' atau ''dewa-dewa asing'''
  rationale: Konteksnya jelas menyangkut penyembahan berhala, tetapi teks Ibrani ayat ini tidak menyebut kata 'allah' atau 'dewa'. Terjemahan utama karena itu menjaga ambiguitas sumber, sementara catatan kaki menyajikan pemaknaan kontekstual.
translation_notes:
  register: Bahasa Indonesia baku yang modern dan bermartabat. Kapitalisasi pronomina ilahi dipakai menurut kelaziman penerbitan Alkitab bahasa Indonesia. 'Hal-hal yang menjijikkan' dipilih daripada 'kekejian-kekejian' agar mudah dipahami pembaca umum, sedangkan struktur dua klausa paralel dipertahankan.
