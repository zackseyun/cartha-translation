  yaml_path: translation/ot/deuteronomy/032/009.yaml
  text: For Yahweh’s portion is his people[a], Jacob the share of his inheritance.
translation:
  language: id
  text: Sebab, umat Yahweh adalah bagian-Nya; Yakub adalah bagian warisan-Nya[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Yakub adalah tali pengukur warisan-Nya” atau “Yakub adalah jatah warisan-Nya.” Kata Ibrani חֶבֶל secara harfiah dapat berarti tali pengukur dan, sebagai perluasan makna, bagian yang diukur atau dialokasikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Kata ini menghubungkan ayat tersebut dengan konteks sebelumnya sebagai alasan atau penjelasan, sehingga “Sebab” mempertahankan daya penghubungnya secara alami.
- source_word: חֵלֶק
  choice: bagian
  rationale: Kata ini menunjuk pada bagian atau jatah yang menjadi milik seseorang. “Bagian” alami dalam bahasa Indonesia dan mempertahankan gambaran pembagian warisan.
- source_word: יְהֹוָה
  choice: Yahweh
  rationale: Nama ilahi dalam teks Ibrani dipertahankan sebagai nama diri, sesuai bentuk Tetragramaton dan lapisan konsultasi yang telah diaudit.
- source_word: עַמּוֹ
  choice: umat-Nya
  rationale: Dalam konteks hubungan perjanjian, עַם menunjuk pada umat yang menjadi milik Yahweh; “umat” lebih tepat daripada “bangsa” untuk menonjolkan hubungan tersebut.
- source_word: יַעֲקֹב
  choice: Yakub
  rationale: Nama yang tertulis secara eksplisit dipertahankan untuk menjaga paralelisme puitis dan rujukan kolektif melalui nama leluhur.
- source_word: חֶבֶל
  choice: jatah
  rationale: Dalam konteks pembagian milik pusaka, חֶבֶל berkembang dari arti harfiah “tali pengukur” menjadi bagian yang diukur atau dijatahkan. “Jatah” menyampaikan hasil pembagian itu secara alami.
- source_word: נַחֲלָתוֹ
  choice: milik pusaka-Nya
  rationale: נַחֲלָה menunjuk pada warisan atau milik turun-temurun. “Milik pusaka” mempertahankan sekaligus gagasan kepemilikan dan warisan.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian ilahi secara langsung; bentuk “Yahweh” mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Apakah יַעֲקֹב perlu dijelaskan langsung sebagai Israel
  choice: Yakub
  alternative: Israel
  rationale: “Yakub” adalah bunyi eksplisit teks dan berfungsi secara puitis sebagai nama kolektif umat; menggantinya dengan “Israel” akan mempersempit ungkapan sumber menjadi penafsiran.
- issue: Hubungan antara Yahweh, umat, dan milik pusaka
  choice: Mempertahankan metafora bahwa umat adalah bagian Yahweh dan Yakub jatah milik pusaka-Nya
  alternative: Menjelaskan secara prosa bahwa Israel dipilih sebagai umat kepunyaan Yahweh
  rationale: Ungkapan sumber memakai bahasa pembagian dan warisan. Metafora tersebut dipertahankan tanpa menambahkan penjelasan doktrinal yang tidak dinyatakan langsung.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bernada puitis. Susunan dua klausa paralel dipertahankan. Pronomina yang merujuk kepada Yahweh ditulis dengan huruf kapital menurut kebiasaan ejaan religius Indonesia.
