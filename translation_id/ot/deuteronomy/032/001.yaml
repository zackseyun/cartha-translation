  text: הַאֲזִ֥ינוּ הַ/שָּׁמַ֖יִם וַ/אֲדַבֵּ֑רָה וְ/תִשְׁמַ֥ע הָ/אָ֖רֶץ אִמְרֵי פִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/001.yaml
  text: Give ear[a], O heavens, and I will speak; and let the earth hear the words of my mouth.
translation:
  language: id
  text: Pasanglah telinga[a], hai langit, dan aku akan berbicara; biarlah bumi mendengar perkataan mulutku.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dengarkanlah dengan saksama, hai langit ... dan semoga bumi mendengar.” Bahasa Ibrani memakai bentuk perintah dan permohonan puitis yang luhur.
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאֲזִינוּ
  choice: Pasanglah telinga
  rationale: Bentuk imperatif Hifil dari אזן menyerukan perhatian sungguh-sungguh, bukan sekadar mendengar bunyi. Ungkapan ini mempertahankan keluhuran puitis sekaligus tetap wajar dalam bahasa Indonesia modern.
- source_word: הַשָּׁמַיִם
  choice: hai langit
  rationale: Dalam sapaan puitis, שָׁמַיִם merujuk pada langit sebagai pihak yang disapa. Kata seru 'hai' menandai vokatif secara alami tanpa menambahkan gagasan baru.
- source_word: וַאֲדַבֵּרָה
  choice: dan aku akan berbicara
  rationale: Bentuk kohortatif menyatakan kehendak atau tekad pembicara. Terjemahan ini mempertahankan gerak maju dan kesejajaran puisi.
- source_word: וְתִשְׁמַע
  choice: biarlah bumi mendengar
  rationale: Bentuk imperfek atau yusif ini berfungsi sebagai seruan volitif yang sejajar dengan imperatif kepada langit. 'Biarlah' mempertahankan nuansa permohonan atau perintah puitis.
- source_word: הָאָרֶץ
  choice: bumi
  rationale: Pasangan kosmis langit–bumi menuntut arti 'bumi', bukan 'negeri' atau 'tanah'.
- source_word: אִמְרֵי
  choice: perkataan
  rationale: Kata ini menunjuk pada tuturan yang diucapkan. 'Perkataan' alami, berbobot, dan cocok dengan bentuk jamak konstruksi Ibrani.
- source_word: פִי
  choice: mulutku
  rationale: Ungkapan konkret 'perkataan mulutku' dipertahankan agar citra dan irama puitis bahasa Ibrani tidak hilang.
theological_decisions:
- issue: Cakupan sapaan kepada langit dan bumi
  choice: Seruan puitis kepada kosmos sebagai saksi
  alternative: Sekadar seruan retoris kepada semua pendengar
  rationale: Pola sapaan kepada langit dan bumi memiliki kekhidmatan formal dalam konteks perjanjian dan nubuat. Terjemahan mempertahankan personifikasi dan kesan kesaksian itu tanpa menjelaskannya secara berlebihan dalam teks utama.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan puitis. 'Pasanglah telinga' mempertahankan daya seru imperatif Ibrani; 'hai langit' dan 'biarlah bumi' menjaga personifikasi serta kesejajaran puisi. Penanda catatan kaki [a] dicantumkan langsung setelah frasa terkait.
