base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/004.yaml
  text: The Rock—his work is perfect[a], for all his ways are justice. He is a God of faithfulness and without injustice[c][b], righteous and upright is he.
translation:
  language: id
  text: Sang Batu Karang—pekerjaan-Nya sempurna, sebab segala jalan-Nya adil.[a] Dialah Allah yang setia, dan tidak ada ketidakadilan pada-Nya;[b] adil dan luruslah Dia.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “segala jalan-Nya adalah keadilan” atau “segala jalan-Nya merupakan keputusan yang adil.” Kata Ibrani מִשְׁפָּט dapat berarti keadilan, penghakiman, keputusan hukum, atau apa yang benar menurut hukum.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “tidak ada kecurangan pada-Nya” atau “tanpa kejahatan.” Kata Ibrani עָוֶל mencakup ketidakadilan, kesalahan moral, atau kejahatan.'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצּוּר
  choice: Sang Gunung Batu
  rationale: Kata צוּר secara harfiah menunjuk pada batu besar atau bukit batu dan di sini berfungsi sebagai gelar metaforis bagi Allah. Bentuk “Sang Gunung Batu” mempertahankan metafora sekaligus menandai fungsi gelarnya dalam bahasa Indonesia.
- source_word: תָּמִים
  choice: sempurna
  rationale: Dalam konteks ini kata tersebut menyatakan keutuhan dan tanpa cacatnya pekerjaan Allah; “sempurna” alami dan sesuai dengan ragam puisi yang luhur.
- source_word: פָּעֳלוֹ
  choice: pekerjaan-Nya
  rationale: Nomina tunggal dengan sufiks orang ketiga maskulin tunggal merangkum karya atau tindakan Allah secara kolektif.
- source_word: כִּי
  choice: sebab
  rationale: Kata ini memperkenalkan alasan bagi pernyataan sebelumnya; “sebab” jelas dan tetap puitis.
- source_word: כָל־דְּרָכָיו
  choice: segala jalan-Nya
  rationale: Ungkapan Ibrani ini menggambarkan seluruh cara Allah bertindak. “Jalan” mempertahankan metafora sumber.
- source_word: מִשְׁפָּט
  choice: adil
  rationale: Sebagai predikat bagi “segala jalan-Nya”, bentuk adjektival “adil” paling wajar dalam bahasa Indonesia sambil mempertahankan cakupan etis-yudisial מִשְׁפָּט.
- source_word: אֵל אֱמוּנָה
  choice: Allah yang setia
  rationale: אֱמוּנָה di sini menyatakan keandalan dan kesetiaan Allah. Konstruksi “Allah yang setia” alami dalam bahasa Indonesia dan tidak membatasi makna pada kebenaran proposisional.
- source_word: וְאֵין עָוֶל
  choice: tanpa ketidakadilan
  rationale: Frasa ini menyangkal adanya kesalahan moral atau ketidakadilan pada Allah. Pilihan ini ringkas serta sejajar dengan pernyataan sifat sebelumnya.
- source_word: צַדִּיק
  choice: benar
  rationale: Dalam predikasi tentang Allah, “benar” menyampaikan kelurusan moral dan keadilan-Nya secara alami dalam bahasa Indonesia; unsur keadilan juga telah dinyatakan pada klausa sebelumnya.
- source_word: וְיָשָׁר
  choice: lurus
  rationale: Kata ini mempertahankan metafora kelurusan moral dalam יָשָׁר dan berpasangan secara puitis dengan “benar”.
- source_word: הוּא
  choice: Dia
  rationale: Pronomina yang ditempatkan di akhir dalam sumber membawa penekanan; susunan “benar dan luruslah Dia” berusaha mempertahankan tekanan puitis tersebut.
theological_decisions:
- issue: Gelar/metafora ilahi הַצּוּר
  choice: Sang Gunung Batu
  alternative: Gunung Batu itu; Batu Karang
  rationale: Konteks Nyanyian Musa memakai istilah ini sebagai gelar metaforis bagi Allah. “Sang” menandai daya gelarnya tanpa menghapus gambaran konkret batu besar yang kokoh.
- issue: אֱמוּנָה sebagai sifat Allah
  choice: Allah yang setia
  alternative: Allah kesetiaan; Allah yang benar; Allah yang dapat dipercaya
  rationale: Konteks menekankan keandalan dan keteguhan moral Allah. “Setia” mempertahankan bobot teologis tersebut tanpa mempersempitnya menjadi kebenaran faktual saja.
- issue: Hubungan מִשְׁפָּט dengan כָל־דְּרָכָיו
  choice: segala jalan-Nya adil
  alternative: segala jalan-Nya adalah keadilan; segala jalan-Nya merupakan keputusan yang adil
  rationale: Nomina Ibrani memungkinkan nuansa keadilan, penghakiman, atau apa yang benar menurut hukum. Terjemahan utama memakai predikat alami dalam bahasa Indonesia, sedangkan catatan mempertahankan keluasan leksikalnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan irama puisi yang luhur. Metafora “jalan” dan gelar “Sang Gunung Batu” dipertahankan, sementara susunan klausa dibuat alami bagi pembaca umum. Kapitalisasi pronomina ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia dan membantu kejelasan rujukan tanpa menambah isi sumber.
