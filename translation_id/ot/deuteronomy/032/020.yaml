base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/020.yaml
  text: And he said[a], “I will hide my face from them; I will see what their end will be, for they are a perverse generation[b], children in whom there is no faithfulness.”
translation:
  language: id
  text: Lalu Ia berkata, “Aku akan menyembunyikan wajah-Ku dari mereka; Aku akan melihat bagaimana kesudahan mereka nanti, sebab mereka adalah generasi yang penuh penyimpangan[a], anak-anak yang tidak memiliki kesetiaan[b].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “generasi penyimpangan-penyimpangan”; dapat juga diterjemahkan “generasi yang menyimpang” atau “generasi yang bengkok.”
    reason: lexical_alternative
  - marker: b
    text: Atau “yang sama sekali tidak dapat dipercaya” atau “yang tidak memiliki keterandalan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַסְתִּירָה פָנַי מֵהֶם
  choice: Aku akan menyembunyikan wajah-Ku dari mereka
  rationale: Mempertahankan ungkapan Ibrani tentang ‘menyembunyikan wajah’, yang menyatakan penarikan perkenanan atau kehadiran, tanpa mereduksinya menjadi sekadar mengabaikan atau berpaling.
- source_word: אֶרְאֶה מָה אַחֲרִיתָם
  choice: Aku akan melihat bagaimana kesudahan mereka
  rationale: אַחֲרִית dapat berarti akhir, kesudahan, atau hasil akhir. ‘Kesudahan’ mempertahankan nada khidmat, sedangkan ‘bagaimana’ membuat susunannya wajar dalam bahasa Indonesia.
- source_word: דּוֹר תַּהְפֻּכֹת
  choice: generasi yang penuh penyimpangan
  rationale: Ungkapan ini secara harfiah berbentuk ‘generasi penyimpangan-penyimpangan’. Pilihan ini mempertahankan daya jamak dan dakwaan moralnya, tetapi tetap alami dalam bahasa Indonesia.
- source_word: בָּנִים
  choice: anak-anak
  rationale: Kata ini dapat berarti ‘anak-anak’ atau ‘anak-anak lelaki’; dalam konteks ini rujukannya adalah umat sebagai keturunan, sehingga bentuk generik ‘anak-anak’ paling tepat.
- source_word: לֹא אֵמֻן בָּם
  choice: yang tidak memiliki kesetiaan
  rationale: אֵמֻן menunjuk pada kesetiaan, keterandalan, atau sifat dapat dipercaya. ‘Kesetiaan’ paling baik menyampaikan dakwaan moral-relasional dalam konteks perjanjian.
theological_decisions:
- issue: Ungkapan antropomorfis mengenai wajah Allah
  choice: Mempertahankan ‘Aku akan menyembunyikan wajah-Ku dari mereka’
  alternative: Aku akan berpaling dari mereka; Aku akan mengabaikan mereka
  rationale: Ungkapan sumber memiliki bobot relasional dan perjanjian. Mempertahankan gambaran ‘wajah’ menjaga ketegangan teologis tanpa menjelaskan mekanisme tindakan ilahi secara berlebihan.
- issue: Makna אֵמֻן
  choice: kesetiaan
  alternative: keterandalan; sifat dapat dipercaya
  rationale: Dalam konteks ini istilah tersebut bukan terutama tentang kepercayaan intelektual, melainkan tentang keteguhan dan keterandalan umat dalam hubungan mereka dengan Allah.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. ‘Ia berkata’ mengikuti verba sumber yang umum tanpa mempersempitnya menjadi istilah ujaran ilahi tertentu; kapitalisasi pronomina mempertahankan rujukan kepada Allah sesuai konteks. Tanda titik koma menjaga kesejajaran dan gerak puitis ayat.
