translation:
  language: id
  text: yang memakan lemak dari kurban mereka dan meminum anggur dari persembahan curahan mereka—biarlah mereka bangkit dan menolong kalian; biarlah mereka menjadi tempat perlindungan bagi kalian.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֵלֶב זְבָחֵימוֹ
  choice: lemak kurban-kurban mereka
  rationale: Menerjemahkan secara langsung lemak dari kurban sembelihan yang dipersembahkan kepada ilah-ilah tersebut; pengulangan jamak dipertahankan secara wajar dalam bahasa Indonesia.
- source_word: יֵין נְסִיכָם
  choice: anggur persembahan curahan mereka
  rationale: נֶסֶךְ menunjuk pada persembahan cair yang dicurahkan; frasa ini membedakannya dari anggur biasa.
- source_word: יַעְזְרֻכֶם
  choice: menolong kalian
  rationale: Bentuk pronomina orang kedua jamak dipertahankan dengan 'kalian' agar berbeda dari bentuk tunggal.
- source_word: סִתְרָה
  choice: tempat perlindungan
  rationale: Kata ini menyatakan tempat tersembunyi atau naungan pelindung; 'tempat perlindungan' alami dalam bahasa Indonesia dan tidak mempersempit citranya secara berlebihan.
theological_decisions:
- issue: Rujukan pronomina orang ketiga jamak
  choice: Mempertahankan 'mereka' tanpa menyebut secara eksplisit 'ilah-ilah'.
  alternative: Menuliskan 'ilah-ilah yang memakan ...'.
  rationale: Ayat ini melanjutkan rujukan dari konteks sebelumnya. Menjaga pronomina mempertahankan kohesi dan tidak menambahkan nomina yang tidak terdapat dalam ayat ini.
- issue: Nada pertanyaan retoris pada klausa pembuka
  choice: Mengakhiri klausa pembuka dengan tanda tanya, lalu meneruskan tantangan dengan bentuk 'Biarlah'.
  alternative: Menyajikan seluruh ayat sebagai satu kalimat pernyataan tanpa tanda tanya.
  rationale: Konteks Ibrani menyampaikan ejekan atau tantangan retoris terhadap ilah-ilah palsu. Tanda tanya membuat hubungan sintaksisnya jelas dalam bahasa Indonesia tanpa mengubah isi.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Kurban' dipakai dalam arti persembahan sembelihan; 'persembahan curahan' mempertahankan istilah kultis. Pronomina 'kalian' menandai bentuk jamak Ibrani.
