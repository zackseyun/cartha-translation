  yaml_path: translation/ot/deuteronomy/032/025.yaml
  text: Outside[a], the sword will bereave; and in the inner rooms, terror—both young man and virgin[b], nursing child together with gray-haired man.
translation:
  language: id
  text: Di luar, pedang akan membuat orang kehilangan anak; di dalam kamar-kamar, kengerian akan melanda—pemuda dan perawan[b], anak yang masih menyusu, serta laki-laki yang beruban.
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Kata Ibrani betulah menunjuk kepada seorang perempuan muda yang belum menikah, sering dengan nuansa keperawanan; “perempuan muda” juga mungkin.
    reason: lexical_alternative
lexical_decisions:
- source_word: מִחוּץ
  choice: Di luar
  rationale: Menjaga kontras ruang dengan מֵחֲדָרִים tanpa mempersempit makna menjadi 'di jalan'.
- source_word: תְּשַׁכֶּל
  choice: akan membuat orang kehilangan anak
  rationale: Bentuk Piel dari שׁכל berarti menyebabkan kehilangan anak atau menjadikan tanpa anak; ungkapan ini mempertahankan daya personifikasi pedang dan lebih jelas daripada 'merenggut anak'.
- source_word: חֶרֶב
  choice: pedang
  rationale: Menghadirkan pedang sebagai pelaku puitis yang melambangkan maut dalam peperangan.
- source_word: וּמֵחֲדָרִים
  choice: di dalam kamar-kamar
  rationale: Secara bentuk berarti 'dan dari kamar-kamar', tetapi dalam paralelisme berfungsi menunjukkan tempat di bagian dalam, sebagai lawan dari 'di luar'; alternatif harfiahnya dicatat dalam catatan kaki.
- source_word: אֵימָה
  choice: kengerian
  rationale: Menyampaikan rasa takut yang dahsyat dan mempertahankan gaya puitis yang ringkas.
- source_word: גַּם בָּחוּר גַּם בְּתוּלָה
  choice: baik pemuda maupun perawan
  rationale: Mempertahankan pasangan golongan muda laki-laki dan perempuan serta kekhususan leksikal בְּתוּלָה, tanpa menghilangkan kemungkinan nuansa perempuan muda yang belum menikah.
- source_word: יוֹנֵק
  choice: anak yang masih menyusu
  rationale: Menerjemahkan bentuk partisip secara konkret dan alami dalam bahasa Indonesia modern.
- source_word: עִם אִישׁ שֵׂיבָה
  choice: bersama orang yang beruban
  rationale: Mempertahankan gambaran konkret rambut beruban sebagai penanda usia lanjut; 'orang' menghindari pengulangan kaku dan sesuai dengan cakupan manusia dalam daftar.
