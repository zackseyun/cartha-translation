    rationale: Dalam teks Ibrani, אֵימָה berdiri secara puitis sebagai padanan ancaman pedang dan diikuti daftar golongan yang terkena. Bahasa Indonesia memerlukan verba yang tersirat itu dinyatakan agar kalimat tidak menggantung.
  - severity: low
    issue: “Orang yang beruban” menghilangkan penanda laki-laki pada אִישׁ.
    rationale: אִישׁ berarti laki-laki/pria; “laki-laki yang beruban” mempertahankan kekhususan sumber.
  revised_text: Di luar, pedang akan membuat orang kehilangan anak; di dalam kamar-kamar, kengerian akan melanda—pemuda dan perawan[b], anak yang masih menyusu, serta laki-laki yang beruban.
