  to: Di luar, pedang akan membuat orang kehilangan anak; di dalam kamar-kamar, kengerian akan melanda—pemuda dan perawan[b], anak yang masih menyusu, serta laki-laki yang beruban.
  rationale: Revisi menjelaskan bahwa kengerian di dalam melanda semua kelompok yang disebutkan, sambil mempertahankan kepadatan dan kontras puitis teks Ibrani. Istilah bagi laki-laki lanjut usia dipulihkan dari ungkapan netral menjadi bentuk maskulin yang sesuai dengan אִישׁ. Catatan kaki a dipertahankan sebagai alternatif harfiah, tetapi penandanya dihapus karena tidak terpasang pada unsur mana pun dalam teks; catatan b tetap ditempatkan sesudah “perawan.”
