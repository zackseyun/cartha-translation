  to: Sebab Yahweh akan membela umat-Nya[a] dan akan berbelas kasihan kepada hamba-hamba-Nya[b] ketika Ia melihat bahwa kekuatan mereka telah habis[c], dan tidak ada seorang pun lagi—baik yang tertahan maupun yang ditinggalkan[d].
  rationale: Revisi terbatas pada pasangan Ibrani yang sukar di akhir ayat dan pada ketepatan catatan. “Yang tertahan maupun yang ditinggalkan” tidak memaksakan penafsiran sosial “budak maupun orang merdeka” ke dalam teks utama, tetapi lebih setia kepada bentuk leksikal yang diperselisihkan. Catatan tetap menyediakan pembacaan idiomatis yang lazim. Penambahan “akan” sebelum “berbelas kasihan” memperjelas paralelisme verba tanpa mengubah makna.
