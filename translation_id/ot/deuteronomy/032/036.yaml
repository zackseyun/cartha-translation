  text: כִּֽי יָדִ֤ין יְהוָה֙ עַמּ֔/וֹ וְ/עַל עֲבָדָ֖י/ו יִתְנֶחָ֑ם כִּ֤י יִרְאֶה֙ כִּי אָ֣זְלַת יָ֔ד וְ/אֶ֖פֶס עָצ֥וּר וְ/עָזֽוּב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/036.yaml
  text: For Yahweh will vindicate his people and will have compassion on his servants[a], when he sees that their strength is gone, and there is none left[d][c][b], bond or free.
translation:
  language: id
  text: Sebab Yahweh akan membela umat-Nya[a] dan akan berbelas kasihan kepada hamba-hamba-Nya[b] ketika Ia melihat bahwa kekuatan mereka telah habis[c], dan tidak ada seorang pun lagi—baik yang tertahan maupun yang ditinggalkan[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “akan menghakimi umat-Nya.” Dalam konteks ini, tindakan penghakiman itu tampaknya dilakukan demi membela umat-Nya.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “akan menyesal” atau “akan berbalik sikap mengenai hamba-hamba-Nya.” Kata Ibrani ini dapat mengungkapkan perubahan sikap atau rasa belas kasihan.'
    reason: lexical_alternative
  - marker: c
    text: 'Secara harfiah: “tangan telah lenyap”; sebuah ungkapan untuk kekuatan atau kuasa yang sudah habis.'
    reason: lexical_alternative
  - marker: d
    text: Arti ungkapan Ibrani ini tidak pasti. Secara harfiah kira-kira “yang tertahan dan yang ditinggalkan”; mungkin berarti “budak maupun orang merdeka” atau, sebagai pasangan yang mencakup semuanya, “tidak seorang pun sama sekali.”
    reason: alternative_reading
lexical_decisions:
- source_word: יָדִין
  choice: akan membela
  rationale: Dalam konteks ini, verba דין menunjuk pada tindakan pengadilan yang berpihak kepada umat Yahweh, yakni membela atau memberi mereka keadilan; kemungkinan arti lebih harfiah 'menghakimi' dicatat agar keluasan maknanya tetap terlihat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: עַמּוֹ
  choice: umat-Nya
  rationale: Menjaga pengertian kolektif dan hubungan perjanjian dengan ungkapan Indonesia yang wajar.
- source_word: וְעַל עֲבָדָיו יִתְנֶחָם
  choice: dan berbelas kasihan kepada hamba-hamba-Nya
  rationale: נחם dalam bentuk ini dapat menyatakan rasa iba atau perubahan sikap berupa mengurungkan tindakan; konteks kelemahan umat mendukung 'berbelas kasihan', sementara alternatifnya dicatat.
- source_word: כִּי יִרְאֶה
  choice: ketika Ia melihat
  rationale: כִּי mengandung nuansa temporal-kausal di sini; 'ketika' alami dalam bahasa Indonesia tanpa meniadakan hubungan sebab.
- source_word: אָזְלַת יָד
  choice: kekuatan mereka telah habis
  rationale: Secara harfiah 'tangan telah lenyap/habis', tetapi 'tangan' merupakan idiom bagi daya atau kekuatan.
- source_word: וְאֶפֶס
  choice: dan tidak seorang pun tersisa
  rationale: Menyatakan ketiadaan atau berakhirnya keberadaan mereka yang disebut dalam pasangan berikutnya.
- source_word: עָצוּר וְעָזוּב
  choice: baik yang terkurung maupun yang terlepas
  rationale: Pasangan Ibrani ini sulit dan mungkin bersifat merismus. Terjemahan relatif formal dipilih untuk tidak memastikan idiom yang tidak pasti sebagai 'budak atau orang merdeka'; kemungkinan makna itu dijelaskan dalam catatan.
theological_decisions:
- issue: Arah tindakan Yahweh dalam יָדִין terhadap umat-Nya
  choice: Yahweh bertindak membela umat-Nya
  alternative: Yahweh akan menghakimi umat-Nya
  rationale: Paralel dengan belas kasihan dan alasan berupa habisnya kekuatan umat mendukung tindakan yang berpihak kepada mereka. Namun, karena דין memang dapat berarti 'menghakimi', alternatif itu dipertahankan dalam catatan.
- issue: Makna יִתְנֶחָם terhadap hamba-hamba-Nya
  choice: berbelas kasihan kepada mereka
  alternative: mengurungkan niat mengenai mereka
  rationale: Konteks menggambarkan Yahweh tergerak oleh keadaan umat yang tak berdaya. Terjemahan utama menyampaikan sisi belas kasihan tanpa meniadakan nuansa 'berubah sikap/mengurungkan' pada verba Ibrani.
- issue: Identitas pasangan עָצוּר וְעָזוּב
  choice: yang terkurung maupun yang terlepas
  alternative: budak maupun orang merdeka; tidak seorang pun sama sekali
  rationale: Ungkapan ini tidak pasti. Terjemahan utama menjaga bentuk pasangan Ibrani, sedangkan catatan menyajikan penafsiran idiomatis yang umum tanpa menjadikannya kepastian teologis atau sosial.
translation_notes:
  register: Bahasa Indonesia modern, wajar, dan khidmat. Struktur puitis dipertahankan secara ringkas. Huruf kapital pada pronomina ilahi mengikuti kebiasaan penerbitan Alkitab Indonesia. Tanda pisah menandai pasangan penutup sebagai penjelasan atas 'tidak seorang pun tersisa'.
