  source_fidelity: Terjemahan utama tepat menangkap tindakan Yahweh yang berpihak kepada umat-Nya, belas kasihan kepada hamba-hamba-Nya, dan idiom tentang kekuatan yang habis. Namun, “yang terlepas” bukan padanan literal yang baik bagi עָזוּב (“ditinggalkan/dilepas”), sedangkan pasangan עָצוּר וְעָזוּב memang sukar dan makna idiomatisnya tidak pasti.
  naturalness: Kalimatnya umumnya alami dan berregister khidmat. “Yang terkurung maupun yang terlepas” terdengar kurang lazim sebagai kategori manusia dalam bahasa Indonesia; “yang tertahan maupun yang ditinggalkan” lebih dekat pada bentuk Ibrani, sementara catatan menjelaskan pembacaan idiomatisnya.
  terminology: “Yahweh,” “umat-Nya,” “membela,” “hamba-hamba-Nya,” dan “berbelas kasihan” sesuai konteks serta penggunaan modern baku. Catatan untuk נחם sebaiknya tidak membatasi alternatif pada “mengurungkan niat,” melainkan menyatakan kemungkinan “menyesal/berbalik sikap,” yang lebih dekat dengan keluasan verba Ibrani.
