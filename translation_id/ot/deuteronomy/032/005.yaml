base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/005.yaml
  text: They have acted corruptly toward him[a]; they are not his children, because of their defect[b]. They are a crooked and twisted generation.
translation:
  language: id
  text: Mereka telah bertindak curang terhadap Dia[a]; mereka bukan anak-anak-Nya karena[b] cela mereka. Mereka adalah angkatan yang bengkok dan menyimpang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bahasa Ibraninya sulit dan sangat padat. Klausa pertama juga dapat dipahami, “Mereka telah merusak diri,” sedangkan frasa berikutnya dapat diterjemahkan, “cela mereka” atau “kesalahan mereka.”
    reason: alternative_reading
  - marker: b
    text: Hubungan “karena” tidak dinyatakan secara eksplisit dalam teks Ibrani; susunan frasa ini sangat padat.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: שִׁחֵת
  choice: telah bertindak bejat
  rationale: Bentuk Piel menyatakan tindakan yang merusak atau bejat. Ungkapan ini mempertahankan daya verbalnya tanpa memaksakan makna refleksif yang tidak dinyatakan secara eksplisit.
- source_word: לוֹ
  choice: terhadap Dia
  rationale: Preposisi ל dengan sufiks pronominal dalam klausa padat ini sulit ditentukan secara lebih sempit. 'Terhadap Dia' mempertahankan relasi kepada Allah tanpa memastikan apakah nuansanya semata-mata 'kepada-Nya' atau 'melawan-Nya'.
- source_word: לֹא בָּנָיו
  choice: mereka bukan anak-anak-Nya
  rationale: Frasa tanpa verba ini menyangkal status atau sifat sebagai anak secara tegas. Verba 'adalah' tersirat secara wajar dalam bahasa Indonesia, sedangkan unsur temporal seperti 'bukan lagi' tidak ditambahkan.
- source_word: מוּמָם
  choice: karena cela mereka
  rationale: מוּם berarti cacat atau cela. 'Cela' cocok dengan metafora moral dalam konteks ini; 'karena' melancarkan hubungan sintaksis yang sangat padat tetapi tetap diakui sebagai salah satu penafsiran.
- source_word: דּוֹר
  choice: angkatan
  rationale: '''Angkatan'' merupakan padanan alami dan lazim dalam konteks puitis untuk kelompok sezaman yang dicirikan secara moral.'
- source_word: עִקֵּשׁ
  choice: bengkok
  rationale: Kata ini menggambarkan sesuatu yang menyimpang atau bengkok. Padanan tersebut mempertahankan citra konkret sumber.
- source_word: וּפְתַלְתֹּל
  choice: berbelat-belit
  rationale: Adjektiva langka ini menguatkan gambaran penyimpangan dan ketidaklurusan. 'Berbelat-belit' mempertahankan citra sesuatu yang berliku-liku serta membedakannya dari 'bengkok'.
theological_decisions:
- issue: Apakah לֹא בָּנָיו menyatakan hilangnya status anak dalam perjanjian atau menyangkal sifat sebagai anak
  choice: mereka bukan anak-anak-Nya
  alternative: mereka bukan lagi anak-anak-Nya; mereka bukan anak bagi-Nya
  rationale: Teks Ibrani memberikan penyangkalan tegas tanpa penanda waktu. Terjemahan mempertahankan ketegangan itu dan tidak menambahkan kesimpulan teologis tentang hilangnya status perjanjian.
- issue: Cara memahami sintaksis kolon pertama yang sangat padat
  choice: Mereka telah bertindak bejat terhadap Dia; mereka bukan anak-anak-Nya karena cela mereka.
  alternative: Mereka telah merusak diri; mereka bukan anak-anak-Nya; cela itu milik mereka.
  rationale: Susunan teks Masoretik sangat padat dan terkenal sulit. Bacaan utama menghasilkan bahasa Indonesia yang koheren tanpa emendasi, sedangkan ketidakpastian yang nyata dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dan mudah dipahami. Diksi puitis 'angkatan yang bengkok dan berbelat-belit' mempertahankan dua citra moral yang berdekatan tetapi tidak identik. Semua penanda catatan kaki dicantumkan dalam teks utama.
