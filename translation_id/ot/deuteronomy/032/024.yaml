revisions:
- from: Digerogoti kelaparan, dilahap wabah dan kehancuran yang pahit; Aku akan mendatangkan kepada mereka taring binatang buas, bersama bisa makhluk yang merayap di debu.[a]
  to: Kurus kering karena kelaparan, dilahap wabah dan kemusnahan yang getir; Aku akan melepaskan ke atas mereka taring binatang, bersama bisa makhluk yang merayap di debu.[a]
  rationale: Revisi memperjelas keadaan jasmani akibat kelaparan, menghilangkan pembatasan yang tidak dinyatakan pada “binatang,” dan memperbaiki kelancaran ungkapan puitis tanpa mengubah rangkaian malapetaka, pelaku ilahi, atau keluasan rujukan makhluk yang merayap. Catatan kaki mempertahankan alternatif leksikal dan latar historis secara hati-hati.
