base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/024.yaml
  text: wasted by famine[a], consumed by plague and bitter destruction; I will send against them the fangs of beasts[c][b], with the venom of things that crawl in the dust.
translation:
  language: id
  text: Kurus kering karena kelaparan, dilahap wabah dan kemusnahan yang getir; Aku akan melepaskan ke atas mereka taring binatang, bersama bisa makhluk yang merayap di debu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata yang diterjemahkan “wabah” juga dapat berarti “demam yang membakar”; kata itu mungkin menggemakan Resyef, nama dewa yang dikaitkan dengan wabah di Timur Dekat kuno. “Taring” secara harfiah berarti “gigi”. Ungkapan “makhluk yang merayap di debu” bersifat luas dan dapat mencakup ular serta makhluk melata lainnya.
    reason: lexical_alternative
lexical_decisions:
- source_word: מְזֵי רָעָב
  choice: digerogoti kelaparan
  rationale: מְזֵי menggambarkan keadaan kurus, lemah, atau terkuras. Ungkapan ini menyampaikan kemerosotan jasmani akibat רָעָב tanpa membatasi maknanya hanya pada penampilan kurus.
- source_word: לְחֻמֵי רֶשֶׁף
  choice: dilahap wabah
  rationale: Bentuk langka לְחֻמֵי mengandung gambaran dimakan atau dihabiskan; 'dilahap' mempertahankan metafora puitis. רֶשֶׁף di sini paling wajar dipahami sebagai wabah atau penyakit membakar, bukan nama diri.
- source_word: קֶטֶב מְרִירִי
  choice: kehancuran yang pahit
  rationale: קֶטֶב menunjuk pada daya penghancur atau bencana mematikan, sedangkan מְרִירִי secara harfiah berarti 'pahit'. Terjemahan ini membedakannya dari רֶשֶׁף dan mempertahankan citra Ibrani.
- source_word: שֶׁן בְּהֵמוֹת
  choice: taring binatang buas
  rationale: שֶׁן secara harfiah berarti gigi, tetapi dalam ancaman serangan hewan, 'taring' menyampaikan gambaran konkret secara alami. בְּהֵמוֹת luas artinya, namun konteks menunjukkan hewan yang berbahaya.
- source_word: אֲשַׁלַּח בָּם
  choice: Aku akan mendatangkan kepada mereka
  rationale: Ungkapan ini menyatakan bahwa Allah mengirimkan atau melepas malapetaka atas mereka. 'Mendatangkan kepada mereka' alami dalam bahasa Indonesia dan mempertahankan pelaku ilahi.
- source_word: חֲמַת זֹחֲלֵי עָפָר
  choice: bisa makhluk yang merayap di debu
  rationale: Dalam hubungan dengan makhluk melata, חֲמַת berarti racun atau bisa. זֹחֲלֵי עָפָר adalah ungkapan luas bagi makhluk yang bergerak merayap di tanah dan tidak harus dibatasi pada ular.
theological_decisions:
- issue: Kemungkinan latar mitologis רֶשֶׁף
  choice: Diterjemahkan sebagai nomina umum 'wabah'.
  alternative: Resyef sebagai nama diri, atau 'demam yang membakar'.
  rationale: Dalam konteks daftar hukuman perjanjian, kata ini berfungsi alami sebagai sebutan malapetaka. Kemungkinan gema nama dewa wabah kuno tidak cukup kuat untuk dimasukkan ke teks utama, tetapi dicatat dalam catatan kaki.
- issue: Cakupan זֹחֲלֵי עָפָר
  choice: makhluk yang merayap di debu
  alternative: ular tanah
  rationale: Bahasa Ibrani bersifat lebih luas daripada ular saja. Terjemahan luas mempertahankan ketidakpastian referennya tanpa menghilangkan ancaman makhluk berbisa.
translation_notes:
  register: Bahasa Indonesia baku modern dengan corak puisi yang khidmat. Metafora jasmani dan susunan rangkaian malapetaka dipertahankan, sementara istilah yang terlalu teknis atau bernuansa denominasi dihindari.
