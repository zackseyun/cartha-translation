base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/011.yaml
  text: Like an eagle that stirs up its nest[a], that hovers over its young, he spreads out his wings, takes him[c][b], and carries him on his pinions.
translation:
  language: id
  text: 'Seperti rajawali[a] yang menggugah anak-anaknya di sarang,

    yang melayang-layang di atas anak-anaknya,[b]

    ia membentangkan sayapnya, mengambilnya,

    dan membawanya di atas bulu-bulu kepaknya.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “burung nasar”; kata Ibrani נֶשֶׁר dapat menunjuk pada burung pemakan bangkai besar atau burung pemangsa yang menyerupai rajawali.
    reason: lexical_alternative
  - marker: b
    text: Atau “berkibar-kibar di atas anak-anaknya” atau “mengerami anak-anaknya.”
    reason: lexical_alternative
  - marker: c
    text: “Bulu-bulu kepak” ialah bulu terbang utama pada bagian luar sayap; secara lebih umum dapat diterjemahkan “sayapnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּנֶשֶׁר
  choice: Seperti rajawali
  rationale: נֶשֶׁר menunjuk pada burung pemangsa besar dan secara tradisional dipahami sebagai rajawali, meskipun secara zoologis dapat pula menunjuk pada burung nasar. “Rajawali” mempertahankan citra puitis yang dikenal, sedangkan alternatifnya dicatat dalam catatan kaki.
- source_word: יָעִיר קִנּוֹ
  choice: yang menggugah sarangnya
  rationale: Bentuk kausatif יָעִיר berarti membangunkan atau menggugah. “Menggugah sarangnya” menyampaikan tindakan induk burung yang membangkitkan anak-anak di sarang tanpa mempersempit gambaran puitisnya.
- source_word: עַל גּוֹזָלָיו יְרַחֵף
  choice: yang melayang-layang di atas anak-anaknya
  rationale: רָחַף menggambarkan gerak melayang atau mengepak-ngepak di atas sesuatu. “Melayang-layang” merupakan ungkapan Indonesia yang alami dan mempertahankan nuansa gerak serta perlindungan.
- source_word: יִפְרֹשׂ כְּנָפָיו
  choice: ia membentangkan sayapnya
  rationale: פָּרַשׂ berarti membentangkan atau merentangkan, dan כָּנָף berarti sayap. Kata ganti “ia” dapat merujuk secara alami kepada rajawali sekaligus membiarkan penerapan gambaran itu kepada TUHAN tetap terasa dalam konteks.
- source_word: יִקָּחֵהוּ
  choice: mengambilnya
  rationale: לָקַח lazim berarti mengambil. Akhiran objek tunggal dipertahankan dengan “-nya”, tanpa menambahkan secara eksplisit apakah objek itu seekor anak burung atau Israel sebagai pihak yang digambarkan.
- source_word: יִשָּׂאֵהוּ
  choice: membawanya
  rationale: נָשָׂא dalam konteks ini berarti mengangkat dan menanggung atau membawa. “Membawanya” jelas dan alami dalam bahasa Indonesia modern.
- source_word: עַל אֶבְרָתוֹ
  choice: di atas bulu-bulu kepaknya
  rationale: אֶבְרָה mengacu pada bulu kepak atau bagian sayap, lebih khusus daripada כָּנָף pada baris sebelumnya. “Bulu-bulu kepaknya” mempertahankan perbedaan kosakata dan citra burung yang menopang anaknya.
theological_decisions:
- issue: Peralihan dari perumpamaan burung kepada tindakan yang menggambarkan TUHAN
  choice: Memakai “ia/-nya” tanpa menyebut TUHAN secara eksplisit
  alternative: Memakai “burung itu” di seluruh ayat atau menyebut “TUHAN” pada paruh kedua
  rationale: Bahasa Ibrani memakai bentuk maskulin tunggal dan konteks lebih luas menerapkan gambaran rajawali kepada TUHAN, tetapi ayat ini sendiri tidak menyebut nama-Nya pada paruh kedua. Kata ganti Indonesia mempertahankan hubungan dengan rajawali sekaligus membiarkan peralihan puitis kepada Sang Ilahi tetap tersirat.
- issue: Objek tunggal setelah “anak-anaknya” yang berbentuk jamak
  choice: Mempertahankan objek tunggal secara pronominal dengan “mengambilnya” dan “membawanya”
  alternative: Menjelaskan sebagai “mengambil seekor anaknya” atau mengubahnya menjadi objek jamak
  rationale: Akhiran objek Ibrani berbentuk maskulin tunggal dan dapat mengindividualkan seekor anak atau menunjuk secara puitis kepada Israel. Terjemahan “-nya” mempertahankan ketegangan referensial tersebut tanpa menafsirkannya secara berlebihan.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Susunan empat baris mengikuti gerak paralel syair Ibrani. “Rajawali,” “menggugah,” dan “membentangkan” mudah dipahami namun tetap sesuai untuk nyanyian agung; istilah yang lebih khusus, “bulu-bulu kepak,” dijelaskan dalam catatan kaki.
