  text: You neglected the Rock who fathered you[c][b][a], and forgot the God who gave you birth.
translation:
  language: id
  text: Gunung Batu yang memperanakkan engkau kauabaikan,[a] dan engkau melupakan Allah yang melahirkan engkau.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata kerja yang diterjemahkan “kauabaikan” sulit dipastikan; dapat juga diterjemahkan “kaulupakan” atau “tidak kauindahkan”.
    reason: lexical_alternative
  - marker: b
    text: Atau “yang membawa engkau ke dunia”; bahasa Ibrani memakai gambaran kelahiran.
    reason: lexical_alternative
lexical_decisions:
- source_word: צוּר
  choice: Gunung Batu
  rationale: Metafora batu karang sebagai gelar ilahi dipertahankan. Bentuk “Gunung Batu” merupakan ungkapan Alkitabiah Indonesia yang alami dan menandai acuan kepada Allah.
- source_word: יְלָדְךָ
  choice: yang memperanakkan engkau
  rationale: Qal ילד di sini dapat menyatakan tindakan memperanakkan atau menjadi asal kelahiran. Pilihan ini mempertahankan nuansa paternal tanpa menggantinya dengan bahasa penciptaan yang lebih umum.
- source_word: תֶּשִׁי
  choice: telah kauabaikan
  rationale: Kata kerja ini sulit secara leksikal. Dalam kesejajaran dengan “melupakan”, maknanya kemungkinan adalah tidak mengindahkan atau mengabaikan; pilihan ini juga menghindari pengulangan persis.
- source_word: וַתִּשְׁכַּח
  choice: dan engkau melupakan
  rationale: Menerjemahkan tuduhan orang kedua tunggal secara langsung dan mempertahankan kesejajaran puitis.
- source_word: אֵל
  choice: Allah
  rationale: Dalam konteks ini אֵל menunjuk kepada Allah Israel, sejajar dengan gelar “Gunung Batu” pada baris pertama.
- source_word: מְחֹלְלֶךָ
  choice: yang melahirkan engkau
  rationale: Bentuk dari חול membangkitkan gambaran sakit bersalin dan tindakan melahirkan. Terjemahan ini mempertahankan gambaran kelahiran yang mencolok di samping tindakan “memperanakkan” pada baris pertama.
theological_decisions:
- issue: Gambaran parental bagi Allah
  choice: Mempertahankan gambaran paternal (“memperanakkan”) dan maternal (“melahirkan”) dalam teks utama.
  alternative: Menggunakan bahasa penciptaan yang lebih umum, seperti “menjadikan” atau “membentuk”.
  rationale: Bahasa Ibrani menjajarkan tindakan memperanakkan dengan gambaran persalinan atau kelahiran. Ketegangan metaforis ini dipertahankan dan tidak dilebur menjadi bahasa penciptaan yang generik.
translation_notes:
  register: Bahasa Indonesia baku, puitis, dan bermartabat. “Engkau” dipakai untuk menjaga sapaan tunggal dalam puisi, sedangkan bentuk terikat “kauabaikan” mempertahankan kelancaran. Istilah “Gunung Batu” mempertahankan metafora dan fungsi gelar ilahi yang dikenal dalam register Alkitabiah Indonesia.
