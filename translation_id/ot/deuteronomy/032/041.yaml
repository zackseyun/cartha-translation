base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/041.yaml
  text: when I sharpen the lightning of my sword, and my hand takes hold of judgment, I will return vengeance on my adversaries, and I will repay those who hate me.
translation:
  language: id
  text: 'Apabila Aku mengasah kilatan pedang-Ku,

    dan tangan-Ku menggenggam penghakiman,

    Aku akan melakukan pembalasan terhadap lawan-lawan-Ku

    serta membalas orang-orang yang membenci-Ku.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: Ketika
  rationale: Dalam konteks puitis ini, אִם dapat memperkenalkan keadaan yang dipastikan akan terjadi, sehingga 'ketika' lebih alami daripada 'jika' dan sejalan dengan tindakan penghakiman yang menyusul.
- source_word: שַׁנּוֹתִי בְּרַק חַרְבִּי
  choice: Aku mengasah pedang-Ku hingga berkilat seperti kilat
  rationale: Ungkapan Ibrani secara padat menghubungkan tindakan mengasah dengan kilatan pedang. Terjemahan ini mempertahankan citra kilat sambil menjadikannya jelas dan alami dalam bahasa Indonesia.
- source_word: וְתֹאחֵז בְּמִשְׁפָּט יָדִי
  choice: dan tangan-Ku memegang keadilan
  rationale: Mempertahankan personifikasi tangan yang memegang mishpat. 'Keadilan' mencakup tindakan penghakiman yang adil tanpa mempersempitnya menjadi sekadar keputusan hukum.
- source_word: אָשִׁיב נָקָם
  choice: Aku akan membalaskan dendam
  rationale: Menunjukkan pembalasan setimpal oleh Allah; bentuk verbal Indonesia lebih wajar daripada ungkapan harfiah 'mengembalikan pembalasan'.
- source_word: אֲשַׁלֵּם
  choice: memberi ganjaran
  rationale: Kata ini berarti membayar atau membalas setimpal. 'Memberi ganjaran' menyampaikan retribusi sesuai perbuatan dalam konteks ini.
theological_decisions:
- issue: Kepastian tindakan ilahi pada אִם
  choice: Ketika
  alternative: Jika
  rationale: Dipahami sebagai konstruksi puitis yang mengantar tindakan yang pasti, bukan keraguan apakah Allah akan bertindak. Namun, fungsi kondisional bentuk Ibrani tetap diakui sebagai kemungkinan gramatikal.
- issue: Makna מִשְׁפָּט
  choice: keadilan
  alternative: penghakiman
  rationale: Pilihan ini menjaga fokus pada keadilan ilahi sebagai dasar pembalasan, tanpa meniadakan nuansa tindakan menghakimi.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Paralelisme bait dipertahankan; citra pedang yang berkilat diperjelas tanpa menghilangkan metafora kilat.
