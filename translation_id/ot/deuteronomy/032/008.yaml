  text: בְּ/הַנְחֵ֤ל עֶלְיוֹן֙ גּוֹיִ֔ם בְּ/הַפְרִיד֖/וֹ בְּנֵ֣י אָדָ֑ם יַצֵּב֙ גְּבֻלֹ֣ת עַמִּ֔ים לְ/מִסְפַּ֖ר בְּנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/008.yaml
  text: When the Most High gave the nations their inheritance[a], when he separated the sons of man[b], he fixed the boundaries of the peoples according to the number of the sons of Israel.
translation:
  language: id
  text: Ketika Yang Mahatinggi memberikan milik pusaka kepada bangsa-bangsa, ketika Ia memisahkan anak-anak manusia,[a] Ia menetapkan batas-batas bangsa-bangsa menurut jumlah anak-anak Israel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ungkapan Ibrani ini berarti manusia atau umat manusia.
    reason: lexical_alternative
  - marker: b
    text: Gulungan Laut Mati dan Septuaginta memuat “anak-anak Allah” (atau “malaikat-malaikat Allah”), bukan “anak-anak Israel”.
    reason: textual_variant
lexical_decisions:
- source_word: בְּ/הַנְחֵל
  choice: ketika ... memberikan milik pusaka
  rationale: Infinitif konstruk Hifil dengan prefiks ב membentuk anak kalimat temporal. Ungkapan ini menyampaikan tindakan membagikan atau menganugerahkan wilayah sebagai milik pusaka kepada bangsa-bangsa.
- source_word: עֶלְיוֹן
  choice: Yang Mahatinggi
  rationale: Gelar ilahi ini diterjemahkan dengan bentuk baku dan wajar dalam bahasa Indonesia, dengan tetap mempertahankan daya gelarnya.
- source_word: גּוֹיִם
  choice: bangsa-bangsa
  rationale: Kata ini menunjuk kepada berbagai bangsa di dunia, bukan secara khusus kepada 'orang bukan Yahudi' dalam pertentangan teologis yang lebih kemudian.
- source_word: בְּ/הַפְרִיד/וֹ
  choice: ketika Ia memisahkan
  rationale: Infinitif konstruk temporal kedua ini memiliki sufiks orang ketiga maskulin tunggal yang kembali kepada Yang Mahatinggi. 'Memisahkan' mempertahankan arti lugas פרד.
- source_word: בְּנֵי אָדָם
  choice: anak-anak manusia
  rationale: Ungkapan Ibrani harfiah ini tetap mempertahankan citra puitis 'anak-anak' sekaligus terdengar alami dalam bahasa Indonesia; cakupannya adalah umat manusia.
- source_word: יַצֵּב
  choice: Ia menetapkan
  rationale: Bentuk Hifil dari יצב menyatakan tindakan menempatkan atau menegakkan dengan pasti. 'Menetapkan' sesuai untuk penentuan batas wilayah.
- source_word: גְּבֻלֹת עַמִּים
  choice: batas-batas bangsa-bangsa
  rationale: Terjemahan ini mempertahankan makna batas teritorial dan kesejajaran puitis dengan bangsa-bangsa pada baris pertama.
- source_word: לְ/מִסְפַּר
  choice: menurut jumlah
  rationale: Frasa preposisional ini menyatakan kesesuaian atau ukuran; 'menurut jumlah' ringkas, alami, dan dekat dengan bentuk sumber.
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: anak-anak Israel
  rationale: Teks WLC yang diberikan berbunyi בני ישראל. Terjemahan ini transparan dan mempertahankan bentuk genealogis ungkapan Ibrani.
theological_decisions:
- issue: Varian tekstual pada klausa terakhir
  choice: anak-anak Israel
  alternative: anak-anak Allah; malaikat-malaikat Allah
  rationale: Teks utama mengikuti WLC yang disediakan, yaitu בני ישראל. Namun, bukti Gulungan Laut Mati dan Septuaginta mendukung bacaan yang setara dengan 'anak-anak Allah' atau 'malaikat-malaikat Allah'. Karena varian ini berpengaruh besar terhadap penafsiran, varian tersebut dicatat dan tidak diselesaikan secara diam-diam.
- issue: Cakupan antropologis בני אדם
  choice: anak-anak manusia
  alternative: umat manusia; keturunan Adam
  rationale: Bentuk Ibrani dipertahankan secara cukup formal dan puitis, sementara catatan kaki menjelaskan bahwa ungkapan itu merujuk kepada manusia secara umum, bukan hanya anak laki-laki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat dengan susunan puitis paralel. Kapitalisasi pronomina 'Ia' mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Penanda catatan kaki ditempatkan tepat setelah unsur yang dijelaskan.
