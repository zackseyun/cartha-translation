id: DEU.32.49
reference: Deuteronomy 32:49
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: עֲלֵ֡ה אֶל הַר֩ הָ/עֲבָרִ֨ים הַ/זֶּ֜ה הַר נְב֗וֹ אֲשֶׁר֙ בְּ/אֶ֣רֶץ מוֹאָ֔ב אֲשֶׁ֖ר עַל פְּנֵ֣י יְרֵח֑וֹ וּ/רְאֵה֙ אֶת אֶ֣רֶץ כְּנַ֔עַן אֲשֶׁ֨ר אֲנִ֥י נֹתֵ֛ן לִ/בְנֵ֥י יִשְׂרָאֵ֖ל לַ/אֲחֻזָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/049.yaml
  text: Go up to this mountain of the Abarim[a], Mount Nebo, which is in the land of Moab, opposite Jericho, and see the land of Canaan[c][b], which I am giving to the sons of Israel as a possession.
translation:
  language: id
  text: Naiklah ke gunung Abarim ini, yaitu Gunung Nebo, yang terletak di tanah Moab, di seberang Yerikho,[a] dan lihatlah tanah Kanaan yang Kuberikan kepada keturunan Israel[b] sebagai tanah milik.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “berhadapan dengan Yerikho.” Ungkapan Ibrani menunjukkan letak yang berhadapan atau di seberang Yerikho.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “anak-anak lelaki Israel”; ungkapan ini lazim menunjuk keturunan atau umat Israel secara kolektif.
    reason: lexical_alternative
  - marker: c
    text: Atau “sebagai milik.” Kata Ibrani menunjuk kepunyaan atau lahan yang menjadi hak milik.
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲלֵה
  choice: Naiklah
  rationale: Imperatif Qal orang kedua maskulin tunggal dari עלה; bentuk ini alami dalam bahasa Indonesia dan mempertahankan arah gerak ke tempat yang lebih tinggi.
- source_word: הַר הָעֲבָרִים הַזֶּה
  choice: gunung Abarim ini
  rationale: Frasa konstruksi dengan nama geografis; Abarim ditransliterasikan sebagai nama tempat, sedangkan demonstratif הַזֶּה diterjemahkan secara langsung sebagai 'ini'.
- source_word: הַר נְבוֹ
  choice: yaitu Gunung Nebo
  rationale: Frasa ini menjelaskan gunung yang baru disebut secara aposisional. 'Yaitu' membuat hubungan tersebut jelas dan alami tanpa menambah isi.
- source_word: אֲשֶׁר בְּאֶרֶץ מוֹאָב
  choice: yang terletak di tanah Moab
  rationale: Klausa relatif ini menunjukkan lokasi geografis. 'Terletak' merupakan ungkapan Indonesia yang alami untuk lokasi tetap.
- source_word: אֲשֶׁר עַל פְּנֵי יְרֵחוֹ
  choice: di seberang Yerikho
  rationale: Dalam konteks geografis, idiom עַל־פְּנֵי menunjukkan posisi berhadapan atau di seberang suatu tempat.
- source_word: וּרְאֵה
  choice: dan lihatlah
  rationale: Imperatif dari ראה; 'lihatlah' mempertahankan daya perintah dan terdengar wajar serta bermartabat.
- source_word: אֶת אֶרֶץ כְּנַעַן
  choice: tanah Kanaan
  rationale: אֶרֶץ di sini menunjuk wilayah geografis; 'tanah Kanaan' adalah bentuk yang lugas dan lazim.
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: yang Kuberikan
  rationale: Partisipel נֹתֵן dengan אֲנִי menggambarkan tindakan pemberian ilahi yang sedang berlaku atau pasti. Bentuk kini bahasa Indonesia cukup lentur untuk mempertahankan nuansa itu tanpa memaksakan aspek progresif.
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: kepada keturunan Israel
  rationale: Ungkapan בְּנֵי יִשְׂרָאֵל adalah sebutan kolektif bagi umat yang berasal dari Israel. 'Keturunan Israel' alami dalam bahasa Indonesia dan tidak menyempitkan rujukannya hanya kepada laki-laki biologis.
- source_word: לַאֲחֻזָּה
  choice: sebagai tanah milik
  rationale: אֲחֻזָּה menunjuk milik atau hak penguasaan yang terutama berupa lahan. 'Tanah milik' menyampaikan unsur kepemilikan bertanah dengan jelas.
theological_decisions:
- issue: Cakupan בְּנֵי יִשְׂרָאֵל sebagai sebutan umat perjanjian
  choice: keturunan Israel
  alternative: anak-anak lelaki Israel; orang Israel
  rationale: Walaupun בָּנִים secara bentuk maskulin, ungkapan tetap ini berfungsi sebagai etnonim kolektif. 'Keturunan Israel' mempertahankan hubungan genealogis tanpa memberi kesan bahwa hanya kaum laki-laki yang menerima tanah itu.
- issue: Nuansa pemberian dalam אֲנִי נֹתֵן
  choice: Kuberikan
  alternative: sedang Kuberikan; akan Kuberikan
  rationale: Partisipel Ibrani dapat mencakup tindakan kini dan masa depan yang pasti. Bentuk 'Kuberikan' menjaga kelenturan waktu tersebut dan tidak menentukan secara berlebihan kapan pemberian itu rampung.
- issue: Makna אֲחֻזָּה
  choice: tanah milik
  alternative: warisan; milik pusaka
  rationale: Kata sumber menekankan kepunyaan atau lahan pegangan, bukan terutama mekanisme pewarisan. Karena itu, 'tanah milik' menghindari penambahan nuansa teologis yang tidak wajib.
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada perintah yang khidmat tetapi mudah dipahami. Nama tempat ditransliterasikan menurut bentuk Indonesia yang lazim. Pronomina ilahi terikat ditulis dengan huruf kapital dalam 'Kuberikan'. Semua alternatif yang penting secara leksikal ditempatkan pada catatan kaki tanpa mengaburkan teks utama.
