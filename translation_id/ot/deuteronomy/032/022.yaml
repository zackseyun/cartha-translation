base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/022.yaml
  text: For a fire has been kindled in my anger[a], and it burns to the depths of Sheol; it devours the earth and its produce, and sets ablaze the foundations of the mountains.
translation:
  language: id
  text: Sebab api telah menyala dalam murka-Ku dan berkobar sampai ke kedalaman Syeol[a]. Api itu melalap bumi beserta hasilnya dan membakar dasar gunung-gunung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “sampai ke Syeol yang paling bawah” atau “sampai ke kedalaman dunia orang mati.” Secara harfiah, teks Ibrani berbunyi “sampai ke Syeol, yang paling bawah/dalam.”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Menandai alasan atau penjelasan bagi penghukuman yang disebut sebelumnya.
- source_word: אֵשׁ קָדְחָה בְאַפִּי
  choice: api telah menyala dalam murka-Ku
  rationale: Mempertahankan gambaran api yang mulai menyala serta makna idiomatis אַף sebagai murka, bukan arti harfiahnya, 'hidung'.
- source_word: וַתִּיקַד
  choice: dan berkobar
  rationale: Mengungkapkan kelanjutan api yang menyala dengan kuat tanpa menambahkan sasaran atau akibat yang tidak dinyatakan.
- source_word: עַד שְׁאוֹל תַּחְתִּית
  choice: sampai ke kedalaman Syeol
  rationale: Mempertahankan istilah Ibrani שְׁאוֹל dan menyampaikan תַּחְתִּית sebagai kedalaman atau bagian paling bawahnya.
- source_word: וַתֹּאכַל אֶרֶץ וִיבֻלָהּ
  choice: Api itu melalap bumi beserta hasilnya
  rationale: '''Melalap'' mempertahankan metafora harfiah ''memakan'' yang dipakai untuk api; ''hasilnya'' mencakup segala yang dihasilkan bumi.'
- source_word: וַתְּלַהֵט מוֹסְדֵי הָרִים
  choice: dan membakar dasar gunung-gunung
  rationale: Menyampaikan tindakan api terhadap bagian struktural terdalam gunung dengan bahasa Indonesia yang alami dan jelas.
theological_decisions:
- issue: Makna שְׁאוֹל
  choice: Syeol
  alternative: dunia orang mati; kubur; alam maut
  rationale: Syeol menunjuk pada ranah orang mati dalam dunia konseptual Perjanjian Lama. Mempertahankan istilah ini menghindari penyamaannya secara prematur dengan gagasan teologis yang lebih kemudian, sedangkan catatan kaki menjelaskan kemungkinan maknanya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan puitis. Kapital pada “-Ku” mengikuti kebiasaan ejaan teks keagamaan Indonesia untuk rujukan ilahi. Istilah “Syeol” dipertahankan dan dijelaskan dalam catatan kaki agar ambiguitas konseptual teks Ibrani tidak dihapus.
