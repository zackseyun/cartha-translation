  yaml_path: translation/ot/deuteronomy/032/003.yaml
  text: For I will proclaim the name of Yahweh[a]; ascribe greatness to our God.
translation:
  language: id
  text: Sebab aku akan memberitakan nama Yahweh[a]; akuilah kebesaran Allah kita.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: YHWH; secara tradisional diterjemahkan “TUHAN”. Nama ini juga dilafalkan “Yehuwa”.'
    reason: Menjelaskan nama ilahi dalam teks sumber, penggantian tradisional dalam terjemahan, dan bentuk pelafalan alternatif tanpa menyebut bentuk yang digunakan dalam teks utama sebagai alternatif.
lexical_decisions:
- source_word: כִּי
  choice: Sebab
  rationale: Mempertahankan fungsi penghubung kausal yang memberi dasar bagi seruan berikutnya dan terdengar wajar dalam bahasa Indonesia.
- source_word: שֵׁם
  choice: nama
  rationale: Padanan langsung yang mempertahankan gagasan tentang identitas dan kemasyhuran yang dinyatakan, tanpa menguraikannya secara berlebihan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: אֶקְרָא
  choice: aku akan memberitakan
  rationale: Dalam konteks nyanyian, verba קרא menyatakan pengumuman nama Yahweh secara terbuka; bentuk futur mempertahankan nuansa bentuk imperfek Ibrani.
- source_word: הָבוּ
  choice: akuilah
  rationale: Imperatif jamak ini menyerukan para pendengar untuk mengakui kebesaran yang memang menjadi milik Allah, bukan seolah-olah memberikan kebesaran kepada-Nya.
- source_word: גֹדֶל
  choice: kebesaran
  rationale: Padanan langsung bagi gagasan greatness atau keagungan, tanpa mempersempitnya menjadi kemuliaan.
- source_word: לֵאלֹהֵינוּ
  choice: Allah kita
  rationale: Mencerminkan sufiks orang pertama jamak; relasi yang ditandai ל secara alami tercakup oleh konstruksi bahasa Indonesia 'akuilah kebesaran Allah kita'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks menyebut Tetragramaton secara langsung. 'Yahweh' mempertahankan nama pribadi ilahi, sedangkan catatan kaki menjelaskan bentuk Ibraninya dan tradisi penerjemahannya.
- issue: Makna seruan הָבוּ גֹדֶל
  choice: akuilah kebesaran
  alternative: berilah kebesaran
  rationale: '''Akuilah'' menyampaikan fungsi idiomatis seruan itu tanpa menyiratkan bahwa manusia menjadikan Allah besar; kebesaran tersebut diakui sebagai milik-Nya.'
translation_notes:
  register: Bahasa Indonesia baku, modern, ringkas, dan khidmat. 'Memberitakan' mempertahankan nada deklaratif nyanyian, sedangkan 'akuilah' lebih alami bagi pembaca umum daripada 'nisbahkanlah' atau 'atributkanlah'.
