  text: הַרְנִ֤ינוּ גוֹיִם֙ עַמּ֔/וֹ כִּ֥י דַם עֲבָדָ֖י/ו יִקּ֑וֹם וְ/נָקָם֙ יָשִׁ֣יב לְ/צָרָ֔י/ו וְ/כִפֶּ֥ר אַדְמָת֖/וֹ עַמּֽ/וֹ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/043.yaml
  text: Rejoice[a], O nations, with his people, for he will avenge the blood of his servants; he will repay vengeance on his adversaries[d][c][b], and he will make atonement for his land and his people.
translation:
  language: id
  text: Bersoraklah[a], hai bangsa-bangsa, bersama umat-Nya, sebab Ia akan membalaskan darah hamba-hamba-Nya[b]; Ia akan menimpakan pembalasan kepada lawan-lawan-Nya, dan Ia akan mengadakan pendamaian[c] bagi tanah-Nya dan umat-Nya.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Bernyanyilah dengan sukacita.” Teks Ibrani pada bagian pembuka sangat padat dan secara harfiah mendekati, “Bersoraklah, hai bangsa-bangsa, umat-Nya”; hubungan “bersama” merupakan pemahaman sintaksis yang paling mungkin. “Pujilah umat-Nya” juga pernah dipahami sebagai kemungkinan.'
    reason: lexical_and_syntactic_alternative
  - marker: b
    text: Secara harfiah, “darah hamba-hamba-Nya.” Kata Ibrani yang diterjemahkan “hamba” juga dapat berarti “budak” dalam konteks lain.
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “Ia akan menyucikan” atau “membersihkan tanah-Nya dan umat-Nya.” Kata Ibrani dapat menekankan pendamaian, penghapusan kesalahan, atau pentahiran.'
    reason: lexical_alternative
  - marker: d
    text: Septuaginta Yunani dan salah satu Gulungan Laut Mati memuat bentuk ayat yang lebih panjang, termasuk seruan tambahan agar langit dan makhluk-makhluk ilahi bersukacita serta agar bangsa-bangsa menyembah Dia. Teks utama di sini mengikuti teks Ibrani Masoret.
    reason: textual_variant
lexical_decisions:
- source_word: הַרְנִינוּ
  choice: Bersoraklah
  rationale: Bentuk imperatif jamak dari רנן menyatakan luapan sukacita yang dapat berupa sorak atau nyanyian. “Bersoraklah” mempertahankan nuansa bunyi dan kegembiraan dengan bahasa Indonesia yang alami.
- source_word: גוֹיִם
  choice: bangsa-bangsa
  rationale: Padanan baku bagi גוים dalam pengertian kolektif internasional; tidak membawa konotasi Perjanjian Baru yang dapat melekat pada “orang-orang bukan Yahudi”.
- source_word: עַמּוֹ
  choice: bersama umat-Nya
  rationale: Teks Masoret sangat ringkas, secara harfiah mendekati “bersoraklah, bangsa-bangsa, umat-Nya.” Kata “bersama” dipakai untuk menyatakan hubungan sintaksis yang paling mungkin, tetapi ambiguitas Ibraninya dicatat.
- source_word: כִּי
  choice: sebab
  rationale: Memperkenalkan alasan bagi seruan untuk bersorak.
- source_word: דַם עֲבָדָיו
  choice: darah hamba-hamba-Nya
  rationale: עבד dapat berarti hamba atau budak. Dalam konteks ini, “hamba” menonjolkan kepunyaan dan pelayanan kepada Allah, sementara pokok kalimatnya ialah darah mereka yang ditumpahkan.
- source_word: יִקּוֹם
  choice: Ia akan membalaskan
  rationale: Berasal dari נקם dan, bersama objek “darah,” berarti menuntut pembalasan atas darah yang ditumpahkan.
- source_word: וְנָקָם יָשִׁיב
  choice: Ia akan menimpakan pembalasan
  rationale: Ungkapan ini secara harfiah berbicara tentang mengembalikan pembalasan. “Menimpakan pembalasan” mempertahankan unsur retributif dan menghasilkan susunan Indonesia yang wajar dengan “kepada lawan-lawan-Nya.”
- source_word: לְצָרָיו
  choice: kepada lawan-lawan-Nya
  rationale: צרים menunjuk kepada pihak-pihak yang memusuhi. “Lawan-lawan” tepat, jelas, dan sesuai dengan ragam puisi yang khidmat.
- source_word: וְכִפֶּר
  choice: Ia akan mengadakan pendamaian bagi
  rationale: כפר mengandung daya makna penebusan dosa atau pemurnian. “Mengadakan pendamaian bagi” mempertahankan bobot kultis-teologis tanpa menentukan secara berlebihan apakah penekanannya terutama pada penebusan atau pentahiran.
- source_word: אַדְמָתוֹ
  choice: tanah-Nya
  rationale: אדמה berarti tanah atau bumi. “Tanah-Nya” lebih dekat daripada “negeri-Nya” dan sesuai dengan gagasan bahwa tanah itu tercemar oleh darah.
- source_word: עַמּוֹ
  choice: umat-Nya
  rationale: Padanan langsung dan lazim untuk umat yang menjadi milik Allah.
theological_decisions:
- issue: Hubungan “bangsa-bangsa” dengan “umat-Nya” pada bagian pembuka
  choice: Bangsa-bangsa diseru untuk bersorak bersama umat Allah.
  alternative: Bangsa-bangsa diseru untuk memuji umat-Nya; atau teks dibaca menurut bentuk lebih panjang dalam Septuaginta dan salah satu Gulungan Laut Mati.
  rationale: Urutan kata Masoret sangat padat dan tidak memuat preposisi yang setara dengan “bersama.” Namun, pembacaan komitatif paling masuk akal dalam konteks dan menghasilkan bahasa Indonesia yang jelas. Catatan kaki mempertahankan kesadaran akan kepadatan dan alternatif sintaksis tersebut.
- issue: Makna כפר pada klausa terakhir
  choice: Allah mengadakan pendamaian bagi tanah-Nya dan umat-Nya.
  alternative: Allah menyucikan atau membersihkan tanah-Nya dan umat-Nya.
  rationale: Terjemahan utama mempertahankan daya makna pendamaian dari כפר, sedangkan catatan kaki menyebut nuansa pentahiran yang juga mungkin dalam konteks pencemaran oleh darah.
- issue: Pelaku tindakan dalam kata kerja orang ketiga tunggal
  choice: Kata ganti “Ia” merujuk kepada TUHAN dalam konteks Nyanyian Musa.
  alternative: Nama ilahi dapat diulang secara eksplisit.
  rationale: Bahasa Ibrani memakai bentuk verba orang ketiga tunggal tanpa menyebut nama pada ayat ini; penggunaan “Ia” mempertahankan bentuk itu dan konteks sudah menentukan rujukannya.
translation_notes:
  register: Bahasa Indonesia modern yang khidmat dan puitis. Kapitalisasi kata ganti ilahi mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. “Bersoraklah” dipilih untuk daya bunyi רנן; “pendamaian” mempertahankan ketegangan teologis כפר, dengan nuansa pentahiran dicatat. Semua penanda catatan kaki ditempatkan dalam teks utama.
