  text: And Yahweh spoke to Moses on that very day[a], saying,
translation:
  language: id
  text: 'Pada hari itu juga, Yahweh[a] berfirman kepada Musa:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ibrani: “YHWH”; secara tradisional diterjemahkan “TUHAN”. Nama ini juga ditransliterasikan “Yehuwa”.'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: berfirman
  rationale: Dalam konteks ketika Allah menjadi subjek, bahasa Indonesia Alkitabiah yang wajar memakai "berfirman"; bentuk wayyiqtol meneruskan alur narasi tanpa harus selalu diterjemahkan dengan kata penghubung "dan".
- source_word: יְהוָה
  choice: Yahweh
  rationale: Menerjemahkan Tetragramaton sebagai nama diri "Yahweh", bukan menggantinya dengan gelar.
- source_word: אֶל־מֹשֶׁה
  choice: kepada Musa
  rationale: Padanan langsung dan alami bagi penerima firman.
- source_word: בְּעֶצֶם הַיּוֹם הַזֶּה
  choice: Pada hari itu juga
  rationale: Ungkapan ini menegaskan bahwa peristiwa berlangsung tepat pada hari yang sedang dibicarakan; "pada hari itu juga" alami dalam narasi Indonesia.
- source_word: לֵאמֹר
  choice: kata-Nya
  rationale: Rumus pengantar kutipan langsung diterjemahkan secara idiomatis. Akhiran "-Nya" secara wajar merujuk kepada Yahweh sebagai pembicara.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama ilahi secara langsung. Bentuk "Yahweh" mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar; catatan menjelaskan tradisi dan alternatif yang dikenal.
translation_notes:
  register: Bahasa Indonesia modern, bermartabat, dan mudah dipahami. Susunan klausa dibuat alami dalam narasi Indonesia, sementara penegasan waktu dan rumus pengantar firman tetap dipertahankan.
