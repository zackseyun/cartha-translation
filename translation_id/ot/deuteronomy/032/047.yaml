  text: כִּ֠י לֹֽא דָבָ֨ר רֵ֥ק הוּא֙ מִ/כֶּ֔ם כִּי ה֖וּא חַיֵּי/כֶ֑ם וּ/בַ/דָּבָ֣ר הַ/זֶּ֗ה תַּאֲרִ֤יכוּ יָמִים֙ עַל הָ֣/אֲדָמָ֔ה אֲשֶׁ֨ר אַתֶּ֜ם עֹבְרִ֧ים אֶת הַ/יַּרְדֵּ֛ן שָׁ֖מָּ/ה לְ/רִשְׁתָּֽ/הּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/047.yaml
  text: For it is not an empty word for you[a], but it is your life[c][b], and by this word you will prolong your days on the land that you are crossing the Jordan to possess.
translation:
  language: id
  text: Sebab, perkataan ini bukanlah sesuatu yang hampa bagi kalian[a], melainkan hidup kalian[b]. Melalui perkataan ini kalian akan panjang umur di tanah yang akan kalian masuki dengan menyeberangi Sungai Yordan untuk memilikinya[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “bukanlah hal yang remeh bagi kalian” atau “bukanlah sesuatu yang sia-sia bagi kalian.”'
    reason: lexical_alternative
  - marker: b
    text: Kata Ibrani yang diterjemahkan “hidup” berbentuk jamak, tetapi dapat dipakai secara idiomatis sebagai nomina abstrak tunggal.
    reason: lexical_alternative
  - marker: c
    text: 'Atau: “untuk mengambilnya menjadi milik kalian” atau “untuk mewarisinya.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: דָבָר רֵק
  choice: perkataan ini bukanlah sesuatu yang hampa
  rationale: דָבָר menunjuk pada perkataan atau pengajaran perjanjian yang baru disampaikan, sedangkan רֵק menyatakan kehampaan, kesia-siaan, atau ketiadaan nilai. Susunan ini terdengar alami dalam bahasa Indonesia dan tetap mempertahankan citra dasarnya.
- source_word: מִכֶּם
  choice: bagi kalian
  rationale: Dalam ungkapan ini, מן menyatakan hubungan dengan umat Israel, bukan pemisahan harfiah ‘dari kalian’. ‘Bagi kalian’ menyampaikan idiom tersebut secara wajar.
- source_word: חַיֵּיכֶם
  choice: hidup kalian
  rationale: Walaupun bentuk Ibraninya secara morfologis jamak, חַיִּים lazim berfungsi sebagai nomina abstrak tunggal, ‘hidup’ atau ‘kehidupan’. ‘Hidup kalian’ juga mempertahankan daya ungkap langsung dari teks.
- source_word: וּבַדָּבָר הַזֶּה
  choice: melalui perkataan ini
  rationale: 'Preposisi ב dipahami secara instrumental: perkataan ini menjadi sarana yang berkaitan dengan panjangnya hidup Israel. ‘Perkataan’ juga menjaga kesinambungan dengan דָבָר pada klausa pertama tanpa menambahkan kata ‘menaati’ yang tidak dinyatakan secara eksplisit.'
- source_word: תַּאֲרִיכוּ יָמִים
  choice: kalian akan panjang umur
  rationale: Bentuk Hifil ארך bersama יָמִים secara idiomatis berarti menjalani umur panjang. Ungkapan Indonesia ‘panjang umur’ jelas dan alami, meskipun tidak mempertahankan metafora ‘memanjangkan hari-hari’ secara harfiah.
- source_word: עַל הָאֲדָמָה
  choice: di tanah
  rationale: Dalam konteks Ulangan, הָאֲדָמָה menunjuk pada wilayah tempat Israel akan tinggal. ‘Di tanah’ mempertahankan unsur kewilayahan dan sesuai dengan konstruksi Indonesia.
- source_word: עֹבְרִים אֶת־הַיַּרְדֵּן שָׁמָּה
  choice: yang kalian tuju dengan menyeberangi Sungai Yordan
  rationale: Partisipel עֹבְרִים menggambarkan penyeberangan yang segera dilakukan dari sudut pandang Musa. Rumusan ini mempertahankan gerak menuju ke sana serta menghasilkan kalimat Indonesia yang alami.
- source_word: לְרִשְׁתָּהּ
  choice: untuk mendudukinya
  rationale: ירשׁ dalam konteks tanah dapat berarti mengambil alih, menduduki, memiliki, atau mewarisi. ‘Mendudukinya’ menyatakan pengambilan tanah sebagai tempat tinggal tanpa memutuskan secara sempit antara nuansa memiliki dan mewarisi.
theological_decisions:
- issue: Hubungan perkataan perjanjian dengan hidup dan umur panjang Israel
  choice: Teks menyatakan secara langsung bahwa perkataan itu adalah hidup Israel dan bahwa melaluinya mereka akan panjang umur di tanah tersebut.
  alternative: Ayat ini hanya merupakan pujian retoris terhadap pentingnya hukum tanpa menyatakan konsekuensi perjanjian.
  rationale: Paralel antara ‘hidup kalian’ dan ‘akan panjang umur di tanah’ memiliki bobot perjanjian yang nyata. Terjemahan mempertahankan hubungan itu, tetapi tidak menambahkan istilah teologis atau rumusan doktrinal dari masa kemudian.
translation_notes:
  register: Bahasa Indonesia baku modern dengan sapaan jamak ‘kalian’ untuk mempertahankan bahwa Musa berbicara kepada umat sebagai kelompok. Ragamnya khidmat tetapi tetap mudah dipahami. Penanda catatan kaki [a], [b], dan [c] semuanya ditempatkan langsung pada unsur yang dijelaskan.
