base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/013.yaml
  text: He made him ride on the heights of the land[a], and he ate the produce of the field; he made him suck honey from the rock[c][b], and oil from the flinty rock.
translation:
  language: id
  text: Ia membuatnya berkendara di atas ketinggian-ketinggian negeri,[a] dan ia memakan hasil ladang; Ia membuatnya mengisap madu dari batu karang,[b] dan minyak dari batu cadas yang keras.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “tempat-tempat tinggi di bumi.” Dalam konteks ini ungkapan tersebut tampaknya menunjuk pada kawasan tinggi yang subur, bukan tempat pemujaan.'
    reason: lexical_alternative
  - marker: b
    text: 'Secara harfiah: “membuatnya mengisap madu dari batu karang.” Kata kerja Ibrani ini berbentuk kausatif, yaitu “membuatnya mengisap.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְכִּבֵהוּ
  choice: Ia membuatnya melintasi
  rationale: Bentuk Hifil dari רכב bersifat kausatif, harfiah 'membuatnya berkendara/menunggang'. Dalam bahasa Indonesia, 'membuatnya melintasi' mempertahankan gagasan bahwa ia dibawa bergerak di atas kawasan tinggi tanpa menimbulkan gambaran kendaraan yang tidak dinyatakan.
- source_word: עַל בָּמֳתֵי אָרֶץ
  choice: tempat-tempat tinggi di negeri itu
  rationale: במות menunjuk pada ketinggian atau tempat tinggi. Dalam konteks ini ungkapan tersebut bersifat topografis, bukan acuan yang harus dipahami sebagai tempat ibadah.
- source_word: וַיֹּאכַל
  choice: dan ia memakan
  rationale: Menerjemahkan makna lugas אכל dan mempertahankan gambaran konkret tentang menikmati pemberian negeri.
- source_word: תְּנוּבֹת שָׂדָי
  choice: hasil ladang
  rationale: תנובות berarti hasil atau panen; bentuk tunggal kolektif שדי dapat diterjemahkan secara alami sebagai 'ladang'.
- source_word: וַיֵּנִקֵהוּ
  choice: Ia membuatnya mengisap
  rationale: Hifil ינק berarti 'membuat mengisap/menyusu'. Pilihan ini mempertahankan metafora Ibrani yang hidup tentang menerima makanan langsung dari sumber yang tidak terduga.
- source_word: דְבַשׁ
  choice: madu
  rationale: Padanan baku yang tetap membiarkan konteks menentukan apakah yang dibayangkan madu lebah atau sari buah yang manis.
- source_word: מִסֶּלַע
  choice: dari bukit batu
  rationale: סלע menunjuk pada batu besar, bukit batu, atau tebing batu; 'bukit batu' alami dalam bahasa Indonesia dan membedakannya dari צור pada baris berikut.
- source_word: וְשֶׁמֶן
  choice: dan minyak
  rationale: Teks menyebut minyak tanpa secara eksplisit menyebut zaitun; terjemahan tidak menambahkan kekhususan yang tidak ada dalam bahasa Ibrani.
- source_word: מֵחַלְמִישׁ צוּר
  choice: dari batu cadas yang keras
  rationale: חלמיש menunjuk pada batu api atau sifat sangat keras, sedangkan צור berarti batu cadas. Frasa ini menyampaikan kelimpahan yang muncul dari batu yang keras dan tampaknya tandus.
theological_decisions:
- issue: Rujukan pronomina orang ketiga tunggal
  choice: Mempertahankan pronomina 'Ia' dan '-nya/ia' tanpa menggantinya dengan nama diri
  alternative: Menyebut TUHAN sebagai subjek dan Israel atau Yakub sebagai objek
  rationale: Konteks langsung menjelaskan rujukannya, tetapi ayat Ibrani sendiri memakai pronomina. Mempertahankannya menghormati alur puitis dan tidak memasukkan penjelasan ke dalam teks utama.
- issue: Makna tempat-tempat tinggi
  choice: Memahaminya secara topografis sebagai kawasan tinggi di negeri itu
  alternative: Menerjemahkannya sebagai tempat-tempat pemujaan
  rationale: Konteks membicarakan negeri subur dan pemeliharaan, sehingga tidak ada alasan tekstual untuk mengimpor konotasi tempat ibadah berhala.
translation_notes:
  register: Bahasa Indonesia modern, puitis, dan bermartabat. Kapitalisasi 'Ia' menandai subjek ilahi menurut konteks, sedangkan 'ia/-nya' merujuk kepada umat secara tunggal kolektif. Susunan paralel ayat dipertahankan, dengan tanda titik koma untuk memperjelas dua bagian puisi.
