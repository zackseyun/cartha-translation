  text: חֶמְאַ֨ת בָּקָ֜ר וַ/חֲלֵ֣ב צֹ֗אן עִם חֵ֨לֶב כָּרִ֜ים וְ/אֵילִ֤ים בְּנֵֽי בָשָׁן֙ וְ/עַתּוּדִ֔ים עִם חֵ֖לֶב כִּלְי֣וֹת חִטָּ֑ה וְ/דַם עֵנָ֖ב תִּשְׁתֶּה חָֽמֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/014.yaml
  text: curds from the herd[a], and milk from the flock, with the fat of lambs, and rams, the offspring of Bashan, and goats, with the choicest wheat; and you drank foaming wine[b], the blood of grapes.
translation:
  language: id
  text: dadih dari kawanan sapi dan susu dari ternak kecil, beserta lemak anak-anak domba, domba-domba jantan keturunan Basan, dan kambing-kambing jantan, beserta gandum pilihan[a]; engkau minum anggur berbuih[b], darah buah anggur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “lemak buah pinggang gandum,” ungkapan Ibrani untuk gandum yang terbaik atau paling bernas.'
    reason: lexical_alternative
  - marker: b
    text: 'Atau: “anggur merah”; istilah Ibraninya mungkin menggambarkan anggur yang kaya, berfermentasi, atau berbuih.'
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶמְאַת בָּקָר
  choice: dadih dari kawanan sapi
  rationale: חֶמְאָה menunjuk pada hasil susu yang kental, mungkin dadih atau susu asam, bukan mentega modern; בָּקָר adalah kawanan ternak besar, khususnya sapi.
- source_word: חֲלֵב צֹאן
  choice: susu dari kawanan domba dan kambing
  rationale: צֹאן merupakan istilah kolektif bagi ternak kecil yang dapat mencakup domba dan kambing. Ungkapan ini dibuat jelas dalam bahasa Indonesia tanpa membatasi maknanya hanya pada domba.
- source_word: חֵלֶב כָּרִים
  choice: lemak anak-anak domba
  rationale: חֵלֶב dipertahankan secara konkret sebagai 'lemak', sedangkan כָּרִים menunjuk pada domba muda atau anak domba.
- source_word: אֵילִים בְּנֵי בָשָׁן
  choice: domba-domba jantan keturunan Basan
  rationale: אֵילִים berarti domba jantan; בְּנֵי בָשָׁן secara harfiah 'anak-anak Basan' dan secara idiomatis menggambarkan ternak yang berasal atau dibiakkan di Basan.
- source_word: עַתּוּדִים
  choice: kambing-kambing jantan
  rationale: Kata ini secara khusus lazim menunjuk pada kambing jantan; unsur jenis kelaminnya dipertahankan karena dapat diungkapkan secara alami dalam bahasa Indonesia.
- source_word: חֵלֶב כִּלְיוֹת חִטָּה
  choice: gandum pilihan
  rationale: Secara harfiah ungkapan ini berbunyi 'lemak buah pinggang gandum', sebuah gambaran Ibrani bagi bagian gandum yang paling kaya atau terbaik. Terjemahan idiomatis mencegah kekaburan yang tidak perlu, sementara catatan kaki mempertahankan citra aslinya.
- source_word: דַם עֵנָב
  choice: darah buah anggur
  rationale: Metafora konkret bagi sari anggur atau anggur dipertahankan agar daya puitis bahasa Ibrani tetap terasa.
- source_word: תִּשְׁתֶּה
  choice: engkau minum
  rationale: Bentuk orang kedua tunggal maskulin dalam konteks nyanyian ini dapat menyampaikan tindakan lampau secara naratif; bahasa Indonesia tidak menandai kala pada verba, sehingga 'engkau minum' mempertahankan bentuk yang alami dan tidak memaksakan aspek.
- source_word: חָמֶר
  choice: anggur berbuih
  rationale: Istilah ini menunjuk pada anggur dan mungkin menonjolkan sifatnya yang berfermentasi atau berbuih; 'anggur berbuih' mempertahankan gambaran tersebut sambil mengakui alternatif 'anggur merah' dalam catatan.
theological_decisions:
- issue: Gambaran puitis tentang kelimpahan
  choice: Mempertahankan daftar konkret hasil ternak, gandum, dan anggur.
  alternative: Mengabstraksikannya sebagai kemewahan atau berkat perjanjian.
  rationale: Ayat ini sendiri menggambarkan pemeliharaan melalui makanan dan minuman konkret. Terjemahan tidak memasukkan penafsiran teologis abstrak yang tidak dinyatakan langsung.
- issue: Hubungan 'darah buah anggur' dengan anggur
  choice: 'Mempertahankannya sebagai aposisi: ''anggur berbuih, darah buah anggur''.'
  alternative: 'Menjadikannya sumber: ''anggur berbuih dari darah buah anggur''.'
  rationale: Susunan Ibrani menempatkan דַם עֵנָב sebagai gambaran puitis yang menerangkan anggur, bukan secara eksplisit sebagai frasa sumber.
translation_notes:
  register: Bahasa Indonesia modern, baku, dan puitis. 'Engkau' dipakai untuk sapaan tunggal dalam nyanyian. Pengulangan jenis ternak dipertahankan demi ritme dan kelimpahan gambaran; istilah yang sangat asing dijelaskan lewat catatan kaki.
