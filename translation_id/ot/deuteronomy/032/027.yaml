reference: Deuteronomy 32:27
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: לוּלֵ֗י כַּ֤עַס אוֹיֵב֙ אָג֔וּר פֶּֽן יְנַכְּר֖וּ צָרֵ֑י/מוֹ פֶּן יֹֽאמְרוּ֙ יָדֵ֣י/נוּ רָ֔מָה וְ/לֹ֥א יְהוָ֖ה פָּעַ֥ל כָּל זֹֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/032/027.yaml
  text: Were it not that I feared the provocation of the enemy[a], lest their adversaries should misunderstand, lest they should say, ‘Our hand is exalted[c][b], and Yahweh has not done all this.’
translation:
  language: id
  text: Sekiranya bukan karena Aku takut akan penghinaan dari pihak musuh[a], supaya lawan-lawan mereka tidak salah menilai[b], supaya mereka tidak berkata, ‘Tangan kami berjaya[c], dan Yahweh tidak melakukan semua ini.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “amarah musuh” atau “tindakan musuh yang membangkitkan murka-Ku.”
    reason: כַּעַס dapat berarti kemarahan, kejengkelan, atau sesuatu yang memancing kemarahan; konstruksi dengan אוֹיֵב memungkinkan lebih dari satu hubungan makna.
  - marker: b
    text: Kata kerja Ibrani di sini sulit; mungkin juga berarti “salah memahami” atau “gagal mengenali” penyebab sebenarnya dari kejatuhan Israel.
    reason: Menjaga ketidakpastian leksikal יְנַכְּרוּ tanpa membebani teks utama.
  - marker: c
    text: Secara harfiah, “Tangan kami tinggi.” Maksudnya, kekuatan merekalah yang menang.
    reason: Menjelaskan metafora Ibrani יָדֵינוּ רָמָה dan dasar terjemahan idiomatis dalam teks utama.
lexical_decisions:
- source_word: לוּלֵי
  choice: Sekiranya bukan karena
  rationale: Mengungkapkan hubungan pengecualian-bersyarat secara wajar dalam bahasa Indonesia dan mengaitkan ayat ini dengan tindakan penghakiman pada konteks sebelumnya.
- source_word: כַּעַס אוֹיֵב
  choice: penghinaan dari pihak musuh
  rationale: כַּעַס dapat menunjuk pada sikap atau tindakan yang membangkitkan murka. Dalam konteks ini yang dikhawatirkan ialah reaksi lancang musuh yang menyombongkan diri dan menyangkal karya Yahweh; 'penghinaan' menyampaikan nuansa itu tanpa menjadikannya sekadar kemarahan musuh.
- source_word: אָגוּר
  choice: Aku takut
  rationale: Mempertahankan ungkapan antropopatis sumber secara langsung. Konteks menunjukkan bahwa yang dimaksud bukan ketidakberdayaan, melainkan pertimbangan terhadap penghinaan dan kesimpulan keliru musuh.
- source_word: פֶּן
  choice: jangan-jangan
  rationale: Partikel yang diulang ini memperkenalkan akibat yang hendak dicegah. 'Jangan-jangan' alami dalam bahasa Indonesia dan mempertahankan nuansa kekhawatiran.
- source_word: יְנַכְּרוּ
  choice: salah menilai
  rationale: Bentuk ini sulit, tetapi dalam konteks paling mungkin berarti keliru mengenali atau menafsirkan penyebab kejatuhan Israel. Terjemahan ini mempertahankan unsur salah memahami tanpa menentukan lebih jauh objek yang tidak dinyatakan.
- source_word: צָרֵימוֹ
  choice: lawan-lawan mereka
  rationale: Nomina ini menunjuk kepada pihak-pihak yang memusuhi Israel. Sufiks puitis -מו dipahami sebagai jamak, sesuai subjek jamak pada verba dan ucapan berikutnya.
- source_word: יָדֵינוּ רָמָה
  choice: Tangan kami berjaya
  rationale: Ungkapan harfiah 'tangan kami tinggi' adalah metafora kekuatan dan kemenangan. 'Berjaya' mempertahankan klaim kemenangan sombong itu dalam bahasa Indonesia yang alami; arti harfiahnya dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan, bukan diganti dengan gelar, sehingga identitas personal dalam teks sumber tetap tampak.
- source_word: פָּעַל כָּל זֹאת
  choice: melakukan semua ini
  rationale: Terjemahan langsung dan alami dari klausa yang menyangkal bahwa seluruh kejadian tersebut merupakan tindakan Yahweh.
theological_decisions:
- issue: Ungkapan antropopatis אָגוּר tentang Yahweh
  choice: Aku takut
  alternative: Aku khawatir; Aku menahan diri karena
  rationale: Teks Ibrani memakai verba takut/gentar dalam orang pertama. Ungkapan ini dipertahankan agar ketegangan teologis sumber tidak dihapus; konteks menerangkan bahwa perhatian tertuju pada kesalahpahaman musuh.
- issue: Makna penghinaan atau kemarahan dalam כַּעַס אוֹיֵב
  choice: penghinaan dari pihak musuh
  alternative: amarah musuh; tindakan musuh yang membangkitkan murka
  rationale: Konteks langsung menampilkan ucapan sombong yang merampas pengakuan atas tindakan Yahweh. Pilihan utama menonjolkan provokasi lancang itu, sementara kemungkinan leksikal lain tetap dicatat.
- issue: Penulisan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Mempertahankan nama diri ilahi yang terdapat dalam sumber Ibrani dan tidak menggantinya dengan sebuah gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapitalisasi ‘Aku’ mengikuti pembicara ilahi dalam konteks. ‘Jangan-jangan’ dipilih agar rangkaian פֶּן tetap jelas dan alami; tanda baca membagi dua akibat yang dikhawatirkan. Urutan penanda catatan kaki mengikuti kemunculannya dalam teks.
