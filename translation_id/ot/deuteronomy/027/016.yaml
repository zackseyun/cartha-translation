base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/016.yaml
  text: Cursed is the one who dishonors his father or his mother. And all the people shall say[a], “Amen.”
translation:
  language: id
  text: “Terkutuklah orang yang merendahkan[a] ayahnya atau ibunya.” Lalu seluruh umat harus berkata, “Amin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menganggap remeh,” “menghina,” atau “memperlakukan dengan tidak hormat.” Kata Ibrani ini menyatakan memperlakukan seseorang seolah-olah ia tidak penting atau patut dihina.
    reason: alternatif_leksikal
lexical_decisions:
- source_word: אָרוּר
  choice: Terkutuklah
  rationale: Bentuk partisip/adjektival pasif ini membuka rumusan kutuk perjanjian. Bentuk “Terkutuklah” alami dalam bahasa Indonesia dan mempertahankan nada hukum-liturgis.
- source_word: מַקְלֶה
  choice: merendahkan
  rationale: Kata dari akar קלה menyatakan tindakan menganggap ringan, tidak penting, atau hina. “Merendahkan” mempertahankan unsur perlakuan yang menghina tanpa membatasinya hanya pada perasaan batin atau ucapan.
- source_word: אָבִיו וְאִמּוֹ
  choice: ayahnya atau ibunya
  rationale: 'Secara bentuk, penghubungnya berarti “dan”, tetapi dalam rumusan hukum kutuk ini cakupannya distributif: pelanggaran terhadap salah satu atau kedua orang tua. “Atau” menyampaikan cakupan tersebut secara wajar dalam bahasa Indonesia.'
- source_word: וְאָמַר
  choice: Lalu ... harus berkata
  rationale: Bentuk verba meneruskan urutan tindakan liturgis. “Lalu” menyatakan kelanjutan, sedangkan “harus berkata” mempertahankan sifat respons yang diwajibkan.
- source_word: כָּל הָעָם
  choice: seluruh umat
  rationale: Frasa ini secara harfiah berarti seluruh rakyat/umat. Dalam konteks perhimpunan perjanjian, “seluruh umat” alami dan tidak menambahkan “Israel”, yang tidak tertulis dalam ayat.
- source_word: אָמֵן
  choice: Amin
  rationale: Transliterasi liturgis yang sudah baku dalam bahasa Indonesia dan mempertahankan fungsi peneguhan khidmat.
theological_decisions:
- issue: Sifat pelanggaran terhadap orang tua
  choice: Diterjemahkan sebagai tindakan “merendahkan” ayah atau ibu.
  alternative: “menganggap remeh”, “menghina”, atau “tidak menghormati” ayah atau ibu
  rationale: Verba Ibrani menggambarkan perlakuan yang membuat seseorang dianggap ringan, tidak penting, atau hina. “Merendahkan” mempertahankan daya etis dan sosialnya tanpa menyempitkannya menjadi kebencian batin, makian verbal, atau satu tindakan tertentu saja.
translation_notes:
  register: Bahasa Indonesia modern, ringkas, khidmat, dan sesuai dengan bentuk pengumuman kutuk serta jawaban liturgis. “Ayah” dan “ibu” dipilih sebagai padanan umum yang alami; “umat” mencerminkan komunitas perjanjian dalam konteks tanpa menambahkan identitas yang tidak eksplisit pada ayat.
