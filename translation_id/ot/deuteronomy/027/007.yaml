base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/007.yaml
  text: And you shall sacrifice peace offerings[a], and you shall eat there, and you shall rejoice before Yahweh your God.
translation:
  language: id
  text: Persembahkanlah kurban keselamatan[a], makanlah di sana, dan bersukacitalah di hadapan Yahweh, Allahmu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “kurban persekutuan” atau “kurban kesejahteraan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזָבַחְתָּ
  choice: Engkau harus mempersembahkan
  rationale: Dalam konteks ibadah, זבח menunjuk pada tindakan mempersembahkan kurban. Pilihan ini alami dalam bahasa Indonesia dan mempertahankan daya perintah bentuk Ibrani.
- source_word: שְׁלָמִים
  choice: kurban keselamatan
  rationale: Istilah ini menamai jenis kurban yang berkaitan dengan kesejahteraan, perdamaian, dan jamuan bersama. 'Kurban keselamatan' cukup dikenal sebagai istilah ritual, sementara kemungkinan makna lainnya dicatat dalam catatan kaki.
- source_word: וְאָכַלְתָּ שָּׁם
  choice: dan makan di sana
  rationale: Terjemahan ini mempertahankan tindakan makan dan penunjuk tempat שָׁם tanpa menambahkan objek yang tidak dinyatakan secara eksplisit dalam bahasa Ibrani.
- source_word: וְשָׂמַחְתָּ
  choice: Engkau harus bersukacita
  rationale: שׂמח mengungkapkan sukacita perayaan dalam konteks ibadah. Pengulangan 'Engkau harus' menjaga nada instruksional tanpa membuat kalimat Indonesia terasa kaku.
- source_word: לִפְנֵי
  choice: di hadapan
  rationale: Dalam konteks ibadah, לִפְנֵי berarti berada di hadapan atau dalam hadirat Allah; 'di hadapan' ringkas, wajar, dan bermartabat.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan secara langsung sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Akhiran orang kedua tunggal maskulin dipertahankan melalui bentuk posesif '-mu', selaras dengan sapaan tunggal 'Engkau'.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian secara langsung; 'Yahweh' mempertahankan nama itu tanpa menggantinya dengan gelar.
- issue: Makna kategori kurban שְׁלָמִים
  choice: kurban keselamatan
  alternative: kurban persekutuan atau kurban kesejahteraan
  rationale: Istilah Ibrani memiliki jangkauan makna yang mencakup damai, kesejahteraan, dan persekutuan melalui jamuan kurban. Teks utama memakai istilah ritual yang dikenal, sedangkan alternatif yang sah dipertahankan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan tunggal 'Engkau' mempertahankan bentuk orang kedua tunggal dalam bahasa Ibrani. Struktur verbal disederhanakan secara wajar, tetapi nada perintah dan urutan tindakannya tetap terjaga.
