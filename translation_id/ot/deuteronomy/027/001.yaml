    issue: Pengantar kutipan “memerintahkan kepada bangsa itu, demikian” tidak gramatikal/alami.
    rationale: Dalam bahasa Indonesia, “memerintahkan” dapat langsung diikuti objek atau isi perintah, tetapi “demikian” bukan pengantar kutipan yang sesuai di sini. Titik dua menyampaikan fungsi לֵאמֹר tanpa tambahan yang janggal.
  - severity: medium
    issue: “yang kusampaikan kepadamu” tidak memadai untuk מְצַוֶּה.
    rationale: Partisipel צוה berarti “memerintahkan”, bukan sekadar “menyampaikan”. Terjemahan perlu mempertahankan daya perintah dan aspek tindakan yang sedang/berlangsung dalam konteks.
