  yaml_path: translation/ot/deuteronomy/027/001.yaml
  text: Then Moses and the elders of Israel commanded the people[a], saying, “Keep all the commandment that I am commanding you today.”
translation:
  language: id
  text: 'Lalu Musa dan para tua-tua Israel memerintahkan bangsa itu: “Taatilah seluruh perintah[a] yang kuperintahkan kepadamu hari ini.”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “segenap perintah”; dalam bahasa Ibrani bentuknya tunggal dan digunakan secara kolektif.
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: memerintahkan
  rationale: Kata kerja צוה menyatakan pemberian perintah yang berwenang; bentuk ini langsung dan wajar dalam bahasa Indonesia.
- source_word: וְזִקְנֵי יִשְׂרָאֵל
  choice: dan para tua-tua Israel
  rationale: Konjungsi Ibrani mengoordinasikan Musa dan para tua-tua sebagai subjek bersama, sehingga diterjemahkan dengan “dan”.
- source_word: הָעָם
  choice: bangsa itu
  rationale: Dalam konteks nasional-perjanjian ini, עָם menunjuk kepada umat Israel secara kolektif; “bangsa itu” alami dan mempertahankan acuan tertentu.
- source_word: לֵאמֹר
  choice: demikian
  rationale: Infinitif pengutip ini memperkenalkan isi perkataan. “Demikian” mempertahankan fungsi wacananya tanpa ungkapan kaku “dengan berkata”.
- source_word: שָׁמֹר
  choice: Taatilah
  rationale: Dalam konteks perintah, שׁמר berarti memelihara atau menaati dengan saksama. “Taatilah” menyampaikan tuntutan pelaksanaan secara alami.
- source_word: כָּל הַמִּצְוָה
  choice: seluruh perintah
  rationale: Nomina Ibrani berbentuk tunggal dan didahului כָּל. “Seluruh perintah” mempertahankan bentuk tunggal kolektif sekaligus terdengar alami.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם
  choice: yang kusampaikan kepadamu
  rationale: Dalam bahasa Indonesia, “menyampaikan perintah kepada” lebih alami daripada “memerintahkan kamu” ketika objek langsungnya sudah berupa “perintah”; bentuk ku- juga mempertahankan orang pertama yang ditegaskan.
- source_word: הַיּוֹם
  choice: pada hari ini
  rationale: Padanan ini mempertahankan penekanan temporal dalam ragam modern dan bermartabat.
theological_decisions:
- issue: Bentuk tunggal מִצְוָה dalam pengajaran perjanjian
  choice: “seluruh perintah” sebagai bentuk tunggal kolektif
  alternative: “semua perintah” sebagai bentuk jamak idiomatis
  rationale: Teks Ibrani memakai nomina tunggal. Bentuk tunggal dipertahankan agar cakupan kolektif hukum tidak diam-diam diubah menjadi jamak.
translation_notes:
  register: Bahasa Indonesia standar modern, lugas, dan bermartabat. Struktur subjek bersama dipertahankan, sedangkan formula pengutip dan konstruksi verba diselaraskan agar alami dalam bahasa Indonesia.
