  text: אָר֕וּר מַשְׁגֶּ֥ה עִוֵּ֖ר בַּ/דָּ֑רֶךְ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/018.yaml
  text: Cursed is the one who misleads a blind man on the road. And all the people shall say[a], ‘Amen.’
translation:
  language: id
  text: “Terkutuklah orang yang menyesatkan seorang buta di jalan.[a]” Dan seluruh rakyat harus berkata, “Amin!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Bisa juga: “membuat seorang buta tersesat dalam perjalanan.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Terkutuklah
  rationale: Menyampaikan rumusan kutuk perjanjian yang bersifat deklaratif dan tetap alami dalam bahasa Indonesia. Partikel -lah memberi tekanan pada pernyataan tanpa harus mengubahnya menjadi sekadar harapan.
- source_word: מַשְׁגֶּה
  choice: orang yang menyesatkan
  rationale: Partisipel Hifil menyatakan tindakan menyebabkan orang lain menyimpang atau tersesat. Pilihan ini mempertahankan makna kausatif dengan ungkapan Indonesia yang ringkas dan wajar.
- source_word: עִוֵּר
  choice: seorang buta
  rationale: Adjektiva tunggal ini dipakai secara substantival untuk menunjuk satu orang buta dalam rumusan kasus hukum. Ungkapan ini alami dan tidak menambahkan keterangan yang tidak terdapat dalam teks.
- source_word: בַּדָּרֶךְ
  choice: di jalan
  rationale: Frasa ini paling wajar dipahami secara konkret dan spasial, yakni menyesatkan orang buta ketika berada di jalan.
- source_word: וְאָמַר
  choice: Dan ... harus berkata
  rationale: Dalam rangkaian liturgis-hukum ini, bentuk tersebut menyatakan tanggapan yang diwajibkan, bukan sekadar laporan tentang ucapan pada masa lampau.
- source_word: כָּל הָעָם
  choice: seluruh rakyat
  rationale: Mewakili cakupan כָּל dan nomina kolektif הָעָם tanpa menambahkan 'Israel', yang tidak dinyatakan secara eksplisit dalam ayat ini.
- source_word: אָמֵן
  choice: Amin
  rationale: Transliterasi yang telah mapan dalam bahasa Indonesia dan mempertahankan fungsi liturgisnya sebagai pengukuhan atas pernyataan kutuk.
theological_decisions:
- issue: Sifat rumusan kutuk
  choice: Terkutuklah orang yang...
  alternative: Semoga orang yang... dikutuk
  rationale: Bahasa Ibrani menyajikan pernyataan kutuk perjanjian, bukan sekadar keinginan. Rumusan yang dipilih mempertahankan daya deklaratif dan resmi ayat.
- issue: Rujukan tunggal עִוֵּר
  choice: seorang buta
  alternative: orang buta
  rationale: Bentuk tunggal substantival menunjuk satu kasus perseorangan. Bahasa Indonesia tidak perlu menandai gender gramatikal yang tidak dapat diungkapkan secara alami tanpa menambahkan kata 'laki-laki' yang lebih spesifik daripada tuntutan konteks.
- issue: Daya normatif tanggapan umat
  choice: harus berkata
  alternative: akan berkata
  rationale: Konteks liturgis menetapkan tanggapan bersama yang wajib diucapkan. 'Harus' menjelaskan fungsi injunktif tanpa memperlakukannya sebagai ramalan semata.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur singkat mempertahankan bentuk liturgis rumusan kutuk serta jawaban bersama. Tanda seru pada “Amin!” mencerminkan pengukuhan komunal yang tegas.
