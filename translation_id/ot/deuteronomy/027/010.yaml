base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/010.yaml
  text: So you shall listen to the voice of Yahweh your God and do his commandments and his statutes that I am commanding you today[a].
translation:
  language: id
  text: Maka dengarkanlah suara Yahweh, Allahmu, dan lakukanlah perintah-perintah serta ketetapan-ketetapan-Nya yang kuperintahkan kepadamu hari ini.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “patuhilah Yahweh, Allahmu.” Ungkapan Ibrani “mendengarkan suara” sering kali mencakup makna mengindahkan dan menaati.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַעְתָּ בְּקוֹל
  choice: Jadi, dengarkanlah suara
  rationale: Ungkapan Ibrani שׁמע בקול berarti mendengarkan dengan sungguh-sungguh dan menyiratkan ketaatan. Terjemahan ini mempertahankan unsur leksikal 'mendengar suara' tanpa meleburkannya sepenuhnya menjadi 'menaati', karena klausa berikutnya secara eksplisit menyebut pelaksanaan perintah.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi YHWH sebagai nama pribadi, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Konstruksi posesif yang langsung dan alami dalam bahasa Indonesia, yang menunjuk kepada Allah Israel dalam hubungan perjanjian.
- source_word: וְעָשִׂיתָ
  choice: dan lakukanlah
  rationale: Kata עשה di sini berarti melakukan atau melaksanakan. Bentuk imperatif Indonesia sesuai dengan daya perintah dari bentuk verbal dalam konteks pidato Musa.
- source_word: מִצְוֺתָיו
  choice: perintah-perintah-Nya
  rationale: Mempertahankan nuansa hukum-perjanjian dari מִצְוָה dan tetap mudah dipahami.
- source_word: חֻקָּיו
  choice: ketetapan-ketetapan-Nya
  rationale: Membedakan חֻקִּים dari מִצְוֹת dan menyampaikan aturan yang telah ditetapkan dalam konteks hukum.
- source_word: אֲשֶׁר אָנֹכִי מְצַוְּךָ
  choice: yang kusampaikan kepadamu
  rationale: Dalam konteks ini, frasa tersebut mengacu pada perintah yang sedang disampaikan Musa. Pilihan ini alami dalam bahasa Indonesia dan menghindari pengulangan janggal 'perintah-perintah ... yang kuperintahkan', tanpa menghilangkan tindakan memerintah.
- source_word: הַיּוֹם
  choice: hari ini
  rationale: Padanan modern dan langsung yang mempertahankan penekanan khas Ulangan pada saat perjanjian kini.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai Tetragramaton sebagai nama ilahi. Bentuk 'Yahweh' mempertahankan nama pribadi tersebut, sedangkan 'TUHAN' merupakan penggantian tradisional dengan gelar.
- issue: Cakupan makna שׁמע בקול
  choice: dengarkanlah suara
  alternative: taatilah
  rationale: Ungkapan itu mencakup pengertian mengindahkan dan menaati, tetapi terjemahan utama mempertahankan citra 'mendengarkan suara' karena pelaksanaan perintah dinyatakan tersendiri dalam klausa berikutnya.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada khidmat dan langsung. Bentuk enklitik seperti 'Allahmu' dan 'kusampaikan' menjaga kelancaran, sedangkan pengulangan jamak mempertahankan pembedaan dua kelompok istilah hukum Ibrani.
