  rationale: Revisi mengganti "kusampaikan" dengan "kuperintahkan" agar verba צוה diterjemahkan secara eksplisit. Pembuka diubah menjadi "Maka" untuk register yang lebih sesuai. Catatan kaki mempertahankan bahwa idiom "mendengarkan suara" dapat menyiratkan ketaatan, tanpa menghapus pembedaan dalam teks utama antara mendengarkan dan melakukan.
