  text: וּ/בָנִ֤יתָ שָּׁם֙ מִזְבֵּ֔חַ לַ/יהוָ֖ה אֱלֹהֶ֑י/ךָ מִזְבַּ֣ח אֲבָנִ֔ים לֹא תָנִ֥יף עֲלֵי/הֶ֖ם בַּרְזֶֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/005.yaml
  text: And there you shall build an altar to Yahweh your God[a], an altar of stones[b]; you shall not wield iron upon them.
translation:
  language: id
  text: Di sana haruslah kamu membangun sebuah mazbah bagi Yahweh, Allahmu, yaitu mazbah dari batu-batu. Janganlah kamu menggunakan perkakas besi pada batu-batu itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “Janganlah kamu mengayunkan besi ke atasnya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָנִיתָ שָּׁם
  choice: Di sana haruslah kamu membangun
  rationale: Bentuk perfektum Qal dengan waw dalam konteks perintah memiliki daya instruksional. Susunan ini mempertahankan unsur lokasi dan nada hukum secara wajar dalam bahasa Indonesia.
- source_word: מִזְבֵּחַ
  choice: mazbah
  rationale: Istilah baku dan ringkas untuk tempat persembahan kurban dalam konteks Alkitab.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: bagi Yahweh, Allahmu
  rationale: Preposisi ל menandai peruntukan atau pengabdian, sedangkan nama ilahi יהוה dipertahankan sebagai Yahweh. Sufiks orang kedua tunggal pada אֱלֹהֶיךָ diterjemahkan 'Allahmu'.
- source_word: מִזְבַּח אֲבָנִים
  choice: mazbah dari batu-batu
  rationale: Frasa konstruksi menyatakan bahan pembuat mazbah. Bentuk jamak 'batu-batu' mempertahankan spesifikasi Ibrani dan menjadi acuan jelas bagi sufiks jamak berikutnya.
- source_word: לֹא תָנִיף עֲלֵיהֶם בַּרְזֶל
  choice: Janganlah kamu mengayunkan besi ke atas batu-batu itu
  rationale: Hifil נוף secara harfiah menggambarkan mengayunkan atau mengangkat sesuatu atas batu-batu tersebut. 'Besi' dipertahankan karena teks tidak menyebut kata 'alat', sementara catatan kaki menjelaskan makna instrumental yang mungkin dimaksud.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehovah
  rationale: Teks Ibrani memakai Tetragramaton secara langsung. 'Yahweh' mempertahankan nama perjanjian tanpa menggantinya dengan gelar, sementara ketidakpastian historis mengenai pelafalan tidak diselesaikan dengan memilih bentuk denominatif lain.
translation_notes:
  register: Bahasa Indonesia modern yang bermartabat dengan bentuk perintah hukum 'haruslah' dan 'janganlah'. Istilah 'mazbah' dipakai demi ketepatan konteks ibadah. Ungkapan harfiah tentang besi dipertahankan dalam teks utama, sedangkan pengertian instrumental dijelaskan dalam catatan kaki.
