  text: אָרוּר֙ לֹקֵ֣חַ שֹׁ֔חַד לְ/הַכּ֥וֹת נֶ֖פֶשׁ דָּ֣ם נָקִ֑י וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/025.yaml
  text: Cursed is the one who takes a bribe to strike down an innocent person[a], and all the people shall say, ‘Amen.’
translation:
  language: id
  text: Terkutuklah orang yang menerima suap untuk membunuh orang yang tidak bersalah[a]. Dan seluruh umat harus berkata, “Amin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “untuk memukul seseorang—darah yang tidak bersalah.” Ungkapan Ibrani ini merujuk pada pembunuhan terhadap orang yang tidak bersalah.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Terkutuklah
  rationale: Mempertahankan rumusan kutuk perjanjian sebagai pernyataan predikatif yang tegas dan wajar dalam bahasa Indonesia.
- source_word: לֹקֵחַ
  choice: orang yang menerima
  rationale: Partisipel Qal berfungsi substantival dan menunjuk secara umum kepada siapa pun yang melakukan tindakan tersebut.
- source_word: שֹׁחַד
  choice: suap
  rationale: Istilah hukum yang lazim untuk pemberian tidak sah yang dimaksudkan untuk memengaruhi tindakan atau membelokkan keadilan.
- source_word: לְהַכּוֹת
  choice: untuk membunuh
  rationale: Dalam konstruksi dengan דָּם נָקִי, verba נכה menunjuk pada kekerasan yang berakibat kematian; 'membunuh' menyampaikan maksudnya dengan jelas.
- source_word: נֶפֶשׁ דָּם נָקִי
  choice: orang yang tidak bersalah
  rationale: Ungkapan Ibrani secara harfiah memuat 'nyawa/darah yang tidak bersalah' dan secara idiomatis menunjuk kepada seorang korban yang tidak bersalah.
- source_word: וְאָמַר כָּל הָעָם
  choice: Dan seluruh umat harus berkata
  rationale: Dalam konteks liturgis dan hukum, bentuk ini menyatakan tanggapan yang diwajibkan; 'harus berkata' alami dan tetap mempertahankan daya preskriptifnya.
- source_word: אָמֵן
  choice: Amin
  rationale: Dipertahankan sebagai ungkapan liturgis yang sudah mapan dalam bahasa Indonesia dan menegaskan persetujuan terhadap kutuk perjanjian.
theological_decisions:
- issue: Rumusan kutuk dalam konteks perjanjian
  choice: Terkutuklah orang yang menerima suap untuk membunuh orang yang tidak bersalah
  alternative: Terkutuklah orang yang menerima suap untuk menumpahkan darah orang yang tidak bersalah
  rationale: Pilihan utama menyampaikan pelanggaran dan akibat mematikannya secara jelas tanpa mengurangi kekuatan hukum serta perjanjian dari teks. Idiom darah tetap dicatat dalam catatan kaki agar citra dan nuansa kesalahan darah dalam bahasa sumber tidak hilang.
translation_notes:
  register: Bahasa Indonesia modern, jelas, dan bermartabat. 'Seluruh umat' dipilih untuk עָם dalam konteks Israel yang berkumpul, sedangkan 'harus berkata' mempertahankan sifat tanggapan liturgis yang diperintahkan.
