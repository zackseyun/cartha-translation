  text: אָר֗וּר שֹׁכֵב֙ עִם אֵ֣שֶׁת אָבִ֔י/ו כִּ֥י גִלָּ֖ה כְּנַ֣ף אָבִ֑י/ו וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/020.yaml
  text: Cursed is the one who lies with his father's wife[a], because he has uncovered his father's skirt. And all the people shall say[b], ‘Amen.’
translation:
  language: id
  text: “Terkutuklah orang yang tidur dengan istri ayahnya[a], sebab ia telah menyingkapkan ujung kain ayahnya[b].” Dan seluruh bangsa itu harus berkata, “Amin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam konteks, “istri ayahnya” mungkin merujuk kepada ibu tirinya, tetapi teks Ibrani tidak menyebutnya secara eksplisit.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, bahasa Ibrani berbunyi “ujung kain ayahnya.” Ungkapan ini merupakan eufemisme seksual yang berkaitan dengan ungkapan “menyingkapkan aurat” dalam Imamat 18:8 dan 20:11.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Terkutuklah
  rationale: Menyampaikan rumusan kutuk perjanjian dengan bentuk predikatif yang baku, tegas, dan wajar dalam bahasa Indonesia.
- source_word: שֹׁכֵב עִם
  choice: tidur dengan
  rationale: Ungkapan Indonesia yang lazim untuk hubungan seksual dan tetap mempertahankan sifat eufemistis idiom Ibrani.
- source_word: אֵשֶׁת אָבִיו
  choice: istri ayahnya
  rationale: Mengikuti bunyi harfiah bahasa Ibrani dan tidak mempersempit rujukannya menjadi 'ibu tirinya'.
- source_word: כִּי
  choice: sebab
  rationale: Menandai alasan bagi kutuk tersebut dengan gaya legal-liturgis yang alami.
- source_word: גִלָּה כְּנַף אָבִיו
  choice: telah menyingkapkan punca kain ayahnya
  rationale: כָּנָף secara konkret dapat berarti ujung atau punca pakaian. Terjemahan ini mempertahankan citra dan eufemisme seksual teks sumber, sementara catatan kaki menjelaskan maknanya.
- source_word: וְאָמַר כָּל הָעָם
  choice: Dan seluruh bangsa itu harus berkata
  rationale: Menjaga waw konsekutif/formula respons umat serta nuansa kewajiban dalam konteks upacara perjanjian.
- source_word: אָמֵן
  choice: Amin
  rationale: Transliterasi liturgis yang sudah baku dalam bahasa Indonesia.
theological_decisions:
- issue: Eufemisme seksual גִלָּה כְּנַף אָבִיו dalam rumusan kutuk
  choice: Mempertahankan metafora sebagai 'menyingkapkan punca kain ayahnya'.
  alternative: menyingkapkan aurat ayahnya; mencemari tempat tidur ayahnya
  rationale: Frasa itu menggemakan larangan seksual Taurat dan menyangkut kehormatan serta hak perkawinan sang ayah. Terjemahan utama tidak menggantikan citra Ibrani dengan tafsiran yang lebih eksplisit; penjelasannya diberikan dalam catatan kaki.
- issue: Identitas אֵשֶׁת אָבִיו
  choice: istri ayahnya
  alternative: ibu tirinya
  rationale: Dalam konteks, perempuan itu mungkin ibu tiri pelaku, tetapi bahasa Ibrani tidak secara eksplisit memakai istilah 'ibu tiri'.
translation_notes:
  register: Bahasa Indonesia baku-modern dengan wibawa legal-liturgis. Bentuk 'Terkutuklah' dan respons 'Amin' mempertahankan pola upacara perjanjian, sedangkan eufemisme sumber dipertahankan tanpa dibuat vulgar atau ditafsirkan secara denominatif.
