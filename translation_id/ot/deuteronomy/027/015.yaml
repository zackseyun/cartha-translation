source:
  edition: WLC
  text: אָר֣וּר הָ/אִ֡ישׁ אֲשֶׁ֣ר יַעֲשֶׂה֩ פֶ֨סֶל וּ/מַסֵּכָ֜ה תּוֹעֲבַ֣ת יְהוָ֗ה מַעֲשֵׂ֛ה יְדֵ֥י חָרָ֖שׁ וְ/שָׂ֣ם בַּ/סָּ֑תֶר וְ/עָנ֧וּ כָל הָ/עָ֛ם וְ/אָמְר֖וּ אָמֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/015.yaml
  text: Cursed is the man who makes a carved image or a cast image—an abomination to Yahweh[a], the work of the hands of a craftsman—and sets it up in secret. And all the people shall answer and say[b], “Amen.”
translation:
  language: id
  text: “Terkutuklah orang[a] yang membuat patung pahatan atau patung tuangan[b]—kekejian bagi Yahweh, karya tangan perajin—lalu menaruhnya di tempat tersembunyi.” Seluruh umat harus menjawab dan berkata, “Amin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “laki-laki itu”; bentuk maskulin tunggal Ibrani di sini berfungsi sebagai rumusan hukum yang mewakili siapa pun yang melakukan perbuatan tersebut.
    reason: lexical_alternative
  - marker: b
    text: Patung yang dibuat dengan menuangkan bahan cair ke dalam cetakan, biasanya logam; dapat juga diterjemahkan “patung leburan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Terkutuklah
  rationale: Mempertahankan daya hukum dan khidmat formula kutuk perjanjian; bentuk -lah cocok untuk pernyataan liturgis dalam bahasa Indonesia.
- source_word: הָאִישׁ
  choice: orang
  rationale: Dalam formula hukum ini, nomina maskulin tunggal Ibrani berfungsi secara representatif. 'Orang' alami dalam bahasa Indonesia dan tidak mempersempit cakupan formula kepada laki-laki saja; bentuk sumber dijelaskan dalam catatan kaki.
- source_word: יַעֲשֶׂה
  choice: membuat
  rationale: Kata kerja umum ini tepat dalam konteks pembuatan benda pemujaan dan tetap konkret tanpa menambahkan teknik yang tidak dinyatakan.
- source_word: פֶסֶל
  choice: patung pahatan
  rationale: Menunjukkan patung yang dibentuk dengan memahat, bukan memakai istilah lebih luas 'berhala' yang menghilangkan cara pembuatannya.
- source_word: מַסֵּכָה
  choice: patung tuangan
  rationale: Menunjukkan benda yang dibuat dengan proses penuangan; unsur 'logam' tidak dimasukkan ke teks utama karena tidak disebutkan secara eksplisit dalam kata Ibrani ini.
- source_word: תּוֹעֲבַת יְהוָה
  choice: kekejian bagi Yahweh
  rationale: Mempertahankan kekuatan moral-perjanjian dari תּוֹעֵבָה dan relasinya dengan nama ilahi tanpa melunakkannya menjadi sekadar sesuatu yang tidak disukai.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks Ibrani, bukan menggantinya dengan gelar.
- source_word: מַעֲשֵׂה יְדֵי חָרָשׁ
  choice: karya tangan perajin
  rationale: Ungkapan alami dan ringkas yang tetap menekankan bahwa patung tersebut merupakan hasil buatan manusia.
- source_word: וְשָׂם בַּסָּתֶר
  choice: lalu menaruhnya di tempat tersembunyi
  rationale: Menjaga tindakan penempatan dan gagasan penyembunyian; sufiks objek 'nya' dibuat eksplisit secara wajar dalam bahasa Indonesia.
- source_word: וְעָנוּ כָל הָעָם וְאָמְרוּ
  choice: Seluruh umat harus menjawab dan berkata
  rationale: Mempertahankan kedua verba dalam formula tanggapan bersama serta nuansa kewajiban liturgis.
- source_word: אָמֵן
  choice: Amin
  rationale: Bentuk liturgis yang sudah mapan dalam bahasa Indonesia dan mempertahankan formula persetujuan perjanjian.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama perjanjian secara langsung; transliterasi 'Yahweh' mempertahankan statusnya sebagai nama diri dan tidak menggantinya dengan gelar.
- issue: Maskulin tunggal generik dalam formula kutuk
  choice: orang
  alternative: laki-laki
  rationale: הָאִישׁ berbentuk maskulin tunggal, tetapi dalam formula hukum ini mewakili siapa pun yang melakukan tindakan tersebut. Bahasa Indonesia memakai 'orang' secara alami untuk fungsi generik itu, sementara bentuk gramatikal sumber dicatat agar tidak disembunyikan.
- issue: Sifat objek yang disebut מַסֵּכָה
  choice: patung tuangan
  alternative: patung tuangan logam
  rationale: Konteks leksikal sering menunjuk benda logam, tetapi kata pada ayat ini tidak menyebut 'logam' secara eksplisit. Terjemahan utama tidak menambahkan bahan tersebut; catatan memberi keterangan yang relevan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Struktur formula kutuk serta jawaban bersama dipertahankan, sedangkan pilihan kata seperti 'orang', 'perajin', dan 'tempat tersembunyi' dijaga agar mudah dipahami pembaca umum.
