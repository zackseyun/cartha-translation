  naturalness: Bahasa draf umumnya baku dan mudah dipahami. “Ketika kalian menyeberangi” lebih alami sekaligus lebih dekat dengan fungsi konstruksi Ibrani daripada “Setelah kalian menyeberangi.” Pengulangan “batu-batu itu” pada klausa terakhir membuat objek jamak lebih jelas daripada sufiks -nya.
  terminology: “Sungai Yordan,” “Gunung Ebal,” “batu-batu,” dan “kapur” tepat. “Mendirikan” sesuai untuk תָּקִימוּ dalam konteks ini. Catatan varian sebaiknya menggunakan istilah tekstual “memuat bacaan” alih-alih “menuliskan.”
