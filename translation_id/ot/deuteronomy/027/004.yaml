  text: וְ/הָיָה֮ בְּ/עָבְרְ/כֶ֣ם אֶת הַ/יַּרְדֵּן֒ תָּקִ֜ימוּ אֶת הָ/אֲבָנִ֣ים הָ/אֵ֗לֶּה אֲשֶׁ֨ר אָנֹכִ֜י מְצַוֶּ֥ה אֶתְ/כֶ֛ם הַ/יּ֖וֹם בְּ/הַ֣ר עֵיבָ֑ל וְ/שַׂדְתָּ֥ אוֹתָ֖/ם בַּ/שִּֽׂיד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/004.yaml
  text: And when you cross the Jordan[a], you shall set up these stones, which I am commanding you today, on Mount Ebal, and you shall plaster them with lime.
translation:
  language: id
  text: Ketika kalian menyeberangi Sungai Yordan, kalian harus mendirikan batu-batu ini, yang kuperintahkan kepada kalian hari ini, di Gunung Ebal[a], dan melapisi batu-batu itu dengan kapur.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sejumlah tradisi teks, terutama Taurat Samaria, memuat bacaan “Gunung Gerizim” sebagai ganti “Gunung Ebal.”
    reason: textual_variant
lexical_decisions:
- source_word: וְהָיָה בְּעָבְרְכֶם
  choice: Setelah kalian menyeberangi
  rationale: Ungkapan pembuka dengan infinitif konstruk menyatakan keadaan waktu pada masa mendatang. Dalam konteks ini, 'setelah' terdengar alami dan sesuai dengan tindakan mendirikan batu yang berlangsung sesudah penyeberangan.
- source_word: הַיַּרְדֵּן
  choice: Sungai Yordan
  rationale: Nama ini merujuk kepada sungai; penyebutan 'Sungai' membuat rujukannya langsung jelas bagi pembaca Indonesia modern.
- source_word: תָּקִימוּ
  choice: kalian harus mendirikan
  rationale: Bentuk Hifil dari קום berarti membuat berdiri atau mendirikan. 'Harus' menyampaikan daya perintah dalam konteks ini.
- source_word: הָאֲבָנִים הָאֵלֶּה
  choice: batu-batu ini
  rationale: Terjemahan langsung yang tidak menambahkan gagasan bahwa batu-batu tersebut merupakan monumen.
- source_word: אֲשֶׁר אָנֹכִי מְצַוֶּה אֶתְכֶם הַיּוֹם
  choice: yang kuperintahkan kepada kalian hari ini
  rationale: Mempertahankan orang pertama tunggal yang tegas serta waktu 'hari ini'; bentuk Indonesia ini alami tanpa menghilangkan daya ujaran perintah.
- source_word: בְּהַר עֵיבָל
  choice: di Gunung Ebal
  rationale: Preposisi ב dengan nama gunung dapat dinyatakan secara alami sebagai 'di Gunung Ebal' dalam bahasa Indonesia.
- source_word: וְשַׂדְתָּ אֹתָם
  choice: dan melapisinya
  rationale: Kata kerja שׂוד menunjuk pada tindakan melapisi atau memplester. 'Melapisinya' menghindari pengulangan janggal ketika bahannya disebut sesudahnya.
- source_word: בַּשִּׂיד
  choice: dengan kapur
  rationale: שׂיד menunjuk pada kapur atau bahan plester berbahan kapur; 'kapur' mempertahankan penyebutan bahan secara spesifik.
theological_decisions:
- issue: Nama lokasi dalam tradisi teks Ulangan 27:4
  choice: Gunung Ebal
  alternative: Gunung Gerizim
  rationale: Teks WLC/Masoret yang menjadi sumber utama berbunyi 'Gunung Ebal'. Varian penting dalam Taurat Samaria dipertahankan dalam catatan kaki tanpa mengganti bacaan teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Kata ganti jamak 'kalian' dipakai agar bentuk orang kedua jamak Ibrani tetap nyata. Nada perintah dipertahankan dengan 'harus', sedangkan susunan kalimat dibuat wajar bagi pembaca umum.
