  text: אָר֗וּר מַטֶּ֛ה מִשְׁפַּ֥ט גֵּר יָת֖וֹם וְ/אַלְמָנָ֑ה וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/019.yaml
  text: Cursed is the one who perverts the justice due to the sojourner[a], the fatherless, and the widow. And all the people shall say[c][b], “Amen.”
translation:
  language: id
  text: “Terkutuklah orang yang menyimpangkan[c] keadilan yang menjadi hak pendatang[a], anak yatim[b], dan janda.” Dan seluruh rakyat harus berkata, “Amin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “Pendatang” menerjemahkan kata Ibrani ger, yaitu orang dari luar yang tinggal menetap di tengah masyarakat Israel.
    reason: cultural_note
  - marker: b
    text: Secara harfiah, “anak tanpa ayah”; juga dapat diterjemahkan “yatim.”
    reason: lexical_alternative
  - marker: c
    text: Atau “membelokkan” atau “memutarbalikkan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Terkutuklah
  rationale: Mempertahankan rumusan kutuk perjanjian yang membuka ayat, dengan bentuk bahasa Indonesia yang tegas, wajar, dan khidmat.
- source_word: מַטֶּה
  choice: menyimpangkan
  rationale: Partisipel Hifil dari נטה di sini menunjuk pada tindakan membelokkan atau merusak pelaksanaan keadilan. “Menyimpangkan” mempertahankan gambaran dasar sekaligus jelas dalam konteks hukum.
- source_word: מִשְׁפַּט
  choice: keadilan yang menjadi hak
  rationale: Dalam konteks hukum ini, מִשְׁפַּט mencakup keadilan atau keputusan hukum yang semestinya diterima kelompok rentan, bukan hanya gagasan abstrak tentang keadilan.
- source_word: גֵּר
  choice: pendatang
  rationale: Menunjuk pada orang bukan pribumi yang menetap di tengah Israel dan memiliki kedudukan sosial yang rentan. “Pendatang” lebih alami dalam bahasa Indonesia modern daripada istilah teknis seperti “orang asing yang menetap”.
- source_word: יָתוֹם
  choice: anak yatim
  rationale: Padanan Indonesia yang lazim bagi kategori sosial rentan ini; dalam pemakaian Ibrani, istilahnya dapat menunjuk pada anak yang kehilangan ayah atau orang tua.
- source_word: אַלְמָנָה
  choice: janda
  rationale: Padanan langsung dan wajar bagi kategori sosial-hukum yang disebut dalam rangkaian ini.
- source_word: וְאָמַר כָּל הָעָם
  choice: Dan seluruh rakyat harus berkata
  rationale: Dalam urutan upacara ini, bentuk verba berfungsi sebagai instruksi liturgis. “Harus berkata” menyatakan respons yang diwajibkan tanpa membuatnya terdengar seperti ramalan.
- source_word: אָמֵן
  choice: Amin
  rationale: Bentuk serapan yang mapan dalam bahasa Indonesia dan mempertahankan fungsi jawaban liturgis yang mengukuhkan kutuk perjanjian.
theological_decisions:
- issue: Penerjemahan tiga golongan sosial-hukum tanpa memasukkan kategori politik modern
  choice: pendatang, anak yatim, dan janda
  alternative: orang asing yang menetap, anak tanpa ayah, dan janda
  rationale: Pilihan ini mempertahankan tiga kelompok rentan dalam tatanan hukum Israel serta tetap mudah dipahami pembaca Indonesia, tanpa menyamakan גֵּר secara sempit dengan satu kategori imigrasi modern.
- issue: Cakupan מִשְׁפַּט dalam larangan ini
  choice: keadilan yang menjadi hak
  alternative: hak hukum
  rationale: Frasa pilihan mempertahankan hubungan antara keadilan dan hak yang semestinya diterima kelompok rentan, tanpa membatasi istilah hanya pada putusan pengadilan formal.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada hukum-liturgis yang khidmat. Struktur kutuk dan jawaban bersama dipertahankan, sedangkan ungkapan “keadilan yang menjadi hak” memperjelas nuansa hukum מִשְׁפַּט tanpa menghilangkan ketegangan antara keadilan sebagai prinsip dan hak konkret.
