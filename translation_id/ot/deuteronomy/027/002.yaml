  text: וְ/הָיָ֗ה בַּ/יּוֹם֮ אֲשֶׁ֣ר תַּעַבְר֣וּ אֶת הַ/יַּרְדֵּן֒ אֶל הָ/אָ֕רֶץ אֲשֶׁר יְהוָ֥ה אֱלֹהֶ֖י/ךָ נֹתֵ֣ן לָ֑/ךְ וַ/הֲקֵמֹתָ֤ לְ/ךָ֙ אֲבָנִ֣ים גְּדֹל֔וֹת וְ/שַׂדְתָּ֥ אֹתָ֖/ם בַּ/שִּֽׂיד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/002.yaml
  text: And on the day when you cross over the Jordan into the land that Yahweh your God is giving you[a], you shall set up for yourself large stones and plaster them with lime.
translation:
  language: id
  text: Pada hari ketika kamu menyeberangi Sungai Yordan menuju negeri yang sedang Yahweh, Allahmu, berikan kepadamu, tegakkanlah bagimu batu-batu besar dan lapisilah batu-batu itu dengan kapur[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan bahan plester”; kata Ibrani ini menunjuk pada kapur atau bahan plester yang digunakan sebagai pelapis.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה בַּיּוֹם
  choice: Pada hari ketika
  rationale: Ungkapan Ibrani ini memperkenalkan keadaan yang akan terjadi. Bentuk ini menyampaikan fungsi waktunya secara alami tanpa terjemahan harfiah yang kaku seperti “Dan akan terjadi pada hari itu”.
- source_word: תַּעַבְרוּ אֶת הַיַּרְדֵּן
  choice: kamu menyeberangi Sungai Yordan
  rationale: Kata kerja עבר dalam konteks ini berarti menyeberang dari satu sisi ke sisi lain. Dalam bahasa Indonesia, nama geografis ini paling jelas dan alami disebut “Sungai Yordan”.
- source_word: הָאָרֶץ
  choice: negeri
  rationale: Dalam konteks Ulangan, kata ini menunjuk pada wilayah yang diberikan kepada Israel. “Negeri” mempertahankan makna geografis-politisnya dan terdengar alami dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan sebuah gelar.
- source_word: נֹתֵן
  choice: sedang diberikan
  rationale: Partisipel Ibrani menggambarkan pemberian itu sebagai tindakan yang berlangsung dan pasti dari sudut pandang pembicara. Bentuk pasif dipakai agar susunan “negeri yang ... diberikan ... kepadamu” tetap alami dalam bahasa Indonesia.
- source_word: וַהֲקֵמֹתָ לְךָ
  choice: dirikanlah ... untukmu
  rationale: Bentuk kausatif קום berarti mendirikan atau menegakkan. Pronomina tunggal dipertahankan dengan “kamu/untukmu”, karena Israel disapa sebagai satu kesatuan, meskipun klausa sebelumnya memakai bentuk jamak.
- source_word: אֲבָנִים גְּדֹלוֹת
  choice: batu-batu besar
  rationale: Ini merupakan padanan langsung dan alami bagi bentuk jamak serta kata sifat Ibraninya.
- source_word: וְשַׂדְתָּ אֹתָם
  choice: lapisilah batu-batu itu
  rationale: Kata kerja ini mengacu pada tindakan melapisi permukaan batu. “Lapisilah” lebih alami daripada memakai verba serapan “plesterlah” dan menghindari ketidakjelasan pronomina “mereka” untuk benda mati.
- source_word: בַּשִּׂיד
  choice: dengan kapur
  rationale: שִׂיד menunjuk pada kapur atau bahan plester untuk pelapis. “Kapur” mempertahankan bahan yang dimaksud dan menghindari pengulangan “melapisi dengan pelapis”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. “Yahweh” mempertahankannya sebagai nama diri tanpa menggantinya dengan gelar.
- issue: Pergantian sapaan jamak ke tunggal
  choice: kamu/Allahmu/kepadamu/untukmu
  alternative: kalian/Allah kalian/kepada kalian/untuk kalian
  rationale: Teks Ibrani memakai bentuk jamak pada “kamu menyeberangi”, lalu beralih ke bentuk tunggal untuk menyapa Israel secara kolektif. Bahasa Indonesia “kamu” tidak menandai jumlah secara ketat, sehingga dapat mempertahankan ketegangan gramatikal itu tanpa memaksakan bentuk jamak.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada perintah yang khidmat tetapi mudah dipahami. Nama “Sungai Yordan” dibuat eksplisit demi kelaziman Indonesia. Penanda catatan kaki ditempatkan sesudah “kapur”, yaitu kata yang dijelaskan oleh catatan.
