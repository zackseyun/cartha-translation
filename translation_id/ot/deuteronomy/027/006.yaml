  source_fidelity: 'Makna pokok diterjemahkan dengan tepat: שְׁלֵמוֹת dipertahankan sebagai “utuh,” bukan secara interpretatif sebagai “tidak dipahat”; kedua tindakan direktif diteruskan; dan עוֹלֹת diterjemahkan sebagai “kurban-kurban bakaran.” Nama יהוה juga konsisten sebagai “Yahweh.” Namun, frasa “membangun mazbah ... dari batu-batu utuh” kurang langsung mencerminkan susunan dan hubungan instrumental dalam Ibrani serta dapat sesaat terdengar seolah batu-batu itu hanya bahan tambahan setelah objek mazbah. Susunan yang direvisi membuat batu-batu utuh secara jelas menjadi sarana pembangunan mazbah.'
