  terminology: “Mazbah,” “Yahweh,” “Allahmu,” dan “kurban-kurban bakaran” sesuai untuk register Alkitab dan setia pada istilah sumber. Catatan kaki dengan tepat membedakan arti leksikal “utuh/lengkap” dari alternatif kontekstual “tidak dipahat.”
