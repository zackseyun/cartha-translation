source:
  edition: WLC
  text: אֲבָנִ֤ים שְׁלֵמוֹת֙ תִּבְנֶ֔ה אֶת מִזְבַּ֖ח יְהוָ֣ה אֱלֹהֶ֑י/ךָ וְ/הַעֲלִ֤יתָ עָלָי/ו֙ עוֹלֹ֔ת לַ/יהוָ֖ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/006.yaml
  text: You shall build the altar of Yahweh your God with whole stones[a], and you shall offer burnt offerings on it to Yahweh your God.
translation:
  language: id
  text: Dengan batu-batu utuh, engkau harus membangun mazbah bagi Yahweh, Allahmu, dan di atasnya engkau harus mempersembahkan kurban-kurban bakaran kepada Yahweh, Allahmu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲבָנִים שְׁלֵמוֹת
  choice: batu-batu utuh
  rationale: Kata שְׁלֵמוֹת secara langsung berarti utuh atau lengkap. Pilihan ini mempertahankan arti leksikal Ibrani, sedangkan pengertian 'tidak dipahat' berasal dari petunjuk dalam ayat sebelumnya.
- source_word: תִּבְנֶה
  choice: Engkau harus membangun
  rationale: Bentuk imperfek dalam konteks perintah ini memiliki daya direktif. 'Engkau harus' terdengar wajar, tegas, dan khidmat dalam bahasa Indonesia modern.
- source_word: מִזְבַּח יְהוָה אֱלֹהֶיךָ
  choice: mazbah bagi Yahweh, Allahmu
  rationale: מִזְבַּח diterjemahkan dengan istilah baku 'mazbah'. Rangkaian nama ilahi dan pronomina diterjemahkan secara alami sebagai mazbah yang diperuntukkan bagi Yahweh, Allah Israel.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar, sehingga nama perjanjian dalam teks sumber tetap tampak.
- source_word: וְהַעֲלִיתָ עָלָיו
  choice: dan di atasnya engkau harus mempersembahkan
  rationale: Bentuk Hifil dari עלה dengan objek kurban bermakna mempersembahkan kurban. Susunan ini alami dalam bahasa Indonesia dan tetap menyatakan lokasi persembahan pada mazbah.
- source_word: עוֹלֹת
  choice: kurban-kurban bakaran
  rationale: עוֹלֹת adalah bentuk jamak dari istilah teknis bagi kurban yang dibakar seluruhnya. Bentuk ulang mempertahankan makna jamak eksplisit teks Ibrani.
- source_word: לַיהוָה אֱלֹהֶיךָ
  choice: kepada Yahweh, Allahmu
  rationale: Preposisi ל dalam konteks kurban menyatakan arah atau peruntukan persembahan; 'kepada' merupakan padanan Indonesia yang langsung dan alami.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama diri יהוה. 'Yahweh' mempertahankan nama ilahi tanpa menggantinya dengan gelar.
- issue: Apakah שְׁלֵמוֹת diterjemahkan secara langsung atau secara kontekstual
  choice: batu-batu utuh
  alternative: batu-batu yang tidak dipahat
  rationale: Adjektiva Ibrani itu sendiri berarti 'utuh/lengkap'. Larangan memakai perkakas besi pada ayat 5 mendukung pengertian kontekstual 'tidak dipahat', tetapi nuansa tersebut tidak dimasukkan diam-diam ke dalam teks utama.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan tunggal 'engkau' mempertahankan bentuk orang kedua maskulin tunggal dalam bahasa Ibrani. Istilah ritual 'mazbah' dan 'kurban bakaran' dipakai karena jelas dan lazim dalam konteks Alkitab.
