  to: Tuliskanlah pada batu-batu itu segala perkataan hukum ini[a] ketika engkau menyeberang, supaya engkau masuk ke negeri yang Yahweh, Allahmu, berikan kepadamu, negeri yang berlimpah susu dan madu, sebagaimana Yahweh, Allah nenek moyangmu[b], telah berfirman kepadamu.
  rationale: Revisi mengganti pasif 'diberikan' dengan klausa aktif 'yang Yahweh ... berikan kepadamu' agar pemberi dan daya perintah/pemberian yang pasti dalam sumber lebih jelas. Klausa akhir juga dirapikan menjadi bentuk aktif yang alami, sambil mempertahankan bahwa Yahweh telah berbicara kepada Israel melalui Musa. Catatan kaki dan penandanya tetap sesuai dengan kata yang dijelaskan.
