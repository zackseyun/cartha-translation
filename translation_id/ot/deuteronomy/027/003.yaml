source:
  edition: WLC
  text: וְ/כָתַבְתָּ֣ עֲלֵי/הֶ֗ן אֶֽת כָּל דִּבְרֵ֛י הַ/תּוֹרָ֥ה הַ/זֹּ֖את בְּ/עָבְרֶ֑/ךָ לְמַ֡עַן אֲשֶׁר֩ תָּבֹ֨א אֶל הָ/אָ֜רֶץ אֲֽשֶׁר יְהוָ֥ה אֱלֹהֶ֣י/ךָ נֹתֵ֣ן לְ/ךָ֗ אֶ֣רֶץ זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ כַּ/אֲשֶׁ֥ר דִּבֶּ֛ר יְהוָ֥ה אֱלֹהֵֽי אֲבֹתֶ֖י/ךָ לָֽ/ךְ־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/003.yaml
  text: And you shall write on them all the words of this law when you cross over[a], so that you may enter the land that Yahweh your God is giving you, a land flowing with milk and honey, just as Yahweh, the God of your fathers[b], spoke to you.
translation:
  language: id
  text: Tuliskanlah pada batu-batu itu segala perkataan hukum ini[a] ketika engkau menyeberang, supaya engkau masuk ke negeri yang Yahweh, Allahmu, berikan kepadamu, negeri yang berlimpah susu dan madu, sebagaimana Yahweh, Allah nenek moyangmu[b], telah berfirman kepadamu.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kata Ibrani torah juga dapat berarti “pengajaran” atau “petunjuk.” Dalam konteks perjanjian ini, “hukum” paling sesuai.
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “bapak-bapakmu,” yaitu para leluhur Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַבְתָּ עֲלֵיהֶן
  choice: Tuliskanlah pada batu-batu itu
  rationale: Bentuk verba berfungsi sebagai perintah dalam rangkaian petunjuk. Acuan pronomina dibuat eksplisit sebagai “batu-batu itu” berdasarkan ayat sebelumnya agar jelas dan alami dalam bahasa Indonesia.
- source_word: כָּל דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: segala perkataan hukum ini
  rationale: “Segala perkataan” mempertahankan דִּבְרֵי, sedangkan “hukum” sesuai dengan konteks perjanjian; keluasan makna תּוֹרָה dicatat dalam catatan kaki.
- source_word: בְּעָבְרֶךָ
  choice: ketika engkau menyeberang
  rationale: Preposisi dengan infinitif menyatakan waktu. “Menyeberang” mempertahankan konteks penyeberangan Sungai Yordan tanpa menambahkannya secara eksplisit.
- source_word: לְמַעַן אֲשֶׁר תָּבֹא
  choice: supaya engkau masuk
  rationale: Mempertahankan hubungan tujuan atau hasil dalam bahasa Ibrani tanpa mencoba menghilangkan ketegangan sintaksisnya.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: Yahweh, Allahmu
  rationale: Nama perjanjian יְהוָה ditransliterasikan “Yahweh”; aposisi dan sufiks milik diterjemahkan secara alami sebagai “Allahmu”.
- source_word: נֹתֵן לְךָ
  choice: diberikan ... kepadamu
  rationale: Partisipel menggambarkan pemberian negeri sebagai tindakan yang sedang berlangsung atau sudah pasti. Bentuk pasif Indonesia menjaga fokus pada negeri dan tetap menyatakan Yahweh sebagai pemberi.
- source_word: אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: negeri yang berlimpah susu dan madu
  rationale: Ungkapan ini menyatakan kelimpahan. “Berlimpah” terdengar alami dalam bahasa Indonesia sambil mempertahankan citra susu dan madu.
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: seperti yang telah dikatakan
  rationale: דִּבֶּר berarti “berkata/berfirman,” bukan secara eksplisit “berjanji.” Pilihan ini tidak menambahkan penafsiran yang hanya tersirat oleh konteks.
- source_word: אֱלֹהֵי אֲבֹתֶיךָ
  choice: Allah leluhurmu
  rationale: Dalam rumusan perjanjian ini, אֲבוֹת menunjuk kepada generasi pendahulu Israel. “Leluhur” alami dan tepat dalam bahasa Indonesia; bentuk harfiahnya dijelaskan dalam catatan kaki.
- source_word: לָךְ
  choice: kepadamu
  rationale: Walaupun bentuk tekstualnya tidak biasa, maknanya dalam konteks jelas sebagai orang kedua tunggal, yaitu Israel yang disapa melalui Musa.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks Ibrani memakai nama perjanjian secara langsung. “Yahweh” mempertahankan nama itu alih-alih menggantinya dengan gelar.
- issue: Makna תּוֹרָה dalam konteks perjanjian
  choice: hukum
  alternative: pengajaran atau petunjuk
  rationale: Konteksnya adalah ketentuan perjanjian yang harus dituliskan pada batu. “Hukum” sesuai di sini, sementara kemungkinan makna yang lebih luas dipertahankan dalam catatan kaki.
- issue: Penerjemahan אֲבֹתֶיךָ
  choice: leluhurmu
  alternative: bapak-bapakmu
  rationale: Dalam rumusan perjanjian, kata ini mengacu kepada para pendahulu Israel. Terjemahan utama yang idiomatis tidak meniadakan bentuk maskulin sumber karena bentuk harfiahnya dicatat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Engkau” dipakai untuk mempertahankan sapaan orang kedua tunggal kepada Israel sebagai satu umat. Tanda pisah menandai aposisi deskriptif tentang negeri tanpa mengubah hubungan sintaksis ayat.
