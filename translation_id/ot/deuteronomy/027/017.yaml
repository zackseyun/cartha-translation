  text: Cursed is the one who moves his neighbor’s boundary marker. And all the people shall say[a], “Amen.”
translation:
  language: id
  text: “Terkutuklah orang yang menggeser batas tanah sesamanya.” Dan seluruh rakyat akan berkata, “Amin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: Terkutuklah
  rationale: Bentuk ini menyampaikan rumusan kutuk perjanjian dengan tegas, wajar, dan bermartabat dalam bahasa Indonesia.
- source_word: מַסִּיג
  choice: orang yang menggeser
  rationale: Partisip Ibrani menunjuk kepada pelaku yang melakukan tindakan ini. 'Menggeser' mencakup pemindahan tanda untuk mengubah garis batas, bukan hanya menyingkirkannya.
- source_word: גְּבוּל
  choice: tanda batas tanah
  rationale: Dalam konteks hukum kepemilikan tanah, kata ini merujuk pada batas bidang tanah yang ditandai secara konkret. Ungkapan ini lebih jelas bagi pembaca modern daripada sekadar 'batas'.
- source_word: רֵעֵהוּ
  choice: sesamanya
  rationale: Kata ini menunjuk kepada orang lain dalam komunitas dalam konteks hubungan sosial dan hukum. 'Sesamanya' alami dan tidak mempersempit makna pada penghuni rumah yang berdekatan.
- source_word: וְאָמַר
  choice: Lalu ... harus berkata
  rationale: Bentuk verbal meneruskan formula liturgis-hukum dan menyatakan tanggapan yang diwajibkan dari umat. 'Harus berkata' menyampaikan daya normatifnya secara alami dalam bahasa Indonesia.
- source_word: כָּל הָעָם
  choice: seluruh umat
  rationale: Menerjemahkan keseluruhan komunitas yang hadir tanpa menambahkan 'Israel', yang tidak dinyatakan secara eksplisit dalam ayat ini.
- source_word: אָמֵן
  choice: Amin
  rationale: Bentuk liturgis yang telah mapan dalam bahasa Indonesia dan mempertahankan peneguhan komunal dari istilah Ibrani.
theological_decisions:
- issue: Rumusan kutuk dalam konteks hukum perjanjian
  choice: Terkutuklah orang yang menggeser tanda batas tanah sesamanya
  alternative: Terkutuklah orang yang memindahkan batas tanah sesamanya
  rationale: Terjemahan ini mempertahankan bobot hukum dan komunal dari kutuk terhadap penyerobotan tanah. 'Tanda batas tanah' memperjelas sarana konkret yang digeser untuk mengubah batas kepemilikan.
- issue: Partisip maskulin tunggal sebagai kasus hukum representatif
  choice: orang yang menggeser
  alternative: laki-laki yang menggeser
  rationale: Bahasa Ibrani memakai bentuk maskulin tunggal secara representatif. 'Orang yang' mempertahankan kasus tunggal tanpa menjadikan jenis kelamin biologis sebagai unsur makna yang tidak dituntut konteks.
- issue: Daya modal jawaban umat
  choice: harus berkata
  alternative: akan berkata
  rationale: Dalam rangkaian liturgis ini, bentuk Ibrani dapat dipahami sebagai tanggapan yang ditetapkan, bukan sekadar ramalan tentang tindakan mendatang. 'Harus berkata' mempertahankan fungsi perjanjian tersebut.
translation_notes:
  register: Bahasa Indonesia baku modern, jelas, dan khidmat. Struktur kutuk dibuat ringkas agar sesuai dengan formula liturgis. Tidak diperlukan catatan kaki karena 'tanda batas tanah' sudah mengungkapkan konteks leksikal secara langsung; karena itu tidak ada penanda catatan kaki dalam teks.
