  text: 'Pada hari itu Musa memerintahkan umat itu demikian:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: memerintahkan
  rationale: Kata kerja צוה menyatakan perintah yang berwenang; “memerintahkan” mempertahankan daya tersebut dan wajar dalam bahasa Indonesia.
- source_word: מֹשֶׁה
  choice: Musa
  rationale: Bentuk nama yang baku dan dikenal luas dalam bahasa Indonesia.
- source_word: אֶת הָעָם
  choice: umat itu
  rationale: עָם menunjuk secara kolektif kepada umat Israel yang telah disebut dalam konteks. “Umat itu” alami dalam konteks kitab suci dan tidak mengubahnya menjadi istilah politik seperti “bangsa”.
- source_word: בַּיּוֹם הַהוּא
  choice: Pada hari itu
  rationale: Mempertahankan penanda waktu secara eksplisit dengan susunan bahasa Indonesia yang alami.
- source_word: לֵאמֹר
  choice: 'demikian:'
  rationale: Infinitif ini memperkenalkan isi perintah yang menyusul. “Demikian:” menjalankan fungsi wacananya secara alami tanpa mempertahankan ungkapan “dengan berkata” yang kaku.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Tanda titik dua menandai bahwa isi perintah Musa berlanjut pada ayat berikutnya.
