  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ וְ/הַ/כֹּהֲנִ֣ים הַ/לְוִיִּ֔ם אֶ֥ל כָּל יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הַסְכֵּ֤ת וּ/שְׁמַע֙ יִשְׂרָאֵ֔ל הַ/יּ֤וֹם הַ/זֶּה֙ נִהְיֵ֣יתָֽ לְ/עָ֔ם לַ/יהוָ֖ה אֱלֹהֶֽי/ךָ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/009.yaml
  text: 'Then Moses and the Levitical priests spoke to all Israel[a], saying, “Be silent and listen[b], Israel: today you have become a people for Yahweh your God.”'
translation:
  language: id
  text: Lalu Musa dan para imam Lewi berkata kepada seluruh Israel, “Diamlah[a] dan dengarkanlah, hai Israel! Hari ini engkau telah menjadi umat bagi Yahweh[b], Allahmu.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “Perhatikanlah dan dengarkanlah.” Imperatif Ibrani ini dapat menekankan keheningan ataupun perhatian yang terpusat.
    reason: lexical_alternative
  - marker: b
    text: Atau “engkau telah menjadi umat milik Yahweh, Allahmu.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: Lalu ... berbicara
  rationale: Bentuk wayyiqtol melanjutkan alur narasi. “Lalu” menyatakan urutan secara wajar, sedangkan “berbicara” mempertahankan tindakan ujar dari דבר.
- source_word: הַכֹּהֲנִים הַלְוִיִּם
  choice: para imam Lewi
  rationale: Ungkapan ini menunjuk para imam yang diidentifikasi sebagai orang Lewi. “Para imam Lewi” ringkas, alami, dan tidak mengaburkan hubungan kedua nomina itu.
- source_word: כָּל יִשְׂרָאֵל
  choice: seluruh Israel
  rationale: Padanan ini mempertahankan Israel sebagai keseluruhan kolektif yang disapa.
- source_word: הַסְכֵּת
  choice: Diamlah
  rationale: Imperatif langka ini dalam konteksnya paling mungkin menyerukan keheningan agar orang memberi perhatian. Kemungkinan arti yang lebih umum, “perhatikanlah,” dicatat dalam catatan kaki.
- source_word: וּשְׁמַע
  choice: dan dengarkanlah
  rationale: “Dengarkanlah” menyampaikan imperatif untuk menerima perkataan dengan perhatian, bukan sekadar mendengar bunyi.
- source_word: הַיּוֹם הַזֶּה
  choice: Hari ini
  rationale: Padanan modern dan alami bagi ungkapan deiktis “hari ini/hari yang ini,” tanpa kehilangan penekanannya.
- source_word: נִהְיֵיתָ לְעָם
  choice: engkau telah menjadi umat
  rationale: Bentuk orang kedua tunggal menyapa Israel sebagai satu kesatuan. “Umat” lebih sesuai daripada “bangsa” karena menonjolkan identitas kolektif-perjanjian tanpa nuansa politis yang tidak perlu.
- source_word: לַיהוָה
  choice: bagi Yahweh
  rationale: Konstruksi היה + ל dapat menyatakan relasi atau kepemilikan. “Bagi Yahweh” mempertahankan bentuk relasional yang ringkas, sementara nuansa “milik Yahweh” disediakan dalam catatan kaki.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Akhiran orang kedua tunggal dipertahankan sesuai sapaan korporat tunggal kepada Israel.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. “Yahweh” mempertahankan nama diri tersebut dan tidak menggantinya dengan gelar.
- issue: Sapaan tunggal korporat kepada Israel
  choice: engkau telah menjadi umat
  alternative: kalian telah menjadi umat; Israel telah menjadi umat
  rationale: Bahasa Ibrani memakai bentuk orang kedua maskulin tunggal untuk menyapa Israel sebagai satu kesatuan. “Engkau” mempertahankan retorika korporat ini tanpa mengubahnya menjadi jamak atau orang ketiga.
- issue: Relasi umat dengan Yahweh dalam נִהְיֵיתָ לְעָם לַיהוָה
  choice: umat bagi Yahweh
  alternative: umat milik Yahweh
  rationale: Preposisi ל dapat menyatakan peruntukan maupun kepemilikan dalam konstruksi ini. Teks utama mempertahankan rumusan yang lebih terbuka, sedangkan nuansa kepemilikan dicatat sebagai alternatif.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. “Hai Israel” mempertahankan seruan langsung; “engkau” dipakai secara sengaja untuk mencerminkan sapaan korporat tunggal dalam bahasa Ibrani. Semua penanda catatan kaki ditempatkan pada bagian teks yang dijelaskannya.
