  text: אָר֕וּר שֹׁכֵ֖ב עִם חֹֽתַנְתּ֑/וֹ וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/023.yaml
  text: Cursed is he who lies with his mother-in-law. And all the people shall say[a], “Amen.”
translation:
  language: id
  text: “Terkutuklah orang yang tidur dengan ibu mertuanya[a].” Dan seluruh rakyat harus berkata, “Amin!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, secara lebih eksplisit, “berhubungan seksual dengan ibu mertuanya.” Bahasa Ibrani memakai ungkapan “tidur dengan.”
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Terkutuklah
  rationale: Bentuk ini menyampaikan rumusan kutuk perjanjian secara lugas, wajar, dan khidmat dalam bahasa Indonesia.
- source_word: שֹׁכֵב עִם
  choice: tidur dengan
  rationale: Dalam konteks ini ungkapan tersebut merupakan eufemisme lazim untuk hubungan seksual. Pilihan ini mempertahankan sifat eufemistis ungkapan Ibrani dan tetap mudah dipahami dalam bahasa Indonesia modern.
- source_word: חֹתַנְתּוֹ
  choice: ibu mertuanya
  rationale: Nomina ini berarti ‘ibu mertua’, sedangkan sufiksnya menyatakan kepunyaan orang ketiga tunggal.
- source_word: וְאָמַר
  choice: Dan ... harus berkata
  rationale: Bentuk verba ini melanjutkan rumusan liturgis yang bersifat wajib atau preskriptif; ‘harus berkata’ mengungkapkan daya tersebut dengan jelas.
- source_word: כָּל הָעָם
  choice: seluruh rakyat
  rationale: Menerjemahkan unsur ‘seluruh’ dan ‘rakyat’ tanpa menambahkan ‘Israel’, yang hanya tersirat oleh konteks.
- source_word: אָמֵן
  choice: Amin
  rationale: Transliterasi liturgis yang baku dan dipahami luas dalam bahasa Indonesia.
theological_decisions:
- issue: Eufemisme seksual dalam rumusan hukum
  choice: tidur dengan
  alternative: berhubungan seksual dengan
  rationale: Pilihan utama mempertahankan eufemisme sumber tanpa mengaburkan maknanya; alternatif yang lebih eksplisit dicantumkan dalam catatan kaki.
- issue: Subjek maskulin tunggal dalam bahasa Ibrani
  choice: orang yang
  alternative: laki-laki yang
  rationale: Bahasa Indonesia tidak menandai gender gramatikal pada partisipel. ‘Orang yang’ menerjemahkan fungsi substantival bentuk Ibrani secara alami tanpa menambahkan penegasan jenis kelamin yang tidak dinyatakan secara leksikal.
translation_notes:
  register: Bahasa Indonesia modern yang lugas dan khidmat. Rumusan ‘Terkutuklah’ serta jawaban ‘Amin’ mempertahankan corak hukum-liturgis ayat ini.
