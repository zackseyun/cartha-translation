  text: אָר֕וּר שֹׁכֵ֖ב עִם כָּל בְּהֵמָ֑ה וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/021.yaml
  text: Cursed is he who lies with any animal. And all the people shall say[a], ‘Amen.’
translation:
  language: id
  text: Terkutuklah laki-laki yang bersetubuh dengan binatang apa pun. Dan seluruh umat akan berkata, “Amin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: Terkutuklah
  rationale: Mempertahankan rumusan kutuk perjanjian yang khidmat dan deklaratif dalam bahasa Indonesia alami.
- source_word: שֹׁכֵב
  choice: laki-laki yang bersetubuh
  rationale: Partisipel maskulin tunggal dipakai secara substantival dan, dalam konteks hukum ini, mengandung arti seksual. Pilihan ini menyatakan maknanya secara jelas sambil mempertahankan subjek maskulin.
- source_word: עִם
  choice: dengan
  rationale: Padanan alami bagi preposisi dalam ungkapan seksual ini.
- source_word: כָּל בְּהֵמָה
  choice: binatang apa pun
  rationale: Menyampaikan cakupan distributif כָּל dan kategori umum בְּהֵמָה tanpa mempersempitnya menjadi ternak.
- source_word: וְאָמַר
  choice: Dan ... harus berkata
  rationale: Meneruskan urutan liturgis serta menyampaikan kewajiban respons umat secara alami dalam bahasa Indonesia.
- source_word: כָּל הָעָם
  choice: seluruh umat
  rationale: Menerjemahkan keseluruhan kelompok yang hadir dalam konteks upacara perjanjian tanpa menambahkan 'Israel' yang tidak tertulis pada ayat ini.
- source_word: אָמֵן
  choice: Amin
  rationale: Bentuk afirmasi liturgis yang lazim dan langsung dikenal dalam bahasa Indonesia.
theological_decisions:
- issue: Partisipel substantival maskulin dalam rumusan kutuk hukum
  choice: laki-laki yang bersetubuh
  alternative: siapa pun yang bersetubuh
  rationale: Bentuk Ibrani adalah maskulin tunggal dan konteks pelanggaran seksual ini membayangkan pelaku laki-laki. Terjemahan mempertahankan penandaan tersebut dan tidak menetralkannya.
- issue: Daya ujar respons umat
  choice: harus berkata
  alternative: akan berkata
  rationale: Dalam tata upacara perjanjian, bentuk ini bukan sekadar ramalan tentang tindakan mendatang, melainkan arahan liturgis yang wajib dilakukan.
translation_notes:
  register: Bahasa Indonesia baku, modern, jelas, dan khidmat. Ungkapan seksual diterjemahkan secara langsung karena padanan harfiah seperti 'berbaring dengan' dapat disalahpahami dalam bahasa Indonesia. Tidak diperlukan catatan kaki karena makna dan bentuk maskulin sudah dinyatakan dalam teks utama.
