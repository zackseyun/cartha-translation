revisions:
- from: Terkutuklah orang yang tidak menegakkan[a] perkataan-perkataan hukum Taurat ini dengan melaksanakannya. Seluruh umat harus berkata, “Amin.”
  to: Terkutuklah orang yang tidak menjunjung teguh perkataan hukum Taurat ini dengan melaksanakan semuanya. Lalu seluruh umat itu akan berkata, “Amin.”
  rationale: Revisi diperlukan demi kelaziman bahasa Indonesia dan kejelasan hubungan antara menjunjung teguh hukum serta melaksanakannya. Ambiguitas leksikal kata kerja Ibrani tetap tersedia dalam catatan kaki, sementara makna pokok—kutuk bagi orang yang gagal menopang hukum ini melalui ketaatan—tetap dipertahankan.
