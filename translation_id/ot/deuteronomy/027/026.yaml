  text: אָר֗וּר אֲשֶׁ֧ר לֹא יָקִ֛ים אֶת דִּבְרֵ֥י הַ/תּוֹרָֽה הַ/זֹּ֖את לַ/עֲשׂ֣וֹת אוֹתָ֑/ם וְ/אָמַ֥ר כָּל הָ/עָ֖ם אָמֵֽן־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/026.yaml
  text: Cursed is the one who does not uphold the words of this law by doing them. And all the people shall say[a], “Amen.”
translation:
  language: id
  text: Terkutuklah orang yang tidak menjunjung teguh perkataan hukum Taurat ini dengan melaksanakan semuanya. Lalu seluruh umat itu akan berkata, “Amin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: Terkutuklah
  rationale: Bentuk ini secara alami menyampaikan rumusan kutuk perjanjian dan mempertahankan daya deklaratif teks Ibrani.
- source_word: אֲשֶׁר
  choice: orang yang
  rationale: Ungkapan ini menyampaikan rujukan tunggal yang bersifat umum tanpa membatasi kutuk itu pada jenis kelamin tertentu.
- source_word: לֹא יָקִים
  choice: tidak menegakkan
  rationale: Bentuk hifil dari קום dapat berarti menegakkan, meneguhkan, atau mempertahankan keberlakuan. 'Menegakkan' mempertahankan unsur pengakuan terhadap daya ikat hukum dan, bersama frasa berikutnya, menghubungkannya dengan ketaatan nyata.
- source_word: דִּבְרֵי הַתּוֹרָה הַזֹּאת
  choice: perkataan-perkataan hukum Taurat ini
  rationale: Terjemahan ini mempertahankan bentuk jamak דִּבְרֵי dan menerjemahkan תּוֹרָה sesuai konteks hukum perjanjian dalam Kitab Ulangan.
- source_word: לַעֲשׂוֹת אֹתָם
  choice: dengan melaksanakannya
  rationale: Frasa ini menyatakan cara hukum itu ditegakkan, yakni melalui ketaatan dalam tindakan; bentuk -nya secara alami merujuk pada seluruh perkataan tersebut.
- source_word: וְאָמַר כָּל הָעָם
  choice: Seluruh umat harus berkata
  rationale: Dalam rangkaian liturgis-hukum ini, bentuk verba menyatakan tanggapan yang diwajibkan, bukan sekadar laporan tentang ucapan pada masa lampau.
- source_word: אָמֵן
  choice: Amin
  rationale: Istilah ini telah mapan dalam bahasa Indonesia dan mempertahankan fungsi liturgisnya sebagai peneguhan bersama.
theological_decisions:
- issue: Makna kewajiban perjanjian dalam יָקִים ... לַעֲשׂוֹת אֹתָם
  choice: Kutuk dikenakan kepada orang yang tidak menegakkan hukum melalui pelaksanaannya.
  alternative: Kutuk hanya dikenakan kepada orang yang tidak mengesahkan hukum secara lisan, atau secara lebih umum kepada orang yang tidak menaati hukum.
  rationale: Gabungan verba 'menegakkan' dengan frasa 'dengan melaksanakannya' menunjukkan bahwa yang dimaksud bukan sekadar pengesahan lisan, melainkan pemeliharaan daya ikat hukum melalui ketaatan nyata. Kedua unsur itu dipertahankan tanpa memasukkan rumusan teologis yang berasal dari luar ayat.
- issue: Cakupan umum אֲשֶׁר
  choice: orang yang
  alternative: siapa pun yang; laki-laki yang
  rationale: Klausa relatif Ibrani berbentuk tunggal dan bersifat representatif. 'Orang yang' menyampaikan cakupan umum secara wajar dalam bahasa Indonesia tanpa menambahkan pembatasan gender.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Rumusan 'Terkutuklah' serta jawaban 'Amin' mempertahankan suasana liturgis perjanjian. 'Menegakkan' dipilih untuk menjaga perbedaan antara pengakuan atas daya ikat hukum dan pelaksanaannya, sementara catatan kaki mempertahankan keluasan makna kata Ibrani.
