  text: וְ/אֵ֛לֶּה יַֽעַמְד֥וּ עַל הַ/קְּלָלָ֖ה בְּ/הַ֣ר עֵיבָ֑ל רְאוּבֵן֙ גָּ֣ד וְ/אָשֵׁ֔ר וּ/זְבוּלֻ֖ן דָּ֥ן וְ/נַפְתָּלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/013.yaml
  text: 'And these shall stand for the curse on Mount Ebal: Reuben[a], Gad, Asher, Zebulun, Dan, and Naphtali.'
translation:
  language: id
  text: 'Dan inilah yang harus berdiri di Gunung Ebal untuk mengutuk[a]: Ruben, Gad, Asyer, Zebulon, Dan, dan Naftali.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “untuk kutuk” atau “untuk mengucapkan kutuk.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: Dan mereka inilah
  rationale: Konjungsi dan demonstratif memperkenalkan kelompok yang dikontraskan dengan kelompok pada ayat sebelumnya. Bentuk ini alami dalam bahasa Indonesia dan tetap menegaskan orang-orang yang dimaksud.
- source_word: יַעַמְדוּ
  choice: harus berdiri
  rationale: Bentuk imperfek dalam rangkaian petunjuk Musa menyatakan tindakan yang diperintahkan untuk dilakukan kemudian. 'Harus berdiri' menyampaikan fungsi instruktifnya dengan jelas.
- source_word: עַל הַקְּלָלָה
  choice: untuk kutuk
  rationale: Frasa ini mengaitkan suku-suku tersebut dengan kutuk dalam upacara itu tanpa menambahkan kata kerja yang tidak dinyatakan secara eksplisit dalam bahasa Ibrani. Alternatif yang memperjelas tindakan dicantumkan dalam catatan kaki.
- source_word: בְּהַר עֵיבָל
  choice: di Gunung Ebal
  rationale: Preposisi בְ menyatakan lokasi; 'di Gunung Ebal' merupakan ungkapan lokasi yang wajar dalam bahasa Indonesia.
- source_word: רְאוּבֵן
  choice: Ruben
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab berbahasa Indonesia.
- source_word: גָּד
  choice: Gad
  rationale: Transliterasi nama suku yang lazim dalam bahasa Indonesia.
- source_word: אָשֵׁר
  choice: Asyer
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab berbahasa Indonesia.
- source_word: זְבוּלֻן
  choice: Zebulon
  rationale: Bentuk nama yang lazim dan mudah dikenali oleh pembaca Alkitab berbahasa Indonesia.
- source_word: דָּן
  choice: Dan
  rationale: Transliterasi nama suku yang lazim dalam bahasa Indonesia.
- source_word: נַפְתָּלִי
  choice: Naftali
  rationale: Bentuk nama yang lazim dalam tradisi Alkitab berbahasa Indonesia.
theological_decisions:
- issue: Fungsi ritual suku-suku dalam kaitannya dengan kutuk
  choice: untuk kutuk
  alternative: untuk menyatakan kutuk; untuk mengutuk
  rationale: Teks Ibrani tidak mengulangi kata kerja seperti 'mengucapkan' atau 'menyatakan'. Konteks ayat 12–13 menunjukkan peran seremonial yang berkaitan dengan berkat dan kutuk, tetapi terjemahan utama mempertahankan keringkasan dan keterbukaan ungkapan Ibrani.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Susunan kalimat dibuat jelas bagi pembaca umum, sementara ungkapan ringkas 'untuk kutuk' mempertahankan ambiguitas asli dan dijelaskan melalui catatan kaki.
