source:
  edition: WLC
  text: אֵ֠לֶּה יַֽעַמְד֞וּ לְ/בָרֵ֤ךְ אֶת הָ/עָם֙ עַל הַ֣ר גְּרִזִ֔ים בְּ/עָבְרְ/כֶ֖ם אֶת הַ/יַּרְדֵּ֑ן שִׁמְעוֹן֙ וְ/לֵוִ֣י וִֽ/יהוּדָ֔ה וְ/יִשָּׂשכָ֖ר וְ/יוֹסֵ֥ף וּ/בִנְיָמִֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/012.yaml
  text: 'These shall stand on Mount Gerizim to bless the people when you cross the Jordan: Simeon[a], Levi, Judah, Issachar, Joseph, and Benjamin.'
translation:
  language: id
  text: 'Inilah suku-suku yang harus berdiri di Gunung Gerizim untuk memberkati umat itu setelah kamu menyeberangi Sungai Yordan: Simeon, Lewi, Yehuda, Isakhar, Yusuf[a], dan Benyamin.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dalam daftar suku ini, Yusuf mewakili suku-suku keturunannya, yaitu Efraim dan Manasye.
    reason: cross_reference
lexical_decisions:
- source_word: אֵלֶּה
  choice: Inilah suku-suku
  rationale: Demonstratif jamak ini memperkenalkan daftar suku. Penambahan kata 'suku-suku' memperjelas acuan yang tersirat dari nama-nama berikut tanpa mengubah isinya.
- source_word: יַעַמְדוּ
  choice: harus berdiri
  rationale: Bentuk imperfek dalam konteks petunjuk upacara menyatakan kewajiban yang akan dilaksanakan; 'harus berdiri' alami dan mempertahankan daya preskriptifnya.
- source_word: לְבָרֵךְ אֶת הָעָם
  choice: untuk memberkati umat itu
  rationale: Infinitif dengan לְ menyatakan tujuan. 'Umat' sesuai untuk komunitas perjanjian Israel, sedangkan 'itu' mempertahankan kekhususan artikel Ibrani.
- source_word: עַל הַר גְּרִזִים
  choice: di Gunung Gerizim
  rationale: '''Di'' merupakan preposisi lokasi yang paling alami dalam bahasa Indonesia untuk keberadaan atau posisi di sebuah gunung.'
- source_word: בְּעָבְרְכֶם
  choice: setelah kamu menyeberangi
  rationale: בְּ dengan infinitif konstruk dan sufiks jamak orang kedua memberi hubungan waktu. Dalam urutan peristiwa ini, 'setelah' menyatakan bahwa penempatan berlangsung sesudah penyeberangan tanpa memperberat kalimat.
- source_word: אֶת הַיַּרְדֵּן
  choice: Sungai Yordan
  rationale: Nama ini mengacu pada sungai; penyebutan 'Sungai' memberi kejelasan alami bagi pembaca Indonesia.
- source_word: שִׁמְעוֹן וְלֵוִי וִיהוּדָה וְיִשָּׂשכָר וְיוֹסֵף וּבִנְיָמִן
  choice: Simeon, Lewi, Yehuda, Isakhar, Yusuf, dan Benyamin
  rationale: Menggunakan bentuk nama yang lazim dalam bahasa Indonesia dan mempertahankan urutan daftar Ibrani.
theological_decisions:
- issue: Daya instruksi mengenai posisi dan tugas suku-suku
  choice: harus berdiri ... untuk memberkati
  alternative: akan berdiri ... untuk memberkati
  rationale: Konteksnya adalah perintah Musa tentang upacara yang akan datang. 'Harus' mempertahankan sifat preskriptif, bukan sekadar ramalan.
- issue: Makna Yusuf dalam daftar suku
  choice: Yusuf dipertahankan dalam teks utama dan dijelaskan dalam catatan kaki
  alternative: suku-suku keturunan Yusuf / Efraim dan Manasye
  rationale: Teks Ibrani secara eksplisit menyebut Yusuf. Menggantinya dengan Efraim dan Manasye akan memasukkan penjelasan ke dalam teks utama.
- issue: Hubungan waktu dalam בְּעָבְרְכֶם
  choice: setelah kamu menyeberangi
  alternative: ketika kamu menyeberangi
  rationale: Konteks upacara di pegunungan sesudah masuk ke negeri mendukung urutan waktu ini, meski konstruksi Ibrani sendiri dapat diterjemahkan lebih umum sebagai 'ketika'.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Nama-nama mengikuti bentuk yang umum dalam Alkitab bahasa Indonesia. Struktur kalimat dibuat langsung dan mudah dipahami, dengan daya instruksi teks Ibrani tetap terpelihara.
