  source_fidelity: 'Makna pokok dan struktur hukum diterjemahkan dengan tepat: kutuk ditujukan kepada orang yang melakukan hubungan seksual dengan saudara perempuannya, yang dijelaskan sebagai anak perempuan ayahnya atau ibunya; tanggapan seluruh umat juga dipertahankan. Namun, "tidur dengan" dalam bahasa Indonesia modern dapat dipahami secara nonseksual, sehingga kurang cukup tegas untuk idiom Ibrani שֹׁכֵב עִם yang dalam konteks ini jelas berarti hubungan seksual.'
