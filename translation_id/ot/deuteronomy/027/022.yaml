  terminology: '"Terkutuklah," "saudara perempuannya," "seluruh umat," dan "Amin" sesuai. Istilah "berhubungan seksual dengan" dipilih untuk menyampaikan eufemisme Ibrani secara jelas tanpa mempersempit cakupan hubungan kekerabatan yang disebutkan.'
