base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/022.yaml
  text: Cursed is the one who lies with his sister[a], the daughter of his father or the daughter of his mother. And all the people shall say, “Amen.”
translation:
  language: id
  text: “Terkutuklah orang yang berhubungan seksual dengan saudara perempuannya, anak perempuan ayahnya atau anak perempuan ibunya.” Dan seluruh umat harus berkata, “Amin.”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָרוּר
  choice: Terkutuklah
  rationale: Menyampaikan rumusan kutuk perjanjian secara langsung dan wajar dalam bahasa Indonesia, dengan partikel -lah yang mempertahankan daya deklaratifnya.
- source_word: שֹׁכֵב עִם
  choice: tidur dengan
  rationale: Ungkapan Indonesia ini lazim dipahami sebagai hubungan seksual dan tetap mempertahankan bentuk ungkapan halus yang sepadan dengan idiom Ibrani.
- source_word: אֲחֹתוֹ
  choice: saudara perempuannya
  rationale: Padanan langsung bagi istilah kekerabatan dengan sufiks orang ketiga maskulin tunggal.
- source_word: בַּת אָבִיו
  choice: anak perempuan ayahnya
  rationale: Mempertahankan penjelasan aposisional dan formulasi hukum Ibrani secara transparan.
- source_word: אוֹ
  choice: atau
  rationale: Mempertahankan hubungan disjungtif antara garis keturunan ayah dan ibu.
- source_word: בַת אִמּוֹ
  choice: anak perempuan ibunya
  rationale: Mempertahankan kesejajaran eksplisit dengan frasa sebelumnya.
- source_word: וְאָמַר
  choice: Dan ... harus berkata
  rationale: Dalam rangkaian liturgis ini, bentuk tersebut menetapkan tanggapan umat; 'harus berkata' alami dalam bahasa Indonesia dan menyampaikan kewajiban komunal.
- source_word: כָּל הָעָם
  choice: seluruh umat
  rationale: '''Umat'' sesuai untuk kelompok Israel dalam konteks perjanjian dan ibadah tanpa menambahkan nama Israel yang tidak terdapat dalam teks.'
- source_word: אָמֵן
  choice: Amin
  rationale: Bentuk liturgis baku dalam bahasa Indonesia yang berasal dari istilah Ibrani tersebut.
theological_decisions:
- issue: Cakupan dan bentuk larangan inses
  choice: Menerjemahkan kutuk atas orang yang berhubungan seksual dengan saudara perempuannya, lalu mempertahankan penjelasan berdasarkan garis ayah atau ibu.
  alternative: Membatasi larangan hanya pada saudara tiri, atau memperluasnya dengan parafrasa menjadi setiap kerabat perempuan dekat.
  rationale: Teks mendefinisikan 'saudara perempuan' melalui keturunan dari ayah atau ibu. Terjemahan mempertahankan rumusan itu tanpa mempersempit atau memperluas cakupannya.
- issue: Pelaku maskulin generik
  choice: orang yang ... saudara perempuannya
  alternative: laki-laki yang ... saudara perempuannya
  rationale: Partisipel Ibrani berbentuk maskulin tunggal dalam rumusan hukum. 'Orang yang' berfungsi alami sebagai subjek hukum generik, sementara hubungan kekerabatannya tetap tersurat.
translation_notes:
  register: Bahasa Indonesia modern, baku, khidmat, dan mudah dipahami. Struktur paralel 'anak perempuan ayahnya atau anak perempuan ibunya' dipertahankan karena merupakan bagian penting dari formulasi hukum sumber.
