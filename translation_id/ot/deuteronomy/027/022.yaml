  to: “Terkutuklah orang yang berhubungan seksual dengan saudara perempuannya, anak perempuan ayahnya atau anak perempuan ibunya.” Dan seluruh umat harus berkata, “Amin.”
  rationale: Revisi hanya mengganti "tidur dengan" dengan "berhubungan seksual dengan" agar makna idiom Ibrani jelas bagi pembaca Indonesia modern. Rumusan kekerabatan yang paralel, cakupan generik subjek, bentuk kutuk, dan respons liturgis tetap dipertahankan.
