translation_notes:
  register: Bahasa Indonesia modern, formal, dan mudah dipahami. 'Tuliskanlah' memberi daya perintah yang wajar; 'batu-batu itu' menjaga rujukan kontekstual; dan 'dengan sejelas-jelasnya' mempertahankan penekanan teks Ibrani beserta ambiguitas antara tulisan yang mudah dibaca dan isi yang dibuat jelas.
