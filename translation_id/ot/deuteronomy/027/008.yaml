  terminology: '"Hukum" merupakan padanan yang mapan dan sesuai konteks bagi תּוֹרָה dalam Ulangan. "Perkataan" mempertahankan bentuk verbal "kata-kata" dari sumber tanpa mengubahnya menjadi parafrasa seperti "isi". Catatan kaki memberi alternatif leksikal yang relevan dan tidak memaksakan penafsiran teologis.'
