  source_fidelity: 'Terjemahan dengan setia mencerminkan unsur-unsur utama Ibrani: perintah orang kedua tunggal ("Tuliskanlah"), lokasi pada batu-batu tertentu yang telah disebut ("pada batu-batu itu"), cakupan menyeluruh ("segala perkataan"), demonstratif pada "hukum ini", dan penegasan cara penulisan dalam בַּאֵר הֵיטֵב ("dengan sejelas-jelasnya"). Frasa terakhir secara tepat tidak membatasi makna hanya pada keterbacaan visual atau hanya pada penjelasan makna.'
