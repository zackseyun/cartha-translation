  yaml_path: translation/ot/deuteronomy/027/008.yaml
  text: And you shall write on the stones all the words of this law very clearly[a].
translation:
  language: id
  text: Tuliskanlah pada batu-batu itu segala perkataan hukum ini dengan sejelas-jelasnya.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “dengan terang” atau “sedemikian rupa sehingga menjadi jelas.” Ungkapan Ibrani ini menggabungkan kata kerja yang berarti “membuat jelas/menjelaskan” dengan kata penguat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַבְתָּ
  choice: Tuliskanlah
  rationale: Bentuk Qal perfektum orang kedua tunggal dengan waw dalam rangkaian perintah diterjemahkan sebagai imperatif bahasa Indonesia yang alami; akhiran -lah mempertahankan nada instruktif yang tegas dan bermartabat.
- source_word: עַל הָאֲבָנִים
  choice: pada batu-batu itu
  rationale: Preposisi עַל berarti 'pada/di atas'. Artikel pada 'batu-batu' merujuk kepada batu-batu tertentu yang telah disebut dalam konteks, sehingga 'itu' tepat dalam bahasa Indonesia.
- source_word: אֵת כָּל דִּבְרֵי
  choice: segala perkataan
  rationale: Frasa כָּל דִּבְרֵי secara langsung menyatakan keseluruhan kata-kata atau isi verbal. 'Segala perkataan' menjaga tekstur formal sumber tanpa mempersempitnya menjadi satuan kata individual.
- source_word: הַתּוֹרָה הַזֹּאת
  choice: hukum ini
  rationale: Dalam konteks perjanjian dan ketetapan-ketetapan Ulangan, תּוֹרָה secara alami diterjemahkan 'hukum'; demonstratif הַזֹּאת dipertahankan sebagai 'ini'.
- source_word: בַּאֵר הֵיטֵב
  choice: dengan sejelas-jelasnya
  rationale: בַּאֵר menyampaikan gagasan membuat jelas atau menerangkan, sedangkan הֵיטֵב menguatkannya. Ungkapan Indonesia ini mempertahankan intensitas dan cocok dengan tindakan menuliskan teks agar tersaji secara jelas, tanpa menentukan apakah kejelasan yang dimaksud terutama keterbacaan atau penjelasan makna.
