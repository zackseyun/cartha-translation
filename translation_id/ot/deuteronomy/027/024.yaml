base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/027/024.yaml
  text: Cursed is the one who strikes down his neighbor in secret. And all the people shall say[a], “Amen.”
translation:
  language: id
  text: “Terkutuklah orang yang memukul sesamanya secara sembunyi-sembunyi.[a]” Dan seluruh bangsa itu harus menjawab, “Amin.”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "menyerang" atau "membunuh"; kata kerja Ibrani yang dipakai dapat mencakup tindakan dari memukul hingga kekerasan yang mematikan.
    reason: lexical_alternative
lexical_decisions:
- source_word: אָרוּר
  choice: Terkutuklah
  rationale: Bentuk ini menyampaikan rumusan kutuk perjanjian secara wajar dan khidmat dalam bahasa Indonesia.
- source_word: מַכֵּה
  choice: memukul jatuh
  rationale: Verba נכה dapat menunjuk pada pukulan yang mencederai hingga kekerasan mematikan. 'Memukul jatuh' mempertahankan bobot kekerasannya tanpa membatasi makna hanya pada pembunuhan.
- source_word: רֵעֵהוּ
  choice: sesamanya
  rationale: רֵעַ menunjuk kepada orang lain dalam lingkup persekutuan atau komunitas; 'sesamanya' alami dan tidak mempersempitnya menjadi tetangga tempat tinggal.
- source_word: בַּסָּתֶר
  choice: dengan sembunyi-sembunyi
  rationale: Ungkapan ini menyatakan tindakan yang dilakukan secara tersembunyi dari pandangan orang.
- source_word: וְאָמַר
  choice: Dan ... harus berkata
  rationale: Dalam urutan upacara ini, bentuk tersebut berfungsi sebagai tanggapan yang ditetapkan bagi umat, sehingga 'harus berkata' menyampaikan daya proseduralnya dengan jelas.
- source_word: כָּל הָעָם
  choice: seluruh umat
  rationale: Dalam konteks perhimpunan perjanjian Israel, 'umat' lebih alami daripada 'rakyat' dan tetap mewakili keseluruhan kelompok tanpa menambahkan 'Israel' yang tidak disebut eksplisit dalam ayat.
- source_word: אָמֵן
  choice: Amin
  rationale: Transliterasi liturgis yang mapan dalam bahasa Indonesia dan mempertahankan fungsi jawaban pengesahan.
theological_decisions:
- issue: Derajat kekerasan dalam מַכֵּה
  choice: memukul jatuh
  alternative: memukul; membunuh
  rationale: Kata Ibrani נכה mencakup rentang dari memukul sampai kekerasan yang mematikan. Konteks kutuk menuntut ungkapan yang berbobot, tetapi teks tidak mengharuskan arti khusus 'membunuh'; karena itu ambiguitas tersebut dipertahankan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat dengan irama liturgis. Partikel -lah mempertahankan corak pengumuman kutuk, sedangkan 'Amin!' menjadi jawaban resmi seluruh umat.
