  text: And the Levites shall answer and say to every man of Israel with a loud voice:[a]
translation:
  language: id
  text: Orang-orang Lewi harus menjawab dan berkata kepada setiap orang Israel dengan suara lantang:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kepada setiap orang Israel.” Bahasa Ibrani memakai bentuk tunggal maskulin dengan daya representatif bagi umat Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָנוּ
  choice: harus menyahut
  rationale: Kata ענה dalam rangkaian ini menandai tanggapan lisan yang resmi. “Menyahut” mempertahankan unsur respons, sedangkan “harus” menyampaikan fungsi instruksional bentuk Ibrani dalam konteks ini.
- source_word: הַלְוִיִּם
  choice: orang-orang Lewi
  rationale: Teks secara khusus menyebut kaum Lewi, bukan para imam. Bentuk ini wajar dalam bahasa Indonesia dan tetap tepat secara leksikal.
- source_word: וְאָמְרוּ
  choice: dan berkata
  rationale: Terjemahan ini mempertahankan verba kedua dalam rumusan Ibrani “menyahut dan berkata”, tanpa meleburkannya menjadi satu tindakan.
- source_word: אֶל כָּל אִישׁ יִשְׂרָאֵל
  choice: kepada setiap orang Israel
  rationale: Ungkapan ini mempertahankan bentuk tunggal representatif אִישׁ serta sebutan “Israel”, tanpa mempersempitnya menjadi hanya laki-laki jamak atau menghaluskannya secara diam-diam.
- source_word: קוֹל רָם
  choice: dengan suara lantang
  rationale: Ini merupakan padanan alami dan bermartabat bagi ungkapan Ibrani tentang proklamasi yang keras dan dapat didengar seluruh umat.
theological_decisions:
- issue: Bahasa maskulin representatif dalam אִישׁ
  choice: kepada setiap orang Israel
  alternative: 'kepada setiap orang Israel / kepada setiap orang Israel sebagai anggota umat (makna representatif); atau: kepada setiap orang Israel secara kolektif'
  rationale: Kata אִישׁ berbentuk tunggal maskulin, tetapi dalam susunan “setiap orang Israel” berdaya representatif bagi anggota perhimpunan perjanjian. Terjemahan mempertahankan bentuk sumber tanpa menyatakan bahwa sapaan itu hanya berlaku bagi laki-laki.
translation_notes:
  register: Bahasa Indonesia modern, lugas, dan khidmat. “Menyahut dan berkata” sengaja mempertahankan dua verba sumber serta nuansa tanggapan resmi; “suara lantang” cocok untuk proklamasi publik.
