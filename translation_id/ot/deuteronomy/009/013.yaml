  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֵלַ֣/י לֵ/אמֹ֑ר רָאִ֨יתִי֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה וְ/הִנֵּ֥ה עַם קְשֵׁה עֹ֖רֶף הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/013.yaml
  text: Then Yahweh said to me[a], saying, ‘I have seen this people, and behold, it is a stiff-necked people.’
translation:
  language: id
  text: Kemudian Yahweh berfirman kepadaku, “Aku telah melihat bangsa ini, dan sesungguhnya bangsa ini adalah bangsa yang tegar tengkuk.”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Aku melihat bangsa ini, dan sesungguhnya bangsa ini adalah bangsa yang tegar tengkuk.”'
    reason: Bentuk perfektif רָאִיתִי dapat diterjemahkan “Aku melihat” tanpa penanda aspek “telah”.
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: Kemudian ... berfirman
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi. “Kemudian” menyatakan perkembangan peristiwa secara alami, sedangkan “berfirman” merupakan pilihan Indonesia yang wajar dan bermartabat ketika Allah menjadi subjek pembicaraan.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar seperti “TUHAN”.
- source_word: אֵלַי
  choice: kepadaku
  rationale: Mencerminkan preposisi arah dengan sufiks orang pertama tunggal secara langsung dan alami.
- source_word: לֵאמֹר
  choice: tidak diterjemahkan secara terpisah
  rationale: Rumus Ibrani pembuka kutipan ini sudah terwakili oleh “berfirman kepadaku” yang langsung diikuti ujaran. Menambahkan “demikian” atau “kata-Nya” akan terasa berulang dalam bahasa Indonesia modern.
- source_word: רָאִיתִי
  choice: Aku telah melihat
  rationale: Bentuk perfektif dapat menyatakan pengamatan yang telah dilakukan dan menjadi dasar penilaian Yahweh. “Telah melihat” mempertahankan nuansa itu, sementara “Aku melihat” tetap mungkin dan dicatat dalam catatan kaki.
- source_word: הָעָם הַזֶּה
  choice: bangsa ini
  rationale: עַם menunjuk kelompok umat sebagai satu kesatuan. “Bangsa ini” alami dalam bahasa Indonesia dan mempertahankan bentuk kolektif tunggal.
- source_word: וְהִנֵּה
  choice: dan sungguh
  rationale: הִנֵּה menyoroti dengan tegas penilaian yang mengikutinya. “Sungguh” mempertahankan daya penegasan dalam ragam Indonesia yang bermartabat tanpa memakai seruan yang terasa kaku.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: bangsa yang tegar tengkuk
  rationale: Ungkapan ini secara harfiah menggambarkan tengkuk yang keras atau kaku dan secara idiomatis menyatakan sikap keras kepala serta pembangkangan. “Tegar tengkuk” mempertahankan metafora Ibrani dan gema alkitabiahnya.
- source_word: הוּא
  choice: bangsa ini adalah
  rationale: Pronomina tunggal kembali kepada עַם sebagai kata benda kolektif. Pengulangan “bangsa ini” menghindari pronomina Indonesia yang canggung sekaligus mempertahankan kesesuaian tunggal.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks sumber memakai Tetragramaton sebagai nama diri. “Yahweh” mempertahankan nama perjanjian tersebut alih-alih menggantinya dengan gelar; “Yehuwa” merupakan bentuk tradisional alternatif, tetapi kurang langsung mencerminkan rekonstruksi pelafalan nama Ibrani.
- issue: Gambaran עַם קְשֵׁה עֹרֶף
  choice: bangsa yang tegar tengkuk
  alternative: bangsa yang keras kepala
  rationale: Pilihan utama mempertahankan metafora tubuh dalam teks dan tidak mereduksinya hanya menjadi sifat psikologis. Maknanya mencakup kekerasan hati, ketidaktaatan, dan pembangkangan tanpa menentukan satu nuansa saja.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Susunan kalimat dibuat alami tanpa menghilangkan metafora Ibrani “tegar tengkuk”. Nama Yahweh dipertahankan sebagai nama diri, dan rumus לֵאמֹר tidak diterjemahkan secara mekanis karena kutipan langsung sudah menandai isi firman.
