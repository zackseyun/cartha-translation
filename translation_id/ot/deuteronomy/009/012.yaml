  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֵלַ֗/י ק֣וּם רֵ֤ד מַהֵר֙ מִ/זֶּ֔ה כִּ֚י שִׁחֵ֣ת עַמְּ/ךָ֔ אֲשֶׁ֥ר הוֹצֵ֖אתָ מִ/מִּצְרָ֑יִם סָ֣רוּ מַהֵ֗ר מִן הַ/דֶּ֨רֶךְ֙ אֲשֶׁ֣ר צִוִּיתִ֔/ם עָשׂ֥וּ לָ/הֶ֖ם מַסֵּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/012.yaml
  text: And Yahweh said to me[a], 'Arise, go down quickly from here, because your people, whom you brought out from Egypt, have corrupted themselves. They have quickly turned aside from the way that I commanded them; they have made for themselves a cast image.'
translation:
  language: id
  text: Lalu Yahweh berfirman kepadaku, “Bangunlah, cepatlah turun dari sini, sebab bangsamu, yang kaubawa keluar dari Mesir, telah bertindak bejat. Mereka dengan cepat menyimpang dari jalan yang Kuperintahkan kepada mereka; mereka telah membuat bagi diri mereka sebuah patung tuangan[a].”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “patung leburan”. Istilah Ibrani ini menunjuk pada patung yang dibentuk dengan menuang logam cair ke dalam cetakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mempertahankan nama ilahi sebagai nama perjanjian, bukan menggantinya dengan gelar.
- source_word: קוּם רֵד מַהֵר מִזֶּה
  choice: Bangunlah, cepatlah turun dari sini
  rationale: Menyampaikan rangkaian perintah yang mendadak dan mendesak serta mempertahankan arah gerak dan penunjuk tempat dalam bahasa Indonesia yang wajar.
- source_word: שִׁחֵת
  choice: telah berlaku bejat
  rationale: Mengungkapkan kerusakan moral dan kemurtadan yang dimaksud verba Ibrani tanpa membatasi maknanya pada kerusakan fisik.
- source_word: עַמְּךָ
  choice: bangsamu
  rationale: Bentuk posesif ini alami dalam bahasa Indonesia dan mempertahankan nada teguran serta pengambilan jarak dalam perkataan Yahweh kepada Musa.
- source_word: הוֹצֵאתָ מִמִּצְרָיִם
  choice: yang kaubawa keluar dari Mesir
  rationale: Mempertahankan bentuk kausatif verba dan rujukan langsung kepada keluaran dari Mesir.
- source_word: סָרוּ מַהֵר מִן הַדֶּרֶךְ
  choice: Mereka cepat menyimpang dari jalan
  rationale: Mempertahankan pengulangan gagasan kecepatan dan metafora penyimpangan dari jalan yang ditetapkan.
- source_word: אֲשֶׁר צִוִּיתִם
  choice: yang Kuperintahkan kepada mereka
  rationale: Menyampaikan bahwa jalan itu merupakan ketetapan ilahi bagi umat, dengan susunan yang alami dalam bahasa Indonesia.
- source_word: מַסֵּכָה
  choice: patung tuangan
  rationale: Menunjukkan bahwa benda itu adalah patung yang dibuat dengan menuang logam, bukan sekadar menyebutnya secara umum sebagai berhala.
theological_decisions:
- issue: Pengambilan jarak retoris dalam ungkapan “bangsamu, yang kaubawa keluar dari Mesir”
  choice: Ungkapan posesif dan rujukan kepada tindakan Musa dipertahankan secara langsung.
  alternative: Melunakkan menjadi “umat-Ku” atau “bangsa yang Kubawa keluar”.
  rationale: Bentuk Ibrani merupakan teguran tajam kepada Musa dan mengandung ketegangan retoris yang tidak boleh dihapus.
- issue: Makna istilah penyembahan berhala מַסֵּכָה
  choice: patung tuangan
  alternative: berhala; patung leburan
  rationale: Teks menekankan bentuk konkret dan cara pembuatan patung itu. “Patung tuangan” mempertahankan informasi tersebut tanpa menambahkan penafsiran denominasi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan ilahi memakai bentuk terikat berhuruf kapital (“Kuperintahkan”), sedangkan “kaubawa” mengikuti ejaan baku. Pengulangan unsur kecepatan dan nada teguran langsung dipertahankan.
