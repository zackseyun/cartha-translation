id: DEU.9.20
reference: Deuteronomy 9:20
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּֽ/בְ/אַהֲרֹ֗ן הִתְאַנַּ֧ף יְהוָ֛ה מְאֹ֖ד לְ/הַשְׁמִיד֑/וֹ וָֽ/אֶתְפַּלֵּ֛ל גַּם בְּעַ֥ד אַהֲרֹ֖ן בָּ/עֵ֥ת הַ/הִֽוא־
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/020.yaml
  text: And Yahweh was very angry with Aaron[a], to destroy him; and I also prayed for Aaron at that time.
translation:
  language: id
  text: Yahweh sangat murka kepada Harun[a] dan hendak membinasakannya. Pada waktu itu aku juga berdoa bagi Harun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “terhadap Harun”; preposisi Ibraninya dapat diungkapkan dengan kedua cara dalam konteks ini.
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאַהֲרֹן
  choice: kepada Harun
  rationale: Dengan verba yang menyatakan kemarahan, בְ secara idiomatis menandai orang yang menjadi sasaran kemarahan. Dalam bahasa Indonesia, “murka kepada Harun” terdengar alami; “terhadap Harun” tetap mungkin.
- source_word: הִתְאַנַּף ... מְאֹד
  choice: sangat murka
  rationale: Bentuk Hitpael dari אנף menyatakan kemarahan yang kuat, dan מְאֹד mempertegas intensitasnya. “Sangat murka” mempertahankan kedua unsur itu dalam ragam yang dignified dan jelas.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה dialihaksarakan sebagai “Yahweh”, bukan diganti dengan suatu gelar.
- source_word: לְהַשְׁמִידוֹ
  choice: dan hendak membinasakannya
  rationale: Infinitif berawalan לְ dapat menyatakan maksud atau akibat yang dituju. “Hendak membinasakannya” alami dalam bahasa Indonesia dan mempertahankan beratnya ancaman tanpa menentukan cara pembinasaan.
- source_word: וָאֶתְפַּלֵּל
  choice: aku juga berdoa
  rationale: Hitpael פלל lazim berarti “berdoa”. Konteks dan frasa בְּעַד menunjukkan bahwa doa itu merupakan permohonan demi Harun, sehingga tidak perlu mempersempit verba menjadi “menjadi perantara”.
- source_word: גַּם בְּעַד אַהֲרֹן
  choice: juga berdoa bagi Harun
  rationale: גַּם menambahkan Harun kepada pihak yang telah didoakan Musa, sedangkan בְּעַד dalam konteks doa berarti “bagi” atau “demi”.
- source_word: בָּעֵת הַהִוא
  choice: Pada waktu itu
  rationale: Ungkapan waktu ini secara langsung menunjuk kembali kepada peristiwa yang sedang diceritakan.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai nama diri perjanjian יהוה. “Yahweh” mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Sifat maksud ilahi dalam לְהַשְׁמִידוֹ
  choice: hendak membinasakannya
  alternative: untuk membinasakannya
  rationale: Pilihan ini menyampaikan bahwa pembinasaan Harun merupakan tindakan yang dituju dalam konteks kemurkaan, tanpa menambahkan penjelasan teologis tentang ketetapan atau perubahan maksud ilahi.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. “Murka” dipilih sebagai padanan alami untuk kemarahan ilahi yang sangat kuat; struktur dua kalimat menghindari rangkaian klausa yang kaku sambil mempertahankan urutan gagasan Ibrani.
