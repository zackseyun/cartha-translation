  naturalness: Versi revisi memakai “bertubuh tinggi” untuk kejelasan dalam bahasa Indonesia modern dan mempertahankan gaya yang baku serta bermartabat. “Tentangnya kamu telah mendengar” secara alami menghubungkan kelompok itu dengan ucapan retoris berikutnya tanpa menambahkan pelaku ujaran.
  terminology: '“Keturunan Anak” adalah padanan yang wajar bagi בני ענק dan mempertahankan Anak sebagai nama diri. Catatan kaki diperbaiki agar alternatif etnonimnya alami dalam bahasa Indonesia: “kaum Anak.”'
