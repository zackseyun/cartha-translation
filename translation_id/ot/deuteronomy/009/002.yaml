base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/002.yaml
  text: 'a great and tall people[a], the sons of Anak, whom you know, and of whom you have heard: ‘Who can stand before the sons of Anak?’'
translation:
  language: id
  text: 'suatu bangsa yang besar dan bertubuh tinggi, keturunan Anak,[a] yang kamu kenal dan tentangnya kamu telah mendengar: ‘Siapakah yang dapat bertahan menghadapi keturunan Anak?’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “anak-anak Anak”; dapat juga diterjemahkan “kaum Anak.”'
    reason: lexical_alternative
lexical_decisions:
- source_word: עַם
  choice: bangsa
  rationale: Dalam konteks ini עַם menunjuk pada suatu kelompok etnis yang mendiami negeri; “bangsa” alami dalam bahasa Indonesia dan sesuai dengan konteks kolektif.
- source_word: גָּדוֹל
  choice: besar
  rationale: גָּדוֹל dapat menyatakan kebesaran atau ukuran; “besar” mempertahankan keluasan makna itu dan, bersama “tinggi,” menegaskan kegagahan kelompok tersebut.
- source_word: וָרָם
  choice: tinggi
  rationale: Di sini רָם menggambarkan perawakan fisik, bukan kedudukan; “tinggi” menyampaikan makna tersebut secara langsung.
- source_word: בְּנֵי עֲנָקִים / בְּנֵי עֲנָק
  choice: keturunan Anak
  rationale: Ungkapan harfiahnya “anak-anak Anak,” tetapi dalam bahasa Indonesia modern “keturunan Anak” secara alami menyatakan hubungan leluhur sekaligus sebutan kelompok.
- source_word: אֲשֶׁר אַתָּה יָדַעְתָּ
  choice: yang kamu kenal
  rationale: Bentuk perfek menyatakan bahwa kelompok itu sudah diketahui oleh Israel; “yang kamu kenal” mempertahankan bentuk langsung dan ringkas.
- source_word: וְאַתָּה שָׁמַעְתָּ
  choice: yang tentangnya telah kamu dengar orang berkata
  rationale: Teks Ibrani secara harfiah berbunyi “dan kamu telah mendengar,” lalu diikuti ucapan langsung. Tambahan idiomatis “orang berkata” menjelaskan bahwa yang didengar ialah ungkapan yang menyusul tanpa mengubah isinya.
- source_word: מִי יִתְיַצֵּב לִפְנֵי
  choice: Siapakah yang dapat bertahan menghadapi
  rationale: Dalam konteks permusuhan, idiom ini berarti mampu tetap berdiri atau melawan di hadapan pihak lain. “Bertahan menghadapi” menyampaikan daya retoris dan makna konfrontatifnya secara alami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Sapaan tunggal “kamu” dipertahankan karena bentuk Ibrani אַתָּה tunggal, yakni Israel yang disapa sebagai satu kesatuan. Istilah “keturunan Anak” dipilih agar ungkapan silsilah dapat dipahami secara alami.
