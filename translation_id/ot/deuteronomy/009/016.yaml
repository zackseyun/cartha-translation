  text: וָ/אֵ֗רֶא וְ/הִנֵּ֤ה חֲטָאתֶם֙ לַ/יהוָ֣ה אֱלֹֽהֵי/כֶ֔ם עֲשִׂיתֶ֣ם לָ/כֶ֔ם עֵ֖גֶל מַסֵּכָ֑ה סַרְתֶּ֣ם מַהֵ֔ר מִן הַ/דֶּ֕רֶךְ אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/016.yaml
  text: 'And I looked[a], and behold, you had sinned against Yahweh your God: you had made for yourselves a cast-metal calf. You had turned aside quickly from the way that Yahweh had commanded you.'
translation:
  language: id
  text: 'Aku melihat, dan ternyata kalian telah berdosa terhadap Yahweh, Allah kalian: kalian telah membuat bagi diri kalian patung anak sapi hasil tuangan.[a] Kalian begitu cepat menyimpang dari jalan yang telah Yahweh perintahkan kepada kalian.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan “anak sapi tuangan.” Frasa Ibraninya menunjuk patung anak sapi yang dibuat dengan menuang logam cair ke dalam cetakan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵרֶא וְהִנֵּה
  choice: Aku melihat, dan tampaklah
  rationale: ראה berarti 'melihat', sedangkan הִנֵּה menarik perhatian pada hal yang diamati. Gabungan ini mempertahankan urutan naratif dan daya penunjuk tanpa memakai bentuk arkais 'lihatlah' setelah orang pertama.
- source_word: חֲטָאתֶם לַיהוָה אֱלֹהֵיכֶם
  choice: kamu telah berdosa terhadap Yahweh, Allahmu
  rationale: Bentuk qatal dipahami secara retrospektif dalam penuturan Musa. Preposisi ל dengan חטא di sini secara idiomatis menyatakan dosa terhadap pihak tertentu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi dipertahankan sebagai nama diri, bukan diganti dengan gelar.
- source_word: עֲשִׂיתֶם לָכֶם
  choice: kamu telah membuat bagi dirimu
  rationale: לָכֶם menyatakan penerima atau kepentingan diri. Bahasa Indonesia tunggal kolektif 'dirimu' selaras dengan sapaan 'kamu' kepada Israel sebagai umat.
- source_word: עֵגֶל מַסֵּכָה
  choice: patung anak sapi dari logam tuangan
  rationale: עֵגֶל menunjuk anak sapi, sementara מַסֵּכָה menunjuk benda atau patung yang dibuat dengan menuang logam cair. Rumusan ini menjelaskan baik wujud maupun bahannya secara alami.
- source_word: סַרְתֶּם מַהֵר מִן־הַדֶּרֶךְ
  choice: Begitu cepat kamu menyimpang dari jalan
  rationale: סור mempertahankan metafora berpaling atau menyimpang dari jalan, dan מַהֵר diberi tekanan alami melalui 'begitu cepat'.
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶתְכֶם
  choice: yang telah Yahweh perintahkan kepadamu
  rationale: Klausa relatif memodifikasi 'jalan'. Bentuk 'telah ... perintahkan' sesuai dengan penuturan retrospektif dan tetap dekat dengan sintaksis sumber.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama diri. 'Yahweh' mempertahankan fungsi tersebut tanpa menggantinya dengan gelar.
- issue: Objek עֵגֶל מַסֵּכָה sebagai patung berhala
  choice: patung anak sapi dari logam tuangan
  alternative: anak sapi tuangan
  rationale: Kata מַסֵּכָה dapat menunjuk benda hasil pengecoran dan dalam konteks ini jelas merupakan patung. Penambahan 'patung' menyampaikan referennya tanpa memasukkan penilaian teologis yang tidak dinyatakan langsung dalam frasa.
translation_notes:
  register: Bahasa Indonesia modern, khidmat, dan mudah dipahami. 'Tampaklah' mempertahankan fungsi penarik perhatian dari הִנֵּה tanpa memakai ungkapan yang terlalu arkais. Sapaan 'kamu' dipertahankan sebagai bentuk yang dapat menunjuk Israel secara kolektif; 'Allahmu' dan 'dirimu' mengikuti fungsi kolektif itu.
