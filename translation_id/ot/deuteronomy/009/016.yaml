  - severity: low
    issue: '"bagi dirimu" memakai bentuk tunggal untuk לָכֶם yang berbentuk jamak.'
    rationale: Walaupun "kamu" dapat dipakai secara kolektif, "bagi diri kalian" secara eksplisit mencerminkan orang kedua jamak dan lebih lancar di sini.
  - severity: low
