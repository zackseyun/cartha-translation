  source_fidelity: 'Secara umum draf setia kepada teks Ibrani: bentuk retrospektif "telah", nama ilahi "Yahweh", dosa terhadap Yahweh, pembuatan anak sapi cor, dan penyimpangan cepat dari jalan perintah semuanya terwakili. Namun, "tampaklah" tidak secara alami menyampaikan הִנֵּה dalam konstruksi orang pertama ini.'
  naturalness: '"Aku melihat, dan tampaklah" terasa janggal dalam Bahasa Indonesia modern, karena "tampaklah" biasanya memerlukan hal yang tampak atau berfungsi sebagai seruan. Penggunaan "kamu" secara kolektif dapat diterima, tetapi "bagi dirimu" kurang selaras dengan bentuk jamak Ibrani dan kurang alami dalam kalimat ini. Bentuk "kalian" membuat rujukan jamak dan sintaksis lebih jelas.'
  terminology: '"Yahweh" tepat dan konsisten dengan keputusan proyek. "Patung anak sapi dari logam tuangan" setia, tetapi "patung anak sapi hasil tuangan" lebih idiomatis tanpa kehilangan nuansa מַסֵּכָה. Catatan kaki tetap mempertahankan alternatif leksikal yang relevan.'
