  source_fidelity: 'Secara umum setia pada struktur dan makna Ibrani, termasuk dua dasar yang dinyatakan: kefasikan bangsa-bangsa itu dan peneguhan perkataan yang Yahweh sumpahkan. Namun, לַאֲבֹתֶיךָ secara eksplisit berarti “kepada bapa-bapamu,” dan pembatasan itu penting karena tokoh-tokohnya langsung disebutkan.'
  naturalness: Bahasanya baku dan mengalir. “Memasuki negeri mereka untuk memilikinya” lebih jelas dan alami daripada “masuk untuk memiliki negeri mereka.” “Kelurusan hatimu” lebih dekat dengan יֹשֶׁר לְבָבְךָ daripada “ketulusan hatimu,” yang terutama dapat berarti kesungguhan atau ketidakterpura-puraan.
  terminology: “Yahweh,” “Allahmu,” “kefasikan,” dan “firman” sesuai register dan konteks. “Bapa-bapamu” dipertahankan untuk mencerminkan istilah Ibrani yang maskulin dan daftar para bapa leluhur yang menyusul.
