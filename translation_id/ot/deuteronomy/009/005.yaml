  text: לֹ֣א בְ/צִדְקָתְ/ךָ֗ וּ/בְ/יֹ֨שֶׁר֙ לְבָ֣בְ/ךָ֔ אַתָּ֥ה בָ֖א לָ/רֶ֣שֶׁת אֶת אַרְצָ֑/ם כִּ֞י בְּ/רִשְׁעַ֣ת הַ/גּוֹיִ֣ם הָ/אֵ֗לֶּה יְהוָ֤ה אֱלֹהֶ֨י/ךָ֙ מוֹרִישָׁ֣/ם מִ/פָּנֶ֔י/ךָ וּ/לְמַ֜עַן הָקִ֣ים אֶת הַ/דָּבָ֗ר אֲשֶׁ֨ר נִשְׁבַּ֤ע יְהוָה֙ לַ/אֲבֹתֶ֔י/ךָ לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹֽב־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/005.yaml
  text: It is not because of your righteousness or the uprightness of your heart that you are going in to possess their land[a], but because of the wickedness of these nations Yahweh your God is driving them out before you, and in order to confirm the word that Yahweh swore to your fathers, to Abraham, to Isaac[c][b], and to Jacob.
translation:
  language: id
  text: Bukan karena kebenaranmu atau kelurusan hatimu engkau memasuki negeri mereka untuk memilikinya, melainkan karena kefasikan bangsa-bangsa ini Yahweh, Allahmu, menghalau mereka dari hadapanmu, dan untuk meneguhkan firman yang telah Yahweh ikrarkan dengan sumpah kepada bapa-bapamu—kepada Abraham, Ishak, dan Yakub.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “membuat mereka kehilangan negeri itu dari hadapanmu.” Kata kerja Ibrani dapat menekankan bahwa bangsa-bangsa itu dibuat kehilangan kepemilikan atas negeri tersebut, bukan hanya dihalau.'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְצִדְקָתְךָ
  choice: karena kebenaranmu
  rationale: Prefiks בְּ dalam klausa negatif ini paling wajar dipahami secara kausal; צְדָקָה menunjuk pada kebenaran moral atau keadaan benar.
- source_word: וּבְיֹשֶׁר לְבָבְךָ
  choice: atau ketulusan hatimu
  rationale: יֹשֶׁר secara harfiah menyatakan kelurusan; bersama לֵבָב ungkapan ini menunjuk pada integritas batin. 'Ketulusan hati' alami dalam bahasa Indonesia tanpa menghilangkan dimensi moralnya.
- source_word: בָא לָרֶשֶׁת
  choice: masuk untuk memiliki
  rationale: בוא menyatakan masuk ke negeri itu, sedangkan infinitif לָרֶשֶׁת menyatakan tujuan, yakni mengambil dan memegang negeri tersebut sebagai milik.
- source_word: אַרְצָם
  choice: negeri mereka
  rationale: אֶרֶץ dalam konteks bangsa dan wilayah paling alami diterjemahkan 'negeri', sambil tetap menunjuk pada tanah yang mereka duduki.
- source_word: בְרִשְׁעַת
  choice: karena kefasikan
  rationale: רִשְׁעָה menyatakan kejahatan atau kefasikan yang bersifat moral, dan prefiks בְּ di sini bersifat kausal sejajar dengan klausa sebelumnya.
- source_word: הַגּוֹיִם הָאֵלֶּה
  choice: bangsa-bangsa ini
  rationale: גּוֹיִם dalam konteks ini menunjuk pada kelompok-kelompok bangsa yang mendiami negeri itu.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi diterjemahkan sebagai nama diri, bukan diganti dengan gelar.
- source_word: מוֹרִישָׁם מִפָּנֶיךָ
  choice: menghalau mereka dari hadapanmu
  rationale: Bentuk Hifil dari ירשׁ dapat menyatakan membuat kehilangan milik atau mengusir. 'Menghalau' menyampaikan penyingkiran mereka dari negeri secara alami, sementara alternatif leksikal dicatat dalam catatan kaki.
- source_word: וּלְמַעַן הָקִים
  choice: dan untuk meneguhkan
  rationale: לְמַעַן menyatakan tujuan, dan הֵקִים dengan דָּבָר dalam konteks sumpah berarti menegakkan, mengukuhkan, atau meneguhkan perkataan yang dijanjikan.
- source_word: הַדָּבָר אֲשֶׁר נִשְׁבַּע
  choice: firman yang telah ... ikrarkan dengan sumpah
  rationale: דָּבָר tetap direpresentasikan sebagai 'firman', sementara נִשְׁבַּע diterjemahkan eksplisit sebagai tindakan mengikrarkan dengan sumpah agar hubungan sintaksis dan konteks janji jelas.
- source_word: לַאֲבֹתֶיךָ
  choice: kepada nenek moyangmu
  rationale: Walaupun bentuk Ibrani maskulin, tokoh-tokoh yang dimaksud segera disebutkan satu per satu. 'Nenek moyangmu' merupakan sebutan Indonesia yang alami bagi para leluhur laki-laki tersebut.
theological_decisions:
- issue: Dasar Israel memiliki negeri itu
  choice: 'Mempertahankan dua alasan yang dinyatakan ayat: kefasikan bangsa-bangsa itu dan kesetiaan Yahweh pada firman yang diikrarkan-Nya kepada para leluhur.'
  alternative: Menonjolkan hanya kefasikan bangsa-bangsa atau hanya janji perjanjian.
  rationale: Teks Ibrani secara eksplisit memuat klausa כִּי dan וּלְמַעַן. Keduanya dipertahankan tanpa meleburkan atau mempertentangkannya.
- issue: Nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehova
  rationale: Teks memakai Tetragramaton sebagai nama diri; 'Yahweh' mempertahankan fungsi nama tersebut.
- issue: Makna הַדָּבָר dalam konteks sumpah
  choice: firman
  alternative: janji
  rationale: '''Firman'' lebih dekat dengan דָּבָר, sedangkan konteks ikrar bersumpah tetap memperlihatkan bahwa firman itu bersifat janji.'
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada bermartabat dan struktur yang tetap dekat dengan susunan alasan dalam teks Ibrani. 'Kefasikan' dipilih untuk bobot moral רִשְׁעָה; 'ketulusan hati' dipakai sebagai ungkapan alami bagi kelurusan batin. Tanda pisah sebelum daftar nama memperjelas bahwa Abraham, Ishak, dan Yakub adalah nenek moyang yang dimaksud.
