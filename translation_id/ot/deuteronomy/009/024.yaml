  text: מַמְרִ֥ים הֱיִיתֶ֖ם עִם יְהוָ֑ה מִ/יּ֖וֹם דַּעְתִּ֥/י אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/024.yaml
  text: You have been rebellious against Yahweh from the day I knew you[a].
translation:
  language: id
  text: Kalian telah memberontak terhadap Yahweh[a] sejak hari aku mengenal kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Secara harfiah: “bersama Yahweh”; dalam ungkapan ini, frasa tersebut menyatakan perlawanan kepada-Nya.'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַמְרִים
  choice: memberontak
  rationale: Berasal dari akar מרה yang menyatakan perlawanan atau pembangkangan terhadap wewenang. Bentuk ini bersama הֱיִיתֶם menggambarkan sikap Israel yang terus berlangsung; verba Indonesia “memberontak” menyampaikan maknanya secara alami.
- source_word: הֱיִיתֶם
  choice: telah
  rationale: Bentuk perfek orang kedua jamak dari היה merangkum keadaan atau perilaku Israel sejak masa lampau sampai saat Musa berbicara. “Telah memberontak” mempertahankan daya retrospektif itu.
- source_word: עִם
  choice: terhadap
  rationale: Secara harfiah berarti “dengan” atau “bersama”, tetapi dalam konstruksi dengan מרה menunjukkan pihak yang dilawan. “Terhadap” alami dalam bahasa Indonesia, sementara bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai “Yahweh”, bukan diganti dengan gelar, sehingga nama perjanjian dalam teks sumber tetap tampak.
- source_word: מִיּוֹם
  choice: sejak hari
  rationale: Ungkapan temporal ini menandai titik awal berlangsungnya tuduhan. “Sejak hari” dekat dengan bentuk Ibrani dan wajar dalam bahasa Indonesia.
- source_word: דַּעְתִּי אֶתְכֶם
  choice: aku mengenal kalian
  rationale: ידע di sini menunjuk pada pengenalan Musa akan bangsa Israel sejak awal hubungannya dengan mereka, bukan sekadar pengetahuan intelektual. Bentuk orang kedua jamak diterjemahkan “kalian”.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehovah
  rationale: Teks menggunakan Tetragramaton secara langsung. “Yahweh” mempertahankan nama pribadi ilahi tanpa menggantinya dengan sebuah gelar.
- issue: Relasi yang dinyatakan oleh עִם setelah מרה
  choice: terhadap Yahweh
  alternative: bersama Yahweh
  rationale: Walaupun preposisinya secara harfiah berarti “dengan/bersama”, konteks pemberontakan menunjukkan relasi permusuhan. Terjemahan utama menyampaikan fungsi idiomatisnya, dan catatan kaki mempertahankan bentuk sumber yang tidak biasa.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan langsung. “Kalian” dipakai untuk memperlihatkan bahwa sapaan Ibrani berbentuk jamak; susunan kalimat tetap dekat dengan teks sumber tanpa terdengar kaku.
