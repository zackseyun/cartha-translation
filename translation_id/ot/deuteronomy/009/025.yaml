  text: וָֽ/אֶתְנַפַּ֞ל לִ/פְנֵ֣י יְהוָ֗ה אֵ֣ת אַרְבָּעִ֥ים הַ/יּ֛וֹם וְ/אֶת אַרְבָּעִ֥ים הַ/לַּ֖יְלָה אֲשֶׁ֣ר הִתְנַפָּ֑לְתִּי כִּֽי אָמַ֥ר יְהוָ֖ה לְ/הַשְׁמִ֥יד אֶתְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/025.yaml
  text: So I fell down before Yahweh for forty days and forty nights[a], because Yahweh had said he would destroy you.
translation:
  language: id
  text: Maka aku bersujud di hadapan Yahweh selama empat puluh hari dan empat puluh malam[a], sebab Yahweh telah berfirman bahwa Ia akan memusnahkan kalian.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dapat juga diterjemahkan, “aku merebahkan diri di hadapan Yahweh selama empat puluh hari dan empat puluh malam.” Kata kerja Ibrani dapat menekankan tindakan menjatuhkan diri dalam permohonan syafaat.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְנַפַּל
  choice: Maka aku bersujud
  rationale: Bentuk hitpael dari נפל di sini menggambarkan Musa menjatuhkan diri atau merebahkan diri dalam permohonan syafaat. 'Bersujud' menyampaikan postur merendahkan diri secara alami dalam bahasa Indonesia; nuansa harfiahnya dijelaskan dalam catatan kaki.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי menyatakan keberadaan di depan atau di hadapan seseorang, sedangkan nama ilahi יהוה dipertahankan sebagai 'Yahweh'.
- source_word: אֵת אַרְבָּעִים הַיּוֹם וְאֶת אַרְבָּעִים הַלַּיְלָה אֲשֶׁר הִתְנַפָּלְתִּי
  choice: selama empat puluh hari dan empat puluh malam
  rationale: Frasa akusatif menyatakan lamanya waktu. Klausa relatif Ibrani mengulang tindakan bersujud selama rentang yang sama; dalam bahasa Indonesia, pengulangan itu terasa janggal dan maknanya sudah tercakup oleh 'selama', tanpa menghilangkan durasi.
- source_word: כִּי
  choice: sebab
  rationale: Konjungsi ini memperkenalkan alasan Musa bersujud; 'sebab' sesuai dengan ragam naratif yang dignified dan tetap mudah dipahami.
- source_word: אָמַר יְהוָה
  choice: Yahweh telah berfirman
  rationale: Tindakan berfirman mendahului tindakan Musa dalam alur kisah. 'Telah' memperjelas hubungan waktu tersebut, dan 'berfirman' merupakan padanan Indonesia yang wajar ketika subjeknya Allah.
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: bahwa Ia akan memusnahkan kalian
  rationale: Infinitif berawalan ל setelah אָמַר menyatakan tindakan yang telah dinyatakan atau dimaksudkan. 'Memusnahkan' mencerminkan bentuk kausatif השמיד tanpa harus menyiratkan rincian di luar teks; 'kalian' mempertahankan orang kedua jamak.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. Transliterasi 'Yahweh' mempertahankan nama itu dan mengikuti lapisan konsultasi yang telah diselaraskan.
- issue: Sifat pernyataan tentang pemusnahan Israel
  choice: telah berfirman bahwa Ia akan memusnahkan kalian
  alternative: telah bermaksud memusnahkan kalian
  rationale: Konstruksi אָמַר ... לְהַשְׁמִיד menyampaikan apa yang Yahweh nyatakan akan dilakukan. Terjemahan tidak menambahkan penilaian mengenai apakah pernyataan itu bersyarat, dapat berubah melalui syafaat, atau merupakan ketetapan final.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat tetapi mudah dipahami. 'Aku' mengikuti ujaran langsung Musa, 'kalian' mempertahankan bentuk jamak, dan 'bersujud' dipilih sebagai ungkapan alami untuk postur merendahkan diri di hadapan Allah.
