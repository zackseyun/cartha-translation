  source_fidelity: 'Terjemahan menyampaikan unsur utama Ibrani dengan setia: tindakan Musa merendahkan diri di hadapan Yahweh, durasi empat puluh hari dan empat puluh malam, alasan tindakannya, serta ancaman terhadap pendengar jamak. Klausa relatif yang mengulang tindakan selama periode tersebut terserap secara idiomatis dalam frasa "selama"; informasi waktunya tetap terwakili. "Memusnahkan" merupakan padanan yang layak untuk הַשְׁמִיד dalam konteks ini.'
