base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/014.yaml
  text: Leave me alone[a], so that I may destroy them and blot out their name from under the heavens[b]; and I will make you into a nation mightier and more numerous than they are.
translation:
  language: id
  text: Biarkanlah Aku[a], supaya Aku memusnahkan mereka dan menghapus nama mereka dari bawah langit[b]; dan Aku akan menjadikan engkau bangsa yang lebih kuat dan lebih besar jumlahnya daripada mereka.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Atau: “Jangan halangi Aku, maka Aku akan memusnahkan mereka dan menghapus nama mereka dari bawah langit.”'
    reason: lexical_alternative
  - marker: b
    text: Secara harfiah, “dari bawah langit”; ungkapan ini menunjuk pada pelenyapan mereka dari bumi serta dari ingatan manusia.
    reason: cultural_note
lexical_decisions:
- source_word: הֶרֶף מִמֶּנִּי
  choice: Biarkanlah Aku
  rationale: Imperatif רפה dengan מִן dan pronomina merupakan ungkapan untuk berhenti menahan atau tidak menghalangi. 'Biarkanlah Aku' alami dalam bahasa Indonesia dan tidak menambahkan objek yang tidak tersurat.
- source_word: וְאַשְׁמִידֵם
  choice: supaya Aku memusnahkan mereka
  rationale: שׁמד menyatakan penghancuran atau pemusnahan. Hubungan sesudah imperatif dapat dipahami sebagai tujuan/hasil; 'supaya' mempertahankan alur itu tanpa melunakkan ancaman.
- source_word: וְאֶמְחֶה אֶת־שְׁמָם
  choice: dan menghapus nama mereka
  rationale: מחה dalam ungkapan ini berarti menghapus nama, yakni melenyapkan keberadaan dan ingatan tentang mereka. 'Menghapus nama' merupakan padanan Indonesia yang jelas dan tetap dekat dengan citra sumber.
- source_word: מִתַּחַת הַשָּׁמַיִם
  choice: dari bawah langit
  rationale: Walaupun bentuk Ibraninya jamak, bahasa Indonesia lazim memakai 'langit' sebagai nomina kolektif. Catatan kaki mempertahankan informasi bentuk harfiahnya.
- source_word: וְאֶעֱשֶׂה אֹתְךָ לְגוֹי
  choice: Aku akan menjadikan engkau bangsa
  rationale: עשה + objek + ל menyatakan perubahan menjadi suatu keadaan atau identitas. 'Menjadikan engkau bangsa' ringkas, wajar, dan mempertahankan makna transformasional.
- source_word: עָצוּם וָרָב מִמֶּנּוּ
  choice: yang lebih kuat dan lebih besar jumlahnya daripada mereka
  rationale: עָצוּם menyatakan kekuatan, sedangkan רַב dalam konteks bangsa menunjuk besarnya jumlah. מִמֶּנּוּ berbentuk tunggal dan merujuk kepada Israel secara kolektif; 'mereka' merupakan rujukan alami dalam bahasa Indonesia.
theological_decisions:
- issue: Pernyataan hukuman ilahi dan janji menjadikan Musa suatu bangsa yang lebih besar
  choice: Pernyataan diterjemahkan secara langsung sebagai ancaman pemusnahan dan janji dalam alur narasi.
  alternative: Menandainya dalam terjemahan sebagai bahasa retoris atau sebagai ujian bagi Musa.
  rationale: Teks Ibrani tidak secara eksplisit menjelaskan ucapan ini sebagai retorika atau ujian. Terjemahan mempertahankan ketegangan teologisnya tanpa memasukkan penafsiran tertentu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Pronomina 'Aku' dan 'engkau' mempertahankan wibawa tuturan langsung serta membedakan pembicara dan lawan bicara dengan jelas. Istilah 'memusnahkan' mempertahankan kerasnya שׁמד, sedangkan 'lebih besar jumlahnya' menghindari ketaksaan kata 'besar'.
