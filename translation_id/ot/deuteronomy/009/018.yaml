  text: וָֽ/אֶתְנַפַּל֩ לִ/פְנֵ֨י יְהוָ֜ה כָּ/רִאשֹׁנָ֗ה אַרְבָּעִ֥ים יוֹם֙ וְ/אַרְבָּעִ֣ים לַ֔יְלָה לֶ֚חֶם לֹ֣א אָכַ֔לְתִּי וּ/מַ֖יִם לֹ֣א שָׁתִ֑יתִי עַ֤ל כָּל חַטַּאתְ/כֶם֙ אֲשֶׁ֣ר חֲטָאתֶ֔ם לַ/עֲשׂ֥וֹת הָ/רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה לְ/הַכְעִיסֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/018.yaml
  text: Then I fell down before Yahweh[a], as at the first, forty days and forty nights; I ate no bread and drank no water, because of all your sin that you had committed by doing what was evil in the sight of Yahweh, provoking him to anger.
translation:
  language: id
  text: Lalu aku tersungkur di hadapan Yahweh, seperti sebelumnya[a], selama empat puluh hari dan empat puluh malam. Aku tidak makan roti dan tidak minum air karena segala dosa kalian yang telah kalian lakukan dengan berbuat jahat di mata Yahweh untuk membangkitkan murka-Nya.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau "seperti pada pertama kalinya" atau "seperti dahulu." Frasa Ibrani ini menunjuk kembali kepada masa empat puluh hari Musa yang sebelumnya di hadapan Yahweh.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְנַפַּל
  choice: Lalu aku menjatuhkan diri
  rationale: Bentuk hitpael dari נפל menggambarkan Musa merendahkan tubuhnya di hadapan Allah dalam permohonan. Pilihan ini mempertahankan tindakan fisiknya tanpa menambahkan gagasan ibadah yang tidak dinyatakan secara eksplisit.
- source_word: לִפְנֵי יְהוָה
  choice: di hadapan Yahweh
  rationale: לִפְנֵי menyatakan kedudukan atau kehadiran, sedangkan nama perjanjian יְהוָה ditransliterasikan sebagai Yahweh.
- source_word: כָּרִאשֹׁנָה
  choice: seperti sebelumnya
  rationale: Frasa ini menunjuk kembali kepada masa empat puluh hari Musa yang terdahulu. Ungkapan ini alami dalam bahasa Indonesia sambil mempertahankan rujukan baliknya; alternatif yang lebih harfiah dicatat dalam catatan kaki.
- source_word: אַרְבָּעִים יוֹם וְאַרְבָּעִים לַיְלָה
  choice: empat puluh hari dan empat puluh malam
  rationale: Terjemahan langsung dan alami bagi keterangan jangka waktu tersebut.
- source_word: לֶחֶם לֹא אָכַלְתִּי וּמַיִם לֹא שָׁתִיתִי
  choice: Aku tidak makan roti dan tidak minum air
  rationale: Mempertahankan penyebutan roti dan air secara eksplisit, tanpa memperluas לֶחֶם menjadi semua jenis makanan.
- source_word: עַל כָּל חַטַּאתְכֶם
  choice: karena segala dosa ... kalian
  rationale: עַל menyatakan alasan tindakan Musa. Bentuk tunggal kolektif חַטַּאת dipertahankan secara wajar melalui 'segala dosa', dan akhiran orang kedua jamak dinyatakan dengan 'kalian'.
- source_word: אֲשֶׁר חֲטָאתֶם לַעֲשׂוֹת הָרַע
  choice: yang telah kalian perbuat dengan melakukan apa yang jahat
  rationale: Mengungkapkan dosa yang telah dilakukan serta cara atau isinya, yaitu melakukan hal yang dinilai jahat.
- source_word: בְּעֵינֵי יְהוָה
  choice: di mata Yahweh
  rationale: Mempertahankan metafora Ibrani yang lazim untuk penilaian ilahi dan tetap jelas dalam bahasa Indonesia.
- source_word: לְהַכְעִיסוֹ
  choice: sehingga membangkitkan murka-Nya
  rationale: Bentuk hifil menyatakan tindakan yang menyebabkan kemarahan. 'Sehingga' mempertahankan kemungkinan nuansa akibat tanpa menyatakan bahwa membangkitkan murka Allah pasti merupakan niat sadar umat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN; Yehova
  rationale: Teks Ibrani memakai nama ilahi secara langsung. 'Yahweh' mempertahankan nama perjanjian tanpa menggantinya dengan gelar.
- issue: Nuansa tujuan atau akibat dalam לְהַכְעִיסוֹ
  choice: sehingga membangkitkan murka-Nya
  alternative: untuk membangkitkan murka-Nya
  rationale: Infinitif berprefiks ל dapat bernuansa tujuan atau akibat. Pilihan 'sehingga' menghindari penetapan bahwa umat dengan sengaja bertujuan membuat Yahweh murka, tetapi tetap menyatakan akibat provokatif perbuatan mereka.
translation_notes:
  register: Bahasa Indonesia baku modern dengan nada naratif yang khidmat. 'Kalian' dipakai untuk menyatakan dengan jelas bahwa sapaan Ibrani berbentuk jamak. Penanda catatan kaki ditempatkan sesudah frasa yang benar-benar dijelaskannya.
