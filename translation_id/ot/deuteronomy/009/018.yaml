revisions:
- from: Lalu aku menjatuhkan diri di hadapan Yahweh seperti sebelumnya[a], selama empat puluh hari dan empat puluh malam. Aku tidak makan roti dan tidak minum air karena segala dosa yang telah kalian perbuat dengan melakukan apa yang jahat di mata Yahweh, sehingga membangkitkan murka-Nya.
  to: Lalu aku tersungkur di hadapan Yahweh, seperti sebelumnya[a], selama empat puluh hari dan empat puluh malam. Aku tidak makan roti dan tidak minum air karena segala dosa kalian yang telah kalian lakukan dengan berbuat jahat di mata Yahweh untuk membangkitkan murka-Nya.
  rationale: Revisi mengganti ungkapan postur dengan padanan Indonesia yang lebih idiomatis dan menyesuaikan penghubung terakhir agar lebih dekat dengan infinitif Ibrani. Catatan kaki tetap ditambatkan pada "seperti sebelumnya" dan secara memadai menjelaskan alternatif serta rujukan balik frasa tersebut.
