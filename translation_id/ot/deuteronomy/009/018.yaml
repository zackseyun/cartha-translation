review_pass:
  verdict: revise
  source_fidelity: Draf pada umumnya setia kepada teks Ibrani, termasuk durasi, roti dan air, serta sapaan jamak. Namun, "sehingga membangkitkan murka-Nya" mengubah infinitif לְהַכְעִיסוֹ menjadi akibat yang relatif tegas, sedangkan teks lebih langsung menyatakan tindakan yang memprovokasi Yahweh. Revisi memakai "untuk membangkitkan murka-Nya," yang mempertahankan bentuk infinitif dan keterkaitannya dengan tindakan jahat tanpa menambahkan rincian doktrinal.
  naturalness: '"Menjatuhkan diri" dapat dipahami secara jasmani, tetapi "tersungkur" lebih idiomatis dalam narasi khidmat Indonesia bagi tindakan merendahkan diri di hadapan Allah. Susunan kalimat juga diperhalus agar keterangan "seperti sebelumnya" dan durasi mudah dibaca.'
  terminology: '"Yahweh," "di hadapan Yahweh," "di mata Yahweh," serta "murka-Nya" sesuai dengan register baku dan mempertahankan nama ilahi serta idiom evaluatif Ibrani. "Berbuat jahat" merupakan padanan alami dan setia bagi melakukan yang jahat.'
  issues:
  - severity: medium
    issue: Nuansa לְהַכְעִיסוֹ diterjemahkan "sehingga membangkitkan murka-Nya."
    rationale: '"Sehingga" terutama menyatakan hasil. Infinitif berprefiks ל dalam konstruksi ini secara langsung menghubungkan perbuatan jahat dengan tindakan memprovokasi Yahweh; "untuk membangkitkan murka-Nya" lebih dekat pada bentuk sumber dan audit bahasa Inggris.'
  - severity: low
    issue: '"Menjatuhkan diri" kurang lazim dibandingkan "tersungkur" dalam konteks ini.'
    rationale: Keduanya mungkin, tetapi "tersungkur di hadapan" lebih alami dalam bahasa Indonesia baku dan tetap menyatakan postur fisik tanpa memperluasnya menjadi istilah liturgis tertentu.
  revised_text: Lalu aku tersungkur di hadapan Yahweh, seperti sebelumnya[a], selama empat puluh hari dan empat puluh malam. Aku tidak makan roti dan tidak minum air karena segala dosa kalian yang telah kalian lakukan dengan berbuat jahat di mata Yahweh untuk membangkitkan murka-Nya.
