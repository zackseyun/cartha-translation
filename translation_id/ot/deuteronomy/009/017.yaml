  yaml_path: translation/ot/deuteronomy/009/017.yaml
  text: So I took hold of the two tablets and threw them from my two hands and shattered them before your eyes[a].
translation:
  language: id
  text: Lalu aku memegang kedua loh itu, melemparkannya dari kedua tanganku, dan memecahkannya di depan mata kalian.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “menghancurkannya.” Kata kerja Ibrani ini pada dasarnya berarti “memecahkan,” sedangkan “menghancurkan” dapat menonjolkan akibat yang mungkin terjadi ketika loh-loh itu dilemparkan.
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶתְפֹּשׂ
  choice: aku memegang
  rationale: Kata תפשׂ menyatakan tindakan memegang atau menggenggam. “Memegang” alami dalam bahasa Indonesia dan tidak menambahkan kesan kekerasan yang tidak harus terkandung dalam kata sumber.
- source_word: בִּשְׁנֵי הַלֻּחֹת
  choice: kedua loh itu
  rationale: לֻחֹת berarti loh atau lempeng; konteks telah menunjukkan loh-loh perjanjian yang dimaksud. “Kedua loh itu” ringkas, jelas, dan tidak menambahkan bahan batu yang tidak disebut secara eksplisit dalam ayat ini.
- source_word: וָאַשְׁלִכֵם
  choice: melemparkannya
  rationale: Kata שלך berarti melemparkan. Pilihan ini merupakan padanan Indonesia modern yang langsung dan wajar.
- source_word: מֵעַל שְׁתֵּי יָדָי
  choice: dari kedua tanganku
  rationale: Frasa Ibrani secara harfiah menyebut “dari atas kedua tanganku.” Terjemahan ini mempertahankan penekanan pada dua tangan dengan ungkapan Indonesia yang alami.
- source_word: וָאֲשַׁבְּרֵם
  choice: memecahkannya
  rationale: Kata שׁבר berarti memecahkan atau menghancurkan. “Memecahkannya” mempertahankan arti dasarnya tanpa memastikan tingkat kehancuran yang tidak dinyatakan secara khusus oleh verba itu.
- source_word: לְעֵינֵיכֶם
  choice: di depan mata kalian
  rationale: Ungkapan ini berarti di hadapan atau dalam pandangan para pendengar. “Di depan mata kalian” mempertahankan gambaran konkret bahasa Ibrani dan mudah dipahami.
theological_decisions: []
translation_notes:
  register: Bahasa Indonesia standar modern dengan nada naratif yang lugas dan bermartabat. “Kalian” dipakai untuk mempertahankan bentuk jamak orang kedua dalam לְעֵינֵיכֶם, sedangkan “loh” mempertahankan istilah Alkitab yang sudah dikenal dan tepat bagi tablet perjanjian.
