  - severity: low
    issue: “Ada pada kedua tanganku” kurang idiomatis.
    rationale: Dalam bahasa Indonesia modern, “berada di kedua tanganku” lebih wajar untuk menyatakan loh yang dipegang atau ditopang, sementara catatan kaki mempertahankan bentuk harfiah “di atas kedua tanganku”.
  revised_text: Lalu aku berpaling dan turun dari gunung itu, dan gunung itu menyala dengan api, dan kedua loh perjanjian itu berada di kedua tanganku.[a]
