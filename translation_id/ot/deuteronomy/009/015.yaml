  text: So I turned and came down from the mountain[a], and the mountain was burning with fire[b], and the two tablets of the covenant were in my two hands.
translation:
  language: id
  text: Lalu aku berpaling dan turun dari gunung itu, dan gunung itu menyala dengan api, dan kedua loh perjanjian itu berada di kedua tanganku.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara lebih harfiah, “di atas kedua tanganku.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֵפֶן
  choice: Lalu aku berpaling
  rationale: Bentuk wayyiqtol melanjutkan urutan narasi; “lalu” menyatakan kesinambungan itu secara alami, sedangkan “berpaling” mempertahankan arti dasar פנה.
- source_word: וָאֵרֵד מִן הָהָר
  choice: dan turun dari gunung itu
  rationale: ירד berarti turun, dan הָהָר menunjuk pada gunung tertentu yang telah dikenal dalam konteks.
- source_word: וְהָהָר בֹּעֵר בָּאֵשׁ
  choice: sementara gunung itu menyala dengan api
  rationale: Klausa ini secara kontekstual menggambarkan keadaan yang berlangsung ketika Musa turun. “Menyala dengan api” mempertahankan penyebutan api secara eksplisit dalam bahasa Ibrani.
- source_word: וּשְׁנֵי לֻחֹת הַבְּרִית
  choice: dan kedua loh perjanjian itu
  rationale: לֻחֹת menunjuk pada loh batu dalam konteks ini, sedangkan הַבְּרִית secara langsung berarti “perjanjian.” Bentuk “kedua” alami dalam bahasa Indonesia dan tetap menyatakan jumlah dua.
- source_word: עַל שְׁתֵּי יָדָי
  choice: ada pada kedua tanganku
  rationale: “Pada” mencerminkan עַל lebih dekat daripada “di dalam,” sambil tetap dapat dipahami sebagai posisi loh yang sedang ditopang atau dibawa dengan kedua tangan.
theological_decisions:
- issue: Hubungan klausa tentang gunung yang menyala dengan tindakan Musa turun
  choice: sementara gunung itu menyala dengan api
  alternative: dan gunung itu menyala dengan api
  rationale: Konjungsi Ibrani memungkinkan koordinasi sederhana, tetapi konteks mendukung pembacaan sirkumstansial. Alternatif literal dicatat agar ambiguitas sintaksis tidak dihapus.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Loh” dipertahankan sebagai istilah Alkitab yang umum dan ringkas. Susunan kalimat mengikuti alur naratif Ibrani tanpa mengorbankan kelancaran bahasa Indonesia.
