  source_fidelity: Klausa וְהָהָר בֹּעֵר בָּאֵשׁ secara bentuk adalah koordinasi dengan “dan”. Walaupun dapat dipahami secara sirkumstansial dari konteks, “sementara” menetapkan hubungan temporal yang tidak dinyatakan secara eksplisit. Selebihnya, urutan tindakan, gunung tertentu, dua loh perjanjian, dan penegasan bahwa loh itu berada pada kedua tangan Musa tersampaikan dengan baik.
  naturalness: Bahasa draf umumnya baku dan jelas. Namun, “ada pada kedua tanganku” kurang lazim untuk benda yang sedang dipegang. “Berada di kedua tanganku” adalah ungkapan Indonesia modern yang lebih alami tanpa mengubah gambaran fisiknya.
  terminology: “Loh perjanjian” merupakan istilah Alkitab Indonesia yang mapan dan tepat untuk לֻחֹת הַבְּרִית. “Gunung itu,” “api,” dan “kedua tanganku” juga tepat. Catatan kaki harfiah tetap berguna untuk menjelaskan עַל, meski terjemahan utama memakai idiom Indonesia.
