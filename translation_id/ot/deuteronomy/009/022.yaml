base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/022.yaml
  text: And at Taberah[a], and at Massah, and at Kibroth-hattaavah, you kept provoking Yahweh to anger.
translation:
  language: id
  text: Di Tabera, di Masa, dan di Kibrot-Hataawa[a], kalian terus membuat Yahweh marah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Kibrot-Hataawa adalah nama tempat; secara harfiah berarti “kuburan nafsu” atau “kuburan keinginan.”
    reason: Menjelaskan bahwa Kibrot-Hataawa adalah nama tempat dan memberi arti harfiah unsur-unsur namanya.
lexical_decisions:
- source_word: וּ/בְ/תַבְעֵרָה
  choice: Di Tabera
  rationale: Preposisi בְּ menyatakan lokasi. Nama tempat ditransliterasikan dengan ejaan yang wajar dalam bahasa Indonesia.
- source_word: וּ/בְ/מַסָּה
  choice: di Masa
  rationale: Preposisi בְּ menyatakan lokasi, sedangkan nama tempat dipertahankan sebagai nama diri.
- source_word: וּ/בְ/קִבְרֹת הַתַּאֲוָה
  choice: dan di Kibrot-Hataawa[a]
  rationale: Ungkapan ini merupakan nama tempat tetap, sehingga ditransliterasikan. Makna unsur-unsurnya dijelaskan dalam catatan kaki.
- source_word: מַקְצִפִים הֱיִיתֶם
  choice: kalian terus membangkitkan murka
  rationale: Gabungan היה dengan partisipel Hifil menyatakan tindakan yang berlangsung atau berulang pada masa lampau. 'Terus membangkitkan murka' mempertahankan aspek tersebut sekaligus daya kausatif verba.
- source_word: אֶת יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh'; penanda objek langsung אֶת tidak diterjemahkan secara tersendiri.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN; Yehuwa
  rationale: Teks Ibrani memakai nama perjanjian יהוה secara langsung. Bentuk 'Yahweh' mempertahankan nama tersebut tanpa menggantinya dengan gelar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan lugas. Kata ganti 'kalian' menyatakan orang kedua jamak secara jelas. Pengulangan konjungsi Ibrani disederhanakan menjadi daftar alami dalam bahasa Indonesia tanpa mengubah hubungan antarlokasi.
