source:
  edition: WLC
  text: וְ/הֵ֥ם עַמְּ/ךָ֖ וְ/נַחֲלָתֶ֑/ךָ אֲשֶׁ֤ר הוֹצֵ֨אתָ֙ בְּ/כֹחֲ/ךָ֣ הַ/גָּדֹ֔ל וּ/בִֽ/זְרֹעֲ/ךָ֖ הַ/נְּטוּיָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/029.yaml
  text: But they are your people and your inheritance[b][a], whom you brought out by your great power and by your outstretched arm.
translation:
  language: id
  text: Namun, mereka adalah umat-Mu dan milik pusaka-Mu,[a] yang telah Engkau bawa keluar dengan kuasa-Mu yang besar dan dengan lengan-Mu yang teracung.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “Dan mereka adalah umat-Mu dan milik pusaka-Mu.” Kata penghubung Ibrani dapat berarti sekadar “dan”; “namun” menyatakan pertentangan yang mungkin dimaksud dalam permohonan Musa.
    reason: lexical_alternative
  - marker: b
    text: “Lengan yang teracung” merupakan ungkapan khas kisah keluaran yang menggambarkan kuasa TUHAN dalam membebaskan umat-Nya.
    reason: cross_reference
lexical_decisions:
- source_word: וְהֵם
  choice: Namun, mereka adalah
  rationale: Konjungsi וְ dapat berarti “dan”, tetapi dalam konteks permohonan Musa di ayat sebelumnya, “namun” secara alami menyatakan pertentangan yang tersirat tanpa melampaui makna Ibrani.
- source_word: עַמְּךָ
  choice: umat-Mu
  rationale: עַם menunjuk kepada suatu umat, khususnya dalam hubungan mereka dengan Allah; “umat-Mu” merupakan ungkapan Indonesia yang wajar dan sesuai konteks perjanjian.
- source_word: וְנַחֲלָתֶךָ
  choice: dan milik pusaka-Mu
  rationale: נַחֲלָה dapat berarti warisan, bagian milik, atau milik pusaka. “Milik pusaka-Mu” mempertahankan gagasan bahwa Israel adalah bagian milik Allah sekaligus menghindari kesan janggal bahwa Allah mewarisinya dari pihak lain.
- source_word: אֲשֶׁר הוֹצֵאתָ
  choice: yang telah Engkau bawa keluar
  rationale: Bentuk Hifil הוֹצֵאתָ merupakan ungkapan khas keluaran, yaitu menyebabkan atau membawa suatu umat keluar. “Yang” merujuk secara alami kepada umat tersebut.
- source_word: בְּכֹחֲךָ הַגָּדֹל
  choice: dengan kuasa-Mu yang besar
  rationale: בְּ bersifat instrumental, כֹּחַ berarti kekuatan atau kuasa, dan גָּדוֹל berarti besar. Susunan ini dekat dengan bentuk sumber sekaligus alami dalam bahasa Indonesia.
- source_word: וּבִזְרֹעֲךָ הַנְּטוּיָה
  choice: dan dengan lengan-Mu yang teracung
  rationale: Terjemahan ini mempertahankan metafora antropomorfis זְרוֹעַ dan arti partisip נְטוּיָה, yakni lengan yang direntangkan atau diacungkan untuk bertindak dengan kuasa.
theological_decisions:
- issue: Bahasa antropomorfis bagi tindakan Allah
  choice: Mempertahankan gambaran harfiah “lengan-Mu yang teracung”.
  alternative: Memparafrasakannya sebagai “tindakan-Mu yang perkasa” atau “kekuatan-Mu”.
  rationale: Bahasa Ibrani sengaja memakai gambaran tubuh yang khas dalam kisah keluaran. Mempertahankan metafora ini menjaga daya sastra dan teologis teks tanpa menyatakan bahwa Allah harus dipahami bertubuh secara harfiah.
- issue: Bahasa kepemilikan perjanjian dalam נַחֲלָה
  choice: Menerjemahkannya sebagai “milik pusaka-Mu”.
  alternative: “Warisan-Mu”, “pusaka-Mu”, atau “milik-Mu”.
  rationale: “Milik pusaka” mempertahankan nuansa bagian milik yang berharga dan tetap menyuarakan hubungan khusus Israel dengan Allah, tanpa menambahkan rincian doktrinal yang tidak dinyatakan ayat.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Kapital pada pronomina yang merujuk kepada Allah mengikuti kebiasaan penerbitan Alkitab bahasa Indonesia. Struktur paralel sumber dipertahankan, sementara “milik pusaka” dipilih agar idiom נַחֲלָה jelas bagi pembaca masa kini.
