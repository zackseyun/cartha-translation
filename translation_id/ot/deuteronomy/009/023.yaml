id: DEU.9.23
reference: Deuteronomy 9:23
language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וּ/בִ/שְׁלֹ֨חַ יְהוָ֜ה אֶתְ/כֶ֗ם מִ/קָּדֵ֤שׁ בַּרְנֵ֨עַ֙ לֵ/אמֹ֔ר עֲלוּ֙ וּ/רְשׁ֣וּ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לָ/כֶ֑ם וַ/תַּמְר֗וּ אֶת פִּ֤י יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם וְ/לֹ֤א הֶֽאֱמַנְתֶּם֙ ל֔/וֹ וְ/לֹ֥א שְׁמַעְתֶּ֖ם בְּ/קֹלֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/023.yaml
  text: And when Yahweh sent you from Kadesh-barnea[a], saying, 'Go up and take possession of the land that I have given you,' you rebelled against the command of Yahweh your God[c][b], and you did not believe him or listen to his voice.
translation:
  language: id
  text: Ketika Yahweh mengutus kamu dari Kadesh-Barnea dengan berfirman, “Naiklah dan ambillah negeri yang telah Kuberikan kepadamu menjadi milikmu,” kamu memberontak terhadap perintah Yahweh, Allahmu.[a] Kamu tidak percaya kepada-Nya[b] dan tidak mendengarkan suara-Nya.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “kamu memberontak terhadap mulut Yahweh, Allahmu”; “mulut” di sini merupakan ungkapan Ibrani untuk perintah atau perkataan-Nya.
    reason: lexical_alternative
  - marker: b
    text: Atau, “tidak memercayai Dia.”
    reason: lexical_alternative
  - marker: c
    text: Atau, “tidak menaati suara-Nya.”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁלֹחַ
  choice: Ketika ... mengutus
  rationale: Bentuk infinitif dengan ב memperkenalkan keadaan waktu. “Ketika ... mengutus” menyampaikan fungsi temporalnya secara alami; waw pembuka tidak perlu diterjemahkan secara mekanis sebagai “dan” dalam bahasa Indonesia.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi ditransliterasikan, bukan diganti dengan gelar, sehingga nama pribadi dalam teks sumber tetap tampak.
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: dari Kadesh-Barnea
  rationale: Nama tempat ditransliterasikan dalam bentuk yang jelas dan lazim dibaca dalam bahasa Indonesia.
- source_word: לֵאמֹר
  choice: dengan berfirman
  rationale: Bentuk ini memperkenalkan kutipan langsung. Karena subjeknya Yahweh, “berfirman” memberi ragam yang wajar dan bermartabat tanpa mengubah isi ujaran.
- source_word: עֲלוּ
  choice: Naiklah
  rationale: Terjemahan ini mempertahankan gambaran gerak naik dalam verba עלה dan cocok dengan perjalanan menuju wilayah perbukitan.
- source_word: וּרְשׁוּ
  choice: ambillah ... menjadi milikmu
  rationale: ירשׁ dalam konteks tanah menyatakan mengambil alih atau memperoleh kepemilikan. Ungkapan ini alami dalam bahasa Indonesia dan tetap menunjukkan tindakan memasuki serta menguasai negeri itu.
- source_word: הָאָרֶץ
  choice: negeri
  rationale: Dalam konteks ini kata tersebut menunjuk pada wilayah yang dijanjikan. “Negeri” lebih alami daripada “tanah” ketika yang dimaksud adalah suatu wilayah.
- source_word: אֲשֶׁר נָתַתִּי לָכֶם
  choice: yang telah Kuberikan kepadamu
  rationale: Bentuk perfektif menggambarkan pemberian sebagai sesuatu yang sudah ditetapkan. “Telah Kuberikan” mempertahankan aspek itu tanpa memperluas maknanya.
- source_word: וַתַּמְרוּ
  choice: kamu memberontak
  rationale: מרה menyatakan pembangkangan terhadap otoritas; “memberontak” menyampaikan kekuatannya secara langsung.
- source_word: אֶת־פִּי יְהוָה אֱלֹהֵיכֶם
  choice: terhadap perintah Yahweh, Allahmu
  rationale: Secara harfiah frasa ini memakai “mulut”, tetapi dalam konteksnya merupakan idiom bagi perkataan atau perintah yang berotoritas. Terjemahan utama menyampaikan makna idiomatis, sedangkan bentuk harfiahnya dicatat dalam catatan kaki.
- source_word: וְלֹא הֶאֱמַנְתֶּם לוֹ
  choice: Kamu tidak percaya kepada-Nya
  rationale: Hifil אמן dapat menyatakan percaya atau menaruh kepercayaan. “Percaya kepada-Nya” mempertahankan cakupan makna itu; nuansa “memercayai” dicatat sebagai alternatif.
- source_word: וְלֹא שְׁמַעְתֶּם בְּקֹלוֹ
  choice: dan tidak mendengarkan suara-Nya
  rationale: Ungkapan שׁמע בקול dapat berarti mendengarkan dengan implikasi menaati. Terjemahan mempertahankan citra “suara” dan membiarkan implikasi ketaatan tetap hadir; alternatif eksplisit dicatat dalam catatan kaki.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks Ibrani memakai Tetragramaton sebagai nama pribadi. Transliterasi “Yahweh” mempertahankan nama itu dan tidak menggantinya dengan gelar.
- issue: Daya perfektif נָתַתִּי dalam janji mengenai negeri
  choice: yang telah Kuberikan kepadamu
  alternative: yang Kuberikan kepadamu
  rationale: Pilihan ini menggambarkan pemberian itu sebagai tindakan yang telah ditetapkan atau dipandang tuntas, tanpa menentukan suatu sistem teologis mengenai waktu penggenapannya.
- issue: Hubungan percaya dan taat dalam dua klausa penutup
  choice: tidak percaya ... dan tidak mendengarkan
  alternative: tidak memercayai ... dan tidak menaati
  rationale: Terjemahan utama mempertahankan perbedaan bentuk dan metafora kedua ungkapan Ibrani, sambil mencatat bahwa keduanya dapat mengandung nuansa kepercayaan dan ketaatan.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. “Kamu” dipertahankan sebagai sapaan kolektif kepada Israel; bahasa Indonesia tidak membedakan bentuk tunggal dan jamak pada verba maupun imperatif. Huruf kapital pada bentuk pronominal ilahi mengikuti ragam penerbitan Alkitab Indonesia yang umum. Tanda baca membagi klausa panjang menjadi dua kalimat agar mudah dibaca tanpa mengubah hubungan koordinatif teks Ibrani.
