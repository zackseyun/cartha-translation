language:
  code: id
  name: Indonesian
  native_name: Bahasa Indonesia
  variant: modern standard Indonesian
source:
  edition: WLC
  text: וְ/יָדַעְתָּ֗ כִּ֠י לֹ֤א בְ/צִדְקָֽתְ/ךָ֙ יְהוָ֣ה אֱ֠לֹהֶי/ךָ נֹתֵ֨ן לְ/ךָ֜ אֶת הָ/אָ֧רֶץ הַ/טּוֹבָ֛ה הַ/זֹּ֖את לְ/רִשְׁתָּ֑/הּ כִּ֥י עַם קְשֵׁה עֹ֖רֶף אָֽתָּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/006.yaml
  text: So know that it is not because of your righteousness that Yahweh your God is giving you this good land to possess[a], for you are a stiff-necked people.
translation:
  language: id
  text: Maka ketahuilah bahwa TUHAN, Allahmu, memberikan kepadamu negeri yang baik ini untuk kamu miliki[a] bukan karena kebenaranmu, sebab kamu adalah bangsa yang tegar tengkuk.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau “untuk kamu warisi.” Kata kerja Ibrani ini dapat berarti menerima sebagai warisan, tetapi dalam kitab Ulangan sering juga mengandung arti mengambil dan menguasai negeri itu.
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָדַעְתָּ
  choice: Maka ketahuilah
  rationale: Bentuk perfek orang kedua tunggal dipakai secara nasihat atau perintah dalam konteks ini. Kata penghubungnya menyimpulkan uraian sebelumnya, sehingga 'Maka' menyampaikan hubungan inferensial secara alami.
- source_word: לֹא בְצִדְקָתְךָ
  choice: bukan karena kebenaranmu
  rationale: Preposisi ב menyatakan dasar atau alasan, bukan alat. Ungkapan ini menegaskan bahwa kebenaran Israel bukan alasan pemberian negeri itu.
- source_word: יְהוָה אֱלֹהֶיךָ
  choice: TUHAN, Allahmu
  rationale: Nama ilahi יהוה diterjemahkan dengan konvensi Alkitab bahasa Indonesia 'TUHAN', sedangkan sufiks orang kedua tunggal pada אֱלֹהִים dipertahankan dalam 'Allahmu'.
- source_word: נֹתֵן לְךָ
  choice: memberikan kepadamu
  rationale: Partisip menampilkan tindakan yang sedang berlangsung atau segera terjadi. Bentuk Indonesia ini tetap alami dan sesuai dengan konteks Israel yang akan memasuki negeri tersebut.
- source_word: הָאָרֶץ הַטּוֹבָה הַזֹּאת
  choice: negeri yang baik ini
  rationale: '''Negeri'' sesuai dengan konteks tanah perjanjian sebagai wilayah yang akan didiami, sementara susunan ini mempertahankan kata sifat dan penunjuk.'
- source_word: לְרִשְׁתָּהּ
  choice: untuk kamu miliki
  rationale: Kata ירשׁ dalam Ulangan kerap berarti memperoleh atau mengambil negeri itu menjadi milik. Pilihan ini ringkas dan alami, sambil memberi catatan tentang kemungkinan nuansa warisan.
- source_word: עַם קְשֵׁה עֹרֶף
  choice: bangsa yang tegar tengkuk
  rationale: Ungkapan ini mempertahankan metafora Ibrani tentang sikap keras kepala dan memberontak. 'Tegar tengkuk' memiliki gema alkitabiah namun tetap dapat dipahami dalam bahasa Indonesia.
theological_decisions:
- issue: Dasar Israel menerima negeri itu
  choice: Ayat ini menyangkal bahwa kebenaran Israel sendiri menjadi dasar TUHAN memberikan negeri itu.
  alternative: Menjadikannya hanya sebagai nasihat umum agar rendah hati.
  rationale: Teks Ibrani secara langsung mempertentangkan kebenaran Israel dengan tindakan Allah memberi dan dengan ketegaran tengkuk bangsa itu. Terjemahan mempertahankan ketegangan tersebut tanpa menambahkan sistem teologis di luar ayat.
- issue: Sapaan tunggal kolektif
  choice: Menggunakan bentuk tunggal kolektif melalui '-mu' dan 'kamu', lalu menyebut Israel sebagai satu 'bangsa'.
  alternative: Memperluasnya menjadi sapaan jamak seperti 'kalian'.
  rationale: Bahasa Ibrani menyapa Israel sebagai satu kesatuan dengan bentuk orang kedua tunggal. Bentuk 'kamu' dan '-mu' mempertahankan ciri tersebut secara wajar.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. 'TUHAN' mengikuti konvensi umum Indonesia untuk nama perjanjian יהוה. Metafora 'tegar tengkuk' dipertahankan karena penting secara leksikal dan teologis; catatan kaki menjelaskan ambiguitas ירשׁ tanpa membebani teks utama.
