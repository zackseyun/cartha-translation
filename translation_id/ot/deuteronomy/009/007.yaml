source:
  edition: WLC
  text: זְכֹר֙ אַל תִּשְׁכַּ֔ח אֵ֧ת אֲשֶׁר הִקְצַ֛פְתָּ אֶת יְהוָ֥ה אֱלֹהֶ֖י/ךָ בַּ/מִּדְבָּ֑ר לְ/מִן הַ/יּ֞וֹם אֲשֶׁר יָצָ֣אתָ מֵ/אֶ֣רֶץ מִצְרַ֗יִם עַד בֹּֽאֲ/כֶם֙ עַד הַ/מָּק֣וֹם הַ/זֶּ֔ה מַמְרִ֥ים הֱיִיתֶ֖ם עִם יְהוָֽה־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/007.yaml
  text: Remember—do not forget—how you provoked Yahweh your God to wrath in the wilderness[a]. From the day you came out of the land of Egypt until you came to this place[b], you have been rebellious against Yahweh.
translation:
  language: id
  text: Ingatlah—jangan lupa—bagaimana kamu membangkitkan murka Yahweh, Allahmu, di padang belantara.[a] Sejak hari kamu keluar dari tanah Mesir sampai kalian tiba di tempat ini, kalian terus memberontak terhadap Yahweh.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Atau, “bagaimana kamu membuat Yahweh, Allahmu, murka di padang belantara.”
    reason: Alternatif leksikal untuk bentuk kausatif הִקְצַפְתָּ.
  - marker: b
    text: Secara harfiah, “dengan Yahweh”; dalam konteks pemberontakan, maksudnya “terhadap Yahweh”.
    reason: Mempertahankan arti dasar preposisi עִם sekaligus menjelaskan daya adversatifnya dalam konteks.
lexical_decisions:
- source_word: זְכֹר אַל תִּשְׁכַּח
  choice: Ingatlah—jangan lupa—
  rationale: Mempertahankan kedua bentuk perintah Ibrani dan penekanannya, dengan ungkapan Indonesia yang alami.
- source_word: אֲשֶׁר הִקְצַפְתָּ
  choice: bagaimana kamu membangkitkan murka
  rationale: Bentuk Hifil dari קצף bersifat kausatif; frasa ini mempertahankan gagasan bahwa Israel menyebabkan Yahweh murka.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama ilahi yang terdapat langsung dalam teks sumber, bukan menggantinya dengan gelar.
- source_word: אֱלֹהֶיךָ
  choice: Allahmu
  rationale: Padanan alami untuk bentuk dengan sufiks orang kedua tunggal dalam ungkapan perjanjian.
- source_word: בַּמִּדְבָּר
  choice: di padang belantara
  rationale: Menggambarkan wilayah liar dalam tradisi keluaran tanpa membatasinya pada gurun pasir.
- source_word: לְמִן הַיּוֹם אֲשֶׁר יָצָאתָ
  choice: Sejak hari kamu keluar
  rationale: Menandai titik awal rentang waktu yang berlanjut hingga lokasi sekarang.
- source_word: עַד בֹּאֲכֶם עַד הַמָּקוֹם הַזֶּה
  choice: sampai kamu tiba di tempat ini
  rationale: Padanan Indonesia yang alami; perubahan dari tunggal ke jamak diperjelas pada klausa berikutnya agar tidak menghasilkan ungkapan kaku.
- source_word: מַמְרִים הֱיִיתֶם
  choice: kamu sekalian terus memberontak
  rationale: מרה menunjukkan pembangkangan terhadap otoritas, sedangkan 'terus' menyampaikan pola duratif selama rentang waktu tersebut; 'sekalian' menandai bentuk jamak.
- source_word: עִם יְהוָה
  choice: terhadap Yahweh
  rationale: Walaupun עִם secara dasar berarti 'dengan', sesudah verba pemberontakan relasinya bersifat adversatif; alternatif harfiahnya dicatat.
theological_decisions:
- issue: Penerjemahan nama ilahi יְהוָה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama perjanjian secara langsung; transliterasi mempertahankan statusnya sebagai nama pribadi tanpa memasukkan preferensi denominasi.
- issue: Daya temporal pemberontakan Israel
  choice: terus memberontak
  alternative: telah memberontak
  rationale: Konstruksi menggambarkan pola pembangkangan sepanjang masa dari keluaran hingga tempat itu. 'Terus' menyampaikan durasi tanpa menyatakan bahwa pola tersebut pasti berlanjut sesudah titik waktu ini.
- issue: Relasi dalam עִם יְהוָה
  choice: terhadap Yahweh
  alternative: dengan Yahweh
  rationale: Dalam konteks מרה, makna relasionalnya adversatif. Catatan kaki mempertahankan bentuk harfiah dan ketegangan leksikalnya.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan bermartabat. Bentuk tunggal 'kamu' pada bagian awal dan bentuk jamak 'kamu sekalian' pada bagian akhir mempertahankan peralihan jumlah dalam teks Ibrani tanpa mengorbankan kejelasan.
