source:
  edition: WLC
  text: כִּ֣י יָגֹ֗רְתִּי מִ/פְּנֵ֤י הָ/אַף֙ וְ/הַ֣/חֵמָ֔ה אֲשֶׁ֨ר קָצַ֧ף יְהוָ֛ה עֲלֵי/כֶ֖ם לְ/הַשְׁמִ֣יד אֶתְ/כֶ֑ם וַ/יִּשְׁמַ֤ע יְהוָה֙ אֵלַ֔/י גַּ֖ם בַּ/פַּ֥עַם הַ/הִֽוא׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/019.yaml
  text: For I was afraid because of the anger and the wrath with which Yahweh was angry against you[a], to destroy you[b]. But Yahweh listened to me also at that time.
translation:
  language: id
  text: Sebab aku takut akan amarah dan murka Yahweh terhadap kalian; Ia murka terhadap kalian untuk memusnahkan kalian. Namun, Yahweh mendengarkan aku juga pada waktu itu.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “mendengarkan aku”; dalam konteks ini ungkapan tersebut menyiratkan bahwa Yahweh menanggapi doa syafaat Musa dengan berkenan.
    reason: lexical_alternative
lexical_decisions:
- source_word: יָגֹרְתִּי
  choice: aku takut
  rationale: Bentuk Qal perfektum orang pertama tunggal menyatakan rasa takut atau gentar Musa; 'aku takut' alami dalam bahasa Indonesia dan mempertahankan daya emosionalnya.
- source_word: מִפְּנֵי
  choice: akan
  rationale: Dalam konstruksi 'takut akan', ungkapan ini secara alami menyatakan sebab atau objek ketakutan tanpa menerjemahkan idiom Ibrani secara harfiah.
- source_word: הָאַף וְהַחֵמָה
  choice: amarah dan murka
  rationale: Kedua kata menyatakan kemarahan yang hebat. Pasangan 'amarah dan murka' mempertahankan penumpukan istilah dalam bahasa sumber serta tetap wajar dan bermartabat.
- source_word: אֲשֶׁר קָצַף יְהוָה עֲלֵיכֶם
  choice: Yahweh, yang menyala terhadap kalian
  rationale: קצף menyatakan kemarahan yang kuat. 'Menyala terhadap kalian' mempertahankan intensitas dan relasi עֲלֵיכֶם tanpa pengulangan kaku 'amarah ... yang dengannya ... murka'.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Nama ilahi יהוה ditransliterasikan sebagai 'Yahweh', bukan diganti dengan gelar.
- source_word: לְהַשְׁמִיד אֶתְכֶם
  choice: sehingga Ia hendak memusnahkan kalian
  rationale: Infinitif ini berkaitan dengan kemarahan Yahweh dan menyatakan hasil atau maksud yang mengancam Israel. 'Memusnahkan' mempertahankan kekuatan שׁמד; 'hendak' menyampaikan orientasi maksud tanpa menyatakan bahwa pemusnahan itu benar-benar terjadi.
- source_word: וַיִּשְׁמַע יְהוָה אֵלַי
  choice: Namun ... Yahweh mendengarkan aku
  rationale: שׁמע dengan אֶל berarti mendengarkan, dan dalam konteks doa syafaat menyiratkan tanggapan yang berkenan. 'Namun' menandai pembalikan dari ancaman pemusnahan.
- source_word: גַּם בַּפַּעַם הַהִוא
  choice: pada waktu itu pun
  rationale: 'Susunan ini alami dalam bahasa Indonesia dan mempertahankan daya aditif גַּם: peristiwa tersebut merupakan satu kesempatan tambahan ketika Yahweh mendengarkan Musa.'
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN atau Yehuwa
  rationale: Teks memakai nama diri perjanjian יהוה. Bentuk 'Yahweh' mempertahankannya sebagai nama, bukan menggantinya dengan gelar.
- issue: Intensitas bahasa tentang kemarahan ilahi
  choice: amarah dan murka ... yang menyala terhadap kalian
  alternative: kemarahan besar Yahweh terhadap kalian
  rationale: Bahasa sumber menumpuk אַף, חֵמָה, dan קצף. Terjemahan mempertahankan intensitas dan sebagian pengulangannya tanpa meratakannya menjadi satu istilah umum.
- issue: Hubungan לְהַשְׁמִיד dengan klausa kemarahan
  choice: sehingga Ia hendak memusnahkan kalian
  alternative: untuk memusnahkan kalian
  rationale: Infinitif dapat dibaca sebagai maksud atau hasil dari kemarahan Yahweh. Rumusan terpilih menyampaikan ancaman yang diarahkan pada pemusnahan, tanpa memastikan secara berlebihan nuansa sintaksis yang tunggal.
- issue: Makna Yahweh 'mendengarkan' Musa
  choice: mendengarkan aku
  alternative: mengabulkan permohonanku
  rationale: Terjemahan mempertahankan ungkapan konkret bahasa Ibrani dan tidak mengganti implikasinya dengan penafsiran eksplisit bahwa doa itu dikabulkan; implikasi kontekstual dijelaskan dalam catatan kaki.
translation_notes:
  register: Bahasa Indonesia baku modern dengan ragam naratif yang bermartabat. 'Kalian' dipakai karena sapaan Ibrani berbentuk jamak. Struktur kalimat dibuat alami tanpa mengurangi pengulangan istilah kemarahan atau implikasi doa syafaat.
