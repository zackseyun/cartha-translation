revisions:
- from: Sebab aku takut akan amarah dan murka Yahweh, yang menyala terhadap kalian sehingga Ia hendak memusnahkan kalian. Namun, pada waktu itu pun Yahweh mendengarkan aku.[a]
  to: Sebab aku takut akan amarah dan murka Yahweh terhadap kalian; Ia murka terhadap kalian untuk memusnahkan kalian. Namun, Yahweh mendengarkan aku juga pada waktu itu.[a]
  rationale: Revisi menyatakan secara eksplisit bahwa Yahweh adalah subjek “murka” (קצף), sambil mempertahankan penumpukan istilah kemarahan dalam teks Ibrani. “Untuk memusnahkan” mengikuti fungsi infinitif לְהַשְׁמִיד tanpa memaksakan pembacaan akibat. Catatan kaki tetap ditempatkan pada “mendengarkan aku” dan tidak menambahkan klaim yang melampaui implikasi kontekstual.
