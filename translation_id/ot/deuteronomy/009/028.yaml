  source_fidelity: 'Frasa pembuka perlu menyatakan asal dengan jelas: Ibrani memiliki “negeri yang dari sana Engkau membawa kami keluar.” Draf “negeri tempat Engkau membawa kami keluar” dapat dipahami sebagai lokasi tindakan membawa keluar dan tidak secara tegas menyatakan “dari sana.” Selebihnya, terjemahan dengan tepat mempertahankan metonimia “negeri” sebagai subjek, tuduhan hipotetis tentang ketidakmampuan dan kebencian Yahweh, serta tujuan membawa keluar untuk membunuh mereka di padang belantara.'
