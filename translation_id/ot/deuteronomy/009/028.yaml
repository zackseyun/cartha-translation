  text: פֶּן יֹאמְר֗וּ הָ/אָרֶץ֮ אֲשֶׁ֣ר הוֹצֵאתָ֣/נוּ מִ/שָּׁם֒ מִ/בְּלִי֙ יְכֹ֣לֶת יְהוָ֔ה לַ/הֲבִיאָ֕/ם אֶל הָ/אָ֖רֶץ אֲשֶׁר דִּבֶּ֣ר לָ/הֶ֑ם וּ/מִ/שִּׂנְאָת֣/וֹ אוֹתָ֔/ם הוֹצִיאָ֖/ם לַ/הֲמִתָ֥/ם בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/deuteronomy/009/028.yaml
  text: Otherwise the land from which you brought us out will say[a], ‘Because Yahweh was not able to bring them into the land that he promised them, and because he hated them[b], he brought them out to put them to death in the wilderness.’
translation:
  language: id
  text: Kalau tidak, negeri yang dari sana Engkau membawa kami keluar akan berkata[a], ‘Karena Yahweh tidak sanggup membawa mereka ke negeri yang telah Dia janjikan kepada mereka[b], dan karena Dia membenci mereka, Dia membawa mereka keluar untuk membunuh mereka di padang belantara.’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Secara harfiah, “negeri yang dari sana Engkau membawa kami keluar”; “negeri” di sini mewakili penduduk negeri itu.
    reason: cultural_note
  - marker: b
    text: Secara lebih harfiah, “negeri yang tentangnya Dia telah berbicara kepada mereka.”
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: Kalau tidak
  rationale: Mengungkapkan akibat yang dikhawatirkan dalam konteks permohonan Musa dengan bahasa Indonesia yang alami.
- source_word: הָאָרֶץ אֲשֶׁר הוֹצֵאתָנוּ מִשָּׁם
  choice: negeri tempat Engkau membawa kami keluar
  rationale: Mempertahankan metonimia Ibrani yang secara harfiah menjadikan 'negeri' sebagai subjek yang berkata; catatan kaki menjelaskan bahwa yang dimaksud ialah penduduknya.
- source_word: מִבְּלִי יְכֹלֶת יְהוָה
  choice: Karena Yahweh tidak sanggup
  rationale: Menyampaikan tuduhan mengenai ketidakmampuan secara langsung tanpa menyiratkan bahwa narator membenarkan tuduhan tersebut.
- source_word: יְהוָה
  choice: Yahweh
  rationale: Mentransliterasikan nama perjanjian ilahi yang terdapat langsung dalam teks Ibrani.
- source_word: אֶל הָאָרֶץ אֲשֶׁר דִּבֶּר לָהֶם
  choice: ke negeri yang telah Dia janjikan kepada mereka
  rationale: Dalam konteks pemberian negeri, verba 'berbicara' menunjuk pada janji Yahweh; bentuk ini alami dalam bahasa Indonesia, sementara arti harfiahnya dicatat.
- source_word: וּמִשִּׂנְאָתוֹ אוֹתָם
  choice: dan karena Dia membenci mereka
  rationale: Preposisi menyatakan sebab, yakni motif kebencian yang secara keliru akan dituduhkan oleh bangsa lain.
- source_word: הוֹצִיאָם
  choice: Dia membawa mereka keluar
  rationale: Menjaga hubungan leksikal dengan tindakan membawa Israel keluar yang disebut sebelumnya.
- source_word: לַהֲמִתָם
  choice: untuk membunuh mereka
  rationale: Menyampaikan bentuk kausatif dari מות secara jelas dan wajar dalam bahasa Indonesia.
- source_word: בַּמִּדְבָּר
  choice: di padang belantara
  rationale: Istilah ini sesuai untuk kawasan liar dan tandus tempat pengembaraan Israel tanpa membatasi maknanya pada gurun pasir.
theological_decisions:
- issue: Penerjemahan nama ilahi יהוה
  choice: Yahweh
  alternative: TUHAN
  rationale: Teks memakai nama diri ilahi; bentuk 'Yahweh' mempertahankan nama tersebut dan tidak menggantinya dengan gelar.
- issue: Makna דִּבֶּר לָהֶם dalam konteks negeri
  choice: yang telah Dia janjikan kepada mereka
  alternative: yang telah Dia bicarakan kepada mereka
  rationale: Konteks perjanjian menunjukkan bahwa perkataan itu merupakan janji mengenai negeri. Catatan kaki mempertahankan bentuk yang lebih harfiah.
- issue: Status pernyataan bahwa Yahweh tidak sanggup dan membenci Israel
  choice: Dipertahankan sebagai ucapan yang dikhawatirkan akan dikatakan oleh penduduk negeri
  alternative: Melunakkan atau membantah tuduhan di dalam kutipan
  rationale: Teks menampilkan tuduhan hipotetis dari bangsa lain, bukan penilaian narator; terjemahan mempertahankan ketegangan retoris itu.
translation_notes:
  register: Bahasa Indonesia baku, modern, dan khidmat. Sapaan kepada Allah memakai huruf kapital. Struktur kutipan dan metonimia sumber dipertahankan, dengan penjelasan singkat dalam catatan kaki.
