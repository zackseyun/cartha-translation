review_pass:
  verdict: revise
  source_fidelity: Revisi diperlukan karena bagian terakhir dari ujaran batin dalam teks Ibrani (mulai dengan וּבְרִשְׁעַת, “sedangkan/karena kefasikan”) masih termasuk isi yang dilarang untuk dikatakan, bukan komentar narator di luar kutipan. Selain itu, מוֹרִישָׁם secara khusus menyatakan tindakan membuat mereka kehilangan milik/tempat, sehingga “mengusir” lebih tepat daripada mengulang “menghalau” (נדף) yang dipakai sebelumnya.
  naturalness: Bahasa draft pada umumnya baku dan jelas. Namun, “Sebaliknya” setelah tanda kutip mengganggu struktur ujaran tidak langsung/langsung dan mengubah cakupan sintaksis. Dengan menempatkan seluruh klaim dalam satu kutipan serta memakai “sedangkan,” kalimat tetap modern dan alami.
  terminology: “Yahweh,” “Allahmu,” “kebenaran,” dan “kefasikan” tepat dan mempertahankan register teologis teks. “Menduduki” dapat bernuansa pendudukan sementara dalam bahasa Indonesia modern; “memiliki” lebih netral dan sesuai dengan ירשׁ dalam konteks ini.
  issues:
  - severity: high
    issue: Klausa “karena kefasikan bangsa-bangsa ini ...” ditempatkan di luar kutipan.
    rationale: לֵאמֹר memperkenalkan seluruh isi ujaran batin yang berlanjut sampai akhir ayat. Menutup kutipan setelah “negeri ini” menjadikan klausa berikutnya komentar penerjemah/narator, bukan bagian dari pernyataan yang dilarang.
  - severity: medium
    issue: “Sebaliknya” terlalu eksplisit dan tidak mencerminkan waw secara netral.
    rationale: Waw dapat menyatakan kontras, tetapi “sedangkan” menyampaikan hubungan kontras tanpa menambahkan penanda korektif yang kuat dan tanpa mengeluarkan klausa dari ujaran batin.
  - severity: medium
    issue: “Menghalau” dipakai juga untuk מוֹרִישָׁם.
    rationale: Verba pertama adalah נדף, sedangkan מוֹרִישָׁם adalah Hifil ירשׁ, yaitu menyebabkan bangsa-bangsa itu kehilangan penguasaan atas negeri; “mengusir” lebih membedakan dan menangkap nuansa tersebut.
  revised_text: Jangan berkata dalam hatimu ketika Yahweh, Allahmu, menghalau mereka dari hadapanmu, dengan berkata, “Karena kebenaranku, Yahweh telah membawa aku masuk untuk memiliki negeri ini,” sedangkan karena kefasikan bangsa-bangsa ini Yahweh mengusir mereka dari hadapanmu.
