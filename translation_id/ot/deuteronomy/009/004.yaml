revisions:
- from: Jangan berkata dalam hatimu ketika Yahweh, Allahmu, menghalau mereka dari hadapanmu, ‘Karena kebenaranku, Yahweh telah membawa aku masuk untuk menduduki negeri ini.’ Sebaliknya, karena kefasikan bangsa-bangsa inilah Yahweh menghalau mereka dari hadapanmu.
  to: Jangan berkata dalam hatimu ketika Yahweh, Allahmu, menghalau mereka dari hadapanmu, dengan berkata, “Karena kebenaranku, Yahweh telah membawa aku masuk untuk memiliki negeri ini,” sedangkan karena kefasikan bangsa-bangsa ini Yahweh mengusir mereka dari hadapanmu.
  rationale: Revisi mempertahankan seluruh isi ujaran batin dalam satu konstruksi kutipan, memakai penghubung kontras yang wajar tanpa penambahan makna berlebihan, dan membedakan tindakan “menghalau” (נדף) dari “mengusir”/membuat kehilangan tempat (Hifil ירשׁ).
